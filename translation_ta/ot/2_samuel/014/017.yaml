base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/017.yaml
  text: Then your servant said[a], ‘Please let the word of my lord the king bring rest, for my lord the king is like the angel of God, to hear the good and the evil[b]. And may Yahweh your God be with you.’
translation:
  language: ta
  text: அப்போது உமது பணிப்பெண், “என் ஆண்டவராகிய அரசரின் வார்த்தை, தயவுசெய்து, நிம்மதியளிக்கட்டும். ஏனெனில், என் ஆண்டவராகிய அரசர் நன்மையையும் தீமையையும் கேட்டறிவதில்[b] கடவுளின் தூதரைப் போன்றவர்[a]. யாவே உமது கடவுள் உம்மோடு இருப்பாராக” என்று சொன்னாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடவுளின் தேவதூதரைப் போன்றவர்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் பொதுவாக “கடவுளின் செய்தியாளர்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “நன்மையையும் தீமையையும் கேட்பதில்”; இங்கு இது நல்லதையும் தீயதையும் பகுத்தறிவதையோ அவற்றுக்கிடையே தீர்ப்பளிப்பதையோ குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחָתְךָ
  choice: உமது பணிப்பெண்
  rationale: பெண்பால் பணியாளைக் குறிக்கும் எபிரெயச் சொல்லையும், அரசரிடம் தன்னைத் தாழ்த்திப் பேசும் அரண்மனை மரியாதை நடையையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: יִהְיֶה נָּא
  choice: … கொண்டுவருவதாக
  rationale: வேண்டுகோள் வலுவுடைய இச்சை வினையை இயல்பான தமிழ் வாழ்த்தியல்/வேண்டுதல் வடிவில் தருகிறது; சூழலிலுள்ள பணிவான தொனியும் தொடர்கிறது.
- source_word: דְּבַר אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசரின் வார்த்தை
  rationale: דבר என்பதன் ‘வார்த்தை’ என்ற அடிப்படை உருவகத்தைப் பாதுகாக்கிறது; இச்சூழலில் அது அரசரின் தீர்ப்பையும் குறிப்பால் உணர்த்துகிறது.
- source_word: לִמְנוּחָה
  choice: நிம்மதியைக் கொண்டுவருவதாக
  rationale: ‘ஓய்வு, அமைதி, நிம்மதி’ என்ற பொருள் வரம்பில், அரசரின் வார்த்தையால் கலக்கம் தீரும் சூழலுக்கு இயல்பான தமிழ் வடிவம்.
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: கடவுளின் தூதரைப் போன்றவர்
  rationale: מלאך என்பதிலுள்ள ‘தூதர்/தேவதூதர்’ என்ற உண்மையான சொற்பொருள் விரிவைத் தமிழில் ‘தூதர்’ மூலம் பாதுகாக்கிறது; தேவதூதர் என்ற வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לִשְׁמֹעַ הַטּוֹב וְהָרָע
  choice: நன்மையையும் தீமையையும் கேட்டறிவதில்
  rationale: שמע என்பதன் ‘கேள்’ கூறை ‘கேட்டறி’ என்பதில் காத்து, இங்கு நோக்கப்படும் நீதித்தீர்ப்பு சார்ந்த பகுத்தறிதலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיהוָה אֱלֹהֶיךָ
  choice: யாவே உமது கடவுள்
  rationale: திருப்பெயரான יהוה என்பதை ‘யாவே’ என்று ஒலிபெயர்த்து, இரண்டாம் நபர் உடைமைத் தொடர்பையும் பாதுகாக்கிறது.
- source_word: יְהִי עִמָּךְ
  choice: உம்மோடு இருப்பாராக
  rationale: ஆசீர்வாத அல்லது வாழ்த்துக் கருத்துடைய இச்சை வினையை மரியாதையான, இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் நேரடியாக இடம்பெறும் உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: מלאך என்பதன் பொருள்
  choice: தூதர்
  alternative: தேவதூதர்
  rationale: இச்சொல் மனிதத் தூதரையோ வானதூதரையோ குறிக்கக்கூடும். ஒப்புமையின் உயர்வான தொனி வானதூதர் வாசிப்பை ஆதரித்தாலும், ‘தூதர்’ என்பது மூலத்தின் சொற்பொருள் நெகிழ்வை முதன்மை உரையில் பாதுகாக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் உள்ளது.
- issue: ‘நன்மையையும் தீமையையும் கேட்பது’ என்ற சொற்றொடரின் நீதித்தீர்ப்பு சார்ந்த பொருள்
  choice: கேட்டறிவதில்
  alternative: நன்மையையும் தீமையையும் கேட்பதில்
  rationale: ‘கேட்பது’ என்ற மூல உருவகத்தை அழிக்காமல், நல்லதையும் தீயதையும் ஆராய்ந்து தீர்மானிக்கும் திறனைக் குறிக்கும் சூழல் பொருளையும் தமிழில் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரண்மனைச் சூழலுக்கேற்ற மரியாதை ஒருமை (‘உமது’, ‘உம்மோடு’) பயன்படுத்தப்பட்டுள்ளது. பேச்சாளரின் பெண்பாலும் தாழ்மையான சுயக்குறிப்பும் ‘பணிப்பெண்’ மற்றும் ‘சொன்னாள்’ மூலம் வெளிப்படுகின்றன. மொழிநடை கண்ணியமானதாக இருந்தாலும் பொதுவாசகருக்கு எளிதில் புரியுமாறு வைக்கப்பட்டுள்ளது.
