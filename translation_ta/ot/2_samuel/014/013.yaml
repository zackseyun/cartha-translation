base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/013.yaml
  text: Then the woman said[a], “Why then have you planned such a thing against the people of God? For in speaking this word, the king is like one who is guilty[b], because the king has not brought back his banished one.”
translation:
  language: ta
  text: அப்போது அந்தப் பெண், “அப்படியானால், கடவுளுடைய மக்களுக்கு எதிராக இத்தகைய காரியத்தை ஏன் திட்டமிட்டிருக்கிறீர்[a]? இந்த வார்த்தையைச் சொல்வதன் மூலம் அரசர் குற்றமுள்ள ஒருவரைப் போல் இருக்கிறார்[b]; ஏனெனில், தம்மிடமிருந்து நாடுகடத்தப்பட்டவரை அரசர் திரும்ப அழைத்து வரவில்லை” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளுடைய மக்களுக்கு எதிராக இத்தகைய காரியத்தை ஏன் எண்ணியிருக்கிறீர்?’ அல்லது ‘...ஏன் வகுத்திருக்கிறீர்?’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அரசர் குற்றமுள்ளவரைப் போன்றவராகிறார்’; அதாவது, தம்மிடமிருந்து நாடுகடத்தப்பட்டவரைத் திரும்ப அழைத்து வராததால், அரசருடைய சொந்தத் தீர்ப்பே அவர்மீது குற்றத்தைச் சுமத்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: חָשַׁבְתָּה
  choice: திட்டமிட்டிருக்கிறீர்
  rationale: இந்த வினைச்சொல் எண்ணுதல், திட்டமிடுதல், வகுத்தல் ஆகிய பொருள்களைத் தரலாம். தாவீதின் நீடித்த நடவடிக்கையைப் பெண் எதிர்கொள்ளும் இச்சூழலில், ‘திட்டமிட்டிருக்கிறீர்’ என்பது நோக்கமுள்ள செயற்பாட்டை இயல்பாக வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: עַל עַם אֱלֹהִים
  choice: கடவுளுடைய மக்களுக்கு எதிராக
  rationale: חשב என்பதுடன் வரும் עַל இச்சூழலில் பாதகமான அல்லது எதிரான நோக்கைக் குறிக்கிறது. எபிரெயச் சொல்லாட்சியில் உள்ள ‘கடவுளுடைய மக்கள்’ என்ற பரந்த குறிப்பைச் சுருக்காமல் வைத்திருக்கிறது.
- source_word: וּמִדַּבֵּר הַמֶּלֶךְ הַדָּבָר הַזֶּה
  choice: இந்த வார்த்தையைச் சொல்வதன் மூலம் அரசர்
  rationale: 'מִ prefixed infinitive construction இங்கு கருவி அல்லது சூழ்நிலைப் பொருளில் உள்ளது: அரசர் தாம் கூறிய தீர்ப்பின் மூலமே தம்மீது குற்றத்தை வரவழைக்கிறார். தமிழ் நடையில் இதை ‘சொல்வதன் மூலம்’ தெளிவாக வெளிப்படுத்துகிறது.'
- source_word: כְּאָשֵׁם
  choice: குற்றமுள்ள ஒருவரைப் போல் இருக்கிறார்
  rationale: כְּ ஒப்புமையைக் குறிப்பதால், அரசர் நேரடியாகக் குற்றவாளி என்று மட்டும் தீர்ப்பளிக்காமல், அவருடைய சொந்த வார்த்தை அவரைக் குற்றமுள்ள ஒருவரின் நிலையில் வைக்கிறது என்ற சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: לְבִלְתִּי הָשִׁיב
  choice: திரும்ப அழைத்து வரவில்லை
  rationale: שׁוב என்பதன் Hiphil வடிவம் ஒருவரைத் திரும்பக் கொண்டுவருதல் அல்லது மீட்டுக் கொண்டுவருதல் என்று பொருள்படும். நாடுகடத்தப்பட்ட நபரைப் பற்றிய சூழலில் ‘திரும்ப அழைத்து வரவில்லை’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: נִדְּחוֹ
  choice: நாடுகடத்தப்பட்ட தம்முடையவனை
  rationale: נדח என்பதன் செயப்பாட்டு வடிவமும் மூன்றாம் நபர் ஆண்பால் ஒருமை உரிமைப் பின்னொட்டும் காக்கப்படுகின்றன. ‘மகன்’ என்று வெளிப்படையாகச் சொல்லாமல், அப்சலோமைச் சுட்டும் சூழலையும் பெண்ணின் பொதுவான சொல்லாட்சியையும் ஒருங்கே பாதுகாக்கிறது.
theological_decisions:
- issue: ‘கடவுளுடைய மக்கள்’ என்பதன் வரம்பு
  choice: எபிரெய மூலத்திலுள்ள பரந்த உடன்படிக்கைச் சொல்லாட்சியை அப்படியே வைத்தல்
  alternative: ‘இஸ்ரவேலுக்கு எதிராக’ அல்லது ‘அப்சலோமுக்கும் அரச குடும்பத்திற்கும் எதிராக’ என்று குறிப்பாக்குதல்
  rationale: பெண்ணின் குற்றச்சாட்டு உடனடியாக அப்சலோமைப் பற்றியதாக இருந்தாலும், எபிரெய உரை அதன் விளைவை ‘கடவுளுடைய மக்கள்’ என்ற பரந்த அளவில் முன்வைக்கிறது. மொழிபெயர்ப்பு இந்த இறையியல் மற்றும் அரசியல் அழுத்தத்தைச் சுருக்கக்கூடாது.
- issue: அரசரின் குற்றநிலை
  choice: ‘குற்றமுள்ள ஒருவரைப் போல்’ என்ற ஒப்புமையைப் பாதுகாத்தல்
  alternative: ‘அரசர் குற்றவாளி’ என்று நேரடியாகத் தீர்மானித்தல்
  rationale: כְּ என்ற ஒப்புமை முன்னொட்டு, அரசருடைய சொந்த தீர்ப்பு அவரைக் குற்றமுள்ளவரின் நிலையில் வைக்கிறது என்ற மறைமுகமான வாதத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. அரசரைக் குறிக்கும் இடங்களில் ‘நீர்/தம்’ சார்ந்த மரியாதை அமைப்பு பேணப்பட்டுள்ளது. வாக்கியம் கண்ணியமான பேச்சு நடையிலும், பெண்ணின் நேரடியான கண்டன வலிமையையும் இழக்காத வகையிலும் அமைக்கப்பட்டுள்ளது.
