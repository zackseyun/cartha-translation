source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אַבְשָׁל֜וֹם אֶל יוֹאָ֗ב לִ/שְׁלֹ֤חַ אֹת/וֹ֙ אֶל הַ/מֶּ֔לֶךְ וְ/לֹ֥א אָבָ֖ה לָ/ב֣וֹא אֵלָ֑י/ו וַ/יִּשְׁלַ֥ח עוֹד֙ שֵׁנִ֔ית וְ/לֹ֥א אָבָ֖ה לָ/בֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/029.yaml
  text: So Absalom sent for Joab to send him to the king[a], but he was not willing to come to him. So he sent again a second time, but he was not willing to come.
translation:
  language: ta
  text: அப்சலோம், தன்னை அரசனிடம் அனுப்பிவைக்கும்படி யோவாபிடம் ஆள் அனுப்பினான்; ஆனால் யோவாப் அவனிடம் வர விரும்பவில்லை. அவன் மீண்டும் இரண்டாவது முறையாக ஆள் அனுப்பினான்; ஆனால் யோவாப் வர விரும்பவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח אַבְשָׁלוֹם אֶל יוֹאָב
  choice: அப்சலோம் யோவாபை அழைத்துவர ஆளனுப்பினான்
  rationale: שׁלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்பு.’ אֶל יוֹאָב மற்றும் தொடர்ந்து வரும் நோக்க வினையெச்சத்தின் சூழலில், யோவாபை வரவழைக்க அப்சலோம் செய்தி அல்லது ஆள் அனுப்பியதாகப் பொருள். நவீனத் தமிழில் ‘அழைத்துவர ஆளனுப்பினான்’ இந்தச் சூழ்நிலைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִשְׁלֹחַ אֹתוֹ אֶל הַמֶּלֶךְ
  choice: அவர் தன்னை அரசனிடம் அனுப்பிவைக்க வேண்டும் என்பதற்காக
  rationale: இந்த நோக்கத் தொடர், யோவாப் தமக்கு அரசனை அணுக வழிசெய்ய வேண்டும் என்ற அப்சலோமின் எண்ணத்தைத் தெரிவிக்கிறது. மூலத்தில் உள்ள ‘அனுப்புதல்’ என்ற சொல்லாட்சியைத் தக்கவைத்து, யோவாபின் இடைநிலைப் பங்கை அளவுக்கு மீறி விளக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְלֹא אָבָה
  choice: வர விரும்பவில்லை
  rationale: אָבָה என்பது ‘மனமுள்ளவராக இரு, சம்மதி’ என்பதைக் குறிக்கிறது. ‘மறுத்துவிட்டார்’ என்பதைவிட ‘வர விரும்பவில்லை’ என்பது மூலத்தின் சொற்பொருளை நெருக்கமாகக் காத்து, மறுப்பின் வலிமையை அதிகப்படுத்தாமல் இருக்கிறது.
- source_word: לָבוֹא אֵלָיו
  choice: அவனிடம் வர
  rationale: אֵלָיו குறிக்கும் அப்சலோமைத் தமிழில் ‘அவனிடம்’ என்று வெளிப்படையாகத் தக்கவைத்துள்ளது.
- source_word: עוֹד שֵׁנִית
  choice: மீண்டும் இரண்டாவது முறையாக
  rationale: עוֹד (‘மீண்டும்’) மற்றும் שֵׁנִית (‘இரண்டாவது முறையாக’) ஆகிய இரண்டையும் தக்கவைத்து, எபிரெயத்தின் வலியுறுத்தப்பட்ட மறுநிகழ்வை வெளிப்படுத்துகிறது.
- source_word: וַיִּשְׁלַח ... וְלֹא אָבָה ... וַיִּשְׁלַח ... וְלֹא אָבָה
  choice: ஆளனுப்பினான் ... ஆனால் ... விரும்பவில்லை ... மீண்டும் ... ஆளனுப்பினான்; அப்போதும் ... விரும்பவில்லை
  rationale: மூலத்தின் தொடர்ச்சியான கதைநடை மற்றும் மறுமொழிக் கட்டமைப்பு தக்கவைக்கப்பட்டுள்ளது. ‘ஆனால்’ மற்றும் ‘அப்போதும்’ என்பவை முயற்சிக்கும் இணங்காமைக்கும் இடையிலான முரண்பாட்டை இயல்பான தமிழில் காட்டுகின்றன.
