translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் சில இடங்களில் பிரதிப்பெயர்கள் மட்டும் இருப்பதால் ஏற்படக்கூடிய குழப்பத்தைத் தமிழில் தவிர்க்க ‘யோவாப்,’ ‘அப்சலோம்’ ஆகிய பெயர்கள் தேவையான இடங்களில் மீண்டும் வழங்கப்பட்டுள்ளன. மூலத்தின் மீளுரைத்தலும் ‘மீண்டும் இரண்டாவது முறையாக’ என்ற வலியுறுத்தலும் தக்கவைக்கப்பட்டுள்ளன.
