translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக்குரிய பணிவையும் மரியாதையையும் காக்கும் கண்ணியமான நடை. ‘உமது’ மற்றும் ‘என் ஆண்டவராகிய அரசர்’ என்பவை சூழலுக்கேற்ற மரியாதைப் பதிவை வழங்குகின்றன; உரையாடல் சுருக்கமாக வைக்கப்பட்டுள்ளது.
