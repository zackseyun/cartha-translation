  text: וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה תְּדַבֶּר נָ֧א שִׁפְחָתְ/ךָ֛ אֶל אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ דָּבָ֑ר וַ/יֹּ֖אמֶר דַּבֵּֽרִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/012.yaml
  text: Then the woman said[a], “Please let your servant speak a word to my lord the king.” And he said, “Speak.”
translation:
  language: ta
  text: அப்போது அந்தப் பெண், “என் ஆண்டவராகிய அரசரிடம் உமது அடியாளாகிய நான் ஒரு வார்த்தை பேச அனுமதியளிக்க வேண்டுகிறேன்” என்றாள். அதற்கு அவர், “பேசு” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: அப்போது ... என்றாள்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வைக் குறிக்கிறது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையில் நிகழ்வின் தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: இச்சூழலில் அரசரிடம் பேசிக்கொண்டிருக்கும் பெண்ணையே குறிக்கிறது; தமிழில் குறிப்பிட்ட நபரை இயல்பாகச் சுட்ட ‘அந்தப் பெண்’ பொருத்தமானது.
- source_word: תְּדַבֶּר נָא
  choice: பேச அனுமதிக்க வேண்டுகிறேன்
  rationale: இம்பெர்ஃபெக்ட்/யூசிவ் வடிவத்துடன் வரும் נָא, அரசரிடம் வைக்கப்படும் பணிவான வேண்டுகோளை வெளிப்படுத்துகிறது.
- source_word: שִׁפְחָתְךָ
  choice: உமது அடியாள்
  rationale: எபிரெயச் சொல் பெண்பால் பணிப்பெண்ணைக் குறிக்கிறது. ‘அடியாள்’ அதன் பெண்பால் தன்மையையும் அரசவைக்குரிய தாழ்மையான தற்சுட்டையும் தமிழில் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசரிடம்
  rationale: אֲדֹנִי இங்கு தெய்வீகப் பட்டமல்ல, மனித அரசருக்குரிய மரியாதை விளி; ‘என் ஆண்டவராகிய அரசர்’ இதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: דָּבָר
  choice: ஒரு வார்த்தை
  rationale: ‘சொல்/விஷயம்’ என்ற பொருள் வரம்புள்ள இச்சொல்லின் சுருக்கமான எபிரெய வழக்கை ‘ஒரு வார்த்தை’ பாதுகாக்கிறது.
- source_word: וַיֹּאמֶר
  choice: அதற்கு அவர் ... என்றார்
  rationale: அரசரின் நேரடியான பதிலை இயல்பான தமிழ் உரையாடல் தொடர்ச்சியாகக் காட்டுகிறது.
- source_word: דַּבֵּרִי
  choice: பேசு
  rationale: பெண்ணை நோக்கிய நேரடியான கட்டளை; எபிரெயத்தின் சுருக்கத்தையும் வலிமையையும் கூடுதல் விளக்கமின்றிப் பாதுகாக்கிறது.
