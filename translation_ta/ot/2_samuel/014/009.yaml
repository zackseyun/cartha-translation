  source_fidelity: 'கருத்து மூல எபிரெயத்துடன் பெரும்பாலும் ஒத்துள்ளது: தெக்கோவாவைச் சேர்ந்த பெண் குற்றப்பொறுப்பைத் தன் மீதும் தந்தையின் வீட்டின்மீதும் ஏற்றுக்கொண்டு, அரசரையும் அவரது அரியணையையும் பழியிலிருந்து விலக்குகிறாள். ஆனால் ‘அந்தக் குற்றப்பழி’ என்பதிலுள்ள ‘அந்த’ மூலத்தில் உள்ள சுட்டுத்தன்மையைத் தேவையின்றி அதிகரிக்கிறது. மேலும் அரசர் மற்றும் அரியணை என்ற கலப்பான எழுவாய்க்கு ‘குற்றமற்றவர்களாக’ என்பது அரியணையை மனிதப் பன்மையாக நடத்துகிறது.'
  naturalness: ‘என் ஆண்டவராகிய அரசே’ அரசவை மரியாதைக்கும் நவீன நிலையான தமிழுக்கும் பொருத்தமானது. ‘பழியற்றிருக்கட்டும்’ என்பது அரசரும் அரியணையும் என்ற இணைச்சொல்லோடு இயல்பாக இணைந்து, மனித/அஃறிணைப் பன்மை முரண்பாட்டைத் தவிர்க்கிறது.
