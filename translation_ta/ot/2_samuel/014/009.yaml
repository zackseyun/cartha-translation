  text: וַ/תֹּ֜אמֶר הָ/אִשָּׁ֤ה הַ/תְּקוֹעִית֙ אֶל הַ/מֶּ֔לֶךְ עָלַ֞/י אֲדֹנִ֥/י הַ/מֶּ֛לֶךְ הֶ/עָוֺ֖ן וְ/עַל בֵּ֣ית אָבִ֑/י וְ/הַ/מֶּ֥לֶךְ וְ/כִסְא֖/וֹ נָקִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/009.yaml
  text: Then the woman from Tekoa said to the king[a], “On me, my lord the king, be the guilt, and on my father’s house; but the king and his throne are innocent.”
translation:
  language: ta
  text: அப்போது தெக்கோவாவைச் சேர்ந்த அந்தப் பெண் அரசனிடம், “என் ஆண்டவராகிய அரசே, குற்றப்பழி என்மேலும் என் தந்தையின் வீட்டார்மேலும் இருக்கட்டும்; அரசரும் அவரது அரியணையும் பழியற்றிருக்கட்டும்” என்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקוֹעִית
  choice: தெக்கோவாவைச் சேர்ந்த அந்தப் பெண்
  rationale: תְּקוֹעִית அவளது ஊரைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עָלַי
  choice: என்மேல்
  rationale: மூலத்தில் இச்சொல் வலியுறுத்தும் வகையில் முன்னிலையில் வருகிறது; பொறுப்பைத் தானே ஏற்றுக்கொள்வதைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசே
  rationale: அரசவைக்குரிய மரியாதையான விளிப்பையும் அரச பட்டத்தையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: הֶעָוֺן
  choice: அந்தக் குற்றப்பழி
  rationale: עָוֹן என்பது அக்கிரமம், குற்றப்பழி, குற்றத்திற்கான பொறுப்பு அல்லது விளைவு ஆகிய தொடர்புடைய பொருள்களைக் கொண்டது. இங்குள்ள நீதிசார் சூழலில் ‘குற்றப்பழி’ குற்றத்திற்கான பொறுப்பை மிகையாகக் குறிப்பாக்காமல் வெளிப்படுத்துகிறது.
- source_word: וְעַל בֵּית אָבִי
  choice: என் தந்தையின் வீட்டார்மேல்
  rationale: எழுத்துப்படி ‘என் தந்தையின் வீட்டின்மேல்.’ தமிழில் ‘வீட்டார்’ என்பது குடும்பம் அல்லது தந்தைவழிக் குடும்பக் குழுவைக் குறிக்கும் இயல்பான சமமான சொல்.
- source_word: וְהַמֶּלֶךְ וְכִסְאוֹ
  choice: அரசரும் அவரது அரியணையும்
  rationale: ‘அரியணை’ அரச அதிகாரம் அல்லது அரச வம்சத்தைக் குறிக்கும் ஆகுபெயராக இருப்பதால் மூல உருவகம் பாதுகாக்கப்படுகிறது; சூழலின் எதிர்மறை ஒப்புமை தமிழில் அடுத்த வினையால் தெளிவாகிறது.
- source_word: נָקִי
  choice: குற்றமற்றவர்களாக இருக்கட்டும்
  rationale: இது நீதிசார் பொறுப்பிலிருந்து விடுபட்டிருப்பதைக் குறிக்கிறது. கூட்டெழுவாய்க்கேற்ப தமிழில் பன்மை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: அரசரைக் குற்றப்பொறுப்பிலிருந்து விடுவிக்கும் கூற்று
  choice: அரசரும் அவரது அரியணையும் குற்றமற்றவர்களாக இருக்கட்டும்
  alternative: அரசரும் அவரது அரியணையும் பழியற்றிருக்கட்டும்
  rationale: இது அரசர் முற்றிலும் ஒழுக்கக் குறையற்றவர் என்ற விரிவான இறையியல் கூற்று அல்ல; குறிப்பிட்ட விவகாரத்தின் சட்ட அல்லது ஒழுக்கப் பொறுப்பிலிருந்து அவரை விடுவிக்கும் மொழி. ‘குற்றமற்ற’ என்பது அந்த நீதிசார் வரம்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் சாதாரண வாசகர்களுக்குப் புரியும் நடையில் வடிவமைக்கப்பட்டது. அரசவைக்குரிய மரியாதை ‘என் ஆண்டவராகிய அரசே’ என்பதிலும், மூலத்தின் நீதிசார் பதற்றம் ‘குற்றப்பழி’ மற்றும் ‘குற்றமற்றவர்’ என்பதிலும் பாதுகாக்கப்பட்டுள்ளது.
