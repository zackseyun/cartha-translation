revisions:
- from: அவன் தன் தலைமுடியை வெட்டிக்கொள்ளும்போதெல்லாம்—ஆண்டுதோறும் முடிவில், அது அவனுக்குப் பாரமாக இருந்ததால் வெட்டிக்கொள்வான்—வெட்டிய முடியை எடைபோடுவான். அரசரின் எடைக்கல்லின்படி[a] அதன் எடை இருநூறு சேக்கல் இருந்தது.
  to: அவன் தன் தலைமுடியை வெட்டும்போதெல்லாம்—ஒவ்வோர் ஆண்டின் முடிவிலும் அவன் அதை வெட்டுவான்; ஏனெனில் அது அவனுக்குப் பாரமாக இருந்தது—அவன் தன் தலைமுடியை எடைபோடுவான்; அதன் எடை அரசரின் எடைக்கல்லின்படி[a] இருநூறு சேக்கல் இருந்தது.
  rationale: 'The revision makes two limited stylistic corrections: it uses an idiomatic expression for the annual interval and removes a reflexive nuance not specified by the Hebrew. It retains the source’s customary action, the burden of the hair, the stated weight, and the royal standard-stone reference.'
