base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/026.yaml
  text: 'Whenever he cut the hair of his head—at the end of every year he would cut it[a], because it was heavy on him—when he cut it, he weighed the hair of his head: two hundred shekels by the king’s stone.'
translation:
  language: ta
  text: அவன் தன் தலைமுடியை வெட்டும்போதெல்லாம்—ஒவ்வோர் ஆண்டின் முடிவிலும் அவன் அதை வெட்டுவான்; ஏனெனில் அது அவனுக்குப் பாரமாக இருந்தது—அவன் தன் தலைமுடியை எடைபோடுவான்; அதன் எடை அரசரின் எடைக்கல்லின்படி[a] இருநூறு சேக்கல் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, ‘அரசரின் கல்லின்படி’; இது அரச முறைப்படியான எடைக்கல்லைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְגַלְּחוֹ אֶת־רֹאשׁוֹ
  choice: அவன் தன் தலைமுடியை வெட்டிக்கொள்ளும்போதெல்லாம்
  rationale: தொடர்ந்து நிகழ்ந்த வழக்கத்தைச் சூழல் காட்டுவதால், காலத்தைக் குறிக்கும் எபிரெய அமைப்பை ‘போதெல்லாம்’ என்று மொழிபெயர்த்தது. רֹאשׁוֹ என்பதன் நேரடிப் பொருள் ‘அவனுடைய தலை’; ஆனால் வெட்டப்படுவது தலைமுடி என்பதை அடுத்த சொற்றொடர் தெளிவாக்குவதால் இயல்பான தமிழில் ‘தலைமுடி’ எனக் கூறப்பட்டது.
- source_word: וְהָיָה מִקֵּץ יָמִים לַיָּמִים
  choice: ஆண்டுதோறும் முடிவில்
  rationale: சொல்லுக்குச் சொல் அமைப்பு ‘நாட்களின் முடிவிலிருந்து நாட்களுக்கு’ என்றாலும், இச்சூழலில் ஒழுங்காகத் திரும்பும் ஆண்டு இடைவெளியைக் குறிக்கிறது.
- source_word: אֲשֶׁר יְגַלֵּחַ
  choice: வெட்டிக்கொள்வான்
  rationale: முற்றுப்பெறாத வினை இங்கு வழக்கமான செயலைக் குறிக்கிறது. גלח முழுமையாக மழித்தல் என்ற கட்டாயப் பொருள் இல்லாமல் முடியை வெட்டுவதையும் குறிக்க முடியும்.
- source_word: כִּי כָבֵד עָלָיו
  choice: அது அவனுக்குப் பாரமாக இருந்ததால்
  rationale: முடியின் கனத்தையும் அதனால் ஏற்பட்ட சுமையையும் குறிக்கும் எபிரெய உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וְגִלְּחוֹ וְשָׁקַל אֶת־שְׂעַר רֹאשׁוֹ
  choice: வெட்டிய முடியை எடைபோடுவான்
  rationale: முன்னுள்ள ‘போதெல்லாம்’ என்ற வழக்கச் சூழலோடு இணைத்து, ஒவ்வொரு வெட்டுதலின்போதும் நிகழ்ந்த செயல் எனத் தமிழில் இயல்பாக வழங்கப்பட்டது.
- source_word: מָאתַיִם שְׁקָלִים
  choice: இருநூறு சேக்கல்
  rationale: சேக்கல் இங்கு நாணய மதிப்பு அல்ல, எடையளவு. பழங்கால அலகின் பெயர் ஒலிபெயர்ப்பாக வைக்கப்பட்டது.
- source_word: בְּאֶבֶן הַמֶּלֶךְ
  choice: அரசரின் எடைக்கல்லின்படி
  rationale: אֶבֶן என்பதன் நேரடிப் பொருள் ‘கல்’; இங்கு எடையை அளக்கும் அரச முறைப்படியான எடைக்கல்லைக் குறிக்கிறது. ‘எடைக்கல்’ என்பது நேரடித்தன்மையையும் பொருள்தெளிவையும் இணைக்கிறது.
