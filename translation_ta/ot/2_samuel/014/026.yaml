translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டது. நீண்ட எபிரெய வாக்கியத்தின் இடைச்செருகல் கோடுகளால் தக்கவைக்கப்பட்டு, இறுதி எடைத் தகவல் வாசிப்புத் தெளிவுக்காக தனி வாக்கியமாக அமைக்கப்பட்டது.
