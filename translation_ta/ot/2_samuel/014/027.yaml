revisions:
- from: அப்சலோமுக்கு மூன்று மகன்களும் ஒரு மகளும் பிறந்தார்கள். அவளுடைய பெயர் தாமார். அவள் தோற்றத்தில் அழகான பெண்ணாக இருந்தாள்.[a]
  to: அப்சலோமுக்கு மூன்று மகன்களும் ஒரு மகளும் பிறந்தனர். அவளுடைய பெயர் தாமார். அவள் அழகிய தோற்றமுள்ள பெண்ணாக இருந்தாள்.[a]
  rationale: 'The revision makes two low-risk idiomatic improvements: it uses a neutral plural verb for the children and recasts the final description into natural Tamil. The source’s explicit description of Tamar as a woman whose appearance was beautiful remains intact, and the footnote continues to distinguish the literal wording from a smoother idiomatic alternative.'
