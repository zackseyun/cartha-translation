base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/027.yaml
  text: Three sons and one daughter were born to Absalom[a], and her name was Tamar. She was a woman beautiful in appearance.
translation:
  language: ta
  text: அப்சலோமுக்கு மூன்று மகன்களும் ஒரு மகளும் பிறந்தனர். அவளுடைய பெயர் தாமார். அவள் அழகிய தோற்றமுள்ள பெண்ணாக இருந்தாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இயல்பான தமிழில், “அவள் மிகவும் அழகானவளாக இருந்தாள்” என்றும் மொழிபெயர்க்கலாம். எபிரேய மொழியில் சொல்லர்த்தமாக, “தோற்றத்தில் அழகான பெண்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּלְדוּ לְאַבְשָׁלוֹם
  choice: அப்சலோமுக்கு ... பிறந்தார்கள்
  rationale: ילד என்பதன் நிஃபால் வடிவம் பிறத்தலைச் சுட்டுகிறது; לְ பெற்றோர் உறவைக் குறிக்கிறது. இந்த அமைப்பு இயல்பான நவீன தமிழில் குழந்தைகள் அப்சலோமுக்குப் பிறந்தார்கள் என்று வழங்கப்படுகிறது.
- source_word: שְׁלוֹשָׁה בָנִים וּבַת אַחַת
  choice: மூன்று மகன்களும் ஒரு மகளும்
  rationale: בָנִים என்பது பொதுவாகக் குழந்தைகள் அல்ல, குறிப்பாக மகன்கள்; אַחַת என்ற எண்ணிக்கையும் தெளிவாகப் பாதுகாக்கப்படுகிறது.
- source_word: וּשְׁמָהּ תָּמָר
  choice: அவளுடைய பெயர் தாமார்
  rationale: பெண்பால் ஒருமை பின்னொட்டு முன்பு குறிப்பிடப்பட்ட மகளைக் குறிக்கிறது; பெயர் தமிழ் ஒலிபெயர்ப்பு மரபின்படி வழங்கப்படுகிறது.
- source_word: הִיא הָיְתָה אִשָּׁה
  choice: அவள் ... பெண்ணாக இருந்தாள்
  rationale: தனித்த பெண்பால் சுட்டுப்பெயரின் குறிப்பைத் தக்கவைத்து, அசல் வாக்கிய அமைப்புக்கு நெருக்கமான, இயல்பான தமிழ் வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: יְפַת מַרְאֶה
  choice: தோற்றத்தில் அழகான
  rationale: இந்த எபிரேயச் சொற்றொடர் உடல்தோற்ற அழகைக் குறிக்கிறது. ‘தோற்றத்தில் அழகான’ என்பது அதன் கூறுகளைத் தக்கவைக்கும் தெளிவான தமிழ் வடிவம்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கொண்டுள்ளது. எபிரேயத்தின் ‘தோற்றத்தில் அழகான பெண்’ என்ற வெளிப்பாட்டை முதன்மை உரையில் நெருக்கமாகப் பாதுகாத்து, அதிக இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
