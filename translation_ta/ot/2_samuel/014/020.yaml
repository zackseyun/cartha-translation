base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/020.yaml
  text: In order to change the course of the matter[a], your servant Joab did this thing. But my lord is wise, with the wisdom of the angel of God[b], to know all that is in the land.
translation:
  language: ta
  text: “இந்த விவகாரம் தோன்றும் விதத்தை மாற்றுவதற்காக[a] உமது அடியான் யோவாப் இதைச் செய்தான். ஆனால் என் ஆண்டவர், நாட்டிலுள்ள அனைத்தையும் அறிந்துகொள்ளும் அளவுக்குக் கடவுளின் தூதரின் ஞானத்தைப்போல ஞானமுள்ளவர்[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘இந்த விவகாரத்தின் முகத்தைத் திருப்புவதற்காக.’ ‘விவகாரத்தை வேறு திசைக்குத் திருப்புவதற்காக’ என்றும் பொருள்கொள்ளலாம்.'
    reason: lexical_alternative
  - marker: b
    text: ‘நாட்டிலுள்ள அனைத்தையும்’ என்பதற்கு ‘பூமியிலுள்ள அனைத்தையும்’ என்றும் மொழிபெயர்க்கலாம். இச்சூழலில் அரசனின் ஆட்சிக்குட்பட்ட நாட்டைக் குறிப்பதே அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַעֲבוּר
  choice: மாற்றுவதற்காக
  rationale: இச்சொல் நோக்கத்தைக் குறிக்கிறது; தமிழில் ‘-வதற்காக’ என்பது அந்த நோக்கவுணர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: סַבֵּב אֶת־פְּנֵי הַדָּבָר
  choice: இந்த விவகாரம் தோன்றும் விதத்தை மாற்றுவதற்காக
  rationale: ‘விவகாரத்தின் முகத்தைத் திருப்புதல்’ என்ற எபிரெய உருவகத்தின் பொருளான, விவகாரம் முன்வைக்கப்படும் அல்லது தோன்றும் விதத்தை மாற்றுவதை இயல்பான தமிழில் தெரிவிக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: עַבְדְּךָ
  choice: உமது அடியான்
  rationale: அரசவையில் பயன்படுத்தப்படும் பணிவான மூன்றாம் நபர் குறிப்பை ‘அடியான்’ இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: עָשָׂה ... אֶת־הַדָּבָר הַזֶּה
  choice: இதைச் செய்தான்
  rationale: எபிரெய வினையையும் அதன் சுட்டுப்பொருளையும் தெளிவான நவீன தமிழில் நேரடியாக வழங்குகிறது.
- source_word: וַאדֹנִי
  choice: ஆனால் என் ஆண்டவர்
  rationale: இங்கு இணைப்புச்சொல் விளக்கத்திலிருந்து அரசனைப் புகழ்வதற்கான மெல்லிய எதிர்மாற்றத்தைக் காட்டுகிறது.
- source_word: חָכָם
  choice: ஞானமுள்ளவர்
  rationale: அரசனின் விவேகத்தையும் அறிவாற்றலையும் புகழும் חָכָם என்பதற்கான இயல்பான மரியாதைத் தமிழ்.
- source_word: כְּחָכְמַת מַלְאַךְ הָאֱלֹהִים
  choice: கடவுளின் தூதருக்குரிய ஞானத்தைப் போன்ற ஞானமுள்ளவர்
  rationale: כְּ குறிக்கும் ஒப்பீட்டையும் ‘கடவுளின் தூதர்’ என்ற வெளிப்பாட்டையும் பாதுகாக்கிறது; இது அரசனின் இயல்பைப் பற்றிய ontological கூற்றாக மாற்றப்படவில்லை.
- source_word: לָדַעַת
  choice: அறிந்துகொள்ளும் அளவுக்கு
  rationale: அரசனின் ஞானத்தின் திறன் அல்லது விளைவைச் சுட்டும் infinitive-ஐ இயல்பான தமிழில் இணைக்கிறது.
- source_word: כָּל אֲשֶׁר בָּאָרֶץ
  choice: நாட்டிலுள்ள அனைத்தையும்
  rationale: அரசாட்சியைப் பற்றிய இச்சூழலில் הָאָרֶץ என்பது முழு பூமியைவிட நாட்டை அல்லது அரச எல்லையைச் சுட்டுவது இயல்பானது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: ‘கடவுளின் தூதர்’ என்ற குறிப்பின் தன்மை
  choice: அரசனின் அசாதாரணமான பகுத்தறிவைப் புகழும் ஒப்பீடாக மொழிபெயர்க்கப்பட்டது.
  alternative: இது ஒரு குறிப்பிட்ட தூதரைக் குறிக்கலாம்; அல்லது ‘கடவுளுடைய ஒரு தூதர்’ என்ற பொதுவான பொருளையும் தரலாம்.
  rationale: எபிரெய உரை அரசனின் ஞானத்தைத் தூதரின் ஞானத்தோடு ஒப்பிடுகிறது; தாவீதுக்கு தெய்வீக இயல்போ அனைத்தறிவோ உண்டு என்று கூறவில்லை. தமிழ்ச் சொற்றொடர் எண்ணிக்குறியீட்டை வலுக்கட்டாயமாகத் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக்குரிய மரியாதையைப் பேணும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது அடியான்’, ‘என் ஆண்டவர்’ ஆகியவை பாத்திரங்களின் பணிவான அரசவைப் பேச்சைத் தெரிவிக்கின்றன. மூல எபிரெய உருவகம் முற்றிலும் மறையாமல் அதன் பொருள் முதன்மை உரையில் இயல்பாக்கப்பட்டு, சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
