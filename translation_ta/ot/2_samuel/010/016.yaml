base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/016.yaml
  text: Hadadezer sent and brought out the Arameans who were beyond the River[a], and they came to Helam[c][b], with Shobak the commander of Hadadezer’s army before them.
translation:
  language: ta
  text: அதாதேசர் அனுப்பி, ஆற்றுக்கு அப்பாலிருந்த[a] அராமியர்களைப் புறப்பட்டு வரச் செய்தான். அவர்கள் ஹேலாமுக்கு வந்தார்கள்; அதாதேசரின் படைத்தளபதியான சோபாக் அவர்களுக்கு முன்னால் இருந்தான்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, யூபிராத்து ஆற்றுக்கு அப்பாலிருந்து.
    reason: cultural_note
  - marker: c
    text: ‘அவர்களுக்கு முன்னால்’ என்பது, அவன் அவர்களை வழிநடத்திக்கொண்டு படையின் முன்பகுதியில் சென்றான் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ஆள் அனுப்பி
  rationale: שלח என்பதன் அடிப்படைப் பொருளான ‘அனுப்புதல்’ என்பதைக் கதையோட்டத்துக்கு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֹּצֵא אֶת אֲרָם
  choice: அராமியர்களைப் புறப்பட்டுவரச் செய்தான்
  rationale: יצא என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளைப் பாதுகாக்கிறது; இங்கு அராமியப் படைகளைப் போருக்காக வெளியே வரச் செய்ததைக் குறிக்கிறது.
- source_word: אֲרָם
  choice: அராமியர்கள்
  rationale: இச்சூழலில் நிலப்பகுதியை மட்டும் அல்லாமல் அராமிய மக்களையோ படைகளையோ குறிக்கிறது; ‘சீரியர்கள்’ என்ற காலத்துக்கு ஒவ்வாத தொடர்பைத் தவிர்க்கிறது.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: ஆற்றுக்கு அப்பாலிருந்த
  rationale: எபிரெய உரையின் ‘ஆற்றுக்கு அப்பால்’ என்ற சொல்லாட்சியை முதன்மை உரையில் பாதுகாக்கிறது; யூபிராத்து என்ற அடையாளம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיָּבֹאוּ חֵילָם
  choice: அவர்கள் ஏலாமுக்கு வந்தார்கள்
  rationale: חֵילָם என்பதை இடப்பெயராக ஒலிபெயர்த்து, இயக்கத்தைக் குறிக்கும் בוא வினையை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: וְשׁוֹבַךְ
  choice: சோபாக்
  rationale: மெய்யெழுத்து வடிவத்தை நெருக்கமாகப் பிரதிபலிக்கும் பெயரொலிபெயர்ப்பு; வழக்கிலுள்ள மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שַׂר צְבָא
  choice: படைத்தளபதி
  rationale: படையின் தலைமை அதிகாரியை நவீனத் தமிழில் தெளிவாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: לִפְנֵיהֶם
  choice: அவர்களுக்கு முன்னால் இருந்தான்
  rationale: ‘அவர்களுக்கு முன்பாக’ என்ற மூலத்தின் இடவியல் சொல்லாட்சியைப் பாதுகாக்கிறது; படைச்சூழலில் அதன் தலைமைப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
