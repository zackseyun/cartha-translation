  text: Then Joab and the people who were with him advanced to battle against Aram[a], and they fled before him.
translation:
  language: ta
  text: அப்போது யோவாபும் அவனோடு இருந்த மக்களும் அராமுக்கு[a] எதிராகப் போரிட முன்னேறினார்கள்; அவர்கள் அவனிடமிருந்து தப்பியோடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அராம்’; அதாவது, அராமியப் படைகள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: முன்னேறினார்கள்
  rationale: נגשׁ என்பதன் அடிப்படைப் பொருள் ‘நெருங்குதல்’; לַמִּלְחָמָה என்ற போர்ச் சூழலில், போரில் ஈடுபட முன்னேறுவதை இது குறிக்கிறது. கூட்டெழுவாய்க்கு ஏற்ப தமிழில் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: அவனோடு இருந்த மக்களும்
  rationale: עָם என்பதன் நேரடிப் பொருளான ‘மக்கள்’ என்பதைக் காக்கிறது; சூழலில் அவர்கள் யோவாபின் படைவீரர்கள் என்பது தெளிவாக இருந்தாலும், ‘படை’ என்று விளக்கமாக மாற்றப்படவில்லை.
- source_word: לַמִּלְחָמָה
  choice: போரிட
  rationale: முன்னொட்டுடன் வரும் מִלְחָמָה இங்கு போருக்கான நோக்கத்தையோ போரில் ஈடுபடுவதையோ குறிக்கிறது; ‘போரிட’ என்பது இயல்பான, சுருக்கமான தமிழ்.
- source_word: בַּאֲרָם
  choice: அராமுக்கு எதிராக
  rationale: எபிரெயத்தில் உள்ள அராம் என்ற பெயரை நேரடியாகக் காத்து, בְּ இன் பகைமைச் சூழலிலான உறவை ‘எதிராக’ எனத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַיָּנֻסוּ
  choice: தப்பியோடினார்கள்
  rationale: נוּס என்பது அச்சுறுத்தலிலிருந்து ஓடித் தப்புவதை வலுவாகக் குறிக்கிறது; ஒழுங்கான பின்வாங்கலைக் குறிக்கக்கூடிய சொல்லைத் தவிர்க்கிறது.
- source_word: מִפָּנָיו
  choice: அவனுக்கு முன்பாக
  rationale: ‘அவனுடைய முகத்திலிருந்து/அவனுக்கு முன்பாக’ என்ற எபிரெய மரபுத்தொடரின் வடிவத்தையும், யோவாபைச் சுட்டும் ஒருமை பின்னொட்டையும் காக்கிறது.
- source_word: יוֹאָב
  choice: யோவாப்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
