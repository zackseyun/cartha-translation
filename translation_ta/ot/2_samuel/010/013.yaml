- from: அப்போது யோவாபும் அவனோடு இருந்த மக்களும் அராமுக்கு[a] எதிராகப் போரிட முன்னேறினார்கள்; அவர்கள் அவனுக்கு முன்பாகத் தப்பியோடினார்கள்.
  to: அப்போது யோவாபும் அவனோடு இருந்த மக்களும் அராமுக்கு[a] எதிராகப் போரிட முன்னேறினார்கள்; அவர்கள் அவனிடமிருந்து தப்பியோடினார்கள்.
