base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, and came to Helam. Then Aram drew up in battle formation to meet David and fought with him.
translation:
  language: ta
  text: அது தாவீதுக்கு அறிவிக்கப்பட்டபோது, அவர் இஸ்ரவேலர் அனைவரையும் ஒன்றுகூட்டி, யோர்தானைக் கடந்து ஹேலாமுக்கு வந்தார். அப்போது அராமியர்கள் தாவீதை எதிர்கொள்ளப் போரணியில் நின்று, அவரோடு போரிட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்கு எதிராகப் போரிட்டார்கள்.” எபிரெயத்தில், “அவரோடு போரிட்டார்கள்” என்று உள்ளது; இங்கு அது ஒருவரை எதிரியாகச் சந்தித்துப் போரிடுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִד
  choice: அது தாவீதுக்கு அறிவிக்கப்பட்டபோது
  rationale: கூறுபவர் யார் என்பதைக் குறிப்பிடாத எபிரெய மறைமுக வினையைப் பாதுகாக்கிறது; தொடக்க வாவ் காட்டும் கதைத் தொடர்ச்சியை இயல்பான தமிழில் ‘போது’ என வெளிப்படுத்துகிறது.
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: அவர் இஸ்ரவேலர் அனைவரையும் ஒன்றுகூட்டி
  rationale: אָסַף என்பதன் ‘ஒன்றுகூட்டு/திரட்டு’ என்ற பொருளையும், ‘படை’ எனக் கூடுதலாகக் குறிப்பாக்காமல் כָּל־יִשְׂרָאֵל என்ற கூட்டு மக்களைக் குறிக்கும் சொல்லையும் காக்கிறது.
- source_word: וַיַּעֲבֹר אֶת הַיַּרְדֵּן
  choice: யோர்தானைக் கடந்து
  rationale: עָבַר என்பதன் ஆற்றைக் கடத்தல் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיָּבֹא חֵלָמָה
  choice: ஏலாமுக்கு வந்தார்
  rationale: חֵלָמָה என்பதிலுள்ள திசைச்சுட்டும் -ה, அந்த இடத்தை நோக்கிய சென்று சேர்தலைக் காட்டுகிறது; ‘ஏலாமுக்கு வந்தார்’ அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיַּעַרְכוּ אֲרָם
  choice: அராமியர்கள் போரணியில் நின்று
  rationale: போர்ச் சூழலில் עָרַךְ என்பது போருக்காக அணிவகுத்தல் அல்லது படையை நிறுத்துதல் என்று பொருள். எபிரெயத்தில் உள்ள ‘அராம்’ என்ற கூட்டு நாட்டுப்பெயர் தமிழில் இயல்பாக ‘அராமியர்கள்’ எனக் கொடுக்கப்படுகிறது.
- source_word: לִקְרַאת דָּוִד
  choice: தாவீதை எதிர்கொள்ள
  rationale: לִקְרַאת என்பதன் அடிப்படை ‘சந்திக்க/எதிர்கொள்ள’ என்ற இயக்கப் பொருளையும் இங்குள்ள பகைமையான போர்ச் சூழலையும் அளவுக்கு மீறாமல் வெளிப்படுத்துகிறது.
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: அவரோடு போரிட்டார்கள்
  rationale: עִם என்பதன் நேரடியான ‘உடன்/ஓடு’ வடிவத்தைத் தக்கவைக்கிறது; போர்ச் சூழலில் இது ஒருவருக்கு எதிராகப் போரிடும் எபிரெய மரபுத்தொடர்.
