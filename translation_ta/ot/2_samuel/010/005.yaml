base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/005.yaml
  text: When they told David[a], he sent to meet them, for the men were greatly humiliated. And the king said, “Stay at Jericho until your beards have grown[b], and then return.”
translation:
  language: ta
  text: அவர்கள் தாவீதுக்குத் தெரிவித்தார்கள்; அவர்களைச் சந்திக்க அவர் அனுப்பினார். அவர்கள் மிகுந்த அவமானத்தில் இருந்ததால், அரசர், “உங்கள் தாடிகள் வளரும்வரை எரிகோவில் தங்கியிருங்கள்; அதன்பின் திரும்பி வாருங்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: அவர்கள் தாவீதுக்கு இதைத் தெரிவித்தபோது
  rationale: נגד என்பதன் Hiphil வடிவம் ‘தெரிவித்தல்/அறிவித்தல்’ என்று பொருள்படும். எபிரெயத்தில் எழுவாய் குறிப்பிடப்படாததால் ‘அவர்கள்’ என இயல்பாகக் கொடுக்கப்பட்டுள்ளது; ‘இதை’ என்பது முந்தைய நிகழ்வைச் சுட்டுகிறது.
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: அவர்களைச் சந்திக்க அவர் ஆட்களை அனுப்பினார்
  rationale: சொல்லுக்கு நெருக்கமாக ‘அவர்களைச் சந்திக்க அனுப்பினார்’ என்றாலும், தமிழில் அனுப்பப்பட்ட நபர் விடுபட்டால் இயல்பற்றதாகும். ஆகவே மறைமுக எழுவாயை ‘ஆட்களை’ என வெளிப்படுத்தி, அது மூலத்தில் நேரடியாக இல்லை என்பதை அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: כִּי הָיוּ הָאֲנָשִׁים נִכְלָמִים מְאֹד
  choice: ஏனெனில் அந்த ஆண்கள் மிகவும் அவமானப்படுத்தப்பட்டிருந்தார்கள்
  rationale: Niphal வடிவமான נכלמים, அவர்கள் பொதுவில் அவமானத்திற்கு உள்ளாக்கப்பட்ட நிலையை உணர்த்துகிறது; מְאֹד அதன் தீவிரத்தை வலியுறுத்துகிறது.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: அப்போது அரசர் ... என்றார்
  rationale: கதைத் தொடர்ச்சியை ‘அப்போது’ இயல்பாக வெளிப்படுத்துகிறது; ‘அரசர்’ என்ற பட்டம் மூலத்தைப் போலவே வைக்கப்பட்டுள்ளது.
- source_word: שְׁבוּ בִירֵחוֹ
  choice: எரிகோவில் தங்கியிருந்து
  rationale: ישׁב இச்சூழலில் தற்காலிகமாகத் தங்கியிருப்பதைக் குறிக்கிறது. நகரப் பெயருடன் ‘எரிகோவில்’ என்பது இயல்பான தமிழ்.
- source_word: עַד יְצַמַּח זְקַנְכֶם
  choice: உங்கள் தாடிகள் வளரும்வரை
  rationale: צמח என்பது ‘முளைத்தல்/வளர்தல்’; பன்மை நபர்களைப் பற்றியதால் ‘உங்கள் தாடிகள்’ என வழங்கப்பட்டுள்ளது. மீண்டும் வளர்வது சூழலால் புரிந்தாலும், மூலத்தில் ‘மீண்டும்’ இல்லை.
- source_word: וְשַׁבְתֶּם
  choice: அதன்பின் திரும்பி வாருங்கள்
  rationale: שׁוב என்பதன் அடிப்படைப் பொருள் ‘திரும்புதல்’. ‘அதன்பின்’ என்பது עַד உடன் உள்ள காலவரிசையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
