translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பொதுவான அவமான உணர்வையும், அனுப்பப்பட்ட நபர்கள் வெளிப்படையாகக் குறிப்பிடப்படாத தன்மையையும் பாதுகாக்க அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கில அடிக்குறிப்புகளின் குறியீடுகளுக்கும் உள்ளடக்கத்திற்கும் இடையில் முரண்பாடு இருந்ததால், எபிரெய மூலத்துடன் பொருந்தும் குறிப்பே பயன்படுத்தப்பட்டது.
