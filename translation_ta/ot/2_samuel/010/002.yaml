base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, just as his father showed kindness to me.” So David sent by the hand of his servants to comfort him concerning his father, and David’s servants came into the land of the Ammonites.
translation:
  language: ta
  text: தாவீது, “நாகாஷின் மகன் ஹானூனுக்கு, அவனுடைய தந்தை எனக்குக் காட்டியதுபோல நானும் தயவு காட்டுவேன்” என்றார். எனவே, அவனுடைய தந்தையை முன்னிட்டு அவனுக்கு ஆறுதல் கூறுவதற்காக தாவீது தம் பணியாளர்களை அனுப்பினார்.[a] தாவீதின் பணியாளர்கள் அம்மோனியரின் நாட்டிற்கு வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய தந்தையைக் குறித்து அவனுக்கு ஆறுதல் கூறுவதற்காக.” எபிரெயத் தொடரில் தந்தையின் மரணம் வெளிப்படையாகக் கூறப்படவில்லை; சூழலில் அது இரங்கல் தெரிவிப்பதைக் குறிக்கிறது.
    reason: மூலத்தின் ‘அவனுடைய தந்தையை/தந்தையைக் குறித்து’ என்ற திறந்த சொல்லாக்கத்தையும், சூழலால் உணரப்படும் இரங்கல் பொருளையும் வேறுபடுத்திக் காட்டுகிறது.
lexical_decisions:
- source_word: חֶסֶד
  choice: நன்மை
  rationale: இந்த அரசியல் மற்றும் தூதரகச் சூழலில் இச்சொல் ஒருவருக்கொருவர் காட்டும் தயவு அல்லது பற்றுறுதியான நன்மையைக் குறிக்கிறது. இரு இடங்களிலும் இயல்பாகப் பொருந்துவதால் ‘நன்மை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: חָנוּן בֶּן נָחָשׁ
  choice: நாகாஷின் மகன் ஆனூன்
  rationale: எபிரெயத் தனிப்பெயர்களின் ஒலியைத் தமிழில் அணுக்கமாகத் தருவதோடு, தந்தை–மகன் உறவையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: עָשָׂה ... חֶסֶד
  choice: நன்மை செய்தார்
  rationale: எபிரெயச் சேர்க்கையின் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; தாவீதின் பதில்நன்மையையும் தெளிவாக்குகிறது.
- source_word: לְנַחֲמוֹ
  choice: அவனுக்கு ஆறுதல் கூறும்படி
  rationale: இறப்பால் துயருறுபவருக்கு ஆறுதல் அளிப்பதே இங்கு குறிக்கப்படுகிறது. ‘ஆறுதல் கூறுதல்’ பொதுவாகப் புரியும் இயல்பான தமிழ் நடை.
- source_word: אֶל אָבִיו
  choice: அவனுடைய தந்தையைக் குறித்து
  rationale: தந்தையுடன் தொடர்புடைய துயரமே காரணம் என்பதைச் சொல்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘மரணம்’ என்பதை முதன்மை உரையில் சேர்க்காமல் பாதுகாக்கிறது.
- source_word: בְּיַד עֲבָדָיו
  choice: தம் பணியாளர்களை அனுப்பினார்
  rationale: ‘பணியாளர்களின் கையால்’ என்னும் எபிரெய மரபுத்தொடர் அவர்களைத் தூதர்களாக அனுப்பியதைக் குறிக்கிறது. தமிழில் நேரடியாக இவ்வாறு சொல்வது இயல்பானதும் பொருளுக்கு நிகரானதும் ஆகும்.
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: அம்மோனியரின் நாடு
  rationale: ‘அம்மோனின் புதல்வர்கள்’ என்ற சொற்படியான இனப்பெயருக்கு, தமிழில் தெளிவாகப் புரியும் வழக்கமான வடிவம்.
