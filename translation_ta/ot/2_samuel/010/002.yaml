  naturalness: ‘ஆனூனுடைய தந்தை எனக்கு நன்மை செய்ததுபோல’ மற்றும் ‘அவனுடைய தந்தையைக் குறித்து அவனுக்கு ஆறுதல் கூறும்படி’ ஆகியவை புரியக்கூடியவை; ஆனால் சற்றே கனமாகவும் இயல்புக் குறைவாகவும் உள்ளன. திருத்தப்பட்ட உரை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
