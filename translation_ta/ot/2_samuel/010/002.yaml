- from: 'தாவீது, “நாகாஷின் மகன் ஆனூனுடைய தந்தை எனக்கு நன்மை செய்ததுபோல, நானும் ஆனூனுக்கு நன்மை செய்வேன்” என்றார். எனவே, அவனுடைய தந்தையைக் குறித்து அவனுக்கு ஆறுதல் கூறும்படி[a] தாவீது தம் பணியாளர்களை அனுப்பினார். தாவீதின் பணியாளர்கள் அம்மோனியரின் நாட்டிற்கு வந்தார்கள்.


    [a] அல்லது, “அவனுடைய தந்தையின் மரணத்திற்காக அவனுக்கு இரங்கல் தெரிவிக்கும்படி.” எபிரெயச் சொற்றொடர், தந்தையை இழந்த ஆனூனுக்கு ஆறுதல் கூறுவதைக் குறிக்கிறது.'
  to: தாவீது, “நாகாஷின் மகன் ஹானூனுக்கு, அவனுடைய தந்தை எனக்குக் காட்டியதுபோல நானும் தயவு காட்டுவேன்” என்றார். எனவே, அவனுடைய தந்தையை முன்னிட்டு அவனுக்கு ஆறுதல் கூறுவதற்காக தாவீது தம் பணியாளர்களை அனுப்பினார்.[a] தாவீதின் பணியாளர்கள் அம்மோனியரின் நாட்டிற்கு வந்தார்கள்.
