base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/012.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: ta
  text: “திடன்கொள்; நம் மக்களுக்காகவும் நம் கடவுளின் நகரங்களுக்காகவும் நாம் திடன்கொள்வோம்.[a] யாவே தம் பார்வையில் நல்லதாய் இருப்பதைச் செய்வாராக!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாம் நம்மைத் திடப்படுத்திக்கொள்வோம்.” எபிரெய வினை தன்னிலைப் பொருளைக் கொண்டுள்ளது; எனவே வலிமையைக் காட்டுதல் அல்லது தம்மை வலுப்படுத்திக்கொள்ளுதல் என்ற நிழற்பொருளும் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாவே தம் பார்வையில் நல்லதாய் இருப்பதைச் செய்வார்.” எபிரெய வினை வடிவத்தை எளிய எதிர்காலமாகவும் வாசிக்கலாம்; முதன்மை உரையில் அது யாவேயின் சித்தத்திற்கு ஒப்புக்கொடுக்கும் விருப்பமாக மொழியாக்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: திடன்கொள்ளுங்கள்
  rationale: ஆண்பால் ஒருமை கட்டளை வடிவம் நேரடியாக வலிமையுடனும் துணிவுடனும் இருக்கும்படி அழைக்கிறது. தமிழில் ‘திடன்கொள்ளுங்கள்’ என்பது வலிமை மற்றும் துணிவு ஆகிய இரு நிழற்பொருள்களையும் இயல்பாகக் கொண்டுள்ளது.
- source_word: וְנִתְחַזַּק
  choice: நாம் திடன்கொள்வோம்
  rationale: ஹித்பயேல் முதல் நபர் பன்மை விருப்ப வடிவத்தின் தற்சார்பு நிழற்பொருளையும், ஒன்றிணைந்த ஊக்குவிப்பையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: בְּעַד
  choice: …க்காக
  rationale: இராணுவச் சூழலில் ஒருவரின் நலனுக்காக அல்லது பாதுகாப்புக்காகச் செயல்படுவதை இயல்பான தமிழில் குறிக்கிறது.
- source_word: עַמֵּנוּ
  choice: நம் மக்கள்
  rationale: עַם என்பது குறிப்பாகப் படையை அல்ல, பொதுவாக மக்களைக் குறிக்கிறது; ‘நம் மக்கள்’ மூலத்தின் பரந்த சமூகப் பொருளைப் பாதுகாக்கிறது.
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: நம் இறைவனுடைய நகரங்கள்
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவாகவும் இயல்பாகவும் தருவதோடு, அந்த நகரங்கள் இஸ்ரவேலின் இறைவனுடன் கொண்டுள்ள உறவையும் காக்கிறது.
- source_word: יהוה
  choice: யாவே
  rationale: நான்கெழுத்துத் திருப்பெயரைப் பொதுப் பட்டப்பெயராக மாற்றாமல், தனிப்பெயராக ஒலிபெயர்க்கிறது.
- source_word: יַעֲשֶׂה הַטּוֹב בְּעֵינָיו
  choice: தமது பார்வைக்கு நல்லதைச் செய்வாராக
  rationale: எபிரெய மொழிமரபை நெருக்கமாகப் பாதுகாத்து, முடிவை யாவேயின் சித்தத்திடம் ஒப்படைக்கும் விருப்பப் பொருளைத் தமிழின் ‘செய்வாராக’ வடிவில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: இங்கு மூலத்தில் உடன்படிக்கையின் தனிப்பெயர் நேரடியாக உள்ளது; அதைத் தனிப்பெயராகவே வழங்குவது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: יַעֲשֶׂה என்பதன் வாக்கிய வலிமை
  choice: 'விருப்பம்/ஒப்புக்கொடுத்தல்: ‘செய்வாராக’'
  alternative: 'எளிய எதிர்காலம்: ‘செய்வார்’'
  rationale: முந்தைய கட்டளையும் கூட்டு ஊக்குவிப்பும் தொடர்ந்து வருவதால் விருப்பப் பொருள் சூழலுக்கு நன்கு பொருந்துகிறது; எனினும் எபிரெய வடிவம் எளிய எதிர்கால வாசிப்பையும் அனுமதிப்பதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. ‘திடன்கொள்ளுங்கள் / திடன்கொள்வோம்’ என்ற இணை அமைப்பு மூலத்தின் ஒரே வேர்ச்சொல் மீளுருவத்தையும் போர்ச் சூழலின் ஊக்கத்தையும் காக்கிறது. மரியாதை ஒருமைக்கான ‘தமது’ யாவேயைக் குறிக்கிறது.
