- from: ஆகவே ஆனூன் தாவீதின் பணியாளர்களைப் பிடித்து, அவர்களுடைய தாடியில் பாதியை மழித்தான்; அவர்களுடைய ஆடைகளை நடுவிலிருந்து புட்டப்பகுதி வரை[a] வெட்டிவிட்டு, அவர்களை அனுப்பிவிட்டான்.
  to: அப்போது ஆனூன் தாவீதின் பணியாளர்களை அழைத்துக்கொண்டு, அவர்களுடைய தாடிகளில் பாதியைச் சிரைத்தான்; அவர்களுடைய ஆடைகளை நடுப்பகுதியில், அவர்களுடைய பின்புறப் பகுதி வரை[a] வெட்டி, அவர்களை அனுப்பிவிட்டான்.
