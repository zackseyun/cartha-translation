base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/004.yaml
  text: So Hanun took David’s servants[a], shaved off half of their beards, cut off their garments in the middle up to their buttocks, and sent them away.
translation:
  language: ta
  text: அப்போது ஆனூன் தாவீதின் பணியாளர்களை அழைத்துக்கொண்டு, அவர்களுடைய தாடிகளில் பாதியைச் சிரைத்தான்; அவர்களுடைய ஆடைகளை நடுப்பகுதியில், அவர்களுடைய பின்புறப் பகுதி வரை[a] வெட்டி, அவர்களை அனுப்பிவிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களுடைய பின்புறம் வரை” அல்லது “அவர்களுடைய மறைவுறுப்புப் பகுதி வரை” என்றும் மொழிபெயர்க்கலாம். இதற்கான எபிரெயச் சொல் அரிதானது; அது குறிக்கும் சரியான உடற்பகுதி விவாதத்திற்குரியது. ஆனூன் அவர்களுடைய ஆடைகளை மிகவும் குட்டையாக வெட்டி, அவர்களை அவமானப்படுத்தும் வகையில் வெளிப்படுத்தினான் என்பதே கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: பிடித்து
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’ என்பதாக இருந்தாலும், இங்கு தூதர்களைத் தன் கட்டுப்பாட்டுக்குள் கொண்டுவந்து அவமதித்த சூழலில் ‘பிடித்து’ என்பது இயல்பாக உள்ளது; ‘கைதுசெய்து’ என்ற அளவுக்கு பொருளை வலுப்படுத்தவில்லை.
- source_word: עַבְדֵי דָוִד
  choice: தாவீதின் பணியாளர்கள்
  rationale: עבד என்பது அடிமை, பணியாளர், அரச அலுவலர் ஆகிய பொருள்களைக் கொள்ளலாம். இவர்கள் அரசரின் சார்பில் சென்ற தூதர்கள் என்பதால், ‘பணியாளர்கள்’ என்பது அந்தப் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: וַיְגַלַּח אֶת חֲצִי זְקָנָם
  choice: அவர்களுடைய தாடியில் பாதியை மழித்தான்
  rationale: ஒவ்வொருவருடைய தாடியிலும் ஒரு பாதி மழிக்கப்பட்ட அவமானச் செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיִּכְרֹת אֶת מַדְוֵיהֶם בַּחֵצִי
  choice: அவர்களுடைய ஆடைகளை நடுவிலிருந்து … வெட்டிவிட்டு
  rationale: כרת என்பது ‘வெட்டு/வெட்டிவிடு’; מַדְוֵי என்பது குறிப்பிட்ட ஆடை வகையை உறுதியாகச் சொல்லாததால் ‘ஆடைகள்’ எனப் பொதுவாக மொழிபெயர்க்கப்பட்டது. בַּחֵצִי ஆடையின் நடுப்பகுதியில் வெட்டியதைச் சுட்டுகிறது.
- source_word: עַד שְׁתוֹתֵיהֶם
  choice: புட்டப்பகுதி வரை[a]
  rationale: שְׁתוֹת என்பது அரிதான சொல்; பின்புறத்தின் கீழ்ப்பகுதி அல்லது புட்டங்களைக் குறிக்கலாம். அவமானப்படுத்தும் நோக்கில் உடலை வெளிப்படுத்திய சூழலை நேரடியாகக் காட்டும் வகையில் ‘புட்டப்பகுதி’ தேர்ந்தெடுக்கப்பட்டது; நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: וַיְשַׁלְּחֵם
  choice: அவர்களை அனுப்பிவிட்டான்
  rationale: שלח இங்கு அவமதித்த பின் அவர்களை அங்கிருந்து அனுப்பியதைக் குறிக்கிறது. ‘அனுப்பிவிட்டான்’ தமிழ் கதைநடையில் இயல்பாக உள்ளது.
