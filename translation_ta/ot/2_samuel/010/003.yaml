revisions:
- from: அம்மோனியரின் தலைவர்கள் தங்கள் ஆண்டவனாகிய ஆனூனிடம், “தாவீது உனக்கு ஆறுதல் கூறுவோரை[a] அனுப்பியிருப்பதால், அவர் உன் தந்தையை உன் பார்வையில் மதிக்கிறார் என்று நினைக்கிறாயா? இந்த நகரை ஆராய்ந்து, உளவுபார்த்து, அதைக் கவிழ்ப்பதற்காகத்தானே தாவீது தன் பணியாளர்களை உன்னிடம் அனுப்பியிருக்கிறார்?” என்றார்கள்.
