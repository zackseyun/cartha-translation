  text: וַ/יֹּאמְרוּ֩ שָׂרֵ֨י בְנֵֽי עַמּ֜וֹן אֶל חָנ֣וּן אֲדֹֽנֵי/הֶ֗ם הַֽ/מְכַבֵּ֨ד דָּוִ֤ד אֶת אָבִ֨י/ךָ֙ בְּ/עֵינֶ֔י/ךָ כִּֽי שָׁלַ֥ח לְ/ךָ֖ מְנַֽחֲמִ֑ים הֲ֠/לוֹא בַּ/עֲב֞וּר חֲק֤וֹר אֶת הָ/עִיר֙ וּ/לְ/רַגְּלָ֣/הּ וּ/לְ/הָפְכָ֔/הּ שָׁלַ֥ח דָּוִ֛ד אֶת עֲבָדָ֖י/ו אֵלֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/003.yaml
  text: And the princes of the Ammonites said to Hanun their lord[a], “Is David honoring your father in your sight because he has sent comforters to you? Has not David sent his servants to you in order to search the city, to spy it out[c][b], and to overthrow it?”
translation:
  language: ta
  text: அம்மோனியரின் தலைவர்கள் தங்கள் ஆண்டவனான ஆனூனிடம், “தாவீது உனக்கு ஆறுதல் கூறுவோரை அனுப்பியதால், உன் பார்வையில் அவர் உன் தந்தையை மதிக்கிறாரா? இந்த நகரை ஆராயவும், அதை உளவு பார்க்கவும், அதைக் கவிழ்க்கவும் அல்லவா தாவீது தன் பணியாளர்களை உன்னிடம் அனுப்பியிருக்கிறார்?” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי בְנֵי עַמּוֹן
  choice: அம்மோனியரின் தலைவர்கள்
  rationale: שָׂרִים என்பது அரசவையிலுள்ள தலைவர்கள், அதிகாரிகள் அல்லது பிரபுக்களைக் குறிக்கலாம். நவீன தமிழில் அரசியல் ஆலோசகர்களின் பங்கை இயல்பாக வெளிப்படுத்த “தலைவர்கள்” தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲדֹנֵיהֶם
  choice: தங்கள் ஆண்டவனாகிய
  rationale: இங்கு אדון மனித அரசருக்குரிய அதிகாரப் பட்டம்; தெய்வீகப் பெயர் அல்ல. “ஆண்டவன்” அரசருக்கான மரியாதையையும் கீழ்ப்படிதல் உறவையும் காக்கிறது.
- source_word: הַמְכַבֵּד
  choice: மதிக்கிறார்
  rationale: כבד இங்கு ஒருவருக்கு மதிப்பு அல்லது மரியாதை அளிப்பதைக் குறிக்கிறது; இறையியல் சார்ந்த மகிமைப்படுத்தலை அல்ல.
- source_word: בְּעֵינֶיךָ
  choice: உன் பார்வையில்
  rationale: “உன் கண்களில்” என்ற எபிரெய உருவகத்தின் பொருளை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: מְנַחֲמִים
  choice: ஆறுதல் கூறுவோர்
  rationale: தந்தையின் மரணத்திற்குப் பின் அனுதாபம் தெரிவிக்க அனுப்பப்பட்டவர்களைச் சுட்டுகிறது; எபிரெய பங்கேற்பு வடிவையும் தெளிவாகக் காட்டுகிறது.
- source_word: הֲלוֹא
  choice: …தானே
  rationale: கேட்பவரின் ஒப்புதலை எதிர்பார்க்கும் குற்றஞ்சாட்டும் வினாவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּעֲבוּר
  choice: …பதற்காக
  rationale: தொடரும் மூன்று செயல்களின் நோக்கத்தைக் குறிக்கும் எபிரெய அமைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: חֲקוֹר
  choice: ஆராய்ந்து
  rationale: חקר நகரைப் பரிசோதித்தல் அல்லது ஆராய்தல் என்னும் பொருளை உடையது; அடுத்துள்ள உளவுச் செயலிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: וּלְרַגְּלָהּ
  choice: உளவுபார்த்து
  rationale: Piel வடிவிலுள்ள רגל இராணுவ நோக்கில் உளவு பார்த்தல் அல்லது வேவு பார்த்தலைக் குறிக்கிறது.
- source_word: וּלְהָפְכָהּ
  choice: அதைக் கவிழ்ப்பதற்கு
  rationale: הפך என்பதன் “கவிழ்த்தல்/தலைகீழாக்குதல்” நுணுக்கத்தையும் நகரை வீழ்த்தும் பகை நோக்கத்தையும் காக்கிறது; முழுமையாக அழித்தல் என்ற அதிகப்படியான விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: עֲבָדָיו
  choice: தன் பணியாளர்கள்
  rationale: தாவீதின் அரசப் பணியில் இருந்த தூதர்களைச் சுட்டுகிறது. “பணியாளர்கள்” என்பது நவீன வாசகருக்கு இயல்பாகவும் அரச சேவை உறவைத் தெளிவாகவும் காட்டுகிறது.
theological_decisions:
- issue: அரசியல் சந்தேகம்; உரையாசிரியரின் உறுதிப்படுத்தல் அல்ல
  choice: ஆலோசகர்களின் குற்றச்சாட்டை ஒப்புதலை எதிர்பார்க்கும் வினாக்களாக மொழிபெயர்த்தல்
  alternative: தாவீதின் பகை நோக்கத்தை உரையாசிரியர் உறுதிப்படுத்தும் நேரடிக் கூற்றாக மொழிபெயர்த்தல்
  rationale: எபிரெய உரை அம்மோனியத் தலைவர்களின் சந்தேகத்தை மேற்கோளாகத் தருகிறது; அது உண்மை என்று கதைசொல்லி உறுதிப்படுத்தவில்லை. வினா வடிவம் இந்தப் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் கதையுரைக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. அரசவைச் சூழலில் இயல்பாக ஒலிக்க “தலைவர்கள்,” “ஆண்டவன்,” “பணியாளர்கள்” பயன்படுத்தப்பட்டன. எபிரெயச் சொல்லாட்சியில் உள்ள மூன்று நோக்கச் செயல்களும் தனித்தனியாகப் பாதுகாக்கப்பட்டன.
