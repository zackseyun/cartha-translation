base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/009.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose from all the choice men of Israel and arrayed them to meet Aram.
translation:
  language: ta
  text: போர்முனை தனக்கு எதிராக முன்னும் பின்னும் அமைந்திருந்ததை யோவாப் கண்டபோது, இஸ்ரவேலின் தேர்ந்த வீரர்கள் அனைவரிலிருந்தும் ஆட்களைத் தேர்ந்தெடுத்து[a], அவர்களை அராமை[b] எதிர்கொள்ள அணிவகுத்து நிறுத்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சார்பாக, “இஸ்ரவேலிலுள்ள தேர்ந்தெடுக்கப்பட்ட வீரர்கள் அனைவரிலிருந்தும் அவன் தேர்ந்தெடுத்தான்.”
    reason: lexical_alternative
  - marker: b
    text: “அராம்” என்பது இங்கு அராமியப் படைகளைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டபோது
  rationale: ראה என்பதன் அடிப்படைப் பொருளான ‘காணுதல்’ என்பதைக் காத்து, இங்கு போர்ச் சூழலை உணர்ந்ததையும் இயல்பாக உணர்த்துகிறது.
- source_word: פְּנֵי הַמִּלְחָמָה
  choice: போர்முனை
  rationale: சொல்லுக்கு சொல் ‘போரின் முகம்’; இராணுவச் சூழலில் எதிர்த்து நிற்கும் போர்வரிசை அல்லது போர்முனையைக் குறிக்கிறது.
- source_word: הָיְתָה אֵלָיו
  choice: தனக்கு ... அமைந்திருந்ததை
  rationale: போர்முனை யோவாபுக்கு எதிராக நிலைநிறுத்தப்பட்டிருந்த இராணுவச் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִפָּנִים וּמֵאָחוֹר
  choice: முன்னும் பின்னும்
  rationale: இருபுறத்திலிருந்த அச்சுறுத்தலைச் சுருக்கமாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: וַיִּבְחַר מִכֹּל בְּחוּרֵי בְיִשְׂרָאֵל
  choice: இஸ்ரவேலின் தேர்ந்த வீரர்கள் அனைவரிலிருந்தும் ஆட்களைத் தேர்ந்தெடுத்து
  rationale: מִכֹּל என்பதன் ‘அனைவரிலிருந்தும்’ என்ற பொருளையும், בְּחוּרֵי என்பதன் சிறப்பாகத் தேர்ந்தெடுக்கப்பட்ட போர்வீரர்கள் என்ற கருத்தையும் காக்கிறது; எத்தனை பேரைத் தேர்ந்தெடுத்தான் என்று மூலத்தில் இல்லாததைச் சேர்க்கவில்லை.
- source_word: וַיַּעֲרֹךְ
  choice: அணிவகுத்து நிறுத்தினான்
  rationale: இராணுவப் பயன்பாட்டில் ערך என்பது போருக்காக வீரர்களை ஒழுங்குபடுத்தி நிறுத்துவதைக் குறிக்கிறது.
- source_word: לִקְרַאת אֲרָם
  choice: அராமை எதிர்கொள்ள
  rationale: לקראת என்பதன் சந்திக்க அல்லது எதிர்கொள்ள என்ற பொருளை இங்குள்ள போர்ச் சூழலுக்கு ஏற்றவாறு தருகிறது.
- source_word: אֲרָם
  choice: அராம்
  rationale: பிற்காலப் புவியியல் பெயரைப் பயன்படுத்தாமல் எபிரெயப் பெயரைத் தக்கவைக்கிறது; இங்கு அது அராமியப் படைகளை மொத்தமாகக் குறிக்கிறது.
