  text: After this, the king of the Ammonites died, and Hanun his son became king in his place.
translation:
  language: ta
  text: இதற்குப் பிறகு அம்மோனியரின் அரசன் இறந்தான்; அவனுடைய மகன் ஹானூன் அவனுக்குப் பதிலாக அரசனானான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: அம்மோனியரின் அரசன்
  rationale: எபிரேய மொழியில் உள்ள ‘அம்மோனின் மக்களின் அரசன்’ என்ற இனக்குழுக் குறிப்பை இயல்பான நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசனானான்
  rationale: இவ்விடத்தில் வினைச்சொல் ஆட்சிப் பொறுப்பை ஏற்றதைச் சுட்டுகிறது; ‘ஆட்சி செய்தான்’ என்பதைக் காட்டிலும், தந்தையின் இடத்தில் அரசனானான் என்பது சூழலுக்கும் மூலத்தின் அர்த்தத்திற்கும் துல்லியமாகப் பொருந்துகிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: முன்னிருந்த அரசனைத் தொடர்ந்து அவன் இடத்தை ஏற்ற வாரிசுரிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
