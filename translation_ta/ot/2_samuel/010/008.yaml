  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிதான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரு தனித்த படைநிலைகளை இரண்டு வாக்கியங்களாகத் தெளிவுபடுத்தியுள்ளோம்; அசல் பொருளின் தொடர்ச்சியும் வேறுபாடும் தக்கவைக்கப்பட்டுள்ளன.
