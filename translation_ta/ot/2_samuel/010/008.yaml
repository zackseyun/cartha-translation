revisions:
- from: அம்மோனின் புதல்வர்கள்[a] வெளியே வந்து, நகரவாசலின் நுழைவிடத்தில் போருக்கு அணிவகுத்து நின்றார்கள். சோபாவின் அராமியரும் ரெகோபின் அராமியரும், தோபின் ஆட்களும்[b] மாக்காவின் ஆட்களும் அவர்களிடமிருந்து தனியாக வயல்வெளியில் நின்றார்கள்.
  to: அம்மோனின் புதல்வர்கள்[a] வெளியே வந்து, வாசலின் நுழைவிடத்தில் போருக்கு அணிவகுத்து நின்றார்கள். சோபா மற்றும் ரெகோபைச் சேர்ந்த அராமியரும், தோபின் ஆட்களும்[b] மாக்காவும் தனியாக வயல்வெளியில் நின்றார்கள்.
  rationale: 'The revision removes the unsupported explicit noun from “Maacah,” retains the source’s military-list ellipsis, and removes the ambiguous added referent in the phrase for the allied forces’ separate position. It also uses consistent Tamil transliterations for Rehob and Tob. The two existing footnote anchors remain correctly attached: [a] to “அம்மோனின் புதல்வர்கள்” and [b] to the disputed “தோபின் ஆட்கள்.”'
