base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/008.yaml
  text: Then the sons of Ammon came out and drew up for battle at the entrance of the gate[b][a], while Aram of Zobah and Rehob and the men of Tob and Maacah were by themselves in the field.
translation:
  language: ta
  text: அம்மோனின் புதல்வர்கள்[a] வெளியே வந்து, வாசலின் நுழைவிடத்தில் போருக்கு அணிவகுத்து நின்றார்கள். சோபா மற்றும் ரெகோபைச் சேர்ந்த அராமியரும், தோபின் ஆட்களும்[b] மாக்காவும் தனியாக வயல்வெளியில் நின்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அம்மோனியர்கள்.” எபிரெய மூலத்தில் “அம்மோனின் புதல்வர்கள்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஈஷ்-தோபும்.” எபிரெயச் சொற்றொடரை “தோபின் ஆட்கள்” என்றும், “ஈஷ்-தோப்” என்ற இடப்பெயராகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: வெளியே வந்து
  rationale: יצא என்பது இப்போர்ச் சூழலில் நகரிலிருந்து வெளியே வருவதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּנֵי עַמּוֹן
  choice: அம்மோனின் புதல்வர்கள்
  rationale: எபிரெய மொழியின் ‘அம்மோனின் புதல்வர்கள்’ என்ற இனப்பெயர்க் கட்டமைப்பைத் தக்கவைக்கிறது; ‘அம்மோனியர்கள்’ என்பது இயல்பான மாற்று.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: போருக்கு அணிவகுத்து நின்றார்கள்
  rationale: ערך + מלחמה படைகளைப் போருக்காக ஒழுங்குபடுத்தி நிறுத்தும் இராணுவப் பொருளைக் கொண்டது.
- source_word: פֶּתַח הַשָּׁעַר
  choice: நகரவாசலின் நுழைவிடத்தில்
  rationale: פתח என்பது திறப்பு அல்லது நுழைவிடம்; சூழலில் இது நகரவாசலைக் குறிப்பதால் ‘நகரவாசல்’ தெளிவளிக்கிறது.
- source_word: וַאֲרַם צוֹבָא וּרְחוֹב
  choice: சோபாவின் அராமியரும் ரெகோபின் அராமியரும்
  rationale: אֲרַם இங்கு கூட்டுப்படையினரான அராமியர்களைக் குறிக்கிறது. ஒருங்கிணைந்த தொடரமைப்பில் ‘அராமியர்’ இரு இடங்களுக்கும் இயல்பாகப் பொருந்துகிறது.
- source_word: וְאִישׁ טוֹב
  choice: தோபின் ஆட்களும்
  rationale: אִישׁ טוֹב என்பதை ‘தோபின் ஆட்கள்’ என்று புரிந்துகொள்ளலாம்; ‘ஈஷ்-தோப்’ என்ற இடப்பெயர் வாசிப்பும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּמַעֲכָה
  choice: மாக்காவின் ஆட்களும்
  rationale: இணையான படைப்பிரிவுகளின் பட்டியலில் மாக்காவைச் சேர்ந்த ஆட்கள் என்பது தமிழில் தெளிவாகிறது.
- source_word: לְבַדָּם בַּשָּׂדֶה
  choice: அவர்களிடமிருந்து தனியாக வயல்வெளியில்
  rationale: לְבַדָּם அம்மோனியப் படையிலிருந்து தனித்திருப்பதையும், שָׂדֶה வாசல் பகுதியிலிருந்து வேறான வயல்வெளியையும் குறிக்கிறது; ‘திறந்த வெளி’ என்ற கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
