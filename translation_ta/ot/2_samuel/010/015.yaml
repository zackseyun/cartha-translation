  text: When Aram saw that it had been defeated before Israel[a], they gathered together.
translation:
  language: ta
  text: அராம் இஸ்ரவேலுக்கு முன்பாகத் தோற்கடிக்கப்பட்டதைக் கண்டபோது, அவர்கள் ஒன்றுகூடினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ஒருமை வடிவிலுள்ள ‘அராம்’ என்ற தனிப்பெயர் இங்கு அராமியர்களை கூட்டாகக் குறிக்கிறது; அதனால் அடுத்த வினை பன்மையில் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டபோது
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுத்துச் செல்கிறது; அடுத்த செயலைச் சூழ்நிலைப்படுத்தும் காலத் தொடர்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲרָם
  choice: சீரியர்கள்
  rationale: ஒருமை வடிவிலுள்ள ‘அராம்’ என்னும் பெயர் இங்கு அராமிய மக்களையோ படையையோ கூட்டாகக் குறிக்கிறது. நவீன தமிழ் வாசகருக்குப் பரிச்சயமான ‘சீரியர்கள்’ என்பது அந்தக் கூட்டுப் பொருளைத் தெளிவாக்குகிறது; பெயரின் நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי
  choice: …என்பதை
  rationale: அராம் கண்டறிந்த செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; காரணத்தைக் குறிக்கவில்லை.
- source_word: נִגַּף
  choice: தோற்கடிக்கப்பட்டதை
  rationale: நிஃபால் வடிவம் போரில் தோல்வியடைந்த நிலையைச் சுட்டுகிறது; எவ்வாறு தோற்கடிக்கப்பட்டார்கள் என்பதைத் தேவையின்றி குறிப்பாக்காமல் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: போர்ச் சூழலில் ‘எதிரில்’ அல்லது ‘வல்லமைக்கு முன்’ என்ற பொருளைத் தருகிறது; எபிரெயச் சொல்லமைப்பையும் அதன் போர்சார் நுணுக்கத்தையும் காக்கிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: וַיֵּאָסְפוּ
  choice: ஒன்றுகூடினார்கள்
  rationale: நிஃபால் வடிவிலுள்ள வினை ‘கூடுதல், திரளுதல்’ என்று பொருள்படும்; ‘மீண்டும் அணிதிரண்டார்கள்’ போன்ற கூடுதல் இராணுவப் பொருளைச் சேர்க்காமல் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: יָחַד
  choice: ஒன்று-
  rationale: ‘ஒன்றாக, சேர்ந்தே’ என்ற வினையடைப் பொருளை ‘ஒன்றுகூடினார்கள்’ என்ற இயல்பான தமிழ் வினையில் உள்ளடக்குகிறது.
