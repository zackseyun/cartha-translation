base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/006.yaml
  text: When the sons of Ammon saw that they had become odious to David[a], the sons of Ammon sent and hired the Arameans of Beth-rehob and the Arameans of Zobah, twenty thousand foot soldiers, and the king of Maacah with one thousand men, and the men of Tob[c][b], twelve thousand men.
translation:
  language: ta
  text: அம்மோனியர்கள் தாங்கள் தாவீதுக்கு அருவருப்பானவர்களாகிவிட்டதை[a] உணர்ந்தபோது, அவர்கள் அனுப்பி பெத்-ரெகோபைச் சேர்ந்த அராமியர்களையும்[c] சோபாவைச் சேர்ந்த அராமியர்களையும்—இருபதாயிரம் காலாட் வீரர்களை—கூலிக்கு அமர்த்தினர்; மாக்காவின் அரசனையும் அவனுடன் ஆயிரம் பேரையும், தோபைச் சேர்ந்தவர்களையும்[b]—பன்னிரண்டாயிரம் பேரை—அமர்த்தினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “தாங்கள் தாவீதுக்குத் துர்நாற்றமாகிவிட்டதை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஈஷ்-தோப்”; இதை ஓர் இடத்தின் அல்லது குலத்தின் பெயராக எடுத்துக்கொள்ளவும் வாய்ப்புள்ளது. இங்கே “தோபைச் சேர்ந்தவர்கள்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: c
    text: எபிரெயத்தில் “அராம்”; மரபாக “சீரியா/சீரியர்கள்” என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: உணர்ந்தபோது
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘காணுதல்’; இங்கு சூழ்நிலையை உணர்ந்துகொண்டதைக் குறிக்கும் இயல்பான தமிழ் நடை பொருத்தமானது.
- source_word: בְּנֵי עַמּוֹן
  choice: அம்மோனியர்கள்
  rationale: ‘அம்மோனின் மகன்கள்’ என்ற சொற்சொல் வடிவத்தைவிட, இன்றைய தமிழில் இனத்தாரைக் குறிக்கும் தெளிவான இயல்பான வடிவம்.
- source_word: נִבְאֲשׁוּ בְּדָוִד
  choice: தாங்கள் தாவீதுக்கு அருவருப்பானவர்களாகிவிட்டதை
  rationale: באשׁ துர்நாற்றத்தின் உருவகத்திலிருந்து வெறுப்புக்குரியவர்களாதல் அல்லது அருவருப்பானவர்களாதல் என்ற பொருளைத் தருகிறது; உருவகத்தை அடிக்குறிப்பில் பாதுகாத்து, முதன்மை உரையில் பொருளை இயல்பாகத் தருகிறது.
- source_word: וַיִּשְׁלְחוּ
  choice: ஆள் அனுப்பி
  rationale: எபிரெயத்தில் அனுப்பப்பட்ட பொருள் வெளிப்படையாக இல்லை. தமிழில் தொடர்வினையைத் தெளிவாக்க ‘ஆள்’ என்பது குறைந்தளவு சூழல்சார் நிரப்பல்; குறிப்பிட்ட தூதர்களைச் சேர்ப்பதில்லை.
- source_word: וַיִּשְׂכְּרוּ
  choice: கூலிக்கு அமர்த்தினார்கள்
  rationale: இராணுவ உதவியைப் பணம் கொடுத்து அமர்த்திய செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֲרַם בֵּית רְחוֹב
  choice: பெத்-ரெகோபைச் சேர்ந்த அராமியர்கள்
  rationale: אֲרַם என்பதைக் காலப்பொருத்தமான ‘அராம்/அராமியர்’ என வழங்குகிறது; בית רחוב இடப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֲרַם צוֹבָא
  choice: சோபாவைச் சேர்ந்த அராமியர்கள்
  rationale: இனப்பெயரையும் இடப்பெயரையும் தனித்தெளிவாகக் காட்டும் இயல்பான தமிழ் அமைப்பு.
- source_word: עֶשְׂרִים אֶלֶף רַגְלִי
  choice: காலாட்படையினர் இருபதாயிரம் பேர்
  rationale: רַגְלִי குறிக்கும் காலாட்படை வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: מֶלֶךְ מַעֲכָה
  choice: மாக்காவின் அரசன்
  rationale: இது மாக்கா என்ற பகுதியின் அரசன் என்பதைக் கட்டமைப்பு காட்டுகிறது; அரசனின் தனிப்பெயராக எடுத்துக்கொள்ளவில்லை.
- source_word: אִישׁ טוֹב
  choice: தோபைச் சேர்ந்தவர்கள்
  rationale: இணையான 1 நாளாகமம் 19:6 மற்றும் இராணுவப் பட்டியல் சூழல் இதை தோப் பகுதியைச் சேர்ந்த ஆட்களாகப் புரிந்துகொள்ள ஆதரிக்கின்றன; ‘ஈஷ்-தோப்’ என்ற வாசிப்புச் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: பன்னிரண்டாயிரம் பேர்
  rationale: எண்ணிக்கையை நேரடியாகவும் இராணுவப் பட்டியல் நடைக்கு ஏற்றவாறும் வழங்குகிறது.
