- from: அம்மோனியர்கள் தாங்கள் தாவீதுக்கு அருவருப்பானவர்களாகிவிட்டதை[a] உணர்ந்தபோது, பெத்-ரெகோபைச் சேர்ந்த அராமியர்களையும் சோபாவைச் சேர்ந்த அராமியர்களையும்—காலாட்படையினர் இருபதாயிரம் பேரை—மாக்காவின் அரசனையும் அவனோடு ஆயிரம் பேரையும், தோபைச் சேர்ந்தவர்களையும்[b]—பன்னிரண்டாயிரம் பேரை—ஆள் அனுப்பிக் கூலிக்கு அமர்த்தினார்கள்.[c]
  to: அம்மோனியர்கள் தாங்கள் தாவீதுக்கு அருவருப்பானவர்களாகிவிட்டதை[a] உணர்ந்தபோது, அவர்கள் அனுப்பி பெத்-ரெகோபைச் சேர்ந்த அராமியர்களையும்[c] சோபாவைச் சேர்ந்த அராமியர்களையும்—இருபதாயிரம் காலாட் வீரர்களை—கூலிக்கு அமர்த்தினர்; மாக்காவின் அரசனையும் அவனுடன் ஆயிரம் பேரையும், தோபைச் சேர்ந்தவர்களையும்[b]—பன்னிரண்டாயிரம் பேரை—அமர்த்தினர்.
  rationale: மூலத்தில் குறிப்பிடப்படாத அனுப்பப்பட்ட நபரின் அடையாளத்தைச் சேர்க்காமல் “அனுப்பி” எனத் திருத்தப்பட்டது. மூன்று கூலிப்படைப் பிரிவுகளும் அவற்றின் எண்ணிக்கைகளும் மூலத்தின் பட்டியல் அமைப்புக்கு ஏற்பத் தெளிவுபடுத்தப்பட்டன. அராம் குறித்த அடிக்குறிப்பு தொடர்புடைய சொல்லுடன் இணைக்கப்பட்டது; துர்நாற்ற உருவகத்தின் அடிக்குறிப்பும் இயல்பாக்கப்பட்டது.
