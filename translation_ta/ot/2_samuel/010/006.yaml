translation_notes:
  register: நவீனச் செந்தமிழ்ச் சார்ந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் வரலாற்று-இராணுவ நடை. மக்கள் பெயர்களுக்கு இயல்பான தமிழ்ப் பன்மை வடிவமும், இடப்பெயர்களுக்கு நிலையான ஒலிபெயர்ப்பும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் பட்டியல் அமைப்பை இடைக்கோடுகள் மூலம் தெளிவாக்கியுள்ளோம்; உண்மையான சொற்பொருள் மற்றும் வாசிப்பு மாற்றுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
