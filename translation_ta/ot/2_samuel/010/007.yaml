  text: וַ/יִּשְׁמַ֖ע דָּוִ֑ד וַ/יִּשְׁלַח֙ אֶת יוֹאָ֔ב וְ/אֵ֥ת כָּל הַ/צָּבָ֖א הַ/גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/007.yaml
  text: When David heard[a], he sent Joab and all the army of the mighty men.
translation:
  language: ta
  text: தாவீது கேட்டபோது, யோவாபையும் வலிமைமிக்க வீரர்களின் படை முழுவதையும்[a] அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “படை முழுவதையும், அதாவது வலிமைமிக்க வீரர்களையும்.” எபிரெயத்தில் ‘வலிமைமிக்க வீரர்கள்’ என்பது ‘படை’ என்பதற்கு விளக்கமாகவும், அல்லது அந்தப் படை யாரைக் கொண்டது என்பதைக் குறிப்பதாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע דָּוִד
  choice: தாவீது அதைக் கேட்டபோது
  rationale: שׁמע என்பதன் அடிப்படைப் பொருள் ‘கேள்’. எபிரெய தொடர் நிகழ்வை இயல்பான தமிழில் காட்ட ‘கேட்டபோது’ என மொழிபெயர்க்கப்பட்டது. கேட்கப்பட்ட பொருள் வசனத்தில் வெளிப்படையாக இல்லாவிட்டாலும், முந்தைய சூழலைச் சுட்ட இயல்பான தமிழுக்காக ‘அதை’ சேர்க்கப்பட்டது.
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினார்
  rationale: שׁלח என்பதன் எளிய பொருள் ‘அனுப்பு’; இராணுவச் சூழலிலும் நேரடியான இந்தச் சொல்லே பொருத்தமானது.
- source_word: אֶת יוֹאָב
  choice: யோவாபையும்
  rationale: אֶת என்னும் நேரடிச் செயப்படுபொருள் குறியீடு தனியாக மொழிபெயர்க்கப்படவில்லை; וְאֵת உடன் இணையும் இரு செயப்படுபொருட்களில் முதலாவதைத் தமிழின் ‘-ஐயும்’ வடிவம் காட்டுகிறது.
- source_word: וְאֵת כָּל הַצָּבָא
  choice: படை முழுவதையும்
  rationale: צָבָא இங்கு இராணுவப் படையைக் குறிக்கிறது. כָּל என்பதன் முழுமையை இயல்பான தமிழில் ‘முழுவதையும்’ காட்டுகிறது.
- source_word: הַגִּבֹּרִים
  choice: வலிமைமிக்க வீரர்களின்
  rationale: גִּבֹּרִים என்பது வலிமைமிக்க அல்லது மாவீரர்களைக் குறிக்கும். ‘வலிமைமிக்க வீரர்கள்’ அதன் சொற்பொருளைப் பாதுகாக்கிறது; அதேவேளை குறிப்பிட்ட உயர்தரப் படைப்பிரிவு என்று மிகையாகத் தீர்மானிப்பதில்லை.
