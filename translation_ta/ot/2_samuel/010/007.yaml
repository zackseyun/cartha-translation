translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘தாவீது’, ‘யோவாப்’ என்ற வழக்கமான வேதாகமப் பெயர்வடிவங்கள் பயன்படுத்தப்பட்டன. மூலத்தின் தொடர்நிகழ்வு தமிழில் காலத் துணைவாக்கியமாக அமைக்கப்பட்டது; படைக்கும் வீரர்களுக்கும் இடையிலான இலக்கண உறவின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
