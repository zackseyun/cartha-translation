  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. இராணுவச் சூழலைத் தெளிவாக்க ‘படைவீரர்கள்’, ‘கட்டுப்பாட்டில்’, ‘போரணி’ ஆகிய சொற்கள் பயன்படுத்தப்பட்டன; எபிரெய மரபுத்தொடர்களின் நேரடி வடிவங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டன.
