base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/010.yaml
  text: And the rest of the people he put under the command of Abishai his brother[c][b][a], and he drew them up to meet the sons of Ammon.
translation:
  language: ta
  text: மீதமிருந்த படைவீரர்களைத் தன் சகோதரனான அபிசாயின் அதிகாரத்தின்கீழ் ஒப்படைத்தான்.[a] அம்மோனின் மக்களை[b] எதிர்கொள்ளும்படி அவர்களைப் போரணியில் நிறுத்தினான்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “அபிசாயின் கையில் கொடுத்தான்”; இது படைவீரர்களை அவனது அதிகாரத்தின்கீழ் ஒப்படைத்ததைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அம்மோனியர்களை.” எபிரெயத்தில், “அம்மோனின் மகன்களை.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவர்களை அணிவகுத்தான்” / “போர்வரிசையை அமைத்தான்.” எபிரெய வினை படைகளைப் போருக்கான அணியில் நிறுத்துவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: மீதியிருந்த படைவீரர்கள்
  rationale: יֶתֶר என்பது மீதியிருப்போரைக் குறிக்கிறது; הָעָם என்பதன் நேரடிப் பொருள் ‘மக்கள்’ என்றாலும், இப்போர்ச் சூழலில் மீதியிருந்த சண்டைப் படையினரையே குறிக்கிறது. எனவே நவீனத் தமிழில் சூழலைத் தெளிவுபடுத்தும் வகையில் ‘படைவீரர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: נָתַן בְּיַד
  choice: கட்டுப்பாட்டில் ஒப்படைத்து
  rationale: ‘கையில் கொடுத்தான்’ என்ற எபிரெய மரபுத்தொடர் இங்கு படையினரை ஒருவரின் அதிகாரத்தின்கீழ் ஒப்படைப்பதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் இராணுவப் பொருள் தெளிவாகவும் இருக்க இவ்வாறு வழங்கப்பட்டது.
- source_word: אַבְשַׁי
  choice: அபிசாய்
  rationale: தனிப்பெயர் நவீனத் தமிழில் வாசிக்க ஏற்ற ஒலிபெயர்ப்பு மரபின்படி வழங்கப்பட்டது.
- source_word: אָחִיו
  choice: தன் சகோதரன்
  rationale: பின்னொட்டு யோவாபின் சகோதரனான அபிசாயைக் குறிக்கிறது; மூலத்தில் வெளிப்படையாக உள்ள உறவுமுறை தக்கவைக்கப்பட்டது.
- source_word: וַיַּעֲרֹךְ
  choice: அவர்களைப் போரணியில் நிறுத்தினான்
  rationale: ערך என்ற வினை இராணுவச் சூழலில் படைகளைப் போருக்கான ஒழுங்கில் அணிவகுக்கச் செய்வதைக் குறிக்கிறது. ‘போரணியில் நிறுத்தினான்’ என்பது அந்தக் குறிப்பிட்ட பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לִקְרַאת
  choice: எதிர்கொள்ளும்படி
  rationale: לִקְרַאת என்பதற்கு அடிப்படையில் ‘சந்திக்க/எதிர்கொள்ள’ என்ற பொருள் உண்டு; போர்ச் சூழலின் பகைமைத் தன்மையைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘எதிர்கொள்ளும்படி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּנֵי עַמּוֹן
  choice: அம்மோனின் மக்கள்
  rationale: எபிரெய வெளிப்பாடு நேரடியாக ‘அம்மோனின் மகன்கள்’ என்று பொருள்படும். இனக்குழுவைக் குறிக்கும் இந்த மரபுத்தொடரின் வடிவத்தை ஓரளவு தக்கவைத்தும் தமிழில் புரியத்தக்கவாறும் ‘அம்மோனின் மக்கள்’ என வழங்கப்பட்டது.
