source:
  edition: WLC
  text: וַ/יִּרְא֨וּ כָֽל הַ/מְּלָכִ֜ים עַבְדֵ֣י הֲדַדְעֶ֗זֶר כִּ֤י נִגְּפוּ֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּשְׁלִ֥מוּ אֶת יִשְׂרָאֵ֖ל וַ/יַּֽעַבְד֑וּ/ם וַ/יִּֽרְא֣וּ אֲרָ֔ם לְ/הוֹשִׁ֥יעַ ע֖וֹד אֶת בְּנֵ֥י עַמּֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/019.yaml
  text: When all the kings who were servants of Hadadezer saw that they had been defeated before Israel, they made peace with Israel and served them. So Aram was afraid to save the sons of Ammon anymore.
translation:
  language: ta
  text: அதாதேசருக்குப் பணிபுரிந்த எல்லா அரசர்களும் தாங்கள் இஸ்ரவேலரால் தோற்கடிக்கப்பட்டதைக் கண்டபோது, இஸ்ரவேலரோடு சமாதானம் செய்து, அவர்களுக்குக் கீழ்ப்பட்டு சேவை செய்தார்கள். அதனால், அராம் அம்மோனியருக்கு இனி உதவ அஞ்சியது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדֵי הֲדַדְעֶזֶר
  choice: அதாதேசருக்குப் பணிபுரிந்த
  rationale: עבד என்ற சொல் இங்கு கீழ்ப்பட்ட அரசர்களின் அரசியல் சேவையைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் பொருள் தெளிவாகவும் இருக்க ‘பணிபுரிந்த’ என மொழிபெயர்க்கப்பட்டது.
- source_word: נִגְּפוּ לִפְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலருக்கு முன்பாகத் தோற்கடிக்கப்பட்டது
  rationale: נִגְּפוּ என்பது போரில் முறியடிக்கப்பட்டதைச் சுட்டுகிறது; לִפְנֵי என்பதன் நேரடியான இடைச்சொல் வடிவமும் பாதுகாக்கப்பட்டது.
- source_word: וַיַּשְׁלִמוּ אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலரோடு சமாதானம் செய்து
  rationale: שלם வினையின் ஹிஃபில் வடிவம் இங்கு சமாதான உடன்பாட்டை ஏற்படுத்துவதைக் குறிக்கிறது.
- source_word: וַיַּעַבְדוּם
  choice: அவர்களுக்குப் பணிபுரிந்தார்கள்
  rationale: இறுதியில் உள்ள பன்மைச் சுட்டுப்பெயர் இஸ்ரவேலரைச் சுட்டுகிறது; அரசியல் கீழ்ப்படிதல்/சேவை என்ற பரந்த பொருள் காக்கப்பட்டது.
- source_word: לְהוֹשִׁיעַ
  choice: உதவ
  rationale: ישע என்பதன் அடிப்படைப் பொருள் ‘காப்பாற்றுதல்/விடுவித்தல்’ என்றாலும், போரில் துணைநிற்கும் இச்சூழலில் இயல்பான தமிழாக ‘உதவ’ பொருந்துகிறது; இது அராம் அம்மோனுக்காக மீண்டும் படைத் துணை வழங்காததைக் குறிக்கிறது.
- source_word: בְּנֵי עַמּוֹן
  choice: அம்மோனியர்
  rationale: ‘அம்மோனின் மகன்கள்’ என்ற எபிரெய மரபுத்தொடர் இங்கு அம்மோன் மக்களைக் குறிக்கிறது; நவீன தமிழில் ‘அம்மோனியர்’ என வழங்கப்பட்டது.
theological_decisions:
- issue: לְהוֹשִׁיעַ என்பதன் ‘காப்பாற்ற/உதவ’ வேறுபாடு
  choice: உதவ
  alternative: காப்பாற்ற
  rationale: இது இறையியல் மீட்பைக் குறிக்கும் இடமல்ல; அராமியர் அம்மோனியருக்குப் போரில் துணைபுரிவதைப் பற்றியது. எனவே சூழல்சார் பொருளான ‘உதவ’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; வரலாற்றுக் கதைநடைக்கு ஏற்ற கண்ணியமான, எளிதில் புரியும் நடை. எபிரெய உரையின் நிகழ்வுகளுக்கிடையிலான காரணத் தொடர்பு ‘அதனால்’ என வெளிப்படுத்தப்பட்டுள்ளது.
