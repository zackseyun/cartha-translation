source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אִם תֶּחֱזַ֤ק אֲרָם֙ מִמֶּ֔/נִּי וְ/הָיִ֥תָה לִּ֖/י לִֽ/ישׁוּעָ֑ה וְ/אִם בְּנֵ֤י עַמּוֹן֙ יֶחֱזְק֣וּ מִמְּ/ךָ֔ וְ/הָלַכְתִּ֖י לְ/הוֹשִׁ֥יעַֽ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/011.yaml
  text: He said[a], “If Aram is too strong for me, then you shall help me; but if the Ammonites are too strong for you[b], then I will go to help you.”
translation:
  language: ta
  text: அவன், “அராம் என்னைவிட வலுவடைந்தால், நீ எனக்கு உதவியாக இரு; அம்மோனியர் உன்னைவிட வலுவடைந்தால், நான் போய் உனக்கு உதவுவேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּחֱזַק / יֶחֱזְקוּ
  choice: வலுவடைந்தால்
  rationale: חזק என்பதன் அடிப்படைப் பொருளான ‘வலிமை பெறுதல்/மேலோங்குதல்’ என்பதைப் போர்ச் சூழலில் இயல்பாகத் தெரிவிக்கிறது; எதிரி ஒப்பீட்டளவில் வலிமையடைவதையும் திறந்தவாறே வைக்கிறது.
- source_word: אֲרָם
  choice: அராம்
  rationale: மூலத்தில் உள்ள மக்கள்/அரசியல் அமைப்பின் பெயரைப் பிற்காலப் புவியியல் பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: מִמֶּנִּי / מִמְּךָ
  choice: என்னைவிட / உன்னைவிட
  rationale: חזק உடன் מן ஒப்பீடு அல்லது மேலாதிக்கத்தைக் குறிக்கிறது; தமிழில் ‘-விட’ அதனைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְהָיְתָה לִּי לִישׁוּעָה
  choice: நீ எனக்கு உதவியாக இரு
  rationale: எபிரெயச் சொற்றொடரின் ‘எனக்கு மீட்பாக/துணையாக இரு’ என்ற அமைப்பையும் போர்க்கள உதவியின் நடைமுறைப் பொருளையும் காக்கிறது.
- source_word: לִישׁוּעָה
  choice: உதவி
  rationale: יְשׁוּעָה இங்கு போர்க்கள மீட்பு அல்லது துணையைக் குறிக்கிறது; ‘உதவி’ தேவையற்ற பிற்கால இறையியல் ஒலிப்புகளைச் சேர்க்காமல் சூழலுக்கேற்ற பொருளைத் தருகிறது.
- source_word: בְּנֵי עַמּוֹן
  choice: அம்மோனியர்
  rationale: ‘அம்மோனின் மக்கள்’ என்பதற்கான இயல்பான நவீனத் தமிழ் இனப்பெயர்.
- source_word: וְהָלַכְתִּי לְהוֹשִׁיעַ לָךְ
  choice: நான் போய் உனக்கு உதவுவேன்
  rationale: הלך உடன் வரும் நோக்கவினையின் நகர்வையும், போர்த் துணை வழங்கும் பொருளையும் இயல்பான தமிழில் காக்கிறது.
