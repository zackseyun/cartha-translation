  text: וַ/יָּ֣נָס אֲרָם֮ מִ/פְּנֵ֣י יִשְׂרָאֵל֒ וַ/יַּהֲרֹ֨ג דָּוִ֜ד מֵ/אֲרָ֗ם שְׁבַ֤ע מֵאוֹת֙ רֶ֔כֶב וְ/אַרְבָּעִ֥ים אֶ֖לֶף פָּרָשִׁ֑ים וְ/אֵ֨ת שׁוֹבַ֧ךְ שַׂר צְבָא֛/וֹ הִכָּ֖ה וַ/יָּ֥מָת שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/018.yaml
  text: Aram fled from before Israel[a], and David killed seven hundred charioteers and forty thousand horsemen from Aram. He also struck down Shobach, the commander of their army[b], and he died there.
translation:
  language: ta
  text: அராமியர் இஸ்ரவேலரிடமிருந்து ஓடிப்போனார்கள். தாவீது அராமியரின் தேர்ப்படையைச் சேர்ந்த எழுநூறு பேரையும்[a], நாற்பதாயிரம் குதிரைவீரர்களையும் கொன்றார். அவனுடைய படைத்தலைவனாகிய சோபாக்கையும்[b] அவர் வீழ்த்தினார்; அவன் அங்கே இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “எழுநூறு தேர்/தேர்ப்படை.” இது சரியாக யாரை அல்லது எதைச் சுட்டுகிறது என்பது தெளிவில்லை; தேர்ப்படையினரைக் குறிக்கலாம். 1 நாளாகமம் 19:18-ல் “ஏழாயிரம் தேர்கள்” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது, “அவர்களுடைய படைத்தலைவன்.” எபிரெயச் சுட்டுப்பெயர் ஒருமையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס אֲרָם מִפְּנֵי יִשְׂרָאֵל
  choice: அராமியர் இஸ்ரவேலருக்கு முன்பாகத் தப்பியோடினார்கள்
  rationale: אֲרָם இங்கு மக்களைக் கூட்டாகக் குறிக்கிறது; தமிழில் ‘அராமியர்’ என்பது இயல்பான வடிவம். מִפְּנֵי என்பதன் ‘முன்பாக இருந்து/எதிரில் இருந்து’ என்ற படிமத்தை ‘முன்பாக’ தக்கவைக்கிறது.
- source_word: וַיַּהֲרֹג דָּוִד
  choice: தாவீது ... கொன்றார்
  rationale: הרג என்பதன் நேரடியான பொருள் ‘கொல்லுதல்’; நவீனத் தமிழில் தெளிவான சொல் பயன்படுத்தப்படுகிறது.
- source_word: שְׁבַע מֵאוֹת רֶכֶב
  choice: தேர்ப்படையினரில் எழுநூறு பேர்
  rationale: רֶכֶב என்பது தேர் அல்லது தேர்ப்படையைக் குறிக்கலாம். உயிரிழப்புகளின் எண்ணிக்கையாக வருவதால் மனிதர்களைக் குறிக்கும் இயல்பான தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְאַרְבָּעִים אֶלֶף פָּרָשִׁים
  choice: குதிரைவீரர்களில் நாற்பதாயிரம் பேர்
  rationale: פָּרָשִׁים என்பது குதிரைவீரர் அல்லது குதிரைப்படையினரைக் குறிக்கிறது; ‘குதிரைவீரர்கள்’ தெளிவான நவீனத் தமிழ்.
- source_word: וְאֵת שׁוֹבַךְ
  choice: சோபாக்
  rationale: மசோரா உயிர்க்குறிப்பை அடிப்படையாகக் கொண்ட தமிழ் ஒலிபெயர்ப்பு.
- source_word: שַׂר צְבָאוֹ
  choice: அவர்களுடைய படைத்தலைவன்
  rationale: שַׂר צְבָא என்பது இராணுவத் தலைமையைச் சுட்டுகிறது. எபிரெயச் சுட்டுப்பெயர் ஒருமையில் இருப்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הִכָּה
  choice: வீழ்த்தினார்
  rationale: נכה என்பது அடித்தல், தாக்குதல், வீழ்த்துதல் எனப் பொருள்படும்; தொடர்ந்து அவன் இறந்ததாகச் சொல்லப்படுவதால் ‘வீழ்த்தினார்’ பொருத்தமானது, மேலும் முன் வந்த הרג இலிருந்து சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: וַיָּמָת שָׁם
  choice: அவன் அங்கே இறந்தான்
  rationale: எந்த விளக்கத்தையும் கூடுதலாகச் சேர்க்காமல் மூலக் கூற்றை நேரடியாக வழங்குகிறது.
