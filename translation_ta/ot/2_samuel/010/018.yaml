  source_fidelity: திருத்தம் தேவை. אֲרָם என்பதைக் கூட்டுப் பொருளில் ‘அராமியர்’ எனக் கொடுத்தது பொருத்தமானது; ரதப்படை/ரதங்களைக் குறிக்கும் רֶכֶב-இன் தெளிவின்மையும் அடிக்குறிப்பில் முறையாகக் காக்கப்பட்டுள்ளது. ஆனால் שַׂר צְבָאוֹ-வில் உள்ள ஒருமைச் சுட்டுப்பெயரை முதன்மை உரையில் ‘அவர்களுடைய’ எனப் பன்மையாக்குவது மூலத்திற்கு நேரானது அல்ல. ‘அவனுடைய’ எனக் கொடுத்து, பன்மை மாற்றை அடிக்குறிப்பில் தருவது பாதுகாப்பானது.
  naturalness: ‘இஸ்ரவேலருக்கு முன்பாகத் தப்பியோடினார்கள்’ என்பது நவீன தமிழில் சிறிது கடினமாகவும் இயல்பற்றதாகவும் உள்ளது. எபிரெயப் போர்ச் சொற்றொடரின் பொருளை இயல்பாகத் தரும் ‘இஸ்ரவேலரிடமிருந்து ஓடிப்போனார்கள்’ பயன்படுத்தப்பட்டுள்ளது. எண்ணிக்கைக் கூறில் ‘தேர்ப்படையினரில்’ என்ற பகுதிப்பொருள் வடிவத்திற்குப் பதிலாக, ‘தேர்ப்படையைச் சேர்ந்த ... பேரை’ என்பது தெளிவானது.
