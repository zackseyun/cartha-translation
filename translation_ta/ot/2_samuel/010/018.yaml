translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. மரபுவழி வேதாகமச் சொற்களில் தேவையற்ற தொன்மை தவிர்க்கப்பட்டு, இராணுவச் சூழலுக்கேற்ற ‘தேர்ப்படை’, ‘குதிரைவீரர்’, ‘படைத்தலைவன்’ ஆகிய சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
