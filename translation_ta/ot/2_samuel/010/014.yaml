  yaml_path: translation/ot/2_samuel/010/014.yaml
  text: And when the sons of Ammon saw that Aram had fled[a], they fled before Abishai and entered the city[c][b]. Then Joab returned from against the sons of Ammon and came to Jerusalem.
translation:
  language: ta
  text: ஆராம் தப்பியோடிவிட்டதைக் கண்ட அம்மோனின் மகன்கள்[a], அபிசாயிடமிருந்து தப்பியோடி நகருக்குள் புகுந்தார்கள். அப்போது யோவாப் அம்மோனின் மக்களை எதிர்த்துப் போரிடுவதிலிருந்து பின்வாங்கி[c] எருசலேமுக்கு வந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘அம்மோனின் மகன்கள்’; அதாவது, அம்மோனியர்.'
    reason: lexical_alternative
  - marker: c
    text: அதாவது, யோவாப் அம்மோனின் மக்களுக்கு எதிரான போரிடுதலிலிருந்து விலகினார்.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: அம்மோனின் மகன்கள்
  rationale: எபிரெய மொழியின் உறவுமுறைச் சொல்லாட்சியை நேரடியாகப் பேணுகிறது; இச்சூழலில் இது அம்மோனிய மக்களைக் கூட்டாகக் குறிக்கிறது.
- source_word: רָאוּ כִּי נָס
  choice: தப்பியோடியதைக் கண்டபோது
  rationale: அவர்கள் கண்டறிந்த நிகழ்வு ஏற்கெனவே நடந்திருந்தது என்ற எபிரெய வினைத் தொடரை இயல்பான தமிழ் கதையோட்டத்தில் வெளிப்படுத்துகிறது.
- source_word: אֲרָם
  choice: ஆராம்
  rationale: ‘சீரியா’ என்ற பிற்காலப் பெயரைப் புகுத்தாமல், மூலத்தின் தேசப்பெயரைப் பேணுகிறது; இங்கு ஆராமியப் படையினரை கூட்டாகக் குறிக்கிறது.
- source_word: וַיָּנֻסוּ מִפְּנֵי אֲבִישַׁי
  choice: அபிசாய்க்கு முன்பாகத் தப்பியோடி
  rationale: מִפְּנֵי என்பதிலுள்ள ‘முன்னிலையிலிருந்து’ என்ற உருவகத்தையும், படையெதிரில் பின்வாங்கிய இராணுவப் பொருளையும் பேணுகிறது.
- source_word: וַיָּבֹאוּ הָעִיר
  choice: நகருக்குள் புகுந்தார்கள்
  rationale: அரணுள்ள நகருக்குள் சென்றதை இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்திலுள்ள குறிப்பிட்ட உருபுக்கு ஏற்ப ‘நகருக்குள்’ என வழங்கப்படுகிறது.
- source_word: וַיָּשָׁב יוֹאָב מֵעַל בְּנֵי עַמּוֹן
  choice: யோவாப் அம்மோனின் மக்களுக்கு எதிரான போரிலிருந்து விலகி
  rationale: מֵעַל என்பதன் இராணுவச் சூழல், வெறுமனே அவர்களிடமிருந்து திரும்பினார் என்பதல்லாமல் அவர்களுக்கு எதிரான தாக்குதலைக் கைவிட்டு விலகினார் என்பதை உணர்த்துகிறது.
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: எருசலேமுக்கு வந்தார்
  rationale: בוא என்பதன் அடிப்படை இயக்கப் பொருளைப் பேணுகிறது; மூலத்தில் மறுபடியும் இல்லாத ‘திரும்பினார்’ என்பதை இங்கு சேர்க்கவில்லை.
