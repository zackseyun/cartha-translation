translation_notes:
  register: நவீன தரத் தமிழ்; மரியாதைமிக்க ஆனால் எளிதில் புரியும் நடை. எதிர்பார்க்கப்படும் உறுதிப்படுத்தும் கேள்வியின் தொனியை ‘அல்லவா?’ எனக் காத்துள்ளது. பெயர்கள் பாரம்பரிய தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளன.
