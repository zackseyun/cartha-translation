  yaml_path: translation/ot/2_samuel/015/035.yaml
  text: Are not Zadok and Abiathar the priests there with you? And whatever matter you hear from the king’s house, you shall report to Zadok and Abiathar the priests.
translation:
  language: ta
  text: சாதோக்கும் அபியத்தாரும் ஆகிய ஆசாரியர்கள் அங்கே உன்னோடு இருக்கிறார்கள் அல்லவா? அரசனின் அரண்மனையில் நீ கேட்கும் ஒவ்வொரு காரியத்தையும் ஆசாரியர்களான சாதோக்குக்கும் அபியத்தாருக்கும் தெரிவிக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: இருவரையும் குறிக்கும் எபிரெய பன்மையை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: כָּל־הַדָּבָר
  choice: ஒவ்வொரு செய்தியையும்
  rationale: דָּבָר என்பதன் பரந்த ‘காரியம்/விஷயம்/செய்தி’ பொருள்களில், இச்சூழலில் உளவுத் தகவலைக் குறிக்கும் இயல்பான ‘செய்தி’ தேர்ந்தெடுக்கப்பட்டது; כָּל என்பதையும் வெளிப்படுத்துகிறது.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: அரச அரண்மனையிலிருந்து
  rationale: சொல்லாட்சியில் ‘அரசனின் வீடு’; இங்கு அரசவையையும் அரண்மனையையும் குறிக்கும் சூழற்பொருளை நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: תַּגִּיד
  choice: தெரிவிக்க வேண்டும்
  rationale: எபிரெய வினையின் கட்டளை/கடமை வலிமையைத் தெளிவான நவீன தமிழில் காக்கிறது.
