  source_fidelity: மூல எபிரெய உரையின் கட்டளை, ‘கடவுளின் பேழை’ (אֲרוֹן הָאֱלֹהִים), நகரத்திற்குத் திருப்பிக் கொண்டுபோகும் திசை, யாவேயின் பார்வையில் தயவு பெறுதல், மீண்டும் கொண்டுவரப்படுதல், மற்றும் ‘அதையும் அதன் உறைவிடத்தையும்’ காணச் செய்தல் ஆகிய அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘அது/அதன்’ என்பதன் முதன்மையான பேழை-மையக் குறிப்பும் சரியானது.
