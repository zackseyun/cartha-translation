base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/025.yaml
  text: Then the king said to Zadok[a], “Return the ark of God to the city. If I find favor in the eyes of Yahweh, he will bring me back and let me see it and its dwelling place.”
translation:
  language: ta
  text: அப்போது அரசன் சாதோக்கிடம், “கடவுளின் பேழையை நகரத்துக்குத் திருப்பிக் கொண்டுபோ. யாவேயின் கண்களில் எனக்குத் தயவு கிடைத்தால், அவர் என்னைத் திரும்பக் கொண்டுவந்து, அதையும் அதன் உறைவிடத்தையும் நான் காணும்படி செய்வார்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரையும் அவரது உறைவிடத்தையும் நான் காணும்படி செய்வார்.” எபிரெய சொற்றொடரை கடவுளைக் குறிக்கும் விதமாகவும் புரிந்துகொள்ளலாம்; எனினும், அதற்கு உடனடியாக முன்னுள்ள சொல் ‘கடவுளின் பேழை’ என்பதாகும்.
    reason: alternative_reading
lexical_decisions:
- source_word: הָשֵׁב
  choice: திருப்பிக் கொண்டுபோ
  rationale: שׁוב என்பதன் ஏவல் வடிவம் சாதோக்கை நோக்கிக் கூறப்படுகிறது. பேழையை மீண்டும் நகரத்துக்குக் கொண்டுசெல்ல வேண்டும் என்ற காரணவினைப் பொருளை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: கடவுளின் பேழை
  rationale: எபிரெய உரையில் אֱלֹהִים (‘கடவுள்’) என்றே உள்ளது; அதை ‘யாவேயின் பேழை’ என்று ஒத்திசைக்கவில்லை. אָרוֹן என்பதற்கான வேதாகமச் சூழலுக்கு ஏற்ற, கண்ணியமான தமிழ்ச் சொலாக ‘பேழை’ பயன்படுத்தப்படுகிறது; மூலத்தில் இல்லாத ‘உடன்படிக்கை’ சேர்க்கப்படவில்லை.
- source_word: הָעִיר
  choice: நகரத்துக்கு
  rationale: ‘திருப்பிக் கொண்டுபோ’ என்ற வினையுடன் சேர்ந்து இலக்கை இயல்பான தமிழில் குறிக்கிறது; இங்குள்ள நகரம் எருசலேம் என்றாலும், மூலத்தின் பொதுவான சொல்லே காக்கப்படுகிறது.
- source_word: אִם אֶמְצָא חֵן בְּעֵינֵי יְהוָה
  choice: யாவேயின் கண்களில் எனக்குத் தயவு கிடைத்தால்
  rationale: ‘கண்களில் தயவு காணுதல்’ என்ற எபிரெய மரபுத்தொடரின் உருவகத்தைத் தமிழில் புரியத்தக்க வகையில் காக்கிறது; ‘நான் யாவேக்குப் பிரியமாயிருந்தால்’ என்று விளக்கி மொழிபெயர்க்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான יהוה என்பதை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
- source_word: וֶהֱשִׁבַנִי
  choice: அவர் என்னைத் திரும்பக் கொண்டுவந்து
  rationale: שׁוב என்பதன் ஹிஃபில் வடிவம் தாவீதைத் திரும்ப வரச்செய்வதைக் குறிக்கிறது. சூழலில் அவர் மீண்டும் எருசலேமுக்குக் கொண்டுவரப்படுவதே கருத்து.
- source_word: וְהִרְאַנִי
  choice: நான் காணும்படி செய்வார்
  rationale: ראה என்பதன் ஹிஃபில் வடிவமான ‘என்னைக் காணச்செய்வார்’ என்ற காரணவினைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֹתוֹ
  choice: அதையும்
  rationale: உடனடி முற்சுட்டு ‘கடவுளின் பேழை’ என்பதால், முதன்மை உரையில் சுட்டுப்பெயர் பேழையைக் குறிப்பதாக மொழிபெயர்க்கப்படுகிறது. கடவுளைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: נָוֵהוּ
  choice: அதன் உறைவிடத்தையும்
  rationale: נָוֶה என்பது உறைவிடம் அல்லது வாசஸ்தலத்தைக் குறிக்கலாம். இன்னும் கட்டப்படாத ஆலயத்தைத் தேவையின்றி முன்குறிக்காமல், பேழை வைக்கப்பட்டிருக்கும் இடத்தைப் பொதுவாகச் சொல்கிறது.
theological_decisions:
- issue: ‘அதையும் அதன் உறைவிடத்தையும்’ என்பதன் குறிப்பு
  choice: உடனடி முற்சுட்டின் அடிப்படையில், பேழையையும் அது தங்கும் இடத்தையும் குறிப்பதாக முதன்மை உரை தரப்படுகிறது.
  alternative: ‘அவரையும் அவரது உறைவிடத்தையும்’ என்று கடவுளையும் அவரது வாசஸ்தலத்தையும் குறிப்பதாகப் புரிந்துகொள்ளலாம்.
  rationale: אֹתוֹ என்ற ஆண்பால் சுட்டுப்பெயரின் உடனடி முற்சுட்டு ஆண்பால் பெயர்ச்சொல்லான ‘பேழை’ ஆகும். எனினும், பேழை கடவுளின் பிரசன்னத்தோடு நெருக்கமாக இணைக்கப்பட்டிருப்பதால் கடவுளை மையமாகக் கொண்ட வாசிப்பும் சாத்தியம்; இந்த இறையியல் மற்றும் இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பான, ஆனால் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பேழை’ என்பது சூழலுக்குரிய நிறுவப்பட்ட சொல்லாக இருப்பதால் காக்கப்பட்டது. தெய்வீகப் பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது. எபிரெய மொழியின் சுட்டுப்பெயர் தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
