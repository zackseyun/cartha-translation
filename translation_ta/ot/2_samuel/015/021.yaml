revisions:
- from: அப்போது இத்தாய் அரசனுக்குப் பதிலளித்து, “யெகோவா உயிரோடிருப்பது உறுதி, என் தலைவராகிய அரசர் உயிரோடிருப்பதும் உறுதி[a]; என் தலைவராகிய அரசர் எங்கே இருப்பாரோ, அது சாவுக்கான இடமானாலும் வாழ்வுக்கான இடமானாலும்[b], அங்கேயே உமது பணியாளனும் இருப்பான்” என்றான்.
  to: 'அப்போது இத்தாய் அரசனுக்குப் பதிலளித்துச் சொன்னான்: “யாவே உயிரோடிருப்பதுபோலவும், என் ஆண்டவராகிய அரசர் உயிரோடிருப்பதுபோலவும்[a], என் ஆண்டவராகிய அரசர் எங்கே இருப்பாரோ, சாவோ வாழ்வோ எதுவாயினும்[b], உங்கள் பணியாளனான நானும் அங்கேயே இருப்பேன்.”'
