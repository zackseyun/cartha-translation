base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/021.yaml
  text: Then Ittai answered the king and said[a], “As Yahweh lives, and as my lord the king lives, surely in whatever place my lord the king may be, whether for death or for life[b], there your servant will be.”
translation:
  language: ta
  text: 'அப்போது இத்தாய் அரசனுக்குப் பதிலளித்துச் சொன்னான்: “யாவே உயிரோடிருப்பதுபோலவும், என் ஆண்டவராகிய அரசர் உயிரோடிருப்பதுபோலவும்[a], என் ஆண்டவராகிய அரசர் எங்கே இருப்பாரோ, சாவோ வாழ்வோ எதுவாயினும்[b], உங்கள் பணியாளனான நானும் அங்கேயே இருப்பேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் இது ஓர் உறுதிமொழிச் சூத்திரம்: “யாவே உயிரோடிருப்பதுபோலவும், என் ஆண்டவராகிய அரசர் உயிரோடிருப்பதுபோலவும்.”'
    reason: cultural_note
  - marker: b
    text: 'நேரடியாக: “சாவுக்காகவோ வாழ்வுக்காகவோ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן אִתַּי אֶת־הַמֶּלֶךְ וַיֹּאמַר
  choice: அப்போது இத்தாய் அரசனுக்குப் பதிலளித்து ... என்றான்
  rationale: எபிரெயக் கதைநடையின் ‘பதிலளித்து சொன்னான்’ என்ற இரட்டைக் கட்டமைப்பை இயல்பான நவீனத் தமிழில் சுருக்காமல், உரையாடல் அமைப்புடன் எடுத்துரைக்கிறது.
- source_word: חַי יְהוָה
  choice: யெகோவா உயிரோடிருப்பது உறுதி
  rationale: இது சத்திய உறுதிமொழிச் சூத்திரம். தெய்வீகப் பெயரை ஒலிபெயர்த்து, வெறும் தகவல் கூற்றாக அல்லாமல் உறுதிமொழியின் வலிமையைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְחֵי אֲדֹנִי הַמֶּלֶךְ
  choice: என் தலைவராகிய அரசர் உயிரோடிருப்பதும் உறுதி
  rationale: முதல் உறுதிமொழிக்கு இணையான அமைப்பைத் தக்கவைத்து, אֲדֹנִי என்பதை அரசரிடம் மரியாதை காட்டும் ‘என் தலைவர்’ என வழங்குகிறது.
- source_word: כִּי אִם
  choice: உறுதியாக
  rationale: சத்தியச் சூழலில் நிபந்தனையைவிட வலியுறுத்தலைக் குறிக்கிறது; தமிழில் முழு உறுதிமொழி அமைப்பே இந்த வலிமையை எடுத்துரைப்பதால் அடுத்த கூற்றின் உறுதியால் செயல்படுத்தப்பட்டுள்ளது.
- source_word: בִּמְקוֹם אֲשֶׁר יִהְיֶה שָּׁם
  choice: எங்கே இருப்பாரோ ... அங்கேயே
  rationale: திறந்த இடச்சுட்டை இயல்பான தொடர்பிணைத் தமிழ் அமைப்பில் வழங்குகிறது; ‘அங்கேயே’ பற்றுறுதியை வலுப்படுத்துகிறது.
- source_word: אִם לְמָוֶת אִם לְחַיִּים
  choice: அது சாவுக்கான இடமானாலும் வாழ்வுக்கான இடமானாலும்
  rationale: மூலத்தின் ‘சாவுக்கோ வாழ்வுக்கோ’ என்ற இருமுனைப் பற்றுறுதியையும் இடத்துடன் அதன் இலக்கணத் தொடர்பைப் பற்றிய சாத்தியமான வாசிப்பையும் காக்கிறது.
- source_word: עַבְדֶּךָ
  choice: உமது பணியாளன்
  rationale: இங்கு அரசர்முன் தன்னைத் தாழ்த்திக் கூறும் மரியாதைச் சுயகுறிப்பு; அடிமைநிலையைத் தேவையின்றி முன்னிறுத்தாமல் அரண்மனைச் சூழலைப் பொருத்தமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை பட்டப்பெயராக மாற்றாமல் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பான ‘யெகோவா’ என்று வழங்குகிறது.
- issue: இத்தாயின் அறிவிப்பு தகவல் கூற்றா அல்லது உறுதிமொழியா
  choice: உறுதிமொழியாக வெளிப்படுத்தப்பட்டது
  alternative: ‘யெகோவா வாழ்கிறார்’ என்ற நேரடி தகவல் வடிவம்
  rationale: חַי ... וְחֵי ... என்பது இச்சூழலில் சத்திய உறுதிமொழிச் சூத்திரம்; அதன் பண்பாட்டு மற்றும் இறையியல் வலிமையை இயல்பான தமிழில் காட்ட வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான அரசவைக் குரல் பயன்படுத்தப்பட்டுள்ளது. ‘அரசன்’ கதைசொல்லலில் வந்தாலும், நேரடி உரையில் மரியாதைக்காக ‘அரசர்’ பயன்படுத்தப்பட்டுள்ளது. உறுதிமொழியின் பழமையான பண்பாட்டு வடிவம் வாசகருக்குத் தெளிவாக இருக்க அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
