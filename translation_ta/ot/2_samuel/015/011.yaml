  yaml_path: translation/ot/2_samuel/015/011.yaml
  text: Two hundred men from Jerusalem went with Absalom[a], invited, and they went innocently, not knowing anything.
translation:
  language: ta
  text: எருசலேமிலிருந்து இருநூறு ஆண்கள் அப்சலோமுடன் சென்றார்கள்; அவர்கள் அழைக்கப்பட்டிருந்தவர்கள். அவர்கள் அப்பாவித்தனமாகச் சென்றார்கள்; எதையும் அறியவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அப்பாவித்தனமாக” என்பதற்கு “கபடமின்றி,” “நேர்மையுடன்,” அல்லது “எளிமையுடன்” என்றும் மொழிபெயர்க்கலாம். இந்தச் சொல்லும், அவர்கள் எதையும் அறியவில்லை என்ற தொடரும், அவர்கள் அறியாமலேயே சென்றதைக் காட்டுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלְכוּ אֶת־אַבְשָׁלוֹם
  choice: அப்சலோமுடன் சென்றார்கள்
  rationale: הלך என்பது ‘செல்’ எனப் பொருள்படும்; אֶת־אַבְשָׁלוֹם உடன் வருவதால், இங்கு அப்சலோமோடு சென்றதைக் குறிக்கிறது.
- source_word: מָאתַיִם אִישׁ
  choice: இருநூறு ஆண்கள்
  rationale: எண்ணிக்கைக்குப் பின் வரும் אִישׁ ஆண்களைக் குறிக்கிறது; அதனால் பாலினக் குறிப்பைத் தெளிவாக வைத்திருக்கிறது.
- source_word: מִירוּשָׁלִַם
  choice: எருசலேமிலிருந்து
  rationale: מִן முன்னிடைச்சொல் புறப்பட்ட இடத்தையோ மூலத்தையோ குறிக்கிறது.
- source_word: קְרֻאִים
  choice: அழைக்கப்பட்டிருந்த
  rationale: קרא என்பதன் செயல்பாட்டு வினையெச்சம்; இச்சூழலில் ஒரு நிகழ்வுக்கு அழைக்கப்பட்டவர்களை நேரடியாகக் குறிக்கிறது; ‘விருந்தினர்கள்’ என்ற கூடுதல் பெயரைச் சேர்க்கவில்லை.
- source_word: לְתֻמָּם
  choice: அப்பாவியாக
  rationale: תֹּם/תֻּם என்பதற்கு அப்பாவித்தனம், கபடமின்மை, நேர்மை ஆகிய பொருள் நிழல்கள் உள்ளன. தொடர்ந்து வரும் ‘எதையும் அறியாமல்’ என்ற சொற்றொடர், இங்கு சூழ்ச்சியை அறியாத அப்பாவித்தனத்தை முன்னிறுத்துகிறது.
- source_word: וְלֹא יָדְעוּ כָּל־דָּבָר
  choice: அவர்கள் எதையும் அறியாமல்
  rationale: כָּל־דָּבָר இங்கு ‘எதையும்’ என்று இயல்பாக மொழிபெயர்க்கப்படுகிறது. அப்சலோமின் திட்டத்தை உரையில் வெளிப்படையாகச் சேர்க்காமல், மூலத்தின் பொதுவான சொல்லாட்சியைப் பாதுகாக்கிறது.
