base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/027.yaml
  text: Then the king said to Zadok the priest[a], “Are you a seer? Return to the city in peace, and your two sons with you, Ahimaaz your son and Jonathan son of Abiathar.”
translation:
  language: ta
  text: அப்போது அரசன் ஆசாரியனாகிய சாதோக்கிடம், “நீ ஒரு தரிசனக்காரனா?[a] உன் மகன் அகிமாசையும் அபியத்தாரின் மகன் யோனத்தானையும், உங்கள் இரு மகன்களையும், உங்களோடு அழைத்துக்கொண்டு நகரத்துக்கு நலமுடன் திரும்பிப் போ” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உனக்குத் தெரிகிறதல்லவா?” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் சாதோக்கை ஒரு ‘தரிசனக்காரன்’ என்று குறிப்பிடலாம்; அல்லது காணுதல்/உணர்தல் பற்றிய கேள்வியாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/רוֹאֶה אַתָּה
  choice: நீ ஒரு தரிசனக்காரனா?
  rationale: הראה என்பதை ‘தரிசனக்காரன்’ என்ற பெயர்ச்சொல்/பங்கேற்பு வடிவமாகக் கொண்டு கேள்வியாக மொழிபெயர்க்கிறது. எபிரெயச் சொல்லில் ‘காணுதல்/உணர்தல்’ என்ற மாற்றுப் பொருளும் இருப்பதால் அதை அடிக்குறிப்பில் தக்கவைக்கிறது.
- source_word: שֻׁבָ/ה הָ/עִיר
  choice: நகரத்துக்கு ... திரும்பிப் போ
  rationale: שוב வினையின் கட்டளைப் பொருளையும், நகரத்தை நோக்கிய இயக்கத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּ/שָׁלוֹם
  choice: நலமுடன்
  rationale: இச்சூழலில் שׁלום அமைதியையும் பாதுகாப்பாகச் செல்வதையும் குறிக்கிறது; ‘நலமுடன்’ என்பது தமிழில் இயல்பாக இரண்டையும் உள்ளடக்குகிறது.
- source_word: וַ/אֲחִימַעַץ בִּנְ/ךָ וִ/יהוֹנָתָן בֶּן אֶבְיָתָר
  choice: உன் மகன் அகிமாசும் அபியத்தாரின் மகன் யோனத்தானும்
  rationale: இரு மகன்களின் பெயர்களையும் தந்தை அடையாளங்களையும் மூலத்தின் இணை அமைப்புக்கு ஏற்ப வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: שְׁנֵי בְנֵי/כֶם אִתְּ/כֶם
  choice: உங்கள் இரு மகன்களும் உங்களோடு வரட்டும்
  rationale: எபிரெயில் ‘உங்கள்/உங்களோடு’ என்பவை பன்மையில் இருப்பதைத் தமிழிலும் பன்மை வடிவால் தக்கவைக்கிறது; சூழலில் இவர்கள் சாதோக் மற்றும் அபியத்தாரின் தலா ஒரு மகன். தமிழில் வாக்கியம் நிறைவாக இருக்க ‘வரட்டும்’ என்பது பொருளடக்கமாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: וַ/יֹּאמֶר הַ/מֶּלֶךְ
  choice: அப்போது அரசன் ... என்றான்
  rationale: தொடர்கதை முன்னேற்றத்தைக் குறிக்கும் வாவை இயல்பான தமிழ் கதைநடையில் ‘அப்போது’ என வழங்குகிறது.
theological_decisions:
- issue: சாதோக்கை ‘தரிசனக்காரன்’ என அடையாளப்படுத்துகிறதா அல்லது அவர் காண்கிறாரா என்று கேட்கிறதா?
  choice: முதன்மை உரையில் ‘நீ ஒரு தரிசனக்காரனா?’
  alternative: ‘உனக்குத் தெரிகிறதல்லவா?’ அல்லது ‘நீ பார்க்கிறாயா?’
  rationale: הֲרֹאֶה אַתָּה என்ற சொற்றொடர் இலக்கண ரீதியாக இருவிதமாகப் புரிந்துகொள்ளப்படலாம். முதன்மை உரை ‘தரிசனக்காரன்’ என்ற வாசிப்பைப் பின்பற்றினாலும், மாற்று வாசிப்பை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியன்’, ‘தரிசனக்காரன்’ ஆகியவை வேதாகமச் சூழலில் அறியப்பட்ட சொற்களாக இருப்பினும், தெளிவுக்காக மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. ஒருமை ‘உன்’ மற்றும் பன்மை ‘உங்கள்/உங்களோடு’ ஆகிய வேறுபாடுகள் எபிரெய் மூலத்துக்கு ஏற்ப கவனமாகத் தக்கவைக்கப்பட்டுள்ளன.
