base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/009.yaml
  text: The king said to him, “Go in peace.” So he arose and went to Hebron.
translation:
  language: ta
  text: அரசன் அவனிடம், “சமாதானத்தோடு போ” என்றான். அவன் எழுந்து எபிரோனுக்குப் போனான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: אמר என்பதன் வழக்கமான எபிரெயக் கதைநடை வடிவம்; நேரடிக் கூற்றுக்குப் பின் வரும் இயல்பான நவீனத் தமிழ் சொல்லாக்கம்.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: சூழலில் ஏற்கெனவே அறியப்பட்ட தாவீதைக் குறிக்கும் திட்டவட்டமான பெயர்ச்சொல்; பெயரைச் சேர்க்காமல் எபிரெய வெளிப்பாட்டைப் பாதுகாக்கிறது.
- source_word: לֵךְ
  choice: போ
  rationale: הלך என்பதன் கட்டளை வடிவத்திற்கு இயல்பான, நேரடியான தமிழ் இணை.
- source_word: בְּשָׁלוֹם
  choice: சமாதானத்துடன்
  rationale: புறப்படும்போது கூறப்படும் வாழ்த்து அல்லது அனுமதியைக் குறிக்கும் எபிரெய மரபுத்தொடரின் வடிவத்தையும் பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்பதன் செயலைக் காட்டுகிறது; அடுத்த செயல்வினையுடன் இணைக்கும்போது தமிழ் கதைநடையில் வினையெச்ச வடிவம் இயல்பாக உள்ளது.
- source_word: וַיֵּלֶךְ
  choice: போனான்
  rationale: இயக்கத்தைக் குறிக்கும் வழக்கமான கதைநடை வினை; எழுந்ததைத் தொடர்ந்து நிகழ்ந்த செயலை எளிமையாகத் தெரிவிக்கிறது.
- source_word: חֶבְרוֹנָה
  choice: எப்ரோனுக்கு
  rationale: இடப்பெயருடன் சேர்ந்த திசைநோக்கி ה, அந்த நகரத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் நான்காம் வேற்றுமை இதை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். எபிரெய கதைநடையின் தொடர்ச்சியை இயல்பாகக் காட்ட ‘உடனே’ பயன்படுத்தப்பட்டுள்ளது; இது தனி புதிய நிகழ்வைச் சேர்க்காமல் wayyiqtol தொடரைத் தமிழில் வெளிப்படுத்துகிறது.
