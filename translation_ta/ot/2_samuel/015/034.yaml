base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/034.yaml
  text: But if you return to the city and say to Absalom, ‘I will be your servant, O king; as I was your father’s servant in the past, so now I will be your servant,’ then you will frustrate Ahithophel’s counsel for me.
translation:
  language: ta
  text: ஆனால், நீ நகரத்திற்குத் திரும்பிச் சென்று அப்சலோமிடம், ‘அரசே, நான் உமது பணியாளனாக இருப்பேன். முன்பு உமது தந்தையின் பணியாளனாக இருந்தேன்; இப்போதும் நான் உமது பணியாளனாக இருக்கிறேன்’ என்று சொன்னால், அகித்தோப்பேலின் ஆலோசனையை எனக்காக முறியடிப்பாய்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶבֶד
  choice: பணியாளன்
  rationale: இங்கு அரசருக்குச் சேவை புரிபவர் என்ற பொருளில் வரும் சொல்லை, நவீன தமிழில் இயல்பாகவும் மரியாதையாகவும் வெளிப்படுத்துகிறது.
- source_word: וְהֵפַרְתָּה
  choice: முறியடிப்பாய்
  rationale: ஓர் ஆலோசனையைச் செயலிழக்கச் செய்தல் அல்லது தோல்வியுறச் செய்தல் என்ற causative கருத்தைத் தெளிவாகக் கூறுகிறது.
- source_word: עֲצַת
  choice: ஆலோசனை
  rationale: திட்டம் அல்லது அறிவுரை என்னும் இரு நுணுக்கங்களையும் சூழலுக்கேற்ற பொதுச் சொல்லாகத் தக்கவைக்கிறது.
- source_word: לִי
  choice: எனக்காக
  rationale: தாவீதின் நலனுக்காக அகித்தோப்பேலின் ஆலோசனையை முறியடிப்பது என்ற சூழ்நிலைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
