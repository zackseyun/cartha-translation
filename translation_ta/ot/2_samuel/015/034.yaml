translation_notes:
  register: நவீன தரத் தமிழில், அரசவைக் கூற்றுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையின் சற்றுக் கடினமான சொல் வரிசை, ஆங்கில ஆலோசனைப் பதிப்பில் காணப்படும் ஒப்புமை அமைப்புக்கு ஒத்தவாறு இயல்பான தமிழில் அமைக்கப்பட்டது; எந்தச் சமயப்பிரிவு சார்ந்த விளக்கமும் சேர்க்கப்படவில்லை.
