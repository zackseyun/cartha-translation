base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/008.yaml
  text: For your servant made a vow while I was dwelling in Geshur in Aram[a], saying, ‘If Yahweh indeed brings me back to Jerusalem[c][b], then I will serve Yahweh.’
translation:
  language: ta
  text: ஏனெனில், உமது அடியானாகிய நான் ஆராமிலுள்ள கேசூரில் வாழ்ந்தபோது, ‘யாவே என்னை எருசலேமுக்குத் திரும்பக் கொண்டுவருவாரானால்[b], நான் யாவேவுக்குப் பணிசெய்வேன்[c]’ என்று ஒரு நேர்ச்சை செய்தேன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் முறையாக, ‘ஒரு நேர்ச்சையை நேர்ந்துகொண்டேன்.’ எபிரெய மொழியில் ஒரே வேரைச் சேர்ந்த பெயர்ச்சொல்லும் வினைச்சொல்லும் இணைந்து வருகின்றன.
    reason: lexical_alternative
  - marker: b
    text: '‘திரும்பக் கொண்டுவருதல்’ என்ற வினையை எபிரெய மொழி வலியுறுத்தி அமைக்கிறது; பொருள்: ‘உண்மையாகவே திரும்பக் கொண்டுவருவாரானால்.’'
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘நான் யாவேவை வழிபடுவேன்.’ இங்குள்ள எபிரெய வினை கடவுளுக்குச் செய்யும் வழிபாட்டுச் சேவையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר נָדַר
  choice: ஒரு நேர்ச்சை செய்தேன்
  rationale: எபிரெயச் சொற்றொடர் ஒரே வேரிலிருந்து வந்த பெயர்ச்சொல்லையும் வினைச்சொல்லையும் இணைத்து வலியுறுத்துகிறது. அதைச் சொற்குச் சொல் மீட்டுரைப்பதைவிட, நவீனத் தமிழில் இயல்பான ‘ஒரு நேர்ச்சை செய்தேன்’ என வழங்கப்பட்டுள்ளது; முறையான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியானாகிய நான்
  rationale: அரசனிடம் பணிவுடன் தன்னைச் சுட்டும் அரண்மனை வழக்கை இது வெளிப்படுத்துகிறது. ‘அடிமை’ என்பதைக் காட்டிலும் ‘அடியான்’ இச்சூழலின் மரியாதைமிக்க தாழ்மையான நடைக்கு ஏற்றது.
- source_word: בְּשִׁבְתִּי
  choice: வாழ்ந்தபோது
  rationale: முன்னிடைச்சொல்லுடன் வந்த infinitive construct நேரத்தையும் தொடர்ந்திருக்கும் நிலையையும் குறிக்கிறது. ‘வாழ்ந்தபோது’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: בִגְשׁוּר בַּאֲרָם
  choice: ஆராமிலுள்ள கேசூரில்
  rationale: கேசூர் ஆராம் பகுதியில் இருப்பதை இயல்பாகக் காட்டுகிறது; அவற்றின் அரசியல் உறவை உரை கூறுவதற்கும் மேலாக வரையறுக்கவில்லை.
- source_word: אִם ישיב יְשִׁיבֵנִי
  choice: என்னை எருசலேமுக்குத் திரும்பக் கொண்டுவருவாரானால்
  rationale: שוב என்பதன் causative வடிவம் மீண்டும் வரச் செய்வதைக் குறிக்கிறது; இரட்டிப்பு தரும் வலியுறுத்தல் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது. ‘திரும்பக் கொண்டுவருதல்’ இலக்கை நோக்கிய இடமாற்றத்தை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்து இறைப்பெயர் ஒரு பட்டப்பெயராக மாற்றப்படாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான ‘யாவே’ என வழங்கப்படுகிறது.
- source_word: וְעָבַדְתִּי אֶת יְהוָה
  choice: நான் யாவேவுக்குப் பணிசெய்வேன்
  rationale: עבד என்பது கடவுளுக்குச் செய்யப்படும் சேவையையும் வழிபாட்டுச் சேவையையும் குறிக்கலாம். ‘பணிசெய்வேன்’ அதன் பரந்த பொருளைப் பாதுகாக்கிறது; ‘வழிபடுவேன்’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: עבד என்ற வினை கடவுளுடன் வரும்போது
  choice: பணிசெய்வேன்
  alternative: வழிபடுவேன்
  rationale: இவ்வினை வழிபாட்டை உள்ளடக்கக்கூடிய பணிவிடையைச் சுட்டுகிறது. பரந்த பொருளை முதன்மை உரையில் வைத்துக் கொண்டு, குறிப்பான வழிபாட்டு வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரசனிடம் அப்சலோம் பேசும் பணிவான நடையை ‘உமது அடியானாகிய நான்’ பாதுகாக்கிறது. இடப்பெயர்கள் ‘ஆராம்’, ‘கேசூர்’, ‘எருசலேம்’ என்றும் இறைப்பெயர் ‘யாவே’ என்றும் ஒலிபெயர்க்கப்பட்டுள்ளன.
