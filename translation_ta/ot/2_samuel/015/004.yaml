  text: וַ/יֹּ֨אמֶר֙ אַבְשָׁל֔וֹם מִי יְשִׂמֵ֥/נִי שֹׁפֵ֖ט בָּ/אָ֑רֶץ וְ/עָלַ֗/י יָב֥וֹא כָּל אִ֛ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִ֥יב וּ/מִשְׁפָּ֖ט וְ/הִצְדַּקְתִּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/004.yaml
  text: Then Absalom would say[a], “If only I were appointed judge in the land! Then every man who has a dispute or a case could come to me[c][b], and I would give him justice.”
translation:
  language: ta
  text: 'அப்சலோம் இப்படிச் சொல்வான்[a]: “நாட்டில் என்னை நீதிபதியாக நியமித்தால் எவ்வளவு நன்றாயிருக்கும்! அப்போது தகராறோ வழக்கோ உள்ள எவரும்[b] என்னிடம் வரலாம்; நான் அவருக்கு நீதி வழங்குவேன்[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல் மொழிபெயர்த்தால், “நாட்டில் என்னை நீதிபதியாக நியமிப்பவர் யார்?” இது தகவல் கேட்கும் கேள்வியாக இல்லாமல், அப்சலோமின் ஏக்கத்தை வெளிப்படுத்தும் சொல்லாட்சி.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் இது இலக்கணப்படி ஆண்பால் ஒருமையில் இருந்தாலும், தகராறு அல்லது வழக்கு உள்ள எந்த நபரையும் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “நான் அவரை நியாயவான் எனத் தீர்ப்பேன்”; “அவர் பக்கம் நியாயம் உள்ளது எனத் தீர்ப்பேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: தொடர்ந்து சொல்வான்
  rationale: சூழலில் அப்சலோம் வழக்கமாகத் திரும்பத் திரும்பப் பேசியதை குறிக்கிறது; தமிழில் தொடர்ச்சியான கடந்தகால வழக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִי יְשִׂמֵנִי
  choice: என்னை ... நியமித்தால் எவ்வளவு நன்றாயிருக்கும்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘யார் என்னை நியமிப்பார்?’ என்றாலும், இது தகவல் கேட்கும் கேள்வியல்ல; பதவிக்கான ஏக்கத்தை வெளிப்படுத்தும் சொல்லாட்சி.
- source_word: שֹׁפֵט
  choice: நீதிபதி
  rationale: சட்ட விவகாரங்களை விசாரித்துத் தீர்ப்பளிப்பவரை இச்சூழலில் துல்லியமாகக் குறிக்கிறது.
- source_word: בָּאָרֶץ
  choice: இந்த நாட்டில்
  rationale: இங்கு அப்சலோம் பேசும் ஆட்சிப்பரப்பைக் குறிக்கிறது; ‘நாட்டில்’ என்பது நவீன தமிழில் இயல்பானது.
- source_word: וְעָלַי יָבוֹא
  choice: என்னிடம் வரலாம்
  rationale: தான் நீதிபதியாக நியமிக்கப்பட்டால் மக்கள் தன்னை அணுக முடியும் என்ற கற்பனை விளைவைத் தெரிவிக்கிறது.
- source_word: כָּל אִישׁ
  choice: எவரும்
  rationale: இலக்கணத்தில் ஆண்பால் ஒருமையாக இருந்தாலும், சட்ட விவகாரம் உள்ள எந்த நபரையும் பொதுவாகக் குறிக்கிறது.
- source_word: רִיב
  choice: வழக்கு
  rationale: தகராறு அல்லது சட்டரீதியான வாதத்தைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: וּמִשְׁפָּט
  choice: சட்ட விவகாரம்
  rationale: רִיב என்பதுடன் இணைந்து தீர்ப்புக்காக முன்வைக்கப்படும் சட்டக் காரியத்தைச் சுட்டுகிறது; ‘நீதி’ என்ற அருவப் பொருளாக மட்டும் சுருக்கவில்லை.
- source_word: וְהִצְדַּקְתִּיו
  choice: நான் அவருக்கு நீதி வழங்குவேன்
  rationale: ஹிஃபில் வடிவத்தின் நீதித்துறைப் பொருளை வாசகருக்கு இயல்பாகத் தருகிறது; ‘அவர் சரியானவர் எனத் தீர்ப்பேன்’ என்ற சாதகத் தீர்ப்பின் நுணுக்கம் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: וְהִצְדַּקְתִּיו என்பதன் சாதகத் தீர்ப்பு சார்ந்த நுணுக்கம்
  choice: நான் அவருக்கு நீதி வழங்குவேன்
  alternative: நான் அவரை நியாயவான் எனத் தீர்ப்பேன் / அவர் பக்கம் நியாயம் உள்ளது எனத் தீர்ப்பேன்
  rationale: அப்சலோம் நியாயமான விசாரணையை வாக்குறுதி அளிக்கிறானா அல்லது தன்னிடம் வருபவருக்குச் சாதகமாகவே தீர்ப்பதாகக் கவர்கிறானா என்பது சொல்லாட்சியில் ஓரளவு திறந்துள்ளது. முதன்மை உரை இயல்பான நீதித்துறைப் பொருளை வழங்குகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. அப்சலோமின் தொடர்ச்சியான பிரசாரம், பதவிக்கான ஏக்கம், இறுதி வினைச்சொல்லின் நீதித்துறை ambiguity ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
