  text: וְ/הִשְׁכִּים֙ אַבְשָׁל֔וֹם וְ/עָמַ֕ד עַל יַ֖ד דֶּ֣רֶךְ הַ/שָּׁ֑עַר וַ/יְהִ֡י כָּל הָ/אִ֣ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִיב֩ לָ/ב֨וֹא אֶל הַ/מֶּ֜לֶךְ לַ/מִּשְׁפָּ֗ט וַ/יִּקְרָ֨א אַבְשָׁל֤וֹם אֵלָי/ו֙ וַ/יֹּ֗אמֶר אֵֽי מִ/זֶּ֥ה עִיר֙ אַ֔תָּה וַ/יֹּ֕אמֶר מֵ/אַחַ֥ד שִׁבְטֵֽי יִשְׂרָאֵ֖ל עַבְדֶּֽ/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/002.yaml
  text: Absalom would rise early and stand beside the road to the gate. Whenever any man had a dispute and came to the king for judgment[a], Absalom would call to him and say, “From what city are you?” And he would say, “Your servant is from one of the tribes of Israel.”
translation:
  language: ta
  text: அப்சலோம் அதிகாலையில் எழுந்து, வாசலுக்குச் செல்லும் வழியருகே நிற்பது வழக்கம். ஒரு வழக்கு காரணமாக அரசனிடம் தீர்ப்புக்காக[a] வரும் ஒவ்வொருவரையும் அப்சலோம் அழைத்து, “நீ எந்த நகரத்தைச் சேர்ந்தவன்?” என்று கேட்பான். அதற்கு அவன், “உமது அடியான் இஸ்ரவேலின் கோத்திரங்களில் ஒன்றைச் சேர்ந்தவன்” என்று சொல்வான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதிக்காக.” எபிரெயச் சொல் מִשְׁפָּט இங்கு நீதித்துறைத் தீர்ப்பு அல்லது நீதி வழங்குதலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁכִּים ... וְעָמַד
  choice: அதிகாலையில் எழுந்து ... நிற்பது வழக்கம்
  rationale: எபிரெய வினைச்சொற்களின் அடிப்படைப் பொருளைத் தக்கவைத்தபடி, சூழலில் காணப்படும் தொடர்ச்சியான வழக்கச் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל יַד דֶּרֶךְ הַשָּׁעַר
  choice: நகரவாசலுக்குச் செல்லும் சாலையோரத்தில்
  rationale: עַל יַד என்பதன் ‘அருகில்/பக்கத்தில்’ என்ற இடப்பொருளையும், דֶּרֶךְ הַשַּׁעַר என்பதன் வாசலை நோக்கிய அணுகுவழியையும் தெளிவுபடுத்துகிறது. சூழலால் இது நகரவாசல் என்பதால் தமிழில் இயல்புக்காக ‘நகரவாசல்’ பயன்படுத்தப்பட்டது.
- source_word: כָּל הָאִישׁ אֲשֶׁר יִהְיֶה לּוֹ רִיב
  choice: வழக்கு ஒன்றுடன் ... வரும் ஒவ்வொருவரையும்
  rationale: רִיב என்பது தகராறு, முறையீடு, அல்லது சட்ட வழக்கு எனப் பொருள்படலாம்; நீதித்துறைச் சூழலில் ‘வழக்கு’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது. ‘ஒவ்வொருவரையும்’ மீண்டும் மீண்டும் நிகழ்ந்த செயலைக் காட்டுகிறது.
- source_word: לָבוֹא אֶל הַמֶּלֶךְ לַמִּשְׁפָּט
  choice: அரசனிடம் தீர்ப்புக்காக வரும்
  rationale: מִשְׁפָּט இங்கு நீதித்துறைத் தீர்ப்பைக் குறிக்கிறது; ‘தீர்ப்புக்காக’ என்பது தேவையற்ற விளக்கமின்றி அந்தப் பொருளைக் காக்கிறது.
- source_word: וַיִּקְרָא אַבְשָׁלוֹם אֵלָיו
  choice: அப்சலோம் அழைத்து
  rationale: அழைத்தல் அல்லது கூப்பிடுதல் என்ற பொதுப் பொருளைத் தருகிறது; அதிகாரபூர்வமாக வரவழைத்தான் என்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: אֵי מִזֶּה עִיר אַתָּה
  choice: நீ எந்த நகரத்தைச் சேர்ந்தவன்?
  rationale: ‘எந்த நகரத்திலிருந்து?’ என்ற எபிரெய கேள்வியை நவீனத் தமிழில் நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: מֵאַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கோத்திரங்களில் ஒன்றைச் சேர்ந்தவன்
  rationale: பதில் பழங்குடி/கோத்திரச் சார்பைச் சுட்டுகிறது. வேதாகம வரலாற்றுச் சூழலுக்கு பரிச்சயமான ‘கோத்திரம்’ பயன்படுத்தப்பட்டது.
- source_word: עַבְדֶּךָ
  choice: உமது அடியான்
  rationale: இங்கு இது மரியாதையுடனான தன்னிலைச் சுட்டல்; அடிமை நிலையை வலியுறுத்தாமல் அக்கால சமூக மரியாதை நடையைத் தக்கவைக்கிறது.
