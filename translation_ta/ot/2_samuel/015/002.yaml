translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான வழக்கச் செயலை ‘வழக்கம்’, ‘கேட்பான்’, ‘சொல்வான்’ ஆகிய வடிவங்கள் காட்டுகின்றன; நேரடி உரையில் மரியாதைநிலை ‘உமது அடியான்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
