  source_fidelity: 'கருத்து முழுவதும் எபிரெய மூலத்திற்கு ஒத்துள்ளது: அப்சலோமின் வழக்கமான செயல், வழக்குடன் அரசனிடம் வரும் மனிதர், அவரை அழைத்துக் கேட்பது, மற்றும் பணிவான பதில் ஆகியவை தக்கவைக்கப்பட்டுள்ளன. ஆயினும், הַשַּׁעַר என்பது மூலத்தில் வெறுமனே ‘வாசல்’; ‘நகரவாசல்’ என்பது சூழலுக்குப் பொருந்தினாலும் மூலத்தில் வெளிப்படையாக இல்லாத குறிப்பாக்கம். அதனைத் தவிர்ப்பது பாதுகாப்பானது.'
