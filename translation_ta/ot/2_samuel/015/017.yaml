  text: The king went out[a], and all the people with him on foot, and they halted at the distant house.
translation:
  language: ta
  text: அரசர் புறப்பட்டார்; மக்கள் அனைவரும் அவரைப் பின்தொடர்ந்து சென்றார்கள். அவர்கள் தொலைவிலுள்ள வீட்டில்[a] நின்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இது ஓர் இடப்பெயராக இருக்கலாம்: “பெத்-மெர்ஹாக்.” எபிரெயச் சொற்றொடரை “தொலைவின் வீடு” அல்லது “தொலைவிலுள்ள வீடு” என்று வாசிக்கலாம்; பலர் இதை நகரின் எல்லையிலிருந்த “கடைசி வீடு” என்று புரிந்துகொள்கிறார்கள்.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: புறப்பட்டுச் சென்றார்
  rationale: יצא என்பதன் Qal வழக்குருவான இச்சொல் வெளியேறுதல் அல்லது புறப்படுதலைக் குறிக்கிறது; பயணச் சூழலில் இயல்பான தமிழாக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הַמֶּלֶךְ
  choice: அரசர்
  rationale: சூழலில் தாவீதைக் குறிக்கும் திட்டவட்டமான பெயர்ச்சொல்; நவீன மரியாதைத் தமிழில் இயல்பான வடிவம்.
- source_word: וְכָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: עָם என்பது அரசரோடு சென்ற முழுக் கூட்டத்தையும் குறிக்கிறது; படைவீரர்கள் என்று பொருளைக் குறுக்காமல் அதன் விரிவான பொருள் காக்கப்பட்டது.
- source_word: בְּרַגְלָיו
  choice: அவரோடு கால்நடையாக
  rationale: சொல்லெழுத்தாக ‘அவருடைய காலடியில்/காலருகில்’ என்றாலும், இச்சூழலில் அவருடன் அவரது அணிவகுப்பில், கால்நடையாகச் சென்றதைக் குறிக்கும் எபிரெய மரபுத்தொடராகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: וַיַּעַמְדוּ
  choice: நின்றார்கள்
  rationale: עמד என்பதன் அடிப்படைப் பொருள் ‘நில்’; பயணச் சூழலில் அவர்கள் அங்கே நின்று தங்கியதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בֵּית הַמֶּרְחָק
  choice: தொலைவிலிருந்த வீட்டருகே
  rationale: எபிரெய சொற்றொடரின் நேரடிப் பொருளான ‘தொலைவின் வீடு/தொலைவிலுள்ள வீடு’ என்பதைக் காக்கிறது. இடத்தைக் குறிக்கும் בֵּית என்பதைக் தமிழில் இயல்பாக்க ‘வீட்டருகே’ என வழங்கப்பட்டது; ‘கடைசி வீடு’ என்ற விளக்கத்தை முதன்மை உரையில் திணிக்கவில்லை.
