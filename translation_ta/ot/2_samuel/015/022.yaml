  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தாவீதின் சொல்லில் உள்ள இரட்டை வினை அமைப்பு இயன்றவரை காக்கப்பட்டு, தேவையற்ற விளக்கவுரை சேர்க்கப்படவில்லை.
