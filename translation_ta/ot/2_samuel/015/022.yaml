  yaml_path: translation/ot/2_samuel/015/022.yaml
  text: Then David said to Ittai, “Go on and cross over.” So Ittai the Gittite crossed over, along with all his men and all the little ones who were with him.
translation:
  language: ta
  text: அப்போது தாவீது இத்தாயிடம், “நீ முன்னே சென்று, கடந்து போ” என்றான். எனவே கித்தியனான இத்தாய், தன் ஆட்கள் அனைவரோடும் தன்னுடன் இருந்த சிறு பிள்ளைகள் அனைவரோடும் கடந்து போனான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ וַעֲבֹר
  choice: நீ முன்னே சென்று, கடந்து போ
  rationale: இரண்டு எபிரெய வினைகளின் தொடரையும் இயல்பான தமிழில் காத்து, சூழலில் முன்னோக்கிச் சென்று கடப்பதற்கான தாவீதின் அனுமதி அல்லது கட்டளையை வெளிப்படுத்துகிறது.
- source_word: הַגִּתִּי
  choice: கித்தியனான
  rationale: காத் நகரைச் சேர்ந்தவன் என்ற அடையாளத்தை வழக்கமான வேதாகமப் பெயர்ப்பில் சுருக்கமாகக் காட்டுகிறது.
- source_word: כָל־אֲנָשָׁיו
  choice: தன் ஆட்கள் அனைவரோடும்
  rationale: אֲנָשִׁים என்பது இங்கு இத்தாயுடன் வந்த ஆண் துணைவர்கள் அல்லது வீரர்களைக் குறிக்கிறது; ‘ஆட்கள்’ என்பது சூழலுக்கு ஏற்ற பரந்த சொல்.
- source_word: כָל־הַטַּף
  choice: சிறு பிள்ளைகள் அனைவரோடும்
  rationale: טַף குடும்பக் குழுவிலுள்ள குழந்தைகள் அல்லது சார்ந்திருக்கும் சிறுவர்களைக் குறிக்கிறது; மூலத்தின் வயது சார்ந்த நுணுக்கத்தைத் தெளிவாகக் காக்கிறது.
