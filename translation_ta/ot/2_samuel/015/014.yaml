  text: וַ/יֹּ֣אמֶר דָּ֠וִד לְ/כָל עֲבָדָ֨י/ו אֲשֶׁר אִתּ֤/וֹ בִ/ירוּשָׁלִַ֨ם֙ ק֣וּמוּ וְ/נִבְרָ֔חָה כִּ֛י לֹא תִֽהְיֶה לָּ֥/נוּ פְלֵיטָ֖ה מִ/פְּנֵ֣י אַבְשָׁל֑וֹם מַהֲר֣וּ לָ/לֶ֗כֶת פֶּן יְמַהֵ֤ר וְ/הִשִּׂגָ֨/נוּ֙ וְ/הִדִּ֤יחַ עָלֵ֨י/נוּ֙ אֶת הָ֣/רָעָ֔ה וְ/הִכָּ֥ה הָ/עִ֖יר לְ/פִי חָֽרֶב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/014.yaml
  text: Then David said to all his servants who were with him in Jerusalem[a], “Arise, and let us flee, for there will be no escape for us from Absalom. Hurry to depart[c][b], lest he quickly overtake us and bring disaster upon us and strike the city with the edge of the sword.”
translation:
  language: ta
  text: அப்போது தாவீது, எருசலேமில் தன்னுடன் இருந்த தன் பணியாளர்கள் அனைவரிடமும், “எழுந்திருங்கள், நாம் தப்பியோடுவோம். ஏனெனில் அப்சலோமிடமிருந்து தப்ப நமக்கு வழியில்லை. உடனே புறப்படுங்கள்; இல்லாவிட்டால் அவன் விரைந்து வந்து நம்மைப் பிடித்து, நம்மேல் கேட்டைக் கொண்டுவந்து[a], நகரத்தை வாளால் தாக்குவான்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கேடு” என்பதற்கான எபிரெயச் சொல் “தீமை” என்றும் மொழிபெயர்க்கப்படலாம்; இங்கு அது ஒழுக்கத் தீமையை அல்ல, நேரிடவிருக்கும் பேரிடர் அல்லது அழிவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “வாளின் வாயால் நகரத்தைத் தாக்குவான்.” இது வாளால் கொன்று அழிப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: idiom
lexical_decisions:
- source_word: עֲבָדָיו
  choice: தன் பணியாளர்கள்
  rationale: அரசவைக் சூழலில் இச்சொல் தாவீதுக்குப் பணிபுரிந்த அதிகாரிகள், பரிவாரத்தார் ஆகியோரைப் பொதுவாகக் குறிக்கலாம். ‘அடிமைகள்’ என்பது இங்கு உறுதிப்படுத்தப்படாத சமூக நிலையைக் குறிப்பதால் தவிர்க்கப்பட்டது.
- source_word: קוּמוּ וְנִבְרָחָה
  choice: எழுந்திருங்கள், நாம் தப்பியோடுவோம்
  rationale: கட்டளை வடிவத்தின் அவசரத்தையும், பேசுகிறவரையும் உள்ளடக்கும் கூட்டுவினைத் தூண்டுதலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: פְלֵיטָה
  choice: தப்புவதற்கு ... வழி
  rationale: இங்கு அப்சலோமின் முன்னேற்றத்திலிருந்து உயிர்தப்புதலே கருத்து. ‘மீட்பு’ என்று மொழிபெயர்த்தால் மூலத்தில் வெளிப்படையாக இல்லாத இறையியல் நுட்பம் சேரக்கூடும்.
- source_word: מַהֲרוּ לָלֶכֶת
  choice: உடனே புறப்படுங்கள்
  rationale: சொல்லுக்குச் சொல் ‘செல்ல விரையுங்கள்’ என்றாலும், உடனடியாக இடத்தைவிட்டுப் புறப்பட வேண்டும் என்ற அவசரக் கட்டளையை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: וְהִשִּׂגָנוּ
  choice: நம்மைப் பிடித்து
  rationale: துரத்தி வந்து எட்டிப் பிடித்தல் என்ற இராணுவத் தப்பியோட்டச் சூழலுக்குப் பொருத்தமான இயல்பான தமிழ்.
- source_word: וְהִדִּיחַ עָלֵינוּ אֶת־הָרָעָה
  choice: நம்மேல் பேரழிவைக் கொண்டுவந்து
  rationale: רָעָה இங்கு அறநெறித் ‘தீமை’ என்பதைவிட நேரிடும் கேடு அல்லது பேரிடரைக் குறிக்கிறது; எபிரெயச் சொற்றொடரின் ‘நம்மேல் கொண்டுவருதல்’ என்ற படிமமும் காக்கப்படுகிறது.
- source_word: וְהִכָּה הָעִיר לְפִי חָרֶב
  choice: நகரத்தை வாளால் தாக்குவான்
  rationale: ‘வாளின் வாயால்’ என்பது வாளால் கொன்று அழிப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழில் தெளிவாக இருக்க ‘வாளால் தாக்குவான்’ என வழங்கி, மூலப் படிமம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: רָעָה என்பதன் பொருள்
  choice: பேரழிவு
  alternative: தீமை
  rationale: சூழலில் இது அப்சலோம் ஏற்படுத்தப்போகும் அழிவு அல்லது கேடு; ஒழுக்கத் தீமை என்று மட்டும் புரிந்துகொள்ளச் செய்யாமல் சூழல்சார் பொருள் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரச வரலாற்றுக் கூறலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. அவசரத்தைக் காட்டச் சுருக்கமான கட்டளைகளும் இயல்பான தமிழ்ச் சொற்றொடர்களும் தேர்ந்தெடுக்கப்பட்டன.
