  verdict: revise
  source_fidelity: மூல எபிரெயத்தின் கட்டளைத் தொடரும், தப்பிச் செல்லும் அவசரமும், அப்சலோமால் ஏற்படும் அச்சுறுத்தலும் பெரும்பாலும் துல்லியமாக உள்ளன. ஆனால் כִּי ('ஏனெனில்') என்பதற்கு “இல்லையெனில்” என வழங்கியது நிபந்தனை/விளைவு நுணுக்கத்தைச் சேர்க்கிறது; அதை காரணப்பொருளாகத் திருத்துவது மூலத்திற்கு நெருக்கமானது. רָעָה இச்சூழலில் ‘கேடு/பேரிடர்’ என்பதே பொருத்தம்; “பேரழிவு” சற்றே தீவிரப்படுத்துகிறது.
  naturalness: நடை நவீனத் தமிழில் இயல்பாகவும் அவசரமான சூழலுக்கு ஏற்றதாகவும் உள்ளது. “தப்புவதற்கு நமக்கு வழியே இருக்காது” என்பதற்குப் பதில் “தப்ப நமக்கு வழியில்லை” என்பது சுருக்கமாகவும் நேரடியாகவும் அமையும்.
  terminology: ‘பணியாளர்கள்,’ ‘தப்பியோடுவோம்,’ ‘புறப்படுங்கள்,’ ‘நம்மைப் பிடித்து,’ ‘நகரத்தை வாளால் தாக்குவான்’ ஆகியவை அரசவையையும் இராணுவ அச்சுறுத்தலையும் இயல்பாக வெளிப்படுத்துகின்றன. רָעָה-க்கு ‘கேடு’ என்பதைப் பயன்படுத்துவது மூலத்தின் அளவையும் சூழல்சார் பொருளையும் காக்கிறது. அடிக்குறிப்பு வாளின்-வாய் மரபுத்தொடரின் பொருளைத் தெளிவுபடுத்துகிறது.
