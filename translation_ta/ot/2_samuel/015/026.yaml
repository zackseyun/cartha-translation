  text: וְ/אִם֙ כֹּ֣ה יֹאמַ֔ר לֹ֥א חָפַ֖צְתִּי בָּ֑/ךְ הִנְ/נִ֕י יַֽעֲשֶׂה לִּ֕/י כַּ/אֲשֶׁ֥ר ט֖וֹב בְּ/עֵינָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/026.yaml
  text: But if he says[a], ‘I take no pleasure in you,’ here I am[b]; let him do to me as seems good in his eyes.
translation:
  language: ta
  text: ஆனால் அவர், “உன்மேல் எனக்குப் பிரியம் இல்லை”[a] என்று சொன்னால், இதோ, நான் இருக்கிறேன்; தம் பார்வையில் நல்லதாகத் தோன்றுவதை அவர் எனக்குச் செய்யட்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உன்னிடம் மகிழ்ச்சியடைவதில்லை.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “தம் கண்களில் நல்லதாக இருப்பதை”; அதாவது, தமக்கு நல்லதாகத் தோன்றுவதை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... என்றால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நம்பிக்கைக்கு மாறான சாத்தியத்தை அறிமுகப்படுத்தும் நிபந்தனையையும் எதிர்மறைத் திருப்பத்தையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: כֹּה יֹאמַר
  choice: என்று சொன்னால்
  rationale: כֹּה என்பது אמר உடன் நேர்க்கூற்றை அறிமுகப்படுத்தும் வழக்குச் சொல்; தமிழில் மேற்கோளைத் தொடர்ந்து வரும் ‘என்று சொன்னால்’ அதைப் பொருத்தமாக வெளிப்படுத்துகிறது.
- source_word: לֹא חָפַצְתִּי בָּךְ
  choice: உன்னில் நான் மகிழ்ச்சியடையவில்லை
  rationale: חפץ என்பதன் மகிழ்தல் அல்லது பிரியமாயிருத்தல் என்ற உறவு மற்றும் மதிப்பீட்டுச் சார்ந்த பொருளைப் பாதுகாக்கிறது; ‘உன்னை விரும்பவில்லை’ என்பதில் ஏற்படக்கூடிய வேறு நிழற்பொருளைத் தவிர்க்கிறது.
- source_word: הִנְנִי
  choice: இதோ, நான் இருக்கிறேன்
  rationale: தன்னை முன்வைத்து ஆயத்தத்தையும் பணிவான ஒப்புக்கொடுத்தலையும் தெரிவிக்கும் எபிரெய மரபுத்தொடரின் வலிமையைப் பாதுகாக்கிறது.
- source_word: יַעֲשֶׂה לִּי
  choice: அவர் எனக்குச் செய்யட்டும்
  rationale: இங்கு உள்ள அனுமதி அல்லது பணிவான ஒப்புக்கொடுத்தல் சார்ந்த கட்டளைநிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר טוֹב בְּעֵינָיו
  choice: தம் பார்வைக்கு நல்லதாக இருப்பதை
  rationale: ‘அவருடைய கண்களில் நல்லது’ என்ற எபிரெய வழக்கின் உருவகத்தை வாசிக்கத்தக்க தமிழில் ஓரளவு தக்கவைத்து, அவருக்கு நல்லதாக அல்லது சரியாகத் தோன்றுவதைச் சுட்டுகிறது.
theological_decisions:
- issue: மூன்றாம் நபர் ஒருமைச் சுட்டுப்பெயர்களின் குறிப்பு
  choice: சூழலின்படி ஆண்டவரைக் குறிக்கும் மரியாதை ஒருமை வடிவங்களான ‘அவர்’, ‘தம்’ பயன்படுத்தப்பட்டன; தெய்வீகப் பெயர் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
  alternative: ‘ஆண்டவர்’ என்று பெயரை வெளிப்படையாகச் சேர்த்தல், அல்லது மரியாதையற்ற இலக்கண ஒருமை வடிவைப் பயன்படுத்தல்.
  rationale: எபிரெய உரை இவ்வசனத்தில் தெய்வீகப் பெயரை மீண்டும் கூறாமல் ஒருமை வடிவங்களையே கொண்டுள்ளது. தமிழ் மரியாதை ஒருமை இயல்பாகவும் கண்ணியமாகவும் இருந்து, சூழலில் குறிக்கப்படுபவர் ஆண்டவர் என்பதைக் காட்டுகிறது; அதேவேளை மூலத்தில் இல்லாத பெயரைச் சேர்ப்பதில்லை.
- issue: தாவீதின் கூற்றில் உள்ள பணிவான ஒப்புக்கொடுத்தல்
  choice: ‘இதோ, நான் இருக்கிறேன்; ... செய்யட்டும்’ என்று ஆயத்தத்தையும் கடவுளின் தீர்ப்புக்கு உட்படுதலையும் தக்கவைத்தல்.
  alternative: இதைக் கட்டாய நியதிவாதமாகவோ வெறும் அனுமதியாகவோ தெளிவுபடுத்திச் சொல்லுதல்.
  rationale: הִנְנִי மற்றும் יַעֲשֶׂה ஆகியவை சேர்ந்து பணிவான ஆயத்தத்தையும் ஒப்புக்கொடுத்தலையும் தெரிவிக்கின்றன; உரை அதற்கு அப்பாற்பட்ட கோட்பாட்டுத் தீர்மானத்தை வெளிப்படையாகக் கூறவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. நேர்க்கூற்று இயல்பாக அமைக்கப்பட்டுள்ளது; ‘இதோ, நான் இருக்கிறேன்’ என்ற வடிவம் மூலத்தின் ஆயத்தம் மற்றும் ஒப்புக்கொடுத்தல் சார்ந்த வலிமையைத் தக்கவைக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
