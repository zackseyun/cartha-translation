revisions:
- from: ஆனால் அவர், “உன்னில் நான் மகிழ்ச்சியடையவில்லை”[a] என்று சொன்னால், இதோ, நான் இருக்கிறேன்; தம் பார்வைக்கு நல்லதாக இருப்பதை அவர் எனக்குச் செய்யட்டும்.[b]
  to: ஆனால் அவர், “உன்மேல் எனக்குப் பிரியம் இல்லை”[a] என்று சொன்னால், இதோ, நான் இருக்கிறேன்; தம் பார்வையில் நல்லதாகத் தோன்றுவதை அவர் எனக்குச் செய்யட்டும்.[b]
  rationale: 'The revision improves modern Tamil idiom while preserving every major source-language feature: the adversative condition, the quotation’s lack-of-favor sense, the readiness formula, and David’s submission to what God judges good. The footnote remains attached to the idiom it explains and retains the Hebrew imagery without imposing a theological interpretation.'
