  register: நவீன நிலையான தமிழ்; மரியாதையுடனும் பொதுவாசகர்களுக்கு எளிதாகவும் அமைந்த நடை. தொடர்ச்சியான செயலைக் காட்ட ‘ஏறிக்கொண்டிருந்தார்/ஏறிக்கொண்டே’ பயன்படுத்தப்பட்டுள்ளது. ‘அவரவர்’ பகிர்நிலை ஒருமையை இயல்பாக வெளிப்படுத்துகிறது.
