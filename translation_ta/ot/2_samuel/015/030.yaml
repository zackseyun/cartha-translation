base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/030.yaml
  text: And David was going up the ascent of the Mount of Olives[a], going up and weeping, with his head covered, and he was walking barefoot. And all the people who were with him each covered his head, and they went up[c][b], weeping as they went.
translation:
  language: ta
  text: தாவீது ஒலிவமலை ஏற்றத்தில் ஏறிக்கொண்டிருந்தார்; அவர் ஏறிக்கொண்டே அழுதார். அவர் தம் தலையை மூடியிருந்தார்; வெறுங்காலுடன் நடந்தார். அவரோடு இருந்த மக்கள் அனைவரும் அவரவர் தலையை மூடிக்கொண்டு, ஏறிக்கொண்டே அழுதபடி சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “அவர்கள் ஏறினார்கள்—ஏறிக்கொண்டும் அழுதுகொண்டும்” என்று ஏறிச் செல்லும் செயல் திரும்பக் கூறப்பட்டு வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֵה הַזֵּיתִים
  choice: ஒலிவமலை ஏற்றம்
  rationale: מַעֲלֵה என்பது மேலே செல்லும் ஏற்றத்தையோ ஏற்றப்பாதையையோ குறிக்கிறது; הַזֵּיתִים இங்கு நிலைபெற்ற இடப்பெயராகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: עֹלֶה ... עֹלֶה וּבוֹכֶה
  choice: ஏறிக்கொண்டிருந்தார்; அவர் ஏறிக்கொண்டே அழுதார்
  rationale: திரும்ப வரும் நிகழ்காலப் பங்கேற்பு வடிவங்கள் காட்சியின் தொடர்ச்சியையும் வலியுறுத்தலையும் காட்டுகின்றன; தமிழில் இயல்பாக இருக்கும்படி அந்த மறுபயன்பாடு தக்கவைக்கப்பட்டுள்ளது.
- source_word: בֹּכֶה
  choice: அழுதார்
  rationale: சடங்குசார் புலம்பலைச் சேர்க்காமல், உடல் மற்றும் உணர்ச்சி சார்ந்த அழுகையை நேரடியாகக் குறிக்கிறது.
- source_word: וְרֹאשׁ לוֹ חָפוּי
  choice: அவர் தம் தலையை மூடியிருந்தார்
  rationale: חָפוּי என்பதன் நிலைசார் பொருளைக் காக்கிறது; எவ்வாறு மூடினார் என்பதை ஆதாரமின்றி குறிப்பிடவில்லை.
- source_word: יָחֵף
  choice: வெறுங்காலுடன்
  rationale: காலணி அணியாத நிலையை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: அவரோடு இருந்த மக்கள் அனைவரும்
  rationale: הָעָם என்பதைக் குறிப்பாகப் படைவீரர்கள் என்று குறுக்காமல், உடன் சென்ற மொத்தக் கூட்டத்தையும் பொதுவாகக் குறிக்கிறது.
- source_word: חָפוּ אִישׁ רֹאשׁוֹ
  choice: அவரவர் தலையை மூடிக்கொண்டு
  rationale: אִישׁ என்பதன் பகிர்நிலை ஒருமையை இயல்பான தமிழில் ‘அவரவர்’ என வெளிப்படுத்துகிறது.
- source_word: וְעָלוּ עָלֹה וּבָכֹה
  choice: ஏறிக்கொண்டே அழுதபடி சென்றார்கள்
  rationale: வினைச்சொல்லும் முழுமை வினையெச்ச வடிவமும் தரும் தொடர்ச்சியையும் வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது; எபிரெயச் சொற்றொடரின் நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
