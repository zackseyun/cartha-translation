base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/032.yaml
  text: When David came to the summit[a], where he worshiped God, behold[b], Hushai the Archite came to meet him with his tunic torn and dirt on his head.
translation:
  language: ta
  text: தாவீது, அவர் கடவுளை வழிபடுவது வழக்கமாக இருந்த இடமான உச்சிக்கு வந்தபோது[a], இதோ[b], அர்க்கியனாகிய ஊசாய் அவரை எதிர்கொள்ள வந்தார்; ஊசாயின் அங்கி கிழிந்திருந்தது, அவரது தலையில் மண் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் கடவுளை வழிபட்ட இடம்.” எபிரேய வினை வழக்கமான செயலை அல்லது ஒரு கடந்தகாலச் செயலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இதோ” என்பது ஊசாயின் திடீர் தோற்றத்தை முன்னிறுத்தும் எபிரேயக் கதைச்சுட்டி.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: உச்சி
  rationale: சொல்லர்த்தமாக ‘தலை’ என்றாலும், இங்குள்ள நிலவியல் சூழலில் மலை அல்லது ஏற்றத்தின் உச்சியைக் குறிக்கிறது.
- source_word: אֲשֶׁר יִשְׁתַּחֲוֶה שָׁם לֵאלֹהִים
  choice: அங்கே அவர் கடவுளை வழிபடுவது வழக்கம்
  rationale: יִשְׁתַּחֲוֶה என்பது கடவுளுக்கு முன் பணிந்து வழிபடுதலைக் குறிக்கிறது; imperfect வடிவம் இங்கு வழக்கமான செயல் அல்லது ஒரு கடந்தகாலச் செயல் என இருவகையில் புரிந்துகொள்ளப்படலாம். முதன்மை உரை வழக்கமான செயல் என்ற சாத்தியத்தைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: ஊசாய் திடீரெனக் காட்சியில் தோன்றுவதை முன்னிறுத்தும் எபிரேயக் கதைச் சுட்டியை இயல்பான, உயர்ந்த தமிழில் தக்கவைக்கிறது.
- source_word: לִקְרָאתוֹ
  choice: அவரை எதிர்கொள்ள வந்தார்
  rationale: சந்திப்பதற்காக அவரை நோக்கி வந்த இயக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: அர்க்கியனான ஊசாய்
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, இன/ஊர்சார் அடைமொழி தமிழ் பெயரடை வடிவில் வழங்கப்படுகிறது.
- source_word: קָרוּעַ כֻּתָּנְתּוֹ
  choice: அவரது அங்கி கிழிந்திருந்தது
  rationale: כֻּתֹּנֶת என்பது உடலில் அணியும் அங்கி போன்ற ஆடையைக் குறிக்கிறது; קָרוּעַ அதன் கிழிந்த நிலையைக் கூறுகிறது.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: அவரது தலையில் மண் இருந்தது
  rationale: אֲדָמָה என்பதன் நேரடிப் பொருளான மண்/நிலமண்ணைத் தக்கவைத்து, துக்கத்தின் வெளிப்புற அடையாளத்தைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: வழிபாட்டைச் சுட்டும் imperfect வினையின் கால/வழக்கப் பொருள்
  choice: வழக்கமான செயல் என முதன்மை உரையில் மொழிபெயர்த்தல்
  alternative: ‘அங்கே அவர் கடவுளை வழிபட்டார்’ என ஒரு கடந்தகாலச் செயலாக மொழிபெயர்த்தல்
  rationale: எபிரேய imperfect வடிவம் இரண்டையும் அனுமதிப்பதால், ஒரு பொருளை முதன்மை உரையில் தேர்ந்தெடுத்து மற்றொன்றை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கிறது; எந்தத் தனிப்பட்ட கோட்பாட்டையும் இதன்மேல் கட்டவில்லை.
