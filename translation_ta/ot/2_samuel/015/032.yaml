  register: நவீன செந்தமிழுக்கு அணுக்கமான, கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘இதோ’ என்ற கதைச் சுட்டியும் ‘அங்கி’, ‘மண்’ போன்ற தெளிவான சொற்களும் மூலத்தின் காட்சித் தன்மையைத் தக்கவைக்கின்றன.
