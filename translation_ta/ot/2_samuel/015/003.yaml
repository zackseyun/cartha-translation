source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אַבְשָׁל֔וֹם רְאֵ֥ה דְבָרֶ֖/ךָ טוֹבִ֣ים וּ/נְכֹחִ֑ים וְ/שֹׁמֵ֥עַ אֵין לְ/ךָ֖ מֵ/אֵ֥ת הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/003.yaml
  text: Then Absalom said to him[a], “Look, your claims are good and right[b], but there is no one from the king to hear you.”
translation:
  language: ta
  text: அப்போது அப்சலோம் அவனிடம், “பார், உன் வழக்கு நல்லதும் நியாயமானதுமாக இருக்கிறது[a]. ஆனால் உன் வழக்கைக் கேட்பதற்கு அரசரால் நியமிக்கப்பட்டவர் யாரும் இல்லை[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன் சொற்கள் நல்லவையும் சரியானவையுமாக இருக்கின்றன” அல்லது “உன் கோரிக்கைகள் நல்லவையும் நியாயமானவையுமாக இருக்கின்றன” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ‘சொல்’, ‘காரியம்’, அல்லது சட்டச் சூழலில் ‘வழக்கு/கோரிக்கை’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “அரசரிடமிருந்து உனக்குக் கேட்பவர் யாரும் இல்லை”; அதாவது, அந்த வழக்கைக் கேட்க அரசரால் அதிகாரம் அளிக்கப்பட்டவர் யாரும் இல்லை.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אַבְשָׁלוֹם
  choice: அப்போது அப்சலோம் அவனிடம் ... என்றான்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுப்பதால், இயல்பான தமிழ் கதைநடையில் ‘அப்போது’ பயன்படுத்தப்பட்டது; אֵלָיו என்பது ‘அவனிடம்’ எனக் காக்கப்பட்டது.
- source_word: רְאֵה
  choice: பார்
  rationale: கவனத்தை ஈர்க்கும் கட்டளைச்சொல்; பழமையான அல்லது மிக முறையான வடிவத்தைவிட நவீனத் தமிழில் நேரடியும் இயல்புமாக உள்ளது.
- source_word: דְבָרֶךָ
  choice: உன் வழக்கு
  rationale: דָּבָר என்பதற்கு ‘சொல்’, ‘காரியம்’, ‘வழக்கு’ ஆகிய பொருள்கள் உண்டு. தீர்ப்புக் கோரி வந்தவர்களைப் பற்றிய சட்டச் சூழலில் ‘வழக்கு’ பொருத்தமானது; அடிப்படைச் சொல்லின் பொருள் விரிவை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: טוֹבִים וּנְכֹחִים
  choice: நல்லதும் நியாயமானதுமாக
  rationale: טוֹבִים என்பதன் பொதுவான மதிப்பீட்டை ‘நல்லது’ காக்கிறது; נְכֹחִים குறிக்கும் நேர்மை, சரித்தன்மை, நீதித்தன்மை ஆகியவற்றை சட்டச் சூழலில் ‘நியாயமானது’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְשֹׁמֵעַ אֵין לְךָ מֵאֵת הַמֶּלֶךְ
  choice: ஆனால் உன் வழக்கைக் கேட்பதற்கு அரசரால் நியமிக்கப்பட்டவர் யாரும் இல்லை
  rationale: சொல்லுக்குச் சொல் அமைப்பு ‘அரசரிடமிருந்து உனக்குக் கேட்பவர் இல்லை’ என்பதாகும். இங்கு שֹׁמֵעַ என்பது சட்ட வழக்கைக் கேட்பவரையும், מֵאֵת הַמֶּלֶךְ அரசரின் அதிகாரம் அல்லது நியமனத்தையும் குறிக்கிறது; தமிழில் பொருள் தெளிவாக இருக்கச் சூழல்சார் வெளிப்பாடு தேர்ந்தெடுக்கப்பட்டது.
