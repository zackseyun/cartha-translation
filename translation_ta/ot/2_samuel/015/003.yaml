translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வழக்கைக் கேட்பது’ நீதிசார் சூழலைத் தெளிவாக்குகிறது; எபிரெய மூலத்தின் சொற்பொருள் மாற்றுவாய்ப்புகளும் சுருக்கமான அமைப்பும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
