base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/010.yaml
  text: Then Absalom sent spies throughout all the tribes of Israel, saying, “As soon as you hear the sound of the trumpet, then say, ‘Absalom has become king in Hebron.’”
translation:
  language: ta
  text: அப்சலோம் இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலும் ஒற்றர்களை அனுப்பி, “நீங்கள் எக்காளத்தின் ஒலியைக் கேட்டவுடன், ‘அப்சலோம் எபிரோனில் அரசனானான்’ என்று சொல்லுங்கள்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרַגְּלִים
  choice: இரகசியத் தூதர்கள்
  rationale: இந்தச் சூழலில் இவர்கள் தகவல் திரட்டும் ‘ஒற்றர்கள்’ என்பதைவிட, முன்கூட்டியே வகுக்கப்பட்ட அறிவிப்பை நாடெங்கும் பரப்ப நியமிக்கப்பட்ட மறைமுக முகவர்கள். எனவே சொல்லின் இரகசியச் செயல்பாட்டு அம்சத்தையும் சூழலிலுள்ள தூதுப் பணியையும் வெளிப்படுத்தும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: כְּשָׁמְעֲכֶם
  choice: நீங்கள் ... கேட்டவுடன்
  rationale: כְּ + infinitive construct இங்கு எக்காள ஒலி கேட்ட உடனேயான செயலைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் ‘கேட்டவுடன்’ என வழங்கப்பட்டது.
- source_word: קוֹל הַשֹּׁפָר
  choice: எக்காளத்தின் ஒலி
  rationale: שׁוֹפָר் என்பது ஊதிக் குறியீடு கொடுக்கும் கொம்பு வாத்தியம். தமிழ் வேதாகம நடையில் பரிச்சயமான ‘எக்காளம்’ பயன்படுத்தப்பட்டது; ‘ஒலி’ என்பது קוֹל-ஐ வெளிப்படையாகக் காக்கிறது.
- source_word: מָלַךְ
  choice: அரசனானான்
  rationale: Qal perfect வடிவம் இங்கு அரசாட்சியை ஏற்றுக்கொண்டதாக அறிவிக்கும் பொருளில் உள்ளது. ‘ஆட்சி செய்கிறான்’ என்பதைக் காட்டிலும் ‘அரசனானான்’ நிகழ்ந்ததாகக் கூறப்படும் அரியணை ஏற்றத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּחֶבְרוֹן
  choice: எப்ரோனில்
  rationale: இடப்பெயர் தமிழ் வேதாகமப் பயன்பாட்டில் வழக்கமான வடிவில் ஒலிபெயர்க்கப்பட்டது; בְּ என்பதன் இடவியல் பொருள் ‘-இல்’ எனக் காக்கப்பட்டது.
theological_decisions:
- issue: அப்சலோமின் அரசுரிமை அறிவிப்பின் தன்மை
  choice: ‘அப்சலோம் எப்ரோனில் அரசனானான்’ என்ற நேரடி அறிவிப்பு
  alternative: ‘அப்சலோம் எப்ரோனில் ஆட்சி செய்கிறான்’
  rationale: எபிரெய perfect வடிவம், திட்டமிட்ட குறியீட்டுக்குப் பின் அரசனாகியிருப்பதாக அறிவிக்கச் சொல்வதைத் தருகிறது. அந்தக் கூற்றை உரை உண்மையென உறுதிப்படுத்தாமல், அப்சலோம் சொல்லச் சொன்ன வார்த்தையாக மேற்கோளுக்குள் வைத்திருப்பதால் அரசியல் மற்றும் கதையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டது. கட்டளை மேற்கோள்கள் தெளிவாக அடுக்கப்பட்டுள்ளன. மூலத்தில் இல்லாத விளக்கக் குறிப்புகள் அல்லது சமயப்பிரிவு சார்ந்த கருத்துகள் சேர்க்கப்படவில்லை.
