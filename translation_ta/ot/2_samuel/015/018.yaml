  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. குழுப்பெயர்கள் தமிழில் வழக்கமான வேதாகம ஒலிப்புக்கு அருகாக ஒலிபெயர்க்கப்பட்டுள்ளன; எபிரெய மரபுத்தொடரின் உண்மையான இருபொருள் தன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
