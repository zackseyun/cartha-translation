base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/018.yaml
  text: And all his servants were passing by at his side[a], and all the Cherethites, and all the Pelethites, and all the Gittites—six hundred men who had come on foot with him from Gath—were passing on before the king.
translation:
  language: ta
  text: அவனுடைய பணியாளர்கள் அனைவரும் அவனருகே கடந்து சென்றார்கள். கெரேத்தியர் அனைவரும், பெலேத்தியர் அனைவரும், காத்திலிருந்து அவனுடன் கால்நடையாக வந்த அறுநூறு பேரான கித்தியர் அனைவரும் அரசனுக்கு முன்பாகக் கடந்து சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “காத்திலிருந்து அவனைப் பின்தொடர்ந்து வந்த” என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் நேரடியாக, “காத்திலிருந்து அவனுடைய காலுடன் வந்த” என்று உள்ளது; இது ஒருவருடன் கால்நடையாகச் செல்வதையோ அவரது பரிவாரமாகப் பின்தொடர்வதையோ குறிக்கும் மரபுத்தொடராக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள்
  rationale: இச்சொல் பணியாளர்கள், அரசவைச் சேவகர்கள் அல்லது அதிகாரிகளைக் குறிக்கலாம். பெயரிடப்பட்ட படைப்பிரிவுகளிலிருந்து வேறுபட்ட தாவீதின் பொதுப் பரிவாரத்தைக் குறிக்கும் இச்சூழலில், அடிப்படைப் பொருளை மிகைப்படுத்தாமல் ‘பணியாளர்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: עֹבְרִים עַל יָדוֹ
  choice: அவனருகே கடந்து சென்றார்கள்
  rationale: עַל יָד என்பது ‘அருகில்/பக்கத்தில்’ என்னும் இடவுணர்வைத் தரும் மரபுத்தொடர். தமிழில் இயல்பாகவும் காட்சியின் நகர்வைத் தெளிவாகவும் காட்ட ‘அவனருகே’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַכְּרֵתִי
  choice: கெரேத்தியர்
  rationale: தாவீதின் சேவையிலிருந்த ஒரு குறிப்பிட்ட குழுவின் இனப்பெயர் அல்லது படைப்பிரிவுப் பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַפְּלֵתִי
  choice: பெலேத்தியர்
  rationale: கெரேத்தியரைப் போலவே இது ஒரு குறிப்பிட்ட குழுவின் பெயர்; ஆகவே தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַגִּתִּים
  choice: கித்தியர்
  rationale: காத்தைச் சேர்ந்தவர்களைக் குறிக்கும் இன/இடப்பெயர் சார்ந்த குழுப்பெயர். சுருக்கமாகவும் மூலத்தின் வடிவத்தைப் பேணவும் ‘கித்தியர்’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: அறுநூறு பேர்
  rationale: אִישׁ இங்கு எண்ணிக்கையைக் குறிக்கும் பொதுச் சொல்லாக உள்ளது. சூழல் போர்வீரர்களைக் குறிப்பதாக இருந்தாலும், மூலத்தில் வெளிப்படையாக இல்லாத ‘வீரர்கள்’ என்பதைச் சேர்க்காமல் ‘பேர்’ என வழங்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר בָּאוּ בְרַגְלוֹ מִגַּת
  choice: காத்திலிருந்து அவனுடன் கால்நடையாக வந்த
  rationale: בְרַגְלוֹ சொற்றொடரில் ‘அவனுடைய கால்’ என்ற நேரடிப் படிமம் இருந்து, ஒருவருடன் கால்நடையாகச் செல்வது அல்லது அவரைப் பின்தொடர்வது என்ற மரபுப்பொருள் அமையலாம். முதன்மை உரையில் concrete sense பேணப்பட்டு மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: עֹבְרִים עַל פְּנֵי הַמֶּלֶךְ
  choice: அரசனுக்கு முன்பாகக் கடந்து சென்றார்கள்
  rationale: עַל פְּנֵי என்பது ‘முன்பாக/எதிரே’ என்று பொருள்படும். ஊர்வலமாக அரசனைக் கடந்து செல்லும் காட்சிக்கு ‘அரசனுக்கு முன்பாக’ இயல்பாகப் பொருந்துகிறது.
