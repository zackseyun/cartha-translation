base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/024.yaml
  text: And look[a], Zadok also came, and all the Levites with him, carrying the ark of the covenant of God. And they set down the ark of God[c][b], and Abiathar went up until all the people had finished crossing over from the city.
translation:
  language: ta
  text: இதோ, சாதோக்கும், அவரோடு இருந்த லேவியர்கள் அனைவரும் கடவுளின் உடன்படிக்கைப் பெட்டியைச் சுமந்துகொண்டு வந்தார்கள். அவர்கள் கடவுளின் பெட்டியைக் கீழே வைத்தார்கள்[b]. மக்கள் அனைவரும் நகரத்திலிருந்து கடந்து சென்று முடிக்கும்வரை அபியத்தார் மேலே சென்றார்[c][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, எருசலேமிலிருந்து.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘கடவுளின் பெட்டியை வைத்தார்கள்.’ எபிரெய வினை அதை இறக்கி வைத்ததையோ, ஓரிடத்தில் வைத்ததையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அபியத்தார் மேலே வந்தார்.’ எபிரெயில் சொல்லுக்குச் சொல் ‘மேலே சென்றார்’ என்றுள்ளது; கதையோட்டத்தில் அதன் துல்லியமான நுணுக்கம் உறுதியில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנֵּה
  choice: அப்போது
  rationale: காட்சியின் மாற்றத்தைச் சுட்டும் எபிரெய உரையாடல் அடையாளத்தை, பழமையான ‘இதோ’ என்பதைத் தவிர்த்து இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: גַם צָדוֹק
  choice: சாதோக்கும்
  rationale: גַם என்பதன் சேர்க்கைப் பொருளை ‘-உம்’ விகுதி இயல்பாக வெளிப்படுத்துகிறது; பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כָל הַלְוִיִּם אִתּוֹ
  choice: அவரோடு இருந்த லேவியர்கள் அனைவரும்
  rationale: ‘அவரோடு’ என்பது சூழலில் சாதோக்கைக் குறிப்பதாக இயல்பாகப் புரிகிறது; כָל என்பதன் முழுமையும் காக்கப்படுகிறது.
- source_word: נֹשְׂאִים
  choice: சுமந்துகொண்டு வந்தார்கள்
  rationale: பங்கேற்பு வினை வடிவின் தொடர்ச்சியான செயலைத் தெளிவாகக் காட்டுகிறது; ‘வந்தார்கள்’ என்பது וְהִנֵּה தொடங்கும் காட்சியைத் தமிழில் முழுமையான வாக்கியமாக்கும் சூழல்சார் நிரப்புதல்.
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: கடவுளின் உடன்படிக்கைப் பெட்டி
  rationale: முழு எபிரெய இணைப்புத் தொடரையும் தெளிவான, வழக்கமான தமிழில் காக்கிறது.
- source_word: וַיַּצִּקוּ
  choice: கீழே வைத்தார்கள்
  rationale: இச்சூழலில் பெட்டியைச் சுமப்பதிலிருந்து இறக்கி வைப்பதைக் குறிக்கும் சாத்தியமான பொருளைத் தருகிறது; பொதுவான ‘வைத்தார்கள்’ என்பதும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיַּעַל אֶבְיָתָר
  choice: அபியத்தார் மேலே சென்றார்
  rationale: עלה என்பதன் அடிப்படை மேல்நோக்கிய இயக்கப் பொருளை விளக்கமாகத் தீர்த்துவிடாமல் காக்கிறது.
- source_word: עַד תֹּם כָל הָעָם לַעֲבוֹר
  choice: மக்கள் அனைவரும் கடந்து செல்லும்வரை
  rationale: செயல் முழுமையடையும் கால எல்லையை இயல்பான தமிழ் வினைத்தொடரில் வெளிப்படுத்துகிறது.
- source_word: מִן הָעִיר
  choice: நகரத்திலிருந்து
  rationale: எபிரெயில் உள்ள பொதுவான ‘நகரம்’ என்ற சொல்லையே முதன்மை உரையில் காத்து, அதன் சூழல்சார் குறிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ‘நகரம்’ எதைக் குறிக்கிறது
  choice: முதன்மை உரையில் ‘நகரம்’ எனவே வைக்கப்பட்டது.
  alternative: ‘எருசலேமிலிருந்து’
  rationale: எபிரெய உரை நகரத்தின் பெயரைச் சொல்லவில்லை; சூழலில் எருசலேம் என்பது தெளிவாக இருந்தாலும் அதை முதன்மை உரைக்குள் சேர்க்காமல் அடிக்குறிப்பில் தெரிவிப்பது மூலத்தின் வடிவைக் காக்கிறது.
- issue: וַיַּעַל אֶבְיָתָר என்பதன் நுணுக்கம்
  choice: ‘அபியத்தார் மேலே சென்றார்’
  alternative: ‘அபியத்தார் மேலே வந்தார்’ அல்லது ‘அபியத்தார் பலிகளைச் செலுத்தினார்’
  rationale: עלה முதன்மையாக மேல்நோக்கிய இயக்கத்தைக் குறிக்கிறது. இந்தக் கதையோட்டத்தில் திசை அல்லது ஆசாரியச் செயல் துல்லியமாகத் தெளிவில்லாததால், மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைத் தீர்க்கவில்லை.
- issue: וַיַּצִּקוּ என்பதன் சூழல்சார் பொருள்
  choice: ‘கீழே வைத்தார்கள்’
  alternative: ‘வைத்தார்கள்’ அல்லது ‘அங்கே நிலைநிறுத்தினார்கள்’
  rationale: இங்கு உடன்படிக்கைப் பெட்டியைச் சுமந்தவர்கள் அதை இறக்கி வைக்கும் நிகழ்வு பொருத்தமானது; இருப்பினும் வினை வெறுமனே இடத்தில் வைப்பதையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘உடன்படிக்கைப் பெட்டி’ என்ற பரவலாகப் புரியும் வேதாகமச் சொற்றொடர் பயன்படுத்தப்பட்டது. மூலத்தில் வெளிப்படையாக இல்லாத எருசலேம் என்ற பெயரும், அபியத்தாரின் செயலுக்கான விளக்கவுரையும் முதன்மை உரைக்குள் சேர்க்கப்படவில்லை.
