base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/023.yaml
  text: And all the land was weeping with a loud voice[a], and all the people were crossing over. The king also crossed over the Kidron Valley[b], and all the people were crossing over on the road toward the wilderness.
translation:
  language: ta
  text: நாடு முழுவதும் பெருங்குரலெடுத்து அழுதுகொண்டிருந்தது; மக்கள் அனைவரும் கடந்து சென்றுகொண்டிருந்தார்கள். அரசரும் கிதரோன் பள்ளத்தாக்கைக்[a] கடந்தார். மக்கள் அனைவரும் வனாந்தரத்தை நோக்கிச் செல்லும் வழியில் கடந்துசென்றுகொண்டிருந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கிதரோன் பள்ளத்தாக்கு” என்பது மரபாக “கிதரோன் ஓடை” என்றும் மொழிபெயர்க்கப்படுகிறது. எபிரெயச் சொல் வறண்ட காலத்தில் நீரற்றிருக்கக்கூடிய ஓடைப் பள்ளம், பள்ளத்தாக்கு அல்லது பருவகால நீரோடையைக் குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: எபிரெயச் சொற்றொடர் சுருக்கமானது; இன்னும் நேரடியாக, “வனாந்தர வழியாகக் கடந்துசென்றுகொண்டிருந்தார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָאָרֶץ
  choice: நாடு முழுவதும்
  rationale: இங்கு אָרֶץ என்பது உலகம் முழுவதையும் அல்ல, அப்பகுதியையும் அங்கிருந்த மக்களையும் ஒருங்கே குறிக்கும் கூட்டு வழக்கு. ‘நாடு முழுவதும்’ எபிரெய உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בּוֹכִים קוֹל גָּדוֹל
  choice: பெருங்குரலெடுத்து அழுதுகொண்டிருந்தது
  rationale: קוֹל גָּדוֹל என்பதன் ‘பெரிய/உரத்த குரல்’ என்ற உருவகத்தையும், தொடர்ந்துகொண்டிருந்த பொதுப் புலம்பலையும் இந்தச் சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: כָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: עָם என்பது இச்சூழலில் படைவீரர்களை மட்டும் அல்லாமல் தாவீதுடன் சென்ற மொத்தக் கூட்டத்தையும் குறிக்கிறது.
- source_word: עֹבְרִים / עֹבֵר
  choice: கடந்து சென்றுகொண்டிருந்தார்கள் / கடந்தார்
  rationale: עבר இங்கு எல்லையையோ பள்ளத்தாக்கையையோ கடக்கும் நகர்வைக் குறிக்கிறது. மக்களின் தொடர்ச்சியான நகர்வுக்கு நிகழ்ந்துகொண்டிருக்கும் வடிவமும், அரசரின் குறிப்பிட்ட செயலுக்கு இறந்தகால வடிவமும் பயன்படுத்தப்பட்டன.
- source_word: בְּנַחַל קִדְרוֹן
  choice: கிதரோன் பள்ளத்தாக்கைக்
  rationale: נחל என்பது வறண்ட காலத்தில் நீரற்றிருக்கக்கூடிய ஓடைப் பள்ளம், பள்ளத்தாக்கு அல்லது பருவகால நீரோடையைக் குறிக்கலாம். நவீன வாசகருக்கு நில அமைப்பைத் தெளிவாகக் காட்ட ‘பள்ளத்தாக்கு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עַל פְּנֵי דֶרֶךְ אֶת הַמִּדְבָּר
  choice: வனாந்தரத்தை நோக்கிச் செல்லும் வழியில்
  rationale: எபிரெய சொற்றொடர் சுருக்கமாகவும் ஓரளவு தெளிவின்மையுடனும் உள்ளது; வனாந்தரத்துக்குச் செல்லும் பாதையில் அவர்கள் நகர்ந்தனர் என்ற இயல்பான பொருளை இத்தேர்வு தருகிறது, மாற்று நேரடி வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
