  source_fidelity: மூல எபிரெயத்தின் அமைப்பும் பொருளும் நன்றாகத் தக்கவைக்கப்பட்டுள்ளன. כָל־הָאָרֶץ என்ற கூட்டுவழக்குக்கு ‘நாடு முழுவதும்’ பொருத்தமானது; உரத்த புலம்பல், மக்களின் தொடர்ச்சியான கடத்தல், அரசரின் கிதரோன் கடத்தல், வனாந்தரத்தை நோக்கிய வழி ஆகிய அனைத்தும் இடம்பெற்றுள்ளன. கடைசிச் சொற்றொடரிலுள்ள எபிரெயச் சுருக்கமும் அடிக்குறிப்பில் உரிய மாற்று வாசிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
