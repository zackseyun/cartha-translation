translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பெருங்குரலெடுத்து’ என்பது மூலத்தின் செவிப்புலப் புலம்பல் உருவகத்தைத் தக்கவைக்கிறது; தொடர்நிலை வினைகள் மக்களின் நீடித்த நகர்வை வெளிப்படுத்துகின்றன.
