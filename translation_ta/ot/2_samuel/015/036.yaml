translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரேய சொல்வரிசையை இயந்திரமாகப் பின்பற்றாமல், அதன் கவன ஈர்ப்பு, உறவுமுறை, கட்டளைத் தொனி, தகவல் கடத்தல் ஆகிய அம்சங்கள் காக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்றொடர்களோடு முதன்மை உரையில் இடப்பட்டுள்ளன.
