source:
  edition: WLC
  text: הִנֵּה שָׁ֤ם עִמָּ/ם֙ שְׁנֵ֣י בְנֵי/הֶ֔ם אֲחִימַ֣עַץ לְ/צָד֔וֹק וִ/יהוֹנָתָ֖ן לְ/אֶבְיָתָ֑ר וּ/שְׁלַחְתֶּ֤ם בְּ/יָדָ/ם֙ אֵלַ֔/י כָּל דָּבָ֖ר אֲשֶׁ֥ר תִּשְׁמָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/036.yaml
  text: 'Look[a], their two sons are there with them: Ahimaaz for Zadok, and Jonathan for Abiathar[b]. You shall send to me by their hand every matter that you hear.'
translation:
  language: ta
  text: '“இதோ, அவர்களுடைய மகன்கள் இருவரும் அங்கே அவர்களுடன் இருக்கிறார்கள்: சாதோக்கின் மகன் அகிமாஸ், அபியத்தாரின் மகன் யோனத்தான். நீங்கள் கேள்விப்படும் ஒவ்வொரு செய்தியையும்[b] அவர்கள் மூலமாக[a] என்னிடம் அனுப்புங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லாட்சிப்படி, “அவர்களுடைய கையால்”; அதாவது, அவர்கள் வாயிலாக அல்லது அவர்களைக் கொண்டு.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “நீங்கள் கேள்விப்படும் ஒவ்வொரு காரியத்தையும்” அல்லது “நீங்கள் கேள்விப்படும் அனைத்தையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரேய இடைச்சொல்லின் வலியுறுத்தலையும் சுட்டும் தன்மையையும் இயல்பான, மரியாதைமிக்க நவீன தமிழில் காக்கிறது.
- source_word: שָׁם עִמָּם
  choice: அங்கே அவர்களுடன் இருக்கிறார்கள்
  rationale: மகன்கள் அந்த இடத்தில் ஆசாரியர்களுடன் இருப்பதை வினைச்சொல் சேர்த்து இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
- source_word: שְׁנֵי בְנֵיהֶם
  choice: அவர்களுடைய மகன்கள் இருவரும்
  rationale: சாதோக், அபியத்தார் ஆகியோருடைய இரு மகன்களைக் குறிக்கும் தொடரை இயல்பான தமிழ் சொல்வரிசையில் தருகிறது.
- source_word: אֲחִימַעַץ לְצָדוֹק וִיהוֹנָתָן לְאֶבְיָתָר
  choice: சாதோக்கின் மகன் அகிமாஸ், அபியத்தாரின் மகன் யோனத்தான்
  rationale: முந்தைய தொடரில் இவர்கள் மகன்கள் என்று கூறப்பட்டிருப்பதால், לְ குறிக்கும் உறவைத் தமிழில் வெளிப்படையாகவும் குழப்பமின்றியும் சொல்கிறது.
- source_word: וּשְׁלַחְתֶּם
  choice: அனுப்புங்கள்
  rationale: அறிவுறுத்தல் சூழலில் வரும் வினையின் கட்டளைத் தொனியை நவீன மரியாதைப் பன்மை வடிவில் வெளிப்படுத்துகிறது.
- source_word: בְּיָדָם
  choice: அவர்கள் மூலமாக
  rationale: சொல்லாட்சிப்படி ‘அவர்களுடைய கையால்’ என்றாலும், இது முகமை அல்லது தகவல் கடத்தலைக் குறிக்கும் எபிரேய மரபுத்தொடர்; ‘அவர்கள் மூலமாக’ என்பது தமிழில் இயல்பாக அதே பொருளைத் தருகிறது.
- source_word: כָּל דָּבָר
  choice: ஒவ்வொரு செய்தியையும்
  rationale: דָּבָר என்பதற்கு ‘சொல்,’ ‘காரியம்,’ ‘செய்தி’ ஆகிய பொருள்கள் இருக்கலாம்; உளவுத் தகவல் அனுப்பும் இச்சூழலில் ‘செய்தி’ இயல்பாகப் பொருந்துகிறது, அதன் விரிந்த பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: אֲשֶׁר תִּשְׁמָעוּ
  choice: நீங்கள் கேள்விப்படும்
  rationale: שׁמע என்பதன் நேரடிப் பொருளான ‘கேள்’ என்பதையும், தகவல் கிடைப்பதைக் குறிக்கும் சூழலையும் இயல்பான தமிழில் இணைக்கிறது.
