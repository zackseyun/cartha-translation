  yaml_path: translation/ot/2_samuel/015/016.yaml
  text: So the king went out[a], and all his household after him on foot; and the king left ten women, concubines, to keep the house.
translation:
  language: ta
  text: அப்போது அரசன் புறப்பட்டுச் சென்றான்; அவனுடைய வீட்டார் அனைவரும் அவனைப் பின்தொடர்ந்து கால்நடையாகச் சென்றார்கள்.[a] வீட்டைக் காத்துக்கொள்ள அரசன் துணைமனைவியரான பத்துப் பெண்களை விட்டுச் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லளவில், “அவனுடைய காலடியில்.” அவர்கள் அவனைப் பின்தொடர்ந்து கால்நடையாகச் சென்றார்கள் என்பதே இந்த எபிரெய மரபுத்தொடரின் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: புறப்பட்டுச் சென்றான்
  rationale: יצא என்பது இக்கதைச் சூழலில் ஓர் இடத்திலிருந்து வெளியேறிப் புறப்படுவதைக் குறிக்கிறது; இயல்பான தமிழில் இயக்கத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: எபிரெய உரை தாவீதின் பெயரைச் சொல்லாமல் அவரது பட்டத்தையே பயன்படுத்துவதால் அதைப் பேணுகிறது.
- source_word: וְכָל בֵּיתוֹ
  choice: அவனுடைய வீட்டார் அனைவரும்
  rationale: இங்கு בַּיִת கட்டடத்தையல்ல, அரசனின் இல்லத்தைச் சேர்ந்த மக்களைக் குறிக்கிறது; ‘வீட்டார்’ நவீன தமிழில் இயல்பான கூட்டுப்பெயர்.
- source_word: בְּרַגְלָיו
  choice: அவனைப் பின்தொடர்ந்து கால்நடையாக
  rationale: சொல்லளவில் ‘அவனுடைய காலடியில்/கால்களோடு’ என இருந்தாலும், இச்சொற்றொடர் அரசனைப் பின்தொடர்ந்து நடந்துசென்றதைக் குறிக்கிறது; இரு கருத்துகளையும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיַּעֲזֹב
  choice: அங்கேயே விட்டுச் சென்றான்
  rationale: עזב இங்கு கைவிடுதல் என்ற கடுமையான உணர்வைவிட, ஒரு நோக்கத்திற்காகப் பின்னால் விட்டுச் செல்வதைக் குறிக்கிறது.
- source_word: עֶשֶׂר נָשִׁים פִּלַגְשִׁים
  choice: மறுமனைவியரான பத்துப் பெண்கள்
  rationale: நָשִׁים மற்றும் פִּלַגְשִׁים ஆகிய இரண்டையும் பிரதிபலித்து, அவர்கள் பெண்கள் என்றும் அரசனின் இரண்டாம் நிலை மனைவியர் என்றும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לִשְׁמֹר
  choice: பராமரிப்பதற்காக
  rationale: שׁמר என்பதற்கு காத்தல், கவனித்தல், பேணுதல் ஆகிய பொருள்கள் உண்டு; குடியிருப்பை விட்டுச் செல்லும் இச்சூழலில் ‘பராமரித்தல்’ இயல்பாகவும் தேவையற்ற இராணுவப் பொருளைச் சேர்க்காமலும் உள்ளது.
- source_word: הַבָּיִת
  choice: அரண்மனை
  rationale: இங்கு அரசனுடைய உடல் சார்ந்த குடியிருப்பைக் குறிக்கிறது; ‘அரண்மனை’ சூழலுக்கு இயல்பாக இருந்தாலும், மூலத்தின் பொதுவான ‘வீடு’ என்பதைக் காட்ட அடிக்குறிப்பு வழங்கப்பட்டுள்ளது.
