revisions:
- from: இதோ, நீங்கள் எனக்குத் தெரிவிக்கும்படி உங்களிடமிருந்து செய்தி வரும்வரை, நான் பாலைநிலத்தின் ஆற்றுக் கடவுகளில்[a] காத்திருப்பேன்[b].
  to: பாருங்கள், உங்களிடமிருந்து எனக்குத் தகவல் வரும் வரை நான் பாலைநிலத்தின் ஆற்றுக் கடவுகளில்[a] காத்திருப்பேன்[b].
  rationale: ‘பாருங்கள்’ preserves the plural imperative that introduces David’s statement. ‘தகவல்’ naturally expresses the report/message denoted by דָבָר, while ‘உங்களிடமிருந்து எனக்குத் தகவல் வரும் வரை’ makes explicit, without adding content, that it originates with the addressees and reaches David. The spatial and verbal alternatives remain footnoted.
