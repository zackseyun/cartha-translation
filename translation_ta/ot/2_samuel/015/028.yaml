translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, சாதாரண வாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டது. எபிரெயச் சொல்லின் ‘கடவுகள்/கடக்கும் இடங்கள்’ என்ற சாத்தியமான வேறுபாடும், ‘காத்திருத்தல்/தங்கியிருத்தல்’ என்ற வினை நுணுக்கமும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
