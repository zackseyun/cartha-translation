  text: See[b][a], I will wait at the fords of the wilderness until word comes from you to inform me.
translation:
  language: ta
  text: பாருங்கள், உங்களிடமிருந்து எனக்குத் தகவல் வரும் வரை நான் பாலைநிலத்தின் ஆற்றுக் கடவுகளில்[a] காத்திருப்பேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாலைநிலத்தின் கடக்கும் இடங்களில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தங்கியிருப்பேன்” / “தாமதிப்பேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: இதோ
  rationale: பன்மை ஏவல் வடிவம் இங்கு கவனத்தை ஈர்க்கும் உரையாடல் சொல்லாக வருகிறது; நவீன தமிழில் ‘இதோ’ அதன் நேரடியான உரையாடல் வலிமையை இயல்பாகத் தருகிறது.
- source_word: אָנֹכִי
  choice: நான்
  rationale: தனித்த சுட்டுப்பெயர் வலியுறுத்தலைக் கொண்டிருந்தாலும், தமிழில் வெளிப்படையான ‘நான்’ என்பதே சூழலில் போதுமான வலியுறுத்தலை அளிக்கிறது.
- source_word: מִתְמַהְמֵהַּ
  choice: காத்திருப்பேன்
  rationale: ஹித்பாயேல் வினையெச்சம் தாமதித்தல் அல்லது தங்கியிருத்தலைக் குறிக்கிறது; செய்தி வரும் வரை தாவீது வேண்டுமென்றே அங்கே இருப்பதை ‘காத்திருப்பேன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּעַבְרוֹת
  choice: ஆற்றுக் கடவுகளில்
  rationale: பன்மையில் வரும் இச்சொல் கடக்கும் இடங்களை, குறிப்பாக ஆற்றைக் கடக்கக்கூடிய ஆழமற்ற கடவுகளைச் சுட்டலாம். சூழலுக்குத் துல்லியமாக இருக்க ‘ஆற்றுக் கடவுகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַמִּדְבָּר
  choice: பாலைநிலம்
  rationale: מִדְבָּר என்பது மணற்பாலைவனத்தை மட்டும் அல்லாமல் மக்கள் குடியிருப்பு குறைந்த வறண்ட திறந்த நிலத்தையும் குறிக்கும்; ‘பாலைநிலம்’ நவீனத் தமிழில் அந்தப் பரந்த பொருளைத் தருகிறது.
- source_word: עַד בּוֹא דָבָר
  choice: செய்தி வரும்வரை
  rationale: דָבָר இங்கு ஒரு தகவல் அல்லது அறிக்கையைக் குறிக்கிறது; ‘செய்தி வரும்வரை’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: מֵעִמָּכֶם
  choice: உங்களிடமிருந்து
  rationale: செய்தி அவர்களிடமிருந்து வருவதை இந்த இயல்பான தமிழ் வடிவம் தெளிவாகக் காட்டுகிறது.
- source_word: לְהַגִּיד לִי
  choice: எனக்குத் தெரிவிக்கும்படி
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் அறியச் செய்தல் அல்லது அறிவித்தலைக் குறிக்கிறது; தூதுச் சூழலில் ‘எனக்குத் தெரிவிக்கும்படி’ பொருத்தமானது.
