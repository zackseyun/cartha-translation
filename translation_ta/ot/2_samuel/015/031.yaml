base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/031.yaml
  text: And it was told David[a], saying, “Ahithophel is among the conspirators with Absalom.” And David said, “O Yahweh, please turn Ahithophel’s counsel into foolishness.”
translation:
  language: ta
  text: “அப்சலோமுடன் சேர்ந்த சதிகாரர்களின் நடுவில் அகித்தோப்பேலும் இருக்கிறான்” என்று தாவீதுக்குத் தெரிவிக்கப்பட்டது. அப்போது தாவீது, “யாவே, தயவுசெய்து அகித்தோப்பேலின் ஆலோசனையை மூடத்தனமானதாக ஆக்குவீராக[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அகித்தோப்பேலின் ஆலோசனையை முறியடித்துவிடும்.” எபிரெயத்தில் இன்னும் நேரடியாக, அந்த ஆலோசனையை மூடத்தனமானதாக ஆக்கும்படி வேண்டப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּיד לֵאמֹר
  choice: என்று தாவீதுக்குத் தெரிவிக்கப்பட்டது
  rationale: எபிரெய மொழியின் செய்தி தெரிவிக்கும் அமைப்பை, சொல்லப்படாத எழுவாயைச் சேர்க்காமல், இயல்பான தமிழ் செயப்பாட்டு வடிவில் தருகிறது.
- source_word: בַּקֹּשְׁרִים
  choice: சதித்திட்டம் தீட்டுகிறவர்களில் ஒருவன்
  rationale: பன்மை வடிவம் சதியில் ஈடுபட்ட ஒரு குழுவைக் குறிக்கிறது; அகித்தோப்பேல் அந்தக் குழுவில் சேர்ந்தவன் என்பதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עִם אַבְשָׁלוֹם
  choice: அப்சலோமுடன் சேர்ந்து
  rationale: அப்சலோமோடு உள்ள கூட்டுறவையும் ஒரே தரப்பில் செயல்படுவதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: סַכֶּל
  choice: மூடத்தனமாக்கிவிடும்
  rationale: பீயேல் கட்டளை வடிவம் ஆலோசனையை மூடத்தனமானதாக அல்லது பயனற்றதாக ஆக்கும்படி கேட்கிறது. விளக்கப் பொருளான ‘முறியடித்துவிடும்’ என்பதற்குப் பதிலாக மூலச்சொல்லின் ‘மூடத்தனம்’ என்ற கருத்தைத் தக்கவைக்கிறது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: வேண்டுதலின் பணிவையும் அவசரத்தையும் நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: עֲצַת
  choice: ஆலோசனையை
  rationale: அரசியல் மற்றும் வியூகச் சூழலில் வழங்கப்படும் அறிவுரையைக் குறிக்கும் பொருத்தமான பொதுத்தமிழ்ச் சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை நேரடி அழைப்பில் மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவரே
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இடம்பெறுவதால், ஒரு பட்டத்தைப் பதிலீடு செய்யாமல் பெயரையே ஒலிபெயர்க்கிறது.
- issue: அகித்தோப்பேலின் ஆலோசனை குறித்து தாவீதின் வேண்டுதலின் பொருள்
  choice: ஆலோசனையை மூடத்தனமாக்கிவிடும்
  alternative: ஆலோசனையை முறியடித்துவிடும்
  rationale: அந்த ஆலோசனை நடைமுறையில் தோல்வியடைய வேண்டும் என்பது சூழல்சார் விளைவாக இருக்கலாம்; ஆனால் எபிரெய வினை நேரடியாக அதை மூடத்தனமானதாக ஆக்குமாறு கேட்பதால் அந்த உருவகத் திணறலைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. செய்தி தெரிவிக்கும் தொடர் செயப்பாட்டு வடிவில் வைக்கப்பட்டதால் மூலத்தில் இல்லாத செய்தியாளரின் அடையாளம் சேர்க்கப்படவில்லை. அடிக்குறிப்பு குறி அது விளக்கும் வேண்டுதல் சொற்றொடருக்குப் பிறகு வைக்கப்பட்டுள்ளது.
