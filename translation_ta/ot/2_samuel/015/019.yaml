base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/019.yaml
  text: Then the king said to Ittai the Gittite[a], “Why are you also going with us? Return and stay with the king[c][b], for you are a foreigner and also an exile from your own place.”
translation:
  language: ta
  text: அப்போது அரசர் காத் நகரத்தைச் சேர்ந்த இத்தாயிடம், “நீயும் ஏன் எங்களோடு வருகிறாய்?[a] திரும்பிப்போய் அரசரோடு தங்கியிரு[b]. ஏனெனில் நீ அந்நியன்; நீ உன் சொந்த இடத்தைவிட்டு புலம்பெயர்ந்தவனும்கூட[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீயும் ஏன் எங்களோடு வருவாய்?” அல்லது “நீயும்கூட ஏன் எங்களோடு வர வேண்டும்?”
    reason: எபிரெய நிறைவுறா வினை வடிவம் நிகழ்காலத் தொடர்ச்சி, எதிர்காலம், அல்லது சூழலில் வினவப்படும் ஏற்றத்தகுதி ஆகிய நுணுக்கங்களைக் கொண்டிருக்கலாம்.
  - marker: b
    text: “அரசர்” என்பது யாரைக் குறிக்கிறது என்பதை எபிரெயம் வெளிப்படையாகக் கூறவில்லை; எருசலேமில் ஆட்சி செலுத்தும் அரச அதிகாரத்தைக் குறிக்கக்கூடும்.
    reason: பெயரைக் குறிப்பிடாத மூலவாக்கியத்தின் தெளிவின்மையை வாசகருக்குத் தெரிவிக்கிறது.
  - marker: c
    text: சொல்லடக்கமாக, “உன் இடத்திற்குப் புலம்பெயர்ந்தவன்.” எபிரெயச் சொற்றொடர் சுருக்கமாகவும் பொருளில் கடினமாகவும் உள்ளது; அது இத்தாயின் இடம்பெயர்ந்த நிலையையும் அவரது சொந்த இடத்துடனான தொடர்பையும் வலியுறுத்தலாம்.
    reason: לִמְקוֹמֶךָ என்பதிலுள்ள திசைநோக்கிய முன்னிடைச்சொல்லையும் அதன் தெளிவற்ற தொடர்பையும் மறைக்காமல் பதிவு செய்கிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: அப்போது அரசர் ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையைத் தருகிறது. எபிரெயத்தில் பெயருக்குப் பதிலாகப் பட்டம் இருப்பதால் ‘அரசர்’ என்றே வைக்கப்பட்டது.
- source_word: אִתַּי הַגִּתִּי
  choice: காத் ஊரான இத்தாய்
  rationale: தனிப்பெயர் ஒலிபெயர்க்கப்பட்டது; הַגִּתִּי என்பது காத் நகரத்தைச் சேர்ந்தவர் என்பதைக் குறிக்கும் இனவிடப்பெயர் என்பதால், நவீன வாசகருக்குத் தெளிவாக மொழிபெயர்க்கப்பட்டது.
- source_word: לָמָּה תֵלֵךְ גַּם אַתָּה אִתָּנוּ
  choice: நீயும் ஏன் எங்களோடு வருகிறாய்?
  rationale: தொடர்நிலையிலுள்ள நேரடி கேள்வியாக இயல்பான தமிழில் தரப்பட்டுள்ளது; גַּם אַתָּה என்பதிலுள்ள ‘நீயும்’ என்ற வலியுறுத்தல் காக்கப்படுகிறது.
- source_word: שׁוּב וְשֵׁב
  choice: திரும்பிப்போய் ... தங்கியிரு
  rationale: இரு கட்டளைகளும் காக்கப்படுகின்றன. ישׁב இங்கு நேரடியாக ‘உட்கார்’ என்பதல்ல, ஓரிடத்தில் தொடர்ந்து இரு என்ற பொருளில் உள்ளது.
- source_word: עִם הַמֶּלֶךְ
  choice: அரசரோடு
  rationale: எபிரெயம் மீண்டும் ‘அரசர்’ என்ற பட்டத்தையே பயன்படுத்தி, அது யாரைக் குறிக்கிறது என்பதை வெளிப்படையாகச் சொல்லவில்லை; அந்தத் தெளிவின்மை பாதுகாக்கப்பட்டது.
- source_word: נָכְרִי
  choice: அந்நியன்
  rationale: உள்ளூரைச் சேராதவர் என்ற சமூக-அரசியல் நிலையைக் கண்ணியமான, சுருக்கமான தமிழில் தெரிவிக்கிறது.
- source_word: וְגַם גֹּלֶה אַתָּה לִמְקוֹמֶךָ
  choice: உன் சொந்த இடத்தைவிட்டு புலம்பெயர்ந்தவனும்கூட
  rationale: גֹּלֶה குறிக்கும் இடம்பெயர்ந்த அல்லது நாடுகடத்தப்பட்ட நிலையை ‘புலம்பெயர்ந்தவன்’ எனத் தருகிறது. לִמְקוֹמֶךָ என்பதன் சுருக்கமான, கடினமான அமைப்பு அடிக்குறிப்பில் வெளிப்படுத்தப்படுகிறது.
theological_decisions:
- issue: ‘அரசரோடு தங்கியிரு’ என்பதில் ‘அரசர்’ யார்?
  choice: முதன்மை உரையில் ‘அரசரோடு’ என்ற தெளிவற்ற குறிப்பை அப்படியே வைத்தல்
  alternative: ‘அப்சலோமோடு’, ‘எருசலேமிலுள்ள அரசரோடு’, அல்லது ‘என்னோடு’ என்று அடையாளப்படுத்துதல்
  rationale: எபிரெய மூலவாக்கியம் எந்த நபரின் பெயரையும் குறிப்பிடாமல் הַמֶּלֶךְ என்ற பட்டத்தை மட்டுமே பயன்படுத்துகிறது. ஒருவரைத் தீர்மானித்து எழுதுவது மூலத்தில் இல்லாத விளக்கத்தைச் சேர்த்துவிடும்.
- issue: לִמְקוֹמֶךָ என்பதன் திசை சார்ந்த பொருள்
  choice: சூழலுக்கேற்றபடி ‘உன் சொந்த இடத்தைவிட்டு’ என்று முதன்மை உரையில் தருதல்; சொல்லடக்க வடிவை அடிக்குறிப்பில் காட்டுதல்
  alternative: ‘உன் இடத்திற்குப் புலம்பெயர்ந்தவன்’ என்று சொல்லுக்குச் சொல் மொழிபெயர்த்தல்
  rationale: மசோரா உரையின் לְ முன்னிடைச்சொல் இயல்பாக ‘உன் இடத்திற்கு’ எனப் படினும், முழுச் சொற்றொடர் மிகச் சுருக்கமாகவும் பொருளில் கடினமாகவும் உள்ளது. இத்தாயின் இடம்பெயர்ந்த நிலை முதன்மை உரையில் தெளிவாகத் தரப்பட்டாலும், உரையின் உண்மையான சிக்கல் மறைக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. அரசவைக் கதைநடைக்கு ஏற்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. அரிதான மரபுச் சொற்களைத் தவிர்த்து, ‘காத் ஊரான’, ‘புலம்பெயர்ந்தவன்’ போன்ற பொதுவாகப் புரியும் வடிவங்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
