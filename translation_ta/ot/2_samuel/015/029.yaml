revisions:
- from: ஆகவே சாதோக்கும் அபியத்தாரும் கடவுளின் பெட்டியை எருசலேமுக்குத் திரும்பக் கொண்டுபோய், அங்கேயே தங்கியிருந்தார்கள்.
  to: சாதோக்கும் அபியத்தாரும் கடவுளின் பெட்டியை எருசலேமுக்குத் திரும்பக் கொண்டுபோய், அங்கே தங்கினார்கள்.
  rationale: The revision removes the unsupported inferential connector and unnecessary emphatic/durative shading while preserving the source’s narrative sequence, transitive ‘brought back’ sense, names, destination, and the unexpanded phrase ‘ark of God.’
