  yaml_path: translation/ot/2_samuel/015/029.yaml
  text: So Zadok and Abiathar returned the ark of God to Jerusalem, and they stayed there.
translation:
  language: ta
  text: சாதோக்கும் அபியத்தாரும் கடவுளின் பெட்டியை எருசலேமுக்குத் திரும்பக் கொண்டுபோய், அங்கே தங்கினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: திரும்பக் கொண்டுபோய்
  rationale: שׁוב என்பதன் ஹிஃபில் வடிவம் இங்கு பெட்டியை எருசலேமுக்குத் திரும்ப எடுத்துச் சென்றதைக் குறிக்கிறது. தமிழில் செயப்படுபொருளுடன் இயல்பாகவும் காரணவினைப் பொருளைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: צָדוֹק
  choice: சாதோக்கு
  rationale: எபிரேயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் நிலையான வேதாகமப் பெயர் வடிவத்துக்கு நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: וְאֶבְיָתָר
  choice: அபியத்தாரும்
  rationale: எபிரேயத் தனிப்பெயர் தமிழில் எழுத்துப்பெயர்க்கப்பட்டு, וְ இணைப்பின் பொருள் ‘-உம்’ மூலம் தக்கவைக்கப்பட்டுள்ளது.
- source_word: אֶת אֲרוֹן הָאֱלֹהִים
  choice: கடவுளின் பெட்டியை
  rationale: மூலத்தில் உள்ள ‘கடவுளின் பெட்டி’ என்ற எளிய சொற்றொடரையே மொழிபெயர்க்கிறது; இங்கு இல்லாத ‘உடன்படிக்கை’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: יְרוּשָׁלָם
  choice: எருசலேமுக்கு
  rationale: இடப்பெயருடன் நான்காம் வேற்றுமை உருபைப் பயன்படுத்தி, சூழலில் உள்ள இலக்கு நோக்கிய நகர்வை இயல்பான தமிழில் காட்டுகிறது.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: அங்கேயே தங்கியிருந்தார்கள்
  rationale: ישׁב இச்சூழலில் தொடர்ந்து அங்கே இருந்ததைக் குறிக்கிறது. ‘தங்கியிருந்தார்கள்’ என்பது நவீனத் தமிழில் இயல்பானது; ‘-ஏ’ அங்கேயே தொடர்ந்திருந்ததைச் சுட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட விவரண நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான கதைநடையை ‘ஆகவே’ மற்றும் இணை வினையெச்ச அமைப்பு தக்கவைக்கின்றன; தேவையற்ற உடன்படிக்கைச் சொல்லாடல் சேர்க்கப்படவில்லை.
