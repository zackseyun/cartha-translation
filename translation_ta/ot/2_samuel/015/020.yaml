  text: תְּמ֣וֹל בּוֹאֶ֗/ךָ וְ/הַ/יּ֞וֹם אנוע/ך עִמָּ֨/נוּ֙ לָ/לֶ֔כֶת וַ/אֲנִ֣י הוֹלֵ֔ךְ עַ֥ל אֲשֶׁר אֲנִ֖י הוֹלֵ֑ךְ שׁ֣וּב וְ/הָשֵׁ֧ב אֶת אַחֶ֛י/ךָ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/020.yaml
  text: You came only yesterday[a], and today should I make you wander with us, while I go wherever I can go? Return, and take your brothers back with you[c][b]. May steadfast love and faithfulness be with you.
translation:
  language: ta
  text: நீ நேற்றுதானே வந்தாய்; இன்று, நான் எங்கே போகிறேனோ அங்கே போய்க்கொண்டிருக்கையில், உன்னை எங்களோடு அலையச் செய்வேனா? திரும்பிப் போ; உன் சகோதரர்களையும் உன்னோடு திரும்ப அழைத்துச் செல்.[a] நிலையான அன்பும் நம்பகத்தன்மையும் உன்னோடு இருப்பதாக.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன் சகோதரர்கள்” என்பது இத்தாயுடன் வந்த அவனுடைய உடனிருந்தவர்களையோ உறவினர்களையோ குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: “நிலையான அன்பும் நம்பகத்தன்மையும்” என்பது பற்றுறுதியான அன்பையும் நம்பகத்தன்மையையும் இணைத்துக் கூறும் எபிரெயச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּמוֹל בּוֹאֶךָ
  choice: நீ நேற்றுதானே வந்தாய்
  rationale: תְּמוֹל என்பதன் அடிப்படைப் பொருள் ‘நேற்று’; ‘தானே’ என்பது இத்தாய் மிக அண்மையில்தான் வந்தான் என்ற தாவீதின் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲנוּעֲךָ
  choice: உன்னையும் ... அலையச் செய்வேனா?
  rationale: נוע வேரின் causative வடிவம் நிலையற்ற அலைச்சலுக்குள் ஒருவரை உட்படுத்துவதைக் குறிக்கிறது; கேள்வி வடிவமும் காரணவினை நுட்பமும் காக்கப்படுகின்றன.
- source_word: עִמָּנוּ לָלֶכֶת
  choice: எங்களோடு
  rationale: ‘போக’ என்ற கருத்து சுற்றியுள்ள வினைத் தொடரில் ஏற்கெனவே தெளிவாக இருப்பதால், தமிழில் இயல்பாகச் சுருக்கப்பட்டுள்ளது.
- source_word: וַאֲנִי הוֹלֵךְ עַל אֲשֶׁר אֲנִי הוֹלֵךְ
  choice: நான் போகும் இடமெல்லாம் போய்க்கொண்டிருக்கையில்
  rationale: எபிரெயச் சொற்றொடரின் திட்டமின்மையையும் தாவீதின் நிச்சயமற்ற தப்பிச் செல்லுதலையும் காக்கும் வகையில், மிகத் தீர்மானமான விளக்கத்தைச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שׁוּב וְהָשֵׁב
  choice: திரும்பிப் போ; ... திரும்ப அழைத்துச் செல்
  rationale: முதல் வினையின் கட்டளையையும், இரண்டாவது ஹிஃபில் வடிவத்தின் காரணவினைப் பொருளையும் வேறுபடுத்திக் காட்டுகிறது.
- source_word: אַחֶיךָ
  choice: உன் சகோதரர்கள்
  rationale: மூலத்தின் நேரடியான உறவுமுறைச் சொல்லைத் தக்கவைக்கிறது; சூழலில் இது இத்தாயின் உடனிருந்தவர்களையோ உறவினர்களையோ குறிக்கலாம்.
- source_word: חֶסֶד וֶאֱמֶת
  choice: மாறாத அன்பும் உண்மையும்
  rationale: חֶסֶד என்பதிலுள்ள நிலையான, பற்றுறுதியான அன்பையும் אֱמֶת என்பதிலுள்ள உண்மை/நம்பகத்தன்மையையும் dignified, பொதுவாகப் புரியும் தமிழில் தருகிறது.
theological_decisions:
- issue: வசனத்தின் இறுதியில் வினையின்றி வரும் חֶסֶד וֶאֱמֶת என்பதன் உரையாடல் வலிமை
  choice: மாறாத அன்பும் உண்மையும் உன்னோடு இருப்பதாக
  alternative: மாறாத அன்பும் உண்மையும்
  rationale: எபிரெயத்தில் வெளிப்படையான வினை இல்லை. சூழலில் இது ஆசிவாக்காக இருப்பதால் ‘இருப்பதாக’ சேர்க்கப்படுகிறது; அதேவேளை அந்த அருளின் மூலத்தை உரையில் இல்லாத வகையில் குறிப்பிட்டு விடவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். தாவீதின் கேள்வியில் உள்ள இரக்கத்தையும் அவனது பயணத்தின் நிச்சயமற்ற தன்மையையும் காக்கிறது; தேவையற்ற சமயப் பிரிவுசார் விளக்கங்கள் தவிர்க்கப்பட்டுள்ளன.
