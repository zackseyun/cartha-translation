base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/033.yaml
  text: David said to him[a], “If you pass on with me, you will be a burden to me.”
translation:
  language: ta
  text: தாவீது அவனிடம், “நீ என்னோடு தொடர்ந்து வந்தால்[a], எனக்குச் சுமையாக இருப்பாய்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ என்னோடு கடந்து வந்தால்.” எபிரெய வினைச்சொல் இன்னும் நேரடியாக “கடந்து செல்” அல்லது “அப்பால் செல்” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... דָּוִד
  choice: தாவீது ... என்றார்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுக்கிறது; நவீனத் தமிழில் தேவையற்ற ‘பின்பு/மேலும்’ என்பதைச் சேர்க்காமல் இயல்பான சொல்வரிசையில் மொழிபெயர்க்கப்பட்டது.
- source_word: לוֹ
  choice: அவனிடம்
  rationale: எபிரெயத்தில் பெயர் குறிப்பிடப்படாமல் ஆண்பால் ஒருமைச் சுட்டுப்பெயர் உள்ளது. சூழலில் இது ஊசாயைக் குறித்தாலும், வசனத்தின் நேரடி சொற்களை மதித்து சுட்டுப்பெயரே வைக்கப்பட்டது.
- source_word: אִם
  choice: வந்தால்
  rationale: நிபந்தனையைத் தமிழில் இயல்பாகக் காட்ட ‘-ஆல்’ விகுதி பயன்படுத்தப்பட்டது.
- source_word: עָבַרְתָּ אִתִּי
  choice: நீ என்னோடு தொடர்ந்து வந்தால்
  rationale: עבר என்பது அடிப்படையில் ‘கடந்து செல்/மேற்கொண்டு செல்’ என்று பொருள்படும். இச்சூழலில் தாவீதுடன் பயணத்தைத் தொடர்வதே கருத்தாக இருப்பதால், இயல்பான தமிழில் ‘தொடர்ந்து வந்தால்’ என வழங்கப்பட்டது; நேரடியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְהָיִתָ עָלַי
  choice: எனக்கு ... இருப்பாய்
  rationale: היה + על என்ற அமைப்பு தாவீதின்மேல் ஏற்படும் சுமை அல்லது தாக்கத்தைக் குறிக்கிறது; தமிழில் பயனிலைச் சொல்லுடன் இயல்பாக அமைக்கப்பட்டது.
- source_word: לְמַשָּׂא
  choice: சுமையாக
  rationale: מַשָּׂא என்பது சுமக்கப்படும் பாரம் அல்லது தொந்தரவாகும் ஒன்றைக் குறிக்கிறது. இங்கு ஒருவரின் உடனிருப்பு தாவீதுக்கு உதவாமல் பாரமாக இருக்கும் கருத்தை ‘சுமையாக’ தெளிவாகத் தெரிவிக்கிறது.
