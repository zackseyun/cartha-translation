base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/006.yaml
  text: Absalom did this to all Israel who came to the king for judgment[a], and Absalom stole the hearts of the men of Israel.
translation:
  language: ta
  text: அரசனிடம் நீதித்தீர்ப்பு பெற வந்த இஸ்ரவேலர் அனைவரிடமும் அப்சலோம் இவ்வாறே நடந்துகொண்டான். இப்படி அப்சலோம் இஸ்ரவேல் ஆண்களின் உள்ளங்களைக் களவாடினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல் ஆண்களின் உள்ளங்களைத் தன்வசப்படுத்தினான்.” எபிரெயத்தில் சொற்சொல்லாக “இதயத்தைக் களவாடினான்” என்று உள்ளது; மறைமுகமாகவோ சூழ்ச்சியாகவோ அவர்களுடைய ஆதரவையும் பற்றுறுதியையும் பெற்றுக்கொண்டதைக் குறிக்கும் உருவகம் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּדָּבָר הַזֶּה
  choice: இவ்வாறே நடந்துகொண்டான்
  rationale: முந்தைய வசனத்தில் விவரிக்கப்பட்ட அப்சலோமின் தொடர்ச்சியான செயல்முறையை இச்சொற்றொடர் சுட்டுகிறது. சொற்சொல்லான ‘இந்தக் காரியத்தின்படி செய்தான்’ என்பதைக் காட்டிலும் இது இயல்பான தமிழில் அதே பொருளைத் தருகிறது.
- source_word: לְכָל יִשְׂרָאֵל אֲשֶׁר יָבֹאוּ
  choice: வந்த இஸ்ரவேலர் அனைவரிடமும்
  rationale: இறந்தகாலத்தில் வழக்கமாகத் தொடர்ந்து நிகழ்ந்த செயலை எபிரெய imperfect வடிவம் குறிக்கிறது; ‘வந்த’ என்பது அதைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לַמִּשְׁפָּט אֶל הַמֶּלֶךְ
  choice: அரசனிடம் தீர்ப்புப் பெற
  rationale: מִשְׁפָּט இங்கு நீதித்துறை விசாரணை அல்லது தீர்ப்பைக் குறிக்கிறது. ‘தீர்ப்புப் பெற’ என்பது அரசனை நீதித் தீர்ப்பு வழங்கும் அதிகாரியாக அணுகிய சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיְגַנֵּב אֶת לֵב
  choice: உள்ளங்களைக் களவாடினான்
  rationale: גנב என்பதன் அடிப்படைப் பொருள் ‘திருடுதல்/களவாடுதல்.’ விசுவாசத்தை மறைமுகமாக அல்லது சூழ்ச்சியாகத் தன்வசப்படுத்தியதை உணர்த்தும் மூல உருவகத்தை ‘களவாடினான்’ பாதுகாக்கிறது. பலரைக் குறிப்பதால் ஒருமை கூட்டுப்பெயரான לֵב தமிழில் இயல்பாகப் பன்மையாக்கப்பட்டுள்ளது.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: இஸ்ரவேல் ஆண்கள்
  rationale: אַנְשֵׁי என்பது வடிவிலும் நேரடிப் பொருளிலும் ‘ஆண்கள்’ என்பதாகும். அது விரிந்த மக்கள்தொகையைப் பிரதிநிதித்துவப்படுத்தியிருக்கக்கூடும் என்றாலும், மூலத்தின் பாலினக் குறியீட்டை முதன்மை உரை பாதுகாக்கிறது.
theological_decisions:
- issue: אַנְשֵׁי יִשְׂרָאֵל என்ற பாலினக் குறியீடுள்ள சொற்றொடர்
  choice: இஸ்ரவேல் ஆண்கள்
  alternative: இஸ்ரவேல் மக்கள் / இஸ்ரவேலர்
  rationale: மூல எபிரெயம் ‘ஆண்கள்’ என்று வெளிப்படையாகக் கூறுகிறது. அது பொதுமக்களைப் பிரதிநிதித்துவப்படுத்தும் பயன்பாடாக இருக்கலாம் என்ற சாத்தியத்தை மொழிபெயர்ப்பு மறுக்கவில்லை; இருப்பினும் முதன்மை உரையில் பாலினக் குறியீட்டை நீக்காமல் வைத்துள்ளது.
- issue: ‘இதயத்தைத் திருடுதல்’ என்ற உருவகத்தின் மதிப்பீட்டுச் சாயல்
  choice: உள்ளங்களைக் களவாடினான்
  alternative: உள்ளங்களைக் கவர்ந்துகொண்டான்
  rationale: மூலத்தில் உள்ள ‘திருடுதல்’ உருவகம் அப்சலோம் விசுவாசத்தை வென்றதோடு, அதில் மறைமுகம் அல்லது சூழ்ச்சி இருந்ததையும் உணர்த்துகிறது. நடுநிலையான ‘கவர்ந்துகொண்டான்’ அந்த அழுத்தத்தைக் குறைத்துவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘இவ்வாறே நடந்துகொண்டான்’ என்பது முந்தைய வசனத்தில் கூறப்பட்ட தொடர் நடைமுறையை இயல்பாகச் சுட்டுகிறது; ‘உள்ளங்களைக் களவாடினான்’ என்பது மூலத்தின் வலுவான உருவகத்தைப் பாதுகாக்கிறது.
