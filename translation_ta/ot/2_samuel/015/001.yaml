base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/001.yaml
  text: After this[a], Absalom made for himself a chariot and horses[b], and fifty men running before him.
translation:
  language: ta
  text: இதற்குப் பிறகு, அப்சாலோம் தனக்கென ஒரு தேரையும் குதிரைகளையும், தனக்கு முன்னால் ஓடும் ஐம்பது ஆட்களையும் வைத்துக்கொண்டான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வைத்துக்கொண்டான்” என்பதற்கு “தனக்கெனச் செய்துகொண்டான்,” “ஏற்பாடு செய்துகொண்டான்,” அல்லது “பெற்றுக்கொண்டான்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் செய்தல் அல்லது தனக்காகப் பெற்றுக்கொள்ளல் என்பதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מֵאַחֲרֵי כֵן
  choice: இதற்குப் பிறகு
  rationale: எபிரெயக் கதைத் தொடர் சூத்திரத்தின் காலத் தொடர்பை இயல்பான நவீனத் தமிழில் பாதுகாக்கிறது.
- source_word: וַיַּעַשׂ לוֹ
  choice: தனக்காக ... ஏற்படுத்திக்கொண்டான்
  rationale: עָשָׂה என்பதன் ‘செய்தான்’ அல்லது ‘பெற்றுக்கொண்டான்/ஏற்பாடு செய்தான்’ என்ற சாத்தியங்களை முற்றிலும் சுருக்காமல், தேர், குதிரைகள், ஆட்கள் ஆகியவற்றைத் தனக்கென அமைத்துக்கொண்ட சூழல்சார் பொருளை இயல்பாகத் தருகிறது.
- source_word: אַבְשָׁלוֹם
  choice: அப்சாலோம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: מֶרְכָּבָה וְסֻסִים
  choice: ஒரு தேரையும் குதிரைகளையும்
  rationale: மூலத்தின் எளிய பட்டியல் அமைப்பையும் அரசச் சின்னமாக இருக்கக்கூடிய மறைபொருளை வெளிப்படையாகச் சேர்க்காமலும் பாதுகாக்கிறது.
- source_word: וַחֲמִשִּׁים אִישׁ רָצִים לְפָנָיו
  choice: தனக்கு முன்னால் ஓடுவதற்கு ஐம்பது ஆட்களையும் வைத்துக்கொண்டான்
  rationale: பங்கேற்பு வினைச்சொல்லின் செயல்/பணி உணர்வைத் தெளிவான தமிழில் தருகிறது; அவர்கள் அப்சாலோமுக்கு முன்னால் சென்ற அணிவகுப்பு என்பதும் வெளிப்படுகிறது.
theological_decisions:
- issue: அப்சாலோமின் அணிவகுப்பிலுள்ள அரசியல் அடையாளம்
  choice: முதன்மை உரையில் நிகழ்வை மட்டும் விவரித்து, அரசனைப் போன்ற தன்னை உயர்த்திக்காட்டும் நோக்கத்தை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘அரச பாணியிலான அணிவகுப்பை அமைத்தான்’ என்று முதன்மை உரையிலேயே விளக்குதல்
  rationale: மூலம் தேர், குதிரைகள், முன்னோடி ஓட்டக்காரர்கள் ஆகியவற்றை விவரிக்கிறது; அரச ஆசையின் குறிப்பு சூழலில் உணரப்பட்டாலும், அதை நேரடி கூற்றாக மாற்றக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான கதைநடை. ‘ஏற்படுத்திக்கொண்டான்’ என்பது மூல வினையின் நெகிழ்வைச் சூழலுக்கு ஏற்றவாறு தக்கவைக்கிறது; அரச உரிமைகோரலை முதன்மை உரை நேரடியாகச் சொல்லவில்லை.
