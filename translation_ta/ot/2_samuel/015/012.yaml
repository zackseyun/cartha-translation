base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/012.yaml
  text: And Absalom sent for Ahithophel the Gilonite[a], David’s counselor, from his city, from Giloh, while he was offering the sacrifices. And the conspiracy grew strong[c][b], and the people kept increasing with Absalom.
translation:
  language: ta
  text: அப்சலோம் பலிகளைச் செலுத்திக்கொண்டிருந்தபோது, தாவீதின் ஆலோசகரான கீலோவைச் சேர்ந்த அகித்தோப்பேலை[a] அவனுடைய ஊரான கீலோவிலிருந்து வரவழைத்தான். சதி வலுப்பெற்றது[b]; அப்சலோமோடு இருந்த மக்கள் தொடர்ந்து பெருகினர்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அகித்தோப்பேலை அனுப்பினான்.” எபிரேய வினைச்சொல்லை இவ்வாறு நேரடியாக மொழிபெயர்க்கலாம்; ஆனால் இச்சூழலில் அப்சலோம் அவனைத் தன்னிடம் வருமாறு அழைத்தனுப்பினான் என்பதே பொருத்தமாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சதித்திட்டம் வலுப்பெற்றது.”
    reason: lexical_alternative
  - marker: c
    text: 'சொல்லுக்கு சொல்: “மக்கள் அப்சலோமோடு சென்று பெருகிக்கொண்டிருந்தார்கள்”; இது அவனுக்கான ஆதரவு படிப்படியாக அதிகரித்ததைக் குறிக்கிறது.'
    reason: lexical_alternative
