- source_word: הַגִּלֹנִי
  choice: கீலோ ஊரானாகிய
  rationale: கீலோவைச் சேர்ந்தவர் என்பதைக் குறிக்கும் குடியினப் பெயரை நவீன தமிழில் தெளிவாகவும், பின்னர் வரும் இடப்பெயருடன் தொடர்புடையதாகவும் வழங்குகிறது.
- source_word: יוֹעֵץ דָּוִד
  choice: தாவீதின் ஆலோசகரான
  rationale: தாவீதுடன் அகித்தோப்பேலுக்கு இருந்த அரசியல் ஆலோசனைப் பொறுப்பைக் கட்டமைப்பு உறவுடன் இயல்பாகக் காட்டுகிறது.
- source_word: מֵעִירוֹ מִגִּלֹה
  choice: அவனுடைய ஊரான கீலோவிலிருந்து
  rationale: ‘அவனுடைய ஊர்’ என்ற பொதுப்பெயரையும் ‘கீலோ’ என்ற இடப்பெயரையும் ஒன்றையும் விடாமல் இயல்பான தமிழ் அப்பொசிஷனாக வழங்குகிறது.
- source_word: בְּזָבְחוֹ אֶת־הַזְּבָחִים
  choice: பலிகளைச் செலுத்திக்கொண்டிருந்தபோது
  rationale: முன்னிடைச்சொல்லுடன் கூடிய infinitive construct குறிக்கும் ஒரேநேரச் செயலைப் பாதுகாக்கிறது; எபிரேயச் சொல் மீளுரையைத் தமிழில் இயல்பாகச் சுருக்குகிறது. இலக்கணப்படி பலி செலுத்தியவர் அப்சலோம் என்பதைக் காட்ட வாக்கிய அமைப்பு தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַקֶּשֶׁר
  choice: சதி
  rationale: அப்சலோமின் ஒருங்கிணைக்கப்பட்ட அரசியல் கிளர்ச்சியைக் குறிக்கும் சுருக்கமான, இயல்பான தமிழ்ச் சொல்; ‘சதித்திட்டம்’ என்பதும் சாத்தியம்.
- source_word: אַמִּץ
  choice: வலுப்பெற்றது
  rationale: וַיְהִי உடன் வரும் வளர்ச்சிநிலையை நிலையான ‘வலுவாக இருந்தது’ என்பதற்குப் பதிலாக தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הוֹלֵךְ וָרָב
  choice: எண்ணிக்கை தொடர்ந்து பெருகியது
  rationale: தொடர்ச்சியாக அதிகரித்த ஆதரவை குறிக்கும் எபிரேயத் தொடர் வினைநிலையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: அப்சலோமுடன் இணைந்த கூட்டத்தைக் குறிக்கும் நேரடியான பொதுச் சொல்.
- source_word: אֶת אַבְשָׁלוֹם
  choice: அப்சலோமுடன் சேர்ந்த
  rationale: இங்கு אֶת நேரடிப் பொருள் குறியீடாக அல்லாமல் உடனிருப்பு அல்லது சார்பு பொருளில் வருவதால், அரசியல் ஆதரவு பெருகியதை இயல்பாகத் தெரிவிக்கிறது.
