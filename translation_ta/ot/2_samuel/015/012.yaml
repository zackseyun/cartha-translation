translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘வரவழைத்தான்’ சூழல்சார் பொருளைத் தருகிறது; அடிக்குறிப்பு நேரடி மாற்றைப் பாதுகாக்கிறது. பலி செலுத்திய செய்பவர் எபிரேய வாக்கியத்தில் அப்சலோம் என்பதால் தமிழ் வாக்கியத்தின் தொடக்கத்தில் அவன் தெளிவாக இணைக்கப்பட்டான். அரசியல் சதியின் வலுப்பெறுதலும் மக்கள் ஆதரவின் தொடர்ச்சியான பெருக்கமும் தனித்தனி கூற்றுகளாகப் பாதுகாக்கப்பட்டுள்ளன.
