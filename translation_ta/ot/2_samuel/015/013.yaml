  yaml_path: translation/ot/2_samuel/015/013.yaml
  text: Then a messenger came to David[a], saying, “The hearts of the men of Israel are with Absalom.”
translation:
  language: ta
  text: அப்போது ஒரு செய்தியாளர் தாவீதிடம் வந்து, “இஸ்ரவேல் ஆண்களின் மனங்கள் அப்சலோமின் பக்கம் இருக்கின்றன[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லெழுத்தாக, “இஸ்ரவேல் ஆண்களின் இதயம் அப்சலோமுக்குப் பின்னால் இருந்தது.” இது அவர்களுடைய விசுவாசம் அல்லது ஆதரவு அப்சலோமின் பக்கம் இருந்ததைக் குறிக்கும் மொழிமரபு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: அப்போது ... வந்து
  rationale: தொடர்கதைச் செயலாக வரும் wayyiqtol வடிவத்தை இயல்பான தமிழ் கடந்தகாலத் தொடரால் வெளிப்படுத்துகிறது; ‘அப்போது’ கதை நகர்வைத் தெளிவாக்குகிறது.
- source_word: הַמַּגִּיד
  choice: செய்தி கொண்டுவந்த ஒருவன்
  rationale: Hiphil வினையெச்ச வடிவம் ஒரு செய்தி அல்லது அறிக்கையைத் தெரிவிப்பவனைக் குறிக்கிறது. இச்சூழலில் புதிய பாத்திரத்தை அறிமுகப்படுத்தும் இயல்பான தமிழ்ச் சொற்றொடர் இது.
- source_word: לֵאמֹר
  choice: என்றான்
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெயக் கட்டமைப்பை, தமிழில் கூற்றின் முடிவில் வரும் இயல்பான உரையாடல் வினையால் தருகிறது.
- source_word: הָיָה לֶב
  choice: உள்ளம் ... பக்கம் திரும்பிவிட்டது
  rationale: ‘இதயம்/உள்ளம்’ இங்கு மனநிலை, விருப்பம், அரசியல் விசுவாசம் ஆகியவற்றைக் குறிக்கிறது. היה என்பதில் நிலை அல்லது நிலைமாற்றத்தின் நிழல் இருக்கக்கூடும்; சூழலில் விசுவாசம் அப்சலோமிடம் சென்றுவிட்டதை ‘திரும்பிவிட்டது’ இயல்பாக உணர்த்துகிறது.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேல் ஆண்கள்
  rationale: אִישׁ ஒருமை வடிவில் இருந்தாலும் இங்கு கூட்டுப்பொருளில் வருகிறது. ஆண்பால் மற்றும் அரசியல்/படைத்துறை சார்ந்த சாத்தியமான நுணுக்கத்தைப் பாதுகாக்க ‘ஆண்கள்’ பயன்படுத்தப்பட்டது.
- source_word: אַחֲרֵי
  choice: பக்கம்
  rationale: சொல்லெழுத்தாக ‘பின்னால்’ என்றாலும், இங்கு ஒருவரைப் பின்பற்றுதல் அல்லது அவருக்கு விசுவாசமாக இருத்தல் என்னும் அரசியல் சார்பு பொருளைத் தருகிறது.
- source_word: אַבְשָׁלוֹם
  choice: அப்சலோம்
  rationale: தமிழ் வேதாகமப் பெயர்வழக்குக்கு ஏற்ற ஒலிபெயர்ப்பு.
theological_decisions:
- issue: ‘இதயம் அப்சலோமுக்குப் பின்னால்’ என்ற உருவகத்தின் பொருள்
  choice: அரசியல் விசுவாசம் அப்சலோமின் பக்கம் திரும்பியது எனத் தெளிவாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இஸ்ரவேல் ஆண்களின் இதயம் அப்சலோமுக்குப் பின்னால் இருக்கிறது’ என்று சொல்லெழுத்தாக மொழிபெயர்த்தல்.
  rationale: இது இறையியல் முடிவைச் சேர்ப்பதல்ல; எபிரெய மொழிமரபின் அரசியல் சார்பு பொருளை நவீன தமிழில் புரியும்படி தருகிறது. சொல்லெழுத்து வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. எபிரெயத்தின் ஒருமை ‘இதயம்’ தமிழிலும் ‘உள்ளம்’ எனப் பாதுகாக்கப்பட்டு, கூட்டுப்பொருளான ‘ஆண்கள்’ உடன் இயல்பாக இணைக்கப்பட்டது.
