translation_notes:
  register: நவீனத் தரத் தமிழ்; அரசவைக்குரிய மரியாதையும் விசுவாசமான ஆயத்தமும் காக்கப்பட்டுள்ளன. மூலத்தின் சொற்படி அமைப்பைத் தமிழில் கடினமாக நகலெடுக்காமல், அதன் முழுமையான இணக்கப் பொருள் இயல்பான நேரடி உரையாக வழங்கப்பட்டுள்ளது.
