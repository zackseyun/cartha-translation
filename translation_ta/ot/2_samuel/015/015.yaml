  text: וַ/יֹּאמְר֥וּ עַבְדֵֽי הַ/מֶּ֖לֶךְ אֶל הַ/מֶּ֑לֶךְ כְּ/כֹ֧ל אֲשֶׁר יִבְחַ֛ר אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ הִנֵּ֥ה עֲבָדֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/015.yaml
  text: The king’s servants said to the king[a], “Whatever my lord the king chooses, here are your servants.”
translation:
  language: ta
  text: அரசரின் பணியாளர்கள் அரசரிடம், “என் ஆண்டவராகிய அரசர் எதைத் தேர்ந்தெடுக்கிறாரோ, அதன்படியே—இதோ, நாங்கள் உமது பணியாளர்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: என்றார்கள்
  rationale: אמר என்பதன் தொடர்கதை வடிவம் நேரடி உரையை அறிமுகப்படுத்துகிறது; தமிழ் உரையாடல் அமைப்பில் வாக்கிய இறுதியிலுள்ள ‘என்றார்கள்’ இயல்பான இறந்தகாலக் கூறல்.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: அரசரின் பணியாளர்கள்
  rationale: עבד என்பதற்கு அடிமை, பணியாளர், அரசவைச் சேவகர் ஆகிய பொருள்கள் உண்டு. இங்கு அரசருக்கு உண்மையுடன் சேவை செய்யும் அரண்மனைச் சூழல் என்பதால் ‘பணியாளர்கள்’ பொருத்தமானது; அடிமை நிலையைத் தேவையின்றி முன்னிறுத்தாது.
- source_word: אֶל הַמֶּלֶךְ
  choice: அரசரிடம்
  rationale: பேச்சின் இலக்கைக் குறிக்கும் אֶל என்பதற்கு நவீன தமிழில் ‘அரசரிடம்’ இயல்பான வடிவம்.
- source_word: כְּכֹל אֲשֶׁר יִבְחַר
  choice: எதைத் தேர்ந்தெடுக்கிறாரோ, அதன்படியே செய்ய
  rationale: சொல்லாட்சியாக ‘அவர் தேர்ந்தெடுக்கும் அனைத்தின்படியும்’ என்ற பொருளைத் தருகிறது. தமிழில் முழுமையான இணக்கத்தையும் செயல்படத் தயாராக இருப்பதையும் இயல்பாக வெளிப்படுத்த இந்த அமைப்பு பயன்படுத்தப்பட்டது; ‘செய்ய’ என்பது சூழலால் உணர்த்தப்படும் செயற்பாட்டை வெளிப்படையாக்குகிறது.
- source_word: יִבְחַר
  choice: தேர்ந்தெடுக்கிறாரோ
  rationale: בחר என்பதன் அடிப்படைப் பொருளான தேர்வு செய்தலைப் பாதுகாக்கிறது; ‘தீர்மானிக்கிறாரோ’ என்பதைவிட மூலச்சொல்லுக்கு நெருக்கமானது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசர்
  rationale: அரசவைக்குரிய மரியாதைமிகு அழைப்பைத் தக்கவைக்கிறது. ‘ஆண்டவர்’ இங்கு அரசரை நோக்கிய மரியாதைப் பட்டமே; தெய்வீக அடையாளமாகத் தீர்மானிக்கப்படவில்லை.
- source_word: הִנֵּה
  choice: இங்கே இருக்கிறோம்
  rationale: הִנֵּה இங்கு முன்னிலையையும் உடனடியான ஆயத்தத்தையும் சுட்டுகிறது. பழமையான ‘இதோ’ மட்டும் பயன்படுத்துவதைவிட, நவீன தமிழில் பேசுவோரின் தயார் நிலையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: עֲבָדֶיךָ
  choice: உமது பணியாளர்களாகிய நாங்கள்
  rationale: அரசரிடம் தங்களைப் பணியாளர்களாக ஒப்படைக்கும் விசுவாசமான மொழியை வெளிப்படுத்துகிறது; வசனத்தின் தொடக்கத்திலுள்ள עבד சொல்லின் மீளுருவத்தையும் ‘பணியாளர்கள்’ மூலம் காக்கிறது.
