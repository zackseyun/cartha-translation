base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/007.yaml
  text: And at the end of forty years, Absalom said to the king, “Please let me go and pay the vow that I vowed to the LORD in Hebron.”
translation:
  language: ta
  text: நாற்பது ஆண்டுகள் முடிந்தபின்[a], அப்சலோம் அரசனிடம், “நான் எப்ரோனில் ஆண்டவருக்குச் செய்த நேர்த்திக்கடனை நிறைவேற்றச் செல்ல எனக்கு அனுமதி தாரும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில பழைய உரைச்சாட்சிகளிலும் மொழிபெயர்ப்புகளிலும் “நான்கு ஆண்டுகள்” என்று உள்ளது; எபிரெய மசோரா உரையில் “நாற்பது ஆண்டுகள்” என்று உள்ளது.
    reason: முக்கியமான உரைவேறுபாட்டையும் மசோரா வாசிப்பால் எழும் காலவரிசைச் சிக்கலையும் வெளிப்படையாகக் குறிக்கிறது.
lexical_decisions:
- source_word: מִקֵּץ אַרְבָּעִים שָׁנָה
  choice: நாற்பது ஆண்டுகள் முடிந்தபின்
  rationale: எபிரெய உரையின் காலக் குறிப்பை நேரடியாகவும் இயல்பான நவீன தமிழிலும் தருகிறது; உரைசார் எண்ணான ‘நாற்பது’ பாதுகாக்கப்படுகிறது.
- source_word: אֵלֲכָה נָּא
  choice: செல்ல எனக்கு அனுமதி தாரும்
  rationale: இங்குள்ள வேண்டுகோள் துகளான נָא-வையும், அரசனிடம் அனுமதி கேட்கும் சூழலையும் இயல்பான மரியாதைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַאֲשַׁלֵּם אֶת נִדְרִי
  choice: என் நேர்த்திக்கடனை நிறைவேற்ற
  rationale: שׁלם என்பது செய்த நேர்த்தியைச் செலுத்துதல் அல்லது நிறைவேற்றுதல் என்ற பொருள் தருகிறது; ‘நேர்த்திக்கடனை நிறைவேற்ற’ என்பது தமிழில் தெளிவான சமயச் சொற்றொடர்.
- source_word: לַיהוָה
  choice: ஆண்டவருக்கு
  rationale: தெய்வீகப் பெயரான יהוה-க்கு தமிழில் வழக்கமான மரியாதைமிக்க பிரதிநிதிப்பை வழங்குகிறது.
- source_word: בְּחֶבְרוֹן
  choice: எப்ரோனில்
  rationale: இடப்பெயரையும் ‘இல்’ என்ற இருப்பிடப் பொருளையும் நேரடியாகப் பாதுகாக்கிறது; நேர்த்தி அங்கே செய்யப்பட்டதாக வாக்கிய அமைப்பு காட்டுகிறது.
theological_decisions:
- issue: ‘எப்ரோனில்’ என்பது நேர்த்தி செய்யப்பட்ட இடத்தையா அல்லது அதை நிறைவேற்றச் செல்லும் இடத்தையா குறிக்கிறது?
  choice: ‘நான் எப்ரோனில் ஆண்டவருக்குச் செய்த நேர்த்திக்கடனை நிறைவேற்றச் செல்ல’ என்று, எப்ரோனை நேர்த்தி செய்த இடத்துடன் இணைத்தல்
  alternative: ‘எப்ரோனுக்குச் சென்று ... நேர்த்திக்கடனை நிறைவேற்ற’ என்று நிறைவேற்றும் இடத்துடன் இணைத்தல்
  rationale: எபிரெயில் בְחֶבְרוֹן என்பது אֲשֶׁר נָדַרְתִּי לַיהוָה என்பதற்குப் பின் வருவதால், நேர்த்தி செய்த இடமாகப் புரிவது தொடரமைப்புக்கு நெருக்கமானது; இருப்பினும் சூழலால் மற்ற இணைப்பும் சாத்தியம்.
- issue: ‘நாற்பது ஆண்டுகள்’ என்ற உரைசார் எண்ணும் காலவரிசைச் சிக்கலும்
  choice: மசோரா உரையிலுள்ள ‘நாற்பது ஆண்டுகள்’ என்பதை பிரதான உரையில் அப்படியே வைத்தல்
  alternative: சில பழைய சாட்சிகள் மற்றும் மொழிபெயர்ப்புகளின்படி ‘நான்கு ஆண்டுகள்’ என்று வாசித்தல்
  rationale: கொடுக்கப்பட்ட WLC ஆதார உரையை மொழிபெயர்ப்பதே முதன்மை. ஆனால் காலவரிசைச் சிக்கலும் மாற்று பழைய வாசிப்பும் வாசகருக்குத் தெரிய footnote சேர்க்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; கண்ணியமான வேதாகம நடையுடன் பொதுவாசகருக்குப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. அரசனிடம் பேசுவதால் ‘தாரும்’ என்ற மரியாதை வடிவம் தேர்ந்தெடுக்கப்பட்டது.
