  text: So Hushai[a], David’s friend, came into the city, as Absalom was entering Jerusalem.
translation:
  language: ta
  text: அவ்வாறு, தாவீதின் நண்பரான ஊசாய் நகரத்திற்குள் வந்தார்; அப்போது அப்சலோம் எருசலேமுக்குள் வந்துகொண்டிருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்தார்
  rationale: בוא என்பது ‘வருதல்’ அல்லது ‘நுழைதல்’ எனப் பொருள்படும். ‘நகரத்திற்குள்’ என்பதுடன் ‘வந்தார்’ என்பது நகரை நோக்கிய இயக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חוּשַׁי
  choice: ஊசாய்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: רֵעֶה דָוִד
  choice: தாவீதின் நண்பரான
  rationale: רֵעֶה என்பது நண்பர் அல்லது தோழர் எனப் பொருள்படும். ‘நண்பர்’ என்பது நேரடியான பொருளைத் தருகிறது; அதிகாரபூர்வ ஆலோசகர் என்ற கூடுதல் கருத்தைச் சேர்ப்பதில்லை.
- source_word: הָעִיר
  choice: நகரத்திற்குள்
  rationale: மூலத்தில் குறிப்பிட்ட ‘நகரம்’ என்ற பொதுப்பெயரே உள்ளது. சூழலில் அது எருசலேமைக் குறித்தாலும், இங்கே அந்தப் பெயரை மாற்றாகச் சேர்க்காமல் மூலச் சொல்லைத் தக்கவைத்துள்ளது.
- source_word: וְאַבְשָׁלֹם
  choice: அப்போது அப்சலோம்
  rationale: וְ என்ற இணைப்பை, அடுத்துள்ள yiqtol வினையின் பின்னணிச் செயல்பாட்டுடன் இணைத்து, இரு வருகைகளின் கால ஒட்டுமொத்தத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: יָבֹא
  choice: வந்துகொண்டிருந்தான்
  rationale: முந்தைய wayyiqtol வினைக்குப் பின் வரும் yiqtol இங்கு ஒரே நேரத்தில் நடந்துகொண்டிருந்த பின்னணிச் செயலாகப் புரிந்துகொள்ளப்படலாம். தொடர்நிலை இறந்தகாலம் அந்த இலக்கண வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: יְרוּשָׁלִָם
  choice: எருசலேம்
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம்.
