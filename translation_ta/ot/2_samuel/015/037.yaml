translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ஊசாய்க்கு மரியாதைப் பன்மை வினைமுற்றும், எதிரியாகச் சித்தரிக்கப்படும் அப்சலோமுக்கு இயல்பான ஒருமை வினைமுற்றும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் உள்ள wayyiqtol–yiqtol வேறுபாடு பிரதான உரையில் கால ஒட்டுமொத்தமாகவும், மாற்று வாசிப்பு அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
