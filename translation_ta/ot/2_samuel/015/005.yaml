reference: 2 Samuel 15:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הָיָה֙ בִּ/קְרָב אִ֔ישׁ לְ/הִשְׁתַּחֲוֺ֖ת ל֑/וֹ וְ/שָׁלַ֧ח אֶת יָד֛/וֹ וְ/הֶחֱזִ֥יק ל֖/וֹ וְ/נָ֥שַׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/005.yaml
  text: And whenever a man came near to bow down to him[a], he would reach out his hand, take hold of him, and kiss him.
translation:
  language: ta
  text: ஒருவன் அப்சலோமை வணங்குவதற்காக அருகில் வந்தபோதெல்லாம், அவன் தன் கையை நீட்டி அவனைப் பற்றிப் பிடித்து முத்தமிடுவான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה ... בִּקְרָב
  choice: வந்தபோதெல்லாம் ... முத்தமிடுவான்
  rationale: கதைச் சூழலில் இத்தொடர் வழக்கமாகத் திரும்பத் திரும்ப நடந்த செயலைக் குறிக்கிறது; தமிழில் ‘போதெல்லாம் ... வான்’ என்ற அமைப்பு அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: எபிரெயச் சொல்லின் ஒருமை ஆண்பால் வடிவத்தைத் தக்கவைத்தபடி, இச்சூழலில் பொதுவாக எந்த ஆணையும் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: தன்னை வணங்குவதற்காக
  rationale: இங்கு வினை உடலைத் தாழ்த்தி மரியாதை செலுத்துவதைக் குறிக்கிறது. ‘வணங்குதல்’ உடல்சார்ந்த மரியாதைச் செயலை இயல்பான தமிழில் தருகிறது; இது கட்டாயமாகத் தெய்வ வழிபாட்டை மட்டும் குறிக்காது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: וְשָׁלַח אֶת יָדוֹ
  choice: தன் கையை நீட்டி
  rationale: கையை முன்னே நீட்டும் செயலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְהֶחֱזִיק לוֹ
  choice: அவனைப் பற்றிப் பிடித்து
  rationale: அவனைத் தன்னிடம் நிறுத்தும் அல்லது அணுக்கமாக இழுக்கும் சமூகச் சைகையைத் தருகிறது; வன்முறையைக் குறிக்கும் கடுமையான சொல்லைத் தவிர்க்கிறது.
- source_word: וְנָשַׁק לוֹ
  choice: முத்தமிடுவான்
  rationale: எபிரெய வினையின் நேரடியான பொருளைத் தக்கவைக்கிறது; அரசியல் ஆதரவு நாடும் அன்பான வரவேற்புச் சைகையாகிய சூழலை வாசகர் அறிய விடுகிறது.
theological_decisions:
- issue: לְהִשְׁתַּחֲוֺת என்பதன் பொருள் மத வழிபாடா அல்லது மரியாதை வணக்கமா
  choice: முதன்மை உரையில் ‘வணங்குவதற்காக’ என வைத்து, அதன் பரந்த பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘மரியாதை செலுத்துவதற்காக’ அல்லது ‘அவன் முன் நெடுஞ்சாண்கிடையாக விழுவதற்காக’
  rationale: இச்சூழல் அரசகுமாரனுக்கு செலுத்தப்படும் பணிவு அல்லது மரியாதையைச் சுட்டுகிறது; எனினும் மூல வினையின் உடல்சார்ந்த வணக்கச் சைகையை முற்றிலும் விளக்கவுரையாக மாற்றாமல் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனச் சூழலிலிருந்து செய்பவர் தெளிவாக இருக்கும்போதும், தமிழில் குறிப்புப் பெயரின் குழப்பத்தைத் தவிர்க்க ‘அப்சலோம்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
