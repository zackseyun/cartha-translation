revisions:
- from: ஒருவன் தன்னை வணங்குவதற்காக[a] அருகில் வந்தபோதெல்லாம், அப்சலோம் தன் கையை நீட்டி அவனைப் பற்றிப் பிடித்து முத்தமிடுவான்.
  to: ஒருவன் அப்சலோமை வணங்குவதற்காக அருகில் வந்தபோதெல்லாம், அவன் தன் கையை நீட்டி அவனைப் பற்றிப் பிடித்து முத்தமிடுவான்.
  rationale: Opening the clause with “அப்சலோமை” removes the reflexive ambiguity introduced by “தன்னை” and correctly identifies the recipient of the obeisance. The existing footnote is retained with only a small wording adjustment for clarity; it continues to preserve the lexical range of the Hebrew verb.
  reviewer_model: gpt-5.6-terra
