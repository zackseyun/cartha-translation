source:
  edition: WLC
  text: וִ֠/יהִי ב/שמע/ך אֶת ק֧וֹל צְעָדָ֛ה בְּ/רָאשֵׁ֥י הַ/בְּכָאִ֖ים אָ֣ז תֶּחֱרָ֑ץ כִּ֣י אָ֗ז יָצָ֤א יְהוָה֙ לְ/פָנֶ֔י/ךָ לְ/הַכּ֖וֹת בְּ/מַחֲנֵ֥ה פְלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/024.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then act decisively, for then Yahweh has gone out before you to strike down the camp of the Philistines.
translation:
  language: ta
  text: நீ பாகா மரங்களின்[a] உச்சிகளில் அணிவகுத்துச் செல்லும் காலடிகளின் ஓசையைக் கேட்கும்போது, அப்போது உறுதியாகச் செயல்படு; ஏனெனில் அப்போது பெலிஸ்தியரின் முகாமைத் தாக்குவதற்காக யாவே உனக்கு முன்னே புறப்பட்டிருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லான בְּכָאִים குறிக்கும் மர இனம் உறுதியாகத் தெரியவில்லை. இதை ‘பால்சம் மரங்கள்’ என்றும், ஒலிபெயர்ப்பாக ‘பாகா மரங்கள்’ என்றும் வழங்குவர்; சில பழைய மொழிபெயர்ப்புகள் ‘மல்பெரி மரங்கள்’ என்று கூறுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי בְשָׁמְעֲךָ
  choice: நீ ... கேட்கும்போது
  rationale: வாவ் + היה மற்றும் ב முன்னொட்டுடன் வரும் இற infinitive அமைப்பு எதிர்கால காலச் சூழலைக் குறிக்கிறது; தமிழில் இயல்பாகக் காலவாக்கியமாக வழங்கப்பட்டுள்ளது.
- source_word: קוֹל צְעָדָה
  choice: அணிவகுத்துச் செல்லும் காலடிகளின் ஓசை
  rationale: קוֹל என்பது ‘ஓசை’; צְעָדָה என்பது அடியெடுத்து நடத்தல் அல்லது அணிவகுத்துச் செல்லுதல். போர் சூழலில் இரு கூறுகளையும் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: அந்த மரங்களின் உச்சிகளில்
  rationale: רָאשֵׁי என்பதற்கு ‘உச்சிகள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது. בְּכָאִים குறிக்கும் தாவர இனம் உறுதியாகத் தெரியாததால், பிரதான உரையில் குறிப்பிட்ட இனப்பெயரைத் திணிக்காமல் அடிக்குறிப்பில் மாற்றுகள் தரப்பட்டுள்ளன.
- source_word: אָז תֶּחֱרָץ
  choice: உடனே உறுதியாகச் செயல்படு
  rationale: חרץ இங்கு கூர்மையான, துரிதமான, தீர்மானமிக்க நடவடிக்கையைக் குறிக்கிறது; ‘உறுதியாகச் செயல்படு’ அதன் மையப் பொருளையும், ‘உடனே’ சூழலின் அவசரத்தையும் தெரிவிக்கின்றன.
- source_word: יָצָא יְהוָה לְפָנֶיךָ
  choice: யாவே உனக்கு முன்னே புறப்பட்டிருப்பார்
  rationale: Perfect வினை, அடையாள ஓசை கேட்கும் நேரத்தில் யாவேயின் நடவடிக்கை ஏற்கெனவே தொடங்கியிருப்பதைக் காட்டுகிறது; לְפָנֶיךָ என்பது அவர் தாவீதுக்கு முன்னால் போருக்குச் செல்வதைச் சுட்டுகிறது.
- source_word: לְהַכּוֹת בְּמַחֲנֵה פְלִשְׁתִּים
  choice: பெலிஸ்தியரின் முகாமைத் தாக்குவதற்காக
  rationale: נכה என்பதன் causative infinitive போர்ச் சூழலில் ‘தாக்குதல்/வீழ்த்துதல்’ என்று பொருள்படும்; מַחֲנֶה என்பதன் நேரடியான ‘முகாம்’ பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெய உரையில் உடன்படிக்கையின் தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதை பொதுப் பட்டப்பெயராக மாற்றாமல், தமிழில் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் இயல்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், இயல்பானதும் கண்ணியமானதுமான நடையில் மொழிபெயர்க்கப்பட்டது. மர இனத்தின் நிச்சயமின்மை பிரதான உரையில் மறைக்கப்படாமல் அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது; கட்டளையின் துரிதமும் தீர்மானமும் காக்கப்பட்டுள்ளன.
