lexical_decisions:
- source_word: יִבְחָר
  choice: இப்கார்
  rationale: தாவீதின் மகன்களுடைய பட்டியலில் வரும் தனிப்பட்ட பெயர்; எபிரெய ஒலிப்பைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֱלִישׁוּעַ
  choice: எலிசூவா
  rationale: தனிப்பட்ட பெயர்; இறுதி ע எழுத்தின் ஒலி தமிழில் தனியாகக் குறிக்கப்படாமல், இயல்பான தமிழ் ஒலிபெயர்ப்பாக வழங்கப்பட்டது.
- source_word: נֶפֶג
  choice: நெபெக்
  rationale: பட்டியலில் வரும் தனிப்பட்ட பெயர்; எபிரெய மூலத்திலிருந்து நேரடியாக ஒலிபெயர்க்கப்பட்டது.
- source_word: יָפִיעַ
  choice: யாப்பியா
  rationale: தனிப்பட்ட பெயர்; தொடக்க யோத் ஒலி ‘ய’ எனவும், பெயரின் ஒலியமைப்பு இயல்பான தமிழில் ‘யாப்பியா’ எனவும் வழங்கப்பட்டது.
- source_word: וְ
  choice: பட்டியலில் காற்புள்ளிகள்
  rationale: எபிரெயத்தில் ஒவ்வொரு பெயருக்கும் முன் இணைப்புச்சொல் திரும்பத் திரும்ப வருகிறது. நவீன தமிழ்ப் பெயர்ப்பட்டியலில் அத்தகைய மீட்சி இயல்பாக இல்லாததால், முதன்மை உரையில் காற்புள்ளிகள் பயன்படுத்தப்பட்டு, மூலத்தின் அமைப்பு அடிக்குறிப்பில் தெரிவிக்கப்பட்டது.
