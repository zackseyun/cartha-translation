base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/009.yaml
  text: So David lived in the stronghold and called it the City of David[a]. And David built all around from the Millo inward.
translation:
  language: ta
  text: தாவீது அந்தக் கோட்டையில் வாழ்ந்து, அதற்கு ‘தாவீதின் நகரம்’ என்று பெயரிட்டார். தாவீது மில்லோவிலிருந்து உள்நோக்கி, சுற்றிலும் கட்டினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மில்லோவிலிருந்து உள்நோக்கியும்” அல்லது “மில்லோவிலிருந்து உள்பகுதியை நோக்கி” என்றும் மொழிபெயர்க்கலாம். “மில்லோ” என்பது எருசலேமில் அறியப்பட்ட ஒரு கட்டமைப்பையோ அல்லது மண் நிரப்பி அமைக்கப்பட்ட படிநிலைத் தளங்களையோ குறித்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: குடியிருந்து
  rationale: ישב என்பது இங்கு கைப்பற்றப்பட்ட கோட்டையில் தாவீது வசிக்கத் தொடங்கி அங்கே வாழ்ந்ததைக் குறிக்கிறது; ‘குடியிருந்து’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: בַּמְּצֻדָה
  choice: அந்தக் கோட்டையில்
  rationale: מְצֻדָה என்பது பாதுகாப்புமிக்க அரண் அல்லது கோட்டையைக் குறிக்கிறது. முன்சூழலில் அறியப்பட்ட இடம் என்பதால் ‘அந்தக்’ சேர்க்கப்பட்டது.
- source_word: וַיִּקְרָא לָהּ
  choice: அதற்கு ... என்று பெயரிட்டார்
  rationale: קרא + ל இங்கு பெயரிடுதல் அல்லது ஒரு பெயரால் அழைத்தல் என்ற பொருள் தருகிறது; தமிழில் ‘பெயரிட்டார்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: עִיר דָּוִד
  choice: தாவீதின் நகரம்
  rationale: இது இடப்பெயருக்குரிய designation; எபிரெயச் சொற்றொடரின் உறவுநிலையை நேரடியாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: וַיִּבֶן
  choice: கட்டினார்
  rationale: בנה என்பதன் அடிப்படைப் பொருள் ‘கட்டு’; ‘பலப்படுத்தினார்’ அல்லது ‘மீண்டும் கட்டினார்’ என்ற சூழல்சார் விவரங்களை மூலத்தில் இல்லாமல் சேர்க்கவில்லை.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: சுற்றியுள்ள பரப்பில் கட்டியதைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: מִן הַמִּלּוֹא
  choice: மில்லோவிலிருந்து
  rationale: מִלּוֹא என்பதன் துல்லியமான கட்டடவியல் அல்லது நிலவியல் குறிப்பு விவாதத்திற்குரியது; ஆகவே பெயரை ஒலிபெயர்த்து, விளக்கத்தை அடிக்குறிப்பில் தருவது வெளிப்படையான தேர்வு.
- source_word: וָבָיְתָה
  choice: உட்புறமாக
  rationale: திசையைக் குறிக்கும் இவ்வடிவம் இங்கு உள்பகுதியை நோக்கி எனப் பொருள்பட வாய்ப்புள்ளது. குறிப்பிட்ட ஒரு ‘வீட்டை’ தீர்மானமாகக் கூறாமல் இடவியல் தெளிவின்மையைப் பாதுகாக்கிறது.
