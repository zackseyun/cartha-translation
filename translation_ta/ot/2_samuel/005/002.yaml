base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/002.yaml
  text: Also previously[a], when Saul was king over us, you were the one who led Israel out and brought them in. And Yahweh said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over Israel.’
translation:
  language: ta
  text: முன்னரும்[a], சவுல் எங்கள்மேல் அரசனாக இருந்தபோது, இஸ்ரவேலை வெளியே நடத்திச் சென்று உள்ளே கூட்டிவந்தவர் நீரே[b]. யாவே உம்மிடம், “நீர் என் மக்களாகிய இஸ்ரவேலை மேய்ப்பீர்; இஸ்ரவேலின்மேல் தலைவராக இருப்பீர்[c]” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லுக்குச் சொல், “நேற்றும் அதற்கு முந்தின நாளும்”; இது “முன்பு” அல்லது “ஏற்கெனவே சில காலமாக” என்னும் பொருளுடைய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இஸ்ரவேலை வெளியே கொண்டுபோய் உள்ளே கொண்டுவந்தவர் நீரே.” மக்களின் செயல்பாடுகளில், குறிப்பாகப் போரில், அவர்களை வழிநடத்துவதைக் குறிக்கும் எபிரேய மரபுத்தொடர் இது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “ஆட்சியாளராக” அல்லது “முதன்மைத் தலைவராக.” இங்குள்ள எபிரேயச் சொல் வழக்கமாகப் பயன்படுத்தப்படும் “அரசன்” என்ற சொல்லிலிருந்து வேறுபட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֶתְמוֹל גַּם שִׁלְשׁוֹם
  choice: முன்னரும்
  rationale: சொல்லுக்குச் சொல் ‘நேற்றும் அதற்கு முந்தின நாளும்’ எனும் எபிரேய மரபுத்தொடர், முந்தைய காலத்தைக் குறிக்கிறது. ‘முன்னரும்’ என்பது அதன் காலப் பொருளையும் גַּם என்பதன் ‘-உம்’ வலியுறுத்தலையும் இயல்பாகத் தருகிறது.
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ עָלֵינוּ
  choice: சவுல் எங்கள்மேல் அரசனாக இருந்தபோது
  rationale: בְּ உடன் வரும் infinitive construct காலத் துணைவாக்கியத்தை உருவாக்குகிறது; ‘இருந்தபோது’ அந்த உறவைத் தெளிவாகக் காக்கிறது.
- source_word: אַתָּה
  choice: நீரே
  rationale: தனித்து வரும் இரண்டாம் நபர் சுட்டுப்பெயரின் வலியுறுத்தலை ‘-ஏ’ காட்டுகிறது; மூப்பர்கள் தாவீதிடம் பேசும் சூழலுக்கேற்ற மரியாதை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: מוציא וְהַמֵּבִיא אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை வெளியே நடத்திச் சென்று திரும்பக் கூட்டிவந்தவர்
  rationale: வெளியே கொண்டுபோய் உள்ளே கொண்டுவருதல் என்ற எபிரேய உருவகத்தைத் தக்கவைத்தபடியே, மக்களைப் போரிலும் பொது நடவடிக்கைகளிலும் வழிநடத்திய பொருள் தமிழில் புரியுமாறு தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: תִרְעֶה
  choice: மேய்ப்பீர்
  rationale: அரசாட்சியை மேய்ப்புத் தொழிலால் சித்தரிக்கும் மூல உருவகத்தையும் அதன் இறையியல் நயத்தையும் காக்கிறது.
- source_word: נָגִיד
  choice: தலைவர்
  rationale: இது வழக்கமான ‘அரசன்’ என்ற சொல்லிலிருந்து வேறுபட்ட நியமிக்கப்பட்ட ஆட்சித் தலைமையைக் குறிக்கிறது. ‘தலைவர்’ அந்த வேறுபாட்டைத் தக்கவைத்து நவீன தமிழில் தெளிவாக உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், பொதுப்பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாக பெயரின் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது. ‘யாவே’ என்பது பரவலாக ஏற்கப்படும் மூல உச்சரிப்பை நெருக்கமாகப் பிரதிபலிக்கிறது.
- issue: תִרְעֶה என்பதிலுள்ள அரச-மேய்ப்பன் உருவகம்
  choice: என் மக்களாகிய இஸ்ரவேலை மேய்ப்பீர்
  alternative: என் மக்களாகிய இஸ்ரவேலை ஆள்வீர் / பராமரிப்பீர்
  rationale: ஆட்சியை வெறும் நிர்வாகமாகத் தட்டையாக்காமல், கடவுளால் நியமிக்கப்பட்ட அரசனின் பராமரிப்பு மற்றும் வழிநடத்தலைக் காட்டும் மூல உருவகம் பாதுகாக்கப்படுகிறது.
- issue: נָגִיד மற்றும் מֶלֶךְ ஆகிய சொற்களின் வேறுபாடு
  choice: தலைவர்
  alternative: ஆட்சியாளர் / இளவரசர் / அரசன்
  rationale: இவ்வசனத்திலேயே ‘அரசன்’ என்பதற்கு מֶלֶךְ பயன்படுத்தப்பட்டுள்ளதால், נָגִיד என்பதையும் ‘அரசன்’ என்று மொழிபெயர்த்து வேறுபாட்டை அழிக்காமல் ‘தலைவர்’ என வழங்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூப்பர்கள் தாவீதிடம் நேரடியாகப் பேசுவதால் ‘நீர்/உம்மிடம்’ என்ற மரியாதை ஒருமை காக்கப்பட்டுள்ளது. எபிரேய வாக்கியத்தின் வலியுறுத்தலும் மேய்ப்பன் உருவகமும் இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளன.
