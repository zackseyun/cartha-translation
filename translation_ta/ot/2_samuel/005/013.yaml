    issue: ‘மறுமனைவிகள்’ for פִּילַגְשִׁים
    rationale: The term normally means second or subsequent wives. The Hebrew deliberately differentiates concubines from wives; ‘துணைமனைவிகள்’ better maintains that distinction in modern standard Tamil.
