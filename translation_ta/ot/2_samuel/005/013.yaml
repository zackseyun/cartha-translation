  text: וַ/יִּקַּח֩ דָּוִ֨ד ע֜וֹד פִּֽלַגְשִׁ֤ים וְ/נָשִׁים֙ מִ/יר֣וּשָׁלִַ֔ם אַחֲרֵ֖י בֹּא֣/וֹ מֵ/חֶבְר֑וֹן וַ/יִּוָּ֥לְדּוּ ע֛וֹד לְ/דָוִ֖ד בָּנִ֥ים וּ/בָנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/013.yaml
  text: And David took more concubines and wives in Jerusalem after he came from Hebron[a], and more sons and daughters were born to David.
translation:
  language: ta
  text: தாவீது எப்ரோனிலிருந்து வந்த பிறகு, எருசலேமிலிருந்து மேலும் துணைமனைவிகளையும் மனைவிகளையும் ஏற்றுக்கொண்டார்[a]. தாவீதுக்கு மேலும் மகன்களும் மகள்களும் பிறந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எருசலேமில்.” எபிரேயத்தில் சொல்லுக்குச் சொல் “எருசலேமிலிருந்து” என்று உள்ளது; தாவீது அங்கு குடியேறிய பிறகு, அந்த இடத்திலிருந்து அவர்களை ஏற்றுக்கொண்டார் என்பதைக் இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ஏற்றுக்கொண்டார்
  rationale: לקח என்பது இச்சூழலில் பெண்களை மனைவிகளாக அல்லது மறுமனைவிகளாகத் தன் குடும்பத்தில் சேர்த்துக்கொள்வதைக் குறிக்கிறது. தமிழில் வெறுமனே ‘எடுத்துக்கொண்டார்’ என்பதைக் காட்டிலும் ‘ஏற்றுக்கொண்டார்’ இயல்பாகவும் உறவை அளவுக்கு மீறி விளக்காமலும் உள்ளது.
- source_word: עוֹד
  choice: மேலும்
  rationale: இரு இடங்களிலும் கூடுதலாகச் சேர்தல் என்ற பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: פִּלַגְשִׁים
  choice: மறுமனைவிகள்
  rationale: முழு மனைவி நிலையிலிருந்து வேறுபட்ட, அங்கீகரிக்கப்பட்ட இரண்டாம் நிலைத் துணைவியரைக் குறிக்கும் சொல்லாகப் பயன்படுத்தப்படுகிறது; נָשִׁים என்பதிலிருந்து உள்ள வேறுபாட்டையும் காக்கிறது.
- source_word: וְנָשִׁים
  choice: மனைவிகள்
  rationale: ‘மறுமனைவிகள்’ என்பதோடு இணைந்து வருவதால் இங்கு பொதுவான ‘பெண்கள்’ என்பதல்ல, திருமணத் துணைவியரே குறிக்கப்படுகின்றனர்.
- source_word: מִירוּשָׁלִַם
  choice: எருசலேமிலிருந்து
  rationale: מִן முன்னிடைச்சொல்லின் நேரடியான ‘இருந்து’ என்ற பொருளைக் காக்கிறது; இருப்பினும் சூழலால் ‘எருசலேமில்’ என்றும் புரிந்துகொள்ள வாய்ப்புள்ளதால் அடிக்குறிப்பு தரப்படுகிறது.
- source_word: אַחֲרֵי בֹּאוֹ מֵחֶבְרוֹן
  choice: எப்ரோனிலிருந்து வந்த பிறகு
  rationale: எப்ரோனிலிருந்து தாவீது வந்ததைத் தொடர்ந்து நிகழ்ந்த செயல் என்ற கால வரிசையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּוָּלְדוּ ... לְדָוִד
  choice: தாவீதுக்கு ... பிறந்தார்கள்
  rationale: ילד என்பதன் நிபால் வடிவத்தையும் לְ குறிக்கும் உறவையும் இயல்பான தமிழ் பிறப்பு மரபுத்தொடரில் வெளிப்படுத்துகிறது.
- source_word: בָּנִים וּבָנוֹת
  choice: மகன்களும் மகள்களும்
  rationale: எபிரெய உரை இரு பாலரையும் தனித்தனியாகக் குறிப்பிடுவதால் அந்தத் துல்லியம் காக்கப்படுகிறது.
theological_decisions:
- issue: தாவீதின் பலதார மணத்தை விவரிக்கும் கதைப்பதிவு
  choice: அறநெறி மதிப்பீடு எதையும் சேர்க்காமல் நிகழ்வை மட்டும் விவரித்தல்
  alternative: இச்செயலை ஆதரிக்கும் அல்லது கண்டிக்கும் சொற்களைச் சேர்த்தல்
  rationale: இந்த வசனம் தாவீதின் செயலையும் பிள்ளைகளின் பிறப்பையும் மட்டும் தெரிவிக்கிறது; வெளிப்படையான ஒப்புதலோ கண்டனமோ கூறவில்லை. மொழிபெயர்ப்பும் உரையில் இல்லாத தீர்ப்பைச் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மறுமனைவிகள்’ மற்றும் ‘மனைவிகள்’ என்ற வேறுபாடு மூலமொழிக்கு ஏற்ப காக்கப்பட்டுள்ளது; எருசலேம் குறித்த முன்னிடைச்சொல்லின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
