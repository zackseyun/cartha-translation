  text: And the Philistines came and spread out in the Valley of Rephaim[a].
translation:
  language: ta
  text: பெலிஸ்தியர்கள் வந்து, ரெப்பாயீம் பள்ளத்தாக்கில் பரந்து நிலைகொண்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ரெப்பாயீம் பள்ளத்தாக்கில் அணிவகுத்து நிலைகொண்டார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: வாவ் இணைப்புச்சொல் தமிழ் கதைநடையின் இயல்புக்காக அடுத்துள்ள ‘வந்து’ என்பதோடு இணைந்து வெளிப்படுகிறது; פְלִשְׁתִּים என்ற இனப்பெயர் வழக்கமான தமிழில் ‘பெலிஸ்தியர்கள்’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: בָּאוּ
  choice: வந்து
  rationale: בוא என்பதன் கால் நிறைவுவினை இக்கதைச் சூழலில் ‘வந்தார்கள்’ என்ற பொருள் தருகிறது; தொடர்ந்த வினையுடன் இயல்பாக இணைக்க ‘வந்து’ பயன்படுத்தப்பட்டது.
- source_word: וַ/יִּנָּטְשׁוּ
  choice: பரவியிருந்தார்கள்
  rationale: இங்கு נטשׁ என்பது ஒரு பகுதியில் படையினர் பரந்து நிலைகொண்டதைக் குறிக்கிறது. ‘பரவியிருந்தார்கள்’ என்பது அந்தப் படைநிலையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; ‘அணிவகுத்து நிலைகொண்டார்கள்’ என்ற படைச்சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּ/עֵמֶק
  choice: பள்ளத்தாக்கில்
  rationale: בְ இடத்தைக் குறிக்கிறது; עֵמֶק என்பதற்கு இயல்பான தமிழ் ‘பள்ளத்தாக்கு’. வேற்றுமை உருபு இடப்பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: רְפָאִים
  choice: ரெப்பாயீம்
  rationale: இது עֵמֶק רְפָאִים என்ற இடப்பெயரின் பகுதியாக இருப்பதால் மொழிபெயர்க்காமல் எபிரெய ஒலிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்படுகிறது.
