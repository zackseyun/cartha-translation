id: 2SA.5.10
reference: 2 Samuel 5:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ דָּוִ֖ד הָל֣וֹךְ וְ/גָד֑וֹל וַ/יהוָ֛ה אֱלֹהֵ֥י צְבָא֖וֹת עִמּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/010.yaml
  text: And David went on[a], growing greater, and Yahweh, the God of hosts, was with him.
translation:
  language: ta
  text: தாவீது மேன்மேலும் உயர்ந்துகொண்டே போனான்[a]; படைகளின் கடவுளாகிய யாவே அவனோடு இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீது தொடர்ந்து முன்னேறி, மேலும் மேலும் பெரியவனானான்.” தொடர்ந்து அதிகரிக்கும் வளர்ச்சியை வலியுறுத்தும் எபிரெய மரபுத்தொடர் இங்கு பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... הָלוֹךְ וְגָדוֹל
  choice: மேன்மேலும் உயர்ந்துகொண்டே போனான்
  rationale: வினைமுற்றுடன் வினையெச்சப் பொருளுடைய absolute infinitive இணையும் எபிரெய மரபுத்தொடர், தொடர்ந்து அதிகரித்த வளர்ச்சியை வலியுறுத்துகிறது. தமிழில் இயல்பாகவும் தொடர்ச்சியின் வலிமையுடனும் இதைத் தெரிவிக்கிறது.
- source_word: דָּוִד
  choice: தாவீது
  rationale: இப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, கடவுளின் தனிப்பெயரைக் குறிக்கும் நான்கு எழுத்துப் பெயர்; ஆகவே தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: படைகளின் கடவுள்
  rationale: צְבָאוֹת என்பது படைகள் அல்லது அணிவகுத்த திரள்களைக் குறிக்கலாம். எபிரெயம் குறிப்பாக பூமிக்குரிய படைகளையா வானுலகப் படைகளையா என்று இங்கு வரையறுக்காததால், பொதுவான வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: עִמּוֹ
  choice: அவனோடு இருந்தார்
  rationale: தாவீதுடன் கடவுளின் துணைநிற்கும் பிரசன்னம் இருந்ததை நேரடியாகத் தெரிவிக்கிறது; எபிரெயப் பிரதிப்பெயரும் காக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலவசனம் இறைத்தனிப்பெயரையே பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: צְבָאוֹת என்ற இறைப் பட்டத்தின் வரம்பு
  choice: படைகள்
  alternative: சேனைகள்; வானுலகப் படைகள்
  rationale: மூலச்சொல் படைகள் அல்லது பெருந்திரள்கள் என்ற பரந்த பொருளைக் கொண்டது. 'வானுலக' என்று சேர்ப்பது வசனம் வெளிப்படையாகச் சொல்லாத ஒன்றைக் குறிப்பாக்கிவிடும்.
translation_notes:
  register: நவீனத் தரத்தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உயர்ந்துகொண்டே போனான்’ என்பது உடல் அளவைக் காட்டாமல் தாவீதின் தொடர்ந்து வளர்ந்த மேன்மையையும் நிலையையும் உணர்த்துகிறது; எபிரெய மரபுத்தொடரின் நேரடியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
