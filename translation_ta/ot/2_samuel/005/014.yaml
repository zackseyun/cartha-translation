translation:
  language: ta
  text: 'எருசலேமில் அவனுக்குப் பிறந்தவர்களின்[a] பெயர்கள் இவை: சம்மூவா, சோபாப், நாத்தான், சாலொமோன்.'
  philosophy: optimal-equivalence
  footnotes:
