lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת
  choice: பெயர்கள் இவை
  rationale: பின்வரும் பெயர்ப்பட்டியலை அறிமுகப்படுத்தும் எபிரெயச் சொற்றொடரின் சுட்டிக்காட்டும் வலிமையை இயல்பான நவீனத் தமிழில் தருகிறது. தொடக்க இணைப்புச் சொல்லைத் தனியே மொழிபெயர்க்காமல் விடுவது தமிழில் இயல்பாக உள்ளது.
- source_word: הַיִּלֹּדִים
  choice: பிறந்தவர்கள்
  rationale: ילד என்ற வேர்ச்சொல்லின் செயப்பாட்டு வினையெச்சம் சொற்படியாக ‘பிறந்தவர்கள்’ எனப் பொருள்படும். சூழல் மகன்களைப் பட்டியலிட்டாலும், மூலச் சொல்லில் இல்லாத பாலினக் குறிப்பை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: לוֹ
  choice: அவனுக்கு
  rationale: பெற்றோர் உறவைக் குறிக்கும் எபிரெய மரபுத்தொடரைத் தமிழின் இயல்பான ‘அவனுக்குப் பிறந்தவர்கள்’ என்ற அமைப்பில் வழங்குகிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: பிறந்த இடத்தைக் குறிக்கும் நேரடியான இடவேற்றுமை மொழிபெயர்ப்பு.
- source_word: שַׁמּוּעַ
  choice: சம்மூவா
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: שׁוֹבָב
  choice: சோபாப்
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: נָתָן
  choice: நாத்தான்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட வடிவத்தையும் எபிரெய ஒலிப்பையும் கருத்தில் கொண்ட எழுத்துப்பெயர்ப்பு.
- source_word: שְׁלֹמֹה
  choice: சாலொமோன்
  rationale: தமிழ் வாசகர்களுக்கு அறிமுகமான வேதாகமப் பெயர் வடிவத்தைப் பயன்படுத்துகிறது.
