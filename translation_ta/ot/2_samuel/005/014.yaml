    text: அல்லது, ‘எருசலேமில் அவனுக்குப் பிறந்த பிள்ளைகளின்.’ எபிரெய செயப்பாட்டு வினைப்பெயரெச்ச வடிவம் சொற்படியாக ‘பிறந்தவர்கள்’ என்று பொருள்படும்.
