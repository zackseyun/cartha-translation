  text: וַ/יָּבֹ֨א דָוִ֥ד בְּ/בַֽעַל פְּרָצִים֮ וַ/יַּכֵּ֣/ם שָׁ֣ם דָּוִד֒ וַ/יֹּ֕אמֶר פָּרַ֨ץ יְהוָ֧ה אֶת אֹיְבַ֛/י לְ/פָנַ֖/י כְּ/פֶ֣רֶץ מָ֑יִם עַל כֵּ֗ן קָרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בַּ֥עַל פְּרָצִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/020.yaml
  text: So David came to Baal-perazim[a], and there David struck them down. He said[b], “Yahweh has broken through my enemies before me like a breakthrough of waters.” Therefore he called the name of that place Baal-perazim.
translation:
  language: ta
  text: தாவீது பாகால்-பெராசீமுக்கு[a] வந்து, அங்கே அவர்களை வீழ்த்தினார். அவர், “யாவே என் எதிரிகளை எனக்கு முன்பாக வெள்ளம் உடைத்துப் பாய்வதுபோல் உடைத்தார்[b]” என்றார். அதனால் அந்த இடத்துக்குப் பாகால்-பெராசீம் என்று பெயரிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பாகால்-பெராசீம்” என்பது “உடைப்புகளின் தலைவர்” அல்லது “உடைப்புகளின் இடம்” என்பதுபோல் ஒலிக்கிறது. யாவே தன் எதிரிகளை “உடைத்தார்” என்ற தாவீதின் கூற்றை இந்தப் பெயர் எதிரொலிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வெள்ளநீர் உடைத்துப் பாய்வதுபோல்.” இங்குள்ள எபிரெயச் சொற்கள் “உடைத்தல்,” “உடைப்பு,” “பாகால்-பெராசீம்” ஆகியவற்றுக்கிடையிலான சொல்விளையாட்டை உருவாக்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: பாகால்-பெராசீம்
  rationale: இது இடப்பெயர் என்பதால் மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது; ‘உடைத்தல்/பிளத்தல்’ என்ற பொருளுடைய எபிரெயச் சொல்விளையாட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וַיַּכֵּם
  choice: அவர்களை வீழ்த்தினார்
  rationale: போரில் தாக்கி வீழ்த்துவதைக் குறிக்கும் வினையின் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: פָּרַץ
  choice: உடைத்துச் சிதறடித்தார்
  rationale: தடையை உடைத்துப் பாய்தல் என்ற அடிப்படைப் படிமத்தையும், எதிரிகளின் அணியைச் சிதறடித்த போர்ச் சூழலையும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் வரும் இறைத் திருப்பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல் தமிழில் பரவலாக அறியப்பட்ட வடிவில் ஒலிபெயர்க்கிறது.
- source_word: אֹיְבַי
  choice: என் எதிரிகளை
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியுடன் கூடிய சொல்லின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: לְפָנַי
  choice: எனக்கு முன்பாக
  rationale: எபிரெய முன்னிடைத் தொடரைத் தக்கவைத்து, தாவீதின் முன்னிலையில் நிகழ்ந்த வெற்றியை வெளிப்படுத்துகிறது.
- source_word: כְּפֶרֶץ מָיִם
  choice: வெள்ளம் உடைத்துப் பாய்வதுபோல்
  rationale: நீர் தடையை உடைத்துப் பெருக்கெடுக்கும் காட்சியை இயல்பான தமிழில் தருவதோடு, פָּרַץ/פֶּרֶץ என்ற சொல் எதிரொலியையும் ‘உடைத்து’ என்பதன் மூலம் ஓரளவு காக்கிறது.
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: அந்த இடத்துக்குப் ... என்று பெயரிட்டார்
  rationale: எபிரெய மொழிமரபின் பொருளை நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைத் திருப்பெயரை ‘ஆண்டவர்’ போன்ற பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது. தமிழில் நீண்டகாலமாக அறியப்பட்ட ‘யெகோவா’ வடிவம் வாசகர்களுக்கு எளிதில் புரியும்; ‘யாவே’ என்பது மாற்று ஒலிபெயர்ப்பு.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. போர்ச் செயலை மிகைப்படுத்தாமல் வினையின் வலிமை காக்கப்பட்டுள்ளது; இடப்பெயரும் இறைத் திருப்பெயரும் ஒலிபெயர்க்கப்பட்டுள்ளன. மூல எபிரெயிலுள்ள உடைத்தல்/பெருக்கு/இடப்பெயர் சொல்விளையாட்டு முதன்மை உரையிலும் அடிக்குறிப்புகளிலும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளது.
