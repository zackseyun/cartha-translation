  source_fidelity: முதன்மை உரை எபிரெய வினைச்சொல் וַיֵּרֶד (‘இறங்கினான்/இறங்கிச் சென்றான்’) என்பதன் திசைக் கூறை விடுத்துள்ளது. மேலும், ‘அபிஷேகம் செய்திருக்கிறார்கள்’ என்பது நிகழ்காலத் தொடர்புடைய நிறைவு உணர்வைத் தருகிறது; இவ்விடத்தின் கடந்தகால நிகழ்வுக்கு எளிய இறந்தகாலம் இயல்பானது.
