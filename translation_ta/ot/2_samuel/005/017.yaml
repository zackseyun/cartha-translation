translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அபிஷேகம்’ என்பது வேதாகமத் தமிழில் பரவலாக அறியப்பட்ட பதமாக இருப்பதால் வைக்கப்பட்டுள்ளது. மூலத்தில் வெளிப்படையாக இல்லாத பகை நோக்கம் உரையில் சேர்க்கப்படவில்லை.
