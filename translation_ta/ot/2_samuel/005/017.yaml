  text: וַ/יִּשְׁמְע֣וּ פְלִשְׁתִּ֗ים כִּי מָשְׁח֨וּ אֶת דָּוִ֤ד לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל וַ/יַּעֲל֥וּ כָל פְּלִשְׁתִּ֖ים לְ/בַקֵּ֣שׁ אֶת דָּוִ֑ד וַ/יִּשְׁמַ֣ע דָּוִ֔ד וַ/יֵּ֖רֶד אֶל הַ/מְּצוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/017.yaml
  text: When the Philistines heard that they had anointed David king over Israel[a], all the Philistines went up to seek David. When David heard of it, he went down to the stronghold.
translation:
  language: ta
  text: தாவீதை இஸ்ரவேலின்மேல் அரசராக அபிஷேகம் செய்தார்கள் என்று பெலிஸ்தியர்கள் கேள்விப்பட்டபோது, பெலிஸ்தியர் அனைவரும் தாவீதைத் தேடி மேலே சென்றார்கள். தாவீது இதைக் கேள்விப்பட்டதும், அரணுக்கு இறங்கிச் சென்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இந்த மக்களினத்தைக் குறிக்கும் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: כִּי
  choice: என்று
  rationale: பெலிஸ்தியர்கள் கேள்விப்பட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: מָשְׁחוּ
  choice: அபிஷேகம் செய்திருக்கிறார்கள்
  rationale: வினைச்சொல்லின் ‘எண்ணெய் பூசி நியமித்தல்’ என்ற பொருளைப் பாதுகாத்து, அவர்கள் கேட்ட செய்தியில் ஏற்கெனவே நிகழ்ந்த செயலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல் அரசராக
  rationale: தாவீதின் அரச நியமனத்தையும் இஸ்ரவேல்மீதான ஆட்சியதிகாரத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַיַּעֲלוּ כָל־פְלִשְׁתִּים
  choice: அவர்கள் அனைவரும் ... மேலே வந்தார்கள்
  rationale: כָל என்பதன் முழுமையையும் עלה என்பதன் மேல்நோக்கிய இயக்கத்தையும் தக்கவைக்கிறது; சூழலில் இல்லாத ‘படையெடுத்தனர்’ என்ற பொருளைச் சேர்க்கவில்லை.
- source_word: לְבַקֵּשׁ אֶת־דָּוִד
  choice: தாவீதைத் தேடி
  rationale: בקש என்பதன் பரந்த ‘தேடுதல்’ பொருளைப் பாதுகாக்கிறது; பிடிக்க அல்லது கொல்ல வந்தார்கள் என்று வெளிப்படையாகச் சொல்லாத மூலத்தின் இடைவெளியை நிரப்பவில்லை.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: தாவீது இதைக் கேள்விப்பட்டதும்
  rationale: மூலத்தில் மறைமுகமாக உள்ள செய்திப் பொருளை ‘இதை’ என இயல்பான தமிழில் வெளிப்படுத்தி, தொடர்ச்சியான நிகழ்வைச் சுட்டுகிறது.
- source_word: וַיֵּרֶד אֶל־הַמְּצוּדָה
  choice: அரணுக்குச் சென்றான்
  rationale: מְצוּדָה என்பதன் பாதுகாக்கப்பட்ட உறைவிடம்/கோட்டை என்ற கருத்தை ‘அரண்’ வெளிப்படுத்துகிறது. தமிழில் இலக்கை நோக்கிய இயக்கம் இயல்பாக இருக்க ‘சென்றான்’ பயன்படுத்தப்பட்டுள்ளது; ‘இறங்கினான்’ என்ற நிலவியல் கூறு முதன்மை உரையில் வெளிப்படையாகத் தக்கவைக்கப்படாதது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
