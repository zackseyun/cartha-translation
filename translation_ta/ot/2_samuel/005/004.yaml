  text: David was thirty years old when he began to reign[b][a], and he reigned forty years.
translation:
  language: ta
  text: தாவீது அரசாளத் தொடங்கியபோது[a] முப்பது வயதுடையவராக இருந்தார்; அவர் நாற்பது ஆண்டுகள் அரசாண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசனானபோது.”
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: முப்பது வயதுடையவராக இருந்தார்
  rationale: எபிரெய மொழியில் சொற்சொல்லாக ‘முப்பது ஆண்டுகளின் மகன்’ எனும் வயதைக் குறிக்கும் மரபுத்தொடர் இது. அதன் இயல்பான பொருளை நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: בְּמָלְכוֹ
  choice: அரசாளத் தொடங்கியபோது
  rationale: ב முன்னொட்டுடன் வரும் מלך வினையின் infinitive construct வடிவமும் மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டும், தாவீது ஆட்சி செய்யத் தொடங்கிய காலத்தைச் சுட்டுகின்றன. ‘அரசாளத் தொடங்கியபோது’ என்பது அரசேற்புக் காலத்தையும் ஆட்சியின் தொடக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מָלָךְ
  choice: அரசாண்டார்
  rationale: מלך என்பது அரசனாக ஆட்சி செய்வதைக் குறிக்கிறது; ‘அரசாண்டார்’ என்பது சுருக்கமான, துல்லியமான தமிழ் இணைச்சொல்.
- source_word: אַרְבָּעִים שָׁנָה
  choice: நாற்பது ஆண்டுகள்
  rationale: தாவீதின் ஆட்சிக்கால நீளத்தைக் குறிக்கும் நேரடியான எண்-காலப் பயன்பாடு.
- source_word: דָּוִד
  choice: தாவீது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
