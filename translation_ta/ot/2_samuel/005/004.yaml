translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், அரசருக்குரிய மரியாதைப் பன்மையுடனும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வயது மரபுத்தொடர் தமிழில் நேரடிப் பொருளாக வழங்கப்பட்டதால் அதற்குத் தனிக் குறிப்புரை தேவையில்லை; בְּמָלְכוֹ என்பதிலுள்ள ‘ஆட்சியைத் தொடங்குதல்/அரசனாதல்’ என்ற இரு இயல்பான புரிதல்களும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
