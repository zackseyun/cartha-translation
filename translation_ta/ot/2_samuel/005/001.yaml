base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/001.yaml
  text: Then all the tribes of Israel came to David at Hebron and said[a], “Look[b], we are your bone and your flesh.”
translation:
  language: ta
  text: பின்பு இஸ்ரவேலின் எல்லாக் கோத்திரங்களும் எப்ரோனில்[a] இருந்த தாவீதிடம் வந்து, “இதோ, நாங்கள் உங்கள் எலும்பும் உங்கள் சதையுமாக இருக்கிறோம்[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எப்ரோனுக்கு”; எபிரெயத்தில் “எப்ரோன்” என்ற இடப்பெயருடன் திசையைக் குறிக்கும் முடிவு உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “உங்கள் எலும்பும் உங்கள் சதையும்” என்பது நெருங்கிய இரத்த உறவையோ ஒரே குடும்ப அடையாளத்தையோ குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: பின்பு ... வந்து
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுக்கிறது; ‘பின்பு’ நிகழ்வுகளின் வரிசையை இயல்பான தமிழில் காட்டுகிறது, ‘வந்து’ בוא என்பதன் நேரடிப் பொருளைத் தருகிறது.
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லாக் கோத்திரங்களும்
  rationale: தனித்தனியான ஒவ்வொரு கோத்திரத்தைவிட, இஸ்ரவேலின் கோத்திரங்கள் அனைத்தையும் ஒருங்கிணைந்த தேசியக் குழுவாகக் குறிக்கும் மூலத்தின் கூட்டு உணர்வைப் பாதுகாக்கிறது.
- source_word: אֶל דָּוִד חֶבְרוֹנָה
  choice: எப்ரோனில் இருந்த தாவீதிடம்
  rationale: אֶל தாவீதை நோக்கிய வருகையைக் குறிக்கிறது; חֶבְרוֹנָה இடப்பெயருடன் திசைச்சுட்டு முடிவைக் கொண்டுள்ளது. தமிழில் தாவீது எப்ரோனில் இருப்பதையும் அவரிடமே அவர்கள் வந்ததையும் தெளிவாகவும் இயல்பாகவும் இணைக்கிறது.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: என்றார்கள்
  rationale: ‘சொல்லும்படியாகச் சொன்னார்கள்’ என்ற சொற்சொல் மீளுருவாக்கத்தைத் தவிர்த்து, எபிரெயப் பேச்சுத் தொடக்கச் சூத்திரத்தை இயல்பான தமிழில் தருகிறது.
- source_word: הִנּוּ
  choice: இதோ
  rationale: கவனத்தை வலியுறுத்தி ஈர்க்கும் இடைச்சொல்லின் சுட்டும் வலிமையை, நவீன மரியாதைமிக்க தமிழில் பாதுகாக்கிறது.
- source_word: עַצְמְךָ וּבְשָׂרְךָ
  choice: உங்கள் எலும்பும் உங்கள் சதையும்
  rationale: இரத்த உறவையும் ஒரே குடும்ப அடையாளத்தையும் குறிக்கும் உருவகத்தை விளக்கமாக மாற்றாமல், எபிரெயச் சொல் வரிசையுடன் பாதுகாக்கிறது.
- source_word: אֲנָחְנוּ
  choice: நாங்கள் ... இருக்கிறோம்
  rationale: வினையில்லா எபிரெய வாக்கியத்தைத் தமிழில் இயல்பான முழு வாக்கியமாக்க இணைப்புவினை சேர்க்கப்படுகிறது.
theological_decisions:
- issue: உறவுமுறைச் சூத்திரத்தின் அரசியல்-இறையியல் வலிமை
  choice: “நாங்கள் உங்கள் எலும்பும் உங்கள் சதையுமாக இருக்கிறோம்” என்று உருவகத்தை நேரடியாக வைத்தல்
  alternative: “நாங்கள் உங்கள் சொந்த மக்கள்” அல்லது “நாங்கள் உங்கள் உறவினர்கள்”
  rationale: பேசுவோர் தாவீதுடனான பொதுவான இன-குடும்ப உறவை முன்வைத்து அவரது அரசாட்சிக்கான தேசிய ஒருமைப்பாட்டை நிலைநாட்டுகின்றனர். நேரடி உருவகம் குடும்ப உறவையும் அரசியல் வலிமையையும் கூடுதல் கோட்பாட்டு விளக்கமின்றிப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘கோத்திரங்கள்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் தேசிய-குல அமைப்பைத் துல்லியமாகக் காட்டுகிறது; உறவுமுறை உருவகம் விளக்கவுரையாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
