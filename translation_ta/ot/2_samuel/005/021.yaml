base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/021.yaml
  text: And they left their idols there[b][a], and David and his men carried them away.
translation:
  language: ta
  text: அவர்கள் தங்கள் சிலைகளை அங்கே விட்டுச் சென்றார்கள்[b]; தாவீதும் அவருடைய ஆட்களும் அவற்றை எடுத்துச் சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 நாளாகமம் 14:12-ல், சிலைகளை எரிக்கும்படி தாவீது கட்டளையிட்டார் என்ற கூடுதல் விவரம் உள்ளது. இங்கே சாமுவேலின் எபிரெய உரை, தாவீதும் அவருடைய ஆட்களும் அவற்றை எடுத்துச் சென்றார்கள் என்று மட்டுமே கூறுகிறது.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘தங்கள் உருவங்களை.’ எபிரெயச் சொல் வழிபாட்டுக்குரிய உருவங்களைக் குறிக்கிறது; ‘சிலைகள்’ என்பது இச்சூழலில் அதன் பொருளைத் தெளிவாக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: விட்டுச் சென்றார்கள்
  rationale: עזב என்பதற்கு ‘விடுதல்/கைவிடுதல்’ என்று பொருள். பின்வாங்கியவர்கள் பொருட்களை அங்கேயே விட்டுச் சென்றனர் என்ற கதைச்சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: எளிய இடச்சுட்டுச் சொல்லின் நேரான பொருளைப் பாதுகாக்கிறது.
- source_word: עֲצַבֵּיהֶם
  choice: தங்கள் சிலைகளை
  rationale: இச்சொல் உருவங்களையோ வழிபாட்டுச் சிலைகளையோ குறிக்கலாம். பெலிஸ்தியரின் வழிபாட்டுப் பொருட்கள் இங்கே குறிக்கப்படுவதால் ‘சிலைகள்’ என்பது தெளிவான, இயல்பான தேர்வு.
- source_word: וַיִּשָּׂאֵם
  choice: அவற்றை எடுத்துச் சென்றார்கள்
  rationale: נשא என்பதன் ‘தூக்குதல்/சுமத்தல்/எடுத்துச் செல்லுதல்’ என்ற பரந்த பொருளில், பொருட்களை அங்கிருந்து அகற்றிய செயலை இயல்பாகக் கூறுகிறது; அவற்றை என்ன நோக்கத்திற்காக எடுத்துச் சென்றார்கள் என்பதை ஊகிக்கவில்லை.
- source_word: דָּוִד וַאֲנָשָׁיו
  choice: தாவீதும் அவருடைய ஆட்களும்
  rationale: ‘அவருடைய மனிதர்கள்’ என்பதைக் காட்டிலும் நவீனத் தமிழில் ‘அவருடைய ஆட்கள்’ இயல்பானது; ‘வீரர்கள்’ என்று மொழிபெயர்த்து மூலத்தைவிட அதிகமான விவரத்தைச் சேர்ப்பதையும் தவிர்க்கிறது.
theological_decisions:
- issue: சிலைகள் எரிக்கப்பட்டதாகக் கூறும் 1 நாளாகமம் 14:12-க்கும் இவ்வசனத்திற்கும் உள்ள தொடர்பு
  choice: 2 சாமுவேலின் எபிரெய உரையின்படி ‘எடுத்துச் சென்றார்கள்’ என்று மொழிபெயர்த்து, நாளாகமத்தின் கூடுதல் விவரத்தை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: சிலைகள் உடனே எரிக்கப்பட்டதாகப் பொருள்படும் வகையில் இரு பதிவுகளையும் ஒருங்கிணைத்தல்
  rationale: 2 சாமுவேலின் மசோரெட்டிக் உரை தாவீதும் அவருடைய ஆட்களும் சிலைகளை எடுத்துச் சென்றார்கள் என்று மட்டுமே கூறுகிறது. அவற்றை எரிக்கத் தாவீது கட்டளையிட்டார் என்ற விவரத்தை நாளாகமம் சேர்க்கிறது. ஆகவே மூல உரைகளுக்கிடையிலான வேறுபாட்டை அமைதியாக நீக்காமல் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இரு தொடர்ச்சியான வினைச்செயல்களையும் அரைப்புள்ளி இணைக்கிறது; மூலத்தின் சுருக்கமும் நேர்த்தியும் பாதுகாக்கப்படுகின்றன.
