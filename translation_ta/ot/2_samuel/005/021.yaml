  source_fidelity: 'மூல எபிரெய உரையின் இரு வினைச்செயல்களும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன: பெலிஸ்தியர் தங்கள் வழிபாட்டுச் சிலைகளை அங்கே விட்டுச் சென்றனர்; தாவீதும் அவருடைய ஆட்களும் அவற்றை எடுத்துச் சென்றனர். וַיִּשָּׂאֵם என்பதற்கான ‘எடுத்துச் சென்றார்கள்’ என்பது ‘எரித்தார்கள்’ என்ற நாளாகம விவரத்தை உரையில் முன்கூட்டியே சேர்க்காமல் נשא-வின் பரந்த ‘எடுத்துச் செல்லுதல்/சுமந்து செல்லுதல்’ பொருளைப் பாதுகாக்கிறது.'
