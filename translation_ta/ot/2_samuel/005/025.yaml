  rationale: தாவீது யாவேக்குக் கீழ்ப்படிந்தான் என்ற மூல உறவைத் தெளிவாகக் காட்ட ‘தனக்கு’ என்பதற்குப் பதிலாக ‘தாவீதுக்கு’ பயன்படுத்தப்பட்டுள்ளது. כֵּן என்பதன் கூறை வெளிப்படுத்த ‘அப்படியே’ சேர்க்கப்பட்டுள்ளது. வיַּךְ என்பதன் போர்த் தாக்குதல் கருத்தையும், சூழலில் பொருந்தும் தீர்மானமான வெற்றியையும் காக்க ‘அடித்து முறியடித்தான்’ பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள், உரைவேறுபாட்டு எச்சரிக்கை, மற்றும் கேசேரின் அணுகுமிடத்தைக் குறிக்கும் அடிக்குறிப்பு மாற்றமின்றிக் காக்கப்படுகின்றன.
