base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/025.yaml
  text: And David did so[a], just as Yahweh had commanded him[b], and he struck down the Philistines from Geba as far as Gezer.
translation:
  language: ta
  text: யாவே தாவீதுக்குக் கட்டளையிட்டபடியே தாவீது அப்படியே செய்தான்; அவன் பெலிஸ்தியர்களை கேபாவிலிருந்து[a] கேசேர் வரையிலும்[b] அடித்து முறியடித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மசோரா உரை: “கேபா.” உரைவேறுபாடு அல்லது இணைப் பகுதியைக் கருத்தில் கொள்வதால் சில மொழிபெயர்ப்புகளில் வேறு இடப்பெயர் காணப்படுகிறது.'
    reason: textual_variant
  - marker: b
    text: 'சொல்லுக்கு சொல்: “நீ கேசேருக்கு வரும்வரை”; அதாவது, கேசேரை அணுகும் இடம் அல்லது அதன் சுற்றுப்பகுதி வரை.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כֵּן
  choice: அப்படியே செய்தான்
  rationale: עשה כן என்பது முன்பு கொடுக்கப்பட்ட கட்டளையை அப்படியே நிறைவேற்றியதைக் குறிக்கும் சுருக்கமான எபிரெய மொழிநடை. தமிழில் இயல்பாக இதன் பொருளைத் தருகிறது.
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: தனக்குக் கட்டளையிட்டபடியே
  rationale: כַּאֲשֶׁר இங்கு கட்டளைக்கும் தாவீதின் செயலுக்கும் உள்ள துல்லியமான ஒத்திசைவை வலியுறுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיַּךְ
  choice: முறியடித்தான்
  rationale: נכה என்ற வினை இராணுவச் சூழலில் எதிரியைத் தாக்கித் தோற்கடிப்பதைக் குறிக்கலாம். ஒவ்வொருவரையும் கொன்றதாக மிகைப்படுத்தாமல் தீர்மானமான வெற்றியைச் சொல்கிறது.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இந்த இனக்குழுவுக்கான வழக்கமான நவீனத் தமிழ் பெயர்.
- source_word: מִגֶּבַע
  choice: கேபாவிலிருந்து
  rationale: மசோரா உரையில் உள்ள גֶּבַע என்ற இடப்பெயரை நேரடியாகப் பின்பற்றுகிறது; இணை வசனத்தின் அடிப்படையில் வேறு இடப்பெயராக மாற்றவில்லை.
- source_word: עַד בֹּאֲךָ גָזֶר
  choice: கேசேர் வரையிலும்
  rationale: சொல்லுக்கு சொல் வடிவில் ‘நீ கேசேருக்கு வரும்வரை’ என இருந்தாலும், இது ஓர் இடத்தின் அணுகுமிடம் அல்லது எல்லைவரையிலான பரப்பைக் குறிக்கும் எபிரெய மரபுத்தொடர். இயல்பான தமிழில் புவியியல் எல்லையைத் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட தெய்வீகப் பெயரைப் பட்டப்பெயரால் மாற்றாமல் காக்கிறது; குறிப்பிட்ட சமய மரபின் தனித்துவமான வடிவத்தைத் திணிக்காமல் எபிரெய உச்சரிப்பை அணுகும் தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட வரலாற்று விவரிப்பு நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் இரு தொடர்ச்சியான செயல்களும் காக்கப்பட்டுள்ளன; தமிழில் இயல்பான வாக்கிய ஓட்டத்திற்காக இரண்டாவது பகுதியில் ‘அவன்’ சேர்க்கப்பட்டுள்ளது.
