  text: וַ/יֹּסִ֥פוּ ע֛וֹד פְּלִשְׁתִּ֖ים לַֽ/עֲל֑וֹת וַ/יִּנָּֽטְשׁ֖וּ בְּ/עֵ֥מֶק רְפָאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/022.yaml
  text: And the Philistines came up again and spread out in the Valley of Rephaim[a].
translation:
  language: ta
  text: பெலிஸ்தியர்கள் மீண்டும் மேலே வந்து, ரெப்பாயீம் பள்ளத்தாக்கில் அணிவகுத்துப் பரவினர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போருக்காக நிலைகொண்டனர்”; “திடீர்த் தாக்குதல் நடத்தினர்” என்றும் பொருள் கொள்ளலாம். எபிரெய வினைச்சொல், பெலிஸ்தியர்கள் பள்ளத்தாக்கெங்கும் படைநிலைகளை எடுத்ததைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ עוֹד ... לַעֲלוֹת
  choice: மீண்டும் மேலே வந்து
  rationale: יסף உடன் עוֹד மற்றும் தொடர்ந்து வரும் לעלות ஆகியவை முன்பு செய்த மேலே வரும் படைநகர்வை மறுபடியும் செய்ததைக் குறிக்கின்றன. தமிழ் இயல்புக்கேற்ப ‘மீண்டும் மேலே வந்து’ என வழங்கப்பட்டது.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இனக்குழுவின் பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: וַיִּנָּטְשׁוּ
  choice: அணிவகுத்துப் பரவினர்
  rationale: இந்தப் போர்ச் சூழலில் வினைச்சொல் படையினர் பள்ளத்தாக்கின் பரப்பில் நிலைகொண்டு விரிந்ததைக் குறிக்க வாய்ப்புள்ளது. ‘பரவினர்’ என்ற மூலப் படிமத்துடன் ‘அணிவகுத்து’ என்பது இராணுவச் சூழலைத் தெளிவாக்குகிறது; சொல்லின் நுண்பொருள் உறுதியற்றதால் அடிக்குறிப்பில் மாற்றுகள் தரப்பட்டுள்ளன.
- source_word: בְּעֵמֶק רְפָאִים
  choice: ரெப்பாயீம் பள்ளத்தாக்கில்
  rationale: עֵמֶק என்பது ‘பள்ளத்தாக்கு’; רְפָאִים இங்கு இடப்பெயராக இருப்பதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது.
