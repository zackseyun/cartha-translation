reference: 2 Samuel 5:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֤ל דָּוִד֙ בַּֽ/יהוָ֔ה וַ/יֹּ֖אמֶר לֹ֣א תַעֲלֶ֑ה הָסֵב֙ אֶל אַ֣חֲרֵי/הֶ֔ם וּ/בָ֥אתָ לָ/הֶ֖ם מִ/מּ֥וּל בְּכָאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/023.yaml
  text: So David inquired of Yahweh[a], and he said, “You shall not go up; circle around behind them, and come against them opposite the balsam trees.”
translation:
  language: ta
  text: தாவீது யாவேயிடம் ஆலோசனை கேட்டான். அதற்கு அவர், “நீ மேலே செல்ல வேண்டாம்; அவர்களுக்குப் பின்புறமாகச் சுற்றிச் சென்று, பால்சம் மரங்களுக்கு எதிரே அவர்களிடம் செல்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: யாவேயிடம் வழிகாட்டுதல் கேட்டான்
  rationale: שׁאל + ביהוה என்பது சாதாரணமாகக் கேள்வி கேட்பதைவிட, போர்த் தீர்மானத்திற்காக இறைவனின் வழிகாட்டுதலை நாடுவதைக் குறிக்கிறது.
- source_word: יהוה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைத் திருப்பெயரைப் பட்டப்பெயராக மாற்றாமல், நவீனத் தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לֹא תַעֲלֶה
  choice: நீ நேராக முன்னேற வேண்டாம்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்’; இப்போர்ச் சூழலில் அது படையுடன் முன்னேறுவதைக் குறிக்கிறது. தொடர்ந்து வரும் சுற்றிச் செல்லும் கட்டளையோடு உள்ள எதிர்மறையைத் தெளிவாக்க ‘நேராக’ சேர்க்கப்பட்டுள்ளது.
- source_word: הָסֵב אֶל אַחֲרֵיהֶם
  choice: அவர்களுக்குப் பின்னால் சுற்றிச் சென்று
  rationale: எதிரிப் படையின் பின்புறத்தை அடைவதற்கான தந்திர நகர்வை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וּבָאתָ לָהֶם
  choice: அவர்களைத் தாக்கச் செல்
  rationale: בוא + ל என்ற அமைப்பு இப்போர்ச் சூழலில் பகைமையுடன் அவர்களை அணுகுவதைக் குறிக்கிறது; தமிழில் அதன் நோக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִמּוּל
  choice: எதிரே
  rationale: ஒரு பொருளை நோக்கிய அல்லது அதற்கு நேர் எதிரான இடநிலையைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: בְּכָאִים
  choice: பால்சம் மரங்கள்
  rationale: குறிப்பிட்ட மரவகை உறுதியாக அடையாளம் காணப்படவில்லை. ‘பால்சம்’ என்பது பொதுவாக ஏற்கப்படும் சாத்தியமான அடையாளம்; பிற வாய்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் திருப்பெயர் நேரடியாக இருப்பதால், அதை பொதுப் பட்டப்பெயராக மாற்றாமல் அதன் பெயர்த்தன்மையைப் பாதுகாக்கிறது.
- issue: וַיֹּאמֶר என்பதன் மறைமுக எழுவாய்
  choice: அவர்
  alternative: யாவே
  rationale: இங்கு பதிலளிப்பவர் யாவே என்பது சூழலில் தெளிவு. பெயரை மீண்டும் சேர்க்காமல் எபிரெயத்தின் பிரதிப்பெயர் தொடர்ச்சியை இயல்பான தமிழில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. போர்த் தந்திரத்தின் நகர்வை இயல்பாகத் தெரிவிக்கிறது; உறுதியற்ற தாவரவியல் அடையாளம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
