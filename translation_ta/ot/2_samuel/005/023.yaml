revisions:
- from: தாவீது யாவேயிடம் வழிகாட்டுதல் கேட்டான். அதற்கு அவர், “நீ நேராக முன்னேற வேண்டாம்; அவர்களுக்குப் பின்னால் சுற்றிச் சென்று, பால்சம் மரங்களுக்கு[a] எதிரே அவர்களைத் தாக்கச் செல்” என்றார்.
  to: தாவீது யாவேயிடம் ஆலோசனை கேட்டான். அதற்கு அவர், “நீ மேலே செல்ல வேண்டாம்; அவர்களுக்குப் பின்புறமாகச் சுற்றிச் சென்று, பால்சம் மரங்களுக்கு எதிரே அவர்களிடம் செல்” என்றார்.
  rationale: The revision removes two interpretive expansions while retaining a natural modern Tamil military instruction. It also uses a smoother idiom for David’s inquiry and preserves the uncertain botanical identification in the footnote.
