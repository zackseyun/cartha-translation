  naturalness: ‘ஆனால் தாவீது சீயோன் கோட்டையைக் கைப்பற்றினார்; அதுவே தாவீதின் நகரம்’ என்பது நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமான வேதாகம நடையுடனும் உள்ளது. முற்றுப்புள்ளிக்குப் பதிலாக அரைப்புள்ளி பயன்படுத்தப்பட்டிருப்பது பின்னுள்ள அடையாள விளக்கத்தின் நெருக்கத்தை நன்றாகக் காட்டுகிறது.
