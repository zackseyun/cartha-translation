  text: וַ/יִּלְכֹּ֣ד דָּוִ֔ד אֵ֖ת מְצֻדַ֣ת צִיּ֑וֹן הִ֖יא עִ֥יר דָּוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/007.yaml
  text: But David captured the stronghold of Zion[a], that is, the City of David.
translation:
  language: ta
  text: ஆனால் தாவீது சீயோன் கோட்டையைக்[a] கைப்பற்றினார்; அதுவே தாவீதின் நகரம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சீயோன் அரண்.’ எபிரெயச் சொல் அரண்செய்யப்பட்ட வலுவான இடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: கைப்பற்றினார்
  rationale: לכד என்பது போர்ச் சூழலில் ஓர் இடத்தைப் பிடித்தல் அல்லது கைப்பற்றுதலைக் குறிக்கிறது; ‘கைப்பற்றினார்’ என்பது இயல்பான நவீனத் தமிழில் இராணுவப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וַ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் எபூசியர் வெளிப்படுத்திய தன்னம்பிக்கைக்கு மாறாகத் தாவீது கோட்டையைக் கைப்பற்றியதை இவ்விணைப்புச் சொல் காட்டுகிறது; ஆகவே வெறும் ‘அப்போது’ அல்லது ‘மேலும்’ என்பதைக் காட்டிலும் ‘ஆனால்’ இங்கு பொருத்தமானது.
- source_word: מְצֻדַת
  choice: கோட்டை
  rationale: מְצוּדָה என்பது அரண்செய்யப்பட்ட வலுவான இடத்தைக் குறிக்கிறது. ‘கோட்டை’ சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான சொல்; ‘அரண்’ என்பதும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: צִיּוֹן
  choice: சீயோன்
  rationale: இது இடப்பெயர்; தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்பட்ட ‘சீயோன்’ என்ற ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: הִיא
  choice: அதுவே
  rationale: இந்தத் தனிப்பெயர்ச்சொல் முன்னுள்ள ‘சீயோன் கோட்டை’யைப் பின்வரும் ‘தாவீதின் நகரம்’ என்பதுடன் அடையாளப்படுத்துகிறது; ‘அதுவே’ அதன் விளக்கமும் அடையாளப்படுத்தலும் சேர்ந்த வலிமையை இயல்பாகத் தருகிறது.
- source_word: עִיר דָּוִד
  choice: தாவீதின் நகரம்
  rationale: எபிரெயச் சார்பு அமைப்பைத் தெளிவான இயல்பான தமிழில் தருகிறது; இது ஓர் இடத்துக்குரிய பெயரடை போன்ற அடையாளப் பெயராகவும் வாசிக்கப்படுகிறது.
