  text: וַ/יֵּ֣דַע דָּוִ֔ד כִּֽי הֱכִינ֧/וֹ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/כִי֙ נִשֵּׂ֣א מַמְלַכְתּ֔/וֹ בַּ/עֲב֖וּר עַמּ֥/וֹ יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/012.yaml
  text: And David knew that Yahweh had established him as king over Israel[a], and that he had exalted his kingdom for the sake of his people Israel.
translation:
  language: ta
  text: தாவீது, யெகோவா அவனை இஸ்ரவேலின்மேல் அரசனாக நிலைநிறுத்தியதையும், தமது மக்களாகிய இஸ்ரவேலுக்காக[a] அவனுடைய அரசாட்சியை உயர்த்தியதையும் அறிந்துகொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இங்குள்ள ‘தமது’ என்பது யெகோவாவை அல்ல, தாவீதைக் குறிப்பதாக எடுத்துக்கொண்டால், ‘அவனுடைய மக்களாகிய இஸ்ரவேலுக்காக.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: அறிந்துகொண்டான்
  rationale: ידע என்பது அறிதல் அல்லது உணர்ந்து அறிதலைக் குறிக்கிறது. இங்கு நிகழ்வுகளின் பொருளைத் தாவீது புரிந்துகொண்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הֱכִינוֹ
  choice: தன்னை ... நிலைநிறுத்தியதையும்
  rationale: כון என்பதன் ஹிஃபில் வடிவம் உறுதிப்படுத்துதல் அல்லது நிலைநிறுத்துதல் என்னும் பொருளைக் கொண்டது; அரசப் பின்னணியில் தாவீதின் அரச பதவியை யெகோவா உறுதியாக்கியதை இது காட்டுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெயத் திருப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் திருப்பெயர் வடிவத்தில் தருகிறது.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல் அரசனாக
  rationale: לְמֶלֶךְ அரசப் பொறுப்பையும் עַל ஆளுகையையும் குறிக்கின்றன; இந்தத் தமிழ் தொடர் இரண்டையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: נִשֵּׂא
  choice: உயர்த்தியதையும்
  rationale: נשׂא இங்கு உயர்த்துதல் அல்லது மேன்மைப்படுத்துதல் என்ற பொருளில் வருகிறது. ‘உயர்த்தினார்’ என்பது உருவகத்தையும் அரசச் சூழலையும் காக்கிறது.
- source_word: מַמְלַכְתּוֹ
  choice: தன் அரசாட்சியை
  rationale: ממלכה என்பது அரசாட்சி, ஆட்சி அல்லது ராஜ்யம் எனப் பொருள்படலாம். இங்கு ஆளுகையும் அரச நிலையும் மையமாக இருப்பதால் ‘அரசாட்சி’ இயல்பாக உள்ளது; ‘தன்’ என்பது தாவீதைக் குறிக்கிறது.
- source_word: בַּעֲבוּר
  choice: '...க்காக'
  rationale: இந்தச் சொல் இங்கு நோக்கம் அல்லது நன்மை பெறுபவரைக் காட்டுகிறது; தமிழில் ‘க்காக’ அதனைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: தமது மக்களாகிய இஸ்ரவேல்
  rationale: பின்னொட்டு மிக இயல்பாக யெகோவாவைக் குறிக்கிறது. ‘தமது’ மரியாதையையும் யெகோவாவையே சுட்டும் தொடர்பையும் தெளிவாக்குகிறது; ‘மக்களாகிய’ என்பது இஸ்ரவேல் என்ற இணைப்பெயர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: עַמּוֹ (‘அவருடைய மக்கள்’) என்பதிலுள்ள பின்னொட்டின் முன்னிலை
  choice: யெகோவாவைக் குறிக்கும் வகையில் ‘தமது மக்களாகிய இஸ்ரவேல்’
  alternative: தாவீதைக் குறிக்கும் வகையில் ‘தன் மக்களாகிய இஸ்ரவேல்’
  rationale: 'வாக்கியத்தின் செயல்படும் எழுவாய் யெகோவா: அவர் தாவீதை நிலைநிறுத்தி அவனுடைய அரசாட்சியை உயர்த்துகிறார். எனவே இஸ்ரவேல் யெகோவாவின் மக்கள் என்பது மிக இயல்பான வாசிப்பு. ஆயினும் எபிரெயப் பின்னொட்டு தாவீதையும் குறிக்கக்கூடும் என்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.'
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் அமைந்துள்ளது. வாக்கியத்தின் இரு இணையான கூறுகளும் ‘...யதையும்’ என்ற வடிவில் பாதுகாக்கப்பட்டுள்ளன. ‘அரசாட்சி’ என்பது ‘ராஜ்யம்’ என்பதைக் காட்டிலும் இச்சூழலில் இயல்பான தற்போதைய தமிழ்.
