  text: בְּ/חֶבְרוֹן֙ מָלַ֣ךְ עַל יְהוּדָ֔ה שֶׁ֥בַע שָׁנִ֖ים וְ/שִׁשָּׁ֣ה חֳדָשִׁ֑ים וּ/בִ/ירוּשָׁלִַ֣ם מָלַ֗ךְ שְׁלֹשִׁ֤ים וְ/שָׁלֹשׁ֙ שָׁנָ֔ה עַ֥ל כָּל יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/005.yaml
  text: In Hebron he reigned over Judah seven years and six months, and in Jerusalem he reigned thirty-three years over all Israel and Judah.
translation:
  language: ta
  text: எப்ரோனில் அவர் யூதாவின்மேல் ஏழு ஆண்டுகளும் ஆறு மாதங்களும் ஆட்சி செய்தார். எருசலேமில் அவர் இஸ்ரவேல் முழுவதின்மேலும் யூதாவின்மேலும் முப்பத்து மூன்று ஆண்டுகள் ஆட்சி செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּחֶבְרוֹן
  choice: எப்ரோனில்
  rationale: בְּ இடத்தைக் குறிக்கிறது; நகரத்திற்குள் ஆட்சி நடைபெற்றதை நவீன தமிழில் இயல்பாகக் கூறும் வடிவம்.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தார்
  rationale: இங்கு வினைச்சொல் ஆட்சியேற்ற ஒரே நிகழ்வை அல்ல, குறிப்பிட்ட காலம் நீடித்த அரசாட்சியைச் சுருக்கிக் கூறுகிறது.
- source_word: עַל יְהוּדָה
  choice: யூதாவின்மேல்
  rationale: מָלַךְ என்பதுடன் வரும் עַל, ஆட்சிக்குட்பட்ட மக்களையோ நாட்டையோ குறிக்கிறது; எபிரெயச் சொல்லமைப்பையும் அரசியல் உறவையும் காக்கிறது.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: ஏழு ஆண்டுகளும் ஆறு மாதங்களும்
  rationale: கால அளவை நேரடியாகவும் இயல்பான தமிழ் இணைப்புடனும் தருகிறது.
- source_word: וּבִירוּשָׁלַם
  choice: எருசலேமில்
  rationale: இரண்டாவது ஆட்சியிடத்தை அறிமுகப்படுத்துகிறது; வாக்கியப் பிரிப்பால் எபிரெய இணைப்பின் தொடர்பு தமிழில் தெளிவாகத் தொடர்கிறது.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנָה
  choice: முப்பத்து மூன்று ஆண்டுகள்
  rationale: எபிரெய எண்ணிக்கையை நவீனத் தமிழின் வழக்கமான எண்ணுருவில் தருகிறது.
- source_word: עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: இஸ்ரவேல் முழுவதின்மேலும் யூதாவின்மேலும்
  rationale: כָּל என்பது இஸ்ரவேலோடு நேரடியாக இணைவதைப் பிரதிபலிக்கிறது; இஸ்ரவேல், யூதா ஆகிய இரு அரசியல் அடையாளங்களையும் தனித்தனியாகக் காக்கிறது.
