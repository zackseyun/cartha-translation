base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/006.yaml
  text: And the king and his men went to Jerusalem[a], to the Jebusites, the inhabitants of the land. And they said to David, “You will not come in here, for even the blind and the lame will turn you away,” saying[b], “David will not come in here.”
translation:
  language: ta
  text: அரசனும் அவனுடைய ஆட்களும் எருசலேமுக்கு, அந்நாட்டில் குடியிருந்த எபூசியரிடம் சென்றார்கள். அவர்கள்[a] தாவீதிடம், “நீர் இங்கே நுழைய முடியாது; பார்வையற்றவர்களும் நடக்க இயலாதவர்களும்கூட உம்மைத் தடுத்துவிடுவார்கள்”[b] என்று சொல்லி, “தாவீது இங்கே நுழையமாட்டான்” என்றும் கூறினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவன் தாவீதிடம் சொன்னான்” என்று ஒருமையில் உள்ளது; இங்கு அந்த ஒருமை எபூசிய மக்களை ஒரு குழுவாகக் குறிக்கக்கூடும்.
    reason: textual_variant
  - marker: b
    text: எபிரெயத்தில், “பார்வையற்றவர்களும் நடக்க இயலாதவர்களும் உம்மைத் திருப்பிவிடுவார்களானால் தவிர” எனப் பொருள்படும் கடினமான தொடர் உள்ளது. நகரம் மிகவும் பாதுகாப்பானதால் அவர்களும்கூட தாவீதைத் தடுத்துவிட முடியும் என்பது எபூசியர்களின் கேலி என இங்கு பொருள் கொள்ளப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: சென்றார்கள்
  rationale: வாவ் தொடருடன் வரும் הלך கதைநடையை முன்னெடுக்கும் எளிய இறந்தகாலச் செயலைக் குறிக்கிறது. எழுவாய் கூட்டாக இருப்பதால் தமிழில் பன்மை வினை பயன்படுத்தப்பட்டது; ‘படையெடுத்துச் சென்றார்கள்’ என்பது மூல வினையில் வெளிப்படையாக இல்லாத இராணுவ நுணுக்கத்தைச் சேர்க்கும்.
- source_word: הַמֶּלֶךְ וַאֲנָשָׁיו
  choice: அரசனும் அவனுடைய ஆட்களும்
  rationale: אֲנָשָׁיו என்பதன் நேர்பொருள் ‘அவனுடைய ஆட்கள்’. சூழலில் அவர்கள் போர்வீரர்களாக இருக்கலாம் என்றாலும், அதைக் குறிப்பாகச் சுருக்காமல் எபிரெயச் சொல்லின் அகலத்தைப் பேணுகிறது.
- source_word: יְרוּשָׁלִַם
  choice: எருசலேம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற இடப்பெயர் வடிவம்.
- source_word: אֶל הַיְבֻסִי
  choice: எபூசியர்களை எதிர்கொள்ள
  rationale: אֶל அடிப்படையில் ‘நோக்கி/இடம்’ என்றாலும், இங்கு நகரிலிருந்த எபூசியரை அணுகும் பகைமைச் சூழல் தமிழில் தெளிவாகவும் இயல்பாகவும் அமைய ‘எதிர்கொள்ள’ பயன்படுத்தப்பட்டது. எபிரெய ஒருமை இனக்குழுவைக் கூட்டாகக் குறிக்கிறது.
- source_word: יוֹשֵׁב הָאָרֶץ
  choice: அந்நாட்டில் குடியிருந்த
  rationale: ஒருமை வினையெச்சம் கூட்டுப் பொருளில் எபூசியர்களை விளக்குகிறது. ‘அந்நாட்டில் குடியிருந்த’ என்பது தமிழில் இயல்பான தொடர்பெயர் அமைப்பு.
- source_word: וַיֹּאמֶר
  choice: அவர்கள் ... என்றார்கள்
  rationale: மசோரெட்டிக் உரையில் வினை ஒருமையாக இருந்தாலும், அருகிலுள்ள ‘எபூசியன்’ கூட்டொருமையாகச் செயல்பட்டு முழுக் குழுவையும் குறிக்கிறது. இதைத் தமிழில் இயல்பான பன்மையாக வழங்கி, ஒருமை வடிவத்தை அடிக்குறிப்பில் குறிப்பிட்டுள்ளது.
- source_word: לֹא תָבֹוא הֵנָּה
  choice: நீர் இங்கே நுழைய முடியாது
  rationale: கோட்டை நகருக்குள் வருவதை மறுக்கும் கேலிச் சவால் இது. மரியாதைப் பன்மையான ‘நீர்’ தாவீதிடம் நேரடியாகப் பேசும் dignified Tamil register-ஐத் தருகிறது; ‘நுழைய’ நகருக்குள் புகும் சூழலை வெளிப்படுத்துகிறது.
- source_word: כִּי אִם הֱסִירְךָ הַעִוְרִים וְהַפִּסְחִים
  choice: பார்வையற்றவர்களும் நடக்க இயலாதவர்களும்கூட உம்மைத் தடுத்துவிடுவார்கள்
  rationale: எபிரெயத் தொடரின் இலக்கணம் கடினமானது; சொற்சொல்லாக ‘நீர் பார்வையற்றவர்களையும் நடக்க இயலாதவர்களையும் அகற்றினாலன்றி’ எனலாம். ஆனால் சூழலில் இது நகரம் மிகப் பாதுகாப்பானது, அத்தகையவர்கள்கூட தாவீதை விரட்டிவிட முடியும் என்ற கேலி. முதன்மை உரை அந்தப் பொருளை இயல்பான தமிழில் தருகிறது; சொற்சொல் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַעִוְרִים וְהַפִּסְחִים
  choice: பார்வையற்றவர்களும் நடக்க இயலாதவர்களும்
  rationale: உடற்குறைபாட்டைக் குறிக்கும் மூலத்தின் தெளிவான சொற்களை உவமையாக மாற்றாமல் வைத்திருக்கிறது; நவீன தமிழில் மரியாதையுடனும் புரிந்துகொள்ளத்தக்க விதத்திலும் கூறுகிறது.
- source_word: לֵאמֹר ... לֹא יָבֹוא דָוִד הֵנָּה
  choice: என்று சொல்லி, “தாவீது இங்கே நுழையமாட்டான்” என்றார்கள்
  rationale: இரண்டாவது לֵאמֹר முந்தைய கேலியைச் சுருக்கி மீண்டும் கூறுகிறது. நேரடிக் கூற்றாக வழங்குவது எபிரெயத்தின் வலியுறுத்தும் மறுபடியும் சொல்லுதலைப் பேணுகிறது.
theological_decisions:
- issue: உடற்குறைபாடுகளைச் சுட்டும் சொற்கள் கேலிப் பேச்சில் வருதல்
  choice: ‘பார்வையற்றவர்களும் நடக்க இயலாதவர்களும்’ என்ற konkrete குறிப்பைத் தக்கவைத்தல்
  alternative: ‘எங்களிலேயே மிகவும் பலவீனமானவர்கள்கூட’ என்று பொதுமைப்படுத்துதல்
  rationale: இது எபூசியர்களின் இகழ்ச்சிப் பேச்சாக அறிக்கையிடப்படுகிறது; மொழிபெயர்ப்பு அவர்களுடைய மதிப்பீட்டை ஒப்புக்கொள்வதில்லை. மூலத்தின் குறிப்பிட்ட சொற்களை மறைக்காமல், நவீன மரியாதைமிக்க தமிழில் தருவது உரைத்தெளிவைப் பேணுகிறது.
- issue: கடினமான நிபந்தனைத் தொடரின் பொருள்
  choice: எபூசியர்களின் பாதுகாப்புக் கேலியாக, ‘அவர்களும்கூட உம்மைத் தடுத்துவிடுவார்கள்’ என முதன்மை உரையில் வழங்குதல்
  alternative: ‘பார்வையற்றவர்களையும் நடக்க இயலாதவர்களையும் நீர் அகற்றினாலன்றி’ என்ற சொற்சொல் வடிவம்
  rationale: כִּי אִם הֱסִירְךָ தொடரின் வடிவம் உண்மையாகவே கடினமானது. சூழலும் தொடரும் மறுப்பும் கேலிச் சவாலை ஆதரிக்கின்றன; எனினும் சொற்சொல் மாற்று அடிக்குறிப்பில் வைக்கப்பட்டதால் உரையின் மெய்யான தெளிவின்மை மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான, dignified தமிழில் இயல்பான கதைநடை பயன்படுத்தப்பட்டது. தாவீதிடம் பேசும்போது ‘நீர்/உம்மை’ என்ற மரியாதை வடிவம் வைக்கப்பட்டது. பழைய அல்லது இழிவாக ஒலிக்கக்கூடிய உடற்குறைபாட்டு சொற்களுக்கு மாற்றாக ‘பார்வையற்றவர்கள்’, ‘நடக்க இயலாதவர்கள்’ பயன்படுத்தப்பட்டன; ஆனால் மூலத்தின் konkrete குறிப்பு மென்மைப்படுத்தி மறைக்கப்படவில்லை. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெறுகின்றன.
