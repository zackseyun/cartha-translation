base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and King David made a covenant with them at Hebron before Yahweh[b], and they anointed David king over Israel.
translation:
  language: ta
  text: இஸ்ரவேலின் மூப்பர்கள் அனைவரும் எப்ரோனில் இருந்த அரசனிடம் வந்தார்கள். தாவீது அரசன் எப்ரோனில் யாவேவின் முன்னிலையில்[b] அவர்களுடன் ஓர் உடன்படிக்கை செய்தார்[a]. பின்பு அவர்கள் தாவீதை இஸ்ரவேலின் அரசராக அபிஷேகம் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘ஓர் உடன்படிக்கையை வெட்டினார்’; இது ‘ஓர் உடன்படிக்கை செய்தார்’ என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘யாவேயின் சந்நிதியில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: வந்தார்கள்
  rationale: בוא என்பதன் கால் தொடர்வினை வடிவம் கதைத் தொடரில் வருகையைக் குறிக்கிறது; அடுத்துள்ள இடக்குறிப்புடன் ‘வந்தார்கள்’ இயல்பான தமிழாக அமைகிறது.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மூப்பர்கள் அனைவரும்
  rationale: זְקֵנִים என்பதன் சமூகத் தலைமைப் பொருளையும் כָּל என்பதன் முழுமையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֶל הַמֶּלֶךְ חֶבְרוֹנָה
  choice: எப்ரோனில் இருந்த அரசனிடம்
  rationale: חֶבְרוֹנָה என்பதிலுள்ள திசைச்சுட்டு இறுதி எப்ரோனை நோக்கிய இயக்கத்தைக் காட்டுகிறது; அரசன் அங்கு இருந்தான் என்பதையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: ஓர் உடன்படிக்கை செய்தார்
  rationale: சொல்லுக்கு சொல் ‘உடன்படிக்கையை வெட்டினார்’ என்ற எபிரெய மரபுத்தொடர் தமிழில் அதன் பொருளான ‘உடன்படிக்கை செய்தார்’ என்று இயல்பாக வழங்கப்படுகிறது.
- source_word: לָהֶם
  choice: அவர்களுடன்
  rationale: כרת ברית என்ற மரபுத்தொடருடன் இச்சொல் உடன்படிக்கையில் பங்குகொள்ளும் மறுதரப்பைக் குறிக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பதன் நேரடியான ‘முன்னிலையில்’ என்ற பொருளையும் உடன்படிக்கையின் இறைசாட்சி சார்ந்த சூழலையும் பாதுகாக்கிறது.
- source_word: וַיִּמְשְׁחוּ
  choice: அபிஷேகம் செய்தார்கள்
  rationale: מָשַׁח அரசருக்குரிய சடங்கு முறையிலான எண்ணெய்பூசுதலைக் குறிக்கிறது; தமிழ் வேதாகம நடையிலும் பொதுவாக அறியப்பட்ட ‘அபிஷேகம்’ அந்தச் சிறப்புப் பொருளைப் பாதுகாக்கிறது.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசராக
  rationale: இஸ்ரவேல்மீது அரசதிகாரம் செலுத்த நியமிக்கப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: தாவீது அரசன்
  rationale: எபிரெய பட்டப்பெயர்–பெயர் அமைப்பை இயல்பான தமிழ் பெயர்–பட்டப்பெயர் வரிசையில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: எபிரெய தனிப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல், அதன் பரவலாக ஏற்கப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் வழங்குகிறது.
- issue: בְּרִית என்பதன் உடன்படிக்கை சார்ந்த பொருள்
  choice: உடன்படிக்கை
  alternative: ஒப்பந்தம் / அரசியல் உடன்பாடு
  rationale: அரசரை நிறுவும் இந்தச் சூழலில் சொல்லுக்குள்ள அரசியல் மற்றும் இறைசாட்சி சார்ந்த கனத்தை ‘உடன்படிக்கை’ பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெய இணைப்புவாக்கியம் தமிழின் இயல்புக்கேற்ப மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டது; ‘பின்பு’ கதைத் தொடரைத் தெளிவுபடுத்துகிறது. அடிக்குறி [a] அது விளக்கும் உடன்படிக்கை மரபுத்தொடருக்குப் பின்னும் [b] இறைமுன்னிலைச் சொற்றொடருக்குப் பின்னும் வைக்கப்பட்டுள்ளன.
