  text: וַ/יִּשְׁאַ֨ל דָּוִ֤ד בַּֽ/יהוָה֙ לֵ/אמֹ֔ר הַ/אֶֽעֱלֶה֙ אֶל פְּלִשְׁתִּ֔ים הֲ/תִתְּנֵ֖/ם בְּ/יָדִ֑/י וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל דָּוִד֙ עֲלֵ֔ה כִּֽי נָתֹ֥ן אֶתֵּ֛ן אֶת הַ/פְּלִשְׁתִּ֖ים בְּ/יָדֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/019.yaml
  text: And David inquired of Yahweh[a], saying, “Should I go up against the Philistines? Will you give them into my hand?” And Yahweh said to David, “Go up, for I will certainly give the Philistines into your hand.”
translation:
  language: ta
  text: தாவீது யாவேயிடம், “நான் பெலிஸ்தியர்களுக்கு எதிராகப் புறப்பட்டுச் செல்லலாமா? அவர்களை என் கையில் ஒப்புக்கொடுப்பீரா?”[a] என்று விசாரித்தான். யாவே தாவீதிடம், “புறப்பட்டுச் செல்; ஏனெனில் பெலிஸ்தியர்களை நிச்சயமாக உன் கையில் ஒப்புக்கொடுப்பேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை என் கையில் கொடுப்பீரா?” “கையில் கொடுப்பது” என்பது எதிரியின்மேல் வெற்றியை அளிப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: யாவேயிடம் விசாரித்து
  rationale: שׁאל இச்சூழலில் இறைவனுடைய வழிகாட்டுதலை நாடுவதைக் குறிக்கிறது; சடங்கு முறையை ஊகிக்காமல் ‘விசாரித்து’ என்ற சொல் அந்தப் பொருளைக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக உள்ள உடன்படிக்கைப் பெயரைத் தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: הַאֶעֱלֶה
  choice: நான் ... புறப்பட்டுச் செல்லலாமா?
  rationale: עלה என்பதன் அடிப்படை இயக்கப் பொருளையும், போருக்குச் செல்ல அனுமதி/வழிகாட்டுதல் கேட்கும் வினாவின் இயல்பையும் நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶל־פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களுக்கு எதிராக
  rationale: אֶל என்பதன் திசைப் பொருள் இங்குள்ள போர்ச் சூழலில் பகைநோக்கிச் செல்வதைக் குறிக்கிறது.
- source_word: הֲתִתְּנֵם בְּיָדִי
  choice: அவர்களை என் கையில் ஒப்புக்கொடுப்பீரா?
  rationale: ‘கையில் கொடுத்தல்’ என்ற எபிரெய வெற்றி மரபுத்தொடரின் உருவகத்தைத் தக்கவைத்தபடியே, ‘ஒப்புக்கொடு’ என்பது எதிரியை ஒருவரின் அதிகாரத்திற்குள் அளிப்பதைத் தெளிவாக்குகிறது.
- source_word: עֲלֵה
  choice: புறப்பட்டுச் செல்
  rationale: முந்தைய עלה வினையோடு பொருள் ஒற்றுமையைப் பேணுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘தாக்கு’ என்ற கூடுதல் குறிப்பைச் சேர்க்கவில்லை.
- source_word: כִּי נָתוֹן אֶתֵּן
  choice: ஏனெனில் ... நிச்சயமாக ... ஒப்புக்கொடுப்பேன்
  rationale: வினையெச்ச முழுவடிவமும் வினைமுற்றும் இணையும் எபிரெய வலியுறுத்தலை ‘நிச்சயமாக’ வெளிப்படுத்துகிறது.
- source_word: בְּיָדֶךָ
  choice: உன் கையில்
  rationale: தாவீதின் கேள்வியிலுள்ள அதே உருவகத்தையும் மூலத்தின் இணை அமைப்பையும் தொடர்ந்து காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் காணப்படும் தனிப்பட்ட இறைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, வசனத்தின் உடன்படிக்கைச் சூழலைக் காக்கிறது.
- issue: தெய்வீக வாக்குறுதியின் உறுதி
  choice: நிச்சயமாக ... ஒப்புக்கொடுப்பேன்
  alternative: ஒப்புக்கொடுப்பேன்
  rationale: נָתוֹן אֶתֵּן அமைப்பின் வலியுறுத்தலை நீக்காமல், வெற்றி உறுதியாக அருளப்படும் என்ற மூலத்தின் தீவிரத்தை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘புறப்பட்டுச் செல்’ என்பது இராணுவச் சூழலை உணர்த்தினாலும், மூலத்தைவிடக் குறிப்பாக ‘தாக்கு’ என்று கூறுவதைத் தவிர்க்கிறது. அடிக்குறி குறியீடு பிரதான உரையில் [a] என இடம்பெற்றுள்ளது.
