  text: and Elishama[a], and Eliada, and Eliphelet.
translation:
  language: ta
  text: எலிசாமா, எலியாதா, மற்றும் எலிபெலேத்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இப்பெயர் சில மரபுகளில் “எலிபாலேத்” என்றும் எழுதப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶ/אֱלִישָׁמָע
  choice: எலிசாமா
  rationale: וְ இணைப்புச்சொல் பெயர்ப்பட்டியலின் தமிழ்ச் சொற்றொடர் அமைப்பில் இறுதியிலுள்ள ‘ஆகியோரும்’ என்பதில் இயல்பாக வெளிப்படுத்தப்படுகிறது; אֱלִישָׁמָע என்ற பெயர் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וְ/אֶלְיָדָע
  choice: எலியாதா
  rationale: אֶלְיָדָע என்பது அதன் பொருளை மொழிபெயர்க்காமல், எபிரெய தனிப்பெயராக ஒலிப்பெயர்க்கப்பட்டது; இணைப்புச்சொல் பட்டியலின் தமிழ் அமைப்பில் வெளிப்படுகிறது.
- source_word: וֶ/אֱלִיפָלֶט
  choice: எலிபெலேத்[a]
  rationale: אֱלִיפָלֶט என்ற பெயர் எபிரெய உயிரொலிகளுக்கு நெருக்கமாக ‘எலிபெலேத்’ என ஒலிப்பெயர்க்கப்பட்டது. தமிழ் மரபுகளில் காணக்கூடிய மாற்று எழுத்துவடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
