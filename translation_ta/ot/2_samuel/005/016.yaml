translation_notes:
  register: முந்தைய வசனத்தில் தொடங்கிய மகன்களின் பட்டியலைத் தொடர்வதால், தமிழில் தனித்து வாசிக்கவும் சூழலோடு இயல்பாக இணையவும் ‘ஆகியோரும் பிறந்தார்கள்’ சேர்க்கப்பட்டுள்ளது. பெயர்கள் நவீனத் தமிழில் தெளிவான, மரியாதையான ஒலிப்பெயர்ப்பில் வழங்கப்பட்டுள்ளன.
