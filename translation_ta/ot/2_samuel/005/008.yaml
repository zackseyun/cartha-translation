  text: וַ/יֹּ֨אמֶר דָּוִ֜ד בַּ/יּ֣וֹם הַ/ה֗וּא כָּל מַכֵּ֤ה יְבֻסִי֙ וְ/יִגַּ֣ע בַּ/צִּנּ֔וֹר וְ/אֶת הַ/פִּסְחִים֙ וְ/אֶת הַ֣/עִוְרִ֔ים שנאו נֶ֣פֶשׁ דָּוִ֑ד עַל כֵּן֙ יֹֽאמְר֔וּ עִוֵּ֣ר וּ/פִסֵּ֔חַ לֹ֥א יָב֖וֹא אֶל הַ/בָּֽיִת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/008.yaml
  text: And David said on that day[a], “Whoever strikes the Jebusites and reaches the water shaft, and the lame and the blind, whom David’s soul hates.” Therefore they say[c][b], “The blind and the lame shall not come into the house.”
translation:
  language: ta
  text: அந்நாளில் தாவீது, “எவன் எபூசியர்களைத் தாக்கி நீர்வழித் தண்டை[a] அடைகிறானோ, தாவீதின் உள்ளம் வெறுக்கும் கால் ஊனமுற்றவர்களையும் பார்வையற்றவர்களையும்…”[b] என்றான். அதனால்தான், “பார்வையற்றவரும் கால் ஊனமுற்றவரும் வீட்டுக்குள்[c] வரமாட்டார்” என்று மக்கள் சொல்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர்க்கால்வாய்,” “வடிகால்,” அல்லது “சுரங்கப்பாதை.” இந்த எபிரெயச் சொல் பெரும்பாலும் ஒரு நீர் அமைப்பையோ தண்டையோ குறிக்கிறது; அதன் துல்லியமான பொருள் உறுதியில்லை.
    reason: lexical_alternative
  - marker: b
    text: இந்தக் கூற்றின் எபிரெய வாக்கிய அமைப்பு கடினமானது. “கால் ஊனமுற்றவர்களையும் பார்வையற்றவர்களையும்” என்ற சொற்கள், தாவீதின் சவாலின் நேரடிப் பொருளாக அல்லாமல், முந்தைய வசனத்தில் எபூசியர்கள் கூறிய கேலியின் ஒரு பகுதியாக இருக்கலாம் என்று சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “அரண்மனைக்குள்.” இச்சூழலில் “வீடு” என்பது அரசரின் இருப்பிடத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַכֵּה יְבֻסִי
  choice: எவன் எபூசியர்களைத் தாக்கி
  rationale: כָּל என்பதும் மַכֵּה என்னும் பங்கேற்பு வடிவமும் சேர்ந்து, யாருக்கும் விடுக்கப்படும் சவாலைச் சுட்டுகின்றன. יְבֻסִי ஒருமை வடிவில் இருந்தாலும் இங்கு இனக்குழுவைக் கூட்டாகக் குறிக்கிறது.
- source_word: וְיִגַּע
  choice: அடைந்து
  rationale: נגע என்பதன் அடிப்படைப் பொருள் ‘தொடு/சென்றடை’. இப்போர்ச் சூழலில், வெளிப்படையாக இல்லாத தாக்குதல் பொருளைச் சேர்க்காமல் ‘அடைந்து’ என்பது இயல்பாக உள்ளது.
- source_word: בַּצִּנּוֹר
  choice: நீர்வழித் தண்டு
  rationale: צִנּוֹר என்பதன் துல்லியமான அமைப்பு தெளிவில்லை; நகரின் நீர் அமைப்புடன் தொடர்புடைய செங்குத்தான தண்டு அல்லது நீர்வழியாக இருக்கலாம். முதன்மை உரை சுருக்கமாக இருக்க, மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: וְאֶת הַפִּסְחִים וְאֶת הָעִוְרִים
  choice: கால் ஊனமுற்றவர்களையும் பார்வையற்றவர்களையும்
  rationale: இரு பெயரடைகளும் மனிதர் குழுக்களைக் குறிக்கும் பெயர்ச்சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன. நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் இருக்க இச்சொற்கள் தேர்ந்தெடுக்கப்பட்டன; கடினமான எபிரெய வாக்கிய அமைப்பு மாற்றித் தீர்க்கப்படவில்லை.
- source_word: שנאו נֶפֶשׁ דָּוִד
  choice: தாவீதின் உள்ளம் வெறுக்கிற
  rationale: ‘தாவீதின் உயிர்/உள்ளம் வெறுக்கிறது’ என்ற செறிவான எபிரெய மரபுத்தொடரின் வலிமையை ‘உள்ளம்’ காக்கிறது; வெறுப்பை மென்மைப்படுத்தவில்லை.
- source_word: עַל כֵּן יֹאמְרוּ
  choice: அதனால்தான் … என்று மக்கள் சொல்கிறார்கள்
  rationale: இது ஒரு வழக்குச் சொல்லை அறிமுகப்படுத்துகிறது. எபிரெயத்தில் செய்பவர் வரையறுக்கப்படாததால், தமிழில் பொதுவான ‘மக்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עִוֵּר וּפִסֵּחַ
  choice: பார்வையற்றவரும் கால் ஊனமுற்றவரும்
  rationale: எபிரெயத்தில் ஒருமை வடிவங்கள் வந்தாலும், இவை ஒரு வகுப்பை பொதுவாகக் குறிக்கும் பழமொழிப் பயன்பாடு; தமிழிலும் பொதுமை ஒருமை இயல்பாக உள்ளது.
- source_word: לֹא יָבֹא אֶל הַבָּיִת
  choice: வீட்டுக்குள் வரமாட்டார்
  rationale: எபிரெய எதிர்கால மறுப்பு இங்கு வழக்குச் சொல்லாக இருப்பதால் ‘வரமாட்டார்’ இயல்பானது. בַּיִת ‘வீடு’ அல்லது சூழலில் ‘அரண்மனை’ எனக் குறிக்கலாம்; முதன்மை உரையில் பொதுவான பொருள் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: கால் ஊனமுற்றவர்களையும் பார்வையற்றவர்களையும் தாவீது வெறுத்ததாகத் தோன்றும் கடினமான கூற்று
  choice: மசோரா உரையின் கடினமான சொற்றொடரை மென்மைப்படுத்தாமல், அதே சமயம் அதன் தெளிவற்ற வாக்கியத் தொடர்பைக் குறித்த அடிக்குறிப்புடன் வைத்தல்
  alternative: இச்சொற்கள் முந்தைய வசனத்தில் எபூசியர்கள் கூறிய கேலியை மட்டுமே குறிக்கின்றன என்று முதன்மை உரையிலேயே விளக்கிப் பொருளுரைத்தல்
  rationale: எபிரெய வாக்கிய அமைப்பு சுருக்கமாகவும் தெளிவற்றதாகவும் உள்ளது. அதைத் தீர்மானமாக ஒரு கோட்பாட்டு அல்லது ஒழுக்கவியல் கூற்றாக மாற்றாமல், உரையின் பதற்றத்தையும் மாற்று வாசிப்பையும் காக்கிறது.
- issue: ‘வீட்டுக்குள் வரமாட்டார்’ என்பதன் பரப்பு
  choice: வசனத்தில் உள்ள வழக்குச் சொல்லை அப்படியே மொழிபெயர்த்து, இதை எல்லாக் காலங்களுக்குமான ஆலய அல்லது சமூகத் தடையாக விரிவுபடுத்தாமல் இருத்தல்
  alternative: இதை நேரடியாக ஆலய நுழைவுத் தடை அல்லது அரண்மனை விதி எனக் குறிப்பிடுதல்
  rationale: இந்த வசனம் ‘வீடு’ என்று மட்டுமே கூறுகிறது; குறிப்பிட்ட நிறுவன அல்லது கோட்பாட்டு பொருளைச் சேர்ப்பது மூலத்தைக் கடந்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கையாள்கிறது. மாற்றுத்திறனைக் குறிக்கும் இடங்களில் இழிவாக ஒலிக்கக்கூடிய பழைய சொற்களைத் தவிர்த்து, ‘கால் ஊனமுற்றவர்’ மற்றும் ‘பார்வையற்றவர்’ பயன்படுத்தப்பட்டன. மூல எபிரெயத்தின் முற்றுப்பெறாததுபோல் தோன்றும் சவால் வாக்கியமும் அதன் இறையியல் பதற்றமும் திட்டமிட்டு காக்கப்பட்டுள்ளன.
