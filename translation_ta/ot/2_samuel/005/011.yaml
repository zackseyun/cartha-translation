source:
  edition: WLC
  text: וַ֠/יִּשְׁלַח חִירָ֨ם מֶֽלֶךְ צֹ֥ר מַלְאָכִים֮ אֶל דָּוִד֒ וַ/עֲצֵ֣י אֲרָזִ֔ים וְ/חָרָשֵׁ֣י עֵ֔ץ וְ/חָֽרָשֵׁ֖י אֶ֣בֶן קִ֑יר וַ/יִּבְנֽוּ בַ֖יִת לְ/דָוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/011.yaml
  text: And Hiram king of Tyre sent messengers to David[a], and cedar logs, and craftsmen of wood, and craftsmen of stone walling[b]; and they built a house for David.
translation:
  language: ta
  text: தீருவின் அரசனான ஈராம், தாவீதிடம் தூதுவர்களையும் கேதுரு மரக்கட்டைகளையும் மரவேலைக் கைவினைஞர்களையும் கற்சுவர் கட்டும் கைவினைஞர்களையும்[a] அனுப்பினான். அவர்கள் தாவீதுக்காக ஒரு வீட்டைக்[b] கட்டினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கல்தச்சர்களையும்.” எபிரெயச் சொற்றொடரில் “கல்,” “சுவர்” ஆகிய இரு சொற்களும் இடம்பெறுகின்றன.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஓர் அரண்மனையைக்.” எபிரெய மொழியில் எழுத்துப்படி “ஒரு வீடு” என்றுள்ளது; அரசரைப் பற்றிய இச்சூழலில் அது அரண்மனையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினான்
  rationale: எபிரெயக் கதைநடையில் שלח என்பதன் இயல்பான, நேரடியான பொருள்.
- source_word: חִירָם מֶלֶךְ צֹר
  choice: தீருவின் அரசனான ஈராம்
  rationale: பெயரும் அரசுப் பட்டமும் நவீனத் தமிழில் இயல்பாக இணைக்கப்பட்டுள்ளன; צֹר என்பது வழக்கமான தமிழ்ப் பெயரான ‘தீரு’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: מַלְאָכִים
  choice: தூதுவர்கள்
  rationale: இச்சொல் பொதுவான செய்தியாளர்களையோ அரசத் தூதர்களையோ குறிக்கலாம்; ‘தூதுவர்கள்’ இரு சாத்தியங்களையும் திறந்துவைக்கிறது.
- source_word: וַעֲצֵי אֲרָזִים
  choice: கேதுரு மரக்கட்டைகள்
  rationale: சொல்லமைப்பு எழுத்துப்படி ‘கேதுரு மரங்கள்/மரம்’ என்றாலும், கட்டுமானச் சூழலில் பயன்பாட்டுக்குரிய கேதுரு மரக்கட்டைகளைக் குறிக்கிறது.
- source_word: חָרָשֵׁי עֵץ
  choice: மரவேலைக் கைவினைஞர்கள்
  rationale: חָרָשׁ என்பது கைவினைஞரைக் குறிக்கிறது; ‘தச்சர்கள்’ என்பதைவிட இது மூலத்தின் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: חָרָשֵׁי אֶבֶן קִיר
  choice: கற்சுவர் கட்டும் கைவினைஞர்கள்
  rationale: சிக்கலான இச்சொற்றொடரில் ‘கல்’ மற்றும் ‘சுவர்’ ஆகிய இரு கூறுகளும் உள்ளன; தமிழில் இயல்பாக இருக்கும்படியும் இரண்டையும் வெளிப்படுத்தும்படியும் மொழிபெயர்க்கப்பட்டது.
- source_word: וַיִּבְנוּ
  choice: அவர்கள் ... கட்டினார்கள்
  rationale: பன்மை வினையின் எழுவாய் முன்கூறப்பட்ட கைவினைஞர்கள்; தமிழில் தெளிவுக்காக ‘அவர்கள்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: בַיִת לְדָוִד
  choice: தாவீதுக்காக ஒரு வீடு
  rationale: בַיִת என்பதன் அடிப்படைப் பொருள் ‘வீடு’; அரசச் சூழலில் ‘அரண்மனை’ என்ற பொருள் இருக்கக்கூடும் என்பதால் அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: בַיִת என்பதைக் ‘வீடு’ அல்லது ‘அரண்மனை’ என்று மொழிபெயர்ப்பது
  choice: முதன்மை உரையில் ‘வீடு’
  alternative: ‘அரண்மனை’
  rationale: மூலச்சொல்லின் அடிப்படைப் பொருளை முதன்மை உரை காக்கிறது; அரசரின் குடியிருப்பு என்ற சூழல்சார் பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பட்டியலிலுள்ள அனைத்துப் பொருட்களுக்கும் மனிதர்களுக்கும் ஒரே ‘அனுப்பினான்’ வினை பொருந்துமாறு தமிழ் வேற்றுமை உருபுகள் அமைக்கப்பட்டுள்ளன. மூலத்திலுள்ள கடினமான ‘கல்–சுவர்’ சொற்றொடரும் ‘வீடு/அரண்மனை’ பொருள் வேறுபாடும் அடிக்குறிப்புகள் மூலம் மறைக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
