  text: וַ/יֹּ֧אמְרוּ ל֣/וֹ הַ/גִּבְעֹנִ֗ים אֵֽין ל/י כֶּ֤סֶף וְ/זָהָב֙ עִם שָׁא֣וּל וְ/עִם בֵּית֔/וֹ וְ/אֵֽין לָ֥/נוּ אִ֖ישׁ לְ/הָמִ֣ית בְּ/יִשְׂרָאֵ֑ל וַ/יֹּ֛אמֶר מָֽה אַתֶּ֥ם אֹמְרִ֖ים אֶעֱשֶׂ֥ה לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/004.yaml
  text: The Gibeonites said to him[a], “We have no claim for silver or gold against Saul or against his house, and it is not for us to put any man in Israel to death.” Then he said[b], “What do you say that I should do for you?”
translation:
  language: ta
  text: கிபியோனியர்கள் அவரிடம்[a], “சவுலிடமோ அவருடைய குடும்பத்தாரிடமோ வெள்ளியோ பொன்னோ கேட்கும் உரிமை எங்களுக்கு இல்லை; இஸ்ரயேலில் எவரையும் மரணத்துக்கு உட்படுத்துவதற்கு எங்களுக்கு அதிகாரம் இல்லை[b]” என்றார்கள். அதற்கு அவர், “நான் உங்களுக்காக என்ன செய்ய வேண்டும் என்று நீங்கள் கூறுகிறீர்கள்?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சவுலுக்கும் அவருடைய குடும்பத்தாருக்கும் எங்களுக்கும் இடையிலுள்ள காரியம் வெள்ளியையோ பொன்னையையோ பற்றியது அல்ல.” எபிரெயச் சொற்றொடர் வழக்குமொழியாக உள்ளது; இது பண இழப்பீட்டைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இஸ்ரயேலில் எவரையும் மரணத்துக்கு உட்படுத்துவதற்கு எங்களுக்கு உரிமை இல்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין לִי כֶּסֶף וְזָהָב עִם שָׁאוּל וְעִם בֵּיתוֹ
  choice: சவுலிடமோ அவருடைய குடும்பத்தாரிடமோ வெள்ளியோ பொன்னோ கேட்கும் உரிமை எங்களுக்கு இல்லை
  rationale: எபிரெயச் சொற்றொடர் வெறும் உடைமையைக் குறிக்காமல், இச்சூழலில் சவுலின் குடும்பத்தாரிடமிருந்து பண இழப்பீடு கோருவதைப் பற்றிய வழக்குமொழியாக உள்ளது. ஒருமை לִי குழுவின் சார்பான பேச்சாகப் புரிந்து, தமிழில் இயல்பாகப் பன்மையில் தரப்பட்டுள்ளது.
- source_word: עִם
  choice: சவுலிடமோ ... குடும்பத்தாரிடமோ
  rationale: עִם என்பதன் அடிப்படைப் பொருள் ‘உடன்’ என்றாலும், இங்கு உரிமைக்கோரிக்கையில் தொடர்புடைய எதிர்த்தரப்பைக் குறிக்கிறது; தமிழ் வேற்றுமை அமைப்பில் ‘-இடமோ’ என்பது பணம் கோரப்படும் தரப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְאֵין לָנוּ אִישׁ לְהָמִית בְּיִשְׂרָאֵל
  choice: இஸ்ரயேலில் எவரையும் கொன்றுபோடுவதும் எங்கள் உரிமை அல்ல
  rationale: இது கொல்லப்பட வேண்டிய நபர் இல்லையென்று கூறுவதல்ல; ஒருவரை மரணத்துக்குட்படுத்தும் அதிகாரம் அல்லது உரிமை தங்களுக்கு இல்லை என்பதே சூழலுக்கேற்ற பொருள்.
- source_word: אִישׁ
  choice: எவரையும்
  rationale: இங்கு אִישׁ குறிப்பிட்ட ஆணை அல்லாமல் பொதுவாக ஓர் இஸ்ரயேலரைச் சுட்டுகிறது. ‘எவரையும்’ என்பது தமிழில் அந்தப் பொதுமைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: מָה אַתֶּם אֹמְרִים אֶעֱשֶׂה לָכֶם
  choice: நான் உங்களுக்காக என்ன செய்ய வேண்டும் என்று சொல்கிறீர்கள்?
  rationale: சுருக்கமான எபிரெயத் தொடரில், அவர்கள் கோரும் பரிகாரத்தைத் தெரிவிக்கும்படி தாவீது கேட்கிறார். ‘செய்ய வேண்டும்’ என்பது இங்குள்ள விருப்ப/கடமை நுணுக்கத்தை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: கிபியோனியர்களின் கூற்று உரிமையின்மையையா அல்லது வெறும் மறுப்பையா குறிக்கிறது
  choice: முதன்மை உரையில் ‘உரிமை இல்லை’ என்று தரப்பட்டது
  alternative: ‘இது வெள்ளி பொன்னைப் பற்றிய காரியம் அல்ல’ / ‘எங்களுக்கு வெள்ளியோ பொன்னோ வேண்டாம்’
  rationale: அடுத்துள்ள மரணதண்டனைச் சொற்றொடருடன் இணைந்து வாசிக்கையில், இரு பகுதிகளும் தங்களுக்கு உள்ள அல்லது இல்லாத கோரிக்கை/அதிகாரத்தைச் சுட்டலாம். இருப்பினும் பண இழப்பீட்டை மறுக்கும் பொருளும் சாத்தியமாதலால் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘குடும்பத்தார்’ என்பது בֵּיתוֹ என்பதன் இல்லம்/வம்சக் குழு பொருளை இயல்பாக வெளிப்படுத்துகிறது. ‘இஸ்ரயேல்’ என்ற நவீன தமிழ் வடிவம் பயன்படுத்தப்பட்டது. மூலத்தின் சட்ட/இழப்பீட்டு சார்ந்த தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
