source:
  edition: WLC
  text: ו/ישבו בְּנֹ֜ב אֲשֶׁ֣ר בִּ/ילִידֵ֣י הָ/רָפָ֗ה וּ/מִשְׁקַ֤ל קֵינ/וֹ֙ שְׁלֹ֤שׁ מֵאוֹת֙ מִשְׁקַ֣ל נְחֹ֔שֶׁת וְ/ה֖וּא חָג֣וּר חֲדָשָׁ֑ה וַ/יֹּ֖אמֶר לְ/הַכּ֥וֹת אֶת דָּוִֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/016.yaml
  text: And Ishbi-benob[a], who was among the descendants of Rapha, whose spear weighed three hundred shekels of bronze, and who was girded with a new sword[c][b], said that he would strike down David.
translation:
  language: ta
  text: ராபாவின் சந்ததியரில் ஒருவனான[b] இஸ்பி-பெனோபு[a] என்பவனுடைய ஈட்டியின் எடை வெண்கலத்தில் முந்நூறு சேக்கலாக இருந்தது. அவன் புதிய வாளொன்றை இடுப்பில் கட்டியிருந்தான்[c]; தாவீதை வீழ்த்துவதாகக் கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயப் பெயரின் வடிவம் உறுதியற்றது. ‘இஸ்பி-பெனோபு’ என்பது மரபான புரிதலைப் பின்பற்றுகிறது; ‘யெஸ்பி-பெனோபு’ என்ற ஒலிபெயர்ப்பும், மெய்யெழுத்துகளை வேறுவிதமாகப் பிரித்துப் படிப்பதும் சாத்தியம்.
    reason: textual_variant
  - marker: b
    text: அல்லது, ‘ராபாவுக்குப் பிறந்தவர்களில் ஒருவன்.’ இச்சொற்றொடர் ரெப்பாயீமுடன் தொடர்புடைய இராட்சதர் குலத்தைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் ‘புதியது’ என்று மட்டுமே உள்ளது; அதற்குரிய பெயர்ச்சொல் விடுபட்டுள்ளது. அது ‘வாள்’ என்பது மரபான புரிதல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וישבו / בְּנֹב
  choice: இஸ்பி-பெனோபு
  rationale: எபிரெய மெய்யெழுத்து வடிவமும் சொற்பிரிப்பும் கடினமானவை. போர்வீரர்களின் பெயர்கள் இடம்பெறும் சுற்றுப்பகுதியுடன் பொருந்துவதால், மரபான புரிதலைப் பின்பற்றி இதை ஒருவரின் பெயராக ஒலிபெயர்த்துள்ளது; நிச்சயமின்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: אֲשֶׁר בִּילִידֵי הָרָפָה
  choice: ராபாவின் சந்ததியரில் ஒருவன்
  rationale: יְלִידֵי இங்கு பிறப்பு அல்லது குலவழியைக் குறிக்கிறது. ராபா என்பதை பொதுப்பெயரான ‘இராட்சதன்’ என்று மாற்றாமல் பெயராகவே வைத்திருப்பது மூலத்தின் வடிவத்தையும் அதன் குலச்சார்ந்த பொருளையும் காக்கிறது.
- source_word: וּמִשְׁקַל קֵינוֹ
  choice: அவனுடைய வெண்கல ஈட்டி ... எடையுள்ளதாக இருந்தது
  rationale: קֵין போர்ச் சூழலில் ஈட்டி அல்லது அதன் தண்டைக் குறிக்கும் மரபான புரிதலைப் பின்பற்றுகிறது. தமிழில் இயல்பாக அமைய எடைக் குறிப்புடன் வாக்கியம் மறுசீரமைக்கப்பட்டுள்ளது.
- source_word: שְׁלֹשׁ מֵאוֹת מִשְׁקַל נְחֹשֶׁת
  choice: முந்நூறு சேக்கல் எடையுள்ள வெண்கல
  rationale: பண்டைய எடை அலகை நவீன அளவாகத் தோராயமாக மாற்றாமல் ‘சேக்கல்’ என்று வைத்துள்ளது. நְחֹשֶׁת போர்க்கருவிச் சூழலில் ‘வெண்கலம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְהוּא חָגוּר חֲדָשָׁה
  choice: அவன் ஒரு புதிய வாளைக் கட்டியிருந்தான்
  rationale: חֲדָשָׁה என்பது பெண்பால் ஒருமை பெயரடை; அதற்குரிய பெயர்ச்சொல் மூலத்தில் விடுபட்டுள்ளது. போர்ச் சூழலிலும் மரபான விளக்கத்திலும் ‘வாள்’ மிகச் சாத்தியமான நிறைவு என்பதால் உரையில் வழங்கப்பட்டு, அதன் மறைமுகத் தன்மை அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: וַיֹּאמֶר לְהַכּוֹת אֶת דָּוִד
  choice: தாவீதை வீழ்த்துவதாகச் சொன்னான்
  rationale: சொல்லுக்கு சொல் வடிவம் ‘தாவீதை அடிப்பதற்குச் சொன்னான்’ என்பதாக இருந்தாலும், இச்சூழலில் அது தீர்மானத்தையோ அறிவிக்கப்பட்ட நோக்கத்தையோ வெளிப்படுத்துகிறது. ‘வீழ்த்துவதாகச் சொன்னான்’ என்பது ‘சொன்னான்’ என்ற வினைச்சொல்லையும் போர்ச் சூழலையும் காக்கிறது; ‘கொன்றுவிடுவதாக’ என்று பொருளை மிகத் திட்டவட்டமாக்கவில்லை.
