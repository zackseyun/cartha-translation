translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயச் சொல் வரிசையை இயந்திரமாகப் பின்பற்றாமல், உறவுத்தொடர்கள் மற்றும் எடைக் குறிப்புகள் இயல்பான தமிழாக மறுசீரமைக்கப்பட்டுள்ளன. பெயர், ராபாவின் குலத்தொடர்பு, விடுபட்ட ஆயுதப்பெயர் ஆகிய மூலத்தின் உண்மையான நிச்சயமின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
