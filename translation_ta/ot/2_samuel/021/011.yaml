  source_fidelity: மூல எபிரேயத்தின் செயப்பாட்டு வினை («அறிவிக்கப்பட்டது»), தாவீதுக்கான மறைமுகப் பொருள், ரிஸ்பாள் செய்த செயலைக் குறிக்கும் பொருள் வாக்கியம், மற்றும் அவளுடைய இரு அடையாளங்களும் துல்லியமாகப் பேணப்பட்டுள்ளன. «செய்தது» அறிக்கை பெறப்படுவதற்கு முன் நிகழ்ந்த செயலைச் சூழலுக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
  naturalness: வாக்கியம் நவீன நிலையான தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. «சவுலின் மறுமனைவியும் ஆயாவின் மகளுமான ரிஸ்பாள்» என்ற இணை அடையாள அமைப்பு சீராக வாசிக்கப்படுகிறது.
  terminology: «மறுமனைவி» என்பது பிலெகெஷ் என்ற குறைந்த நிலைத் துணைமை/மனைவி உறவைத் தமிழில் மரியாதையுடனும் புரியத்தக்க வகையிலும் தரும் நிலையான வேதாகமப் பயன்பாடாகும். பெயர்கள் «ரிஸ்பாள்», «ஆயா», «சவுல்», «தாவீது» ஆகியவை ஒத்திசைவாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
