  yaml_path: translation/ot/2_samuel/021/011.yaml
  text: And it was reported to David what Rizpah daughter of Aiah, Saul’s concubine, had done.
translation:
  language: ta
  text: சவுலின் மறுமனைவியும் ஆயாவின் மகளுமான ரிஸ்பாள் செய்தது தாவீதுக்கு அறிவிக்கப்பட்டது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: அறிவிக்கப்பட்டது
  rationale: נגד என்பதன் ஹொஃபால் வடிவம் செய்தி தெரிவிக்கப்பட்டதைச் செயப்பாட்டு வினையில் கூறுகிறது; ‘அறிவிக்கப்பட்டது’ இயல்பான நவீனத் தமிழில் அந்தச் செயப்பாட்டு பொருளைப் பேணுகிறது.
- source_word: לְדָוִד
  choice: தாவீதுக்கு
  rationale: ל குறிக்கும் மறைமுகச் செயப்படுபொருளைத் தமிழில் இயல்பாக நான்காம் வேற்றுமையால் தருகிறது.
- source_word: אֵת אֲשֶׁר
  choice: செய்தது
  rationale: אֵת உடன் வரும் உறவுச் சொல் אֲשֶׁר அறிக்கையின் பொருளை அறிமுகப்படுத்துகிறது; தமிழில் பெயரெச்ச வினையாலணையும் பெயராக ‘செய்தது’ என இயல்பாக அமைகிறது.
- source_word: עָשְׂתָה
  choice: செய்தது
  rationale: பெண்பால் ஒருமை நிறைவுவினை, அறிவிக்கப்படுவதற்கு முன் முடிந்த செயலைக் குறிக்கிறது; தமிழ் வாக்கிய அமைப்பில் ‘செய்தது’ காலவரிசையைத் தெளிவாக உணர்த்துகிறது.
- source_word: רִצְפָּה
  choice: ரிஸ்பாள்
  rationale: எபிரேயப் பெயரின் ஒலியைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது; இறுதி ה இங்கு ஒலியுடைய மெய்யாக இல்லை.
- source_word: בַת אַיָּה
  choice: ஆயாவின் மகள்
  rationale: எபிரேயத் தந்தைவழி அடையாளத்தை நேரடியாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: פִּלֶגֶשׁ שָׁאוּל
  choice: சவுலின் மறுமனைவி
  rationale: கட்டமைப்புத் தொடரை உறவுநிலை ஆறாம் வேற்றுமையில் தருகிறது. ‘மறுமனைவி’ என்பது முதன்மை மனைவியைவிடக் குறைந்த சட்ட/சமூக நிலையுள்ள பெண் துணையைக் குறிக்கும் பிலெகெஷ் என்ற சொல்லுக்கு நவீனத் தமிழில் மரியாதையுடனும் புரியத்தக்கவாறும் அமையும்.
