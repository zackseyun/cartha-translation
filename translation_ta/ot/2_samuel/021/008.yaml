base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/008.yaml
  text: So the king took the two sons of Rizpah daughter of Aiah[a], whom she had borne to Saul—Armoni and Mephibosheth—and the five sons of Michal daughter of Saul, whom she had borne to Adriel son of Barzillai the Meholathite.
translation:
  language: ta
  text: ஆகவே அரசன், ஆயாவின் மகளான ரிஸ்பாள் சவுலுக்குப் பெற்றெடுத்த இரண்டு மகன்களாகிய அர்மோனியையும் மேவிபோசேத்தையும், சவுலின் மகளான மீகாள்[a] மெகோலாத்தியனான பர்சிலாயின் மகன் அதிரியேலுக்குப் பெற்றெடுத்த ஐந்து மகன்களையும் கைப்பற்றிக்கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளும் பண்டைய உரைமரபுகளும் “மீகாள்” என்பதற்குப் பதிலாக “மேராப்” என்று வாசிக்கின்றன. அதிரியேல் சவுலின் மகள் மேராபை மணந்ததாகக் கூறும் 1 சாமுவேல் 18:19-ஐ ஒப்பிடுக.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ஆகவே ... அழைத்துக்கொண்டான்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுக்கிறது. சூழலில் மனிதர்களைக் கைப்பற்றித் தன்னிடம் கொண்டுவருவதைக் குறிப்பதால், தமிழில் இயல்பான ‘அழைத்துக்கொண்டான்’ பயன்படுத்தப்பட்டது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: எபிரெய உரை தாவீதின் பெயரைச் சொல்லாமல் அவரது பட்டத்தையே பயன்படுத்துவதால் அதுவே தக்கவைக்கப்பட்டது.
- source_word: שְׁנֵי בְּנֵי רִצְפָּה בַת אַיָּה
  choice: ஆயாவின் மகளான ரிஸ்பாளின் இரண்டு மகன்கள்
  rationale: எண்ணும் உறவுமுறையும் தெளிவாகத் தெரியும்படி எபிரெய இணைப்புத் தொடரின் பொருள் இயல்பான தமிழில் வழங்கப்பட்டது.
- source_word: אֲשֶׁר יָלְדָה לְשָׁאוּל
  choice: சவுலுக்குப் பெற்றெடுத்த
  rationale: ילד என்பதுடன் வரும் ל தந்தையைக் குறிக்கிறது; ‘பெற்றெடுத்த’ என்பது உடல் வழிப் பிறப்பைத் தெளிவாகவும் சுருக்கமாகவும் காட்டுகிறது.
- source_word: אַרְמֹנִי וְאֶת מְפִבֹשֶׁת
  choice: அர்மோனியையும் மேவிபோசேத்தையும்
  rationale: இரு தனிப்பெயர்களும் எபிரெய ஒலிப்புக்கு அண்மையான, தமிழ் வேதாகம வாசகர்களுக்குப் பரிச்சயமான வடிவங்களில் ஒலிபெயர்க்கப்பட்டன.
- source_word: חֲמֵשֶׁת בְּנֵי מִיכַל בַּת שָׁאוּל
  choice: சவுலின் மகளான மீகாள் ... ஐந்து மகன்கள்
  rationale: WLC எபிரெய மூலத்தில் உள்ள ‘மீகாள்’ முதன்மை உரையில் தக்கவைக்கப்பட்டது; ‘மேராப்’ என்ற மாற்று வாசிப்பு அடிக்குறிப்பில் தெரிவிக்கப்பட்டது.
- source_word: אֲשֶׁר יָלְדָה לְעַדְרִיאֵל
  choice: அதிரியேலுக்குப் பெற்றெடுத்த
  rationale: வசனத்தின் முந்தைய ஒத்த இலக்கண அமைப்புடன் ஒருமைப்பாட்டைக் காக்க அதே தமிழாக்க முறை பயன்படுத்தப்பட்டது.
- source_word: בֶּן בַּרְזִלַּי הַמְּחֹלָתִי
  choice: மெகோலாத்தியனான பர்சிலாயின் மகன்
  rationale: தந்தைவழி அடையாளமும் ஊர்சார் அடையாளமும் இயல்பான தமிழ்ச் சொல்லமைப்பில் பாதுகாக்கப்பட்டன.
theological_decisions:
- issue: அதிரியேலின் மகன்களுடைய தாயாக ‘மீகாள்’ குறிப்பிடப்படுவதால் தோன்றும் வரலாற்று/உரைச்சிக்கல்
  choice: WLC மூலவாசிப்பின்படி முதன்மை உரையில் ‘மீகாள்’ தக்கவைக்கப்பட்டது.
  alternative: ‘மேராப்’—சில கையெழுத்துப் பிரதிகளும் பண்டைய உரைமரபுகளும் தரும் வாசிப்பு; 1 சாமுவேல் 18:19 உடன் ஒத்துப்போகிறது.
  rationale: மூலத்தின் உண்மையான சிக்கலை மறைத்து ஒத்திசைக்காமல், சான்றுள்ள வாசிப்பை முதன்மை உரையில் வைத்துக் கொண்டு முக்கிய மாற்று வாசிப்பை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பானதும் கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டது. உறவுமுறைத் தொடர்கள் தமிழுக்கேற்ற வரிசையில் அமைக்கப்பட்டாலும், எபிரெய உரையின் இரு மகன் குழுக்களும் பெயர்களும் வரலாற்று உரைச்சிக்கலும் மாற்றமின்றிப் பாதுகாக்கப்பட்டன.
