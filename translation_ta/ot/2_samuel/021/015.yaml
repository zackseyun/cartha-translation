base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/015.yaml
  text: And there was war again between the Philistines and Israel[a], and David went down with his servants with him, and they fought against the Philistines, and David grew weary.
translation:
  language: ta
  text: பெலிஸ்தியருக்கும் இஸ்ரவேலுக்கும் இடையே மீண்டும் போர் ஏற்பட்டது. தாவீது தம் பணியாளர்களுடன்[a] இறங்கிச் சென்றார். அவர்கள் பெலிஸ்தியருக்கு எதிராகப் போரிட்டார்கள்; தாவீது களைப்படைந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தம் ஆட்களுடன்.’ எபிரெய மொழியில் ‘தம் பணியாளர்கள்’ என்று உள்ளது. அரசரின் சேவையில் இருந்தவர்களைக்—அவருடைய படைவீரர்கள் உட்பட—குறிக்க இது பொதுவாகப் பயன்படுத்தப்பட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: மீண்டும் போர் ஏற்பட்டது
  rationale: היה என்ற நிகழ்வை அறிமுகப்படுத்தும் வினையையும், עוֹד குறிக்கும் போரின் மறுநிகழ்வையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַפְּלִשְׁתִּים אֶת יִשְׂרָאֵל
  choice: பெலிஸ்தியருக்கும் இஸ்ரவேலுக்கும் இடையே
  rationale: எபிரெயக் கட்டமைப்பு இரு தரப்பினருக்கிடையேயான பகைமையைச் சுட்டுவதால், தமிழில் இயல்பாக ‘இடையே’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: וַיֵּרֶד
  choice: இறங்கிச் சென்றார்
  rationale: ירד என்பதன் கீழ்நோக்கிய நகர்வு என்ற அடிப்படைப் பொருளைத் தக்கவைத்து, தமிழில் இயல்பான வினைத்தொடராக அளிக்கிறது.
- source_word: וַעֲבָדָיו עִמּוֹ
  choice: தம்முடன் இருந்த தம் பணியாளர்களோடு
  rationale: עבדיו என்பதன் ‘அவருடைய பணியாளர்கள்’ என்ற சொற்பொருளையும் עמו என்பதன் ‘அவருடன்’ என்ற கூறையும் காக்கிறது; அரசரின் சேவையில் இருந்த படைவீரர்களையும் இது உள்ளடக்கலாம்.
- source_word: וַיִּלָּחֲמוּ אֶת־פְּלִשְׁתִּים
  choice: அவர்கள் பெலிஸ்தியருக்கு எதிராகப் போரிட்டார்கள்
  rationale: לחם இங்கு போரில் ஈடுபடுதலைக் குறிக்கிறது; எதிர்த்தரப்பைத் தமிழில் தெளிவாகக் காட்ட ‘எதிராக’ சேர்க்கப்பட்டது.
- source_word: וַיָּעַף
  choice: களைப்படைந்தார்
  rationale: போரின் போது தாவீது சோர்வடைந்த நிலையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
