base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/012.yaml
  text: Then David went and took the bones of Saul and the bones of Jonathan his son from the citizens of Jabesh-gilead[a], who had stolen them from the public square of Beth-shan[c][b], where the Philistines had hung them on the day the Philistines struck down Saul on Gilboa.
translation:
  language: ta
  text: பின்பு தாவீது புறப்பட்டுச் சென்று, சவுலின் எலும்புகளையும் அவன் மகன் யோனத்தானின் எலும்புகளையும்[a] யாபேஸ்-கீலேயாத்தின் குடிமக்களிடமிருந்து எடுத்துக்கொண்டார். அவர்கள் அந்த எலும்புகளைப் பெத்-சானின் பொதுவெளியிலிருந்து திருடியிருந்தார்கள். கில்போவாவில்[c] பெலிஸ்தியர்கள் சவுலைத் தாக்கி வீழ்த்திய நாளில், அவர்கள் அவற்றை அங்கே தொங்கவிட்டிருந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எலும்புகள்’ என்பதற்குப் பதிலாக ‘உடல் எச்சங்கள்’ என்றும் மொழிபெயர்க்கலாம்; ஆனால் எபிரெயம் நேரடியாக ‘எலும்புகள்’ என்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தொங்கவிட்டிருந்தார்கள்’ என்பதை ‘காட்சிக்கு வைத்திருந்தார்கள்’ என்றும், இன்னும் வலுவாக ‘கழுவேற்றியிருந்தார்கள்’ என்றும் புரிந்துகொள்ளலாம்; எபிரெய வினையின் மிக நேரடியான பொருள் ‘தொங்கவிடு’ என்பதாகும்.
    reason: lexical_alternative
  - marker: c
    text: கில்போவா என்பது சவுல் வீழ்ந்த மலைப்பகுதி (1 சாமுவேல் 31:8–13 பார்க்கவும்).
    reason: cross_reference
lexical_decisions:
- source_word: עַצְמוֹת
  choice: எலும்புகள்
  rationale: எபிரெயச் சொல் நேரடியாக ‘எலும்புகள்’ எனப் பொருள்படும்; அடக்கத்திற்காக மீட்டுச் செல்லும் இந்தச் சூழலிலும் அதன் தெளிவான, உருவகமற்ற பொருளைத் தக்கவைக்கிறது.
- source_word: בַּעֲלֵי יָבֵישׁ גִּלְעָד
  choice: யாபேஸ்-கீலேயாத்தின் குடிமக்கள்
  rationale: இடப்பெயருடன் வரும் בַּעֲלֵי என்பது இங்கே அந்த ஊரைச் சேர்ந்த மக்களைக் குறிக்கும் மரபுத்தொடர்; ‘குடிமக்கள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: גָּנְבוּ
  choice: திருடிக்கொண்டு வந்திருந்தார்கள்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருளான ‘திருடு’ என்பதையும், தாவீதின் செயலுக்கு முன்பே அது நிகழ்ந்தது என்பதையும் வெளிப்படுத்துகிறது.
- source_word: מֵרְחֹב
  choice: பொது வெளியில் இருந்து
  rationale: רְחֹב என்பது நகரத்தின் திறந்த பொதுவிடத்தை அல்லது சதுக்கத்தைக் குறிக்கிறது; தமிழில் ‘பொது வெளி’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: תלו/ם שם
  choice: அவற்றை அங்கே தொங்கவிட்டிருந்தார்கள்
  rationale: תלה என்பதன் நேரடிப் பொருள் ‘தொங்கவிடு’; பொதுமக்கள் பார்வைக்கு வைக்கப்பட்ட சூழலைக் காட்டினாலும், ‘கழுவேற்றினர்’ போன்ற அதிகக் குறிப்பான விளக்கத்தை உரைக்குள் புகுத்தவில்லை.
- source_word: הַכּוֹת ... אֶת שָׁאוּל
  choice: சவுலைத் தாக்கி வீழ்த்திய
  rationale: נכה என்பதன் தாக்குதல்/வீழ்த்துதல் வலிமையைப் பாதுகாக்கிறது; ‘கொன்ற’ என்று மட்டும் மொழிபெயர்த்து சவுலின் மரணம் குறித்த கதைத் தொடரின் பதற்றத்தைத் தீர்மானித்துவிடாமல் இருக்கிறது.
- source_word: בַּגִּלְבֹּעַ
  choice: கில்போவாவில்
  rationale: எபிரெயம் இடப்பெயரை மட்டும் தருகிறது; ‘மலை’ என்பதை முதன்மை உரையில் கூடுதலாகச் சேர்க்காமல் இயல்பான தமிழ் இடவேற்றுமையில் தரப்பட்டுள்ளது.
- source_word: וַיֵּלֶךְ ... וַיִּקַּח
  choice: பின்பு தாவீது புறப்பட்டுச் சென்று ... எடுத்துக்கொண்டார்
  rationale: தொடர்ச்சியான எபிரெயக் கதை வினைகளை இயல்பான தமிழில் கதை முன்னேற்றமாக வெளிப்படுத்துகிறது.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: அவன் மகன் யோனத்தான்
  rationale: யோனத்தான் சவுலின் மகன் என்பதைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் அமைப்பு.
theological_decisions:
- issue: சவுலின் மரணத்தில் பெலிஸ்தியர்களின் பங்கை எவ்வாறு கூறுவது
  choice: பெலிஸ்தியர்கள் சவுலைத் தாக்கி வீழ்த்திய
  alternative: பெலிஸ்தியர்கள் சவுலைக் கொன்ற
  rationale: மூலத்தின் נכה என்ற வினையை நெருக்கமாகப் பின்பற்றி, 1 சாமுவேல் 31-ல் சவுலின் இறுதி மரணம் விவரிக்கப்படும் விதத்தோடு உள்ள உண்மையான கதைத் tension-ஐ அமைதியாகத் தீர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், வரலாற்றுக் கதைநடைக்கு ஏற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. பெயர்கள் தமிழ் வேதாகம மரபுக்கு ஏற்ற ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; தொடர்புகளும் நிகழ்வுகளின் காலவரிசையும் காக்கப்பட்டுள்ளன.
