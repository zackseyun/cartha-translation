base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/014.yaml
  text: They buried the bones of Saul and of Jonathan his son in the land of Benjamin[a], in Zela, in the tomb of Kish his father. They did all that the king had commanded, and after that God responded to the plea for the land.
translation:
  language: ta
  text: அவர்கள் சவுலின் எலும்புகளையும் அவன் மகன் யோனத்தானின் எலும்புகளையும் பென்யமீன் நாட்டிலுள்ள சேலாவில், சவுலின் தந்தையான கீசின் கல்லறையில் அடக்கம் செய்தார்கள். அரசன் கட்டளையிட்ட அனைத்தையும் அவர்கள் செய்தார்கள். அதற்குப் பிறகு, நாட்டுக்கான மன்றாட்டுக்குக் கடவுள் பதிலளித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாட்டுக்காகக் கடவுள் மன்றாடப்பட்டார்.” எபிரெய வினைச்சொல் ஒரு மன்றாட்டுக்கு இணக்கமாகப் பதிலளிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  choice: அடக்கம் செய்தார்கள்
  rationale: קבר என்பது புதைத்தல் அல்லது அடக்கம் செய்தல் எனப் பொருள்படும். மனித எலும்புகளை மரியாதையுடன் குடும்பக் கல்லறையில் வைத்த சூழலில் ‘அடக்கம் செய்தார்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: עַצְמוֹת שָׁאוּל וִיהוֹנָתָן בְּנוֹ
  choice: சவுலின் எலும்புகளையும் அவன் மகன் யோனத்தானின் எலும்புகளையும்
  rationale: ‘எலும்புகள்’ என்ற எபிரெய மூலத்தின் உறுதியான சொல்லைத் தக்கவைக்கிறது; இருவருக்கும் உரிய எலும்புகள் என்பதைத் தமிழில் தெளிவாக வெளிப்படுத்தச் சொல் மீண்டும் கூறப்படுகிறது.
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: பென்யமீன் நாட்டிலுள்ள
  rationale: ‘பென்யமீனின் நிலப்பகுதியில்’ என்ற பிரதேசப் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: בְּצֵלָע
  choice: சேலாவில்
  rationale: צלע என்ற இடப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: בְּקֶבֶר קִישׁ אָבִיו
  choice: சவுலின் தந்தையான கீசின் கல்லறையில்
  rationale: קבר என்பதற்கு ‘கல்லறை’ பொருத்தமானது. ‘அவனுடைய தந்தை’ என்பது சவுலின் தந்தையான கீசைக் குறிக்கிறது; தமிழில் தவறான அண்மைத் தொடர்பு தோன்றாதபடி பெயர் வெளிப்படையாகக் கூறப்படுகிறது.
- source_word: וַיַּעֲשׂוּ כֹּל אֲשֶׁר צִוָּה הַמֶּלֶךְ
  choice: அரசன் கட்டளையிட்ட அனைத்தையும் அவர்கள் செய்தார்கள்
  rationale: மூலத்தின் சார்பு வாக்கிய அமைப்பையும் முழுமையையும் இயல்பான தமிழ் சொல்வரிசையில் பாதுகாக்கிறது.
- source_word: וַיֵּעָתֵר אֱלֹהִים
  choice: மன்றாட்டுக்குக் கடவுள் செவிசாய்த்தார்
  rationale: עתר என்பதன் நிஃபால் வடிவம் ஒரு மன்றாட்டுக்கு இணக்கமாகப் பதிலளித்தலைக் குறிக்கிறது. ‘செவிசாய்த்தார்’ என்பது சாதகமான பதிலை இயல்பாக உணர்த்துகிறது.
- source_word: לָאָרֶץ
  choice: நாட்டுக்காகச் செய்யப்பட்ட
  rationale: ל முன்னிடைச்சொல் இங்கு நாட்டின் நலன் அல்லது நாட்டைச் சார்ந்த வேண்டுதலைக் குறிக்கிறது.
- source_word: אַחֲרֵי כֵן
  choice: அதற்குப் பிறகு
  rationale: முந்தைய செயல்கள் நிறைவேறிய பின்பு நிகழ்ந்ததைச் சுட்டும் இயல்பான காலத் தொடர்.
theological_decisions:
- issue: וַיֵּעָתֵר אֱלֹהִים לָאָרֶץ என்பதன் பொருள்
  choice: நாட்டுக்காகச் செய்யப்பட்ட மன்றாட்டுக்குக் கடவுள் செவிசாய்த்தார்
  alternative: நாட்டுக்கான வேண்டுதலுக்குக் கடவுள் பதிலளித்தார்; நாட்டுக்காகக் கடவுள் மன்றாடப்பட்டார்
  rationale: எபிரெயத்தில் ‘மன்றாட்டு’ என்ற தனிப்பெயர்ச்சொல் இல்லாவிட்டாலும், עתר என்பதன் நிஃபால் வடிவமே மன்றாட்டுக்கு இணக்கமான பதிலைக் குறிக்கிறது. ‘நாட்டைக் குணமாக்கினார்’ என்று மூலத்தைவிட அதிகமாக விளக்காமல், அந்த வினையின் வேண்டுதல் சார்ந்த பொருளைத் தமிழில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மன்றாட்டு’ மற்றும் ‘செவிசாய்த்தார்’ ஆகியவை சாதாரண வாசகருக்குப் புரியக்கூடியவையாக இருந்து, எபிரெய வினையின் வேண்டுதல் மற்றும் சாதகமான பதில் ஆகிய இரு நுணுக்கங்களையும் காக்கின்றன.
