reference: 2 Samuel 21:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/גִּבְעֹנִ֔ים מָ֥ה אֶעֱשֶׂ֖ה לָ/כֶ֑ם וּ/בַ/מָּ֣ה אֲכַפֵּ֔ר וּ/בָרְכ֖וּ אֶת נַחֲלַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/003.yaml
  text: David said to the Gibeonites[a], “What shall I do for you, and with what shall I make atonement[b], that you may bless the inheritance of Yahweh?”
translation:
  language: ta
  text: தாவீது கிபியோனியர்களிடம், “நான் உங்களுக்கு என்ன செய்ய வேண்டும்? நீங்கள் யாவேவின் சுதந்தரத்தை ஆசீர்வதிக்கும்படி, எதைக் கொண்டு பரிகாரம் செய்ய வேண்டும்?” என்று சொன்னான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேவின் சுதந்தரத்தை ஆசீர்வதியுங்கள்.” எபிரெயத்தில் இறுதிக் கூறை முந்திய கேள்வியுடன் நேரடியாக இணைந்த கட்டளையாகவும் வாசிக்கலாம். “யாவேவின் சுதந்தரம்” என்பது யாவேவுக்குச் சொந்தமான இஸ்ரவேல் மக்களைக் குறிக்கிறது.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்று கேட்டான்
  rationale: אמר என்பதன் இயல்பான பொருள் ‘சொன்னான்’ என்றாலும், இங்கு நேரடியாக இரண்டு கேள்விகள் வருவதால் நவீன தமிழில் ‘கேட்டான்’ என்பது பேச்சுச் செயலின் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַגִּבְעֹנִים
  choice: கிபியோனியர்கள்
  rationale: கிபியோன் ஊரைச் சேர்ந்த மக்களைக் குறிக்கும் இன/குடிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: מָה אֶעֱשֶׂה לָכֶם
  choice: நான் உங்களுக்கு என்ன செய்ய வேண்டும்?
  rationale: வினாச்சொல்லுடன் வரும் நிறைவுறா வினை, தாவீது ஆலோசித்துக் கேட்கும் பொருளைத் தருகிறது; இத்தமிழாக்கம் அந்தத் திறந்த கேள்வியைப் பாதுகாக்கிறது.
- source_word: וּבַמָּה
  choice: எதைக் கொண்டு
  rationale: ב என்ற முன்னொட்டின் கருவிப் பொருளை ‘எதைக் கொண்டு’ என்று நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אֲכַפֵּר
  choice: பரிகாரம் செய்ய வேண்டும்
  rationale: כפר என்பதன் பியேல் வடிவம் இங்கு கடுமையான குற்றத்திற்கான நிவர்த்தி/பாவப்பரிகாரத்தைச் சுட்டுகிறது. ‘பரிகாரம் செய்தல்’ அதன் சமய, உடன்படிக்கை சார்ந்த கனத்தைத் தக்கவைக்கிறது.
- source_word: וּבָרְכוּ
  choice: அப்போது நீங்கள் ... ஆசீர்வதிப்பீர்கள்
  rationale: இணைப்புடன் வரும் இவ்வடிவம், தாவீது செய்யும் பரிகாரத்தின் நோக்கம் அல்லது விளைவைக் குறிக்கலாம். தமிழ் முதன்மை உரை சூழலுக்கேற்ற விளைவுப் பொருளைத் தெளிவாகக் காட்டுகிறது; நேரடி இணைப்புப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: נַחֲלַת יְהוָה
  choice: யெகோவாவின் உரிமைச் சொத்து
  rationale: נחלה என்பது ஒருவருக்குரிய பங்கு, சுதந்தரம் அல்லது உரிமைச் சொத்தைக் குறிக்கிறது; இங்கு யெகோவாவுக்குச் சொந்தமான இஸ்ரவேல் மக்களைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரை வெறும் ‘கர்த்தர்’ என்ற பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவத்தில் வழங்குகிறது.
theological_decisions:
- issue: இரத்தப்பழி மற்றும் உடன்படிக்கை மீறல் சூழலில் כפר என்பதன் பொருள்
  choice: பரிகாரம் செய்ய வேண்டும்
  alternative: ஈடுசெய்ய வேண்டும்; சமாதானப்படுத்த வேண்டும்
  rationale: இது வெறும் சமூக இழப்பீடோ மன்னிப்புக் கோருதலோ அல்ல; கடுமையான கூட்டுக் குற்றத்தை நீக்கும் நிவர்த்தியைப் பற்றியது. ‘பரிகாரம்’ அந்த இறையியல் கனத்தைப் பாதுகாக்கிறது.
- issue: וּבָרְכוּ אֶת נַחֲלַת יְהוָה என்ற இறுதிக் கூறின் தொடர்பு
  choice: 'நோக்கம்/விளைவு: ‘அப்போது நீங்கள் ... ஆசீர்வதிப்பீர்கள்’'
  alternative: 'எளிய இணைப்பு: ‘யெகோவாவின் உரிமைச் சொத்தை ஆசீர்வதியுங்கள்’'
  rationale: சூழலில், தாவீது செய்யும் நடவடிக்கையின் விளைவாக கிபியோனியர்கள் இஸ்ரவேலை ஆசீர்வதிக்க வேண்டும் என்பதே இயல்பான வாசிப்பு. எனினும் எபிரெய இணைப்பை நேரடி கட்டளையாகவும் வாசிக்க முடிவதால் அந்த வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கேள்விகள் தமிழில் தனித்தனியாகப் பிரிக்கப்பட்டுள்ளன. மூலத்தின் நோக்கம்/விளைவு மற்றும் நேரடி இணைப்பு ஆகிய இரு வாசிப்புகளும் பாதுகாக்கப்பட்டுள்ளன.
