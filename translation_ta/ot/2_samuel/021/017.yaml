base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/017.yaml
  text: But Abishai son of Zeruiah came to his aid[a], struck the Philistine, and killed him. Then David’s men swore to him, saying, “You must not go out with us to battle any longer, lest you extinguish the lamp of Israel.”
translation:
  language: ta
  text: ஆனால் செருயாவின் மகன் அபிசாய் தாவீதுக்கு உதவியாக வந்து, அந்தப் பெலிஸ்தியனைத் தாக்கிக் கொன்றான். அப்போது தாவீதின் ஆட்கள் அவரிடம் சத்தியம் செய்து, “இனி நீர் எங்களோடு போருக்குப் புறப்படக் கூடாது, இஸ்ரவேலின் விளக்கை அணைத்துவிடாதபடிக்கு” என்று கூறினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இஸ்ரவேலின் விளக்கு’ என்பதை ‘இஸ்ரவேலின் ஒளி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் ‘விளக்கு’ என்பது தாவீதின் வாழ்வும் இஸ்ரவேலின் நிலைத்தன்மையும் தொடர்புடைய உருவகமாகும்.
    reason: lexical_alternative_and_metaphorical_clarification
lexical_decisions:
- source_word: וַיַּעֲזָר לוֹ
  choice: தாவீதுக்கு உதவியாக வந்து
  rationale: עזר என்பதன் அடிப்படைப் பொருள் ‘உதவுதல்’. போரில் அபிசாய் தலையிட்டு உதவிய நிகழ்வை இயல்பான தமிழில் தெரிவிக்கிறது; ‘לוֹ’ குறிக்கும் நபர் சூழலின்படி தாவீது என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: செருயாவின் மகன் அபிசாய்
  rationale: தமிழின் இயல்பான உறவுமுறைச் சொல்லமைப்பில் பெயர்களையும் ‘மகன்’ என்ற உறவையும் தெளிவாகக் கொடுக்கிறது.
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי וַיְמִיתֵהוּ
  choice: அந்தப் பெலிஸ்தியனைத் தாக்கிக் கொன்றான்
  rationale: נכה என்பதற்கு ‘தாக்குதல்/அடித்தல்’, מות என்பதன் ஹிஃபில் வடிவிற்கு ‘கொல்லுதல்’ எனத் தனித்தனியாகப் பொருள் தந்து, தேவையற்ற மறுபடியுரைத்தலைத் தவிர்க்கிறது.
- source_word: אָז נִשְׁבְּעוּ אַנְשֵׁי דָוִד לוֹ
  choice: அப்போது தாவீதின் ஆட்கள் அவரிடம் … என்று ஆணையிட்டுச் சொன்னார்கள்
  rationale: נשבע என்பது சத்தியம் அல்லது உறுதிமொழியால் கட்டுப்படுத்துவதைச் சுட்டுகிறது. இங்கு தாவீது இனி போருக்கு வரக்கூடாது என்று அவருடைய ஆட்கள் ஆணைபெறும் வகையில் உறுதிசெய்த கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לֹא תֵצֵא עוֹד אִתָּנוּ לַמִּלְחָמָה
  choice: இனி நீர் எங்களோடு போருக்குப் புறப்படக் கூடாது
  rationale: சத்தியப்பிரமாணத்தின் சூழலில் உள்ள வலுவான தடையை ‘கூடாது’ என்பதும், தாவீதுக்குரிய மரியாதையை ‘நீர்’ என்பதும் தெளிவாகக் காட்டுகின்றன.
- source_word: וְלֹא תְכַבֶּה אֶת נֵר יִשְׂרָאֵל
  choice: இஸ்ரவேலின் விளக்கை அணைத்துவிடக் கூடாது
  rationale: כבה என்பதற்கு ‘அணைத்தல்’ என்றும் נֵר என்பதற்கு ‘விளக்கு’ என்றும் நேரடியான உருவகத்தைப் பாதுகாக்கிறது. இணைப்புச் சொல் וְלֹא-வின் வடிவத்தையும் தமிழில் இணையான தடை வாக்கியமாக வைத்துள்ளது.
theological_decisions:
- issue: தாவீதை இஸ்ரவேலின் உயிர்தாங்கும் ஒளியாகக் குறிக்கும் உருவகம்
  choice: ‘இஸ்ரவேலின் விளக்கு’ என்ற உருவகத்தை முதன்மை உரையில் அப்படியே வைத்தல்
  alternative: ‘இஸ்ரவேலின் ஒளி’ அல்லது ‘இஸ்ரவேலின் நம்பிக்கை’
  rationale: எபிரெய உரை נֵר என்ற திடமான ‘விளக்கு’ உருவகத்தைப் பயன்படுத்துகிறது. அதை விளக்கவுரையாக மாற்றாமல் பாதுகாப்பது அரசியல் மற்றும் இறையியல் சார்ந்த இலக்கிய நெருக்கத்தை நிலைநிறுத்துகிறது.
- issue: וְלֹא תְכַבֶּה என்பதன் தொடரியல் உறவு
  choice: ‘அணைத்துவிடக் கூடாது’ என்று ஒருங்கிணைந்த இரண்டாவது தடையாக மொழிபெயர்த்தல்
  alternative: ‘அணைத்துவிடாதபடிக்கு’ என்று நோக்கம் அல்லது தவிர்க்க வேண்டிய விளைவாக மொழிபெயர்த்தல்
  rationale: எபிரெயில் וְלֹא என்பதன் நேரடி ஒருங்கிணைப்பை முதன்மை உரை பாதுகாக்கிறது; சூழலின்படி அது தவிர்க்க வேண்டிய விளைவையும் உணர்த்தக்கூடும் என்பதால் அந்தச் சாத்தியம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. தாவீதிடம் அவருடைய ஆட்கள் பேசுவதால் மரியாதைப் பன்மையான ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது. எபிரெய உருவகமான ‘விளக்கு’ விளக்கவுரையாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
