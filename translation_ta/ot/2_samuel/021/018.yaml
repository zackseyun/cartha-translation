base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/018.yaml
  text: After this[a], there was again war with the Philistines at Gob, and then Sibbecai the Hushathite struck down Saph[b], who was among the descendants of Rapha.
translation:
  language: ta
  text: இதற்குப் பிறகு, கோபில் பெலிஸ்தியர்களோடு மீண்டும் போர் நடந்தது. அப்போது ஊசாத்தியனான சிபெக்காய், ராப்பாவின் வழித்தோன்றல்களில் ஒருவனான சாப்பை[a][b] வீழ்த்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 நாளாகமம் 20:4-இலுள்ள இணைச் செய்தியில் இப்பெயர் ‘சிப்பாய்’ என்று வருகிறது.
    reason: textual_variant
  - marker: b
    text: ‘ராப்பாவின் வழித்தோன்றல்களில் ஒருவன்’ என்பதற்கு மாற்றாக, ‘அரக்கனின் வழித்தோன்றல்களில் ஒருவன்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் ராப்பா என்ற ஒருவரையோ, அரக்கர் அல்லது ரெப்பாயீம் வம்சத்தையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי כֵן
  choice: இதற்குப் பிறகு
  rationale: இது இயல்பான காலத் தொடரைக் குறிக்கிறது; எபிரெயச் சொற்றொடரின் கதைநிகழ்வு வரிசையை விரிவாக்கமின்றிப் பாதுகாக்கிறது.
- source_word: וַתְּהִי עוֹד הַמִּלְחָמָה
  choice: மீண்டும் போர் நடந்தது
  rationale: עוֹד குறிக்கும் மறுபடியும் நிகழ்ந்த மோதலை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּגֹב
  choice: கோபில்
  rationale: போர் நடந்த இடத்தைக் குறிக்கும் בְּ முன்னிடைச்சொல்லைத் தமிழின் இடவேற்றுமையால் இயல்பாகத் தருகிறது.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இந்த இனக்குழுவுக்கான பரவலாக அறியப்பட்ட தமிழ்ப் பெயர்ப்பு.
- source_word: אָז
  choice: அப்போது
  rationale: அடுத்த நிகழ்வைச் சுட்டும் எபிரெயக் காலவினையுரிச்சொல்லைத் தெளிவாகக் காட்டுகிறது.
- source_word: הִכָּה
  choice: போரில் வீழ்த்தினான்
  rationale: נכה என்பதன் தாக்கி வீழ்த்தும் போர்சார் வலிமையைப் பாதுகாக்கிறது; இச்சூழலில் உயிர்க்கொல்லும் வெற்றியைக் குறிக்கக்கூடும் என்றாலும், ‘கொன்றான்’ என்று நேரடியாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: ஊசாத்தியனான சிபெக்காய்
  rationale: தனிப்பெயரையும் இன/ஊர்சார் அடையாளத்தையும் ஒலிபெயர்த்து, தமிழில் இயல்பான அடைமொழி அமைப்பில் தருகிறது.
- source_word: סַף
  choice: சாப்
  rationale: மசோரா உரையின் சַף என்ற பெயரை ஒலிபெயர்க்கிறது; இணை வசனத்திலுள்ள வேறுபட்ட பெயர்வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר בִּילִדֵי הָרָפָה
  choice: ராப்பாவின் வழித்தோன்றல்களில் ஒருவன்
  rationale: יְלִידֵי என்பதன் வம்சத்தார் அல்லது வழித்தோன்றல்கள் என்ற பொருளையும், הָרָפָה என்பதை ராப்பா என்னும் பெயராக வாசிக்கும் வாய்ப்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: הָרָפָה என்பதை ‘ராப்பா’ என்ற பெயராகவா, ‘அரக்கன்/மாபெரும் மனிதன்’ என்ற பொதுப்பெயராகவா மொழிபெயர்ப்பது
  choice: ராப்பா என்ற பெயர் அல்லது வம்சமுதல்வர் குறிப்பு
  alternative: அரக்கனின் வழித்தோன்றல்களில் ஒருவன்; ரெப்பாயீம் இனத்தைச் சேர்ந்தவன்
  rationale: ‘வழித்தோன்றல்களில்’ என்ற வம்சவழிச் சூழலில் தனிப்பெயர் வாசிப்பு இயல்பானது. ஆயினும் எபிரெய வடிவம் ‘அரக்கன்’ அல்லது ரெப்பாயீம் மரபைக் குறிக்கலாம் என்பதால் அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் மூல எபிரெய உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளன; மூலத்தின் தெளிவின்மை முதன்மை உரையில் தீர்த்துவைக்கப்படாமல் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
