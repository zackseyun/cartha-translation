  yaml_path: translation/ot/2_samuel/021/005.yaml
  text: They said to the king[a], “The man who consumed us, and who planned against us[b], so that we should be destroyed from having a place within all the territory of Israel—”
translation:
  language: ta
  text: அவர்கள் அரசனிடம், “எங்களை அழித்தொழித்தவனும், நாங்கள் அழிக்கப்படவும் இஸ்ரவேலின் எந்தப் பகுதியிலும் நாங்கள் நிலைபெற்றிருக்க முடியாதபடியும் எங்களுக்கு எதிராகத் திட்டமிட்டவனும் ஆகிய அந்த மனிதன்—[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வாக்கியம் அடுத்த வசனத்தில் தொடர்கிறது. “நிலைபெற்றிருக்க” என்பதன் நேரடிப் பொருள், “நின்றிருக்க/தங்களை நிலைநிறுத்திக்கொள்ள.” இங்கு இஸ்ரவேலில் தொடர்ந்து ஓர் இடம் பெற்றிருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּלָּנוּ
  choice: எங்களை அழித்தொழித்தவன்
  rationale: כלה என்பதன் ‘முடிவுக்குக் கொண்டுவருதல், முற்றிலும் அழித்தல்’ என்ற வலுவான பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: דִּמָּה לָנוּ
  choice: எங்களை அழிக்கத் திட்டமிட்டவன்
  rationale: இச்சூழலில் דמה என்பது ‘திட்டமிடுதல்/சூழ்ச்சி செய்தல்’ என்ற பொருளைத் தருகிறது; לָנוּ மற்றும் தொடரும் அழிவு நோக்கக் கூறு திட்டத்தின் பகைமையான இலக்கைத் தெளிவாக்குகின்றன.
- source_word: נִשְׁמַדְנוּ
  choice: எங்களை அழிக்க
  rationale: שׁמד என்பதன் நிபால் வடிவம் அழிக்கப்படுதல் அல்லது முற்றாக ஒழிக்கப்படுதல் என்பதைக் குறிக்கிறது; தமிழில் நோக்கம்/விளைவு சார்ந்த தொடராக இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: מֵהִתְיַצֵּב
  choice: நாங்கள் நிலைபெற்றிருக்க முடியாதபடி
  rationale: התייצב என்பதன் அடிப்படைப் பொருள் ‘தன்னை நிலைநிறுத்துதல்/நிலைபெறுதல்.’ இங்கு இஸ்ரவேலில் தொடர்ந்து ஓர் இடம் பெற்றிருப்பதைத் தடுக்க முயன்றதைக் குறிக்கிறது.
- source_word: בְּכָל גְּבֻל יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எந்தப் பகுதியிலும்
  rationale: גְּבוּל இங்கு எல்லைக்கோட்டை மட்டும் அல்ல, முழு ஆட்சிப்பகுதி அல்லது நிலப்பரப்பைக் குறிக்கிறது. எதிர்மறைத் தொடரில் ‘எந்தப் பகுதியிலும்’ என்பது כָל என்பதன் முழுமையான பரப்பை இயல்பாகத் தருகிறது.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: முன்னரே குறிப்பிடப்பட்ட சவுலைக் குறிக்கும் திட்டவட்டப் பெயர்ச்சொல்; நேரடிப் பேச்சில் ‘அந்த மனிதன்’ இயல்பாக உள்ளது.
