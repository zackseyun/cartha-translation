base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/002.yaml
  text: So the king called the Gibeonites and spoke to them[a]. Now the Gibeonites were not from the sons of Israel, but from the remnant of the Amorites; and the sons of Israel had sworn to them[c][b]. But Saul had sought to strike them down in his zeal for the sons of Israel and Judah.
translation:
  language: ta
  text: அரசன் கிபியோனியர்களை அழைத்து, அவர்களிடம் கூறினான். கிபியோனியர்கள் இஸ்ரவேல் மக்களிலிருந்து வந்தவர்கள் அல்ல; அவர்கள் எமோரியரில் எஞ்சியிருந்தவர்கள்[a]. இஸ்ரவேல் மக்கள் அவர்களுக்குச் சத்தியம் செய்திருந்தனர். ஆனால் சவுல், இஸ்ரவேலுக்கும் யூதாவுக்கும் ஆதரவான தன் தீவிரப் பற்றினால்[b], அவர்களை அழித்துவிட முயன்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எமோரியரில் மீதியானோர்.”
    reason: יֶתֶר என்பதன் “எஞ்சியது, மீதியானது” என்ற மாற்றுப் பொருளைத் தெரிவிக்கிறது.
  - marker: b
    text: “தீவிரப் பற்று” என்பதற்கான எபிரெயச் சொல் சூழலுக்கேற்ப “பொறாமை” என்றும் பொருள்படலாம்.
    reason: קנא என்பதன் சூழல் சார்ந்த மாற்றுப் பொருளை பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיִּקְרָא הַמֶּלֶךְ לַגִּבְעֹנִים
  choice: அரசன் கிபியோனியர்களை அழைத்து
  rationale: קרא என்பதன் இச்சூழலுக்குரிய அழைத்தல்/வரவழைத்தல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; எபிரெயத்தில் இல்லாத தாவீதின் பெயர் சேர்க்கப்படவில்லை.
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: அவர்களிடம் பேசினான்
  rationale: சொல்லுதல் என்பதே நேரடிப் பொருள்; முந்தைய ‘அழைத்து’ என்பதுடன் இயல்பாக இணைய ‘பேசினான்’ என வழங்கப்பட்டது.
- source_word: לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: இஸ்ரவேலின் மக்களில் சேர்ந்தவர்கள் அல்ல
  rationale: בני ישראל என்ற குடும்பவழி தேசியச் சொல்லாட்சியைத் தக்கவைத்தபடியே, அவர்கள் இஸ்ரவேல் மக்களினத்தைச் சேர்ந்தவர்கள் அல்ல என்ற பொருளைத் தெளிவாகக் கூறுகிறது.
- source_word: מִיֶּתֶר הָאֱמֹרִי
  choice: எமோரியர்களில் எஞ்சியிருந்தவர்கள்
  rationale: יֶתֶר என்பதன் ‘எஞ்சியது/மீதியானது’ என்ற பொருளை இயல்பாகத் தருகிறது; ‘மீதியானோர்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: נִשְׁבְּעוּ לָהֶם
  choice: அவர்களுக்கு ஆணையிட்டுக் கொடுத்திருந்தார்கள்
  rationale: முந்தியே நிகழ்ந்த உறுதிமொழியை நற்செய்திக் காலப்பின்னணியாகக் காட்டுகிறது; தமிழ் வேதாகம நடையில் ‘ஆணையிடுதல்’ சத்தியப்பிரமாணம் செய்தலைத் தெளிவாகச் சுட்டுகிறது.
- source_word: וַיְבַקֵּשׁ שָׁאוּל לְהַכֹּתָם
  choice: சவுல் ... அவர்களை அழித்துவிட முயன்றான்
  rationale: בקשׁ + infinitive நோக்கம்/முயற்சியைக் குறிக்கிறது; נכה இங்கு சாதாரணமாக அடிப்பதைவிடக் கொன்று ஒழிப்பதை நோக்கிய வன்முறையைக் குறிக்கிறது.
- source_word: בְּקַנֹּאתוֹ
  choice: கொண்ட வைராக்கியத்தால்
  rationale: קנא இங்கு இஸ்ரவேல் மற்றும் யூதாவுக்கான தீவிரப் பற்றைக் குறிக்கிறது. சொல்லின் ‘பொறாமை’ சார்ந்த சாத்தியமான நிழற்பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
theological_decisions:
- issue: בני ישראל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மக்கள் / இஸ்ரவேலின் மக்களில் சேர்ந்தவர்கள்
  alternative: இஸ்ரவேலர்
  rationale: இது தேசியக் குழுவைக் குறித்தாலும், ஒரே வசனத்தில் இருமுறை வரும் בני ישראל என்பதன் சொல் தொடர்பைத் தக்கவைக்க ‘இஸ்ரவேலின் மக்கள்’ பயன்படுத்தப்பட்டது; இயல்பான தமிழ் இலக்கணத்திற்கேற்ப முதல் இடத்தில் ‘மக்களில் சேர்ந்தவர்கள்’ என விரிக்கப்பட்டது.
- issue: קנא என்பதில் சவுலின் உந்துதல்
  choice: வைராக்கியம்
  alternative: பொறாமை அல்லது தீவிரப் பற்று
  rationale: இஸ்ரவேலுக்கும் யூதாவுக்கும் ஆதரவான தேசியத் தீவிரமே சூழலில் முன்னிலையில் உள்ளது. எனினும் எபிரெயச் சொல்லின் ஒழுக்கரீதியான இருமுனைத்தன்மை மறைக்கப்படாமல் அடிக்குறிப்பில் மாற்றுப் பொருள் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அரசன்,’ ‘ஆணையிட்டுக் கொடுத்திருந்தார்கள்,’ ‘வைராக்கியம்’ போன்ற சொற்கள் மூலத்தின் வரலாற்று மற்றும் தீவிரத் தொனியைத் தக்கவைக்கின்றன. அடிக்குறிப்பு குறிகள் அனைத்தும் உரையில் உரிய இடங்களில் இடம்பெற்றுள்ளன.
