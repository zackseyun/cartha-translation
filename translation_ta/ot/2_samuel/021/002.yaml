revisions:
- from: அப்போது அரசன் கிபியோனியர்களை அழைத்து அவர்களிடம் பேசினான். கிபியோனியர்கள் இஸ்ரவேலின் மக்களில் சேர்ந்தவர்கள் அல்ல; அவர்கள் எமோரியர்களில் எஞ்சியிருந்தவர்கள்[a]. இஸ்ரவேலின் மக்கள் அவர்களுக்கு ஆணையிட்டுக் கொடுத்திருந்தார்கள். ஆனால் சவுல், இஸ்ரவேலின் மக்களுக்காகவும் யூதாவுக்காகவும் கொண்ட வைராக்கியத்தால்[b] அவர்களை அழித்துவிட முயன்றான்.
  to: அரசன் கிபியோனியர்களை அழைத்து, அவர்களிடம் கூறினான். கிபியோனியர்கள் இஸ்ரவேல் மக்களிலிருந்து வந்தவர்கள் அல்ல; அவர்கள் எமோரியரில் எஞ்சியிருந்தவர்கள்[a]. இஸ்ரவேல் மக்கள் அவர்களுக்குச் சத்தியம் செய்திருந்தனர். ஆனால் சவுல், இஸ்ரவேலுக்கும் யூதாவுக்கும் ஆதரவான தன் தீவிரப் பற்றினால்[b], அவர்களை அழித்துவிட முயன்றான்.
