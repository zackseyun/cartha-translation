base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/009.yaml
  text: He gave them into the hand of the Gibeonites[a], and they hanged them on the mountain before Yahweh, and the seven of them fell together. They were put to death in the first days of harvest, at the beginning of the barley harvest.
translation:
  language: ta
  text: அவன் அவர்களைக் கிபியோனியர்களின் கையில் ஒப்படைத்தான். அவர்கள் யாவேக்கு முன்பாக மலையின்மேல் அவர்களைத் தொங்கவிட்டார்கள்[a]. அந்த ஏழு பேரும் ஒருசேர வீழ்ந்தார்கள். அறுவடையின் ஆரம்ப நாட்களில், அதாவது வாற்கோதுமை அறுவடை தொடங்கியபோது, அவர்கள் கொல்லப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களைக் கழுவேற்றினார்கள்,” அல்லது “அவர்களைப் பொதுமக்கள் பார்வைக்காகத் தொங்கவிட்டார்கள்.” எபிரெய வினை, பிற்காலத்தில் ‘தூக்கிலிடுதல்’ என்று குறுகிய பொருளில் கூறப்படும் முறையை மட்டுமே குறிக்காமல், உடல்களைப் பொதுக் காட்சிக்காகத் தொங்கவிடுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵם בְּיַד הַגִּבְעֹנִים
  choice: அவர்களைக் கிபியோனியர்களின் கையில் ஒப்படைத்தான்
  rationale: נתן + בְּיַד என்பது ஒருவரை மற்றொருவரின் அதிகாரத்திற்குள் ஒப்படைப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘கையில் ஒப்படைத்தான்’ என்பது அதன் அதிகார/காவல் மாற்றத்தையும் இயல்பான தமிழையும் தக்கவைக்கிறது.
- source_word: וַיֹּקִיעֻם
  choice: அவர்களைத் தொங்கவிட்டார்கள்
  rationale: יקע பொதுமக்கள் பார்வைக்கு உடலைத் தொங்கவிடுதல், கழுவேற்றுதல் அல்லது காட்சிப்படுத்துதல் ஆகியவற்றைக் குறிக்கக்கூடியது. ‘தொங்கவிட்டார்கள்’ என்பது செயலைத் தெளிவாகக் கூறினாலும் அதன் துல்லியமான முறையைத் தேவையின்றி நிர்ணயிப்பதில்லை; மாற்று நுணுக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: בָּהָר
  choice: மலையின்மேல்
  rationale: הַר என்பதன் திட்டவட்ட ஒருமை வடிவத்தையும் நிகழ்வின் இடத்தையும் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: உடன்படிக்கை மற்றும் நீதித்தீர்ப்பு சார்ந்த தெய்வீக முன்னிலையைக் குறிக்கும் சொற்றொடரைத் திறந்தவாறே வைத்திருக்கிறது; יהוה என்ற திருப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיִּפְּלוּ שבעתים יָחַד
  choice: அந்த ஏழு பேரும் ஒருசேர வீழ்ந்தார்கள்
  rationale: எழுவரின் கூட்டு மரணத்தைப் பற்றிய எபிரெய உருவகமான ‘வீழ்ந்தார்கள்’ என்பதையும் יחד என்பதன் ‘ஒருசேர’ என்ற பொருளையும் தக்கவைக்கிறது.
- source_word: הֻמְתוּ
  choice: அவர்கள் கொல்லப்பட்டார்கள்
  rationale: מות என்பதன் ஹொஃபால் வடிவம் பிறரால் மரணமடையச் செய்யப்பட்டதைக் குறிக்கிறது. நவீன தமிழில் ‘கொல்லப்பட்டார்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בִּימֵי קָצִיר בָּרִאשֹׁנִים תחלת קְצִיר שְׂעֹרִים
  choice: அறுவடையின் ஆரம்ப நாட்களில், அதாவது வாற்கோதுமை அறுவடை தொடங்கியபோது
  rationale: முதலில் பொதுவாகக் கூறப்படும் காலத்தை அடுத்த சொற்றொடர் குறிப்பாக விளக்குவதால், ‘அதாவது’ மூலம் அந்த விளக்க உறவு இயல்பான தமிழில் வெளிப்படுத்தப்படுகிறது.
theological_decisions:
- issue: יקע என்ற மரணதண்டனை/பொதுக் காட்சிப்படுத்தல் வினையின் துல்லிய முறை
  choice: முதன்மை உரையில் ‘தொங்கவிட்டார்கள்’ என்று மொழிபெயர்த்து, முறையின் தெளிவின்மையை அடிக்குறிப்பில் பாதுகாத்தல்
  alternative: ‘கழுவேற்றினார்கள்’ அல்லது ‘பொதுமக்கள் பார்வைக்கு வைத்தார்கள்’
  rationale: இது யாவேக்கு முன்பாக நிகழ்ந்த உடன்படிக்கை சார்ந்த நீதிச் செயலை விவரிக்கிறது; ஆனால் உடல்கள் எவ்வாறு தொங்கவிடப்பட்டன அல்லது காட்சிப்படுத்தப்பட்டன என்பதை எபிரெய வினை உறுதியாக நிர்ணயிக்கவில்லை. ஆகவே ஒரு குறிப்பிட்ட மரணதண்டனை முறையை உரையில் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்பின் இயல்பும் உள்ள நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கையில் ஒப்படைத்தான்’ என்ற செமித்திய மரபுத்தொடர் தமிழிலும் புரிந்துகொள்ளக்கூடியதால் பாதுகாக்கப்பட்டது. ‘யாவே’ என்பது יהוה என்ற திருப்பெயரின் ஒலிபெயர்ப்பு.
