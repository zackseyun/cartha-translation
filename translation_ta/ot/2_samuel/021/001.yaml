source:
  edition: WLC
  text: וַ/יְהִ֣י רָעָב֩ בִּ/ימֵ֨י דָוִ֜ד שָׁלֹ֣שׁ שָׁנִ֗ים שָׁנָה֙ אַחֲרֵ֣י שָׁנָ֔ה וַ/יְבַקֵּ֥שׁ דָּוִ֖ד אֶת פְּנֵ֣י יְהוָ֑ה וַ/יֹּ֣אמֶר יְהוָ֗ה אֶל שָׁאוּל֙ וְ/אֶל בֵּ֣ית הַ/דָּמִ֔ים עַל אֲשֶׁר הֵמִ֖ית אֶת הַ/גִּבְעֹנִֽים־ס־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/001.yaml
  text: There was a famine in the days of David for three years[a], year after year. And David sought the face of Yahweh, and Yahweh said, “It is because of Saul and his bloodguilty house[b], because he put the Gibeonites to death.”
translation:
  language: ta
  text: தாவீதின் நாட்களில் தொடர்ந்து மூன்று ஆண்டுகள், ஆண்டுக்கு ஆண்டு பஞ்சம் ஏற்பட்டது. தாவீது யாவேயின் முகத்தை நாடினார்[a]. யாவே, “இதற்குக் காரணம் சவுலும் இரத்தப்பழியுள்ள அவனுடைய குடும்பமும்; அவன் கிபியோனியர்களைக் கொன்றதே” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயை நாடினார்,” “யாவேயிடம் விசாரித்தார்”; சொல்லுக்குச் சொல், “யாவேயின் முகத்தை நாடினார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: பஞ்சம்
  rationale: தனிப்பட்ட பசியை அல்லாமல், நாட்டைத் தாக்கிய கடுமையான உணவுப் பற்றாக்குறையை இச்சூழல் குறிக்கிறது.
- source_word: שָׁלֹשׁ שָׁנִים שָׁנָה אַחֲרֵי שָׁנָה
  choice: தொடர்ந்து மூன்று ஆண்டுகள், ஆண்டுக்கு ஆண்டு
  rationale: எபிரெயத்தில் உள்ள ‘மூன்று ஆண்டுகள்’ என்பதையும் தொடர்ச்சியை வலியுறுத்தும் ‘ஆண்டுக்கு ஆண்டு’ என்பதையும் தக்கவைக்கிறது.
- source_word: וַיְבַקֵּשׁ ... אֶת־פְּנֵי יְהוָה
  choice: யாவேயின் முகத்தை நாடினார்
  rationale: ‘யாவேயின் முகத்தை நாடினார்’ என்ற மூலமொழி உருவகத்தைத் தக்கவைத்து, அவரிடம் வழிகாட்டுதலை விசாரித்தார் என்ற சூழல்சார் பொருளையும் உணர்த்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கெழுத்துப் பெயரின் தமிழாக்க ஒலிபெயர்ப்பு.
- source_word: אֶל שָׁאוּל וְאֶל בֵּית הַדָּמִים
  choice: சவுலினிமித்தமும், இரத்தப்பழியுள்ள அவனுடைய குடும்பத்தினிமித்தமும்
  rationale: யாவேயின் பதில் பஞ்சத்திற்கான காரணத்தைத் தெரிவிக்கிறது. ‘வீடு’ என்பது இங்கு குடும்பம் அல்லது வம்சத்தையும், ‘இரத்தங்கள்’ என்பது கொலைக்கான பழியையும் குறிக்கிறது.
- source_word: עַל אֲשֶׁר הֵמִית אֶת־הַגִּבְעֹנִים
  choice: அவன் கிபியோனியர்களைக் கொன்றுபோட்டதினிமித்தமே
  rationale: ஒருமை வினைச்சொல் சவுலை முதன்மைச் செயற்பாட்டாளராகச் சுட்டுகிறது; காரண உறவையும் தமிழ் நடையில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַגִּבְעֹנִים
  choice: கிபியோனியர்கள்
  rationale: இனக்குழுவின் பெயருக்கான தெளிவான தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் வெளிப்படுத்துகிறது.
- issue: சவுலையும் அவனுடைய குடும்பத்தையும் குறித்த காரணவாக்கியம்
  choice: பஞ்சம் சவுலினிமித்தமும் இரத்தப்பழியுள்ள அவனுடைய குடும்பத்தினிமித்தமும் வந்ததாகத் தெளிவுபடுத்துதல்
  alternative: ‘சவுலிடமும் இரத்தங்களின் வீட்டிடமும்’ என்று சொல்லுக்குச் சொல் மொழிபெயர்த்தல்
  rationale: אֶל என்ற முன்னிடைச்சொல்லின் சொற்படியான வடிவத்தைவிட, இச்சூழலில் யாவேயின் பதில் பஞ்சத்திற்கான காரணத்தை அறிவிக்கிறது. அதேவேளையில் குடும்பத்தின் இரத்தப்பழி குறித்த மூலத்தின் நீதிசார் அழுத்தம் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வேதாகம உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சி வலியுறுத்தலும் ‘முகத்தை நாடுதல்’ என்ற உருவகமும் காக்கப்பட்டுள்ளன. அடிக்குறிக் குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
