  edition: WLC
  text: וַ/תְּהִי ע֥וֹד מִלְחָמָ֖ה בְּ/גַ֑ת וַ/יְהִ֣י אִ֣ישׁ מדין וְ/אֶצְבְּעֹ֣ת יָדָי/ו֩ וְ/אֶצְבְּעֹ֨ת רַגְלָ֜י/ו שֵׁ֣שׁ וָ/שֵׁ֗שׁ עֶשְׂרִ֤ים וְ/אַרְבַּע֙ מִסְפָּ֔ר וְ/גַם ה֖וּא יֻלַּ֥ד לְ/הָ/רָפָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/020.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six and six, twenty-four in number[c][b]; he also was born to the Rapha.
translation:
  language: ta
  text: காத் நகரில் மீண்டும் போர் நடந்தது. அங்கே மிகப் பெரிய உடலமைப்புடைய ஒரு மனிதன்[a] இருந்தான். அவனுக்கு ஒவ்வொரு கையிலும் ஆறு விரல்களும் ஒவ்வொரு காலிலும் ஆறு விரல்களுமாக மொத்தம் இருபத்துநான்கு விரல்கள்[b] இருந்தன. அவனும் ராபாவுக்குப் பிறந்தவன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிகப் பெரிய மனிதன்”; சொற்சொல்லாக, “அளவுடைய மனிதன்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அவனுடைய கைகளின் விரல்களும் அவனுடைய கால்களின் விரல்களும்—ஆறு, ஆறு”; அதாவது ஒவ்வொரு கை மற்றும் காலிலும் ஆறு விரல்கள்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “ராபாவின் வம்சத்தில் பிறந்தவன்.” ‘ராபா’ என்பது பேருருவத்துடன் தொடர்புபடுத்தப்பட்ட ரெப்பாயீம் இனத்தைக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: מִלְחָמָה
  choice: போர்
  rationale: இச்சொல் பொதுவாகப் போர் அல்லது ஆயுத மோதலைக் குறிக்கிறது; மீண்டும் நிகழ்ந்த போர் என்ற சூழலுக்கு ‘போர்’ இயல்பாகப் பொருந்துகிறது.
- source_word: בְּגַת
  choice: காத் நகரில்
  rationale: ב என்ற முன்னொட்டு இங்கு நிகழ்வின் இடத்தைக் குறிக்கிறது. தமிழ் வாசகர்களுக்குத் தெளிவாக இருக்க இடப்பெயருடன் ‘நகரில்’ சேர்க்கப்பட்டது.
- source_word: אִישׁ מדין
  choice: மிகப் பெரிய உடலமைப்புடைய ஒரு மனிதன்
  rationale: இந்த அரிதான சொற்றொடர் அளவு அல்லது உடல் பருமனைச் சுட்டும் மொழிநடையாகப் புரிந்துகொள்ளப்படுகிறது. சொற்சொல்லான ‘அளவுடைய மனிதன்’ என்பதற்குப் பதிலாக இயல்பான தமிழில் பொருள் தரப்பட்டுள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֶצְבְּעֹת יָדָיו ... אֶצְבְּעֹת רַגְלָיו
  choice: ஒவ்வொரு கையிலும் ... விரல்களும் ஒவ்வொரு காலிலும் ... விரல்களும்
  rationale: எபிரெயம் ‘அவனுடைய கைகளின் விரல்கள், அவனுடைய கால்களின் விரல்கள்’ என்று கூறுகிறது. மொத்த எண்ணிக்கை இருபத்துநான்கு என்பதால் ஒவ்வொரு கை மற்றும் காலிலும் ஆறு விரல்கள் எனத் தமிழில் தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: שֵׁשׁ וָשֵׁשׁ
  choice: ஒவ்வொரு கையிலும் ஆறு ... ஒவ்வொரு காலிலும் ஆறு
  rationale: மீண்டும் சொல்லப்பட்ட ‘ஆறு, ஆறு’ என்பதும் மொத்தம் இருபத்துநான்கு என்பதும் ஒவ்வொரு கை, காலிலும் ஆறு விரல்கள் இருந்ததைக் காட்டுகின்றன.
- source_word: עֶשְׂרִים וְאַרְבַּע מִסְפָּר
  choice: மொத்தம் இருபத்துநான்கு
  rationale: எபிரெயச் சொற்றொடர் எல்லா விரல்களின் மொத்த எண்ணிக்கையைச் சுருக்கிக் கூறுகிறது; இந்தத் தமிழ் வடிவம் அதனை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: יֻלַּד לְהָרָפָה
  choice: ராபாவுக்குப் பிறந்தவன்
  rationale: ילד என்பதன் செயப்பாட்டு வடிவமும் ל முன்னொட்டும் பிறப்பு அல்லது வம்சத் தொடர்பைக் குறிக்கின்றன. הָרָפָה என்பதை விளக்கப் பெயரான ‘இராட்சதன்’ என்று மாற்றாமல், முன்னோர் அல்லது இனக்குழுவைக் குறிக்கும் பெயராக ‘ராபா’ என்று வைத்துள்ளது.
theological_decisions:
- issue: הָרָפָה என்பதன் அடையாளம்
  choice: ‘ராபா’ என்ற முன்னோர் அல்லது வம்சப் பெயராக மொழிபெயர்த்தல்
  alternative: ‘இராட்சதன்’ அல்லது ‘ரெப்பாயீம் இனத்தவன்’ என்று மொழிபெயர்த்தல்
  rationale: வசனம் உடல் அளவை மட்டும் வருணிக்காமல் பிறப்பு அல்லது வம்சத் தொடர்பைக் குறிப்பிடுகிறது. பெயரை அப்படியே வைத்திருப்பது ரெப்பாயீமுடன் இருக்கக்கூடிய தொடர்பை மறுக்காமலும், அதை மூலவசனத்தைவிட உறுதியாக்காமலும் உள்ளது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘கைவிரல்/கால்விரல்’ என்ற வேறுபாட்டைத் திணிக்காமல், தமிழில் இயல்பான ‘கை/கால் விரல்கள்’ என்ற அமைப்பு பயன்படுத்தப்பட்டது. மூலத்தின் வம்சத் தொடர்பிலுள்ள தெளிவின்மை முதன்மை உரையில் தீர்மானமாக்கப்படாமல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
