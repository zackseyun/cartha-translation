base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/013.yaml
  text: He brought up from there the bones of Saul and the bones of Jonathan his son[a], and they gathered the bones of those who had been impaled.
translation:
  language: ta
  text: அவன் அங்கிருந்து சவுலின் எலும்புகளையும், அவன் மகன் யோனத்தானின் எலும்புகளையும் மேலே கொண்டுவந்தான். கழுவேற்றப்பட்டவர்களின்[a] எலும்புகளை அவர்கள் சேகரித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூக்கிலிடப்பட்டவர்கள்”; அல்லது, “பொதுப் பார்வைக்கு வைக்கப்பட்டவர்கள்.” மரணதண்டனை நிறைவேற்றப்பட்டு, அவர்களுடைய உடல்கள் பொதுமக்கள் பார்க்கும்படி வைக்கப்பட்ட ஆண்களை எபிரெயச் சொல் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: மேலே கொண்டுவந்தான்
  rationale: עלה என்பதன் மேலே கொண்டுவருதல் என்ற திசை உணர்வையும், இச்சூழலில் எலும்புகளை அங்கிருந்து எடுத்துவரும் செயலையும் இயல்பாகக் காட்டுகிறது.
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: இடத்தைக் குறிக்கும் எபிரெயச் சொல்லின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: עַצְמוֹת
  choice: எலும்புகள்
  rationale: ‘எச்சங்கள்’ என்பதைவிட மூலச்சொல்லின் நேரடியான பொருளைத் தக்கவைக்கிறது; அடக்கச் சூழலுக்கும் பொருந்துகிறது.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: அவன் மகன் யோனத்தான்
  rationale: யோனத்தான் சவுலின் மகன் என்பதைத் தெளிவாகக் காட்டி, எபிரெய மொழியின் இணைப்புறவையும் காக்கிறது.
- source_word: וַיַּאַסְפוּ
  choice: அவர்கள் சேகரித்தார்கள்
  rationale: வினைச்சொல்லின் மூன்றாம் நபர் ஆண்பால் பன்மையை மாற்றாமல் வைத்திருக்கிறது; அடக்கத்திற்காக எலும்புகளை ஒன்றுசேர்த்தல் என்ற சூழலில் இயல்பானது.
- source_word: הַמּוּקָעִים
  choice: கழுவேற்றப்பட்டவர்கள்
  rationale: யקע என்ற சொல்லில் உள்ள மரணதண்டனைக்குப் பின் கம்பம் அல்லது மரத்தில் பொதுப் பார்வைக்கு வைக்கப்பட்ட நிலையைச் சுருக்கமாகக் காட்டுகிறது; துல்லியமான முறை உறுதியல்லாததால் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
