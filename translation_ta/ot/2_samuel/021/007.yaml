base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/007.yaml
  text: But the king spared Mephibosheth son of Jonathan[a], son of Saul, because of the oath of Yahweh that was between them, between David and Jonathan son of Saul.
translation:
  language: ta
  text: ஆனால் அரசன், சவுலின் மகனான யோனத்தானின் மகன் மேவிபோசேத்தைத் தப்பவிட்டான்; தாவீதுக்கும் சவுலின் மகனான யோனத்தானுக்கும் இடையே இருந்த யாவேயின் சத்தியத்தின் காரணமாக அவ்வாறு செய்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாவேயின் சத்தியம்’ என்பது தாவீதும் யோனத்தானும் யாவேயின் பெயரில், அல்லது யாவேயைச் சாட்சியாகக் கொண்டு, செய்த சத்தியத்தைக் குறிக்கலாம். இலக்கண ரீதியாக இதை ‘யாவே அளித்த சத்தியம்’ என்றும் புரிந்துகொள்ள முடியும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: உயிரோடு விட்டான்
  rationale: இச்சூழலில் חמל என்பது கொல்லாமல் அல்லது கொல்லப்படுவதற்காக ஒப்படைக்காமல் காப்பதைக் குறிக்கிறது. பொதுவான ‘இரக்கம் காட்டினான்’ என்பதைவிட, நிகழ்வின் தெளிவான பொருளை ‘உயிரோடு விட்டான்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: கதைச் சூழலில் இது தாவீதைக் குறித்தாலும், எபிரெய மூலத்தில் உள்ள பட்டப்பெயரையே மொழிபெயர்ப்பு தக்கவைக்கிறது.
- source_word: מְפִיבֹשֶׁת
  choice: மேவிபோசேத்
  rationale: தனிப்பெயர் நவீனத் தமிழில் வாசிக்க ஏற்ற வகையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן יְהוֹנָתָן בֶּן שָׁאוּל
  choice: சவுலின் மகன் யோனத்தானின் மகனான
  rationale: எபிரெய மூலத்தின் தலைமுறை உறவை முழுமையாகப் பாதுகாத்து, தமிழில் இயல்பான உறவுமுறை வரிசையில் வழங்குகிறது.
- source_word: עַל שְׁבֻעַת יְהוָה
  choice: யாவேயின் ஆணை ... இருந்ததால்
  rationale: עַל இங்கு அரசனின் செயலுக்கான காரணத்தைச் சுட்டுகிறது. שְׁבֻעַת יְהוָה என்பதன் அமைப்பை ‘யாவேயின் ஆணை’ என்று நேரடியாகத் தக்கவைத்து, அந்த ஆணையின் துல்லிய இயல்பை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயர், ஒரு பட்டப்பெயரால் மாற்றப்படாமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֲשֶׁר בֵּינֹתָם ... בֵּין דָּוִד וּבֵין יְהוֹנָתָן
  choice: தாவீதுக்கும் ... யோனத்தானுக்கும் இடையே ... இருந்தது
  rationale: ஆணை இரு தரப்பினருக்கு இடையே இருந்தது என்ற உறவுநிலையை, தமிழின் இயல்பான இணை அமைப்பில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘யாவேயின் ஆணை’ என்பதன் பொருள்
  choice: தாவீதும் யோனத்தானும் யாவேயின் பெயரில் அல்லது அவரைச் சாட்சியாகக் கொண்டு செய்த ஆணையாக இருக்கலாம் என்ற பொருளைத் திறந்துவைத்தல்
  alternative: யாவே தாமே அளித்த ஆணை
  rationale: שְׁבֻעַת יְהוָה என்ற தொடர் இலக்கண ரீதியாக இருவகையில் புரிந்துகொள்ளப்படலாம். கதைச் சூழல் மனிதர்கள் யாவேயின் முன்னிலையில் செய்த ஆணையைச் சுட்டினாலும், முதன்மை உரை அத்தெளிவின்மையைத் தீர்த்துவிடாமல் மூல அமைப்பைப் பாதுகாக்கிறது.
- issue: ‘அரசன்’ என்பவர் யார்
  choice: தாவீது
  alternative: மொழிபெயர்ப்பில் தாவீது என்று நேரடியாகப் பெயரிடுதல்
  rationale: சூழல் அரசன் தாவீது என்பதைத் தெளிவாக்குகிறது; இருப்பினும் எபிரெய உரை பயன்படுத்தும் ‘அரசன்’ என்ற பட்டப்பெயரே மொழிபெயர்ப்பில் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வம்ச உறவு தமிழுக்கேற்ற வரிசையில் அமைக்கப்பட்டாலும், மூலத்திலுள்ள இரு தலைமுறைகளும் வெளிப்படையாகத் தக்கவைக்கப்பட்டுள்ளன.
