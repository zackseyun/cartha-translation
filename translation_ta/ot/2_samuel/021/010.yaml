base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/010.yaml
  text: Then Rizpah the daughter of Aiah took sackcloth and spread it out for herself on the rock[a], from the beginning of harvest until water was poured on them from the heavens. And she did not allow the birds of the sky to rest on them by day, nor the wild animals of the field by night.
translation:
  language: ta
  text: அப்போது ஆயாவின் மகள் ரிஸ்பா சாக்குத்துணியை எடுத்துத் தனக்காகப் பாறையின்மேல் விரித்தாள். அறுவடை தொடங்கிய காலத்திலிருந்து வானத்திலிருந்து அவர்கள்மேல் நீர் ஊற்றப்படும்வரை[a], பகலில் வானத்துப் பறவைகள் அவர்கள்மேல் இறங்கவும், இரவில் காட்டு விலங்குகள் அவர்களிடம் வரவும் அவள் விடவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வானத்திலிருந்து அவர்கள்மேல் மழை பெய்யும்வரை.” எபிரெயில் இன்னும் நேரடியாக, “வானத்திலிருந்து அவர்கள்மேல் நீர் ஊற்றப்படும்வரை” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׂק
  choice: துக்கவுடை
  rationale: שַׂק என்பது துக்கம் அனுசரிக்கப் பயன்படுத்தப்பட்ட முரட்டுத் துணியைக் குறிக்கிறது. வெறும் ‘சாக்கு’ என்பதைவிட அதன் சூழல்சார் பொருளை ‘துக்கவுடை’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַתַּטֵּהוּ לָהּ אֶל הַצּוּר
  choice: பாறையின்மேல் தனக்காக அதை விரித்தாள்
  rationale: נטה இங்கு துணியை விரித்தல் அல்லது நீட்டியமைத்தலைக் குறிக்கிறது; לָהּ என்பதிலுள்ள தனக்கான பயனையும், אֶל־הַצּוּר என்பதின் இடப்பொருளையும் இந்த மொழிபெயர்ப்பு காக்கிறது.
- source_word: הַצּוּר
  choice: பாறை
  rationale: צוּר என்பதன் நேரடிப் பொருள் ‘பாறை’; மரணதண்டனை நிறைவேற்றப்பட்ட இடம் போன்ற ஊகத்தை உரைக்குள் சேர்க்கவில்லை.
- source_word: מִתְּחִלַּת קָצִיר
  choice: அறுவடை தொடங்கிய காலத்திலிருந்து
  rationale: எபிரெய உரை எந்தப் பயிரின் அறுவடை என்று குறிப்பிடாததால், ‘வாற்கோதுமை’ போன்ற விளக்கத்தைச் சேர்க்காமல் பொதுவாகவே மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַד נִתַּךְ מַיִם עֲלֵיהֶם מִן הַשָּׁמָיִם
  choice: வானத்திலிருந்து அவர்கள்மேல் தண்ணீர் பொழியும்வரை
  rationale: נתך என்பதன் ‘ஊற்றப்படுதல்/பொழிதல்’ என்ற உருவகத்தைத் தக்கவைத்து, ‘மழை’ என்ற பொருளை முதன்மை உரையில் மட்டும் உறுதிப்படுத்தாமல் மொழிபெயர்க்கிறது.
- source_word: עוֹף הַשָּׁמַיִם
  choice: வானத்துப் பறவைகள்
  rationale: இது பறவைகளுக்கான வழக்கமான எபிரெயச் சொற்றொடர்; தமிழில் இயல்பாகவும் மூல உருவகத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: לָנוּחַ עֲלֵיהֶם
  choice: அவர்கள்மேல் அமர
  rationale: נוח இச்சூழலில் பறவைகள் வந்து இறங்கி அமர்வதைக் குறிக்கிறது; ‘அமர’ என்பது தெளிவான இயல்பான தமிழ்.
- source_word: חַיַּת הַשָּׂדֶה
  choice: காட்டு விலங்குகள்
  rationale: இந்தச் சொற்றொடர் மனிதர் வளர்க்காத நிலவாழ் விலங்குகளைக் குறிக்கிறது; ‘காட்டு விலங்குகள்’ நவீன தமிழில் தெளிவானது.
- source_word: יוֹמָם ... לָיְלָה
  choice: பகலில் ... இரவில்
  rationale: எபிரெயிலுள்ள நேர மாறுபாட்டையும் வாக்கியத்தின் இணைநடையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וְלֹא נָתְנָה
  choice: அவள் விடவில்லை
  rationale: נתן + வினையெச்சம் இங்கு அனுமதித்தல் என்ற வழக்குப் பொருளைக் கொண்டுள்ளது; தமிழில் ‘விடவில்லை’ இயல்பாக அந்தப் பொருளைத் தருகிறது.
theological_decisions:
- issue: காட்டு விலங்குகளோடு தொடர்புடைய விடுபட்ட வினைச்சொல்
  choice: அவர்களை நெருங்கவும் அவள் விடவில்லை
  alternative: காட்டு விலங்குகளையும் இரவில் [அவர்கள்மேல் அமர] விடவில்லை
  rationale: இரண்டாம் கூறில் வினை எபிரெயில் வெளிப்படையாக இல்லை; முதல் கூறிலுள்ள ‘அனுமதிக்கவில்லை’ தொடர்கிறது. ஆனால் ‘அமர’ என்பது விலங்குகளுக்கு இயல்பற்றதால், உடல்களைத் தாக்குவதற்காக நெருங்குதல் என்ற சூழல்சார் பொருள் இயல்பான தமிழில் தரப்பட்டுள்ளது; புதிய தெய்வீக விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘துக்கவுடை’ என்பது சாக்குத்துணியின் துக்கச் சூழலைத் தெளிவாக்குகிறது. மூலத்தில் உள்ள நீர் பொழியும் உருவகம் முதன்மை உரையில் காக்கப்பட்டு, ‘மழை’ என்ற இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
