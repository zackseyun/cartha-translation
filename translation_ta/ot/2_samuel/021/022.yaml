source:
  edition: WLC
  text: אֶת אַרְבַּ֥עַת אֵ֛לֶּה יֻלְּד֥וּ לְ/הָ/רָפָ֖ה בְּ/גַ֑ת וַ/יִּפְּל֥וּ בְ/יַד דָּוִ֖ד וּ/בְ/יַ֥ד עֲבָדָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/022.yaml
  text: These four were born to the Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: ta
  text: இந்த நால்வரும் காத் நகரத்தில் ராபாவுக்குப் பிறந்தவர்கள்[a]. அவர்கள் தாவீதின் கையாலும் அவனுடைய பணியாளர்களின் கையாலும் வீழ்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ராபா’ என்பதற்குப் பதிலாக, ‘அந்தப் பேருருவன்’ அல்லது ‘ரெபாயீம்’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் காத் நகரத்தோடு தொடர்புடைய பேருருவ மரபின் வழித்தோன்றலைக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: אַרְבַּעַת אֵלֶּה
  choice: இந்த நால்வரும்
  rationale: எபிரேய எண்ணிக்கை–சுட்டுப்பெயர் அமைப்பை இயல்பான நவீனத் தமிழில் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘மனிதர்கள்’ என்பதைச் சேர்க்கவில்லை.
- source_word: יֻלְּדוּ
  choice: பிறந்தவர்கள்
  rationale: இங்கு பிறப்பையும் வழித்தோன்றலையும் குறிக்கும் செயப்பாட்டு வடிவம்; தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְהָרָפָה
  choice: ராபாவுக்கு
  rationale: ராபா என்பது ஒரு மூதாதை, பட்டப்பெயர் அல்லது குலக் குறிப்பு என்ற தெளிவின்மையைத் தீர்த்துவிடாமல் எபிரேய வடிவைப் பெயராகப் பாதுகாக்கிறது.
- source_word: בְּגַת
  choice: காத் நகரத்தில்
  rationale: இடத்தைக் குறிக்கும் சொல்லைத் தெளிவான தமிழில் தருகிறது; ‘நகரத்தில்’ என்பது காத் என்ற இடப்பெயரை வாசகர் எளிதில் புரிந்துகொள்ள உதவுகிறது.
- source_word: וַיִּפְּלוּ
  choice: வீழ்ந்தார்கள்
  rationale: போரில் கொல்லப்பட்டதைக் குறிக்கும் சூழலிலும், மூலத்தின் ‘விழுதல்’ உருவகத்தையும் காக்கிறது.
- source_word: בְיַד
  choice: கையால்
  rationale: செயலை நிறைவேற்றியவரைக் குறிக்கும் எபிரேய மொழிவழக்கைத் தமிழிலும் புரியக்கூடிய வகையில் பாதுகாக்கிறது.
- source_word: עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள்
  rationale: அரச அல்லது படைச் சேவையில் இருந்தவர்களைக் குறிக்கக்கூடிய சொல்லை நேரடியாகவும், ‘அடிமைகள்’ என மிகையாகக் குறுக்காமலும் தருகிறது.
theological_decisions:
- issue: הָרָפָה என்பதன் அடையாளம்
  choice: மூல வடிவத்தைப் பெயராகக் காத்து ‘ராபா’ என்று வழங்குதல்
  alternative: ‘அரக்கன்’, ‘ரெபாயீமியர்’ அல்லது ‘ராபா குலம்’ என்று பொருள் தீர்த்தல்
  rationale: இவ்வசனம் காத் நகரத்தோடு தொடர்புடைய பேருருவ மரபின் நால்வரைச் சுருக்கமாகக் குறிப்பிடுகிறது. எபிரேயச் சொல் தனிநபர், குல மூதாதை அல்லது பேருருவ மரபைக் குறிக்கலாம்; ஆகவே பிரதான உரை அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; எளிமையான, கண்ணியமான வேதாகம நடை. ‘கையால்’ மற்றும் ‘வீழ்ந்தார்கள்’ ஆகியவை மூலத்தின் உருவகங்களைப் பாதுகாக்கின்றன; அடிக்குறிப்பு ராபா/ரெபாயீம் குறித்த உண்மையான சொற்பொருள் தெளிவின்மையை வெளிப்படுத்துகிறது.
