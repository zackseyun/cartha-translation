  text: וַ/תְּהִי ע֧וֹד הַ/מִּלְחָמָ֛ה בְּ/ג֖וֹב עִם פְּלִשְׁתִּ֑ים וַ/יַּ֡ךְ אֶלְחָנָן֩ בֶּן יַעְרֵ֨י אֹרְגִ֜ים בֵּ֣ית הַלַּחְמִ֗י אֵ֚ת גָּלְיָ֣ת הַ/גִּתִּ֔י וְ/עֵ֣ץ חֲנִית֔/וֹ כִּ/מְנ֖וֹר אֹרְגִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/019.yaml
  text: And there was again war at Gob with the Philistines[a], and Elhanan son of Jaare-oregim the Bethlehemite struck down Goliath the Gittite[b], and the shaft of his spear was like a weaver’s beam.
translation:
  language: ta
  text: பெலிஸ்தியர்களோடு கோபில் மீண்டும் போர் நடந்தது. அப்போது யாரே-ஒரெகிமின் மகனும் பெத்லகேமியனுமான எல்ஹானான், கித்தியனான கோலியாத்தை[a] வீழ்த்தினான். கோலியாத்தின் ஈட்டித்தண்டு நெசவாளரின் தறிக்கம்பத்தைப் போல் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '1 நாளாகமம் 20:5 வேறுபட்ட வாசகத்தைக் கொண்டுள்ளது: எல்ஹானான் கோலியாத்தின் சகோதரனான லக்மியைக் கொன்றதாக அது கூறுகிறது. இங்குள்ள சாமுவேல் உரை கடினமான அல்லது சிதைந்த வாசகத்தைப் பாதுகாத்திருக்கலாம் என்று பலர் கருதி, இதை நாளாகம வாசகத்துடன் ஒத்திசைக்கின்றனர். மேலும், ‘யாரே-ஒரெகிம்’ என்ற எபிரெயத் தந்தைப்பெயர் கடினமானது; வசனத்தின் இறுதியிலுள்ள ‘ஒரெகிம்’ (‘நெசவாளர்கள்’) என்பது இங்கும் தவறுதலாக மீண்டும் எழுதப்பட்டிருக்கலாம் என்று சிலர் கருதுகின்றனர்.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּ/ג֖וֹב
  choice: கோபில்
  rationale: בְ என்னும் முன்னொட்டு போரின் இடத்தைக் குறிக்கிறது; கோப் என்பது இடப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַ/יַּ֡ךְ
  choice: வீழ்த்தினான்
  rationale: נכה போர்ச் சூழலில் தாக்கி வீழ்த்துதல் அல்லது கொல்லுதல் எனப் பொருள்படலாம்; ‘வீழ்த்தினான்’ அதன் போர்சார் வலிமையைத் தக்கவைத்துக்கொண்டு, வினையின் பொருளைத் தேவையின்றி மிகத் துல்லியப்படுத்தாமல் தருகிறது.
- source_word: יַעְרֵ֨י אֹרְגִ֜ים
  choice: யாரே-ஒரெகிம்
  rationale: மசோரா உரையில் உள்ள கடினமான கூட்டுப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; நாளாகமத்துடன் ஒத்திசைக்கும்படி மூல உரை திருத்தப்படவில்லை.
- source_word: בֵּ֣ית הַלַּחְמִ֗י
  choice: பெத்லகேமைச் சேர்ந்த
  rationale: எபிரெய வடிவின் ஊர்சார் அடையாளத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵ֚ת גָּלְיָ֣ת הַ/גִּתִּ֔י
  choice: கித்தியனான கோலியாத்தை
  rationale: மசோரா உரை கோலியாத்தையே நேரடி செயப்படுபொருளாகக் குறிப்பிடுகிறது; மாற்று வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְ/עֵ֣ץ חֲנִית֔/וֹ
  choice: கோலியாத்தின் ஈட்டித்தண்டு
  rationale: עֵץ என்பதன் சொற்பொருள் ‘மரம்’; ஈட்டியின் மரப்பகுதியைத் தமிழில் இயல்பாக ‘ஈட்டித்தண்டு’ எனலாம். எபிரெய ஆண்பால் ஒருமைச் சுட்டுப்பெயர் இலக்கணப்படி அண்மையில் வரும் கோலியாத்தைக் குறிக்கிறது என்பதால், தெளிவுக்காகப் பெயர் மீண்டும் கூறப்பட்டுள்ளது.
- source_word: כִּ/מְנ֖וֹר אֹרְגִֽים
  choice: நெசவாளரின் பாவுமரத்தைப் போல
  rationale: מְנוֹר אֹרְגִים என்பது நெசவுத் தறியின் கனமான பாவுமரத்தைக் குறிக்கிறது; ஈட்டித்தண்டின் பருமனை விளக்கும் உவமை தமிழில் தெளிவாகத் தரப்படுகிறது.
theological_decisions:
- issue: தாவீது கோலியாத்தைக் கொன்றதாகக் கூறும் 1 சாமுவேல் 17 மற்றும் 1 நாளாகமம் 20:5 இன் இணை வாசகத்துடனான வெளிப்படையான முரண்பாடு
  choice: மசோரா உரையின் வாசகத்தையே முதன்மை உரையில் தக்கவைத்து, எல்கானான் கித்தியனான கோலியாத்தை வீழ்த்தினான் என்று மொழிபெயர்த்தல்
  alternative: ‘எல்கானான் கோலியாத்தின் சகோதரனான லக்மியை வீழ்த்தினான்’ என்று 1 நாளாகமம் 20:5 உடன் ஒத்திசைத்தல்
  rationale: கொடுக்கப்பட்ட எபிரெய மூல உரை கோலியாத்தையே நேரடியாகப் பெயரிடுகிறது. உரையிலுள்ள உண்மையான பதற்றத்தை மறைத்து ஒத்திசைக்காமல், மாற்று வாசகம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. கடினமான மசோரா வாசகம் ஒத்திசைக்கப்படாமல் முதன்மை உரையில் பாதுகாக்கப்பட்டு, தொடர்புடைய இரு உரைச்சிக்கல்களும் ஒரே அடிக்குறிப்பில் சுருக்கமாக விளக்கப்பட்டுள்ளன.
