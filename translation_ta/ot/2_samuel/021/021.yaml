  source_fidelity: 'மூல எபிரெய உரையின் வரிசையும் பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: அவன் இஸ்ரவேலைப் பழித்து/சவாலிட்டான்; பின்னர் தாவீதின் சகோதரனாகிய சிமெயியின் மகன் யோனத்தான் அவனைத் தாக்கி வீழ்த்தினான். «அடித்து வீழ்த்தினான்» என்பது נכה என்ற வினைச்சொல்லின் போர்ச்சூழல் வலிமையை வெளிப்படுத்துகிறது; அதைத் தேவையின்றி வெளிப்படையாக ‘கொன்றான்’ எனக் குறிப்பதில்லை.'
