translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய போர்ச் சூழலின் தீவிரத்தை வெளிப்படுத்த ‘இகழ்ந்து சவால் விட்டான்’ என்றும், נכה என்பதன் செயற்படிமத்தைப் பாதுகாக்க ‘அடித்து வீழ்த்தினான்’ என்றும் வழங்கப்பட்டது. உரைவேறுபாட்டுக்கான குறியீடு அது சார்ந்த ‘சிமெயி’ என்ற பெயருக்குப் பின்பே வைக்கப்பட்டது.
