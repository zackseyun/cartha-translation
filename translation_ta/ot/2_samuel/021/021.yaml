base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/021.yaml
  text: And he defied Israel[a], and Jonathan the son of Shimei, David’s brother, struck him down.
translation:
  language: ta
  text: அவன் இஸ்ரவேலை இகழ்ந்து சவால் விட்டான். அப்போது தாவீதின் சகோதரனான சிமெயியின்[a] மகன் யோனத்தான் அவனை அடித்து வீழ்த்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளும் 1 நாளாகமம் 20:7-இல் உள்ள இணையான பகுதியும் ‘சிமெயி’ என்பதற்குப் பதிலாக ‘சிமெயா’ அல்லது ‘சிமேயா’ என்று வாசிக்கின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: וַיְחָרֵף
  choice: இகழ்ந்து சவால் விட்டான்
  rationale: חרף என்பது போர்ச் சூழலில் வெறும் கேலி அல்ல; அவமதித்துப் பகைமையுடன் சவால் விடுவதைக் குறிக்கிறது. இரு அம்சங்களையும் இயல்பான தமிழில் வெளிப்படுத்த இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை
  rationale: மூலத்தில் இஸ்ரவேல் ஒரு கூட்டு தேசிய அலகாக நேரடிச் செயப்படுபொருளாக வருகிறது; அதையே தமிழில் பாதுகாக்கிறது.
- source_word: וַיַּכֵּהוּ
  choice: அவனை அடித்து வீழ்த்தினான்
  rationale: נכה அடிப்பதைக் குறிக்கிறது; இப்போர்ச் சூழலில் அது உயிரைப் பறிக்கும் தாக்குதலை உணர்த்துகிறது. ‘அடித்து வீழ்த்தினான்’ என்பது மூல உருவகத்தைப் பாதுகாத்து முடிவையும் இயல்பாக உணர்த்துகிறது.
- source_word: יְהוֹנָתָן
  choice: யோனத்தான்
  rationale: எபிரெய தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֶּן שמעי
  choice: சிமெயியின் மகன்
  rationale: கொடுக்கப்பட்டுள்ள எபிரெய மெய்யெழுத்து வடிவமான שמעי-ஐப் பின்பற்றுகிறது; வேறுபட்ட வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲחִי דָוִד
  choice: தாவீதின் சகோதரனான
  rationale: ‘தாவீதின் சகோதரன்’ என்ற உறவைக் காத்து, சிமெயியை அடையாளப்படுத்தும் இயல்பான தமிழ் தொடராக அமைக்கப்பட்டது.
