base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/003.yaml
  text: Then the king said[a], “Is there still anyone left of the house of Saul, that I may show him the kindness of God?” Ziba said to the king, “There is still a son of Jonathan[b], crippled in his feet.”
translation:
  language: ta
  text: அப்போது அரசன், “சவுலின் குடும்பத்தில் இன்னும் யாராவது எஞ்சியிருக்கிறார்களா? அவருக்கு நான் கடவுளின் தயவைக் காட்ட விரும்புகிறேன்” என்றான். சீபா அரசனிடம், “யோனத்தானுக்கு இன்னும் ஒரு மகன் இருக்கிறார்; அவர் கால்கள் ஊனமுற்றவர்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கால்களில் முடமானவர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֶפֶס עוֹד אִישׁ
  choice: இன்னும் யாராவது எஞ்சியிருக்கிறார்களா?
  rationale: אֶפֶס உடன் வரும் கேள்வி, எவராவது இன்னும் உயிருடன் அல்லது குடும்பத்தில் எஞ்சியுள்ளார்களா என்று விசாரிக்கிறது. எதிர்மறை வடிவத்தைச் சொற்சொல்லாகப் பின்பற்றாமல், இயல்பான தமிழில் அதன் கேள்விப் பொருளைத் தருகிறது.
- source_word: לְבֵית שָׁאוּל
  choice: சவுலின் குடும்பத்தில்
  rationale: בֵּית இங்கு கட்டிடத்தைக் குறிக்காமல் குடும்ப மரபை அல்லது வம்சத்தைச் சுட்டுகிறது; ‘குடும்பம்’ சாதாரண நவீன தமிழில் இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְאֶעֱשֶׂה עִמּוֹ
  choice: அவருக்கு நான் ... காட்ட வேண்டும்
  rationale: חֶסֶד உடன் עשׂה வரும்போது தமிழில் ‘காட்டுதல்’ இயல்பான இணைச்சொல். முதல் நபரின் நோக்கம் அல்லது விருப்பத்தை ‘வேண்டும்’ வெளிப்படுத்துகிறது.
- source_word: חֶסֶד אֱלֹהִים
  choice: கடவுளின் பேரன்பு
  rationale: חֶסֶד என்பது அன்பு, இரக்கம், உறுதியான பற்றுறுதி ஆகியவற்றை உள்ளடக்கிய செறிவான சொல். ‘பேரன்பு’ அதன் அருளும் உறுதியும் கலந்த நேர்மறை வலிமையை இயல்பாகத் தருகிறது; אֱלֹהִים என்ற மரபுத்தொடரின் தெளிவின்மையை ‘கடவுளின்’ என்று காக்கிறது.
- source_word: עוֹד בֵּן לִיהוֹנָתָן
  choice: யோனத்தானுக்கு இன்னும் ஒரு மகன் இருக்கிறார்
  rationale: யோனத்தானின் மகன் ஒருவர் இன்னும் எஞ்சியிருக்கிறார் என்ற எபிரெய வலியுறுத்தலை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: נְכֵה רַגְלָיִם
  choice: இரு கால்களிலும் ஊனமுற்றவர்
  rationale: רַגְלָיִם இருமை வடிவில் கால்களைக் குறிக்கிறது; נְכֵה அவரது நடமாட்டத்தைப் பாதித்த உடற்குறைபாட்டைச் சொல்கிறது. மனித மரியாதையைப் பேணும் தற்போதைய தமிழில் நபரை முன்னிறுத்தி மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: חֶסֶד אֱלֹהִים என்பதன் உறவு மற்றும் பொருள்
  choice: கடவுளின் பேரன்பு
  alternative: கடவுளின் உடன்படிக்கைப் பற்றுறுதி; கடவுளுக்கேற்ற பேரன்பு
  rationale: இந்த எபிரெயத் தொடர் கடவுளிடமிருந்து வரும் அன்பையோ, கடவுளின் பண்பை ஒத்த அன்பையோ, கடவுளுக்கு முன்பாக உறுதிசெய்யப்பட்ட பற்றுறுதியையோ குறிக்கக்கூடும். பிரதான உரை மரபுத்தொடரைத் திறந்தவையாக வைத்திருக்கிறது; எந்த ஒரு இறையியல் விளக்கத்தையும் மட்டும் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. உடற்குறைபாட்டை இழிவுபடுத்தாத நபர்-முன்னிலைச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டுள்ளது. חֶסֶד אֱלֹהִים என்பதிலுள்ள உரிமை, பண்பு, உடன்படிக்கைப் பற்றுறுதி ஆகிய சாத்தியங்கள் அளவுக்கு மீறித் தீர்மானிக்கப்படவில்லை.
