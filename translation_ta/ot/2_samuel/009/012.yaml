base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/012.yaml
  text: Mephibosheth had a young son[a], and his name was Mica[b]. And all who lived in the house of Ziba were servants to Mephibosheth.
translation:
  language: ta
  text: மேவிபோசேத்துக்கு ஒரு இளம் மகன் இருந்தான்; அவன் பெயர் மீகா. சீபாவின் வீட்டில் குடியிருந்த அனைவரும் மேவிபோசேத்துக்குப் பணியாளர்களாக இருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பணியாளர்கள்” என்பதற்கான எபிரெயச் சொல், சூழலைப் பொறுத்து “அடிமைகள்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/מְפִיבֹשֶׁת
  choice: மேவிபோசேத்துக்கு ... இருந்தான்
  rationale: לְ உடன் வரும் எபிரெய உடைமை/இருத்தல் மரபுத்தொடரை இயல்பான தமிழில் ‘மேவிபோசேத்துக்கு ... இருந்தான்’ என்று மொழிபெயர்க்கிறது; தொடக்க וְ கதை ஓட்டத்தில் இயல்பாக உட்பொதிக்கப்படுகிறது.
- source_word: בֵּן קָטָן
  choice: ஒரு சிறுவயது மகன்
  rationale: קָטָן இங்கு மகனின் இளவயதைக் குறிக்கிறது. ‘சிறுவயது மகன்’ என்பது ‘சிறிய மகன்’ என்பதில் ஏற்படக்கூடிய உடலளவு அல்லது வரிசைமுறைப் பொருள் குழப்பத்தைத் தவிர்க்கிறது.
- source_word: וּ/שְׁמ֣/וֹ מִיכָא
  choice: அவன் பெயர் மீகா
  rationale: பெயரை அடையாளப்படுத்தும் எளிய எபிரெய வாக்கிய அமைப்பைத் தெளிவாகப் பேணுகிறது; מִיכָא என்பது ‘மீகா’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְ/כֹל מוֹשַׁב בֵּית צִיבָא
  choice: சீபாவின் வீட்டில் குடியிருந்த அனைவரும்
  rationale: מוֹשַׁב என்பதன் குடியிருப்பு சார்ந்த பொருளையும், கூட்டாகக் குறிக்கப்படும் மக்களையும் வெளிப்படையாகவும் இயல்பாகவும் எடுத்துரைக்கிறது.
- source_word: עֲבָדִים
  choice: பணியாளர்கள்
  rationale: עֲבָדִים சூழலைப் பொறுத்து பணியாளர்கள் அல்லது அடிமைகள் எனப் பொருள்படலாம். இங்கு வீட்டாரின் சேவை உறவு முன்னிலைப்படுவதால் ‘பணியாளர்கள்’ முதன்மை உரையில் இயல்பானது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לִ/מְפִיבֹשֶׁת
  choice: மேவிபோசேத்துக்குப்
  rationale: לְ குறிக்கும் சேவைத் தொடர்பை ‘மேவிபோசேத்துக்குப் பணியாளர்கள்’ என்ற இயல்பான தமிழ்த் தொடரால் தெரிவிக்கிறது; உரிமை அல்லது பதவிநிலையை தேவையின்றி மிகைப்படுத்தவில்லை.
