translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெய உடைமை மரபுத்தொடர் இயல்பான தமிழாக மாற்றப்பட்டாலும், குடியிருப்பு மற்றும் சேவைத் தொடர்புகள் மூலத்திற்கு நெருக்கமாகப் பேணப்பட்டுள்ளன. வழங்கப்பட்ட ஆங்கில அடிக்குறிப்பு a வசனத்தின் முதல் பாதியுடன் பொருந்தாமல் இருந்ததால் அது ஏற்கப்படவில்லை; עֲבָדִים என்பதிலுள்ள உண்மையான சொற்பொருள் மாற்று மட்டும் [a] ஆகச் சேர்க்கப்பட்டது.
