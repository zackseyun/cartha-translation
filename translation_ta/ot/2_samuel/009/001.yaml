source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד הֲ/כִ֣י יֶשׁ ע֔וֹד אֲשֶׁ֥ר נוֹתַ֖ר לְ/בֵ֣ית שָׁא֑וּל וְ/אֶעֱשֶׂ֤ה עִמּ/וֹ֙ חֶ֔סֶד בַּ/עֲב֖וּר יְהוֹנָתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/001.yaml
  text: David said[a], “Is there still anyone left of the house of Saul, that I may show kindness to him for Jonathan’s sake?”
translation:
  language: ta
  text: தாவீது, “சவுலின் குடும்பத்தில் இன்னும் எவராவது எஞ்சியிருக்கிறாரா? யோனத்தானின் பொருட்டு அவருக்குத் தயவு[a] காட்டும்படி?” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மையுள்ள அன்பு” அல்லது “உடன்படிக்கைக்கு உண்மையான அன்பு.” எபிரெயச் சொல் வெறும் உணர்ச்சியை மட்டும் அல்லாமல், உறவுக்கு உண்மையாக வெளிப்படும் தயவையும் அன்பையும் அடிக்கடி குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்று கேட்டார்
  rationale: אמר என்பது பொதுவாக ‘சொன்னார்’ என்றாலும், தொடர்ந்து நேரடிக் கேள்வி வருவதால் நவீன தமிழில் ‘என்று கேட்டார்’ இயல்பாக உள்ளது.
- source_word: הֲכִי יֶשׁ עוֹד
  choice: இன்னும் யாராவது ... இருக்கிறார்களா?
  rationale: தொடர்ந்து ஒருவர் எஞ்சியிருக்கிறாரா என்பதை விசாரிக்கும் கேள்வியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר נוֹתַר לְבֵית שָׁאוּל
  choice: சவுலின் குடும்பத்தில் ... மீதியாக
  rationale: בֵּית என்பது இங்கு கட்டிடத்தை அல்ல, சவுலின் குடும்பம் அல்லது வம்சத்தைச் சுட்டுகிறது; נותר உயிருடன் எஞ்சியிருப்பதைக் குறிக்கிறது.
- source_word: וְאֶעֱשֶׂה עִמּוֹ חֶסֶד
  choice: அவருக்கு உண்மையுள்ள அன்பு காட்ட விரும்புகிறேன்
  rationale: עשה ... חסד என்ற இணைச்சொல் ஒருவரிடம் நன்மையும் விசுவாசமுமுள்ள அன்பைக் காட்டுவதைக் குறிக்கிறது. முதல் நபர் விருப்பவினை வடிவை ‘விரும்புகிறேன்’ இயல்பாக எடுத்துரைக்கிறது.
- source_word: בַּעֲבוּר יְהוֹנָתָן
  choice: யோனத்தானின் பொருட்டு
  rationale: யோனத்தானுடனான உறவின் காரணமாக அல்லது அவரை முன்னிட்டு தாவீது இதைச் செய்ய விரும்புகிறார் என்ற நோக்கத்தைத் துல்லியமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: חֶסֶד என்பதன் உடன்படிக்கை சார்ந்த விசுவாசமும் கருணையும் கலந்த பொருள்
  choice: முதன்மை உரையில் ‘உண்மையுள்ள அன்பு’
  alternative: ‘தயவு’ அல்லது ‘உடன்படிக்கை விசுவாசம்’
  rationale: வெறும் உணர்ச்சியையோ பொதுவான தயவையோ விட, உறவுக்கு உண்மையாகச் செயல்படும் அன்பை இச்சொல் குறிக்கிறது. அதேவேளையில் ‘உடன்படிக்கை விசுவாசம்’ என்று மட்டும் மொழிபெயர்ப்பது இவ்விடத்தில் பொருளை மிகையாகக் குறிப்பிட்டுவிடலாம்; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘வீடு’ என்ற சொல்லின் சாத்தியமான இடப்பொருளைத் தவிர்க்க ‘குடும்பம்’ பயன்படுத்தப்பட்டது; חֶסֶד என்பதன் செறிவான உறவு-விசுவாச நுணுக்கம் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டது.
