revisions:
- from: தாவீது, “சவுலின் குடும்பத்தில் இன்னும் யாராவது மீதியாக இருக்கிறார்களா? யோனத்தானின் பொருட்டு அவருக்கு உண்மையுள்ள அன்பு[a] காட்ட விரும்புகிறேன்” என்று கேட்டார்.
  to: தாவீது, “சவுலின் குடும்பத்தில் இன்னும் எவராவது எஞ்சியிருக்கிறாரா? யோனத்தானின் பொருட்டு அவருக்குத் தயவு[a] காட்டும்படி?” என்று சொன்னார்.
  rationale: The revision preserves the Hebrew speech verb, its confirmation-seeking question, the singular surviving-member sense, and the cohortative purpose (“that I may show”). It uses natural modern Tamil while retaining the broader lexical range of חֶסֶד in the anchored footnote. “குடும்பம்” preserves the household/dynastic sense without implying a physical house.
