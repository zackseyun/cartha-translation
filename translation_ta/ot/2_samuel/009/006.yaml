  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ֠/יָּבֹא מְפִיבֹ֨שֶׁת בֶּן יְהוֹנָתָ֤ן בֶּן שָׁאוּל֙ אֶל דָּוִ֔ד וַ/יִּפֹּ֥ל עַל פָּנָ֖י/ו וַ/יִּשְׁתָּ֑חוּ וַ/יֹּ֤אמֶר דָּוִד֙ מְפִיבֹ֔שֶׁת וַ/יֹּ֖אמֶר הִנֵּ֥ה עַבְדֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/006.yaml
  text: Mephibosheth son of Jonathan, son of Saul, came to David and fell on his face and bowed down. David said, “Mephibosheth,” and he said, “Here is your servant.”
translation:
  language: ta
  text: சவுலின் மகனான யோனத்தானின் மகன் மேவிபோசேத் தாவீதிடம் வந்து, முகங்குப்புற விழுந்து வணங்கினான். தாவீது, “மேவிபோசேத்!” என்றார். அதற்கு அவன், “இதோ, உமது அடியேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: முகங்குப்புற விழுந்து
  rationale: எபிரெயச் சொற்றொடரின் உடல் நிலையை இயல்பான நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּשְׁתָּחוּ
  choice: வணங்கினான்
  rationale: தாவீதின் முன் பணிவுடனும் மரியாதையுடனும் தலைவணங்கிய செயலைச் சூழலுக்கேற்றவாறு தருகிறது.
- source_word: הִנֵּה עַבְדֶּךָ
  choice: இதோ, உமது அடியேன்
  rationale: הִנֵּה என்பதன் கவன ஈர்ப்பு/தன்னை முன்வைக்கும் நுணுக்கத்தையும், עַבְדֶּךָ என்பதன் பணிவான அரசவைக் குறிப்பையும் காக்கிறது.
- source_word: מְפִיבֹשֶׁת
  choice: மேவிபோசேத்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பை நவீன தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
theological_decisions:
- issue: ‘அடியேன்’ என்பது நேரடி அடிமைத்தனமா அல்லது பணிவான அரசவை மொழியா
  choice: உமது அடியேன்
  alternative: உமது பணியாளர்
  rationale: மூலத்தின் עֶבֶד சொல்லை மறைக்காமல் காக்கிறது; இச்சூழலில் அது தாவீதின் முன் மேவிபோசேத் காட்டும் பணிவையும் கீழ்ப்படிதலையும் வெளிப்படுத்துகிறது, ஆனால் அதன் சட்ட அல்லது சமூக நிலையை மேலதிகமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான வேதாகம நடையுடன் பொதுவாசகர்களுக்கு இயல்பாகப் புரியும் சொற்றொடர்கள் பயன்படுத்தப்பட்டுள்ளன. நேரடி உரையில் மரியாதைப் பன்மை காக்கப்பட்டுள்ளது.
