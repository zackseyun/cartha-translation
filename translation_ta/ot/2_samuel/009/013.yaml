- from: மெபிபோசேத் எருசலேமில் குடியிருந்தான்; ஏனெனில் அவன் அரசனுடைய மேசையில் எப்போதும் உணவருந்திவந்தான்.[a] அவன் இரண்டு கால்களிலும் ஊனமுற்றிருந்தான்.[b]
  to: மெபிபோசேத் எருசலேமில் வசித்தான்; ஏனெனில் அவன் அரசனுடைய மேசையில் எப்போதும் உணவருந்திவந்தான்.[a] அவன் இரு கால்களிலும் நடைக் குறைபாடுடையவனாக இருந்தான்.[b]
  rationale: ‘குடியிருந்தான்’ என்பதற்குப் பதிலாக நவீனத் தரத் தமிழில் மிக இயல்பான ‘வசித்தான்’ பயன்படுத்தப்பட்டுள்ளது. இறுதி வாக்கியம் פִסֵּחַ-இன் கால்நடைக் குறைபாடு என்ற குறிப்பைத் தெளிவாக்குகிறது; அதேவேளையில் மூலத்தில் இல்லாத மருத்துவக் காரணம் அல்லது தீவிரத்தைச் சேர்க்கவில்லை. அடிக்குறிப்பு எபிரெயத்தின் நேரடிச் சொல்லமைப்பை கண்ணியமான தமிழில் வழங்குகிறது. அடிக்குறிப்பு அடையாளங்கள் உரிய கூற்றுகளோடு இணைந்துள்ளன.
