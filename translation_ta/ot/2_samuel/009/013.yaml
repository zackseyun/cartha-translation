translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான எளிய நடையுடன் மொழிபெயர்க்கப்பட்டது. அரசவையைக் குறிக்கும் ‘அரசனுடைய மேசை’ என்ற மூல உருவகம் அப்படியே வைக்கப்பட்டுள்ளது. உடற்குறைபாட்டை விவரிக்க இன்றைய வாசகர்களுக்கு தேவையற்ற இழிவுணர்வை ஏற்படுத்தாத ‘ஊனமுற்றிருந்தான்’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, மூலத்தின் நேரடி சொல்முறை அடிக்குறிப்பில் தரப்பட்டுள்ளது.
