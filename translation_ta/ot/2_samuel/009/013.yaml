  source_fidelity: 'மொத்தத்தில் மூலத்துக்கு நெருக்கமாக உள்ளது: יֹשֵׁב நகரில் வசிப்பதைக் குறிக்கிறது; כִּי காரணத்தை அறிமுகப்படுத்துகிறது; תָּמִיד אֹכֵל வழக்கமான, தொடர்ச்சியான அரச மேசை உணவைச் சுட்டுகிறது. ஆனால் פִסֵּחַ என்பது பொதுவான ‘ஊனம்’ அல்ல; குறிப்பாகக் கால்களில் உள்ள நடைக் குறைபாடு/நொண்டித்தன்மையைக் குறிக்கிறது. முதன்மை உரையில் அதை இன்னும் தெளிவாகக் காட்டுவது நல்லது.'
  naturalness: ‘எருசலேமில் வசித்தான்,’ ‘அரசனுடைய மேசையில் எப்போதும் உணவருந்திவந்தான்’ ஆகியவை நவீனத் தரத் தமிழில் இயல்பானவை. ‘இரண்டு கால்களிலும் ஊனமுற்றிருந்தான்’ புரியத்தக்கது; ஆயினும் ‘இரு கால்களிலும் நடைக் குறைபாடுடையவனாக இருந்தான்’ என்பது மூலத்தின் குறிப்பான பொருளையும் கண்ணியமான நவீன நடையையும் நன்றாகச் சமநிலைப்படுத்துகிறது.
  terminology: ‘மெபிபோசேத்,’ ‘எருசலேம்,’ ‘அரசனுடைய மேசை’ ஆகிய பெயர் மற்றும் அரசவைச் சொற்கள் ஏற்றவை. அடிக்குறிப்பில் ‘முடவனாக’ என்பதற்குப் பதிலாக இழிவுணர்வு குறைவான ‘நொண்டியாக’ பயன்படுத்தப்பட்டுள்ளது; இது எபிரெய פִסֵּחַ-இன் நேரடிப் பொருளைத் தருகிறது.
