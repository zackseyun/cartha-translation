  text: וּ/מְפִיבֹ֗שֶׁת יֹשֵׁב֙ בִּ/יר֣וּשָׁלִַ֔ם כִּ֣י עַל שֻׁלְחַ֥ן הַ/מֶּ֛לֶךְ תָּמִ֖יד ה֣וּא אֹכֵ֑ל וְ/ה֥וּא פִסֵּ֖חַ שְׁתֵּ֥י רַגְלָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/013.yaml
  text: And Mephibosheth lived in Jerusalem[a], because he always ate at the king’s table[b]. Now he was lame in both his feet.
translation:
  language: ta
  text: மெபிபோசேத் எருசலேமில் வசித்தான்; ஏனெனில் அவன் அரசனுடைய மேசையில் எப்போதும் உணவருந்திவந்தான்.[a] அவன் இரு கால்களிலும் நடைக் குறைபாடுடையவனாக இருந்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஏனெனில்’ என்பதற்குப் பதிலாக, காரணத்தைத் தொடர்ச்சியாகக் காட்டும் வகையில், ‘அவன் அரசனுடைய மேசையில் எப்போதும் உணவருந்திவந்ததால்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அவன் இரண்டு கால்களிலும் நொண்டியாக இருந்தான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב
  choice: குடியிருந்தான்
  rationale: நகரின் பெயருடன் வரும் ישׁב என்ற எபிரெயப் பங்கேற்புவினை இங்கு உட்கார்ந்திருப்பதை அல்ல, அங்கே வசிப்பதைக் குறிக்கிறது. ‘குடியிருந்தான்’ என்பது இயல்பான நவீனத் தமிழில் அந்தக் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: மெபிபோசேத் எருசலேமில் குடியிருந்ததற்கான காரணத்தை இச்சொல் அறிமுகப்படுத்துகிறது. காரணத் தொடர்பைத் தமிழில் வெளிப்படையாகக் காட்ட ‘ஏனெனில்’ பயன்படுத்தப்பட்டது.
- source_word: שֻׁלְחַן הַמֶּלֶךְ
  choice: அரசனுடைய மேசை
  rationale: எபிரெயச் சேர்க்கை அமைப்பை இயல்பான தமிழ் உடைமைத் தொடராக மொழிபெயர்க்கிறது; அரசன் அளித்த உணவு, ஆதரவு, நெருக்கம் ஆகியவற்றை உள்ளடக்கும் மூல உருவகத்தை மாற்றாமல் காக்கிறது.
- source_word: תָּמִיד ... אֹכֵל
  choice: எப்போதும் உணவருந்திவந்தான்
  rationale: תָּמִיד தொடர்ச்சியான வழக்கத்தையும் אֹכֵל இங்கு வழக்கமான செயலைக் குறிக்கும் பங்கேற்புவினையையும் கொண்டுள்ளன. ‘உணவருந்திவந்தான்’ அந்தக் கடந்தகால வழக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פִסֵּחַ
  choice: ஊனமுற்றிருந்தான்
  rationale: இச்சூழலில் அந்தச் சொல் நடப்பதைப் பாதிக்கும் உடற்குறைபாட்டைக் குறிக்கிறது. நவீனத் தமிழில் இழிவுபடுத்தாத வகையில் நேரடியான பொருளைத் தர இந்தச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: שְׁתֵּי רַגְלָיו
  choice: அவன் இரண்டு கால்களிலும்
  rationale: எபிரெயம் ‘அவனுடைய இரண்டு கால்கள்/பாதங்கள்’ என்று குறிப்பாகச் சொல்வதைப் பாதுகாக்கிறது. தமிழ் வழக்கில் உடல்நிலையைக் குறிப்பிட ‘இரண்டு கால்களிலும்’ என்பது இயல்பாக உள்ளது.
- source_word: וְהוּא
  choice: அவன்
  rationale: வாவ் இணைப்புச் சொல் இங்கு முடிவான விளக்கக் குறிப்பை அறிமுகப்படுத்துகிறது. தமிழில் புதிய வாக்கியமாக ‘அவன்’ என்று தொடங்குவது இயல்பான உரையோட்டத்தை அளிக்கிறது; எபிரெயத்தின் சேர்க்கைத் தன்மை முற்றிலும் இழக்கப்படாதபடி முந்தைய வாக்கியத்துடன் தொடர்ச்சியாக வைக்கப்பட்டுள்ளது.
