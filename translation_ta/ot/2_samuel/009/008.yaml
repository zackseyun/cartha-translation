translation_notes:
  register: நவீனத் தரத் தமிழ்; அரசவைக் சூழலுக்கேற்ற மரியாதை வடிவமான ‘நீர்/உமது’ பயன்படுத்தப்பட்டுள்ளது. ‘அடியான் எம்மாத்திரம்?’ என்ற நிலைபெற்ற தமிழ் நடை, மூலத்தின் சுயத்தாழ்வை இயல்பாகப் பாதுகாக்கிறது. அடிக்குறிப்பு குறியீடு அதற்குரிய கருத்துக்குப் பின் வைக்கப்பட்டுள்ளது.
