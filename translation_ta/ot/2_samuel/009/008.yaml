source:
  edition: WLC
  text: וַ/יִּשְׁתַּ֕חוּ וַ/יֹּ֖אמֶר מֶ֣ה עַבְדֶּ֑/ךָ כִּ֣י פָנִ֔יתָ אֶל הַ/כֶּ֥לֶב הַ/מֵּ֖ת אֲשֶׁ֥ר כָּמֽוֹ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/008.yaml
  text: And he bowed down and said[a], “What is your servant[b], that you have turned toward a dead dog like me?”
translation:
  language: ta
  text: அவன் பணிந்து வணங்கி, “என்னைப் போன்ற செத்த நாயை நீர் கவனித்திருக்கிற அளவுக்கு உமது அடியான் எம்மாத்திரம்?” என்றான்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “நோக்கித் திரும்பியிருக்கிற.” இது மேலானவர் ஒருவரைத் தயவுடன் கவனிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “செத்த நாய்” என்பது தன்னை மிகவும் அற்பமானவனாகவும் தகுதியற்றவனாகவும் தாழ்த்திக் கூறும் கடுமையான சொற்றொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: தரையில் பணிந்து
  rationale: שׁחה என்பதன் இத்தொடர் வடிவம் மரியாதையோடும் கீழ்ப்படிதலோடும் உடலைத் தாழ்த்திப் பணிவதைக் குறிக்கிறது. ‘தரையில் பணிந்து’ என்பது இங்கு உடல் சார்ந்த செயலை இயல்பான தமிழில் காட்டுகிறது; அதை வழிபாடு என்று மிகையாகத் தீர்மானிப்பதில்லை.
- source_word: מֶה עַבְדֶּךָ
  choice: உமது அடியான் எம்மாத்திரம்?
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘உமது அடியான் என்ன?’ என்று கேட்டு ஆழ்ந்த தாழ்மையை வெளிப்படுத்துகிறது. தமிழில் நிலைபெற்ற ‘அடியான் எம்மாத்திரம்?’ அதே சுயத்தாழ்வை இயல்பாகத் தக்கவைக்கிறது.
- source_word: כִּי
  choice: -படி
  rationale: இங்கு כִּי, ‘உமது அடியான் எம்மாத்திரம், நீர் ... செய்யும்படி?’ என்ற வினாவின் தொடர்ச்சியையும் காரணமற்ற அருளான கவனிப்பையும் இணைக்கிறது. தமிழில் ‘கவனிக்கும்படி’ இந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פָנִיתָ אֶל
  choice: கவனிக்க
  rationale: சொல்லுக்கு நேரான உருவகம் ‘நோக்கித் திரும்புதல்’ என்பதாக இருந்தாலும், சூழலில் அது மேலானவர் தயவுடன் பொருட்படுத்துவதைக் குறிக்கிறது. ‘கவனிக்க’ என்பது அந்தச் சூழற்பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַכֶּלֶב הַמֵּת
  choice: செத்த நாய்
  rationale: இது தன்னை முற்றிலும் அற்பமானவனாகக் காட்டும் கடுமையான சுயத்தாழ்வு மொழி. ‘செத்த நாய்’ அதன் நேரடியான, இழிவான வலிமையைத் தமிழில் பாதுகாக்கிறது.
- source_word: אֲשֶׁר כָּמוֹנִי
  choice: என்னைப் போன்ற
  rationale: இந்த உறவுத்தொடர் ‘செத்த நாய்’ என்ற உருவகத்தைப் பேசுகிறவரோடு நேரடியாக ஒப்பிடுகிறது. ‘என்னைப் போன்ற’ என்பது சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
