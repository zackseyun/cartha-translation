base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/009.yaml
  text: Then the king called Ziba[a], Saul’s servant, and said to him[c][b], “All that belonged to Saul and to all his house I have given to your master’s son.”
translation:
  language: ta
  text: பின்பு அரசன் சவுலின் பணியாளனான[a] சீபாவை அழைத்து, அவனிடம், “சவுலுக்கும் அவனுடைய முழு வீட்டாருக்கும் சொந்தமாயிருந்த அனைத்தையும்[b] உன் எஜமானின் மகனுக்குக்[c] கொடுத்திருக்கிறேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பணியாளன்’ என்பதற்கான எபிரெயச் சொல் ‘இளைஞன்’ அல்லது ‘உதவியாளர்’ என்றும் மொழிபெயர்க்கப்படலாம்; இங்கு அது சவுலின் வீட்டைச் சேர்ந்த பணியாளன் அல்லது பரிவாரத்தாரைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், ‘சவுலுக்கும் அவனுடைய முழு வீட்டாருக்கும்.’ இங்குள்ள ‘வீடு/வீட்டார்’ என்பது சவுலின் குடும்பம், வீட்டுக்குடும்பம், பரிவாரத்தார் அல்லது அதனுடன் தொடர்புடைய சொத்து அமைப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘உன் எஜமானின் மகன்’ என்பது மேவிபோசேத்தைக் குறிக்கிறது. அவர் சவுலின் பேரன்; எபிரெயில் ‘மகன்’ என்ற சொல் ‘வழித்தோன்றல்’ என்ற விரிவான பொருளிலும் வழங்குகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: பணியாளன்
  rationale: இந்தச் சொல் பொதுவாக ‘இளைஞன்’ என்றும் பொருள்படலாம்; ஆனால் இங்கு சவுலின் வீட்டைச் சேர்ந்த பொறுப்புடைய சேவகர் அல்லது பரிவாரத்தாரைக் குறிக்கும் பதவிசார் சொல்லாக வருகிறது. ‘பணியாளன்’ நவீனத் தமிழில் இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: כֹּל אֲשֶׁר הָיָה לְשָׁאוּל
  choice: சவுலுக்குச் சொந்தமாயிருந்த அனைத்தையும்
  rationale: ‘சவுலுக்கு இருந்த அனைத்தும்’ என்ற எபிரெய உரிமைச் சொல்லாட்சியைத் தெளிவான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּלְכָל בֵּיתוֹ
  choice: அவருடைய குடும்பத்தார் அனைவருக்கும்
  rationale: בַּיִת என்பது வீடு, குடும்பத்தார், குடும்பம் அல்லது குடும்பச் சொத்து என்று பொருள்படலாம். இங்கு சவுலின் முழுக் குடும்ப அமைப்பும் அதனுடன் தொடர்புடைய உடைமைகளும் பின்னணியாக இருப்பதால், ‘குடும்பத்தார் அனைவருக்கும்’ என்பது முதன்மைப் பொருளை இயல்பாகத் தருகிறது; விரிவான பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: נָתַתִּי
  choice: கொடுத்திருக்கிறேன்
  rationale: முடிவுற்றதாயினும் இப்போது தொடர்ந்து நடைமுறையில் இருக்கும் தாவீதின் சொத்து மாற்றத்தைத் தமிழின் நிறைவுநிலை வினைவடிவம் நன்றாக வெளிப்படுத்துகிறது.
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: உன் எஜமானின் மகனுக்கு
  rationale: אֲדוֹן இங்கு தெய்வீகப் பட்டம் அல்ல, சமூக அல்லது குடும்பத் தலைவர் என்ற பொருளுடையது; ஆகவே ‘எஜமான்’ பொருத்தமானது. בֵּן என்ற உறவுச்சொல்லின் விரிவான வழித்தோன்றல் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּקְרָא ... וַיֹּאמֶר
  choice: பின்பு அரசன் ... அழைத்து ... என்றான்
  rationale: தொடர்கதை முன்னேற்றத்தை ‘பின்பு’ இயல்பாகக் காட்டுகிறது; ‘அழைத்து ... என்றான்’ என்ற அமைப்பு எபிரெய வினைத்தொடரையும் தமிழ் கதைநடையையும் காக்கிறது.
theological_decisions:
- issue: ‘உன் எஜமானின் மகன்’ என்பவரின் அடையாளமும் בֵּן சொல்லின் உறவுப் பரப்பும்
  choice: முதன்மை உரையில் ‘மகன்’ என்று நேரடியாக மொழிபெயர்த்து, அது மேவிபோசேத்தைக் குறிக்கிறது என்றும் இங்கு ‘வழித்தோன்றல்’ என்ற விரிவான பொருள் உண்டு என்றும் அடிக்குறிப்பில் விளக்கப்பட்டது.
  alternative: முதன்மை உரையிலேயே ‘வழித்தோன்றலான மேவிபோசேத்துக்கு’ என்று வெளிப்படையாக எழுதுதல்.
  rationale: எபிரெய உரையின் உறவுச்சொல்லை மாற்றாமல் காக்கிறது; அதேவேளை முந்தைய வசனங்களின்படி மேவிபோசேத் சவுலின் பேரன் என்பதால் உருவாகக்கூடிய தவறான புரிதலை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிமையும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அரசன்’, ‘பணியாளன்’, ‘எஜமான்’ ஆகிய சொற்கள் அரசவைக் குடும்ப அமைப்பைத் தெளிவாகக் காட்டுகின்றன; மூலத்தின் ‘வீடு’ மற்றும் ‘மகன்’ ஆகிய சொற்களிலுள்ள பொருள் விரிவுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
