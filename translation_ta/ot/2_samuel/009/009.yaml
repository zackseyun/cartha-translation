    issue: ‘குடும்பத்தார் அனைவருக்கும்’ narrows ‘all his house.’
    rationale: בֵּיתוֹ can include Saul’s household, dependents, and estate, not merely his family members. ‘அவனுடைய முழு வீட்டாருக்கும்’ is closer to the source’s corporate household expression, and the note can state the broader estate implication.
