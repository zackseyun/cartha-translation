  text: So King David sent and took him from the house of Machir son of Ammiel[a], from Lo-debar.
translation:
  language: ta
  text: எனவே தாவீது அரசன் ஆளனுப்பி, லோ-தேபாரிலுள்ள அம்மியேலின் மகன் மாகீரின் வீட்டிலிருந்து அவனைக் கொண்டுவரச் செய்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆளனுப்பி, லோ-தேபாரிலுள்ள அம்மியேலின் மகன் மாகீரின் வீட்டிலிருந்து அவனை எடுத்துவந்தான்.” எபிரெயத்தில் “அனுப்பினான்” + “அவனை எடுத்தான்” என்ற வினைத் தொடர் உள்ளது; சூழலுக்கு ஏற்ப இதை “அவனைக் கொண்டுவரச் செய்தான்” என்றும் இயல்பாக மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ஆளனுப்பி
  rationale: שׁלח என்பதன் அடிப்படைப் பொருளான ‘அனுப்புதல்’ என்பதையும், இச்சூழலில் ஒருவரை வரவழைக்க ஆட்களை அனுப்பியதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: தாவீது அரசன்
  rationale: எபிரெயப் பெயரையும் அரச பட்டத்தையும் நவீனத் தமிழுக்கு இயல்பான வரிசையில் வழங்குகிறது.
- source_word: וַיִּקָּחֵהוּ
  choice: அவனை அழைத்துவரச் செய்தான்
  rationale: לקח என்பதற்கு அடிப்படையில் ‘எடுத்துக்கொள்’ என்று பொருள் இருந்தாலும், அரசன் ஆளனுப்பிய இச்சூழலில் அவனைத் தன்னிடம் கொண்டுவரச் செய்தான் என்பதே இயல்பான தமிழ் வெளிப்பாடு. எபிரெயின் சொற்சார்ந்த அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִבֵּית
  choice: வீட்டிலிருந்து
  rationale: בַּיִת என்பது ‘வீடு’ அல்லது ‘குடும்பம்/வீட்டார்’ எனக் குறிக்கலாம்; இங்கு இடத்தைக் குறிக்கும் ‘வீட்டிலிருந்து’ இயல்பாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: מָכִיר בֶּן עַמִּיאֵל
  choice: அம்மியேலின் மகன் மாகீர்
  rationale: எபிரெய உறவுமுறை அமைப்பைப் பொருள் மாறாமல் இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: מִלּוֹ דְבָר
  choice: லோ-தேபாரில் இருந்த
  rationale: இது இடப்பெயராக ஒலிபெயர்க்கப்படுகிறது. வீட்டின் இருப்பிடத்தைத் தமிழில் தெளிவாகவும் இயல்பாகவும் இணைக்க ‘இருந்த’ சேர்க்கப்பட்டுள்ளது.
