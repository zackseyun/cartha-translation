base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/010.yaml
  text: You and your sons and your servants shall work the land for him[a], and you shall bring in the produce, and it shall be bread for your master's son, and he shall eat it. But Mephibosheth, your master's son, shall always eat bread at my table. Now Ziba had fifteen sons and twenty servants.
translation:
  language: ta
  text: நீயும் உன் மகன்களும் உன் அடிமைகளும் அவனுக்காக அந்த நிலத்தைப் பயிரிட்டு, அதன் விளைச்சலைக் கொண்டுவர வேண்டும். அது உன் எஜமானின் மகனுக்கு உணவாக[a] இருக்கும்; அவன் அதை உண்பான். ஆனால் உன் எஜமானின் மகனான மேவிபோசேத் எப்போதும் என் மேசையில் உணவருந்துவான். சீபாவுக்குப் பதினைந்து மகன்களும் இருபது அடிமைகளும் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘உணவு’ என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல்லின் நேர்ப்பொருள் ‘ரொட்டி’; சூழலுக்கேற்ப அது உணவு அல்லது உணவுப் பொருட்கள் என்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַדְתָּ לּוֹ אֶת הָאֲדָמָה
  choice: அவனுக்காக அந்த நிலத்தைப் பயிரிட்டு
  rationale: עבד என்பதன் பொருள் இங்கு பொதுவான பணிவிடை அல்ல; நிலத்தை வேளாண்மைக்காகப் பயிரிடுவதைச் சுட்டுகிறது. לּוֹ பயனாளியை, அதாவது மேவிபோசேத்தை, குறிக்கிறது.
- source_word: אַתָּה וּבָנֶיךָ וַעֲבָדֶיךָ
  choice: நீயும் உன் மகன்களும் உன் அடிமைகளும்
  rationale: עֲבָדִים என்பது இச்சமூகச் சூழலில் சாதாரண ஊழியர்களைவிட வீட்டு அதிகாரத்திற்குக் கட்டுப்பட்ட அடிமைகளைக் குறிக்கிறது; ஆகவே ‘அடிமைகள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְהֵבֵאתָ
  choice: அதன் விளைச்சலைக் கொண்டுவர வேண்டும்
  rationale: வினைச்சொல்லின் நேர்ப்பொருள் ‘கொண்டுவரு’; நிலத்தைப் பயிரிடும் சூழலிலிருந்து மறைந்துள்ள செயப்படுபொருள் விளைச்சல் என்பது தெளிவாகிறது.
- source_word: וְהָיָה לְבֶן אֲדֹנֶיךָ לֶּחֶם וַאֲכָלוֹ
  choice: அது உன் எஜமானின் மகனுக்கு உணவாக இருக்கும்; அவன் அதை உண்பான்
  rationale: לֶחֶם என்பதன் நேர்ப்பொருள் ‘ரொட்டி’ என்றாலும், இங்கு நிலத்தின் விளைச்சலிலிருந்து கிடைக்கும் உணவு அல்லது வாழ்வாதாரப் பொருளை விரிவாகக் குறிக்கிறது. ஆண்பால் ஒருமை பின்னொட்டு முன் கூறிய உணவைச் சுட்டுவதால் ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: וּמְפִיבֹשֶׁת ... יֹאכַל תָּמִיד לֶחֶם עַל שֻׁלְחָנִי
  choice: ஆனால் ... மேவிபோசேத் எப்போதும் என் மேசையில் உணவருந்துவான்
  rationale: இங்குள்ள ו வேளாண் விளைச்சல் மூலம் கிடைக்கும் ஏற்பாட்டையும் தாவீதின் சொந்த மேசையில் மேவிபோசேத் தொடர்ந்து உண்பதையும் வேறுபடுத்துவதால் ‘ஆனால்’ என வழங்கப்பட்டுள்ளது. ‘என் மேசையில் உணவருந்துவான்’ என்பது அரசரின் தொடர்ந்த பராமரிப்பையும் மேசை உறவையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וּלְצִיבָא חֲמִשָּׁה עָשָׂר בָּנִים וְעֶשְׂרִים עֲבָדִים
  choice: சீபாவுக்குப் பதினைந்து மகன்களும் இருபது அடிமைகளும் இருந்தார்கள்
  rationale: இது வினைச்சொல் இல்லாத எபிரெயப் பின்னணிக் கூற்று. இயல்பான தமிழுக்காக ‘இருந்தார்கள்’ சேர்க்கப்பட்டுள்ளது; עֲבָדִים சமூக நிலையைக் கருத்தில் கொண்டு ‘அடிமைகள்’ என வழங்கப்பட்டுள்ளது.
