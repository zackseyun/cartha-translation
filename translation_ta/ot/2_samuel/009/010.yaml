  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. அரசரின் நேரடி கட்டளைத் தொனியை ‘வேண்டும்’ என்பதும், தொடர்ந்த மேசைப் பராமரிப்பை ‘எப்போதும்’ என்பதும் காக்கின்றன. பெயர்கள் பொதுவாக அறியப்பட்ட தமிழ் வேதாகம ஒலிபெயர்ப்பு வடிவங்களில் வழங்கப்பட்டுள்ளன.
