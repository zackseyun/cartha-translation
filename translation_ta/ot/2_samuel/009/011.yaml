  text: וַ/יֹּ֤אמֶר צִיבָא֙ אֶל הַ/מֶּ֔לֶךְ כְּ/כֹל֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֲדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ אֶת עַבְדּ֔/וֹ כֵּ֖ן יַעֲשֶׂ֣ה עַבְדֶּ֑/ךָ וּ/מְפִיבֹ֗שֶׁת אֹכֵל֙ עַל שֻׁלְחָנִ֔/י כְּ/אַחַ֖ד מִ/בְּנֵ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/011.yaml
  text: Ziba said to the king[a], “According to all that my lord the king commands his servant[b], so your servant will do.” And Mephibosheth ate at my table like one of the king’s sons.
translation:
  language: ta
  text: சீபா அரசனிடம், “என் ஆண்டவராகிய அரசன் தம்முடைய பணியாளனுக்குக் கட்டளையிடுகிற எல்லாவற்றின்படியும், உமது பணியாளன் செய்வான்” என்றான். மேவிபோசேத் அரசனுடைய மகன்களில் ஒருவனைப்போல் என் மேசையில் உணவருந்தினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில், “என் மேசையில்.” முதல் நபருக்குத் திடீரென மாறுவதால், சில மொழிபெயர்ப்புகள் இதை “அரசனுடைய மேசையில்” என்று தருகின்றன; ஆனால் மசோரா எபிரெய உரை முதல் நபரையே கொண்டுள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: אמר என்பதன் வழக்கமான எபிரெயக் கதைநடை வடிவம்; நேரடி உரையின் முடிவில் இயல்பான தமிழ் வடிவமாக அமைக்கப்பட்டது.
- source_word: כְּכֹל אֲשֶׁר
  choice: அனைத்தின்படியும்
  rationale: כ + כל + אשר என்பதிலுள்ள முழுமை மற்றும் ஒப்புமை சார்ந்த பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: יְצַוֶּה
  choice: கட்டளையிடுகிற
  rationale: צוה என்பதன் பியேல் வடிவம் ‘கட்டளையிடு’ எனப் பொருள்படும்; இங்கு அரசனுடைய கட்டளைக்குக் கீழ்ப்படிவதாகக் கூறும் பொதுவான உறுதிமொழியை நிகழ்காலத் தொடர்பெயர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசன்
  rationale: அரசவைக்குரிய மரியாதைமிக்க அழைப்பைத் தெளிவாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: עַבְדּוֹ / עַבְדֶּךָ
  choice: தம் பணியாளன் / உமது பணியாளன்
  rationale: இங்கு עבד அடிமைநிலையை வலியுறுத்தாமல் அரசப் பணியிலும் மரியாதைமிக்க தன்னைச் சுட்டும் வழக்கிலும் வருகிறது; ‘பணியாளன்’ சூழலுக்கு ஏற்றது. அரசருக்குரிய மரியாதைப் பன்மையைத் தமிழில் காக்க ‘தம்/உமது’ பயன்படுத்தப்பட்டது.
- source_word: כֵּן יַעֲשֶׂה
  choice: செய்வான்
  rationale: כן உடன் வரும் imperfect வடிவம் கீழ்ப்படிதலுக்கான உறுதியைத் தருகிறது; முந்தைய ‘அனைத்தின்படியும்’ என்பதுடன் சேர்ந்து தமிழில் இயல்பாகிறது.
- source_word: וּמְפִיבֹשֶׁת
  choice: மேவிபோசேத்
  rationale: எபிரெயப் பெயரின் ஒலிப்பெயர்ப்பு; இணைப்புச் சொல் புதிய வாக்கியத்தில் தமிழில் வெளிப்படையாகத் தேவையில்லை.
- source_word: אֹכֵל
  choice: உணவருந்திவந்தான்
  rationale: Qal participle குறிக்கும் தொடர்ந்த அல்லது வழக்கமான ஏற்பாட்டை, வெறும் ஒருமுறை நிகழ்ந்த செயல் எனக் காட்டாமல் வெளிப்படுத்துகிறது.
- source_word: עַל שֻׁלְחָנִי
  choice: என் பந்தியில்
  rationale: எபிரெயிலுள்ள முதல் நபர் ஒருமை உரிமை விகுதியை (‘என்’) மாற்றாமல் காக்கிறது; அரசருடன் உண்பதைக் குறிக்கும் மரியாதைமிக்க, இயல்பான தமிழ்ச் சொல் ‘பந்தி’.
- source_word: כְּאַחַד מִבְּנֵי הַמֶּלֶךְ
  choice: அரசனுடைய மகன்களில் ஒருவனைப்போல்
  rationale: ஒப்புமையையும் அரசக் குடும்ப உறுப்பினருக்குச் சமமான நிலையையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: இறுதிக் கூற்றிலுள்ள ‘என் பந்தி’ என்பதன் பேச்சாளர்
  choice: மசோரா உரையிலுள்ள முதல் நபர் வடிவத்தை ‘என் பந்தியில்’ என்று காத்தல்
  alternative: ‘அரசனுடைய பந்தியில்’ என்று உரைநடைக் கூற்றாகத் தெளிவுபடுத்துதல்
  rationale: שֻׁלְחָנִי என்பது நேரடியாக ‘என் பந்தி/மேசை’ என்று உள்ளது. சீபாவின் நேரடி உரைக்குப் பின் வரும் நபர்மாற்றம் கடினமாக இருந்தாலும், அதை மறைமுகமாகச் சீராக்காமல் மூல உரையின் உண்மையான பதற்றம் காக்கப்படுகிறது; அடிக்குறிப்பு மாற்று வாசிப்பை விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசவைக் கூற்றின் மரியாதையை ‘என் ஆண்டவராகிய அரசன்’, ‘தம்’, ‘உமது’ ஆகிய வடிவங்கள் காக்கின்றன. ‘பந்தி’ என்பது அரசருடன் வழக்கமாக உணவருந்தும் அந்தஸ்தை இயல்பாக வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறியீடு உரையில் இடம்பெற்றுள்ளது.
