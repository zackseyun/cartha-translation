base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/007.yaml
  text: David said to him[a], “Do not be afraid, for I will surely show you kindness for the sake of Jonathan your father, and I will restore to you all the land of Saul your father[c][b], and you shall always eat bread at my table.”
translation:
  language: ta
  text: தாவீது அவனிடம், “பயப்படாதே; உன் தந்தையான யோனத்தானின் பொருட்டு நான் நிச்சயமாக உனக்குத் தயவு காட்டுவேன்[a]. உன் பாட்டனான சவுலுக்குச் சொந்தமான எல்லா நிலங்களையும் உனக்குத் திரும்பக் கொடுப்பேன்[b]. நீ எப்போதும் என் மேசையில் உணவருந்துவாய்[c]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தயவு” என்பதற்கான எபிரெயச் சொல் மாறாத அன்பு, பற்றுறுதியுள்ள அன்பு, அல்லது உடன்படிக்கைப் பற்றுறுதி என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “உன் தந்தையான சவுல்.” இங்கு “தந்தை” என்பது ஒரு முன்னோரையும் குறிக்கலாம்; சவுல் மேவிபோசேத்தின் பாட்டன்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், “என் மேசையில் எப்போதும் அப்பம் உண்பாய்.” இது தொடர்ந்து உணவு வழங்கப்படுவதையும் அரசரின் மேசையில் இடம் பெற்றிருப்பதையும் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָא
  choice: பயப்படாதே
  rationale: எதிர்மறைக் கட்டளையின் நேரடியான ஆறுதலை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: כִּי עָשֹׂה אֶעֱשֶׂה
  choice: நான் நிச்சயமாக ... காட்டுவேன்
  rationale: வினையெச்ச முழுவடிவத்துடன் வரும் வினைச்சொல் அளிக்கும் வலியுறுத்தலை ‘நிச்சயமாக’ வெளிப்படுத்துகிறது.
- source_word: חֶסֶד
  choice: பேரன்பு
  rationale: உறவுப்பற்றால் செயலாக வெளிப்படும் உறுதியான அன்பையும் கருணையையும் இச்சூழலில் இயல்பாகக் குறிக்கிறது; உடன்படிக்கை சார்ந்த பற்றுறுதியை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: בַּעֲבוּר יְהוֹנָתָן אָבִיךָ
  choice: உன் தந்தை யோனத்தானை முன்னிட்டு
  rationale: யோனத்தானுடனான உறவே தாவீதின் செயலுக்கான காரணமும் உறவுசார் நோக்கமும் என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַהֲשִׁבֹתִי לְךָ
  choice: உனக்குத் திருப்பித் தருவேன்
  rationale: சொத்தை அதன் உரியவரிடம் மீள அளிக்கும் ஹிப்ஈல் வடிவத்தின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: כָּל שְׂדֵה שָׁאוּל
  choice: சவுலுக்குச் சொந்தமான நிலம் முழுவதையும்
  rationale: שָׂדֶה ஒருமையில் இருந்தாலும் இங்கு மொத்த நிலச்சொத்தைச் சுட்டும் கூட்டுப்பொருள் கொண்டதால் ‘நிலம் முழுவதையும்’ பொருத்தமானது.
- source_word: שָׁאוּל אָבִיךָ
  choice: உன் மூதாதையான சவுல்
  rationale: எபிரெய ‘தந்தை’ என்பது முன்னோரையும் குறிக்கலாம். சவுல் மேவிபோசேத்தின் பாட்டன் என்பதைக் குழப்பமின்றி தெரிவிக்கவும், பரந்த முன்னோர் பொருளைப் பாதுகாக்கவும் ‘மூதாதை’ பயன்படுத்தப்படுகிறது.
- source_word: תֹּאכַל לֶחֶם עַל שֻׁלְחָנִי תָּמִיד
  choice: நீ எப்போதும் என் பந்தியில் உண்பாய்
  rationale: சொல்லுக்குச் சொல் ‘என் மேசையில் அப்பம் உண்பாய்’ என்றாலும், தமிழில் ‘என் பந்தியில் உண்பாய்’ என்பது தொடர்ந்த உணவு வழங்கலையும் அரசருடனான உணவுறவையும் கண்ணியமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: חֶסֶד என்பதன் உடன்படிக்கை மற்றும் பற்றுறுதி நுணுக்கம்
  choice: முதன்மை உரையில் ‘பேரன்பு’; அடிக்குறிப்பில் ‘மாறாத அன்பு’, ‘பற்றுறுதியுள்ள அன்பு’, ‘உடன்படிக்கைப் பற்றுறுதி’ ஆகிய நுணுக்கங்கள்
  alternative: இரக்கம்; தயவு; மாறாத அன்பு; உடன்படிக்கைப் பற்றுறுதி
  rationale: தாவீது யோனத்தானுடனான உறவின் பொருட்டு மேவிபோசேத்துக்கு நன்மை செய்கிறார். ‘பேரன்பு’ வாசிக்க இயல்பானது; அடிக்குறிப்பு மூலச்சொல்லின் செறிவை மிகைப்படுத்தாமல் காக்கிறது.
- issue: சவுலை אָבִיךָ என்று அழைத்தல்
  choice: முதன்மை உரையில் ‘மூதாதை’
  alternative: ‘உன் தந்தை’ என்று சொல்லுக்குச் சொல் மொழிபெயர்த்து, அவர் உண்மையில் பாட்டன் என்று அடிக்குறிப்பிடுதல்
  rationale: ஆב என்பது நேரடி தந்தை மட்டுமன்றி முன்னோரையும் குறிக்கக்கூடும். சவுல் மேவிபோசேத்தின் பாட்டன் என்பதால் ‘மூதாதை’ மூலத்தின் பரந்த உறவுப்பொருளையும் வரலாற்றுச் சூழலையும் பாதுகாக்கிறது.
