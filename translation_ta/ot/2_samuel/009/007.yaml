  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை. ‘பந்தி’ என்பது அரசருடன் பகிரும் உணவுறவைக் காட்டுகிறது; அரிதான சமயத் தொழில்சொற்கள் முதன்மை உரையில் தவிர்க்கப்பட்டுள்ளன.
