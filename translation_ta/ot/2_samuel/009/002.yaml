base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/002.yaml
  text: The house of Saul had a servant whose name was Ziba[a], and they called him to David. And the king said to him, “Are you Ziba?” And he said, “Your servant.”
translation:
  language: ta
  text: சவுலின் வீட்டாருக்கு சீபா என்ற பெயருள்ள ஒரு பணியாளன் இருந்தான். அவர்கள் அவனைத் தாவீதிடம் வரவழைத்தார்கள். அரசன் அவனிடம், “நீதான் சீபாவா?” என்று கேட்டான். அதற்கு அவன், “உங்கள் பணியாளன்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் வெளிப்படையாக, “நான் உங்கள் பணியாளன்” என்றும் மொழிபெயர்க்கலாம். எபிரெய விடை சுருக்கமாக, “உங்கள் பணியாளன்” என்று மட்டுமே உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/בֵית שָׁאוּל
  choice: சவுலின் வீட்டாருக்கு ... இருந்தான்
  rationale: எபிரெய மொழியின் உடைமை சார்ந்த இருப்புத் தொடரை இயல்பான தமிழில் ‘வீட்டாருக்கு ... இருந்தான்’ என வழங்குகிறது; தொடக்க வாவுக்கு மூலத்தில் இல்லாத காலக் குறிக்கும் ‘இப்போது’ சேர்க்கப்படவில்லை.
- source_word: עֶבֶד
  choice: பணியாளன்
  rationale: இச்சூழலில் சவுலின் வீட்டைச் சேர்ந்த கீழ்நிலைப் பணியாளன் அல்லது நிர்வாக ஊழியன் குறிக்கப்படுகிறான். ‘அடிமை’ என்பதும் சொல்லியல் வாய்ப்பாக இருந்தாலும், இங்கு அடிமை நிலை முன்னிறுத்தப்படாததால் ‘பணியாளன்’ பொருத்தமானது.
- source_word: וּשְׁמוֹ צִיבָא
  choice: சீபா என்ற பெயருள்ள
  rationale: அடையாளப்படுத்தும் எபிரெயத் தொடரை நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: וַיִּקְרְאוּ לוֹ אֶל דָּוִד
  choice: அவர்கள் அவனைத் தாவீதிடம் அழைத்துவரச் செய்தார்கள்
  rationale: קרא மற்றும் இலக்கைச் சுட்டும் தொடரின் பொருள், அவனைத் தாவீதின் முன்னிலைக்கு வரவழைத்தல். ‘அழைத்துவரச் செய்தார்கள்’ பன்மை செய்பவரையும் இலக்கையும் தெளிவாகக் காட்டுகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: கதையில் தாவீதைக் குறிக்கும் திட்டவட்டமான பட்டம்; தமிழில் வழக்கமான நேரடி இணை.
- source_word: הַאַתָּה צִיבָא
  choice: நீதான் சீபாவா?
  rationale: வினாத் துகளுடனான வலியுறுத்தப்பட்ட பெயர்ச்சொல்லை இயல்பான தமிழ் அடையாள வினாவாக வழங்குகிறது.
- source_word: עַבְדֶּךָ
  choice: உங்கள் பணியாளன்
  rationale: மூலத்தின் ‘உங்கள் பணியாளன்’ என்ற சுருக்கமான, பணிவான விடையைத் தீர்த்து விரிவுபடுத்தாமல் தக்கவைக்கிறது.
