translation:
  language: ta
  text: அரசர் அவனிடம், “அவன் எங்கே இருக்கிறான்?” என்று கேட்டார். சீபா அரசரிடம், “இதோ, அவன் லோ-தேபாரில் அம்மியேலின் மகன் மாகீரின் வீட்டில் இருக்கிறான்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் செயல்பாட்டை இயல்பான, கண்ணியமான தமிழில் தக்கவைக்கிறது.
- source_word: בֵּית מָכִיר בֶּן עַמִּיאֵל
  choice: அம்மியேலின் மகன் மாகீரின் வீட்டில்
  rationale: உறவுமுறையையும் இருப்பிடத்தையும் மூலத்தின் வரிசை மற்றும் பொருளுக்கு நெருக்கமாகத் தெளிவாகக் கூறுகிறது.
- source_word: בְּלוֹ דְבָר
  choice: லோ-தேபாரில்
  rationale: இடப்பெயரை மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கிறது.
