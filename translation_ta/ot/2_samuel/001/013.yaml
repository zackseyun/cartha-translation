revisions:
- from: தாவீது தனக்குச் செய்தி சொன்ன இளைஞனிடம், “நீ எங்கிருந்து வந்தவன்?” என்று கேட்டார். அதற்கு அவன், “நான் அமலேக்கியரான ஒரு குடியேறியின் மகன்[a]” என்றான்.
  to: தாவீது தமக்குச் செய்தி சொன்ன இளைஞனிடம், “நீ எங்கிருந்து வந்தவன்?” என்று கேட்டார். அதற்கு அவன், “நான் அமலேக்கியனான ஒரு குடியேறியின் மகன்[a]” என்றான்.
  rationale: The revision makes the ethnic designation grammatically and stylistically singular in modern Tamil and replaces the unclear alternative footnote wording. It retains “குடியேறி” for גֵּר, preserves the filial construction of בֶּן־אִישׁ, and maintains the source-level ambiguity concerning the relationship between the Amalekite identification and resident-foreigner status.
