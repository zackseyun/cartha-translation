base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/013.yaml
  text: David said to the young man who told him[a], “Where are you from?” And he said, “I am the son of an Amalekite sojourner.”
translation:
  language: ta
  text: தாவீது தமக்குச் செய்தி சொன்ன இளைஞனிடம், “நீ எங்கிருந்து வந்தவன்?” என்று கேட்டார். அதற்கு அவன், “நான் அமலேக்கியனான ஒரு குடியேறியின் மகன்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் அமலேக்கியனான ஓர் அயல்நாட்டுக் குடியிருப்பாளனின் மகன்.” எபிரெயச் சொற்றொடர் அவனுடைய தந்தையை அமலேக்கியக் குடியேறி என்று அடையாளப்படுத்தலாம்; அல்லது பேசுகிறவன் நாட்டில் குடியிருந்த ஓர் அமலேக்கியரின் வழிவந்தவன் என்பதைப் பரந்த பொருளில் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: இளைஞன்
  rationale: இச்சொல் பொதுவாக இளம் ஆணையோ உதவியாளனையோ குறிக்கலாம். இச்சூழலில் பணியாளர் என்ற நிலை வெளிப்படையாகக் கூறப்படாததால், இயல்பான ‘இளைஞன்’ பொருத்தமானது.
- source_word: הַמַּגִּיד לוֹ
  choice: தனக்குச் செய்தி சொன்ன
  rationale: נגד என்பதன் வினையெச்ச வடிவம் தாவீதிடம் செய்தியைக் கொண்டுவந்தவனைக் குறிக்கிறது; தமிழில் இது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אֵי מִזֶּה
  choice: நீ எங்கிருந்து வந்தவன்?
  rationale: இந்த எபிரெயச் சொற்றொடர் ஒருவரின் வருகையிடத்தை அல்லது பிறப்பிடப் பின்னணியை விசாரிக்கிறது. நவீனத் தமிழில் இவ்வடிவம் இயல்பானது.
- source_word: בֶּן אִישׁ
  choice: ஒரு ... மகன்
  rationale: சொல்லுக்கு சொல் ‘ஒரு மனிதனின் மகன்’ என்றாலும், இங்கு தந்தைவழி அடையாளத்தைக் குறிக்கும் இயல்பான தமிழாக்கம் பயன்படுத்தப்பட்டது.
- source_word: גֵּר
  choice: குடியேறி
  rationale: தன் சொந்த இனத்தார் அல்லது நாட்டிற்கு வெளியே வேறொரு மக்களிடையே வசிக்கும் அயல்நாட்டவரைக் குறிக்கிறது. ‘குடியேறி’ என்பது பழமையான நடையின்றி அந்தக் குடியிருப்பு நிலையைக் காட்டுகிறது.
- source_word: עֲמָלֵקִי
  choice: அமலேக்கியர்
  rationale: அமலேக்கு மக்களினத்தைச் சேர்ந்தவரைக் குறிக்கும் வழக்கமான இனப்பெயர்.
- source_word: אָנֹכִי
  choice: நான்
  rationale: வலியுறுத்தலுடன் கூடிய தன்மைச் சுட்டுப்பெயர்; தமிழில் பெயர்ப் பயனிலையுடன் ‘நான் ... மகன்’ என்று இயல்பாக அமைகிறது.
theological_decisions:
- issue: גֵּר עֲמָלֵקִי என்பதன் தொடரியல் தொடர்பு
  choice: தந்தையை ‘அமலேக்கியரான ஒரு குடியேறி’ என்று அடையாளப்படுத்தும் முதன்மை வாசிப்பு
  alternative: பேசுகிறவனை, நாட்டில் குடியிருந்த ஓர் அமலேக்கியரின் வழிவந்தவன் என்று விரிவாகப் புரிந்துகொள்ளலாம்
  rationale: எபிரெயச் சொற்றொடரில் இனப்பெயர் தந்தையை நேரடியாக வருணிப்பதாக எடுத்துக்கொள்ளலாம்; எனினும் வம்சம் மற்றும் குடியிருப்பு நிலை இடையிலான தொடர்பில் உள்ள உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘குடியேறி’ என்பது גֵּר என்பதன் சமூக மற்றும் குடியிருப்பு நிலையைச் சுருக்கமாகக் காட்டுகிறது; மூலத்தின் தொடரியல் தெளிவின்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
