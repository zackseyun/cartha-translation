source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֵלָ֖י/ו דָּוִ֑ד אֵ֚יךְ לֹ֣א יָרֵ֔אתָ לִ/שְׁלֹ֨חַ֙ יָֽדְ/ךָ֔ לְ/שַׁחֵ֖ת אֶת מְשִׁ֥יחַ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/014.yaml
  text: Then David said to him[b][a], “How were you not afraid to put out your hand to destroy Yahweh’s anointed?”
translation:
  language: ta
  text: அப்போது தாவீது அவனிடம், “யாவேவால் அபிஷேகம் செய்யப்பட்டவரை[a] அழிப்பதற்காக உன் கையை நீட்ட நீ எப்படிப் பயப்படாமல் இருந்தாய்?[b]” என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, யாவேவால் அரசனாக அபிஷேகம் செய்யப்பட்ட சவுலை.
    reason: cultural_note
  - marker: b
    text: “நீ ஏன் பயப்படவில்லை?” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் சொற்பொருள் “எப்படி?”; இது அதிர்ச்சியுடன் கூடிய கண்டனத்தை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו דָּוִד
  choice: அப்போது தாவீது அவனிடம் ... என்று கேட்டான்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுப்பதால் ‘அப்போது’ இயல்பானது. கேள்வி உரையைத் தொடர்ந்து வரும் ‘என்று கேட்டான்’ நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: אֵיךְ לֹא יָרֵאתָ
  choice: நீ எப்படிப் பயப்படாமல் இருந்தாய்?
  rationale: אֵיךְ என்பதன் நேரடியான ‘எப்படி’ என்ற பொருளையும், அதிலுள்ள அதிர்ச்சியும் கண்டனமும் கலந்த வினாவையும் காக்கிறது.
- source_word: לִשְׁלֹחַ יָדְךָ
  choice: உன் கையை நீட்ட
  rationale: ஒருவருக்கு எதிராக, குறிப்பாக வன்முறையாக, நடவடிக்கை எடுப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரை தமிழிலும் புரியத்தக்க உருவகமாகப் பேணுகிறது.
- source_word: לְשַׁחֵת
  choice: அழிப்பதற்காக
  rationale: שׁחת என்பதன் ‘அழித்தல், நாசப்படுத்தல்’ என்ற பரந்த பொருளைத் தக்கவைக்கிறது; இச்சூழலில் அது உயிரைப் பறிக்கும் செயலைக் குறிக்கிறது.
- source_word: מְשִׁיחַ יְהוָה
  choice: யாவே அபிஷேகம் செய்தவர்
  rationale: இங்கு מְשִׁיחַ என்பது அரசனாக அர்ப்பணிக்கப்பட்ட சவுலைக் குறிக்கிறது. ‘மேசியா’ எனப் பெயர்ப்பதால் பிற்காலத் தனிப்பட்ட பட்டப்பொருள் தேவையின்றி வரக்கூடும்; செயப்பாட்டு வடிவம் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை ஒரு பட்டமாக மாற்றாமல், எபிரெய தனிப்பெயரின் தமிழாக்க ஒலிவடிவமாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் அதை ஒரு பொதுப்பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: சவுலைக் குறிக்கும் מְשִׁיחַ
  choice: அபிஷேகம் செய்தவர்
  alternative: அபிஷேகம் பெற்றவர் / மேசியா
  rationale: சவுல் அரசனாகத் திருநிலைப்படுத்தப்பட்ட வரலாற்றுச் சூழலை வெளிப்படுத்துகிறது; பிற்கால மேசியா சார்ந்த தனிப்பட்ட பட்டத்தை இங்கு திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழ்; எளிமையானதாயினும் கண்ணியமான நடை. எபிரெய வினாவின் கண்டனத் தொனியும் ‘கையை நீட்டுதல்’ என்ற உருவகமும் பேணப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னர் வைக்கப்பட்டுள்ளன.
