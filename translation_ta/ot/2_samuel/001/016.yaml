  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ דָּוִ֔ד דמי/ך עַל רֹאשֶׁ֑/ךָ כִּ֣י פִ֗י/ךָ עָנָ֤ה בְ/ךָ֙ לֵ/אמֹ֔ר אָנֹכִ֥י מֹתַ֖תִּי אֶת מְשִׁ֥יחַ יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/016.yaml
  text: Then David said to him[a], “Your blood is on your own head, for your own mouth has testified against you, saying[b], ‘I myself killed Yahweh’s anointed.’”
translation:
  language: ta
  text: அப்போது தாவீது அவனிடம், “உன் இரத்தம் உன் தலையின்மேலேயே இருக்கிறது[a]. ஏனெனில், ‘யாவேயால் அபிஷேகம் செய்யப்பட்டவரை நானே கொன்றேன்’ என்று சொல்லி, உன் வாயே உனக்கு எதிராகச் சாட்சி கூறியிருக்கிறது[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல் முறையில், “உன் இரத்தம் உன் தலைமேல் இருப்பதாக” என்றும் மொழிபெயர்க்கலாம். இந்த எபிரேய மரபுத்தொடர், அவனுடைய மரணத்திற்கான பொறுப்பு அவனுக்கே உரியது என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன் வாயே உனக்கு எதிராகச் சாட்சி அளித்திருக்கிறது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו דָּוִד
  choice: அப்போது தாவீது அவனிடம் … என்றான்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுத்துச் செல்கிறது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையைத் தருகிறது. אֵלָיו என்பது ‘அவனிடம்’ என்று வெளிப்படையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: דָּמֶיךָ עַל רֹאשֶׁךָ
  choice: உன் இரத்தம் உன் தலையின்மேலேயே இருக்கிறது
  rationale: ஒருவருடைய மரணத்திற்கான பொறுப்பு அவருக்கே உரியது என்பதைக் குறிக்கும் எபிரேய நீதித்துறை மரபுத்தொடரின் இரத்தம்–தலை உருவகம் காக்கப்பட்டுள்ளது; ‘-ஏ’ தற்சார்புப் பொறுப்பை வலியுறுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: தாவீதின் தீர்ப்புக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: פִּיךָ
  choice: உன் வாயே
  rationale: பேசிய சொற்களாலேயே அவன் தன்னைக் குற்றவாளியாக்கிக்கொண்டதை வலியுறுத்தும் உடல்-உறுப்பு ஆகுபெயர் காக்கப்பட்டுள்ளது.
- source_word: עָנָה בְךָ
  choice: உனக்கு எதிராகச் சாட்சி கூறியிருக்கிறது
  rationale: இச்சட்டச் சூழலில் ענה בְּ என்பது ஒருவருக்கு எதிராகச் சாட்சி அளித்தல் என்ற பொருளைக் கொண்டுள்ளது.
- source_word: לֵאמֹר
  choice: என்று சொல்லி
  rationale: சாட்சியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இயல்பான தமிழ் வடிவம்.
- source_word: אָנֹכִי
  choice: நானே
  rationale: தனித்துநிற்கும் முதலாம் நபர் பிரதிப்பெயரின் வலியுறுத்தலைக் காக்கிறது.
- source_word: מֹתַתִּי
  choice: கொன்றேன்
  rationale: மரணத்தை ஏற்படுத்துதல் என்ற வினையின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: מְשִׁיחַ יְהוָה
  choice: யாவேயால் அபிஷேகம் செய்யப்பட்டவர்
  rationale: இங்கு சவுலைக் குறிக்கும் அரச பட்டத்தின் பொருள் மொழிபெயர்க்கப்பட்டுள்ளது; பிற்கால ‘மேசியா’ என்ற பெயர்சார் பொருள் தேவையின்றி புகுத்தப்படவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய இறைப் பெயரான நான்கெழுத்துப் பெயர் ஒரு பொதுப் பட்டமாக மாற்றப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; ஆகவே ஒரு பொதுப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- issue: מְשִׁיחַ என்ற அரச பட்டத்தின் பொருள்
  choice: அபிஷேகம் செய்யப்பட்டவர்
  alternative: மேசியா
  rationale: இச்சூழலில் இச்சொல் அரசராக அர்ப்பணிக்கப்பட்ட சவுலைக் குறிக்கிறது. பொருளை மொழிபெயர்ப்பது பிற்காலக் கிறிஸ்துவியல் அடையாளத்தை இவ்வசனத்துக்குள் முன்கூட்டியே புகுத்துவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய மூலத்தின் நீதித்துறைத் தொனி, இரத்தம்–தலை உருவகம், வாயின் ஆகுபெயர், אָנֹכִי என்பதன் வலியுறுத்தல் ஆகியவை இயன்றவரை காக்கப்பட்டுள்ளன.
