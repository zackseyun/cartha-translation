base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/026.yaml
  text: I am distressed over you[a], my brother Jonathan; you were very pleasant to me. Your love to me was wonderful, surpassing the love of women.
translation:
  language: ta
  text: என் சகோதரனாகிய யோனத்தானே, உனக்காக நான் மனவேதனை அடைகிறேன்! நீ எனக்கு மிகவும் இனியவனாக இருந்தாய். என்மீது நீ கொண்ட அன்பு அற்புதமானது; அது பெண்களின் அன்பையும் விஞ்சியது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பெண்கள்மீது கொள்ளும் அன்பைவிட மேலானது’ அல்லது ‘பெண்கள் காட்டும் அன்பைவிட மேலானது.’ எபிரெய மொழியிலுள்ள இந்தக் கவித்துவமான ஒப்பீடு, ஒப்பிடப்படும் அன்பின் துல்லியமான இயல்பையோ திசையையோ தானாகவே குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַר לִי עָלֶיךָ
  choice: உனக்காக நான் மனவேதனை அடைகிறேன்
  rationale: தனிப்பட்ட துயரத்தையும் புலம்பலின் தொனியையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. עַל இச்சூழலில் துயரத்திற்குரிய நபரைச் சுட்டுவதால் ‘உனக்காக’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: אָחִי
  choice: என் சகோதரனாகிய
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருளான ‘என் சகோதரன்’ என்பதைக் காக்கிறது; நட்பு அல்லது உறவின் தன்மையை கூடுதலாக வரையறுக்கவில்லை.
- source_word: יְהוֹנָתָן
  choice: யோனத்தான்
  rationale: தமிழ் வேதாகமப் பெயர்வழக்கிற்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: נָעַמְתָּ לִּי מְאֹד
  choice: நீ எனக்கு மிகவும் இனியவனாக இருந்தாய்
  rationale: נעם என்பதிலுள்ள இனிமை, மகிழ்ச்சி தரும் தன்மை ஆகியவற்றை இயல்பாக வெளிப்படுத்துகிறது; מְאֹד என்பதற்கு ‘மிகவும்’ பயன்படுத்தப்பட்டது.
- source_word: נִפְלְאָתָה
  choice: அற்புதமானது
  rationale: வழக்கத்திற்கு அப்பாற்பட்ட, வியப்புக்குரிய தன்மையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אַהֲבָתְךָ לִי
  choice: என்மீது நீ கொண்ட அன்பு
  rationale: தமிழில் இயல்பாக இருக்கும்படி உறவைக் கூறுகிறது; அன்பின் வகையை காதல், பாலியல் அல்லது வெறும் நட்பு எனக் குறுக்கி வரையறுக்கவில்லை.
- source_word: מֵאַהֲבַת נָשִׁים
  choice: பெண்களின் அன்பையும் விஞ்சியது
  rationale: מִן குறிக்கும் ஒப்பீட்டு மேலோங்குதலை ‘விஞ்சியது’ என வெளிப்படுத்தி, ‘பெண்களின் அன்பு’ என்ற கவித்துவமான பொதுச் சொல்லாட்சியைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘பெண்களின் அன்பு’ என்பதுடன் தாவீது செய்யும் ஒப்பீட்டின் தன்மை
  choice: ஒப்பீட்டை நேரடியாகத் தக்கவைத்து, அன்பை நவீன பாலியல், காதல் அல்லது வெறும் நட்பு என்ற எந்த வகையிலும் வரையறுக்காமல் விடுதல்
  alternative: இதைப் பெண்கள் காட்டும் அன்பு என்றோ, பெண்கள்மீது கொள்ளும் அன்பு என்றோ, குறிப்பாகத் தாம்பத்திய அன்பு என்றோ விளக்குதல்
  rationale: எபிரெயக் கவிதை யோனத்தானின் அன்பு ‘பெண்களின் அன்பை’ விஞ்சியதாகக் கூறுகிறது; ஆனால் ஒப்பிடப்படும் அன்பின் துல்லியமான இயல்பையோ திசையையோ வெளிப்படையாக வரையறுக்கவில்லை. ஆகவே மூலத்தின் பொருளியல் மற்றும் இறையியல் அழுத்தம் தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், புலம்பலுக்கேற்ற கண்ணியமான உணர்ச்சித் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘யோனத்தானே’ என்ற விளிவடிவமும் ‘மனவேதனை’, ‘இனியவனாக’, ‘விஞ்சியது’ போன்ற பொதுவாகப் புரியும் சொற்களும் தேர்ந்தெடுக்கப்பட்டுள்ளன.
