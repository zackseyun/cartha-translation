  rationale: The revision places the natural Tamil rendering “அவன் திரும்பி” in the text while preserving the Hebrew phrase’s literal spatial sense in the anchored note. It also adjusts two expressions for modern standard Tamil narrative register without changing the meaning or adding interpretive content.
