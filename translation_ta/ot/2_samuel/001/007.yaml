translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய வாக்கியத்தின் தொடர்ச்சியான ‘וַ’ இணைப்புகள் தமிழில் ஒரே மாதிரியாக மீளாமல் இருக்க, இரண்டாவது வாக்கியத்தில் ‘பிறகு’ பயன்படுத்தப்பட்டது. ‘இதோ, இருக்கிறேன்’ என்பது הִנֵּנִי என்பதன் சுருக்கத்தையும் வேதாகமச் சொல்நயத்தையும் காக்கிறது.
