base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/007.yaml
  text: He turned around and saw me[a], and he called to me, and I said, “Here I am.”
translation:
  language: ta
  text: அவன் திரும்பி என்னைக் கண்டான்[a]; அவன் என்னை அழைத்தான்; நான், “இதோ, நான் இருக்கிறேன்” என்றேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொற்பட, “அவன் தனக்குப் பின்னால் திரும்பினான்.” இது அவன் திரும்பித் தன் பின்னால் நோக்கினான் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן אַחֲרָיו
  choice: அவன் தனக்குப் பின்னால் திரும்பி
  rationale: פנה என்பது ‘திரும்புதல்’ என்றும், אַחֲרָיו என்பது சொற்பட ‘அவனுக்குப் பின்னால்’ என்றும் பொருள்படும். தமிழ் நடையில் இயல்பாக இருக்கவும், மூலத்தின் இடம்சார் கூறைப் பாதுகாக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וַיִּרְאֵנִי
  choice: என்னைக் கண்டான்
  rationale: ראה வினை இங்கு நேரடியாக ‘என்னைக் கண்டான்’ எனப் பொருள்படுகிறது; ‘என்னைப் பார்த்தான்’ என்பதைவிட காணுதல் என்ற எளிய கதைநடைச் செயலை இது தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּקְרָא אֵלָי
  choice: அவன் என்னைக் கூப்பிட்டான்
  rationale: קרא + אֶל என்பது ஒருவரை நோக்கிக் கூப்பிடுவதைக் குறிக்கிறது. ‘அழைத்தான்’ என்பதில் வரவழைத்தல் என்ற பொருள் தோன்றக்கூடும் என்பதால், சூழலுக்கேற்ற ‘கூப்பிட்டான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וָאֹמַר
  choice: நான் … என்றேன்
  rationale: אמר என்பதன் அடிப்படைப் பொருள் ‘சொல்’. பதிலுரையாக இருந்தாலும், மூலத்துக்கு நெருக்கமாக ‘என்றேன்’ பயன்படுத்தப்பட்டது.
- source_word: הִנֵּנִי
  choice: இதோ, இருக்கிறேன்
  rationale: பேசுபவர் தாம் உடனிருப்பதையும் பதிலளிக்கத் தயாராக இருப்பதையும் தெரிவிக்கும் எபிரேய மரபுத்தொடர். ‘உங்கள் சேவைக்குத் தயார்’ போன்ற விளக்கத்தைச் சேர்க்காமல் அதன் சுருக்கமான வலிமையைப் பாதுகாக்கிறது.
