source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד אֶל הַ/נַּ֖עַר הַ/מַּגִּ֣יד ל֑/וֹ אֵ֣יךְ יָדַ֔עְתָּ כִּי מֵ֥ת שָׁא֖וּל וִ/יהֽוֹנָתָ֥ן בְּנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/005.yaml
  text: Then David said to the young man who told him, “How do you know that Saul and Jonathan his son are dead?”
translation:
  language: ta
  text: அப்போது தாவீது, தனக்குச் செய்தி தெரிவித்த அந்த இளைஞனிடம், “சவுலும் அவருடைய மகன் யோனத்தானும் இறந்துவிட்டார்கள் என்று உனக்கு எப்படித் தெரியும்?” என்று கேட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... கேட்டார்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னோக்கி நகர்த்துகிறது. தமிழில் கேள்வி உரையைத் தொடர்ந்து ‘என்று கேட்டார்’ என்பது இயல்பாகவும், உரையாடலின் செயல்பாட்டைத் தெளிவாகவும் தருகிறது.
- source_word: הַנַּעַר
  choice: அந்த இளைஞன்
  rationale: נַעַר இங்கு போர்க்களச் செய்தியை அறிவிக்கக் கூடிய இளைஞனைச் சுட்டுகிறது; ‘சிறுவன்’ என்பதைக் காட்டிலும் ‘இளைஞன்’ சூழலுக்குப் பொருத்தமானது.
- source_word: הַמַּגִּיד לוֹ
  choice: தனக்குச் செய்தி தெரிவித்த
  rationale: பெயரெச்ச வினைவடிவம் தாவீதுக்குச் செய்தி அறிவித்தவனாக அந்த இளைஞனை அடையாளப்படுத்துகிறது. ‘செய்தி தெரிவித்த’ என்பது தமிழில் இயல்பான சுருக்கமான வடிவம்.
- source_word: אֵיךְ יָדַעְתָּ
  choice: உனக்கு எப்படித் தெரியும்
  rationale: கேள்வி, அறிந்த வழியை மட்டும் அல்லாமல் அந்த அறிவின் ஆதாரத்தையும் விசாரிக்கிறது. இக்கருத்தை நவீன தமிழில் இயல்பாக வெளிப்படுத்தும் நடை இது.
- source_word: כִּי
  choice: என்று
  rationale: כִּי இங்கு அறியப்பட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழ் மறைமுக உள்ளடக்க வாக்கியத்தில் ‘என்று’ இதை இயல்பாகக் குறிக்கிறது.
- source_word: מֵת
  choice: இறந்துவிட்டார்கள்
  rationale: எபிரெயில் கூட்டு எழுவாயுடன் ஒருமை வடிவம் இருந்தாலும், தமிழில் சவுலும் யோனத்தானும் என்ற இருவருக்கும் பொருந்தும் மரியாதைப் பன்மை வடிவம் இயல்பானது. ‘விட்டார்கள்’ இறப்பின் நிறைவுற்ற நிலையைக் காட்டுகிறது.
- source_word: בְּנוֹ
  choice: அவருடைய மகன்
  rationale: பின்னொட்டு சவுலைக் குறிக்கிறது; ‘அவருடைய’ என்பது சவுலுக்குரிய மரியாதையையும் உறவையும் தெளிவாகத் தருகிறது.
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: சவுலும் ... யோனத்தானும்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; இணைப்பை இயல்பான ‘-உம் ... -உம்’ அமைப்பு தருகிறது.
