  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֵ֚יךְ נָפְל֣וּ גִבּוֹרִ֔ים וַ/יֹּאבְד֖וּ כְּלֵ֥י מִלְחָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/027.yaml
  text: How the mighty have fallen[b][a], and the weapons of war have perished!
translation:
  language: ta
  text: வலிமைமிக்கோர் எப்படியாய் வீழ்ந்துபோனார்கள்! போர்க்கருவிகள்[a][b] அழிந்துபோயினவே!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘போர் உபகரணங்கள்’ அல்லது ‘போர்க் கவசங்கள்.’ எபிரெயச் சொற்றொடர் தாக்குதல் ஆயுதங்களை மட்டும் அல்லாமல், போருக்குப் பயன்படும் பொருட்களைப் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘போர்க்கருவிகள்’ என்பது இஸ்ரவேலின் போர்வலிமையாக விளங்கிய சவுலையும் யோனத்தானையும் உருவகமாகக் குறிக்கலாம்; எனினும், இதை நேரடிப் பொருளிலும் வாசிக்க முடியும்.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ
  choice: எப்படி
  rationale: இது தகவல் கேட்கும் வினா அல்ல; துயரமும் வியப்பும் நிறைந்த புலம்பல். ‘எப்படி’ என்பது மூலத்தின் கவிதைநயத்தையும் இப்பாடலில் திரும்ப வரும் பல்லவியையும் காக்கிறது.
- source_word: נָפְלוּ
  choice: வீழ்ந்துபோனார்கள்
  rationale: நிறைவேறிவிட்ட துயர நிகழ்வையும் அதன் தற்போதைய விளைவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: גִבּוֹרִים
  choice: வல்லவர்கள்
  rationale: இச்சொல் வலிமைமிக்க மனிதர்களையும் போர்வீரர்களையும் குறிக்கலாம். ‘வல்லவர்கள்’ என்பது போர்வீரர்கள் என்று அளவுக்கு மீறிக் குறுக்காமல், உயர்ந்த புலம்பல் நடையைப் பேணுகிறது.
- source_word: וַיֹּאבְדוּ
  choice: அழிந்துபோயினவே
  rationale: אבד என்பதன் ‘அழிதல்/இழக்கப்படுதல்’ என்ற பொருளையும் புலம்பலின் உணர்ச்சியையும் தருகிறது; நேரடியான மற்றும் உருவகமான வாசிப்புகளுக்கும் இடமளிக்கிறது.
- source_word: כְּלֵי מִלְחָמָה
  choice: போர்க்கருவிகள்
  rationale: ‘போருக்குரிய பொருட்கள்/கருவிகள்’ என்ற பரந்த எபிரெயக் கருத்தைச் சுருக்கமாகத் தருகிறது; தாக்குதல் ஆயுதங்கள் மட்டுமல்லாமல் பிற போர் உபகரணங்களையும் குறிக்கக்கூடும்.
theological_decisions:
- issue: ‘போர்க்கருவிகள்’ என்பது நேரடிப் பொருளா அல்லது சவுலையும் யோனத்தானையும் குறிக்கும் உருவகமா?
  choice: இரு வாசிப்புகளுக்கும் இடமளிக்கும் வகையில் ‘போர்க்கருவிகள்’ என்று மொழிபெயர்த்து, உருவக வாய்ப்பை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: சவுலும் யோனத்தானும் இஸ்ரவேலின் போர்வலிமை என்று வெளிப்படையாகப் பொருளுரைத்தல்
  rationale: எபிரெயச் சொற்றொடர் இராணுவப் பொருட்களை நேரடியாகக் குறிக்கலாம்; சூழலில் உயிரிழந்த தலைவர்களை உருவகமாகவும் சுட்டலாம். மூலத்தில் தீர்மானிக்கப்படாததை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் புலம்பலுக்கேற்ற உயர்ந்த கவிதைநடையில் வடிவமைக்கப்பட்டது. ‘எப்படி’ வினாவாக அல்ல, வியப்பும் துயரமும் கொண்ட கூற்றாகச் செயல்படுவதால் வியப்புக்குறி பயன்படுத்தப்பட்டது; இறுதியிலுள்ள ‘-வே’ புலம்பலின் உணர்ச்சி அழுத்தத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
