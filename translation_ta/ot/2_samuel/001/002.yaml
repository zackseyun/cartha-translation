  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י וְ/הִנֵּה֩ אִ֨ישׁ בָּ֤א מִן הַֽ/מַּחֲנֶה֙ מֵ/עִ֣ם שָׁא֔וּל וּ/בְגָדָ֣י/ו קְרֻעִ֔ים וַ/אֲדָמָ֖ה עַל רֹאשׁ֑/וֹ וַ/יְהִי֙ בְּ/בֹא֣/וֹ אֶל דָּוִ֔ד וַ/יִּפֹּ֥ל אַ֖רְצָ/ה וַ/יִּשְׁתָּֽחוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/002.yaml
  text: On the third day[a], behold, a man came from the camp, from Saul, with his clothes torn and dirt on his head. And when he came to David[c][b], he fell to the ground and bowed down.
translation:
  language: ta
  text: மூன்றாம் நாளில், இதோ, ஒரு மனிதன் முகாமிலிருந்து, சவுலின் தரப்பிலிருந்து[a] வந்தான். அவனுடைய உடைகள் கிழிந்திருந்தன; அவன் தலையின்மேல் மண்[b] இருந்தது. அவன் தாவீதிடம் வந்தபோது, தரையில் விழுந்து பணிந்தான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சவுலுடன் இருந்த’ அல்லது ‘சவுலின் தரப்பிலிருந்த’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொற்றொடர் சவுலுடனான தொடர்பைக் குறிக்கிறது; சவுல் நேரடியாக அவனை அனுப்பினார் என்று கட்டாயமாகக் குறிக்கவில்லை.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘அவன் தலையின்மேல் மண் இருந்தது.’ இது துக்கம் அல்லது புலம்பலுக்கான வழக்கமான அடையாளம்.
    reason: cultural_note
  - marker: c
    text: ‘தன்னைத் தரைமட்டும் தாழ்த்திக்கொண்டான்’ என்றும் மொழிபெயர்க்கலாம். சூழலைப் பொறுத்து இந்த வினை ஆழ்ந்த மரியாதை, கீழ்ப்படிதல் அல்லது மரியாதை செலுத்துதலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: மூன்றாம் நாளில்
  rationale: எபிரேயக் கதைநடையின் தொடர்ச்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத தனியான ‘இப்போது’ என்ற காலச்சொல் சேர்க்கப்படவில்லை.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: அடுத்த காட்சியை வாசகரின் கவனத்துக்கு உயிரோட்டமாகக் கொண்டுவரும் எபிரேயச் சுட்டுச்சொல்லின் வலிமையைப் பேணுகிறது.
- source_word: אִישׁ בָּא
  choice: ஒரு மனிதன் வந்தான்
  rationale: ஒரு ஆண் நபரைக் குறிக்கும் ஒருமைச் சொல்லையும், கதைச்சூழலில் முதன்மை வினையாகச் செயல்படும் பங்கேற்பு வடிவத்தையும் நேரடியாகத் தருகிறது.
- source_word: מִן־הַמַּחֲנֶה מֵעִם שָׁאוּל
  choice: சவுலின் பக்கத்திலிருந்த முகாமிலிருந்து
  rationale: அவன் சவுலுடன் அல்லது சவுலின் தரப்புடன் கொண்டிருந்த தொடர்பைக் காட்டுகிறது; சவுலே அவனை அனுப்பினார் என்ற பொருளைத் தேவையின்றிச் சேர்ப்பதில்லை.
- source_word: וּבְגָדָיו קְרֻעִים
  choice: அவனுடைய உடைகள் கிழிந்திருந்தன
  rationale: துக்கநிலையைச் சித்தரிக்கும் பெயரெச்சக் கூறை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: וַאֲדָמָה עַל־רֹאשׁוֹ
  choice: அவன் தலையின்மேல் மண் இருந்தது
  rationale: אֲדָמָה என்பதன் ‘மண்/நிலம்’ என்ற அடிப்படைப் பொருளைப் பேணி, துக்கத்தின் பண்பாட்டுச் சின்னத்தை விளக்கவுரையின்றி உரையில் வைத்திருக்கிறது.
- source_word: בְּבֹאוֹ אֶל־דָּוִד
  choice: அவன் தாவீதிடம் வந்தபோது
  rationale: בְּ முன்னொட்டுடன் வரும் வினைப்பெயர் அமைப்பின் காலச்சூழலை இயல்பான தமிழில் துல்லியமாகத் தருகிறது.
- source_word: וַיִּפֹּל אַרְצָה
  choice: தரையில் விழுந்து
  rationale: திசை குறிக்கும் אַרְצָה வடிவத்தின் கீழ்நோக்கிய இயக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וַיִּשְׁתָּחוּ
  choice: பணிந்தான்
  rationale: மரியாதை, கீழ்ப்படிதல் அல்லது அஞ்சலி காட்டும் உடல் செயலைக் குறிக்கிறது; இங்கு அதைத் தெய்வ வழிபாடாக முன்கூட்டியே தீர்மானிப்பதில்லை.
theological_decisions:
- issue: וַיִּשְׁתָּחוּ என்பது வழிபாட்டையா அல்லது மனித அரசருக்கான மரியாதையையா குறிக்கிறது?
  choice: பணிந்தான்
  alternative: விழுந்து வணங்கினான் / நெடுஞ்சாண்கிடையாக விழுந்தான்
  rationale: தாவீதின் முன்னிலையில் நிகழும் செயல் என்பதால் மரியாதை அல்லது கீழ்ப்படிதல் இயல்பான சூழற்பொருள்; இருப்பினும் வினையின் பரந்த பொருள் வரம்பைச் சுருக்காமல் ‘பணிந்தான்’ என வழங்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியக்கூடிய, ஆனால் வேதாகமக் கதைநடைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற சொல் மூலத்தின் காட்சிப்படுத்தும் வலிமையைப் பேணுகிறது. துக்கச் சின்னமும் பணிதலின் தன்மையும் உரையில் அளவுக்கு மீறி விளக்கப்படாமல், தேவையான மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
