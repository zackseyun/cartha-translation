  text: וַ/יֹּ֜אמֶר הַ/נַּ֣עַר הַ/מַּגִּ֣יד ל֗/וֹ נִקְרֹ֤א נִקְרֵ֨יתִי֙ בְּ/הַ֣ר הַ/גִּלְבֹּ֔עַ וְ/הִנֵּ֥ה שָׁא֖וּל נִשְׁעָ֣ן עַל חֲנִית֑/וֹ וְ/הִנֵּ֥ה הָ/רֶ֛כֶב וּ/בַעֲלֵ֥י הַ/פָּרָשִׁ֖ים הִדְבִּקֻֽ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/006.yaml
  text: And the young man who told him said[a], “I happened to be on Mount Gilboa, and behold, Saul was leaning on his spear, and behold[c][b], the chariots and the horsemen were closing in on him.”
translation:
  language: ta
  text: அவனுக்குச் செய்தி தெரிவித்த அந்த இளைஞன், “நான் தற்செயலாகவே[a] கில்போவா மலையில் இருந்தேன். இதோ, சவுல் தன் ஈட்டியின்மேல் சாய்ந்துகொண்டிருந்தார்; இதோ, தேர்ப்படையும் குதிரைவீரர்களும்[b] அவரை நெருங்கிக்கொண்டிருந்தார்கள்[c]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தற்செயலாக அங்கு நேர்ந்தேன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர், அவர் அங்கு இருந்தது தற்செயலாக நிகழ்ந்ததை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தேர்களும் குதிரைமேல் சென்றவர்களும்’ அல்லது ‘தேர்களும் குதிரைப்படையும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘அவரை எட்டிப்பிடித்திருந்தார்கள்’ அல்லது ‘அவரைக் கடுமையாகத் துரத்திக்கொண்டிருந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: அந்த இளைஞன்
  rationale: நַעַר இங்கு அமலேக்கியத் தூதனைக் குறிக்கிறது. ‘இளைஞன்’ என்பது வயதைக் காட்டும் இயல்பான நவீனத் தமிழ்; ‘சிறுவன்’ அல்லது ‘வேலைக்காரன்’ என்று தேவையின்றி குறுக்குவதில்லை.
- source_word: הַמַּגִּיד לוֹ
  choice: அவனுக்குச் செய்தி தெரிவித்த
  rationale: נגד என்பதன் பங்கேற்புவினை வடிவம், தாவீதிடம் செய்தி சொன்னவனாக அந்த இளைஞனை அடையாளப்படுத்துகிறது. இத்தொடர் அந்த அடைமொழிப் பணியைத் தெளிவாகக் காக்கிறது.
- source_word: נִקְרֹא נִקְרֵיתִי
  choice: நான் தற்செயலாகவே … இருந்தேன்
  rationale: முற்றுப்பெறா வினையெச்சமும் வரையறுக்கப்பட்ட வினையும் சேர்ந்த எபிரெயச் சொற்றொடர், அங்கு இருந்தது தற்செயலாக நிகழ்ந்ததை வலியுறுத்துகிறது. ‘தற்செயலாகவே’ அந்த வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: கில்போவா மலையில்
  rationale: பெயரிடப்பட்ட மலைக்கான வழக்கமான புவியியல் மொழிபெயர்ப்பு; தமிழில் இடத்தைக் குறிக்க ‘மலையில்’ இயல்பானது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה காட்சியின்மீது உடனடி கவனத்தை ஈர்க்கும் உரையாடல் குறியீடு. மூலத்தில் இருமுறை வருவதால் இரு இடங்களிலும் ‘இதோ’ என்று காக்கப்பட்டுள்ளது.
- source_word: נִשְׁעָן עַל חֲנִיתוֹ
  choice: தன் ஈட்டியின்மேல் சாய்ந்துகொண்டிருந்தார்
  rationale: שען என்பதன் நிபால் வடிவம் உடலை ஓர் ஆதாரத்தின்மேல் சாய்த்திருப்பதைக் குறிக்கிறது; חֲנִית என்பதற்கு பொதுவாகப் புரியும் ‘ஈட்டி’ பொருத்தமானது.
- source_word: הָרֶכֶב וּבַעֲלֵי הַפָּרָשִׁים
  choice: தேர்ப்படையும் குதிரைவீரர்களும்
  rationale: רֶכֶב இங்கு கூட்டுப்பொருளில் தேர்களைக் கொண்ட படைப்பிரிவைக் குறிக்கலாம். בַעֲלֵי הַפָּרָשִׁים என்பது குதிரைமேல் செல்லும் வீரர்களைக் குறிக்கும் மரபுத்தொடர். ‘தேர்ப்படை’ மற்றும் ‘குதிரைவீரர்கள்’ இராணுவக் காட்சியைத் தெளிவாகத் தருகின்றன.
- source_word: הִדְבִּקֻהוּ
  choice: அவரை நெருங்கிக்கொண்டிருந்தார்கள்
  rationale: דבק என்பதன் ஹிபீல் வடிவம் பின்தொடர்ந்து எட்டிப்பிடித்தல், நெருங்குதல், அல்லது கடுமையாகத் துரத்துதல் ஆகிய நெருங்கிய பொருள்களை உடையது. காட்சி நடந்துகொண்டிருப்பதாகத் தெரிவிக்கும் இம்மொழிபெயர்ப்பு, பிடித்துவிட்டார்கள் என்று தேவையின்றி முடிவுசெய்வதைத் தவிர்க்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
