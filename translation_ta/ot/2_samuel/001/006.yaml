translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரட்டை הִנֵּה ‘இதோ’ என இருமுறையும் காக்கப்பட்டு, தற்செயல் நிகழ்வின் வலியுறுத்தலும் துரத்தலின் முடிவுநிலை குறித்த பொருள் நெகிழ்வும் பாதுகாக்கப்பட்டுள்ளன.
