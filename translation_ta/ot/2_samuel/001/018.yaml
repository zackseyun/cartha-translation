  yaml_path: translation/ot/2_samuel/001/018.yaml
  text: 'and said that the sons of Judah should be taught “The Bow.” Behold, it is written in the Book of Jashar:'
translation:
  language: ta
  text: 'யூதாவின் மகன்களுக்கு “வில்” என்பதைக் கற்றுக்கொடுக்கும்படி அவர் கூறினார். இதோ, அது யாசாரின் நூலில் எழுதப்பட்டுள்ளது:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְלַמֵּד
  choice: கற்றுக்கொடுக்கும்படி
  rationale: பியல் வினைவடிவின் காரணப்படுத்தும் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יְהוּדָה
  choice: யூதாவின் மகன்களுக்கு
  rationale: மூலத்தின் உறவுநிலை அமைப்பை நெருக்கமாகப் பேணுகிறது; இங்கு யூதா கோத்திரத்தாரைக் குறிக்கலாம் என்றாலும் அதை விளக்கமாக விரிவாக்கவில்லை.
- source_word: קָשֶׁת
  choice: “வில்”
  rationale: சொற்பொருள் ‘வில்’. சூழலில் இது பின்வரும் புலம்பலின் தலைப்பாக இருக்கக்கூடும் என்பதால் மேற்கோள் குறிகளுடன் வழங்கப்படுகிறது; மூலத்தின் சுருக்கமான வடிவமும் ஓரளவு தெளிவின்மையும் பேணப்படுகின்றன.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரேயச் சொல்லின் உரைநடை வலிமையைத் தக்கவைக்கிறது.
- source_word: סֵפֶר הַיָּשָׁר
  choice: யாசாரின் நூல்
  rationale: தலைப்பிலுள்ள יָשָׁר என்பதை பெயராக ஒலிபெயர்த்து, உறுதியற்ற பொருள் விளக்கத்தை உரைக்குள் திணிக்காமல் விடுகிறது.
theological_decisions:
- issue: קָשֶׁת என்பது ஆயுதப் பயிற்சியா அல்லது பாடலின் தலைப்பா
  choice: “வில்” என்ற தலைப்பாகக் காட்டப்பட்டது
  alternative: யூதாவின் மகன்களுக்கு வில்வித்தையைக் கற்றுக்கொடுக்கும்படி
  rationale: அடுத்த வசனங்களில் வரும் புலம்பலுக்கான அறிமுகமும் ஆங்கில ஆலோசனை உரையும் தலைப்பு வாசிப்பை ஆதரிக்கின்றன; இருப்பினும் மூலத்தில் தலைப்பைக் குறிக்கும் தனிச்சொல் இல்லை என்பதால் ‘பாடல்’ போன்ற விளக்கச் சொல் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்க, எளிதில் புரியும் உரைநடை. வசனம் முந்தைய வாக்கியத்தைத் தொடர்வதால் எழுவாய் ‘அவர்’ என இயல்பாகத் தரப்பட்டுள்ளது. மேற்கோள் குறிகள் ‘வில்’ என்பதை சாத்தியமான படைப்புத் தலைப்பாகச் சுட்டுகின்றன.
