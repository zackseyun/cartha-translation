source:
  edition: WLC
  text: אֵ֚יךְ נָפְל֣וּ גִבֹּרִ֔ים בְּ/ת֖וֹךְ הַ/מִּלְחָמָ֑ה יְה֣וֹנָתָ֔ן עַל בָּמוֹתֶ֖י/ךָ חָלָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/025.yaml
  text: How the mighty have fallen in the midst of the battle! Jonathan lies slain on your heights[a].
translation:
  language: ta
  text: 'போரின் நடுவே மாவீரர்கள் எவ்வாறு வீழ்ந்தார்கள்!

    யோனத்தான், உன் உயர்நிலங்களில் கொல்லப்பட்டுக் கிடக்கிறானே![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன் மேடுகளில்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் உயர்ந்த நிலப்பகுதிகளைக் குறிக்கலாம்; இங்கு புலம்பலில் கவிதைநயமாக விளிக்கப்படும் இஸ்ரவேலின் உயர்நிலங்களை இது குறிக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: எவ்வாறு
  rationale: இது தகவல் கேட்கும் வினா அல்ல; வியப்பும் துயரமும் நிறைந்த புலம்பல். ‘எவ்வாறு’ என்பது அதன் கவிதை வலிமையையும் இப்புலம்பலில் திரும்ப வரும் தொடர் ஒலியையும் காக்கிறது.
- source_word: נָפְלוּ
  choice: வீழ்ந்தார்கள்
  rationale: நிறைவுற்ற நிகழ்வை உயிரோட்டமுள்ள புலம்பலாகக் கூறும் வினை. தமிழில் இயல்பாகவும் கவிதைநயத்துடனும் அமைகிறது.
- source_word: גִבֹּרִים
  choice: மாவீரர்கள்
  rationale: வலிமையும் போர்த்திறனும் கொண்ட வீரர்களைக் குறிக்கிறது; குறிப்பிட்ட இராணுவப் பதவியைத் தேவையின்றி சேர்க்காமல் சொல்லின் சிறப்பை வெளிப்படுத்துகிறது.
- source_word: בְּתוֹךְ הַמִּלְחָמָה
  choice: போரின் நடுவே
  rationale: போர் நடந்தது என்பதை மட்டும் அல்லாமல், போரின் மையத்திலேயே அவர்கள் வீழ்ந்தார்கள் என்ற בְּתוֹךְ சொல்லின் நுட்பத்தையும் காக்கிறது.
- source_word: יְהוֹנָתָן
  choice: யோனத்தான்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: עַל
  choice: இல்
  rationale: இங்கு இடத்தைக் குறிக்கும் முன்னிடைச்சொல்; ‘உயர்நிலங்களில்’ என்ற தமிழ்ச் சொல்லமைப்பில் இயல்பாக வெளிப்படுகிறது.
- source_word: בָּמוֹתֶיךָ
  choice: உன் உயர்நிலங்களில்
  rationale: உயர்ந்த நிலப்பகுதிகள் என்ற புவியியல் படிமத்தைத் தக்கவைத்து, ‘மேடைகள்’ என்பதால் உருவாகக்கூடிய வழிபாட்டிடப் பொருளை முதன்மை உரையில் தேவையின்றி புகுத்தாமல் இருக்கிறது.
- source_word: חָלָל
  choice: கொல்லப்பட்டுக் கிடக்கிறானே
  rationale: காயமடைந்த ஒருவரை அல்ல, கொல்லப்பட்ட ஒருவரைக் குறிக்கும் சொல்லின் பொருளைத் தெளிவுபடுத்துகிறது; எபிரெயில் வெளிப்படையாக இல்லாத இணைப்புவினையின் இயல்பான தமிழ் வெளிப்பாடாக ‘கிடக்கிறானே’ அமைந்து புலம்பல் தொனியையும் தருகிறது.
theological_decisions:
- issue: ‘உன் உயர்நிலங்கள்’ என்பதில் இரண்டாம் நபர் ஒருமை யாரைக் குறிக்கிறது?
  choice: கவிதைநயமாக விளிக்கப்படும் இஸ்ரவேல் நாடு அல்லது அதன் மலைநிலங்கள்
  alternative: யோனத்தானுக்குரிய உயர்நிலங்கள்
  rationale: முழுப் புலம்பலிலும் நிலப்பரப்பு உயிருள்ளதுபோல் விளிக்கப்படுகிறது. எனினும் மூலமொழியின் உடைமைச் சுட்டை விளக்கமாக மாற்றாமல் ‘உன்’ என்று வைத்திருப்பதால் அதன் கவிதைத் திறந்தநிலை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான புலம்பல் நடையைப் பயன்படுத்துகிறது. முதல் அடியின் வியப்புத் தொனியும் இரண்டாம் அடியின் நேரடி அழைப்பும் காக்கப்பட்டுள்ளன.
