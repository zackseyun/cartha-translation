  source_fidelity: மூல எபிரெய உரையின் புலம்பல் வியப்பு (אֵיךְ), ‘மாவீரர்கள்’ (גִּבֹּרִים), போரின் மையத்தில் நிகழ்ந்த வீழ்ச்சி (בְּתוֹךְ הַמִּלְחָמָה), யோனத்தானின் கொல்லப்பட்ட நிலை (חָלָל) ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘உன் உயர்நிலங்கள்’ என்பதில் உள்ள இரண்டாம் நபர் உடைமைச் சுட்டின் கவிதைமயமான திறந்தநிலையும் பாதுகாக்கப்படுகிறது.
  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாகவும், புலம்பலுக்குரிய கண்ணியமான கவிதைத் தொனியுடனும் உள்ளது. ‘கொல்லப்பட்டுக் கிடக்கிறானே’ என்பது தமிழ் புலம்பல் நடையில் இயல்பான உயிரோட்டமுள்ள வெளிப்பாடாகும்.
  terminology: ‘மாவீரர்கள்,’ ‘போரின் நடுவே,’ ‘உயர்நிலங்கள்’ ஆகிய தேர்வுகள் பொருத்தமானவை. ‘உயர்நிலங்கள்’ முதன்மை உரையில் புவியியல் பொருளைத் தருகிறது; அடிக்குறிப்பு ‘மேடுகள்’ என்ற மாற்றையும் அதன் சாத்தியமான பொருளையும் சரியாகக் குறிக்கிறது.
