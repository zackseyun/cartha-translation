reference: 2 Samuel 1:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ דָּוִ֔ד אֵ֥י מִ/זֶּ֖ה תָּב֑וֹא וַ/יֹּ֣אמֶר אֵלָ֔י/ו מִ/מַּחֲנֵ֥ה יִשְׂרָאֵ֖ל נִמְלָֽטְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/003.yaml
  text: David said to him[a], “Where have you come from?” He said to him, “I have escaped from the camp of Israel.”
translation:
  language: ta
  text: தாவீது அவனிடம், “நீ எங்கிருந்து வருகிறாய்?” என்று கேட்டான். அதற்கு அவன், “இஸ்ரவேலின் முகாமிலிருந்து தப்பி வந்தேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵי מִזֶּה
  choice: எங்கிருந்து
  rationale: இந்த எபிரெயச் சொற்றொடர் வந்த இடத்தையோ மூலத்தையோ விசாரிக்கிறது. நவீனத் தமிழில் ‘எங்கிருந்து’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: תָּבוֹא
  choice: வருகிறாய்
  rationale: வடிவில் இது முற்றுப்பெறாத வினையாக இருந்தாலும், இச்சூழலில் ஒருவன் வந்த இடத்தைப் பற்றிய நேரடி விசாரணையாக உள்ளது. ‘நீ எங்கிருந்து வருகிறாய்?’ என்பது தமிழில் இயல்பான கேள்வி.
- source_word: מִמַּחֲנֵה יִשְׂרָאֵל
  choice: இஸ்ரவேலின் முகாமிலிருந்து
  rationale: מַחֲנֶה என்பது இங்கு படை முகாமைக் குறிக்கிறது; ‘இஸ்ரவேலின் முகாம்’ மூலமொழியின் உடைமைத் தொடர்பையும் இராணுவச் சூழலையும் காக்கிறது.
- source_word: נִמְלָטְתִּי
  choice: தப்பி வந்தேன்
  rationale: מלט என்ற வேரின் நிஃபால் வடிவம் ஆபத்திலிருந்து வெற்றிகரமாகத் தப்பியதைக் குறிக்கிறது. தமிழில் ‘தப்பி வந்தேன்’ என்பது அந்தத் தப்பிப்பையும் பேச்சாளர் இங்கு வந்து சேர்ந்ததையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: என்று கேட்டான் ... என்றான்
  rationale: எபிரெயத்தில் இரு இடங்களிலும் பொதுவான ‘சொன்னான்’ வினையே உள்ளது. ஆனால் முதலாவது உரை கேள்வி என்பதால், தமிழில் ‘கேட்டான்’ எனச் சூழலுக்கேற்ற வகையில் வழங்குவது இயல்பான வாசிப்பைத் தருகிறது; இரண்டாவது ‘என்றான்’ என வழங்கப்பட்டுள்ளது.
- source_word: דָּוִד
  choice: தாவீது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
