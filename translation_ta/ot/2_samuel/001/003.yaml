translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் சாதாரண வாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடையில் மொழிபெயர்க்கப்பட்டது. உரையாடல் இயல்பாக இருக்க ‘என்று கேட்டான்’ மற்றும் ‘அதற்கு அவன்’ பயன்படுத்தப்பட்டுள்ளன; எந்த சமயப்பிரிவு சார்ந்த விளக்கமும் சேர்க்கப்படவில்லை.
