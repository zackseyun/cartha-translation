lexical_decisions:
- source_word: וַיְקֹנֵן
  choice: புலம்பலைப் பாடினார்
  rationale: קונן என்பது இறந்தவர்களுக்காக முறைப்படி ஒரு புலம்பலை எடுத்துரைப்பதைக் குறிக்கிறது. தமிழில் ‘புலம்பலைப் பாடினார்’ என்பது அதன் நிகழ்த்துகைத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது; இது அந்தப் புலம்பல் இசையுடன் பாடப்பட்டது என்பதை உறுதியாகக் கூறுவதில்லை என்பதைக் காலடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: הַקִּינָה הַזֹּאת
  choice: இந்தப் புலம்பலை
  rationale: קִינָה என்பது குறிப்பாக இறந்தவர்களுக்கான துயரப் புலம்பல். ‘இந்த’ என்பது எபிரெயச் சுட்டுப்பெயரை நேரடியாகப் பாதுகாக்கிறது.
- source_word: עַל
  choice: —க்காக
  rationale: இங்கு עַל புலம்பலுக்குரிய நபர்களைக் குறிக்கிறது. தமிழில் ‘சவுலுக்காகவும் ... யோனத்தானுக்காகவும்’ என்பது துயரத்தின் நோக்கை இயல்பாகத் தெரிவிக்கிறது.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: יְהוֹנָתָן
  choice: யோனத்தான்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: בְּנוֹ
  choice: அவர் மகன்
  rationale: இணைக்கப்பட்டுள்ள ஒருமை ஆண்பால் உரிமை விகுதி சவுலைக் குறிக்கிறது. ‘அவர் மகன்’ என்பது தமிழில் இயல்பாகவும் மரியாதையுடனும் அந்த உறவைத் தெரிவிக்கிறது.
- source_word: וַ
  choice: பின்பு
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுத்துச் செல்கிறது; ‘பின்பு’ நிகழ்வின் தொடர்ச்சியை நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
