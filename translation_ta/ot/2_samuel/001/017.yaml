translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வினை–பெயர்ச்சொல் இணைப்பைத் தமிழில் சொற்சொல்லாகக் கொடுத்தால் இயல்பற்றதாக இருப்பதால், முதன்மை உரையில் ‘புலம்பலைப் பாடினார்’ என்றும், முறையான மாற்றை காலடிக்குறிப்பிலும் வழங்கியுள்ளோம்.
