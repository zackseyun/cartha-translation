source:
  edition: WLC
  text: וָ/אֶעֱמֹ֤ד עָלָי/ו֙ וַ/אֲמֹ֣תְתֵ֔/הוּ כִּ֣י יָדַ֔עְתִּי כִּ֛י לֹ֥א יִֽחְיֶ֖ה אַחֲרֵ֣י נִפְל֑/וֹ וָ/אֶקַּ֞ח הַ/נֵּ֣זֶר אֲשֶׁ֣ר עַל רֹאשׁ֗/וֹ וְ/אֶצְעָדָה֙ אֲשֶׁ֣ר עַל זְרֹע֔/וֹ וָ/אֲבִיאֵ֥/ם אֶל אֲדֹנִ֖/י הֵֽנָּה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/010.yaml
  text: So I stood over him and put him to death[a], because I knew that he would not live after he had fallen. Then I took the crown that was on his head and the armlet that was on his arm[b], and I brought them here to my lord.
translation:
  language: ta
  text: அப்போது நான் அவர்மேல் நின்று அவரைக் கொன்றேன்; அவர் விழுந்தபின் உயிர்பிழைக்க மாட்டார் என்று அறிந்திருந்தேன். பிறகு அவருடைய தலையிலிருந்த கிரீடத்தையும் அவருடைய புயத்திலிருந்த கையணியையும்[a] எடுத்து, அவற்றை இங்கே என் ஆண்டவரிடம் கொண்டுவந்தேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கைவளையல்.” எபிரேயச் சொல் புயத்தில் அணியும் ஓர் அணிகலனைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இது தாவீதிடம் அமலேக்கியன் கூறிய விவரம். சவுலின் மரணம் பற்றிய முந்தைய விவரத்திற்கு 1 சாமுவேல் 31:4–5-ஐ ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: וָאֶעֱמֹד עָלָיו
  choice: நான் அவர்மேல் நின்று
  rationale: עמד + על என்பதன் இடநிலைப் பொருளை இயல்பான தமிழில் தருகிறது; விழுந்திருந்த சவுலின் மேல் நின்ற நிலையைச் சுட்டுகிறது.
- source_word: וַאֲמֹתְתֵהוּ
  choice: அவரைக் கொன்றேன்
  rationale: מות என்பதன் ஹிஃபில் வடிவம் இங்கு மரணத்தை ஏற்படுத்தியதாகப் பேச்சாளர் கூறுவதை நேரடியாகத் தெரிவிக்கிறது.
- source_word: כִּי יָדַעְתִּי כִּי לֹא יִחְיֶה
  choice: அவர் ... உயிர்பிழைக்க மாட்டார் என்று அறிந்திருந்தேன்
  rationale: பேச்சாளர் கூறும் காரணத்தையும் לֹא יִחְיֶה என்பதன் எதிர்காலப் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אַחֲרֵי נִפְלוֹ
  choice: அவர் விழுந்தபின்
  rationale: கொல்லப்பட்டதாகக் கூறப்படும் நிகழ்வுக்கு முன்னதாக நிகழ்ந்த விழுதலைச் சுருக்கமாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: הַנֵּזֶר
  choice: கிரீடம்
  rationale: அரசரின் தலையில் அணியும் அரச அடையாளத்தை நவீன வாசகருக்குத் தெளிவாகக் குறிக்கிறது.
- source_word: וְאֶצְעָדָה
  choice: கை அணி
  rationale: זרוע மீது அணிந்த ஆபரணம் என்பதைக் குறிக்கிறது; அது மணிக்கட்டில் அணிந்த வளையலா அல்லது மேல்கையில் அணிந்த அணியா என்பதை மிகையாகத் தீர்மானிக்கவில்லை.
- source_word: זְרֹעוֹ
  choice: அவருடைய கை
  rationale: זרוע என்பதன் பொதுவான உடற்பகுதி பொருளைத் தருகிறது; முன்கை என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: וָאֲבִיאֵם
  choice: அவற்றை ... கொண்டுவந்தேன்
  rationale: எபிரேய இறந்தகாலக் கதைத் தொடரை எளிய இறந்தகாலத்தில் காக்கிறது.
- source_word: אֶל אֲדֹנִי
  choice: என் ஆண்டவரிடம்
  rationale: இங்கு דודை நோக்கிய மரியாதைமிக்க மனித அதிகாரி அழைப்பு; இறைத் தலைப்பாக அல்ல.
- source_word: הֵנָּה
  choice: இங்கே
  rationale: பேச்சாளர் தற்போது இருக்கும் இடத்தைச் சுட்டும் இடவினையடை.
theological_decisions:
- issue: சவுலின் மரணம் குறித்த அமலேக்கியனின் கூற்று
  choice: அமலேக்கியன் தானே சவுலைக் கொன்றதாகக் கூறும் நேரடிப் பேச்சாக மொழிபெயர்க்கப்பட்டது.
  alternative: 1 சாமுவேல் 31:4–5 உடன் ஒத்திசைக்க, இதை பொய்யான பெருமைபேச்சு என்று மொழிபெயர்ப்பிலேயே மென்மைப்படுத்துதல்.
  rationale: இவ்வசனம் பேச்சாளரின் கூற்றை அப்படியே அளிக்கிறது. முந்தைய மரண விவரத்துடனான பதற்றத்தை மொழிபெயர்ப்பில் தீர்க்காமல், குறிப்பில் சுட்டுவது மூலத்தின் கதைநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. நேரடிப் பேச்சின் கடுமை மென்மைப்படுத்தப்படவில்லை; அதேவேளை தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
