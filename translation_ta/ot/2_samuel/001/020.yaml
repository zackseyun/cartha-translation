source:
  edition: WLC
  text: אַל תַּגִּ֣ידוּ בְ/גַ֔ת אַֽל תְּבַשְּׂר֖וּ בְּ/חוּצֹ֣ת אַשְׁקְל֑וֹן פֶּן תִּשְׂמַ֨חְנָה֙ בְּנ֣וֹת פְּלִשְׁתִּ֔ים פֶּֽן תַּעֲלֹ֖זְנָה בְּנ֥וֹת הָ/עֲרֵלִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/020.yaml
  text: Do not tell it in Gath[a]; do not proclaim the news in the streets of Ashkelon, lest the daughters of the Philistines rejoice[b], lest the daughters of the uncircumcised exult.
translation:
  language: ta
  text: 'காத் நகரில் அதைச் சொல்லாதீர்கள்;

    அஸ்கலோனின் வீதிகளில் அந்தச் செய்தியை அறிவிக்காதீர்கள்.[a]

    இல்லையெனில் பெலிஸ்தியரின் மகள்கள் மகிழ்வார்கள்;

    விருத்தசேதனம் செய்யப்படாதவர்களின் மகள்கள்[b] களிகூருவார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அறிவிக்காதீர்கள்” என்பதற்கு “செய்தியைக் கொண்டுவராதீர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “விருத்தசேதனம் செய்யப்படாதவர்களின் மகள்கள்” என்பது பெலிஸ்தியரை இழிவாகக் குறிப்பிடும், உடன்படிக்கை அடையாளம் சார்ந்த சொல்லின் நேரடி மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּגִּידוּ
  choice: அதைச் சொல்லாதீர்கள்
  rationale: נגד என்பதன் ‘சொல்/தெரிவி/அறிவி’ என்ற பொருளை இயல்பான தமிழில் தருகிறது. சவுலும் யோனத்தானும் வீழ்ந்த செய்தியே மறைமுகச் செயப்படுபொருள் என்பதால் ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: בְגַת
  choice: காத் நகரில்
  rationale: בְ என்பது இடப்பொருளையும் גַת நகரப் பெயரையும் குறிக்கிறது; தமிழில் தெளிவுக்காக ‘நகரில்’ சேர்க்கப்பட்டுள்ளது.
- source_word: תְּבַשְּׂרוּ
  choice: அந்தச் செய்தியை அறிவிக்காதீர்கள்
  rationale: பியேல் வடிவிலுள்ள בשר, செய்தியைக் கொண்டுவருதல் அல்லது அறிவித்தல் என்பதைக் குறிக்கிறது. ‘அறிவிக்காதீர்கள்’ பொதுவெளியில் செய்தி வெளியிடப்படுவதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בְּחוּצֹת אַשְׁקְלוֹן
  choice: அஸ்கலோனின் வீதிகளில்
  rationale: חוּצוֹת நகரத்தின் வீதிகள் அல்லது திறந்த பொது இடங்களைக் குறிக்கலாம்; இங்கு பொதுவாக அறிவிக்கப்படும் சூழலுக்கு ‘வீதிகளில்’ பொருந்துகிறது.
- source_word: פֶּן
  choice: இல்லையெனில்
  rationale: எதிர்மறை நோக்கம் அல்லது அஞ்சப்படும் விளைவை அறிமுகப்படுத்தும் פֶּן என்பதைக் கவிதை ஓட்டத்துடன் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: תִּשְׂמַחְנָה
  choice: மகிழ்வார்கள்
  rationale: שמח என்பதன் மகிழ்ச்சி என்ற அடிப்படைப் பொருளைத் தருகிறது.
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: பெலிஸ்தியரின் மகள்கள்
  rationale: ‘மகள்கள்’ என்ற நேரடி உருவகத்தைப் பாதுகாத்து, பெலிஸ்தியப் பெண்களைக் கவிதைமுறையில் சுட்டுகிறது.
- source_word: תַּעֲלֹזְנָה
  choice: களிகூருவார்கள்
  rationale: עלז குறிக்கும் மிகுந்த, வெளிப்படையான மகிழ்ச்சியை ‘மகிழ்வார்கள்’ என்பதைக் காட்டிலும் வலிமையாகத் தருகிறது; இணைவரிகளின் தீவிரப்படுத்தலையும் காக்கிறது.
- source_word: בְּנוֹת הָעֲרֵלִים
  choice: விருத்தசேதனம் செய்யப்படாதவர்களின் மகள்கள்
  rationale: עֲרֵלִים என்பதன் சொற்பொருளான ‘விருத்தசேதனம் செய்யப்படாதவர்கள்’ என்பதைப் பாதுகாத்து, பொதுவான மத அல்லது இன இழிவுச்சொல்லாக மாற்றுவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: עֲרֵלִים என்ற உடன்படிக்கை அடையாளம் சார்ந்த இழிவுப் பெயரின் மொழிபெயர்ப்பு
  choice: விருத்தசேதனம் செய்யப்படாதவர்கள்
  alternative: புறவினத்தார் / அசுத்தமானவர்கள்
  rationale: எபிரெயச் சொல் நேரடியாக விருத்தசேதனத்தையும் அதன்வழி உடன்படிக்கை அடையாளத்தையும் சுட்டுகிறது. நேரடி மொழிபெயர்ப்பு அதன் இறையியல் மற்றும் சொல்லாட்சித் தீவிரத்தைப் பாதுகாக்கிறது; பொதுவான விளக்கத்தை உரைக்குள் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், புலம்பலுக்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைவரிகளின் ‘சொல்லாதீர்கள்/அறிவிக்காதீர்கள்’ மற்றும் ‘மகிழ்வார்கள்/களிகூருவார்கள்’ என்ற படிநிலை வலிமை பாதுகாக்கப்பட்டுள்ளது.
