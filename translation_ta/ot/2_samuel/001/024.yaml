  register: நவீனத் தரத் தமிழில், இறப்புப் பாடலுக்குரிய கண்ணியமான கவிதை நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தின் இணை அமைப்பும் நேரடி விளிப்பும் காக்கப்பட்டுள்ளன; அரிதான அல்லது மிகப் பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
