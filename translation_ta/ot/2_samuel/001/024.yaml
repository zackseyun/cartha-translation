source:
  edition: WLC
  text: בְּנוֹת֙ יִשְׂרָאֵ֔ל אֶל שָׁא֖וּל בְּכֶ֑ינָה הַ/מַּלְבִּֽשְׁ/כֶ֤ם שָׁנִי֙ עִם עֲדָנִ֔ים הַֽ/מַּעֲלֶה֙ עֲדִ֣י זָהָ֔ב עַ֖ל לְבוּשְׁ/כֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/024.yaml
  text: Daughters of Israel[a], weep over Saul, who clothed you in scarlet with luxuries[b], who put ornaments of gold on your clothing.
translation:
  language: ta
  text: 'இஸ்ரவேலின் மகள்களே, சவுலுக்காகப் புலம்புங்கள்;


    அவர் உங்களுக்கு ஆடம்பரங்களுடன் செந்நிற ஆடைகளை அணிவித்தார்,[a]


    உங்கள் உடைகளின்மேல் பொன் அணிகலன்களை வைத்தார்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆடம்பரங்களுடன்” என்பதற்கு “இன்பமளிக்கும் நேர்த்தியுடன்,” “அழகிய அலங்காரங்களுடன்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பொன் அணிகலன்கள்” என்பதை “பொன் நகைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகள்களே
  rationale: நேரடி விளிப்பையும் எபிரெயக் கவிதை மரபையும் காக்கிறது; ‘இஸ்ரவேல் பெண்களே’ என்பதைவிட மூல உருவகத்துக்கு நெருக்கமானது.
- source_word: אֶל שָׁאוּל בְּכֶינָה
  choice: சவுலுக்காகப் புலம்புங்கள்
  rationale: இறப்புப் புலம்பலின் சூழலில் אֶל துயரத்தின் பொருளைக் குறிக்கிறது; வினைச்சொல் வெறும் அழுகையைவிட முறையான புலம்பலை உணர்த்துகிறது.
- source_word: הַמַּלְבִּשְׁכֶם שָׁנִי
  choice: அவர் உங்களுக்கு ... செந்நிற ஆடைகளை அணிவித்தார்
  rationale: பெயரெச்ச வினை வடிவை சவுலைக் குறிக்கும் இயல்பான தொடர்புத் தொடராக வழங்குகிறது; שָׁנִי என்பது செந்நிறச் சாயமிட்ட துணி அல்லது ஆடையைக் குறிக்கிறது.
- source_word: עִם עֲדָנִים
  choice: ஆடம்பரங்களுடன்
  rationale: இன்பமான செழுமை, நேர்த்தி, அலங்காரம் ஆகியவற்றுக்கு இடையில் உள்ள சொல்லின் பரப்பைச் சுருக்காமல் நவீன தமிழில் தெரிவிக்கிறது.
- source_word: הַמַּעֲלֶה עֲדִי זָהָב
  choice: பொன் அணிகலன்களை அணிவித்தார்
  rationale: עלה இங்கு ‘மேல் வைக்கச் செய்தல்/அணிவித்தல்’ என்ற சூழல்சார் பொருளிலும் עֲדִי அலங்காரப் பொருள் என்ற பொருளிலும் வருகிறது.
- source_word: עַל לְבוּשְׁכֶן
  choice: உங்கள் உடைகளின்மேல்
  rationale: மேற்பரப்பில் வைக்கப்பட்ட அல்லது அணியப்பட்ட அலங்காரத்தைச் சுட்டும் முன்னிடைத் தொடரை நேரடியாகப் பிரதிபலிக்கிறது.
