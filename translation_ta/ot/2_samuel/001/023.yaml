base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/023.yaml
  text: Saul and Jonathan[a], beloved and pleasant in their lives, were not parted in their death; they were swifter than eagles[c][b], they were stronger than lions.
translation:
  language: ta
  text: சவுலும் யோனத்தானும் தங்கள் வாழ்வில் அன்புக்குரியவர்களாகவும் இனியவர்களாகவும்[a] இருந்தார்கள்; சாவிலும் அவர்கள் பிரியவில்லை. அவர்கள் கழுகுகளைவிட[b] விரைவானவர்கள்; சிங்கங்களைவிட வலிமையானவர்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இனியவர்கள்” என்பதற்கு “மனங்கவர்ந்தவர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் பெரிய வேட்டைப் பறவையைப் பொதுவாகக் குறிக்கக்கூடும் என்பதால், “பிணந்தின்னிக் கழுகுகளைவிட” என்றும் மொழிபெயர்க்கலாம்; இங்கு “கழுகுகள்” என்பதே மரபானதும் இயல்பானதுமான பொருள்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “சிங்கங்களைவிட வல்லவர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: சவுலும் யோனத்தானும்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: הַנֶּאֱהָבִים
  choice: அன்புக்குரியவர்கள்
  rationale: אהב என்பதிலிருந்து வரும் செயல்பாட்டை ஏற்கும் பெயரடைப் பொருளைத் தக்கவைத்து, அவர்கள் அன்பு செலுத்தியவர்கள் என்றல்ல, அன்பு பெற்றவர்கள் என்ற பொருளை வெளிப்படுத்துகிறது.
- source_word: וְהַנְּעִימִם
  choice: இனியவர்கள்
  rationale: நயமுள்ள, மகிழ்வூட்டும், மனத்துக்கு உகந்த தன்மையைக் குறிக்கும் נעים என்பதன் கவிதைநயத்தை இயல்பான நவீனத் தமிழில் தருகிறது; உடல் அழகையோ அறநற்குணத்தையோ மட்டும் குறிப்பதாகக் குறுக்கவில்லை.
- source_word: בְּחַיֵּיהֶם
  choice: தங்கள் வாழ்வில்
  rationale: காலத்தையும் வாழ்வின் நிலையையும் குறிக்கும் எபிரெயச் சொற்றொடரைச் சுருக்கமாகக் காத்து, அடுத்து வரும் ‘சாவிலும்’ என்பதுடன் இணைநிலையை உருவாக்குகிறது.
- source_word: וּבְמוֹתָם לֹא נִפְרָדוּ
  choice: சாவிலும் அவர்கள் பிரியவில்லை
  rationale: மரணத்திலும் பிரிக்கப்படாததை உணர்த்தும் கவித்துவமான எதிரிணையை இயல்பான தமிழில் காக்கிறது; பிரிதல் பற்றிய எபிரெய வினையின் நடுநிலை/தற்செயல் நயத்தையும் மிகையாக விளக்கவில்லை.
- source_word: מִנְּשָׁרִים קַלּוּ
  choice: அவர்கள் கழுகுகளைவிட விரைவானவர்கள்
  rationale: ஒப்பீட்டுச் சூழலில் קלל வேகத்தைக் குறிக்கிறது. נשר ஒரு பெரிய வேட்டைப் பறவையைக் குறிக்கும் பரந்த சொல்லாக இருக்கலாம்; இங்கு மரபானதும் இயல்பானதுமான ‘கழுகு’ முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
- source_word: מֵאֲרָיוֹת גָּבֵרוּ
  choice: சிங்கங்களைவிட வலிமையானவர்கள்
  rationale: גבר குறிக்கும் பலத்தையும் மேம்பாட்டையும் தெளிவான நவீனத் தமிழில் தருகிறது; ‘வல்லவர்கள்’ என்ற கவிதைநயமுள்ள மாற்றையும் அடிக்குறிப்பு பதிவு செய்கிறது.
theological_decisions:
- issue: சவுலையும் யோனத்தானையும் பற்றிய தாவீதின் புலம்பலின் புகழுரைத்தொனி
  choice: சவுலின் முந்தைய தோல்விகளால் இவ்வசனத்தின் புகழுரையைத் தணிக்காமலும், அவர்களைப் பிழையற்றவர்களாக உயர்த்தாமலும், இறப்புக்கான கவித்துவப் புகழாக மொழிபெயர்க்கப்பட்டது.
  alternative: சவுலின் முந்தைய செயல்களை முன்னிட்டு புகழை மென்மைப்படுத்துதல், அல்லது இப்புகழை முழுமையான அறநற்குணச் சான்றாக விரிவுபடுத்துதல்.
  rationale: மூலவசனம் இறந்த சவுலையும் யோனத்தானையும் ஒன்றாகக் கௌரவிக்கும் புலம்பல். பரந்த கதையில் உள்ள பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடாமல், இங்குள்ள நேர்மறையான நினைவுகூரலை அப்படியே காக்க வேண்டும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, அதேவேளையில் இறப்புப் புலம்பலுக்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வாழ்வில் / சாவிலும்,’ ‘கழுகுகள் / சிங்கங்கள்’ ஆகிய எபிரெய இணை அமைப்புகள் தெளிவாகக் காக்கப்பட்டுள்ளன.
