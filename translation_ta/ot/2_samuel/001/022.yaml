  text: מִ/דַּ֣ם חֲלָלִ֗ים מֵ/חֵ֨לֶב֙ גִּבּוֹרִ֔ים קֶ֚שֶׁת יְה֣וֹנָתָ֔ן לֹ֥א נָשׂ֖וֹג אָח֑וֹר וְ/חֶ֣רֶב שָׁא֔וּל לֹ֥א תָשׁ֖וּב רֵיקָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/022.yaml
  text: From the blood of the slain[a], from the fat of the mighty, Jonathan’s bow did not turn back[b], and Saul’s sword did not return empty.
translation:
  language: ta
  text: 'கொல்லப்பட்டவர்களின் இரத்தத்திலிருந்து,

    வலிமைமிக்கவர்களின் கொழுமையிலிருந்து,

    யோனத்தானின் வில் பின்வாங்கவில்லை[a];

    சவுலின் வாள் வெறுமையாகத் திரும்பவில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பின்னோக்கித் திரும்பவில்லை.” எபிரேயச் சொற்றொடர் பின்வாங்குவதையோ பின்னோக்கித் திரும்புவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם חֲלָלִים
  choice: கொல்லப்பட்டவர்களின் இரத்தத்திலிருந்து
  rationale: מִן பிரிவையோ விலகுதலையோ குறிக்கும் படிமத்தைத் தக்கவைக்கிறது; חֲלָלִים என்பது போரில் கொல்லப்பட்டவர்களை இயல்பாகக் குறிக்கிறது.
- source_word: מֵחֵלֶב גִּבּוֹרִים
  choice: வலிமைமிக்கவர்களின் கொழுப்பிலிருந்து
  rationale: חֵלֶב என்பதன் நேரடியான உடல் சார்ந்த படிமமான ‘கொழுப்பு’ தக்கவைக்கப்படுகிறது; גִּבּוֹרִים உயர்ந்த கவிதை நடையில் வலிமைமிக்க போராளிகளைக் குறிக்கிறது.
- source_word: קֶשֶׁת יְהוֹנָתָן
  choice: யோனத்தானின் வில்
  rationale: எபிரேய இணைப்புத் தொடரை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: לֹא נָשׂוֹג אָחוֹר
  choice: பின்வாங்கவில்லை
  rationale: נסוג மற்றும் אָחוֹר இணைந்து பின்வாங்குதல் அல்லது பின்னோக்கிச் செல்லுதல் என்ற பொருளைத் தருகின்றன; வில்லின் கவிதைமிகு ஆளுருவாக்கத்தையும் இது காக்கிறது.
- source_word: וְחֶרֶב שָׁאוּל
  choice: சவுலின் வாள்
  rationale: இணையான முதல் அரையடியைப் போலவே இயல்பான தமிழ் உடைமைத் தொடராக மொழிபெயர்க்கப்படுகிறது.
- source_word: לֹא תָשׁוּב רֵיקָם
  choice: வெறுமையாகத் திரும்பவில்லை
  rationale: தன் நோக்கத்தை நிறைவேற்றாமல் திரும்பவில்லை என்னும் கருத்தை விளக்கிச் சொல்லாமல், மூலத்தின் சுருக்கமான ஆளுருவாக்கப் படிமத்தைத் தக்கவைக்கிறது.
