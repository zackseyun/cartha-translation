translation_notes:
  register: தாவீதின் புலம்பலுக்கேற்ற உயர்ந்த கவிதைநடை காக்கப்பட்டுள்ளது; அதேவேளையில் சொற்கள் நவீனத் தரத் தமிழில் பொதுவாசகர்களுக்குப் புரியுமாறு அமைக்கப்பட்டுள்ளன. மூலத்தின் இணை அமைப்பும் போர்க்களப் படிமங்களும் வரி பிரிப்பின் மூலம் தெளிவாக்கப்பட்டுள்ளன.
