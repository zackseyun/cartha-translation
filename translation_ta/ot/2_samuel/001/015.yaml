translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இளைஞர்கள்’ என்ற சொல் மூலத்தின் வயது/நிலை சார்ந்த சொல்லைத் தக்கவைக்கிறது. கட்டளையில் உள்ள வன்முறையை மறைக்காமல், மூலத்தில் வெளிப்படையாக இல்லாத ‘கொல்’ என்ற பொருளையும் புகுத்தாமல் மொழிபெயர்க்கப்பட்டுள்ளது.
