source:
  edition: WLC
  text: וַ/יִּקְרָ֣א דָוִ֗ד לְ/אַחַד֙ מֵֽ/הַ/נְּעָרִ֔ים וַ/יֹּ֖אמֶר גַּ֣שׁ פְּגַע בּ֑/וֹ וַ/יַּכֵּ֖/הוּ וַ/יָּמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/015.yaml
  text: Then David called one of the young men and said[a], “Come near; strike him down.” So he struck him, and he died.
translation:
  language: ta
  text: அப்போது தாவீது இளைஞர்களில் ஒருவனை அழைத்து, “அருகே போய், அவனைத் தாக்கு[a]” என்றார். அவன் அவனை அடித்தான்; அவன் இறந்துபோனான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவன்மேல் பாய்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரேயச் சொற்றொடர் (פְּגַע בּוֹ) பொதுவாக வன்முறையான தாக்குதலைக் குறிக்கக்கூடும்; இச்சூழலில் அது மரணத்தை விளைவிக்கும் தாக்குதல் என்பது தெளிவு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்து
  rationale: קרא என்பது இந்நிகழ்வில் ஒருவரை அழைப்பதைக் குறிக்கிறது; இயல்பான தமிழில் ‘அழைத்து’ என்பது அடுத்துவரும் பேச்சுச் செயலோடு நன்றாக இணைகிறது.
- source_word: לְאַחַד מֵהַנְּעָרִים
  choice: இளைஞர்களில் ஒருவனை
  rationale: נְעָרִים என்பது சூழலின்படி இளைஞர்கள், பணியாளர்கள் அல்லது உதவியாளர்களைக் குறிக்கலாம். எபிரேயத்தின் வயது/நிலை சார்ந்த பொதுச் சொல்லைத் தொழில்பெயராக மாற்றாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: גַּשׁ
  choice: அருகே போய்
  rationale: נגשׁ என்பது அருகில் செல் அல்லது அணுகு என்பதாகும். இங்கு தாவீதிடமே வருமாறு அல்ல, கொல்லப்படவிருப்பவனை அணுகுமாறு கட்டளையிடப்படுவதால் ‘அருகே போய்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: פְּגַע בּוֹ
  choice: அவனைத் தாக்கு
  rationale: פגע ב என்பது தாக்குதல் அல்லது வன்முறையாகப் பாய்தல் என்பதைக் குறிக்கலாம். சூழலில் கட்டளை உயிரைப் பறிப்பதாக இருந்தாலும், இது வழக்கமான வெளிப்படையான ‘கொல்’ என்ற வினை அல்ல; ஆகவே மூலத்தின் சொற்பொருள் அகலத்தை ‘தாக்கு’ பாதுகாக்கிறது.
- source_word: וַיַּכֵּהוּ
  choice: அவன் அவனை அடித்தான்
  rationale: נכה என்பதன் அடிப்படைப் பொருள் அடித்தல். அடுத்த கூறு மரணத்தைத் தனியே தெரிவிப்பதால், செயலையும் விளைவையும் ஒன்றாகக் கலந்து ‘கொன்றான்’ என்று மொழிபெயர்க்காமல் எபிரேய வரிசை பாதுகாக்கப்படுகிறது.
- source_word: וַיָּמֹת
  choice: அவன் இறந்துபோனான்
  rationale: מות என்பது இறத்தலைக் குறிக்கும் வழக்கமான வினை. தொடர் நிகழ்வின் இறுதி விளைவை இயல்பான நவீனத் தமிழில் தனிக் கூறாகத் தருகிறது.
