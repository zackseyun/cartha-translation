  text: וַ/יֹּ֣אמֶר אֵלַ֗/י עֲמָד נָ֤א עָלַ/י֙ וּ/מֹ֣תְתֵ֔/נִי כִּ֥י אֲחָזַ֖/נִי הַ/שָּׁבָ֑ץ כִּֽי כָל ע֥וֹד נַפְשִׁ֖/י בִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/009.yaml
  text: And he said to me[a], ‘Please stand over me and put me to death, for anguish has seized me[b], though my life is still in me.’
translation:
  language: ta
  text: அப்போது அவர் என்னிடம், “தயவுசெய்து என்மேல் வந்து நின்று என்னைக் கொன்றுவிடு; ஏனெனில் வேதனை என்னைப் பற்றிக்கொண்டது[a]; ஆனாலும் என் உயிர் இன்னும் என்னில் இருக்கிறது[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தசைப்பிடிப்பு அல்லது வலிப்பு என்னைப் பற்றிக்கொண்டது”; “வேதனை” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் அரிதானது; அதன் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “ஏனெனில் என் முழு உயிரும் இன்னும் என்னில் இருக்கிறது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: அப்போது அவர் என்னிடம் ... என்றார்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை இயல்பான நவீனத் தமிழில் எடுத்துரைக்கிறது.
- source_word: עֲמָד נָא עָלַי
  choice: தயவுசெய்து என்மேல் நின்று
  rationale: עָמַד என்பதன் ‘நில்’ என்ற அடிப்படைப் பொருளையும், விழுந்து அல்லது காயமடைந்து கிடப்பவருக்கு மேலாக நிலைகொள்ளும் עַל என்ற சொல்லின் சூழல்சார் பொருளையும் காக்கிறது; נָא வேண்டுகோளின் பணிவைத் தெரிவிக்கிறது.
- source_word: וּמֹתְתֵנִי
  choice: என்னைக் கொன்றுவிடு
  rationale: מות என்பதன் காரணவினைப் பொருளான ‘இறக்கச் செய்’ என்பதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֲחָזַנִי הַשָּׁבָץ
  choice: கடுந்துயரம் என்னைப் பற்றிக்கொண்டது
  rationale: אָחַז என்பதன் வலுவான ‘பற்றிக்கொள்’ என்ற பொருளைக் காக்கிறது. அரிதான הַשָּׁבָץ சொல்லின் துல்லியமான உடலியல் பொருள் உறுதியற்றதால், பொதுவான ‘கடுந்துயரம்’ முதன்மை உரையில் வைக்கப்பட்டு மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: כִּי כָל עוֹד נַפְשִׁי בִּי
  choice: ஆனாலும் என் உயிர் இன்னும் என்னில் இருக்கிறது
  rationale: נֶפֶשׁ இங்கு தொழில்நுட்பமான ‘ஆத்துமா’ என்பதைக் காட்டிலும் உயிர்வாழ்வைக் குறிக்கிறது. சூழலில் உள்ள முரண்பாட்டு அல்லது விட்டுக்கொடுக்கும் நுணுக்கத்தை ‘ஆனாலும்’ இயல்பாக வெளிப்படுத்துகிறது; எபிரெயத்தின் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: נֶפֶשׁ என்பதன் பொருள்
  choice: உயிர்
  alternative: ஆத்துமா
  rationale: இவ்விடத்தில் சவுலுக்குள் இன்னும் இருக்கும் உயிராற்றலே குறிக்கப்படுகிறது; மனித இயல்பைப் பற்றிய தனிப்பட்ட கோட்பாட்டை உரையில் புகுத்தாமல் இருக்க ‘உயிர்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரமான தமிழில், கண்ணியமான ஆனால் சாதாரண வாசகருக்குப் புரியும் நடையில் அமைக்கப்பட்டது. போர்க்கள வேண்டுகோளின் நேரடித்தன்மைக்காக ‘கொன்றுவிடு’ பயன்படுத்தப்பட்டது; அரிதான மருத்துவச் சொல்லின் உறுதியின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டது.
