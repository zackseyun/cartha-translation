reference: 2 Samuel 1:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּחֲזֵ֥ק דָּוִ֛ד ב/בגד/ו וַ/יִּקְרָעֵ֑/ם וְ/גַ֥ם כָּל הָ/אֲנָשִׁ֖ים אֲשֶׁ֥ר אִתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/011.yaml
  text: Then David took hold of his clothes and tore them[a], and so did all the men who were with him.
translation:
  language: ta
  text: அப்போது தாவீது தன் உடைகளைப் பிடித்துக் கிழித்தான்[a]; அவனுடன் இருந்த ஆண்கள் அனைவரும் அவ்வாறே செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்பட, “தன் உடையை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲזֵק
  choice: பிடித்துக்
  rationale: חזק என்ற வினை இங்கு உடையைக் கிழிப்பதற்கு முன் அதைப் பற்றிப்பிடிக்கும் உடல் செயலைக் குறிக்கிறது. “பிடித்துக்” என்பது இயல்பான தமிழில் அந்தச் செயலை நேரடியாகத் தெரிவிக்கிறது.
- source_word: בבגדו
  choice: தன் உடைகளை
  rationale: எபிரெய வடிவம் சொற்பட ஒருமையில் “தன் உடையை” என இருந்தாலும், துக்கத்தின் அடையாளமாக உடை கிழித்தலைத் தமிழில் இயல்பாகக் கூற “தன் உடைகளை” என்பது பொருத்தமானது; மூலத்தின் ஒருமை அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: וַיִּקְרָעֵם
  choice: கிழித்தான்
  rationale: קרע என்பது உடையைக் கிழிப்பதைக் குறிக்கிறது. தமிழில் பொருள் முன்பே வெளிப்படுவதால், “கிழித்தான்” என்பது சுருக்கமாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: וְגַם
  choice: அவ்வாறே செய்தார்கள்
  rationale: இணைப்புச் சொல்லும் சேர்க்கைப் பொருளும் தாவீதின் செயலை உடனிருந்த ஆண்களுக்கும் விரிவுபடுத்துகின்றன. தமிழில் விடுபட்ட செயலை இயல்பாக நிறைவு செய்ய “அவ்வாறே செய்தார்கள்” பயன்படுத்தப்பட்டுள்ளது.
- source_word: כָּל הָאֲנָשִׁים
  choice: ஆண்கள் அனைவரும்
  rationale: הָאֲנָשִׁים இங்கு குறிப்பாக ஆண்களைக் குறிக்கிறது; “ஆண்கள் அனைவரும்” பாலினத் துல்லியத்தையும் முழுமையையும் காக்கிறது.
- source_word: אֲשֶׁר אִתּוֹ
  choice: அவனுடன் இருந்த
  rationale: தாவீதுடன் இருந்த துணைவர்களை அடையாளப்படுத்தும் சார்பு வாக்கியத்தை இது நேரடியாகவும் இயல்பாகவும் தருகிறது.
