translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. துக்கத்தின் அடையாளமான உடை கிழித்தல் என்ற செயலை விளக்கிச் சேர்க்காமல், மூலத்தில் உள்ளபடியே வைத்துள்ளது.
