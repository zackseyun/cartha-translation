translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் உரைநடை பயன்படுத்தப்பட்டது. நேரடி உரையாடலின் இயல்பை காக்க ‘என்ன நடந்தது?’ மற்றும் ‘தயவுசெய்து என்னிடம் சொல்’ என வழங்கப்பட்டது. மூல எபிரெயில் இல்லாத இறையியல் விளக்கங்கள் சேர்க்கப்படவில்லை.
