base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/004.yaml
  text: David said to him[a], “What happened? Please tell me.” He said, “The people fled from the battle, and many of the people also fell and died[c][b]; and Saul and Jonathan his son are also dead.”
translation:
  language: ta
  text: தாவீது அவனிடம், “என்ன நடந்தது?[a] தயவுசெய்து என்னிடம் சொல்” என்றான். அதற்கு அவன், “மக்கள் போர்க்களத்திலிருந்து தப்பி ஓடிவிட்டார்கள்; மக்களில் பலர் வீழ்ந்து இறந்துவிட்டார்கள்.[b] மேலும், சவுலும் அவன் மகன் யோனத்தானும் இறந்துவிட்டார்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எழுத்துப்படி, “காரியம் என்னவாயிற்று?”
    reason: lexical_alternative
  - marker: b
    text: “வீழ்ந்தனர்” என்பது போரில் தாக்கப்பட்டு விழுந்ததையோ கொல்லப்பட்டதையோ குறிக்கும் பொதுவான எபிரெயச் சொல்வழக்கு; தொடர்ந்து வரும் “இறந்துவிட்டார்கள்” அதன் முடிவை வெளிப்படையாகக் கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה הָיָה הַדָּבָר
  choice: என்ன நடந்தது?
  rationale: எழுத்துப்படி ‘காரியம் என்னவாயிற்று?’ என்ற எபிரெயச் சொற்றொடர், இச்சூழலில் நிகழ்ந்தவற்றின் முடிவை விசாரிக்கிறது. ‘என்ன நடந்தது?’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: הַגֶּד נָא לִי
  choice: தயவுசெய்து என்னிடம் சொல்
  rationale: הַגֶּד என்பது ‘சொல்/அறிவி’ என்ற கட்டளை; נָא வேண்டுகோள் அல்லது அவசரத் தொனியைச் சேர்க்கிறது.
- source_word: אֲשֶׁר נָס הָעָם מִן הַמִּלְחָמָה
  choice: மக்கள் போர்க்களத்திலிருந்து தப்பி ஓடிவிட்டார்கள்
  rationale: נָס என்பதன் பொருள் ‘தப்பி ஓடினர்.’ מִן הַמִּלְחָמָה என்பது போரிலிருந்து அல்லது போர்க்களத்திலிருந்து விலகி ஓடியதைச் சுட்டுகிறது; தமிழில் ‘போர்க்களத்திலிருந்து’ இச்சூழலுக்கு இயல்பாக உள்ளது.
- source_word: וְגַם הַרְבֵּה נָפַל מִן הָעָם
  choice: மக்களில் பலர் வீழ்ந்து
  rationale: போர்ச் சூழலில் נפל என்பது ‘வீழ்தல்,’ அதாவது தாக்கப்பட்டு விழுதல் அல்லது கொல்லப்படுதல் என்ற வழக்குச் சொல். அடுத்து வரும் ‘இறந்துவிட்டார்கள்’ முடிவை வெளிப்படையாக்குவதால், எபிரெய உருவகத்தை ‘வீழ்ந்து’ எனத் தக்கவைத்துள்ளது.
- source_word: וַיָּמֻתוּ
  choice: இறந்துவிட்டார்கள்
  rationale: ‘வீழ்ந்தனர்’ என்பதுடன் கூடுதலாக மரணத்தை எபிரெய உரை வெளிப்படையாகக் கூறுகிறது; எனவே இரு வினைகளும் மொழிபெயர்ப்பில் தக்கவைக்கப்பட்டன.
- source_word: וְגַם שָׁאוּל וִיהוֹנָתָן בְּנוֹ מֵתוּ
  choice: சவுலும் அவன் மகன் யோனத்தானும் இறந்துவிட்டார்கள்
  rationale: וְגַם என்பதன் ‘மேலும்/கூட’ என்ற சேர்க்கைப் பொருள் தமிழின் இணைப்பு ‘-உம் ... -உம்’ வடிவில் இயல்பாக வெளிப்படுகிறது. ‘அவன் மகன்’ என்ற உறவு மூலத்தில் இருப்பதால் தக்கவைக்கப்பட்டது.
