base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/001.yaml
  text: After the death of Saul[a], when David had returned from striking down the Amalekites, David stayed in Ziklag two days.
translation:
  language: ta
  text: சவுல் இறந்தபின், அமலேக்கியரை[a] வீழ்த்திவிட்டு தாவீது திரும்பிவந்திருந்தான். அவன் சிக்லாகில் இரண்டு நாட்கள் தங்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அமாலேக்’; இது அமலேக்கிய மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் ஒருமை இனப்பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது எபிரெயக் கதைத் தொடரை அமைக்கும் சூத்திரம். நவீன தமிழில் செயற்கையான ‘அப்போது நிகழ்ந்ததாவது’ என்பதைக் காட்டிலும், காலத் தொடரை அடுத்த சொற்றொடரே இயல்பாக உணர்த்துகிறது.
- source_word: אַחֲרֵי מוֹת שָׁאוּל
  choice: சவுல் இறந்தபின்
  rationale: பெயர்ச்சொல் அமைப்பைத் தமிழின் இயல்பான கால வினையெச்சத் தொடராக வழங்குகிறது; மூலத்தின் கால உறவைத் தெளிவாகக் காக்கிறது.
- source_word: וְדָוִד שָׁב
  choice: தாவீது திரும்பிவந்திருந்தான்
  rationale: முதன்மைக் கதை நிகழ்வுக்கு முன்னரே திரும்பிவருதல் நடந்ததை நிறைவுற்ற இறந்தகால வடிவம் தெளிவுபடுத்துகிறது.
- source_word: מֵהַכּוֹת
  choice: வீழ்த்திவிட்டு
  rationale: נכה என்பதன் போர்சார் வன்மையைத் தக்கவைத்தும், முழுமையாக அழித்தொழித்ததாக மிகைப்படுத்தாமலும் வழங்குகிறது.
- source_word: אֶת הָעֲמָלֵק
  choice: அமலேக்கியரை
  rationale: மூலத்தில் ஒருமை இனப்பெயரான ‘அமாலேக்’ ஒரு மக்கள்குழுவைக் கூட்டாகக் குறிக்கிறது; தமிழில் பன்மை மக்கள்பெயர் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיֵּשֶׁב
  choice: தங்கினான்
  rationale: இரண்டு நாட்கள் என்ற குறுகிய காலச் சூழலில் ‘வாழ்ந்தான்’ என்பதைக் காட்டிலும் ‘தங்கினான்’ பொருத்தமானது.
- source_word: בְּצִקְלָג
  choice: சிக்லாகில்
  rationale: இடப்பெயரை வழக்கமான தமிழ் ஒலிபெயர்ப்பிலும் இடவேற்றுமையுடனும் வழங்குகிறது.
- source_word: יָמִים שְׁנָיִם
  choice: இரண்டு நாட்கள்
  rationale: கால அளவைக் குறிக்கும் எபிரெயச் சொற்றொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
