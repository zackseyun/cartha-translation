base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/021.yaml
  text: Mountains of Gilboa[a], let there be no dew or rain upon you, nor fields of offerings; for there the shield of the mighty was defiled, the shield of Saul[b], not anointed with oil.
translation:
  language: ta
  text: 'கில்போவா மலைகளே,


    உங்கள்மேல் பனியோ மழையோ விழாதிருக்கட்டும்;


    காணிக்கைகளின் வயல்களும் இல்லாதிருக்கட்டும்.[a]


    ஏனெனில் அங்கே வலியோரின் கேடயம் இழிவுபடுத்தப்பட்டது—


    சவுலின் கேடயம் எண்ணெயால் பூசப்படாமல் இருந்தது.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “செழிப்பான வயல்களும்,” “முதற்கனிகளின் வயல்களும்,” அல்லது “எடுத்துப்படைக்கும் காணிக்கைகளின் வயல்களும்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயத் தொடர் பொருள் தெளிவற்றது; תְּרוּמוֹת என்ற சொல் கடவுளுக்கென ஒதுக்கப்படும் காணிக்கைகளைப் பல இடங்களில் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இறுதித் தொடர் சவுலையே ‘அபிஷேகம் செய்யப்பட்டவர்’ என்று குறிப்பிடாமல், போருக்கு முன் வழக்கமாகச் செய்வதுபோல் அவரது கேடயம் இனி எண்ணெயால் பூசப்படாத நிலையைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֵי בַגִּלְבֹּעַ
  choice: கில்போவா மலைகளே
  rationale: கில்போவா மலைப்பகுதியை நேரடியாக விளிக்கும் எபிரெயக் கட்டமைப்பையும் புலம்பல் கவிதையின் உயர்ந்த நடையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אַל טַל וְאַל מָטָר עֲלֵיכֶם
  choice: உங்கள்மேல் பனியும் மழையும் பெய்யாதிருக்கட்டும்
  rationale: אַל என்பதன் சாபத்தன்மையுள்ள வேண்டுதலை ‘பெய்யாதிருக்கட்டும்’ எனக் காட்டி, மலைகளை நோக்கிய நேரடி விளிப்பையும் காக்கிறது.
- source_word: וּשְׂדֵי תְרוּמוֹת
  choice: காணிக்கை விளையும் வயல்களும் இல்லாதிருக்கட்டும்
  rationale: கடினமான இத்தொடரில் תְרוּמוֹת என்பதன் கடவுளுக்கென ஒதுக்கப்படும் காணிக்கை என்ற பொதுவான பொருளைத் தக்கவைத்து, தமிழில் வயல்களுக்கும் காணிக்கைக்கும் உள்ள தொடர்பை இயல்பாக வெளிப்படுத்த ‘காணிக்கை விளையும்’ என மொழிபெயர்க்கப்பட்டுள்ளது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: כִּי שָׁם
  choice: ஏனெனில் அங்கே
  rationale: முன்னுள்ள சாபத்தன்மையுள்ள வேண்டுதலுக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: נִגְעַל
  choice: தீட்டுப்பட்டது
  rationale: கேடயம் போரில் இழிவும் அசுத்தமும் அடைந்த நிலையை, தேவையற்ற விளக்கமின்றி, נִגְעַל என்பதன் ‘தீட்டாக்கப்படுதல்’ சார்ந்த பொருளோடு வழங்குகிறது.
- source_word: מָגֵן גִּבּוֹרִים
  choice: வலியோரின் கேடயம்
  rationale: גִּבּוֹרִים என்பதன் வலிமைமிக்க வீரர்கள் என்ற பொருளைச் சுருக்கமாகவும் கவிதைநடைக்கு ஏற்றவாறும் தருகிறது.
- source_word: מָגֵן שָׁאוּל
  choice: சவுலின் கேடயம்
  rationale: முதலில் பொதுவாக ‘வலியோரின் கேடயம்’ என்றும் பின்னர் குறிப்பாக ‘சவுலின் கேடயம்’ என்றும் வரும் எபிரெயக் கவிதை மறுபதிப்பைத் தக்கவைக்கிறது.
- source_word: בְּלִי מָשִׁיחַ בַּשָּׁמֶן
  choice: எண்ணெயால் பூசப்படாமல் கிடந்தது
  rationale: இத்தொடர் தோல் கேடயத்தை எண்ணெயால் பூசித் தயார் செய்வதைக் குறிப்பதாக மிகவும் இயல்பாகப் புரிகிறது. ‘கிடந்தது’ என்பது போர்க்களச் சூழலை தமிழில் தெளிவாக்குகிறது; எபிரெயில் நேரடியாக இல்லாத உவமையைச் சேர்க்கவில்லை.
theological_decisions:
- issue: מָשִׁיחַ என்பதை ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற இறையியல் பட்டமாகத் தவறாகப் புரிந்துகொள்ளும் வாய்ப்பு
  choice: சவுலின் கேடயம் எண்ணெயால் பூசப்படாமல் கிடந்தது
  alternative: எண்ணெயால் அபிஷேகம் செய்யப்பட்ட சவுலுக்குரிய கேடயம் அல்ல
  rationale: בַּשָּׁמֶן (‘எண்ணெயால்’) உடனான அமைப்பும் கேடயத்தை மையமாகக் கொண்ட உடனடிச் சூழலும், இங்கு அரச அல்லது மேசியா சார்ந்த பட்டத்தைவிட கேடயத்திற்கு எண்ணெய் பூசும் நடைமுறையையே சுட்டுகின்றன. ஆயினும் இலக்கணத் தொடர்பில் தோன்றக்கூடிய குழப்பம் அடிக்குறிப்பில் ஒப்புக்கொள்ளப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய ஆனால் புலம்பல் கவிதைக்குரிய கண்ணியமுள்ள உயர்நடை பயன்படுத்தப்பட்டுள்ளது. வரிப்பிரிப்பு எபிரெயக் கவிதையின் விளிப்பு, சாப வேண்டுதல், காரணம், கேடயத்தின் இருமுறை குறிப்பிடுதல் ஆகிய இயக்கங்களை வெளிப்படுத்துகிறது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
