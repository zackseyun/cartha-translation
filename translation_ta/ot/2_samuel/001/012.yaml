source:
  edition: WLC
  text: וַֽ/יִּסְפְּדוּ֙ וַ/יִּבְכּ֔וּ וַ/יָּצֻ֖מוּ עַד הָ/עָ֑רֶב עַל שָׁא֞וּל וְ/עַל יְהוֹנָתָ֣ן בְּנ֗/וֹ וְ/עַל עַ֤ם יְהוָה֙ וְ/עַל בֵּ֣ית יִשְׂרָאֵ֔ל כִּ֥י נָפְל֖וּ בֶּ/חָֽרֶב־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/012.yaml
  text: They mourned[a], wept, and fasted until evening for Saul, for Jonathan his son, for the people of Yahweh, and for the house of Israel[b], because they had fallen by the sword.
translation:
  language: ta
  text: அவர்கள் சவுலுக்காகவும், அவன் மகன் யோனத்தானுக்காகவும், யாவேயின் மக்களுக்காகவும், இஸ்ரவேல் குடும்பத்தாருக்காகவும் புலம்பி அழுது, மாலைவரை நோன்பிருந்தார்கள்; ஏனெனில் சவுலும் யோனத்தானும் யாவேயின் மக்களும் இஸ்ரவேல் குடும்பத்தாரும் வாளால் வீழ்ந்திருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְפְּדוּ
  choice: புலம்பி
  rationale: ספד என்பது இறந்தவர்களுக்காக வெளிப்படையாகப் புலம்பித் துக்கம் அனுசரிப்பதைக் குறிக்கிறது. அடுத்து வரும் ‘அழுது’ என்பதிலிருந்து இதை வேறுபடுத்தவும், மூலத்தின் துக்கச் சூழலைக் காக்கவும் ‘புலம்பி’ ஏற்றது.
- source_word: וַיִּבְכּוּ
  choice: அழுது
  rationale: בכה என்பதன் நேரடியான பொருள் அழுதல்; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיָּצֻמוּ
  choice: நோன்பிருந்தார்கள்
  rationale: צום என்பது உணவைத் தவிர்த்து நோன்பிருப்பதைக் குறிக்கிறது. துக்கத்தின் வெளிப்பாடாகிய நோன்பை இச்சொல் இயல்பாக எடுத்துரைக்கிறது.
- source_word: עַד הָעָרֶב
  choice: மாலைவரை
  rationale: துக்கமும் நோன்பும் நீடித்த காலத்தின் முடிவைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: עַל
  choice: -க்காக
  rationale: மீண்டும் மீண்டும் வரும் עַל, யாரை முன்னிட்டு அவர்கள் துக்கம் அனுசரித்தார்கள் என்பதை அறிமுகப்படுத்துகிறது; தமிழில் ‘-க்காக’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: அவன் மகன் யோனத்தான்
  rationale: ‘அவன் மகன்’ என்பது சவுலின் மகனாக யோனத்தானை அடையாளப்படுத்தும் எபிரெயச் சேர்க்கையைத் தெளிவாகக் காக்கிறது.
- source_word: עַם יְהוָה
  choice: யாவேயின் மக்கள்
  rationale: கட்டமைப்பின் நேரடிப் பொருளைத் தக்கவைத்து, தேவனுடைய தனிப்பெயரான יהוה-ஐ ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
- source_word: בֵּית יִשְׂרָאֵל
  choice: இஸ்ரவேல் வீட்டார்
  rationale: இது இஸ்ரவேல் சமூகத்தை ஒட்டுமொத்தமாகக் குறிக்கும் வழக்குச் சொற்றொடர். ‘வீட்டார்’ அதன் குடும்ப/கூட்டுத் தன்மையைக் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய துக்கத்திற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: נָפְלוּ
  choice: வீழ்ந்திருந்தார்கள்
  rationale: போரில் இறந்ததை ‘வீழ்தல்’ என்ற மூல உருவகத்துடன் காக்கிறது; இறப்புக்குப் பின் நிகழ்ந்த துக்கத்தைத் தமிழில் இறந்தகால நிறைவாக வெளிப்படுத்துகிறது.
- source_word: בֶּחָרֶב
  choice: வாளால்
  rationale: வன்முறைமிக்க போர்மரணத்தைச் சுட்டும் மூலத்தின் ‘வாள்’ உருவகத்தைப் பொது சொலாக மாற்றாமல் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தேவனுடைய தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- issue: ‘யாவேயின் மக்கள்’ மற்றும் ‘இஸ்ரவேல் வீட்டார்’ ஆகியவற்றின் உறவு
  choice: மூலத்தில் உள்ள இரு தனித்த இணைச் சொற்றொடர்களும் அப்படியே வைக்கப்பட்டன
  alternative: இரண்டையும் ‘இஸ்ரவேல் மக்கள்’ என்று ஒன்றிணைத்தல்
  rationale: இரு குறிப்புகளும் ஒரே சமூகத்தை வெவ்வேறு கோணங்களில் சுட்டக்கூடும்; எனினும் மூலத்தின் மீளுரையையும் சாத்தியமான நுண்ணிய வேறுபாட்டையும் அழிக்காமல் இரண்டும் பாதுகாக்கப்பட்டன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமான துக்கநடை பயன்படுத்தப்பட்டுள்ளது. ‘புலம்பி’ மற்றும் ‘அழுது’ என்ற இரு வினைகளும் மூலத்தின் தனித்த செயல்களைப் பாதுகாக்கின்றன; ‘இஸ்ரவேல் வீட்டார்’ என்ற வடிவம் வேதாகமக் கூட்டுப்பொருளை இயல்பான தமிழில் தக்கவைக்கிறது.
