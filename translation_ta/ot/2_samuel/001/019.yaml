  register: நவீனத் தரத் தமிழில், புலம்பலுக்குரிய கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இஸ்ரவேலே’ என்ற விளி நேரடி அழைப்பைப் பாதுகாக்கிறது; இரண்டு குறும் வியப்புவாக்கியங்கள் எபிரெய மூலத்தின் தீவிரத்தையும் பல்லவித் தன்மையையும் பிரதிபலிக்கின்றன.
