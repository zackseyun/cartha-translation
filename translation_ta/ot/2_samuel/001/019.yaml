source:
  edition: WLC
  text: הַ/צְּבִי֙ יִשְׂרָאֵ֔ל עַל בָּמוֹתֶ֖י/ךָ חָלָ֑ל אֵ֖יךְ נָפְל֥וּ גִבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/019.yaml
  text: Your glory[a], O Israel[b], lies slain on your heights! How the mighty have fallen!
translation:
  language: ta
  text: இஸ்ரவேலே, உன் மகிமை[a] உன் மேடுகளில்[b] கொல்லப்பட்டுக் கிடக்கிறது! வலிமைமிக்கவர்கள் எப்படி வீழ்ந்தார்கள்!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லை ‘அழகு’ அல்லது ‘சிறப்பு’ என்றும் மொழிபெயர்க்கலாம்; சிலர் அதை நேரடியாக ‘மான்’ என்று பொருள்கொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, ‘உயர்ந்த இடங்களில்.’ இங்கு நிலவியல் பொருளைக் காக்கவும், வழிபாட்டுக்குரிய மேடைகள் என்ற பொருள் தேவையின்றி தோன்றுவதைத் தவிர்க்கவும் ‘மேடுகள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּבִי
  choice: உன் மகிமை
  rationale: צְבִי என்பது அழகு, சிறப்பு, மகிமை என்பவற்றைக் குறிக்கலாம்; மான் என்றும் பொருள்படலாம். சவுலையும் யோனத்தானையும் குறித்த புலம்பலின் சூழலில், இஸ்ரவேலின் பெருமையாக விளங்கியவரைக் குறிக்கும் உருவகப் பொருளான ‘உன் மகிமை’ இயல்பாகப் பொருந்துகிறது; எபிரெய உரையின் பொருள் இரட்டிப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேலே
  rationale: நேரடியாக அழைக்கும் விளியைத் தமிழ் விளிவேற்றுமை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל
  choice: மேல் / இல்
  rationale: இடத்தைக் குறிக்கும் முன்னிடைச்சொல்; தமிழில் ‘உன் மேடுகளில் ... கிடக்கிறது’ என்ற அமைப்பில் இடப்பொருள் இயல்பாக வெளிப்படுகிறது.
- source_word: בָּמוֹתֶיךָ
  choice: உன் மேடுகளில்
  rationale: במות என்பது உயர்ந்த இடங்கள் அல்லது மேடுகளைக் குறிக்கிறது. ‘மேடுகள்’ நிலவியல் பொருளைப் பாதுகாத்து, வழிபாட்டுக்குரிய ‘மேடைகள்’ என்ற தேவையற்ற குறிப்பைத் தவிர்க்கிறது.
- source_word: חָלָל
  choice: கொல்லப்பட்டுக் கிடக்கிறது
  rationale: இச்சொல் கொல்லப்பட்ட ஒருவரையோ கொல்லப்பட்ட நிலையையோ குறிக்கிறது. தமிழில் இவ்வாறு வினையடையாக மொழிபெயர்ப்பது அந்த நிலையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֵיךְ
  choice: எப்படி
  rationale: புலம்பலின் வியப்பும் துயரமும் நிறைந்த கேள்வித்தன்மையைப் பாதுகாக்கிறது.
- source_word: נָפְלוּ
  choice: வீழ்ந்தார்கள்
  rationale: நடந்து முடிந்த துயர நிகழ்வை புலம்பல் நடையில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: גִבּוֹרִים
  choice: வலிமைமிக்கவர்கள்
  rationale: גִּבּוֹרִים என்பது வலிமைமிக்கவர்கள், வீரர்கள், போர்வீரர்கள் எனப் பொருள்படலாம். ‘வலிமைமிக்கவர்கள்’ கவிதையின் பரந்த பொருளையும் மீண்டும் வரும் பல்லவித் தன்மையையும் பாதுகாக்கிறது.
