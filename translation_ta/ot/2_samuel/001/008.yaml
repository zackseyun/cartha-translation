  source_fidelity: முதற் கூற்று சவுல் அமலேக்கியனிடம் கேட்ட கேள்வியாகவும், அடுத்தது அமலேக்கியன் சவுலுக்குத் தந்த பதிலாகவும் துல்லியமாகத் தரப்பட்டுள்ளது. இரண்டாம் וַיֹּאמֶר வடிவத்தின் வெளிப்படையான மூன்றாம் நபர் வடிவத்துக்கும் உரையாடல் சூழல் கோரும் முதல் நபர் பொருளுக்கும் உள்ள பதற்றம் அடிக்குறிப்பில் நியாயமாகப் பாதுகாக்கப்பட்டுள்ளது.
  naturalness: «நீ யார்?» மற்றும் «நான் ஓர் அமலேக்கியன்» ஆகியவை நவீன நிலையான தமிழில் இயல்பான, தெளிவான நேரடிப் பேச்சாக உள்ளன. கேள்வியை அறிமுகப்படுத்த «கேட்டான்» என்பதும் இயல்பானது; பொருளை மாற்றுவதில்லை.
  terminology: «அமலேக்கியன்» என்பது עֲמָלֵקִי என்பதற்கான நிலையான தமிழ்வேதாகம இனப்பெயர் வடிவமாகும். «ஓர்» என்ற நிர்ணயமற்ற குறியீடு தமிழில் சுயஅடையாளக் கூற்றுக்கு ஏற்றது.
