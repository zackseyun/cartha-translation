translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. நேரடிப் பேச்சு இயல்பாக அமைக்கப்பட்டது; எபிரெய வினை வடிவத்துக்கும் சூழல் கோரும் பேசுபவருக்கும் இடையிலான பதற்றம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டது.
