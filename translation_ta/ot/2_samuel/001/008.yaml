source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר לִ֖/י מִי אָ֑תָּה ו/יאמר אֵלָ֔י/ו עֲמָלֵקִ֖י אָנֹֽכִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/008.yaml
  text: He said to me[a], ‘Who are you?’ And I said to him, ‘I am an Amalekite.’
translation:
  language: ta
  text: அவன் என்னிடம்[a], “நீ யார்?” என்று கேட்டான். அதற்கு நான் அவனிடம், “நான் ஓர் அமலேக்கியன்” என்று சொன்னேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையின் இரண்டாவது ‘சொன்னான்’ என்ற வினை வடிவம் எழுத்துப்படி, ‘அவன் அவனிடம் சொன்னான்’ என உள்ளது. ஆனால் இங்கு அமலேக்கியன் சவுலுக்குத் தான் அளித்த பதிலை விவரிப்பதால், பொருள் ‘நான் அவனிடம் சொன்னேன்’ என்பதாகும்.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: அவன் என்னிடம் … என்று கேட்டான்
  rationale: சவுல் பேசியதைக் குறிக்கும் தொடர்கதை வினை. நேரடிக் கேள்வியை அறிமுகப்படுத்துவதால், நவீனத் தமிழில் இயல்பாக ‘கேட்டான்’ என வழங்கப்பட்டது; לִי என்பது ‘என்னிடம்’.
- source_word: מִי אַתָּה
  choice: நீ யார்?
  rationale: מִי என்பது ‘யார்’; אַתָּה என்பது இரண்டாம் நபர் ஆண்பால் ஒருமை. வினையற்ற எபிரெயக் கேள்வி தமிழில் இயல்பான ‘நீ யார்?’ எனத் தரப்பட்டது.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: அதற்கு நான் அவனிடம் … என்று சொன்னேன்
  rationale: மசோரா உரையின் வினை வடிவம் எழுத்துப்படி ‘அவன் சொன்னான்’ (மூன்றாம் நபர் ஆண்பால் ஒருமை) என்றாலும், உரையாடல் சூழலில் சவுலுக்கு மறுமொழி அளிப்பது கதைசொல்லும் அமலேக்கியன். பொருள் ‘நான் சொன்னேன்’ என முதன்மை உரையில் தரப்பட்டு, வடிவ வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது. אֵלָיו என்பது ‘அவனிடம்’.
- source_word: עֲמָלֵקִי
  choice: ஓர் அமலேக்கியன்
  rationale: இன/மக்களின அடையாளத்தைக் குறிக்கும் பெயர்; தன்னை அடையாளப்படுத்தும் தமிழ்ச் சொற்றொடரில் ‘ஓர் அமலேக்கியன்’ இயல்பாக உள்ளது.
- source_word: אָנֹכִי
  choice: நான்
  rationale: வலியுறுத்தலுடன் வரும் தனிநிலை முதலாம் நபர் ஒருமைப் பெயர்ச்சொல். தமிழின் பெயர்ப் பயனிலை வாக்கியத்தில் நிகழ்கால இணைப்புவினை தேவையில்லை.
