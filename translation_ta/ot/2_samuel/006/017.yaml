  text: וַ/יָּבִ֜אוּ אֶת אֲר֣וֹן יְהוָ֗ה וַ/יַּצִּ֤גוּ אֹת/וֹ֙ בִּ/מְקוֹמ֔/וֹ בְּ/ת֣וֹךְ הָ/אֹ֔הֶל אֲשֶׁ֥ר נָטָה ל֖/וֹ דָּוִ֑ד וַ/יַּ֨עַל דָּוִ֥ד עֹל֛וֹת לִ/פְנֵ֥י יְהוָ֖ה וּ/שְׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/017.yaml
  text: They brought in the ark of Yahweh and set it in its place[a], inside the tent that David had pitched for it. And David offered burnt offerings and peace offerings before Yahweh.
translation:
  language: ta
  text: அவர்கள் யாவேயின் பேழையைக் கொண்டுவந்து, தாவீது அதற்காகக் கூடாரம் அடித்திருந்த இடத்தில், அந்தக் கூடாரத்திற்குள் அதற்குரிய இடத்தில் வைத்தார்கள். பின்பு தாவீது யாவேயின் முன்னிலையில் தகனபலிகளையும் சமாதானபலிகளையும்[a] செலுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சமாதானபலிகள்” என்பதை “உறவுப்பலிகள்” அல்லது “நலவாழ்வுப் பலிகள்” என்றும் மொழிபெயர்க்கலாம்; எபிரேயச் சொல் שְׁלָמִים சமாதானம், நலம், பங்குறவு ஆகிய பொருள் நிழல்களைக் கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: யாவேயின் உடன்படிக்கைப் பெட்டி
  rationale: אֲרוֹן என்பது பெட்டி; இச்சமயச் சூழலில் தமிழில் தெளிவாகவும் வழக்காகவும் புரிய ‘உடன்படிக்கைப் பெட்டி’ என வழங்கப்பட்டது. יְהוָה தனிப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיָּבִאוּ
  choice: கொண்டுவந்து
  rationale: בוא என்பதன் ஹிஃபீல் வடிவம் ஒன்றை உள்ளே அல்லது குறித்த இடத்திற்குக் கொண்டுவருதலைக் குறிக்கிறது.
- source_word: וַיַּצִּגוּ אֹתוֹ בִּמְקוֹמוֹ
  choice: அதற்குரிய இடத்தில் வைத்தார்கள்
  rationale: יצג இங்கு திட்டமிட்ட இடத்தில் நிலைநிறுத்தி வைப்பதைக் குறிக்கிறது; ‘அதற்குரிய இடம்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: בְּתוֹךְ הָאֹהֶל
  choice: கூடாரத்தின் நடுவே
  rationale: בְּתוֹךְ என்பது உள்ளே அல்லது நடுவில் என்ற இடப்பொருளைக் கொண்டது; எபிரேயச் சொல்லமைப்பை மதித்து ‘நடுவே’ என வழங்கப்பட்டது.
- source_word: אֲשֶׁר נָטָה לוֹ דָּוִד
  choice: தாவீது அதற்காக அமைத்திருந்த
  rationale: கூடாரத்தோடு வரும் נטה என்பது விரித்து அமைத்தல் அல்லது கூடாரம் அடித்தல்; பிரதிப்பெயர் பெட்டியைக் குறிக்கிறது. முன்பே நிகழ்ந்த செயலை ‘அமைத்திருந்த’ காட்டுகிறது.
- source_word: וַיַּעַל דָּוִד
  choice: தாவீது ... செலுத்தினார்
  rationale: עלה பலிச்சூழலில் பலியைச் செலுத்துதல் அல்லது மேலே ஏற்றுதல் என்ற சிறப்புப் பொருளில் வருகிறது.
- source_word: עֹלוֹת
  choice: தகனபலிகள்
  rationale: עֹלָה முழுவதும் எரித்துச் செலுத்தப்படும் பலிக்கான நிலையான சமயச் சொல்; ‘தகனபலி’ சுருக்கமாகவும் அடையாளப்படுத்தத்தக்கதாகவும் உள்ளது.
- source_word: שְׁלָמִים
  choice: சமாதானபலிகள்
  rationale: שְׁלָמִים என்பதன் பாரம்பரியமான பொருள் ‘சமாதானபலிகள்’; நல்லுறவு, நலவாழ்வு, பங்குறவு ஆகிய பொருள் நிழல்களை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேயின் முன்னிலையில்
  rationale: לִפְנֵי என்பது ‘முன்பாக’ அல்லது ‘முன்னிலையில்’ எனப் பொருள்படும்; இங்கு தெய்வீகச் சந்நிதியை இயல்பாக வெளிப்படுத்த ‘முன்னிலையில்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளாலான இறைத் தனிப்பெயர் நேரடியாக உள்ளது. எனவே அதைத் தலைப்பாக மாற்றாமல் தமிழில் ‘யாவே’ என ஒலிபெயர்த்தது.
- issue: שְׁלָמִים பலியின் பொருள் வரம்பு
  choice: சமாதானபலிகள்
  alternative: உறவுப்பலிகள் / நல்வாழ்வுப் பலிகள்
  rationale: சொல் சமாதானம் மட்டுமன்றி நலம், முழுமை, இறைவனோடும் சமூகத்தோடும் பங்குறவு ஆகியவற்றையும் சுட்டலாம். பிரதான உரையில் பழக்கமான சொல்லை வைத்து, மாற்றுப் பொருள்களை அடிக்குறிப்பில் குறிப்பிட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. பலி தொடர்பான அடையாளப்படுத்தத்தக்க சொற்கள் தக்கவைக்கப்பட்டு, மூலத்தின் பொருள் விரிவு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
