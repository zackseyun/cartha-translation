source:
  edition: WLC
  text: וְ/הָיָה֙ אֲר֣וֹן יְהוָ֔ה בָּ֖א עִ֣יר דָּוִ֑ד וּ/מִיכַ֨ל בַּת שָׁא֜וּל נִשְׁקְפָ֣ה בְּעַ֣ד הַ/חַלּ֗וֹן וַ/תֵּ֨רֶא אֶת הַ/מֶּ֤לֶךְ דָּוִד֙ מְפַזֵּ֤ז וּ/מְכַרְכֵּר֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּ֥בֶז ל֖/וֹ בְּ/לִבָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/016.yaml
  text: As the ark of Yahweh was coming into the city of David[a], Michal daughter of Saul looked out through the window and saw King David leaping and whirling before Yahweh, and she despised him in her heart.
translation:
  language: ta
  text: யாவேயின் பேழை தாவீதின் நகரத்திற்குள் வந்துகொண்டிருந்தபோது, சவுலின் மகள் மீகாள் சன்னல் வழியாக வெளியே பார்த்தாள்; யாவேயின் முன்னிலையில் அரசன் தாவீது துள்ளிக் குதித்துச் சுழன்றுகொண்டிருப்பதை[a] அவள் கண்டு, தன் உள்ளத்தில் அவரை இகழ்ந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், ‘துள்ளிக் குதித்துச் சுழன்றுகொண்டிருப்பதை’; இவ்விரு வினைச்சொற்களும் யாவேயின் முன்னிலையில் நிகழ்ந்த உற்சாகமான கொண்டாட்ட அசைவுகளைச் சித்தரிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה ... בָּא
  choice: வந்துகொண்டிருந்தபோது
  rationale: பேழை நகருக்குள் வரும் செயல் நடந்துகொண்டிருக்கையில் மீகாள் பார்த்தாள் என்ற காலச் சூழலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲרוֹן יְהוָה
  choice: யாவேயின் பேழை
  rationale: אֲרוֹן என்பதற்கு மரியாதையும் வேதாகமச் சூழலுக்கேற்ற தன்மையும் கொண்ட ‘பேழை’ பயன்படுத்தப்பட்டுள்ளது; உடன்படிக்கை என்ற சொல் மூலத்தில் இல்லாததால் சேர்க்கப்படவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்க, பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עִיר דָּוִד
  choice: தாவீதின் நகரம்
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவாகவும் இயல்பாகவும் தரும் நிலையான இடப்பெயர் வடிவம்.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: சவுலின் மகள் மீகாள்
  rationale: உறவுமுறை அடையாளத்தைப் பாதுகாத்து, தமிழின் இயல்பான சொல் வரிசையில் தரப்பட்டுள்ளது.
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: சன்னல் வழியாக வெளியே பார்த்தாள்
  rationale: மூடப்பட்ட அல்லது உயர்ந்த இடத்திலிருந்து வெளியே நோக்கும் செயலைக் காட்டுகிறது; கீழே பார்த்தாள் என்று மூலத்தைவிடக் குறிப்பாக்கவில்லை.
- source_word: מְפַזֵּז
  choice: துள்ளிக் குதித்து
  rationale: அரிதான இவ்வினைச்சொல் உற்சாகமான, மேலெழும் உடல் அசைவைக் குறிக்கிறது; அந்த உயிரோட்டத்தைத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: מְכַרְכֵּר
  choice: சுழன்று
  rationale: திரும்புதல் அல்லது சுழலுதல் சார்ந்த அசைவைப் பாதுகாத்து, முந்தைய வினையுடன் ஒன்றாகக் கலக்காமல் தனித்துவமாகக் காட்டுகிறது.
- source_word: וַתִּבֶז לוֹ בְּלִבָּהּ
  choice: தன் உள்ளத்தில் அவரை இகழ்ந்தாள்
  rationale: மீகாளின் இகழ்ச்சி வெளிப்படையாகச் சொல்லப்படாமல் அவளுடைய உள்ளத்தில் ஏற்பட்டது என்ற மூலத்தின் மனநிலைக் குறிப்பை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல எபிரெய உரையில் தனிப்பட்ட இறைநாமம் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது உரையின் பெயர்சார் தன்மையைப் பாதுகாக்கிறது.
- issue: தாவீதின் அசைவுகளை பொதுவாக ‘நடனம்’ என்று சுருக்கலாமா
  choice: துள்ளிக் குதித்துச் சுழன்றுகொண்டிருப்பதை
  alternative: நடனமாடிக்கொண்டிருப்பதை
  rationale: மூலத்தில் இரண்டு வேறுபட்ட, உயிரோட்டமான அசைவு வினைகள் உள்ளன. அவற்றை ‘நடனம்’ என்ற ஒரே சொல்லால் சமப்படுத்தாமல் இரு படிமங்களையும் வைத்திருக்கிறது; அசைவுகளின் துல்லிய வடிவம் குறித்த இயல்பான தெளிவின்மையும் நீடிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘பேழை’ என்பது சூழலுக்குரிய மரியாதையைப் பேணுகிறது; ‘சன்னல்’, ‘உள்ளத்தில் இகழ்ந்தாள்’ போன்ற வடிவங்கள் தெளிவான தற்போதைய பயன்பாட்டை வழங்குகின்றன.
