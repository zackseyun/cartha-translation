base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/019.yaml
  text: He distributed to all the people[a], to the whole multitude of Israel, from man to woman, to each person one loaf of bread, one portion of meat, and one raisin cake. Then all the people went away[b], each to his house.
translation:
  language: ta
  text: அவர் மக்கள் அனைவருக்கும்—இஸ்ரவேலின் மொத்தத் திரளுக்கும், ஆண் முதல் பெண் வரை[b]—ஆளுக்கு ஓர் அப்பமும், ஒரு பங்கு இறைச்சியும்[a], ஓர் உலர் திராட்சை அடையும் வழங்கினார். பின்பு மக்கள் அனைவரும் அவரவர் வீட்டுக்குச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒரு அளவு’ அல்லது ‘ஒரு பங்கு’ என்றும் மொழிபெயர்க்கலாம். אֶשְׁפָּר என்ற எபிரேயச் சொல் மிகவும் அரிதானது. குறிப்பாக 1 நாளாகமம் 16:3-இல் உள்ள இணை நிகழ்வின் அடிப்படையில், இங்கு அது இறைச்சியின் ஒரு பங்கைக் குறிக்கிறது என்று பலர் கருதுகின்றனர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், ‘ஆண் முதல் பெண் வரை.’ கூடியிருந்த ஆண்களும் பெண்களுமாகிய அனைவரையும் குறிக்கும் மரபுத்தொடர் இது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: வழங்கினார்
  rationale: פיעל வடிவிலுள்ள வினை, திரண்டிருந்த மக்களுக்குப் பங்குகளைப் பகிர்ந்து கொடுத்த செயலைக் குறிக்கிறது. ‘வழங்கினார்’ என்பது இயல்பான நவீனத் தமிழில் அந்தச் செயலைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: לְכָל הָעָם / לְכָל הֲמוֹן יִשְׂרָאֵל
  choice: மக்கள் அனைவருக்கும்—இஸ்ரவேலின் மொத்தத் திரளுக்கும்
  rationale: எபிரேயத்தில் உள்ள இணையான இரு சொற்றொடர்களின் வலியுறுத்தலையும் முழுமையையும் ஒழிக்காமல் தமிழில் இயல்பாக வைத்திருக்கிறது.
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: ஆண் முதல் பெண் வரை
  rationale: கூடியிருந்த ஆண்களும் பெண்களும் அனைவரும் இதில் அடங்கினர் என்பதைக் காட்டும் எபிரேய மரபுத்தொடரின் உருவகத்தையும் பரப்பையும் காக்கிறது.
- source_word: לְאִישׁ
  choice: ஆளுக்கு
  rationale: முந்தைய சொற்றொடர் ஆண்களையும் பெண்களையும் வெளிப்படையாக உள்ளடக்குவதால், இங்குள்ள பகிர்ந்தளிக்கும் ஒருமைப் பொருளை ‘ஆளுக்கு’ இயல்பாகத் தருகிறது.
- source_word: חַלַּת לֶחֶם אַחַת
  choice: ஓர் அப்பம்
  rationale: חַלָּה இங்கு ஓர் அப்பம் அல்லது ரொட்டி அடையைக் குறிக்கிறது; ‘ஓர் அப்பம்’ பொதுவான வாசகருக்குத் தெளிவாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: אֶשְׁפָּר אֶחָד
  choice: ஒரு பங்கு இறைச்சி
  rationale: אֶשְׁפָּר மிகவும் அரிதான, பொருள் விவாதத்திற்குரிய சொல். 1 நாளாகமம் 16:3-இன் இணை நிகழ்வை முன்னிட்டு ‘ஒரு பங்கு இறைச்சி’ என்பது சாத்தியமான பொருளைத் தருகிறது; அடிக்குறிப்பு நிச்சயமின்மையைப் பாதுகாக்கிறது.
- source_word: אֲשִׁישָׁה אֶחָת
  choice: ஓர் உலர் திராட்சை அடை
  rationale: இந்தச் சொல் அழுத்திச் செய்யப்பட்ட பழ அடையை, பொதுவாக உலர் திராட்சை அடையை, குறிக்கும் எனப் புரிந்துகொள்ளப்படுகிறது. தேர்வு நவீனத் தமிழில் உணவுப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיֵּלֶךְ כָּל הָעָם אִישׁ לְבֵיתוֹ
  choice: பின்பு மக்கள் அனைவரும் அவரவர் வீட்டுக்குச் சென்றார்கள்
  rationale: பங்கீட்டுக்குப் பின் மக்கள் கலைந்து சென்றதை இயல்பாகச் சொல்கிறது; ‘அவரவர்’ எபிரேயத்தின் பகிர்ந்தளிக்கும் ஒருமைப் பொருளைக் காக்கிறது.
