translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகருக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரேயத்தின் இரட்டை வலியுறுத்தல் காக்கப்பட்டுள்ளது; அரிய சொல்லான אֶשְׁפָּר பற்றிய நிச்சயமின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களின் அருகே வைக்கப்பட்டுள்ளன.
