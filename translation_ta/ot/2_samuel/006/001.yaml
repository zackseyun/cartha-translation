translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மொழியின் சுருக்கமான வினை அமைப்பு தமிழில் இயல்பாக இருக்க ‘ஒன்றுகூட்டினார்’ என வெளிப்படுத்தப்பட்டுள்ளது; בָּחוּר என்பதிலுள்ள சொற்பொருள் இருமை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
