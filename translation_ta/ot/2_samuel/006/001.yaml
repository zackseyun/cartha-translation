reference: 2 Samuel 6:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֨סֶף ע֥וֹד דָּוִ֛ד אֶת כָּל בָּח֥וּר בְּ/יִשְׂרָאֵ֖ל שְׁלֹשִׁ֥ים אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/001.yaml
  text: David again gathered all the chosen men of Israel[a], thirty thousand.
translation:
  language: ta
  text: தாவீது இஸ்ரவேலின் தேர்ந்தெடுக்கப்பட்ட ஆண்கள்[a] அனைவரையும் மீண்டும் ஒன்றுகூட்டினார்; அவர்கள் முப்பதாயிரம் பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இளைஞர்கள்’ அல்லது ‘தேர்ந்தெடுக்கப்பட்ட சிறந்த ஆண்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் בָּחוּר இளமையையோ தேர்ந்தெடுக்கப்பட்ட சிறப்பையோ குறிக்கக்கூடும்; இங்கு ஆட்களைத் திரட்டும் சூழல் இரண்டாவது பொருளுக்கு ஆதரவளிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד
  choice: மீண்டும்
  rationale: יָסַף + עוֹד என்ற எபிரெய மரபுத்தொடர் இங்கு மேலும் சேர்த்தலைவிட, ஒரு செயலை மறுபடியும் செய்ததைக் குறிக்கிறது.
- source_word: אֶת כָּל
  choice: அனைவரையும்
  rationale: אֶת என்பது நேரடி செயப்படுபொருள் குறியீடு; כָּל முழுத் தொகுதியையும் குறிக்கிறது. மனிதர்களைக் குறிக்கும் இயல்பான தமிழில் இரண்டும் சேர்த்து ‘அனைவரையும்’ என வழங்கப்பட்டுள்ளது.
- source_word: בָּחוּר
  choice: தேர்ந்தெடுக்கப்பட்ட ஆண்கள்
  rationale: בָּחוּר என்பது இளைஞர்களையோ தேர்ந்தெடுக்கப்பட்ட சிறந்த ஆண்களையோ குறிக்கலாம். பெரும் எண்ணிக்கையிலானோர் ஒன்றுகூட்டப்படும் இச்சூழலில் ‘தேர்ந்தெடுக்கப்பட்ட ஆண்கள்’ பொருத்தமானது; உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலின்
  rationale: בְּ என்ற முன்னிடைச்சொல் சொற்சொல்லாக ‘இஸ்ரவேலில்’ எனப் பொருள்படலாம்; இக்கூட்டுத் தேர்வு அமைப்பில் இஸ்ரவேலைச் சேர்ந்தவர்கள் என்ற பகுதிப்பொருளை இயல்பான தமிழில் ‘இஸ்ரவேலின்’ எனத் தருகிறது.
- source_word: שְׁלֹשִׁים אָלֶף
  choice: முப்பதாயிரம் பேர்
  rationale: எண்ணிக்கை நேரடியாக மொழிபெயர்க்கப்பட்டு, மனிதர்களின் எண்ணிக்கை என்பதைத் தெளிவாகவும் இயல்பாகவும் கூற ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: וַיֹּסֶף ... אֶת כָּל
  choice: அனைவரையும் மீண்டும் ஒன்றுகூட்டினார்
  rationale: எபிரெய வாக்கியத்தில் ‘சேர்த்தார்/மீண்டும் செய்தார்’ என்ற வினை அமைப்பு சுருக்கமாக உள்ளது. சூழலில் மக்களைத் திரட்டிய செயலைக் குறிக்கும் என்பதால் தமிழில் ‘ஒன்றுகூட்டினார்’ எனத் தெளிவாக்கப்பட்டுள்ளது.
