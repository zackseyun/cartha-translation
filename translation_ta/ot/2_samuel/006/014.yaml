base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/014.yaml
  text: And David was dancing with all his might before Yahweh[b][a], and David was wearing a linen ephod.
translation:
  language: ta
  text: தாவீது தன் முழு வலிமையோடும் யாவேவின் முன்னிலையில் நடனமாடிக்கொண்டிருந்தான்[a]; தாவீது லினன் துணியாலான ஏபோத்தை அணிந்திருந்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சுழன்று ஆடிக்கொண்டிருந்தான்” அல்லது “துள்ளி ஆடிக்கொண்டிருந்தான்” என்றும் மொழிபெயர்க்கலாம்; எபிரேயச் சொல் கொண்டாட்டம் நிறைந்த தீவிரமான அசைவைக் காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ஏபோத்து என்பது ஆசாரியப் பணியோடு அல்லது வழிபாட்டோடு தொடர்புடைய தனித்துவமான ஆடை; இங்கு தாவீது லினன் துணியாலான ஏபோத்தை அணிந்திருந்ததாகக் கூறப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: מְכַרְכֵּר
  choice: நடனமாடிக்கொண்டிருந்தான்
  rationale: இச்சொல் கொண்டாட்டத்தில் நிகழும் தீவிரமான உடல் அசைவைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் ‘நடனமாடிக்கொண்டிருந்தான்’ என்பது தெளிவாக உள்ளது; சுழன்று ஆடுதல் அல்லது துள்ளி ஆடுதல் ஆகிய சாத்திய நுண்பொருள்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- source_word: בְּכָל עֹז
  choice: தன் முழு வலிமையோடும்
  rationale: எவ்விதக் குறைவுமின்றி முழு ஆற்றலுடன் செயல்பட்டதை இத்தொடர் தெரிவிக்கிறது; தமிழில் இயல்பாகவும் மூலத்தின் தீவிரத்தைக் காக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பது ‘முன்பாக/சந்நிதியில்’ எனப் பொருள்படும். இங்கு சுருக்கமான ‘முன்பாக’ என்பது கடவுளின் முன்னிலையில் நடந்த செயலைத் தெளிவாகக் கூறுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மெய்யெழுத்துப் பெயரான יהוה என்பதை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: חָגוּר
  choice: அணிந்திருந்தான்
  rationale: இந்த வடிவம் ஓர் ஆடையை உடுத்தியிருந்த நிலையைச் சுட்டுகிறது. ‘அணிந்திருந்தான்’ என்பது பழமையான ‘அரையில் கட்டியிருந்தான்’ போன்ற சொல்லாட்சியைவிட இயல்பானது.
- source_word: אֵפוֹד
  choice: ஏபோத்து
  rationale: இது இஸ்ரவேலரின் வழிபாட்டுடன் தொடர்புடைய தனித்துவமான ஆடை; துல்லியமான தமிழ் இணைச்சொல் இல்லாததால் தொழில்நுட்பச் சொல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בָּד
  choice: நாரிழையால் செய்யப்பட்ட
  rationale: בָּד இங்கு வழிபாட்டு ஆடைக்குப் பயன்படுத்தப்பட்ட தாவர நாரினால் நெய்யப்பட்ட துணியைக் குறிக்கிறது. வழக்கமாக ‘மெல்லிய சணல் நார்’ அல்லது ‘லினன்’ எனக் கூறப்பட்டாலும், மூலத்தில் துணியின் தரம் வெளிப்படையாகக் குறிப்பிடப்படாததால் பொதுவான விளக்கம் தேர்ந்தெடுக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: வசனத்தில் தனிப்பட்ட இறைப்பெயரான יהוה நேரடியாக உள்ளது. அதைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. தொடர்ச்சியான செயலை எபிரேயப் பங்கேற்பெயருக்கு ஏற்ப ‘நடனமாடிக்கொண்டிருந்தான்’ எனக் காட்டுகிறது. தொழில்நுட்ப வழிபாட்டு ஆடையின் பெயர் விளக்கமாக மாற்றப்படாமல் ஒலிபெயர்க்கப்பட்டு, அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
