  text: וַ/יִּרָ֥א דָוִ֛ד אֶת יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּ֕אמֶר אֵ֛יךְ יָב֥וֹא אֵלַ֖/י אֲר֥וֹן יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/009.yaml
  text: And David feared Yahweh that day[a], and he said, “How can the ark of Yahweh come to me?”
translation:
  language: ta
  text: அன்று தாவீது யாவேக்கு அஞ்சினான். அவன், “யாவேயின் பேழை எப்படி என்னிடம் வரும்?” என்று சொன்னான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யாவேயின் பேழை எப்படி என்னிடம் வரும்?” இந்தக் கேள்வி நடைமுறை ஏற்பாடு குறித்த ஐயத்தையோ, உசாவின் மரணத்திற்குப் பின்பு தாவீதுக்கு ஏற்பட்ட அச்சம் அல்லது தகுதியின்மை உணர்வையோ வெளிப்படுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: அஞ்சினான்
  rationale: இச்சூழலில் உசாவின் மரணத்திற்குப் பின்பு தாவீதுக்கு ஏற்பட்ட உண்மையான அச்சத்தைக் குறிக்கிறது. அதே நேரத்தில், தேவனை நோக்கிய மரியாதைக் கலந்த அச்சம் என்ற நிழற்பொருளையும் ‘அஞ்சினான்’ தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெயத் தேவப் பெயரான יהוה என்பதைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்று
  rationale: ‘அந்த நாளில்’ என்பதன் இயல்பான, சுருக்கமான நவீனத் தமிழ் வடிவம்; குறிப்பிட்ட நாளைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֵיךְ
  choice: எப்படி
  rationale: கேள்வியின் நடைமுறைச் சிக்கல், சாத்தியமின்மை, தகுதியின்மை குறித்த அச்சம் ஆகியவற்றில் ஒன்றை மட்டும் தீர்மானிக்காமல் கேள்வியின் திறந்த தன்மையைப் பேணுகிறது.
- source_word: יָבֹא
  choice: வரும்
  rationale: בוא என்பதன் நேரடியான செயப்பாட்டு வடிவத்தைப் பேணுகிறது; ‘கொண்டுவரப்படும்’ என்று இல்லாத செயப்பாட்டு மாற்றத்தைச் சேர்க்கவில்லை.
- source_word: אֵלַי
  choice: என்னிடம்
  rationale: ‘என்னிடம்’ என்பது எபிரெயச் சொல்லின் நேரடியான பொருள்; ‘என் வீட்டுக்கு’ அல்லது ‘என் இடத்துக்கு’ என்று தேவையற்ற விவரத்தைச் சேர்க்கவில்லை.
- source_word: אֲרוֹן יְהוָה
  choice: யாவேயின் பேழை
  rationale: இணைப்புத் தொடரை இயல்பான தமிழில் அளிக்கிறது. ‘பேழை’ என்பது புனிதப் பெட்டகத்தைக் குறிக்கும் மரியாதைமிக்க, புரிந்துகொள்ளத்தக்க சொல்.
theological_decisions:
- issue: יהוה என்ற தேவப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் தனிப்பட்ட தேவப் பெயர் நேரடியாக உள்ளது. அதனை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பேணுகிறது.
- issue: தாவீதின் கேள்வியின் பொருள்
  choice: ‘எப்படி என்னிடம் வரும்?’ என்ற திறந்த கேள்வி
  alternative: ‘எப்படி என்னிடம் வர முடியும்?’
  rationale: எபிரெயச் சொற்றொடர் நடைமுறை ஏற்பாடு குறித்த ஐயத்தையோ, உசாவின் மரணத்துக்குப் பின்பு ஏற்பட்ட அச்சம் அல்லது தகுதியின்மை உணர்வையோ வெளிப்படுத்தலாம். முதன்மை உரை இவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அஞ்சினான்’ உடனடியான அச்சத்தையும் மரியாதைக் கலந்த பயத்தையும் தக்கவைக்கிறது; கேள்வி மூலத்தின் பொருள் தெளிவின்மையைத் தீர்க்காமல் விடுகிறது.
