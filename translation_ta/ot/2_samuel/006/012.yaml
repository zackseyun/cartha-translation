base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/012.yaml
  text: And it was reported to King David[a], saying, “Yahweh has blessed the house of Obed-edom and all that belongs to him because of the ark of God.” So David went and brought up the ark of God from the house of Obed-edom to the city of David with rejoicing.
translation:
  language: ta
  text: தாவீது அரசனுக்கு, “தேவனுடைய பெட்டியின் காரணமாக யாவே[a] ஓபேத்-ஏதோமின் வீட்டையும் அவனுக்குச் சொந்தமான அனைத்தையும் ஆசீர்வதித்திருக்கிறார்” என்று தெரிவிக்கப்பட்டது. ஆகவே தாவீது சென்று, தேவனுடைய பெட்டியை ஓபேத்-ஏதோமின் வீட்டிலிருந்து தாவீதின் நகரத்துக்கு மகிழ்ச்சியுடன் மேலே கொண்டுவந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “YHWH.” இது தேவனுடைய தனிப்பெயர்; பாரம்பரியமாக “கர்த்தர்” என்றும் வழங்கப்படுகிறது.'
    reason: தெய்வீகப் பெயரின் மூலவடிவத்தையும் வழக்கமான மாற்று வழங்கலையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: தெரிவிக்கப்பட்டது
  rationale: ஹொஃபால் வினைவடிவின் பெயரிடப்படாத செய்பவரையும் இறந்தகாலச் செயப்பாட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: לַמֶּלֶךְ דָּוִד
  choice: அரசன் தாவீதிடம்
  rationale: பட்டத்தையும் பெயரையும் தெளிவாகக் காட்டும் இயல்பான நவீனத் தமிழ் அமைப்பு.
- source_word: בֵּרַךְ יְהוָה
  choice: யாவே ஆசீர்வதித்திருக்கிறார்
  rationale: எபிரெய நிறைவுற்ற செயல் தற்போதைய விளைவுடன் அறிக்கையிடப்படுவதால் ‘ஆசீர்வதித்திருக்கிறார்’ பொருத்தமானது; தெய்வீகப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: ஓபேத்-ஏதோமின் வீட்டார்
  rationale: முதல் குறிப்பில் בֵּית என்பது கட்டிடத்தை மட்டும் அல்லாமல் குடும்பத்தார் அல்லது வீட்டாரையும் குறிக்கக்கூடியதால், ஆசீர்வாதம் பெறுபவர்களை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: அவனுக்குச் சொந்தமான அனைத்தையும்
  rationale: உடைமைகள் மற்றும் அவன் வீட்டுடன் தொடர்புடைய அனைத்தையும் உள்ளடக்கும் எபிரெயச் சொல்லாக்கத்தைச் சுருக்காமல் தருகிறது.
- source_word: בַּעֲבוּר אֲרוֹן הָאֱלֹהִים
  choice: தேவனுடைய பெட்டியின் காரணமாக
  rationale: בַּעֲבוּר என்பதன் காரணப் பொருளையும் ‘தேவனுடைய பெட்டி’ என்ற மூலத்தின் எளிய பெயரையும் காக்கிறது; ‘உடன்படிக்கை’ என்ற சொல்லை இவ்வசனத்தில் இல்லாததால் சேர்க்கவில்லை.
- source_word: וַיֵּלֶךְ דָּוִד
  choice: ஆகவே தாவீது சென்று
  rationale: அறிக்கைக்கு மறுமொழியாக அடுத்த நிகழ்வு நடந்ததைக் காட்டும் தொடர் மற்றும் விளைவு நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: וַיַּעַל אֶת אֲרוֹן הָאֱלֹהִים
  choice: தேவனுடைய பெட்டியை … கொண்டுவந்தான்
  rationale: עלה இங்கு பெட்டியை எருசலேமை நோக்கி மேலே கொண்டுசெல்லுதலைக் குறிக்கிறது; தமிழில் இலக்கைச் சேர்த்த முழு வாக்கியத்தில் ‘கொண்டுவந்தான்’ இயல்பாக உள்ளது.
- source_word: בְּשִׂמְחָה
  choice: மகிழ்ச்சியுடன்
  rationale: மூலத்தின் முறையைக் குறிக்கும் சொற்றொடரை நேராகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயர் உள்ளது. ‘யாவே’ அதைத் தமிழில் ஒலிபெயர்க்கிறது; பழக்கமான மாற்றீட்டை அடிக்குறிப்பு குறிப்பிடுகிறது.
- issue: אֲרוֹן הָאֱלֹהִים என்ற பெயர்ச்சொல்
  choice: தேவனுடைய பெட்டி
  alternative: தேவனுடைய உடன்படிக்கைப் பெட்டி
  rationale: இவ்வசனத்தின் எபிரெய உரையில் ‘உடன்படிக்கை’ இல்லை. வாசகத் தெளிவுக்காக அதைச் சேர்ப்பதற்குப் பதிலாக மூலத்தின் சுருக்கமான வடிவம் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. பெயரிடப்படாத செய்பவரைக் கொண்ட எபிரெயச் செயப்பாட்டு வடிவம் காக்கப்பட்டுள்ளது. முதல் בֵּית ‘வீட்டார்’ என்றும், பின்னர் இடத்தைக் குறிக்கும் מִבֵּית ‘வீடு’ என்றும் சூழலுக்கேற்ப வேறுபடுத்தப்பட்டுள்ளது.
