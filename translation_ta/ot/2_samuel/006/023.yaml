base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/023.yaml
  text: And Michal the daughter of Saul had no child until the day of her death[a].
translation:
  language: ta
  text: சவுலின் மகளான மீகாளுக்கோ, அவள் இறக்கும் நாள்வரை பிள்ளை[a] இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சந்ததி’; எபிரெயச் சொல் ஆண் குழந்தையை மட்டும் அல்லாமல் ஒரு பிள்ளையைப் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מִיכַל
  choice: மீகாளுக்கோ
  rationale: இணைப்புச் சொல் மற்றும் לְ முன்னொட்டு இங்கு மீகாளைத் தலைப்பாக முன்னிறுத்துகின்றன. தமிழில் ‘மீகாளுக்கோ’ என்பது முந்தைய நிகழ்வுடன் தொடர்பையும் அவளைப் பற்றிய எதிர்மறை முடிவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּת שָׁאוּל
  choice: சவுலின் மகளான
  rationale: இது மீகாளின் வம்ச அடையாளத்தை நேரடியாகக் குறிக்கிறது; தமிழில் பெயருக்கு முன் வரும் இயல்பான அடைமொழித் தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: לֹא הָיָה לָהּ
  choice: இல்லை
  rationale: ‘அவளுக்கு இல்லை’ என்ற எபிரெய உடைமை மரபை, ‘மீகாளுக்கோ ... பிள்ளை இல்லை’ என்று இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: יָלֶד
  choice: பிள்ளை
  rationale: இந்த ஒருமைச் சொல் சூழலில் ஆண் குழந்தையை மட்டும் அல்லாமல் குழந்தையைப் பொதுவாகக் குறிக்கலாம். ‘பிள்ளை’ பாலினத்தைத் தேவையின்றி வரையறுக்காமல் இயல்பாக உள்ளது.
- source_word: עַד יוֹם מוֹתָהּ
  choice: அவள் இறக்கும் நாள்வரை
  rationale: வாழ்நாள் முழுவதும் நீடித்த நிலையைக் குறிக்கும் எபிரெய காலத் தொடரை நெருக்கமாகவும் தெளிவாகவும் வழங்குகிறது.
theological_decisions:
- issue: ‘அவள் இறக்கும் நாள்வரை’ என்ற தொடரின் உட்பொருள்
  choice: காலத் தொடரை நேரடியாகத் தந்து, மீகாள் வாழ்நாள் முழுவதும் பிள்ளையற்றிருந்ததைச் சொல்லுதல்
  alternative: ‘வாழ்நாள் முழுவதும்’ என்று மொழிமாற்றி காலத் தொடரின் வடிவத்தைச் சுருக்குதல்
  rationale: எபிரெய உரையின் வெளிப்பாட்டைத் தக்கவைத்தபடியே, மரணத்திற்குப் பின் பிள்ளை பெற்றாள் போன்ற பொருத்தமற்ற உட்பொருளையோ வேறு இறையியல் முடிவையோ மொழிபெயர்ப்பில் சேர்க்காமல் இருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை. ‘மீகாளுக்கோ’ என்பது வாக்கியத்தின் எதிர்மறை நிறைவையும் முந்தைய சூழலுடனான இணைப்பையும் இயல்பாகக் காட்டுகிறது.
