  text: David said to Michal[a], “It was before Yahweh, who chose me above your father and above all his house, to appoint me ruler over the people of Yahweh, over Israel—and I celebrated before Yahweh.”
translation:
  language: ta
  text: தாவீது மிகாளிடம், “உன் தந்தையையும் அவருடைய வம்சத்தார் அனைவரையும் விட என்னைத் தேர்ந்தெடுத்து, யாவேயின் மக்களாகிய இஸ்ரவேலின்மேல் ஆட்சியாளனாக என்னை நியமித்த யாவேயின் முன்னிலையில்தான் நான் இதைச் செய்தேன். யாவேயின் முன்னிலையில் நான் கொண்டாடுவேன்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நான் ஆடுவேன்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை மகிழ்ச்சியான அல்லது விளையாட்டுத்தனமான செயலைப் பரந்த வகையில் குறிக்கிறது; எனவே அதை நடனம் என்று மட்டும் வரையறுக்க வேண்டியதில்லை. முந்தைய வசனங்களில் நடனத்தைக் குறிப்பாகச் சுட்டும் வேறு வினைகள் வருகின்றன.
    reason: சொற்பொருள் மாற்று
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: யாவேயின் முன்னிலையில்
  rationale: இது இடத்தையும் உறவையும் குறிக்கும் எபிரெய மரபுத்தொடர். ‘முன்னிலையில்’ என்பது தேவனுடைய சந்நிதியில் செயல் நடந்ததை இயல்பான நவீனத் தமிழில் தெரிவிப்பதோடு, வசனத்தின் இரு இடங்களிலும் வரும் வலியுறுத்தலையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புச் சொல்லால் மாற்றாமல், எபிரெய இறைப்பெயரின் பரவலாக ஏற்கப்பட்ட ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: אֲשֶׁר בָּחַר בִּי מֵאָבִיךְ וּמִכָּל בֵּיתוֹ
  choice: உன் தந்தையையும் அவருடைய வீட்டார் அனைவரையும் விட என்னைத் தேர்ந்தெடுத்து
  rationale: בחר என்பதற்குப் பின் வரும் מן ஒப்பீட்டையும் பிரித்துத் தேர்ந்தெடுத்ததையும் குறிக்கிறது. ‘விட’ என்பது தாவீது சவுலுக்கும் அவரது குடும்பத்துக்கும் மேலாகத் தேர்ந்தெடுக்கப்பட்டார் என்ற கருத்தை இயல்பாகத் தருகிறது; ‘வீட்டார்’ குடும்பத்தையும் அரச வம்சத்தையும் உள்ளடக்கக்கூடிய மூலமொழியின் பரப்பைத் தக்கவைக்கிறது.
- source_word: לְצַוֹּת אֹתִי
  choice: என்னை நியமித்த
  rationale: צוה பொதுவாக ‘கட்டளையிடு’ என்றாலும், இங்கு தொடர்ந்து வரும் அதிகாரப் பதவியின் காரணமாக ஒருவரை அந்தப் பொறுப்பில் அமர்த்துதல் அல்லது நியமித்தல் என்பதே பொருத்தமான பொருள்.
- source_word: נָגִיד
  choice: ஆட்சியாளன்
  rationale: இந்தச் சொல் அதிகாரத்தில் வைக்கப்பட்ட தலைவரைக் குறிக்கிறது. ‘ஆட்சியாளன்’ என்பது அரசாட்சிச் சூழலைத் தெளிவாகக் காட்டுகிறது; ‘இளவரசன்’ என்ற தேவையற்ற குறுகிய பொருளைத் தவிர்க்கிறது.
- source_word: עַל עַם יְהוָה עַל יִשְׂרָאֵל
  choice: யாவேயின் மக்களின்மேல்—இஸ்ரவேலின்மேல்
  rationale: இருமுறை வரும் עַל என்பதையும், ‘யாவேயின் மக்கள்’ என்போர் இஸ்ரவேல் என்ற விளக்க உறவையும் சுருக்காமல் காக்கிறது.
- source_word: וְשִׂחַקְתִּי
  choice: நான் கொண்டாடுவேன்
  rationale: שׂחק மகிழ்ச்சியான, விளையாட்டுத்தனமான அல்லது கொண்டாட்டச் செயலைக் குறிக்கக்கூடிய பரந்த வினை. இதற்கு முன் நடனத்தைக் குறிப்பாகச் சுட்டும் வேறு வினைகள் பயன்படுத்தப்பட்டதால், இங்கே ‘கொண்டாடுவேன்’ என்பது பொருளை தேவையின்றி ‘நடனம்’ என்று குறுக்காது. அடுத்த வசனத்தில் தொடரும் தாவீதின் உறுதியோடு இணைந்து, இவ்வடிவம் எதிர்கால உறுதிமொழியாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் இருப்பது தனிப்பட்ட இறைப்பெயர் என்பதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் நேரடியாக ஒலிபெயர்ப்பது உரையின் தன்மையைப் பாதுகாக்கிறது.
- issue: שׂחק என்பதை குறிப்பாக நடனம் என்று மொழிபெயர்க்க வேண்டுமா
  choice: கொண்டாடுவேன்
  alternative: ஆடுவேன்; கொண்டாடினேன்
  rationale: இந்த வினை நடனத்தை மட்டும் குறிக்கும் சொல் அல்ல. சூழல் நடனத்தை உள்ளடக்கினாலும், முந்தைய வசனங்களின் நடன வினைகளோடு இதை ஒன்றாக்காமல் அதன் பரந்த பொருள் முதன்மை உரையில் வைக்கப்படுகிறது. வினையின் காலநிலைச் செயல்பாடும் சூழலால் கடந்த செயலையோ தொடரும் உறுதியையோ சுட்டக்கூடியதால் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
