base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/020.yaml
  text: Then David returned to bless his household[a]. But Michal daughter of Saul came out to meet David and said, “How honored the king of Israel was today, uncovering himself today in the sight of the servant girls of his servants[c][b], as one of the vulgar fellows shamelessly uncovers himself!”
translation:
  language: ta
  text: பின்பு தாவீது தன் வீட்டாரை ஆசீர்வதிக்கத் திரும்பிவந்தான். அப்போது சவுலின் மகள் மீகாள் தாவீதை எதிர்கொண்டு வந்து, “இஸ்ரவேலின் அரசர் இன்று எவ்வளவு பெருமை பெற்றார்! தம் பணியாளர்களுக்குச் சேர்ந்த அடிமைப் பெண்களின் கண்முன்னே, மதிப்பற்ற மனிதர்களில் ஒருவன் வெட்கமின்றித் தன்னை வெளிப்படுத்திக்கொள்வதுபோல், இன்று தம்மையே வெளிப்படுத்திக்கொண்டாரே!” என்றாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எவ்வளவு பெருமை பெற்றார்!” என்பது இங்கு கிண்டலாகச் சொல்லப்படுகிறது. “தம்மையே வெளிப்படுத்திக்கொண்டார்” என்பதற்கு “தன் உடலை வெளிக்காட்டினார்” என்றும் மொழிபெயர்க்கலாம்; முழுமையாக நிர்வாணமானார் என்று எபிரெயம் கட்டாயமாகக் கூறவில்லை.
    reason: மூலத்தில் உள்ள கிண்டலையும் נִגְלָה என்பதன் பொருள் எல்லையையும் விளக்குதல்
lexical_decisions:
- source_word: לְבָרֵךְ
  choice: ஆசீர்வதிக்க
  rationale: ברך என்பதன் இயல்பான பொருளை நேரடியாகத் தருகிறது; தாவீது தன் வீட்டார்மேல் ஆசீர்வாதம் கூறும் நோக்கத்தையும் தக்கவைக்கிறது.
- source_word: בֵּיתוֹ
  choice: தன் வீட்டாரை
  rationale: בית இங்கு கட்டடத்தை மட்டும் அல்லாமல் வீட்டைச் சேர்ந்த மக்களையும் குறிக்கலாம்; ஆசீர்வதிக்கப்படுவோர் மக்கள் என்பதால் ‘வீட்டார்’ இயல்பானது.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: சவுலின் மகள் மீகாள்
  rationale: மீகாளின் சவுலிய அடையாளத்துக்கு உரை தரும் முக்கியத்துவத்தைப் பாதுகாக்கிறது.
- source_word: מַה נִּכְבַּד הַיּוֹם
  choice: இன்று எவ்வளவு மேன்மையாக நடந்துகொண்டார்
  rationale: כבד என்பதிலுள்ள மேன்மை/மதிப்பு சார்ந்த பொருளையும் சூழலிலுள்ள வெளிப்படையான கிண்டலையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: נִגְלָה
  choice: தன்னையே வெளிப்படுத்தினார்
  rationale: Niphal வடிவத்தின் தன்னை வெளிப்படுத்துதல் அல்லது ஆடை விலகிய நிலையில் காட்டுதல் என்ற தெளிவின்மையை, தேவையற்ற உடல் விவரத்தைச் சேர்க்காமல் பாதுகாக்கிறது.
- source_word: לְעֵינֵי
  choice: கண்முன்னே
  rationale: ‘கண்களுக்கு முன்பாக’ என்ற எபிரெய மொழிமரபை இயல்பாகவும் பொதுமக்கள் புரிந்துகொள்ளும் வகையிலும் தருகிறது.
- source_word: אַמְהוֹת עֲבָדָיו
  choice: தன் பணியாளர்களின் அடிமைப் பெண்கள்
  rationale: אמה என்பதிலுள்ள அடிமை நிலையை மறைக்காமல் காட்டுகிறது; עבדיו என்பதற்கு இங்கு ‘பணியாளர்கள்’ எனத் தருவது அரசனுக்குச் சேவை செய்பவர்களைக் குறிக்கும் உறவையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: כְּהִגָּלוֹת נִגְלוֹת
  choice: வெட்கமின்றித் தன்னை வெளிப்படுத்துவதுபோல்
  rationale: எபிரெயத்தின் வலியுறுத்தும் கட்டமைப்பையும் மீகாளின் இகழ்ச்சியான மதிப்பீட்டையும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַחַד הָרֵקִים
  choice: இழிவானவர்களில் ஒருவன்
  rationale: ריקים குறிக்கும் மதிப்பற்ற, சமூக இகழ்ச்சிக்குரிய ஆட்களில் ஒருவன் என்ற பழிப்புரையை நடப்பு, கண்ணியமான தமிழில் தருகிறது.
theological_decisions:
- issue: אַמְהוֹת என்பதில் சமூக நிலையை வெளிப்படுத்துதல்
  choice: அடிமைப் பெண்கள்
  alternative: வேலைக்காரப் பெண்கள் / பணிப்பெண்கள்
  rationale: இந்தச் சூழலில் மீகாளின் பழிப்பு கீழ்நிலைப் பெண்கள் முன் ஏற்பட்ட பொது அவமானத்தைச் சார்ந்தது. ஆகவே பிணைக்கப்பட்ட சமூக நிலையைக் குறிக்கும் சொல்லை மென்மையாக்காமல் வைத்திருக்கிறது.
- issue: נִגְלָה என்பதன் உடல் வெளிப்பாட்டின் அளவு
  choice: தன்னையே வெளிப்படுத்தினார்
  alternative: தன் உடலை வெளிக்காட்டினார் / தன்னை நிர்வாணமாக்கினார்
  rationale: மூலச்சொல் தன்னை வெளிப்படுத்துதல் அல்லது ஆடை விலகிய நிலையைச் சுட்டினாலும் முழு நிர்வாணம் என்பதைத் தெளிவாக நிர்ணயிக்கவில்லை; எனவே உண்மையான தெளிவின்மை பாதுகாக்கப்படுகிறது.
- issue: மீகாளின் கூற்றிலுள்ள கிண்டல்
  choice: நேர்முகமாகப் பாராட்டுவது போன்ற சொற்களில் கிண்டலைத் தக்கவைத்தல்
  alternative: ‘எவ்வளவு அவமானமாக நடந்துகொண்டார்’ என்று பொருளை வெளிப்படையாக மாற்றுதல்
  rationale: மூல எபிரெயம் மதிப்பு/மேன்மைச் சொல்லையே பயன்படுத்தி சூழலால் கிண்டலை உணர்த்துகிறது; மொழிபெயர்ப்பு அந்த உரைநடைக் பதற்றத்தை அழிக்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. அரசவைக் சூழலுக்கேற்ற ‘அரசர்’ என்ற மரியாதை வடிவம் மீகாளின் கிண்டலைக் கூர்மைப்படுத்துகிறது. அடிமை நிலை மறைக்கப்படவில்லை; அதேவேளையில் மூலத்தில் இல்லாத வெளிப்படையான பாலியல் அல்லது முழு நிர்வாணக் கருத்து சேர்க்கப்படவில்லை.
