source:
  edition: WLC
  text: וַ/יְכַ֣ל דָּוִ֔ד מֵ/הַעֲל֥וֹת הָ/עוֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יְבָ֣רֶךְ אֶת הָ/עָ֔ם בְּ/שֵׁ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/018.yaml
  text: When David had finished offering the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh of hosts.
translation:
  language: ta
  text: தாவீது தகனபலியையும் சமாதானப் பலிகளையும்[a] செலுத்தி முடித்தபின், படைகளின் யாவேயின்[b] பெயரில் மக்களை ஆசீர்வதித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சமாதானப் பலிகள்” என்பதற்கு “நலவாழ்வுப் பலிகள்” அல்லது “உறவுப் பலிகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: שְׁלָמִים என்ற பலிச்சொல்லின் சமாதானம், நலவாழ்வு, உறவு ஆகிய பொருள் நுணுக்கங்களைத் தெரிவிக்கிறது.
  - marker: b
    text: 'எபிரெயம்: “படைகளின் யாவே”; மரபாக, “சேனைகளின் ஆண்டவர்.”'
    reason: יהוה צְבָאוֹת என்ற இறைபெயர்–பட்டச் சேர்க்கையின் நேரடி வடிவத்தையும் மரபான மாற்றுரையையும் காட்டுகிறது.
lexical_decisions:
- source_word: וַיְכַל ... מֵהַעֲלוֹת
  choice: செலுத்தி முடித்தபின்
  rationale: כלה உடன் வரும் עלה என்பதன் ஹிஃபீல் வினையெச்ச வடிவம், பலிகளைச் செலுத்தும் செயல் முடிவடைந்ததைச் சுட்டுகிறது; அடுத்த நிகழ்வுக்கு முந்திய செயலைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: עֹלָה என்பது முழுவதும் எரித்துச் செலுத்தப்படும் பலிக்கான வழக்கமான எபிரெயச் சொல்; தமிழில் சுருக்கமாகவும் அடையாளம் காணத்தக்க வகையிலும் மொழிபெயர்க்கப்பட்டது.
- source_word: וְהַשְּׁלָמִים
  choice: சமாதானப் பலிகள்
  rationale: שְׁלָמִים என்பது சமாதானம், நலவாழ்வு, இறைவனோடும் சமூகத்தோடும் கொண்ட உறவு ஆகிய கருத்துகளை உள்ளடக்கிய பலிவகை. பரவலாக அறியப்பட்ட ‘சமாதானப் பலிகள்’ முதன்மை உரையில் வைக்கப்பட்டு, அதன் விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיְבָרֶךְ אֶת־הָעָם
  choice: மக்களை ஆசீர்வதித்தான்
  rationale: ברך இங்கு மக்கள்மேல் ஆசீர்வாதம் கூறுவதைக் குறிக்கிறது; எபிரெய வாக்கியத்தின் நேரடியான செயப்பாட்டை இயல்பான தமிழில் காக்கிறது.
- source_word: בְּשֵׁם
  choice: பெயரில்
  rationale: இந்தச் சொற்றொடர் அழைக்கப்படும் பெயரையும் அதனுடன் தொடர்புடைய அதிகாரத்தையும் குறிக்க முடியும்; ‘பெயரில்’ இந்த இரு நுணுக்கங்களையும் தேவையின்றி விரிவாக்காமல் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்பது பட்டமல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பெயர். அதன் வழக்கமான அறிஞர்சார் ஒலிபெயர்ப்பை நவீனத் தமிழில் ‘யாவே’ என வழங்குகிறது.
- source_word: צְבָאוֹת
  choice: படைகளின்
  rationale: צְבָאוֹת என்பதன் அடிப்படைப் பொருள் ‘படைகள்/பெரும் அணிகள்’; ‘சேனைகள்’ என்பதைவிட இன்றைய வாசகருக்கு இயல்பான ‘படைகள்’ தேர்ந்தெடுக்கப்பட்டது, அதேவேளை அதன் விண்ணுலக அல்லது இராணுவச் சுட்டலைக் குறுக்காமல் விடுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரையில் தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது; ‘யெகோவா’ என்பது பிற்காலக் கலப்பு உச்சரிப்பு.
- issue: יהוה צְבָאוֹת என்ற இறைப்பட்டத்தின் பரப்பு
  choice: படைகளின் யாவே
  alternative: சேனைகளின் யாவே; பரலோகப் படைகளின் யாவே
  rationale: צְבָאוֹת என்பது எந்தப் படைகளை மட்டும் குறிக்கிறது என்பதை இவ்வசனம் வெளிப்படையாகத் தீர்மானிக்கவில்லை. ஆகவே ‘பரலோக’ என்று சேர்த்து பொருளைக் குறுக்காமல், மூலத்தின் பரந்த மற்றும் சற்றே தெளிவுறாத தன்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் வழிபாட்டு உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘செலுத்தி முடித்தபின்’ கதைநடையின் காலவரிசையை இயல்பாகக் காட்டுகிறது. இறைபெயர் பட்டமாக மாற்றப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
