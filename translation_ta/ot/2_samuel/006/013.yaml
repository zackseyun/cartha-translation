source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ֧י צָעֲד֛וּ נֹשְׂאֵ֥י אֲרוֹן יְהוָ֖ה שִׁשָּׁ֣ה צְעָדִ֑ים וַ/יִּזְבַּ֥ח שׁ֖וֹר וּ/מְרִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/013.yaml
  text: And when those carrying the ark of Yahweh had gone six steps[b][a], he sacrificed an ox and a fattened calf.
translation:
  language: ta
  text: யாவேயின் பெட்டியைச் சுமந்தவர்கள் ஆறு அடிகள்[a] நடந்தபோது, அவன் ஓர் எருதையும் கொழுத்த கன்றொன்றையும்[b] பலியிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆறு எட்டுகள்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘கொழுக்கவைக்கப்பட்ட விலங்கு’; இங்கு மரபாகக் கொழுத்த கன்று என்று புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: யாவேயின் உடன்படிக்கைப் பெட்டி
  rationale: אֲרוֹן என்பதை வழிபாட்டுச் சூழலில் தெளிவாக உணர்த்த ‘உடன்படிக்கைப் பெட்டி’ என்றும், יהוה என்ற தனிப்பெயரை ‘யாவே’ என்றும் வழங்குகிறது.
- source_word: כִּי
  choice: நடந்தபோது
  rationale: ויהי כי என்ற கதைநடை அமைப்பில் இது காலச் சூழலை அறிமுகப்படுத்துவதால், இயல்பான தமிழில் ‘போது’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: צָעֲדוּ
  choice: நடந்தார்கள்
  rationale: முன்னோக்கி அடியெடுத்து நகர்வதைக் குறிக்கும் வினை; ‘ஆறு அடிகள்’ என்பதோடு இயல்பாக அமைகிறது.
- source_word: נֹשְׂאֵי
  choice: சுமந்தவர்கள்
  rationale: பெட்டியை எடுத்துச் சென்றவர்களைக் குறிக்கும் தொடர்ச்சியான செயற்பெயர் வடிவை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: שִׁשָּׁה צְעָדִים
  choice: ஆறு அடிகள்
  rationale: எண்ணிக்கையையும் நடை அலகையும் நேரடியாகப் பாதுகாக்கிறது; ‘ஆறு நடைத் தப்படிகள்’ என்பதும் சாத்தியம்.
- source_word: וַיִּזְבַּח
  choice: அவன் … பலியிட்டான்
  rationale: எபிரெய ஒருமை ஆண்பால் வினையின் எழுவாய் சூழலின்படி தாவீது; பெயரை வசனத்தில் வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் வடிவைத் தக்கவைக்கிறது.
- source_word: שׁוֹר
  choice: ஓர் எருது
  rationale: மாட்டினத்தைச் சேர்ந்த பலிவிலங்கைக் குறிக்கும் சொல்லுக்கு இச்சூழலில் வழக்கமான, புரியக்கூடிய இணை.
- source_word: מְרִיא
  choice: கொழுத்த கன்று
  rationale: இந்தப் பெயர்ச்சொல் பொதுவாகக் கொழுக்கவைக்கப்பட்ட விலங்கைக் குறிக்கிறது; இங்கு மரபாகப் புரிந்துகொள்ளப்படும் ‘கன்று’ முதன்மை உரையில் தரப்பட்டு, மூலத்தின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், உடன்படிக்கையின் தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: וַיִּזְבַּח என்ற ஒருமை வினையின் எழுவாய்
  choice: அவன்
  alternative: தாவீது
  rationale: உடனடியான சூழலில் செய்பவர் தாவீது என்பது இயல்பான புரிதல்; ஆயினும் இவ்வசனத்தில் பெயர் மீண்டும் இடம்பெறாததால், மூலத்தின் மறைமுகத்தன்மையை ‘அவன்’ தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உடன்படிக்கைப் பெட்டி’ என்பது வழிபாட்டுச் சூழலைத் தெளிவுபடுத்துகிறது; அடிக்குறிப்புகள் மூல எபிரெயத்தின் சொற்பொருள் மாற்றுவாய்ப்புகளைப் பாதுகாக்கின்றன.
