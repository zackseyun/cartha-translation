  text: And David was angry because Yahweh had broken out against Uzzah[a], and he called that place Perez-uzzah to this day.
translation:
  language: ta
  text: யாவே ஊசாவுக்கு எதிராக ஒரு பிளப்பை ஏற்படுத்தியதால் தாவீது கோபமடைந்தார்; அவர் அந்த இடத்திற்குப் “பேரேஸ்-ஊசா” என்று பெயரிட்டார்; அது இன்றுவரை அப்பெயராலேயே அழைக்கப்படுகிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר לְדָוִד
  choice: தாவீது கோபமடைந்தார்
  rationale: חרה ל என்ற எபிரெய மரபுத்தொடர் கோபத்தை வெளிப்படுத்துகிறது. இத்தமிழாக்கம் இயல்பாகவும் நேரடியாகவும் உணர்ச்சியின் வலிமையைத் தக்கவைக்கிறது.
- source_word: פָּרַץ יְהוָה פֶּרֶץ בְּעֻזָּה
  choice: யெகோவா ஊசாவுக்கு எதிராகத் திடீரெனப் பாய்ந்து தாக்கியதால்
  rationale: פרץ என்ற வினையும் அதே வேரிலான பெயர்ச்சொல்லும் திடீரான, அழிவுண்டாக்கும் பாய்ச்சலை வலியுறுத்துகின்றன. சொல்லுக்கு சொல் மீட்டுருவாக்கம் தமிழில் இயல்பற்றதாக இருப்பதால், செயற்பாட்டின் திடீர்மையும் எதிர்மறை வலிமையும் தெளிவாகத் தரப்பட்டுள்ளன; மூலத்தின் சொல்விளையாட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவத்தில் வழங்குகிறது.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: அவர் அந்த இடத்திற்கு … என்று பெயரிட்டார்
  rationale: இடத்திற்குப் பெயரிடுவதைக் குறிக்கும் எபிரெய வழக்கை இயல்பான நவீன தமிழில் தெளிவாக அளிக்கிறது.
- source_word: פֶּרֶץ עֻזָּה
  choice: பேரேஸ்-ஊசா
  rationale: இடப்பெயரை ஒலிபெயர்த்து, פרץ வேருடனான தொடர்பையும் சொல்விளையாட்டையும் அடிக்குறிப்பில் விளக்குகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை அதுவே அதன் பெயராக உள்ளது
  rationale: எபிரெய காலக்குறிப்பு பெயரிடும் சூழலில் குறிக்கும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஊசாவின்மீதான இறைத் தீர்ப்பை மென்மைப்படுத்தாமல் மொழிபெயர்த்தல்
  choice: யெகோவா ஊசாவுக்கு எதிராகத் திடீரெனப் பாய்ந்து தாக்கினார்
  alternative: ஊசாவுக்கு நேர்ந்த சம்பவத்தினால்
  rationale: மூல எபிரெயம் நிகழ்வை யெகோவாவின் நேரடியான செயலாகக் கூறுகிறது. அதை வெறும் விபத்தாகவோ மறைமுக விளைவாகவோ மாற்றாமல், செயற்பாட்டின் திடீர்மையையும் கடுமையையும் தக்கவைக்கிறது.
- issue: தாவீதின் கோபம் எவரை நோக்கியது என்ற தெளிவின்மை
  choice: தாவீது கோபமடைந்தார்
  alternative: தாவீது யெகோவாவின்மீது கோபமடைந்தார்
  rationale: לְדָוִד என்பது தாவீதின் கோபநிலையைச் சொல்கிறது; கோபம் யார்மீது செலுத்தப்பட்டது என்பதை வசனம் வெளிப்படையாகக் கூறவில்லை. ஆகவே இலக்கைச் சேர்த்து விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பானதாயும், வரலாற்றுக் கதையாடலுக்கு ஏற்ற கண்ணியமான நடையிலும் அமைந்துள்ளது. மூலத்தின் நேரடியான இறைச் செயலும் தாவீதின் விளக்கப்படாத கோபமும் பாதுகாக்கப்பட்டுள்ளன.
