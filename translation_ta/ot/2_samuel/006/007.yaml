source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/עֻזָּ֔ה וַ/יַּכֵּ֥/הוּ שָׁ֛ם הָ/אֱלֹהִ֖ים עַל הַ/שַּׁ֑ל וַ/יָּ֣מָת שָׁ֔ם עִ֖ם אֲר֥וֹן הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/007.yaml
  text: And the anger of Yahweh burned against Uzzah[a], and God struck him there for the error, and he died there beside the ark of God.
translation:
  language: ta
  text: யாவேயின் கோபம் ஊசாவுக்கு எதிராகப் பற்றியெரிந்தது. அந்தத் தவறுக்காக[a] கடவுள் அவனை அங்கே அடித்தார்; அவன் அங்கே கடவுளின் பெட்டியின் அருகில் இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அந்தத் தவறுக்காக” என்பதற்குப் பதிலாக, “அவமதிப்பான செயலுக்காக,” “அவசரச் செயலுக்காக,” அல்லது “அவன் கையை நீட்டியதால்” என்றும் பொருள் கொள்ளலாம். இங்குள்ள எபிரெயச் சொற்றொடர் பொருள் காண்பதற்கு கடினமானது; அது பலவிதமாகப் புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: கோபம் ... எதிராகப் பற்றியெரிந்தது
  rationale: எபிரெய மொழியின் ‘கோபம் எரிதல்’ என்ற உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டமாக மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּעֻזָּה
  choice: ஊசாவுக்கு எதிராக
  rationale: கோபத்தின் இலக்கைச் சுட்டும் முன்னிடைச்சொல்லைத் தெளிவான தமிழில் தெரிவிக்கிறது.
- source_word: וַיַּכֵּהוּ
  choice: அவனை ... அடித்தார்
  rationale: נכה என்பதன் அடிப்படைப் பொருளைத் தருகிறது; மரண விளைவை அடுத்த வாக்கியக்கூற்றுக்கே விட்டுவைக்கிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: மூலத்தில் இருமுறை வரும் இடவலியுறுத்தலைத் தமிழிலும் இருமுறை தக்கவைக்கிறது.
- source_word: הָאֱלֹהִים
  choice: கடவுள்
  rationale: மூலத்தில் தெய்வீகப் பெயரிலிருந்து ‘கடவுள்’ என்பதற்கு ஏற்படும் சொல் மாற்றத்தைப் பாதுகாக்கிறது.
- source_word: עַל הַשַּׁל
  choice: அந்தத் தவறுக்காக
  rationale: அரிதானதும் பொருள் தெளிவில்லாததுமான שַׁל என்பதைக் கூடுதலாக விளக்கிப் பொருள் திணிக்காமல் சுருக்கமாகத் தருகிறது; வேறு சாத்தியங்கள் அடிக்குறிப்பில் உள்ளன.
- source_word: וַיָּמָת
  choice: அவன் ... இறந்தான்
  rationale: எளிய எபிரெய கதைநடைத் தொடரை நேராகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: கடவுளின் பெட்டியின் அருகில்
  rationale: עִם இங்கு இடத்தொடர்பைக் குறிப்பதால், ‘உடன்’ என்பதற்குப் பதிலாக இயல்பான ‘அருகில்’ பயன்படுத்தப்படுகிறது; ‘உடன்படிக்கை’ என்ற மூலத்தில் இல்லாத சொல்லும் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: עַל הַשַּׁל என்ற தெளிவில்லாத சொற்றொடர் ஊசாவின் மரணத்திற்கான காரணத்தை எவ்வாறு குறிக்கிறது
  choice: அந்தத் தவறுக்காக
  alternative: அவமதிப்பான செயலுக்காக; அவசரச் செயலுக்காக; அவன் கையை நீட்டியதால்
  rationale: שַׁל அரிதான, பொருள் உறுதியாகத் தெரியாத சொல். முதன்மை உரை ஒரு தவறான செயலை மட்டும் சுட்டுகிறது; அதன் துல்லிய இயல்பைத் தீர்மானிக்காமல் மாற்று விளக்கங்களை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பற்றியெரிந்தது’ மூல உருவகத்தைத் தக்கவைக்கிறது; ‘கடவுளின் பெட்டி’ என்பது மூலத்தில் உள்ள אֲרוֹן הָאֱלֹהִים என்பதைக் கூடுதல் சமயச் சொல்லாக்கமின்றி வழங்குகிறது.
