  source_fidelity: 'மூல எபிரெயத்தின் தொடரும் வலியுறுத்தல்களும் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன: யாவேயின் கோபம் ஊசாவுக்கு எதிராக எரிதல், அங்கே கடவுள் அவனை அடித்தல், இருமுறை வரும் ‘அங்கே,’ மற்றும் கடவுளின் பெட்டிக்கு அருகில் அவன் இறத்தல் ஆகியவை துல்லியமாக உள்ளன. עַל הַשַּׁל என்ற அரிதும் தெளிவற்றதுமான சொற்றொடர் ‘அந்தத் தவறுக்காக’ என அளவோடு மொழிபெயர்க்கப்பட்டு, அதன் உறுதியற்ற தன்மை அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.'
