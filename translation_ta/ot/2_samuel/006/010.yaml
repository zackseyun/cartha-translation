base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/010.yaml
  text: So David was not willing to bring the ark of Yahweh to himself into the City of David[b][a], but David turned it aside to the house of Obed-edom the Gittite.
translation:
  language: ta
  text: ஆகவே, யாவேவின் பெட்டியைத் தன்னிடமாக, தாவீதின் நகரத்திற்குக்[a] கொண்டுவர தாவீது விரும்பவில்லை. மாறாக, அதை காத் ஊரைச் சேர்ந்த ஓபேத்-ஏதோமின்[b] வீட்டிற்குத் திருப்பிவிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «தாவீதின் நகரத்திற்குக்» என்பதற்கு «தாவீதின் நகரத்தை நோக்கி» அல்லது «தாவீதின் நகரத்திற்கு மேலே» என்றும் மொழிபெயர்க்கலாம். எபிரெய முன்னிடைச்சொல் இலக்கை நோக்கிய அல்லது மேல்நோக்கிய இயக்கத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: «காத் ஊரைச் சேர்ந்தவர்» என்பதற்கு «கித்தியன்» என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: மனம்கொள்ளவில்லை
  rationale: விருப்பம் அல்லது இசைவைச் சுட்டும் எபிரெயச் சொல்லை, வலுவான மறுப்பாக மாற்றாமல் தாவீதின் தயக்கமுள்ள தீர்மானமாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְהָסִיר אֵלָיו
  choice: தன்னிடம் ... கொண்டுவர
  rationale: சொல்லுக்கு அடிப்படையில் அகற்றுதல் அல்லது இடமாற்றுதல் என்ற பொருள் இருந்தாலும், இச்சூழலில் பெட்டியைத் தாவீதின் இருப்பிடத்தை நோக்கிக் கொண்டுவருவதே கருத்து.
- source_word: אֲרוֹן יְהוָה
  choice: யெகோவாவின் பெட்டி
  rationale: אֲרוֹן என்பதன் அடிப்படைப் பொருளான ‘பெட்டி’யைப் பாதுகாத்து, தெய்வீகப் பெயரை ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைத் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பில் வழங்குகிறது.
- source_word: עַל עִיר דָוִד
  choice: தாவீதின் நகரத்திற்கு
  rationale: இங்கு עַל இலக்கை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் ‘நகரத்திற்கு’ என்பது இயல்பான இலக்குக் குறிப்பு. மேல்நோக்கிய இயக்கத்தின் சாத்திய நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיַּטֵּהוּ
  choice: அதை ... திருப்பிவிட்டார்
  rationale: முதலில் திட்டமிட்ட இலக்கிலிருந்து வேறொரு இடத்திற்குத் திசைதிருப்பிய செயலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: ஓபேத்-ஏதோமின் வீட்டிற்கு
  rationale: இங்கு பெட்டி தங்கவைக்கப்படும் உடனடிச் சூழலில் בֵּית என்பதற்கு ‘வீடு’ என்பது முதன்மையான பொருள்.
- source_word: הַגִּתִּי
  choice: கித்தியனான
  rationale: காத் ஊரைச் சேர்ந்தவர் என்பதைக் குறிக்கும் இன/ஊரடையாளப் பெயரைச் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள தனிப்பட்ட தெய்வீகப் பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் ஒலிபெயர்க்கிறது; தமிழில் பரவலாக அறியப்படும் வடிவம் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- issue: אֲרוֹן என்பதற்கான திருச்சபை மரபுச் சொல்
  choice: பெட்டி
  alternative: உடன்படிக்கைப் பெட்டி
  rationale: இவ்வசனம் ‘உடன்படிக்கை’ என்ற சொல்லை வெளிப்படையாகக் கொண்டிருக்காததால் அதைச் சேர்க்காமல், மூலத்தின் சுருக்கத்தையும் சூழலிலுள்ள புனிதப் பொருளின் அடையாளத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் எளிதில் புரியும், ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனம்கொள்ளவில்லை’ என்பது வெறும் ஆசையின்மைக்கும் கடுமையான மறுப்பிற்கும் இடைப்பட்ட மூலத்தின் நுணுக்கத்தைப் பாதுகாக்கிறது. தெய்வீகப் பெயர் பொதுப்பட்டமாக மாற்றப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
