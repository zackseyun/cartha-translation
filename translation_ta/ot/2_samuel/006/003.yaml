  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையின் மீளுரையும் בַּגִּבְעָה என்பதிலுள்ள உண்மையான இடவியல்/இடப்பெயர் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
