base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/003.yaml
  text: They set the ark of God on a new cart and brought it from the house of Abinadab[a], which was on the hill; and Uzzah and Ahio, the sons of Abinadab, were driving the new cart.
translation:
  language: ta
  text: அவர்கள் கடவுளின் பெட்டியை ஒரு புதிய வண்டியின்மேல் வைத்து, மேட்டின்மேல் இருந்த அபினதாபின் வீட்டிலிருந்து அதை எடுத்துச் சென்றார்கள்.[a] அபினதாபின் மகன்களான உஸ்ஸாவும் அகியோவும் அந்தப் புதிய வண்டியை ஓட்டிச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிபியாவில் இருந்த அபினதாபின் வீட்டிலிருந்து.” இத்தொடரை நில அமைப்பின் விளக்கமாக அல்லாமல் ஓர் இடப்பெயராகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: வண்டியின்மேல் வைத்து
  rationale: רכב என்பதன் காரணவினை வடிவம் ‘ஏறச் செய்தல்/மேல் வைத்தல்’ எனப் பொருள்படும்; பெட்டியும் வண்டியும் வரும் இச்சூழலில் ‘மேல் வைத்து’ என்பது இயல்பான தெளிவான தமிழ்.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: கடவுளின் பெட்டி
  rationale: אֲרוֹן என்பது இங்கு கடவுளுடன் தொடர்புடைய புனிதப் பெட்டியைக் குறிக்கிறது; நவீனத் தமிழில் பொருளை நேரடியாகவும் எளிதாகவும் தர ‘பெட்டி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶל עֲגָלָה חֲדָשָׁה
  choice: ஒரு புதிய வண்டியின்மேல்
  rationale: אֶל இங்கு நகர்வு/வைப்பின் இலக்கைச் சுட்டுகிறது; עֲגָלָה-க்கு சூழலுக்கு ஏற்ற பொதுவான தமிழ் ‘வண்டி’.
- source_word: וַיִּשָּׂאֻהוּ
  choice: அதை எடுத்துச் சென்றார்கள்
  rationale: נשא என்பது தூக்குதல், சுமத்தல், எடுத்துச் செல்லுதல் ஆகிய பொருள்களைக் கொண்டது. பெட்டி வண்டியின்மேல் இருப்பதால் கையால் சுமந்தனர் எனத் தவறாகத் தோன்றாத ‘எடுத்துச் சென்றார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִבֵּית אֲבִינָדָב
  choice: அபினதாபின் வீட்டிலிருந்து
  rationale: எபிரெய கட்டிணைப்பின் இயல்பான தமிழ் உடைமைத் தொடர்.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: மேட்டின்மேல் இருந்த
  rationale: குறிப்பிட்ட உயர்ந்த நிலப்பகுதியைக் குறிக்கும் இடவியல் வாசிப்பை முதன்மை உரையில் தக்கவைக்கிறது; இடப்பெயர் வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְעֻזָּא וְאַחְיוֹ
  choice: ஊசாவும் அகியோவும்
  rationale: தனிப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டன.
- source_word: בְּנֵי אֲבִינָדָב
  choice: அபினதாபின் மகன்களான
  rationale: בְּנֵי என்பதன் இச்சூழலிலான இயல்பான நேரடிப் பொருள் ‘மகன்கள்’.
- source_word: נֹהֲגִים
  choice: ஓட்டிச் சென்றார்கள்
  rationale: נהג விலங்கு அல்லது வண்டியை வழிநடத்துதல்/ஓட்டுதல் எனப் பொருள்படும்; வண்டி செயப்படுபொருளாக இருப்பதால் ‘ஓட்டிச் சென்றார்கள்’ இயல்பானது.
- source_word: הָעֲגָלָה חֲדָשָׁה
  choice: அந்தப் புதிய வண்டியை
  rationale: மூலத்தில் மீண்டும் வரும் தொடரை கதை வலியுறுத்தலுக்காகத் தமிழிலும் மீட்டுரைக்கிறது.
