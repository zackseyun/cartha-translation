  revised_text: தாவீது எழுந்து, தன்னோடு இருந்த மக்கள் அனைவருடனும் பாலே-யூதாவிலிருந்து[a] அங்கிருந்த தேவனுடைய பேழையை மேலே கொண்டுவருவதற்காகப் புறப்பட்டான். அந்தப் பேழை கேருபீன்களுக்கு மேலே அரியணையில் அமர்ந்திருக்கும்[d] படைகளின் யாவேயின்[c] நாமத்தால் அழைக்கப்படுகிறது[b].
