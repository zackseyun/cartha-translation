source:
  edition: WLC
  text: וַ/יָּ֣קָם וַ/יֵּ֣לֶךְ דָּוִ֗ד וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ מִֽ/בַּעֲלֵ֖י יְהוּדָ֑ה לְ/הַעֲל֣וֹת מִ/שָּׁ֗ם אֵ֚ת אֲר֣וֹן הָ/אֱלֹהִ֔ים אֲשֶׁר נִקְרָ֣א שֵׁ֗ם שֵׁ֣ם יְהוָ֧ה צְבָא֛וֹת יֹשֵׁ֥ב הַ/כְּרֻבִ֖ים עָלָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/002.yaml
  text: David arose and went[a], with all the people who were with him, from Baale-judah to bring up from there the ark of God, which is called by the Name, the name of Yahweh of Armies[d][c][b], who is enthroned above the cherubim.
translation:
  language: ta
  text: தாவீது எழுந்து, தன்னோடு இருந்த மக்கள் அனைவருடனும் பாலே-யூதாவிலிருந்து[a] அங்கிருந்த தேவனுடைய பேழையை மேலே கொண்டுவருவதற்காகப் புறப்பட்டான். அந்தப் பேழை கேருபீன்களுக்கு மேலே அரியணையில் அமர்ந்திருக்கும்[d] படைகளின் யாவேயின்[c] நாமத்தால் அழைக்கப்படுகிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதாவின் பாலாவிலிருந்து.” இங்குள்ள எபிரெய வடிவம் வழக்கத்திற்கு மாறானது; அது கீரியாத்-யெயாரீமுடன் தொடர்புடைய ஓர் இடத்தைக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அதன்மேல் படைகளின் யாவேயின் நாமம் அழைக்கப்படுகிறது.” எபிரெய மொழியின் பெயரிடும் வாய்பாடு சுருக்கமாக அமைந்துள்ளது.
    reason: lexical_alternative
  - marker: c
    text: 'பாரம்பரிய மொழிபெயர்ப்பு: “சேனைகளின் கர்த்தர்.”'
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “கேருபீன்களுக்கு நடுவில் வாசமாயிருக்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: எழுந்து ... சென்றான்
  rationale: இரு எபிரெய வினைகளையும் தக்கவைத்து, செயலின் தொடக்கத்தையும் தொடர்ந்து புறப்பட்டுச் சென்றதையும் இயல்பான தமிழ் நடையில் தெரிவிக்கிறது.
- source_word: וְכָל־הָעָם אֲשֶׁר אִתּוֹ
  choice: தன்னோடு இருந்த மக்கள் அனைவருடனும்
  rationale: தாவீதுடன் சென்ற முழுக் குழுவையும் தெளிவாகவும் இயல்பாகவும் குறிப்பிடுகிறது.
- source_word: מִבַּעֲלֵי יְהוּדָה
  choice: பாலே-யூதாவிலிருந்து
  rationale: சூழலில் இது ஓர் இடப்பெயராக இருப்பதால், வழக்கத்திற்கு மாறான எபிரெய வடிவத்தை ஒலிபெயர்ப்பாகப் பாதுகாக்கிறது.
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: அங்கிருந்து மேலே கொண்டுவருவதற்காக
  rationale: עלה என்பதன் Hiphil வடிவத்திலுள்ள ‘மேலே கொண்டுவருதல்’ என்ற திசைநுட்பத்தையும் நோக்கத்தையும் தக்கவைக்கிறது.
- source_word: אֵת אֲרוֹן הָאֱלֹהִים
  choice: தேவனுடைய பெட்டி
  rationale: உடன்படிக்கைப் பெட்டியைக் குறிக்கும் אֲרוֹן என்பதற்கு வாசகருக்கு எளிதில் புரியும் மரியாதையான தமிழ் சொற்றொடர்.
- source_word: אֲשֶׁר נִקְרָא שֵׁם
  choice: நாமத்தால் அழைக்கப்படுகிற
  rationale: சுருக்கமான எபிரெயப் பெயரிடும் வாய்பாட்டை முற்றிலும் விளக்கிவிடாமல், அதன் புனிதமான ‘நாமம்’ சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: שֵׁם יְהוָה צְבָאוֹת
  choice: படைகளின் யாவேயின் நாமம்
  rationale: יהוה என்பதை உடன்படிக்கைப் பெயரான ‘யாவே’ என்றும், צבאות என்பதை இன்றைய வாசகருக்குத் தெளிவான ‘படைகள்’ என்றும் தருகிறது.
- source_word: יֹשֵׁב הַכְּרֻבִים עָלָיו
  choice: கேருபீன்களுக்கு மேலே அரியணையில் அமர்ந்திருக்கும்
  rationale: பெட்டியோடு தொடர்புடைய அரசராட்சி உருவகத்தை வெளிப்படுத்துகிறது; வெறும் குடியிருப்பை மட்டும் குறிக்காமல், அரியணை அமர்வின் கருத்தைத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் நான்கு எழுத்து இறைப் பெயரைப் பெயராகவே பாதுகாக்கிறது; அதை ஒரு பட்டமாக மாற்றவில்லை.
- issue: צבאות என்ற இறைப் பட்டத்தை மொழிபெயர்த்தல்
  choice: படைகளின்
  alternative: சேனைகளின்
  rationale: வானுலக அல்லது போர்ப் படைகளின் கருத்தை இன்றைய பொதுவான தமிழில் தெளிவாகத் தருகிறது; பாரம்பரிய மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: பெட்டியோடு தொடர்புடைய சுருக்கமான பெயரிடும் வாய்பாடு
  choice: நாமத்தால் அழைக்கப்படுகிற
  alternative: அதன்மேல் நாமம் அழைக்கப்பட்டிருக்கிற; நாமத்தைத் தாங்குகிற
  rationale: பெட்டி யாவேயின் நாமத்தோடு விசேஷமாக இணைக்கப்பட்டிருப்பதைத் தெரிவிக்கிறது; அந்த இலக்கண உறவை உடைமை, வாசம் அல்லது வேண்டுதல் என ஒரே பொருளுக்குள் கட்டுப்படுத்தவில்லை.
- issue: יֹשֵׁב הַכְּרֻבִים என்பதிலுள்ள அரசராட்சி/வாசம் நுட்பம்
  choice: கேருபீன்களுக்கு மேலே அரியணையில் அமர்ந்திருக்கும்
  alternative: கேருபீன்களுக்கு நடுவில் வாசமாயிருக்கும்
  rationale: பெட்டியின் கேருபீன் உருவங்களோடு இணைந்த தெய்வீக அரசராட்சி உருவகத்தை வெளிப்படுத்துகிறது; மாற்றுப் பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகம உரைக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. நீளமான எபிரெய வாக்கியம் வாசிப்புத் தெளிவிற்காக இரண்டு தமிழ் வாக்கியங்களாக அமைக்கப்பட்டாலும், எழுந்து செல்லுதல், உடனிருந்த மக்கள், புறப்பட்ட இடம், நோக்கம், பெட்டியின் பெயரிடும் வாய்பாடு ஆகிய அனைத்தும் பாதுகாக்கப்பட்டுள்ளன. ‘நாமம்’, ‘யாவே’, ‘கேருபீன்கள்’ போன்ற முக்கிய இறையியல் சொற்கள் அளவுக்கு மீறி விளக்கப்படாமல் வைக்கப்பட்டுள்ளன.
