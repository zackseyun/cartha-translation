  source_fidelity: 'கருத்தும் முக்கிய கூறுகளும் பெரும்பாலும் மூலத்திற்கு ஏற்ப உள்ளன: தாவீதின் எழுந்து செல்லுதல், உடனிருந்த மக்கள், பாலே-யூதா, பேழையை அங்கிருந்து மேலே கொண்டுவரும் நோக்கம், யாவேயின் நாமத்துடனான பெயரிடும் வாய்பாடு, கேருபீன்களோடு தொடர்புடைய அரியணை உருவகம் ஆகியவை இடம்பெற்றுள்ளன. ஆனால் தற்போதைய இரண்டு வாக்கிய அமைப்பில் ‘சென்றான்’ இருமுறை வருவது மூலத்தில் இல்லாத செயல் மறுகூற்றை உருவாக்குகிறது; மேலும் பெயரிடும் தொடர் முன்னிறுத்தப்பட்டதால் வாசிப்பில் தேவையற்ற சிக்கல் ஏற்படுகிறது.'
  naturalness: ‘தாவீது எழுந்து ... சென்றான்’ என்பதற்குப் பின் ‘... கொண்டுவருவதற்காக அவன் சென்றான்’ என்பது நவீன தமிழில் இயல்பற்ற மறுபதிப்பு. ‘தேவனுடைய பெட்டி’ புரியக்கூடியதாயினும், உடன்படிக்கைப் பேழைக்கான நிலையான, மரியாதையான வேதாகமச் சொல்லான ‘தேவனுடைய பேழை’ இச்சூழலில் இயல்பானது. ஒரே தொடரில் நோக்கத்தையும் பெயரிடும் விளக்கத்தையும் அமைத்தால் தெளிவு மேம்படும்.
  terminology: யாவே, படைகளின், நாமம், கேருபீன்கள் ஆகிய தேர்வுகள் ஏற்றவை. ‘பேழை’ என்பது אֲרוֹן-க்கு இவ்வசனத்தின் புனிதப் பொருளில் அதிகத் துல்லியமும் வழக்குநிலையும் உடையது. பெயரிடும் வாய்பாட்டின் இலக்கண நிச்சயமின்மையை உரையில் ‘நாமத்தால் அழைக்கப்படுகிற’ எனப் பாதுகாத்து, மாற்று விளக்கத்தை அடிக்குறிப்பில் வைத்திருக்க வேண்டும்.
