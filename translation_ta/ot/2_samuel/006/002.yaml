  to: தாவீது எழுந்து, தன்னோடு இருந்த மக்கள் அனைவருடனும் பாலே-யூதாவிலிருந்து[a] அங்கிருந்த தேவனுடைய பேழையை மேலே கொண்டுவருவதற்காகப் புறப்பட்டான். அந்தப் பேழை கேருபீன்களுக்கு மேலே அரியணையில் அமர்ந்திருக்கும்[d] படைகளின் யாவேயின்[c] நாமத்தால் அழைக்கப்படுகிறது[b].
  rationale: மூலத்தின் இரு தொடக்க வினைகளையும் தமிழில் ‘எழுந்து ... புறப்பட்டான்’ என இயல்பாகக் காத்துள்ளேன். அங்கிருந்து பேழையை மேலே கொண்டுவரும் நோக்கம் அதே வினையோடு இணைக்கப்பட்டதால், மூலத்தில் இல்லாத இரண்டாவது ‘சென்றான்’ நீக்கப்பட்டது. ‘தேவனுடைய பேழை’ என்ற நிலையான சொல் பயன்படுத்தப்பட்டுள்ளது. சுருக்கமான பெயரிடும் வாய்பாட்டின் விவாதத்துக்குரிய உறவை உரையில் தீர்மானித்துவிடாமல் வைத்தபடியே, ‘அதன்மேல்’ என்ற நேரடி மாற்று அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
