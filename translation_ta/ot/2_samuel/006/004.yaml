  yaml_path: translation/ot/2_samuel/006/004.yaml
  text: They carried it from the house of Abinadab[a], which was on the hill, with the ark of God, and Ahio was walking before the ark.
translation:
  language: ta
  text: அவர்கள் அதை, மேட்டின்மேல் இருந்த அபினதாபின் வீட்டிலிருந்து, கடவுளின் பெட்டியோடு சேர்த்து எடுத்துச் சென்றார்கள்.[a] அகியோ பெட்டிக்கு முன்னால் நடந்துகொண்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிபியாவில் இருந்த அபினதாபின் வீட்டிலிருந்து.” எபிரெயச் சொல் גִּבְעָה என்பதற்கு “மேடு” என்றும் “கிபியா” என்ற இடப்பெயர் என்றும் பொருள் கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: எடுத்துச் சென்றார்கள்
  rationale: נשׂא என்பதன் பன்மை வினையும் ஆண்பால் ஒருமை பின்னொட்டும் இங்கு பெட்டியை ஓரிடத்திலிருந்து எடுத்துச் செல்வதைக் குறிக்கின்றன. கொண்டு சென்ற விதத்தைத் தேவையின்றி வரையறுக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: מִבֵּית אֲבִינָדָב
  choice: அபினதாபின் வீட்டிலிருந்து
  rationale: מן உடன் வரும் בית இடம் அல்லது புறப்படும் மூலத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: மேட்டின்மேல் இருந்த
  rationale: גִּבְעָה என்பதைப் பொதுப்பெயரான ‘மேடு’ என்று முதன்மையாக எடுத்துக்கொள்கிறது; ‘கிபியா’ என்ற இடப்பெயர் வாசிப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: கடவுளின் பெட்டியை
  rationale: இந்த வசனத்தின் சற்றுக் கடினமான எபிரெய தொடரமைப்பை இயல்பான தமிழில் வினையின் நேரடிச் செயப்படுபொருளாக வழங்குகிறது. אֲרוֹן הָאֱלֹהִים என்பதற்கு ‘கடவுளின் பெட்டி’ என்பது தெளிவான மொழிபெயர்ப்பு.
- source_word: וְאַחְיוֹ
  choice: அகியோ
  rationale: ஆள்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הֹלֵךְ
  choice: நடந்துகொண்டிருந்தான்
  rationale: எபிரெயப் பங்கேற்புவினை, பெட்டி எடுத்துச் செல்லப்பட்டபோது நீடித்துக்கொண்டிருந்த செயலைக் காட்டுகிறது.
- source_word: לִפְנֵי הָאָרוֹן
  choice: அந்தப் பெட்டிக்கு முன்னால்
  rationale: לִפְנֵי என்பதன் இடம்சார் பொருளையும் ஊர்வலச் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
