  text: וַ/יֵּשֶׁב֩ אֲר֨וֹן יְהוָ֜ה בֵּ֣ית עֹבֵ֥ד אֱדֹ֛ם הַ/גִּתִּ֖י שְׁלֹשָׁ֣ה חֳדָשִׁ֑ים וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת עֹבֵ֥ד אֱדֹ֖ם וְ/אֶת כָּל בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/011.yaml
  text: And the ark of Yahweh remained in the house of Obed-edom the Gittite for three months[b][a], and Yahweh blessed Obed-edom and all his household.
translation:
  language: ta
  text: யாவேயின் பேழை காத்தியனான[a] ஓபேத்-ஏதோமின் வீட்டில் மூன்று மாதங்கள் இருந்தது; யாவே ஓபேத்-ஏதோமையும் அவருடைய வீட்டார் அனைவரையும்[b] ஆசீர்வதித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, காத் நகரத்துடன் தொடர்புடையவர்.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘அவருடைய வீடு முழுவதையும்.’ எபிரெயச் சொல் அவரது குடும்பத்தாரையும் இல்லத்தைச் சேர்ந்தோரையும் அல்லது அவரது இல்ல அமைப்பு முழுவதையும் விரிவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: இருந்தது
  rationale: ישׁב என்பதற்கு ‘அமர்தல், குடியிருத்தல், தங்கியிருத்தல்’ என்ற பொருள்கள் உண்டு. பெட்டி எழுவாயாகவும் கால அளவு தொடர்வதாலும், இயல்பான தமிழில் ‘இருந்தது’ என்பது அதன் தொடர்ந்திருப்பைத் தெளிவாகக் கூறுகிறது.
- source_word: אֲרוֹן יְהוָה
  choice: யாவேயின் பெட்டி
  rationale: எபிரெயக் கட்டமைப்பை நேரடியாகப் பிரதிபலிக்கிறது. אֲרוֹן என்பதற்கு இச்சூழலில் நிலைபெற்ற, எளிதில் புரியும் தமிழ்ச் சொல் ‘பெட்டி’; மூலத்தில் இல்லாத ‘உடன்படிக்கை’ என்ற விளக்கச் சொல்லைச் சேர்க்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் வழங்குகிறது.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: ஓபேத்-ஏதோமின் வீட்டில்
  rationale: இங்கு בֵּית என்பது பெட்டி வைக்கப்பட்டிருந்த இடமாகிய வீட்டைக் குறிக்கிறது; தமிழ் இடவேற்றுமையுடன் இயல்பாக வழங்கப்பட்டது.
- source_word: עֹבֵד אֱדֹם
  choice: ஓபேத்-ஏதோம்
  rationale: எபிரெயப் பெயரின் ஒலியை நவீனத் தமிழில் நெருக்கமாகப் பெயர்த்தெழுதுகிறது.
- source_word: הַגִּתִּי
  choice: கித்தியனான
  rationale: காத் நகரத்துடன் தொடர்புடையவரைக் குறிக்கும் இன/இடப்பெயரடை வடிவத்தைச் சுருக்கமாகப் பாதுகாக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: மூன்று மாதங்கள்
  rationale: கால அளவை இயல்பான தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: וַיְבָרֶךְ
  choice: ஆசீர்வதித்தார்
  rationale: ברך என்பதன் வழக்கமான வேதாகம மற்றும் பொதுத் தமிழ் இணை; தேவையற்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: אֶת עֹבֵד אֱדֹם וְאֶת כָּל בֵּיתוֹ
  choice: ஓபேத்-ஏதோமையும் அவருடைய வீட்டார் அனைவரையும்
  rationale: இரண்டாவது בֵּיתוֹ கட்டிடத்தை மட்டும் அல்லாமல் குடும்பத்தாரையும் இல்லத்தைச் சேர்ந்தவர்களையும் குறிக்கக்கூடியதால், ‘வீட்டார் அனைவரும்’ என்பது தமிழில் இயல்பாக அதன் சமூகப் பொருளைத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல வசனம் கடவுளின் தனிப்பெயரான יהוה-ஐப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை பட்டப்பெயராக மாற்றாமல் பெயராகவே காக்கிறது.
- issue: אֲרוֹן என்பதில் ‘உடன்படிக்கை’ என்ற சொல்லைச் சேர்த்தல்
  choice: பெட்டி
  alternative: உடன்படிக்கைப் பெட்டி
  rationale: சூழலில் இது உடன்படிக்கைப் பெட்டியையே குறித்தாலும், இவ்வசனத்தின் எபிரெய மூலத்தில் ‘உடன்படிக்கை’ என்ற சொல் இல்லை. ஆகவே அதை உரையில் சேர்க்காமல் மூலத்தின் சுருக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வழிபாட்டு வாசிப்பிற்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. பெயர்கள் எபிரெய ஒலிக்கு நெருக்கமாகத் தமிழாக்கப்பட்டன; வாக்கிய அமைப்பு இயல்பான தமிழுக்கேற்ப அமைந்தாலும் மூலத்தின் இரு தொடர்ச்சியான நிகழ்வுகளும் காக்கப்பட்டன.
