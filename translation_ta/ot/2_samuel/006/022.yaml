source:
  edition: WLC
  text: וּ/נְקַלֹּ֤תִי עוֹד֙ מִ/זֹּ֔את וְ/הָיִ֥יתִי שָׁפָ֖ל בְּ/עֵינָ֑/י וְ/עִם הָֽ/אֲמָהוֹת֙ אֲשֶׁ֣ר אָמַ֔רְתְּ עִמָּ֖/ם אִכָּבֵֽדָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/022.yaml
  text: And I will make myself even more contemptible than this[a], and I will be lowly in my own eyes; but with the servant girls of whom you have spoken, with them I will be honored.
translation:
  language: ta
  text: இதைக் காட்டிலும் இன்னும் அதிகமாக என்னைத் தாழ்த்திக்கொள்வேன்; என் பார்வையில் நான் தாழ்ந்தவனாக இருப்பேன். ஆனால் நீ குறிப்பிட்ட அந்த அடிமைப் பெண்களுடன்[a] நான் மதிக்கப்படுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணிப்பெண்களுடன்.” எபிரெயச் சொல் வீட்டில் தாழ்ந்த சமூக நிலையில் இருந்த பெண்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְקַלֹּתִי עוֹד מִזֹּאת
  choice: இதைக் காட்டிலும் இன்னும் அதிகமாக என்னைத் தாழ்த்திக்கொள்வேன்
  rationale: נקלתי என்பது இகழ்வாக அல்லது அற்பமாகக் கருதப்படுதல் என்ற பொருளைக் கொண்டது; சூழலில் தாவீது தன்னைத்தானே மேலும் தாழ்த்தத் தயாராக இருப்பதைத் தெரிவிப்பதால், இயல்பான தமிழில் தன்னிலைப் பொருளுடன் மொழிபெயர்க்கப்பட்டுள்ளது. עוד מזאת என்பதன் ஒப்பீட்டு வலிமையும் காக்கப்பட்டுள்ளது.
- source_word: וְהָיִיתִי שָׁפָל בְּעֵינָי
  choice: என் பார்வையில் நான் தாழ்ந்தவனாக இருப்பேன்
  rationale: שפל என்பதில் சமூகத் தாழ்வும் பணிவும் சார்ந்த அர்த்தவளம் உள்ளது. ‘என் பார்வையில்’ என்பது ‘என் சொந்த மதிப்பீட்டில்’ என்ற எபிரெய வழக்கை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: הָאֲמָהוֹת
  choice: அடிமைப் பெண்கள்
  rationale: אָמָה என்பது தாழ்ந்த குடும்பச் சமூக நிலையில் இருந்த பெண் அடிமை அல்லது பணிப்பெண்ணைக் குறிக்கலாம். வசனத்தின் மதிப்பு–இகழ்ச்சி முரணில் சமூக நிலை முக்கியமானதால் ‘அடிமைப் பெண்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר אָמַרְתְּ
  choice: நீ குறிப்பிட்ட
  rationale: முந்தைய வசனத்தில் மீகாள் சொன்ன பெண்களைக் குறிக்கும் தொடர்புத் தொடரை நவீன தமிழில் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: עִמָּם
  choice: அவர்களுடன்
  rationale: עם என்பதன் அடிப்படை ‘உடன்’ பொருளைப் பாதுகாத்து, தாவீது மதிப்பைப் பெறும் சமூக வட்டத்தைச் சுட்டுகிறது.
- source_word: אִכָּבֵדָה
  choice: நான் மதிக்கப்படுவேன்
  rationale: כבד என்பதன் நிஃபால் வடிவம் மதிப்பு பெறுதல் அல்லது கௌரவிக்கப்படுதல் என்ற பொருளைக் கொடுக்கிறது. ‘மதிக்கப்படுவேன்’ என்பது முன்புள்ள தாழ்த்திக்கொள்ளுதலுடன் உள்ள முரணை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אָמָהוֹת என்பதற்கான சமூக-நிலைச் சொல்
  choice: முதன்மை உரையில் ‘அடிமைப் பெண்கள்’
  alternative: பணிப்பெண்கள்; பெண் பணியாளர்கள்
  rationale: மூலச் சொல்லில் உள்ள தாழ்ந்த குடும்பச் சமூக நிலையையும் வசனத்தின் மதிப்பு–இகழ்ச்சி முரணையும் தெளிவாகப் பாதுகாக்கிறது; மாற்றுச் சொல்லும் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: עִמָּם என்பதன் உறவு
  choice: ‘அவர்களுடன்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: அவர்களிடையே; அவர்களால்
  rationale: எபிரெய முன்னிடைச்சொல்லின் உண்மையான தெளிவின்மையைத் தீர்மானமாக முகவராக மாற்றாமல், தாவீது மதிக்கப்படும் சமூகத் தொடர்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையான வேதாகம நடையுடன் அமைக்கப்பட்டுள்ளது. ‘என்னைத் தாழ்த்திக்கொள்வேன்’ என்பது சூழலுக்கேற்ற தன்னிலைச் செயலைத் தெளிவுபடுத்துகிறது; ‘என் பார்வையில்’ மூலத்தின் உருவக வழக்கைத் தக்கவைக்கிறது.
