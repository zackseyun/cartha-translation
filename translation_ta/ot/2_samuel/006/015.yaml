base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/015.yaml
  text: So David and all the house of Israel were bringing up the ark of Yahweh with shouting and with the sound of the horn[a][b].
translation:
  language: ta
  text: தாவீதும் இஸ்ரவேல் குடும்பம் முழுவதும் முழக்கத்தோடும் கொம்பொலியோடும் யாவேவின் பேழையை மேலே கொண்டுவந்தார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகிழ்ச்சி முழக்கத்தோடு”; எபிரெயச் சொல் மகிழ்ச்சியான ஆர்ப்பரிப்பு அல்லது ஆரவாரத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எக்காள ஒலியோடு”; எபிரெயச் சொல் பொதுவாக ஆட்டுக்கடாக் கொம்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלִים
  choice: மேலே கொண்டுவந்துகொண்டிருந்தார்கள்
  rationale: ஹிஃபில் வினையெச்சம் தொடர்ந்து நடைபெற்ற செயலைக் காட்டுகிறது; எருசலேமை நோக்கிய மேலேற்றத்தையும் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: בֵּית יִשְׂרָאֵל
  choice: இஸ்ரவேல் குடும்பத்தார்
  rationale: ‘இஸ்ரவேலின் வீடு/குடும்பம்’ என்ற கூட்டுக் குடும்பப் பொருளைப் பேணுகிறது; ‘இஸ்ரவேலர்’ என்பதைக் காட்டிலும் மூல உருவகத்துக்கு நெருக்கமானது.
- source_word: אֲרוֹן יְהוָה
  choice: யெகோவாவின் பெட்டி
  rationale: אֲרוֹן என்பதற்கு இச்சூழலில் ‘பெட்டி’ என்பது தெளிவான இயல்பான தமிழ்; உடன்படிக்கைப் பெயரான יהוה ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை பொதுவாக அறியப்படும் தமிழ் வடிவில் பெயராகவே வழங்குகிறது; பட்டப்பெயராக மாற்றவில்லை.
- source_word: תְרוּעָה
  choice: ஆரவாரம்
  rationale: விழாக்கால மகிழ்ச்சி முழக்கம் அல்லது கூக்குரல் என்ற பொருள் வரம்பைச் சுருக்காமல், அடுத்துவரும் கொம்பொலியிலிருந்து வேறுபடுத்துகிறது.
- source_word: קוֹל שׁוֹפָר
  choice: கொம்பின் முழக்கம்
  rationale: שׁוֹפָר என்பது பொதுவாக ஆட்டுக்கடாக் கொம்பால் செய்யப்பட்ட ஊதுகருவி; ‘எக்காளம்’ என மொழிபெயர்த்தால் உலோகக் கருவி என்ற நவீன எண்ணம் தோன்றலாம்.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டப்பெயராக மாற்றாமல் பெயராகப் பேணுகிறது; தமிழில் பரவலாக அறியப்படும் ஒலிவடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘குடும்பத்தார்’ மூலம் மூலத்தின் குடும்ப/கூட்டுச் சித்திரம் பேணப்பட்டுள்ளது; ‘ஆரவாரம்’ மற்றும் ‘கொம்பின் முழக்கம்’ மனிதக் குரலையும் கருவியொலியையும் தெளிவாக வேறுபடுத்துகின்றன.
