revisions:
- from: தாவீதும் இஸ்ரவேல் குடும்பத்தார் அனைவரும் ஆரவாரத்தோடும் கொம்பின் முழக்கத்தோடும்[a][b] யெகோவாவின் பெட்டியை மேலே கொண்டுவந்துகொண்டிருந்தார்கள்.
  to: தாவீதும் இஸ்ரவேல் குடும்பம் முழுவதும் முழக்கத்தோடும் கொம்பொலியோடும் யாவேவின் பேழையை மேலே கொண்டுவந்தார்கள்.[a][b]
  rationale: The revision aligns the divine name with the Yahweh decision in the audit trail, uses established Tamil biblical terminology for the ark, and improves modern Tamil flow. It retains the source’s corporate ‘house of Israel,’ upward movement, vocal acclamation, and distinct shofar sound. The two footnote anchors remain attached to the corresponding lexical expressions.
