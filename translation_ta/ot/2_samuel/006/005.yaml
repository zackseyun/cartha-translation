base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/005.yaml
  text: And David and all the house of Israel were celebrating before Yahweh with all kinds of cypress wood instruments[a], and with lyres, harps, tambourines, rattles[c][b], and cymbals.
translation:
  language: ta
  text: தாவீதும் இஸ்ரவேல் வீட்டார் அனைவரும் யாவேக்கு முன்பாகப் சைப்ரஸ் மரத்தால் செய்யப்பட்ட எல்லாவகை இசைக் கருவிகளுடனும்[a], யாழ்கள், வீணைகள், கஞ்சிராக்கள், குலுக்குக் கருவிகள்[b], கைத்தாளங்கள் ஆகியவற்றுடனும் மகிழ்ந்து கொண்டாடினார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு நேராக, “எல்லாவகைப் பெரோஷ் மரங்களுடன்.” இங்கு அந்த மரத்தால் செய்யப்பட்ட பலவகை இசைக் கருவிகள் குறிக்கப்படலாம். மரத்தின் சரியான இனம் உறுதியில்லை; அது சைப்ரஸ், ஃபிர், அல்லது ஜூனிப்பர் போன்ற மரமாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இந்த அரிய எபிரெயச் சொல் எந்தக் கருவியைக் குறிக்கிறது என்பது உறுதியில்லை; சிஸ்ட்ரம் போன்ற குலுக்கி வாசிக்கும் ஓர் இசைக் கருவியாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “விளையாடி மகிழ்ந்தார்கள்.” எபிரெய வினை விழாக்கால மகிழ்ச்சியையும் விளையாட்டுத்தனமான செயலையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: மகிழ்ந்து கொண்டாடினார்கள்
  rationale: பியேல் வடிவிலுள்ள வினை, விளையாட்டுத்தனமான மகிழ்ச்சியையும் விழாக்காலக் கொண்டாட்டத்தையும் குறிக்கலாம். இசைக் கருவிகளுடன் நடந்த ஊர்வலச் சூழலில் ‘மகிழ்ந்து கொண்டாடினார்கள்’ என்பது இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: செயல் யாவேயின் முன்னிலையில் நிகழ்வதைக் குறிக்கும் எபிரெய மரபுத்தொடரை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: בְּכֹל עֲצֵי בְרוֹשִׁים
  choice: பலவகையான தேவதாரு மரக் கருவிகளுடன்
  rationale: சொல்லுக்கு நேரான அமைப்பு ‘எல்லா/பலவகை பெரோஷ் மரங்களுடன்’ எனச் சிக்கலாக உள்ளது; இங்கு அந்த மரத்தால் செய்யப்பட்ட இசைக் கருவிகள் குறிக்கப்படுகின்றன என்பது சூழலுக்குப் பொருத்தமான உட்பொருள். ‘கருவிகள்’ என்பது தெளிவுக்காக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בְרוֹשִׁים
  choice: தேவதாரு மரம்
  rationale: குறிப்பிட்ட மர இனத்தைத் துல்லியமாக அடையாளம் காண இயலாது; தமிழ் வாசகர்களுக்குப் புரியும் பொதுவான மரப்பெயராக இது தேர்ந்தெடுக்கப்பட்டது, ஐயுறவு அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
- source_word: כִנֹּרוֹת
  choice: யாழ்கள்
  rationale: கின்னோர் என்பது லையர் வகையைச் சேர்ந்த நரம்பிசைக் கருவி; தமிழில் அணுகத்தக்க, வேறுபடுத்தக்கூடிய பெயராக ‘யாழ்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: נְבָלִים
  choice: வீணைகள்
  rationale: கின்னோரிலிருந்து வேறான இன்னொரு நரம்பிசைக் கருவி. துல்லிய வடிவம் உறுதியற்றதால், இயல்பான பொதுப் பெயராக ‘வீணை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: תֻפִּים
  choice: கஞ்சிராக்கள்
  rationale: தோஃப் என்பது கையில் பிடித்து வாசிக்கும் சட்டகப் பறை அல்லது தம்புரின் வகைக் கருவி; நவீன தமிழில் அறியப்பட்ட இணையான பெயர் ‘கஞ்சிரா’.
- source_word: מְנַעַנְעִים
  choice: குலுக்குக் கருவிகள்
  rationale: அசைத்தோ குலுக்கியோ ஒலி எழுப்பும் கருவியைச் சுட்டும் அரிய சொல். குறிப்பிட்ட கருவி உறுதியற்றதால் தொழில்நுட்பமான பெயரைத் திணிக்காமல் செயற்பாட்டை விவரிக்கும் மொழிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: צֶלְצֶלִים
  choice: கைத்தாளங்கள்
  rationale: ஒன்றோடொன்று மோதி ஒலி எழுப்பும் உலோகத் தாளக் கருவிகளைச் சூழல் தெளிவாகக் குறிக்கிறது.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: இஸ்ரவேல் வீட்டார் அனைவரும்
  rationale: ‘இஸ்ரவேலர் அனைவரும்’ என்று சுருக்காமல், மக்களை ஒரு கூட்டு வீட்டாராகச் சித்தரிக்கும் எபிரெயச் சொல்லாட்சியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கையின் தனிப்பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது. பொதுப் பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. அரிய இசைக் கருவிகளின் துல்லிய அடையாளம் ஊகமாகத் தீர்மானிக்கப்படாமல் அடிக்குறிப்புகளில் ஐயுறவுடன் பாதுகாக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு அடையாளங்களும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
