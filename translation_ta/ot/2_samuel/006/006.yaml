base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/006.yaml
  text: When they came to Nacon’s threshing floor[a], Uzza reached out to the ark of God and took hold of it[b], because the oxen stumbled.
translation:
  language: ta
  text: அவர்கள் நாகோனின் கதிரடிக்கும் களத்துக்கு[a] வந்தபோது, ஊசா தேவனுடைய பேழையை நோக்கித் தன் கையை நீட்டி அதைப் பிடித்துக்கொண்டான்; ஏனெனில் எருதுகள் தடுமாறின.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாகோன் என்ற இடத்தின் கதிரடிக்கும் களம்’; சாத்தியக்குறைவாக, ‘நிலையான கதிரடிக்கும் களம்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எருதுகள் சறுக்கியதால்’ அல்லது ‘எருதுகள் அதை ஏறக்குறையக் கவிழ்த்ததால்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן
  choice: போரடிக்கும் களம்
  rationale: தானியத்திலிருந்து பதரைப் பிரிக்கும் வேளாண் இடத்தைக் குறிக்கும் எபிரெயச் சொல்லுக்கு இது இயல்பான நவீனத் தமிழ் இணை.
- source_word: נָכוֹן
  choice: நாகோனின்
  rationale: இங்கு இச்சொல் பெரும்பாலும் இடத்தோடு தொடர்புடைய இயற்பெயராகச் செயல்படுகிறது. பெயரின் ஒலிபெயர்ப்பு 'நாகோன்' என்று தரப்படுகிறது; பெயரல்லாத பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּשְׁלַח
  choice: தன் கையை நீட்டி
  rationale: மூலத்தில் 'கை' வெளிப்படையாக இல்லாவிட்டாலும், ஒரு பொருளை நோக்கி நீட்டி அதைப் பிடிக்கும் செயலில் அது இயல்பாக உள்ளடங்கியுள்ளது; தமிழில் செயலைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: தேவனுடைய பெட்டி
  rationale: எபிரெய முழுச் சொற்றொடரையும் தக்கவைத்து, அந்தப் பெட்டி தேவனுக்குரியது என்பதை நேரடியாகக் காட்டுகிறது.
- source_word: וַיֹּאחֶז בּוֹ
  choice: அதைப் பிடித்துக்கொண்டான்
  rationale: வன்முறையைத் தேவையின்றி உணர்த்தாமல், பொருளை உறுதியாகப் பற்றிய செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כִּי
  choice: -ஆல்
  rationale: ஊசாவின் செயலுக்கான காரணத்தைத் தமிழில் இயல்பான காரணவினை அமைப்பால் காட்டுகிறது.
- source_word: שָׁמְטוּ
  choice: தடுமாறின
  rationale: வினைச்சொல் சறுக்குதல், நழுவவிடுதல், நிலைகுலைத்தல் போன்ற பொருட்களை ஏற்கக்கூடும். மாடுகளை எழுவாயாகக் கொண்ட இச்சூழலில் 'தடுமாறின' என்பது நிகழ்வின் இயந்திரவிவரத்தை மிகைப்படுத்தாமல் பதற்றத்தைப் பாதுகாக்கிறது.
- source_word: הַבָּקָר
  choice: மாடுகள்
  rationale: வண்டியை இழுக்கும் கால்நடைகளை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது; சூழல் அவை இழுவை மாடுகள் என்பதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ஊசாவின் செயலுக்கான உடனடிக் காரணம்
  choice: மாடுகள் தடுமாறியதால் ஊசா பெட்டியைப் பிடித்தான்
  alternative: மாடுகள் பெட்டியை நிலைகுலையச் செய்ததால் அல்லது அதை நழுவவிட்டதால் ஊசா பிடித்தான்
  rationale: எபிரெய உரை மாடுகளை எழுவாயாகக் கொண்டு வழுக்குதல் அல்லது நழுவவிடுதல் சார்ந்த வினையை மட்டுமே தருகிறது. பெட்டி உண்மையில் கவிழ்ந்தது அல்லது விழுந்தது என்று சேர்க்காமல் காரணத் தொடர்பையும் கதையின் பதற்றத்தையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, பொதுவாசகர்களுக்குப் புரியும் மரியாதையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நிகழ்வுவரிசை இயல்பான தமிழுக்கேற்ப அமைக்கப்பட்டாலும், காரணத் தொடர்பும் மூலத்தின் சொற்பொருள் தெளிவின்மையும் அடிக்குறிப்புகள் மூலம் பாதுகாக்கப்பட்டுள்ளன.
