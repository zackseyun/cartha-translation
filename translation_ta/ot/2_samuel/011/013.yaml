translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. செய்பவர் மாறும் இடங்களில் எபிரெயப் பிரதிப்பெயர் குழப்பம் தமிழில் ஏற்படாதபடி ‘தாவீது’ மீண்டும் சொல்லப்பட்டுள்ளது. மதுபோதைக்கு உரியாவை ஆளாக்கியது தாவீதின் காரணச் செயல் என்பதும், ‘இறங்கிச் செல்’ என்ற மூலத்தின் திசைநுட்பமும் காக்கப்பட்டுள்ளன.
