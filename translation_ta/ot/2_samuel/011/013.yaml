base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/013.yaml
  text: David invited him[a], and he ate and drank before him, and he made him drunk. In the evening he went out to lie on his bed with the servants of his lord[d][c][b], but he did not go down to his house.
translation:
  language: ta
  text: தாவீது அவனை அழைத்தான்[a]. அவன் தாவீதின் முன்னிலையில்[b] சாப்பிட்டுக் குடித்தான்; தாவீது அவனை மதுபோதையடையச் செய்தான். அன்று மாலையில் அவன் வெளியே சென்று, தன் ஆண்டவனின் பணியாளர்களோடு தன் படுக்கையில் படுத்துக்கொண்டான்[c]. ஆனால் அவன் தன் வீட்டிற்கு இறங்கிச் செல்லவில்லை[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தாவீது அவனை வரவழைத்தான்’ அல்லது ‘அவனை அழைப்பித்தான்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அவனுக்கு முன்பாக’; அதாவது, தாவீதின் முன்னிலையில்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘தன் ஆண்டவனின் பணியாளர்களோடு.’ இங்குள்ள ‘ஆண்டவன்’ தாவீதைக் குறிக்கிறது. ‘தன் படுக்கையில்’ என்பதை ‘தான் படுக்கும் இடத்தில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: எபிரெயத்தில், ‘தன் வீட்டிற்கு இறங்கிச் செல்லவில்லை.’ சுற்றியுள்ள வசனங்களிலும் வரும் ‘இறங்கு’ என்ற திசைவினை இங்கு தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: தாவீது அவனை அழைத்தான்
  rationale: קרא + ל ஒருவரை அழைப்பதையோ வரவழைப்பதையோ குறிக்கலாம். விருந்துச் சூழலில் ‘அழைத்தான்’ என்பது இயல்பாகவும், தாவீதே சந்திப்பைத் தொடங்கினான் என்ற கருத்தைக் காக்கும் விதமாகவும் உள்ளது.
- source_word: לְפָנָיו
  choice: தாவீதின் முன்னிலையில்
  rationale: சொல்லர்த்தமாக ‘அவனுக்கு முன்பாக/அவனுடைய முன்னிலையில்.’ தமிழில் பிரதிப்பெயர் குழப்பத்தைத் தவிர்த்து, உரியா தாவீதின் முன்னிலையில் உண்டான் என்ற சூழல்சார் குறிப்பைத் தெளிவாக்குகிறது.
- source_word: וַיְשַׁכְּרֵהוּ
  choice: தாவீது அவனை மதுபோதைக்குள்ளாக்கினான்
  rationale: שׁכר என்பதன் ஹிஃபில் வடிவம் காரணவினை; உரியா குடிபோதையடையும்படி தாவீது செய்த திட்டமிட்ட செயலை இச்சொற்றொடர் நேரடியாகத் தெரிவிக்கிறது.
- source_word: בָעֶרֶב
  choice: அன்று மாலையில்
  rationale: கதையின் அடுத்த கட்டத்தைக் குறிக்கும் காலச்சொற்றொடர். ‘அன்று மாலையில்’ என்பது நவீனத் தமிழில் இயல்பானது.
- source_word: לִשְׁכַּב
  choice: படுத்துக்கொண்டான்
  rationale: வினை படுப்பதைக் குறிக்கிறது; ‘தூங்கினான்’ என்று மொழிபெயர்ப்பது நிகழ்ந்த செயலைத் தேவையின்றி விரிவுபடுத்தும்.
- source_word: בְּמִשְׁכָּבוֹ
  choice: தனது படுக்கையில்
  rationale: מִשְׁכָּב என்பது படுக்கை அல்லது படுக்கும் இடத்தைக் குறிக்கலாம். ‘படுக்கை’ இங்கு இயல்பான,具体மான தமிழ் இணைச்சொல்.
- source_word: עִם עַבְדֵי אֲדֹנָיו
  choice: தன் ஆண்டவனுடைய பணியாளர்களோடு
  rationale: אֲדֹנָיו உரியாவின் ஆண்டவனான தாவீதைக் குறிக்கிறது. மூலத்தின் மூன்றாம் நபர் உடைமை அமைப்பையும், உரியா வீட்டிற்குச் செல்லாமல் அரச பணியாளர்களோடு தங்கியதையும் இம்மொழியாக்கம் காக்கிறது.
- source_word: וְאֶל בֵּיתוֹ לֹא יָרָד
  choice: ஆனால் அவன் தன் வீட்டிற்கு இறங்கிச் செல்லவில்லை
  rationale: ירד என்ற ‘இறங்கிச் செல்’ திசைவினை சுற்றியுள்ள நிகழ்ச்சிப் பகுதியில் மீண்டும் வருகிறது; எனவே அதை வெறுமனே ‘வீட்டிற்குச் செல்லவில்லை’ என்று எளிமைப்படுத்தாமல் காக்கப்பட்டுள்ளது. எபிரெய இணைப்புச்சொல் பொதுவாக ‘மற்றும்’ என்றாலும், இங்கு எதிர்மறைத் திருப்பத்தை இயல்பான தமிழில் ‘ஆனால்’ வெளிப்படுத்துகிறது.
