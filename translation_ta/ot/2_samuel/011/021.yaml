translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நிகழ்கதை நடை பயன்படுத்தப்பட்டுள்ளது. மேற்கோளுக்குள் வரும் எதிர்பார்க்கப்பட்ட கண்டன வினாவும், அதற்குப் பதிலாகத் தூதன் சொல்ல வேண்டிய செய்தியும் தெளிவுபடுத்தப்பட்டுள்ளன. பெயர்கள் தமிழில் நிலைபெற்ற வேதாகம வடிவங்களுக்கு அருகாக ஒலிபெயர்க்கப்பட்டுள்ளன; மூல உரையின் பெயர் வேறுபாடும் திரிகைக்கல் குறித்த சொற்பொருள் ஐயமும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
