source:
  edition: WLC
  text: מִֽי הִכָּ֞ה אֶת אֲבִימֶ֣לֶךְ בֶּן יְרֻבֶּ֗שֶׁת הֲ/לֽוֹא אִשָּׁ֡ה הִשְׁלִ֣יכָה עָלָי/ו֩ פֶּ֨לַח רֶ֜כֶב מֵ/עַ֤ל הַֽ/חוֹמָה֙ וַ/יָּ֣מָת בְּ/תֵבֵ֔ץ לָ֥/מָּה נִגַּשְׁתֶּ֖ם אֶל הַֽ/חוֹמָ֑ה וְ/אָ֣מַרְתָּ֔ גַּ֗ם עַבְדְּ/ךָ֛ אוּרִיָּ֥ה הַ/חִתִּ֖י מֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/021.yaml
  text: Who struck down Abimelech son of Jerubbesheth? Was it not a woman who threw an upper millstone on him from the wall[a], so that he died at Thebez? Why did you go near the wall?’ Then you shall say[c][b], ‘Your servant Uriah the Hittite is dead also.’
translation:
  language: ta
  text: “யெருபேசேத்தின்[a] மகன் அபிமெலேக்கை அடித்துக் கொன்றது யார்? மதிலின்மேலிருந்து திரிகையின் மேல்கல்லை[b] அவன்மேல் எறிந்த ஒரு பெண்ணாலல்லவா அவன் தேபேசில் இறந்தான்?[c] நீங்கள் ஏன் மதிலுக்கு அருகில் சென்றீர்கள்?” என்று அவர் கேட்டால், நீ, “உங்கள் பணியாளன் ஏத்தியனான உரியாவும் இறந்துவிட்டான்” என்று சொல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில் ‘யெருபேசேத்’; நியாயாதிபதிகள் 9:1-இல் ‘யெருபாகால்’ என்று உள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘திரிகைக் கல்லின் ஒரு துண்டை’; எபிரெயச் சொற்றொடர் பெரும்பாலும் திரிகையின் மேல்கல்லைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: இங்கு குறிப்பிடப்படும் நிகழ்வுக்கு நியாயாதிபதிகள் 9:53-ஐப் பார்க்கவும்.
    reason: cross_reference
lexical_decisions:
- source_word: הִכָּה
  choice: அடித்துக் கொன்றது
  rationale: நכה என்பதன் ‘அடி’ என்ற நேரடிப் பொருளையும், இச்சூழலில் அந்த அடி மரணத்தை விளைவித்தது என்பதையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: אֲבִימֶלֶךְ בֶּן יְרֻבֶּשֶׁת
  choice: யெருபேசேத்தின் மகன் அபிமெலேக்கு
  rationale: மசோரா எபிரெய உரையில் உள்ள யெருபேசேத் என்ற பெயரையே மொழிபெயர்ப்பு பின்பற்றுகிறது; நியாயாதிபதிகள் 9-இல் உள்ள யெருபாகால் என்ற வடிவத்துடன் அமைதியாக ஒத்திசைக்கவில்லை.
- source_word: הֲלוֹא
  choice: …தால்தானே
  rationale: உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் எதிர்மறை வினாவின் சொல்லாட்சியை இயல்பான தமிழ் வினாவாகப் பாதுகாக்கிறது.
- source_word: פֶּלַח רֶכֶב
  choice: திரிகையின் மேல்கல்
  rationale: கையால் இயக்கப்படும் திரிகையின் மேல்பகுதிக் கல்லைக் குறிக்கும் சாத்தியமான பொருளைச் சுருக்கமாகத் தருகிறது; ‘திரிகைக் கல்லின் ஒரு துண்டு’ என்ற சொற்பொருள் சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: מֵעַל הַחוֹמָה
  choice: மதிலின்மேலிருந்து
  rationale: மேலிருந்து கீழ்நோக்கி எறியப்பட்ட இயக்கத்தையும் மதிலின் உயர்ந்த இடத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: וַיָּמָת בְּתֵבֵץ
  choice: அவன் தேபேசில் இறந்தான்
  rationale: செயலின் விளைவையும் இடப்பெயரையும் எளிய நிகழ்கதைத் தமிழில் தருகிறது.
- source_word: לָמָּה נִגַּשְׁתֶּם אֶל הַחוֹמָה
  choice: நீங்கள் ஏன் மதிலுக்கு அருகில் சென்றீர்கள்?
  rationale: נגשׁ என்பதன் ‘அணுகு/அருகில் செல்’ என்ற பொருளை, இராணுவத் தவற்றைக் கண்டிக்கும் வினாவாக இயல்பாக வழங்குகிறது.
- source_word: וְאָמַרְתָּ
  choice: நீ … என்று சொல்
  rationale: தூதனுக்குக் கொடுக்கப்படும் நேரடி அறிவுறுத்தலை தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: גַּם
  choice: -வும்
  rationale: உரியாவும் மற்ற உயிரிழந்தவர்களுடன் சேர்ந்து இறந்தான் என்ற சேர்க்கைப் பொருளைத் தமிழ் இணைப்புவிகுதி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַבְדְּךָ
  choice: உங்கள் பணியாளன்
  rationale: அரசரிடம் பேசும் பணிவான அரசவைச் சொல்லாட்சியைப் பாதுகாக்கிறது; இங்கு தேவையில்லாமல் அடிமைத்தனத்தின் வலுவான நுணுக்கத்தைத் திணிக்கவில்லை.
- source_word: אוּרִיָּה הַחִתִּי
  choice: ஏத்தியன் உரியா
  rationale: மக்கள் இன அடையாளத்தையும் உரியாவின் பெயரையும் தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட வடிவில் தருகிறது.
