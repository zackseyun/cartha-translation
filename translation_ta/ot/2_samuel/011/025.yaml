base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/025.yaml
  text: Then David said to the messenger[a], “Thus you shall say to Joab, ‘Do not let this matter be evil in your eyes, for the sword devours one as well as another[c][b]. Strengthen your attack against the city and overthrow it.’ And encourage him.”
translation:
  language: ta
  text: 'அப்போது தாவீது தூதுவனிடம், “நீ யோவாபிடம் இப்படிச் சொல்: ‘இந்தக் காரியம் உன் பார்வையில் தீயதாக இருக்க வேண்டாம்.[a] ஏனெனில் பட்டயம் ஒருவரையும் மற்றொருவரையும் விழுங்கும்.[b] நகருக்கு எதிரான உன் போரை வலுப்படுத்தி, அதை இடித்துப்போடு.’ மேலும், அவனுக்கு ஊக்கமளி.[c]” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தக் காரியம் உனக்கு மனவருத்தம் தர வேண்டாம்.” எபிரெய மொழியில் சொல்லுக்குச் சொல், “இந்தக் காரியம் உன் கண்களில் தீயதாக இருக்க வேண்டாம்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “பட்டயம் இப்படியும் அப்படியும் விழுங்கும்”; அதாவது, பட்டயம் ஒருவரையும் மற்றொருவரையும் கொல்லும்.
    reason: idiom_explanation
  - marker: c
    text: சொல்லுக்குச் சொல், “அவனைத் திடப்படுத்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: தூதுவன்
  rationale: இச்சூழலில் செய்தியை எடுத்துச் செல்லும் மனிதத் தூதுவனையே குறிக்கிறது; வானதூதனை அல்ல.
- source_word: כֹּה תֹאמַר
  choice: இப்படிச் சொல்
  rationale: எடுத்துச் சொல்ல வேண்டிய செய்தியை அறிமுகப்படுத்தும் எபிரெயத் தூது மொழிநடையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אַל יֵרַע בְּעֵינֶיךָ
  choice: உன் பார்வையில் தீயதாக இருக்க வேண்டாம்
  rationale: ‘கண்களில் தீயதாக இருத்தல்’ என்ற மூலமொழி உருவகத்தையும், நிகழ்வைத் தவறானதாகக் கருத வேண்டாம் என்ற தாவீதின் நோக்கத்தையும் காக்கிறது.
- source_word: הַדָּבָר הַזֶּה
  choice: இந்தக் காரியம்
  rationale: அறிக்கையிடப்பட்ட சம்பவத்தை மிகையாக விளக்காமல் பொதுவாகக் குறிக்கிறது.
- source_word: כָּזֹה וְכָזֶה תֹּאכַל הֶחָרֶב
  choice: பட்டயம் இவனையும் அவனையும் விழுங்கும்
  rationale: யாரென்ற வேறுபாடின்றி போர் உயிர்களைப் பலிகொள்ளும் என்ற சொற்றொடரின் பொருளையும், ‘விழுங்கும்’ என்ற உயிர்ப்பான உருவகத்தையும் காக்கிறது.
- source_word: הַחֲזֵק מִלְחַמְתְּךָ
  choice: உன் போரை வலுப்படுத்து
  rationale: חזק என்பதன் ‘வலுப்படுத்து’ என்ற அடிப்படைப் பொருளை வைத்துக்கொண்டு, நகருக்கு எதிரான படை நடவடிக்கையைத் தீவிரப்படுத்தும் கட்டளையாகத் தெளிவுபடுத்துகிறது.
- source_word: וְהָרְסָהּ
  choice: அதை இடித்துப்போடு
  rationale: முற்றுகையிடப்பட்ட நகரத்தைத் தகர்த்தல் அல்லது இடித்தல் என்ற வினையின் நேரடியான படிமத்தைப் பாதுகாக்கிறது.
- source_word: וְחַזְּקֵהוּ
  choice: அவனுக்கு ஊக்கமளி
  rationale: ஆண்பால் ஒருமை பின்னொட்டு இயல்பாக யோவாபைக் குறிக்கிறது; அவரைத் திடப்படுத்தும்படி தூதுவனுக்குக் கொடுக்கப்பட்ட கட்டளையை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: தாவீதின் சொற்களில் நிகழ்வுக்கான ஒழுக்க மதிப்பீடு
  choice: ‘உன் பார்வையில் தீயதாக இருக்க வேண்டாம்’ என்ற மூல உருவகத்தைப் பேணுதல்
  alternative: ‘இதற்காக மனவருத்தப்படாதே’
  rationale: தாவீது உரியாவின் மரணத்தை சாதாரண போரிழப்பாகச் சித்தரிக்க முயல்வதில் உள்ள ஒழுக்கப் பதற்றத்தை மென்மையாக்காமல் காக்கிறது.
- issue: וְחַזְּקֵהוּ என்பதில் ஆண்பால் பின்னொட்டின் குறிப்பு
  choice: ‘அவனுக்கு ஊக்கமளி’—யோவாபைக் குறிக்கும் இயல்பான வாசிப்பு
  alternative: ‘அதை வலுப்படுத்து’—போர் அல்லது தாக்குதலைக் குறிப்பதாக வாசித்தல்
  rationale: எபிரெய வடிவம் ஆண்பால் ஒருமை பொருளைக் கொண்டிருப்பதால் யோவாபே மிக இயல்பான குறிப்பு; இருப்பினும் ‘திடப்படுத்து’ என்ற சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான வேதாகமக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பட்டயம் … விழுங்கும்’ மற்றும் ‘உன் பார்வையில் தீயதாக’ ஆகிய மூலமொழி உருவகங்கள் திட்டமிட்டு காக்கப்பட்டு, அவற்றின் இயல்பான மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
