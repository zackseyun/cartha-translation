translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். மூலத்தில் மூன்று முறை வரும் לִשְׁלוֹם என்பதன் இணைநிலையை ‘நலத்தையும் ... நலத்தையும் ... நிலவரத்தையும்’ என்ற அமைப்பு ஓரளவு காக்கிறது; ‘போரின் நலம்’ என்பது தமிழில் இயல்பற்றதால் ‘போர் நிலவரம்’ பயன்படுத்தப்பட்டது.
