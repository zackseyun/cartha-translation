  text: וַ/יָּבֹ֥א אוּרִיָּ֖ה אֵלָ֑י/ו וַ/יִּשְׁאַ֣ל דָּוִ֗ד לִ/שְׁל֤וֹם יוֹאָב֙ וְ/לִ/שְׁל֣וֹם הָ/עָ֔ם וְ/לִ/שְׁל֖וֹם הַ/מִּלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/007.yaml
  text: When Uriah came to him[a], David asked about Joab's welfare, the welfare of the troops, and the welfare of the war.
translation:
  language: ta
  text: உரியா அவனிடம் வந்தபோது, தாவீது யோவாபின் நலத்தையும், படைவீரர்களின் நலத்தையும், போர் நிலவரத்தையும் விசாரித்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்தபோது
  rationale: בוא என்பதன் இயல்பான பொருள் ‘வருதல்’. தொடரும் செயலைத் தமிழில் சரளமாக இணைக்க ‘வந்தபோது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֵלָיו
  choice: அவனிடம்
  rationale: אֶל என்பது இங்கு தாவீதை நோக்கிய வருகையைக் குறிக்கிறது; ‘அவனிடம்’ என்பது இயல்பான தமிழாக்கம்.
- source_word: וַיִּשְׁאַל
  choice: விசாரித்தான்
  rationale: שׁאל இங்கு போர்முனையின் நிலைமையைப் பற்றி கேட்டறிவதைக் குறிக்கிறது; ‘விசாரித்தான்’ சூழலுக்கு ஏற்ற, கண்ணியமான நடை.
- source_word: לִשְׁלוֹם
  choice: நலத்தையும் / நிலவரத்தையும்
  rationale: שָׁלוֹם இக்கட்டமைப்பில் நலம், நிலை, சூழ்நிலை ஆகியவற்றைக் குறிக்கிறது. நபர்களுக்கு ‘நலம்’ என்றும் போருக்கு இயல்பான தமிழில் ‘நிலவரம்’ என்றும் வழங்கப்பட்டது.
- source_word: יוֹאָב
  choice: யோவாப்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: הָעָם
  choice: படைவீரர்கள்
  rationale: עָם பொதுவாக ‘மக்கள்’ என்றாலும், இப்போர்ச் சூழலில் யோவாபுடன் இருந்த போர்ப்படையினரைக் குறிக்கிறது.
- source_word: הַמִּלְחָמָה
  choice: போர்
  rationale: מִלְחָמָה போர் அல்லது போரிடுதலைக் குறிக்கிறது; இங்கு நடைபெறும் படையெடுப்பைக் குறிக்க ‘போர்’ பொருத்தமானது.
