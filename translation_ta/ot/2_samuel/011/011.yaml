revisions:
- from: 'உரியா தாவீதிடம், “பெட்டியும் இஸ்ரவேலும் யூதாவும் தற்காலிகக் குடில்களில் தங்கியிருக்கிறார்கள்[a]. என் தலைவரான யோவாபும் என் தலைவரின் பணியாளர்களும் திறந்த வெளியில் முகாமிட்டிருக்கிறார்கள். அப்படியிருக்க, நான் என் வீட்டுக்குப் போய் உண்டு குடித்து, என் மனைவியோடு படுப்பேனா?[b] நீர் வாழ்வது எவ்வளவு உறுதியோ, உமது உயிர் வாழ்வதும் எவ்வளவு உறுதியோ, அவ்வளவு உறுதியாகச் சொல்கிறேன்: நான் இப்படிச் செய்யவே மாட்டேன்[c]” என்றான்.'
  to: 'உரியா தாவீதிடம், “பேழையும் இஸ்ரவேலும் யூதாவும் தற்காலிகக் குடில்களில் தங்கியிருக்கிறார்கள்[a]. என் தலைவரான யோவாபும் என் தலைவரின் பணியாளர்களும் திறந்த வெளியில் முகாமிட்டிருக்கிறார்கள். அப்படியிருக்க, நான் என் வீட்டுக்குப் போய் உண்டு குடித்து, என் மனைவியோடு படுப்பேனா?[b] நீர் வாழ்வது எவ்வளவு உறுதியோ, உமது உயிர் வாழ்வதும் எவ்வளவு உறுதியோ, அவ்வளவு உறுதியாகச் சொல்கிறேன்: நான் இப்படிச் செய்யவே மாட்டேன்[c]” என்றான்.'
  rationale: ‘பெட்டி’ என்பதற்குப் பதிலாக ‘பேழை’ இடப்பட்டுள்ளது; இது மூலத்தின் சுருக்கத்தைப் பாதுகாத்தபடியே அறியப்பட்ட הָאָרוֹן குறிப்பைத் தமிழில் தெளிவாக்குகிறது. அடிக்குறிப்பு c-யின் ‘சொல்லுக்கு சொல்’ என்ற தவறான வகைப்படுத்தல் நீக்கப்பட்டு, எபிரெய ஆணைமொழியின் எலிப்டிக்கான அமைப்பு துல்லியமாக விளக்கப்பட்டுள்ளது. வேறு பொருள் மாற்றம் செய்யப்படவில்லை.
