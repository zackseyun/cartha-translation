source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אוּרִיָּ֜ה אֶל דָּוִ֗ד הָ֠/אָרוֹן וְ/יִשְׂרָאֵ֨ל וִֽ/יהוּדָ֜ה יֹשְׁבִ֣ים בַּ/סֻּכּ֗וֹת וַ/אדֹנִ֨/י יוֹאָ֜ב וְ/עַבְדֵ֤י אֲדֹנִ֨/י עַל פְּנֵ֤י הַ/שָּׂדֶה֙ חֹנִ֔ים וַ/אֲנִ֞י אָב֧וֹא אֶל בֵּיתִ֛/י לֶ/אֱכֹ֥ל וְ/לִ/שְׁתּ֖וֹת וְ/לִ/שְׁכַּ֣ב עִם אִשְׁתִּ֑/י חַיֶּ֨/ךָ֙ וְ/חֵ֣י נַפְשֶׁ֔/ךָ אִֽם אֶעֱשֶׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/011.yaml
  text: Uriah said to David[a], “The ark, and Israel and Judah, are staying in shelters, and my lord Joab and the servants of my lord are camped in the open field. Shall I then go to my house to eat and to drink and to lie with my wife? As surely as you live, and as your soul lives[c][b], I will not do this thing.”
translation:
  language: ta
  text: 'உரியா தாவீதிடம், “பேழையும் இஸ்ரவேலும் யூதாவும் தற்காலிகக் குடில்களில் தங்கியிருக்கிறார்கள்[a]. என் தலைவரான யோவாபும் என் தலைவரின் பணியாளர்களும் திறந்த வெளியில் முகாமிட்டிருக்கிறார்கள். அப்படியிருக்க, நான் என் வீட்டுக்குப் போய் உண்டு குடித்து, என் மனைவியோடு படுப்பேனா?[b] நீர் வாழ்வது எவ்வளவு உறுதியோ, உமது உயிர் வாழ்வதும் எவ்வளவு உறுதியோ, அவ்வளவு உறுதியாகச் சொல்கிறேன்: நான் இப்படிச் செய்யவே மாட்டேன்[c]” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் ‘குடில்கள்’ அல்லது ‘தற்காலிகத் தங்குமிடங்கள்’; களத்தில் அமைக்கப்பட்ட எளிய தங்குமிடங்களை இச்சொல் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நான் என் வீட்டுக்குப் போய் உண்டு குடித்து, என் மனைவியோடு படுப்பதா?’ எபிரெய வாக்கியம் உரியாவின் மறுப்பை வெளிப்படுத்தும் வினாவாக உள்ளது.
    reason: alternative_reading
  - marker: c
    text: எபிரெய ஆணைமொழியின் அமைப்பு, ‘நீர் வாழ்வதுபோலவும் உமது உயிர் வாழ்வதுபோலவும், நான் இப்படிச் செய்தால்…’ என்பதாகும். சொல்லப்படாமல் விடப்பட்ட விளைவு, ‘நான் நிச்சயமாக இப்படிச் செய்யமாட்டேன்’ என்ற வலுவான மறுப்பை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  choice: பெட்டி
  rationale: எபிரெய உரையில் விரிவான பட்டமின்றி குறிப்பிட்ட ‘பெட்டி’ என்றே உள்ளது. அறியப்பட்ட பரிசுத்தப் பெட்டியே இங்கு குறிக்கப்படுகிறதாயினும், ‘உடன்படிக்கைப் பெட்டி’ அல்லது ‘தேவனுடைய பெட்டி’ என்று மூலத்தில் இல்லாத விரிவாக்கத்தைச் சேர்க்காமல் அதன் சுருக்கத்தைப் பாதுகாக்கிறது.
- source_word: יֹשְׁבִים בַּסֻּכּוֹת
  choice: தற்காலிகக் குடில்களில் தங்கியிருக்கிறார்கள்
  rationale: סֻכּוֹת என்பது கூடாரங்கள் என்று பொதுமைப்படுத்துவதைவிட, களத்தில் அமைக்கப்படும் தற்காலிகக் குடில்கள் அல்லது மறைவிடங்களைக் குறிக்கிறது. இத்தேர்வு போர்க்காலத் தற்காலிகத் தங்குதலையும் இயல்பான நவீன தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: אֲדֹנִי
  choice: என் தலைவர்
  rationale: இங்கு இது தெய்வீகப் பெயர் அல்ல; மனிதத் தலைவருக்கான மரியாதைச் சொல். ‘என் தலைவர்’ என்பது யோவாபின் அதிகார நிலையையும் உரியாவின் மரியாதையையும் தெளிவாகக் காட்டுகிறது; மூலத்தின் இருமுறைப் பயன்பாடும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: திறந்த வெளியில்
  rationale: சொல்லுக்கு சொல் ‘வயலின் முகப்பின்மேல்’ என்ற எபிரெய மரபுத்தொடர், பாதுகாப்பான வீட்டிற்கு மாறாக வெளியிடத்தில் இருப்பதை உணர்த்துகிறது. ‘திறந்த வெளியில்’ அதன் சூழல்சார் பொருளை இயல்பாக வழங்குகிறது.
- source_word: חֹנִים
  choice: முகாமிட்டிருக்கிறார்கள்
  rationale: நிகழ்ந்துகொண்டிருக்கும் இராணுவ முகாமிடுதலைக் குறிக்கும் பங்கேற்பு வடிவின் தொடர்நிலையை இச்சொல் வெளிப்படுத்துகிறது.
- source_word: וַאֲנִי אָבוֹא אֶל בֵּיתִי
  choice: அப்படியிருக்க, நான் என் வீட்டுக்குப் போய் ... படுப்பேனா?
  rationale: இது சாதாரண எதிர்கால வாக்கியம் அல்ல; முந்தைய சூழ்நிலைகளின் அடிப்படையில் உரியா தெரிவிக்கும் மறுப்பை உள்ளடக்கிய வினாவாக்கியம். ‘அப்படியிருக்க’ அந்தத் தொடர்பையும் வினாவின் எதிர்ப்புணர்வையும் காட்டுகிறது.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת וְלִשְׁכַּב עִם אִשְׁתִּי
  choice: உண்டு குடித்து, என் மனைவியோடு படுப்பது
  rationale: உண்பது, குடிப்பது, மனைவியோடு படுப்பது என்ற மூன்று செயல்களையும் பாதுகாக்கிறது. ‘மனைவியோடு படுப்பது’ என்பது பாலுறவைக் குறிக்கும் மூலத்தின் கண்ணியமான மறைமுகச் சொல்லை இயல்பாகத் தக்கவைக்கிறது.
- source_word: חַיֶּךָ וְחֵי נַפְשֶׁךָ
  choice: நீர் வாழ்வது எவ்வளவு உறுதியோ, உமது உயிர் வாழ்வதும் எவ்வளவு உறுதியோ
  rationale: ஒருவரின் வாழ்வையும் உயிரின் வாழ்வையும் முன்வைக்கும் இரட்டிப்பான எபிரெய ஆணைமொழியின் வலிமையை, தமிழில் புரிந்துகொள்ளக்கூடிய ஒப்புமை அமைப்பில் பாதுகாக்கிறது.
- source_word: אִם אֶעֱשֶׂה אֶת הַדָּבָר הַזֶּה
  choice: நான் இப்படிச் செய்யவே மாட்டேன்
  rationale: ஆணைமொழிக்குப் பின் வரும் אִם (‘என்றால்’) விடுபட்ட சாபவிளைவைக் கொண்ட வலுவான எதிர்மறை ஆணையாகச் செயல்படுகிறது. தமிழில் தவறாக நிபந்தனை வாக்கியமாகப் புரியாமல் இருக்க மறுப்பு வெளிப்படையாகக் கூறப்பட்டுள்ளது; ‘வே’ அதன் வலிமையை உணர்த்துகிறது.
theological_decisions:
- issue: הָאָרוֹן என்பதன் அடையாளம்
  choice: பெட்டி
  alternative: தேவனுடைய பெட்டி / உடன்படிக்கைப் பெட்டி
  rationale: சூழலில் பரிசுத்தப் பெட்டி குறிக்கப்பட்டாலும், இவ்வசனத்தின் எபிரெய உரை ‘பெட்டி’ என்ற மட்டுப்படுத்தப்பட்ட வடிவையே பயன்படுத்துகிறது. மூலத்தில் இல்லாத தெய்வீக அல்லது உடன்படிக்கைத் தலைப்பைச் சேர்க்காமல் அறிந்த குறிப்பின் சுருக்கம் பாதுகாக்கப்பட்டது.
- issue: ஆணைமொழியில் אִם என்பதன் பொருள்
  choice: வலுவான மறுப்பாக வெளிப்படுத்தப்பட்டது
  alternative: ‘நான் இப்படிச் செய்தால்’ என்று முடிவுறாத நிபந்தனையாக விடுவது
  rationale: எபிரெய ஆணை மரபில் விளைவு சொல்லப்படாமல் விடப்பட்டதால் אִם வலுவான ‘நிச்சயமாகச் செய்யமாட்டேன்’ என்ற பொருளைத் தருகிறது. தமிழில் வெறும் நிபந்தனையாக வழங்கினால் உரியாவின் உறுதியான மறுப்பு மறைந்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. போர்க்களச் சூழலின் எதிர்மறை ஒப்புமையும் உரியாவின் மரியாதை கலந்த உறுதியும் பாதுகாக்கப்பட்டுள்ளன. மனித அதிகாரத்தைக் குறிக்கும் אֲדֹנִי என்பதற்கு தெய்வீகத் தவறுபுரிதலைத் தவிர்க்க ‘தலைவர்’ பயன்படுத்தப்பட்டுள்ளது.
