  source_fidelity: மூலத்தின் வாக்கிய அமைப்பு, போர்க்களத்தில் தங்கியிருக்கும் நிலை, உரியாவின் மறுப்பை உணர்த்தும் வினா, மற்றும் ஆணைமொழிக்குப் பின் வரும் வலுவான மறுப்பு ஆகியவை வரைவில் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன. ஆனால் הָאָרוֹן என்பதற்கு ‘பெட்டி’ என்பது நவீனத் தமிழில் பொதுப்பெட்டியைக் குறிக்கக்கூடியதால், இச்சூழலில் குறிப்பிட்ட புனிதப் பொருளைக் குறிக்கும் ‘பேழை’ சிறந்தது.
  naturalness: உரை பொதுவாக நவீன நிலையான தமிழில் இயல்பாக உள்ளது. ஆணைமொழி தெளிவாகவும் கண்ணியமாகவும் உள்ளது. அடிக்குறிப்பு c-யில் ‘சொல்லுக்கு சொல்’ எனக் கூறப்படுவது துல்லியமல்ல; அது விளக்கமான உருமாற்றம் என்பதால் மாற்றப்பட வேண்டும்.
  terminology: ‘பேழை’ என்பது மூலத்தில் இல்லாத ‘உடன்படிக்கை’ அல்லது ‘தேவனுடைய’ என்ற விரிவாக்கத்தைச் சேர்க்காமல், הָאָרוֹן-இன் அறியப்பட்ட குறிப்பையும் வேதாகமச் சொல்லாட்சியையும் தக்கவைக்கிறது. ‘என் தலைவர்,’ ‘முகாமிட்டிருக்கிறார்கள்,’ மற்றும் ‘மனைவியோடு படுப்பது’ ஆகியவை பொருத்தமானவை.
