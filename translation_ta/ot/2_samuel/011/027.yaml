base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/027.yaml
  text: When the mourning was over[a], David sent and brought her into his house, and she became his wife and bore him a son. But the thing that David had done was evil in the eyes of Yahweh.
translation:
  language: ta
  text: துக்ககாலம் முடிந்தபின், தாவீது ஆள் அனுப்பி அவளைத் தன் வீட்டுக்குக் கொண்டுவந்தான். அவள் அவனுக்கு மனைவியாகி, அவனுக்கு ஒரு மகனைப் பெற்றெடுத்தாள். ஆனால் தாவீது செய்த செயல் யாவேயின் பார்வையில் தீயதாக இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாவேக்கு விருப்பமில்லாததாக இருந்தது’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் இன்னும் நேரடியாக, ‘யாவேயின் பார்வையில் தீயதாக இருந்தது’ என்று உள்ளது; இது தாவீதின் செயல்மீதான கடவுளின் அறநெறித் தீர்ப்பை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵבֶל
  choice: துக்ககாலம்
  rationale: உரியாவின் மரணத்திற்குப் பின்பற்றப்பட்ட துக்க அனுசரிப்புக் காலத்தைக் குறிக்கிறது; வெறும் உள்ளார்ந்த வருத்தத்தைவிட சமூகச் சடங்கு சார்ந்த பொருளையும் வெளிப்படுத்துகிறது.
- source_word: וַיַּעֲבֹר
  choice: முடிந்தபின்
  rationale: சொல்லுக்கு நேராக ‘கடந்தது’ என்றாலும், காலப்பகுதியைக் குறிக்கும் இவ்விடத்தில் இயல்பான தமிழில் ‘முடிந்தபின்’ என்பது நிகழ்வுகளின் தொடரைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּשְׁלַח דָּוִד וַיַּאַסְפָהּ אֶל־בֵּיתוֹ
  choice: தாவீது ஆள் அனுப்பி அவளைத் தன் வீட்டுக்குக் கொண்டுவந்தான்
  rationale: தாவீது ஒருவரை அனுப்பி அவளைத் தனது குடும்ப இல்லத்திற்குள் சேர்த்துக்கொண்ட செயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: அவள் அவனுக்கு மனைவியாகி
  rationale: இந்த எபிரெயக் கட்டமைப்பு உறவுநிலையில் ஏற்பட்ட மாற்றத்தைக் காட்டுவதால் ‘மனைவியாகி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַתֵּלֶד לוֹ בֵּן
  choice: அவனுக்கு ஒரு மகனைப் பெற்றெடுத்தாள்
  rationale: יָלַד வினையையும் மறைமுகப் பொருளையும் நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַיֵּרַע
  choice: தீயதாக இருந்தது
  rationale: இது வெறும் விருப்பமின்மையை அல்ல, தாவீதின் செயல்மீதான தெய்வீக அறநெறித் தீர்ப்பைக் குறிக்கிறது.
- source_word: הַדָּבָר אֲשֶׁר עָשָׂה דָוִד
  choice: தாவீது செய்த செயல்
  rationale: דָּבָר இங்கு தாவீது செய்த காரியத்தை அல்லது செயலைக் குறிக்கிறது; தமிழில் ‘செயல்’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: தெய்வீக மதிப்பீட்டைக் குறிக்கும் எபிரெய உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டமாக மாற்றாமல், எபிரெய தனிப்பெயரான יהוה என்பதன் பரவலாக அறியப்பட்ட தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: தாவீதின் செயல்மீதான உரையாளரின் அறநெறித் தீர்ப்பின் வலிமை
  choice: யாவேயின் பார்வையில் தீயதாக இருந்தது
  alternative: யாவேக்குப் பிடிக்காததாக இருந்தது
  rationale: וַיֵּרַע என்பதன் அறநெறி வலிமையை ‘தீயதாக’ என்பது பாதுகாக்கிறது; ‘பிடிக்காததாக’ என்பது கண்டனத்தை வெறும் தனிப்பட்ட விருப்பமாக மெலிதாக்கக்கூடும்.
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனத்தின் தொடர் நிகழ்வு அமைப்பும் இறுதியில் வரும் வலுவான தெய்வீகக் கண்டனமும் பாதுகாக்கப்பட்டுள்ளன.
