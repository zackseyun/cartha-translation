  text: וַ/יִּשְׁלַ֣ח דָּוִ֔ד וַ/יִּדְרֹ֖שׁ לָֽ/אִשָּׁ֑ה וַ/יֹּ֗אמֶר הֲ/לוֹא זֹאת֙ בַּת שֶׁ֣בַע בַּת אֱלִיעָ֔ם אֵ֖שֶׁת אוּרִיָּ֥ה הַ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/003.yaml
  text: So David sent and inquired about the woman, and someone said, “Is this not Bathsheba, the daughter of Eliam, the wife of Uriah the Hittite?”
translation:
  language: ta
  text: தாவீது ஆள் அனுப்பி அந்தப் பெண்ணைப் பற்றி விசாரித்தான். அப்போது ஒருவர், “இவள் எலியாமின் மகளும் ஏத்தியனான உரியாவின் மனைவியுமான பத்சேபாள் அல்லவா?” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד
  choice: தாவீது ஆள் அனுப்பி
  rationale: ‘தாவீது அனுப்பினான்’ என்பதன் விடுபட்ட செயப்படுபொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; தூதுவரையோ குறிப்பிட்ட நபரையோ தேவையின்றி வரையறுக்கவில்லை.
- source_word: וַיִּדְרֹשׁ לָאִשָּׁה
  choice: அந்தப் பெண்ணைப் பற்றி விசாரித்தான்
  rationale: דרשׁ என்பதன் இச்சூழல் பொருளான தகவல் கேட்டறிதலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיֹּאמֶר
  choice: அப்போது ஒருவர் … என்றார்
  rationale: எபிரெய வினை ஆண்பால் ஒருமையில் இருந்தாலும் பேசுபவர் யார் என்பது உரையில் குறிப்பிடப்படவில்லை. தாவீதே பேசினார் என்று தவறாகக் காட்டாமல், அடையாளம் தெரியாத பேச்சாளரை வெளிப்படுத்துகிறது.
- source_word: הֲלוֹא זֹאת
  choice: இவள் … அல்லவா?
  rationale: அடையாளத்தை உறுதிப்படுத்தும் எபிரெய வினாவின் இயல்பையும் சொல்லாட்சியையும் காக்கிறது.
- source_word: בַּת שֶׁבַע
  choice: பத்சேபாள்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: הַחִתִּי
  choice: ஏத்தியனான
  rationale: இன அடையாளத்தைத் தமிழில் இயல்பான பெயரடைவடிவில் வழங்குகிறது.
theological_decisions:
- issue: וַיֹּאמֶר என்பதன் மறைந்த எழுவாய்
  choice: “ஒருவர் … என்றார்” என்று மொழிபெயர்த்தல்
  alternative: “அவன் கூறினான்” அல்லது “தாவீது கூறினான்”
  rationale: மூலத்தில் பேச்சாளரின் அடையாளம் வெளிப்படையாக இல்லை. சூழலிலிருந்து தாவீது அனுப்பிய ஒருவராக இருக்கலாம்; ஆனால் அதை உறுதியாக்காமல் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரை. பெயர்கள் பரவலாக அறியப்பட்ட தமிழ் வேதாகம வடிவங்களில் தரப்பட்டுள்ளன; மூலத்தின் தகவல் வரிசையும் அடையாளத்தை உறுதிப்படுத்தும் கேள்வித் தொனியும் பேணப்பட்டுள்ளன.
