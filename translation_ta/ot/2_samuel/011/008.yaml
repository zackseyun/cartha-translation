base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/008.yaml
  text: Then David said to Uriah[a], “Go down to your house and wash your feet.” So Uriah went out from the king’s house[b], and a present from the king went out after him.
translation:
  language: ta
  text: அப்போது தாவீது உரியாவிடம், “உன் வீட்டுக்கு இறங்கிச் சென்று, உன் கால்களைக் கழுவிக்கொள்[a]” என்றான். உரியா அரசனின் வீட்டிலிருந்து வெளியே சென்றான்; அரசனிடமிருந்து ஓர் அன்பளிப்பு அவனைப் பின்தொடர்ந்து வெளியே சென்றது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கால்களைக் கழுவிக்கொள்” என்பது நேரடிச் சொல்லாட்சி. பயணத்திற்குப் பின் புத்துணர்வு பெறுவதையோ வீட்டில் சென்று தங்குவதையோ இது மறைமுகமாகக் குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “அரசனிடமிருந்து ஒரு பங்கு.” இதற்கான எபிரெயச் சொல் எடுத்துச் செல்லப்படும் அல்லது அனுப்பப்படும் ஒன்றை—பங்கு அல்லது அன்பளிப்பை—குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵד
  choice: போய்
  rationale: இறங்கிச் செல் என்பது சொற்பொருள். ஆனால் அரண்மனையிலிருந்து வீட்டுக்குச் செல்வதைத் தமிழில் இயல்பாகக் கூறுவதற்குப் ‘போய்’ என மொழிபெயர்க்கப்பட்டது; திசைநுட்பம் சூழலில் முக்கியமல்ல.
- source_word: לְבֵיתְךָ
  choice: உன் வீட்டுக்கு
  rationale: בַּיִת என்பதன் நேரடிப் பொருளான ‘வீடு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וּרְחַץ רַגְלֶיךָ
  choice: உன் கால்களைக் கழுவிக்கொள்
  rationale: எபிரெயச் சொல்லாட்சியின் நேரடிப் பொருளைப் பாதுகாக்கிறது. இது பயணத்திற்குப் பின் புத்துணர்வு பெறுவதையோ வீட்டில் தங்குவதையோ மறைமுகமாகக் குறிக்கக்கூடும்; அந்தக் குறிப்பை அடிக்குறிப்பு விளக்குகிறது.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: அரசனின் வீட்டிலிருந்து
  rationale: ‘அரசனின் வீடு’ என்ற எபிரெய வடிவத்தைப் பாதுகாக்கிறது; சூழலில் அது அரண்மனையைக் குறித்தாலும், அதனைத் தெளிவுபடுத்தி மொழிபெயர்க்கவில்லை.
- source_word: מַשְׂאַת הַמֶּלֶךְ
  choice: அரசனிடமிருந்து ஓர் அன்பளிப்பு
  rationale: מַשְׂאֵת என்பது எடுத்துச் செல்லப்படும் அல்லது அனுப்பப்படும் பங்கு, பரிசு, அன்பளிப்பு ஆகியவற்றைக் குறிக்கலாம். இச்சூழலில் ‘அன்பளிப்பு’ இயல்பாக உள்ளது; ‘பங்கு’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אַחֲרָיו
  choice: அவனைத் தொடர்ந்து
  rationale: உரியாவுக்குப் பின்னால் அது சென்றது என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
