translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடையின் எளிமையும் காக்கப்பட்டுள்ளன. எபிரெயத்தின் concrete wording ஆன ‘அரசனின் வீடு’ மற்றும் ‘கால்களைக் கழுவுதல்’ பாதுகாக்கப்பட்டுள்ளன; இயல்பற்ற சொற்றொடரைத் தவிர்க்க இறுதி வாக்கியம் தமிழில் செயப்பாட்டு வடிவில் அமைக்கப்பட்டுள்ளது.
