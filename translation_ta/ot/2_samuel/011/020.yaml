translation_notes:
  register: நவீனத் தரமான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ராஜா’, ‘நகரம்’, ‘மதில்’, ‘போரிடுதல்’ போன்ற பொதுவாகப் புரியும் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன. வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனை வாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
