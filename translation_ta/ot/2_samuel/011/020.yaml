  text: וְ/הָיָ֗ה אִֽם תַּעֲלֶה֙ חֲמַ֣ת הַ/מֶּ֔לֶךְ וְ/אָמַ֣ר לְ/ךָ֔ מַדּ֛וּעַ נִגַּשְׁתֶּ֥ם אֶל הָ/עִ֖יר לְ/הִלָּחֵ֑ם הֲ/ל֣וֹא יְדַעְתֶּ֔ם אֵ֥ת אֲשֶׁר יֹר֖וּ מֵ/עַ֥ל הַ/חוֹמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/020.yaml
  text: And if the king’s anger rises and he says to you[a], ‘Why did you go so near the city to fight? Did you not know what they would shoot from the wall?’
translation:
  language: ta
  text: ராஜாவின் கோபம் எழுந்து, அவர் உன்னிடம், ‘போரிடுவதற்காக நீங்கள் ஏன் நகரத்தை இவ்வளவு நெருங்கிச் சென்றீர்கள்? மதிலின்மேல் இருந்து அவர்கள் எதை எறிவார்கள்[a] என்பது உங்களுக்குத் தெரியாதா?’ என்று கேட்டால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எதை எய்வார்கள்.” எபிரெய வினைச்சொல் அம்பு போன்றவற்றை எய்வதையும், கல் போன்ற எறிபொருட்களை எறிவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: என்றால்
  rationale: இந்தச் சொற்றொடர் யோவாப் முன்வைக்கும் நிபந்தனைச் சூழலை அறிமுகப்படுத்துகிறது. தமிழில் வாக்கிய இறுதியிலுள்ள ‘என்றால்’ நிபந்தனைத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תַּעֲלֶה חֲמַת הַמֶּלֶךְ
  choice: ராஜாவின் கோபம் எழுந்து
  rationale: חֵמָה என்பது கடும் கோபத்தைக் குறிக்கிறது; עלה என்பதன் ‘எழுதல்’ என்ற உருவகத்தையும் தமிழ் இயல்புடன் காக்கிறது.
- source_word: וְאָמַר לְךָ
  choice: அவர் உன்னிடம் ... என்று கேட்டால்
  rationale: நிபந்தனைச் சூழலில் வரும் அரசனின் நேரடிக் கேள்வியைத் தமிழில் இயல்பாக இணைக்கிறது. எபிரெயச் சொல்லின் அடிப்படைப் பொருள் ‘சொன்னால்’ என்றாலும், மேற்கோள் முழுவதும் கேள்விகளாக இருப்பதால் ‘கேட்டால்’ சூழலுக்குப் பொருந்துகிறது.
- source_word: מַדּוּעַ נִגַּשְׁתֶּם אֶל הָעִיר
  choice: நீங்கள் ஏன் நகரத்தை இவ்வளவு நெருங்கிச் சென்றீர்கள்?
  rationale: נגשׁ என்பதன் ‘நெருங்குதல்’ பொருளையும், மதிலுக்கு அளவுக்கு மீறி அருகே சென்றதைச் சாடும் தொனியையும் வெளிப்படுத்துகிறது.
- source_word: לְהִלָּחֵם
  choice: போரிடுவதற்காக
  rationale: நகரத்தை நெருங்கியதன் நோக்கத்தைத் தெளிவாகவும் சுருக்கமாகவும் காட்டுகிறது.
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: உங்களுக்குத் தெரியாதா?
  rationale: உறுதியான பதிலை எதிர்பார்க்கும் எதிர்மறை வினாவின் கண்டிக்கும் தொனியைப் பாதுகாக்கிறது.
- source_word: אֵת אֲשֶׁר יֹרוּ
  choice: அவர்கள் எதை எறிவார்கள்
  rationale: ירה என்ற வினை எய்தல் அல்லது எறிதல் ஆகிய இரண்டையும் குறிக்கலாம். அடுத்த வசனத்தில் அபிமெலேக்கின்மேல் எறியப்பட்ட எந்திரக்கல் நினைவூட்டப்படுவதால், இங்கு பொதுவான ‘எறிவார்கள்’ என்பது சூழலையும் எபிரெயச் சொல்லின் பரப்பையும் நன்றாகக் காக்கிறது.
- source_word: מֵעַל הַחוֹמָה
  choice: மதிலின்மேல் இருந்து
  rationale: מֵעַל என்பதிலுள்ள ‘மேலிருந்து’ என்ற இடவியல் குறிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
