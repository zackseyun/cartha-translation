  text: וַ/יִּשְׁכַּ֣ב אוּרִיָּ֗ה פֶּ֚תַח בֵּ֣ית הַ/מֶּ֔לֶךְ אֵ֖ת כָּל עַבְדֵ֣י אֲדֹנָ֑י/ו וְ/לֹ֥א יָרַ֖ד אֶל בֵּיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/009.yaml
  text: But Uriah slept at the entrance of the king’s house with all the servants of his lord[d][c][b][a], and did not go down to his house.
translation:
  language: ta
  text: ஆனால் உரியா அரசனுடைய வீட்டின் நுழைவாயிலில் தன் தலைவனின் பணியாளர்கள் அனைவரோடும் படுத்துக்கொண்டான்[a]; அவன் தன் வீட்டிற்குச் செல்லவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூங்கினான்” / “அங்கே இரவைக் கழித்தான்.” எபிரெய வினைச்சொல் படுத்துக்கொள்வதையோ தூங்குவதையோ குறிக்கலாம்; இங்கே உரியா அந்த இடத்தில் இரவைக் கழித்ததைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “தன் வீட்டிற்குக் கீழே இறங்கிச் செல்லவில்லை.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: படுத்துக்கொண்டான்
  rationale: שׁכב என்பதன் அடிப்படைப் பொருள் ‘படுத்துக்கொள்’; இச்சூழலில் இரவைக் கழித்ததையும் குறிக்கிறது. ‘தூங்கினான்’ என்பதைக் காட்டிலும் மூலத்தின் பொருள் வரம்பை இது காக்கிறது.
- source_word: פֶּתַח
  choice: நுழைவாயிலில்
  rationale: פֶּתַח என்பது திறப்பு, வாசல் அல்லது நுழைவிடம் என்பதைக் குறிக்கும்; அரசனுடைய இல்லச் சூழலில் ‘நுழைவாயில்’ இயல்பாகவும் இடத்தைக் குறிக்கும் வகையிலும் உள்ளது.
- source_word: בֵּית הַמֶּלֶךְ
  choice: அரசனுடைய வீடு
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருளைத் தக்கவைக்கிறது; சூழலில் இது அரண்மனையைக் குறித்தாலும், ‘வீடு’ என்ற மூலச் சொல்லைத் தேவையின்றி விளக்கமாக மாற்றவில்லை.
- source_word: אֵת כָּל עַבְדֵי אֲדֹנָיו
  choice: தன் ஆண்டவனுடைய பணியாளர்கள் அனைவரோடும்
  rationale: אֵת இங்கு உடனிருப்பைச் சுட்டுகிறது. עֲבָדִים என்பதற்கு இச்சூழலில் ‘பணியாளர்கள்’ இயல்பானது; אֲדֹנָיו தாவீதின் அதிகார உறவைக் காட்டுவதால் ‘தன் ஆண்டவன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְלֹא יָרַד אֶל בֵּיתוֹ
  choice: அவன் தன் வீட்டிற்குச் செல்லவில்லை
  rationale: ירד என்பதன் நேரடிப் பொருள் ‘கீழே செல்’ என்றாலும், தமிழில் இங்கு ‘வீட்டிற்குச் செல்லவில்லை’ என்பது இயல்பாக உள்ளது; இலக்கு இடமான ‘தன் வீடு’ தெளிவாகத் தக்கவைக்கப்படுகிறது.
