- from: ஆனால் உரியா அரசனுடைய வீட்டின் நுழைவாயிலில், தன் ஆண்டவனுடைய பணியாளர்கள் அனைவரோடும் படுத்துக்கொண்டான்[a]; அவன் தன் வீட்டிற்குச் செல்லவில்லை[b].
  to: ஆனால் உரியா அரசனுடைய வீட்டின் நுழைவாயிலில் தன் தலைவனின் பணியாளர்கள் அனைவரோடும் படுத்துக்கொண்டான்[a]; அவன் தன் வீட்டிற்குச் செல்லவில்லை[b].
  rationale: The revision retains the draft’s close rendering of the narrative while replacing a potentially theologically loaded Tamil term for David with a natural human-superior term. It also repairs the directional literal footnote so that it accurately reflects the Hebrew idiom without altering the main text’s idiomatic Tamil.
