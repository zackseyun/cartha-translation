translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரை. ‘அரசனுடைய வீடு’ என்பது மூலத்தின் வடிவத்தைத் தக்கவைக்கிறது; ‘அரண்மனை’ என்பது சாத்தியமான விளக்க மொழிபெயர்ப்பு. ‘ஆண்டவன்’ இங்கு இறைப்பட்டம் அல்ல, உரியாவின் அரசரும் மேலதிகாரியுமான தாவீதைக் குறிக்கும்.
