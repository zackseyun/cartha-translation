base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/002.yaml
  text: Then at evening time David arose from his bed and walked on the roof of the king’s house[a], and from the roof he saw a woman bathing[b]; and the woman was very beautiful in appearance.
translation:
  language: ta
  text: மாலை வேளையில்[a], தாவீது தன் படுக்கையிலிருந்து எழுந்து அரசனின் வீட்டின்[b] மொட்டைமாடியில் நடந்தான். அங்கிருந்து அவன் குளித்துக்கொண்டிருந்த ஒரு பெண்ணைக் கண்டான்; அந்தப் பெண் பார்ப்பதற்கு மிகவும் அழகாக இருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், சொல்லுக்குச் சொல்லாக, “மாலை வேளையில் அது நிகழ்ந்தது.” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “அரசனின் வீடு”; சூழலின்படி “அரண்மனை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לְעֵת הָעֶרֶב
  choice: மாலை வேளையில்
  rationale: எபிரெயக் கதைநடையின் நிகழ்வு அறிமுகச் சொற்றொடரைத் தமிழில் இயல்பான காலக் குறிப்பாக அளிக்கிறது; நிகழ்வுகளின் தொடர்ச்சியையும் காக்கிறது.
- source_word: מֵעַל מִשְׁכָּבוֹ
  choice: தன் படுக்கையிலிருந்து
  rationale: מִשְׁכָּב என்பது படுக்கை அல்லது படுக்கும் இடத்தைக் குறிக்கலாம்; இச்சூழலில் ‘படுக்கை’ இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: וַיִּתְהַלֵּךְ
  choice: நடந்துகொண்டிருந்தான்
  rationale: ஹித்பயேல் வடிவம் நீடித்த அல்லது திரும்பத் திரும்ப நிகழும் நடையைச் சுட்டக்கூடும்; தேவையற்ற நோக்கத்தைச் சேர்க்காமல் தொடர்ச்சியான செயலை இத்தேர்வு வெளிப்படுத்துகிறது.
- source_word: עַל גַּג בֵּית הַמֶּלֶךְ
  choice: அரசனின் வீட்டின் மொட்டைமாடியில்
  rationale: ‘அரசனின் வீடு’ என்ற எபிரெயச் சொல்லமைப்புக்கு நெருக்கமாக உள்ளது. பழங்காலத் தட்டையான கூரையை நவீன தமிழில் ‘மொட்டைமாடி’ தெளிவாகக் குறிக்கிறது.
- source_word: וַיַּרְא אִשָּׁה רֹחֶצֶת
  choice: குளித்துக்கொண்டிருந்த ஒரு பெண்ணை அவன் கண்டான்
  rationale: רֹחֶצֶת என்ற நிகழ்காலப் பங்கேற்பு வடிவத்தின் தொடர்ச்சியான செயலை ‘குளித்துக்கொண்டிருந்த’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵעַל הַגָּג
  choice: மொட்டைமாடியிலிருந்து
  rationale: இந்தச் சொற்றொடர் இயல்பாகத் தாவீது பார்த்த இடத்தைக் குறிக்கிறது; அவனுடைய பார்வை நிலையைத் தெளிவாகக் காக்கிறது.
- source_word: טוֹבַת מַרְאֶה מְאֹד
  choice: பார்ப்பதற்கு மிகவும் அழகாக இருந்தாள்
  rationale: מַרְאֶה என்பதிலுள்ள தோற்றம் மற்றும் பார்வை சார்ந்த வலியுறுத்தலை இயல்பான நவீன தமிழில் காக்கிறது.
