  register: நவீன நிலையான தமிழில், கண்ணியமானதும் சாதாரண வாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் ‘கீழே செல்’ என்ற இடவியல் மரபுத்தொடர் முதன்மை உரையில் இயல்பான தமிழாக வழங்கப்பட்டு, அதன் நேரடிப் படிமம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
