  yaml_path: translation/ot/2_samuel/011/010.yaml
  text: They told David[a], saying, “Uriah did not go down to his house.” So David said to Uriah[b], “Have you not come from a journey? Why did you not go down to your house?”
translation:
  language: ta
  text: அவர்கள் தாவீதிடம், “உரியா தன் வீட்டிற்கு இறங்கிச் செல்லவில்லை” என்று தெரிவித்தார்கள்.[a] அப்போது தாவீது உரியாவிடம், “நீ பயணத்திலிருந்து வந்திருக்கிறாய் அல்லவா? ஏன் உன் வீட்டிற்கு இறங்கிச் செல்லவில்லை?” என்று கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இரு இடங்களிலும் உள்ள சொற்றொடர், சொல்லுக்குச் சொல், ‘வீட்டிற்கு இறங்கிச் செல்வது’ என்பதாகும். அரண்மனைப் பகுதி அல்லது உயரமான இடத்திலிருந்து ஒருவருடைய வீட்டிற்குச் செல்வதை இது குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: அவர்கள் தாவீதிடம், … என்று தெரிவித்தார்கள்
  rationale: הגיד என்பதன் ‘தெரிவி/அறிவி’ என்ற அறிவித்தல் பொருளை இயல்பான தமிழ் மறைமுகக் கூற்றாக வழங்குகிறது; לֵאמֹר-ஐ தனியே செயற்கையாக மொழிபெயர்க்காமல் மேற்கோள் அமைப்பில் பிரதிபலிக்கிறது.
- source_word: לֹא יָרַד אוּרִיָּה אֶל־בֵּיתוֹ
  choice: உரியா தன் வீட்டுக்குச் செல்லவில்லை
  rationale: יָרַד என்பதன் நேரடிப் பொருள் ‘கீழே சென்றான்’ என்றாலும், இச்சூழலில் வீட்டுக்குச் செல்வதைக் குறிக்கும் எபிரெய மரபுத்தொடரை நவீனத் தமிழில் தெளிவாகக் கூறுகிறது. ‘தன் வீடு’ என்பது உரியாவையே சுட்டும் உடைமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֹּאמֶר דָּוִד אֶל־אוּרִיָּה
  choice: அப்போது தாவீது உரியாவிடம் … என்று கேட்டான்
  rationale: தொடர்ந்து நிகழும் உரையாடலை ‘அப்போது’ இயல்பாகக் காட்டுகிறது; மூலத்தில் אמר இருந்தாலும், அதைத் தொடர்ந்து வரும் கேள்விகளின் காரணமாக ‘கேட்டான்’ என்பது தமிழ் உரைநடைக்கு ஏற்றது.
- source_word: הֲלוֹא
  choice: அல்லவா?
  rationale: உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் எதிர்மறை வினாவின் சொல்லாற்றலை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: מִדֶּרֶךְ אַתָּה בָא
  choice: நீ பயணத்திலிருந்து வந்திருக்கிறாய்
  rationale: דֶּרֶךְ நேரடியாக ‘வழி/சாலை’ எனப் பொருள்பட்டாலும், இங்கு பயணம் செய்து வருவதைக் குறிக்கிறது. ‘திரும்பி வந்தாய்’ என்று கூறாமல், בוא-இன் பொதுவான ‘வருதல்’ பொருளைப் பாதுகாக்கிறது.
- source_word: מַדּוּעַ לֹא־יָרַדְתָּ אֶל־בֵּיתֶךָ
  choice: ஏன் உன் வீட்டுக்குச் செல்லவில்லை?
  rationale: முந்தைய கூற்றின் சொல் மீளுருவாக்கத்தையும் கேள்வியின் நேரடியான வலிமையையும் காக்கிறது; இடவியல் ‘கீழே’ என்ற விவரம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
