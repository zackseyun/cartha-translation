- from: 'அவன் அந்தத் தூதனுக்குக் கட்டளையிட்டுச் சொன்னது: “போரைப் பற்றிய எல்லாச் செய்திகளையும் அரசனிடம் சொல்லி முடித்தபின்,”'
  to: அவன் அந்தத் தூதனுக்குக் கட்டளையிட்டு, “போரைப் பற்றிய எல்லாச் செய்திகளையும்[a] அரசனிடம் சொல்லி முடித்தபின்,” என்றான்.
