  yaml_path: translation/ot/2_samuel/011/019.yaml
  text: And he commanded the messenger[a], saying, “When you have finished telling the king all the news of the battle,”
translation:
  language: ta
  text: அவன் அந்தத் தூதனுக்குக் கட்டளையிட்டு, “போரைப் பற்றிய எல்லாச் செய்திகளையும்[a] அரசனிடம் சொல்லி முடித்தபின்,” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போரின் எல்லாக் காரியங்களையும்”; அதாவது, போரைப் பற்றிய முழு அறிக்கை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டுச் சொன்னது
  rationale: צוה என்பதில் அதிகாரத்துடன் கட்டளையிடுதல் அல்லது அறிவுறுத்துதல் என்ற வலிமை உள்ளது; தொடரும் நேரடிக் கூற்றோடு இயல்பாக இணைக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הַמַּלְאָךְ
  choice: அந்தத் தூதன்
  rationale: இச்சூழலில் மַלְאָךְ வானதூதரை அல்ல, போர்ச் செய்தியை எடுத்துச் செல்லும் மனிதத் தூதரைக் குறிக்கிறது.
- source_word: לֵאמֹר
  choice: சொன்னது
  rationale: எபிரெயக் கதைநடையில் நேரடிக் கூற்றை அறிமுகப்படுத்தும் வழக்கமான சொல்லாக்கம்; தமிழில் முந்தைய வினையுடன் இயல்பாக இணைக்கப்பட்டது.
- source_word: כְּכַלּוֹתְךָ
  choice: சொல்லி முடித்தபின்
  rationale: כְּ உடன் வரும் வினையெச்ச அமைப்பு காலத்தைக் குறிக்கிறது; செயல் முடிந்த பின்வரும் நிலையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: போரைப் பற்றிய எல்லாச் செய்திகள்
  rationale: சொல்லுக்கு சொல் ‘போரின் எல்லா வார்த்தைகள்/காரியங்கள்’; இங்கு அரசனுக்குக் கொண்டு செல்லப்படும் முழுப் போரறிக்கையைச் சுட்டுவதால் ‘எல்லாச் செய்திகள்’ இயல்பான சூழல்சார் பொருள்.
- source_word: לְדַבֵּר אֶל הַמֶּלֶךְ
  choice: அரசனிடம் சொல்லி
  rationale: அரசனிடம் போரின் விவரங்களைத் தெரிவிக்கும் செயலைக் குறிக்கிறது; ‘பேசி’ என்பதைக் காட்டிலும் அறிக்கை அளிக்கும் சூழலில் ‘சொல்லி’ இயல்பானது.
