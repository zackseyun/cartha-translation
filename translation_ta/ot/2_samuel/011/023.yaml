  text: וַ/יֹּ֤אמֶר הַ/מַּלְאָךְ֙ אֶל דָּוִ֔ד כִּֽי גָבְר֤וּ עָלֵ֨י/נוּ֙ הָֽ/אֲנָשִׁ֔ים וַ/יֵּצְא֥וּ אֵלֵ֖י/נוּ הַ/שָּׂדֶ֑ה וַ/נִּהְיֶ֥ה עֲלֵי/הֶ֖ם עַד פֶּ֥תַח הַ/שָּֽׁעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/023.yaml
  text: The messenger said to David[a], “The men were stronger than we were, and they came out against us into the open field[b]; but we pressed them back as far as the entrance of the gate.”
translation:
  language: ta
  text: 'தூதுவன் தாவீதிடம், “அந்த ஆட்கள் எங்களுக்கு எதிராக மேலோங்கினார்கள்[a]; அவர்கள் எங்களை எதிர்த்து திறந்த வெளிக்கு வெளியே வந்தார்கள். ஆனால் நாங்கள் அவர்களை வாசலின் நுழைவிடம் வரை பின்னுக்குத் தள்ளினோம்[b]” என்றான்.


    [a] அல்லது, “அந்த ஆட்கள் எங்களைவிட வலிமைமிக்கவர்களாக இருந்தார்கள்.”


    [b] எபிரெய மொழியில், “நாங்கள் அவர்கள்மேல் இருந்தோம்.” இது தாக்குதலில் முன்னிலை பெற்று எதிரிகளைப் பின்னுக்குத் தள்ளுவதைக் குறிக்கும் போர் வழக்கு.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த ஆட்கள் எங்களைவிட வலிமைமிக்கவர்களாக இருந்தார்கள்.”
    reason: גָבְרוּ עָלֵינוּ என்ற சொற்றொடர் ‘எங்களுக்கு எதிராக மேலோங்கினார்கள்’ என்றும் ‘எங்களைவிட வலிமைமிக்கவர்களாக இருந்தார்கள்’ என்றும் பொருள்படக்கூடிய நுணுக்கத்தைப் பாதுகாக்கிறது.
  - marker: b
    text: எபிரெய மொழியில், “நாங்கள் அவர்கள்மேல் இருந்தோம்.” இது தாக்குதலில் முன்னிலை பெற்று எதிரிகளைப் பின்னுக்குத் தள்ளுவதைக் குறிக்கும் போர் வழக்கு.
    reason: וַנִּהְיֶה עֲלֵיהֶם என்பதன் சொல்லடியான வடிவத்தையும் அதன் சூழல்சார் போர்ப்பொருளையும் காட்டுகிறது.
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: தூதுவன்
  rationale: இச்சூழலில் இது தேவதூதரை அல்ல, போர்க்களச் செய்தியைக் கொண்டுவரும் மனிதத் தூதரைச் சுட்டுகிறது.
- source_word: כִּי
  choice: நேரடி தனிச்சொல்லாக மொழிபெயர்க்காமல் அறிக்கையின் உள்ளடக்கத்தை அறிமுகப்படுத்துதல்
  rationale: இங்கு כִּי தூதுவன் கூறிய செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் மேற்கோளின் தொடக்கமே இந்தப் பணியை இயல்பாகச் செய்கிறது.
- source_word: גָבְרוּ עָלֵינוּ
  choice: எங்களுக்கு எதிராக மேலோங்கினார்கள்
  rationale: גבר + עַל என்பது ஒருவருக்கு எதிராக வலிமை பெற்று மேலோங்குவதைக் குறிக்கிறது. முதன்மை உரை அதன் போர்சார் இயக்கத்தைக் காக்கிறது; ஒப்பீட்டு நுணுக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הָאֲנָשִׁים
  choice: அந்த ஆட்கள்
  rationale: எபிரெய உரை பொதுவாக ‘ஆட்கள்’ என்றே கூறுகிறது. ‘வீரர்கள்’ அல்லது ‘எதிரிகள்’ என்று விரிவுபடுத்தாமல் மூலத்தின் பொதுத்தன்மை காக்கப்பட்டுள்ளது.
- source_word: וַיֵּצְאוּ אֵלֵינוּ הַשָּׂדֶה
  choice: அவர்கள் எங்களை எதிர்த்து வெளியே திறந்த வெளிக்கு வந்தார்கள்
  rationale: நகரிலிருந்து வெளியே வந்து திறந்த வெளியில் தாக்க வந்த பகைமைச் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַנִּהְיֶה עֲלֵיהֶם
  choice: நாங்கள் அவர்களை ... பின்னுக்குத் தள்ளினோம்
  rationale: சொல்லுக்கு சொல் ‘நாங்கள் அவர்கள்மேல் இருந்தோம்’ என்றாலும், இங்கு எதிர்த்தாக்குதலில் முன்னிலை பெற்று அவர்களை வாயில் வரை தள்ளிய போர்சார் வழக்காகப் புரிகிறது. சொல்லடியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: நகரவாசலின் நுழைவிடம் வரை
  rationale: פֶּתַח என்பதன் ‘நுழைவிடம்/திறப்பு’ என்ற பொருளையும், עַד குறிக்கும் நகர்வின் எல்லையையும் தெளிவாகக் காக்கிறது. சூழல் காரணமாக வாயில் நகரவாசல் என்று தெளிவுபடுத்தப்பட்டுள்ளது.
