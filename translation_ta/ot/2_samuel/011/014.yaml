  terminology: தாவீது, யோவாபு, உரியா ஆகிய பெயர்கள் நிலையான தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ப உள்ளன. ‘கடிதம்’ என்பது இச்சூழலில் סֵפֶר என்பதற்கான பொருத்தமான மொழிபெயர்ப்பு. அடிக்குறிப்பு சொற்படியான மற்றும் செயல்பாட்டுச் சாத்தியங்களைச் சரியாக விளக்குகிறது.
