source:
  edition: WLC
  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וַ/יִּכְתֹּ֥ב דָּוִ֛ד סֵ֖פֶר אֶל יוֹאָ֑ב וַ/יִּשְׁלַ֖ח בְּ/יַ֥ד אוּרִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/014.yaml
  text: In the morning[a], David wrote a letter to Joab and sent it by the hand of Uriah.
translation:
  language: ta
  text: காலையில், தாவீது யோவாபுக்கு ஒரு கடிதம் எழுதி, அதை உரியாவின் கையில் கொடுத்து அனுப்பினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “உரியா மூலம் அனுப்பினான்” அல்லது “உரியாவிடம் கொடுத்து அனுப்பினான்.” எபிரெய மொழியில் சொற்படியாக “உரியாவின் கையால்” அல்லது “உரியாவின் கையில்” என்று உள்ளது; இது ஒருவர் மூலமாக ஒன்றை அனுப்புவதைக் குறிக்கும் மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: காலையில்
  rationale: היה என்பதன் தொடர்கதை வடிவம் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது; தமிழில் தனியாக ‘அப்போது நிகழ்ந்தது’ என்று மொழிபெயர்ப்பது இயல்பற்றதாக இருப்பதால், காலக் குறிப்பான ‘காலையில்’ என்பதே கதையின் தொடர்ச்சியையும் பொருளையும் இயல்பாகத் தருகிறது.
- source_word: וַיִּכְתֹּב
  choice: எழுதி
  rationale: எழுதுதலைக் குறிக்கும் வழக்கமான கதைநடை வினை; அடுத்த வினையுடன் இயல்பான தமிழ் தொடர்வினையாக அமைக்கப்பட்டது.
- source_word: סֵפֶר
  choice: ஒரு கடிதம்
  rationale: இச்சொல் பொதுவாக ஓர் எழுத்துப்பூர்வ ஆவணத்தைக் குறிக்கலாம்; இங்கு யோவாபுக்கு எழுதப்பட்டு அனுப்பப்படும் செய்தி என்பதால் ‘கடிதம்’ என்பது சூழலுக்கு ஏற்ற இயல்பான பொருள்.
- source_word: אֶל יוֹאָב
  choice: யோவாபுக்கு
  rationale: אֶל பெறுநரைக் குறிக்கிறது; தமிழில் நான்காம் வேற்றுமை உருபுடன் ‘யோவாபுக்கு’ என்பது இயல்பான வடிவம்.
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினான்
  rationale: அனுப்புதலைக் குறிக்கும் நேரடியான கதைநடை வினை.
- source_word: בְּיַד אוּרִיָּה
  choice: உரியாவின் கையில் கொடுத்து
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘உரியாவின் கையால்/கையில்’ என இருந்து, அவர் கடிதத்தை எடுத்துச் சென்ற வழிமுறையைக் குறிக்கிறது. ‘கையில் கொடுத்து’ என்பது உடனடி படிமத்தையும், உரியா தானே கடிதத்தைச் சுமந்த துயரமான சூழலையும் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
