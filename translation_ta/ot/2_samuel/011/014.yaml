  source_fidelity: மூல எபிரெயத்தின் நிகழ்வுவரிசை, காலக்குறிப்பு, தாவீது கடிதம் எழுதியமை, யோவாப் பெறுநராக இருப்பது, மற்றும் உரியாவினால்/உரியாவின் கையில் அதை அனுப்பியமை ஆகிய அனைத்தும் துல்லியமாக வெளிப்பட்டுள்ளன. ‘கையில் கொடுத்து அனுப்பினான்’ என்பது בְּיַד என்ற சொல்லின் கை-படிமத்தையும் உரியா தானே கடிதத்தை ஏந்திச் சென்ற சூழலையும் இயல்பாகக் காக்கிறது.
