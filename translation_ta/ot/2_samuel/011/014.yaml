  register: நவீனத் தரமான, கண்ணியமான தமிழ் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கையில் கொடுத்து’ என்ற இயல்பான சொற்றொடர் எபிரெய மூலத்தின் கை-படிமத்தைப் பேணுகிறது; அடிக்குறிப்பு அதன் மரபுத்தொடர்ப் பொருளையும் மாற்று மொழிபெயர்ப்புகளையும் விளக்குகிறது.
