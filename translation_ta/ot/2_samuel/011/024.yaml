base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/024.yaml
  text: The archers shot at your servants from atop the wall[a], and some of the king’s servants died[b]; your servant Uriah the Hittite also died.
translation:
  language: ta
  text: மதிலின் மேலிருந்து வில்வீரர்கள் உமது பணியாளர்களை நோக்கி அம்பெய்தினார்கள். அரசரின் பணியாளர்களில் சிலர் இறந்தார்கள்[a]; உமது பணியாளனான ஏத்தியன் உரியாவும் இறந்துவிட்டான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அரசரின் பணியாளர்களிலிருந்து’ என்று உள்ளது; இங்குள்ள முன்னிடைச்சொல் ‘அவர்களில் சிலர்’ என்ற பகுதிப்பொருளில் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘இறந்திருக்கிறான்’; எபிரெயச் சொல் இறந்த நிலையையும் குறிப்பிடக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרוּ / הַמּוֹרִים
  choice: வில்வீரர்கள் ... அம்பெய்தினார்கள்
  rationale: ירה என்ற வினையும் அதன் பெயரெச்ச வடிவமும் போர்ச் சூழலில் அம்பெய்பவர்களைக் குறிக்கின்றன. இயல்பான நவீனத் தமிழில் செயலும் செய்பவர்களும் தெளிவாகத் தெரிவதற்காக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אֶל עֲבָדֶיךָ
  choice: உமது பணியாளர்களை நோக்கி
  rationale: சுடுதல் அல்லது அம்பெய்துதல் சார்ந்த சூழலில் אֶל இலக்கை நோக்கிய செயலைக் குறிக்கிறது. עֲבָדֶיךָ என்பதிலுள்ள அரசவை மரியாதையைக் காக்க ‘உமது பணியாளர்கள்’ எனத் தரப்பட்டது.
- source_word: מֵעַל הַחוֹמָה
  choice: மதிலின் மேலிருந்து
  rationale: מֵעַל உயர்ந்த இடத்திலிருந்து நிகழ்ந்த செயலைக் காட்டுகிறது; தமிழில் இது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וַיָּמֻתוּ מֵעַבְדֵי הַמֶּלֶךְ
  choice: அரசரின் பணியாளர்களில் சிலர் இறந்தார்கள்
  rationale: מִן இங்கு ஒரு முழுக் குழுவிலிருந்து ஒரு பகுதியைக் குறிக்கும் பகுதிப்பொருளில் புரிந்துகொள்ளப்படுகிறது. எனவே ‘பணியாளர்களில் சிலர்’ என்பது எபிரெயச் சொல்லமைப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְגַם
  choice: உம்
  rationale: உரியாவின் மரணத்தை முன்பு கூறப்பட்ட மரணங்களோடு கூடுதலாகவும் உச்சக்கட்டச் செய்தியாகவும் இணைக்கும் பொருள் தமிழில் ‘உம்’ மூலம் சுருக்கமாகப் பாதுகாக்கப்படுகிறது.
- source_word: עַבְדְּךָ אוּרִיָּה הַחִתִּי
  choice: உமது பணியாளனான இத்தியன் உரியா
  rationale: அரசரிடம் பேசும் மரியாதைத் தொனியை ‘உமது பணியாளன்’ காக்கிறது. הַחִתִּי என்பதற்கு மூலமொழி ஒலிப்பை அணுகும் ‘இத்தியன்’ பயன்படுத்தப்பட்டது.
- source_word: מֵת
  choice: இறந்துவிட்டான்
  rationale: எபிரெய வடிவம் ‘இறந்த நிலையில் இருக்கிறான்’ என்ற நிலைமையையும் சுட்டலாம். நிகழ்ந்த மரணத்தையும் அதன் தற்போதைய விளைவையும் தமிழில் இயல்பாகக் காட்ட ‘இறந்துவிட்டான்’ தேர்ந்தெடுக்கப்பட்டது.
