translation_notes:
  register: நவீனத் தரத் தமிழில், அரசவைக்குரிய மரியாதைத் தொனியுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பணியாளர்’ என்பது עבד என்பதன் பணிவான அரசவைப் பயன்பாட்டைக் காக்கிறது; போர்ச் சூழலைத் தெளிவாக்க ‘வில்வீரர்கள் ... அம்பெய்தினார்கள்’ பயன்படுத்தப்பட்டுள்ளது.
