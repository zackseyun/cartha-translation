base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/004.yaml
  text: So David sent messengers and took her[a], and she came to him, and he lay with her. Now she was purifying herself from her uncleanness. Then she returned to her house.
translation:
  language: ta
  text: தாவீது தூதுவர்களை அனுப்பி அவளை வரவழைத்தான். அவள் அவனிடம் வந்தாள்; அவன் அவளுடன் உடலுறவு கொண்டான். அவள் தன் சடங்குத் தீட்டிலிருந்து தன்னைத் தூய்மைப்படுத்திக்கொண்டிருந்தாள்.[a] பின்னர் அவள் தன் வீட்டிற்குத் திரும்பினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவள் தன் சடங்குத் தீட்டிலிருந்து தூய்மையடைந்திருந்தாள்.” எபிரெய வாக்கியம் மாதவிடாய்க்குப் பிந்தைய சடங்குத் தூய்மைப்படுத்தலைப் பற்றிய பின்னணிக் குறிப்பாகப் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பி
  rationale: שלח என்பதன் எளிய இறந்தகாலக் கதைத் தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: מַלְאָכִים
  choice: தூதுவர்களை
  rationale: இங்கு மனிதத் தூதர்களைக் குறிக்கும் சொல்லின் நேரடியான பொருளைத் தக்கவைக்கிறது; அவர்களுடைய அதிகாரப்பூர்வப் பங்கை மேலதிகமாக ஊகிக்கவில்லை.
- source_word: וַיִּקָּחֶהָ
  choice: அவளை வரவழைத்தான்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’ என்றாலும், தூதுவர்களை அனுப்பிய இச்சூழலில் தாவீது அவர்கள்மூலம் அவளைத் தன்னிடம் கொண்டுவரச் செய்ததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது. ‘அவளை எடுத்துக்கொண்டான்’ என்பது தமிழில் திருமணம் செய்துகொண்டான் என்ற தவறான உணர்வை ஏற்படுத்தலாம்.
- source_word: וַתָּבֹוא אֵלָיו
  choice: அவள் அவனிடம் வந்தாள்
  rationale: இயக்க வினையையும் אֵלָיו என்ற உறவையும் நேராகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: அவன் அவளுடன் உடலுறவுகொண்டான்
  rationale: எபிரெய மொழிவழக்கின் பாலுறவுப் பொருளை நவீன வாசகருக்கு தெளிவாகவும் கண்ணியமாகவும் தருகிறது; பழமையான அல்லது புரியாமை தரக்கூடிய சொற்களைத் தவிர்க்கிறது.
- source_word: וְהִיא מִתְקַדֶּשֶׁת מִטֻּמְאָתָהּ
  choice: அப்போது அவள் தன் தீட்டிலிருந்து தன்னைத் தூய்மைப்படுத்திக்கொண்டிருந்தாள்
  rationale: Hitpael வடிவம் இங்கு ஒழுக்கரீதியான பரிசுத்தமாக்குதலை அல்ல, சடங்குரீதியான தூய்மைப்படுத்துதலைக் குறிக்கிறது. ‘தீட்டு’ என்பது טֻמְאָה என்பதன் சடங்குத் தூய்மை வகையை நவீன தமிழில் தெளிவாகக் காட்டுகிறது; தொடர்நிலை வடிவம் எபிரெயப் பங்கேற்பு வினையின் பின்னணிக் குறிப்புத் தன்மையைப் பாதுகாக்கிறது.
- source_word: וַתָּשָׁב
  choice: பின்னர் ... திரும்பினாள்
  rationale: கதையின் அடுத்தடுத்த நிகழ்வை இயல்பான தமிழில் காட்டுகிறது.
- source_word: אֶל בֵּיתָהּ
  choice: தன் வீட்டிற்கு
  rationale: בֵּית என்பதன் நேரடியான பொருளையும், எழுவாயைத் தெளிவுபடுத்தும் இயல்பான தமிழ் தற்சுட்டுப் பெயரையும் பயன்படுத்துகிறது.
theological_decisions:
- issue: சடங்குத் தூய்மைக் கூற்றின் காலமும் கதையில் அதன் பணியும்
  choice: ‘அப்போது அவள் தன் தீட்டிலிருந்து தன்னைத் தூய்மைப்படுத்திக்கொண்டிருந்தாள்’ என்று பின்னணிக் குறிப்பாக மொழிபெயர்த்தல்
  alternative: ‘அவள் தன் தீட்டிலிருந்து தன்னைத் தூய்மைப்படுத்திக்கொண்டிருந்தாள்’ என்பதற்குப் பதிலாக, முடிவுற்ற முன்நிகழ்வாக ‘அவள் தன் தீட்டிலிருந்து தூய்மையடைந்திருந்தாள்’ என்று மொழிபெயர்த்தல்
  rationale: எபிரெயப் பங்கேற்பு வினை இயல்பாக நடந்துகொண்டிருந்த அல்லது பின்னணியில் உள்ள நிலையைச் சுட்டலாம்; அதேவேளை சூழலில் முன்பே முடிந்த தூய்மைப்படுத்தலாகவும் புரிந்துகொள்ள வாய்ப்புள்ளது. முதன்மை உரை தொடர்நிலையைத் தக்கவைத்து, மாற்றுப் புரிதலை அடிக்குறிப்பில் பதிவு செய்கிறது. இது கருத்தரிப்பின் காலக்கணக்குக்கும் லேவிய சடங்குத் தூய்மை வகைகளுக்கும் தொடர்புடைய குறிப்பாக இருக்கலாம்; பத்சேபாளின் குற்றம் அல்லது குற்றமின்மை குறித்து உரை கூறாத முடிவை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உடலுறவுகொண்டான்’ பாலுறவைக் குழப்பமின்றி தெரிவிக்கிறது; ‘தீட்டு’ மற்றும் ‘தூய்மைப்படுத்திக்கொண்டிருந்தாள்’ என்பவை ஒழுக்கத் தீர்ப்பைச் சேர்க்காமல் சடங்குத் தூய்மைச் சூழலைக் காக்கின்றன.
