  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. ‘சென்றான், வந்தான்’ என்பதை இயந்திரமாகப் பிரதிபலிக்காமல் ‘புறப்பட்டுச் சென்று’ என இயல்பாக்கியுள்ளோம்; யோவாப் அனுப்பிய செய்தி என்ற மறைபொருளை ‘சொல்லியனுப்பிய’ என வெளிப்படுத்தியதால் தனிப் பதிப்புக் குறிப்பு தேவையில்லை.
