  text: So the messenger went and came and told David all that Joab had sent him to say[a].
translation:
  language: ta
  text: அப்படியே அந்தத் தூதுவன் புறப்பட்டு வந்து, யோவாப் அவனிடம் கூறி அனுப்பிய அனைத்தையும் தாவீதிடம் தெரிவித்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: அந்தத் தூதுவன்
  rationale: இங்கு மனித இராணுவச் செய்தியாளனைக் குறிக்கிறது; எனவே ‘தூதுவன்’ இயல்பான பொருள். எபிரெய மொழியின் குறிப்புச் சுட்டையும் ‘அந்த’ என வெளிப்படுத்துகிறது.
- source_word: וַיֵּלֶךְ וַיָּבֹא
  choice: புறப்பட்டுச் சென்று
  rationale: எபிரெய உரையில் ‘சென்றான், வந்தான்’ என்ற தொடர்ச்சி உள்ளது. இலக்கிடத்தை நோக்கிப் புறப்பட்டு அங்கு சென்றடைந்ததை நவீன தமிழில் இயல்பாகக் கூறும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וַיַּגֵּד לְדָוִד
  choice: தாவீதிடம் தெரிவித்தான்
  rationale: Hiphil வடிவிலுள்ள נגד என்பது ‘தெரிவி/அறிவி/சொல்’ எனப் பொருள்படும். அதிகாரப்பூர்வ செய்தியறிக்கையின் சூழலுக்கு ‘தெரிவித்தான்’ பொருந்துகிறது.
- source_word: אֵת כָּל אֲשֶׁר
  choice: அனைத்தையும்
  rationale: செய்தியின் முழு உள்ளடக்கத்தையும் குறிக்கும் כָּל என்பதன் விரிவைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: שְׁלָחוֹ יוֹאָב
  choice: யோவாப் தன்னிடம் சொல்லியனுப்பிய
  rationale: சொல்லுக்கு சொல் ‘யோவாப் அவனை அனுப்பிய’ என்றிருந்தாலும், சூழலில் யோவாப் தூதுவன் மூலம் அனுப்பிய செய்தியே குறிக்கப்படுகிறது. ‘சொல்லியனுப்பிய’ என்பது அந்தத் தொடர்பாடல் பொருளைத் தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: דָוִד / יוֹאָב
  choice: தாவீது / யோவாப்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவங்கள் பயன்படுத்தப்பட்டன; வேற்றுமை உருபுகளோடு ‘தாவீதிடம்’, எழுவாயாக ‘யோவாப்’ என அமைந்துள்ளன.
