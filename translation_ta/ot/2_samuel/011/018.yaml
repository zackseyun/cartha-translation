translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்கு எளிதில் புரியுமாறு அமைக்கப்பட்டது. ‘ஆளனுப்பி’ என்பது செய்தியை எடுத்துச் சென்ற தூதரை உரையில் அளவுக்கு மீறி வெளிப்படுத்தாமல், שׁלח + נגד ஆகிய வினைகளின் சூழல்சார் தொடர்பை இயல்பாகக் காட்டுகிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
