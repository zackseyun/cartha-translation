  yaml_path: translation/ot/2_samuel/011/018.yaml
  text: Then Joab sent word and told David all the news of the battle[a].
translation:
  language: ta
  text: பின்பு யோவாப் ஆளனுப்பி, போரின் செய்திகளையெல்லாம் தாவீதுக்கு அறிவித்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போரின் விவரங்களையெல்லாம்.” எபிரெய மொழியில் சொல்லுக்குச் சொல் “போரின் வார்த்தைகளையெல்லாம்”; இது போரின் நிகழ்வுகள் அல்லது அதைப் பற்றிய முழு அறிக்கையைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ஆளனுப்பி
  rationale: שׁלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்புதல்.’ அடுத்துவரும் ‘அறிவித்தான்’ என்பதோடு சேர்ந்து, யோவாப் ஒரு தூதரை அனுப்பிச் செய்தி தெரிவித்ததைத் தமிழில் இயல்பாக உணர்த்த ‘ஆளனுப்பி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יוֹאָב
  choice: யோவாப்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: וַיַּגֵּד
  choice: அறிவித்தான்
  rationale: Hiphil வடிவிலுள்ள נגד என்பது ‘தெரிவித்தல், அறிவித்தல், அறிக்கையிடுதல்’ என்று பொருள்படும். இங்கு போரின் தகவலைத் தாவீதுக்குத் தெரியப்படுத்துவதை ‘அறிவித்தான்’ இயல்பாகக் குறிக்கிறது.
- source_word: לְדָוִד
  choice: தாவீதுக்கு
  rationale: לְ முன்னிடைச்சொல் பெறுநரைக் குறிக்கிறது; ஆகவே தமிழில் நான்காம் வேற்றுமை உருபுடன் மொழிபெயர்க்கப்பட்டது.
- source_word: אֵת כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: போரின் செய்திகளையெல்லாம்
  rationale: דִּבְרֵי என்பதன் சொற்பொருள் ‘வார்த்தைகள்/விவகாரங்கள்.’ ஆனால் இந்த அறிக்கைச் சூழலில் அது போரைக் குறித்த தகவல்கள் அல்லது முழு விவரங்களைக் குறிக்கிறது. ‘செய்திகளையெல்லாம்’ என்பது இந்தப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַמִּלְחָמָה
  choice: போர்
  rationale: מִלְחָמָה என்பது ‘போர்’ அல்லது குறிப்பிட்ட ‘போரிடுதல்/போராட்டம்’ என்பதைக் குறிக்கலாம். உடனடிச் சூழலில் நடைபெறும் இராணுவ நடவடிக்கையைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் ‘போர்’ குறிக்கிறது.
