  to: அப்போது தாவீது உரியாவிடம், “இன்றும் இங்கே தங்கியிரு; நாளை உன்னை அனுப்பிவிடுவேன்” என்றான். ஆகவே உரியா அன்றும் மறுநாளும்[a] எருசலேமில் தங்கினான்.
