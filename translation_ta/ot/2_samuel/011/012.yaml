  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אוּרִיָּ֗ה שֵׁ֥ב בָּ/זֶ֛ה גַּם הַ/יּ֖וֹם וּ/מָחָ֣ר אֲשַׁלְּחֶ֑/ךָּ וַ/יֵּ֨שֶׁב אוּרִיָּ֧ה בִ/ירוּשָׁלִַ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא וּ/מִֽ/מָּחֳרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/012.yaml
  text: Then David said to Uriah[a], “Stay here today also, and tomorrow I will send you away.” So Uriah stayed in Jerusalem that day and the next day.
translation:
  language: ta
  text: அப்போது தாவீது உரியாவிடம், “இன்றும் இங்கே தங்கியிரு; நாளை உன்னை அனுப்பிவிடுவேன்” என்றான். ஆகவே உரியா அன்றும் மறுநாளும்[a] எருசலேமில் தங்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அன்றும் அதற்கு அடுத்த நாளும்.”
    reason: וּמִמָּחֳרָת என்பதன் ‘அடுத்த/தொடர்ந்த நாள்’ என்னும் காலக் குறிப்பை வெளிப்படையாகத் தரும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: தொடர்ச்சியான கதைநிகழ்வை இயல்பான நவீனத் தமிழில் முன்னெடுக்கிறது.
- source_word: שֵׁב בָּזֶה
  choice: இங்கே தங்கியிரு
  rationale: இந்தச் சூழலில் ישׁב என்பது உட்கார்வதைக் காட்டிலும் ஒரு இடத்தில் தற்காலிகமாகத் தங்கியிருப்பதைக் குறிக்கிறது.
- source_word: גַּם הַיּוֹם
  choice: இன்றும்
  rationale: גַּם தரும் ‘கூட/மேலும்’ என்ற பொருளைத் தமிழின் ‘-உம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשַׁלְּחֶךָּ
  choice: உன்னை அனுப்பிவிடுகிறேன்
  rationale: Uriahவை எருசலேமிலிருந்து புறப்பட அனுமதிப்பதாகிய சூழல்பொருளை இயல்பாகத் தெரிவிக்கிறது; தேவையற்ற கடுமையைச் சேர்க்கவில்லை.
- source_word: וַיֵּשֶׁב
  choice: ஆகவே ... தங்கியிருந்தான்
  rationale: தாவீதின் கட்டளையைத் தொடர்ந்து உரியா அங்கே இருந்ததைத் தெளிவாகவும், முந்தைய ישׁב உடன் பொருள் ஒற்றுமையுடனும் காட்டுகிறது.
- source_word: בַּיּוֹם הַהוּא וּמִמָּחֳרָת
  choice: அன்றும் அடுத்த நாளும்
  rationale: இரு தொடர்ச்சியான நாட்களைக் குறிக்கும் எபிரெய காலச்சொற்றொடரை இயல்பான தமிழில் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமை, கண்ணியம், கதைநடை ஆகியவை பேணப்பட்டுள்ளன. உரையாடல் இயல்பாகவும், பெயர்களும் இடப்பெயரும் பொதுவாக அறியப்பட்ட தமிழ் வேதாகம வடிவங்களிலும் தரப்பட்டுள்ளன.
