translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடியதாயும் கண்ணியமான கதைநடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வீழ்ந்தார்கள்’ என்ற போர்சார் மரபுத்தொடரும், உரியாவின் இன அடையாளமும், גם தரும் ‘உம்’ வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
