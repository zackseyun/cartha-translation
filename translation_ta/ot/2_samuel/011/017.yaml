  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֵּ֨צְא֜וּ אַנְשֵׁ֤י הָ/עִיר֙ וַ/יִּלָּחֲמ֣וּ אֶת יוֹאָ֔ב וַ/יִּפֹּ֥ל מִן הָ/עָ֖ם מֵ/עַבְדֵ֣י דָוִ֑ד וַ/יָּ֕מָת גַּ֖ם אוּרִיָּ֥ה הַ/חִתִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/017.yaml
  text: The men of the city came out and fought against Joab[a], and some of the people among David’s servants fell[b]; Uriah the Hittite also died.
translation:
  language: ta
  text: நகரத்தின் ஆண்கள் வெளியே வந்து யோவாபுக்கு எதிராகப் போரிட்டார்கள்[a]; தாவீதின் பணியாளர்களில் சிலர் வீழ்ந்தார்கள்[b]; ஏத்தியனாகிய உரியாவும் இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெளியே போய்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘மக்களிலிருந்து, தாவீதின் பணியாளர்களிலிருந்து.’ இது தாவீதின் பணியாளர்களில் சிலர் வீழ்ந்தார்கள் என்பதைக் குறிக்கும் பகுதியைக் குறிக்கும் சொல்லமைப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: வெளியே வந்து
  rationale: יצא என்பது ‘வெளியே போ/வா’ என்று பொருள்படலாம். நகரத்திலிருந்து யோவாபின் படையை எதிர்கொள்ள அவர்கள் வந்ததைத் தமிழில் இயல்பாகச் சொல்கிறது; மாற்றுச் சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: אַנְשֵׁי הָעִיר
  choice: நகரத்தின் ஆண்கள்
  rationale: ‘நகரத்தின் ஆண்கள்’ என்ற எபிரெயக் கட்டமைப்பைத் தெளிவாகப் பாதுகாக்கிறது; சூழலில் இவர்கள் ஆண் போராளிகள்.
- source_word: וַיִּלָּחֲמוּ אֶת יוֹאָב
  choice: யோவாபுக்கு எதிராகப் போரிட்டார்கள்
  rationale: இங்கு את உடனான போர் மரபுத்தொடர் பகைமை மோதலைக் குறிக்கிறது. ‘எதிராக’ என்பது தமிழில் அதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיִּפֹּל
  choice: வீழ்ந்தார்கள்
  rationale: போரில் உயிரிழந்தவர்களைக் குறிக்கும் எபிரெய இராணுவ மரபுத்தொடரைப் பாதுகாக்கிறது. ஒருமை வினை இங்கு கூட்டுப்பொருளில் வருவதால் தமிழில் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִן הָעָם מֵעַבְדֵי דָוִד
  choice: தாவீதின் பணியாளர்களில் சிலர்
  rationale: இரு מן தொடர்களின் பகுதியைக் குறிக்கும் பொருளை இயல்பான தமிழில் தருகிறது. עבדים என்பதன் அடிப்படைப் பொருளான ‘பணியாளர்கள்’ பாதுகாக்கப்படுகிறது; சூழல் அவர்கள் போர்ப்படையைச் சேர்ந்தவர்கள் என்பதை விளக்குகிறது.
- source_word: וַיָּמָת גַּם אוּרִיָּה הַחִתִּי
  choice: ஏத்தியனான உரியாவும் இறந்தான்
  rationale: גם என்பதன் சேர்க்கை வலியுறுத்தலை ‘-வும்’ பாதுகாக்கிறது; உரியா மற்ற உயிரிழந்தவர்களுடன் சேர்ந்து இறந்தான் என்பதையும் அவன் மரணத்தின் கதைமுக்கியத்துவத்தையும் வெளிப்படுத்துகிறது.
- source_word: הַחִתִּי
  choice: ஏத்தியனான
  rationale: உரியாவின் இன அடையாளத்தைக் குறிக்கும் பெயரை நிலைபெற்ற தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு தருகிறது.
