  naturalness: The revision is clear, dignified modern standard Tamil. “ஏத்தியனாகிய உரியா” is a more idiomatic appositional form than “ஏத்தியனான உரியா.”
  terminology: “பணியாளர்கள்” appropriately preserves the transparent sense of David’s עבדים in this military setting. “ஏத்தியன்” retains the conventional ethnic designation for Hittite, and “-வும்” properly represents the additive force of גם.
