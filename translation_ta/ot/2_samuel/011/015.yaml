base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/015.yaml
  text: He wrote in the letter[a], saying, "Set Uriah at the front of the hardest fighting, then withdraw from behind him so that he may be struck down and die."
translation:
  language: ta
  text: 'அவர் கடிதத்தில் இவ்வாறு எழுதினார்: “உரியாவை மிகக் கடுமையான போரின் முன்னணியில் நிறுத்துங்கள்[a]. பின்பு அவனுக்குப் பின்னாலிருந்து விலகிவிடுங்கள்; அவன் தாக்கப்பட்டு இறந்துபோகும்படி.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போர் மிகத் தீவிரமாக நடைபெறும் இடத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: அவர் எழுதினார்
  rationale: தொடர்ச்சியான இறந்தகாலக் கதைநடையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; எழுவாய் முந்தைய சூழலிலிருந்து பெறப்படுகிறது.
- source_word: בַּסֵּפֶר
  choice: கடிதத்தில்
  rationale: இச்சூழலில் סֵפֶר என்பது தாவீது உரியாவின் மூலம் அனுப்பிய எழுத்துச் செய்தியைக் குறிக்கிறது; ஆகவே ‘நூல்’ அல்லது ‘ஆவணம்’ என்பதைக் காட்டிலும் ‘கடிதம்’ பொருத்தமானது.
- source_word: לֵאמֹר
  choice: இவ்வாறு
  rationale: மேற்கோளை அறிமுகப்படுத்தும் எபிரெயச் சொல்லை இயல்பான தமிழ் மேற்கோள் அமைப்பில் வழங்குகிறது.
- source_word: הָבוּ
  choice: நிறுத்துங்கள்
  rationale: ஒருவரைப் போரில் குறிப்பிட்ட இடத்தில் அமர்த்தும் கட்டளையைத் தெளிவாகவும் மரியாதைப் பன்மைக் கட்டளை வடிவிலும் தெரிவிக்கிறது.
- source_word: אֶת אוּרִיָּה
  choice: உரியாவை
  rationale: אֶת தனியாக மொழிபெயர்க்கப்படவில்லை; தமிழின் இரண்டாம் வேற்றுமை உருபுடன் பெயர் வழங்கப்பட்டுள்ளது.
- source_word: אֶל מוּל פְּנֵי הַמִּלְחָמָה הַחֲזָקָה
  choice: கடும் போர் நடைபெறும் முன்னணியில்
  rationale: מוּל פְּנֵי குறிக்கும் நேரடி முன்னணி வெளிப்பாட்டையும் הַחֲזָקָה குறிக்கும் போரின் கடுமையையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: וְשַׁבְתֶּם מֵאַחֲרָיו
  choice: பின்பு அவனுக்குப் பின்னாலிருந்து விலகிவிடுங்கள்
  rationale: שׁוּב இங்கு பின்வாங்குதல் அல்லது விலகுதலைக் குறிக்கிறது; מֵאַחֲרָיו உள்ள தந்திரமான கைவிடுதலை ‘அவனுக்குப் பின்னாலிருந்து’ என்று வெளிப்படையாகப் பேணுகிறது.
- source_word: וְנִכָּה
  choice: அவன் தாக்கப்பட்டு
  rationale: נכה என்பதன் நிஃபால் வடிவிலுள்ள செயப்பாட்டு பொருளைப் பேணுகிறது; அடுத்துள்ள ‘இறந்துபோவான்’ என்ற தனி வினையை ஒன்றிணைத்துவிடவில்லை.
- source_word: וָמֵת
  choice: இறந்துபோவான்
  rationale: எபிரெய மூலத்தில் உள்ள தனித்த மரண வினையையும் கட்டளையின் திட்டமிட்ட கொலைநோக்கையும் தெளிவாக வைத்திருக்கிறது.
