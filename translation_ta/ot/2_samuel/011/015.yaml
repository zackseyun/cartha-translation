translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பான ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கட்டளைகள் பன்மை வடிவில் வைக்கப்பட்டுள்ளன; மூலத்தின் போர்த் தந்திரமும் உரியாவைக் கைவிடும் நோக்கமும் மென்மைப்படுத்தப்படவில்லை. அடிக்குறிப்பு குறி அது விளக்கும் போரின் இடம்/தீவிரம் குறித்த சொற்றொடருக்குப் பின்பே வைக்கப்பட்டுள்ளது.
