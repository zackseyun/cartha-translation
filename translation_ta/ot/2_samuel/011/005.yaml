translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. நிகழ்வைக் குறிக்கும் ‘கருவுற்றாள்’ என்பதும் தற்போதைய நிலையைக் குறிக்கும் ‘கர்ப்பமாக இருக்கிறேன்’ என்பதும் வேறுபடுத்தப்பட்டுள்ளன.
