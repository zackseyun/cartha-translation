  yaml_path: translation/ot/2_samuel/011/005.yaml
  text: The woman conceived[a], and she sent word and told David[b], “I am pregnant.”
translation:
  language: ta
  text: அந்தப் பெண் கருவுற்றாள்[a]. அவள் தாவீதுக்குச் செய்தி அனுப்பினாள்; “நான் கர்ப்பமாக இருக்கிறேன்” என்று தெரிவித்தாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாக, “அந்தப் பெண் கர்ப்பமடைந்தாள்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரேய மூலத்தில் “அனுப்பினாள்” என்று மட்டுமே உள்ளது; இங்கு தாவீதுக்குச் செய்தி அனுப்பினாள் என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: கருவுற்றாள்
  rationale: הרה என்ற வினை கருத்தரித்தல் அல்லது கர்ப்பமடைதலைக் குறிக்கிறது. ‘கருவுற்றாள்’ என்பது நிகழ்வுத்தன்மையைத் தக்கவைக்கும் இயல்பான, சுருக்கமான தமிழ் சொல்.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: אִשָּׁה என்பதற்கு சூழலுக்கேற்ப ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள் வரலாம். இவ்வாக்கியத்தில் பத்சேபாளை முன் குறிப்பிலிருந்து சுட்டுகிறது; திருமண உறவை இந்தச் சொற்றொடர் வெளிப்படையாக முன்னிறுத்தாததால் ‘அந்தப் பெண்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַתִּשְׁלַח
  choice: செய்தி அனுப்பி
  rationale: שׁלח என்பதன் நேரடிப் பொருள் ‘அனுப்பினாள்.’ தொடர்ந்து வரும் அறிவித்தல் வினையும் தாவீதைக் குறிக்கும் மறைமுகச் செயப்படுபொருளும், இங்கு செய்தி அனுப்புதலே கருத்து என்பதைத் தெளிவாக்குகின்றன.
- source_word: וַתַּגֵּד
  choice: தெரிவித்தாள்
  rationale: Hiphil வடிவிலுள்ள נגד சொல்லுதல், அறிவித்தல், அறிக்கையிடுதல் ஆகிய பொருள்களைக் கொண்டது. இச்சூழலில் ‘தெரிவித்தாள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְדָוִד
  choice: தாவீதுக்கு
  rationale: דָוִד என்ற தனிப்பெயரின் வழக்கமான தமிழ் வடிவம் ‘தாவீது’; வேற்றுமை உருபுடன் ‘தாவீதுக்கு’ என வருகிறது.
- source_word: הָרָה אָנֹכִי
  choice: நான் கர்ப்பமாக இருக்கிறேன்
  rationale: הָרָה என்ற பயனிலைச் சொல்லுடன் אָנֹכִי இணைந்து தற்போதைய நிலையை, ‘நான் கர்ப்பமாக இருக்கிறேன்,’ என்று வெளிப்படுத்துகிறது. இது நவீனத் தமிழில் இயல்பான நேரடி கூற்று.
