id: 2SA.11.16
reference: 2 Samuel 11:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֕י בִּ/שְׁמ֥וֹר יוֹאָ֖ב אֶל הָ/עִ֑יר וַ/יִּתֵּן֙ אֶת א֣וּרִיָּ֔ה אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר יָדַ֔ע כִּ֥י אַנְשֵׁי חַ֖יִל שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/016.yaml
  text: So when Joab was watching the city[a], he stationed Uriah in the place where he knew the mighty men were.
translation:
  language: ta
  text: யோவாப் நகரத்தைக் கண்காணித்துக்கொண்டிருந்தபோது, வலிமைமிக்க போர்வீரர்கள் இருப்பதாக அவர் அறிந்த இடத்தில் உரியாவை நிறுத்தினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁמֹר ... אֶל־הָעִיר
  choice: நகரத்தைக் கண்காணித்துக்கொண்டிருந்தபோது
  rationale: בְּ + infinitive construct காலத் துணைவாக்கியத்தைக் குறிக்கிறது. முற்றுகைச் சூழலில் שׁמר என்பது நகரின் நிலைமையையும் பாதுகாப்பையும் உற்றுக் கவனிப்பதைக் குறிக்கிறது; ‘கண்காணித்துக்கொண்டிருந்தபோது’ காலத் தொடர்ச்சியையும் இராணுவச் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּתֵּן אֶת־אוּרִיָּה
  choice: உரியாவை நிறுத்தினார்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘வைத்தல்’; இங்கு ஒரு குறிப்பிட்ட போர்நிலையில் வீரரை நியமித்து நிறுத்துவதைச் சுட்டுவதால் ‘நிறுத்தினார்’ என்பது இயல்பான இராணுவச் சொல்லாக்கம்.
- source_word: הַמָּקוֹם
  choice: இடத்தில்
  rationale: מקום என்பதன் நேரடியான பொருள் ‘இடம்’; இங்கு அது போர்தந்திர முக்கியத்துவமுள்ள நிலையைக் குறித்தாலும், மூலத்தின் பொதுவான சொல்லைத் தக்கவைக்க ‘இடம்’ பயன்படுத்தப்பட்டது.
- source_word: יָדַע
  choice: அவர் அறிந்திருந்த
  rationale: ידע என்பது ‘அறிதல்’. யோவாபுக்கு ஏற்கெனவே தெரிந்திருந்த நிலையைத் தமிழில் இயல்பாகக் காட்ட ‘அறிந்திருந்த’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אַנְשֵׁי חַיִל
  choice: வலிமைமிக்க போர்வீரர்கள்
  rationale: இந்தச் சொற்றொடர் திறமையும் வலிமையும் கொண்ட, எதிர்கொள்ளக் கடினமான போராளிகளைக் குறிக்கிறது. ‘போர்வீரர்கள்’ இராணுவச் சூழலைத் தெளிவாக்குகிறது; ‘வலிமைமிக்க’ என்பது חַיִל இன் வல்லமை சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: שָׁם
  choice: இருந்த இடத்தில்
  rationale: שָׁם என்பதன் இடப்பொருள் தமிழின் ‘இருந்த இடத்தில்’ என்ற தொடர்பமைப்புக்குள் இயல்பாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: וַיְהִי
  choice: …போது
  rationale: וַיְהִי இங்கு அடுத்த நிகழ்வை அறிமுகப்படுத்தி, בִּשְׁמֹר உடன் காலத் தொடர்பை அமைக்கிறது. தமிழில் தனியாக ‘அப்போது நிகழ்ந்தது’ என்று மொழிபெயர்ப்பதைவிட ‘…போது’ என்ற அமைப்பு இயல்பானது.
