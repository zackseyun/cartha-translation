  to: யோவாப் நகரத்தைக் கண்காணித்துக்கொண்டிருந்தபோது, வலிமைமிக்க போர்வீரர்கள் இருப்பதாக அவர் அறிந்த இடத்தில் உரியாவை நிறுத்தினார்.
