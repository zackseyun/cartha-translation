  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் காலத் தொடர்பும் யோவாபின் திட்டமிட்ட இராணுவ நடவடிக்கையும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
