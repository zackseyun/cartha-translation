translation:
  language: ta
  text: அப்போது தாவீது யோவாபுக்கு, “ஏத்தியனான உரியாவை என்னிடம் அனுப்பு” என்று செய்தி அனுப்பினான். யோவாபும் உரியாவைத் தாவீதிடம் அனுப்பினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד אֶל יוֹאָב
  choice: தாவீது யோவாபிடம் ஆள் அனுப்பி ... சொல்லச் செய்தான்
  rationale: שׁלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்பு.’ இங்கு அனுப்பப்பட்ட நபர் அல்லது செய்தி வெளிப்படையாகக் குறிப்பிடப்படாமல், உடனே கட்டளை மேற்கோளாக வருவதால், தமிழில் இயல்பாகவும் மூலத்தின் உட்பொருளை மிகைப்படுத்தாமலும் ‘ஆள் அனுப்பி ... சொல்லச் செய்தான்’ என வழங்கப்பட்டது.
- source_word: שְׁלַח אֵלַי
  choice: என்னிடம் அனுப்பு
  rationale: கட்டளை வடிவத்தின் நேரடித்தன்மையையும் אֵלַי என்பதன் ‘என்னிடம்’ என்ற திசைப் பொருளையும் காக்கிறது; ‘திரும்ப அனுப்பு’ என்ற மூலத்தில் இல்லாத கருத்து சேர்க்கப்படவில்லை.
- source_word: אֶת אוּרִיָּה הַחִתִּי
  choice: இத்தியனான உரியாவை
  rationale: אֶת என்பது நேரடி செயப்படுபொருள் குறியீடு என்பதால் தனியே மொழிபெயர்க்கப்படவில்லை. הַחִתִּי என்பது உரியாவின் இன அடையாளமாக இயல்பான தமிழில் பெயரெச்ச வடிவில் தரப்பட்டது.
- source_word: וַיִּשְׁלַח יוֹאָב אֶת אוּרִיָּה אֶל דָּוִד
  choice: யோவாபும் உரியாவைத் தாவீதிடம் அனுப்பினான்
  rationale: மூலத்தில் மீண்டும் வரும் שׁלח வினையை ‘அனுப்பினான்’ என்று தொடர்ந்து வழங்கி, தொடர் நிகழ்வைக் காட்டும் וַ־ என்பதற்கு இயல்பான தமிழ் இணைப்பாக ‘-உம்’ பயன்படுத்தப்பட்டது.
