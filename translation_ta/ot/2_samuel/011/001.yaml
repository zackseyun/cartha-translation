base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/001.yaml
  text: At the turn of the year[a], at the time when kings go out to battle, David sent Joab, his servants with him, and all Israel. They devastated the Ammonites and besieged Rabbah[b], but David remained in Jerusalem.
translation:
  language: ta
  text: ஆண்டு திரும்பும் காலத்தில்[a], அரசர்கள் போருக்குப் புறப்படும் வேளையில்[b], தாவீது யோவாபையும், அவனுடன் தன் பணியாளர்களையும், இஸ்ரவேல் முழுவதையும் அனுப்பினான். அவர்கள் அம்மோனியரைப் பேரழிவுக்குள்ளாக்கினார்கள்; ரப்பாவை முற்றுகையிட்டார்கள். ஆனால் தாவீது எருசலேமிலேயே தங்கியிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஆண்டு திரும்பும் காலத்தில்.” இது பெரும்பாலும் வசந்தகாலப் படையெடுப்புப் பருவத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: எபிரெய எழுத்துவடிவத்தை “தூதர்கள் புறப்படும் வேளையில்” என்றும் வாசிக்கலாம். ஆனால் இங்குள்ள போர்ச் சூழல் “அரசர்கள் போருக்குப் புறப்படும் வேளையில்” என்ற வாசிப்பை வலுவாக ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: ஆண்டு மாறும் காலத்தில்
  rationale: எபிரெயச் சொற்றொடர் ஆண்டின் ‘திரும்புதல்/மாறுதல்’ என்பதைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் காலக் குறிப்பைப் பாதுகாக்கிறது; அதை நேரடியாக ‘வசந்த காலம்’ என்று விளக்கி விடவில்லை.
- source_word: לְעֵת צֵאת הַמַּלְאכִים
  choice: அரசர்கள் போருக்குப் புறப்படும் வேளையில்
  rationale: எழுதப்பட்ட வடிவம் ‘தூதர்கள்’ என்று பொருள்படக்கூடியதாக இருந்தாலும், படையெடுப்புச் சூழலும் பண்டைய பருவகாலப் போர் வழக்கமும் ‘அரசர்கள்’ என்ற சூழல்சார் வாசிப்பை வலுவாக ஆதரிக்கின்றன. ‘போருக்கு’ என்பது கதையில் உட்குறிப்பாக உள்ள இராணுவப் பொருளைத் தெளிவாக்குகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினான்
  rationale: கதைநடையில் שׁלח என்பதற்கான இயல்பான, துல்லியமான தமிழாக்கம்.
- source_word: עֲבָדָיו
  choice: தன் பணியாளர்களையும்
  rationale: அரசரின் சேவையில் இருந்தவர்களைக் குறிக்கும் விரிவான சொல்லாக இருப்பதால், ‘அதிகாரிகள்’ அல்லது ‘படைவீரர்கள்’ என்று தேவையின்றிக் குறுக்கப்படவில்லை.
- source_word: כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதையும்
  rationale: எபிரெய மூலத்தின் கூட்டுப்பெயரைக் காக்கிறது; சூழலில் இது இஸ்ரவேலின் போர்ப்படையைக் குறிக்கலாம் என்றாலும், அதை உரைக்குள் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: וַיַּשְׁחִתוּ
  choice: பேரழிவுக்குள்ளாக்கி
  rationale: Hiphil வடிவத்தின் கடுமையான அழிவுச் செயலை வெளிப்படுத்துகிறது; தொடர்ந்து முற்றுகை நடைபெறுவதால் முழுமையான நிர்மூலத்தை அவசியமாக உணர்த்தாது.
- source_word: בְּנֵי עַמּוֹן
  choice: அம்மோனியரை
  rationale: ‘அம்மோனின் மகன்கள்’ என்ற சொற்படியான வடிவத்திற்குப் பதிலாக இனப்பெயருக்கான இயல்பான தமிழாக்கம்.
- source_word: וַיָּצֻרוּ עַל רַבָּה
  choice: ரப்பாவை முற்றுகையிட்டார்கள்
  rationale: צוּר עַל என்ற இராணுவச் சொற்றொடரின் நேர்த்தியான தமிழாக்கம்.
- source_word: יוֹשֵׁב
  choice: தங்கியிருந்தான்
  rationale: சொற்படியாக ‘அமர்ந்திருந்தான்/வசித்தான்’ என்றாலும், படையோடு செல்லாமல் எருசலேமில் தொடர்ந்து இருந்ததை இக்கதைச் சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமிலேயே
  rationale: இடப்பெயரின் வழக்கமான தமிழாக்கம்; ‘-ஏ’ என்னும் வலியுறுத்தல் தாவீது செல்லாமல் அங்கே இருந்தான் என்ற கதையியல் முரண்பாட்டை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: לְעֵת צֵאת הַמַּלְאכִים என்ற படையெடுப்புப் பருவச் சொற்றொடரின் வாசிப்பு
  choice: அரசர்கள் போருக்குப் புறப்படும் வேளையில்
  alternative: தூதர்கள் புறப்படும் வேளையில்
  rationale: இது பிரதான கோட்பாட்டு விவகாரம் அல்ல; எனினும் கதையின் பொருளுக்கு முக்கியமான உரைநிலைத் தீர்மானம். இராணுவச் சூழலும் யோவாப் இஸ்ரவேலின் படையை வழிநடத்திச் செல்வதும் ‘அரசர்கள்’ என்ற வாசிப்பை ஆதரிக்கின்றன. தாவீது மட்டும் செல்லாமல் இருந்தான் என்ற கதையியல் முரண்பாடும் இவ்வாசிப்பில் தெளிவாகிறது. மூலத்தின் மாற்றுச் சாத்தியம் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆண்டு மாறும் காலம்,’ ‘பணியாளர்கள்,’ ‘பேரழிவுக்குள்ளாக்கி,’ ‘தங்கியிருந்தான்’ ஆகியவை மூலத்தின் வடிவத்தையும் தமிழின் இயல்பையும் சமநிலைப்படுத்துகின்றன. இரண்டு அடிக்குறி குறியீடுகளும் தொடர்புடைய சொற்றொடர்களின் உடனேயே உரையில் இடப்பட்டுள்ளன.
