reference: 2 Samuel 11:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/תִּשְׁמַע֙ אֵ֣שֶׁת אֽוּרִיָּ֔ה כִּי מֵ֖ת אוּרִיָּ֣ה אִישָׁ֑/הּ וַ/תִּסְפֹּ֖ד עַל בַּעְלָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/026.yaml
  text: When Uriah’s wife heard that Uriah her husband was dead[a], she mourned for her husband.
translation:
  language: ta
  text: உரியாவின் மனைவி, தன் கணவன் உரியா இறந்துவிட்டான்[a] என்று கேள்விப்பட்டபோது, தன் கணவனுக்காகப் புலம்பினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறந்திருந்தான்.”
    reason: מֵת என்பதை நிகழ்ந்த மரணமாகவோ, அதன் விளைவான இறந்த நிலையைக் குறிப்பதாகவோ தமிழில் வெளிப்படுத்த முடியும்.
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: கேள்விப்பட்டபோது
  rationale: שׁמע என்பதன் அடிப்படைப் பொருள் ‘கேள்’. இங்கு செய்தியை அறிந்ததைக் குறிக்கும் கதைச் சூழலில், ‘கேள்விப்பட்டபோது’ என்பது இயல்பான நவீனத் தமிழாகவும் மூலத்தின் காலத் தொடர்பைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: אֵשֶׁת אוּרִיָּה
  choice: உரியாவின் மனைவி
  rationale: எபிரெயக் கட்டிணைப்புத் தொடரை இயல்பான தமிழில் உடைமைத் தொடர்பாக மொழிபெயர்க்கிறது; பெண்ணை அவளுடைய தனிப்பெயரால் அல்லாமல் உரியாவுடனான உறவால் மூலவசனம் குறிப்பிடுவதையும் காக்கிறது.
- source_word: כִּי
  choice: என்று
  rationale: இங்கு כִּי, அவள் கேட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் மேற்கோள் உள்ளடக்கத்தை இணைக்கும் ‘என்று’ இதற்குப் பொருத்தமானது.
- source_word: מֵת
  choice: இறந்துவிட்டான்
  rationale: מֵת உரியா இறந்த நிலையில் இருந்ததைத் தெரிவிக்கிறது. செய்தியைக் கேள்விப்படும் சூழலில் ‘இறந்துவிட்டான்’ இயல்பான தமிழ்; நிலை சார்ந்த மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אוּרִיָּה אִישָׁהּ
  choice: தன் கணவன் உரியா
  rationale: மூலத்தில் உரியா அவளுடைய கணவன் என்று வெளிப்படையாக அடையாளப்படுத்தப்படுவதைப் பாதுகாக்கிறது. ‘தன்’ என்பது வாக்கியத்தின் எழுவாயான உரியாவின் மனைவியையே தெளிவாகச் சுட்டுகிறது.
- source_word: וַתִּסְפֹּד
  choice: புலம்பினாள்
  rationale: ספד என்பது இறந்தவருக்காகத் துக்கச் சடங்கோடு புலம்புவதைக் குறிக்கிறது. ‘புலம்பினாள்’ அதன் வெளிப்படையான துயர்வெளிப்பாட்டை ‘துக்கப்பட்டாள்’ என்பதைக் காட்டிலும் துல்லியமாகக் காட்டுகிறது.
- source_word: עַל בַּעְלָהּ
  choice: தன் கணவனுக்காக
  rationale: துக்கம் அல்லது புலம்பலைக் குறிக்கும் வினையுடன் עַל ‘ஒருவருக்காக/ஒருவரைக் குறித்து’ எனப் பொருள்படும். திருமணச் சூழலில் בַּעַל என்பதற்கு ‘கணவன்’ என்பதே பொருத்தம்; தேவையற்ற ‘எஜமான்’ அல்லது ‘உரிமையாளர்’ நுணுக்கம் சேர்க்கப்படவில்லை.
