base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/035.yaml
  text: Then all the people came to urge David to eat bread while it was still day[a], but David swore, saying, “May God do so to me, and more also[b], if before the sun goes down I taste bread or anything at all.”
translation:
  language: ta
  text: பகல் இன்னும் முடியாதிருக்கையில், மக்கள் எல்லாரும் தாவீதை அப்பம்[a] உண்ணும்படி வற்புறுத்த அவரிடம் வந்தார்கள். ஆனால் தாவீது சத்தியம் செய்து, “சூரியன் மறைவதற்கு முன் நான் அப்பத்தையோ வேறு எதையுமோ சுவைத்தால், கடவுள் எனக்கு இப்படியும் அதற்கும் மேலாகவும் செய்யட்டும்”[b] என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மூல எபிரேயத்தில் ‘அப்பம்’ என்று உள்ளது. இங்கு அது பொதுவாக உணவையும் குறிக்கக்கூடும்; மொழிபெயர்ப்பில் குறிப்பான சொல் தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இது தன்னையே சபிக்கும் வழக்கமான எபிரேய ஆணைச் சூத்திரம். தண்டனை என்ன என்பது மூலத்தில் குறிப்பிடப்படவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: לְהַבְרוֹת
  choice: அப்பம் சாப்பிடச் செய்ய
  rationale: இந்தச் சூழலில் Hiphil வடிவம் துக்கத்தில் இருக்கும் தாவீதை உணவு உட்கொள்ளச் செய்ய மக்கள் முயல்வதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் மூலத்தின் causative நுட்பத்துடனும் மொழிபெயர்க்கப்பட்டது.
- source_word: לֶחֶם
  choice: அப்பம்
  rationale: இந்தச் சொல் பொதுவாக ‘உணவு’ என்றும் அமையலாம்; ஆயினும் மூலத்தின் குறிப்பான சொல்லையும் நோன்பு/துக்கச் சூழலையும் காக்க ‘அப்பம்’ தக்கவைக்கப்பட்டது.
- source_word: בְּעוֹד הַיּוֹם
  choice: பகல் இன்னும் முடிவடையாதிருந்தபோது
  rationale: பகல் இன்னும் நீடித்துக்கொண்டிருந்ததைத் தெளிவாகக் காட்டுகிறது; பின்னர் வரும் சூரிய மறைவு குறிப்புக்கும் இயல்பான முன்னோட்டமாக அமைகிறது.
- source_word: וַיִּשָּׁבַע
  choice: ஆணையிட்டுச் சொன்னார்
  rationale: சொல்லைத் தொடர்ந்து நேரடி உரை வருவதால், தமிழில் உறுதிமொழியின் தீவிரத்தையும் வாக்கிய ஓட்டத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יֹסִיף
  choice: கடவுள் எனக்கு இப்படியும் இதற்கு மேலும் செய்யட்டும்
  rationale: குறிப்பிட்ட தண்டனையைச் சொல்லாமல் விடும் எபிரெய வழக்கமான தன்னையே சபிக்கும் ஆணைச் சூத்திரத்தை அதன் திறந்த தன்மையோடு காக்கிறது.
- source_word: כִּי אִם
  choice: சுவைத்தால்
  rationale: ஆணைச் சூத்திரத்தில் வரும் நிபந்தனை தமிழில் இயல்பான ‘-ஆல்’ விகுதியால் வெளிப்படுத்தப்பட்டது.
- source_word: לִפְנֵי בּוֹא הַשֶּׁמֶשׁ
  choice: சூரியன் மறைவதற்கு முன்
  rationale: சொல்லளவில் ‘சூரியன் வருவதற்கு முன்’ என்றிருந்தாலும், இங்கு குறிப்பது சூரிய மறைவு; தமிழ் வழக்கில் தெளிவாக மொழிபெயர்க்கப்பட்டது.
- source_word: אֶטְעַם
  choice: சுவைத்தால்
  rationale: ‘சுவைத்தல்’ என்ற அடிப்படைப் பொருள் காக்கப்படுகிறது; மிகச் சிறிதளவுகூட உட்கொள்ள மாட்டேன் என்ற ஆணையின் வலிமையை இது உணர்த்துகிறது.
- source_word: אוֹ כָל מְאוּמָה
  choice: வேறு எதையுமோ
  rationale: அப்பத்தைத் தாண்டி எந்தப் பொருளையும் உட்கொள்ளாத முழுமையான மறுப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ஆணைச் சூத்திரத்தில் தண்டனை குறிப்பிடப்படாமல் இருப்பது
  choice: ‘கடவுள் எனக்கு இப்படியும் இதற்கு மேலும் செய்யட்டும்’ என்று திறந்த வடிவில் வைத்தல்
  alternative: ‘கடவுள் என்னைக் கடுமையாகத் தண்டிக்கட்டும்’ என்று பொருளை வெளிப்படையாக்குதல்
  rationale: எபிரெய உரை தண்டனையின் தன்மையைச் சொல்லவில்லை. அதைக் குறிப்பிட்ட தண்டனையாக விளக்காமல், உரையின் உண்மையான தெளிவின்மையையும் தீவிரத்தையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் வேதாகம உரைக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘அப்பம்’, ‘சுவைத்தால்’ ஆகிய குறிப்பான உருவகச் சொற்கள் பாதுகாக்கப்பட்டுள்ளன; ஆணைச் சூத்திரம் விளக்கிப் பொருள்கூறாமல் நேரடியாகத் தக்கவைக்கப்பட்டுள்ளது.
