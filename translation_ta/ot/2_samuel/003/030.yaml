  yaml_path: translation/ot/2_samuel/003/030.yaml
  text: So Joab and Abishai his brother killed Abner because he had killed Asahel their brother at Gibeon in the battle[a].
translation:
  language: ta
  text: ஆகவே, யோவாபும் அவனுடைய சகோதரனான அபிசாயும் அப்னேரைக் கொன்றார்கள்; ஏனெனில் அப்னேர் கிபியோனில் நடந்த போரில் அவர்களுடைய சகோதரன் ஆசகேலைக் கொன்றிருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோவாபும் அவனுடைய சகோதரனான அபிசாயும் அப்னேரைக் கொன்றார்கள்.” எபிரெய இணைப்புச் சொல்லை எளிமையாக “மேலும்” அல்லது “அப்பொழுது” என மொழிபெயர்க்கலாம்; “ஆகவே” என்பது சுற்றியுள்ள நிகழ்வுகளுடன் இதற்குள்ள விளக்கத் தொடர்பை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ לְאַבְנֵר
  choice: அப்னேரைக் கொன்றார்கள்
  rationale: הרג என்பதன் அடிப்படைப் பொருளான கொல்லுதலை நேரடியாகத் தருகிறது. ‘கொலை செய்தார்கள்’ என்பது சட்ட அல்லது அற மதிப்பீட்டை அதிகமாகச் சேர்க்கக்கூடும்; ל இங்கு செயப்படுபொருளைக் குறிக்கிறது.
- source_word: עַל אֲשֶׁר
  choice: ஏனெனில்
  rationale: முந்தைய செயலுக்கான காரணத்தை இயல்பான நவீன தமிழில் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: הֵמִית
  choice: கொன்றிருந்தான்
  rationale: מות என்பதன் ஹிஃபில் வடிவம் உயிரிழக்கச் செய்ததைக் குறிக்கிறது; அப்னேரின் செயல் யோவாபும் அபிசாயும் செய்த செயலுக்கு முன் நடந்தது என்பதை இறந்தகால முற்றுவினை உணர்த்துகிறது.
- source_word: אָחִיו / אֲחִיהֶם
  choice: அவனுடைய சகோதரன் / அவர்களுடைய சகோதரன்
  rationale: முதல் சொல் அபிசாய் யோவாபின் சகோதரன் என்பதையும், இரண்டாவது சொல் ஆசகேல் இருவருக்கும் சகோதரன் என்பதையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בְּגִבְעוֹן
  choice: கிபியோனில்
  rationale: நிகழ்வு நடந்த இடத்தைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: בַּמִּלְחָמָה
  choice: நடந்த போரில்
  rationale: எபிரெயச் சுட்டுக் கட்டுரை முன் விவரிக்கப்பட்ட குறிப்பிட்ட போரைக் குறிக்கிறது; ‘நடந்த’ என்பது தமிழில் அந்தச் சூழல் தொடர்பை இயல்பாக்குகிறது.
- source_word: וְ / וַ
  choice: ஆகவே
  rationale: இணைப்புச் சொல் சுற்றியுள்ள உரையுடன் கொண்டுள்ள விளக்கமான அல்லது முடிவுரையான தொடர்பை வெளிப்படுத்துகிறது; அதன் எளிய ‘மேலும்/அப்பொழுது’ வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
