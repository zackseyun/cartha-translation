base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/010.yaml
  text: to transfer the kingdom from the house of Saul and to establish the throne of David over Israel and over Judah[a], from Dan to Beer-sheba.
translation:
  language: ta
  text: சவுலின் வீட்டாரிடமிருந்து அரசாட்சியை மாற்றி, தாவீதின் அரியணையை இஸ்ரவேலின்மீதும் யூதாவின்மீதும், தாண் முதல் பெயர்செபா வரை[a], நிலைநிறுத்துவதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாண் முதல் பெயர்செபா வரை” என்பது வடக்கிலிருந்து தெற்குவரை, நாடு முழுவதையும் குறிக்கும் புவியியல் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: לְהַעֲבִיר
  choice: மாற்றி
  rationale: இங்கு הפעיל வடிவம் அரசாட்சியை ஓர் ஆளும் வீட்டாரிடமிருந்து மற்றொருவரிடம் கைமாற்றுவதைக் குறிக்கிறது; ‘மாற்றி’ என்பது அந்த அரசியல் பொருளை இயல்பாகத் தருகிறது.
- source_word: הַמַּמְלָכָה
  choice: அரசாட்சியை
  rationale: இச்சூழலில் இந்தச் சொல் நிலப்பரப்பை மட்டும் அல்லாமல் அரசுரிமையையும் ஆளுகையையும் குறிக்கிறது; ‘அரசாட்சி’ அந்த விரிந்த பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִבֵּית שָׁאוּל
  choice: சவுலின் வீட்டாரிடமிருந்து
  rationale: ‘வீடு’ என்ற எபிரெய மரபுத்தொடரின் வம்ச மற்றும் ஆளும் குடும்பப் பொருளை ‘வீட்டார்’ இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: וּלְהָקִים
  choice: நிலைநிறுத்துவதற்காக
  rationale: அரியணையையும் அரசுரிமையையும் உறுதியாக நிறுவுதல் என்ற அரசியல் பொருளை இந்தச் சொல் தருகிறது.
- source_word: אֶת כִּסֵּא דָוִד
  choice: தாவீதின் அரியணையை
  rationale: மூலத்தின் நேரடியான அரச உருவகத்தைப் பாதுகாத்து, அரச அதிகாரத்தையும் குறிக்கிறது.
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה
  choice: இஸ்ரவேலின்மீதும் யூதாவின்மீதும்
  rationale: மீண்டும் வரும் עַל என்பதையும் இஸ்ரவேல், யூதா ஆகிய இரு அரசியல் பகுதிகளுக்குமான ஆட்சியையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: தாண் முதல் பெயெர்-செபா வரை
  rationale: வடக்கிலிருந்து தெற்குவரையான நாட்டின் முழுப் பரப்பைக் குறிக்கும் புவியியல் மரபுத்தொடரை நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: ‘சவுலின் வீடு’ என்ற வம்ச மொழியும் ‘தாவீதின் அரியணை’ என்ற அரச உருவகமும்
  choice: ‘சவுலின் வீட்டார்’ மற்றும் ‘தாவீதின் அரியணை’ என்ற தெளிவான வம்ச-அரச சொற்களைப் பாதுகாத்தல்
  alternative: ‘சவுலின் வம்சத்திடமிருந்து தாவீதின் ஆட்சியை நிறுவுதல்’ என்று அருவமாக மொழிபெயர்த்தல்
  rationale: வசனம் அரசுரிமையின் கைமாற்றத்தைப் பற்றியது; எனினும் எபிரெயம் அதை ‘வீடு’, ‘அரியணை’ என்ற உருவகங்களால் கூறுகிறது. அவற்றைப் பாதுகாப்பது பிந்தைய இறையியல் முடிவுகளைச் சேர்க்காமல் மூலத்தின் வம்ச மற்றும் அரசச் செறிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இது முந்தைய வசனத்தின் சத்தியவாக்கியத்தைத் தொடரும் நோக்கவினைத் துணுக்காக இருப்பதால், தனி முழு வாக்கியமாக மாற்றப்படவில்லை.
