base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/021.yaml
  text: Abner said to David[a], “I will arise and go, and I will gather all Israel to my lord the king, so that they may make a covenant with you, and you shall reign over all that your soul desires.” Then David sent Abner away[c][b], and he went in peace.
translation:
  language: ta
  text: அப்னேர் தாவீதிடம், “நான் எழுந்து புறப்பட்டுச் சென்று, இஸ்ரவேலர் அனைவரையும் என் ஆண்டவராகிய அரசரிடம் ஒன்றுகூட்டுவேன். அவர்கள் உம்மோடு ஓர் உடன்படிக்கை செய்துகொள்வார்கள்[a]; உமது உள்ளம் விரும்புகிற அனைத்தின்மீதும் நீர் அரசாளுவீர்[b]” என்றான். பின்பு தாவீது அப்னேரை அனுப்பிவிட்டான்; அவன் சமாதானத்தோடு புறப்பட்டுச் சென்றான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “உம்மோடு ஓர் உடன்படிக்கையை வெட்டுவார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொற்சொல்லாக, “உமது ஆத்துமா விரும்புகிற அனைத்தின்மீதும்.”
    reason: lexical_alternative
  - marker: c
    text: “சமாதானத்தோடு புறப்பட்டுச் சென்றான்” என்பது அவன் பாதுகாப்பாகவும் பகைமையற்ற முறையிலும் அனுப்பப்பட்டதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: אָקוּמָה וְאֵלֵכָה
  choice: நான் புறப்பட்டுப் போய்
  rationale: இணைந்துள்ள இரு cohortative வடிவங்களும் அப்னேரின் உறுதியான நோக்கத்தை வெளிப்படுத்துகின்றன. சொற்சொல்லான ‘எழுந்து போய்’ என்பதைக் காட்டிலும் ‘புறப்பட்டுப் போய்’ என்பது இச்சூழலில் இயல்பான நவீனத் தமிழ்.
- source_word: וְאֶקְבְּצָה ... אֶת כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரையும் ... ஒன்றுகூட்டுவேன்
  rationale: קבץ என்பது அரசியல் நோக்கில் மக்களை ஒன்றுசேர்ப்பதைக் குறிக்கிறது; ‘இஸ்ரவேலர் அனைவரும்’ என்பது இங்கு கூட்டு மக்களினத்தைக் குறிக்கும்.
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: என் தலைவராகிய அரசரிடம்
  rationale: திசையைக் குறிக்கும் אֶל என்பதையும் தாவீதுக்குரிய மரியாதைமிக்க அரசவை அழைப்பையும் காக்கிறது; ‘ஆண்டவர்’ ஏற்படுத்தக்கூடிய தேவனைக் குறிக்கும் குழப்பத்தைத் தவிர்க்க ‘தலைவர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְיִכְרְתוּ אִתְּךָ בְּרִית
  choice: அவர்கள் உம்மோடு ஓர் உடன்படிக்கை செய்துகொள்ளட்டும்
  rationale: כרת ברית என்ற எபிரெய மரபுத்தொடரின் பொருள் உடன்படிக்கையை ஏற்படுத்துவதாகும். வினைவடிவத்தில் உள்ள நோக்கம் அல்லது விருப்பத்தின் நுணுக்கத்தை ‘செய்துகொள்ளட்டும்’ காக்கிறது.
- source_word: וּמָלַכְתָּ
  choice: நீர் அரசாளுவீர்
  rationale: இந்த வினை அரசனாக ஆட்சிசெய்வதைக் குறிக்கிறது; மரியாதை ஒருமையைப் பயன்படுத்தி தாவீதுக்கான நேரடி உரையை இயல்பாகக் காக்கிறது.
- source_word: בְּכֹל אֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: உமது உள்ளம் விரும்புகிற அனைத்தின்மீதும்
  rationale: נפשׁ இங்கு ஆசையின் இருப்பிடமான அகநிலையைக் குறிக்கிறது. தமிழில் ‘உள்ளம்’ இயல்பாக இதை வெளிப்படுத்துகிறது; எபிரெயச் சொல்லின் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיְשַׁלַּח דָּוִד אֶת אַבְנֵר
  choice: தாவீது அப்னேரை அனுப்பிவிட்டான்
  rationale: சூழலில் שׁלח என்பது ஒருவரை வழியனுப்புவதையோ செல்ல அனுமதிப்பதையோ குறிக்கிறது; ‘அனுப்பிவிட்டான்’ புறப்படும் பொருளைத் தெளிவாக்குகிறது.
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: அவன் சமாதானமாகப் புறப்பட்டுச் சென்றான்
  rationale: பாதுகாப்பாகவும் பகைமையின்றியும் அனுப்பப்பட்டதைச் சுட்டும் எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: உடன்படிக்கை மொழியின் மொழிபெயர்ப்பு
  choice: உடன்படிக்கை செய்துகொள்ளட்டும்
  alternative: உடன்படிக்கையை வெட்டட்டும்
  rationale: இது அரசியல் உடன்படிக்கையை ஏற்படுத்துவதைச் சுட்டும் நிலையான எபிரெய மரபுத்தொடர். தமிழில் பொருள் தெளிவாக வழங்கப்பட்டு, சடங்குப் பின்னணியுடைய சொற்சொல்லான வடிவம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: נפשׁ என்பதன் ஆசை சார்ந்த பயன்பாடு
  choice: உமது உள்ளம் விரும்புகிற
  alternative: உமது ஆத்துமா விரும்புகிற
  rationale: இங்கு נפשׁ தனி மனிதனின் அக விருப்பத்தைக் குறிக்கிறது; ‘உள்ளம்’ இயல்பான தமிழ். ‘ஆத்துமா’ என்ற தேர்வு தேவையற்ற தத்துவ அல்லது சமயப் பொருளை ஏற்றக்கூடும்; மூலத்தின் சொற்சொல்லான வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: בְּשָׁלוֹם என்ற பிரிவுச் சொற்றொடர்
  choice: சமாதானமாகப் புறப்பட்டுச் சென்றான்
  alternative: சமாதானத்தோடு சென்றான்
  rationale: இது அக அமைதியை மட்டும் அல்லாமல் பாதுகாப்பான, பகைமையற்ற பிரிவையும் குறிக்கலாம். முதன்மை உரை மரபுத்தொடரின் உருவகத்தை ஓரளவு காக்கிறது; பரந்த பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. தாவீதிடம் பேசும் இடங்களில் ‘உம்மோடு, உமது, நீர்’ என்ற மரியாதை ஒருமை காக்கப்பட்டுள்ளது. அரசவை மரியாதையைத் தெரிவிக்க ‘என் தலைவராகிய அரசர்’ பயன்படுத்தப்பட்டது; தேவனுக்குரிய பட்டமாகத் தவறாகப் புரிந்துகொள்ளக்கூடிய சொல்லாக்கம் தவிர்க்கப்பட்டது.
