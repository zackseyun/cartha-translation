base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/015.yaml
  text: So Ish-bosheth sent and took her from her husband[b][a], from Paltiel the son of Laish.
translation:
  language: ta
  text: இஸ்போசேத் அனுப்பி, அவளை அவளுடைய கணவனிடமிருந்து[a]—லாயீஷின் மகன் பல்தியேலிடமிருந்து[b]—எடுத்துக்கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஒரு மனிதனிடமிருந்து, பல்தியேலிடமிருந்து.” இச்சூழலில் “மனிதன்” என்பது அவளுடைய கணவனைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: தொடர்புடைய வேறொரு இடத்தில் இந்தப் பெயரின் சுருக்க வடிவமான “பல்த்தி” வருகிறது; இங்கு எபிரெயப் பெயர்வடிவம் “பல்தியேல்.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ஆட்களை அனுப்பி
  rationale: שׁלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்பினான்.’ யாரை அனுப்பினான் என்று எபிரெய உரை வெளிப்படையாகக் கூறாவிட்டாலும், தமிழில் செயலை இயல்பாகத் தெரிவிக்கச் சூழலிலிருந்து ‘ஆட்களை’ என்பது சேர்க்கப்பட்டுள்ளது; ‘செய்தி அனுப்பி’ அல்லது ‘ஆணையிட்டு’ என்று குறிப்பாக்கப்படவில்லை.
- source_word: אִישׁ בֹּשֶׁת
  choice: இஸ்போசேத்
  rationale: எபிரெய தனிப்பெயரின் பரவலாக அறியப்பட்ட தமிழ் ஒலிபெயர்ப்பு.
- source_word: וַיִּקָּחֶהָ
  choice: அவளை அழைத்துக்கொண்டான்
  rationale: לקח + 3ஆம் நபர் பெண்பால் ஒருமை பின்னொட்டு என்பதன் பொருள் ‘அவளை எடுத்துக்கொண்டான்.’ இச்சூழலில் ஒருவரிடமிருந்து அவளை வரவழைத்த செயலை இயல்பான தமிழில் ‘அழைத்துக்கொண்டான்’ எனக் கொடுக்கிறது; ‘பிடித்துக்கொண்டான்’ போன்ற தேவையற்ற வன்முறை நிழற்பொருள் தவிர்க்கப்படுகிறது.
- source_word: מֵעִם
  choice: …இடமிருந்து
  rationale: ஒருவரின் உடனிருப்பு அல்லது பொறுப்பிலிருந்து பிரித்தலைக் குறிக்கும் מֵעִם, தமிழில் இயல்பாக ‘…இடமிருந்து’ என மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தில் அது இருமுறை வருவதால், கணவனும் பல்தியேலும் ஒரே நபர் என்பதை இடைச்செருகல் வடிவம் தெளிவாக்குகிறது.
- source_word: אִישׁ
  choice: அவளுடைய கணவன்
  rationale: சொல்லின் நேரடிப் பொருள் ‘ஆண்/மனிதன்’; இச்சூழலில் அது மீகாளுடன் மணஉறவில் இருந்த நபரைக் குறிக்கிறது. எனவே உறவுநிலையை இயல்பாகத் தெரிவிக்க ‘அவளுடைய கணவன்’ என மொழிபெயர்க்கப்பட்டுள்ளது; நேரடிப் வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: פַּלְטִיאֵל
  choice: பல்தியேல்
  rationale: இவ்வசனத்தின் மசோரெட்டிக் எபிரெய வடிவமான פַּלְטִיאֵל-ஐத் தொடர்ந்து செய்யப்பட்ட தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֶּן לוש
  choice: லாயீஷின் மகன்
  rationale: בֶּן என்பது ‘மகன்’; לוש என்ற பெயர் தொடர்புடைய வேதாகமப் பெயர்வடிவத்தோடு ஒத்த ‘லாயீஷ்’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: மீகாளுடன் பல்தியேலின் உறவை எவ்வாறு குறிப்பிடுவது
  choice: அவளுடைய கணவன்
  alternative: அந்த மனிதன்
  rationale: இந்த மொழிபெயர்ப்பு அக்காலக் கதைச்சூழலில் பல்தியேலின் சமூக/மண உறவை வெளிப்படுத்துகிறது; தாவீதுடனான மீகாளின் முந்தைய திருமணத்தின் சட்ட அல்லது இறையியல் நிலையை இதனால் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. எபிரெயத்தின் மீளுரையை கோடுகளுக்கிடையிலான விளக்க இடைச்செருகலாகத் தக்கவைத்து, பல்தியேலே குறிப்பிடப்பட்ட கணவன் என்பதைத் தெளிவாக்குகிறது. ‘ஆட்களை’ என்பது தமிழின் இயல்புக்காகச் சூழலிலிருந்து வெளிப்படுத்தப்பட்டாலும், அனுப்பப்பட்டவர்களின் எண்ணிக்கை அல்லது அதிகாரப்பூர்வ நிலை குறிப்பிடப்படவில்லை.
