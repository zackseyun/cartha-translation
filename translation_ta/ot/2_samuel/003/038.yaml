  yaml_path: translation/ot/2_samuel/003/038.yaml
  text: Then the king said to his servants[a], “Do you not know that a prince and a great man has fallen today in Israel?”
translation:
  language: ta
  text: அப்போது அரசன் தன் ஊழியர்களிடம், “இன்று இஸ்ரவேலில் ஒரு தலைவரும் மிக முக்கியமானவருமான ஒருவர் வீழ்ந்துவிட்டார் என்பதை நீங்கள் அறியவில்லையா?[a]” என்று கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒரு பிரபுவும் பெரியவருமான ஒருவர்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல்லான שַׂר ஒரு பிரபு, தளபதி, ஆட்சியாளர் அல்லது முதன்மை அதிகாரியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் இயல்பான நிகழ்வுத் தொடரை ‘அப்போது’ வெளிப்படுத்துகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: திட்டவட்டமான பெயர்ச்சொல்லின் நேரடியான மொழிபெயர்ப்பு; சூழல் தாவீதைக் குறிக்கிறது என்பதால் பெயரைச் சேர்க்கத் தேவையில்லை.
- source_word: עֲבָדָיו
  choice: தன் ஊழியர்களிடம்
  rationale: அரசவையின் சூழலில் עֶבֶד என்பது அரசனுக்குப் பணிபுரிபவர்களைக் குறிக்கலாம். ‘ஊழியர்கள்’ அடிப்படைப் பொருளைக் காக்கிறது; அவர்களின் அதிகாரப் பதவியைத் தேவையின்றி வரையறுப்பதில்லை.
- source_word: הֲלוֹא תֵדְעוּ
  choice: நீங்கள் அறியவில்லையா?
  rationale: எதிர்மறை வினாத்துகள் சேர்ந்த இத்தொடர் உடன்பாட்டை எதிர்பார்க்கும் சொல்லாட்சிக் கேள்வி; தமிழிலும் அதே வலிமையையும் திறந்த கேள்வி வடிவத்தையும் காக்கிறது.
- source_word: כִּי
  choice: என்பதை
  rationale: அவர்கள் அறிய வேண்டிய செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் ‘என்பதை’ இயல்பான இணைப்பு.
- source_word: שַׂר
  choice: தலைவன்
  rationale: שַׂר என்பது தலைவர், தளபதி, ஆட்சியாளர் அல்லது உயர் அதிகாரியைக் குறிக்கலாம். அப்னேரின் இராணுவ-அரசியல் முக்கியத்துவத்தைப் பொருத்தவரை ‘தலைவன்’ இயல்பாகவும், மூலச்சொல்லின் பல்வேறு சாத்தியங்களை அளவுக்கு மீறிக் குறுக்காமலும் உள்ளது.
- source_word: וְגָדוֹל
  choice: பெருமைக்குரிய மனிதனுமான ஒருவன்
  rationale: גָדוֹל இங்கு பெயர்ச்சொல் போல் செயல்பட்டு அந்த நபரின் மேன்மை அல்லது உயர்ந்த நிலையை வலியுறுத்துகிறது. ‘பெருமைக்குரிய’ என்பது உடல் அளவைக் காட்டாமல் சமூக மதிப்பையும் சிறப்பையும் தெரிவிக்கிறது.
- source_word: נָפַל
  choice: வீழ்ந்துவிட்டான்
  rationale: ‘வீழ்தல்’ மரணத்தைக் குறிக்கும் உயர்நடை உருவகத்தைப் பாதுகாக்கிறது; ‘விட்டான்’ அந்த மரணத்தின் நிகழ்ந்துமுடிந்த நிலையையும் தற்போதைய தாக்கத்தையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: הַיּוֹם הַזֶּה
  choice: இன்று
  rationale: ‘இந்த நாள்’ என்ற மூலப் பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: இந்த குறிப்பிடத்தக்க மரணம் நிகழ்ந்த தேசியச் சூழலை בְּ குறிக்கிறது; ‘இஸ்ரவேலில்’ நேரடியானதும் இயல்பானதும்.
