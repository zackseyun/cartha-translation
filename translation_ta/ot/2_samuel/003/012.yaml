base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/012.yaml
  text: Then Abner sent messengers to David on his behalf[a], saying, “To whom does the land belong?” saying, “Make your covenant with me, and behold[b], my hand is with you to bring all Israel over to you.”
translation:
  language: ta
  text: அப்னேர் தன் சார்பாக[a] தாவீதிடம் தூதுவர்களை அனுப்பி, “நாடு யாருக்கு உரியது?” என்று கூறி, “நீர் என்னோடு உடன்படிக்கை செய்துகொள்ளும்; இதோ, இஸ்ரயேல் முழுவதையும் உம்மிடம் திருப்புவதற்கு என் கை உம்மோடு இருக்கும்[b]” என்று கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் இடத்தில்.” எபிரெயச் சொல், அப்னேரின் சார்பில் தூதுவர்கள் செயல்பட்டதைச் சுட்டுகிறது.
    reason: alternative_reading
  - marker: b
    text: “என் கை உம்மோடு இருக்கும்” என்பது அப்னேரின் ஆதரவும் ஆற்றலும் தாவீதின் பக்கம் இருக்கும் என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תחתו
  choice: தன் சார்பாக
  rationale: இந்தச் சூழலில் תחתו என்பது அப்னேரின் பிரதிநிதிகளாகத் தூதுவர்கள் அனுப்பப்பட்டதைக் குறிக்கிறது. ‘தன் இடத்தில்’ என்ற சொற்சொல் மொழிபெயர்ப்பைவிட ‘தன் சார்பாக’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מַלְאָכִים
  choice: தூதுவர்கள்
  rationale: அரசியல் பேச்சுவார்த்தைக்காக அனுப்பப்பட்ட மனிதத் தூதர்களையே இங்கு குறிக்கிறது.
- source_word: לְמִי אָרֶץ
  choice: நாடு யாருக்கு உரியது?
  rationale: எபிரெயச் சொற்றொடரின் சுருக்கத்தையும், நாட்டின் உடைமை அல்லது அதை ஆளும் உரிமை குறித்த அரசியல் உட்பொருளையும் தீர்மானமாக விளக்கிவிடாமல் காக்கிறது.
- source_word: כָּרְתָה בְרִיתְךָ אִתִּי
  choice: நீர் என்னோடு உடன்படிக்கை செய்துகொள்ளும்
  rationale: כרת ברית என்ற மரபுத்தொடரின் இயல்பான தமிழ் வடிவம். தாவீதை நோக்கிய ஒருமை மரியாதை ஏவலை ‘நீர்… செய்துகொள்ளும்’ வெளிப்படுத்துகிறது.
- source_word: וְהִנֵּה יָדִי עִמָּךְ
  choice: இதோ, என் கை உம்மோடு இருக்கும்
  rationale: ஆதரவு, செல்வாக்கு அல்லது ஆற்றலைக் குறிக்கும் ‘கை’ என்ற எபிரெய உருவகத்தை மொழிபெயர்ப்பு தக்கவைக்கிறது.
- source_word: לְהָסֵב אֵלֶיךָ
  choice: உம்மிடம் திருப்புவதற்கு
  rationale: இஸ்ரயேலின் அரசியல் பற்றுறுதியைத் தாவீதின் பக்கம் மாற்றச் செய்வதை இயல்பாக எடுத்துரைக்கிறது.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: இஸ்ரயேல் முழுவதையும்
  rationale: முழு தேசியக் கூட்டமைப்பையும் குறிக்கும் மூலமொழியின் தொகுப்புப் பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: לְמִי אָרֶץ என்ற அப்னேரின் கேள்வியின் பொருள்
  choice: ‘நாடு யாருக்கு உரியது?’ என்ற நேரடியான கேள்வியாக வைத்தல்
  alternative: ‘நாட்டை ஆள வேண்டியவர் யார்?’ அல்லது ‘நாடு என் கையில் இருக்கிறது’ என்று விளக்கமாக விரித்தல்
  rationale: எபிரெயம் சுருக்கமாகவும் பல்பொருள் வாய்ந்ததாகவும் உள்ளது. நேரடியான கேள்வி, உரிமை மற்றும் ஆட்சி குறித்த அரசியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
- issue: ‘என் கை உம்மோடு இருக்கும்’ என்ற உருவகம்
  choice: ‘கை’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘நான் உமக்கு ஆதரவாக இருப்பேன்’ என்று பொருளை மட்டும் வழங்குதல்
  rationale: அப்னேரின் தனிப்பட்ட ஆதரவோடு அவனுடைய அதிகாரமும் செல்வாக்கும் தாவீதின் பக்கம் இருக்கும் என்ற வலிமையான அரசியல் நுண்பொருளை உருவகம் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தாவீதிடம் பேசும் ஒருமை மரியாதை வடிவங்களாக ‘நீர்/உம்மிடம்/உம்மோடு’ பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் இருமுறை வரும் לאמר என்பதன் தகவல் அமைப்பு, தமிழில் இயல்பாக ‘கேட்கச் சொன்னான்; மேலும்… கூறினான்’ என்று வழங்கப்பட்டுள்ளது.
