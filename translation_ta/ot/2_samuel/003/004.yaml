lexical_decisions:
- source_word: וְהָרְבִיעִי
  choice: நான்காவது மகன்
  rationale: இது முந்தைய வசனத்தில் தொடங்கிய மகன்களின் பட்டியலைத் தொடரும் வரிசை எண்ணாகும். தமிழில் சூழலைத் தெளிவாக்க ‘மகன்’ சேர்க்கப்பட்டுள்ளது; தொடக்க וְ தனியே மொழிபெயர்க்கப்படாமல் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: אֲדֹנִיָּה
  choice: அதோனியா
  rationale: எபிரேய தனிப்பெயரின் ஒலிப்பை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: בֶן
  choice: மகன்
  rationale: நேரடியான தந்தை–மகன் உறவைக் குறிக்கும் எபிரேய இணைநிலைச் சொல்; தமிழ் மரபுப்படி ‘X-இன் மகன்’ என வழங்கப்பட்டுள்ளது.
- source_word: חַגִּית
  choice: ஆகீத்
  rationale: எபிரேய தனிப்பெயரின் மெய்யொலிகளையும் இறுதி ஒலியையும் தமிழில் இயன்றவரை பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: וְהַחֲמִישִׁי
  choice: ஐந்தாவது மகன்
  rationale: பட்டியலின் அடுத்த உறுப்பைக் குறிக்கும் வரிசை எண். தமிழில் அரைப்புள்ளி தொடர்ச்சியை இயல்பாகக் காட்டுவதால் prefixed conjunction தனிச் சொல்லாக வழங்கப்படவில்லை.
- source_word: שְׁפַטְיָה
  choice: செப்பத்தியா
  rationale: எபிரேய பெயரை அதன் ஒலியமைப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்த்த வடிவம்.
- source_word: אֲבִיטָל
  choice: அபித்தால்
  rationale: எபிரேய தனிப்பெயரின் ஒலிப்பைத் தமிழில் தெளிவாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
