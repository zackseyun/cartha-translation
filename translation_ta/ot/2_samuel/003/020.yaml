translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆண்கள்’ என்பதற்குப் பதிலாக எண்ணிக்கையோடு இயல்பாக வரும் ‘பேர்’ பயன்படுத்தப்பட்டாலும், சூழலில் அப்னேருடன் வந்த ஆண் துணைவர்கள் என்பதில் மாற்றமில்லை. ஆங்கில ஆலோசனை உரையில் [a] குறி ‘எப்ரோன்’ என்பதற்குப் பின் இருந்தது; ஆனால் அதன் அடிக்குறிப்பு וַיַּעַשׂ ... מִשְׁתֶּה பற்றியது என்பதால், தமிழில் குறி ‘விருந்து ஏற்பாடு செய்தான்’ என்பதற்குப் பின் சரியான இடத்தில் வைக்கப்பட்டது.
