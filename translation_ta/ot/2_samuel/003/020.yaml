base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/020.yaml
  text: Abner came to David at Hebron[a], and twenty men were with him. And David made a feast for Abner and for the men who were with him.
translation:
  language: ta
  text: அப்னேர் இருபது ஆண்களுடன் எப்ரோனில் இருந்த தாவீதிடம் வந்தான். தாவீது அப்னேருக்கும் அவனுடன் இருந்த ஆண்களுக்கும் ஒரு விருந்து ஏற்பாடு செய்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு விருந்து வைத்தான்” அல்லது “விருந்து அளித்தான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்தான்
  rationale: בוא என்பது பார்வைக்கேற்ப ‘வருதல்’ அல்லது ‘செல்லுதல்’ எனப் பொருள்படும். இங்கு எப்ரோனில் இருந்த தாவீதே நிகழ்வின் இலக்காக இருப்பதால் ‘வந்தான்’ இயல்பானது.
- source_word: אֶל דָּוִד חֶבְרוֹן
  choice: எப்ரோனில் இருந்த தாவீதிடம்
  rationale: ‘எப்ரோன்’ என்பதற்கு முன் எபிரெயத்தில் தனியான முன்னிடைச்சொல் இல்லாவிட்டாலும், சூழலில் அது தாவீதின் இருப்பிடத்தைக் குறிக்கிறது. நவீன தமிழில் இவ்வமைப்பு தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וְאִתּוֹ עֶשְׂרִים אֲנָשִׁים
  choice: தன்னுடன் இருபது பேரை அழைத்துக்கொண்டு
  rationale: எபிரெயச் சொற்றொடர் வினைச்சொல் இல்லாமல் ‘அவனுடன் இருபது ஆண்கள்’ என அமைந்துள்ளது. தமிழில் பயணத்துணை என்ற பொருளை இயல்பாக வெளிப்படுத்த ‘அழைத்துக்கொண்டு’ பயன்படுத்தப்பட்டது; எண்ணிக்கையும் உடனிருப்பும் பாதுகாக்கப்பட்டுள்ளன.
- source_word: וַיַּעַשׂ ... מִשְׁתֶּה
  choice: ஒரு விருந்து ஏற்பாடு செய்தான்
  rationale: עשה + משתה என்ற மரபுத்தொடர் சொற்பட ‘விருந்து செய்தான்’ என இருந்தாலும், நவீன தமிழில் ‘விருந்து ஏற்பாடு செய்தான்’ என்பதே இயல்பாக அந்தச் செயலைத் தெரிவிக்கிறது.
- source_word: מִשְׁתֶּה
  choice: விருந்து
  rationale: מִשְׁתֶּה என்பது உணவும் பானமும் இடம்பெறும் விருந்து அல்லது விருந்துணவைக் குறிக்கலாம். ‘விருந்து’ அதன் பரந்த சமூக உணவு சார்ந்த பொருளைப் பாதுகாக்கிறது; குடிப்பதை மட்டும் தேவையின்றி முன்னிலைப்படுத்துவதில்லை.
- source_word: לְאַבְנֵר וְלַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: அப்னேருக்கும் அவனுடன் வந்தவர்களுக்கும்
  rationale: மீண்டும் வரும் לְ முன்னிடைச்சொல்லை ‘அப்னேருக்கும் ... வந்தவர்களுக்கும்’ என்ற இணை அமைப்பு பிரதிபலிக்கிறது. ‘அவனுடைய ஆட்கள்’ என்று உரிமை உறவைச் சேர்க்காமல், அவர்களுடைய உடன்வருதலை மட்டும் கூறுகிறது.
