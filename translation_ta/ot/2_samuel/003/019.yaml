  language: en
  yaml_path: translation/ot/2_samuel/003/019.yaml
  text: Abner also spoke in the hearing of Benjamin[b][a], and Abner also went to speak in the hearing of David at Hebron all that seemed good in the eyes of Israel and in the eyes of the whole house of Benjamin.
translation:
  language: ta
  text: அப்னேர் பென்யமீனியரிடமும் பேசினார். மேலும், அவர் எப்ரோனுக்குச் சென்று, இஸ்ரவேலுக்கும் பென்யமீன் குடும்பத்தார் அனைவருக்கும் விருப்பமான எல்லாவற்றையும் தாவீதிடம் எடுத்துச் சொன்னார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விருப்பமான” என்பது, “பார்வையில் நல்லதாக இருந்த” என்னும் எபிரெய மரபுத்தொடரின் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/אָזְנֵי
  choice: இடமும் / இடம்
  rationale: ‘காதுகளில்’ என்ற எபிரெயச் சொற்றொடர் இங்கு ஒருவரிடம் நேரடியாகப் பேசுவதைக் குறிக்கிறது. இயல்பான தமிழில் ‘இடம்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: בִנְיָמִין
  choice: பென்யமீனியர்
  rationale: இங்கு பென்யமீன் என்ற பெயர் அந்தக் கோத்திரத்தாரைக் கூட்டாகக் குறிக்கிறது; தமிழில் மக்களைக் குறிக்கும் வடிவம் தெளிவாக உள்ளது.
- source_word: לְ/דַבֵּר
  choice: எடுத்துச் சொன்னார்
  rationale: தாவீதிடம் குறிப்பிட்ட செய்தியைத் தெரிவிப்பதே சூழல்; ‘எடுத்துச் சொன்னார்’ என்பது דּבר என்பதன் பொதுவான பேச்சுப் பொருளை இயல்பாக வெளிப்படுத்துகிறது, பேச்சுவார்த்தை போன்ற கூடுதல் பொருளைச் சேர்ப்பதில்லை.
- source_word: בְּ/חֶבְרוֹן
  choice: எப்ரோனுக்கு
  rationale: ‘சென்றார்’ என்ற இயக்க வினையுடன் இடத்தை இலக்காகக் காட்டும் தமிழின் நான்காம் வேற்றுமை இயல்பாக அமைகிறது; அவர் தாவீதிடம் பேசுவதற்காக எப்ரோனுக்குச் சென்றார் என்பதைக் கட்டமைப்பு காட்டுகிறது.
- source_word: אֵת כָּל אֲשֶׁר טוֹב בְּעֵינֵי
  choice: விருப்பமான எல்லாவற்றையும்
  rationale: ‘கண்களில் நல்லது’ என்பது ஒருவருக்கு உகந்ததாக அல்லது விருப்பமாக இருப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர். அதன் மதிப்பீட்டுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: தேசிய மக்களைக் கூட்டாகக் குறிக்கும் பெயரை மூலத்தின் வடிவத்துக்கு நெருக்கமாக வைத்துள்ளது.
- source_word: כָּל בֵּית בִּנְיָמִן
  choice: பென்யமீன் குடும்பத்தார் அனைவரும்
  rationale: ‘பென்யமீன் வீடு’ என்பது குல-கோத்திர சமூகத்தைச் சுட்டுகிறது. ‘குடும்பத்தார் அனைவரும்’ அதன் உறவுமுறை சார்ந்த கூட்டுப் பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: גַּם ... גַּם
  choice: -இடமும் ... பின்பு அவர்
  rationale: முதல் גַּם ‘பென்யமீனியரிடமும்’ என்பதில் சேர்க்கைப் பொருளாகத் தக்கவைக்கப்பட்டது. இரண்டாவது גַּם தொடரும் செயலை வலியுறுத்துவதால், தமிழில் கனமான ‘மேலும்... மேலும்’ மறுபடியைத் தவிர்த்து ‘பின்பு அவர்’ என இயல்பாக்கப்பட்டது.
- source_word: וַיְדַבֵּר ... וַיֵּלֶךְ
  choice: பேசினார் ... சென்று
  rationale: எபிரெயக் கதைத் தொடரின் கடந்தகாலச் செயல்கள், இயல்பான தமிழ் வினைமுற்று மற்றும் வினையெச்சத் தொடரால் தரப்பட்டுள்ளன.
