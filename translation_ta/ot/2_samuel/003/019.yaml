  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட உரை. ‘பென்யமீனியர்’ மற்றும் ‘பென்யமீன் குடும்பத்தார் அனைவரும்’ என்ற வேறுபாடு, முதல் குறிப்பின் கோத்திரக் கூட்டுப் பொருளையும் இரண்டாவது குறிப்பின் ‘வீடு’ என்ற உறவுமுறை நுணுக்கத்தையும் காக்கிறது.
