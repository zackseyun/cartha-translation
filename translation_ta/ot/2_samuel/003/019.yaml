- from: அப்னேர் பென்யமீனியரிடமும் பேசினார். பின்பு அவர் எப்ரோனுக்குச் சென்று, இஸ்ரவேலுக்கும் பென்யமீன் குடும்பத்தார் அனைவருக்கும் விருப்பமான எல்லாவற்றையும் தாவீதிடம் எடுத்துச் சொன்னார்.[a]
  to: அப்னேர் பென்யமீனியரிடமும் பேசினார். மேலும், அவர் எப்ரோனுக்குச் சென்று, இஸ்ரவேலுக்கும் பென்யமீன் குடும்பத்தார் அனைவருக்கும் விருப்பமான எல்லாவற்றையும் தாவீதிடம் எடுத்துச் சொன்னார்.[a]
