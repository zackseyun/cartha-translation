translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப் பதிவுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முதற்பேறானவன்’ என்பது மூலத்தின் குடும்பச் சார்ந்த நுணுக்கத்தைப் பாதுகாக்கிறது; பெண்பால் ஊரடையாளம் தமிழில் இயல்பாக ‘யெஸ்ரயேலைச் சேர்ந்த’ என்று தரப்பட்டுள்ளது.
