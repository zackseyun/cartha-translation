  yaml_path: translation/ot/2_samuel/003/002.yaml
  text: Sons were born to David in Hebron[a], and his firstborn was Amnon, by Ahinoam the Jezreelitess.
translation:
  language: ta
  text: எப்ரோனில் தாவீதுக்கு மகன்கள் பிறந்தார்கள். அவருடைய முதற்பிறந்த மகன் அம்னோன்; அவன் யெஸ்ரயேலைச் சேர்ந்த அகினோவாமுக்குப் பிறந்தவன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யெஸ்ரயேலியப் பெண்ணான அகினோவாம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְדוּ
  choice: பிறந்தார்கள்
  rationale: எபிரெய வடிவத்தின் நிகழ்வை மையப்படுத்தும் பொருளை இயல்பான தமிழில் தருகிறது; தாய்மாரை வெளிப்படையான எழுவாயாக ஆக்கவில்லை.
- source_word: לְדָוִד
  choice: தாவீதுக்கு
  rationale: வம்சப் பதிவுச் சூழலில் உள்ள உறவை இயல்பாகக் குறிக்கிறது.
- source_word: בָּנִים
  choice: மகன்கள்
  rationale: பொதுவாகப் பிள்ளைகள் என்பதல்லாமல், ஆண் பிள்ளைகளையே எபிரெயச் சொல் குறிப்பிடுகிறது.
- source_word: בְּחֶבְרוֹן
  choice: எப்ரோனில்
  rationale: ב முன்னிடைச்சொல்லின் எளிய இடப்பொருளைத் தருகிறது.
- source_word: בְכוֹרוֹ
  choice: அவருடைய முதற்பேறானவன்
  rationale: பிறப்பு வரிசையையும் அதனுடன் தொடர்புடைய குடும்ப அல்லது சட்ட முக்கியத்துவத்தையும் காக்கிறது.
- source_word: אַמְנוֹן
  choice: அம்னோன்
  rationale: எபிரெய தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: לַאֲחִינֹעַם
  choice: அகினோவாமுக்குப் பிறந்தவன்
  rationale: இந்தப் பிறப்புப் பட்டியலில் தாய்வழி உறவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַיִּזְרְעֵאלִת
  choice: யெஸ்ரயேலைச் சேர்ந்த
  rationale: பெண்பால் ஊரடையாளச் சொல்லின் அடிப்படைப் பொருளான, யெஸ்ரயேல் ஊரைச் சேர்ந்த பெண் என்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
