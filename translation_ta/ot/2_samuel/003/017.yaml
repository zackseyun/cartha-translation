  text: அப்னேர் இஸ்ரவேலின் மூப்பர்களிடம் பேசி, “நேற்றும் முந்தின நாளும் நீங்கள் தாவீதை உங்களுக்கு அரசனாக நாடிக்கொண்டிருந்தீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּדְבַר אַבְנֵר הָיָה עִם
  choice: அப்னேர் ... பேசி
  rationale: இந்த எபிரெய வழக்கு அப்னேர் மூப்பர்களுடன் ஆலோசித்ததை இயல்பான தமிழில் தெரிவிக்கிறது; நிகழ்வு அடுத்த வசனத்திலும் தொடருவதால் நிறைவுறாத நேரடி உரையாக வைக்கப்பட்டது.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மூப்பர்கள்
  rationale: சமூகத் தலைமை வகித்த மூப்பர்களைக் குறிக்கும் நிலையான, தெளிவான சொற்றொடர்.
- source_word: גַּם תְּמוֹל גַּם שִׁלְשֹׁם
  choice: ஏற்கெனவே நீண்ட காலமாக
  rationale: சொல்லுக்குச் சொல் 'நேற்றும் முந்தின நாளும்' என்றாலும், இச்சொற்றொடர் கடந்த சில காலமாக என்ற மரபுத்தொடர் பொருளில் வருகிறது.
- source_word: מְבַקְשִׁים אֶת דָּוִד לְמֶלֶךְ עֲלֵיכֶם
  choice: தாவீது உங்களுக்கு அரசராக வேண்டும் என்று விரும்பினீர்கள்
  rationale: בקש இங்கு தேடுதல் என்பதைவிட ஒருவரை அரசராக ஏற்படுத்த விரும்புதல்/நாடுதல் என்ற பொருளைத் தருகிறது; இயல்பான நவீன தமிழில் நோக்கத்தைத் தெளிவாகச் சொல்கிறது.
