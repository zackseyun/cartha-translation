  source_fidelity: 'மூல எபிரேயத்தின் கருத்தோட்டம் நன்றாகக் காக்கப்பட்டுள்ளது: அப்னேரின் கடும் கோபம், ‘நாயின் தலை’ என்ற கடினமான இகழ்ச்சி உருவகம், யூதாவுடனான அதன் தெளிவற்ற தொடர்பு, சவுலின் வீட்டாரிடத்திலான அவனது முந்தைய பற்றுறுதி, தாவீதிடம் ஒப்புக்கொடுக்காதது, மற்றும் பெண்ணைக் குறித்த இஸ்போசேத்தின் குற்றச்சாட்டு ஆகியவை அனைத்தும் துல்லியமாக உள்ளன. முதல் הַיּוֹם-ஐ ‘இன்றுவரை’ என்றும் இறுதியை ‘இன்று’ என்றும் வேறுபடுத்துவது சூழலுக்கு ஏற்றது.'
