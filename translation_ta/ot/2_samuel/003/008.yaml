base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/008.yaml
  text: Then Abner became very angry because of Ish-bosheth’s words[a], and he said, “Am I a dog’s head that belongs to Judah? To this day I have shown covenant loyalty to the house of Saul your father, to his brothers, and to his friends, and have not delivered you into David’s hand; yet today you charge me with guilt concerning this woman.”
translation:
  language: ta
  text: இஸ்போசேத்தின் வார்த்தைகளால் அப்னேர் மிகவும் கோபமடைந்து, “நான் யூதாவைச் சேர்ந்த ஒரு நாயின் தலையா?[a] இன்றுவரை உன் தந்தை சவுலின் வீட்டாருக்கும், அவருடைய சகோதரர்களுக்கும் அவருடைய நண்பர்களுக்கும் பற்றுறுதி காட்டிவந்தேன்; உன்னைத் தாவீதின் கையில் ஒப்படைக்கவில்லை. ஆனாலும் இன்று இந்தப் பெண்ணைக் குறித்து என்மேல் குற்றம் சுமத்துகிறாயே!” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூதாவைச் சேர்ந்த ஒரு நாயின் தலை” என்பது எபிரேயத்தில் பொருள் தெளிவில்லாத ஓர் இகழ்ச்சி மரபுத்தொடர். “யூதாவின் பக்கம் சேர்ந்த இழிவான நாய்” போன்ற பொருள் இருக்கலாம்; ஆனால் உருவகமும் அதன் தெளிவின்மையும் மொழிபெயர்ப்பில் காக்கப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְאַבְנֵר מְאֹד
  choice: அப்னேர் மிகவும் கோபமடைந்து
  rationale: חרה என்ற எபிரேய மரபுத்தொடர் கோபம் மூள்வதைக் குறிக்கிறது; מְאֹד காட்டும் தீவிரத்தை ‘மிகவும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל דִּבְרֵי אִישׁ בֹּשֶׁת
  choice: இஸ்போசேத்தின் வார்த்தைகளால்
  rationale: דִּבְרֵי என்பதன் ‘வார்த்தைகள்’ என்ற வடிவத்தையும், עַל இங்கு குறிக்கும் காரணத்தையும் தெளிவாகக் காக்கிறது.
- source_word: הֲרֹאשׁ כֶּלֶב אָנֹכִי אֲשֶׁר לִיהוּדָה
  choice: நான் யூதாவைச் சேர்ந்த ஒரு நாயின் தலையா?
  rationale: பொருள் தெளிவில்லாத இகழ்ச்சி மரபுத்தொடரிலுள்ள ‘நாயின் தலை’ என்ற உருவகத்தையும், யூதாவுடனான தொடர்பின் இருபொருள் வாய்ப்பையும் விளக்கவுரையாக மாற்றாமல் காக்கிறது.
- source_word: הַיּוֹם אֶעֱשֶׂה חֶסֶד
  choice: இன்றுவரை … பற்றுறுதி காட்டிவந்தேன்
  rationale: முதல் הַיּוֹם அப்னேரின் இதுவரையிலான செயல்பாட்டைத் திரும்பிப் பார்க்கும் பொருளில் வருகிறது; பின்னர் வரும் ‘இன்று’ என்பதுடன் உள்ள முரணையும் இது வெளிப்படுத்துகிறது. חֶסֶד இச்சூழலில் வெறும் தயவைவிட உறுதியான விசுவாசமான பற்றுறுதியைக் குறிக்கிறது.
- source_word: עִם בֵּית שָׁאוּל אָבִיךָ
  choice: உன் தந்தை சவுலின் வீட்டாருக்கும்
  rationale: ‘சவுலின் வீடு’ என்ற வம்சக் கருத்தை இயல்பான தமிழில் ‘வீட்டார்’ என வழங்குகிறது.
- source_word: אֶל אֶחָיו וְאֶל מֵרֵעֵהוּ
  choice: அவருடைய சகோதரர்களுக்கும் அவருடைய நண்பர்களுக்கும்
  rationale: மூலத்தின் நேரடியான உறவுச் சொற்களை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: וְלֹא הִמְצִיתִךָ בְּיַד דָּוִד
  choice: உன்னைத் தாவீதின் கையில் ஒப்படைக்கவில்லை
  rationale: ஒருவரின் அதிகாரத்திற்குள் கொடுத்துவிடுதல் என்ற எபிரேய மரபுத்தொடரின் அரசியல்-இராணுவ வலிமையைப் பாதுகாக்கிறது.
- source_word: וַתִּפְקֹד עָלַי עֲוֺן הָאִשָּׁה
  choice: இந்தப் பெண்ணைக் குறித்து என்மேல் குற்றம் சுமத்துகிறாயே
  rationale: פקד על உடன் עָוֺן வரும்போது கணக்குக் கேட்பது அல்லது குற்றஞ்சாட்டுவது என்ற சட்ட-அறப் பொருள் உண்டு; அதைத் தெளிவான தற்போதைய தமிழில் வழங்குகிறது.
