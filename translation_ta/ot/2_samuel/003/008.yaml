  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. அப்னேரின் சினமிக்க எதிர்க்கேள்வியை ‘சுமத்துகிறாயே’ என்ற முடிவு இயல்பாக வெளிப்படுத்துகிறது; கடினமான எபிரேய இகழ்ச்சி உருவகம் விளக்கவுரையாகச் சீராக்கப்படாமல் வைக்கப்பட்டுள்ளது.
