source:
  edition: WLC
  text: יָדַ֨עְתָּ֙ אֶת אַבְנֵ֣ר בֶּן נֵ֔ר כִּ֥י לְ/פַתֹּתְ/ךָ֖ בָּ֑א וְ/לָ/דַ֜עַת אֶת מוֹצָֽאֲ/ךָ֙ וְ/אֶת מבוא/ך וְ/לָ/דַ֕עַת אֵ֛ת כָּל אֲשֶׁ֥ר אַתָּ֖ה עֹשֶֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/025.yaml
  text: You know Abner son of Ner[a], that he came to deceive you, and to learn your going out and your coming in[b], and to learn all that you are doing.
translation:
  language: ta
  text: நேரின் மகன் அப்னேரை உங்களுக்குத் தெரியுமே; அவர் உங்களை ஏமாற்றுவதற்காகவும்,[a] நீங்கள் வெளியே செல்வதையும் உள்ளே வருவதையும் அறிந்துகொள்வதற்காகவும்,[b] நீங்கள் செய்துவரும் அனைத்தையும் அறிந்துகொள்வதற்காகவும் வந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களை வசப்படுத்துவதற்காக” அல்லது “உங்களைத் தூண்டிச் சம்மதிக்க வைப்பதற்காக.” எபிரேய வினைச்சொல் கவர்தல், வசப்படுத்துதல், ஏமாற்றுதல் ஆகிய பொருட்களைக் குறிக்கலாம்; இங்குள்ள பகைமையான சூழல் “ஏமாற்றுதல்” என்பதற்கு ஆதரவாக உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “நீங்கள் வெளியே செல்வதையும் உள்ளே வருவதையும்.” இது ஒருவரின் மொத்த அசைவுகளையும் நடவடிக்கைகளையும் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: உங்களுக்குத் தெரியுமே
  rationale: Qal perfect 2ms இங்கு நிகழ்கால அறிவுநிலையையும் யோவாபின் வலியுறுத்தும் குற்றச்சாட்டையும் குறிக்கிறது; ‘தெரியுமே’ என்பது இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַבְנֵר בֶּן נֵר
  choice: நேரின் மகன் அப்னேர்
  rationale: எபிரேயப் பெயர்களையும் தந்தை-மகன் உறவையும் இயல்பான தமிழ் சொல்லமைப்பில் தருகிறது.
- source_word: כִּי
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்காமல் அடுத்த வாக்கியத்தில் விரித்தல்
  rationale: இது அறியப்படும் செய்தியை அறிமுகப்படுத்துகிறது; தமிழில் ஆச்சரிய வாக்கியத்தைத் தொடர்ந்து நேரடியாக நோக்கத்தைச் சொல்வது குற்றச்சாட்டின் ஓட்டத்தை இயல்பாகக் காக்கிறது.
- source_word: לְפַתֹּתְךָ
  choice: உங்களை ஏமாற்றுவதற்காக
  rationale: פתה என்பதற்கு வசப்படுத்துதல், கவர்தல், ஏமாற்றுதல் ஆகிய பொருட்கள் உண்டு; பகைமையான அரசியல் சூழலில் ‘ஏமாற்றுதல்’ பொருத்தமானது, மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בָּא
  choice: வந்தார்
  rationale: கதைச் சூழலில் நிறைவுற்ற வருகையை எளிய இறந்தகாலம் இயல்பாகக் குறிக்கிறது.
- source_word: לָדַעַת
  choice: அறிந்துகொள்வதற்காக
  rationale: தகவலைப் பெற்றுக்கொள்ளும் நோக்கத்தை infinitive வடிவம் குறிக்கிறது; தமிழ் நோக்கவினை அமைப்பு இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מוֹצָאֲךָ וְאֶת מבואך
  choice: நீங்கள் வெளியே செல்வதையும் உள்ளே வருவதையும்
  rationale: மூலத்தின் இணைச்சொல் மரபைத் தக்கவைத்து, தாவீதின் மொத்த அசைவுகளையும் நடவடிக்கைகளையும் குறிக்கும் மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: כָּל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: நீங்கள் செய்துவரும் அனைத்தையும்
  rationale: עֹשֶׂה என்ற participle தொடரும் தற்போதைய செயல்பாட்டைக் குறிக்கிறது; ‘செய்துவரும்’ அந்த நீடித்த பொருளைக் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான குற்றச்சாட்டின் வலிமையைக் காக்கும் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘வெளியே செல்வது—உள்ளே வருவது’ என்ற இருமுனை மரபுத்தொடர் உரையில் பாதுகாக்கப்பட்டு, அதன் விரிவான பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
