translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘ஒரு வார்த்தை’ என்ற மரபுத்தொடர் முதன்மை உரையில் பேணப்பட்டு, இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது. மூலத்தில் எழுவாய் பெயரால் குறிப்பிடப்படாததால் ‘அவன்’ என்று வைத்துள்ளோம்; இறுதி சுட்டுப்பெயரின் குறிப்பு தெளிவாக இருக்க ‘அப்னேர்’ மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
