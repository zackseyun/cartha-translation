base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/018.yaml
  text: Now then[a], do it, for Yahweh has spoken concerning David, saying, ‘By the hand of my servant David I will save my people Israel from the hand of the Philistines and from the hand of all their enemies.’
translation:
  language: ta
  text: இப்போது, அதைச் செய்யுங்கள்; ஏனெனில், யாவே தாவீதைக் குறித்து, ‘என் ஊழியனான தாவீதின் கையால் என் மக்களாகிய இஸ்ரவேலைப் பெலிஸ்தியர்களின் கையிலிருந்தும், அவர்களுடைய எல்லாப் பகைவர்களின் கையிலிருந்தும் நான் மீட்பேன்[a]’ என்று கூறியிருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘மீட்க/மீட்பதற்கு’ எனப் பொருள்படும் infinitive வடிவம் உள்ளது; இவ்வாக்கியத்தின் தொடரியல் சற்றுக் கடினமானது. சூழலுக்கு ஏற்ப இது யாவே, தாவீதின் மூலம், இஸ்ரவேலை மீட்பதாகக் கூறும் உறுதிமொழியாக மொழிபெயர்க்கப்பட்டுள்ளது. மாற்றாக, ‘என் ஊழியனான தாவீது என் மக்களான இஸ்ரவேலை மீட்பார்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: הוֹשִׁיעַ என்பதன் துல்லியமான இலக்கண வடிவத்தையும், செய்பவர் குறித்த நியாயமான மாற்று விளக்கத்தையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: முந்தைய உரையிலிருந்து உடனடி நடவடிக்கைக்குத் திருப்பும் கால–உரையாடல் குறியீடு; தமிழில் இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: עֲשׂוּ
  choice: அதைச் செய்யுங்கள்
  rationale: இது ஆண்பால் பன்மை கட்டளை வடிவம். முந்தைய சூழலில் முன்வைக்கப்பட்ட செயலைக் குறிக்கும் மறைபொருள் தமிழில் ‘அதை’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், நவீன தமிழில் அதன் ஒலிப்பெயர்ப்பாக வழங்குகிறது.
- source_word: אָמַר אֶל דָּוִד לֵאמֹר
  choice: தாவீதைக் குறித்துப் பேசி … என்று கூறியிருக்கிறார்
  rationale: இங்கு தொடரும் மேற்கோள் தாவீதை மூன்றாம் நபரில் ‘என் ஊழியனாகிய தாவீது’ என்று குறிப்பிடுவதால், אֶל־דוד என்பதை சூழலுக்கேற்ப ‘தாவீதைக் குறித்து’ என எடுத்துள்ளது. வினையின் நிறைவுற்ற செயல் தற்போதைய அறிவுறுத்தலுக்கான நிலையான ஆதாரமாதலால் ‘கூறியிருக்கிறார்’ என வழங்கப்பட்டுள்ளது.
- source_word: בְּיַד דָּוִד עַבְדִּי
  choice: என் ஊழியனாகிய தாவீதின் கையால்
  rationale: ביד என்பதன் கருவி/முகமைப் பொருளையும் எபிரெய உருவகத்தையும் காக்கிறது; עַבְדִּי அரச–இறை ஆணைப்பணி சூழலில் ‘என் ஊழியன்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הוֹשִׁיעַ
  choice: நான் மீட்பேன்[a]
  rationale: சூழலும் பழங்கால மொழிபெயர்ப்புச் சாட்சிகளும் யாவே தாவீதின் மூலம் செய்யும் எதிர்கால மீட்பை ஆதரிக்கின்றன. ஆனால் WLC-யின் மசோரா உயிர்க்குறிப்பு இதை கட்டளை வடிவமாகக் காட்டுவதால், அந்த உரைப்பிரச்சினை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: עַמִּי יִשְׂרָאֵל
  choice: என் மக்களான இஸ்ரவேலை
  rationale: உடன்படிக்கைச் சார்ந்த ‘என் மக்கள்’ என்ற உடைமையையும் ‘இஸ்ரவேல்’ என்ற விளக்கப் பெயரையும் இயல்பான தமிழில் காக்கிறது.
- source_word: מִיַּד פְּלִשְׁתִּים וּמִיַּד כָּל אֹיְבֵיהֶם
  choice: பெலிஸ்தியர்களின் கையிலிருந்தும் அவர்களுடைய எல்லாப் பகைவர்களின் கையிலிருந்தும்
  rationale: எதிரிகளின் அதிகாரம் அல்லது பிடியைக் குறிக்கும் ‘கையிலிருந்து’ என்ற எபிரெய உருவகத்தையும் அதன் மறுபடிச் சொல்லலையும், כָּל என்பதன் முழுமையையும் காக்கிறது.
theological_decisions:
- issue: הוֹשִׁיעַ என்பதன் வடிவமும் மீட்பின் செய்பவரும்
  choice: '‘நான் மீட்பேன்’: யாவே முதன்மைச் செய்பவர்; தாவீது அவர் பயன்படுத்தும் முகவர்.'
  alternative: WLC மசோரா உயிர்க்குறிப்பின்படி ‘மீட்டுவிடு’ என்ற ஒருமை கட்டளை; அல்லது தாவீது இஸ்ரவேலை மீட்பார் எனச் சூழலுக்கேற்ப புரிந்துகொள்ளுதல்.
  rationale: ‘என் ஊழியனாகிய தாவீதின் கையால்’ என்பது தெய்வீகச் செயலும் மனித முகமையும் வேறுபடுத்துகிறது. ஆயினும் WLC-யில் உள்ள உயிர்க்குறிக்கப்பட்ட வடிவம் நேரடியாக எதிர்கால முதல் நபர் வடிவமல்ல; ஆகவே உரை மற்றும் பொருள் சார்ந்த பதற்றத்தை அடிக்குறிப்பில் மறைக்காமல் பதிவு செய்துள்ளோம்.
- issue: אֶל דָּוִד என்பதன் உறவு
  choice: ‘தாவீதைக் குறித்து’
  alternative: ‘தாவீதிடம்’
  rationale: אֶל என்பதன் சாதாரண பொருள் ‘இடம்/நோக்கி’ என்றாலும், தாவீதை மூன்றாம் நபரில் குறிப்பிடும் மேற்கோளின் அமைப்பு இங்கு ‘குறித்து’ என்ற பொருளை ஆதரிக்கிறது. மாற்று வாசிப்பு சாத்தியம் என்பதையும் மொழிபெயர்ப்பு முடிவு மறுப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் நேரடியான ஆனால் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘கையால்/கையிலிருந்து’ என்ற மறுபடிச் சொல்லல் எபிரெய இலக்கிய அமைப்பையும் முகமை–அதிகார உருவகங்களையும் காக்கிறது.
