translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இறுதி ஊர்வலத்தின் துக்கச் சடங்கு மொழி தெளிவாக வைக்கப்பட்டுள்ளதுடன், ‘அப்னேருக்கு முன்னால்’ என்ற மூலத்தின் சுருக்கமும் சாத்தியமான இடவியல் தெளிவின்மையும் தேவையின்றி விரித்துரைக்கப்படவில்லை. அடிக்குறிப்பு குறி அது விளக்கும் ‘பாடை’ என்ற சொல்லுக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
