base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/031.yaml
  text: Then David said to Joab and to all the people who were with him[a], “Tear your clothes, gird yourselves with sackcloth, and mourn before Abner.” And King David was walking behind the bier.
translation:
  language: ta
  text: பின்பு தாவீது யோவாபிடமும் தன்னுடன் இருந்த மக்கள் அனைவரிடமும், “உங்கள் உடைகளைக் கிழித்து, சாக்குத் துணியை இடுப்பில் கட்டிக்கொண்டு, அப்னேரின் முன்னால் புலம்புங்கள்” என்றான். அரசன் தாவீது பாடைக்குப்[a] பின்னால் நடந்து சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் பொதுவாக “படுக்கை” அல்லது “கட்டில்” என்று பொருள்படும்; இங்கு அது அப்னேரின் உடலைச் சுமந்து செல்லப்பட்ட பாடையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְעוּ בִגְדֵיכֶם
  choice: உங்கள் உடைகளைக் கிழித்து
  rationale: துக்கத்தின் அடையாளமாக உடைகளைக் கிழிப்பதைக் குறிக்கும் பன்மை ஏவல் வடிவத்தை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: חִגְרוּ שַׂקִּים
  choice: சாக்குத் துணியை இடுப்பில் கட்டிக்கொண்டு
  rationale: חגר என்பதன் ‘இடுப்பில் கட்டிக்கொள்/சுற்றிக்கொள்’ என்ற உடல்சார் படிமத்தையும், துக்கத்திற்குரிய சாக்குத் துணியையும் காக்கிறது; வெறுமனே ‘அணிந்துகொண்டு’ என்பதைக் காட்டிலும் மூலத்திற்கு நெருக்கமானது.
- source_word: וְסִפְדוּ
  choice: புலம்புங்கள்
  rationale: இறந்தவருக்காகச் செய்யப்படும் வெளிப்படையான துக்கப் புலம்பலை ספד குறிக்கிறது; பொதுவான ‘துக்கப்படுங்கள்’ என்பதைவிட இச்சூழலுக்கு துல்லியமானது.
- source_word: לִפְנֵי אַבְנֵר
  choice: அப்னேருக்கு முன்னால்
  rationale: எபிரெயச் சொல்லமைப்பின் ‘அப்னேருக்கு முன்பாக’ என்ற இடவியல் பொருளைத் தக்கவைக்கிறது; உடலை ஏந்திய பாடைக்கு முன்பாகச் செல்லும் இறுதி ஊர்வலச் சூழலை வாசகம் உணர்த்துகிறது.
- source_word: הֹלֵךְ אַחֲרֵי
  choice: பின்னால் நடந்து சென்றான்
  rationale: הֹלֵךְ என்ற நிகழ்நிலைப் பங்கேற்புச் சொல்லின் தொடர்ச்சியான செயலை இயல்பான தமிழ் இறந்தகாலத் தொடரால் வெளிப்படுத்தி, אַחֲרֵי என்பதன் இடவியல் பொருளை ‘பின்னால்’ எனத் தருகிறது.
- source_word: הַמִּטָּה
  choice: பாடை
  rationale: מִטָּה பொதுவாக படுக்கை அல்லது கட்டிலைக் குறித்தாலும், இங்கு அப்னேரின் உடலை ஏந்திச் சென்ற இறுதி ஊர்வல மேடையைக் குறிக்கிறது; தமிழில் ‘பாடை’ இதற்கான சுருக்கமான, துல்லியமான சொல்.
- source_word: וְהַמֶּלֶךְ דָּוִד
  choice: தாவீது அரசன்
  rationale: தாவீதின் அரசப் பொறுப்பை வலியுறுத்தும் அடைமொழியைத் தமிழின் இயல்பான பெயர்–பதவி வரிசையில் தருகிறது.
