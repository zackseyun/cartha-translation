base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/001.yaml
  text: The war between the house of Saul and the house of David was prolonged[a], and David kept growing stronger[b], while the house of Saul kept growing weaker.
translation:
  language: ta
  text: சவுலின் வீட்டாருக்கும்[b] தாவீதின் வீட்டாருக்கும் இடையிலான போர் நீடித்தது[a]. தாவீது தொடர்ந்து வலிமை பெற்றுவந்தார்; சவுலின் வீட்டாரோ தொடர்ந்து வலிமை இழந்துவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீண்டதாக இருந்தது.” எபிரெயப் பெயரடை சொல்லுக்கு சொல் “நீண்ட” என்று பொருள்படும்; இங்கு அது போர் நீடித்த காலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “வீட்டார்” என்பது குடும்பத்தார், வழிமரபினர் அல்லது அரச வம்சத்தார் ஆகியோரைக் குறிக்கலாம்; இங்கு குடும்ப மற்றும் அரசியல் பொருள்கள் இரண்டும் உள்ளடங்கியிருக்கலாம்.
    reason: lexical_alternative
