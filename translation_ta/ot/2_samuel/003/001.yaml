  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வரலாற்றுக் கதைநடைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘மேலும் மேலும்’ என்பதற்குப் பதிலாக ‘தொடர்ந்து ... வந்தார்/வந்தார்கள்’ பயன்படுத்தப்பட்டு, மூலத்தின் படிப்படியான தொடர்மாற்றம் இயல்பான தமிழில் காக்கப்பட்டுள்ளது.
