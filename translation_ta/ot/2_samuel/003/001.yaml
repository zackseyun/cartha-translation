  rationale: எபிரெயத்தில் ‘வீடு’ என்பதன் உறுப்பினர்கள் கூட்டாகப் பன்மையில் கருதப்படுகின்றனர். ‘வீட்டார்... வந்தார்கள்’ என்பது தமிழில் இயல்பாக அந்தக் கூட்டுப் பொருளையும், தாவீதுடனான தொடர்ச்சியான எதிர்மறை மாற்றத்தையும் காட்டுகிறது.
- source_word: דַלִּים
  choice: வலிமை இழந்துவந்தார்கள்
  rationale: இங்கு பொருளாதார வறுமையல்ல, அரசியல் மற்றும் இராணுவ வலிமை குறைவதே கருத்து; எதிரிலுள்ள ‘வலிமை பெற்றுவந்தார்’ என்பதுடன் தெளிவான முரணையும் இது தருகிறது.
