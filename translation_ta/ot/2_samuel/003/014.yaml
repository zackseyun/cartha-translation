base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/014.yaml
  text: Then David sent messengers to Ish-bosheth son of Saul[a], saying, “Give me my wife Michal[b], whom I betrothed to myself for a hundred Philistine foreskins.”
translation:
  language: ta
  text: பின்பு தாவீது சவுலின் மகன் ஈஸ்போசேத்திடம் தூதுவர்களை அனுப்பி, “நூறு பெலிஸ்தியரின் நுனித்தோல்களுக்காக நான் எனக்கென மணநிச்சயம் செய்துகொண்ட என் மனைவியான மீகாளை எனக்குக் கொடு[a][b]” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்லாக: “நூறு பெலிஸ்தியரின் நுனித்தோல்களுக்காக நான் எனக்கென மணநிச்சயம் செய்துகொண்டவள்.” நிகழ்ச்சியின் பின்னணியில், “நூறு பெலிஸ்தியரின் நுனித்தோல்களை மணப்பரிசாகக் கொடுத்து நான் மனைவியாகப் பெற்றவள்” என்றும் பொருள்படும்.'
    reason: lexical_alternative
  - marker: b
    text: மீகாளுக்காகச் சவுல் கேட்ட பெலிஸ்தியரின் நுனித்தோல்களைத் தாவீது கொண்டுவந்த நிகழ்வுக்கு 1 சாமுவேல் 18:25–27-ஐப் பார்க்கவும்.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: பின்பு ... அனுப்பி
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுத்துச் செல்கிறது; ‘பின்பு’ இயல்பான காலவரிசையைக் காட்டுகிறது, காரணத்தைக் கூடுதலாகப் புகுத்துவதில்லை.
- source_word: מַלְאָכִים
  choice: தூதுவர்களை
  rationale: மனிதர்களைக் குறிக்கும் இச்சூழலில் ‘தூதுவர்கள்’ என்பது இயல்பானதும் துல்லியமானதும்.
- source_word: אֶל אִישׁ בֹּשֶׁת בֶּן שָׁאוּל
  choice: சவுலின் மகன் ஈஸ்போசேத்திடம்
  rationale: எபிரெயப் பெயரையும் தந்தை-மகன் அடையாளத்தையும் தெளிவாகப் பேணுகிறது.
- source_word: תְּנָה
  choice: என்னிடம் ஒப்படை
  rationale: נתן என்பதன் கட்டளை வடிவம் அடிப்படையில் ‘கொடு’; இங்கு ஏற்கெனவே வேறொருவரிடம் இருக்கும் மீகாளைத் தாவீதிடம் திருப்பி அனுப்புமாறு கோருவதால் ‘ஒப்படை’ இயல்பான சூழல்சார் இணை.
- source_word: אֶת אִשְׁתִּי אֶת מִיכַל
  choice: என் மனைவி மீகாளை
  rationale: மீகாள் யார் என்பதை விளக்கும் எபிரெய இணைப்பைத் தமிழில் இயல்பாகக் கொடுக்கிறது.
- source_word: אֲשֶׁר אֵרַשְׂתִּי לִי
  choice: எனக்கென நிச்சயித்துக்கொண்ட
  rationale: ארשׂ திருமண நிச்சயத்தைச் சுட்டுகிறது; לִי-யின் தனக்குரிய உரிமைக் கோரிக்கையை ‘எனக்கென’ பேணுகிறது.
- source_word: בְּמֵאָה עָרְלוֹת פְּלִשְׁתִּים
  choice: நூறு பெலிஸ்தரின் நுனித்தோல்களை மணப்பரிசாகக் கொடுத்து
  rationale: உரையின் திடமான உடற்கூறு சொல்லை மறைக்காமல் பேணுவதோடு, בְּ இங்கு மணப்பரிசின் அடிப்படை அல்லது விலையைக் குறிக்கிறது என்பதைத் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: மீகாளின் திருமண நிலையை விவரிக்கும் சொற்களில் உள்ள பதற்றம்
  choice: ‘என் மனைவி’ என்பதையும் ‘நிச்சயித்துக்கொண்ட’ என்பதையும் இரண்டையும் பேணுதல்
  alternative: பதற்றத்தைச் சீராக்கி ‘நான் மணந்துகொண்ட என் மனைவி’ என்று மொழிபெயர்த்தல்
  rationale: தாவீது மீகாளை ‘என் மனைவி’ என்று அழைத்தபோதும், தன் உரிமையை முந்தைய திருமண நிச்சயமும் மணப்பரிசும் சார்ந்து நிறுவுகிறான். மூலத்தில் உள்ள சட்ட-உறவியல் பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடக் கூடாது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நுனித்தோல்கள்’ என்ற நேரடியான சொல் மூலத்தின் வெளிப்படைத்தன்மையைப் பேணுகிறது. பிரதான உரையில் பொருள் தெளிவுக்காக ‘மணப்பரிசாக’ சேர்க்கப்பட்டு, சொல்லுக்குச் சொல்லான அமைப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
