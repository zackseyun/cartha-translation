base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/006.yaml
  text: While the war continued between the house of Saul and the house of David[a], Abner was strengthening himself in the house of Saul.
translation:
  language: ta
  text: சவுலின் வீட்டாருக்கும் தாவீதின் வீட்டாருக்கும் இடையே போர் நீடித்துக்கொண்டிருந்தபோது, அப்னேர் சவுலின் வீட்டாருக்குள் தன்னை வலுப்படுத்திக்கொண்டிருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சவுலின் வீட்டாருக்குள் வலிமை பெற்று வந்தான்.” எபிரெய வினை, ஒருவர் வலிமை பெறுவதையோ தன்னை வலுப்படுத்திக்கொள்வதையோ குறிக்கலாம். இங்கு அப்னேர் சவுலின் வீட்டாருக்குள் தன் நிலையை உறுதிப்படுத்திக்கொண்டான் என்ற பொருளும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: தனி முன்னிலைச் சொல்லாக மொழிபெயர்க்காமல் காலநிலைத் தொடரில் வெளிப்படுத்தப்பட்டது
  rationale: இந்தக் கதைத் தொடர் வடிவம் புதிய நிகழ்வை அறிமுகப்படுத்துகிறது; எபிரெயத்தில் ‘இப்போது’ என்பதற்கான தனிச் சொல் இல்லாததால், தமிழில் தேவையற்ற ‘இப்போது’ அல்லது பழமையான ‘அப்போது சம்பவித்ததாவது’ சேர்க்கப்படவில்லை.
- source_word: בִּהְיוֹת הַמִּלְחָמָה
  choice: போர் நீடித்துக்கொண்டிருந்தபோது
  rationale: ב உடன் வரும் היה வினையின் infinitive construct, போர் தொடர்ந்து நடைபெற்று வந்த காலநிலையைச் சுட்டுகிறது. இந்த நீடித்த தன்மையை இயல்பான நவீன தமிழில் இவ்வாறு வெளிப்படுத்துகிறது.
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: சவுலின் வீட்டாருக்கும் தாவீதின் வீட்டாருக்கும் இடையே
  rationale: ‘வீட்டார்’ என்பது குடும்பத்தையும் அதனுடன் இணைந்த அரசியல் அல்லது வம்சக் குழுவையும் குறிக்கக்கூடிய எபிரெய ‘வீடு’ என்ற உருவகத்தின் அகலத்தைப் பாதுகாக்கிறது; ‘வம்சம்’ என்று மட்டும் மொழிபெயர்ப்பது பொருளைக் குறுக்கிவிடும்.
- source_word: וְאַבְנֵר
  choice: அப்னேர்
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு முறையில் தரப்பட்டுள்ளது.
- source_word: הָיָה מִתְחַזֵּק
  choice: தன்னை வலுப்படுத்திக்கொண்டிருந்தான்
  rationale: חזק என்பதன் ஹித்பயேல் வடிவத்திலுள்ள தன்முக அல்லது தன் நலனை முன்னிறுத்தும் நுண்ணுணர்வை இது பாதுகாக்கிறது; அதேவேளையில் ‘வலிமை பெற்று வந்தான்’ என்ற நிலைமாற்றப் பொருளும் சாத்தியம்.
- source_word: בְּבֵית שָׁאוּל
  choice: சவுலின் வீட்டாருக்குள்
  rationale: ב என்ற முன்னிடைச்சொல், சவுலின் குடும்பம் அல்லது அரசியல் அணியே அப்னேர் தன்னை வலுப்படுத்திக்கொண்ட செயலின் களமாக இருந்ததைத் தெரிவிக்கிறது.
theological_decisions:
- issue: அப்னேரின் வலிமை அதிகரித்த விதம்
  choice: தன்னை வலுப்படுத்திக்கொண்டிருந்தான்
  alternative: வலிமை பெற்று வந்தான்
  rationale: எபிரெய வினை அப்னேர் தன் செல்வாக்கைத் தானே உறுதிப்படுத்தினான் என்றும், அவன் வலிமை வளர்ந்து வந்தது என்றும் புரிந்துகொள்ள இடமளிக்கிறது. முதன்மை உரை தன்முக வடிவத்தைப் பாதுகாக்கிறது; அடிக்குறிப்பு மற்ற சாத்தியத்தைத் தருகிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘போர்’ என்பது நேரடியான இயல்பான சொல். ‘வீட்டார்’ என்ற சொல் குடும்பம், வம்சம், அரசியல் அணி ஆகிய நுண்ணுணர்வுகளை முழுமையாக ஒன்றாகச் சுருக்காமல் திறந்த நிலையில் வைத்திருக்கிறது.
