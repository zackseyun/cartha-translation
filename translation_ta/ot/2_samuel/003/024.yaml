base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/024.yaml
  text: Then Joab came to the king and said[a], “What have you done? Look, Abner came to you. Why is this—you sent him away, and he has gone on his way?”
translation:
  language: ta
  text: பின்பு யோவாப் அரசனிடம் வந்து, “நீர் என்ன செய்துவிட்டீர்? இதோ, அப்னேர் உம்மிடம் வந்தான். ஏன் இப்படி அவனை அனுப்பிவிட்டீர்? அவன் போயே போய்விட்டான்[a]!” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இங்கு ‘அவன் போனான், போக’ என்ற வலியுறுத்தும் அமைப்பு உள்ளது; அவன் உறுதியாக அல்லது முற்றிலும் போய்விட்டான் என்பது பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: பின்பு ... வந்து
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை இயல்பான நவீனத் தமிழில் முன்னெடுக்கிறது.
- source_word: מֶה עָשִׂיתָה
  choice: நீர் என்ன செய்துவிட்டீர்?
  rationale: முடிந்த செயலின் தற்போதைய விளைவையும் யோவாபின் கண்டனத் தொனியையும் வெளிப்படுத்துகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை வலியுறுத்தி ஈர்க்கும் எபிரெயச் சொல்லின் சுட்டும் ஆற்றலை இயல்பாகக் காக்கிறது.
- source_word: בָא אַבְנֵר אֵלֶיךָ
  choice: அப்னேர் உம்மிடம் வந்திருந்தான்
  rationale: யோவாப் வருவதற்கு முன் நிகழ்ந்து முடிந்த அப்னேரின் வருகையைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: לָמָּה זֶּה
  choice: ஏன் இப்படி
  rationale: வெறும் ‘ஏன்’ என்பதைக் காட்டிலும் சுட்டிக்காட்டிக் குற்றஞ்சாட்டும் தொனியைப் பேணுகிறது.
- source_word: שִׁלַּחְתּוֹ
  choice: அவனை அனுப்பிவிட்டீர்
  rationale: அவனைப் போகவிட்ட செயலில் அரசனின் நேரடி பங்கைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: அவன் போயே போய்விட்டானே
  rationale: வினைச்சொல்லுடன் வரும் infinitive absolute அளிக்கும் வலியுறுத்தலை இயல்பான தமிழில் ‘போயே போய்விட்டான்’ எனக் காட்டுகிறது; ‘-னே’ யோவாபின் குற்றஞ்சாட்டும் வலியுறுத்தலையும் தருகிறது.
