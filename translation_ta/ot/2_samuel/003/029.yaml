source:
  edition: WLC
  text: יָחֻ֨לוּ֙ עַל רֹ֣אשׁ יוֹאָ֔ב וְ/אֶ֖ל כָּל בֵּ֣ית אָבִ֑י/ו וְֽ/אַל יִכָּרֵ֣ת מִ/בֵּ֣ית יוֹאָ֡ב זָ֠ב וּ/מְצֹרָ֞ע וּ/מַחֲזִ֥יק בַּ/פֶּ֛לֶךְ וְ/נֹפֵ֥ל בַּ/חֶ֖רֶב וַ/חֲסַר לָֽחֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/029.yaml
  text: May it fall on the head of Joab and on all his father’s house[a], and may there never be cut off from the house of Joab one who has a discharge, or is leprous, or holds a staff, or falls by the sword[b], or lacks bread.
translation:
  language: ta
  text: அது யோவாபின் தலையின்மேலும் அவனுடைய தந்தையின் குடும்பத்தார் அனைவரின்மேலும் விழட்டும். யோவாபின் குடும்பத்தில் உடலில் ஒழுக்கு உள்ளவனோ, தோல் நோய் உள்ளவனோ[a], நூல் நூற்கும் கதிரைப் பிடிப்பவனோ[b], வாளால் வீழ்பவனோ, உணவில்லாதவனோ ஒருபோதும் இல்லாமல் போகாதிருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபாக இது “தொழுநோய் உள்ளவன்” என்று மொழிபெயர்க்கப்படுகிறது; ஆனால் எபிரெயச் சொல் பலவகையான தோல் பாதிப்புகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஊன்றுகோலைப் பிடிப்பவன்”; சிலர் இச்சொற்றொடரை “ஊன்றுகோலின்மேல் சாய்பவன்” என்று புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחֻלוּ עַל רֹאשׁ
  choice: தலையின்மேல் விழட்டும்
  rationale: முந்தைய வசனத்தின் இரத்தப்பழி அல்லது அதற்கான தண்டனை ஒருவர்மேல் வருவதைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் காக்கிறது.
- source_word: בֵּית אָבִיו
  choice: அவனுடைய தந்தையின் குடும்பத்தார் அனைவரும்
  rationale: தந்தைவழிக் குடும்பம் அல்லது குலவீடு என்ற உறவுக்குழு பொருளை, நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אַל יִכָּרֵת מִבֵּית יוֹאָב
  choice: யோவாபின் குடும்பத்தில் ... ஒருபோதும் இல்லாமல் போகாதிருக்கட்டும்
  rationale: இத்தகைய துன்பமுற்றவர்கள் அவன் குடும்பத்திலிருந்து அறவே ஒழியாதிருக்க வேண்டுமென்ற சாபத்தின் எதிர்மறை வலிமையைத் தெளிவுபடுத்துகிறது.
- source_word: זָב
  choice: உடலிலிருந்து ஒழுக்கு உள்ளவன்
  rationale: நீடித்த உடல் ஒழுக்கைக் குறிக்கும் சொல்லைத் தேவையற்ற மருத்துவக் குறிப்பின்றி நேரடியாக வழங்குகிறது.
- source_word: מְצֹרָע
  choice: கடுமையான தோல் நோய் உள்ளவன்
  rationale: இச்சொல் நவீன தொழுநோயை மட்டும் குறுக்கமாகக் குறிக்காமல் பலவகை தீவிரத் தோல் பாதிப்புகளைக் குறிக்கலாம் என்பதால் விரிவான பொருள் தேர்ந்தெடுக்கப்பட்டது.
- source_word: מַחֲזִיק בַּפֶּלֶךְ
  choice: நூற்கதிரைப் பிடிப்பவன்
  rationale: פֶּלֶךְ என்பதன் இயல்பான பொருளான நூல் நூற்கும் கருவியின் தெளிவான உருவகத்தை விளக்கிப் பொருள் தீர்க்காமல் காக்கிறது.
- source_word: נֹפֵל בַּחֶרֶב
  choice: வாளால் வீழ்பவன்
  rationale: வாளினால் கொல்லப்படுவதைச் சொல்லும் எபிரெய மரபுத்தொடரின் solemn image-ஐத் தமிழிலும் காக்கிறது.
- source_word: חֲסַר לָחֶם
  choice: உணவின்றித் தவிப்பவன்
  rationale: לחם என்பதன் அன்றாட உணவு அல்லது வாழ்வாதாரம் என்ற இங்கு இயங்கும் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: தாவீதின் கூற்றின் தன்மை
  choice: யோவாபின் குடும்பத்துக்கு எதிரான சாபவிருப்பாக மொழிபெயர்த்தல்
  alternative: எதிர்காலத்தில் நிகழப்போவதை அறிவிக்கும் முன்னறிவிப்பாக மொழிபெயர்த்தல்
  rationale: வினை வடிவங்களும் எதிர்மறை வேண்டுகோள் அமைப்பும் வெறும் முன்னறிவிப்பைவிட நீதித்தீர்ப்பை வேண்டுகிற சாபவாக்கியத்தைக் காட்டுகின்றன.
- issue: מַחֲזִיק בַּפֶּלֶךְ என்ற தெளிவற்ற சொற்றொடர்
  choice: நூற்கதிரைப் பிடிப்பவன்
  alternative: ஊன்றுகோலைப் பிடிப்பவன் அல்லது அதன்மேல் சாய்பவன்
  rationale: முதன்மையான பொருளை正文த்தில் வைத்து, பழமையான வேறொரு புரிதலை அடிக்குறிப்பில் பாதுகாப்பது மூலத்தின் உண்மையான தெளிவின்மையை மறைக்காது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாபவாக்கியத்தின் கடுமையையும் பட்டியல் அமைப்பையும் காத்துள்ளோம். பழமையான அல்லது தவறாகக் குறுகிவிடக்கூடிய நோய்ப்பெயருக்குப் பதிலாக புரிந்துகொள்ளத்தக்க சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது; சர்ச்சைக்குரிய நூற்கதிர்/ஊன்றுகோல் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
