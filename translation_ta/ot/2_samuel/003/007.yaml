- from: சவுலுக்கு ஆயாவின் மகளான ரிஸ்பா என்ற மறுமனைவி இருந்தாள். இஸ்போசேத் அப்னேரிடம், “நீ ஏன் என் தந்தையின் மறுமனைவியிடம் சென்றாய்[a]?” என்று கேட்டான்.
