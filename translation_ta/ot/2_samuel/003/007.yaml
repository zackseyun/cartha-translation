base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/007.yaml
  text: Saul had a concubine whose name was Rizpah daughter of Aiah. And Ish-bosheth said to Abner[a], “Why did you go in to my father’s concubine?”
translation:
  language: ta
  text: சவுலுக்கு ஆயாவின் மகளான ரிஸ்பா என்ற துணைமனைவி இருந்தாள். இஸ்போசேத் அப்னேரிடம், “நீ ஏன் என் தந்தையின் துணைமனைவியிடம் சென்றாய்[a]?” என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் வெளிப்படையாக, “என் தந்தையின் துணைமனைவியுடன் ஏன் பாலுறவு கொண்டாய்?” எபிரேயத்தில் “என் தந்தையின் துணைமனைவியிடம் சென்றாய்” என்று உள்ளது; இது பாலுறவைக் குறிக்கும் வழக்கமான மறைமொழி.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשָׁאוּל
  choice: சவுலுக்கு … இருந்தாள்
  rationale: லாமேத் குறிக்கும் உடைமைப் பொருளை இயல்பான தமிழில் ‘சவுலுக்கு … இருந்தாள்’ என்று தருகிறது; எபிரெயில் இல்லாத காலச் சுட்டுச் சொல்லைச் சேர்க்கவில்லை.
- source_word: פִּלֶגֶשׁ / פִּילֶגֶשׁ
  choice: மறுமனைவி
  rationale: அக்காலத்தில் முதன்மை மனைவியைவிடக் குறைந்த சமூக-சட்ட நிலை கொண்ட துணைவியைக் குறிக்கும் சொல்லை, நவீன வாசகர்களுக்குப் புரியும் கண்ணியமான தமிழில் தருகிறது.
- source_word: וּשְׁמָהּ רִצְפָּה בַת אַיָּה
  choice: ஆயாவின் மகளான ரிஸ்பா என்ற
  rationale: பெயரையும் தந்தைவழி அடையாளத்தையும் இயல்பான தமிழ் பெயரெச்சத் தொடராக வழங்குகிறது.
- source_word: וַיֹּאמֶר
  choice: இஸ்போசேத் … கேட்டான்
  rationale: எபிரெயில் எழுவாய் மறைந்திருந்தாலும், முந்தைய வசனத்தின் சூழல் பேசுபவர் இஸ்போசேத் என்பதைத் தெளிவாக்குகிறது. கேள்வி வாக்கியம் என்பதால் தமிழில் ‘கேட்டான்’ இயல்பாக உள்ளது.
- source_word: אֶל אַבְנֵר
  choice: அப்னேரிடம்
  rationale: பேச்சு வினையுடன் வரும் אֶל என்பதற்கான இயல்பான தமிழ் வடிவம்.
- source_word: מַדּוּעַ
  choice: ஏன்
  rationale: நேரடியான காரண வினாவை எளிய நவீன தமிழில் தருகிறது.
- source_word: בָּאתָה אֶל־פִּילֶגֶשׁ אָבִי
  choice: என் தந்தையின் மறுமனைவியிடம் சென்றாய்
  rationale: ‘ஒரு பெண்ணிடம் செல்’ என்ற எபிரெய பாலுறவு மறைமொழியைத் தமிழிலும் மறைமொழியாகவே வைத்துள்ளது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
