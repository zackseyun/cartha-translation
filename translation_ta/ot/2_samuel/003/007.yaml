translation_notes:
  register: நவீன, கண்ணியமான, எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. பாலுறவைக் குறிக்கும் மூலமொழியின் மறைமொழி முதன்மை உரையில் பாதுகாக்கப்பட்டு, பொருள் அடிக்குறிப்பில் தெளிவாக்கப்பட்டுள்ளது.
