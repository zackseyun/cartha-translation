base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/016.yaml
  text: Her husband went with her[a], walking and weeping behind her as far as Bahurim. Then Abner said to him, “Go[b], return.” So he returned.
translation:
  language: ta
  text: அவளுடைய கணவன் அவளோடு சென்றான்; பகூரிம் வரைக்கும் அவளுக்குப் பின்னால்[a] நடந்துகொண்டும் அழுதுகொண்டும் சென்றான். அப்போது அப்னேர் அவனிடம், “போ, திரும்பு[b]” என்றான். அவன் திரும்பிப்போனான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளைத் தொடர்ந்து.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “போ, திரும்பு” என்று இரண்டு கட்டளைகள் உள்ளன; இதை “திரும்பிப்போ” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישָׁהּ
  choice: அவளுடைய கணவன்
  rationale: இச்சூழலில் אִישׁ, மூன்றாம் நபர் பெண்பால் ஒருமை உடைமைப் பின்னொட்டுடன், பொதுவாக ‘அவளுடைய ஆண்’ என்பதல்லாமல் அவளுடைய கணவனைக் குறிக்கிறது.
- source_word: הָלוֹךְ וּבָכֹה
  choice: நடந்து அழுதுகொண்டே சென்றான்
  rationale: இக்கட்டமைப்பு நீடித்துச் செல்லும் செயலைச் சித்தரிக்கிறது; இயல்பான தமிழில் தொடர்ச்சியான நடையையும் அழுகையையும் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: אַחֲרֶיהָ
  choice: அவளுக்குப் பின்னால்
  rationale: அவளைப் பின்தொடர்ந்து சென்ற இடநிலையைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது; ‘அவளைத் தொடர்ந்து’ என்பதும் சாத்தியம்.
- source_word: עַד בַּחֻרִים
  choice: பகூரிம் வரைக்கும்
  rationale: עַד இடப்பெயருடன் பயணத்தின் எல்லையை அல்லது சென்றடைந்த அளவைச் சுட்டுகிறது.
- source_word: בַּחֻרִים
  choice: பகூரிம்
  rationale: இது இடப்பெயர்; ஆகவே தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לֵךְ שׁוּב
  choice: போ, திரும்பிப்போ
  rationale: எபிரெயத்தில் உள்ள இரண்டு கட்டளைகளையும் தக்கவைத்து, வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיָּשֹׁב
  choice: அவனும் திரும்பிப்போனான்
  rationale: கட்டளைக்குப் பதிலாக நிகழ்ந்த அடுத்த செயலை இயல்பான தமிழ் கதைநடையில் தெரிவிக்கிறது.
