  source_fidelity: 'முதன்மை உரை எபிரெய மூலத்தின் பொருளைச் சரியாகவே தருகிறது: கணவன் அவளோடு செல்கிறான்; அவளுக்குப் பின்னால் அழுதுகொண்டே பகூரிம் வரை செல்கிறான்; அப்னேர் இரட்டைக் கட்டளையிடுகிறான்; அவன் திரும்புகிறான். ஆனால் [a] அடிக்குறிப்பு, மூலத்தில் உள்ள ‘அவளுக்குப் பின்னால்’ என்பதற்கான மாற்றாக இருந்தும் ‘அவளோடு சென்றான்’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது. இதனால் அந்த இடத்தில் அது மூலத்திற்குப் பொருந்தாத மாற்றுவாசிப்பாகத் தோன்றுகிறது. இரட்டைக் கட்டளையை முதன்மை உரையிலேயே மேலும் வெளிப்படையாகக் காப்பது சிறந்தது.'
