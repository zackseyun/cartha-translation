translation:
  language: ta
  text: இரண்டாவது மகன் கிலேயாப்; கர்மேலியனான நாபாலின் மனைவி அபிகாயிலுக்குப் பிறந்தவன். மூன்றாவது மகன் அப்சலோம்; கேஷூரின் அரசன் தல்மாயின் மகளான மாக்காளுக்குப் பிறந்தவன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁנֵהוּ
  choice: இரண்டாவது மகன்
  rationale: சூழலில் தாவீதின் மகன்கள் வரிசைப்படுத்தப்படுவதால், எபிரெயச் சொல்லின் ‘அவனுடைய இரண்டாவது’ என்ற பொருளை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: כִלְאָב
  choice: கிலேயாப்
  rationale: எபிரெயப் பெயரின் ஒலிப்பை நெருக்கமாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: הַכַּרְמְלִי
  choice: கர்மேலைச் சேர்ந்த
  rationale: இது கர்மேல் என்ற இடத்தைச் சார்ந்தவர் என்பதைக் குறிக்கிறது; சாதாரண தமிழில் இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: גְּשׁוּר
  choice: கேசூர்
  rationale: எபிரெய இடப்பெயரின் ஒலிப்பைத் தமிழில் நெருக்கமாகக் கொடுக்கிறது.
theological_decisions:
- issue: அபிகாயிலை ‘நாபாலின் மனைவி’ என்று குறிப்பிடுதல்
  choice: ‘நாபாலின் மனைவியாக இருந்த அபிகாயில்’
  alternative: ‘நாபாலின் மனைவி அபிகாயில்’
  rationale: எபிரெய மூலத்தின் அடையாளக் குறிப்பைப் பாதுகாக்கும் அதேவேளை, இந்நேரத்தில் அபிகாயில் தாவீதின் மனைவியாக இருப்பதால் தமிழில் ஏற்படக்கூடிய தவறான காலப் பொருளைத் தவிர்க்கிறது; புதிய கோட்பாட்டு விளக்கம் எதையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. மூலத்தின் வம்சவரிசை அமைப்பு இரண்டு தெளிவான வாக்கியங்களாக வழங்கப்பட்டுள்ளது.
