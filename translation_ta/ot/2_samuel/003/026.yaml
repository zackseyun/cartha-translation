base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/026.yaml
  text: Then Joab went out from David and sent messengers after Abner[a], and they brought him back from the well of Sirah. But David did not know it.
translation:
  language: ta
  text: யோவாப் தாவீதிடமிருந்து புறப்பட்டுச் சென்று, அப்னேரைப் பின்தொடர்ந்து தூதர்களை அனுப்பினான். அவர்கள் அவனை சீராவின் கிணற்றிலிருந்து[a] திரும்ப அழைத்து வந்தார்கள். ஆனால் தாவீதுக்கு இது தெரியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, எபிரேயச் சொற்றொடரை ‘சீராவின் கிணறு’ என்று அல்லாமல் ஓர் இடப்பெயராகக் கொண்டு, ‘போர்-சீராவிலிருந்து’ என மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: புறப்பட்டுச் சென்று
  rationale: יצא என்ற வினை இங்கு தாவீதின் முன்னிலையிலிருந்து வெளியேறிச் செல்வதைக் குறிக்கிறது; நவீன தமிழில் இயல்பான கதைநடையாக இவ்வாறு தரப்பட்டுள்ளது.
- source_word: מֵעִם דָּוִד
  choice: தாவீதிடமிருந்து
  rationale: עִם உடன் வரும் מן முன்னொட்டு, ஒருவருடன் இருந்த நிலையிலிருந்து விலகிச் செல்வதைச் சுட்டுகிறது; ‘தாவீதிடமிருந்து’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: מַלְאָכִים
  choice: தூதர்களை
  rationale: இச்சூழலில் מלאכים என்பது மனிதத் தகவலாளர்கள் அல்லது அனுப்பப்பட்ட ஆட்களைக் குறிக்கிறது; ‘தூதர்கள்’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: אַחֲרֵי אַבְנֵר
  choice: அப்னேருக்குப் பின்னால்
  rationale: אַחֲרֵי இங்கு பின்தொடர்தல் அல்லது தொடர்ந்து செல்லுதல் என்ற பொருளைக் கொண்டது; மூலத்தின் அமைப்பையும் நோக்கத்தையும் இது பாதுகாக்கிறது.
- source_word: וַיָּשִׁבוּ אֹתוֹ
  choice: அவனைத் திரும்ப அழைத்து வந்தார்கள்
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளைக் கொண்டது; அப்னேரைத் திரும்பச் செய்தார்கள் என்பதைக் ‘திரும்ப அழைத்து வந்தார்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִבּוֹר הַסִּרָה
  choice: சீராவின் கிணற்றிலிருந்து
  rationale: בּוֹר என்பது குழி, நீர்த்தொட்டி அல்லது கிணறு எனப் பொருள்படலாம். இங்கு இடத்தைக் குறிக்கும் தொடரில் ‘சீராவின் கிணறு’ இயல்பான மொழிபெயர்ப்பு; மாற்று இடப்பெயர் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְדָוִד לֹא יָדָע
  choice: ஆனால் இது தாவீதுக்குத் தெரியாது
  rationale: וְ இங்கு நிகழ்வுக்கும் தாவீதின் அறியாமைக்கும் உள்ள மாறுபாட்டை இயல்பாகக் காட்ட ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது; மறைபொருளான நிகழ்வு தமிழில் ‘இது’ என வெளிப்படுத்தப்பட்டுள்ளது.
