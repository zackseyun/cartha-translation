translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்கவும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதாகவும் வடிவமைக்கப்பட்டது. கதைநடையின் தொடர்ச்சியும், தாவீதின் அறியாமையை வலியுறுத்தும் இறுதி மாறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
