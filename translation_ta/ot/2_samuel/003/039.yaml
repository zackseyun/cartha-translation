base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/039.yaml
  text: And I am still weak today[a], though anointed king; and these men, the sons of Zeruiah, are too harsh for me[b]. May Yahweh repay the evildoer according to his evil.
translation:
  language: ta
  text: நானோ இன்று இன்னும் வலிமையற்றவனாக இருக்கிறேன்[a]; அபிஷேகம் பெற்ற அரசனாக இருந்தும் அப்படியே இருக்கிறேன். செருயாவின் மகன்களான இவர்கள் எனக்கு மிகவும் கடுமையானவர்கள். தீமை செய்கிறவனுக்கு அவனுடைய தீமைக்கேற்ப யாவே கைம்மாறு செய்வாராக[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் இன்று இன்னும் மென்மையானவனாக இருக்கிறேன்.” רַךְ என்ற எபிரெயச் சொல் “மென்மையானவன்” அல்லது “மிருதுவானவன்” என்றும், இந்தச் சூழலில் “வலிமையற்றவன்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தீமை செய்கிறவனுக்கு அவனுடைய தீமைக்கேற்ப யாவே கைம்மாறு செய்வார்.” எபிரெய வினைச்சொல்லை எளிய எதிர்காலக் கூற்றாகவும் வாசிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: רַךְ
  choice: வலிமையற்றவன்
  rationale: இந்தச் சூழலில் இந்தச் சொல் தாவீதின் மென்மையான குணத்தை அல்ல, செருயாவின் மக்களைக் கட்டுப்படுத்த இயலாத அவரது அரசியல் மற்றும் நடைமுறை வலிமையின்மையைக் குறிக்கிறது. ‘வலிமையற்றவன்’ என்பது நவீனத் தமிழில் இதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וּמָשׁוּחַ מֶלֶךְ
  choice: அபிஷேகம் செய்யப்பட்ட அரசனாக இருந்தும்
  rationale: எபிரெய வாக்கியத்தில் வினைச்சொல் இல்லாவிட்டாலும், அரசனாக அபிஷேகம் செய்யப்பட்ட நிலைக்கும் தற்போதைய வலிமையின்மைக்கும் இடையிலான முரண்பாட்டை ‘இருந்தும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי צְרוּיָה
  choice: செருயாவின் மகன்கள்
  rationale: யோவாபையும் அவரது சகோதரர்களையும் குறிக்கும் எபிரெயக் குடும்ப அடையாளத்தை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: קָשִׁים מִמֶּנִּי
  choice: என்னால் சமாளிக்க முடியாத அளவுக்குக் கடுமையானவர்கள்
  rationale: קָשִׁים என்பது கடினம், கடுமை, வலிமை ஆகிய நிழற்பொருள்களைக் கொண்டது; מִמֶּנִּי உடன் இங்கு அவர்களின் இரக்கமற்ற கடுமையையும் அவர்களைக் கட்டுப்படுத்தத் தாவீதுக்கு இயலாத நிலையையும் சேர்த்துக் காட்டுகிறது.
- source_word: יְשַׁלֵּם
  choice: பதிலளிப்பாராக
  rationale: இச்சூழலில் imperfect வடிவம் வேண்டுதல் அல்லது நீதித் தீர்ப்புக்கான விண்ணப்பமாகப் புரிந்துகொள்ளப்படலாம். ‘பதிலளிப்பாராக’ தீமைக்கு ஏற்ற தெய்வீகக் கைம்மாற்றத்தைக் குறிக்கிறது; சாதாரண எதிர்கால வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதாகமத்தில் உள்ள தனிப்பட்ட இறைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לְעֹשֵׂה הָרָעָה
  choice: தீமை செய்கிறவன்
  rationale: எபிரெயப் பங்கேற்புச் சொல்லின் தொடர்ச்சியான செய்பவர் என்ற பொருளை எளிய, இயல்பான தமிழில் தருகிறது.
- source_word: כְּרָעָתוֹ
  choice: அவனுடைய தீமைக்கேற்ப
  rationale: செய்த தீமைக்கு ஒத்த அளவில் கிடைக்கும் கைம்மாற்றம் என்ற பொருளை, ‘தீய செயல்’ என்று தேவையின்றி குறிப்பாக்காமல் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கு எழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதைத் தமிழில் ‘யாவே’ என்று ஒலிபெயர்ப்பது பெயருக்கும் பட்டப்பெயருக்கும் உள்ள வேறுபாட்டைக் காக்கிறது.
- issue: தாவீதின் இறுதி கூற்றின் இலக்கண வலிமை
  choice: 'வேண்டுதல்: ‘யாவே பதிலளிப்பாராக’'
  alternative: 'எதிர்கால உறுதி: ‘யாவே பதிலளிப்பார்’'
  rationale: சூழலில் தாவீது பழிவாங்குதலைத் தன் கையில் எடுக்காமல் கடவுளின் நீதிக்கு ஒப்படைக்கிறார்; ஆகவே வேண்டுதல் வாசிப்பு இயல்பானது. எனினும் எபிரெய imperfect வடிவத்தை எளிய எதிர்காலமாகவும் வாசிக்க முடிவதால் அந்த வாய்ப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘அபிஷேகம்’ என்பது வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட சொல் என்பதால் வைக்கப்பட்டுள்ளது. எபிரெயத்தின் சுருக்கமான வாக்கிய அமைப்பு தமிழில் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
