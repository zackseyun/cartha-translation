base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/013.yaml
  text: 'He said[a], “Good. I will make a covenant with you. Only one thing I ask of you: You shall not see my face unless you first bring Michal, Saul’s daughter, when you come to see my face.”'
translation:
  language: ta
  text: 'அவன் சொன்னான்: “நல்லது. நான் உன்னோடு ஓர் உடன்படிக்கை செய்வேன். ஆனால் உன்னிடம் நான் கேட்பது ஒன்றே: சவுலின் மகள் மீகாளை முதலில் அழைத்துவராவிட்டால், நீ என் முகத்தைக் காண வரும்போது என் முகத்தைக் காணமாட்டாய்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சவுலின் மகள் மீகாளை முதலில் அழைத்துவராவிட்டால், நீ என் முன்னிலையில் தோன்றமாட்டாய்.” எபிரெயத்தில் சொல்லுக்குச் சொல், “என் முகத்தைக் காணுதல்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: நல்லது
  rationale: அப்னேரின் முன்மொழிவுக்கு அளிக்கப்படும் சுருக்கமான ஒப்புதலை எபிரெய மொழியின் சுருக்கத்தோடு காக்கிறது.
- source_word: אֶכְרֹת ... בְּרִית
  choice: ஓர் உடன்படிக்கை செய்வேன்
  rationale: சொல்லுக்குச் சொல் ‘உடன்படிக்கையை வெட்டுவேன்’ என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில், அதன் முறையான உடன்படிக்கைத் தன்மையைத் தளர்த்தாமல் தருகிறது.
- source_word: אַךְ דָּבָר אֶחָד אָנֹכִי שֹׁאֵל מֵאִתְּךָ
  choice: ஆனால் உன்னிடம் நான் கேட்பது ஒன்றே
  rationale: ஒற்றை நிபந்தனையை வலியுறுத்தும் கட்டுப்படுத்தும் பொருளையும் கோரிக்கையின் நேரடியான தொனியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא תִרְאֶה אֶת פָּנַי
  choice: என் முகத்தைக் காணமாட்டாய்
  rationale: ‘என் முகத்தைக் காணுதல்’ என்ற எபிரெய சொற்றொடரைப் பாதுகாக்கிறது; இது தாவீதின் முன்னிலையில் நேரில் வருதல் அல்லது அவரைச் சந்தித்தல் என்ற அரண்மனைச் சூழல் நுணுக்கத்தையும் கொண்டிருக்கலாம்.
- source_word: כִּי אִם לִפְנֵי הֱבִיאֲךָ
  choice: முதலில் அழைத்துவராவிட்டால்
  rationale: மீகாளை முன்கூட்டியே கொண்டுவருவது சந்திப்புக்கான நிபந்தனை என்பதை இயல்பான எதிர்மறை நிபந்தனை வடிவில் தெளிவாக்குகிறது.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: சவுலின் மகள் மீகாள்
  rationale: எபிரெய அடையாளப்படுத்தலைத் தெளிவான தமிழ் பெயரெச்சத் தொடராக வழங்குகிறது.
- source_word: בְּבֹאֲךָ לִרְאוֹת אֶת פָּנָי
  choice: நீ என்னைக் காண வரும்போது
  rationale: வருகையின் நோக்கத்தை இயல்பான தமிழில் தருகிறது; முந்தைய ‘என் முகம்’ என்ற மரபுத்தொடரின் மீள்வருகையை இங்கு சற்றே இயல்பாக்கினாலும் அதன் பொருளை மாற்றவில்லை.
