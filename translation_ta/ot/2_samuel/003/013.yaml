translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. உடன்படிக்கை மொழியின் முறையான தன்மை காக்கப்பட்டுள்ளது. ‘என் முகத்தைக் காணுதல்’ என்ற மூலமொழி மரபுத்தொடர் பிரதான உரையில் ஒருமுறை காக்கப்பட்டு, ‘என் முன்னிலையில் தோன்றுதல்’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
