base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/032.yaml
  text: They buried Abner in Hebron[a], and the king lifted up his voice and wept at Abner’s grave, and all the people wept.
translation:
  language: ta
  text: அப்னேரை எப்ரோனில் அடக்கம் செய்தார்கள். அரசன் தன் குரலை உயர்த்தி, அப்னேரின் கல்லறையருகே[a] அழுதான்; மக்கள் அனைவரும் அழுதார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அப்னேரின் கல்லறையை நோக்கி.’ எபிரேய முன்னிடைச்சொல்லை இவ்வாறு இன்னும் நேரடியாக மொழிபெயர்க்கலாம்; ஆனால் சூழலில் ‘கல்லறையருகே’ என்பது இயல்பான பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  choice: அடக்கம் செய்தார்கள்
  rationale: קבר என்பதன் Qal wayyiqtol 3mp வடிவம்; தொடர்ச்சியான இறந்தகால நிகழ்வை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: בְּחֶבְרוֹן
  choice: எப்ரோனில்
  rationale: בְּ இங்கு இடத்தைக் குறிக்கிறது; நகரத்திற்குள் நிகழ்ந்த அடக்கத்துக்கு ‘எப்ரோனில்’ இயல்பானது.
- source_word: וַיִּשָּׂא ... אֶת־קוֹלוֹ
  choice: தன் குரலை உயர்த்தி
  rationale: உரத்த புலம்பலைக் குறிக்கும் எபிரேய மரபுத்தொடரின் இலக்கியத் தன்மையைத் தக்கவைக்கிறது.
- source_word: וַיֵּבְךְּ
  choice: அழுதான்
  rationale: בכה இறுதிச்சடங்கின் சூழலில் அழுதல் அல்லது கண்ணீர் வடித்தலைக் குறிக்கிறது; அரசனைக் குறிக்கும் ஒருமை ஆண்பால் வினை வடிவம் தமிழில் வெளிப்படுத்தப்படுகிறது.
- source_word: אֶל־קֶבֶר אַבְנֵר
  choice: அப்னேரின் கல்லறையருகே[a]
  rationale: אֶל பொதுவாக ‘நோக்கி’ எனப் பொருள்படலாம்; ஆனால் இச்சூழலில் அழுகை நடந்த இடத் தொடர்பை ‘கல்லறையருகே’ இயல்பாகத் தெரிவிக்கிறது. திசை சார்ந்த நேரடியான வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּבְכּוּ כָּל־הָעָם
  choice: மக்கள் அனைவரும் அழுதார்கள்
  rationale: மீண்டும் வரும் בכה என்பதைக் ‘அழுதார்கள்’ என்று ஒரே சீரில் தருகிறது; כָּל־הָעָם கூடியிருந்த மக்கள் அனைவரையும் குறிக்கிறது.
