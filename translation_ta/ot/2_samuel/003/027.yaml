base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/027.yaml
  text: When Abner returned to Hebron[a], Joab drew him aside into the middle of the gate to speak with him privately, and there he struck him in the belly, so that he died, for the blood of Asahel his brother.
translation:
  language: ta
  text: அப்னேர் எப்ரோனுக்குத் திரும்பி வந்தபோது, யோவாப் அவருடன் தனியாகப் பேசுவதற்காக அவரை நகரவாசலின் நடுப்பகுதிக்கு ஓரமாக அழைத்தான். அங்கே அவன் அப்னேரின் வயிற்றில்[a] தாக்கினான்; யோவாபின் சகோதரனான அசகேலின் இரத்தத்திற்காக அப்னேர் இறந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஐந்தாவது விலா எலும்பில்” என்பது மரபுவழி மொழிபெயர்ப்பு; இது வயிறு அல்லது அடிவயிற்றுப் பகுதியைக் குறிக்கும் சொல்லாட்சியாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பி வந்தபோது
  rationale: שׁוב என்பது இச்சூழலில் முன்னர் அனுப்பிவைக்கப்பட்ட அப்னேர் எப்ரோனுக்குத் திரும்பி வந்ததை இயல்பாகக் குறிக்கிறது.
- source_word: וַיַּטֵּהוּ
  choice: ஒதுக்கமாக அழைத்துச் சென்றான்
  rationale: נטה என்பதன் ஹிஃபில் வடிவம் ஒருவரை வழியிலிருந்து விலக்கி ஓரிடத்துக்கு அழைத்துச் செல்வதைக் குறிக்கிறது; தமிழில் இத்தொடர் அந்த இயக்கத்தையும் தனிமைப்படுத்துதலையும் தெரிவிக்கிறது.
- source_word: אֶל־תּוֹךְ הַשַּׁעַר
  choice: நகரவாசலின் நடுப்பகுதிக்கு
  rationale: תוך என்பது நடுப்பகுதி அல்லது உட்பகுதியையும், שער என்பது நகரவாசல் அமைப்பையும் குறிக்கலாம்; இம்மொழிபெயர்ப்பு இரண்டையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לְדַבֵּר אִתּוֹ בַּשֶּׁלִי
  choice: அவருடன் தனியாகப் பேசுவதற்காக
  rationale: בשלי என்பது அரிதானதும் பொருள் உறுதியற்றதுமான சொல்லாகும்; அமைதி, தனிமை அல்லது இடையூறற்ற பேச்சு என்ற சூழல்சார்ந்த பொருளை ‘தனியாக’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיַּכֵּהוּ שָׁם הַחֹמֶשׁ
  choice: அங்கே அவன் அப்னேரின் அடிவயிற்றில் குத்தினான்
  rationale: חֹמֶשׁ மரணத்தை விளைவிக்கும் வயிற்றுப்பகுதி அல்லது அடிவயிற்றைக் குறிக்கும் பழமொழிவழக்காகத் தெரிகிறது. தாக்குதலின் சூழலில் ‘குத்தினான்’ இயல்பான தமிழாக உள்ளது; மரபுவழி மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיָּמָת
  choice: அப்னேர் இறந்துபோனார்
  rationale: தொடர்ச்சியாக நிகழ்ந்த மரணத்தைத் தெளிவான தமிழில் கூறுகிறது; குழப்பத்தைத் தவிர்க்க எழுவாய் மீண்டும் குறிப்பிடப்பட்டுள்ளது.
- source_word: בְּדַם עֲשָׂהאֵל אָחִיו
  choice: தன் சகோதரன் அசகேலின் இரத்தத்திற்காக
  rationale: ב இங்கு காரணம் அல்லது பழிவாங்கும் நோக்கத்தைக் குறிக்கிறது. ‘இரத்தத்திற்காக’ என்பது மூலத்தின் சுருக்கமான சட்ட-பழிவாங்கல் நிழற்பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: அசகேலின் இரத்தத்திற்கான தாக்குதலின் நோக்கம்
  choice: ‘தன் சகோதரன் அசகேலின் இரத்தத்திற்காக’ என்று மூலத்தின் காரணத்தொடரை நேரடியாக வைத்தல்
  alternative: ‘தன் சகோதரன் அசகேலைக் கொன்றதற்குப் பழிவாங்க’ என்று வெளிப்படையாக விளக்குதல்
  rationale: சூழலில் பழிவாங்குதல் தெளிவாக இருந்தாலும், மூல எபிரெயம் ‘இரத்தத்திற்காக’ என்ற சுருக்கமான வடிவையே கொண்டுள்ளது; அதிலுள்ள சட்ட மற்றும் இரத்தப்பழி நிழற்பொருளை விளக்கி முடிவுசெய்யாமல் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அப்னேரைப் பற்றிய குறிப்புகளில் மரியாதைப் பன்மையும், யோவாபின் செயலை விவரிக்க ஒருமையும் பயன்படுத்தப்பட்டுள்ளன. கடினமான בשלי என்பதிலுள்ள தெளிவின்மை அளவுக்கு மீறி விளக்கப்படாமல் ‘தனியாக’ எனச் சூழலுக்கு ஏற்றவாறு தரப்பட்டுள்ளது.
