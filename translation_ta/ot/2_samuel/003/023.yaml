base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/023.yaml
  text: When Joab and all the army that was with him arrived, they told Joab, saying, “Abner son of Ner came to the king, and he sent him away, and he went in peace.”
translation:
  language: ta
  text: யோவாபும் அவனோடு இருந்த படையினர் அனைவரும் வந்தபோது, அவர்கள் யோவாபிடம், “நேரின் மகன் அப்னேர் அரசரிடம் வந்தார்; அரசர் அவரை அனுப்பிவிட்டார்; அவர் சமாதானமாகச் சென்றார்” என்று தெரிவித்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצָּבָא
  choice: படை முழுவதும்
  rationale: இங்கு வரும் குறிப்பிட்ட படையை இயல்பான நவீனத் தமிழில் குறிக்கிறது; כָּל என்பதையும் வெளிப்படையாகப் பேணுகிறது.
- source_word: בָּאוּ
  choice: திரும்பி வந்தபோது
  rationale: பன்மை வினையையும், முந்தைய போர்ப்பயணத்திலிருந்து யோவாபும் படையும் வந்த கதைச் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיְשַׁלְּחֵהוּ
  choice: அரசர் அவரை அனுப்பிவிட்டார்
  rationale: 'எபிரெயச் சுட்டுப்பெயர்களின் சார்பைச் சூழலின்படி தெளிவாக்குகிறது: அரசர் அப்னேரை அனுப்பினார்.'
- source_word: בְּשָׁלוֹם
  choice: சமாதானத்துடன்
  rationale: பாதுகாப்பாக அனுப்பப்பட்டமை, நல்லுறவு, அமைதி ஆகிய நிழற்பொருள்களைத் திறந்தவாறே வைத்திருக்கிறது.
