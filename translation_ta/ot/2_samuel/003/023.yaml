translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வரலாற்று உரைநடை. எபிரெய மூலத்தின் தொடர்ச்சியான அறிக்கை அமைப்பு தமிழில் வாசிக்கத்தக்கவாறு நிறுத்தக்குறிகளால் தெளிவாக்கப்பட்டது; தேவையற்ற இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
