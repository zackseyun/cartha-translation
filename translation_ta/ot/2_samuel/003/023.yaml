revisions:
- from: யோவாபும் அவனோடு இருந்த படை முழுவதும் திரும்பி வந்தபோது, யோவாபிடம், “நேரின் மகன் அப்னேர் அரசரிடம் வந்தார்; அரசர் அவரை அனுப்பிவிட்டார்; அவர் சமாதானத்துடன் சென்றுவிட்டார்” என்று தெரிவித்தார்கள்.
  to: யோவாபும் அவனோடு இருந்த படையினர் அனைவரும் வந்தபோது, அவர்கள் யோவாபிடம், “நேரின் மகன் அப்னேர் அரசரிடம் வந்தார்; அரசர் அவரை அனுப்பிவிட்டார்; அவர் சமாதானமாகச் சென்றார்” என்று தெரிவித்தார்கள்.
  rationale: The revision removes the unsupported implication that the force returned, makes the plural reporting subject explicit, and preserves the source’s sequence and the deliberately broad sense of “went in peace.”
