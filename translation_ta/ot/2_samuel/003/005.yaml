base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/005.yaml
  text: and the sixth[a], Ithream, by Eglah, David’s wife. These were born to David in Hebron.
translation:
  language: ta
  text: ஆறாவது மகன், தாவீதின் மனைவியான[a] எக்லாளுக்குப் பிறந்த இத்திரேயாம். இவர்கள் தாவீதுக்கு எபிரோனில் பிறந்தவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தாவீதின் மனைவி.’ எபிரேயச் சொற்றொடர் சொல்லுக்கு சொல் இவ்வாறே உள்ளது; சூழலில் எக்லாள் தாவீதின் மனைவிகளில் ஒருவர் என்பதையே இது குறிக்கிறது; அவர் மட்டுமே தாவீதின் மனைவி என்று அவசியமாகக் குறிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשִּׁשִּׁי
  choice: ஆறாவது மகன்
  rationale: இது முந்தைய வசனங்களில் தொடங்கிய தாவீதின் மகன்களுடைய பட்டியலைத் தொடர்கிறது. தமிழில் தனித்து வரும் வரிசை எண்ணை இயல்பாகப் புரிந்துகொள்ள ‘மகன்’ என்பது சூழலிலிருந்து வெளிப்படையாகச் சேர்க்கப்பட்டது.
- source_word: יִתְרְעָם
  choice: இத்திரேயாம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை தெளிவாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: לְעֶגְלָה
  choice: எக்லாளுக்குப் பிறந்த
  rationale: இந்தப் பிறப்புப் பட்டியல் அமைப்பில் לְ தாயைச் சுட்டுகிறது. தமிழில் தாய்வழி உறவை இயல்பாகக் காட்ட ‘எக்லாளுக்குப் பிறந்த’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: אֵשֶׁת דָּוִד
  choice: தாவீதின் மனைவியான
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான பொருள் ‘தாவீதின் மனைவி.’ தமிழில் பெயருடன் இயல்பாக இணைக்க இவ்வடிவம் பயன்படுத்தப்பட்டது; இது அவர் ஒரே மனைவி என்று கட்டாயமாகக் கூறுவதில்லை.
- source_word: אֵלֶּה
  choice: இவர்கள்
  rationale: முன்னதாகப் பட்டியலிடப்பட்ட மக்களைக் குறிக்கும் சுட்டுப்பெயர்; மனிதர்களைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: יֻלְּדוּ
  choice: பிறந்தவர்கள்
  rationale: ילד வினையின் இந்தப் புறப்பாட்டு வடிவம் வம்சப் பட்டியல் சூழலில் ‘பிறந்தார்கள்’ என்ற எளிய பொருளைத் தருகிறது.
- source_word: לְדָוִד
  choice: தாவீதுக்கு
  rationale: 'வம்சப் பதிவு வழக்கில் לְ பெற்றோர் உறவைச் சுட்டுகிறது: இவர்கள் தாவீதுக்கு மகன்களாகப் பிறந்தவர்கள்.'
- source_word: בְּחֶבְרוֹן
  choice: எப்ரோனில்
  rationale: בְּ இடத்தைக் குறிக்கிறது; பிறப்புகள் நிகழ்ந்த இடம் எப்ரோன்.
theological_decisions:
- issue: ‘தாவீதின் மனைவி’ என்ற சொற்றொடர் எக்லாள் மட்டுமே தாவீதின் மனைவி என்று பொருள்படுமா?
  choice: தாவீதின் மனைவியான
  alternative: தாவீதின் மனைவிகளில் ஒருவரான
  rationale: மூல எபிரெயத்தில் ‘ஒருவர்’ என்று வெளிப்படையாக இல்லை. ஆகவே அதை முதன்மை உரையில் சேர்க்காமல், பல மனைவிகள் இருந்த சூழலை அடிக்குறிப்பில் விளக்குவது மூலத்தின் வடிவத்தையும் சூழலையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. எபிரெய வாக்கியத்தின் பட்டியல் தன்மை காக்கப்பட்டாலும், தமிழில் பொருள் தெளிவாக இருக்க ‘மகன்’ சூழலடிப்படையில் சேர்க்கப்பட்டது.
