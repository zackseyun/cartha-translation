  text: וַ/יִּשְׁמַ֤ע דָּוִד֙ מֵ/אַ֣חֲרֵי כֵ֔ן וַ/יֹּ֗אמֶר נָקִ֨י אָנֹכִ֧י וּ/מַמְלַכְתִּ֛/י מֵ/עִ֥ם יְהוָ֖ה עַד עוֹלָ֑ם מִ/דְּמֵ֖י אַבְנֵ֥ר בֶּן נֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/028.yaml
  text: Afterward[a], when David heard of it, he said[b], “I and my kingdom are forever innocent before Yahweh of the blood of Abner son of Ner.”
translation:
  language: ta
  text: அதற்குப் பிறகு[a] தாவீது இதைக் கேள்விப்பட்டபோது, “நேரின் மகன் அப்னேரின் இரத்தப்பழிக்கு[b] நானும் என் அரசாட்சியும் யாவேக்கு முன்பாக என்றென்றும் குற்றமற்றவர்கள்” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இதற்குப் பிறகு” அல்லது “பின்னர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அப்னேரின் இரத்தங்களிலிருந்து.” இது அப்னேரின் இரத்தம் சிந்தப்பட்டதற்கான குற்றப்பொறுப்பைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחֲרֵי כֵן
  choice: அதற்குப் பிறகு
  rationale: முந்தைய நிகழ்வுக்குப் பிந்தைய காலத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் தொடர்.
- source_word: וַיִּשְׁמַע
  choice: தாவீது இதைக் கேள்விப்பட்டபோது
  rationale: ‘கேட்டான்’ என்பதே அடிப்படைப் பொருள்; சூழலில் முன் கூறப்பட்ட நிகழ்வைச் சுட்ட ‘இதை’ சேர்ப்பது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: נָקִי
  choice: குற்றமற்றவர்கள்
  rationale: சட்ட மற்றும் அறநெறிசார் பொறுப்பிலிருந்து விடுபட்டிருப்பதைக் குறிக்கிறது; தாவீதையும் அவரது அரசையும் இணைத்த பன்மை எழுவாய்க்கேற்ப பன்மை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אָנֹכִי וּמַמְלַכְתִּי
  choice: நானும் என் அரசும்
  rationale: தாவீதின் தனிப்பட்ட நிலையும் அவருக்குட்பட்ட அரசாட்சியும் இணைந்து மறுப்புத் தெரிவிப்பதைப் பிரதிபலிக்கிறது.
- source_word: מֵעִם יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: யாவே சாட்சியும் நீதிபதியுமாக இருக்க, அவருடைய முன்னிலையில் குற்றமற்றவர் என்ற நீதிமன்றச் சார்ந்த நுண்பொருளைப் பாதுகாக்கிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: அறிக்கையின் நிலையான, காலவரையற்ற வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: מִדְּמֵי
  choice: இரத்தப்பழிக்கு
  rationale: எபிரெய மொழியின் பன்மை ‘இரத்தங்கள்’ கொலைக்கான குற்றப்பொறுப்பைக் குறிக்கும் மரபுத்தொடர்; தமிழில் ‘இரத்தப்பழி’ அதே சட்ட-அறநெறி பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: אַבְנֵר בֶּן נֵר
  choice: நேரின் மகன் அப்னேர்
  rationale: எபிரெய தந்தைவழி அடையாளத்தை இயல்பான தமிழ்ச் சொல் வரிசையில் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரான நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது; பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: தாவீதின் குற்றமின்மை அறிவிப்பின் எல்லை
  choice: அப்னேரின் கொலைக்கான இரத்தப்பழியில் தானும் தன் அரசும் குற்றமற்றவை எனத் தாவீது அறிவிக்கிறார்
  alternative: தாவீதும் அவரது வம்சமும் எல்லா வகையிலும் குற்றமற்றவை என்ற பொதுவான கூற்று
  rationale: מִדְּמֵי אַבְנֵר என்ற வரையறை இக்கூற்றை அப்னேரின் இரத்தச்சிந்துதலுக்கான பொறுப்போடு குறிப்பாக இணைக்கிறது; வசனம் கூற்றின் உண்மைத்தன்மையைத் தீர்ப்பளிக்காமல் தாவீதின் சொற்களாகவே பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான வரலாற்று-அறிக்கை நடை பயன்படுத்தப்பட்டது. ‘இரத்தப்பழி’ என்ற வழக்குச் சொல் மூலத்தின் சட்ட மற்றும் அறநெறிசார் பொருளைத் தக்கவைக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
