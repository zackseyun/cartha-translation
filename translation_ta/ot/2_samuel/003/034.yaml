base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/034.yaml
  text: Your hands were not bound[a], and your feet were not put into bronze fetters; as one falls before sons of injustice, so you have fallen. And all the people wept over him even more.
translation:
  language: ta
  text: '“உன் கைகள் கட்டப்படவில்லை;

    உன் கால்கள் வெண்கலக் கால் விலங்குகளில் மாட்டப்படவில்லை.

    தீயவர்களின் முன் ஒருவன் வீழ்வதுபோல்,

    நீ வீழ்ந்தாயே!”


    மக்கள் அனைவரும் அவனுக்காக மேலும் அதிகமாக அழுதார்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדֶךָ לֹא אֲסֻרוֹת
  choice: உன் கைகள் கட்டப்படவில்லை
  rationale: אָסַר என்பதன் செயப்பாட்டு வடிவம் கட்டப்பட்டிருப்பதைக் குறிக்கிறது. கைதியைப் போல அப்னேரின் கைகள் கட்டப்பட்டிருக்கவில்லை என்ற புலம்பலின் எதிர்மறை ஒப்பீட்டை இயல்பாகத் தருகிறது.
- source_word: וְרַגְלֶיךָ לֹא לִנְחֻשְׁתַּיִם הֻגָּשׁוּ
  choice: உன் கால்கள் வெண்கல விலங்குகளில் மாட்டப்படவில்லை
  rationale: נְחֻשְׁתַּיִם வெண்கலம் அல்லது செம்பினால் செய்யப்பட்ட கால் விலங்குகளைக் குறிக்கிறது. הֻגָּשׁוּ என்பதன் சொற்பொருள் ‘அருகே கொண்டுவரப்பட்டன’ என்றாலும், இங்கு விலங்குகளில் மாட்டப்படுதலைக் குறிக்கும் மரபுத்தொடராக உள்ளது.
- source_word: כִּנְפוֹל
  choice: ஒருவன் வீழ்வதுபோல்
  rationale: כְּ முன்னொட்டுடன் வரும் வினையெச்சம் ஓர் ஒப்பீட்டை உருவாக்குகிறது. தமிழில் பொதுவான நபரைக் குறிக்கும் ‘ஒருவன்’ என்பதைக் குறிப்பிடுவது பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי בְנֵי עַוְלָה
  choice: அநீதியின் மக்களுக்கு முன்பாக
  rationale: ‘அநீதியின் மகன்கள்’ என்ற எபிரெய மரபுத்தொடர் அநியாயம் அல்லது தீமை செய்பவர்களைக் குறிக்கிறது. மூலத்தின் உருவக அமைப்பைத் தக்கவைத்தபடி, தமிழில் ‘மக்கள்’ எனப் பொதுப்படையாக வழங்கப்பட்டுள்ளது; இயல்பான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: נָפָלְתָּ
  choice: நீ வீழ்ந்தாயே
  rationale: நிறைவுற்ற துயர நிகழ்வை நேரடியாகச் சுட்டும் வினை. ‘-ஆயே’ என்னும் வடிவம் தாவீதின் புலம்பல் தொனியை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத காரணவிளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: וַיֹּסִפוּ כָל הָעָם לִבְכּוֹת עָלָיו
  choice: அப்போது மக்கள் அனைவரும் அவனுக்காக இன்னும் அதிகமாக அழுதார்கள்
  rationale: יָסַף + வினையெச்சம் செயலைத் தொடர்வதையோ அதிகரிப்பதையோ குறிக்கலாம். முந்தைய புலம்பலுக்குப் பின் அழுகை தீவிரமடைந்த சூழலில் ‘இன்னும் அதிகமாக’ என்பது பொருத்தமானது; ‘அப்போது’ தொடர்ச்சியை இயல்பாக்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், புலம்பலுக்குரிய கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. முதல் பகுதியின் இணை அமைப்பும் நேரடி அழைப்பும் வரி பிரிப்பால் வெளிப்படுத்தப்பட்டுள்ளன. ‘வீழ்ந்தாயே’ புலம்பல் உணர்வைத் தருகிறது; மிகப் பழமையான அல்லது சமயப் பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
