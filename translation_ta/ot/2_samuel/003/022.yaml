base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/022.yaml
  text: And behold[a], David’s servants and Joab came in from a raid and brought much plunder with them. But Abner was not with David in Hebron, because he had sent him away[b], and he had gone in peace.
translation:
  language: ta
  text: இதோ[a], தாவீதின் பணியாளர்களும் யோவாபும் ஒரு கொள்ளையடிப்புப் படையெடுப்பிலிருந்து திரும்பிவந்து, ஏராளமான கொள்ளைப்பொருளைத் தங்களுடன் கொண்டுவந்தார்கள். ஆனால் அப்னேர் எப்ரோனில் தாவீதுடன் இருக்கவில்லை; ஏனெனில் தாவீது அவரை அனுப்பிவிட்டிருந்தார், அவரும் சமாதானமாகப் புறப்பட்டுச் சென்றிருந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இதோ’ என்பது கதையில் எதிர்பாராத புதிய நிகழ்வைக் கவனத்துக்குக் கொண்டுவரும் சொல்.
    reason: discourse_feature
  - marker: b
    text: நேரடியாக, ‘சமாதானத்துடன் சென்றார்.’ அவர் பாதுகாப்பாகவும் நல்லுறவுடனும் புறப்பட்டுச் சென்றார் என்பது இதன் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கதையில் திடீரென நிகழும் புதிய காட்சியைக் கவனத்துக்குக் கொண்டுவரும் எபிரெயச் சொல்லின் சுட்டும் வலிமையை இயல்பான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: עַבְדֵי דָוִד
  choice: தாவீதின் பணியாளர்கள்
  rationale: இச்சூழலில் தாவீதின் சேவையிலிருந்த படை அல்லது அரசவைச் சார்ந்தவர்களைக் குறிக்கிறது; அடிமைத்தனத்தைத் தேவையின்றி வலியுறுத்தாமல் மூலச்சொல்லுக்கு நெருக்கமாக உள்ளது.
- source_word: מֵהַגְּדוּד
  choice: ஒரு கொள்ளையடிப்புப் படையெடுப்பிலிருந்து
  rationale: גְּדוּד என்பது படைக்குழுவையோ கொள்ளையிடும் படையெடுப்பையோ குறிக்கலாம். அடுத்ததாகக் கொள்ளைப்பொருள் குறிப்பிடப்படுவதால் இங்கு படையெடுப்பு என்ற நிகழ்வுப் பொருள் சூழலுக்கு ஏற்றது.
- source_word: וְשָׁלָל רָב
  choice: ஏராளமான கொள்ளைப்பொருள்
  rationale: போரிலோ தாக்குதலிலோ கைப்பற்றிய பொருட்களைக் குறிக்கும் இராணுவச் சொல்லைத் தெளிவாக வெளிப்படுத்துகிறது; רָב என்பதன் அளவுப் பொருளையும் காக்கிறது.
- source_word: וְאַבְנֵר אֵינֶנּוּ עִם דָּוִד בְּחֶבְרוֹן
  choice: ஆனால் அப்னேர் எப்ரோனில் தாவீதுடன் இருக்கவில்லை
  rationale: முந்தைய வருகைக்கும் அப்னேரின் இல்லாமைக்கும் உள்ள எதிர்மறைத் தொடர்பை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי שִׁלְּחוֹ
  choice: ஏனெனில் தாவீது அவரை அனுப்பிவிட்டிருந்தார்
  rationale: எபிரெயத்தில் மறைந்திருக்கும் எழுவாய் சூழலின்படி தாவீது. யோவாபின் வருகைக்கு முன் நிகழ்ந்த செயல் என்பதை ‘விட்டிருந்தார்’ தெளிவாக்குகிறது.
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: அவரும் சமாதானமாகப் புறப்பட்டுச் சென்றிருந்தார்
  rationale: בְּשָׁלוֹם என்பது பாதுகாப்பாகவும் நல்லுறவுடனும் அனுப்பப்பட்டதை உள்ளடக்கும் மரபுத்தொடர். ‘சமாதானமாக’ அதன் நேரடியான உருவகத்தைத் தக்கவைக்கிறது; முன்னர் நிகழ்ந்த செயலை வினைவடிவம் காட்டுகிறது.
