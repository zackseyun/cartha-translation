translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ கதையின் உயிரோட்டத்தையும், ‘சமாதானமாக’ எபிரெய மரபுத்தொடரின் வடிவத்தையும் காக்கின்றன. தெளிவுக்காக மறைந்த எழுவாய் ‘தாவீது’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
