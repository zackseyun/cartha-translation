reference: 2 Samuel 3:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/כָל הָ/עָ֣ם הִכִּ֔ירוּ וַ/יִּיטַ֖ב בְּ/עֵֽינֵי/הֶ֑ם כְּ/כֹל֙ אֲשֶׁ֣ר עָשָׂ֣ה הַ/מֶּ֔לֶךְ בְּ/עֵינֵ֥י כָל הָ/עָ֖ם טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/036.yaml
  text: And all the people recognized it[a], and it was good in their eyes; for everything the king did was good in the eyes of all the people.
translation:
  language: ta
  text: மக்கள் அனைவரும் இதை அறிந்துகொண்டார்கள்; இது அவர்களுக்கு நல்லதாகத் தோன்றியது.[a] ஏனெனில், அரசன் செய்த அனைத்தும் மக்கள் அனைவரின் பார்வையிலும் நல்லதாகவே இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவர்களுடைய கண்களில் நல்லதாக இருந்தது.” அல்லது, “அது அவர்களுக்கு விருப்பமாக இருந்தது.”
    reason: எபிரெய மரபுத்தொடரின் நேரடியான உருவகத்தையும் அதன் இயல்பான மாற்றுப் பொருளையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: הִכִּירוּ
  choice: உணர்ந்துகொண்டார்கள்
  rationale: நכר என்பதன் ஹிஃபில் வடிவம் இங்கு அறிதல், உணர்தல் அல்லது புரிந்துகொள்ளுதல் என்ற பொருளைத் தருகிறது. சூழலிலிருந்து புரியும் கருத்தை ‘இதை’ என்று சுட்டுவது, தாவீதின் நேர்மையை மக்கள் உணர்ந்தார்கள் என்பதைக் கூடுதலாக விளக்காமல் தெரிவிக்கிறது.
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  choice: இது அவர்களுக்கு நல்லதாகத் தோன்றியது
  rationale: ‘அவர்களுடைய கண்களில் நல்லதாக இருந்தது’ என்ற எபிரெய மரபுத்தொடர் ஒப்புதல் அல்லது விருப்பத்தைக் குறிக்கிறது. தமிழில் இயல்பாக இருக்க ‘அவர்களுக்கு நல்லதாகத் தோன்றியது’ என்று மொழிபெயர்க்கப்பட்டுள்ளது; மூல உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה הַמֶּלֶךְ
  choice: அரசன் செய்த அனைத்தும்
  rationale: כְּכֹל என்பதன் தொடர்பு இங்கு மக்களின் அப்போதைய ஒப்புதலை அரசனின் செயல்கள் அனைத்திற்கும் அவர்கள் அளித்த பொதுவான ஒப்புதலுடன் இணைக்கிறது. தமிழில் அடுத்த கூற்றாக இயல்பாக அமைத்தாலும் மூலத்தின் கருத்துத் தொடர்பு காக்கப்படுகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: மூலத்தில் தனிப்பெயர் அல்ல, பட்டமே உள்ளது; ஆகவே ‘தாவீது அரசன்’ என்று விரிவாக்காமல் ‘அரசன்’ எனக் கொடுக்கப்பட்டுள்ளது.
- source_word: בְּעֵינֵי כָל הָעָם טוֹב
  choice: மக்கள் அனைவரின் பார்வையிலும் நல்லதாகவே இருந்தது
  rationale: טוֹב என்பதன் பரந்த ‘நல்லது/ஏற்புடையது’ என்ற பொருளையும், வசனத்தில் வரும் ‘நல்லது’ என்ற மறுபடியும் கூறுதலையும் இது காக்கிறது. ‘பார்வையில்’ என்பது எபிரெய மதிப்பீட்டு மரபுத்தொடரின் உருவகத்தையும் இயல்பான தமிழையும் இணைக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நல்லதாக’ என்ற மறுபடியும் கூறுதல் மூல எபிரெயத்தின் சொல் தொடர்பைக் காக்கிறது; முதல் இடத்தில் உள்ள ‘கண்களில்’ என்ற உருவகம் இயல்புக்காக உரையில் மாற்றப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
