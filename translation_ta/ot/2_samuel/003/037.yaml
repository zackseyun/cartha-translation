base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/037.yaml
  text: So all the people and all Israel knew on that day that it was not from the king to put Abner son of Ner to death[a].
translation:
  language: ta
  text: அன்றைய நாளில் மக்கள் அனைவரும், இஸ்ரவேலர் அனைவரும், நேரின் மகன் அப்னேரைக் கொல்வது அரசனிடமிருந்து வந்ததல்ல[a] என்பதை அறிந்துகொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது அரசனிடமிருந்து உண்டானதல்ல”; அல்லது, “அரசன் அதற்கு உத்தரவிடவில்லை.” எபிரெயம் அந்தச் செயல் அரசனிடமிருந்து தோன்றியதா என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדְעוּ
  choice: அறிந்துகொண்டார்கள்
  rationale: ידע என்பதன் நிகழ்வுரீதியான வடிவம் ஒரு உண்மையைத் தெரிந்துகொள்ளுதல் அல்லது உணர்ந்துகொள்ளுதல் என்பதைக் குறிக்கிறது; இச்சூழலில் ‘அறிந்துகொண்டார்கள்’ இயல்பாக உள்ளது.
- source_word: כָל הָעָם וְכָל יִשְׂרָאֵל
  choice: மக்கள் அனைவரும் இஸ்ரவேலர் அனைவரும்
  rationale: எபிரெய உரையில் உள்ள இரு கூட்டு வெளிப்பாடுகளையும் வேறுபடுத்திப் பாதுகாக்கிறது; ‘இஸ்ரவேலர் அனைவரும்’ என்பது நவீன தமிழில் தெளிவான தேசியக் கூட்டுப்பெயர்.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்றைய நாளில்
  rationale: குறிப்பிட்ட அந்த நாளை வலியுறுத்தும் எபிரெய காலச் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
- source_word: לֹא הָיְתָה מֵהַמֶּלֶךְ
  choice: அரசனிடமிருந்து வந்ததல்ல
  rationale: מן குறிக்கும் மூலம் அல்லது தோற்றம் என்ற கருத்தைத் தக்கவைக்கிறது; அரசன் கட்டளையிடவில்லை அல்லது குற்றமற்றவர் என்று உரையில் சொல்லப்பட்டதைவிட வலுவாக விளக்கவில்லை.
- source_word: לְהָמִית
  choice: கொல்வது
  rationale: מות என்பதன் ஹிஃபில் வடிவத்திலுள்ள ‘இறக்கச் செய்தல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; ‘மரண தண்டனை நிறைவேற்றுதல்’ என்பது உரையில் இல்லாத நீதிமுறைச் சாயலைச் சேர்க்கும்.
- source_word: אֶת אַבְנֵר בֶּן נֵר
  choice: நேரின் மகன் அப்னேரை
  rationale: தனிப்பெயர்களையும் தந்தைவழி அடையாளத்தையும் தெளிவாகப் பாதுகாக்கும் இயல்பான தமிழ் அமைப்பு.
theological_decisions:
- issue: அப்னேரின் மரணத்தில் தாவீதின் பொறுப்பு எந்த அளவுக்கு மறுக்கப்படுகிறது
  choice: அப்னேரைக் கொன்ற செயல் அரசனிடமிருந்து தோன்றியதல்ல என்று மட்டும் கூறுதல்
  alternative: அரசன் அதற்கு உத்தரவிடவில்லை; அல்லது அரசன் முற்றிலும் குற்றமற்றவர் என்று வெளிப்படையாகக் கூறுதல்
  rationale: எபிரெய சொற்றொடர் செயல் அல்லது விவகாரத்தின் மூலம் அரசன் அல்ல என்பதில் கவனம் செலுத்துகிறது. சட்டரீதியான முழு நிரபராதத்தையோ குறிப்பிட்ட கட்டளையின்மையையோ வெளிப்படையாகச் சொல்லவில்லை; ஆகவே அந்தத் திறந்தநிலையை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் தெளிவான, கண்ணியமான கதையுரை. ‘அரசனிடமிருந்து வந்ததல்ல’ என்ற சிறிது அசாதாரணமான அமைப்பு, மூல எபிரெயில் உள்ள மூலம்/தோற்றம் சார்ந்த உண்மையான தெளிவின்மையைப் பாதுகாக்க நோக்கத்துடன் வைக்கப்பட்டுள்ளது.
