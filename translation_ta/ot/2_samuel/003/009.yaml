  text: כֹּֽה יַעֲשֶׂ֤ה אֱלֹהִים֙ לְ/אַבְנֵ֔ר וְ/כֹ֖ה יֹסִ֣יף ל֑/וֹ כִּ֗י כַּ/אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לְ/דָוִ֔ד כִּֽי כֵ֖ן אֶֽעֱשֶׂה לּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/009.yaml
  text: May God do so to Abner[a], and more also, if, just as Yahweh has sworn to David, so I do for him—
translation:
  language: ta
  text: கடவுள் அப்னேருக்கு இப்படிச் செய்யட்டும்; இதைவிட அதிகமாகவும் செய்யட்டும்! யாவே தாவீதுக்குச் சத்தியம் செய்தபடியே, நானும் அவருக்காகச் செய்வேன்[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இறுதிச் சொற்றொடரை, “அப்படியே நான் அவருக்காகச் செய்கிறேன்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் எதிர்கால உறுதியையோ ஆணைமொழியில் நிகழ்கால வடிவிலான உறுதியையோ குறிக்கலாம்.
    reason: இறுதி எபிரெய வினைச்சொல்லின் எதிர்கால/ஆணைமொழி பயன்பாட்டைச் சுட்டுகிறது; மூலத்தில் இல்லாத எதிர்மறை நிபந்தனையைச் சேர்க்காது.
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים לְאַבְנֵר וְכֹה יֹסִיף לוֹ
  choice: கடவுள் அப்னேருக்கு இப்படிச் செய்யட்டும்; இதைவிட அதிகமாகவும் செய்யட்டும்!
  rationale: இது தன்ன்மீது தெய்வீகத் தண்டனையை வரவழைக்கும் வழக்கமான எபிரெய ஆணைமொழி. அப்னேர் தன்னை மூன்றாம் நபராகக் குறிப்பிடுவதையும், וְכֹה יֹסִיף לוֹ என்பதன் தீவிரப்படுத்தும் பொருளையும் தமிழில் இயல்பாகப் பேணுகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு ஆணைமொழியில் ஒரே கடவுளைக் குறிக்கிறது; பன்மையான ‘தெய்வங்கள்’ என்ற பொருள் சூழலுக்குப் பொருந்தாது.
- source_word: לְאַבְנֵר
  choice: அப்னேருக்கு
  rationale: பேசுகிற அப்னேர் தன் பெயரை மூன்றாம் நபரில் பயன்படுத்தும் எபிரெய வடிவத்தை அப்படியே வெளிப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: ஆணையிட்டபடியே
  rationale: யாவே முன்பு செய்த ஆணைக்கும் அப்னேர் செய்ய உறுதிகொள்ளும் செயலுக்கும் இடையிலான ஒப்புமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான יהוה என்பதை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீனத் தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כִּי כֵן אֶעֱשֶׂה לוֹ
  choice: நான் அவருக்குச் செய்யாவிட்டால்
  rationale: 'எபிரெய ஆணைமொழியின் நிபந்தனை அமைப்பில் எதிர்மறை கருத்து வெளிப்படையாக எழுதப்படாவிட்டாலும் உள்ளடங்கியுள்ளது: அப்னேர் யாவே ஆணையிட்டதைச் செய்யத் தவறினால் சாபம் தன்மீது வரட்டும். தமிழில் ஆணைமொழி தெளிவாக அமைய இந்த உள்ளடங்கிய எதிர்மறை வடிவம் வெளிப்படுத்தப்பட்டுள்ளது.'
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் பதிலிடாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பேணுகிறது.
- issue: ஆணைமொழியின் இறுதி நிபந்தனையில் உள்ள மறைமுக எதிர்மறை
  choice: செய்யாவிட்டால்
  alternative: செய்வேன்
  rationale: வழக்கமான எபிரெய தன்னைத்தானே சபிக்கும் ஆணைமொழியில், தொடர்ந்து வரும் כי வாக்கியம் சாபம் அமலாகும் நிபந்தனையைத் தருகிறது. எதிர்மறை உருபு மூலத்தில் வெளிப்படையாக இல்லாததால் மாற்று வாசிப்பு அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஆணைமொழியின் வலிமைக்காக இரண்டு சுருக்கமான வாக்கியத் துண்டுகள் அமைக்கப்பட்டுள்ளன; வசனம் அடுத்த வசனத்தில் தொடர்வதை நீண்ட கோடு காட்டுகிறது.
