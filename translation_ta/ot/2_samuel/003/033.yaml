  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. இது இரங்கற்பா என்பதைக் காட்ட ‘புலம்பிப் பாடினான்’ தேர்ந்தெடுக்கப்பட்டது. மேற்கோள் கவித்துவத் தன்மையுடன் இருந்தாலும் சாதாரண வாசகருக்கு உடனடியாகப் புரியும் சொற்றொடராக அமைக்கப்பட்டுள்ளது.
