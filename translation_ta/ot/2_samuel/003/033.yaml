  yaml_path: translation/ot/2_samuel/003/033.yaml
  text: And the king lamented over Abner and said[a], “Should Abner die as a fool dies?”
translation:
  language: ta
  text: 'அரசன் அப்னேரைக் குறித்து இரங்கற்பாடல் பாடி, இவ்வாறு சொன்னான்:


    “மூடன் இறப்பதுபோல் அப்னேர் இறக்க வேண்டுமா?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקֹנֵן
  choice: புலம்பிப் பாடினான்
  rationale: קונן என்பது இறந்தவரைக் குறித்து முறையான புலம்பலை அல்லது இரங்கற்பாவைப் பாடுவதைக் குறிக்கிறது. மேற்கோளாகப் புலம்பல் தொடர்வதால், பொதுவான ‘துக்கப்பட்டான்’ என்பதைவிட ‘புலம்பிப் பாடினான்’ மூலத்தின் வடிவையும் பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: אֶל אַבְנֵר
  choice: அப்னேரைக் குறித்து
  rationale: புலம்புதல் சார்ந்த சூழலில் אֶל புலம்பலின் பொருளாகிய நபரைக் குறிக்கிறது. தமிழில் ‘அப்னேரைக் குறித்து’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: கதைச் சூழலில் தாவீதைக் குறிக்கும் திட்டவட்டமான பெயர்ச்சொல்; மூலத்தைப் போலவே பட்டப்பெயர் தக்கவைக்கப்படுகிறது.
- source_word: וַיֹּאמַר
  choice: என்றான் என்பதற்குப் பதிலாக மேற்கோளை அறிமுகப்படுத்தும் இரட்டைப்புள்ளி
  rationale: எபிரெயத்தில் வழக்கமான ‘சொன்னான்’ உள்ளது. தமிழில் ‘புலம்பிப் பாடினான்:’ என்பதே அதைச் சுருக்கமாகவும் இயல்பாகவும் உள்ளடக்குகிறது; சொல்வினையின் பொருள் நீக்கப்படவில்லை.
- source_word: הַכְּמוֹת נָבָל
  choice: மூடன் சாவதைப்போல
  rationale: இந்த ஒப்பீட்டுத் தொடர் சொல்லர்த்தமாக ‘மூடனின் சாவைப் போல’ எனலாம். தமிழில் வினை வடிவிலான ‘மூடன் சாவதைப்போல’ இயல்பாக இருந்து, அப்னேரின் சாவைப் பற்றிய சொல்லாட்சியோடு ஒப்புமையைத் தெளிவாக்குகிறது.
- source_word: נָבָל
  choice: மூடன்
  rationale: נבל அறிவுக் குறைவை மட்டும் அல்லாமல் ஒழுக்க இழிவையும் மதிகேட்டையும் சுட்டலாம். ‘மூடன்’ நேரடியான இணையாக இருந்து, சூழல் தரும் இழிவான சாவின் நுண்பொருளைத் தீர்மானித்து விரிவாக்காமல் விடுகிறது.
- source_word: יָמוּת
  choice: சாக வேண்டுமா?
  rationale: இங்கே imperfect வடிவம் புலம்பலுக்குள் வினாவாக அமைந்து எதிர்ப்பையும் வேதனையையும் வெளிப்படுத்துகிறது. ‘சாக வேண்டுமா?’ அந்த உரையாடல் வலிமையை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: אַבְנֵר
  choice: அப்னேர்
  rationale: தனிப்பெயர் நவீனத் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பின்படி தரப்படுகிறது.
