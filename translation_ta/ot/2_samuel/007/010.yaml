base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/010.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], so that they may dwell in their own place and be disturbed no more. And the sons of wickedness shall no longer afflict them, as formerly.
translation:
  language: ta
  text: நான் என் மக்களாகிய இஸ்ரவேலுக்கு ஓர் இடத்தை ஒதுக்குவேன்; அவர்களை அங்கே நடுவேன். அவர்கள் தங்கள் இடத்திலேயே குடியிருப்பார்கள்; இனி அலைக்கழிக்கப்பட மாட்டார்கள். முன்புபோல, தீமை செய்பவர்கள்[a] இனி அவர்களைத் துன்புறுத்த மாட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொற்சொல்லாக: ‘அநீதியின் மகன்கள்.’ அல்லது, ‘பொல்லாதவர்கள்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  choice: ஓர் இடத்தை ஏற்படுத்தி
  rationale: שׂוּם என்பதன் அடிப்படைப் பொருள் ‘வைத்தல்’; מָקוֹם உடனும் வாக்குறுதியின் சூழலிலும், மக்களுக்கான இடத்தை நியமித்து நிலைநிறுத்தும் கருத்தை ‘இடத்தை ஏற்படுத்தி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְעַמִּי לְיִשְׂרָאֵל
  choice: என் மக்களாகிய இஸ்ரவேலுக்காக
  rationale: இரு தொடர்களும் ஒரே மக்களைக் குறிக்கும் இணைப்புரை. உடன்படிக்கைச் சார்ந்த ‘என் மக்கள்’ என்பதையும் ‘இஸ்ரவேல்’ என்ற அடையாளத்தையும் காக்கிறது.
- source_word: וּנְטַעְתִּיו
  choice: அவர்களை அங்கே நடுவேன்
  rationale: ‘நடுதல்’ என்ற உருவகத்தைப் பாதுகாக்கிறது. எங்கு நடுவார் என்பதைத் தமிழில் தெளிவுபடுத்த ‘அங்கே’ சேர்க்கப்பட்டுள்ளது; அது முன் கூறிய இடத்தைக் குறிக்கிறது.
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: அவர்கள் தங்கள் இடத்திலேயே குடியிருப்பார்கள்
  rationale: கூட்டொருமையான இஸ்ரவேலை இயல்பான தமிழில் பன்மையாகக் காட்டுகிறது. תַּחְתָּיו இங்கு பாதுகாப்பாகத் தன் இடத்தில் நிலைத்திருப்பதைக் குறிக்கும் வழக்குச் சொல்லாகப் புரிந்துகொள்ளப்பட்டுள்ளது.
- source_word: וְלֹא יִרְגַּז עוֹד
  choice: இனி ஒருபோதும் அலைக்கழிக்கப்பட மாட்டார்கள்
  rationale: רגז என்பதிலுள்ள கலங்குதல் அல்லது நிலைகுலைக்கப்படுதல் என்ற பரப்பை, பகைவரால் பாதுகாப்பு குலைவதன் சூழலில் ‘அலைக்கழிக்கப்படுதல்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְנֵי עַוְלָה
  choice: அநீதியின் மகன்கள்
  rationale: எபிரெயச் சொல்லின் நேரடி, வலிமையான மரபுத்தொடரை முதன்மை உரையில் காக்கிறது; இயல்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְעַנּוֹתוֹ
  choice: அவர்களைத் துன்புறுத்த
  rationale: Piel வடிவிலுள்ள ענה இங்கு ஒடுக்குதல் அல்லது வருத்துதல் என்னும் பகைமையான செயல்பாட்டைக் குறிக்கிறது; ‘துன்புறுத்த’ அதன் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: முன்பு நடந்ததுபோல
  rationale: முந்தைய ஒடுக்குமுறைக் காலத்தைச் சுட்டும் கால ஒப்பீட்டை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலைக் குறிக்கும் எபிரெயக் கூட்டொருமை
  choice: தமிழில் ‘அவர்கள்’ என்ற பன்மையால் குறிப்பிடுதல்
  alternative: ‘அவனை/அவன்’ என்று ஒருமை ஆளுருவகத்தைத் தொடருதல்
  rationale: எபிரெயத்தில் ஒரு மக்களினம் இலக்கண ஒருமையாக வரலாம். தமிழில் பன்மை பயன்படுத்துவது குறிப்பைத் தெளிவாக்குகிறது; இது கோட்பாட்டு முடிவு அல்ல, மொழியியல் முடிவு.
- issue: בְנֵי עַוְלָה என்ற மரபுத்தொடர்
  choice: முதன்மை உரையில் ‘அநீதியின் மகன்கள்’ என்று வைத்தல்
  alternative: ‘தீமை செய்பவர்கள்’ அல்லது ‘பொல்லாதவர்கள்’
  rationale: மூலத்தின் உருவகத்தையும் வெளிப்படையான ஆண்பால் வடிவத்தையும் காக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: תַּחְתָּיו என்பதன் சூழல்சார் பொருள்
  choice: ‘தங்கள் இடத்திலேயே’
  alternative: ‘அதன் கீழ்’ அல்லது ‘அவனுக்குக் கீழ்’
  rationale: இங்கு கருத்து இடஞ்சார் கீழ்ப்படிதல் அல்ல; கடவுள் ஒதுக்கிய இடத்தில் பாதுகாப்பாக நிலைத்திருப்பதே. இருப்பினும் எபிரெய வடிவத்தின் நேரடிப் பொருள் ‘அதன்/அவனுடைய கீழ்’ ஆக இருக்கக்கூடிய சொற்பிறப்புச் சாயலை மொழிபெயர்ப்பு சூழலின் அடிப்படையில் வழக்குப் பொருளாக வழங்குகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘நடுவேன்’ என்ற வேளாண் உருவகம் பாதுகாக்கப்பட்டுள்ளது; ‘அநீதியின் மகன்கள்’ என்ற எபிரெய மரபுத்தொடரின் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
