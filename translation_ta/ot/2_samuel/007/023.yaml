  text: וּ/מִ֤י כְ/עַמְּ/ךָ֙ כְּ/יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁ֣ר הָלְכֽוּ אֱ֠לֹהִים לִ/פְדּֽוֹת ל֨/וֹ לְ/עָ֜ם וְ/לָ/שׂ֧וּם ל֣/וֹ שֵׁ֗ם וְ/לַ/עֲשׂ֨וֹת לָ/כֶ֜ם הַ/גְּדוּלָּ֤ה וְ/נֹֽרָאוֹת֙ לְ/אַרְצֶ֔/ךָ מִ/פְּנֵ֣י עַמְּ/ךָ֗ אֲשֶׁ֨ר פָּדִ֤יתָ לְּ/ךָ֙ מִ/מִּצְרַ֔יִם גּוֹיִ֖ם וֵ/אלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/023.yaml
  text: And who is like your people[a], like Israel, the one nation on the earth whom God went to redeem for himself as a people, to make a name for himself, and to do for you great and fearsome things for your land before your people, whom you redeemed for yourself from Egypt[b], from nations and their gods?
translation:
  language: ta
  text: உமது மக்களைப் போல்—இஸ்ரவேலைப் போல்—பூமியில் ஒரே தேசமாகிய வேறு யார் இருக்கிறார்? தமக்கென்று ஒரு மக்களாக மீட்டுக்கொள்ளவும், தமக்கென்று ஒரு பெயரை ஏற்படுத்திக்கொள்ளவும், நீர் எகிப்திலிருந்தும் தேசங்களிடமிருந்தும் அவற்றின் தெய்வங்களிடமிருந்தும்[c] உமக்கென்று மீட்டுக்கொண்ட உமது மக்களுக்கு முன்பாக, உங்களுக்காகவும் உமது நாட்டுக்காகவும் பெரும் அச்சமூட்டும் செயல்களைச் செய்யவும் கடவுள்[a] சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் ‘கடவுள்’ என்பதும் அதனுடன் வரும் ‘சென்றார்’ என்பதும் பன்மை வடிவில் உள்ளன. ஆனால் இச்சூழலில் இஸ்ரவேலின் கடவுளே ஒருமைப் பொருளாகக் குறிக்கப்படுகிறார். சொல்லுக்கு சொல் வாசித்தால், ‘தெய்வங்கள் சென்றன’ என்றும் கொள்ளலாம்.
    reason: grammatical_ambiguity
  - marker: c
    text: எபிரேய இறுதித் தொடர் கடினமானது. இதை ‘எகிப்திலிருந்து—தேசங்களையும் அதன் தெய்வத்தையும்’ அல்லது ‘எகிப்திலிருந்து—தேசங்களையும் தெய்வங்களையும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ כְיִשְׂרָאֵל
  choice: உமது மக்களைப் போல்—இஸ்ரவேலைப் போல்—பூமியில் வேறு யார் இருக்கிறார்?
  rationale: ஒப்பற்ற தன்மையை வலியுறுத்தும் வினாவையும், ‘உமது மக்கள் / இஸ்ரவேல்’ என்ற இருமுறை ஒப்பீட்டு அமைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: பூமியில் ஒரே தேசமாகிய
  rationale: אֶחָד இங்கு இஸ்ரவேலின் தனித்தன்மையை வலியுறுத்துகிறது; ‘ஒரே தேசம்’ அந்தச் சொல்லழுத்தத்தைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר הָלְכוּ אֱלֹהִים
  choice: கடவுள் சென்றார்
  rationale: சூழலில் இஸ்ரவேலின் கடவுளே செய்பவராக இருப்பதால் ஒருமைப் பொருள் முதன்மை உரையில் தரப்படுகிறது; ஆனால் எபிரேய வடிவங்களின் பன்மைத் தோற்றம் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்படுகிறது.
- source_word: לִפְדּוֹת לוֹ לְעָם
  choice: தமக்கென்று ஒரு மக்களாக மீட்டுக்கொள்ள
  rationale: פדה என்பதன் மீட்பு/விடுவிப்பு கருத்தையும், לְעָם என்பதன் உடன்படிக்கை சார்ந்த விளைவையும் இயல்பான தமிழில் கொண்டுவருகிறது.
- source_word: וְלָשׂוּם לוֹ שֵׁם
  choice: தமக்குப் புகழ்பெற்ற பெயரை ஏற்படுத்திக்கொள்ள
  rationale: ‘தமக்குப் பெயரை உண்டாக்குதல்’ என்பது புகழையும் பெருமையையும் பெறுதல் என்ற எபிரேய மரபுத்தொடரின் பொருள்; தமிழில் பொருள் தெளிவாக இருக்க ‘புகழ்பெற்ற’ சேர்க்கப்பட்டுள்ளது.
- source_word: וְלַעֲשׂוֹת לָכֶם
  choice: உங்களுக்குப் ... செயல்களைச் செய்ய
  rationale: லָכֶם என்பது இரண்டாம் நபர் பன்மை; ஜெபத்தில் கடவுளை ஒருமையில் அழைக்கும் சுற்றியுள்ள வடிவங்களுடன் ஏற்படும் திடீர் நபர் மாற்றத்தைத் திருத்தாமல் காக்கிறது.
- source_word: הַגְּדוּלָּה וְנֹרָאוֹת
  choice: பெரும், அச்சமூட்டும் செயல்கள்
  rationale: נוראות வியப்போடு அச்சத்தையும் உண்டாக்கும் செயல்களைக் குறிக்கலாம்; மெலிந்த ‘வியப்பூட்டும்’ என்பதற்குப் பதில் வலுவான கருத்து காக்கப்படுகிறது.
- source_word: לְאַרְצְךָ מִפְּנֵי עַמְּךָ
  choice: உமது மக்களுக்கு முன்பாக, உமது நாட்டுக்காக
  rationale: מִפְּנֵי என்பதன் இடஞ்சார்ந்த ‘முன்பாக’ என்ற படிமத்தையும், אֶרֶץ என்பதன் நாடு/நிலம் சார்ந்த பொருளையும் காக்கிறது.
- source_word: אֲשֶׁר פָּדִיתָ לְּךָ מִמִּצְרַיִם
  choice: நீர் எகிப்திலிருந்து உமக்கென்று மீட்டுக்கொண்ட உமது மக்கள்
  rationale: פדה என்ற வேர்ச்சொல்லின் மறுபயன்பாட்டை ‘மீட்டுக்கொண்ட’ என்று ஒரேபோலக் காட்டுகிறது; לְּךָ-வின் உடைமை/நோக்கப் பொருளையும் காக்கிறது.
- source_word: גּוֹיִם וֵאלֹהָיו
  choice: தேசங்களிடமிருந்தும் அவற்றின் தெய்வங்களிடமிருந்தும்
  rationale: கடினமான இறுதித் தொடரை, இஸ்ரவேலுக்கு முன்பாக அகற்றப்பட்ட தேசங்களையும் அவற்றின் தெய்வங்களையும் சுட்டுவதாக முதன்மை உரை எடுத்துக்கொள்கிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: אֱלֹהִים என்பதன் எண்ணும் குறிப்பும்
  choice: இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கும் ‘கடவுள்’
  alternative: ‘தெய்வங்கள் சென்றன/சென்றனர்’ என்ற வடிவியல் வாசிப்பு
  rationale: வசனத்தின் உரையாடல் சூழலும் செயற்பாட்டின் ஒருமுகமும் இஸ்ரவேலின் கடவுளைக் குறிக்கின்றன. எனினும் பெயர்ச்சொல் பன்மை வடிவிலும் வினைச்சொல் பன்மையிலும் இருப்பதால் அந்த உண்மையான வடிவியல் சிக்கல் அடிக்குறிப்பில் மறைக்கப்படவில்லை.
- issue: לָכֶם என்ற இரண்டாம் நபர் பன்மை
  choice: ‘உங்களுக்குப்’ என்று அப்படியே காத்தல்
  alternative: சுற்றியுள்ள கடவுளை நோக்கிய ஒருமை வடிவங்களுக்கு ஏற்றபடி ‘உமக்காக’ என்று ஒத்திசைத்தல்
  rationale: மசோரெட்டிக் உரையில் உள்ள பன்மையைத் திருத்தாமல், ஜெபத்தின் நடுவே இஸ்ரவேலைக் கூட்டாக நோக்கும் திடீர் மாற்றத்தைப் பாதுகாக்கிறது.
- issue: கடினமான இறுதித் தொடர் גּוֹיִם וֵאלֹהָיו
  choice: ‘தேசங்களிடமிருந்தும் அவற்றின் தெய்வங்களிடமிருந்தும்’
  alternative: ‘எகிப்திலிருந்து—தேசங்களையும் அதன் தெய்வத்தையும்’ அல்லது ‘எகிப்திலிருந்து—தேசங்களையும் தெய்வங்களையும்’
  rationale: முதன்மை வாசிப்பு யாத்திரை மற்றும் தேசங்களை அகற்றிய வரலாற்றுச் சூழலுடன் பொருந்துகிறது; ஆனால் எபிரேய தொடரின் எண்ணும் தொடரியலும் சுருக்கமாகவும் கடினமாகவும் இருப்பதால் மாற்று வாசிப்புகள் அடிக்குறிப்பில் வைக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதைமிக்க ஜெப நடையைப் பயன்படுத்துகிறது. கடவுளை நோக்கி ‘உமது/நீர்’ என்றும், மூன்றாம் நபர் குறிப்பில் ‘தமக்கு/அவர்’ என்றும் வழங்கப்பட்டுள்ளது. மூலத்தில் உள்ள திடீர் இரண்டாம் நபர் பன்மையான לָכֶם ‘உங்களுக்குப்’ என்று திட்டமிட்டு காக்கப்பட்டுள்ளது. நீண்ட எபிரேய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும் அதன் வினாவும் செயல்களின் தொடரும் பாதுகாக்கப்பட்டுள்ளன.
