revisions:
- from: உமது மக்களைப் போல்—இஸ்ரவேலைப் போல்—பூமியில் வேறு யார் இருக்கிறார்? பூமியில் ஒரே தேசமாகிய அவர்களைத் தமக்கென்று ஒரு மக்களாக மீட்டுக்கொள்ளவும், தமக்குப் புகழ்பெற்ற பெயரை ஏற்படுத்திக்கொள்ளவும் கடவுள்[a] சென்றார். நீர் எகிப்திலிருந்து உமக்கென்று மீட்டுக்கொண்ட உமது மக்களுக்கு முன்பாக, உமது நாட்டுக்காக உங்களுக்குப் பெரும், அச்சமூட்டும் செயல்களைச் செய்யவும் அவர் சென்றார்[b]—தேசங்களிடமிருந்தும் அவற்றின் தெய்வங்களிடமிருந்தும்[c] உமது மக்களை மீட்டுக்கொண்டீர்.
  to: உமது மக்களைப் போல்—இஸ்ரவேலைப் போல்—பூமியில் ஒரே தேசமாகிய வேறு யார் இருக்கிறார்? தமக்கென்று ஒரு மக்களாக மீட்டுக்கொள்ளவும், தமக்கென்று ஒரு பெயரை ஏற்படுத்திக்கொள்ளவும், நீர் எகிப்திலிருந்தும் தேசங்களிடமிருந்தும் அவற்றின் தெய்வங்களிடமிருந்தும்[c] உமக்கென்று மீட்டுக்கொண்ட உமது மக்களுக்கு முன்பாக, உங்களுக்காகவும் உமது நாட்டுக்காகவும் பெரும் அச்சமூட்டும் செயல்களைச் செய்யவும் கடவுள்[a] சென்றார்.
  rationale: The revision restores the one governing verb and its three infinitival purposes, retains the Masoretic second-person plural ‘உங்களுக்காகவும்,’ and integrates the difficult closing phrase into the relative clause rather than creating an unsupported second action. The adopted main-text construal follows the English POB audit trail while the footnote preserves the genuine syntactic uncertainty. Footnote b is retained as supplied but has no anchor in the revised verse because the lexical alternative is not needed for structural resolution; it should be anchored to ‘அச்சமூட்டும்’ in typesetting if all supplied notes must be displayed.
