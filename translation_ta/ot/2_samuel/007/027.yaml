- from: ஏனெனில், படைகளின் யாவேவாகிய இஸ்ரவேலின் இறைவனே, ‘நான் உனக்கு ஒரு வீட்டைக் கட்டுவேன்’[b] என்று உமது அடியானுக்கு வெளிப்படுத்தியிருக்கிறீர்.[a] ஆகவே, உமது அடியான் இந்த மன்றாட்டை உம்மிடம் ஏறெடுக்கத் துணிவு பெற்றான்.[c]
  to: ஏனெனில், படைகளின் யாவே, இஸ்ரவேலின் இறைவனே, ‘நான் உனக்கு ஒரு வீட்டைக் கட்டுவேன்’[b] என்று உமது அடியானுக்கு இதை வெளிப்படுத்தியிருக்கிறீர்.[a] ஆகவே, உமது அடியான் உம்மிடம் இந்த மன்றாட்டைச் செலுத்தத் துணிவு கொண்டான்.[c]
  rationale: திருத்தம் பொருளை மாற்றாமல் நடை மற்றும் தெளிவை மேம்படுத்துகிறது. ‘ஏறெடுக்க’ என்பதற்குப் பதிலாக ‘செலுத்த’ பயன்படுத்தப்பட்டுள்ளது; மேற்கோளால் வெளிப்படுத்தப்பட்ட செய்தியைத் தெளிவுபடுத்த ‘இதை’ சேர்க்கப்பட்டுள்ளது. அடிக்குறிப்புகள் மூல மரபுத்தொடரையும் ‘வீடு’ என்பதன் தீர்மானிக்கப்படாத இருபொருளையும் பாதுகாக்கின்றன.
