base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/027.yaml
  text: For you[a], O Yahweh of hosts, God of Israel, have revealed this to your servant, saying[c][b], ‘I will build you a house.’ Therefore your servant has found it in his heart to pray this prayer to you.
translation:
  language: ta
  text: ஏனெனில், படைகளின் யாவே, இஸ்ரவேலின் இறைவனே, ‘நான் உனக்கு ஒரு வீட்டைக் கட்டுவேன்’[b] என்று உமது அடியானுக்கு இதை வெளிப்படுத்தியிருக்கிறீர்.[a] ஆகவே, உமது அடியான் உம்மிடம் இந்த மன்றாட்டைச் செலுத்தத் துணிவு கொண்டான்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “உமது அடியானின் செவியைத் திறந்தீர்”; இது ஒருவருக்கு ஒன்றை வெளிப்படுத்துவதைக் குறிக்கும் எபிரேய மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: b
    text: “உனக்காக ஒரு வீட்டைக் கட்டுவேன்” என்றும் மொழிபெயர்க்கலாம். இச்சூழலில் “வீடு” என்பது கட்டடத்தையும் அரச வம்சத்தையும் ஒருசேரக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: 'சொல்லுக்குச் சொல்: “உமது அடியான் தன் இதயத்தைக் கண்டான்”; அதாவது, மன்றாடுவதற்கான துணிவையோ உறுதியையோ பெற்றான்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: படைகளின் யாவே
  rationale: யְהוָה என்பதை ஒலிபெயர்த்து உடன்படிக்கையின் திருப்பெயரைத் தக்கவைக்கிறது; צְבָאוֹת என்பதன் படைகள்/வானுலக அணிகள் சார்ந்த பரப்பை ‘படைகள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் இறைவன்
  rationale: இஸ்ரவேலோடு உள்ள உடன்படிக்கை சார்ந்த அடையாளத்தை நேராகவும் மரியாதையான தமிழிலும் தெரிவிக்கிறது.
- source_word: גָּלִיתָה אֶת אֹזֶן עַבְדְּךָ
  choice: உமது அடியானுக்கு வெளிப்படுத்தியிருக்கிறீர்
  rationale: ‘உமது அடியானின் செவியைத் திறந்தீர்’ என்ற எபிரேய மரபுத்தொடரின் பொருளான வெளிப்படுத்துதலை இயல்பான தமிழில் தருகிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியான்
  rationale: அரசனாகிய தாவீது இறைவனுக்கு முன் தாழ்மையுடன் தன்னைச் சுட்டும் மன்றாட்டு நடைக்கு ‘அடியான்’ பொருத்தமானது.
- source_word: בַּיִת אֶבְנֶה לָּךְ
  choice: நான் உனக்கு ஒரு வீட்டைக் கட்டுவேன்
  rationale: ‘வீடு’ என்பதை ஆலயம் அல்லது அரச வம்சம் என்று குறுக்காமல், சூழலில் உள்ள திட்டமிட்ட இருபொருள் நயத்தைப் பாதுகாக்கிறது.
- source_word: מָצָא ... אֶת לִבּוֹ
  choice: துணிவு பெற்றான்
  rationale: சொல்லுக்குச் சொல் ‘தன் இதயத்தைக் கண்டான்’ என்றாலும், இங்கு வேண்டுவதற்கான மனத்துணிவு அல்லது உறுதியைப் பெற்றான் என்பதே மரபுத்தொடரின் இயல்பான பொருள்.
- source_word: לְהִתְפַּלֵּל אֵלֶיךָ אֶת הַתְּפִלָּה הַזֹּאת
  choice: இந்த மன்றாட்டை உம்மிடம் ஏறெடுக்க
  rationale: தற்போது இறைவனிடம் செலுத்தப்படும் குறிப்பிட்ட வேண்டுதலை இயல்பான, கண்ணியமான தமிழ் மன்றாட்டு நடையில் தருகிறது.
theological_decisions:
- issue: வெளிப்படுத்துதல் குறித்த எபிரேய மரபுத்தொடர்
  choice: முதன்மை உரையில் ‘வெளிப்படுத்தியிருக்கிறீர்’
  alternative: ‘உமது அடியானின் செவியைத் திறந்தீர்’
  rationale: சொல்லுக்குச் சொல் வடிவம் தமிழில் தெளிவற்றதாக இருக்கலாம்; பொருளை முதன்மை உரையில் தெளிவாக்கி, அடிச்சொல் உருவகத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: ‘வீடு’ என்பதன் பொருள்
  choice: ‘வீடு’ என்றே வைத்தல்
  alternative: ‘ஆலயம்’ அல்லது ‘அரச வம்சம்’
  rationale: 2 சாமுவேல் 7-இல் ஆலயத்துக்கும் தாவீதின் அரச வம்சத்துக்கும் இடையே ஒலிக்கும் திட்டமிட்ட இருபொருள் நயத்தை ஒரு பொருளாக மட்டும் தீர்மானிக்காமல் பாதுகாக்கிறது.
- issue: ‘தன் இதயத்தைக் கண்டான்’ என்ற மரபுத்தொடர்
  choice: ‘துணிவு பெற்றான்’
  alternative: ‘தன் இதயத்தில் எண்ணினான்’ அல்லது ‘தன் இதயத்தைக் கண்டான்’
  rationale: இது வெறும் எண்ணம் தோன்றியதைக் காட்டாமல், இறைவனிடம் மன்றாடத் துணிந்த மனநிலையைச் சுட்டுகிறது; அடிக்குறிப்பு சொல்லுக்குச் சொல் வடிவத்தையும் சாத்தியமான ‘உறுதி’ நுணுக்கத்தையும் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான மன்றாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கும் இடங்களில் ‘உமது/உம்மிடம்/இருக்கிறீர்’ என்ற மரியாதை ஒருமை பேணப்பட்டுள்ளது; மேற்கோளில் இறைவன் தாவீதிடம் கூறும் இரண்டாம் நபர் ஒருமை ‘உனக்கு’ எனத் தரப்பட்டுள்ளது. ‘யாவே’ ஒலிபெயர்ப்பு திருப்பெயரை மறைக்காமல் காட்டுகிறது.
