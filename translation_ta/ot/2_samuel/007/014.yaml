source:
  edition: WLC
  text: אֲנִי֙ אֶהְיֶה לּ֣/וֹ לְ/אָ֔ב וְ/ה֖וּא יִהְיֶה לִּ֣/י לְ/בֵ֑ן אֲשֶׁר֙ בְּ/הַ֣עֲוֺת֔/וֹ וְ/הֹֽכַחְתִּי/ו֙ בְּ/שֵׁ֣בֶט אֲנָשִׁ֔ים וּ/בְ/נִגְעֵ֖י בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/014.yaml
  text: I will be a father to him[a], and he will be a son to me. When he commits iniquity, I will discipline him with the rod of men and with the blows of the sons of man.
translation:
  language: ta
  text: நான் அவனுக்குத் தந்தையாக இருப்பேன்; அவன் எனக்கு மகனாக இருப்பான். அவன் அக்கிரமம் செய்யும்போது, மனிதரின் கோலாலும் மனிதரின் அடிகளாலும்[a] அவனை ஒழுக்கப்படுத்துவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனித அடிகளால்.” எபிரெயத்தில், “மனிதரின் மகன்களின் அடிகள்” என்ற மரபுத்தொடர் பொதுவாக மனிதர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: நான் அவனுக்குத் தந்தையாக இருப்பேன்
  rationale: எபிரெய மொழியின் உறவைக் குறிக்கும் לְ அமைப்பைப் பாதுகாக்கிறது; அதேவேளையில் நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: அவன் எனக்கு மகனாக இருப்பான்
  rationale: முந்தைய தொடருக்கு இணையான பரஸ்பர உடன்படிக்கைச் சொல்லமைப்பைப் பேணுகிறது.
- source_word: אֲשֶׁר בְּהַעֲוֺתוֹ
  choice: அவன் அக்கிரமம் செய்யும்போது
  rationale: இங்கு אֲשֶׁר சூழ்நிலை அல்லது காலத்தை அறிமுகப்படுத்துகிறது. ‘செய்தால்’ என்பது நிபந்தனையை மிகைப்படுத்தக்கூடும்; ‘செய்யும்போது’ மூலத்தின் காலச்சார்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּהַעֲוֺתוֹ
  choice: அக்கிரமம் செய்யும்போது
  rationale: עוה சார்ந்த சொல் தவறு அல்லது வக்கிரமான செயல் என்ற ஒழுக்கரீதியான கனத்தை உடையது; ‘அக்கிரமம்’ அந்தக் கனத்தைத் தக்கவைக்கிறது.
- source_word: וְהֹכַחְתִּיו
  choice: அவனைத் திருத்துவேன்
  rationale: יכח என்பதன் ஹிஃபில் வடிவம் கண்டித்துத் திருத்துதல் அல்லது ஒழுக்கப்படுத்துதல் என்ற பொருளைக் கொண்டது. தொடர்ந்து வரும் தண்டனைக் கருவிகளின் சூழலில் ‘திருத்துவேன்’ என்பது வெறும் வாய்மொழிக் கண்டிப்பை விட corrective discipline-ஐ தெளிவாகக் காட்டுகிறது.
- source_word: בְּשֵׁבֶט אֲנָשִׁים
  choice: மனிதர்களின் கோலினாலும்
  rationale: ‘கோல்’ என்ற உருவகத்தைப் பேணுகிறது; இது சாதாரண மனித வழிமுறைகளைக் குறிக்கிறதா அல்லது மனித முகவர்கள் வழியான தண்டனையைக் குறிக்கிறதா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: וּבְנִגְעֵי בְּנֵי אָדָם
  choice: மனிதர்களின் அடிகளினாலும்
  rationale: נגעי இங்கு அடிகள் அல்லது தாக்குதல்கள் என்று பொருள்படுகிறது. בני אדם என்பதை நவீன தமிழில் இயல்பாக ‘மனிதர்கள்’ என வழங்கி, அதன் சொற்சொல் வடிவத்தை அடிக்குறிப்பில் தருகிறது.
theological_decisions:
- issue: தாவீதின் அரச வம்சத்துக்குரிய மகன் வாக்குறுதியும் அதன் பிற்கால மேசியப் பயன்பாடும்
  choice: வசனத்தை அதன் உடனடி வரலாற்றுச் சூழலில் தாவீதின் மகன் அல்லது அரசனைப் பற்றியதாக மொழிபெயர்த்து, பிரதான உரையில் வெளிப்படையான மேசிய விளக்கத்தைச் சேர்க்கவில்லை.
  alternative: பிரதான உரையிலேயே இதை நேரடியான மேசிய வாக்காக விளக்குதல்.
  rationale: இந்த வசனம் முதலில் தாவீதின் சந்ததியைப் பற்றிய தாவீதிய உடன்படிக்கைக்குள் செயல்படுகிறது. பிற்கால வேதப்பகுதிகள் இதன் மகனுறவு மொழியை விரிவாகப் பயன்படுத்தினாலும், எபிரெய மூலத்தில் வெளிப்படையாக இல்லாத கிறிஸ்துவியல் விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்காமல் அதன் இயல்பான இறையியல் அழுத்தத்தைப் பேண வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘தந்தை’, ‘மகன்’, ‘அக்கிரமம்’, ‘கோல்’, ‘அடிகள்’ ஆகியவை மூலத்தின் உறவுமுறை, ஒழுக்கக் கனம், தண்டனை உருவகம் ஆகியவற்றைப் பாதுகாக்கின்றன. தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்களும் விளக்கச் சேர்க்கைகளும் தவிர்க்கப்பட்டுள்ளன.
