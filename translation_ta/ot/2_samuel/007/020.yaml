  yaml_path: translation/ot/2_samuel/007/020.yaml
  text: And what more can David say to you? You know your servant[a], Lord GOD.
translation:
  language: ta
  text: தாவீது உம்மிடம் இன்னும் என்ன சொல்ல முடியும்? ஆண்டவராகிய யாவே, நீர் உமது அடியேனை அறிந்திருக்கிறீர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַה יוֹסִיף דָּוִד עוֹד לְדַבֵּר אֵלֶיךָ
  choice: தாவீது உம்மிடம் இன்னும் என்ன சொல்ல முடியும்?
  rationale: יסף + עוד + לדבר என்ற எபிரேயச் சொற்றொடர், சொல்லுவதற்கு மேலும் ஒன்றுமில்லை என்பதை உணர்த்தும் வினாவாக உள்ளது. தமிழில் இயல்பாகவும் மூலத்தின் வினாவடிவத்தைப் பேணியும் மொழிபெயர்க்கப்பட்டது; தொடக்க ו தனியாக மொழிபெயர்க்கப்படாமல் தொடர்ச்சியால் உணர்த்தப்படுகிறது.
- source_word: וְאַתָּה יָדַעְתָּ
  choice: நீர் ... அறிந்திருக்கிறீர்
  rationale: வலியுறுத்தப்பட்ட இரண்டாம் நபர் ஒருமைப் பெயர்ச்சொல்லையும், நிறைவுற்ற அறிதலால் நிலவும் தற்போதைய அறிவையும் மரியாதையான நேரடி அழைப்பில் வெளிப்படுத்துகிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியேனை
  rationale: தாவீது கடவுள்முன் தன்னைத் தாழ்மையுடன் குறிப்பிடும் அரசவழக்குச் சொல்லாக இருப்பதால், நவீனத் தமிழிலும் ஜெபச் சூழலிலும் இயல்பான ‘அடியேன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲדֹנָי יְהוִה
  choice: ஆண்டவராகிய யாவே
  rationale: אֲדֹנָי என்ற பட்டத்தையும் יהוה என்ற தனிப்பட்ட இறைப்பெயரையும் வேறுபடுத்திப் பேணுகிறது; ‘ஆண்டவர் ஆண்டவர்’ என்ற இயல்பற்ற மறுபடியையும் தவிர்க்கிறது.
theological_decisions:
- issue: אֲדֹנָי יְהוִה என்ற கூட்டு இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவராகிய யாவே
  alternative: ஆண்டவராகிய கர்த்தர்; ஆண்டவராகிய இறைவன்
  rationale: மூலத்தில் பட்டமும் உடன்படிக்கையின் தனிப்பட்ட இறைப்பெயரும் இணைந்துள்ளன. ‘யாவே’ என்பது יהוה என்பதை மறைக்காமல் காட்டுகிறது; எந்த ஒரு பிரிவுசார் விளக்கத்தையும் சேர்க்கவில்லை.
- issue: יָדַעְתָּ என்பதன் பொருள்
  choice: அறிந்திருக்கிறீர்
  alternative: அறிவீர்
  rationale: எபிரேய நிறைவேற்ற வினை இங்கு கடந்தகால நிகழ்வை மட்டும் அல்லாமல், நிலைத்திருக்கும் அறிவைக் குறிக்கிறது. தமிழ் நிறைநிலை வடிவம் அந்த நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
translation_notes:
  register: மரியாதையான ஒருமை முன்னிலை (‘உம்மிடம்’, ‘நீர்’, ‘உமது’) பயன்படுத்தப்பட்டுள்ளது. நடை நவீனமாகவும் கண்ணியமாகவும், சாதாரண வாசகர்களுக்குப் புரியுமாறும் வைக்கப்பட்டுள்ளது; ‘அடியேன்’ ஜெபச் சூழலில் தாவீதின் தாழ்மையான சுயக்குறிப்பைத் தெளிவாகத் தருகிறது.
