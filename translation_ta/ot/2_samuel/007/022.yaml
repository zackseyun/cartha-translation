source:
  edition: WLC
  text: עַל כֵּ֥ן גָּדַ֖לְתָּ אֲדֹנָ֣/י יְהוִ֑ה כִּֽי אֵ֣ין כָּמ֗וֹ/ךָ וְ/אֵ֤ין אֱלֹהִים֙ זֽוּלָתֶ֔/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/022.yaml
  text: Therefore you are great[a], Lord GOD, for there is none like you, and there is no God besides you[b], according to all that we have heard with our ears.
translation:
  language: ta
  text: ஆகவே, ஆண்டவராகிய யாவே[a], நீர் பெரியவர். ஏனெனில், நாங்கள் எங்கள் காதுகளால் கேள்விப்பட்ட அனைத்தின்படியும், உம்மைப் போன்றவர் எவரும் இல்லை; உம்மைத் தவிர வேறு கடவுளும் இல்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: ‘ஆண்டவர் யாவே.’ ‘யாவே’ என்பது יהוה (YHWH) என்ற இறைப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.'
    reason: cultural_note
  - marker: b
    text: ‘உம்மையன்றி ஒரு தெய்வமும் இல்லை’ அல்லது ‘உமக்கு அப்பால் வேறு கடவுள் இல்லை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: ஆகவே
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட இறைச்செயல்களிலிருந்து வரும் முடிவை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: גָּדַלְתָּ
  choice: நீர் பெரியவர்
  rationale: Qal perfect இங்கு தேவனுடைய மகத்துவத்தை உணர்ந்து அறிக்கையிடும் விளைவு நிலையைக் குறிக்கலாம்; தமிழில் நேரடியான துதிமொழியாக இது இயல்பாக உள்ளது.
- source_word: אֲדֹנָי יְהוִה
  choice: ஆண்டவராகிய யாவே
  rationale: אֲדֹנָי என்ற பட்டத்தையும் יהוה என்ற தனிப்பட்ட இறைப்பெயரையும் வேறுபடுத்திக் காக்கிறது; ‘யாவே’ என்பது அந்தப் பெயரின் பரவலாக ஏற்கப்பட்ட தமிழ் ஒலிபெயர்ப்பு.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய ‘நீர் பெரியவர்’ என்ற அறிக்கைக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: אֵין כָּמוֹךָ
  choice: உம்மைப் போன்றவர் எவரும் இல்லை
  rationale: ஒப்பற்ற தன்மையைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பாகவும் முழுமையாகவும் தருகிறது.
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: உம்மைத் தவிர வேறு கடவுளும் இல்லை
  rationale: זוּלָתֶךָ என்பதன் ‘தவிர/அப்பால்’ என்ற விலக்குப் பொருளையும், இணை வாக்கியத்தின் வலியுறுத்தலையும் காக்கிறது.
- source_word: בְּכֹל אֲשֶׁר שָׁמַעְנוּ בְּאָזְנֵינוּ
  choice: நாங்கள் எங்கள் காதுகளால் கேள்விப்பட்ட அனைத்தின்படியும்
  rationale: பெற்ற சாட்சியின் அடிப்படையில் செய்யப்படும் அறிக்கை என்பதையும், ‘எங்கள் காதுகளால்’ என்ற எபிரெய வலியுறுத்தலையும் பாதுகாக்கிறது.
theological_decisions:
- issue: אֲדֹנָי יְהוִה என்ற கூட்டுப் பெயரில் יהוה-ஐ மொழிபெயர்த்தல்
  choice: ஆண்டவராகிய யாவே
  alternative: ஆண்டவராகிய கர்த்தர் / ஆண்டவராகிய தேவன்
  rationale: மூலத்தில் பட்டமும் தனிப்பட்ட இறைப்பெயரும் இணைந்துள்ளன. ‘யாவே’ என்று ஒலிபெயர்ப்பது அந்த வேறுபாட்டைக் காத்து, ‘ஆண்டவர் ஆண்டவர்’ போன்ற குழப்பத்தையும் தவிர்க்கிறது.
- issue: אֵין אֱלֹהִים זוּלָתֶךָ என்பதிலுள்ள ஒரே-இறை அறிக்கை
  choice: உம்மைத் தவிர வேறு கடவுளும் இல்லை
  alternative: உம்மையன்றி ஒரு தெய்வமும் இல்லை
  rationale: வசனத்தின் நேரடியான விலக்குக் கூற்றை அப்படியே காக்கிறது; அதற்குள் பின்னைய தத்துவ விளக்கங்களைச் சேர்க்கவில்லை.
translation_notes:
  register: மரியாதை ஒருமையான ‘நீர்/உம்மை’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. நடை நவீனமானதும், துதிக்குரிய கண்ணியத்தைத் தக்கவைத்ததும், சாதாரண வாசகர்களுக்குப் புரியக்கூடியதுமாக உள்ளது. மூலத்தின் ‘எங்கள் காதுகளால்’ என்ற வலியுறுத்தல் சுருக்கப்படாமல் காக்கப்பட்டுள்ளது.
