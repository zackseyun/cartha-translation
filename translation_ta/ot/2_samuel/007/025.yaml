- from: இப்போது, யாவே தேவனே, உமது அடியானைக் குறித்தும் அவனுடைய வீட்டைக் குறித்தும் நீர் சொன்ன வார்த்தையை[a] என்றென்றும் நிலைநிறுத்தும்; நீர் சொன்னபடியே செய்யும்.
