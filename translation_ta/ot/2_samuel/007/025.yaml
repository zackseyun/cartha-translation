review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately reflects the Hebrew sequence and core meanings: direct address to Yahweh God, the word spoken concerning David and his house, perpetuity, and the request that God act as spoken. ‘வார்த்தை’ and ‘வீடு’ appropriately preserve the Hebrew terms without prematurely replacing them with ‘promise’ or ‘dynasty.’'
  naturalness: The honorific forms ‘நிலைநிறுத்தும்’ and ‘செய்யும்’ can occur in older biblical-prayer style, but are liable to be read as future forms in modern standard Tamil. Explicit honorific imperatives make the petition clear and remain suitably dignified.
  terminology: ‘யாவே தேவனே,’ ‘உமது அடியான்,’ ‘வார்த்தை,’ and ‘வீடு’ are appropriate. Separate notes for ‘வார்த்தை’ and ‘வீடு’ better preserve the English audit trail’s distinct lexical alternatives and clarify the dynastic sense without changing the main text.
  issues:
  - severity: medium
    issue: The verbal forms ‘நிலைநிறுத்தும்’ and ‘செய்யும்’ are ambiguous in modern standard Tamil.
    rationale: The Hebrew הָקֵם and וַעֲשֵׂה are imperatives in David’s prayer. ‘நிலைநிறுத்துவீராக’ and ‘செய்வீராக’ express the requested action unambiguously in a reverent modern register.
  - severity: low
    issue: One footnote combines two distinct lexical explanations under a single marker.
    rationale: The source audit trail distinguishes the alternative ‘promise’ for ‘word’ from the dynastic sense of ‘house.’ Separate anchored notes provide clearer and more traceable support.
  revised_text: இப்போது, யாவே தேவனே, உமது அடியானைக் குறித்தும் அவனுடைய வீட்டைக் குறித்தும் நீர் சொன்ன வார்த்தையை[a] என்றென்றும் நிலைநிறுத்துவீராக; நீர் சொன்னபடியே செய்வீராக.
