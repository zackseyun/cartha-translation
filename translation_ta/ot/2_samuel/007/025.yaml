source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבַּ֤רְתָּ עַֽל עַבְדְּ/ךָ֙ וְ/עַל בֵּית֔/וֹ הָקֵ֖ם עַד עוֹלָ֑ם וַ/עֲשֵׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/025.yaml
  text: And now[a], Yahweh God, confirm forever the word that you have spoken concerning your servant and concerning his house[b], and do as you have spoken.
translation:
  language: ta
  text: இப்போது, யாவே தேவனே, உமது அடியானைக் குறித்தும் அவனுடைய வீட்டைக் குறித்தும் நீர் சொன்ன வார்த்தையை[a] என்றென்றும் நிலைநிறுத்துவீராக; நீர் சொன்னபடியே செய்வீராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘வார்த்தை’ என்பதை ‘வாக்குறுதி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: யாவே தேவனே
  rationale: தெய்வீகப் பெயரான יהוה என்பதை ‘யாவே’ என்று ஒலிபெயர்த்து, அதைத் தொடரும் אֱלֹהִים என்பதை நேரடி அழைப்பில் இயல்பாக ‘தேவனே’ என்று வழங்குகிறது.
- source_word: הַדָּבָר
  choice: வார்த்தையை
  rationale: இங்கு ‘வாக்குறுதி’ என்ற பொருள் சூழலில் உள்ளபோதிலும், எபிரெய மூலத்தின் நேரடியான ‘வார்த்தை/சொல்’ என்ற சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியானை
  rationale: தாவீது தேவனுக்கு முன் தாழ்மையுடன் தன்னைச் சுட்டும் அரசவைக் கூற்றை, கண்ணியமான தமிழ் வேதாகம நடையில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֵּיתוֹ
  choice: அவனுடைய வீட்டை
  rationale: இந்த அதிகாரத்தில் அரச வம்சத்தையும் குறிக்கும் முக்கியமான ‘வீடு’ உருவகத்தைத் தக்கவைக்கிறது; வெறும் குடியிருப்பு அல்லது குடும்பத்தார் மட்டும் என்று சுருக்கவில்லை.
- source_word: הָקֵם
  choice: நிலைநிறுத்தும்
  rationale: קום என்பதன் ஹிஃபில் கட்டளை வடிவம், தேவன் தாம் சொன்ன வார்த்தையை உறுதியாக நிற்கச் செய்ய வேண்டும் என்ற வேண்டுதலைக் குறிக்கிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த நிரந்தரத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וַעֲשֵׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: நீர் சொன்னபடியே செய்யும்
  rationale: மூலத்திலுள்ள சுருக்கமான கட்டளையையும் ‘சொன்ன’ என்ற வினையின் மறுபயன்பாட்டையும் பாதுகாக்கிறது.
theological_decisions:
- issue: הַדָּבָר என்பதை ‘வார்த்தை’ என்றா, உடன்படிக்கைச் சூழலைத் தெளிவாக்கும் ‘வாக்குறுதி’ என்றா மொழிபெயர்ப்பது
  choice: வார்த்தை
  alternative: வாக்குறுதி
  rationale: சூழல் இதை வாக்குறுதியாக உணர்த்தினாலும், மூலத்தில் இருப்பது ‘நீர் சொன்ன வார்த்தை’ என்பதே. ஆகவே உடன்படிக்கைப் பொருளை மொழிபெயர்ப்பிலேயே கட்டாயமாகத் தீர்மானிக்காமல், உண்மையான சொற்பொருளைப் பாதுகாக்கிறது.
- issue: בֵּיתוֹ என்பதைக் ‘வீடு’ என்றா, வெளிப்படையாக ‘அரச வம்சம்’ என்றா வழங்குவது
  choice: அவனுடைய வீடு
  alternative: அவனுடைய அரச வம்சம்
  rationale: 2 சாமுவேல் 7-இல் அரச வம்சப் பொருள் முக்கியமானது. எனினும், அதிகாரம் முழுவதும் செயல்படும் ‘வீடு’ என்ற உடன்படிக்கை உருவகத்தை முதன்மை உரையில் தக்கவைத்து, அதன் வம்சப் பொருளை குறிப்பில் விளக்குவது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்திற்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உமது’, ‘நீர்’, ‘செய்யும்’ ஆகிய மரியாதை வடிவங்கள் நேரடி தெய்வ அழைப்பின் உயர்ந்த பதிவைத் தக்கவைக்கின்றன; அரிதான அல்லது மிகப் பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
