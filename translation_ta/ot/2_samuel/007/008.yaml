base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/008.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people, over Israel.'
translation:
  language: ta
  text: '“ஆகையால், இப்போது என் ஊழியனாகிய தாவீதிடம் நீ சொல்ல வேண்டியது இதுவே: ‘படைகளின் யாவே கூறுவது இதுவே: மேய்ச்சல் நிலத்திலிருந்து[a], மந்தையின் பின்னால் சென்றுகொண்டிருந்த உன்னை நான் எடுத்து, என் மக்களின்மேல், இஸ்ரவேலின்மேல் தலைவனாக[b] இருக்கும்படி வைத்தேன்.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மந்தைகள் தங்கும் இடத்திலிருந்து.” எபிரேயச் சொல் மேய்ச்சல் நிலத்தையோ மந்தைகள் தங்கும் இடத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தலைவன்” என்பதற்கு “ஆட்சியாளன்” அல்லது “இளவரசன்” என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் ஆளுவதற்காக நியமிக்கப்பட்டவரைக் குறிக்கிறது; அது கட்டாயமாக ‘அரசன்’ என்ற குறிப்பிட்ட பட்டத்தைக் குறிக்காது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகையால் இப்போது
  rationale: காலக் குறிப்பையும் உரையின் அடுத்த கட்டத்திற்கான விளைவுசார் மாற்றத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כֹּה תֹאמַר
  choice: நீ சொல்ல வேண்டியது இதுவே
  rationale: தூதுச் செய்திக்கான கட்டளை வலிமையை நவீனத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: לְעַבְדִּי לְדָוִד
  choice: என் பணியாளனாகிய தாவீதிடம்
  rationale: עבד என்பதன் இறை–அரச உடன்படிக்கைச் சூழலுக்கு ‘பணியாளன்’ பொருத்தமானது; தமிழில் இயல்பாக தாவீதுடன் இணைக்கப்பட்டுள்ளது.
- source_word: יְהוָה צְבָאוֹת
  choice: படைகளின் யாவே
  rationale: திருப்பெயரை ஒலிபெயர்த்து, צבאות என்பதன் பரந்த படைத் தொகுதிகள் என்ற பொருளை மிகையாக விளக்காமல் காக்கிறது.
- source_word: לְקַחְתִּיךָ
  choice: உன்னை நான் அழைத்துக்கொண்டு
  rationale: தேவன் தாவீதைத் தேர்ந்தெடுத்து அவன் முந்தைய நிலையிலிருந்து கொண்டுவந்த செயலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִן הַנָּוֶה
  choice: மேய்ச்சல் நிலத்திலிருந்து
  rationale: மந்தைகள் மேயும் அல்லது தங்கும் இடத்தைக் குறிக்கும் சொல்லின் இச்சூழலுக்குரிய முதன்மைப் பொருளைத் தருகிறது.
- source_word: מֵאַחַר הַצֹּאן
  choice: மந்தையைப் பின்தொடர்ந்த
  rationale: ‘மந்தைக்குப் பின்னால்’ என்ற எபிரேய உருவகத்தையும் தாவீதின் மேய்ப்பர் பணியையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: נָגִיד
  choice: தலைவன்
  rationale: அரசன் என்ற குறிப்பிட்ட பட்டத்தை இறக்குமதி செய்யாமல், ஆட்சி செய்ய நியமிக்கப்பட்டவரைக் குறிக்கிறது.
- source_word: עַל עַמִּי עַל יִשְׂרָאֵל
  choice: என் மக்களின்மேல், இஸ்ரவேலின்மேல்
  rationale: இருமுறை வரும் עַל என்பதைப் பாதுகாத்து, மூலத்தின் வலியுறுத்தலையும் இசைவையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பால் தருகிறது.
- issue: தாவீதைக் குறிக்கும் עבד
  choice: பணியாளன்
  alternative: அடிமை
  rationale: இங்கு சொத்து அடிமைத்தனத்தை முன்னிறுத்தாமல், தேவனுக்குச் சேவை செய்கிற உடன்படிக்கைச் சார்ந்த மரியாதை நிலையைச் சொல் குறிக்கிறது.
- issue: נָגִיד என்பதன் ஆட்சிசார் பொருள்
  choice: தலைவன்
  alternative: ஆட்சியாளர் / இளவரசன் / அரசன்
  rationale: தலைமை மற்றும் ஆட்சிப் பொறுப்பைக் காக்கிறது; ஆனால் மூலத்தில் இல்லாத குறிப்பிட்ட அரச பட்டத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான இறைத்தூது நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேயத்தின் இரட்டை ‘மேல்’ அமைப்பு வலியுறுத்தலுக்காகத் தக்கவைக்கப்பட்டுள்ளது; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
