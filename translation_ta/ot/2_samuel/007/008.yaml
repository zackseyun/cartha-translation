- from: '“ஆகையால் இப்போது, என் பணியாளனாகிய தாவீதிடம் நீ சொல்ல வேண்டியது இதுவே: ‘படைகளின் யாவே கூறுவது இதுவே: மேய்ச்சல் நிலத்திலிருந்து[a], மந்தையைப் பின்தொடர்ந்த உன்னை நான் அழைத்துக்கொண்டு, என் மக்களின்மேல், இஸ்ரவேலின்மேல் தலைவனாக வைத்தேன்[b].’”'
  to: '“ஆகையால், இப்போது என் ஊழியனாகிய தாவீதிடம் நீ சொல்ல வேண்டியது இதுவே: ‘படைகளின் யாவே கூறுவது இதுவே: மேய்ச்சல் நிலத்திலிருந்து[a], மந்தையின் பின்னால் சென்றுகொண்டிருந்த உன்னை நான் எடுத்து, என் மக்களின்மேல், இஸ்ரவேலின்மேல் தலைவனாக[b] இருக்கும்படி வைத்தேன்.’”'
