  text: וְ/נֶאְמַ֨ן בֵּיתְ/ךָ֧ וּ/מַֽמְלַכְתְּ/ךָ֛ עַד עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽסְאֲ/ךָ֔ יִהְיֶ֥ה נָכ֖וֹן עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/016.yaml
  text: And your house and your kingdom shall be made sure forever before me[b][a]; your throne shall be established forever.
translation:
  language: ta
  text: உமது வீடும்[a] உமது அரசாட்சியும் உமக்கு முன்பாக[b] என்றென்றும் உறுதிப்படுத்தப்படும்; உமது அரியணை என்றென்றும் நிலைநிறுத்தப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “வீடு” என்பது அரச குடும்ப மரபை, அதாவது வம்சத்தை, குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெய மூலவாசகம்: “உமக்கு முன்பாக”; சில உரைச் சான்றுகள் “எனக்கு முன்பாக” என்று வாசிக்கின்றன.'
    reason: textual_variant
lexical_decisions:
- source_word: וְנֶאְמַן
  choice: உறுதிப்படுத்தப்படும்
  rationale: אמן என்பதன் நிஃபால் வடிவம் உறுதியாக்கப்படுதல், நம்பகமாக நிலைபெறுதல், நீடித்திருத்தல் ஆகிய கருத்துகளைத் தருகிறது. தமிழில் இயல்பாக இருக்கும்போதே அதன் செயப்பாட்டு நுணுக்கத்தையும் இந்தத் தேர்வு காக்கிறது.
- source_word: בֵּיתְךָ
  choice: உமது வீடு
  rationale: בַּיִת என்பதன் நேரடிப் பொருள் ‘வீடு’; இங்கோ அது தாவீதின் அரச குடும்ப மரபையும் குறிக்கலாம். மூல உருவகத்தை முதன்மை உரையில் வைத்துக் கொண்டு, வம்சப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וּמַמְלַכְתְּךָ
  choice: உமது அரசாட்சி
  rationale: מַמְלָכָה என்பது ராஜ்யம், அரசுரிமை அல்லது அரசாட்சி எனப் பொருள்படும். இந்த வாக்குறுதியின் சூழலில் ‘அரசாட்சி’ இயல்பாகவும் பரந்த அரசியல் பொருளுடனும் அமைகிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த காலத்தையும் முடிவற்ற நிலைத்தன்மையையும் குறிக்கும் சொற்றொடர். வசனத்தில் இருமுறை வரும் வலியுறுத்தல் தமிழிலும் இருமுறை காக்கப்பட்டுள்ளது.
- source_word: לְפָנֶיךָ
  choice: உமக்கு முன்பாக
  rationale: வழங்கப்பட்ட WLC உரையின் மெய்யெழுத்து வடிவம் இரண்டாம் நபர் ஆண்பால் ஒருமையை, அதாவது ‘உமக்கு முன்பாக’ என்பதை வாசிக்கிறது. ‘எனக்கு முன்பாக’ என்ற சான்றுப் பாடம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּסְאֲךָ
  choice: உமது அரியணை
  rationale: அரசரின் இருக்கையையும், ஆகுபெயராக அவரது அரசுரிமையையும் குறிக்கும் நேரடியான, மரியாதைமிக்க தமிழ் மொழிபெயர்ப்பு.
- source_word: יִהְיֶה נָכוֹן
  choice: நிலைநிறுத்தப்படும்
  rationale: היה உடன் வரும் נָכוֹן உறுதியாக நிலைபெறுதல் அல்லது நிறுவப்படுதல் என்ற கருத்தைத் தருகிறது. முன்னுள்ள וְנֶאְמַן என்பதற்கான மொழிபெயர்ப்பிலிருந்து அளவான சொல்வேறுபாட்டையும் இது காக்கிறது.
theological_decisions:
- issue: தாவீதின் அரச மரபுக்கான வாக்குறுதியும் அதன் சாத்தியமான மேசியா சார்ந்த முக்கியத்துவமும்
  choice: ‘வீடு,’ ‘அரசாட்சி,’ ‘அரியணை’ ஆகிய அரச மரபுச் சொற்களை வைத்துக் கொண்டு, மேசியா சார்ந்த நிறைவேற்றத்தை மொழிபெயர்ப்பில் வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: ‘வீடு’ என்பதை நேரடியாக ‘வம்சம்’ என மொழிபெயர்த்தல் அல்லது மேசியா சார்ந்த நிறைவேற்றத்தை உரையிலேயே வெளிப்படுத்தல்.
  rationale: வசனம் அதன் உடனடிச் சூழலில் தாவீதின் நீடிக்கும் அரச மரபைப் பற்றிப் பேசுகிறது. அதற்கு விரிவான மேசியா சார்ந்த நிறைவேற்றம் காணப்படலாம்; எனினும் எபிரெய உரை கூறுவதைவிடக் கூடுதலாக அந்த விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல், அதன் இறையியல் ஆழத்தையும் பதற்றத்தையும் காப்பது பொருத்தமானது.
- issue: לְפָנֶיךָ என்பதிலுள்ள உரை வேறுபாடு
  choice: வழங்கப்பட்ட WLC வாசகத்தின்படி ‘உமக்கு முன்பாக’ என்பதை முதன்மை உரையில் வைத்தல்.
  alternative: சில உரைச் சான்றுகளின்படி ‘எனக்கு முன்பாக’ என்று வாசித்தல்.
  rationale: மூலமாக வழங்கப்பட்ட எபிரெய உரை இரண்டாம் நபர் வடிவத்தைக் கொண்டுள்ளது. வேறு சான்றுகளின் முதலாம் நபர் வாசகம் முக்கியமானதாக இருப்பதால் அதை மறைக்காமல் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகப் புரியும் வகையிலும், அரச உடன்படிக்கைச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. இறைவனை நோக்கும் இரண்டாம் நபருக்கு ‘உமது/உமக்கு’ என்ற மரியாதை வடிவம் பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் இணை அமைப்பும் ‘என்றென்றும்’ என்ற மறுபடியும் காக்கப்பட்டுள்ளன.
