- from: இப்போது, உமது அடியானின் வீடு என்றென்றும் உமக்கு முன்பாக நிலைத்திருக்கும்படி, அதை ஆசீர்வதிக்க மனமுவந்தருளும்.[a] ஏனெனில், ஆண்டவராகிய யாவே,[b] நீரே இதைக் கூறியிருக்கிறீர்; உமது ஆசீர்வாதத்தினால் உமது அடியானின் வீடு என்றென்றும் ஆசீர்வதிக்கப்படும்.[c]
  to: இப்போது, உமது அடியானின் வீட்டை[c] ஆசீர்வதிக்க மனமுவந்தருளும்; அது என்றென்றும் உமக்கு முன்பாக இருக்கும்படி. ஏனெனில், ஆண்டவராகிய யாவே,[b] நீரே பேசியிருக்கிறீர்; உமது ஆசீர்வாதத்தினால் உமது அடியானின் வீடு என்றென்றும் ஆசீர்வதிக்கப்படும்.[a]
  rationale: The revision removes interpretive strengthening from “நிலைத்திருக்க,” avoids supplying an object to “have spoken,” corrects the Hebrew title-name explanation, and places the house/dynasty note at the first occurrence. Footnote a is revised so that it is genuinely tied to the passive imperfect at the end of the verse. The full text retains the petitionary, reverential Tamil register and the source’s lexical ambiguity.
