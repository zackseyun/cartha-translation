base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/029.yaml
  text: And now[a], please be willing and bless the house of your servant, that it may continue before you forever. For you, Lord Yahweh, have spoken[c][b], and by your blessing the house of your servant will be blessed forever.
translation:
  language: ta
  text: இப்போது, உமது அடியானின் வீட்டை[c] ஆசீர்வதிக்க மனமுவந்தருளும்; அது என்றென்றும் உமக்கு முன்பாக இருக்கும்படி. ஏனெனில், ஆண்டவராகிய யாவே,[b] நீரே பேசியிருக்கிறீர்; உமது ஆசீர்வாதத்தினால் உமது அடியானின் வீடு என்றென்றும் ஆசீர்வதிக்கப்படும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆசீர்வதிக்கப்படும்” என்பதை “ஆசீர்வதிக்கப்படுவதாக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “ஆண்டவராகிய யாவே” என்பது எபிரெய மொழியிலுள்ள ‘அதோனாய் யாவே’ என்ற பட்டம்-பெயர் இணைப்பைக் குறிக்கிறது.
    reason: alternative_reading
  - marker: c
    text: இங்கே “வீடு” என்பது குடும்பத்தையோ வம்சத்தையோ குறிக்கும் பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹאֵל וּבָרֵךְ
  choice: ஆசீர்வதிக்க மனமுவந்தருளும்
  rationale: הוֹאֵל என்பதிலுள்ள மனமுவந்து இணங்குதல் என்ற வேண்டுதல் நயத்தையும், וּבָרֵךְ என்ற கட்டளையின் பொருளையும் இயல்பான மரியாதைமிக்க தமிழில் இணைக்கிறது.
- source_word: בֵּית עַבְדְּךָ
  choice: உமது அடியானின் வீடு
  rationale: בַּיִת என்பதன் வீடு, குடும்பம், வம்சம் ஆகிய அடுக்குப் பொருள்களைத் தமிழிலும் தீர்மானிக்காமல் காக்கிறது; 'அடியான்' தாவீதின் தாழ்மையான சுயக் குறிப்பை வெளிப்படுத்துகிறது.
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: என்றென்றும் உமக்கு முன்பாக நிலைத்திருக்கும்படி
  rationale: சொல்லளவில் 'என்றென்றும் உமக்கு முன்பாக இருக்க' என்பதே ஆனாலும், இச்சூழலில் தொடர்ந்திருக்கும் இருப்பை இயல்பான தமிழில் 'நிலைத்திருக்க' வெளிப்படுத்துகிறது.
- source_word: אֲדֹנָי יְהוִה
  choice: ஆண்டவராகிய யாவே
  rationale: אֲדֹנָי என்ற பட்டத்தையும் יהוה என்ற உடன்படிக்கைப் பெயரையும் தனித்தனியாகத் தெளிவாகக் காக்கிறது.
- source_word: דִּבַּרְתָּ
  choice: நீரே இதைக் கூறியிருக்கிறீர்
  rationale: எபிரெய நிறைவுற்ற வினை, முன்பு கூறப்பட்ட வாக்குறுதியின் தற்போதைய பொருத்தத்தைச் சுட்டுகிறது; வலியுறுத்தும் சுட்டுப்பெயர் தாவீதின் நம்பிக்கையின் ஆதாரத்தைத் தெளிவாக்குகிறது.
- source_word: וּמִבִּרְכָתְךָ יְבֹרַךְ
  choice: உமது ஆசீர்வாதத்தினால் ... ஆசீர்வதிக்கப்படும்
  rationale: מִן என்பதன் கருவி அல்லது மூலப் பொருளை 'ஆசீர்வாதத்தினால்' தெரிவிக்கிறது; எபிரெயச் சொல் மறுபயன்பாட்டையும் காக்கிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: உடன்படிக்கைச் சூழலிலுள்ள நீடித்த எதிர்காலத்தையும் நிரந்தரத் தன்மையையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: אֲדֹנָי יְהוִה என்ற தெய்வீகப் பட்டம்-பெயர் இணைப்பு
  choice: ஆண்டவராகிய யாவே
  alternative: ஆண்டவராகிய கர்த்தர்
  rationale: மூலத்தில் உள்ள பட்டத்தையும் தனிப்பெயரையும் மறைக்காமல் காக்கிறது; இரண்டையும் ஒரே பட்டமாக்குவதில்லை.
- issue: בַּיִת என்பதை வெளிப்படையாக வம்சம் என்று மொழிபெயர்க்கலாமா
  choice: வீடு
  alternative: வம்சம் / குடும்பம்
  rationale: இவ்வதிகாரத்தில் தாவீதின் வீடும் அவன் வம்சமும் இடையே உள்ள இலக்கிய மற்றும் இறையியல் பன்முகத் தன்மையைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
- issue: לִהְיוֹת என்பதைக் 'இருக்க' அல்லது 'நிலைத்திருக்க' என்று தருவது
  choice: நிலைத்திருக்க
  alternative: இருக்க
  rationale: היה என்பதில் நிலைநாட்டுதல் நேரடியாக இல்லாவிட்டாலும், לְעוֹלָם உடன் வரும் தொடர்ந்த இருப்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; இதை அடிக்குறிப்பு வெளிப்படையாக்குகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க ஜெப நடையைப் பயன்படுத்துகிறது. இறைவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உமது’, ‘நீர்’, ‘கூறியிருக்கிறீர்’ ஆகியவை ஒரே சீரில் வைக்கப்பட்டுள்ளன; ‘வீடு’ என்ற உருவகம் விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
