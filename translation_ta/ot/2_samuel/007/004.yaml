reference: 2 Samuel 7:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֖י בַּ/לַּ֣יְלָה הַ/ה֑וּא וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל נָתָ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/004.yaml
  text: But that night the word of Yahweh came to Nathan[a], saying,
translation:
  language: ta
  text: 'ஆனால், அன்று இரவில் யாவேயின் வார்த்தை நாத்தானுக்கு வந்தது:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ஆனால் ... வந்தது
  rationale: இது கதைநிகழ்வை முன்னெடுத்துச் செல்லும் தொடர் வடிவம். முந்தைய வசனத்தில் நாத்தான் அளித்த ஒப்புதலுக்கு மாறாக இப்போது இறைவாக்கு வருவதால், சூழலில் உள்ள திருப்பத்தை இயல்பாக வெளிப்படுத்த ‘ஆனால்’ பயன்படுத்தப்பட்டது.
- source_word: בַּלַּיְלָה הַהוּא
  choice: அன்று இரவில்
  rationale: எபிரெயச் சொற்றொடரின் காலக் குறிப்பை இயல்பான நவீன தமிழில் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: וַיְהִי דְּבַר יְהוָה
  choice: யெகோவாவின் வார்த்தை ... வந்தது
  rationale: இது இறைவெளிப்பாட்டைக் குறிக்கும் வழக்கமான தீர்க்கதரிசனச் சூத்திரம். ‘வார்த்தை வந்தது’ என்பது அதன் வடிவத்தையும் கருத்தையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் வரும் இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நீண்டகாலமாக அறியப்பட்ட பெயர்வடிவத்தில் தருகிறது.
- source_word: אֶל נָתָן
  choice: நாத்தானுக்கு
  rationale: வெளிப்பாட்டைப் பெறுபவரைச் சுட்டும் אֶל என்பதற்கு இயல்பான தமிழ் வேற்றுமை வடிவம்.
- source_word: לֵאמֹר
  choice: (அடுத்த வசனத்தின் நேரடி உரையை அறிமுகப்படுத்தும் முக்காற்புள்ளி)
  rationale: ‘சொல்லி’ என்று தனியே சேர்ப்பது தமிழில் தேவையற்றதாக இருக்கலாம்; முக்காற்புள்ளி தொடர்ந்து வரும் இறைவாக்கை இயல்பாக அறிமுகப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரை ‘கர்த்தர்’ போன்ற பட்டமாக மாற்றாமல் பாதுகாக்கிறது. ‘யெகோவா’ நவீன தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவம்; எபிரெய உச்சரிப்பை மீட்டுருவாக்கும் ‘யாவே’ என்பதும் சாத்தியமான மாற்று.
- issue: וַיְהִי என்பதன் தொடர்பு நுணுக்கம்
  choice: ஆனால்
  alternative: அப்போது / நிகழ்ந்ததாவது
  rationale: முந்தைய வசனத்தில் நாத்தான் தாவீதுக்கு அளித்த ஒப்புதலுக்கும் இப்போது வரும் யெகோவாவின் திருத்தும் செய்திக்கும் இடையிலான சூழல்சார் முரணை ‘ஆனால்’ வெளிப்படுத்துகிறது; எபிரெய இணைப்புச் சொல் தனியாக வெளிப்படையான எதிர்மறைப் பொருளைக் கட்டாயப்படுத்துவதில்லை.
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ். சுருக்கமான தீர்க்கதரிசன அறிமுகச் சூத்திரம் பாதுகாக்கப்பட்டுள்ளது; அடுத்த வசனத்தில் தொடங்கும் நேரடி உரையை முக்காற்புள்ளி அறிமுகப்படுத்துகிறது.
