base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/002.yaml
  text: And the king said to Nathan the prophet[a], “See now, I dwell in a house of cedar, but the ark of God dwells within curtains.”
translation:
  language: ta
  text: அரசன் இறைவாக்கினரான நாத்தானிடம், “பாருங்கள், நான் கேதுரு மரத்தால் ஆன வீட்டில் குடியிருக்கிறேன்; ஆனால் கடவுளின் பேழையோ கூடாரத் திரைகளுக்குள்[a] இருக்கிறது” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கூடாரத் திரைக்குள்.” எபிரெயச் சொல் கூடாரத்தின் திரை அல்லது தொங்குதுணியைக் குறிக்கிறது; ஒருமை வடிவம் திரைகளைக் கூட்டாகவும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: அரசன் ... என்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது; மூலத்தில் பெயர் சொல்லப்படாததால் ‘தாவீது’ சேர்க்கப்படவில்லை.
- source_word: נָתָן הַנָּבִיא
  choice: இறைவாக்கினரான நாத்தான்
  rationale: தனிப்பெயரையும் அவருடைய தீர்க்கதரிசிப் பணியையும் தெளிவாகவும் இயல்பாகவும் அடையாளப்படுத்துகிறது.
- source_word: רְאֵה נָא
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கட்டளையையும் נָא துகளின் மென்மையையும் நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; வேண்டுகோளாக மிகைப்படுத்தவில்லை.
- source_word: בְּבֵית אֲרָזִים
  choice: கேதுரு மரத்தால் ஆன வீட்டில்
  rationale: கேதுரு மரத்தால் கட்டப்பட்ட அல்லது அலங்கரிக்கப்பட்ட இல்லம் என்ற பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: וַאֲרוֹן הָאֱלֹהִים
  choice: ஆனால் கடவுளின் பேழையோ
  rationale: ו conjunction இங்கு தாவீதின் இல்லத்துக்கும் பேழையின் இருப்பிடத்துக்கும் உள்ள முரண்பாட்டைக் காட்டுகிறது; ‘பேழை’ என்பது பெட்டி வடிவிலான புனிதப் பொருளைச் சுருக்கமாகக் குறிக்கிறது.
- source_word: יוֹשֵׁב
  choice: குடியிருக்கிறேன் / இருக்கிறது
  rationale: தாவீதுக்குப் ‘குடியிருக்கிறேன்’ என்பது வசிப்பைக் குறிக்கிறது; உயிரற்ற பேழைக்குத் தமிழில் இயல்பாக ‘இருக்கிறது’ பயன்படுத்தப்படுகிறது, அதே இருப்பிட ஒப்பீடு காக்கப்படுகிறது.
- source_word: בְּתוֹךְ הַיְרִיעָה
  choice: கூடாரத் திரைகளுக்குள்
  rationale: יְרִיעָה கூடாரத்தின் துணித் திரை அல்லது தொங்குதுணியைக் குறிக்கிறது. பன்மை வடிவம் அதன் கூட்டுப்பொருளைத் தமிழில் இயல்பாகக் காட்டுகிறது; ‘கூடாரம்’ என்று பொதுமைப்படுத்தாமல் மூலத்தின் குறிப்பான படிமத்தைக் காக்கிறது.
theological_decisions:
- issue: பேழையின் தற்காலிக இருப்பிடம்
  choice: கூடாரத் திரைகளுக்குள்
  alternative: கூடாரத்துக்குள்
  rationale: மூலம் கூடாரத்தைப் பொதுவாகச் சொல்லாமல் அதன் திரை அல்லது மூடுதுணியைக் குறிப்பாகச் சொல்கிறது. ஆகவே பிற்கால ஆலயக் கருத்துகளைச் சேர்க்காமல் அந்தத் தற்காலிக, துணியாலான அமைப்பின் படிமம் காக்கப்படுகிறது.
- issue: אֲרוֹן הָאֱלֹהִים என்பதன் பெயர்ப்பு
  choice: கடவுளின் பேழை
  alternative: கடவுளின் உடன்படிக்கைப் பெட்டி
  rationale: இந்த வசனத்தில் ‘உடன்படிக்கை’ என்ற சொல் வெளிப்படையாக இல்லை. அடையாளத்தை விளக்குவதற்காக அந்தச் சொல்லைச் சேர்க்காமல், மூலத்தின் சுருக்கமான பெயரே காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அரசன்’, ‘இறைவாக்கினர்’, ‘பேழை’ ஆகியவை வேதாகமச் சூழலின் உயர்நடையைத் தக்கவைத்தாலும் பொதுவாசகருக்குப் புரியக்கூடியவை. ‘இதோ’ என்பது சொல்லுக்கு சொல் கடினமான ‘இப்போது பார்’ என்பதற்குப் பதிலாக இயல்பான கவன ஈர்ப்புச் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது.
