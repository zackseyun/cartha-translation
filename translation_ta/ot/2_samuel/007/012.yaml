  source_fidelity: திருத்தம் தேவை. எபிரெய வாக்கியத்தில் זַרְעֲךָ இலக்கணப்படி ஒருமையாக வந்து, அதைத் தொடர்ந்து வரும் உறவுச் சொற்றொடரும் அரசாட்சியைச் சுட்டும் பிரதிப்பெயரும் ஒருமையிலேயே உள்ளன. வரைவின் ‘சந்ததியை—...வரப்போகிறவனை’ என்ற இணைப்பு தமிழில் ஒரே பொருளுக்கான வேற்றுமைத் தொடரில் இயல்பற்றதும் இலக்கண ஒத்திசைவற்றதுமாக உள்ளது. ‘அரசு’ என்பதைவிட ‘அரசாட்சி’ மַמְלַכְתּוֹவின் அரசுரிமை/ராஜ்யப் பொருளைத் துல்லியமாகக் காட்டுகிறது.
  naturalness: ‘உன் உடலிலிருந்து பிறக்கவிருக்கும் உன் வழித்தோன்றலை’ என்பது நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘முன்னோர்களோடு படுத்துக்கொள்ளும்போது’ என்ற மரபுத்தொடர் உரையில் காக்கப்பட்டு, அதன் மரணப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
  terminology: ‘வழித்தோன்றல்’ இவ்வசனத்தின் ஒருமைத் தொடருக்கு இயல்பாகப் பொருந்துகிறது; அதன் கூட்டுப் பொருள் அல்லது பிரதிநிதித்துவ ஒருமைச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது. ‘அரசாட்சி’ அரச வம்ச வாக்குறுதியின் சூழலில் ‘அரசு’ என்பதைவிடச் சரியானது.
