  text: כִּ֣י יִמְלְא֣וּ יָמֶ֗י/ךָ וְ/שָֽׁכַבְתָּ֙ אֶת אֲבֹתֶ֔י/ךָ וַ/הֲקִימֹתִ֤י אֶֽת זַרְעֲ/ךָ֙ אַחֲרֶ֔י/ךָ אֲשֶׁ֥ר יֵצֵ֖א מִ/מֵּעֶ֑י/ךָ וַ/הֲכִינֹתִ֖י אֶת מַמְלַכְתּֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/012.yaml
  text: When your days are fulfilled and you lie down with your fathers[a], I will raise up your offspring after you, who will come from your own body[b], and I will establish his kingdom.
translation:
  language: ta
  text: உன் வாழ்நாட்கள் நிறைவடைந்து, நீ உன் முன்னோர்களோடு படுத்துக்கொள்ளும்போது[a], உனக்குப் பின் உன் உடலிலிருந்து பிறக்கவிருக்கும் உன் வழித்தோன்றலை[b][c] நான் எழுப்பி, அவனுடைய அரசாட்சியை நிலைநிறுத்துவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முன்னோர்களோடு படுத்துக்கொள்வது’ என்பது இறந்து முன்னோர்களோடு சேர்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: எபிரெயில் ‘உன் விதை.’ இச்சொல் சந்ததியினரை மொத்தமாகவோ, அவர்களைப் பிரதிநிதித்துவப்படுத்தும் ஒரு வழித்தோன்றலையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்கு சொல், ‘உன் உள்ளுறுப்புகளிலிருந்து’; அதாவது, உன் உடலிலிருந்து பிறக்கும் உயிரியல் வழித்தோன்றல்.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יִמְלְאוּ יָמֶיךָ
  choice: உன் வாழ்நாட்கள் நிறைவடைந்து ... போது
  rationale: כִּי இங்கு காரணத்தைக் காட்டுவதற்குப் பதிலாக எதிர்காலக் காலச்சூழலை அறிமுகப்படுத்துகிறது. ‘வாழ்நாட்கள் நிறைவடைந்து’ என்பது எபிரெய உருவகத்தையும் அதன் கம்பீரமான தொனியையும் காக்கிறது.
- source_word: וְשָׁכַבְתָּ אֶת־אֲבֹתֶיךָ
  choice: நீ உன் முன்னோர்களோடு படுத்துக்கொள்ளும்போது
  rationale: இது மரணத்தையும் முன்னோர்களோடு சேர்வதையும் குறிக்கும் வழக்கமான எபிரெய மரபுத்தொடர். ‘முன்னோர்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் உள்ளடக்கத்தின் பரப்பைச் சுருக்காமலும் உள்ளது.
- source_word: וַהֲקִימֹתִי
  choice: நான் எழுப்பி
  rationale: קום என்பதன் ஹிஃபில் வடிவம் இங்கு ஒருவரை வாரிசாக எழும்பச் செய்வதைக் குறிக்கிறது. ‘எழுப்பி’ என்பது வாரிசுரிமை சார்ந்த இயக்கத்தைக் காக்கிறது.
- source_word: זַרְעֲךָ
  choice: உன் சந்ததியை
  rationale: זֶרַע என்பதற்கு ‘விதை’, ‘சந்ததி’, ‘வழித்தோன்றல்’ ஆகிய பொருள்கள் உண்டு; அது கூட்டுப் பொருளிலும் பிரதிநிதித்துவ ஒருமையிலும் அமையலாம். ‘சந்ததி’ இந்தப் பொருள் நெகிழ்வை இயன்றவரை காக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: אַחֲרֶיךָ
  choice: உனக்குப் பின்
  rationale: தாவீதுக்குப் பிறகு வரும் வாரிசைக் குறிக்கும் நேரடியான கால மற்றும் வாரிசுரிமைச் சொற்றொடர்.
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: உன் சொந்த உடலிலிருந்து வரப்போகிறவனை
  rationale: מֵעֶה என்பதன் சொற்பொருள் உடலின் உள்ளுறுப்புகள்; இங்கு அது நேரடியான உயிரியல் வழித்தோன்றலைக் குறிக்கும் மரபுத்தொடர். ‘சொந்த உடலிலிருந்து’ என்பது பழமையான அல்லது இயற்கையற்ற சொல்லாட்சியின்றி வலியுறுத்தலைத் தெரிவிக்கிறது.
- source_word: וַהֲכִינֹתִי
  choice: நிலைநிறுத்துவேன்
  rationale: כון என்பதன் ஹிஃபில் வடிவம் உறுதிப்படுத்துதல் அல்லது நிலைபெறச் செய்தல் என்று பொருள்படும். ‘நிலைநிறுத்துவேன்’ என்பது அரச வாக்குறுதியின் உறுதித்தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: מַמְלַכְתּוֹ
  choice: அவனுடைய அரசை
  rationale: מַמְלָכָה என்பது அரசு, அரசாட்சி அல்லது ராஜ்யம் எனப் பொருள்படலாம். இங்கு வாரிசுக்குரிய அரசியல் ஆட்சித்தளத்தை ‘அரசு’ தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: தாவீதுக்குக் கொடுக்கப்பட்ட வாக்குறுதியில் זַרְעֲךָ என்பதன் பரப்பு
  choice: உன் சந்ததியை
  alternative: உன் வழித்தோன்றலை / உன் விதையை
  rationale: எபிரெயச் சொல் கூட்டான சந்ததியையும் ஒரு பிரதிநிதித்துவ வழித்தோன்றலையும் குறிக்கக்கூடும். தொடரும் ஒருமை வினை மற்றும் ‘அவனுடைய’ என்ற சுட்டு ஒரு குறிப்பிட்ட வாரிசை முன்னிறுத்துகின்றன; ஆயினும் ‘சந்ததி’ என்ற தேர்வு வம்சத் தொடரின் பரந்த சாத்தியத்தை அழித்துவிடாது. இதனால் உடனடி அரச வாரிசையும் விரிந்த வேதாகமப் பாதையையும் உரைக்குள் தேவையின்றித் தீர்மானித்துவிடாமல் வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வாழ்நாட்கள் நிறைவடைந்து,’ ‘எழுப்பி,’ ‘நிலைநிறுத்துவேன்’ ஆகியவை மூலத்தின் கம்பீரத்தையும் உடன்படிக்கை-அரச மொழிநடையையும் காக்கின்றன; அடிக்குறிப்புகள் எபிரெய மரபுத்தொடர்களையும் זֶרַע என்பதன் உண்மையான பொருள் நெகிழ்வையும் விளக்குகின்றன.
