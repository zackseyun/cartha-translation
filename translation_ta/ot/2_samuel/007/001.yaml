base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/001.yaml
  text: When the king was living in his house[a], and Yahweh had given him rest on every side from all his enemies,
translation:
  language: ta
  text: அரசன் தன் வீட்டில்[a] குடியிருந்தபோது, யாவே அவனைச் சுற்றியிருந்த அவனுடைய எல்லா எதிரிகளிடமிருந்தும் அவனுக்கு ஓய்வு அளித்திருந்தார்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் அரண்மனையில்.’ எபிரெயத்தில் ‘தன் வீட்டில்’; இவ்வதிகாரத்தில் பின்னர் வரும் சொல்விளையாட்டைக் காக்க ‘வீடு’ இங்கே தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: …போது
  rationale: புதிய நிகழ்வை அறிமுகப்படுத்தும் எபிரெய காலத் தொடரை, தேவையற்ற ‘இப்போது’ போன்ற சொல்லைச் சேர்க்காமல் இயல்பான தமிழ்க் காலத் துணைவாக்கியமாக வழங்குகிறது.
- source_word: יָשַׁב
  choice: குடியிருந்த
  rationale: இங்கு உட்கார்ந்திருப்பதை அல்ல, நிலையாக வசித்திருப்பதைக் குறிக்கிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: எபிரெய மூலத்தில் தாவீதின் பெயருக்குப் பதிலாக உள்ள திட்டவட்டமான பட்டத்தைப் பாதுகாக்கிறது.
- source_word: בְּבֵיתוֹ
  choice: தன் வீட்டில்
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருளான ‘வீடு’ என்பதைக் காக்கிறது; மேலும், அதிகாரத்தின் பிற்பகுதியில் வரும் ‘வீடு’ என்ற சொல்லின் இலக்கியச் சொல்விளையாட்டையும் முன்னறிவிக்கிறது.
- source_word: וַיהוָה
  choice: யாவே
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரான יהוה-ஐ பெயராகவே ஒலிபெயர்க்கிறது.
- source_word: הֵנִיחַ לוֹ
  choice: அவனுக்கு ஓய்வு அளித்திருந்தார்
  rationale: נוח என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளைத் தக்கவைத்து, போர் மற்றும் எதிரிகளின் தொல்லையிலிருந்து கிடைத்த அமைதியான ஓய்வை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִסָּבִיב מִכָּל אֹיְבָיו
  choice: அவனைச் சுற்றியிருந்த அவனுடைய எல்லா எதிரிகளிடமிருந்தும்
  rationale: ஓய்வு எதிலிருந்து கிடைத்தது என்பதையும் எல்லாப் பக்கங்களிலும் நிலவிய பாதுகாப்பையும் ஒருங்கிணைத்து தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, நான்கெழுத்து உடன்படிக்கைப் பெயரே உள்ளது; எனவே அதைத் தனிப்பெயராகத் தக்கவைக்கிறது.
- issue: בַּיִת என்பதிலுள்ள அரச குடியிருப்பு நுட்பம்
  choice: வீடு
  alternative: அரண்மனை
  rationale: சூழலில் அரச அரண்மனை குறிக்கப்படலாம்; இருப்பினும் ‘வீடு’ என்பது மூலச்சொல்லுக்கு நெருக்கமானதுடன், இவ்வதிகாரம் முழுவதும் தொடரும் தாவீதின் வீடு, யாவேயின் வீடு என்ற இலக்கிய மற்றும் இறையியல் பதற்றத்தையும் சொல்விளையாட்டையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொடரும் வாக்கியம் என்பதால் மூலத்தைப் போல இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது; கடவுளைக் குறிக்கும் வினையில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
