base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/028.yaml
  text: And now[a], Lord GOD, you are God, and your words are true[b], and you have spoken this good thing to your servant.
translation:
  language: ta
  text: இப்போது, ஆண்டவரே, யாவே[a], நீரே கடவுள்; உமது வார்த்தைகள் உண்மையானவை[b], உமது அடியவனுக்கு இந்த நன்மையான காரியத்தை நீர் சொல்லியிருக்கிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: “அதோனாய் யாவே”; அதாவது, “ஆண்டவரே, யாவே.”'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உமது வார்த்தைகள் உண்மையாகும்”; அல்லது, “உமது வார்த்தைகள் நம்பத்தக்கவை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: ஆண்டவராகிய யெகோவாவே
  rationale: אֲדֹנָי என்பதன் ‘ஆண்டவர்’ பொருளையும், יהוה என்ற தனிப்பெயரையும் வேறுபடுத்திக் காக்கிறது; நேரடி அழைப்பை ‘-வே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: நீரே கடவுள்
  rationale: הוּא உடன் வரும் வலியுறுத்தலை தமிழ் ‘-ஏ’ வெளிப்படுத்துகிறது; மரியாதை ஒருமையான ‘நீர்’ ஜெப நடைக்கு ஏற்றது.
- source_word: דְבָרֶיךָ
  choice: உமது வார்த்தைகள்
  rationale: மூலத்தின் பன்மையைப் பாதுகாக்கிறது; ‘வாக்குறுதிகள்’ என்று சூழலுக்கேற்பக் குறுக்கவில்லை.
- source_word: יִהְיוּ אֱמֶת
  choice: உமது வார்த்தைகள் உண்மையானவை
  rationale: இங்கு imperfect வடிவம் நிலையான மெய்ம்மையை உறுதிப்படுத்துவதாகப் புரிந்துகொள்ளப்படுகிறது; אֱמֶת என்பதன் உண்மை மற்றும் நம்பகத்தன்மை சார்ந்த பரப்பை இயல்பான தமிழில் தருகிறது.
- source_word: וַתְּדַבֵּר
  choice: நீர் சொல்லியிருக்கிறீர்
  rationale: முன்பு உரைக்கப்பட்டு தற்போது பொருத்தமுடைய தெய்வீக பேச்சைக் குறிக்கிறது; ‘வாக்குறுதி அளித்தீர்’ என விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: אֶל עַבְדְּךָ
  choice: உமது அடியவனுக்கு
  rationale: கடவுளுக்கு முன் தாவீதின் பணிவான சுயக்குறிப்பை இயல்பான தமிழ் ஜெப நடையில் வெளிப்படுத்துகிறது.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: இந்த நன்மையான காரியத்தை
  rationale: ‘இந்த நல்லது’ என்ற எபிரேயச் சொல்லாட்சியின் பரந்த தன்மையைத் தக்கவைக்கிறது; ‘வாக்குறுதி’ அல்லது ‘ஆசீர்வாதம்’ எனத் தேவையின்றிக் குறிப்பாக்கவில்லை.
theological_decisions:
- issue: אֲדֹנָי יְהוִה என்ற கூட்டு இறை அழைப்பில் יהוה-ஐ மொழிபெயர்த்தல்
  choice: ஆண்டவராகிய யெகோவாவே
  alternative: ஆண்டவராகிய யாவே / கர்த்தராகிய ஆண்டவரே
  rationale: உரையில் உள்ள இரு கூறுகளையும் ஒன்றாக்காமல் வேறுபடுத்தி, יהוה என்பதைப் பொதுப்பட்டமாக மாற்றாமல் தனிப்பெயராகக் காக்கிறது.
- issue: יִהְיוּ אֱמֶת என்பதின் காலமும் பொருள் நுணுக்கமும்
  choice: உமது வார்த்தைகள் உண்மையானவை
  alternative: உமது வார்த்தைகள் உண்மையாகும் / உமது வார்த்தைகள் நம்பத்தக்கவை
  rationale: வடிவரீதியாக எதிர்கால அல்லது தொடர்நிலை வாசிப்பு சாத்தியமானாலும், இச்சூழலில் இது கடவுளின் வார்த்தைகளின் நிலையான உண்மையை அறிக்கையிடுகிறது; மாற்று வாசிப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன, கண்ணியமான தமிழ் ஜெப நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய மரியாதை ஒருமை வடிவங்களான ‘நீர்’, ‘உமது’ பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
