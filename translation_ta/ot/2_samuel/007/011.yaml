base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/011.yaml
  text: and from the day that I appointed judges over my people Israel[a]. And I have given you rest from all your enemies. Yahweh also declares to you that Yahweh will make a house for you.
translation:
  language: ta
  text: நான் என் மக்களாகிய இஸ்ரவேலின்மேல் நீதித்தலைவர்களை நியமித்த நாள்முதல் இருந்ததுபோல அல்லாமல், உன் எல்லா எதிரிகளிடமிருந்தும் உனக்கு இளைப்பாறுதலை அளித்திருக்கிறேன். மேலும், யாவே உனக்கு ஒரு வீட்டை ஏற்படுத்துவார்[a] என்று யாவே உனக்கு அறிவிக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, ‘யாவே உனக்காக ஒரு வீட்டைக் கட்டுவார்.’ இங்கே ‘வீடு’ என்பது அரச வம்சத்தைக் குறிக்கும் பொருளையும் கொண்டிருக்கலாம்; அதேவேளை, யாவேக்கு ஒரு வீடு (ஆலயம்) கட்ட வேண்டும் என்ற தாவீதின் விருப்பத்தையும் இது எதிரொலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמִן הַיּוֹם אֲשֶׁר צִוִּיתִי שֹׁפְטִים עַל עַמִּי יִשְׂרָאֵל
  choice: நான் என் மக்களான இஸ்ரவேலின்மேல் நீதித்தலைவர்களை நியமித்த நாள்முதல் இருந்ததுபோல அல்லாமல்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் ஒப்பீட்டு அமைப்பைத் தமிழில் முழுமையாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது. שֹׁפְטִים என்பது வெறும் நீதிமன்ற நீதிபதிகள் அல்லாமல் இஸ்ரவேலை வழிநடத்திய ஆட்சித் தலைவர்களைக் குறிப்பதால் ‘நீதித்தலைவர்கள்’ எனத் தரப்பட்டது.
- source_word: וַהֲנִיחֹתִי לְךָ מִכָּל אֹיְבֶיךָ
  choice: உன் எதிரிகள் அனைவரிடமிருந்தும் உனக்கு இளைப்பாறுதல் அளித்திருக்கிறேன்
  rationale: נוח என்பதன் ஹிஃபில் வடிவிலுள்ள ‘ஓய்வு/விடுதலை அளித்தல்’ என்ற பொருளையும், நிறைவேறிய செயல் தற்போதும் விளைவுடையது என்ற நுணுக்கத்தையும் காக்கிறது.
- source_word: וְהִגִּיד לְךָ יְהוָה
  choice: மேலும், யாவே ... உனக்கு அறிவிக்கிறார்
  rationale: וְ என்பதன் இணைப்பு மற்றும் உரையின் திருப்பத்தை ‘மேலும்’ வெளிப்படுத்துகிறது; נגד என்பதன் முறையான அறிவிப்பு நுணுக்கத்தை ‘அறிவிக்கிறார்’ காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமமான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כִּי בַיִת יַעֲשֶׂה לְּךָ יְהוָה
  choice: யாவே உனக்கு ஒரு வீட்டை ஏற்படுத்துவார்
  rationale: בַיִת என்பதிலுள்ள கட்டிடம் மற்றும் அரச வம்சம் ஆகிய இரட்டை எதிரொலியை ‘வீடு’ காக்கிறது; עשה என்பதற்கு ‘கட்டுவார்’ என்று கட்டிடப் பொருளை மட்டும் வலியுறுத்தாமல் ‘ஏற்படுத்துவார்’ எனத் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: தாவீதுக்கான வாக்குறுதியில் בַיִת என்பதன் பொருள்
  choice: வீடு; வம்சப் பொருளை அடிக்குறிப்பில் சுட்டுதல்
  alternative: அரச வம்சம் / ஆலயம்
  rationale: எபிரெயச் சொல்லின் கட்டிடம்–குடிவழி இரட்டைப் பொருளையும், தாவீது யாவேக்கு வீடு கட்ட விரும்பியதற்கும் யாவே தாவீதுக்கு ‘வீடு’ ஏற்படுத்துவதாகக் கூறுவதற்கும் இடையிலான சொல்விளையாட்டையும் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. வசனம் முந்தைய வாக்கியத்தின் ஒப்பீட்டைத் தொடருவதால், தனியாக வாசிக்கும் போதும் இலக்கணத் தொடர்பு தெளிவாக இருக்க ‘இருந்ததுபோல அல்லாமல்’ சேர்க்கப்பட்டது; இது முந்தைய வசனத்தின் தொடர்ச்சியை வெளிப்படுத்தும் சூழல்சார் நிரப்பு.
