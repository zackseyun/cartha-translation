  verdict: revise
  source_fidelity: 'முதன்மை உரை எபிரெயத்தின் முக்கிய கூறுகளைச் சரியாகக் காக்கிறது: யாவே என்ற இறைநாமம், எதிரிகளிடமிருந்து அளிக்கப்படும் இளைப்பாறுதல், மற்றும் בַּיִת என்பதன் திறந்த ‘வீடு’ உருவகம் ஆகியவை நன்றாகத் தரப்பட்டுள்ளன. ‘மேலும்’ என்பது וְ-இன் இணைப்புத் தன்மைக்கு ஏற்ற பாதுகாப்பான நடை. ஆனால் அடிக்குறிப்பு ‘வீடு’ என்பதை உறுதியாக ‘அதாவது ... அரச வம்சம்’ என்று தீர்மானிப்பதால் மூலத்தின் வேண்டுமென்ற இரட்டைப் பொருளைச் சுருக்குகிறது.'
  naturalness: நடை நவீனத் தரத் தமிழில் கண்ணியமாகவும் பெரும்பாலும் இயல்பாகவும் உள்ளது. ‘என் மக்களான இஸ்ரவேல்’ என்பதற்குப் பதில் ‘என் மக்களாகிய இஸ்ரவேல்’ சிறிது இயல்பான இணைப்பாகும்; ‘உன் எல்லா எதிரிகளிடமிருந்தும்’ என்பதும் தெளிவானது. முதல் தொடர் முந்தைய வசனத்தின் தொடர்ச்சியான ஒப்பீட்டு அமைப்பாக இருப்பதால், வரைவு பயன்படுத்திய ‘இருந்ததுபோல அல்லாமல்’ என்ற சூழல்சார் தொடரைத் தக்கவைத்துள்ளேன்.
  terminology: ‘யாவே’, ‘இளைப்பாறுதல்’, ‘நீதித்தலைவர்கள்’, ‘வீடு’ ஆகியவை பொருத்தமானவை. அடிக்குறிப்பில் ‘மாற்றாக’ எனக் குறிப்பிட்டு ‘கட்டுவார்’ என்பதை மாற்று மொழிபெயர்ப்பாகத் தர வேண்டும்; அரச வம்சப் பொருளை ‘சாத்தியமான/முதன்மையான எதிரொலி’ என விளக்க வேண்டும்; அதனை ஒரே பொருளாக அறிவிக்கக் கூடாது.
