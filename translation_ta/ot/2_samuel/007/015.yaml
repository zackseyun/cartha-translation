source:
  edition: WLC
  text: וְ/חַסְדִּ֖/י לֹא יָס֣וּר מִמֶּ֑/נּוּ כַּ/אֲשֶׁ֤ר הֲסִרֹ֨תִי֙ מֵ/עִ֣ם שָׁא֔וּל אֲשֶׁ֥ר הֲסִרֹ֖תִי מִ/לְּ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/015.yaml
  text: But my steadfast love will not depart from him[a], as I removed it from Saul[b], whom I removed from before you.
translation:
  language: ta
  text: ஆனால், என் மாறாத அன்பு அவனைவிட்டு விலகாது[a]; உன் முன்னிருந்து நான் அகற்றிய சவுலிடமிருந்து அதை விலக்கியதுபோல[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாறாத அன்பு’ என்பதற்கு ‘பேரன்பு’ அல்லது ‘உடன்படிக்கைக்கு உண்மையான அன்பு’ என்றும் பொருள் கொள்ளலாம். எபிரேயச் சொல் உறவிலும் உடன்படிக்கையிலும் நிலைத்திருக்கும் பற்றுறுதியுள்ள அன்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘உன் முன்னிருந்து நான் அகற்றிய சவுலிடமிருந்து.’ இது வெறும் உடல்சார்ந்த இடமாற்றத்தை மட்டுமல்லாமல், தாவீதுடன் தொடர்புடைய சவுலின் அரச நிலையிலிருந்து அவர் அகற்றப்பட்டதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדִּי
  choice: என் மாறாத அன்பு
  rationale: חֶסֶד என்பது இங்கு வெறும் உணர்ச்சியையோ இரக்கத்தையோ அல்லாமல், உறவிலும் உடன்படிக்கையிலும் நிலைத்திருக்கும் உண்மையான அன்பைக் குறிக்கிறது. ‘மாறாத அன்பு’ என்பது அதன் நிலைத்தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָסוּר
  choice: விலகாது
  rationale: סור என்பதன் ‘விலகு, அகன்று போ’ என்ற பொருள், அன்பை எழுவாயாக வைத்துள்ள இச்சூழலில் ‘விலகாது’ என்று இயல்பாக அமைகிறது.
- source_word: מִמֶּנּוּ
  choice: அவனைவிட்டு
  rationale: מן முன்னொட்டுடன் சேர்ந்த ஆண்பால் ஒருமைச் சுட்டுப்பெயர், வாக்குறுதி அளிக்கப்பட்ட மகன் அல்லது அரச வழித்தோன்றலைக் குறிக்கிறது; ‘அவனைவிட்டு’ பிரிவைக் தெளிவாகக் காட்டுகிறது.
- source_word: כַּאֲשֶׁר
  choice: …போல்
  rationale: சவுலுக்கு நிகழ்ந்ததையும் வாக்குறுதி அளிக்கப்பட்ட மகனுக்கு நிகழாததையும் ஒப்பிடும் எபிரேய அமைப்பைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: הֲסִרֹתִי
  choice: விலக்கியது / அகற்றியது
  rationale: סור என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளைக் கொண்டது. அன்பைப் பொறுத்த இடத்தில் ‘விலக்கினேன்’ என்றும், சவுலைப் பொறுத்த இடத்தில் ‘அகற்றினேன்’ என்றும் தமிழ்ச் சூழலுக்கேற்றவாறு வேறுபடுத்தப்பட்டுள்ளது.
- source_word: מֵעִם שָׁאוּל
  choice: சவுலிடமிருந்து
  rationale: சவுலுடன் இருந்த தொடர்பிலிருந்து அன்பு நீக்கப்பட்டதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֲשֶׁר הֲסִרֹתִי מִלְּפָנֶיךָ
  choice: உன் முன்னிருந்து நான் அகற்றிய
  rationale: ‘உனக்கு முன்பாக இருந்து’ என்ற எபிரேய உருவகத்தைத் தக்கவைத்து, அது வெறும் இடமாற்றமா அல்லது தாவீதுடன் தொடர்புடைய அரச நிலை நீக்கமா என்பதை உரையிலேயே முடிவுசெய்யாமல் விடுகிறது.
theological_decisions:
- issue: தாவீதுடனான உடன்படிக்கைச் சூழலில் חֶסֶד என்பதன் தன்மை
  choice: மாறாத அன்பு
  alternative: இரக்கம்; பேரன்பு; உடன்படிக்கைப் பற்றுறுதி
  rationale: இவ்வசனம் தாவீதின் வழியின்மீது தொடரும் இறைவனுடைய அன்பையும் சவுலிடமிருந்து விலக்கப்பட்ட ஆதரவையும் வேறுபடுத்துகிறது. ‘மாறாத அன்பு’ உடன்படிக்கை சார்ந்த உறுதியை உணர்த்துகிறது; அதேவேளையில் குறுகிய கோட்பாட்டு சொல்லாக்கத்தைத் திணிக்கவில்லை.
- issue: ‘உன் முன்னிருந்து’ என்பதன் குறிப்பு
  choice: எபிரேய உருவகத்தை உரையில் தக்கவைத்தல்
  alternative: உன் முன்னிலையிலிருந்து; உனக்கு முன்பாக அரசனாக இருந்த நிலையிலிருந்து
  rationale: இந்தச் சொற்றொடர் சவுல் தாவீதுடன் தொடர்புடைய நிலையிலிருந்து அகற்றப்பட்டதைக் குறித்தாலும், அது எவ்வாறு புரிந்துகொள்ளப்பட வேண்டும் என்பதை எபிரேயம் முழுமையாக விளக்கவில்லை. ஆகவே அரச பதவியை வெளிப்படையாகச் சேர்க்காமல் உண்மையான தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்கும் புரியக்கூடிய மரியாதையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘கிருபை’ போன்ற மரபுவழிக் கோட்பாட்டுச் சொற்களைத் தவிர்த்து, חֶסֶד என்பதன் உறவு மற்றும் உடன்படிக்கை சார்ந்த நிறை ‘மாறாத அன்பு’ என வழங்கப்பட்டுள்ளது. ஒப்பீட்டின் எதிர்மறை வலிமையை இயல்பாக வெளிப்படுத்த நீண்ட கோடு பயன்படுத்தப்பட்டுள்ளது.
