source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר נָתָן֙ אֶל הַ/מֶּ֔לֶךְ כֹּ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ לֵ֣ךְ עֲשֵׂ֑ה כִּ֥י יְהוָ֖ה עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/003.yaml
  text: And Nathan said to the king[a], “Go, do all that is in your heart, for Yahweh is with you.”
translation:
  language: ta
  text: நாத்தான் அரசனிடம், “உங்கள் உள்ளத்தில் இருப்பதையெல்லாம் போய்ச் செய்யுங்கள்[a]; ஏனெனில் யாவே உங்களுடன் இருக்கிறார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “உங்கள் உள்ளத்தில் இருப்பதையெல்லாம் செய்யுங்கள்.” எபிரெயச் சொற்றொடரை “உங்கள் மனதில் உள்ளதையெல்லாம்” என்றும் பொருள்படுத்தலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: வாவ் தொடர் உரையாடலை முன்னெடுத்துச் செல்கிறது. தமிழில் இயல்பான நேரடி உரை அமைப்பில் ‘என்றார்’ என்பதே அந்த நிகழ்வுத் தொடரைத் தெளிவாகக் காட்டுகிறது; தனியாக ‘அப்போது’ அல்லது ‘மேலும்’ சேர்க்க வேண்டியதில்லை.
- source_word: נָתָן
  choice: நாத்தான்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: אֶל הַמֶּלֶךְ
  choice: அரசனிடம்
  rationale: எபிரெய உரை ‘அரசனிடம்’ என்ற பொதுப்பெயரையே பயன்படுத்துகிறது; இவ்வசனத்தில் இல்லாத ‘தாவீது’ என்ற பெயர் சேர்க்கப்படவில்லை.
- source_word: כֹּל אֲשֶׁר בִּלְבָבְךָ
  choice: உங்கள் உள்ளத்தில் இருப்பதையெல்லாம்
  rationale: לֵבָב என்பது உணர்ச்சியை மட்டும் அல்லாமல் உள்ளார்ந்த எண்ணம், நோக்கம், தீர்மானம் ஆகியவற்றையும் குறிக்கலாம். ‘உள்ளம்’ எபிரெய உருவகத்தைப் பாதுகாத்தபடியே நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: לֵךְ עֲשֵׂה
  choice: போய்ச் செய்யுங்கள்
  rationale: அடுத்தடுத்து வரும் இரு கட்டளைகளின் ஊக்கமளிக்கும் அனுமதிப் பொருளை இயல்பான தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: நாத்தானின் அறிவுரைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் விளக்கப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டம் அல்ல, தெய்வீகப் பெயரான நான்கெழுத்துப் பெயர். அதன் ‘Yahweh’ ஒலிப்பை நவீன தமிழில் ‘யாவே’ என்று வழங்குகிறது.
- source_word: עִמָּךְ
  choice: உங்களுடன் இருக்கிறார்
  rationale: உடனிருப்பு மற்றும் ஆதரவு ஆகிய இறையியல் எதிரொலிகளை விரிவாக்காமல், மூலத்தின் நேரடியான பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரை தெய்வீகப் பெயரையே நேரடியாகப் பயன்படுத்துகிறது. ஒரு பட்டத்தால் மாற்றாமல், ‘Yahweh’ என்பதற்கான இயல்பான தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டது.
- issue: ‘யாவே உங்களுடன் இருக்கிறார்’ என்பதன் பொருள்
  choice: உடனிருப்பை நேரடியாகக் கூறுதல்
  alternative: ‘யாவே உங்களுக்கு ஆதரவாக இருக்கிறார்’ என்று விளக்கமாக விரித்தல்
  rationale: עִמָּךְ உடனிருப்பையும் ஆதரவையும் உணர்த்தக்கூடும். ஆனால் மூலத்தின் இறையியல் செறிவையும் திறந்த பொருள் பரப்பையும் காக்க, ‘உங்களுடன் இருக்கிறார்’ என்றே வழங்கப்பட்டது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரசனை நோக்கிய ஒருமை வடிவங்கள் தமிழின் மரியாதைப் பன்மையாக வழங்கப்பட்டுள்ளன. நேரடி உரையின் இயல்புக்காக வினைச்சொல் முடிவில் வைக்கப்பட்டுள்ளது.
