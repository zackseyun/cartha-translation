  text: כִּ֣י לֹ֤א יָשַׁ֨בְתִּי֙ בְּ/בַ֔יִת לְ֠/מִ/יּוֹם הַעֲלֹתִ֞/י אֶת בְּנֵ֤י יִשְׂרָאֵל֙ מִ/מִּצְרַ֔יִם וְ/עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וָ/אֶֽהְיֶה֙ מִתְהַלֵּ֔ךְ בְּ/אֹ֖הֶל וּ/בְ/מִשְׁכָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/006.yaml
  text: For I have not dwelt in a house from the day I brought up the sons of Israel out of Egypt to this day[b][a], but I have been moving about in a tent and in a tabernacle.
translation:
  language: ta
  text: ஏனெனில், எகிப்திலிருந்து இஸ்ரவேல் மக்களை[a] நான் மேலே கொண்டுவந்த நாள் முதல் இந்நாள்வரை, நான் ஒரு வீட்டில் குடியிருக்கவில்லை; மாறாக, கூடாரத்திலும் திருக்கூடாரத்திலும் அங்குமிங்கும் சென்று வந்தேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இஸ்ரவேல் மக்களை” என்பதற்கு “இஸ்ரவேலர்” என்றும், சொல்லுருவாக “இஸ்ரவேலின் புதல்வர்களை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அங்குமிங்கும் சென்று வந்தேன்” என்பதற்கு “நடமாடிக்கொண்டிருந்தேன்” என்றும் மொழிபெயர்க்கலாம். “திருக்கூடாரம்” என்பதற்கு “வாசஸ்தலம்” அல்லது “உறைவிடம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: குடியிருக்கவில்லை
  rationale: ישב என்பதன் ‘வசித்தல்/குடியிருத்தல்’ என்ற பொருளை வீட்டில் நிலையாக வாழும் சூழலில் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּבַיִת
  choice: ஒரு வீட்டில்
  rationale: எபிரெயச் சொல் இங்கு குறிப்பிட்ட ‘ஆலயம்’ என்று சொல்லாமல் பொதுவாக ‘வீடு’ என உள்ளது; அதே பொதுத்தன்மை காக்கப்படுகிறது.
- source_word: לְמִיּוֹם הַעֲלֹתִי
  choice: நான் மேலே கொண்டுவந்த நாள் முதல்
  rationale: עלה என்பதன் ஹிஃபில் வடிவிலுள்ள ‘மேலே கொண்டுவருதல்’ என்ற யாத்திராகமச் சொல்லாட்சியையும் காலத் தொடக்கத்தையும் காக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களை
  rationale: בנים என்பதன் உறவுசார் வடிவை ‘மக்கள்’ என்ற இயல்பான தமிழ்ச் சொல்லால் தருகிறது; இங்கு முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கும் வழக்குச் சொல்லாட்சி.
- source_word: מִמִּצְרַיִם
  choice: எகிப்திலிருந்து
  rationale: புறப்படும் தொடக்க இடத்தைத் தெளிவாகவும் நேரடியாகவும் குறிக்கிறது.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை
  rationale: கடந்த காலத்திலிருந்து பேச்சின் நிகழ்காலம் வரை நீளும் காலவரம்பைச் செறிவாகக் காட்டுகிறது.
- source_word: וָאֶהְיֶה מִתְהַלֵּךְ
  choice: இடம்பெயர்ந்து வந்தேன்
  rationale: நிலையான வீட்டில் குடியிருப்பதற்கு மாறாகத் தொடர்ந்து அங்குமிங்கும் சென்ற நிலையைக் காட்டுகிறது; היה உடன் வரும் பங்கேற்பு வடிவின் தொடர்ச்சியும் தமிழில் வெளிப்படுகிறது.
- source_word: בְּאֹהֶל
  choice: கூடாரத்தில்
  rationale: אֹהֶל என்பதன் அடிப்படைப் பொருளான நகர்த்தக்கூடிய ‘கூடாரம்’ என்பதைக் காக்கிறது.
- source_word: וּבְמִשְׁכָּן
  choice: உறைவிடத்தில்
  rationale: מִשְׁכָּן என்பதன் அடிப்படைப் பொருள் ‘உறைவிடம்’; சூழலில் இது எடுத்துச் செல்லப்பட்ட பரிசுத்த வாசஸ்தலத்தையும் குறிக்கலாம், ஆனால் மொழிபெயர்ப்பு அந்தப் பொருளை மட்டும் கட்டாயப்படுத்தவில்லை.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் பாலினமும் சமூகக் குறிப்பும்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் புதல்வர்கள் / இஸ்ரவேலர்
  rationale: சொல்லுருவில் ‘புதல்வர்கள்’ என்றாலும், வழக்கில் இது யாக்கோபின் சந்ததியாரான இஸ்ரவேல் சமூகத்தை மொத்தமாகக் குறிக்கிறது. ‘மக்கள்’ இயல்பான தமிழில் இந்தக் கூட்டு அடையாளத்தைத் தருகிறது; மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- issue: מִשְׁכָּן என்பதற்கான வழிபாட்டுச் சொல்
  choice: உறைவிடம்
  alternative: திருக்கூடாரம் / வாசஸ்தலம்
  rationale: மூலச்சொல்லின் ‘உறையும் இடம்’ என்ற அடிப்படைப் பொருளை முன்னிறுத்தி, பின்னாளைய ஆலயக் கருத்தை முன்கூட்டியே புகுத்தாமல் இருக்கிறது; எடுத்துச் செல்லத்தக்க பரிசுத்த வாசஸ்தலம் என்ற சூழல்சார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: אֹהֶל וּבְמִשְׁכָּן என்ற இணைப்பின் தொடர்பு
  choice: கூடாரத்திலும் உறைவிடத்திலும்
  alternative: கூடாரமாகிய உறைவிடத்தில்
  rationale: וּבְ என்ற இணைப்பை நேரடியாகப் பாதுகாத்து இரண்டு பெயர்ச்சொற்களையும் தனித்தனியாக வைத்திருக்கிறது; அவை ஒரே அமைப்பின் இரு விளக்கங்களா அல்லது தொடர்புடைய இரு சொல்லாட்சிகளா என்ற தெளிவின்மையைச் சீராக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. ‘வீடு’ மற்றும் ‘உறைவிடம்’ என்ற வேறுபாடு காக்கப்பட்டுள்ளது; ‘ஆலயம்’ என விளக்கி மொழிபெயர்க்கப்படவில்லை. தொடர்ச்சியான அசைவைக் காட்ட ‘இடம்பெயர்ந்து வந்தேன்’ பயன்படுத்தப்பட்டுள்ளது.
