base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/005.yaml
  text: 'Go and say to my servant David[a], ‘Thus says Yahweh: Would you build a house for me to dwell in?’'
translation:
  language: ta
  text: 'நீ போய், என் ஊழியனான தாவீதிடம், ‘யாவே இவ்வாறு கூறுகிறார்: எனக்கு ஒரு வீட்டைக் கட்டி, அதில் நான் குடியிருப்பதற்கு ஏற்பாடு செய்பவன் நீதானா?’ என்று சொல்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ וְאָמַרְתָּ
  choice: நீ போய் ... சொல்
  rationale: முதல் கட்டளையையும் அதைத் தொடரும் இரண்டாவது கட்டளையையும் இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַבְדִּי אֶל דָּוִד
  choice: என் ஊழியனாகிய தாவீதிடம்
  rationale: עֶבֶד இங்கு அரச-உடன்படிக்கைச் சூழலில் மரியாதைக்குரிய ‘ஊழியன்’ என்ற பொருளில் வருகிறது; தாவீது யார் என்பதை இயல்பான தமிழில் இணைத்துக் கூறுகிறது.
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே கூறுவது இதுவே
  rationale: தீர்க்கதரிசனத் தூதர் சூத்திரத்தின் அதிகாரபூர்வத் தொனியை இயல்பான தமிழில் காக்கிறது; יהוה என்ற இறைப் பெயர் பட்டப்பெயராக மாற்றப்படாமல் ஒலிபெயர்க்கப்படுகிறது.
- source_word: הַאַתָּה
  choice: நீயா?
  rationale: கேள்வித் துகளுடன் வரும் வலியுறுத்தப்பட்ட தனிப்பெயர்ச்சொல்லைத் தமிழின் ‘-ஆ’ வினாவுருபால் முன்னிறுத்தி, சொல்லாட்சிக் கேள்வியின் அழுத்தத்தைக் காக்கிறது.
- source_word: תִּבְנֶה לִּי בַיִת
  choice: எனக்கு ஒரு வீட்டைக் கட்டப்போகிறவன்
  rationale: בַּיִת என்பதைக் ‘ஆலயம்’ என்று முன்கூட்டியே குறிப்பாக்காமல் ‘வீடு’ என மொழிபெயர்ப்பதால், இவ்வதிகாரத்தில் பின்னர் வரும் தாவீதின் ‘வீடு’ குறித்த சொல்விளையாட்டு காக்கப்படுகிறது.
- source_word: לְשִׁבְתִּי
  choice: நான் குடியிருப்பதற்கு
  rationale: முதலாம் நபர் ஒருமை பின்னொட்டுடன் உள்ள நோக்கத்தைக் குறிக்கும் வினையெச்ச வடிவத்தின் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: בַּיִת என்பது ‘வீடு’ அல்லது ‘ஆலயம்’ என்பதா
  choice: வீடு
  alternative: ஆலயம்
  rationale: இங்கு தேவனுக்கான பரிசுத்த இடம் குறிக்கப்பட்டாலும், ‘வீடு’ என்பது எபிரெயச் சொல்லையும் சுற்றியுள்ள இலக்கிய-இறையியல் சொல்விளையாட்டையும் காக்கிறது.
- issue: கேள்வியின் வலியுறுத்தலும் சொல்லாட்சித் தன்மையும்
  choice: கட்டப்போகிறவன் நீயா?
  alternative: நீ எனக்கு ஒரு வீட்டைக் கட்டுவாயா?
  rationale: הַאַתָּה என்பதில் ‘நீ’ வலியுறுத்தப்படுவதையும், இது வெறும் தகவல் கேள்வி அல்லாமல் எதிர்மறை விடையை உணர்த்தும் சொல்லாட்சிக் கேள்வியாக இருப்பதையும் முதன்மை உரை காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் தீர்க்கதரிசன அறிவிப்புக்குரிய கண்ணியமான தொனியுடனும் வடிவமைக்கப்பட்டது. ‘என் ஊழியனாகிய தாவீது’ என்பது இயல்பான தமிழில் எபிரெயப் பெயர்ச்சேர்க்கையை வெளிப்படுத்துகிறது; ‘வீடு’ என்ற சொல் அதிகாரத்தின் சொல்விளையாட்டைத் தக்கவைக்கிறது.
