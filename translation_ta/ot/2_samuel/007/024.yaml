source:
  edition: WLC
  text: וַ/תְּכ֣וֹנֵֽן לְ֠/ךָ אֶת עַמְּ/ךָ֨ יִשְׂרָאֵ֧ל לְ/ךָ֛ לְ/עָ֖ם עַד עוֹלָ֑ם וְ/אַתָּ֣ה יְהוָ֔ה הָיִ֥יתָ לָ/הֶ֖ם לֵ/אלֹהִֽים־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/024.yaml
  text: And you established your people Israel for yourself to be your people forever[a], and you, Yahweh[b], became their God.
translation:
  language: ta
  text: நீர் உமது மக்களான இஸ்ரவேலை என்றென்றும் உமக்குரிய மக்களாக நிலைநிறுத்தினீர்; யாவே[a], நீர் அவர்களுக்குக் கடவுளானீர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாவே’ என்பது எபிரெய மூலத்தில் வரும் YHWH என்ற இறைப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘அவர்களுடைய கடவுளாக இருந்தீர்.’ எபிரெயச் சொற்றொடரை நிலையைக் குறிப்பதாகவும் மொழிபெயர்க்கலாம்; இச்சூழலில் ‘கடவுளானீர்’ என்பது உடன்படிக்கை உறவு ஏற்படுத்தப்பட்டதைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּכוֹנֵן
  choice: நிலைநிறுத்தினீர்
  rationale: כון என்பதன் இவ்வடிவம் உறுதிப்படுத்துதல் அல்லது நிலைபெறச் செய்தல் என்ற பொருளைத் தருகிறது. உடன்படிக்கைச் சூழலில் இஸ்ரவேலின் நிலையை உறுதியாக நிறுவிய செயலை ‘நிலைநிறுத்தினீர்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְךָ ... לְךָ לְעָם
  choice: உமக்கே மக்களாக
  rationale: மீண்டும் வரும் לְךָ, இஸ்ரவேல் யாவேக்கு உரிய மக்களாகத் தனிப்படுத்தப்பட்டதைக் காட்டுகிறது. ‘உமக்கே’ என்பது அந்த உரிமையையும் உடன்படிக்கை உறவையும் தெளிவாக்குகிறது.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: உமது மக்களாகிய இஸ்ரவேல்
  rationale: உடைமையையும் இஸ்ரவேல் என்ற இனப்பெயரையும் இயல்பான நவீனத் தமிழில் பாதுகாக்கிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த நிலைத்தன்மையைக் குறிக்கும் எபிரெயச் சொற்றொடருக்கு தெளிவான, கண்ணியமான தமிழாக்கம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான YHWH-ஐ ஒரு பட்டத்தால் மாற்றாமல், தமிழில் உச்சரிப்புப்பெயர்ப்பாக வழங்குகிறது.
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: அவர்களுக்குக் கடவுளானீர்
  rationale: היה + ל அமைப்பு இங்கு உடன்படிக்கை உறவு ஏற்படுத்தப்பட்டதை வெளிப்படுத்துகிறது. ‘கடவுளானீர்’ அதன் வினைச்செயல் வலிமையையும் பரஸ்பர உடன்படிக்கை வடிவத்தையும் காக்கிறது.
theological_decisions:
- issue: உடன்படிக்கை உறவின் பரஸ்பர வடிவம்
  choice: உமக்கே மக்களாக ... அவர்களுக்குக் கடவுளானீர்
  alternative: உமது சொந்த மக்களாக ... அவர்களுடைய கடவுளாக இருந்தீர்
  rationale: இஸ்ரவேல் யாவேக்குரிய மக்களாகவும் யாவே இஸ்ரவேலின் கடவுளாகவும் அமைந்த உடன்படிக்கை உறவை மொழிபெயர்ப்பு காக்கிறது; பிற்கால இறையியல் விளக்கத்தை இதில் சேர்க்கவில்லை.
- issue: הָיִיתָ என்பதன் நிகழ்வுசார் அல்லது நிலைய்சார் பொருள்
  choice: கடவுளானீர்
  alternative: கடவுளாக இருந்தீர்
  rationale: உடனுள்ள சூழல் மக்களை நிலைநிறுத்திய உடன்படிக்கைச் செயலைக் கூறுவதால் ‘கடவுளானீர்’ பொருத்தமானது; இருப்பினும் எபிரெய வடிவை நிலைய்சார் பொருளிலும் புரிந்துகொள்ள முடிவதால் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இறைவனை நோக்கிய மரியாதைப் பன்மையைப் பயன்படுத்தி, கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் உடன்படிக்கைச் சமச்சீரை இயல்பான தமிழ் சொல்வரிசையில் காத்துள்ளது.
