base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/021.yaml
  text: Because of your word and according to your heart[a], you have done all this greatness[c][b], to make your servant know it.
translation:
  language: ta
  text: உமது வார்த்தையின் பொருட்டும்[a], உமது இதயத்தின்படியும்[b], உமது அடியானுக்கு அறியச் செய்வதற்காக இந்த மகத்துவம் அனைத்தையும்[c] செய்தீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது வார்த்தைக்காக’; இச்சூழலில் ‘உமது வாக்குறுதியின் பொருட்டு’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘உமது இதயத்தின்படி’ என்பது உமது சொந்த நோக்கம் அல்லது சித்தத்தின்படி என்று பொருள்.
    reason: lexical_alternative
  - marker: c
    text: 'எபிரெயில் ஒருமை: ‘இந்த மகத்துவம் அனைத்தையும்’; பொருளடிப்படையில் ‘இந்த மாபெரும் செயல்கள் அனைத்தையும்’ என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲבוּר דְּבָרְךָ
  choice: உமது வார்த்தையின் பொருட்டும்
  rationale: בַּעֲבוּר காரணம் அல்லது அடிப்படையைக் குறிக்கிறது; דָּבָר என்பதன் ‘வார்த்தை’ என்ற விரிவான பொருளைத் தக்கவைத்து, உடன்படிக்கைச் சூழலில் ‘வாக்குறுதி’ என்ற பொருளையும் வாசகர் உணர இடமளிக்கிறது.
- source_word: וּכְלִבְּךָ
  choice: உமது இதயத்தின்படியும்
  rationale: לֵב என்பது உள்ளார்ந்த நோக்கம், விருப்பம், சித்தம் ஆகியவற்றைக் குறிக்கலாம். எபிரெய உருவகத்தை விளக்கி மாற்றாமல் தக்கவைக்கிறது.
- source_word: עָשִׂיתָ
  choice: செய்தீர்
  rationale: முடிவுற்ற செயலைக் குறிக்கும் எபிரெய வினையை, தாவீது கடவுளை மரியாதையுடன் நேரடியாக அழைக்கும் தமிழ்நடையில் இயல்பாக வழங்குகிறது.
- source_word: אֵת כָּל הַגְּדוּלָּה הַזֹּאת
  choice: இந்த மகத்துவம் அனைத்தையும்
  rationale: எபிரெயில் உள்ள ஒருமைச் சுருக்கப் பெயரான ‘மகத்துவம்’ என்பதைக் காத்து, கடவுளின் பெருஞ்செயலை ஒருங்கிணைந்த மகத்துவமாக முன்வைக்கிறது.
- source_word: לְהוֹדִיעַ אֶת עַבְדֶּךָ
  choice: உமது அடியான் அறியும்படி
  rationale: ידע என்பதன் ஹிஃபில் வடிவிலுள்ள ‘அறியச் செய்தல்’ என்ற காரணவினைப் பொருளை நோக்கவாக்கிய அமைப்பில் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַבְדֶּךָ
  choice: உமது அடியான்
  rationale: அரசனின் ஜெபச் சூழலில் கடவுளுக்கு முன்பான தாவீதின் பணிவான தன்னடையாளத்தை ‘அடியான்’ இயல்பாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் ‘உமது வார்த்தை’ என்பதன் குறிப்பு
  choice: உமது வார்த்தை
  alternative: உமது வாக்குறுதி; நீர் சொன்னது
  rationale: சூழல் கடவுள் தாவீதிடம் உரைத்த உடன்படிக்கைச் செய்தியைச் சுட்டினாலும், எபிரெயின் விரிவான சொல்லாட்சியைத் தக்கவைப்பது குறிப்பைத் தேவையின்றி குறுக்காமல் பாதுகாக்கிறது.
- issue: ‘உமது இதயத்தின்படி’ என்ற கடவுளைப் பற்றிய மனித உருவகம்
  choice: உமது இதயத்தின்படி
  alternative: உமது சித்தத்தின்படி; உமது விருப்பத்தின்படி
  rationale: கடவுளின் உள்ளார்ந்த நோக்கத்தை எபிரெய உரை ‘இதயம்’ என்ற உருவகத்தால் கூறுகிறது; அதைச் சுருக்கமான கருத்தியல் மொழியாக மாற்றாமல் அப்படியே தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான ஜெபநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய மரியாதைப் பன்மை வடிவங்கள் (‘உமது’, ‘செய்தீர்’) தொடர்ச்சியாகக் கையாளப்பட்டுள்ளன. எபிரெயின் ‘இதயம்’ உருவகமும் ‘மகத்துவம்’ என்ற ஒருமைச் சுருக்கப் பெயரும் பாதுகாக்கப்பட்டுள்ளன.
