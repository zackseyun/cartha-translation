  text: וַ/יָּבֹא֙ הַ/מֶּ֣לֶךְ דָּוִ֔ד וַ/יֵּ֖שֶׁב לִ/פְנֵ֣י יְהוָ֑ה וַ/יֹּ֗אמֶר מִ֣י אָנֹכִ֞י אֲדֹנָ֤/י יְהוִה֙ וּ/מִ֣י בֵיתִ֔/י כִּ֥י הֲבִיאֹתַ֖/נִי עַד הֲלֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/018.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, Lord GOD, and what is my house, that you have brought me this far?”
translation:
  language: ta
  text: பின்பு அரசன் தாவீது உள்ளே சென்று, யாவேயின் முன்னிலையில் அமர்ந்து, “ஆண்டவராகிய யாவே, நீர் என்னை இவ்வளவு தூரம் கொண்டுவந்திருக்க, நான் யார்? என் வீடு[a] எம்மாத்திரம்?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே ‘வீடு’ என்பது தாவீதின் குடும்பம், குடும்பத்தார் அல்லது உருவாகிவரும் அரச வம்சத்தைக் குறிக்கலாம். இந்த அதிகாரம் முழுவதிலும் திரும்பத் திரும்ப வரும் ‘வீடு’ என்ற சொல்லின் தொடர்பைப் பாதுகாப்பதற்காக அது முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: உள்ளே சென்று
  rationale: בוא என்பதன் இயக்கத்தையும், குறிப்பிடப்படாத ஓர் இடத்திற்குள் தாவீது சென்றதையும் இயல்பான தமிழில் தெரிவிக்கிறது; இடத்தை ஊகித்து சேர்க்கவில்லை.
- source_word: וַיֵּשֶׁב
  choice: அமர்ந்து
  rationale: இந்த உரையாடல் சூழலில் ישב என்பதன் இயல்பான உடல்நிலைப் பொருள் ‘அமர்தல்’; ‘தங்குதல்’ என்ற மாற்றுப் பொருள் இங்கு குறைவாகப் பொருந்துகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேயின் முன்னிலையில்
  rationale: לִפְנֵי என்பதன் ‘ஒருவரின் முன்/சந்நிதியில்’ என்ற உறவுப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: מִי אָנֹכִי
  choice: நான் யார்?
  rationale: தாவீதின் வியப்பும் தாழ்மையும் நிறைந்த எபிரெய வினாவை நேரடியாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: אֲדֹנָי יְהוִה
  choice: ஆண்டவராகிய யாவே
  rationale: אֲדֹנָי என்ற பட்டத்தையும் יהוה என்ற தனிப்பெயரையும் ஒன்றாகப் பாதுகாக்கிறது; இரண்டையும் ஒரே பொதுப்பட்டமாகக் கலக்கவில்லை.
- source_word: וּמִי בֵיתִי
  choice: என் வீடு எம்மாத்திரம்?
  rationale: எபிரெய மொழியின் தாழ்மையான வினாவை இயல்பான தமிழில் தருவதோடு, அதிகாரம் முழுவதிலும் முக்கியமான ‘வீடு’ என்ற சொல்லிணைப்பையும் பாதுகாக்கிறது.
- source_word: הֲבִיאֹתַנִי עַד הֲלֹם
  choice: நீர் என்னை இவ்வளவு தூரம் கொண்டுவந்திருக்கிறீரே!
  rationale: בוא என்பதன் காரணவினைப் பொருளான ‘கொண்டுவருதல்’ என்பதையும், עַד הֲלֹם குறிக்கும் இதுவரையிலான முன்னேற்றத்தையும் உருவகத்தைச் சுருக்காமல் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரைப் பெயராகவே காட்டுகிறது; பொதுப்பட்டமாக மாற்றவில்லை.
- issue: בֵיתִי என்பதன் பரந்த பொருள்
  choice: முதன்மை உரையில் ‘என் வீடு’ என்பதை வைத்தல்
  alternative: என் குடும்பம் / என் குடும்பத்தார் / என் வம்சம்
  rationale: 2 சாமுவேல் 7 முழுவதிலும் ‘வீடு’ என்பது குடியிருப்பு, குடும்பம், அரச வம்சம் ஆகிய பொருட்களைத் தொடர்புபடுத்தும் மையச் சொல். ஒரு பொருளை மட்டும் தேர்ந்தெடுத்து அதன் உண்மையான பன்முகத்தன்மையை நீக்காமல், அடிக்குறிப்பில் விளக்கம் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், ஜெபத்திற்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. மரியாதை ஒருமை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன. ‘எம்மாத்திரம்’ என்பது உயர்ந்த ஆனால் பொதுவாகப் புரிந்துகொள்ளக்கூடிய நடையைத் தக்கவைத்து, தாவீதின் தாழ்மையான வினாவின் வலிமையை வெளிப்படுத்துகிறது.
