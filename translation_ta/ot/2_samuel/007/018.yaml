- from: பின்பு தாவீது ராஜா உள்ளே சென்று, யாவேயின் முன்னிலையில் அமர்ந்து, “ஆண்டவராகிய யாவே, நான் யார்? என் வீடு[a] எம்மாத்திரம்? நீர் என்னை இவ்வளவு தூரம் கொண்டுவந்திருக்கிறீரே!” என்றார்.
  to: பின்பு அரசன் தாவீது உள்ளே சென்று, யாவேயின் முன்னிலையில் அமர்ந்து, “ஆண்டவராகிய யாவே, நீர் என்னை இவ்வளவு தூரம் கொண்டுவந்திருக்க, நான் யார்? என் வீடு[a] எம்மாத்திரம்?” என்றார்.
  rationale: 'The revision preserves the source''s sequence and rhetorical humility more closely: Yahweh''s bringing David thus far is the stated basis on which David asks who he and his house are. It also improves the natural title order without altering meaning. The footnote retains the lexical ambiguity and the chapter-wide wordplay of ‘house.’'
