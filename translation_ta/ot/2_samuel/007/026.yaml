base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/026.yaml
  text: And may your name be magnified forever[a], saying[b], ‘Yahweh of hosts is God over Israel,’ and may the house of your servant David be established before you.
translation:
  language: ta
  text: “‘படைகளின் யாவே இஸ்ரவேலுக்கு மேலான தேவன்’ என்று சொல்லப்படும்படி, உமது பெயர் என்றென்றும் மகத்தானதாக விளங்குவதாக[a]. உமது அடியானான தாவீதின் வீடும்[b] உமது முன்னிலையில் நிலைபெறுவதாக.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது பெயர் என்றென்றும் மேன்மைப்படுத்தப்படுவதாக.”
    reason: lexical_alternative
  - marker: b
    text: இங்கு “வீடு” என்பது ஒரு கட்டடத்தை மட்டும் குறிக்காமல், தாவீதின் குடும்பத்தையும் அரச வம்சத்தையும் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְיִגְדַּל
  choice: மகத்தானதாக விளங்குவதாக
  rationale: இந்தச் செபச் சூழலில் வினை விருப்பத்தையோ வேண்டுதலையோ வெளிப்படுத்துகிறது. எபிரெய வினையின் ‘பெரிதாகுதல்/மகத்தானதாகுதல்’ என்ற இயல்பைத் தக்கவைத்தபடி, தமிழில் பெயரின் மகிமை வெளிப்படுவதை இயல்பாகச் சொல்கிறது.
- source_word: שִׁמְךָ
  choice: உமது பெயர்
  rationale: ‘பெயர்’ என்பது புகழ், மதிப்பு, வெளிப்படுத்தப்பட்ட அடையாளம் ஆகியவற்றையும் குறிக்கக்கூடிய எபிரெய மரபுத்தொடர்; அதை விளக்கமாகச் சுருக்காமல் நேரடியாகத் தக்கவைக்கிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: முடிவில்லாத காலநீடிப்பை இயல்பான, கண்ணியமான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: לֵאמֹר
  choice: என்று சொல்லப்படும்படி
  rationale: தொடர்ந்து வரும் அறிக்கையுடன் மேற்கோள் இணைப்பைத் தக்கவைக்கிறது; பொதுவாக மக்கள் இவ்வாறு அறிக்கையிடுவர் என்ற உட்பொருளையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה צְבָאוֹת
  choice: படைகளின் யாவே
  rationale: தெய்வீகத் திருப்பெயரை ‘யாவே’ என்று ஒலிபெயர்த்து, צְבָאוֹת என்பதன் பரந்த ‘படைகள்’ என்ற பொருளையும் தக்கவைக்கிறது.
- source_word: אֱלֹהִים עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல் கடவுளாக இருக்கிறார்
  rationale: עַל இங்கு அதிகாரத்தையும் ஆட்சியையும் குறிக்கிறது; ‘இஸ்ரவேலின்மேல்’ அந்த உறவைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: וּבֵית עַבְדְּךָ דָוִד
  choice: உமது பணியாளனாகிய தாவீதின் வீடும்
  rationale: בַּיִת என்ற ‘வீடு’ சொல்லைத் தக்கவைத்து, இவ்வதிகாரத்தில் கட்டடத்துக்கும் வம்சத்துக்கும் இடையே உள்ள சொல்விளையாட்டை இழக்காமல் பாதுகாக்கிறது; அடிக்குறிப்பு இங்குள்ள வம்சப் பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: יִהְיֶה נָכוֹן
  choice: நிலைபெறுவதாக
  rationale: உறுதியாக்கப்படுதல், நிலைத்திருத்தல், நிறுவப்படுதல் ஆகிய பொருள்களைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; வேண்டுதல் நயத்தையும் காக்கிறது.
- source_word: לְפָנֶיךָ
  choice: உமக்கு முன்பாக
  rationale: கடவுளுடைய சந்நிதியிலும் பார்வையிலும் நிலைத்திருக்கும் உறவுசார் பொருளை நேரடியாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தெய்வீகத் திருப்பெயரே உள்ளது. எனவே அதை மாற்றுப் பட்டப்பெயரால் பதிலிடாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: தாவீதின் ‘வீடு’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘வீடு’ என்பதைத் தக்கவைத்து, அடிக்குறிப்பில் குடும்பம் அல்லது அரச வம்சம் என்று விளக்குதல்
  alternative: வம்சம் / குடும்பம்
  rationale: இங்கு ‘வீடு’ தாவீதின் சந்ததியையும் அரச வம்சத்தையும் குறிக்கிறது. ஆயினும் 2 சாமுவேல் 7-இல் கட்டடமான வீட்டுக்கும் வம்சமான வீட்டுக்கும் இடையிலுள்ள திட்டமிட்ட சொல்விளையாட்டை நேரடியாக ‘வம்சம்’ என்று மாற்றுவது மறைத்துவிடும்.
- issue: וְיִגְדַּל என்பதன் செயற்பாட்டு நயம்
  choice: மகத்தானதாக விளங்குவதாக
  alternative: மேன்மைப்படுத்தப்படுவதாக
  rationale: எபிரெய வடிவம் நேரடியாகச் செயப்பாட்டுவினை அல்ல; ‘பெரிதாக/மகத்தானதாக ஆகுதல்’ என்ற பொருளுடையது. அதேவேளை, செபச் சூழலிலுள்ள வேண்டுதல் நயமும் தமிழில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான செப மொழிநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உமது’, ‘உமக்கு’ பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் மேற்கோள் அமைப்பும் இரு வேண்டுதல்களின் இணைப்பும் பாதுகாக்கப்பட்டுள்ளன.
