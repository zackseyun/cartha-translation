- from: ஆண்டவராகிய யெகோவாவே, இதுவும் உமது பார்வையில் சிறிய காரியமாக இருந்தது; அதோடு, வெகு காலத்திற்குப் பின்பு நடக்கவிருப்பதைப் பற்றியும் உமது அடியேனின் வீட்டாரைக்[a] குறித்து உரைத்தீர்.[b] ஆண்டவராகிய யெகோவாவே, இதுவே மனிதனுக்கான போதனையா![c]
  to: ஆண்டவராகிய யெகோவாவே, இதுவும் உமது பார்வையில் ஒரு சிறிய காரியமாகவே இருந்தது; உமது அடியேனின் வீட்டாரைப்[a] பற்றி, தொலைவான எதிர்காலத்திற்கும்[b] உரைத்தீர். ஆண்டவராகிய யெகோவாவே, இதுவே மனிதனுக்கான போதனை.[c]
  rationale: The revision keeps the future-oriented phrase linked to the promise about David's household, rather than introducing a separate future event. It also changes the final line from a rhetorical question to a declarative sentence, preserving the Hebrew clause's ambiguity without assigning unmarked interrogative force. Footnote anchors remain attached to the relevant expressions, and the footnotes preserve the lexical and syntactic alternatives.
