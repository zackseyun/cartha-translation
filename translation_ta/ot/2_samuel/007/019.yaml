base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/019.yaml
  text: And even this was too small in your eyes[a], Lord GOD; you have also spoken of your servant’s house for a long time to come, and this is the law of man[c][b], Lord GOD.
translation:
  language: ta
  text: ஆண்டவராகிய யெகோவாவே, இதுவும் உமது பார்வையில் ஒரு சிறிய காரியமாகவே இருந்தது; உமது அடியேனின் வீட்டாரைப்[a] பற்றி, தொலைவான எதிர்காலத்திற்கும்[b] உரைத்தீர். ஆண்டவராகிய யெகோவாவே, இதுவே மனிதனுக்கான போதனை.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வீடு’ என்பது இங்கு குடும்பத்தையோ அரச வம்சத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேர்ச்சொல்லாக, ‘தொலைவுக்காக’ அல்லது ‘தொலைவானதற்காக’; இச்சூழலில் இது தொலைவான எதிர்காலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: இறுதி எபிரெயத் தொடர் பொருள் காண்பதற்குக் கடினமானது. இதை ‘இதுவே மனிதகுலத்துக்கான சாசனம்’, ‘இதுவே மனிதனின் சட்டம்/வழக்கம்’ அல்லது ‘இதுவே மனிதகுலத்தைப் பற்றிய போதனை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן עוֹד זֹאת בְּעֵינֶיךָ
  choice: இதுவும் உமது பார்வையில் சிறிய காரியமாக இருந்தது
  rationale: קטן என்பதன் ‘சிறியதாக இருத்தல்’ என்ற அடிப்படைப் பொருளையும், בְּעֵינֶיךָ என்பதன் மதிப்பீட்டைக் குறிக்கும் எபிரெய உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֲדֹנָי יְהוִה
  choice: ஆண்டவராகிய யெகோவாவே
  rationale: אֲדֹנָי என்ற பட்டத்தையும் יהוה என்ற தனிப்பெயரையும் வேறுபடுத்திக் காட்டி, அழைப்புவேற்றுமையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בֵּית עַבְדְּךָ
  choice: உமது அடியேனின் வீட்டார்
  rationale: בַּיִת என்பதன் ‘வீடு/வீட்டார்’ உருவகத்தைத் தக்கவைக்கிறது; இச்சூழலில் அது தாவீதின் குடும்பத்தையும் வம்சத்தையும் குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: לְמֵרָחוֹק
  choice: வெகு காலத்திற்குப் பின்பு நடக்கவிருப்பதைப் பற்றி
  rationale: ‘தொலைவில்’ என்ற சொல்லின் இச்சூழலுக்குரிய காலப் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது; ‘தொலைவான எதிர்காலத்தில்’ என்பதும் சாத்தியம்.
- source_word: תּוֹרַת הָאָדָם
  choice: மனிதனுக்கான போதனை
  rationale: תּוֹרָה என்பதன் பரந்த ‘போதனை/அறிவுறுத்தல்’ பொருளைத் தக்கவைத்து, அதை வெறும் சட்டக்கோவையாகக் குறுக்காமல் விடுகிறது. הָאָדָם இங்கு தனிமனிதனையோ மனிதகுலத்தையோ குறிக்கலாம்.
theological_decisions:
- issue: וְזֹאת תּוֹרַת הָאָדָם என்ற கடினமான இறுதித் தொடரின் பொருள்
  choice: இதுவே மனிதனுக்கான போதனையா!
  alternative: ‘இதுவே மனிதகுலத்துக்கான சாசனம்’, ‘இதுவே மனிதனின் சட்டம்/வழக்கம்’, அல்லது ‘மனிதகுலத்தைப் பற்றிய போதனை’
  rationale: எபிரெயத் தொடர் இலக்கணத்திலும் பொருளிலும் உண்மையான தெளிவின்மையைக் கொண்டது. முதன்மை உரை அதன் சொற்கூறுகளுக்கு அருகில் நிற்கிறது; வம்ச, மேசியா அல்லது மனிதகுலம் சார்ந்த குறிப்பிட்ட விளக்கத்தைத் தீர்மானமாகத் திணிக்காமல் மாற்றுப் பொருள்களை அடிக்குறிப்பில் தருகிறது.
- issue: இறுதி தொடரின் வாக்கியத் தன்மை
  choice: வியப்பு கலந்த வினாவாக அமைத்தல்
  alternative: ‘இதுவே மனிதனுக்கான போதனை’ என்ற கூற்றாக அமைத்தல்
  rationale: மசோரா மெய்யெழுத்து உரை கேள்விக்குறியை நிர்ணயிப்பதில்லை. தாவீதின் வியப்பும் நேரடி அழைப்பும் தமிழில் இயல்பாக வெளிப்பட வினா-வியப்பு வடிவம் பயன்படுத்தப்பட்டுள்ளது; கூற்றாக வாசிப்பதும் சாத்தியம்.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கும் உரையில் மரியாதைப் பன்மை காக்கப்பட்டுள்ளது. ‘அடியேன்’ என்பது அரசனாகிய தாவீதின் பணிவான சுயக்குறிப்புக்கு ஏற்ற, இன்னும் புரிந்துகொள்ளக்கூடிய உயர்நடைச் சொல். கடினமான இறுதித் தொடரின் தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
