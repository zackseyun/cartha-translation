- from: இந்த வார்த்தைகள் அனைத்திற்கும் இந்தத் தரிசனம் அனைத்திற்கும் ஏற்ப, நாத்தான் தாவீதிடம் அப்படியே பேசினார்.[a]
  to: இந்த வார்த்தைகள் அனைத்தின்படியும், இந்தத் தரிசனம் முழுவதின்படியும்[a], நாத்தான் தாவீதிடம் இவ்வாறே பேசினார்.
  rationale: The revision retains the Hebrew’s emphatic repeated correspondence phrases while making them grammatical and natural in modern standard Tamil. ‘முழுவதின்படியும்’ represents the scope of ‘all this vision,’ and ‘இவ்வாறே’ preserves כֵּן as the concluding resumptive adverb. The footnote content is retained, with its anchor moved to the relevant lexical item.
