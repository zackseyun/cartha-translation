source:
  edition: WLC
  text: כְּ/כֹל֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וּ/כְ/כֹ֖ל הַ/חִזָּי֣וֹן הַ/זֶּ֑ה כֵּ֛ן דִּבֶּ֥ר נָתָ֖ן אֶל דָּוִֽד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/017.yaml
  text: According to all these words and according to all this vision[a], so Nathan spoke to David.
translation:
  language: ta
  text: இந்த வார்த்தைகள் அனைத்தின்படியும், இந்தத் தரிசனம் முழுவதின்படியும்[a], நாத்தான் தாவீதிடம் இவ்வாறே பேசினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தரிசனம்’ என்பதற்கு ‘வெளிப்பாடு’ என்றும் மொழிபெயர்க்கலாம். இந்த எபிரெயச் சொல், பெரும்பாலும் காட்சிவடிவில் பெறப்படும் தீர்க்கதரிசன வெளிப்பாட்டைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל
  choice: அனைத்திற்கும் ஏற்ப
  rationale: כְּ முன்னொட்டு ஒத்திசைவை, כֹל முழுமையைச் சுட்டுகிறது. தமிழில் இயல்பாக இருக்கும்படியும் எபிரெய உரையின் மீளுரைப்பைத் தக்கவைக்கும்படியும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகள்
  rationale: இங்கு דְּבָרִים என்பது நாத்தான் அறிவிக்கும் இறைச்செய்தியின் மொழிவடிவத்தைக் குறிக்கிறது; எனவே பொதுவான ‘காரியங்கள்’ என்பதற்குப் பதிலாக ‘வார்த்தைகள்’ பொருத்தமானது.
- source_word: וּכְכֹל
  choice: இந்தத் தரிசனம் அனைத்திற்கும் ஏற்ப
  rationale: மூலத்தில் வரும் இணைப்பையும் இணையான சொற்றொடரின் மீளுரைப்பையும் தமிழில் தக்கவைக்கிறது.
- source_word: הַחִזָּיוֹן הַזֶּה
  choice: இந்தத் தரிசனம்
  rationale: חִזָּיוֹן என்பது தீர்க்கதரிசன வெளிப்பாட்டுடன் தொடர்புடைய காட்சியைக் குறிக்கிறது. ‘தரிசனம்’ அதன் காட்சிவடிவை நேரடியாகத் தக்கவைக்கிறது.
- source_word: כֵּן
  choice: அப்படியே
  rationale: முன்னுள்ள ‘ஏற்ப’ என்ற இரு கூறுகளையும் தொகுத்து, நாத்தான் பெற்றபடியே கூறினார் என்ற ஒப்புமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: דִּבֶּר
  choice: பேசினார்
  rationale: דבר என்பதன் நேரான பொருள் ‘பேசுதல்’; வசனத்தின் கண்ணியமான கதைநடைப் பதிவுக்கும் இது ஏற்றது.
- source_word: נָתָן
  choice: நாத்தான்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயரெழுத்தாக்கம் பயன்படுத்தப்பட்டது.
- source_word: אֶל דָּוִד
  choice: தாவீதிடம்
  rationale: אֶל இங்கு பேச்சின் நோக்குநபரைச் சுட்டுகிறது; ‘தாவீதிடம்’ என்பது இயல்பான நவீனத் தமிழ்.
theological_decisions:
- issue: חִזָּיוֹן என்பதிலுள்ள தீர்க்கதரிசன வெளிப்பாட்டின் இயல்பு
  choice: முதன்மை உரையில் ‘தரிசனம்’
  alternative: ‘வெளிப்பாடு’ அல்லது ‘தீர்க்கதரிசனத் தரிசனம்’
  rationale: எபிரெயச் சொல் வெளிப்பாட்டின் காட்சிவடிவை வெளிப்படையாகக் குறிக்கிறது. ‘தரிசனம்’ இதைத் தக்கவைக்கிறது; ‘வெளிப்பாடு’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு நெருக்கமான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயில் உள்ள ‘அனைத்திற்கும் ஏற்ப’ என்ற இணையான அமைப்பும் ‘அப்படியே’ என்ற முடிவுறுத்தலும் இயன்றவரை தக்கவைக்கப்பட்டுள்ளன.
