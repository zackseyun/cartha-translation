  text: He will build a house for my name[a], and I will establish the throne of his kingdom forever.
translation:
  language: ta
  text: அவன் என் பெயருக்காக ஒரு வீட்டைக் கட்டுவான்[a]; நான் அவனுடைய அரசின் அரியணையை என்றென்றும் நிலைநிறுத்துவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் பெயருக்காக ஒரு ஆலயத்தைக் கட்டுவான்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் “என் பெயருக்காக ஒரு வீட்டைக் கட்டுவான்” என்று உள்ளது. இந்த அதிகாரத்தில், “வீடு” என்ற சொல் ஆலயத்திற்கும் அரச வம்சத்திற்கும் இடையிலான சொல்லாட்டத்தைத் தக்கவைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: அவன்
  rationale: தனியாக வரும் மூன்றாம் நபர் ஆண்பால் ஒருமைப் பிரதிப்பெயரை நேரடியாகத் தருகிறது; “அவனே” எனத் தேவையற்ற வலியுறுத்தலைச் சேர்க்கவில்லை.
- source_word: יִבְנֶה
  choice: கட்டுவான்
  rationale: வாக்குறுதியின் சூழலில் எதிர்காலச் செயலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּיִת
  choice: ஒரு வீடு
  rationale: உடனடிச் சூழலில் ஆலயத்தைக் குறித்தாலும், மூலத்தின் நேரடிச் சொல்லையும் இந்த அதிகாரத்தில் ஆலயம்–அரச வம்சம் ஆகியவற்றுக்கு இடையிலான சொல்லாட்சியையும் இயன்றவரைத் தக்கவைக்கிறது.
- source_word: לִשְׁמִי
  choice: என் பெயருக்காக
  rationale: எபிரெய உடன்படிக்கைச் சொற்றொடரை மிகையாக விளக்காமல் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: וְכֹנַנְתִּי
  choice: நான் ... நிலைநிறுத்துவேன்
  rationale: அரச வாக்குறுதியின் சூழலில் அரியணையை உறுதியாக நிறுவும் எதிர்காலச் செயலைத் தெளிவாகத் தருகிறது.
- source_word: כִּסֵּא מַמְלַכְתּוֹ
  choice: அவனுடைய அரசாட்சியின் அரியணை
  rationale: அரச அதிகாரத்தையும் ஆட்சியையும் குறிக்கும் மூலச் சொற்களை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: வாக்குறுதியின் நிலையான, முடிவில்லாத தன்மையை வலுவிழக்கச் செய்யாமல் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: בַּיִת என்பதை “வீடு” என்றா, விளக்கமாக “ஆலயம்” என்றா மொழிபெயர்ப்பது
  choice: வீடு
  alternative: ஆலயம்
  rationale: இங்கு சாலொமோன் கட்டவிருக்கும் பரிசுத்த இடமே உடனடிக் குறிப்பு. எனினும் அதிகாரம் முழுவதிலும் ஆலயம் மற்றும் அரச வம்சம் ஆகிய இரண்டையும் இணைக்கும் “வீடு” என்ற சொல்லாட்சி முக்கியமானது; ஆகவே பிரதான உரை அந்தத் தெளிவுபடுத்தப்படாத இலக்கியத் தொடர்பைத் தக்கவைக்கிறது.
- issue: עַד עוֹלָם என்பதன் வலிமை
  choice: என்றென்றும்
  alternative: நெடுங்காலத்திற்கு
  rationale: தாவீதுக்குக் கொடுக்கப்படும் இந்த வாக்குறுதியில் சொற்றொடர் நிலையான தொடர்ச்சியை வலியுறுத்துகிறது; அதை வெறும் நீண்ட காலமாகக் குறைக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “ராஜ்யம்” என்பதற்குப் பதிலாக இயல்பான “அரசாட்சி” தேர்ந்தெடுக்கப்பட்டுள்ளது; மூலத்தின் “வீடு” பிரதான உரையில் வைக்கப்பட்டு “ஆலயம்” அடிக்குறிப்பில் தரப்பட்டுள்ளது.
