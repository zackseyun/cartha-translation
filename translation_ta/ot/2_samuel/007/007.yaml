base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/007.yaml
  text: In all the places where I have walked among all the sons of Israel[a], did I ever speak a word to one of the tribes of Israel, whom I commanded to shepherd my people Israel, saying, ‘Why have you not built me a house of cedar?’
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் அனைவரிடையிலும் நான் நடமாடிய எல்லா இடங்களிலும், என் மக்களாகிய இஸ்ரவேலை மேய்க்கும்படி நான் கட்டளையிட்ட இஸ்ரவேல் கோத்திரங்களில் ஒன்றிடமாவது[a], ‘நீங்கள் ஏன் எனக்காகக் கேதுரு மரத்தால் ஒரு வீட்டைக் கட்டவில்லை?’ என்று நான் எப்போதாவது ஒரு வார்த்தை சொன்னதுண்டா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய உரை: “இஸ்ரவேல் கோத்திரங்களில் ஒன்று.” இதற்கு இணையான 1 நாளாகமம் 17:6-இல் “இஸ்ரவேலின் நியாயாதிபதிகள்” என்று உள்ளது; மக்களை மேய்க்கும் பொறுப்பு அளிக்கப்பட்ட தலைவர்களை அது சுட்டக்கூடும்.'
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: நான் நடமாடிய
  rationale: ஹித்பஆல் வடிவம் நிலையாகத் தங்கியிருப்பதைவிட மக்களிடையே சென்று வந்ததைக் குறிக்கிறது. ‘நடமாடிய’ என்பது அசைவு மற்றும் உடனிருப்பு ஆகிய இரண்டையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בְּכֹל אֲשֶׁר ... בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள் அனைவரிடையிலும் ... எல்லா இடங்களிலும்
  rationale: இரட்டைப் בְּכֹל / בְּכָל அமைப்பைச் சொற்சொல்லாகப் பின்பற்றாமல், நடமாடுதல் என்னும் உருவகத்துக்கு ஏற்றவாறு இடப்பொருளையும் மக்களிடையே இருப்பதையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: இது வழக்கமான தேசிய/உடன்படிக்கைப் பெயராகச் செயல்படுகிறது. தமிழில் ‘இஸ்ரவேலின் மகன்கள்’ என்பது இயல்பற்றதாகவும் யாக்கோபின் நேரடி மகன்களை மட்டும் குறிக்கக்கூடியதாகவும் இருப்பதால், உள்ளடங்கிய சமூகத்தைக் குறிக்கும் ‘இஸ்ரவேல் மக்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: நான் எப்போதாவது ஒரு வார்த்தை சொன்னதுண்டா?
  rationale: வினாவுருபும் ஒரே வேர் சார்ந்த பெயர்-வினைச் சேர்க்கையும் வலியுறுத்தும் மறுப்பை உருவாக்குகின்றன. ‘எப்போதாவது ஒரு வார்த்தை’ என்பது அந்த வினாவியல் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: אַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் கோத்திரங்களில் ஒன்றிடமாவது
  rationale: மசோரா எபிரெய உரையில் இருப்பது ‘கோத்திரங்கள்’ என்பதே. உடனுள்ள மேய்ப்புப் பொறுப்பு தலைவர்களைச் சுட்டுவது போல இருந்தாலும், அந்த விளக்கத்தை முதன்மை உரையில் புகுத்தாமல் மூல வாசகம் தக்கவைக்கப்படுகிறது.
- source_word: אֲשֶׁר צִוִּיתִי לִרְעוֹת
  choice: மேய்க்கும்படி நான் கட்டளையிட்ட
  rationale: ‘மேய்த்தல்’ என்பது ஆட்சி மற்றும் பராமரிப்பைக் குறிக்கும் மேய்ப்பர் உருவகத்தைத் தக்கவைக்கிறது; ‘ஆளும்படி’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: עַמִּי אֶת יִשְׂרָאֵל
  choice: என் மக்களாகிய இஸ்ரவேலை
  rationale: இணைவிளக்க அமைப்பை ‘என் மக்களாகிய இஸ்ரவேல்’ என்று வழங்குவது உடன்படிக்கைச் சொந்தத்தையும் மக்களின் அடையாளத்தையும் தெளிவாகக் காக்கிறது.
- source_word: לָמָּה לֹא בְנִיתֶם לִי בֵּית אֲרָזִים
  choice: நீங்கள் ஏன் எனக்காகக் கேதுரு மரத்தால் ஒரு வீட்டைக் கட்டவில்லை?
  rationale: பன்மை வினை வடிவத்தை ‘நீங்கள்’ என்பதால் காக்கிறது. בֵּית என்பதை கோவில் அல்லது ஆலயம் என்று முன்கூட்டியே விளக்காமல் ‘வீடு’ என்றும், אֲרָזִים என்பதை கட்டுமானப் பொருளாகத் தெளிவாகவும் வழங்குகிறது.
theological_decisions:
- issue: இஸ்ரவேலரைக் குறிக்கும் பாலினமுள்ள உடன்படிக்கைப் பெயர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடர் இலக்கணத்தில் ஆண்பாலாக இருந்தாலும் இங்கு முழு இஸ்ரவேல் சமூகத்திற்கான நிலையான பெயராக உள்ளது. நவீன தமிழில் ‘மக்கள்’ என்பது பொருளைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது; ஆண்பாலினருக்கு மட்டும் உரையைச் சுருக்குவதில்லை.
- issue: ‘கோத்திரங்கள்’ என்ற வாசகத்துக்கும் மேய்க்க நியமிக்கப்பட்ட தலைவர்களைக் குறிக்கும் சூழலுக்கும் இடையிலான பதற்றம்
  choice: இஸ்ரவேல் கோத்திரங்களில் ஒன்று
  alternative: இஸ்ரவேலின் நியாயாதிபதிகள் அல்லது தலைவர்களில் ஒருவர்
  rationale: 2 சாமுவேலின் மசோரா உரை ‘கோத்திரங்கள்’ என்று வாசிப்பதால் அதுவே முதன்மை உரையில் மொழிபெயர்க்கப்படுகிறது. 1 நாளாகமம் 17:6-இன் இணைப்பகுதி ‘நியாயாதிபதிகள்’ என்று வாசிப்பதையும், மேய்ப்புப் பொறுப்பு தலைமைத்துவத்தை உணர்த்துவதையும் அடிக்குறிப்பு தெரிவிக்கிறது; எந்த வாசகமும் மறைவாக மாற்றப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நடமாடிய’, ‘மேய்க்கும்படி’, ‘கேதுரு மரம்’ போன்ற சொற்கள் மூலத்தின் உருவகங்களையும் வரலாற்றுச் சூழலையும் காக்கின்றன. வினாவியல் மறுப்பின் வலிமை இயல்பான தமிழ் வாக்கிய அமைப்பில் தக்கவைக்கப்பட்டுள்ளது.
