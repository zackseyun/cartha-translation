base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/009.yaml
  text: And I was with you wherever you went[a], and I cut off all your enemies from before you. And I will make for you a great name[b], like the name of the great ones who are on the earth.
translation:
  language: ta
  text: நீ சென்ற இடமெல்லாம் நான் உன்னோடு இருந்தேன்; உன் எதிரிகள் எல்லாரையும் உன் முன்னிலையிலிருந்து ஒழித்தேன். பூமியிலுள்ள பெரியோரின்[b] பெயரைப் போல, உனக்கும் பெரும் பெயரை[a] ஏற்படுத்துவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பெரும் புகழை.’ எபிரெய மொழியில் ‘பெயர்’ என்பது பல நேரங்களில் நற்பெயர் அல்லது புகழைக் குறிக்கிறது; முதன்மை உரை வேதாகம உருவகத்தைத் தக்கவைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பூமியிலுள்ள பெரிய மனிதர்களின்.’
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  choice: நான் உன்னோடு இருந்தேன்
  rationale: இறந்தகால நிகழ்வுகளின் தொடரில் வரும் எபிரெய வினையை இயல்பான இறந்தகாலமாக மொழிபெயர்க்கிறது; உடனிருப்பதையும் ஆதரவையும் தக்கவைக்கிறது.
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: நீ சென்ற இடமெல்லாம்
  rationale: தாவீதின் பயணங்களின் முழு பரப்பையும் குறிக்கும் எபிரெய வழக்கை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וָאַכְרִתָה אֶת כָּל אֹיְבֶיךָ מִפָּנֶיךָ
  choice: உன் எதிரிகள் எல்லாரையும் உன் முன்னிலையிலிருந்து ஒழித்தேன்
  rationale: כרת என்பதன் அழித்தல் அல்லது முற்றிலும் அகற்றுதல் என்ற வலிமையை ‘ஒழித்தேன்’ வெளிப்படுத்துகிறது; ‘உன் முன்னிலையிலிருந்து’ என்பது מִפָּנֶיךָ என்பதன் இடம்சார்ந்த உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וְעָשִׂיתִי לְךָ
  choice: உனக்கும் … ஏற்படுத்துவேன்
  rationale: வாக்குறுதி சூழலில் வினையின் எதிர்கால வலிமையைத் தெரிவிக்கிறது; לְךָ என்பதன் பயனாளிப் பொருளை ‘உனக்கும்’ தக்கவைக்கிறது.
- source_word: שֵׁם גָּדוֹל
  choice: பெரும் பெயர்
  rationale: புகழ் அல்லது நற்பெயர் என்ற பொருள் இருந்தாலும், வேதாகமத்தின் ‘பெயர்’ என்ற உருவகத்தையும் பிற பகுதிகளுடனான தொடர்பையும் பாதுகாக்கிறது.
- source_word: כְּשֵׁם הַגְּדֹלִים אֲשֶׁר בָּאָרֶץ
  choice: பூமியிலுள்ள பெரியோரின் பெயரைப் போல
  rationale: ‘பெயர்’ என்ற சொல் மீண்டும் வருவதையும் ஒப்புமையையும் தக்கவைக்கிறது; הַגְּדֹלִים என்பதை பாலினத்தைத் தேவையின்றிக் குறிப்பாக்காமல் ‘பெரியோர்’ எனத் தருகிறது; இங்கு אָרֶץ பரந்த உலகளாவிய பொருளில் ‘பூமி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: தெய்வீக வாக்குறுதியின் சூழலில் וְעָשִׂיתִי என்பதன் காலப்பொருள்
  choice: எதிர்காலமாக ‘ஏற்படுத்துவேன்’
  alternative: இறந்தகால நிறைவாக ‘ஏற்படுத்தியிருக்கிறேன்’
  rationale: வடிவில் qatal ஆக இருந்தாலும், கடந்த செயல்களை நினைவுகூர்ந்த பின் வரும் வாக்குறுதியாக உரை நகர்கிறது; 1 நாளாகமம் 17:8-இன் இணை உரையும் எதிர்காலப் பொருளை ஆதரிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. எபிரெய மொழியின் ‘பெரும் பெயர்’ உருவகம் பாதுகாக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களின் அருகில் வைக்கப்பட்டுள்ளன.
