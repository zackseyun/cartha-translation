  yaml_path: translation/ot/2_samuel/019/024.yaml
  text: And the king said to Shimei[a], “You shall not die.” And the king swore to him.
translation:
  language: ta
  text: அரசன் சிமெயியிடம்[a], “நீ மரிக்கமாட்டாய்” என்றான். பின்பு அரசன் அவனுக்குச் சத்தியம் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை விளக்கமாக, “நீ கொல்லப்படமாட்டாய்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் சொற்படியாக, “நீ மரிக்கமாட்டாய்” என்று உள்ளது; இங்கு அது மரணதண்டனையிலிருந்து மன்னிப்பளிக்கும் அரச வாக்குறுதியாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: எபிரெயக் கதைநடையின் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் வினை; தமிழில் பேச்சுக்குப் பின் வரும் ‘என்றான்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: சூழலில் ஏற்கெனவே அறியப்பட்ட அரசரைக் குறிக்கும் திட்டவட்டமான பெயர்ச்சொல்.
- source_word: אֶל שִׁמְעִי
  choice: சிமேயியிடம்
  rationale: பேச்சைப் பெறுபவரைக் குறிக்கும் אֶל என்பதையும் தனிப்பெயரையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: לֹא תָמוּת
  choice: நீ சாகமாட்டாய்
  rationale: ‘நீ சாகமாட்டாய்’ என்பது எபிரெயச் சொல்லமைப்பை நேரடியாகப் பாதுகாத்து, இது பொதுவான உயிர்வாழ்வு உறுதியா அல்லது மரணதண்டனையிலிருந்து அரச மன்னிப்பா என்பதை உரையிலேயே தீர்மானிக்காமல் விடுகிறது.
- source_word: וַיִּשָּׁבַע
  choice: சத்தியம் செய்தான்
  rationale: நிபால் வடிவிலுள்ள שבע என்பது சத்தியம் செய்வதைக் குறிக்கிறது; இத்தமிழ் சொற்றொடர் சுருக்கமாகவும் வழக்காகவும் உள்ளது.
- source_word: לוֹ
  choice: அவனுக்கு
  rationale: பின்னொட்டு சிமேயியைக் குறிக்கிறது; பெயரைத் தேவையின்றி மீண்டும் கூறாமல் அதன் தொடர்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: לֹא תָמוּת என்பதன் வாக்குறுதி அல்லது தீர்ப்பாணைத் தன்மை
  choice: நீ சாகமாட்டாய்
  alternative: நீ கொல்லப்படமாட்டாய்
  rationale: மூலவாக்கியம் சொற்படியாக ‘நீ சாகமாட்டாய்’ என்கிறது. சூழலில் அது மரணதண்டனையிலிருந்து மன்னிப்பைக் குறிக்கக்கூடும்; இருப்பினும் அந்த விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் உண்மையான பொருள் விரிவைத் தக்கவைத்துள்ளோம்.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சாகமாட்டாய்’ என்பது பொதுவாகப் புரியும் சொல் என்பதுடன் மூலத்தின் நேரடியான வடிவையும் அதன் பொருள் நெருக்கடியையும் காக்கிறது. supplied WLC உரையே மொழிபெயர்க்கப்பட்டுள்ளது; அது பொதுவாக 2 சாமுவேல் 19:23 என எண்ணிடப்படும் வசனத்துடன் ஒத்துள்ளது, சில வசன எண் மரபுகளில் வேறுபாடு இருக்கலாம்.
