translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானவும் பொதுவாசகர்களுக்குப் புரியக்கூடியதாகவும் வடிவமைக்கப்பட்டது. עבר வினையின் மீளுருவாக்கம் முதல் இரு கூறுகளில் தக்கவைக்கப்பட்டுள்ளது; நேரடிச் செயப்படுபொருளுடன் வரும் வடிவத்தின் காரணவினை நுணுக்கம் முதன்மை உரையிலும் அடிக்குறிப்பிலும் வெளிப்படுத்தப்பட்டுள்ளது.
