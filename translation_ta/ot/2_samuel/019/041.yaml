base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/041.yaml
  text: Then the king crossed over to Gilgal[a], and Kimham crossed over with him. And all the people of Judah escorted the king across, and also half the people of Israel.
translation:
  language: ta
  text: பின்பு அரசர் கில்காலுக்குக் கடந்து சென்றார்; கிம்ஹாமும் அவருடன் கடந்து சென்றான். யூதாவின் மக்கள் அனைவரும், இஸ்ரவேல் மக்களில் பாதி மக்களும், அரசரை அக்கரைக்குக் கூட்டிச் சென்றார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசரைக் கடக்கச் செய்தார்கள்.” இங்கு எபிரெய வினை, நேரடிச் செயப்படுபொருளுடன் வருவதால், அரசரை அக்கரைக்குக் கொண்டு சென்றார்கள் அல்லது கடக்கச் செய்தார்கள் என்ற காரணவினைப் பொருளைக் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: கடந்து சென்றார்
  rationale: עבר என்ற வினை இச்சூழலில் யோர்தானைக் கடப்பதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் இயக்கத்தை வெளிப்படுத்துகிறது.
- source_word: הַגִּלְגָּלָה
  choice: கில்காலுக்கு
  rationale: இடப்பெயருடன் சேர்ந்துள்ள திசைகாட்டும் ה, கில்காலை நோக்கிய இயக்கத்தைக் குறிக்கிறது.
- source_word: וְכִמְהָן
  choice: கிம்காமும்
  rationale: כִמְהָן என்ற எபிரெய தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; וְ என்பதன் இணைப்புப் பொருளும் இயல்பாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: עָבַר עִמּוֹ
  choice: அவருடன் கடந்து சென்றான்
  rationale: முன்னுள்ள עבר வினையின் மறுபயன்பாட்டைத் தக்கவைத்து, கிம்காம் அரசருடன் அதே கடப்பில் சென்றதை வெளிப்படுத்துகிறது.
- source_word: וְכָל עַם יְהוּדָה
  choice: யூதாவின் மக்கள் அனைவரும்
  rationale: யூதாவைச் சேர்ந்த மக்களைக் குறிக்கும் கூட்டுப்பெயரைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: וַיַּעַבְרוּ אֶת־הַמֶּלֶךְ
  choice: அரசரைக் கடத்திச் சென்றார்கள்
  rationale: நேரடிச் செயப்படுபொருளுடன் வரும் עבר இங்கு அரசரைக் கடப்பித்தல் அல்லது உடனிருந்து அக்கரைக்குக் கொண்டுசெல்லுதல் என்ற காரணவினை/மாற்றுவினைப் பொருளைக் கொண்டுள்ளது.
- source_word: וְגַם
  choice: அவ்வாறே
  rationale: கூடுதலாகப் பங்கேற்ற குழுவைச் சுட்டும் சேர்க்கைப் பொருளை, முந்தைய செயலுடன் இயல்பாக இணைக்கிறது.
- source_word: חֲצִי עַם יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களில் பாதிப்பேரும்
  rationale: அளவைக் குறிக்கும் חֲצִי என்பதைத் தெளிவாகத் தந்து, யூதாவுக்கும் இஸ்ரவேலுக்கும் இடையிலான உரைசார் வேறுபாட்டைத் தக்கவைக்கிறது.
