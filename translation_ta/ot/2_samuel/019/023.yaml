base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/023.yaml
  text: And David said[a], “What have I to do with you, sons of Zeruiah, that you should be an adversary to me today? Shall any man be put to death in Israel today? For do I not know that today I am king over Israel?”
translation:
  language: ta
  text: தாவீது, “செருயாவின் மகன்களே, எனக்கும் உங்களுக்கும் என்ன சம்பந்தம்? இன்று நீங்கள் எனக்கு எதிரியாக இருப்பதேன்? இன்று இஸ்ரவேலில் ஒருவன் மரண தண்டனைக்கு உட்படுத்தப்பட வேண்டுமா? இன்று நான் இஸ்ரவேலின்மேல் அரசனாக இருக்கிறேன் என்பதை நான் அறியவில்லையா?” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: எனக்கும் உங்களுக்கும் என்ன சம்பந்தம்?
  rationale: விலகலை அல்லது கண்டிப்பை வெளிப்படுத்தும் எபிரெய மொழிமரபை, அதன் வலிமையைத் தக்கவைத்து இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: בְּנֵי צְרוּיָה
  choice: செருயாவின் மகன்களே
  rationale: யோவாபையும் அபிசாயையும் நேரடியாக அழைக்கும் குடும்ப அடையாளத்தைப் பாலினத் துல்லியத்துடன் அப்படியே தக்கவைக்கிறது.
- source_word: כִּי תִהְיוּ לִי הַיּוֹם לְשָׂטָן
  choice: இன்று நீங்கள் எனக்கு எதிரிகளாக இருப்பதற்கு
  rationale: שָׂטָן இங்கு தனிப்பெயர் அல்ல; எதிர்ப்பவர் அல்லது தடையாக நிற்பவர் என்னும் பொதுப்பெயர். பன்மை எழுவாய்க்கேற்ப தமிழில் ‘எதிரிகளாக’ என வழங்கப்பட்டுள்ளது.
- source_word: יוּמַת אִישׁ
  choice: ஒருவன் கொல்லப்பட வேண்டுமா?
  rationale: வெறுமனே இறப்பதை அல்ல, ஒருவரைக் கொல்லச் செய்வதைக் குறிக்கும் எபிரெய வினையின் செயப்பாட்டு வலிமையைத் தெளிவாகப் பிரதிபலிக்கிறது; சூழல் அரசரால் அனுமதிக்கப்படும் தண்டனையைச் சுட்டுகிறது.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: மூலத்தின் ஆண்பால் ஒருமையைத் தக்கவைத்தாலும், இச்சூழலில் பிரதிநிதித்துவப் பொதுப்பொருளில் இயல்பாகச் செயல்படுகிறது.
- source_word: הֲלוֹא יָדַעְתִּי
  choice: நான் அறியவில்லையா?
  rationale: உறுதியான ஒப்புதலை எதிர்பார்க்கும் எதிர்மறை வினாவின் சொல்லாட்சியையும் வலியுறுத்தலையும் தக்கவைக்கிறது.
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல் அரசன்
  rationale: עַל என்பதன் ‘மேல்’ என்ற நேரடிப் பொருளையும் தாவீதின் நிகழ்கால அரச அதிகாரத்தையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: שָׂטָן என்பதன் பொருள்
  choice: ‘எதிரி’ என்னும் பொதுப்பெயர்
  alternative: ‘சாத்தான்’ என்னும் தனிப்பெயர்
  rationale: இந்த வரலாற்றுக் கதைச்சூழலில் செருயாவின் மகன்கள் தாவீதின் முடிவுக்கு எதிராக நிற்பதையே சொல் குறிக்கிறது. ‘சாத்தான்’ எனத் தனிப்பெயராக மொழிபெயர்ப்பது உடனடிச் சூழல் ஆதரிக்காத பிற்கால பேயியல் கருத்தை இங்கு புகுத்திவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மொழிமரபு தமிழில் இயல்பாக மாற்றப்பட்டுள்ளதுடன், சொல்லின் எதிர்ப்புப் பொருளும் அரசரின் நீதித் தீர்ப்பு சார்ந்த சூழலும் பாதுகாக்கப்பட்டுள்ளன.
