translation:
  language: ta
  text: அவர் யூதாவின் எல்லா மனிதர்களின் உள்ளத்தையும் ஒருமனதாகத் தம் பக்கம் திருப்பினார். அவர்கள் அரசனிடம், “நீரும் உம்முடைய பணியாளர்கள் அனைவரும் திரும்பி வாருங்கள்” என்று செய்தி அனுப்பினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּט אֶת־לְבַב
  choice: உள்ளத்தையும் ... தம் பக்கம் திருப்பினார்
  rationale: נטה என்பதன் ‘சாயச் செய்தல்/திருப்புதல்’ என்ற பொருளையும், לֵב என்பதன் மனவிருப்பம் மற்றும் விசுவாசத்தை உள்ளடக்கும் ‘உள்ளம்’ என்ற பொருளையும் இயல்பான தமிழில் தருகிறது. சூழலில் செய்பவர் தாவீது என்பதால் ‘தம் பக்கம்’ என்பது நோக்கத்தைத் தெளிவாக்குகிறது.
- source_word: כָּל־אִישׁ יְהוּדָה
  choice: யூதாவின் ஆண்கள் அனைவருடைய
  rationale: אִישׁ என்ற ஒருமை வடிவம் இங்கு பகிர்ந்தளிக்கும் பொருளில் ‘ஒவ்வொரு ஆணும்/ஆண்கள் அனைவரும்’ என்பதைக் குறிக்கிறது; கூட்டத்தை இயல்பான தமிழில் இவ்வாறு வழங்குகிறது.
- source_word: כְּאִישׁ אֶחָד
  choice: ஒரே மனிதனுடைய உள்ளம்போல்
  rationale: எபிரெய உருவகத்தைப் பாதுகாத்து, அவர்கள் ஒருமனப்பட்டதை வெளிப்படுத்துகிறது.
- source_word: עֲבָדֶיךָ
  choice: உம்முடைய பணியாளர்கள்
  rationale: அரசவைக் சூழலில் ‘பணியாளர்கள்’ என்பது עֶבֶד என்பதன் சேவை உறவைத் தருகிறது; இங்கு ‘அடிமைகள்’ என்பது தேவையற்ற சமூக அர்த்தத்தை முன்னிறுத்தும்.
theological_decisions:
- issue: யூதாவின் உள்ளத்தைத் திருப்பியவர் யார் என்பது
  choice: எபிரெய உரையில் உள்ள ஆண்பால் ஒருமை எழுவாயை ‘அவர்’ என்று தாவீதைக் குறிக்கும் வகையில் வைத்தல்
  alternative: அருகிலுள்ள சூழலை அடிப்படையாகக் கொண்டு வெளிப்படையாக ‘தாவீது’ என்று பெயரிடுதல்
  rationale: மூல வசனம் பெயரை மீண்டும் சொல்லாமல் பிரதிப்பெயரைப் பயன்படுத்துகிறது; அதையே பாதுகாப்பது உரையின் தொடர்ச்சியையும் சிறிய அளவிலான மறைபொருளையும் காக்கிறது.
- issue: இதயத்தைச் சாயச் செய்தல் என்பதன் வலிமை
  choice: ‘தம் பக்கம் திருப்பினார்’
  alternative: ‘வற்புறுத்தினார்’ அல்லது ‘கட்டுப்படுத்தினார்’
  rationale: נטה செல்வாக்கினால் மனநிலையை மாற்றியதைக் குறிக்கலாம்; கட்டாயப்படுத்தல் அல்லது மறைமுகமான தெய்வீகச் செயற்பாடு போன்ற கருத்துகளை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதைமிக்க அரச உரையாடலுக்காக ‘நீர்/உம்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. வாக்கியம் இயல்பாக இருக்க இரு பகுதிகளாகப் பிரிக்கப்பட்டுள்ளது; அதேவேளை எபிரெய உரையின் காரணத் தொடர்ச்சி ‘ஆகவே’ மூலம் காட்டப்பட்டுள்ளது.
