base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/010.yaml
  text: And all the people were disputing throughout all the tribes of Israel[a], saying, “The king delivered us from the hand of our enemies, and he rescued us from the hand of the Philistines[c][b], but now he has fled from the land because of Absalom.”
translation:
  language: ta
  text: இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலும் மக்கள் அனைவரும் வாதிட்டுக்கொண்டிருந்தார்கள்[a]. அவர்கள், “அரசர் நம் எதிரிகளின் கையிலிருந்து நம்மை விடுவித்தார்; பெலிஸ்தியர்களின் கையிலிருந்தும் நம்மை மீட்டார்[b]. ஆனால் இப்போது அவர் அப்சலோமின் காரணமாக நாட்டைவிட்டு ஓடிப்போயிருக்கிறார்[c]” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விவாதித்துக்கொண்டிருந்தார்கள்” அல்லது “கருத்துமோதலில் இருந்தார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சாதாரண உரையாடலை அல்ல, கோத்திரங்களெங்கும் பரவியிருந்த கருத்துமோதலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “நம் எதிரிகளின் கையிலிருந்து” என்றும் “பெலிஸ்தியர்களின் கையிலிருந்து” என்றும் உள்ளது. இங்கு “கை” என்பது ஒருவரின் அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் வழக்கு.
    reason: lexical_alternative
  - marker: c
    text: “அப்சலோமிடமிருந்து விலகி” அல்லது “அப்சலோமின் நிமித்தமாக” என்றும் மொழிபெயர்க்கலாம். எபிரெயத் தொடர், அவனிடமிருந்து விலகி ஓடுவதையோ அவன் கொடுத்த நெருக்கடியால் ஓடுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָדוֹן
