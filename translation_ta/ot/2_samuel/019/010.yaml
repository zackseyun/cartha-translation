  rationale: דין என்பதன் நிஃபால் வடிவம் இங்கு சாதாரண உரையாடலைவிட வலுவான, தொடர்ந்து நடந்த பொதுவான கருத்துமோதல் அல்லது விவாதத்தைக் குறிக்கிறது.
