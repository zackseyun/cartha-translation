  rationale: இந்த விவாதம் இஸ்ரவேல் முழுவதும் ஒவ்வொரு கோத்திரத்திலும் பரவியிருந்ததைக் காட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: לֵאמֹר
  choice: என்று சொல்லிக்கொண்டிருந்தார்கள்
  rationale: மக்களின் தொடர்ச்சியான வாதத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழ் வாக்கிய அமைப்புக்கேற்ப மேற்கோளின் முடிவில் வைக்கப்பட்டது.
- source_word: הִצִּילָנוּ
  choice: நம்மை விடுவித்தார்
  rationale: ஆபத்திலிருந்தும் எதிரிகளின் அதிகாரத்திலிருந்தும் காப்பாற்றிய அரசியல்-இராணுவ விடுதலையை வெளிப்படுத்துகிறது.
- source_word: מִכַּף אֹיְבֵינוּ
  choice: நம் எதிரிகளின் கையிலிருந்து
  rationale: ‘கை’ என்பது அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய வழக்கு; தமிழிலும் பொருள் புரியக்கூடியதால் உருவகம் பாதுகாக்கப்பட்டது.
- source_word: מִלְּטָנוּ
  choice: நம்மை மீட்டார்
  rationale: முந்தைய הִצִּילָנוּ உடன் பொருள் ஒத்திருந்தாலும், இரண்டு தனித்த வினைச்சொற்களையும் தமிழில் வேறுபடுத்திக் காட்டுகிறது.
- source_word: מִכַּף פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களின் கையிலிருந்தும்
  rationale: முந்தைய ‘கையிலிருந்து’ என்ற உருவகத்துடன் எபிரெய இணைவடிவையும் மீளுரையையும் பாதுகாக்கிறது.
- source_word: וְעַתָּה
  choice: ஆனால் இப்போது
  rationale: அரசரின் முந்தைய வெற்றிகளுக்கும் தற்போதைய ஓட்டத்துக்கும் இடையிலான முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בָּרַח
  choice: ஓடிப்போயிருக்கிறார்
  rationale: முன்பு நிகழ்ந்த ஓட்டத்தின் தற்போதைய விளைவைத் தமிழ் நிறைவுநிலை வடிவில் தெரிவிக்கிறது.
- source_word: מִן הָאָרֶץ
  choice: நாட்டைவிட்டு
  rationale: אֶרֶץ இங்கு பூமியையல்ல, நாட்டின் நிலப்பரப்பைக் குறிக்கிறது; ‘நாட்டைவிட்டு’ என்பது இயல்பான தமிழாக்கம்.
- source_word: מֵעַל אַבְשָׁלוֹם
  choice: அப்சலோமின் காரணமாக
  rationale: ஓடுதல் வினைக்குப் பின் வரும் מֵעַל, அப்சலோமிடமிருந்து விலகியோ அவன் கொடுத்த நெருக்கடியாலோ ஓடியதைக் குறிக்கும்; மூலத்தின் காரண/விலகல் நுணுக்கத்தை அடிக்குறிப்பில் பாதுகாத்து, பிரதான உரையில் தெளிவாக மொழிபெயர்க்கப்பட்டது.
