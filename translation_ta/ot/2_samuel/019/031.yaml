translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசருக்கான மரியாதைப் பன்மையும் அரசவை அழைப்பும் காக்கப்பட்டுள்ளன. சொத்து யாருக்குக் கிடைக்க வேண்டும் என்ற சூழலை மிகையாக விளக்காமல், மூலத்தின் சுருக்கமும் மேவிபோசேத்தின் உணர்ச்சிவசமான விட்டுக்கொடுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
