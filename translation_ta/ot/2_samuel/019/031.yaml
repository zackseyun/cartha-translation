  text: וַ/יֹּ֤אמֶר מְפִיבֹ֨שֶׁת֙ אֶל הַ/מֶּ֔לֶךְ גַּ֥ם אֶת הַ/כֹּ֖ל יִקָּ֑ח אַ֠חֲרֵי אֲשֶׁר בָּ֞א אֲדֹנִ֥/י הַ/מֶּ֛לֶך בְּ/שָׁל֖וֹם אֶל בֵּיתֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/031.yaml
  text: Mephibosheth said to the king[a], “Let him even take it all, since my lord the king has come safely to his own house.”
translation:
  language: ta
  text: 'மேவிபோசேத் அரசரிடம், “என் ஆண்டவராகிய அரசர் தமது வீட்டுக்கு நலமாக[a] வந்துவிட்டதால், அவன் எல்லாவற்றையும்கூட எடுத்துக்கொள்ளட்டும்” என்றான்.


    [a] சொல்லர்த்தமாக, “சமாதானத்துடன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “சமாதானத்துடன்.”
    reason: בְּשָׁלוֹם என்பதற்கான சொல்லர்த்தமான மாற்றைத் தருகிறது; சூழலில் இது பாதுகாப்பாகவும் நலமாகவும் வந்ததைக் குறிக்கிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: எபிரெயக் கதைநடையில் אָמַר என்பதன் இயல்பான தமிழ் இறந்தகால வடிவம்; நேரடி உரையின் முடிவில் தமிழுக்கு இயல்பாக அமைக்கப்பட்டது.
- source_word: מְפִיבֹשֶׁת
  choice: மேவிபோசேத்
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவில் தருகிறது.
- source_word: אֶל הַמֶּלֶךְ
  choice: அரசரிடம்
  rationale: மூலத்தில் தனிப்பெயர் இல்லாமல் பட்டமே உள்ளது; ‘அரசரிடம்’ அதை இயல்பான தமிழில் காக்கிறது.
- source_word: גַּם אֶת הַכֹּל יִקָּח
  choice: அவனே எல்லாவற்றையும் எடுத்துக்கொள்ளட்டும்
  rationale: יִקָּח இங்கு விருப்பமுள்ள விட்டுக்கொடுத்தலைக் காட்டும் கட்டளைப் பொருளுடைய வடிவம். גַּם தரும் வலியுறுத்தலை ‘அவனே’ என்றும், הַכֹּל என்பதன் முழுமையை ‘எல்லாவற்றையும்’ என்றும் வெளிப்படுத்துகிறது.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: திரும்பி வந்துவிட்டாரே
  rationale: 'சொற்றொடரின் கால-காரண நுணுக்கம் தமிழில் வாக்கிய முடிவிலுள்ள ‘-விட்டாரே’ மூலம் இயல்பாக வெளிப்படுகிறது: அரசர் திரும்பியிருப்பதே சொத்தையெல்லாம் விட்டுக்கொடுப்பதற்கான காரணம்.'
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசர்
  rationale: அரசவைக்குரிய மரியாதையான அழைப்பை நவீன, கண்ணியமான தமிழில் காக்கிறது.
- source_word: בְּשָׁלוֹם
  choice: நலமாக
  rationale: இச்சூழலில் அரசர் தீங்கின்றிப் பாதுகாப்பாகத் திரும்பியதைக் குறிக்கும் இயல்பான தமிழ். ‘சமாதானத்துடன்’ என்ற சொல்லர்த்தமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶל בֵּיתוֹ
  choice: தமது வீட்டுக்கு
  rationale: மரியாதைப் பொருந்திய தன்மைப் பதிலீட்டுடன் மூலத்தின் ‘அவருடைய வீட்டுக்கு’ என்ற பொருளை இயல்பாகத் தருகிறது; ‘அரண்மனை’ என்று மூலத்தில் இல்லாத குறிப்பைச் சேர்க்கவில்லை.
