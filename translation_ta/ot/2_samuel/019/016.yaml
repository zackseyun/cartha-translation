base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/016.yaml
  text: Then the king returned and came as far as the Jordan[a], and Judah came to Gilgal to go to meet the king, to bring the king across the Jordan.
translation:
  language: ta
  text: பின்பு அரசர் திரும்பி யோர்தான்வரை வந்தார். யூதா மக்கள்[a] கில்காலுக்கு வந்து, அரசரைச் சந்திக்கவும் அரசரை யோர்தானைக் கடந்து செல்லச் செய்யவும் வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘யூதா’ என்றே உள்ளது; அது யூதா கோத்திர மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பி
  rationale: שוב என்பதன் Qal தொடர் இறந்தகால வடிவம்; தாவீது தப்பிச் சென்ற இடத்திலிருந்து திரும்பியதை இயல்பாகக் குறிக்கிறது.
- source_word: וַיָּבֹא עַד הַיַּרְדֵּן
  choice: யோர்தான்வரை வந்தார்
  rationale: עַד என்பது ஆறு எனும் எல்லை அல்லது இடம்வரை வந்ததைச் சுட்டுகிறது; இந்நிலையில் அவர் ஏற்கெனவே கடந்துவிட்டார் என்று சொல்லவில்லை.
- source_word: וִיהוּדָה
  choice: யூதா மக்கள்[a]
  rationale: யூதா என்ற பெயர் இங்கு கோத்திர மக்களை ஒருமையாகத் தொகுத்துக் குறிக்கிறது. தமிழில் தவறான தனிநபர் வாசிப்பைத் தவிர்க்க ‘மக்கள்’ என்பது வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בָּא
  choice: வந்திருந்தார்கள்
  rationale: முன்னணிக் கதைச் செயல்களுக்கு பின்னணியாக யூதாவின் வருகையை qatal வடிவம் தருகிறது; தமிழ் நிறைவுநிலை இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַגִּלְגָּלָה
  choice: கில்காலுக்கு
  rationale: இடப்பெயருடன் வரும் திசைச்சுட்டு ה, கில்காலை நோக்கிய இயக்கத்தைத் தெரிவிக்கிறது.
- source_word: לָלֶכֶת לִקְרַאת
  choice: சந்திக்க
  rationale: இரு infinitive வடிவங்களும் நோக்கத்தைத் தெரிவிக்கின்றன; தமிழில் ‘சந்திக்க’ என்பதே இயல்பாக இரண்டின் ஒருங்கிணைந்த பொருளைத் தருகிறது.
- source_word: לְהַעֲבִיר אֶת הַמֶּלֶךְ אֶת הַיַּרְדֵּן
  choice: அவரை யோர்தானைக் கடக்கச் செய்யவும்
  rationale: עבר என்பதன் Hiphil வடிவத்தின் காரணவினைப் பொருளைப் பாதுகாக்கிறது; படகு அல்லது குறிப்பிட்ட போக்குவரத்து முறையைச் சேர்க்கவில்லை.
