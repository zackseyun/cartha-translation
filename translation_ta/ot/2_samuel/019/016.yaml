  register: நவீனத் தரத் தமிழில் மரியாதையும் எளிமையும் காக்கப்பட்டுள்ளன. அரசருக்கான ஒருமை மரியாதை வினைமுற்றுகளும், யூதா மக்களுக்கான பன்மை வினைமுற்றும் பயன்படுத்தப்பட்டுள்ளன.
