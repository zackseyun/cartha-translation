base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/036.yaml
  text: I am eighty years old today[a]. Can I still distinguish between good and evil? Can your servant taste what I eat and what I drink? Can I still hear the voice of male singers and female singers? Why then should your servant still be a burden to my lord the king?
translation:
  language: ta
  text: இன்று எனக்கு எண்பது வயது. நன்மைக்கும் தீமைக்கும் இடையே என்னால் இன்னும் வேறுபடுத்தி அறிய முடியுமா?[a] உமது அடியான் தான் உண்பதையும் குடிப்பதையும் சுவைத்து அறிய முடியுமா? பாடகர்களும் பாடகிகளும் பாடும் குரலை என்னால் இன்னும் கேட்க முடியுமா? அப்படியிருக்க, அரசராகிய என் ஆண்டவருக்கு உமது அடியான் ஏன் இன்னும் ஒரு சுமையாக இருக்க வேண்டும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நல்லதற்கும் கெட்டதற்கும் இடையே என்னால் பகுத்தறிய முடியுமா?” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் அறநெறி சார்ந்த அல்லது நடைமுறை சார்ந்த பகுத்தறிவைக் குறிக்கலாம்; இங்கு முதுமையும் புலன்களின் குறைவும் பற்றிய சூழல், தீர்மானிக்கும் திறன் பொதுவாகக் குறைந்திருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁמֹנִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: இன்று எனக்கு எண்பது வயது
  rationale: வயதைக் குறிக்கும் எபிரெய மொழிமரபை இயல்பான நவீனத் தமிழில் தருகிறது; הַיּוֹם என்பதையும் தெளிவாகத் தக்கவைக்கிறது.
- source_word: הַאֵדַע בֵּין טוֹב לְרָע
  choice: நன்மைக்கும் தீமைக்கும் இடையே என்னால் இன்னும் வேறுபடுத்தி அறிய முடியுமா?
  rationale: ידע בין என்பதன் பகுத்தறிந்து வேறுபடுத்தும் பொருளையும் טוֹב / רָע என்ற நிலையான எதிரிணையையும் காக்கிறது; முதுமையால் குறைந்த நடைமுறைத் தீர்மானத் திறனைக் குறிக்கக்கூடிய சூழலை அடிக்குறிப்பு விளக்குகிறது.
- source_word: אִם יִטְעַם עַבְדְּךָ
  choice: உமது அடியான் ... சுவைத்து அறிய முடியுமா?
  rationale: אִם இங்கு தொடர்ச்சியான வினாவை அறிமுகப்படுத்துகிறது. טעם என்பது வெறுமனே உணவைத் தொடுவது அல்ல, அதன் சுவையை உணர்வது என்பதால் ‘சுவைத்து அறிய’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֶת אֲשֶׁר אֹכַל וְאֶת אֲשֶׁר אֶשְׁתֶּה
  choice: தான் உண்பதையும் குடிப்பதையும்
  rationale: இரு இணையான சார்பு அமைப்புகளையும் சுருக்கமின்றி இயல்பான தமிழில் தருகிறது; ‘தான்’ என்பது அரசனை அல்ல, பேச்சாளரான அடியானையே சுட்டுவதைத் தெளிவாக்குகிறது.
- source_word: אֶשְׁמַע עוֹד בְּקוֹל שָׁרִים וְשָׁרוֹת
  choice: பாடகர்களும் பாடகிகளும் பாடும் குரலை என்னால் இன்னும் கேட்க முடியுமா?
  rationale: ஆண்பால், பெண்பால் பாடகர்கள் என மூலத்தில் உள்ள வேறுபாட்டைக் காக்கிறது. קוֹל என்பதைக் ‘குரல்’ என்றும், தமிழில் தெளிவுக்காக அவர்களின் செயலை ‘பாடும்’ என்றும் வெளிப்படுத்துகிறது.
- source_word: לְמַשָּׂא
  choice: ஒரு சுமையாக
  rationale: இங்கு நேரடியான உடல் சுமை அல்ல; அரசருக்குத் தொந்தரவு அல்லது பொறுப்பாக இருப்பதைக் குறிக்கும் உருவகப் பொருளைத் தக்கவைக்கிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: அரசராகிய என் ஆண்டவர்
  rationale: மனித அரசருக்குரிய மரியாதையான அவை அழைப்பை இயல்பான தமிழில் தருகிறது; இது தெய்வீகப் பட்டமாகப் புரியாதபடி சூழல் தெளிவாக உள்ளது.
theological_decisions:
- issue: טוֹב לְרָע என்பதன் பொருள் வரம்பு
  choice: நன்மைக்கும் தீமைக்கும் இடையே
  alternative: நல்லதற்கும் கெட்டதற்கும் இடையே
  rationale: மூலத்தின் வழக்கமான எதிரிணையை நெருக்கமாகக் காக்கிறது; அதேவேளை இச்சூழலில் இது அறநெறித் தீர்ப்பை மட்டும் அல்லாமல் நடைமுறைப் பகுத்தறிவையும் குறிக்கலாம் என்பதை அடிக்குறிப்பில் திறந்துவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக்குரிய மரியாதையையும் முதியவரின் தாழ்மையான வினாக்களின் தொடரையும் காக்கும் கண்ணியமான நடை. ‘உமது அடியான்’ மற்றும் ‘என் ஆண்டவர்’ ஆகியவை மனித அரசனை நோக்கிய மரியாதைச் சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன.
