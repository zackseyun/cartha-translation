  text: לְ/אַֽהֲבָה֙ אֶת שֹׂ֣נְאֶ֔י/ךָ וְ/לִ/שְׂנֹ֖א אֶת אֹהֲבֶ֑י/ךָ כִּ֣י הִגַּ֣דְתָּ הַ/יּ֗וֹם כִּ֣י אֵ֤ין לְ/ךָ֙ שָׂרִ֣ים וַ/עֲבָדִ֔ים כִּ֣י יָדַ֣עְתִּי הַ/יּ֗וֹם כִּ֠י לא אַבְשָׁל֥וֹם חַי֙ וְ/כֻלָּ֤/נוּ הַ/יּוֹם֙ מֵתִ֔ים כִּי אָ֖ז יָשָׁ֥ר בְּ/עֵינֶֽי/ךָ־־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/007.yaml
  text: to love those who hate you and to hate those who love you[a]. For you have made it clear today that commanders and servants mean nothing to you; for I know today that if Absalom were alive and all of us were dead today[b], then it would be right in your eyes.
translation:
  language: ta
  text: உம்மைப் பகைக்கிறவர்களை நேசிப்பதும், உம்மை நேசிக்கிறவர்களைப் பகைப்பதுமாக நடந்துகொள்கிறீர். படைத்தலைவர்களும் ஊழியர்களும் உமக்குப் பொருட்டல்ல என்பதை இன்று தெளிவுபடுத்திவிட்டீர்[a]. அப்சலோம் உயிரோடிருந்து, இன்று நாங்கள் எல்லாரும் இறந்திருந்தால், அதுவே உமது பார்வையில் சரியானதாக இருந்திருக்கும் என்பதை இன்று அறிந்துகொண்டேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “உமக்குப் படைத்தலைவர்களும் ஊழியர்களும் இல்லை என்று இன்று அறிவித்தீர்.” அவர்கள் தாவீதின் மதிப்பில் ஒன்றுமே இல்லை என்பதே இங்குள்ள எபிரெய மொழிவழக்கின் பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அப்சலோம் மட்டும் உயிரோடிருந்து, இன்று நாங்கள் எல்லாரும் இறந்திருந்தால்.” இது தாவீது கூறியதை நேரடியாக மேற்கோள் காட்டுவது அல்ல; யோவாபின் கூர்மையான எதிர்நிகழ்வு குற்றச்சாட்டு.
    reason: alternative_reading
lexical_decisions:
- source_word: לְאַהֲבָה אֶת שֹׂנְאֶיךָ
  choice: உம்மைப் பகைக்கிறவர்களை நேசிப்பதும்
  rationale: எபிரெய இணைப்பின் வினைச்செயலையும், ‘பகைக்கிறவர்கள்’ என்ற செயற்பாட்டு அர்த்தத்தையும் காக்கிறது; தமிழில் முந்தைய வசனத்திலிருந்து தொடரும் குற்றச்சாட்டாக இயல்பாக அமைகிறது.
- source_word: וְלִשְׂנֹא אֶת אֹהֲבֶיךָ
  choice: உம்மை நேசிக்கிறவர்களைப் பகைப்பதுமாக நடந்துகொள்கிறீர்
  rationale: முந்தைய பகுதியுடனான சொற்பொருள் முரணையும் இணை அமைப்பையும் காத்து, தனியே முழுமையற்ற தொடக்கத்தை தமிழில் வாசிக்கத்தக்க குற்றச்சாட்டாக வழங்குகிறது.
- source_word: הִגַּדְתָּ
  choice: தெளிவுபடுத்திவிட்டீர்
  rationale: தாவீது வாயால் கூறினார் என்பதல்லாமல், அவரது நடத்தையால் வெளிப்படையாகக் காட்டினார் என்ற சூழ்நிலைப் பொருளைத் தருகிறது.
- source_word: שָׂרִים
  choice: படைத்தலைவர்கள்
  rationale: இங்குள்ள இராணுவச் சூழலில் பொதுவான ‘தலைவர்கள்’ என்பதைக் காட்டிலும் படைத்துறைப் பொறுப்பாளர்களைக் குறிக்கும் மொழிபெயர்ப்பு பொருத்தமானது.
- source_word: עֲבָדִים
  choice: ஊழியர்கள்
  rationale: அரசனுக்குச் சேவை செய்கிறவர்களை விரிவாகக் குறிக்கிறது; அடிமைத்தனத்தைத் தேவையின்றி முன்னிறுத்தாமல் அரசவைக் சூழலுக்கு ஏற்றதாக உள்ளது.
- source_word: אֵין לְךָ שָׂרִים וַעֲבָדִים
  choice: படைத்தலைவர்களும் ஊழியர்களும் உமக்கு ஒன்றுமே இல்லை
  rationale: சொல்லாட்சியின் ‘உமக்குப் படைத்தலைவர்களும் ஊழியர்களும் இல்லை’ என்ற வடிவத்தை நெருக்கமாக வைத்தபடியே, அவர்கள் தாவீதின் மதிப்பீட்டில் பொருட்டல்ல என்ற இடியோமிய குற்றச்சாட்டை தமிழில் தெரிவிக்கிறது.
- source_word: יָדַעְתִּי הַיּוֹם
  choice: இன்று அறிந்துகொண்டேன்
  rationale: இன்றைய நடத்தையிலிருந்து யோவாப் வந்தடைந்த முடிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא אַבְשָׁלוֹם חַי וְכֻלָּנוּ הַיּוֹם מֵתִים
  choice: அப்சலோம் உயிரோடிருந்து, இன்று நாங்கள் எல்லாரும் இறந்திருந்தால்
  rationale: சூழலில் உள்ள கூர்மையான எதிர்நிகழ்வு குற்றச்சாட்டை நிபந்தனை வடிவில் தெளிவாகத் தருகிறது; לֹא வடிவின் கடினத்தன்மையை அடிக்குறிப்பில் சுட்டுகிறது.
- source_word: יָשָׁר בְּעֵינֶיךָ
  choice: அதுவே உமது பார்வையில் சரியானதாக இருந்திருக்கும்
  rationale: ‘கண்களில் நேரானது’ என்ற எபிரெய மொழிவழக்கின் நெறிசார் வண்ணத்தை ‘பார்வையில் சரியானது’ என்று காக்கிறது.
