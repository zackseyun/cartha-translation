  register: நவீன தரநிலைத் தமிழில், அரசனை நோக்கிப் பேசும் மரியாதைப் பன்மை ஒருமை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. யோவாபின் கடுமையான கண்டனம் மங்காமல், வசனத்தின் தொடக்கம் முந்தைய வசனத்தோடு இலக்கண ரீதியாகத் தொடர்வதையும் கருத்தில் கொண்டு இயல்பாக்கப்பட்டுள்ளது.
