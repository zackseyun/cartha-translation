review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Joab's paired accusation, the idiomatic force of “there are no commanders and servants for you,” and the sharp counterfactual concerning Absalom. The counterfactual and the conclusion “right in your eyes” are appropriately retained.
  naturalness: Most of the Tamil is modern and clear. However, “படைத்தலைவர்களும் ஊழியர்களும் உமக்கு ஒன்றுமே இல்லை” can be heard as literal nonexistence rather than as the intended rebuke that they do not matter to David. “உமக்குப் பொருட்டல்ல” expresses the idiom naturally and directly.
  terminology: “படைத்தலைவர்கள்,” “ஊழியர்கள்,” “அப்சலோம்,” and the respectful second-person forms are appropriate. “உமது பார்வையில் சரியானதாக” suitably preserves the evaluative Hebrew idiom without imposing interpretation.
  issues:
  - severity: low
    issue: The main rendering of אֵין לְךָ שָׂרִים וַעֲבָדִים is potentially ambiguous in Tamil.
    rationale: “உமக்கு ஒன்றுமே இல்லை” may be understood as saying that David has no commanders or servants at all. In context, the Hebrew idiom means that they count for nothing in his estimation; “உமக்குப் பொருட்டல்ல” makes this force clear.
