base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/042.yaml
  text: And behold[a], all the men of Israel came to the king and said to the king, “Why have our brothers, the men of Judah, stolen you away and brought the king and his household across the Jordan[b], and all David’s men with him?”
translation:
  language: ta
  text: இதோ, இஸ்ரவேலின் ஆண்கள் அனைவரும்[b] அரசனிடம் வந்து, அவரிடம், “எங்கள் சகோதரர்களான யூதாவின் ஆண்கள் உம்மை ஏன் திருடிக்கொண்டு போய்[a], அரசனையும் அவரது வீட்டாரையும், அவரோடு தாவீதின் ஆண்கள் அனைவரையும், யோர்தானைக் கடக்கச் செய்தார்கள்?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உம்மை இரகசியமாக அழைத்துச் சென்று.” எபிரெயில் ‘திருடுதல்’ என்பதற்கான வழக்கமான வினை உருவகமாகப் பயன்படுத்தப்பட்டுள்ளது; மற்ற இஸ்ரவேலரின் பங்கேற்பின்றி யூதா செயல்பட்டதையே இது குற்றஞ்சாட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் இங்குள்ள “இஸ்ரவேலின் ஆண்கள் அனைவரும்” என்பதும், பின்னர் வரும் “யூதாவின் ஆண்கள்” என்பதும் அந்தக் குழுக்களை ஆண்பால் கூட்டுமொழியில் குறிப்பிடுகின்றன.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து நிகழ்வை உயிரோட்டமாக அறிமுகப்படுத்தும் எபிரெய உரையாடல் குறியை இயல்பான, கண்ணியமான தமிழில் தக்கவைக்கிறது.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஆண்கள் அனைவரும்
  rationale: אִישׁ ஒருமை வடிவில் இருந்தாலும் இங்கு ஆண் சார்ந்த கூட்டுப்பொருளில் வருகிறது; அதை பொதுவான ‘இஸ்ரவேலர் அனைவரும்’ என்று சமப்படுத்தாமல் மூலத்தின் வடிவை வெளிப்படுத்துகிறது.
- source_word: בָּאִים
  choice: வந்து
  rationale: நிகழ்காலப் பங்கேற்புவினை கதைத் தொடரில் வந்த செயலைக் குறிக்கிறது; தமிழில் அடுத்த வினையுடன் இணைக்கும் ‘வந்து’ இயல்பாக அமைகிறது.
- source_word: גְּנָבוּךָ
  choice: உம்மை ... திருடிக்கொண்டு போய்
  rationale: גנב என்பதன் அடிப்படை ‘திருடுதல்’ என்ற உருவகத்தையும், மற்ற இஸ்ரவேலரின் பங்கேற்பின்றி அரசரைத் தமதாக்கிக்கொண்டதாக யூதாவின்மீது சுமத்தப்படும் குற்றச்சாட்டையும் தக்கவைக்கிறது.
- source_word: אַחֵינוּ אִישׁ יְהוּדָה
  choice: எங்கள் சகோதரர்களான யூதாவின் ஆண்கள்
  rationale: ஒரே இனத்துக்குள் எழுந்த மோதலை வலியுறுத்தும் ‘சகோதரர்கள்’ என்ற உறவுமொழியையும், கூட்டுப்பொருளுடைய ஆண் மொழியையும் பாதுகாக்கிறது.
- source_word: וַיַּעֲבִרוּ
  choice: கடக்கச் செய்தார்கள்
  rationale: עבר என்பதன் ஹிஃபில் causative பொருளான ‘கடக்கச் செய்தல்/கடத்துதல்’ என்பதை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: בֵּיתוֹ
  choice: அவரது வீட்டார்
  rationale: இங்கு கட்டிடத்தை அல்ல, அரசரின் குடும்பத்தாரையும் குடும்பக்குழுவையும் குறிக்கும் சூழல்சார் பொருளைத் தருகிறது.
- source_word: הַיַּרְדֵּן
  choice: யோர்தான்
  rationale: ஆற்றின் வழக்கமான வேதாகமத் தமிழ்ப் பெயரைப் பயன்படுத்துகிறது; மூலத்தில் தனியாக உள்ள இடப்பெயரைத் தேவையின்றி விரிவாக்கவில்லை.
- source_word: וְכָל אַנְשֵׁי דָוִד עִמּוֹ
  choice: தாவீதின் ஆண்கள் அனைவரும் அவரோடு இருந்தார்களே
  rationale: தாவீதின் பரிவாரம் அரசரோடு இருந்தது என்ற இறுதி வலியுறுத்தலைத் தக்கவைக்கிறது; தமிழில் துண்டுபோல் ஒலிக்காமல் குற்றச்சாட்டின் வலியுறுத்தலாக இயல்பாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: அரசரை நேரடியாக ‘உம்மை’ என்று அழைத்தபின் மூன்றாம் நபரில் ‘அரசனை’ என்று கூறும் மாற்றம்
  choice: ‘உம்மை’ மற்றும் ‘அரசனையும்’ ஆகிய இரண்டையும் தக்கவைத்தல்
  alternative: இரண்டையும் ‘உம்மை’ என்று ஒரே நபர் நிலையில் ஒழுங்குபடுத்துதல்
  rationale: எபிரெய உரையின் திடீர் நபர்நிலை மாற்றம் உண்மையான சொல்லாட்சிசார் அம்சம்; அதை அமைதியாகச் சீராக்காமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசருக்கான ‘உம்மை’ மரியாதை வடிவம் தக்கவைக்கப்பட்டுள்ளது. ‘இதோ’ மற்றும் ‘திருடிக்கொண்டு போய்’ ஆகியவை முறையே மூலத்தின் கதை உயிரோட்டத்தையும் குற்றஞ்சாட்டும் உருவகத்தையும் பாதுகாக்கின்றன.
