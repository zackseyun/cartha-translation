  text: וַ/יַּעַן֩ כָּל אִ֨ישׁ יְהוּדָ֜ה עַל אִ֣ישׁ יִשְׂרָאֵ֗ל כִּֽי קָר֤וֹב הַ/מֶּ֨לֶךְ֙ אֵלַ֔/י וְ/לָ֤/מָּה זֶּה֙ חָרָ֣ה לְ/ךָ֔ עַל הַ/דָּבָ֖ר הַ/זֶּ֑ה הֶ/אָכ֤וֹל אָכַ֨לְנוּ֙ מִן הַ/מֶּ֔לֶךְ אִם נִשֵּׂ֥את נִשָּׂ֖א לָֽ/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/043.yaml
  text: Then every man of Judah answered the man of Israel[a], “Because the king is a close relative to me[b]. So why has this matter made you angry? Have we eaten at all at the king’s expense? Or has he given us any gift?”
translation:
  language: ta
  text: 'அப்போது யூதாவின் எல்லா ஆண்களும் இஸ்ரவேலின் ஆண்களுக்குப் பதிலளித்தார்கள்: “அரசர் எங்களுக்கு நெருங்கிய உறவினர்[a]. இந்தக் காரியத்திற்காக நீங்கள் ஏன் கோபப்படுகிறீர்கள்? அரசரின் செலவில் நாங்கள் உணவு உண்டது உண்டோ? அல்லது அவர் எங்களுக்கு ஏதாவது கொடுத்தாரோ?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் எழுத்துப்படி, “அரசர் எனக்கு நெருக்கமானவர்.” இங்கு உறவு அல்லது குல நெருக்கம் குறிக்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எங்களுக்கு ஏதாவது எடுத்துவரப்பட்டதோ?” இறுதிக் கூறின் எபிரெய வாசகம் பொருள் காண்பதற்குக் கடினமானது; அரசரிடமிருந்து ஏதாவது நன்மை பெற்றார்களா என்பதே சூழல்சார் பொருள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: அப்போது ... பதிலளித்தார்கள்
  rationale: தொடர்ந்து நிகழும் கதைச் செயலைக் குறிக்கும் wayyiqtol வடிவத்தையும், முந்தைய பேச்சுக்கான மறுமொழியையும் இயல்பான தமிழ் நடையில் வெளிப்படுத்துகிறது.
- source_word: כָּל אִישׁ יְהוּדָה
  choice: யூதாவின் மனிதர்கள் அனைவரும்
  rationale: எபிரெயத்தில் ஒருமை வடிவம் கூட்டுப் பொருளில் வருகிறது; தமிழில் இயல்பாகவும் குழுவின் ஒட்டுமொத்த பதிலைத் தெளிவாகவும் காட்ட பன்மை பயன்படுத்தப்பட்டது.
- source_word: עַל אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மனிதர்களுக்குப்
  rationale: ‘இஸ்ரவேலின் மனிதன்’ என்பது இங்கு கூட்டுப் பிரதிநிதித்துவ ஒருமை. தமிழில் விவாதத்தில் எதிர்தரப்பாக உள்ள குழுவை இயல்பாகக் குறிக்கப் பன்மை பயன்படுத்தப்பட்டது.
- source_word: כִּי קָרוֹב הַמֶּלֶךְ אֵלַי
  choice: அரசர் எங்களுக்கு நெருங்கிய உறவினர்
  rationale: קָרוֹב இச்சூழலில் வெறும் இடநெருக்கத்தை அல்ல, தாவீதுக்கும் யூதாவுக்கும் உள்ள குல/உறவு நெருக்கத்தைக் குறிக்கிறது. கூட்டுப் பேச்சுக்கு ஏற்ப ‘எங்களுக்கு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְלָמָּה זֶּה חָרָה לְךָ עַל הַדָּבָר הַזֶּה
  choice: இந்தக் காரியத்திற்காக நீங்கள் ஏன் கோபப்படுகிறீர்கள்?
  rationale: חָרָה என்ற ‘எரிதல்’ மரபுத்தொடர் கோபத்தைச் சுட்டுகிறது; דָּבָר இங்கு விவாதப் பொருளான காரியத்தைக் குறிக்கிறது.
- source_word: הֶאָכוֹל אָכַלְנוּ מִן הַמֶּלֶךְ
  choice: அரசரிடமிருந்து நாங்கள் உணவு உண்டோ?
  rationale: இன்பினிட்டிவ் அப்சலூட் மற்றும் வினைச்சொல் இணைப்பு வலியுறுத்தும் மறுப்புக் கேள்வியாக உள்ளது. ‘அரசரிடமிருந்து’ என்ற மூல உருவகத்தைப் பாதுகாத்து, உணவுப் பயன் பெற்றார்களா என்ற பொருளைத் தெளிவாக்குகிறது.
- source_word: אִם נִשֵּׂאת נִשָּׂא לָנוּ
  choice: அல்லது எங்களுக்காக ஏதாவது எடுத்துக் கொடுக்கப்பட்டதோ?
  rationale: இறுதிக் கூறின் எபிரெயம் கடினமானதும் தெளிவற்றதும் ஆகும். נשׂא என்பதன் ‘எடுத்தல்/சுமத்தல்’ சார்ந்த வடிவத்தையும் செயப்பாட்டு நுணுக்கத்தையும் காத்து, குறிப்பிடப்படாத பொருளை ‘ஏதாவது’ எனத் திறந்தவாறு வைத்துள்ளது.
theological_decisions:
- issue: யூதாவுக்கும் தாவீதுக்கும் உள்ள நெருக்கத்தின் தன்மை
  choice: நெருங்கிய உறவினர்
  alternative: எங்களுக்கு நெருக்கமானவர்
  rationale: சூழல் குல/உறவுச் சார்ந்த நெருக்கத்தைக் காட்டினாலும், அதிலிருந்து மேலதிக இறையியல் முடிவுகள் எதுவும் சேர்க்கப்படவில்லை.
- issue: இறுதிக் கேள்வியில் கிடைத்திருக்கக்கூடிய நன்மையின் தன்மை
  choice: ஏதாவது எடுத்துக் கொடுக்கப்பட்டதோ
  alternative: ஏதாவது பரிசு கொடுக்கப்பட்டதோ
  rationale: மூலத்தில் ‘பரிசு’ எனப் பெயர்ச்சொல் வெளிப்படையாக இல்லை. ஆகவே குறிப்பிட்ட நன்மை அல்லது பரிசாக அதைத் தீர்மானிக்காமல் மூலத்தின் தெளிவின்மை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன செந்தமிழுக்கு அண்மையான, பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க உரைநடை பயன்படுத்தப்பட்டது. குழுக்களுக்கிடையிலான உரையாடல் என்பதால் எபிரெயக் கூட்டுப் பிரதிநிதித்துவ ஒருமைகள் தமிழில் இயல்பான பன்மையாக வழங்கப்பட்டன; மூலத்தின் கடினமான இறுதிக் கூறு அடிக்குறிப்புடன் திறந்தவாறு வைக்கப்பட்டது.
