- from: 'அப்போது யூதாவின் மனிதர்கள் அனைவரும் இஸ்ரவேலின் மனிதர்களுக்குப் பதிலளித்தார்கள்: “அரசர் எங்களுக்கு நெருங்கிய உறவினர்[a]. இந்தக் காரியத்திற்காக நீங்கள் ஏன் கோபப்படுகிறீர்கள்? அரசரிடமிருந்து நாங்கள் உணவு உண்டோ? அல்லது எங்களுக்காக ஏதாவது எடுத்துக் கொடுக்கப்பட்டதோ?[b]”'
  to: 'அப்போது யூதாவின் எல்லா ஆண்களும் இஸ்ரவேலின் ஆண்களுக்குப் பதிலளித்தார்கள்: “அரசர் எங்களுக்கு நெருங்கிய உறவினர்[a]. இந்தக் காரியத்திற்காக நீங்கள் ஏன் கோபப்படுகிறீர்கள்? அரசரின் செலவில் நாங்கள் உணவு உண்டது உண்டோ? அல்லது அவர் எங்களுக்கு ஏதாவது கொடுத்தாரோ?[b]”'
  rationale: திருத்தம் லָנוּ என்பதன் ‘எங்களுக்கு’ என்ற பொருளை மீட்டெடுக்கிறது; இறுதிக் கூறின் விவாதத்திற்குரிய சொற்தொடரை அடிக்குறிப்பில் வெளிப்படையாகக் காக்கிறது. முதல் மறுப்புக் கேள்வியில் உள்ள வலியுறுத்தலை ‘உண்டது உண்டோ?’ எனவும், அரசரின் செலவில் பயன் பெற்றார்களா என்ற சூழலை ‘அரசரின் செலவில்’ எனவும் வழங்குகிறது. வேறு எந்த இறையியல் விளக்கமும் சேர்க்கப்படவில்லை.
