translation:
  language: ta
  text: அன்று மக்கள் நகரத்துக்குள் ஒளிந்துகொண்டு நுழைந்தார்கள்; போரில் தப்பியோடும்போது வெட்கமடைந்தவர்கள் ஒளிந்துகொண்டு செல்வதுபோல.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְגַּנֵּב / יִתְגַּנֵּב
  choice: திருட்டுத்தனமாக நுழைந்தார்கள் / நழுவிச் செல்வதுபோல்
  rationale: התננב என்பதன் அடிப்படைப் படிமம் திருடனைப்போல் மறைவாக அல்லது கவனத்தை ஈர்க்காமல் நகர்வதாகும். முதல் இடத்தில் நகருக்குள் வந்த செயலைத் தெளிவாகக் காட்டவும், ஒப்புமையில் அவமானத்துடன் மறைந்து செல்லும் உணர்வைக் காக்கவும் இயல்பான இரு சூழல்சார் வடிவங்கள் பயன்படுத்தப்பட்டன.
- source_word: הַנִּכְלָמִים
  choice: வெட்கமடைந்த மக்கள்
  rationale: இந்தச் சொல் அவமானம் அல்லது வெட்கம் அடைந்த நிலையைக் குறிக்கிறது; போரிலிருந்து ஓடியதால் ஏற்பட்ட இழிவுணர்வை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּנוּסָם בַּמִּלְחָמָה
  choice: போரில் தோற்று ஓடும்போது
  rationale: נוּס என்பது தப்பி ஓடுதலைக் குறிக்கிறது. சூழலில் போர்க்களத் தோல்வி உட்பொருளாக இருப்பதால் ‘தோற்று’ சேர்க்கப்பட்டது; இது அவர்களின் வெட்கத்திற்கான காரணத்தையும் தமிழில் தெளிவாக்குகிறது.
