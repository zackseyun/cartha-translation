base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/022.yaml
  text: But Abishai son of Zeruiah answered and said[a], “Should Shimei not be put to death for this, because he cursed Yahweh’s anointed?”
translation:
  language: ta
  text: 'ஆனால் செருயாவின் மகன் அபிசாய் பதிலளித்துச் சொன்னான்: “இதற்காக[a] சிமேயி கொல்லப்பட வேண்டாமா? ஏனெனில் அவன் யாவேயின் அபிஷேகம் பெற்றவரைச் சபித்தான்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இதன் காரணமாக” அல்லது “இதற்குப் பதிலாக” என்றும் மொழிபெயர்க்கலாம். இந்தச் செயலின் காரணமாக சிமேயி மரண தண்டனைக்கு உட்படுத்தப்பட வேண்டுமா என்று எபிரெய சொற்றொடர் கேட்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: மறுமொழியாக ... என்றான்
  rationale: எபிரெய உரையில் உள்ள இரு பேச்சு வினைகளின் பதிலளிக்கும் தன்மையையும் இயல்பான நவீனத் தமிழில் சுருக்கமாகக் காக்கிறது.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: செருயாவின் மகன் அபிசாய்
  rationale: பெயர்களைத் தமிழில் ஒலிபெயர்த்து, உறவுமுறை அடையாளத்தை எபிரெய வரிசைக்கு இயல்பான தமிழில் வழங்குகிறது.
- source_word: הֲתַחַת זֹאת
  choice: இதற்காக ... வேண்டாமா?
  rationale: இந்தச் செயலுக்குப் பதிலாக அல்லது இதன் காரணமாகத் தண்டனை வரவேண்டுமா என்று கேட்கும் எபிரெய சொற்றொடரின் காரண/பயன் நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: לֹא יוּמַת
  choice: கொல்லப்பட வேண்டாமா
  rationale: מות என்பதன் ஹொஃபால் வடிவிலுள்ள பிறவினைச் செயப்பாட்டு நுட்பத்தையும் மரண தண்டனைக்கான கோரிக்கையையும் வெளிப்படுத்துகிறது.
- source_word: שִׁמְעִי
  choice: சிமேயி
  rationale: தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: כִּי קִלֵּל
  choice: ஏனெனில் ... சபித்தானே
  rationale: כִּי என்பதன் காரணப் பொருளையும், קלל என்பதன் கடுமையான வாய்மொழிச் சாபப் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: מְשִׁיחַ יְהוָה
  choice: யாவே அபிஷேகம் செய்தவர்
  rationale: இந்தக் கட்டமைப்பு யாவேயால் அபிஷேகம் செய்யப்பட்ட அரசரைக் குறிக்கிறது; தமிழில் செய்பவரைத் தெளிவாகக் காட்டி, பதவியின் இறையியல் முக்கியத்துவத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையிலுள்ள உடன்படிக்கைப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: מְשִׁיחַ יְהוָה என்பதன் பொருள்
  choice: யாவே அபிஷேகம் செய்தவர்
  alternative: யாவேயின் அபிஷேகம் பெற்றவர்
  rationale: இங்கு குறிக்கப்படுவது அரசராக அபிஷேகம் செய்யப்பட்ட தாவீது; பின்னாளைய தனிப்பட்ட மேசியா அடையாளத்தை இந்த வசனத்தில் தேவையின்றி இறக்குமதி செய்யாமல், எபிரெய சொற்றொடரின் செய்பவர்-பெறுபவர் உறவைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமான கதைநடை. கேள்வியின் வலியுறுத்தலை “வேண்டாமா?” மற்றும் “சபித்தானே” இயல்பாக வெளிப்படுத்துகின்றன. அடிக்குறிப்புக் குறி தொடர்புடைய “இதற்காக” என்பதற்குப் பின் வைக்கப்படலாம் என்றாலும், வாசிப்பின் ஓட்டத்தைக் காக்க வசன முடிவில் இடப்பட்டுள்ளது.
