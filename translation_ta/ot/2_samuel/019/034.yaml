translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. பர்சிலாயின் வயதும் உரையாடலின் மரியாதைநிலையும் கருதி ‘நீர்/உம்மை’ வடிவங்கள் தேர்ந்தெடுக்கப்பட்டன. ‘கடந்து’ என்பதில் எதைக் கடக்க வேண்டும் என்பதை மூல எபிரெயம் வெளிப்படையாகச் சொல்லாததால் ‘ஆற்றை’ என்று சேர்க்கப்படவில்லை.
