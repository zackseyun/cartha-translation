reference: 2 Samuel 19:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ אֶל בַּרְזִלָּ֑י אַתָּה֙ עֲבֹ֣ר אִתִּ֔/י וְ/כִלְכַּלְתִּ֥י אֹתְ/ךָ֛ עִמָּדִ֖/י בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/034.yaml
  text: And the king said to Barzillai[a], “You cross over with me, and I will provide for you with me in Jerusalem.”
translation:
  language: ta
  text: அரசன் பர்சில்லாயிடம், “நீர் என்னோடு கடந்து செல்லுங்கள்; எருசலேமில் என்னுடன் உம்மைப் பராமரிப்பேன்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உம்மைப் பேணுவேன்” அல்லது “உமக்குத் தேவையானவற்றை அளிப்பேன்.” எபிரெய வினைச்சொல் ஒருவருடைய தேவைகளை நிறைவேற்றி அவரை ஆதரிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: எபிரெயக் கதையோட்டத்தில் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் வழக்கமான வடிவம்; இயல்பான தமிழ் உரையாடல் அமைப்புக்கேற்ப வாக்கியத்தின் இறுதியில் மொழிபெயர்க்கப்பட்டது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: குறிப்பிட்ட அரசனைச் சுட்டும் பெயர்ச்சொல்; சூழலில் இது தாவீதைக் குறிக்கிறது, ஆனால் மூலத்தில் உள்ளபடி பட்டப்பெயரே வைக்கப்பட்டது.
- source_word: אֶל בַּרְזִלָּי
  choice: பர்சிலாவிடம்
  rationale: பேச்சு யாரை நோக்கிக் கூறப்பட்டது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது; பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: אַתָּה עֲבֹר
  choice: நீர் ... கடந்து வாரும்
  rationale: தனிப்பட்ட முன்னிலைப்பெயர் தரும் நேரடி அழைப்பை ‘நீர்’ தக்கவைக்கிறது. முதியவரான பர்சிலாவிடம் அரசன் பேசுவதால் மரியாதைப் பன்மை இயல்பான தமிழ் நடை; עבר என்பதன் கடத்தல் சார்ந்த பொருள் ‘கடந்து’ என்பதில் பாதுகாக்கப்படுகிறது.
- source_word: אִתִּי
  choice: என்னோடு
  rationale: உடன்செல்லுதலைக் குறிக்கும் எளிய உடனிகழ்ச்சித் தொடர்.
- source_word: וְכִלְכַּלְתִּי אֹתְךָ
  choice: உம்மைப் பராமரிப்பேன்
  rationale: כלכל இங்கு ஒருவரின் தேவைகளை அளித்து அவரைப் பேணும் பொருளுடையது. ‘பராமரிப்பேன்’ என்பது அந்தத் தொடர்ச்சியான ஆதரவைக் கண்ணியமான, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עִמָּדִי
  choice: என்னுடன்
  rationale: அரசனுடைய உடனிருப்பையும் அரண்மனைச் சூழலில் கிடைக்கும் ஆதரவையும் மேலதிகமாக விளக்காமல் மூலத்தின் உடனிகழ்ச்சிப் பொருளைத் தக்கவைக்கிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: ב முன்னொட்டின் இடப்பொருளை ‘-இல்’ வேற்றுமை உருபு இயல்பாக வெளிப்படுத்துகிறது; இடப்பெயர் வழக்கமான தமிழில் ஒலிபெயர்க்கப்பட்டது.
