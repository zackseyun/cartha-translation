base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/021.yaml
  text: For your servant knows that I have sinned[a]. And look, I have come today as the first of all the house of Joseph[b] to come down to meet my lord the king.
translation:
  language: ta
  text: ஏனெனில், உமது அடியவனாகிய நான் பாவம் செய்தேன் என்பதை அறிந்திருக்கிறேன். இதோ, என் ஆண்டவனாகிய அரசரைச் சந்திக்க இறங்கி வர, யோசேப்பின் வீடு முழுவதிலும்[a][b] முதலாவனாக இன்று வந்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யோசேப்பின் வீடு’ என்பது யோசேப்புடன் தொடர்புடைய கோத்திரங்களைக் குறிக்கிறது; குறிப்பாக எப்பிராயீம், மனாசே ஆகியவற்றோடு இணைந்த வடக்கத்திய கோத்திரக் குழுக்களைச் சுட்டுகிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘யோசேப்பின் வீடு முழுவதிலிருந்தும்.’ யோசேப்பின் முழுக் கோத்திரக் குழுவிலிருந்தும் அரசரைச் சந்திக்க இறங்கி வந்த முதல் நபர் அவனே என்ற பொருளிலும் எபிரெயத் தொடரைப் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சிமெயியின் வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்துவதால், காரணப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: יָדַע עַבְדְּךָ
  choice: உமது அடியவனாகிய நான் ... அறிந்திருக்கிறேன்
  rationale: அரசரிடம் தன்னைத் தாழ்த்திக் குறிப்பிடும் மூன்றாம் நபர் அரசவை வழக்கை, இயல்பான தமிழில் அதன் மரியாதைத் தொனி குன்றாமல் வழங்குகிறது.
- source_word: חָטָאתִי
  choice: நான் பாவம் செய்தேன்
  rationale: חטא என்பதன் ஒழுக்க மற்றும் இறையியல் கனத்தைப் பாதுகாக்கிறது; வெறும் ‘தவறு செய்தேன்’ என்று மெலிதாக்கவில்லை.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கவனத்தைத் திருப்பும் எபிரெயச் சொல்லின் சுட்டும் வலிமையைச் சுருக்கமாகவும் நவீன தமிழுக்கு இயல்பாகவும் தருகிறது.
- source_word: בָאתִי הַיּוֹם רִאשׁוֹן
  choice: முதலாவதாக இன்று வந்திருக்கிறேன்
  rationale: அவன் இப்போது அரசர்முன் வந்திருப்பதைக் காட்டும் நிறைவுற்ற செயலையும், רִאשׁוֹן என்பதன் முன்னுரிமைப் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: לְכָל בֵּית יוֹסֵף
  choice: யோசேப்பின் வீடு முழுவதிலும்
  rationale: கூட்டுக் குலப்பெயரான ‘யோசேப்பின் வீடு’ என்பதை அப்படியே பாதுகாக்கிறது; לְ־ குறித்த மாற்று புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לָרֶדֶת לִקְרַאת
  choice: சந்திக்க இறங்கி வருவதற்கு
  rationale: இறங்கிச் செல்லும் நிலவியல் இயக்கத்தையும், அரசரை நோக்கி வந்து சந்திக்கும் சூழலையும் ஒருங்கே பாதுகாக்கிறது.
