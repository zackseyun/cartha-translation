translation_notes:
  register: நவீன செந்தமிழுக்கு இயல்பான, ஆனால் அரசரிடம் பேசும் மரியாதைத் தொனியைத் தக்கவைக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ கவன ஈர்ப்பைத் தக்கவைக்கிறது; ‘யோசேப்பின் வீடு’ என்ற வரலாற்றுக் கூட்டுப்பெயர் விளக்கமாக மாற்றப்படாமல் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
