  text: וְ/לַֽ/עֲמָשָׂא֙ תֹּֽמְר֔וּ הֲ/ל֛וֹא עַצְמִ֥/י וּ/בְשָׂרִ֖/י אָ֑תָּה כֹּ֣ה יַֽעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף אִם לֹ֠א שַׂר צָבָ֞א תִּהְיֶ֧ה לְ/פָנַ֛/י כָּל הַ/יָּמִ֖ים תַּ֥חַת יוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/014.yaml
  text: And say to Amasa[a], ‘Are you not my bone and my flesh? May God do so to me, and more also, if you are not commander of the army before me all the days in place of Joab.’
translation:
  language: ta
  text: அமாசாவிடம் நீங்கள், “நீ என் எலும்பும் என் சதையும் அல்லவா? யோவாபுக்குப் பதிலாக எல்லா நாட்களிலும்[a] என் முன்னிலையில் படைத்தலைவனாக நீ இருக்காவிட்டால், கடவுள் எனக்கு இப்படியும் இதற்கு மேலும் செய்யட்டும்” என்று சொல்லுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “எல்லா நாட்களிலும்”; இங்கு இது தொடர்ந்து பதவியில் இருப்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַעֲמָשָׂא תֹּמְרוּ
  choice: அமாசாவிடம் நீங்கள் … என்று சொல்லுங்கள்
  rationale: இரண்டாம் நபர் பன்மை கட்டளையின் வலிமையைத் தக்கவைத்து, நவீன தமிழில் இயல்பான நேரடிக் கூற்றாக அமைக்கிறது.
- source_word: הֲלוֹא
  choice: அல்லவா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் எபிரெய வினாவை தமிழின் இயல்பான எதிர்மறை வினாவாகப் பாதுகாக்கிறது.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: என் எலும்பும் என் சதையும்
  rationale: உறவைக் குறிக்கும் தெளிவான உருவகத்தை ‘என் உறவினன்’ என்று விளக்கிப் பொருளாக்காமல், மூலத்தின் உயிரோட்டத்துடன் நேரடியாகத் தருகிறது.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: கடவுள் எனக்கு இப்படியும் இதற்கு மேலும் செய்யட்டும்
  rationale: குறிப்பிடப்படாத தண்டனையை விரித்துரைக்காமல், எபிரெய ஆணைச் சூளுரை வடிவின் திட்டமிட்ட மறைபொருளையும் கடுமையையும் காக்கிறது.
- source_word: אִם לֹא
  choice: நீ இருக்காவிட்டால்
  rationale: சூளுரையின் நிபந்தனை அமைப்பைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது; இதன் நடைமுறை வலிமை ‘நிச்சயமாக இருப்பாய்’ என்பதாக இருந்தாலும் அதை வெளிப்படையாக மாற்றவில்லை.
- source_word: שַׂר צָבָא
  choice: படைத்தலைவன்
  rationale: முழுப் படையின் முதன்மைத் தளபதியைக் குறிக்கும் தெளிவான, மரியாதையான நவீன தமிழ்ச் சொல்.
- source_word: תִּהְיֶה לְפָנַי
  choice: என் முன்னிலையில் … நீ இருக்க
  rationale: அரசனின் முன்னிலையில், அவனது அதிகாரத்தின்கீழ் பணியாற்றுதல் என்ற கருத்தை உள்ளடக்கும் மூலச் சொல்லாட்சியை நெருக்கமாகத் தக்கவைக்கிறது.
- source_word: כָּל הַיָּמִים
  choice: எல்லா நாட்களிலும்
  rationale: ‘தொடர்ந்து’ என்ற சூழற்பொருளை மட்டும் கொடுக்காமல், மூலத்தின் சொற்சித்திரத்தையும் பதவியின் நீடித்த தன்மையையும் பாதுகாக்கிறது.
- source_word: תַּחַת יוֹאָב
  choice: யோவாபுக்குப் பதிலாக
  rationale: இங்கு תַּחַת கீழ்ப்படிதலை அல்ல, யோவாபை மாற்றிப் பதவியேற்பதைக் குறிக்கிறது.
theological_decisions:
- issue: சூளுரை வழக்கில் אֱלֹהִים என்பதன் எண்
  choice: கடவுள்
  alternative: கடவுள்கள்
  rationale: வடிவத்தில் பன்மையாகத் தோன்றினாலும், இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கும் நிலையான எபிரெய சூளுரை வழக்கில் இது ஒருமைப் பொருளுடையது.
- issue: אִם לֹא கொண்ட சூளுரையின் வலிமை
  choice: 'நிபந்தனை வடிவத்தைப் பாதுகாத்தல்: ‘நீ இருக்காவிட்டால்’'
  alternative: 'உறுதிமொழியாக வெளிப்படுத்தல்: ‘நிச்சயமாக நீ இருப்பாய்’'
  rationale: எபிரெயத்தில் இது உறுதியான வாக்குறுதியை உணர்த்தினாலும், மூலத்தின் சூளுரை அமைப்பையும் அதிலுள்ள மறைமுகத் தண்டனையையும் பாதுகாக்க நிபந்தனை வடிவமே வைக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக் கட்டளை மற்றும் சூளுரைக்கு ஏற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. உறவைக் குறிக்கும் ‘எலும்பும் சதையும்’ என்ற மூல உருவகம் விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டது; அடிக்குறிப்பு குறி அது விளக்கும் ‘எல்லா நாட்களிலும்’ என்ற சொற்றொடரிலேயே வைக்கப்பட்டது.
