base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/037.yaml
  text: For your servant would only cross the Jordan a little way with the king[a]; why should the king repay me with this reward?
translation:
  language: ta
  text: ஏனெனில், உங்கள் அடியான் அரசரோடு யோர்தானைச் சிறிது தொலைவு மட்டுமே கடந்து வருவேன்; அரசர் எனக்கு இந்தக் கைம்மாற்றை[a] ஏன் செய்ய வேண்டும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘கைம்மாறு செய்’ என்ற வினையும் அதே வேரிலிருந்து வந்த ‘கைம்மாறு’ என்ற பெயர்ச்சொல்லும் சேர்ந்து வருகின்றன; இதனால் பிரதிபலன் அல்லது பதிலுதவி வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּ/מְעַט
  choice: சிறிது தொலைவுதான்
  rationale: כִּי உரையின் காரணத்தொடர்பை உணர்த்துகிறது; מְעַט இச்சூழலில் அரசரோடு குறுகிய தொலைவு மட்டுமே செல்வதைக் குறிக்கிறது. தமிழில் வாக்கியத் தொடர்பும் ‘தான்’ என்னும் வரையறையும் இதை இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: יַעֲבֹר
  choice: கடந்து ... வருவேன்
  rationale: இங்கு imperfect திட்டமிட்ட அல்லது சாத்தியமான செயலைக் குறிக்கிறது. பேச்சாளரின் பணிவான நோக்கத்தைத் தமிழில் ‘வருவேன்’ இயல்பாகத் தருகிறது; ‘கடந்து’ என்பது ஆற்றைக் கடக்கும் செயலைத் தெளிவாக்குகிறது.
- source_word: עַבְדְּךָ
  choice: உங்கள் அடியான்
  rationale: அரசரிடம் தன்னைத் தாழ்த்திப் பேசும் மரபுவழிச் சொல். இங்கு அடிமைத்தனத்தை முன்னிறுத்தாமல், கண்ணியமான அரசவைக் கூற்றை ‘உங்கள் அடியான்’ தக்கவைக்கிறது.
- source_word: אֶת הַיַּרְדֵּן
  choice: யோர்தானைக் கடந்து
  rationale: עבר என்பதோடு இச்சொற்றொடர் யோர்தான் ஆற்றைக் கடப்பதைக் குறிக்கிறது. தமிழ் வினை அமைப்புக்கு ஏற்ப ‘யோர்தானைக் கடந்து’ என வழங்கப்பட்டது.
- source_word: אֶת הַמֶּלֶךְ
  choice: அரசரோடு
  rationale: இங்குள்ள אֶת நேரடிச் செயப்படுபொருள் குறியீடு அல்ல; உடன்செல்லுதலைக் குறிக்கும் ‘உடன்’ என்ற பொருளுடைய முன்னிடைச்சொல். ‘அரசரோடு’ அதனைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְלָמָּה
  choice: வேண்டியது ஏன்?
  rationale: அரசரின் பரிசை பணிவுடன் மறுக்கும் வினாவாக இது வருகிறது. தமிழில் ‘வேண்டியது ஏன்?’ அதன் சொல்லாட்சிச் சக்தியை இயல்பாகக் காட்டுகிறது.
- source_word: יִגְמְלֵנִי ... הַגְּמוּלָה הַזֹּאת
  choice: எனக்கு இத்தகைய கைம்மாறு செய்ய
  rationale: גמל என்ற வினையும் அதே வேரிலான גמולה என்ற பெயர்ச்சொலும் கைம்மாறு அல்லது பிரதிபலன் என்ற கருத்தை வலியுறுத்துகின்றன. ‘கைம்மாறு செய்ய’ தமிழில் இயல்பாக அந்தப் பரஸ்பர ஈட்டுணர்வைத் தருகிறது.
