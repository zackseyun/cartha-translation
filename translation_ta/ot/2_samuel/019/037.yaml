revisions:
- from: உங்கள் அடியான் அரசரோடு யோர்தானைக் கடந்து சிறிது தொலைவுதான் வருவேன்; இதற்காக அரசர் எனக்கு இத்தகைய கைம்மாறு செய்ய வேண்டியது ஏன்?[a]
  to: ஏனெனில், உங்கள் அடியான் அரசரோடு யோர்தானைச் சிறிது தொலைவு மட்டுமே கடந்து வருவேன்; அரசர் எனக்கு இந்தக் கைம்மாற்றை[a] ஏன் செய்ய வேண்டும்?
  rationale: The revision explicitly renders the opening causal particle, changes the broader ‘இத்தகைய’ to the source-specific demonstrative ‘இந்த,’ and moves the footnote marker to the recompense term. It retains the draft’s appropriate royal register and its idiomatic handling of the Hebrew cognate construction.
