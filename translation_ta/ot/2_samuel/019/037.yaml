translation_notes:
  register: நவீன நிலையான தமிழில், அரசரிடம் பேசும் பணிவும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘அரசரோடு’ மற்றும் ‘உங்கள் அடியான்’ அரசவைக் சூழலை இயல்பாகத் தருகின்றன; எபிரெயச் சொல்வேரின் மீளுரைத்தலைத் தமிழில் கட்டாயமாகப் பின்பற்றாமல், அதன் வலியுறுத்தலை அடிக்குறிப்பில் பதிவு செய்துள்ளது.
