translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட எபிரெய இணைப்புத் தொடரை வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரித்துள்ளோம். ‘ராஜா’ என்பது வரலாற்றுக் கதைநடையில் இயல்பாகப் பயன்படுத்தப்பட்டது.
