base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/018.yaml
  text: and a thousand men from Benjamin with him[a], and Ziba, the servant of Saul’s house, with his fifteen sons and his twenty servants; they crossed the Jordan before the king.
translation:
  language: ta
  text: பென்யமீன் கோத்திரத்தைச் சேர்ந்த ஆயிரம் ஆண்கள் சிமேயியுடன் இருந்தார்கள். சவுலின் வீட்டைச் சேர்ந்த பணியாளனான சீபாவும், அவனுடைய பதினைந்து மகன்களும் இருபது பணியாளர்களும் சிமேயியுடன் இருந்தார்கள். அவர்கள் ராஜாவுக்கு முன்பாக[a] யோர்தானைக் கடந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ராஜாவுக்கு முன்னதாக.” எபிரெயச் சொற்றொடர் ராஜாவின் முன்னிலையில் என்பதையோ, அவருக்கு முன்னதாக என்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף אִישׁ עִמּוֹ מִבִּנְיָמִן
  choice: பென்யமீன் கோத்திரத்தைச் சேர்ந்த ஆயிரம் பேர் சிமேயியுடன் இருந்தார்கள்
  rationale: எபிரெயச் சொற்றொடர் ஆயிரம் ஆண்களையும் அவர்களின் பென்யமீன் கோத்திரச் சார்பையும் குறிப்பிடுகிறது. முந்தைய வசனத்திலிருந்து புரியும் ‘அவனுடன்’ என்பதன் குறிப்பு தமிழில் தெளிவாக இருக்க ‘சிமேயியுடன்’ என்று வழங்கப்பட்டது; ‘கோத்திரத்தைச் சேர்ந்த’ என்பது பென்யமீன் என்ற கோத்திரக் குறிப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צִיבָא
  choice: சீபா
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபின்படி வழங்கப்பட்டது.
- source_word: נַעַר בֵּית שָׁאוּל
  choice: சவுலின் குடும்பத்துப் பணியாளன்
  rationale: נַעַר என்பதற்கு இளைஞன், உதவியாளர், பணியாளன் ஆகிய பொருள்கள் இருக்கலாம். சவுலின் வீட்டுடன் சீபாவுக்குள்ள நிர்வாகப் பணித் தொடர்பைக் கருத்தில் கொண்டு ‘பணியாளன்’ தேர்ந்தெடுக்கப்பட்டது; בֵּית என்பதன் குடும்ப/வீட்டார் சார்ந்த பரப்பை ‘குடும்பத்து’ தக்கவைக்கிறது.
- source_word: וַחֲמֵשֶׁת עָשָׂר בָּנָיו
  choice: அவனுடைய பதினைந்து மகன்களும்
  rationale: மகன்களின் எண்ணிக்கையும் அவர்கள் சீபாவைச் சேர்ந்தவர்கள் என்பதும் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளன.
- source_word: וְעֶשְׂרִים עֲבָדָיו
  choice: இருபது பணியாளர்களும்
  rationale: עֶבֶד அடிமை அல்லது பணியாளர் எனப் பொருள்படலாம். இங்கு சீபாவுடன் வந்த வீட்டுப் பணியாளர்களின் எண்ணிக்கையே மையமாக இருப்பதால், அவர்களுடைய சட்ட அல்லது சமூக நிலையை மிகையாக நிர்ணயிக்காமல் ‘பணியாளர்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: וְצָלְחוּ הַיַּרְדֵּן
  choice: அவர்கள் யோர்தானைக் கடந்தார்கள்
  rationale: சூழலில் வினைச்சொல் ஆற்றைக் கடப்பதைக் குறிக்கிறது. ‘யோர்தானைக் கடந்தார்கள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: ராஜாவுக்கு முன்பாக
  rationale: இந்தச் சொற்றொடர் ராஜாவின் முன்னிலையில் அல்லது அவருக்கு முன்னதாக என்ற இரு இடவியல் நுணுக்கங்களையும் கொண்டிருக்கலாம். ‘முன்பாக’ அந்தத் தெளிவின்மையை முதன்மை உரையில் ஓரளவு தக்கவைக்கிறது.
