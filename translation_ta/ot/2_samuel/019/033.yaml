translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. அரசரையும் பர்சிலாயையும் குறிக்கும் சுட்டுப்பெயர்கள் குழப்பம் தராதபடி பெயர்கள் தேவையான இடங்களில் மீண்டும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் இல்லாத தொடக்கக் காலச்சுட்டுச் சொல் சேர்க்கப்படவில்லை.
