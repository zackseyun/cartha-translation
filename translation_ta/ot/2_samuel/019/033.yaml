source:
  edition: WLC
  text: וּ/בַרְזִלַּי֙ זָקֵ֣ן מְאֹ֔ד בֶּן שְׁמֹנִ֖ים שָׁנָ֑ה וְ/הֽוּא כִלְכַּ֤ל אֶת הַ/מֶּ֨לֶךְ֙ בְּ/שִׁיבָת֣/וֹ בְ/מַחֲנַ֔יִם כִּֽי אִ֛ישׁ גָּד֥וֹל ה֖וּא מְאֹֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/033.yaml
  text: Barzillai was very old[a], eighty years old, and he had provided for the king during his stay in Mahanaim, for he was a very wealthy man.
translation:
  language: ta
  text: பர்சிலாய் மிகவும் வயதானவர்; அவருக்கு எண்பது வயது. மகனாயீமில் அரசர் தங்கியிருந்தபோது, பர்சிலாய் அவருடைய தேவைகளை நிறைவேற்றி வந்தார். ஏனெனில் பர்சிலாய் மிகவும் பெரிய மனிதராக இருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர் மிகவும் செல்வந்தராக இருந்தார்’ அல்லது ‘அவர் மிகவும் செல்வாக்குமிக்கவராக இருந்தார்’ என்றும் மொழிபெயர்க்கலாம். ‘மிகவும் பெரிய மனிதர்’ என்ற எபிரெயச் சொற்றொடர் செல்வம், சமூக நிலை அல்லது செல்வாக்கு ஆகியவற்றைப் பரந்த முறையில் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: மிகவும் வயதானவர்
  rationale: זָקֵן இங்கு பயனிலையாக வந்து, מְאֹד அதன் பொருளை வலுப்படுத்துகிறது. ‘மிகவும் வயதானவர்’ என்பது இயல்பான நவீனத் தமிழில் அந்த வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: בֶּן שְׁמֹנִים שָׁנָה
  choice: அவருக்கு எண்பது வயது
  rationale: ‘எண்பது ஆண்டுகளின் மகன்’ என்ற எபிரெய மொழிவழக்கை இயல்பான தமிழில் வயதைக் குறிப்பிடும் முறையாக வழங்குகிறது.
- source_word: כִלְכַּל אֶת הַמֶּלֶךְ
  choice: அரசருடைய தேவைகளை நிறைவேற்றி வந்தார்
  rationale: כלכל இச்சூழலில் உணவு உள்ளிட்ட நடைமுறைத் தேவைகளை அளித்து ஒருவரை ஆதரிப்பதைக் குறிக்கிறது. தொடர்ச்சியான பராமரிப்பையும் ஆதரவையும் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּשִׁיבָתוֹ בְמַחֲנַיִם
  choice: மகனாயீமில் அரசர் தங்கியிருந்தபோது
  rationale: ישב இங்கு அரியணையில் அமர்வதையல்ல, ஓரிடத்தில் தங்கியிருப்பதைக் குறிக்கிறது. ஆண்பால் ஒருமை பின்னொட்டு அருகிலுள்ள ‘அரசர்’ என்பதையே இயல்பாகச் சுட்டுகிறது.
- source_word: אִישׁ גָּדוֹל הוּא מְאֹד
  choice: பர்சிலாய் மிகவும் பெரிய மனிதராக இருந்தார்
  rationale: ‘பெரிய மனிதர்’ என்பது எபிரெயச் சொல்லின் பரந்த பொருளைத் தக்கவைத்து, செல்வம், சமூக நிலை, செல்வாக்கு ஆகியவற்றில் ஒன்றிற்கு மட்டும் பொருளைச் சுருக்காமல் விடுகிறது. பெயரை மீண்டும் பயன்படுத்துவது இரு ஆண் நபர்களைக் கொண்ட வாக்கியத்தில் குழப்பத்தைத் தவிர்க்கிறது.
