  text: וְ/עָבְרָ֣ה הָ/עֲבָרָ֗ה לַֽ/עֲבִיר֙ אֶת בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/לַ/עֲשׂ֥וֹת הַ/טּ֖וֹב ב/עינ/ו וְ/שִׁמְעִ֣י בֶן גֵּרָ֗א נָפַל֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ בְּ/עָבְר֖/וֹ בַּ/יַּרְדֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/019.yaml
  text: The ferryboat crossed over to bring the king’s household across and to do what was good in his sight[c][b][a], and Shimei son of Gera fell before the king as he was crossing the Jordan.
translation:
  language: ta
  text: கடத்துப் படகு[a], அரசரின் வீட்டாரை[b] அக்கரைக்குக் கொண்டுசெல்லவும், அரசருக்கு நல்லதெனத் தோன்றியதைச் செய்யவும்[c] கடந்தது. அரசர் யோர்தானைக் கடந்துகொண்டிருந்தபோது, கேராவின் மகன் சிமெயி அவருக்கு முன்பாக விழுந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆற்றைக் கடத்தும் படகு’ அல்லது ‘கடக்கும் படகு’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் ஆற்றைக் கடப்பதற்கான சாதனத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அரசரின் வீட்டார்’ என்பது அரண்மனைக் கட்டிடத்தை அல்ல, அரச குடும்பத்தாரையும் அவருடைய பரிவாரத்தாரையும் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: 'சொல்லுக்கு சொல்: ‘அவருடைய கண்களில் நல்லதைச் செய்யவும்’; இது அரசருக்கு நல்லதாக அல்லது விருப்பமானதாகத் தோன்றியதைச் செய்வதைக் குறிக்கும் மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲבָרָה
  choice: ஆற்றைக் கடத்தும் படகு
  rationale: இந்தப் பெயர்ச்சொல் ஆற்றைக் கடப்பதற்கான சாதனத்தைக் குறிக்கிறது; இச்சூழலில் படகு அல்லது கடத்துப் படகு என்பது பொருத்தமானது. நவீன தமிழில் தெளிவாக இருக்க விளக்கமான இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְעָבְרָה
  choice: கடந்து வந்தது
  rationale: Qal perfect 3fs என்பது הָעֲבָרָה என்பதுடன் இயைந்து, படகின் நிறைவுற்ற கடத்தலைக் குறிக்கிறது. கதை நகரும் திசையை இயல்பாக வெளிப்படுத்த ‘கடந்து வந்தது’ பயன்படுத்தப்பட்டது.
- source_word: לַעֲבִיר אֶת בֵּית הַמֶּלֶךְ
  choice: அரசரின் வீட்டாரை அக்கரைக்குக் கொண்டுசெல்லவும்
  rationale: Hiphil வினை ஆற்றைக் கடக்கச் செய்வதைக் குறிக்கிறது; ‘அக்கரைக்குக் கொண்டுசெல்ல’ என்பது தமிழில் இயல்பாக அந்தக் காரணவினைப் பொருளைத் தருகிறது.
- source_word: בֵּית הַמֶּלֶךְ
  choice: அரசரின் வீட்டார்
  rationale: இங்கு அரண்மனைக் கட்டிடம் அல்ல, அரச குடும்பத்தையும் அவரோடு சேர்ந்த பரிவாரத்தையும் குறிக்கும் கூட்டுப்பெயர். ‘வீட்டார்’ அந்த விரிவைத் தக்கவைக்கிறது.
- source_word: וְלַעֲשׂוֹת הַטּוֹב בְּעֵינָיו
  choice: அரசருக்கு நலமெனத் தோன்றியதைச் செய்யவும்
  rationale: ‘அவருடைய கண்களில் நல்லதைச் செய்தல்’ என்ற எபிரெய மரபுத்தொடர், அவருக்கு நல்லதாக அல்லது விருப்பமானதாகத் தோன்றியதைச் செய்வதைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாகவும் மூலத்தின் மதிப்பீட்டு நுணுக்கம் நிலைத்திருக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: נָפַל לִפְנֵי הַמֶּלֶךְ
  choice: அவருக்கு முன்பாக விழுந்தான்
  rationale: சொற்றொடர் பணிவுடனான வேண்டுதல் அல்லது தாழ்மையின் உடல் நிலையைச் சுட்டுகிறது. ‘முன்பாக விழுந்தான்’ என்பது செயலை நேரடியாகக் கூறி, அதன் நோக்கத்தைச் சூழல் உணர்த்த இடமளிக்கிறது.
- source_word: בְּעָבְרוֹ בַּיַּרְדֵּן
  choice: அரசர் யோர்தானைக் கடந்துகொண்டிருந்தபோது
  rationale: பின்னொட்டுடன் வரும் infinitive construct காலச்சூழலைக் குறிக்கிறது. அருகிலுள்ள ‘அரசர்’ என்பதையே பின்னொட்டு சுட்டுவதாக எடுத்துக்கொண்டு, நிகழ்ந்துகொண்டிருந்த செயலைத் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: בְּעָבְרוֹ என்பதிலுள்ள ஆண்பால் ஒருமை பின்னொட்டின் குறிப்பு
  choice: யோர்தானைக் கடந்தவர் அரசர்
  alternative: யோர்தானைக் கடந்தவர் சிமெயி
  rationale: இலக்கண ரீதியில் இரண்டும் சாத்தியமானதாகத் தோன்றினாலும், உடனடியாக முன்னுள்ள ‘அரசர்’ என்பதே இயல்பான குறிப்பு; காட்சியின் நகர்வும் அரசரின் கடத்தலை மையப்படுத்துகிறது. இது கோட்பாட்டுத் தீர்மானம் அல்ல, சூழல்சார் குறிப்பு தீர்மானம்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதையுரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘வீட்டார்’ என்ற இயல்பான கூட்டுப்பெயர் பயன்படுத்தப்பட்டு அதன் பரந்த பண்பாட்டுப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டது; மூலத்தின் உருவக மரபுத்தொடர் பொருள் தெளிவாக மொழியாக்கப்பட்டு சொல்லாட்சியின் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
