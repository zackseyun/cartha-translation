base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/017.yaml
  text: Shimei son of Gera[a], the Benjaminite from Bahurim, hurried and went down with the men of Judah to meet King David.
translation:
  language: ta
  text: பகூரீம் ஊரிலிருந்த பென்யமீன் கோத்திரத்தைச் சேர்ந்தவரும் கேராவின் மகனுமான சிமெயி விரைந்து, யூதா கோத்திரத்தாருடன்[a] அரசன் தாவீதைச் சந்திக்கக் கீழே இறங்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யூதாவின் ஒருவனுடன்” என்று ஒருமையில் உள்ளது; இங்கு அந்தச் சொற்றொடர் கூட்டுப்பொருளில் “யூதா கோத்திரத்தாருடன்” எனப் புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: விரைந்து
  rationale: அவசரத்தையும் வேகத்தையும் குறிக்கும் வினையின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: שִׁמְעִי בֶן גֵּרָא
  choice: கேராவின் மகன் சிமெயி
  rationale: எபிரெயப் பெயர்களை ஒலிபெயர்த்து, தந்தை-மகன் உறவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֶּן הַיְמִינִי
  choice: பென்யமீனியனான
  rationale: இங்கு இது உடனடி தந்தைவழிப் பெயரைக் காட்டாமல் பென்யமீன் கோத்திரச் சேர்ந்தவனைக் குறிக்கும் இனக்குழுப் பெயராகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: אֲשֶׁר מִבַּחוּרִים
  choice: பகூரிமைச் சேர்ந்த
  rationale: சிமெயியின் ஊர்ச் சார்பைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיֵּרֶד
  choice: கீழே இறங்கினான்
  rationale: எபிரெய மூலத்தில் உள்ள நிலவியல் சார்ந்த இறங்கிச் செல்லும் இயக்கத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: עִם אִישׁ יְהוּדָה
  choice: யூதா ஆட்களுடன்
  rationale: אִישׁ ஒருமை வடிவில் இருந்தாலும், சூழலில் அது கூட்டுப்பொருளில் புரிந்துகொள்ளப்படுவது இயல்பானது; இதை அடிக்குறிப்பு வெளிப்படையாகக் குறிப்பிடுகிறது.
- source_word: לִקְרַאת
  choice: சந்திக்க
  rationale: ஒருவரை எதிர்கொண்டு சந்திப்பதற்காகச் செல்லும் நோக்கத்தை நேரடியாகத் தெரிவிக்கிறது.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: தாவீது அரசரை
  rationale: அரசப் பட்டத்தையும் பெயரையும் இயல்பான தமிழ் சொல்வரிசையில் வழங்குகிறது.
