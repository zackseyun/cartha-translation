translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் நிலவியல் இயக்கமான ‘கீழே இறங்கினான்’ என்பதும், אִישׁ என்பதன் வடிவுக்கும் சூழல்சார் கூட்டுப்பொருளுக்கும் இடையிலான வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
