  - severity: low
    issue: Colloquial and potentially ambiguous rendering of Judahites
    rationale: “யூதா ஆட்கள்” is less suitable for the passage’s register and may be read as people belonging to an individual named Judah. “யூதா கோத்திரத்தார்” is more precise while retaining the collective interpretation documented in the note.
