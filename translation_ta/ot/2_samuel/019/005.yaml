base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/005.yaml
  text: And the king covered his face[a], and the king cried out with a loud voice, “My son Absalom! Absalom, my son, my son!”
translation:
  language: ta
  text: அரசன் தன் முகத்தை மூடிக்கொண்டு[a], உரத்த குரலில், “என் மகனே அப்சலோமே! அப்சலோமே, என் மகனே, என் மகனே!” என்று கூக்குரலிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் முகத்தைப் போர்த்திக்கொண்டு” அல்லது “தன் முகத்தை மறைத்துக்கொண்டு.” எபிரெய வினைச்சொல் துயரத்தில் முகத்தை மூடிக்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאַט
  choice: மூடிக்கொண்டு
  rationale: இவ்வினைச்சொல் இங்கு துயரத்தில் முகத்தை மூடுதல் அல்லது போர்த்துதல் என்னும் செயலைக் குறிக்கிறது. ‘மூடிக்கொண்டு’ என்பது செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; அதன் முறையைத் தேவையின்றி மிகத் துல்லியமாக்கவில்லை.
- source_word: פָּנָיו
  choice: தன் முகத்தை
  rationale: நேரடிச் செயப்படுபொருள் குறியீடும் துக்கச் சூழலும் சேர்ந்து, உருவகமான ‘சந்நிதி’ என்பதல்ல, உடலுறுப்பான முகமே குறிக்கப்படுவதைத் தெளிவாக்குகின்றன.
- source_word: וַיִּזְעַק
  choice: கதறினான்
  rationale: இந்த வினை உரத்த கூக்குரலைக் குறிக்கிறது. இங்கு தாவீதின் ஆழ்ந்த துயரத்தைச் சூழல் தெளிவாகக் காட்டுவதால், தமிழில் ‘கதறினான்’ உணர்ச்சியையும் ஒலியின் தீவிரத்தையும் இயல்பாகத் தருகிறது.
- source_word: קוֹל גָּדוֹל
  choice: உரத்த குரலில்
  rationale: எபிரெய மொழியின் ‘பெரிய குரல்’ என்ற மரபுத்தொடரை நவீன தமிழில் இயல்பாகவும் அதன் வலியுறுத்தலைக் காத்தும் வழங்குகிறது.
- source_word: בְּנִי
  choice: என் மகன் / என் மகனே
  rationale: ஆண்பால் ஒருமையிலுள்ள உறவைக் குறிப்பாகக் காக்கிறது. அழைப்பிடங்களில் ‘என் மகனே’ என்றும் பெயருக்கு முன்னர் ‘என் மகன்’ என்றும் தமிழின் இயல்புக்கு ஏற்ப வழங்கப்பட்டுள்ளது.
- source_word: אַבְשָׁלוֹם
  choice: அப்சலோம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: repetition of אַבְשָׁלוֹם / בְּנִי
  choice: “என் மகன் அப்சலோமே! அப்சலோமே, என் மகனே, என் மகனே!”
  rationale: மூலத்தில் உள்ள பெயர் மற்றும் உறவுச்சொல்லின் மறுமொழிகள் அனைத்தும் தாவீதின் தீவிரத் துயரத்தை வெளிப்படுத்துவதால் நீக்காமல் பாதுகாக்கப்பட்டுள்ளன.
