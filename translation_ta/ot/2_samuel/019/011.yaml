base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/011.yaml
  text: And Absalom[a], whom we anointed over us, died in battle. So now why are you silent about bringing the king back?
translation:
  language: ta
  text: நம்மேல் ஆளும்படி நாம் அபிஷேகம் செய்த அப்சலோம் போரில் இறந்துவிட்டான். இப்போது ராஜாவைத் திரும்ப அழைத்துவருவது குறித்து நீங்கள் ஏன் மௌனமாக இருக்கிறீர்கள்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ராஜாவைத் திரும்ப வரச்செய்வது குறித்து நீங்கள் ஏன் மௌனமாக இருக்கிறீர்கள்?”
    reason: לְהָשִׁיב என்பதன் காரணவினைப் பொருளான ‘திரும்ப வரச்செய்தல்’ என்பதற்கான நேரடியான மாற்று.
lexical_decisions:
