- source_word: מָשַׁחְנוּ עָלֵינוּ
  choice: நம்மை ஆளும்படி நாம் திருப்பொழிவு செய்த
  rationale: מָשַׁח என்பதன் அரச நிறுவல் சார்ந்த ‘திருப்பொழிவு செய்த’ என்ற பொருளைப் பேணுகிறது; עָלֵינוּ என்பதன் ‘நம்மேல் ஆளும்படி’ என்ற அரசாட்சித் தொடர்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מֵת בַּמִּלְחָמָה
  choice: போரில் இறந்துவிட்டான்
  rationale: முடிவுற்ற நிகழ்வையும் அதன் தற்போதைய விளைவையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: முந்தைய கூற்றிலிருந்து எழும் உடனடியான நடைமுறை விளைவுக்கு உரையை நகர்த்துகிறது.
- source_word: מַחֲרִשִׁים
  choice: மௌனமாக இருக்கிறீர்கள்
  rationale: חרשׁ என்பதன் அடிப்படை மௌனமாக இருத்தல் என்ற பொருளைப் பேணி, வெறும் ‘தயங்குதல்’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: לְהָשִׁיב אֶת־הַמֶּלֶךְ
  choice: ராஜாவைத் திரும்ப அழைத்துவருவது குறித்து
  rationale: ஹிப்ஃபில் வடிவத்தின் ‘திரும்பச் செய்யுதல்/திரும்பக் கொண்டுவருதல்’ என்ற காரணவினைப் பொருளைப் பேணுகிறது; ‘மௌனமாக இருப்பது’ என்பதுடன் தமிழில் இயல்பாக இணைய ‘குறித்து’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: அப்சலோமைக் குறிக்கும் מָשַׁח என்ற அரச நிறுவல் வினை
  choice: திருப்பொழிவு செய்த
  alternative: அரசனாக்கினோம்
  rationale: கதைச்சூழலில் அப்சலோம் ஆட்சியைப் பறித்தவராக இருந்தாலும், மூல உரை அரசர்களை நிறுவுவதற்குப் பயன்படுத்தப்படும் வழக்கமான ‘திருப்பொழிவு செய்’ என்ற வினையையே பயன்படுத்துகிறது. அதைத் தக்கவைத்தல் உரையின் அரசியல்-சமய நிறையைப் பேணி, மொழிபெயர்ப்பில் மதிப்பீட்டைச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க உரைநடை பயன்படுத்தப்பட்டுள்ளது. அரச நிறுவல் சார்ந்த மூலச்சொல்லின் தனித்துவத்தைப் பேண ‘திருப்பொழிவு’ தேர்ந்தெடுக்கப்பட்டது; ‘ராஜா’ என்பது சூழலில் தாவீதின் அரசியல் பதவியை முன்னிறுத்துகிறது.
