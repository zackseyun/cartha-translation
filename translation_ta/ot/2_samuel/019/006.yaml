  text: וַ/יָּבֹ֥א יוֹאָ֛ב אֶל הַ/מֶּ֖לֶךְ הַ/בָּ֑יִת וַ/יֹּאמֶר֩ הֹבַ֨שְׁתָּ הַ/יּ֜וֹם אֶת פְּנֵ֣י כָל עֲבָדֶ֗י/ךָ הַֽ/מְמַלְּטִ֤ים אֶֽת נַפְשְׁ/ךָ֙ הַ/יּ֔וֹם וְ/אֵ֨ת נֶ֤פֶשׁ בָּנֶ֨י/ךָ֙ וּ/בְנֹתֶ֔י/ךָ וְ/נֶ֣פֶשׁ נָשֶׁ֔י/ךָ וְ/נֶ֖פֶשׁ פִּלַגְשֶֽׁי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/006.yaml
  text: Then Joab came into the house to the king and said[a], “Today you have put to shame all your servants who today saved your life, and the lives of your sons and your daughters[c][b], and the lives of your wives and your concubines.”
translation:
  language: ta
  text: அப்போது யோவாப் வீட்டுக்குள்[a] அரசனிடம் வந்து, “இன்று உமது உயிரையும்[b], உமது மகன்களின் மற்றும் மகள்களின் உயிர்களையும், உமது மனைவியரின் மற்றும் வைப்பாட்டிகளின் உயிர்களையும் காப்பாற்றிய உமது பணியாளர்கள் அனைவரையும் இன்று நீர் அவமானப்படுத்திவிட்டீர்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வீடு’ என்பது இங்கு அரசரின் இருப்பிடத்தை அல்லது அரண்மனையைக் குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: எபிரெயத்தில் ‘உயிர்’ (நெஃபெஷ்) என்ற சொல் வருகிறது; இங்கு ‘ஆத்துமா’ என்பதற்குப் பதிலாக மரணத்திலிருந்து காக்கப்பட்ட உடல் வாழ்வைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּיִת
  choice: வீட்டுக்குள்
  rationale: எபிரெயச் சொல் நேரடியாக ‘வீடு’ என்று பொருள்படும்; சூழலில் இது அரசரின் இருப்பிடத்தை அல்லது அரண்மனையைச் சுட்டலாம் என்பதால், மூலத்தின் பொதுவான சொல்லை முதன்மை உரையில் பாதுகாத்து விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: הֹבַשְׁתָּ אֶת־פְּנֵי
  choice: அவமானப்படுத்திவிட்டீர்
  rationale: ‘முகங்களை வெட்கப்படச் செய்தீர்’ என்ற எபிரெய மொழிமரபின் பொருளை இயல்பான நவீனத் தமிழில் பொதுமக்கள் புரிந்துகொள்ளும் வகையில் வெளிப்படுத்துகிறது.
- source_word: עֲבָדֶיךָ
  choice: உமது பணியாளர்கள்
  rationale: அரசனுக்குச் சேவை செய்பவர்களையும் அவனது ஆட்களையும் குறிக்கும் உறவுமுறையை, ‘அதிகாரிகள்’ அல்லது ‘வீரர்கள்’ என்று தேவையின்றிக் குறுக்காமல் தெரிவிக்கிறது.
- source_word: הַמְמַלְּטִים
  choice: காப்பாற்றிய
  rationale: ஆபத்திலிருந்தும் மரணத்திலிருந்தும் விடுவித்த செயலைச் சூழலுக்கேற்ற இயல்பான தமிழில் குறிக்கிறது.
- source_word: נֶפֶשׁ
  choice: உயிர் / உயிர்கள்
  rationale: இங்கு உடலிலிருந்து வேறான ‘ஆத்துமா’ அல்ல, மரணத்திலிருந்து காக்கப்பட்ட உயிரையே குறிக்கிறது.
- source_word: פִּלַגְשֶׁיךָ
  choice: வைப்பாட்டிகள்
  rationale: அங்கீகரிக்கப்பட்டிருந்தாலும் மனைவியைவிடத் தாழ்ந்த சமூகத் தகுநிலை கொண்ட துணைவியரைக் குறிக்கும் வரலாற்றுச் சொல்லை, மதிப்பீட்டைச் சேர்க்காமல் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וַיָּבֹא ... וַיֹּאמֶר
  choice: அப்போது ... வந்து ... என்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான தமிழில் முன்னெடுக்கிறது.
theological_decisions:
- issue: குடும்ப மற்றும் சமூக நிலைப் பெயர்களை அறநெறித் தீர்ப்பின்றி மொழிபெயர்த்தல்
  choice: மனைவியர் மற்றும் வைப்பாட்டிகள்
  alternative: மனைவியர் மற்றும் இரண்டாம் நிலை மனைவியர்
  rationale: மூலத்தில் வேறுபடுத்தப்பட்டுள்ள இரு வரலாற்றுச் சமூகப் பிரிவுகளையும் மென்மையாக்காமலும் கண்டனம் சேர்க்காமலும் பாதுகாக்கிறது.
- issue: נֶפֶשׁ என்பதன் பொருள்
  choice: உயிர்
  alternative: ஆத்துமா
  rationale: போர்ச் சூழலில் மரணத்திலிருந்து காப்பாற்றப்பட்ட உடல் வாழ்வைக் குறிக்கிறது; மனித இயல்பைப் பற்றிய ஒரு குறிப்பிட்ட இறையியல் கோட்பாட்டை வசனத்தில் புகுத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதை ஒருமையான ‘உமது/நீர்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. யோவாபின் கடுமையான நேரடி குற்றச்சாட்டு தெளிவாகவும் கண்ணியமான கதைநடையிலும் வைக்கப்பட்டுள்ளது; எபிரெயத்தின் ‘முகங்களை வெட்கப்படச் செய்தல்’ என்ற மரபுத்தொடர் இயல்பான தமிழுக்காக பொருள்வழியாக மொழிபெயர்க்கப்பட்டுள்ளது.
