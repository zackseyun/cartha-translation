  source_fidelity: 'கருத்து மொத்தத்தில் எபிரெய மூலத்திற்கு உண்மையாக உள்ளது: யோவாபின் வருகை, பணியாளர்களை அவமானப்படுத்துதல், உயிர்களைக் காப்பாற்றுதல், குடும்பப் பட்டியல் ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் ‘உமது மகன்கள் மகள்களின்’ என்பது தமிழில் ‘மகன்களின் மகள்கள்’ எனத் தவறாகப் புரியக்கூடிய இணைப்பாக உள்ளது. மூலத்தில் மகன்களும் மகள்களும் தனித்தனியான இணைப்புப் பகுதிகள் என்பதால் அது தெளிவாக்கப்பட வேண்டும்.'
  naturalness: ‘உமது மகன்களின் மற்றும் மகள்களின்’, ‘உமது மனைவியரின் மற்றும் வைப்பாட்டிகளின்’ என்ற இணை அமைப்புகள் நவீன நிலையான தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளன. ‘அவமானப்படுத்திவிட்டீர்’ யோவாபின் கடுமையான கண்டனத்திற்கும் மரியாதை ஒருமை நடைக்கும் ஏற்றது.
  terminology: ‘உயிர்’, ‘பணியாளர்கள்’, ‘மனைவியர்’, ‘வைப்பாட்டிகள்’ ஆகியவை மூலத்தின் பொருளையும் வரலாற்றுச் சமூக வேறுபாட்டையும் தேவையற்ற இறையியல் அல்லது ஒழுக்க மதிப்பீடு இன்றி காக்கின்றன. நெஃபெஷ் குறித்த குறிப்பு எல்லாப் பயன்பாடுகளுக்கும் பொருந்துமாறு முதல் ‘உயிர்’ இடத்தில் இணைக்கப்பட்டுள்ளது.
