base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/001.yaml
  text: Then the king was deeply shaken[a], and he went up to the chamber over the gate and wept. As he went, he said, “My son Absalom! My son, my son Absalom! If only I had died instead of you, Absalom, my son[b], my son!”
translation:
  language: ta
  text: அப்போது அரசன் மிகவும் கலங்கி, வாசலுக்கு மேலிருந்த மாடியறைக்குச்[a] சென்று அழுதான். அவன் சென்றுகொண்டிருக்கையில், “என் மகன் அப்சலோமே! என் மகனே, என் மகனே, அப்சலோமே! உனக்குப் பதிலாக நான் இறந்திருந்தால் நன்றாயிருந்திருக்குமே![b] அப்சலோமே, என் மகனே, என் மகனே!” என்று கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குநெருக்கமாக, “வாசலின் மேலறை.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “யார் கொடுப்பார்…?” இது “நான் இறந்திருந்தால் நன்றாயிருந்திருக்குமே” என்ற ஆழ்ந்த விருப்பத்தை வெளிப்படுத்தும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְגַּז
  choice: மிகவும் கலங்கி
  rationale: רגז என்பது நடுக்கம், பதற்றம் அல்லது ஆழ்ந்த மனக்கலக்கம் ஆகியவற்றைக் குறிக்கலாம். மகனுக்காகத் துயரப்படும் இச்சூழலில், உடல் நடுக்கத்தை மட்டும் முன்னிறுத்தாமல் அரசனின் தீவிரமான மனக்குலைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֲלִיַּת הַשַּׁעַר
  choice: வாசலுக்கு மேலிருந்த மாடியறை
  rationale: עֲלִיָּה என்பது மேலறை அல்லது மாடியறையைக் குறிக்கிறது; הַשַּׁעַר உடன் சேரும்போது வாசல் கட்டமைப்புக்கு மேலிருந்த அறை என்பதே பொருள்.
- source_word: וַיֵּבְךְּ
  choice: அழுதான்
  rationale: בכה என்பதன் நேரான, இயல்பான தமிழ் இணை; இங்கு புலம்பலின் கண்ணீரைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְכֹה אָמַר בְּלֶכְתּוֹ
  choice: அவன் சென்றுகொண்டிருக்கையில் … என்று கூறினான்
  rationale: ‘அவன் செல்லும்போது இவ்வாறு கூறினான்’ என்ற எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் தருகிறது; நடந்து செல்லும் போதே புலம்பல் தொடர்ந்ததைப் பாதுகாக்கிறது.
- source_word: בְּנִי
  choice: என் மகன் / என் மகனே
  rationale: புலம்பலின் உணர்ச்சிச் சுமையைத் தாங்கும் ஒவ்வொரு மறுபடியும் விடாமல் பாதுகாக்கப்பட்டுள்ளது; நேரடி அழைப்பில் இயல்பான தமிழ் விளிவடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִי יִתֵּן
  choice: நன்றாயிருந்திருக்குமே
  rationale: சொல்லுக்கு சொல் ‘யார் கொடுப்பார்?’ என்றாலும், இங்கு அது நிறைவேறாத ஆழ்ந்த விருப்பத்தை வெளிப்படுத்தும் எபிரெய மரபுத்தொடர். தமிழில் எதிர்நிகழ் ஏக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מוּתִי אֲנִי תַחְתֶּיךָ
  choice: உனக்குப் பதிலாக நான் இறந்திருந்தால்
  rationale: மகனுக்குப் பதிலாகத் தான் இறந்திருக்க வேண்டும் என்ற அரசனின் எதிர்நிகழ் விருப்பத்தைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: אַבְשָׁלוֹם
  choice: அப்சலோம்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு; நேரடி அழைப்பில் ‘அப்சலோமே’ என வழங்கப்பட்டுள்ளது.
