  register: நவீனத் தரத் தமிழில், மரியாதையும் பொதுவாசகர்களுக்கான தெளிவும் காக்கப்பட்டுள்ளன. மூலத்தின் உறவுமுறை உருவகமும் அரசரின் மூன்றாம் நபர் தற்குறிப்பும் பாதுகாக்கப்பட்டுள்ளன.
