  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אַחַ֣/י אַתֶּ֔ם עַצְמִ֥/י וּ/בְשָׂרִ֖/י אַתֶּ֑ם וְ/לָ֧/מָּה תִהְי֛וּ אַחֲרֹנִ֖ים לְ/הָשִׁ֥יב אֶת הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/013.yaml
  text: You are my brothers[a]; you are my own bone and flesh[c][b]. So why should you be the last to bring back the king?
translation:
  language: ta
  text: நீங்கள் என் சகோதரர்கள்[a]; நீங்கள் என் எலும்பும் என் சதையுமாய் இருக்கிறீர்கள்[b]. அப்படியிருக்க, அரசனைத் திரும்ப அழைத்து வருவதில் நீங்கள் ஏன் கடைசியாக இருக்க வேண்டும்?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பொருளடிப்படையில், “என் உறவினர்கள்”; சொல்லர்த்தமாக, “என் சகோதரர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “என் எலும்பும் என் சதையும்” என்பது நெருங்கிய இரத்த உறவைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: cultural_note
  - marker: c
    text: தாவீது தம்மையே மூன்றாம் நபரில் “அரசன்” என்று குறிப்பிடுகிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: என் சகோதரர்கள்
  rationale: எபிரேயச் சொல்லின் நேர்ப்பொருளைத் தக்கவைக்கிறது; இச்சூழலில் இது யூதா கோத்திரத்தாருடனான நெருங்கிய உறவைக் குறிக்கிறது.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: என் எலும்பும் என் சதையுமாய்
  rationale: இரத்த உறவைக் குறிக்கும் எபிரேய உருவகத்தை விளக்கவுரையாக மாற்றாமல், தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: וְלָמָה
  choice: அப்படியிருக்க ... ஏன்
  rationale: முந்தைய உறவுமுறை வாக்கியத்தை அடிப்படையாகக் கொண்ட வேண்டுகோள் சார்ந்த காரணத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תִּהְיוּ אַחֲרֹנִים
  choice: நீங்கள் ஏன் கடைசியாக இருக்க வேண்டும்?
  rationale: இது வெறும் எதிர்கால முன்னறிவிப்பு அல்ல; வற்புறுத்தும் சொல்லாட்சியுடைய வினா. ‘கடைசியாக’ என்பது மற்றவர்களுக்குப் பின்தங்குவதைத் தக்கவைக்கிறது.
- source_word: לְהָשִׁיב
  choice: திரும்ப அழைத்து வருவதில்
  rationale: שוב என்பதன் ஹிஃபில் வடிவிலுள்ள ‘திரும்பச் செய்யுதல்/திரும்பக் கொண்டுவருதல்’ என்ற பொருளை, அரசனை மீண்டும் வரவழைப்பது என்ற சூழலில் இயல்பாகக் கூறுகிறது.
- source_word: אֶת־הַמֶּלֶךְ
  choice: அரசனை
  rationale: தாவீது தம்மைக் குறித்து மூன்றாம் நபரில் ‘அரசன்’ எனப் பேசும் மூலமொழியின் வடிவத்தைப் பாதுகாக்கிறது.
