  source_fidelity: 'மூல எபிரேயத்தின் முக்கிய கூறுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: אַחַי என்பதற்கு “என் சகோதரர்கள்,” עַצְמִי וּבְשָׂרִי என்ற உறவுமுறை உருவகத்திற்கு “என் எலும்பும் என் சதையும்,” வலியுறுத்தும் வினாவிற்கு “ஏன் கடைசியாக இருக்க வேண்டும்,” மற்றும் לְהָשִׁיב אֶת־הַמֶּלֶךְ என்பதற்கு “அரசனைத் திரும்ப அழைத்து வருவதில்” என மொழிபெயர்க்கப்பட்டுள்ளது. தாவீதின் மூன்றாம்-நபர் அரசக் குறிப்பும் பாதுகாக்கப்பட்டுள்ளது.'
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் மரியாதையான பொது வாசகப் பதிவிலும் உள்ளது. “என் எலும்பும் என் சதையுமாய் இருக்கிறீர்கள்” என்பது மூல உருவகத்தைச் செயற்கையின்றி காக்கிறது; “அப்படியிருக்க” முந்தைய கூற்றிலிருந்து வரும் வாதத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
  terminology: “சகோதரர்கள்,” “எலும்பும் ... சதையும்,” “அரசன்” ஆகிய சொற்கள் மூலத்தின் உறவுமுறை, உருவக, அரசியல் சொற்களோட்டத்தைத் தக்கவைக்கின்றன. அடிக்குறிப்புகள் சொற்பொருள் மாற்றையும் எபிரேய மரபுத்தொடரின் பொருளையும், அரசரின் மூன்றாம் நபர் தற்குறிப்பையும் சரியாக விளக்குகின்றன; குறியீட்டு இணைப்புகள் செல்லுபடியாக உள்ளன.
