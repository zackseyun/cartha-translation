source:
  edition: WLC
  text: וַ/יְרַגֵּ֣ל בְּ/עַבְדְּ/ךָ֔ אֶל אֲדֹנִ֖/י הַ/מֶּ֑לֶךְ וַ/אדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ כְּ/מַלְאַ֣ךְ הָ/אֱלֹהִ֔ים וַ/עֲשֵׂ֥ה הַ/טּ֖וֹב בְּ/עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/028.yaml
  text: He slandered your servant to my lord the king, but my lord the king is like the angel of God; so do what is good in your eyes.
translation:
  language: ta
  text: அவன் உமது அடியவனைப்பற்றி என் ஆண்டவராகிய அரசரிடம் அவதூறு சொன்னான். ஆனாலும், என் ஆண்டவராகிய அரசர் கடவுளின் தூதரைப் போன்றவர்; ஆகவே, உமது பார்வைக்கு நல்லதாக இருப்பதைச் செய்யும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְרַגֵּל
  choice: அவதூறு சொன்னான்
  rationale: இந்தப் பிஏல் வினைச்சொல் இச்சூழலில் ஒருவரைப் பற்றி தீங்கான அல்லது பொய்யான செய்தியை எடுத்துரைத்து அவதூறு செய்வதைக் குறிக்கிறது.
- source_word: בְּעַבְדְּךָ
  choice: உமது அடியவனைப்பற்றி
  rationale: பேசுபவர் தம்மைத் தாழ்மையுடன் மூன்றாம் நபரில் குறிப்பிடும் அரசவைக் கூறுமுறையைப் பாதுகாக்கிறது.
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: கடவுளின் தூதரைப் போன்றவர்
  rationale: מַלְאָךְ என்பதன் அடிப்படைப் பொருளான 'தூதர்' என்பதைப் பாதுகாத்து, அது மனிதரா விண்ணுலகத் தூதரா என்ற சொல்லின் சாத்தியமான விரிவை தேவையின்றி முடிவுசெய்யவில்லை.
- source_word: וַעֲשֵׂה הַטּוֹב בְּעֵינֶיךָ
  choice: ஆகவே, உமது பார்வைக்கு நல்லதாக இருப்பதைச் செய்யும்
  rationale: எபிரேய மொழியின் 'கண்களில் நல்லது' என்ற தீர்ப்பு/விருப்பக் கூறை இயல்பான தமிழில் நெருக்கமாகப் பிரதிபலிக்கிறது; וַ தொடர் இங்கு விளைவைக் குறிக்கும் வகையில் 'ஆகவே' என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: הָאֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: தேவன்
  rationale: இங்கு பொதுவான தெய்வப் பட்டமே உள்ளது; உடன்படிக்கைப் பெயர் அல்ல. நவீன பொதுத் தமிழில் இயல்பாகவும் சமயப் பிரிவுசார்பின்றியும் 'கடவுள்' பயன்படுத்தப்பட்டது.
- issue: கடவுளின் தூதர் என்ற ஒப்புமையின் தன்மை
  choice: ஒப்புமையை விளக்கமின்றி அப்படியே வைத்தல்
  alternative: அரசர் கடவுளைப் போல நீதியறிவுடையவர் என விரித்துரைத்தல்
  rationale: மூலவசனம் எந்தக் குறிப்பிட்ட பண்பில் ஒப்புமை அமைந்துள்ளது என்பதை வெளிப்படையாகச் சொல்லவில்லை; ஆகவே அதன் இறையியல் மற்றும் இலக்கியத் திறந்த தன்மை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; அரசவைக் கண்ணியத்தை வெளிப்படுத்த ‘என் ஆண்டவராகிய அரசர்’, ‘உமது’, ‘செய்யும்’ ஆகிய மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. வாக்கியம் சாதாரண வாசகர்களுக்குப் புரியுமாறு இயல்பாகவும், மூலத்தின் தாழ்மையான வேண்டுகோள் தொனியைத் தக்கவைத்தும் அமைக்கப்பட்டுள்ளது.
