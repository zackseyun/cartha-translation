- source_word: יָרַד
  choice: கீழே வந்தான்
  rationale: வினைச்சொல்லின் இறங்கிவரும் திசைப்பொருளையும், அரசனை அணுகும் கதைநோக்கையும் காக்கிறது.
- source_word: לִקְרַאת הַמֶּלֶךְ
  choice: அரசனைச் சந்திக்க
  rationale: ஒருவரை எதிர்கொண்டு சந்திக்கச் செல்வதைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கு இயல்பான தமிழ்.
- source_word: וְלֹא עָשָׂה רַגְלָיו
  choice: தன் கால்களைப் பராமரிக்கவும் இல்லை
  rationale: சொல்லர்த்தமாக ‘தன் கால்களைச் செய்யவில்லை’ என்று இருந்தாலும், குறிப்பான பராமரிப்புச் செயல் தெளிவாக இல்லாததால் அதன் பரந்த பொருளைத் தருகிறது.
- source_word: וְלֹא עָשָׂה שְׂפָמוֹ
  choice: தன் மீசையைச் சீர்செய்யவும் இல்லை
  rationale: שָׂפָם மேல் உதட்டு முடி அல்லது மீசைப் பகுதியைக் குறிக்கிறது; ‘தாடி’ என்று விரிவுபடுத்தாமல், சரியாக எந்தச் சீர்ப்படுத்தல் என்பதையும் தேவையின்றி நிர்ணயிக்கவில்லை.
- source_word: וְאֶת בְּגָדָיו לֹא כִבֵּס
  choice: தன் உடைகளைத் துவைக்கவும் இல்லை
  rationale: ஆடைகளைத் துவைத்தல் என்ற நேரடியான பொருளை நவீன இயல்பான தமிழில் தருகிறது.
- source_word: לְמִן הַיּוֹם לֶכֶת הַמֶּלֶךְ
  choice: அரசன் சென்ற நாள்முதல்
  rationale: הלך என்பதன் குறியிடப்படாத ‘செல்’ பொருளை உயர்த்தப்பட்ட நடையின்றி காக்கிறது.
- source_word: עַד הַיּוֹם אֲשֶׁר בָּא בְשָׁלוֹם
  choice: அவன் சமாதானமாகத் திரும்பிவந்த நாள்வரை
  rationale: בְשָׁלוֹם என்பதன் சமாதானத்துடனும் பாதுகாப்புடனும் வருதல் என்ற நுண்பொருளைக் காக்கிறது; ‘வீடு’ என்பதைச் சேர்க்கவில்லை. சூழல் திரும்பிவருதலைக் காட்டுவதால் ‘திரும்பிவந்த’ என மொழிபெயர்க்கப்பட்டது.
