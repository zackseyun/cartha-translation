translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் மூன்று எதிர்மறைச் செயல்களும் இணை அமைப்பில் வைக்கப்பட்டுள்ளன. ‘சமாதானமாக’ என்பது שלום சொல்லின் ஒலிப்பையும் கருத்து விரிவையும் காக்கிறது; பாதுகாப்பாக வந்தான் என்ற பொருளும் சூழலில் அடங்கியுள்ளது.
