base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/025.yaml
  text: And Mephibosheth son of Saul came down to meet the king[a]. He had not cared for his feet, nor trimmed his mustache, nor washed his clothes[c][b], from the day the king left until the day he came in peace.
translation:
  language: ta
  text: சவுலின் மகன் மேவிபோசேத் அரசனைச் சந்திக்கக் கீழே வந்தான். அரசன் சென்ற நாள்முதல் அரசன் சமாதானமாக வந்த நாள்வரை, அவன் தன் கால்களைப் பராமரிக்கவில்லை[a], தன் மீசையைச் சீர்செய்யவில்லை[b], தன் உடைகளைத் துவைக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, ‘தன் கால்களைச் செய்யவில்லை.’ இது கால்களுக்கான வழக்கமான பராமரிப்பையோ தூய்மைப்படுத்தலையோ புறக்கணித்ததைக் குறிக்கிறது; குறிப்பான செயல் தெளிவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தன் மீசையைப் பராமரிக்கவில்லை.’ எபிரெயச் சொல் முழுத் தாடியைக் கட்டாயமாகக் குறிக்காமல், மேல் உதட்டு முடிப் பகுதியைக் குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
