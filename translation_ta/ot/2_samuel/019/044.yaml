translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘அரசன்’ என்பதற்குப் பதில் மரியாதை மற்றும் உரைநடைக் கண்ணியத்திற்காக ‘அரசர்’ பயன்படுத்தப்பட்டது. பிரதிநிதித்துவ ஒருமைக்கும் இறுதியில் வரும் கூட்டுப்பொருளுக்கும் இடையிலான வேறுபாடு தெளிவாக வைக்கப்பட்டது; மூலத்தின் சுருக்கமும் மாற்றுப் பொருள் வாய்ப்புகளும் அடிக்குறிப்புகளில் காக்கப்பட்டன.
