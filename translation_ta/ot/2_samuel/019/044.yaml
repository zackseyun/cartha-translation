base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/044.yaml
  text: Then the man of Israel answered the man of Judah and said[a], “I have ten shares in the king, and in David also I have more than you[d][c][b]. Why then did you treat me lightly? Was not my word first in bringing back my king?” But the word of the men of Judah was harsher than the word of the men of Israel.
translation:
  language: ta
  text: 'அப்போது இஸ்ரவேலன் யூதாவைச் சேர்ந்தவனுக்குப் பதிலளித்துச் சொன்னான்: “அரசரிடம் எனக்குப் பத்துப் பங்குகள் உண்டு[a]; தாவீதின்மீதும் உன்னைவிட எனக்கு அதிக உரிமை உண்டு[b]. அப்படியிருக்க, நீ ஏன் என்னை அற்பமாக நடத்தினாய்? என் அரசரைத் திரும்ப அழைத்துவர வேண்டும் என்று முதலில் சொன்னது நானல்லவா?[c]” ஆனால் இஸ்ரவேலரின் பேச்சைவிட யூதரின் பேச்சு கடுமையாக இருந்தது[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “அரசரில் எனக்குப் பத்துக் கைகள்.” இது பத்துப் பங்குகள் அல்லது உரிமைப் பகுதிகள் என்று பொருள்படும் மரபுத்தொடர்; யூதாவுக்கு எதிராக வடக்கிலுள்ள பத்துக் கோத்திரங்கள் முன்வைத்த உரிமைக் கூற்றை இது குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “தாவீதிலும் நான் உன்னைவிட அதிகமானவன்.” எபிரெய வாக்கியம் சுருக்கமானது; தாவீதின்மீதான அதிக பங்கு அல்லது உரிமையையே சூழல் உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “என் அரசரைத் திரும்ப அழைத்துவருவதற்கான முன்மொழிவை முதலில் வைத்தது நானல்லவா?”
    reason: alternative_reading
  - marker: d
    text: அல்லது, “இஸ்ரவேலரின் சொற்களைவிட யூதரின் சொற்கள் வலிமையாகவும் தீவிரமாகவும் இருந்தன.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל / אִישׁ יְהוּדָה
  choice: இஸ்ரவேலின் பிரதிநிதி / யூதாவின் பிரதிநிதி
  rationale: אִישׁ ஒருமையில் இருந்தாலும் ஒவ்வொரு மக்கள் குழுவின் சார்பாகப் பேசுபவரைக் குறிக்கிறது. தமிழில் வெறும் ‘மனிதன்’ என்பது பொருளை மறைக்கும் என்பதால் பிரதிநிதித்துவ ஒருமையைத் தெளிவுபடுத்துகிறது.
- source_word: עֶשֶׂר יָדוֹת לִי בַמֶּלֶךְ
  choice: அரசரில் எனக்குப் பத்துப் பங்குகள் உண்டு
  rationale: יָדוֹת என்பதன் நேர்ப்பொருள் ‘கைகள்’; இங்கு அது பங்குகள் அல்லது உரிமைப் பகுதிகள் என்னும் மரபுத்தொடர். ‘பத்துப் பங்குகள்’ வடக்கிலுள்ள பத்துக் கோத்திரங்களின் கூற்றை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְגַם בְּדָוִד אֲנִי מִמְּךָ
  choice: தாவீதின்மீதும் உன்னைவிட எனக்கு அதிக உரிமை உண்டு
  rationale: எபிரெய வாக்கியம் சுருக்கமாகவும் ஒப்பீட்டை மறைமுகமாகவும் கூறுகிறது. சூழலில் இது பொதுவான மேன்மையை அல்ல, தாவீதின்மீதான அதிக உரிமைக் கோரிக்கையைக் குறிக்கிறது.
- source_word: הֱקִלֹּתַנִי
  choice: என்னை அற்பமாக நடத்தினாய்
  rationale: קלל என்பதன் ஹிஃபில் வடிவம் ஒருவரை முக்கியமற்றவராகக் கருதி நடத்துவதைக் குறிக்கிறது. ‘அற்பமாக நடத்துதல்’ அவமதிப்பின் வலிமையை மிகைப்படுத்தாமல் தருகிறது.
- source_word: וְלֹא הָיָה דְבָרִי רִאשׁוֹן לִי לְהָשִׁיב אֶת מַלְכִּי
  choice: என் அரசரைத் திரும்ப அழைத்துவர வேண்டும் என்று முதலில் சொன்னது நானல்லவா?
  rationale: கடினமான, சுருக்கமான இந்த வாக்கியத்தில் דָבָר என்பது சொல், கருத்து அல்லது முன்மொழிவு ஆகலாம். அரசரின் திரும்புவருதலை முதலில் முன்வைத்த உரிமைக் கூற்றை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מַלְכִּי
  choice: என் அரசர்
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதி வெளிப்படையாக இருப்பதால் தனிப்பட்ட விசுவாசத்தையும் உரிமைக் கோரிக்கையையும் காக்கிறது.
- source_word: וַיִּקֶשׁ דְּבַר אִישׁ יְהוּדָה מִדְּבַר אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேலரின் பேச்சைவிட யூதரின் பேச்சு கடுமையாக இருந்தது
  rationale: קשׁה இங்கு பேச்சின் கடுமை அல்லது தீவிரத்தைக் குறிக்கிறது. இறுதிச் சுருக்கத்தில் אִישׁ கூட்டுப்பொருளில் வருவதால் தமிழில் மக்கள் குழுக்களைப் பன்மைப் பொருளில் காட்டுவது இயல்பானது.
