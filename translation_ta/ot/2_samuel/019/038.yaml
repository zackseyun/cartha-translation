  register: நவீனத் தரத் தமிழில், அரசரிடம் பேசும் பணிவும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘உமது’, ‘அடியான்’, ‘ஆண்டவர்’, ‘செய்யும்’ ஆகிய வடிவங்கள் அரண்மனை மரியாதை நடையை வெளிப்படுத்துகின்றன; தேவையற்ற பழந்தமிழ் அடர்த்தி தவிர்க்கப்பட்டுள்ளது.
