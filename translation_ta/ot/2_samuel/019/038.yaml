base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/038.yaml
  text: Please let your servant return[a], that I may die in my own city, by the grave of my father and my mother. But here is your servant Kimham; let him cross over with my lord the king[b], and do for him what is good in your eyes.
translation:
  language: ta
  text: “தயவுசெய்து உமது அடியான் திரும்பிச் செல்ல அனுமதியுங்கள்; நான் என் சொந்த ஊரில், என் தந்தை தாயின் கல்லறைக்கு அருகே[a] இறக்கட்டும். இதோ, உமது அடியான் கிம்ஹாம் இருக்கிறான். அவன் என் ஆண்டவராகிய அரசருடன் கடந்து செல்லட்டும்; உமது பார்வையில் நல்லதாக இருப்பதை அவனுக்குச் செய்யுங்கள்.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் எழுத்துப்படி, “என் தந்தையினதும் தாயினதும் கல்லறையுடன்.” குடும்ப அடக்க இடத்திற்கு அருகில் இறந்து அடக்கம் செய்யப்பட வேண்டும் என்பதே இங்கு பெரும்பாலும் கருதப்படும் பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உமக்கு நல்லதாகத் தோன்றுவதை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשָׁב נָא
  choice: திரும்பிச் செல்ல அனுமதியும்
  rationale: שׁוּב திரும்புதலைக் குறிக்கிறது; נָא-வின் பணிவான வேண்டுகோள் தொனியை அரசரிடம் பேசும் மரியாதை நடையில் ‘அனுமதியும்’ வெளிப்படுத்துகிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியான்
  rationale: அரசரிடம் பர்சிலா தன்னைத் தாழ்த்திக் குறிப்பிடும் அரண்மனை மரியாதைச் சொல்; இங்கு அடிமை நிலையை முன்னிறுத்தாமல் பணிவான சுயக்குறிப்பைத் தருகிறது.
- source_word: וְאָמֻת
  choice: நான் ... இறக்கட்டும்
  rationale: முந்திய வேண்டுகோளின் நோக்கம் அல்லது விரும்பிய விளைவாக இங்கு இறப்பது கூறப்படுகிறது; தமிழ் வேண்டுகோள் நடையில் இயல்பாக உள்ளது.
- source_word: בְּעִירִי
  choice: என் சொந்த ஊரில்
  rationale: முதல் நபர் உடைமை விகுதியையும் தாயகத்துடனான தனிப்பட்ட பிணைப்பையும் இயல்பான தமிழில் காட்டுகிறது; עִיר இச்சூழலில் ‘ஊர்’ என மொழிபெயர்ப்பது பொருத்தம்.
- source_word: עִם קֶבֶר אָבִי וְאִמִּי
  choice: என் தந்தை தாயின் கல்லறைக்கு அருகே
  rationale: עִם என்பதன் அடிப்படைப் பொருள் ‘உடன்’; ஆனால் அடக்க இடச் சூழலில் கல்லறைக்கு அருகில் இறந்து குடும்ப அடக்க இடத்தில் அடக்கம் செய்யப்பட வேண்டும் என்ற கருத்தை ‘அருகே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: அடுத்த நபரைச் சுட்டிக்காட்டி அறிமுகப்படுத்தும் presentative வலிமையைச் சுருக்கமாகவும் நேரடியாகவும் காக்கிறது.
- source_word: כִמְהָם
  choice: கிம்காம்
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: יַעֲבֹר עִם
  choice: அவன் ... ஆற்றைக் கடந்து செல்லட்டும்
  rationale: சூழலில் imperfect வேண்டுகோள் சார்ந்த jussive வலிமை பெறுகிறது. யோர்தானைக் கடக்கும் நிகழ்வை வாசகர் தெளிவாகப் புரிந்துகொள்ள ‘ஆற்றைக்’ சேர்க்கப்பட்டுள்ளது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசர்
  rationale: அரசருக்குரிய மரியாதையான அழைப்பை நவீன, கண்ணியமான தமிழில் காக்கிறது.
- source_word: וַעֲשֵׂה לוֹ
  choice: அவனுக்குச் செய்யும்
  rationale: עשה + ל அமைப்பு ஒருவருக்காகச் செய்வதைக் குறிக்கிறது; தமிழில் நேரடியாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֵת אֲשֶׁר טוֹב בְּעֵינֶיךָ
  choice: உமது பார்வைக்கு நல்லதாக இருப்பதை
  rationale: ‘உமது கண்களில் நல்லது’ என்ற எபிரெய வழக்கை தமிழில் புரியத்தக்கவாறு நெருக்கமாகக் காக்கிறது; அரசர் நல்லதென்று கருதுவதைச் செய்யலாம் என்ற பொருளையும் தக்கவைக்கிறது.
