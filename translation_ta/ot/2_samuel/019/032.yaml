base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/032.yaml
  text: And Barzillai the Gileadite had come down from Rogelim[a], and he crossed the Jordan with the king to send him off at the Jordan.
translation:
  language: ta
  text: கிலேயாத்தியனான பர்சிலாய் ரோகெலிமிலிருந்து இறங்கி வந்திருந்தான். யோர்தானில் அரசரை வழியனுப்புவதற்காக அவன் அரசருடன் யோர்தானைக் கடந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ரோகெலிமிலிருந்து இறங்கி வந்து, அரசருடன் யோர்தானைக் கடந்து அவரை வழியனுப்பினான்.” யோர்தான் ஆற்றருகே பர்சிலாய் அரசருடன் சென்றதும் அவரை வழியனுப்பியதும் எவ்வாறு தொடர்புபடுகின்றன என்பதில் எபிரேய வாசகம் சிறிது நெகிழ்வை அனுமதிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַרְזִלַּי
  choice: பர்சிலா
  rationale: எபிரேயத் தனிப்பெயரின் ஒலிப்பெயர்ப்பு; தமிழில் இயல்பாக உச்சரிக்க ஏற்ற வடிவம்.
- source_word: הַגִּלְעָדִי
  choice: கிலேயாத்தியனான
  rationale: பர்சிலா கிலேயாத் பகுதியைச் சேர்ந்தவர் என்பதைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: יָרַד
  choice: இறங்கி வந்திருந்தான்
  rationale: முந்தைய சூழலில் தொடங்கிய செயல் அடுத்த நிகழ்வுக்கு முன்பே நடந்ததை வலியுறுத்தும் இறந்தகால நிறைவு வடிவம்; ரோகெலிமிலிருந்து யோர்தானை நோக்கிய நிலப்பரப்பு இயக்கத்தையும் காக்கிறது.
- source_word: מֵרֹגְלִים
  choice: ரோகெலிமிலிருந்து
  rationale: இடப்பெயரை ஒலிப்பெயர்த்து, מִן முன்னொட்டின் பொருளை ‘இலிருந்து’ என நேரடியாக வழங்குகிறது.
- source_word: וַיַּעֲבֹר אֶת הַמֶּלֶךְ הַיַּרְדֵּן
  choice: அவன் அரசரோடு யோர்தானைக் கடந்தான்
  rationale: עבר என்பதன் அடிப்படைப் பொருளான ‘கடத்தல்’ என்பதைக் காத்து, אֶת הַמֶּלֶךְ என்பதை இச்சூழலில் அரசருடன் சென்ற உடனிகழ்ச்சியாக இயல்பான தமிழில் தருகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசர்
  rationale: தாவீதைக் குறிக்கும் பட்டத்துக்கு மரியாதையுடனும் நவீனத் தமிழிலும் இயல்பான சொல்.
- source_word: הַיַּרְדֵּן
  choice: யோர்தான்
  rationale: ஆற்றின் பெயருக்கான நிலைபெற்ற தமிழ் வேதாகம ஒலிப்பெயர்ப்பு; சூழலால் ‘ஆறு’ என்பதைச் சேர்க்கத் தேவையில்லை.
- source_word: לְשַׁלְּחוֹ
  choice: அரசரை வழியனுப்புவதற்காக
  rationale: שלח வினையின் நோக்கப் பயன்பாட்டை இயல்பாக வெளிப்படுத்துகிறது; இங்கு மரியாதையுடன் வழியனுப்புதல் அல்லது பயணத்தில் துணைசென்று அனுப்பிவைத்தல் என்ற பொருள் உள்ளது.
- source_word: אֶת בַּיַּרְדֵּן
  choice: யோர்தானில்
  rationale: சிதைந்ததாகவோ கடினமாகவோ உள்ள இறுதி எபிரேய சொற்றொடரை, வழியனுப்புதல் நிகழ்ந்த இடத்தைக் குறிக்கும் வகையில் மிகக் குறைந்த விளக்கச் சேர்க்கையுடன் தருகிறது.
