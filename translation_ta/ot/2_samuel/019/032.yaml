  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘அரசர்’ என்ற மரியாதை ஒருமைக்கு ஏற்ப சுட்டுப்பெயர் தவிர்க்கப்பட்டு பெயர்ச்சொல் மீண்டும் பயன்படுத்தப்பட்டது. மூலத்தின் சொற்றொடரமைப்பிலுள்ள தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
