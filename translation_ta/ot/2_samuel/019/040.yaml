source:
  edition: WLC
  text: וַ/יַּעֲבֹ֧ר כָּל הָ/עָ֛ם אֶת הַ/יַּרְדֵּ֖ן וְ/הַ/מֶּ֣לֶךְ עָבָ֑ר וַ/יִּשַּׁ֨ק הַ/מֶּ֤לֶךְ לְ/בַרְזִלַּי֙ וַ/יְבָ֣רֲכֵ֔/הוּ וַ/יָּ֖שָׁב לִ/מְקֹמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/040.yaml
  text: All the people crossed the Jordan[a], and the king crossed over. Then the king kissed Barzillai and blessed him, and he returned to his own place.
translation:
  language: ta
  text: மக்கள் அனைவரும் யோர்தானைக் கடந்தார்கள்; அரசனும் கடந்தான். அரசன் பர்சில்லாயை முத்தமிட்டு, அவனை ஆசீர்வதித்தான். பின்னர் அவன் தன் இடத்திற்குத் திரும்பினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவன்’ என்பது சூழலின்படி பெரும்பாலும் பர்சில்லாயைக் குறிக்கிறது; எபிரெய மூலத்தில் எழுவாயின் பெயர் வெளிப்படையாகக் கொடுக்கப்படவில்லை.
    reason: எழுவாய் குறித்த மூலமொழியின் தெளிவின்மையைப் பாதுகாத்து, சூழலில் இயல்பான குறிப்பை வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: கடந்தார்கள்
  rationale: עבר இங்கு யோர்தான் ஆற்றைக் கடப்பதைக் குறிக்கிறது; நவீன தமிழில் ‘கடந்தார்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: כָּל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: עם என்பதன் விரிவான பொருள் ‘மக்கள்’; இச்சூழலில் படைவீரர்கள் மட்டுமே என்று சுருக்காமல், அரசனுடன் இருந்த கூட்டத்தைக் குறிக்கிறது.
- source_word: אֶת הַיַּרְדֵּן
  choice: யோர்தானை
  rationale: இது யோர்தான் ஆற்றைக் குறிக்கிறது. ‘கடந்தார்கள்’ என்ற வினையுடன் ஆற்றின் பெயர் மட்டும் தமிழில் இயல்பாக உள்ளது.
- source_word: וְהַמֶּלֶךְ עָבָר
  choice: அரசனும் கடந்தான்
  rationale: எபிரெய உரையில் עבר மீண்டும் வருவதையும், அரசன் தனியாக எழுவாயாகச் சுட்டப்படுவதையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וַיִּשַּׁק
  choice: முத்தமிட்டு
  rationale: נשק இங்கு பிரியாவிடை அன்பின் அடையாளமாக முத்தமிடுவதைக் குறிக்கிறது; கூடுதல் விளக்கமின்றி நேரடிப் பொருள் தரப்பட்டுள்ளது.
- source_word: לְבַרְזִלַּי
  choice: பர்சில்லாயை
  rationale: בַרְזִלַּי என்ற எபிரெயப் பெயரின் ஒலியை நவீன தமிழில் இயன்றவரை பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: וַיְבָרֲכֵהוּ
  choice: அவனை ஆசீர்வதித்தான்
  rationale: ברך என்பதன் வெளிப்படையான ‘ஆசீர்வதி’ என்ற பொருளைப் பாதுகாக்கிறது; இதை வெறும் பிரியாவிடை வாழ்த்தாக மாற்றவில்லை.
- source_word: וַיָּשָׁב לִמְקֹמוֹ
  choice: அவன் தன் இடத்திற்குத் திரும்பினான்
  rationale: எபிரெயில் எழுவாய் பெயரால் குறிப்பிடப்படாமல் ஆண்பால் ஒருமை வினை வடிவில் உள்ளது. ‘அவன்’ மூலத்தின் குறிப்பீட்டுத் தெளிவின்மையைப் பாதுகாக்கிறது; מקום என்பதைக் ‘வீடு’ என்று மிகையாக விளக்காமல் ‘இடம்’ என வழங்குகிறது.
