source:
  edition: WLC
  text: וַ/יֻּגַּ֖ד לְ/יוֹאָ֑ב הִנֵּ֨ה הַ/מֶּ֧לֶךְ בֹּכֶ֛ה וַ/יִּתְאַבֵּ֖ל עַל אַבְשָׁלֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/002.yaml
  text: And it was reported to Joab, “Look, the king is weeping and mourning over Absalom.”
translation:
  language: ta
  text: யோவாபிடம், “இதோ, அரசர் அப்சலோமுக்காக அழுது துக்கங்கொண்டிருக்கிறார்” என்று தெரிவிக்கப்பட்டது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: தெரிவிக்கப்பட்டது
  rationale: נגד என்பதன் ஹொஃபால் வடிவம், தகவல் யோவாபுக்குத் தெரியப்படுத்தப்பட்டதைக் குறிக்கிறது. செய்பவர் குறிப்பிடப்படாத எபிரெயச் செயல்பாட்டு வடிவத்தைத் தமிழ் இயல்பாகப் பேணுகிறது.
- source_word: לְיוֹאָב
  choice: யோவாபிடம்
  rationale: לְ முன்னிடைச்சொல் தகவல் யாரிடம் தெரிவிக்கப்பட்டது என்பதைக் காட்டுகிறது; தமிழில் ‘யோவாபிடம்’ என்பது இயல்பான வடிவம்.
- source_word: הִנֵּה
  choice: இதோ
  rationale: அறிக்கையின் உள்ளடக்கத்துக்கு உடனடியாகக் கவனத்தை ஈர்க்கும் சுட்டிடைச்சொல்லின் வலிமையை ‘இதோ’ பேணுகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசர்
  rationale: சூழலில் தாவீதைக் குறித்தாலும், எபிரெய மூலம் பெயருக்குப் பதிலாகத் திட்டவட்டமான பட்டத்தைப் பயன்படுத்துவதால் அதுவே மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֹּכֶה
  choice: அழுது
  rationale: செயற்பெயரெச்சம் தொடர்ந்து நடைபெறும் அழுகையைக் குறிக்கிறது; இணைந்த தமிழ் வினைத்தொடரில் ‘அழுது ... இருக்கிறார்’ அந்த நீடித்த நிலையைக் காட்டுகிறது.
- source_word: וַיִּתְאַבֵּל
  choice: துக்கங்கொண்டிருக்கிறார்
  rationale: אבל என்பதன் ஹித்பயேல் வடிவம், இறப்பினால் அல்லது இழப்பினால் துக்கம் அனுசரிப்பதைக் குறிக்கிறது. அறிக்கையில் அரசரின் தொடரும் நிலையை இயல்பான தமிழில் வெளிப்படுத்த இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: עַל אַבְשָׁלֹם
  choice: அப்சலோமுக்காக
  rationale: துக்கப்படுதலைக் குறிக்கும் வினையுடன் עַל, துக்கத்தின் நபர் அல்லது காரணத்தைக் காட்டுகிறது; ‘அப்சலோமுக்காக’ இதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
