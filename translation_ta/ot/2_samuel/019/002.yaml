  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘அரசர்’ என்ற மரியாதைப் பன்மை வடிவத்துக்கு ஏற்ப வினைமுற்றும் ‘இருக்கிறார்’ என அமைக்கப்பட்டுள்ளது; மூலத்தின் நேரடி அறிக்கை மற்றும் உணர்ச்சித் தீவிரம் காக்கப்பட்டுள்ளன.
