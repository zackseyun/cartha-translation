source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר בַּרְזִלַּ֖י אֶל הַ/מֶּ֑לֶךְ כַּ/מָּ֗ה יְמֵי֙ שְׁנֵ֣י חַיַּ֔/י כִּי אֶעֱלֶ֥ה אֶת הַ/מֶּ֖לֶךְ יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/035.yaml
  text: Barzillai said to the king[a], “How many are the days of the years of my life, that I should go up with the king to Jerusalem?”
translation:
  language: ta
  text: பர்சிலாய் அரசனிடம், “என் வாழ்நாளின் ஆண்டுகளில் எத்தனை நாட்கள் உள்ளன, நான் அரசரோடு எருசலேமுக்குப் போவதற்கு?[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “என் வாழ்நாளின் ஆண்டுகளின் நாட்கள் எத்தனை, நான் அரசரோடு எருசலேமுக்குப் போவதற்கு?”
    reason: மூல எபிரெயத்தின் அடுக்கான, வலியுறுத்தலுள்ள சொல்லமைப்பை வாசகர் காணச் செய்வதற்கான சொற்சொல் மாற்று.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: אמר என்பதன் வழக்கமான எபிரெயக் கதைநடைப் பயன்பாட்டைத் தமிழில் இயல்பாகக் காட்டுகிறது; மேற்கோள் கேள்வியாக இருந்தாலும், மூலத்தில் ‘கேட்டான்’ என்பதற்கான தனிச் சொல் இல்லை.
- source_word: בַּרְזִלַּי
  choice: பர்சிலாய்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியை நவீனத் தமிழ் எழுத்துமுறையில் அண்மையாகப் பெயர்த்தெழுதுகிறது.
- source_word: אֶל הַמֶּלֶךְ
  choice: அரசனிடம்
  rationale: மூலத்தில் தாவீதின் பெயர் சேர்க்கப்படாமல், குறிப்பிட்ட அரசனைக் குறிக்கும் பொதுப்பெயரே உள்ளது; ‘அரசனிடம்’ என்பது உரையாடல் சூழலுக்கு இயல்பான தமிழ்.
- source_word: כַּמָּה
  choice: எத்தனை
  rationale: அளவு அல்லது எண்ணிக்கையை வினவும் எபிரெயச் சொல்லை நேரடியாகக் காட்டுகிறது; சூழலில் இது சொல்லாட்சிக்குரிய வினாவாக உள்ளது.
- source_word: יְמֵי שְׁנֵי חַיַּי
  choice: என் வாழ்நாளின் ஆண்டுகளில் இன்னும் எத்தனை நாட்கள் இருக்கின்றன
  rationale: ‘என் வாழ்வின் ஆண்டுகளுடைய நாட்கள்’ என்ற மூலத்தின் அடுக்குச் சொல்லாட்சியைப் புரியக்கூடிய தமிழாக்கமாக வழங்குகிறது. சூழலின் மீதமுள்ள வாழ்நாள் கருத்தை ‘இன்னும்’ தெளிவாக்குகிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי
  choice: போவதற்கு
  rationale: இங்கு כִּי தொடரின் நோக்கம் அல்லது விளைவுத் தொடர்பைத் தமிழ் வினையெச்ச அமைப்பில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶעֱלֶה
  choice: நான் ... போவதற்கு
  rationale: எருசலேமுக்குச் செல்லுதலை எபிரெயம் ‘ஏறுதல்’ எனக் கூறுகிறது. தமிழில் ‘போவது’ இயல்பானது; நகரத்தை நோக்கிய ஏற்றம் என்ற மூலப் படிமத்தைச் சொற்சொல்லாகத் திணிக்கவில்லை.
- source_word: אֶת הַמֶּלֶךְ
  choice: அரசரோடு
  rationale: இச்சூழலில் אֶת உடன்செல்லுதலைக் குறிக்கிறது; ‘அரசரோடு’ என்பது பர்சிலாய் அரசனுடன் செல்லுவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְרוּשָׁלִָם
  choice: எருசலேம்
  rationale: தமிழில் நிலைபெற்றுள்ள இடப்பெயர் வடிவம்.
