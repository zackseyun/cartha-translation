  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. பர்சிலாயின் முதுமையையும் கேள்வியின் சொல்லாட்சிக்குரிய தன்மையையும் ‘இன்னும் எத்தனை நாட்கள்’ என்பதால் வெளிப்படுத்தி, மூலத்தின் அசாதாரண அடுக்குச் சொல்லாட்சியை அடிக்குறிப்பில் பாதுகாத்துள்ளது.
