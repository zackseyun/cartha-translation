  source_fidelity: 'முக்கிய வாக்கியப் பொருள் நன்றாகக் காக்கப்பட்டுள்ளது: பர்சிலாய் அரசனிடம் பேசுகிறார்; இது அவரது வாழ்வின் எஞ்சிய காலத்தைப் பற்றிய சொல்லாட்சிக் கேள்வி; அவர் அரசரோடு எருசலேமுக்குச் செல்வதைச் சூழலாகக் கொண்டுள்ளார். ஆனால் ‘இன்னும்’ என்பது சூழலால் நன்கு உணர்த்தப்பட்டாலும் எபிரெயத்தில் வெளிப்படையாக இல்லாத சேர்க்கை. அதை நீக்குவது மூலத்தின் வெளிப்படையான சொல்லமைப்பையும் கேள்வியின் திறந்த சொல்லாட்சியையும் நன்றாகப் பாதுகாக்கும்.'
  naturalness: முதன்மை உரை நவீன நிலையான தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. கேள்வியின் தொடக்கத்தை ‘என் வாழ்நாளின் ஆண்டுகளில் எத்தனை நாட்கள் உள்ளன’ என அமைத்தால் எபிரெயத்தின் முன்னிறுத்தப்பட்ட வினாவும் தமிழில் தெளிவாக இருக்கும். அடிக்குறிப்பின் தற்போதைய ‘ஆண்டுகளுடைய நாட்கள்’ என்ற தொடர் இயல்பற்றது; ‘ஆண்டுகளின் நாட்கள்’ என்பது தெளிவான சொற்சொல் வடிவம்.
