  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֛י כִּי בָ֥א יְרוּשָׁלִַ֖ם לִ/קְרַ֣את הַ/מֶּ֑לֶךְ וַ/יֹּ֤אמֶר ל/וֹ֙ הַ/מֶּ֔לֶךְ לָ֛/מָּה לֹא הָלַ֥כְתָּ עִמִּ֖/י מְפִיבֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/026.yaml
  text: And when he came to Jerusalem to meet the king[a], the king said to him, “Why did you not go with me, Mephibosheth?”
translation:
  language: ta
  text: அவன் அரசனைச் சந்திக்க எருசலேமுக்கு வந்தபோது, அரசன் அவனிடம், “மேவிபோசேத்தே, நீ ஏன் என்னோடு போகவில்லை[a]?” என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தமிழில் இன்னும் இயல்பாக, “நீ ஏன் என்னோடு வரவில்லை?” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “போ” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: அப்போது
  rationale: எபிரெயக் கதைநடையின் காலமாற்றத்தைத் தமிழில் இயல்பாக வெளிப்படுத்தும் வகையில், தனியே மொழிபெயர்க்காமல் ‘சந்தித்தபோது’ என்ற காலத் தொடரில் இணைக்கப்பட்டுள்ளது.
- source_word: בָא יְרוּשָׁלַם
  choice: எருசலேமுக்கு வந்து
  rationale: בוא என்பதன் அடிப்படைப் பொருளான ‘வருதல்’ என்பதையும், இலக்கைச் சுட்டும் எருசலேமையும் தெளிவாகக் காட்டுகிறது.
- source_word: לִקְרַאת הַמֶּלֶךְ
  choice: அரசனைச் சந்தித்தபோது
  rationale: לקראת இங்கு ஒருவரை எதிர்கொண்டு சந்திப்பதைக் குறிக்கிறது; நவீனத் தமிழில் ‘சந்திக்க’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: அரசன் அவனிடம் … என்று கேட்டான்
  rationale: நேரடி உரை கேள்வியாக இருப்பதால் தமிழில் ‘கேட்டான்’ இயல்பானது; ‘அரசன்’ என்ற எபிரெய எழுவாயும் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לֹא הָלַכְתָּ עִמִּי
  choice: நீ ஏன் என்னோடு போகவில்லை
  rationale: הלך என்பதன் நேரடிப் பொருள் ‘போ’ என்பதால் அதைப் பாதுகாக்கிறது; தமிழில் சூழலுக்கு ஏற்ப ‘வரவில்லை’ என்றும் சொல்லக்கூடிய இடத்தில் மூலமொழியின் பார்வைக்கோணம் நிலைநிறுத்தப்பட்டுள்ளது.
- source_word: מְפִיבֹשֶׁת
  choice: மேவிபோசேத்
  rationale: தமிழ் வேதாகமப் பெயர்மரபில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
