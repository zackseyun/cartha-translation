  to: அவன் அரசனைச் சந்திக்க எருசலேமுக்கு வந்தபோது, அரசன் அவனிடம், “மேவிபோசேத்தே, நீ ஏன் என்னோடு போகவில்லை[a]?” என்று கேட்டான்.
