translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் ‘போ’ என்ற இயக்க வினை அடிப்படை உரையில் பாதுகாக்கப்பட்டு, தமிழ் வழக்கில் சாத்தியமான ‘வா’ என்பது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
