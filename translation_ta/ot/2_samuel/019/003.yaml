base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/003.yaml
  text: So the victory on that day was turned into mourning for all the people[a], because on that day the people heard it said[b], “The king is grieved over his son.”
translation:
  language: ta
  text: அன்றைய வெற்றி மக்கள் அனைவருக்கும் துக்கமாக மாறியது[a]. ஏனெனில், அன்று மக்கள், “அரசர் தம் மகனைக் குறித்து வருந்துகிறார்” என்று கேள்விப்பட்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அன்றைய விடுதலை மக்கள் அனைவருக்கும் துக்கமாக ஆனது.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “மக்கள், ‘...என்று’ கேட்டார்கள்”; இது ஒரு செய்தியைக் கேள்விப்படுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּשֻׁעָה
  choice: வெற்றி
  rationale: போருக்குப் பிந்தைய இந்தச் சூழலில் இச்சொல் போரில் கிடைத்த வெற்றிகரமான விடுதலையைக் குறிக்கிறது. நவீனத் தமிழில் ‘வெற்றி’ இயல்பாகவும் தெளிவாகவும் உள்ளது; மாற்றுப் பொருளான ‘விடுதலை’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַתְּהִי ... לְאֵבֶל
  choice: துக்கமாக மாறியது
  rationale: எபிரெயக் கட்டமைப்பு வெற்றி துக்கமாக ஆன தீவிரமான நிலைமாற்றத்தைக் காட்டுகிறது. ‘துக்கமாக மாறியது’ அந்தத் தலைகீழ் மாற்றத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵבֶל
  choice: துக்கம்
  rationale: இச்சொல் தனிப்பட்ட மனவேதனையை மட்டும் அல்லாமல் வெளிப்படையான, சமூகத் துயரத்தையும் குறிக்கிறது. இங்கு மக்களின் கொண்டாட்டம் துக்கமாக மாறிய சூழலுக்கு ‘துக்கம்’ பொருந்துகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: சூழலில் போர்வீரர்களும் தாவீதின் தரப்பினரும் குறிக்கப்பட்டாலும், மூலமொழி பொதுவான ‘மக்கள்’ என்ற சொல்லையே பயன்படுத்துகிறது; அதையே தமிழிலும் காக்கிறது.
- source_word: כִּי שָׁמַע ... לֵאמֹר
  choice: என்று ... மக்கள் கேள்விப்பட்டார்கள்
  rationale: ‘கேட்டார்கள், சொல்லும்படி’ என்ற சொல்லுக்குச் சொல் வடிவம் தமிழில் இயல்பற்றது. ஒரு செய்தி அவர்களுக்குக் கேள்விப்பட்டது என்ற அறிக்கைப் பொருளை இவ்வடிவம் தெளிவாகத் தருகிறது.
- source_word: נֶעֱצַב
  choice: வருந்துகிறார்
  rationale: இந்த வினை வேதனைப்படுதல் அல்லது துயருறுதல் என்ற பொருளைக் கொண்டது. ‘வருந்துகிறார்’ அரசரின் மகனைக்குறித்த ஆழ்ந்த மனவேதனையை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: עַל בְּנוֹ
  choice: தம் மகனைக்குறித்து
  rationale: עַל இங்கு துயரத்தின் காரணம் அல்லது பொருளைக் குறிக்கிறது. ‘தம் மகனைக்குறித்து’ மூலத்தின் உறவைப் பாதுகாக்கிறது; தமிழில் மரியாதை ஒருமைக்கேற்ற தற்சுட்டுப் பெயராக ‘தம்’ பயன்படுத்தப்பட்டுள்ளது.
