translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அரசர்’ என்பதுடன் மரியாதை ஒருமை வினையும் ‘தம்’ என்ற தற்சுட்டுப் பெயரும் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் மீளுரையான ‘அன்று’ இரு வாக்கியங்களிலும் காக்கப்பட்டுள்ளது.
