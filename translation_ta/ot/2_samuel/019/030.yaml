source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ הַ/מֶּ֔לֶךְ לָ֛/מָּה תְּדַבֵּ֥ר ע֖וֹד דְּבָרֶ֑י/ךָ אָמַ֕רְתִּי אַתָּ֣ה וְ/צִיבָ֔א תַּחְלְק֖וּ אֶת הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/030.yaml
  text: 'Then the king said to him[b][a], “Why do you keep speaking of your affairs? I have decided: you and Ziba shall divide the land.”'
translation:
  language: ta
  text: 'அப்போது அரசன் அவனிடம், “உன் காரியங்களைப் பற்றி இன்னும் ஏன் பேசிக்கொண்டிருக்கிறாய்? நான் தீர்மானித்துவிட்டேன்[a]: நீயும் சீபாவும் அந்த நிலத்தைப் பங்கிட்டுக்கொள்ளுங்கள்[b]” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடி மொழிபெயர்ப்பு: “நான் சொன்னேன்.”'
    reason: lexical_alternative
  - marker: b
    text: அல்லது “அந்த வயலை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... הַמֶּלֶךְ
  choice: அப்போது அரசன் ... என்றான்
  rationale: வாவ் தொடர்கதை நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையைத் தருகிறது.
- source_word: לָמָּה
  choice: ஏன்
  rationale: நேரடியான வினாவை எளிய, இயல்பான தமிழில் தருகிறது.
- source_word: תְּדַבֵּר עוֹד
  choice: இன்னும் ... பேசிக்கொண்டிருக்கிறாய்
  rationale: עוֹד உடன் வரும் வினை தொடர்ந்தோ மேலும் நிகழும் பேச்சைக் குறிக்கிறது; அரசனின் பொறுமையின்மையையும் அளவுக்கு மீறாமல் வெளிப்படுத்துகிறது.
- source_word: דְּבָרֶיךָ
  choice: உன் காரியங்களைப் பற்றி
  rationale: דבר என்பது ‘வார்த்தைகள்’ என்றும் ‘காரியங்கள்/விவகாரங்கள்’ என்றும் பொருள்படும்; இச்சூழலில் மெபிபோசேத் முன்வைக்கும் விவகாரங்களை இயல்பாகக் குறிக்கிறது.
- source_word: אָמַרְתִּי
  choice: நான் தீர்மானித்துவிட்டேன்
  rationale: சொல்லாட்சியில் ‘நான் சொன்னேன்’ என்றாலும், இங்கு அரசன் வழங்கும் உறுதியான தீர்ப்பின் செயற்பாட்டு வலிமையைத் தெளிவுபடுத்துகிறது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אַתָּה וְצִיבָא
  choice: நீயும் சீபாவும்
  rationale: முகவரியைத் தெளிவாகத் தக்கவைத்து, צִיבָא என்ற பெயரைத் தமிழில் ‘சீபா’ என ஒலிபெயர்க்கிறது.
- source_word: תַּחְלְקוּ
  choice: பங்கிட்டுக்கொள்ளுங்கள்
  rationale: இங்கு வினை அரசனின் கட்டளை அல்லது தீர்ப்பை வெளிப்படுத்துகிறது; மரியாதைப் பன்மை வடிவம் அரசனின் நேரடி ஆணையை இயல்பான தமிழில் தருகிறது.
- source_word: הַשָּׂדֶה
  choice: அந்த நிலம்
  rationale: சொல்லாட்சியில் ‘வயல்’ என்றாலும், சொத்து விவகாரச் சூழலில் நிலச்சொத்தைப் பரந்த வகையில் குறிக்கக்கூடும்; ‘அந்த நிலம்’ சூழலுக்கு இயல்பானது.
