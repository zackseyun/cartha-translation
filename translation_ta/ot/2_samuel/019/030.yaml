  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், அதேவேளை கண்ணியமான கதைநடை. எபிரேயத்தின் சொற்சார்ந்த மாற்றுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
