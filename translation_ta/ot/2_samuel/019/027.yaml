  text: And he has slandered your servant to my lord the king[a], for your servant said, ‘I will saddle the donkey for myself so that I may ride on it and go with the king,’ because your servant is lame.
translation:
  language: ta
  text: என் பணியாளன் என் ஆண்டவராகிய அரசரிடம் உமது அடியேனைப் பற்றிப் பொய்யாகக் குற்றஞ்சாட்டியிருக்கிறான்.[a] ஏனெனில், ‘நான் கழுதைக்குச் சேணம் பூட்டி, அதன்மேல் ஏறி அரசரோடு செல்வேன்’ என்று உமது அடியேன் சொல்லியிருந்தேன்; உமது அடியேன் கால் ஊனமுற்றவன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது அடியேனை ஏமாற்றியிருக்கிறான்” அல்லது “உமது அடியேனுக்குத் துரோகம் செய்திருக்கிறான்.” எபிரெய வினை ஏமாற்றுவதையோ வஞ்சகமாக நடந்துகொள்வதையோ குறிக்கலாம்; இங்கு அரசரிடம் அளிக்கப்பட்ட பொய்யான தகவலே மையமாக இருப்பதால், “பொய்யாகக் குற்றஞ்சாட்டியிருக்கிறான்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמָּנִי
  choice: உமது அடியேனைப் பற்றிப் பொய்யாகக் குற்றஞ்சாட்டியிருக்கிறான்
  rationale: இவ்வினை ஏமாற்றுதல் அல்லது வஞ்சகமாக நடத்துதல் எனவும் பொருள்படலாம். இச்சூழலில் அரசரிடம் பொய்யான தகவல் அளித்து மெபிபோசேத்தைத் தவறாகச் சித்தரித்ததே மையமாக இருப்பதால், சூழலுக்கேற்றவாறு இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: עַבְדִּי
  choice: என் வேலைக்காரன்
  rationale: தனிப்பட்ட உதவியாளனைக் குறிக்கும் அரசவைக் குடும்பச் சூழலில் இயல்பான நவீனத் தமிழ்; அடிமை நிலையை இங்கு வலியுறுத்தவில்லை.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசர்
  rationale: அரசரை மரியாதையுடன் விளிக்கும் முறையான அரசவைச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: אֶחְבְּשָׁה לִּי הַחֲמוֹר
  choice: நான் கழுதைக்குச் சேணம் பூட்டி
  rationale: முதல் நபர் வினை பேசுபவரின் நோக்கம் அல்லது தீர்மானத்தை வெளிப்படுத்துகிறது; חבש என்பது இங்கு சவாரிக்காகக் கழுதையைச் சேணமிடுவதைக் குறிக்கிறது.
- source_word: וְאֶרְכַּב עָלֶיהָ
  choice: அதன்மேல் ஏறி
  rationale: அடுத்தடுத்த நோக்கச் செயல்களை இயல்பான தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: וְאֵלֵךְ אֶת־הַמֶּלֶךְ
  choice: அரசரோடு செல்வேன்
  rationale: הלך உடன் את இங்கு இலக்கை நோக்கிச் செல்வதைவிட உடன்செல்லுதலைக் குறிக்கிறது.
- source_word: פִסֵּחַ
  choice: கால் ஊனமுற்றவன்
  rationale: உடல் இயக்கக் குறைபாட்டைத் தெளிவாகவும் இழிவற்ற நவீனத் தமிழிலும் குறிக்கிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியேன்
  rationale: அரசர்முன் தன்னைத் தாழ்த்திக் குறிப்பிடும் மரியாதைமிக்க அரசவைச் சொல்லாட்சியைப் பாதுகாக்கிறது.
