translation_notes:
  register: நவீன தரநிலைத் தமிழில் கண்ணியமான அரசவைக் குரல் பயன்படுத்தப்பட்டுள்ளது. பர்சில்லாய் அரசரிடம் மரியாதையுடன் பேசும் சூழலுக்கு ஏற்ப ‘நீர்/உமது/உமக்காக’ வடிவங்கள் வைக்கப்பட்டுள்ளன; மூலத்தில் இரண்டாம் நபர் ஒருமை என்பதும் காக்கப்படுகிறது.
