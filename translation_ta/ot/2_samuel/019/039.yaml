revisions:
- from: அப்போது அரசர், “கிம்காம் என்னோடு ஆற்றைக் கடந்து வரட்டும். உமது பார்வைக்கு நல்லதாக இருப்பதை நான் அவனுக்குச் செய்வேன். மேலும், நான் செய்ய வேண்டுமென நீர் எதைத் தேர்ந்தெடுத்தாலும், அதை உமக்காகச் செய்வேன்[a]” என்றார்.
  to: அப்போது அரசர், “கிம்ஹாம் என்னோடு கடந்து செல்லட்டும். உமது பார்வைக்கு நல்லதாக இருப்பதை நான் அவனுக்குச் செய்வேன். மேலும், நான் செய்ய வேண்டுமென நீர் எதைத் தேர்ந்தெடுத்தாலும், அதை உமக்குச் செய்வேன்[a]” என்றார்.
  rationale: The revision removes the unexpressed ‘river,’ corrects the personal-name transliteration, and renders the repeated Hebrew dative consistently as ‘உமக்குச்.’ It retains the draft's cautious handling of the elliptical ‘whatever you choose upon me’ and preserves the lexical alternative in the footnote.
