  text: וַ/יֹּ֣אמֶר הַ/מֶּ֗לֶךְ אִתִּ/י֙ יַעֲבֹ֣ר כִּמְהָ֔ם וַ/אֲנִי֙ אֶעֱשֶׂה לּ֔/וֹ אֶת הַ/טּ֖וֹב בְּ/עֵינֶ֑י/ךָ וְ/כֹ֛ל אֲשֶׁר תִּבְחַ֥ר עָלַ֖/י אֶֽעֱשֶׂה לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/039.yaml
  text: Then the king said[a], “Let Kimham cross over with me, and I will do for him what seems good in your eyes; and whatever you choose to lay on me, I will do for you.”
translation:
  language: ta
  text: அப்போது அரசர், “கிம்ஹாம் என்னோடு கடந்து செல்லட்டும். உமது பார்வைக்கு நல்லதாக இருப்பதை நான் அவனுக்குச் செய்வேன். மேலும், நான் செய்ய வேண்டுமென நீர் எதைத் தேர்ந்தெடுத்தாலும், அதை உமக்குச் செய்வேன்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் என்னிடம் எதைக் கேட்டாலும், அதை உமக்குச் செய்வேன்.” எபிரெய சொற்றொடர் சற்றுச் சுருக்கமானது; சொல்லுக்குச் சொல், “நீர் என்மேல் எதைத் தேர்ந்தெடுத்தாலும்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: அப்போது அரசர் ... என்றார்
  rationale: வாவ் தொடர் வடிவம் கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; நவீன தமிழ் கதைநடையில் ‘அப்போது’ இயல்பாக அந்த வரிசையைக் காட்டுகிறது.
- source_word: אִתִּי יַעֲבֹר כִּמְהָם
  choice: கிம்காம் என்னோடு ஆற்றைக் கடந்து வரட்டும்
  rationale: இங்குள்ள imperfect கட்டளை/விருப்பப் பொருளுடைய jussive ஆகச் செயல்படுகிறது. ‘வரட்டும்’ அரசரின் அழைப்பையும் தீர்மானத்தையும் வெளிப்படுத்துகிறது. சூழலில் யோர்தானைக் கடப்பது தெளிவாக இருப்பதால், தமிழில் இயல்புக்காக ‘ஆற்றைக்’ சேர்க்கப்பட்டுள்ளது.
- source_word: כִּמְהָם
  choice: கிம்காம்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: וַאֲנִי אֶעֱשֶׂה לוֹ
  choice: நான் அவனுக்குச் செய்வேன்
  rationale: עשה என்ற பரந்த வினையின் பொருளை நன்மை வழங்குதல் போன்ற குறிப்பிட்ட விளக்கமாகச் சுருக்காமல், மூலத்தின் பொதுத்தன்மை காக்கப்படுகிறது.
- source_word: אֶת הַטּוֹב בְּעֵינֶיךָ
  choice: உமது பார்வைக்கு நல்லதாக இருப்பதை
  rationale: ‘உமது கண்களில் நல்லது’ என்ற எபிரெய வழக்கின் மதிப்பீட்டு அர்த்தத்தையும் பார்வை உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וְכֹל אֲשֶׁר תִּבְחַר עָלַי
  choice: நான் செய்ய வேண்டுமென நீர் எதைத் தேர்ந்தெடுத்தாலும்
  rationale: எபிரெய சொற்றொடர் சுருக்கமானதும் ஓரளவு தெளிவற்றதும் ஆகும்; עָלַי என்பதிலுள்ள பொறுப்பைத் தன்மேல் ஏற்றுக்கொள்ளும் கருத்தை தமிழில் புரியும்படி வெளிப்படுத்துகிறது.
- source_word: אֶעֱשֶׂה לָּךְ
  choice: அதை உமக்காகச் செய்வேன்
  rationale: இறுதி வாக்குறுதியின் தனிப்பட்ட நோக்கை காக்கிறது; தமிழில் முழுமையான வாக்கியமாக இருக்க ‘அதை’ இயல்பாக வழங்கப்பட்டுள்ளது.
