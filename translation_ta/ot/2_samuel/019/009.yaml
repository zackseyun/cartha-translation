base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/009.yaml
  text: Then the king arose and sat in the gate[a]. And they told all the people, saying, “Look, the king is sitting in the gate.” Then all the people came before the king. But Israel had fled[b], each man to his tent.
translation:
  language: ta
  text: அப்போது ராஜா எழுந்து வாயிலில் அமர்ந்தார். “இதோ, ராஜா வாயிலில் அமர்ந்திருக்கிறார்” என்று மக்கள் அனைவருக்கும் அறிவிக்கப்பட்டது. அப்போது மக்கள் அனைவரும் ராஜாவின் முன்னிலையில் வந்தார்கள். ஆனால்[b] இஸ்ரவேலரோ அவரவர் கூடாரத்திற்குத்[a] தப்பியோடியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவரவர் கூடாரத்திற்கு” என்பது தத்தம் குடியிருப்பிடத்திற்கோ குலப்பகுதிக்கோ கலைந்து செல்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “இஸ்ரவேல் அவரவர் கூடாரத்திற்குத் தப்பியோடியது.” எபிரெய இணைப்புச்சொல்லை எளிய தொடரிணைப்பாகவும் புரிந்துகொள்ளலாம்; சூழலிலுள்ள வேறுபாட்டைத் தெளிவாக்க முதன்மை உரையில் “ஆனால்” பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם הַמֶּלֶךְ
  choice: அப்போது ராஜா எழுந்து
  rationale: קום என்பதன் Qal wayyiqtol அடுத்தடுத்த நிகழ்வைக் குறிக்கிறது. ‘அப்போது’ கதைத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது; ‘எழுந்து’ மூலத்தின் செயலை நேரடியாகக் காக்கிறது.
- source_word: וַיֵּשֶׁב בַּשָּׁעַר
  choice: வாயிலில் அமர்ந்தார்
  rationale: ישב இங்கு பொது இடத்தில் அமர்வதைக் குறிக்கிறது. בַּשָּׁעַר என்பதிலுள்ள இடப்பொருளை ‘வாயிலில்’ நேரடியாகக் காக்கிறது; ‘நகர’ என்று மூலத்தில் இல்லாத சொல்லைச் சேர்க்கவில்லை.
- source_word: הִגִּידוּ לֵאמֹר
  choice: என்று ... அறிவிக்கப்பட்டது
  rationale: נגד என்பதன் Hiphil வடிவம் ‘அறிவி/தெரிவி’ என்று பொருள்படும். செய்பவர் குறிப்பிடப்படாத எபிரெயப் பன்மையைத் தமிழில் இயல்பான செயப்பாட்டு வடிவில் கொடுக்கிறது; மேற்கோள் அமைப்பு ‘என்று’ என்பதால் காக்கப்படுகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சுட்டிடைச்சொல்லின் நேரடியான, இயல்பான நவீனத் தமிழ் இணை.
- source_word: יוֹשֵׁב
  choice: அமர்ந்திருக்கிறார்
  rationale: நிகழ்காலத்தில் தொடரும், கண்கூடாகத் தெரியும் நிலையை எபிரெயப் பெயரெச்ச வடிவம் காட்டுகிறது; ‘அமர்ந்திருக்கிறார்’ அந்தத் தொடர்நிலையை வெளிப்படுத்துகிறது.
- source_word: וַיָּבֹא כָל הָעָם לִפְנֵי הַמֶּלֶךְ
  choice: அப்போது மக்கள் அனைவரும் ராஜாவின் முன்னிலையில் வந்தார்கள்
  rationale: בוא + לפני என்பதன் ‘ஒருவரின் முன்னிலைக்கு வருதல்’ என்ற பொருளைத் தக்கவைத்து, பொது மக்கள் ராஜாவிடம் கூடிவந்த காட்சியை மிகைப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: וְיִשְׂרָאֵל נָס
  choice: ஆனால் இஸ்ரவேலரோ ... தப்பியோடியிருந்தார்கள்
  rationale: qatal வடிவம் உடனடி நிகழ்வுக்கு முன்பே நடந்த பின்னணி நிலையைச் சுட்டுவதால் ‘தப்பியோடியிருந்தார்கள்’ எனக் கொடுக்கப்பட்டுள்ளது. וְ என்பதன் சூழல்சார் எதிர்மறைத் தொடர்பை ‘ஆனால்’ மற்றும் ‘-ரோ’ வெளிப்படுத்துகின்றன.
- source_word: אִישׁ לְאֹהָלָיו
  choice: அவரவர் கூடாரத்திற்கு
  rationale: விநியோகப் பொருளுள்ள אִישׁ என்பதை இயல்பான தமிழ் ‘அவரவர்’ எனக் கொடுக்கிறது; ‘கூடாரம்’ என்ற எபிரெய உருவகத்தை ‘வீடு’ என்று சமப்படுத்தாமல் காக்கிறது.
theological_decisions:
- issue: אִישׁ என்ற ஆண்பால் விநியோகச் சொற்றொடர்
  choice: அவரவர்
  alternative: ஒவ்வொரு ஆணும்
  rationale: இங்கு אִישׁ என்பது ஒவ்வொருவரும் தத்தம் இடத்திற்குச் சிதறிச் சென்றதைச் சொல்லும் மரபுத்தொடரின் ஒரு பகுதி. தமிழ் ‘அவரவர்’ அதன் விநியோகப் பொருளை இயல்பாகக் காக்கிறது; சூழலில் நிரூபிக்க முடியாத வகையில் ஆண்களுக்கு மட்டும் பொருளைக் குறுக்கவில்லை.
- issue: וְיִשְׂרָאֵל נָס என்பதிலுள்ள தொடர்பும் காலப் பின்னணியும்
  choice: ஆனால் இஸ்ரவேலரோ ... தப்பியோடியிருந்தார்கள்
  alternative: இஸ்ரவேல் ... தப்பியோடியது
  rationale: முந்தைய நிகழ்வோடு உள்ள எதிர்மறை வேறுபாட்டையும், ஏற்கெனவே நிகழ்ந்த ஓட்டத்தையும் முதன்மை வாசிப்பு வெளிப்படுத்துகிறது. எனினும் וְ என்பதை எளிய ‘மற்றும்/அப்போது’ தொடர்பாகவும் வாசிக்கலாம் என்பதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. ராஜாவைக் குறிக்க மரியாதைப் பன்மை வினைமுற்றும், மக்களைச் சுட்ட இயல்பான பன்மை வினைமுற்றும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் இல்லாத ‘நகர’ போன்ற விளக்கச் சொற்கள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
