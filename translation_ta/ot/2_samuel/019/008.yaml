review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the two imperatives, the conditional oath warning, the totality of abandonment ('not even one man'), and the comparison with all adversity from David's youth to the present. The rendering of the divine name as “யாவே” accords with the stated project decision. However, “பணியாளர்களின் இதயத்தோடு பேசு” does not naturally express the Hebrew idiom in Tamil and can suggest speaking together with their hearts rather than addressing or reassuring them.
  naturalness: The overall register is clear, modern, and suitably direct. “யாவேமேல் ஆணையிட்டுச் சொல்கிறேன்” is less idiomatic than “யாவே பேரில் ஆணையிட்டுச் சொல்கிறேன்.” Rendering the Hebrew idiom in the text as “கனிவாகப் பேசு,” while documenting its literal wording in the note, is both natural Tamil and faithful to its contextual force.
  terminology: “யாவே,” “பணியாளர்கள்,” and “துன்பங்கள்” appropriately fit the royal-historical context. “இன்னும் மோசமாக இருக்கும்” gives the comparative force naturally without implying moral evil.
  issues:
  - severity: medium
    issue: The phrase “உன் பணியாளர்களின் இதயத்தோடு பேசு” is not idiomatic Tamil for the Hebrew expression וְדַבֵּר עַל־לֵב.
    rationale: In Tamil, இதயத்தோடு can mean ‘with the heart’ and does not clearly convey speaking reassuringly or persuasively to people. The Hebrew idiom should be rendered according to its communicative force, with the literal expression retained in a footnote.
  - severity: low
    issue: “யாவேமேல் ஆணையிட்டுச் சொல்கிறேன்” is awkward collocation.
    rationale: Tamil normally expresses an oath in a name as “யாவே பேரில் ஆணையிட்டுச் சொல்கிறேன்.”
