base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/008.yaml
  text: Now get up[a], go out, and speak to the heart of your servants, for I swear by Yahweh that if you do not go out, not a man will stay with you tonight, and this will be worse for you than all the trouble that has come upon you from your youth until now.
translation:
  language: ta
  text: இப்போது எழுந்து வெளியே போய், உன் பணியாளர்களிடம் கனிவாகப் பேசு[a]. நீ வெளியே போகாவிட்டால், இன்றிரவு ஒருவன்கூட உன்னோடு தங்கமாட்டான் என்று யாவே பேரில் ஆணையிட்டுச் சொல்கிறேன். உன் இளமை முதல் இன்றுவரை உனக்கு நேரிட்ட எல்லாத் துன்பங்களையும் விட, இது உனக்கு இன்னும் மோசமாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “உன் பணியாளர்களின் இதயத்தோடு பேசு.” இது அவர்களிடம் கனிவாகவும், மனதைத் தேற்றும் விதமாகவும், அல்லது இணங்க வைக்கும் விதமாகவும் பேசுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: அவசரமான உரைமாற்றத்தை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: קוּם צֵא
  choice: எழுந்து வெளியே போய்
  rationale: இரு எபிரெய கட்டளைகளையும் தொடர்ச்சியான தமிழ் கட்டளை வடிவில் காக்கிறது.
- source_word: וְדַבֵּר עַל־לֵב
  choice: இதயத்தோடு பேசு
  rationale: சொல்லியத்தை வெளிப்படையாகக் காக்கிறது; கனிவாக, ஊக்கமூட்டும் விதமாக அல்லது மனதைத் தேற்றும் விதமாகப் பேசுதல் என்ற அதன் சூழல்சார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עֲבָדֶיךָ
  choice: உன் பணியாளர்கள்
  rationale: அரசவை மற்றும் அரசியல் சூழலில் அரசனுக்குச் சேவை செய்பவர்களை இயல்பாகக் குறிக்கிறது; அடிமை நிலையைத் தேவையின்றி வலியுறுத்தவில்லை.
- source_word: כִּי בַיהוָה נִשְׁבַּעְתִּי
  choice: யாவேமேல் ஆணையிட்டுச் சொல்கிறேன்
  rationale: தெய்வீகப் பெயரைக் கொண்டு செய்யப்படும் உறுதியான ஆணையின் நேரடி பேச்சு வலிமையைத் தமிழில் வழங்குகிறது.
- source_word: אֵינְךָ יוֹצֵא אִם
  choice: நீ வெளியே போகாவிட்டால்
  rationale: எபிரெய எதிர்மறை நிபந்தனையைத் தெளிவான தமிழ் நிபந்தனைத் தொடராக வழங்குகிறது.
- source_word: יָלִין אִישׁ אִתְּךָ הַלַּיְלָה
  choice: இன்றிரவு ஒருவன்கூட உன்னோடு தங்கமாட்டான்
  rationale: לין என்பதன் இரவு தங்குதல் அல்லது தொடர்ந்து இருத்தல் என்ற பொருளையும், אישׁ ஒருமையின் முழுமையான கைவிடப்படுதல் என்ற வலியுறுத்தலையும் காக்கிறது.
- source_word: וְרָעָה לְךָ זֹאת מִכָּל־הָרָעָה
  choice: எல்லாத் துன்பங்களையும்விட இது உனக்கு மிக மோசமானதாக இருக்கும்
  rationale: מן ஒப்பீட்டுக் கட்டமைப்பையும், רעה என்பதன் இச்சூழலிலான பேரிடர் அல்லது துன்பம் சார்ந்த பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִנְּעֻרֶיךָ עַד עָתָּה
  choice: உன் இளமைமுதல் இன்றுவரை
  rationale: தாவீதின் இளமையிலிருந்து தற்போதைய நெருக்கடிவரை உள்ள முழுக் காலவெளியைக் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பெயராகவே வெளிப்படுத்துகிறது; பொதுப்பட்டமாக மாற்றவில்லை.
- issue: רעה என்பதன் ஒழுக்க அல்லது பேரிடர் சார்ந்த பொருள்
  choice: துன்பம் / மிக மோசமானது
  alternative: தீமை
  rationale: இங்கு தாவீதுக்கு நேர்ந்த வரலாற்றுத் துயரங்களும் எதிர்வரும் பாதிப்பும் குறிக்கப்படுகின்றன; ஒழுக்கத் தீமை என்று தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; அரசவைக் சூழலுக்கேற்ற கண்ணியமான நேரடிப் பேச்சு. மூலத்தின் கடுமையான எச்சரிக்கையும் இரு தொடர்ச்சிக் கட்டளைகளும் காக்கப்பட்டுள்ளன. ‘இதயத்தோடு பேசு’ என்ற சற்று அந்நியமாகத் தோன்றக்கூடிய உருவகம் மூலத் தெளிவுக்காக வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
