source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶל הַ/מֶּ֗לֶךְ אַל יַחֲשָׁב לִ֣/י אֲדֹנִ/י֮ עָוֺן֒ וְ/אַל תִּזְכֹּ֗ר אֵ֚ת אֲשֶׁ֣ר הֶעֱוָ֣ה עַבְדְּ/ךָ֔ בַּ/יּ֕וֹם אֲשֶׁר יָׄצָ֥ׄאׄ אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ מִ/ירֽוּשָׁלִָ֑ם לָ/שׂ֥וּם הַ/מֶּ֖לֶךְ אֶל לִבּֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/020.yaml
  text: And he said to the king[a], “Do not let my lord count me guilty, and do not remember how your servant did wrong on the day my lord the king went out from Jerusalem[b], so that the king should take it to heart.”
translation:
  language: ta
  text: அவன் அரசரிடம், “என் ஆண்டவர் என்னைக் குற்றவாளியாகக் கருத வேண்டாம்[a]. என் ஆண்டவராகிய அரசர் எருசலேமிலிருந்து புறப்பட்ட நாளில் உமது அடியான் தவறாக நடந்துகொண்டதை நினைவில் வைத்துக்கொள்ள வேண்டாம்; அரசர் அதைத் தம் மனதில் கொள்ளாதபடிக்கு[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “எனக்குக் குற்றத்தை எண்ண வேண்டாம்.” இது ஒருவர்மீது குற்றத்தை அல்லது குற்றப்பொறுப்பைக் கணக்கிடுவதைக் குறிக்கும் நீதிமன்றச் சாயலுடைய மொழித்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அரசர் அதைத் தம் இதயத்தில் வைப்பதற்கு.” இந்த மரபுத்தொடர் ஒன்றை முக்கியமாக எடுத்துக்கொள்வதையோ, ஒருவருக்கு எதிராக மனதில் வைத்திருப்பதையோ குறிக்கலாம். இங்கு இறுதித் தொடர் முந்தைய வேண்டுகோளின் நோக்கம் அல்லது விளைவைக் குறிக்கிறது.
    reason: ambiguity
lexical_decisions:
- source_word: יַחֲשָׁב לִי עָוֺן
  choice: என்மீது குற்றம் சுமத்த
  rationale: எபிரெய மொழித்தொடர் ஒருவருக்கு எதிராகக் குற்றத்தை கணக்கிடுதல் அல்லது சுமத்துதல் என்ற நீதிமன்றச் சாயலைக் கொண்டது. ‘என்மீது குற்றம் சுமத்த’ என்பது அந்தப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: תִּזְכֹּר
  choice: நினைவில் வைத்துக்கொள்ள
  rationale: இங்கு வெறுமனே நினைவுகூர்வதைவிட, செய்த தவறை மறக்காமல் வைத்திருந்து அதன்படி நடவடிக்கை எடுக்கும் உட்பொருள் உள்ளது; எனினும் மூலத்தின் வெளிப்படையான சொல்லை மீறாமல் இந்தத் தேர்வு அதைத் தக்கவைக்கிறது.
- source_word: הֶעֱוָה
  choice: செய்த தவறு
  rationale: இந்த வினை வடிவம் தவறாக அல்லது முறைகேடாக நடந்துகொண்டதைக் குறிக்கிறது. ‘செய்த தவறு’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: עַבְדְּךָ
  choice: உமது அடியான்
  rationale: அரசரிடம் தன்னைத் தாழ்த்திப் பேசும் அரண்மனைச் சூழலுக்கு ‘உமது அடியான்’ பொருத்தமான மரியாதைமிக்க தமிழாக்கம்.
- source_word: יָצָא ... מִירוּשָׁלָם
  choice: எருசலேமிலிருந்து புறப்பட்ட
  rationale: தாவீது நகரைவிட்டு வெளியேறிய நிகழ்வை மூலத்திற்கு நெருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לָשׂוּם ... אֶל לִבּוֹ
  choice: தம் மனதில் வைத்துக்கொள்ள
  rationale: ‘இதயத்தில் வைப்பது’ என்ற எபிரெய மரபுத்தொடர் ஒன்றை முக்கியமாகக் கருதுதல் அல்லது மனத்தில் வைத்திருந்து தனக்கு எதிராக எடுத்துக்கொள்ளுதல் என்பதைக் குறிக்கிறது.
- source_word: אֲדֹנִי
  choice: என் ஆண்டவர்
  rationale: இது கடவுளுக்கான பெயர் அல்ல; அரசருக்குக் கூறப்படும் மரியாதைமிக்க அழைப்பு. முதல் நபர் உடைமையையும் பணிவான தொனியையும் காக்கிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசர்
  rationale: மூலத்தில் மீண்டும் மீண்டும் வரும் அரச பதவிப்பெயரைத் தக்கவைத்து, தமிழ் மரியாதைப் பன்மையுடன் வழங்குகிறது.
theological_decisions:
- issue: இறுதி לָשׂוּם הַמֶּלֶךְ אֶל לִבּוֹ தொடருக்கும் முந்தைய மறுப்புக் கட்டளைக்கும் உள்ள தொடர்பு
  choice: “அரசர் அதைத் தம் மனதில் வைத்துக்கொள்ளவும் வேண்டாம்” என்று முந்தைய אַל எனும் மறுப்பின் தொடர்ச்சியாக மொழிபெயர்க்கப்பட்டது.
  alternative: “அரசர் அதைத் தம் மனதில் வைத்துக்கொள்ளும்படி” அல்லது “அரசர் அதை மனதில் கொள்வதற்காக” என்று நோக்கத் தொடராக வாசிக்கலாம்.
  rationale: சூழலில் சிமேயி அரசர் தன் குற்றத்தை மனதில் கொள்ளாதிருக்க வேண்டுகிறான். அதேவேளை எபிரெய இறுதித் தொடரின் இலக்கணச் சுருக்கத்தால் தோன்றும் வேறு இணைப்பை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிட்டுள்ளோம்; இதனால் உண்மையான தெளிவின்மை மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக்குரிய பணிவும் மரியாதையும் காக்கப்பட்டுள்ளன. ‘உமது அடியான்,’ ‘என் ஆண்டவர்,’ ‘அரசர்’ ஆகிய வடிவங்கள் கண்ணியமான உரையாடல் நடையைத் தருகின்றன; தேவையற்ற பழமொழிநடை தவிர்க்கப்பட்டுள்ளது.
