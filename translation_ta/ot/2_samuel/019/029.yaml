  source_fidelity: மூல எபிரெயத்தின் வலியுறுத்தப்பட்ட வரம்பு, அரசருக்கு முன்பான மரணப் பொறுப்பு, அரசரின் பந்தியில் சேர்க்கப்பட்ட அருள், மேலும் அரசரிடம் இனி முறையிடுவதற்கான நியாயமான உரிமை இல்லை என்ற கருத்து ஆகியவை நம்பகமாகத் தரப்பட்டுள்ளன. “மரணத்திற்குரியவர்களாகவே” என்பது אַנְשֵׁי מָוֶת என்பதன் சூழல்சார் பொருளைச் சரியாக வெளிப்படுத்துகிறது.
