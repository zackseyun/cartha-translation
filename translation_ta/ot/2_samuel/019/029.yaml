  terminology: “ஆண்டவராகிய அரசர்” அரசருக்குரிய மரியாதையைத் தக்கவைக்கிறது; “அடியேன்” என்பது சொத்தடிமைத்தனத்தை வலியுறுத்தாமல் அரண்மனைத் தாழ்மையான சுயக்குறிப்பாகச் சரியாகச் செயல்படுகிறது. צְדָקָה-வுக்கு “உரிமை” என்பதைத் தேர்ந்தெடுத்ததும் அதற்கான விளக்கக் குறிப்பும் துல்லியமானவை.
