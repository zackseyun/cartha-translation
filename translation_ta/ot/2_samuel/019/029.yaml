  text: כִּי֩ לֹ֨א הָיָ֜ה כָּל בֵּ֣ית אָבִ֗/י כִּ֤י אִם אַנְשֵׁי מָ֨וֶת֙ לַ/אדֹנִ֣/י הַ/מֶּ֔לֶךְ וַ/תָּ֨שֶׁת֙ אֶֽת עַבְדְּ/ךָ֔ בְּ/אֹכְלֵ֖י שֻׁלְחָנֶ֑/ךָ וּ/מַה יֶּשׁ לִ֥/י עוֹד֙ צְדָקָ֔ה וְ/לִ/זְעֹ֥ק ע֖וֹד אֶל הַ/מֶּֽלֶךְ־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/029.yaml
  text: For all my father's house were nothing but men deserving death before my lord the king[a], yet you set your servant among those who eat at your table. So what further right do I have[b], that I should cry out any more to the king?
translation:
  language: ta
  text: என் தந்தையின் குடும்பத்தார் அனைவரும் என் ஆண்டவராகிய அரசருக்கு முன்பாக மரணத்திற்குரியவர்களாகவே இருந்தார்கள்[a]. ஆனாலும், உமது அடியேனை உமது பந்தியில் உண்பவர்களோடு அமரச் செய்தீர். ஆகவே, அரசரிடம் இன்னும் முறையிட எனக்கு என்ன உரிமை இருக்கிறது[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “மரணத்தின் மனிதர்கள்”; அதாவது, மரணதண்டனைக்கு உட்படத்தக்கவர்கள் அல்லது மரணத்திற்குத் தகுதியானவர்கள்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “உரிமை” என்பது எபிரெய மொழியின் செதாக்கா என்ற சொல்லை மொழிபெயர்க்கிறது. இச்சூழலில் அது முதன்மையாகத் தனிப்பட்ட ஒழுக்கநீதியை அல்ல, நியாயமான கோரிக்கை அல்லது உரிமையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי לֹא הָיָה ... כִּי אִם
  choice: '... அனைவரும் ... ஆகவே இருந்தார்கள்'
  rationale: 'வலியுறுத்தப்பட்ட வரம்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது: குடும்பத்தார் வேறெதுவுமல்ல, மரணத்திற்குரியவர்களாகவே இருந்தனர்.'
- source_word: כָּל בֵּית אָבִי
  choice: என் தந்தையின் குடும்பத்தார் அனைவரும்
  rationale: எபிரெயக் குடும்பம்/வீட்டார் என்ற உறவுமுறைச் சொல்லை நவீன தமிழில் தெளிவாகக் கொடுக்கிறது.
- source_word: אַנְשֵׁי מָוֶת
  choice: மரணத்திற்குரியவர்கள்
  rationale: ஏற்கெனவே இறந்தவர்கள் என்பதல்ல; மரணதண்டனைக்கு உட்படத்தக்கவர்கள் அல்லது மரணத்திற்குத் தகுதியானவர்கள் என்ற சூழல்சார் பொருளைக் காட்டுகிறது.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசருக்கு முன்பாக
  rationale: அரசரின் பார்வையிலும் தீர்ப்பிலும் அவர்களுடைய நிலையைச் சுட்டும் ל உறவைப் பாதுகாக்கிறது.
- source_word: וַתָּשֶׁת
  choice: ஆனாலும் ... அமரச் செய்தீர்
  rationale: வினைச்சொல்லின் வைக்குதல்/இடமளித்தல் பொருளையும் முந்தைய கூற்றுடனான தெளிவான முரண்பாட்டையும் இயல்பான தமிழில் தருகிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியேனை
  rationale: அரசரிடம் பேசும் அரண்மனைத் தாழ்மையான சுயகுறிப்பை dignified Tamil-இல் இயல்பாக வெளிப்படுத்துகிறது; இங்கு சொத்து அடிமை என்ற பொருள் முன்னிலையல்ல.
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: உமது பந்தியில் உண்பவர்களோடு
  rationale: அரசரின் உணவைப் பகிரும் சிறப்புரிமை பெற்ற சார்பாளர்கள் அல்லது விருந்தினர்களோடு சேர்க்கப்பட்ட சமூகப் படிமத்தைப் பாதுகாக்கிறது.
- source_word: וּמַה יֶּשׁ לִי עוֹד צְדָקָה
  choice: எனக்கு என்ன உரிமை இருக்கிறது
  rationale: צְדָקָה இங்கு தனிப்பட்ட ஒழுக்கநீதியை முதன்மையாகக் குறிக்காமல், நியாயமான கோரிக்கை அல்லது உரிமையைச் சுட்டுகிறது.
- source_word: וְלִזְעֹק עוֹד אֶל הַמֶּלֶךְ
  choice: அரசரிடம் இன்னும் முறையிட
  rationale: זעק என்பதன் வேண்டுகோள் அல்லது குறையீட்டுடன் கூடிய கூக்குரலை இச்சூழலில் இயல்பான தமிழில் ‘முறையிட’ என வெளிப்படுத்துகிறது.
