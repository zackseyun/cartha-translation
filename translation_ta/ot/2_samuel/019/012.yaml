base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/012.yaml
  text: And King David sent to Zadok and to Abiathar the priests[a], saying, “Speak to the elders of Judah, saying, ‘Why should you be the last to bring the king back to his house, when the word of all Israel has come to the king, to his house?’”
translation:
  language: ta
  text: 'அரசர் தாவீது சாதோக்கும் அபியத்தார் ஆகிய ஆசாரியர்களுக்கும் அனுப்பி, “யூதாவின் மூப்பர்களிடம் சொல்லுங்கள்: ‘அரசரை அவருடைய இல்லத்திற்குத் திரும்பக் கொண்டுவருவதில் நீங்கள் ஏன் கடைசியானவர்களாக இருக்க வேண்டும்? இஸ்ரவேலர் அனைவரின் செய்தி அரசரிடம், அவருடைய இல்லத்திற்கே வந்துவிட்டதே![a]’” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர் அனைவரின் முன்மொழிவு/செய்தி அரசரிடம், அவருடைய இல்லத்திற்கே வந்துவிட்டதே!” எபிரெயில் “இஸ்ரவேலர் அனைவரின் சொல்” என உள்ளது; அது அறிக்கை, முன்மொழிவு, அல்லது அரசரைத் திரும்பக் கொண்டுவரும் வேண்டுகோளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח אֶל
  choice: …ிடம் ஆளனுப்பி
  rationale: பெயரிடப்பட்ட நபர்களிடம் செய்தி அனுப்பியதைக் குறிக்கும் எபிரெய அமைப்பை இயல்பான தமிழில் தருகிறது; அவர்களை வரவழைத்தார் என்று பொருள்கொள்ளவில்லை.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: தாவீது அரசர்
  rationale: அரச பதவியையும் பெயரையும் நவீனத் தமிழின் இயல்பான வரிசையில் தக்கவைக்கிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: சாதோக், அபியத்தார் ஆகியோரின் சமயப் பதவியைக் குறிக்கும் வழக்கமான வேதாகமத் தமிழ் சொல்.
- source_word: דַּבְּרוּ אֶל
  choice: …ிடம் சொல்லுங்கள்
  rationale: நேரடியாகப் பேசுமாறு கொடுக்கப்பட்ட கட்டளையைத் தெளிவான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: זִקְנֵי יְהוּדָה
  choice: யூதாவின் மூப்பர்கள்
  rationale: இங்கு சமூக-அரசியல் தலைவர்களைக் குறிக்கும் மூலமொழிக் கட்டமைப்பைத் தக்கவைக்கிறது.
- source_word: לָמָּה תִהְיוּ אַחֲרֹנִים
  choice: நீங்கள் ஏன் கடைசியானவர்களாக இருக்க வேண்டும்?
  rationale: எதிர்காலத்தை மட்டும் கூறாமல், கேள்வியிலுள்ள கண்டனமும் தூண்டுதலும் வெளிப்படுகிறது.
- source_word: לְהָשִׁיב אֶת הַמֶּלֶךְ
  choice: அரசரைத் திரும்ப அழைத்துவருவதில்
  rationale: שׁוב என்பதன் காரணவினைப் பொருளான ‘திரும்பக் கொண்டுவருதல்’ என்பதைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: אֶל בֵּיתוֹ
  choice: தமது இல்லத்திற்கு
  rationale: ‘வீடு/இல்லம்’ என்ற அடிப்படைப் பொருளைத் தக்கவைத்து, ‘அரண்மனை’ என்று தேவையின்றிக் குறுக்கவில்லை; ‘தமது’ என்பது அரசரையே சுட்டுகிறது.
- source_word: וּדְבַר כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரின் செய்தி
  rationale: דָּבָר என்பதன் பரந்த பொருளை முற்றிலும் ‘திட்டம்’ அல்லது ‘வேண்டுகோள்’ என்று தீர்மானிக்காமல், இச்சூழலில் புரியக்கூடிய ‘செய்தி’ என வழங்குகிறது.
- source_word: בָּא אֶל הַמֶּלֶךְ
  choice: அரசரிடம் … வந்துவிட்டதே
  rationale: செய்தி ஏற்கெனவே வந்தடைந்த நிலையை எபிரெய நிறைவுவினைக்கும் உரையிலுள்ள வலியுறுத்தலுக்கும் ஏற்றபடி காட்டுகிறது.
- source_word: אֶל בֵּיתוֹ
  choice: அவரது இல்லத்திற்கு
  rationale: மூலத்தில் மீண்டும் வரும் சொற்றொடரைத் தக்கவைக்கிறது; இலக்கைச் சுட்டும் எபிரெய முன்னிடைச்சொல்லின் வடிவத்தையும் பாதுகாக்கிறது.
