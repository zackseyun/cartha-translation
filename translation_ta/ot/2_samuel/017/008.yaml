- from: 'ஊசாய் சொன்னார்: “உங்கள் தகப்பனையும் அவருடைய ஆட்களையும் நீங்கள் அறிவீர்கள். அவர்கள் வலிமைமிக்கவர்கள்; திறந்தவெளியில் தன் குட்டிகளை இழந்த பெண் கரடியைப்போல் உள்ளம் கசந்தவர்கள்[a]. மேலும், உங்கள் தகப்பன் போரில் தேர்ந்தவர்; அவர் படையினரோடு இரவு தங்கமாட்டார்[b].”'
  to: 'ஊசாய் சொன்னார்: “உங்கள் தந்தையையும் அவருடைய ஆட்களையும் நீங்கள் அறிவீர்கள். அவர்கள் வலிமைமிக்கவர்களும், திறந்தவெளியில் தன் குட்டிகளை இழந்த பெண் கரடியைப்போல் உள்ளத்தில் கசப்பு கொண்டவர்களும் ஆவர்[a]. மேலும், உங்கள் தந்தை போர்வீரர்; அவர் படையினரோடு இரவு தங்கமாட்டார்[b].”'
