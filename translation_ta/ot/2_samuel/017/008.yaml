translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உருவகமான ‘உள்ளம் கசந்தவர்கள்’ முதன்மை உரையில் காக்கப்பட்டு, சூழல்சார் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. மரியாதைப் பன்மை வழியாக அப்சலோமுக்கான நேரடி உரை இயல்பாக்கப்பட்டுள்ளது.
