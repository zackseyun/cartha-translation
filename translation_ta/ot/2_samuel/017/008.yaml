review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the principal clauses, the bereaved-bear simile, David's military character, and the statement that he will not lodge overnight with the force. However, “உள்ளம் கசந்தவர்கள்” normally suggests people who are saddened, tender-hearted, or emotionally affected; it does not adequately convey the hostile bitterness/fierceness of מָרֵי נֶפֶשׁ in this military warning.
  naturalness: The Tamil is generally clear and suitably dignified. Replacing the ambiguous “உள்ளம் கசந்தவர்கள்” with “உள்ளத்தில் கசப்பு கொண்டவர்கள்” better preserves the Hebrew idiom without introducing the misleading Tamil sense of grief or softening. “தந்தை” and “போர்வீரர்” are natural modern-standard equivalents.
  terminology: “ஊசாய்,” “வலிமைமிக்கவர்கள்,” “படையினரோடு இரவு தங்கமாட்டார்,” and the footnote explaining “மக்கள்” as the fighting force are appropriate. “போர்வீரர்” directly and naturally represents איש מלחמה.
  issues:
  - severity: medium
    issue: “உள்ளம் கசந்தவர்கள்” is semantically misleading for מָרֵי נֶפֶשׁ.
    rationale: In modern Tamil this expression commonly denotes sorrow, compassion, or a heart affected by distress. The Hebrew idiom denotes bitter, fierce, or enraged disposition. “உள்ளத்தில் கசப்பு கொண்டவர்கள்” retains the literal imagery and is supported by alternatives in the footnote.
