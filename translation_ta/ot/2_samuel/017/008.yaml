base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/008.yaml
  text: Hushai said[a], “You know your father and his men, that they are mighty men and bitter of soul, like a bear robbed of her cubs in the field. And your father is a man of war[b]; he will not spend the night with the troops.”
translation:
  language: ta
  text: 'ஊசாய் சொன்னார்: “உங்கள் தந்தையையும் அவருடைய ஆட்களையும் நீங்கள் அறிவீர்கள். அவர்கள் வலிமைமிக்கவர்களும், திறந்தவெளியில் தன் குட்டிகளை இழந்த பெண் கரடியைப்போல் உள்ளத்தில் கசப்பு கொண்டவர்களும் ஆவர்[a]. மேலும், உங்கள் தந்தை போர்வீரர்; அவர் படையினரோடு இரவு தங்கமாட்டார்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடுஞ்சினம் கொண்டவர்கள்” அல்லது “ஆவேசமடைந்தவர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர் மக்களோடு இரவு தங்கமாட்டார்.” இங்கு “மக்கள்” என்பது தாவீதுடன் இருந்த போர்ப்படையினரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִבֹּרִים
  choice: வலிமைமிக்கவர்கள்
  rationale: வலிமை, வீரம் ஆகிய இரண்டையும் குறிக்கக்கூடிய சொல்லை, உடனுள்ள இராணுவச் சூழலை அளவுக்கு மீறி விரிவாக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: מָרֵי נֶפֶשׁ
  choice: உள்ளம் கசந்தவர்கள்
  rationale: எபிரெயச் சொற்றொடரின் ‘மனத்தில் கசப்பு கொண்டவர்கள்’ என்ற உருவகத்தையும், அதில் உள்ள ஆவேசத்தையும் பாதுகாக்கிறது; ‘கடுஞ்சினம் கொண்டவர்கள்’ என்பது சூழலுக்கேற்ற மாற்றுப் பொருள்.
- source_word: כְּדֹב שַׁכּוּל
  choice: தன் குட்டிகளை இழந்த பெண் கரடியைப்போல்
  rationale: குட்டிகளைப் பறிகொடுத்த கரடியின் அபாயகரமான சீற்றத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; எபிரெயில் உருவகத்தில் உள்ள பெண்பாலையும் வெளிப்படையாக்குகிறது.
- source_word: בַּשָּׂדֶה
  choice: திறந்தவெளியில்
  rationale: இங்கு வயல்வெளி என்ற குறுகிய பொருளைவிட திறந்த நாட்டுப்புறப் பகுதியைக் குறிக்கும் இடச்சொல்லை இயல்பான தமிழில் தருகிறது.
- source_word: אִישׁ מִלְחָמָה
  choice: போரில் தேர்ந்தவர்
  rationale: தாவீது போரனுபவமும் போர்த்திறனும் உடையவர் என்ற எபிரெய மரபுத்தொடரின் கருத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: לֹא יָלִין אֶת־הָעָם
  choice: அவர் படையினரோடு இரவு தங்கமாட்டார்
  rationale: לין என்பதன் ‘இரவு தங்குதல்’ என்ற பொருளைப் பாதுகாக்கிறது; இச்சூழலில் עָם என்பது பொதுவான மக்களைக் காட்டிலும் தாவீதுடன் இருந்த போர்ப்படையினரைக் குறிக்கிறது.
- source_word: יָדַעְתָּ
  choice: நீங்கள் அறிவீர்கள்
  rationale: அப்சலோமிடம் நேரடியாகக் கூறப்படும் வினையை மரியாதையான, இயல்பான தமிழில் தருகிறது.
- source_word: אֲנָשָׁיו
  choice: அவருடைய ஆட்கள்
  rationale: சொல்லின் பொதுவான ‘அவருடைய ஆண்கள்/ஆட்கள்’ என்ற பொருளைப் பாதுகாத்து, அவர்கள் அனைவரையும் குறிப்பாகப் படைவீரர்கள் என அளவுக்கு மீறி வரையறுக்காமல் விடுகிறது.
