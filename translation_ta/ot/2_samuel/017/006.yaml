translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் கண்ணியமான கதைநடைப் பாணியிலும் மொழிபெயர்க்கப்பட்டது. பேச்சில் உள்ள ஆலோசனைத் தொனியும் ‘நீயே’ என்ற வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
