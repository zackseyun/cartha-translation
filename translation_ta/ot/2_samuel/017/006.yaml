base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/006.yaml
  text: When Hushai came to Absalom[a], Absalom said to him, “Ahithophel has spoken in this way. Should we do as he says? If not, you speak.”
translation:
  language: ta
  text: ஊசாய் அப்சலோமிடம் வந்தபோது, அப்சலோம் அவனிடம், “அகித்தோப்பேல் இப்படிச் சொல்லியிருக்கிறான். அவன் சொன்னபடி நாம் செய்யலாமா?[a] இல்லையென்றால், நீயே சொல்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய வார்த்தையின்படி நாம் செய்யலாமா?” எபிரெய மொழியில் இதன் நேரடியான வடிவம், “அவனுடைய வார்த்தையை நாம் செய்வோமா?” என்பதாகும்; அதாவது, அகித்தோப்பேலின் ஆலோசனையைச் செயல்படுத்துவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்தபோது
  rationale: கதைத் தொடரில் அப்சலோமிடம் ஊசாய் வந்ததை இயல்பான தமிழில் இணைப்பதற்காக இறந்தகாலத் தொடர்பு வினையாக மொழிபெயர்க்கப்பட்டது.
- source_word: חוּשַׁי
  choice: ஊசாய்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பை நவீனத் தமிழ் எழுத்துமுறையில் வழங்குகிறது.
- source_word: אֶל־אַבְשָׁלוֹם
  choice: அப்சலோமிடம்
  rationale: ஒரு நபரை நோக்கிய வருகையைக் குறிக்கும் אֶל என்பதற்கு இயல்பான தமிழ் வடிவம்.
- source_word: וַיֹּאמֶר ... לֵאמֹר
  choice: அவனிடம் ... என்றான்
  rationale: எபிரெய மொழியின் இரட்டை பேச்சு அறிமுக அமைப்பைத் தமிழில் தேவையின்றி மீளுரைக்காமல் இயல்பாக வழங்குகிறது.
- source_word: כַּדָּבָר הַזֶּה דִּבֶּר
  choice: இப்படிச் சொல்லியிருக்கிறான்
  rationale: அகித்தோப்பேல் சற்றுமுன் கூறிய ஆலோசனையின் விதத்தையும், அது இப்போது பரிசீலனையில் இருப்பதையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הֲנַעֲשֶׂה אֶת־דְּבָרוֹ
  choice: அவன் சொன்னபடி நாம் செய்யலாமா?
  rationale: முடிவை ஆலோசிக்கும் வினாவின் தன்மையைப் பாதுகாத்து, ‘அவனுடைய வார்த்தையைச் செய்வது’ என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אִם־אַיִן
  choice: இல்லையென்றால்
  rationale: முந்தைய கேள்விக்கான எதிர்மறை மாற்றுவழியைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: אַתָּה דַבֵּר
  choice: நீயே சொல்
  rationale: தனியே வந்துள்ள אַתָּה என்ற சுட்டுப்பெயரின் வலியுறுத்தலை ‘நீயே’ பாதுகாக்கிறது; கட்டளை வினையை ‘சொல்’ நேரடியாக வழங்குகிறது.
