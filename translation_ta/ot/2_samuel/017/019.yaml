  register: நவீன தரமான தமிழில், எளிதில் புரியக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மறைப்பின் பொருள் அல்லது வடிவம் குறிப்பிடப்படவில்லை; இறுதி வாக்கியத்தின் எபிரெயச் செயப்பாட்டு நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
