base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/019.yaml
  text: Then the woman took a covering and spread it over the mouth of the well[a], and scattered crushed grain on it[b], and the matter was not known.
translation:
  language: ta
  text: அப்போது அந்தப் பெண் ஒரு மறைப்பை எடுத்து, கிணற்றின் வாய்மேல் விரித்து, அதன்மேல் இடித்த தானியத்தைப் பரப்பினாள்[a]. எதுவும் தெரியவரவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இடித்த தானியம்’ என்பதற்கு ‘நசுக்கிய தானியம்’ அல்லது ‘இடிக்கப்பட்ட தானியப் பொருள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லர்த்தமாக, ‘ஒரு காரியமும் அறியப்படவில்லை.’
    reason: literal_rendering
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: אִשָּׁה என்பது ‘பெண்’ அல்லது ‘மனைவி’ எனப் பொருள்படலாம். சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட வீட்டுப் பெண்ணையே சுட்டுவதால், உறவுமுறையை ஊகிக்காத ‘அந்தப் பெண்’ இயல்பான தேர்வு.
- source_word: הַמָּסָךְ
  choice: ஒரு மறைப்பு
  rationale: מָסָךְ என்பது மூடுவதற்கான விரிப்பு, திரை அல்லது மறைப்பைக் குறிக்கும். அது எந்தப் பொருளால் செய்யப்பட்டதென்று மூல உரை கூறாததால், ‘மறைப்பு’ அந்தப் பொதுவான பொருளைப் பாதுகாக்கிறது.
- source_word: עַל פְּנֵי הַבְּאֵר
  choice: கிணற்றின் வாய்மேல்
  rationale: சொல்லர்த்தத்தில் ‘கிணற்றின் முகப்பு/மேற்பரப்பின்மேல்’ என்றாலும், இங்கு மூடப்படுவது அதன் திறப்பாதலால் ‘கிணற்றின் வாய்மேல்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וַתִּשְׁטַח
  choice: பரப்பினாள்
  rationale: שׁטח என்பதன் அடிப்படைப் பொருள் பரப்புதல். தானியத்தை மறைப்பின்மேல் பரப்பிய செயலைத் தமிழில் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הָרִפוֹת
  choice: இடித்த தானியம்
  rationale: רִפוֹת என்பது இடிக்கப்பட்ட அல்லது நசுக்கப்பட்ட தானியப் பொருளைக் குறிக்கும். ‘இடித்த தானியம்’ நவீன வாசகருக்குப் புரியும்படியும் வேளாண் விவரத்தைப் பாதுகாக்கும்படியும் உள்ளது.
- source_word: וְלֹא נוֹדַע דָּבָר
  choice: நடந்தது எதுவும் தெரியவரவில்லை
  rationale: சொல்லர்த்தமாக ‘ஒரு காரியமும் அறியப்படவில்லை’ என்ற செயப்பாட்டு அமைப்பு. சூழலுக்கு ஏற்ற இயல்பான தமிழில் மறைவு கண்டுபிடிக்கப்படவில்லை என்பதைச் சொல்கிறது; ஆனால் காரணவிளைவைக் கூடுதலாகச் சேர்ப்பதில்லை.
