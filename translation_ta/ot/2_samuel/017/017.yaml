base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/017.yaml
  text: Jonathan and Ahimaaz were standing at En-rogel[a], and a female servant would go and tell them, and they would go and tell King David[b], for they could not be seen entering the city.
translation:
  language: ta
  text: 'யோனத்தானும் அகிமாசும் என்-ரோகேலில் தங்கியிருந்தார்கள்[a]. ஒரு பணிப்பெண்[b] போய் அவர்களுக்குச் செய்தியைத் தெரிவிப்பாள்; பிறகு அவர்கள் போய் தாவீது அரசனுக்குத் தெரிவிப்பார்கள். அவர்கள் நகரத்திற்குள் வரும்போது காணப்பட முடியாததால் இவ்வாறு செய்தார்கள்.


    [a] எபிரெயச் சொல் நேரடியாக “நின்றுகொண்டிருந்தார்கள்” என்று பொருள்படும்; இச்சூழலில் அவர்கள் அங்கே நிலைகொண்டிருந்ததை அல்லது தங்கியிருந்ததை அது குறிக்கலாம்.


    [b] எபிரெய மூலத்தில் பெண்பால் பணியாளரைக் குறிக்கும் குறிப்பிட்ட சொல் பயன்படுத்தப்பட்டுள்ளது; இதை “வேலைக்காரப் பெண்” என்றும் மொழிபெயர்க்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் நேரடியாக “நின்றுகொண்டிருந்தார்கள்” என்று பொருள்படும்; இச்சூழலில் அவர்கள் அங்கே நிலைகொண்டிருந்ததை அல்லது தங்கியிருந்ததை அது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மூலத்தில் பெண்பால் பணியாளரைக் குறிக்கும் குறிப்பிட்ட சொல் பயன்படுத்தப்பட்டுள்ளது; இதை “வேலைக்காரப் பெண்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמְדִים
  choice: தங்கியிருந்தார்கள்
  rationale: עמד என்பதன் பங்கேற்புவினை வடிவம் நேரடியாக ‘நின்றுகொண்டிருந்தார்கள்’ எனினும், ஓர் இடத்துடன் வரும் இக்கதைச்சூழலில் அங்கே நிலைகொண்டு அல்லது தங்கி இருந்த தொடர்நிலையை உணர்த்துகிறது. இயல்பான தமிழுக்காக ‘தங்கியிருந்தார்கள்’ பயன்படுத்தப்பட்டு, நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: בְּעֵין רֹגֵל
  choice: என்-ரோகேலில்
  rationale: இது ஓர் இடப்பெயர்; பெயர் ஒலிபெயர்க்கப்பட்டு, בְּ என்னும் இடப்பொருள் தமிழின் ‘-இல்’ உருபால் காட்டப்பட்டது.
- source_word: הַשִּׁפְחָה
  choice: ஒரு பணிப்பெண்
  rationale: שִׁפְחָה பெண்பால் பணியாளர் அல்லது அடிமைப் பெண்ணைக் குறிக்கிறது. இங்கு அவளுடைய செய்தித் தொடர்புப் பணியே முன்னிலைப்படுவதால், தற்போதைய தமிழில் தெளிவான ‘பணிப்பெண்’ தேர்ந்தெடுக்கப்பட்டது. எபிரெய வரையறைச் சுட்டு அறியப்பட்ட ஒருவரைக் குறிக்கக்கூடியதாயினும், தமிழ்க் கதைநடையில் இங்கு ‘ஒரு’ இயல்பாக உள்ளது.
- source_word: וְהָלְכָה וְהִגִּידָה לָהֶם
  choice: போய் அவர்களுக்குச் செய்தியைத் தெரிவிப்பாள்
  rationale: பங்கேற்புவினையோடு தொடரும் நிறைவுவினை வடிவங்கள் இங்கு ஒருமுறை நடந்த நிகழ்வை மட்டும் அல்லாமல் ஏற்பாடு செய்யப்பட்ட அல்லது வழக்கமான தகவல் பரிமாற்ற முறையைச் சுட்டுகின்றன. அதனால் தமிழில் எதிர்கால வழக்குநிலை பயன்படுத்தப்பட்டது.
- source_word: וְהֵם יֵלְכוּ וְהִגִּידוּ
  choice: பிறகு அவர்கள் போய் ... தெரிவிப்பார்கள்
  rationale: அடுத்த கட்டமாக அவர்கள் செய்தியை எடுத்துச் செல்லும் தொடர்ச்சியான நடைமுறையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַמֶּלֶךְ דָּוִד
  choice: தாவீது அரசனுக்கு
  rationale: தலைப்பும் பெயரும் தமிழில் இயல்பாக இணைக்கப்பட்டுள்ளன; לַ என்னும் திசை/பெறுநர் பொருள் ‘-க்கு’ உருபால் காட்டப்படுகிறது.
- source_word: לְהֵרָאוֹת לָבוֹא הָעִירָה
  choice: அவர்கள் நகரத்திற்குள் வருவதை யாரும் பார்த்துவிடக் கூடாது
  rationale: ראה என்பதன் நிபால் வடிவம் ‘காணப்படுதல்’ என்றும், עִירָה நகரை நோக்கிய இயக்கம் என்றும் பொருள்படும். தமிழில் செயப்பாட்டு அமைப்பின் செயற்கைத்தன்மையைத் தவிர்த்து, கண்டுபிடிக்கப்படக் கூடாத சூழ்நிலையை இயல்பாக வெளிப்படுத்துகிறது.
