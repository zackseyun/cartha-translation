translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், கதைநடைக்கேற்ற மரியாதையான மற்றும் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. தகவல் சென்றடையும் தொடர்ச்சியான ஏற்பாடு தமிழின் வழக்குநிலை எதிர்கால வினைகளால் காட்டப்பட்டுள்ளது. எபிரெய மூலத்தின் செயப்பாட்டு வடிவம் இறுதி வாக்கியத்தில் இயல்பான தமிழுக்காக செய்பாட்டு அமைப்பில் தரப்பட்டுள்ளது; கண்டுபிடிக்கப்படுவதற்கான அபாயம் தீர்மானமாக நீக்கப்படவில்லை.
