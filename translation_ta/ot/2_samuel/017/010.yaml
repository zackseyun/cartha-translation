  edition: WLC
  text: וְ/ה֣וּא גַם בֶּן חַ֗יִל אֲשֶׁ֥ר לִבּ֛/וֹ כְּ/לֵ֥ב הָ/אַרְיֵ֖ה הִמֵּ֣ס יִמָּ֑ס כִּֽי יֹדֵ֤עַ כָּל יִשְׂרָאֵל֙ כִּי גִבּ֣וֹר אָבִ֔י/ךָ וּ/בְנֵי חַ֖יִל אֲשֶׁ֥ר אִתּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/010.yaml
  text: Even the valiant man whose heart is like a lion’s heart will utterly melt[a], for all Israel knows that your father is a mighty man[b], and that the men with him are valiant men.
translation:
  language: ta
  text: சிங்கத்தின் இதயத்தைப் போன்ற இதயமுள்ள துணிவுமிக்கவன்கூட[b] முற்றிலும் உருகிப்போவான்[a]. ஏனெனில், உன் தந்தை வலிமைமிக்க வீரர் என்றும், அவரோடு இருப்பவர்கள் துணிவுமிக்கவர்கள்[b] என்றும் இஸ்ரவேலர் அனைவரும் அறிவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “உருகி உருகிப்போவான்”; இது முற்றிலும் மனந்தளர்ந்துபோவதை வலியுறுத்தும் சொற்கட்டமைப்பு.
    reason: lexical_alternative
  - marker: b
    text: “துணிவுமிக்கவன்/துணிவுமிக்கவர்கள்” என்பதற்கான எபிரெயச் சொற்றொடர்களை “வீரமிக்கவன்/வீரமிக்கவர்கள்” அல்லது “வலிமைமிக்கவன்/வலிமைமிக்கவர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן חַיִל / בְנֵי חַיִל
  choice: துணிவுமிக்கவன் / துணிவுமிக்கவர்கள்
  rationale: ‘வலிமை/வீரம் கொண்டவன்’ என்ற எபிரெயச் சொற்றொடர் போர்ச் சூழலில் தைரியமும் போர்த்திறனும் உடையவரைக் குறிக்கிறது. ஒருமை–பன்மை வேறுபாட்டையும் இரு இடங்களிலுள்ள சொல் தொடர்பையும் இந்தத் தேர்வு காக்கிறது.
- source_word: לִבּוֹ כְּלֵב הָאַרְיֵה
  choice: சிங்கத்தின் இதயத்தைப் போன்ற இதயம் கொண்ட
  rationale: மூலத்தின் சிங்க இதய உவமையைச் சுருக்காமல் காக்கும் அதே நேரத்தில், நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: הִמֵּס יִמָּס
  choice: முற்றிலும் உருகிப்போவான்
  rationale: ஒரே வேர்ச்சொல்லை வலியுறுத்தித் திரும்பக் கூறும் எபிரெயக் கட்டமைப்பின் தீவிரத்தையும், துணிவு கரைந்துபோகும் உருவகத்தையும் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: יֹדֵעַ כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும் அறிவார்கள்
  rationale: பொதுவாக நிலைபெற்றுள்ள அறிவைத் தெரிவிக்கும் மூலக் கட்டமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: גִבּוֹר
  choice: வலிமைமிக்க வீரர்
  rationale: தாவீதின் ஆற்றலையும் போர்வீரர் என்ற நிலையையும் வெளிப்படுத்தும் பெயர்ச்சொல் தன்மையைப் பேணுகிறது.
- source_word: אֲשֶׁר אִתּוֹ
  choice: அவரோடு இருப்பவர்கள்
  rationale: தாவீதுடன் இருக்கும் ஆட்களைத் தெளிவாகவும் சுருக்கமாகவும் குறிக்கிறது.
