translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. மூலத்தின் சிங்க இதய உவமையும் ‘உருகுதல்’ உருவகமும் காக்கப்பட்டுள்ளன; போர்த் திறனைக் குறிக்கும் தொடர்புடைய חַיִל சொற்றொடர்கள் ஒரே தமிழ்ச் சொல்லமைப்பால் இணைக்கப்பட்டுள்ளன.
