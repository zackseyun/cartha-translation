base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/003.yaml
  text: and I will bring back all the people to you[a], as when all return, the man whom you seek will be gone; all the people will be at peace.
translation:
  language: ta
  text: “நான் மக்கள் அனைவரையும் உம்மிடம் திரும்பிவரச் செய்வேன். அனைவரும் திரும்பிவருவது நீர் தேடுகிற அந்த மனிதனைப் பொறுத்ததாகும்.[a] மக்கள் அனைவரும் சமாதானமாக இருப்பார்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வாசகம் இங்கு கடினமானது. சொல்லுக்குச் சொல், “எல்லாரும் திரும்பிவருவது—நீர் தேடுகிற அந்த மனிதன்” என்று உள்ளது. தேடப்படும் அந்த ஒரே மனிதனுடன் அனைவரும் திரும்பிவருவது தொடர்புடையது என்பதே பொருள்; அந்த மனிதன் அகற்றப்பட்டால் மற்ற அனைவரும் திரும்பிவருவார்கள் என்பது சூழலில் தோன்றும் விளக்கம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה
  choice: நான் … திரும்பிவரச் செய்வேன்
  rationale: שׁוב என்பதன் ஹிஃபீல் வடிவம் பிறரைத் திரும்பச் செய்வதைக் குறிக்கிறது; ஆகவே வெறும் ‘திரும்புவேன்’ என்பதற்குப் பதிலாக காரணவினை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: כָל הָעָם
  choice: மக்கள் அனைவரையும் / மக்கள் அனைவரும்
  rationale: עָם என்பதன் பொதுவான பொருளான ‘மக்கள்’ என்பதையே தக்கவைத்து, சூழலை மீறி ‘படை’ என்று குறிப்பாக்கவில்லை.
- source_word: אֵלֶיךָ
  choice: உம்மிடம்
  rationale: திசையைக் குறிக்கும் எளிய முன்னிடைச்சொல்லின் பொருளை இயல்பான, மரியாதையான நவீனத் தமிழில் தருகிறது.
- source_word: כְּשׁוּב הַכֹּל
  choice: எல்லாரும் திரும்பிவரும்போது
  rationale: எபிரெயச் சொற்றொடர் இலக்கண ரீதியாகக் கடினமும் சுருக்கமானதும் ஆகும். அனைவரும் திரும்பிவருவது என்ற அடிப்படைக் கருத்தைத் தெளிவாக வைத்திருக்கிறது; அதன் நிச்சயமான தொடர்பை அடிக்குறிப்பில் திறந்துவைக்கிறது.
- source_word: הָאִישׁ אֲשֶׁר אַתָּה מְבַקֵּשׁ
  choice: நீர் தேடுகிற அந்த மனிதன்
  rationale: தாவீதைத் தனிப்பட்ட இலக்காகக் குறிக்கும் ஒருமை ‘மனிதன்’ என்பதையும் சார்புத்தொடரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: יִהְיֶה שָׁלוֹם
  choice: சமாதானமாக இருப்பார்கள்
  rationale: שָׁלוֹם இங்கு மோதல் முடிந்த பின் மக்களுக்கு உண்டாகும் சமாதானம் மற்றும் நல்வாழ்வு நிலையைக் குறிக்கிறது; தமிழில் இயல்பான பன்மை இணக்கத்துடன் மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: தேடப்படும் ஒரே மனிதனுக்கும் மற்ற மக்கள் திரும்புவதற்கும் உள்ள தொடர்பு
  choice: ‘அந்த மனிதன் மட்டும் இருக்கமாட்டான்’ என்று சூழலில் உட்கிடக்கும் கருத்தை அளித்து, மூலத்தின் சிரமத்தை அடிக்குறிப்பில் தெரிவித்தல்
  alternative: ‘அனைவரும் திரும்புவது, நீர் தேடுகிற மனிதனைப் பொறுத்தது’ என்று மொழிபெயர்த்தல்
  rationale: சூழலில் அகித்தோப்பேல் தாவீதை மட்டும் கொன்று மற்ற அனைவரையும் அப்சலோமிடம் திருப்பிக் கொண்டுவருவதாகக் கூறுகிறான். இருப்பினும் எபிரெய இலக்கணம் தெளிவில்லாததால், மொழிபெயர்ப்பு அதை மறைக்காமல் அடிக்குறிப்பில் பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்றுக் கதையாடலுக்கு ஏற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. அப்சலோமிடம் பேசுவதால் ‘நீர்/உம்மிடம்’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டது; மூலத்தில் இல்லாத படைச்சார் குறிப்பாக்கம் தவிர்க்கப்பட்டது.
