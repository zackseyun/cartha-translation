base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/014.yaml
  text: Then Absalom and all the men of Israel said[a], “The counsel of Hushai the Archite is better than the counsel of Ahithophel.” For Yahweh had ordained to frustrate the good counsel of Ahithophel[b], so that Yahweh might bring disaster on Absalom.
translation:
  language: ta
  text: அப்போது அப்சலோமும் இஸ்ரவேலின் ஆண்கள் அனைவரும், “அகித்தோப்பேலின் ஆலோசனையைவிட அர்கியனான ஊசாயின் ஆலோசனை சிறந்தது” என்றார்கள். ஏனெனில், அகித்தோப்பேலின் நல்ல ஆலோசனையை முறியடிக்க யாவே தீர்மானித்திருந்தார்[a]; அப்சலோமுக்குக் கேடு[b] வரும்படியாகவே அவர் அப்படிச் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கட்டளையிட்டிருந்தார்.” எபிரேய வினை பொதுவாக “கட்டளையிடு” என்று பொருள்படும்; இங்கு அகித்தோப்பேலின் ஆலோசனை தோல்வியடைய வேண்டும் என்ற யாவேயின் செயல்திறனுள்ள தீர்மானத்தை விவரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “கேடு” என்பதற்கான எபிரேயச் சொல் “தீங்கு,” “தீமை,” அல்லது “பேரழிவு” என்றும் பொருள்படலாம்; இங்கு அப்சலோமுக்கு வரவிருந்த துன்பம் அல்லது வீழ்ச்சியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்கள்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுத்துச் செல்கிறது. எழுவாய் கூட்டாக இருப்பதால் தமிழில் இயல்பாகப் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஆண்கள் அனைவரும்
  rationale: אִישׁ ஒருமை வடிவில் இருந்தாலும் இங்கு கூட்டுப்பொருள் தருகிறது; எபிரேயத்தின் பாலினக் குறிப்பையும் காக்கிறது.
- source_word: טוֹבָה ... מֵעֲצַת
  choice: ஆலோசனையைவிட ... ஆலோசனை சிறந்தது
  rationale: מִן உடனான טוֹבָה ஒப்பீட்டுப் பொருள் தருவதால் ‘சிறந்தது’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עֲצַת
  choice: ஆலோசனை
  rationale: அரசவையில் வழங்கப்படும் அறிவுரையையும் அதனுள் அடங்கிய செயல்திட்டத்தையும் இயல்பான தமிழில் குறிக்கிறது.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: அர்கியனான ஊசாய்
  rationale: பெயரும் இன/குல அடையாளமும் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: צִוָּה
  choice: தீர்மானித்திருந்தார்
  rationale: வினை பொதுவாக ‘கட்டளையிடு’ என்று பொருள்பட்டாலும், இங்கு ஆலோசனை தோல்வியடையும்படி யாவேயின் செயல்திறனுள்ள தீர்மானத்தைக் குறிக்கிறது. நேரடியான சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לְהָפֵר
  choice: முறியடிக்க
  rationale: ஹிஃபில் வடிவம் ஆலோசனையைச் செயலற்றதாக்குதல் அல்லது தோற்கடித்தல் என்ற சூழல்சார் பொருளைத் தருகிறது.
- source_word: הַטּוֹבָה
  choice: நல்ல
  rationale: அகித்தோப்பேலின் ஆலோசனை நடைமுறையில் நல்லதாக அல்லது பயனுள்ளதாக இருந்தது என்ற மூலத்தின் மதிப்பீட்டைத் திறந்த நிலையில் காக்கிறது.
- source_word: לְבַעֲבוּר הָבִיא
  choice: வரச் செய்வதற்காக
  rationale: நோக்கம் அல்லது விளைவை அறிமுகப்படுத்தும் எபிரேய அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָרָעָה
  choice: அழிவு
  rationale: இங்கு அப்சலோமின்மேல் வரும் கேடு அல்லது பேரழிவைக் குறிக்கிறது; சொல்லின் விரிவான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: צִוָּה לְהָפֵר என்பதில் இறைச்செயலை விவரித்தல்
  choice: முறியடிக்க யாவே தீர்மானித்திருந்தார்
  alternative: முறியடிக்க யாவே கட்டளையிட்டிருந்தார்
  rationale: இறையாட்சியால் ஆலோசனை தோல்வியுறுவது என்ற கருத்தைக் காக்கிறது; அதேவேளை ‘கட்டளையிட்டார்’ என்ற நேரடி சொற்பொருளையும் அடிக்குறிப்பில் வெளிப்படையாக வைத்துள்ளது.
- issue: הָרָעָה என்ற சொல்லை இறைச்செயலுடன் தொடர்புபடுத்துதல்
  choice: அழிவு
  alternative: தீங்கு / தீமை / பேரழிவு
  rationale: சூழலில் அப்சலோமுக்கு நேரும் தீர்ப்புசார் கேடு குறிக்கப்படுகிறது. எபிரேயச் சொல்லின் நெறித்தீமை–பேரிடர் சார்ந்த பொருள் பரப்பை அடிக்குறிப்பு மறைக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசவைச் சூழலுக்கு ஏற்ற ‘ஆலோசனை’ தொடர்ந்து பயன்படுத்தப்பட்டு, மூலத்தின் இறையாட்சிசார் பதற்றமும் சொற்பொருள் மாற்றுவாய்ப்புகளும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
