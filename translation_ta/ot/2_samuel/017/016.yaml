  text: וְ/עַתָּ֡ה שִׁלְח֣וּ מְהֵרָה֩ וְ/הַגִּ֨ידוּ לְ/דָוִ֜ד לֵ/אמֹ֗ר אַל תָּ֤לֶן הַ/לַּ֨יְלָה֙ בְּ/עַֽרְב֣וֹת הַ/מִּדְבָּ֔ר וְ/גַ֖ם עָב֣וֹר תַּעֲב֑וֹר פֶּ֚ן יְבֻלַּ֣ע לַ/מֶּ֔לֶךְ וּ/לְ/כָל הָ/עָ֖ם אֲשֶׁ֥ר אִתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/016.yaml
  text: Now send quickly and tell David[a], saying, ‘Do not stay tonight at the fords of the wilderness, but be sure to cross over, lest the king and all the people who are with him be swallowed up.’
translation:
  language: ta
  text: இப்போது, விரைவாக ஆட்களை அனுப்பி தாவீதிடம், “இன்றிரவு வனாந்தரச் சமவெளிகளில்[a] தங்காதீர்; அதோடு, கட்டாயம் கடந்துபோய்விடுங்கள். இல்லாவிட்டால், அரசரும் அவரோடு இருக்கும் எல்லா மக்களும் விழுங்கப்பட்டுவிடுவார்கள்” என்று சொல்லுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வனாந்தரத்தின் கடவுத்துறைகளில்.” எபிரெயச் சொற்றொடர் வனாந்தரத் தாழ்நிலங்களையோ சமவெளிகளையோ குறிக்கலாம். ஆயினும், உடனடிச் சூழலில் கடந்துபோகும்படி கட்டளையிடப்படுவதால், சிலர் இதைக் கடக்கும் இடங்கள் அல்லது கடவுத்துறைகள் எனப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகவே, இப்போது
  rationale: இச்சொற்றொடர் முந்தைய ஆலோசனையிலிருந்து உடனடியாக மேற்கொள்ள வேண்டிய நடவடிக்கைக்கு மாறுகிறது; ‘ஆகவே, இப்போது’ என்பது தொடர்பையும் அவசரத்தையும் வெளிப்படுத்துகிறது.
- source_word: שִׁלְחוּ מְהֵרָה
  choice: விரைவாக ஆள் அனுப்பி
  rationale: பன்மை ஏவலும் அவசரத்தைக் குறிக்கும் சொல்லும் இயல்பான நவீனத் தமிழில் இவ்வாறு தரப்பட்டுள்ளன; அனுப்பப்படுவது செய்தியாளர் என்பது சூழலால் தெளிவாகிறது.
- source_word: וְהַגִּידוּ לְדָוִד לֵאמֹר
  choice: தாவீதிடம் ... என்று சொல்லுங்கள்
  rationale: எபிரெயத் தூதுச்செய்தி அறிமுகச் சூத்திரத்தைத் தமிழின் இயல்பான மேற்கோள் அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: אַל תָּלֶן הַלַּיְלָה
  choice: இன்றிரவு ... தங்காதீர்
  rationale: לון என்பது இரவைக் கழிக்கத் தங்குவதைக் குறிக்கிறது. தாவீதிடம் சொல்லப்படும் ஒருமை ஏவலை மரியாதையான தமிழில் ‘தங்காதீர்’ என வழங்குகிறது.
- source_word: בְּעַרְבוֹת הַמִּדְבָּר
  choice: வனாந்தரச் சமவெளிகளில்
  rationale: ערבות என்பதன் நேரடியான பொருள் தாழ்நிலங்கள் அல்லது சமவெளிகள். அடுத்துவரும் கடத்தல் கட்டளையைக் கொண்டு இதை உரையிலேயே ‘கடவுத்துறைகள்’ எனத் தீர்மானிக்காமல், மூலச்சொல்லின் பொருளை முதன்மைப்படுத்துகிறது.
- source_word: וְגַם עָבוֹר תַּעֲבוֹר
  choice: அதோடு, கட்டாயம் கடந்துபோய்விடுங்கள்
  rationale: வினைமுற்றுடன் அதே வேரின் வினையெச்ச வடிவம் இணைவதால் கட்டளை வலியுறுத்தப்படுகிறது. ‘கட்டாயம்’ அந்த வலியுறுத்தலை இயல்பாகக் காட்டுகிறது; וְגַם தரும் கூடுதல் வலிமையை ‘அதோடு’ வெளிப்படுத்துகிறது.
- source_word: פֶּן
  choice: இல்லாவிட்டால்
  rationale: எச்சரிக்கையை அறிமுகப்படுத்தும் இணைப்புச்சொல்லின் சுருக்கமான காரணவிளைவு வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: יְבֻלַּע
  choice: விழுங்கப்பட்டுவிடுவார்கள்
  rationale: போராபத்தின் சூழலில் அழிக்கப்படுதல் அல்லது முற்றாக ஆட்கொள்ளப்படுதல் என்ற பொருள் இருந்தாலும், எபிரெயத்தின் உயிரோட்டமான ‘விழுங்கப்படுதல்’ உருவகத்தைப் பாதுகாக்கிறது.
- source_word: לַמֶּלֶךְ
  choice: அரசர்
  rationale: எபிரெயம் தாவீதின் பெயரை மீண்டும் கூறாமல் அவரது அரசப் பட்டத்தைப் பயன்படுத்துகிறது; அதையே தமிழிலும் தக்கவைக்கிறது.
- source_word: וּלְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: அவரோடு இருக்கும் எல்லா மக்களும்
  rationale: עָם என்பதைப் படைவீரர்கள் என்று சுருக்காமல், தாவீதோடு இருந்த முழுக் குழுவையும் குறிக்கும் பரந்த சொல்லாக மொழிபெயர்க்கிறது.
