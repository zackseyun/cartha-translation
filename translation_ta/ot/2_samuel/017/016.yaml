translation_notes:
  register: நவீன நிலையான தமிழில், உரையாடலுக்குரிய அவசரத்தையும் அரசரிடம் பேசும் மரியாதை நிலையையும் இணைக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மேற்கோளுக்குள் தாவீதைக் குறிக்கும் எபிரெய ஒருமை ஏவல்கள் தமிழில் மரியாதை ஒருமையாக வழங்கப்பட்டுள்ளன. மூல எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘யோர்தான்’ அல்லது ‘ஆறு’ என்பவை முதன்மை உரையில் சேர்க்கப்படவில்லை.
