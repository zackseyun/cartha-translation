base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/012.yaml
  text: Then we will come upon him in one of the places where he is found[a], and we will settle on him just as the dew falls on the ground; and not one will be left of him and of all the men who are with him—not even one.
translation:
  language: ta
  text: அவன் காணப்படும் இடங்களில் ஒன்றில் நாங்கள் அவனிடம் செல்வோம்; நிலத்தின்மேல் பனி விழுவதுபோல் அவன்மேல் தங்குவோம்[a]. அவனிலும் அவனோடு இருக்கும் எல்லா ஆட்களிலும் ஒருவன்கூட எஞ்சியிருக்கமாட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன்மேல் அமர்வோம்.” எபிரேய வினைச்சொல் அடிப்படையில் ‘தங்குதல், அமர்தல்’ என்று பொருள்படும்; இங்கு நிலத்தின்மேல் பனி விழும் உவமையோடு இணைந்து, முற்றாக ஆட்கொள்ளும் படை நடவடிக்கையைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאנוּ אֵלָיו
  choice: அவனைத் தாக்கச் சென்று
  rationale: בוא என்பதன் அடிப்படைப் பொருள் ‘வருதல்/செல்லுதல்’; இங்கு படைத்தாக்குதல் சூழல் இருப்பதால் பகை நோக்குடன் அவனை அணுகுவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְאַחַת הַמְּקוֹמוֹת אֲשֶׁר נִמְצָא שָׁם
  choice: அவன் காணப்படும் இடங்களில் ஒன்றில்
  rationale: נמצא என்பதிலுள்ள செயப்பாட்டு நுணுக்கத்தை ‘காணப்படும்’ என்று காத்து, எங்கு கண்டுபிடிக்கப்படுகிறானோ அந்த இடங்களில் ஒன்றைக் குறிக்கிறது.
- source_word: וְנַחְנוּ עָלָיו
  choice: நாங்கள் அவன்மேல் சூழ்ந்து அமர்வோம்
  rationale: נוח என்பதன் ‘அமர்தல்/தங்குதல்’ என்ற பொருளைத் தக்கவைத்தபடி, அடுத்துவரும் பனியின் உவமையுடன் பொருந்தும் முழுமையான படைச் சூழ்வை ‘சூழ்ந்து’ தெளிவுபடுத்துகிறது; இதை ‘விழுவோம்’ என்று மொழிபெயர்த்து அடுத்துள்ள נפל என்ற வேறு வேர்ச்சொல்லுடன் ஒன்றாக்குவது தவிர்க்கப்பட்டது.
- source_word: כַּאֲשֶׁר יִפֹּל הַטַּל עַל הָאֲדָמָה
  choice: நிலத்தின்மேல் பனி விழுவதுபோல்
  rationale: பரந்தும் தவிர்க்க முடியாததுமான தாக்குதலைக் காட்டும் எபிரேய உவமையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְלֹא נוֹתַר ... גַּם אֶחָד
  choice: ஒருவன்கூட எஞ்சியிருக்கமாட்டான்
  rationale: יתר வினையின் ‘எஞ்சுதல்/மீதியிருத்தல்’ பொருளையும் גם אחד என்பதன் வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בּוֹ וּבְכָל הָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: அவனிலும் அவனோடு இருக்கும் ஆட்கள் அனைவரிலும்
  rationale: தாவீதையும் அவனுடைய முழுக் கூட்டத்தையும் உள்ளடக்கும் எபிரேய இணைப்பை அதிக விளக்கமின்றி காக்கிறது.
