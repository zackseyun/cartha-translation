base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/013.yaml
  text: And if he withdraws into a city[a], then all Israel will bring ropes to that city[b], and we will drag it to the wadi until not even a small stone is found there.
translation:
  language: ta
  text: அவன் ஒரு நகருக்குள் பின்வாங்கினால், இஸ்ரவேலர் அனைவரும் அந்த நகரத்திற்குக் கயிறுகளைக் கொண்டுவருவார்கள். நாம் அதை நீரோடைப் பள்ளத்தாக்குவரை[a] இழுத்துச் செல்வோம்; அங்கே ஒரு சிறு கல்லைக்கூட[b] காணப்படாதபடி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓடை” அல்லது “நீரோடை.” எபிரெயச் சொல் (naḥal) பருவகாலத்தில் நீர் ஓடும் ஓடைப் படுகையையோ பள்ளத்தாக்கையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரு கூழாங்கல்லைக்கூட.” எபிரெயத்தில் இது நகரம் முழுமையாக அழிக்கப்படுவதை மிகைப்படுத்திக் காட்டும் படிமம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָסֵף
  choice: பின்வாங்கினால்
  rationale: நிஃபால் வடிவம் இச்சூழலில் தாவீது பாதுகாப்புக்காக ஒரு நகருக்குள் பின்வாங்குவதைக் குறிக்கிறது; சொற்சொல்லான ‘சேர்க்கப்பட்டால்’ என்பதைவிட இது இராணுவச் சூழலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְהִשִּׂיאוּ
  choice: கொண்டுவருவார்கள்
  rationale: கயிறுகளை நகரத்திற்குச் சுமந்து அல்லது எடுத்துவரும் செயலை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: חֲבָלִים
  choice: கயிறுகள்
  rationale: நகரத்தை இழுப்பதற்குப் பயன்படுத்தப்படும் உறுதியான கயிறுகள் என்ற நேரடியான உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְסָחַבְנוּ אֹתוֹ
  choice: நாம் அதை ... இழுத்துச் செல்வோம்
  rationale: סחב என்பதன் வன்மையான ‘இழுத்துச் செல்லுதல்’ என்ற பொருளையும், பதிலிப்பெயர் நகரத்தைக் குறிப்பதையும் பாதுகாக்கிறது.
- source_word: הַנַּחַל
  choice: நீரோடைப் பள்ளத்தாக்கு
  rationale: נחל என்பது பருவகால நீரோடை ஓடும் பள்ளம் அல்லது ஓடைப் படுகையைக் குறிக்கலாம்; தமிழில் அறிமுகமற்ற ‘வாடி’ என்ற கடன்சொல்லைத் தவிர்த்து நிலவியலைத் தெளிவாகக் காட்டுகிறது.
- source_word: גַּם צְרוֹר
  choice: ஒரு சிறு கல்லைக்கூட
  rationale: צרור என்பதன் சிறிய கல் என்ற பொருளையும், நகரம் முற்றிலும் அழிக்கப்படும் என்ற மிகைப்படுத்தப்பட்ட படிமத்தின் தீவிரத்தையும் காக்கிறது.
