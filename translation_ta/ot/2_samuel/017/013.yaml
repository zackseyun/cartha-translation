translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் முற்றழிவு குறித்த மிகைப்படுத்தப்பட்ட உருவகம் பாதுகாக்கப்பட்டுள்ளது; அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சொற்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
