base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/005.yaml
  text: Then Absalom said[a], “Please call Hushai the Archite also, and let us hear what he too has to say.”
translation:
  language: ta
  text: அப்போது அப்சலோம், “அர்க்கியனான ஊசாயையும் அழையுங்கள்; அவரும் என்ன சொல்கிறார் என்று கேட்போம்” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “அவருடைய வாயில் என்ன இருக்கிறது என்பதையும் கேட்போம்; அவரையும்” என்று உள்ளது. ‘வாயில் என்ன இருக்கிறது’ என்பது அவர் என்ன கூறுகிறார் அல்லது முன்மொழிகிறார் என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதை நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; நவீன தமிழில் ‘அப்போது’ அதன் தொடர்ச்சியைக் இயல்பாகக் காட்டுகிறது.
- source_word: קְרָא נָא
  choice: அழையுங்கள்
  rationale: நָא வேண்டுகோள் அல்லது மரியாதையான கட்டளை நயத்தைக் கொண்டது. தமிழில் பன்மை மரியாதை ஏவல் வடிவம் அந்த நயத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: גַּם לְחוּשַׁי
  choice: ஊசாயையும்
  rationale: גַּם என்பதன் சேர்க்கைப் பொருளை ‘-யும்’ நேர்த்தியாகக் காட்டுகிறது; அகித்தோப்பேலுக்கு அடுத்ததாக ஊசாயும் அழைக்கப்படுகிறார்.
- source_word: הָאַרְכִּי
  choice: அற்கியனான
  rationale: இது ஊசாயின் இன/ஊர்சார் அடையாளத்தைக் குறிக்கும் பெயரடை; பொருளை ஊகித்து விரிவாக்காமல் ஒலிபெயர்ப்புடன் தமிழ் பெயரடை வடிவில் தரப்பட்டுள்ளது.
- source_word: וְנִשְׁמְעָה
  choice: கேட்போம்
  rationale: முதல் நபர் பன்மை cohortative ஆலோசனை அல்லது முன்மொழிவு நயத்தைக் கொண்டது; ‘கேட்போம்’ தமிழில் அதை இயல்பாகத் தருகிறது.
- source_word: מַה בְּפִיו גַּם הוּא
  choice: அவரும் என்ன சொல்கிறார்
  rationale: சொல்லுக்கு சொல் ‘அவருடைய வாயில் என்ன இருக்கிறது, அவரும்’ என்ற எபிரெய மரபுத்தொடர், அவர் கூறவிருக்கும் கருத்தைக் குறிக்கிறது. ‘அவரும் என்ன சொல்கிறார்’ என்பது சேர்க்கை வலியுறுத்தலையும் இயல்பான பொருளையும் காக்கிறது.
