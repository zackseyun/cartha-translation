base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/029.yaml
  text: and honey and curds and sheep and cheese from the herd they brought near for David and for the people who were with him to eat[a], for they said[c][b], “The people are hungry and weary and thirsty in the wilderness.”
translation:
  language: ta
  text: மேலும், அவர்கள் தேனையும் தயிரையும் ஆடுகளையும் மாட்டுப்பாலால் செய்த பாலாடைக்கட்டிகளையும்[a] தாவீதுக்கும் அவருடன் இருந்த மக்களுக்கும் உண்பதற்காகக் கொண்டுவந்தார்கள். ஏனெனில், “பாலைநிலத்தில் மக்கள் பசித்தும் களைத்தும் தாகமாயும் இருந்தனர்” என்று அவர்கள் சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மாட்டுப்பாலால் செய்த பாலாடைக்கட்டிகள்” என்பது அரிய எபிரெயச் சொற்றொடரின் மொழிபெயர்ப்பு; அது மாடுகளிலிருந்து கிடைத்த வேறொரு வகைப் பால் உணவையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבַשׁ
  choice: தேன்
  rationale: இச்சொல்லின் வழக்கமான பொருள் ‘தேன்’; உணவுப்பொருட்களின் பட்டியலிலும் இதுவே இயல்பான மொழிபெயர்ப்பு.
- source_word: חֶמְאָה
  choice: தயிர்
  rationale: நவீன வெண்ணெயைக் காட்டிலும் தயிர்த்த அல்லது உறைந்த பால் உணவைக் குறிக்கும் வாய்ப்பு அதிகம்; தமிழில் ‘தயிர்’ இயல்பாகவும் புரியும்படியும் உள்ளது.
- source_word: צֹאן
  choice: ஆடுகள்
  rationale: இச்சொல் செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கிய சிறுகால்நடைகளை மொத்தமாகக் குறிக்கலாம்; தமிழ் வழக்கில் ‘ஆடுகள்’ அந்தப் பரந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: שְׁפוֹת בָּקָר
  choice: மாட்டுப்பாலால் செய்த பாலாடைக்கட்டிகள்
  rationale: இது மாடுகளோடு தொடர்புடைய பால் உணவைக் குறிக்கும் அரிய சொற்றொடர். சரியான தயாரிப்பு முறை தெளிவாக இல்லாவிட்டாலும், பாலாடைக்கட்டி என்ற மொழிபெயர்ப்பு பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: הִגִּישׁוּ
  choice: கொண்டுவந்தார்கள்
  rationale: வழங்குவதற்காக அருகே கொண்டுவருதல் என்ற கருத்தை, நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: רָעֵב וְעָיֵף וְצָמֵא
  choice: பசியாயும் களைப்பாயும் தாகமாயும்
  rationale: மூன்று நிலைகளையும் மிகைப்படுத்தாமல், எபிரெய உரையின் தொடர் ஓசையோடு வழங்குகிறது.
- source_word: בַּמִּדְבָּר
  choice: பாலைநிலத்தில்
  rationale: மணற்பாலைவனத்தை மட்டும் அல்லாமல், மக்கள் வாழ்வு குறைந்த வறண்ட வனாந்தரப் பகுதியையும் குறிக்கக்கூடிய מִדְבָּר என்பதற்கு ‘பாலைநிலம்’ பொருத்தமான பரந்த சொல்.
