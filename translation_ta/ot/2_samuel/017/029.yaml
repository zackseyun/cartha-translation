translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. உணவுப் பட்டியலின் தொடர்ச்சியும், பசி–களைப்பு–தாகம் என்ற மூவகை நடையும் காக்கப்பட்டுள்ளன.
