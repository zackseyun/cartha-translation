translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வரலாற்று-கதைநடை பயன்படுத்தப்பட்டுள்ளது. நீளமான எபிரெய வாக்கியத் தொடர் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. “அங்கே” என்ற சொல்லின் மூலமொழிசார் மறைபொருள் பாதுகாக்கப்பட்டு, கிணற்றுக்குள் இறங்கியதாக வெளிப்படுத்தும் மாற்று அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
