base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/018.yaml
  text: But a young man saw them and told Absalom[a], so the two of them went quickly and came to the house of a man in Bahurim, who had a well in his courtyard, and they went down there.
translation:
  language: ta
  text: 'ஆனால் ஓர் இளைஞன் அவர்களைக் கண்டு, அப்சலோமிடம் தெரிவித்தான். எனவே அவர்கள் இருவரும் விரைவாகச் சென்று, பகூரிமில் இருந்த ஒரு மனிதனுடைய வீட்டை அடைந்தார்கள். அவனுடைய முற்றத்தில் ஒரு கிணறு இருந்தது; அவர்கள் அங்கே இறங்கினார்கள்.[a]


    [a] “அவர்கள் அதற்குள் இறங்கினார்கள்” என்றும் மொழிபெயர்க்கலாம்; அதாவது, கிணற்றுக்குள் இறங்கினார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்கள் அதற்குள் இறங்கினார்கள்” என்றும் மொழிபெயர்க்கலாம்; அதாவது, கிணற்றுக்குள் இறங்கினார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: இளைஞன்
  rationale: இந்தச் சொல் சிறுவன், இளைஞன் அல்லது பணியாளன் என்பதைக் குறிக்கலாம். இங்கே அவன் பார்த்த செய்தியை அப்சலோமிடம் தெரிவிக்கும் அளவுக்கு சுயமாகச் செயல்படுவதால், வயதையோ பணிநிலையையோ தேவையின்றி நிர்ணயிக்காத “இளைஞன்” பொருத்தமானது.
- source_word: וַיַּגֵּד
  choice: தெரிவித்தான்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் பொதுவாக ஒரு செய்தியைச் சொல்லுதல் அல்லது அறிவித்தல் என்பதைக் குறிக்கிறது. “தெரிவித்தான்” என்பது இச்சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: שְׁנֵיהֶם
  choice: அவர்கள் இருவரும்
  rationale: எபிரெயச் சொல் இரண்டு நபர்களையும் வெளிப்படையாகக் குறிக்கிறது; தமிழ் சொற்றொடர் அந்த எண்ணிக்கையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מְהֵרָה
  choice: விரைவாக
  rationale: விரைவு அல்லது அவசரத்தை வினையடையாகக் குறிக்கும் இச்சொல்லுக்கு “விரைவாக” இயல்பான நவீனத் தமிழ் இணையாகும்.
- source_word: בֵּית אִישׁ
  choice: ஒரு மனிதனுடைய வீடு
  rationale: மூலத்தின் பெயர்ச்சொல் இணைப்பைத் தெளிவான, இயல்பான தமிழில் வழங்குகிறது.
- source_word: בְּבַחוּרִים
  choice: பகூரிமில்
  rationale: בַחוּרִים ஓர் இடப்பெயர்; அது தமிழ் ஒலிபெயர்ப்பில் “பகூரிம்” எனவும், இடவேற்றுமையுடன் “பகூரிமில்” எனவும் வழங்கப்பட்டுள்ளது.
- source_word: בְאֵר
  choice: கிணறு
  rationale: בְאֵר என்பதன் வழக்கமான பொருள் கிணறு. அடுத்த வசனத்தில் அதன் வாயை மூடுவது குறிப்பிடப்பட்டாலும், இங்கே அதை நீர்த்தொட்டி எனக் குறிப்பாக்க வேண்டிய கட்டாயம் இல்லை.
- source_word: בַּחֲצֵרוֹ
  choice: அவனுடைய முற்றத்தில்
  rationale: חָצֵר என்பது வீட்டைச் சார்ந்த முற்றம் அல்லது சுற்றடைப்பைக் குறிக்கிறது. “முற்றம்” சாதாரண நவீனத் தமிழில் தெளிவான இணை.
- source_word: וַיֵּרְדוּ שָׁם
  choice: அவர்கள் அங்கே இறங்கினார்கள்
  rationale: மூலத்தில் உள்ள שָׁם என்பதன் “அங்கே” என்ற இடச்சுட்டை அப்படியே பாதுகாக்கிறது. சூழல் கிணற்றைக் குறித்தாலும், மூலத்தின் சிறிய மறைபொருளை முதன்மை உரை வெளிப்படையாகத் தீர்மானிப்பதில்லை; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
