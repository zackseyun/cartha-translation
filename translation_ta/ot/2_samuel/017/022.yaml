base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/022.yaml
  text: Then David arose[a], and all the people who were with him, and they crossed the Jordan. By morning light, not one was missing who had not crossed the Jordan.
translation:
  language: ta
  text: தாவீது எழுந்தான்; அவனோடு இருந்த மக்கள் அனைவரும் அவனுடன் யோர்தான் ஆற்றைக் கடந்தார்கள். காலை வெளிச்சம் தோன்றும் நேரத்திற்குள்[a], யோர்தான் ஆற்றைக் கடக்காத ஒருவர்கூட எஞ்சியிருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காலை வெளிச்சம் வரும்வரை.” எபிரெயச் சொற்றொடர் காலை வெளிச்சத்தின் காட்சியைத் தக்கவைத்தபடி, ஆற்றைக் கடந்து செல்வது நிறைவடைந்த காலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם דָּוִד וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: தாவீதும் அவனோடு இருந்த மக்கள் அனைவரும் எழுந்து
  rationale: வாக்கியத்தின் தொடக்கத்தில் ஒருமை வினை வந்தாலும், தாவீதையும் அவனுடன் இருந்த முழுக் குழுவையும் தொடர்ந்த பன்மை வினை உள்ளடக்குகிறது. தமிழில் இயல்பாகப் பன்மையில் அமைத்தது.
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: யோர்தான் ஆற்றைக் கடந்தார்கள்
  rationale: עבר என்பதன் நேரடியான பொருள் ‘கடத்தல்/கடந்து செல்லுதல்.’ தமிழ்வாசகருக்குத் தெளிவாக இருக்க இடப்பெயருடன் ‘ஆறு’ சேர்க்கப்பட்டது.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: காலை வெளிச்சம் வருவதற்குள்
  rationale: אוֹר என்ற ‘வெளிச்சம்’ உருவகத்தைத் தக்கவைத்தபடி, கடத்தல் முடிந்திருந்த கால எல்லையை இயல்பான தமிழில் காட்டுகிறது. עַד என்பதால் ‘வரும்வரை’ என்ற வாசிப்பும் சாத்தியம்; அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: עַד אַחַד לֹא נֶעְדָּר אֲשֶׁר לֹא עָבַר אֶת הַיַּרְדֵּן
  choice: யோர்தான் ஆற்றைக் கடக்காத ஒருவர்கூட எஞ்சியிருக்கவில்லை
  rationale: எவரும் கடக்காமல் விடுபடவில்லை என்ற எபிரெய இரட்டை எதிர்மறை அமைப்பின் கருத்தைத் தெளிவான, இயல்பான தமிழில் வழங்குகிறது.
