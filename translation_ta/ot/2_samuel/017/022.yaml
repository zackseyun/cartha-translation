revisions:
- from: தாவீதும் அவனோடு இருந்த மக்கள் அனைவரும் எழுந்து, யோர்தான் ஆற்றைக் கடந்தார்கள். காலை வெளிச்சம் வருவதற்குள்[a], யோர்தான் ஆற்றைக் கடக்காத ஒருவர்கூட எஞ்சியிருக்கவில்லை.
  to: தாவீது எழுந்தான்; அவனோடு இருந்த மக்கள் அனைவரும் அவனுடன் யோர்தான் ஆற்றைக் கடந்தார்கள். காலை வெளிச்சம் தோன்றும் நேரத்திற்குள்[a], யோர்தான் ஆற்றைக் கடக்காத ஒருவர்கூட எஞ்சியிருக்கவில்லை.
  rationale: The revision separates David’s singular act of rising from the people’s crossing with him, thereby reflecting the Hebrew syntax without preserving an unnatural English-like coordination. It also expresses the morning-light time limit naturally and corrects the footnote’s potentially misleading action noun.
