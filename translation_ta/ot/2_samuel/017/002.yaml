base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/002.yaml
  text: I will come upon him while he is weary and weak-handed[a], and I will throw him into panic, so that all the people who are with him will flee; then I will strike down the king alone.
translation:
  language: ta
  text: அவன் களைத்துப்போய், கைகள் தளர்ந்திருக்கும்போது[a], நான் அவனுக்கு எதிராக வருவேன். அவனைப் பீதியடையச் செய்வேன்; அப்போது அவனோடு இருக்கும் மக்கள் அனைவரும் தப்பியோடுவார்கள். பிறகு அரசனை மட்டும் வீழ்த்துவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “கைகள் தளர்ந்தவன்”; இது வலிமை அல்லது துணிவு குறைந்த நிலையைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָבוֹא עָלָיו
  choice: நான் அவனுக்கு எதிராக வருவேன்
  rationale: בוא עַל என்பது பகைமை நோக்குடன் ஒருவருக்கு எதிராக வருவதைக் குறிக்கலாம். தமிழில் இயல்பாக இருக்கும்போதே, ‘வருதல்’ என்ற எபிரெய உருவகத்தையும் போர்ச் சூழலையும் இச்சொற்றொடர் காக்கிறது.
- source_word: יָגֵעַ
  choice: களைத்துப்போய்
  rationale: உடல் முயற்சியால் ஏற்பட்ட களைப்பைச் சூழலுக்கேற்ற இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וּ/רְפֵה יָדַיִם
  choice: கைகள் தளர்ந்திருக்கும்போது
  rationale: ‘கைகளில் தளர்ந்தவன்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, வலிமை அல்லது துணிவு குறைந்த நிலையைக் குறிப்பால் உணர்த்துகிறது.
- source_word: וְ/הַחֲרַדְתִּי אֹתוֹ
  choice: அவனைப் பீதியடையச் செய்வேன்
  rationale: חרד என்பதன் காரணவினை வடிவம், அவனை நடுங்கவைக்கும் அல்லது அச்சத்தில் ஆழ்த்தும் செயலைக் குறிக்கிறது; ‘பீதியடையச் செய்வேன்’ அதன் காரணவினைப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְ/נָס כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: அப்போது அவனோடு இருக்கும் மக்கள் அனைவரும் தப்பியோடுவார்கள்
  rationale: எபிரெய இணைப்பின் விளைவு சார்ந்த தொடர்பை ‘அப்போது’ இயல்பாக வெளிப்படுத்துகிறது; אֲשֶׁר אִתּוֹ என்பதையும் ‘அவனோடு இருக்கும்’ என்று காக்கிறது.
- source_word: וְ/הִכֵּיתִי
  choice: வீழ்த்துவேன்
  rationale: נכה இச்சூழலில் உயிரைப் பறிக்கும் தாக்குதலைக் குறிக்கக்கூடும். ‘வீழ்த்துவேன்’ என்பது வன்முறைத் தாக்குதலின் விளைவைத் தெரிவிப்பதோடு, மூலத்தில் சொல்லப்படாத ஆயுதத்தையோ செய்முறையையோ சேர்ப்பதில்லை.
- source_word: הַמֶּלֶךְ
  choice: அரசனை
  rationale: மூலத்தின் திட்டவட்டமான அரசப் பட்டத்தைப் பாதுகாக்கிறது; பெயரை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: לְ/בַדּוֹ
  choice: மட்டும்
  rationale: அரசன் ஒருவனே தாக்குதலின் குறி என்பதைக் குறுகிய, இயல்பான தமிழில் வலியுறுத்துகிறது.
