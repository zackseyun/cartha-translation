    issue: ‘அம்மோனியரின் ரப்பா நகரைச் சேர்ந்த’ includes ‘நகரை’ (‘city’).
    rationale: The Hebrew reads ‘from Rabbah of the Ammonites’ and treats Rabbah as the proper place name. Although Rabbah was a city, adding the generic noun is unnecessary explicitation and is not reflected in the English audit trail.
