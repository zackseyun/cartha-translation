translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, எளிதில் புரியும் கதைநடை. இந்த வசனம் அடுத்த வசனத்தில் நிறைவடையும் பெயர்ப்பட்டியல் வாக்கியத்தின் தொடக்கம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. தனிப்பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுடன் ஒத்த ஒலிபெயர்ப்பு முறையில் வழங்கப்பட்டுள்ளன.
