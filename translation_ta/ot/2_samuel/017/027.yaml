source:
  edition: WLC
  text: וַ/יְהִ֕י כְּ/ב֥וֹא דָוִ֖ד מַחֲנָ֑יְמָ/ה וְ/שֹׁבִ֨י בֶן נָחָ֜שׁ מֵ/רַבַּ֣ת בְּנֵֽי עַמּ֗וֹן וּ/מָכִ֤יר בֶּן עַמִּיאֵל֙ מִ/לֹּ֣א דְבָ֔ר וּ/בַרְזִלַּ֥י הַ/גִּלְעָדִ֖י מֵ/רֹגְלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/027.yaml
  text: When David came to Mahanaim, Shobi son of Nahash from Rabbah of the Ammonites, and Machir son of Ammiel from Lo-debar, and Barzillai the Gileadite from Rogelim,
translation:
  language: ta
  text: தாவீது மக்னாயீமுக்கு வந்தபோது, அம்மோனியரின் ரப்பாவைச் சேர்ந்த நாகாசின் மகன் சோபியும், லோ-தேபாரைச் சேர்ந்த அம்மியேலின் மகன் மாகீரும், ரோகெலிமைச் சேர்ந்த கீலேயாத்தியனான பர்சிலாயும்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: தனி முன்னுரைச் சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது புதிய கதை நிகழ்வை அறிமுகப்படுத்தும் எபிரெய உரைநடை வடிவம். தமிழில் அடுத்த காலவாக்கியத்திலேயே அதன் தொடர்ச்சி இயல்பாக வெளிப்படுகிறது; ‘இப்போது’ போன்ற மூலத்தில் இல்லாத காலச் சொல்லைச் சேர்க்கவில்லை.
- source_word: כְּבוֹא דָוִד
  choice: தாவீது ... வந்தபோது
  rationale: כְּ உடன் வரும் בוא வினையெச்சம் இங்கு கால உறவைக் குறிக்கிறது; நவீனத் தமிழில் ‘வந்தபோது’ இயல்பான இணை.
- source_word: מַחֲנָיְמָה
  choice: மக்னாயீமுக்கு
  rationale: இடப்பெயருடன் சேர்ந்த திசைசுட்டும் ה, அந்த இடத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழின் நான்காம் வேற்றுமை இதை இயல்பாகக் காட்டுகிறது.
- source_word: שֹׁבִי בֶן נָחָשׁ
  choice: நாகாசின் மகன் சோபி
  rationale: தனிப்பெயர்கள் ஒலிபெயர்க்கப்பட்டு, எபிரெய தந்தைவழி உறவு தமிழின் இயல்பான ‘X-இன் மகன் Y’ அமைப்பில் தரப்பட்டுள்ளது.
- source_word: מֵרַבַּת בְּנֵי עַמּוֹן
  choice: அம்மோனியரின் ரப்பா நகரைச் சேர்ந்த
  rationale: ரப்பா என்பது நகரம்; ‘அம்மோனின் மக்கள்’ என்பது இங்கு அம்மோனிய இன/அரசியல் மக்களைக் குறிக்கிறது. ‘நகரம்’ என்பது தமிழ் வாசகருக்கான தெளிவாக்கம்.
- source_word: מָכִיר בֶן עַמִּיאֵל
  choice: அம்மியேலின் மகன் மாகீர்
  rationale: பெயர்களும் தந்தைவழி உறவும் மூலத்துக்கு ஏற்ப பாதுகாக்கப்பட்டுள்ளன.
- source_word: מִלֹּא דְבָר
  choice: லோ-தேபாரைச் சேர்ந்த
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, מִן குறிக்கும் புறப்படும் இடம் அல்லது ஊர்ச் சார்பு தமிழில் ‘சேர்ந்த’ என இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: கீலேயாத்தியனான பர்சிலாய்
  rationale: הַגִּלְעָדִי என்பது கீலேயாத் பகுதியைச் சேர்ந்தவர் என்ற பிரதேச அடையாளம்; தமிழில் இன/பிரதேசப் பெயரடை வடிவில் தரப்பட்டுள்ளது.
- source_word: מֵרֹגְלִים
  choice: ரோகெலிமைச் சேர்ந்த
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, மִן குறிக்கும் ஊர்ச் சார்பு இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
