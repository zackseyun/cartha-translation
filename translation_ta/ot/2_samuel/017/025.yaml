  yaml_path: translation/ot/2_samuel/017/025.yaml
  text: And Absalom set Amasa over the army in place of Joab. Now Amasa was the son of a man whose name was Ithra the Israelite[a], who had gone in to Abigail the daughter of Nahash, sister of Zeruiah, Joab’s mother.
translation:
  language: ta
  text: 'அப்சலோம், யோவாபுக்குப் பதிலாக அமாசாவைப் படைக்குத் தலைவனாக நியமித்தான். அமாசா, இத்திரா[a] என்னும் இஸ்ரவேலனாகிய ஒருவனின் மகன். இத்திரா, நாகாஷின் மகளும் யோவாபின் தாயான செருயாவின் சகோதரியுமான அபிகாயிலுடன் உறவு கொண்டவன்.


    [a] எபிரெய உரையில், “இத்திரா என்னும் இஸ்ரவேலன்” என்று உள்ளது. 1 நாளாகமம் 2:17-ல், “இஸ்மவேலனான யெத்தேர்” என்று உள்ளது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில், “இத்திரா என்னும் இஸ்ரவேலன்” என்று உள்ளது. 1 நாளாகமம் 2:17-ல், “இஸ்மவேலனான யெத்தேர்” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: שָׂם
  choice: நியமித்தான்
  rationale: படைத்தலைமைப் பொறுப்பில் ஒருவரை வைப்பதை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: תַּחַת יוֹאָב
  choice: யோவாபுக்குப் பதிலாக
  rationale: இங்கு இடநிலையை அல்ல, யோவாபை மாற்றி அமாசாவை நியமித்ததைக் குறிக்கிறது.
- source_word: עַל הַצָּבָא
  choice: படைக்குத் தலைவனாக
  rationale: படையின் மீது அதிகாரம் வகிக்கும் பொறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בֶן אִישׁ וּשְׁמוֹ יִתְרָא
  choice: இத்திரா என்பவனின் மகன்
  rationale: எபிரெய அடையாள வாக்கியத்தின் பொருளைச் சுருக்கமின்றி இயல்பான தமிழ்ச் சொல்லமைப்பில் தருகிறது.
- source_word: הַיִּשְׂרְאֵלִי
  choice: இஸ்ரவேலனான
  rationale: WLC மசோரா உரையின் வாசகத்தையே முதன்மையாகப் பின்பற்றுகிறது; நாளாகம இணை வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר בָּא אֶל
  choice: உடன் சேர்ந்தவன்
  rationale: பாலுறவைக் குறிக்கும் எபிரெய மரியாதைமறைச் சொல்லாட்சியை, மிக வெளிப்படையாக மாற்றாமல் தமிழில் புரியக்கூடிய வகையில் தருகிறது.
- source_word: אֲבִיגַל בַּת נָחָשׁ אֲחוֹת צְרוּיָה אֵם יוֹאָב
  choice: நாகாஷின் மகளும் யோவாபின் தாயான செருயாவின் சகோதரியுமான அபிகாயில்
  rationale: அபிகாயிலின் தந்தை மற்றும் சகோதரி உறவுகளையும், செருயா யோவாபின் தாய் என்பதையும் தெளிவாக இணைக்கிறது.
