base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/020.yaml
  text: Absalom’s servants came to the woman at the house and said[a], “Where are Ahimaaz and Jonathan?” The woman said to them, “They crossed over the brook of water.” They searched, but did not find them, so they returned to Jerusalem.
translation:
  language: ta
  text: அப்சலோமின் பணியாளர்கள் அந்தப் பெண் இருந்த வீட்டுக்கு வந்து, “அகிமாஸ், யோனத்தான் எங்கே?” என்று கேட்டார்கள். அந்தப் பெண் அவர்களிடம், “அவர்கள் நீரோடையைக் கடந்து சென்றார்கள்[a]” என்றாள். அவர்கள் தேடினார்கள்; ஆனால் அவர்களைக் கண்டுபிடிக்கவில்லை. பிறகு அவர்கள் எருசலேமுக்குத் திரும்பிப் போனார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீரோடையைக்” என்பதற்குப் பதிலாக “நீர்வழியைக்” அல்லது “தண்ணீர்க் கால்வாயைக்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் (מִיכַל הַמָּיִם) வழக்கத்திற்கு மாறானது; அது குறிக்கும் நீர்வழியின் துல்லியமான தன்மை உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אַבְשָׁלוֹם
  choice: அப்சலோமின் பணியாளர்கள்
  rationale: இச்சூழலில் עֶבֶד என்பது அப்சலோமுக்காகச் செயல்படும் ஆட்களைக் குறிக்கிறது; அடிமை நிலையை வலியுறுத்தாமல் பணிசார் உறவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֶל הָאִשָּׁה הַבַּיְתָה
  choice: அந்தப் பெண்ணின் வீட்டுக்கு
  rationale: הַבַּיְתָה என்பதிலுள்ள திசைச்சுட்டு, வீட்டை நோக்கிய வருகையைக் குறிக்கிறது. தொடர்ச்சியான சூழலில் ஏற்கெனவே அறிமுகமான பெண் என்பதால் ‘அந்தப் பெண்’ பொருத்தமானது.
- source_word: אַיֵּה אֲחִימַעַץ וִיהוֹנָתָן
  choice: அகிமாஸ், யோனத்தான் எங்கே?
  rationale: இருவரின் இருப்பிடத்தைக் கேட்கும் நேரடியான, இயல்பான தமிழ் வினா.
- source_word: עָבְרוּ
  choice: கடந்து போய்விட்டார்கள்
  rationale: עָבַר என்பதன் அடிப்படைப் பொருளான கடத்தல் அல்லது அப்பால் செல்லுதல் இரண்டையும் இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִיכַל הַמָּיִם
  choice: நீரோடையைக்
  rationale: எபிரெயச் சொற்றொடர் வழக்கத்திற்கு மாறானதும் துல்லியப் பொருள் உறுதியற்றதும் ஆகும். ‘நீரோடை’ சிறிய நீர்வழி என்ற பொதுவான கருத்தைத் தருகிறது; மாற்றுப் பொருட்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- source_word: וַיְבַקְשׁוּ וְלֹא מָצָאוּ
  choice: அவர்கள் தேடியும் கண்டுபிடிக்க முடியாததால்
  rationale: தேடல் பலனளிக்காததை இயல்பான தமிழில் தெரிவிக்கிறது; எபிரெயத்தில் விடப்பட்டுள்ள செயப்படுபொருள் சூழலிலிருந்து புரிகிறது.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: எருசலேமுக்குத் திரும்பிப் போனார்கள்
  rationale: שׁוב என்பதன் ‘திரும்புதல்’ என்ற பொருளையும் எருசலேமை நோக்கிய இயக்கத்தையும் தெளிவாகக் காட்டுகிறது.
