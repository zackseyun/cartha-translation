base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/023.yaml
  text: When Ahithophel saw that his counsel had not been followed[a], he saddled the donkey, arose, and went to his house in his city. He gave orders to his household, then hanged himself and died[c][b]; and he was buried in his father's tomb.
translation:
  language: ta
  text: அகித்தோப்பேல் தன் ஆலோசனை செயல்படுத்தப்படவில்லை[a] என்பதைக் கண்டபோது, கழுதைக்குச் சேணம் பூட்டி, புறப்பட்டுத் தன் ஊரிலிருந்த தன் வீட்டுக்குச் சென்றான். தன் வீட்டாருக்குக் கட்டளையிட்டுவிட்டு[b], தூக்குப்போட்டுக்கொண்டு[c] இறந்தான். பின்பு அவன் தன் தந்தையின் கல்லறையில் அடக்கம் செய்யப்பட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் ஆலோசனை நிறைவேற்றப்படவில்லை.” எபிரெயத்தில் சொல்லுக்குச் சொல், “தன் ஆலோசனை செய்யப்படவில்லை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தன் வீட்டுக் காரியங்களை ஒழுங்குபடுத்திவிட்டு.” எபிரெயம் இன்னும் நேரடியாக, “தன் வீட்டுக்கு/வீட்டாருக்குக் கட்டளையிட்டான்” என்று கூறுகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தன்னைத்தானே நெரித்துக்கொண்டு.” இவ்வினை தூக்கிடுதல் அல்லது நெரித்தல் மூலம் ஏற்படும் மரணத்தைக் குறிக்கலாம்; இச்சூழலில் அகித்தோப்பேல் தற்கொலை செய்துகொண்டதை விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָתוֹ
  choice: தன் ஆலோசனை
  rationale: עֵצָה என்பது ஆலோசனை, அறிவுரை, திட்டம் ஆகிய பொருள்களைக் கொள்ளலாம்; இங்குள்ள அரசியல்-தந்திரச் சூழலில் ‘ஆலோசனை’ அறிவுரையையும் திட்டவட்டமான யோசனையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נֶעֶשְׂתָה
  choice: செயல்படுத்தப்படவில்லை
  rationale: சொல்லுக்குச் சொல் ‘செய்யப்படவில்லை’ என்றாலும், இங்கு ஆலோசனை நடைமுறைப்படுத்தப்படாததைக் குறிக்கிறது; ‘செயல்படுத்தப்படவில்லை’ அந்தப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיַּחֲבֹשׁ אֶת־הַחֲמוֹר
  choice: கழுதைக்குச் சேணம் பூட்டி
  rationale: חבש என்பது பயணத்திற்காகக் கழுதைக்குச் சேணம் பூட்டுவதைக் குறிக்கிறது. எபிரெயத்தில் உடைமைப் பின்னொட்டு இல்லாமல் குறிப்புச் சுட்டு மட்டுமே இருப்பதால் ‘தன் கழுதை’ என்று சேர்க்கப்படவில்லை.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: புறப்பட்டு ... சென்றான்
  rationale: எபிரெயக் கதைநடையில் வழக்கமான தொடர்ச்சிச் செயல்களை, நவீனத் தமிழில் இயல்பாக ‘புறப்பட்டுச் சென்றான்’ என்று வழங்குகிறது.
- source_word: אֶל־בֵּיתוֹ אֶל־עִירוֹ
  choice: தன் ஊரிலிருந்த தன் வீட்டுக்கு
  rationale: இரு אֶל தொடர்களும் இலக்கையும் அதன் இருப்பிடத்தையும் குறிப்பிடுகின்றன; தமிழில் ஊருக்குள் இருந்த வீட்டை இயல்பாகவும் இரு கூறுகளையும் காத்தும் வெளிப்படுத்துகிறது.
- source_word: וַיְצַו אֶל־בֵּיתוֹ
  choice: தன் வீட்டாருக்குக் கட்டளைகள் கொடுத்துவிட்டு
  rationale: எபிரெயம் வீட்டை அல்லது வீட்டாரை நோக்கிக் கட்டளையிட்டதாகச் சொல்கிறது. ‘தன் காரியங்களை ஒழுங்குபடுத்தி’ என்பது சாத்தியமான சூழல்சார் பொருள் என்றாலும், மூலத்தின் சொற்றொடருக்கு அருகிலிருக்க ‘வீட்டாருக்குக் கட்டளைகள் கொடுத்து’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיֵּחָנַק
  choice: தூக்கிட்டுக்கொண்டு
  rationale: இந்த வினை நெரித்தல் அல்லது தூக்கிடுதல் சார்ந்த மரணத்தைக் குறிக்கலாம்; சூழல் தற்கொலையைத் தெளிவாக்குவதால் தமிழில் இயல்பான ‘தூக்கிட்டுக்கொண்டு’ பயன்படுத்தப்பட்டுள்ளது, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּקֶבֶר אָבִיו
  choice: தன் தந்தையின் கல்லறையில்
  rationale: קֶבֶר என்பது கல்லறை அல்லது கல்லறைக் குகையைக் குறிக்கலாம்; குடும்ப அடக்கச் சூழலுக்கு ‘தந்தையின் கல்லறை’ நேரடியான, இயல்பான மொழிபெயர்ப்பு.
theological_decisions:
- issue: அகித்தோப்பேலின் மரணம் தற்கொலையா அல்லது பிறரால் நிகழ்த்தப்பட்டதா
  choice: தூக்கிட்டுக்கொண்டு இறந்தான்
  alternative: நெரித்துக்கொண்டு இறந்தான் / தூக்கிலிடப்பட்டு இறந்தான்
  rationale: וַיֵּחָנַק வடிவம் இலக்கணரீதியாக இடை/செயப்பாட்டு நுணுக்கம் கொண்டிருக்கக்கூடும்; ஆனால் பயணித்து வீட்டாருக்கு அறிவுறுத்திய பின் நிகழும் செயல்தொடர் தன்னைத்தானே கொன்றுகொண்டதைக் காட்டுகிறது. மரண முறையின் சொற்பொருள் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர்ச்சிச் செயல்கள் தமிழில் இயல்பாக இணைக்கப்பட்டுள்ளன; மூலத்தில் இல்லாத ‘தன் கழுதை’ என்ற உடைமை சேர்க்கப்படவில்லை. உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
