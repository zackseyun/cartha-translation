base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/009.yaml
  text: Look[a], right now he is hidden in one of the pits or in one of the other places. And when some of them fall at the first attack, whoever hears it will say[b], ‘There has been a slaughter among the people who follow Absalom.’
translation:
  language: ta
  text: இதோ, இப்போது அவன் குழிகளில் ஒன்றிலோ வேறு ஏதாவது ஓரிடத்திலோ மறைந்திருக்கிறான். ஆரம்பத்திலேயே அவர்களில் சிலர் வீழ்ந்தால், அதைக் கேட்கிற எவனும், ‘அப்சலோமைப் பின்பற்றும் மக்களிடையே கடுமையான அடி விழுந்துவிட்டது[a]’ என்று சொல்வான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடுமையான அடி” என்பதை “படுகொலை,” “தோல்வி,” அல்லது “பெரும் அழிவு” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் நோயினால் வரும் கொள்ளைநோயைக் குறிக்காமல், போரில் கடுமையாக அடித்து வீழ்த்தப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה עַתָּה
  choice: இதோ, இப்போது
  rationale: கவனத்தை ஈர்க்கும் உயிரோட்டத்தையும் தற்போதைய அவசரத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: נֶחְבָּא
  choice: மறைந்திருக்கிறான்
  rationale: எழுவாயின் செயற்பாட்டை தேவையின்றி மிகத் தெளிவுபடுத்தாமல், தற்போதைய மறைவுநிலையைச் சுட்டுகிறது.
- source_word: בְּאַחַת הַפְּחָתִים
  choice: குழிகளில் ஒன்றில்
  rationale: פְּחָתִים என்பதன் முதன்மையான நிலப்பரப்பு சார்ந்த பொருளான குழி அல்லது பள்ளத்தை எளிய தமிழில் தருகிறது.
- source_word: בְּאַחַד הַמְּקוֹמֹת
  choice: வேறு ஏதாவது ஓரிடத்தில்
  rationale: אוֹ குறிக்கும் மாற்றுத் தெரிவையும் எபிரெயச் சொற்றொடரின் உறுதியற்ற பரந்த இடக் குறிப்பையும் வெளிப்படுத்துகிறது.
- source_word: כִּנְפֹל בָּהֶם בַּתְּחִלָּה
  choice: தொடக்கத் தாக்குதலில் அவர்களில் சிலர் வீழ்ந்தால்
  rationale: போர்ச் சூழலில் ஆரம்ப மோதலின்போது அப்சலோமின் ஆட்களில் உயிரிழப்பு ஏற்படுவதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַשֹּׁמֵעַ
  choice: அதைக் கேட்கிற எவனும்
  rationale: குறிப்பிட்ட ஒருவரை அல்லாமல், கேள்விப்படும் யாரையும் குறிக்கும் எபிரெயப் பெயரெச்ச வடிவின் பொதுப் பொருளைப் பாதுகாக்கிறது.
- source_word: מַגֵּפָה
  choice: பேரழிவு
  rationale: இங்கு நோய்த்தொற்றை அல்ல, படையின்மேல் விழுந்த கடுமையான அடி அல்லது பெரும் உயிரிழப்பைக் குறிக்கிறது; ‘பேரழிவு’ அந்த பரப்பைத் தக்கவைக்கிறது.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי אַבְשָׁלֹם
  choice: அப்சலோமைப் பின்பற்றுகிற மக்கள்
  rationale: אַחֲרֵי என்பது இங்கு இடஞ்சார்ந்த பின்தொடர்தலைவிட அரசியல் மற்றும் இராணுவ ஆதரவைச் சுட்டுகிறது.
