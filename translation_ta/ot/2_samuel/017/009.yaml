  register: நவீன நிலையான தமிழில், உரையாடலுக்குரிய உடனடித் தன்மையையும் போர்ச் சூழலின் கண்ணியமான தீவிரத்தையும் இணைக்கும் நடை. மூலத்தில் உள்ள இடம் மற்றும் போரிழப்பு குறித்த பொருள் அகலத்தை இயன்றவரை பாதுகாக்கிறது.
