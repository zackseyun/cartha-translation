source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲחִיתֹ֖פֶל אֶל אַבְשָׁלֹ֑ם אֶבְחֲרָ֣ה נָּ֗א שְׁנֵים עָשָׂ֥ר אֶ֨לֶף֙ אִ֔ישׁ וְ/אָק֛וּמָה וְ/אֶרְדְּפָ֥ה אַחֲרֵי דָוִ֖ד הַ/לָּֽיְלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/001.yaml
  text: Then Ahithophel said to Absalom[a], “Please let me choose twelve thousand men, and let me arise and pursue David tonight.”
translation:
  language: ta
  text: பின்பு அகித்தோப்பேல் அப்சலோமிடம், “தயவுசெய்து, பன்னிரண்டாயிரம் பேரைத் தேர்ந்தெடுத்து, இன்றிரவே எழுந்து தாவீதைத் துரத்திச் செல்ல எனக்கு அனுமதி தாரும்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, முறைசார்ந்த வகையில்: “தயவுசெய்து, நான் பன்னிரண்டாயிரம் பேரைத் தேர்ந்தெடுப்பேன்; நான் எழுந்து இன்றிரவு தாவீதைத் துரத்திச் செல்வேன்.”'
    reason: கோஹோர்டேட்டிவ் வடிவங்களை வேண்டுகோளாக மொழிபெயர்த்த முதன்மை உரைக்கு மாற்றாக, அவற்றின் வெளிப்படையான முதலாம் நபர் வடிவத்தைத் தருகிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் ‘பின்பு’ நிகழ்வுத் தொடரை இயல்பாகக் காட்டுகிறது.
- source_word: אֲחִיתֹפֶל
  choice: அகித்தோப்பேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் தெளிவாகப் பெயர்த்தெழுதிய வடிவம்.
- source_word: אֶל־אַבְשָׁלֹם
  choice: அப்சலோமிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֶבְחֲרָה נָּא
  choice: தயவுசெய்து ... நான் தேர்ந்தெடுத்துக்கொள்ளவும் ... எனக்கு அனுமதி தாரும்
  rationale: கோஹோர்டேட்டிவ் வினையும் נָא துகளும் சேர்ந்து வெளிப்படுத்தும் பணிவான வேண்டுகோள் அல்லது முன்மொழிவை இயல்பான தமிழில் காக்கிறது.
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: பன்னிரண்டாயிரம் ஆட்கள்
  rationale: אִישׁ என்பதன் பொதுவான பொருளைத் தக்கவைத்து, மூலத்தில் வெளிப்படையாக இல்லாத ‘வீரர்கள்’ என்ற குறிப்பைச் சேர்க்காமல் இருக்கிறது.
- source_word: וְאָקוּמָה
  choice: எழுந்து
  rationale: קום என்பதன் எழுதல் என்ற உருவகத்தைத் தக்கவைத்து, உடனடியாகச் செயலில் இறங்குவதைச் சூழலில் இயல்பாகக் காட்டுகிறது.
- source_word: וְאֶרְדְּפָה אַחֲרֵי דָוִד
  choice: தாவீதைத் துரத்திச் செல்ல
  rationale: רדף மற்றும் אַחֲרֵי ஆகியவற்றின் இராணுவத் துரத்தல் உணர்வைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַלָּיְלָה
  choice: இன்றிரவே
  rationale: குறிப்பிட்டுள்ள அந்த நிகழ்கால இரவைச் சுட்டுகிறது; ‘வே’ உடனடித் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
