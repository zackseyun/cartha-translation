translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. முதல் பன்மைச் சுட்டுப்பெயர் பின்தொடர்ச்சியில் ஏற்படும் குழப்பத்தைத் தவிர்க்க ‘அவர்கள் ... இவர்கள்’ என இரு குழுக்களும் வேறுபடுத்தப்பட்டுள்ளன; அரசரிடம் உரையாடும் பன்மை மரியாதை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
