  text: After they had gone, they came up out of the well and went and told King David. They said to David, “Get up and cross over the water quickly, for this is what Ahithophel has advised against you.”
translation:
  language: ta
  text: அவர்கள் சென்றபின், கிணற்றிலிருந்து மேலே வந்த அவர்கள் தாவீது அரசனிடம் சென்று செய்தியைத் தெரிவித்தார்கள். அவர்கள் தாவீதிடம், “எழுந்து, சீக்கிரமாக அந்த நீரைக் கடந்துபோங்கள்; ஏனெனில் அகித்தோப்பேல் உங்களுக்கு எதிராக இவ்வாறு ஆலோசனை கூறியிருக்கிறான்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵהַבְּאֵר
  choice: கிணற்றிலிருந்து
  rationale: בְּאֵר என்பதன் நேரடியான பொருள் ‘கிணறு’; சூழலில் அவர்கள் மறைந்திருந்த இடத்தைக் குறிக்கிறது.
- source_word: אֶת הַמַּיִם
  choice: நீரைக்
  rationale: மூலத்தில் உள்ள பொதுவான ‘நீர்/நீர்ப்பரப்பு’ என்ற சொல்லைத் தக்கவைத்து, அது யோர்தான் ஆறு என உரையிலேயே வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: מְהֵרָה
  choice: சீக்கிரமாக
  rationale: உடனடி ஆபத்தையும் விரைவாகக் கடக்க வேண்டிய அவசரத்தையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: יָעַץ עֲלֵיכֶם
  choice: உங்களுக்கு எதிராக ... ஆலோசனை கூறியிருக்கிறான்
  rationale: עַל இங்கு தாவீதுக்கும் அவரோடு இருப்பவர்களுக்கும் எதிரான திட்டத்தைக் குறிக்கிறது; நிறைவு பெற்ற ஆலோசனையின் தற்போதைய தொடர்பை ‘கூறியிருக்கிறான்’ வெளிப்படுத்துகிறது.
