translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. மேற்கோள் இயல்பான தமிழ் சொல்வரிசையில் அமைக்கப்பட்டுள்ளது; அடிக்குறிப்பு குறியீடு அது விளக்கும் சொற்றொடருக்குப் பின்பே வைக்கப்பட்டுள்ளது.
