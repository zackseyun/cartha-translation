  yaml_path: translation/ot/2_samuel/017/007.yaml
  text: Then Hushai said to Absalom[a], “The counsel that Ahithophel has given this time is not good.”
translation:
  language: ta
  text: 'அப்பொழுது ஊசாய் அப்சலோமிடம், “அகித்தோப்பேல் இந்த முறை[a] கூறிய ஆலோசனை நல்லதல்ல” என்றான்.


    [a] அல்லது, “இந்தச் சந்தர்ப்பத்தில்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தச் சந்தர்ப்பத்தில்.”
    reason: בַּפַּעַם הַזֹּאת என்பதற்கு ‘இந்த முறை’ என்றும் ‘இந்தச் சந்தர்ப்பத்தில்’ என்றும் பொருள் கொள்ளலாம்; சூழல்சார் மாற்றுப் பொருளைத் தக்கவைக்கிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்பொழுது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் ‘அப்பொழுது’ அதன் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חוּשַׁי
  choice: ஊசாய்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: אֶל־אַבְשָׁלוֹם
  choice: அப்சலோமிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான தமிழ் வேற்றுமை உருபுடன் தெரிவிக்கிறது.
- source_word: לֹא טוֹבָה
  choice: நல்லதல்ல
  rationale: எபிரெயச் சொல்லின் விரிவான மதிப்பீட்டுப் பொருளை நேரடியாகப் பாதுகாக்கிறது; ‘சரியானதல்ல’ அல்லது ‘விவேகமானதல்ல’ எனக் குறுக்கவில்லை.
- source_word: הָעֵצָה
  choice: ஆலோசனை
  rationale: அரசியல் மற்றும் போர்த் தந்திரச் சூழலில் வழங்கப்பட்ட அறிவுரை அல்லது திட்டம் என்ற இரு நிழற்பொருள்களையும் இயல்பாகத் தாங்குகிறது.
- source_word: אֲשֶׁר יָעַץ
  choice: கூறிய
  rationale: ‘ஆலோசனை கூறுதல்’ என்பது இயல்பான நவீன தமிழ் வழக்கு; எபிரெயில் நிறைவுற்ற ஆலோசனைச் செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲחִיתֹפֶל
  choice: அகித்தோப்பேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் அடையாளம் காணத்தக்கவாறு எழுத்துப்பெயர்க்கிறது.
- source_word: בַּפַּעַם הַזֹּאת
  choice: இந்த முறை
  rationale: இச்சூழலில் சுருக்கமாகவும் இயல்பாகவும் பொருந்தும் வழக்குத் தமிழ்; ‘இந்தச் சந்தர்ப்பத்தில்’ என்பதும் சாத்தியமான பொருள் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
