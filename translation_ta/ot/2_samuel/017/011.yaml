base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/011.yaml
  text: But I advise that all Israel be surely gathered to you[a], from Dan to Beersheba, as numerous as the sand that is by the sea, and that you yourself go into battle.
translation:
  language: ta
  text: 'ஆனால் நான் கூறும் ஆலோசனை இதுதான்: தாண் முதல் பெயெர்செபா வரை உள்ள இஸ்ரவேலர் அனைவரும்—கடற்கரை மணலைப்போலத் திரளானவர்கள்—உம்மிடம் நிச்சயமாகத் திரட்டப்படட்டும்; நீரே நேரில் போருக்குச் செல்லுங்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “உமது முகம் போருக்குச் செல்கின்றன.” இது நீரே நேரில் போருக்குச் செல்ல வேண்டும் என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஆனால்
  rationale: முந்தைய அகித்தோப்பேலின் திட்டத்திற்கு மாறான உசாயின் ஆலோசனையை அறிமுகப்படுத்துவதால், சூழலில் உள்ள எதிர்மறைத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יָעַצְתִּי
  choice: நான் கூறும் ஆலோசனை இதுதான்
  rationale: יעץ என்பதன் ‘ஆலோசனை கூறுதல்’ என்ற பேச்சுச் செயலை நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: הֵאָסֹף יֵאָסֵף
  choice: நிச்சயமாகத் திரட்டப்படட்டும்
  rationale: வினையெச்ச முழுவடிவமும் வினைச்சொலும் சேர்ந்த எபிரெய வலியுறுத்தலை ‘நிச்சயமாக’ என்பதன் மூலம் காக்கிறது.
- source_word: עָלֶיךָ
  choice: உம்மிடம்
  rationale: அப்சலோமின் தலைமையின் கீழ் அவரிடம் படை திரள்வதை இயல்பான தமிழில் குறிக்கிறது.
- source_word: כָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: முழு மக்களையும் அல்லது போர்ப் படையையும் குறிக்கும் மொத்தப்படுத்தும் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: தாண்முதல் பெயெர்செபாவரை உள்ள
  rationale: இஸ்ரவேலின் முழு நிலப்பரப்பையும் குறிக்கும் வழக்கமான புவியியல் இருமுனைக் குறிப்பைத் தக்கவைக்கிறது.
- source_word: כַּחוֹל אֲשֶׁר עַל הַיָּם לָרֹב
  choice: கடற்கரை மணலைப்போலத் திரளானவர்கள்
  rationale: மிகப் பெரும் எண்ணிக்கையைச் சுட்டும் மூல உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: וּפָנֶיךָ הֹלְכִים
  choice: நீரே நேரில் ... செல்லும்
  rationale: சொல்லுக்குச் சொல் ‘உமது முகம் செல்கிறது’ என்பதற்குப் பதிலாக, அப்சலோம் தனிப்பட்ட முறையில் செல்வதைச் சுட்டும் மரபுத்தொடரின் பொருளை அளிக்கிறது; ‘நீரே’ வலியுறுத்தலைக் காக்கிறது.
- source_word: בַּקְרָב
  choice: போருக்குச்
  rationale: இராணுவச் சூழலில் קרב குறிக்கும் போர் அல்லது மோதலை இயல்பான தமிழில் தருகிறது.
