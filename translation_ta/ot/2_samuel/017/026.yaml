  source_fidelity: வַיִּחַן என்பதன் ‘முகாமிட்டார்கள்’ மொழிபெயர்ப்பு துல்லியமானது. எபிரெயத்தில் ஒருமை வினை இருந்தாலும், ‘இஸ்ரவேல் மற்றும் அப்சலோம்’ என்ற இணைந்த எழுவாயை நவீனத் தமிழில் பன்மை வினையால் வழங்குவது இயல்பானதும் பொருளுக்கு உண்மையானதும் ஆகும். אֶרֶץ הַגִּלְעָד ‘கீலேயாத் நாடு’ எனச் சரியாகக் கொடுக்கப்பட்டுள்ளது.
