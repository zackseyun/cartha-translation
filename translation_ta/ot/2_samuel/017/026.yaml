translation:
  language: ta
  text: இஸ்ரவேலரும் அப்சலோமும் கீலேயாத் நாட்டில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַן
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது முகாம் அமைத்துத் தங்குவதைக் குறிக்கிறது. எபிரெயத்தில் வினை ஒருமையில் இருந்தாலும், ‘இஸ்ரவேலும் அப்சலோமும்’ என்ற கூட்டு எழுவாய்க்கு இயல்பான நவீனத் தமிழில் பன்மை வினை பயன்படுத்தப்பட்டது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேலர்
  rationale: இங்கு ‘இஸ்ரவேல்’ என்பது அப்சலோமுடன் இருந்த இஸ்ரவேல் மக்களையோ படையையோ கூட்டாகக் குறிக்கிறது; தமிழில் மக்கள் தொகுப்பைக் காட்ட ‘இஸ்ரவேலர்’ இயல்பாக உள்ளது.
- source_word: וְאַבְשָׁלֹם
  choice: அப்சலோமும்
  rationale: וְ இணைப்பை ‘-உம்’ மூலம் வெளிப்படுத்தி, அப்சலோமை இஸ்ரவேலருடன் கூட்டு எழுவாயாக இணைக்கிறது.
- source_word: אֶרֶץ הַגִּלְעָד
  choice: கீலேயாத் நாட்டில்
  rationale: אֶרֶץ இங்கு நிலப்பகுதி அல்லது நாடு என்ற பொருளில் வருகிறது. ‘கீலேயாத் நாட்டில்’ என்பது புவியியல் குறிப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. இராணுவச் சூழலை ‘முகாமிட்டார்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
