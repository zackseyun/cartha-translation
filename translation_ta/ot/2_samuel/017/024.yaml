translation_notes:
  register: நவீன நிலையான தமிழ்; வரலாற்றுக் கதையாடலுக்கேற்ற கண்ணியமான, எளிதில் புரியும் நடை. தாவீதுக்கு மரியாதைப் பன்மையும் அப்சலோமுக்கு இயல்பான ஒருமையும் பயன்படுத்தப்பட்டுள்ளன; இது தமிழ் நடையின் சமூக மரபு சார்ந்த வேறுபாடு, எபிரெய வினை வடிவிலுள்ள வேறுபாடு அல்ல.
