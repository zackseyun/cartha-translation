  yaml_path: translation/ot/2_samuel/017/024.yaml
  text: Then David came to Mahanaim, and Absalom crossed the Jordan, he and all the men of Israel with him.
translation:
  language: ta
  text: பின்பு தாவீது மகனாயீமுக்கு வந்தார்; அப்சலோமும், அவனுடன் இஸ்ரவேலின் ஆண்கள் அனைவரும், யோர்தான் ஆற்றைக் கடந்தனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא
  choice: வந்தார்
  rationale: בוא என்பதன் கால் முற்றுவினை இங்கு ஒரு குறிப்பிட்ட இடத்தை நோக்கி வந்து சேர்வதைக் குறிக்கிறது. தமிழ்க் கதையாடலில் ‘வந்தார்’ இயல்பாக உள்ளது; தாவீதைக் குறிக்கும் மரியாதைப் பன்மை நவீனத் தமிழுக்கு ஏற்றது.
- source_word: מַחֲנָיְמָה
  choice: மகனாயீமுக்கு
  rationale: இடப்பெயருடன் இணைந்துள்ள திசைகாட்டும் ה, அந்த இடத்தை நோக்கிய நகர்வைக் குறிக்கிறது. அதனைத் தமிழில் ‘-க்கு’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עָבַר אֶת־הַיַּרְדֵּן
  choice: யோர்தானைக் கடந்தான்
  rationale: עבר, யோர்தானை நேரடிப் பொருளாகக் கொண்டு, ஆற்றின் மறுகரைக்குக் கடந்து செல்வதைக் குறிக்கிறது. ‘கடந்தான்’ சுருக்கமானதும் இயல்பானதும் ஆகும்.
- source_word: הוּא
  choice: அப்சலோமோ
  rationale: வினைக்குப் பின் வரும் தனிப்பெயர்ச்சொல், அப்சலோமையும் அவனுடன் சென்றவர்களையும் தனித்துக் காட்டுகிறது. தமிழில் எழுவாயான ‘அப்சலோமோ’ என்பதுடன் அடுத்துள்ள உடனிகழ்ச்சித் தொடர் இதன் வலியுறுத்தலை இயல்பாகக் காக்கிறது.
- source_word: כָל־אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஆண்கள் அனைவரோடும்
  rationale: כָל־אִישׁ என்பது ஒருமை வடிவில் அமைந்த கூட்டுப்பொருள் தொடர்; சூழலில் அப்சலோமுடன் சென்ற ஆண் அணியினரைக் குறிக்கிறது. ‘மக்கள்’ என்று பொதுமைப்படுத்தாமல் ஆண்பால் குறிப்பைக் காக்க ‘ஆண்கள் அனைவரும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עִמּוֹ
  choice: தன்னுடன் இருந்த … அனைவரோடும்
  rationale: உடனிருப்பையும் உடன்செல்லுதலையும் குறிக்கும் עִם + பின்னொட்டு, தமிழில் ‘தன்னுடன் … அனைவரோடும்’ என இயல்பாக வெளிப்படுகிறது.
- source_word: וְ
  choice: பின்பு / -ஓ
  rationale: முதல் ו கதையின் அடுத்த நிகழ்வை முன்னெடுப்பதால் ‘பின்பு’ எனவும், இரண்டாவது வாக்கியப் பகுதியின் எழுவாய் மாறுதலைத் தமிழில் இயல்பாகக் காட்ட ‘அப்சலோமோ’ எனவும் வழங்கப்பட்டுள்ளது.
