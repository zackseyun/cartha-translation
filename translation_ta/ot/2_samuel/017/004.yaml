  naturalness: “அந்த ஆலோசனை அப்சலோமின் பார்வையிலும் இஸ்ரவேலின் மூப்பர்கள் அனைவரின் பார்வையிலும் நல்லதாகத் தோன்றியது” என்பது நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமான வேதாகம நடையுடனும் உள்ளது. மீண்டும் வரும் “பார்வையிலும்” சற்றே மூலநோக்குடையது; ஆனால் இவ்வசனத்தில் எபிரெய மீளுரைப்பை உண்மையாகப் பாதுகாக்கிறது; இயல்புக்கு இடையூறல்ல.
