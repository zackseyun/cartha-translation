  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவில் தரப்படுகிறது.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மூப்பர்கள் அனைவரும்
  rationale: זִקְנֵי என்பது வெறுமனே வயதான ஆண்களை அல்ல, அங்கீகரிக்கப்பட்ட சமூகத் தலைவர்களைக் குறிக்கிறது; כָּל என்பதன் முழுமையும் ‘அனைவரும்’ மூலம் வெளிப்படுகிறது.
