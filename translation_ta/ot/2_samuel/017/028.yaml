translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியலின் தொடர்ச்சியும் எபிரெய மூலத்தில் கָלִי இருமுறை வருவதும் பாதுகாக்கப்பட்டுள்ளன. வாக்கியம் முந்தைய வசனத்திலிருந்து தொடர்வதால், தமிழில் முழுமையான வாக்கியமாகப் புரிய ‘ஆகியவற்றைக் கொண்டுவந்தார்கள்’ சேர்க்கப்பட்டுள்ளது.
