base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/028.yaml
  text: beds[a], basins, and pottery vessels, and wheat, barley, flour[b], roasted grain, beans, lentils[d][c], and parched grain.
translation:
  language: ta
  text: படுக்கைகள், கிண்ணங்கள்[a], மண்பாண்டங்கள்[b], கோதுமை, வாற்கோதுமை, மாவு, வறுத்த தானியம், அவரைக்கொட்டைகள்[c], மசூர்ப் பருப்பு, வறுத்த தானியம் ஆகியவற்றைக் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெரிய கிண்ணங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “குயவரின் பாத்திரங்கள்”; அதாவது, சுடுமண்ணால் செய்யப்பட்ட பாத்திரங்கள்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயச் சொல் குறிப்பாக அகன்ற அவரை வகையான ஃபாவா மொச்சையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁכָּב
  choice: படுக்கைகள்
  rationale: படுத்துக்கொள்ளும் இடம் அல்லது படுக்கைப் பொருளைக் குறிக்கும் கூட்டுப்பொருள் இங்கு பொருட்களின் பட்டியலில் இயல்பாகப் பன்மையில் மொழிபெயர்க்கப்பட்டது.
- source_word: סַפּוֹת
  choice: கிண்ணங்கள்
  rationale: வீட்டுப் பயன்பாட்டுப் பாத்திரங்களைக் குறிக்கும் இச்சொல்லுக்கு நவீனத் தமிழில் எளிதில் புரியும் இயல்பான சொல்; ‘தொட்டிகள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: כְלִי יוֹצֵר
  choice: மண்பாண்டங்கள்
  rationale: சொல்லுக்கு சொல் ‘குயவரின் பாத்திரங்கள்’; பொருளடிப்படையில் சுடுமண்ணால் செய்யப்பட்ட பாத்திரங்களைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: חִטִּים
  choice: கோதுமை
  rationale: குறிப்பிடப்பட்ட தானியத்திற்கான நிலையான நவீனத் தமிழ்ச் சொல்.
- source_word: שְׂעֹרִים
  choice: வாற்கோதுமை
  rationale: Barley எனும் தானியத்திற்கான நிலையான தமிழ்ப் பெயர்.
- source_word: קֶמַח
  choice: மாவு
  rationale: அரைக்கப்பட்ட தானியத்தைக் குறிக்கும் தெளிவான பொதுத் தமிழ்ச் சொல்.
- source_word: קָלִי
  choice: வறுத்த தானியம்
  rationale: நெருப்பில் வறுத்தோ உலர்வாகப் பொரித்தோ தயாரிக்கப்பட்ட தானிய உணவைக் குறிக்கிறது; எபிரெய உரையில் இருமுறை வருவதால் தமிழிலும் இருமுறை ஒரேபடி வைக்கப்பட்டது.
- source_word: פּוֹל
  choice: அவரைக்கொட்டைகள்
  rationale: பொதுவாகப் பயறு/பீன்ஸ் வகையைக் குறித்தாலும், குறிப்பாக broad bean அல்லது fava bean என்பதே சாத்தியம்; ‘அவரைக்கொட்டைகள்’ அந்தச் சிறப்புப் பொருளைத் தமிழில் நெருக்கமாகக் காட்டுகிறது.
- source_word: עֲדָשִׁים
  choice: பருப்பு
  rationale: Lentils எனப்படும் உணவுப் பயற்றைக் குறிக்கும் இயல்பான, பரவலாகப் புரியும் தமிழ்ச் சொல்.
