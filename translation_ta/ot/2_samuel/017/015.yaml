revisions:
- from: 'பின்பு ஊசாய் சாதோக்கிடமும் அபியத்தாரிடமும்—அந்த ஆசாரியர்களிடம்—இவ்வாறு சொன்னார்: “அகித்தோப்பெல் அப்சலோமுக்கும் இஸ்ரவேலின் மூப்பர்களுக்கும் இன்னின்ன விதமாக ஆலோசனை கூறினார்; நானோ இன்னின்ன விதமாக ஆலோசனை கூறினேன்.”[a]'
  to: 'பின்பு ஊசாய், ஆசாரியர்களான சாதோக்கிடமும் அபியத்தாரிடமும் கூறினார்: “அகித்தோப்பேல் அப்சலோமுக்கும் இஸ்ரவேலின் மூப்பர்களுக்கும் இன்னின்னவாறு[a] ஆலோசனை கூறினார்; நானோ இன்னின்னவாறு ஆலோசனை கூறினேன்.”'
