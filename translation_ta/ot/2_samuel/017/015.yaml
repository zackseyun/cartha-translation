base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/015.yaml
  text: Then Hushai said to Zadok and to Abiathar the priests[a], “This and that is what Ahithophel advised Absalom and the elders of Israel, and this and that is what I have advised.”
translation:
  language: ta
  text: 'பின்பு ஊசாய், ஆசாரியர்களான சாதோக்கிடமும் அபியத்தாரிடமும் கூறினார்: “அகித்தோப்பேல் அப்சலோமுக்கும் இஸ்ரவேலின் மூப்பர்களுக்கும் இன்னின்னவாறு[a] ஆலோசனை கூறினார்; நானோ இன்னின்னவாறு ஆலோசனை கூறினேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இன்னின்னவாறு” என்பது, கூறப்பட்டவற்றை வார்த்தைக்கு வார்த்தை மீண்டும் சொல்லாமல் அவற்றின் சாரத்தைச் சுட்டும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... இவ்வாறு சொன்னார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘பின்பு’ அதன் தொடர் ஓட்டத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: חוּשַׁי
  choice: ஊசாய்
  rationale: எபிரெயப் பெயரின் ஒலிக்கு நெருக்கமான, தமிழில் வாசிக்க ஏற்ற ஒலிபெயர்ப்பு.
- source_word: אֶל צָדוֹק וְאֶל אֶבְיָתָר הַכֹּהֲנִים
  choice: சாதோக்கிடமும் அபியத்தாரிடமும்—அந்த ஆசாரியர்களிடம்—
  rationale: இரு பெயர்களுக்கும் முன் வரும் אֶל என்பதையும், ‘ஆசாரியர்கள்’ என்பது இருவரையும் குறிக்கும் இணைப்புச் சொல்லாக இருப்பதையும் தெளிவாக்குகிறது.
- source_word: כָּזֹאת וְכָזֹאת
  choice: இன்னின்ன விதமாக
  rationale: சொன்னவற்றை வார்த்தைக்கு வார்த்தை மீண்டும் கூறாமல் அதன் சாரத்தைச் சுட்டும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָעַץ
  choice: ஆலோசனை கூறினார்
  rationale: அரசியல் மற்றும் போர்த் திட்டச் சூழலில் மூல வினையின் ‘ஆலோசனை வழங்குதல்’ என்ற பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֶת אַבְשָׁלֹם וְאֵת זִקְנֵי יִשְׂרָאֵל
  choice: அப்சலோமுக்கும் இஸ்ரவேலின் மூப்பர்களுக்கும்
  rationale: ஆலோசனை யாருக்குக் கூறப்பட்டது என்பதைத் தமிழில் இயல்பான நான்காம் வேற்றுமையால் தெரிவிக்கிறது.
- source_word: יָעַצְתִּי אָנִי
  choice: நானோ ... ஆலோசனை கூறினேன்
  rationale: தனிப்பட்ட சுட்டுப்பெயரான אָנִי தரும் வலியுறுத்தலையும் அகித்தோப்பெலுடனான எதிர்மறை ஒப்பீட்டையும் ‘நானோ’ பாதுகாக்கிறது.
