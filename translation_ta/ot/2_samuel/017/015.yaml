translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க கதைநடைப் பாணியிலும் வடிவமைக்கப்பட்டது. பெயர்கள் எபிரெய ஒலியமைப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளன; ‘நானோ’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது.
