- source_word: אַף כִּי
  choice: அப்படியானால்
  rationale: முந்தைய வசனத்தின் குறைந்த நிலையிலிருந்து இவ்வசனத்தின் மிகக் கொடிய நிலைக்குச் செல்லும் ‘அதிலும் எவ்வளவு அதிகமாக’ என்ற வலியுறுத்திய தர்க்கத்தை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது; அதன் முழு நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲנָשִׁים רְשָׁעִים
  choice: பொல்லாத மனிதர்கள்
  rationale: கொலையாளிகளைப் பற்றிய தெளிவான அறநெறிக் கண்டனத்தை நவீன, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָרְגוּ
  choice: கொன்றிருக்கும்போது
  rationale: முடிவுற்ற கொலைச் செயலையும், தாவீதின் தற்போதைய தீர்ப்புக்கு அது கொண்டுள்ள தொடர்பையும் காட்டுகிறது; ‘கொலைசெய்தார்கள்’ என்று மொழிபெயர்த்து எபிரெயப் பொதுவினையின் பொருளை தேவையின்றி குறுக்கவில்லை.
- source_word: אִישׁ צַדִּיק
  choice: நீதிமானான ஒருவரை
  rationale: צַדִּיק என்பதன் அடிப்படை அறநெறி மற்றும் நீதி சார்ந்த பொருளைப் பேணுகிறது; சூழலில் அவர் இப்படிக் கொல்லப்படத் தகுதியற்றவர் என்பதையும் உணர்த்துகிறது.
- source_word: בְּבֵיתוֹ עַל מִשְׁכָּבוֹ
  choice: அவரது சொந்த வீட்டில், அவரது படுக்கையின்மேல்
  rationale: பலியானவர் பாதுகாப்பாக இருக்க வேண்டிய சொந்த வீட்டிலும் படுக்கையிலும் கொல்லப்பட்டதன் கொடுமையை, மூலத்தின் உடைமைச் சுட்டுகளுடன் நேரடியாகக் காட்டுகிறது.
- source_word: הֲלוֹא אֲבַקֵּשׁ אֶת דָּמוֹ מִיֶּדְכֶם
  choice: அவருடைய இரத்தத்துக்காக உங்களிடம் நான் இப்போது கணக்குக் கேட்டு ... மாட்டேனா?
  rationale: ‘அவருடைய இரத்தத்தை உங்கள் கையிலிருந்து கேட்பேன்’ என்ற எபிரெய நீதித்துறைச் சொற்றொடரின் பொருளை இயல்பான தமிழில் தருகிறது; ‘இரத்தம்’ என்ற முக்கிய உருவகத்தைப் பேணுகிறது.
- source_word: וּבִעַרְתִּי אֶתְכֶם מִן הָאָרֶץ
  choice: உங்களை நாட்டிலிருந்து ஒழித்துக்கட்ட
  rationale: בער என்பதிலுள்ள தீமையை முற்றிலும் அகற்றும் நீதித்துறை வலிமையைப் பேணுகிறது; இங்கு வெறும் இடமாற்றம் அல்ல, மரணத் தண்டனையால் அகற்றுதல் குறிக்கப்படுகிறது.
theological_decisions:
- issue: தாவீதின் செயலைத் தனிப்பட்ட பழிவாங்கலாக மொழிபெயர்ப்பதா, அல்லது இரத்தப்பழிக்கான நீதிசார் பொறுப்பாகப் பேணுவதா
  choice: ‘அவருடைய இரத்தத்துக்காக உங்களிடம் கணக்குக் கேட்டு’ என்று நீதிசார் பொறுப்பின் மொழியைப் பயன்படுத்துதல்
  alternative: ‘அவருடைய இரத்தத்துக்குப் பழிவாங்கி’
  rationale: மூலச் சொற்றொடர் தனிப்பட்ட பழிவாங்கலை மட்டும் குறிக்காமல், சிந்தப்பட்ட இரத்தத்துக்கான சட்ட மற்றும் அறநெறிப் பொறுப்பைக் கோருகிறது.
- issue: ‘நாட்டிலிருந்து ஒழித்துக்கட்டுதல்’ என்பது சடங்குத் தூய்மைப்படுத்தலா அல்லது நீதித்துறை அகற்றுதலா
  choice: கொலையாளிகளை நீதித்தீர்ப்பினால் நாட்டிலிருந்து முற்றிலும் அகற்றுதல்
  alternative: சடங்கு முறையில் நாட்டைத் தூய்மைப்படுத்துதல் மட்டும்
  rationale: சூழலில் தாவீது கொலையாளிகளுக்குத் தண்டனை விதிக்கிறார்; ஆகவே வினைச்சொல் நீதித்துறை அகற்றுதலைக் குறிக்கிறது, சடங்குத் தூய்மையை மட்டும் அல்ல.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நீதித்துறைத் தொனி பேணப்பட்டுள்ளது. ‘அப்படியானால்’ இயல்பான தமிழ் தர்க்கத் தொடர்பை வழங்குகிறது; மூலத்தின் வலியுறுத்திய ‘அதிலும் எவ்வளவு அதிகமாக’ என்ற நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. ‘இரத்தம்’ என்ற வேதாகமச் சட்ட உருவகம் பிரதான உரையிலேயே வைக்கப்பட்டுள்ளது.
