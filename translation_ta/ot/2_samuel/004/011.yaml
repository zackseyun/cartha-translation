base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/011.yaml
  text: How much more[a], when wicked men have killed a righteous man in his own house on his bed[b], should I not now require his blood from your hand and purge you from the land?
translation:
  language: ta
  text: அதிலும் எவ்வளவு அதிகமாக[a], தீய மனிதர்கள் ஒரு நீதிமானைத் தன் சொந்த வீட்டில், தன் படுக்கையில் கொன்றிருக்கும்போது, அவருடைய இரத்தத்திற்காக உங்களிடத்தில் நான் இப்போது கணக்குக் கேட்டு[b], உங்களை நாட்டிலிருந்து ஒழித்துக்கட்டுவேனல்லவா[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘அதிலும் எவ்வளவு அதிகமாக.’ முந்தைய வசனத்தில் கூறப்பட்ட குறைந்த குற்றத்திலிருந்து இங்குள்ள மிகக் கொடிய குற்றத்திற்குத் தாவீது வாதிடுகிறார்.
    reason: discourse_logic
  - marker: b
    text: சொல்லர்த்தமாக, ‘அவருடைய இரத்தத்தை உங்கள் கையிலிருந்து கேட்பேன்.’ இது சிந்தப்பட்ட இரத்தத்துக்காக ஒருவரைப் பொறுப்பாளியாக்குவதைக் குறிக்கும் எபிரெயச் சொற்றொடர்.
    reason: lexical_alternative
  - marker: c
    text: ‘நாட்டிலிருந்து ஒழித்துக்கட்டுதல்’ என்பது கொலையாளிகளை நீதித்தீர்ப்பினால் நாட்டிலிருந்து அகற்றுவதைக் குறிக்கிறது; சடங்குத் தூய்மைப்படுத்தலை மட்டும் அல்ல.
    reason: cultural_note
