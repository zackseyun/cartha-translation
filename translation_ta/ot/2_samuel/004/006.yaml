base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/006.yaml
  text: And there they came into the midst of the house[a], taking wheat, and they struck him in the belly. Then Rekab and Baanah his brother escaped.
translation:
  language: ta
  text: அங்கே அவர்கள் கோதுமை எடுத்துக்கொள்கிறவர்களாக வீட்டின் உட்பகுதிவரை சென்று, அவனை வயிற்றில்[a] தாக்கினார்கள். பின்பு ரேகாபும் அவனுடைய சகோதரனான பானாவும் தப்பிச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பாரம்பரிய மொழிபெயர்ப்பின்படி, “ஐந்தாம் விலா எலும்பின் கீழ்.” எபிரெயச் சொற்றொடர் பொதுவாக வயிறு அல்லது அடிவயிற்றுப் பகுதியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנָּה
  choice: அங்கே
  rationale: இடத்தைக் குறித்தபடி அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது; நவீன தமிழில் இயல்பில்லாத வியப்புச் சொல்லைச் சேர்க்காமல் கதையின் நகர்வைப் பாதுகாக்கிறது.
- source_word: בָּאוּ עַד תּוֹךְ הַבַּיִת
  choice: வீட்டின் உட்பகுதிவரை சென்று
  rationale: עַד மற்றும் תּוֹךְ ஆகியவை அவர்கள் வீட்டின் உள்ளே ஆழமாகச் சென்றதைக் காட்டுகின்றன. தமிழில் இயல்பான இயக்கத்தைத் தெரிவிக்க ‘சென்று’ பயன்படுத்தப்பட்டது.
- source_word: לֹקְחֵי חִטִּים
  choice: கோதுமை எடுத்துக்கொள்கிறவர்களாய்
  rationale: எபிரெயப் பங்கேற்புப் பெயரெச்சத் தொடரின் சுருக்கமான தன்மையைப் பாதுகாக்கிறது. இது உண்மையான செயல் அல்லது உள்ளே நுழைவதற்கான தோற்றம் என்ற இரு வாசிப்புகளையும் முற்றிலும் மூடிவிடாமல் வைக்கிறது.
- source_word: וַיַּכֻּהוּ
  choice: அவனை … தாக்கினார்கள்
  rationale: נכה என்பதன் அடிப்படைப் பொருள் தாக்குதல் அல்லது அடித்தல். சூழலில் மரணம் ஏற்பட்டாலும், இவ்விடத்தில் நேரடியாக ‘கொன்றார்கள்’ என்று மொழிபெயர்ப்பது மூலத்தின் சொற்பொருளை மீறும்.
- source_word: אֶל הַחֹמֶשׁ
  choice: வயிற்றுப் பகுதியில்
  rationale: חֹמֶשׁ இங்கு உடலின் வயிறு அல்லது அடிவயிற்றுப் பகுதியைக் குறிக்கும் வாய்ப்பு அதிகம். ‘ஐந்தாம் விலா எலும்பின் கீழ்’ என்ற பாரம்பரிய மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְרֵכָב וּבַעֲנָה אָחִיו
  choice: ரேகாபும் அவன் சகோதரன் பானாவும்
  rationale: பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; אָחִיו குறிக்கும் சகோதர உறவும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: נִמְלָטוּ
  choice: தப்பிச் சென்றார்கள்
  rationale: மלט என்பதன் நிபால் வடிவம் ஆபத்திலிருந்து வெற்றிகரமாகத் தப்புவதைத் தெரிவிக்கிறது; இச்சூழலுக்கு இயல்பான நவீன தமிழ் இது.
