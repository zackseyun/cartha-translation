base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/004.yaml
  text: Jonathan son of Saul had a son crippled in his feet. He was five years old when the news about Saul and Jonathan came from Jezreel[a], and his nurse picked him up and fled. And as she hurried to flee, he fell and became lame. His name was Mephibosheth.
translation:
  language: ta
  text: சவுலின் மகன் யோனத்தானுக்கு இரண்டு கால்களும் ஊனமுற்ற ஒரு மகன் இருந்தான்.[a] சவுலையும் யோனத்தானையும் பற்றிய செய்தி யெஸ்ரயேலிலிருந்து வந்தபோது, அவனுக்கு ஐந்து வயது. அவனைப் பராமரித்துவந்த பெண் அவனைத் தூக்கிக்கொண்டு தப்பியோடினாள். அவள் அவசரமாகத் தப்பியோடியபோது, அவன் கீழே விழுந்து நொண்டியானான். அவன் பெயர் மேவிபோசேத்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரைச் சொல்லுக்குச் சொல் மொழிபெயர்த்தால், “கால்களில் தாக்கப்பட்டவன்” என வரும்; “இரு கால்களிலும் நொண்டியானவன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְכֵה רַגְלָיִם
  choice: இரண்டு கால்களும் ஊனமுற்ற
  rationale: רַגְלָיִם என்பது இருமை வடிவில் ‘இரண்டு கால்கள்’ எனக் குறிக்கிறது; נְכֵה உடல் பாதிப்பைக் குறிக்கிறது. நவீனத் தமிழில் தெளிவாகவும் இழிவுபடுத்தாத வகையிலும் மொழிபெயர்க்கப்பட்டது.
- source_word: בֶּן חָמֵשׁ שָׁנִים
  choice: அவனுக்கு ஐந்து வயது
  rationale: வயதைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கான இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: בְּבֹא שְׁמֻעַת שָׁאוּל וִיהוֹנָתָן מִיִּזְרְעֶאל
  choice: சவுலையும் யோனத்தானையும் பற்றிய செய்தி யெஸ்ரயேலிலிருந்து வந்தபோது
  rationale: செய்தி எதைப் பற்றியது என்பதை மூலத்தைவிட அதிகமாக—உதாரணமாக அவர்களது மரணம் என்று—விளக்காமல், construct தொடரின் பொருளையும் מן குறிக்கும் தோற்ற இடத்தையும் பாதுகாக்கிறது.
- source_word: אֹמַנְתּוֹ
  choice: அவனைப் பராமரித்துவந்த பெண்
  rationale: குழந்தையைப் பேணி வளர்க்கும் பெண்ணைக் குறிக்கும் சொல். தமிழில் ‘செவிலி’ என்பது மருத்துவப் பணியாளரையும் குறிக்கக்கூடும் என்பதால் சூழலுக்கேற்ற தெளிவான விளக்க வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַתִּשָּׂאֵהוּ וַתָּנֹס
  choice: அவனைத் தூக்கிக்கொண்டு தப்பியோடினாள்
  rationale: ‘தூக்குதல்/சுமத்தல்’ மற்றும் ‘ஓடித் தப்புதல்’ என்ற தொடர்ச்சியான செயல்களை இயல்பான தமிழ் நடையில் இணைக்கிறது.
- source_word: בְּחָפְזָהּ לָנוּס
  choice: அவள் அவசரமாகத் தப்பியோடியபோது
  rationale: அவசரத்தின் சூழ்நிலையையும் தப்பியோடும் செயலைவும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַיִּפֹּל וַיִּפָּסֵחַ
  choice: அவன் கீழே விழுந்து நடக்க முடியாதவனானான்
  rationale: ஆண்பால் ஒருமை வினைகள் குழந்தையையே எழுவாயாகக் காட்டுகின்றன. פסח இங்கு விழுந்ததன் விளைவாக ஏற்பட்ட நடைத் திறன் பாதிப்பைக் குறிக்கிறது.
- source_word: מְפִיבֹשֶׁת
  choice: மேவிபோசேத்
  rationale: எபிரெயப் பெயரின் ஒலிக்கு நெருக்கமான, தமிழில் வாசிக்கத்தக்க ஒலிபெயர்ப்பு.
