  text: But David answered Rekab and Baanah his brother[a], the sons of Rimmon the Beerothite, and said to them, “As Yahweh lives, who has redeemed my life out of every distress,
translation:
  language: ta
  text: 'அதற்கு தாவீது, பேரோத்தியனான ரிம்மோனின் மகன்களான ரேகாபுக்கும் அவனுடைய சகோதரன் பானாவுக்கும் பதிலளித்துச் சொன்னான்: “எல்லா நெருக்கடியிலிருந்தும் என் உயிரை மீட்ட யாவே[a] உயிரோடிருக்கிறபடியால்,”'
  philosophy: optimal-equivalence
