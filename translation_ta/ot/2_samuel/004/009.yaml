    text: 'எபிரெயம்: “YHWH”; மரபாக, “கர்த்தர்” என்றும் வழங்கப்படுகிறது.'
    reason: இறைப் பெயரின் மூல வடிவத்தையும் பரவலான மாற்று மொழிபெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיַּעַן
  choice: மறுமொழியாக ... சொன்னான்
  rationale: இந்த வினைச்சொல் உரையாடலில் பதிலுரையை அறிமுகப்படுத்துகிறது; நவீன தமிழில் இயல்பாக அமைய, ‘நோக்கி ... சொன்னான்’ என்ற வாக்கிய அமைப்பில் அதன் பதிலுரைத் தன்மை வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: רֵכָב וְאֶת־בַּעֲנָה אָחִיו
  choice: ரேகாபையும் அவன் சகோதரன் பானாவையும்
  rationale: ஆண் ஒருமை பின்னொட்டு ரேகாபின் சகோதரனாகப் பானாவைக் குறிப்பிடுகிறது. பெயர்கள் எபிரெய ஒலிப்புக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: பேரோத்தியனான ரிம்மோனின் மகன்கள்
  rationale: இச்சொற்றொடர் அவர்களுடைய தந்தையையும் அவரது ஊர்சார் அடையாளத்தையும் குறிப்பிடுகிறது; தமிழ் உறவுமுறைத் தொடரில் தெளிவாக அமைக்கப்பட்டுள்ளது.
- source_word: חַי יְהוָה
  choice: யாவே உயிருள்ளவர் என்பதுபோல் உறுதியாகச் சொல்கிறேன்
  rationale: இது ஒரு முறையான ஆணைச் சூத்திரம். அதன் சொற்பொருளையும் ஆணையின் உறுதிப்படுத்தும் வலிமையையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், அதன் வழக்கமான தமிழ் எழுத்துப்பெயர்ப்பாக வழங்குகிறது.
- source_word: פָּדָה
  choice: மீட்ட
  rationale: இங்கு ஆபத்திலிருந்து விலைகொடுத்து மீட்பதுபோன்ற விடுதலைப் பொருள் உள்ளது; ‘மீட்ட’ என்பது அந்தச் செறிவையும் தமிழின் இயல்பையும் காக்கிறது.
- source_word: נַפְשִׁי
  choice: என் உயிரை
  rationale: சூழலில் נֶפֶשׁ என்பது உடலிலிருந்து வேறான ‘ஆத்துமா’ என்பதைவிட, ஆபத்தில் இருந்த தாவீதின் உயிரையே குறிக்கிறது.
- source_word: מִכָּל־צָרָה
  choice: எல்லா நெருக்கடியிலிருந்தும்
  rationale: כָּל என்பதன் முழுமையையும் צָרָה என்பதன் துன்பம் அல்லது நெருக்கடி சார்ந்த பொருளையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ‘யாவே’ என்று எழுத்துப்பெயர்ப்பது பெயருக்கும் பட்டத்திற்கும் உள்ள வேறுபாட்டைக் காக்கிறது; பரவலான மரபு வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: פדה என்பதின் மீட்பு சார்ந்த வலிமை
  choice: மீட்ட
  alternative: விடுவித்த
  rationale: ‘மீட்ட’ என்பது வெறும் தப்புவித்தல் மட்டுமல்லாமல், மூல வேரில் உள்ள மீட்பு சார்ந்த நுண்பொருளையும் பாதுகாக்கிறது; ஆனால் இங்கு மீட்பின் முறை குறிப்பாக வரையறுக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வரலாற்றுக் கதையாடலுக்கேற்ற கண்ணியமான நடையும் நேரடியான சொற்களும் பயன்படுத்தப்பட்டுள்ளன. எபிரெய ஆணைச் சூத்திரம் சொற்சொல்லாக இறுக்கமாக இல்லாமல், அதன் உறுதியும் உயிருள்ள இறைவனைச் சாட்சியாகக் கொள்ளும் உணர்வும் தெளிவாக வெளிப்படும் வகையில் மொழியாக்கப்பட்டுள்ளது. அடுத்த வசனத்தில் தொடரும் உரையைச் சுட்ட, முடிவில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது.
