base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/007.yaml
  text: They came into the house while he was lying on his bed in his bedroom[a], and they struck him and put him to death. Then they removed his head, took his head[c][b], and went by way of the Arabah all night.
translation:
  language: ta
  text: அவர்கள் வீட்டுக்குள் வந்தார்கள்; அவன் தனது படுக்கையறையில்[a] தனது படுக்கையின்மேல் படுத்திருந்தான். அவர்கள் அவனை அடித்தார்கள்; அவனைக் கொன்றார்கள். பிறகு அவர்கள் அவனுடைய தலையை அகற்றி[b], அவனுடைய தலையை எடுத்துக்கொண்டு, அராபா[c] வழியாக இரவு முழுவதும் பயணம் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் தூங்கும் அறையில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனுடைய தலையை வெட்டித் துண்டித்து.” எபிரெயத்தில் நேரடியாக, “அவனுடைய தலையை அகற்றி.”
    reason: lexical_alternative
  - marker: c
    text: “அராபா” என்பது யோர்தான் பிளவுப் பள்ளத்தாக்கின் சமவெளிப் பகுதிக்கான புவியியல் பெயர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ הַבַּיִת
  choice: அவர்கள் வீட்டுக்குள் வந்தபோது
  rationale: בוא உடன் வரும் הַבַּיִת வீட்டினுள் நுழையும் இயக்கத்தைக் குறிக்கிறது. அடுத்த சூழ்நிலைக் கூற்றுடன் இயல்பாக இணைக்க ‘வந்தபோது’ பயன்படுத்தப்பட்டது.
- source_word: וְהוּא שֹׁכֵב עַל מִטָּתוֹ
  choice: அவன் தனது படுக்கையறையில் படுக்கையின்மேல் படுத்திருந்தான்
  rationale: שֹׁכֵב என்பது அவர்கள் நுழைந்த நேரத்தில் அவன் இருந்த நிலையைக் காட்டும் சூழ்நிலைக் கூற்று; עַל מִטָּתוֹ என்பதன் இடப்பொருள் நேரடியாகப் பாதுகாக்கப்பட்டது.
- source_word: בַּחֲדַר מִשְׁכָּבוֹ
  choice: தனது படுக்கையறையில்
  rationale: சொல்லுக்கு சொல் ‘அவன் படுக்கும் அறையில்’ என்று பொருள்படும் கட்டமைப்பை இயல்பான நவீனத் தமிழில் ‘படுக்கையறையில்’ என வழங்குகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיַּכֻּהוּ וַיְמִתֻהוּ
  choice: அவர்கள் அவனை அடித்துக் கொன்றார்கள்
  rationale: נכה என்ற தாக்குதலையும் מות என்பதன் காரணவினை வடிவிலுள்ள மரணத்தை ஏற்படுத்துதலையும் தொடர்ச்சியான இரு செயல்களாகச் சுருக்காமல், தமிழில் இயல்பான இணை வினையாகப் பாதுகாக்கிறது.
- source_word: וַיָּסִירוּ אֶת רֹאשׁוֹ
  choice: அவனுடைய தலையைத் துண்டித்து
  rationale: הסיר என்பதன் அடிப்படைப் பொருள் ‘அகற்றினர்’; இச்சூழலில் உடலிலிருந்து தலையை அகற்றுவதை ‘துண்டித்து’ தெளிவாகத் தெரிவிக்கிறது. அதிக நேரடியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיִּקְחוּ אֶת רֹאשׁוֹ
  choice: அதை எடுத்துக்கொண்டு
  rationale: לקח என்பதன் ‘எடுத்துக்கொண்டனர்’ என்ற பொருளைப் பாதுகாக்கிறது. தமிழில் ஒரே தொடரில் ‘தலை’ என்பதை மீண்டும் கூறுவது தேவையற்ற கடினத்தன்மை தருவதால் சுட்டுப்பெயர் பயன்படுத்தப்பட்டது.
- source_word: וַיֵּלְכוּ דֶּרֶךְ הָעֲרָבָה
  choice: அராபா வழியாக ... பயணம் செய்தார்கள்
  rationale: דֶּרֶךְ என்பது இங்கு பயணப் பாதையைக் குறிக்கிறது; הָעֲרָבָה புவியியல் பெயராக ஒலிபெயர்க்கப்பட்டு அதன் விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כָּל הַלָּיְלָה
  choice: இரவு முழுவதும்
  rationale: முழு இரவையும் குறிக்கும் எபிரெய காலக் கூற்றுக்கான இயல்பான நவீனத் தமிழ் வடிவம்.
