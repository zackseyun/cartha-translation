translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு தெளிவாகவும் வரலாற்றுக் கதையாடலுக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. வன்முறையின் விவரம் மென்மையாக்கப்படவில்லை; அதேவேளை தேவையற்ற விரிவாக்கமும் தவிர்க்கப்பட்டது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
