  text: וַ/יִּבְרְח֥וּ הַ/בְּאֵרֹתִ֖ים גִּתָּ֑יְמָ/ה וַֽ/יִּהְיוּ שָׁ֣ם גָּרִ֔ים עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/003.yaml
  text: But the Beerothites fled to Gittaim and have lived there as sojourners to this day[a].
translation:
  language: ta
  text: ஆனால் பெயெரோத்தைச் சேர்ந்தவர்கள் கித்தாயிமுக்குத் தப்பியோடி, இந்நாள்வரை அங்கே அந்நியக் குடியிருப்பாளர்களாக வாழ்ந்துவருகிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்நாள்வரை அங்கே குடியேறிய அந்நியர்களாக வாழ்ந்துவருகிறார்கள்.”
    reason: גָּרִים என்பது சொந்த நாட்டினர் அல்லாத குடியிருப்பாளர்களைக் குறிக்கிறது; இதைத் தமிழில் ஒன்றுக்கு மேற்பட்ட இயல்பான முறைகளில் வெளிப்படுத்தலாம்.
lexical_decisions:
- source_word: וַיִּבְרְחוּ
  choice: தப்பியோடி
  rationale: ברח என்ற வினை ஆபத்திலிருந்து தப்பியோடுவதைக் குறிக்கிறது; எபிரெய வழக்கின் எளிய கடந்தகால நிகழ்வைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: הַבְּאֵרֹתִים
  choice: பெயெரோத்தைச் சேர்ந்தவர்கள்
  rationale: இது பெயெரோத் ஊரைச் சேர்ந்த மக்களைக் குறிக்கும் பன்மை இன/இடப்பெயர் வடிவம்; தமிழில் ஊருடனான தொடர்பை வெளிப்படையாகச் சொல்வது இயல்பானது.
- source_word: גִּתָּיְמָה
  choice: கித்தாயிமுக்கு
  rationale: இடப்பெயருடன் உள்ள திசைச்சுட்டு -ה, அந்த இடத்தை நோக்கிய இயக்கத்தைக் காட்டுகிறது; தமிழில் நான்காம் வேற்றுமை இதை இயல்பாகத் தருகிறது.
- source_word: וַיִּהְיוּ שָׁם
  choice: அங்கே ... வாழ்ந்துவருகிறார்கள்
  rationale: இந்நாள்வரை தொடரும் நிலையைச் சூழல் காட்டுவதால், கடந்தகாலத்தில் தொடங்கி உரையாசிரியரின் காலம்வரை நீடிக்கும் வாழ்வைத் தமிழின் தொடர்நிலை வடிவில் தருகிறது.
- source_word: גָּרִים
  choice: அந்நியக் குடியிருப்பாளர்களாக
  rationale: גור என்பதன் பங்கேற்பு வடிவம், சொந்த ஊரினர் அல்லாதவர்களாக ஓர் இடத்தில் வசிப்பவர்களின் சமூக நிலையைச் சுட்டுகிறது; வெறும் தற்காலிகப் பயணி என்ற பொருளாகக் குறுக்கப்படவில்லை.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை
  rationale: உரையாசிரியரின் நிகழ்காலம்வரை நிலை தொடர்வதைக் குறிக்கும் வழக்கமான எபிரெய காலச்சொற்றொடருக்கான சுருக்கமான, இயல்பான தமிழ்.
- source_word: וַ
  choice: ஆனால்
  rationale: முந்தைய வசனத்துடன் உள்ள மெலிந்த முரண் மற்றும் பின்னணிவிளக்கத் தொடர்பை வெளிப்படுத்துகிறது.
