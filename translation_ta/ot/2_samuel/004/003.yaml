translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. இடப்பெயர்கள் எபிரெய ஒலிவடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன; ‘அந்நியக் குடியிருப்பாளர்கள்’ என்ற சொற்றொடர் மூலத்தின் சமூக-வசிப்பிட நுணுக்கத்தைப் பாதுகாக்கிறது.
