  naturalness: ‘சவுலின் மகனிடம் ... இருந்தார்கள்’ என்பதை ‘சவுலின் மகனுக்கு ... இருந்தனர்’ என மாற்றுவது நவீன நிலையான எழுத்துத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. ‘பேரோத்தைச் சேர்ந்த ரிம்மோன்’ என்ற நடை அரிதான தமிழாக்கப்பட்ட இனப்பெயரைவிட வாசகனுக்குத் தெளிவானது. மூலத்தின் நீண்ட வாக்கியத் தகவல் வரிசையைப் பாதுகாத்தபடி மூன்று வாக்கியங்களாகப் பிரிக்கலாம்.
