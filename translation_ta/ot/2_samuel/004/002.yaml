base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/002.yaml
  text: 'Saul’s son had two men who were commanders of raiding bands: the name of the one was Baanah[a], and the name of the second was Rechab, sons of Rimmon the Beerothite, from the sons of Benjamin; for Beeroth also was considered part of Benjamin.'
translation:
  language: ta
  text: சவுலின் மகனுக்கு தாக்குதல் நடத்தும் குழுக்களின் தலைவர்களாக இரண்டு பேர் இருந்தனர். ஒருவனின் பெயர் பானா; இரண்டாமவனின் பெயர் ரேகாப். அவர்கள் பேரோத்தைச் சேர்ந்த ரிம்மோனின் மகன்கள்; பென்யமீன் குலத்தைச் சேர்ந்தவர்கள். ஏனெனில் பேரோத்தும் பென்யமீனுக்குச் சேர்ந்ததாகக் கருதப்பட்டது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பென்யமீனைச் சேர்ந்ததாகக் கணக்கிடப்பட்டது.”
    reason: תֵּחָשֵׁב என்பதன் ‘கருதப்பட்டது’ மற்றும் ‘கணக்கிடப்பட்டது’ ஆகிய இரு இயல்பான மொழிபெயர்ப்பு வாய்ப்புகளையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: שְׁנֵי אֲנָשִׁים
  choice: இரண்டு பேர்
  rationale: ஆண்களைக் குறிக்கும் எபிரெய ஆண்பால் பன்மையைச் சூழல் தெளிவாக்குவதால், இயல்பான நவீன தமிழில் ‘இரண்டு பேர்’ என வழங்கப்பட்டது.
- source_word: שָׂרֵי גְדוּדִים
  choice: தாக்குதல் படைக்குழுக்களின் தலைவர்கள்
  rationale: שָׂרֵי என்பது தலைவர்கள் அல்லது தளபதிகள் என்றும், גְדוּדִים என்பது வழக்கமான நிலைப்படையைவிடத் தாக்குதல் நடத்தும் படைக்குழுக்களையும் குறிக்கலாம். ‘தாக்குதல் படைக்குழுக்கள்’ அதன் ஒழுங்கற்ற இராணுவத் தன்மையைத் தக்கவைக்கிறது.
- source_word: בֶן שָׁאוּל
  choice: சவுலின் மகன்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட சவுலின் மகனைச் சுட்டுகிறது; பெயரை விளக்கமாகச் சேர்க்காமல் மூலத்தின் குறிப்புமுறையே தக்கவைக்கப்பட்டது.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: ஒருவனின் பெயர் ... இரண்டாமவனின் பெயர்
  rationale: எபிரெய மொழியின் மீளுரைத்த பெயரிடும் அமைப்பையும் ‘இரண்டாமவன்’ என்ற துல்லியத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בְּנֵי רִמּוֹן הַבְּאֶרֹתִי
  choice: பேரோத்தியனான ரிம்மோனின் மகன்கள்
  rationale: இருவரின் தந்தையையும் அவரது ஊர்சார் அடையாளத்தையும் தெளிவாக இணைக்கிறது.
- source_word: מִבְּנֵי בִנְיָמִן
  choice: பென்யமீன் குலத்தைச் சேர்ந்த
  rationale: ‘பென்யமீனின் மக்களில்’ என்ற எபிரெயக் குலமரபுச் சொல்லாட்சியின் பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: כִּי גַּם
  choice: ஏனெனில் ... உம்
  rationale: முந்தைய குல அடையாளத்திற்கான விளக்கக் காரணத்தையும் ‘கூட/மேலும்’ என்ற சேர்க்கைப் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: תֵּחָשֵׁב עַל־בִּנְיָמִן
  choice: பென்யமீனுக்குச் சேர்ந்ததாகக் கருதப்பட்டது
  rationale: நிபால் வடிவத்தின் ‘கருதப்படுதல்/கணக்கிடப்படுதல்’ பொருளையும் இங்கு உள்ள குலப்பகுதி சார்பையும் இயல்பாக வெளிப்படுத்துகிறது.
