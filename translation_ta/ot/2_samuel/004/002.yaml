  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தொடக்க ו தனியான காலச்சொல்லாக இல்லாததால் ‘இப்போது’ என்று சேர்க்கப்படவில்லை. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டாலும் அதன் தகவல் வரிசையும் காரணவியல் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
