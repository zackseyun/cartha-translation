base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/008.yaml
  text: They brought the head of Ish-bosheth to David at Hebron[a], and said to the king, “Here is the head of Ish-bosheth son of Saul, your enemy, who sought your life. Yahweh has given my lord the king vengeance today on Saul and on his offspring.”
translation:
  language: ta
  text: அவர்கள் இஸ்போசேத்தின் தலையை எப்ரோனில் இருந்த தாவீதிடம் கொண்டுவந்து, அரசரிடம், “இதோ, உமது உயிரைப் பறிக்கத் தேடிய உமது பகைவனான சவுலின் மகன் இஸ்போசேத்தின் தலை! யாவே என் ஆண்டவராகிய அரசருக்கு இன்று சவுல்மீதும் அவன் சந்ததிமீதும் பழிவாங்குதலை வழங்கியிருக்கிறார்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பழிவாங்குதலை” என்பதற்கான எபிரெயச் சொல் எழுத்துப்படி “பழிவாங்குதல்கள்” என்று பன்மையில் உள்ளது; இது தீவிரமான பழிவாங்குதலையோ பழிவாங்கும் செயல்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: கொண்டுவந்து
  rationale: தொடர்ச்சியான கதைநடையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எபிரெய வாவ் இணைப்பைத் தனியே மொழிபெயர்க்காமல் நிகழ்வின் தொடர்ச்சியைப் பேணுகிறது.
- source_word: רֹאשׁ
  choice: தலை
  rationale: இச்சூழலில் வெட்டப்பட்ட உடலுறுப்பான தலைதான் நேரடியாகக் குறிக்கப்படுகிறது; உருவகப் பொருள் இல்லை.
- source_word: אִישׁ בֹּשֶׁת
  choice: இஸ்போசேத்
  rationale: மசோரா உரையில் உள்ள பெயர்வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது; தொடர்புடைய வேறு பெயர்வடிவமான எஷ்பால் இவ்வசனத்தில் இல்லை.
- source_word: חֶבְרוֹן
  choice: எப்ரோன்
  rationale: இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு; தாவீது எப்ரோனில் இருந்தான் என்பதைக் குழப்பமின்றி வெளிப்படுத்த ‘எப்ரோனிலிருந்த தாவீதிடம்’ என அமைக்கப்பட்டுள்ளது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: ஒரு பொருளை நேரடியாகக் காட்டி முன்வைக்கும் எபிரெயச் சொல்லின் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אֹיִבְךָ
  choice: உமது பகைவன்
  rationale: அரசரிடம் பேசும் மரியாதை ஒருமையைப் பேணிய நேரடியான மொழிபெயர்ப்பு.
- source_word: בִּקֵּשׁ אֶת נַפְשֶׁךָ
  choice: உமது உயிரைப் பறிக்கத் தேடிய
  rationale: ‘உமது உயிரைத் தேடிய’ என்ற எபிரெய மரபுத்தொடரின் கொலைநோக்கைத் தெளிவாகவும், அதன் ‘உயிர்’ படிமத்தைப் பேணியும் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமமான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசருக்கு
  rationale: முதல் நபர் ஒருமை உடைமை விகுதியையும் அரசவைக்குரிய மரியாதை அழைப்பையும் பேணுகிறது.
- source_word: נְקָמוֹת
  choice: பழிதீர்த்துக் கொடுத்திருக்கிறார்
  rationale: ‘பழிவாங்குதல்களை அளித்தார்’ என்ற எபிரெய அமைப்பின் பொருளை இயல்பான தமிழில் தருகிறது; பன்மை வடிவம் அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
- source_word: מִשָּׁאוּל וּמִזַּרְעוֹ
  choice: சவுல்மீதும் அவன் சந்ததிமீதும்
  rationale: பழிவாங்குதல் யார்மீது நிகழ்ந்ததாகப் பேச்சாளர்கள் கூறுகிறார்கள் என்பதைத் தெளிவாகக் காட்டுகிறது; זֶרַע என்பதற்கு வம்சத் தொடரைக் குறிக்கும் ‘சந்ததி’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை இறைநாமத்தையே பயன்படுத்துகிறது. தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வடிவை வெளிப்படையாகப் பேணுகிறது.
- issue: கொலையாளர்கள் கூறும் தெய்வீகப் பழிவாங்கல் உரிமைக்கூற்றின் மதிப்பீடு
  choice: எந்த விளக்கத் தகுதியும் சேர்க்காமல் நேரடி உரையாகவே வைத்தல்
  alternative: ‘அவர்கள் கூறியபடி’ அல்லது ‘எனக் கருதி’ போன்ற ஐயக் குறிப்பைச் சேர்த்தல்
  rationale: இது பாத்திரங்களின் நேரடி பேச்சு; கூற்றை உரையாளர் உறுதிப்படுத்துவதாகவோ மறுப்பதாகவோ மொழிபெயர்ப்பு மாற்றக்கூடாது. தொடர்ந்து வரும் தாவீதின் பதிலே கதைச்சூழலின் மதிப்பீட்டை வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக்குரிய மரியாதையை வெளிப்படுத்த ‘உமது’, ‘என் ஆண்டவராகிய அரசர்’ ஆகிய வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. வாக்கியம் இயல்பாக இருக்க இடத்தைக் குறிக்கும் ‘எப்ரோன்’ தாவீதுடன் இணைக்கப்பட்டுள்ளது. பாத்திரங்களின் வன்முறையான கூற்றும் அதன் இறையியல் பதற்றமும் விளக்கச் சேர்க்கையின்றிப் பேணப்பட்டுள்ளன.
