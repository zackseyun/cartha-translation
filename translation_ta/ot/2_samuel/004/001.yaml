translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. மூலத்தின் மறைமுக அடையாளமான ‘சவுலின் மகன்’ என்பதும், ‘கைகள் தளர்ந்தன’ என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறியீடு ‘எப்ரோனில்’ என்பதற்குப் பின் இருந்தாலும், அதன் உள்ளடக்கம் கைகள் தளர்ந்தன என்ற மரபுத்தொடரை விளக்குவதால் தமிழில் அந்தச் சொற்றொடருக்குப் பின் சரியாக வைக்கப்பட்டுள்ளது.
