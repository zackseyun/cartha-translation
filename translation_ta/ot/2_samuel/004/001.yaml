source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע בֶּן שָׁא֗וּל כִּ֣י מֵ֤ת אַבְנֵר֙ בְּ/חֶבְר֔וֹן וַ/יִּרְפּ֖וּ יָדָ֑י/ו וְ/כָל יִשְׂרָאֵ֖ל נִבְהָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/001.yaml
  text: When Saul’s son heard that Abner had died in Hebron[a], his hands became weak, and all Israel was alarmed.
translation:
  language: ta
  text: சவுலின் மகன், அப்னேர் எப்ரோனில் இறந்துவிட்டான் என்று கேள்விப்பட்டபோது, அவனுடைய கைகள் தளர்ந்தன[a]; இஸ்ரவேலர் அனைவரும் கலக்கமடைந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனுடைய கைகள் தளர்ந்தன” என்பது வலிமையையோ துணிவையையோ இழந்ததைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שָׁאוּל
  choice: சவுலின் மகன்
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் தருகிறது; இவ்வசனத்தில் இல்லாத இஸ்போசேத் என்ற பெயரைச் சேர்க்கவில்லை.
- source_word: כִּי מֵת אַבְנֵר
  choice: அப்னேர் இறந்துவிட்டான் என்று
  rationale: כִּי கேட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; מֵת ஏற்கெனவே நிகழ்ந்து முடிந்த மரணத்தைச் சுட்டுவதால் ‘இறந்துவிட்டான்’ எனத் தரப்பட்டுள்ளது.
- source_word: בְּחֶבְרוֹן
  choice: எப்ரோனில்
  rationale: בְּ என்பதன் இடப்பொருளை இயல்பான தமிழ் இடவேற்றுமையால் வெளிப்படுத்துகிறது.
- source_word: וַיִּרְפּוּ יָדָיו
  choice: அவனுடைய கைகள் தளர்ந்தன
  rationale: வலிமை அல்லது துணிவு குன்றியதைக் குறிக்கும் எபிரெய உடலுறுப்பு உருவகத்தைத் தீர்த்து எழுதாமல் பாதுகாக்கிறது.
- source_word: כָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் கூட்டுப் பெயரின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: נִבְהָלוּ
  choice: கலக்கமடைந்தார்கள்
  rationale: திடீர் அதிர்ச்சி, குழப்பம், அச்சம் ஆகிய பொருள் பரப்பை அளவுக்கு மீறித் தீவிரப்படுத்தாமல் வெளிப்படுத்துகிறது.
