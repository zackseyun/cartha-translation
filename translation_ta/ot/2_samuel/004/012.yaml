base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/012.yaml
  text: Then David commanded the young men[a], and they killed them and cut off their hands and their feet and hung them by the pool at Hebron. But they took the head of Ish-bosheth and buried it in the tomb of Abner at Hebron.
translation:
  language: ta
  text: பின்னர் தாவீது அந்த இளைஞர்களுக்குக் கட்டளையிட்டான். அவர்கள் அவ்விருவரையும் கொன்று, அவர்களுடைய கைகளையும் கால்களையும் வெட்டித் துண்டித்து, எப்ரோனிலுள்ள குளத்தருகே அவர்களைத் தொங்கவிட்டார்கள்.[a] பின்பு இஸ்போசேத்தின் தலையை எடுத்து, எப்ரோனிலுள்ள அப்னேரின் கல்லறையில் புதைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குளத்தின் மேல் அவர்களைத் தொங்கவிட்டார்கள்.” இங்குள்ள எபிரெய முன்னிடைச்சொல் இடத்தைக் குறிக்கும் விரிவான பொருளிலும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו דָּוִד
  choice: பின்னர் தாவீது ... கட்டளையிட்டான்
  rationale: தொடர்கதை வரிசையை முன்னெடுக்கும் வாவ் வடிவை இயல்பான தமிழில் ‘பின்னர்’ எனக் கொடுத்து, צוה என்பதன் கட்டளையிடும் வலிமையைத் தக்கவைக்கிறது.
- source_word: הַנְּעָרִים
  choice: அந்த இளைஞர்கள்
  rationale: נְעָרִים என்பது இளைஞர்களையோ பணியாளர்களையோ குறிக்கலாம். இங்கு தாவீதின் ஆணையை நிறைவேற்றுவோரைக் குறித்தாலும், அடிப்படைச் சொல்லுணர்வைத் தக்கவைக்க ‘இளைஞர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיַּהַרְגוּם
  choice: அவர்கள் அவ்விருவரையும் கொன்று
  rationale: הרג என்பதன் நேரடியான பொருள் ‘கொல்’. முந்தைய சூழலில் இருவர் குறிக்கப்படுவதால், எபிரெயப் பன்மைப் பின்னொட்டின் குறிப்பைத் தமிழில் தெளிவாக ‘அவ்விருவரையும்’ என வழங்குகிறது.
- source_word: וַיְקַצְּצוּ אֶת יְדֵיהֶם וְאֶת רַגְלֵיהֶם
  choice: அவர்களுடைய கைகளையும் கால்களையும் வெட்டி
  rationale: קצץ என்பது வெட்டுதல் அல்லது வெட்டித் துண்டித்தல். கைகளும் கால்களும் தனித்தனியாகக் குறிப்பிடப்படுவதைத் தமிழில் இணை அமைப்புடன் தக்கவைக்கிறது; வெட்டப்பட்டன என்ற பொருள் சூழலால் தெளிவாகிறது.
- source_word: וַיִּתְלוּ עַל הַבְּרֵכָה
  choice: குளத்தருகே அவர்களைத் தொங்கவிட்டார்கள்
  rationale: תלה என்பதற்கு ‘தொங்கவிடு’; עַל இடத்தைக் குறிக்கும் விரிவான பயன்பாட்டில் ‘அருகே’ என்பது இங்கு இயல்பான வாசிப்பு. ‘குளத்தின் மேல்’ என்ற நேரடி வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: בְּחֶבְרוֹן
  choice: எப்ரோனிலிருந்த
  rationale: குளமும் அப்னேரின் கல்லறையும் எப்ரோனில் அமைந்திருந்ததை இயல்பான தமிழில் இடப்பொருளுடன் வெளிப்படுத்துகிறது.
- source_word: רֹאשׁ אִישׁ בֹּשֶׁת
  choice: இஸ்போசேத்தின் தலை
  rationale: எபிரெயச் சார்பு அமைப்பை இயல்பான தமிழ் உடைமை வடிவில் நேரடியாக வழங்குகிறது.
- source_word: לָקָחוּ
  choice: எடுத்துச் சென்று
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடு’. அதை அப்னேரின் கல்லறையில் புதைப்பதற்காக வேறு இடத்துக்குக் கொண்டுசென்ற செயலைத் தமிழ் தொடர்வினை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּקְבְּרוּ בְקֶבֶר אַבְנֵר
  choice: அப்னேரின் கல்லறையில் புதைத்தார்கள்
  rationale: קבר என்பதன் பெயர் மற்றும் வினைச் சொல்லுணர்வுகளை ‘கல்லறை’, ‘புதைத்தார்கள்’ என்று நேரடியாகத் தருகிறது; புதைக்கப்பட்ட பொருள் இஸ்போசேத்தின் தலை என்பது முந்தைய தொடரால் தெளிவாகிறது.
theological_decisions:
- issue: தாவீதின் செயலுக்கான அற அல்லது இறையியல் மதிப்பீடு
  choice: வசனம் கூறும் செயல்களை மதிப்பீட்டுச் சொற்கள் சேர்க்காமல் நேரடியாக விவரித்தல்
  alternative: ‘மரணதண்டனை நிறைவேற்றினர்’ போன்ற வெளிப்படையான நீதித்துறைச் சொற்களைச் சேர்த்தல்
  rationale: இந்த வசனம் தாவீதின் கட்டளையையும் அதைத் தொடர்ந்து நடந்த கொலை, உடல் உறுப்புகளை வெட்டுதல், பொதுக் காட்சிப்படுத்தல் ஆகியவற்றையும் கடுமையாக விவரிக்கிறது; ஆனால் இதே வசனத்தில் வெளிப்படையான இறையியல் அல்லது அற மதிப்பீட்டை வழங்கவில்லை. ஆகவே அந்தப் பதற்றம் விளக்கிச் சமப்படுத்தப்படாமல் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் நேரடியான ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் கடுமையான வன்முறை மறைக்கப்படவில்லை; அதேவேளையில் மூலத்தில் இல்லாத நீதித்துறை அல்லது அறவியல் விளக்கம் சேர்க்கப்படவில்லை. பெயர்கள் ‘தாவீது’, ‘எப்ரோன்’, ‘இஸ்போசேத்’, ‘அப்னேர்’ எனத் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிபெயர்ப்பில் வழங்கப்பட்டுள்ளன.
