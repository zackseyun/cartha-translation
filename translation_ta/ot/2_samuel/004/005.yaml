  register: நவீன நிலையான தமிழில் எளிதாகப் புரியும், கண்ணியமான வரலாற்றுக் கதைநடை. எபிரெய மூலத்தின் தொடர் இயக்கமும் பகல் வெப்பம் குறித்த சொற்படிமமும் காக்கப்பட்டுள்ளன; சொல்லுக்குச் சொல் அமைப்பால் தமிழில் ஏற்படும் செயற்கைத்தன்மை தவிர்க்கப்பட்டுள்ளது.
