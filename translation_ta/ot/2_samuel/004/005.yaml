  yaml_path: translation/ot/2_samuel/004/005.yaml
  text: The sons of Rimmon the Beerothite[a], Rekab and Baanah, went and came to the house of Ish-bosheth in the heat of the day[b], while he was lying down for his midday rest.
translation:
  language: ta
  text: பேரோத்தியனான ரிம்மோனின் மகன்களாகிய ரேகாபும் பானாவும் புறப்பட்டுச் சென்று, பகலின் வெப்பமான வேளையில் இஸ்போசேத்தின் வீட்டிற்கு வந்தார்கள். அப்போது அவன் நண்பகல் ஓய்வுக்காகப் படுத்திருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “நண்பகலின் படுத்தல்”; அதாவது, நண்பகல் ஓய்வு.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: பேரோத்தியனான ரிம்மோனின் மகன்களாகிய
  rationale: בְּנֵי என்பதன் நேரடியான குடும்ப உறவுப் பொருள் இங்கு அடுத்து பெயரிடப்படும் இருவருக்கும் இயல்பாகப் பொருந்துகிறது; இடப்பெயர்சார் அடையாளம் தமிழில் இயல்பாக உரிச்சொல் வடிவில் தரப்பட்டது.
- source_word: רֵכָב וּבַעֲנָה
  choice: ரேகாபும் பானாவும்
  rationale: எபிரெய தனிப்பெயர்களின் ஒலிப்பை நவீனத் தமிழில் தெளிவாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: וַיֵּלְכוּ ... וַיָּבֹאוּ
  choice: புறப்பட்டுச் சென்று ... வந்தார்கள்
  rationale: இரு தொடர்ச்சியான இயக்க வினைகளையும் காத்து, தமிழில் தேவையற்ற மறுமொழிபோல் ஒலிக்காமல் இயல்பான கதைநடையில் வழங்குகிறது.
- source_word: כְּחֹם הַיּוֹם
  choice: பகலின் வெப்பமான வேளையில்
  rationale: சொற்றொடரின் வெப்பம் சார்ந்த படிமத்தைப் பாதுகாக்கிறது; அதைத் துல்லியமாக ‘நண்பகல்’ என்று மட்டும் சுருக்கி விளக்கவில்லை.
- source_word: בֵּית אִישׁ בֹּשֶׁת
  choice: இஸ்போசேத்தின் வீட்டிற்கு
  rationale: எபிரெய கட்டமைப்பை இயல்பான தமிழ் உடைமைத் தொடராக வழங்கி, தனிப்பெயரை மொழிபெயர்க்காமல் எழுத்துப்பெயர்க்கிறது.
- source_word: וְהוּא שֹׁכֵב אֵת מִשְׁכַּב הַצָּהֳרָיִם
  choice: அப்போது அவன் நண்பகல் ஓய்வுக்காகப் படுத்திருந்தான்
  rationale: வருகையின் போது இஸ்போசேத்தின் நிலையைக் குறிக்கும் சூழ்நிலைப் பொருளைத் தெளிவாக்கி, நேரடியான ‘நண்பகலின் படுத்தல்’ என்பதை இயல்பான தமிழில் வழங்குகிறது.
