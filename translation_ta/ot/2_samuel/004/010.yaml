base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/010.yaml
  text: When someone told me[a], saying, ‘Look, Saul is dead,’ and he thought he was bringing good news in his own eyes[b], I seized him and killed him in Ziklag—that was the reward I gave him for his news.
translation:
  language: ta
  text: “இதோ, சவுல் இறந்துவிட்டார்” என்று ஒருவன் என்னிடம் வந்து சொன்னபோது[a], அவன் தன்னை நற்செய்தி கொண்டுவருபவனாகக் கருதினான். ஆனால் நான் அவனைப் பிடித்து சிக்லாகில் கொன்றேன்; அவன் கொண்டுவந்த செய்திக்காக நான் அவனுக்குக் கொடுத்த வெகுமதி அதுதான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சார்பாக: “இதோ, சவுல் இறந்துவிட்டார் என்று என்னிடம் அறிவித்தவன், தன் பார்வையில் நற்செய்தி கொண்டுவருபவனைப் போல இருந்தான்.”'
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் இறுதிக் கூற்று சுருக்கமாகவும் கிண்டல் தொனியுடனும் உள்ளது. சவுலின் மரணத்தை அறிவித்ததற்குக் கூலி கிடைக்கும் என்று அந்தத் தூதன் எதிர்பார்த்தான்; ஆனால் அவனுக்குக் கிடைத்த ஒரே ‘வெகுமதி’ கொல்லப்பட்டதே என்று தாவீது குறிப்பிடுகிறார்.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: என்று... சொன்னபோது
  rationale: இங்கு כִּי, சுற்றியுள்ள உரையில் தாவீது முன்வைக்கும் ஒரு குறிப்பிட்ட முன்னுதாரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் காலச் சூழலை இயல்பாகக் காட்ட ‘சொன்னபோது’ பொருத்தமானது.
- source_word: הַמַּגִּיד לִי לֵאמֹר
  choice: ஒருவன் என்னிடம் வந்து சொன்னபோது
  rationale: பெயர்ச்சொல் போல் பயன்படும் வினையெச்சத்தின் பொருள் ‘என்னிடம் அறிவித்தவன்’; ‘ஒருவன் ... வந்து சொன்னபோது’ என்பது நவீன தமிழில் இயல்பாகவும் நிகழ்வின் இயக்கத்தைத் தெளிவாகவும் தருகிறது.
- source_word: הִנֵּה מֵת שָׁאוּל
  choice: “சவுல் இறந்துவிட்டார்”
  rationale: הִנֵּה கவனத்தை ஈர்க்கும் சொல் என்றாலும், நேரடி தமிழ்ப் பேச்சில் தனியே ‘இதோ’ சேர்க்காமல் செய்தியை நேரடியாகக் கூறுவது இயல்பு; מֵת என்பதின் நிறைவுற்ற நிலை ‘இறந்துவிட்டார்’ என வெளிப்படுகிறது.
- source_word: וְהוּא הָיָה כִמְבַשֵּׂר בְּעֵינָיו
  choice: தன் பார்வையில் தான் நற்செய்தி கொண்டுவருவதாக அவன் நினைத்தான்
  rationale: בְּעֵינָיו என்பதின் ‘அவனுடைய கண்களில்/மதிப்பீட்டில்’ என்ற கருத்தை ‘தன் பார்வையில்’ காக்கிறது; כִמְבַשֵּׂר என்பதின் ஒப்புமை மற்றும் செய்தி நல்லதாகக் கருதப்பட்ட தன்மையை ‘நற்செய்தி கொண்டுவருவதாக’ தருகிறது.
- source_word: וָאֹחֲזָה בוֹ
  choice: நான் அவனைப் பிடித்து
  rationale: אָחַז என்பது உறுதியாகப் பற்றுதல் அல்லது கைப்பற்றுதலைக் குறிக்கிறது; ‘பிடித்து’ என்பது நேரடியும் இயல்புமான தமிழ்.
- source_word: וָאֶהְרְגֵהוּ
  choice: கொன்றேன்
  rationale: வினைச்சொல்லின் நேரடியான ‘கொல்’ என்ற பொருளை நீதித்துறை சார்ந்த கூடுதல் நுணுக்கம் சேர்க்காமல் தருகிறது.
- source_word: בְּצִקְלָג
  choice: சிக்லாகில்
  rationale: இடப்பெயர் நவீன தமிழில் ஒலிபெயர்க்கப்பட்டு இடவெற்றுமையுடன் வழங்கப்படுகிறது.
- source_word: אֲשֶׁר לְתִתִּי לוֹ בְּשֹׂרָה
  choice: அவன் கொண்டுவந்த செய்திக்காக நான் அவனுக்குக் கொடுத்த வெகுமதி அதுதான்
  rationale: எபிரெயக் கூற்று சுருக்கப்பட்டதும் கிண்டல் தொனியுடையதும் ஆகும். செய்தியாளர் எதிர்பார்த்த கூலிக்குப் பதிலாக மரணமே கிடைத்தது என்பதைத் தமிழில் தெளிவாக்குகிறது; அதேவேளை அந்தக் கிண்டலை அடிக்குறிப்பில் விளக்குகிறது.
