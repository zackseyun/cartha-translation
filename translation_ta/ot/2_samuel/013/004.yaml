base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/004.yaml
  text: He said to him[a], “Why are you so gaunt, son of the king, morning after morning? Will you not tell me?” And Amnon said to him, “I love Tamar[b], the sister of my brother Absalom.”
translation:
  language: ta
  text: அவன் அவனிடம்[a], “அரசனின் மகனே, நீ ஏன் காலைதோறும் இவ்வளவு மெலிந்து காணப்படுகிறாய்? என்னிடம் சொல்லமாட்டாயா?” என்று கேட்டான். அதற்கு அம்னோன் அவனிடம், “என் சகோதரன் அப்சலோமின் சகோதரியான தாமாரை நான் நேசிக்கிறேன்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவன் அவனிடம்” என்பதில் முதலில் குறிப்பிடப்படுபவன் யோனதாப்; இரண்டாவதாகக் குறிப்பிடப்படுபவன் அம்னோன்.
    reason: எபிரெய மூலத்தின் பிரதிப்பெயர் அமைப்பைப் பாதுகாக்கும்போது தமிழில் யாரைக் குறிக்கிறது என்பது தெளிவாக இருக்க உதவுகிறது.
  - marker: b
    text: அல்லது, “தாமார்மீது நான் காதல் கொண்டிருக்கிறேன்.” எபிரெயில் இன்னும் சொற்சொல்லாக, “தாமாரை நான் நேசிக்கிறேன்” என்று உள்ளது.
    reason: אָהֵב என்பதற்கான சூழல்சார் மாற்று மொழிபெயர்ப்பை வழங்கி, மூலத்தின் சொற்சொல் பொருளையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: מַדּוּעַ
  choice: ஏன்
  rationale: காரணத்தை நேரடியாகக் கேட்கும் வினாச்சொல்; நவீன தமிழில் இயல்பான இணை.
- source_word: כָּכָה דַּל
  choice: இவ்வளவு மெலிந்து காணப்படுகிறாய்
  rationale: דַּל இச்சூழலில் வறுமையை அல்ல, வெளிப்படையாகத் தெரியும் உடல் மெலிவைக் குறிக்கிறது; ‘காணப்படுகிறாய்’ என்பது தோற்றத்தைப் பற்றிய கேள்வியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֶּן הַמֶּלֶךְ
  choice: அரசனின் மகனே
  rationale: எபிரெயச் சொற்றொடரின் உறவுமுறையையும் நேரடி அழைப்பின் வலியுறுத்தலையும் காக்கிறது.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: காலைதோறும்
  rationale: இரட்டிப்புச் சொற்றொடர் தொடர்ச்சியாக ஒவ்வொரு காலையிலும் நிகழ்வதைக் குறிக்கிறது; தமிழில் ‘காலைதோறும்’ இயல்பானது.
- source_word: הֲלוֹא תַּגִּיד לִי
  choice: என்னிடம் சொல்லமாட்டாயா?
  rationale: הֲלוֹא வெளிப்படுத்தும் எதிர்பார்ப்பும் தூண்டுதலும் தமிழின் எதிர்மறை வினா வடிவில் இயல்பாகக் காக்கப்படுகின்றன.
- source_word: אֲחוֹת אַבְשָׁלֹם אָחִי
  choice: என் சகோதரன் அப்சலோமின் சகோதரியான
  rationale: அப்சலோமை ‘என் சகோதரன்’ என்று குறிப்பதையும் தாமாருடனான அவரது உறவையும் வெளிப்படையாக வைத்திருக்கிறது.
- source_word: אֲנִי אֹהֵב
  choice: நான் நேசிக்கிறேன்
  rationale: אָהֵב என்பது பொதுவான ‘நேசித்தல்’ வினை; தொடர்ந்த கதையின் அடிப்படையில் ‘ஆசைப்படுகிறேன்’ போன்ற விளக்கத்தை இங்கே திணிக்காமல் மூலத்தின் சொல்லாட்சியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: தாமாரைப் பற்றிய அம்னோனின் உணர்வை மொழிபெயர்த்தல்
  choice: தாமாரை நான் நேசிக்கிறேன்
  alternative: தாமார்மீது நான் காதல் கொண்டிருக்கிறேன் / தாமாரை நான் விரும்புகிறேன்
  rationale: மூலத்தில் சாதாரண אָהֵב வினை பயன்படுத்தப்பட்டுள்ளது. பின்னணிக் கதை அம்னோனின் விருப்பத்தின் சீர்கேட்டை வெளிப்படுத்தினாலும், இவ்வசனம் மட்டும் கூறுவதைத் தாண்டிய அறநெறி அல்லது உளவியல் விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைக் கையாளுகிறது. ‘அரசனின் மகனே’ என்ற அழைப்பு மூலத்தின் சொல்லமைப்பையும் உரையாடலின் வலியுறுத்தலையும் காக்கிறது. ‘மெலிந்து காணப்படுகிறாய்’ என்பது உடல்தோற்றச் சிதைவை மிகைப்படுத்தாமல் தெளிவாகச் சொல்கிறது.
