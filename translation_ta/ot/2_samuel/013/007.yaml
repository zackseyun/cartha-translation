revisions:
- from: அப்போது தாவீது வீட்டிலிருந்த தாமாருக்குச் செய்தி அனுப்பி, “தயவுசெய்து உன் சகோதரன் அம்னோனின் வீட்டுக்குப் போய், அவனுக்காக நோயாளிக்குரிய உணவைத் தயார் செய்[a]” என்றார்.
  to: அப்போது தாவீது தாமாரின் வீட்டிற்குச் செய்தி அனுப்பி, “தயவுசெய்து உன் சகோதரன் அம்னோனின் வீட்டுக்குப் போய், அவனுக்காக நோயாளிக்குரிய உணவைத் தயார் செய்[a]” என்றார்.
  rationale: The revision corrects the treatment of הַבַּיְתָה by expressing movement of the message to Tamar’s house, rather than merely locating Tamar inside a house. The food term and its lexical footnote are retained, since they faithfully convey the Hebrew term’s specialized but not fully specific sense.
