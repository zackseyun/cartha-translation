base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/007.yaml
  text: Then David sent word to Tamar at home[a], saying, “Please go to the house of your brother Amnon and prepare the food for him.”
translation:
  language: ta
  text: அப்போது தாவீது தாமாரின் வீட்டிற்குச் செய்தி அனுப்பி, “தயவுசெய்து உன் சகோதரன் அம்னோனின் வீட்டுக்குப் போய், அவனுக்காக நோயாளிக்குரிய உணவைத் தயார் செய்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் உடல்நலம் தேற உதவும் உணவைத் தயார் செய்” அல்லது “அவனுக்காக உணவைத் தயார் செய்.” எபிரெயச் சொல் நோயுற்றவர் அல்லது உடல்நலம் தேறிவருகிறவருக்காகத் தயாரிக்கப்படும் உணவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: செய்தி அனுப்பி
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘அனுப்புதல்.’ ஆனால் אֶל தாமார் என்பதையும் தொடர்ந்து வரும் செய்தியையும் கருத்தில் கொண்டு, தாவீது தாமாரை அனுப்பினார் என்ற தவறான புரிதலைத் தவிர்க்க ‘செய்தி அனுப்பி’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַבַּיְתָה
  choice: வீட்டிலிருந்த
  rationale: திசையைக் குறிக்கும் முடிவுடன் ‘வீட்டுக்கு/வீட்டை நோக்கி’ என்ற வடிவம் இருந்தாலும், சூழலில் செய்தி தாமார் இருந்த வீட்டிற்குச் செல்கிறது. தமிழில் ‘வீட்டிலிருந்த தாமார்’ என்று இடநிலைப் பொருளை இயல்பாக வெளிப்படுத்தலாம்; எந்த வீடு என்பது எபிரெயத்தில் குறிப்பிடப்படாததால் அதையும் குறிப்பிடவில்லை.
- source_word: לְכִי נָא
  choice: தயவுசெய்து ... போய்
  rationale: பெண்பால் ஒருமை கட்டளை வடிவத்துடன் נָא வேண்டுகோளின் மென்மையைத் தருகிறது. ‘தயவுசெய்து ... போய்’ இரண்டையும் தெளிவாகக் காட்டுகிறது.
- source_word: בֵּית אַמְנוֹן אָחִיךְ
  choice: உன் சகோதரன் அம்னோனின் வீட்டுக்கு
  rationale: ‘உன் சகோதரன் அம்னோனின் வீடு’ என்ற எபிரெய இணைப்புத் தொடரை நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: וַעֲשִׂי לוֹ
  choice: அவனுக்காக ... தயார் செய்
  rationale: עשה பொதுவாக ‘செய்/உண்டாக்கு’ எனப் பொருள்படும்; உணவு சார்ந்த இச்சூழலில் ‘தயார் செய்’ என்பது இயல்பான தமிழ்.
- source_word: הַבִּרְיָה
  choice: நோயாளிக்குரிய உணவு
  rationale: இந்த அரிதான பெயர்ச்சொல் நோயுற்றவர் அல்லது உடல்நலம் தேறுகிறவருக்காகத் தயாரிக்கப்படும் உணவைக் குறிக்கிறது. வெறும் ‘உணவு’ என்பதைக் காட்டிலும் சொல் தரும் சிறப்புப் பொருளை இது பாதுகாக்கிறது; உணவின் குறிப்பிட்ட வகையை ஊகிப்பதில்லை.
