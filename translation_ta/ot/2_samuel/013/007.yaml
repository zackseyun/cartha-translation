translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசரின் கட்டளை நாகரிகமான வேண்டுகோளாக ஒலிக்க நָא என்பதற்கு ‘தயவுசெய்து’ பயன்படுத்தப்பட்டது. அரிதான உணவுப்பெயரின் மருத்துவ/மீட்பு சார்ந்த நுணுக்கம் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
