base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/018.yaml
  text: She was wearing a richly ornamented robe[a], for this is how the virgin daughters of the king used to dress. Then his attendant put her outside and bolted the door behind her.
translation:
  language: ta
  text: அவள் சிறப்பாக அலங்கரிக்கப்பட்ட ஓர் அங்கியை[a] அணிந்திருந்தாள்; கன்னியரான அரசரின் மகள்கள் இவ்வாறுதான் உடை அணிவது வழக்கம். அவனுடைய பணியாளன் அவளை வெளியே அனுப்பிவிட்டு, அவளுக்குப் பின்னால் கதவைத் தாழிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீண்ட கைகளுள்ள ஓர் அங்கி,” “பல வண்ண அங்கி,” அல்லது “நீளமான ஓர் அங்கி”; இந்த ஆடையைக் குறிக்கும் எபிரெயச் சொற்றொடரின் துல்லியமான பொருள் உறுதியில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹנֶת פַּסִּים
  choice: சிறப்பாக அலங்கரிக்கப்பட்ட ஓர் அங்கி
  rationale: இது தனிச்சிறப்புடைய ஓர் ஆடையைக் குறிக்கிறது; פַּסִּים என்பதன் துல்லியமான பொருள் உறுதியில்லை. முதன்மை உரையில் இயல்பான ஒரு சாத்தியப் பொருள் தரப்பட்டு, வேறு சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: כִּי כֵן תִּלְבַּשְׁןָ
  choice: இவ்வாறுதான் உடை அணிவது வழக்கம்
  rationale: இந்த எபிரெயக் கட்டமைப்பு தொடர்ச்சியான வழக்கத்தை விளக்குவதால், நவீன தமிழில் இயல்பாக வழக்கச் செயலை வெளிப்படுத்துகிறது.
- source_word: בְנוֹת הַמֶּלֶךְ הַבְּתוּלֹת
  choice: கன்னியராக இருந்த அரசரின் மகள்கள்
  rationale: அரச குடும்ப நிலையும் கன்னித்தன்மையும் ஆகிய இரண்டையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: מְעִילִים
  choice: உடை அணிவது
  rationale: மூலத்தில் பன்மை ஆடைகள் அல்லது மேலங்கிகள் எனப் பொருள்படும் சொல் உள்ளது; தமிழில் முந்தைய அங்கிக் குறிப்பை தேவையின்றி மீண்டும் சொல்லாமல், அரச மகள்களின் வழக்கமான ஆடை அணிதலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: מְשָׁרְתוֹ
  choice: அவனுடைய பணியாள்
  rationale: சூழலில் அம்னோனுக்குத் தனிப்பட்ட முறையில் சேவை செய்த பணியாளைக் குறிக்கிறது.
- source_word: וַיֹּצֵא אוֹתָהּ הַחוּץ
  choice: அவளை வெளியே அனுப்பிவிட்டு
  rationale: அவளை வெளியில் செல்லச் செய்தான் என்ற causative பொருளை இயல்பான தமிழில் தருகிறது; வன்முறையின் அளவை மூலத்தைவிட அதிகப்படுத்துவதில்லை.
- source_word: וְנָעַל הַדֶּלֶת אַחֲרֶיהָ
  choice: அவளுக்குப் பின்னால் கதவைத் தாழிட்டான்
  rationale: נעל என்பதிலுள்ள பூட்டுதல் அல்லது தாழிடுதல் என்ற உறுதியான செயலைத் தெளிவாகக் காட்டுகிறது.
