translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் நேரடியான கதைநடை பயன்படுத்தப்பட்டுள்ளது. “இவளை” என்பது மூலத்தின் பெண்பால் சுட்டுப்பெயரையும் அம்னோனின் விலக்கி இழிவுபடுத்தும் தொனியையும் காக்கிறது. மூலத்தில் பணியாளனை நோக்கிய கட்டளை பன்மை வடிவில் இருப்பினும், ஒரே பணியாளனைச் சுட்டும் தமிழ் சூழலில் ஒருமைக் கட்டளை இயல்பாகத் தரப்பட்டுள்ளது.
