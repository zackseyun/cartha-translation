base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/017.yaml
  text: Then he called his young man who served him and said[a], “Please send this one away from me, outside[b], and bolt the door behind her.”
translation:
  language: ta
  text: அப்போது அவன் தனக்குப் பணிவிடை செய்யும் இளைஞனை அழைத்து, “இவளை என்னிடமிருந்து வெளியே அனுப்பிவிட்டு, அவளுக்குப் பின்னால் கதவைத் தாழிடு[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாழிடு” என்பதற்கு “பூட்டு” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல் கதவைத் தாழ்ப்பாள் இடுதல், அடைத்தல் அல்லது பூட்டுதல் ஆகிய பொருள்களைத் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרוֹ מְשָׁרְתוֹ
  choice: தனக்குப் பணிவிடை செய்த இளைஞன்
  rationale: נַעַר என்பதன் ‘இளைஞன்’ என்ற பொருளையும், מְשָׁרְתוֹ என்பதன் பணிசெய்த உறவையும் இயல்பான தமிழில் இரண்டையும் காக்கிறது.
- source_word: שִׁלְחוּ נָא
  choice: அனுப்பிவிட்டு
  rationale: שׁלח என்பதன் வெளியே அனுப்பும் கட்டளையைச் சூழலுக்கு ஏற்றவாறு தருகிறது. נָא இங்கு கட்டளையை வலியுறுத்தவோ மென்மைப்படுத்தவோ கூடும்; தமிழில் செயல் தொடரின் நேரடியான கட்டளைநடை இயல்பாக உள்ளது.
- source_word: זֹאת
  choice: இவளை
  rationale: பெண்பால் ஒருமை சுட்டுப்பெயரை பெயர்ச்சொல் சேர்க்காமல் நேரடியாகக் காக்கிறது; தாமாரைப் பெயரிட்டு அழைக்காமல் விலக்கிப் பேசும் இழிவான தொனியும் நிலைக்கிறது.
- source_word: מֵעָלַי הַחוּצָה
  choice: என்னிடமிருந்து வெளியே
  rationale: சொல்லுக்குச் சொல் ‘என்மேலிருந்து வெளியே’ என்பதற்குப் பதிலாக, அவளைத் தனது அருகிலிருந்து அகற்றி வெளியேற்றும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּנְעֹל הַדֶּלֶת
  choice: கதவைத் தாழிடு
  rationale: נעל என்பதன் கதவைத் தாழ்ப்பாள் இட்டு உறுதியாக மூடும் பொருளை பண்டைய கதவு அமைப்புக்கும் தமிழ் வழக்குக்கும் ஏற்றவாறு தருகிறது.
- source_word: אַחֲרֶיהָ
  choice: அவளுக்குப் பின்னால்
  rationale: அவள் வெளியே சென்றபின் அவளுக்குப் பின்னால் கதவைப் பாதுகாப்பாக மூட வேண்டும் என்ற இடவியல் பொருளைக் காக்கிறது.
