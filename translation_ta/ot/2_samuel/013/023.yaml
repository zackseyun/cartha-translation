  yaml_path: translation/ot/2_samuel/013/023.yaml
  text: It happened after two full years that Absalom had sheep shearers at Baal-hazor[a], which is near Ephraim, and Absalom invited all the king’s sons.
translation:
  language: ta
  text: இரண்டு முழு ஆண்டுகள் கடந்தபின்,[a] எப்பிராயீமுக்கு அருகிலுள்ள பாகால்-ஆத்சோரில் அப்சலோமின் ஆடுகளின் மயிர் கத்தரிப்பு நடந்தது. அப்சலோம் அரசனுடைய மகன்கள் அனைவரையும் அழைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இரண்டு ஆண்டுகள்—நாட்கள்”; இது முழுமையான இரண்டு ஆண்டு காலத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁנָתַיִם יָמִים
  choice: இரண்டு முழு ஆண்டுகள் கடந்தபின்
  rationale: ‘இரண்டு ஆண்டுகள்—நாட்கள்’ என்ற எபிரெய மரபுத்தொடர் நிறைவான இரண்டு ஆண்டு காலத்தைக் குறிக்கிறது; தமிழில் இயல்பாகவும் துல்லியமாகவும் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: גֹזְזִים
  choice: ஆடுகளை மயிர் கத்தரிப்பவர்கள்
  rationale: גזז என்பதன் பன்மை வினையெச்ச வடிவம் இச்சூழலில் ஆடுகளின் மயிரைக் கத்தரிக்கும் ஆட்களைக் குறிக்கிறது; மறைந்துள்ள செயப்படுபொருள் தெளிவாக்கப்பட்டுள்ளது.
- source_word: בְּבַעַל חָצוֹר
  choice: பாகால்-ஆத்சோரில்
  rationale: இது ஓர் இடப்பெயர் என்பதால் பொருளாக்காமல் ஒலிபெயர்க்கப்பட்டு, בְ இடவெற்றுமையாக ‘-இல்’ என வழங்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר עִם אֶפְרָיִם
  choice: எப்பிராயீமுக்கு அருகிலுள்ள
  rationale: עִם இங்கு உடனிருப்பதை அல்ல, புவியியல் அண்மையைச் சுட்டுகிறது; தமிழ் தொடரில் இயல்பாக பெயரெச்ச வடிவில் தரப்பட்டுள்ளது.
- source_word: וַיִּקְרָא
  choice: அழைத்தான்
  rationale: அடிப்படைப் பொருளான ‘அழைத்தான்’ விருந்துக்கு அழைக்கும் சூழலையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘வரவழைத்தான்’ என்ற கட்டாயத் தொனி தவிர்க்கப்பட்டுள்ளது.
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: அரசனுடைய மகன்கள் அனைவரையும்
  rationale: அரசனுடனான உறவையும் כָּל என்பதன் முழுமையையும் தெளிவாகப் பாதுகாக்கும் இயல்பான தமிழ் அமைப்பு.
- source_word: וַיְהִי
  choice: கடந்தபின்
  rationale: தனி ‘இப்போது’ சொல்லைச் சேர்க்காமல், எபிரெயக் கதைத் தொடரையும் நிகழ்வின் தொடக்கத்தையும் காலத் தொடருக்குள் இயல்பாக இணைக்கிறது.
