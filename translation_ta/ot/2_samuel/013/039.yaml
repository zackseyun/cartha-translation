revisions:
- from: அப்சலோமிடம் செல்ல தாவீது அரசன் ஏங்கினார்; ஏனெனில் அம்னோன் இறந்துவிட்டதைப் பற்றி அவர் ஆறுதல் அடைந்திருந்தார்.
  to: அரசன் தாவீது அப்சலோமிடம் செல்ல ஏங்கினார்; ஏனெனில் அம்னோன் இறந்துவிட்டபின், அம்னோனைப் பற்றிய அவரது துயரம் தணிந்திருந்தது.
  rationale: The revision keeps the disputed opening’s supported sense, “longed to go,” while replacing an awkward literal rendering of the latter clauses with natural Tamil that conveys David’s comfort—his grief had subsided—after Amnon’s death. No footnote is required because the supplied English audit trail has already selected the “longed” reading and the Tamil wording does not introduce a new interpretive claim.
