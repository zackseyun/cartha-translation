  text: And King David longed to go out to Absalom, for he was comforted concerning Amnon, since he was dead.
translation:
  language: ta
  text: அரசன் தாவீது அப்சலோமிடம் செல்ல ஏங்கினார்; ஏனெனில் அம்னோன் இறந்துவிட்டபின், அம்னோனைப் பற்றிய அவரது துயரம் தணிந்திருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּכַל ... לָצֵאת אֶל־אַבְשָׁלוֹם
  choice: அப்சலோமிடம் செல்ல ... ஏங்கினார்
  rationale: כָּלָה என்பதன் இவ்வடிவம் உரைநிலை மற்றும் பண்டைய மொழிபெயர்ப்புச் சான்றுகளின் அடிப்படையில் ‘ஏங்கினார்’ எனப் பொருள்படுகிறது; לָצֵאת אֶל என்பதைக் இயல்பான நவீனத் தமிழில் ‘செல்ல’ என வழங்குகிறது.
- source_word: כִּי נִחַם עַל־אַמְנוֹן
  choice: அம்னோன் இறந்துவிட்டதைப் பற்றி அவர் ஆறுதல் அடைந்திருந்தார்
  rationale: נִחַם இங்கு இழப்புக்குப் பின் ஆறுதல் அடைதல் அல்லது துயரம் தணிதல் என்ற பொருளில் உள்ளது; நிறைவுற்ற நிலையைத் தமிழில் ‘அடைந்திருந்தார்’ காட்டுகிறது.
- source_word: כִּי מֵת
  choice: இறந்துவிட்டதைப் பற்றி
  rationale: அம்னோனைச் சார்ந்த ஆறுதலுக்கான காரணம் அவன் இறந்தது என்பதைத் தமிழில் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: தாவீதின் மனநிலையை விவரிக்கும் தொடக்கச் சொல்லின் பொருள்
  choice: ஏங்கினார்
  alternative: செல்வதை நிறுத்தினார்
  rationale: மசோரா மெய்யெழுத்து உரை இலக்கண ரீதியாகக் கடினமானதாயினும், உயிர்க்குறியீட்டுடனான வாசிப்பும் முக்கியப் பண்டைய சான்றுகளும் அப்சலோமிடம் செல்லும் ஆவலைக் குறிக்கும் பாரம்பரியப் பொருளை ஆதரிக்கின்றன; எதிர்மறைச் செயலை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். பெயர்கள் ‘அப்சலோம்’, ‘தாவீது’, ‘அம்னோன்’ என வழக்கமான தமிழ் வேதாகம வடிவில் தரப்பட்டுள்ளன; மூலத்தின் காரணத் தொடர்பும் உணர்ச்சி நெருக்கடியும் பாதுகாக்கப்பட்டுள்ளன.
