  text: וַ/תֵּ֣לֶךְ תָּמָ֗ר בֵּ֛ית אַמְנ֥וֹן אָחִ֖י/הָ וְ/ה֣וּא שֹׁכֵ֑ב וַ/תִּקַּ֨ח אֶת הַ/בָּצֵ֤ק ו/תלוש וַ/תְּלַבֵּ֣ב לְ/עֵינָ֔י/ו וַ/תְּבַשֵּׁ֖ל אֶת הַ/לְּבִבֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/008.yaml
  text: So Tamar went to the house of her brother Amnon[a], while he was lying down. She took the dough, kneaded it, shaped it into cakes in his sight[b], and cooked the cakes.
translation:
  language: ta
  text: அதனால் தாமார் தன் சகோதரன் அம்னோனின் வீட்டுக்குச் சென்றாள். அவன் படுத்திருந்தான். அவள் மாவை எடுத்து, அதைப் பிசைந்து, அவன் கண்முன்னே அதை அடைகளாக வடிவமைத்து[a], அந்த அடைகளைச் சமைத்தாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதய வடிவ அடைகளாகச் செய்து.” இங்குள்ள எபிரெய வினைச்சொல்லும் பெயர்ச்சொல்லும் அரிதானவை; அவை “இதயம்” என்பதற்கான சொல்லுடன் தொடர்புடைய ஒரு வடிவத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அந்த அடைகளை வேகவைத்தாள்.” இங்குள்ள எபிரெய வினைச்சொல் குறிப்பாக நீரில் வேகவைத்தலைக் குறிக்கலாம்; ஆனால் இவ்விடத்தில் பொதுவாகச் சமைத்தலைக் குறிக்கவும் வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: அதனால் ... சென்றாள்
  rationale: வாவ் தொடர்வினை முந்தைய கட்டளையின் விளைவாகக் கதை நகர்வதைக் காட்டுகிறது; ‘அதனால்’ அந்தத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בֵּית אַמְנוֹן אָחִיהָ
  choice: தன் சகோதரன் அம்னோனின் வீட்டுக்கு
  rationale: இலக்கு இடத்தையும் தாமாருக்கும் அம்னோனுக்கும் உள்ள உறவையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְהוּא שֹׁכֵב
  choice: அவன் படுத்திருந்தான்
  rationale: அம்னோனின் அப்போதைய நிலையைக் கூறும் சூழ்நிலை வாக்கியம்; ‘படுக்கையில் இருந்தான்’ என்பதைக் காட்டிலும் எபிரெயச் சொல்லுக்கு நெருக்கமானது.
- source_word: הַבָּצֵק
  choice: மாவை
  rationale: உணவு தயாரிக்கும் சூழலில் בצק என்பதற்கான இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: וְתָלֹשׁ
  choice: அதைப் பிசைந்து
  rationale: לוש என்பது பொதுவாக மாவைப் பிசைவதைக் குறிக்கிறது.
- source_word: וַתְּלַבֵּב
  choice: அதை அடைகளாக வடிவமைத்து
  rationale: அரிதான இவ்வினைச்சொல் அடுத்துவரும் உணவுப்பொருளின் பெயருடன் தொடர்புடையது. அதன் வடிவம் இதய வடிவமா என்பது உறுதியில்லை; எனவே செயலைக் கூறி, அந்தச் சாத்தியத்தை அடிக்குறிப்பில் வைக்கிறது.
- source_word: לְעֵינָיו
  choice: அவன் கண்முன்னே
  rationale: ‘அவனுடைய கண்களுக்கு முன்பாக’ என்ற எபிரெய மொழிநடையை இயல்பாகவும் காட்சிப்பூர்வமாகவும் தருகிறது.
- source_word: וַתְּבַשֵּׁל
  choice: சமைத்தாள்
  rationale: בשל பொதுவாகச் சமைத்தல் என்றும் குறிப்பாக வேகவைத்தல் என்றும் வரலாம்; முறை தெளிவாகாததால் பொதுவான சொல்லை முதன்மை உரையில் பயன்படுத்துகிறது.
- source_word: הַלְּבִבוֹת
  choice: அந்த அடைகளை
  rationale: தாமார் மாவிலிருந்து உருவாக்கிய தட்டையான உணவுப் பொருளை நவீனத் தமிழில் புரியும்படி ‘அடைகள்’ எனக் குறிக்கிறது; சொல்லின் சாத்தியமான இதயத் தொடர்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
