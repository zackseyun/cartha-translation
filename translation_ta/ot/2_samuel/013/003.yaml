source:
  edition: WLC
  text: וּ/לְ/אַמְנ֣וֹן רֵ֗עַ וּ/שְׁמ/וֹ֙ יֽוֹנָדָ֔ב בֶּן שִׁמְעָ֖ה אֲחִ֣י דָוִ֑ד וְ/י֣וֹנָדָ֔ב אִ֥ישׁ חָכָ֖ם מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/003.yaml
  text: Amnon had a friend[a], whose name was Jonadab son of Shimeah, David’s brother; and Jonadab was a very shrewd man.
translation:
  language: ta
  text: அம்னோனுக்கு ஒரு நண்பன் இருந்தான். அவன் பெயர் யோனதாப்; அவன் தாவீதின் சகோதரனான சிமெயாவின் மகன். யோனதாப் மிகவும் புத்திக்கூர்மையுள்ளவன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “மிகவும் ஞானமுள்ளவன்”; சூழலைக் கருத்தில் கொண்டு “மிகவும் சாதுரியமானவன்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பரந்த பொருளில் ஞானத்தையோ திறமையான அறிவையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַמְנוֹן
  choice: அம்னோனுக்கு ... இருந்தான்
  rationale: எபிரெய மொழியின் உடைமைச் சொற்றொடரை இயல்பான தமிழில் ‘அம்னோனுக்கு ... இருந்தான்’ என்று வழங்குகிறது; மூலத்தில் இல்லாத காலச்சுட்டுச் சொல்லைச் சேர்க்கவில்லை.
- source_word: רֵעַ
  choice: நண்பன்
  rationale: இச்சொல் நண்பன், தோழன் அல்லது உடனிருப்பவன் எனப் பொருள்படலாம். இக்கதைச் சூழலில் ‘நண்பன்’ உறவைக் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: וּשְׁמוֹ
  choice: அவன் பெயர்
  rationale: எபிரெய பெயரறிமுகச் சொற்றொடரின் பொருளைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
- source_word: בֶּן שִׁמְעָה אֲחִי דָוִד
  choice: அவன் தாவீதின் சகோதரனான சிமெயாவின் மகன்
  rationale: ‘தாவீதின் சகோதரன்’ என்பது யோனதாபை அல்ல, சிமெயாவைக் குறிக்கிறது என்பதைத் தமிழில் தெளிவுபடுத்துகிறது; அதேவேளையில் வம்ச உறவையும் காக்கிறது.
- source_word: אִישׁ חָכָם מְאֹד
  choice: மிகவும் புத்திக்கூர்மையுள்ளவன்
  rationale: חָכָם என்பது ஞானம் அல்லது திறமையான அறிவைக் குறிக்கக்கூடியது. இங்கு ‘புத்திக்கூர்மையுள்ளவன்’ அறிவாற்றலைக் காட்டுகிறது; ஆனால் அவனுடைய பின்வரும் ஆலோசனைக்கு நல்லொழுக்க அங்கீகாரம் அளிப்பதில்லை.
theological_decisions:
- issue: யோனதாபின் חָכָם என்ற பண்பின் நல்லொழுக்க மதிப்பீடு
  choice: புத்திக்கூர்மையுள்ளவன்
  alternative: மிகவும் ஞானமுள்ளவன் / மிகவும் தந்திரமானவன்
  rationale: மூலச்சொல் பொதுவாக நேர்மறையான ‘ஞானம்’ என்றும், சூழலில் கூர்மையான அல்லது சூழ்ச்சியான அறிவு என்றும் புரியலாம். மொழிபெயர்ப்பு அவனை முன்கூட்டியே ஞானி என்றோ தீய சூழ்ச்சிக்காரன் என்றோ தீர்மானிக்காமல், கதையின் நல்லொழுக்கப் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரமான தமிழில், எளிமையான ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. பெயர்கள் தமிழ் வேதாகம வழக்கிற்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளன.
