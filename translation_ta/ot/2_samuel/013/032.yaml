base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/032.yaml
  text: Then Jonadab son of Shimeah[a], David’s brother, answered and said, “Let not my lord say, ‘They have killed all the young men, the king’s sons,’ for Amnon alone is dead[b]. For this had been determined by Absalom from the day he violated Tamar his sister.”
translation:
  language: ta
  text: 'அப்போது தாவீதின் சகோதரனான சிமெயாவின் மகன் யோனதாப் பதிலளித்துச் சொன்னான்: “என் ஆண்டவர், ‘அரசனின் மகன்களான இளைஞர்கள் அனைவரையும் அவர்கள் கொன்றுவிட்டார்கள்’ என்று சொல்ல வேண்டாம். அம்னோன் மட்டுமே இறந்தான். ஏனெனில், அப்சலோமின் திட்டத்தின்படி இது நிர்ணயிக்கப்பட்டிருந்தது[a]—அவன் தன் சகோதரி தாமாரைப் பாலியல் வன்கொடுமை செய்த நாளிலிருந்தே.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை, “அப்சலோமின் சொல் அல்லது கட்டளைப்படி இது நிர்ணயிக்கப்பட்டிருந்தது” என்றும் மொழிபெயர்க்கலாம்; அதாவது, அப்சலோமின் உறுதியான நோக்கத்தின்படி அது தீர்மானிக்கப்பட்டிருந்தது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: மறுமொழியாக ... என்றான்
  rationale: எபிரெயக் கதைநடையின் பதிலுரைக்கும் வடிவத்தை இயல்பான நவீனத் தமிழில் தருகிறது; ‘பதிலளித்துச் சொன்னான்’ என்ற தேவையற்ற இரட்டிப்பைத் தவிர்க்கிறது.
- source_word: יוֹנָדָב בֶּן שִׁמְעָה אֲחִי דָוִד
  choice: தாவீதின் சகோதரனான சிமெயாவின் மகன் யோனதாப்
  rationale: ‘தாவீதின் சகோதரன்’ என்பது சிமெயாவைக் குறிக்கிறது என்பதைத் தமிழில் தெளிவுபடுத்தி, எபிரெய உறவுமுறைத் தொடரைப் பாதுகாக்கிறது.
- source_word: אַל יֹאמַר אֲדֹנִי
  choice: என் ஆண்டவர் ... என்று சொல்ல வேண்டாம்
  rationale: אַל உடனான வேண்டாமைப் பொருளையும் அரண்மனைக்குரிய மரியாதைத் தொனியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל הַנְּעָרִים בְּנֵי הַמֶּלֶךְ
  choice: ராஜாவின் மகன்களான இளைஞர்கள் அனைவரையும்
  rationale: נְעָרִים என்பதன் ‘இளைஞர்கள்’ என்ற பொருளையும், அவர்கள் ராஜாவின் மகன்கள் என்ற பின்னிணைப்பையும் தெளிவாக வழங்குகிறது.
- source_word: הֵמִיתוּ
  choice: அவர்கள் கொன்றுவிட்டார்கள்
  rationale: வினையின் பன்மை எழுவாயையும், உயிரைப் போக்குதல் என்ற causative பொருளையும் காக்கிறது.
- source_word: אַמְנוֹן לְבַדּוֹ מֵת
  choice: அம்னோன் மட்டுமே இறந்தான்
  rationale: לְבַדּוֹ வலியுறுத்தும் தனித்தன்மையை ‘மட்டுமே’ நேரடியாக வெளிப்படுத்துகிறது.
- source_word: עַל פִּי אַבְשָׁלוֹם ... הָיְתָה שׂוּמָה
  choice: அப்சலோமால் இது முடிவுசெய்யப்பட்டிருந்தது
  rationale: ஒரு நிலையான தீர்மானம் அல்லது திட்டம் அப்சலோமிடமிருந்து வந்தது என்ற சூழல்பொருளைத் தெளிவாகக் கூறுகிறது; ‘சொல்/கட்டளைப்படி’ என்ற மொழியியல் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִיּוֹם עַנֹּתוֹ אֵת תָּמָר אֲחֹתוֹ
  choice: அவன் தன் சகோதரி தாமாரைப் பாலியல் வன்கொடுமை செய்த நாளிலிருந்தே
  rationale: ענה என்பதன் பியேல் வடிவம் இச்சூழலில் குறிக்கும் பாலியல் மீறலை மறைக்காமல், நவீன வாசகர்களுக்குத் தெளிவாகவும் கண்ணியமாகவும் தருகிறது; விரிந்த சொற்பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: 'அப்சலோமின் பங்கு: கட்டளையா, சொல்லா, உறுதியான நோக்கமா?'
  choice: அப்சலோமால் இது முடிவுசெய்யப்பட்டிருந்தது
  alternative: இது அப்சலோமின் கட்டளைப்படி நிர்ணயிக்கப்பட்டிருந்தது
  rationale: עַל־פִּי என்ற மரபுத்தொடர் ‘வாய்/சொல்/கட்டளைப்படி’ எனவும், இச்சூழலில் அப்சலோமின் உறுதியான தீர்மானத்தைக் குறிக்கவும் முடியும். முதன்மை உரை எந்த ஒரு நுணுக்கத்தையும் அளவுக்கு மீறி உறுதிசெய்யாமல் வைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ענה வினையின் தீவிரத்தையும் பாலியல் சூழலையும் மொழிபெயர்த்தல்
  choice: பாலியல் வன்கொடுமை செய்த
  alternative: அவமானப்படுத்தினான் / வன்புணர்வு செய்தான்
  rationale: முந்தைய நிகழ்வின் வெளிப்படையான பாலியல் வன்முறைச் சூழலை மறைக்காமல் கூறுகிறது; அதேவேளை எபிரெய வினையின் பரந்த ‘சிறுமைப்படுத்துதல்/அவமானப்படுத்துதல்’ பொருளையும் அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான கதைநடை மற்றும் அரண்மனை மரியாதைத் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘ராஜா’ என்பது பொதுவாக உடனே புரியும் அரசவைக் குறிப்பாகவும், ‘பாலியல் வன்கொடுமை’ என்பது நிகழ்வின் தீவிரத்தை மறைக்காத தற்போதைய மரியாதையான சொல்லாக்கமாகவும் தேர்ந்தெடுக்கப்பட்டது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களின் அருகில் சரியாக வைக்கப்பட்டுள்ளன.
