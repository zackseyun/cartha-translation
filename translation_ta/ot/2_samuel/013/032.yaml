  terminology: பெயர்கள் யோனதாப், சிமெயா, அம்னோன், அப்சலோம், தாமார் ஆகியவை நிலையாக உள்ளன. ‘பாலியல் வன்கொடுமை செய்தான்’ சூழலின் கடுமையை மறைக்காமல், வினைச்சொல்லின் விரிந்த பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது. ‘வன்புணர்வு’ என்பதற்குப் பதில் ‘பாலியல் பலாத்காரம்’ என்பது நவீன நிலையான பயன்பாட்டில் மேலும் தெளிவான மாற்றுச்சொல்.
