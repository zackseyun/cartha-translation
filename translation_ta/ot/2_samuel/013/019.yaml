base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/019.yaml
  text: Then Tamar put ashes on her head[a], tore the robe of many colors that was on her, put her hand on her head, and went away, going and crying out.
translation:
  language: ta
  text: அப்போது தாமார் தன் தலையில் சாம்பலைப் போட்டு, தான் அணிந்திருந்த சிறப்பான அங்கியை[a] கிழித்தாள். தன் கையைத் தலையின்மேல் வைத்து, கதறிக்கொண்டே சென்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீண்ட அங்கி,” “அலங்கரிக்கப்பட்ட அங்கி,” “பல வண்ண அங்கி.” எபிரெயச் சொற்றொடரின் பொருள் உறுதியற்றது. இந்தச் சூழலில், அரசரின் கன்னிப் புதல்விகள் அணிந்த தனிச்சிறப்புடைய ஆடையை இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵפֶר
  choice: சாம்பல்
  rationale: துக்கத்தின் அடையாளமாகத் தலையில் போடப்படும் சாம்பலைக் குறிக்கிறது; தமிழில் ஒருமை வடிவமே இயல்பானது.
- source_word: וַתִּקַּח ... עַל רֹאשָׁהּ
  choice: தன் தலையில் சாம்பலைப் போட்டுக்கொண்டு
  rationale: சொல்லுக்குச் சொல் அமைப்பை விட, துக்கச் செயலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: כְתֹנֶת הַפַּסִּים
  choice: சிறப்பான அங்கி
  rationale: எபிரெயச் சொற்றொடரின் துல்லியமான பொருள் உறுதியற்றது. நீண்ட கை, பல வண்ணம் போன்ற குறிப்பிட்ட விளக்கங்களில் ஒன்றைத் தீர்மானிக்காமல், அரசனின் கன்னிப் புதல்விகள் அணிந்த தனிச்சிறப்புடைய உடை என்ற சூழல்சார் பொருளைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר עָלֶיהָ
  choice: தான் அணிந்திருந்த
  rationale: அவள் அப்போது அணிந்திருந்த அங்கியையே குறிக்கும் உறவுத் தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: קָרָעָה
  choice: கிழித்தாள்
  rationale: துக்கத்தில் ஆடையைக் கிழிக்கும் செயலை நேரடியாகக் குறிக்கிறது.
- source_word: וַתָּשֶׂם יָדָהּ עַל רֹאשָׁהּ
  choice: தன் கையைத் தலையின்மேல் வைத்துக்கொண்டு
  rationale: துயரத்தையும் அவமானத்தையும் வெளிப்படுத்தும் உடல் சைகையை மேலதிக விளக்கமின்றி பாதுகாக்கிறது.
- source_word: וַתֵּלֶךְ הָלוֹךְ וְזָעָקָה
  choice: போகும் வழியெல்லாம் கதறிக்கொண்டே சென்றாள்
  rationale: சென்றுகொண்டிருக்கும்போதே தொடர்ந்து உரக்க அழுதாள் என்ற நீடித்த செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: זָעָקָה
  choice: கதறிக்கொண்டே
  rationale: உரத்த துயரக் கூக்குரலைக் குறிக்கிறது; அது அலறலா, புலம்பலா, உதவிக்குரலா என்பதைத் தேவையின்றி வரையறுக்கவில்லை.
