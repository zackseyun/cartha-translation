translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வினைத் தொடரின் நீடித்த செயற்பாங்கு ‘போகும் வழியெல்லாம் ... கொண்டே’ என்பதால் வெளிப்படுத்தப்பட்டது; உறுதியற்ற ஆடைச் சொல்லுக்கு குறிப்பிட்ட பாரம்பரிய விளக்கம் முதன்மை உரையில் திணிக்கப்படவில்லை.
