- from: ஆனால் அவன் அவளுடைய குரலுக்குச் செவிகொடுக்க மனமில்லாதவனாக இருந்தான்[a]. அவளைவிட அவன் வலிமைமிக்கவனாக இருந்தான்[b]; அவளை வன்புணர்ந்து[c], அவளோடு படுத்தான்.
  to: ஆனால் அவன் அவளுடைய குரலுக்குச் செவிகொடுக்க விரும்பவில்லை[a]. அவளைவிட அவன் வலிமைமிக்கவனாக இருந்தான்[b]; அவளை வன்புணர்ந்தான்[c], அவளோடு படுத்தான்.
