  text: But he would not listen to her[a], and he was stronger than she was[c][b], and he violated her and lay with her.
translation:
  language: ta
  text: ஆனால் அவன் அவளுடைய குரலுக்குச் செவிகொடுக்க விரும்பவில்லை[a]. அவளைவிட அவன் வலிமைமிக்கவனாக இருந்தான்[b]; அவளை வன்புணர்ந்தான்[c], அவளோடு படுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, ‘அவளுடைய குரலுக்குச் செவிகொடுக்க அவன் விரும்பவில்லை.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவன் அவளைத் தன் வலிமையால் அடக்கினான்.’
    reason: lexical_alternative
  - marker: c
    text: இந்த எபிரெய வினை ‘தாழ்த்தினான்,’ ‘அவமானப்படுத்தினான்,’ அல்லது ‘துன்புறுத்தினான்’ என்றும் பொருள்படலாம்; இங்கு அது வலுக்கட்டாயமான பாலியல் வன்முறையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: மனமில்லாதவனாக இருந்தான்
  rationale: இந்த வினை விருப்பம் அல்லது மனவிருப்பத்தைக் குறிக்கிறது. மறுப்பு மற்றும் வினையெச்சத்துடன் வரும் இவ்வமைப்பு, அவன் வேண்டுமென்றே செவிகொடுக்க மறுத்ததை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִשְׁמֹעַ בְּקוֹלָהּ
  choice: அவளுடைய குரலுக்குச் செவிகொடுக்க
  rationale: எபிரெயச் சொற்றொடரின் உருவகத்தையும், அவளுடைய வேண்டுகோளை ஏற்றுக்கொள்ளாமல் போன கருத்தையும் தக்கவைக்கிறது.
- source_word: וַיֶּחֱזַק מִמֶּנָּה
  choice: அவளைவிட அவன் வலிமைமிக்கவனாக இருந்தான்
  rationale: חזק உடன் מן வரும் ஒப்பீட்டு அமைப்பைத் தெளிவாகப் பாதுகாக்கிறது; அடுத்த வினைகளுடன் இதை ஒன்றாக்காமல் செயல்களின் வரிசையையும் தக்கவைக்கிறது.
- source_word: וַיְעַנֶּהָ
  choice: அவளை வன்புணர்ந்து
  rationale: ענה என்பதற்கு தாழ்த்துதல், அவமானப்படுத்துதல், துன்புறுத்துதல் போன்ற பரந்த பொருள்கள் உண்டு; ஆனால் இங்குள்ள கட்டாய பாலியல் சூழலில் அது பாலியல் வன்முறையைக் குறிக்கிறது. ‘வன்புணர்ந்து’ என்பது பாதிக்கப்பட்டவள்மீது குற்றச்சாயல் சுமத்தாமல் நிகழ்வைத் தெளிவாகச் சொல்கிறது.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: அவளோடு படுத்தான்
  rationale: பாலுறவைக் குறிக்கும் எபிரெய மரபுத்தொடரின் வடிவத்தைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது. முந்தைய வினை அந்த உறவு வலுக்கட்டாயமானது என்பதைத் தெளிவாக்குகிறது.
