- from: 'அவர்கள் வழியில் இருந்தபோது, தாவீதுக்கு ஒரு செய்தி வந்தது[a]: “அப்சலோம் அரசரின் மகன்கள் அனைவரையும் வெட்டிக் கொன்றுவிட்டான்; அவர்களில் ஒருவன்கூட எஞ்சவில்லை.”'
  to: 'அவர்கள் வழியில் இருந்தபோது, தாவீதுக்கு ஒரு செய்தி[a] வந்தது: “அப்சலோம் அரசரின் மகன்கள் அனைவரையும் கொன்றான்; அவர்களில் ஒருவன்கூட எஞ்சவில்லை.”'
  rationale: The revision removes the unsupported implication that Absalom killed the men by cutting, while retaining the report's clear claim of their deaths. It also relocates the footnote marker so that it directly annotates “செய்தி,” the rendering of the Hebrew term with the report/news/rumor semantic range.
