  text: וַֽ/יְהִי֙ הֵ֣מָּה בַ/דֶּ֔רֶךְ וְ/הַ/שְּׁמֻעָ֣ה בָ֔אָה אֶל דָּוִ֖ד לֵ/אמֹ֑ר הִכָּ֤ה אַבְשָׁלוֹם֙ אֶת כָּל בְּנֵ֣י הַ/מֶּ֔לֶךְ וְ/לֹֽא נוֹתַ֥ר מֵ/הֶ֖ם אֶחָֽד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/030.yaml
  text: While they were on the way[a], the report came to David, saying, “Absalom has struck down all the king’s sons, and not one of them is left.”
translation:
  language: ta
  text: 'அவர்கள் வழியில் இருந்தபோது, தாவீதுக்கு ஒரு செய்தி[a] வந்தது: “அப்சலோம் அரசரின் மகன்கள் அனைவரையும் கொன்றான்; அவர்களில் ஒருவன்கூட எஞ்சவில்லை.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒரு தகவல்” அல்லது “ஒரு வதந்தி” என்றும் மொழிபெயர்க்கலாம்; இதற்கான எபிரெயச் சொல் உறுதிப்படுத்தப்படாத செய்தியையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵמָּה בַדֶּרֶךְ
  choice: அவர்கள் வழியில் இருந்தபோது
  rationale: எபிரெயக் கதைநடைத் தொடர் இங்கு தரும் சூழ்நிலை மற்றும் காலப் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַשְּׁמֻעָה
  choice: ஒரு செய்தி
  rationale: שְׁמוּעָה என்பது செய்தி, தகவல், அல்லது உறுதிப்படுத்தப்படாத வதந்தி எனப் பொருள்படலாம். அடுத்த வசனங்களில் அது தவறான தகவல் என்று தெளிவாவதால், ‘செய்தி’ என உரையில் வைத்து அதன் உறுதியற்ற தன்மையை அடிக்குறிப்பில் குறிப்பிடுவது பொருத்தமானது.
- source_word: בָאָה אֶל דָּוִד
  choice: தாவீதுக்கு ... வந்தது
  rationale: ‘செய்தி தாவீதிடம் வந்தது’ என்ற எபிரெயச் சொற்றொடரை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: לֵאמֹר
  choice: 'வந்தது:'
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் לֵאמֹר என்பதன் செயல்பாட்டை தமிழில் முக்காற்புள்ளி இயல்பாக நிறைவேற்றுகிறது; தனியாக ‘என்று சொல்லி’ எனச் சேர்ப்பது தேவையற்றதாக இருக்கும்.
- source_word: הִכָּה
  choice: வெட்டிக் கொன்றுவிட்டான்
  rationale: נכה என்பது ‘அடி/தாக்கு’ என்றும், உயிரைப் பறிக்கும் சூழலில் ‘கொல்’ என்றும் பொருள்படும். இங்குள்ள தகவல் அனைவரும் எஞ்சாமல் கொல்லப்பட்டதாகக் கூறுவதால், மரணத்தைத் தெளிவாகக் குறிக்கும் இயல்பான தமிழ் தேர்ந்தெடுக்கப்பட்டது.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: அரசரின் மகன்கள் அனைவரையும்
  rationale: ஆண் பிள்ளைகளைக் குறிப்பாகச் சுட்டும் בְּנֵי என்பதையும் ‘அரசரின்’ என்ற உறவையும் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: וְלֹא נוֹתַר מֵהֶם אֶחָד
  choice: அவர்களில் ஒருவன்கூட எஞ்சவில்லை
  rationale: ஒருவரும் மீதியாக இருக்கவில்லை என்ற எபிரெய வலியுறுத்தலை சுருக்கமான, இயல்பான தமிழில் தருகிறது.
