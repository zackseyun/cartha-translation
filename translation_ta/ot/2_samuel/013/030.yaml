translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமான கதைநடையிலும் மொழிபெயர்க்கப்பட்டது. தவறானதாகப் பின்னர் தெரியவரும் தகவலை உரையே முன்கூட்டியே ‘வதந்தி’ என்று தீர்மானிக்காமல், மூலமொழியின் பொருள் விரிவை அடிக்குறிப்பில் பாதுகாக்கிறது.
