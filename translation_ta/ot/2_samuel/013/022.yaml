  text: וְ/לֹֽא דִבֶּ֧ר אַבְשָׁל֛וֹם עִם אַמְנ֖וֹן לְ/מֵ/רָ֣ע וְ/עַד ט֑וֹב כִּֽי שָׂנֵ֤א אַבְשָׁלוֹם֙ אֶת אַמְנ֔וֹן עַל דְּבַר֙ אֲשֶׁ֣ר עִנָּ֔ה אֵ֖ת תָּמָ֥ר אֲחֹתֽ/וֹ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/022.yaml
  text: And Absalom did not speak with Amnon[a], either bad or good[b], because Absalom hated Amnon because he had violated Tamar his sister.
translation:
  language: ta
  text: அப்சலோம் அம்னோனிடம் நல்லதோ கெட்டதோ எதுவும் பேசவில்லை[a]. ஏனெனில், தன் சகோதரி தாமாரை அம்னோன் பாலியல் வன்முறைக்கு உள்ளாக்கியதால்[b], அப்சலோம் அவனை வெறுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக, “கெட்டதுமுதல் நல்லதுவரை பேசவில்லை.” இது அம்னோனிடம் எந்த வகையிலும் பேசவில்லை என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தாமாரைத் தாழ்த்தியதால்.” இச்சூழலில் எபிரெய வினைச்சொல் அவளுக்கு இழைக்கப்பட்ட பாலியல் வன்முறையையும் அவமானத்தையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבֶּר ... עִם
  choice: அம்னோனிடம் ... பேசவில்லை
  rationale: דבר עם என்பதன் இயல்பான பொருள் ஒருவரிடம் அல்லது ஒருவரோடு பேசுதல். நவீனத் தமிழில் ‘அம்னோனிடம் பேசவில்லை’ என்பது உறவுநிலையையும் உரையாடாமையையும் தெளிவாகக் காட்டுகிறது.
- source_word: לְמֵרָע וְעַד טוֹב
  choice: நல்லதோ கெட்டதோ எதுவும்
  rationale: எபிரெயச் சொற்றொடர் எந்தவிதமான பேச்சும் இல்லை என்பதைக் குறிக்கும் இருதுருவ மரபுத்தொடர். மூலத்தின் இரு துருவங்களையும் தக்கவைத்து, தமிழில் அதன் முழுப் பொருளை இயல்பாக வெளிப்படுத்த ‘எதுவும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அப்சலோமின் பேசாமைக்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பாக இங்கு வருகிறது.
- source_word: שָׂנֵא
  choice: வெறுத்தான்
  rationale: வினைச்சொல்லின் வலுவான, நேரடியான பொருளை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: עַל דְּבַר אֲשֶׁר
  choice: '... உள்ளாக்கியதால்'
  rationale: இந்தச் சொற்றொடர் வெறுப்புக்கான காரணத்தை அறிமுகப்படுத்துகிறது. பெயர்ச்சொல் அமைப்பைச் செயற்கையாகப் பிரதிபலிக்காமல், அதன் காரணப் பொருளைத் தெளிவான தமிழில் தருகிறது.
- source_word: עִנָּה
  choice: பாலியல் வன்முறைக்கு உள்ளாக்கியதால்
  rationale: இந்த நிகழ்வுச் சூழலில் ענה என்பது தாமாருக்கு இழைக்கப்பட்ட பாலியல் வன்முறையையும் அவமதிப்பையும் குறிக்கிறது. ‘பாலியல் வன்முறை’ குற்றத்தின் தன்மையைத் தெளிவுபடுத்துகிறது; அதேவேளை இந்த ஒரே வினைச்சொல்லில் இல்லாத தனிப்பட்ட சட்டவகைப்பாட்டைத் திணிப்பதில்லை.
- source_word: אֲחֹתוֹ
  choice: தன் சகோதரி
  rationale: பின்னொட்டு அப்சலோமைக் குறிக்கிறது. ‘தன்’ என்பது தாமார் அப்சலோமின் சகோதரி என்பதைத் தமிழில் குழப்பமின்றித் தெரிவிக்கிறது.
theological_decisions:
- issue: ענה என்ற வினையின் பாலியல் வன்முறை சார்ந்த பொருள்
  choice: பாலியல் வன்முறைக்கு உள்ளாக்கிய
  alternative: அவமானப்படுத்திய / கற்பழித்த
  rationale: முந்தைய நிகழ்வின் தெளிவான பாலியல் வன்முறைச் சூழலை மறைக்காமல் மொழிபெயர்க்கிறது. ‘அவமானப்படுத்திய’ என்பது இங்கு மிக மங்கலானது; ‘கற்பழித்த’ என்பது சூழலுக்கு ஏற்றதாக இருந்தாலும், இக்கிளவியில் உள்ள வினையின் பொருளை ஒரு குறிப்பிட்ட சட்டச் சொல்லாக அதிகமாகச் சுருக்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் நிகழ்வின் தீவிரத்தை மறைக்காத கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. பெயர்கள் ‘அப்சலோம், அம்னோன், தாமார்’ எனத் தமிழாக்கப்பட்டன. இரு அடிக்குறிப்பு குறியீடுகளும் தொடர்புடைய முதன்மை உரை இடங்களில் வைக்கப்பட்டுள்ளன.
