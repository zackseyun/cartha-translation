  edition: WLC
  text: וַ/תַּגֵּ֥שׁ אֵלָ֖י/ו לֶֽ/אֱכֹ֑ל וַ/יַּֽחֲזֶק בָּ/הּ֙ וַ/יֹּ֣אמֶר לָ֔/הּ בּ֛וֹאִי שִׁכְבִ֥י עִמִּ֖/י אֲחוֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/011.yaml
  text: When she brought it near to him to eat[a], he seized her and said to her, “Come, lie with me, my sister.”
translation:
  language: ta
  text: அவள் அவன் சாப்பிடுவதற்காக அதை அவனிடம் கொண்டுவந்தபோது[a], அவன் அவளைப் பிடித்து, “வா, என்னோடு படு, என் சகோதரியே” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவள் சாப்பிடுவதற்காக அவனிடம் வந்தபோது”; இங்குள்ள எபிரெய வினைச்சொல், தாமார் அவனிடம் வந்தாள் என்றோ, உணவை அவனிடம் கொண்டுவந்தாள் என்றோ பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ
  choice: அதை அவனருகே கொண்டுவந்தபோது
  rationale: נגשׁ இங்கு ‘அருகே வருதல்’ அல்லது ‘அருகே கொண்டுவருதல்’ என இருவகையில் பொருள்படலாம். தாமார் உணவைப் பரிமாறும் சூழலில் ‘அதை அவனருகே கொண்டுவந்தாள்’ என்பது இயல்பான முதன்மை வாசகம்; உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: אֵלָיו לֶאֱכֹל
  choice: அவன் சாப்பிடுவதற்காக ... அவனருகே
  rationale: אֵלָיו திசையைச் சுட்டுகிறது; לֶאֱכֹל நோக்கத்தைக் குறிக்கும் வினையெச்சம். தமிழில் செய்பவர் தெளிவாக இருக்க ‘அவன் சாப்பிடுவதற்காக’ என்று வழங்கப்பட்டுள்ளது.
- source_word: וַיַּחֲזֶק בָּהּ
  choice: அவன் அவளைப் பிடித்துக்கொண்டு
  rationale: חזק + בְּ உறுதியாகப் பற்றிக்கொள்வதைக் குறிக்கிறது. வற்புறுத்தலான சூழலை மறைக்காமல், மூலத்தில் இல்லாத அளவுக்கு வன்முறையின் முறையை விரிவாக்காமலும் ‘பிடித்துக்கொண்டு’ இயல்பாகத் தருகிறது.
- source_word: בּוֹאִי
  choice: வா
  rationale: பெண்பால் ஒருமை கட்டளை; நேரடியான கட்டளைத் தன்மையைப் பாதுகாக்கிறது.
- source_word: שִׁכְבִי עִמִּי
  choice: என்னோடு படு
  rationale: שׁכב עם பாலுறவைக் குறிக்கும் நிலையான எபிரெய மொழிவழக்கு. தமிழில் ‘என்னோடு படு’ அதன் நேரடித்தன்மையையும் கடுமையையும் தேவையற்ற விளக்கமின்றி காக்கிறது.
- source_word: אֲחוֹתִי
  choice: என் சகோதரியே
  rationale: உறவுமுறை அழைப்பை வெளிப்படையாகத் தக்கவைக்கிறது; இந்த உறவு நிகழ்வின் ஒழுக்க மற்றும் கதைசார் கொடுமையைத் தீவிரப்படுத்துகிறது.
theological_decisions:
- issue: பாலுறவுக்கான கட்டளையை மென்மைப்படுத்தாமல் மொழிபெயர்த்தல்
  choice: என்னோடு படு
  alternative: என்னோடு உறங்கிவிடு
  rationale: எபிரெயச் சொற்றொடர் பாலுறவைக் குறிக்கும். ‘படு’ என்பது கோரிக்கையை மறைக்காமல் தருகிறது; ‘உறங்கு’ என்பது நவீன தமிழில் சில வாசகர்களுக்கு வெறும் தூக்கத்தைக் குறிக்கக்கூடும்.
- issue: உறவுமுறை அழைப்பைத் தக்கவைத்தல்
  choice: என் சகோதரியே
  alternative: தங்கையே
  rationale: மூலத்தின் אָחוֹתִי பொதுவாக ‘என் சகோதரி’ என்பதாகும். வயது அல்லது தமிழ்ச் சமூக உறவழைப்பின் நுணுக்கத்தை மூலத்தில் இல்லாமல் சேர்க்காமல், உறவைத் தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. வன்முறையும் பாலியல் கோரிக்கையும் மென்மைப்படுத்தப்படவில்லை; அதேவேளை மூலத்தை மீறிய வெளிப்படையான விவரிப்பும் சேர்க்கப்படவில்லை. ‘சகோதரி’ என்பது பரந்த, நடுநிலையான உறவுமுறைச் சொலாகத் தேர்ந்தெடுக்கப்பட்டது.
