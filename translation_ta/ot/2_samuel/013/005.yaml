base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/005.yaml
  text: Jehonadab said to him[a], “Lie down on your bed and pretend to be sick. When your father comes to see you, say to him, ‘Please let Tamar my sister come and give me food, and let her prepare the meal in my sight[c][b], so that I may watch and eat from her hand.’”
translation:
  language: ta
  text: யோனதாப் அவனிடம், “நீ உன் படுக்கையில் படுத்துக்கொண்டு, நோயுற்றவனைப்போல் நடி[a]. உன் தந்தை உன்னைப் பார்க்க வரும்போது, அவரிடம், ‘தயவுசெய்து என் சகோதரி தாமார் வந்து எனக்கு உணவளிக்கட்டும்[b]; நான் பார்த்துக்கொண்டிருக்கும்போதே அவள் அந்த உணவை[c] தயாரிக்கட்டும். அப்போது நான் அதைப் பார்த்து, அவளுடைய கையிலிருந்து பெற்றுச் சாப்பிடுவேன்’ என்று சொல்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நோயுற்றதாகக் காட்டிக்கொள்.” எபிரெய வினைச்சொல் இங்கு தன்னை நோயுற்றவனாகத் தோன்றச் செய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “அப்பம்”; இந்தச் சொல் பல இடங்களில் பொதுவாக உணவையும் குறிக்கும்.
    reason: lexical_alternative
  - marker: c
    text: இந்த எபிரெயச் சொல், நோயாளிக்காக அல்லது நோயிலிருந்து தேறிவருபவருக்காகச் சிறப்பாகத் தயாரிக்கப்படும் உணவைக் குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁכַב עַל מִשְׁכָּבְךָ
  choice: உன் படுக்கையில் படுத்துக்கொண்டு
  rationale: கட்டிலில் அல்லது படுக்கையில் படுப்பதைக் குறிக்கும் எபிரெயச் சொற்றொடரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וְהִתְחָל
  choice: நோயுற்றவனைப்போல் நடி
  rationale: இந்தச் சூழலில் உண்மையில் நோயுறுவதல்ல, நோயுற்றதாகத் தோற்றமளிக்கும்படி நடிப்பதே பொருள்.
- source_word: וּבָא אָבִיךָ לִרְאוֹתֶךָ
  choice: உன் தந்தை உன்னைப் பார்க்க வரும்போது
  rationale: அறிவுறுத்தல்களின் தொடரில் வரும் வாவ் இணைப்பை இயல்பான காலத் துணைவாக்கியமாகத் தருகிறது.
- source_word: תָּבֹא נָא
  choice: வந்து ... என்று தயவுசெய்து சொல்லுங்கள்
  rationale: נָא குறிக்கும் பணிவான வேண்டுகோளைத் தமிழில் மரியாதையுடன் வெளிப்படுத்துகிறது; தந்தையிடம் தாமாரை வரச் செய்யுமாறு கேட்பது தெளிவாகிறது.
- source_word: תָמָר אֲחוֹתִי
  choice: என் சகோதரி தாமார்
  rationale: அம்னோனின் பேச்சிலுள்ள உறவுமுறையையும் பெயரையும் நேரடியாகத் தக்கவைக்கிறது.
- source_word: וְתַבְרֵנִי לֶחֶם
  choice: எனக்கு உணவளிக்கட்டும்
  rationale: ברה இங்கு நோயாளிக்கு ஊட்டமளிப்பதை அல்லது உணவு வழங்குவதைச் சுட்டுகிறது; பின்னர் வரும் ‘தயாரிக்கட்டும்’ என்பதிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: וְעָשְׂתָה לְעֵינַי אֶת הַבִּרְיָה
  choice: நான் பார்த்துக்கொண்டிருக்கும்போதே அவள் அந்த உணவை தயாரிக்கட்டும்
  rationale: לְעֵינַי என்பதன் பார்வை சார்ந்த பொருளையும், עשה என்பதன் தயாரித்தல் என்ற பொருளையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: לְמַעַן אֲשֶׁר אֶרְאֶה
  choice: அப்போது நான் அதைப் பார்த்து
  rationale: ראה என்பதன் வெளிப்படையான பார்வைப் பொருளைத் தக்கவைக்கிறது; எபிரெயத்தில் தனியான வெளிப்படையான செயப்படுபொருள் இல்லாவிட்டாலும், தமிழில் ‘அதை’ என்பது முன்சொன்ன உணவைக் குறிக்கும் இயல்பான சுட்டுப்பெயர்.
- source_word: וְאָכַלְתִּי מִיָּדָהּ
  choice: அவளுடைய கையிலிருந்து வாங்கிச் சாப்பிடுவேன்
  rationale: உணவைத் தாமார் தனிப்பட்ட முறையில் அவனிடம் கொடுக்க வேண்டும் என்ற சதிக்குத் தேவையான நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
