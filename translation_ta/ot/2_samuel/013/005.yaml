translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையைப் பயன்படுத்துகிறது. தந்தையிடம் பேசும் மேற்கோளில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. ‘உணவளிக்கட்டும்’ மற்றும் ‘தயாரிக்கட்டும்’ என்று வேறுபடுத்தி, ברה மற்றும் עשה ஆகிய இரு வினைகளின் வேறுபாடு காக்கப்பட்டுள்ளது.
