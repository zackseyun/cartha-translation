translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயத்தின் ‘வெறுப்புடன் வெறுத்தான்’ மற்றும் ‘அன்பு/வெறுப்பு’ மறுபடியுரைத்தல் சற்றே செறிவானதாக இருந்தாலும், வசனத்தின் வலியுறுத்தலையும் கூர்மையான முரண்பாட்டையும் காக்கத் தக்கவைக்கப்பட்டது. அடிக்குறிப்பு குறி அதற்குரிய திடீர் கட்டளைக்குப் பின்னர் வைக்கப்பட்டது.
