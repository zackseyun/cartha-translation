  text: Then Amnon hated her with very great hatred[a], because the hatred with which he hated her was greater than the love with which he had loved her. And Amnon said to her, “Get up, go.”
translation:
  language: ta
  text: அப்போது அம்னோன் அவளை மிகப் பெரிய வெறுப்புடன் வெறுத்தான். ஏனெனில், அவன் அவளை வெறுத்த வெறுப்பு, அவன் முன்பு அவளை நேசித்த அன்பைவிடப் பெரிதாக இருந்தது. அம்னோன் அவளிடம், “எழுந்திரு, போ[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் இரண்டு சுருக்கமான கட்டளைகள்: “எழுந்திரு, போ.” இவற்றின் திடீர் நடை அம்னோனின் கடுமையான நிராகரிப்பை உணர்த்துகிறது; சில மொழிபெயர்ப்புகள் பொருளை விரித்துச் சொல்லி, “எழுந்து வெளியே போ” எனத் தருகின்றன.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂנָאֶהָ
  choice: அப்போது அம்னோன் அவளை ... வெறுத்தான்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுத்துச் செல்கிறது; தமிழில் ‘அப்போது’ இயல்பாக அந்தத் தொடர்ச்சியைக் காட்டுகிறது. பெண்பால் ஒருமை பின்னொட்டு தாமாரைச் சுட்டும் ‘அவளை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שִׂנְאָה גְּדוֹלָה מְאֹד
  choice: மிகப் பெரிய வெறுப்புடன்
  rationale: வினையையும் அதே வேரிலுள்ள பெயர்ச்சொல்லையும் சேர்த்துக் கூறும் எபிரெய வலியுறுத்தலை முடிந்தவரைத் தக்கவைக்கிறது; ‘மிகப் பெரிய’ என்பது גְּדוֹלָה מְאֹד என்பதன் தீவிரத்தை வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இயல்பான நவீனத் தமிழ் இணைப்புச்சொல்.
- source_word: גְדוֹלָה הַשִּׂנְאָה ... מֵאַהֲבָה
  choice: அன்பைவிட ... வெறுப்பு பெரிதாக இருந்தது
  rationale: מִן இங்கு ஒப்பீட்டைக் குறிக்கிறது. தமிழ் ‘-விட’ அமைப்பு அந்த ஒப்பீட்டைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲשֶׁר אֲהֵבָהּ
  choice: அவன் முன்பு அவளை நேசித்த அன்பு
  rationale: முழுநிறை வினை, பின்னர் ஏற்பட்ட வெறுப்புக்கு முந்திய அன்பைச் சுட்டுகிறது; ‘முன்பு’ நிகழ்வுகளின் வரிசையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: אֲשֶׁר שְׂנֵאָהּ
  choice: இப்போது அவன் அவளை வெறுத்த வெறுப்பு
  rationale: மூலத்தின் வினை–பெயர்ச்சொல் மறுபடியுரைத்தலைப் பேணி, முந்தைய அன்புடன் முரண்படும் தற்போதைய வெறுப்பைத் தெளிவாக்குகிறது.
- source_word: קוּמִי לֵכִי
  choice: எழுந்திரு, போ
  rationale: இரண்டும் பெண்பால் ஒருமை கட்டளைகள். கூடுதல் விளக்கமின்றி இரண்டு சுருக்கமான கட்டளைகளாகத் தருவது அம்னோனின் கடுமையான துரத்தலைப் பாதுகாக்கிறது.
