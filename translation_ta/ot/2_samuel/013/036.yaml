base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/036.yaml
  text: And as soon as he finished speaking[a], behold, the king’s sons came, and they raised their voices and wept. The king also, and all his servants, wept with very great weeping.
translation:
  language: ta
  text: அவன் பேசி முடித்தவுடனே, இதோ, அரசனின் மகன்கள் வந்தார்கள். அவர்கள் உரத்த குரலெடுத்து அழுதார்கள். அரசனும் அவனுடைய பணியாளர்கள் அனைவரும் மிகவும் கதறி அழுதார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “மிகப் பெரும் அழுகையாக அழுதார்கள்” என்று ஒரே சொல்லின் வேரை மீண்டும் பயன்படுத்தி, அவர்களுடைய கடும் துக்கம் வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר
  choice: அவன் பேசி முடித்தவுடனே
  rationale: எபிரெயக் கதைநடைத் தொடக்கச் சூத்திரத்தைச் சொற்சொல்லாக மொழிபெயர்க்காமல், உடனடியான காலத் தொடரை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: அரசனின் மகன்கள் வந்ததை நோக்கிக் கவனத்தை ஈர்க்கும் மூலமொழியின் உயிரோட்டமான கதைநடைச் சுட்டியைப் பாதுகாக்கிறது.
- source_word: בְנֵי הַמֶּלֶךְ
  choice: அரசனின் மகன்கள்
  rationale: உறவைக் குழப்பமின்றி நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בָּאוּ
  choice: வந்தார்கள்
  rationale: பொதுவான இயக்க வினையின் எளிய பொருளையும் மரியாதைப் பன்மையுடன் இயல்பான தமிழ் கதைநடையையும் தருகிறது.
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: அவர்கள் உரத்த குரலெடுத்து
  rationale: சத்தமிட்டு புலம்புவதைக் குறிக்கும் எபிரெய மொழிமரபின் குரலை உயர்த்தும் படிமத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וַיִּבְכּוּ
  choice: அழுதார்கள்
  rationale: இங்கு துக்கத்தால் கண்ணீர் விட்டு அழுவதையே சூழல் குறிக்கிறது.
- source_word: וְגַם
  choice: அரசனும்
  rationale: மகன்களோடு அரசனும் துக்கத்தில் சேர்ந்தான் என்ற சேர்க்கைப் பொருளைத் தமிழ் இணைப்பும்மை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְכָל עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள் அனைவரும்
  rationale: அரண்மனைச் சூழலில் עֶבֶד என்பதன் பரந்த பொருளை வைத்துக்கொண்டு, குறிப்பிட்ட அதிகார நிலையை தேவையின்றி நிர்ணயிக்காத நவீனத் தமிழ் சொல்.
- source_word: בָּכוּ בְּכִי גָּדוֹל מְאֹד
  choice: மிகவும் கதறி அழுதார்கள்
  rationale: ஒரே வேர் கொண்ட வினை-பெயர் அமைப்பால் எபிரெயத்தில் தரப்படும் தீவிர வலியுறுத்தலை, செயற்கையான சொற்சொல் நடையின்றி வலுவான இயல்பான தமிழில் தெரிவிக்கிறது.
