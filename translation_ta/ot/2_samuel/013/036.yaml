translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பதால் மூலத்தின் கவன ஈர்ப்புச் சுட்டி பாதுகாக்கப்பட்டது; இறுதி எபிரெய வலியுறுத்தல் இயல்பான தமிழில் ‘மிகவும் கதறி அழுதார்கள்’ என வழங்கப்பட்டு, அதன் வடிவம் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
