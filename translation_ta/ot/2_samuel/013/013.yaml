- source_word: אָנָה
  choice: எங்கே
  rationale: இயக்கத்தைக் குறிக்கும் אוֹלִיךְ என்பதுடன் சேர்ந்து, அவமானத்தை எங்கே கொண்டுபோக முடியும் என்ற சொல்லாட்சிசார் வினாவை அறிமுகப்படுத்துகிறது.
- source_word: אוֹלִיךְ
  choice: சுமந்துகொண்டு போவேன்
  rationale: הלך என்பதன் ஹிஃபில் வடிவிலுள்ள இயக்க உருவகத்தையும், விளைவாக வரும் அவமானத்தைத் தாங்க வேண்டிய நிலைமையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: חֶרְפָּתִי
  choice: என் அவமானத்தை
  rationale: இச்சூழலில் பொதுமக்கள் முன்பான இழிவையும் சமூக அவமானத்தையும் குறிக்கிறது; நவீன தமிழில் தெளிவான, இயல்பான சொல்.
- source_word: כְּאַחַד הַנְּבָלִים
  choice: ஒழுக்கங்கெட்டவர்களில் ஒருவனைப்போல்
  rationale: נבל இங்கு அறிவுக்குறைவை மட்டும் அல்லாமல் அறமற்ற, வெட்கக்கேடான நடத்தையுள்ள ஒருவனைக் குறிக்கிறது.
- source_word: דַּבֶּר נָא
  choice: தயவுசெய்து அரசரிடம் பேசு
  rationale: கட்டளையுடன் வரும் வேண்டுகோள் இடைச்சொல்லின் அவசரமான மன்றாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִמְנָעֵנִי מִמֶּךָּ
  choice: அவர் என்னை உனக்குக் கொடுக்க மறுக்கமாட்டார்
  rationale: சொல்லுக்கு சொல் 'என்னை உன்னிடமிருந்து தடுத்து வைக்கமாட்டார்' என்ற எபிரெய மொழிநடையின் சூழல்சார் பொருளைத் தெளிவான தமிழில் தருகிறது.
theological_decisions:
- issue: தாமார் அரசரிடம் முறையிடச் சொல்வதன் நோக்கம்
  choice: அரசர் தன்னை அம்னோனுக்குக் கொடுக்க மறுக்கமாட்டார் என்ற அவளுடைய கூற்றை நேரடியாக மொழிபெயர்த்து, அதன் நோக்கத்தை அடிக்குறிப்பில் திறந்த நிலையில் வைத்தல்.
  alternative: திருமணம் உண்மையில் சாத்தியம் என்று தாமார் நம்பினாள்; அல்லது தாக்குதலைத் தாமதப்படுத்த அவள் உத்தியாகப் பேசினாள்.
  rationale: இந்தக் கூற்று சட்டரீதியாக நடைமுறைக்குரியதா அல்லது தப்பிக்கச் செய்த அவசர முயற்சியா என்பதை வசனம் விளக்கவில்லை; ஆகவே மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைத் தீர்மானிக்கக்கூடாது.
translation_notes:
  register: நவீனத் தரத்தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. “எங்கே சுமந்துகொண்டு போவேன்?” என்பது மூலத்தின் இயக்க உருவகத்தைத் தக்கவைக்கிறது; “ஒழுக்கங்கெட்டவர்” என்பது נבל என்பதிலுள்ள அறநெறிசார் கண்டனத்தை அறிவுசார் ‘மூடத்தனம்’ என்று மட்டும் சுருக்காமல் வெளிப்படுத்துகிறது.
