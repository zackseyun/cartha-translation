base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/013.yaml
  text: As for me[a], where could I carry my disgrace? And you—you would be like one of the fools in Israel. So now, please speak to the king[c][b], for he will not withhold me from you.
translation:
  language: ta
  text: என்னைப் பொறுத்தவரை, என் அவமானத்தை நான் எங்கே சுமந்துகொண்டு போவேன்?[a] நீயோ இஸ்ரவேலில் உள்ள ஒழுக்கங்கெட்டவர்களில் ஒருவனைப்போல் ஆகிவிடுவாய்.[b] ஆகவே, இப்போது தயவுசெய்து அரசரிடம் பேசு; அவர் என்னை உனக்குக் கொடுக்க மறுக்கமாட்டார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவமானம்” என்பதற்கு “இழிவு” அல்லது “பழி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “ஒழுக்கங்கெட்டவர்கள்” என்பதற்கு “மூடர்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அறிவில்லாதவர்களை மட்டும் அல்லாமல், அறமற்ற அல்லது வெட்கக்கேடானவர்களையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, “அவர் என்னை உனக்குக் கொடுக்க மறுக்கமாட்டார்.” தாமார் இதை உண்மையான வேண்டுகோளாகச் சொன்னாளா அல்லது அம்னோனைத் தாமதப்படுத்துவதற்கான அவசர முயற்சியாகச் சொன்னாளா என்பது தெளிவில்லை.
    reason: alternative_reading
