id: 2SA.13.10
reference: 2 Samuel 13:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אַמְנ֜וֹן אֶל תָּמָ֗ר הָבִ֤יאִי הַ/בִּרְיָה֙ הַ/חֶ֔דֶר וְ/אֶבְרֶ֖ה מִ/יָּדֵ֑/ךְ וַ/תִּקַּ֣ח תָּמָ֗ר אֶת הַ/לְּבִבוֹת֙ אֲשֶׁ֣ר עָשָׂ֔תָה וַ/תָּבֵ֛א לְ/אַמְנ֥וֹן אָחִ֖י/הָ הֶ/חָֽדְרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/010.yaml
  text: Then Amnon said to Tamar[a], “Bring the food into the inner room, so that I may eat from your hand.” So Tamar took the cakes she had made and brought them into the inner room to Amnon her brother.
translation:
  language: ta
  text: அப்போது அம்னோன் தாமாரிடம், “நான் உன் கையிலிருந்து சாப்பிடும்படி, உணவை உட்புற அறைக்குக் கொண்டுவா” என்றான். தாமார் தான் செய்த பணியாரங்களை எடுத்துக்கொண்டு, அவற்றை உட்புற அறைக்குள் தன் சகோதரன் அம்னோனிடம் கொண்டுவந்தாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבִיאִי
  choice: கொண்டுவா
  rationale: בוא என்பதன் பெண்பால் ஒருமை கட்டளை வடிவம்; அம்னோன் இருக்கும் இடத்திற்கு உணவைக் கொண்டுவரும்படி தாமாரிடம் கூறுவதால், நவீனத் தமிழில் இயல்பான ‘கொண்டுவா’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַבִּרְיָה
  choice: உணவை
  rationale: உண்ணுவதற்காக ஆயத்தப்படுத்தப்பட்ட உணவைப் பொதுவாகக் குறிக்கிறது; பின்னர் வரும் குறிப்பிட்ட உணவுப் பொருளிலிருந்து இதை வேறுபடுத்த ‘உணவு’ பொருத்தமானது.
- source_word: הַחֶדֶר / הֶחָדְרָה
  choice: உட்புற அறைக்கு / உட்புற அறையில்
  rationale: חֶדֶר என்பது வீட்டின் உட்பகுதியிலுள்ள அறையைக் குறிக்கிறது. இரண்டு இடங்களிலும் ஒரே சொற்பொருளைத் தக்கவைத்து, தனிமையான சூழலையும் இயல்பாக உணர்த்துகிறது; இரண்டாவது வடிவின் திசைச்சுட்டும் இறுதி எழுத்து அறைக்குள் செல்லுதலைக் காட்டுகிறது.
- source_word: וְאֶבְרֶה
  choice: நான் ... சாப்பிடும்படி
  rationale: ברה இங்கு உண்பதைக் குறிக்கிறது; கட்டளையைத் தொடர்ந்து வரும் நோக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்த இந்த அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: מִיָּדֵךְ
  choice: உன் கையிலிருந்து
  rationale: எபிரேய மொழியின் ஒருமை ‘கை’ உருவகத்தை நேரடியாகத் தக்கவைத்து, அம்னோனின் நெருக்கத்தை வற்புறுத்தும் வேண்டுகோளைப் பாதுகாக்கிறது.
- source_word: הַלְּבִבוֹת
  choice: பணியாரங்களை
  rationale: முந்தைய சூழலில் தாமார் செய்த வடிவமைக்கப்பட்ட மாவுப் பலகாரங்களைக் குறிக்கிறது; அவற்றை நவீனத் தமிழில் எளிதில் புரியவைக்கும் பொதுவான சொல் ‘பணியாரம்’.
- source_word: אָחִיהָ
  choice: தன் சகோதரன்
  rationale: உறவுமுறையை வெளிப்படையாகக் குறிப்பது கதையின் ஒழுக்க மற்றும் உணர்ச்சி அழுத்தத்திற்கு இன்றியமையாதது; தமிழின் திரும்புநிலை உடைமைக்கு ‘தன்’ இயல்பானது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் உரைநடை பயன்படுத்தப்பட்டது. எபிரேய சொல்வரிசையை இயந்திரமாகப் பின்பற்றாமல், ‘உட்புற அறையிலிருந்த தன் சகோதரன் அம்னோனிடம்’ என்று அமைத்து, தாமார் பணியாரங்களை அறைக்குள் அம்னோனிடம் கொண்டு சென்ற திசை மற்றும் இலக்கைத் தெளிவாக வெளிப்படுத்தியுள்ளது.
