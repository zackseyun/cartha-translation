- from: அப்போது அம்னோன் தாமாரிடம், “நான் உன் கையிலிருந்து சாப்பிடும்படி, உணவை உட்புற அறைக்குக் கொண்டுவா” என்றான். தாமார் தான் செய்த பணியாரங்களை எடுத்துக்கொண்டு, உட்புற அறையிலிருந்த தன் சகோதரன் அம்னோனிடம் கொண்டுவந்தாள்.
  to: அப்போது அம்னோன் தாமாரிடம், “நான் உன் கையிலிருந்து சாப்பிடும்படி, உணவை உட்புற அறைக்குக் கொண்டுவா” என்றான். தாமார் தான் செய்த பணியாரங்களை எடுத்துக்கொண்டு, அவற்றை உட்புற அறைக்குள் தன் சகோதரன் அம்னோனிடம் கொண்டுவந்தாள்.
  rationale: The revision changes only the final clause, replacing an unintended description of Amnon as being in the room with a directional expression that corresponds to the Hebrew directional ending on הֶחָדְרָה. ‘அவற்றை’ is supplied naturally in Tamil to make the carried object explicit, without adding meaning.
