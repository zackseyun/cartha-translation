  yaml_path: translation/ot/2_samuel/013/027.yaml
  text: But Absalom pressed him[a], so he sent Amnon and all the king’s sons with him.
translation:
  language: ta
  text: ஆனால் அப்சலோம் அவரை வற்புறுத்தியதால்[a], அவர் அம்னோனையும் அரசனின் மகன்கள் அனைவரையும் அவனுடன் அனுப்பிவைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அப்சலோம் அவரை விடாப்பிடியாக வேண்டிக்கொண்டதால்’ அல்லது ‘அப்சலோம் அவரை இணங்கவைத்ததால்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மரபுத்தொடர் சாதாரண வேண்டுகோளைவிட வலிமையான, தொடர்ந்த வற்புறுத்தலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרָץ בּוֹ
  choice: அவரை வற்புறுத்தியதால்
  rationale: பְּ என்பதுடன் வரும் פרץ இங்கு சொல்லர்த்தமாக ‘உடைத்துக்கொண்டு போதல்’ என்பதல்ல; தாவீதிடம் அப்சலோம் விடாப்பிடியாக வேண்டி அழுத்தம் கொடுத்ததை உணர்த்தும் மரபுத்தொடர். ‘வற்புறுத்து’ அதன் வலிமையையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: אַבְשָׁלוֹם
  choice: அப்சலோம்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: וַיִּשְׁלַח
  choice: அனுப்பிவைத்தார்
  rationale: சூழலில் தாவீது கோரிக்கைக்கு இணங்கி தம் மகன்களை அப்சலோமுடன் அனுப்புகிறார். மரியாதைப் பன்மையுடன் கூடிய ‘அனுப்பிவைத்தார்’ இயல்பான தமிழாக உள்ளது.
- source_word: אִתּוֹ
  choice: அவனுடன்
  rationale: எபிரெய மூலத்தின் ‘அவனுடன்’ என்ற சுட்டுப்பெயர் வடிவம் காக்கப்படுகிறது; சூழலில் அது அப்சலோமைக் குறிக்கிறது.
- source_word: אֶת אַמְנוֹן
  choice: அம்னோனை
  rationale: אֵת என்னும் நேரடிச் செயப்படுபொருள் குறிப்பான் தனியே மொழிபெயர்க்கப்படவில்லை; தமிழின் இரண்டாம் வேற்றுமை உருபுடன் பெயர் வழங்கப்படுகிறது.
- source_word: וְאֵת כָּל בְּנֵי הַמֶּלֶךְ
  choice: அரசனின் மகன்கள் அனைவரையும்
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; இது அரசனாகிய தாவீதின் மகன்களைக் குறிக்கிறது.
