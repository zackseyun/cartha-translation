translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. தாவீதைக் குறிக்கும் வினைமுற்றில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டு, அப்சலோமைக் குறிக்கும் ‘அவனுடன்’ என்ற மூலச் சுட்டுப்பெயர் காக்கப்பட்டுள்ளது.
