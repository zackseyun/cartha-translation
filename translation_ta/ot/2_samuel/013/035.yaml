source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יֽוֹנָדָב֙ אֶל הַ/מֶּ֔לֶךְ הִנֵּ֥ה בְנֵֽי הַ/מֶּ֖לֶךְ בָּ֑אוּ כִּ/דְבַ֥ר עַבְדְּ/ךָ֖ כֵּ֥ן הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/035.yaml
  text: Then Jonadab said to the king[a], “Look, the king’s sons have come; as your servant said, so it has happened.”
translation:
  language: ta
  text: அப்போது யோனதாப் அரசனிடம், “இதோ,[a] அரசனுடைய மகன்கள் வந்துவிட்டார்கள்; உமது அடியேன் சொன்னபடியே அவ்வாறே நடந்தது” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாருங்கள்.”
    reason: הִנֵּה என்பது கவனத்தை ஈர்க்கும் சுட்டிடைச்சொல்; சூழலின்படி ‘இதோ’ என்றும் ‘பாருங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது … என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ அதன் தொடர்ச்சித் தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: יוֹנָדָב
  choice: யோனதாப்
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பைப் பின்பற்றும் வழக்கமான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: אֶל הַמֶּלֶךְ
  choice: அரசனிடம்
  rationale: மனித அரசனாகிய தாவீதைக் குறிக்கிறது; உரையாடல் நோக்கை இயல்பான தமிழில் ‘அரசனிடம்’ எனத் தருகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கண்ணுக்கு முன் நிகழ்வதன்மீது உடனடியாகக் கவனத்தை ஈர்க்கும் சுட்டிடைச்சொல்லின் வலிமையைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: בְנֵי הַמֶּלֶךְ
  choice: அரசனுடைய மகன்கள்
  rationale: எபிரெய இணைப்புத் தொடரைத் தெளிவான தமிழில் தருகிறது; சூழலில் முக்கியமான பன்மையையும் காக்கிறது.
- source_word: בָּאוּ
  choice: வந்துவிட்டார்கள்
  rationale: அவர்கள் இப்போது வந்து சேர்ந்திருப்பதை உறுதிப்படுத்தும் நிறைவுற்ற செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּדְבַר עַבְדְּךָ
  choice: உமது அடியேன் சொன்னபடியே
  rationale: அரண்மனை மரியாதை மொழியான தன்மைக் குறிப்பு ‘உமது அடியேன்’ என்பதில் காக்கப்படுகிறது; דָּבָר இங்கு முன்பு சொல்லப்பட்ட செய்தியைக் குறிக்கிறது.
- source_word: כֵּן הָיָה
  choice: அவ்வாறே நடந்தது
  rationale: யோனதாப் முன்பு கூறியது துல்லியமாக உறுதியானது என்ற பொருளைத் தருகிறது; ‘படியே … அவ்வாறே’ என்ற தொடர்பமைப்பு எபிரெய வாக்கியத்தின் ஒப்புமை வலிமையைக் காக்கிறது.
