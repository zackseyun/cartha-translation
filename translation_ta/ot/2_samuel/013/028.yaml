source:
  edition: WLC
  text: וַ/יְצַו֩ אַבְשָׁל֨וֹם אֶת נְעָרָ֜י/ו לֵ/אמֹ֗ר רְא֣וּ נָ֠א כְּ/ט֨וֹב לֵב אַמְנ֤וֹן בַּ/יַּ֨יִן֙ וְ/אָמַרְתִּ֣י אֲלֵי/כֶ֔ם הַכּ֧וּ אֶת אַמְנ֛וֹן וַ/הֲמִתֶּ֥ם אֹת֖/וֹ אַל תִּירָ֑אוּ הֲ/ל֗וֹא כִּ֤י אָֽנֹכִי֙ צִוִּ֣יתִי אֶתְ/כֶ֔ם חִזְק֖וּ וִ/הְי֥וּ לִ/בְנֵי חָֽיִל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/028.yaml
  text: 'Then Absalom commanded his young men[a], saying, “Please watch: when Amnon’s heart is merry with wine, and I say to you, ‘Strike Amnon,’ then kill him. Do not fear. Have I not myself commanded you? Be strong, and be men of valor.”'
translation:
  language: ta
  text: 'அப்சலோம் தன் இளைஞர்களுக்குக் கட்டளையிட்டு, “கவனமாகப் பாருங்கள்: அம்னோனின் இதயம் திராட்சரசத்தால் மகிழ்ந்திருக்கும்போது[a], நான் உங்களிடம், ‘அம்னோனை அடியுங்கள்’ என்று சொன்னவுடன் அவனைக் கொன்றுபோடுங்கள். அஞ்சாதீர்கள். நான்தானே உங்களுக்குக் கட்டளையிட்டேன்? உறுதிகொள்ளுங்கள்; வீரமுள்ள ஆண்களாய் இருங்கள்” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திராட்சரசத்தால் அம்னோன் உற்சாகமடைந்திருக்கும்போது.” எபிரெய மரபுத்தொடர் சொல்லர்த்தமாக அவனுடைய இதயம் திராட்சரசத்தால் நல்ல நிலையில் இருப்பதாகக் கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָרָיו
  choice: தன் இளைஞர்கள்
  rationale: நַעַר என்பது சூழலுக்கேற்ப இளைஞன், பணியாள், உடனிருப்பவன் அல்லது ஆயுதமேந்திய உதவியாளர் எனப் பொருள்படும். இங்கு வன்முறை ஆணையை நிறைவேற்றும் அப்சலோமின் ஆட்களைக் குறித்தாலும், மூலத்தின் நேரடியான ‘இளைஞர்கள்’ என்ற பொருளைத் தக்கவைக்கிறது.
- source_word: רְאוּ נָא
  choice: கவனமாகப் பாருங்கள்
  rationale: ראה என்பதன் கட்டளை வடிவமும் נָא துகளும் சேர்ந்து விழிப்புடன் கவனிக்குமாறு வலியுறுத்துகின்றன; இச்சொற்றொடர் நவீன தமிழில் இயல்பான கட்டளைத் தொனியைக் கொடுக்கிறது.
- source_word: כְּטוֹב לֵב אַמְנוֹן בַּיַּיִן
  choice: அம்னோனின் இதயம் திராட்சரசத்தால் மகிழ்ந்திருக்கும்போது
  rationale: ‘இதயம் நல்லதாக இருத்தல்’ என்ற எபிரெய மரபுத்தொடரையும், அந்த மகிழ்நிலை திராட்சரசத்துடன் தொடர்புடையதையும் பாதுகாக்கிறது; முழுமையான போதையை உரையில் சேர்க்கவில்லை.
- source_word: הַכּוּ אֶת אַמְנוֹן
  choice: அம்னோனை அடியுங்கள்
  rationale: נכה என்பது தாக்குதல் அல்லது அடித்தலைக் குறிக்கும் பரந்த வினை. அடுத்த வினைதான் கொல்லும் முடிவைத் தெளிவாக்குவதால், இங்கு ‘அடியுங்கள்’ என வேறுபாடு காக்கப்படுகிறது.
- source_word: וַהֲמִתֶּם אֹתוֹ
  choice: அவனைக் கொன்றுபோடுங்கள்
  rationale: Hiphil வடிவிலுள்ள מות ‘சாகச் செய்தல், கொல்லுதல்’ என்று பொருள்படும். ‘கொன்றுபோடுங்கள்’ என்பது கட்டளையின் கொடிய இறுதி நோக்கை இயல்பான தமிழில் தெளிவாகச் சொல்கிறது.
- source_word: אַל תִּירָאוּ
  choice: அஞ்சாதீர்கள்
  rationale: நேரடியான தடை கட்டளையைச் சுருக்கமாகவும் வலிமையாகவும் வழங்குகிறது.
- source_word: הֲלוֹא כִּי אָנֹכִי צִוִּיתִי אֶתְכֶם
  choice: நான்தானே உங்களுக்குக் கட்டளையிட்டேன்?
  rationale: אָנֹכִי என்பதிலுள்ள முதலாம் நபர் வலியுறுத்தலை ‘நான்தானே’ வெளிப்படுத்துகிறது; கேள்வியின் சொற்பொழிவுத் தன்மையும் காக்கப்படுகிறது.
- source_word: חִזְקוּ
  choice: உறுதிகொள்ளுங்கள்
  rationale: חזק இங்கு உடல் வலிமையை மட்டும் அல்லாமல் துணிவும் மனவுறுதியும் கொள்ளுமாறு அழைக்கிறது; ‘உறுதிகொள்ளுங்கள்’ இச்சூழலில் இயல்பானது.
- source_word: וִהְיוּ לִבְנֵי חָיִל
  choice: வீரமுள்ள ஆண்களாய் இருங்கள்
  rationale: בני חיל என்பது வீரமும் திறனும் துணிவும் உடைய ஆண்களைக் குறிக்கும் இராணுவத் தொனியுள்ள மரபுத்தொடர். முகவர்களின் ஆண்பாலையும் மூலத்தின் கட்டளை வலிமையையும் தக்கவைக்கிறது.
theological_decisions:
- issue: לִבְנֵי חָיִל என்பதிலுள்ள பாலினக் குறிப்பு
  choice: வீரமுள்ள ஆண்களாய் இருங்கள்
  alternative: வீரமுள்ளவர்களாய் இருங்கள்
  rationale: எபிரெய சொற்றொடர் இலக்கணத்திலும் சமூகச் சூழலிலும் ஆண்பாலுக்குரியது; அப்சலோமின் ஆண் உதவியாளர்களிடமே இது கூறப்படுகிறது. பொதுப்பாலாக்குவது மூலத்தின் வடிவத்தையும் நிகழ்ச்சிச் சூழலையும் மங்கச் செய்யும்.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை மற்றும் நேரடியான கட்டளைத் தொனி பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயத்தின் ‘இதயம் மகிழ்தல்’ என்ற உருவகம் அடிக்குறிப்புடன் பிரதான உரையில் தக்கவைக்கப்பட்டுள்ளது; திராட்சரசத்தால் மகிழ்ந்த நிலையை முழுப் போதையாக அதிகப்படுத்தவில்லை.
