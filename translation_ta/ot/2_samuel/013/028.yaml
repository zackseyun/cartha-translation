  source_fidelity: 'எபிரெய மூலத்தின் கட்டளை அமைப்பும் வரிசையும் துல்லியமாகக் காக்கப்பட்டுள்ளன: அப்சலோம் தன் ஆட்களுக்குக் கட்டளையிடுதல், அம்னோன் திராட்சரசத்தால் களிப்புற்றிருக்கும் நேரத்தைக் கவனித்தல், சைகைக்குப் பின் அடித்துக் கொல்லுதல், அஞ்ச வேண்டாமென்ற உறுதியூட்டல், மற்றும் வீரத்திற்கான அழைப்பு ஆகியவை அனைத்தும் உள்ளன. ‘இதயம் ... மகிழ்ந்திருக்கும்போது’ என்பது כְּטוֹב לֵב என்ற உருவகத்தைத் தக்கவைக்கிறது; முழுப் போதையைச் சேர்க்கவில்லை.'
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கதைநடைக்கு ஏற்றவாறும் உள்ளது. நேரடியான கட்டளைகள் இயல்பாக ஒலிக்கின்றன. ‘வீரமுள்ள ஆண்களாய் இருங்கள்’ இச்சூழலில் உயர்ந்த, ஆனால் புரியத்தக்க பதிவாகும்.
  terminology: ‘இளைஞர்கள்’ நְעָרָיו என்பதன் அடிப்படைப் பொருளைச் சரியாகக் காக்கிறது; ‘அடியுங்கள்’ மற்றும் ‘கொன்றுபோடுங்கள்’ இரண்டு தனித்த எபிரெய வினைச்சொற்களின் வன்முறை வரிசையை வேறுபடுத்திக் காட்டுகின்றன. ‘நான்தானே’ אָנֹכִי-யின் வலியுறுத்தலை நன்றாக வெளிப்படுத்துகிறது. ஆண்பால் குறிக்கும் בני חיל, முகவர்களின் சூழலுக்கேற்ப ‘வீரமுள்ள ஆண்களாய்’ எனச் சரியாக மொழிபெயர்க்கப்பட்டுள்ளது.
