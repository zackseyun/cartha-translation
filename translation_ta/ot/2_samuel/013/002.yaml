revisions:
- from: தன் சகோதரி தாமாரை நினைத்து அம்னோன் மிகவும் மனவேதனைப்பட்டு, நோயுற்றுப் போனான்.[a] ஏனெனில் அவள் கன்னிப்பெண்ணாக இருந்தாள். அவளுக்கு எதையாவது செய்வது அம்னோனின் பார்வையில் இயலாததாகத் தோன்றியது.[b]
  to: தன் சகோதரி தாமாரின் காரணமாக அம்னோன் மிகுந்த மனவேதனை அடைந்து நோயுற்றுப் போனான்.[a] ஏனெனில் அவள் கன்னிப்பெண்ணாக இருந்தாள். அவளிடம் எதையும் செய்வது அம்னோனுக்குச் சாத்தியமற்றதாகத் தோன்றியது.[b]
  rationale: The revision restores the explicit causal force of בַּעֲבוּר and clarifies that the contemplated action is directed toward Tamar, not necessarily beneficial to her. It retains the source’s ambiguity concerning what action Amnon thought impossible and preserves the lexical alternative for the Hitpael infinitive in footnote a. Footnote markers remain correctly anchored.
