translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. பாலியல் வன்முறையை முன்கூட்டியே வெளிப்படையாகச் சேர்க்காமல், மூல உரையின் தெளிவின்மையும் அம்னோனின் கண்ணோட்டமும் பாதுகாக்கப்பட்டுள்ளன. அனைத்து அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெறுகின்றன.
