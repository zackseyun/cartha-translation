base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/002.yaml
  text: Amnon was so distressed that he made himself sick because of Tamar his sister[a], for she was a virgin[b], and it seemed impossible in Amnon’s eyes to do anything to her.
translation:
  language: ta
  text: தன் சகோதரி தாமாரின் காரணமாக அம்னோன் மிகுந்த மனவேதனை அடைந்து நோயுற்றுப் போனான்.[a] ஏனெனில் அவள் கன்னிப்பெண்ணாக இருந்தாள். அவளிடம் எதையும் செய்வது அம்னோனுக்குச் சாத்தியமற்றதாகத் தோன்றியது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் சகோதரி தாமாரின் காரணமாக அம்னோன் மிகுந்த மனவேதனை அடைந்து, தன்னையே நோயுறச் செய்துகொண்டான்.” எபிரெயச் சொற்றொடர், அவன் நோயுற்றுப் போனான் என்ற விளைவையோ, தன்னையே நோயுறச் செய்துகொண்டான் என்ற பிரதிபலிப்புப் பொருளையோ தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அம்னோனுக்குச் சாத்தியமற்றதாகத் தோன்றியது” என்பது, செயல்படுவதற்கான நடைமுறை வழி எதையும் அம்னோன் காணவில்லை என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֶר
  choice: மிகவும் மனவேதனைப்பட்டு
  rationale: יצר இச்சூழலில் உள்ளார்ந்த நெருக்கடியையும் மன உளைச்சலையும் குறிக்கிறது. அடுத்து வரும் நோயுறுதலோடு அதன் தீவிரத்தை இயல்பாக இணைக்கிறது.
- source_word: לְהִתְחַלּוֹת
  choice: நோயுற்றுப் போனான்
  rationale: חלה என்பதன் ஹித்பயேல் வடிவம் தன்னை நோயுறச் செய்துகொண்டான் என்ற பிரதிபலிப்புப் பொருளையோ, நோயுற்ற நிலையை அடைந்தான் என்ற விளைவுப் பொருளையோ தரலாம். தமிழில் இயல்பாக இருக்கும் விளைவுப் பொருள் முதன்மை உரையில் தரப்பட்டு, மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בַּעֲבוּר
  choice: நினைத்து
  rationale: இங்கு காரணத்தைக் குறிக்கிறது. 'தாமாரை நினைத்து' என்பது அவளால் ஏற்பட்ட மனவேதனையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲחֹתוֹ
  choice: தன் சகோதரி
  rationale: உறவுமுறையைத் தெளிவாகக் காக்கிறது; இந்த நிகழ்வின் ஒழுக்கரீதியான தீவிரத்திற்கும் இது முக்கியமானது.
- source_word: בְתוּלָה
  choice: கன்னிப்பெண்
  rationale: திருமணமாகாத இளம்பெண் என்று மட்டும் பொதுமைப்படுத்தாமல், எபிரெயச் சொல்லின் கன்னித்தன்மை சார்ந்த குறிப்பை நேரடியாகத் தருகிறது.
- source_word: וַיִּפָּלֵא בְּעֵינֵי אַמְנוֹן
  choice: அம்னோனின் பார்வையில் இயலாததாகத் தோன்றியது
  rationale: அம்னோனுக்குப் பார்க்கையில் அது எட்டாதது அல்லது நடைமுறையில் சாத்தியமற்றது என்ற எபிரெயக் கண்ணோட்டச் சொற்றொடரைப் பாதுகாக்கிறது.
- source_word: לַעֲשׂוֹת לָהּ מְאוּמָה
  choice: அவளுக்கு எதையாவது செய்வது
  rationale: מְאוּמָה என்பதன் பரந்த 'எதையாவது' என்ற பொருளைக் காக்கிறது. பின்னர் நிகழும் குற்றத்தை முன்கூட்டியே குறிப்பாக்காமல் மூலத்தின் திட்டமிட்ட தெளிவின்மையைத் தக்கவைக்கிறது.
