base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/001.yaml
  text: After this[a], Absalom son of David had a beautiful sister whose name was Tamar, and Amnon son of David loved her.
translation:
  language: ta
  text: இதற்குப் பிறகு, தாவீதின் மகன் அப்சலோமுக்கு அழகான ஒரு சகோதரி இருந்தாள்; அவள் பெயர் தாமார். தாவீதின் மகன் அம்னோன் அவளை நேசித்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவள்மீது மோகம் கொண்டான்” அல்லது “அவளை இச்சித்தான்.” எபிரெயத்தில் உள்ள வினைச்சொல் “நேசித்தல்” என்பதற்கான வழக்கமான சொல்; ஆனால் தொடர்ந்து வரும் கதை அம்னோனின் உணர்வு சீர்கெட்டதாக இருந்ததைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: இதற்குப் பிறகு
  rationale: இது முந்தைய நிகழ்வுகளைத் தொடர்ந்து கதை நகர்வதைக் குறிக்கும் இயல்பான காலத் தொடர். וַיְהִי என்பதைத் தனியே சொற்சொல்லாக மொழிபெயர்க்காமல், முழுத் தொடரின் கதைத் தொடக்கச் செயல்பாட்டை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּלְאַבְשָׁלוֹם בֶּן דָּוִד
  choice: தாவீதின் மகன் அப்சலோமுக்கு ... இருந்தாள்
  rationale: எபிரெய மொழியின் உடைமைக்கான முன்னிடைச்சொல் அமைப்பை இயல்பான தமிழில் ‘அப்சலோமுக்கு ... இருந்தாள்’ என்று வழங்குகிறது; ‘தாவீதின் மகன்’ என்ற அரச குடும்ப அடையாளமும் தக்கவைக்கப்படுகிறது.
- source_word: אָחוֹת יָפָה
  choice: அழகிய ஒரு சகோதரி
  rationale: אָחוֹת என்பது ‘சகோதரி,’ יָפָה என்பது இங்கு உடல் அழகைக் குறிக்கும் ‘அழகிய.’ தமிழின் இயல்பான பெயர்ச்சொல் தொடருக்காக ‘ஒரு’ சேர்க்கப்பட்டுள்ளது.
- source_word: וּשְׁמָהּ תָּמָר
  choice: அவள் பெயர் தாமார்
  rationale: எளிய பெயரிடும் வாக்கியத்தை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: וַיֶּאֱהָבֶהָ
  choice: அவளை நேசித்தான்
  rationale: אהב என்பது பொதுவாக ‘நேசி/அன்புகொள்’ என்ற வினை. பின்னர் வரும் கதை அம்னோனின் உணர்வின் சீர்கேட்டை வெளிப்படுத்தினாலும், இவ்வசனத்தின் சொல்லை முன்கூட்டியே ‘இச்சித்தான்’ என்று தீர்மானிக்காமல் அதன் இலக்கிய மற்றும் அறவியல் பதற்றத்தைப் பாதுகாக்கிறது.
- source_word: אַמְנוֹן בֶּן דָּוִד
  choice: தாவீதின் மகன் அம்னோன்
  rationale: மூலத்தில் மீண்டும் வரும் ‘தாவீதின் மகன்’ என்ற அடையாளத்தை விடாமல் வைத்திருப்பதால் குடும்ப உறவுகளுக்கும் அரச குடும்பச் சூழலுக்கும் அளிக்கப்படும் வலியுறுத்தல் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: அறவியல் ரீதியாகக் கெட்டுப்போன சூழலில் אהב என்ற வினையை மொழிபெயர்த்தல்
  choice: நேசித்தான்
  alternative: அவளை இச்சித்தான் / அவள்மீது மோகம் கொண்டான்
  rationale: மூல வசனம் சாதாரண ‘நேசி’ என்ற வினையையே பயன்படுத்துகிறது. தொடர்ந்து வரும் நிகழ்வுகள் அந்த ‘நேசத்தின்’ வன்முறையான, சீர்கெட்ட தன்மையை வெளிப்படுத்துகின்றன. ஆகவே பிரதான உரை அதை முன்கூட்டியே விளக்கித் தீர்க்காமல் மூலத்தின் பதற்றத்தைத் தக்கவைக்கிறது; மாற்று பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. ‘தாவீதின் மகன்’ என்ற மீளுரைத்தல் சுருக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது; பெயர்கள் அப்சலோம்/தாமார்/அம்னோன் என பொதுவாக அறியப்படும் தமிழ் வடிவங்களில் வழங்கப்பட்டுள்ளன.
