revisions:
- from: ஆனால் அப்சலோம் தப்பியோடினான். காவல் பார்த்துக்கொண்டிருந்த இளைஞன்[a] நிமிர்ந்து பார்த்தபோது[b], இதோ, ஏராளமான மக்கள் அவனுக்குப் பின்னாலிருந்த பாதை வழியாக, மலையின் பக்கத்திலிருந்து வந்துகொண்டிருந்தார்கள்.[c]
