base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/034.yaml
  text: But Absalom fled[a]. And the young man who was watching lifted up his eyes and saw, and behold, many people were coming by the road behind him[c][b], from the side of the mountain.
translation:
  language: ta
  text: ஆனால் அப்சலோம் தப்பியோடினான். காவல் பார்த்துக்கொண்டிருந்த இளைஞன்[a] நிமிர்ந்து பார்த்தான்; இதோ, ஏராளமான மக்கள் அவனுக்குப் பின்னாலிருந்த பாதை வழியாக, மலையின் பக்கத்திலிருந்து வந்துகொண்டிருந்தார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காவல் பார்த்துக்கொண்டிருந்த இளைஞன்’ என்பதற்கு ‘இளம் காவலாளி’ அல்லது ‘காவலாளி’ என்றும் மொழிபெயர்க்கலாம். எபிரெய சொற்றொடர் ‘இளைஞன்/பணியாள்’ என்பதையும் ‘காவல் பார்த்துக்கொண்டிருப்பவன்’ என்பதையும் இணைக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘அவனுக்குப் பின்னாலிருந்த பாதையிலிருந்து, மலையின் பக்கத்திலிருந்து’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் இடங்களுக்கிடையேயான தொடர்பும் ‘அவன்’ என்பது யாரைக் குறிக்கிறது என்பதும் சுருக்கமாகவும் தெளிவின்றியும் உள்ளன.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: தப்பியோடினான்
  rationale: ברח என்பது ஆபத்திலிருந்து தப்பிச் செல்லுவதைக் குறிக்கிறது. ‘தப்பியோடினான்’ என்பது கதையின் வேகத்தையும் தப்பிச் செல்லும் கருத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: אַבְשָׁלוֹם
  choice: அப்சலோம்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: הַנַּעַר הַצֹּפֶה
  choice: காவல் பார்த்துக்கொண்டிருந்த இளைஞன்
  rationale: נַעַר என்பதன் ‘இளைஞன்/பணியாள்’ என்ற பொருளையும் צֹפֶה என்பதன் ‘கவனித்துக்கொண்டிருப்பவன்/காவலாளி’ என்ற பொருளையும் மிகையாகக் குறிப்பாக்காமல் இணைக்கிறது.
- source_word: וַיִּשָּׂא ... אֶת עֵינוֹ
  choice: நிமிர்ந்து பார்த்தபோது
  rationale: சொல்லுக்குச் சொல் ‘தன் கண்களை உயர்த்தினான்’ என்பது தமிழில் செயற்கையாக இருக்கும்; எபிரெய மரபுத்தொடரின் இயல்பான பொருளை ‘நிமிர்ந்து பார்த்தான்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַיַּרְא וְהִנֵּה
  choice: பார்த்தபோது, இதோ
  rationale: கண்ணில் திடீரெனப் பட்ட காட்சிக்குக் கவனம் ஈர்க்கும் הִנֵּה என்பதன் உரையாடல் வலிமையை ‘இதோ’ பாதுகாக்கிறது.
- source_word: עַם רַב
  choice: ஏராளமான மக்கள்
  rationale: கூட்டத்தின் பெருமளவைத் தெளிவாகக் கூறுகிறது; ஒழுங்கமைக்கப்பட்ட ஒரு கூட்டம் என்று மூலத்தில் இல்லாத கருத்தைச் சேர்ப்பதில்லை.
- source_word: הֹלְכִים
  choice: வந்துகொண்டிருந்தார்கள்
  rationale: הלך அடிப்படையில் ‘செல்/நட’ என்றாலும், காவல் பார்ப்பவனின் பார்வையில் மக்கள் நெருங்கிவருவதால் தமிழில் ‘வந்துகொண்டிருந்தார்கள்’ இயல்பான திசைநிலையைத் தருகிறது.
- source_word: מִדֶּרֶךְ אַחֲרָיו
  choice: அவனுக்குப் பின்னாலிருந்த பாதை வழியாக
  rationale: אַחֲרָיו என்பதன் ‘அவனுக்குப் பின்னால்’ என்ற பொருளைப் பாதுகாக்கிறது; அதேவேளையில் அந்தப் பிரதிப்பெயர் யாரைக் குறிக்கிறது என்பதை மூலத்தைவிடத் தெளிவுபடுத்தாமல் விடுகிறது.
- source_word: מִצַּד הָהָר
  choice: மலையின் பக்கத்திலிருந்து
  rationale: צַד என்பதன் ‘பக்கம்’ மற்றும் הָר என்பதன் ‘மலை’ ஆகியவற்றை நேரடியாகவும் புரிந்துகொள்ளத்தக்க வகையிலும் தருகிறது.
