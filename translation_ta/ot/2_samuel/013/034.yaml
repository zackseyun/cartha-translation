  register: நவீன பொதுத்தமிழில் இயல்பாகவும், வரலாற்றுக் கதையாடலுக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. ‘இதோ’ என்பது மூலத்தின் கவன ஈர்ப்பு வலிமையைத் தக்கவைக்கிறது. இடவியல் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
