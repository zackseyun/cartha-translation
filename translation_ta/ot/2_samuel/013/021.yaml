translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடை. எபிரெய மரபுத்தொடரின் உருவகத்தை முதன்மை உரையில் இயல்பான தமிழாக்கமாக வழங்கி, அதன் சொற்படியான வடிவத்தை அடிக்குறிப்பில் பாதுகாத்துள்ளது.
