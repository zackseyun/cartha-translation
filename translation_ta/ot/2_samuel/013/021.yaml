    text: 'சொற்படியாக: “அவனுக்கு மிகவும் எரிந்தது”; அதாவது, “அவனுக்கு மிகுந்த கோபம் எழுந்தது.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  choice: தாவீது அரசன் ... போது
  rationale: எபிரெய இணைப்புச் சொல் வְ கதையின் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் இயல்பான காலத் தொடர்பை வெளிப்படுத்த ‘கேட்டபோது’ என்ற அமைப்பு பயன்படுத்தப்பட்டது. மֶלֶךְ மற்றும் דָּוִד என்பவை முறையே ‘அரசன்’, ‘தாவீது’ என வழங்கப்பட்டன.
- source_word: שָׁמַע
  choice: கேட்டபோது
  rationale: வினையின் அடிப்படைப் பொருள் ‘கேள்’; இச்சூழலில் நடந்தவற்றைப் பற்றிய செய்தியை அறிந்துகொண்டதைக் குறிக்கிறது. ‘கேட்டபோது’ என்பது பொருளையும் வாக்கியத் தொடர்பையும் இயல்பாகக் காக்கிறது.
- source_word: כָּל הַ/דְּבָרִים הָ/אֵלֶּה
  choice: இவை அனைத்தையும்
  rationale: דְּבָרִים என்பது ‘வார்த்தைகள்’, ‘காரியங்கள்’, ‘நிகழ்வுகள்’ எனப் பொருள்படலாம். இங்கு முன் விவரிக்கப்பட்ட சம்பவங்களைக் கூட்டாகச் சுட்டுவதால், தமிழில் இயல்பானதும் போதிய அளவு விரிவானதுமான ‘இவை அனைத்தையும்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַ/יִּחַר ל֖/וֹ מְאֹד
  choice: அவன் மிகவும் கோபமடைந்தான்
  rationale: חרה לו என்பது சொற்படியாக ‘அவனுக்கு எரிந்தது’ என்ற கோபத்தைச் சுட்டும் எபிரெய மரபுத்தொடர். வெளிப்படையாக ‘கோபம்’ என்ற பெயர்ச்சொல் இல்லாததால், அதன் இயல்பான பொருள் ‘மிகவும் கோபமடைந்தான்’ என வழங்கப்பட்டது; מְאֹד என்பதற்கு ‘மிகவும்’ பயன்படுத்தப்பட்டது.
