base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/016.yaml
  text: But she said to him[a], “No, because this great wrong of sending me away is greater than the other that you did to me.” But he would not listen to her.
translation:
  language: ta
  text: ஆனால் அவள் அவனிடம், “வேண்டாம்[a]! இந்தப் பெருந்தீங்கு—என்னை அனுப்பிவிடுவது—நீ எனக்குச் செய்த மற்ற தீங்கைவிடப் பெரியது” என்றாள். ஆனால் அவன் அவளுக்குச் செவிகொடுக்க மறுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அதிகச் சொல்நெருக்கமுள்ள மொழிபெயர்ப்பு: “செய்யாதே; ஏனெனில் இந்தப் பெருந்தீங்கு—என்னை அனுப்பிவிடுவது—நீ எனக்குச் செய்த மற்றதைக் காட்டிலும் பெரியது.” எபிரெய வாக்கியம் மிகவும் சுருக்கமாகவும் இலக்கணத் தொடர்பு தெளிவில்லாமலும் உள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: வேண்டாம்!
  rationale: இச்சொல் வழக்கமாகத் தடையை அல்லது மறுப்பைச் சுட்டுகிறது. இங்குள்ள சுருக்கமான நேரடிக் கூற்றில் தாமாரின் அவசரமான எதிர்ப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אוֹדֹת
  choice: இந்தப் பெருந்தீங்கு—என்னை அனுப்பிவிடுவது—
  rationale: எதிர்க்கப்படும் காரியத்தை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் தொடர்பு, தமிழில் இடைக்குறிப்பின் மூலம் தெளிவாக்கப்பட்டுள்ளது; காரணம் அல்லது தொடர்பு என்ற இரு நுணுக்கங்களையும் அளவுக்கு மீறித் தீர்மானிக்கவில்லை.
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: இந்தப் பெருந்தீங்கு
  rationale: רָעָה என்பது தீமை, கேடு, அநீதி ஆகிய பொருள்களைக் கொள்ளலாம். இங்குள்ள தனிப்பட்ட மற்றும் ஒழுக்கச் சூழலில் ‘பெருந்தீங்கு’ செயல் ஏற்படுத்தும் கேடும் அதன் கொடுமையும் இரண்டையும் இயல்பாகக் காட்டுகிறது.
- source_word: מֵאַחֶרֶת אֲשֶׁר עָשִׂיתָ עִמִּי
  choice: நீ எனக்குச் செய்த மற்ற தீங்கைவிட
  rationale: பெண்பால் ஒருமையான ‘மற்றது’ முன்பு செய்யப்பட்ட இன்னொரு தீங்கைக் குறிக்கிறது. தமிழ் வாசகருக்குத் தொடர்பு தெளிவாக இருக்க ‘தீங்கு’ மீண்டும் வழங்கப்பட்டுள்ளது; அது எந்தச் செயல் என்பதை வசனம் கூறுவதைக் கடந்துவிளக்கவில்லை.
- source_word: לְשַׁלְּחֵנִי
  choice: என்னை அனுப்பிவிடுவது
  rationale: பேசப்படும் செயலை நேரடியாகக் குறிக்கிறது. ‘அனுப்பிவிடுவது’ என்பது விலக்கி அனுப்பும் வலிமையைத் தக்கவைத்துக் கொண்டு, ‘துரத்துவது’ போன்ற அதிகப்படியான விளக்கத்தைத் தவிர்க்கிறது.
- source_word: וְלֹא אָבָה לִשְׁמֹעַ לָהּ
  choice: ஆனால் அவன் அவளுக்குச் செவிகொடுக்க மறுத்தான்
  rationale: אָבָה விருப்பம் அல்லது இணக்கம் இல்லாமையைச் சுட்டுகிறது. ‘மறுத்தான்’ என்பது அவனுடைய மனப்பூர்வமான செவிகொடாமையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לּוֹ
  choice: அவனிடம்
  rationale: நேரடிப் பேச்சை அறிமுகப்படுத்தும் இயல்பான தமிழ் வடிவம்.
