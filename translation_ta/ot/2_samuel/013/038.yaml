translation_notes:
  register: நவீனத் தரமான தமிழில், சுருக்கமான கதையாடல் நடையும் மரியாதைமிக்க வேதாகம மொழிநடையும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் இரண்டு தொடர்ச்சியான செயல்கள் அரைப்புள்ளியால் தெளிவாக இணைக்கப்பட்டுள்ளன; தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன.
