  yaml_path: translation/ot/2_samuel/013/038.yaml
  text: But Absalom fled and went to Geshur[b][a], and he was there three years.
translation:
  language: ta
  text: ஆனால்[a] அப்சலோம் தப்பியோடி கேஷூருக்குச் சென்றான்; அவன் அங்கே மூன்று ஆண்டுகள் இருந்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அப்சலோம் தப்பியோடி கேஷூருக்குச் சென்றான்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய இணைப்புச்சொல்லைச் சூழலுக்கேற்ப ‘ஆனால்’ அல்லது ‘மேலும்’ என்று மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொற்பொருளாக, ‘அவன் அங்கே மூன்று ஆண்டுகள் இருந்தான்’; ‘அவன் அங்கே மூன்று ஆண்டுகள் தங்கியிருந்தான்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁל֥וֹם
  choice: ஆனால் அப்சலோம்
  rationale: வְ என்னும் இணைப்புச்சொல் தொடர்ச்சியைக் குறிக்கும் ‘மேலும்/அப்போது’ என்ற பொருளையும், சூழலில் சிறிய முரண்பாடு அல்லது கதைத்தொடரின் மீள்தொடக்கத்தைக் குறிக்கும் ‘ஆனால்’ என்ற பொருளையும் தரலாம். இங்கு ஆலோசனை உரையைப் பின்பற்றி ‘ஆனால்’ பயன்படுத்தப்பட்டுள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בָּרַ֖ח
  choice: தப்பியோடி
  rationale: בָּרַח என்பது ஆபத்திலிருந்து அல்லது தண்டனையிலிருந்து ஓடிப்போவதைக் குறிக்கிறது. ‘தப்பியோடி’ என்பது இச்சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַ/יֵּ֣לֶךְ
  choice: சென்றான்
  rationale: הלך என்பதன் வழக்கமான கதையாடல் பொருள் ‘சென்றான்’; எளிய செயல்வரிசை அப்படியே காக்கப்படுகிறது.
- source_word: גְּשׁ֑וּר
  choice: கேசூர்
  rationale: இடப்பெயர் நவீனத் தமிழில் உச்சரிப்புக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַ/יְהִי שָׁ֖ם
  choice: அவன் அங்கே இருந்தான்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான பொருள் ‘அவன் அங்கே இருந்தான்.’ ‘தங்கியிருந்தான்’ என்பதும் சூழலுக்கு ஏற்ற இயல்பான மாற்றாகும்; அது அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: שָׁלֹ֥שׁ שָׁנִֽים
  choice: மூன்று ஆண்டுகள்
  rationale: காலநீளத்தைக் குறிக்கும் எண்–பெயர்ச்சொல் தொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
