  to: அப்போது அரசன் எழுந்து, தன் ஆடைகளைக் கிழித்து, தரையில் படுத்தான். அவனுடைய பணியாளர்கள் அனைவரும் தங்கள் ஆடைகள் கிழிந்த நிலையில் நின்றுகொண்டிருந்தார்கள்.
