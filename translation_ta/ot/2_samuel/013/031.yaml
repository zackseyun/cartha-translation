  text: וַ/יָּ֧קָם הַ/מֶּ֛לֶךְ וַ/יִּקְרַ֥ע אֶת בְּגָדָ֖י/ו וַ/יִּשְׁכַּ֣ב אָ֑רְצָ/ה וְ/כָל עֲבָדָ֥י/ו נִצָּבִ֖ים קְרֻעֵ֥י בְגָדִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/031.yaml
  text: Then the king arose[a], tore his garments, and lay on the ground, and all his servants were standing with their garments torn.
translation:
  language: ta
  text: அப்போது அரசன் எழுந்து, தன் ஆடைகளைக் கிழித்து, தரையில் படுத்தான். அவனுடைய பணியாளர்கள் அனைவரும் தங்கள் ஆடைகள் கிழிந்த நிலையில் நின்றுகொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்பதன் Qal wayyiqtol வடிவம் தொடர்ச்சியான கதைநிகழ்வைக் குறிக்கிறது; அரசனின் திடீர் எதிர்வினையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: சூழலில் தாவீதைக் குறிக்கும் திட்டவட்டமான பட்டப்பெயர்; மூலத்தில் தனிப்பெயர் இல்லாததால் பட்டப்பெயரே தக்கவைக்கப்படுகிறது.
- source_word: וַיִּקְרַע אֶת בְּגָדָיו
  choice: தன் உடைகளைக் கிழித்துக்கொண்டு
  rationale: קרע + בגדים என்பது துக்கம் அல்லது அதிர்ச்சியை வெளிப்படுத்த உடைகளைக் கிழிக்கும் வழக்கமான சொற்றொடர்; ‘கிழித்துக்கொண்டு’ அடுத்த செயல்வரிசையுடன் இயல்பாக இணைகிறது.
- source_word: וַיִּשְׁכַּב אָרְצָה
  choice: தரையில் படுத்தான்
  rationale: שכב படுப்பதையும், directional -ה கொண்ட אַרְצָה தரையை நோக்கிய இயக்கத்தையும் குறிக்கிறது; இவ்விரண்டையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְכָל עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள் அனைவரும்
  rationale: עבדים இங்கு அரசவையில் அரசனுக்குப் பணிபுரிவோரைக் பரந்த வகையில் குறிக்கலாம்; ‘பணியாளர்கள்’ அடிமை என்ற தேவையற்ற குறுக்கத்தைத் தவிர்க்கிறது.
- source_word: נִצָּבִים
  choice: நின்றுகொண்டிருந்தார்கள்
  rationale: נצב என்பதன் Niphal participle காட்சியில் நீடிக்கும் நிலையைச் சுட்டுகிறது; தமிழ் தொடர்நிலை வடிவம் அதை வெளிப்படுத்துகிறது.
- source_word: קְרֻעֵי בְגָדִים
  choice: தங்கள் உடைகள் கிழிந்த நிலையில்
  rationale: קרע என்பதன் passive participle உடைகள் கிழிக்கப்பட்டதன் விளைவாகத் தொடரும் நிலையைக் குறிக்கிறது.
