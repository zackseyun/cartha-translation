translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கதைநடையின் செயல்வரிசையும், இறுதிப் பங்கேற்புச் சொல்லின் நீடித்த நிலையும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
