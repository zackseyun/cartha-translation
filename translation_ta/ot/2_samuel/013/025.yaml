  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל אַבְשָׁל֗וֹם אַל בְּנִ/י֙ אַל נָ֤א נֵלֵךְ֙ כֻּלָּ֔/נוּ וְ/לֹ֥א נִכְבַּ֖ד עָלֶ֑י/ךָ וַ/יִּפְרָץ בּ֛/וֹ וְ/לֹֽא אָבָ֥ה לָ/לֶ֖כֶת וַֽ/יְבָרֲכֵֽ/הוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/025.yaml
  text: But the king said to Absalom, “No, my son, please let us not all go, lest we be a burden on you.” And he pressed him, but he was not willing to go; so he blessed him.
translation:
  language: ta
  text: ஆனால் அரசன் அப்சலோமிடம், “வேண்டாம், என் மகனே; நாங்கள் எல்லாரும் போக வேண்டாம்; உனக்குப் பாரமாக இருக்கவும் வேண்டாம்” என்றான். அப்சலோம் அவனை வற்புறுத்தினான்; ஆனால் அரசன் போக விரும்பவில்லை. அப்போது அரசன் அப்சலோமை ஆசீர்வதித்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל בְּנִי אַל נָא נֵלֵךְ כֻּלָּנוּ
  choice: “வேண்டாம், என் மகனே! நாங்கள் எல்லாரும் ... வேண்டாம்”
  rationale: இருமுறை வரும் மறுப்பையும் נָא என்பதன் பணிவான வேண்டுகோள் நயத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְלֹא נִכְבַּד עָלֶיךָ
  choice: “உனக்குச் சுமையாகிவிட வேண்டாம்”
  rationale: כבד என்பதன் அடிப்படை ‘கனமாக இரு’ என்ற உருவகத்தை, இச்சூழலில் விருந்தோம்பல் சுமையாக இருப்பது என்ற பொருளில் தெளிவாகத் தருகிறது.
- source_word: וַיִּפְרָץ בּוֹ
  choice: “அவனை மிகவும் வற்புறுத்தினான்”
  rationale: פרץ ב என்ற சொற்றொடர் இங்கு ஒருவரைத் தீவிரமாக அல்லது தொடர்ந்து வற்புறுத்துவதைக் குறிக்கிறது.
- source_word: וְלֹא אָבָה לָלֶכֶת
  choice: “போக விரும்பவில்லை”
  rationale: אבה என்பதன் ‘மனமிருக்கவில்லை/இசையவில்லை’ என்ற விருப்ப மறுப்பை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיְבָרֲכֵהוּ
  choice: “அவன் அப்சலோமை ஆசீர்வதித்தான்”
  rationale: எபிரெய வினைச்சொல்லின் ஆண்பால் ஒருமை எழுவாயையும் பொருளையும் காக்கிறது; தமிழில் தெளிவுக்காக செயப்படுபொருளின் பெயர் மீண்டும் தரப்படுகிறது.
theological_decisions:
- issue: וַיְבָרֲכֵהוּ என்பதில் ஆசீர்வதித்தவர் யார்?
  choice: அரசன் அப்சலோமை ஆசீர்வதித்தான்
  alternative: அப்சலோம் அரசனை ஆசீர்வதித்தான்
  rationale: முந்தைய உடன்பட்ட எழுவாய் ‘அரசன்’; ஆகவே தொடர்ச்சியான இயல்பான வாசிப்பில் அரசனே ஆசீர்வதிக்கிறான். இது இலக்கண மற்றும் உரையாடல் ஓட்டத்தின் அடிப்படையிலான முடிவு; தனிப்பட்ட கோட்பாடு அல்ல.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. ‘எனினும்’ என்பது வற்புறுத்தலுக்குப் பிறகும் அரசன் செல்ல மறுத்தாலும் ஆசீர்வதித்தான் என்ற கருத்து மாறுபாட்டை இயல்பாக இணைக்கிறது.
