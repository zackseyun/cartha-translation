source:
  edition: WLC
  text: וְ/עַתָּ֡ה אַל יָשֵׂם֩ אֲדֹנִ֨/י הַ/מֶּ֤לֶךְ אֶל לִבּ/וֹ֙ דָּבָ֣ר לֵ/אמֹ֔ר כָּל בְּנֵ֥י הַ/מֶּ֖לֶךְ מֵ֑תוּ כִּֽי אִם אַמְנ֥וֹן לְ/בַדּ֖/וֹ מֵֽת־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/033.yaml
  text: Now let not my lord the king take this matter to heart[a], saying, ‘All the king’s sons are dead,’ for Amnon alone is dead.
translation:
  language: ta
  text: இப்போது, ‘அரசரின் மகன்கள் எல்லாரும் இறந்துவிட்டார்கள்’ என்று என் ஆண்டவராகிய அரசர் இந்தச் செய்தியை மனத்தில் வைத்துக்கொள்ள வேண்டாம்[a]. அம்னோன் மட்டுமே இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில் சொல்லுக்குச் சொல், ‘இந்த வார்த்தையை/விஷயத்தைத் தன் இதயத்தில் வைக்க வேண்டாம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: யோனதாப் முந்தைய தவறான செய்தியைத் திருத்தத் தொடங்குவதை இயல்பான உரையாடல் மாற்றச்சொல்லாகக் காட்டுகிறது.
- source_word: אַל יָשֵׂם ... אֶל לִבּוֹ
  choice: மனத்தில் வைத்துக்கொள்ள வேண்டாம்
  rationale: எபிரேய மொழியின் ‘இதயத்தில் வைக்குதல்’ என்ற உருவகத்தைத் தமிழில் இயல்பாகவும், செய்தியை உண்மையென ஏற்றுக்கொள்ள வேண்டாம் என்ற சூழல்சார் பொருளுடனும் தருகிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசர்
  rationale: அரசவைக்குரிய மரியாதையான விளிப்பை நவீனத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: דָּבָר
  choice: இந்தச் செய்தி
  rationale: இங்கு அரசரின் மகன்கள் கொல்லப்பட்டதாக வந்த தகவலைக் குறிக்கிறது; ‘செய்தி’ என்பது சூழலுக்கு இயல்பானது.
- source_word: לֵאמֹר
  choice: என்று
  rationale: மனத்தில் ஏற்றுக்கொள்ள வேண்டாத செய்தியின் உள்ளடக்கத்தைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: அரசரின் மகன்கள் எல்லாரும்
  rationale: குறிப்பாக அரசரின் ஆண் பிள்ளைகளையே குறிக்கும் மூலமொழிக் கட்டமைப்பைத் துல்லியமாகத் தருகிறது.
- source_word: מֵתוּ
  choice: இறந்துவிட்டார்கள்
  rationale: நேரடி கூற்றில் அவர்கள் அனைவரும் இப்போது இறந்த நிலையில் உள்ளனர் என்ற தவறான முடிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי אִם ... לְבַדּוֹ
  choice: அம்னோன் மட்டுமே
  rationale: அனைவரும் அல்ல, அம்னோன் ஒருவன் மட்டுமே என்ற திருத்தும் மற்றும் விலக்கும் வலியுறுத்தலைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מֵת
  choice: இறந்தான்
  rationale: அம்னோனின் மரணத்தை உறுதிப்படுத்தி, முந்தைய தவறான பொதுச் செய்தியுடன் தெளிவான முரண்பாட்டை உருவாக்குகிறது.
