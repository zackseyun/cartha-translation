  terminology: ‘அரசர்,’ ‘மகன்கள்,’ ‘அம்னோன்,’ மற்றும் ‘மனத்தில் வைத்துக்கொள்ள’ ஆகிய சொல்லாட்சிகள் பொருத்தமானவை. பெயரின் தமிழ் வடிவம் நிலையானது. அடிக்குறிப்பு மூலத்தின் இதய உருவகத்தையும் דבר என்பதன் ‘வார்த்தை/விஷயம்’ என்னும் பரப்பையும் சரியாகக் குறிக்கிறது.
