  source_fidelity: மூல எபிரேயத்தின் உரையாடல் மாற்றச்சொல், அரசவைக்குரிய மரியாதைமிக்க விளிப்பு, ‘மனத்தில் வைப்பது’ என்ற உருவகம், தவறான பொதுச் செய்தியின் மேற்கோள், மற்றும் அம்னோன் மட்டுமே இறந்தான் என்ற விலக்குத் திருத்தம் ஆகியவை துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘இறந்துவிட்டார்கள்’ மற்றும் ‘இறந்தான்’ ஆகியவை இச்சூழலில் மூலத்தின் கூறப்பட்ட மரணநிலையை இயல்பாக வெளிப்படுத்துகின்றன.
