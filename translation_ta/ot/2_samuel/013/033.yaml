  register: நவீன நிலையான தமிழில், அரசவைக்குரிய மரியாதையையும் கதையின் நேரடியான திருத்தத்தையும் காக்கும் கண்ணியமான நடை. மூலத்தின் இதய உருவகம் முதன்மை உரையில் இயல்பான தமிழ் மரபுத்தொடராகவும் அடிக்குறிப்பில் சொற்பொருளாகவும் தரப்பட்டுள்ளது.
