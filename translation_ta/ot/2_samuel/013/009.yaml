  register: நவீன பொதுத்தமிழில், கதையோட்டத்துக்கு ஏற்ற தெளிவானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் காரணவினைத் தன்மையும் ‘கொட்டினாள்’ என்ற concrete செயலும் காக்கப்பட்டுள்ளன; பாத்திரத்தின் துல்லிய வடிவம் உறுதியற்றதால் மிகக் குறிப்பான சொல்லைத் தவிர்த்துள்ளது.
