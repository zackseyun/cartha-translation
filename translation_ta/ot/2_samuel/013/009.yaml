base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/009.yaml
  text: Then she took the pan and poured them out before him[a], but he refused to eat. And Amnon said[b], “Send everyone out from me.” So everyone went out from him.
translation:
  language: ta
  text: அப்போது அவள் பரிமாறும் பாத்திரத்தை எடுத்து, அவனுக்கு முன்பாக அவற்றை ஊற்றினாள்[a]. ஆனால் அவன் சாப்பிட மறுத்தான். அம்னோன், “என் முன்னிலையிலிருந்து அனைவரையும் வெளியே அனுப்புங்கள்” என்றான்[b]. எனவே அனைவரும் அவனிடமிருந்து வெளியேறினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றை அவனுக்கு முன்பாகப் பரிமாறினாள்.” எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “ஊற்றினாள்”; இங்கு உணவைப் பரிமாறும் சூழலில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “ஒவ்வொரு மனிதனையும்.” இங்கு அது அங்கிருந்த அனைவரையும் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂרֵת
  choice: பரிமாறும் பாத்திரம்
  rationale: இச்சொல் உணவைச் சமைக்க அல்லது பரிமாறப் பயன்படுத்திய பாத்திரத்தைக் குறிக்கிறது. அதன் துல்லியமான வடிவம் உறுதியாக இல்லாததால், ‘வாணலி’ என்று மிகக் குறிப்பாக மொழிபெயர்க்காமல் ‘பரிமாறும் பாத்திரம்’ என வழங்கப்பட்டுள்ளது.
- source_word: וַתִּצֹק לְפָנָיו
  choice: அவனுக்கு முன்பாக அவற்றைக் கொட்டினாள்
  rationale: יצק என்பதன் அடிப்படைப் பொருள் ‘ஊற்று/கொட்டு’ என்பதாகும். உணவைப் பரிமாறும் இச்சூழலில், பாத்திரத்திலிருந்த உணவை அவனுக்கு முன்பாகக் கொட்டிய செயலை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது; ‘பரிமாறினாள்’ என்ற சூழல்சார் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיְמָאֵן לֶאֱכוֹל
  choice: அவன் சாப்பிட மறுத்தான்
  rationale: מָאֵן வெறும் விருப்பமின்மையை அல்ல, திட்டமான மறுப்பைக் குறிக்கிறது.
- source_word: הוֹצִיאוּ
  choice: வெளியே அனுப்புங்கள்
  rationale: יצא என்பதன் ஹிஃபில் கட்டளை வடிவம் ‘வெளியே போகச் செய்’ என்ற காரணவினைப் பொருளைக் கொண்டது; பணியாளர்களிடம் கூறப்படும் கட்டளையாக ‘வெளியே அனுப்புங்கள்’ இயல்பாக உள்ளது.
- source_word: כָל אִישׁ
  choice: எல்லாரையும்
  rationale: சொல்லுக்குச் சொல் ‘ஒவ்வொரு ஆணையும்’ என்றாலும், இங்கு உடனிருந்த அனைவரையும் கூட்டாகக் குறிக்கும் வழக்காக வருகிறது. ஆகவே இயல்பான தமிழில் ‘எல்லாரையும்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מֵעָלַי / מֵעָלָיו
  choice: என்னிடமிருந்து / அவனைவிட்டு
  rationale: ‘என்மேலிருந்து/அவன்மேலிருந்து’ என்பது சொற்பொருள்; இச்சூழலில் ‘என் அருகிலிருந்து/அவன் அருகிலிருந்து’ அல்லது ‘என் முன்னிலையிலிருந்து/அவன் முன்னிலையிலிருந்து’ என்ற கருத்தைக் குறிக்கிறது. கட்டளையிலும் அதன் நிறைவேற்றத்திலும் இயல்பான தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது.
