base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/006.yaml
  text: So Amnon lay down and pretended to be sick. When the king came to see him[a], Amnon said to the king, “Please let Tamar my sister come and make two cakes before my eyes, so that I may eat from her hand.”
translation:
  language: ta
  text: அம்னோன் படுத்துக்கொண்டு, நோயுற்றவன்போல் நடித்தான். அரசர் அவனைப் பார்க்க வந்தபோது, அம்னோன் அவரிடம், “தயவுசெய்து என் சகோதரி தாமார் வந்து, என் கண்முன்னே இரண்டு பலகாரங்களை[a] செய்யட்டும்; நான் அவள் கையிலிருந்து சாப்பிடுவதற்காக” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரண்டு கேக்குகளை” அல்லது “இரண்டு பேஸ்ட்ரிகளை”; இங்கு வரும் எபிரெயச் சொல் குறிக்கும் உணவின் துல்லியமான வகை உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: படுத்துக்கொண்டு
  rationale: அம்னோன் தன் ஏமாற்றுத் திட்டத்தின் ஒரு பகுதியாகப் படுக்கையில் படுத்ததைக் குறிக்கிறது; நவீன தமிழில் இயல்பான தொடராக அமைக்கப்பட்டது.
- source_word: וַיִּתְחָל
  choice: நோயுற்றவன்போல் நடித்தான்
  rationale: இச்சூழலில் உண்மையாக நோயுறுவதை அல்ல, நோயுற்றதாகப் பாசாங்கு செய்வதையே வினை வடிவம் குறிக்கிறது.
- source_word: לִרְאֹתוֹ
  choice: அவனைப் பார்க்க
  rationale: எபிரெயச் சொல்லின் நேரடியான காட்சிப் பொருளைப் பாதுகாக்கிறது; சூழலில் இது நலம் விசாரிக்க வந்ததையும் இயல்பாக உணர்த்துகிறது.
- source_word: תָּבוֹא נָא
  choice: தயவுசெய்து ... வந்து ... தரட்டும்
  rationale: נָא குறிக்கும் பணிவான வேண்டுகோளை இயல்பான தமிழ் நேர்க்கூற்றில் வெளிப்படுத்துகிறது.
- source_word: תָּמָר אֲחֹתִי
  choice: என் சகோதரி தாமார்
  rationale: தமிழில் இயல்பான உறவுமுறை–பெயர் வரிசையைப் பயன்படுத்துகிறது.
- source_word: וּתְלַבֵּב
  choice: செய்து தரட்டும்
  rationale: அரிதான இவ்வினை குறிப்பிட்ட உணவைத் தயாரிப்பதைக் குறிக்கிறது; சமையல் செய்முறை உறுதியற்றதால் பொதுவான சொல்லாக்கம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְעֵינַי
  choice: என் கண்முன்னே
  rationale: அம்னோன் பார்த்துக்கொண்டிருக்கும்போதே உணவு தயாரிக்கப்பட வேண்டும் என்ற எபிரெய மொழியின் காட்சிசார் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: שְׁתֵּי לְבִבוֹת
  choice: இரண்டு பலகாரங்களை
  rationale: לְבִבוֹת குறிக்கும் உணவின் துல்லியமான வகையும் வடிவமும் உறுதியற்றவை. ‘இதய வடிவ’ என்ற ஊகத்தை முதன்மை உரையில் சேர்க்காமல், பொதுவான உணவுப் பெயர் பயன்படுத்தப்பட்டது.
- source_word: וְאֶבְרֶה
  choice: நான் ... சாப்பிட வேண்டும்
  rationale: உடல்நலமற்றவராகத் தோன்றும் ஒருவர் உணவு உட்கொள்வதைக் குறிக்கும் பொருளை எளிய, இயல்பான தமிழில் தருகிறது.
- source_word: מִיָּדָהּ
  choice: அவள் கையிலிருந்து
  rationale: எபிரெய மொழியின் ஒருமை உருவகத்தை நேரடியாகப் பாதுகாத்து, தாமாரே தனிப்பட்ட முறையில் உணவளிக்க வேண்டும் என்ற வேண்டுகோளை வெளிப்படுத்துகிறது.
