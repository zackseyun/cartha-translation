translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. அரசரைக் குறிக்கும் இடத்தில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. உணவின் வடிவம் குறித்து எபிரெய மூலத்தில் இல்லாத ‘இதய வடிவ’ என்ற விளக்கம் சேர்க்கப்படவில்லை; உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
