base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/029.yaml
  text: So Absalom’s young men did to Amnon as Absalom had commanded[a]. Then all the king’s sons arose[b], and each mounted his mule and fled.
translation:
  language: ta
  text: அப்சலோமின் இளைஞர்கள்[b], அப்சலோம் கட்டளையிட்டபடியே அம்னோனுக்குச் செய்தார்கள்[a]. அப்போது அரசனின் மகன்கள் அனைவரும் எழுந்து, ஒவ்வொருவரும் தம் கோவேறு கழுதையின்மேல் ஏறித் தப்பியோடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அப்சலோம் கட்டளையிட்டபடியே அம்னோனுக்குச் செய்தார்கள்.” முந்தைய வசனத்தில், திராட்சரசத்தால் அம்னோனின் உள்ளம் மகிழ்ந்திருக்கும்போது அவனை அடித்துக் கொல்லும்படி கொடுக்கப்பட்ட கட்டளை வெளிப்படையாகக் கூறப்பட்டுள்ளது.'
    reason: cross_reference
  - marker: b
    text: “அப்சலோமின் பணியாளர்கள்” அல்லது “அப்சலோமின் ஏவலர்கள்” என்றும் மொழிபெயர்க்கலாம். இதற்கான எபிரெயச் சொல் பணியில் இருக்கும் இளைஞர்களைக் குறிக்கவும் பயன்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי אַבְשָׁלוֹם
  choice: அப்சலோமின் இளைஞர்கள்
  rationale: נַעַר என்பது சூழலுக்கேற்ப இளைஞர், பணியாளர் அல்லது ஏவலர் எனப் பொருள்படும். இவர்கள் அப்சலோமின் கட்டளையை நிறைவேற்றியவர்கள்; எனினும், அவர்களின் துல்லியமான பணிநிலையை உரை குறிப்பிடாததால், மூலத்தின் சொல்வடிவத்தையும் பொருள் அகலத்தையும் காக்கும் வகையில் ‘இளைஞர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיַּעֲשׂוּ לְאַמְנוֹן
  choice: அம்னோனுக்குச் செய்தார்கள்
  rationale: עשה + לְ என்ற சுருக்கமான எபிரெயச் சொல்லமைப்பு அம்னோனுக்கு எதிராகச் செய்யப்பட்ட செயலைக் குறிக்கிறது. முந்தைய வசனம் கொலைக் கட்டளையை வெளிப்படையாகக் கூறுவதால், இவ்வசனத்தில் இல்லாத விளக்கத்தைச் சேர்க்காமல் மூலத்தின் சுருக்கம் பாதுகாக்கப்படுகிறது.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: கட்டளையிட்டபடியே
  rationale: அப்சலோம் முன்பே கொடுத்த கட்டளைக்கு ஏற்ப அவர்கள் செயல்பட்டதை இயல்பான தமிழில் துல்லியமாகத் தெரிவிக்கிறது.
- source_word: וַיָּקֻמוּ
  choice: எழுந்து
  rationale: கதையின் திடீர் நிகழ்வோட்டத்தையும், எழுந்து புறப்படுவதற்கான செயலையும் சுருக்கமாகக் காட்டுகிறது.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: அரசனின் மகன்கள் அனைவரும்
  rationale: எபிரெயக் கூட்டுச் சொல்லை நேரடியாகவும் இயல்பான தமிழ்ச் சொல்வரிசையிலும் வழங்குகிறது.
- source_word: וַיִּרְכְּבוּ אִישׁ עַל פִּרְדּוֹ
  choice: அவரவர் தங்கள் கோவேறு கழுதையின்மேல் ஏறி
  rationale: אִישׁ இங்கு பகிர்நிலைப் பொருளில் ‘அவரவர்’ எனவும், פֶּרֶד ‘கோவேறு கழுதை’ எனவும் மொழிபெயர்க்கப்படுகிறது. ஒவ்வொருவரும் தமக்குரிய விலங்கின்மேல் ஏறியதைத் தெளிவாக்குகிறது.
- source_word: וַיָּנֻסוּ
  choice: தப்பியோடினார்கள்
  rationale: נוּס குறிக்கும் அவசரமான ஓட்டத்தையும் ஆபத்திலிருந்து தப்பிச் செல்லுதலையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
