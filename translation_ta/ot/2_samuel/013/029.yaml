translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சுருக்கமான ‘அம்னோனுக்குச் செய்தார்கள்’ என்ற சொல்லாட்சி விளக்கிச் செழுமைப்படுத்தப்படாமல் காக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் [b] குறி ‘எழுந்தார்கள்’ என்பதற்குப் பின் இருந்தாலும், அதன் அடிக்குறிப்பு נַעֲרֵי אַבְשָׁלוֹם என்பதையே விளக்குவதால், தமிழில் அது ‘அப்சலோமின் இளைஞர்கள்’ என்பதற்குப் பின் பொருத்தப்பட்டுள்ளது.
