lexical_decisions:
- source_word: גֹזְזִים
  choice: ஆடுகளுக்கு மயிர் கத்தரிக்கும் வேலை
  rationale: எபிரெயச் சொல் இலக்கணப்படி ‘மயிர் கத்தரிப்பவர்கள்’ என்று பொருள்பட்டாலும், சூழலில் அது ஆடுகளின் மயிர் கத்தரிப்பு நிகழ்வைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இவ்வாறு வழங்கப்பட்டது.
- source_word: עַבְדֶּךָ
  choice: உமது அடியேன்
  rationale: அப்சலோம் அரசனிடம் தன்னைத் தாழ்த்தி மூன்றாம் நபர் வடிவில் குறிப்பிடும் மரியாதைமிக்க அரசவைக் கூற்றைத் தமிழில் பாதுகாக்கிறது.
- source_word: יֵלֶךְ־נָא
  choice: வர வேண்டுகிறேன்
  rationale: சொல்லுக்குச் சொல் ‘செல்லட்டும்’ என்றாலும், அழைப்பின் இலக்கை நோக்கிய தமிழ்ப் பார்வையில் ‘வர’ என்பது இயல்பானது; נָא குறிக்கும் பணிவான வேண்டுகோளும் பாதுகாக்கப்படுகிறது.
