  text: Then Absalom came to the king and said, “Look, your servant has shearers. Please let the king and his servants go with your servant.”
translation:
  language: ta
  text: பின்பு அப்சலோம் அரசனிடம் வந்து, “இதோ, உமது அடியேனுடைய ஆடுகளுக்கு மயிர் கத்தரிப்பவர்கள் இருக்கிறார்கள். அரசரும் அவருடைய பணியாளர்களும் உமது அடியேனுடன் வருமாறு வேண்டுகிறேன்” என்றான்.
