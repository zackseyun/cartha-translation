  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אַבְשָׁל֣וֹם בָּרַ֔ח וַ/יֵּ֛לֶךְ אֶל תַּלְמַ֥י בֶּן עמיחור מֶ֣לֶךְ גְּשׁ֑וּר וַ/יִּתְאַבֵּ֥ל עַל בְּנ֖/וֹ כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/037.yaml
  text: But Absalom fled and went to Talmai son of Ammihur[a], king of Geshur. And he mourned for his son all the days.
translation:
  language: ta
  text: ஆனால் அப்சலோம் தப்பியோடி, அம்மிகூரின் மகனும் கேசூரின் அரசனுமான தல்மாயிடம் சென்றான். தாவீது[a] தன் மகனுக்காக நாள்தோறும் துக்கம் அனுசரித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “துக்கம் அனுசரித்தார்” என்பதன் எழுவாய் எபிரெயில் வெளிப்படையாகக் குறிப்பிடப்படவில்லை; சூழலிலிருந்து அது தாவீது எனப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם בָּרַח
  choice: ஆனால் அப்சலோம் தப்பியோடி
  rationale: וְ இங்கு முந்தைய நிகழ்வுடன் உள்ள கதைமுறை முரண்பாட்டைச் சுட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது; בָּרַח என்பதன் தப்பிச் செல்லும் பொருளை ‘தப்பியோடி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֵּלֶךְ אֶל תַּלְמַי
  choice: தல்மாயிடம் சென்றான்
  rationale: இலக்கைச் சுட்டும் אֶל உடன் வரும் இயக்க வினையைத் தமிழில் இயல்பாக ‘-ிடம் சென்றான்’ என வழங்குகிறது.
- source_word: בֶּן עמיחור מֶלֶךְ גְּשׁוּר
  choice: கேசூரின் அரசனான அம்மிகூரின் மகன்
  rationale: எபிரெயக் கட்டமைப்பில் தல்மாய், அம்மிகூரின் மகனும் கேசூரின் அரசனுமாக அடையாளப்படுத்தப்படுகிறார்; தமிழில் உறவையும் பதவியையும் தெளிவாகவும் இயல்பாகவும் இணைக்கிறது.
- source_word: וַיִּתְאַבֵּל
  choice: துக்கம் அனுசரித்தார்
  rationale: אבל என்பதன் Hitpael வடிவம் மரணத்தை முன்னிட்டு துக்கம் அனுசரிப்பதைக் குறிக்கிறது; தமிழில் மரியாதைமிக்க இயல்பான சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: עַל בְּנוֹ
  choice: தன் மகனுக்காக
  rationale: துக்கச் சூழலில் עַל என்பதற்கு ‘-க்காக’ இயல்பான இணை; בְּנוֹ என்பதன் ஒருமைத் தன்மையைப் பாதுகாக்கிறது.
- source_word: כָּל הַיָּמִים
  choice: நாள்தோறும்
  rationale: சொல்லுக்குச் சொல் ‘எல்லா நாட்களிலும்’ என்பதற்குப் பதிலாக, தொடர்ச்சியான துக்கத்தை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கும் ‘நாள்தோறும்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: וַיִּתְאַבֵּל என்ற வினையின் மறைமுக எழுவாய்
  choice: முதன்மை உரையில் ‘தாவீது’ என வெளிப்படையாகக் குறிப்பிடப்பட்டு அடிக்குறிப்பால் எபிரெயின் மறைமுகத் தன்மை தெரிவிக்கப்பட்டது.
  alternative: ‘அவர்’ அல்லது ‘அவன்’ என்று மட்டும் மொழிபெயர்த்து எழுவாயை மறைமுகமாக விடுதல்.
  rationale: எபிரெயில் எழுவாய் வெளிப்படையாக இல்லை. சூழலில் தாவீதே குறிக்கப்படுகிறார்; ஆயினும் மூலத்தின் இலக்கணத் தெளிவின்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. அரசர் தாவீதைக் குறிக்கும் வினையில் மரியாதைப் பன்மை கையாளப்பட்டது; பெயர்கள் தமிழ் வேதாகம மரபுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டன.
