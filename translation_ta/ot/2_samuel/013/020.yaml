base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/020.yaml
  text: Then Absalom her brother said to her[a], “Has Amnon your brother been with you? But now, my sister, keep silent; he is your brother. Do not take this matter to heart.” So Tamar remained, devastated[b], in the house of Absalom her brother.
translation:
  language: ta
  text: அப்போது அவளுடைய சகோதரன் அப்சலோம் அவளிடம், “உன் சகோதரன் அம்னோன் உன்னுடன் இருந்தானா?[a] ஆனால் இப்போது, என் சகோதரியே, மௌனமாக இரு; அவன் உன் சகோதரன். இந்தக் காரியத்தை மனதில் எடுத்துக்கொள்ளாதே” என்றான். ஆகவே தாமார் பாழடைந்தவளாய்[b] தன் சகோதரன் அப்சலோமின் வீட்டில் தங்கியிருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன் சகோதரன் அம்னோன் உன்னுடன் இருந்தானா?” என்பது எபிரெய மொழியில் பாலியல் வன்முறையை மறைமுகமாகக் குறிப்பிடும் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பேரழிவுற்றவளாய்.” எபிரெயச் சொல் பேரழிவு, சிதைவு, அல்லது அதிர்ச்சியால் ஏற்பட்ட பாழ்நிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲמִינוֹן
  choice: அம்னோன்
  rationale: தனிப்பெயர் நவீனத் தமிழில் எளிதாக உச்சரிக்கக்கூடிய வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הָיָה עִמָּךְ
  choice: உன்னுடன் இருந்தானா?
  rationale: எபிரெய மொழியின் மறைமுகமான சொற்றொடரை அப்படியே காக்கிறது; இச்சூழலில் இது பாலியல் வன்முறையை நாசூக்காகக் குறிப்பிடுகிறது.
- source_word: הַחֲרִישִׁי
  choice: அமைதியாக இரு
  rationale: חרשׁ என்ற வினையின் கட்டளைப் பொருளான மௌனமாக இருப்பதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָחִיךְ הוּא
  choice: அவன் உன் சகோதரன்
  rationale: அப்சலோம் குடும்ப உறவைச் சுட்டிக்காட்டும் குழப்பமூட்டும், கடுமையான கூற்றை மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: אַל תָּשִׁיתִי אֶת לִבֵּךְ לַדָּבָר הַזֶּה
  choice: இந்தக் காரியத்தை உன் மனத்தில் வைத்துக்கொள்ளாதே
  rationale: ‘உன் இருதயத்தை இந்தக் காரியத்தின்மேல் வைக்காதே’ என்ற எபிரெய மரபுத்தொடரின் மனத்தில் தொடர்ந்து சுமக்காதே என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: וַתֵּשֶׁב
  choice: தங்கியிருந்தாள்
  rationale: அவள் அப்சலோமின் வீட்டில் தொடர்ந்து இருந்த நிலையைக் குறிக்கிறது; மூலத்தின் ‘அமர்ந்தாள்/வசித்தாள்’ என்ற பொருள் வரம்பையும் காக்கிறது.
- source_word: שֹׁמֵמָה
  choice: பேரழிவுற்றவளாய்
  rationale: இச்சொல் குறிக்கும் பாழ்நிலை, அதிர்ச்சி, வாழ்வின் சிதைவு ஆகியவற்றை உணர்ச்சியிலும் சமூக நிலையிலும் வலுவாக வெளிப்படுத்துகிறது.
- source_word: בֵּית אַבְשָׁלוֹם
  choice: அப்சலோமின் வீட்டில்
  rationale: குடும்பம் மற்றும் இல்லம் சார்ந்த தெளிவான இடச்சூழலை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: பாலியல் வன்முறையைக் குறிக்கும் கதைசார் மறைமுக மொழி
  choice: ‘உன்னுடன் இருந்தானா?’ என்ற எபிரெய மொழியின் மறைமுகக் கேள்வியை முதன்மை உரையில் காத்தல்
  alternative: ‘உன்னைப் பாலியல் வன்முறைக்கு உள்ளாக்கினானா?’ அல்லது ‘உன்னுடன் படுத்தானா?’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: மூல உரை அதிர்ச்சிகரமான நிகழ்வை மறைமுகமாகக் குறிப்பிடுகிறது. அதை வெளிப்படையாக்குவது விளக்கமாகிவிடும்; எனவே மூலத்தின் அடக்கமான சொற்பாங்கு காக்கப்பட்டு, பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. வன்முறையை மென்மைப்படுத்தாமல், அதேவேளையில் எபிரெய மூலத்தின் மறைமுகச் சொல்லாட்சியும் உணர்ச்சி பதற்றமும் காக்கப்பட்டுள்ளன.
