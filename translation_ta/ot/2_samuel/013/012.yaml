base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/012.yaml
  text: She said to him[a], “No, my brother, do not violate me, for such a thing is not done in Israel[b]. Do not do this disgraceful thing.”
translation:
  language: ta
  text: அவள் அவனிடம், “வேண்டாம், என் சகோதரனே! என்னை வல்லுறவுக்கு உட்படுத்தாதே[a]. இத்தகைய செயல் இஸ்ரவேலில் செய்யப்படுவதில்லை. இந்தக் கேவலமான செயலை[b]ச் செய்யாதே” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என்னை அவமானப்படுத்தாதே” அல்லது “என்னைக் கற்பழிக்காதே” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் பாலியல் வன்முறையையும் அதனுடன் இணைந்த இழிவையும் அவமானத்தையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “இந்த அருவருப்பான செயலை” அல்லது “இந்த ஒழுக்கக்கேடான செயலை” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் வெறும் முட்டாள்தனத்தை அல்ல, ஒழுக்க ரீதியாகக் கடும் கேடான செயலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר לוֹ
  choice: அவள் அவனிடம் … என்றாள்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் உரையாடலைச் சூழும் வடிவில் தருகிறது.
- source_word: אַל
  choice: வேண்டாம் / … செய்யாதே
  rationale: முதல் אַל அவசரமான மறுப்பாகவும், அடுத்தவை நேரடியான தடைகளாகவும் செயல்படுகின்றன.
- source_word: אָחִי
  choice: என் சகோதரனே
  rationale: உறவுமுறைச் சொல்லை நேரடியாகத் தக்கவைக்கிறது; சம்பவத்தின் குடும்பவழி கொடுமையை இது வெளிப்படுத்துகிறது.
- source_word: תְּעַנֵּנִי
  choice: என்னை வல்லுறவுக்கு உட்படுத்தாதே
  rationale: Piel வடிவிலுள்ள ענה இச்சூழலில் பாலியல் வன்முறையையும் அதனால் ஏற்படும் அவமானப்படுத்தலையும் குறிக்கிறது. தமிழ் வாசகருக்கு நிகழவிருக்கும் வன்முறையைத் தெளிவாகக் கூறும் அதேவேளையில், வினையின் விரிந்த நிழற்பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: כִּי לֹא יֵעָשֶׂה כֵן בְּיִשְׂרָאֵל
  choice: இத்தகைய செயல் இஸ்ரவேலில் செய்யப்படுவதில்லை
  rationale: עשה என்பதன் செயப்பாட்டு வடிவம் வெளிப்படுத்தும் சமூக-ஒழுக்க நெறியை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אַל תַּעֲשֵׂה
  choice: செய்யாதே
  rationale: எபிரெயத்தின் நேரடியான தடையை எளிய, வலிமையான தமிழில் தருகிறது.
- source_word: הַנְּבָלָה הַזֹּאת
  choice: இந்தக் கேவலமான செயல்
  rationale: נְבָלָה என்பது சாதாரண அறிவீனத்தை அல்ல, ஒழுக்க ரீதியாக அருவருப்பானதும் சமூக நெறியை மீறுவதுமான செயலைக் குறிக்கிறது.
