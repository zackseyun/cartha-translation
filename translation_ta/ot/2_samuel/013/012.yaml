translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் உணர்ச்சித் தீவிரம் குறையாத நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பாலியல் வன்முறை மறைக்கப்படாமல் தெளிவாகக் கூறப்படுகிறது; மூலச்சொல்லிலுள்ள அவமானம்/இழிவு சார்ந்த நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது. இரு அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னர் முதன்மை உரையில் இடப்பட்டுள்ளன.
