translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அப்சலோம் ராஜாவிடம் வைக்கும் பணிவான வேண்டுகோளுக்கு ‘தயவுசெய்து’ பயன்படுத்தப்பட்டது; ராஜாவைக் குறிக்கும் வினைக்கு மரியாதைப் பன்மை வடிவம் தரப்பட்டது. ‘வָלֹא’ என்பதிலுள்ள சுருக்கம் முதன்மை உரையில் ஓரளவு காக்கப்பட்டு, அடிக்குறிப்பில் வெளிப்படையாக விளக்கப்பட்டுள்ளது.
