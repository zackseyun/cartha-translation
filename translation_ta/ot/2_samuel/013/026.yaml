  naturalness: “அப்படி இல்லையென்றால்” நவீன நிலையான தமிழில் இயல்பானது; அதேவேளையில் மூலத்தின் சுருக்கமான நிபந்தனைத் தன்மையைத் தக்கவைக்கிறது. கேள்விக்குப் பின் “என்றார்” என்பது கதைநடையில் “கேட்டார்” என்பதைக் காட்டிலும் மூலத்தின் ‘said’ என்பதற்கு நேரடியானது.
