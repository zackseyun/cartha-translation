  text: וַ/יֹּ֨אמֶר֙ אַבְשָׁל֔וֹם וָ/לֹ֕א יֵֽלֶךְ נָ֥א אִתָּ֖/נוּ אַמְנ֣וֹן אָחִ֑/י וַ/יֹּ֤אמֶר ל/וֹ֙ הַ/מֶּ֔לֶךְ לָ֥/מָּה יֵלֵ֖ךְ עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/026.yaml
  text: Then Absalom said[a], “If not, please let my brother Amnon go with us.” But the king said to him, “Why should he go with you?”
translation:
  language: ta
  text: அப்பொழுது அப்சலோம், “அப்படி இல்லையென்றால்[a], தயவுசெய்து என் சகோதரன் அம்னோன் எங்களோடு வரட்டும்” என்றான். ஆனால் ராஜா அவனிடம், “அவன் ஏன் உன்னோடு வர வேண்டும்?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் வெளிப்படையாக: “நீங்கள் வராவிட்டால், தயவுசெய்து என் சகோதரன் அம்னோன் எங்களோடு வரட்டும்.” எபிரெய வாக்கியம் சுருக்கமாக உள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்பொழுது ... என்றான் / ஆனால் ... கேட்டார்
  rationale: தொடர்நிகழ்வைக் குறிக்கும் வாவ் வடிவம் முதல் கூற்றில் ‘அப்பொழுது’ எனவும், ராஜாவின் மறுமொழியில் கருத்துத் திருப்பத்தை இயல்பாகக் காட்ட ‘ஆனால்’ எனவும் தரப்பட்டது.
- source_word: וָלֹא
  choice: அப்படியானால்
  rationale: முந்தைய மறுப்பைத் தொடர்ந்து வரும் சுருக்கமான எபிரெய வெளிப்பாடு. ‘நீங்கள் வராவிட்டால்’ என்ற உட்கருத்தைத் தீர்மானமாக விரிக்காமல், தமிழில் இயல்பாகப் பொருளைத் தொடர்கிறது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: பணிவான வேண்டுகோளைக் குறிக்கும் துகள்; நவீனத் தமிழில் இயல்பான மரியாதைச் சொல்.
- source_word: יֵלֶךְ
  choice: வரட்டும் / வர வேண்டும்
  rationale: அப்சலோமின் வேண்டுகோளிலுள்ள விருப்பவினை ‘வரட்டும்’ என்றும், ராஜாவின் வினாவிலுள்ள செயற்பொருளை ‘வர வேண்டும்’ என்றும் இயல்பாகத் தருகிறது. இலக்கை நோக்கிய எபிரெய ‘செல்’ தமிழ் பார்வையில் உடனிருப்பைக் குறிக்க ‘வரு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אִתָּנוּ
  choice: எங்களோடு
  rationale: முதல் நபர் பன்மை உடனிகழ்ச்சியை நேரடியாகக் காட்டுகிறது.
- source_word: אַמְנוֹן אָחִי
  choice: என் சகோதரன் அம்னோன்
  rationale: உறவுமுறையையும் பெயரையும் நவீனத் தமிழின் இயல்பான வரிசையில் தருகிறது.
- source_word: לָמָה
  choice: ஏன்
  rationale: காரணம் கேட்கும் எளிய வினாச்சொல்லின் நேரான தமிழ் இணை.
- source_word: עִמָּךְ
  choice: உன்னோடு
  rationale: அப்சலோமைச் சுட்டும் இரண்டாம் நபர் ஒருமை உடனிகழ்ச்சியைத் துல்லியமாகத் தருகிறது.
