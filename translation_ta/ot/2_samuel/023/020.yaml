  register: நவீன நிலையான தமிழில், வரலாற்றுக் கதைநடைக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத் தொடரின் உறவுமுறை அமைப்பை மிகையாக மறுவிளக்கம் செய்யாமல் கோடுகளுக்குள் தக்கவைத்துள்ளோம்; אֲרִאֵל என்பதிலுள்ள உண்மையான சொற்பொருள் ஐயமும் பாதுகாக்கப்பட்டுள்ளது.
