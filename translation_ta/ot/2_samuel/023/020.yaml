base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/020.yaml
  text: And Benaiah son of Jehoiada[a], son of a valiant man, great in deeds, from Kabzeel—he struck down the two sons of Ariel of Moab, and he went down and struck down the lion in the midst of the pit on a snowy day.
translation:
  language: ta
  text: யோய்தாவின் மகனான பெனாயா, கப்செயேலைச் சேர்ந்த வீரமிக்கவரும் பெருஞ்செயல்கள் பல புரிந்தவருமான ஒருவரின் மகன்; அவன் மோவாபின் இரண்டு அரியேல்களை[a] வீழ்த்தினான். பனி பொழிந்த ஒரு நாளில் அவன் இறங்கி, அந்தக் குழியின் நடுவில் இருந்த சிங்கத்தை வீழ்த்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே வரும் எபிரெயச் சொல்லான אֲרִאֵל (அரியேல்) என்பதன் பொருள் உறுதியில்லை. அது ‘சிங்கம் போன்ற மனிதர்கள்,’ ‘வீரர்கள்’ என்பதைக் குறிக்கலாம்; அல்லது ஒரு பட்டப்பெயராகவோ பெயராகவோ இருக்கலாம். ஒரு பொருளை மட்டும் உறுதிப்படுத்தாமல் இருக்க மூலச் சொல்லின் வடிவம் முதன்மைப் பனுவலில் தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חַי
  choice: வீரமிக்க ஒருவர்
  rationale: இங்கு இச்சொற்றொடர் வெறுமனே ‘உயிருள்ள மனிதன்’ என்பதைக் குறிக்காமல், வலிமையும் வீரமும் கொண்ட ஒருவரைக் குறிக்கும் மரபுத்தொடராக உள்ளது.
- source_word: רַב פְּעָלִים
  choice: பெருஞ்செயல்கள் பல புரிந்த
  rationale: רַב என்பதன் மிகுதி/மேன்மை உணர்வையும் פְּעָלִים என்பதன் செயல்கள் அல்லது சாதனைகள் என்ற பொருளையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: מִקַּבְצְאֵל
  choice: கப்செயேலைச் சேர்ந்த
  rationale: מִן முன்னொட்டு பிறப்பிடம் அல்லது ஊர்ச் சார்பைக் குறிப்பதால், தமிழில் இயல்பாக ஊர்ச் சார்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הִכָּה
  choice: வீழ்த்தினான்
  rationale: போர்ச் சூழலில் נכה குறிக்கும் வன்முறையான வெற்றிச் செயலைத் தெளிவாகத் தருகிறது; அதேவேளை வினைச்சொல் சொல்வதைவிட அதிகமாக விவரிக்கவில்லை.
- source_word: שְׁנֵי אֲרִאֵל מוֹאָב
  choice: மோவாபின் இரண்டு அரியேல்களை
  rationale: אֲרִאֵל இவ்விடத்தில் பொருள் உறுதியற்ற சொல். ஒரே விளக்கத்தைத் தீர்மானமாக்காமல், எபிரெய வடிவத்தைத் தமிழில் ஒலிபெயர்த்து அடிக்குறிப்பில் மாற்றுப் பொருள்கள் தரப்பட்டுள்ளன.
- source_word: יָרַד
  choice: இறங்கி
  rationale: குழிக்குள் கீழே சென்ற இயக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הָאֲרִי
  choice: சிங்கம்
  rationale: எபிரெயச் சொல் தெளிவாகச் சிங்கத்தைக் குறிக்கிறது.
- source_word: בְּתוֹךְ הַבּוֹר
  choice: ஒரு குழிக்குள் … அங்கே
  rationale: בּוֹר என்பது குழி அல்லது நீர்த்தொட்டியைக் குறிக்கலாம்; இச்சூழலில் ‘குழி’ பரந்த பொருளைத் தக்கவைக்கிறது. ‘குழிக்குள்’ என்பது בְּתוֹךְ என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: பனி பொழிந்த ஒரு நாளில்
  rationale: ‘பனியின் நாளில்’ என்ற எபிரெயக் காலக் குறிப்பை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
