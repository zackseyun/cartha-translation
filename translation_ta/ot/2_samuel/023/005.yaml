  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வீடு’ என்ற மூல உருவகம் குடும்பம் மற்றும் அரச மரபு ஆகிய இரு பொருள்நிழல்களையும் திறந்தவையாக வைத்திருக்கிறது. தொடக்கத்தின் எதிர்மறை வாசிப்பும் இறுதியின் வினா வடிவமும் உரையின் உண்மையான தெளிவின்மையையும் இறையியல் இறுக்கத்தையும் மறைக்காமல் காக்கின்றன.
