base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/005.yaml
  text: For my house is not so with God[a]; yet he has made with me an everlasting covenant, ordered in every way and kept secure[b]. For this is all my salvation and all my desire—will he not indeed make it grow?
translation:
  language: ta
  text: ஏனெனில், என் வீடு கடவுளோடு அப்படிப்பட்டதாக இல்லை[a]. ஆயினும், அவர் என்னோடு என்றென்றும் நிலைக்கும் ஓர் உடன்படிக்கையைச் செய்திருக்கிறார்; அது எல்லாவற்றிலும் ஒழுங்குபடுத்தப்பட்டுப் பாதுகாக்கப்பட்டுள்ளது. ஏனெனில், என் முழு மீட்பும் என் முழு விருப்பமும் இதுவே—அவர் அதை முளைக்கச் செய்யமாட்டாரா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் வீடு கடவுளோடு அப்படிப்பட்டதாக இல்லையா?” தொடக்கத்தை எதிர்மறைக் கூற்றாக அல்லாமல், நேர்மறைப் பதிலை எதிர்பார்க்கும் வினாவாகப் பலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “ஏனெனில், அவர் அதை நிச்சயமாக முளைக்கச் செய்வார்.” இறுதித்தொடர் எபிரேயத்தில் கடினமானது; அதை நேர்மறைப் பதிலை எதிர்பார்க்கும் வினாவாகவோ வலியுறுத்திய உறுதியாகவோ வாசிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முதல் כִּי முந்தைய இறைவாக்கோடு இவ்வாக்கியத்தை விளக்க முறையில் இணைக்கிறது. பின்னரும் வரும் כִּי சூழலுக்கேற்ப காரண அல்லது வலியுறுத்தல் நயத்தைத் தருகிறது.
- source_word: לֹא כֵן
  choice: இவ்வாறு இல்லை
  rationale: எபிரேயச் சொல்லாட்சியை மிகையாக விளக்காமல், அதன் எதிர்மறை வடிவத்தையும் உரையிலுள்ள இறுக்கத்தையும் காக்கிறது.
- source_word: בֵּיתִי
  choice: என் வீடு
  rationale: இது குடும்பம், வீட்டார், அரச மரபு ஆகிய பொருள்நிழல்களைத் தாங்கக்கூடியதால், மூலத்தின் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: עִם אֵל
  choice: கடவுளோடு
  rationale: עִם என்பதன் இயல்பான உறவுப்பொருளான ‘உடன்/ஓடு’ என்பதைக் காக்கிறது.
- source_word: בְרִית עוֹלָם
  choice: என்றென்றைக்குமான ஓர் உடன்படிக்கை
  rationale: עוֹלָם குறிக்கும் நீடித்த நிலைத்தன்மையையும் உடன்படிக்கைச் சொல்லாட்சியையும் இயல்பான தமிழில் தருகிறது.
- source_word: שָׂם לִי
  choice: என்னோடு ... செய்திருக்கிறார்
  rationale: சொல்லுக்குச் சொல் ‘எனக்காக வைத்தார்’ என்றாலும், உடன்படிக்கைச் சூழலில் ‘என்னோடு செய்தார்’ என்பது செயற்பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: עֲרוּכָה בַכֹּל
  choice: எல்லாவற்றிலும் ஒழுங்குபடுத்தப்பட்டு
  rationale: உடன்படிக்கை முழுமையாக ஒழுங்கமைக்கப்பட்டிருப்பதை, மூலத்தின் மொத்தப்படுத்தும் வலிமையுடன் வெளிப்படுத்துகிறது.
- source_word: וּשְׁמֻרָה
  choice: பாதுகாக்கப்பட்டுள்ளது
  rationale: செயப்பாட்டு மற்றும் விளைவு நிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: כָל יִשְׁעִי
  choice: என் மீட்பு அனைத்தும்
  rationale: יֵשַׁע என்பதன் விடுவிப்பு மற்றும் இரட்சிப்பு சார்ந்த பரந்த பொருளை ‘மீட்பு’ இயல்பாகத் தாங்குகிறது.
- source_word: וְכָל חֵפֶץ
  choice: என் விருப்பம் அனைத்தும்
  rationale: חֵפֶץ என்பதன் விருப்பம்/வாஞ்சை பொருளை இணைநிலையில் சுருக்கமாகத் தருகிறது.
- source_word: כִּי לֹא יַצְמִיחַ
  choice: அவர் அதை முளைக்கச் செய்யமாட்டாரா?
  rationale: צמח என்பதன் முளைத்தல் உருவகத்தையும் ஹிஃபில் காரணவினை வலிமையையும் காக்கிறது; வாக்கியத்தை நேர்மறையான எதிர்பார்ப்புள்ள வினாவாக வழங்குகிறது.
theological_decisions:
- issue: כִּי לֹא כֵן בֵּיתִי עִם אֵל என்ற தொடக்கத்தின் பொருள்
  choice: ‘என் வீடு கடவுளோடு இவ்வாறு இல்லை’ என்ற எதிர்மறைக் கூற்றாக முதன்மை உரையில் வழங்கப்பட்டது.
  alternative: ‘என் வீடு கடவுளோடு இவ்வாறு இல்லையா?’ என்ற நேர்மறைப் பதிலை எதிர்பார்க்கும் வினா.
  rationale: உயிர்க்குறியிடப்பட்ட எபிரேய உரை எதிர்மறையாக வாசிக்கப்படுகிறது. தொடரும் உடன்படிக்கை உறுதியோடு உள்ள இறுக்கத்தை நீக்காமல் முதன்மை உரையில் காத்து, முக்கியமான மாற்று வாசிப்பை அடிக்குறிப்பில் தருவது பொருத்தமானது.
- issue: இறுதி יַצְמִיחַ வினையின் பொருளும் தொடர்பும்
  choice: கடவுள் தாவீதின் மீட்பு/விருப்பத்தை நிறைவேற்றச் செய்வார் என எதிர்பார்க்கும் வினாவாக வழங்கப்பட்டது.
  alternative: ‘அவர் அதை முளைக்கச் செய்யமாட்டார்’ என்ற நேரடியான மறுப்பு; அல்லது ‘அவர் நிச்சயமாக அதை முளைக்கச் செய்வார்’ என்ற வலியுறுத்திய உறுதி.
  rationale: எபிரேய இறுதித்தொடர் சுருக்கமானதும் பொருள்விவாதத்திற்குரியதும் ஆகும். உடன்படிக்கையின் நேர்மறைச் சூழலோடு பொருந்தும் எதிர்பார்ப்பு வினா முதன்மை உரையில் கொள்ளப்பட்டது; அதன் இலக்கண மாற்று வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
