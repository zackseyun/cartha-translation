  text: But the man who touches them must arm himself with iron and the shaft of a spear[c][b][a], and they must be completely burned with fire in their place.
translation:
  language: ta
  text: ஆனால், அவற்றைத்[c] தொடுகிறவன் இரும்பையும் ஈட்டித் தண்டையும் கொண்டு தன்னை ஆயத்தப்படுத்திக்கொள்ள வேண்டும்[a]; அவை இருக்கும் இடத்திலேயே நெருப்பால் முற்றிலும் எரிக்கப்பட வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரும்பையும் ஈட்டித் தண்டையும் கொண்டு தன்னைப் பொருத்தமாக ஆயத்தப்படுத்திக்கொள்ள வேண்டும்”; சொற்படி, “இரும்பாலும் ஈட்டியின் மரத்தாலும் நிரப்பப்பட வேண்டும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவை அந்த இடத்திலேயே நெருப்பால் நிச்சயமாக எரிக்கப்படும்.” எபிரெய மொழியில் வினையுடன் அதே வேரிலான முற்றிலா வினைவடிவம் சேர்ந்து எரித்தலை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: “அவற்றை” என்பது முந்தைய வசனத்தில் முட்களைப் போலச் சித்தரிக்கப்பட்ட “பயனற்ற மனிதர்களை” குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וְאִישׁ
  choice: ஆனால், ... தொடுகிறவன்
  rationale: אִישׁ இங்கு பொதுவான ஒருமை ஆண்பால் வடிவில், முந்தைய வசனத்தின் முட்களைப் போன்ற பயனற்றவர்களைக் கையாளும் ஒருவனைக் குறிக்கிறது. தொடக்க இணைப்புச் சொல் சூழலிலுள்ள எதிர்மறைத் திருப்பை இயல்பாகக் காட்ட “ஆனால்” என மொழிபெயர்க்கப்பட்டது.
- source_word: יִגַּע בָּהֶם
  choice: அவற்றைத் தொடுகிறவன்
  rationale: נגע என்பதன் நேரடியான பொருள் “தொடு”; ஆபத்தான முட்களின் உருவகத்துக்கும் இது பொருந்துகிறது. பன்மை சுட்டுப்பெயர் முந்தைய வசனத்திலுள்ள பயனற்றவர்களைக் குறிக்கிறது.
- source_word: יִמָּלֵא
  choice: தன்னை ஆயத்தப்படுத்திக்கொள்ள வேண்டும்
  rationale: מלא வினையின் நிஃபால் வடிவம் சொற்படி “நிரப்பப்படுதல்” என்றாலும், இரும்பும் ஈட்டித் தண்டும் போன்ற கருவிகளுடன் வரும் இவ்வமைப்பில் அவற்றைக் கொண்டு தன்னைப் பாதுகாப்பாக ஆயத்தப்படுத்துவதை உணர்த்துகிறது.
- source_word: בַרְזֶל
  choice: இரும்பு
  rationale: எபிரெயச் சொல் பொதுவாக “இரும்பு” என்றே உள்ளது; சூழல் ஓர் இரும்புக் கருவியைச் சுட்டினாலும், மூலத்தில் குறிப்பிடப்படாத குறிப்பிட்ட கருவியை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- source_word: וְעֵץ חֲנִית
  choice: ஈட்டித் தண்டு
  rationale: சொற்படி “ஈட்டியின் மரம்”; இது ஈட்டியின் மரத்தாலான தண்டைக் குறிக்கிறது. “ஈட்டித் தண்டு” தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: וּבָאֵשׁ
  choice: நெருப்பால்
  rationale: ב முன்னிடைச்சொல் இங்கு எரிப்பதற்கான கருவி அல்லது வழிமுறையை உணர்த்துகிறது; தமிழில் “நெருப்பால்” இயல்பாக இதைக் காட்டுகிறது.
- source_word: שָׂרוֹף יִשָּׂרְפוּ
  choice: முற்றிலும் எரிக்கப்பட வேண்டும்
  rationale: வினையெச்சத்தின் வலியுறுத்தல் வடிவமும் முடிவுற்ற வினையும் இணைந்து எரித்தலின் உறுதியையும் தீவிரத்தையும் வலியுறுத்துகின்றன; “முற்றிலும்” அந்த வலியுறுத்தலைத் தெரிவிக்கிறது.
- source_word: בַּשָּׁבֶת
  choice: அவை இருக்கும் இடத்திலேயே
  rationale: அரிதான இவ்வடிவம் இச்சூழலில் “இருக்கும் இடத்தில்” அல்லது “அங்கேயே” என்று இடப்பொருளில் புரிந்துகொள்ளப்படுகிறது. முட்களை அவை இருக்கும் இடத்திலேயே எரிக்கும் உருவகத்தை மொழிபெயர்ப்பு காக்கிறது.
