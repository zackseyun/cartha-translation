  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் கவித்துவமான தீர்க்கவாக்கின் கண்ணியத்தைக் காக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டது. “தன்னை ஆயத்தப்படுத்திக்கொள்ள வேண்டும்” என்பது சொற்படியான “நிரப்பப்பட வேண்டும்” என்பதன் சூழல்சார் பொருளை இயல்பாகத் தருகிறது; சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. மூலத்தின் ஆண்பால் ஒருமை “தொடுகிறவன்” எனக் காக்கப்பட்டுள்ளது.
