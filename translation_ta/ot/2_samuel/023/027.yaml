- source_word: מְבֻנַּי
  choice: மெபுன்னாய்
  rationale: தனிப்பட்ட பெயர் என்பதால் அதன் எபிரெய ஒலிவடிவம் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַחֻשָׁתִי
  choice: ஊசாவைச் சேர்ந்த
  rationale: ஊசா என்ற இடத்துடனோ குலத்துடனோ உள்ள தொடர்பைக் குறிக்கும் வடிவம்; பட்டியலின் இணை அமைப்பைப் பேணும் வகையில் தமிழாக்கப்பட்டது.
