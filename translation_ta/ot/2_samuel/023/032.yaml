translation:
  language: ta
  text: சால்போனைச் சேர்ந்த எல்யக்பா, யாசேனின் மகன்கள், யோனத்தான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இங்கு எபிரெய உரை சுருக்கமாகவும் புரிந்துகொள்ளக் கடினமாகவும் உள்ளது. சொல்லுக்குச் சொல்: “சால்போனைச் சேர்ந்த எல்யக்பா, யாசேனின் மகன்கள், யோனத்தான்.” சில விளக்கவுரையாளர்கள் இங்கு உரை ஒழுங்கின்மை இருப்பதாகக் கருதி, “யோனத்தான்” என்பவரை “யாசேனின் மகன்களில்” ஒருவராக எடுத்துக்கொள்வது போன்ற முறையில் பட்டியலை வேறுவிதமாக அமைக்கின்றனர். இந்த மொழிபெயர்ப்பு உரையைத் திருத்தாமல், எபிரெய உரை நமக்குக் கிடைத்துள்ள வடிவத்தையே பேணுகிறது.'
    reason: textual_variant
