  rationale: இது ‘மகன்’ என்பதன் பன்மை இணைப்புவடிவம். பின்னர் ஒருமைத் தனிப்பெயர் வருவதால் உரை கடினமாக இருந்தாலும், மூலத்தின் பன்மை மாற்றப்படவில்லை.
- source_word: יָשֵׁן
  choice: யாசேன்
  rationale: ‘யாசேனின் மகன்கள்’ என்ற இணைப்பில் வரும் தனிப்பெயராகக் கொண்டு ஒலிபெயர்க்கப்பட்டது; உரைத் திருத்தம் செய்யப்படவில்லை.
- source_word: יְהוֹנָתָן
  choice: யோனத்தான்
  rationale: எபிரெய தனிப்பெயரின் பரவலாக அறியப்பட்ட தமிழ் வேதாகம ஒலிவடிவம் பயன்படுத்தப்பட்டது.
