- source_word: הָאַרְבִּי
  choice: அராபைச் சேர்ந்த
  rationale: அராப் அல்லது அதனுடன் தொடர்புடைய ஓர் இடத்தைச் சேர்ந்தவர் என்பதைக் குறிக்கும் குடிப்பெயர். இடப்பெயரின் அடையாளம் உறுதியற்றதால் அதனை அடிக்குறிப்பில் சுட்டிக்காட்டி, பட்டியலின் சுருக்கமான நடையைப் பேணும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
