  text: Asahel the brother of Joab was among the Thirty[a]; Elhanan son of Dodo of Bethlehem.
translation:
  language: ta
  text: யோவாபின் சகோதரனான ஆசகேல் முப்பது வீரர்களில் ஒருவன்; பெத்லகேமைச் சேர்ந்த தோதோவின்[a] மகன் எல்கானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில், “தோதோ”; 1 நாளாகமம் 11:26-இல் உள்ள இணைப்பகுதி, “தோதாய்” என்று வாசிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲשָׂה אֵל
  choice: ஆசகேல்
  rationale: மெய்யெழுத்து உரையில் பிரித்து எழுதப்பட்டிருந்தாலும், இது அறியப்பட்ட தனிப்பெயரான עֲשָׂהאֵל என்பதைக் குறிக்கிறது; தமிழில் வழக்கமான வேதாகமப் பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אֲחִי יוֹאָב
  choice: யோவாபின் சகோதரனான
  rationale: எபிரெயக் கட்டமைப்பு யோவாபுடனான சகோதர உறவை நேரடியாகக் குறிக்கிறது; பட்டியலின் தொடருக்கு இயல்பான தமிழாக்கம்.
- source_word: בַּשְּׁלֹשִׁים
  choice: முப்பது வீரர்களில் ஒருவன்
  rationale: ב முன்னொட்டு, ‘முப்பது பேர்’ என அறியப்பட்ட தாவீதின் தேர்ந்த வீரர் குழுவில் உறுப்பினராக இருந்ததைக் குறிக்கிறது; ‘வீரர்கள்’ என்பது சூழலில் உள்ளார்ந்த தகவலைத் தெளிவாக்குகிறது.
- source_word: אֶלְחָנָן
  choice: எல்கானான்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் அறியப்பட்ட வேதாகம வடிவம்.
- source_word: בֶּן דֹּדֹו
  choice: தோதோவின் மகன்
  rationale: மசோரா உரையின் דֹּדֹו என்ற தனிப்பெயர் மொழிபெயர்ப்பில் பாதுகாக்கப்பட்டது; நாளாகம இணைப்பகுதியின் மாற்று வடிவம் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: בֵּית לָחֶם
  choice: பெத்லகேமைச் சேர்ந்த
  rationale: இந்த வம்சவழிப் பட்டியல் சூழலில் அந்த நபரின் ஊரைக் குறிக்கும் இயல்பான, தெளிவான தமிழ் வடிவம்.
