translation_notes:
  register: நவீன நிலையான தமிழில், வீரர் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. மூலத்தின் பட்டியல் அமைப்பைப் பேண அரைப்புள்ளி இடப்பட்டது; மாற்று வாசகம் முதன்மை உரையுடன் ஒத்திசைக்கப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
