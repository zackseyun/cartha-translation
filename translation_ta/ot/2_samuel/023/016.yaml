source:
  edition: WLC
  text: וַ/יִּבְקְעוּ֩ שְׁלֹ֨שֶׁת הַ/גִּבֹּרִ֜ים בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בֹּ֤אר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑ד וְ/לֹ֤א אָבָה֙ לִ/שְׁתּוֹתָ֔/ם וַ/יַּסֵּ֥ךְ אֹתָ֖/ם לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/016.yaml
  text: Then the three mighty men broke through the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But he was not willing to drink it; instead[b], he poured it out to Yahweh.
translation:
  language: ta
  text: அப்போது அந்த மூன்று மாவீரர்களும் பெலிஸ்தியர்களின் முகாமை உடைத்துக்கொண்டு சென்று, நகர்வாயிலில் இருந்த பெத்லகேமின் கிணற்றிலிருந்து தண்ணீர் எடுத்து, அதைச் சுமந்து தாவீதிடம் கொண்டுவந்தார்கள். ஆனால் அதைக் குடிக்க அவர் விரும்பவில்லை; அதற்குப் பதிலாக, அதை யாவேக்கென்று ஊற்றிவிட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அவற்றை’ என்று பன்மைச் சுட்டுவிகுதி உள்ளது; அது தண்ணீரைக் குறிக்கும் வழக்கமான பன்மைப் பயன்பாடாக இருக்கலாம். ‘ஊற்றிவிட்டார்’ என்பதற்கு யாவேக்கு ஒரு திரவக் காணிக்கையை ஊற்றுவது போன்ற நுணுக்கமும் உள்ளது.
    reason: lexical_alternative; cultural_note
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: முகாமை உடைத்துக்கொண்டு சென்று
  rationale: இந்த வினை எதிரியின் நிலையைப் பிளந்து அல்லது தடையை மீறி முன்னேறுவதைக் குறிக்கிறது; இராணுவச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: அந்த மூன்று மாவீரர்கள்
  rationale: גִּבּוֹרִים என்பது தாவீதின் சிறப்புப் போர்வீரர்களைக் குறிக்கும் பெயர்ப்போன்ற பயன்பாடு; ‘மாவீரர்கள்’ அதன் வலிமையையும் சிறப்புநிலையையும் காக்கிறது.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: பெலிஸ்தியர்களின் முகாம்
  rationale: பெலிஸ்தியர்களுக்குச் சொந்தமான இராணுவ முகாமை நேரடியாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: தண்ணீர் மொண்டு
  rationale: கிணற்றிலிருந்து தண்ணீர் எடுக்கும் செயலைத் தமிழில் இயல்பாகவும் துல்லியமாகவும் கூறுகிறது.
- source_word: מִבֹּאר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: நுழைவாயிலருகே இருந்த பெத்லெகேமின் கிணற்றிலிருந்து
  rationale: கிணறு பெத்லெகேமுடன் தொடர்புடையது என்பதையும் அது நகர நுழைவாயிலருகே இருந்தது என்பதையும் பாதுகாக்கிறது.
- source_word: וַיִּשְׂאוּ וַיָּבִאוּ אֶל דָּוִד
  choice: அதைச் சுமந்து தாவீதிடம் கொண்டுவந்தார்கள்
  rationale: தண்ணீரை எடுத்துச் சுமந்து தாவீதிடம் சேர்த்த இரு தொடர்ச்சியான செயல்களையும் வெளிப்படுத்துகிறது.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: அவர் அதைக் குடிக்க மனமில்லாமல்
  rationale: אָבָה என்பதிலுள்ள விருப்பம் அல்லது மனச்சம்மதம் இல்லாமை என்ற நுணுக்கத்தைப் பாதுகாக்கிறது; தமிழில் தண்ணீர் ஒருமையாகக் குறிப்பிடப்படுகிறது.
- source_word: וַיַּסֵּךְ אֹתָם
  choice: அதை ஊற்றிவிட்டார்
  rationale: திரவத்தை ஊற்றிய நேரடியான செயலை முதன்மை உரையில் வைக்கிறது; வினையின் காணிக்கை சார்ந்த பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கென்று
  rationale: எபிரெய மூலத்தில் உள்ள கடவுளின் தனிப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்த்து, அந்தச் செயல் அவருக்கென அர்ப்பணிக்கப்பட்டது என்பதைக் காட்டுகிறது.
theological_decisions:
- issue: தாவீது தண்ணீரை ஊற்றிய செயலின் தன்மை
  choice: யாவேக்கென்று தண்ணீரை நேரடியாக ஊற்றியதாக மொழிபெயர்த்து, காணிக்கை போன்ற சடங்கு நுணுக்கத்தை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: சடங்கு அல்லது அர்ப்பணிப்பு சார்ந்த பொருள் எதுவுமில்லாத வெறும் அடையாளச் செயலாகக் கருதுதல்
  rationale: נסך என்ற வினைக்கு திரவக் காணிக்கையை ஊற்றும் சடங்குப் பொருள் அடிக்கடி உண்டு. எனினும் இங்கே அது முறையான பலிச் சடங்கு என்று முதன்மை உரையில் அளவுக்கு மீறித் தீர்மானிக்காமல், நேரடிச் செயலையும் அதன் இறையியல் நுணுக்கத்தையும் இரண்டையும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வரலாற்றுக் கதைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘யாவே’ என்பது יהוה என்ற தனிப்பெயரின் ஒலிபெயர்ப்பு; ‘மாவீரர்கள்’ என்பது தாவீதின் சிறப்புப் போர்வீரர்களைக் குறிக்கும் பெயர்ப்போன்ற பயன்பாட்டைத் தக்கவைக்கிறது.
