  text: ר֥וּחַ יְהוָ֖ה דִּבֶּר בִּ֑/י וּ/מִלָּת֖/וֹ עַל לְשׁוֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/002.yaml
  text: The Spirit of Yahweh spoke by me[a], and his word was on my tongue.
translation:
  language: ta
  text: யாவேயின் ஆவி என் மூலமாகப் பேசினார்[a]; அவருடைய வார்த்தை என் நாவில் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னில் பேசினார்.” இங்குள்ள எபிரெய முன்னிடைச்சொல் ‘என்னில்’ அல்லது ‘என் மூலமாக’ என்ற பொருளைத் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֥וּחַ יְהוָ֖ה
  choice: யாவேயின் ஆவி
  rationale: தெய்வீக வெளிப்பாட்டுப் பேச்சைச் சுட்டும் இச்சூழலில் רוּחַ என்பதற்கு ‘ஆவி’ என்பதே பொருத்தமானது; יְהוָה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: דִּבֶּר
  choice: பேசினார்
  rationale: דבר இங்கு ‘பேசுதல்’ என்று பொருள்படுகிறது. எபிரெயக் கவிதையின் இறந்தகாலக் கூற்றை இயல்பான தமிழில் தருகிறது.
- source_word: בִּי
  choice: என் மூலமாக
  rationale: בְּ முன்னிடைச்சொல் இங்கு கருவி அல்லது ஊடகப் பொருளைக் கொண்டிருக்கலாம். இணையான அடுத்த கூற்றுடன் பார்க்கையில் ‘என் மூலமாக’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது; ‘என்னில்’ என்ற இடப்பொருளும் இலக்கண ரீதியாகச் சாத்தியம் என்பதால் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: וּמִלָּתוֹ
  choice: அவருடைய வார்த்தை
  rationale: מִלָּה என்பது ‘வார்த்தை’ அல்லது ‘உரை’ எனப் பொருள்படும். ‘வார்த்தை’ மூலத்தின் சொல்லாட்சியையும் தெய்வீகப் பேச்சின் நிறையையும் காக்கிறது.
- source_word: עַל לְשׁוֹנִי
  choice: என் நாவில் இருந்தது
  rationale: ‘என் நாவின்மேல்’ என்ற எபிரெய உருவகத்தை, அதன் பொருளையும் படிமத்தையும் காக்கும் இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் நான்கெழுத்துத் தெய்வீகப் பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரை வெளிப்படையாகக் காக்கிறது.
- issue: רוּחַ என்பதை ஆள்தன்மையற்ற ‘காற்று/மூச்சு’ என்றா, ‘ஆவி’ என்றா தருவது
  choice: ஆவி
  alternative: மூச்சு; காற்று
  rationale: தாவீதின் தீர்க்கதரிசன உரையை யாவே பேசுவதாகச் சொல்லும் இச்சூழல் தெய்வீகச் செயலாற்றலைக் குறிக்கிறது. ஆகவே ‘ஆவி’ என்பது சூழலின் நேரடியான பொருளைத் தருகிறது; பின்னாளைய முழுமையான கோட்பாட்டு விளக்கத்தை வசனத்திற்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை. மூலத்தின் கவித்துவ இணைமொழி அமைப்பும் ‘நாவில்’ என்ற உருவகமும் காக்கப்பட்டுள்ளன.
