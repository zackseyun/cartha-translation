- source_word: הַחֲרֹדִי
  choice: ஆரோத்தைச் சேர்ந்த
  rationale: மூலத்தில் மீண்டும் வரும் அதே அடைமொழி, பெயர்ப்பட்டியலின் இணை அமைப்பைப் பேணும் வகையில் ஒரேபோல மொழிபெயர்க்கப்பட்டது.
