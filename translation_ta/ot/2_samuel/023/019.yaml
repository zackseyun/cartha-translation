  text: מִן הַ/שְּׁלֹשָׁה֙ הֲ/כִ֣י נִכְבָּ֔ד וַ/יְהִ֥י לָ/הֶ֖ם לְ/שָׂ֑ר וְ/עַד הַ/שְּׁלֹשָׁ֖ה לֹא בָֽא־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/019.yaml
  text: Was he not more honored than the three? So he became their commander[b][a], but he did not attain to the three.
translation:
  language: ta
  text: அந்த மூவரைவிட அவன் அதிக மதிப்புப் பெற்றவன் அல்லவா?[a] அதனால் அவன் அவர்களுக்குத் தளபதியானான். ஆனாலும் அந்த மூவரின் நிலையை அவன் எட்டவில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த மூவரில் அவன் மதிப்புப் பெற்றவன் அல்லவா?” எபிரெயச் சொற்றொடரை ஒப்பீடு குறைவாகவும் புரிந்துகொள்ளலாம்; எனினும், அதன் இலக்கண அமைப்புக்கும் சுற்றியுள்ள இணையான பகுதிக்கும் “மூவரைவிட” என்ற ஒப்பீட்டுப் பொருள் நன்றாகப் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, தாவீதின் மாவீரர்களில் மிக உயர்ந்த பிரிவாகிய “அந்த மூவரின்” பதவியையோ மதிப்புநிலையையோ அவன் அடையவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: מִן הַשְּׁלֹשָׁה
  choice: அந்த மூவரைவிட
  rationale: נִכְבָּד என்பதுடன் வரும் מִן ஒப்பீட்டுப் பொருளில் இயல்பாகப் புரிகிறது. எனவே, ஒரு குழுவுக்குள் ஒருவன் என்பதைக் காட்டுவதற்குப் பதிலாக, அறியப்பட்ட அந்த மூவருடன் செய்யப்படும் ஒப்பீட்டைத் தமிழ் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הֲכִי
  choice: அல்லவா?
  rationale: הֲ உடன் வரும் כי, ஆம் என்ற பதிலை எதிர்பார்க்கும் வினாவை உருவாக்குகிறது. தமிழில் வாக்கிய முடிவிலுள்ள ‘அல்லவா?’ இதன் சொல்லாட்சிச் சக்தியை இயல்பாகத் தருகிறது.
- source_word: נִכְבָּד
  choice: அதிக மதிப்புப் பெற்றவன்
  rationale: כבד என்பதன் நிஃபால் வடிவம் இங்கு மதிக்கப்படுதல் அல்லது உயர்வாகக் கருதப்படுதல் என்பதைக் குறிக்கிறது. ஒப்பீட்டுக் கட்டமைப்பை வெளிப்படுத்த ‘அதிக’ சேர்க்கப்பட்டுள்ளது.
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: அதனால் அவன் அவர்களுக்குத் தளபதியானான்
  rationale: שַׂר என்பது தலைவர், தலைவன் அல்லது தளபதி எனப் பொருள்படும். வீரர்களைப் பற்றிய இச்சூழலில் ‘தளபதி’ இயல்பான இராணுவச் சொல்லாகும்; தொடரின் விளைவுத் தொடர்பை ‘அதனால்’ வெளிப்படுத்துகிறது.
- source_word: וְעַד הַשְּׁלֹשָׁה לֹא בָא
  choice: ஆனாலும் அந்த மூவரின் நிலையை அவன் எட்டவில்லை
  rationale: சொல்லுக்குச் சொல் ‘மூவரிடம் வரவில்லை’ என்றாலும், இச்சொற்றொடர் உடல்சார்ந்த வருகையை அல்லாமல் அவர்களுடைய தகுதி அல்லது தரநிலையை அடையாததைக் குறிக்கிறது. ‘நிலையை எட்டவில்லை’ என்பது அந்தப் பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
