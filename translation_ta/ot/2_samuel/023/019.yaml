translation_notes:
  register: நவீனத் தரத்தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் மரியாதையும் சுருக்கமும் காக்கப்பட்டுள்ளன. மூலத்தின் ஒப்பீட்டு வினாவும், ஒருபுறம் தளபதியாக இருந்தும் மறுபுறம் ‘மூவரின்’ நிலையை எட்டாத பதற்றமும் தீர்த்துவிடப்படாமல் அப்படியே வைக்கப்பட்டுள்ளன.
