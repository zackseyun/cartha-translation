  text: מִן הַ/שְּׁלֹשִׁ֣ים נִכְבָּ֔ד וְ/אֶל הַ/שְּׁלֹשָׁ֖ה לֹא בָ֑א וַ/יְשִׂמֵ֥/הוּ דָוִ֖ד אֶל מִשְׁמַעְתּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/023.yaml
  text: He was honored among the thirty[a], but he did not attain to the three[c][b]; and David appointed him over his bodyguard.
translation:
  language: ta
  text: முப்பது பேரில் அவன் மதிப்புப் பெற்றவனாக இருந்தான்[a]; ஆனால் அந்த மூவரின் நிலையை அவன் எட்டவில்லை[b]. தாவீது அவனைத் தன் மெய்க்காவற்படைக்குத் தலைவனாக நியமித்தான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முப்பது பேரைவிட அவன் அதிக மதிப்புப் பெற்றிருந்தான்.” எபிரெயச் சொற்றொடரை ஒரு குழுவினுள் அவனுக்கிருந்த இடத்தைக் குறிப்பதாகவோ, அந்தக் குழுவுடன் ஒப்பிடுவதாகவோ புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “ஆனால் அந்த மூவரிடம் அவன் வரவில்லை”; அதாவது, சிறப்புமிக்க அந்த மூன்று வீரர்களின் தரத்தை அவன் அடையவில்லை.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், “அவனுடைய மிஷ்மாஅத்திற்கு.” இச்சொல் “அவனுடைய கட்டளை அல்லது பொறுப்புக்கு” அல்லது “அவனுடைய காவற்படைக்கு” என்று பொருள்படலாம். சூழலுக்கு ஏற்ற இராணுவப் பொருளை “மெய்க்காவற்படை” பிரதிபலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלֹשִׁים
  choice: முப்பது பேரில்
  rationale: מִן இங்கு ஒரு குழுவினுள் அவனுக்கிருந்த இடத்தைக் குறிக்கலாம். ஒப்பீட்டுப் பொருளான ‘முப்பது பேரைவிட’ என்பதும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: נִכְבָּד
  choice: மதிப்புக்குரியவனாக இருந்தான்
  rationale: כבד என்பதன் நிஃபால் வடிவம் மதிக்கப்படுதல் அல்லது உயர்வாகக் கருதப்படுதல் என்னும் செயப்பாட்டு நுணுக்கத்தைக் கொண்டுள்ளது; இத்தமிழாக்கம் அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְאֶל הַשְּׁלֹשָׁה לֹא בָא
  choice: ஆனால் அந்த மூவரின் நிலையை அவன் எட்டவில்லை
  rationale: בוא + אֶל இச்சூழலில் அந்தச் சிறப்புமிக்க மூவரின் தகுதி அல்லது தரத்தை அடைவதைக் குறிக்கும் மரபுத்தொடராக உள்ளது.
- source_word: וַיְשִׂמֵהוּ
  choice: தாவீது அவனை ... நியமித்தான்
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வைத்தல்’; பொறுப்பு அளிக்கும் இச்சூழலில் ‘நியமித்தான்’ என்பது இயல்பான நிர்வாகப் பொருளைத் தருகிறது.
- source_word: אֶל מִשְׁמַעְתּוֹ
  choice: தன் மெய்க்காவற்படைக்குத் தலைவனாக
  rationale: מִשְׁמַעַת கட்டளை, அதிகாரத்தின் கீழுள்ளோர், அல்லது காவற்படை ஆகியவற்றைக் குறிக்கலாம். தாவீதின் இராணுவ அரசவைச் சூழலில் தனிப்பட்ட காவற்படை என்பது சாத்தியமான பொருள்; ‘தலைவனாக’ என்பது அவன் அதன்மேல் நியமிக்கப்பட்டதைக் காட்டுகிறது.
