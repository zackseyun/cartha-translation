  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வீரர்களின் தரவரிசை குறித்த மூலத்தின் சுருக்கமான மொழி இயல்பாக்கப்பட்டாலும், ‘முப்பது பேர்,’ ‘மூவர்,’ மற்றும் מִשְׁמַעַת ஆகியவற்றிலுள்ள உண்மையான பொருள் நிச்சயமின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
