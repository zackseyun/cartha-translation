base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/006.yaml
  text: But worthless men are all like thorns cast aside[a], for they cannot be taken with the hand.
translation:
  language: ta
  text: ஆனால் பயனற்றவர்கள் எல்லாரும் தூக்கி எறியப்பட்ட முட்களைப் போன்றவர்கள்[a]; ஏனெனில் அவற்றைக் கையால் பிடிக்க முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு எபிரெயச் சொல்லான “பெலியால்” என்பது பிற்காலத்தில் வந்த தனிப்பெயரைக் குறிக்காமல், ‘பயனற்ற’ அல்லது ‘பொல்லாத’ மனிதர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְלִיַּעַל
  choice: ஆனால் பயனற்றவர்கள்
  rationale: இங்கு בְּלִיַּעַל என்பது பிற்காலத் தனிப்பெயரான ‘பெலியால்’ என்பதைக் குறிக்காமல், பயனற்ற அல்லது பொல்லாத மனிதர்களைக் குறிக்கிறது. பன்மைச் சுட்டும் தொடரமைப்புக்கு ஏற்ப ‘வர்கள்’ பயன்படுத்தப்பட்டது.
- source_word: כְּקוֹץ
  choice: முட்களைப் போன்றவர்கள்
  rationale: எபிரெயத்தில் ஒருமை வடிவம் இருந்தாலும், அது கூட்டுப்பொருளில் பன்மையான மனிதர்களுக்கு உவமையாக வருகிறது; தமிழில் ‘முட்கள்’ இயல்பாக உள்ளது.
- source_word: מֻנָד
  choice: தூக்கி எறியப்பட்ட
  rationale: விலக்கித் தள்ளப்பட்ட அல்லது அகற்றப்பட்ட ஒன்றைச் சுட்டும் செயப்பாட்டு வினையெச்சத்தின் பொருளையும், முட்களின் உருவகத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כֻּלָּהַם
  choice: எல்லாரும்
  rationale: மனிதர்களைக் குறிக்கும் பன்மைத் தொகுதியின் முழுமையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய உவமைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: לֹא בְיָד יִקָּחוּ
  choice: அவற்றைக் கையால் பிடிக்க முடியாது
  rationale: முட்களை வெறும் கையால் கையாள இயலாத நடைமுறைச் சாத்தியமின்மையை இயல்பான தமிழில் தெரிவிக்கிறது; ‘அவற்றை’ என்பது அருகிலுள்ள முட்களையே குறிக்கிறது.
theological_decisions:
- issue: בְּלִיַּעַל என்பதைத் தனிப்பெயராகப் புரிந்துகொள்ளலாமா?
  choice: பயனற்றவர்கள்
  alternative: பெலியால்
  rationale: இந்தச் சூழலில் சொல் மனிதர்களின் தீய அல்லது பயனற்ற தன்மையைக் குறிக்கிறது; பிற்காலத்தில் உருவான ஆளுருவத் தனிப்பெயரை இங்கு இறக்குமதி செய்யக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கவித்துவ உவமையைப் பேணும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. மனிதர்களுக்கும் முட்களுக்கும் இடையிலான இலக்கண வேறுபாடு தெளிவாக இருக்க ‘எல்லாரும்’ மற்றும் பின்னர் ‘அவற்றை’ பயன்படுத்தப்பட்டன.
