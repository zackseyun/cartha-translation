  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நீள்வட்ட அமைப்பை முற்றிலும் கரைக்காமல் வாசிப்புத் தெளிவுக்காக ‘அவர்’ மற்றும் ‘முளைக்கும்’ சேர்க்கப்பட்டுள்ளன; இறுதி பகுதியின் உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
