  text: he is like the light of morning when the sun rises[a], a morning without clouds; from brightness, from rain[b], grass from the earth.
translation:
  language: ta
  text: அவர் சூரியன் உதிக்கும் காலையின் ஒளியைப் போன்றவர்[a]—மேகமற்ற காலை; ஒளிவீச்சிலிருந்தும் மழையிலிருந்தும் பூமியிலிருந்து முளைக்கும் பசும்புல்லைப் போன்றவர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல் நெருக்கமாக, ‘காலையின் ஒளியைப் போலவும்.’ எபிரெயச் செய்யுள் சுருக்கமானது; முந்தைய வசனத்தில் கூறப்பட்ட ஆட்சியாளரின் வர்ணனையை இது தொடர்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘ஒளிவீச்சிலிருந்து, மழையிலிருந்து, பூமியிலிருந்து பசும்புல்.’ இது மழைக்குப் பின் வெளிச்சத்தில் புதிதாக முளைக்கும் பசுமையைச் சித்தரிக்கும் சுருக்கமான கவிதைப் படிமமாக இருக்கலாம்; சொற்களுக்கிடையிலான உறவு முழுமையாக வெளிப்படுத்தப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְאוֹר
  choice: அவர் ... ஒளியைப் போன்றவர்
  rationale: எபிரெயச் செய்யுள் வினையற்றதாகவும் முந்தைய வசனத்திலுள்ள நீதியுள்ள ஆட்சியாளரைத் தொடர்ந்து வர்ணிப்பதாகவும் உள்ளது. இயல்பான தமிழுக்காக மறைமுக எழுவாய் வெளிப்படுத்தப்பட்டது; இணைப்புச் சொல்லின் இருப்பு அடிக்குறிப்பில் சுட்டப்பட்டது.
- source_word: בֹּקֶר
  choice: காலை
  rationale: இரு இடங்களிலும் ஒரே இயல்பான சொல்லைப் பயன்படுத்தி கவிதை இணைநிலையைப் பேணுகிறது.
- source_word: יִזְרַח שָׁמֶשׁ
  choice: சூரியன் உதிக்கும்
  rationale: זרח என்பதன் ஒளிர்தல்/உதித்தல் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בֹּקֶר לֹא עָבוֹת
  choice: மேகங்களற்ற காலை
  rationale: எபிரெய மூலத்தின் மேகமில்லாத காலைப் படிமத்தைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: מִנֹּגַהּ
  choice: ஒளிவீச்சிலிருந்து
  rationale: נֹגַהּ என்பதன் பிரகாசம் அல்லது ஒளிவீச்சு என்ற பொருளையும் מִן முன்னொட்டையும் வெளிப்படையாகக் காக்கிறது.
- source_word: מִמָּטָר
  choice: மழையிலிருந்து
  rationale: சுருக்கமான செய்யுளில் உள்ள מִן முன்னொட்டைத் தீர்மானித்து மாற்றாமல் நேரடியாகப் பேணுகிறது; நிகழ்வுக்குப் பிந்தைய பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: דֶּשֶׁא
  choice: பசும்புல்
  rationale: புதிதாகத் துளிர்க்கும் பசுமையான புல் அல்லது செடிவளர்ச்சியின் படிமத்தை பொதுவாகப் புரியும் தமிழில் தருகிறது.
- source_word: מֵאָרֶץ
  choice: பூமியிலிருந்து முளைக்கும்
  rationale: மூலத்தில் உள்ள 'பூமியிலிருந்து' என்பதைப் பேணி, தமிழில் கவிதைப் படிமத்தின் தொடர்பைத் தெளிவாக்க 'முளைக்கும்' வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: உவமையின் மறைமுக எழுவாய்
  choice: முந்தைய வசனத்திலுள்ள நீதியுள்ள ஆட்சியாளரைக் குறிக்கும் வகையில் ‘அவர்’ என்று வெளிப்படுத்தப்பட்டது.
  alternative: ‘காலையின் ஒளியைப் போலவும்’ என்ற எழுவாயற்ற செய்யுள் துணுக்காக விடுதல்.
  rationale: எபிரெயம் நீள்வட்டமான செய்யுள் அமைப்பைக் கொண்டிருந்தாலும் உடனடிச் சூழல் குறிப்பிடும் நபர் தெளிவாக இருக்கிறார். ‘அவர்’ என்பது புதிய இறையியல் கருத்தைச் சேர்க்காமல் தமிழில் பொருளைத் தெளிவாக்குகிறது.
- issue: இறுதி செய்யுள் உறுப்புகளின் தொடர்பு
  choice: ‘ஒளிவீச்சிலிருந்தும் மழையிலிருந்தும் ... பசும்புல்’ என்ற மூலத்தின் சுருக்கத்தையும் இரு מִן முன்னொட்டுகளையும் காத்து, புல் முளைப்பதை வெளிப்படுத்துதல்.
  alternative: ‘மழைக்குப் பின் தெளிந்த ஒளியால் பூமியிலிருந்து முளைக்கும் பசும்புல்’ என்று காரண அல்லது காலத் தொடர்பைத் தெளிவாக நிர்ணயித்தல்.
  rationale: எபிரெயச் செய்யுள் இலக்கணத் தொடர்பை முழுமையாக வெளிப்படுத்தாமல் சுருக்கமாக உள்ளது. மொழிபெயர்ப்பு அந்த உண்மையான தெளிவின்மையைப் பேணுகிறது; சாத்தியமான இயற்கைப் படிமம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: இறுதி உவமையின் தொடர்பு
  choice: தமிழில் ‘போன்றவர்’ என்று நிறைவு செய்து ஆட்சியாளரைப் பசும்புல் படிமத்துடனும் தொடர்புபடுத்துதல்.
  alternative: ‘பூமியிலிருந்து பசும்புல்’ என்ற பெயர்ச்சொல் துணுக்காக முடித்தல்.
  rationale: மூலத்தின் இறுதி பகுதி மிகச் சுருக்கமானது. தமிழில் வாசிக்கத்தக்க வாக்கியமாக்க இந்தத் தொடர்பு வெளிப்படுத்தப்பட்டது; ஆயினும் அடிக்குறிப்பு மூல அமைப்பைத் தெரிவிக்கிறது.
