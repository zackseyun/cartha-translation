lexical_decisions:
- source_word: צַלְמוֹן
  choice: சல்மோன்
  rationale: எபிரேய மெய்யெழுத்து வடிவை நெருக்கமாகப் பின்பற்றும் தனிப்பெயர் ஒலிபெயர்ப்பு; தமிழில் இயல்பாக வாசிக்க ‘சல்மோன்’ பயன்படுத்தப்பட்டது.
- source_word: הָאֲחֹחִי
  choice: அகோகியனான
  rationale: குறிப்பிட்ட குலம் அல்லது வம்சச் சார்பைக் காட்டும் எபிரேய இனப்பெயரடை வடிவத்தையும் பட்டியல் நடையையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: מַהְרַי
  choice: மகராய்
  rationale: எபிரேய தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: הַנְּטֹפָתִי
  choice: நெத்தோபாத்தியனான
  rationale: நெத்தோபா ஊர் அல்லது அங்குள்ள குலத்துடனான தொடர்பைக் குறிக்கும் இனப்பெயரடை வடிவத்தைப் பாதுகாக்கிறது.
