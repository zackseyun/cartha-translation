translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. எபிரெய மரபுத்தொடரின் நேர்ப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; உரைவேறுபாட்டு சிக்கலும் தீர்மானித்து மறைக்கப்படாமல் குறிப்பிடப்பட்டுள்ளது.
