base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/022.yaml
  text: These things Benaiah son of Jehoiada did[b][a], and he had a name among the three mighty men.
translation:
  language: ta
  text: யெகோயாதாவின் மகன் பெனாயா இவற்றைச் செய்தான்[b]; மூன்று மாவீரர்களிடையே அவனுக்குப் புகழ் இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அவனுக்கு ஒரு பெயர் இருந்தது.” இது அவனுக்குப் புகழ் அல்லது நற்பெயர் இருந்தது என்று பொருள்படும் எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: b
    text: தாவீதின் போர்வீரர்களின் விரிவான பட்டியலைக் கருத்தில் கொண்டு, சிலர் இங்கு “முப்பது” என்பதுடன் தொடர்புடைய வாசகத்தை முன்வைக்கின்றனர்; ஆனால் இங்குள்ள எபிரெய உரை “மூன்று” என்றே வாசிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: இவற்றைச் செய்தான்
  rationale: முன்பு விவரிக்கப்பட்ட பெனாயாவின் வீரச்செயல்களைச் சுட்டும் எபிரெய மறுதொடக்க அமைப்பை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: யெகோயாதாவின் மகன் பெனாயா
  rationale: எபிரெய கட்டமைப்பு உறவை இயல்பான தமிழ் உடைமைத் தொடரால் வெளிப்படுத்தி, பெயர்களை ஒலிபெயர்க்கிறது.
- source_word: וְלוֹ שֵׁם
  choice: அவன் புகழ்பெற்றிருந்தான்
  rationale: சொல்லுக்குச் சொல் 'அவனுக்கு ஒரு பெயர் இருந்தது' என்றாலும், இச்சூழலில் இது புகழ் அல்லது நற்பெயரைக் குறிக்கும் எபிரெய மரபுத்தொடர்; அதன் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בִּשְׁלֹשָׁה הַגִּבֹּרִים
  choice: மூன்று மாவீரர்களில்
  rationale: மசோரா எபிரெய உரையில் உள்ள 'மூன்று' என்பதைக் காத்து, தாவீதின் தேர்ந்த போர்வீரர்களைக் குறிக்கும் הַגִּבֹּרִים என்பதற்கு சுருக்கமான, கண்ணியமான தமிழை வழங்குகிறது.
