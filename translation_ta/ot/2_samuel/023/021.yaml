  yaml_path: translation/ot/2_samuel/023/021.yaml
  text: He also struck down an Egyptian[a], a man of impressive appearance. The Egyptian had a spear in his hand, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[b], and killed him with his own spear.
translation:
  language: ta
  text: அவர் மேலும், குறிப்பிடத்தக்க தோற்றமுடைய ஓர் எகிப்தியனைத் தாக்கினார். அந்த எகிப்தியனின் கையில் ஓர் ஈட்டி இருந்தது; அவர் ஒரு கோலுடன் அவனிடம் இறங்கிச் சென்று, எகிப்தியனின் கையிலிருந்த ஈட்டியைப் பறித்தெடுத்து, அவனுடைய சொந்த ஈட்டியாலேயே அவனைக் கொன்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִכָּה
  choice: தாக்கினார்
  rationale: נכה என்பதன் அடிப்படைப் பொருளான ‘அடி/தாக்கு’ என்பதைத் தக்கவைக்கிறது; வசனத்தின் இறுதியில் வரும் ‘கொன்றார்’ என்ற தனிப்பட்ட செயலை முன்னதாகவே கலந்து விடுவதில்லை.
- source_word: אִישׁ מִצְרִי
  choice: ஓர் எகிப்தியன்
  rationale: இன அடையாளத்தை நவீன தமிழில் இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: אשר מַרְאֶה
  choice: குறிப்பிடத்தக்க தோற்றமுடைய
  rationale: מַרְאֶה குறிக்கும் வெளித்தோற்றத்தைப் பாதுகாத்து, அழகு அல்லது உயரம் என்று தேவையின்றிக் குறிப்பாக்காமல் விடுகிறது.
- source_word: וּבְיַד הַמִּצְרִי חֲנִית
  choice: அந்த எகிப்தியனின் கையில் ஓர் ஈட்டி இருந்தது
  rationale: எபிரெய உடைமைக் கட்டமைப்பை இயல்பான தமிழில் தெளிவாக வழங்குகிறது.
- source_word: וַיֵּרֶד אֵלָיו
  choice: அவனிடம் இறங்கிச் சென்று
  rationale: ירד என்பதிலுள்ள கீழ்நோக்கிய இயக்கத்தைத் தக்கவைத்து, தமிழில் புரியத்தக்க தொடர் வினையாக அளிக்கிறது.
- source_word: בַּשָּׁבֶט
  choice: ஒரு கோலுடன்
  rationale: שֵׁבֶט இங்கு கையில் ஏந்தப்படும் கோல், தடி அல்லது கழி எனப் பொருள்படலாம்; ‘கோல்’ மிகக் குறைவாக விளக்கமளிக்கும் பரந்த தேர்வு.
- source_word: וַיִּגְזֹל
  choice: பறித்தெடுத்து
  rationale: גזל என்பதிலுள்ள வலுக்கட்டாயமாகப் பிடுங்கும் செயலையும் போரின் வேகத்தையும் வெளிப்படுத்துகிறது.
- source_word: וַיַּהַרְגֵהוּ
  choice: அவனைக் கொன்றார்
  rationale: הרג என்பதன் நேரடியான, தெளிவான நவீனத் தமிழ் மொழிபெயர்ப்பு.
- source_word: בַּחֲנִיתוֹ
  choice: அவனுடைய சொந்த ஈட்டியாலேயே
  rationale: பின்னொட்டு இயல்பாக எகிப்தியனைக் குறிக்கிறது; அவனிடமிருந்து பறிக்கப்பட்ட அதே ஈட்டியால் அவன் கொல்லப்பட்ட திருப்பத்தைத் தெளிவாக்குகிறது.
- source_word: וְהוּא
  choice: அவர் மேலும்
  rationale: முந்தைய வீரச்செயல்களின் பட்டியலைத் தொடரும் இணைப்புப் பொருளை இயல்பான தமிழில் காட்டுகிறது.
