  text: וַ/יִּתְאַוֶּ֥ה דָוִ֖ד וַ/יֹּאמַ֑ר מִ֚י יַשְׁקֵ֣/נִי מַ֔יִם מִ/בֹּ֥אר בֵּֽית לֶ֖חֶם אֲשֶׁ֥ר בַּ/שָּֽׁעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/015.yaml
  text: And David longed and said[a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: ta
  text: தாவீது ஏக்கத்துடன், “வாசலருகே இருக்கிற பெத்லெகேம் கிணற்றிலிருந்து யார் எனக்குக் குடிக்கத் தண்ணீர் கொடுப்பார்?” என்று சொன்னார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, கருத்தை இன்னும் இயல்பாக வெளிப்படுத்தினால்: “வாசலருகே இருக்கிற பெத்லெகேம் கிணற்றிலிருந்து யாராவது எனக்குக் குடிக்கத் தண்ணீர் கொடுத்தால் எவ்வளவு நன்றாயிருக்கும்!” எபிரெய மொழியில் “யார் ... கொடுப்பார்?” என்ற கேள்வி ஏக்கத்தை வெளிப்படுத்துகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַוֶּה
  choice: ஏக்கத்துடன்
  rationale: התפעל வடிவிலுள்ள אוה வலுவான விருப்பத்தையோ ஏக்கத்தையோ குறிக்கிறது. தமிழில் இயல்பான வாக்கிய அமைப்புக்காக வினையடைத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: וַיֹּאמַר
  choice: சொன்னார்
  rationale: இது பொதுவாக ‘சொல்’ எனப் பொருள்படும் வினை. மூலத்தில் தனக்குள் சொன்னார் அல்லது உரக்கக் கூறினார் என்று வெளிப்படையாக இல்லாததால் எளிய வடிவம் வைக்கப்பட்டது.
- source_word: מִי
  choice: யார் ... கொடுப்பார்?
  rationale: ‘யார்?’ என்ற எபிரெயக் கேள்வி வடிவம் இங்கு ஏக்கத்தை வெளிப்படுத்துகிறது. அந்த வடிவத்தையும் உள்ளார்ந்த விருப்பத்தையும் பாதுகாக்கத் தமிழிலும் கேள்வியாக மொழிபெயர்க்கப்பட்டது.
- source_word: יַשְׁקֵנִי
  choice: எனக்குக் குடிக்கத் ... கொடுப்பார்
  rationale: שקה என்பதன் ஹிஃபீல் வடிவம் ஒருவருக்குக் குடிக்கக் கொடுப்பதைக் குறிக்கிறது. அடுத்து வரும் ‘தண்ணீர்’ என்பதோடு இயல்பாக இணையும் தமிழ் நடை இது.
- source_word: מַיִם
  choice: தண்ணீர்
  rationale: சாதாரண நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்கும் நேரடி பொருள்.
- source_word: מִבֹּאר
  choice: கிணற்றிலிருந்து
  rationale: בְּאֵר பொதுவாக நீர்த்தேக்கத் தொட்டியைவிட கிணற்றைக் குறிக்கிறது; מן முன்னொட்டின் ‘இலிருந்து’ பொருளும் பாதுகாக்கப்பட்டது.
- source_word: בֵּית לֶחֶם
  choice: பெத்லெகேம்
  rationale: இடப்பெயரின் நிலையான தமிழ் ஒலிபெயர்ப்பு.
- source_word: אֲשֶׁר בַּשָּׁעַר
  choice: வாசலருகே இருக்கிற
  rationale: குறிப்பிட்ட கிணறு நகர வாசலுக்கு அருகே இருந்ததை அடையாளப்படுத்துகிறது. ‘வாசலுக்குள்’ என்ற தவறான எண்ணத்தைத் தவிர்த்து בְּ முன்னொட்டின் இடத் தொடர்பை இயல்பாகத் தருகிறது.
