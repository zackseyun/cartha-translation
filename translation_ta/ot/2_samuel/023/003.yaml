id: 2SA.23.3
reference: 2 Samuel 23:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אָמַר֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל לִ֥/י דִבֶּ֖ר צ֣וּר יִשְׂרָאֵ֑ל מוֹשֵׁל֙ בָּ/אָדָ֔ם צַדִּ֕יק מוֹשֵׁ֖ל יִרְאַ֥ת אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/003.yaml
  text: 'The God of Israel has spoken[a]; the Rock of Israel has said to me: One who rules over mankind justly, ruling in the fear of God[b],'
translation:
  language: ta
  text: 'இஸ்ரவேலின் கடவுள் உரைத்தார்;

    இஸ்ரவேலின் கன்மலை என்னிடம் பேசினார்:

    மனிதகுலத்தை[a] நீதியுடன் ஆளுகிறவர்,

    கடவுளுக்குப் பயந்து ஆளுகிறவர்[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக ‘மனிதனை’ என்று உள்ளது; אָדָם என்ற சொல் இங்கு மனிதகுலத்தைத் தொகுதியாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சிறந்த அரசனைப் பற்றிய இவ்வருணனை இறுதியில் மேசியாவில் நிறைவேறுவதாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר
  choice: உரைத்தார்
  rationale: நிறைவுற்ற வினை தீர்க்கதரிசன உரையை அறிமுகப்படுத்துகிறது. ‘உரைத்தார்’ என்பது கண்ணியமான, இயல்பான தமிழ்; இணையான அடுத்த வினையிலிருந்து சிறிய நடையியல் வேறுபாட்டையும் காக்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: இஸ்ரவேலின் கடவுளைக் குறிக்கும் சார்புநிலைத் தொடர்; தமிழில் இயல்பாக இவ்வாறு அமைகிறது.
- source_word: לִי
  choice: என்னிடம்
  rationale: இங்கு தாவீதிடம் தெய்வீகச் செய்தி பேசப்பட்டதைக் குறிக்கும் மறைமுகச் செயப்படுபொருளாக எடுத்துக்கொள்ளப்பட்டது; ‘என்னைக் குறித்து’ என்பதும் இலக்கண ரீதியாகச் சாத்தியமானாலும் இச்சூழலில் குறைவான வாய்ப்புடையது.
- source_word: דִבֶּר
  choice: பேசினார்
  rationale: אָמַר என்பதற்கு இணையாக வரும் பொதுவான பேச்சு வினை; எபிரெய இணைநிலையை இயல்பான தமிழில் காக்கிறது.
- source_word: צוּר יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கன்மலை
  rationale: צוּר என்பது நிலைத்தன்மையையும் பாதுகாப்பையும் உணர்த்தும் தெய்வீகப் பட்டப்பெயர்/உருவகம். அதை விளக்கவுரையாக மாற்றாமல் ‘கன்மலை’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מוֹשֵׁל
  choice: ஆளுகிறவர்
  rationale: பொதுவான அல்லது கோட்பாட்டுத் தன்மையுள்ள பங்கேற்பு வடிவத்தை, பெயர்ச்சொல்லாக மட்டும் மாற்றாமல் இயல்பான தமிழில் காட்டுகிறது.
- source_word: בָּאָדָם
  choice: மனிதகுலத்தை
  rationale: אָדָם இங்கு ஒரே தனிமனிதனைவிட மனிதர்களைத் தொகுதியாகக் குறிக்கிறது; ஆட்சிக்குட்பட்டவர்களைச் சுட்டும் בְּ முன்னிலைத் தொடர்பு தமிழில் ‘-ஐ’ வேற்றுமையால் இயல்பாக வெளிப்படுகிறது. எபிரெயத்தின் சொற்சார்ந்த ஒருமை அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
- source_word: צַדִּיק
  choice: நீதியுடன்
  rationale: வடிவில் பெயரடையாக இருந்தாலும், சுருக்கமான கவிதை நடையில் ஆளும் முறையைத் தகுதிப்படுத்துகிறது. ‘நீதியுடன்’ என்பது இயல்பான தமிழில் அந்த வினையடைப் பொருளைக் காக்கிறது.
- source_word: מוֹשֵׁל יִרְאַת אֱלֹהִים
  choice: கடவுளுக்குப் பயந்து ஆளுகிறவர்
  rationale: இரண்டாம் பங்கேற்புத் தொடர் நீதியுள்ள ஆட்சியாளரை மேலும் விவரிக்கிறது. ‘பயம்’ இங்கு வெறும் அச்சம் மட்டுமல்ல, கடவுள்முன் பயபக்தியுடனும் பொறுப்புணர்வுடனும் இருப்பதையும் உள்ளடக்குகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: பன்மை வடிவம் இருந்தாலும், இங்கு எபிரெய வழக்கின்படி ஒரே கடவுளைக் குறிக்கிறது; ஆகவே தமிழில் ஒருமை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: மேசியாவைக் குறிக்கும் வாசிப்பா, பொதுவான அரசாட்சி நெறியா
  choice: முதன்மை உரை இதை நீதியுள்ள சிறந்த ஆட்சியாளரைப் பற்றிய பொதுவான கோட்பாடாகவே மொழிபெயர்க்கிறது; மேசியாவை நேரடியாக அடையாளப்படுத்தவில்லை.
  alternative: சிறந்த அரசனைப் பற்றிய இவ்வருணனை இறுதியில் மேசியாவில் நிறைவேறுவதாக வாசிக்கலாம்.
  rationale: எபிரெய உரை மேசியாவை வெளிப்படையாகப் பெயரிடாமல் நீதியுள்ள ஆட்சியின் கோட்பாட்டைக் கூறுகிறது. தாவீதின் ‘கடைசி வார்த்தைகள்’ என்ற விரிந்த சூழல் மேசியாவை நோக்கிய பொருளையும் அனுமதிப்பதால், அந்த வாய்ப்பு அடிக்குறிப்பில் வைக்கப்பட்டு இறையியல் இழுபறி பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத்தமிழில் எளிதில் புரியும், ஆனால் கவிதைநயமும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் இணைவரிகளும் முடிவுறாத தொடரமைப்பும் காக்கப்பட்டுள்ளன; அடுத்த வசனத்துடன் தொடர்வதை உணர்த்த இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘கன்மலை’ என்ற உருவகம் விளக்கவுரையாக மாற்றப்படவில்லை.
