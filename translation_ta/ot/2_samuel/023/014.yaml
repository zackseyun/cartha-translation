base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/014.yaml
  text: David was then in the stronghold[a], and the garrison of the Philistines was then at Bethlehem.
translation:
  language: ta
  text: தாவீது அப்போது அரணில் இருந்தார்; பெலிஸ்தியரின் படைக்காவல் அப்போது பெத்லகேமில் இருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: இக்கால வினையடை எபிரெய உரையில் இருமுறை வந்து, இரு கூற்றுகளையும் ஒரே காலச் சூழலில் அமைக்கிறது. தமிழிலும் இயல்பாக இருப்பதால் இரு இடங்களிலும் வெளிப்படையாகத் தக்கவைக்கப்பட்டது.
- source_word: מְצוּדָה
  choice: அரணான இடம்
  rationale: தாவீது தங்கியிருந்த பாதுகாப்பும் தற்காப்பு வசதியும் கொண்ட இடத்தைக் குறிக்கிறது; குறிப்பிட்ட கட்டட வகையாக மிகையாக வரையறுக்காமல் இராணுவ-இடவியல் பொருளைக் காக்கிறது.
- source_word: מַצַּב
  choice: படைக்காவல்
  rationale: இச்சூழலில் பெலிஸ்தியரின் நிலைநிறுத்தப்பட்ட இராணுவக் காவல் அல்லது படைப்பிரிவைக் குறிக்கிறது.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்
  rationale: இம்மக்கள் குழுவுக்கான வழக்கமான தமிழ் பெயர்.
- source_word: בֵּית לָחֶם
  choice: பெத்லகேம்
  rationale: இவ்விடப்பெயருக்கான நிலைபெற்ற தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְ
  choice: ;
  rationale: எபிரெய இணைப்புச் சொல்லால் தொடர்புபடுத்தப்பட்ட இரு சமநிலை கூற்றுகளையும் தமிழில் இயல்பாக இணைக்க அரைப்புள்ளி பயன்படுத்தப்பட்டது; பொருளில் 'மேலும்/மற்றும்' என்ற ஒருங்கிணைப்பு தொடர்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், எளிமையானதும் கண்ணியமானதுமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையிலுள்ள אָז என்பதன் இருமுறை பயன்பாடு தமிழிலும் இயல்பாகத் தக்கவைக்கப்பட்டுள்ளது; எனவே அதற்கான அடிக்குறிப்பு தேவையில்லை.
