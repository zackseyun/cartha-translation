translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் கடினமான எண்ணிக்கை/குழு அமைப்பு பிரதான உரையில் ஓரளவு தக்கவைக்கப்பட்டு, மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
