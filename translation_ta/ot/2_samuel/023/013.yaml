base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/013.yaml
  text: Then thirty of the thirty chief men went down and came at harvest time to David[a], to the cave of Adullam[c][b], while a band of the Philistines was camped in the Valley of Rephaim.
translation:
  language: ta
  text: முப்பது தலைமை வீரர்களில் முப்பது பேர்[a] இறங்கி வந்து, அறுவடைக் காலத்தில்[b] அதுல்லாம் குகையில் இருந்த தாவீதிடம் வந்தார்கள். அப்போது பெலிஸ்தியரின் ஒரு படைக்குழு[c] ரெப்பாயீம் பள்ளத்தாக்கில் முகாமிட்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “முப்பதிலிருந்து முப்பது, தலைவன்/தலைமை” என்று கடினமான சொற்றொடர் உள்ளது. இது “தலைமை வீரர்களில் முப்பது பேர்” என்று பொருள்படலாம்; அல்லது தாவீதின் சிறப்புப் போர்வீரர்களான “முப்பது பேர்” என்ற குழுவின் உறுப்பினர்களைக் குறிப்பாகக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அறுவடையின்போது.”
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் חַיַּת פְּלִשְׁתִּים; சொல்லுக்கு சொல், “பெலிஸ்தியரின் உயிரினம்/விலங்கு.” இங்கு இது ஒரு இராணுவப் படைக்குழுவைக் குறிக்கப் பயன்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: இறங்கிவந்து
  rationale: ירד என்பதன் திசை உணர்வைத் தக்கவைத்து, அடுத்துவரும் ‘வந்தார்கள்’ என்பதுடன் இயல்பான தமிழ் தொடராக அமைக்கிறது.
- source_word: שלשים מֵהַשְּׁלֹשִׁים רֹאשׁ
  choice: முப்பது பேரில் தலைசிறந்த முப்பது பேர்
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமாகவும் கடினமாகவும் உள்ளது. எண்ணையும் தலைமை/முதன்மை உணர்வையும் வெளிப்படுத்தி, அதன் உண்மையான தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: אֶל קָצִיר
  choice: அறுவடைக் காலத்தில்
  rationale: சொல்லுக்கு சொல் ‘அறுவடைக்கு’ என்றாலும், இச்சூழலில் காலத்தைக் குறிக்கும் பயன்பாடாகப் புரிந்துகொள்வது இயல்பானது.
- source_word: אֶל דָּוִד אֶל מְעָרַת עֲדֻלָּם
  choice: அதுல்லாம் குகையிலிருந்த தாவீதிடம்
  rationale: மீண்டும் வரும் אֶל இலக்கைச் சுட்டுகிறது. தாவீது குகையில் இருந்தார் என்பதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: חַיַּת פְּלִשְׁתִּים
  choice: பெலிஸ்தியரின் ஒரு படைப்பிரிவு
  rationale: חַיָּה என்பதன் நேரடிப் பொருள் ‘உயிரினம்/விலங்கு’; ஆனால் இங்கு இராணுவக் குழுவைக் குறிக்கும் மரபுத்தொடராகப் பயன்படுகிறது.
- source_word: חֹנָה
  choice: முகாமிட்டிருந்தது
  rationale: பங்கேற்பு வினை வடிவம் பின்னணியில் தொடர்ந்துகொண்டிருந்த முகாமிடுதலைக் குறிக்கிறது.
- source_word: בְּעֵמֶק רְפָאִים
  choice: ரெப்பாயீம் பள்ளத்தாக்கில்
  rationale: இடப்பெயரை ஒலிபெயர்த்து, עֵמֶק என்பதற்கு இயல்பான ‘பள்ளத்தாக்கு’ பயன்படுத்தப்படுகிறது.
