base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/012.yaml
  text: But he took his stand in the middle of the field and defended it[a], and struck down the Philistines; and Yahweh brought about a great victory.
translation:
  language: ta
  text: ஆனால் அவன் அந்த நிலப்பகுதியின் நடுவில் நிலைகொண்டு, அதைக் காப்பாற்றி, பெலிஸ்தியரை வீழ்த்தினான்; யாவே மாபெரும் வெற்றியை[a] ஏற்படுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மாபெரும் மீட்பை” அல்லது “மாபெரும் இரட்சிப்பை.” இங்குள்ள எபிரெயச் சொல் இப்பொருள்களையும் தரக்கூடும்; இந்தப் போர்ச் சூழலில் அது யாவே செய்த காப்பாற்றும் செயலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצֵּב
  choice: நிலைகொண்டு
  rationale: התפעל வடிவம் ஒருவர் உறுதியாகத் தம் இடத்தை எடுத்துக்கொள்வதைக் குறிக்கிறது; போர்ச் சூழலில் ‘நிலைகொண்டு’ என்பது இயல்பாகவும் செறிவாகவும் உள்ளது.
- source_word: בְּתוֹךְ הַחֶלְקָה
  choice: அந்த நிலப்பகுதியின் நடுவில்
  rationale: חֶלְקָה என்பது பிரிக்கப்பட்ட நிலத்துண்டு அல்லது வயற்பகுதியைக் குறிக்கலாம். ‘நிலப்பகுதி’ அதன் பரப்பை மிகையாகக் குறிப்பாக்காமல் தமிழில் தெளிவாகத் தருகிறது.
- source_word: וַיַּצִּילֶהָ
  choice: அதைக் காப்பாற்றி
  rationale: נצל என்பது மீட்பது அல்லது காப்பாற்றுவது. பெண்பால் பின்னொட்டு நிலப்பகுதியையே சுட்டுகிறது; எதிரியின் கைப்பற்றுதலிலிருந்து அதைக் காத்த பொருளை ‘காப்பாற்றி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיַּךְ אֶת־פְּלִשְׁתִּים
  choice: பெலிஸ்தியரை வீழ்த்தினான்
  rationale: נכה போர்ச் சூழலில் அடித்தல், முறியடித்தல், வீழ்த்துதல் ஆகிய பொருள்களைக் கொண்டது; ‘வீழ்த்தினான்’ அதன் வலிமையையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: וַיַּעַשׂ יְהוָה
  choice: யாவே … ஏற்படுத்தினார்
  rationale: עשה என்பதுடன் תְּשׁוּעָה வரும்போது, அந்த மீட்பு அல்லது வெற்றியை இறைவனே நிகழச் செய்தார் என்பதே பொருள்; ‘ஏற்படுத்தினார்’ தெய்வீகச் செயற்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயராக மாற்றாமல், நவீன தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: மாபெரும் வெற்றி
  rationale: תְּשׁוּעָה என்பதற்கு மீட்பு, இரட்சிப்பு, வெற்றி ஆகிய பொருள்கள் உண்டு. இங்குள்ள போர்ச் சூழலில் ‘வெற்றி’ உடனடியான பொருளைத் தெளிவாகத் தருகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலச் சான்றுக்கு நெருக்கமானது.
- issue: போர்ச் சூழலில் תְּשׁוּעָה என்பதன் பொருள்
  choice: வெற்றி
  alternative: மீட்பு; இரட்சிப்பு
  rationale: இந்தச் சூழலில் சொல்லப்படுவது போரில் யாவே நிகழ்த்திய விடுதலைக்குரிய வெற்றி. இருப்பினும் எபிரெயச் சொல்லின் விரிந்த மீட்பு/இரட்சிப்பு பொருள் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான எபிரெய வினைச்சொற்கள் தமிழில் இயல்பான வினையெச்சத் தொடராக வழங்கப்பட்டுள்ளன; இறுதியில் யாவேயின் செயல் தனித்துப் பிரதானப்படுத்தப்பட்டுள்ளது.
