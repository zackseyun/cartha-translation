translation:
  language: ta
  text: அம்மோனியரான செலேக், பெயேரோத்தியரான நஹராய்—செருயாவின் மகன் யோவாபின் ஆயுததாங்கி;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֶלֶק
  choice: சேலேக்கு
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பெயர்ப்பு; தமிழில் இயல்பாக வாசிக்க இறுதியில் உகரம் சேர்க்கப்பட்டது.
- source_word: הָעַמֹּנִי
  choice: அம்மோனியனான
  rationale: சேலேக்கின் இன/நாட்டு அடையாளத்தைக் குறிக்கும் பெயரடை; பட்டியல் நடைக்கு ஏற்ற சுருக்கமான வடிவம்.
- source_word: נַחְרַי
  choice: நக்ராய்
  rationale: மசோரா உயிர்க்குறிப்பை அடிப்படையாகக் கொண்ட ஒலிப்பெயர்ப்பு.
- source_word: הַבְּאֵרֹתִי
  choice: பெயேரோத்தியனான
  rationale: பெயேரோத் ஊரைச் சேர்ந்தவர் என்பதைக் குறிக்கும் புவியியல் அடையாளத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: נשאי כְּלֵי
  choice: ஆயுதங்களைச் சுமந்தவன்
  rationale: கேதீப் வடிவம் பன்மைச் சுமப்பவர்களைக் குறிக்கக்கூடிய சிக்கலைக் கொண்டிருந்தாலும், பட்டியலில் நக்ராய் ஒருமை நபராக வருவதாலும் கிரே வடிவத்தின் ஒருமை வாசிப்பாலும் இவ்வாறு மொழிபெயர்க்கப்பட்டது. כְּלֵי என்பதன் பரந்த பொருளில் இச்சூழலில் போர்க்கருவிகள்/ஆயுதங்கள் பொருந்துகின்றன.
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: செருயாவின் மகன் யோவாப்
  rationale: எபிரெய மூலத்தின் உறவுமுறை அடையாளத்தை முழுமையாகப் பாதுகாக்கும் இயல்பான தமிழ் சொல்வரிசை.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், வீரர் பட்டியலின் சுருக்கமான மற்றும் முறையான நடையைப் பேணுகிறது. எபிரெய உரையில் உள்ள נשאי என்ற கேதீப்–கிரே வேறுபாடு மொழிபெயர்ப்பில் ஒருமையாக வழங்கப்பட்டது; இது பதிப்பியல் விவரம் என்பதால் வாசகர் அடிக்குறிப்பாகச் சேர்க்கப்படவில்லை. வழங்கப்பட்ட ஆங்கில அடிக்குறிப்பு நக்ராய் என்ற பெயரின் ஆங்கில எழுத்துப்பெயர்ப்பு வேறுபாட்டை மட்டுமே பற்றியது; தமிழுக்கு நேரடியாகப் பொருந்தாததால் சேர்க்கப்படவில்லை.
