  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான போர்வர்ணனை பயன்படுத்தப்பட்டுள்ளது. ‘கை வாளோடு ஒட்டிக்கொண்டது’ என்ற மூலத்தின் வலுவான படிமமும், ‘வெற்றி/விடுதலை’ என்ற பொருள் விரிவும் தீர்மானமாகச் சுருக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
