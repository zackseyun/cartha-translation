  source_fidelity: திருத்தம் தேவை. வரைவு, கை சோர்வதும் கை வாளோடு ஒட்டிக்கொள்வதும் ஆகிய இரண்டு தொடர்ச்சியான எபிரெய வினைச்சொற்களை ‘...வரை போரிட்டான்’ என்று ஒரே கால-எல்லைக்குள் இணைக்கிறது; மேலும் மூலத்தில் இல்லாத ‘போரிட்டான்’ என்பதையும் சேர்க்கிறது. திருத்தப்பட்ட உரை இரண்டு நிகழ்வுகளையும் தனித்தனியாகக் காக்கிறது. נכה என்பதற்கு ‘தாக்கினான்’ என்பது மூலத்தின் உயிரிழப்பை வெளிப்படையாகக் கூறாத சொல்லாட்சியைப் பாதுகாக்கிறது.
  naturalness: ‘அவனுடைய கை சோர்வடைந்தது; அவனுடைய கை வாளோடு ஒட்டிக்கொண்டது’ என்பது நவீன நிலையான தமிழில் தெளிவாகவும் மூலத்தின் வலுவான, மீளுரைப்பான படிமத்தைப் பாதுகாப்பதாகவும் உள்ளது. ‘வீழ்ந்தோரைக் கொள்ளையாடுவதற்காக மட்டுமே’ என்பது போருக்குப் பிந்தைய பொருட்களை எடுத்துக்கொள்ளுதலை இயல்பாகக் குறிக்கிறது.
