  to: அவன் எழுந்து பெலிஸ்தியரைத் தாக்கினான்; அவனுடைய கை சோர்வடைந்தது; அவனுடைய கை வாளோடு ஒட்டிக்கொண்டது. அந்த நாளில் யாவே பெரும் வெற்றியை ஏற்படுத்தினார்[a]. மக்கள் அவனுக்குப் பின்னால் திரும்பி வந்தார்கள்; வீழ்ந்தோரைக் கொள்ளையாடுவதற்காக மட்டுமே[b].
  rationale: மூலத்தின் வாக்கியத் தொடரைத் தக்கவைக்க, கை சோர்வடைதலும் கை வாளோடு ஒட்டிக்கொள்வதும் தனித்தனி வாக்கிய உறுப்புகளாகத் திருத்தப்பட்டன; சேர்க்கப்பட்ட ‘போரிட்டான்’ நீக்கப்பட்டது. நכה-வுக்கு மூலத்தைவிட அதிகமாகக் குறிப்பாக்காத ‘தாக்கினான்’ பயன்படுத்தப்பட்டது. அடிக்குறிப்புகள் பொருளுக்கு ஏற்ப வெற்றி மற்றும் கொள்ளையிடுதல் ஆகிய சொற்களுடன் இணைக்கப்பட்டுள்ளன.
