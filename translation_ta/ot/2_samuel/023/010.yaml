base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/010.yaml
  text: He rose and struck down the Philistines until his hand grew weary and his hand clung to the sword[a]. And Yahweh brought about a great victory on that day[b], and the people returned after him only to strip the slain.
translation:
  language: ta
  text: அவன் எழுந்து பெலிஸ்தியரைத் தாக்கினான்; அவனுடைய கை சோர்வடைந்தது; அவனுடைய கை வாளோடு ஒட்டிக்கொண்டது. அந்த நாளில் யாவே பெரும் வெற்றியை ஏற்படுத்தினார்[a]. மக்கள் அவனுக்குப் பின்னால் திரும்பி வந்தார்கள்; வீழ்ந்தோரைக் கொள்ளையாடுவதற்காக மட்டுமே[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெரும் விடுதலை” அல்லது “பெரும் மீட்பு” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பொதுவாக மீட்பைக் குறிக்கக்கூடும்; இங்கு போரில் யாவே அளித்த தீர்மானமான வெற்றியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “உரித்தெடுப்பதற்காக மட்டுமே.” அதாவது, போருக்குப் பிறகு வீழ்ந்தவர்களிடமிருந்து ஆயுதங்களையும் கொள்ளைப் பொருள்களையும் எடுத்துக்கொள்வதற்காக.
    reason: cultural_note
lexical_decisions:
- source_word: קָם
  choice: எழுந்து
  rationale: போரில் உறுதியுடன் நடவடிக்கையில் இறங்கியதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; வெறுமனே உடல் நிலையிலிருந்து எழுந்தான் என்று மட்டும் வரையறுப்பதில்லை.
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים
  choice: பெலிஸ்தியரை வெட்டி வீழ்த்தினான்
  rationale: נכה என்பதன் போர்ச் சூழலிலான வலிமையையும் உயிரிழப்பை உள்ளடக்கக்கூடிய தாக்குதலையும் வெளிப்படுத்துகிறது.
- source_word: עַד כִּי יָגְעָה יָדוֹ
  choice: அவனுடைய கை சோர்ந்து
  rationale: יגע குறிக்கும் உடல் களைப்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וַתִּדְבַּק יָדוֹ אֶל הַחֶרֶב
  choice: வாளோடு ஒட்டிக்கொள்ளும் வரை
  rationale: דבק என்பதன் ‘ஒட்டிக்கொள்/விடாமல் பற்றிக்கொள்’ என்ற உயிரோட்டமான படிமத்தைப் பாதுகாக்கிறது; இது தசைப்பிடிப்பா அல்லது மிகைப்படுத்தப்பட்ட போர்வர்ணனையா என்பதைத் தீர்மானிக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரான יהוה-ஐ ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: பெரும் வெற்றி
  rationale: இங்கு உடனடியான போர்ச் சூழலில் ‘வெற்றி’ இயல்பான பொருள்; இருப்பினும் மீட்பு/விடுதலை என்ற விரிந்த பொருளை அடிக்குறிப்பு குறிப்பிடுகிறது.
- source_word: וְהָעָם יָשֻׁבוּ אַחֲרָיו
  choice: மக்கள் அவனுக்குப் பின்னால் திரும்பி வந்தது
  rationale: முடிவான போராட்டத்திற்குப் பிறகு மக்கள் அவனைப் பின்தொடர்ந்து மீண்டும் வந்தனர் என்ற எபிரெயச் சொற்றொடரின் வரிசையையும் கூட்டுப் பொருளையும் காக்கிறது.
- source_word: אַךְ לְפַשֵּׁט
  choice: வீழ்ந்தவர்களிடமிருந்து பொருள்களை எடுத்துக்கொள்வதற்காக மட்டுமே
  rationale: போரில் வீழ்ந்தோரிடமிருந்து ஆயுதங்கள், உடைமைகள் போன்றவற்றை எடுத்துக்கொள்ளும் செயலை நவீன வாசகருக்குத் தெளிவாகக் கூறுகிறது; אַךְ என்பதன் வரையறுக்கும் வலிமையை ‘மட்டுமே’ காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, தனிப்பட்ட திருப்பெயர் இருப்பதால் அதை ஒலிபெயர்த்துள்ளது.
- issue: תְּשׁוּעָה என்ற சொல்லின் போர்ச் சூழலிலான பொருள்
  choice: வெற்றி
  alternative: பெரும் விடுதலை / பெரும் மீட்பு
  rationale: உடனடிச் சூழல் போரில் கிடைத்த தீர்மானமான வெற்றியைச் சுட்டுகிறது. அதேவேளை, யாவே அதைத் தந்தார் என்று கூறுவதன் மூலம் தெய்வீக மீட்புச் செயல் மறைக்கப்படவில்லை; பரந்த சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
