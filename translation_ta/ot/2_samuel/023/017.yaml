  text: וַ/יֹּ֡אמֶר חָלִילָ/ה֩ לִּ֨/י יְהוָ֜ה מֵ/עֲשֹׂ֣תִ/י זֹ֗את הֲ/דַ֤ם הָֽ/אֲנָשִׁים֙ הַ/הֹלְכִ֣ים בְּ/נַפְשׁוֹתָ֔/ם וְ/לֹ֥א אָבָ֖ה לִ/שְׁתּוֹתָ֑/ם אֵ֣לֶּה עָשׂ֔וּ שְׁלֹ֖שֶׁת הַ/גִּבֹּרִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/017.yaml
  text: And he said[a], “Far be it from me, O Yahweh, that I should do this! Is it not the blood of the men who went at the risk of their lives?” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: ta
  text: அவர், “யாவே, நான் இதைச் செய்யவே கூடாது! உயிரைப் பணயம் வைத்து சென்ற மனிதர்களின் இரத்தமல்லவா இது?[a][b]” என்றார். ஆகவே, அவர் அதைக் குடிக்க விரும்பவில்லை. இத்தகைய செயல்களைச் செய்தவர்கள் அந்த மூன்று மாவீரர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “தங்கள் உயிர்களோடு சென்ற”; அவர்கள் மரண ஆபத்தை ஏற்றுச் சென்றார்கள் என்பது பொருள்.
    reason: lexical_alternative
  - marker: b
    text: 'பாரம்பரிய வடிவம்: “இது உயிரைப் பணயம் வைத்து சென்ற மனிதர்களின் இரத்தமல்லவா?” அவர்கள் மரண ஆபத்தில் பெற்றுவந்த தண்ணீரை, அது அவர்களுடைய இரத்தமே என்பதுபோல் தாவீது கருதுகிறார்.'
    reason: alternative_reading
lexical_decisions:
- source_word: חָלִילָה לִּי יְהוָה
  choice: யாவே, நான் இப்படிச் செய்யவே மாட்டேன்!
  rationale: חָלִילָה என்பது அருவருப்புடனும் உறுதியுடனும் மறுக்கும் மரபுத்தொடர். இயல்பான நவீனத் தமிழில் அதன் வலிமையைத் தெளிவாக வெளிப்படுத்தி, יְהוָה என்பதை நேரடி அழைப்பாக வைத்திருக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מֵעֲשֹׂתִי זֹאת
  choice: நான் இப்படிச் செய்ய
  rationale: முன்னர் குறிப்பிடப்பட்ட தண்ணீரைக் குடிக்கும் செயலைச் சுட்டி, மறுப்புத் தொடருடன் இயல்பாக இணைக்கிறது.
- source_word: הֲדַם הָאֲנָשִׁים
  choice: இந்த மனிதர்களின் இரத்தமல்லவா இது?
  rationale: הֲ என்ற வினாக்குறியை எதிர்பார்க்கப்படும் ஒப்புதலைக் கொண்ட வினாவாகப் பாதுகாக்கிறது. தண்ணீரை அவர்களுடைய இரத்தமாகத் தாவீது உருவகமாகக் கருதும் பதற்றத்தையும் தக்கவைக்கிறது.
- source_word: הַהֹלְכִים בְּנַפְשׁוֹתָם
  choice: தங்கள் உயிரைப் பணயம் வைத்துச் சென்ற
  rationale: சொல்லுக்கு நெருக்கமாக ‘தங்கள் உயிர்களோடு சென்ற’ என்றாலும், இச்சூழலில் அது சாவுக்குரிய ஆபத்தை ஏற்றுச் சென்றதைக் குறிக்கிறது. முதன்மை உரை பொருளை இயல்பாகத் தருகிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: ஆகவே, அவர் அதைக் குடிக்க விரும்பவில்லை
  rationale: אָבָה என்பதன் விருப்பம் அல்லது சம்மதம் என்ற நுணுக்கத்தைப் பாதுகாக்கிறது. பின்னொட்டு தண்ணீரைக் குறிப்பதால் தமிழில் ஒருமை ‘அதை’ பயன்படுத்தப்படுகிறது.
- source_word: אֵלֶּה עָשׂוּ שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: இவற்றைச் செய்தவர்கள் அந்த மூன்று மாவீரர்கள்
  rationale: אֵלֶּה என்பதன் பன்மைச் சுட்டையும், மூன்று சிறப்பு வீரர்களை அடையாளப்படுத்தும் הַגִּבֹּרִים என்பதையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பட்டம் அல்ல, தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒலிபெயர்ப்பாகப் பாதுகாக்கிறது.
- issue: தண்ணீரை ‘இரத்தம்’ என்று கூறுதல்
  choice: இரத்தமல்லவா இது? என்ற உருவக வினாவைப் பாதுகாத்தல்
  alternative: இதை நான் குடித்தால் அவர்களுடைய இரத்தத்தைக் குடிப்பதுபோல் ஆகாதா?
  rationale: விரிவான மாற்றுரை பொருளை விளக்கினாலும், மூலத்தின் சுருக்கமான மற்றும் அதிர்ச்சியூட்டும் உருவகத்தைத் தீர்த்துவிடும். முதன்மை உரை அந்த இறையியல் மற்றும் ஒழுக்கப் பதற்றத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘மாவீரர்கள்’ என்பது தாவீதின் சிறப்பு வீரர்களைக் குறிக்கிறது. மூலத்தின் வலுவான மறுப்பும், இரத்தம் பற்றிய உருவக வினாவும் மென்மையாக்கப்படவில்லை.
