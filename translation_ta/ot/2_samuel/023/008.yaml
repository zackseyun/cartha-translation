translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான வரலாற்று-வீரர் பட்டியல் நடையைப் பயன்படுத்துகிறது. கடினமான மசோரா உரை பெயர்களாக முதன்மை உரையில் பாதுகாக்கப்பட்டு, நாளாகம இணை வாசிப்பும் ஊகிக்கப்பட்ட வினைச்சொல் வாசிப்பும் அடிக்குறிப்புகளில் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளன. ‘ஈட்டி’ என்ற சொல் WLC முதன்மை உரையில் தெளிவாக இல்லாததால் பிரதான வசனத்தில் சேர்க்கப்படவில்லை.
