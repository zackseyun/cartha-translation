source:
  edition: WLC
  text: אֵ֛לֶּה שְׁמ֥וֹת הַ/גִּבֹּרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑ד יֹשֵׁ֨ב בַּשֶּׁ֜בֶת תַּחְכְּמֹנִ֣י רֹ֣אשׁ הַ/שָּׁלִשִׁ֗י ה֚וּא עֲדִינ֣/וֹ ה/עצנ/ו עַל שְׁמֹנֶ֥ה מֵא֛וֹת חָלָ֖ל בְּ/פַ֥עַם אחד׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/008.yaml
  text: 'These are the names of the mighty men who belonged to David: Josheb-basshebeth[a], a Tahkemonite, chief of the Three. He was Adino the Eznite[c][b], who wielded his spear against eight hundred slain at one time.'
translation:
  language: ta
  text: 'தாவீதுடன் இருந்த மாவீரர்களின் பெயர்கள் இவை: தக்மோனியனான யோஷேப்-பஷ்ஷெபெத்[a], மூவருக்குத் தலைவர்[b]. அவர் அதீனோ என்னும் எஸ்னியர்[c]; ஒரே சமயத்தில் எட்டுநூறு பேரை வீழ்த்தியவர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனத்தின் எபிரெய உரை புரிந்துகொள்ளக் கடினமானது. “யோஷேப்-பஷ்ஷெபெத்” என்பது மசோரா உரையைப் பின்பற்றுகிறது; 1 நாளாகமம் 11:11-இல் உள்ள இணைப் பதிவு “ஹக்மோனியனான யாஷொபெயாம்” என்று வாசிக்கிறது.
    reason: textual_variant
  - marker: b
    text: சில பழமையான சாட்சிகளின்படியும் விளக்கங்களின்படியும், “முப்பதுபேருக்குத் தலைவர்” என்றும் வாசிக்கலாம்; மசோரா உரை “மூவருக்குத் தலைவர்” என்று வாசிக்கிறது.
    reason: alternative_reading
  - marker: c
    text: எபிரெயில், “அதீனோ என்னும் எஸ்னியர்”; இது மிகவும் கடினமான சொற்றொடர். பலர் இதை, “அவர் தமது ஈட்டியை ஏந்தினார்” அல்லது “தமது ஈட்டியைச் சுழற்றினார்” என்பதுபோல் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּבֹּרִים
  choice: மாவீரர்கள்
  rationale: இச்சூழலில் גִּבּוֹרִים வலிமையும் வீரமும் கொண்ட போர்வீரர்களைக் குறிக்கிறது; ‘மாவீரர்கள்’ இயல்பாகவும் பட்டியலின் சிறப்புமிக்க தொனிக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: אֲשֶׁר לְדָוִד
  choice: தாவீதுடன் இருந்த
  rationale: தாவீதோடு இணைந்திருந்த அவரது வீரர் குழுவைச் சுட்டும் לְ என்ற உறவுப்பொருளை, உடைமை எண்ணத்தை மிகைப்படுத்தாமல் இயல்பான தமிழில் தருகிறது.
- source_word: יֹשֵׁב בַּשֶּׁבֶת
  choice: யோசேப்-பஷ்ஷெபெத்
  rationale: மசோரா உரை கடினமானதாயினும் இங்கு பெயராகச் செயல்படுகிறது; நாளாகமத்துடன் ஒத்திசைக்க உரையை மாற்றாமல் எபிரெய வடிவம் ஒலிபெயர்க்கப்படுகிறது.
- source_word: תַּחְכְּמֹנִי
  choice: தக்கெமோனியன்
  rationale: சாமுவேலின் எபிரெய உரையிலுள்ள இன அல்லது குல அடையாளத்தை நேரடியாக ஒலிபெயர்க்கிறது.
- source_word: רֹאשׁ הַשָּׁלִשִׁי
  choice: மூவருக்குத் தலைவர்
  rationale: மசோரா உயிர்க்குறியீட்டின்படி ‘மூவரின் தலைவர்’ என்பதே இயல்பான வாசிப்பு; வேறு பழமையான சாட்சிகளின் ‘முப்பதுபேரின் தலைவர்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עֲדִינוֹ הָעֶצְנוֹ
  choice: அதீனோ என்னும் எஸ்னியர்
  rationale: மிகவும் தெளிவற்ற சொற்றொடரை ஊகத் திருத்தம் செய்யாமல், மசோரா உரையின் பெயர் அல்லது பட்டப்பெயர் வாசிப்பாகப் பாதுகாக்கிறது; ஆயுதத்தை வீசியதாகப் புரியும் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַל שְׁמֹנֶה מֵאוֹת חָלָל
  choice: கொல்லப்பட்ட எண்ணூறு பேருக்கு எதிராக
  rationale: חָלָל என்பது இங்கு கொல்லப்பட்டவர்களைக் குறிக்கிறது; עַל போர்ச் சூழலிலுள்ள எதிர்நிலையைச் சுட்டுகிறது. தெளிவற்ற செயற்பாடு காரணமாக மசோரா உரைக்கு இல்லாத ‘ஈட்டியை வீசினார்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: בְּפַעַם אֶחָד
  choice: ஒரே சமயத்தில்
  rationale: ஒரே சந்திப்பு அல்லது ஒரே நிகழ்வில் என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: הוּא
  choice: இவர்
  rationale: அடுத்து வரும் அடையாளத்தையும் வீரச்செயலையும் முன் குறிப்பிடப்பட்ட நபருடன் தெளிவாக இணைக்கிறது.
