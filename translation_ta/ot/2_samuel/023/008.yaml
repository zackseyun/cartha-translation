  verdict: revise
  source_fidelity: மசோரா உரையின் கடினமான பெயர்வடிவங்களையும் ‘மூவருக்குத் தலைவர்’ என்ற வாசிப்பையும் முதன்மை உரையில் காப்பது சரியான அணுகுமுறை. ஆனால் ‘கொல்லப்பட்ட எண்ணூறு பேருக்கு எதிராகச் செயல்பட்டவர்’ என்பது חָלָל-ஐ ஏற்கெனவே கொல்லப்பட்டவர்களாகக் கொண்டு பொருளற்ற செயலைக் கூறுகிறது; சூழலிலும் சொற்றொடரின் வழக்கமான பொருளிலும் அந்த வீரர் ஒரே சந்தர்ப்பத்தில் எட்டுநூறு பேரை வீழ்த்தியதையே குறிக்கிறது.
  naturalness: திருத்தப்பட்ட உரை நவீனத் தரத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் வாசிக்கப்படுகிறது. பட்டியல் நடைக்கு ஏற்றவாறு பெயர், குல/இன அடையாளம், பதவி, வீரச்செயல் ஆகியவை தெளிவாக இணைக்கப்பட்டுள்ளன.
  terminology: ‘மாவீரர்கள்,’ ‘மூவருக்குத் தலைவர்,’ ‘எட்டுநூறு பேரை வீழ்த்தியவர்’ ஆகியவை சூழலுக்கேற்றவை. பெயர்கள் எபிரெய மசோரா வடிவத்துக்கு நெருக்கமாகச் சீரமைக்கப்பட்டுள்ளன. அடிக்குறிப்பு c-இல் ஊகிக்கப்படும் மாற்று வாசிப்பு ‘ஈட்டியை ஏந்தினார்/சுழற்றினார்’ என்று தரப்படுகிறது; ‘வீசினார்’ என்பது ஆதாரத்தைவிடக் குறிப்பானது.
