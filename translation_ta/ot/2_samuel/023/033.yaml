  text: Shammah the Hararite[a], Ahiam son of Sharar the Ararite.
translation:
  language: ta
  text: ஹராரியனான சம்மா; அராரியனான சாராரின் மகன் அஹியாம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இணையான பட்டியலிலுள்ள இன/இட அடையாளப் பெயருடன் ஒத்திசைத்தால், “ஹராரியனான சாராரின் மகன் அஹியாம்” என்றும் இருக்கலாம். எனினும், இங்குள்ள எபிரெய வாசகம் “அராரியன்” என்றே வாசிக்கப்படுவது சிறந்தது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁמָּה
  choice: சம்மா
  rationale: தனிப்பட்ட பெயர்; எபிரெய ஒலிப்புக்கு ஏற்ப தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הֲרָרִי
  choice: ஹராரியன்
  rationale: இது ஓர் இன அல்லது இட அடையாளப் பெயர்; விவரிப்புச் சொல்லாக மாற்றாமல் பெயரடையாளமாகப் பாதுகாக்கப்பட்டது.
- source_word: אֲחִיאָם
  choice: அகியாம்
  rationale: தனிப்பட்ட பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן
  choice: மகன்
  rationale: எபிரெய மரபுவழித் தொடர்பைக் குறிக்கும் வழக்கமான அமைப்பு; தமிழ்ப் பெயர்ப்பட்டியலில் இயல்பாக அமைகிறது.
- source_word: שָׁרָר
  choice: சாரார்
  rationale: தனிப்பட்ட பெயர்; மூலமொழி வடிவைப் பாதுகாக்கும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הָאֲרָרִי
  choice: அராரியன்
  rationale: மெய்யெழுத்து வடிவம் ‘ஹராரியன்’ என்பதிலிருந்து வேறுபட்டு ‘அராரியன்’ என வாசிக்கத் துணைபுரிகிறது; அந்த வேறுபாடு சமப்படுத்தப்படாமல் பாதுகாக்கப்பட்டது.
