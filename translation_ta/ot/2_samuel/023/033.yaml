  naturalness: The compact roster style is natural in modern standard Tamil. The semicolon appropriately separates the two names, and the genitive construction clearly attaches ‘Ararite’ to Sharar.
  terminology: ஹராரியன் and அராரியன் suitably preserve the two distinct demonymic forms without interpretive harmonization. The personal-name transliteration for Ahiam requires correction.
