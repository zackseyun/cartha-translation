reference: 2 Samuel 23:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה דִּבְרֵ֥י דָוִ֖ד הָ/אַֽחֲרֹנִ֑ים נְאֻ֧ם דָּוִ֣ד בֶּן יִשַׁ֗י וּ/נְאֻ֤ם הַ/גֶּ֨בֶר֙ הֻ֣קַם עָ֔ל מְשִׁ֨יחַ֙ אֱלֹהֵ֣י יַֽעֲקֹ֔ב וּ/נְעִ֖ים זְמִר֥וֹת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/001.yaml
  text: 'These are the last words of David: An oracle of David son of Jesse[a], an oracle of the man raised on high, the anointed of the God of Jacob[c][b], and the sweet singer of Israel.'
translation:
  language: ta
  text: 'தாவீதின் கடைசி வார்த்தைகள் இவையே:


    ஈசாயின் மகன் தாவீது கூறும் அருள்வாக்கு;


    உன்னதமாக உயர்த்தப்பட்ட மனிதன்,

    யாக்கோபின் கடவுளால் அபிஷேகம் செய்யப்பட்டவர்,

    இஸ்ரவேலின் இனிய பாடகர் கூறும் அருள்வாக்கு.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבְרֵי ... הָאַחֲרֹנִים
  choice: கடைசி வார்த்தைகள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான பொருளையும், தாவீதின் நிறைவுரையைக் குறிக்கும் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נְאֻם
  choice: அருள்வாக்கு
  rationale: இது சாதாரண கூற்று அல்லாமல், முறைமையானதும் தீர்க்கதரிசனத் தொனி கொண்டதுமான உரையைக் குறிக்கிறது; ‘அருள்வாக்கு’ அந்த உயர்ந்த தொனியைத் தமிழில் காக்கிறது.
- source_word: בֶּן יִשַׁי
  choice: ஈசாயின் மகன்
  rationale: வழக்கமான தந்தைவழி அடையாளத்தை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: הַגֶּבֶר
  choice: மனிதன்
  rationale: அடிப்படைப் பொருளைத் தக்கவைத்து, வலிமை அல்லது வீரத்தைக் குறிப்பாகச் சேர்த்து விளக்குவதைத் தவிர்க்கிறது.
- source_word: הֻקַם עָל
  choice: உயர்த்தப்பட்ட
  rationale: செயப்பாட்டு வடிவத்தையும் உயர்வு/மேன்மைப்படுத்தல் என்ற படிமத்தையும் சுருக்கமாகக் காக்கிறது.
- source_word: מְשִׁיחַ
  choice: அபிஷேகம் செய்யப்பட்டவர்
  rationale: இங்கு நேரடியாகத் தாவீதைக் குறிக்கும் அரசருக்குரிய அபிஷேகத்தை வெளிப்படுத்துகிறது; ‘மேசியா’ என்ற பிற்காலத் தலைப்பை முதன்மை உரைக்குள் முன்கூட்டியே புகுத்துவதில்லை.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: யாக்கோபின் கடவுள்
  rationale: எபிரெய இணைப்புத் தொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: נְעִים זְמִרוֹת יִשְׂרָאֵל
  choice: இஸ்ரவேலின் இனிய பாடகர்
  rationale: எபிரெயத் தொடரின் கவித்துவமான பாராட்டை இயல்பான தமிழில் தருகிறது; ‘சங்கீதக்காரர்’ என்று பின்னைய நூல் வகைப்பாட்டைத் திணிப்பதில்லை.
- source_word: וְאֵלֶּה
  choice: இவையே
  rationale: புதிய பகுதியை அறிமுகப்படுத்தும் இணைப்பை இயல்பான தமிழில் காட்டுகிறது; மூலத்தில் இல்லாத காலச் சுட்டியைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: מְשִׁיחַ என்பதை நேரடியான மேசியத் தலைப்பாக மொழிபெயர்க்க வேண்டுமா
  choice: அபிஷேகம் செய்யப்பட்டவர்
  alternative: மேசியா / அபிஷேகம் பெற்றவர்
  rationale: உடனடிச் சூழலில் குறிக்கப்படுபவர் தாவீது. ஆகவே வரலாற்று-அரசருக்குரிய பொருளை முதன்மை உரை காக்கிறது; அதேவேளை இச்சொல்லின் அரச-மேசிய ஒலிப்பை அடிக்குறிப்பு மறைக்காமல் குறிப்பிடுகிறது.
- issue: מְשִׁיחַ אֱלֹהֵי יַעֲקֹב என்பதில் செய்பவர்/உடைமை உறவை எவ்வாறு காட்டுவது
  choice: யாக்கோபின் கடவுளால் அபிஷேகம் செய்யப்பட்டவர்
  alternative: யாக்கோபின் கடவுளுடைய அபிஷேகம் செய்யப்பட்டவர்
  rationale: எபிரெய இணைப்புத் தொடர் இருவிதமாகச் சொல்லப்படக்கூடியிருந்தாலும், தமிழில் ‘கடவுளால் அபிஷேகம் செய்யப்பட்டவர்’ என்பது தாவீதின் தெய்வீக நியமனத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; மாற்றுவடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் பாடலின் உயர்ந்த, முறைமையான தொனியைத் தக்கவைத்தும் வடிவமைக்கப்பட்டது. பெயர்கள் தமிழ் வேதாகம மரபுக்கு ஏற்றவாறு ‘தாவீது’, ‘ஈசாய்’, ‘யாக்கோபு’ என வழங்கப்பட்டுள்ளன.
