base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/018.yaml
  text: Abishai[a], the brother of Joab son of Zeruiah, was chief of the Three. He wielded his spear against three hundred and killed them[b], and he had a name among the Three.
translation:
  language: ta
  text: செருயாவின் மகனான யோவாபின் சகோதரன் அபிசாய், மூவரின் தலைவனாக இருந்தான்.[a] அவன் தன் ஈட்டியை முந்நூறு பேருக்கு எதிராக ஓங்கி, அவர்களைக் கொன்றான்.[b] மூவரிடையே அவனுக்குப் புகழ் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய உரை: “மூவருக்குத் தலைவன்.” 1 நாளாகமம் 11:20-ல் உள்ள இணைப்பகுதியையும் இப்பகுதியின் உரைச்சிக்கலையும் கருத்தில் கொண்டு, சிலர் இதை “முப்பது பேருக்குத் தலைவன்” என்று புரிந்துகொள்கிறார்கள்.'
    reason: textual_variant
  - marker: b
    text: அல்லது, “தன் ஈட்டியை முந்நூறு பேருக்கு எதிராக உயர்த்தி, அவர்களைக் கொன்றான்.” எபிரெய வாசகம் சுருக்கமானது; சொல்லுக்குச் சொல், “முந்நூறு கொல்லப்பட்டவர்களுக்கு எதிராகத் தன் ஈட்டியை எழுப்பினான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ הַשְּׁלֹשִׁי
  choice: மூவருக்குத் தலைவன்
  rationale: רֹאשׁ என்பது ‘தலைவன்’ என்று பொருள்படும். மசோரா உரையின் வடிவத்தையும் வசனத்தின் இறுதியிலுள்ள בַּשְּׁלֹשָׁה என்பதையும் பின்பற்றி, சிக்கலான அடுத்த சொல்லை ‘மூவர்’ என முதன்மை உரையில் தக்கவைத்துள்ளோம்.
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: தன் ஈட்டியை ... எதிராக ஓங்கி
  rationale: עורר என்பதன் அடிப்படைப் பொருள் ‘எழுப்புதல்/தூண்டுதல்.’ போர்ச் சூழலில் ஈட்டியைப் பயன்படுத்திய செயலை இயல்பான தமிழில் ‘ஓங்கி’ எனக் கொடுத்துள்ளோம்.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: முந்நூறு பேருக்கு எதிராக ... அவர்களைக் கொன்றான்
  rationale: חָלָל என்பது குத்துண்டு அல்லது கொல்லப்பட்டவரைக் குறிக்கிறது. சுருக்கமான எபிரெய சொற்றொடரின் விளைவைத் தெளிவான தமிழில் வெளிப்படுத்துகிறது; அதன் சொற்சுருக்கம் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- source_word: וְלוֹ שֵׁם
  choice: அவன் புகழ்பெற்றிருந்தான்
  rationale: ‘அவனுக்கு ஒரு பெயர் இருந்தது’ என்ற எபிரெய மரபுத்தொடர் புகழ் அல்லது நற்பெயரைக் குறிக்கிறது. இயல்பான தமிழில் அதன் பொருள் வழங்கப்பட்டுள்ளது.
- source_word: בַּשְּׁלֹשָׁה
  choice: மூவருக்குள்
  rationale: בְּ முன்னொட்டுடன் வரும் எண்ணுப்பெயர் இங்கு ஒரு சிறப்புக் குழுவினரிடையே அவனுக்கிருந்த நிலையைச் சுட்டுகிறது.
- source_word: אֲבִישַׁי ... יוֹאָב ... צְרוּיָה
  choice: அபிசாய் ... யோவாப் ... செருயா
  rationale: தனிப்பெயர்கள் நவீனத் தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் வேதாகம ஒலிபெயர்ப்பு மரபின்படி வழங்கப்பட்டுள்ளன.
theological_decisions:
- issue: ‘மூவர்’ அல்லது ‘முப்பது பேர்’ என்ற உரைச்சிக்கல்
  choice: மூவர்
  alternative: முப்பது பேர்
  rationale: மசோரா உரையின் வாசகத்தையும் இதே வசனத்தின் இறுதிச் சொல்லையும் முதன்மைப்படுத்தி ‘மூவர்’ என வைத்துள்ளோம்; 1 நாளாகமம் 11:20-ன் இணைப்பகுதியும் இப்பகுதியின் உரைமரபுச் சிக்கலும் ஆதரிக்கும் மாற்றுக் கருத்து அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, கண்ணியமான மற்றும் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. எபிரெய உரையின் சுருக்கமும் உரைச்சிக்கலும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
