  yaml_path: translation/ot/2_samuel/023/034.yaml
  text: Eliphelet son of Ahasbai son of the Maacathite[a], Eliam son of Ahithophel the Gilonite.
translation:
  language: ta
  text: மாக்காத்தியனின் மகனான அகஸ்பாயின் மகன் எலிப்பெலேத்[a], கீலோனியனான அகித்தோப்பேலின் மகன் எலியாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பெயர்ப்பட்டியலில் உள்ள சொற்களின் தொடர்பை வேறுவிதமாகப் புரிந்துகொள்வதாலும், 1 நாளாகமம் 11:35–36-இல் உள்ள இணைப் பட்டியலுடன் ஒப்பிடுவதாலும், “மாக்காத்தியனான அகஸ்பாயின் மகன் எலிப்பெலேத், கீலோனியனான அகித்தோப்பேலின் மகன் எலியாம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִיפֶלֶט
  choice: எலிப்பெலேத்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பை நவீனத் தமிழில் இயன்றவரை நேரடியாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: בֶּן
  choice: மகன் / மகனாகிய
  rationale: பெயர்ப்பட்டியல் மற்றும் வம்சத் தொடர்புச் சூழலில் நேரடியான தந்தை–மகன் உறவைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: אֲחַסְבַּי
  choice: அகஸ்பாய்
  rationale: எபிரெயத் தனிப்பெயர் தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: הַמַּעֲכָתִי
  choice: மாக்காத்தியன்
  rationale: மாக்கா பகுதி அல்லது மக்களுடன் தொடர்புடைய இன/இட அடையாளப் பெயரடை என்பதைப் பெயர்ச்சொல் வடிவில் பாதுகாக்கிறது.
- source_word: אֱלִיעָם
  choice: எலியாம்
  rationale: எபிரெயத் தனிப்பெயர் தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: אֲחִיתֹפֶל
  choice: அகித்தோப்பேல்
  rationale: எபிரெயத் தனிப்பெயர் தமிழில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: הַגִּלֹנִי
  choice: கீலோனியனான
  rationale: கீலோ ஊரைச் சார்ந்தவர் என்னும் இட அடையாளத்தை எபிரெயப் பெயரடை அமைப்புக்கு நெருக்கமாகப் பாதுகாக்கிறது.
