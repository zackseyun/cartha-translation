base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/011.yaml
  text: After him was Shammah son of Agee the Hararite. The Philistines gathered together at Lehi[a], where there was a plot of ground full of lentils, and the people fled from before the Philistines.
translation:
  language: ta
  text: அவனுக்குப் பின், ஆகேயின் மகனான ஹராரியன் சம்மா இருந்தான். பெலிஸ்தியர்கள் போருக்காக[a] ஒன்றுகூடினார்கள். அங்கே பருப்பு நிறைந்த ஒரு வயல் பகுதி இருந்தது; மக்கள் பெலிஸ்தியர்களிடமிருந்து தப்பியோடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: לַחַיָּה என்ற எபிரெயச் சொற்றொடரின் பொருள் உறுதியற்றது. இது ‘போருக்காக’ என்று பொருள்படலாம்; வேறு சிலர் இதை ‘ஒரு படைப்பிரிவாக’ அல்லது ‘லேகியில்’ என்றும் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: அவனுக்குப் பின்
  rationale: வலிமைமிக்க வீரர்களின் பட்டியலில் வரும் சுருக்கமான தொடர்ச்சிக் குறிப்பை, எபிரெயத்தில் இல்லாத வினைச்சொல்லைச் சேர்க்காமல் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: שַׁמָּא בֶן־אָגֵא הָרָרִי
  choice: ஆகேயின் மகனான ஆராரியன் சம்மா
  rationale: தனிப்பெயர்களைத் தமிழுக்கு ஏற்றவாறு ஒலிபெயர்த்து, הָרָרִי என்பதை குல அல்லது பிரதேச அடையாளமாகப் பாதுகாக்கிறது.
- source_word: וַיֵּאָסְפוּ
  choice: ஒன்றுகூடினார்கள்
  rationale: இந்த இராணுவச் சூழலில் ‘திரண்டார்கள்/ஒன்றுகூடினார்கள்’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לַחַיָּה
  choice: போருக்காக
  rationale: சொல் கடினமானது; 1 நாளாகமம் 11:13-இன் இணைப்பகுதியும் இங்குள்ள இராணுவச் சூழலும் நோக்கத்தின் பொருளாக ‘போருக்காக’ என்பதை ஆதரிக்கின்றன. மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: ஒரு வயல் பகுதி
  rationale: חֶלְקָה குறிக்கும் வயலின் குறிப்பிட்ட நிலப்பகுதியைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: מְלֵאָה עֲדָשִׁים
  choice: பருப்பு நிறைந்த
  rationale: ‘பருப்பால் நிறைந்த’ என்ற எபிரெய நேரடிக் கருத்தைப் பாதுகாக்கிறது; ‘பயிரிடப்பட்ட’ என்று விளக்கமாக விரிவாக்கவில்லை.
- source_word: וְהָעָם
  choice: மக்களோ
  rationale: சூழலில் இது இஸ்ரவேலரின் படையினரைக் குறிக்கக்கூடும்; எனினும் எபிரெயத்தின் பொதுவான ‘மக்கள்’ என்ற சொல்லை அளவுக்கு மீறிக் குறிப்பாக்காமல் பாதுகாக்கிறது.
- source_word: נָס מִפְּנֵי
  choice: முன்பாகத் தப்பியோடினார்கள்
  rationale: எதிரியின் முன்னிலையிலிருந்து ஓடுதல் என்ற எபிரெய மரபுத்தொடரைப் புரியக்கூடிய தமிழில் நெருக்கமாகத் தருகிறது.
