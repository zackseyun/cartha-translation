  register: நவீனத் தரத் தமிழில், சுருக்கமான வரலாற்று நடையைப் பேணி மொழிபெயர்க்கப்பட்டுள்ளது. பெயர்கள் மரியாதையான வேதாகம ஒலிபெயர்ப்பு மரபுக்கு அருகில் வைக்கப்பட்டுள்ளன; கடினமான לַחַיָּה என்பதன் உண்மையான தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
