lexical_decisions:
- source_word: חֶלֶץ
  choice: ஏலேஸ்
  rationale: எபிரெயத் தனிப்பெயரைத் தமிழில் ஒலிபெயர்த்துள்ளது; தொடக்க ח ஒலி இப்பெயரில் ‘ஏ’ என இயல்பாகக் கொண்டுவரப்பட்டுள்ளது.
- source_word: הַפַּלְטִי
  choice: பல்தியனான
  rationale: இடம் அல்லது குலச் சார்பைக் குறிக்கும் வரையறைச் சொல்லைச் சுருக்கமான தமிழ் அடைமொழியாக வழங்குகிறது; மசோரெட்டிக் உரையின் ‘பல்தி’ வாசிப்பைப் பின்பற்றுகிறது.
- source_word: עִירָא
  choice: ஈரா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: בֶן
  choice: மகன்
  rationale: வம்ச அடையாளத்தில் வரும் எபிரெய உறவுச் சொல்லுக்கான நேரடியும் இயல்புமான தமிழ் இணைச்சொல்.
- source_word: עִקֵּשׁ
  choice: இக்கேஸ்
  rationale: எபிரெயத் தனிப்பெயரை ஒலிபெயர்த்து, மெய்யொலியின் வலிமையை இரட்டித்த ‘க்’ மூலம் காட்டுகிறது.
- source_word: הַתְּקוֹעִי
  choice: தெக்கோவாவைச் சேர்ந்த
  rationale: தெக்கோவா ஊரைச் சேர்ந்தவர் என்பதைக் குறிக்கும் இன/இட அடைமொழியை நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
