  source_fidelity: திருத்தம் தேவை. חֶלֶץ என்பதன் தொடக்க ח ஒலியைத் தவிர்த்து “ஏலேஸ்” என வழங்குவது மூல ஒலிப்புக்கு நெருக்கமல்ல; “ஹெலெஸ்” பொருத்தமானது. עִקֵּשׁ என்பதையும் “இக்கேஷ்” எனத் துல்லியமாக ஒலிபெயர்க்கலாம். மற்ற உறவுமுறை மற்றும் தெக்கோவா சார்புக் குறிப்பு மூலத்துடன் பொருந்துகின்றன.
  naturalness: “பல்தியனான” இயல்பான நவீனத் தமிழ் அடைமொழியாக உள்ளது. இரண்டாவது பெயர்தொடரில் தெக்கோவா சார்பு ஈராவுக்கே உரியது என்பதைத் தெளிவாக்குவதற்காகச் சொல் வரிசை சிறிது மாற்றப்பட்டுள்ளது; பட்டியல் பாங்கும் அரைப்புள்ளியும் պահպանிக்கப்படுகின்றன.
  terminology: தனிப்பெயர்கள் ஹெலெஸ், ஈரா, இக்கேஷ் என ஒலிபெயர்க்கப்பட்டுள்ளன. הַפַּלְטִי-க்கு “பல்தியனான” எனவும், הַתְּקוֹעִי-க்கு “தெக்கோவாவைச் சேர்ந்தவர்” எனவும் வழங்குவது பெயரியல்/இடச்சார்புக் குறியை பாதுகாக்கிறது. மாற்று வாசிப்பு குறித்த அடிக்குறிப்பு மூலத்தின் உரைநிலைத் தெளிவின்மையைச் சரியாகக் காக்கிறது.
