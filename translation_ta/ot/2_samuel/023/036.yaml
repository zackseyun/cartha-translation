lexical_decisions:
- source_word: יִגְאָל
  choice: இகால்
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரெய ஒலிப்புக்கு ஏற்றவாறு தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן
  choice: மகன்
  rationale: பெயர்ப்பட்டியலில் தந்தை–மகன் உறவைக் குறிக்கும் வழக்கமான எபிரெயச் சொல்.
- source_word: נָתָן
  choice: நாத்தான்
  rationale: தனிப்பட்ட நபரின் பெயர்; தமிழில் நிலைபெற்ற வேதாகமப் பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: מִצֹּבָה
  choice: சோபாவிலிருந்து வந்த
  rationale: מִן முன்னொட்டு பொதுவாகப் புறப்பட்ட இடம் அல்லது தோற்றத்தைச் சுட்டுகிறது; இங்கு புவியியல் பிறப்பிடத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது. தொடர்பைக் குறிக்கும் பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டது.
- source_word: בָּנִי
  choice: பானி
  rationale: தனிப்பட்ட நபரின் பெயர்; எபிரெய வடிவத்துக்கு ஏற்ற தமிழ் ஒலிபெயர்ப்பு.
- source_word: הַגָּדִי
  choice: காத் கோத்திரத்தானான
  rationale: காத் குலம் அல்லது கோத்திரத்தைச் சேர்ந்த ஒருவரைக் குறிக்கும் இனப்பெயரடை; சாதாரண தமிழ் வாசகருக்குத் தெளிவாகக் கோத்திரச் சார்பை வெளிப்படுத்துகிறது.
