lexical_decisions:
- source_word: אֽוּרִיָּה
  choice: உரியா
  rationale: எபிரேயத் தனிப்பெயர் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டது.
- source_word: הַחִתִּי
  choice: இத்தியனான
  rationale: உறுதியான சுட்டுடன் வரும் இன அடையாளத்தை, உரியாவைக் குறிப்பிடும் இயல்பான தமிழ் பெயரடைத் தொடராக வழங்குகிறது.
- source_word: כֹּל
  choice: மொத்தம்
  rationale: முந்தைய பெயர்ப்பட்டியலின் இறுதி எண்ணிக்கையைச் சுருக்கிக் கூறும் எபிரேயச் சொல்லின் ஆற்றலைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: שְׁלֹשִׁים וְשִׁבְעָה
  choice: முப்பத்தேழு பேர்
  rationale: வீரர்களின் மொத்த எண்ணிக்கையாதலால், எண்ணைத் துல்லியமாகவும் தமிழில் இயல்பாகவும் ‘பேர்’ என்ற மனிதர் எண்ணும் சொல்லுடன் வழங்குகிறது.
