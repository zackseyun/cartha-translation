lexical_decisions:
- source_word: אֲבִי עַלְבוֹן
  choice: அபி-அல்போன்
  rationale: இது ஒருவரின் இயற்பெயர் என்பதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது. எபிரெயச் சொற்களின் இணைப்பைத் தெளிவாகக் காட்ட இடைக்கோடு வைக்கப்பட்டது.
- source_word: הָעַרְבָתִי
  choice: அர்பாத்தியனான
  rationale: இது அர்பாத் அல்லது அரபா என்ற இடத்துடன் தொடர்புடைய ஒருவரைக் குறிக்கும் இடப்பெயர்சார் அடைமொழி. மூலத்தின் தெளிவின்மையைத் தீர்த்துவிடாமல் ‘அர்பாத்தியன்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: עַזְמָוֶת
  choice: அஸ்மாவேத்
  rationale: இது ஒருவரின் இயற்பெயர் என்பதால், எபிரெய உச்சரிப்பை அணுகிய தமிழ்ச் சொல்வடிவில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַבַּרְחֻמִי
  choice: பர்கூமியனான
  rationale: மசோரா உரையின் மெய்யெழுத்துகளையும் உயிர்க்குறிப்புகளையும் பின்பற்றி, இடப்பெயர்சார் அடைமொழியாக ஒலிபெயர்க்கப்பட்டது.
