  yaml_path: translation/ot/2_samuel/023/009.yaml
  text: And after him was Eleazar son of Dodo[a], son of Ahohi, among the three mighty men with David, when they taunted the Philistines who had gathered there for battle[c][b], and the men of Israel had gone up.
translation:
  language: ta
  text: அவனுக்கு அடுத்தபடியாக, அகோகியின் மகனான தோதோவின் மகன் எலெயாசார்[a] இருந்தான். தாவீதோடு இருந்த மூன்று மாவீரர்களில் அவனும் ஒருவன். போருக்காக அங்கே திரண்டிருந்த பெலிஸ்தியரை அவர்கள் பழித்தபோது[b], இஸ்ரயேல் ஆண்கள் மேலே சென்றனர்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அகோகியனின் மகனான தோதாயின் மகன் எலெயாசார்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்கள் பெலிஸ்தியருக்குச் சவால் விட்டபோது.”
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், “இஸ்ரயேல் ஆண்கள் மேலே சென்றனர்”; இச்சூழலில் இது அவர்கள் போர்க்களத்திலிருந்து பின்வாங்கியதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/אחר/ו
  choice: அவனுக்கு அடுத்தபடியாக ... இருந்தான்
  rationale: அடுத்த வீரனை வரிசையில் அறிமுகப்படுத்தும் எபிரெயச் சொற்றொடர்; தமிழில் இயல்பாக அமைய ‘இருந்தான்’ சேர்க்கப்பட்டுள்ளது.
- source_word: אֶלְעָזָר
  choice: எலெயாசார்
  rationale: தனிப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பு.
- source_word: בֶּן דדי בֶּן אֲחֹחִי
  choice: அகோகியின் மகனான தோதோவின் மகன்
  rationale: மெய்யெழுத்து மூலத்தை தனிப்பெயர்களின் வம்சத் தொடராக எடுத்துக்கொள்கிறது; வேறு வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בִּ/שְׁלֹשָׁה גברים
  choice: மூன்று மாவீரர்களில் அவனும் ஒருவன்
  rationale: இங்கு גברים என்பது சாதாரண ஆண்களை அல்ல, தாவீதின் புகழ்பெற்ற போர்வீரர் மூவரைக் குறிக்கிறது; உறுப்பினராக இருப்பதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: עִם דָּוִד
  choice: தாவீதோடு இருந்த
  rationale: உடனிருத்தல் அல்லது இணைந்திருத்தல் என்ற நேரடிப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בְּ/חָֽרְפָם
  choice: அவர்கள் பழித்தபோது
  rationale: חרף என்பதன் மையப் பொருளான பழித்தல் அல்லது இகழ்ந்து எதிர்கொள்ளுதல் பாதுகாக்கப்படுகிறது; போர் சூழலுக்குரிய ‘சவால் விடுதல்’ அடிக்குறிப்பில் மாற்றாகத் தரப்பட்டுள்ளது.
- source_word: בַּ/פְּלִשְׁתִּים
  choice: பெலிஸ்தியரை
  rationale: மக்கள் இனப்பெயரின் வழக்கமான தமிழாக்கம்.
- source_word: נֶאֶסְפוּ שָׁם לַ/מִּלְחָמָה
  choice: போருக்காக அங்கே திரண்டிருந்த
  rationale: நிபால் வடிவம் பெலிஸ்தியர்கள் போருக்காக அங்கே ஒன்றுகூடியதைச் சொல்கிறது; தமிழில் தொடர்பெயர் அமைப்பாக வழங்கப்பட்டுள்ளது.
- source_word: וַֽ/יַּעֲל֖וּ אִ֥ישׁ יִשְׂרָאֵֽל
  choice: இஸ்ரயேல் வீரர்கள் மேலே சென்றுவிட்டனர்
  rationale: עלה என்பதன் நேரடிப் பொருளான ‘மேலே செல்லுதல்’ முதன்மை உரையில் வைக்கப்பட்டுள்ளது; சூழலில் இது பின்வாங்குதலைக் குறிக்கலாம் என்பதால் அந்த வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
