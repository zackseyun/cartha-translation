- source_word: חֵלֶב
  choice: ஏலேப்
  rationale: தனிப்பட்ட பெயரை மொழிபெயர்க்காமல், எபிரெய ஒலிவடிவத்தைத் தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: בֶּן
