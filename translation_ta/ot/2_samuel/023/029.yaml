  text: நெத்தோபாத்தியனான பானாவின் மகன் ஹெலேப்; பென்யமீன் மக்களின் கிபியாவிலிருந்து வந்த ரிபாயின் மகன் இத்தாய்[a];
  philosophy: optimal-equivalence
