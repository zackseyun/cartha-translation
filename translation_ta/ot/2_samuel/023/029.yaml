    text: அல்லது, ‘பென்யமீனியரின் கிபியாவிலிருந்து வந்தவர்.’ எபிரெயத்தில் சொல்லுக்குச் சொல், ‘பென்யமீன் மக்களின் கிபியாவிலிருந்து’ என்று உள்ளது.
