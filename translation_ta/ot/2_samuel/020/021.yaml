base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/021.yaml
  text: That is not the matter[a]. Rather, a man from the hill country of Ephraim, Sheba son of Bichri by name, has raised his hand against the king, against David. Hand him over alone, and I will withdraw from the city.” And the woman said to Joab, “Look[b], his head will be thrown to you over the wall.”
translation:
  language: ta
  text: “அப்படியல்ல. மாறாக, எப்பிராயீம் மலைநாட்டைச் சேர்ந்த[a] பிக்கிரியின் மகன் சேபா என்னும் ஒருவன் அரசனாகிய தாவீதுக்கு எதிராகத் தன் கையை உயர்த்தியிருக்கிறான்[b]. அவனை மட்டும் ஒப்படையுங்கள்; நான் இந்த நகரத்தைவிட்டு விலகிச் செல்வேன்.” அப்போது அந்தப் பெண் யோவாபிடம், “இதோ, அவனுடைய தலை மதிலுக்கு அப்பால் உம்மிடம் எறியப்படும்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எப்பிராயீம் மலையிலிருந்து.” இச்சொற்றொடர் பொதுவாக எப்பிராயீமின் மலைப்பாங்கான பிரதேசத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இது கலகம் செய்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர்; சொல்லுக்குச் சொல், “தன் கையை உயர்த்தியிருக்கிறான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן הַדָּבָר
  choice: அப்படியல்ல
  rationale: முந்தைய கூற்றை மறுக்கும் எபிரெயச் சொற்றொடரின் பொருளை இயல்பான, சுருக்கமான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: מֵהַר אֶפְרַיִם
  choice: எப்பிராயீம் மலைநாட்டைச் சேர்ந்த
  rationale: இது பொதுவாக ஒரே மலைச்சிகரத்தைக் குறிக்காமல் எப்பிராயீமின் மலைப்பாங்கான பிரதேசத்தைக் குறிக்கிறது.
- source_word: שֶׁבַע בֶּן בִּכְרִי שְׁמוֹ
  choice: பிக்கிரியின் மகன் சேபா என்னும் ஒருவன்
  rationale: பெயரிடும் சூத்திரத்தைத் தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: נָשָׂא יָדוֹ
  choice: தன் கையை உயர்த்தியிருக்கிறான்
  rationale: கலகம் அல்லது பகைமை கொண்ட எதிர்ப்பைக் குறிக்கும் மூலமொழியின் உருவகத்தை முதன்மை உரையில் பாதுகாக்கிறது.
- source_word: בַּמֶּלֶךְ בְּדָוִד
  choice: அரசனாகிய தாவீதுக்கு எதிராக
  rationale: ‘அரசன்’ மற்றும் ‘தாவீது’ ஒரே நபரைக் குறிக்கும் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תְּנוּ אֹתוֹ לְבַדּוֹ
  choice: அவனை மட்டும் ஒப்படையுங்கள்
  rationale: நகரத்திலுள்ள மற்றவர்களை அல்ல, சேபாவை மட்டுமே ஒப்படைக்க வேண்டும் என்ற கட்டளையின் வரம்பைத் தெளிவாகக் காக்கிறது.
- source_word: וְאֵלְכָה מֵעַל הָעִיר
  choice: நான் இந்த நகரத்தைவிட்டு விலகிச் செல்வேன்
  rationale: முற்றுகைச் சூழலில் நகரத்தைத் தாக்கும் நிலையிலிருந்து படையுடன் விலகுவதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: அடுத்து நிகழவிருப்பதை வலியுறுத்திக் காட்டும் மூலமொழியின் உரையாடல் அடையாளத்தைத் தக்கவைக்கிறது.
- source_word: רֹאשׁוֹ מֻשְׁלָךְ אֵלֶיךָ בְּעַד הַחוֹמָה
  choice: அவனுடைய தலை மதிலுக்கு மேலே உம்மிடம் எறியப்படும்
  rationale: செயப்பாட்டு வினை வடிவத்தையும், உடனடியாக நிறைவேற்றப்படவிருக்கும் வாக்குறுதியையும், மதிலுக்கு அப்பால் யோவாபை நோக்கி எறிவதையும் வெளிப்படுத்துகிறது.
