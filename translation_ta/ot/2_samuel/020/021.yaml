translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலமொழியின் ‘கையை உயர்த்துதல்’ என்ற உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் கலகப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. யோவாபை நேரடியாக அழைக்கும் இடத்தில் மரியாதை ஒருமை ‘உம்மிடம்’ பயன்படுத்தப்பட்டுள்ளது.
