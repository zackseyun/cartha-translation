  yaml_path: translation/ot/2_samuel/020/005.yaml
  text: So Amasa went to summon Judah[a], but he delayed beyond the appointed time that he had set for him.
translation:
  language: ta
  text: ஆகவே அமாசா யூதாவை அவசரமாகக் கூட்டிவரப் புறப்பட்டான்[a]; ஆனால் அவனுக்குக் குறித்திருந்த காலத்தைக் கடந்தும் அவன் தாமதித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதாவை அணிதிரட்ட.” எபிரெய வினைச்சொல் மக்களை அவசரமாக ஒன்றுகூட அழைப்பதைக் குறிக்கலாம்; இச்சூழலில் அது இராணுவ அணிதிரட்டலையும் உள்ளடக்கியிருக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: புறப்பட்டான்
  rationale: הלך என்பதன் தொடர் நிகழ்வைக் குறிக்கும் வடிவம் அமாசாவின் செயலை அறிமுகப்படுத்துகிறது. இச்சூழலில் ‘புறப்பட்டான்’ என்பது நோக்கத்துடன் சென்றதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְהַזְעִיק
  choice: அவசரமாகக் கூட்டிவர
  rationale: זעק என்பதன் ஹிப்இல் வடிவம் மக்களை அவசரமாக ஒன்றுகூட அழைப்பதைக் குறிக்கிறது. ‘அவசரமாகக் கூட்டிவர’ என்பது அதிகாரபூர்வ அழைப்பையும் அவசரத்தையும் காக்கிறது; இராணுவ அணிதிரட்டல் என்ற நுண்பொருளை முதன்மை உரையில் மிகையாகத் தீர்மானிப்பதில்லை.
- source_word: אֶת יְהוּדָה
  choice: யூதாவை
  rationale: இங்கு ‘யூதா’ என்பது யூதா மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் தொகுப்புப் பெயர். எபிரெய உரையின் சுருக்கத்தைக் காக்கத் தமிழிலும் ‘யூதாவை’ என வழங்கப்படுகிறது.
- source_word: וייחר
  choice: தாமதித்தான்
  rationale: இச்சூழலில் אחר என்பது எதிர்பார்க்கப்பட்ட நேரத்திற்குப் பிந்திவிடுதல் அல்லது தாமதித்தலைக் குறிக்கிறது. ‘தாமதித்தான்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מִן הַמּוֹעֵד
  choice: குறித்திருந்த காலத்தைக் கடந்தும்
  rationale: מוֹעֵד என்பது நிர்ணயிக்கப்பட்ட அல்லது குறிக்கப்பட்ட காலத்தைக் குறிக்கிறது; מן உடனான தொடரமைப்பு அந்தக் காலவரம்பை மீறியதைத் தெரிவிக்கிறது.
- source_word: אֲשֶׁר יְעָדוֹ
  choice: அவனுக்குக் குறித்திருந்த
  rationale: יעד என்பது காலத்தை நியமித்தல் அல்லது குறித்தல். பின்னொட்டு அமாசாவைக் குறிக்கிறது; முந்தைய வசனத்தில் தாவீது காலக்கெடு விதித்திருப்பதால், தமிழில் செய்பவரை வெளிப்படையாகச் சேர்க்காமல் எபிரெய உரையின் அமைப்பும் சூழலின் தெளிவும் காக்கப்படுகின்றன.
