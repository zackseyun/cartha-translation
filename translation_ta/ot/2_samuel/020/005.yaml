  source_fidelity: 'மூல எபிரெய உரையின் நிகழ்வுவரிசையும் பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: அமாசா யூதாவைக் கூட்டுவதற்குப் புறப்படுகிறான்; பின்னர், அவனுக்காக முன்குறிக்கப்பட்ட நேரத்தைத் தாண்டி தாமதிக்கிறான். לְהַזְעִיק என்பதிலுள்ள அவசரக் கூட்டழைப்பின் நுணுக்கம் ‘அவசரமாகக் கூட்டிவர’ என்பதில் போதுமானவாறு வெளிப்படுகிறது. யூதா என்பது கூட்டுப்பெயராகவே மொழிபெயர்க்கப்பட்டுள்ளது. ‘அவனுக்குக் குறித்திருந்த’ என்பது முந்தைய வசனத்தில் தாவீது அமாசாவுக்குக் குறித்த காலத்தைச் சூழலின்படி தெளிவாகச் சுட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத செய்பவரைச் சேர்ப்பதில்லை.'
