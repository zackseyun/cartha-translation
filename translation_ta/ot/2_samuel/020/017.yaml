source:
  edition: WLC
  text: וַ/יִּקְרַ֣ב אֵלֶ֔י/הָ וַ/תֹּ֧אמֶר הָ/אִשָּׁ֛ה הַ/אַתָּ֥ה יוֹאָ֖ב וַ/יֹּ֣אמֶר אָ֑נִי וַ/תֹּ֣אמֶר ל֗/וֹ שְׁמַע֙ דִּבְרֵ֣י אֲמָתֶ֔/ךָ וַ/יֹּ֖אמֶר שֹׁמֵ֥עַ אָנֹֽכִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/017.yaml
  text: He came near to her[a], and the woman said, “Are you Joab?” He said, “I am.” Then she said to him, “Listen to the words of your servant.” He said, “I am listening.”
translation:
  language: ta
  text: அவன் அவளருகே வந்தான். அந்தப் பெண், “நீர்தான் யோவாபா?” என்று கேட்டாள். அவன், “நான்தான்” என்றான். அப்போது அவள் அவனிடம், “உமது பணிப்பெண்ணின்[a] வார்த்தைகளைக் கேளும்” என்றாள். அவன், “நான் கேட்டுக்கொண்டிருக்கிறேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது அடிமைப் பெண்ணின்.” இங்கு பயன்படுத்தப்பட்டுள்ள எபிரெயச் சொல், ஒரு பெண் தன்னைத் தாழ்மையுடனும் பணிவுடனும் குறிப்பிடும் சொல்லாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב אֵלֶיהָ
  choice: அவன் அவளருகே வந்தான்
  rationale: קרב என்பதன் நேரடியான அணுகுதல் சார்ந்த பொருளையும், אֵלֶיהָ குறிக்கும் அவளை நோக்கிய திசையையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: இச்சூழலில் אִשָּׁה என்பது மனைவியைக் குறிப்பதல்ல; முன்பே அறிமுகமான பெண்ணைக் குறிக்கிறது. ஆகவே ‘அந்தப் பெண்’ இயல்பானது.
- source_word: הַאַתָּה יוֹאָב
  choice: நீர்தான் யோவாபா?
  rationale: வினாவுடன் வரும் தனிப்பட்ட சுட்டுப்பெயரின் அடையாளம் காணும் வலியுறுத்தலை ‘நீர்தான்’ காக்கிறது; மரியாதை ஒருமையான ‘நீர்’ உரையாடலின் சமூகத் தொனிக்குப் பொருந்துகிறது.
- source_word: אָנִי
  choice: நான்தான்
  rationale: தனித்து நிற்கும் சுட்டுப்பெயர் சுருக்கமான சுய அடையாளப் பதிலாக உள்ளது; ‘நான்தான்’ தமிழில் இயல்பாக அதைப் பிரதிபலிக்கிறது.
- source_word: שְׁמַע
  choice: கேளும்
  rationale: இங்கு שמע என்பது வெறுமனே ஒலியைக் கேட்பதல்ல, கவனித்துக் கேட்கும்படி கூறும் கட்டளை. ‘கேளும்’ மரியாதையுடனான நேரடி வேண்டுகோள்/கட்டளையாக அமைகிறது.
- source_word: דִּבְרֵי
  choice: வார்த்தைகளை
  rationale: דבר என்பதன் பன்மை வடிவத்தை ‘வார்த்தைகள்’ நேரடியாகக் காக்கிறது; ‘செய்தி’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: אֲמָתֶךָ
  choice: உமது பணிப்பெண்ணின்
  rationale: אָמָה என்பது பெண்பால் பணியாளர்/அடிமைப் பெண்ணைக் குறிக்கும் சொல்லாகவும், இங்கு தாழ்மையான சுயக் குறிப்பாகவும் உள்ளது. ‘பணிப்பெண்’ பாலினத்தையும் பணிவுத் தொனியையும் காக்கிறது.
- source_word: שֹׁמֵעַ אָנֹכִי
  choice: நான் கேட்டுக்கொண்டிருக்கிறேன்
  rationale: பங்கெச்ச வடிவமும் வெளிப்படையான சுட்டுப்பெயரும் தொடரும் கவனத்தைக் காட்டுகின்றன; இத்தமிழ் வடிவம் அந்த நிகழ்காலத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
