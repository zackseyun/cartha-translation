translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. யோவாபை நோக்கிய உரையில் மரியாதை ஒருமையான ‘நீர்/உமது’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘பணிப்பெண்’ என்ற சொல் மூலத்தின் பெண்பாலையும் தாழ்மையான சமூகத் தொனியையும் காக்கிறது; அதன் வலுவான ‘அடிமைப் பெண்’ மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
