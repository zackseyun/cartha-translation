base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/011.yaml
  text: And one of Joab’s young men stood over him and said[a], “Whoever favors Joab, and whoever is for David[b], follow Joab!”
translation:
  language: ta
  text: யோவாபின் இளைஞர்களில் ஒருவன்[b] அவனருகே நின்று, “யோவாபை ஆதரிக்கிறவனும் தாவீதின் பக்கம் இருக்கிறவனும் யோவாபைப் பின்தொடரட்டும்[a]!” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “யோவாபுக்குப் பின்னால்.” சூழலில் இது யோவாபின் பின்னால் அணிதிரண்டு செல்லும்படியான அழைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “இளைஞர்கள்” என்பதை “பணியாளர்கள்” அல்லது “உதவியாளர்கள்” என்றும் மொழிபெயர்க்கலாம்; இங்கு யோவாபுக்குக் கீழ்ப்பட்ட ஆட்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: ஒருவன்
  rationale: אִישׁ என்பது சொற்பொருளில் ‘ஒரு மனிதன்’; இங்கு யோவாபின் ஆட்களில் குறிப்பிட்டுப் பெயரிடப்படாத ஒருவனை அறிமுகப்படுத்துவதால் ‘ஒருவன்’ இயல்பானது.
- source_word: עָמַד עָלָיו
  choice: அவனருகே நின்று
  rationale: עמד உடன் עַל வரும்போது ஒருவருக்கு மேலாகவோ அருகிலோ நிற்பதைக் குறிக்கலாம். விழுந்துகிடந்த அமாசாவின் உடலருகே நிலைகொண்ட காட்சியைத் தமிழில் இயல்பாகச் சொல்வதற்கு ‘அவனருகே நின்று’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִנַּעֲרֵי יוֹאָב
  choice: யோவாபின் இளைஞர்களில்
  rationale: נַעַר என்பதற்கு இளைஞன், பணியாள், உதவியாளர் போன்ற பொருள்கள் உண்டு. எபிரெயச் சொல்லின் வெளிப்படையான பொருளைத் தக்கவைத்தபடி, யோவாபுக்குக் கீழ்ப்பட்ட வீரர்களைக் குறிக்கும் வகையில் ‘இளைஞர்கள்’ பயன்படுத்தப்பட்டது.
- source_word: מִי אֲשֶׁר חָפֵץ בְּיוֹאָב
  choice: யோவாபை ஆதரிக்கிறவன்
  rationale: חָפֵץ என்பது விரும்புதல் அல்லது ஆதரித்தல் எனப் பொருள்படும். இங்குள்ள அணிதிரட்டும் முழக்கத்தில் யோவாபுக்கான பற்றையும் ஆதரவையும் ‘ஆதரிக்கிறவன்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וּמִי אֲשֶׁר לְדָוִד
  choice: தாவீதின் பக்கம் இருக்கிறவன்
  rationale: לְדָוִד இங்கு தாவீதுக்கான விசுவாசம் அல்லது அணி சார்பை உணர்த்துகிறது; ‘தாவீதின் பக்கம்’ என்பது அதன் அரசியல் மற்றும் படைச்சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אַחֲרֵי יוֹאָב
  choice: யோவாபைப் பின்தொடரட்டும்
  rationale: אַחֲרֵי என்பதன் நேரடிப் பொருள் ‘யோவாபுக்குப் பின்னால்.’ இங்கு அது அணிதிரண்டு அவரைப் பின்பற்றும்படி விடுக்கப்படும் அழைப்பு என்பதால், தமிழில் தேவைப்படும் வினைச்சொல்லை வெளிப்படையாகச் சேர்த்து ‘பின்தொடரட்டும்’ என மொழிபெயர்க்கப்பட்டது.
