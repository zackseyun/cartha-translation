base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/018.yaml
  text: Then she said[a], “They used to say in former times[b], ‘Let them surely ask at Abel,’ and so they ended the matter.”
translation:
  language: ta
  text: 'அப்போது அவள் சொன்னாள்[a]: “முற்காலத்தில், ‘ஆபேலில்[b] நிச்சயமாக விசாரிப்பார்கள்’ என்று சொல்வது வழக்கம்; இவ்வாறே அவர்கள் காரியத்தை முடிவுக்குக் கொண்டுவந்தார்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய உரையில் “சொல்,” “கேள்” ஆகிய இரு வினைகளும் வலியுறுத்தும் சிறப்பு அமைப்பில் உள்ளன. இதை, “முற்காலத்தில் அவர்கள், ‘ஆபேலில் நிச்சயமாக விசாரிப்பார்கள்’ என்று சொல்லுவார்கள்; இவ்வாறே அவர்கள் அதை முடிவுக்குக் கொண்டுவருவார்கள்” என்றும் மொழிபெயர்க்கலாம். மேற்கோளுக்குள் உள்ள வினை கட்டளைத் தொனியாகவும் புரிந்துகொள்ளப்படலாம்: “ஆபேலில் நிச்சயமாக விசாரிக்கட்டும்.” இறுதி வினைச்சொல்லை இன்னும் நேரடியாக “முடித்தார்கள்” அல்லது “முடிவுக்குக் கொண்டுவந்தார்கள்” என மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
  - marker: b
    text: “ஆபேல்” என்பது இச்சூழலில் முற்றுகையிடப்பட்டுள்ள ஆபேல்-பெத்-மாக்கா நகரத்தின் சுருக்கப் பெயர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר לֵאמֹר
  choice: அப்போது அவள் சொன்னாள்
  rationale: வழக்குரைத் தொடரில் அப்பெண்ணின் பேச்சு தொடர்வதை இயல்பான நவீனத் தமிழில் காட்டுகிறது; לֵאמֹר தனிச் சொல்லாக அல்லாமல் நேர்கூற்றின் நிறுத்தக்குறியால் வெளிப்படுத்தப்படுகிறது.
- source_word: דַּבֵּר יְדַבְּרוּ
  choice: சொல்வது வழக்கம்
  rationale: இன்ஃபினிட்டிவ் அப்சல்யூட் மற்றும் இம்பர்ஃபெக்ட் இணைவு வலியுறுத்தலையும் பழக்கமான கடந்தகாலச் சொல்லாடலையும் தருகிறது. பழமொழிபோன்ற இச்சூழலில் ‘சொல்வது வழக்கம்’ இயல்பாக அந்தப் பொருளைத் தெரிவிக்கிறது.
- source_word: בָרִאשֹׁנָה
  choice: முற்காலத்தில்
  rationale: ஒரு செயலின் முதல் கட்டத்தை அல்ல, பழைய காலத்து வழக்கத்தையோ முன்னுதாரணத்தையோ குறிக்கிறது.
- source_word: שָׁאֹל יְשָׁאֲלוּ
  choice: கேட்டுத்தான் தெரிந்துகொள்ள வேண்டும்
  rationale: שאל என்பதன் ‘கேள்/விசாரி’ என்ற பொருளையும், இன்ஃபினிட்டிவ் அப்சல்யூட் தரும் உறுதியான வலியுறுத்தலையும் ‘-த்தான்’ மூலம் காக்கிறது; மேற்கோள் செய்யப்பட்ட பழமொழியின் அறிவுறுத்தல் தொனியையும் இயல்பான தமிழில் தருகிறது.
- source_word: בְּאָבֵל
  choice: ஆபேலில்
  rationale: இங்கு முற்றுகையிடப்பட்ட ஆபேல்-பெத்-மாக்கா நகரத்தின் சுருக்கப் பெயர் இடம்பெறுகிறது; בְּ முன்னிடைச்சொல்லின் இடப்பொருள் ‘-இல்’ எனத் தரப்படுகிறது.
- source_word: וְכֵן הֵתַמּוּ
  choice: இப்படித்தான் அவர்கள் காரியத்தை முடிவுக்குக் கொண்டுவந்தார்கள்
  rationale: וְכֵן முந்தைய வழக்கின் விளைவைச் சுட்டுகிறது. תמם என்பதன் ஹிஃபில் வடிவம் ஒன்றை நிறைவுக்குக் கொண்டுவருதல் என்ற அடிப்படைப் பொருளைக் கொண்டதால், சூழலில் ஒரு காரியத்தைத் தீர்த்து முடித்தல் என்ற கருத்தைத் தெளிவாகவும், சொல்லின் உருவகத்தை மிகையாகக் குறுக்காமலும் தருகிறது.
