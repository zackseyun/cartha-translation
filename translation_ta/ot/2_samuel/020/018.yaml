translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. பழமொழித் தொனியை ‘சொல்வது வழக்கம்’ என்றும், எபிரெய வலியுறுத்தலை ‘கேட்டுத்தான்’ என்றும் இயல்பாக வெளிப்படுத்தியுள்ளோம். மூலத்தின் இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
