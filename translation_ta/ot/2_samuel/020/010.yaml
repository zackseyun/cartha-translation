  yaml_path: translation/ot/2_samuel/020/010.yaml
  text: But Amasa was not on guard against the sword that was in Joab’s hand[a], and he struck him with it in the belly, and his entrails spilled out to the ground; he did not strike him again, and he died. Then Joab and Abishai his brother pursued Sheba son of Bichri.
translation:
  language: ta
  text: ஆனால், யோவாபின் கையில் இருந்த வாளைக் குறித்து அமாசா எச்சரிக்கையாக இருக்கவில்லை. யோவாப் அந்த வாளால் அவனை வயிற்றில்[a] தாக்கினான்; அவனுடைய குடல்கள் தரையில் சிந்தின. யோவாப் அவனை மறுபடியும் தாக்கவில்லை; அவன் இறந்தான். பின்பு யோவாபும் அவனுடைய சகோதரன் அபிசாயும் பிக்ரியின் மகனான சேபாவைத் துரத்திச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐந்தாவது விலா எலும்பில்.” பழைய மொழிபெயர்ப்புகள் சிலவற்றில் எபிரெயச் சொற்றொடர் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது. ஆனால் இச்சூழலில் அந்தச் சொல் பொதுவாக வயிற்றை அல்லது அடிவயிற்றுப் பகுதியைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
