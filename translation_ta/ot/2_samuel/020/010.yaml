  rationale: உள்ளுறுப்புகள் வெளியேறித் தரையில் விழுந்ததைக் கண்ணியமான அதேவேளையில் மறைக்காத நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְלֹא שָׁנָה לוֹ
  choice: அவனை மறுபடியும் தாக்காமலேயே
  rationale: சொல்லாட்சியின் நேரடிப் பொருள் ‘அவனுக்கு மீண்டும் செய்யவில்லை’; சூழலில் மறைந்துள்ள ‘தாக்குதல்’ என்ற செயலை இயல்பான தமிழில் வெளிப்படையாக்குகிறது.
