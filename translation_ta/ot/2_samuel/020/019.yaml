  text: אָנֹכִ֕י שְׁלֻמֵ֖י אֱמוּנֵ֣י יִשְׂרָאֵ֑ל אַתָּ֣ה מְבַקֵּ֗שׁ לְ/הָמִ֨ית עִ֤יר וְ/אֵם֙ בְּ/יִשְׂרָאֵ֔ל לָ֥/מָּה תְבַלַּ֖ע נַחֲלַ֥ת יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/019.yaml
  text: I am one of the peaceable and faithful in Israel. You are seeking to destroy a city[a], and a mother in Israel. Why would you swallow up the inheritance of Yahweh?
translation:
  language: ta
  text: நான் இஸ்ரவேலில் அமைதியும் நம்பகத்தன்மையும் உடையவர்களில் ஒருத்தி. நீ இஸ்ரவேலில் ஒரு நகரத்தையும் ஒரு தாயையும் அழித்துப்போட முயல்கிறாய்.[a] யாவேயின் சுதந்தரத்தை நீ ஏன் விழுங்க முயல்கிறாய்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலில் ஒரு தாயாக விளங்கும் நகரத்தை.” இது இஸ்ரவேலில் முதன்மையான அல்லது பிறரைப் பேணும் நகரத்தைக் குறிக்கலாம்.
    reason: עִיר וְאֵם בְּיִשְׂרָאֵל என்பது ‘ஒரு நகரம், மேலும் ஒரு தாய்’ என்றும், ஒரே நகரத்தை விளக்கும் இணைப்பெயராக ‘தாயாக விளங்கும் நகரம்’ என்றும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: שְׁלֻמֵי
  choice: அமைதியை விரும்பும்
  rationale: שׁלום என்பதிலிருந்து வந்த பன்மை வடிவம், இச்சூழலில் வெறுமனே அமைதியான மனநிலையைக் காட்டாமல், சமாதானத்தை நாடும் தரப்பினரைச் சுட்டுகிறது. இயல்பான நவீன தமிழில் அதன் கூட்டுப்பொருளை இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: אֱמוּנֵי
  choice: உண்மையுள்ளவர்கள்
  rationale: இந்த வடிவம் நம்பகத்தன்மை, விசுவாசம், உறுதிப்பற்று ஆகியவற்றைக் குறிக்கலாம். இங்கு சமூக உறவிலான நேர்மையையும் பற்றுறுதியையும் பொதுவாகத் தக்கவைக்கும் வகையில் ‘உண்மையுள்ளவர்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מְבַקֵּשׁ לְהָמִית
  choice: அழித்துப்போட முயல்கிறாய்
  rationale: பங்கேற்புவினையும் வினையெச்சமும் சேர்ந்து தொடர்ச்சியான நோக்கத்தைக் காட்டுகின்றன. הֵמִית என்பதன் அடிப்படைப் பொருள் ‘சாகடித்தல்’; ஆனால் அதன் நேரடி பொருளாக ஒரு நகரம் வருவதால், முற்றுகைச் சூழலில் இயல்பாகவும் துல்லியமாகவும் ‘அழித்துப்போட’ என வழங்கப்பட்டுள்ளது.
- source_word: עִיר וְאֵם בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில் ஒரு நகரத்தையும் ஒரு தாயையும்
  rationale: எபிரெயச் சொல்லமைப்பிலுள்ள ‘நகரம்’ மற்றும் ‘தாய்’ என்ற இரு உருவகக் கூறுகளையும் ஒன்றாகக் கரைத்துவிடாமல் முதன்மைப் பனுவலில் தக்கவைக்கிறது. அவை ஒரே நகரத்தை இணைப்பெயராகக் குறிப்பதற்கான வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תְבַלַּע
  choice: விழுங்கப்பார்க்கிறாய்
  rationale: בלע என்பதன் உயிரோட்டமான ‘விழுங்குதல்’ உருவகத்தைப் பாதுகாக்கிறது; முற்றுகையிட்டு அழித்தல் என்ற சூழல்பொருளையும் தமிழ் வாசகர் புரிந்துகொள்ள முடியும்.
- source_word: נַחֲלַת יְהוָה
  choice: யாவேயின் உரிமைச்சொத்து
  rationale: נחלה என்பது சுதந்தரம், பாரம்பரிய உரிமை, ஒருவருக்குச் சொந்தமான பங்கு ஆகிய கருத்துகளை உடையது. இங்கு இஸ்ரவேல் யாவேக்குச் சொந்தமானது என்ற உடன்படிக்கை சார்ந்த கூற்றை ‘உரிமைச்சொத்து’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரைப் பட்டப்பெயராக மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் வழக்கமான நவீன ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: ‘இஸ்ரவேலில் ஒரு தாய்’ என்ற உருவகத்தின் தொடர்பு
  choice: ‘ஒரு நகரத்தையும் ஒரு தாயையும்’ என்ற எபிரெய உருவகத்தையும் இலக்கணத் திறந்தநிலையையும் முதன்மைப் பனுவலில் தக்கவைத்தல்
  alternative: ‘இஸ்ரவேலில் ஒரு தாயாக விளங்கும் நகரம்’ என்று இணைப்பெயர்ப் பொருளை வெளிப்படையாக்குதல்
  rationale: עִיר וְאֵם என்ற தொடர் நகரத்தையும் தாயையும் தனித்தனியாகக் கூறுவது போலத் தோன்றினாலும், ‘இஸ்ரவேலில் தாயாக விளங்கும் நகரம்’ என்ற இணைப்பெயர்ப் பொருள் மிகச் சாத்தியம். முதன்மைப் பனுவல் உருவகத்தையும் உண்மையான இலக்கணத் தெளிவின்மையையும் காக்கிறது; சாத்தியமான தொடர்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: נַחֲלַת יְהוָה என்பதில் உரிமை சார்ந்த இறையியல் கூற்று
  choice: ‘யாவேயின் உரிமைச்சொத்து’
  alternative: ‘யாவேயின் சுதந்தரம்’
  rationale: இஸ்ரவேல் யாவேக்குச் சொந்தமான மக்கள் என்ற மூலப்பனுவலின் கூற்றை மறைக்காமல் வைத்திருக்கிறது; அதனை ஒரு குறிப்பிட்ட சமயக்கோட்பாட்டால் மேலும் விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நேரடி உரை பயன்படுத்தப்பட்டுள்ளது. பேசுபவர் பெண் என்பதால் ‘ஒருத்தி’ பயன்படுத்தப்பட்டுள்ளது. ‘விழுங்குதல்’ என்ற மூல உருவகமும் ‘நகரம்—தாய்’ என்ற சொல்லமைப்பும் பாதுகாக்கப்பட்டுள்ளன; அரிதான சமயத் தொழில்நுட்பச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
