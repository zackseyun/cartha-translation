translation_notes:
  register: நவீன நிலையான தமிழ்; வரலாற்றுக் கதையாடலுக்கேற்ற கண்ணியமான நடை. யோவாபிடம் கூறப்படும் நேரடி உரையில் மரியாதை ஒருமையான ‘உம்முடன்’, ‘வாரும்’ பயன்படுத்தப்பட்டுள்ளது; கூட்டத்திடம் ‘கேளுங்கள்’, ‘சொல்லுங்கள்’ என்ற பன்மை வடிவங்கள் வைக்கப்பட்டுள்ளன.
