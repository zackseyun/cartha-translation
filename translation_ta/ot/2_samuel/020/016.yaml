  yaml_path: translation/ot/2_samuel/020/016.yaml
  text: Then a wise woman called out from the city, “Listen! Listen! Please tell Joab, ‘Come near to here, so that I may speak with you.’”
translation:
  language: ta
  text: அப்போது நகரத்திலிருந்து ஞானமுள்ள ஒரு பெண் உரத்த குரலில், “கேளுங்கள்! கேளுங்கள்! தயவுசெய்து யோவாபிடம், ‘இங்கே வாருங்கள்; நான் உங்களுடன் பேச வேண்டும்’ என்று சொல்லுங்கள்” என்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה חֲכָמָה
  choice: ஞானமுள்ள ஒரு பெண்
  rationale: எபிரெயச் சொல்லாட்சியின் பொருளை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: וַתִּקְרָא
  choice: உரத்த குரலில் ... என்றாள்
  rationale: தொலைவில் உள்ளவர்களைக் கூப்பிடுதல் என்ற சூழல்சார் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: שִׁמְעוּ שִׁמְעוּ
  choice: கேளுங்கள்! கேளுங்கள்!
  rationale: மூலத்தின் இரட்டிப்பு, அவசரம், அழைப்பு ஆகியவற்றைப் பாதுகாக்கிறது.
- source_word: אִמְרוּ נָא
  choice: தயவுசெய்து ... சொல்லுங்கள்
  rationale: נָא காட்டும் பணிவான வேண்டுகோளையும் பன்மை கட்டளையையும் காக்கிறது.
- source_word: קְרַב עַד הֵנָּה
  choice: இங்கே அருகில் வாரும்
  rationale: ‘இவ்விடம் வரை நெருங்கி வா’ என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: நான் உம்முடன் பேசுவதற்காக
  rationale: நோக்கத்தைக் காட்டும் எபிரெய வடிவத்தையும் யோவாபை நோக்கிய ஒருமை உரையையும் பிரதிபலிக்கிறது.
