review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the wise woman, her call from the city, the repeated summons to listen, the polite plural request to relay her words to Joab, and her wish to speak with him. The wording for the final imperative can be made more direct and idiomatic without losing the singular address to Joab.
  naturalness: '“இங்கே அருகில் வாரும்” is redundant and somewhat unnatural: “இங்கே” already supplies the destination, while “வாரும்” and “உம்முடன்” are less natural than current respectful standard forms. Recasting the inner message gives a fluent modern Tamil direct quotation.'
  terminology: “ஞானமுள்ள ஒரு பெண்,” “யோவாப்,” and “கேளுங்கள்! கேளுங்கள்!” are appropriate. Respectful Tamil forms for Joab are suitable, even though Hebrew itself merely marks singular address.
  issues:
  - severity: medium
    issue: The phrase “இங்கே அருகில் வாரும்” is redundant and not idiomatic modern Tamil.
    rationale: It combines two overlapping locative expressions (“here” and “near”) and uses a less current imperative form. Hebrew קְרַב עַד־הֵנָּה is naturally conveyed by “இங்கே வாருங்கள்.”
  - severity: low
    issue: The final purpose clause is syntactically awkward in the draft.
    rationale: “நான் உம்முடன் பேசுவதற்காக இங்கே அருகில் வாரும்” places the purpose before the imperative in a way that is less smooth in Tamil. “இங்கே வாருங்கள்; நான் உங்களுடன் பேச வேண்டும்” clearly conveys the intended result of the approach.
  revised_text: அப்போது நகரத்திலிருந்து ஞானமுள்ள ஒரு பெண் உரத்த குரலில், “கேளுங்கள்! கேளுங்கள்! தயவுசெய்து யோவாபிடம், ‘இங்கே வாருங்கள்; நான் உங்களுடன் பேச வேண்டும்’ என்று சொல்லுங்கள்” என்றாள்.
