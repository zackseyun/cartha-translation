  text: הֵ֗ם עִם הָ/אֶ֤בֶן הַ/גְּדוֹלָה֙ אֲשֶׁ֣ר בְּ/גִבְע֔וֹן וַ/עֲמָשָׂ֖א בָּ֣א לִ/פְנֵי/הֶ֑ם וְ/יוֹאָ֞ב חָג֣וּר מִדּ֣/וֹ לְבֻשׁ֗/וּ ו/על/ו חֲג֥וֹר חֶ֨רֶב֙ מְצֻמֶּ֤דֶת עַל מָתְנָי/ו֙ בְּ/תַעְרָ֔/הּ וְ/ה֥וּא יָצָ֖א וַ/תִּפֹּֽל־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/008.yaml
  text: When they were by the great stone that is in Gibeon[a], Amasa came before them. Now Joab was dressed in his military garment, and over it was a belt with a sword fastened to his waist in its sheath; and as he went out[c][b], it fell.
translation:
  language: ta
  text: அவர்கள் கிபியோனிலுள்ள பெரிய கல்லருகே இருந்தபோது, அமாசா அவர்களுக்கு முன்பாக வந்தான்.[a] யோவாபோ தன் போருடையை[b] அணிந்திருந்தான்; அதன்மேல் ஒரு பட்டையைக் கட்டியிருந்தான். உறைக்குள் இருந்த ஒரு வாள் அந்தப் பட்டையோடு அவனுடைய இடுப்பில் பொருத்தப்பட்டிருந்தது. அவன் வெளியே சென்றபோது, அது விழுந்தது.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அமாசா அவர்களைச் சந்திக்க வந்தான்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயில் சொல்லுக்குச் சொல் ‘அவர்களுக்கு முன்பாக வந்தான்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘தன் மேலுடையை’ அல்லது ‘தான் அணிந்திருந்த உடையை’ என்றும் மொழிபெயர்க்கலாம்; இச்சூழலில் இந்த எபிரெயச் சொல் யோவாபின் போர்சார் உடையைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘விழுந்தது’ என்பதன் எழுவாய் பெரும்பாலும் வாளாக இருக்கலாம்; எபிரெயில் உள்ள பெண்பால் வினை வடிவம் இதைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם עִם הָאֶבֶן הַגְּדוֹלָה
  choice: அவர்கள் பெரிய கல்லருகே இருந்தபோது
  rationale: இடத்தைக் குறிக்கும் עִם என்பதை இயல்பான தமிழில் ‘அருகே’ என வழங்குகிறது; எபிரெயக் கூறின் இடவுணர்வைத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: கிபியோனிலுள்ள
  rationale: அந்தப் பெரிய கல்லின் இருப்பிடத்தைச் சுருக்கமாகவும் இயல்பாகவும் அடையாளப்படுத்துகிறது.
- source_word: וַעֲמָשָׂא בָּא לִפְנֵיהֶם
  choice: அமாசா அவர்களுக்கு முன்பாக வந்தான்
  rationale: לִפְנֵי என்பதன் ‘முன்பாக’ என்ற அடிப்படைப் பொருளைத் தக்கவைத்து, அவர் அவர்களைச் சந்திக்க வந்தாரா அல்லது அவர்களுக்கு முன்னால் வந்தாரா என்ற நுண்ணிய தெளிவின்மையைத் தீர்க்காமல் விடுகிறது.
- source_word: חָגוּר מִדּוֹ לְבֻשׁוֹ
  choice: தன் போருடையை அணிந்திருந்தான்
  rationale: מַד என்பதன் தனிப்பட்ட அல்லது போர்சார் உடை என்ற பொருள் வரம்பில், ஆயுதம் தரித்துள்ள இச்சூழலுக்கு ‘போருடை’ இயல்பாகப் பொருந்துகிறது.
- source_word: וְעָלָיו חֲגוֹר
  choice: அதன்மேல் ஒரு பட்டையைக் கட்டியிருந்தான்
  rationale: உடைக்கு மேல் அணிந்திருந்த பட்டையின் அடுக்கமைப்பைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֶרֶב מְצֻמֶּדֶת עַל מָתְנָיו
  choice: ஒரு வாள் அந்தப் பட்டையோடு அவனுடைய இடுப்பில் பொருத்தப்பட்டிருந்தது
  rationale: מְצֻמֶּדֶת என்பதன் நெருக்கமாக இணைக்கப்பட்ட அல்லது பொருத்தப்பட்ட நிலையைத் தெரிவித்து, מָתְנַיִם என்பதை இச்சூழலில் இயல்பான ‘இடுப்பு’ என வழங்குகிறது.
- source_word: בְּתַעְרָהּ
  choice: உறைக்குள் இருந்த
  rationale: வாள் அதன் உறைக்குள் இருந்ததை இயல்பாகக் காட்டுகிறது; பெண்பால் பின்னொட்டு வாளைக் குறிப்பதாக எடுத்துக்கொள்ளப்படுகிறது.
- source_word: וְהוּא יָצָא
  choice: அவன் வெளியே சென்றபோது
  rationale: יָצָא என்பதன் வெளியே செல்லும் இயக்கத்தைத் தக்கவைத்து, அடுத்த நிகழ்வோடு இயல்பாக இணைக்கிறது.
- source_word: וַתִּפֹּל
  choice: அது விழுந்தது
  rationale: பெண்பால் வினைமுற்றின் மிகச் சாத்தியமான முன்சுட்டான வாளைக் குறித்தாலும், மூலத்தில் பெயர் மீண்டும் சொல்லப்படாததால் தமிழிலும் ‘அது’ என வழங்கி வடிவத் தெளிவின்மையைப் பாதுகாக்கிறது.
