translation_notes:
  register: நவீன தரத் தமிழில், கதைநடைக்கேற்ற கண்ணியமான மற்றும் பொதுவாசகருக்குப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. ‘போருடை’ என்பது சூழலுக்கேற்ற சுருக்கமான சொல்; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. மூலத்தின் இறுதிக் கூற்றிலுள்ள சுட்டுப்பெயர் தெளிவின்மை முதன்மை உரையில் தக்கவைக்கப்பட்டு, சாத்தியமான குறிப்பு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
