  text: וְ/שָׁ֨ם נִקְרָ֜א אִ֣ישׁ בְּלִיַּ֗עַל וּ/שְׁמ֛/וֹ שֶׁ֥בַע בֶּן בִּכְרִ֖י אִ֣ישׁ יְמִינִ֑י וַ/יִּתְקַ֣ע בַּ/שֹּׁפָ֗ר וַ֠/יֹּאמֶר אֵֽין לָ֨/נוּ חֵ֜לֶק בְּ/דָוִ֗ד וְ/לֹ֤א נַֽחֲלָה לָ֨/נוּ֙ בְּ/בֶן יִשַׁ֔י אִ֥ישׁ לְ/אֹהָלָ֖י/ו יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/001.yaml
  text: There happened to be there a worthless man[a], whose name was Sheba son of Bichri, a Benjaminite. He blew the trumpet and said, “We have no share in David, and no inheritance in the son of Jesse. Every man to his tents[d][c][b], O Israel!”
translation:
  language: ta
  text: அங்கே ஒரு கயவன்[a] இருந்தான். அவன் பெயர் பிக்ரியின் மகன் சேபா; அவன் பென்யமீன் கோத்திரத்தான். அவன் கொம்பை[b] ஊதி, “தாவீதிடம் எங்களுக்குப் பங்கு[c] இல்லை; ஈசாயின் மகனிடம் எங்களுக்குச் சுதந்தரப் பங்கும் இல்லை. இஸ்ரவேலே, ஒவ்வொருவரும் அவரவர் கூடாரங்களுக்குத்[d] திரும்புங்கள்!” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீயவன்,” “பயனற்றவன்”; சொற்படி, “பெலியாலின் மனிதன்.” இங்கு ‘பெலியால்’ என்பது தனிப்பெயராக இல்லாமல் இழிந்த அல்லது ஒழுக்கங்கெட்ட தன்மையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் ஷோஃபார்; பொதுவாக அறிவிப்புக் குறியாக ஊதப்பட்ட ஒரு கொம்பு. மரபாக இது செம்மறியாட்டுக் கடாவின் கொம்பு என்று புரிந்துகொள்ளப்படுகிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “தாவீதிடம் எங்களுக்கு எந்தப் பங்குரிமையும் இல்லை.”
    reason: lexical_alternative
  - marker: d
    text: “ஒவ்வொருவரும் அவரவர் கூடாரங்களுக்கு” என்பது சொற்படியான எபிரேய மரபுத்தொடர்; ஒவ்வொருவரும் தங்கள் வீடு அல்லது முகாமுக்குத் திரும்ப வேண்டும் என்பதே இதன் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִקְרָא
  choice: அங்கே ... ஒருவன் இருந்தான்
  rationale: שָׁם உடன் வரும் இந்த நிஃபால் வடிவம் பெயரிடுதலை அல்ல, ஒருவர் அங்கே இருந்தார் என்ற நிகழ்வியல் அறிமுகத்தைக் குறிக்கிறது. தமிழில் இயல்பாகவும் மூலத்தில் இல்லாத காலக் குறிப்பைச் சேர்க்காமலும் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: אִישׁ בְּלִיַּעַל
  choice: பயனற்றவன் ஒருவன்
  rationale: இங்கு בְּלִיַּעַל ஒரு தனிப்பெயராக அல்லாமல் இழிந்த அல்லது ஒழுக்கங்கெட்ட மனிதனை விவரிக்கும் பொதுப்பெயர்ச் சொல்லாகச் செயல்படுகிறது. ‘பயனற்றவன்’ அதன் அடிப்படை மதிப்பீட்டைக் காக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: பிக்ரியின் மகன் சேபா
  rationale: தனிப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டு, எபிரேய வம்சத் தொடர்பு இயல்பான தமிழ் சொற்றொடராகக் கொடுக்கப்பட்டுள்ளது.
- source_word: אִישׁ יְמִינִי
  choice: பென்யமீன் கோத்திரத்தான்
  rationale: இந்தச் சொற்றொடர் ஒருவரின் கோத்திரச் சார்பைக் குறிக்கிறது; வெறும் புவியியல் அடையாளமாகப் புரிந்துகொள்ளப்படாதபடி ‘கோத்திரத்தான்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּתְקַע בַּשֹּׁפָר
  choice: அவன் கொம்பை ஊதி
  rationale: שׁוֹפָר என்பது பொதுமக்களுக்கு அறிகுறி கொடுக்கப் பயன்பட்ட ஊதுகொம்பு. ‘கொம்பு’ என்பது ‘எக்காளம்’ என்பதைவிட பொருளின் வடிவத்தைத் துல்லியமாகக் காட்டுகிறது; அதன் பண்பாட்டுச் சிறப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: אֵין לָנוּ חֵלֶק בְּדָוִד
  choice: தாவீதிடம் எங்களுக்குப் பங்கு இல்லை
  rationale: חֵלֶק என்பது பங்கு அல்லது பங்குரிமையைக் குறிக்கிறது. இங்கு தாவீதின் ஆட்சியில் தங்களுக்கு எந்தப் பங்கும் இல்லை என்ற அரசியல் மறுப்பாக உள்ளது.
- source_word: וְלֹא נַחֲלָה לָנוּ בְּבֶן יִשַׁי
  choice: ஈசாயின் மகனிடம் எங்களுக்கு உரிமைச்சொத்தும் இல்லை
  rationale: נַחֲלָה என்பதன் சொத்து, சுதந்தர உரிமை என்ற ஒலிப்பை ‘உரிமைச்சொத்து’ காக்கிறது. ‘சுதந்தரம்’ என்ற சொல் நவீன தமிழில் விடுதலை என்ற பொருளில் தவறாகப் புரியக்கூடும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: בְּבֶן יִשַׁי
  choice: ஈசாயின் மகனிடம்
  rationale: தாவீதை அரச பட்டத்தால் அழைக்காமல் அவரது தந்தைவழி அடையாளத்தால் குறிப்பிடும் இகழ்ச்சியான சொல்லாட்சியை இது காக்கிறது.
- source_word: אִישׁ לְאֹהָלָיו
  choice: ஒவ்வொருவரும் அவரவர் கூடாரங்களுக்குத் திரும்புங்கள்
  rationale: வினைச்சொல் இல்லாத எபிரேய முழக்கம் தமிழில் கட்டளைத் தொனியுடன் தரப்பட்டுள்ளது. ஒருமை ‘மனிதன்’ மற்றும் பன்மை ‘அவனுடைய கூடாரங்கள்’ சேர்ந்த பகிர்முறை மரபுத்தொடர் இயல்பான தமிழில் ‘ஒவ்வொருவரும் அவரவர்’ என வழங்கப்பட்டுள்ளது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேலே
  rationale: இது இஸ்ரவேல் மக்களை நேரடியாக அழைக்கும் விளிவேற்றுமை; தமிழ் விளி வடிவம் முழக்கத்தின் வலிமையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: בְּלִיַּעַל என்பதை ‘பெலியால்’ என்ற தனிப்பெயராகக் கொள்ளலாமா அல்லது மனிதனை விவரிக்கும் சொல்லாகக் கொள்ளலாமா
  choice: மனிதனை விவரிக்கும் ‘பயனற்றவன்’
  alternative: ‘பெலியாலின் மனிதன்’ அல்லது ‘தீயவன்’
  rationale: இந்த வரலாற்றுச் சூழலில் இச்சொல் பிற்காலப் பேயியல் தனிப்பெயரைத் தெளிவாகக் குறிக்காமல், சேபாவின் இழிந்த அல்லது சட்டமீறும் குணத்தை மதிப்பிடுகிறது. எனவே பிற்கால இறையியல் தொடர்பை உரைக்குள் இறக்குமதி செய்யாமல் விவரிப்புச் சொல்லாக மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை மற்றும் கலக முழக்கத்துக்குரிய சுருக்கமான நேரடித் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘இஸ்ரவேலே’ என்ற விளிவடிவமும் ‘ஈசாயின் மகன்’ என்ற வம்சக் குறிப்பும் மூலத்தின் சொல்லாட்சித் தாக்கத்தைப் பாதுகாக்கின்றன. அரிதான ‘ஷோஃபார்’ உரையில் தவிர்க்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
