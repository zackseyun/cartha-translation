  naturalness: ‘பயனற்றவன்’ என்பது தமிழில் பெரும்பாலும் திறனற்ற அல்லது பயன்பாடற்றவர் என்ற பொருளைத் தரக்கூடும். இச்சூழலின் இழிந்த/சட்டமீறும் குணவிவரிப்புக்கு ‘கயவன்’ இயல்பான நவீன நிலையான தமிழ். ‘சுதந்தரப் பங்கு’ என்பதும் ‘உரிமைச்சொத்து’ என்பதைக் காட்டிலும் இங்கு இயல்பாகவும் துல்லியமாகவும் உள்ளது.
