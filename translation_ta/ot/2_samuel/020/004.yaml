base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/004.yaml
  text: Then the king said to Amasa[a], “Call the men of Judah together for me within three days, and you, remain here.”
translation:
  language: ta
  text: அப்போது அரசர் அமாசாவிடம், “மூன்று நாட்களுக்குள் யூதாவின் ஆண்களை[a] எனக்காகத் திரட்டு; நீ இங்கேயே இரு” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூதாவின் ஆண்கள்” என்பதற்கான எபிரெயச் சொற்றொடர் ஆண்பால் கூட்டுப்பெயராக உள்ளது. இது யூதாவிலிருந்து போருக்குத் திரட்டக்கூடிய ஆண்களைக் குறிக்கலாம்; ஆனால் மூல வாசகம் அவர்களை வெளிப்படையாக “வீரர்கள்” என்று அழைக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ இயல்பான தமிழில் அந்த நிகழ்வுத் தொடரைத் தெரிவிக்கிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசர்
  rationale: சூழலில் தாவீதைக் குறிக்கும் திட்டமான பெயர்ச்சொல்; மூலத்தில் இல்லாத இயற்பெயரைச் சேர்க்காமல் பதவிப்பெயரே வைக்கப்படுகிறது.
- source_word: הַזְעֶק
  choice: திரட்டு
  rationale: זעק என்பதன் ஹிஃபீல் கட்டளை வடிவம் இங்கு பொது அழைப்பு விடுத்து ஒன்றுகூட்டுவதைக் குறிக்கிறது; ‘திரட்டு’ அதன் காரணவினை மற்றும் அணிதிரட்டும் சூழலைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: לִי
  choice: எனக்காக
  rationale: அரசரின் சார்பாகவும் அவரது நோக்கத்திற்காகவும் செயலைச் செய்ய வேண்டும் என்பதைக் காட்டும் நோக்குப் பொருள்.
- source_word: אֶת אִישׁ יְהוּדָה
  choice: யூதாவின் ஆண்களை
  rationale: אִישׁ ஒருமை வடிவில் இருந்தாலும் இங்கு ஆண்பால் கூட்டுப்பொருளில் வருகிறது. சூழல் படை அணிதிரட்டலைச் சுட்டினாலும், மூலத்தில் வெளிப்படையாக இல்லாத ‘வீரர்கள்’ என்பதைச் சேர்க்காமல் நேரடியான சொல்லாக்கம் வைக்கப்படுகிறது.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: மூன்று நாட்களுக்குள்
  rationale: கட்டளைச் சூழலில் இது செயலுக்கான காலக்கெடுவைக் குறிக்கிறது; ‘மூன்று நாட்களுக்குள்’ அந்தப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְאַתָּה
  choice: நீ
  rationale: வெளிப்படையாக இடம்பெறும் முன்னிலைப்பெயர் அமாசாவுக்கு அளிக்கப்படும் தனிப்பட்ட கட்டளையை வலியுறுத்துகிறது; தமிழில் ‘நீ’ அதைத் தக்கவைக்கிறது, தேவையற்ற எதிர்மறைத் தொடர்பைச் சேர்க்கவில்லை.
- source_word: פֹּה
  choice: இங்கேயே
  rationale: இடத்தைக் குறிக்கும் ‘இங்கே’ என்பதுடன், அதே இடத்தில் இருக்க வேண்டும் என்ற கட்டளையின் இயல்பான தமிழ் வலியுறுத்தல் ‘-யே’ மூலம் வெளிப்படுகிறது.
- source_word: עֲמֹד
  choice: இரு
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘நில்’ என்றாலும், இச்சூழலில் குறிப்பிட்ட இடத்திலேயே தங்கியிருப்பதைக் குறிக்கிறது; ‘இரு’ இயல்பான தமிழில் அந்த நோக்கத்தைத் தருகிறது.
