  source_fidelity: மூல எபிரெய வாசகத்தின் நிகழ்வுத் தொடரை ‘அப்போது’ சரியாகக் காட்டுகிறது. הַזְעֶק-ன் அணிதிரட்டும் கட்டளைப் பொருள் ‘திரட்டு’ எனத் துல்லியமாக உள்ளது. ‘யூதாவின் ஆண்களை’ என்பது אִישׁ יְהוּדָה-வின் கூட்டுப்பொருளைத் தக்கவைத்து, ‘வீரர்கள்’ என மூலத்தில் வெளிப்படையாக இல்லாத குறிப்பைச் சேர்ப்பதில்லை. ‘மூன்று நாட்களுக்குள்’ காலக்கெடுவையும், ‘நீ இங்கேயே இரு’ அமாசாவுக்கான தனிப்பட்ட கட்டளையையும் இயல்பாகக் கொடுக்கிறது.
  naturalness: நவீனத் தரத் தமிழில் வாசகம் தெளிவாகவும் இயல்பான கதைநடையுடனும் உள்ளது. அரசருக்கு மரியாதை ஒருமையல்லாத வினைமுற்றும், அமாசாவுக்கான நேரடிக் கட்டளைக்கு ஒருமை வடிவமும் பொருத்தமானவை. ‘இங்கேயே’ என்பது இச்சூழலில் இடத்தில் தங்கியிருக்கும் கட்டளையை இயல்பாக வலியுறுத்துகிறது.
