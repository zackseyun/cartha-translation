translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் கதைநடை இயல்பும் கொண்ட சொல்லாக்கம் பயன்படுத்தப்பட்டுள்ளது. அரசரைக் குறிக்க மரியாதைப் பன்மை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது; நேரடி உரையிலுள்ள கட்டளைகள் ஒருமையில் வைக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘யூதாவின் ஆண்களை’ என்ற சொற்றொடருக்குப் பின் இணைக்கப்பட்டுள்ளது.
