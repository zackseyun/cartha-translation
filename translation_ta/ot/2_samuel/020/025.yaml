    text: அல்லது, ‘அரசவையின் எழுத்தர்.’ எபிரெயச் சொல் அரசவையில் எழுத்தர் அல்லது செயலராகப் பணியாற்றிய ஓர் அதிகாரியைக் குறிக்கலாம்.
    reason: lexical_alternative
