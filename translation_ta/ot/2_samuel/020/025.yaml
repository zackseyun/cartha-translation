translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான நடை. இது நிர்வாகப் பட்டியல் என்பதால் சுருக்கமான வாக்கிய அமைப்பு காக்கப்பட்டுள்ளது; மூலத்தின் தொடர்ச்சியான இணைப்புகள் தமிழின் இயல்புக்கு ஏற்ப வடிவமைக்கப்பட்டுள்ளன.
