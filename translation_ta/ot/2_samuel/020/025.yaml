base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/025.yaml
  text: and Sheva was secretary[a], and Zadok and Abiathar were priests.
translation:
  language: ta
  text: சேவா அரசுச் செயலராக இருந்தான்; சாதோக்கும் அபியத்தாரும் ஆசாரியர்களாக இருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שיא
  choice: செவா
  rationale: எபிரெய உரையில் காணப்படும் தனிப்பெயரின் வடிவத்தை நேரடியாகத் தமிழில் ஒலிபெயர்க்கிறது; இணையான நிர்வாகப் பட்டியல்களில் வேறு பெயர் வடிவங்கள் இருந்தாலும், இவ்வசனத்தின் வாசகமே பின்பற்றப்படுகிறது.
- source_word: סֹפֵר
  choice: அரசுச் செயலர்
  rationale: அரச நிர்வாகத்தில் எழுத்துப் பணியையும் செயலர் பொறுப்பையும் வகித்த அதிகாரியை இச்சொல் குறிக்கலாம். நவீன வாசகருக்கு பதவியின் நிர்வாகத் தன்மையைத் தெளிவாக்க ‘அரசுச் செயலர்’ பயன்படுத்தப்படுகிறது; ‘எழுத்தர்’ என்ற மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: צָדוֹק
  choice: சாதோக்
  rationale: தனிப்பெயரின் எபிரெய உச்சரிப்பை அண்மித்த தமிழ் ஒலிபெயர்ப்பு.
- source_word: אֶבְיָתָר
  choice: அபியத்தார்
  rationale: தனிப்பெயரின் எபிரெய வடிவத்தை அண்மித்த தமிழ் ஒலிபெயர்ப்பு.
- source_word: כֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: வழிபாட்டுப் பணியில் இருந்த ஆசாரியர்களைக் குறிக்கும் பன்மைச் சொல்லுக்கான இயல்பான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் மொழிபெயர்ப்பு.
- source_word: וְ
  choice: ; / -உம்
  rationale: பட்டியலில் உள்ள பெயர்களையும் பதவிகளையும் இணைக்கும் தொடர் இணைப்புகள் தமிழில் இயல்பாக ஒலிக்க அரைப்புள்ளியாலும் ‘-உம்’ இணைப்பாலும் வெளிப்படுத்தப்படுகின்றன.
