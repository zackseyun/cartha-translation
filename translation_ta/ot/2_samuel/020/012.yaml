base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/012.yaml
  text: Amasa was wallowing in blood in the middle of the highway. When the man saw that all the people were stopping[a], he moved Amasa from the highway into the field and threw a garment over him, because he saw that everyone who came upon him stopped.
translation:
  language: ta
  text: அமாசா சாலையின் நடுவில் இரத்தத்தில் புரண்டு துடித்துக்கொண்டிருந்தான்.[a] மக்கள் அனைவரும் நின்றுவிடுவதை அந்த மனிதன் கண்டபோது, அவன் அமாசாவைச் சாலையிலிருந்து வயலுக்குள் நகர்த்தி, அவன்மேல் ஓர் ஆடையைப் போட்டான்; அமாசாவை நோக்கி வந்த ஒவ்வொருவரும் நின்றுவிடுவதை அவன் கண்டதால் அவ்வாறு செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘புரண்டு கொண்டிருந்தான்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் நேரடியாகத் தன்னைத்தானே உருட்டிக்கொள்வதைக் குறிக்கிறது; இங்கு காயமடைந்த அமாசாவின் வேதனையான அசைவை விவரிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְגֹּלֵל
  choice: புரண்டு துடித்துக்கொண்டிருந்தான்
  rationale: גלל என்ற வேரின் தன்னிலை/தொடர்ச்சியான உருளும் அசைவை ‘புரண்டு’ காக்கிறது; மரணக் காயத்தால் ஏற்பட்ட வேதனையான அசைவை இயல்பான தமிழில் ‘துடித்துக்கொண்டிருந்தான்’ தெளிவாக்குகிறது.
- source_word: בַּדָּם
  choice: இரத்தத்தில்
  rationale: மூலத்தின் உருவகத்தை நேரடியாகக் காக்கிறது; ‘தன் இரத்தத்தில்’ என்று மூலத்தில் இல்லாத உடைமையைச் சேர்க்கவில்லை.
- source_word: בְּתוֹךְ הַמְסִלָּה
  choice: சாலையின் நடுவில்
  rationale: מְסִלָּה என்பது இங்கு மக்கள் பயணிக்கும் முக்கியச் சாலை; நவீனத் தமிழில் ‘சாலையின் நடுவில்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: எபிரெயக் குறிப்புச் சுட்டைத் தமிழில் சூழலால் அடையாளம் காணப்படும் குறிப்பிட்ட மனிதனாக வெளிப்படுத்துகிறது.
- source_word: כִּי עָמַד כָּל הָעָם
  choice: மக்கள் அனைவரும் அங்கே நின்றுவிடுவதை
  rationale: עמד இங்கு சடலத்தைக் கண்டு முன்னே செல்லாமல் நிற்பதைக் குறிக்கிறது; ‘நின்றுவிடுவது’ நிகழ்வின் தொடர்ச்சியை இயல்பாகத் தெரிவிக்கிறது. ‘அங்கே’ என்பது தமிழில் நிறுத்தம் நிகழும் காட்சியைத் தெளிவாக்கும் சூழல்சார் சொல்.
- source_word: וַיַּסֵּב
  choice: நகர்த்தி
  rationale: அமாசாவை வழியிலிருந்து அகற்றி வேறிடத்துக்கு மாற்றிய செயலைக் காட்டுகிறது; ‘இழுத்து’ போன்ற மூலத்தில் இல்லாத செய்முறையைச் சேர்க்கவில்லை.
- source_word: מִן הַמְסִלָּה הַשָּׂדֶה
  choice: சாலையிலிருந்து வயலுக்குள்
  rationale: புறப்படும் இடத்தையும் சென்றடையும் இடத்தையும் தெளிவாகக் காக்கிறது.
- source_word: בֶּגֶד
  choice: ஓர் ஆடை
  rationale: בֶּגֶד என்பதன் பொதுவான ஆடைப் பொருளைக் காக்கிறது; ‘மேலங்கி’ என்று தேவையற்ற வகைக் குறிப்பைச் சேர்க்கவில்லை.
- source_word: כָּל הַבָּא עָלָיו
  choice: அமாசாவிடம் வந்த ஒவ்வொருவரும்
  rationale: அவரை எதிர்கொண்டு அந்த இடத்துக்கு வந்த அனைவரையும் குறிக்கிறது. தமிழில் பிரதிப்பெயரின் சுட்டுத் தெளிவின்மையைத் தவிர்க்க பெயர் மீண்டும் பயன்படுத்தப்பட்டது.
- source_word: וְעָמָד
  choice: நின்றுவிடுவதை
  rationale: முந்தைய עמד-ஐ மீண்டும் ஒலிக்கச் செய்து, வருகிற ஒவ்வொருவரும் அங்கே நிறுத்தப்பட்டதைத் தெளிவாகக் காட்டுகிறது.
