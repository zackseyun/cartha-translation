  text: וַ/יֵּצְא֤וּ אַֽחֲרָי/ו֙ אַנְשֵׁ֣י יוֹאָ֔ב וְ/הַ/כְּרֵתִ֥י וְ/הַ/פְּלֵתִ֖י וְ/כָל הַ/גִּבֹּרִ֑ים וַ/יֵּֽצְאוּ֙ מִ/יר֣וּשָׁלִַ֔ם לִ/רְדֹּ֕ף אַחֲרֵ֖י שֶׁ֥בַע בֶּן בִּכְרִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/007.yaml
  text: Joab’s men[a], the Kerethites, the Pelethites, and all the mighty men went out after him. They went out from Jerusalem to pursue Sheba son of Bichri.
translation:
  language: ta
  text: யோவாபின் ஆட்களும், கெரேத்தியரும்[a], பெலேத்தியரும், வலிமைமிக்க வீரர்கள் அனைவரும் அவனுக்குப் பின்னால் புறப்பட்டார்கள். பிக்ரியின் மகன் சேபாவைத் துரத்துவதற்காக அவர்கள் எருசலேமிலிருந்து புறப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில பாரம்பரிய மொழிபெயர்ப்புகளில் இந்தப் பெயர் “கெரேத்தியர்” என்பதற்குப் பதிலாக “செரேத்தியர்” என்று எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ ... אַחֲרָיו
  choice: அவனுக்குப் பின்னால் புறப்பட்டார்கள்
  rationale: ‘புறப்படுதல் + பின்னால்’ என்ற எபிரேய சொல்லமைப்பையும், சூழலில் உள்ள ‘அவன்’ என்பதன் சுட்டுப்பொருள் தெளிவுபடுத்தப்படாமல் இருப்பதையும் காக்கிறது.
- source_word: אַנְשֵׁי יוֹאָב
  choice: யோவாபின் ஆட்கள்
  rationale: யோவாபின் கீழிருந்த மனிதர்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: הַכְּרֵתִי
  choice: கெரேத்தியர்
  rationale: தாவீதின் அரசப் படையோடு தொடர்புடைய குழுவின் பெயராக இருப்பதால், ஊகமான பொருள் மொழிபெயர்ப்புக்கு மாறாக எபிரேய ஒலிப்பைத் தழுவிய எழுத்துப்பெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: הַפְּלֵתִי
  choice: பெலேத்தியர்
  rationale: கெரேத்தியரோடு வழக்கமாக இணைந்து வரும் குழுப்பெயர் என்பதால் எழுத்துப்பெயர்ப்பாக வழங்கப்பட்டது.
- source_word: כָל הַגִּבֹּרִים
  choice: வலிமைமிக்க வீரர்கள் அனைவரும்
  rationale: גִּבּוֹרִים என்பதிலுள்ள வலிமை மற்றும் போர்த்திறன் ஆகிய இரு நுணுக்கங்களையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִירוּשָׁלִַם
  choice: எருசலேமிலிருந்து
  rationale: புறப்பட்ட இடத்தைக் குறிக்கும் முன்னொட்டின் நேரான தமிழ் இணை.
- source_word: לִרְדֹּף אַחֲרֵי
  choice: துரத்துவதற்காக
  rationale: பின்தொடர்ந்து பிடிக்க முயல்வதைக் குறிக்கும் வினையின் இயக்கத்தையும் நோக்கத்தையும் சுருக்கமாகத் தருகிறது.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: பிக்ரியின் மகன் சேபா
  rationale: எபிரேய தந்தைவழிப் பெயரடையாளத்தை இயல்பான தமிழ் வரிசையில் தருகிறது.
