translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. மூலத்தின் இரண்டு புறப்படுதல் வினைகளும், பட்டியல் அமைப்பும், ‘அவன்’ என்ற தெளிவுபடுத்தப்படாத சுட்டுப்பெயரும் பாதுகாக்கப்பட்டுள்ளன.
