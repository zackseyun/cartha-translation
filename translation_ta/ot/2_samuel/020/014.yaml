  source_fidelity: 'முதன்மை உரை எபிரெய வாக்கியத்தின் இயக்கத்தையும் வரிசையையும் நன்றாகக் காக்கிறது: அவன் இஸ்ரவேல் கோத்திரங்களின் வழியாக ஆபேலுக்கும் பெத்-மாக்காவுக்கும் சென்றான்; பேரியர் கூடிவந்து அவனைப் பின்தொடர்ந்தனர். ‘அவர்களும்’ என்பது אַף (‘மேலும்/அவர்களும்’) என்பதைக் காக்கிறது. மாற்று வாசிப்பு அடிக்குறிப்பும் உரையின் நிச்சயமற்ற மக்கள்-பெயரை உரையில் தீர்மானித்துவிடாமல் சரியாகக் கையாள்கிறது.'
