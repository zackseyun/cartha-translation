base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/014.yaml
  text: He passed through all the tribes of Israel to Abel and Beth-maacah[b][a], and all the Berites assembled and also followed after him.
translation:
  language: ta
  text: அவன் இஸ்ரவேலின் எல்லாக் கோத்திரங்களின் வழியாக ஆபேலுக்கும் பெத்-மாக்காவுக்கும் சென்றான். பேரியர்[a] அனைவரும் ஒன்றுகூடி, அவர்களும் அவனைப் பின்தொடர்ந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில், “பேரியர் அனைவரும்.” சூழலில் வரும் பிக்ரியின் மகன் சேபாவுடன் இச்சொற்றொடரை இணைத்து, சில மொழிபெயர்ப்புகள் “பிக்ரியர் அனைவரும்” என்று வாசிக்கின்றன. ஆனால் மசோரா உரை இங்கு “பேரியர்” என்ற வாசிப்பையே நேரடியாக ஆதரிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அவர்களும் அவனுக்குப் பின்னால் வந்தார்கள்.” எபிரெயச் சொற்றொடரை இன்னும் சொல்லுக்குச் சொல் மொழிபெயர்த்தால் இவ்வாறு அமையும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: அவன் … வழியாக … சென்றான்
  rationale: עבר என்ற வினை இங்கு பல பகுதிகளைக் கடந்து செல்லும் இயக்கத்தைக் குறிக்கிறது. நவீன தமிழில் இயல்பாக இருக்கும்படி ‘வழியாக … சென்றான்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லாக் கோத்திரங்களின் வழியாக
  rationale: ב என்ற முன்னிடைச்சொல் இங்கு கோத்திரங்களின் பகுதிகள் வழியாகச் செல்லும் இடவியல் பொருளைக் கொண்டுள்ளது; ‘வழியாக’ என்பது அந்தப் பரப்பையும் இயக்கத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: אָבֵלָה
  choice: ஆபேலுக்கு
  rationale: இறுதியில் உள்ள திசைகாட்டும் ה, ஆபேலை நோக்கிய இயக்கத்தைக் குறிக்கிறது. அடுத்த இடப்பெயரிலிருந்து இதைத் தனியாகவே வைக்கப்பட்டுள்ளது.
- source_word: וּבֵית מַעֲכָה
  choice: பெத்-மாக்காவுக்கும்
  rationale: இது இச்சூழலில் ஓர் இடப்பெயர்; எனவே ‘மாக்காவின் வீடு’ என்று சொற்பொருளாக மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְכָל הַבֵּרִים
  choice: பேரீயர் அனைவரும்
  rationale: மசோரா மெய்யெழுத்து உரை ஒரு மக்கள் குழுவைக் குறிக்கும் ‘பேரீயர்’ என்ற வாசிப்பை நேரடியாக ஆதரிக்கிறது. அடையாளம் உறுதியற்றதால் பெயர் ஒலிபெயர்க்கப்பட்டு, மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיִּקָּהֲלוּ
  choice: ஒன்றுகூடி
  rationale: קהל வேர்ச்சொல் மக்கள் கூட்டமாகச் சேர்வதைக் குறிக்கிறது; தொடர்ச்சியான தமிழ் உரைநடைக்காக ‘ஒன்றுகூடி’ பயன்படுத்தப்பட்டது.
- source_word: וַיָּבֹאוּ אַף אַחֲרָיו
  choice: அவர்களும் அவனைப் பின்தொடர்ந்தார்கள்
  rationale: சொல்லுக்குச் சொல் பார்த்தால் ‘அவனுக்குப் பின்னால் வந்தார்கள்’ என்றாலும், இச்சூழலில் அவனுடைய பயணத்தில் இணைந்து சென்றார்கள் என்பதே எபிரெயச் சொற்றொடரின் இயல்பான கருத்து. אַף என்பதைக் ‘அவர்களும்’ எடுத்துரைக்கிறது.
