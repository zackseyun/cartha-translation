  terminology: இடப்பெயர்கள் ஒலிபெயர்ப்பாகவே வைக்கப்பட்டுள்ளன. ஆனால் அறியப்படாத இன/குழுப்பெயரின் தமிழ் ஒலிபெயர்ப்பில் ‘பேரீயர்’ என்பதற்குப் பதில் ‘பேரியர்’ என்பதும், மாற்று வாசிப்பில் ‘பிக்ரீயர்’ என்பதற்குப் பதில் ‘பிக்ரியர்’ என்பதும் எபிரெயப் பெயரமைப்புக்கும் தமிழின் இயல்பான இணைப்புக்கும் நெருக்கமானவை. இவை பெயரியல்/எழுத்தாக்கத் திருத்தங்கள் மட்டுமே; பொருள் மாறாது.
