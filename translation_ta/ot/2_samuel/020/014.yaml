translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. அறியப்படாத மக்கள் பெயரும் இடப்பெயர்களும் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன; ‘அவன்’ என்பதன் சுட்டுப்பொருள் மூலத்தில் இருப்பதுபோலவே விளக்கமின்றி விடப்பட்டுள்ளது.
