  to: இஸ்ரயேலின் படை முழுவதற்கும் யோவாப் தலைவனாக இருந்தான்; யோயாதாவின் மகன் பெனாயா கேரேத்தியருக்கும்[a] பிலேத்தியருக்கும் தலைவனாக இருந்தான்.
