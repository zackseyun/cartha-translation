base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/023.yaml
  text: Joab was over all the army of Israel[a], and Benaiah son of Jehoiada was over the Cherethites and the Pelethites.
translation:
  language: ta
  text: இஸ்ரயேலின் படை முழுவதற்கும் யோவாப் தலைவனாக இருந்தான்; யோயாதாவின் மகன் பெனாயா கேரேத்தியருக்கும்[a] பிலேத்தியருக்கும் தலைவனாக இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கெரேத்தியர்.” இக்குழுப்பெயரின் துல்லியமான ஒலிபெயர்ப்பு உறுதியற்றது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  choice: யோவாப்
  rationale: இணைப்புச் சொல் நிர்வாகப் பொறுப்புகளின் பட்டியலைத் தொடர்கிறது; தமிழில் தேவையற்ற காலக் குறிப்பைச் சேர்க்காமல் பெயரை நேரடியாகத் தொடங்குவது இயல்பாக உள்ளது.
- source_word: אֶל כָּל הַ/צָּבָא יִשְׂרָאֵל
  choice: இஸ்ரயேலின் முழுப் படைக்கும் ... தலைவராக இருந்தான்
  rationale: வினையில்லா நிர்வாகச் சொற்றொடரில் אֶל அதிகாரப் பொறுப்பைக் குறிக்கிறது. צָבָא இங்கு ஒழுங்கமைந்த படையைக் குறிக்கும்; כָּל என்பதற்கு ‘முழு’ பயன்படுத்தப்பட்டது.
- source_word: וּ/בְנָיָה בֶּן יְהוֹיָדָע
  choice: யோய்தாவின் மகன் பெனாயா
  rationale: தந்தை–மகன் உறவை இயல்பான தமிழ்ச் சொல்லமைப்பில் வைத்து, இரு தனிப்பெயர்களும் ஒலிபெயர்க்கப்பட்டன.
- source_word: עַל ה/כרי וְ/עַל הַ/פְּלֵתִי
  choice: கிரேத்தியருக்கும் பிலேத்தியருக்கும் தலைவராக இருந்தான்
  rationale: עַל இங்கு இக்குழுக்கள்மீதான அதிகாரம் அல்லது தலைமையைச் சுட்டுகிறது. குழுப் பெயர்கள் பொருள் ஊகிக்கப்படாமல் ஒலிபெயர்க்கப்பட்டன; முதலாவது பெயரின் மூலவடிவ நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், நிர்வாகப் பொறுப்பைத் தெளிவாக்க ‘தலைவராக இருந்தான்’ பயன்படுத்தப்பட்டது. மூலத்தில் உள்ள இணை அமைப்பை அரைப்புள்ளி மற்றும் மீளுரைப்பின் மூலம் இயல்பாகப் பேணுகிறது.
