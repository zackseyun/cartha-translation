base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/003.yaml
  text: When David came to his house at Jerusalem[a], the king took the ten women, the concubines whom he had left to keep the house, and put them in guarded custody and provided for them, but he did not go in to them. So they were kept confined until the day of their death[c][b], living as widows.
translation:
  language: ta
  text: தாவீது எருசலேமிலுள்ள தன் வீட்டுக்கு வந்தபோது, வீட்டைக் காப்பதற்காகத் தான் விட்டுச் சென்றிருந்த பத்து மறுமனைவியரையும் அரசன் அழைத்துச் சென்று, காவலுள்ள இடத்தில் வைத்தான்[a]. அவர்களுக்குத் தேவையானவற்றை வழங்கினான்; ஆனால் அவர்களிடம் செல்லவில்லை[b]. இவ்வாறு அவர்கள் இறக்கும் நாள்வரை அடைத்து வைக்கப்பட்டு, உயிருடன் இருக்கும் கணவனைக் கொண்டிருந்தும் விதவைகளைப் போல் வாழ்ந்தார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லச்சொல், “காவலின் வீடு” அல்லது “காவலில் வைக்கும் இடம்”; இது கண்காணிப்புடனான அடைப்புநிலையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அவர்களிடம் செல்லவில்லை” என்பது பாலுறவைக் குறிக்கும் எபிரெய மறைமுகச் சொற்றொடர்.
    reason: cultural_note
  - marker: c
    text: எபிரெயத்தில் சொல்லச்சொல், “உயிருள்ள விதவைநிலை”; தாவீது உயிருடன் இருந்தபோதும் அவர்கள் விதவைகளைப் போல் வாழ்ந்தார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: தன் வீடு
  rationale: בַּיִת இச்சூழலில் அரச இருப்பிடத்தைக் குறிக்கலாம்; ‘வீடு’ எபிரெயச் சொல்லின் வடிவத்தைப் பேணுவதோடு இயல்பான தமிழாகவும் உள்ளது.
- source_word: פִּלַגְשִׁים
  choice: மறுமனைவியர்
  rationale: இச்சொல் பண்டைய அரச குடும்பத்தில் முழு முதன்மை மனைவியைவிடக் குறைந்த சமூக-சட்ட நிலையுடைய அங்கீகரிக்கப்பட்ட துணைவியரைக் குறிக்கிறது. ‘மறுமனைவியர்’ என்பது இழிவுபடுத்தாமல் அந்த இரண்டாம் நிலையைத் தெரிவிக்கிறது.
- source_word: הִנִּיחַ לִשְׁמֹר הַבַּיִת
  choice: வீட்டைக் காப்பதற்காகத் தான் விட்டுச் சென்றிருந்த
  rationale: שׁמר என்பதன் காத்தல், கவனித்தல் என்ற பொருளை ‘காப்பதற்காக’ நேரடியாகக் கொண்டுவருகிறது.
- source_word: בֵּית מִשְׁמֶרֶת
  choice: காவலுள்ள தனியிடம்
  rationale: சொல்லச்சொல்ல ‘காவல்/காவலிருப்பின் வீடு’; கண்காணிப்புடனான தனிமைப்படுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיְכַלְכְּלֵם
  choice: அவர்களுக்குத் தேவையானவற்றை வழங்கினான்
  rationale: தொடர்ந்து பராமரித்து வாழ்வாதாரத் தேவைகளை வழங்கிய பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַאֲלֵיהֶם לֹא בָא
  choice: அவர்களுடன் உறவுகொள்ளவில்லை
  rationale: எபிரெய மொழிமரபில் இது பாலுறவைக் குறிக்கும் இடக்கரடக்கல். சொல்லுக்குச் சொல் தமிழாக்கம் தெளிவிழக்கச் செய்யும் என்பதால் பொருள் நேர்த்தியாகத் தரப்படுகிறது.
- source_word: צְרֻרוֹת
  choice: அடைத்து வைக்கப்பட்டு
  rationale: செயப்பாட்டு வினையெச்சத்தின் விளைவுநிலை மற்றும் நீடித்த அடைப்புநிலை இரண்டையும் பேணுகிறது.
- source_word: עַד יוֹם מֻתָן
  choice: அவர்கள் இறக்கும் நாள்வரை
  rationale: எபிரெய மரபுத்தொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: אַלְמְנוּת חַיּוּת
  choice: உயிருள்ள கணவனைக் கொண்டிருந்தும் விதவைகள்போல் வாழ்ந்தார்கள்
  rationale: ‘உயிரோடுள்ள விதவைநிலை’ என்ற அபூர்வ முரணை விளங்கக்கூடிய தமிழில் வெளிப்படுத்தி, தாவீது உயிருடன் இருந்த நிலையையும் தெளிவாக்குகிறது.
theological_decisions:
- issue: தாவீது மறுமனைவியரை நடத்திய விதத்தின் அற மற்றும் சமூக மதிப்பீடு
  choice: செயலை நியாயப்படுத்தாமலும் உரையில் இல்லாத கண்டனத்தைச் சேர்க்காமலும் அதன் கடுமையான விளைவுகளை விவரித்தல்
  alternative: இதைப் பாதுகாப்பு நடவடிக்கையாக மட்டும் மென்மைப்படுத்துதல் அல்லது மொழிபெயர்ப்பிலேயே வெளிப்படையான அறக்கண்டனம் சேர்த்தல்
  rationale: மூல உரை காவலுடனான தனிமைப்படுத்தல், வாழ்வாதாரப் பராமரிப்பு, பாலுறவு மறுப்பு, மரணம்வரையான விதவைபோன்ற வாழ்வு ஆகியவற்றை விவரிக்கிறது; மொழிபெயர்ப்பு அவற்றின் பதற்றத்தைத் தீர்க்காமல் பேண வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. அரசவைக் குடும்ப உறவின் இரண்டாம் நிலையை ‘மறுமனைவியர்’ எனக் குறித்துள்ளது. மூலத்தின் செயப்பாட்டு, நீடித்த அடைப்புநிலை மற்றும் இறுதி முரணைத் தெளிவாகப் பேணுகிறது.
