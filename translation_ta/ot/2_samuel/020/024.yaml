translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் அரச அதிகாரிகளின் பட்டியலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. மூலத்தின் இரு பெயர்ச்சொல் வாக்கியங்களிலும் உள்ள மறைமுக வினை தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டது; அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டது.
