  yaml_path: translation/ot/2_samuel/020/024.yaml
  text: Adoram was over the forced labor[a], and Jehoshaphat the son of Ahilud was the recorder.
translation:
  language: ta
  text: அதோராம் கட்டாய உழைப்புக்குப் பொறுப்பாளராக இருந்தார்[a]. அகிலூதின் மகன் யோசபாத் அரசுப் பதிவாளராக இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கட்டாய உழைப்புப் படை”; எபிரெயச் சொல் சாதாரண வரிவிதிப்பை அல்ல, அரசுக்காகக் கட்டாயமாகச் செய்யப்படும் உழைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹרָם
  choice: அதோராம்
  rationale: எபிரெய தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: עַל
  choice: பொறுப்பாளராக இருந்தார்
  rationale: நிர்வாகச் சூழலில் ஒரு துறை அல்லது பணியின் மேற்பார்வையையும் அதிகாரத்தையும் குறிக்கிறது; எபிரெய பெயர்ச்சொல் வாக்கியத்தில் மறைந்துள்ள வினை தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டது.
- source_word: הַמַּס
  choice: கட்டாய உழைப்பு
  rationale: அரச நிர்வாகச் சூழலில் இந்தச் சொல் சாதாரண வரியைக் காட்டிலும் அரசுக்காகக் கட்டாயமாகச் செய்யப்படும் உழைப்பையே குறிக்கிறது.
- source_word: יְהוֹשָׁפָט
  choice: யோசபாத்
  rationale: எபிரெய தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிவடிவத்திற்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן אֲחִילוּד
  choice: அகிலூதின் மகன்
  rationale: எபிரெய தந்தைவழி அடையாள அமைப்பு இயல்பான தமிழில் தரப்பட்டது.
- source_word: הַמַּזְכִּיר
  choice: அரசுப் பதிவாளர்
  rationale: அரச ஆவணங்களையும் நினைவுக் குறிப்புகளையும் கவனித்த அரண்மனை அதிகாரியைக் குறிக்கும் பதவி; வெறும் வரலாற்றாசிரியர் அல்லது பொதுச் செயலாளர் என்ற தவறான எண்ணத்தைத் தவிர்க்க 'அரசுப் பதிவாளர்' எனத் தெளிவுபடுத்தப்பட்டது.
