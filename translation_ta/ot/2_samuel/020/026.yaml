source:
  edition: WLC
  text: וְ/גַ֗ם עִירָא֙ הַ/יָּ֣אִרִ֔י הָיָ֥ה כֹהֵ֖ן לְ/דָוִֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/026.yaml
  text: And Ira the Jairite also was priest to David[a].
translation:
  language: ta
  text: யாயீரியனான ஈராவும் தாவீதுக்கு ஆசாரியனாக இருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முதன்மை அமைச்சர்” அல்லது “அரச ஆலோசகர்.” எபிரெயச் சொல் நேரடியாக “ஆசாரியன்” என்று பொருள்படும்; ஆனால் அரசவை சார்ந்த சில சூழல்களில் அது உயரதிகாரியைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: -வும்
  rationale: இணைப்பையும் கூடுதல் வலியுறுத்தலையும் இயல்பான தமிழில் பெயருடன் இணையும் ‘-வும்’ வெளிப்படுத்துகிறது.
- source_word: עִירָא
  choice: ஈரா
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழ் எழுத்துமுறையில் பெயர்த்தெழுதுகிறது.
- source_word: הַיָּאִרִי
  choice: யாயீரியனான
  rationale: குலம் அல்லது இனத் தொடர்பைக் குறிக்கும் எபிரெய அடைமொழியைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; ‘யாயீரின் வழிவந்தவன்’ என்பதும் சாத்தியம்.
- source_word: הָיָה
  choice: இருந்தான்
  rationale: அதிகாரிகளின் பட்டியலில் இது ‘ஆனான்’ என்ற மாற்றத்தைக் காட்டாமல், கடந்தகால நிலையைச் சுட்டும் இணைப்புவினையாக உள்ளது.
- source_word: כֹהֵן
  choice: குரு
  rationale: எபிரெயச் சொல்லின் முதன்மைப் பொருளான சமயப் பணியாளரைத் தமிழில் ‘குரு’ எனத் தருகிறது. அரசவையின் சூழலில் உயரதிகாரி அல்லது அரச ஆலோசகர் என்ற செயல்பாட்டு விளக்கத்திற்கான வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְדָוִד
  choice: தாவீதுக்கு
  rationale: தாவீதுடனான தொடர்பு அல்லது அவருக்குச் செய்த சேவையைக் குறிக்கும் לְ முன்னிடைச்சொல்லின் தெளிவின்மையை ‘தாவீதுக்கு’ காக்கிறது.
theological_decisions:
- issue: அரசவைச் சூழலில் כֹהֵן என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘குரு’
  alternative: தலைமை அமைச்சர் அல்லது அரச ஆலோசகர்
  rationale: כֹהֵן என்பதன் வழக்கமான நேரடிப் பொருள் சமயப் பணியாளர். இங்கு அரசவைப் பதவி குறிக்கலாம் என்றாலும், அதை முதன்மை உரையிலேயே தீர்மானிக்காமல் மூலத்தின் பொருள் இழுப்பைத் தக்கவைத்து, மாற்றுப் புரிதலை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான நிர்வாகப் பட்டியல் நடையைப் பேணுகிறது. ‘தாவீதுக்குக் குருவாக’ என்பது உறவின் துல்லியமான தன்மையைத் தீர்மானிக்காமல் விடுகிறது; அடிக்குறிப்பு உண்மையான சொற்பொருள் ஐயத்தை வெளிப்படுத்துகிறது.
