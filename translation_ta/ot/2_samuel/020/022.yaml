translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் கதைநடையின் சுருக்கமும் காக்கப்பட்டுள்ளன. வன்முறை நிகழ்வு மூலத்திற்கேற்ப நேரடியாகச் சொல்லப்பட்டுள்ளது; விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு அது விளக்கும் மரபுத்தொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
