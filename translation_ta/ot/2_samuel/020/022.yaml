    text: “ஒவ்வொருவரும் தங்கள் கூடாரத்திற்குச் சென்றார்கள்” என்பது மக்கள் தத்தம் இடங்களுக்குக் கலைந்து சென்றதைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
