base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/022.yaml
  text: Then the woman went to all the people in her wisdom[a], and they cut off the head of Sheba son of Bichri and threw it to Joab. Then he blew the trumpet, and they dispersed from the city, each man to his tent; and Joab returned to Jerusalem to the king.
translation:
  language: ta
  text: அப்போது அந்தப் பெண் தன் ஞானத்தால் மக்கள் அனைவரிடமும் சென்றாள். அவர்கள் பிக்ரியின் மகன் ஷெபாவின் தலையை வெட்டி, யோவாபிடம் எறிந்தார்கள். பின்பு யோவாப் கொம்பை ஊதினான்; அவர்கள் நகரத்தைவிட்டு கலைந்து, ஒவ்வொருவரும் தங்கள் கூடாரத்திற்குச் சென்றார்கள்.[a] யோவாப் எருசலேமுக்குத் திரும்பி அரசனிடம் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒவ்வொருவரும் தங்கள் கூடாரத்திற்குச் சென்றார்கள்” என்பது மக்கள் தத்தம் இடங்களுக்குக் கலைந்து சென்றதைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּבוֹא הָאִשָּׁה
  choice: அந்தப் பெண் ... சென்றாள்
  rationale: בוא என்பது நோக்குநிலைக்கேற்ப ‘வந்தாள்’ அல்லது ‘சென்றாள்’ எனப் பொருள்படும்; இங்கு மக்களிடம் அவள் நகர்வதை வெளிப்புறக் கதைசொல்லியின் நோக்கில் ‘சென்றாள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶל כָּל הָעָם
  choice: மக்கள் அனைவரிடமும்
  rationale: עָם என்பதை நகரவாசிகள் அல்லது படையினர் என்று குறுக்காமல், அதன் விரிவான பொருளைத் தக்கவைக்கிறது.
- source_word: בְּחָכְמָתָהּ
  choice: தன் ஞானத்தோடு
  rationale: בְּ முன்னொட்டின் வழி/துணைச் சாயலையும், அவளுடைய ஞானமே செயலை வழிநடத்தியது என்ற கதையழுத்தத்தையும் பாதுகாக்கிறது.
- source_word: וַיִּכְרְתוּ אֶת רֹאשׁ
  choice: தலையை வெட்டி
  rationale: தலையை உடலிலிருந்து துண்டித்ததை நவீன தமிழில் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: பிக்ரியின் மகன் சேபா
  rationale: எபிரேயத் தந்தைவழி அடையாளத்தை இயல்பான தமிழ் வரிசையில் தருகிறது; பெயர்கள் ஒலிபெயர்க்கப்படுகின்றன.
- source_word: וַיַּשְׁלִכוּ אֶל יוֹאָב
  choice: யோவாபிடம் எறிந்தார்கள்
  rationale: எறிதலின் வலிமையையும் யோவாபை நோக்கிய திசையையும் தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: யோவாப் கொம்பை ஊதினான்
  rationale: சூழலால் ஒருமை எழுவாய் யோவாப் என்பது தெளிவு. שׁוֹפָר என்பது ஊதப்படும் கொம்பு; ‘கொம்பு’ மூலப்பொருளைத் தக்கவைக்கிறது.
- source_word: וַיָּפֻצוּ מֵעַל הָעִיר
  choice: அவர்கள் நகரத்தைவிட்டு கலைந்து
  rationale: முற்றுகை நிலையிலிருந்து மக்கள் பிரிந்து சென்றதை இயல்பான தமிழில் தெரிவிக்கிறது; ‘சிதறினர்’ தரக்கூடிய பீதிச் சாயலைத் தவிர்க்கிறது.
- source_word: אִישׁ לְאֹהָלָיו
  choice: ஒவ்வொருவரும் தங்கள் கூடாரத்திற்குச் சென்றார்கள்
  rationale: ‘ஒவ்வொருவனும் அவனுடைய கூடாரத்திற்கு’ என்ற எபிரேய மரபுத்தொடரை வாசிக்க எளிதான உள்ளடக்கிய தமிழில் வழங்குகிறது; அதன் பண்பாட்டு வடிவம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וְיוֹאָב שָׁב יְרוּשָׁלִַם אֶל הַמֶּלֶךְ
  choice: யோவாபோ எருசலேமில் இருந்த அரசனிடம் திரும்பிச் சென்றான்
  rationale: 'ירושלם அடுத்துள்ள אֶל־הַמֶּלֶךְ உடன் இலக்கிடத்தை விளக்குகிறது: அரசன் எருசலேமில் இருந்தான்; யோவாப் அவனிடம் திரும்பினான்.'
