base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/020.yaml
  text: Joab answered and said[a], “Far be it from me, far be it, if I should swallow up or destroy!”
translation:
  language: ta
  text: 'யோவாப் பதிலளித்துச் சொன்னான்: “அப்படி நான் செய்வது ஒருபோதும் இல்லை, ஒருபோதும் இல்லை! நான் விழுங்கவோ அழிக்கவோ மாட்டேன்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் ஆட்கொள்ளவோ பாழாக்கவோ மாட்டேன்.” எபிரேயத்தில் விழுங்குவதையும் அழிவுக்குக் கொண்டுவருவதையும் குறிக்கும் உயிரோட்டமான வினைச்சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן יוֹאָב וַיֹּאמַר
  choice: யோவாப் மறுமொழியாக … என்றான்
  rationale: எபிரேய உரையாடல் தொடரிலுள்ள ‘பதிலளித்துச் சொன்னான்’ என்ற இரட்டை அறிமுகத்தை, இயல்பான நவீனத் தமிழில் அதன் பதிலுரைப் பண்பை இழக்காமல் வழங்குகிறது.
- source_word: חָלִילָה חָלִילָה לִי
  choice: ஒருபோதும் இல்லை! ஒருபோதும் இல்லை!
  rationale: இந்த இருமுறை வரும் இடைச்சொல், ஒரு செயலை மிக வலுவாக மறுக்கும் எபிரேய மரபுத்தொடர். தமிழில் இயல்பான வலியுறுத்தலாகவும், மூலத்தின் இரட்டிப்பைப் பேணியும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אִם אֲבַלַּע וְאִם אַשְׁחִית
  choice: நான் விழுங்கிவிடவோ அழித்துவிடவோ மாட்டேன்
  rationale: חָלִילָה என்பதற்குப் பின் வரும் אִם கூறுகள் மறுக்கப்படும் சாத்தியத்தை அறிமுகப்படுத்துகின்றன. தமிழில் எதிர்மறை வாக்கியமாக வழங்குவது பொருளைத் தெளிவாக்குகிறது; ‘விழுங்கிவிடு’ என்பது בלע என்பதன் உயிரோட்டமான படிமத்தையும், ‘அழித்துவிடு’ என்பது שׁחת என்பதன் நேரடியான பொருளையும் காக்கின்றன.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. வலுவான மறுப்பைக் காட்டும் மூலத்தின் இரட்டிப்பு அப்படியே பேணப்பட்டுள்ளது; முற்றுகைப் பின்னணியிலுள்ள ‘விழுங்குதல்’ என்ற உருவகம் சீராக்கப்படாமல் காக்கப்பட்டுள்ளது.
