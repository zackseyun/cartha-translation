translation_notes:
  register: நவீனத் தரத் தமிழில், இயல்பான ஆனால் கண்ணியமான வரலாற்றுக் கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் ‘யோவாப்,’ ‘சேபா,’ ‘பிக்ரி’ என ஒலிபெயர்க்கப்பட்டுள்ளன. முந்தைய வசனத்தின் அமாசாவைக் குறிக்கும் எபிரெயப் பிரதிப்பெயர் ‘அவன்’ என்று காக்கப்பட்டுள்ளது.
