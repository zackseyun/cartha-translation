base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/013.yaml
  text: As soon as he had been removed from the highway[a], every man passed on after Joab to pursue Sheba son of Bichri.
translation:
  language: ta
  text: அவன் நெடுஞ்சாலையிலிருந்து அகற்றப்பட்டவுடன்[a], அனைவரும் சேபாவைத் துரத்துவதற்காக யோவாபைப் பின்தொடர்ந்து சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாலையிலிருந்து” அல்லது “பெருவழியிலிருந்து.” எபிரெயச் சொல் מְסִלָּה ஒரு நெடுஞ்சாலையையோ முக்கியச் சாலையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: அகற்றப்பட்டவுடன்
  rationale: இந்தக் காலக் கிளவி, தடையாக இருந்த உடல் அகற்றப்பட்டதும் படையினர் உடனடியாக முன்னேறிய நிகழ்வுத் தொடரைச் சுட்டுகிறது. ‘-வுடன்’ என்பது அந்த உடனடியான தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֹגָה
  choice: அவன் ... அகற்றப்பட்ட
  rationale: 'ஹோஃபால் வினைவடிவம் செயப்பாட்டு பொருளைத் தருகிறது: முந்தைய வசனத்தில் கூறப்பட்ட அமாசா சாலையிலிருந்து அகற்றப்பட்டான். எபிரெய உரையைப் போலவே ‘அவன்’ என்று வைத்து, ‘உடல்’ என்பதை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.'
- source_word: מִן הַמְסִלָּה
  choice: நெடுஞ்சாலையிலிருந்து
  rationale: מְסִלָּה என்பது உயர்த்தியமைக்கப்பட்ட சாலை, பெருவழி, அல்லது முக்கியச் சாலை எனப் பொருள்படலாம். ‘நெடுஞ்சாலை’ அதன் குறியீட்டுச் சிறப்பைத் தக்கவைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: עָבַר
  choice: பின்தொடர்ந்து சென்றார்கள்
  rationale: தடை நீங்கியதும் படைவீரர்கள் தொடர்ந்து முன்னேறியதை இங்கு வினை குறிக்கிறது. தமிழில் யோவாபைப் பின்தொடர்ந்த இயக்கத்துடன் இணைத்து கூறுவது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כָּל אִישׁ
  choice: வீரர்கள் அனைவரும்
  rationale: எபிரெயச் சொற்றொடர் சொல்லர்த்தமாக ‘ஒவ்வொரு ஆணும்’ என்றாலும், சூழலில் யோவாபுடன் சென்ற போர்ப்படையினரைக் குறிக்கிறது. ‘வீரர்கள் அனைவரும்’ பாலினத்தையும் இராணுவச் சூழலையும் காத்து இயல்பான தமிழை வழங்குகிறது.
- source_word: אַחֲרֵי יוֹאָב
  choice: யோவாபைப் பின்தொடர்ந்து
  rationale: யோவாபின் பின்னால் சென்று அவரோடு துரத்துதலைத் தொடர்ந்தனர் என்பதே இத்தொடரின் இடவியல் மற்றும் செயற்பாட்டுப் பொருள்.
- source_word: לִרְדֹּף
  choice: துரத்துவதற்காக
  rationale: இந்த வினையெச்சம் படையினர் தொடர்ந்து சென்ற நோக்கத்தை வெளிப்படுத்துகிறது. ‘துரத்துவதற்காக’ என்பது இராணுவக் கதையாடலுக்கு ஏற்ற தெளிவான தமிழ்.
- source_word: אַחֲרֵי שֶׁבַע בֶּן בִּכְרִי
  choice: பிக்ரியின் மகன் சேபாவை
  rationale: எபிரெயத் தந்தைவழிப் பெயரமைப்பைத் தமிழின் இயல்பான ‘பிக்ரியின் மகன் சேபா’ என்ற வடிவில் காக்கிறது.
