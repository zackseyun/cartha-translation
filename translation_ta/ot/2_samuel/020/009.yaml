base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/009.yaml
  text: Joab said to Amasa[a], “Is it well with you, my brother?” And Joab took hold of Amasa’s beard with his right hand to kiss him.
translation:
  language: ta
  text: யோவாப் அமாசாவிடம்[a], “என் சகோதரனே, நீ நலமாக இருக்கிறாயா?” என்று கேட்டான். யோவாப் அமாசாவை முத்தமிடுவதற்காகத் தன் வலது கையால் அமாசாவின் தாடியைப் பிடித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தாடியைப் பிடிப்பதும் முத்தமிடுவதும் நெருக்கமான வாழ்த்துதலுடன் தொடர்புடைய சைகைகள்; ஆனால் இச்சூழலில் இந்தச் செயல் வஞ்சகமானது.
    reason: cultural_note
lexical_decisions:
- source_word: הֲשָׁלוֹם אַתָּה
  choice: நீ நலமாக இருக்கிறாயா?
  rationale: இந்த எபிரெய மொழிவழக்கு ஒருவருடைய நலனையோ அமைதியான நிலையையோ விசாரிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் மூலத்தின் கேள்வித் தன்மையைப் பேணியும் உள்ளது.
- source_word: אָחִי
  choice: என் சகோதரனே
  rationale: மூலத்தில் உள்ள முதலாம் நபர் உடைமைப் பின்னொட்டை வெளிப்படையாகப் பேணுகிறது; சூழலில் யோவாபின் பாசாங்கான நெருக்கத்தையும் எடுத்துக்காட்டுகிறது.
- source_word: וַתֹּחֶז
  choice: பிடித்தான்
  rationale: வன்முறையை இவ்வசனத்திலேயே மிகைப்படுத்தாமல், பிடித்துக்கொள்ளுதல் என்ற செயலைத் தெளிவாகச் சொல்கிறது.
- source_word: יַד יְמִין יוֹאָב
  choice: தன் வலது கையால்
  rationale: செயலைச் செய்தது யோவாபின் வலது கை என்ற மூல விவரத்தை இயல்பான தமிழ் தொடரில் பேணுகிறது.
- source_word: בִּזְקַן עֲמָשָׂא
  choice: அவனுடைய தாடியை
  rationale: அமாசாவின் தாடியைக் குறிக்கும் மூலப் பொருளை இயல்பான தமிழில் தருகிறது; பெயர் ஏற்கெனவே வாக்கியத்தில் இருப்பதால் பிரதிப்பெயர் தெளிவாக உள்ளது.
- source_word: לִנְשָׁק לוֹ
  choice: அமாசாவை முத்தமிடுவதற்காக
  rationale: ל உடன் வரும் வினையெச்சத்தின் நோக்கப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
