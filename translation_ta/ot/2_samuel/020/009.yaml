  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கேள்வியின் எபிரெய மொழிவழக்கு இயல்பான தமிழ் நலவிசாரிப்பாக மொழிபெயர்க்கப்பட்டுள்ளது; பண்பாட்டு விவரம் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
