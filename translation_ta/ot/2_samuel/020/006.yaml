  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל אֲבִישַׁ֔י עַתָּ֗ה יֵ֧רַֽע לָ֛/נוּ שֶׁ֥בַע בֶּן בִּכְרִ֖י מִן אַבְשָׁל֑וֹם אַ֠תָּה קַ֞ח אֶת עַבְדֵ֤י אֲדֹנֶ֨י/ךָ֙ וּ/רְדֹ֣ף אַחֲרָ֔י/ו פֶּן מָ֥צָא ל֛/וֹ עָרִ֥ים בְּצֻר֖וֹת וְ/הִצִּ֥יל עֵינֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/006.yaml
  text: Then David said to Abishai[a], “Now Sheba son of Bichri will do us more harm than Absalom. You, take your lord’s servants and pursue after him, lest he find fortified cities for himself and escape from our sight.”
translation:
  language: ta
  text: அப்போது தாவீது அபிசாயிடம், “இப்போது பிக்கிரியின் மகன் சேபா, அப்சலோமைவிட நமக்கு அதிகத் தீங்கு செய்வான். நீ உன் தலைவனுடைய பணியாளர்களை அழைத்துக்கொண்டு அவனைத் துரத்திச் செல்; இல்லையெனில், அவன் தனக்காக அரண்களால் பாதுகாக்கப்பட்ட நகரங்களைக் கண்டடைந்து, நம் பார்வையிலிருந்து தப்பிவிடுவான்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் நேரடியாக, “நம் கண்களை விடுவித்து”; இது “நம் பார்வையிலிருந்து தப்பிவிடுவான்” அல்லது “நம்மைத் தவிர்த்து தப்பிவிடுவான்” என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרַע לָנוּ
  choice: நமக்கு அதிகத் தீங்கு செய்வான்
  rationale: இங்கு רעע என்பது அறநெறிசார் ‘தீமை’ என்பதைவிடத் தீங்கு அல்லது தொல்லை விளைவிப்பதைக் குறிக்கிறது; מן־אבשלום உடனான ஒப்பீட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: பிக்கிரியின் மகன் சேபா
  rationale: தமிழின் இயல்பான உறவுமுறைத் தொடரில் தந்தையின் பெயர் முன்னிட்டு, பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: מִן אַבְשָׁלוֹם
  choice: அப்சலோமைவிட
  rationale: מִן இங்கு ஒப்பீட்டைக் குறிக்கிறது; ‘அப்சலோமைவிட’ என்பது அதன் சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: אַתָּה קַח
  choice: நீ ... அழைத்துக்கொண்டு
  rationale: தனிப்பட்ட சுட்டுப்பெயரான אַתָּה தரும் வலியுறுத்தலை ‘நீ’ என வெளிப்படையாகப் பேணுகிறது; பணியாளர்களை உடன் கூட்டிச் செல்லும் சூழலில் ‘அழைத்துக்கொண்டு’ இயல்பாக உள்ளது.
- source_word: עַבְדֵי אֲדֹנֶיךָ
  choice: உன் தலைவனுடைய பணியாளர்கள்
  rationale: אֲדֹנֶיךָ அபிசாயின் தலைவனான தாவீதைக் குறிக்கிறது. ‘தலைவன்’ படிநிலை உறவைப் பேணுகிறது; இங்கு அடிமைநிலையைத் தேவையின்றி முன்னிறுத்தாமல் עֲבָדִים என்பதற்கு ‘பணியாளர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וּרְדֹף אַחֲרָיו
  choice: அவனைத் துரத்திச் செல்
  rationale: இராணுவச் சூழலிலுள்ள தொடர்ந்து பின்தொடர்தலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: פֶּן
  choice: இல்லையெனில்
  rationale: எதிர்பார்க்கப்படும் அபாயத்தை அறிமுகப்படுத்தும் פֶּן என்பதன் எச்சரிக்கைச் சாரத்தைத் தெளிவாகவும் வாசிக்க எளிதாகவும் தருகிறது.
- source_word: מָצָא לוֹ עָרִים בְּצֻרוֹת
  choice: அவன் தனக்காக அரண்சூழ்ந்த நகரங்களைக் கண்டடைந்து
  rationale: מָצָא என்பதன் ‘கண்டடைதல்’ பொருளையும், לוֹ என்பதன் தன்நலச் சாரத்தையும், בְּצֻרוֹת என்பதன் பாதுகாப்பு அரண் பொருளையும் பேணுகிறது.
- source_word: וְהִצִּיל עֵינֵינוּ
  choice: நம் பார்வையிலிருந்து தப்பிவிடுவான்
  rationale: சொல்லுக்குச் சொல் ‘நம் கண்களை விடுவித்தல்/பறித்தல்’ என்ற அரிதான எபிரேய மரபுத்தொடர், சூழலில் கண்காணிப்பிலிருந்து தப்புவதைக் குறிக்கிறது; தமிழ் வடிவம் பார்வை உருவகத்தைப் பேணுகிறது.
