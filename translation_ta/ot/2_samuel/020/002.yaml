source:
  edition: WLC
  text: וַ/יַּ֜עַל כָּל אִ֤ישׁ יִשְׂרָאֵל֙ מֵ/אַחֲרֵ֣י דָוִ֔ד אַחֲרֵ֖י שֶׁ֣בַע בֶּן בִּכְרִ֑י וְ/אִ֤ישׁ יְהוּדָה֙ דָּבְק֣וּ בְ/מַלְכָּ֔/ם מִן הַ/יַּרְדֵּ֖ן וְ/עַד יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/002.yaml
  text: So every man of Israel went up from following David to follow Sheba son of Bichri[a], but the men of Judah held fast to their king[b], from the Jordan to Jerusalem.
translation:
  language: ta
  text: எனவே, இஸ்ரவேலின் ஒவ்வோர் ஆணும்[a] தாவீதைப் பின்பற்றுவதை விட்டுவிட்டு, பிக்ரியின் மகன் சேபாவைப் பின்பற்ற மேலே சென்றார்கள்; ஆனால் யூதாவின் ஆண்கள் யோர்தான் முதல் எருசலேம் வரை தங்கள் அரசனை உறுதியாகப் பற்றிக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்பட, “இஸ்ரவேலின் ஒவ்வோர் ஆணும்.” இது ஆண்பால் ஒருமையில் அமைந்த தொகுப்புத் தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: பின்பற்றிச் சென்றார்கள்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே போதல்.’ இங்கு இயக்கத்தையும் தாவீதிடமிருந்து சேபாவிடம் மாறிய ஆதரவையும் சூழல் காட்டுகிறது. தமிழில் தனியாக ‘மேலே சென்றார்கள்’ என்பது இயல்பற்றதும் தவறான புவியியல் கருத்தைத் தரக்கூடியதும் என்பதால், அடுத்துள்ள אַחֲרֵי உடன் இணைத்து இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேல் ஆண்கள் அனைவரும்
  rationale: எபிரெயத்தில் சொற்பட ‘இஸ்ரவேலின் ஒவ்வோர் ஆணும்’ என்ற ஆண்பால் ஒருமைத் தொகுப்புத் தொடர். இது ஆண்களைக் குறிக்கும் வடிவத்தைப் பாதுகாத்து, தமிழில் இயல்பான பன்மையாக அளிக்கப்படுகிறது.
- source_word: מֵאַחֲרֵי דָוִד
  choice: தாவீதைப் பின்பற்றுவதை விட்டுவிட்டு
  rationale: ‘தாவீதின் பின்னாலிருந்து’ என்ற சொற்படியான கருத்து, அவரைப் பின்பற்றிய ஆதரவை விட்டு விலகுவதை இச்சூழலில் குறிக்கிறது.
- source_word: אַחֲרֵי שֶׁבַע בֶּן בִּכְרִי
  choice: பிக்ரியின் மகன் சேபாவைப் பின்பற்றி
  rationale: மீண்டும் வரும் ‘பின்னால்’ என்ற தொடர் சேபாவுக்கு ஆதரவு மாறியதைக் காட்டுகிறது; ‘பின்பற்றி’ என்பது அந்தப் படிமத்தையும் பொருளையும் இயல்பாகக் காக்கிறது.
- source_word: וְאִישׁ יְהוּדָה
  choice: ஆனால் யூதா ஆண்கள்
  rationale: வடிவில் ஒருமையாக இருந்தாலும் இது தொகுப்புப் பொருளுடையது. முந்தைய இஸ்ரவேல் ஆண்களின் விலகலுக்கு மாறாக இருப்பதால் וְ இங்கு ‘ஆனால்’ என வழங்கப்படுகிறது.
- source_word: דָּבְקוּ
  choice: உறுதியாகப் பற்றிக்கொண்டு
  rationale: דבק என்பது ஒட்டிக்கொள்வது அல்லது இறுகப் பற்றுவது என்ற உருவகத்தைக் கொண்டது; அரசனுக்கான உறுதியான பற்றை விளக்கமாக்காமல் அந்த உருவகத்தைப் பாதுகாக்கிறது.
- source_word: בְמַלְכָּם
  choice: தங்கள் அரசனை
  rationale: דבק உடன் வரும் ב தமிழில் ‘அரசனைப் பற்றிக்கொண்டு’ என இயல்பாக அமைகிறது. பன்மை பின்னொட்டு யூதா ஆண்களின் அரசனாகிய தாவீதைக் குறிக்கிறது.
- source_word: מִן הַיַּרְדֵּן וְעַד יְרוּשָׁלִָם
  choice: யோர்தான் முதல் எருசலேம் வரை அவரோடு சென்றார்கள்
  rationale: இந்தத் தொடர் பயணத்தின் புவியியல் எல்லையைச் சுட்டுகிறது. தமிழில் வாக்கியத் தொடர்பைத் தெளிவாக்க ‘அவரோடு சென்றார்கள்’ சேர்க்கப்படுகிறது; இது அவர்கள் அரசனைப் பற்றிக்கொண்டு வந்ததன் சூழலார்ந்த பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தாவீதிடமிருந்து சேபாவுக்கு மாறிய அரசியல் விசுவாசம்
  choice: ‘தாவீதைப் பின்பற்றுவதை விட்டுவிட்டு ... சேபாவைப் பின்பற்றி’ என்று மொழிபெயர்த்தல்
  alternative: ‘தாவீதின் பின்னாலிருந்து மேலே சென்று சேபாவின் பின்னால் சென்றார்கள்’
  rationale: மீண்டும் வரும் אַחֲרֵי என்ற சொல்லின் ‘பின்பற்றுதல்’ உருவகத்தைப் பாதுகாத்தபடி, இது வெறும் இடமாற்றமல்ல ஆதரவு மாறுதல் என்பதையும் சூழலுக்கு ஏற்ப வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘யோர்தான்,’ ‘எருசலேம்,’ ‘சேபா,’ ‘பிக்ரி’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமப் பெயர்வடிவங்களாக வைக்கப்பட்டுள்ளன. எபிரெயத்தின் concrete metaphor ஆன דבק, ‘உறுதியாகப் பற்றிக்கொண்டு’ எனப் பாதுகாக்கப்பட்டுள்ளது.
