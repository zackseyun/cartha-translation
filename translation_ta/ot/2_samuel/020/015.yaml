base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/015.yaml
  text: They came and besieged him in Abel-beth-maacah[a], and they cast up a siege ramp against the city, and it stood against the rampart[c][b]; and all the people who were with Joab were destroying it to bring down the wall.
translation:
  language: ta
  text: அவர்கள் வந்து, ஆபேல்-பெத்-மாக்காவில் அவனை முற்றுகையிட்டார்கள்.[a] நகருக்கு எதிராக ஒரு முற்றுகை மேட்டைக் குவித்தார்கள்; அது வெளி அரணை ஒட்டி நின்றது.[b][c] யோவாபோடு இருந்த மக்கள் அனைவரும் மதிலை வீழ்த்துவதற்காக, அதைத் தகர்த்துக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதற்கு எதிராக முற்றுகையிட்டார்கள்.” எபிரெயத்தில் “அவனுக்கு எதிராக” என்று உள்ளது; நகரம் முற்றுகையிடப்பட்டாலும், இலக்காக இருந்த செபாவை இது முன்னிறுத்தலாம்.
    reason: alternative_reading
  - marker: b
    text: “முற்றுகை மேடு” என்பதை “மண் அணை” அல்லது “மண் குவியல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “வெளி அரண்” என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல், வெளிப்புறத் தற்காப்புக் கட்டமைப்பு அல்லது கொத்தளத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: அவர்கள் வந்து
  rationale: בוא என்பதன் தொடர்நிலை கதைவினையை இயல்பான தமிழ் கதைநடையில் தருகிறது.
- source_word: וַיָּצֻרוּ עָלָיו
  choice: அவனை முற்றுகையிட்டார்கள்
  rationale: ஆண்பால் ஒருமை பின்னொட்டு செபாவை இலக்காகக் காட்டுவதால், நகரம் முற்றுகைக்குள்ளான போதும் மூலத்தின் ‘அவனை’ என்ற கவனம் பாதுகாக்கப்படுகிறது.
- source_word: בְּאָבֵלָה בֵּית הַמַּעֲכָה
  choice: ஆபேல்-பெத்-மாக்காவில்
  rationale: இடப்பெயரை ஒலிபெயர்த்து, தமிழ் வேற்றுமை உருபுடன் இயல்பாக வழங்குகிறது.
- source_word: וַיִּשְׁפְּכוּ סֹלְלָה
  choice: ஒரு முற்றுகை மேட்டைக் குவித்தார்கள்
  rationale: மண்ணைக் குவித்து அமைக்கும் siege mound/ramp என்ற சூழல்சார் பொருளைத் தெளிவாகக் காட்டுகிறது; שׁפך என்பதன் சொற்படிமத்தையும் ‘குவித்தார்கள்’ ஓரளவு காக்கிறது.
- source_word: אֶל הָעִיר
  choice: நகருக்கு எதிராக
  rationale: אֶל என்பதன் திசையையும் இங்குள்ள பகைமை நோக்கத்தையும் தமிழ் இராணுவச் சூழலில் இயல்பாகத் தருகிறது.
- source_word: וַתַּעֲמֹד בַּחֵל
  choice: அது வெளி அரணை ஒட்டி நின்றது
  rationale: பெண்பால் வினை முன்வரும் סֹלְלָה-வைக் குறிக்கிறது. חֵל என்பது வெளிப்புறத் தற்காப்பு அரண் அல்லது கொத்தளமாக இருக்கக்கூடியதால் மிகத் துல்லியமாகக் குறுக்காமல் மொழிபெயர்க்கப்படுகிறது.
- source_word: וְכָל הָעָם אֲשֶׁר אֶת יוֹאָב
  choice: யோவாபோடு இருந்த மக்கள் அனைவரும்
  rationale: אֶת இங்கு உடனிருப்பைச் சுட்டும் விடுபட்ட அமைப்பாக இருப்பதால், படைவீரர்களைச் சூழல் உணர்த்தினாலும் ‘மக்கள்’ என்ற மூலச் சொல்லைத் தக்கவைக்கிறது.
- source_word: מַשְׁחִיתִם
  choice: அதைச் சிதைத்துக்கொண்டிருந்தார்கள்
  rationale: שׁחת என்பதன் தொடரும் அழிவுச் செயலைக் காட்டுகிறது; வெளிப்படையாகக் கூறப்படாத பொருளை ‘அது’ என வைத்துப் மூலத்தின் சற்றே தெளிவற்ற தன்மையைப் பாதுகாக்கிறது.
- source_word: לְהַפִּיל הַחוֹמָה
  choice: மதிலை இடித்துத் தள்ளுவதற்காக
  rationale: Hiphil வடிவத்தின் ‘விழச் செய்தல்’ பொருளை இயல்பான தமிழ் முற்றுகைச் சொல்லாட்சியில் வழங்குகிறது.
