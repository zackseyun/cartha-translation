base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/003.yaml
  text: But the people said[a], “You must not go out, for if we flee, they will not pay attention to us; and if half of us die, they will not pay attention to us. For you are worth ten thousand of us[c][b]; so now it is better that you be ready to help us from the city.”
translation:
  language: ta
  text: ஆனால் மக்கள், “நீர் வெளியே வர வேண்டாம். நாங்கள் தப்பியோடினால் அவர்கள் எங்களைப் பொருட்படுத்த மாட்டார்கள்[a]; எங்களில் பாதிப்பேர் இறந்தாலும் அவர்கள் எங்களைப் பொருட்படுத்த மாட்டார்கள். ஏனெனில், நீர் எங்களில் பத்தாயிரம் பேருக்கு இணையானவர்[b]. ஆகவே, இப்போது நீர் நகரத்தில் இருந்து எங்களுக்கு உதவத் தயாராக இருப்பது நல்லது[c]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “அவர்கள் எங்கள்மேல் தங்கள் இருதயத்தை வைக்க மாட்டார்கள்”; அதாவது, எங்களைத் தங்கள் முக்கிய கவனமாகக் கருத மாட்டார்கள்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “ஏனெனில் இப்போது நீர் எங்களைப் போலப் பத்தாயிரம் [பேர்]” என உள்ளது. இதன் பொருள் தாவீது அவர்களில் பத்தாயிரம் பேருக்கு இணையான மதிப்புடையவர் என்பதாகும்.
    reason: lexical_alternative
  - marker: c
    text: இந்த இறுதிச் சொற்றொடர், தேவைப்பட்டால் உதவியையோ கூடுதல் படையையோ அனுப்புவதற்காகத் தாவீது நகரத்தில் இருக்க வேண்டும் என்று பொருள்படலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תֵצֵא
  choice: நீர் வெளியே வர வேண்டாம்
  rationale: எதிர்மறை வினை வடிவம் இங்கு வலுவான தடையையோ அறிவுறுத்தலையோ தெரிவிக்கிறது. மரியாதைக்குரிய ஒருமை வடிவமான ‘நீர்’ தாவீதிடம் மக்கள் பேசும் சூழலுக்கு ஏற்றது.
- source_word: כִּי אִם נֹס נָנוּס
  choice: நாங்கள் தப்பியோடினாலும்
  rationale: வினையெச்ச முழுவடிவமும் அதே வேருடைய வினையும் சேர்ந்த எபிரெய அமைப்பு செயலை வலியுறுத்துகிறது. இங்குள்ள வாதத்தின் கருத்தை இயல்பான தமிழில் நிபந்தனைச் சலுகையாக ‘தப்பியோடினாலும்’ தெரிவிக்கிறது.
- source_word: לֹא יָשִׂימוּ אֵלֵינוּ לֵב
  choice: அவர்கள் எங்களைப் பொருட்படுத்த மாட்டார்கள்
  rationale: சொல்லுக்குச் சொல் ‘எங்கள்மேல் இருதயத்தை வைக்க மாட்டார்கள்’ என்ற மரபுத்தொடர், எதிரிகள் படையினரைத் தங்கள் முக்கிய இலக்காகக் கருத மாட்டார்கள் என்பதைக் குறிக்கிறது.
- source_word: וְאִם יָמֻתוּ חֶצְיֵנוּ
  choice: எங்களில் பாதிப்பேர் இறந்தாலும்
  rationale: மூல வினை நேரடியாக ‘இறத்தல்’ என்பதையே கூறுகிறது; போர்ச் சூழலை முன்னிட்டு ‘கொல்லப்பட்டாலும்’ என்று விளக்கமாக மாற்றாமல் மூலத்தின் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: כִּי עַתָּה כָמֹנוּ עֲשָׂרָה אֲלָפִים
  choice: ஏனெனில், நீர் எங்களில் பத்தாயிரம் பேருக்குச் சமமானவர்
  rationale: கடினமான எபிரெய சொற்றொடர் தாவீதின் மதிப்பு படைவீரர் பத்தாயிரம் பேரின் மதிப்புக்கு ஒப்பானது என்ற கருத்தைச் சூழலில் தெரிவிக்கிறது. அடியொட்டான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְעַתָּה טוֹב
  choice: ஆகவே, ... இப்போது நல்லது
  rationale: טוֹב இங்கு முன்மொழியப்படும் சிறந்த நடவடிக்கையைச் சுட்டுகிறது. தமிழில் காரணவிளைவு தொடர்பை ‘ஆகவே’ தெளிவாக்குகிறது.
- source_word: מֵעִיר לְעָזִיר
  choice: நகரத்திலிருந்து எங்களுக்கு உதவத் தயாராக இருப்பது
  rationale: מן நகரத்தை உதவி வரும் இடமாகக் குறிக்கிறது; கடைசி வடிவம் עזר, ‘உதவு’, என்பதோடு தொடர்புடையதாகப் பொதுவாகப் புரிந்துகொள்ளப்படுகிறது. தேவையானபோது ஆதரவு வழங்க நகரத்தில் இருப்பதை இவ்வாக்கியம் இயல்பாக வெளிப்படுத்துகிறது.
