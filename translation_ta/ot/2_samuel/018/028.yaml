  rationale: The revision retains the source’s ambiguity in “சமாதானம்,” its concrete prostration imagery, the courtly phrase “என் ஆண்டவராகிய ராஜா,” and the Hebrew divine name. It corrects the posture wording and replaces the misleading footnote explanation with a genuine contextual alternative for “has handed over.”
