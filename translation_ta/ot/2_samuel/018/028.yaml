base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/028.yaml
  text: Ahimaaz called out and said to the king[a], “Peace!” Then he bowed down before the king with his face to the ground and said, “Blessed be Yahweh your God[b], who has delivered up the men who lifted their hand against my lord the king.”
translation:
  language: ta
  text: அகிமாஸ் கூவி, ராஜாவிடம், “சமாதானம்!”[a] என்றான். பின்பு அவன் ராஜாவுக்கு முன்பாக முகம் தரையில் படுமாறு வணங்கி, “என் ஆண்டவராகிய ராஜாவுக்கு எதிராகக் கையை உயர்த்திய அந்த மனிதர்களை ஒப்படைத்த உமது இறைவனாகிய யாவே போற்றப்படுவாராக!”[b] என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை “எல்லாம் நலமே!” என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் ‘சாலோம்’ என்பது வாழ்த்தாக மட்டுமல்லாமல், நலம் அல்லது நல்ல செய்தியை அறிவிக்கும் சொல்லாகவும் பயன்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “ஒப்படைத்த” என்பதற்கு “கையளித்த” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: உரத்த குரலில்
  rationale: தூதன் ராஜாவை நோக்கித் தொலைவிலிருந்து குரலெழுப்பும் சூழலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שָׁלוֹם
  choice: சமாதானம்!
  rationale: எபிரெயச் சொல்லின் சுருக்கமான வலிமையையும், வாழ்த்து அல்லது நலமான செய்தி என்ற இரு சாத்தியங்களையும் தக்கவைக்கிறது.
- source_word: וַיִּשְׁתַּחוּ לַמֶּלֶךְ לְאַפָּיו אָרְצָה
  choice: ராஜாவுக்கு முன்பாகத் தரைமட்டும் முகங்குப்புற வணங்கி
  rationale: உடலைத் தரைவரை தாழ்த்தி முகங்குப்புற விழுந்து மரியாதை செலுத்தும் செயலைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: בָּרוּךְ יְהוָה אֱלֹהֶיךָ
  choice: உமது இறைவனாகிய யாவே போற்றப்படுவாராக
  rationale: வழிபாட்டுத் தோத்திரச் சூத்திரத்தின் உயர்ந்த நடையைப் பேணுகிறது; தெய்வீகப் பெயரை ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: סִגַּר
  choice: ஒப்படைத்த
  rationale: எதிரிகளை மற்றொருவரின் அதிகாரத்திற்குள் கையளித்தல் என்ற இராணுவச் சூழலுக்குரிய பொருளை வழங்குகிறது; ‘அடைத்தார்’ என்ற வேறு அடிப்படை நிழற்பொருளை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: הָאֲנָשִׁים
  choice: மனிதர்களை
  rationale: குறிப்பிட்ட ஆண் எதிரிகளைக் குறிக்கும் பன்மையைத் தருகிறது; தமிழில் இயல்பான பொதுப்பெயராக உள்ளது.
- source_word: נָשְׂאוּ אֶת יָדָם
  choice: தங்கள் கையை உயர்த்திய
  rationale: பகைமை அல்லது கலகத்தை உணர்த்தும் எபிரெய உருவகத்தை விளக்கமின்றித் தக்கவைக்கிறது.
- source_word: בַּאדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய ராஜாவுக்கு எதிராக
  rationale: அரசவைக்குரிய மரியாதை நடையையும் எதிர்ப்பைக் குறிக்கும் உறவையும் தெளிவாகப் பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெயத் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், பொதுவாக ஏற்கப்பட்ட நவீன ஒலிப்புக்கு அண்மையாகத் தமிழில் தருகிறது.
- issue: சங்கீதத் தன்மையுள்ள בָּרוּךְ என்ற புகழ்ச்சி வாய்பாடு
  choice: போற்றப்படுவாராக
  alternative: ஆசீர்வதிக்கப்பட்டவர்; வாழ்த்தப்படுவாராக
  rationale: மனிதன் கடவுளுக்கு ஆசீர்வாதம் அளிப்பது போன்ற தவறான நவீனத் தமிழ் உணர்வைத் தவிர்த்து, கடவுளைப் புகழும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கதைநடைக்குத் தெளிவானதும் அரசவைக்கும் தோத்திரத்திற்கும் ஏற்ற கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ராஜா’, ‘ஆண்டவர்’, ‘யாவே’ ஆகியவை சூழலுக்குரிய மரியாதைத் தொனியைப் பேணுகின்றன; எபிரெய உருவகங்களும் உண்மையான சொற்பொருள் மாற்றுகளும் அடிக்குறிப்புகளுடன் காக்கப்பட்டுள்ளன.
