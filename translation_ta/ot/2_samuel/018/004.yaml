translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘உங்கள் பார்வைக்கு’ என்ற சொற்றொடர் எபிரேய உருவகத்தை இயல்பாகப் பாதுகாக்கிறது. படைச் சூழலைத் தெளிவாக்க ‘அணிவகுத்து’ பயன்படுத்தப்பட்டாலும், ‘மக்கள்’ மற்றும் ‘வெளியே சென்றார்கள்’ என்பவை மூலத்தின் பரந்த சொற்களைத் தக்கவைக்கின்றன.
