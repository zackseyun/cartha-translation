  source_fidelity: முதற் இரண்டு வாக்கியங்களும் எபிரேய மூலத்துக்கு உண்மையாக உள்ளன. ஆனால் «அணிவகுத்து» என்பது יָצְאוּ (‘வெளியே சென்றார்கள்’) என்பதைக் காட்டிலும் குறிப்பான படைநடைச் செயலைச் சேர்க்கிறது. எண்ணியல் அமைப்பு படைப்பிரிவுகளைக் குறித்தாலும், அந்தக் கூடுதல் வினைச்சொல்லை மூலம் வெளிப்படையாகச் சொல்லவில்லை.
