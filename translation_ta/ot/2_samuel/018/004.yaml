base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/004.yaml
  text: The king said to them[a], “What seems good in your eyes, I will do.” So the king stood beside the gate[c][b], and all the people went out by hundreds and by thousands.
translation:
  language: ta
  text: அரசன் அவர்களிடம், “உங்கள் பார்வைக்கு எது நல்லதோ, அதையே செய்வேன்” என்றான்.[a] பின்பு அரசன் வாயிலின் அருகே நின்றான்.[b] மக்கள் அனைவரும் நூறு பேராகவும் ஆயிரம் பேராகவும் வெளியே சென்றார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில், “உங்கள் கண்களில் எது நல்லதோ, அதைச் செய்வேன்.” அதாவது, அவர்கள் எதைச் சிறந்தது என்று கருதுகிறார்களோ அதை அரசன் செய்வான்.
    reason: lexical_alternative
  - marker: b
    text: “வாயிலின் பக்கத்தில்” என்றும் மொழிபெயர்க்கலாம். எபிரேய மொழியில் சொல்லாட்சியாக, “வாயிலின் கையருகில்”; இது வாயிலுக்கு அருகிலுள்ள இடத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, நூறு பேரும் ஆயிரம் பேரும் கொண்ட ஒழுங்கமைக்கப்பட்ட படைப்பிரிவுகளாக.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר יִיטַב בְּעֵינֵיכֶם
  choice: உங்கள் பார்வைக்கு எது நல்லதோ
  rationale: ‘உங்கள் கண்களில் நல்லது’ என்ற எபிரேய மதிப்பீட்டு மரபுத்தொடரின் உருவகத்தை ஓரளவு காத்து, நவீன தமிழில் இயல்பாகக் கருத்தை வெளிப்படுத்துகிறது.
- source_word: אֶעֱשֶׂה
  choice: அதையே செய்வேன்
  rationale: עשה என்பதன் நேரான எதிர்காலப் பொருளைத் தருகிறது; அவர்களுடைய ஆலோசனையை அரசன் ஏற்றுக்கொண்டதையும் கூடுதல் விளக்கமின்றி உணர்த்துகிறது.
- source_word: אֶל יַד הַשַּׁעַר
  choice: வாயிலின் அருகே
  rationale: சொல்லாட்சியாக ‘வாயிலின் கையருகில்’ என வரும் எபிரேய மரபுத்தொடர் அருகாமையைக் குறிக்கிறது; ‘அருகே’ என்பது இயல்பான தமிழாக்கம்.
- source_word: וְכָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: சூழல் படைவீரர்களைப் பற்றியதாக இருந்தாலும், மூலத்தின் ‘மக்கள்’ என்ற பொதுச் சொல்லைத் தக்கவைக்கிறது.
- source_word: יָצְאוּ
  choice: வெளியே சென்றார்கள்
  rationale: יצא என்பதன் பரந்த ‘வெளியே செல்லுதல்’ என்ற பொருளைப் பாதுகாக்கிறது; படைசார் அமைப்பு அடுத்த சொற்றொடரில் வெளிப்படுகிறது.
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: நூறு நூறாகவும் ஆயிரம் ஆயிரமாகவும் அணிவகுத்து
  rationale: எண்ணியல் அமைப்பைத் தக்கவைத்து, இது தனிநபர் எண்ணிக்கையல்லாமல் ஒழுங்கமைக்கப்பட்ட படைப்பிரிவுகளைக் குறிப்பதை இயல்பான தமிழில் தெளிவாக்குகிறது.
