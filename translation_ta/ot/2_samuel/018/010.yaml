  text: וַ/יַּרְא֙ אִ֣ישׁ אֶחָ֔ד וַ/יַּגֵּ֖ד לְ/יוֹאָ֑ב וַ/יֹּ֗אמֶר הִנֵּה֙ רָאִ֣יתִי אֶת אַבְשָׁלֹ֔ם תָּל֖וּי בָּ/אֵלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/010.yaml
  text: One man saw it and told Joab[a], and said, “Look, I saw Absalom hanging in the terebinth tree.”
translation:
  language: ta
  text: ஒருவன் அதைக் கண்டு யோவாபிடம் தெரிவித்தான். அவன், “இதோ, அப்சலோம் டெரிபிந்த் மரத்தில்[a] தொங்கிக்கொண்டிருப்பதை நான் கண்டேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓக் மரத்தில்.” எபிரெயச் சொல் אֵלָה பொதுவாக டெரிபிந்த் மரத்தைக் குறிக்கும்; சில மொழிபெயர்ப்புகளில் இது பொதுவாக “ஓக்” என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד
  choice: ஒருவன்
  rationale: ஆண்பால் ஒருமையையும், குறிப்பிட்ட ஒருவன் என்ற எபிரெயச் சொல்லாட்சியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וַיַּרְא
  choice: அதைக் கண்டு
  rationale: வினைச்சொல்லின் பொருள் ‘கண்டான்’; தமிழில் வாக்கியம் இயல்பாக அமைய, சூழலில் தெளிவாக உள்ள செயப்படுபொருள் ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: וַיַּגֵּד
  choice: தெரிவித்தான்
  rationale: நிகழ்ந்ததை யோவாபிடம் அறிவித்தான் என்ற செய்தியறிவிப்பு நுணுக்கத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லின் வலிமையை, பழமையான நடையின்றி, சுருக்கமாகக் காக்கிறது.
- source_word: רָאִיתִי
  choice: நான் கண்டேன்
  rationale: கடந்தகாலத்தில் நிறைவுற்ற நேரடிக் காட்சியைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: תָּלוּי
  choice: தொங்கிக்கொண்டிருப்பதை
  rationale: செயலின் தொடர்நிலையை உணர்த்தும் செயல்பாட்டு எச்சத்தின் பொருளையும், அப்சலோம் அந்நிலையில் காணப்பட்டதையும் இயல்பாகக் காட்டுகிறது.
- source_word: בָּאֵלָה
  choice: டெரிபிந்த் மரத்தில்
  rationale: אֵלָה என்பதன் குறிப்பான தாவரவியல் பொருளான ‘terebinth’ என்பதைக் காக்கிறது; ‘மரத்தில்’ என்பது இவ்விடத்தில் בְּ குறிக்கும் இருப்பிட உறவை இயல்பாக வெளிப்படுத்துகிறது.
