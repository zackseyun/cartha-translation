translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமும் கதைநடையின் தெளிவும் காக்கப்பட்டுள்ளன. மூலத்தின் இரண்டு தொடர்ச்சியான செய்தியறிவிப்பு வினைகள் தமிழில் சுமையாகாமல் இருக்க முதல் வாக்கியம் தனியாக்கப்பட்டுள்ளது; நேரடி உரையும் கவன ஈர்ப்புச் சொல்லான ‘இதோ’வும் தக்கவைக்கப்பட்டுள்ளன.
