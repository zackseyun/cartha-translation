base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/025.yaml
  text: Then the watchman called out and told the king. And the king said[a], “If he is by himself, there is news in his mouth.” And he kept coming nearer and nearer.
translation:
  language: ta
  text: அப்போது காவலன் கூவி அரசனுக்குத் தெரிவித்தான். அரசன், “அவன் தனியாக வருகிறான் என்றால், அவன் வாயில் செய்தி இருக்கிறது” என்றான்.[a] அவன் நெருங்கி நெருங்கி வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் வெறுமனே ‘செய்தி’ என்றும் பொருள்படும்; இச்சூழலில் அது நல்ல செய்தியைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: காவலன்
  rationale: צפה என்பதிலிருந்து வந்த இச்சொல், கவனித்துப் பார்ப்பதற்காக நிறுத்தப்பட்ட ஒருவரைக் குறிக்கிறது. நகர அல்லது படைச் சூழலில் ‘காவலன்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיִּקְרָא
  choice: உரக்கக் கூவி
  rationale: இங்கு קרא என்பது காவலன் கண்டதை அரசனுக்குக் கேட்கும்படி உரத்த குரலில் அறிவித்ததைக் குறிக்கிறது.
- source_word: וַיַּגֵּד לַמֶּלֶךְ
  choice: அரசனிடம் தெரிவித்தான்
  rationale: Hiphil வடிவிலுள்ள נגד என்பது சொல்லுதல் அல்லது அறிக்கை செய்தல் என்று பொருள்படும்; ‘தெரிவித்தான்’ இந்த அறிக்கைத் தன்மையை இயல்பான தமிழில் தருகிறது.
- source_word: אִם לְבַדּוֹ
  choice: அவன் தனியாக வந்தால்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘அவன் தனியாக இருந்தால்’ என்பதாக இருந்தாலும், ஓடிவரும் தூதனைப் பற்றிய சூழலில் ‘தனியாக வந்தால்’ என்பது தமிழில் தெளிவாக உள்ளது; தனிமை என்ற அடிப்படைப் பொருளும் காக்கப்படுகிறது.
- source_word: בְּשׂוֹרָה
  choice: நற்செய்தி
  rationale: בְּשׂוֹרָה என்பது செய்தி அல்லது அறிவிப்பு எனப் பொருள்படலாம்; பல கதைச் சூழல்களில் சாதகமான செய்தியைக் குறிக்கிறது. தனியாக வரும் ஓட்டக்காரனைப் பார்த்து அரசன் செய்யும் ஊகம் இங்கு ‘நற்செய்தி’ என்பதை ஆதரிக்கிறது.
- source_word: בְּפִיו
  choice: அவன் வாயில்
  rationale: எபிரெய மொழியின் ‘அவன் வாயில்’ என்ற உருவகத்தைத் தக்கவைத்துள்ளது; செய்தியை வாய்மொழியாகக் கொண்டுவருவதை இது இயல்பாகக் காட்டுகிறது.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְקָרֵב
  choice: மேலும் மேலும் நெருங்கி வந்துகொண்டிருந்தான்
  rationale: இந்த எபிரெயக் கட்டமைப்பு தொடர்ந்து நிகழும் முன்னேற்றத்தையும் அதிகரிக்கும் அண்மையையும் வெளிப்படுத்துகிறது; தமிழ்ச் சொற்றொடர் இரண்டையும் இயல்பாகத் தருகிறது.
