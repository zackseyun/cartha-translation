revisions:
- from: அப்போது காவலன் உரக்கக் கூவி, அரசனிடம் தெரிவித்தான். அரசன், “அவன் தனியாக வந்தால், அவன் வாயில் நற்செய்தி இருக்கும்” என்றான். அவன் மேலும் மேலும் நெருங்கி வந்துகொண்டிருந்தான்.
  to: அப்போது காவலன் கூவி அரசனுக்குத் தெரிவித்தான். அரசன், “அவன் தனியாக வருகிறான் என்றால், அவன் வாயில் செய்தி இருக்கிறது” என்றான்.[a] அவன் நெருங்கி நெருங்கி வந்தான்.
  rationale: மூலத்தில் வெளிப்படையாக இல்லாத ‘நல்ல’ என்ற மதிப்பீட்டையும், தமிழில் சமயச்சாயல் தரக்கூடிய ‘நற்செய்தி’யையும் நீக்கி, நடுநிலையான ‘செய்தி’ பயன்படுத்தப்பட்டது. அடிக்குறிப்பு மூலம் சூழல்சார் சாதகமான சாயல் பாதுகாக்கப்பட்டுள்ளது. தனியாக வரும் ஒருவனைச் சுட்டும் கதைச்சூழலைத் தக்கவைத்தபடியே, எபிரெய நிபந்தனையை ‘தனியாக வருகிறான் என்றால்’ எனத் தரப்பட்டுள்ளது.
