translation:
  language: ta
  text: அப்போது யோவாபின் ஆயுதங்களைச் சுமந்த பத்து இளைஞர்கள் அப்சலோமைச் சூழ்ந்துகொண்டு, அவனை அடித்துக் கொன்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: சூழ்ந்துகொண்டு
  rationale: סבב இங்கு ஒருவரைச் சுற்றி வளைத்துக்கொள்ளும் இராணுவச் செயலைக் குறிக்கிறது; ‘சூழ்ந்துகொண்டு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: עֲשָׂרָה נְעָרִים
  choice: பத்து இளைஞர்கள்
  rationale: נְעָרִים என்பது இச்சூழலில் சிறுவர்களை அல்ல, யோவாபுக்குக் கீழ்ப்பட்ட இளம் போர்வீரர்களைக் குறிக்கிறது; அவர்களுடைய துல்லியமான பதவியை ஊகிக்காமல் மூலச் சொல்லின் பொருளைப் பேணுகிறது.
- source_word: נֹשְׂאֵי כְּלֵי יוֹאָב
  choice: யோவாபின் ஆயுதங்களைச் சுமந்த
  rationale: இந்தப் பங்கேற்புச் சொற்றொடர் சொல்லளவில் யோவாபின் கருவிகள் அல்லது ஆயுதங்களைச் சுமப்பவர்களைக் குறிக்கிறது. ‘ஆயுதங்களைச் சுமந்த’ என்பது ‘கவசதாரிகள்’ போன்ற பதவி சார்ந்த கூடுதல் விளக்கத்தைத் தவிர்த்து மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
- source_word: וַיַּכּוּ
  choice: அடித்து
  rationale: נכה என்பது அடித்தல் அல்லது தாக்குதல் என்ற பரந்த பொருளுடையது; இங்கு ‘அடித்து’ உடல்ரீதியான தாக்குதலை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וַיְמִיתֻהוּ
  choice: கொன்றார்கள்
  rationale: Hiphil வடிவிலுள்ள מות ‘சாகச் செய்தல்’, அதாவது ‘கொல்லுதல்’ என்று பொருள்படும்; ‘கொன்றார்கள்’ நேரடியான, இயல்பான தமிழ்.
- source_word: אַבְשָׁלוֹם
  choice: அப்சலோம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
