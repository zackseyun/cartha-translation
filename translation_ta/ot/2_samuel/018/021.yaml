  yaml_path: translation/ot/2_samuel/018/021.yaml
  text: Then Joab said to the Cushite[a], “Go, tell the king what you have seen.” And the Cushite bowed down to Joab and ran.
translation:
  language: ta
  text: அப்போது யோவாப் கூஷியனிடம்[a], “நீ போய், கண்டதை அரசரிடம் தெரிவி” என்றான். கூஷியன் யோவாபின் முன் பணிந்து, ஓடினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இதைத் தனிப்பட்ட பெயராக எடுத்தால், “கூஷி”; பாரம்பரியமாக, “எத்தியோப்பியர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוּשִׁי
  choice: கூஷியன்
  rationale: எபிரெயச் சொல் பொதுவாக கூஷ் இனத்தை அல்லது நாட்டைச் சேர்ந்தவரைக் குறிக்கும் இனப்பெயராகப் புரிந்துகொள்ளப்படுகிறது. தனிப்பட்ட பெயராகவும் எடுத்துக்கொள்ள வாய்ப்புள்ளதால் அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לֵךְ
  choice: நீ போய்
  rationale: הלך என்பதன் கட்டளை வடிவத்தை இயல்பான நவீனத் தமிழில் நேரடியான கட்டளையாக மொழிபெயர்க்கிறது.
- source_word: הַגֵּד
  choice: தெரிவி
  rationale: נגד என்பதன் ஹிஃபில் கட்டளை வடிவம் ஒன்றை அறியச் செய்வது அல்லது செய்தியாக அறிவிப்பது என்பதைக் குறிக்கிறது; அரசருக்குச் செய்தி அளிக்கும் சூழலுக்கு ‘தெரிவி’ இயல்பாகப் பொருந்துகிறது.
- source_word: אֲשֶׁר רָאִיתָה
  choice: கண்டதை
  rationale: ‘நீ கண்டவற்றை/எதை நீ கண்டாயோ அதை’ என்ற உறவுத்தொடரைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: וַיִּשְׁתַּחוּ
  choice: தலைவணங்கி
  rationale: உடலைத் தாழ்த்தி மரியாதை செலுத்தும் செயலைக் குறிக்கிறது; இச்சூழலில் வழிபாடு என்ற பொருளைத் தேவையின்றி புகுத்தாமல், யோவாபுக்குச் செலுத்திய பணிவான மரியாதையை வெளிப்படுத்துகிறது.
- source_word: וַיָּרֹץ
  choice: ஓடினான்
  rationale: רוץ என்ற வினையின் நேரடியான பொருளையும் கதையின் வேகத்தையும் காக்கிறது.
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர் வடிவம் கதையின் அடுத்த நிகழ்வை முன்னெடுப்பதை நவீனத் தமிழின் இயல்பான உரையாடல் அமைப்பில் வெளிப்படுத்துகிறது.
