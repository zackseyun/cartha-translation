  text: וַ/יְשַׁלַּ֨ח דָּוִ֜ד אֶת הָ/עָ֗ם הַ/שְּׁלִשִׁ֤ית בְּ/יַד יוֹאָב֙ וְ֠/הַ/שְּׁלִשִׁית בְּ/יַ֨ד אֲבִישַׁ֤י בֶּן צְרוּיָה֙ אֲחִ֣י יוֹאָ֔ב וְ/הַ֨/שְּׁלִשִׁ֔ת בְּ/יַ֖ד אִתַּ֣י הַ/גִּתִּ֑י וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל הָ/עָ֔ם יָצֹ֥א אֵצֵ֛א גַּם אֲנִ֖י עִמָּ/כֶֽם־־־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/002.yaml
  text: 'David sent out the troops: one third under Joab[a], one third under Abishai son of Zeruiah, Joab’s brother, and one third under Ittai the Gittite. And the king said to the troops, “I myself will surely go out with you.”'
translation:
  language: ta
  text: தாவீது படைவீரர்களில் மூன்றில் ஒரு பகுதியை யோவாபின் கட்டுப்பாட்டின் கீழும்[a], மூன்றில் ஒரு பகுதியை யோவாபின் சகோதரனான செருயாவின் மகன் அபிசாயின் கட்டுப்பாட்டின் கீழும், மூன்றில் ஒரு பகுதியைக் கித்தியனான இத்தாயின் கட்டுப்பாட்டின் கீழும் அனுப்பினான். அரசன் படைவீரர்களிடம், “நானும் உங்களோடு நிச்சயமாகப் புறப்படுவேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “கையில்”; இது ஒருவரின் அதிகாரம் அல்லது கட்டுப்பாட்டின் கீழ் இருப்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: அனுப்பினான்
  rationale: இராணுவ நடவடிக்கைக்காகப் படைப்பிரிவுகளை அனுப்புவதைச் சூழல் தெளிவாக்குகிறது; எளிய, இயல்பான தமிழில் வினையின் பொருளை இது தக்கவைக்கிறது.
- source_word: הָעָם
  choice: படைவீரர்கள்
  rationale: சொல்லுக்கு அடிப்படையில் ‘மக்கள்’ என்ற பொருள் இருந்தாலும், இப்போர்ச் சூழலில் தாவீதின் போர்ப்படையினரையே குறிக்கிறது.
- source_word: הַשְּׁלִשִׁית / הַשְּׁלִשִׁת
  choice: மூன்றில் ஒரு பகுதி
  rationale: படை மூன்று சமப் பிரிவுகளாகப் பிரிக்கப்பட்டதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְּיַד
  choice: தலைமையில்
  rationale: சொல்லுக்குச் சொல் ‘கையில்’ என்றாலும், இங்கு அதிகாரம் அல்லது படைத்தலைமையின் கீழ் ஒப்படைத்தல் என்ற எபிரெய மரபுத்தொடர் பொருளை ‘தலைமையில்’ இயல்பாகத் தருகிறது.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: யோவாபின் சகோதரனும் செருயாவின் மகனுமான அபிசாய்
  rationale: இரு குடும்ப அடையாளங்களையும் தமிழில் தெளிவான இயல்பான அடைமொழித் தொடராகப் பாதுகாக்கிறது.
- source_word: אִתַּי הַגִּתִּי
  choice: கித்தியனான இத்தாய்
  rationale: தனிப்பெயரையும் காத்தைச் சேர்ந்தவர் என்ற இன/ஊர் அடையாளத்தையும் மரபான தமிழ் வடிவில் தருகிறது.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: அரசன் ... என்றான்
  rationale: எபிரெயக் கதைநடையின் உரையாடல் அறிமுகத்தை இயல்பான தமிழ் சொல் வரிசையில் தருகிறது.
- source_word: יָצֹא אֵצֵא
  choice: நிச்சயமாகப் புறப்படுவேன்
  rationale: வினையெச்ச முழுவடிவமும் வினைமுற்றும் சேர்ந்த எபிரெய வலியுறுத்தலை ‘நிச்சயமாக’ வெளிப்படுத்துகிறது.
- source_word: גַּם אֲנִי
  choice: நானும்
  rationale: அரசனும் படைவீரர்களுடன் தனிப்பட்ட முறையில் செல்வதாகக் கூறும் சேர்க்கைப் பொருளையும் வலியுறுத்தலையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: עִמָּכֶם
  choice: உங்களோடு
  rationale: உடன்செல்லுதலை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
