  text: וַ/תְּהִי שָׁ֧ם הַ/מִּלְחָמָ֛ה נפצית עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַ/יֶּ֤רֶב הַ/יַּ֨עַר֙ לֶ/אֱכֹ֣ל בָּ/עָ֔ם מֵ/אֲשֶׁ֥ר אָכְלָ֛ה הַ/חֶ֖רֶב בַּ/יּ֥וֹם הַ/הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/008.yaml
  text: The battle spread there over the face of all the land[a], and the forest devoured more of the people that day than the sword devoured.
translation:
  language: ta
  text: அங்கே போர் நாடெங்கும் பரவியது[a]. அந்நாளில் வாள் விழுங்கியதைவிடக் காடு அதிகமான மக்களை விழுங்கியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அங்கே போர் நாடெங்கும் சிதறியிருந்தது.” எபிரெய வினை வடிவம், போர் அந்தப் பகுதி முழுவதும் சிதறிப் பரவியிருந்ததை வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נפצית
  choice: பரவியது
  rationale: פוץ என்பதன் நிஃபால் வடிவம் சிதறிப் பரவுதல் அல்லது பரந்துபோதலைக் குறிக்கிறது. போர்க்களம் விரிந்ததைக் கூறும் இச்சூழலில் ‘பரவியது’ இயல்பானதும் மூலத்தின் கருத்தைத் தெளிவாகத் தருவதுமாகும்.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: நாடெங்கும்
  rationale: இது அந்தப் பகுதி முழுவதிலும் பரந்திருந்த நிலையைச் சுட்டும் எபிரெய வழக்கு. ‘நாடெங்கும்’ என்பது உலகமெங்கும் என்ற தவறான பொருளைத் தவிர்த்து, உள்ளூர் நிலப்பரப்பைக் குறிக்கும் இயல்பான தமிழ்.
- source_word: וַיֶּרֶב ... לֶאֱכֹל
  choice: விழுங்கிய ... அதிகம்
  rationale: רבה உடன் לֶאֱכֹל மற்றும் ஒப்பீட்டைக் குறிக்கும் מֵאֲשֶׁר வருவதால், வாளைவிடக் காடு அதிகமானோரைப் பலிகொண்டது என்பதே பொருள். ‘விழுங்கிய ... அதிகம்’ ஒப்பீட்டையும் உருவகத்தையும் காக்கிறது.
- source_word: הַיַּעַר
  choice: காடு
  rationale: יַעַר என்பது மரங்கள் அடர்ந்த காட்டுப்பகுதியைக் குறிக்கிறது; ‘காடு’ இந்நிகழ்வுரைக்கு ஏற்ற பொதுவான நவீனத் தமிழ் சொல்.
- source_word: לֶאֱכֹל / אָכְלָה
  choice: விழுங்கிய
  rationale: ‘உண்ணுதல்’ என்ற வினை இங்கு உயிரைப் பலிகொள்வதை உருவகமாகக் குறிக்கிறது. ‘விழுங்கியது’ அந்த உயிருள்ள உருவகத்தையும் காடு–வாள் இணை அமைப்பையும் காக்கிறது.
- source_word: בָּעָם
  choice: மக்கள்
  rationale: காடு பலிகொண்ட மக்களின் எண்ணிக்கையைச் சுட்டும் பகுதியுணர்வு தமிழில் ஒப்பீட்டு வாக்கிய அமைப்பால் இயல்பாக வெளிப்படுகிறது.
- source_word: מֵאֲשֶׁר אָכְלָה הַחֶרֶב
  choice: வாள் விழுங்கியவர்களைவிட
  rationale: வாளால் கொல்லப்பட்டவர்களோடு நேரடியான ஒப்பீடு செய்யப்படுகிறது. ‘விழுங்கிய’ என்பதை மீண்டும் பயன்படுத்துவது எபிரெய மூலத்தின் இணை அமைப்பையும் மனிதப்படுத்தும் உருவகத்தையும் பேணுகிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்நாளில்
  rationale: குறிப்பிட்ட அந்தப் போர்நாளைக் குறிக்கும் இயல்பான, கண்ணியமான தமிழ் காலவுரை.
