  text: Or if I had dealt falsely against his life, and no matter is hidden from the king, then you yourself would have stood aside.
translation:
  language: ta
  text: அல்லது, நான் அவனுடைய உயிருக்கு எதிராக வஞ்சகமாகச் செயல்பட்டிருந்தால்—எந்தக் காரியமும் அரசனிடமிருந்து மறைவாக இருக்காது—நீயே ஒதுங்கி நின்றிருப்பாய்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשִׂיתִי בְנַפְשׁוֹ שֶׁקֶר
  choice: நான் அவனுடைய உயிருக்கு எதிராகத் துரோகம் செய்திருந்தால்
  rationale: சொல்லாட்சியில் உள்ள ‘பொய்மை/வஞ்சகம் செய்தல்’ என்பதையும், בְנַפְשׁוֹ என்பதன் ‘அவனுடைய உயிருக்கு எதிராக’ என்ற திசையையும் இயல்பான தமிழில் பாதுகாக்கிறது; சூழலில் உயிரைக் கொல்வது உட்பொருளாக இருந்தாலும் அதை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: וְכָל־דָּבָר לֹא־יִכָּחֵד מִן־הַמֶּלֶךְ
  choice: எந்தக் காரியமும் அரசனுக்கு மறைவாக இருப்பதில்லை
  rationale: எதிர்மறை எபிரெயச் சொல்லமைப்பின் பொருளை இயல்பான தமிழில் தருகிறது; அரசன் எல்லாவற்றையும் அறிந்துகொள்வான் என்ற கருத்தை அதிகப்படுத்தாமல் கூறுகிறது.
- source_word: וְאַתָּה תִּתְיַצֵּב מִנֶּגֶד
  choice: நீயே விலகி நின்றிருப்பாய்
  rationale: מִנֶּגֶד இங்கு தூரத்தில் அல்லது ஆதரவளிக்காமல் ஒதுங்கி நிற்பதைக் குறிக்கிறது. ‘எனக்கு எதிராக’ என்று மூலத்தில் இல்லாத குறிப்பைச் சேர்க்காமல், சூழலுக்கேற்ற ‘விலகி’ பயன்படுத்தப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழ்; அரசவைக் கதையாடலுக்கேற்ற கண்ணியமான, தெளிவான நடை. மூலத்தின் நிபந்தனைத் தன்மையும் இடைச்செருகல் போன்ற ‘அரசனுக்கு எதுவும் மறைவதில்லை’ என்ற வலியுறுத்தலும் கோடுகளால் பாதுகாக்கப்பட்டுள்ளன.
