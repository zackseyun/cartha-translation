source:
  edition: WLC
  text: וַ/יִּקְח֣וּ אֶת אַבְשָׁל֗וֹם וַ/יַּשְׁלִ֨יכוּ אֹת֤/וֹ בַ/יַּ֨עַר֙ אֶל הַ/פַּ֣חַת הַ/גָּד֔וֹל וַ/יַּצִּ֧בוּ עָלָ֛י/ו גַּל אֲבָנִ֖ים גָּד֣וֹל מְאֹ֑ד וְ/כָל יִשְׂרָאֵ֔ל נָ֖סוּ אִ֥ישׁ ל/אהל/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/017.yaml
  text: And they took Absalom and threw him into the great pit in the forest[a], and they set up over him a very large heap of stones. And all Israel fled[b], each man to his tent.
translation:
  language: ta
  text: அவர்கள் அப்சலோமை எடுத்துக் காட்டிலிருந்த பெரிய குழிக்குள் எறிந்து, அவன்மேல் மிகப் பெரிய கற்குவியலை எழுப்பினார்கள். இஸ்ரவேல் மக்கள் அனைவரும் அவரவர் கூடாரத்திற்கு[a] ஓடிப்போனார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கூடாரத்திற்கு” என்பது இங்கு அவரவர் உறைவிடத்திற்கு அல்லது வீட்டிற்கு என்பதைக் குறிக்கும் மரபுத்தொடராக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: எடுத்துக்
  rationale: לקח என்பதன் வழக்கமான கதைநடைப் பொருளை நேரடியாகத் தருகிறது; மூலத்தில் இல்லாத வன்முறையைச் சேர்க்கவில்லை.
- source_word: וַיַּשְׁלִיכוּ אֹתוֹ
  choice: அவனை எறிந்து
  rationale: שלך இங்கு உடலை இழிவாகவும் வலுக்கட்டாயமாகவும் அப்புறப்படுத்திய செயலைக் குறிக்கிறது; ‘எறிந்து’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: בַיַּעַר
  choice: காட்டிலிருந்த
  rationale: יער என்பதன் பொருள் ‘காடு’; குழி காட்டுக்குள் இருந்ததைக் தமிழில் இயல்பாகத் தொடர்புபடுத்துகிறது.
- source_word: אֶל הַפַּחַת הַגָּדוֹל
  choice: பெரிய குழிக்குள்
  rationale: פחת என்பது குழி அல்லது பள்ளத்தைக் குறிக்கிறது; இச்சூழலில் ‘குழி’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַיַּצִּבוּ עָלָיו
  choice: அவன்மேல் … எழுப்பினார்கள்
  rationale: கற்களைக் குவித்து அவன்மேல் ஒரு பெரிய குவியலை அமைத்த செயலை ‘எழுப்பினார்கள்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: גַּל אֲבָנִים גָּדוֹל מְאֹד
  choice: மிகப் பெரிய கற்குவியலை
  rationale: גל אבנים என்பதைக் ‘கற்குவியல்’ சுருக்கமாகவும் துல்லியமாகவும் தருகிறது; מאד வழங்கும் வலியுறுத்தலை ‘மிகப் பெரிய’ காக்கிறது.
- source_word: וְכָל יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள் அனைவரும்
  rationale: தேசியக் கூட்டுப்பெயரைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: נָסוּ
  choice: ஓடிப்போனார்கள்
  rationale: נוס குறிக்கும் தப்பியோடும் செயலை நவீனத் தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: אִישׁ לְאֹהָלוֹ
  choice: அவரவர் கூடாரத்திற்கு
  rationale: எபிரெயத் தொடரின் பகிர்நிலைப் பொருளையும் ‘கூடாரம்’ என்ற மூலப் படிமத்தையும் காக்கிறது.
theological_decisions:
- issue: אִישׁ לְאֹהָלוֹ என்ற ஆண்பால் ஒருமை பகிர்நிலைத் தொடர்
  choice: அவரவர் கூடாரத்திற்கு
  alternative: ஒவ்வொரு ஆணும் தன் கூடாரத்திற்கு
  rationale: இங்கு אִישׁ என்பது கூட்டத்தில் உள்ள ஒவ்வொருவரையும் பகிர்நிலையாகக் குறிக்கும் மரபுத்தொடர். ‘அவரவர்’ அதன் பொருளை இயல்பான தமிழில் தருகிறது; தேவையின்றி பாலின வலியுறுத்தலைச் சேர்ப்பதில்லை.
- issue: לְאֹהָלוֹ என்பதன் நேரடிப் படிமமும் மரபுத்தொடர்ப் பொருளும்
  choice: கூடாரத்திற்கு
  alternative: வீட்டிற்கு
  rationale: ‘கூடாரம்’ என்ற மூலப் படிமம் தமிழிலும் புரியக்கூடியது. அது ஒருவரின் உறைவிடம் அல்லது இல்லம் என்ற மரபுத்தொடர்ப் பொருளைக் கொண்டிருக்கலாம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான செயல்கள் ஒரே வாக்கிய ஓட்டத்தில் வைக்கப்பட்டுள்ளன; ‘குழி,’ ‘கற்குவியல்,’ ‘கூடாரம்’ ஆகிய தெளிவான மூலப் படிமங்கள் பாதுகாக்கப்பட்டுள்ளன.
