translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடையின் நேர்த்தியும் காக்கப்பட்டுள்ளன. செய்தியைச் சுமந்து செல்லுதல் என்ற உருவகத்தை விட, தமிழில் இயல்பான ‘செய்தி கொண்டுசெல்லுதல்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் உள்ள சொல்லின் நல்ல செய்தி/பொதுச் செய்தி நெகிழ்வு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
