base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/020.yaml
  text: Joab said to him[a], “You are not a bearer of news today. You may carry news on another day, but today you must not carry news, because the king’s son is dead.”
translation:
  language: ta
  text: யோவாப் அவனிடம், “இன்று நீ செய்தி கொண்டு செல்பவன் அல்ல[a]. வேறொரு நாளில் நீ செய்தி கொண்டு செல்லலாம்; ஆனால் இன்று செய்தி கொண்டு செல்லக் கூடாது. ஏனெனில் அரசனின் மகன் இறந்துவிட்டான்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நல்ல செய்தியைக் கொண்டு செல்பவன்.” எபிரெயச் சொல் பொதுவாகச் செய்தியையோ—அடிக்கடி நல்ல செய்தியையோ—குறிக்கலாம்; ஆனால் இங்கு அரசனின் மகன் இறந்த செய்தியே சூழலாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ בְּשֹׂרָה
  choice: செய்தி கொண்டுசெல்பவன்
  rationale: எபிரெயச் சொற்றொடர் சொல்லர்த்தமாக ‘செய்திக்குரிய மனிதன்’ எனினும், சூழலில் செய்தியை எடுத்துச் செல்லும் தூதரைக் குறிக்கிறது. ‘செய்தி கொண்டுசெல்பவன்’ என்பது நவீனத் தமிழில் இயல்பாகவும், செய்தி நல்லதா கெட்டதா என்ற மூலத்தின் நெகிழ்வைத் தக்கவைத்தும் உள்ளது.
- source_word: וּבִשַּׂרְתָּ
  choice: நீ செய்தி கொண்டுசெல்லலாம்
  rationale: இன்றைய மறுப்புக்கு மாறாக வேறொரு நாளில் அனுமதி அல்லது வாய்ப்பு உண்டு என்ற சூழல்சார் பொருளை ‘கொண்டுசெல்லலாம்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לֹא תְבַשֵּׂר
  choice: செய்தி கொண்டுசெல்லக் கூடாது
  rationale: לֹא உடன் வரும் வினைவடிவம் இங்கு யோவாபின் தடையை வெளிப்படுத்துகிறது; ‘கூடாது’ இயல்பான நவீனத் தமிழ்க் கட்டளைநடை.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: தடைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லைத் தெளிவாகக் காட்டுகிறது.
- source_word: בֶּן הַמֶּלֶךְ
  choice: அரசனின் மகன்
  rationale: எபிரெயக் கட்டமைப்பின் உறவுப் பொருளை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: מֵת
  choice: இறந்துவிட்டான்
  rationale: மரணம் நிகழ்ந்து அதன் விளைவு தற்போதும் நிலவுவதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַיּוֹם הַזֶּה
  choice: இன்று
  rationale: மீண்டும் வரும் காலக் குறிப்பை நவீனத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
