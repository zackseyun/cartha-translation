  terminology: ‘யோவாப்’, ‘வெள்ளித் துண்டுகள்’, ‘இடுப்புப்பட்டை’ ஆகியவை பொருத்தமானவை. மூலத்தில் வெள்ளிக்கான எடை அல்லது நாணய அலகு சொல்லப்படாததை அடிக்குறிப்பு துல்லியமாக விளக்குகிறது. கடப்பாட்டைக் குறிக்கும் எபிரெய மொழிநடைக்கான மாற்று வாசகமும் அடிக்குறிப்பில் சரியாகத் தரப்பட்டுள்ளது.
