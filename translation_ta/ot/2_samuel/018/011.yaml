  source_fidelity: மூல எபிரெயத்தின் உரையாடல் அமைப்பும் முக்கியச் சொற்களும் நன்றாகக் காக்கப்பட்டுள்ளன. הַמַּגִּיד לֹו என்பதற்கு ‘தனக்குச் செய்தி சொன்ன மனிதன்’ பொருத்தமானது; וְהִנֵּה ரָאִיתָ என்பதன் சுட்டிக்காட்டும் வலியுறுத்தல் ‘இதோ, நீ அவனைப் பார்த்தாயே!’ என்பதில் இயல்பாக வெளிப்படுகிறது. ‘அங்கேயே தரையில் விழும்படி அடிக்கவில்லை’ என்பது הִכִּיתוֹ שָׁם אָרְצָה-வின் தாக்கி தரையில் விழச் செய்யும் கருத்தை, ‘கொல்லவில்லை’ என்று மிகையாக வரையறுக்காமல் தருகிறது. வְעָלַי לָתֶת לְךָ-வின் கடப்பாட்டு நுணுக்கம் ‘கொடுக்க வேண்டியது என் பொறுப்பாயிருந்திருக்கும்’ என்பதில் பாதுகாக்கப்பட்டுள்ளது.
