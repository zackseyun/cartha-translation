base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/011.yaml
  text: Then Joab said to the man who had told him[a], “Look, you saw him[b]; why then did you not strike him there to the ground? And I would have been obliged to give you ten pieces of silver and one belt.”
translation:
  language: ta
  text: அப்போது யோவாப், தனக்குச் செய்தி சொன்ன மனிதனிடம், “இதோ, நீ அவனைப் பார்த்தாயே! அப்படியிருக்க, ஏன் அவனை அங்கேயே தரையில் விழும்படி அடிக்கவில்லை? உனக்குப் பத்து வெள்ளித் துண்டுகளையும்[a] ஒரு இடுப்புப்பட்டையையும் கொடுக்க வேண்டியது என் பொறுப்பாயிருந்திருக்கும்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக ‘பத்து வெள்ளி’ என்றே உள்ளது; குறிப்பிட்ட அலகு சொல்லப்படாததால், தமிழில் இயல்பாக இருக்க ‘வெள்ளித் துண்டுகள்’ என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நான் உனக்குப் பத்து வெள்ளித் துண்டுகளையும் ஒரு இடுப்புப்பட்டையையும் கொடுத்திருப்பேன்.’ எபிரெய மொழிநடை இன்னும் சொற்சொல்லாக, ‘உனக்குக் கொடுப்பது என்மேல் இருந்திருக்கும்’ என்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּגִּיד לֹו
  choice: தனக்குச் செய்தி சொன்ன மனிதன்
  rationale: பெயரெச்ச வினை வடிவம் செய்தி தெரிவித்த மனிதனைக் குறிக்கிறது; சூழலில் ஏற்கெனவே நிகழ்ந்த தகவல் அறிவிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְהִנֵּה רָאִיתָ
  choice: இதோ, நீ அவனைப் பார்த்தாயே
  rationale: הִנֵּה என்பதன் சுட்டிக்காட்டும், வலியுறுத்தும் தன்மையை ‘இதோ’ காக்கிறது; எபிரெயத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள், சூழலில் அப்சலோமைத் தெளிவாகக் குறிப்பதால் தமிழில் சேர்க்கப்பட்டுள்ளது.
- source_word: הִכִּיתוֹ שָׁם אָרְצָה
  choice: அவனை அங்கேயே தரையில் விழும்படி அடிக்கவில்லை
  rationale: נכה என்பதன் அடித்தல் என்ற படிமத்தை ‘கொல்லவில்லை’ என்று மிகையாகத் தீர்மானிக்காமல் காக்கிறது; שָׁם மற்றும் אָרְצָה ஆகிய இரண்டின் ‘அங்கே’ மற்றும் ‘தரையை நோக்கி’ என்ற கூறுகளும் வெளிப்படுகின்றன.
- source_word: וְעָלַי לָתֶת לְךָ
  choice: உனக்குக் கொடுக்க வேண்டியது என் பொறுப்பாயிருந்திருக்கும்
  rationale: עָלַי + வினையெச்சத்தின் ‘என்மேல் இருந்திருக்கும்’ என்ற பொறுப்பு அல்லது கடப்பாட்டு நுணுக்கத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: עֲשָׂרָה כֶסֶף
  choice: பத்து வெள்ளித் துண்டுகள்
  rationale: மூலத்தில் குறிப்பிட்ட எடை அலகோ நாணய அலகோ இல்லை; ஆகவே ‘சேக்கல்’ அல்லது ‘நாணயம்’ என்று மிகையாகக் குறிப்பதற்குப் பதிலாக பொதுவான ‘வெள்ளித் துண்டுகள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: חֲגֹרָה אֶחָת
  choice: ஒரு இடுப்புப்பட்டை
  rationale: חֲגֹרָה என்பது இடுப்பில் அணியும் பட்டை அல்லது கச்சையைக் குறிக்கிறது; ‘இடுப்புப்பட்டை’ நவீன தமிழில் தெளிவான இணைச்சொல், மேலும் אֶחָת என்பதையும் ‘ஒரு’ எனக் காக்கிறது.
theological_decisions:
- issue: வெகுமதி அளிப்பது குறித்த எபிரெய மொழிநடையின் கடப்பாட்டு நுணுக்கம்
  choice: கொடுக்க வேண்டியது என் பொறுப்பாயிருந்திருக்கும்
  alternative: நான் கொடுத்திருப்பேன்
  rationale: மூலத்தின் עָלַי + வினையெச்ச அமைப்பு வெறும் எதிர்கால நிபந்தனைச் செயலை மட்டுமல்லாமல், யோவாபின்மேல் இருந்திருக்கும் பொறுப்பு அல்லது கடப்பாட்டையும் உணர்த்துகிறது; அந்தத் tension-ஐ மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வரலாற்றுக் கதையாடலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பது உரையாடலின் வலியுறுத்தலைக் காக்கிறது; ‘அங்கேயே’ யோவாபின் கூர்மையான கேள்வித் தொனியை இயல்பாக வெளிப்படுத்துகிறது. வெள்ளியின் அலகும் கடப்பாட்டு மொழிநடையும் அடிக்குறிப்புகளில் தெளிவுபடுத்தப்பட்டுள்ளன.
