base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/029.yaml
  text: And the king said[a], “Is it well with the young man Absalom?” Ahimaaz said, “I saw a great commotion when Joab sent the king’s servant and your servant, but I did not know what it was.”
translation:
  language: ta
  text: அரசன், “இளைஞன் அப்சலோம் நலமாக இருக்கிறானா?” என்று கேட்டான். அகிமாஸ், “யோவாப் அரசனுடைய பணியாளனையும் உமது பணியாளனாகிய என்னையும் அனுப்பியபோது, பெரும் பரபரப்பை[a] கண்டேன்; ஆனால் அது என்னவென்று எனக்குத் தெரியவில்லை” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “பெரும் கூட்டத்தை” அல்லது “பெரும் அமளியை”; எபிரெயச் சொல் கூட்டம், இரைச்சல் அல்லது குழப்பமான பரபரப்பு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: நலமாக இருக்கிறானா?
  rationale: இந்த வினாச் சூழலில் அப்சலோமின் நல்வாழ்வு அல்லது பாதுகாப்பைப் பற்றிக் கேட்கிறது; ‘பாதுகாப்பாக’ என்று மட்டும் குறுக்காமல் இயல்பான தமிழில் பொருளைப் பாதுகாக்கிறது.
- source_word: לַנַּעַר לְאַבְשָׁלוֹם
  choice: இளைஞன் அப்சலோம்
  rationale: נַעַר என்பதன் ‘இளைஞன்’ என்ற அடிப்படைப் பொருளையும், தாவீது தன் மகனை மறைமுகமாகக் குறிப்பிடும் மூலத்தின் சொல்லமைப்பையும் காக்கிறது.
- source_word: הֶהָמוֹן הַגָּדוֹל
  choice: பெரும் பரபரப்பு
  rationale: הָמוֹן என்பது கூட்டம், இரைச்சல், அமளி அல்லது குழப்பமான அசைவு ஆகியவற்றைக் குறிக்கலாம்; சூழலில் ‘பரபரப்பு’ இந்தப் பொருள் விரிவை மிகையாகத் தீர்மானிக்காமல் எடுத்துரைக்கிறது.
- source_word: לִשְׁלֹחַ
  choice: அனுப்பியபோது
  rationale: לְ முன்னொட்டுடன் வரும் infinitive construct இங்கு காலத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֶבֶד הַמֶּלֶךְ
  choice: அரசனுடைய பணியாளன்
  rationale: இங்கு அரசருக்குக் கீழ்ப்பட்ட தூதர் அல்லது அலுவலரைக் குறிக்கும் சூழலில் ‘பணியாளன்’ இயல்பானது; அடிமைத்தன்மையைத் தேவையின்றி முன்னிறுத்தாது.
- source_word: וְאֶת עַבְדֶּךָ
  choice: உமது பணியாளன்
  rationale: அகிமாஸ் தன்னைத் தாழ்மையுடன் குறிப்பிடும் அரசவை மரியாதை வழக்கைத் தமிழிலும் காக்கிறது.
- source_word: וְלֹא יָדַעְתִּי מָה
  choice: ஆனால் அது என்னவென்று எனக்குத் தெரியவில்லை
  rationale: எபிரெயில் உள்ள ‘என்ன என்று அறியவில்லை’ என்ற சுருக்கமான வாக்கியத்தை இயல்பான தமிழுக்குத் தேவையான அளவில் மட்டும் நிறைவு செய்கிறது.
