translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதைமிக்க உரைநடை பயன்படுத்தப்பட்டுள்ளது. தாவீதைக் குறிக்கும் வினைகள் தமிழ் மரபுக்கேற்ப மரியாதைப் பன்மையில் அமைந்துள்ளன. இராணுவச் சூழல் தெளிவாக இருந்தாலும், עם என்பதன் ‘மக்கள்’ என்ற மூல வடிவமும் אֲלָפִים/מֵאוֹת என்பவற்றின் எண்ணிக்கை அல்லது படைப்பிரிவு சார்ந்த மெய்யான தெளிவின்மையும் அடிக்குறிப்புகள் மூலம் காக்கப்பட்டுள்ளன.
