base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/001.yaml
  text: Then David mustered the people who were with him and appointed over them commanders of thousands and commanders of hundreds[a][b].
translation:
  language: ta
  text: பின்பு தாவீது தன்னோடு இருந்த மக்களைப் படையணியாகத் திரட்டினார்[a][b]. அவர்கள்மேல் ஆயிரம் பேருக்குத் தலைவர்களையும் நூறு பேருக்குத் தலைவர்களையும் நியமித்தார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “படையணியாகத் திரட்டினார்” என்பதற்கான எபிரெயச் சொல், “எண்ணினார்” அல்லது “பார்வையிட்டார்” என்றும் மொழிபெயர்க்கப்படலாம்; இங்கு வெறும் எண்ணிக்கையிடுதலைவிட இராணுவ அணிவகுப்பும் ஒழுங்குபடுத்துதலும் கருத்தில் உள்ளன.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “மக்கள்”; இங்கு தாவீதோடு இருந்த போர்ப்படையினரை அது குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் சொற்படி, “ஆயிரங்களின் தலைவர்களையும் நூறுகளின் தலைவர்களையும்”; இவை துல்லியமான எண்ணிக்கைகளையோ அந்த அளவிலான படைப்பிரிவுகளையோ குறிக்கலாம்.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: படையணியாகத் திரட்டினார்
  rationale: פקד என்பதற்கு இப்போர்ச் சூழலில் வெறுமனே எண்ணுதல் என்பதைக் காட்டிலும் படைவீரர்களைத் திரட்டி, பார்வையிட்டு, ஒழுங்குபடுத்துதல் என்ற பொருள் உள்ளது. இயல்பான நவீனத் தமிழில் அந்த இராணுவ நிர்வாகப் பொருளை இச்சொற்றொடர் தெளிவாகத் தருகிறது.
- source_word: הָעָם
  choice: மக்களை
  rationale: עם என்பதன் அடிப்படைப் பொருள் ‘மக்கள்’. இங்கு அது தாவீதோடு இருந்த போர்ப்படையைக் குறித்தாலும், மூலமொழியின் பொதுவான சொல்லை உரையில் காத்து, சூழல் பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: אֲשֶׁר אִתּוֹ
  choice: தன்னோடு இருந்த
  rationale: உடனிருந்த உறவை நேரடியாக மொழிபெயர்க்கிறது; ‘அவருடைய கட்டுப்பாட்டில் இருந்த’ என்று முறையான கட்டளை அமைப்பை தேவையின்றி உட்புகுத்தவில்லை.
- source_word: וַיָּשֶׂם עֲלֵיהֶם
  choice: அவர்கள்மேல் ... நியமித்தார்
  rationale: שׂים + עַל அமைப்பு மற்றவர்கள்மேல் அதிகாரிகளை வைப்பதையோ நியமிப்பதையோ குறிக்கிறது. ‘நியமித்தார்’ நவீனத் தமிழில் தெளிவான நிர்வாகச் சொல்லாகும்.
- source_word: שָׂרֵי
  choice: தலைவர்களை
  rationale: שׂר என்பது தலைவர் அல்லது அதிகாரியைக் குறிக்கும். இராணுவச் சூழலை அருகிலுள்ள ‘படையணி’ தெளிவாக்குவதால், இயல்பான ‘தலைவர்கள்’ போதுமானது.
- source_word: אֲלָפִים
  choice: ஆயிரம் பேருக்கு
  rationale: இது ஆயிரம் என்ற எண்ணையோ ஆயிரம் பேர் கொண்ட பிரிவையோ குறிக்கலாம். நூறுகளுடன் வரும் வழக்கமான இராணுவ நிர்வாக இணைப்பில் எண்ணியல் வடிவம் இயல்பானது; பிரிவு சார்ந்த நுணுக்கம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: מֵאוֹת
  choice: நூறு பேருக்கு
  rationale: ‘ஆயிரங்கள்’ என்பதோடு இணையும் இராணுவ நிர்வாகச் சொல்லாக எளிய எண்ணியல் வடிவம் பயன்படுத்தப்பட்டுள்ளது; இது நூறு பேர் கொண்ட பிரிவுகளையும் குறிக்கக்கூடும்.
