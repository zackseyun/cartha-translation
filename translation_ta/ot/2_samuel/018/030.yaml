  yaml_path: translation/ot/2_samuel/018/030.yaml
  text: The king said[a], “Turn aside; stand here.” So he turned aside and stood.
translation:
  language: ta
  text: அரசன், “ஒருபுறமாக விலகி, இங்கே நில்” என்றான்.[a] அவன் ஒருபுறமாக விலகி நின்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திரும்பி, இங்கே நில்.” எபிரெய வினைச்சொல் பொதுவாகத் திரும்புவதைக் குறிக்கலாம்; ஆனால் இச்சூழலில் அடுத்த தூதனுக்கு இடமளிக்க ஒருபுறமாக விலகுவதைப் பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: אמר என்பதன் தொடர்கதை வடிவம் நேரடி உரையை அறிமுகப்படுத்துகிறது; தமிழில் மேற்கோளுக்குப் பின் வரும் “என்றான்” இயல்பான கதைநடை வடிவம்.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: குறிப்பிட்ட, ஏற்கெனவே அறிமுகமான அரசனைக் குறிக்கிறது; தமிழில் “அரசன்” போதுமான தெளிவுடன் குறிப்புத்தன்மையை வெளிப்படுத்துகிறது.
- source_word: סֹב
  choice: ஒரு பக்கமாகத் திரும்பி
  rationale: סבב வேரின் கட்டளை வடிவம் பொதுவாகத் திரும்புதலைக் குறிக்கலாம்; இச்சூழலில் அடுத்த தூதனுக்கு இடமளிக்கப் பக்கமாக விலகுவதைக் குறிக்க வாய்ப்பு அதிகம். “ஒரு பக்கமாகத் திரும்பி” இயக்கத்தையும் மூலத்தின் பொதுவான பொருளையும் காக்கிறது.
- source_word: הִתְיַצֵּב
  choice: நில்
  rationale: יצב வேரின் ஹித்பயேல் கட்டளை வடிவம் ஒருவரை ஒரு நிலையில் நிறுத்திக்கொள்ளும்படி கூறுகிறது; இங்கு “நில்” சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: כֹּה
  choice: இங்கே
  rationale: இந்தக் கட்டளைச் சூழலில் இடத்தைக் குறிக்கும் வினையடை; “இங்கே” இயல்பான தமிழ் இணை.
- source_word: וַיִּסֹּב
  choice: ஒரு பக்கமாகத் திரும்பி
  rationale: முந்தைய கட்டளையின் நிறைவேற்றத்தைச் சொல்கிறது; கட்டளையுடன் சொற்பொருள் தொடர்பைப் பேண அதே சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיַּעֲמֹד
  choice: நின்றான்
  rationale: עמד என்பதன் சாதாரண கதைநடைப் பொருள் “நின்றான்”; கூடுதல் கருத்தைச் சேர்க்காமல் மூலத்தை நேரடியாக வழங்குகிறது.
