base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/007.yaml
  text: 'There the people of Israel were defeated before the servants of David[b][a], and the slaughter there was great on that day: twenty thousand men.'
translation:
  language: ta
  text: 'அங்கே இஸ்ரவேல் மக்கள் தாவீதின் ஊழியர்களின் முன் தோற்கடிக்கப்பட்டார்கள்; அந்த நாளில் அங்கே பெரும் அழிவு[a] ஏற்பட்டது: இருபதாயிரம் பேர்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் வேறு சூழல்களில் “அடி,” “தோல்வி,” அல்லது “கொள்ளைநோய்” என்றும் பொருள்படலாம். இங்கே அது போரில் ஏற்பட்ட கொடிய அழிவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “இருபதாயிரம்” என்று மட்டும் உள்ளது; போர்ச் சூழலைத் தெளிவுபடுத்த “பேர்” சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְפוּ
  choice: தோற்கடிக்கப்பட்டார்கள்
  rationale: נָגַף என்பதன் நிஃபால் வடிவம் இப்போர்ச் சூழலில் எதிரியிடம் தோல்வியடைதலைக் குறிக்கிறது; ஒவ்வொருவரும் கொல்லப்பட்டதாக மிகைப்படுத்தாமல் இராணுவப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: עַם יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருளைப் பேணுகிறது; சூழலில் இது இஸ்ரவேலின் போர்வீரர்களைக் குறித்தாலும், மூலத்தின் விரிந்த சொல்லாட்சியைச் சுருக்கவில்லை.
- source_word: לִפְנֵי עַבְדֵי דָוִד
  choice: தாவீதின் பணியாளர்களுக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் 'முன்பாக' என்ற வடிவத்தையும் עֲבָדִים என்பதன் பணியாளர்/ஊழியர் சார்ந்த பொருளையும் பேணுகிறது; இங்கு அவர்கள் தாவீதின் ஆதரவாளர்களும் படைவீரர்களுமாவர்.
- source_word: הַמַּגֵּפָה
  choice: உயிரிழப்பு
  rationale: מַגֵּפָה வேறு சூழல்களில் கொள்ளைநோயைக் குறிக்கலாம்; இங்கு போரில் ஏற்பட்ட கொடிய தாக்கத்தையும் மரண எண்ணிக்கையையும் குறிக்கிறது. 'உயிரிழப்பு' இயல்பான தமிழில் அந்த விளைவைத் தெளிவாகச் சொல்கிறது.
- source_word: גְדוֹלָה
  choice: பெரும்
  rationale: மூலத்தின் 'பெரியது' என்ற வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்று
  rationale: நவீனத் தமிழில் இயல்பாக உள்ள காலக் குறிப்பாகும்; 'அந்த நாளில்' என்பதற்கு இணையான பொருளைத் தருகிறது.
- source_word: עֶשְׂרִים אָלֶף
  choice: இருபதாயிரம் பேர்
  rationale: எபிரெயத்தில் எண்ணிக்கை மட்டும் உள்ளது. போர்ச் சூழலில் எண்ணப்படுபவர்கள் மனிதர்கள் என்பதைத் தமிழில் தெளிவாக்க 'பேர்' சேர்க்கப்பட்டுள்ளது.
