translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் போர்ச் சூழலும் எண்ணிக்கையும் தெளிவாக வைக்கப்பட்டுள்ளன; מַגֵּפָה என்பதற்கு இச்சூழலில் தவறாக 'கொள்ளைநோய்' எனப் புரிந்துகொள்ளப்படாத இயல்பான சொல் தேர்ந்தெடுக்கப்பட்டது.
