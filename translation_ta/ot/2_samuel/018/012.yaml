base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/012.yaml
  text: But the man said to Joab[a], “Even if I were weighing out a thousand pieces of silver on my palms, I would not put out my hand against the king’s son; for in our hearing the king commanded you and Abishai and Ittai, saying[b], ‘Guard for me the young man Absalom.’”
translation:
  language: ta
  text: அந்த மனிதன் யோவாபிடம், “என் உள்ளங்கைகளில் ஆயிரம் வெள்ளித் துண்டுகளை எடைபோட்டுக் கொடுத்தாலும்[a], அரசனின் மகனுக்கு எதிராக நான் கைநீட்ட மாட்டேன். ஏனெனில், அரசன் உனக்கும் அபிசாய்க்கும் இத்தாய்க்கும் கட்டளையிட்டதை நாங்கள் நேரில் கேட்டோம். அவர், ‘எனக்காக இளைஞனான அப்சலோமைப் பாதுகாத்துக்கொள்ளுங்கள்’ என்று சொன்னார்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “என் உள்ளங்கைகளில் ஆயிரம் வெள்ளியை எடைபோட்டாலும்.” வெள்ளியை எடையிட்டு பெருந்தொகையாகக் கொடுப்பதை இச்சொற்றொடர் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: வசனத்தின் இறுதியில் உள்ள எபிரெய வாசகம் கடினமானது; சொல்லுக்குச் சொல், “மி, இளைஞனான அப்சலோமைப் பாதுகாத்துக்கொள்ளுங்கள்” என்று உள்ளது. 18:5-இல் உள்ள கட்டளையின் அடிப்படையில் பலர் இதை, “எனக்காக இளைஞனான அப்சலோமைப் பாதுகாத்துக்கொள்ளுங்கள்” என்று புரிந்துகொள்கிறார்கள்.
    reason: textual_variant
lexical_decisions:
- source_word: שֹׁקֵל עַל כַּפַּי אֶלֶף כֶּסֶף
  choice: என் உள்ளங்கைகளில் ஆயிரம் வெள்ளித் துண்டுகளை நிறுத்துக் கொடுத்தாலும்
  rationale: வெள்ளி எடையிட்டு ஒருவரின் கைகளில் கூலியாகக் கொடுக்கப்படும் காட்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது. மூலத்தில் அளவின் அலகு வெளிப்படையாக இல்லாததால் ‘சேக்கல்’ என்று சேர்க்காமல், ‘வெள்ளித் துண்டுகள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לֹא אֶשְׁלַח יָדִי אֶל
  choice: எதிராக நான் கைநீட்ட மாட்டேன்
  rationale: ஒருவரைத் தாக்குவதையோ அவருக்கு வன்முறை செய்வதையோ குறிக்கும் எபிரெய மரபுத்தொடரின் கை உருவகத்தைத் தமிழிலும் காக்கிறது.
- source_word: בֶּן הַמֶּלֶךְ
  choice: அரசனின் மகன்
  rationale: அரசனுடனான உறவை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְאָזְנֵינוּ
  choice: நாங்களே கேட்டோம்
  rationale: ‘எங்கள் காதுகளில்’ என்ற எபிரெய மரபுத்தொடரின் பொருளான நேரடியாகக் கேட்ட சாட்சியத்தை இயல்பான தமிழில் தருகிறது; ‘-ஏ’ பேச்சாளரின் வலியுறுத்தலைக் காட்டுகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்டதை
  rationale: அரசனின் அதிகாரப்பூர்வ ஆணையைத் தெளிவாகக் காட்டுகிறது.
- source_word: שִׁמְרוּ
  choice: பாதுகாத்துக்கொள்ளுங்கள்
  rationale: இங்கு அப்சலோமைக் கண்காணிப்பது மட்டுமல்லாமல் தீங்கிலிருந்து காப்பதே சூழலுக்குரிய பொருள்.
- source_word: מִי בַּנַּעַר בְּאַבְשָׁלוֹם
  choice: எனக்காக இளைஞனான அப்சலோமை
  rationale: மசோரா உரையின் கடினமான ‘மீ’ வடிவத்தை அடிக்குறிப்பில் பாதுகாத்து, 18:5-இல் உள்ள இணையான கட்டளைக்கும் சூழலுக்கும் ஏற்ற பொருளை முதன்மை உரையில் வழங்குகிறது.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: குறிப்பிட்ட, ஏற்கெனவே உரையாடலில் இடம்பெற்ற மனிதனை எபிரெய சுட்டுநிலை குறிக்கிறது.
- source_word: וְלֹא אָנֹכִי
  choice: கொடுத்தாலும் … நான் … மாட்டேன்
  rationale: பெருந்தொகை வழங்கப்பட்டாலும்கூட மறுப்பேன் என்ற வலியுறுத்தலை இயல்பான தமிழ் நிபந்தனை-மறுப்பு அமைப்பில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அப்சலோமைப் பற்றிய இறுதிக் கட்டளையில் உள்ள கடினமான மசோரா வாசகம்
  choice: எனக்காக இளைஞனான அப்சலோமைப் பாதுகாத்துக்கொள்ளுங்கள்
  alternative: இளைஞனான அப்சலோமைப் பாதுகாத்துக்கொள்ளுங்கள் / இளைஞனான அப்சலோமுடன் இருப்பவர் யார்?
  rationale: மூல வாசகத்தின் சிக்கலை மறைக்காமல் அடிக்குறிப்பில் பதிவு செய்கிறது; அதேவேளை 18:5-இன் தெளிவான இணை வாசகத்தையும் இச்சூழலில் அரசன் காட்டும் பாதுகாப்புக் கவலையையும் கொண்டு முதன்மை உரையை வாசிக்கத்தக்கதாக அமைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் சாதாரண வாசகர்களுக்கும் எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. உரையாடலில் தேவையற்ற மரியாதைப் பன்மையைச் சேர்க்காமல், யோவாபை நேரடியாகச் சுட்டும் ஒருமை ‘உனக்கும்’ பயன்படுத்தப்பட்டுள்ளது. எபிரெய கை உருவகம் காக்கப்பட்டு, தெளிவற்ற இறுதி வாசகம் அடிக்குறிப்பில் வெளிப்படையாகப் பதிவு செய்யப்பட்டுள்ளது.
