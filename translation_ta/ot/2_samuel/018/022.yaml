base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/022.yaml
  text: Then Ahimaaz son of Zadok said again to Joab[a], “Whatever happens, please let me also run after the Cushite.” But Joab said, “Why would you run, my son[b], since you have no message that will bring reward?”
translation:
  language: ta
  text: சாதோக்கின் மகன் அகிமாஸ் மீண்டும் யோவாபிடம், “என்ன நேர்ந்தாலும்[a], நானும் கூஷியனைத் தொடர்ந்து ஓட அனுமதியுங்கள்” என்றான். அதற்கு யோவாப், “என் மகனே, நீ இப்படி ஓடுவது ஏன்? உனக்குப் பலன் தரும் செய்தி எதுவும் இல்லையே[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்ன ஆனாலும்.”
    reason: lexical_alternative
  - marker: b
    text: இறுதித் தொடரின் எபிரெய வாசகம் பொருள் தெளிவில்லாதது. “உனது செய்தி சாதகமாக ஏற்றுக்கொள்ளப்படாது” அல்லது “இந்தச் செய்திக்காக உனக்கு எந்தப் பலனும் கிடைக்காது” என்றும் இதைப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד
  choice: மீண்டும் ... என்றான்
  rationale: ‘மேலும் சேர்த்தான்’ என்ற எபிரெய மொழிமரபு இங்கு அகிமாஸ் தனது வேண்டுகோளை மறுபடியும் சொன்னதைக் குறிக்கிறது; நவீன தமிழில் ‘மீண்டும் ... என்றான்’ இயல்பாக உள்ளது.
- source_word: וִיהִי מָה
  choice: என்ன நேர்ந்தாலும்
  rationale: விளைவு எதுவாயினும் அதைப் பொருட்படுத்தாமல் செயலில் இறங்கும் உறுதியை இந்த மொழிமரபு தெரிவிக்கிறது.
- source_word: אָרֻצָה נָּא
  choice: ஓடிப்போக அனுமதியுங்கள்
  rationale: விருப்பத்தைத் தெரிவிக்கும் வினைவடிவத்தோடு נָא சேர்ந்திருப்பதால், மரியாதையான ஆனால் வலியுறுத்தப்பட்ட வேண்டுகோளாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: גַם אֲנִי
  choice: நானும்
  rationale: ஏற்கெனவே அனுப்பப்பட்ட கூஷியனுக்கு மேலாகத் தானும் ஓட விரும்புவதைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: הַכּוּשִׁי
  choice: கூஷியன்
  rationale: இனப்பெயரை அதன் வரலாற்று வடிவத்துக்கு நெருக்கமாகக் கொடுக்கிறது; பிற்காலப் புவியியல் பெயரான ‘எத்தியோப்பியன்’ என்பதைத் தவிர்க்கிறது.
- source_word: לָמָּה זֶּה אַתָּה רָץ
  choice: நீ இப்படி ஓடுவது ஏன்?
  rationale: לָמָּה זֶּה என்பதிலுள்ள கேள்வியையும் சுட்டுத்தன்மையையும் இயல்பான தமிழில் காக்கிறது; அகிமாஸ் இன்னும் புறப்படாத சூழலில் இது அவன் முனையும் செயலைக் குறிக்கிறது.
- source_word: בְּנִי
  choice: என் மகனே
  rationale: இது நேரடி தந்தை-மகன் உறவை அவசியமாகக் குறிக்காமல், அன்போ அதிகாரத் தொனியோ கொண்ட அழைப்பாக இருக்கலாம்; தமிழ் வடிவம் அந்த உறவுத் தொனியைக் காக்கிறது.
- source_word: אֵין בְּשׂוֹרָה מֹצֵאת
  choice: உனக்குப் பலன் தரும் செய்தி எதுவும் இல்லையே
  rationale: சிக்கலான, சுருக்கப்பட்ட எபிரெயத் தொடரைச் சூழலுக்கு ஏற்றவாறு மொழிபெயர்க்கிறது; செய்திக்குப் பாராட்டான வரவேற்பு அல்லது தூதனுக்குக் கிடைக்கும் பலன் ஆகிய இரு சாத்தியங்களையும் அடிக்குறிப்பு வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறுதி தொடரின் பொருள்
  choice: உனக்குப் பலன் தரும் செய்தி எதுவும் இல்லையே
  alternative: உனது செய்தி சாதகமாக ஏற்றுக்கொள்ளப்படாது
  rationale: எபிரெய வாசகம் இலக்கண ரீதியாகச் சுருக்கமாகவும் பொருள் தெளிவில்லாமலும் உள்ளது. முதன்மை உரை பலன் என்ற சாத்தியத்தை எடுத்துக்கொள்கிறது; மற்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது. இங்கு எந்தக் கோட்பாட்டுத் தீர்வும் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீன, செம்மையான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. உரையாடலின் மரியாதையும் யோவாபின் உறவுத் தொனியும் காக்கப்பட்டுள்ளன; மூலத்தின் கடினமான இறுதித் தொடர் அடிக்குறிப்பில் திறந்தவாறு வைக்கப்பட்டுள்ளது.
