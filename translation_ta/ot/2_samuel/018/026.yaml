base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/026.yaml
  text: Then the watchman saw another man running[a], and the watchman called to the gatekeeper and said, “Look, a man is running by himself.” And the king said, “He also brings news.”
translation:
  language: ta
  text: அப்போது காவலாளி வேறொருவன் ஓடுவதைக் கண்டான். காவலாளி வாயிற்காவலனை அழைத்து, “இதோ, ஒரு மனிதன் தனியாக ஓடுகிறான்” என்றான். அரசன், “இவனும் செய்தி கொண்டுவருகிறவன்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நற்செய்தி கொண்டுவருகிறவன்” அல்லது “செய்தியாளன்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் ஒரு செய்தியை அறிவிப்பவனைக் குறிக்கிறது; பல சூழல்களில் அது நல்ல செய்தியாகவும் அமைகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: காவலாளி
  rationale: צפה என்ற வேரிலிருந்து வந்த இச்சொல் விழிப்புடன் கண்காணிப்பவனைக் குறிக்கிறது. நகர வாயில் சூழலில் ‘காவலாளி’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אִישׁ אַחֵר
  choice: வேறொருவன்
  rationale: முதலில் வந்த ஓட்டக்காரனிலிருந்து வேறுபட்ட இன்னொரு மனிதனை இச்சொற்றொடர் குறிக்கிறது; ‘வேறொருவன்’ இதைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: רָץ
  choice: ஓடிவருவதைக் / ஓடிவருகிறான்
  rationale: எபிரெயப் பங்கேற்புவினை நடந்துகொண்டிருக்கும் செயலைக் காட்டுகிறது. சூழலில் அந்த மனிதன் நகர வாயிலை நோக்கி வருவதால், தமிழில் ‘ஓடிவருதல்’ இயல்பானது.
- source_word: הַשֹּׁעֵר
  choice: வாயிற்காவலன்
  rationale: நகர வாயிலைக் காக்கும் பொறுப்புடையவரைச் சூழலுக்கேற்றவாறு தெளிவாகக் குறிக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை உடனடியாக ஒரு காட்சியின்மீது திருப்பும் எபிரெயச் சுட்டிடைச்சொல்லின் வலிமையை ‘இதோ’ பாதுகாக்கிறது.
- source_word: לְבַדּוֹ
  choice: தனியாக
  rationale: அவன் ஒரு குழுவுடன் அல்லாமல் ஒருவனாகவே ஓடிவருகிறான் என்ற கவனிப்பை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: גַּם זֶה
  choice: இவனும்
  rationale: இரண்டாவது ஓட்டக்காரனும் முதல் ஆளைப்போலவே செய்தியுடன் வருகிறான் என்ற அரசனின் முடிவை இயல்பான தமிழில் தருகிறது; זֶה என்பதன் சுட்டுப்பொருளும் காக்கப்படுகிறது.
- source_word: מְבַשֵּׂר
  choice: செய்தி கொண்டுவருகிறவன்
  rationale: בשׂר என்ற வேரின் பியேல் பங்கேற்புவினை ஒரு செய்தியை, பல இடங்களில் நற்செய்தியை, அறிவிப்பவனைக் குறிக்கலாம். செய்தி நல்லதா கெட்டதா என்பதை இவ்வசனம் வெளிப்படையாகச் சொல்லாததால் நடுநிலையான மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
