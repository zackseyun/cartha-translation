source:
  edition: WLC
  text: וַ/יִּתְקַ֤ע יוֹאָב֙ בַּ/שֹּׁפָ֔ר וַ/יָּ֣שָׁב הָ/עָ֔ם מִ/רְדֹ֖ף אַחֲרֵ֣י יִשְׂרָאֵ֑ל כִּֽי חָשַׂ֥ךְ יוֹאָ֖ב אֶת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/016.yaml
  text: Then Joab blew the trumpet[a], and the people turned back from pursuing Israel[c][b], because Joab restrained the people.
translation:
  language: ta
  text: அப்போது யோவாப் எக்காளத்தை ஊதினான்[a]. மக்கள் இஸ்ரவேலைப் பின்தொடர்வதை விட்டுத் திரும்பினார்கள்[b]; ஏனெனில் யோவாப் மக்களைத் தடுத்து நிறுத்தினான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொம்பை.” எபிரேயச் சொல் ஷோஃபார்; இது அறிவிப்புச் சைகைக்காகப் பயன்படுத்தப்பட்ட, பெரும்பாலும் ஆட்டுக்கடாவின் கொம்பால் செய்யப்பட்ட கருவி.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அப்சலோமின் தரப்பில் இருந்த இஸ்ரவேலின் படையினரை.
    reason: cultural_note
  - marker: c
    text: அல்லது, “மக்களைத் தடுத்து வைத்தான்”; “மக்களை விட்டுவைத்தான்.” எபிரேய வினை தடுத்து வைத்தல் அல்லது விட்டுவைத்தல் என்ற பொருள்களைத் தரலாம்; இங்கு யோவாப் தன் ஆட்கள் தொடர்ந்து பின்தொடர்வதை நிறுத்தினான் என்பதே பெரும்பாலும் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע
  choice: ஊதினான்
  rationale: שׁוֹפָרுடன் வரும் תקע, கொம்பை அல்லது எக்காளத்தை ஊதுவதைக் குறிக்கிறது; தமிழில் இயல்பான நேரடி வினைச்சொல் இது.
- source_word: בַּשֹּׁפָר
  choice: எக்காளத்தை
  rationale: שׁוֹפָר என்பது செய்தி அறிவிக்கப் பயன்படுத்தப்பட்ட கொம்பு வகைக் கருவி. போர்ச் சூழலில் ‘எக்காளம்’ இயல்பான தமிழ் இணை; அதன் பொருட்சார் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיָּשָׁב הָעָם
  choice: மக்கள் ... திரும்பினார்கள்
  rationale: שׁוּב என்பதன் ‘திரும்புதல்’ என்ற பொருளையும் הָעָם என்பதன் பொதுவான சொல்லாட்சியையும் காக்கிறது; சூழலில் இவர்கள் யோவாபின் படைவீரர்கள்.
- source_word: מִרְדֹף אַחֲרֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலைப் பின்தொடர்வதை விட்டு
  rationale: מִן + infinitive construct தொடரும் செயலை நிறுத்துவதைக் குறிக்கிறது. אַחֲרֵי இங்கு பின்தொடரப்படும் தரப்பைக் குறிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: மக்கள் ஏன் திரும்பினார்கள் என்பதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: חָשַׂךְ אֶת הָעָם
  choice: மக்களைத் தடுத்து நிறுத்தினான்
  rationale: חָשַׂךְ என்பதற்கு தடுத்து வைத்தல், விலக்குதல், விட்டுவைத்தல் போன்ற பொருள்கள் உண்டு. இங்கு யோவாப் தொடர்ந்து துரத்துவதை நிறுத்திய இராணுவச் சூழலை இச்சொற்றொடர் தெளிவாக வெளிப்படுத்துகிறது; இரக்கம் என்ற நோக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: חָשַׂךְ என்ற வினையின் நோக்கம்
  choice: யோவாப் தன் மக்களைத் தொடர்ந்து துரத்தாதபடி தடுத்து நிறுத்தினான்
  alternative: யோவாப் மக்களை விட்டுவைத்தான் / காப்பாற்றினான்
  rationale: எபிரேய வினை ‘விட்டுவைத்தல்’ என்ற நிழற்பொருளையும் ஏற்கலாம். ஆனால் உடனடி சூழல் படையை நிறுத்துவதையே முதன்மையாகக் காட்டுகிறது; இரக்கமோ எதிரிகளை உயிரோடு விட்டதோ என்று உரை வெளிப்படையாகக் கூறவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மக்கள்’ என்பது எபிரேய הָעָם என்பதைக் காக்கிறது; இராணுவச் சூழல் அடிக்குறிப்பால் தெளிவாக்கப்பட்டுள்ளது. ‘எக்காளம்’ வழக்கமான போர்ச் சைகைக் கருவி என்ற பொருளில் தேர்ந்தெடுக்கப்பட்டது.
