base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/023.yaml
  text: But he said[a], “Whatever happens, let me run.” So he said to him[c][b], “Run.” Then Ahimaaz ran by the way of the plain and passed the Cushite.
translation:
  language: ta
  text: ஆனால் அவன், “எது நடந்தாலும் சரி, நான் ஓடட்டும்” என்றான்.[a] அவன் அவனிடம், “ஓடு” என்றான். அப்போது அகிமாஸ் சமவெளியின் வழியாக ஓடி, கூஷியனை முந்திச் சென்றான்.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்ன ஆனாலும் நான் ஓடுவேன்.” இந்த எபிரெய மரபுத்தொடர், விளைவு எதுவாயினும் ஓட வேண்டும் என்ற அகிமாசின் வலியுறுத்தலைத் தெரிவிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: “சமவெளி” என்பது யோர்தான் சமவெளியைக் குறிக்கலாம்; ஆனால் எபிரெய மூலவுரை அந்த முழுமையான புவியியல் குறிப்பை வெளிப்படையாகக் கூறவில்லை.
    reason: cultural_note
  - marker: c
    text: அல்லது, “கூஷியனைக் கடந்து சென்றான்.” இச்சூழலில் அவன் கூஷியனை ஓட்டத்தில் முந்தினான் என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי מָה אָרוּץ
  choice: எது நடந்தாலும் சரி, நான் ஓடிப்போகட்டும்
  rationale: இந்த எபிரெயச் சொற்றொடர் சொற்சொல்லான கேள்வியாக இல்லாமல், முடிவு எதுவாயினும் ஓட அனுமதிக்குமாறு அகிமாஸ் வலியுறுத்துவதைக் காட்டுகிறது. தமிழ் வேண்டுகோள் வடிவம் உரையாடலின் சூழலையும் அவசரத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רוּץ
  choice: ஓடு
  rationale: רוץ என்பதன் நேரடியான கட்டளை வடிவம்; சுருக்கமான தமிழ் கட்டளை மூலத்தின் வலிமையைப் பேணுகிறது.
- source_word: דֶּרֶךְ הַכִּכָּר
  choice: சமவெளிப் பாதை வழியாக
  rationale: דֶּרֶךְ என்பது பாதை அல்லது வழி; הַכִּכָּר இங்கு சமவெளியைக் குறிக்கிறது. யோர்தான் சமவெளியாக இருக்கக்கூடும் என்றாலும், மூலத்தில் இல்லாத புவியியல் குறிப்பை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: וַיַּעֲבֹר אֶת־הַכּוּשִׁי
  choice: கூஷியனை முந்திச் சென்றான்
  rationale: עבר நேரடி செயப்படுபொருளுடன் இச்சூழலில் ஒருவரைக் கடந்து அல்லது முந்திச் செல்வதைக் குறிக்கிறது. ஓட்டப்பந்தயத்துக்கு ஒத்த இந்நிகழ்வில் ‘முந்திச் சென்றான்’ என்பது இயல்பானதும் சூழலுக்கு ஏற்றதுமான தமிழ்.
- source_word: הַכּוּשִׁי
  choice: கூஷியன்
  rationale: கூஷ் நாட்டைச் சேர்ந்தவரைக் குறிக்கும் இன-புவியியல் அடையாளத்தை நேரடியாகப் பேணுகிறது; பாரம்பரியமான ஆனால் விரிவுபடுத்தப்பட்ட ‘எத்தியோப்பியன்’ என்பதைக் தவிர்க்கிறது.
- source_word: אֲחִימַעַץ
  choice: அகிமாஸ்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியை நவீனத் தமிழ் எழுத்துமுறைக்கு ஏற்றவாறு எழுத்துப்பெயர்த்துள்ளது.
