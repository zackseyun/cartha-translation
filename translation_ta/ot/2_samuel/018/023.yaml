translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified narrative நடை பயன்படுத்தப்பட்டுள்ளது. முதல் வாக்கியத்தின் இடியம்சார்ந்த வலியுறுத்தல் வேண்டுகோளாகத் தக்கவைக்கப்பட்டுள்ளது. எபிரெயத்தில் உள்ள ‘அவன் அவனிடம்’ என்ற சுட்டுப்பெயர் அமைப்பை, சூழலிலிருந்து பெயர்களைச் சேர்த்து தெளிவுபடுத்தாமல் பாதுகாத்துள்ளோம்; இது தமிழில் சிறிது முறையானதாக இருந்தாலும் மூலத்தின் குறிப்பிடாமையைப் பேணுகிறது.
