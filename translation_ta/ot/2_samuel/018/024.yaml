base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/024.yaml
  text: David was sitting between the two gates[a], and the watchman went up to the roof of the gate by the wall. He lifted up his eyes and looked, and behold, a man was running alone.
translation:
  language: ta
  text: தாவீது இரண்டு வாசல்களுக்கு நடுவே உட்கார்ந்திருந்தார்.[a] காவலன் மதிலை ஒட்டிய வாசலின் கூரைக்குச் சென்றான். அவன் தன் கண்களை ஏறெடுத்துப் பார்த்தான்; இதோ, ஒரு மனிதன் தனியாக ஓடிக்கொண்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரண்டு வாசல் அமைப்புகளுக்கு நடுவே.” எபிரெயத்தில் சொல்லுக்கு சொல் “இரண்டு வாசல்களுக்கு நடுவே” என்று உள்ளது; மதிலரண் செய்யப்பட்ட நுழைவாயிலின் வெளிவாசலுக்கும் உள்வாசலுக்கும் இடையிலான பகுதியை இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: உட்கார்ந்திருந்தார்
  rationale: எபிரெயப் பங்கேற்புவினை அந்த நேரத்தில் தொடர்ந்துகொண்டிருந்த தாவீதின் நிலையைச் சுட்டுவதால், தமிழ் இறந்தகாலத் தொடர்நிலை இயல்பாகப் பொருந்துகிறது.
- source_word: בֵּין שְׁנֵי הַשְּׁעָרִים
  choice: இரண்டு வாசல்களுக்கு நடுவே
  rationale: மூலத்தின் நேரடியான பொருளைத் தக்கவைக்கிறது; அவை உட்புற, வெளிப்புற வாசல்கள் என்று உரை வெளிப்படையாகக் கூறவில்லை.
- source_word: הַצֹּפֶה
  choice: காவலன்
  rationale: மதில் மற்றும் நகரவாசல் சூழலில் கண்காணிக்கும் நபரைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: אֶל גַּג הַשַּׁעַר אֶל הַחוֹמָה
  choice: மதிலையொட்டிய வாசலின் கூரைக்கு
  rationale: வாசல் அமைப்பின் கூரை மற்றும் மதிலுடனான அதன் இடத்தொடர்பை, தேவையற்ற கட்டடவியல் விவரம் சேர்க்காமல் தெரிவிக்கிறது.
- source_word: וַיִּשָּׂא אֶת עֵינָיו
  choice: தன் கண்களை ஏறெடுத்துப் பார்த்தபோது
  rationale: எபிரெய மொழிமரபின் காட்சித்தன்மையைத் தக்கவைத்தபடி தமிழில் புரியக்கூடிய வடிவம்.
- source_word: וַיַּרְא וְהִנֵּה
  choice: பார்த்தபோது, இதோ
  rationale: காணும் செயலும் திடீரெனக் கண்ணில் படும் காட்சியும் இரண்டையும் வெளிப்படுத்துகிறது; הִנֵּה என்பதன் சுட்டிக்காட்டும் வலிமையை ‘இதோ’ காக்கிறது.
- source_word: אִישׁ
  choice: ஒரு மனிதன்
  rationale: மூலத்தில் ஒருமை ஆண்பால் நபர் குறிப்பிடப்படுவதால் பொதுவான ‘ஒருவர்’ என்பதற்குப் பதிலாக பாலினத் துல்லியம் காக்கப்படுகிறது.
- source_word: רָץ
  choice: ஓடிவந்துகொண்டிருந்தான்
  rationale: காவலன் பார்க்கும் வேளையில் அந்த மனிதன் ஓடும் செயலில் இருந்ததைத் தொடர்நிலை வடிவம் காட்டுகிறது; சூழலுக்கேற்ப அவர் நகரத்தை நோக்கி வருவதையும் தமிழ் இயல்பாக உணர்த்துகிறது.
- source_word: לְבַדּוֹ
  choice: தனியாக
  rationale: அந்த ஓட்டக்காரன் வேறு யாருடனும் இல்லாமல் ஒருவனாக வந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
