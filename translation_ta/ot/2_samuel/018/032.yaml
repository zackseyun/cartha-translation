  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசனிடம் பேசும் மரியாதையை வெளிப்படுத்த ‘உமக்கு’ பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் மறைமுகமான பதிலும் ‘நலமா’ என்பதிலுள்ள பரந்த பொருளும் தீர்மானித்து விளக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
