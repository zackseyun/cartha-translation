base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/032.yaml
  text: Then the king said to the Cushite[a], “Is it well with the young man Absalom?” And the Cushite said, “May the enemies of my lord the king, and all who rise up against you for evil[b], be like that young man.”
translation:
  language: ta
  text: அப்போது அரசன் கூஷியனிடம், “இளைஞன் அப்சலோம் நலமாக இருக்கிறானா?[a]” என்று கேட்டான். அதற்குக் கூஷியன், “என் ஆண்டவராகிய அரசனின் பகைவர்களும், உமக்கு எதிராகத் தீங்கு செய்ய எழும்புகிற அனைவரும் அந்த இளைஞனைப் போல ஆகட்டும்” என்றான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இளைஞன் அப்சலோம் பாதுகாப்பாக இருக்கிறானா?” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் இங்கு பயன்படுத்தப்பட்டுள்ள ஷாலோம் என்ற சொல், உயிர் பிழைத்திருப்பதை மட்டும் அல்லாமல் பொதுவான நலத்தையும் நல்வாழ்வையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: கூஷியன் நேரடியாகப் பதிலளிக்கவில்லை. அப்சலோம் இறந்துவிட்டான் என்று வெளிப்படையாகச் சொல்லாமல், அரசனின் பகைவர்களுக்கு உரிய முடிவு அவனுக்கு ஏற்பட்டது என்பதை அவனுடைய வார்த்தைகள் மறைமுகமாக உணர்த்துகின்றன.
    reason: cultural_note
lexical_decisions:
- source_word: הַכּוּשִׁי
  choice: கூஷியன்
  rationale: கூஷ் பகுதியைச் சேர்ந்த ஒருவரைக் குறிக்கும் இன-புவியியல் அடையாளத்தைப் பாதுகாக்கிறது; பிற்காலத்தின் குறுகிய இனப்பெயரைத் திணிப்பதைத் தவிர்க்கிறது.
- source_word: הֲשָׁלוֹם
  choice: நலமா?
  rationale: שָׁלוֹם இங்கு உயிர் பிழைத்திருப்பதை மட்டும் அல்லாமல், பாதுகாப்பு, நலம், நல்வாழ்வு ஆகியவற்றை உள்ளடக்கிய பொதுவான நலநிலையை விசாரிக்கிறது.
- source_word: לַנַּעַר
  choice: இளைஞனான
  rationale: נַעַר என்பதற்கு சிறுவன், இளைஞன் போன்ற பொருள்கள் உண்டு. அப்சலோம் வயதுவந்த மகனாக இருப்பதால், குழந்தைத்தன்மையை உணர்த்தாத ‘இளைஞன்’ பொருத்தமானது.
- source_word: לְאַבְשָׁלוֹם
  choice: அப்சலோம்
  rationale: தனிப்பெயர் வழக்கமான தமிழ் ஒலிபெயர்ப்பு மரபின்படி தரப்பட்டுள்ளது.
- source_word: יִהְיוּ
  choice: ஆகட்டும்
  rationale: இங்குள்ள விருப்பவினை வடிவம் ஒரு வேண்டுதலையும் சாபவுரையையும் வெளிப்படுத்துகிறது; ‘ஆகட்டும்’ அந்த வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: כַנַּעַר
  choice: அந்த இளைஞனைப் போல
  rationale: כ என்ற ஒப்பீட்டு உருபைத் தெளிவாகக் காட்டுவதோடு, இப்போதுதான் குறிப்பிடப்பட்ட அப்சலோமை மறைமுகமாகச் சுட்டுகிறது; அவன் இறந்த செய்தியை நேரடியாகச் சொல்லாத தூதனின் முறையையும் பாதுகாக்கிறது.
- source_word: אֹיְבֵי אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசனின் பகைவர்கள்
  rationale: அரசவைக்குரிய மரியாதையான அழைப்பையும் எபிரெயச் சொற்றொடரின் உடைமை உறவையும் பாதுகாக்கிறது.
- source_word: קָמוּ עָלֶיךָ
  choice: உமக்கு எதிராக எழும்புகிற
  rationale: קום על என்பது பகைமையுடன் எதிர்ப்பதையோ கலகம் செய்வதையோ குறிக்கும் மரபுத்தொடர்; தமிழிலும் ‘எதிராக எழும்புதல்’ அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: לְרָעָה
  choice: உமக்குத் தீங்கு செய்ய
  rationale: தீய அல்லது கேடான நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் எதிர்ப்பை விட தீங்கிழைக்கும் நோக்கம் இருப்பதையும் காட்டுகிறது.
- source_word: וַיֹּאמֶר
  choice: என்று கேட்டான் / என்றான்
  rationale: முதல் உரை கேள்வியாக இருப்பதால் ‘கேட்டான்’ என்றும், பதில் உரை ‘என்றான்’ என்றும் தமிழின் இயல்பான கதைநடைக்கு ஏற்ப வழங்கப்பட்டுள்ளது.
