source:
  edition: WLC
  text: וְ/הִנֵּ֥ה הַ/כּוּשִׁ֖י בָּ֑א וַ/יֹּ֣אמֶר הַ/כּוּשִׁ֗י יִתְבַּשֵּׂר֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כִּֽי שְׁפָטְ/ךָ֤ יְהוָה֙ הַ/יּ֔וֹם מִ/יַּ֖ד כָּל הַ/קָּמִ֥ים עָלֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/031.yaml
  text: And behold[a], the Cushite came, and the Cushite said, “Let my lord the king receive the good news[b], for Yahweh has vindicated you today from the hand of all who rose up against you.”
translation:
  language: ta
  text: இதோ, கூஷியன்[a] வந்தான். கூஷியன், “என் ஆண்டவராகிய அரசரே, நல்ல செய்தியைக் கேட்பீராக! ஏனெனில், உமக்கு எதிராக எழுந்த அனைவரின் கையிலிருந்தும் யாவே இன்று உமக்காக நியாயம் விசாரித்திருக்கிறார்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எத்தியோப்பியன்.” எபிரெயத்தில், “கூஷியன்,” அதாவது கூஷ் நாட்டைச் சேர்ந்தவர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாவே இன்று உமக்கு நீதி வழங்கியிருக்கிறார்” அல்லது “உம்மை நியாயப்படுத்தியிருக்கிறார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: புதிய தூதன் வந்து சேர்வதை உடனடித்தன்மையுடனும் காட்சித் தெளிவுடனும் அறிமுகப்படுத்தும் எபிரெய உரைநடைக் குறிப்பை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: הַכּוּשִׁי
  choice: கூஷியன்
  rationale: இது தனிப்பெயர் அல்ல; கூஷ் நாட்டைச் சேர்ந்த ஒருவரைக் குறிக்கும் இன/நாட்டு அடையாளச் சொல். ‘எத்தியோப்பியன்’ என்பது சாத்தியமான மாற்று என்றாலும், ‘கூஷியன்’ மூலத்திற்கு நெருக்கமானது.
- source_word: יִתְבַּשֵּׂר
  choice: நற்செய்தியைப் பெறுவாராக
  rationale: இங்கு வரும் ஹித்பயேல் வினை வாழ்த்துதல் அல்லது வேண்டுதல் நயமுள்ள கட்டளைப் பொருளைக் கொண்டது. தூதன் அரசருக்கு நல்ல செய்தியை அறிவிக்கும் சூழலை மரியாதையான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசர்
  rationale: அரசவைக்குரிய மரியாதைமிக்க அழைப்புமுறையைப் பாதுகாக்கிறது; இங்கு ‘ஆண்டவர்’ என்பது தெய்வத்தைக் குறிக்காமல் அரசருக்குரிய மரியாதைப் பட்டமாக வருகிறது.
- source_word: שְׁפָטְךָ
  choice: உமக்கு நீதி வழங்கியிருக்கிறார்
  rationale: שׁפט என்பதன் நீதித்தீர்ப்பு மற்றும் ஒருவருக்காக நீதி செய்தல் ஆகிய நயங்களை வெளிப்படுத்துகிறது. ‘உம்மை நியாயப்படுத்தினார்’ அல்லது ‘உமக்காகத் தீர்ப்பளித்தார்’ என்பதும் சாத்தியம் என்பதால் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה-ஐ ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: מִיַּד
  choice: கையிலிருந்தும்
  rationale: பகைவர்களின் அதிகாரம் அல்லது பிடியிலிருந்து விடுவித்தல் என்ற எபிரெய உருவகத்தை தமிழிலும் புரியத்தக்க வகையில் தக்கவைக்கிறது.
- source_word: כָּל הַקָּמִים עָלֶיךָ
  choice: உமக்கு எதிராக எழுந்த அனைவரின்
  rationale: קום ... על என்பதிலுள்ள பகைமையுடன் எழுதல் என்ற வினை உருவகத்தைப் பாதுகாக்கிறது; ‘கலகம் செய்தவர்கள்’ என்று சூழலை மிகையாகக் குறிப்பாக்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரையே பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: שְׁפָטְךָ என்பதிலுள்ள நீதித்தீர்ப்பு மற்றும் விடுவிப்பு நயம்
  choice: உமக்கு நீதி வழங்கியிருக்கிறார்
  alternative: உம்மை நியாயப்படுத்தியிருக்கிறார் / உமக்காகத் தீர்ப்பளித்திருக்கிறார்
  rationale: தாவீதின் சார்பாக யாவே நீதித் தீர்ப்புச் செய்து எதிரிகளிடமிருந்து அவரை விடுவித்தார் என்ற பொருளைத் தெரிவிக்கிறது; ஆனால் நீதித்தீர்ப்பு, நியாயப்படுத்தல் ஆகிய நயங்களையும் அடிக்குறிப்பு மூலம் திறந்தே வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. அரசரிடம் பேசும் மரியாதையை ‘உமக்கு/உம்மை’ மற்றும் ‘பெறுவாராக’ ஆகிய வடிவங்கள் காக்கின்றன. கதைநடையில் ‘இதோ’ என்ற சொல் மூலத்தின் உடனடித்தன்மையைத் தக்கவைக்கிறது.
