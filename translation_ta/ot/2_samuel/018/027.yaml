translation_notes:
  register: நவீனத் தரமான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் ‘ஓட்டம்’ என்ற பெயர்ச்சொல் மறுபடியும் வருவது பாதுகாக்கப்பட்டுள்ளது; இறுதி வினையின் நிகழ்கால/எதிர்காலத் தெளிவின்மை அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
