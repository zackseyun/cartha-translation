- from: அப்போது காவலன், “முதலில் வருகிறவனின் ஓட்டம் சாதோக்கின் மகன் அகிமாஸின் ஓட்டத்தைப் போல இருப்பதை நான் காண்கிறேன்” என்றான். அதற்கு அரசன், “அவன் நல்லவன்; நல்ல செய்தியுடன்தான் வருகிறான்[a]” என்றான்.
  to: அப்போது காவலன், “முதலாமவனின் ஓட்டம் சாதோக்கின் மகன் அகிமாஸின் ஓட்டத்தைப் போல இருப்பதை நான் காண்கிறேன்” என்றான். அதற்கு அரசன், “அவன் நல்லவன்; நல்ல செய்தியுடன் வருகிறான்[a]” என்றான்.
