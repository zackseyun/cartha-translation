base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/027.yaml
  text: Then the watchman said[a], “I see the running of the first one is like the running of Ahimaaz the son of Zadok.” And the king said, “He is a good man[b], and he comes with good news.”
translation:
  language: ta
  text: அப்போது காவலன், “முதலாமவனின் ஓட்டம் சாதோக்கின் மகன் அகிமாஸின் ஓட்டத்தைப் போல இருப்பதை நான் காண்கிறேன்” என்றான். அதற்கு அரசன், “அவன் நல்லவன்; நல்ல செய்தியுடன் வருகிறான்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் நல்ல செய்தியுடன் வருவான்.” எபிரெய வினையை எதிர்காலமாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: காவலன்
  rationale: கண்காணித்துக் கொண்டிருப்பவரைக் குறிக்கும் பங்கேற்புப் பெயர்ச்சொல்; கதைச்சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מְרוּצַת הָרִאשׁוֹן
  choice: முதலில் வருகிறவனின் ஓட்டம்
  rationale: எபிரெயத்தில் உள்ள ‘முதலாமவனின் ஓட்டம்’ என்ற வடிவை, தமிழில் இயல்பாகவும் ஓட்டத்தின் தன்மையை மையப்படுத்தியும் வழங்குகிறது.
- source_word: כִּמְרֻצַת
  choice: ஓட்டத்தைப் போல
  rationale: כ என்ற ஒப்புமைக் கூறையும், மூலத்தில் மீண்டும் வரும் ‘ஓட்டம்’ என்ற பெயர்ச்சொல்லையும் பாதுகாக்கிறது.
- source_word: אֲחִימַעַץ בֶּן צָדוֹק
  choice: சாதோக்கின் மகன் அகிமாஸ்
  rationale: தமிழ் வேதாகமப் பெயர்மரபுக்கு ஏற்ற ஒலிபெயர்ப்புடன், בן உறவை வெளிப்படையாகக் காட்டுகிறது.
- source_word: אִישׁ טוֹב זֶה
  choice: அவன் நல்லவன்
  rationale: ‘இவன் ஒரு நல்ல மனிதன்’ என்ற சொற்பொருளை இயல்பான நவீனத் தமிழில், அரசனின் சாதகமான மதிப்பீடாக வழங்குகிறது.
- source_word: וְאֶל בְּשׂוֹרָה טוֹבָה יָבוֹא
  choice: நல்ல செய்தியுடன்தான் வருகிறான்
  rationale: בְּשׂוֹרָה טוֹבָה என்பதை ‘நல்ல செய்தி’ என்றும், அணுகிவரும் தூதனைப் பற்றிய உடனடி ஊகமாக வினையை நிகழ்காலத்திலும் வழங்குகிறது; ‘தான்’ அரசனின் உறுதியான முடிவை இயல்பாக வெளிப்படுத்துகிறது.
