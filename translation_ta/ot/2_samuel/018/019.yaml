base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/019.yaml
  text: Then Ahimaaz the son of Zadok said[a], “Please let me run and bring news to the king[b], for Yahweh has delivered him from the hand of his enemies.”
translation:
  language: ta
  text: அப்போது சாதோக்கின் மகன் அகிமாஸ், “தயவுசெய்து, நான் ஓடிச் சென்று அரசருக்குச் செய்தியைத் தெரிவிக்க அனுமதியுங்கள்[a]; ஏனெனில் யாவே அரசருடைய பகைவர்களின் கையிலிருந்து அரசருக்கு நீதி வழங்கியிருக்கிறார்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசருக்கு நல்ல செய்தியை அறிவிக்க”; இங்கு வரும் எபிரெய வினை சாதகமான அல்லது மகிழ்ச்சியான செய்தியை அறிவிப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாவே அரசருடைய பகைவர்களின் கையிலிருந்து அவரை விடுவித்திருக்கிறார்.” எபிரெயச் சொற்றொடர் அரசருக்குச் சாதகமாகத் தீர்ப்பளித்தல் அல்லது அவருக்கு நீதி கிடைக்கச் செய்தல் என்ற பொருளையும் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲחִימַעַץ בֶּן צָדוֹק
  choice: அப்போது சாதோக்கின் மகன் அகிமாஸ்
  rationale: வாவ் தொடரும் கதைநிகழ்வை இயல்பான தமிழில் ‘அப்போது’ எனக் காட்டுகிறது; பெயர்களும் தந்தை–மகன் உறவும் நேரடியாகப் பாதுகாக்கப்படுகின்றன.
- source_word: אָמַר
  choice: என்றான்
  rationale: நேரடி உரையின் முடிவில் வரும் இயல்பான தமிழ் உரையறிமுக வடிவம்.
- source_word: אָרוּצָה נָּא
  choice: தயவுசெய்து நான் ஓடிப்போய் … அனுமதியுங்கள்
  rationale: கோஹோர்டேட்டிவ் வடிவத்தின் விருப்பம்/வேண்டுகோள் வலிமையையும் נָא என்பதன் பணிவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַ/אֲבַשְּׂרָה
  choice: செய்தியை அறிவிக்க
  rationale: பியேல் வினை செய்தி கொண்டுவருதல் அல்லது அறிவித்தலைக் குறிக்கிறது; சூழலில் அது நல்ல செய்தியாக இருந்தாலும், முதன்மை உரை அந்த நுணுக்கத்தை மிகையாக நிர்ணயிக்காமல் வைக்கிறது.
- source_word: אֶת הַ/מֶּלֶךְ
  choice: அரசருக்கு
  rationale: ‘செய்தியை அறிவி’ என்ற தமிழ் வினைத்தொடருக்கு ஏற்ப பெறுபவர் நான்காம் வேற்றுமையில் இயல்பாகத் தரப்படுகிறார்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அகிமாஸ் செய்தி அறிவிக்க விரும்புவதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: שְׁפָטוֹ
  choice: அவருக்கு நீதி வழங்கியிருக்கிறார்
  rationale: שׁפט என்பதிலுள்ள நீதித்தீர்ப்பு மற்றும் அரசருக்குச் சாதகமான நியாயநிறைவேற்றம் ஆகியவற்றைப் பாதுகாக்கிறது; அதை வெறும் மீட்பாக மட்டும் சுருக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தனிப்பெயரான יהוה-ஐ ஒரு பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מִיַּד אֹיְבָיו
  choice: அவருடைய பகைவர்களின் கையிலிருந்து
  rationale: ‘கை’ என்பது அதிகாரம் அல்லது பிடியைக் குறிக்கும் எபிரெய உருவகத்தைத் தக்கவைக்கிறது; தமிழிலும் இது புரிந்துகொள்ளத்தக்கது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, இறைவனின் தனிப்பெயரே இருப்பதால் அதை ஒலிபெயர்த்து வழங்குகிறது.
- issue: שְׁפָטוֹ என்பதிலுள்ள நீதித்தீர்ப்பும் விடுதலையும்
  choice: அவருக்கு நீதி வழங்கியிருக்கிறார்
  alternative: அவரை விடுவித்திருக்கிறார்
  rationale: பகைவர்களின் அதிகாரத்திலிருந்து விடுதலை என்பது சூழ்நிலையால் உணரப்பட்டாலும், வினையின் நீதித்தீர்ப்பு சார்ந்த அடிப்படை வலிமையை முதன்மை உரையில் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் கதைநடை இயல்பும் பேணப்பட்டுள்ளன. ‘பகைவர்களின் கையிலிருந்து’ என்ற மூல உருவகம் தெளிவாக இருப்பதால் தக்கவைக்கப்பட்டது. நீதித்தீர்ப்பு–விடுதலை என்ற இரு நுணுக்கங்களும் முதன்மை உரை மற்றும் அடிக்குறிப்பு வழியாகத் திறந்த நிலையில் வைக்கப்பட்டுள்ளன.
