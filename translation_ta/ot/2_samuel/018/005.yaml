base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/005.yaml
  text: And the king commanded Joab and Abishai and Ittai[a], saying, “Deal gently for my sake with the young man Absalom.” And all the people heard when the king commanded all the commanders concerning Absalom.
translation:
  language: ta
  text: அரசன் யோவாபுக்கும் அபிசாயிக்கும் இத்தாயிக்கும் கட்டளையிட்டு, “என் பொருட்டு அந்த இளைஞனான அப்சலோமை மென்மையாக நடத்துங்கள்” என்றான். அரசன் அப்சலோமைக் குறித்து எல்லாப் படைத்தலைவர்களுக்கும் கட்டளையிட்டதை மக்கள் அனைவரும் கேட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டு
  rationale: צוה என்பதன் அதிகாரப்பூர்வமான கட்டளையிடும் வலிமையை இயல்பான தமிழ் கதைநடையில் தெரிவிக்கிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: எபிரெய உரையில் தாவீதின் பெயருக்குப் பதிலாகப் பட்டமே பயன்படுத்தப்பட்டிருப்பதைப் பேணுகிறது.
- source_word: לְאַט
  choice: மென்மையாக நடத்துங்கள்
  rationale: אט இங்கு வேகத்தைக் குறைப்பதைவிட இரக்கத்துடனும் கட்டுப்பாட்டுடனும் நடத்துவதைக் குறிக்கிறது; போர் சூழலில் இயல்பாகப் பொருந்தும் தமிழ் சொற்றொடர் இது.
- source_word: לִי
  choice: என் பொருட்டு
  rationale: தாவீதின் தனிப்பட்ட வேண்டுகோளையும் அக்கறையையும் வெளிப்படுத்துகிறது; வெறும் ‘எனக்கு’ என்பதைவிட சூழலில் தெளிவானது.
- source_word: לַנַּעַר
  choice: அந்த இளைஞனான
  rationale: נַעַר என்பதன் வயது சார்ந்த நெகிழ்வையும், வயதுவந்த அப்சலோமைத் தந்தை பாசத்துடன் குறிப்பிடும் தொனியையும் பேணுகிறது.
- source_word: לְאַבְשָׁלוֹם
  choice: அப்சலோமை
  rationale: ‘இளைஞன்’ யார் என்பதை அடையாளப்படுத்தும் சுருக்கமான இணைப்பாக எடுத்துக்கொண்டு இயல்பான தமிழ் வாக்கியத்தில் நேரடி செயப்படுபொருளாக வழங்கப்பட்டுள்ளது.
- source_word: וְכָל הָעָם שָׁמְעוּ
  choice: மக்கள் அனைவரும் கேட்டார்கள்
  rationale: உடனடிச் சூழல் இராணுவமானாலும் הָעָם என்பதன் பொதுவான ‘மக்கள்’ பொருளையும் கட்டளை வெளிப்படையாகக் கேட்கப்பட்டதையும் காக்கிறது.
- source_word: בְּצַוֹּת
  choice: கட்டளையிட்டதை
  rationale: ב உடனான infinitive construct குறிக்கும் ஒரே நேர நிகழ்வைத் தமிழில் இயல்பான உட்பொருள் வாக்கியமாக வழங்குகிறது.
- source_word: כָּל הַשָּׂרִים
  choice: எல்லாப் படைத்தலைவர்களுக்கும்
  rationale: இராணுவச் சூழலில் שׂרים என்பது பொதுத் தலைவர்களைவிட படையை வழிநடத்தும் அதிகாரிகளைக் குறிக்கிறது.
- source_word: עַל דְּבַר אַבְשָׁלוֹם
  choice: அப்சலோமைக் குறித்து
  rationale: ‘அப்சலோம் தொடர்பாக’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
