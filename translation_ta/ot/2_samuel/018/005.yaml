translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன. ‘மெதுவாக’ என்பது வேகத்தை மட்டும் குறிக்கக்கூடும் என்பதால், இரக்கம் மற்றும் கட்டுப்பாட்டைக் காட்ட ‘மென்மையாக நடத்துங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
