base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/018.yaml
  text: Absalom had taken and set up for himself in his lifetime the pillar that is in the Valley of the King[a], for he said, “I have no son to keep my name in remembrance.” So he called the pillar by his own name, and it is called Absalom’s Monument to this day.
translation:
  language: ta
  text: அப்சலோம் தான் உயிரோடிருந்தபோது அரசரின் பள்ளத்தாக்கில் தனக்காக ஒரு நினைவுத்தூணை எடுத்து நிறுவியிருந்தான். ஏனெனில், “என் பெயர் நினைவுகூரப்படுவதற்காக எனக்கு ஒரு மகனும் இல்லை” என்று அவன் சொல்லியிருந்தான். ஆகவே, அந்தத் தூணுக்குத் தன் பெயரையே சூட்டினான். அது இன்றுவரை “அப்சலோமின் நினைவுச்சின்னம்”[a] என்று அழைக்கப்படுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அப்சலோமின் கை.” இங்கு “கை” என்பது ஒரு நினைவுக்குறி அல்லது நினைவுச்சின்னத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַח וַיַּצֶּב לוֹ
  choice: ஒரு நினைவுத்தூணைத் தனக்காக நிறுவியிருந்தான்
  rationale: לָקַח இங்கு தனியே இயல்பாகத் தமிழாக்கப்படுவதைவிட, அடுத்துள்ள ‘நிறுவினான்’ என்ற செயலை முன்னெடுக்கும் வினையாகப் புரிகிறது. முந்தைய காலச் செயலைக் காட்ட ‘நிறுவியிருந்தான்’ பயன்படுத்தப்பட்டது.
- source_word: בְחַיּו
  choice: தான் உயிரோடிருந்தபோது
  rationale: அப்சலோம் வாழ்ந்த காலத்திலேயே இதைச் செய்தான் என்ற பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: מַצֶּבֶת
  choice: நினைவுத்தூண்
  rationale: நிறுத்தப்பட்ட கல் அல்லது தூண் என்ற உருவகத் தன்மையையும், இச்சூழலின் நினைவுச் செயல்பாட்டையும் ஒன்றாகத் தெரிவிக்கிறது.
- source_word: בְעֵמֶק הַמֶּלֶךְ
  choice: அரசரின் பள்ளத்தாக்கில்
  rationale: எபிரெய இடப்பெயரின் கூறுகளை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: בַּעֲבוּר הַזְכִּיר שְׁמִי
  choice: என் பெயரை நினைவில் நிலைநிறுத்த
  rationale: தன் பெயர் தொடர்ந்து நினைவுகூரப்பட வேண்டும் என்ற நோக்கத்தைத் தெளிவாகத் தெரிவிக்கிறது; சந்ததி வழியான பெயர் தொடர்ச்சியையும் மிகைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: וַיִּקְרָא לַמַּצֶּבֶת עַל שְׁמוֹ
  choice: அந்தத் தூணுக்குத் தன் பெயரையே சூட்டினான்
  rationale: ‘தன் பெயரின்படி அழைத்தான்’ என்ற எபிரெய மரபுத்தொடரின் இயல்பான தமிழாக்கம்.
- source_word: יַד אַבְשָׁלוֹם
  choice: அப்சலோமின் நினைவுச்சின்னம்
  rationale: יַד என்பதன் அடிப்படைப் பொருள் ‘கை’ என்றாலும், இச்சூழலில் அது நினைவுக்குறி அல்லது நினைவுச்சின்னத்தைக் குறிக்கும் மரபுத்தொடராக உள்ளது. வாசகர் உரையில் பொருளைத் தெளிவாக வழங்கி, சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை
  rationale: எழுதப்பட்ட காலம்வரை அந்தப் பெயர் பயன்பாட்டில் நீடித்ததைக் குறிக்கும் வழக்கமான தமிழ்ச் சொற்றொடர்.
