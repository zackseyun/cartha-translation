  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நினைவுத்தூண் மற்றும் அதன் பெயராகிய நினைவுச்சின்னம் ஆகியவை சூழலுக்கேற்ப வேறுபடுத்தப்பட்டுள்ளன.
