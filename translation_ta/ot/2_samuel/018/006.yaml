  yaml_path: translation/ot/2_samuel/018/006.yaml
  text: So the troops went out into the field to meet Israel[a], and the battle took place in the forest of Ephraim.
translation:
  language: ta
  text: அப்படியே படைவீரர்கள்[a] இஸ்ரவேலை எதிர்கொள்ள வயல்வெளிக்குப் புறப்பட்டுச் சென்றார்கள்; எப்பிராயீம் காட்டில் போர் நடந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘மக்கள்’; இங்கே அது தாவீதின் போர்ப்படையைக் குறிப்பதால் ‘படைவீரர்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
