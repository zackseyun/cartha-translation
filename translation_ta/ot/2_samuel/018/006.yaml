lexical_decisions:
- source_word: הָעָם
  choice: படைவீரர்கள்
  rationale: இச்சொல்லின் அடிப்படைப் பொருள் ‘மக்கள்’ என்றாலும், சுற்றியுள்ள இராணுவச் சூழலில் இது தாவீதின் போர்ப்படையைக் குறிக்கிறது. ஆகவே நவீனத் தமிழில் ‘படைவீரர்கள்’ என்பது சூழலுக்கேற்ற தெளிவான மொழிபெயர்ப்பு.
- source_word: הַשָּׂדֶה
  choice: வயல்வெளிக்கு
  rationale: שָׂדֶה என்பது ‘வயல்/திறந்த வெளி’ எனப் பொருள்படும். יצא என்ற ‘புறப்பட்டுச் செல்’ வினையுடன் ‘வயல்வெளிக்குப் புறப்பட்டுச் சென்றார்கள்’ என்பது இயல்பான தமிழாகவும், போரிடும் இடத்தை நோக்கிய நகர்வை உணர்த்துவதாகவும் உள்ளது.
- source_word: לִקְרַאת
  choice: எதிர்கொள்ள
  rationale: இது ‘சந்திக்க/எதிர்கொள்ள’ என்பதைக் குறிக்கிறது. போர்ச் சூழலில் பகைமை நோக்கம் உள்ளதால், ‘எதிர்கொள்ள’ என்பது அதனை இயல்பாக உணர்த்துகிறது; ‘எதிராகப் போரிட’ என்று பொருளை அதிகமாக விரிவாக்கவில்லை.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: எபிரெய மூலத்தில் உள்ள தேசியப் பெயரையே தக்கவைத்துள்ளோம். சூழலில் இது அப்சலோமுடன் இருந்த எதிர்ப்படையைக் குறித்தாலும், மூலவாக்கியம் ‘இஸ்ரவேல்’ என்றே கூறுகிறது.
- source_word: הַמִּלְחָמָה
  choice: போர்
  rationale: இந்த இடத்தில் சொல் ஒரு குறிப்பிட்ட போர்மோதலைக் குறிக்கிறது. தமிழில் ‘போர் நடந்தது’ என்பது இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: וַתְּהִי
  choice: நடந்தது
  rationale: எழுத்துப்படி ‘இருந்தது/உண்டாயிற்று’ என்றாலும், நிகழ்வைக் குறிக்கும் ‘போர்’ என்பதுடன் தமிழில் ‘நடந்தது’ என்பது இயல்பான சமமான வெளிப்பாடு.
- source_word: בְּיַעַר אֶפְרָיִם
  choice: எப்பிராயீம் காட்டில்
  rationale: יַעַר என்பது ‘காடு/வனப்பகுதி.’ இடப்பெயரின் வடிவத்தையும் மூலத்தின் புவியியல் தெளிவின்மையையும் தீர்க்க முயலாமல், ‘எப்பிராயீம் காடு’ என நேரடியாகப் பாதுகாக்கிறது.
