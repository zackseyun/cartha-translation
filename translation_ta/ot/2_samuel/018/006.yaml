translation_notes:
  register: 'நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய கதைநடையின் தொடர்ச்சியை ‘அப்படியே’ உணர்த்துகிறது; இராணுவச் சூழலைத் தெளிவுபடுத்தினாலும், ‘இஸ்ரவேல்’ என்ற மூலப் பெயரும் ‘எப்பிராயீம் காடு’ என்ற இடப்பெயரும் மாற்றமின்றித் தக்கவைக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு சம்பந்தப்பட்ட ‘படைவீரர்கள்’ என்பதற்குப் பின் வர வேண்டும் என்பதால் வெளியீட்டு உரை இவ்வாறு அமைவது சிறந்தது: ‘அப்படியே படைவீரர்கள்[a] இஸ்ரவேலை எதிர்கொள்ள வயல்வெளிக்குப் புறப்பட்டுச் சென்றார்கள்; எப்பிராயீம் காட்டில் போர் நடந்தது.’'
