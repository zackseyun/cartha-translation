  text: וַ/יֹּ֣אמֶר יוֹאָ֔ב לֹא כֵ֖ן אֹחִ֣ילָה לְ/פָנֶ֑י/ךָ וַ/יִּקַּח֩ שְׁלֹשָׁ֨ה שְׁבָטִ֜ים בְּ/כַפּ֗/וֹ וַ/יִּתְקָעֵ/ם֙ בְּ/לֵ֣ב אַבְשָׁל֔וֹם עוֹדֶ֥/נּוּ חַ֖י בְּ/לֵ֥ב הָ/אֵלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/014.yaml
  text: Joab said[a], “Not so[b]; I will not wait before you.” Then he took three spears in his hand and drove them into the heart of Absalom while he was still alive in the heart of the terebinth.
translation:
  language: ta
  text: யோவாப், “அப்படியல்ல; நான் உன் முன்னிலையில் தாமதிக்கமாட்டேன்” என்றான். பின்பு அவன் தன் கையில் மூன்று ஈட்டிகளை[a] எடுத்துக்கொண்டு, அப்சலோம் டெரிபிந்த் மரத்தின்[b] நடுவில் இன்னும் உயிரோடிருந்தபோதே அவற்றை அவனுடைய இதயத்துக்குள் குத்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மூன்று கோல்களை” அல்லது “மூன்று தண்டுகளை.” எபிரெயச் சொல் கோல், தண்டு, அல்லது செங்கோல் ஆகியவற்றைக் குறிக்கலாம்; இங்கு அவை குத்தும் ஆயுதங்களாகப் பயன்படுத்தப்படுவதால் முதன்மை உரையில் “ஈட்டிகள்” என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கருவாலி மரத்தின்.” எபிரெயச் சொல் பெரும்பாலும் டெரிபிந்த் மரத்தைக் குறிக்கிறது; சில மொழிபெயர்ப்புகள் அதை பொதுவாகக் கருவாலி மரம் என வழங்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן אֹחִילָה לְפָנֶיךָ
  choice: நான் உன் முன்னிலையில் இப்படிக் காலம் கடத்தமாட்டேன்
  rationale: כֵן என்பதன் ‘இப்படி’ என்ற பொருளையும், אֹחִילָה என்பதன் தாமதித்தல் அல்லது காத்திருத்தல் என்ற கருத்தையும் இணைத்து, இயல்பான நவீனத் தமிழில் தருகிறது. לְפָנֶיךָ என்பதன் முன்னிலை/சந்நிதி சார்ந்த பொருளை ‘உன் முன்னிலையில்’ பாதுகாக்கிறது.
- source_word: שְׁלֹשָׁה שְׁבָטִים
  choice: மூன்று ஈட்டிகள்
  rationale: שֵׁבֶט பொதுவாகக் கோல் அல்லது தண்டு எனப் பொருள்படலாம்; ஆனால் இங்கு அவற்றை இதயத்துக்குள் பாய்ச்சும் போர்ச் சூழல் இருப்பதால் ‘ஈட்டிகள்’ சூழலுக்கு ஏற்ற பொருளாக உள்ளது. மூலச்சொல்லின் விரிந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּתְקָעֵם
  choice: அவற்றை ... பாய்ச்சினான்
  rationale: תקע இங்கு வலிமையாகக் குத்தி உள்ளே செலுத்தும் செயலைக் குறிக்கிறது. ‘பாய்ச்சினான்’ என்பது செயல்வலிமையையும் ஆயுதப் பயன்பாட்டையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּלֵב אַבְשָׁלוֹם
  choice: அவனுடைய இதயத்துக்குள்
  rationale: மூலத்தில் உடற்கூறு தெளிவாக ‘அப்சலோமின் இதயம்’ என இருப்பதால், அதை ‘மார்பு’ என்று பொதுமைப்படுத்தாமல் நேரடியாக மொழிபெயர்க்கிறது.
- source_word: עוֹדֶנּוּ חַי
  choice: இன்னும் உயிரோடிருந்தபோதே
  rationale: யோவாப் தாக்கிய நேரத்தில் அப்சலோம் உயிருடன் இருந்தான் என்ற மூலத்தின் வலியுறுத்தலைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּלֵב הָאֵלָה
  choice: டெரிபிந்த் மரத்தின் நடுவே
  rationale: אֵלָה என்பதற்கு ‘டெரிபிந்த் மரம்’ என்பது தாவரவியல் ரீதியாகச் சாத்தியமான குறிப்பான பொருள். בְּלֵב என்ற எபிரெயச் சொற்றொடர் இங்கு மரத்தின் மையம் அல்லது நடுப்பகுதியைக் குறிக்கும் என்பதால் இயல்பான தமிழில் ‘நடுவே’ என வழங்கப்பட்டுள்ளது.
