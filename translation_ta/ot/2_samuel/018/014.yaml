translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய உரையின் நேரடி வன்முறையும் அப்சலோம் இன்னும் உயிரோடிருந்தான் என்ற வலியுறுத்தலும் மென்மைப்படுத்தப்படவில்லை. ‘இதயம்’ என்ற முதல் இடத்தையும் மரத்தைக் குறிக்கும் இரண்டாவது בְּלֵב என்பதையும் தமிழில் முறையே ‘இதயத்துக்குள்’ மற்றும் இயல்பான இடவியல் சொல்லான ‘நடுவே’ என வேறுபடுத்தப்பட்டுள்ளது.
