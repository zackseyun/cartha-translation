base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/009.yaml
  text: Absalom happened to come before David’s servants while Absalom was riding on the mule. The mule went under the thick branches of a large terebinth[a], and his head got caught in the terebinth, so that he was left hanging between heaven and earth while the mule that was under him passed on.
translation:
  language: ta
  text: அப்சலோம் தாவீதின் பணியாளர்களுக்கு எதிர்ப்பட்டான். அப்போது அவன் கோவேறு கழுதையின்மேல் சவாரி செய்துகொண்டிருந்தான். அந்தக் கோவேறு கழுதை ஒரு பெரிய தெரிபிந்த் மரத்தின்[a] அடர்ந்த கிளைகளுக்குக் கீழே சென்றது. அப்சலோமின் தலை அந்த மரத்தில் சிக்கிக்கொண்டதால், அவன் வானத்துக்கும் பூமிக்கும் நடுவே தொங்கியபடி விடப்பட்டான்; அவனுக்குக் கீழிருந்த கோவேறு கழுதையோ தொடர்ந்து சென்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு பெரிய ஓக் மரத்தின் அடர்ந்த கிளைகள்.” எபிரெயச் சொல்லான אֵלָה பொதுவாகத் தெரிபிந்த் மரத்தைக் குறிக்கிறது; சில மொழிபெயர்ப்புகள் இதை ஓக் மரம் என மொழிபெயர்க்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּרֵא ... לִפְנֵי עַבְדֵי דָוִד
  choice: தாவீதின் பணியாளர்களுக்கு எதிர்ப்பட்டான்
  rationale: நிபால் வடிவம் திட்டமிட்ட சந்திப்பை அல்ல, தற்செயலாக அவர்களுக்கு எதிர்ப்பட்டதைச் சுட்டுகிறது. ‘எதிர்ப்பட்டான்’ நவீனத் தமிழில் இதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַבְדֵי דָוִד
  choice: தாவீதின் பணியாளர்கள்
  rationale: இராணுவச் சூழலில் இது தாவீதுக்குச் சேவை செய்த ஆட்களைக் குறிக்கிறது. ‘பணியாளர்கள்’ அடிமைத்தனத்தைத் தேவையின்றி முன்னிறுத்தாமல் மூலச் சொல்லின் சேவைப் பொருளைக் காக்கிறது.
- source_word: רֹכֵב עַל הַפֶּרֶד
  choice: கோவேறு கழுதையின்மேல் சவாரி செய்துகொண்டிருந்தான்
  rationale: பங்கேற்பு வினைச்சொல் அந்நேரத்தில் தொடர்ந்துகொண்டிருந்த செயலைக் குறிக்கிறது; ‘கோவேறு கழுதை’ என்பது פֶּרֶד என்பதற்கான துல்லியமான, புரிந்துகொள்ளத்தக்க தமிழ்ச் சொல்.
- source_word: תַּחַת שׂוֹבֶךְ הָאֵלָה הַגְּדוֹלָה
  choice: ஒரு பெரிய கருங்காலி மரத்தின் அடர்ந்த கிளைகளுக்குக் கீழே
  rationale: שׂוֹבֶךְ பின்னிப் படர்ந்த அடர்த்தியான கிளைத்தொகுதியைக் குறிக்கிறது. אֵלָה என்பதற்கு ‘கருங்காலி மரம்’ எனத் தேர்ந்தெடுக்கப்பட்டுள்ளது; மரவகை குறித்த மொழிபெயர்ப்பு வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיֶּחֱזַק רֹאשׁוֹ בָאֵלָה
  choice: அப்சலோமின் தலை அந்த மரத்தில் சிக்கிக்கொண்டதால்
  rationale: சொல்லாட்சியில் தலை மரத்தில் இறுகப் பிடிபட்ட விளைவு உள்ளது. ‘சிக்கிக்கொண்டது’ தன்னிச்சையற்ற சிக்கலை இயல்பான தமிழில் தெரிவிக்கிறது; தலைமுடி என்று மூலத்தில் இல்லாத விவரம் சேர்க்கப்படவில்லை.
- source_word: וַיֻּתַּן בֵּין הַשָּׁמַיִם וּבֵין הָאָרֶץ
  choice: வானத்துக்கும் பூமிக்கும் நடுவே தொங்கியபடி விடப்பட்டான்
  rationale: נתן என்பதன் செயப்பாட்டு வடிவம் சொற்சொல்லாக ‘வைக்கப்பட்டான்/விடப்பட்டான்’; சூழல் தொங்கிய நிலையில் விடப்பட்டதைக் காட்டுகிறது. மரபான ‘வானத்துக்கும் பூமிக்கும் நடுவே’ என்ற உருவகம் காக்கப்படுகிறது.
- source_word: עָבָר
  choice: தொடர்ந்து சென்றது
  rationale: அப்சலோம் சிக்கியபின் விலங்கு முன்னோக்கிச் சென்றதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
