  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் ‘தலை’ என்று மட்டுமே இருப்பதால், சில மரபான விளக்கங்களில் காணப்படும் ‘தலைமுடி’ சேர்க்கப்படவில்லை. வாக்கிய ஓட்டத்திற்காக நீண்ட எபிரெயத் தொடரமைப்பு மூன்று தமிழ்வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
