  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியமான தொனியிலும் வடிவமைக்கப்பட்டது. ‘இதோ’ என்ற சொல் மூலத்தின் காட்சித் திடீர்மையைப் பாதுகாக்கிறது; நிச்சயமற்ற சொற்பொருள்கள் முதன்மை உரையில் மிகையாகக் குறிப்பாக்கப்படாமல் அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளன.
