base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/001.yaml
  text: When David had passed a little beyond the summit[a], behold, Ziba the servant of Mephibosheth was there to meet him, with a pair of saddled donkeys, and on them were two hundred loaves of bread, a hundred clusters of raisins, a hundred summer fruits[c][b], and a skin of wine.
translation:
  language: ta
  text: தாவீது மலையுச்சியைச் சற்றுக் கடந்தபோது[a], இதோ, மேவிபோசேத்தின் பணியாளனான[b] சீபா, சேணமிடப்பட்ட ஒரு ஜோடி கழுதைகளுடன் அவனைச் சந்திக்க வந்தான்; அவற்றின்மேல் இருநூறு அப்பங்களும், நூறு உலர்ந்த திராட்சைக் கொத்துகளும், நூறு கோடைக்காலப் பழங்களும்[c], திராட்சரசம் நிறைந்த ஒரு தோற்பையும் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உச்சியிலிருந்து சிறிது தூரம் சென்றபோது’ என்றும் மொழிபெயர்க்கலாம். எபிரெயில் சொற்சொல்லாக ‘தலையிலிருந்து சிறிது’ என்று உள்ளது; இங்கு ‘தலை’ என்பது மலை அல்லது குன்றின் உச்சியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பணியாளன்’ என்பதற்கான எபிரெயச் சொல்லை ‘இளைஞன்’ அல்லது ‘உதவியாளர்’ என்றும் மொழிபெயர்க்கலாம்; இங்கு சீபா மேவிபோசேத்துக்குச் செய்த பணியைக் கருத்தில் கொண்டு ‘பணியாளன்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: ‘கோடைக்காலப் பழங்கள்’ என்பது குறிப்பாக அத்திப்பழங்களைக் குறிக்கக்கூடும்; ஆனால் எபிரெயச் சொல் அதைவிடப் பரந்த பொருளுடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מֵהָרֹאשׁ
  choice: மலையுச்சியைச் சற்றுக் கடந்தபோது
  rationale: רֹאשׁ என்பதன் அடிப்படைப் பொருள் ‘தலை’; இங்கு நிலவியல் சூழலில் அது மலை அல்லது குன்றின் உச்சியைக் குறிக்கிறது. ‘சற்றுக் கடந்தபோது’ என்பது பயணத் திசையையும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீர் காட்சியையும் கதைசொல்லலின் உயிரோட்டத்தையும் குறிக்கும் எபிரெய உரையாடல் அடையாளத்தை ‘இதோ’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: נַעַר מְפִי בֹשֶׁת
  choice: மேவிபோசேத்தின் பணியாளனான
  rationale: נַעַר என்பதற்கு ‘இளைஞன்’, ‘உதவியாளர்’, ‘பணியாளன்’ ஆகிய பொருள்கள் உண்டு. சீபாவுக்கும் மேவிபோசேத்துக்கும் இடையிலான பணிசார் உறவை இச்சூழல் சுட்டுவதால் ‘பணியாளன்’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: צֶמֶד חֲמֹרִים
  choice: இரண்டு கழுதைகள்
  rationale: צֶמֶד ஒரு சோடி அல்லது இணையாக உள்ள இரண்டைக் குறிக்கிறது. தமிழில் ‘இரண்டு கழுதைகள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: חֲבֻשִׁים
  choice: சேணமிடப்பட்ட
  rationale: பயணம் அல்லது சுமை ஏற்றுவதற்காக ஆயத்தப்படுத்தப்பட்ட கழுதைகள் என்ற சூழலில், பொதுவான ‘கட்டப்பட்ட’ என்பதைவிட ‘சேணமிடப்பட்ட’ துல்லியமானது.
- source_word: מָאתַיִם לֶחֶם
  choice: இருநூறு அப்பங்கள்
  rationale: எபிரெயில் எண்ணிக்கையுடன் வரும் ‘அப்பம்’ என்பதை எண்ணத்தக்க பொருளாகத் தமிழில் இயல்பாகப் பன்மைப்படுத்துகிறது.
- source_word: צִמּוּקִים
  choice: உலர்ந்த திராட்சைக் கொத்துகள்
  rationale: இந்தச் சொல் உலர்த்தப்பட்ட அல்லது ஒன்றாகத் திரட்டப்பட்ட திராட்சைப் பழங்களைக் குறிக்கிறது. ‘அடைகள்’ என்று மிகையாகக் குறிப்பாக்காமல், ஆங்கில ஆய்வுப் படலத்துடன் ஒத்த சாத்தியமான வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: קַיִץ
  choice: கோடைக்காலப் பழங்கள்
  rationale: קַיִץ பொதுவாகக் கோடைக்காலப் பழவகையைக் குறிக்கலாம்; சில சூழல்களில் குறிப்பாக அத்திப்பழங்களைக் குறிக்கலாம். மூலத்தின் விரிவான பொருளை முதன்மை உரை பாதுகாக்கிறது.
- source_word: נֵבֶל יָיִן
  choice: திராட்சரசம் நிறைந்த ஒரு தோற்பை
  rationale: נֵבֶל இங்கு தோலால் செய்யப்பட்ட திரவக் கொள்கலனைக் குறிக்கிறது. தமிழில் ‘தோற்பை’ அதன் பொருளையும் பயன்பாட்டையும் சுருக்கமாகத் தெரிவிக்கிறது.
