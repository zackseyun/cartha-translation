base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/022.yaml
  text: So they pitched the tent for Absalom on the roof[a], and Absalom went in to his father's concubines in the sight of all Israel.
translation:
  language: ta
  text: அவர்கள் அப்சலோமுக்காகக் கட்டடத்தின் மொட்டைமாடியில் கூடாரத்தை அமைத்தார்கள். அப்சலோம் இஸ்ரவேலர் அனைவரின் கண்முன்னே[a] தன் தந்தையின் வைப்பாட்டிகளிடம் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர் அனைவருக்கும் முன்பாக” அல்லது “இஸ்ரவேலர் அனைவரும் பார்க்கும்படியாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּטּוּ
  choice: அமைத்தார்கள்
  rationale: נטה என்ற வினைச்சொல், கூடாரத்தை விரித்து நிறுவுவதைக் குறிக்கிறது; தமிழில் ‘கூடாரத்தை அமைத்தார்கள்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הָאֹהֶל
  choice: கூடாரத்தை
  rationale: எபிரெயச் சொல்லில் திட்டவட்ட சுட்டு உள்ளது; சூழலில் இது அகித்தோப்பேலின் ஆலோசனையை நிறைவேற்றுவதற்காக அமைக்கப்பட்ட குறிப்பிட்ட கூடாரத்தைக் குறிக்கிறது.
- source_word: עַל הַגָּג
  choice: மாளிகை மொட்டைமாடியில்
  rationale: גָּג என்பது தட்டையான கட்டடத்தின் கூரை அல்லது மொட்டைமாடியைக் குறிக்கும். அரச அரண்மனைச் சூழலைத் தெளிவாக்க ‘மாளிகை’ சேர்க்கப்பட்டுள்ளது; ‘மொட்டைமாடி’ பொதுமக்கள் புரிந்துகொள்ளும் இயல்பான நவீனத் தமிழ்.
- source_word: וַיָּבֹא ... אֶל
  choice: சென்றான்
  rationale: இது பாலுறவைக் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழிலும் ‘மறுமனைவியரிடம் சென்றான்’ என்பது பொருளைச் சூழலால் உணர்த்தும் கண்ணியமான மறைமுகச் சொல்லாக்கமாக அமைகிறது.
- source_word: פִּלַגְשֵׁי אָבִיו
  choice: தன் தந்தையின் மறுமனைவியரிடம்
  rationale: פִּילֶגֶשׁ என்பதற்கு நவீனத் தமிழில் ‘மறுமனைவி’ என்பது ‘வைப்பாட்டி’ என்பதைவிட கண்ணியமானதும், ‘துணைவி’ என்பதைவிட இப்பெண்களின் இரண்டாம் நிலை அரச குடும்ப உறவைத் தெளிவாகக் காட்டுவதுமாகும்.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரின் கண்முன்னே
  rationale: இச்சொற்றொடரின் உருவகத்தைப் பாதுகாத்து, அந்தச் செயல் பகிரங்கமாகவும் சாட்சிகளின் முன்னிலையிலும் நடந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: அரசாட்சியைக் கைப்பற்றும் அறநெறி மீறிய சூழலில் வரும் பாலுறவுச் சொற்றொடரை மொழிபெயர்த்தல்
  choice: ‘தன் தந்தையின் மறுமனைவியரிடம் சென்றான்’ என்று மூலத்தின் மறைமுகச் சொல்லாக்கத்தைத் தக்கவைத்தல்
  alternative: ‘தன் தந்தையின் மறுமனைவியரோடு பாலுறவு கொண்டான்’ அல்லது ‘அவர்களோடு படுத்தான்’
  rationale: எபிரெயம் பாலுறவை உணர்த்தினாலும் அதை நேரடியாகக் கூறாமல் மரபுத்தொடரைப் பயன்படுத்துகிறது. தமிழ் மொழிபெயர்ப்பும் பொருளை மறைக்காமல், அதே கண்ணியத்தையும் இலக்கிய இறுக்கத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. பாலுறவைக் குறிக்கும் மூலமொழியின் மறைமுக மரபுத்தொடர் இயல்பான தமிழில் தக்கவைக்கப்பட்டுள்ளது. ‘மாளிகை மொட்டைமாடி’ என்பது பண்டைய தட்டையான அரண்மனைக் கூரையை வாசகருக்குத் தெளிவாக்குகிறது.
