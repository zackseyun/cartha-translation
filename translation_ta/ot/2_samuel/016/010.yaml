id: 2SA.16.10
reference: 2 Samuel 16:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ מַה לִּ֥/י וְ/לָ/כֶ֖ם בְּנֵ֣י צְרֻיָ֑ה כי יְקַלֵּ֗ל ו/כי יְהוָה֙ אָ֤מַר ל/וֹ֙ קַלֵּ֣ל אֶת דָּוִ֔ד וּ/מִ֣י יֹאמַ֔ר מַדּ֖וּעַ עָשִׂ֥יתָה כֵּֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/010.yaml
  text: But the king said[a], “What have I to do with you, sons of Zeruiah? If he is cursing because Yahweh has said to him, ‘Curse David,’ then who can say, ‘Why have you done so?’”
translation:
  language: ta
  text: ஆனால் அரசன், “செருயாவின் மகன்களே, எனக்கும் உங்களுக்கும் என்ன தொடர்பு? யாவே அவனிடம், ‘தாவீதைச் சபி’ என்று சொல்லியிருப்பதால் அவன் சபிக்கிறான் என்றால்[a], ‘நீ ஏன் இப்படிச் செய்தாய்?’ என்று யார் கேட்க முடியும்?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அவன் சபிக்கிறான்; ஏனெனில் யாவே அவனிடம், ‘தாவீதைச் சபி’ என்று சொல்லியிருக்கிறார்.” எபிரெயத் துகள்களை நிபந்தனையாக அல்லாமல் விளக்கமளிக்கும் வகையிலும் புரிந்துகொள்ளலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: எனக்கும் உங்களுக்கும் என்ன தொடர்பு?
  rationale: இந்த எபிரெய மரபுத்தொடர் உடைமை பற்றிய நேரடி கேள்வியல்ல; விலகி நிற்பதையும் கண்டிப்பையும் வெளிப்படுத்துகிறது. தமிழில் அதன் பொருளையும் உரையாடலின் இயல்பையும் இந்த வடிவம் தெளிவாகக் கொண்டுவருகிறது.
- source_word: בְּנֵי צְרֻיָה
  choice: செருயாவின் மகன்களே
  rationale: யோவாபையும் அபிசாயையும் அவர்களுடைய தாயின் பெயரால் அடையாளப்படுத்தும் நேரடி அழைப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְקַלֵּל / קַלֵּל
  choice: சபிக்கிறான் / சபி
  rationale: இரு வடிவங்களிலும் உள்ள ஒரே எபிரெய வேர்ச்சொல்லின் தொடர்பைத் தமிழிலும் காக்கிறது; இச்சூழலில் தாவீதை நோக்கிச் சொல்லப்படும் சாபத்தைக் குறிக்கிறது.
- source_word: כִּי ... וְכִי
  choice: …என்று சொல்லியிருப்பதால் அவன் சபிக்கிறான் என்றால்
  rationale: 'துகள்களின் கடினமான தொடரை நிபந்தனை சார்ந்த முதன்மை வாசிப்பாக வழங்குகிறது: யாவேயின் சொல்லே தற்போதைய சபித்தலுக்குக் காரணமாக இருக்குமானால் என்பதே கருத்து. விளக்கவுரையான மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.'
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பொதுப்பட்டம் அல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பெயர் என்பதால் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אָמַר לוֹ
  choice: அவனிடம் … சொல்லியிருப்பதால்
  rationale: முன்பு கூறப்பட்டதாகக் கருதப்படும் கட்டளை தற்போதைய செயலை விளக்குவதால், அதன் தொடரும் விளைவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: וּמִי יֹאמַר
  choice: என்று யார் கேட்க முடியும்?
  rationale: இது வெறும் எதிர்காலக் கூற்று அல்ல; அப்படிக் கேள்வி எழுப்ப யாருக்கு அதிகாரம் அல்லது தகுதி உண்டு என்ற சொல்லாட்சிக் கேள்வி. தமிழில் ‘முடியும்’ அந்த வலிமையை வெளிப்படுத்துகிறது.
- source_word: מַדּוּעַ עָשִׂיתָה כֵּן
  choice: நீ ஏன் இப்படிச் செய்தாய்?
  rationale: எபிரெயக் கேள்வியின் நேரடியான பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
theological_decisions:
- issue: சிமேயியின் சபித்தலில் யாவேயின் ஈடுபாடு
  choice: சிமேயி சபிப்பது யாவே அவனுக்குக் கூறியதால் இருக்கலாம் என்று தாவீது முன்வைக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: யாவே அதை வெறுமனே அனுமதித்தார் என்று மென்மைப்படுத்துதல், அல்லது எந்த நிபந்தனைத் தன்மையும் இல்லாத நேரடிக் கட்டளை என்று முற்றிலும் உறுதிப்படுத்துதல்.
  rationale: எபிரெய உரை ‘தாவீதைச் சபி’ என்று யாவே கூறியதாகப் பேசுகிறது; அதேவேளையில் துகள்களின் தொடரில் நிபந்தனை அல்லது விளக்கவுரை என்ற உண்மையான தெளிவின்மை உள்ளது. தேவனுடைய காரணச்செயல் அல்லது ஒழுக்க அங்கீகாரம் குறித்த கூடுதல் கோட்பாட்டைச் சேர்க்காமல் அந்த இறையியல் அழுத்தம் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நேரடி உரை பயன்படுத்தப்பட்டுள்ளது. ‘அரசன்’, ‘தொடர்பு’, ‘கேட்க முடியும்’ போன்ற சொற்கள் பொதுவாசகருக்குத் தெளிவாக இருக்கின்றன; அதே நேரத்தில் மூலத்தின் கண்டிப்பும் சொல்லாட்சிக் கேள்வியும் பாதுகாக்கப்பட்டுள்ளன.
