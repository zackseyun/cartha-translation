    rationale: In contemporary Tamil, ‘விசுவாசம்’ commonly denotes faith or belief, especially in religious contexts. Absalom’s accusation concerns Hushai’s loyalty toward David; ‘பற்றுறுதி’ communicates that sense more directly.
