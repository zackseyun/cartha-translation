source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ אֶל חוּשַׁ֔י זֶ֥ה חַסְדְּ/ךָ֖ אֶת רֵעֶ֑/ךָ לָ֥/מָּה לֹֽא הָלַ֖כְתָּ אֶת רֵעֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/017.yaml
  text: Absalom said to Hushai[a], “Is this your loyalty to your friend? Why did you not go with your friend?”
translation:
  language: ta
  text: அப்சலோம் ஊசாயிடம், “உன் நண்பனிடம் நீ காட்டும் பற்றுறுதி இதுதானா?[a] நீ ஏன் உன் நண்பனோடு போகவில்லை?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பற்றுறுதி’ என்பதற்கான எபிரெயச் சொல் ‘இரக்கம்’ அல்லது ‘மாறாத அன்பு’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדְּךָ
  choice: நீ காட்டும் விசுவாசம்
  rationale: חֶסֶד என்பது சூழலுக்கேற்ப இரக்கம், மாறாத அன்பு, விசுவாசம் ஆகியவற்றைக் குறிக்கலாம். இங்கு தாவீதுடனான ஊசாயின் நட்புறவையும் பற்றுறுதியையும் அப்சலோம் கேள்விக்குள்ளாக்குவதால், ‘விசுவாசம்’ இயல்பாகப் பொருந்துகிறது.
- source_word: רֵעֶךָ
  choice: உன் நண்பன்
  rationale: רֵעַ என்பதற்கு நண்பன், தோழன், உடனிருப்பவன் போன்ற பொருள்கள் உண்டு. இங்கு தாவீதைச் சுட்டுவதால், நவீனத் தமிழில் ‘நண்பன்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: לָמָּה לֹא הָלַכְתָּ אֶת רֵעֶךָ
  choice: நீ ஏன் உன் நண்பனோடு போகவில்லை?
  rationale: הלך உடன் வரும் אֶת இங்கு ஒருவருடன் செல்வதைக் குறிக்கிறது. ‘நண்பனோடு போகவில்லை’ என்பது எபிரெய வினையின் எளிமையையும் தமிழின் இயல்பையும் காக்கிறது.
- source_word: זֶה חַסְדְּךָ אֶת רֵעֶךָ
  choice: உன் நண்பனுக்கு நீ காட்டும் விசுவாசம் இதுதானா?
  rationale: எபிரெயத்தில் இது வினைச்சொல் இல்லாத, ஏளனமும் கண்டனமும் கலந்த வினா. தமிழில் ‘இதுதானா?’ என அமைப்பது அந்தச் சொல்லாற்றலை இயல்பாக வெளிப்படுத்துகிறது; אֶת இங்கு நண்பனை நோக்கிய நடத்தையைக் குறிக்கிறது.
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: וַיֹּאמֶר என்பது வழக்கமான கதைநடைச் சொல், ‘சொன்னான்’. மேற்கோள் வினாவாக இருப்பதால் தமிழில் மேற்கோளின் முடிவில் ‘என்றான்’ என்று வழங்குவது இயல்பானது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அப்சலோமின் கண்டனத் தொனியை ‘இதுதானா?’ என்ற சொல்லமைப்பு காக்கிறது. பெயர் ‘Hushai’ என்பது தமிழ் வேதாகமப் பயன்பாட்டிற்கு ஏற்றபடி ‘ஊசாய்’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
