  text: וְ/אַבְשָׁל֗וֹם וְ/כָל הָ/עָם֙ אִ֣ישׁ יִשְׂרָאֵ֔ל בָּ֖אוּ יְרוּשָׁלִָ֑ם וַ/אֲחִיתֹ֖פֶל אִתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/015.yaml
  text: Absalom and all the people[a], the men of Israel, came to Jerusalem, and Ahithophel was with him.
translation:
  language: ta
  text: அப்சலோமும் எல்லா மக்களும், இஸ்ரவேலின் ஆண்களும், எருசலேமுக்கு வந்தார்கள்; அகித்தோப்பேலும் அவனோடு இருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַבְשָׁלוֹם
  choice: அப்சலோமும்
  rationale: வְ இணைப்பைத் தமிழின் ‘-உம்’ விகுதி இயல்பாக வெளிப்படுத்துகிறது; பெயர் வழக்கமான தமிழ் வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְכָל הָעָם
  choice: எல்லா மக்களும்
  rationale: עָם இங்கு அப்சலோமுடன் வந்த மக்களைக் கூட்டாகக் குறிக்கிறது; ‘படை’ என்பது பொருளைத் தேவையின்றிக் குறுக்கும்.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேல் ஆண்களும்
  rationale: சொற்றொடரின் ஆண்பால் மற்றும் தேசிய அடையாளத்தைப் பேணுகிறது. முன்வரும் ‘எல்லா மக்களும்’ என்பதற்கு விளக்கமான இணைப்பாக கோடுகளுக்குள் வைக்கப்பட்டுள்ளது.
- source_word: בָּאוּ יְרוּשָׁלִָם
  choice: எருசலேமுக்கு வந்தார்கள்
  rationale: בוא என்பதன் இயல்பான இயக்கப் பொருள் ‘வந்தார்கள்’; இலக்கைத் தமிழில் ‘-க்கு’ தெளிவாகக் காட்டுகிறது.
- source_word: וַאֲחִיתֹפֶל אִתּוֹ
  choice: அகித்தோப்பேலும் அவனோடு இருந்தான்
  rationale: எபிரெயத்தில் வெளிப்படையாக இல்லாத இணைப்புவினை தமிழில் முழுமையான வாக்கியத்திற்காக ‘இருந்தான்’ என வழங்கப்பட்டுள்ளது; ‘அவன்’ சூழலில் இயல்பாக அப்சலோமைக் குறிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. எபிரெயத்தின் இணைப்பு அமைப்பையும் ‘எல்லா மக்கள் / இஸ்ரவேல் ஆண்கள்’ என்ற உண்மையான சொற்றொடர் நெருக்கத்தையும் அடிக்குறிப்புடன் பேணுகிறது.
