base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/023.yaml
  text: The counsel of Ahithophel that he gave in those days was as if one inquired of God[a]; so was all the counsel of Ahithophel both to David and to Absalom.
translation:
  language: ta
  text: அந்த நாட்களில் அகித்தோப்பேல் வழங்கிய ஆலோசனை, ஒருவர் கடவுளிடம் விசாரிப்பதைப் போலவே இருந்தது[a]. தாவீதுக்கும் அப்சலோமுக்கும் அகித்தோப்பேல் வழங்கிய எல்லா ஆலோசனையும் அவ்வாறே இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளிடமிருந்து ஒரு வார்த்தையைப் பெற ஒருவர் விசாரிப்பது போல.” அகித்தோப்பேலின் ஆலோசனை எவ்வளவு உயர்வாகக் கருதப்பட்டது என்பதை இந்த எபிரெய ஒப்புமை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: ஆலோசனை
  rationale: அரசவையில் ஆலோசகர் வழங்கும் அறிவுரையையும் திட்டமிட்ட வழிகாட்டுதலையும் குறிக்கும் சொல்லாக, நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: יָעַץ
  choice: வழங்கிய
  rationale: ‘ஆலோசனை வழங்கிய’ என்பது எபிரெய வினைச்சொல்லின் பொருளை இயல்பான தமிழில் எடுத்துரைக்கிறது; ‘ஆலோசித்த’ என்பதால் தன்னுள் சிந்தித்தார் என்ற தவறான சாயல் ஏற்படுவதைத் தவிர்க்கிறது.
- source_word: בַּיָּמִים הָהֵם
  choice: அந்த நாட்களில்
  rationale: காலத்தைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கு நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: כַּאֲשֶׁר יִשְׁאַל
  choice: ஒருவர் ... விசாரிப்பது போல
  rationale: குறிப்பிட்ட ஒருவரைச் சுட்டாத பொதுவான ஒப்புமையையும் அதன் நிகழ்காலத் தன்மையையும் காக்கிறது.
- source_word: בִּדְבַר הָאֱלֹהִים
  choice: கடவுளிடம்
  rationale: இங்கு உள்ள எபிரெய மரபுத்தொடர் கடவுளின் வழிகாட்டுதலை நாடி விசாரிப்பதைக் குறிக்கலாம். வாசிப்புக்கு இயல்பான இந்த வடிவம் முதன்மை உரையில் பயன்படுத்தப்பட்டு, ‘கடவுளிடமிருந்து ஒரு வார்த்தையை விசாரித்தல்’ என்ற சொல் சார்ந்த மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: כֵּן
  choice: அப்படியே
  rationale: முந்தைய ஒப்புமையை மீண்டும் வலியுறுத்தும் சுருக்கமான எபிரெய அமைப்பைத் தக்கவைக்கிறது.
- source_word: גַּם לְדָוִד גַּם לְאַבְשָׁלֹם
  choice: தாவீதுக்கும் அப்சலோமுக்கும்
  rationale: גַּם ... גַּם என்ற இணை அமைப்பையும் இருவருக்கும் ஆலோசனை வழங்கப்பட்ட உறவையும் தமிழின் ‘-உக்கும் ... -உக்கும்’ அமைப்பு தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கடவுளிடம் விசாரிப்பதோடு செய்யப்படும் ஒப்புமையின் வலிமை
  choice: அகித்தோப்பேலின் ஆலோசனை கடவுளிடம் விசாரிப்பதற்கு ஒப்பாக இருந்தது என்ற உருவக ஒப்புமையை நேரடியாகக் காத்தல்
  alternative: அவருடைய ஆலோசனை கடவுளின் வெளிப்பாடே எனக் கூறுதல்; அல்லது அது மிகவும் மதிக்கப்பட்டது என்று மட்டும் விளக்கமாக மொழிபெயர்த்தல்
  rationale: எபிரெய உரை அடையாளப்படுத்தாமல் ஒப்பிடுகிறது. ஆகவே அகித்தோப்பேலின் ஆலோசனை இறை வெளிப்பாடு என்று கூறாமலும், ஒப்புமையின் வலிமையை வெறும் ‘மதிப்பு’ எனக் குறைக்காமலும் அதன் இறையியல் அழுத்தம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. முதல் வாக்கியத்தில் எபிரெய ஒப்புமை விளக்கச் சொற்கள் சேர்க்காமல் காக்கப்பட்டுள்ளது; இரண்டாம் வாக்கியத்தில் தமிழின் எண்ணொத்திசைவுக்காக ‘ஆலோசனைகள் அனைத்தும் ... இருந்தன’ என இயல்பாக்கப்பட்டுள்ளது.
