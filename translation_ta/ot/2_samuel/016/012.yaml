  text: אוּלַ֛י יִרְאֶ֥ה יְהוָ֖ה ב/עונ/י וְ/הֵשִׁ֨יב יְהוָ֥ה לִ/י֙ טוֹבָ֔ה תַּ֥חַת קִלְלָת֖/וֹ הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/012.yaml
  text: Perhaps Yahweh will look on my affliction[a], and Yahweh will repay me with good in place of his cursing this day.
translation:
  language: ta
  text: ஒருவேளை யாவே என் துன்பத்தை[a] யாவே பார்ப்பார்; இன்று அவனுடைய சபித்தலுக்குப் பதிலாக யாவே எனக்கு நன்மை அளிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எழுதப்பட்ட வடிவத்தின்படி, “என் அக்கிரமத்தை” என்றும் மொழிபெயர்க்கலாம்.
    reason: textual_variant
lexical_decisions:
- source_word: אוּלַי
  choice: ஒருவேளை
  rationale: தாவீதின் உறுதியற்றதாயினும் நம்பிக்கையுள்ள எதிர்பார்ப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִרְאֶה
  choice: பார்ப்பார்
  rationale: ראה என்பதன் நேரடியான ‘பார்’ உருவகத்தைத் தக்கவைத்து, இச்சூழலில் துன்பத்தைக் கவனிப்பார் என்ற பொருளையும் இயல்பாக உணர்த்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் தருகிறது.
- source_word: ב/עונ/י
  choice: என் துன்பத்தை
  rationale: வாசிக்கப்படும் வடிவமும் உடனடிச் சூழலும் தாவீதின் அவமானம் மற்றும் வேதனையைக் குறிக்கின்றன; எழுதப்பட்ட வடிவம் சுட்டக்கூடிய ‘என் அக்கிரமத்தை’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְהֵשִׁיב יְהוָה לִי טוֹבָה
  choice: யாவே எனக்கு நன்மை செய்வார்
  rationale: சוב என்பதன் ஈடுசெய்தல் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘நன்மையைத் திருப்பித் தருவார்’ என்பது இங்கு முன்பிருந்த நன்மையை மீட்டளிப்பது போலத் தவறாகப் புரியலாம்.
- source_word: תַּחַת
  choice: பதிலாக
  rationale: மாற்றீடு அல்லது ஈடான பிரதிபலன் என்ற உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: קִלְלָתוֹ
  choice: இவன் என்னைச் சபித்ததற்கு
  rationale: ஆண்பால் ஒருமை உடைமைச் சுட்டையும், சிமெயியின் நிகழ்காலச் சபித்தல் செயலையும் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַיּוֹם הַזֶּה
  choice: இன்று
  rationale: எபிரேய காலக் குறிப்பை நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் தருகிறது.
theological_decisions:
- issue: ב/עונ/י என்பதிலுள்ள கெதீவ்/கெரே வேறுபாடு
  choice: முதன்மை உரையில் ‘என் துன்பத்தை’
  alternative: ‘என் அக்கிரமத்தை’
  rationale: மசோரா வாசிப்பு மரபும் நிகழ்ச்சிச் சூழலும் தாவீதின் தற்போதைய துயரத்தைக் குறிக்கின்றன. இருப்பினும் எழுதப்பட்ட மெய்யெழுத்து வடிவம் ‘என் அக்கிரமத்தை’ எனப் புரிய இடமளிப்பதால், அந்த உண்மையான உரைத் தெளிவின்மை அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: தாவீதின் எதிர்பார்ப்பின் உறுதிநிலை
  choice: ‘ஒருவேளை’ என்று நிபந்தனையுடனான நம்பிக்கையைத் தக்கவைத்தல்
  alternative: உறுதியான வாக்குறுதிபோல் மொழிபெயர்த்தல்
  rationale: אוּלַי உறுதியான அறிவிப்பை அல்ல, இறை இரக்கத்தை எதிர்நோக்கும் பணிவான சாத்தியத்தையே குறிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘யாவே’ என்ற இறைத் திருப்பெயர் தக்கவைக்கப்பட்டுள்ளது; உரை வேறுபாட்டைக் காட்ட [a] குறியீடு முதன்மை உரையிலேயே இடப்பட்டுள்ளது.
