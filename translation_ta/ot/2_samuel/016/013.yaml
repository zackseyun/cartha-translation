  text: So David and his men went on the road[a], while Shimei went along on the hillside opposite him, going along and cursing[c][b], and throwing stones opposite him and flinging dust.
translation:
  language: ta
  text: தாவீதும் அவருடைய ஆட்களும் வழியில் சென்றார்கள். சிமெயி அவருக்கு எதிரே மலைச்சரிவில் சென்றுகொண்டே சபித்தான்; அவருக்கு எதிரே கற்களை எறிந்தும் புழுதியை வாரி வீசியும் கொண்டிருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּדָּרֶךְ
  choice: வழியில்
  rationale: דֶּרֶךְ என்பது இங்கு தாவீதும் அவருடைய ஆட்களும் பயணம் செய்த வழி அல்லது சாலையைக் குறிக்கிறது; ‘வழியில்’ என்பது இயல்பாகவும் இடச்சூழலைத் தெளிவாகவும் தருகிறது.
- source_word: בְּצֵלַע הָהָר
  choice: மலைச்சரிவில்
  rationale: צֵלַע என்பதன் அடிப்படைப் பொருள் ‘பக்கம்/பக்கவாட்டு.’ மலையுடன் சேர்ந்த இச்சொற்றொடரை, தாவீது சென்ற வழிக்கு எதிரான உயர்ந்த நிலப்பகுதியாக இயல்பான தமிழில் ‘மலைச்சரிவில்’ என்று வழங்கப்பட்டுள்ளது.
- source_word: לְעֻמָּתוֹ
  choice: அவருக்கு எதிரே / அவருக்கு எதிரே இருந்தபடி
  rationale: இச்சொல் இடவியல் ரீதியாக ‘அவருக்கு எதிரில்/எதிரே’ என்பதைக் குறிக்கிறது. எபிரெயத்தில் இருமுறை வருவதால், சிமெயியின் இணையான இயக்கத்தையும் அவன் கற்களை எறிந்த நிலையையும் காட்ட இரு இடங்களிலும் பொருள் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: הֹלֵךְ ... הָלוֹךְ
  choice: தொடர்ந்து சென்றுகொண்டே
  rationale: வினையெச்சமும் infinitive absolute வடிவமும் சேர்ந்து நீடித்த இயக்கத்தை வலியுறுத்துகின்றன; ‘தொடர்ந்து சென்றுகொண்டே’ அந்த நீடித்த செயலை இயல்பான தமிழில் தருகிறது.
- source_word: וַיְקַלֵּל
  choice: அவரைச் சபித்தான்
  rationale: Piel வடிவிலுள்ள קלל இங்கு ‘சபித்தல்’ என்று பொருள்படும்; செயப்படுபொருள் சூழலிலிருந்து தாவீது எனத் தெளிவாக இருப்பதால் ‘அவரை’ சேர்க்கப்பட்டுள்ளது.
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: கற்களை எறிந்து
  rationale: סקל சில சூழல்களில் கல்லெறிந்து கொல்வதைக் குறிக்கலாம்; ஆனால் இங்கு மலைச்சரிவிலிருந்து நிகழும் பகைமையான தொல்லையே முன்னிலையாக இருப்பதால், நீதித்தீர்ப்பு அல்லது மரணதண்டனை என்ற மிகைப்பொருளைத் தவிர்த்து ‘கற்களை எறிந்து’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְעִפַּר בֶּעָפָר
  choice: புழுதியையும் வாரித் தூற்றினான்
  rationale: ஒரே வேர் கொண்ட வினை–பெயர் அமைப்பு புழுதியை எடுத்து வீசும் செயலை வலுப்படுத்துகிறது. ‘வாரித் தூற்றினான்’ என்பது பகைமையான, தொடர்ச்சியான சைகையை உயிரோட்டத்துடன் தருகிறது.
- source_word: וַאֲנָשָׁיו
  choice: அவருடைய ஆட்கள்
  rationale: இங்கு אֲנָשִׁים தாவீதுடன் சென்ற ஆண் தோழர்கள் அல்லது பின்தொடர்பவர்களைக் குறிக்கிறது; ‘அவருடைய ஆட்கள்’ என்பது சூழலுக்கு ஏற்ற இயல்பான தமிழ்.
- source_word: וַיֵּלֶךְ
  choice: சென்றார்கள்
  rationale: הלך என்பதன் அடிப்படைப் பொருள் ‘செல்/நட.’ தாவீதும் அவருடைய ஆட்களும் எழுவாயாக இருப்பதால் தமிழில் மரியாதைப் பன்மையுடன் வழங்கப்பட்டுள்ளது.
