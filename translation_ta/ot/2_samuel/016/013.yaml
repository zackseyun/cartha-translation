  source_fidelity: 'மொத்தத்தில் எபிரெய மூலத்துக்கு நெருக்கமாக உள்ளது: வழி, மலைப்பக்கச் சரிவு, தாவீதுக்கு எதிரான இணைநிலை, நீடித்துச் செல்லுதல் மற்றும் சபித்தல், கற்களை எறிதல் ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் ‘புழுதியையும் வாரித் தூற்றினான்’ என்பதில் ‘தூற்றுதல்’ தமிழில் பொதுவாக இகழ்ந்து பேசுதலையும் குறிக்கக்கூடியதால், עִפַּר בֶּעָפָר என்ற உடல்ரீதியான புழுதியை வீசும் செயலைத் தெளிவாகத் தர ‘வாரி வீசினான்’ தேவைப்படுகிறது.'
  naturalness: திருத்தப்பட்ட உரை நவீன நிலையான தமிழில் இயல்பாகவும், வரலாற்றுக் கதைநடைக்கேற்ற கண்ணியமான பதிவிலும் உள்ளது. ‘சென்றுகொண்டே சபித்தான்’ மற்றும் ‘எறிந்தும் ... வீசியும் கொண்டிருந்தான்’ என்பவை மூலத்தின் தொடர்ச்சியான செயல்நிலையைத் தெளிவாக வெளிப்படுத்துகின்றன.
