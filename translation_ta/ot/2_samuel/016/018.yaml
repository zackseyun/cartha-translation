  text: וַ/יֹּ֣אמֶר חוּשַׁי֮ אֶל אַבְשָׁלֹם֒ לֹ֕א כִּי֩ אֲשֶׁ֨ר בָּחַ֧ר יְהוָ֛ה וְ/הָ/עָ֥ם הַ/זֶּ֖ה וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֑ל לא אֶהְיֶ֖ה וְ/אִתּ֥/וֹ אֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/018.yaml
  text: Hushai said to Absalom[a], “No, for the one whom Yahweh and this people and all the men of Israel have chosen—I will be his[c][b], and with him I will remain.”
translation:
  language: ta
  text: ஊசாய் அப்சலோமிடம், “இல்லை! யாவேயும் இந்த மக்களும் இஸ்ரவேலின் ஆண்கள் அனைவரும் யாரைத் தேர்ந்தெடுத்திருக்கிறார்களோ[a], அவருக்கே நான் உரியவனாக இருப்பேன்; அவருடனேயே தங்கியிருப்பேன்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயும் இந்த மக்களும் இஸ்ரவேலின் ஆண்கள் அனைவரும் யாரைத் தேர்ந்தெடுப்பார்களோ.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “அவருடன் அமர்ந்திருப்பேன்”; இங்கு அது அவருடன் தொடர்ந்து இருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כִּי
  choice: இல்லை!
  rationale: இந்தச் சொற்றொடர் முதலில் அப்சலோமின் குற்றச்சாட்டை வலுவாக மறுத்து, தொடர்ந்து ஊசாயின் நிலைப்பாட்டை விளக்குகிறது. தமிழில் ‘இல்லை!’ என்பது அந்த மறுப்பை இயல்பாக வெளிப்படுத்துகிறது; அடுத்த வாக்கியமே காரணம் அல்லது திருத்தத்தை வழங்குகிறது.
- source_word: אֲשֶׁר בָּחַר
  choice: யாரைத் தேர்ந்தெடுத்திருக்கிறார்களோ
  rationale: தொடர்ந்து வரும் கூட்டெழுவாயான யாவே, இந்த மக்கள், இஸ்ரவேலின் ஆண்கள் அனைவரும் என்பவற்றுடன் இயல்பான தமிழில் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வினையின் நிறைவேற்றப்பட்ட செயல் பார்வையை ‘தேர்ந்தெடுத்திருக்கிறார்களோ’ வெளிப்படுத்துகிறது; காலம்/நிலை பற்றிய மாற்று வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, எபிரெய வேதாகமத்தில் வரும் இறைநாமம். தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்படுகிறது.
- source_word: וְהָעָם הַזֶּה
  choice: இந்த மக்களும்
  rationale: הָעָם என்பது ஒருமை வடிவிலுள்ள கூட்டுப்பெயர்; தமிழில் ‘இந்த மக்கள்’ என்று இயல்பாகவும் பொருளைத் தக்கவைத்தும் மொழிபெயர்க்கப்படுகிறது.
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஆண்கள் அனைவரும்
  rationale: சொல்லுக்கு நெருக்கமாக ‘இஸ்ரவேலின் ஒவ்வோர் ஆணும்’ எனலாம். சூழலில் உள்ள கூட்டுத்தன்மையையும் மூலத்தின் ஆண்பால் குறிப்பையும் இயல்பான நவீன தமிழில் ‘ஆண்கள் அனைவரும்’ தக்கவைக்கிறது.
- source_word: לוֹ אֶהְיֶה
  choice: அவருக்கே நான் உரியவனாக இருப்பேன்
  rationale: எபிரெயச் சொற்றொடர் ‘அவருக்காக/அவருக்கு நான் இருப்பேன்’ என நெருக்கமாகப் பொருள்படும்; இங்கு அரசியல் விசுவாசம் மற்றும் சார்பு குறிக்கப்படுவதால் ‘அவருக்கே உரியவனாக’ என்பது இயல்பாக அந்தப் பொருளை வெளிப்படுத்துகிறது.
- source_word: וְאִתּוֹ אֵשֵׁב
  choice: அவருடனேயே தங்கியிருப்பேன்
  rationale: יָשַׁב என்பதன் அடிப்படைப் பொருள் ‘உட்கார்’ என்றாலும், இங்கு ஒருவருடன் தொடர்ந்து இருப்பது அல்லது தங்குவது என்ற பொருள் பொருந்துகிறது. ‘தங்கியிருப்பேன்’ அந்தத் தொடர்ந்த இணைப்பை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுவான பட்டப்பெயர் அல்லாமல் நான்கெழுத்து இறைநாமம் நேரடியாக உள்ளது. ஆகவே பெயரின் தனித்தன்மையை மறைக்காமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- issue: அப்சலோமையா தாவீதையா குறிக்கிறது என்ற உள்நோக்கம்
  choice: ‘யாரை... அவருக்கே’ என்ற மூலத்தின் மறைமுக வடிவம் தக்கவைக்கப்பட்டது
  alternative: அப்சலோமை அல்லது தாவீதை பெயரிட்டு வெளிப்படையாக்குதல்
  rationale: ஊசாயின் வார்த்தைகள் வெளிப்படையாக அப்சலோமுக்கு விசுவாசமாக ஒலித்தாலும் தாவீதையும் மறைமுகமாகக் குறிக்கக்கூடிய பதற்றம் கொண்டவை. பெயரைச் சேர்ப்பது மூலத்தின் திட்டமிட்ட இருபொருள் வாய்ப்பைத் தீர்த்துவிடும்.
- issue: כָל אִישׁ יִשְׂרָאֵל என்பதிலுள்ள பாலினக் குறிப்பு
  choice: இஸ்ரவேலின் ஆண்கள் அனைவரும்
  alternative: இஸ்ரவேலர் அனைவரும்
  rationale: אִישׁ என்பது இங்கு வெளிப்படையாக ‘ஆண்/மனிதன்’ என்று உள்ளது. பாலினக் குறிப்பை முற்றிலும் நீக்காமல், தமிழில் இயல்பான கூட்டுவடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளை கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ஊசாயின் பதிலிலுள்ள அரசியல் இருபொருள் வாய்ப்பு விளக்கிச் சீர்செய்யப்படாமல் தக்கவைக்கப்பட்டுள்ளது. ‘உரியவனாக’ என்பது பேசுபவர் ஆண் என்பதையும் விசுவாச உறவையும் இயல்பாகக் காட்டுகிறது.
