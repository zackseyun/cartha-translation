- from: அப்போது அரசன் சீபாவிடம், “இதோ, மேவிபோசேத்துக்கு உரிய அனைத்தும் உனக்கே” என்றான். அதற்குச் சீபா, “நான் தலைவணங்குகிறேன்; அரசராகிய என் ஆண்டவரே, உமது பார்வையில் எனக்குத் தயவு கிடைக்கட்டும்” என்றான்.
  to: அப்போது அரசன் சீபாவிடம், “இதோ, மெப்பிபோசேத்துக்கு உரிய அனைத்தும் உனக்கே உரியது” என்றான். சீபா, “நான் பணிந்து வணங்குகிறேன்; அரசராகிய என் ஆண்டவரே, உமது பார்வையில் எனக்குத் தயவு கிடைக்கட்டும்” என்றான்.
  rationale: The revision preserves the source's direct royal speech and deferential court register, while standardizing the personal name, making the ownership assertion explicit, and using a fuller idiomatic rendering of Ziba's act of obeisance. No footnote is needed.
