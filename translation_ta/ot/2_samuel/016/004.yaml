  yaml_path: translation/ot/2_samuel/016/004.yaml
  text: Then the king said to Ziba, “Look, all that belongs to Mephibosheth is yours.” And Ziba said, “I bow down; may I find favor in your eyes, my lord the king.”
translation:
  language: ta
  text: அப்போது அரசன் சீபாவிடம், “இதோ, மெப்பிபோசேத்துக்கு உரிய அனைத்தும் உனக்கே உரியது” என்றான். சீபா, “நான் பணிந்து வணங்குகிறேன்; அரசராகிய என் ஆண்டவரே, உமது பார்வையில் எனக்குத் தயவு கிடைக்கட்டும்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரேயச் சொல்லின் வலிமையையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: הִשְׁתַּחֲוֵיתִי
  choice: நான் தலைவணங்குகிறேன்
  rationale: அரசனுக்கு முன் பணிவுடன் வணங்குவதைக் குறிக்கும் செயலைத் தெளிவாகவும் மரியாதையான நடையிலும் தருகிறது.
- source_word: אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: உமது பார்வையில் எனக்குத் தயவு கிடைக்கட்டும்
  rationale: ‘உமது கண்களில் அருள் காண்பேனாக’ என்ற எபிரேய மொழிவழக்கின் உருவகத்தையும் வேண்டுதல் நயத்தையும் இயல்பான தமிழில் காக்கிறது.
