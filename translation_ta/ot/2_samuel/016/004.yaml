translation_notes:
  register: நவீனத் தரத் தமிழில், அரசவைக்குரிய மரியாதையும் மூலத்தின் நேரடி உரையாடல் தன்மையும் காக்கப்பட்டுள்ளன. ‘ஆண்டவர்’ என்பது இங்கு அரசனை அழைக்கும் மரியாதைப் பட்டம்; தெய்வீகப் பெயராகப் பயன்படுத்தப்படவில்லை.
