base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/002.yaml
  text: Then the king said to Ziba[a], “What are these for?” And Ziba said, “The donkeys are for the king’s household to ride on, and the bread and summer fruit are for the young men to eat[c][b], and the wine is for the weary in the wilderness to drink.”
translation:
  language: ta
  text: அப்போது அரசர் சீபாவிடம், “இவை எதற்காக?”[a] என்று கேட்டார். சீபா, “கழுதைகள் அரசரின் வீட்டார் ஏறிச் செல்வதற்காகவும், அப்பமும் கோடைக்காலப் பழங்களும்[b] இளைஞர்கள்[c] சாப்பிடுவதற்காகவும், திராட்சரசம் வனாந்தரத்தில் களைப்படைந்தவர் குடிப்பதற்காகவும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவற்றைக் கொண்டுவந்ததன் பொருள் என்ன?” எபிரெய மொழிமரபைச் சொற்படி மொழிபெயர்த்தால், “இவை உனக்கு என்ன?”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கோடைக்கால விளைபொருள்கள்.” எபிரெயச் சொல் கோடைக்காலத்தில் சேகரிக்கப்படும் பழங்களையோ பிற விளைபொருள்களையோ பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “பணியாளர்கள்”; “ஏவலர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֵלֶּה לָּךְ
  choice: இவையெல்லாம் எதற்காக?
  rationale: எபிரெய மொழிமரபின் சொற்பொருள் ‘இவை உனக்கு என்ன?’ என்பதாக இருந்தாலும், இங்கு கொண்டுவரப்பட்ட பொருட்களின் நோக்கத்தை அரசர் கேட்கிறார். இயல்பான தமிழில் அதனைத் தெளிவாகவும் மிகைவிளக்கம் இன்றியும் தருகிறது.
- source_word: הַחֲמוֹרִים
  choice: கழுதைகள்
  rationale: விலங்கைக் குறிக்கும் நேரடியான, நவீனத் தமிழ்ச் சொல்.
- source_word: לְבֵית הַמֶּלֶךְ
  choice: அரசரின் வீட்டார்
  rationale: בַּיִת இங்கு கட்டடத்தையல்ல, அரசருடன் பயணித்த குடும்பத்தாரையும் பரிவாரத்தாரையும் உள்ளடக்கிய வீட்டாரைக் குறிக்கிறது.
- source_word: לִרְכֹּב
  choice: ஏறிச் செல்வதற்காக
  rationale: கழுதைகள்மேல் பயணிப்பதைக் குறிக்கும் இயல்பான தமிழாக்கம்.
- source_word: הַלֶּחֶם
  choice: அப்பம்
  rationale: மூலச்சொல்லின் நேரடிப் பொருளைப் பேணுகிறது; பிற உணவுப் பொருள் தனியே குறிப்பிடப்படுவதால் ‘உணவு’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: הַקַּיִץ
  choice: கோடைக்காலப் பழங்கள்
  rationale: கோடையில் சேகரிக்கப்படும் பழம் அல்லது விளைபொருளைக் குறிக்கும் பொதுவான சொல்லாக இருப்பதால், குறிப்பிட்ட பழவகையைச் சேர்க்காமல் அகலப் பொருளைப் பேணுகிறது.
- source_word: הַנְּעָרִים
  choice: இளைஞர்கள்
  rationale: இளைஞர்கள், பணியாளர்கள் அல்லது ஏவலர்கள் எனச் சூழலுக்கேற்ப பொருள்படக்கூடிய சொல்லின் அடிப்படைப் பொருளைப் பேணுகிறது.
- source_word: הַיָּעֵף
  choice: களைப்படைந்தவர்
  rationale: ஒருமை பெயரடை பொதுப்பொருளில் பயன்படுத்தப்பட்டுள்ளது. தமிழிலும் ஒருமை வடிவம் அத்தகைய பொதுப்பொருளை இயல்பாகத் தருகிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: குடியிருப்பற்ற வறண்ட வெளிப்பகுதியைக் குறிக்கும் வேதாகமச் சூழலுக்கு ஏற்ற, மரியாதையான தமிழ்ச் சொல்; மணற்பாலை மட்டுமே என்று குறுக்கவில்லை.
