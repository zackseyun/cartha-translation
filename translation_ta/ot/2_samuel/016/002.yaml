translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் மொழிபெயர்க்கப்பட்டுள்ளது. உரையாடலின் ஓட்டத்திற்காக கடைசி வாக்கியத்தில் எபிரெயில் வெளிப்படையாக இல்லாத ‘கொண்டுவந்தேன்’ என்பது தமிழில் மறைமுகமாக நிறைவுசெய்யப்பட்டுள்ளது; அது முன்னுள்ள கேள்வியால் தெளிவாகக் குறிக்கப்படுகிறது. அனைத்து மாற்றுப் பொருள் குறிப்புகளும் உரிய இடங்களில் [a], [b], [c] எனக் குறிக்கப்பட்டுள்ளன.
