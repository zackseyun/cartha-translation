base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/011.yaml
  text: Then David said to Abishai and to all his servants[a], “Look, my son, who came out from my own body, is seeking my life; how much more now this Benjaminite! Leave him alone, and let him curse, for Yahweh has told him to.”
translation:
  language: ta
  text: அப்போது தாவீது அபிசாயிடமும் தன் ஊழியர்கள் அனைவரிடமும், “இதோ, என் சொந்த உடலிலிருந்து பிறந்த என் மகன் என் உயிரைப் பறிக்கத் தேடுகிறான்; அப்படியிருக்கையில், இப்போது இந்தப் பென்யமீன் கோத்திரத்தவன் சபிப்பது அதைவிட எம்மாத்திரம்! அவனை விட்டுவிடுங்கள்; அவன் சபிக்கட்டும். ஏனெனில் யாவே அவனிடம் சொல்லியிருக்கிறார்.[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “ஏனெனில் யாவே அவனிடம் சொல்லியிருக்கிறார்.” என்ன சொல்லப்பட்டது என்பதை எபிரேய உரை வெளிப்படையாகக் கூறவில்லை; சூழல், சபிப்பதையே அது குறிக்கிறது என உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: தாவீது முன்வைக்கும் ஒப்பீட்டுக்கு வலியுறுத்தி கவனத்தை ஈர்க்கும் எபிரேயச் சுட்டுச் சொல்லின் இயல்பான, கண்ணியமான தமிழ் வடிவம்.
- source_word: בְנִי אֲשֶׁר יָצָא מִמֵּעַי
  choice: என் உடலிலிருந்து பிறந்த என் மகன்
  rationale: இயற்கையான உடல்வழிப் பிறப்பைச் சுட்டும் உயிரோட்டமான எபிரேய உருவகத்தை, ஆண் பேசுபவருக்குப் பொருந்தாத ‘கருப்பையிலிருந்து’ என்ற சொல்லாக்கமின்றித் தெளிவாகக் காக்கிறது.
- source_word: מְבַקֵּשׁ אֶת נַפְשִׁי
  choice: என் உயிரைப் பறிக்கத் தேடுகிறான்
  rationale: ஒருவரின் உயிரை எடுக்க முயல்வதைக் குறிக்கும் மரபுத்தொடரின் பொருளைத் தெளிவாக்குகிறது; ‘தேடுகிறான்’ என்பதையும் காத்து மூலத்தின் வெளிப்பாட்டை ஓரளவு பிரதிபலிக்கிறது.
- source_word: וְאַף כִּי עַתָּה
  choice: அப்படியிருக்க, இப்போது ... செய்வது எம்மாத்திரம்
  rationale: தன் சொந்த மகனின் தீங்குடன் பென்யமீனியனின் செயலை ஒப்பிடும் ‘எவ்வளவு அதிகமாக/அப்படியானால் இவன் எம்மாத்திரம்’ என்ற வாத வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: בֶּן הַיְמִינִי
  choice: இந்தப் பென்யமீனியன்
  rationale: பென்யமீன் கோத்திரத்தைச் சேர்ந்த ஒருவனைச் சுருக்கமாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: הַנִּחוּ לוֹ
  choice: அவனை விட்டுவிடுங்கள்
  rationale: பலரிடம் சொல்லப்படும் கட்டளையின் பன்மையைப் பாதுகாத்து, தலையிட வேண்டாம் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וִיקַלֵּל
  choice: அவன் சபிக்கட்டும்
  rationale: முந்தைய கட்டளையைத் தொடர்ந்து வரும் அனுமதிப் பொருளுடைய வடிவத்தை நேரடியாகக் காக்கிறது.
- source_word: כִּי אָמַר לוֹ יְהוָה
  choice: ஏனெனில் யாவே அவனிடம் அப்படிச் சொல்லியிருக்கிறார்
  rationale: ‘யாவே அவனிடம் சொல்லியிருக்கிறார்’ என்ற மூலத்தின் நேரடியான கூறலைக் காத்து, சொல்லப்பட்டதன் உள்ளடக்கம் சூழலில் சபிப்பதைக் குறிக்கிறது என்பதை ‘அப்படி’ மூலம் இயல்பாக உணர்த்துகிறது; அடிக்குறிப்பு அதன் சொற்பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பு வடிவில் வழங்குகிறது.
theological_decisions:
- issue: சிமேயியின் சபித்தலைத் தெய்வீகக் கட்டளையாகவா அல்லது வெறும் அனுமதி/பராமரிப்பாகவா தாவீது கூறுகிறார்?
  choice: ‘யாவே அவனிடம் அப்படிச் சொல்லியிருக்கிறார்’ என்று தாவீதின் நேரடியான காரணக்கூற்றைப் பாதுகாத்தல்.
  alternative: ‘யாவே அவனை அனுமதித்திருக்கிறார்’ அல்லது ‘யாவே அவனிடம், “தாவீதைச் சபி” என்று சொல்லியிருக்கிறார்.’
  rationale: எபிரேயம் செயலை வெறும் அனுமதியாக மென்மைப்படுத்தவில்லை; அதேவேளை சொல்லப்பட்ட வார்த்தைகளை நேரடி மேற்கோளாகவும் தரவில்லை. ஆகவே தெய்வீகச் செயற்பாடு குறித்த பதற்றத்தைத் தீர்த்துவிடாமல், உரையின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிதில் புரியக்கூடியதாயினும் கண்ணியமான வேதாகம நடையைப் பின்பற்றுகிறது. ‘எம்மாத்திரம்’ என்ற சொல்லாக்கம் ஒப்பீட்டின் வாத வலிமையைச் சுருக்கமாகக் காக்கிறது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் இடம்பெற்றுள்ளது.
