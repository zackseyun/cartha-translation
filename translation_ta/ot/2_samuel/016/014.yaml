  yaml_path: translation/ot/2_samuel/016/014.yaml
  text: The king and all the people who were with him arrived weary[b][a], and they refreshed themselves there.
translation:
  language: ta
  text: அரசனும் அவனோடு இருந்த மக்கள் அனைவரும் களைப்புற்றவர்களாக வந்து சேர்ந்தார்கள்; அங்கே அவன் புத்துணர்ச்சி பெற்றான்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் வினை ஒருமையில், ‘அவன் புத்துணர்ச்சி பெற்றான்’ என்று உள்ளது; சிலர் இதைக் கூட்டுப்பொருளில், ‘அவர்கள் புத்துணர்ச்சி பெற்றார்கள்’ என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘அங்கே அவன் ஓய்வெடுத்தான்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்து சேர்ந்தார்கள்
  rationale: בוא என்பதன் அடிப்படைப் பொருள் ‘வருதல்.’ இங்கு பயணத்தின் முடிவை இயல்பான தமிழில் தெரிவிக்க ‘வந்து சேர்ந்தார்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது; எபிரெய வினை ஒருமையில் இருந்தாலும், இணைந்த பன்மை எழுவாய்க்கேற்ப தமிழில் பன்மை பயன்படுத்தப்படுகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: சூழலில் இது தாவீதைக் குறித்தாலும், எபிரெய மூலத்தில் பெயருக்குப் பதிலாகப் பட்டமே இருப்பதால் அதுவே தக்கவைக்கப்படுகிறது.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: அவனோடு இருந்த மக்கள் அனைவரும்
  rationale: மூலத்திலுள்ள உறவுநிலைத் தொடரைத் தெளிவாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: עֲיֵפִים
  choice: களைப்புற்றவர்களாக
  rationale: இந்தச் சொல் உடல் சோர்வையும் பயணக் களைப்பையும் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகப் புரியும் வடிவம் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: וַיִּנָּפֵשׁ
  choice: அவன் புத்துணர்ச்சி பெற்றான்
  rationale: இந்த வினை மூச்சுத் தெளிந்து மீளுதல், ஓய்வால் புத்துணர்வு பெறுதல் என்ற நுண்பொருளைக் கொண்டது. எபிரெய மூலத்தின் ஒருமை வடிவமும் தமிழில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: שָׁם
  choice: அங்கே
  rationale: செயல் நிகழ்ந்த இடத்தைக் குறிக்கும் வழக்கமான இடவினையடை.
theological_decisions:
- issue: וַיִּנָּפֵשׁ என்ற வினையின் ஒருமை எழுவாய்
  choice: அவன் புத்துணர்ச்சி பெற்றான்
  alternative: அவர்கள் புத்துணர்ச்சி பெற்றார்கள்
  rationale: மசோரா எபிரெய உரையில் வினை தெளிவாக ஒருமையில் உள்ளது; ஆகவே முதன்மை உரை அதைத் தக்கவைக்கிறது. முன் வரும் குழுவை ஒட்டுமொத்தமாகக் குறிக்கும் பயன்பாடாக இதைப் புரிந்துகொள்ளும் வாய்ப்பு அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ஒருமை–கூட்டுப்பொருள் பதற்றம் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
