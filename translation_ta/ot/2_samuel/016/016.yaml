base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/016.yaml
  text: And when Hushai the Archite[a], David’s friend, came to Absalom, Hushai said to Absalom, “Long live the king! Long live the king!”
translation:
  language: ta
  text: தாவீதின் நண்பனான அர்க்கியனாகிய ஊசாய் அப்சலோமிடம் வந்தபோது, ஊசாய் அப்சலோமிடம், “அரசர் வாழ்க! அரசர் வாழ்க!”[a] என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசர் நீடூழி வாழட்டும்!” எபிரெய மொழியில் இது அரசரை வாழ்த்தி முழங்கும் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: வந்தபோது
  rationale: எபிரெயக் கதைத் தொடரின் அடுத்த நிகழ்வை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது; தனியே ‘அப்போது நிகழ்ந்ததாவது’ என்று மொழிபெயர்க்காமல் காலத் தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: בָּא
  choice: வந்த
  rationale: அப்சலோமிடம் ஊசாய் வந்து சேர்ந்ததைச் சூழலுக்கேற்ற பொதுவான இயக்க வினைச்சொல்லால் தெரிவிக்கிறது.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: அர்கியனாகிய ஊசாய்
  rationale: தனிப்பெயரைத் தமிழில் ஒலிபெயர்த்து, הָאַרְכִּי என்பதைக் குலம் அல்லது ஊர்சார்ந்த அடையாளமாகக் குறிக்கும் ‘அர்கியன்’ என வழங்குகிறது.
- source_word: רֵעֶה דָוִד
  choice: தாவீதின் நண்பனான
  rationale: ஊசாய்க்கும் தாவீதுக்கும் உள்ள தனிப்பட்ட மற்றும் அரசியல் உறவை எளிய, இயல்பான தமிழில் காக்கிறது.
- source_word: אֶל אַבְשָׁלוֹם
  choice: அப்சலோமிடம்
  rationale: வருகையிலும் உரையாடலிலும் ஒருவரை நோக்கிய திசை அல்லது அணுகுதலைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் אמר என்பதற்கான இயல்பான தமிழ் கதைநடை வடிவம்.
- source_word: יְחִי הַמֶּלֶךְ
  choice: அரசர் வாழ்க!
  rationale: அரசரை வாழ்த்தி முழங்கும் எபிரெய அரச மரியாதைக் கூற்றின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: יְחִי הַמֶּלֶךְ (repeated)
  choice: அரசர் வாழ்க!
  rationale: மூலத்தில் உள்ள மறுபடியும் கூறுதலை அப்படியே காத்து, பொதுமக்கள் முன் கூறப்படும் வலியுறுத்தலையும் ஊசாயின் விசுவாசத்தைச் சூழ்ந்துள்ள கதைநடை இரட்டைப் பொருளையும் நிலைநிறுத்துகிறது.
theological_decisions:
- issue: அப்சலோமிடம் ஊசாய் கூறிய அரச வாழ்த்தின் நோக்கத் தெளிவின்மை
  choice: எந்த விளக்கச் சேர்க்கையும் இன்றி வழக்கமான அரச வாழ்த்தாகவே மொழிபெயர்த்தல்
  alternative: இது கேலியாகவோ வஞ்சக நோக்கத்தோடோ கூறப்பட்டது என்பதை மொழிபெயர்ப்பிலேயே வெளிப்படுத்துதல்
  rationale: இவ்வசனத்தின் சொற்கள் வழக்கமான அரச வாழ்த்தாகவே உள்ளன. விரிவான சூழல் ஊசாயின் தந்திரமான, இரட்டைப் பொருள் கொண்ட விசுவாசத்தை வெளிப்படுத்தினாலும், மொழிபெயர்ப்பு அந்தக் கதைநடை அழுத்தத்தை முன்கூட்டியே தீர்த்துவிடக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அரசர் வாழ்க’ என்பது தமிழ் வாசகர்களுக்கு உடனடியாகப் புரியும் பொது அரச வாழ்த்து; மூலத்தின் மறுபடியும் கூறுதல் காக்கப்பட்டுள்ளது.
