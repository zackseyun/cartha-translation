  to: தாவீதின் நண்பனான அர்க்கியனாகிய ஊசாய் அப்சலோமிடம் வந்தபோது, ஊசாய் அப்சலோமிடம், “அரசர் வாழ்க! அரசர் வாழ்க!”[a] என்றான்.
