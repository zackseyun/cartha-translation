base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/003.yaml
  text: Then the king said[a], “And where is your master's son?” Ziba said to the king, “Look, he is staying in Jerusalem, for he said, ‘Today the house of Israel will restore to me the kingdom of my father.’”
translation:
  language: ta
  text: அப்போது அரசன், “உன் எஜமானின் மகன் எங்கே?” என்று கேட்டான். சீபா அரசனிடம், “இதோ, அவர் எருசலேமில் தங்கியிருக்கிறார்[a]. ஏனெனில், ‘இன்று இஸ்ரவேல் வம்சத்தார் என் தந்தையின் ராஜ்யத்தை எனக்குத் திரும்பக் கொடுப்பார்கள்’ என்று அவர் சொன்னார்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எருசலேமிலேயே இருக்கிறார்” என்றும் மொழிபெயர்க்கலாம். எபிரெயப் பங்கேற்புவினைச் சொல் நேரடியாக ‘உட்கார்ந்திருக்கிறார்’ என்றும் பொருள்படலாம்; இங்கு அது ஓரிடத்தில் தங்கியிருப்பதையோ தொடர்ந்து இருப்பதையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: அப்போது அரசன் ... கேட்டான்
  rationale: தொடர்நிகழ்வைக் குறிக்கும் எபிரெயக் கதை இணைப்பை ‘அப்போது’ இயல்பாக வெளிப்படுத்துகிறது; கேள்வி உரையை அறிமுகப்படுத்துவதால் தமிழில் ‘கேட்டான்’ என்பது பொருத்தமானது.
- source_word: וְאַיֵּה בֶּן אֲדֹנֶיךָ
  choice: உன் எஜமானின் மகன் எங்கே?
  rationale: இடத்தைக் கேட்கும் வினாவையும், சீபாவின் எஜமானைக் குறிக்கும் சமூக உறவையும் தெளிவாகப் பாதுகாக்கிறது. தொடக்க וְ தமிழில் தனியே ‘மேலும்’ என வழங்கப்படாமல் உரையாடலின் இயல்பான தொடர்ச்சியில் வெளிப்படுகிறது.
- source_word: צִיבָא
  choice: சீபா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட பெயரெழுத்தாக்கம்.
- source_word: הִנֵּה
  choice: இதோ
  rationale: பதில் உரைக்குக் கவனம் ஈர்க்கும் எபிரெயச் சுட்டிடைச்சொல்லின் உரையாடல் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יוֹשֵׁב בִּירוּשָׁלִַם
  choice: எருசலேமில் தங்கியிருக்கிறார்
  rationale: ישׁב என்பதன் பங்கேற்புவினை இங்கு உட்கார்ந்திருப்பதை மட்டும் அல்லாமல் ஓரிடத்தில் தங்கி அல்லது தொடர்ந்து இருப்பதைக் குறிக்கிறது.
- source_word: כִּי אָמַר
  choice: ஏனெனில், ... என்று அவர் சொன்னார்
  rationale: சீபா கூறும் காரணத்தை அறிமுகப்படுத்தும் כִּי என்பதையும், மேவிபோசேத்தின் பேச்சாக அவர் அறிக்கையிடுவதையும் தெளிவாகக் காட்டுகிறது.
- source_word: הַיּוֹם יָשִׁיבוּ לִי
  choice: இன்று ... எனக்குத் திரும்பக் கொடுப்பார்கள்
  rationale: שׁוב என்பதன் ஹிஃபில் வடிவம் ‘திரும்பச் செய்தல்/மீட்டுக் கொடுத்தல்’ என்ற பொருளுடையது; அரசாட்சியை ஒருவருக்குத் திரும்ப வழங்குவதை இச்சொற்றொடர் இயல்பாகச் சொல்கிறது.
- source_word: בֵּית יִשְׂרָאֵל
  choice: இஸ்ரவேல் வீட்டார்
  rationale: இஸ்ரவேலை ஒரு கூட்டு மக்களாகக் குறிக்கும் ‘இஸ்ரவேல் வீடு’ என்ற எபிரெய உருவகத்தை, தமிழில் புரியக்கூடிய கூட்டுப்பெயராகப் பாதுகாக்கிறது.
- source_word: אֵת מַמְלְכוּת אָבִי
  choice: என் தந்தையின் அரசாட்சியை
  rationale: ‘என் தந்தையின் அரசாட்சி’ என்ற மூலச் சொல் உறவைத் தக்கவைத்து, அரசாட்சி/ஆட்சியுரிமை சார்ந்த பொருளை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: மேவிபோசேத்தின் நோக்கத்தைப் பற்றி சீபா அறிக்கையிடும் கூற்று
  choice: சீபாவின் குற்றச்சாட்டை அதன் உண்மைத்தன்மையை உறுதிப்படுத்தாமலும் மறுக்காமலும் நேரடிப் பேச்சாக வழங்குதல்
  alternative: ‘அவன் கூறிக்கொண்டான்’ அல்லது ‘அவன் கூறியதாகச் சீபா குற்றஞ்சாட்டினான்’ போன்ற சந்தேகத்தை வெளிப்படையாகச் சேர்த்தல்
  rationale: எபிரெய உரை சீபா அரசனிடம் சொன்னதை மட்டும் பதிவு செய்கிறது. பின்னணிக் கதையின் அடிப்படையில் இவ்வசனத்திலேயே சந்தேகக் குறிப்பைச் சேர்ப்பது மூலத்தில் இல்லாத தீர்ப்பை இறக்குமதி செய்யும்.
translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசனின் கேள்விக்கும் சீபாவின் பதிலுக்கும் இயல்பான தமிழ் மேற்கோள் அமைப்பு வழங்கப்பட்டுள்ளது; மூலத்தின் குற்றச்சாட்டு எந்த விளக்கத் தீர்ப்புமின்றி பாதுகாக்கப்பட்டுள்ளது.
