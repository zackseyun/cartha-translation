  text: וַ/יֹּ֤אמֶר אֲחִיתֹ֨פֶל֙ אֶל אַבְשָׁלֹ֔ם בּ֚וֹא אֶל פִּלַגְשֵׁ֣י אָבִ֔י/ךָ אֲשֶׁ֥ר הִנִּ֖יחַ לִ/שְׁמ֣וֹר הַ/בָּ֑יִת וְ/שָׁמַ֤ע כָּל יִשְׂרָאֵל֙ כִּֽי נִבְאַ֣שְׁתָּ אֶת אָבִ֔י/ךָ וְ/חָ֣זְק֔וּ יְדֵ֖י כָּל אֲשֶׁ֥ר אִתָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/021.yaml
  text: Ahithophel said to Absalom[a], “Go in to your father’s concubines, whom he left to keep the house, and all Israel will hear that you have become odious to your father[c][b], and the hands of all who are with you will be strengthened.”
translation:
  language: ta
  text: அகித்தோப்பேல் அப்சலோமிடம், “அரண்மனையைக் காக்க உன் தந்தை விட்டுச் சென்ற தன் துணைமனைவிகளுடன் உறவுகொள்[a]. நீ உன் தந்தைக்கு அருவருப்பானவனாகிவிட்டாய்[b] என்பதை இஸ்ரயேலர் அனைவரும் கேள்விப்படுவார்கள்; அப்போது உன்னுடன் இருப்பவர்கள் அனைவரும் துணிவடைவார்கள்[c]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவர்களிடம் போ”; இது பாலுறவைக் குறிக்கும் வழக்கமான நயவுரை.
    reason: lexical_alternative
  - marker: b
    text: “அருவருப்பானவனாகிவிட்டாய்” என்பதற்கான எபிரெயச் சொல், சொல்லர்த்தமாக நாற்றமடைந்து வெறுப்புக்குரியவனாதல் என்ற படிமத்தைக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், “உன்னுடன் இருப்பவர்கள் அனைவருடைய கைகளும் பலப்படும்”; இது அவர்கள் ஊக்கமும் துணிவும் பெறுவார்கள் என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹא אֶל
  choice: உறவுகொள்
  rationale: இச்சூழலில் இது பாலுறவைக் குறிக்கும் எபிரெய நயவுரை. தமிழில் ‘உறவுகொள்’ கண்ணியமாகவும் போதிய தெளிவுடனும் பொருளைத் தெரிவிக்கிறது; அடிக்குறிப்பு பாலுறவுப் பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: פִּלַגְשֵׁי
  choice: மறுமனைவிகள்
  rationale: פילגשׁ என்பது பண்டைய குடும்ப அமைப்பில் அங்கீகரிக்கப்பட்டிருந்தாலும் முதன்மை மனைவியைவிடத் தாழ்ந்த நிலையுடைய பெண்களைக் குறிக்கிறது. நவீன பொதுத் தமிழில் ‘மறுமனைவிகள்’ வாசிக்க இயல்பாக இருப்பதுடன், ‘வைப்பாட்டிகள்’ என்பதிலுள்ள இழிவான நிழற்பொருளைத் தவிர்க்கிறது.
- source_word: הִנִּיחַ לִשְׁמוֹר הַבָּיִת
  choice: அரண்மனையைக் காக்க ... விட்டுச் சென்ற
  rationale: הַבָּיִת இங்கு தாவீதின் அரச இல்லத்தைக் குறிக்கிறது; ‘அரண்மனை’ சூழலை இயல்பாக வெளிப்படுத்துகிறது. שמר என்பதன் காக்கும் பொறுப்பும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: וְשָׁמַע כָּל יִשְׂרָאֵל
  choice: இஸ்ரயேலர் அனைவரும் கேள்விப்படுவார்கள்
  rationale: ‘இஸ்ரயேல் முழுவதும்’ என நிலப்பரப்பாகத் தவறாகப் புரிந்துகொள்ளாமல், மக்களைக் கூட்டாகக் குறிக்கும் பொருளைத் தமிழில் தெளிவாக்குகிறது.
- source_word: נִבְאַשְׁתָּ אֶת אָבִיךָ
  choice: நீ உன் தந்தைக்கு அருவருப்பானவனாகிவிட்டாய்
  rationale: נבאשׁ என்பதன் அடிப்படைப் படிமம் நாற்றமடைதல் அல்லது வெறுப்புக்குரியதாகுதல். இங்கு தந்தையுடனான பகை தீராததாகிவிட்ட சமூக-அரசியல் பொருளில் ‘அருவருப்பானவனாகிவிட்டாய்’ அதன் வலிமையைப் பாதுகாக்கிறது.
- source_word: וְחָזְקוּ יְדֵי
  choice: துணிவடைவார்கள்
  rationale: ‘கைகள் பலப்படும்’ என்பது உறுதியும் துணிவும் பெறுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர். நவீன தமிழில் பொருளை இயல்பாகத் தெரிவிக்க ‘துணிவடைவார்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது; மூலப் படிமம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כָּל אֲשֶׁר אִתָּךְ
  choice: உன்னுடன் இருப்பவர்கள் அனைவரும்
  rationale: மூலத்தின் உறவுசார் சொல்லாக்கத்தைப் பாதுகாக்கிறது; ‘ஆதரவாளர்கள்’ என்ற குறுகிய அரசியல் விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
theological_decisions:
- issue: அரசியல் நோக்கமுடைய பாலுறவுச் செயலைக் குறிக்கும் நயவுரை
  choice: ‘அவருடைய மறுமனைவிகளுடன் உறவுகொள்’ எனக் கண்ணியமாகவும் தெளிவாகவும் மொழிபெயர்த்தல்
  alternative: ‘அவருடைய மறுமனைவிகளிடம் போ’ அல்லது ‘அவர்களுடன் பாலுறவுகொள்’
  rationale: இச்செயல் தாவீதுடனான முறிவை பொதுவில் மாற்றமுடியாததாகக் காட்டும் அரசியல் ஆலோசனை. மூலத்தின் நயவுரையை முற்றிலும் மறைக்காமலும், தேவையின்றி வெளிப்படையாக அல்லது கொச்சையாக ஆக்காமலும் வழங்கப்படுகிறது.
- issue: נבאשׁ என்பதிலுள்ள கடுமையான வெறுப்பு/துர்நாற்றப் படிமம்
  choice: ‘உன் தந்தைக்கு அருவருப்பானவனாகிவிட்டாய்’
  alternative: ‘உன் தந்தைக்குப் பகைவனாகிவிட்டாய்’ அல்லது ‘உன் தந்தையின் பார்வையில் நாற்றமெடுத்துவிட்டாய்’
  rationale: ‘பகைவன்’ என்பது விளக்கத்தைச் சேர்த்து மூலப் படிமத்தைத் தட்டையாக்கும்; நேரடியான ‘நாற்றம்’ தமிழில் தேவையற்ற உடல்சார் பொருளை முன்னிறுத்தலாம். தேர்ந்தெடுத்த வாசகம் வெறுப்பின் வலிமையையும் உறவுமுறிவையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான வரலாற்று-கதைநடை பயன்படுத்தப்பட்டுள்ளது. பாலுறவுக் குறிப்பு கொச்சையாக்கப்படாமல் தெளிவாக்கப்பட்டுள்ளது. ‘அரண்மனை’ அரச இல்லச் சூழலை இயல்பாகக் காட்டுகிறது; ‘இஸ்ரயேலர் அனைவரும்’ என்பது மக்களைக் கூட்டாகக் குறிக்கிறது. மூல எபிரெயத்தின் முக்கிய படிமங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
