base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/008.yaml
  text: Yahweh has brought back upon you all the blood of the house of Saul[a], in whose place you reigned, and Yahweh has given the kingdom into the hand of Absalom your son. And look, you are in your calamity[c][b], because you are a man of bloodshed.
translation:
  language: ta
  text: யாவே சவுலின் வீட்டாரின் இரத்தச்சிந்துதல் அனைத்தையும் உன்மேல் திரும்பிவரச் செய்திருக்கிறார்[a]. அவருக்குப் பதிலாக நீ அரசாண்டாய். யாவே அரசாட்சியை உன் மகன் அப்சலோமின் கையில் கொடுத்திருக்கிறார். இதோ, நீ இப்போது பேரழிவில் இருக்கிறாய்[b]; ஏனெனில், நீ இரத்தம் சிந்தியவன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்கு சொல்: ‘சவுலின் வீட்டாரின் எல்லா இரத்தங்களையும்.’ இதை ‘சவுலின் குடும்பத்தின் இரத்தப்பழி அனைத்தையும்’ என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நீ உன் தீமையில் இருக்கிறாய்.’ எபிரெயச் சொல் ஒழுக்கத் தீமையையோ ஒருவருக்கு நேரும் கேடு அல்லது பேரழிவையோ குறிக்கலாம்; இங்கு தாவீதுக்கு நேர்ந்த பேரழிவைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: c
    text: 'எபிரெயத்தில் சொல்லுக்கு சொல்: ‘இரத்தங்களின் மனிதன்.’ இது இரத்தப்பழி அல்லது வன்முறையால் குறிக்கப்படும் ஒருவனைக் கூறும் மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב עָלֶיךָ
  choice: உன்மேல் திரும்பிவரச் செய்திருக்கிறார்
  rationale: שוב என்பதன் ஹிஃபில் வடிவிலுள்ள ‘திரும்பிவரச் செய்’ என்ற காரணவினைப் பொருளையும், על மூலம் குறிக்கப்படும் ‘உன்மேல்’ என்ற நீதித்தீர்ப்பு சார்ந்த படிமத்தையும் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כָּל דְּמֵי בֵית שָׁאוּל
  choice: சவுலின் குடும்பத்தாருடைய இரத்தப்பழி அனைத்தையும்
  rationale: எபிரெயத்தில் உள்ள பன்மை ‘இரத்தங்கள்’ இச்சூழலில் கொலைகளால் ஏற்பட்ட இரத்தப்பழி அல்லது இரத்தச்சிந்துதலைக் குறிக்கிறது; ‘இரத்தப்பழி’ குற்றச்சாட்டின் நீதிசார் வலிமையைத் தெளிவாக்குகிறது.
- source_word: אֲשֶׁר מָלַכְתָּ תַּחְתָּיו
  choice: சவுலுக்குப் பதிலாக நீ அரசாண்டாய்
  rationale: תחתיו இங்கு ‘அவனுக்குப் பதிலாக/அவனுடைய இடத்தில்’ என்ற அரச வாரிசுரிமைப் பொருளைக் கொண்டுள்ளது; முன்னிடைச் சொல்லின் தொடர்பைத் தெளிவாக்க ‘சவுல்’ மீண்டும் குறிப்பிடப்படுகிறது.
- source_word: וַיִּתֵּן ... אֶת־הַמְּלוּכָה בְּיַד
  choice: அரசாட்சியை ... கையில் கொடுத்திருக்கிறார்
  rationale: ஆட்சி அல்லது கட்டுப்பாட்டை ஒருவரிடம் ஒப்படைப்பதைக் குறிக்கும் எபிரெய மொழிமரபின் ‘கையில் கொடுத்தல்’ என்ற படிமத்தைப் பாதுகாக்கிறது.
- source_word: וְהִנְּךָ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் הִנֵּה என்ற உரையாடல் இடைச்சொல்லை இயல்பான, கண்ணியமான நவீன தமிழில் தருகிறது.
- source_word: בְּרָעָתֶךָ
  choice: உன் பேரழிவில் சிக்கியிருக்கிறாய்
  rationale: רָעָה என்பது ஒழுக்கத் தீமையையோ நேர்ந்த கேடு/பேரழிவையோ குறிக்கலாம். அப்சலோமின் கிளர்ச்சியால் தாவீதுக்கு நேர்ந்துள்ள கேட்டை இங்கு முன்னிறுத்துகிறது; ‘சிக்கியிருக்கிறாய்’ என்பது ‘அதில் இருக்கிறாய்’ என்ற எபிரெய அமைப்பை இயல்பான தமிழாக்குகிறது.
- source_word: אִישׁ דָּמִים
  choice: இரத்தம் சிந்திய மனிதன்
  rationale: ‘இரத்தங்களின் மனிதன்’ என்ற சொற்படிமத்தை அப்படியே செயற்கையாகத் தராமல், வன்முறை அல்லது இரத்தப்பழியால் குறிக்கப்படுபவன் என்ற குற்றச்சாட்டைத் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் நேரடியாக வரும் தனிப்பெயரை ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது. தமிழில் ‘யெகோவா’ பரவலாக அறியப்பட்ட வடிவம்; உச்சரிப்பைப் பிரதிபலிக்கும் ‘யாவே’ என்பதும் சாத்தியம்.
- issue: בְּרָעָתֶךָ என்பதன் பொருள்
  choice: உன் பேரழிவில்
  alternative: உன் தீமையில்
  rationale: சிமெயி தாவீதின் தற்போதைய துன்பத்தைத் தெய்வீகப் பதிலடியாகச் சுட்டுகிறான். இது சிமெயியின் குற்றச்சாட்டு என்பதை மொழிபெயர்ப்பு காக்கிறது; அவனுடைய மதிப்பீட்டை கதைசொல்லியின் தீர்ப்பாக உறுதிப்படுத்துவதில்லை.
- issue: כָּל דְּמֵי בֵית שָׁאוּל என்பதிலுள்ள குற்றச்சாட்டு
  choice: சவுலின் குடும்பத்தாருடைய இரத்தப்பழி அனைத்தையும்
  alternative: சவுலின் குடும்பத்தாருடைய இரத்தச்சிந்துதல் அனைத்தையும்
  rationale: ‘இரத்தப்பழி’ என்பது தாவீதின்மேல் சுமத்தப்படும் பொறுப்பை வெளிப்படுத்துகிறது; ஆனால் இவ்வசனம் சிமெயியின் பேச்சாக இருப்பதால் அந்தக் குற்றச்சாட்டை வரலாற்று உண்மை என மொழிபெயர்ப்பாளர் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமும் குற்றச்சாட்டின் தீவிரமும் காக்கப்பட்டுள்ளன. மிகப் பழமையான நடை தவிர்க்கப்பட்டுள்ளது. ‘இதோ’ உரையாடலின் திடீர் கவன ஈர்ப்பைத் தருகிறது; சொற்பொருள் தெளிவிற்காக நீண்ட எபிரெய வாக்கியம் இயல்பான தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
