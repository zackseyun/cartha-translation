base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/005.yaml
  text: When King David came to Bahurim[a], behold, a man came out from there, from the clan of the house of Saul, whose name was Shimei son of Gera; he came out continually, cursing as he came.
translation:
  language: ta
  text: தாவீது அரசர் பகூரீமுக்கு வந்தபோது, இதோ, சவுலின் வம்சத்தைச் சேர்ந்த ஒரு குலத்திலிருந்து ஒருவன் அங்கிருந்து வெளியே வந்தான். அவனுடைய பெயர் கேராவின் மகன் சிமெயி. அவன் சபித்துக்கொண்டே தொடர்ந்து வெளியே வந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவன் வெளியே வந்துகொண்டே சபித்தான்.’ ‘வெளியே வந்தான்’ என்ற வினையை எபிரெய மொழி வலியுறுத்துகிறது; இது மீண்டும் மீண்டும் நிகழ்ந்த அல்லது நீடித்த செயலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַמֶּלֶךְ דָּוִד
  choice: தாவீது அரசர் ... வந்தபோது
  rationale: வாவ் + நிறைவுவினை கதையை முன்னெடுக்கிறது; அடுத்து நிகழும் காட்சிக்கான காலப் பின்னணியை இயல்பான தமிழில் ‘வந்தபோது’ தெரிவிக்கிறது. பட்டமும் பெயரும் தக்கவைக்கப்பட்டுள்ளன.
- source_word: עַד בַּחוּרִים
  choice: பகூரீமுக்கு
  rationale: עַד இங்கு ஓர் இடத்தைச் சென்றடைதலைக் குறிக்கிறது; தமிழில் இலக்கை இயல்பாகக் காட்ட நான்காம் வேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீரெனக் கவனத்திற்குக் கொண்டுவரப்படும் புதிய நிகழ்வின் உயிரோட்டமான சுட்டுத்தன்மையைப் பாதுகாக்கிறது.
- source_word: מִשָּׁם אִישׁ יוֹצֵא
  choice: ஒருவன் அங்கிருந்து வெளியே வந்தான்
  rationale: பங்கேற்புவினை காட்சியில் நடைபெறும் செயலைக் காட்டுகிறது; தமிழில் இயல்பான கதைநடைக்காக இறந்தகால வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִמִּשְׁפַּחַת בֵּית שָׁאוּל
  choice: சவுலின் வீட்டைச் சேர்ந்த குலத்திலிருந்து
  rationale: מִשְׁפָּחָה என்பதன் உறவினக் குலப் பொருளையும் בֵּית שָׁאוּל என்பதன் குடும்ப/அரசவம்ச அடையாளத்தையும் ‘வீடு’ மற்றும் ‘குலம்’ என்ற சொற்களால் தக்கவைக்கிறது.
- source_word: וּשְׁמוֹ שִׁמְעִי בֶן גֵּרָא
  choice: அவன் பெயர் கேராவின் மகன் சிமெயி
  rationale: எபிரெய அடையாளப்படுத்தும் சூத்திரத்தின் முழுப் பொருளையும் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: יֹצֵא יָצוֹא
  choice: தொடர்ந்து வெளியே வந்தான்
  rationale: பங்கேற்புவினை + வினையெச்ச வலியுறுத்தல் அமைப்பு செயல் நீடித்ததையோ மீண்டும் நிகழ்ந்ததையோ காட்டுகிறது; அந்தத் திறந்த நுணுக்கத்தை ‘தொடர்ந்து’ தக்கவைக்கிறது.
- source_word: וּמְקַלֵּל
  choice: சபித்துக்கொண்டே
  rationale: வெளியே வரும் செயலோடு ஒரே நேரத்தில் நீடித்த சபித்தலைத் தமிழின் தொடர்நிலை வினையமைப்பு இயல்பாகக் காட்டுகிறது.
