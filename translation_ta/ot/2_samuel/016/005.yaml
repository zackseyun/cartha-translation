- from: தாவீது அரசர் பகூரீமுக்கு வந்தபோது, இதோ, சவுலின் வீட்டைச் சேர்ந்த குலத்திலிருந்து ஒருவன் அங்கிருந்து வெளியே வந்தான். அவன் பெயர் கேராவின் மகன் சிமெயி. அவன் சபித்துக்கொண்டே தொடர்ந்து வெளியே வந்தான்.[a]
