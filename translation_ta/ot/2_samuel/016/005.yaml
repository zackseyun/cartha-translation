  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ மூலத்தின் காட்சியுணர்வையும், ‘வீடு/குலம்’ சவுலோடு உள்ள வம்ச உறவையும், ‘தொடர்ந்து’ எபிரெய வினை வலியுறுத்தலின் நீடித்த அல்லது மீள்நிகழும் தன்மையையும் பாதுகாக்கின்றன.
