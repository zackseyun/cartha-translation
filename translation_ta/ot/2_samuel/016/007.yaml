reference: 2 Samuel 16:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/כֹֽה אָמַ֥ר שִׁמְעִ֖י בְּ/קַֽלְל֑/וֹ צֵ֥א צֵ֛א אִ֥ישׁ הַ/דָּמִ֖ים וְ/אִ֥ישׁ הַ/בְּלִיָּֽעַל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/007.yaml
  text: And Shimei said as he cursed him[a], “Get out, get out[b], man of bloodshed and worthless man!”
translation:
  language: ta
  text: 'சிமெயி அவனைச் சபித்தபோது இவ்வாறு சொன்னான்: “போய்விடு! போய்விடு! இரத்தப்பழி சுமந்தவனே,[a] இழிந்தவனே!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரத்தஞ்சிந்தியவனே” / “இரத்த மனிதனே.” எபிரெய மொழியில் சொல்லுக்கு சொல் “இரத்தங்களின் மனிதன்”; இது இரத்தப்பழி அல்லது இரத்தஞ்சிந்துதலைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பொல்லாதவனே.” எபிரெய மொழியில் இது சொல்லுக்கு சொல் “பெலியாலின் மனிதன்” என்றிருந்தாலும், இங்கே ‘பெலியால்’ என்பது தனிப்பெயராக இருக்க வேண்டியதில்லை; மதிப்பற்ற அல்லது இழிந்த ஒருவனைக் குறிக்கும் மரபுத்தொடர்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כֹה אָמַר
  choice: இவ்வாறு சொன்னான்
  rationale: כֹה அறிமுகப்படுத்தும் அடுத்துவரும் நேரடிக் கூற்றை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: שִׁמְעִי
  choice: சிமெயி
  rationale: எபிரெயத் தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: בְּ/קַֽלְל/וֹ
  choice: அவனைச் சபித்தபோது
  rationale: முன்னிடைச்சொல்லுடன் கூடிய வினையெச்ச வடிவம் ஒரே நேரத்தில் நிகழும் செயலைக் குறிக்கிறது; மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டு தாவீதைக் குறிக்கும் ‘அவனை’ எனத் தரப்பட்டுள்ளது.
- source_word: צֵא צֵא
  choice: போய்விடு! போய்விடு!
  rationale: இருமுறை கூறப்பட்ட கட்டளை விரட்டுதல் மற்றும் கடுமையான நிராகரிப்பை வலுப்படுத்துகிறது; நவீன தமிழில் ‘போய்விடு’ அந்தத் தாக்கத்தை இயல்பாகத் தருகிறது.
- source_word: אִישׁ הַ/דָּמִים
  choice: இரத்தப்பழி சுமந்தவனே
  rationale: ‘இரத்தங்கள்’ என்ற எபிரெய மரபுத்தொடர் கொலை அல்லது இரத்தஞ்சிந்துதலால் உண்டான குற்றப்பழியைக் குறிக்கிறது. ‘இரத்தவெறியனே’ என்பது நோக்கத்தை மிகையாகக் கூறக்கூடும்.
- source_word: וְ/אִישׁ הַ/בְּלִיָּעַל
  choice: இழிந்தவனே
  rationale: இங்கு בְּלִיַּעַל என்பது தனிப்பெயராக அல்லாமல் ஒழுக்க ரீதியில் மதிப்பற்ற, கீழ்மையான ஒருவனை இகழும் மரபுத்தொடராக வருகிறது; தமிழில் சுருக்கமான நேரடி அழைப்பாகத் தரப்பட்டுள்ளது.
theological_decisions:
- issue: בְּלִיַּעַל என்பதன் பொருள்
  choice: 'தனிப்பெயரல்லாத இகழ்ச்சிச் சொல்: ‘இழிந்தவனே’'
  alternative: ‘பொல்லாதவனே’ அல்லது ‘பெலியாலின் மனிதனே’
  rationale: பழைய ஏற்பாட்டின் இச்சூழலில் இச்சொல் ஒழுக்கச் சீர்கேட்டையும் கீழ்மையையும் குறிக்கும் பொதுப்பெயர்சார் இகழ்ச்சியாக உள்ளது. ‘பெலியால்’ என்ற தனிப்பெயராக மொழிபெயர்ப்பது பிற்கால உருவகப்படுத்தப்பட்ட தீய ஆவிக்குரிய தொடர்பை தேவையின்றி இங்கு கொண்டுவரும்.
translation_notes:
  register: நவீன தரமான தமிழில், நேரடியான ஆனால் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. சிமெயியின் கடுமையான விரட்டுதலைக் காட்ட கட்டளைகள் தனித்தனி வியப்புக்குறிகளுடன் தரப்பட்டுள்ளன. இரண்டு எபிரெய ‘மனிதன்’ அமைப்புகளையும் தமிழில் மீண்டும் கூறுவது செயற்கையாக இருப்பதால், நேரடி அழைப்புகளாக ‘சுமந்தவனே, இழிந்தவனே’ என இயல்பாக்கப்பட்டுள்ளது; பொருளின் இணை அமைப்பு தக்கவைக்கப்பட்டுள்ளது.
