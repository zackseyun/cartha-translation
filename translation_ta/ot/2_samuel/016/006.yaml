base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/006.yaml
  text: And he threw stones at David and at all the servants of King David[a], while all the people and all the mighty men were at his right hand and at his left.
translation:
  language: ta
  text: அவன் தாவீதின் மீதும் அரசர் தாவீதின் பணியாளர்கள் அனைவரின் மீதும் கற்களை எறிந்தான்; அனைத்து மக்களும் வலிமைமிக்க வீரர்கள் அனைவரும் தாவீதின் வலப்பக்கத்திலும் இடப்பக்கத்திலும் இருந்தனர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தை, “அவன் தாவீதையும் அரசர் தாவீதின் பணியாளர்கள் அனைவரையும் கல்லெறிந்தான்” என்றும் மொழிபெயர்க்கலாம். ஆனால் இங்கு முறையான கல்லெறித் தண்டனை அல்ல; அவர்கள்மீது பகைமையுடன் கற்களை எறிந்ததே சூழல் காட்டும் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: கற்களை எறிந்தான்
  rationale: பியேல் வினைச்சொல் கற்களால் தாக்குவதையோ ஒருவர்மீது கற்களை எறிவதையோ குறிக்கிறது. இச்சூழலில் முறையான கல்லெறித் தண்டனை அல்ல, சீமேயி பகைமையுடன் தொடர்ந்து கற்களை வீசுவதே கருத்து; ஆகவே இயல்பான தமிழில் செயலைத் தெளிவாகக் கூறுகிறது.
- source_word: עַבְדֵי
  choice: பணியாளர்கள்
  rationale: அரசரின் சேவையில் இருப்பவர்களை விரிவாகக் குறிக்கிறது. ‘அடிமைகள்’ என்பது இங்கு உறுதிப்படுத்தப்படாத சட்டநிலையைச் சேர்க்கும்; ‘அதிகாரிகள்’ என்பது பொருளை அளவுக்கு மீறிக் குறுக்கும்.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: தாவீது அரசர்
  rationale: அரச பட்டத்தையும் தனிப்பெயரையும் இயல்பான நவீனத் தமிழில் இணைக்கிறது.
- source_word: כָּל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: தாவீதுடன் சென்றிருந்த மொத்தக் கூட்டத்தையும் குறிக்கும் பரந்த பொருளைத் தக்கவைக்கிறது; அவர்களைப் படைவீரர்கள் என்று மட்டும் வரையறுப்பதில்லை.
- source_word: הַגִּבֹּרִים
  choice: வலிமைமிக்க வீரர்கள்
  rationale: இச்சொல்லின் வலிமை, வீரம் ஆகிய அம்சங்களையும், சூழலிலுள்ள இராணுவப் பொருளையும் தெரிவிக்கிறது; தாவீதின் சிறப்பு வீரர்களைக் குறிக்கும் சாத்தியத்தையும் திறந்துவைக்கிறது.
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: தாவீதின் வலப்பக்கத்திலும் இடப்பக்கத்திலும்
  rationale: எபிரெயச் சொல்லில் ஆண்பால் ஒருமைச் சுட்டுப்பெயர் மட்டுமே உள்ளது. சூழலில் அது தாவீதைக் குறிப்பதே இயல்பானது; தமிழில் குழப்பத்தைத் தவிர்க்க அவரது பெயர் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
