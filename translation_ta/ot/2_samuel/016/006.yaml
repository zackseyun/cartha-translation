translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கற்களை எறிந்தான்’ என்பது செயலைத் தெளிவுபடுத்துகிறது; ‘வலிமைமிக்க வீரர்கள்’ என்பது גִּבֹּרִים என்பதன் இராணுவ மற்றும் வீரத் தொனியைத் தக்கவைக்கிறது. மூலத்தின் கடைசி வாக்கியப்பகுதியிலுள்ள சுட்டுப்பெயரின் நோக்கம் தமிழில் தெளிவாக இருக்க ‘தாவீதின்’ என வெளிப்படுத்தப்பட்டுள்ளது.
