translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் மூன்று முறை வரும் ‘முன்னிலையில்’ என்ற அரசவைச் சொல்லாட்சி இயன்றவரை பாதுகாக்கப்பட்டுள்ளது; அதன் பண்பாட்டு பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
