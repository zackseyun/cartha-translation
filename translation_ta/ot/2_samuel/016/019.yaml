base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/019.yaml
  text: And secondly[a], whom should I serve? Should it not be before his son? As I served before your father, so I will be before you.
translation:
  language: ta
  text: இரண்டாவதாக, நான் யாருக்குப் பணிசெய்ய வேண்டும்? அவருடைய மகனின் முன்னிலையில் அல்லவா? உங்கள் தந்தையின் முன்னிலையில் நான் பணிசெய்ததுபோல, அவ்வாறே உங்கள் முன்னிலையில் இருப்பேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவருடைய மகனின் முன்னிலையில் … உங்கள் தந்தையின் முன்னிலையில் … உங்கள் முன்னிலையில்” என்பது எபிரெய அரசவை வழக்கு; அரசரின் முன்னிலையில் இருந்து அவருக்குச் சேவை செய்வதையோ அவருடைய ஆட்சியின் கீழ் பணியாற்றுவதையோ குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַשֵּׁנִית
  choice: மேலும், இரண்டாவதாக
  rationale: உசாய் தன் இரண்டாவது வாதத்தை அறிமுகப்படுத்தும் உரையாடல் குறியீடாக இருப்பதால், நவீன தமிழில் இயல்பாகவும் வரிசையைத் தெளிவாகவும் காட்டுகிறது.
- source_word: לְמִי אֲנִי אֶעֱבֹד
  choice: நான் யாருக்குப் பணிசெய்ய வேண்டும்?
  rationale: அரசருக்கான விசுவாசப் பணியைச் சூழல் குறிக்கிறது; எதிர்பார்க்கப்படும் கடமையை வினாவும் சொல்லாற்றலை ‘வேண்டும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הֲלוֹא לִפְנֵי בְנוֹ
  choice: அவருடைய மகனின் முன்னிலையில் அல்லவா?
  rationale: הֲלוֹא எதிர்பார்க்கப்படும் உடன்பாட்டு விடையை உணர்த்துகிறது; לִפְנֵי என்பதையும் விடாமல், அரசவையில் ஒருவரின் முன்னிலையில் இருந்து பணியாற்றும் படிமத்தைப் பாதுகாக்கிறது.
- source_word: כַּאֲשֶׁר עָבַדְתִּי לִפְנֵי אָבִיךָ
  choice: உங்கள் தந்தையின் முன்னிலையில் நான் பணிசெய்ததுபோல
  rationale: עבד என்பதன் அரசியல்-அரசவைப் பணிப் பொருளையும், לִפְנֵי என்பதன் ‘முன்னிலையில்’ என்ற தொடர்ச்சியான சொல்லாட்சியையும் காக்கிறது.
- source_word: כֵּן אֶהְיֶה לְפָנֶיךָ
  choice: உங்கள் முன்னிலையிலும் இருப்பேன்
  rationale: எபிரெயம் இங்கு עבד என்பதை மீண்டும் கூறாமல் היה (‘இருப்பேன்’) என மாற்றுவதால், அந்த மாற்றத்தையும் இணை அமைப்பையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
