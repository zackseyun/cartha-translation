  text: Then Absalom said to Ahithophel, “Give your advice. What should we do?”
translation:
  language: ta
  text: பின்பு அப்சலோம் அகித்தோப்பேலிடம், “உங்கள் ஆலோசனையைச் சொல்லுங்கள். நாம் என்ன செய்ய வேண்டும்?” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵצָה
  choice: ஆலோசனை
  rationale: ‘அறிவுரை/திட்டம்/ஆலோசனை’ என்ற பொருள் வரம்பில், அரசியல் நடவடிக்கை குறித்து கேட்கப்படும் கருத்தை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: הָבוּ לָכֶם
  choice: உங்கள் … சொல்லுங்கள்
  rationale: எபிரேயத்தில் பன்மை வடிவங்கள் உள்ளன; ‘உங்கள்’ மற்றும் மரியாதை/பன்மை வினை வடிவம் தமிழிலும் ஒருமை மரியாதையாகவோ உண்மைப் பன்மையாகவோ புரியக்கூடியதால் மூலத்தின் எண்ணிக்கைத் தெளிவின்மையை இயல்பாகத் தக்கவைக்கிறது.
- source_word: מַה נַּעֲשֶׂה
  choice: நாம் என்ன செய்ய வேண்டும்?
  rationale: முதல் நபர் பன்மை எண்ணத்தையும், அடுத்த நடவடிக்கை குறித்த ஆலோசனை வேண்டுதலையும் தெளிவான நவீனத் தமிழில் வழங்குகிறது.
