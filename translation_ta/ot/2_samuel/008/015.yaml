revisions:
- from: தாவீது இஸ்ரவேல் முழுவதையும் அரசாண்டார். அவர் தம் மக்கள் அனைவருக்கும் நீதி மற்றும் நேர்மையை நிலைநாட்டிவந்தார்.[a]
  to: தாவீது இஸ்ரவேல் முழுவதையும் அரசாண்டார்; அவர் தம் மக்கள் அனைவருக்கும் நீதியையும் நேர்மையையும் நடைமுறைப்படுத்திவந்தார்.[a]
  rationale: The revision removes the additional idea of establishing justice and righteousness, while preserving the Hebrew’s summary of David’s reign, its ongoing aspect, the comprehensive reference to all his people, and the distinct paired concepts of justice and righteousness. The footnote is retained with a minor wording adjustment for idiomatic Tamil.
