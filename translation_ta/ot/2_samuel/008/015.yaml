source:
  edition: WLC
  text: וַ/יִּמְלֹ֥ךְ דָּוִ֖ד עַל כָּל יִשְׂרָאֵ֑ל וַ/יְהִ֣י דָוִ֗ד עֹשֶׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה לְ/כָל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/015.yaml
  text: So David reigned over all Israel[a], and David was administering justice and righteousness to all his people.
translation:
  language: ta
  text: தாவீது இஸ்ரவேல் முழுவதையும் அரசாண்டார்; அவர் தம் மக்கள் அனைவருக்கும் நீதியையும் நேர்மையையும் நடைமுறைப்படுத்திவந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தம் மக்கள் அனைவருக்கும் நீதியானதையும் சரியானதையும் செய்துவந்தார்.” “நீதி மற்றும் நேர்மை” என்ற எபிரெயச் சொல் இணை, இலட்சிய அரசாட்சியை விவரிக்கும் வழக்கமான சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டார்
  rationale: מלך இங்கு அரியணை ஏறிய நிகழ்வை மட்டும் அல்லாமல், தாவீது அரசராக ஆட்சி செய்ததைச் சுருக்கமாகக் குறிக்கிறது.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதையும்
  rationale: עַל என்பது ஆட்சிக்குட்பட்ட மக்களையும் நாட்டையும் குறிக்கிறது; כָּל என்பதன் முழுமையான பரப்பை இச்சொற்றொடர் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: וַיְהִי ... עֹשֶׂה
  choice: நிலைநாட்டிவந்தார்
  rationale: וַיְהִי உடன் வரும் பங்கேற்புவினை, தொடர்ந்து வழக்கமாக நடைபெற்ற செயலைக் காட்டுகிறது; ‘-வந்தார்’ அந்த நீடித்த தன்மையைத் தெரிவிக்கிறது.
- source_word: מִשְׁפָּט
  choice: நீதி
  rationale: அரசாட்சி சூழலில் מִשְׁפָּט என்பது தனிப்பட்ட தீர்ப்பை மட்டுமல்லாமல் நீதியான ஆட்சிநிர்வாகத்தைக் குறிக்கிறது.
- source_word: וּצְדָקָה
  choice: நேர்மை
  rationale: צְדָקָה இங்கு சரியானதும் ஒழுக்கநெறிக்கேற்றதுமான நடத்தையைக் குறிக்கிறது; ‘நேர்மை’ என்பது ‘நீதி’ என்பதிலிருந்து அதன் தனித்த பொருளைத் தெளிவாக வைத்திருக்கிறது.
- source_word: לְכָל עַמּוֹ
  choice: தம் மக்கள் அனைவருக்கும்
  rationale: לְ பயனடைவோரையும் ஆட்சிச் செயல் எவரை நோக்கியது என்பதையும் குறிக்கிறது; עַמּוֹவின் மூன்றாம் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டை மரியாதை ஒருமைக்கேற்ற ‘தம்’ இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: מִשְׁפָּט וּצְדָקָה என்ற அரசாட்சி சார்ந்த இணைச்சொல்லின் மொழிபெயர்ப்பு
  choice: நீதி மற்றும் நேர்மை
  alternative: நீதியும் நியாயமும் / நீதியும் நீதிநெறியும்
  rationale: இரண்டு எபிரெயச் சொற்களையும் ஒரே கருத்தாகக் கரைக்காமல், ஒன்று நியாயமான ஆட்சிநிர்வாகத்தையும் மற்றொன்று ஒழுக்க ரீதியான சரியான நடத்தையையும் சுட்டுவதை இத்தேர்வு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வரலாற்று நடையைப் பயன்படுத்தியுள்ளது. எபிரெயத்தின் தொடர்ச்சியான செயல்நிலையை ‘நிலைநாட்டிவந்தார்’ என்றும், அரசாட்சிக்குரிய இரு நெறிக் கருத்துகளின் வேறுபாட்டை ‘நீதி மற்றும் நேர்மை’ என்றும் வெளிப்படுத்தியுள்ளது.
