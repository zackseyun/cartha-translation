base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/013.yaml
  text: And David made a name for himself when he returned from striking down Aram in the Valley of Salt—eighteen thousand men[a].
translation:
  language: ta
  text: உப்புப் பள்ளத்தாக்கில் அராமைச் சேர்ந்த பதினெட்டாயிரம் பேரை வீழ்த்திவிட்டுத் திரும்பி வந்தபோது, தாவீது தனக்கெனப் புகழ் பெற்றான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில உரைச்சான்றுகளும் 1 நாளாகமம் 18:12-இல் உள்ள இணைப்பகுதியும் ‘அராம்’ என்பதற்குப் பதிலாக ‘ஏதோம்’ என்று வாசிப்பதை ஆதரிக்கின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעַשׂ ... שֵׁם
  choice: தனக்கெனப் புகழ் பெற்றான்
  rationale: ‘ஒரு பெயரை உண்டாக்கினான்’ என்ற எபிரேய மரபுத்தொடர் புகழையும் நற்பெயரையும் பெறுவதைக் குறிக்கிறது. அதன் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּשֻׁבוֹ
  choice: திரும்பி வந்தபோது
  rationale: முன்னிடைச்சொல்லுடன் வந்த வினையெச்சப் பெயர் அமைப்பு காலத்தைக் குறிக்கிறது; இந்தத் தமிழாக்கம் கதைநடையைத் தெளிவாக வைத்திருக்கிறது.
- source_word: מֵהַכּוֹתוֹ
  choice: வீழ்த்தி
  rationale: נכה என்பதன் போர்ச் சூழலிலான தாக்கி முறியடிக்கும் பொருளைச் சுருக்கமாகத் தருகிறது; கொல்லப்பட்டதாக அவசியமின்றி முடிவுசெய்யவில்லை.
- source_word: אֶת אֲרָם
  choice: அராமைச் சேர்ந்த
  rationale: மசோரா எபிரேய உரையின் ‘அராம்’ என்ற வாசகத்தை முதன்மை உரையில் பின்பற்றுகிறது. எண்ணிக்கை மக்களைக் குறிப்பதால் தமிழில் ‘அராமைச் சேர்ந்த ... பேர்’ என்று இயல்பாக்கப்பட்டுள்ளது.
- source_word: בְּגֵיא מֶלַח
  choice: உப்புப் பள்ளத்தாக்கில்
  rationale: இடப்பெயரின் கூறுகளை நேரடியாகவும் புரியத்தக்க வகையிலும் மொழிபெயர்க்கிறது.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: பதினெட்டாயிரம் பேர்
  rationale: எபிரேயத்தில் எண்ணிக்கை மட்டும் உள்ளது; போர்ச் சூழலில் குறிக்கப்படும் மனிதர்களைத் தமிழில் தெளிவாக்க ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: வீழ்த்தப்பட்ட எதிரியின் அடையாளம்
  choice: முதன்மை உரையில் ‘அராம்’; அடிக்குறிப்பில் ‘ஏதோம்’ என்ற மாற்று வாசகம்
  alternative: முதன்மை உரையில் ‘ஏதோம்’
  rationale: WLC மசோரா உரை ‘அராம்’ என்று வாசிக்கிறது. ஆனால் சில உரைச்சான்றுகளும் 1 நாளாகமம் 18:12 இணைப்பகுதியும் ‘ஏதோம்’ என்பதை ஆதரிக்கின்றன. மூல உரைக்கு முன்னுரிமை அளித்தபடியே குறிப்பிடத்தக்க உரை வேறுபாடு வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான கதைநடை. எபிரேய மரபுத்தொடர் சொல்லுக்குச் சொல் அல்லாமல் அதன் புகழ் பெறுதல் என்ற பொருளுடன் தரப்பட்டுள்ளது; உரை வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
