base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/016.yaml
  text: And Joab son of Zeruiah was over the army[b][a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: ta
  text: செருயாவின் மகன் யோவாப் படைக்குப் பொறுப்பாக இருந்தான்[a]; அகிலூதின் மகன் யோசபாத் அரச பதிவாளராக இருந்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “படைக்குத் தலைமை தாங்கினான்.”
    reason: lexical_alternative
  - marker: b
    text: “அரச பதிவாளர்” என்பது அரச ஆவணங்களைப் பேணுவதோடு, விவகாரங்களை அரசரிடம் அறிக்கையிடும் பொறுப்பும் கொண்ட ஓர் அரண்மனை அதிகாரியைக் குறிக்கிறது; “அரசச் செயலாளர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: படைக்குப் பொறுப்பாக இருந்தான்
  rationale: அலுவல் பொறுப்புகளைப் பட்டியலிடும் இச்சூழலில் עַל என்பது அதிகாரத்தையும் மேற்பார்வையையும் குறிக்கிறது. இந்தத் தமிழ் சொற்றொடர் எபிரெயச் சொல்லமைப்பின் நிர்வாகப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַזְכִּיר
  choice: அரச பதிவாளர்
  rationale: இச்சொல் அரசருக்காக விவகாரங்களைப் பதிவு செய்து அறிவிக்கும் அரண்மனை அதிகாரியைக் குறிக்கிறது. தனிப்பட்ட நினைவூட்டுபவர் அல்லது வரலாற்று நூலாசிரியர் என்ற தவறான எண்ணத்தைத் தவிர்க்க, பணியின் அரசச் சூழலைத் தெளிவுபடுத்தும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן
  choice: மகன்
  rationale: ஒருவரை அவரது தந்தை அல்லது தாயின் பெயரால் அடையாளப்படுத்தும் மரபுவழிச் சொற்றொடரில் בֶּן என்பதன் நேரான பொருள் இதுவே.
- source_word: וְ / וִ
  choice: ;
  rationale: எபிரெயத்தில் இணைப்புச் சொல் இரு அதிகாரிகளை எளிய பட்டியலாக இணைக்கிறது. நவீன தமிழில் மீண்டும் மீண்டும் ‘மற்றும்’ எனக் கூறாமல், அரைப்புள்ளி அதே பட்டியல் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: יוֹאָב / צְרוּיָה / יְהוֹשָׁפָט / אֲחִילוּד
  choice: யோவாப் / செருயா / யோசபாத் / அகிலூத்
  rationale: பெயர்கள் அவற்றின் எபிரெய வடிவங்களை அடிப்படையாகக் கொண்டும் தமிழில் நிலைபெற்றுள்ள வேதாகமப் பெயரெழுத்து மரபுக்கு ஏற்றவாறும் ஒலிபெயர்க்கப்பட்டுள்ளன.
