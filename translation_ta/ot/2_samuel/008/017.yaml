base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/017.yaml
  text: Zadok son of Ahitub and Ahimelech son of Abiathar were priests[b][a], and Seraiah was secretary.
translation:
  language: ta
  text: அகிதூபின் மகன் சாதோக்கும் அபியத்தாரின் மகன் அகிமெலேக்கும் ஆசாரியர்களாக இருந்தார்கள்[a]; செராயா அரசுச் செயலராக இருந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “முதன்மை அமைச்சர்கள்” அல்லது “அரச அதிகாரிகள்.” இந்த வசனம் தாவீதின் அதிகாரிகளைப் பட்டியலிடுவதால், “ஆசாரியர்கள்” என்பதற்கான எபிரெயச் சொல்லைச் சிலர் இங்கு பரந்த அரசவை-நிர்வாகப் பொருளில் எடுத்துக்கொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “எழுத்தர்.” எபிரெயச் சொல் எழுதுதல் அல்லது நிர்வாகப் பொறுப்பு வகித்த ஓர் அதிகாரியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָדוֹק
  choice: சாதோக்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீன தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: בֶּן
  choice: மகன்
  rationale: இந்த நிர்வாகப் பட்டியலில் உடனடி தந்தை–மகன் உறவையே இயல்பாகக் குறிக்கிறது; ‘வழிவந்தவர்’ என்ற பரந்த பொருள் இங்கு தேவையில்லை.
- source_word: אֲחִיטוּב
  choice: அகிதூப்
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: אֲחִימֶלֶךְ
  choice: அகிமெலேக்
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: אֶבְיָתָר
  choice: அபியத்தார்
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: כֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: כֹּהֵן என்பதன் வழக்கமான, முதன்மையான பொருள் ‘ஆசாரியர்’. அரசவையின் அதிகாரிகள் பட்டியலிடப்படும் சூழலால் ‘முதன்மை அமைச்சர்கள்’ அல்லது ‘அரச அதிகாரிகள்’ என்ற பரந்த பொருள் முன்வைக்கப்பட்டாலும், அதை முதன்மை உரையில் ஏற்கப் போதிய அழுத்தம் இல்லை.
- source_word: שְׂרָיָה
  choice: செராயா
  rationale: எபிரெய தனிப்பெயரின் தமிழ்ச் சொல்லொலிப்பு.
- source_word: סוֹפֵר
  choice: அரசுச் செயலர்
  rationale: அரசவை அதிகாரிகளின் பட்டியலில், எழுதுதல் மற்றும் நிர்வாகப் பொறுப்புகளை வகித்த அதிகாரியைக் குறிக்கிறது. நவீன வாசகருக்கு பதவியின் செயல்பாட்டைத் தெளிவாகத் தெரிவிக்க ‘அரசுச் செயலர்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; நேரடியான ‘எழுத்தர்’ மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: அரசவை அதிகாரிகளின் பட்டியலில் כֹּהֲנִים என்பதன் பொருள்
  choice: ஆசாரியர்கள்
  alternative: முதன்மை அமைச்சர்கள் அல்லது அரச அதிகாரிகள்
  rationale: இங்கு நேரடியான கோட்பாட்டுச் சிக்கல் இல்லை. எபிரெயச் சொல்லின் இயல்பான முதன்மைப் பொருள் ‘ஆசாரியர்கள்’; நிர்வாகச் சூழல் பரந்த பொருளுக்கான வாய்ப்பை உருவாக்குவதால் அந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதைமிக்க ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பெயர்கள் எபிரெய ஒலிக்கு அருகாகத் தமிழாக்கப்பட்டுள்ளன. ‘அரசுச் செயலர்’ என்பது அரசவைச் சூழலைத் தெளிவுபடுத்தும் செயல்பாட்டு மொழிபெயர்ப்பு; மூலச்சொல்லின் நேரடி மாற்றான ‘எழுத்தர்’ அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின்னர் முதன்மை உரையில் இடப்பட்டுள்ளன.
