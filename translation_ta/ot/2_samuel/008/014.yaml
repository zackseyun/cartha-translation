source:
  edition: WLC
  text: וַ/יָּ֨שֶׂם בֶּ/אֱד֜וֹם נְצִבִ֗ים בְּ/כָל אֱדוֹם֙ שָׂ֣ם נְצִבִ֔ים וַ/יְהִ֥י כָל אֱד֖וֹם עֲבָדִ֣ים לְ/דָוִ֑ד וַ/יּ֤וֹשַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/014.yaml
  text: He placed garrisons in Edom[a]; throughout all Edom he placed garrisons, and all Edom became servants to David[b]. And Yahweh gave David victory wherever he went.
translation:
  language: ta
  text: அவர் ஏதோமில் காவற்படைகளை நிறுத்தினார்; ஏதோம் நாடெங்கும் காவற்படைகளை நிறுத்தினார். ஏதோம் முழுவதும் தாவீதுக்கு அடிமையானது[a]. யாவே தாவீது சென்ற இடமெல்லாம் அவருக்கு வெற்றி அளித்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏதோமியர் அனைவரும் தாவீதுக்குப் பணியாளர்களானார்கள்.” எபிரெயத்தில், “ஏதோம் முழுவதும் தாவீதுக்கு அடிமைகள் ஆனது” என்று உள்ளது; நாட்டின் பெயர் அதன் மக்களைக் கூட்டாகக் குறிக்கிறது. ‘அடிமைகள்’ என்று மொழிபெயர்க்கப்பட்ட சொல் ‘பணியாளர்கள்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாவே தாவீது சென்ற இடமெல்லாம் அவரைக் காப்பாற்றினார்/விடுவித்தார்.” இங்குள்ள படைசார் சூழலில், அந்த விடுவிப்பு வெற்றியாக வெளிப்படுவதால் “வெற்றி அளித்தார்” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם / שָׂם
  choice: நிறுத்தினார்
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வை, நிறுத்து’ என்பதாகும். படைசார் சூழலில் ‘காவற்படைகளை நிறுத்தினார்’ என்பது இயல்பாகவும், மூலச்சொல்லைவிடக் கூடுதல் விவரத்தைச் சேர்க்காமலும் உள்ளது.
- source_word: נְצִבִים
  choice: காவற்படைகள்
  rationale: கைப்பற்றப்பட்ட ஏதோம் நாட்டைக் கட்டுப்படுத்துவதற்காக நிலைநிறுத்தப்பட்ட படையினரையோ படைநிலையங்களையோ இச்சொல் குறிக்கலாம். இச்சூழலில் ‘காவற்படைகள்’ பொருத்தமானது; ‘ஆளுநர்கள்’ என்பதும் சாத்தியமான மாற்று.
- source_word: בֶּאֱדוֹם / בְּכָל אֱדוֹם
  choice: ஏதோமில் / ஏதோம் நாடெங்கும்
  rationale: ב இடத்தைக் குறிக்கிறது; בְכָל என்பதின் பரவலான பொருளை ‘நாடெங்கும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיְהִי כָל אֱדוֹם עֲבָדִים לְדָוִד
  choice: ஏதோம் முழுவதும் தாவீதுக்கு அடிமையானது
  rationale: עֲבָדִים அடிமைத்தனத்தையோ பணிவிடைசார் கீழ்ப்படிதலையோ குறிக்கிறது. வெற்றிகொள்ளப்பட்ட நாட்டின் அரசியல் அடக்கநிலையை இங்கு ‘அடிமையானது’ தெளிவாகக் காட்டுகிறது; ‘ஏதோம்’ என்பது அதன் மக்களைக் கூட்டாகக் குறிக்கும் நாட்டுப்பெயராகவே வைக்கப்பட்டுள்ளது.
- source_word: וַיּוֹשַׁע
  choice: வெற்றி அளித்தார்
  rationale: ישׁע என்பதன் ஹிஃபில் வடிவம் ‘காப்பாற்று, விடுவி, வெற்றி அளி’ எனப் பொருள்படும். படை வெற்றிகளைச் சுருக்கிக் கூறும் இச்சூழலில் ‘வெற்றி அளித்தார்’ இயல்பானது; தெய்வீகச் செயற்பாட்டையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்குகிறது.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: சென்ற இடமெல்லாம்
  rationale: இந்த எபிரெய மரபுத்தொடர் தாவீது சென்ற எல்லா இடங்களிலும் பெற்ற வெற்றியைக் குறிக்கிறது. ‘சென்ற இடமெல்லாம்’ என்பது இயல்பான தமிழ்; ‘படையெடுத்துச் சென்ற’ என்று மூலத்தில் இல்லாத குறிப்பைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் יהוה என்ற தனிப்பட்ட இறைப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: עֲבָדִים என்பதிலுள்ள அடிமைத்தனம் மற்றும் அரசியல் கீழ்ப்படிதல்
  choice: அடிமையானது
  alternative: பணியாளர்களானார்கள் / கீழ்ப்பட்டது
  rationale: வெற்றிகொள்ளப்பட்ட நாட்டின் கட்டாயக் கீழ்ப்படிதல் இங்கு முன்னிலையில் உள்ளது. அதேவேளை சொல்லின் பரந்த பொருளை அடிக்குறிப்பு சுட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளை மரியாதைமிக்க நடையில் அமைக்கப்பட்டுள்ளது. எபிரெய வசனத்தின் மீளுரையான ‘ஏதோமில்… ஏதோம் நாடெங்கும்’ என்பது வலியுறுத்தலுக்காகப் பாதுகாக்கப்பட்டுள்ளது. இறைப்பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
