  source_fidelity: 'The translation closely reflects the Hebrew sequence and emphasis: David establishes garrisons in Edom and throughout all Edom; all Edom is brought into servile subjection to David; and Yahweh grants David success wherever he goes. “காவற்படைகள்” is a sound contextual rendering of נְצִבִים, and “அடிமையானது” appropriately conveys the collective-national expression while retaining the force of עֲבָדִים in a conquest setting.'
