base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/004.yaml
  text: David captured from him 1,700 horsemen and 20,000 foot soldiers[a]. Then David hamstrung all the chariot horses[c][b], but left enough for 100 chariots.
translation:
  language: ta
  text: தாவீது அவனிடமிருந்து 1,700 குதிரைவீரர்களையும் 20,000 காலாட்படையினரையும் சிறைப்பிடித்தார்.[a] பின்பு தாவீது தேர்ப்படையின் அனைத்துக் குதிரைகளின் பின்கால் நரம்புகளை அறுத்தார்; ஆனால் 100 தேர்களுக்குப் போதுமான குதிரைகளை விட்டுவைத்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில் “1,700 குதிரைவீரர்கள்” என்று உள்ளது. இதற்கு இணையான 1 நாளாகமம் 18:4-ல் “7,000 குதிரைவீரர்கள்” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “தேர்ப்படை அனைத்தையும்” என்று உள்ளது. நரம்பறுத்தல் குதிரைகளுக்கே பொருந்துவதால், தேர்ப்படையின் குதிரைகள் மொழிபெயர்ப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளன. கடைசிப் பகுதியை, “ஆனால் அவற்றில் 100 தேர்களுக்கானவற்றை விட்டுவைத்தார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: சிறைப்பிடித்தார்
  rationale: לכד என்பது போர்ச் சூழலில் கைப்பற்றுதல் அல்லது சிறைப்பிடித்தல் என்று பொருள்படும்; இங்கு படைவீரர்கள் நேரடிப் பொருளாக இருப்பதால் ‘சிறைப்பிடித்தார்’ இயல்பாக உள்ளது.
- source_word: מִמֶּנּוּ
  choice: அவனிடமிருந்து
  rationale: எபிரெயச் சுட்டுப்பெயர் பின்னொட்டு ஒருமையில் உள்ளது; சூழலில் அது தோற்கடிக்கப்பட்ட அரசனாகிய அதாதேசேரைக் குறிக்கிறது.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת פָּרָשִׁים
  choice: 1,700 குதிரைவீரர்கள்
  rationale: פָּרָשִׁים என்பது குதிரையில் போரிடும் வீரர்களைக் குறிக்கிறது. எண்ணிக்கை சாமுவேலின் மசோரா உரைப்படியே தரப்படுகிறது.
- source_word: וְעֶשְׂרִים אֶלֶף אִישׁ רַגְלִי
  choice: 20,000 காலாட்படையினர்
  rationale: சொல்லுக்குச் சொல் ‘கால்நடையாகச் செல்லும் மனிதர்’; படைச் சூழலில் ‘காலாட்படையினர்’ தெளிவான நவீனத் தமிழ்.
- source_word: וַיְעַקֵּר
  choice: பின்னங்கால் நரம்புகளை வெட்டினார்
  rationale: עקר இச்சூழலில் குதிரைகளைப் போருக்குப் பயன்படாதவாறு அவற்றின் பின்னங்கால் நரம்புகளை வெட்டுவதைக் குறிக்கிறது; ‘முடமாக்கினார்’ என்பதைக் காட்டிலும் செயலைத் துல்லியமாகச் சொல்கிறது.
- source_word: אֶת כָּל הָרֶכֶב
  choice: தேர்ப்படையின் குதிரைகள் அனைத்தும்
  rationale: רֶכֶב வழக்கமாக தேர் அல்லது தேர்ப்படை எனப் பொருள்படும். நரம்பு வெட்டுதல் குதிரைகளுக்கே செய்யப்படுவதால், இங்கு ஆகுபெயராகக் குறிக்கப்படும் குதிரைகள் உரையில் வெளிப்படுத்தப்படுகின்றன.
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: 100 தேர்களுக்குத் தேவையானவற்றை மட்டும் விட்டுவைத்தார்
  rationale: יתר என்பதன் ஹிஃபில் வடிவம் மீதியாக விடுதல் அல்லது வைத்துக்கொள்ளுதல் எனப் பொருள்படும். முன்வரும் குதிரைகளே மறைமுக முன்னிலையாக இருப்பதால், ‘தேவையானவற்றை’ என்பது 100 தேர்களை இயக்கப் போதுமான குதிரைகளைக் குறிக்கிறது.
