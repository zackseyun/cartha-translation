    text: எபிரெய மொழியில் אֲרַם என்பது இங்கு தமஸ்குவை மையமாகக் கொண்ட ஆராமிய அரசைக் குறிக்கிறது; பிற்கால வழக்கிலுள்ள ‘சிரியா’ என்பதற்குப் பதிலாக ‘ஆராம்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
