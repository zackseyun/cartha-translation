  yaml_path: translation/ot/2_samuel/008/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
translation:
  language: ta
  text: தமஸ்கு ஆராம்[a], சோபாவின் அரசன் ஹததெசேருக்கு[b] உதவ வந்தது. தாவீது ஆராமியரான இருபத்திரண்டாயிரம் ஆண்களை வீழ்த்தினான்.
  philosophy: optimal-equivalence
