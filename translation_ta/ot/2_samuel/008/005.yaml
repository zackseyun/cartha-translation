- source_word: אֲרַם דַּמֶּשֶׂק
  choice: தமஸ்குவின் ஆராம்
  rationale: אֲרַם என்பதைக் காலத்தால் பிந்திய ‘சிரியா’ என்ற பெயரால் மாற்றாமல் ‘ஆராம்’ எனப் பெயரெழுத்தாக்குவது மூலத்தின் வரலாற்றுக் குறிப்பைத் தக்கவைக்கிறது; דַּמֶּשֶׂק அதன் மையத்தை அடையாளப்படுத்துகிறது.
- source_word: לַעְזֹר
  choice: உதவ
  rationale: עזר என்பதன் நேரடியான, இயல்பான நவீனத் தமிழ் பொருள் ‘உதவ’.
- source_word: לַהֲדַדְעֶזֶר
  choice: ஹததெசேருக்கு
  rationale: இவ்வசனத்தின் எபிரெய மெய்யெழுத்து வடிவமான הדדעזר-ஐ நெருக்கமாகப் பெயரெழுத்தாக்குகிறது; வேறு இடங்களில் காணப்படும் மாற்று வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מֶלֶךְ צוֹבָה
  choice: சோபாவின் அரசன்
  rationale: எபிரெய இணைப்புநிலைத் தொடரை இயல்பான தமிழில் உரிமைத் தொடர்பாக வழங்குகிறது.
- source_word: וַיַּךְ
  choice: வீழ்த்தினான்
  rationale: போர்ச் சூழலில் נכה ஒரு தீர்மானமான தாக்குதலையும் உயிரிழப்பையும் குறிக்கலாம்; ‘வீழ்த்தினான்’ அதன் வலிமையைத் தக்கவைத்தும் ‘கொன்றான்’ என்று தேவைக்கு மீறித் தெளிவுபடுத்தாமலும் இருக்கிறது.
- source_word: בַּאֲרָם
  choice: ஆராமிய ஆண்களில்
  rationale: נכה உடன் வரும் ב தாக்கப்பட்ட குழுவைக் குறிக்கிறது. எண்ணிக்கையோடு אִישׁ வருவதால், தமிழில் அந்தக் குழுவை ‘ஆராமிய ஆண்களில்’ என்று வெளிப்படுத்துவது இயல்பாக உள்ளது.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: இருபத்திரண்டாயிரம் பேர்
  rationale: எண்ணிக்கை ‘இருபத்திரண்டாயிரம்’; אִישׁ ஆண்களைக் குறிப்பது முந்தைய ‘ஆராமிய ஆண்களில்’ என்பதில் வெளிப்படையாகத் தக்கவைக்கப்பட்டு, எண்ணிக்கையுடன் இயல்பான ‘பேர்’ பயன்படுத்தப்பட்டுள்ளது.
