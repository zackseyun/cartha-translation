base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/002.yaml
  text: He struck Moab and measured them with a line[a], making them lie down on the ground. He measured off two lengths of line for death and a full length of line to keep alive. So Moab became David’s servants[b], bringing tribute.
translation:
  language: ta
  text: தாவீது மோவாபைத் தாக்கினான். மோவாபியரைத் தரையில் படுக்கவைத்து, கயிற்றால்[a] அவர்களை அளந்தான். சாவுக்கென இரண்டு கயிற்றளவுகளையும், உயிரோடு வைப்பதற்கென ஒரு முழுக் கயிற்றளவையும்[b] அளந்தான். இவ்வாறு மோவாபியர் தாவீதின் பணியாட்களாகி, அவனுக்குத் திறை செலுத்தினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அளவுக்கயிற்றால்.”
    reason: lexical_alternative
  - marker: b
    text: மோவாபியரைத் தரையில் படுக்கவைத்து தாவீது அளந்ததாக எபிரெய உரை கூறுகிறது. அளக்கப்பட்ட இரண்டு பகுதிகள் “சாவுக்கு” என்றும், ஒரு முழுப் பகுதி உயிரோடு வைக்கப்படுவதற்கும் ஒதுக்கப்பட்டது; அதாவது சிலர் கொல்லப்பட்டு, மற்றவர்கள் உயிரோடு விடப்பட்டனர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ אֶת־מוֹאָב
  choice: தாவீது மோவாபைத் தாக்கினான்
  rationale: נכה என்பதன் நேரடியான இராணுவப் பொருளான ‘தாக்கு/அடி’ என்பதைக் காக்கிறது; ‘முற்றிலும் தோற்கடித்தான்’ என்று மூலத்தைவிட அதிகமாக விளக்கவில்லை.
- source_word: וַיְמַדְּדֵם בַּחֶבֶל
  choice: கயிற்றால் அவர்களை அளந்தான்
  rationale: מדד என்பதன் ‘அளத்தல்’ என்ற செயலை நேரடியாகவும், חבל என்பதன் கயிறு/அளவுக்கயிறு என்ற கருவிப்பொருளை இயல்பான தமிழிலும் தருகிறது.
- source_word: הַשְׁכֵּב אֹתָם אַרְצָה
  choice: மோவாபியரைத் தரையில் படுக்கவைத்து
  rationale: காரணவினைத் தன்மையையும், அளவிடும் நடைமுறை தரையில் படுக்கவைத்த பிறகு நடந்ததையும் தெளிவாகக் காட்டுகிறது.
- source_word: וַיְמַדֵּד שְׁנֵי חֲבָלִים לְהָמִית
  choice: சாவுக்கென இரண்டு கயிற்றளவுகளை அளந்தான்
  rationale: ‘இரண்டு’ என்ற எண்ணையும், அளவுக்கயிற்றால் குறிக்கப்பட்ட இரண்டு பகுதிகளையும், மூலத்தின் கடுமையான ‘சாவுக்கு’ என்ற சுருக்கத்தையும் காக்கிறது.
- source_word: וּמְלֹא הַחֶבֶל לְהַחֲיוֹת
  choice: உயிரோடு வைப்பதற்கென ஒரு முழுக் கயிற்றளவை
  rationale: מְלֹא என்பதன் முழு அளவைத் தெரிவிக்கிறது; חיה என்பதன் காரணவினையான ‘உயிரோடு வைத்தல்/வாழவிடுதல்’ என்பதையும் பிரதிபலிக்கிறது. ‘ஒரு’ என்பது இரண்டு அளவுகளுக்கு எதிராக உள்ள முழு அளவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַתְּהִי מוֹאָב לְדָוִד לַעֲבָדִים
  choice: மோவாபியர் தாவீதின் பணியாட்களாகி
  rationale: இங்கு עֲבָדִים அரசியல் அடிபணிதலைக் குறிக்கிறது. ‘பணியாட்கள்’ நேரடியான சொல்லைத் தக்கவைக்கிறது; ‘அடிமைகள்’ எனச் சமூக அடிமைத்தனத்தைத் தேவையின்றி வலியுறுத்தவில்லை.
- source_word: נֹשְׂאֵי מִנְחָה
  choice: அவனுக்குத் திறை செலுத்தினர்
  rationale: அரசராட்சி சூழலில் מִנְחָה வழிபாட்டு காணிக்கையை அல்ல, கீழ்ப்பட்ட நாடு செலுத்தும் திறையைக் குறிக்கிறது.
theological_decisions:
- issue: மோவாபியரை அளந்ததில் உள்ள மரணம்–உயிர் ஒதுக்கீடு
  choice: தரையில் படுக்கவைத்து கயிற்றால் அளந்ததையும், இரண்டு அளவுகள் சாவுக்கும் ஒரு முழு அளவு உயிரோடு வைப்பதற்கும் ஒதுக்கப்பட்டதையும் நேரடியாக வைத்தல்
  alternative: இதனை பொதுவான அடிபணிதலாக மட்டும் உருவகப்படுத்துதல் அல்லது பிரதான உரையிலேயே மூன்றில் இரண்டு பங்கு கொல்லப்பட்டதாகக் கூறுதல்
  rationale: எபிரெய உரை கொடுமையான, குறிப்பிட்ட அளவிடும் நடைமுறையைச் சொல்கிறது. விகிதம் உணர்த்தப்பட்டாலும், மூலத்தில் இல்லாத கணக்குச் சொல்லாக்கத்தை பிரதான உரையில் சேர்க்காமல் அதன் தெளிவின்மையையும் பதற்றத்தையும் காக்க வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் உரை அமைக்கப்பட்டுள்ளது. ‘சாவுக்கென’ என்ற சுருக்கமான வடிவம் எபிரெய உரையின் கடுமையையும் செறிவையும் காக்கிறது; ‘திறை’ அரசியல் கீழ்ப்படிதலின் சூழலைத் துல்லியமாகக் காட்டுகிறது.
