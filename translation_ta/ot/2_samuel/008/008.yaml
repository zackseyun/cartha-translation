base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/008.yaml
  text: And from Betah and from Berothai[a], cities of Hadadezer[c][b], King David took very much bronze.
translation:
  language: ta
  text: அதாதேசரின் நகரங்களான பேத்தாவிலிருந்தும்[a] பேரோத்தாயிலிருந்தும்[b], தாவீது அரசர் மிகுந்த வெண்கலத்தை[c] எடுத்துக்கொண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 நாளாகமம் 18:8-இல் உள்ள இணை உரையில் இவ்விடங்கள் திப்காத்து, கூன் என்று அழைக்கப்படுகின்றன; இவ்வசனத்தின் எபிரெய உரையில் பேத்தா, பேரோத்தாய் என்று உள்ளது.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘பேரோத்தா’; இது தொடர்புடைய மற்றொரு இடப்பெயர் வடிவத்தைப் பிரதிபலிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘செம்பு’; எபிரெயச் சொல் சூழலைப் பொறுத்து செம்பையையோ வெண்கலத்தையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בֶּטַח
  choice: பேத்தாகிலும் இருந்து
  rationale: இணைப்பிடைச்சொல்லையும் ‘இருந்து’ என்ற முன்னொட்டையும் இயல்பான தமிழில் இணைத்து வழங்குகிறது; இடப்பெயர் இவ்வசனத்தின் எபிரெய வடிவத்தின்படி ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּ/מִ/בֵּרֹתַי
  choice: பேரோத்தாயிலும் இருந்து
  rationale: இடப்பெயரின் எபிரெய வடிவமான Berothai-ஐப் பின்பற்றி ஒலிபெயர்க்கிறது; தொடர்புடைய வேறொரு பெயர் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עָרֵי הֲדַדְעָזֶר
  choice: அதாதேசருக்குச் சொந்தமான நகரங்கள்
  rationale: உடைமை அல்லது ஆட்சித் தொடர்பைக் குறிக்கும் எபிரெய இணைப்புத் தொடரைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לָקַח
  choice: எடுத்துக்கொண்டார்
  rationale: அடிப்படைப் பொருளான ‘எடுத்தல்’ என்பதைக் காக்கிறது; நகரங்களைக் கைப்பற்றினாரா அல்லது உலோகத்தைப் போர்ப்பொருளாக எடுத்தாரா என்பதை மிகையாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: தாவீது அரசர்
  rationale: தமிழின் இயல்பான பெயர்-பட்ட வரிசையில் அரச பட்டத்தையும் பெயரையும் வழங்குகிறது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: இச்சொல் செம்பையோ வெண்கலத்தையோ குறிக்கலாம்; ஆலயப் பயன்பாட்டைக் கூறும் இணை வசனச் சூழலில் ‘வெண்கலம்’ பொருத்தமான முதன்மைத் தேர்வு. மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַרְבֵּה מְאֹד
  choice: மிகுதியான
  rationale: அளவை வலியுறுத்தும் எபிரெய சொற்றொடரைச் சுருக்கமாகவும் இயல்பான நவீன தமிழிலும் வெளிப்படுத்துகிறது.
