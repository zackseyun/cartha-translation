  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை. எபிரெய இடப்பெயர்கள் இவ்வசனத்தின் மசோரெட்டிக் உரைப்படி முதன்மை உரையில் வைக்கப்பட்டு, இணை வசன வேறுபாடுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
