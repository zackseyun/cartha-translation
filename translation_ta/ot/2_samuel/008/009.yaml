  yaml_path: translation/ot/2_samuel/008/009.yaml
  text: When Toi king of Hamath heard that David had struck down all the army of Hadadezer,[a]
translation:
  language: ta
  text: ஆமாத்தின் அரசன் தோயி[a], தாவீது அதாதேசரின் படை முழுவதையும் முறியடித்தான் என்று கேள்விப்பட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதற்கு இணையான 1 நாளாகமம் 18:9-இல் அரசனின் பெயர் ‘தோவு’ என்று உள்ளது. இவ்வசனத்தின் எபிரெய உரையில் ‘தோயி’ என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: கேள்விப்பட்டபோது
  rationale: שׁמע என்பதன் நேரடியான பொருள் ‘கேட்டான்’. இங்கு அடுத்த வசனத்துடன் தொடரும் காலச் சூழலை இயல்பான தமிழில் காட்ட, ‘கேள்விப்பட்டபோது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: תֹּעִי
  choice: தோயி
  rationale: இவ்வசனத்தின் எபிரெய உரையில் உள்ள பெயர்வடிவம் ஒலிபெயர்க்கப்பட்டது; 1 நாளாகமம் 18:9-இன் மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מֶלֶךְ חֲמָת
  choice: ஆமாத்தின் அரசன்
  rationale: அரச பதவியையும் ஆட்சிப் பகுதியையும் குறிக்கும் எபிரெய இணைப்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: כִּי
  choice: …தைக்
  rationale: தோயி கேள்விப்பட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் பெயரெச்சத் தொடரும் வேற்றுமை உருபும் மூலம் இயல்பாக வெளிப்படுத்தப்பட்டது.
- source_word: הִכָּה
  choice: முறியடித்த
  rationale: இராணுவச் சூழலில் נכה என்பது தாக்கி வீழ்த்துதல் அல்லது தோற்கடித்தலைக் குறிக்கிறது. ‘முறியடித்த’ என்பது வன்மையான இராணுவ வெற்றியை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: אֵת כָּל חֵיל
  choice: படை முழுவதையும்
  rationale: חַיִל இங்கு இராணுவப் படையைக் குறிக்கிறது; כָּל என்பதன் முழுமை ‘முழுவதையும்’ என்பதால் பாதுகாக்கப்படுகிறது.
- source_word: הֲדַדְעָזֶר
  choice: அதாதேசர்
  rationale: எபிரெய தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
