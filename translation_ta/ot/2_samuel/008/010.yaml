  yaml_path: translation/ot/2_samuel/008/010.yaml
  text: Then Toi sent Joram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Toi; and in his hand were articles of silver, articles of gold[b], and articles of bronze.
translation:
  language: ta
  text: அப்போது தோயி தன் மகன் யோராமைத் தாவீது அரசனிடம் அனுப்பினார்; தாவீது அரசன் அதாதேசருக்கு எதிராகப் போரிட்டு அவனை முறியடித்ததற்காக, அரசனின் நலத்தை விசாரிக்கவும் அவரை வாழ்த்தவும் அனுப்பினார். ஏனெனில் அதாதேசர் தோயியுடன் போரில் ஈடுபட்டிருந்தார். யோராமின் கையில் வெள்ளிப் பொருட்களும் தங்கப் பொருட்களும் வெண்கலப் பொருட்களும் இருந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எழுத்துப்படி, “அவருடைய கையில் இருந்தன”; அதாவது, யோராம் இப்பொருட்களைத் தன்னுடன் கொண்டுவந்தார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அப்போது ... அனுப்பினார்
  rationale: Wayyiqtol கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ இயல்பான தமிழ் தொடர்ச்சியை அளிக்கிறது.
- source_word: תֹּעִי
  choice: தோயி
  rationale: சாமுவேல் நூலிலுள்ள எபிரெயப் பெயரின் ஒலிபெயர்ப்பு.
- source_word: יֽוֹרָם בְּנוֹ
  choice: தன் மகன் யோராமை
  rationale: உறவையும் பெயரையும் இயல்பான நவீன தமிழ்ச் சொல்லமைப்பில் தருகிறது.
- source_word: לִשְׁאָל לוֹ לְשָׁלוֹם
  choice: தாவீதின் நலத்தை விசாரித்து
  rationale: ‘சமாதானத்தை விசாரித்தல்’ என்ற எபிரெய மரபுத்தொடரின் பொருள் ஒருவரின் நலத்தை விசாரிப்பதாகும்.
- source_word: וּלְבָרֲכוֹ
  choice: அவரை வாழ்த்தும்படி
  rationale: ברך என்பதற்கு அடிப்படையில் ‘ஆசீர்வதித்தல்’ என்ற பொருள் இருந்தாலும், இத்தூதரகச் சூழலில் வெற்றிக்காக வாழ்த்துதல் என்பது இயல்பான பொருள்.
- source_word: עַל אֲשֶׁר נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: அதாதேசருக்கு எதிராகப் போரிட்டு அவரை முறியடித்ததற்காக
  rationale: ב எதிர்ப்பைக் குறிக்கிறது; נכה இங்கு போரில் தோற்கடித்தல் அல்லது முறியடித்தலைக் குறிக்கிறது, கொன்றதாக அவசியம் கூறவில்லை.
- source_word: כִּי אִישׁ מִלְחֲמוֹת תֹּעִי הָיָה הֲדַדְעָזֶר
  choice: ஏனெனில் அதாதேசர் தோயியுடன் போர் செய்துவந்தார்
  rationale: சுருக்கமான எபிரெய மரபுத்தொடரை இயல்பாகத் தருகிறது; பன்மை வடிவமான ‘போர்கள்’ தொடர்ச்சியான அல்லது பல மோதல்களைக் குறிக்கக்கூடும்.
- source_word: וּבְיָדוֹ הָיוּ
  choice: யோராமிடம் ... இருந்தன
  rationale: எழுத்துப்படி ‘அவருடைய கையில் இருந்தன’; சூழலில் அவர் அவற்றைத் தம்முடன் கொண்டுவந்தார் என்பதே பொருள். ‘அவர்’ யாரைக் குறிக்கிறது என்ற குழப்பத்தைத் தவிர்க்க யோராம் எனத் தெளிவுபடுத்தப்படுகிறது.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב וּכְלֵי נְחֹשֶׁת
  choice: வெள்ளிப் பொருட்களும் தங்கப் பொருட்களும் வெண்கலப் பொருட்களும்
  rationale: כְּלִי என்பது பாத்திரம், கருவி, பொருள் ஆகியவற்றைக் குறிக்கும் பரந்த சொல்; ‘பொருட்கள்’ அந்தப் பரப்பைத் தக்கவைக்கிறது. נְחֹשֶׁת இங்கு ‘வெண்கலம்’ என வழங்கப்படுகிறது.
