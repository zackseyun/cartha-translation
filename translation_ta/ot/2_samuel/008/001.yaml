source:
  edition: WLC
  text: וַֽ/יְהִי֙ אַֽחֲרֵי כֵ֔ן וַ/יַּ֥ךְ דָּוִ֛ד אֶת פְּלִשְׁתִּ֖ים וַ/יַּכְנִיעֵ֑/ם וַ/יִּקַּ֥ח דָּוִ֛ד אֶת מֶ֥תֶג הָ/אַמָּ֖ה מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/001.yaml
  text: And after this[a], David struck the Philistines and subdued them, and David took Metheg-ammah from the hand of the Philistines.
translation:
  language: ta
  text: இதற்குப் பிறகு, தாவீது பெலிஸ்தியரைத் தாக்கி அவர்களை அடக்கினான். தாவீது பெலிஸ்தியரின் கையிலிருந்து மெத்தேக்-அம்மாவை[a] கைப்பற்றினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இது “தாய்நகரத்தின் கடிவாளம்” எனச் சொற்சொல்லாகப் பொருள்படக்கூடிய, விளக்கம் கடினமான சொற்றொடர். ஒரு முதன்மை நகரத்தின் மீதான கட்டுப்பாட்டை இது உருவகமாகக் குறிக்கலாம். 1 நாளாகமம் 18:1-ல் “காத்தையும் அதைச் சேர்ந்த ஊர்களையும்” என்று வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: இதற்குப் பிறகு
  rationale: எபிரெயக் கதைத் தொடரின் கால மாற்றத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘அப்போது நிகழ்ந்ததாவது’ என்ற சொற்சொல்லான வடிவம் தேவையில்லை.
- source_word: וַיַּךְ
  choice: தாக்கி
  rationale: נכה என்பதன் அடிப்படை இராணுவச் செயலைக் காட்டுகிறது; அடுத்த வினைச்சொல் அதன் விளைவாக ஏற்பட்ட அடக்கத்தைத் தனியே குறிப்பிடுகிறது.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்
  rationale: இம்மக்கள் குழுவின் பெயருக்கான வழக்கமான தமிழ் வடிவம்.
- source_word: וַיַּכְנִיעֵם
  choice: அவர்களை அடக்கினான்
  rationale: Hiphil வடிவிலுள்ள כנע குறிக்கும் இராணுவ மற்றும் அரசியல் கீழ்ப்படுத்துதலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיִּקַּח
  choice: கைப்பற்றினான்
  rationale: לקח பொதுவாக ‘எடுத்தான்’ என்றாலும், எதிரியின் கட்டுப்பாட்டிலிருந்த ஒன்றை போரின் விளைவாகப் பெறும் இச்சூழலில் ‘கைப்பற்றினான்’ இயல்பானது.
- source_word: מֶתֶג הָאַמָּה
  choice: மெத்தேக்-அம்மா
  rationale: இது கடினமான, பொருள் உறுதியற்ற சொற்றொடர். ‘தாய்நகரத்தின் கடிவாளம்’ என்ற சொற்சொல்லான உருவகத்தை பிரதான உரையில் திணிக்காமல், பெயர்போன்ற ஒலிபெயர்ப்பு மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது; சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִיַּד
  choice: கையிலிருந்த
  rationale: ‘கையிலிருந்து’ என்ற எபிரெய மரபுத்தொடரின் கட்டுப்பாடு அல்லது உடைமை சார்ந்த பொருளைப் பாதுகாத்து, தமிழில் இயல்பான தொடராக அமைக்கிறது.
