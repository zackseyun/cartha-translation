translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடையைக் கடைப்பிடிக்கிறது. பட்டியலின் தொடர்ச்சியை ‘-இலிருந்தும்/இடமிருந்தும்’ என்ற இணை வடிவங்கள் காக்கின்றன. கடைசிப் பகுதியின் எபிரெய உறவைத் தெளிவாக்க, ‘அதாத்-ஏசேரின் கொள்ளைப்பொருள்’ என்பது இயல்பான தமிழில் ‘அதாத்-ஏசேரிடமிருந்து கைப்பற்றிய கொள்ளைப்பொருள்’ என வழங்கப்பட்டுள்ளது.
