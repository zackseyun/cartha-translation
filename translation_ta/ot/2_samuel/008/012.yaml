base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/012.yaml
  text: from Aram[a], and from Moab, and from the Ammonites, and from the Philistines, and from Amalek, and from the spoil of Hadadezer son of Rehob[c][b], king of Zobah.
translation:
  language: ta
  text: ஆராமிலிருந்தும்[a], மோவாபிலிருந்தும், அம்மோனியரிடமிருந்தும்[b], பெலிஸ்தியரிடமிருந்தும், அமாலேக்கிலிருந்தும், சோபாவின் அரசனான ரெகோபின் மகன் அதாத்-ஏசேரின் கொள்ளைப்பொருளிலிருந்தும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘ஆராம்’; மரபாக ‘சிரியா’ என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘அம்மோனின் மக்களிடமிருந்து.’
    reason: lexical_alternative
  - marker: c
    text: சில வேதப்பகுதிகளில் இப்பெயர் ‘அதார்-ஏசேர்’ என்ற வடிவில் எழுதப்பட்டுள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: מֵאֲרָם
  choice: ஆராமிலிருந்தும்
  rationale: אֲרָם என்ற எபிரெயப் பிரதேசப் பெயரைப் பிற்காலப் பெயரான ‘சிரியா’ என்று மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- source_word: וּמִמּוֹאָב
  choice: மோவாபிலிருந்தும்
  rationale: தேசம் அல்லது நிலப்பகுதியைக் குறிக்கும் பெயர்ச்சொல்லை நேரடியாக ஒலிபெயர்த்துள்ளது.
- source_word: וּמִבְּנֵי עַמּוֹן
  choice: அம்மோனியரிடமிருந்தும்
  rationale: சொல்லுக்குச் சொல் ‘அம்மோனின் மக்களிடமிருந்தும்’ என்பதைக் குறிக்கும் இனப்பெயரை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: וּמִפְּלִשְׁתִּים
  choice: பெலிஸ்தியரிடமிருந்தும்
  rationale: எபிரெய இனப்பெயருக்கான தெளிவான, வழக்கமான தமிழ் வடிவம்.
- source_word: וּמֵעֲמָלֵק
  choice: அமாலேக்கிலிருந்தும்
  rationale: மூலத்தில் தனிப்பெயரான עֲמָלֵק இருப்பதால், ‘அமாலேக்கியரிடமிருந்தும்’ என்று இனப்பெயராக மாற்றாமல் அதன் வடிவைப் பேணுகிறது.
- source_word: וּמִשְּׁלַל
  choice: கொள்ளைப்பொருளிலிருந்தும்
  rationale: போரில் கைப்பற்றப்பட்ட பொருட்களைக் குறிக்கும் שָׁלָל என்பதன் பொருளை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: הֲדַדְעֶזֶר
  choice: அதாத்-ஏசேர்
  rationale: இவ்வசனத்தின் மெய்யெழுத்து வடிவத்தைத் தெளிவாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு; பெயரின் இரு கூறுகளையும் இணைப்புக்கோடு காட்டுகிறது.
- source_word: בֶּן רְחֹב
  choice: ரெகோபின் மகன்
  rationale: தந்தை–மகன் உறவைக் குறிக்கும் எளிய எபிரெயக் கட்டமைப்பை நேரடியாக வழங்குகிறது.
- source_word: מֶלֶךְ צוֹבָה
  choice: சோபாவின் அரசன்
  rationale: அரசப் பட்டத்தையும் இடப்பெயரையும் இயல்பான தமிழ் உடைமைத் தொடரில் வழங்குகிறது.
