translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொற்றொடரான ‘தன் கை’ என்பதன் அரசியல்-இராணுவப் பொருள் முதன்மை உரையில் இயல்பாக வழங்கப்பட்டு, அதன் மாற்றுச் சாத்தியங்கள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் இடம்பெற்றுள்ளன.
