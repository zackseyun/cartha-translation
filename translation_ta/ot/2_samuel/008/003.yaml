base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/003.yaml
  text: David struck down Hadadezer son of Rehob[a], king of Zobah[c][b], when he went to restore his power at the River.
translation:
  language: ta
  text: தாவீது ரெகோபின் மகனும் சோபாவின் அரசனுமான அதாதேசரை[a], அவன் நதிப் பகுதியில்[c] தன் அதிகாரத்தை மீண்டும் நிலைநாட்டச் சென்றபோது[b], தோற்கடித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “அதாதேசர்”; சில கையெழுத்து மரபுகளிலும் 1 நாளாகமத்தில் உள்ள இணைப் பகுதியிலும் “அதரேசர்” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: “தன் கட்டுப்பாட்டை மீட்க” அல்லது “தன் ஆதிக்கத்தை மீண்டும் நிலைநாட்ட” என்றும் மொழிபெயர்க்கலாம்; சொல்லர்த்தமாக, “தன் கையைத் திரும்ப நிலைநாட்ட.”
    reason: lexical_alternative
  - marker: c
    text: இது பெரும்பாலும் யூபிரடீஸ் நதியைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּךְ
  choice: தோற்கடித்தான்
  rationale: נכה என்ற வினை போர்ச் சூழலில் தாக்கி முறியடிப்பதைக் குறிக்கிறது. இங்கு ‘கொன்றான்’ என்பது அளவுக்கு மீறிய துல்லியம்; ‘தாக்கினான்’ மட்டும் முடிவைத் தெளிவாகக் காட்டாது. ஆகவே ‘தோற்கடித்தான்’ இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: הֲדַדְעֶזֶר
  choice: அததெசர்
  rationale: WLC மெய்யெழுத்து வடிவமான Hadadezer-ஐத் தமிழில் ஒலிபெயர்த்தது. மாற்றுப் பாடமான Hadarezer அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בֶּן רְחֹב
  choice: ரெகோபின் மகன்
  rationale: எபிரெயப் பிதாவழிப் பெயரமைப்பை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: מֶלֶךְ צוֹבָה
  choice: சோபாவின் அரசன்
  rationale: இணைநிலைப் பெயர்த்தொடரை இயல்பான தமிழில் வழங்கி, இடப்பெயரை ஒலிபெயர்க்கிறது.
- source_word: בְּלֶכְתּוֹ
  choice: அவன் ... சென்றபோது
  rationale: ב முன்னொட்டுடன் வரும் வினையெச்ச அமைப்பு காலச் சூழலைக் குறிக்கிறது; ‘சென்றபோது’ அதைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְהָשִׁיב
  choice: மீண்டும் நிலைநாட்ட
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் திரும்பச் செய்தல் அல்லது மீட்டமைத்தலைக் குறிக்கிறது. ‘மீண்டும் நிலைநாட்ட’ என்பது இங்குள்ள அரசியல்-இராணுவச் சூழலுக்கு ஏற்றதாய் இருந்தும், எது மீட்கப்பட்டது என்பதில் அளவுக்கு மீறிய துல்லியத்தைத் தவிர்க்கிறது.
- source_word: יָדוֹ
  choice: தன் அதிகாரத்தை
  rationale: ‘தன் கை’ என்ற சொற்றொடர் இங்கு அதிகாரம், கட்டுப்பாடு அல்லது ஆட்சியைக் குறிக்கும் மரபுத்தொடர். ‘அதிகாரம்’ வாசிக்க இயல்பானது; ‘கட்டுப்பாடு’ மற்றும் ‘ஆதிக்கம்’ ஆகிய சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: בִּנְהַר
  choice: நதியருகே
  rationale: נהר இங்கு குறிப்பிட்ட ‘நதியை’—பெரும்பாலும் யூபிரடீசை—சுட்டுகிறது. முதன்மை உரை எபிரெயத்தின் சுருக்கத்தையும் ஓரளவு தெளிவின்மையையும் காக்கிறது; சாத்தியமான அடையாளம் அடிக்குறிப்பில் தரப்படுகிறது.
