  text: וּ/בְנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וְ/הַ/כְּרֵתִ֖י וְ/הַ/פְּלֵתִ֑י וּ/בְנֵ֥י דָוִ֖ד כֹּהֲנִ֥ים הָיֽוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/018.yaml
  text: Benaiah son of Jehoiada was over the Kerethites and the Pelethites, and David’s sons were priests.[a]
translation:
  language: ta
  text: யெகொயாதாவின் மகன் பெனாயா கெரேத்தியருக்கும் பெலேத்தியருக்கும் தலைவனாக இருந்தான்.[a] தாவீதின் மகன்கள் ஆசாரியர்களாக இருந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தலைவனாக” என்பதற்கான சொல் எபிரெய உரையில் வெளிப்படையாக இல்லை; வாக்கியச் சூழலும் 1 நாளாகமம் 18:17-இல் உள்ள இணையான பதிவும் இந்த உறவைத் தெளிவுபடுத்துகின்றன.
    reason: மூலத்தில் மறைந்துள்ள வாக்கிய உறவை மொழிபெயர்ப்பில் வெளிப்படுத்துதல்
  - marker: b
    text: அல்லது “முதன்மை அமைச்சர்களாக” அல்லது “அரச அதிகாரிகளாக.” எபிரெயச் சொல்லின் வழக்கமான பொருள் “ஆசாரியர்கள்”; ஆனால் இங்கு அரச நிர்வாகப் பதவிகளின் பட்டியல் இடம்பெறுவதால், சிலர் இதை விரிவான அரசவைப் பொருளில் புரிந்துகொள்கிறார்கள்.
    reason: மாற்று வாசிப்பையும் மூலத்தின் இறையியல் பதற்றத்தையும் பாதுகாத்தல்
lexical_decisions:
- source_word: וּבְנָיָהוּ בֶּן־יְהוֹיָדָע
  choice: யோய்தாவின் மகன் பெனாயா
  rationale: தனிப்பெயர்கள் எபிரெய ஒலிப்புக்கு நெருக்கமாக, தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: וְהַכְּרֵתִי
  choice: கிரேத்தியர்
  rationale: இது ஓர் இன அல்லது படைக் குழுவைக் குறிக்கும் பெயர்; அதன் துல்லிய அடையாளத்தைத் தீர்மானிக்காமல் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְהַפְּלֵתִי
  choice: பெலேத்தியர்
  rationale: கிரேத்தியருடன் இணைத்துக் கூறப்படும் குழுப் பெயர் என்பதால், விளக்கப் பொருளைத் திணிக்காமல் நேரடியாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: எபிரெயச் சொல்லின் வழக்கமான, நேரடியான பொருள் ‘ஆசாரியர்கள்.’ அரசவைக் சூழலில் வேறு பொருள் இருக்கலாம் என்றாலும், மூலத்தின் பதற்றத்தை முதன்மை உரை பாதுகாக்கிறது.
- source_word: הָיוּ
  choice: இருந்தார்கள்
  rationale: இது היה என்பதன் வழக்கமான இறந்தகால இணைப்புவினை; ‘பணியாற்றினார்கள்’ என்று மொழிபெயர்ப்பது கூடுதல் விளக்கத்தைச் சேர்க்கும்.
theological_decisions:
- issue: தாவீதின் மகன்கள் כֹּהֲנִים என்று அழைக்கப்படுதல்
  choice: முதன்மை உரையில் ‘ஆசாரியர்கள்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘முதன்மை அமைச்சர்கள்’ அல்லது ‘அரச அதிகாரிகள்’
  rationale: தாவீதின் மகன்கள் வழிபாட்டுச் சார்ந்த ஆசாரியர்களாக இருந்தார்களா என்ற வரலாற்று-இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தானாகத் தீர்க்கக் கூடாது. எனவே எபிரெயச் சொல்லின் இயல்பான பொருள் உரையில் வைக்கப்பட்டு, அரசவைப் பதவியைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: பெனாயாவுக்கும் கிரேத்தியர்–பெலேத்தியருக்கும் இடையிலான உறவு
  choice: ‘தலைவனாக இருந்தான்’ என்று சூழலுக்கேற்ற மறைபொருளை வெளிப்படுத்தல்
  alternative: சொல்லுக்குச் சொல் முறையில் பதவியுறவை வெளிப்படுத்தாமல் பெயர்களை மட்டும் தொடராக அமைத்தல்
  rationale: இந்த எபிரெய வசனத்தில் ‘மேல்/தலைவனாக’ என்பதற்கான தனிச்சொல் இல்லை. ஆயினும் அரச அலுவலர்களின் பட்டியல், வாக்கிய அமைப்பு, இணையான 1 நாளாகமம் 18:17 ஆகியவை பெனாயா இக்குழுக்களுக்குத் தலைமை வகித்ததைத் தெளிவுபடுத்துகின்றன; சேர்க்கப்பட்ட பொருள் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. குழுப் பெயர்கள் ஒலிபெயர்க்கப்பட்டன; நிரூபிக்க முடியாத இன அல்லது இராணுவ அடையாளம் சேர்க்கப்படவில்லை. ‘ஆசாரியர்கள்’ என்ற நேரடிப் பொருள் முதன்மை உரையில் பாதுகாக்கப்பட்டு, சூழல்சார் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டது.
