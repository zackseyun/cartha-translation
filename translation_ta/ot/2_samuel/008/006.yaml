  text: וַ/יָּ֨שֶׂם דָּוִ֤ד נְצִבִים֙ בַּ/אֲרַ֣ם דַּמֶּ֔שֶׂק וַ/תְּהִ֤י אֲרָם֙ לְ/דָוִ֔ד לַ/עֲבָדִ֖ים נוֹשְׂאֵ֣י מִנְחָ֑ה וַ/יֹּ֤שַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and Aram became servants to David, bringing tribute[c][b]. And Yahweh gave David victory wherever he went.
translation:
  language: ta
  text: தாவீது தமஸ்குவின் அராமில் படைத்தளங்களை[a] நிறுவினான். அராம் தாவீதுக்குப் பணியாளர்களாகி, திறை கொண்டுவந்தது[b]. தாவீது சென்ற இடமெல்லாம் யாவே அவனுக்கு வெற்றி அளித்தார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆளுநர்களை.” இச்சொல் நிலைநிறுத்தப்பட்ட படையினரையோ இராணுவக் காவல் நிலையங்களையோ, சில சூழல்களில் அதிகாரிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேர்சொல்லாக, “காணிக்கை/பரிசைச் சுமந்து வந்தது.” இங்கு வெற்றிகொள்ளப்பட்ட அரசு செலுத்திய திறையைக் குறிக்கும் வாய்ப்பு அதிகம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தாவீது சென்ற இடமெல்லாம் யாவே அவனைக் காப்பாற்றினார்/விடுவித்தார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: நிறுவினான்
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வை/அமை’; படைத்தளங்களைக் கட்டுப்பாட்டு அமைப்பாக ஏற்படுத்திய சூழலில் ‘நிறுவினான்’ இயல்பான தமிழாக உள்ளது.
- source_word: נְצִבִים
  choice: படைத்தளங்கள்
  rationale: இராணுவ வெற்றிக்குப் பிந்தைய இச்சூழலில், இச்சொல் நிலைநிறுத்தப்பட்ட படையினரையோ காவல் நிலையங்களையோ குறிக்கலாம். ‘படைத்தளங்கள்’ சாத்தியமான இராணுவப் பொருளைத் தெளிவாகத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בַּאֲרַם דַּמֶּשֶׂק
  choice: தமஸ்கு அராமில்
  rationale: אֲרָם என்ற எபிரேய இடப்பெயரை ‘அராம்’ எனப் பாதுகாத்து, தமஸ்குவை மையமாகக் கொண்ட அராமிய அரசைக் குறிக்கும் தொடரை இயல்பான தமிழ்ச் சொல் வரிசையில் தருகிறது.
- source_word: וַתְּהִי אֲרָם לְדָוִד לַעֲבָדִים
  choice: அராம் தாவீதுக்குப் பணிசெய்து
  rationale: தேசிய-அரசியல் கீழ்ப்படிதலைக் குறிக்கும் עֲבָדִים என்பதன் ‘ஊழியர்/பணியாளர்’ சார்ந்த சொல்லியல் தொடர்பை ‘பணிசெய்து’ காக்கிறது; தனிநபர் அடிமைத்தனத்தைத் தேவையின்றி முன்வைக்கவில்லை.
- source_word: נוֹשְׂאֵי מִנְחָה
  choice: திறை செலுத்தியது
  rationale: מִנְחָה என்பது பரிசு, காணிக்கை அல்லது திறை எனப் பொருள்படலாம். வெற்றிகொள்ளப்பட்ட அரசின் கீழ்ப்படிதல் சூழலில் ‘திறை’ மிகப் பொருத்தமானது; participial வடிவம் இயல்பான தமிழ் வினையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיֹּשַׁע
  choice: வெற்றி அளித்தார்
  rationale: ישׁע என்பதன் causative வடிவம் ‘காப்பாற்றினார்/விடுவித்தார்’ என்ற அடிப்படை உணர்வைக் கொண்டது; இங்கு போர் நடவடிக்கைகளின் சூழலில் ‘வெற்றி அளித்தார்’ பொருளைத் தெளிவுபடுத்துகிறது, மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநான்கெழுத்து தெய்வீகப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவமான ‘யெகோவா’ என வழங்குகிறது.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: சென்ற இடமெல்லாம்
  rationale: எபிரேய மரபுத்தொடரின் விரிவான பொருளை, போர் அணிவகுப்பாக மட்டும் குறுக்காமல், இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் தனிப்பெயரைப் பட்டப்பெயரான ‘கர்த்தர்’ என்று மாற்றாமல் பாதுகாக்கிறது. ‘யாவே’ என்பது சாத்தியமான மற்றொரு ஒலிபெயர்ப்பு; தமிழ் வாசகர்களிடையே பரவலாக அறியப்படும் வடிவமாக ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: அராம் ‘עֲבָדִים’ ஆனது என்ற அரசியல் மொழி
  choice: தாவீதுக்குப் பணிசெய்து
  alternative: தாவீதுக்கு அடிமையானது; தாவீதுக்குக் கீழ்ப்பட்டது
  rationale: இந்தச் சூழல் ஒரு தேசத்தின் அரசியல் கீழ்ப்படிதலையும் திறை செலுத்துதலையும் குறிக்கிறது. ‘பணிசெய்து’ மூலச்சொல்லின் சேவை உணர்வைக் காக்கிறது; ‘அடிமையானது’ தனிநபர் அடிமைத்தனத்தை அதிகமாக உணர்த்தலாம், ‘கீழ்ப்பட்டது’ அதிக விளக்கவுரையாகும்.
- issue: וַיֹּשַׁע என்பதன் இராணுவச் சூழல்
  choice: வெற்றி அளித்தார்
  alternative: காப்பாற்றினார்; விடுவித்தார்
  rationale: தாவீதின் படையெடுப்புகளை விவரிக்கும் சூழலில் விளைவான வெற்றியைத் தெளிவாகக் கூறுகிறது; எனினும் எபிரேய வினையின் ‘காப்பாற்றுதல்/விடுவித்தல்’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வரலாற்று உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அராம்’ மூல இடப்பெயராகப் பாதுகாக்கப்பட்டுள்ளது; ‘திறை’ அரசியல்-வரலாற்றுச் சூழலுக்கான துல்லியமான சொல்லாக உள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
