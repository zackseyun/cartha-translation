  source_fidelity: 'மொத்தத்தில் எபிரேய வாக்கிய அமைப்பும் பொருளும் நன்றாகப் பிரதிபலிக்கப்படுகின்றன: தாவீது காவல்/படைக் கட்டுப்பாட்டு நிலையங்களை அமைத்ததும், அராம் கீழ்ப்பட்டு திறை கொண்டுவந்ததும், யெகோவா/யாவே தாவீதுக்கு வெற்றி அளித்ததும் தெளிவாக உள்ளன. ஆனால் יְהוָה என்பதற்கு ஆங்கில POB audit trail-இல் பின்பற்றப்பட்டுள்ள பெயர்வடிவமான “Yahweh”க்கு ஒத்த “யாவே” பயன்படுத்தப்பட வேண்டும்; “யெகோவா” வேறுபட்ட பாரம்பரிய ஒலிப்பெயர்ப்பாகும். மேலும் עֲבָדִים என்ற நிலைமாற்றமும் נוֹשְׂאֵי மִנְחָה என்ற பங்குபெறும் தொடரும் நேரடியாகத் தெரியுமாறு சிறு திருத்தம் செய்யப்பட்டுள்ளது.'
