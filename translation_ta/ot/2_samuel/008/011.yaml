base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/011.yaml
  text: King David also dedicated them to Yahweh[b][a], along with the silver and the gold that he had dedicated from all the nations that he had subdued.
translation:
  language: ta
  text: தாவீது அரசன், தான் கீழ்ப்படுத்திய[b] எல்லா நாடுகளிலிருந்தும் அர்ப்பணித்திருந்த வெள்ளியோடும் தங்கத்தோடும் சேர்த்து, அவற்றையும்[c] யாவேக்கு[a] அர்ப்பணித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவே” என்பது எபிரெய மொழியில் உள்ள கடவுளின் தனிப்பெயரான יהוה என்பதன் ஒலிபெயர்ப்பு.
    reason: divine_name
  - marker: b
    text: “கீழ்ப்படுத்திய” என்பதை “வென்ற” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை வலிமையால் மக்களைக் கட்டுப்பாட்டுக்குள் கொண்டுவருவதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: “அவற்றையும்” என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பொருட்களைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  choice: அவற்றையும்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட பொருட்களையும் ஏற்கெனவே அர்ப்பணிக்கப்பட்ட செல்வங்களுடன் சேர்க்கும் கூட்டுப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֹתָם
  choice: அவற்றை
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பொருட்களைச் சுட்டும் பொதுப்பெயர்ப்பதிலியைத் தக்கவைக்கிறது; முதன்மை உரையில் தேவையின்றி அவற்றை விவரிக்கவில்லை.
- source_word: הִקְדִּישׁ
  choice: அர்ப்பணித்தான்
  rationale: கடவுளுக்கென விலையுயர்ந்த பொருட்களை ஒதுக்கிவைத்த வழிபாட்டுச் சூழலை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: தாவீது அரசன்
  rationale: பெயரையும் அரசப் பட்டத்தையும் இயல்பான தமிழ் சொல்லடுக்கில் வழங்குகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: எபிரெய மூலத்தில் நேரடியாக உள்ள உடன்படிக்கைப் பெயரான יהוה என்பதை ஒலிபெயர்த்து வழங்குகிறது.
- source_word: עִם
  choice: …ஓடும் …ஓடும் சேர்த்து
  rationale: சுட்டப்பட்ட பொருட்களுக்கும் முன்பே அர்ப்பணிக்கப்பட்ட வெள்ளி, தங்கத்திற்கும் உள்ள இணைப்பை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: வெள்ளியோடும் தங்கத்தோடும்
  rationale: குறிப்பிட்ட இரு விலைமதிப்புள்ள உலோகங்களையும் தனித்தனியாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: அர்ப்பணித்திருந்த
  rationale: இந்த வெள்ளியும் தங்கமும் முன்னைய வெற்றிகளிலிருந்து ஏற்கெனவே அர்ப்பணிக்கப்பட்டிருந்தன என்ற உரையாடல் கால உறவை வெளிப்படுத்துகிறது.
- source_word: מִכָּל הַגּוֹיִם
  choice: எல்லா நாடுகளிலிருந்தும்
  rationale: מִן குறிக்கும் மூலத்தையும், இங்குள்ள גּוֹיִם என்பதன் அரசியல்-புவியியல் பொருளையும் தெரிவிக்கிறது.
- source_word: אֲשֶׁר כִּבֵּשׁ
  choice: தான் கீழ்ப்படுத்திய
  rationale: வலிமையால் கட்டுப்பாட்டுக்குள் கொண்டுவருதல் என்ற பொருளைத் தருகிறது; நிரந்தர இணைப்பை தேவையின்றி உணர்த்தாமல் இராணுவ-அரசியல் வெற்றியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டமாக மாற்றாமல், உடன்படிக்கைப் பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: כִּבֵּשׁ என்பதன் இராணுவ-அரசியல் வலிமை
  choice: கீழ்ப்படுத்திய
  alternative: வென்ற
  rationale: இந்த வினை வலிமையால் மக்களை ஆளுகைக்குள் கொண்டுவருவதைக் குறிக்கலாம். ‘கீழ்ப்படுத்திய’ என்பது அந்தத் தீவிரத்தையும், நிரந்தர நிலப்பரப்பு இணைப்பை உரை கூறாதிருப்பதையும் ஒருங்கே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. எபிரெய வாக்கியத்தின் நீண்ட இணைப்பைத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்தாலும், ‘அவற்றையும்’ என்ற மீளுரைப்பால் தர்க்கத் தொடர்பு காக்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
