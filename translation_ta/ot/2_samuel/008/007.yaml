  edition: WLC
  text: וַ/יִּקַּ֣ח דָּוִ֗ד אֵ֚ת שִׁלְטֵ֣י הַ/זָּהָ֔ב אֲשֶׁ֣ר הָי֔וּ אֶ֖ל עַבְדֵ֣י הֲדַדְעָ֑זֶר וַ/יְבִיאֵ֖/ם יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/007.yaml
  text: And David took the shields of gold that belonged to the servants of Hadadezer and brought them to Jerusalem[a].
translation:
  language: ta
  text: தாவீது ஆதாதேசரின் பணியாளர்களுக்குச் சொந்தமான தங்கக் கேடயங்களை[a] எடுத்தான்; அவற்றை எருசலேமுக்குக் கொண்டுவந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘தங்கத்தின் கேடயங்கள்’; அல்லது, ‘தங்கக் கேடயங்கள்.’ சிறுபான்மைக் கருத்தின்படி, இந்தச் சொல் ‘அம்பறாத்தூணிகள்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்துக்கொண்டு
  rationale: לקח என்பது கதைநடையில் பொதுவாக ‘எடு’ எனப் பொருள்படும். போர்ச் சூழல் இருந்தாலும், ‘கைப்பற்றினான்’ என்று வன்முறையின் நுணுக்கத்தைத் தேவையின்றிச் சேர்க்காமல் மூலத்தின் பரந்த பொருளை இது காக்கிறது.
- source_word: שִׁלְטֵי הַזָּהָב
  choice: தங்கக் கேடயங்களை
  rationale: שׁלטים என்பதற்கான மரபானதும் சூழலுக்கு ஏற்றதுமான பொருள் ‘கேடயங்கள்.’ எபிரெயக் கட்டமைப்பை இயல்பான நவீனத் தமிழில் ‘தங்கக் கேடயங்கள்’ என வழங்கப்பட்டுள்ளது; ‘அம்பறாத்தூணிகள்’ என்பது சிறுபான்மை சொற்பொருள் கருத்து.
- source_word: אֲשֶׁר הָיוּ אֶל
  choice: சொந்தமான
  rationale: இச்சூழலில் இச்சொற்றொடர் வெறும் அருகாமையை அல்லாமல் உடைமை அல்லது தொடர்பைக் குறிக்கிறது. ‘சொந்தமான’ என்பது அந்த உறவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: அதாதேசரின் பணியாளர்கள்
  rationale: עבדים என்பது சூழலுக்கேற்ப அடிமைகள், பணியாளர்கள் அல்லது அரச அலுவலர்களைக் குறிக்கலாம். இங்கு அரசனோடு தொடர்புடைய சேவகர்களைக் குறிக்கும் பொதுவான, தேவையற்ற சமூக நிலைத் தீர்மானத்தைத் தவிர்க்கும் சொல்லாக ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיְבִיאֵם
  choice: அவற்றை ... கொண்டுவந்தான்
  rationale: בוא என்பதன் ஹிபீல் வடிவம் பொதுவாக ‘கொண்டுவருதல்’ என்று பொருள்படும்; பன்மைச் சுட்டுப்பெயர் கேடயங்களைக் குறிக்கும் வகையில் ‘அவற்றை’ எனத் தெளிவாக வழங்கப்பட்டுள்ளது.
- source_word: יְרוּשָׁלִָם
  choice: எருசலேம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம்.
