base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/008.yaml
  text: But Abner son of Ner[a], the commander of Saul’s army, took Ish-bosheth son of Saul and brought him over to Mahanaim.
translation:
  language: ta
  text: ஆனால் நேரின் மகனும் சவுலின் படைத்தலைவனுமான அப்னேர், சவுலின் மகன் இஸ்போசேத்தை அழைத்துக்கொண்டு மகனாயீமுக்குக் கொண்டுபோனான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 நாளாகமம் 8:33; 9:39 ஆகிய இடங்களில் இஸ்போசேத் “எஷ்பால்” என்று அழைக்கப்படுகிறார்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַבְנֵר
  choice: ஆனால் அப்னேர்
  rationale: וְ என்பது பொதுவாக ‘மற்றும்’ எனப் பொருள்பட்டாலும், முந்தைய வசனத்தில் தாவீது யூதாவின் அரசனாக அபிஷேகம் செய்யப்பட்டதற்கு மாறாக இங்கு அப்னேர் சவுலின் மகனை முன்னிறுத்துவதால், கதைநடை முரண்பாட்டை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֶּן נֵר
  choice: நேரின் மகன்
  rationale: எபிரெய மரபுத் தொடர்பைத் தெளிவாகவும் இயல்பான தமிழிலும் காட்டுகிறது.
- source_word: שַׂר צָבָא אֲשֶׁר לְ/שָׁאוּל
  choice: சவுலின் படைத்தலைவன்
  rationale: שַׂר צָבָא என்பது படையின் தலைமைத் தளபதி அல்லது படைத்தலைவனைக் குறிக்கிறது; சவுலுடனான உரிமைத் தொடர்பையும் இச்சொற்றொடர் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: לָקַח
  choice: அழைத்துக்கொண்டு
  rationale: அடிப்படைப் பொருள் ‘எடுத்தான்/கொண்டான்’; இங்கு ஒருவரை ஓர் இடத்துக்குக் கொண்டுசெல்லும் சூழலில் ‘அழைத்துக்கொண்டு’ என்பது வன்முறையைத் தேவையின்றி சேர்க்காமல் இயல்பாக அமைகிறது.
- source_word: אִישׁ בֹּשֶׁת
  choice: இஸ்போசேத்
  rationale: WLC மெய்யெழுத்து உரையில் உள்ள நபர்பெயர் ஒலிபெயர்க்கப்படுகிறது; நாளாகமத்தில் காணப்படும் எஸ்பால் என்ற பெயர்வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַ/יַּעֲבִרֵ/הוּ
  choice: அவனை ... கொண்டுபோனான்
  rationale: עבר என்பதன் ஹிஃபில் வடிவம் ‘கடக்கச் செய்தல்/அப்பால் கொண்டுசெல்லுதல்’ என்ற காரணவினைப் பொருளைக் கொண்டது. இவ்வசனம் கடந்து சென்ற பாதையையோ நீர்நிலையையோ குறிப்பிடாததால், தமிழில் இயல்பான ‘கொண்டுபோனான்’ பயன்படுத்தப்படுகிறது.
- source_word: מַחֲנָיִם
  choice: மக்னாயீம்
  rationale: இடப்பெயர் அதன் எபிரெய ஒலிக்கு அணுக்கமாகத் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
