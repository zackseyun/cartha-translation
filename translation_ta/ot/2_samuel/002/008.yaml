translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொல் வரிசையைச் சுமையாகப் பின்பற்றாமல், ‘நேரின் மகனும் சவுலின் படைத்தலைவனுமான அப்னேர்’ எனத் தொடர்புகள் தெளிவுபடுத்தப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு தொடர்புடைய வாக்கியத்தின் முடிவில் வைக்கப்பட்டுள்ளது.
