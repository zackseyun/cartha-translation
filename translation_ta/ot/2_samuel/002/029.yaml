  register: நவீனத் தரத் தமிழில், வரலாற்றுக் கதையாடலுக்கேற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. புவியியல் பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டன; பித்ரோன் குறித்த மூலமொழியின் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
