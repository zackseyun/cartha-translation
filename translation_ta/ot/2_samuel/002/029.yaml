source:
  edition: WLC
  text: וְ/אַבְנֵ֣ר וַֽ/אֲנָשָׁ֗י/ו הָֽלְכוּ֙ בָּֽ/עֲרָבָ֔ה כֹּ֖ל הַ/לַּ֣יְלָה הַ/ה֑וּא וַ/יַּעַבְר֣וּ אֶת הַ/יַּרְדֵּ֗ן וַ/יֵּֽלְכוּ֙ כָּל הַ/בִּתְר֔וֹן וַ/יָּבֹ֖אוּ מַחֲנָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/029.yaml
  text: And Abner and his men traveled through the Arabah all that night[a], crossed the Jordan, went through all the Bithron, and came to Mahanaim.
translation:
  language: ta
  text: அப்னேரும் அவனுடைய ஆட்களும் அந்த இரவு முழுவதும் அரபா வழியாகப் பயணித்து, யோர்தானைக் கடந்து, பித்ரோன்[a] பகுதி முழுவதையும் கடந்து சென்று, மகனாயீமை வந்தடைந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பள்ளத்தாக்கு/கணவாய்ப் பகுதி முழுவதையும்.’ ‘பித்ரோன்’ என்ற எபிரெயச் சொல் ஓர் இடப்பெயராகவோ, ஒரு நில அமைப்பை விவரிக்கும் சொல்லாகவோ இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֲרָבָה
  choice: அரபா வழியாக
  rationale: இது பொதுவான ‘சமவெளி’ என்பதைவிட யோர்தான் பள்ளத்தாக்கைச் சார்ந்த ‘அரபா’ என்ற புவியியல் பகுதியைக் குறிக்க வாய்ப்புள்ளது. பயணப் பாதையைக் கூறும் சூழலில் இடப்பெயரின் தன்மையைப் பாதுகாக்க ‘அரபா’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: כָּל הַלַּיְלָה הַהוּא
  choice: அந்த இரவு முழுவதும்
  rationale: குறிப்பிட்ட அந்த இரவு முழுவதும் பயணம் தொடர்ந்ததைக் குறிக்கும் எபிரெயச் சொற்றொடரை இயல்பான நவீன தமிழில் நேர்த்தியாக வெளிப்படுத்துகிறது.
- source_word: וַיַּעַבְרוּ אֶת־הַיַּרְדֵּן
  choice: யோர்தானைக் கடந்து
  rationale: עבר என்ற வினைச்சொல் இங்கு யோர்தான் ஆற்றைக் கடப்பதைத் தெளிவாகக் குறிக்கிறது; ‘கடந்து’ என்பது சுருக்கமான, இயல்பான தமிழ் இணை.
- source_word: כָּל הַבִּתְרוֹן
  choice: பித்ரோன் பகுதி முழுவதையும்
  rationale: הַבִּתְרוֹן என்பது ஓர் இடப்பெயராகவோ, பள்ளத்தாக்கு அல்லது பிளவுபட்ட நிலப்பகுதியைக் குறிக்கும் புவியியல் சொல்லாகவோ இருக்கலாம். உறுதியற்ற பொருளைத் தீர்மானித்துவிடாமல் ‘பித்ரோன்’ என ஒலிபெயர்த்து, பயணப் பகுதி என்பதைக் காட்ட ‘பகுதி’ சேர்க்கப்பட்டது.
- source_word: מַחֲנָיִם
  choice: மகனாயீம்
  rationale: இது தனிப்பட்ட இடப்பெயர் என்பதால் மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הָלְכוּ / וַיֵּלְכוּ / וַיָּבֹאוּ
  choice: பயணித்து ... கடந்து சென்று ... வந்தடைந்தார்கள்
  rationale: நீண்ட பயணம், ஒரு பகுதி வழியாகச் செல்லுதல், இலக்கை அடைதல் என்ற இயக்கத்தின் தொடர்ச்சியை இயல்பான தமிழ் வினைச்சொற்கள் வெளிப்படுத்துகின்றன.
- source_word: וַאֲנָשָׁיו
  choice: அவனுடைய ஆட்கள்
  rationale: சொல்லின் நேரடிப் பொருள் ‘அவனுடைய ஆட்கள்.’ இராணுவச் சூழல் இருந்தாலும் ‘வீரர்கள்’ என்று விளக்கமாக்காமல் மூலத்தின் பொதுவான சொல்லாட்சியே பாதுகாக்கப்பட்டது.
