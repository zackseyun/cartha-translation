base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/010.yaml
  text: Ish-bosheth son of Saul was forty years old when he began to reign over Israel[a], and he reigned two years[c][b]. But the house of Judah followed David.
translation:
  language: ta
  text: சவுலின் மகன் இஸ்போசேத்[a] இஸ்ரவேலின்மேல் அரசாளத் தொடங்கியபோது நாற்பது வயதுடையவனாக இருந்தான்; அவன் இரண்டு ஆண்டுகள் அரசாண்டான். ஆனால் யூதாவின் வீட்டார்[b] தாவீதைப் பின்பற்றினார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மசோரெட்டிக் உரையில் இப்பெயர் ‘இஸ்போசேத்’ என்று உள்ளது; தொடர்புடைய பிற மரபுகளில் ‘எஷ்பால்’ என்ற மாற்றுப் பெயர்வடிவத்தையும் ஒப்பிடுக.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் ‘யூதாவின் வீடு’; இது யூதா கோத்திரத்தையோ அதன் அரசியல் சமூகத்தையோ ஒட்டுமொத்தமாகக் குறிக்கும் சொற்றொடர்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘தாவீதுக்கு விசுவாசமாக இருந்தார்கள்’ / ‘தாவீதின் பக்கம் இருந்தார்கள்.’ எபிரெயத்தில் சொல்லளவில் ‘தாவீதுக்குப் பின்னால் இருந்தார்கள்’; இது பற்றுறுதியைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: நாற்பது வயதுடையவனாக இருந்தான்
  rationale: இது வயதைக் குறிக்கும் வழக்கமான எபிரெய மரபுத்தொடர். தமிழில் இயல்பாகவும் தெளிவாகவும் அதன் நேரடிப் பொருள் தரப்பட்டுள்ளது.
- source_word: אִישׁ בֹּשֶׁת
  choice: இஸ்போசேத்
  rationale: WLC மசோரெட்டிக் உரையில் உள்ள பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு தக்கவைக்கப்பட்டுள்ளது; தொடர்புடைய பிற மரபுகளில் காணப்படும் எஸ்பால் என்ற வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: בְּמָלְכוֹ
  choice: அரசாளத் தொடங்கியபோது
  rationale: இங்கு בְּ காலத்தைக் குறிக்கிறது; அரசாட்சித் தொடக்கத்தில் இருந்த வயதைச் சொல்லும் அரசர் வரலாற்று வாய்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல்
  rationale: அரசாட்சிச் சூழலில் עַל ஒரு மக்களின்மேல் செலுத்தப்படும் ஆட்சியதிகாரத்தைக் குறிக்கிறது.
- source_word: וּשְׁתַּיִם שָׁנִים מָלָךְ
  choice: அவன் இரண்டு ஆண்டுகள் அரசாண்டான்
  rationale: அரசாட்சியின் கால அளவைக் கூறும் எபிரெய வாய்பாட்டை நேராகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: אַךְ
  choice: ஆனால்
  rationale: இஸ்போசேத்தின் இஸ்ரவேல் ஆட்சிக்கும் தாவீதுக்கான யூதாவின் ஆதரவுக்கும் இடையிலான முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: בֵּית יְהוּדָה
  choice: யூதா வீட்டார்
  rationale: ‘யூதாவின் வீடு’ என்ற எபிரெயக் கூட்டுப் பொருளைத் தக்கவைத்தபடியே, யூதா கோத்திரம் அல்லது அரசியல் சமூகத்தைக் குறிக்கும் தமிழ்ச் சொல்லாக்கம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָיוּ אַחֲרֵי דָוִד
  choice: தாவீதைப் பின்பற்றினார்கள்
  rationale: சொல்லளவில் ‘தாவீதுக்குப் பின்னால் இருந்தார்கள்’ என்றாலும், இது ஆதரவு அல்லது விசுவாசமான சார்பைக் குறிக்கும் மரபுத்தொடர். ‘பின்பற்றினார்கள்’ அந்த அரசியல் பற்றுறுதியை மிகையாக விளக்காமல் வெளிப்படுத்துகிறது.
