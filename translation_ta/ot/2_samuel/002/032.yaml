base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/032.yaml
  text: They carried Asahel and buried him in his father's tomb[a], which was at Bethlehem. Then Joab and his men traveled all night[b], and daybreak came upon them at Hebron.
translation:
  language: ta
  text: அவர்கள் ஆசகேலைச் சுமந்துசென்று, பெத்லெகேமில் இருந்த அவனுடைய தந்தையின் கல்லறையில்[a] அவனை அடக்கம் செய்தார்கள். பின்பு யோவாபும் அவனுடைய ஆட்களும் இரவு முழுவதும் பயணம் செய்தார்கள்; எப்ரோனில் அவர்களுக்குப் பொழுது விடிந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனுடைய தந்தையின் புதைகுழியில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் קֶבֶר ஒரு புதைகுழியையோ, கல்லறையையோ, குடும்ப அடக்க இடத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘எப்ரோனில் அவர்களுக்கு வெளிச்சமானது.’ இதை, ‘எப்ரோனில் அவர்கள்மேல் விடியல் வந்தது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: சுமந்துகொண்டு போய்
  rationale: இச்சூழலில் נשׂא என்பது அடக்கம் செய்வதற்காக ஆசகேலின் உடலை எடுத்துச் செல்வதைக் குறிக்கிறது; நவீன தமிழில் இயல்பாக இதைத் தெரிவிக்கிறது.
- source_word: עֲשָׂהאֵל
  choice: ஆசகேல்
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப வழங்கப்பட்டுள்ளது.
- source_word: וַיִּקְבְּרֻהוּ
  choice: அவனை அடக்கம் செய்தார்கள்
  rationale: קבר என்பதன் சாதாரண பொருள் புதைத்தல் அல்லது அடக்கம் செய்தல்; மரியாதையான மனித அடக்கச் சூழலில் ‘அடக்கம் செய்தார்கள்’ இயல்பானது.
- source_word: בְּקֶבֶר אָבִיו
  choice: அவனுடைய தந்தையின் கல்லறையில்
  rationale: קֶבֶר என்பது தனிக் குழியையோ கல்லறை/குடும்ப அடக்க இடத்தையோ குறிக்கலாம்; ‘கல்லறை’ அந்தப் பொருள் வரம்பைப் பெரிதும் காக்கிறது.
- source_word: אֲשֶׁר בֵּית לָחֶם
  choice: பெத்லெகேமில் இருந்த
  rationale: உறவுப்பெயர் தொடர் தந்தையின் கல்லறை அமைந்திருந்த இடத்தைச் சுட்டுகிறது; தமிழில் இவ்வடிவம் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַיֵּלְכוּ כָל הַלַּיְלָה
  choice: இரவு முழுவதும் பயணம் செய்தார்கள்
  rationale: הלך என்பது செல்லுதல், நடத்தல், பயணித்தல் என்ற பரந்த பொருளுடையது; ‘பயணம் செய்தார்கள்’ என்பது இரவெங்கும் தொடர்ந்த நகர்வைக் காட்டுகிறது, ஆனால் ‘அணிவகுத்துச் சென்றார்கள்’ என்று தேவையின்றி இராணுவ முறையைத் திணிக்கவில்லை.
- source_word: יוֹאָב וַאֲנָשָׁיו
  choice: யோவாபும் அவனுடைய ஆட்களும்
  rationale: אֲנָשָׁיו என்பதன் நேரடிப் பொருள் ‘அவனுடைய ஆட்கள்’; சூழலில் அவர்கள் போர்வீரர்கள் என்றாலும் மூலத்தின் பொதுவான சொல்லை இது காக்கிறது.
- source_word: וַיֵּאֹר לָהֶם
  choice: அவர்கள் எப்ரோனை அடைந்தபோது பொழுது விடிந்தது
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘அவர்களுக்கு வெளிச்சமானது’ என்கிறது. தமிழில் ‘பொழுது விடிந்தது’ என்பது இயல்பான இணை; இடப்பெயருடனான தொடர்பை ‘அடைந்தபோது’ தெளிவாக்குகிறது, அதேவேளை மாற்று நேரடி நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּחֶבְרוֹן
  choice: எப்ரோனை அடைந்தபோது
  rationale: בְּ முன்னிடைச்சொல் இங்கு எப்ரோனில்/எப்ரோன் வந்தபோது என்ற இட-வருகை நுணுக்கத்தை அனுமதிக்கிறது; தமிழ்க் கதையோட்டத்தில் இவ்வடிவம் இயல்பானது.
