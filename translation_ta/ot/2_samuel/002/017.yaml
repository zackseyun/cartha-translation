  text: וַ/תְּהִ֧י הַ/מִּלְחָמָ֛ה קָשָׁ֥ה עַד מְאֹ֖ד בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יִּנָּ֤גֶף אַבְנֵר֙ וְ/אַנְשֵׁ֣י יִשְׂרָאֵ֔ל לִ/פְנֵ֖י עַבְדֵ֥י דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/017.yaml
  text: The battle was very fierce that day[b][a], and Abner and the men of Israel were defeated before the servants of David.
translation:
  language: ta
  text: அந்த நாளில் போர் மிகவும் கடுமையாக நடந்தது.[a] அப்னேரும் இஸ்ரவேல் வீரர்களும் தாவீதின் பணியாளர்களுக்கு முன்பாகத் தோற்கடிக்கப்பட்டார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நாளில் போர் மிகவும் உக்கிரமாக இருந்தது.”
    reason: lexical_alternative
  - marker: b
    text: “தாவீதின் பணியாளர்கள்” என்பது தாவீதின் படைவீரர்களையோ அவருக்குச் சேவை செய்த உடன்படையினரையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּלְחָמָה
  choice: போர்
  rationale: உடனடி சூழலில் இது நீண்டகாலப் போரை அல்ல, குறிப்பிட்ட மோதலைக் குறிக்கிறது; தமிழில் ‘போர்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: קָשָׁה עַד מְאֹד
  choice: மிகவும் கடுமையாக நடந்தது
  rationale: קָשָׁה என்பதன் ‘கடினமான/கடுமையான’ பொருளையும் עַד מְאֹד தரும் மிகுதியையும் காக்கிறது; போரைக் குறித்து நவீன தமிழில் இயல்பான சொல்லாக்கம்.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்த நாளில்
  rationale: எபிரெய காலச் சுட்டை நேரடியாகவும் இயல்பான தமிழிலும் வழங்குகிறது.
- source_word: וַיִּנָּגֶף
  choice: தோற்கடிக்கப்பட்டார்கள்
  rationale: நָגַף என்பதன் நிஃபால் வடிவம் இப்போர்ச் சூழலில் எதிரியின் முன் தோல்வியடைதலைக் குறிக்கிறது; வெறுமனே உடலால் தாக்கப்பட்டார்கள் என்ற பொருளைத் தவிர்க்கிறது.
- source_word: אַבְנֵר
  choice: அப்னேர்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பைத் தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: וְאַנְשֵׁי יִשְׂרָאֵל
  choice: இஸ்ரவேல் வீரர்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் ஆண்கள்’ என்றாலும், இச்சூழலில் அப்னேருடன் போரிட்ட படைவீரர்களையே குறிக்கிறது; ‘வீரர்கள்’ பாலினமும் இராணுவச் சூழலும் தெளிவாகத் தருகிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: எதிரிப் படையின் முன் தோல்வியடைந்தனர் என்ற எபிரெய இராணுவ மரபுத்தொடரைப் பாதுகாக்கிறது.
- source_word: עַבְדֵי דָוִד
  choice: தாவீதின் பணியாளர்கள்
  rationale: עֶבֶד என்பதன் சேவையிலிருப்போர் என்ற அடிப்படைப் பொருளைத் தக்கவைக்கிறது; இங்கு அது தாவீதின் படையினரையோ உடன்படையினரையோ குறிக்கலாம்.
