translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘முன்பாக’ என்ற மூலமொழி மரபுத்தொடர் பாதுகாக்கப்பட்டுள்ளது; ‘பணியாளர்கள்’ என்பதன் சூழல்சார் இராணுவப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
