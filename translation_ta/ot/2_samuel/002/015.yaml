translation_notes:
  register: நவீன தரத் தமிழில், வரலாற்றுக் கதைநடைக்கு ஏற்ற கண்ணியமான மற்றும் தெளிவான நடை பயன்படுத்தப்பட்டுள்ளது. ‘எண்ணிக்கையின்படி’ எபிரெயச் சொற்றொடரின் சுருக்கத்தைக் காக்கிறது; ‘பணியாளர்கள்’ என்பது சொற்பொருளைத் தக்கவைத்தபடியே அரச-படைச் சேவையினரையும் உள்ளடக்கக்கூடியதாக உள்ளது.
