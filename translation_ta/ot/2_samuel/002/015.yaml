  text: וַ/יָּקֻ֖מוּ וַ/יַּעַבְר֣וּ בְ/מִסְפָּ֑ר שְׁנֵ֧ים עָשָׂ֣ר לְ/בִנְיָמִ֗ן וּ/לְ/אִ֥ישׁ בֹּ֨שֶׁת֙ בֶּן שָׁא֔וּל וּ/שְׁנֵ֥ים עָשָׂ֖ר מֵ/עַבְדֵ֥י דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/015.yaml
  text: 'So they arose and crossed over by number: twelve for Benjamin and for Ish-bosheth the son of Saul[d][c][b][a], and twelve from the servants of David.'
translation:
  language: ta
  text: 'அவர்கள் எழுந்து, எண்ணிக்கையின்படி கடந்து சென்றார்கள்[a]: பென்யமீனுக்காகவும்[b] சவுலின் மகன் இஸ்போசேத்துக்காகவும்[c] பன்னிரண்டு பேர்; தாவீதின் பணியாளர்களில்[d] பன்னிரண்டு பேர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடந்து போனார்கள்’ அல்லது ‘அப்பால் சென்றார்கள்.’ எபிரெய வினைச்சொல் குறிப்பிட்ட இடத்திற்குக் கடந்து செல்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பென்யமீனிலிருந்து.’ எபிரெய முன்னொட்டு பிறப்பிடத்தையோ சார்பையோ குறிக்கலாம்; இங்கு அவர்கள் பென்யமீனையும் இஸ்போசேத்தையும் பிரதிநிதித்துவப்படுத்தியதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் ‘இஷ்-போஷெத்’; பழைய ஏற்பாட்டு உரை மரபில் இதனோடு தொடர்புடைய ‘எஷ்பால்’ என்ற பெயர் வடிவமும் வேறு இடங்களில் வருகிறது.
    reason: alternative_reading
  - marker: d
    text: அல்லது, ‘தாவீதின் பணியாளர்களிலிருந்து’ அல்லது பொருள் விளக்கமாக, ‘தாவீதின் ஆட்களில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: அவர்கள் எழுந்து
  rationale: קום என்பதன் தொடர் இறந்தகால வடிவம் அடுத்த நிகழ்வைச் சொல்கிறது; ‘எழுந்து’ என்பது எளிய, இயல்பான தமிழ் நடையாகும்.
- source_word: וַיַּעַבְרוּ
  choice: கடந்து சென்றார்கள்
  rationale: עבר இங்கு ஒரு பக்கத்திலிருந்து குறிப்பிட்ட இடத்திற்குக் கடந்து செல்வதைக் குறிக்கிறது; போட்டிக்கான இடத்திற்குள் அவர்கள் சென்ற சூழலுக்கும் இது பொருந்துகிறது.
- source_word: בְמִסְפָּר
  choice: எண்ணிக்கையின்படி
  rationale: இரு தரப்பிலிருந்தும் கணக்கிட்டு, சம எண்ணிக்கையில் ஆட்கள் வந்ததை எபிரெயச் சொற்றொடருக்கு நெருக்கமாகத் தெரிவிக்கிறது.
- source_word: שְׁנֵים עָשָׂר
  choice: பன்னிரண்டு பேர்
  rationale: எண்ணை நேரடியாக மொழிபெயர்த்து, தமிழில் மனிதர்களைக் குறிக்க ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: לְבִנְיָמִן
  choice: பென்யமீனுக்காக
  rationale: לְ இங்கு வெறும் பிறப்பிடத்தைவிடச் சார்பு அல்லது பிரதிநிதித்துவத்தைக் குறிக்கிறது.
- source_word: וּלְאִישׁ בֹּשֶׁת
  choice: இஸ்போசேத்துக்காகவும்
  rationale: மசோரா உரையின் பெயர் வடிவம் ஒலிபெயர்க்கப்பட்டுள்ளது; முன்னொட்டு அந்தப் பன்னிரண்டு பேரும் இஸ்போசேத்தின் தரப்பினர் என்பதைக் காட்டுகிறது.
- source_word: בֶּן שָׁאוּל
  choice: சவுலின் மகன்
  rationale: அடையாளப்படுத்தும் எளிய மகன் உறவு நேரடியாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: מֵעַבְדֵי דָוִד
  choice: தாவீதின் பணியாளர்களிலிருந்து
  rationale: עבדים என்பதன் அடிப்படைப் பொருளான சேவையில் இருப்பவர்களை ‘பணியாளர்கள்’ தெரிவிக்கிறது; அரசியல்-படைச் சூழலில் இது தாவீதின் ஆட்களையும் குறிக்கலாம்.
