source:
  edition: WLC
  text: וַ/יֵּצֵא֙ אַבְנֵ֣ר בֶּן נֵ֔ר וְ/עַבְדֵ֖י אִֽישׁ בֹּ֣שֶׁת בֶּן שָׁא֑וּל מִֽ/מַּחֲנַ֖יִם גִּבְעֽוֹנָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/012.yaml
  text: Then Abner son of Ner[a], and the servants of Ish-bosheth son of Saul, went out from Mahanaim to Gibeon.
translation:
  language: ta
  text: அப்போது நேரின் மகன் அப்னேரும், சவுலின் மகன் இஸ்போசேத்[a] என்பவனின் பணியாளர்களும் மக்னாயீமிலிருந்து கிபியோனுக்குப் புறப்பட்டுச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “இஸ்போசேத்”; இதே நபர் 1 நாளாகமம் 8:33; 9:39-இல் “எஷ்பால்” என்று அழைக்கப்படுகிறார்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: அப்போது ... புறப்பட்டுச் சென்றார்கள்
  rationale: வாவ் தொடர் கதையை அடுத்த நிகழ்வுக்கு நகர்த்துவதால் ‘அப்போது’ என இயல்பாக மொழிபெயர்க்கப்பட்டது. எபிரெய வினை ஒருமையில் இருந்தாலும், தொடர்ந்து வரும் இணை எழுவாய் அப்னேரையும் பணியாளர்களையும் உள்ளடக்குவதால் தமிழில் பன்மை வினை பயன்படுத்தப்பட்டது.
- source_word: אַבְנֵר בֶּן נֵר
  choice: நேரின் மகன் அப்னேர்
  rationale: தமிழின் இயல்பான உறவுமுறைச் சொல்லமைப்பில் தந்தையின் பெயர் முதலில் வருமாறு வழங்கப்பட்டுள்ளது; பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: וְעַבְדֵי
  choice: பணியாளர்களும்
  rationale: עֶבֶד என்பது சூழலுக்கேற்ப பணியாளர், ஊழியர் அல்லது அதிகாரியைச் சுட்டலாம். இங்கு இராணுவ-அரசியல் அணியை மிகையாகக் குறிப்பாக்காமல் அடிப்படைப் பொருளைப் பாதுகாக்க ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אִישׁ בֹּשֶׁת
  choice: இஸ்போசேத்
  rationale: மசோரா உரையில் உள்ள பெயரையே ஒலிபெயர்க்கிறது; நாளாகமத்தில் காணப்படும் எஷ்பால் என்ற மாற்றுப் பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בֶּן שָׁאוּל
  choice: சவுலின் மகன்
  rationale: இஸ்போசேத்தை அடையாளப்படுத்தும் தந்தை-மகன் உறவு நேரடியாகவும் இயல்பான தமிழிலும் வழங்கப்பட்டுள்ளது.
- source_word: מִמַּחֲנַיִם
  choice: மக்னாயீமிலிருந்து
  rationale: மִן முன்னொட்டின் புறப்படும் இடத்தைக் குறிக்கும் பொருள் ‘-இலிருந்து’ எனவும், இடப்பெயர் ஒலிபெயர்ப்பாகவும் வழங்கப்பட்டுள்ளது.
- source_word: גִּבְעֹנָה
  choice: கிபியோனுக்கு
  rationale: இடப்பெயருடன் சேர்ந்த திசைச்சுட்டு ה, அந்த இடத்தை நோக்கிய இயக்கத்தைக் காட்டுகிறது; தமிழில் இயல்பாக ‘கிபியோனுக்கு’ என வழங்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இராணுவப் பின்னணியை ஊகித்து ‘வீரர்கள்’ என்று மிகையாகக் குறிப்பாக்காமல், எபிரெயச் சொல்லின் பரந்த பொருளைத் தக்கவைக்கும் ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது. அடிக்குறிப்பு குறியீடு தொடர்புடைய பெயரான ‘இஸ்போசேத்’ என்பதற்குப் பின்னர் அமைக்காமல் வசன முடிவில் இடப்பட்டுள்ளது; வெளியீட்டு நடையில் பெயருக்குப் பின்னர் நகர்த்துவது தெளிவை உயர்த்தும்.
