base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/022.yaml
  text: Abner said again to Asahel[a], “Turn aside from following me. Why should I strike you to the ground? Then how could I lift up my face to Joab your brother?”
translation:
  language: ta
  text: அப்னேர் மீண்டும் அசகேலை நோக்கி, “என்னைப் பின்தொடர்வதை விட்டுத் திரும்பிப் போ. நான் ஏன் உன்னைத் தாக்கித் தரையில் வீழ்த்த வேண்டும்? பிறகு, உன் சகோதரன் யோவாபின் முகத்தை நான் எப்படி ஏறிட்டுப் பார்ப்பேன்?[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் சகோதரன் யோவாபை நான் எப்படி எதிர்கொள்வேன்?” எபிரெயில் சொல்லுக்குச் சொல், “உன் சகோதரன் யோவாபை நோக்கி என் முகத்தை நான் எப்படி உயர்த்துவேன்?”
    reason: எபிரெய மரபுத்தொடரின் நேரடி உருவகத்தையும், வெட்கமின்றி யோவாபை எதிர்கொள்ள இயலாமை என்ற அதன் இயல்பான பொருளையும் காட்டுகிறது.
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד אַבְנֵר לֵאמֹר
  choice: அப்னேர் மீண்டும் ... என்றான்
  rationale: ‘மேலும் மறுபடியும் சொல்லச் சேர்ந்தான்’ என்ற எபிரெயச் சொற்றொடர், அப்னேர் இன்னொரு முறை பேசினான் என்பதைக் குறிக்கிறது. ‘மீண்டும் ... என்றான்’ என்பது அதன் தொடர்ச்சித் தன்மையை இயல்பான தமிழில் தருகிறது.
- source_word: אֶל עֲשָׂהאֵל
  choice: அசகேலை நோக்கி
  rationale: אֶל இங்கு உரையின் இலக்காகிய நபரைக் குறிக்கிறது; தமிழில் ‘நோக்கி’ என்பது இயல்பான உரையாடல் வடிவம்.
- source_word: סוּר לְךָ מֵאַחֲרָי
  choice: என்னைப் பின்தொடர்வதை விட்டுத் திரும்பிப் போ
  rationale: סוּר என்பதின் ‘விலகு/திரும்பு’ என்ற இயக்கத்தையும், מֵאַחֲרַי என்பதின் ‘என்னைப் பின்தொடர்வதிலிருந்து’ என்ற பொருளையும் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: לָמָּה אַכֶּכָּה אַרְצָה
  choice: நான் ஏன் உன்னைத் தாக்கித் தரையில் வீழ்த்த வேண்டும்?
  rationale: נכה என்பதைக் ‘தாக்கு’ என்றும் אַרְצָה என்பதைக் ‘தரையில் வீழ்த்து’ என்றும் மொழிபெயர்த்து, மரணத்தை வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் வன்மையான காட்சியைப் பாதுகாக்கிறது.
- source_word: וְאֵיךְ אֶשָּׂא פָנַי אֶל יוֹאָב אָחִיךָ
  choice: பிறகு, உன் சகோதரன் யோவாபின் முகத்தில் நான் எப்படி விழிப்பேன்?
  rationale: ‘முகத்தை உயர்த்துதல்’ என்ற எபிரெய மரபுத்தொடர், வெட்கமின்றி ஒருவரை எதிர்கொள்ள முடிவதைக் குறிக்கிறது. தமிழின் இயல்பான ‘முகத்தில் விழிப்பது’ என்ற மரபுத்தொடர் அதே வெட்கம் மற்றும் உறவுப் பொறுப்பு சார்ந்த கருத்தை வெளிப்படுத்துகிறது; சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עֲשָׂהאֵל / אַבְנֵר / יוֹאָב
  choice: அசகேல் / அப்னேர் / யோவாப்
  rationale: எபிரெய தனிப்பெயர்களுக்கு நவீனத் தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்புகள் பயன்படுத்தப்பட்டுள்ளன.
