base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/024.yaml
  text: Joab and Abishai pursued Abner[a], and the sun went down; and they came as far as the hill of Ammah[b], which is opposite Giah on the way to the wilderness of Gibeon.
translation:
  language: ta
  text: யோவாபும் அபிசாயும் அப்னேரைத் துரத்தினார்கள்; சூரியன் மறைந்தது. அவர்கள் கிபியோன் வனாந்தரத்துக்குச் செல்லும் வழியில்[b], கீயாவுக்கு எதிரே[a] உள்ள அம்மா குன்றுவரை வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கீயாவுக்கு முன்னால்’; எபிரெயச் சொற்றொடர் ஓர் இடத்துக்கு முன்னால் அல்லது எதிரே உள்ள நிலையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கிபியோன் வனாந்தரத்துக்கான சாலையில்’; எபிரெயச் சொல் இடத்தைவிட அந்தப் பாதையையே வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ ... אַחֲרֵי אַבְנֵר
  choice: அப்னேரைத் துரத்திச் சென்றார்கள்
  rationale: רדף ... אחרי என்பது பகைமை அல்லது போர்ச் சூழலில் ஒருவரைப் பின்தொடர்ந்து துரத்துவதைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் செயலும் தொடர்ச்சியும் தெளிவாகின்றன.
- source_word: וְהַשֶּׁמֶשׁ בָּאָה
  choice: சூரியன் மறைந்தபோது
  rationale: எபிரெய மொழியில் சொற்படியாக ‘சூரியன் வந்தது’ என்பது சூரிய மறைவைக் குறிக்கும் மரபுத்தொடர். காலச் சூழலை இயல்பான தமிழில் வெளிப்படுத்த ‘மறைந்தபோது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְהֵמָּה בָּאוּ עַד
  choice: அவர்கள் ... வரை வந்தார்கள்
  rationale: עַד இடத்தைச் சார்ந்து இயக்கத்தின் இறுதி எல்லையைக் குறிக்கிறது; ‘வரை வந்தார்கள்’ அதனைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: גִּבְעַת אַמָּה
  choice: அம்மா குன்று
  rationale: இது இடப்பெயருடன் அமைந்த எபிரெய இணைப்புத் தொடர்; தமிழில் இயல்பாக ‘அம்மா குன்று’ என வழங்கப்படுகிறது.
- source_word: אֲשֶׁר עַל־פְּנֵי גִיחַ
  choice: கீயாவுக்கு எதிரே
  rationale: עַל־פְּנֵי என்பது ஒரு இடத்துக்கு முன்னால் அல்லது எதிரே இருப்பதைக் குறிக்கலாம்; திசையை ஊகிக்காமல் புவியியல் உறவை ‘எதிரே’ எனக் காட்டுகிறது.
- source_word: דֶּרֶךְ מִדְבַּר גִּבְעוֹן
  choice: கிபியோன் வனாந்தரத்துக்குச் செல்லும் வழியில்
  rationale: דֶּרֶךְ என்பது வழி அல்லது சாலையைக் குறிக்கும்; கிபியோனுடன் தொடர்புடைய வனாந்தரத்தை நோக்கிய பாதை என்ற உறவை வாசிக்க எளிதான தமிழில் தருகிறது.
- source_word: יוֹאָב / אֲבִישַׁי / אַבְנֵר / אַמָּה / גִּיחַ / גִּבְעוֹן
  choice: யோவாப் / அபிசாய் / அப்னேர் / அம்மா / கீயா / கிபியோன்
  rationale: ஆட்பெயர்களும் இடப்பெயர்களும் மூல எபிரெய ஒலிப்புக்கு நெருக்கமாகவும் தமிழ் வாசிப்புக்கு ஏற்றவாறும் ஒலிபெயர்க்கப்பட்டுள்ளன.
