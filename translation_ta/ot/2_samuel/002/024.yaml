translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்றுக் கதைநடைக்கு ஏற்ற கண்ணியமான எளிய நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர்ச்சியை இயல்பான தமிழ் காலத் துணைவாக்கியமாக மாற்றியுள்ளோம். பிரதான உரையில் உள்ள [a], [b] குறிகள் முறையே ‘எதிரே’ என்ற புவியியல் சொல்லுக்கும் ‘குன்றுவரை’ என்ற இயக்க எல்லைக்கும் இணைக்கப்பட்டுள்ளன.
