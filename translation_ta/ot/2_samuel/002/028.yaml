translation_notes:
  register: நவீன தரநிலைத் தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. போர்ச் சூழலை இயல்பாக வெளிப்படுத்துகிறது; அதேவேளை ‘மக்கள்’, ‘இஸ்ரவேல்’ போன்ற மூலத்தின் சொல் தேர்வுகளைப் பேணுகிறது.
