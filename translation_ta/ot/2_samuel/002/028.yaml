  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּתְקַ֤ע יוֹאָב֙ בַּ/שּׁוֹפָ֔ר וַ/יַּֽעַמְדוּ֙ כָּל הָ/עָ֔ם וְ/לֹֽא יִרְדְּפ֥וּ ע֖וֹד אַחֲרֵ֣י יִשְׂרָאֵ֑ל וְ/לֹֽא יָסְפ֥וּ ע֖וֹד לְ/הִלָּחֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/028.yaml
  text: Then Joab blew the trumpet[a], and all the people stood still, and they no longer pursued Israel or continued to fight.
translation:
  language: ta
  text: அப்போது யோவாப் கொம்பை[a] ஊதினார்; மக்கள் அனைவரும் அப்படியே நின்றுவிட்டார்கள். அவர்கள் இனி இஸ்ரவேலைத் துரத்தவுமில்லை, தொடர்ந்து போரிடவுமில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எக்காளத்தை”; எபிரெயச் சொல் שׁוֹפָר என்பது சமிக்ஞை கொடுக்கும் கருவியாகப் பயன்படுத்தப்பட்ட ஒரு கொம்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע
  choice: ஊதினார்
  rationale: שׁוֹפָר என்னும் சமிக்ஞைக் கருவியுடன் תקע என்பது அதனை ஊதுதல் அல்லது ஒலிக்கச் செய்தல் என்று பொருள்படும்; தமிழில் ‘ஊதினார்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בַּשּׁוֹפָר
  choice: கொம்பை
  rationale: שׁוֹפָר என்பது சமிக்ஞை கொடுப்பதற்குப் பயன்படுத்தப்பட்ட கொம்புக் கருவி. ‘கொம்பு’ அதன் இயல்பைத் தெளிவாகக் காட்டுகிறது; மூலத்தில் குறிப்பிடப்படாத ‘ஆட்டுக்கொம்பு’ என்ற கூடுதல் விவரத்தைத் தவிர்க்கிறது.
- source_word: וַיַּעַמְדוּ כָּל הָעָם
  choice: மக்கள் அனைவரும் அப்படியே நின்றுவிட்டார்கள்
  rationale: עמד என்பதன் ‘நிற்றல்’ என்ற அடிப்படைப் படிமத்தைப் பேணியபடி, இந்தப் போர்ச் சூழலில் அவர்கள் முன்னேறுவதை நிறுத்தினார்கள் என்ற பொருளை ‘நின்றுவிட்டார்கள்’ தெரிவிக்கிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: எபிரெய உரை நேரடியாக ‘மக்கள்’ என்கிறது. சூழலில் இது யோவாபின் படையினரைக் குறித்தாலும், மூலத்தின் பொதுவான சொல்லைத் தக்கவைத்துள்ளது.
- source_word: יִרְדְּפוּ עוֹד אַחֲרֵי יִשְׂרָאֵל
  choice: இனி இஸ்ரவேலைத் துரத்தவுமில்லை
  rationale: רדף אחרי என்பது ‘பின்னால் துரத்துதல்’; மறுப்புடன் வரும் עוֹד ‘இனி இல்லை’ என்ற பொருளைத் தருகிறது. ‘இஸ்ரவேல்’ என்ற மூலப் பெயரும் மாற்றமின்றித் தக்கவைக்கப்பட்டுள்ளது.
- source_word: וְלֹא יָסְפוּ עוֹד לְהִלָּחֵם
  choice: தொடர்ந்து போரிடவுமில்லை
  rationale: יסף + வினையெச்சம் ஒரு செயலை மேலும் செய்தல் அல்லது தொடர்தல் என்பதைக் குறிக்கிறது. மறுப்பும் עוֹד என்பதும் சேர்ந்து, அவர்கள் போரைத் தொடரவில்லை என்ற பொருளை அளிக்கின்றன.
