  text: וַ/יַּ֤עַל שָׁם֙ דָּוִ֔ד וְ/גַ֖ם שְׁתֵּ֣י נָשָׁ֑י/ו אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵלִ֔ית וַ/אֲבִיגַ֕יִל אֵ֖שֶׁת נָבָ֥ל הַֽ/כַּרְמְלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/002.yaml
  text: 'So David went up there[a], and also his two wives: Ahinoam the Jezreelite and Abigail, the wife of Nabal the Carmelite.'
translation:
  language: ta
  text: அப்போது தாவீது அங்கே ஏறிச் சென்றான். அவனுடைய இரண்டு மனைவிகளான யெஸ்ரயேலைச் சேர்ந்த அகினோவாமும், கர்மேலைச் சேர்ந்த நாபாலின் மனைவியாகிய அபிகாயிலும் அவனோடு சென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל שָׁם
  choice: அங்கே ஏறிச் சென்றான்
  rationale: עלה என்பதன் மேல்நோக்கிய பயண நுணுக்கத்தை ‘ஏறிச் சென்றான்’ காக்கிறது; שָׁם ஏற்கெனவே சூழலில் குறிப்பிடப்பட்ட இடத்தை ‘அங்கே’ எனச் சுட்டுகிறது.
- source_word: וְגַם שְׁתֵּי נָשָׁיו
  choice: அவனுடைய இரண்டு மனைவிகளும் அவனோடு சென்றார்கள்
  rationale: וְגַם என்பதன் சேர்க்கைப் பொருளையும், இரண்டு மனைவிகளும் அதே பயணத்தில் பங்குபெற்றதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘அவனோடு’ என்பது எபிரெய வாக்கியத்தில் ஒரே வினைச்செயலின் கீழ் அவர்கள் சேர்க்கப்பட்டிருப்பதைத் தெளிவாக்குகிறது.
- source_word: אֲחִינֹעַם הַיִּזְרְעֵלִית
  choice: யெஸ்ரயேலைச் சேர்ந்த அகினோவாம்
  rationale: பெண்பால் குடியினப் பெயரடை அகினோவாமின் ஊர் அல்லது பகுதி சார்பைச் சுட்டுவதால், நவீன தமிழில் தெளிவாக ‘யெஸ்ரயேலைச் சேர்ந்த’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַאֲבִיגַיִל אֵשֶׁת נָבָל הַכַּרְמְלִי
  choice: கர்மேலைச் சேர்ந்த நாபாலின் மனைவியாகிய அபிகாயில்
  rationale: הַכַּרְמְלִי என்பது ஆண்பால் வடிவில் நாபாலைக் குறிப்பதால், கர்மேலைச் சேர்ந்தவர் நாபால் என்பது தெளிவாக வைக்கப்பட்டுள்ளது. ‘நாபாலின் மனைவி’ என்ற மூல அடையாளப்படுத்தல், இப்போது அபிகாயில் தாவீதின் மனைவியாக இருந்தாலும், முந்தைய கதைத்தொடர்பை காக்கிறது.
