translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாக வாசிக்க இரு வாக்கியங்களாக அமைக்கப்பட்டது. பெயர்களுக்கு தமிழில் பரவலாக அறியப்பட்ட வேதாகம ஒலிபெயர்ப்புகள் பயன்படுத்தப்பட்டுள்ளன. மொழிநடை எளிமையானதாயினும் கண்ணியமான வரலாற்றுக் கதையாடல் பாணியைப் பேணுகிறது.
