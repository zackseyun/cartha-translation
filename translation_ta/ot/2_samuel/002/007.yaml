  text: וְ/עַתָּ֣ה תֶּחֱזַ֣קְנָה יְדֵי/כֶ֗ם וִֽ/הְיוּ֙ לִ/בְנֵי חַ֔יִל כִּי מֵ֖ת אֲדֹנֵי/כֶ֣ם שָׁא֑וּל וְ/גַם אֹתִ֗/י מָשְׁח֧וּ בֵית יְהוּדָ֛ה לְ/מֶ֖לֶךְ עֲלֵי/הֶֽם׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/007.yaml
  text: Let your hands be strong[a], and be valiant men, for your lord Saul is dead, and the house of Judah also has anointed me king over them.
translation:
  language: ta
  text: இப்போது உங்கள் கைகள் வலிமை பெறட்டும்[a]; நீங்கள் வீரமிக்க ஆண்களாயிருங்கள். ஏனெனில், உங்கள் ஆண்டவரான சவுல் இறந்துவிட்டார்; யூதா குலத்தார் என்னையும்கூட தங்களுக்கு அரசனாக அபிஷேகம் செய்திருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கைகள் வலிமை பெறட்டும்’ என்பது துணிவடைந்து, திறமையுடன் செயல்படுங்கள் என்னும் பொருளுடைய எபிரேய மரபுத்தொடர்.
    reason: மூலத்தின் உடல் சார்ந்த உருவகம் தமிழில் தக்கவைக்கப்பட்டுள்ளதால் அதன் சூழல்சார் பொருளை விளக்குகிறது.
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: עַתָּה என்பது வெளிப்படையான காலச் சொல்லாக இருப்பதால் ‘இப்போது’ என மொழிபெயர்க்கப்பட்டது; וְ இங்கு உரையின் தொடர்ச்சியைக் காட்டுகிறது, தமிழில் தனியே ‘மேலும்’ என்று சேர்க்காமல் இயல்பாக விடப்பட்டுள்ளது.
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: உங்கள் கைகள் வலிமை பெறட்டும்
  rationale: எபிரேய மொழியின் ‘கைகள் வலிமை பெறுதல்’ என்ற உருவகத்தைத் தக்கவைக்கிறது. இது துணிவும் செயல் திறனும் பெறுவதைக் குறிக்கும் ஊக்கவுரை.
- source_word: וִהְיוּ לִבְנֵי חַיִל
  choice: நீங்கள் வீரமிக்க ஆண்களாயிருங்கள்
  rationale: בְּנֵי חַיִל என்பது இச்சூழலில் துணிவும் திறனும் கொண்ட ஆண்களைக் குறிக்கிறது. சவுலின் ஆண் ஆதரவாளர்களிடம் உரைக்கப்படுவதால் மூலத்தின் ஆண்பால் வடிவம் தக்கவைக்கப்பட்டது.
- source_word: כִּי מֵת אֲדֹנֵיכֶם שָׁאוּל
  choice: ஏனெனில், உங்கள் ஆண்டவனாகிய சவுல் இறந்துவிட்டார்
  rationale: כִּי என்பதன் காரணவிளக்கத் தொடர்பை ‘ஏனெனில்’ காட்டுகிறது. אֲדֹנֵיכֶם என்பது இங்கு சவுலின் அரசியல் அதிகாரத்தையும் மரியாதை நிலையையும் குறிக்கும் மனிதப் பட்டப்பெயர்.
- source_word: וְגַם אֹתִי מָשְׁחוּ
  choice: அவர்களும் என்னை ... அபிஷேகம் செய்திருக்கிறார்கள்
  rationale: גַם தரும் சேர்த்துக் கூறும் வலியுறுத்தலை ‘-உம்’ காட்டுகிறது. מָשַׁח என்பது எண்ணெய் பூசி அரசராக நியமிக்கும் சடங்குச் செயலைக் குறிப்பதால் ‘அபிஷேகம் செய்திருக்கிறார்கள்’ பயன்படுத்தப்பட்டது.
- source_word: בֵּית יְהוּדָה
  choice: யூதா குலத்தார்
  rationale: சொல்லுக்கு சொல் ‘யூதாவின் வீடு’ என்றாலும், இங்கு யூதா கோத்திரத்தைச் சேர்ந்த மக்களைக் கூட்டாகக் குறிக்கிறது; ‘யூதா குலத்தார்’ என்பது நவீன தமிழில் இயல்பாக அந்தக் கூட்டுப் பொருளைத் தருகிறது.
- source_word: לְמֶלֶךְ עֲלֵיהֶם
  choice: தங்களுக்கு அரசனாக
  rationale: தாவீது யூதா மக்கள்மீது அரசனாக நியமிக்கப்பட்ட ஆட்சியுறவை இயல்பான தமிழில் தெரிவிக்கிறது; நேர்கூற்றில் உள்ள மூன்றாம் நபர் பன்மை, தமிழ் மேற்கோள் சார்புக்கேற்ப ‘தங்களுக்கு’ என வழங்கப்பட்டது.
theological_decisions:
- issue: לִבְנֵי חַיִל என்பதிலுள்ள ஆண்பால் குறிப்பு
  choice: வீரமிக்க ஆண்களாயிருங்கள்
  alternative: வீரமுள்ளவர்களாயிருங்கள் / துணிவாயிருங்கள்
  rationale: மூலத்தில் ஆண்பால் பன்மை தெளிவாக உள்ளது; சூழலிலும் தாவீது சவுலின் ஆண் ஆதரவாளர்களிடம் பேசுகிறார். ஆகவே பாலினக் குறிப்பை பொதுமைப்படுத்தாமல் தக்கவைத்தது.
- issue: אֲדֹנֵיכֶם என்ற மனிதருக்குரிய மரியாதைப் பட்டம்
  choice: உங்கள் ஆண்டவனாகிய சவுல்
  alternative: உங்கள் தலைவனாகிய சவுல் / உங்கள் எஜமானாகிய சவுல்
  rationale: இச்சொல் இங்கு தேவனைக் குறிக்காமல் சவுலை அவர்களுடைய அதிகாரமுள்ள அரசராகக் குறிக்கிறது. ‘ஆண்டவன்’ அதன் மரியாதை மற்றும் ஆட்சிசார் நுணுக்கத்தைத் தக்கவைக்கிறது; ‘ஆகிய சவுல்’ அது மனிதருக்கான பயன்பாடு என்பதைத் தெளிவாக்குகிறது.
- issue: வְעַתָּה என்பதன் உரைத் தொடர்பு
  choice: இப்போது
  alternative: எனவே இப்போது / ஆகையால்
  rationale: மூலத்தில் עַתָּה (‘இப்போது’) வெளிப்படையாக உள்ளது. சூழலில் முடிவெடுக்க வேண்டிய தற்போதைய தருணத்தையும் இது சுட்டலாம்; காரணவிளைவாக மட்டும் தீர்மானிக்காமல் காலப் பொருள் தக்கவைக்கப்பட்டது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகருக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரேய உருவகமான ‘கைகள் வலிமை பெறுதல்’ தக்கவைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. ‘யூதா குலத்தார்’ என்பது בֵּית יְהוּדָה என்பதன் கூட்டுச் சமூகப் பொருளை இயல்பாக வழங்குகிறது.
