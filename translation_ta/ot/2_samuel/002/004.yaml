  yaml_path: translation/ot/2_samuel/002/004.yaml
  text: Then the men of Judah came[a], and there they anointed David king over the house of Judah. And they told David, saying, "The men of Jabesh-gilead were the ones who buried Saul."
translation:
  language: ta
  text: அப்போது யூதாவைச் சேர்ந்த ஆண்கள் வந்து, அங்கே தாவீதை யூதா வீட்டாரை ஆளும் அரசனாக அபிஷேகம் செய்தார்கள். பின்பு, “யாபேஸ்-கீலேயாத்தின் ஆண்கள்தான் சவுலை அடக்கம் செய்தார்கள்”[a] என்று தாவீதிடம் தெரிவித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது எளிமையாக, “யாபேஸ்-கீலேயாத்தின் ஆண்கள் சவுலை அடக்கம் செய்தார்கள்.”
    reason: אֲשֶׁר קָבְרוּ என்ற தொடர் அடையாள வலியுறுத்தலின்றி ஒரு சாதாரண உறவுத்தொடராகவும் மொழிபெயர்க்கப்படலாம்.
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: வந்து
  rationale: בוא என்பதன் தொடர் இறந்தகால வடிவம் இங்கு வருகையை விவரிக்கிறது; தமிழ்க் கதைநடையில் அடுத்த வினையுடன் இணையும் ‘வந்து’ இயல்பானது.
- source_word: אַנְשֵׁי יְהוּדָה
  choice: யூதாவைச் சேர்ந்த ஆண்கள்
  rationale: אַנְשֵׁי என்பதன் ஆண்பால் குறிப்பை ‘ஆண்கள்’ தக்கவைக்கிறது; ‘யூதாவைச் சேர்ந்த’ என்பது இயல்பான நவீனத் தமிழில் அவர்களது குழுச் சார்பைத் தெரிவிக்கிறது.
- source_word: וַיִּמְשְׁחוּ
  choice: அபிஷேகம் செய்தார்கள்
  rationale: அரசரை எண்ணெய் பூசி நிறுவும் משׁח என்ற சொல்லின் அரசியல் மற்றும் இறையியல் ஒலிப்பை வழக்கிலுள்ள ‘அபிஷேகம்’ தக்கவைக்கிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் எளிய வினையடை; முந்தைய வசனத்தின் எபிரோன் என்ற இடத்தைச் சுட்டுகிறது.
- source_word: לְמֶלֶךְ
  choice: அரசனாக
  rationale: அபிஷேகம் செய்யப்பட்ட பதவியைத் தமிழில் இயல்பாகக் குறிக்கும் பயனிலை வடிவம்.
- source_word: עַל בֵּית יְהוּדָה
  choice: யூதா வீட்டாரின் அரசனாக
  rationale: בֵּית என்பதன் குடும்ப/குலக் கூட்டமைப்புப் பொருளை ‘வீட்டார்’ தக்கவைக்கிறது; ‘வீடு’ என்று சொற்பட மொழிபெயர்ப்பதால் ஏற்படும் கட்டடப் பொருள் தவிர்க்கப்படுகிறது.
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: என்று தாவீதிடம் தெரிவித்தார்கள்
  rationale: נגד என்பதன் அறிவித்தல் பொருளையும் לֵאמֹר அறிமுகப்படுத்தும் நேர்கூற்றையும் இயல்பான தமிழ்ச் சொல்லமைப்பில் தருகிறது.
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: யாபேஸ்-கீலேயாத்தின் ஆண்கள்
  rationale: இடப்பெயரை ஒருங்கிணைந்த பெயராக ஒலிபெயர்த்து, אַנְשֵׁי என்பதன் ஆண்பால் குறிப்பையும் தக்கவைக்கிறது.
- source_word: אֲשֶׁר קָבְרוּ אֶת שָׁאוּל
  choice: ஆண்கள்தான் சவுலை அடக்கம் செய்தார்கள்
  rationale: உறவுப்பெயரெச்சத் தொடரில் உணரப்படக்கூடிய அடையாளப்படுத்தும் வலியுறுத்தலை ‘தான்’ வெளிப்படுத்துகிறது; எளிய உறவுத்தொடர் வாசிப்பும் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: אַנְשֵׁי என்ற ஆண்பால் கூட்டுப்பெயர்
  choice: இரு இடங்களிலும் ‘ஆண்கள்’ என்று மொழிபெயர்த்தல்
  alternative: மக்கள்; தலைவர்கள்
  rationale: எபிரெயச் சொல் இலக்கணத்திலும் சொற்பொருளிலும் ஆண்பாலைக் குறிக்கிறது. சூழலில் ஆண் பிரதிநிதிகள் அல்லது தலைவர்கள் குறிக்கப்படலாம்; ஆதாரத்தில் இல்லாத பொதுமைப்படுத்தலைத் தவிர்க்க ‘ஆண்கள்’ தக்கவைக்கப்படுகிறது.
- issue: בֵּית יְהוּדָה என்பதில் உள்ள ‘வீடு’ உருவகம்
  choice: ‘யூதா வீட்டார்’ என்ற கூட்டமைப்புச் சொல்லைத் தக்கவைத்தல்
  alternative: யூதா; யூதா கோத்திரம்
  rationale: இந்தச் சொற்றொடர் யூதாவின் குல/அரசியல் கூட்டமைப்பைக் குறிக்கிறது. ‘வீட்டார்’ மூல உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது; ‘கோத்திரம்’ எனக் குறுக்கமாக விளக்குவதைத் தவிர்க்கிறது.
- issue: אֲשֶׁר קָבְרוּ என்ற இறுதித் தொடரின் அடையாள வலியுறுத்தல்
  choice: ‘ஆண்கள்தான் ... அடக்கம் செய்தார்கள்’
  alternative: ‘ஆண்கள் ... அடக்கம் செய்தார்கள்’
  rationale: எபிரெய உறவுத்தொடர் சாதாரணமாகவும் அடையாளப்படுத்தும் வலியுடனும் புரிந்துகொள்ளப்படலாம். முதன்மை உரை வலியுறுத்தலை வெளிப்படுத்துகிறது; குறைந்த வலியுள்ள வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; இயல்பான கதைநடையுடன் மரியாதைமிக்க வேதாகமப் பதிவுநடை பயன்படுத்தப்பட்டுள்ளது. ‘அரசன்’, ‘அடக்கம் செய்தார்கள்’ போன்ற பொதுவாகப் புரியும் சொற்களுடன், அரச அபிஷேகத்தின் தனிப்பொருளுக்காக ‘அபிஷேகம்’ தக்கவைக்கப்பட்டுள்ளது.
