lexical_decisions:
- source_word: וַיְהִי
  choice: ஆகும்
  rationale: இங்கு היה என்பதன் தொடர்வடிவம் ஒரு சுருக்கக் கூற்றை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பான நிறைவுக் கூற்றாக மொழிபெயர்க்கப்பட்டது.
- source_word: מִסְפַּר הַיָּמִים
  choice: காலம்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘நாட்களின் எண்ணிக்கை’; இச்சூழலில் அது தாவீதின் ஆட்சிக்கால நீளத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
- source_word: אֲשֶׁר הָיָה דָוִד מֶלֶךְ
  choice: தாவீது ... அரசனாக இருந்த
  rationale: உறவுநிலைத் தொடரைத் தமிழில் இயல்பான பெயரெச்சத் தொடராக வழங்குகிறது.
- source_word: מֶלֶךְ
  choice: அரசன்
  rationale: அரச பதவியைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ்ச் சொல்.
- source_word: בְּחֶבְרוֹן
  choice: எப்ரோனில்
  rationale: בְּ முன்னொட்டு இங்கு இடத்தைக் குறிக்கிறது; நகருக்குள் இருந்த ஆட்சிமையத்தை இயல்பாகக் காட்டுகிறது.
- source_word: עַל בֵּית יְהוּדָה
  choice: யூதா வம்சத்தின்மேல்
  rationale: בֵּית என்பதன் கூட்டமைப்பு சார்ந்த பொருளைத் தக்கவைத்து, யூதாவைச் சேர்ந்த மக்களைக் குறிக்கும் இயல்பான தமிழாக்கம்.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: ஏழு ஆண்டுகளும் ஆறு மாதங்களும்
  rationale: குறிப்பிடப்பட்ட கால அளவை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
