translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பணியாளர்கள்’ என்பது மூலச் சொல்லின் பரப்பைத் தக்கவைக்கிறது; இராணுவச் சூழலை முன்னிட்டு ‘படைவீரர்கள்’ என்று மிகத் துல்லியப்படுத்தவில்லை. எதிரெதிர் நிலையைத் தெளிவாக்க ‘இந்தப் பக்கம்/அந்தப் பக்கம்’ என்ற இயல்பான தமிழ் அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
