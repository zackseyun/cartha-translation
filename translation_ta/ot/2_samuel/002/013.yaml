base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/013.yaml
  text: And Joab the son of Zeruiah and the servants of David went out and met them together by the pool of Gibeon. And these sat on one side of the pool[a], and those on the other side of the pool.
translation:
  language: ta
  text: செருயாவின் மகன் யோவாபும் தாவீதின் பணியாளர்களும் புறப்பட்டுச் சென்று, கிபியோனின் குளத்தருகே[a] அவர்களை ஒரே இடத்தில் சந்தித்தார்கள். இவர்கள் குளத்தின் இந்தப் பக்கத்திலும், அவர்கள் குளத்தின் அந்தப் பக்கத்திலும் அமர்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிபியோனின் நீர்த்தேக்கத்தருகே”; எபிரெயச் சொல் மனிதர்களால் அமைக்கப்பட்ட குளத்தையோ நீர்த்தேக்கத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב בֶּן צְרוּיָה
  choice: செருயாவின் மகன் யோவாபும்
  rationale: எபிரெயப் பெயர்களையும் குடும்ப அடையாளத்தையும் இயல்பான தமிழ் சொல்வரிசையில் துல்லியமாகத் தருகிறது; இணைப்பை ‘-உம்’ குறிக்கிறது.
- source_word: וְ/עַבְדֵי דָוִד
  choice: தாவீதின் பணியாளர்களும்
  rationale: עֶבֶד என்பதன் அடிப்படைச் சேவைச் சார்ந்த பொருளைப் பாதுகாக்கிறது; சூழலில் இவர்கள் போர்வீரர்களாக இருந்தாலும், மூலத்தில் வெளிப்படையாக இல்லாத ‘படைவீரர்கள்’ என்பதைச் சேர்க்கவில்லை.
- source_word: יָצְאוּ
  choice: புறப்பட்டுச் சென்று
  rationale: יצא என்பதன் ‘வெளியே செல்/புறப்படு’ என்ற இயக்கத்தை இயல்பான கதைநடைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַֽיִּפְגְּשׁוּם ... יַחְדָּו
  choice: அவர்களை ஒரே இடத்தில் சந்தித்தார்கள்
  rationale: வினையிலுள்ள பன்மைச் சுட்டுப்பெயர் பின்னொட்டின் ‘அவர்களை’ என்ற பொருளையும், יַחְדָּו குறிக்கும் ஒரே இடத்தில் நேருக்கு நேர் வந்த நிலையையும் பாதுகாக்கிறது; ‘ஒருவரையொருவர்’ என்று மாற்றி மூல இலக்கணத்தை மறுசீரமைக்கவில்லை.
- source_word: עַל בְּרֵכַת גִּבְעוֹן
  choice: கிபியோனின் குளத்தருகே
  rationale: בְּרֵכָה என்பதற்கு இச்சூழலில் இயல்பான ‘குளம்’ என்பதைத் தேர்ந்தெடுத்து, עַל குறிக்கும் இட உறவை ‘அருகே’ எனத் தருகிறது; ‘நீர்த்தேக்கம்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיֵּשְׁבוּ
  choice: அமர்ந்தார்கள்
  rationale: ישׁב என்பதன் இச்சூழலுக்குரிய நேரடியான பொருளை நவீன, கண்ணியமான தமிழில் தருகிறது.
- source_word: אֵלֶּה ... וְאֵלֶּה
  choice: இவர்கள் ... அவர்கள்
  rationale: இரு குழுக்களுக்கிடையேயான மூல demonstrative எதிர்மறையை கூடுதல் பெயர்ச்சொற்கள் இன்றிப் பாதுகாக்கிறது.
- source_word: עַל הַבְּרֵכָה מִזֶּה ... עַל הַבְּרֵכָה מִזֶּה
  choice: குளத்தின் இந்தப் பக்கத்திலும் ... குளத்தின் அந்தப் பக்கத்திலும்
  rationale: ஒரே குளத்தின் எதிரெதிர் பக்கங்களைக் குறிக்கும் எபிரெய இடவழக்கைத் தெளிவான, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
