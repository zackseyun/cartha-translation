source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח דָּוִד֙ מַלְאָכִ֔ים אֶל אַנְשֵׁ֖י יָבֵ֣ישׁ גִּלְעָ֑ד וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם בְּרֻכִ֤ים אַתֶּם֙ לַֽ/יהוָ֔ה אֲשֶׁ֨ר עֲשִׂיתֶ֜ם הַ/חֶ֣סֶד הַ/זֶּ֗ה עִם אֲדֹֽנֵי/כֶם֙ עִם שָׁא֔וּל וַֽ/תִּקְבְּר֖וּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/005.yaml
  text: Then David sent messengers to the men of Jabesh-gilead and said to them[a], “Blessed are you by Yahweh, because you have shown this kindness to your lord, to Saul[b], and have buried him.”
translation:
  language: ta
  text: பின்பு தாவீது யாபேசு-கிலேயாத்தின் ஆண்களிடம் தூதுவர்களை அனுப்பி, அவர்களிடம், “யாவேயால் நீங்கள் ஆசீர்வதிக்கப்பட்டவர்கள்[a]; ஏனெனில், உங்கள் தலைவனான சவுலுக்கு இந்த அன்பான செயலைச் செய்து[b], அவரை அடக்கம் செய்தீர்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே உங்களை ஆசீர்வதிப்பாராக!” இது ஒரு வாழ்த்து வழக்காகவும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ஹெசெத் (חֶסֶד); இச்சொல் அன்பு, இரக்கம், பற்றுறுதி, அல்லது உண்மையுள்ள அன்பு ஆகிய பொருள்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  choice: தூதுவர்கள்
  rationale: இக்கதைச் சூழலில் இது தாவீதால் அனுப்பப்பட்ட மனிதத் தூதுவர்களைக் குறிக்கிறது; வானதூதர்களைக் குறிக்கவில்லை.
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: யாபேசு-கிலேயாத்தின் ஆண்கள்
  rationale: எபிரெய மூலத்தில் ஆண்பால் பன்மைத் தொடர் வெளிப்படையாக இருப்பதால், பொதுவான ‘மக்கள்’ என்று மாற்றாமல் பாலினத் துல்லியம் காக்கப்பட்டுள்ளது.
- source_word: בְּרֻכִים אַתֶּם לַיהוָה
  choice: யாவேயால் ஆசீர்வதிக்கப்பட்டவர்கள் நீங்கள்
  rationale: בְּרֻכִים என்பது செயப்பாட்டு வினையெச்ச வடிவம்; எனவே இதை வெறும் வாழ்த்தாக மாற்றாமல், ஆசீர்வதிக்கப்பட்ட நிலையை நேரடியாகக் கூறும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. தமிழில் வலியுறுத்தலைத் தக்கவைக்க பயனிலை முன்னிறுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைப்பட்டம் அல்ல, நான்கு எழுத்துகளாலான தனிப்பெயர்; ஆகவே ‘கர்த்தர்’ என்று மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: חֶסֶד
  choice: அன்புச் செயல்
  rationale: இங்கு சவுலை அடக்கம் செய்த பற்றுறுதியான நன்மைச் செயலைக் குறிக்கிறது. இயல்பான நவீனத் தமிழுக்காக ‘அன்புச் செயல்’ பயன்படுத்தப்பட்டு, சொல்லின் அன்பு, பற்றுறுதி, இரக்கம் ஆகிய விரிந்த பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֲדֹנֵיכֶם
  choice: உங்கள் தலைவன்
  rationale: சவுல் அவர்களுடைய ஆட்சியாளராகவும் மதிப்புக்குரிய தலைவராகவும் இருந்த அரசியல் சூழலை இது இயல்பாக வெளிப்படுத்துகிறது; தெய்வீகப் பொருள் தோன்றக்கூடிய ‘ஆண்டவர்’ தவிர்க்கப்பட்டுள்ளது.
- source_word: עִם שָׁאוּל
  choice: சவுலுக்கு
  rationale: எபிரெய முன்னிடைச்சொல் சொற்பட ‘உடன்’ என்றாலும், ஒருவருக்கு அன்புச் செயல் செய்வது என்ற தமிழ்ச் சொல்லாட்சியில் ‘சவுலுக்கு’ என்பதே பொருளை இயல்பாகத் தருகிறது.
- source_word: וַתִּקְבְּרוּ אֹתוֹ
  choice: அவரை அடக்கம் செய்தீர்கள்
  rationale: பாராட்டப்படும் நிறைவுற்ற செயலைத் தெளிவாகவும் மரியாதையான இயல்பான தமிழிலும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் தனிப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல வசனம் இறைத் தனிப்பெயரையே பயன்படுத்துகிறது. ஆகவே பட்டப்பெயரால் மாற்றாமல், பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புக்கு ஏற்ப ‘யாவே’ என வழங்கப்பட்டுள்ளது.
- issue: בְּרֻכִים אַתֶּם לַיהוָה என்பதன் இலக்கண வலிமை
  choice: யாவேயால் ஆசீர்வதிக்கப்பட்டவர்கள் நீங்கள்
  alternative: யாவே உங்களை ஆசீர்வதிப்பாராக
  rationale: எபிரெய செயப்பாட்டு வினையெச்சம் முதன்மையாக ஒரு ஆசீர்வதிக்கப்பட்ட நிலையை அறிவிக்கிறது; அதே நேரம் இது வாழ்த்துச் சூத்திரமாகவும் புரிந்துகொள்ளப்படலாம். மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆண்கள்’ என்பது மூலத்தின் வெளிப்படையான ஆண்பால் வடிவத்தைப் பாதுகாக்கிறது. ‘தலைவன்’ அரசியல் மற்றும் மரியாதைப் பொருளைத் தருகிறது; ‘ஆண்டவர்’ என்ற தெய்வீகத் தோற்றம் தவிர்க்கப்படுகிறது. யாபேசு-கிலேயாத் என்ற இடப்பெயர் இணைப்புக்குறியுடன் வழங்கப்பட்டுள்ளது.
