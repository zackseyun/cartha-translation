  source_fidelity: மூலத்தின் தொடரமைப்பில் ஆசீர்வாதக் கூற்றுக்கான காரணம் தெளிவாக உள்ளது. வரைவில் அந்தக் காரண இணைப்பு விடுபட்டிருப்பதால், மேற்கோளுக்குள் உள்ள இரு வாக்கியங்களும் இலக்கணரீதியாகச் சரியாக இணைவதில்லை. அதை ‘ஏனெனில்’ எனத் தெளிவுபடுத்தியுள்ளேன். மற்ற முக்கியக் கூறுகள்—மனிதத் தூதுவர்கள், யாபேசு-கிலேயாத்தின் ஆண்கள், சவுலை அவர்களுடைய தலைவனாகக் குறிப்பது, அடக்கம் செய்த செயல்—மூலத்துக்கு உண்மையாக உள்ளன.
  naturalness: ‘யாவேயால் நீங்கள் ஆசீர்வதிக்கப்பட்டவர்கள்’ என்பது நவீனத் தரத் தமிழில் பயனிலை வரிசையில் இயல்பாக உள்ளது. ‘ஏனெனில்’ சேர்ப்பதன் மூலம் தாவீதின் உரை முழுமையான, தெளிவான தமிழ்வாக்கியமாகிறது. ‘அன்பான செயல்’ இச்சூழலில் חֶסֶד குறிக்கும் நடைமுறை நன்மையையும் விசுவாசமான அன்பின் சாயலையும் இயல்பாகத் தருகிறது.
  terminology: ‘யாவே’ இறைத் தனிப்பெயரைத் தக்கவைக்கிறது. ‘தலைவனான சவுல்’ அரசியல்-மரியாதை உறவைக் காட்டுகிறது; தேவையற்ற இறையியல் பட்டப்பெயரைத் தவிர்க்கிறது. חֶסֶד என்பதற்கான அடிக்குறிப்பு, சொல்லின் பரந்த பொருள்வளத்தைப் பாதுகாக்கிறது.
