base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/016.yaml
  text: Each man seized his companion by the head[a], and his sword was in his companion’s side, so they fell together. Therefore that place, which is in Gibeon, was called Helkath-hazzurim.
translation:
  language: ta
  text: ஒவ்வொருவனும் தன் எதிராளியின் தலையைப் பிடித்துக்கொண்டான்; அவனுடைய வாள் எதிராளியின் பக்கத்தில் இருந்தது; அவர்கள் ஒன்றாக விழுந்தார்கள். ஆகவே கிபியோனிலுள்ள அந்த இடம் ஹெல்காத்-ஹச்சூரீம்[a] என்று அழைக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஹெல்காத்-ஹச்சூரீம்” என்பது எபிரெய இடப்பெயரின் ஒலிபெயர்ப்பு. அதன் துல்லியமான பொருள் உறுதியில்லை; “பக்கங்களின் களம்,” “கூரிய வாள்களின் களம்” போன்ற பொருள்கள் முன்வைக்கப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲזִקוּ אִישׁ בְּרֹאשׁ רֵעֵהוּ
  choice: ஒவ்வொருவனும் தனக்கு எதிரிலிருந்தவனின் தலையைப் பிடித்துக்கொண்டு
  rationale: இங்கு אִישׁ பகிர்ந்தளிக்கும் பொருளில் ‘ஒவ்வொருவனும்’ என வருகிறது. רֵעַ நண்பனைக் குறிக்க வேண்டியதில்லை; ஜோடியாகப் போரிட்ட எதிராளியைக் குறிக்கிறது. חזק வன்மையான பிடிப்பைச் சுட்டுவதால் ‘பிடித்துக்கொண்டு’ இயல்பாக அமைகிறது.
- source_word: וְחַרְבּוֹ בְּצַד רֵעֵהוּ
  choice: தன் வாளை அவனுடைய விலாவில் பாய்ச்சினான்
  rationale: வினைச்சொல் இல்லாத எபிரெயச் சொற்றொடர் தாக்குதலைச் சுருக்கமாக வருணிக்கிறது. தமிழில் வாக்கியத்தை இயல்பாகவும் செயல் தெளிவாகவும் வழங்க ‘பாய்ச்சினான்’ சேர்க்கப்பட்டது; צַד உடலின் பக்கப்பகுதியை இங்கு ‘விலா’ எனக் குறிக்கிறது.
- source_word: וַיִּפְּלוּ יַחְדָּו
  choice: இவ்வாறு அவர்கள் அனைவரும் ஒன்றாக விழுந்தார்கள்
  rationale: יַחְדָּו ஒரே நேரத்தில் நிகழ்ந்த கூட்டுவீழ்ச்சியை வலியுறுத்துகிறது; முந்தைய தாக்குதலின் விளைவையும் தமிழ் இணைப்பு வெளிப்படுத்துகிறது.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: ஆகவே ... அந்த இடம் ... என்று அழைக்கப்பட்டது
  rationale: அழைத்தவர் யார் என்பது எபிரெயத்தில் குறிப்பிடப்படாததால் தமிழில் செயப்பாட்டு வடிவம் பயன்படுத்தப்பட்டது. நிகழ்வின் விளைவாகப் பெயர் ஏற்பட்டதை ‘ஆகவே’ காட்டுகிறது.
- source_word: חֶלְקַת הַצֻּרִים
  choice: எல்காத்-அச்சூரிம்
  rationale: இது இடப்பெயர்; அதன் சொற்பிறப்புப் பொருள் உறுதியற்றதால் ஒரு பொருளைத் தீர்மானிக்காமல் எபிரெய ஒலிப்பைத் தமிழில் பெயர்த்தெழுதுவது ஏற்றது.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: கிபியோனிலுள்ள
  rationale: பெயரிடப்பட்ட இடம் கிபியோனில் இருப்பதைச் சுருக்கமாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
