base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/030.yaml
  text: And Joab returned from pursuing Abner[a], and he gathered all the people. When they were counted, nineteen men of David’s servants were missing, besides Asahel.
translation:
  language: ta
  text: யோவாப் அப்னேரைப் பின்தொடர்வதை நிறுத்திவிட்டுத் திரும்பி வந்து, மக்கள் அனைவரையும் ஒன்றுகூட்டினான். அவர்கள் எண்ணப்பட்டபோது, தாவீதின் பணியாளர்களில் பத்தொன்பது பேரும் ஆசகேலும் காணப்படவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “பத்தொன்பது பேரும் ஆசகேலும்” என்று உள்ளது. ஆசகேல் அந்தப் பத்தொன்பது பேருக்கு மேலாக எண்ணப்படுகிறார் என்பதை இச்சொல்லமைப்பு குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב מֵאַחֲרֵי אַבְנֵר
  choice: அப்னேரைப் பின்தொடர்வதை நிறுத்திவிட்டுத் திரும்பி வந்து
  rationale: சொல்லுக்குச் சொல் ‘அப்னேருக்குப் பின்னாலிருந்து திரும்பினான்’ என்றிருந்தாலும், போர் நிகழ்வின் சூழலில் அப்னேரைத் தொடர்ந்து துரத்துவதை நிறுத்தித் திரும்பியதையே இந்த எபிரெயச் சொற்றொடர் குறிக்கிறது.
- source_word: וַיִּקְבֹּץ אֶת כָּל הָעָם
  choice: மக்கள் அனைவரையும் ஒன்றுகூட்டினான்
  rationale: עָם என்பதன் அடிப்படைப் பொருளான ‘மக்கள்’ என்பதைக் காத்துள்ளது; இச்சூழலில் அவர்கள் யோவாபின் போர்வீரர்கள் என்பது நிகழ்ச்சியிலிருந்து தெளிவாகிறது.
- source_word: וַיִּפָּקְדוּ
  choice: அவர்கள் எண்ணப்பட்டபோது
  rationale: פקד என்பதன் நிஃபால் வடிவம் இங்கு ஆட்கள் கணக்கிடப்பட்டதைக் குறிக்கிறது; தமிழ் கதையோட்டத்தில் இவ்வடிவம் இயல்பாக உள்ளது.
- source_word: מֵעַבְדֵי דָוִד
  choice: தாவீதின் பணியாளர்களில்
  rationale: עֶבֶד என்பதன் ‘பணியாளர்/ஊழியர்’ என்ற அடிப்படை உறவைத் தக்கவைக்கிறது; இங்கு அரசனுக்குச் சேவைசெய்யும் போர்வீரர்கள் குறிக்கப்படுகின்றனர்.
- source_word: תִּשְׁעָה עָשָׂר אִישׁ
  choice: பத்தொன்பது பேர்
  rationale: போரில் ஈடுபட்ட ஆண்களைக் குறிக்கும் எண்ணிக்கையை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: וַעֲשָׂה אֵל
  choice: ஆசகேலைத் தவிர
  rationale: கொடுக்கப்பட்ட உரையில் பிரித்துக் காட்டப்பட்டிருப்பது ஆசகேல் என்ற பெயரையே குறிக்கிறது. எபிரெயில் உள்ள ‘பத்தொன்பது பேரும் ஆசகேலும்’ என்ற கூட்டுச் சொல்லின் பொருள், ஆசகேல் அந்தப் பத்தொன்பது பேருக்கு மேலான இழப்பு என்பதாகத் தமிழில் தெளிவாக வழங்கப்பட்டுள்ளது.
