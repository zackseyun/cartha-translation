translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பான ஆனால் கண்ணியமான வரலாற்றுக் கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. இராணுவச் சூழலை அளவுக்கு மீறி விளக்காமல், மூலத்தின் ‘மக்கள்’ மற்றும் ‘பணியாளர்கள்’ என்ற சொற்களுக்கு நெருக்கமான தேர்வுகள் காக்கப்பட்டுள்ளன.
