revisions:
- from: ஆனால் அவன் விலகிச் செல்ல மறுத்தான். எனவே அப்னேர் தன் ஈட்டியின் பின்முனையால் அவனுடைய அடிவயிற்றில்[a] குத்தினான். ஈட்டி அவனுடைய முதுகுப்புறமாக வெளியே வந்தது. அவன் அங்கேயே விழுந்து, விழுந்த இடத்திலேயே இறந்தான். ஆசகேல் விழுந்து இறந்திருந்த இடத்திற்கு வந்த ஒவ்வொருவரும் அங்கேயே நின்றுவிட்டார்கள்.
