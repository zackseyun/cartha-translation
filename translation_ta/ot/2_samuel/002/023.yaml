translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்றுக் கதைநடைக்கு ஏற்ற கண்ணியமானவும் நேரடியானவும் மொழிநடை பயன்படுத்தப்பட்டுள்ளது. வன்முறையின் விவரம் மறைக்கப்படாமல், அதேவேளை தேவையற்ற விரிவாக்கமின்றி தரப்பட்டுள்ளது. ஆசகேல் என்ற பெயர்வடிவம் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தேர்ந்தெடுக்கப்பட்டது.
