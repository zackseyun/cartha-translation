base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/023.yaml
  text: But he refused to turn aside[a], so Abner struck him in the belly with the butt end of the spear, and the spear came out behind him; and he fell there and died on the spot. And everyone who came to the place where Asahel had fallen and died stood still.
translation:
  language: ta
  text: ஆனால், அவன் விலகிச் செல்ல மறுத்தான். எனவே அப்னேர் ஈட்டியின் பின்பகுதியால் அவனுடைய அடிவயிற்றில்[a] அடித்தான். ஈட்டி அவனுடைய முதுகுப்புறமாக வெளியே வந்தது. அவன் அங்கேயே விழுந்து இறந்தான். ஆசகேல் விழுந்து இறந்த இடத்திற்கு வந்த ஒவ்வொருவரும் அங்கேயே நின்றுவிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு வரும் எபிரெயச் சொல் குறிக்கும் உடற்பகுதி உறுதியாகத் தெரியவில்லை. சில பழைய மொழிபெயர்ப்புகள் இதை “ஐந்தாம் விலா” என்று மொழிபெயர்க்கின்றன; இச்சூழலில் இது பொதுவாக வயிறு அல்லது அடிவயிற்றுப் பகுதியைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן לָסוּר
  choice: விலகிச் செல்ல மறுத்தான்
  rationale: மָאַן என்பதன் மறுப்பையும், סוּר என்பதன் வழியிலிருந்து விலகும் இயக்கத்தையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; சூழலில் துரத்தலைக் கைவிட மறுத்தது உட்பொருளாக உள்ளது.
- source_word: וַיַּכֵּהוּ
  choice: குத்தினான்
  rationale: נכה பொதுவாக ‘அடித்தான்’ என்றாலும், ஈட்டியின் பின்முனை உடலைத் துளைத்து மறுபுறம் வந்ததாக அடுத்த சொற்றொடர் கூறுவதால், இச்சூழலில் ‘குத்தினான்’ செயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּאַחֲרֵי הַחֲנִית
  choice: தன் ஈட்டியின் பின்முனையால்
  rationale: ஈட்டியின் பின்புற நுனி அல்லது பின்பகுதியைக் குறிக்கிறது. ‘பின்முனை’ என்பது அது உடலைத் துளைத்த நிகழ்வுக்கும் பொருந்தும்; அது முதன்மையான கூர்முனை என்று தவறாகக் காட்டாது.
- source_word: אֶל הַחֹמֶשׁ
  choice: அவனுடைய அடிவயிற்றில்
  rationale: חֹמֶשׁ என்பது உறுதியாக அடையாளம் காண முடியாத உடற்பகுதிச் சொல். போர்க் காட்சியில் வயிறு அல்லது அடிவயிற்றுப் பகுதியைக் குறிப்பதாகப் புரிந்துகொள்வது பொருத்தமானது; பழைய ‘ஐந்தாம் விலா’ மரபை முதன்மை உரையில் உறுதிப்படுத்தாமல் அடிக்குறிப்பில் பதிவு செய்கிறது.
- source_word: וַתֵּצֵא הַחֲנִית מֵאַחֲרָיו
  choice: ஈட்டி அவனுடைய முதுகுப்புறமாக வெளியே வந்தது
  rationale: ஈட்டி உடலை ஊடுருவி பின்புறமாக வெளிவந்ததைக் காட்டும் எபிரெயச் சொல்லமைப்புக்கு நெருக்கமாகவும் தமிழில் தெளிவாகவும் உள்ளது.
- source_word: וַיָּמָת תַּחְתָּו
  choice: விழுந்த இடத்திலேயே இறந்தான்
  rationale: תַּחְתָּו என்பதன் ‘அவன் இருந்த அதே இடத்தில்’ என்ற இடவியல் வலிமையையும் உடனடி மரணத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כָּל הַבָּא
  choice: வந்த ஒவ்வொருவரும்
  rationale: כָּל உடன் வரும் பங்கேற்புவினையின் பகிர்ந்தளிக்கும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיַּעֲמֹדוּ
  choice: அங்கேயே நின்றுவிட்டார்கள்
  rationale: அவர்கள் அந்த இடத்துக்கு வந்ததும் நகராமல் நின்றதைத் தெரிவிக்கிறது; வெறும் ‘நின்றார்கள்’ என்பதைவிட திடீர் நிறுத்தத்தின் உணர்வைத் தருகிறது.
