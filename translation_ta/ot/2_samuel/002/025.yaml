base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/025.yaml
  text: Then the sons of Benjamin gathered together behind Abner[a], became one band[b], and took their stand on the top of one hill.
translation:
  language: ta
  text: பின்பு பென்யமீன் மக்கள் அப்னேருக்குப் பின்னால்[a] ஒன்றுகூடி, ஒரே அணியாகி[b], ஒரு குன்றின் உச்சியில் நிலைகொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்னேரைப் பின்பற்றி.” எபிரெயச் சொற்றொடர் இடம் சார்ந்து “பின்னால்” என்பதையோ, ஒருவரைப் பின்பற்றுதலையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரே குழுவாக” அல்லது “ஒரே படைப்பிரிவாக.” எபிரெயச் சொல் ஒன்றாகத் திரண்ட ஓர் அணியைக் குறிக்கிறது.
    reason: lexical_alternative
