  text: וַ/יְהִ֣י אַֽחֲרֵי כֵ֗ן וַ/יִּשְׁאַל֩ דָּוִ֨ד בַּֽ/יהוָ֤ה לֵ/אמֹר֙ הַ/אֶעֱלֶ֗ה בְּ/אַחַת֙ עָרֵ֣י יְהוּדָ֔ה וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלָ֖י/ו עֲלֵ֑ה וַ/יֹּ֧אמֶר דָּוִ֛ד אָ֥נָה אֶעֱלֶ֖ה וַ/יֹּ֥אמֶר חֶבְרֹֽנָ/ה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/001.yaml
  text: After this[a], David inquired of Yahweh, saying, “Shall I go up into one of the cities of Judah?” And Yahweh said to him, “Go up.” Then David said, “Where shall I go up?” And he said, “To Hebron.”
translation:
  language: ta
  text: இதற்குப் பிறகு தாவீது யாவேயிடம்[a] விசாரித்து, “யூதாவின் நகரங்களில் ஒன்றுக்கு நான் ஏறிச் செல்லலாமா?” என்று கேட்டான். யாவே அவனிடம், “ஏறிச் செல்” என்றார். தாவீது, “நான் எங்கே ஏறிச் செல்லலாம்?” என்று கேட்டான். அவர், “எப்ரோனுக்கு” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘YHWH’; மரபாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது.
    reason: இறைப் பெயரின் மூல வடிவத்தையும் மரபான மாற்று மொழிபெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: இதற்குப் பிறகு
  rationale: எபிரெயக் கதைத் தொடரின் காலமாற்றத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; சொற்சொல்லான கடின நடையைத் தவிர்க்கிறது.
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: யாவேயிடம் விசாரித்து
  rationale: இங்கு வினவுதல் என்பது சாதாரணமாகக் கேள்வி கேட்பதல்ல; இறை வழிகாட்டுதலை நாடுவதைக் குறிக்கிறது. ‘விசாரித்து’ அந்தப் பொருளைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்ற இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הַאֶעֱלֶה / עֲלֵה
  choice: நான் ஏறிச் செல்லலாமா? / ஏறிச் செல்
  rationale: עלה என்ற ஒரே வினைச்சொல் கேள்வியிலும் பதிலிலும் மீண்டும் வருவதைப் பாதுகாப்பதோடு, யூதாவின் மேட்டுநிலத்தை நோக்கிய இயக்கத்தையும் காட்டுகிறது.
- source_word: בְּאַחַת עָרֵי יְהוּדָה
  choice: யூதாவின் நகரங்களில் ஒன்றுக்கு
  rationale: யூதாவைச் சேர்ந்த பல நகரங்களில் ஏதாவது ஒன்றை நோக்கிய இயக்கத்தை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אָנָה
  choice: எங்கே
  rationale: செல்ல வேண்டிய இலக்கை வினவும் எபிரெய வினையடையின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: חֶבְרֹנָה
  choice: எப்ரோனுக்கு
  rationale: இடப்பெயருடன் சேர்ந்த திசைகாட்டும் -ה இறுதியைத் தமிழின் வேற்றுமை உருபான ‘-க்கு’ மூலம் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் பொதுப் பட்டம் அல்ல, நான்கெழுத்து இறைப் பெயரே உள்ளது. ஆகவே தனிப்பெயரைத் தக்கவைத்து, மரபு வழக்கை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. தாவீதுக்கு ஒருமை ஆண்பால் வினைமுற்றும், யாவேக்கு மரியாதைப் பன்மை வினைமுற்றும் பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் திரும்ப வரும் ‘ஏறிச் செல்’ என்ற இயக்கச் சொல் தமிழிலும் தக்கவைக்கப்பட்டுள்ளது.
