  text: וְ/עַתָּ֕ה יַֽעַשׂ יְהוָ֥ה עִמָּ/כֶ֖ם חֶ֣סֶד וֶ/אֱמֶ֑ת וְ/גַ֣ם אָנֹכִ֗י אֶעֱשֶׂ֤ה אִתְּ/כֶם֙ הַ/טּוֹבָ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר עֲשִׂיתֶ֖ם הַ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/006.yaml
  text: And now may Yahweh show you steadfast love and faithfulness[a]. And I also will do this good to you[c][b], because you have done this thing.
translation:
  language: ta
  text: இப்போதோ யாவே உங்களுக்கு மாறாத அன்பையும் உண்மையையும் காட்டுவாராக[a]. நானும் உங்களுக்கு இந்த நன்மையைச் செய்வேன்[c], ஏனெனில் நீங்கள் இந்தச் செயலைச் செய்தீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே உங்களுக்கு மாறாத அன்பையும் உண்மையையும் காட்டுவார்.” எபிரெய வினைச்சொல்லை வாழ்த்தாகவும் எதிர்காலக் கூற்றாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: “இந்தச் செயல்” என்பது முந்தைய வசனத்தில் சொல்லப்பட்ட சவுலை அடக்கம் செய்த செயலைக் குறிக்கிறது.
    reason: cross_reference
  - marker: c
    text: “இந்த நன்மை” என்பதற்கு “இந்தத் தயவு” என்றும் மொழிபெயர்க்கலாம். எபிரெயில் சொல்லடியாக “இந்த நல்லது” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பட்ட பெயராகிய நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: முந்தைய வசனத்துடன் உள்ள தொடர்ச்சியைத் தமிழில் இயல்பாக உணர்த்துகிறது; எபிரெய இணைப்புச் சொல் தனியாக மொழிபெயர்க்கப்படாவிட்டாலும் அதன் தொடர் உணர்வு நிலைக்கிறது.
- source_word: יַעַשׂ
  choice: காட்டுவாராக
  rationale: சூழலில் இது தாவீதின் வாழ்த்தாக அல்லது வேண்டுதலாக இயல்பாகப் புரிகிறது; חֶסֶד மற்றும் אֱמֶת ஆகிய பண்புகளுடன் தமிழில் ‘காட்டு’ இயல்பானது.
- source_word: עִמָּכֶם
  choice: உங்களுக்கு
  rationale: சொல்லடியாக ‘உங்களுடன்’ என்றாலும், நன்மை காட்டப்படுவோரைக் குறிக்கும் பயனாளிப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: חֶסֶד
  choice: மாறாத அன்பு
  rationale: நிலைத்த பற்றுறுதி, இரக்கம், அன்பு ஆகிய பரிமாணங்களைக் கொண்ட சொல்லை எளிமையாகவும் வேறுபாடு காக்குமாறும் தருகிறது.
- source_word: וֶאֱמֶת
  choice: உண்மைத்தன்மை
  rationale: இந்த இணைச்சொல் சூழலில் வெறும் கோட்பாட்டு ‘உண்மை’ அல்லாமல் நம்பகமான உண்மையையும் விசுவாசத்தன்மையையும் குறிக்கிறது.
- source_word: וְגַם אָנֹכִי
  choice: நானும்
  rationale: கூட்டுச் சொல் மற்றும் வலியுறுத்தப்பட்ட தனிப்பெயரின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: אֶעֱשֶׂה אִתְּכֶם
  choice: உங்களுக்குச் செய்வேன்
  rationale: எபிரெய முன்சொல்லின் உறவுப் பொருளைத் தமிழில் பயனாளிப் பொருளாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: இந்த நன்மை
  rationale: சொல்லடியான ‘இந்த நல்லதை’ என்பதன் பொருளை இயல்பான பெயர்ச்சொல்லால் தருகிறது; முன் வரும் חֶסֶד என்பதுடன் இதை ஒன்றாக்கவில்லை.
- source_word: אֲשֶׁר עֲשִׂיתֶם הַדָּבָר הַזֶּה
  choice: நீங்கள் இந்தச் செயலைச் செய்ததால்
  rationale: தாவீதின் பதிலளிக்கும் நன்மைக்கான காரணத்தைத் தெளிவாகக் காட்டுகிறது; ‘இந்தச் செயல்’ முந்தைய வசனத்தில் சவுலை அடக்கம் செய்ததைக் குறிக்கிறது.
theological_decisions:
- issue: יַעַשׂ என்ற முற்றுப்பெறா வினையின் வாழ்த்து அல்லது எதிர்காலப் பொருள்
  choice: ‘காட்டுவாராக’ என்ற வாழ்த்து/வேண்டுதல்
  alternative: ‘காட்டுவார்’ என்ற எதிர்காலக் கூற்று
  rationale: யாபேஸ்-கீலேயாத் மக்களை தாவீது ஆசீர்வதிக்கும் சூழலுக்கு வாழ்த்துப் பொருள் நன்றாகப் பொருந்துகிறது; எனினும் எபிரெய வடிவம் எதிர்காலக் கூற்றாகவும் புரியக்கூடியதால் மாற்று வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தேவனுடைய பெயர் தனிப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது. வாழ்த்துக்கும் எதிர்காலக் கூற்றுக்கும் இடையிலான மூலமொழி ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; ‘மாறாத அன்பு’ மற்றும் ‘நன்மை’ என்ற சொற்கள் தனித்தனியாக வைக்கப்பட்டுள்ளன.
