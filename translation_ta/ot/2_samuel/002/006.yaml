  source_fidelity: திருத்தம் தேவை. மூல எபிரெயத்தின் יְהוָה பெயரை ஆங்கில POB தீர்மானமும் கோருவது போல் ‘யாவே’ என ஒலிபெயர்க்க வேண்டும்; ‘யெகோவா’ வேறுபட்ட மரபுவழி வடிவமாகும். மேலும் וְעַתָּה-வின் தொடர்ச்சி உணர்வை ‘இப்போதோ’ காக்கிறது. வாழ்த்துப் பொருளும் மாற்றுவாசிப்பு அடிக்குறிப்பும் சரியாகப் பாதுகாக்கப்படுகின்றன.
