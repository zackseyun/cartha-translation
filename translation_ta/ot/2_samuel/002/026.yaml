base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/026.yaml
  text: Then Abner called to Joab and said[a], “Must the sword devour forever? Do you not know that it will be bitter in the end? How long will it be before you tell the people to turn back from following their brothers?”
translation:
  language: ta
  text: அப்போது அப்னேர் யோவாபைக் கூப்பிட்டு, “வாள் என்றென்றும் விழுங்கிக்கொண்டே இருக்குமா? இறுதியில் இது கசப்பாகும் என்பது உனக்குத் தெரியாதா? தங்கள் சகோதரர்களைப் பின்தொடர்வதை[a] நிறுத்தித் திரும்பும்படி மக்களிடம் நீ சொல்ல இன்னும் எவ்வளவு காலம் ஆகும்?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தங்கள் சகோதரர்களைத் துரத்திச் செல்வதை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלָנֶצַח
  choice: என்றென்றும்
  rationale: முடிவில்லாமல் தொடர்வதைப் பற்றிய வினாவை இயல்பான, சுருக்கமான தமிழில் தெரிவிக்கிறது.
- source_word: תֹּאכַל חֶרֶב
  choice: வாள் ... விழுங்கிக்கொண்டிருக்க
  rationale: வாளை உயிருள்ள ஒன்றுபோல் காட்டும் எபிரெய உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது; தொடர்ச்சியான செயலை சூழலுக்கேற்ப வெளிப்படுத்துகிறது.
- source_word: מָרָה
  choice: கசப்பாக
  rationale: போரின் இறுதி விளைவை விவரிக்கும் மூலமொழியின் உருவகத்தையும் உணர்ச்சி வலிமையையும் பாதுகாக்கிறது.
- source_word: בָּאַחֲרוֹנָה
  choice: முடிவில்
  rationale: தொடர்ந்து போரிடுவதால் இறுதியில் ஏற்படும் விளைவை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: וְעַד מָתַי
  choice: இன்னும் எவ்வளவு காலம் ஆகும்?
  rationale: யோவாப் நடவடிக்கை எடுக்கத் தாமதிப்பதைச் சுட்டும் வினாவின் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לֹא תֹאמַר לָעָם
  choice: மக்களிடம் நீ சொல்ல
  rationale: אמר என்பதன் ‘சொல்/தெரிவி’ என்ற பொருளைப் பாதுகாக்கிறது; ‘கட்டளையிடு’ என வலுப்படுத்துவதைத் தவிர்க்கிறது.
- source_word: לָשׁוּב
  choice: திரும்பும்படி
  rationale: துரத்திச் செல்வதை நிறுத்தித் திரும்புதல் என்ற சூழல்சார் செயலை இயல்பாகக் குறிக்கிறது.
- source_word: מֵאַחֲרֵי
  choice: பின்தொடர்வதிலிருந்து
  rationale: ‘பின்னால் செல்வது’ என்ற நேரடிப் பொருளைப் பாதுகாக்கிறது; போர்ச் சூழலில் இது ‘துரத்துவது’ என்றும் புரிந்துகொள்ளப்படலாம்.
- source_word: אֲחֵיהֶם
  choice: தங்கள் சகோதரர்களை
  rationale: இஸ்ரவேலர்கள் தங்கள் சொந்த சகோதரர்களுடன் போரிடுவதிலுள்ள குடும்ப மற்றும் உடன்படிக்கை சார்ந்த வலிமையைப் பாதுகாக்கிறது.
