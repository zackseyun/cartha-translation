translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வாள் ‘விழுங்குகிறது’ மற்றும் முடிவு ‘கசப்பாக’ இருக்கும் என்ற எபிரெய உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன.
