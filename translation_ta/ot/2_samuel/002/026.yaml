  rationale: The revision removes an unintended nuance of obligation in the first question, makes the final command clause natural in modern standard Tamil, and locates the footnote marker at the Hebrew-derived expression for ‘following after.’ The ambiguity between following and pursuing is preserved by retaining ‘பின்தொடர்வதை’ in the text and supplying ‘துரத்திச் செல்வதை’ as the alternative.
