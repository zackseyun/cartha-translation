  source_fidelity: முதன்மை உரையில் ‘பின்வாங்கிச் சென்றிருப்பார்கள்’ என்பது נַעֲלָה (‘மேலேறிச் செல்லுதல்’) என்பதன் சூழல் விளக்கத்தை நேரடி மொழிபெயர்ப்பாக மாற்றுகிறது. மேலும் ‘காலையிலேயே’ என்பது מֵהַבֹּקֶר என்பதின் ‘காலையிலிருந்து/காலையிலிருந்தே’ என்ற தொடக்கக் காலக் குறிப்பை முழுமையாகக் காட்டவில்லை. திருத்தம் மூலத்தின் சொல்லர்த்தத்தையும் சூழல்சார் பொருளையும் தனித்தனியாகப் பாதுகாக்கிறது.
