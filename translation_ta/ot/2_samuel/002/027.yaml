translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரிவதுமான நடை. ஆணையுறுதி மொழி ஓரளவு எபிரெயச் சுவையுடன் வைக்கப்பட்டுள்ளது; இராணுவச் சூழலின் மறைபொருள் முதன்மை உரையில் இயல்பாகத் தரப்பட்டு, சொற்படியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
