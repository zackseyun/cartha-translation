  text: וַ/יֹּ֣אמֶר יוֹאָ֔ב חַ֚י הָֽ/אֱלֹהִ֔ים כִּ֥י לוּלֵ֖א דִּבַּ֑רְתָּ כִּ֣י אָ֤ז מֵֽ/הַ/בֹּ֨קֶר֙ נַעֲלָ֣ה הָ/עָ֔ם אִ֖ישׁ מֵ/אַחֲרֵ֥י אָחִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/027.yaml
  text: Joab said[a], “As God lives, if you had not spoken, then from the morning the people would have gone up[b], each from following his brother.”
translation:
  language: ta
  text: யோவாப், “கடவுள் உயிரோடிருப்பது போல, நீ பேசியிருக்காவிட்டால், மக்கள் காலையிலிருந்தே ஒவ்வொருவனும் தன் சகோதரனைப் பின்தொடர்வதை விட்டுவிட்டு மேலேறிச் சென்றிருப்பார்கள்[a][b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காலையிலேயே.”
    reason: מֵהַבֹּקֶר என்பதன் காலத்தொடக்கக் குறிப்புக்கு இயல்பான மாற்று.
  - marker: b
    text: எபிரெயத்தில், “மேலேறிச் சென்றிருப்பார்கள்.” இச்சூழலில், ஒவ்வொருவரும் தம் சகோதரனைத் துரத்துவதை விட்டுவிட்டு விலகிச் சென்றிருப்பார்கள் என்றும் பொருளாகலாம்.
    reason: נַעֲלָה என்பதன் நேரடிப் பொருளையும் இராணுவச் சூழலில் சாத்தியமான விளக்கத்தையும் வேறுபடுத்திக் காட்டுகிறது.
lexical_decisions:
- source_word: חַי הָאֱלֹהִים
  choice: கடவுள் உயிரோடு இருப்பது உறுதிபோல
  rationale: இது ஓர் ஆணையுறுதி மொழி. எபிரெய உருவகத்தைத் தக்கவைத்தபடியே நவீன தமிழில் அதன் உறுதியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לוּלֵא דִּבַּרְתָּ
  choice: நீ பேசியிருக்காவிட்டால்
  rationale: நிகழாத கடந்தகால நிபந்தனையை நேரடியாகக் காட்டுகிறது; ‘பேசு’ என்ற வினையின் குறிப்பிடப்படாத செயப்படுபொருளையும் சேர்க்கவில்லை.
- source_word: כִּי אָז
  choice: அப்போது / விளைவாக
  rationale: தமிழ் எதிர்நிலை நிபந்தனை அமைப்பிலுள்ள ‘சென்றிருப்பார்கள்’ என்பதே விளைவைக் தெளிவாக்குவதால், தனியாக மிகைப்படுத்திப் பெயர்க்காமல் வாக்கிய அமைப்பில் உணர்த்தப்பட்டுள்ளது.
- source_word: מֵהַבֹּקֶר
  choice: காலையிலேயே
  rationale: சூழலில் செயல் காலை நேரத்திலேயே நிகழ்ந்திருக்கும் என்ற பொருளை இயல்பான தமிழில் தருகிறது; ‘காலையிலிருந்தே’ என்ற காலத்தொடக்கப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: נַעֲלָה
  choice: பின்வாங்கிச் சென்றிருப்பார்கள்
  rationale: வினையின் அடிப்படைப் பொருள் ‘மேலேறிச் செல்.’ ஆனால் இந்த இராணுவச் சூழலில் அது துரத்தலைக் கைவிட்டு விலகிச் செல்வதைக் குறிக்கிறது; நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אִישׁ מֵאַחֲרֵי אָחִיו
  choice: ஒவ்வொருவனும் தன் சகோதரனைப் பின்தொடர்வதை நிறுத்தியிருப்பான்
  rationale: சொல்லர்த்தமாக ‘ஒவ்வொருவனும் தன் சகோதரனுக்குப் பின்னாலிருந்து.’ இங்கு சக இஸ்ரவேலனைத் துரத்துவதை நிறுத்துவது குறிக்கப்படுவதால், தமிழில் தெளிவாகவும் சூழலுக்கு ஏற்றவாறும் மொழிபெயர்க்கப்பட்டுள்ளது.
