base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/019.yaml
  text: Asahel pursued Abner[a], and he did not turn to the right or to the left from following Abner.
translation:
  language: ta
  text: அசகேல் அப்னேரைத் துரத்தினார்; அப்னேரைப் பின்தொடர்ந்தபோது அசகேல் வலப்பக்கமோ இடப்பக்கமோ திரும்பவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அசகேல் அப்னேருக்குப் பின்னால் துரத்திச் சென்றார்; அப்னேருக்குப் பின்னாலிருந்து அவர் வலப்பக்கமோ இடப்பக்கமோ விலகவில்லை.”'
    reason: மூலத்தின் ‘அப்னேருக்குப் பின்னால்/பின்னாலிருந்து’ என்ற இடவியல் சொல்லாட்சியை இன்னும் நேரடியாகக் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: பின்தொடர்ந்து துரத்தினார்
  rationale: רדף என்பது தீவிரமாகப் பின்தொடர்தல் அல்லது துரத்துதல் என்று பொருள்படும். இங்கு தொடர்ச்சியான துரத்தலை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: וְלֹא נָטָה
  choice: விலகவில்லை
  rationale: נטה இச்சூழலில் சென்ற பாதையிலிருந்து ஒரு பக்கமாக விலகுவதைக் குறிக்கிறது.
- source_word: לָלֶכֶת
  choice: வலப்பக்கமோ இடப்பக்கமோ
  rationale: இன்பினிட்டிவ் வடிவம் வலது அல்லது இடது பக்கமாகச் செல்வதோடு இணைகிறது; தமிழில் திசைமாற்றத்தின் கருத்துக்குள் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: עַל הַיָּמִין וְעַל הַשְּׂמֹאול
  choice: வலப்பக்கமோ இடப்பக்கமோ
  rationale: பாதையிலிருந்து எந்தப் பக்கமும் விலகாததைக் குறிக்கும் எபிரேய இணைச்சொல் அமைப்பைத் தெளிவான தமிழில் பாதுகாக்கிறது.
- source_word: מֵאַחֲרֵי אַבְנֵר
  choice: அப்னேரைப் பின்தொடர்வதைவிட்டு
  rationale: சொல்லடிப்படையில் ‘அப்னேருக்குப் பின்னாலிருந்து’ எனும் பொருள் இருந்தாலும், சூழலில் துரத்தலைக் கைவிடாமல் இருந்ததைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: עֲשָׂהאֵל / אַבְנֵר
  choice: அசகேல் / அப்னேர்
  rationale: எபிரேய ஆள்பெயர்களுக்கு நவீனத் தமிழில் புரியக்கூடிய ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
