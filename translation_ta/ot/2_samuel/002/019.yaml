revisions:
- from: அசகேல் அப்னேரைப் பின்தொடர்ந்து துரத்தினார்; அப்னேரைப் பின்தொடர்வதைவிட்டு வலப்பக்கமோ இடப்பக்கமோ அவர் விலகவில்லை.[a]
  to: அசகேல் அப்னேரைத் துரத்தினார்; அப்னேரைப் பின்தொடர்ந்தபோது அசகேல் வலப்பக்கமோ இடப்பக்கமோ திரும்பவில்லை.[a]
  rationale: The revision removes an unnecessary doublet for the single Hebrew pursuit verb and makes Asahel the explicit subject of the second clause. It preserves the Hebrew imagery of not turning aside to either side while pursuing Abner. The alternative footnote retains the more literal spatial formulation.
