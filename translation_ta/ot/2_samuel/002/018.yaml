base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/018.yaml
  text: 'The three sons of Zeruiah were there: Joab[a], Abishai, and Asahel. And Asahel was swift on his feet like one of the gazelles that are in the field.'
translation:
  language: ta
  text: செருயாவின் மூன்று மகன்களான யோவாப், அபிசாய், ஆசகேல் ஆகியோர் அங்கே இருந்தார்கள். ஆசகேல் வயலில் இருக்கும் கலைமான்களில்[a] ஒன்றைப் போல ஓடுவதில் வேகமானவனாக இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வயலில் இருக்கும் மான்களில்.’ எபிரெயச் சொல் צְבִי மான் போன்ற காட்டு விலங்கைப் பொதுவாகவும் குறிக்கலாம்; இங்கு ‘கலைமான்’ என்பது இன்னும் துல்லியமான மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ שָׁם
  choice: அங்கே இருந்தார்கள்
  rationale: இந்த எபிரெயச் சொற்றொடர் காட்சியிடத்தில் அவர்கள் இருந்ததை எளிமையாகக் குறிக்கிறது; மூலத்தில் இல்லாத தனிப்பட்ட காலச் சுட்டுச்சொல் சேர்க்கப்படவில்லை.
- source_word: שְׁלֹשָׁה בְּנֵי צְרוּיָה
  choice: செருயாவின் மூன்று மகன்கள்
  rationale: அறியப்பட்ட மூன்று சகோதரர்களையும் இயல்பான நவீனத் தமிழில் அடையாளப்படுத்துகிறது.
- source_word: יוֹאָב וַאֲבִישַׁי וַעֲשָׂהאֵל
  choice: யோவாப், அபிசாய், ஆசகேல்
  rationale: எபிரெயத் தனிப்பெயர்களின் மரபான தமிழ் ஒலிபெயர்ப்புகள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: קַל בְּרַגְלָיו
  choice: கால்களில் வேகமுள்ளவன்
  rationale: இங்கு קַל எடைக்குறைவை அல்ல, ஓடும் வேகத்தைக் குறிக்கிறது; எபிரெயத்தின் உடல் சார்ந்த உருவகமும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: כְּאַחַד הַצְּבָיִם
  choice: கலைமான்களில் ஒன்றைப் போல
  rationale: צְבִי பொதுவாக வேகத்திற்குப் பெயர்பெற்ற gazelle வகை விலங்கைக் குறிக்கிறது; ‘கலைமான்’ தமிழில் அந்த ஒப்புமையைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: வெளியிலுள்ள
  rationale: שָׂדֶה இங்கு பயிரிடப்பட்ட வயலை மட்டும் அல்லாமல் விலங்குகள் வாழும் திறந்த வெளியையும் குறிக்கக்கூடும்; ‘வெளியிலுள்ள’ அந்தப் பரந்த பொருளை இயல்பாகக் காட்டுகிறது.
