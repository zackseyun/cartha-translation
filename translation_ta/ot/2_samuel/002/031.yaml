  yaml_path: translation/ot/2_samuel/002/031.yaml
  text: But David’s servants struck down three hundred and sixty men from Benjamin and from Abner’s men[a].
translation:
  language: ta
  text: ஆனால் தாவீதின் ஆட்கள் பென்யமீன் கோத்திரத்தைச் சேர்ந்தவர்களிலும் அப்னேரின் ஆட்களிலும் முந்நூற்று அறுபது பேரைத் தாக்கினர்; அவர்கள் இறந்தனர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேலும் தாவீதின் ஆட்கள் ...’ என்றும் மொழிபெயர்க்கலாம். எபிரெய இணைப்புச் சொல் வெறுமனே ‘மேலும்’ என்றும் பொருள்படலாம்; முந்தைய வசனத்தின் உயிரிழப்புக் கணக்குடன் இவ்வசனம் காட்டும் வேறுபாட்டை வெளிப்படுத்த முதன்மைப் பாடத்தில் ‘ஆனால்’ பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַבְדֵי דָוִד
  choice: ஆனால் தாவீதின் ஆட்கள்
  rationale: וְ என்பது பொதுவாக ‘மேலும்/அப்போது’ என்று தொடர்ச்சியைக் குறிக்கலாம்; முந்தைய வசனத்தில் தாவீதின் தரப்பில் ஏற்பட்ட இழப்புடன் இங்கு கூறப்படும் எதிர்த்தரப்பின் இழப்பை ஒப்பிடுவதால் ‘ஆனால்’ இயல்பான எதிர்மறைத் தொடர்பை வெளிப்படுத்துகிறது. עַבְדֵי என்பது இங்கு அடிமைத்தனத்தை வலியுறுத்தாமல், தாவீதுக்குச் சேவை செய்த போர்வீரர்களைக் குறிக்கிறது; எனவே ‘ஆட்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: הִכּוּ
  choice: தாக்கினார்கள்
  rationale: נכה என்பதன் அடிப்படைப் பொருளான ‘அடி/தாக்கு’ என்பதைக் காக்கிறது. இறப்பைத் தனியே கூறும் מֵתוּ என்பதையும் மொழிபெயர்க்க இடமளிப்பதால், இரு எபிரெய வினைகளும் ஒன்றாகச் சுருக்கப்படவில்லை.
- source_word: מִ/בִּנְיָמִן
  choice: பென்யமீன் கோத்திரத்தாரிலும்
  rationale: מִן இழப்பு ஏற்பட்ட குழுவைச் சுட்டுகிறது. ‘பென்யமீன்’ என்பது இங்கு தனிநபரை அல்ல, கோத்திரத்தைச் சுட்டுவதால் ‘கோத்திரத்தார்’ என்பது தமிழ் வாசகருக்குத் தெளிவாக உள்ளது.
- source_word: וּ/בְ/אַנְשֵׁי אַבְנֵר
  choice: அப்னேரின் ஆட்களிலும்
  rationale: அப்னேரைச் சேர்ந்த போர்வீரர் குழுவுக்குள் ஏற்பட்ட உயிரிழப்பைக் குறிக்கிறது. இணையான இரு குழுக்களையும் தமிழில் ‘-இலும் ... -இலும்’ என்ற அமைப்பு இயல்பாக இணைக்கிறது.
- source_word: שְׁלֹשׁ מֵאוֹת וְ/שִׁשִּׁים אִישׁ
  choice: முந்நூற்று அறுபது பேரை
  rationale: எண்ணிக்கையை நேரடியாகக் காக்கிறது; எண்ணுக்குப் பின் ஒருமையில் வரும் אִישׁ என்பதற்கு இயல்பான தமிழ் எண்ணிக்கைச் சொல்லான ‘பேர்’ பயன்படுத்தப்பட்டது.
- source_word: מֵתוּ
  choice: அவர்கள் இறந்தார்கள்
  rationale: מות என்ற வினையின் வெளிப்படையான ‘இறத்தல்’ பொருளைத் தனியாகக் காக்கிறது. தாக்குதல் மற்றும் அதன் உயிர்க்கொல்லி விளைவு ஆகிய இரண்டையும் மூலத்தைப் போலவே தெரிவிக்கிறது.
