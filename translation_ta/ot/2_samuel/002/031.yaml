  register: நவீன பொதுத்தமிழில், கண்ணியமான வரலாற்று விவரிப்பு நடையில் அமைக்கப்பட்டுள்ளது. ‘ஆட்கள்’ என்பது இச்சூழலில் சேவகர்கள்/போர்வீரர்கள் என்ற விரிவை இயல்பாகத் தருகிறது. மூல எபிரெயத்தில் உள்ள ‘தாக்கினார்கள்’ மற்றும் ‘இறந்தார்கள்’ என்ற இரு வினைகளும் விடுபடாமல் காக்கப்பட்டுள்ளன.
