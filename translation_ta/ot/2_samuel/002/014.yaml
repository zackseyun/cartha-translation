  yaml_path: translation/ot/2_samuel/002/014.yaml
  text: Then Abner said to Joab, “Please let the young men arise and compete before us.” And Joab said, “Let them arise.”
translation:
  language: ta
  text: அப்போது அப்னேர் யோவாபிடம், “இளைஞர்கள் எழுந்து எங்கள் முன்னிலையில் போட்டியிடட்டும்[a]” என்றான். அதற்கு யோவாப், “அவர்கள் எழட்டும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “போட்டியிடட்டும்” என்பதற்கான எபிரேய வினை, நேரடியாக “விளையாடட்டும்” என்றும் பொருள்படும். இச்சூழலில் அது ஒரு போட்டிமிகு மோதலைக் குறிக்கிறது.
    reason: வினையின் அடிப்படைச் சொற்பொருள் பரப்பையும் இச்சூழலில் பொருத்தமான பொருளையும் காக்கிறது; அடுத்தடுத்த நிகழ்வுகளின் விளைவைக் கொண்டு இவ்வசனத்திலேயே பொருளை மிகையாக நிர்ணயிப்பதில்லை.
lexical_decisions:
- source_word: הַנְּעָרִים (hannəʿārîm)
  choice: இளைஞர்கள்
  rationale: இந்தச் சூழலில் போரிடத் தேர்ந்தெடுக்கப்படும் இளம் வீரர்களைக் குறிக்கிறது; இருப்பினும் மூலச்சொல்லில் இல்லாத ‘வீரர்கள்’ என்பதை正文ில் சேர்க்காமல், பொதுவான பொருளைத் தக்கவைக்கிறது.
- source_word: וִישַׂחֲקוּ (wîśaḥăqû)
  choice: போட்டியிடட்டும்
  rationale: שׂחק என்ற வினை ‘விளையாடு’, ‘வேடிக்கையில் ஈடுபடு’ என்றும் பொருள்படலாம். ஆனால் தொடர்ந்து வரும் நிகழ்வில் இது பிரதிநிதிப் போர்ப் போட்டியைச் சுட்டுகிறது. ‘போட்டியிடட்டும்’ என்பது சூழலுக்குப் பொருத்தமானதாய் இருந்து, உடனே ‘சண்டையிடட்டும்’ என்று பொருளை மிகையாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: יָקוּמוּ־נָא (yāqûmû-nāʾ)
  choice: எழுந்து வந்து ... போட்டியிடட்டும்
  rationale: יָקוּמוּ என்பதன் ‘எழுதல்’ என்ற உருவகத்தைத் தக்கவைக்கிறது; נָא கோரிக்கையை மென்மையாக்கும் துகளாக இருப்பதால், தமிழில் கட்டளை அல்லாத அனுமதி/வேண்டுகோள் வடிவமான ‘-ட்டும்’ மூலம் இயல்பாக வெளிப்படுத்தப்படுகிறது.
- source_word: לְפָנֵינוּ (ləp̄ānênû)
  choice: நமக்கு முன்பாக
  rationale: ‘எங்கள் முன்னிலையில்’ அல்லது ‘எங்கள் பார்வைக்கு முன்’ என்ற எபிரேய இடவியல் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: இளைஞர்களின் செயல் விளையாட்டா, போட்டியா, அல்லது போரா?
  choice: போட்டியிடட்டும்
  alternative: விளையாடட்டும் / சண்டையிடட்டும்
  rationale: மூல வினையின் சொற்பொருள் பரப்பையும், அடுத்த வசனங்களில் வெளிப்படும் கொடிய போர்ச் சூழலையும் ஒன்றாகக் கருத்தில் கொள்கிறது. ‘விளையாடட்டும்’ என்பது சூழலின் தீவிரத்தை மறைக்கக்கூடும்; ‘சண்டையிடட்டும்’ என்பது மூலத்தின் நோக்கமுள்ள மென்மையான அல்லது மறைமுகமான சொல்லாட்சியை முற்றிலும் நீக்கிவிடக்கூடும்.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், மரியாதையும் கதைநடையின் சுருக்கமும் காக்கப்பட்டுள்ளன. பெயர்கள் ‘அப்னேர்’, ‘யோவாப்’ என ஒலிபெயர்க்கப்பட்டுள்ளன. யோவாபின் பதிலில் மூலத்தில் உள்ள ‘அவர்கள் எழட்டும்’ என்ற சுருக்கம், இயல்பான தமிழில் ‘அவர்கள் எழுந்து வரட்டும்’ எனத் தக்கவைக்கப்பட்டுள்ளது.
