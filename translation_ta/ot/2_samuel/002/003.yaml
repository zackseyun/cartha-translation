base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/003.yaml
  text: And David brought up the men who were with him[a], each man with his household, and they settled in the towns of Hebron.
translation:
  language: ta
  text: தன்னுடன் இருந்த ஆண்களை, அவரவர் குடும்பத்தாரோடு, தாவீது மேலே அழைத்துச் சென்றான். அவர்கள் எப்ரோனைச் சேர்ந்த ஊர்களில்[a] குடியேறினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எப்ரோனின் நகரங்களில்.” எபிரெயச் சொற்றொடர் ஒரே நகர மையத்தைவிட எப்ரோன் பகுதியைச் சேர்ந்த குடியிருப்புகளைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנָשָׁיו אֲשֶׁר עִמּוֹ
  choice: தன்னுடன் இருந்த ஆண்களை
  rationale: אֲנָשָׁיו என்பது தாவீதுக்குரிய ஆண் துணைவர்களைக் குறிக்கிறது; தொடர்ந்து வரும் ‘அவனுடன் இருந்த’ என்ற உறவுத்தொடரையும் இயல்பான தமிழில் இணைத்துப் பொருள் தெளிவாக வைக்கிறது.
- source_word: הֶעֱלָה
  choice: மேலே அழைத்துச் சென்றான்
  rationale: עלה என்பதன் ஹிஃபில் வடிவம் ‘மேலே கொண்டுசெல்/அழைத்துச்செல்’ என்று பொருள்படும். மலைநாட்டிலுள்ள எப்ரோனை நோக்கிய ஏற்றத்தையும் தாவீது அவர்களை உடன் கொண்டுசென்றதையும் இச்சொற்றொடர் காக்கிறது.
- source_word: אִישׁ וּבֵיתוֹ
  choice: அவரவர் குடும்பத்தாரோடு
  rationale: אִישׁ இங்கு பகிர்நிலைப் பொருளில் ‘ஒவ்வொருவரும்’ என்பதைக் காட்டுகிறது; בֵּיתוֹ என்பது கட்டிடத்தை அல்ல, அந்தந்த மனிதரின் குடும்பத்தாரை அல்லது வீட்டாரைக் குறிக்கிறது.
- source_word: וַיֵּשְׁבוּ
  choice: குடியேறினார்கள்
  rationale: இடமாற்றத்தின் பின்னணியில் ישב என்பது வெறுமனே அமர்வதை அல்ல, ஓரிடத்தில் வசிக்கத் தொடங்குவதைக் குறிக்கிறது.
- source_word: בְּעָרֵי חֶבְרוֹן
  choice: எப்ரோனைச் சேர்ந்த ஊர்களில்
  rationale: עָרִים என்பது நகரங்கள் அல்லது ஊர்கள் என்று மொழிபெயர்க்கப்படலாம். இங்கு எப்ரோன் பகுதியைச் சேர்ந்த குடியிருப்புகளைக் குறிக்கக்கூடும் என்பதால், ‘ஊர்கள்’ என்பது இயல்பாகவும் அளவில் நடுநிலையாகவும் உள்ளது; ‘சேர்ந்த’ என்பது உடைமை/பிராந்திய உறவைத் தெளிவாக்குகிறது.
- source_word: חֶבְרוֹן
  choice: எப்ரோன்
  rationale: எபிரெய இடப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
