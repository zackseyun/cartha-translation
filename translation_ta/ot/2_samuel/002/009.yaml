  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּמְלִכֵ֨/הוּ֙ אֶל הַ/גִּלְעָ֔ד וְ/אֶל הָ/אֲשׁוּרִ֖י וְ/אֶֽל יִזְרְעֶ֑אל וְ/עַל אֶפְרַ֨יִם֙ וְ/עַל בִּנְיָמִ֔ן וְ/עַל יִשְׂרָאֵ֖ל כֻּלֹּֽ/ה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/009.yaml
  text: and made him king over Gilead[a], over the Ashurites, over Jezreel, over Ephraim, over Benjamin, and over all Israel.
translation:
  language: ta
  text: அவனை கீலேயாதுக்கும், அஷூரியருக்கும்[a], யிஸ்ரயேலுக்கும், எப்பிராயீமுக்கும், பென்யமீனுக்கும், இஸ்ரவேல் முழுவதற்கும் அரசனாக நியமித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில், “அஷூரியர்.” சிலர் இதை ஆசேர் கோத்திரத்தையோ அதன் பிரதேசத்தையோ குறிக்கும் “ஆசேர்” என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּמְלִכֵהוּ
  choice: அவனை … அரசனாக்கினான்
  rationale: מלך என்பதன் ஹிஃபில் வடிவம், ஒருவரை அரசனாக ஏற்படுத்துதல் அல்லது நிறுவுதல் என்ற காரணவினைப் பொருளைக் கொண்டது. ‘அரசனாக்கினான்’ என்பது அந்தப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: אֶל / עַל
  choice: …மீதும்
  rationale: இங்கு இச்சொற்கள் அரசாட்சிக்குட்பட்ட மக்களையும் பகுதிகளையும் குறிக்கின்றன. ‘மீது’ என்பது ஆட்சியின் பரப்பைத் தமிழில் தெளிவாகக் காட்டுகிறது; தொடர்ச்சியான பட்டியலில் ‘மீதும்’ இயல்பாக உள்ளது.
- source_word: הַגִּלְעָד
  choice: கீலேயாத்
  rationale: இந்தப் பிரதேசப் பெயரின் எபிரெய ஒலிப்பை நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: הָאֲשׁוּרִי
  choice: அசூரியர்
  rationale: மசோரா உரையின் உயிர்க்குறியீட்டின்படி இது இனத்தைக் குறிக்கும் ஒருமை வடிவமாக இருந்தாலும் கூட்டுப் பொருளில் வருகிறது. ஆகவே பிரதான உரையில் ‘அசூரியர்’ என மொழிபெயர்க்கப்பட்டு, ‘ஆசேர்’ என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: יִזְרְעֶאל
  choice: யெஸ்ரயேல்
  rationale: இடப்பெயரின் எபிரெய வடிவத்தை அடிப்படையாகக் கொண்ட தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: אֶפְרַיִם
  choice: எப்பிராயீம்
  rationale: கோத்திரப் பெயரின் எபிரெய வடிவத்தை அடிப்படையாகக் கொண்ட தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: בִּנְיָמִן
  choice: பென்யமீன்
  rationale: கோத்திரப் பெயரின் எபிரெய வடிவத்தை அடிப்படையாகக் கொண்ட தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: יִשְׂרָאֵל כֻּלֹּה
  choice: இஸ்ரவேல் முழுவதும்
  rationale: כֻּלֹּה என்பது ஆட்சியின் பரப்பு இஸ்ரவேலின் ஒரு பகுதியை மட்டும் அல்லாமல் முழுவதையும் உள்ளடக்கியது என்பதை வலியுறுத்துகிறது.
