translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. பட்டியலின் ஓட்டத்தைப் பேண ‘மீதும்’ மீண்டும் பயன்படுத்தப்பட்டுள்ளது; கடினமான הָאֲשׁוּרִי வடிவத்தின் உண்மையான உரைத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
