base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/021.yaml
  text: Then Abner said to him[a], “Turn aside to your right or to your left, and seize one of the young men for yourself, and take his gear for yourself.” But Asahel was not willing to turn aside from following him.
translation:
  language: ta
  text: அப்னேர் அவனிடம், “உன் வலப்புறத்திற்கோ இடப்புறத்திற்கோ விலகிச் சென்று, இளைஞர்களில் ஒருவனை உனக்காகப் பிடித்து, அவனுடைய போர்ச் சாதனங்களை உனக்காக எடுத்துக்கொள்” என்றான். ஆனால் அசகேல் அவனைப் பின்தொடர்வதிலிருந்து விலக விரும்பவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְטֵה
  choice: விலகிச் சென்று
  rationale: துரத்திச் செல்லும் தற்போதைய பாதையிலிருந்து ஒரு பக்கமாக விலகுவதைச் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַל יְמִינְךָ אֹו עַל שְׂמֹאלֶךָ
  choice: உன் வலப்புறமோ இடப்புறமோ
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டுகளைப் பாதுகாத்து, மாற்றுத் திசைகளை இயல்பான தமிழில் காட்டுகிறது.
- source_word: וֶאֱחֹז לְךָ
  choice: பிடித்து
  rationale: אחז என்பதன் ‘பற்றிக்கொள்/பிடி’ என்ற வலிமையான செயற்பொருளை இராணுவச் சூழலில் தருகிறது; தொடர்ந்து வரும் ‘உனக்காக’ இரு செயல்களுக்கும் பொருந்தும்.
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: இளைஞர்களில் ஒருவனை
  rationale: נְעָרִים என்பதன் அடிப்படைப் பொருளைப் பாதுகாக்கிறது; ‘வீரன்’ அல்லது ‘பணியாள்’ என்று தேவையின்றிக் குறிப்பாக்கவில்லை.
- source_word: וְקַח לְךָ אֶת חֲלִצָתוֹ
  choice: அவனுடைய போர்ச் சாதனங்களை உனக்காக எடுத்துக்கொள்
  rationale: חֲלִצָה இங்கு ஒரு போர்வீரனிடமிருந்து கழற்றிக் கொள்ளப்படும் உடைமை அல்லது உபகரணத்தைக் குறிக்கலாம். ‘போர்ச் சாதனங்கள்’ சூழலைத் தெளிவாக்கினாலும் குறிப்பிட்ட பொருள் கவசமா என்பதைக் கட்டாயப்படுத்தாது.
- source_word: וְלֹא אָבָה
  choice: விரும்பவில்லை
  rationale: אבה என்பதிலுள்ள விருப்பம் அல்லது சம்மதமின்மையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לָסוּר מֵאַחֲרָיו
  choice: அவனைப் பின்தொடர்வதிலிருந்து விலக
  rationale: סור என்பதன் ‘விலகு’ என்ற கருத்தையும் מֵאַחֲרָיו என்பதன் பின்தொடர்தல் உருவகத்தையும் பாதுகாக்கிறது.
