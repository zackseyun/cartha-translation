base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/009.yaml
  text: Smoke went up from his nostrils[a], and consuming fire from his mouth; coals blazed from him.
translation:
  language: ta
  text: 'அவருடைய மூக்கிலிருந்து[a] புகை எழும்பியது;

    அவருடைய வாயிலிருந்து விழுங்கும் நெருப்பு;

    அவரிடமிருந்து தணல்கள் பற்றியெரிந்தன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய கோபத்தினால்.” “மூக்கு” என்பதற்கான எபிரெயச் சொல் மரபுத்தொடராக “கோபம்” என்றும் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: எழும்பியது
  rationale: மேல்நோக்கிய இயக்கத்தைக் குறிக்கும் எபிரெய வினையை இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: עָשָׁן
  choice: புகை
  rationale: சூழலுக்கு ஏற்ற வழக்கமான நேரடிப் பொருள்.
- source_word: בְּאַפּוֹ
  choice: அவருடைய மூக்கிலிருந்து
  rationale: אַף என்பதன் உடல்சார்ந்த உருவகத்தைத் தக்கவைக்கிறது; தொடர்ந்து வரும் ‘வாயிலிருந்து’ என்பதுடனான கவிதை இணைநிலையையும் பாதுகாக்கிறது. புகை வெளியே எழும் இயக்கத்தை இயல்பான தமிழில் காட்ட ‘இலிருந்து’ பயன்படுத்தப்பட்டது.
- source_word: וְאֵשׁ מִפִּיו תֹּאכֵל
  choice: அவருடைய வாயிலிருந்து வந்த நெருப்பு விழுங்கியது
  rationale: תֹּאכֵל என்பதை பெயரடையாக மாற்றாமல் வினையாகவே வைத்து, நெருப்பு விழுங்கும் உயிரோட்டமான மூலமொழிப் படிமத்தைப் பாதுகாக்கிறது.
- source_word: גֶּחָלִים
  choice: தணல்கள்
  rationale: எரிந்து கனலும் நிலக்கரி அல்லது நெருப்புத்துண்டுகளைக் குறிக்கும் சொல்லுக்கு கவிதைச் சூழலில் இயல்பான தமிழ் தேர்வு.
- source_word: בָּעֲרוּ
  choice: பற்றியெரிந்தன
  rationale: வெறும் ‘எரிந்தன’ என்பதைவிட நெருப்பு மூண்டு தீவிரமாக எரியும் காட்சியைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִמֶּנּוּ
  choice: அவரிடமிருந்து
  rationale: מן குறிக்கும் மூலத்தை நேரடியாகத் தக்கவைத்து, தணல்கள் அவரிடமிருந்து வெளிப்படும் இறைக் காட்சியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இறைவனை மனித உடலுறுப்புகளோடு சித்தரிக்கும் இறைத்தோற்ற மொழி
  choice: ‘மூக்கு,’ ‘வாய்’ ஆகிய உடல்சார்ந்த படிமங்களையும் அவரிடமிருந்து நெருப்பும் புகையும் வெளிப்படும் காட்சியையும் தக்கவைத்தல்
  alternative: ‘மூக்கு’ என்பதை முழுமையாக ‘கோபம்’ என்ற கருத்துப்பொருளாக மொழிபெயர்த்தல்
  rationale: இது இறைவனுடைய கோபத்தையும் வல்லமையையும் மனித உடல்சார்ந்த கவிதைப் படிமங்களால் காட்டும் இறைத்தோற்ற வருணனை. அதை கருத்தாக்கி மென்மையாக்காமல் வைத்திருப்பது எபிரெய இணைநிலையையும் வசனத்தின் இறையியல் வலிமையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, அதேவேளையில் கவிதைமிகு கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மூன்று தீவிரமான படிமங்களும் தனித்தனி வரிகளில் வைக்கப்பட்டு எபிரெயக் கவிதை ஓட்டம் தெளிவாக்கப்பட்டுள்ளது.
