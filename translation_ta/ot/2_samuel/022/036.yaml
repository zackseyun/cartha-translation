source:
  edition: WLC
  text: וַ/תִּתֶּן לִ֖/י מָגֵ֣ן יִשְׁעֶ֑/ךָ וַ/עֲנֹתְ/ךָ֖ תַּרְבֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/036.yaml
  text: You gave me the shield of your salvation[a], and your gentleness made me great.
translation:
  language: ta
  text: 'உமது மீட்பின் கேடயத்தை எனக்குத் தந்தீர்;

    உமது தாழ்மை[a] என்னைப் பெரியவனாக்கியது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உமது மென்மை’ அல்லது ‘நீர் தாழ்ந்து அருளியது’ என்றும் மொழிபெயர்க்கலாம். இவ்வெபிரேயச் சொற்றொடர் கடினமானது; பேசுபவரை உயர்த்துவதற்காகக் கடவுள் அருளுடன் தாழ்ந்து வருவதை இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: தந்தீர்
  rationale: נתן என்பதன் Qal wayyiqtol வடிவம் கடந்தகாலத்தில் நேரடியாகக் கடவுளை நோக்கி, ‘தந்தீர்’ என்று இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: לִי
  choice: எனக்கு
  rationale: பெறுபவரைக் குறிக்கும் மறைமுகப் பொருளை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: מָגֵן
  choice: கேடயம்
  rationale: பாதுகாப்பு என்ற கருத்தாகப் பொதுமைப்படுத்தாமல், மூலத்தின் தெளிவான போர்க்கருவி உருவகத்தைப் பேணுகிறது.
- source_word: יִשְׁעֶךָ
  choice: உமது மீட்பு
  rationale: ישׁע குறிக்கும் தெய்வீக விடுவிப்பு மற்றும் காப்பின் பொருளை ‘மீட்பு’ சுருக்கமாகவும் இறையியல் ஒலிப்புடனும் தருகிறது; உடைமைத் தொடர்பும் பேணப்படுகிறது.
- source_word: וַעֲנֹתְךָ
  choice: உமது தாழ்மை
  rationale: சொல் கடினமானதும் பலவாறு புரிந்துகொள்ளப்பட்டதுமாகும். ‘தாழ்மை’ என்பது கடவுள் தாழ்ந்து வந்து பேசுபவரை உயர்த்துகிறார் என்ற வியப்பூட்டும் இறையியல் அழுத்தத்தை மென்மைப்படுத்தாமல் பேணுகிறது; வேறு சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: תַּרְבֵּנִי
  choice: என்னைப் பெரியவனாக்கியது
  rationale: רבה என்பதன் Hiphil வடிவிலுள்ள ‘பெரிதாக்குதல்’ என்ற விளைவுப்பொருளை நேரடியாகப் பேணுகிறது; ‘உயர்த்தியது’ என்பதும் சூழலுக்கு ஏற்றதே என்றாலும் அது மூல உருவை ஓரளவு மாற்றும்.
theological_decisions:
- issue: கடவுளைக் குறிக்கும் וַעֲנֹתְךָ என்பதன் பொருள்
  choice: உமது தாழ்மை
  alternative: உமது மென்மை; நீர் தாழ்ந்து அருளியது; உமது உதவி
  rationale: இவ்வெபிரேயச் சொற்றொடர் தெளிவற்றது. கடவுள் கிருபையுடன் தாழ்ந்து வந்து தம் ஊழியரைப் பெரியவராக்குகிறார் என்ற வாசிப்பு சூழலுக்கு நன்கு பொருந்துகிறது. ‘தாழ்மை’ அந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் பேணுகிறது; இது கடவுளில் குறைபாடு இருப்பதைக் குறிக்காமல், அவர் அருளோடு தாழ்ந்து அணுகுவதைக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் மரியாதைமிக்க இறைமுகப்பும் பேணப்பட்டுள்ளன. ‘நீர்/உமது’ வடிவங்கள் ஒருமை மரியாதையைத் தருகின்றன. இரண்டு எபிரேயப் பகுதிகளின் இணை அமைப்பை அரைப்புள்ளி மூலம் தெளிவாக வைத்திருக்கிறது.
