source:
  edition: WLC
  text: עַל כֵּ֛ן אוֹדְ/ךָ֥ יְהוָ֖ה בַּ/גּוֹיִ֑ם וּ/לְ/שִׁמְ/ךָ֖ אֲזַמֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/050.yaml
  text: Therefore I will praise you among the nations[a], O Yahweh, and I will sing praise to your name.
translation:
  language: ta
  text: ஆகையால், யாவே[a], தேசங்களிடையே உம்மைத் துதிப்பேன்; உமது பெயரைப் புகழ்ந்து பாடுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் יהוה (YHWH) என்ற இறைத் திருப்பெயர் உள்ளது; அது இங்கு ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது. பல மொழிபெயர்ப்புகள் இதை ‘ஆண்டவர்’ என்று வழங்குகின்றன.
    reason: இறைத் திருப்பெயரின் மூல வடிவத்தையும் வழக்கமான மாற்று மொழிபெயர்ப்பையும் வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட விடுதலையின் விளைவாக எழும் முடிவைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אוֹדְךָ
  choice: உம்மைத் துதிப்பேன்
  rationale: ידה என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் நன்றி கூறுதல் அல்லது புகழ்தல் என்ற பொருளைக் கொண்டது. அடுத்த அடியின் பாடல் சார்ந்த இணைப்பைத் தக்கவைத்தபடி, தமிழில் வழிபாட்டு மொழியாக இயல்பாக இருப்பதால் ‘துதிப்பேன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மூலத்தில் உள்ள இறைத் திருப்பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் தருகிறது.
- source_word: בַּגּוֹיִם
  choice: பிற தேசத்தாரிடையே
  rationale: גּוֹיִם இங்கு இஸ்ரவேலுக்கு வெளியேயுள்ள தேச மக்களைக் குறிக்கிறது. ‘பிற தேசத்தார்’ என்பது பிற்கால சமயப் பொருளைத் தேவையின்றி ஏற்றாமல் மனிதக் குழுக்களைக் காட்டுகிறது.
- source_word: וּלְשִׁמְךָ
  choice: உமது பெயரை
  rationale: தமிழில் ‘பெயரைப் புகழ்ந்து பாடுதல்’ இயல்பான சொற்றொடர். ‘பெயர்’ என்பதைக் கைவிடாமல், வெளிப்படுத்தப்பட்ட அடையாளம் மற்றும் புகழ் ஆகிய நுணுக்கங்களையும் தக்கவைக்கிறது.
- source_word: אֲזַמֵּר
  choice: புகழ்ந்து பாடுவேன்
  rationale: זמר என்பதன் பியேல் வடிவத்தில் உள்ள இசையோடு கூடிய புகழ்ச்சியைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை பொதுப் பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக நான்கு எழுத்துகளைக் கொண்ட இறைத் திருப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே அந்தத் தனிப்பெயரை ஒலிபெயர்த்து, அதன் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: אוֹדְךָ என்பதில் நன்றியும் புகழ்ச்சியும் உள்ள நுணுக்கம்
  choice: உம்மைத் துதிப்பேன்
  alternative: உமக்கு நன்றி செலுத்துவேன்
  rationale: இரு பொருள்களும் எபிரேய வினைக்கு சாத்தியமானவை. இங்கு அடுத்த அடியில் இசைப் புகழ்ச்சி வருவதால் ‘துதிப்பேன்’ கவிதை இணைப்புக்கு ஏற்றது; எனினும் நன்றி கூறும் நுணுக்கம் முற்றிலும் நீக்கப்படவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், கவிதைக்குரிய கண்ணியத்துடன் மொழிபெயர்க்கப்பட்டது. இறைவனை நோக்கிய உரையில் மரியாதைப் பன்மையான ‘உம்மை/உமது’ பயன்படுத்தப்பட்டுள்ளது; இரண்டு இணை அடிகளின் புகழ்ச்சி அமைப்பும் பாதுகாக்கப்பட்டுள்ளது.
