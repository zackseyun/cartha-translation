source:
  edition: WLC
  text: הָ/אֵ֥ל מָעוּזִּ֖/י חָ֑יִל וַ/יַּתֵּ֥ר תָּמִ֖ים דרכ/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/033.yaml
  text: God is my strong refuge[a], and he makes my way blameless.
translation:
  language: ta
  text: தேவன் எனக்கு வலிமையான அடைக்கலம்; அவர் என் வழியைச் செம்மையாக்குகிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மெய்யெழுத்து வடிவத்தை இன்னும் நேரடியாகப் பின்பற்றி, “அவர் அவருடைய வழியைச் செம்மையாக்குகிறார்.” சங்கீதம் 18:32-இன் இணை வாசகம் “என் வழி” என்பதை ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֵל
  choice: தேவனே
  rationale: குறிப்பிட்ட இறைவனைச் சுட்டும் இச்சொல், கவிதைச் சூழலில் இயல்பான தமிழில் அழுத்தத்துடன் ‘தேவனே’ என வழங்கப்படுகிறது.
- source_word: מָעוּזִּי חָיִל
  choice: எனக்கு வலிமையான அடைக்கலம்
  rationale: מָעוֹז என்பதன் பாதுகாப்பு/புகலிடப் பொருளையும் חָיִל என்பதன் வலிமைப் பொருளையும் இணைத்து, மிகுதியான இராணுவப் படிமத்தைத் தவிர்க்கிறது.
- source_word: וַיַּתֵּר
  choice: ஆக்குகிறார்
  rationale: இங்கு கடினமான இவ்வினை, தொடர்ந்து வரும் תָּמִים என்பதோடு சேர்ந்து வழியை ஒரு குறிப்பிட்ட நிலைக்கு அமைத்தல் அல்லது ஆக்குதல் என்ற பொருளைத் தருகிறது.
- source_word: תָּמִים
  choice: பழுதற்றதாக
  rationale: முழுமை, நேர்மை, குற்றமின்மை ஆகிய பொருள் வரம்பைத் தக்கவைத்து, பாவமே இல்லாத முழுநிறைவு என்ற தேவையற்ற கருத்தைத் திணிக்காமல் இயல்பாக உள்ளது.
- source_word: דרכו
  choice: என் வழியை
  rationale: எழுத்துமெய் வடிவம் ‘அவருடைய வழி’ என வாசிக்க இடமளித்தாலும், சங்கீதம் 18:32-இன் இணை வாசகம் முதலாம் நபர் வாசிப்பை ஆதரிக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இறுதிச் சொல்லிலுள்ள சுட்டுப்பெயர் வாசிப்பு
  choice: தேவன் பேசுகிறவரின் வழியைப் பழுதற்றதாக ஆக்குகிறார்
  alternative: தேவன் தமது வழியைப் பழுதற்றதாக ஆக்குகிறார்
  rationale: சாமுவேல் உரையின் மெய்யெழுத்து வடிவம் ‘அவருடைய வழி’ என்ற வாசிப்புக்கு இடமளிக்கிறது; ஆனால் சங்கீதம் 18:32-இன் இணை வாசகம் ‘என் வழி’ என்பதை ஆதரிக்கிறது. உண்மையான உரைத் தெளிவின்மை அடிக்குறிப்பில் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியத்துடனும் பொதுவாசகர்களுக்குப் புரியும் இயல்புடனும் மொழிபெயர்க்கப்பட்டது. ‘கோட்டை’ போன்ற குறுகிய இராணுவப் படிமத்துக்குப் பதில் ‘வலிமையான அடைக்கலம்’ பயன்படுத்தப்பட்டுள்ளது.
