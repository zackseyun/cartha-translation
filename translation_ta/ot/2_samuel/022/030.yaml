source:
  edition: WLC
  text: כִּ֥י בְ/כָ֖ה אָר֣וּץ גְּד֑וּד בֵּ/אלֹהַ֖/י אֲדַלֶּג שֽׁוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/030.yaml
  text: For by you I can run against a troop[c][b][a]; by my God I can leap over a wall.
translation:
  language: ta
  text: 'ஏனெனில், உம்மால்[a] நான் ஒரு படைக்குழுவை[b] எதிர்த்து ஓட முடியும்;

    என் கடவுளால் நான் ஒரு மதிலைத்[c] தாண்டிக் குதிக்க முடியும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உம்மோடு’ அல்லது ‘உம் வழியாக’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய முன்னிடைச்சொல் உடனிருத்தலையோ வழிமுறையையோ குறிக்கலாம். இங்கு கடவுள் செயலை இயலச் செய்கிறார் என்ற பொருளில் வழிமுறையாக எடுத்துக்கொள்ளப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘கொள்ளையிடும் போர்க்குழு’.
    reason: lexical_alternative
  - marker: c
    text: அல்லது ‘அரண் மதில்’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய புகழுரைக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைத் தக்கவைக்கிறது.
- source_word: בְכָה
  choice: உம்மால்
  rationale: בְּ என்ற முன்னிடைச்சொல் இங்கு வழிமுறை அல்லது செயலாற்றச் செய்யும் காரணத்தைக் குறிக்கிறது; செயல் கடவுளால் இயலுகிறது என்பதைக் காட்டுகிறது.
- source_word: אָרוּץ
  choice: நான் ... ஓட முடியும்
  rationale: முதலாம் நபர் ஒருமை imperfect வடிவம் இக்கவிதைச் சூழலில் கடவுள் அளிக்கும் ஆற்றலால் இயலும் செயலைக் குறிக்கலாம்.
- source_word: גְּדוּד
  choice: ஒரு படைப்பிரிவை
  rationale: படைப்பிரிவு, போர்க்குழு, அல்லது கொள்ளையிடும் கூட்டம் எனப் பொருள்படும் சொல்லுக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: בֵּאלֹהַי
  choice: என் கடவுளால்
  rationale: முதல் அடியின் வழிமுறை அல்லது செயலாற்றச் செய்யும் காரணத்தைக் குறிக்கும் அமைப்பை மீண்டும் எடுத்துரைத்து, ‘என் கடவுள்’ என்ற தனிப்பட்ட உறவுத் தொனியையும் காக்கிறது.
- source_word: אֲדַלֶּג
  choice: நான் ... தாண்டிக் குதிக்க முடியும்
  rationale: ד־ל־ג என்ற வேரின் தீவிர வினைவடிவம் குதித்தல் அல்லது தாவுதல் என்பதைக் குறிக்கிறது; இணை அடியிலுள்ள ஆற்றல் சார்ந்த பொருளையும் காக்கிறது.
- source_word: שׁוּר
  choice: ஒரு மதிலை
  rationale: பாதுகாப்பு அல்லது கோட்டைச் சூழலிலுள்ள மதிலைக் குறிக்கும் நேரடியான, வாசிக்க எளிய சொல்.
theological_decisions:
- issue: போர்ச் சித்திரத்தில் கடவுள் அளிக்கும் ஆற்றல்
  choice: ‘ஓட முடியும் ... தாண்டிக் குதிக்க முடியும்’ என்று, கடவுளால் கிடைக்கும் திறனாக மொழிபெயர்க்கப்பட்டது.
  alternative: திறனை வெளிப்படையாகக் குறிப்பிடாமல், ‘ஓடுவேன் ... தாண்டிக் குதிப்பேன்’ என்று செயலை மட்டும் கூறுதல்.
  rationale: கவிதைச் சூழலிலுள்ள எபிரெய imperfect வினைகள் ஆற்றலளிக்கப்பட்ட திறனைக் குறிக்க இயலும். வெற்றி கடவுளால் வருகிறது என்ற வசனத்தின் அழுத்தத்தை இது காக்கிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியமான தொனியுடன் மொழிபெயர்க்கப்பட்டது. கடவுளை நேரடியாக அழைக்கும் இடத்தில் மரியாதைப் பன்மையான ‘உம்மால்’ பயன்படுத்தப்பட்டுள்ளது. இரண்டு இணை அடிகளின் அமைப்பும் ஆற்றலைக் குறிக்கும் வினைநடையும் தக்கவைக்கப்பட்டுள்ளன.
