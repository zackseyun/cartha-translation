  text: כִּ֥י שָׁמַ֖רְתִּי דַּרְכֵ֣י יְהוָ֑ה וְ/לֹ֥א רָשַׁ֖עְתִּי מֵ/אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/022.yaml
  text: For I have kept the ways of Yahweh[a], and have not wickedly departed from my God.
translation:
  language: ta
  text: ஏனெனில், நான் யாவேயின் வழிகளைக் கடைப்பிடித்தேன்; என் கடவுளைவிட்டு தீய முறையில் விலகிச் செல்லவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இயல்பாக அமைகிறது.
- source_word: שָׁמַרְתִּי
  choice: கடைப்பிடித்தேன்
  rationale: שׁמר என்பதன் ‘காத்தல், பின்பற்றுதல்’ என்ற பொருளை, நடத்தை சார்ந்த ‘வழிகள்’ என்பதுடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: דַּרְכֵי
  choice: வழிகளை
  rationale: இங்கு வெறும் பாதைகளையல்ல, வாழ்வுமுறைகளையும் கட்டளையிட்ட நடத்தையையும் குறிக்கிறது; ‘வழிகள்’ மூல உருவகத்தைப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: וְלֹא רָשַׁעְתִּי
  choice: தீமை செய்யவில்லை
  rationale: רשע வினையின் ‘தீய முறையில் நடந்துகொள்ளுதல்’ என்ற ஒழுக்கப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: מֵאֱלֹהָי
  choice: என் கடவுளைவிட்டு விலகி
  rationale: מִן என்பதன் பிரிவு சார்ந்த ‘விட்டு/இருந்து’ என்ற விசையைப் பேணி, எபிரெயச் சொற்றொடரின் இயல்பான பொருளைத் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக இருப்பதால், அதைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது பொருத்தமானது.
- issue: רָשַׁעְתִּי מֵאֱלֹהָי என்பதன் தொடர்பு
  choice: என் கடவுளைவிட்டு விலகித் தீமை செய்யவில்லை
  alternative: என் கடவுளுக்கு எதிராகத் தீமை செய்யவில்லை
  rationale: מִן வழக்கமாகப் பிரிவைச் சுட்டுவதால் ‘விட்டு விலகி’ என்பதை முதன்மைப்படுத்துகிறது; அதேவேளை רשע என்பதன் ஒழுக்கத் தீமைப் பொருளையும் தனியே பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைநடையின் கண்ணியத்தையும் இணையான இரண்டு கூறுகளையும் பேணிய மொழிபெயர்ப்பு. ‘கடைப்பிடித்தேன்’ பொதுவாசகருக்குப் புரியும்வகையில் கட்டுப்பாட்டுடனான கீழ்ப்படிதலைக் குறிக்கிறது; இரண்டாம் கூறு எபிரெயில் உள்ள ஒழுக்க மற்றும் உறவு சார்ந்த இரு பரிமாணங்களையும் இயல்பான தமிழில் இணைக்கிறது.
