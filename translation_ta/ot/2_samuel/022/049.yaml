  source_fidelity: மூல எபிரெயத்தின் தொடர்ச்சியான இறைமுக அழைப்புப் பாங்கைத் தமிழ் உரை நன்றாகக் காக்கிறது. וּמוֹצִיאִי என்பதன் ‘என்னை வெளியே கொண்டுவருகிறவர்’ என்னும் உருவகமும், எதிராக எழுவோருக்கு மேலாக உயர்த்தப்படுதல், வன்முறையாளனிடமிருந்து மீட்கப்படுதல் ஆகிய பொருள்களும் துல்லியமாகத் தரப்பட்டுள்ளன. איש ஒருமையும் ‘வன்முறையாளன்’ என்பதில் பாதுகாக்கப்பட்டுள்ளது.
