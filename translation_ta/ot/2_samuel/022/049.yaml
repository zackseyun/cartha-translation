  yaml_path: translation/ot/2_samuel/022/049.yaml
  text: who brings me out from my enemies[a]; you exalt me above those who rise against me[b]; you deliver me from the violent man.
translation:
  language: ta
  text: என் பகைவர்களிடமிருந்து என்னை வெளியே கொண்டுவருகிறவரே[a], எனக்கு எதிராக எழுகிறவர்களுக்கு மேலாக என்னை உயர்த்துகிறீர்; வன்முறையாளனிடமிருந்து[b] என்னை மீட்கிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் பகைவர்களிடமிருந்து என்னை வெளியே கொண்டுவருகிறவரும் நீரே”; எபிரெயத் தொடரின் தொடக்க இணைப்புச்சொல்லை இவ்வாறு வெளிப்படையாக மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “வன்முறையின் மனிதனிடமிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹצִיאִי
  choice: என்னை வெளியே கொண்டுவருகிறவரே
  rationale: הוציא என்பதன் காரணவினைப் பொருளான ‘வெளியே கொண்டுவருதல்’ என்ற உருவகத்தைப் பாதுகாக்கிறது. முந்தைய சூழலில் வரும் கடவுளைப் பற்றிய தொடர்பெயர் வரிசையைத் தமிழில் இயல்பான விளிப்பாகக் காட்டுகிறது.
- source_word: מֵאֹיְבָי
  choice: என் பகைவர்களிடமிருந்து
  rationale: מִן முன்னிடைச்சொல்லையும், ‘என் பகைவர்கள்’ என்ற முதலாம் நபர் உரிமையையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וּמִקָּמַי
  choice: எனக்கு எதிராக எழுகிறவர்கள்
  rationale: קום என்பதிலுள்ள ‘எழுதல்’ என்ற வினை உருவகத்தையும் அதன் பகைமைப் பொருளையும் பாதுகாக்கிறது.
- source_word: תְּרוֹמְמֵנִי
  choice: எனக்கு ... மேலாக என்னை உயர்த்துகிறீர்
  rationale: רום என்பதிலுள்ள உயர்த்துதல் என்ற செங்குத்து உருவகத்தையும் எதிரிகள்மேல் வெற்றி பெறும் கருத்தையும் வெளிப்படுத்துகிறது.
- source_word: מֵאִישׁ חֲמָסִים
  choice: வன்முறையாளனிடமிருந்து
  rationale: איש என்ற ஒருமையைப் பாதுகாத்து, חמסים குறிக்கும் வன்முறையை நவீனத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: תַּצִּילֵנִי
  choice: என்னை மீட்கிறீர்
  rationale: נצל குறிக்கும் ஆபத்திலிருந்து விடுவித்தல் அல்லது காப்பாற்றுதல் என்ற பொருளை, உயர்ந்த கவிதை நடைக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
