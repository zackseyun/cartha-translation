  text: You save an afflicted people[b][a], but your eyes are on the haughty to bring them low.
translation:
  language: ta
  text: துன்புறும் மக்களை நீர் காப்பாற்றுகிறீர்[a]; ஆனால் மேட்டிமையானவர்கள்மேல்[b] உமது கண்கள் இருக்கின்றன; அவர்களை நீர் தாழ்த்துகிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏழை மக்களை.’ எபிரெயப் பெயரடை ஏழைகள், துன்புறுவோர் அல்லது ஒடுக்கப்பட்டோர் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பெருமையுள்ளவர்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: மக்கள்
  rationale: ஒருமை வடிவிலுள்ள கூட்டுப்பெயர் ஒரு மக்கள் குழுவைக் குறிக்கிறது; நவீன தமிழில் ‘மக்கள்’ இயல்பாகவும் கவிதை இணைப்புக்கு ஏற்றதாகவும் உள்ளது.
- source_word: עָנִי
  choice: ஒடுக்கப்பட்ட
  rationale: இந்தச் சொல் ஏழ்மை, துன்பம், ஒடுக்குதல், தாழ்ந்த நிலை ஆகிய பொருள் நிழல்களைக் கொண்டது. இங்கு வெறும் பொருளாதார ஏழ்மையாகக் குறுக்காமல், அனுபவிக்கும் துன்பத்தையும் சமூகத் தாழ்வையும் ‘ஒடுக்கப்பட்ட’ வெளிப்படுத்துகிறது.
- source_word: תּוֹשִׁיעַ
  choice: நீர் காப்பாற்றுகிறீர்
  rationale: ישׁע என்பதன் ஹிஃபில் வடிவம் காப்பாற்றுதல் அல்லது விடுவித்தல் என்பதைக் குறிக்கிறது. ‘காப்பாற்றுகிறீர்’ அதன் விரிவான பொருளை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: עֵינֶיךָ
  choice: உமது கண்கள்
  rationale: எபிரெயத்தின் நேரடியான, உருவகத் தெளிவுள்ள சொல்லாட்சியைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: רָמִים
  choice: மேட்டிமையானவர்கள்
  rationale: רום சார்ந்த இந்த வடிவம் உயர்ந்திருப்பவர்களை இங்கு எதிர்மறையான ஒழுக்கப் பொருளில் குறிக்கிறது. ‘மேட்டிமையானவர்கள்’ என்பது உயர்வு மற்றும் அகந்தை ஆகிய இரு நிழல்களையும் எடுத்துரைக்கிறது.
- source_word: תַּשְׁפִּיל
  choice: தாழ்த்துவதற்காக
  rationale: שׁפל என்பதன் ஹிஃபில் வடிவம் தாழ்த்துதல் அல்லது அடக்குதல் என்று பொருள். முன்வரும் ‘கண்கள் அவர்கள்மேல்’ என்ற சொல்லாட்சியோடு இயல்பாக இணைய நோக்கப் பொருள் கொண்ட அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: וְאֶת
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: אֵת நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கணக் குறியீடு; தமிழ்ச் சொற்றொடரமைப்பில் அது மறைமுகமாகவே வெளிப்படுகிறது.
- source_word: וְ
  choice: ஆனால்
  rationale: வடிவில் ‘மற்றும்’ என்றாலும், துன்புறுவோரைக் காப்பாற்றுவதற்கும் மேட்டிமையானவர்களைத் தாழ்த்துவதற்கும் இடையிலான கவிதை எதிர்மறையை ‘ஆனால்’ தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: சமூக நிலை சார்ந்த எதிர்மையா, ஒழுக்கம் சார்ந்த எதிர்மையா
  choice: ஒடுக்கப்பட்ட மக்களைக் கடவுள் காப்பாற்றுவதும் மேட்டிமையானவர்களைத் தாழ்த்துவதும் எதிரெதிராக வைக்கப்படுகின்றன.
  alternative: பொருளாதாரத்தில் ஏழைகளுக்கும் சமூகத்தில் உயர்ந்தவர்களுக்கும் இடையிலான எதிர்மை மட்டும்.
  rationale: எபிரெயச் சொற்களில் சமூகப் பொருளும் இருக்கலாம்; ஆனால் கவிதை இணையும் பரந்த வேதாகமப் பயன்பாடும் தாழ்ந்தோர்/துன்புறுவோர் மற்றும் அகந்தையுள்ளோர் இடையிலான ஒழுக்க-இறையியல் எதிர்மையையும் ஆதரிக்கின்றன. மொழிபெயர்ப்பு பொருளாதார அர்த்தத்தை முற்றிலும் நீக்காமலும் அதற்கு மட்டும் வசனத்தை வரையறுக்காமலும் உள்ளது.
translation_notes:
  register: நவீன செந்தமிழ் கலந்த பொதுநடை பயன்படுத்தப்பட்டுள்ளது. இறைவனைச் சுட்டும் மரியாதை ஒருமைக்காக ‘நீர்/உமது’ வைக்கப்பட்டுள்ளது. கவிதையின் எதிர்மையைத் தெளிவாக்க ‘ஆனால்’ பயன்படுத்தப்பட்டாலும், ‘கண்கள்’ என்ற எபிரெய உருவகம் அப்படியே பாதுகாக்கப்பட்டுள்ளது.
