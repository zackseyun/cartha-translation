base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/007.yaml
  text: In my distress I call on Yahweh[a]; I call to my God. He hears my voice from his temple[b], and my cry for help reaches his ears.
translation:
  language: ta
  text: என் நெருக்கடியில் நான் யாவேயை நோக்கிக் கூப்பிட்டேன்; என் தேவனை நோக்கிக் கூப்பிட்டேன். அவர் தமது ஆலயத்திலிருந்து[a] என் குரலைக் கேட்டார்; உதவிக்கான என் கூக்குரல் அவர் செவிகளை எட்டியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆலயம்” என்பதற்கான எபிரெயச் சொல் “அரண்மனை” அல்லது “பரிசுத்தஸ்தலம்” என்றும் பொருள்படும்; இங்கு அது தேவனுடைய விண்ணக வாசஸ்தலத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: எனக்கு நெருக்கம் ஏற்பட்டபோது
  rationale: צַר என்பது இங்கு துன்பம், நெருக்கடி, இடுக்கண் ஆகியவற்றைக் குறிக்கிறது. எபிரெயச் சொற்றொடரின் தனிப்பட்ட அனுபவத்தையும் சூழ்நிலைக் காலத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶקְרָא
  choice: நோக்கிக் கூப்பிட்டேன்
  rationale: קרא என்பதன் அடிப்படைப் பொருள் ‘அழைத்தல்/கூப்பிடுதல்.’ இரு அரையடிகளிலும் வரும் வினைச்சொல் மீளுருவாக்கத்தைத் தமிழிலும் ஒரே சொல்லால் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பட்ட திருப்பெயரான நான்கெழுத்துப் பெயர். அதனைத் தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: אֱלֹהַי
  choice: என் தேவன்
  rationale: முதல் நபர் ஒருமை உடைமை விகுதியுடன் உள்ள சொல்லை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: וַיִּשְׁמַע
  choice: கேட்டார்
  rationale: எபிரெயக் கதைநடை வினை வடிவின் இறந்தகால நிகழ்வை நேரடியாகக் காக்கிறது; பாடலின் சாட்சியத் தன்மைக்கும் இது பொருந்துகிறது.
- source_word: מֵהֵיכָלוֹ
  choice: தமது ஆலயத்திலிருந்து
  rationale: הֵיכָל என்பது ஆலயம், அரண்மனை அல்லது பரிசுத்த இடம் எனப் பொருள்படலாம். தேவனைக் குறிக்கும் இச்சூழலில் ‘ஆலயம்’ முதன்மையான இயல்பான தெரிவாகும்; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: קוֹלִי
  choice: என் குரல்
  rationale: சொல்லின் நேரடியான பொருளைச் சுருக்கமாகக் காக்கிறது.
- source_word: שַׁוְעָתִי
  choice: உதவிக்கான என் கூக்குரல்
  rationale: שַׁוְעָה என்பது துன்பத்தில் உதவி நாடி எழுப்பப்படும் கூக்குரலைக் குறிக்கிறது; வேண்டுகோளின் நோக்கத்தைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּאָזְנָיו
  choice: அவர் செவிகளை எட்டியது
  rationale: சொல்லுக்கு சொல் ‘அவர் செவிகளில்’ என்ற உருவகத்தை, நவீன தமிழில் இயல்பான இயக்கமுள்ள சொற்றொடராக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் பட்டப்பெயருக்குப் பதிலாகத் தனிப்பட்ட திருப்பெயர் நேரடியாக உள்ளது. ஆகவே அதன் பெயர்த்தன்மையை மறைக்காமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- issue: הֵיכָל குறிக்கும் தேவனுடைய வாசஸ்தலம்
  choice: ஆலயம்
  alternative: அரண்மனை / பரிசுத்த இடம்
  rationale: இச்சொல் அரசரின் அரண்மனையையும் ஆலயத்தையும் குறிக்கக்கூடும். தேவனுடைய விண்ணக வாசஸ்தலத்தை அரச மற்றும் வழிபாட்டு உருவகங்கள் ஒன்றிணைந்து சுட்டக்கூடிய தெளிவின்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இருமுறை வரும் ‘கூப்பிட்டேன்’ என்ற அமைப்பு திட்டமிட்டு காக்கப்பட்டுள்ளது; இறந்தகாலம் எபிரெயப் பாடலின் நிகழ்வுரையைப் பின்பற்றுகிறது.
