  text: You widen my steps beneath me[b][a], and my ankles have not given way.
translation:
  language: ta
  text: என் காலடிகளுக்குக் கீழே அகன்ற இடம் அளிக்கிறீர்[a]; என் கணுக்கால்கள் தடுமாறவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச்சொல், “என் காலடிகளை எனக்குக் கீழே அகலமாக்குகிறீர்.” இந்த எபிரெயச் சொல்லாட்சி பாதுகாப்பாக நடப்பதற்கு விசாலமான இடம் அளிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் கணுக்கால்கள் சறுக்கவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְחִיב
  choice: அகன்ற இடம் அளிக்கிறீர்
  rationale: רחב என்பதன் ஹிஃபில் வடிவம் அகலமாக்குதல் அல்லது விசாலமாக்குதல் என்ற காரணவினைப் பொருளைத் தருகிறது. தமிழில் காலடிகளுக்குக் கீழே நகர்வதற்கான விசாலமான, பாதுகாப்பான இடத்தை அளிப்பது என இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: צַעֲדַי
  choice: என் காலடிகளுக்கு
  rationale: צעד என்பது ‘அடி’ அல்லது ‘காலடி நடை’ என்பதைக் குறிக்கிறது. ‘என் காலடிகளை அகலமாக்குகிறீர்’ என்பது தமிழில் தவறாகப் புரிந்துகொள்ளப்படக்கூடும் என்பதால், எபிரெயச் சொல்லாட்சியின் கருத்தை ‘என் காலடிகளுக்குக் கீழே அகன்ற இடம்’ என வழங்குகிறது; நேரடியான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: תַּחְתֵּנִי
  choice: கீழே
  rationale: ‘எனக்குக் கீழே’ என்ற இடவியல் படிமம், ‘என் காலடிகளுக்குக் கீழே’ என்ற இயல்பான தமிழ்ச் சொற்றொடரில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְלֹא
  choice: ; ... இல்லை
  rationale: எளிய இணைப்பும் மறுப்பும் இணையான இரு கவிதை உறுப்புகளாகத் தரப்பட்டுள்ளன; நோக்கத்தையோ விளைவையோ தேவையின்றிச் சேர்க்கவில்லை.
- source_word: מָעֲדוּ
  choice: தடுமாறவில்லை
  rationale: מעד என்பது இடறுதல், சறுக்குதல், தடுமாறுதல் அல்லது நிலைகுலைதல் எனப் பொருள்படலாம். கணுக்கால்கள் என்ற எழுவாயுடன் ‘தடுமாறவில்லை’ என்பது நிலைத்தன்மையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: קַרְסֻלַּי
  choice: என் கணுக்கால்கள்
  rationale: இந்தச் சொல் பொதுவாகப் பாதங்களை அல்ல, குறிப்பாகக் கணுக்கால் பகுதியைக் குறிக்கிறது; உடல்சார் படிமத்தைத் துல்லியமாகப் பாதுகாக்கிறது.
