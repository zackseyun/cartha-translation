    text: 'எபிரெயம்: ‘என் விளக்கு’; மாற்றாக, ‘என் ஒளி’ என்றும் மொழிபெயர்க்கலாம். இங்கு அருவமான ஒளியைவிட, ஒளி தரும் விளக்கின் தெளிவான படிமம் உள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான அடிப்படையையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இருப்பதால், அதன் காரணத் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: אַתָּה
  choice: நீரே
  rationale: கடவுளை நேரடியாக முன்னிலைப்படுத்தி அழைக்கும் இரண்டாம் நபர் ஒருமையை மரியாதையான நவீனத் தமிழில் தருகிறது; ஏகாரமும் எபிரெயச் சொல்லின் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נֵירִי
  choice: என் விளக்கு
  rationale: נֵיר என்பது அருவமான ‘ஒளி’ என்பதைவிடக் குறிப்பாக விளக்கைக் குறிக்கிறது; கடவுளை ஒளி அளிக்கும் விளக்காகச் சித்தரிக்கும் தெளிவான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான יהוה என்பதை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: יַגִּיהַּ
  choice: ஒளிரச் செய்கிறார்
  rationale: נגד அல்ல, נגה வேரின் ஹிஃபில் வடிவம் ‘ஒளி உண்டாக்குதல்/ஒளிரச் செய்தல்’ என்ற காரணவினைப் பொருளைக் கொண்டது; தமிழ் சொற்றொடர் அந்தப் பொருளையும் கவித்துவப் படிமத்தையும் காக்கிறது.
- source_word: חָשְׁכִּי
  choice: என் இருளை
  rationale: முதல் நபர் ஒருமை உடைமைப் பின்னொட்டையும் ‘இருள்’ என்ற உருவகத்தின் திறந்த பொருளையும் காக்கிறது; அதைத் துன்பம், ஆபத்து அல்லது மனச்சோர்வு என்று குறுக்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை தனிப்பட்ட திருப்பெயரைப் பயன்படுத்துகிறது. அதை ஒரு பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது பெயரின் தன்மையைப் பாதுகாக்கிறது; ‘யெகோவா’வைக் காட்டிலும் ‘யாவே’ மூல மெய்யெழுத்துப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்படும் மறுகட்டமைப்புக்கு நெருக்கமானது.
- issue: இரண்டாம் கூறில் நேரடி அழைப்பிலிருந்து மூன்றாம் நபர் கூற்றுக்கு மாறுதல்
  choice: ‘யாவே, நீரே …; யாவே … செய்கிறார்’ என்ற இலக்கண மாற்றத்தைப் பாதுகாத்தல்
  alternative: 'இரு கூறுகளையும் முழுவதும் இரண்டாம் நபரில் அமைத்தல்: ‘நீரே … நீரே என் இருளை ஒளிரச் செய்கிறீர்’'
  rationale: எபிரெயத்தில் முதல் கூறு אַתָּה என்ற நேரடி இரண்டாம் நபரையும், இரண்டாம் கூறு יְהוָה + மூன்றாம் நபர் வினையையும் கொண்டுள்ளது. சற்றே அசாதாரணமான இந்தக் கவித்துவ மாற்றத்தைச் சீராக்காமல் பாதுகாப்பது மூல வடிவத்துக்கு விசுவாசமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையான தெய்வ அழைப்பாக ‘நீர்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. கவித்துவ இணை அமைப்பையும், ‘என் விளக்கு / என் இருள்’ என்ற தனிப்பட்ட உருவகங்களையும், இரண்டாம் நபரிலிருந்து மூன்றாம் நபருக்கு நிகழும் மூல இலக்கண மாற்றத்தையும் பாதுகாக்கும் உகந்த-ஒப்புமை நடை.
