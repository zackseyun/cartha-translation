  terminology: ‘யாவே’ consistently renders יהוה as a personal divine name. ‘விளக்கு’ is the appropriately concrete equivalent of נֵיר, rather than the less precise abstract ‘ஒளி.’ The respectful ‘நீரே’ is suitable for direct divine address; the following third-person honorific verb appropriately preserves the source’s person shift.
