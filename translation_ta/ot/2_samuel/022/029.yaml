  text: For you are my lamp[a], O Yahweh[b], and Yahweh lights up my darkness.
translation:
  language: ta
  text: ஏனெனில், யாவே, நீரே என் விளக்கு[a]; யாவே என் இருளுக்கு ஒளியூட்டுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
