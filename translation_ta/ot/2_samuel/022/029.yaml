  source_fidelity: 'The draft accurately represents the Hebrew syntax and imagery: כִּי as ‘ஏனெனில்,’ the explicit second-person address ‘யாவே, நீரே,’ נֵירִי as ‘என் விளக்கு,’ and the deliberate shift in the second colon to Yahweh as third-person subject. ‘என் இருள்’ correctly retains the first-person possessive and leaves the metaphor uninterpreted.'
