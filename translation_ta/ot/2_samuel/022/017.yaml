  yaml_path: translation/ot/2_samuel/022/017.yaml
  text: He sent from on high[a]; he took me[b]; he drew me out of many waters.
translation:
  language: ta
  text: அவர் உயரத்திலிருந்து கை நீட்டினார்[a]; அவர் என்னை எடுத்துக்கொண்டார்; அவர் என்னைப் பல நீர்களிலிருந்து இழுத்தெடுத்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லளவில், “அவர் உயரத்திலிருந்து அனுப்பினார்” அல்லது “நீட்டினார்.” “கை” என்பது வெளிப்படையாகக் கூறப்படவில்லை; மீட்பின் சூழலை வெளிப்படுத்தத் தமிழில் சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லளவில், “பல நீர்களிலிருந்து.” “மிகுந்த நீர்களிலிருந்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: தம் கையை நீட்டி
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘அனுப்புதல்/நீட்டுதல்.’ இங்கு மறைந்துள்ள செயப்படுபொருளைத் தமிழில் இயல்பாக வெளிப்படுத்தவும், மீட்புச் சூழலைத் தேவையின்றி விரிவுபடுத்தாமலும் ‘தம் கையை நீட்டி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מִמָּרוֹם
  choice: உயரத்திலிருந்து
  rationale: மָרוֹם என்பது உயர்ந்த இடத்தைக் குறிக்கிறது. ‘வானத்திலிருந்து’ என்று பொருளைச் சுருக்காமல், மூலத்தின் கவித்துவமான இடவியல் சொல்லாட்சியை இது காக்கிறது.
- source_word: יִקָּחֵנִי
  choice: என்னைப் பற்றிக்கொண்டார்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்.’ நீரிலிருந்து மீட்கும் தொடர்ச்சியான உருவகத்தில், தமிழில் ‘பற்றிக்கொண்டார்’ என்பது செயலை இயல்பாகவும் தெளிவாகவும் காட்டுகிறது; ‘கைப்பற்றினார்’ என்ற வன்மையான நிழற்பொருளைத் தவிர்க்கிறது.
- source_word: יַמְשֵׁנִי
  choice: என்னை இழுத்தெடுத்தார்
  rationale: משה என்பதன் ஹிஃபில் வடிவம், குறிப்பாக நீரிலிருந்து வெளியே இழுத்தெடுப்பதைக் குறிக்கிறது. ‘இழுத்தெடுத்தார்’ என்பது அந்த மீட்பு உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: מִמַּיִם רַבִּים
  choice: பெருவெள்ளத்திலிருந்து
  rationale: சொல்லளவில் ‘பல/மிகுந்த நீர்களிலிருந்து.’ சங்கீதத் தன்மையுள்ள தமிழில் ‘பெருவெள்ளம்’ நீரின் மிகுதியையும் அபாயத்தையும் இயல்பாக வெளிப்படுத்துகிறது; மாற்றுச் சொல்லளவுப் பெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: மேலிருந்து நிகழும் தெய்வீக மீட்பின் உருவகம்
  choice: ‘உயரத்திலிருந்து’ என்ற கவித்துவமான இடவியல் மொழியைத் தக்கவைத்தல்
  alternative: ‘வானத்திலிருந்து’
  rationale: எபிரெய உரை ‘வானம்’ என்று வெளிப்படையாகச் சொல்லாமல் ‘உயரம்’ என்கிறது. ஆகவே தெய்வீகத் தலையீட்டை வெளிப்படுத்திக்கொண்டே, மூலத்தைவிடக் குறிப்பான அண்டவியல் விளக்கத்தைச் சேர்க்கவில்லை.
- issue: יִשְׁלַח என்பதின் வெளிப்படாத செயப்படுபொருள்
  choice: தமிழில் இயல்புக்காக ‘தம் கையை’ என வெளிப்படுத்துதல்
  alternative: ‘அவர் உயரத்திலிருந்து அனுப்பினார்’
  rationale: எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை; அடுத்துள்ள ‘என்னைப் பற்றிக்கொண்டார்’ என்பது நீட்டப்பட்ட கை என்ற மீட்பு உருவகத்தை உணர்த்துகிறது. இதை அடிக்குறிப்புடன் வெளிப்படுத்துவது தெளிவையும் மூலத்தின் நெகிழ்வையும் சமநிலைப்படுத்துகிறது.
