- from: அவர் உயரத்திலிருந்து தம் கையை நீட்டி[a] என்னைப் பற்றிக்கொண்டார்; பெருவெள்ளத்திலிருந்து என்னை இழுத்தெடுத்தார்[b].
  to: அவர் உயரத்திலிருந்து கை நீட்டினார்[a]; அவர் என்னை எடுத்துக்கொண்டார்; அவர் என்னைப் பல நீர்களிலிருந்து இழுத்தெடுத்தார்[b].
