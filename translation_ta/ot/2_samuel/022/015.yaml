source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח חִצִּ֖ים וַ/יְפִיצֵ֑/ם בָּרָ֖ק ו/יהמ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/015.yaml
  text: He sent arrows and scattered them; lightning[a], and threw them into confusion.
translation:
  language: ta
  text: அவர் அம்புகளை அனுப்பி அவர்களைச் சிதறடித்தார்; மின்னலால் அவர்களைக் குழப்பமடையச் செய்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களை முறியடித்தார்’ என்றும் மொழிபெயர்க்கலாம்; அம்புகளும் மின்னலும் தாவீதின் எதிரிகள்மீது ஏற்படுத்திய விளைவை இரு வினைகளும் இவ்வாறு குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: எய்து
  rationale: שלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்பு’ என்றாலும், அம்புகளைப் பற்றிய தமிழ்ச் சொல்லாக்கத்தில் ‘எய்து’ இயல்பாகவும் கவித்துவப் போர்க்காட்சியைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: חִצִּים
  choice: அம்புகளை
  rationale: חִצִּים என்பதற்கான நேரான, இயல்பான தமிழ் இணை; மூலத்தின் உறுதியான போர்க்காட்சியைப் பாதுகாக்கிறது.
- source_word: וַיְפִיצֵם
  choice: அவர்களைச் சிதறடித்தார்
  rationale: இந்த causative வினை ‘சிதறச் செய்தல்/சிதறடித்தல்’ என்று பொருள்படும். சுற்றியுள்ள தெய்வீகப் போர்ச் சூழலில் பன்மை விகுதி எதிரிகளைக் குறிக்கிறது.
- source_word: בָּרָק
  choice: மின்னலை
  rationale: בָּרָק என்பது ‘மின்னல்’ அல்லது ‘மின்னல் வீச்சு’ என்று பொருள்படும்; ஒருமை வடிவத்தையும் சுருக்கமான கவித்துவ நடையையும் இது காக்கிறது.
- source_word: וַיְהֻמֵּם
  choice: அவர்களைக் குழப்பமடையச் செய்தார்
  rationale: המם என்பதன் causative பொருளான ‘கலங்கச் செய்தல், குழப்பத்தில் ஆழ்த்துதல், முறியடித்தல்’ என்பவற்றில், ‘குழப்பமடையச் செய்தார்’ மூலத்தின் விளைவை இராணுவத் தோல்வியாக மட்டும் சுருக்காமல் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘சிதறடித்தார்’ மற்றும் ‘குழப்பமடையச் செய்தார்’ என்பவற்றின் பன்மைச் சுட்டுப்பெயர் யாரைக் குறிக்கிறது?
  choice: சுற்றியுள்ள பாடல் சூழலில் தாவீதின் எதிரிகளைக் குறிக்கிறது; தமிழில் ‘அவர்களை’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
  alternative: செயப்படுபொருளைச் சூழலிலிருந்து புரிந்துகொள்ளும்படி மறைமுகமாக விடலாம்.
  rationale: எபிரெயத்தில் இரு வினைகளோடும் மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டு உள்ளது. தெய்வீகப் போர்க்காட்சியின் சூழலில் எதிரிகளே இயல்பான குறிப்பு; அவர்களின் அடையாளத்தை வசனத்துக்குள் தேவையின்றி விரிவாக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் கண்ணியமான கவித்துவ நடை. எபிரெய வசனத்தின் இணையான இரு போர்க்காட்சிகளும் காக்கப்பட்டுள்ளன. ‘அவர்’ என்பது முந்தைய சூழலில் வரும் ஆண்டவரைக் குறிக்கிறது.
