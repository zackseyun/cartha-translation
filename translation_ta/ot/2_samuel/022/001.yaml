  text: וַ/יְדַבֵּ֤ר דָּוִד֙ לַֽ/יהוָ֔ה אֶת דִּבְרֵ֖י הַ/שִּׁירָ֣ה הַ/זֹּ֑את בְּ/יוֹם֩ הִצִּ֨יל יְהוָ֥ה אֹת֛/וֹ מִ/כַּ֥ף כָּל אֹיְבָ֖י/ו וּ/מִ/כַּ֥ף שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/001.yaml
  text: And David spoke to Yahweh the words of this song on the day when Yahweh delivered him from the hand of all his enemies and from the hand of Saul[a].
translation:
  language: ta
  text: யாவே தாவீதை அவருடைய எல்லா எதிரிகளின் பிடியிலிருந்தும் சவுலின் பிடியிலிருந்தும் விடுவித்த நாளில், தாவீது இந்தப் பாடலின் வார்த்தைகளை யாவேயிடம் உரைத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயம்: “இந்தப் பாடலின் வார்த்தைகளை”; உரை இதை ஒரு பாடலாக வெளிப்படையாக அறிமுகப்படுத்துகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: உரைத்தார்
  rationale: דבר என்பதன் அடிப்படைப் பொருள் ‘பேசுதல்/உரைத்தல்’. உள்ளடக்கம் பாடலாக இருந்தாலும், எபிரெய உரை தாவீது அதைப் ‘பாடினார்’ என்று சொல்லாமல், பாடலின் வார்த்தைகளை ‘உரைத்தார்’ என்று கூறுவதால் அந்த வடிவம் காக்கப்படுகிறது.
- source_word: לַיהוָה / יְהוָה
  choice: யெகோவா
  rationale: יהוה என்னும் தனிப்பட்ட இறைப்பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், நவீன தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என்ற ஒலிபெயர்ப்பால் தருகிறது.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: இந்தப் பாடலின் வார்த்தைகளை
  rationale: எபிரெயத்தில் உள்ள ‘வார்த்தைகள்’ மற்றும் ‘பாடல்’ ஆகிய இரு கூறுகளையும் வெளிப்படையாகக் காக்கிறது.
- source_word: בְּיוֹם
  choice: நாளில்
  rationale: பாடல் உரைக்கப்பட்ட சந்தர்ப்பத்தைச் சுட்டும் காலக் குறிப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: הִצִּיל
  choice: விடுவித்த
  rationale: பகைவர்களின் அதிகாரத்திலிருந்தும் ஆபத்திலிருந்தும் மீட்ட செயலைச் சூழலுக்கு ஏற்ற தெளிவான தமிழில் தெரிவிக்கிறது.
- source_word: מִכַּף
  choice: பிடியிலிருந்து
  rationale: சொற்பொருளில் ‘கை/உள்ளங்கை’ என்றாலும், இங்கு அதிகாரம் அல்லது கட்டுப்பாடு என்னும் உருவகப் பொருள் உள்ளது; ‘பிடி’ அந்த உருவகத்தையும் இயல்பான தமிழையும் இணைக்கிறது.
- source_word: כָּל אֹיְבָיו
  choice: அவருடைய எல்லா எதிரிகளின்
  rationale: கூட்டுப்பொருளையும் முழுமையையும் தெளிவாகக் காக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: தமிழ் வேதாகம வழக்கில் நிலைபெற்ற தனிப்பெயர் வடிவம்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருமுறை வருகிறது. பொதுப்பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாக பெயராகவே வழங்கப்படுகிறது; ‘யெகோவா’ நவீன தமிழ் வாசகர்களுக்கு அறிமுகமான ஒலிபெயர்ப்பு.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். எபிரெய வாக்கியத்தின் முன்னிலை காலத் துணைப்பகுதியைத் தமிழில் இயல்பாக முதலில் வைத்து, ‘பாடலின் வார்த்தைகளை உரைத்தார்’ என்ற மூலத்தின் குறிப்பிடத்தக்க சொல்லாக்கம் பாதுகாக்கப்பட்டுள்ளது.
