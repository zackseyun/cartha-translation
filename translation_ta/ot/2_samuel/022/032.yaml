  text: כִּ֥י מִי אֵ֖ל מִ/בַּלְעֲדֵ֣י יְהוָ֑ה וּ/מִ֥י צ֖וּר מִֽ/בַּלְעֲדֵ֥י אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/032.yaml
  text: For who is God besides Yahweh? And who is a rock besides our God?[a]
translation:
  language: ta
  text: ஏனெனில், யாவேயைத் தவிர வேறு யார் கடவுள்? நம் கடவுளைத் தவிர வேறு யார் கற்பாறை?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம் கடவுளைத் தவிர வேறு யார் ‘கற்பாறை’?” எபிரெயத்தில் ‘கற்பாறை’ என்பது கடவுளைக் குறிக்கும் அடிக்கடி வரும் உருவகம்; சில இடங்களில் அது ஏறக்குறைய ஒரு பட்டப்பெயரைப் போலவும் செயல்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய புகழுரைக்கான காரணத்தையோ அடிப்படையையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: מִי
  choice: யார்
  rationale: பதில் எதிர்பாராத வினாவியல் பிரதிப்பெயரை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: ஒரே உண்மையான கடவுளைப் பற்றிய வினாவாக இருப்பதால், பொதுவான நவீனத் தமிழ்ச் சொல்லான ‘கடவுள்’ பொருத்தமானது.
- source_word: מִבַּלְעֲדֵי
  choice: தவிர வேறு
  rationale: விலக்கையும் தனித்தன்மையையும் தெளிவாக வெளிப்படுத்தி, ‘அவரைத் தவிர எவரும் இல்லை’ என்ற வினாவின் உட்பொருளைக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் பரவலான ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: וּמִי
  choice: யார்
  rationale: தமிழில் இரண்டாவது இணை வினாவை இயல்பாகத் தொடர்கிறது; வாக்கியத் தொடக்கத்திலுள்ள ‘மற்றும்’ தேவையற்றதால் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
- source_word: צוּר
  choice: கற்பாறை
  rationale: நிலைத்தன்மை, வலிமை, பாதுகாப்பு ஆகியவற்றைக் குறிக்கும் எபிரெய உருவகத்தை விளக்கமாக மாற்றாமல் நேரடியாகக் காக்கிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுள்
  rationale: முதல் நபர் பன்மை உடைமைப் பொருளையும் சமூக மற்றும் உடன்படிக்கைச் சார்பையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது உரைக்கு நெருக்கமானது.
- issue: צוּר என்பது பட்டமா அல்லது பொதுவான உருவகமா
  choice: கற்பாறை
  alternative: கற்பாறையானவர்; கற்பாறை (பட்டப்பெயராக)
  rationale: இங்கு சொல் பயனிலை உருவகமாக வருகிறது. ஆகவே அதை முறையான பட்டப்பெயராகத் தீர்மானிக்காமல், மூல உருவகத்தையும் அதன் சாத்தியமான பட்டப்பெயர் நயத்தையும் அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதை இணைநிலையையும் சொல்லாட்சியின் கண்ணியத்தையும் காக்கும் எளிய நடை. ‘தவிர வேறு’ என்பது இரு வினாக்களிலும் மீளப் பயன்படுத்தப்பட்டு எபிரெய இணை அமைப்பைத் தெளிவாக பிரதிபலிக்கிறது.
