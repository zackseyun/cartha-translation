source:
  edition: WLC
  text: מְהֻלָּ֖ל אֶקְרָ֣א יְהוָ֑ה וּ/מֵ/אֹיְבַ֖/י אִוָּשֵֽׁעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/004.yaml
  text: I call on Yahweh[a], who is worthy of praise, and I am saved from my enemies.
translation:
  language: ta
  text: 'புகழுக்குரிய யாவேவை நான் அழைக்கிறேன்;

    என் பகைவர்களிடமிருந்து காப்பாற்றப்படுகிறேன்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְהֻלָּל
  choice: புகழுக்குரிய
  rationale: הלל என்பதன் புஆல் வினையெச்சம் இங்கு யாவேவின் பண்பைச் சுட்டுகிறது. ‘புகழுக்குரிய’ என்பது ‘புகழப்பட்டவர்’ என்ற சாத்தியமான வடிவத்தைவிட, அவர் புகழப்பட வேண்டியவர் என்ற பொருளை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: אֶקְרָא
  choice: நான் கூப்பிடுகிறேன்
  rationale: தெய்வீகப் பெயருடன் வரும் קרא, வெறுமனே பெயரைச் சொல்வதைக் காட்டிலும் உதவிக்காக அழைப்பதை அல்லது வேண்டிக்கொள்வதைச் சுட்டுகிறது. ‘கூப்பிடுகிறேன்’ என்பது இந்த வேண்டுதல் சார்ந்த பொருளை எளிய நவீன தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவேவை
  rationale: எபிரெய மூலத்தில் பட்டப்பெயர் அல்ல, יהוה என்ற தனிப்பெயர் நேரடியாக உள்ளது. ‘யாவே’ அதன் ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பு; வேற்றுமை உருபுடன் ‘யாவேவை’ என வருகிறது.
- source_word: וּמֵאֹיְבַי
  choice: என் பகைவர்களிடமிருந்து
  rationale: מִן என்ற முன்னொட்டு விடுவிக்கப்படும் மூலத்தைச் சுட்டுகிறது; אֹיְבַי என்பது ‘என் பகைவர்கள்.’ மூலத்தில் இல்லாத ‘கையிலிருந்து’ போன்ற விரிவாக்கம் சேர்க்கப்படவில்லை.
- source_word: אִוָּשֵׁעַ
  choice: காப்பாற்றப்படுகிறேன்
  rationale: ישע என்பதன் நிஃபால் முற்றுப்பெறா வடிவம் ‘நான் காப்பாற்றப்படுகிறேன்/காப்பாற்றப்படுவேன்’ என்று பொருள்படலாம். பாடல் சூழலில் வழக்கமாக நிகழும் விளைவைத் தெரிவிக்கும் நிகழ்காலம் இயல்பானது; செயப்பாட்டு வடிவமும் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் יהוה என்ற உடன்படிக்கைப் பெயரையே பயன்படுத்துகிறது. பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயரைப் பாதுகாக்கிறது.
- issue: אִוָּשֵׁעַ என்பதன் காலநிலை
  choice: காப்பாற்றப்படுகிறேன்
  alternative: காப்பாற்றப்படுவேன்
  rationale: எபிரெய முற்றுப்பெறா வினை நிகழ்கால வழக்கத்தையோ எதிர்கால விளைவையோ குறிக்கக்கூடும். இங்குள்ள பாடல் உரை பொதுவான/மீண்டும் நிகழும் அனுபவமாக வாசிக்கப்படுவதால் நிகழ்காலம் தேர்ந்தெடுக்கப்பட்டது; எதிர்கால வாசிப்பும் இலக்கண ரீதியாகச் சாத்தியம்.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. கவிதை இணைநிலை இரண்டு வரிகளாக அமைக்கப்பட்டுள்ளது. ‘கூப்பிடுகிறேன்’ சாதாரண வாசகருக்கு இயல்பானது; ‘காப்பாற்றப்படுகிறேன்’ எபிரெயச் செயப்பாட்டு வடிவத்தையும் ישע என்பதன் இரட்சிப்பு/விடுதலைப் பொருளையும் பாதுகாக்கிறது.
