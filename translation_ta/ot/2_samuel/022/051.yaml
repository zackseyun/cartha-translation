  yaml_path: translation/ot/2_samuel/022/051.yaml
  text: He gives great salvation to his king and shows covenant faithfulness to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: ta
  text: அவர் தமது அரசருக்கு மாபெரும் விடுதலைகளை அளிக்கிறார்[a]; தம்முடைய அபிஷேகம் செய்யப்பட்டவருக்கு[c] உடன்படிக்கைக்குரிய மாறாத அன்பைக் காட்டுகிறார்[b]—தாவீதுக்கும் அவருடைய சந்ததிக்கும் என்றென்றும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது அரசருக்கு மாபெரும் மீட்புகளை அளிக்கிறார்” அல்லது “மாபெரும் வெற்றிகளை அளிக்கிறார்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மாறாத அன்பைக் காட்டுகிறார்.” இதற்கான எபிரெயச் சொல் நிலையான அன்பையும் உடன்படிக்கைக்குரிய பற்றுறுதியையும் அடிக்கடி குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “தம்முடைய அபிஷேகம் செய்யப்பட்டவர்” என்பதை “தமது மேசியா” என்றும் மொழிபெயர்க்கலாம். இங்கு அது முதன்மையாக தாவீதைக் குறிக்கிறது; அதேவேளை தாவீதிய அரச மரபையும் விரிவான மேசியா வாக்குறுதியையும் எதிரொலிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: מגדיל
  choice: மாபெரும் … அளிக்கிறார்
  rationale: גדל என்பதன் ஹிஃபில் வடிவம் நேரடியாக ‘பெரிதாக்குகிறார்’ என்று பொருள்படும். ஆனால் ‘விடுதலைகள்’ என்பதுடன் வரும் இந்த எபிரெய மொழிநடையை இயல்பான நவீனத் தமிழில் ‘மாபெரும் … அளிக்கிறார்’ என்று வழங்குவது செயப்பாட்டு வலிமையையும் பொருளையும் காக்கிறது.
- source_word: יְשׁוּעוֹת
  choice: விடுதலைகள்
  rationale: பன்மையில் உள்ள இச்சொல் கடவுள் அருளும் பல்வேறு மீட்பு நடவடிக்கைகள் அல்லது வெற்றிகளைக் குறிக்கலாம். ‘விடுதலைகள்’ அதன் பன்மையையும் வரலாற்றுச் சூழலிலுள்ள காப்பாற்றுதலையும் காக்கிறது.
- source_word: מַלְכּוֹ
  choice: தமது அரசருக்கு
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டை இயல்பான தமிழில் பிரதிபலிக்கிறது; ஆண்டவருக்கும் தாவீதிய அரசருக்கும் உள்ள உறவையும் காக்கிறது.
- source_word: וְעֹשֶׂה חֶסֶד
  choice: உடன்படிக்கைப் பற்றுறுதியைக் காட்டுகிறார்
  rationale: חסד என்பது இங்கு வெறும் இரக்க உணர்வை மட்டுமல்லாமல், உறவில் நிலைத்திருக்கும் அன்பையும் உடன்படிக்கைக்குரிய விசுவாசத்தையும் குறிக்கிறது. ‘பற்றுறுதி’ அந்த நிலையான விசுவாசத்தை வெளிப்படுத்துகிறது.
- source_word: לִמְשִׁיחוֹ
  choice: தாம் அருள்பொழிவு செய்தவருக்கு
  rationale: מָשִׁיחַ என்பதன் அடிப்படைப் பொருள் ‘அருள்பொழிவு செய்யப்பட்டவர்’. உடனடிச் சூழலில் இது தாவீதிய அரசரைக் குறிக்கிறது; அதேவேளை பின்னாளைய மேசியா சார்ந்த ஒலிப்பையும் முடக்காமல் வைக்கிறது.
- source_word: לְדָוִד
  choice: தாவீதுக்கும்
  rationale: தனிப்பெயர் வழக்கமான தமிழ் வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּלְזַרְעוֹ
  choice: அவன் சந்ததிக்கும்
  rationale: זֶרַע இலக்கணத்தில் ஒருமையாக இருந்தாலும் கூட்டுப் பொருளில் வழித்தோன்றல்களைக் குறிக்கிறது. ‘சந்ததி’ அந்த ஒருமை-கூட்டுத் தன்மையையும் உடன்படிக்கைத் தொடர்பையும் காக்கிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த நிரந்தரத்தைக் குறிக்கும் எபிரெயச் சொற்றொடருக்கு இயல்பான, கண்ணியமான தமிழ் இணை.
theological_decisions:
- issue: தாவீதிய உடன்படிக்கைச் சூழலில் חסד என்பதன் மொழிபெயர்ப்பு
  choice: உடன்படிக்கைப் பற்றுறுதி
  alternative: மாறாத அன்பு / பேரன்பு / விசுவாசமான அன்பு
  rationale: பாடலின் முடிவில் ஆண்டவர் தமது அரசருக்கும் அவனுடைய வழிமரபுக்கும் காட்டும் நிலையான உடன்படிக்கை விசுவாசமே வலியுறுத்தப்படுகிறது. ‘உடன்படிக்கைப் பற்றுறுதி’ இந்த உறவு மற்றும் வாக்குறுதி சார்ந்த வலிமையைத் தெளிவாகக் காக்கிறது.
- issue: מְשִׁיחוֹ என்பதன் மொழிபெயர்ப்பு
  choice: தாம் அருள்பொழிவு செய்தவர்
  alternative: தமது மேசியா
  rationale: உடனடியாகக் குறிக்கப்படுபவர் தாவீதும் தாவீதிய அரசரும் ஆவர். எனவே வரலாற்றுக் குறிப்பை நேரடியாகப் பின்னாளைய பட்டமாக மாற்றாமல், மேசியா சார்ந்த விரிவான எதிரொலியை அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அபிஷேகம்’ என்ற சமயச் சிறப்புச் சொல்லுக்குப் பதிலாக ‘அருள்பொழிவு’ பயன்படுத்தப்பட்டுள்ளது; ‘חסד’ என்பதன் உடன்படிக்கை சார்ந்த ஆழத்தை வெளிப்படுத்த ‘உடன்படிக்கைப் பற்றுறுதி’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
