  yaml_path: translation/ot/2_samuel/022/045.yaml
  text: The sons of foreigners come cringing to me[b][a]; at the hearing of the ear they obey me.
translation:
  language: ta
  text: அந்நியரின் பிள்ளைகள் எனக்குப் போலியாகப் பணிவார்கள்[a]; என்னைப் பற்றிக் கேட்டவுடனே[b] எனக்குக் கீழ்ப்படிவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்குப் பணிந்துகொள்வார்கள்.” எபிரெய வினைச்சொல் விருப்பமற்ற அல்லது உண்மையற்ற பணிவையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “செவியின் கேள்வியில்”; அதாவது, “கேட்ட மாத்திரத்திலேயே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: அந்நிய நாட்டார்
  rationale: எபிரெய மொழியில் சொல்லர்த்தமாக ‘அந்நியரின் மகன்கள்’ என்றிருந்தாலும், அது அந்நிய நாட்டினரைச் சுட்டும் மரபுத்தொடர். இயல்பான நவீன தமிழில் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: יִתְכַּחֲשׁוּ לִי
  choice: எனக்குப் பணிந்துபோவார்கள்
  rationale: כחש என்பதன் Hitpael வடிவம் இச்சூழலில் விருப்பமற்ற அல்லது உண்மையற்ற கீழ்ப்படிதலையும் கட்டாயப் பணிவையும் குறிக்கலாம். ‘பணிந்துபோவார்கள்’ வெற்றிப் பாடலின் சூழலில் அந்தப் பொருளைத் தருகிறது; நடிப்பான கீழ்ப்படிதலின் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לִשְׁמֹעַ אֹזֶן
  choice: என் குரலைக் கேட்டவுடனே
  rationale: சொல்லர்த்தமாக ‘செவியின் கேள்வியில்’ எனும் எபிரெய மரபுத்தொடர், கேட்ட மாத்திரத்திலேயே உடனடியாகப் பதிலளிப்பதைச் சுட்டுகிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்கப்பட்டுள்ளது.
- source_word: יִשָּׁמְעוּ לִי
  choice: எனக்குக் கீழ்ப்படிவார்கள்
  rationale: שׁמע என்பதுடன் ל சேர்ந்தால் வெறுமனே கேட்பதைவிடக் கேட்டுச் செயல்படுதல் அல்லது கீழ்ப்படிதல் என்ற பொருள் பெறுகிறது.
