base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/023.yaml
  text: For all his judgments were before me[a], and I did not turn away from his statutes.
translation:
  language: ta
  text: ஏனெனில், அவருடைய தீர்ப்புகள் அனைத்தும் என் முன் இருந்தன; அவருடைய நியமங்களை விட்டு நான் விலகவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றை விட்டு நான் விலகவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் காரணப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָל מִשְׁפָּטָיו
  choice: அவருடைய தீர்ப்புகள் அனைத்தும்
  rationale: כָל என்பதன் முழுமையான பொருளையும், מִשְׁפָּטָיו என்பதன் நீதி சார்ந்த சட்டத் தீர்ப்புகள் என்ற பொருளையும் பாதுகாக்கிறது.
- source_word: לְנֶגְדִּי
  choice: என் முன் இருந்தன
  rationale: அவை தொடர்ந்து பேச்சாளரின் பார்வையிலும் கவனத்திலும் இருந்தன என்பதைக் காட்டும் மூலமொழி உருவகத்தை விரிவுபடுத்தாமல் தக்கவைக்கிறது.
- source_word: וְחֻקֹּתָיו
  choice: அவருடைய நியமங்கள்
  rationale: நிலையாக விதிக்கப்பட்ட சட்டங்கள் அல்லது கட்டளைகள் என்ற பொருளைத் தருகிறது; ‘தீர்ப்புகள்’ என்பதிலிருந்து வேறுபட்ட சட்டச் சொல்லாகவும் நிற்கிறது.
- source_word: לֹא אָסוּר
  choice: நான் விலகவில்லை
  rationale: סוּר என்பதன் ‘விலகுதல்/வழிமாறுதல்’ என்ற பொருளை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: מִמֶּנָּה
  choice: நியமங்களைவிட்டு
  rationale: பெண்பால் ஒருமை வடிவிலுள்ள எபிரெயச் சுட்டுப்பெயரின் துல்லியமான தொடர்பு தெளிவற்றதால், உடனடியாக முந்திய ‘நியமங்கள்’ என்பதையே தமிழில் வெளிப்படையாகக் குறிப்பிடுகிறது; மாற்று சுட்டுப்பெயர் வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சட்டத்தைக் குறிக்கும் இரு எபிரெயச் சொற்களின் வேறுபாடு
  choice: מִשְׁפָּטִים என்பதை ‘தீர்ப்புகள்’ என்றும் חֻקּוֹת என்பதை ‘நியமங்கள்’ என்றும் வேறுபடுத்தி மொழிபெயர்த்தல்
  alternative: இரண்டையும் பொதுவாக ‘சட்டங்கள்’ அல்லது ‘கட்டளைகள்’ என்று மொழிபெயர்த்தல்
  rationale: மூலவசனம் இணைநிலையில் இரு வேறு சட்டச் சொற்களைப் பயன்படுத்துகிறது. அவற்றின் வேறுபாட்டைக் காப்பது உரையை ஒரே பொதுவான இறையியல் வகைக்குள் சுருக்காமல் பாதுகாக்கிறது.
- issue: מִמֶּנָּה என்ற சுட்டுப்பெயரின் தொடர்பு
  choice: முதன்மை உரையில் ‘நியமங்களைவிட்டு’ என்று தெளிவாக்குதல்
  alternative: ‘அவற்றைவிட்டு’ என்று மொழிபெயர்த்து, தீர்ப்புகளையும் நியமங்களையும் கூட்டாகச் சுட்டுவதாக விடுதல்
  rationale: எபிரெய வடிவம் பெண்பால் ஒருமையாக இருந்தாலும் கவிதைநடையில் கூட்டுப் பொருளைக் கொண்டிருக்கலாம். எந்தத் தொடர்பையும் கோட்பாட்டின் அடிப்படையில் கட்டாயப்படுத்தாமல், இயல்பான முதன்மை வாசிப்பையும் உண்மையான மாற்று வாசிப்பையும் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் சட்டச் சொற்களின் இணைநிலையும் காக்கப்பட்டுள்ளன. ‘என் முன் இருந்தன’ என்ற எளிய உருவகம் மூலத்தின் தொடர்ந்த கவனம் என்ற நிழற்பொருளையும் தக்கவைக்கிறது.
