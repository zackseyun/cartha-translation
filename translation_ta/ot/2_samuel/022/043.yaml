base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/043.yaml
  text: I crushed them like the dust of the earth[a]; like the mud of the streets I pounded them and trampled them down.
translation:
  language: ta
  text: அவர்களைப் பூமியின் புழுதியைப்போல் நொறுக்கினேன்; தெருக்களின் சேற்றைப்போல் அவர்களை இடித்து மிதித்தேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களைத் தட்டிப் பரப்பினேன்.” இறுதி எபிரேய வினைச்சொல் அடித்துத் தட்டுதல் அல்லது விரித்துப் பரப்புதல் என்ற பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: அவர்களை... நொறுக்கினேன்
  rationale: שׁחק என்பதன் Qal வடிவம் இங்கு எதிரிகளைப் புழுதிபோல் பொடியாக்கும் வன்மையான செயலைக் குறிக்கிறது. ‘நொறுக்கினேன்’ என்பது இயல்பான நவீனத் தமிழில் அந்த வலிமையைக் காக்கிறது.
- source_word: כַּעֲפַר אָרֶץ
  choice: பூமியின் புழுதியைப்போல்
  rationale: עָפָר என்பது ‘புழுதி/தூசி’; אֶרֶץ என்பது ‘பூமி/நிலம்’. எபிரேயச் சொற்றொடரின் உறவையும் கவித்துவமான வேதாகம நடையையும் இந்த மொழிபெயர்ப்பு காக்கிறது.
- source_word: כְּטִיט חוּצוֹת
  choice: தெருக்களின் சேற்றைப்போல்
  rationale: טִיט என்பது சேறு; חוּצוֹת என்பது நகரின் தெருக்கள் அல்லது பொது வெளிகள். போர்க்காட்சியில் காலடியில் மிதிபடும் தெருச் சேற்றின் உருவகத்தை இது தெளிவாகத் தருகிறது.
- source_word: אֲדִקֵּם
  choice: அவர்களை இடித்து
  rationale: דקק என்பதன் Hiphil வடிவம் நுணுக்கமாக நசுக்குதல் அல்லது இடித்தல் என்ற பொருளுடையது. முதல் வினையிலுள்ள ‘நொறுக்கினேன்’ என்பதை அப்படியே மீண்டும் கூறாமல், இணைவரியின் தீவிரத்தை ‘இடித்து’ காக்கிறது.
- source_word: אֶרְקָעֵם
  choice: தரையில் மிதித்தேன்
  rationale: רקע என்பது அடித்துத் தட்டுதல், காலால் மிதித்தல், அல்லது விரித்துப் பரப்புதல் ஆகிய பொருட்களை ஏற்கக்கூடும். தெருச் சேற்றின் சூழலில் ‘தரையில் மிதித்தேன்’ இயல்பான போருருவகமாக அமைகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
