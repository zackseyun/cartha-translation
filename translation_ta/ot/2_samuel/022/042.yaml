reference: 2 Samuel 22:42
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יִשְׁע֖וּ וְ/אֵ֣ין מֹשִׁ֑יעַ אֶל יְהוָ֖ה וְ/לֹ֥א עָנָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/042.yaml
  text: They cried for help[a], but there was no one to save; they cried to Yahweh, but he did not answer them.
translation:
  language: ta
  text: அவர்கள் உதவிக்காகக் கூப்பிட்டார்கள்; ஆனால் காப்பாற்ற யாரும் இல்லை. அவர்கள் யாவேயை நோக்கிக் கூப்பிட்டார்கள்; ஆனால் அவர் அவர்களுக்குப் பதிலளிக்கவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׁעוּ
  choice: உதவியை நாடினார்கள்
  rationale: இச்சொல் இங்கு உதவிக்காக நோக்குதல் அல்லது கூப்பிடுதல் என்ற இரு நெருங்கிய பொருள்களுக்கும் இடமளிக்கிறது. ‘உதவியை நாடினார்கள்’ என்பது அந்தத் தெளிவின்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: וְאֵין מֹשִׁיעַ
  choice: ஆனால் காப்பாற்ற யாரும் இல்லை
  rationale: מֹשִׁיעַ என்பது காப்பாற்றுகிற ஒருவரைக் குறிக்கும் வினையெச்ச வடிவம். ‘காப்பாற்ற யாரும் இல்லை’ என்பது பட்டப்பெயர் சார்ந்த கூடுதல் பொருளைச் சேர்க்காமல் கருத்தை நேரடியாகத் தருகிறது.
- source_word: אֶל יְהוָה
  choice: யாவேயை நோக்கிக் கூப்பிட்டார்கள்
  rationale: אֶל என்பது வேண்டுதல் செலுத்தப்பட்ட திசையைச் சுட்டுகிறது. எபிரெய வாக்கியத்தில் விடப்பட்டுள்ள முந்தைய வினை, இணை அமைப்பைத் தெளிவாக்குவதற்காக தமிழில் இயல்பாக மீண்டும் தரப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான יהוה, அதன் உடன்படிக்கை சார்ந்த குறிப்பை நிலைநிறுத்தும் வகையில் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְלֹא עָנָם
  choice: ஆனால் அவர் அவர்களுக்குப் பதிலளிக்கவில்லை
  rationale: ענה என்பதன் இங்குள்ள பொருள் ‘பதிலளித்தல்.’ முந்தைய சொற்றொடரிலுள்ள யாவேதான் எழுவாய் என்பது தமிழில் ‘அவர்’ என்பதால் தெளிவாகிறது.
theological_decisions:
- issue: יהוה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்லாமல் தேவனுடைய தனிப்பெயரே நேரடியாக உள்ளது; ஆகவே அதைத் தமிழில் ஒலிபெயர்த்து, மூலத்தின் உடன்படிக்கை சார்ந்த குறிப்பைப் பாதுகாக்கிறது.
- issue: யாவே பதிலளிக்காததாகக் கூறப்படுதல்
  choice: அவர் அவர்களுக்குப் பதிலளிக்கவில்லை
  alternative: அவர்களுக்கு விடுதலை கிடைக்கவில்லை
  rationale: மூலம் பதில் இல்லாததை நேரடியாகக் கூறுகிறது. அதற்கான காரணத்தையோ அதன் இறையியல் விளக்கத்தையோ மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. முதல் பாதியின் பொருள் தெளிவின்மை ‘உதவியை நாடினார்கள்’ என்பதாலும் அடிக்குறிப்பாலும் காக்கப்பட்டுள்ளது; இரண்டாம் பாதியில் எபிரெயத்தில் விடுபட்ட வினை, இயல்பான தமிழ் இணை அமைப்புக்காக வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
