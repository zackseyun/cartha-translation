revisions:
- from: அவர்கள் உதவியை நாடினார்கள்[a]; ஆனால் காப்பாற்ற யாரும் இல்லை. அவர்கள் யாவேயை நோக்கிக் கூப்பிட்டார்கள்; ஆனால் அவர் அவர்களுக்குப் பதிலளிக்கவில்லை.
  to: அவர்கள் உதவிக்காகக் கூப்பிட்டார்கள்; ஆனால் காப்பாற்ற யாரும் இல்லை. அவர்கள் யாவேயை நோக்கிக் கூப்பிட்டார்கள்; ஆனால் அவர் அவர்களுக்குப் பதிலளிக்கவில்லை.
  rationale: The first clause is revised to state the contextual force of the Hebrew verb—an appeal or cry for help—rather than the less specific idea of seeking help. The second parallel appeal, the divine name, the absence of a deliverer, and Yahweh’s failure to answer are retained unchanged in meaning. No footnote is needed because the revised rendering reflects the sense required by this context.
