source:
  edition: WLC
  text: וַ/יֵּ֥ט שָׁמַ֖יִם וַ/יֵּרַ֑ד וַ/עֲרָפֶ֖ל תַּ֥חַת רַגְלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/010.yaml
  text: He bent the heavens and came down[a]; thick darkness was under his feet.
translation:
  language: ta
  text: அவர் வானங்களை வளைத்து இறங்கி வந்தார்; காரிருள்[a] அவருடைய கால்களின்கீழ் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கருமேகம்’; எபிரெயச் சொல் עֲרָפֶל, ஆண்டவரின் தோற்றத்துடன் தொடர்புடைய அடர்ந்த இருளையோ இருண்ட மேகத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: வளைத்து
  rationale: נטה என்ற வினை, இங்கு ‘வானங்கள்’ என்பதைக் கருமமாகக் கொண்டு, அவற்றைக் கீழ்நோக்கி வளைக்கும் உயிரோட்டமான இறைத்தோற்றக் காட்சியைத் தருகிறது.
- source_word: שָׁמַיִם
  choice: வானங்களை
  rationale: எபிரெயப் பன்மை வடிவத்தையும் கவிதையின் பிரபஞ்ச அளவிலான உயர்ந்த நடையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וַיֵּרַד
  choice: இறங்கி வந்தார்
  rationale: ירד என்பதன் கீழ்நோக்கிய இயக்கத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וַעֲרָפֶל
  choice: காரிருள்
  rationale: עֲרָפֶל குறிக்கும் அடர்ந்த, இறைத்தோற்றத்துடன் தொடர்புடைய இருளைச் சுருக்கமாகவும் கவித்துவமாகவும் வெளிப்படுத்துகிறது; ‘கருமேகம்’ என்பதும் சூழலுக்கு ஏற்ற சாத்தியம்.
- source_word: תַּחַת
  choice: கால்களின்கீழ்
  rationale: இடஞ்சார்ந்த ‘கீழ்’ என்ற பொருளை நேரடியாகக் காக்கிறது.
- source_word: רַגְלָיו
  choice: அவருடைய கால்கள்
  rationale: மூலத்தின் உறுதியான உடல்சார்ந்த உருவகத்தை ‘காலடிகள்’ என மாற்றாமல் அப்படியே காக்கிறது.
theological_decisions:
- issue: கடவுளைக் குறித்த மனித உருவிலான இறைத்தோற்றப் படிமம்
  choice: ‘இறங்கி வந்தார்’, ‘அவருடைய கால்களின்கீழ்’ என்ற உடல்சார்ந்த, இடஞ்சார்ந்த படிமங்களை நேரடியாகத் தக்கவைத்தல்
  alternative: ‘வானத்திலிருந்து தம்மை வெளிப்படுத்தினார்’ என்று உடல்சாரா விளக்கமாக மென்மைப்படுத்துதல்
  rationale: எபிரெயக் கவிதை இறைத்தோற்றத்தை மனித உருவிலான மொழியில் சித்தரிக்கிறது. அந்த இறையியல் பதற்றத்தை விளக்கி அகற்றாமல், மூலத்தின் கவித்துவப் படிமத்தை மொழிபெயர்ப்பு காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை. ‘வானங்கள்’, ‘வளைத்து’, ‘காரிருள்’ ஆகியவை மூலத்தின் பிரபஞ்ச இறைத்தோற்றச் சித்திரத்தையும் சுருக்கமான இணைநடையையும் காக்கின்றன.
