  text: He made darkness a shelter around him[a], a massing of waters, thick clouds of the skies.
translation:
  language: ta
  text: அவர் தம்மைச் சுற்றிலும் இருளை மறைவிடங்களாக அமைத்தார்—நீரின் திரளும் வானத்தின் அடர்ந்த மேகங்களும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் இருளைத் தம்மைச் சுற்றியுள்ள மறைவிடமாக அமைத்தார்; நீரின் திரள், வானத்தின் அடர்ந்த மேகங்கள்.” எபிரெயம் மிகவும் கவித்துவமானது. “நீரின் திரள்” என்று மொழிபெயர்க்கப்பட்டுள்ள அரிய சொற்றொடரை “நீரின் சேர்க்கை” என்றும், விளக்கமாக “கருமையான மழை மேகங்கள்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁת
  choice: அமைத்தார்
  rationale: שׁית என்பதன் ‘வைத்தல்/அமைத்தல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; இருளைக் கூடாரங்களாக அமைக்கும் கவித்துவ உருவகத்தையும் காக்கிறது.
- source_word: חֹשֶׁךְ
  choice: இருள்
  rationale: பெயர்ச்சொல்லின் வழக்கமான நேரடிப் பொருள்; இறைத்தோற்றத்தைச் சூழும் மறைவை இங்கு குறிக்கிறது.
- source_word: סְבִיבֹתָיו
  choice: தம்மைச் சுற்றிலும்
  rationale: சுற்றிவளைத்துள்ள இடவியல் கருத்தைத் தெளிவாகக் காட்டுகிறது; இறைவனைச் சுட்டுவதால் மரியாதைப் பிரதிப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: סֻכּוֹת
  choice: கூடாரங்களாக
  rationale: எபிரெயப் பன்மையைப் பாதுகாக்கிறது. סֻכָּה என்பது குடில், கூடாரம் அல்லது மறைவிடம் எனப் பொருள்படலாம்; இங்கு கவித்துவமான மூடுதலை ‘கூடாரங்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חַשְׁרַת מַיִם
  choice: திரண்ட நீர்
  rationale: அரிதான இச்சொற்றொடரின் ‘நீரின் திரட்சி/தொகுப்பு’ என்ற சாத்தியமான பொருளை மிகையாக விளக்காமல் தருகிறது; புயல் மேகங்களை மட்டும் எனக் குறுக்கவில்லை.
- source_word: עָבֵי שְׁחָקִים
  choice: வானத்தின் அடர்ந்த மேகங்கள்
  rationale: עָבֵי என்பதிலுள்ள கனமான அல்லது அடர்த்தியான மேகங்களின் கருத்தையும், שְׁחָקִים என்பதிலுள்ள வானவெளியையும் இயல்பான நவீன தமிழில் காக்கிறது.
