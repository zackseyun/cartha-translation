  text: The cords of Sheol surrounded me[b][a]; the snares of death confronted me.
translation:
  language: ta
  text: ஷியோலின்[a] கயிறுகள் என்னைச் சூழ்ந்தன; மரணத்தின் கண்ணிகள் என்னை எதிர்கொண்டன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கல்லறை” அல்லது “இறந்தோரின் உலகம்.”
    reason: alternative_reading
  - marker: b
    text: அல்லது, “என்னைச் சந்தித்தன” அல்லது “என்முன் வந்தன.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי
  choice: கயிறுகள்
  rationale: சிக்கவைக்கும் கயிறுகள் என்ற கவிதை உருவகத்தை நேரடியாகப் பாதுகாக்கிறது; இணைவரியில் வரும் ‘கண்ணிகள்’ என்பதோடும் இயல்பாகப் பொருந்துகிறது.
- source_word: שְׁאוֹל
  choice: ஷியோல்
  rationale: இறந்தோரின் உலகத்தைக் குறிக்கும் எபிரெயப் பெயரை ஒலிபெயர்த்து, ‘கல்லறை’ அல்லது ‘இறந்தோரின் உலகம்’ என்று பொருளை ஒரே விதமாகத் தீர்மானிக்காமல் அதன் கவிதை மற்றும் இறையியல் பரப்பைப் பாதுகாக்கிறது.
- source_word: סַבֻּנִי
  choice: என்னைச் சூழ்ந்தன
  rationale: סבב என்பதன் ‘சுற்றியிருத்தல்/சூழ்தல்’ என்ற அடிப்படைப் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: קִדְּמֻנִי
  choice: என்னை எதிர்கொண்டன
  rationale: கண்ணிகள் பேசுபவருக்கு முன்வந்து அவரை எதிர்கொள்ளும் பகைமையான சந்திப்பைத் தெளிவாக வெளிப்படுத்துகிறது; ‘சந்தித்தன’ அல்லது ‘என்முன் வந்தன’ என்பதும் சாத்தியம்.
- source_word: מֹקְשֵׁי
  choice: கண்ணிகள்
  rationale: பிடிப்பதற்காக வைக்கப்படும் பொறி அல்லது சுருக்குக் கண்ணி என்ற பொருளைச் சுருக்கமாகவும் கவிதைநயத்துடனும் தருகிறது.
- source_word: מָוֶת
  choice: மரணம்
  rationale: எபிரெயச் சொல்லின் நேரடியான பொருள்; இச்சூழலில் விளக்கவுரை தேவையில்லை.
theological_decisions:
- issue: שְׁאוֹל என்பதன் மொழிபெயர்ப்பு
  choice: ஷியோல்
  alternative: கல்லறை; இறந்தோரின் உலகம்
  rationale: மரணம், கல்லறை, இறந்தோரின் உலகம் ஆகிய பொருள் நிழல்களில் ஒன்றை மட்டும் தேர்ந்தெடுத்து இறையியல் பதற்றத்தை நீக்காமல், மூலமொழியின் சொல்லைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் இணை அமைப்பும் கயிறுகள்–கண்ணிகள் உருவகமும் பாதுகாக்கப்பட்டுள்ளன; ‘ஷியோல்’ வாசகருக்குப் புதிதாக இருக்கக்கூடும் என்பதால் அடிக்குறிப்பில் பொருள் மாற்றுகள் தரப்பட்டுள்ளன.
