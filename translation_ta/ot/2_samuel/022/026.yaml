  yaml_path: translation/ot/2_samuel/022/026.yaml
  text: With the faithful you show yourself faithful; with the blameless warrior you show yourself blameless.
translation:
  language: ta
  text: உண்மையுள்ளவரிடம் நீர் உண்மையுள்ளவராக நடந்துகொள்கிறீர்; குற்றமற்ற வீரனிடம் நீர் குற்றமற்றவராக நடந்துகொள்கிறீர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָסִיד / תִּתְחַסָּד
  choice: உண்மையுள்ளவர் / உண்மையுள்ளவராக நடந்துகொள்கிறீர்
  rationale: חסד என்ற சொல்லின் பற்றுறுதி, நம்பகத்தன்மை ஆகிய கருத்துகளையும், எபிரெய உரையிலுள்ள சொல் மீளுருவாக்கத்தையும் இயன்றவரை இயல்பான தமிழில் காக்கிறது.
- source_word: גִּבּוֹר
  choice: வீரன்
  rationale: இச்சொல் வலிமைமிக்க மனிதனையோ போர்வீரனையோ குறிக்கலாம்; பாடல் சூழலிலும் இணைக்கப்பட்ட ஆங்கில ஆலோசனை உரையிலும் உள்ள ‘warrior’ பொருளுக்கு இயல்பான தமிழ்ச் சொல்.
- source_word: תָּמִים / תִּתַּמָּם
  choice: குற்றமற்ற / குற்றமற்றவராக நடந்துகொள்கிறீர்
  rationale: முழுமை, நேர்மை, பழுதின்மை ஆகிய பொருள் வரம்பை இங்கு ‘குற்றமற்ற’ என்பதன் மூலம் தெரிவித்து, மூலத்தின் இணைச்சொல் அமைப்பையும் காக்கிறது.
theological_decisions:
- issue: மனிதரின் குணத்திற்கும் தேவனின் பதிலுக்கும் இடையிலான இணை அமைப்பு
  choice: ‘...வரிடம் நீர் ...வராக நடந்துகொள்கிறீர்’ என்று இரு அரையடிகளிலும் இணையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘...வருக்கு நீர் ...வராக உம்மைக் காட்டுகிறீர்’
  rationale: எபிரெய வினைகளின் தன்னிலை/பரஸ்பரத் தொனியைத் தீர்மானமாக விளக்காமல், தேவன் தம்மை எவ்வாறு வெளிப்படுத்துகிறார் அல்லது நடத்திக்கொள்கிறார் என்ற இரு நுணுக்கங்களுக்கும் இடமளிக்கும் இயல்பான தமிழ்.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையுடனும் கவிதைநயமுள்ள இணை அமைப்புடனும், பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை.
