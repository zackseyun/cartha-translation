translation:
  language: ta
  text: வலிமையான என் பகைவனிடமிருந்தும், என்னை வெறுத்தவர்களிடமிருந்தும் அவர் என்னை மீட்டார்; ஏனெனில் அவர்கள் என்னைவிட வலிமையானவர்களாக இருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַצִּילֵנִי
  choice: அவர் என்னை மீட்டார்
  rationale: נצל என்பதன் ஹிஃபில் வடிவம் ஆபத்திலிருந்து விடுவித்தல் அல்லது மீட்டல் என்ற பொருளைக் கொண்டது; இங்கு இயல்பான தமிழில் ‘மீட்டார்’ என வழங்கப்பட்டது.
- source_word: אֹיְבִי עָז
  choice: வலிமையான என் பகைவன்
  rationale: עָז இங்கு பகைவனின் வலிமையைக் குறிக்கிறது. ஒருமை வடிவமான אֹיְבִי பாதுகாக்கப்பட்டு, ‘என் பகைவன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מִשֹּׂנְאַי
  choice: என்னை வெறுத்தவர்கள்
  rationale: இந்தப் பன்மை வினையெச்சப் பெயர்ச்சொல் வெறுப்புடன் எதிர்த்தவர்களைக் குறிக்கிறது; எளிய நவீனத் தமிழில் நேரடியாக வழங்கப்பட்டது.
- source_word: כִּי אָמְצוּ מִמֶּנִּי
  choice: ஏனெனில் அவர்கள் என்னைவிட வலிமையானவர்களாக இருந்தார்கள்
  rationale: מִמֶּנִּי ஒப்பீட்டைக் குறிக்கிறது; பகைவர்கள் பேசுபவரைவிட வலிமைமிக்கவர்கள் என்ற காரண உறவு தெளிவாகப் பாதுகாக்கப்பட்டது.
