source:
  edition: WLC
  text: וָ/אֶהְיֶ֥ה תָמִ֖ים ל֑/וֹ וָ/אֶשְׁתַּמְּרָ֖/ה מֵ/עֲוֺנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/024.yaml
  text: I was blameless before him[b][a], and I kept myself from my iniquity.
translation:
  language: ta
  text: நான் அவர் முன் குற்றமற்றவனாய் இருந்தேன்[a]; என் அக்கிரமத்திலிருந்து என்னைக் காத்துக்கொண்டேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நான் அவரோடு முழுமையுள்ளவனாய் இருந்தேன்.’ எபிரெயச் சொல் குற்றச்சாட்டு இல்லாமையை மட்டுமல்லாமல் நேர்மை அல்லது முழுமையையும் வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் பாவத்திலிருந்து/குற்றப்பழியிலிருந்து என்னைக் காத்துக்கொண்டேன்.’ எபிரெயச் சொல் சூழலுக்கேற்ப அக்கிரமம், பாவம் அல்லது குற்றப்பழி எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה
  choice: நான் ... இருந்தேன்
  rationale: היה என்பதன் Qal wayyiqtol வடிவம் இக்கவிதைச் சூழலில் கடந்தகால நிலையைக் குறிக்கிறது. வாவ் இணைப்பைத் தமிழில் தனியே ‘மேலும்’ என்று இயந்திரமாக மொழிபெயர்க்காமல், இரு உட்பிரிவுகளின் இயல்பான தொடர்ச்சியில் வெளிப்படுத்தப்பட்டது.
- source_word: תָמִים
  choice: குற்றமற்றவனாய்
  rationale: இந்தச் சொல் முழுமை, நேர்மை, பழியின்மை ஆகியவற்றைக் குறிக்கக்கூடும். இங்கு ‘குற்றமற்றவனாய்’ என்பது தேவனுக்கு முன்பான தாவீதின் நேர்மைக் கூற்றை இயல்பாகத் தருகிறது; கட்டாயமாக முழுமையான பாவமின்மையைச் சொல்லவில்லை. ‘முழு மனதுடையவனாய்’ என்ற பொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לוֹ
  choice: அவர்முன்
  rationale: சொல்லளவில் ‘அவருக்கு/அவரோடு’ என இருக்கக்கூடிய இவ்வடிவம் இங்கு உறவு மற்றும் மதிப்பீட்டுச் சூழலில் ‘அவருடைய பார்வையில்’ என்ற பொருளைத் தருகிறது. ‘அவர்முன்’ என்பது சுருக்கமான, இயல்பான தமிழ்.
- source_word: וָאֶשְׁתַּמְּרָה
  choice: என்னைக் காத்துக்கொண்டேன்
  rationale: שׁמר என்பதன் reflexive வடிவம் தன்னைத்தானே எச்சரிக்கையுடன் காத்துக்கொள்வதை வெளிப்படுத்துகிறது. ‘என்னைக் காத்துக்கொண்டேன்’ அந்தத் தன்வினைப் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: מֵעֲוֺנִי
  choice: என் அக்கிரமத்திலிருந்து
  rationale: עָוֹן என்பது அக்கிரமம், பாவம், குற்றப்பழி ஆகிய பொருட்களைச் சூழலின்படி தரலாம். ‘என் அக்கிரமம்’ அதன் வலுவான ஒழுக்கப் பொருளையும் முதலாம் நபர் உரிமையையும் பாதுகாக்கிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: தாவீதின் கூற்று முழுமையான பாவமின்மையைக் குறிக்கிறதா?
  choice: தேவனுக்கு முன்பான நேர்மை அல்லது குற்றமின்மை பற்றிய வலுவான கூற்றாக மொழிபெயர்த்தல்
  alternative: முழுமையான ஒழுக்கப் பரிபூரணத்தைப் பற்றிய கூற்றாக வெளிப்படையாக விளக்குதல்
  rationale: תָמִים என்ற எபிரெயச் சொல் முழுமை அல்லது நேர்மையை வலியுறுத்தலாம்; அது கட்டாயமாக முற்றிலும் பாவமற்ற நிலையைக் குறிக்காது. எனவே வசனத்தின் வலுவான தற்கூற்றை மெலிதாக்காமலும், அது தீர்மானிக்காத கோட்பாட்டு முடிவை மொழிபெயர்ப்பில் சேர்க்காமலும் ‘குற்றமற்றவனாய்’ என வழங்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைத் தன்மையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘அவர்முன்’ மற்றும் ‘என்னைக் காத்துக்கொண்டேன்’ ஆகியவை எபிரெய உறவு மற்றும் reflexive நுணுக்கங்களை இயல்பான தமிழில் தருகின்றன. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
