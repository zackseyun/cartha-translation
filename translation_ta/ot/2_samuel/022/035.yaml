source:
  edition: WLC
  text: מְלַמֵּ֥ד יָדַ֖/י לַ/מִּלְחָמָ֑ה וְ/נִחַ֥ת קֶֽשֶׁת נְחוּשָׁ֖ה זְרֹעֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/035.yaml
  text: He trains my hands for battle[b][a], and my arms can bend a bow of bronze.
translation:
  language: ta
  text: 'போரிடுவதற்கு[a] என் கைகளுக்குப் பயிற்சி அளிக்கிறார்;

    என் புயங்கள் வெண்கல வில்லை வளைக்கின்றன.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போருக்காக.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் புயங்களால் வெண்கல வில் வளைக்கப்படுகிறது.” வில் இறைவன் கொடுக்கும் வலிமையால் வளைக்கப்படுவதை எபிரெய வாசகம் வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלַמֵּד
  choice: பயிற்சி அளிக்கிறார்
  rationale: למד என்பதன் பங்கேற்புவினை வடிவம் கற்பித்தல் அல்லது பயிற்றுவித்தலைக் குறிக்கிறது. போர்ச் சூழலில் நடைமுறைத் தயாரிப்பை இயல்பாக வெளிப்படுத்துவதால் ‘பயிற்சி அளிக்கிறார்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יָדַי
  choice: என் கைகள்
  rationale: முதல் நபர் ஒருமை உடைமை விகுதியுடன் உள்ள பன்மைச் சொல்லின் உடல் சார்ந்த உருவகத்தை அப்படியே காக்கிறது.
- source_word: לַמִּלְחָמָה
  choice: போரிடுவதற்கு
  rationale: מִלְחָמָה என்பது போர் அல்லது குறிப்பிட்ட போர்மோதலைக் குறிக்கலாம். இங்கு கைகளுக்குப் பயிற்சி அளிக்கும் செயலைத் தொடர்ந்து ‘போரிடுவதற்கு’ என்பது இயல்பாகவும் செயற்பாட்டு நோக்கைத் தெளிவாகவும் காட்டுகிறது.
- source_word: וְנִחַת
  choice: வளைக்கின்றன
  rationale: இவ்வடிவம் வில் புயங்களின் வலிமையால் வளைக்கப்படுவதை விவரிக்கிறது. தமிழில் புயங்களை எழுவாயாகக் கொண்டு செயப்படுவினையில் மொழிபெயர்ப்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது; எபிரெய வாசகத்தின் செயப்பாட்டு நிழல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: קֶשֶׁת
  choice: வில்
  rationale: ஆயுதத்தைக் குறிக்கும் இச்சொல்லின் வழக்கமான, நேரடியான தமிழாக்கம்.
- source_word: נְחוּשָׁה
  choice: வெண்கல
  rationale: இந்தச் சொல் வெண்கலம் அல்லது செம்பைக் குறிக்கக்கூடும். வலிமையான உலோக வில் என்ற சூழலுக்கு ‘வெண்கல’ என்பது வழக்கமான பொருத்தமான தேர்வு.
- source_word: זְרֹעֹתַי
  choice: என் புயங்கள்
  rationale: முதல் நபர் ஒருமை உடைமை விகுதியுடன் உள்ள பன்மையைப் பாதுகாத்து, ‘கைகள்’ என்பதுடனான உடல் உறுப்புச் சமநிலையையும் வலிமையின் படிமத்தையும் காக்கிறது.
theological_decisions:
- issue: போர்த் திறனில் இறைவனின் செயல்பாடு
  choice: தாவீதின் போர்ப் பயிற்சியும் உடல் வலிமையும் இறைவனால் கிடைத்தவை என வசனம் கூறுவதை மட்டும் மொழிபெயர்ப்பு வெளிப்படுத்துகிறது.
  alternative: எல்லா விசுவாசிகளின் ஆவிக்குரிய போராட்டத்திற்கும் இறைவன் வலிமை அளிப்பதாகப் பொதுமைப்படுத்துதல்.
  rationale: உடனடிச் சூழல் இறைவன் தாவீதை விடுவித்து நேரடியான போரில் வலுப்படுத்தியதற்கான அரசரின் நன்றிப் பாடல். ஆகவே வரலாற்றுப் போர்ச் சூழல் காக்கப்படுகிறது; ஆவிக்குரிய உருவகமாக மாற்றப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கைகள்—புயங்கள்’ என்ற எபிரெய இணைநிலைப் படிமம் காக்கப்பட்டுள்ளது; ‘புயங்கள்’ என்பது உயர்ந்த ஆனால் பொதுவாகப் புரிந்துகொள்ளக்கூடிய சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது.
