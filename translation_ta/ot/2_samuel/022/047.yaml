  source_fidelity: 'மூல எபிரேயத்தின் மூன்று துதிமுழக்கங்களும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன: חַי יְהוָה என்பதற்கு “யாவே உயிரோடிருக்கிறார்,” וּבָרוּךְ צוּרִי என்பதற்கு “என் கன்மலை போற்றப்படுவதாக,” மற்றும் וְיָרֻם אֱלֹהֵי צוּר יִשְׁעִי என்பதற்கு விருப்ப/புகழ் நுணுக்கத்துடன் “என் மீட்பின் கன்மலையான கடவுள் உயர்த்தப்படுவாராக” என்று தரப்பட்டுள்ளது. צוּר உருவகம் இரு இடங்களிலும் காக்கப்பட்டுள்ளது. இறுதித் தொடரின் கட்டமைப்பு மாற்றுவாசிப்பு அடிக்குறிப்பில் உரிய முறையில் பாதுகாக்கப்படுகிறது.'
