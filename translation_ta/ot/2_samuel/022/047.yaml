source:
  edition: WLC
  text: חַי יְהוָ֖ה וּ/בָר֣וּךְ צוּרִ֑/י וְ/יָרֻ֕ם אֱלֹהֵ֖י צ֥וּר יִשְׁעִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/047.yaml
  text: Yahweh lives[a], and blessed be my rock, and exalted be God, the rock of my salvation.
translation:
  language: ta
  text: 'யாவே உயிரோடிருக்கிறார்!

    என் கன்மலை போற்றப்படுவதாக!

    என் மீட்பின் கன்மலையான கடவுள் உயர்த்தப்படுவாராக![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத் தொடரை “என் மீட்பின் கன்மலைக்குரிய கடவுள்” என்றும் புரிந்துகொள்ளலாம்; “என் மீட்பின் கன்மலை” என்பதற்கு “என்னை மீட்கும் கன்மலை” அல்லது “என் விடுதலையின் கன்மலை” என்றும் மொழிபெயர்க்கலாம்.
    reason: எபிரேயக் கட்டமைப்பின் தொடரியல் தெளிவின்மையையும் יֶשַׁע என்பதற்கான பொருள் மாற்றுகளையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: חַי יְהוָה
  choice: யாவே உயிரோடிருக்கிறார்
  rationale: வினைச்சொல் இல்லாத எபிரேயப் புகழறிக்கையின் பொருளை இயல்பான நவீனத் தமிழில் நேரடியான அறிவிப்பாகத் தருகிறது; இதைச் சத்தியப்பிரமாணத் தொடக்கமாக மாற்றாமல், இச்சூழலின் துதித் தன்மையைப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் திருப்பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், உடன்படிக்கைப் பெயராக ஒலிபெயர்க்கிறது.
- source_word: וּבָרוּךְ
  choice: போற்றப்படுவதாக
  rationale: துதிச் சூழலில் வரும் வாழ்த்துரைத் தன்மையுள்ள செயல்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் ‘ஆசீர்வதிக்கப்பட்டவர்’ என்பதைக் காட்டிலும் கடவுளை நோக்கிய புகழுரைக்கு ஏற்றது.
- source_word: צוּרִי
  choice: என் கன்மலை
  rationale: צוּר என்பதன் பாறை உருவகத்தை ‘அடைக்கலம்’ போன்ற விளக்கச் சொல்லால் மாற்றாமல் பாதுகாக்கிறது.
- source_word: וְיָרֻם
  choice: உயர்த்தப்படுவாராக
  rationale: எபிரேய யுஸ்ஸிவ் வடிவிலுள்ள விருப்பம் அல்லது புகழ் முழக்கத்தின் நுணுக்கத்தைத் தமிழில் பேணுகிறது.
- source_word: אֱלֹהֵי
  choice: கடவுள்
  rationale: தொடர்ந்து வரும் ‘மீட்பின் கன்மலை’ என்பதுடன் கவிதைநடை விளக்கப்பெயர் உறவாக வாசிக்கப்படுகிறது; எபிரேயக் கட்டமைப்பின் வேறு சாத்திய வாசிப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: צוּר יִשְׁעִי
  choice: என் மீட்பின் கன்மலை
  rationale: ‘கன்மலை’ உருவகத்தையும் יֶשַׁע என்பதன் மீட்பு/விடுதலைப் பொருளையும் காக்கும் நெருக்கமான மொழிபெயர்ப்பு.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப் பட்டமாக மாற்றாமல் வெளிப்படுத்துகிறது; தமிழில் ஏற்ற ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்படுகிறது.
- issue: கடவுளுக்கான צוּר உருவகம்
  choice: கன்மலை
  alternative: பாறை; அடைக்கலம்
  rationale: நிலைத்தன்மை, பாதுகாப்பு ஆகியவற்றைக் குறிக்கும் மூல உருவகத்தை விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- issue: אֱלֹהֵי צוּר יִשְׁעִי என்ற தொடரின் தொடரியல்
  choice: என் மீட்பின் கன்மலையான கடவுள்
  alternative: என் மீட்பின் கன்மலைக்குரிய கடவுள்; என்னை மீட்கும் கன்மலையான கடவுள்
  rationale: கவிதை இணைநிலையில் ‘கன்மலை’ என்பதை ‘கடவுள்’ என்பதற்கான விளக்கப்பெயராகப் புரிந்துகொள்வது இயல்பானது. ஆயினும், எபிரேயக் கட்டமைப்பு இலக்கண ரீதியாக வேறு தொடர்பையும் அனுமதிப்பதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, தரமான, மரியாதைமிக்க தமிழில் மூன்று இணையான துதி முழக்கங்களாக அமைக்கப்பட்டுள்ளது. ‘கன்மலை’ என்ற வேதாகம உருவகம் இரு இடங்களிலும் ஒரேபோல் வைக்கப்பட்டுள்ளது; ஆழமான பொருளை இழக்காமல் சாதாரண வாசகர்களும் புரிந்துகொள்ளும் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
