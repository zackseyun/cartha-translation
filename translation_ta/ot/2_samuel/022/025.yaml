base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/025.yaml
  text: And Yahweh repaid me according to my righteousness[b][a], according to my cleanness before his eyes.
translation:
  language: ta
  text: யாவே என் நீதிக்கேற்பவும், அவரது கண்களுக்கு முன்பாக உள்ள என் தூய்மைக்கேற்பவும் எனக்குக் கைம்மாறு செய்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் சுத்தத்திற்கேற்ப.’ எபிரெயச் சொல் சுத்தம் அல்லது தூய்மையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: பதிலளித்தார்
  rationale: שׁוב என்பதன் இச்சூழலிலுள்ள வடிவம் ஒருவரின் நடத்தைக்கு ஏற்றவாறு திருப்பிச் செய்வதை, அதாவது கைம்மாறு அளிப்பதைச் சுட்டுகிறது. ‘பதிலளித்தார்’ என்பது தண்டனை அல்லது வெகுமதி என்று முன்கூட்டியே குறுக்காமல், இங்கு வரும் இறைமறுமொழியின் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לִי
  choice: எனக்கு
  rationale: לְ முன்னிடைச்சொல் வினையின் மறைமுகச் செயப்படுபொருளைக் குறிக்கிறது; தமிழில் ‘எனக்கு’ அதன் வடிவத்தையும் பொருளையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: כְּצִדְקָתִי
  choice: என் நீதிக்கேற்ப
  rationale: צדקה என்பது நீதி, நேர்மை, சரியான நடத்தை ஆகிய பொருட்களை உள்ளடக்குகிறது. ‘நீதி’ அந்தப் பரப்பைச் சுருக்காமல் தக்கவைக்கிறது; ‘-க்கேற்ப’ כְּ என்பதன் ஒப்புமை/அளவுகோல் பொருளை வெளிப்படுத்துகிறது.
- source_word: כְּבֹרִי
  choice: என் தூய்மைக்கேற்ப
  rationale: בֹּר என்பது தூய்மை அல்லது சுத்தத்தைக் குறிக்கிறது. இவ்வசனத்தில் ‘கைகள்’ இல்லை என்பதால் அதைச் சேர்க்கவில்லை; நெறிசார் சூழலில் ‘தூய்மை’ இயல்பாக உள்ளது.
- source_word: לְנֶגֶד עֵינָיו
  choice: அவர் கண்களுக்கு முன்பிருந்த
  rationale: எபிரெயச் சொற்றொடரின் ‘அவருடைய கண்களுக்கு முன்’ என்ற தெளிவான உருவகத்தைத் தக்கவைத்து, தமிழில் தூய்மையை இயல்பாகத் தொடர்புபடுத்துகிறது.
theological_decisions:
- issue: தாவீது தன் நீதியையும் தூய்மையையும் நேரடியாக உரிமைகோருதல்
  choice: முதல் நபர் உரிமைகோரலை எந்தத் தளர்த்தலும் கோட்பாட்டுச் சேர்க்கையும் இன்றி வைத்தல்
  alternative: இதை ஒப்பீட்டளவிலான உடன்படிக்கை உண்மைத்தன்மை என்று விளக்குதல் அல்லது தாவீதின் பாவங்களுடனான பதற்றத்தை நீக்குமாறு பொழிப்புரை செய்தல்
  rationale: எபிரெய உரை தாவீதின் நீதி மற்றும் தூய்மைக்கு ஏற்ப யெகோவா கைம்மாறு செய்தார் என்று நேரடியாகச் சொல்கிறது. அது முழுமையான பாவமின்மையா அல்லது குறிப்பிட்ட சூழலில் நிரூபிக்கப்பட்ட நேர்மையா என்பதை மொழிபெயர்ப்பில் தீர்மானிக்காமல், உரையின் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயப் பாடலின் இணை அமைப்பைத் தக்கவைக்க ‘என் நீதிக்கேற்ப’ மற்றும் ‘என் தூய்மைக்கேற்ப’ என்ற தொடர்கள் இணையாக அமைக்கப்பட்டுள்ளன; ‘கண்களுக்கு முன்’ என்ற மூல உருவகமும் பாதுகாக்கப்பட்டுள்ளது.
