  edition: WLC
  text: וַ/יִּרְכַּ֥ב עַל כְּר֖וּב וַ/יָּעֹ֑ף וַ/יֵּרָ֖א עַל כַּנְפֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/011.yaml
  text: He rode on a cherub and flew[a]; he appeared on the wings of the wind.
translation:
  language: ta
  text: அவர் ஒரு கேருபின் மேல் ஏறிப் பறந்தார்; காற்றின் சிறகுகளின் மேல் அவர் காணப்பட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் தோன்றினார்.” எபிரெய வினைச்சொல்லை “காணப்பட்டார்” என்றும் “தோன்றினார்” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: ஏறி
  rationale: רכב என்பதன் கால் வடிவம் ‘ஏறு/சவாரிசெய்’ என்று பொருள்படும். கேருபின்மேல் இருப்பதையும் அடுத்த செயலைத் தொடரும் எபிரெய நடையையும் இயல்பான தமிழில் ‘ஏறிப் பறந்தார்’ என வழங்குகிறது.
- source_word: עַל
  choice: மேல்
  rationale: இங்கு இடம் அல்லது தாங்குதலைக் குறிக்கும் முன்னிடைச்சொல்; ‘மேல்’ என்பது நேரடியும் இயல்புமான தமிழ் இணை.
- source_word: כְּרוּב
  choice: கேருபு
  rationale: எபிரெய வேதாகமத்தில் அறியப்படும் விண்ணுலக அரியணை உயிரினத்தைக் குறிக்கும் ஒருமைப் பெயரை விளக்கவுரையாக்காமல் ஒலிபெயர்க்கிறது.
- source_word: וַיָּעֹף
  choice: பறந்தார்
  rationale: עוף என்பதன் எளிய பொருள் ‘பறத்தல்’; ‘விரைந்து பறந்தார்’ அல்லது ‘உயரப் பறந்தார்’ போன்ற சேர்க்கைகளைத் தவிர்க்கிறது.
- source_word: וַיֵּרָא
  choice: காணப்பட்டார்
  rationale: ראה என்பதன் நிஃபால் வடிவத்தை அதன் நேரடியான செயல்பாட்டு மதிப்பான ‘காணப்பட்டார்’ என்று வழங்குகிறது; சூழலில் ‘தோன்றினார்’ என்பதும் சாத்தியம்.
- source_word: כַּנְפֵי
  choice: சிறகுகள்மேல்
  rationale: כָּנָף என்பதன் பன்மை இணைப்புநிலை ‘சிறகுகள்’; עַל உடன் சேர்ந்து ‘சிறகுகள்மேல்’ என வருகிறது.
- source_word: רוּחַ
  choice: காற்றின்
  rationale: இந்தக் கவிதைமிகு இறைத்தோற்றச் சூழலில் רוּחַ இயல்பாக ‘காற்று’ என்பதைக் குறிக்கிறது; ‘ஆவி’ அல்லது ‘புயற்காற்று’ எனப் பொருளை வலுப்படுத்தவில்லை.
theological_decisions:
- issue: இறைவீரரையும் இறைத்தோற்றத்தையும் சித்தரிக்கும் உருவக மொழி
  choice: கேருபின்மேல் ஏறுதல், பறத்தல், காற்றின் சிறகுகள்மேல் காணப்படுதல் ஆகிய திடமான கவித்துவப் படிமங்களை அப்படியே வைத்தல்
  alternative: இவற்றை இறைவனின் விரைவான வருகை அல்லது மகிமையின் வெளிப்பாடு என்று விளக்கவுரையாக்குதல்
  rationale: எபிரெய உரையின் இறைத்தோற்றப் படிமத்தை கோட்பாட்டு விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- issue: וַיֵּרָא என்பதிலுள்ள காணப்படுதல்/தோன்றுதல் நுண்வேறுபாடு
  choice: முதன்மை உரையில் ‘காணப்பட்டார்’
  alternative: ‘தோன்றினார்’
  rationale: நிஃபால் வடிவத்தின் வெளிப்படையான செயல்பாட்டை முதன்மை உரை நெருக்கமாகக் காட்டுகிறது; இயல்பான தோற்றப் பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கேருபு’ என்ற நிலைபெற்ற வேதாகமச் சொல்லைத் தக்கவைத்து, பிற சொற்கள் பொதுவாசகருக்கு எளிதில் புரியுமாறு அமைக்கப்பட்டுள்ளன.
