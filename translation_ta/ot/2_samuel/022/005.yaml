  source_fidelity: மூல எபிரெயத்தின் காரண/விளக்கத் தொடர்பான כִּי, மரணத்தின் அச்சுறுத்தும் அலைகள் என்னைச் சூழ்ந்தன என்ற உருவகம், நַחֲלֵי என்ற பெருக்கெடுக்கும் நீரோட்டப் படிமம், மற்றும் யְבַעֲתֻנִיயின் கடும் அச்சுறுத்தல் ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. “கயமை” என்பது בְלִיַּעַל என்பதன் பொதுப்பெயர் வாசிப்பைச் சுருக்கமாகவும் பொருத்தமாகவும் தருகிறது; தனிப்பெயர் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
  naturalness: நடை நவீனத் தரத் தமிழில் இயல்பாகவும் கவிதைத் தன்மையுடனும் உள்ளது. “மரணத்தின் பேரலைகள் / கயமையின் வெள்ளப்பெருக்குகள்” என்ற இணை உருவகங்கள் தெளிவாக அமைந்துள்ளன. “என்னைப் பேரச்சமடையச் செய்தன” கடுமையான திடீர் அச்சத்தின் பொருளுக்கு ஏற்ற கண்ணியமான பயன்பாடாகும்.
  terminology: “பேரலைகள்” מִשְׁבְּרֵיயின் வலிமையான நீர்ப்படிமத்தை இயல்பாக வழங்குகிறது; அதன் மாற்று வாய்ப்புகள் அடிக்குறிப்பு b-யில் உள்ளன. “வெள்ளப்பெருக்குகள்” נַחֲלֵיயின் கவிதைச் சூழலிலான திடீர், அழிவூட்டும் நீரோட்டத்துக்கு ஏற்றது. “பெலியால்” குறித்த அடிக்குறிப்பு தேவையற்ற பிற்கால ஆளுருவாக்கத்தை முதன்மைப் பாடத்தில் திணிக்காமல் வாசிப்பு வாய்ப்பை முறையாகக் காட்டுகிறது.
