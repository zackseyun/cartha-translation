source:
  edition: WLC
  text: כִּ֥י אֲפָפֻ֖/נִי מִשְׁבְּרֵי מָ֑וֶת נַחֲלֵ֥י בְלִיַּ֖עַל יְבַעֲתֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/005.yaml
  text: For the waves of death surrounded me[b][a]; the torrents of worthlessness terrified me.
translation:
  language: ta
  text: 'ஏனெனில், மரணத்தின் பேரலைகள்[b] என்னைச் சூழ்ந்துகொண்டன;

    கயமையின் வெள்ளப்பெருக்குகள்[a] என்னைப் பேரச்சமடையச் செய்தன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெலியாலின் வெள்ளப்பெருக்குகள்”; בְלִיַּעַל என்ற எபிரெயச் சொல்லை ‘கயமை’ எனும் பொதுப்பெயராக அல்லாமல் ‘பெலியால்’ எனும் தனிப்பெயராக எடுத்துக்கொள்ளும் வாசிப்பு.
    reason: alternative_reading
  - marker: b
    text: “பேரலைகள்” என்பதை “மோதும் அலைகள்” அல்லது “கொந்தளிக்கும் அலைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றிற்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֲפָפֻנִי
  choice: என்னைச் சூழ்ந்துகொண்டன
  rationale: முற்றிலும் சுற்றிவளைத்து நெருக்கும் படிமத்தையும், நிகழ்வின் தீவிரத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִשְׁבְּרֵי
  choice: பேரலைகள்
  rationale: கரையில் மோதிச் சிதறும் வலிமையான அலைகளைச் சுட்டும் சொல்லை, கவிதையின் அச்சுறுத்தும் நீர்ப்படிமம் குன்றாமல் நவீன தமிழில் வழங்குகிறது.
- source_word: מָוֶת
  choice: மரணம்
  rationale: மூலச்சொல்லின் நேரடிப் பொருளைப் பாதுகாத்து, மரணத்தை மூழ்கடிக்கும் அலைகளாக உருவகப்படுத்துகிறது.
- source_word: נַחֲלֵי
  choice: வெள்ளப்பெருக்குகள்
  rationale: ஓடைகள் அல்லது பருவகால ஆற்றுப்படுகைகள் திடீரெனப் பெருக்கெடுத்து ஓடும் வலிமையை இச்சூழலில் வெளிப்படுத்துகிறது; இணைவரியின் பேரலைப் படிமத்துக்கும் பொருந்துகிறது.
- source_word: בְלִיַּעַל
  choice: கயமை
  rationale: பயனின்மை, ஒழுக்கக்கேடு, அழிவை உண்டாக்கும் தீமை ஆகிய பொருள் நிழல்களை இயல்பான தமிழில் சுருக்கமாகக் கொண்டுவருகிறது; இதை அவசியமின்றி பிற்காலத் தனிப்பெயராக மாற்றவில்லை.
- source_word: יְבַעֲתֻנִי
  choice: என்னைப் பேரச்சமடையச் செய்தன
  rationale: திடீரென உண்டாகும் கடும் திகிலையும் அச்சத்தையும், சாதாரண பயத்தைவிட வலிமையாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: בְלִיַּעַל என்பதை பொதுப்பெயராக மொழிபெயர்ப்பதா, ‘பெலியால்’ என்ற தனிப்பெயராகக் கொள்வதா
  choice: முதன்மைப் பாடத்தில் ‘கயமை’ என்ற பொதுப்பெயராக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘பெலியாலின் வெள்ளப்பெருக்குகள்’ என்று தனிப்பெயராக வாசிக்கலாம்.
  rationale: இப்பாடலின் கவிதைச் சூழலில் இச்சொல் அழிவை உண்டாக்கும் ஒழுக்கக்கேட்டையும் தகுதியின்மையையும் குறிக்கும் பொதுப்பெயராக இயங்குகிறது. ‘பெலியால்’ என்ற பிற்கால ஆளுருவாக்கப்பட்ட தீய சக்தியின் கருத்தை மூலத்துக்குள் தேவையின்றி கொண்டுவராமல், உண்மையான வாசிப்பு வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பாடலுக்குரிய கண்ணியமான கவிதை நடையும் இணைவரி அமைப்பும் பேணப்பட்டுள்ளன. அரிதான பழமொழிச்சொற்களைத் தவிர்த்து, ‘பேரலைகள் / வெள்ளப்பெருக்குகள்’ என்ற இணையான நீர்ப்படிமம் வலுப்படுத்தப்பட்டுள்ளது.
