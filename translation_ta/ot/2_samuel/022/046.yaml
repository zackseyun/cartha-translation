  register: நவீன நிலையான தமிழில், கவிதைத் தன்மையும் போர்வெற்றிச் சூழலும் காக்கப்பட்டுள்ளன. கடினமான எபிரேய வினைகள் முதன்மை உரையில் சூழலுக்கேற்ற இயல்பான தமிழில் தரப்பட்டு, உண்மையான சொற்பொருள் ஐயங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
