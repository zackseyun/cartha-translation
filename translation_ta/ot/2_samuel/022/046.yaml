base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/046.yaml
  text: Foreigners lose heart and come trembling out of their strongholds[a][b][c].
translation:
  language: ta
  text: அந்நியர்கள் மனந்தளர்ந்து, தங்கள் அரண்களிலிருந்து நடுங்கியபடி வெளியே வருகிறார்கள்[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்நியர்கள் வாடிப்போகிறார்கள்.” எபிரேய வினை இன்னும் நேரடியாக வாடுவதையோ மங்குவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள எபிரேய வினையின் பொருள் தெளிவற்றது; “தாழ்ந்து கெஞ்சியபடி வருகிறார்கள்,” “நொண்டியபடி வருகிறார்கள்,” அல்லது இன்னும் நேரடியாக “இடுப்பில் கச்சை கட்டிக்கொள்கிறார்கள்” என்பன மாற்று மொழிபெயர்ப்புகள்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தங்கள் கோட்டைகளிலிருந்து”; சாத்தியம் குறைவாக, “தங்கள் சிறைகளிலிருந்து/அடைப்பிடங்களிலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: அந்நியர்கள்
  rationale: இந்தக் கட்டமைப்பு சொல்லுக்கு சொல் ‘அந்நியரின் பிள்ளைகள்’ என்றாலும், அந்நிய மக்களைக் குறிக்கும் எபிரேய மரபுத்தொடர். ‘அந்நியர்கள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: יִבֹּלוּ
  choice: மனந்தளர்ந்து
  rationale: נבל என்ற வினை பொதுவாக ‘வாடுதல், மங்குதல்’ எனப் பொருள்படும். போர்ப்பாடலின் சூழலில் வீரமும் உயிர்த்துடிப்பும் குன்றுவதை ‘மனந்தளர்ந்து’ இயல்பாக வெளிப்படுத்துகிறது; நேரடியான மாற்றுப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְיַחְגְּרוּ
  choice: நடுங்கியபடி வெளியே வருகிறார்கள்
  rationale: இங்குள்ள வினை கடினமானது. חגר வழக்கமாக ‘கச்சை கட்டுதல்’ என்று பொருள்பட்டாலும், இந்த இணைப்பாடுச் சூழலில் அச்சத்துடன் வெளியே வருவதைக் குறிக்கலாம். சூழலுக்கு ஏற்ற வாசிப்பை முதன்மை உரை தருகிறது; மாற்றுகள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: מִמִּסְגְּרוֹתָם
  choice: தங்கள் அரண்களிலிருந்து
  rationale: מִסְגְּרוֹת என்பது அடைக்கப்பட்ட அல்லது சூழப்பட்ட இடங்களைக் குறிக்கலாம். வெற்றிப் பாடலின் இராணுவச் சூழலில் ‘அரண்கள்’ இயல்பாகப் பொருந்துகிறது; ‘கோட்டைகள்’ மற்றும் ‘சிறைகள்/அடைப்பிடங்கள்’ என்பனவும் சாத்தியம்.
