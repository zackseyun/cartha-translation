translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. தேவனை நோக்கும் ஒருமை மரியாதை வடிவமான ‘நீர்/செய்தீர்’ பயன்படுத்தப்பட்டுள்ளது. போர்ச் சூழலின் உருவகங்கள் முடிந்தவரை பாதுகாக்கப்பட்டுள்ளன.
