  text: וַ/תַּזְרֵ֥/נִי חַ֖יִל לַ/מִּלְחָמָ֑ה תַּכְרִ֥יעַ קָמַ֖/י תַּחְתֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/040.yaml
  text: You armed me with strength for battle[b][a]; you caused those who rose against me to bow beneath me.
translation:
  language: ta
  text: போருக்காக நீர் என்னை வலிமையால் ஆயத்தப்படுத்தினீர்[a]; என்னை எதிர்த்து எழுந்தவர்களை எனக்குக் கீழே மண்டியிடச் செய்தீர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போருக்காக நீர் என்னை வலிமையால் இடைக்கச்சை கட்டினீர்.” எபிரெய வினைச்சொல் இடைக்கச்சை கட்டுதல் அல்லது ஆயத்தப்படுத்துதல் என்ற உருவகத்தைக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் எதிரிகளை எனக்குக் கீழே பணியச் செய்தீர்.” எபிரெய வினைச்சொல் எதிரிகளைக் குனியவோ மண்டியிடவோ செய்வதை இன்னும் நேரடியாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּזְרֵנִי
  choice: என்னை வலிமையால் ஆயத்தப்படுத்தினீர்
  rationale: இந்த வினைச்சொல் இடைக்கட்டுதல் அல்லது போருக்கு உபகரணப்படுத்துதல் என்ற உருவகத்தைக் கொண்டது. தமிழில் இயல்பாகவும் போர்ச் சூழலைத் தெளிவாகவும் தெரிவிக்க ‘ஆயத்தப்படுத்தினீர்’ என மொழிபெயர்க்கப்பட்டது; ‘வலிமையால்’ என்பது எபிரெய வாக்கியத்தின் கருவிப்பொருளைத் தக்கவைக்கிறது.
- source_word: חַיִל
  choice: வலிமை
  rationale: இச்சொல் வலிமை, ஆற்றல், வீரியம் அல்லது படைத்திறன் ஆகியவற்றைக் குறிக்கலாம். இங்கு போருக்காகக் கொடுக்கப்படும் ஆற்றலைக் குறிப்பதால் ‘வலிமை’ பொருத்தமானது.
- source_word: לַמִּלְחָמָה
  choice: போருக்காக
  rationale: מִלְחָמָה என்பது போர் அல்லது யுத்தத்தைக் குறிக்கிறது. நோக்கத்தைச் சுட்டும் ל முன்னொட்டை ‘போருக்காக’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תַּכְרִיעַ
  choice: மண்டியிடச் செய்தீர்
  rationale: כָּרַע என்பதன் காரணவினை வடிவம் ஒருவரைக் குனியவோ மண்டியிடவோ செய்வதைக் குறிக்கிறது. ‘மண்டியிடச் செய்தீர்’ எதிரிகள் வலுக்கட்டாயமாகத் தாழ்த்தப்பட்ட காட்சியைப் பாதுகாக்கிறது.
- source_word: קָמַי
  choice: என்னை எதிர்த்து எழுந்தவர்கள்
  rationale: இது ‘எனக்கு எதிராக எழுகிறவர்கள்’ என்ற சொற்பொருளுடைய பங்கேற்பு வடிவம். தமிழிலும் எழுச்சி மற்றும் பகைமை ஆகிய இரு நுணுக்கங்களையும் இச்சொற்றொடர் காக்கிறது.
- source_word: תַּחְתֵּנִי
  choice: எனக்குக் கீழே
  rationale: இது நேரடியாக ‘எனக்குக் கீழே/என் அடியில்’ என்று பொருள்படும். எதிரிகள் தாழ்த்தப்பட்ட இடநிலைக் காட்சியைத் தக்கவைக்க ‘எனக்குக் கீழே’ பயன்படுத்தப்பட்டது.
