  text: וָ/אֲכַלֵּ֥/ם וָ/אֶמְחָצֵ֖/ם וְ/לֹ֣א יְקוּמ֑וּ/ן וַֽ/יִּפְּל֖וּ תַּ֥חַת רַגְלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/039.yaml
  text: I consumed them and shattered them[a], and they did not rise[b]; they fell under my feet.
translation:
  language: ta
  text: நான் அவர்களை அழித்தேன்[a]; நொறுக்கினேன்; அவர்கள் எழவில்லை[b]; என் காலடியில் விழுந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விழுங்கினேன்.” எபிரெய வினைச்சொல்லின் அடிப்படைப் பொருள் “உண்/விழுங்கு”; போர்க் கவிதைச் சூழலில் அது “அழி” என்ற பொருளில் பயன்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களால் எழ முடியவில்லை.” எபிரெய உரை நேரடியாக, “அவர்கள் எழவில்லை” என்கிறது.
    reason: ambiguity
lexical_decisions:
- source_word: וָאֲכַלֵּם
  choice: அவர்களை அழித்தொழித்து
  rationale: אכל என்பதன் அடிப்படைப் பொருள் ‘உண்/விழுங்கு’; போர்ச் சூழலில் அது ‘முற்றிலும் அழி’ என்று விரிகிறது. தமிழில் ‘அழித்தொழித்து’ என்பது முழுமையான அழிவை இயல்பாகவும் வலிமையாகவும் தெரிவிக்கிறது; ‘விழுங்கினேன்’ என்ற நேரடி உருவகம் இச்சூழலில் தவறாகப் புரியக்கூடும்.
- source_word: וָאֶמְחָצֵם
  choice: நொறுக்கினேன்
  rationale: מחץ என்பது ‘நசுக்கு, நொறுக்கு’ எனும் கடுமையான தாக்குதலையும் தீர்மானமான தோல்வியையும் குறிக்கிறது. ‘நொறுக்கினேன்’ கவிதையின் போர்க்காட்சியையும் வினையின் தீவிரத்தையும் காக்கிறது.
- source_word: וְלֹא יְקוּמוּן
  choice: அவர்கள் எழுந்திருக்கவில்லை
  rationale: எபிரெயம் இயலாமையை வெளிப்படையாகச் சேர்க்காமல், அவர்கள் எழவில்லை என்ற விளைவையே கூறுகிறது. ஆகவே ‘எழ முடியவில்லை’ என்று வலிமையைச் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: וַיִּפְּלוּ
  choice: விழுந்தார்கள்
  rationale: נפל என்பதற்கான நேரடியான, இயல்பான தமிழ் இணை; செய்யுளின் சுருக்கமான நகர்வைத் தக்கவைக்கிறது.
- source_word: תַּחַת רַגְלָי
  choice: என் காலடியில்
  rationale: முழுமையான கீழ்ப்படுத்தலையும் தோல்வியையும் குறிக்கும் உருவகத்தை இயல்பான தமிழில் ‘என் காலடியில்’ காக்கிறது.
theological_decisions:
- issue: தாவீதின் வெற்றிப்பாடலில் உள்ள கடுமையான போர்க் காட்சி
  choice: முழுமையான அழிவையும் கீழ்ப்படுத்தலையும் குறிக்கும் முதலாம் நபர் மொழியை மென்மைப்படுத்தாமல் தக்கவைத்தல்
  alternative: ‘நான் அவர்களை முற்றிலும் தோற்கடித்தேன்’ போன்ற பொதுமைப்படுத்தப்பட்ட மென்மையான உரை
  rationale: மூல எபிரெயம் அழித்தல், நொறுக்குதல், காலடியில் விழுதல் ஆகிய கடுமையான கவித்துவப் படிமங்களைப் பயன்படுத்துகிறது. அவற்றை பொதுவான ‘தோற்கடித்தேன்’ எனச் சுருக்குவது மூலத்தின் தீவிரத்தையும் படிமத்தையும் இழக்கச் செய்யும்.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான போர்ப்பாடல் நடை. வாக்கியத்தின் இணைநிலை அமைப்பும் கடுமையான வெற்றிப் படிமங்களும் தக்கவைக்கப்பட்டுள்ளன.
