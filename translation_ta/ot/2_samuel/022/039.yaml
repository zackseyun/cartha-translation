revisions:
- from: நான் அவர்களை அழித்தொழித்து, நொறுக்கினேன்[a]; அவர்கள் எழுந்திருக்கவில்லை[b]; என் காலடியில் விழுந்தார்கள்.
  to: நான் அவர்களை அழித்தேன்[a]; நொறுக்கினேன்; அவர்கள் எழவில்லை[b]; என் காலடியில் விழுந்தார்கள்.
  rationale: The revision preserves the Hebrew’s two coordinated first-person verbs, retains its severe battle imagery without interpretive softening, and uses compact modern Tamil. Footnotes are re-anchored so that each note transparently corresponds to the relevant wording and does not merge distinct lexical decisions.
