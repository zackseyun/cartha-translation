  yaml_path: translation/ot/2_samuel/022/003.yaml
  text: my God[a], my rock, in whom I take refuge, my shield and the horn of my salvation, my stronghold and my refuge[c][b], my savior—you save me from violence.
translation:
  language: ta
  text: என் தேவன்[a], நான் அடைக்கலம் புகும் என் கன்மலை; என் கேடயம், என் மீட்பின் கொம்பு[b], என் உயர்ந்த அரண், என் புகலிடம், என் மீட்பர்[c]—வன்முறையிலிருந்து நீர் என்னை மீட்கிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் கன்மலையின் தேவன்.” எபிரெயச் சொற்றொடரை இவ்வாறு நேரடியாகவும் மொழிபெயர்க்கலாம்; இங்கு இறைப்பட்டங்களின் கவிதைத் தொடருக்கு ஏற்ப இணைநிலையாக மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “கொம்பு” என்பது வலிமையையும் வெற்றிகரமான ஆற்றலையும் குறிக்கும் எபிரெய உருவகம்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “என்னைக் காப்பவர்” அல்லது “என் விடுவிப்பவர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי צוּרִי
  choice: என் தேவன், என் கன்மலை
  rationale: எபிரெயக் கட்டமைப்பைச் சொல்லுக்குச் சொல் மொழிபெயர்த்தால் ‘என் கன்மலையின் தேவன்’ எனலாம். ஆனால் தொடர்ச்சியாக வரும் இறைப்பட்டங்களின் கவிதை அமைப்பில் இதனை இணைநிலை அழைப்புகளாகக் கொடுப்பது இயல்பாகவும் பொருளுக்கு ஏற்றதாகவும் உள்ளது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֶחֱסֶה בוֹ
  choice: நான் அடைக்கலம் புகும்
  rationale: חסה என்பது பாதுகாப்புக்காக அடைக்கலம் புகுதலைக் குறிக்கிறது. தொடர்பெயர் வடிவம், ‘கன்மலை’ என்ற உருவகத்துடன் இயல்பாக இணைகிறது.
- source_word: מָגִנִּי
  choice: என் கேடயம்
  rationale: பாதுகாப்பைக் குறிக்கும் நேரடியான உருவகத்தை அப்படியே தக்கவைக்கிறது.
- source_word: קֶרֶן יִשְׁעִי
