  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு புரியும் வகையிலும் கவிதைக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. இறைவனை நோக்கிய நேரடி உரையில் மரியாதைப் பன்மையான ‘நீர்/மீட்கிறீர்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் குறுங்கூற்றுத் தன்மையும் உருவகங்களின் அடுக்குமுறையும் இயன்றவரை தக்கவைக்கப்பட்டுள்ளன.
