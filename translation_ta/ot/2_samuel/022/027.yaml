  source_fidelity: 'The Tamil preserves the two balanced relational clauses and the Hebrew wordplay in the first clause: נָבָר (“pure”) and תִּתָּבָר (“you show yourself pure”) are appropriately echoed by “தூயவரோடு ... தூயவராக.” “கோணலானவர்” suitably represents עִקֵּשׁ, a morally crooked/devious person. For the rare and disputed תִּתַּפָּל, “மாறுபட்டு நடந்துகொள்கிறீர்” is a defensible contextual rendering that conveys a corresponding, adverse manner of dealing without falsely presenting the difficult verb’s precise sense as certain.'
