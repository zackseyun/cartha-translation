source:
  edition: WLC
  text: עִם נָבָ֖ר תִּתָּבָ֑ר וְ/עִם עִקֵּ֖שׁ תִּתַּפָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/027.yaml
  text: With the pure you show yourself pure[a], but with the crooked you show yourself twisted.
translation:
  language: ta
  text: 'தூயவரோடு நீர் தூயவராக உம்மை வெளிப்படுத்துகிறீர்;

    ஆனால் கோணலானவரோடு நீர் மாறுபட்டு நடந்துகொள்கிறீர்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கோணலானவரோடு நீர் கோணலாக உம்மை வெளிப்படுத்துகிறீர்.” இங்குள்ள எபிரெய வினை அரிதானதும் பொருள் தெளிவில்லாததுமாகும்; அது மாறுபட்டு அல்லது எதிர்த்து நடந்துகொள்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: தூயவர்
  rationale: இந்தப் பெயரடை தூய்மை அல்லது மாசின்மையைக் குறிக்கிறது. அடுத்துவரும் அதே வேர்ச்சொல் சார்ந்த வினையுடனான சொல்லிணைப்பையும் தமிழில் காக்கிறது.
- source_word: תִּתָּבָר
  choice: தூயவராக உம்மை வெளிப்படுத்துகிறீர்
  rationale: வினையின் தற்சுட்டுப் பொருளையும், נָבָר என்பதுடனான கவிதைச் சொல்லிணைப்பையும் வெளிப்படுத்துகிறது.
- source_word: עִקֵּשׁ
  choice: கோணலானவர்
  rationale: நேர்மையற்ற, வஞ்சகமான ஒழுக்கநிலையைக் குறிக்கும் சொல்லுக்கு இது தெளிவான உருவகத் தமிழ்; ‘தூயவர்’ என்பதற்கு எதிரிணையாகவும் அமைகிறது.
- source_word: תִּתַּפָּל
  choice: மாறுபட்டு நடந்துகொள்கிறீர்
  rationale: அரிதானதும் பொருள் தெளிவில்லாததுமான இவ்வினை, கோணலானவருக்கு ஏற்ற எதிர்வினையாகக் கடவுள் நடந்துகொள்வதைக் குறிக்கலாம். மூலத்தின் எதிர்மறைத் தொனியை முற்றிலும் நீக்காமலும், கடவுளுக்கே ஒழுக்கக் கோணலை நேரடியாகச் சாட்டாமலும் இந்த மொழிபெயர்ப்பு அமைந்துள்ளது.
- source_word: עִם
  choice: -ஓடு
  rationale: ஒருவருடனான உறவுசார் ஒத்திசைவு அல்லது அணுகுமுறையைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: கோணலானவரிடம் கடவுள் காட்டும் பதிலை, கடவுளுக்கே ஒழுக்கக் கோணலைச் சாட்டாமல் எவ்வாறு மொழிபெயர்ப்பது
  choice: மாறுபட்டு நடந்துகொள்கிறீர்
  alternative: கோணலாக உம்மை வெளிப்படுத்துகிறீர் / தந்திரமாக நடந்துகொள்கிறீர்
  rationale: மூல எபிரெய வினை அரிதும் கடினமும் ஆகும்; அது ‘திரித்துக்கொள்’, ‘மாறுபட்டு நடந்துகொள்’, அல்லது எதிர்த்து சமாளி என்ற நிழற்பொருள்களைத் தரலாம். தேர்ந்தெடுத்த வாசகம் கவிதையின் பொருத்தமான எதிர்வினையையும் உண்மையான தெளிவின்மையையும் காக்கிறது; கடவுள் ஒழுக்கரீதியாகக் கோணலானவர் என்று அமைதியாகத் தீர்மானிப்பதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதை இணை அமைப்பையும் மரியாதைப் பன்மை இறைவழக்கையும் காக்கும் கண்ணியமான நடை. மூலத்தின் ‘தூயவர்—தூயவராக’ என்ற வேர்ச்சொல் மீளுருவாக்கம் பாதுகாக்கப்பட்டுள்ளது; கடினமான இரண்டாம் வினையின் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
