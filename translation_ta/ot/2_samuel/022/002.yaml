revisions:
- from: 'அவர் சொன்னது: “யெகோவா என் கற்பாறை; என் கோட்டை; என்னை விடுவிப்பவர்.”'
  to: 'அவர் சொன்னார்: “யெகோவா என் கற்பாறை, என் கோட்டை, எனக்கு விடுதலை அளிப்பவர்.”'
  rationale: The revision corrects the Tamil narrative syntax and gives the final deliverer expression a natural form that preserves its personal reference. It retains the divine name and all three Hebrew metaphors, without adding interpretive content.
