  text: וַ/יֹּאמַ֑ר יְהוָ֛ה סַֽלְעִ֥/י וּ/מְצֻדָתִ֖/י וּ/מְפַלְטִ/י לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/002.yaml
  text: 'And he said: “The LORD is my rock and my fortress and my deliverer for me.”'
translation:
  language: ta
  text: 'அவர் சொன்னார்: “யெகோவா என் கற்பாறை, என் கோட்டை, எனக்கு விடுதலை அளிப்பவர்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பெயரைப் பொதுப்பட்டமான ‘ஆண்டவர்’ என மாற்றாமல், நவீன தமிழ் வேதாகம வாசகர்களுக்குப் பரிச்சயமான வடிவில் தருகிறது.
- source_word: סַלְעִי
  choice: என் கற்பாறை
  rationale: סֶלַע என்பதன் பாறை/செங்குத்தான கன்மலை உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: מְצֻדָתִי
  choice: என் கோட்டை
  rationale: பாதுகாப்பான அரண் அல்லது மலைக்கோட்டை என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: מְפַלְטִי לִי
  choice: என்னை விடுவிப்பவர்
  rationale: מְפַלְטִי-யின் தனிப்பட்ட உறவையும், வலியுறுத்தும் לִי (‘எனக்காக/எனக்கு’) என்பதையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது; சொற்சொல்லான ‘எனக்காக என்னை விடுவிப்பவர்’ நடைமுறையில் தேவையற்ற மீளுரைப்பாகும்.
theological_decisions:
- issue: தேவனுடைய திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: ஆண்டவர்
  rationale: எபிரெய மூலத்தில் பொதுப்பட்டம் அல்ல, יהוה என்ற தனிப்பெயர் உள்ளது; எனவே தனிப்பெயர் வடிவம் பாதுகாக்கப்பட்டது.
- issue: לִי என்பதன் தனிப்பட்ட வலியுறுத்தல்
  choice: ‘என்னை விடுவிப்பவர்’ என்ற தொடருக்குள் இயல்பாக வெளிப்படுத்தப்பட்டது
  alternative: ‘எனக்காக என்னை விடுவிப்பவர்’
  rationale: மூலத்தின் தனிப்பட்ட பயன்பாட்டை நீக்காமல், தமிழில் செயற்கையான இரட்டிப்பைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; சங்கீதப் பாணிக்கேற்ற கண்ணியத்துடன், சாதாரண வாசகருக்குப் புரியும் சுருக்கமான இணை அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
