  text: מִ/נֹּ֖גַהּ נֶגְדּ֑/וֹ בָּעֲר֖וּ גַּחֲלֵי אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/013.yaml
  text: From the brightness before him[a], coals of fire blazed forth.
translation:
  language: ta
  text: அவருக்கு முன்பாக இருந்த ஒளிவீச்சிலிருந்து[a] நெருப்புத் தணல்கள் கொழுந்துவிட்டு எரிந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்கு முன்பாக இருந்த பிரகாசத்திலிருந்து எரியும் தணல்கள் சுடர்விட்டு எழுந்தன.”
    reason: ஒளிவீச்சு/பிரகாசம் மற்றும் எரிந்தன/சுடர்விட்டு எழுந்தன என்ற செல்லத்தக்க சொற்பொருள் மாற்றுகளைப் பதிவு செய்கிறது.
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: ஒளிவீச்சிலிருந்து
  rationale: נֹגַהּ என்பது ஒளி, பிரகாசம், ஒளிவீச்சு ஆகிய பொருள்களைக் குறிக்கிறது; முன்சேர்க்கை מִן மூலத்தைக் காட்டுவதால் ‘-இலிருந்து’ என மொழிபெயர்க்கப்பட்டது. இறைத்தோற்றத்தின் ஒளிமிக்க காட்சியை இயல்பான நவீனத் தமிழில் இது தருகிறது.
- source_word: נֶגְדּוֹ
  choice: அவருக்கு முன்பிருந்த
  rationale: נֶגֶד மற்றும் மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு சேர்ந்து ‘அவருக்கு முன்பாக’ என்ற இடஞ்சார்ந்த பொருளைத் தருகின்றன. ‘அவருடைய சந்நிதி’ போன்ற விளக்கவுரையைச் சேர்க்காமல் எபிரெயச் சுருக்கம் காக்கப்பட்டது.
- source_word: בָּעֲרוּ
  choice: கொழுந்துவிட்டு எரிந்தன
  rationale: בער என்பதன் கால் வடிவம் எரிதல் அல்லது தீவிரமாகச் சுடர்விடுதலைக் குறிக்கிறது. ‘கொழுந்துவிட்டு எரிந்தன’ என்பது கவிதையின் தீவிரமான தீக்காட்சியைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; இயக்கம் அல்லது காரணத்தை அதிகமாகச் சேர்ப்பதில்லை.
- source_word: גַּחֲלֵי אֵשׁ
  choice: நெருப்புத் தணல்கள்
  rationale: இந்த இணைப்புச் சொற்றொடர் சொற்படியாக ‘நெருப்பின் தணல்கள்’ எனும் பொருளுடையது. ‘நெருப்புத் தணல்கள்’ என்பது எபிரெயப் படிமத்தைப் பாதுகாக்கும் இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: இறைத்தோற்றக் காட்சியும் மறைமுக எழுவாயும்
  choice: நெருப்புத் தணல்கள் இறைத்தோற்றத்தின் முன்புள்ள ஒளிவீச்சிலிருந்து எரிவதாக வரி அமைக்கப்பட்டது; கடவுள் அவற்றை எரியச் செய்தார் என்ற வெளிப்படையான காரணவினை சேர்க்கப்படவில்லை.
  alternative: ‘அவருடைய ஒளிவீச்சு நெருப்புத் தணல்களை எரியச் செய்தது’ என்று காரண உறவை வெளிப்படையாக்குதல்.
  rationale: எபிரெயக் கவிதை சுருக்கமாகவும் காரண உறவைத் தெளிவுபடுத்தாமலும் உள்ளது. ஆகவே இறைத்தோற்றத்தின் வலிமையான படிமமும் அதன் உண்மையான தெளிவின்மையும் காக்கப்பட்டன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் கவிதைக்குரிய கண்ணியமும் தீவிரமும் நிலைக்குமாறும் வடிவமைக்கப்பட்டது. ‘ஒளிவீச்சு’, ‘நெருப்புத் தணல்கள்’, ‘கொழுந்துவிட்டு எரிந்தன’ ஆகியவை இயல்பான தமிழ் தீக்காட்சியை வழங்குகின்றன.
