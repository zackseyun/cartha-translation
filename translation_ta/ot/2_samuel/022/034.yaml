    reason: textual_variant
lexical_decisions:
- source_word: מְשַׁוֶּה
  choice: ஆக்குகிறார்
  rationale: שוה என்பதன் பியேல் வடிவம் இங்கு ஒன்றை மற்றொன்றைப்போல் ஆக்குவதைக் குறிக்கிறது; தமிழில் ஒப்புமையோடு இயல்பாக அமையும் காரணவினைச் சொல் இது.
- source_word: רגלי/ו
  choice: என் கால்களை
  rationale: மசோரா வாசிப்பு மரபும் அடுத்த அடியிலுள்ள முதலாம் நபர் வடிவங்களும் ‘என் கால்களை’ என்பதை ஆதரிக்கின்றன. எழுத்து வடிவத்திலுள்ள ‘அவனுடைய கால்களை’ என்ற வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כָּאַיָּלוֹת
  choice: பெண்மான்களின் கால்களைப்போல்
  rationale: பெண்பால் பன்மை வடிவம் பெண்மான்களைக் குறிக்கிறது. ஒப்பிடப்படுவது கால்கள் என்பதைக் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்த ‘கால்களைப்போல்’ சேர்க்கப்பட்டுள்ளது.
- source_word: בָּמוֹתַי
  choice: என் உயரமான இடங்களில்
  rationale: במות என்பதன் அடிப்படைப் பொருள் உயரங்கள் அல்லது உயரமான இடங்கள். வழிபாட்டுக்குரிய ‘மேடைகள்’ என்ற தொழில்நுட்பப் பொருளை இங்கு தேவையின்றி புகுத்தாமல், முதலாம் நபர் உடைமையையும் கவிதைச் சித்திரத்தையும் காக்கிறது.
- source_word: יַעֲמִדֵנִי
  choice: என்னை நிலைநிறுத்துகிறார்
  rationale: עמד என்பதன் ஹிஃபீல் வடிவம் ‘நிற்கச் செய்’ அல்லது ‘நிலைநிறுத்து’ என்று பொருள்படும். உயரமான இடங்களில் உறுதியாக நிற்கச் செய்வதைக் ‘நிலைநிறுத்துகிறார்’ சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
