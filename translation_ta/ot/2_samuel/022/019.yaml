base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/019.yaml
  text: They confronted me in the day of my calamity[b][a], but Yahweh was my support.
translation:
  language: ta
  text: என் பேரிடர் நாளில் அவர்கள் என்னை எதிர்கொண்டார்கள்[a]; ஆனால் யாவே[b] எனக்கு ஆதரவாயிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் பேரிடர் நாளில் அவர்கள் என்மீது வந்தார்கள்” அல்லது “என்னைச் சந்தித்தார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் יהוה (YHWH), இறைவனின் தனிப்பெயர்; மரபாக “கர்த்தர்” என்று வாசிக்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: יְקַדְּמֻנִי
  choice: அவர்கள் என்னை எதிர்கொண்டார்கள்
  rationale: קדמ என்பதன் பியேல் வடிவம் இங்கு பகைமையான சூழலில் ஒருவரை எதிர்கொண்டு வருதல் அல்லது அவர்மீது வந்து விழுதல் என்ற பொருளைத் தருகிறது. ‘எதிர்கொண்டார்கள்’ என்பது அந்த எதிர்ப்புணர்வை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּיוֹם אֵידִי
  choice: என் பேரிடர் நாளில்
  rationale: אֵיד என்பது கடும் கேடு, அழிவு அல்லது பேரிடரைக் குறிக்கிறது. ‘பேரிடர்’ என்பது வெறும் உள்ளார்ந்த துயரமாகக் குறுக்காமல் வெளிப்புறப் பெருங்கேட்டையும் உள்ளடக்குகிறது; ‘நாளில்’ காலத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரை இயல்பாகத் தருகிறது.
- source_word: וַיְהִי
  choice: ஆனால் ... இருந்தார்
  rationale: எபிரெய வாவ் இணைப்பைச் சொற்படியாக ‘மற்றும்’ என்று தரலாம்; எனினும் பகைவர்கள் எதிர்கொண்டதற்கும் யாவே ஆதரவாயிருந்ததற்கும் இடையிலான சூழல்சார் எதிர்மறைத் தொடர்பை ‘ஆனால்’ தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைத் தனிப்பெயர் YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அதன் பரவலான ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: מִשְׁעָן לִי
  choice: எனக்கு ஆதரவாயிருந்தார்
  rationale: מִשְׁעָן என்பது ஒருவர் சாய்ந்து கொள்ளக்கூடிய தாங்குதல் அல்லது ஆதரவைக் குறிக்கிறது. உருவகச் சூழலில் ‘எனக்கு ஆதரவாயிருந்தார்’ என்பது לִי-யின் உறவுப் பொருளையும் நவீன தமிழில் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் தனிப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் YHWH என்ற தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ அதனைத் தனிப்பெயராகப் பாதுகாக்கிறது; ‘கர்த்தர்’ என்பது மரபான மாற்று வாசிப்பு என்றாலும் அது தனிப்பெயருக்குப் பதிலாக ஒரு பட்டப்பெயரைத் தருகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. பகைமையான சூழலை ‘எதிர்கொண்டார்கள்’ வெளிப்படுத்துகிறது; இறைவனைக் குறிக்கும் வினைமுற்றில் தமிழின் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் உருவகமான ‘தாங்குகோல்/சார்பு’ கருத்து தெளிவுக்காக ‘ஆதரவு’ என வழங்கப்பட்டுள்ளது.
