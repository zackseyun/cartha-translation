base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/038.yaml
  text: I pursued my enemies and destroyed them[a], and I did not turn back until they were consumed.
translation:
  language: ta
  text: என் பகைவர்களைத் துரத்தி அவர்களை அழித்தேன்; அவர்கள் முற்றிலும் ஒழிந்துபோகும்வரை[a] நான் திரும்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் அவர்களை முற்றிலும் அழித்துத் தீரும்வரை.” எபிரேயச் சொற்றொடர், அவர்கள் முடிவுக்கு வந்ததை அல்லது அவர்களை அவர் முழுமையாக அழித்து முடித்ததைச் சுட்டலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרְדְּפָה
  choice: துரத்தி
  rationale: רדף என்பதன் இயல்பான போர்ச் சூழல் பொருள் ‘பின்தொடர்ந்து துரத்துதல்’; நவீனத் தமிழில் ‘துரத்தி’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֹיְבַי
  choice: என் பகைவர்களை
  rationale: אויב என்பதுடன் முதலாம் நபர் ஒருமை உடைமை விகுதி சேர்ந்திருப்பதால், தனிப்பட்டதும் போர்ச் சார்ந்ததுமான ‘என் பகைவர்கள்’ என்ற பொருள் நேரடியாகப் பாதுகாக்கப்படுகிறது.
- source_word: וָאַשְׁמִידֵם
  choice: அவர்களை அழித்தேன்
  rationale: שׁמד என்பதன் ஹிஃபில் வடிவம் அழித்தல் அல்லது முற்றாக ஒழித்தல் என்பதைக் குறிக்கிறது. ‘அழித்தேன்’ வலிமையானதாயிருந்தும் மிகைப்படுத்தாத, கண்ணியமான தமிழ் சொல்லாக்கம்.
- source_word: וְלֹא אָשׁוּב
  choice: நான் திரும்பவில்லை
  rationale: שׁוב என்பது திரும்புதல் அல்லது துரத்தலை விட்டுத் திரும்புதல் எனப் பொருள்படலாம். ‘திரும்பவில்லை’ அந்தச் சூழலையும் எபிரேயத்தின் பொதுவான சொல்லாட்சியையும் தக்கவைக்கிறது.
- source_word: עַד כַּלּוֹתָם
  choice: அவர்கள் முற்றிலும் ஒழிந்துபோகும்வரை
  rationale: כלה என்பது முடிவுறுதல், தீர்ந்துபோதல், நுகரப்படுதல் அல்லது முழுமையாக அழிக்கப்படுதல் ஆகிய பொருள்களைத் தரலாம். இச்சொல்லாக்கம் பகைவர்களின் முடிவு முழுமையானது என்பதைத் தெரிவிக்கிறது; செய்பவர் சார்ந்த மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
