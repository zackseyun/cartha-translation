source:
  edition: WLC
  text: וַֽ/תְּפַלְּטֵ֔/נִי מֵ/רִיבֵ֖י עַמִּ֑/י תִּשְׁמְרֵ֨/נִי֙ לְ/רֹ֣אשׁ גּוֹיִ֔ם עַ֥ם לֹא יָדַ֖עְתִּי יַעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/044.yaml
  text: You delivered me from the strivings of my people[a]; you kept me as the head of nations[c][b]; a people I had not known served me.
translation:
  language: ta
  text: என் மக்களின் சச்சரவுகளிலிருந்து என்னை விடுவித்தீர்[a]; தேசங்களின் தலைவனாக என்னைக் காத்தீர்[b]; நான் அறிந்திராத ஒரு மக்கள் எனக்குப் பணிசெய்வார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் மக்களின் பிணக்குகளிலிருந்து.’ இது தாவீதின் சொந்த மக்களுக்குள் ஏற்பட்ட மோதல்களையோ அவர்களைச் சார்ந்த மோதல்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தேசங்கள்மேல் தலைவனாக என்னை நிலைநிறுத்தினீர்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘எனக்குப் பணிசெய்தார்கள்.’ எபிரெயக் கவிதையில் இங்குள்ள வினைவடிவம் எதிர்காலத்தையோ தொடர்ந்த அல்லது விளைவான செயலையோ குறிக்கலாம்.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וַתְּפַלְּטֵנִי
  choice: என்னை விடுவித்தீர்
  rationale: פלט என்பதன் ஹிஃபில் வடிவம் ஒருவரைத் தப்புவித்தல் அல்லது விடுவித்தலைக் குறிக்கிறது. ‘விடுவித்தீர்’ என்பது தெய்வீக மீட்பை இயல்பாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: מֵרִיבֵי עַמִּי
  choice: என் மக்களின் சச்சரவுகளிலிருந்து
  rationale: רִיב என்பது சச்சரவு, பிணக்கு, வாதம் போன்ற பரந்த பொருள்களைக் கொண்டது. இக்கட்டமைப்பு தாவீதின் சொந்த மக்களுக்குள் எழுந்த மோதல்களையோ அவர்களைச் சார்ந்த மோதல்களையோ குறிக்கலாம்; ‘மக்களின் சச்சரவுகள்’ அந்தத் தெளிவின்மையைத் தக்கவைக்கிறது.
- source_word: תִּשְׁמְרֵנִי
  choice: என்னைக் காத்தீர்
  rationale: שׁמר என்பதற்கு காத்தல், பாதுகாத்தல், நிலைநிறுத்துதல் ஆகிய பொருள்கள் உண்டு. இங்கு அரசனுடைய தலைமை நிலையை இறைவன் காத்து நிலைநிறுத்தியதைக் குறிக்கும் வகையில் ‘காத்தீர்’ பொருந்துகிறது.
- source_word: לְרֹאשׁ גּוֹיִם
  choice: தேசங்களுக்கு தலைவனாக
  rationale: רֹאשׁ இங்கு உருவகமாகத் தலைவர் அல்லது முதன்மையானவர் என்று பொருள்படுகிறது. לְ அந்தப் பங்கு அல்லது நிலையைச் சுட்டுகிறது; ‘தேசங்களுக்கு தலைவனாக’ உருவகத்தையும் அரசியல் பொருளையும் காக்கிறது.
- source_word: גּוֹיִם
  choice: தேசங்கள்
  rationale: இச்சூழலில் גּוֹיִם என்பது இஸ்ரவேலுக்கு அப்பாலுள்ள தேசங்கள் அல்லது மக்கள் குழுக்களைக் குறிக்கிறது. ‘தேசங்கள்’ என்பது பிற்கால சமயப் பொருளைத் திணிக்காத இயல்பான தெரிவாகும்.
- source_word: עַם לֹא יָדַעְתִּי
  choice: நான் அறிந்திராத ஒரு மக்கள்
  rationale: עַם என்பது ஒருமைத் தொகுப்புப்பெயர்; יָדַעְתִּי முன்பிருந்த அறிமுகம் அல்லது உறவைச் சுட்டலாம். ‘அறிந்திராத ஒரு மக்கள்’ இந்த வடிவத்தையும் பொருளையும் இயல்பாகக் காக்கிறது.
- source_word: יַעַבְדֻנִי
  choice: எனக்குப் பணிசெய்வார்கள்
  rationale: עבד இங்கு அரசியல் பணிவு அல்லது கீழ்ப்படிதலையும் உள்ளடக்கும். எபிரெய இறந்தகாலமற்ற வினைவடிவத்தின் எதிர்கால நுணுக்கத்தை ‘பணிசெய்வார்கள்’ தக்கவைக்கிறது; தமிழில் இது அரசருக்குச் சேவை செய்வதையும் இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: அந்நிய தேசங்கள்மீதான அரச ஆட்சியைக் குறிக்கும் மொழி
  choice: உடனடி வரலாற்று-அரச சூழலை முதன்மையாக வைத்தல்
  alternative: முதன்மை உரையிலேயே இதை நேரடியான மேசியா தீர்க்கதரிசனமாக விரிவாக்குதல்
  rationale: இது தாவீதின் விடுதலை மற்றும் அரசாட்சியைப் பற்றிய பாடலின் பகுதி. விரிந்த வேதாகம வாசிப்பில் முன்நிழல் அல்லது மேசியா சார்ந்த முக்கியத்துவம் காணப்பட்டாலும், மொழிபெயர்ப்பு எபிரெய உரையின் உடனடி வரலாற்றுப் பொருளில் வெளிப்படையாக இல்லாத விளக்கத்தைச் சேர்க்காது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய மரியாதைப் பன்மை வினைமுற்றுகள் இடப்பட்டுள்ளன. ‘சச்சரவுகள்’ மூலச்சொல்லின் பரந்த மோதல் பொருளையும், ‘தலைவன்’ רֹאשׁ என்ற உருவகத்தையும் காக்கின்றன; அரசியல் கீழ்ப்படிதல் முதன்மை உரையில் தேவையின்றி விரிவாக்கப்படவில்லை.
