  source_fidelity: 'The translation accurately reflects the Hebrew: God gives the speaker’s enemies their neck/back in the conventional image of defeat and retreat, and the speaker destroys those who hate him. The Tamil main text communicates this idiom clearly, while the footnote preserves the underlying literal image.'
  naturalness: “என் பகைவர்கள் எனக்குப் புறமுதுகு காட்டச் செய்தீர்” is natural, dignified modern Tamil and aptly conveys enemies being forced to turn away in defeat. “என்னை வெறுத்தவர்களை நான் அழித்தொழித்தேன்” is fluent and suitably strong for the Hiphil verb in the poetic context.
  terminology: “பகைவர்கள்” accurately renders אֹיְבַי, and “என்னை வெறுத்தவர்கள்” appropriately renders the substantival participle מְשַׂנְאַי in the past poetic setting. “அழித்தொழித்தேன்” adequately conveys the force of וָאַצְמִיתֵם without imposing an extraneous theological interpretation. The footnote’s “பின்கழுத்தை” preserves the lexical neck/back-of-neck image and explains the idiom.
