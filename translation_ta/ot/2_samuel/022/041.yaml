source:
  edition: WLC
  text: וְ/אֹ֣יְבַ֔/י תַּ֥תָּה לִּ֖/י עֹ֑רֶף מְשַׂנְאַ֖/י וָ/אַצְמִיתֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/041.yaml
  text: You gave me the necks of my enemies[a]; I destroyed those who hated me.
translation:
  language: ta
  text: 'என் பகைவர்கள் எனக்குப் புறமுதுகு காட்டச் செய்தீர்[a];

    என்னை வெறுத்தவர்களை நான் அழித்தொழித்தேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்கு சொல், “என் பகைவர்களின் பின்கழுத்தை எனக்குக் கொடுத்தீர்.” பகைவர்கள் தோற்று, திரும்பி ஓடும்படி செய்வதைக் குறிக்கும் மரபுத்தொடர் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: என் பகைவர்கள்
  rationale: אֹיֵב என்பதன் இயல்பான பொருள் ‘பகைவன்’; முதலாம் நபர் ஒருமை உரிமை விகுதி ‘என்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: תַּתָּה לִּי עֹרֶף
  choice: எனக்குப் புறமுதுகு காட்டச் செய்தீர்
  rationale: சொல்லுக்கு சொல் வடிவில் ‘எனக்குப் பின்கழுத்தைக் கொடுத்தீர்’ என்று வரும். இச்சூழலில் עֹרֶף என்பது பகைவர்கள் தோற்று, திரும்பி ஓடுவதைக் குறிக்கும் மரபுத்தொடர். இயல்பான நவீன தமிழில் அதன் பொருளையும் காட்சியையும் ‘புறமுதுகு காட்டச் செய்தீர்’ என்பதன் மூலம் தக்கவைத்துள்ளது.
- source_word: מְשַׂנְאַי
  choice: என்னை வெறுத்தவர்கள்
  rationale: שׂנא வினையின் பெயரெச்ச வடிவம், பேச்சாளரை வெறுப்பவர்களைக் குறிக்கிறது; கவிதையின் இறந்தகாலச் சூழலுக்கு ஏற்ப ‘வெறுத்தவர்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: וָאַצְמִיתֵם
  choice: நான் அழித்தொழித்தேன்
  rationale: Hiphil வடிவிலுள்ள צמת முற்றிலும் அழித்தல் அல்லது முடிவுக்குக் கொண்டுவருதல் என்ற வலுவான பொருளைக் கொண்டது. ‘அழித்தொழித்தேன்’ அந்த வலிமையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது. கடவுளை நோக்கிய இரண்டாம் நபர் ஒருமைக்கு மரியாதை வடிவமான ‘செய்தீர்’ பயன்படுத்தப்பட்டுள்ளது; எபிரெய மரபுத்தொடரின் நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
