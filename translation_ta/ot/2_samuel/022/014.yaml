source:
  edition: WLC
  text: יַרְעֵ֥ם מִן שָׁמַ֖יִם יְהוָ֑ה וְ/עֶלְי֖וֹן יִתֵּ֥ן קוֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/014.yaml
  text: Yahweh thundered from heaven[a], and the Most High gave his voice.
translation:
  language: ta
  text: யாவே வானத்திலிருந்து இடிமுழங்கினார்; உன்னதமானவர் தமது குரலை ஒலிக்கச் செய்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படி, “தமது குரலைக் கொடுத்தார்.” இது “இடிமுழங்கினார்” என்பதற்கு இணையாக அமைந்த கவிதைச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְעֵם
  choice: இடிமுழங்கினார்
  rationale: רעם என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் இடியை உண்டாக்குதல் அல்லது இடிபோல் முழங்குதல் என்பதைக் குறிக்கிறது. ‘இடிமுழங்கினார்’ என்பது புயல்-இறைத்தோற்றப் படிமத்தையும் தமிழின் இயல்பான கவிதை நடையையும் காக்கிறது.
- source_word: מִן שָׁמַיִם
  choice: வானத்திலிருந்து
  rationale: שָׁמַיִם என்பது ‘வானம்/வானங்கள்’ அல்லது ‘ஆகாயம்’ எனப் பொருள்படலாம். இங்கு இறைத்தோற்றச் சூழலில் ‘வானத்திலிருந்து’ என்பது இடத்தையும் இறையியல் நுட்பத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமமான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் வழக்கமான ‘யாவே’ என்ற ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: וְעֶלְיוֹן
  choice: உன்னதமானவர்
  rationale: עֶלְיוֹן இங்கு யாவேக்கு இணையான தெய்வீகப் பட்டமாக வருகிறது. ‘உன்னதமானவர்’ அதன் உயர்நிலைப் பொருளையும் மரியாதை நடையையும் காக்கிறது.
- source_word: יִתֵּן קוֹלוֹ
  choice: தமது குரலை எழுப்பினார்
  rationale: எபிரெயத்தில் சொற்பட ‘தமது குரலைக் கொடுத்தார்’ என இருந்தாலும், ‘குரலை எழுப்பினார்’ என்பது தமிழில் புரியக்கூடிய கவிதைச் சொற்றொடராக இருந்து, முதல் அடியிலுள்ள இடிமுழக்கத்துடனான இணைநிலையைப் பாதுகாக்கிறது. சொற்படியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது; அதைப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: יְהוָה மற்றும் עֶלְיוֹן இடையிலான உறவு
  choice: எபிரெயக் கவிதை இணைநிலையில் ஒரே கடவுளைக் குறிக்கும் பெயரும் பட்டமும் என இயல்பாக வழங்கப்பட்டது
  alternative: ‘உன்னதமானவர்’ என்பதைத் தனியான ஒருவரைக் குறிப்பதுபோல் வாசித்தல்
  rationale: இரு அரையடிகளும் இலக்கணத்திலும் கருத்திலும் இணையாக உள்ளன. இருப்பினும் மொழிபெயர்ப்பு கூடுதல் விளக்கத்தை உரைக்குள் புகுத்தாமல், பெயரையும் பட்டத்தையும் அப்படியே வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதை நடை பயன்படுத்தப்பட்டுள்ளது. ‘தமது’ என்பது தெய்வீகக் குறிப்புக்குரிய மரியாதையையும் ஒருமைச் சுட்டையும் இயல்பாகத் தருகிறது; நிறுத்தக்குறி எபிரெய இணைநிலையைத் தெளிவாக்குகிறது.
