base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/021.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: ta
  text: யாவே என் நீதிக்கேற்ப எனக்குப் பலனளிப்பார்[a]; என் கைகளின் தூய்மைக்கேற்ப[b] எனக்குக் கைம்மாறு செய்வார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னை என் நடத்தைக்கேற்ப நடத்துவார்.” எபிரெய வினைச்சொல் ஒருவருடைய நடத்தைக்கு ஏற்ப அவரை நடத்துவதையோ, அவருக்குப் பலன் அல்லது கைம்மாறு அளிப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “என் கைகளின் தூய்மை” என்பது ஒருவருடைய செயல்களில் உள்ள குற்றமின்மை அல்லது தூய்மையைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: எனக்குப் பலன் அளித்தார்
  rationale: גמל என்பது ஒருவரின் நடத்தைக்கு ஏற்ப அவரை நடத்துதல் அல்லது அவருக்குக் கைம்மாறு செய்தல் எனப் பொருள்படலாம். இங்கு இணைவரியின் ‘கைம்மாறு செய்தார்’ என்பதும் சாதகமான சூழலும் இருப்பதால், ‘பலன் அளித்தார்’ இயல்பாகப் பொருந்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைபெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כְּצִדְקָתִי
  choice: என் நீதிக்கேற்ப
  rationale: צדקה இங்கு பேசுபவரின் நேர்மையான அல்லது நீதியான நடத்தையைக் குறிக்கிறது. כְּ முன்னொட்டின் அளவு/ஒப்புமைப் பொருளை ‘-க்கேற்ப’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כְּבֹר יָדַי
  choice: என் கைகளின் தூய்மைக்கேற்ப
  rationale: בֹּר என்பதன் தூய்மை என்ற பொருளையும் ‘கைகள்’ என்ற எபிரெய உருவகத்தையும் விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: יָשִׁיב לִי
  choice: எனக்குக் கைம்மாறு செய்தார்
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் இங்கு திருப்பித் தருதல் அல்லது நடத்தைக்கு ஏற்ப ஈடு செய்தல் எனப் பொருள்படுகிறது. ‘கைம்மாறு செய்தார்’ என்பது கவிதைநடைக்கும் மறுபலன் கருத்துக்கும் ஏற்றது.
theological_decisions:
- issue: இவ்வசனம் பாவமற்ற முழுநிறைவையோ கடவுள்முன் முழுமையான தனிப்பட்ட தகுதியையோ கூறுகிறதா?
  choice: பேசுபவரின் நீதிக்கும் செயல்களின் தூய்மைக்கும் ஏற்ப யாவே அவருக்குப் பலன் அளித்தார் என்ற எபிரெய உரையின் நேரடியான கூற்றைப் பாதுகாத்தல்.
  alternative: ‘என் நீதி’ என்ற மொழியை மென்மைப்படுத்துதல் அல்லது இதை முழுமையான பாவமின்மை/தகுதியால் கிடைக்கும் இரட்சிப்பு என்று விளக்குதல்.
  rationale: எபிரெய உரை முதல் நபரில் ‘என் நீதி’, ‘என் கைகளின் தூய்மை’ என்று வெளிப்படையாகக் கூறுகிறது. மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தைத் தீர்க்காமல் பாதுகாக்கிறது; அதேவேளை, வசனம் கூறாத முழுமையான பாவமின்மை அல்லது தகுதியால் இரட்சிப்பு என்ற கோட்பாட்டையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரமான தமிழில், எளிதில் புரியும் அதேவேளை சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இரு இணைவரிகளின் ‘-க்கேற்ப’ அமைப்பு பாதுகாக்கப்பட்டுள்ளது; ‘நீதி’ மற்றும் ‘கைகளின் தூய்மை’ என்ற மூல உருவகங்கள் விளக்கமாக மாற்றப்படவில்லை.
