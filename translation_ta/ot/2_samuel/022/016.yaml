  to: 'அப்போது கடலின் நீர்வழிகள் காணப்பட்டன;


    யாவேயின்[a] அதட்டலினால்,


    அவருடைய நாசியின் மூச்சுக்காற்றின் வீச்சினால்,


    உலகத்தின்[b] அடித்தளங்கள் வெளிப்பட்டன.'
  rationale: The revision preserves the Hebrew parallelism and passive imagery while improving two expressions. ‘அதட்டல்’ gives גְּעָרָה its forceful poetic sense, and ‘நாசியின் மூச்சுக்காற்றின் வீச்சு’ more closely reflects the emphatic Hebrew image of the blast/breath of Yahweh's nostrils without converting it into an abstract reference to anger.
