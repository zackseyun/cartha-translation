revisions:
- from: 'அப்போது கடலின் நீர்வழிகள் காணப்பட்டன;

    யாவேயின்[a] கண்டிப்பினாலும்,

    அவருடைய நாசியிலிருந்து வீசிய மூச்சுக் காற்றினாலும்,

