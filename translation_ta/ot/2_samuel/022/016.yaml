  text: וַ/יֵּֽרָאוּ֙ אֲפִ֣קֵי יָ֔ם יִגָּל֖וּ מֹסְד֣וֹת תֵּבֵ֑ל בְּ/גַעֲרַ֣ת יְהוָ֔ה מִ/נִּשְׁמַ֖ת ר֥וּחַ אַפּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/016.yaml
  text: Then the channels of the sea were seen[a]; the foundations of the world were laid bare at the rebuke of Yahweh[b], at the blast of the breath of his nostrils.
translation:
  language: ta
  text: 'அப்போது கடலின் நீர்வழிகள் காணப்பட்டன;


    யாவேயின்[a] அதட்டலினால்,


    அவருடைய நாசியின் மூச்சுக்காற்றின் வீச்சினால்,


    உலகத்தின்[b] அடித்தளங்கள் வெளிப்பட்டன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவே” என்பதற்குப் பதிலாக மரபுவழியாக “கர்த்தர்” என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது “மக்கள் வாழும் உலகத்தின்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: காணப்பட்டன
  rationale: ראה என்பதன் நிஃபால் வடிவிலுள்ள செயல்பாட்டு எதிர்மறைத் தன்மையைப் பேணி, கடலின் மறைந்த பகுதிகள் பார்வைக்குத் தென்பட்டன என்ற கவித்துவப் படிமத்தை அளிக்கிறது.
- source_word: אֲפִקֵי יָם
  choice: கடலின் நீர்வழிகள்
  rationale: אֲפִיקִים என்பது நீர் பாயும் வழிகள், கால்வாய்கள் அல்லது படுகைகளைக் குறிக்கலாம். ‘நீர்வழிகள்’ என்பது ‘ஊற்றுகள்’ என்று மிகையாகக் குறிப்பாக்காமல், இன்றைய தமிழில் இயல்பாக அந்தப் பரப்பைத் தக்கவைக்கிறது.
- source_word: יִגָּלוּ
  choice: வெளிப்பட்டன
  rationale: גלה என்பதன் நிஃபால் வடிவம் மறைப்பு நீங்கி வெளிப்படுதலைக் குறிக்கிறது. இங்கு ‘வெளிப்பட்டன’ என்பது இணைவரியான ‘காணப்பட்டன’ என்பதுடன் இயல்பான கவித்துவ ஒத்திசைவை உருவாக்குகிறது.
- source_word: מֹסְדוֹת תֵּבֵל
  choice: உலகத்தின் அடித்தளங்கள்
  rationale: מֹסְדוֹת என்பது அடித்தளங்களையும் תֵּבֵל என்பது கவிதை நடையில் உலகத்தை, குறிப்பாக மக்கள் வாழும் உலகத்தை, குறிக்கக்கூடும். முதன்மை உரையில் ‘உலகம்’ இயல்பானதும் பரந்ததுமான பொருளைப் பேணுகிறது; குறுகிய சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּגַעֲרַת
  choice: கண்டிப்பினால்
  rationale: גְּעָרָה என்பது அதிகாரமிக்க கண்டிப்பு அல்லது அதட்டலைக் குறிக்கிறது. בְּ இங்கு காரணம் அல்லது கருவியைக் குறிக்கும் என்பதால் ‘-இனால்’ பொருத்தமானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பொதுவாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מִנִּשְׁמַת רוּחַ אַפּוֹ
  choice: அவருடைய நாசியிலிருந்து வீசிய மூச்சுக் காற்றினாலும்
  rationale: נְשָׁמָה, רוּחַ ஆகியவை இங்கு வலிமையான மூச்சு அல்லது காற்றின் வீச்சைப் படம்பிடிக்கின்றன; אַף என்பதன் உடல்சார் படிமமான மூக்கு/நாசி என்பதையும் தக்கவைக்கிறது. ‘கோபம்’ என அரூபமாக்காமல் எபிரெயக் கவித்துவ மனிதஉருவகத்தைப் பேணுகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பேணுகிறது.
- issue: אַף என்பதிலுள்ள ‘நாசி’ மற்றும் ‘கோபம்’ என்ற பொருள் வாய்ப்புகள்
  choice: நாசி என்ற உடல்சார் படிமத்தைப் பேணுதல்
  alternative: அவருடைய கோபத்தின் மூச்சுக் காற்று
  rationale: இந்தப் புயல்-தெய்வத்தோற்றக் கவிதையில் மூச்சு நாசியிலிருந்து வீசுவது என்ற மனிதஉருவகப் படிமம் நேரடியானது. ‘கோபம்’ என்பது சாத்தியமான விரிவுபொருளாயினும், அதை முதன்மை உரையில் தேர்ந்தெடுப்பது உள்ளார்ந்த படிமத்தை மறைத்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கவிதையின் உயர்ந்த, வலிமையான நடையைப் பேணும் வகையிலும் மொழிபெயர்க்கப்பட்டது. எபிரெய இணைவரி அமைப்பைத் தெளிவுபடுத்த வரிப் பிரிப்பு பயன்படுத்தப்பட்டுள்ளது; மனிதஉருவகப் படிமம் மென்மைப்படுத்தப்படவில்லை.
