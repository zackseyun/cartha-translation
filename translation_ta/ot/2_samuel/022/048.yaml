  source_fidelity: மூல எபிரேயத்தின் “அந்த தேவன்/இறைவன்,” “எனக்குப் பழிவாங்குதல்களை அளிக்கிற,” மற்றும் “மக்களை எனக்குக் கீழ் கொண்டுவருகிற” என்ற மூன்று கூறுகளும் பொருளில் பாதுகாக்கப்பட்டுள்ளன. נְקָמוֹת-இன் பன்மையும் லִי-யின் நேரடியான ‘எனக்கு’ உறவும் தக்கவைக்கப்பட்டுள்ளன. “கீழ்ப்படுத்துகிற” என்பது וּמוֹרִיד ... תַּחְתֵּנִי என்பதன் ஆதிக்க/அடக்கப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
  naturalness: “எனக்குப் பழிவாங்குதல்களை அளித்து, மக்களை எனக்குக் கீழ்ப்படுத்துகிற இறைவன்” என்பது சுருக்கமான, நவீன நிலையான தமிழில் இயல்பான கவிதைநடையாக உள்ளது. வாக்கியத்தின் இறுதியில் “இறைவன்” வருவது மூலத்தின் தொடர்புப்பெயர் அமைப்புக்கு ஏற்ற மாண்பான நடை.
  terminology: “இறைவன்” நவீனத் தமிழில் மாண்புமிக்க பொதுவான இறைச்சொல்; இவ்வசனத்தில் குறிப்பிட்ட தேவனைச் சுட்டும் சூழல் பொருளை இழக்கவில்லை. “பழிவாங்குதல்கள்” தனிப்பட்ட விரோதப் பழிவாங்கலை மென்மையாக்கவோ இறையியல் விளக்கத்தால் மாற்றவோ செய்யாமல் மூலத்தின் பலவசன ‘vengeances’ கருத்தைத் தக்கவைக்கிறது.
