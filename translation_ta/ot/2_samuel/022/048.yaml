  yaml_path: translation/ot/2_samuel/022/048.yaml
  text: the God who gives vengeance to me and brings peoples down under me.
translation:
  language: ta
  text: எனக்குப் பழிவாங்குதல்களை அளித்து, மக்களை எனக்குக் கீழ்ப்படுத்துகிற இறைவன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵל
  choice: இறைவன்
  rationale: குறிப்பிட்ட ஒரே கடவுளைக் குறிக்கும் எபிரேயச் சொல்லை இயல்பான, மாண்புமிக்க நவீனத் தமிழில் தருகிறது.
- source_word: הַנֹּתֵן נְקָמֹת לִי
  choice: எனக்குப் பழிவாங்குதல்களை அளித்து
  rationale: நְקָמוֹת என்பதன் பன்மை வடிவத்தையும், לִי என்பதன் நேரடியான ‘எனக்கு’ என்ற உறவையும் பாதுகாக்கிறது; ‘எனக்காக’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: וּמוֹרִיד עַמִּים תַּחְתֵּנִי
  choice: மக்களை எனக்குக் கீழ்ப்படுத்துகிற
  rationale: சொற்சொல்லாக ‘மக்களை எனக்குக் கீழே இறக்குகிற’ என்ற உருவகத்தின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; עַמִּים என்பதன் பன்மை/கூட்டுப்பொருள் ‘மக்கள்’ என்பதில் நிலைக்கிறது.
theological_decisions:
- issue: தெய்வீகப் பழிவாங்குதலில் לִי என்பதன் பங்கு
  choice: எனக்குப் பழிவாங்குதல்களை அளித்து
  alternative: எனக்காகப் பழிவாங்கி
  rationale: மூலத்தில் உள்ள ‘எனக்கு’ என்ற இலக்கண உறவையும் அதன் சாத்தியமான இறையியல் பதற்றத்தையும் விளக்கி நீக்காமல் பாதுகாக்கிறது.
- issue: மக்கள் கீழ்ப்படுத்தப்படுதல்
  choice: மக்களை எனக்குக் கீழ்ப்படுத்துகிற
  alternative: மக்களை என் காலடியில் வீழ்த்துகிற
  rationale: மூல உருவகத்தின் ஆதிக்கப் பொருளைத் தருகிறது; ‘காலடியில்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத உடற்கூறு படிமத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; சுருக்கமான கவிதைநடை மற்றும் dignified வேதாகமத் தொனி. மூலத்தின் பங்கேற்பெயர் அமைப்பைத் தமிழில் தொடர்பெயரெச்சங்களால் இயல்பாகத் தொடர்கிறது.
