base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/020.yaml
  text: He brought me out into a broad place[a]; he rescued me[b], because he delighted in me.
translation:
  language: ta
  text: அவர் என்னை விசாலமான இடத்திற்குக் கொண்டுவந்தார்[a]; என்னை விடுவித்தார், ஏனெனில் அவர் என்னில் மகிழ்ச்சி கொண்டார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அகன்ற இடத்திற்கு’ / ‘திறந்த வெளிக்கு.’ எபிரெயப் படிமம் நெருக்கடி அல்லது அடைப்புக்கு மாறான விடுதலையையும் நிம்மதியையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர் என்னில் பிரியம் கொண்டார்’ / ‘அவர் என்னில் திருப்தியடைந்தார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: அவர் என்னைக் கொண்டுவந்தார்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே கொண்டுவருதல்’ என்ற காரணவினைப் பொருளைக் கொண்டது. தமிழில் இயல்பாக அமையவும் விடுதலைப் படிமத்தைத் தக்கவைக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: לַמֶּרְחָב
  choice: விசாலமான இடத்திற்கு
  rationale: מֶרְחָב என்பது நெருக்கடி அல்லது அடைப்புக்கு எதிரான அகன்ற, திறந்த வெளியைக் குறிக்கிறது. ‘விசாலமான இடம்’ அந்த எபிரெயப் படிமத்தைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: יְחַלְּצֵנִי
  choice: என்னை மீட்டார்
  rationale: חלץ என்பதன் பியேல் வடிவம் ‘வெளியே இழுத்தல், விடுவித்தல், மீட்டல்’ என்று பொருள்படும். ‘மீட்டார்’ என்பது இங்கு இயல்பான தமிழாகவும் முந்தைய வரிக்கு இணையான விடுதலைச் செயலாகவும் அமைகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: மீட்புக்கான காரணத்தை அறிமுகப்படுத்துவதால் காரணப் பொருளைத் தெளிவாகக் காட்டும் ‘ஏனெனில்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: חָפֵץ בִּי
  choice: அவர் என்னில் மகிழ்ந்தார்
  rationale: חפץ உடன் ב வரும்போது ஒருவரில் மகிழ்ச்சி அல்லது விருப்பம் கொள்ளுதல் என்ற தனிப்பட்ட உறவுப் பொருள் உண்டு. ‘என்னில் மகிழ்ந்தார்’ அந்த உணர்வுசார் வலிமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: தெய்வீக மீட்புக்கான காரணம்
  choice: ஏனெனில் அவர் என்னில் மகிழ்ந்தார்
  alternative: ஏனெனில் அவர் என்னைக் குறித்து பிரியமாயிருந்தார்
  rationale: தாவீதின் மீட்பை இறைவன் அவரில் கொண்ட மகிழ்ச்சியுடன் வசனம் நேரடியாக இணைக்கிறது. இதைத் தக்கவைத்தபோதும், தகுதி அல்லது புண்ணியம் குறித்த வசனத்திற்கு அப்பாற்பட்ட கோட்பாட்டை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கவிதை இணைநிலையும் எபிரெய மூலத்தின் இடவெளி–விடுதலைப் படிமமும் காக்கப்பட்டுள்ளன.
