revisions:
- from: அவர் என்னை விசாலமான இடத்திற்குக் கொண்டுவந்தார்[a]; என்னை மீட்டார், ஏனெனில் அவர் என்னில் மகிழ்ந்தார்[b].
  to: அவர் என்னை விசாலமான இடத்திற்குக் கொண்டுவந்தார்[a]; என்னை விடுவித்தார், ஏனெனில் அவர் என்னில் மகிழ்ச்சி கொண்டார்[b].
  rationale: 'The revision keeps every element of the Hebrew verse and its poetic progression: being brought out into openness, being delivered, and the reason grounded in divine delight. It improves modern Tamil idiom and clarifies the immediate deliverance sense without narrowing or doctrinally interpreting the source.'
