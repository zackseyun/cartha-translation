  terminology: ‘யாவே’ என்பது יהוה-வின் தனிப்பெயர் ஒலிபெயர்ப்பாகத் தொடர்ந்து பயன்படுத்தப்பட்டுள்ளது. ‘வாக்கு,’ ‘புடமிடப்பட்டது,’ ‘கேடயம்,’ ‘அடைக்கலம்’ ஆகியவை மூலச் சொற்களின் பொருள்வீச்சையும் உருவகங்களையும் தக்கவைக்கின்றன.
