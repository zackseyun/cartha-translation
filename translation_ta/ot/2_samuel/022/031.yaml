source:
  edition: WLC
  text: הָ/אֵ֖ל תָּמִ֣ים דַּרְכּ֑/וֹ אִמְרַ֤ת יְהוָה֙ צְרוּפָ֔ה מָגֵ֣ן ה֔וּא לְ/כֹ֖ל הַ/חֹסִ֥ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/031.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is proven; he is a shield to all who take refuge in him.
translation:
  language: ta
  text: 'தேவனைப் பொறுத்தவரை, அவருடைய வழி குற்றமற்றது;

    யாவேயின் வாக்கு புடமிடப்பட்டது[a];

    அவரிடம் அடைக்கலம் புகும் அனைவருக்கும் அவர் கேடயம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சோதிக்கப்பட்டு மெய்ப்பிக்கப்பட்டது.” எபிரெயச் சொல், உலோகத்தை நெருப்பில் புடமிட்டுத் தூய்மைப்படுத்தும் உருவகத்தைத் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: தேவனைப் பொறுத்தவரை
  rationale: வாக்கியத் தொடக்கத்தில் தேவனைத் தலைப்பாக முன்னிறுத்தும் எபிரெய அமைப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: תָּמִים דַּרְכּוֹ
  choice: அவருடைய வழி குற்றமற்றது
  rationale: תָּמִים என்பது இங்கு குறைபாடோ பழுதோ இல்லாத தன்மையைக் குறிக்கிறது; ‘குற்றமற்றது’ என்பது தேவனுடைய செயல்முறையின் நேர்மையையும் முழுமையையும் தெளிவாகக் காட்டுகிறது.
- source_word: אִמְרַת יְהוָה
  choice: யாவேயின் வாக்கு
  rationale: אִמְרָה என்பதன் சொல்/உரை/வாக்கு என்ற பரந்த பொருளை ‘வாக்கு’ காக்கிறது; יהוה தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: צְרוּפָה
  choice: புடமிடப்பட்டது
  rationale: உலோகத்தை நெருப்பில் புடமிட்டுத் தூய்மையையும் தரத்தையும் உறுதிப்படுத்தும் மூல உருவகத்தை நேரடியாகக் காக்கிறது; சோதிக்கப்பட்டு நம்பத்தக்கதென நிரூபிக்கப்பட்டது என்ற விளைவும் இதில் அடங்குகிறது.
- source_word: מָגֵן הוּא
  choice: அவர் கேடயம்
  rationale: எபிரெய பெயர்ச்சொல் வாக்கியத்தின் சுருக்கத்தையும் பாதுகாப்பைக் குறிக்கும் கேடய உருவகத்தையும் இயல்பாகப் பேணுகிறது.
- source_word: לְכֹל הַחֹסִים בּוֹ
  choice: அவரிடம் அடைக்கலம் புகும் அனைவருக்கும்
  rationale: חסה என்பதிலுள்ள பாதுகாப்பை நாடி ஒதுங்கும் தெளிவான உருவகத்தை, வெறும் ‘நம்புதல்’ எனப் பொதுமைப்படுத்தாமல் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: צְרוּפָה என்ற சொல்லின் உலோகப் புடமிடும் உருவகம்
  choice: புடமிடப்பட்டது
  alternative: சோதிக்கப்பட்டு மெய்ப்பிக்கப்பட்டது
  rationale: மூல உருவகத்தைப் பாதுகாக்கிறது; அதே நேரத்தில் வாக்கு நம்பத்தக்கதெனக் கண்டறியப்பட்டது என்ற கருத்தை அடிக்குறிப்பு விளக்குகிறது.
- issue: தெய்வீகப் பாதுகாப்பின் உருவகம்
  choice: அவர் கேடயம்
  alternative: அவர் பாதுகாப்பவர்
  rationale: மூலத்தின் கவித்துவ உருவகத்தை விளக்கவுரையாக மாற்றாமல் அப்படியே பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மூன்று இணையான கூறுகளும் அரைப்புள்ளிகளால் தெளிவாகப் பிரிக்கப்பட்டுள்ளன; ‘அடைக்கலம்’ மற்றும் ‘கேடயம்’ ஆகிய பாதுகாப்பு உருவகங்கள் காக்கப்பட்டுள்ளன.
