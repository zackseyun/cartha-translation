  source_fidelity: மூல எபிரெயத்தின் மூன்று இணைக் கூறுகளும் துல்லியமாகக் காக்கப்பட்டுள்ளன. הָאֵל-இன் தலைப்பாக்கும் தொடக்கம் ‘தேவனைப் பொறுத்தவரை’ எனவும், תָּמִים ‘குற்றமற்றது’ எனவும், צְרוּפָה-வின் உலோகப் புடமிடும் உருவகம் ‘புடமிடப்பட்டது’ எனவும் பொருத்தமாகத் தரப்பட்டுள்ளன. ‘அவரிடம் அடைக்கலம் புகும்’ என்பது הַחֹסִים בּוֹ-வின் புகலிட உருவகத்தைப் பேணுகிறது.
