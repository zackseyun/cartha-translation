  yaml_path: translation/ot/2_samuel/022/008.yaml
  text: Then the earth reeled and quaked; the foundations of the heavens trembled and shook, because he was angry.
translation:
  language: ta
  text: அப்போது பூமி தள்ளாடி அதிர்ந்தது; வானங்களின் அடித்தளங்கள் நடுங்கிக் குலுங்கின; ஏனெனில் அவர் கோபமடைந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַשׁ
  choice: தள்ளாடி அதிர்ந்தது
  rationale: ரעשׁ என்பதன் அதிர்தல்/குலுங்குதல் கருத்தையும், இதற்கு முன் உள்ள கெதீவ் வடிவமான ותגעשׁ சுட்டும் தள்ளாடுதல்/கொந்தளித்தல் நுணுக்கத்தையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: מוֹסְדוֹת הַשָּׁמַיִם
  choice: வானங்களின் அடித்தளங்கள்
  rationale: மசோரா உரையின் பன்மை வடிவங்களையும் பண்டைய உலகக் காட்சியின் உருவகத்தையும் முறையாகப் பாதுகாக்கிறது.
- source_word: יִרְגָּזוּ וַיִּתְגָּעֲשׁוּ
  choice: நடுநடுங்கி அசைந்தன
  rationale: இரு இணை வினைகளையும் தனித்தன்மையுடன், ஆனால் தமிழில் இயல்பான தொடராக வழங்குகிறது.
- source_word: כִּי חָרָה לוֹ
  choice: ஏனெனில் அவர் கோபமடைந்தார்
  rationale: மூலத்தின் சொற்றொடர் நேரடியாக 'அவருக்கு எரிந்தது' என்றாலும், சூழலில் அது கோபம் மூண்டதைக் குறிக்கும் இயல்பான எபிரேய மரபுத்தொடர்.
theological_decisions:
- issue: கோபப்படுபவரின் அடையாளம்
  choice: அவர்
  alternative: கர்த்தர்
  rationale: இவ்வசனத்தில் பெயர் மீண்டும் வராமல் ஆண்பால் ஒருமை சுட்டுப்பெயர் மட்டுமே உள்ளது; முந்தைய சூழல் இறைவனைச் சுட்டினாலும், மூலத்தின் வெளிப்பாட்டு முறையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைநயம் மற்றும் பேரண்ட அதிர்வின் வலிமையைப் பேணும் கண்ணியமான நடை. தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன.
