  edition: WLC
  text: וַ/יָּ֥קָם דָּוִ֖ד בַּ/בֹּ֑קֶר וּ/דְבַר יְהוָ֗ה הָיָה֙ אֶל גָּ֣ד הַ/נָּבִ֔יא חֹזֵ֥ה דָוִ֖ד לֵ/אמֹֽרפ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/011.yaml
  text: When David arose in the morning[a], the word of Yahweh had come to Gad the prophet, David’s seer, saying,
translation:
  language: ta
  text: 'தாவீது காலையில் எழுந்தபோது, யாவேயின் வார்த்தை தாவீதின் தரிசனக்காரரான காத் இறைவாக்கினரிடம் வந்திருந்தது[a]; இவ்வாறு கூறி:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சார்ந்த மொழிபெயர்ப்பு: “யாவேயின் வார்த்தை காதுக்கு இருந்தது.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם דָּוִד בַּבֹּקֶר
  choice: தாவீது காலையில் எழுந்தபோது
  rationale: קום என்பதன் தொடர்நிகழ்வு வடிவத்தையும், בַּבֹּקֶר என்பதன் காலக் குறிப்பையும் இயல்பான தமிழ் கதைநடையில் தருகிறது.
- source_word: וּדְבַר יְהוָה
  choice: யாவேயின் வார்த்தை
  rationale: தீர்க்கதரிசன வெளிப்பாட்டைக் குறிக்கும் நிலையான சொற்றொடரைத் தக்கவைத்து, יהוה என்ற உடன்படிக்கைப் பெயரை ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
- source_word: הָיָה אֶל
  choice: இடம் வந்திருந்தது
  rationale: சொல்லுக்குச் சொல் ‘இடம் இருந்தது’ என்றாலும், தீர்க்கதரிசனச் சூழலில் இறைவார்த்தை ஒருவரிடம் வருவதைக் குறிக்கும் மரபுத்தொடர். தாவீது எழுவதற்கு முன்பே இது நிகழ்ந்திருக்கலாம் என்பதால் ‘வந்திருந்தது’ என இறந்தகால முன்நிகழ்வு சாயல் பாதுகாக்கப்படுகிறது.
- source_word: גָּד הַנָּבִיא
  choice: காத் என்னும் இறைவாக்கினர்
  rationale: גָּד என்பதை ‘காத்’ என ஒலிபெயர்த்து, נָבִיא என்பதை நவீன வாசகருக்குத் தெளிவான ‘இறைவாக்கினர்’ என வழங்குகிறது.
- source_word: חֹזֵה דָוִד
  choice: தாவீதின் தரிசனக்காரர்
  rationale: חֹזֶה என்ற தனிப்பட்ட பதவிச்சொல்லை ‘இறைவாக்கினர்’ என்பதோடு ஒன்றாக்காமல், தாவீதுடன் உள்ள உறவையும் கட்டமைப்பையும் காக்கிறது.
- source_word: לֵאמֹר
  choice: 'யாவே கூறியது:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் செயல்பாட்டைத் தெளிவான தமிழ் தொடரால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக உள்ள நான்கெழுத்து உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல், பரவலாக ஏற்கப்பட்ட ஒலிப்புக்கு நெருக்கமாகத் தமிழில் தருகிறது.
- issue: הָיָה אֶל என்பதன் காலமும் பொருளும்
  choice: வந்திருந்தது
  alternative: இடம் இருந்தது / வந்தது
  rationale: தாவீது காலையில் எழுந்தபோது காதுக்கு வார்த்தை ஏற்கெனவே வந்திருந்ததாக வாசிக்கக்கூடிய முன்நிகழ்வு சாயலைப் பாதுகாக்கிறது; எபிரெய மரபுத்தொடரின் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க தமிழ் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இறைவாக்கினர்’ மற்றும் ‘தரிசனக்காரர்’ ஆகிய இரு வேறுபட்ட எபிரெயப் பதவிச்சொற்களும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன. வசனம் அடுத்த வசனத்தின் நேரடிக் கூற்றை அறிமுகப்படுத்துவதால் இரட்டைப்புள்ளியுடன் முடிகிறது.
