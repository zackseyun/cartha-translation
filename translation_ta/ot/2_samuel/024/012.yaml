source:
  edition: WLC
  text: הָל֞וֹךְ וְ/דִבַּרְתָּ֣ אֶל דָּוִ֗ד כֹּ֚ה אָמַ֣ר יְהוָ֔ה שָׁלֹ֕שׁ אָנֹכִ֖י נוֹטֵ֣ל עָלֶ֑י/ךָ בְּחַר לְ/ךָ֥ אַֽחַת מֵ/הֶ֖ם וְ/אֶֽעֱשֶׂה לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/012.yaml
  text: 'Go and speak to David[a], ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: ta
  text: 'நீ போய் தாவீதிடம் கூறு: ‘யாவே இவ்வாறு கூறுகிறார்: நான் மூன்றை[a] உன்மேல் வைக்கிறேன். அவற்றில் ஒன்றை உனக்காகத் தேர்ந்தெடு; அதை உனக்குச் செய்வேன்.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘மூன்று’ என்று மட்டும் உள்ளது; பெயர்ச்சொல் சூழலிலிருந்து புரிந்துகொள்ளப்படுகிறது. ‘மூன்று காரியங்களை’ அல்லது ‘மூன்று தெரிவுகளை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ וְדִבַּרְתָּ
  choice: நீ போய் ... சொல்
  rationale: இன்ஃபினிட்டிவ் அப்சலூட் மற்றும் வினைமுற்றின் சேர்க்கை கட்டளையை வலியுறுத்துகிறது; நவீனத் தமிழில் இயல்பான கட்டளைத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: כֹּה אָמַר יְהוָה
  choice: யெகோவா இவ்வாறு கூறுகிறார்
  rationale: தீர்க்கதரிசனத் தூதர் சூத்திரத்தின் முறையான ஓசையைப் பேணுகிறது; יהוה என்பது தனிப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: שָׁלֹשׁ
  choice: மூன்றை
  rationale: எபிரெயத்தில் பெயர்ச்சொல் இல்லாமல் ‘மூன்று’ என்ற எண் மட்டும் உள்ளது. தமிழிலும் பொருளைச் சூழல் உணர்த்துவதால், ‘காரியங்கள்’ அல்லது ‘தெரிவுகள்’ என்று விளக்கமாகச் சேர்க்காமல் தெளிவின்மையைப் பேண முடிகிறது.
- source_word: אָנֹכִי נוֹטֵל עָלֶיךָ
  choice: நான் ... உன்முன் வைக்கிறேன்
  rationale: சூழலில் தாவீது தேர்ந்தெடுக்க வேண்டிய மூன்று சாத்தியங்களை முன்வைப்பதே கருத்து; இயல்பான தமிழில் இதை வெளிப்படுத்துகிறது. எபிரெயச் சொற்றொடரில் ‘உன்மேல் வைக்கிறேன்’ என்ற தீர்ப்பின் பாரமும் கேட்கக்கூடும்.
- source_word: בְּחַר לְךָ אַחַת מֵהֶם
  choice: அவற்றில் ஒன்றை உனக்காகத் தேர்ந்தெடு
  rationale: பகுதிப்பொருளான ‘அவற்றில் ஒன்று’ என்பதையும், לְךָ காட்டும் தனிப்பட்ட தேர்வு மற்றும் பொறுப்பையும் பேணுகிறது.
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: அதை நான் உனக்குச் செய்வேன்
  rationale: לְךָ என்பதன் இலக்கண வடிவை நெருக்கமாகப் பேணுகிறது; சூழல் இதை நன்மையாக அல்ல, தாவீதின்மேல் நிறைவேற்றப்படும் தீர்ப்பாகத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைத் தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பான ‘யெகோவா’ பயன்படுத்தப்பட்டது.
- issue: மூன்று என்பவை தெரிவுகளா அல்லது தண்டனைகளா
  choice: பெயர்ச்சொல் சேர்க்காமல் ‘மூன்றை’
  alternative: மூன்று காரியங்களை / மூன்று தெரிவுகளை
  rationale: இந்த வசனத்தில் எபிரெயம் வெறும் எண்ணையே தருகிறது. அடுத்த வசனம் அவற்றை விளக்கும் வரை, அவற்றின் தன்மையை இங்கேயே தீர்மானித்து விடாமல் மூலத்தின் சுருக்கத்தையும் இறுக்கத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் அதேவேளையில் தீர்க்கதரிசன அறிவிப்புக்குரிய கண்ணியமும் முறையான ஓசையும் பேணப்பட்டுள்ளன. ‘உன்முன்’ மற்றும் ‘உனக்காக’ ஆகியவை தெளிவிற்காகப் பிரித்து எழுதப்பட்டுள்ளன.
