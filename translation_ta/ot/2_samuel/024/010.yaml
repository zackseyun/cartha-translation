base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/010.yaml
  text: After that[a], David’s heart struck him after he had counted the people. And David said to Yahweh, “I have sinned greatly in what I have done. And now, Yahweh, please take away the guilt of your servant[c][b], for I have acted very foolishly.”
translation:
  language: ta
  text: மக்களை எண்ணிய பிறகு[a], தாவீதின் மனசாட்சி அவரை உறுத்தியது[b]. தாவீது யாவேயிடம், “நான் செய்ததில் பெரிதும் பாவம் செய்துவிட்டேன். இப்போது, யாவே, உமது அடியானின் குற்றப்பழியை[c] நீக்கிவிடுமாறு வேண்டுகிறேன்; ஏனெனில் நான் மிகவும் மதியீனமாக நடந்துகொண்டேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களைக் கணக்கெடுத்த பிறகு.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொற்பொருளாக, “தாவீதின் இதயம் அவரைத் தாக்கியது”; இது உள்ளார்ந்த குற்றவுணர்வை அல்லது மனசாட்சி உறுத்துவதை வெளிப்படுத்தும் மொழிவழக்கு.
    reason: cultural_note
  - marker: c
    text: அல்லது, “அக்கிரமத்தை.” எபிரெயச் சொல் அக்கிரமம், குற்றப்பழி, சில வேளைகளில் பாவத்தால் வரும் தண்டனை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: தாவீதின் மனசாட்சி அவரை உறுத்தியது
  rationale: எபிரெய மொழிப்படிமம் சொற்பொருளாக ‘தாவீதின் இதயம் அவரைத் தாக்கியது’ என்பதாகும். அதன் சூழல்சார் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்த ‘மனசாட்சி அவரை உறுத்தியது’ என மொழிபெயர்க்கப்பட்டு, மூலப்படிமம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: סָפַר אֶת־הָעָם
  choice: மக்களை எண்ணிய
  rationale: סָפַר என்பதன் அடிப்படைப் பொருளான ‘எண்ணுதல்’ நேரடியாகவும் தெளிவாகவும் தரப்படுகிறது; அரசாங்கக் கணக்கெடுப்பு என்ற சூழல்சார் மாற்றுப் பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: חָטָאתִי מְאֹד אֲשֶׁר עָשִׂיתִי
  choice: நான் செய்த இந்தச் செயலால் பெரிதும் பாவம் செய்துவிட்டேன்
  rationale: பாவ அறிக்கையையும் מְאֹד என்ற வலியுறுத்தலையும் காக்கிறது; தொடர்புச் சொற்றொடரை இயல்பான தமிழில் காரண/செயல் தொடர்பாக வெளிப்படுத்துகிறது.
- source_word: הַעֲבֶר נָא
  choice: நீக்கிவிட வேண்டுகிறேன்
  rationale: குற்றத்தை அகற்றும்படி செய்யும் வேண்டுதலை நவீன, மரியாதையான தமிழில் தெரிவிக்கிறது; נא என்பதன் வேண்டுகோள் நயமும் காக்கப்படுகிறது.
- source_word: עֲוֺן עַבְדְּךָ
  choice: உமது அடியானின் குற்றத்தை
  rationale: עָוֹן குற்றச்செயல், குற்றநிலை அல்லது அதன் தண்டனை ஆகிய தொடர்புடைய பொருள்களைக் கொள்ளலாம். இங்கு பாவ அறிக்கையைத் தொடரும் மன்னிப்பு வேண்டுதலில் ‘குற்றம்’ அந்தப் பொருள் அகலத்தை ஓரளவு காக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: כִּי נִסְכַּלְתִּי מְאֹד
  choice: ஏனெனில் நான் மிகவும் மதியீனமாக நடந்துகொண்டேன்
  rationale: நிஃபால் வினையின் ‘மூடத்தனமாக/விவேகமின்றி நடத்தல்’ என்ற செயற்பொருளையும் מְאֹד என்ற தீவிரத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக இருப்பதால், பட்டமாக மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: עָוֹן என்பதன் பொருள்
  choice: குற்றம்
  alternative: அக்கிரமம்; குற்றப்பழி; தண்டனை
  rationale: தாவீது பாவத்தை அறிக்கையிட்டு அதை நீக்கும்படி வேண்டுவதால், ‘குற்றம்’ என்பது நெறிசார் செயலும் அதனால் உண்டான குற்றநிலையும் இடையிலுள்ள மூலத்தின் பொருள் நெருக்கத்தைத் தக்கவைக்கிறது. சொல்லின் பிற சாத்தியங்கள் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
- issue: இதயம் தாக்கியது என்ற எபிரெய மொழிப்படிமம்
  choice: மனசாட்சி அவரை உறுத்தியது
  alternative: தாவீதின் இதயம் அவரைத் தாக்கியது
  rationale: இது உள்ளார்ந்த குற்றவுணர்வைக் குறிக்கும் மொழிவழக்கு. பிரதான உரையில் புரியக்கூடிய தமிழ்ப் பொருள் தரப்பட்டாலும், மூலப்படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தாவீதின் வேண்டுதலில் மரியாதை காட்ட ‘உமது’, ‘அடியான்’ ஆகிய சொற்கள் வைக்கப்பட்டுள்ளன. அரிதான பழமொழிநடை தவிர்க்கப்பட்டு, எபிரெய மொழிப்படிமமும் பொருள் தெளிவின்மையும் அடிக்குறிப்புகள் வழியாகப் பாதுகாக்கப்பட்டுள்ளன.
