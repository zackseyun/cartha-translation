base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/025.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings[a]. So Yahweh responded to the land[c][b], and the plague was restrained from Israel.
translation:
  language: ta
  text: அங்கே தாவீது யாவேக்கு ஒரு பலிபீடத்தைக் கட்டி, தகனபலிகளையும் சமாதானபலிகளையும்[a] செலுத்தினார். அப்போது யாவே நாட்டிற்காகச் செய்யப்பட்ட மன்றாட்டை ஏற்றுக்கொண்டார்[b]; இஸ்ரவேலின்மேல் இருந்த கொள்ளைநோய் நிறுத்தப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “உறவுப் பலிகளையும்”; இவை பலியுணவில் பங்குகொள்ளுதலுடன் தொடர்புடைய பலிகள்.'
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொற்றொடரை, “யாவே நாட்டிற்காகச் செய்யப்பட்ட மன்றாட்டுக்குச் சாதகமாகப் பதிலளித்தார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן שָׁם דָּוִד
  choice: அங்கே தாவீது ... கட்டி
  rationale: எபிரெயக் கதைநடையின் இடச்சுட்டியையும் தொடர்ச்சியையும் இயல்பான தமிழில் தருகிறது.
- source_word: מִזְבֵּחַ לַיהוָה
  choice: யாவேக்கு ஒரு பலிபீடம்
  rationale: מִזְבֵּחַ என்பதற்கான நிலையான தமிழ் வேதாகமச் சொல் ‘பலிபீடம்’; לְ அர்ப்பணிப்பு/உரியதன்மையைக் குறிக்கிறது; יהוה தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיַּעַל עֹלוֹת
  choice: தகனபலிகளைச் செலுத்தினார்
  rationale: עלה என்பதன் பலியிடும் வழக்குப் பொருளை ‘செலுத்தினார்’ இயல்பாகத் தருகிறது; עֹלוֹת என்பது முழுவதும் எரிக்கப்படும் பலிவகையைக் குறிக்கிறது.
- source_word: וּשְׁלָמִים
  choice: சமாதானபலிகள்
  rationale: שְׁלָמִים என்ற பலிவகைக்கான மரபான, சுருக்கமான மொழிபெயர்ப்பு; அதன் உறவு/விருந்து சார்ந்த அம்சத்தை அடிக்குறிப்பு காட்டுகிறது.
- source_word: וַיֵּעָתֵר יְהוָה לָאָרֶץ
  choice: யாவே நாட்டுக்காகச் செய்யப்பட்ட மன்றாட்டுக்கு இரங்கினார்
  rationale: עתר என்பதன் நிஃபால் வடிவில் உள்ள மன்றாட்டுக்கு இணங்கும் சாதகமான பதிலை வெளிப்படுத்துகிறது; לָאָרֶץ என்பதை ‘நாட்டுக்காக’ எனத் தருகிறது. மூலத்தில் மன்றாடியவர் இவ்விடத்தில் வெளிப்படையாகக் குறிப்பிடப்படாததால் செயப்பாட்டு அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: וַתֵּעָצַר הַמַּגֵּפָה מֵעַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல் இருந்த கொள்ளைநோய் நிறுத்தப்பட்டது
  rationale: Niphal செயப்பாட்டு நுணுக்கத்தைப் பேணுகிறது; מֵעַל என்பதன் ‘மேலிருந்து அகற்றப்படுதல்’ சார்ந்த பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைத் தனிப்பெயரைப் பொதுப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: וַיֵּעָתֵר יְהוָה לָאָרֶץ என்பதிலுள்ள இறைப் பதிலின் தன்மை
  choice: யாவே நாட்டுக்காகச் செய்யப்பட்ட மன்றாட்டுக்கு இரங்கினார்
  alternative: யாவே நாட்டுக்குச் சாதகமாகப் பதிலளித்தார்
  rationale: வினைச்சொல்லில் உள்ள மன்றாட்டுக்கு இணங்குதல் என்ற பொருளைப் பேணுகிறது; அதேவேளை மன்றாட்டின் சொற்களையோ மன்றாடியவரையோ வசனத்திற்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘பலிபீடம்’, ‘தகனபலி’, ‘சமாதானபலி’ ஆகிய நிலையான வழிபாட்டுச் சொற்கள் துல்லியத்திற்காகத் தக்கவைக்கப்பட்டுள்ளன; கடினமான எபிரெயச் சொற்றொடர் இயல்பாக்கப்பட்டாலும் அதன் மன்றாட்டு சார்ந்த உட்பொருள் மறைக்கப்படவில்லை.
