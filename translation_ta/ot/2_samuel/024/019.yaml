  text: So David went up according to the word of Gad, just as Yahweh had commanded.
translation:
  language: ta
  text: காதின் வார்த்தையின்படி, யாவே கட்டளையிட்டபடியே தாவீது மேலே சென்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: மேலே சென்றார்
  rationale: עלה என்பதன் ‘மேலே போ’ என்ற திசைநுட்பத்தை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: דָּוִד
  choice: தாவீது
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: כִּדְבַר גָּד
  choice: காத் சொன்னபடி
  rationale: כ + דבר என்பதன் ‘காத்தின் வார்த்தையின்படி’ என்ற பொருளை, சூழலில் இயல்பாகவும் தெளிவாகவும் தருகிறது; ‘வார்த்தை’ என்பதைச் சொற்படியாகச் சேர்ப்பது தமிழில் சற்றுக் கடினமாக ஒலிக்கும்.
- source_word: כַּאֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: காத்தின் சொல்லுக்கும் யெகோவாவின் கட்டளைக்கும் உள்ள துல்லியமான ஒத்திசைவை ‘படியே’ உணர்த்துகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: வினையின் ‘கட்டளையிடு’ என்ற நேரடியான பொருளைத் தக்கவைக்கிறது; தமிழ் சார்பெச்ச வடிவம் நிகழ்வுகளின் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: יהוה என்ற தனிப்பெயரைப் பட்டமாக மாற்றாமல், தமிழில் நீண்டகாலமாக அறியப்படும் பெயர்வடிவத்தில் வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள தனிப்பெயரை ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றாமல் காக்கிறது; ‘யெகோவா’ என்பது தமிழ் வாசகர்களிடையே பரவலாக அறியப்படும் வடிவம். எபிரெய உச்சரிப்பின் துல்லியமான பழங்கால வடிவம் உறுதியாகத் தெரியாததால் மாற்று வடிவமும் சாத்தியம்.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையான வேதாகம நடைக்கு ஏற்ற இயல்பான சொற்றொடர். எபிரெய வசனத்தின் வரிசையை அப்படியே பின்பற்றாமல், தமிழில் காரண–செயல் தொடர்பு தெளிவாக அமைய கட்டளை முதலில் வைக்கப்பட்டுள்ளது.
