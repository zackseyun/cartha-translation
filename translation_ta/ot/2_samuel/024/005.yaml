  to: அவர்கள் யோர்தானைக் கடந்து, காத் பள்ளத்தாக்கின்[b] நடுவிலுள்ள நகரத்தின் வலப்புறத்தில்[a] இருந்த அரோவேரில் முகாமிட்டார்கள்; யாசேரை நோக்கிச் சென்றார்கள்[c].
  rationale: இறுதி எபிரெய முன்னிடைத் தொடரின் வினை நீக்கத்தைத் தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்க ‘சென்றார்கள்’ சேர்க்கப்பட்டுள்ளது. இது யாசேரை அடைந்துவிட்டார்கள் எனக் கட்டாயப்படுத்தாமல், ‘நோக்கி’ என்ற திசைப் பொருளைப் பாதுகாக்கிறது. அரோவேர் நகரத்தின் வலப்புறத்தில் இருந்தது என்றும், அந்த நகரம் காத் பள்ளத்தாக்கின் நடுவில் இருந்தது என்றும் மூலத்தின் தொடர்பமைப்பு தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
