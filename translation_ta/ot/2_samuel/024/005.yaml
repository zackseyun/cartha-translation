  source_fidelity: திருத்தம் தேவை. தற்போதைய சொல்வரிசையில் ‘யாசேரை நோக்கி’ என்பது ‘முகாமிட்டார்கள்’ என்பதோடு இணைந்து, அவர்கள் யாசேரை நோக்கி முகாமிட்டதாகப் பொருள்படுகிறது. எபிரெயத்தின் இறுதி இணைப்புத் தொடர் யாசேரை நோக்கிய அடுத்த நகர்வைக் குறிக்கிறது; தமிழில் வினையை வெளிப்படுத்தி அதைத் தெளிவாக்க வேண்டும். ‘நகரத்தின் வலப்புறத்தில்’ என்ற இடவியல் தெளிவின்மையும் பாதுகாக்கப்படுகிறது.
  naturalness: முன்வரைவு பொதுவாக நவீனத் தமிழில் இயல்பானது. ஆனால் நீளமான இடவியல் தொடர் மற்றும் இறுதியில் வைக்கப்பட்ட ‘முகாமிட்டார்கள்’ காரணமாக வாசிப்பு மந்தமாகவும் தொடர்பு தவறாகவும் அமைகிறது. வினைத் தொடர்களைப் பிரிப்பது தெளிவான, கண்ணியமான நடை தருகிறது.
