translation_notes:
  register: நவீனத் தரத் தமிழில், பயண விவரிப்புக்கேற்ற எளிய ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சற்றே இறுக்கமான இடவியல் தொடரை முற்றிலும் மறுசீரமைக்காமல் காத்து, வாசிப்புத் தெளிவுக்காக காற்புள்ளிகள் இடப்பட்டுள்ளன; தீர்மானிக்க முடியாத புவியியல் மற்றும் சொற்பொருள் வாய்ப்புகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
