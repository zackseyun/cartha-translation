base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/005.yaml
  text: They crossed the Jordan and camped at Aroer[a], on the right side of the city that is in the middle of the valley of Gad[c][b], and toward Jazer.
translation:
  language: ta
  text: அவர்கள் யோர்தானைக் கடந்து, காத் பள்ளத்தாக்கின்[b] நடுவிலுள்ள நகரத்தின் வலப்புறத்தில்[a] இருந்த அரோவேரில் முகாமிட்டார்கள்; யாசேரை நோக்கிச் சென்றார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘நகரத்தின் வலதுபுறத்தில்.’ இதைப் புவியியல் திசையாக ‘நகரத்திற்குத் தெற்கே’ என்றும் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: ‘பள்ளத்தாக்கு’ என்பதற்கான எபிரெயச் சொல் பள்ளம், நீரோடைப் பள்ளத்தாக்கு, அல்லது பருவகால நீரோடைப் படுகை ஆகியவற்றையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது ‘யாசேருக்கு.’ எபிரெய முன்னிடைச்சொல் ஓர் இடத்தை நோக்கிய திசையையோ அந்த இடத்திற்குச் செல்லும் இயக்கத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: அவர்கள் யோர்தானைக் கடந்து
  rationale: עבר என்பதன் பயணச் சூழலுக்குரிய இயல்பான பொருள் ஓர் ஆறு அல்லது எல்லையைக் கடப்பதாகும். את குறிக்கும் நேரடிச் செயப்படுபொருள் யோர்தான் என்பதால், நவீனத் தமிழில் ‘யோர்தானைக் கடந்து’ என்பது தெளிவாக உள்ளது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது பயணத்தின்போது தங்கி முகாம் அமைப்பதைக் குறிக்கிறது. ‘முகாமிட்டார்கள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: בַעֲרוֹעֵר
  choice: அரோவேரில்
  rationale: இடப்பெயருடன் வரும் ב இங்கு பயணத்தின் தங்குமிடத்தைக் குறிக்கிறது; தமிழில் இடவேற்றுமை உருபுடன் மொழிபெயர்ப்பது இயல்பானது.
- source_word: יְמִין הָעִיר
  choice: நகரத்தின் வலப்புறத்தில்
  rationale: ימין என்பதன் நேரடிப் பொருள் ‘வலது/வலப்பக்கம்.’ இதை ‘தெற்கே’ என்று புவியியல் ரீதியாகத் தீர்மானிக்காமல், மூலத்தின் இடவியல் சொல்லாட்சியே முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר בְּתוֹךְ הַנַּחַל
  choice: பள்ளத்தாக்கின் நடுவிலுள்ள
  rationale: נחל என்பது பள்ளத்தாக்கு, பள்ளம், அல்லது பருவகால நீரோடைப் படுகை ஆகியவற்றைக் குறிக்கலாம். பொதுவாசகருக்குத் தெளிவான ‘பள்ளத்தாக்கு’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டு, பொருள் விரிவு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַגָּד
  choice: காத்
  rationale: இது காத் கோத்திரத்துடன் தொடர்புடைய நிலப்பகுதியைக் குறிக்கும் பெயராக எடுத்துக்கொள்ளப்பட்டு, ‘காத் பள்ளத்தாக்கு’ என்ற இணைப்பில் வழங்கப்பட்டுள்ளது.
- source_word: וְאֶל יַעְזֵר
  choice: யாசேரை நோக்கி
  rationale: אל என்பது இலக்கை அடைந்ததையோ அதை நோக்கிய திசையையோ குறிக்கலாம். இவ்வசனத்திலேயே யாசேரை அடைந்ததாக அதிகமாகத் தீர்மானிக்காமல், திசைப் பொருளை ‘நோக்கி’ பாதுகாக்கிறது.
