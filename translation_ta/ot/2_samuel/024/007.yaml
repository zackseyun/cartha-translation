translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பயணப் பட்டியலின் தொடர்ச்சி காக்கப்பட்டதுடன், ‘நெகேவ்’ என்பதிலுள்ள புவியியல் இருபொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
