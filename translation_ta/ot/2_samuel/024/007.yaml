base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/007.yaml
  text: They came to the fortified city of Tyre and to all the cities of the Hivites and the Canaanites[a], and they went out to the Negev of Judah, to Beersheba.
translation:
  language: ta
  text: அவர்கள் அரணமைக்கப்பட்ட தீரு நகரத்துக்கும், ஏவியர் மற்றும் கானானியரின் எல்லா நகரங்களுக்கும் வந்தார்கள். பின்பு அவர்கள் யூதாவின் நெகேவுக்குள்[a], பெயெர்செபாவுக்குப் புறப்பட்டுச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யூதாவின் தென்பகுதிக்குள்.’ எபிரெயச் சொல்லான ‘நெகேவ்’ என்பது நெகேவ் எனப்படும் குறிப்பிட்ட நிலப்பகுதியையோ, பொதுவாகத் தென்பகுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְצַר צֹר
  choice: அரண்சூழ்ந்த தீரு நகரம்
  rationale: מִבְצָר என்பது அரணமைக்கப்பட்ட இடத்தைக் குறிக்கிறது. தீருவை ஒரு தனிக் கோட்டையாக மட்டும் காட்டாமல், அதன் அரணமைந்த நகரத் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְכָל עָרֵי הַחִוִּי וְהַכְּנַעֲנִי
  choice: ஏவியர்களும் கானானியர்களும் வாழ்ந்த எல்லா நகரங்கள்
  rationale: எபிரெயத்தில் இனப்பெயர்கள் ஒருமை வடிவில் இருந்தாலும், அவை மக்களினங்களைக் கூட்டாகக் குறிக்கின்றன. நகரங்களுடனான தொடர்பை நவீன தமிழில் தெளிவுபடுத்த ‘வாழ்ந்த’ சேர்க்கப்பட்டது.
- source_word: וַיֵּצְאוּ
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: יצא என்பதன் ‘வெளியேறு/புறப்படு’ என்ற இயக்கப் பொருளையும் பயணத்தின் அடுத்த கட்டத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֶל נֶגֶב יְהוּדָה
  choice: யூதாவின் நெகேவிலுள்ள
  rationale: நֶגֶב இங்கு நிலப்பகுதியின் பெயராக இருக்கக்கூடும் என்பதால் ‘நெகேவ்’ தக்கவைக்கப்பட்டது. அடுத்து வரும் பெயெர்செபாவுடனான புவியியல் உறவு தமிழில் இயல்பாகத் தெரிவிக்க ‘இலுள்ள’ பயன்படுத்தப்பட்டது; ‘தென்பகுதி’ என்ற பொதுப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּאֵר שָׁבַע
  choice: பெயெர்செபா
  rationale: தமிழில் வழக்கிலுள்ள இவ்விடப்பெயர் வடிவம் பயன்படுத்தப்பட்டது.
