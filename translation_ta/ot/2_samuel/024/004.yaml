base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/004.yaml
  text: But the king’s word prevailed against Joab and against the commanders of the army, so Joab and the commanders of the army went out from before the king to count the people of Israel.
translation:
  language: ta
  text: ஆனால் அரசனின் கட்டளை யோவாபையும் படைத்தலைவர்களையும் எதிர்த்து மேலோங்கியது. எனவே யோவாபும் படைத்தலைவர்களும் இஸ்ரவேல் மக்களைக் கணக்கிடுவதற்காக அரசனின் முன்னிலையிலிருந்து புறப்பட்டுச் சென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱזַק דְּבַר הַמֶּלֶךְ
  choice: அரசனின் வார்த்தையே மேலோங்கியது
  rationale: חזק என்பதன் வலுப்பெறுதல்/மேலோங்குதல் என்ற உருவகத்தையும், அரசனின் கட்டளை எதிர்ப்பை வென்றது என்ற சூழலையும் காக்கிறது.
- source_word: אֶל יוֹאָב וְעַל שָׂרֵי הֶחָיִל
  choice: யோவாபுக்கும் படைத்தலைவர்களுக்கும் எதிராக
  rationale: இரு வேறுபட்ட முன்னிடைச்சொற்கள் இருந்தாலும் இச்சூழலில் இரண்டும் எதிர்ப்பு அல்லது மறுப்பைக் கடந்து அரசனின் வார்த்தை மேலோங்கியவர்களைக் குறிக்கின்றன; தமிழில் இயல்பாக ஒருங்கிணைக்கப்பட்டுள்ளது.
- source_word: שָׂרֵי הֶחָיִל
  choice: படைத்தலைவர்கள்
  rationale: இங்கு חַיִל இராணுவப் படையைக் குறிக்கிறது; שָׂרֵי என்பது அதன் தலைவர்கள் அல்லது தளபதிகள்.
- source_word: לִפְקֹד אֶת הָעָם אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களைக் கணக்கிடுவதற்காக
  rationale: פקד இச்சூழலில் மக்கள்தொகைக் கணக்கெடுப்பைச் சுட்டுகிறது; appositional ‘மக்கள், அதாவது இஸ்ரவேல்’ என்பதை இயல்பான தமிழில் ‘இஸ்ரவேல் மக்கள்’ என வழங்குகிறது.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: அரசனின் முன்னிலையிலிருந்து
  rationale: சொல்லுருவிலுள்ள ‘அரசனின் முகத்துக்கு முன்பிருந்து’ என்ற பொருளை dignified, இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: அரசனின் வார்த்தை யோவாபையும் தலைவர்களையும் எவ்வாறு பாதித்தது
  choice: எதிராக ... மேலோங்கியது
  alternative: அவர்கள்மேல் வலுப்பெற்றது / அவர்களைக் கட்டாயப்படுத்தியது
  rationale: மூலத்தின் உருவகத்தையும் யோவாபின் எதிர்ப்பு முறியடிக்கப்பட்ட பதற்றத்தையும் காக்கிறது; வெளிப்படையாகக் கூறப்படாத கட்டாயப்படுத்தலைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான வரலாற்று நடையுடன், சாதாரண வாசகருக்குப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. ‘எனவே’ என்பது இரண்டு எபிரெய வாக்கியங்களுக்கிடையிலான விளைவுறவைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
