base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/021.yaml
  text: And Araunah said[a], “Why has my lord the king come to his servant?” And David said, “To buy the threshing floor from you, to build an altar to Yahweh, so that the plague may be stopped from being upon the people.”
translation:
  language: ta
  text: அரவுனா, “என் ஆண்டவராகிய அரசர் தம் அடியானாகிய என்னிடம் ஏன் வந்திருக்கிறார்?”[a] என்று கேட்டான். அதற்கு தாவீது, “உன்னிடமிருந்து கதிரடிக்கும் களத்தை வாங்கி, யாவேக்கு ஒரு பலிபீடம் கட்டுவதற்காக; மக்கள்மேல் உள்ள கொள்ளைநோய் நிறுத்தப்படும்படி” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொற்சொல்லாக, “தம் அடியானிடம்” என்று உள்ளது. இது அரவுனா தன்னை மூன்றாம் நபரில் குறிப்பிடும் அரசவைப் பணிவுரை; பொருளில், “உங்கள் அடியானிடம்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: ஏன்
  rationale: அரசரின் வருகைக்கான காரணத்தை நேரடியாகக் கேட்கும் வினாவை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசர்
  rationale: உடைமைச் சுட்டையும் மரியாதைக்குரிய அரசவைக் குறிப்பையும் பாதுகாக்கிறது.
- source_word: עַבְדּוֹ
  choice: தம் அடியான்
  rationale: எபிரெய மூன்றாம் நபர் தற்சுட்டு அரசவைப் பணிவுரையைத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது; நடைமுறைப் பொருள் ‘உங்கள் அடியான்’ என்பதாகும்.
- source_word: לִקְנוֹת
  choice: விலைக்கு வாங்கி
  rationale: பணப் பரிவர்த்தனையாக வாங்குவதைக் குழப்பமின்றித் தெளிவாக்குகிறது.
- source_word: הַגֹּרֶן
  choice: போரடிக்கும் களம்
  rationale: தானியத்திலிருந்து பதரைப் பிரிக்கும் வேளாண் இடத்தைக் குறிக்கும் சொல்லின் சூழற்பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: ஒரு பலிபீடம் கட்டுவதற்காக
  rationale: கட்டுவதன் நோக்கத்தையும் பலியிடும் பீடத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் நேரடியாக வரும் இறைப் பெயரான יהוה என்பதை பெயராகவே ஒலிபெயர்க்கிறது.
- source_word: וְתֵעָצַר הַמַּגֵּפָה
  choice: கொள்ளைநோய் நிறுத்தப்படலாம்
  rationale: நிஃபால் வடிவின் செயப்பாட்டு நுணுக்கத்தையும் நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவு என்ற உறுதிப்படுத்தப்படாத தன்மையையும் காக்கிறது.
- source_word: מֵעַל הָעָם
  choice: மக்கள்மேல் இருக்கும்
  rationale: மக்கள்மேல் நோய் இருப்பதாகக் கூறும் எபிரெய இடவியல் உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: வசனம் நான்கெழுத்து இறைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயராக மாற்றாமல் அதன் பரவலாக ஏற்கப்படும் ஒலிப்பைத் தமிழில் தருகிறது.
- issue: וְתֵעָצַר என்பதிலுள்ள நோக்கம் மற்றும் விளைவின் நுணுக்கம்
  choice: நிறுத்தப்படலாம்
  alternative: நிறுத்தப்படும்; நிறுத்தப்படும்படி
  rationale: பலிபீடம் கட்டப்பட்டால் விளைவு நிச்சயம் என உரை கூறுவதாக மிகைப்படுத்தாமல், தாவீதின் நோக்கத்தையும் எதிர்பார்ப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பானதும் கண்ணியமானதுமான உரை. ‘தம் அடியான்’ அரசவைப் பணிவைத் தக்கவைக்கிறது; அதன் மூன்றாம் நபர் வடிவம் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. தாவீதின் பதிலில் தமிழுக்குத் தேவையான ‘வந்தேன்’ சூழலிலிருந்து வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
