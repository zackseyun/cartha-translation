base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/009.yaml
  text: 'Joab gave the number of the census of the people to the king: Israel was eight hundred thousand valiant men who drew the sword[a], and the men of Judah were five hundred thousand men.'
translation:
  language: ta
  text: யோவாப் மக்களின் கணக்கெடுப்பின் எண்ணிக்கையை அரசனிடம் அறிவித்தான். இஸ்ரவேலில் வாளை உருவும் வீரர்கள் எட்டு இலட்சம் பேர் இருந்தனர்[a]; யூதாவின் ஆண்கள் ஐந்து இலட்சம் பேர் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '1 நாளாகமம் 21:5-இல் உள்ள இணை விவரம் வேறு மொத்த எண்ணிக்கைகளைக் கொடுக்கிறது: இஸ்ரவேலுக்கு பதினொரு இலட்சமும் யூதாவுக்கு நான்கு இலட்சத்து எழுபதாயிரமும். இங்குள்ள மொழிபெயர்ப்பு அந்த எண்ணிக்கைகளுடன் ஒத்திசைக்காமல், 2 சாமுவேலின் எபிரெய உரையைப் பின்பற்றுகிறது.'
    reason: cross_reference
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: மக்கள்தொகைக் கணக்கெடுப்பின் எண்ணிக்கை
  rationale: מִסְפַּר என்பது ‘எண்ணிக்கை’ என்றும் מִפְקַד என்பது இச்சூழலில் ‘கணக்கெடுப்பு’ என்றும் பொருள்படும். முழுத் தொடரையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וַתְּהִי יִשְׂרָאֵל
  choice: இஸ்ரவேலில் ... இருந்தார்கள்
  rationale: எபிரெயக் கூட்டு ஒருமையின் விளைவு/மொத்த எண்ணிக்கை உணர்வைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: אִישׁ חַיִל
  choice: போரிடக்கூடிய வீரர்கள்
  rationale: இராணுவக் கணக்கெடுப்புச் சூழலில் வலிமையும் போர்த்திறனும் உடைய ஆண்களைக் குறிக்கிறது; ‘வீரர்கள்’ என்ற சொல்லுடன் திறனையும் வெளிப்படுத்துகிறது.
- source_word: שֹׁלֵף חֶרֶב
  choice: வாளை உருவி
  rationale: ‘வாளை உருவுதல்’ என்ற மூலத்தின் தெளிவான போர்ப்படிமத்தைப் பாதுகாக்கிறது.
- source_word: וְאִישׁ יְהוּדָה
  choice: யூதாவின் ஆண்கள்
  rationale: ஒருமை வடிவிலுள்ள אִישׁ இங்கு கூட்டுப் பொருளில் யூதாவைச் சேர்ந்த ஆண்களைக் குறிக்கிறது.
- source_word: שְׁמֹנֶה מֵאוֹת אֶלֶף / חֲמֵשׁ מֵאוֹת אֶלֶף
  choice: எட்டு இலட்சம் / ஐந்து இலட்சம்
  rationale: எபிரெய எண்ணிக்கைகளைத் துல்லியமாகவும் தமிழில் வழக்கமான இலட்சக் கணக்கிலும் தருகிறது.
theological_decisions:
- issue: 1 நாளாகமம் 21:5-இல் உள்ள இணை விவரத்துடன் எண்ணிக்கைகள் வேறுபடுதல்
  choice: 2 சாமுவேலின் மசோரெட்டிக் எபிரெய உரையின்படி இஸ்ரவேலுக்கு எட்டு இலட்சமும் யூதாவுக்கு ஐந்து இலட்சமும்
  alternative: 1 நாளாகமத்தின் எண்ணிக்கைகளுடன் ஒத்திசைத்தல் அல்லது படைவகைகளைச் சேர்த்தல்/விலக்குதல் என்ற விளக்கத்தை மொழிபெயர்ப்பில் புகுத்துதல்
  rationale: மொழிபெயர்ப்பு இவ்வசனத்தின் எபிரெய உரையை மாற்றாமல் தர வேண்டும். வேறுபாட்டைத் தீர்க்கும் ஊகத்தை முதன்மை உரைக்குள் கொண்டுவராமல் அடிக்குறிப்பில் மட்டும் சுட்டிக்காட்டுவது உண்மையான உரைநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘வாளை உருவி’ என்ற மூலப் படிமம் காக்கப்பட்டு, அதன் இராணுவப் பொருள் ‘போரிடக்கூடிய’ என்பதால் தெளிவாக்கப்பட்டுள்ளது. எண்ணிக்கைகள் தமிழின் வழக்கமான ‘இலட்சம்’ முறையில் வழங்கப்பட்டுள்ளன.
