translation_notes:
  register: நவீன நிலையான தமிழில், அரசருக்குரிய மரியாதையையும் பலியிடும் சூழலின் கண்ணியத்தையும் காக்கும் நடை. மூலத்தில் உள்ள மூன்றாம் நபர் மரியாதைத் திருப்பம் தமிழில் ‘தமக்கு... பலியிடட்டும்’ என இயல்பாக்கப்பட்டுள்ளது; כְלֵי என்பதன் பரந்த பொருள் குறிப்பாக்கப்படவில்லை.
