base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/022.yaml
  text: Then Araunah said to David[a], “Let my lord the king take and offer up what is good in his eyes. Look, the oxen are for the burnt offering[b], and the threshing sledges and the implements of the oxen are for the wood.”
translation:
  language: ta
  text: அப்போது அரவுனா தாவீதிடம், “என் ஆண்டவராகிய அரசர் தமக்கு நல்லதாகத் தோன்றுவதை[a] எடுத்துப் பலியிடட்டும். இதோ, தகனபலிக்காக மாடுகள் இருக்கின்றன; போரடிக்கும் பலகைகளும் மாடுகளின் கருவிகளும்[b] விறகுக்காக உள்ளன” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருக்குச் சரியெனத் தோன்றுவதை.’ எபிரேய மரபுத்தொடர் சொல்லுக்குச் சொல், ‘அவருடைய கண்களில் நல்லதை’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயச் சொல் பரந்த பொருளுடையது; ‘மாடுகளின் உபகரணங்கள்’ என்றும் மொழிபெயர்க்கலாம். பலிக்கான எரிபொருளாகப் பயன்படுத்தப்படும் மரத்தாலான மாட்டுப் பொருட்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח וְיַעַל
  choice: எடுத்துப் பலியிடட்டும்
  rationale: நேரடிப் பேச்சில் உள்ள அனுமதி அல்லது மரியாதையான அழைப்பை ‘-ட்டும்’ வடிவம் இயல்பாக வெளிப்படுத்துகிறது. பலிச் சூழலில் עלה என்பதன் பொருளை ‘பலியிடு’ தெளிவாகத் தருகிறது.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: என் ஆண்டவராகிய அரசர்
  rationale: மரியாதைமிக்க அரசவை அழைப்பையும் அரச பட்டத்தையும் நவீனத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: தமக்கு நல்லதாகத் தோன்றுவதை
  rationale: ‘அவருடைய கண்களில் நல்லது’ என்ற எபிரேய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது; மரியாதைப் பன்மையான ‘தமக்கு’ அரசரையே குறிக்கிறது.
- source_word: רְאֵה
  choice: இதோ
  rationale: முன்வைக்கப்படும் பொருட்களுக்குக் கவனத்தை ஈர்க்கும் உரையாடல் குறியாகத் தமிழில் இயல்பாக உள்ளது.
- source_word: הַבָּקָר
  choice: மாடுகள்
  rationale: போரடிக்கும் பணியில் பயன்படுத்தப்பட்டு பலிக்கும் ஏற்ற கால்நடைகளைச் சூழலுக்கேற்ற பொதுவான தமிழ்ச் சொல்லால் குறிக்கிறது.
- source_word: לָעֹלָה
  choice: தகனபலிக்காக
  rationale: முழுவதும் எரித்துச் செலுத்தப்படும் עלה பலிக்கான நிலைபெற்ற, புரிந்துகொள்ளத்தக்க தமிழ்ச் சொல்.
- source_word: הַמֹּרִגִּים
  choice: போரடிக்கும் பலகைகள்
  rationale: மோராக் என்பது தானியத்தைப் போரடிக்கப் பயன்படும் பலகை அல்லது இழுவைக் கருவி; ‘பலகைகள்’ அதன் மரத்தன்மையையும் விறகாகப் பயன்படுவதையும் தெளிவாக்குகிறது.
- source_word: כְלֵי הַבָּקָר
  choice: மாடுகளின் கருவிகள்
  rationale: כְּלִי என்ற பரந்த சொல்லை ‘நுகங்கள்’ என்று மிகக் குறிப்பாக்காமல், மாடுகளுடன் பயன்படுத்தப்பட்ட உபகரணங்கள் என்ற தெளிவின்மையோடு பாதுகாக்கிறது.
- source_word: לָעֵצִים
  choice: விறகாக
  rationale: அக்கருவிகள் பலிக்கான எரிபொருளாகப் பயன்படுத்தப்படுவதை இயல்பாகவும் தெளிவாகவும் கூறுகிறது.
