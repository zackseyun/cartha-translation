  naturalness: ‘போரடிக்கும் பலகைகளும் மாடுகளின் கருவிகளும் விறகுக்காக உள்ளன’ என்ற சொல்வரிசை நவீன நிலையான தமிழில் இரு பொருட்களுக்கும் பொருந்தும் நோக்கத்தைத் தெளிவாகக் காட்டுகிறது. ‘உள்ளன’ என்பது வழங்கப்பட்ட பொருட்களைச் சுட்டும் ‘இருக்கின்றன’ என்பதைக் காட்டிலும் இச்சூழலில் சற்றே இயல்பானது.
