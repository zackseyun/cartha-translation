base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/017.yaml
  text: Then David said to the LORD, when he saw the angel striking the people, “Look, I have sinned, and I have done wrong; but these sheep—what have they done? Please let your hand be against me and against my father's house.”
translation:
  language: ta
  text: மக்களைத் தாக்கிக்கொண்டிருந்த தூதனை தாவீது கண்டபோது, அவர் ஆண்டவரிடம், “இதோ, பாவம் செய்தவன் நான்தான்; தவறு செய்தவனும் நான்தான். ஆனால் ஆடுகளாகிய இவர்கள் என்ன செய்தார்கள்? உமது கை எனக்கும் என் தந்தையின் வீட்டாருக்கும் எதிராக இருக்கட்டும்” என்று சொன்னார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தேவனுடைய உடன்படிக்கைப் பெயரை, தமிழ் வேதாகம நடையில் மரியாதையுடனும் வாசிப்பில் இயல்பாகவும் குறிக்கிறது.
- source_word: הַמַּלְאָךְ הַמַּכֶּה בָעָם
  choice: மக்களைத் தாக்கிக்கொண்டிருந்த தூதன்
  rationale: מכה என்பதன் தொடர்ச்சியான தாக்குதல் செயலைச் சூழலுக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: தாவீது தன்னையே வலியுறுத்திச் சுட்டும் எபிரெய இடைச்சொல்லின் கவன ஈர்ப்புத் தன்மையைப் பேணுகிறது.
- source_word: הֶעֱוֵיתִי
  choice: தவறு செய்தவன்
  rationale: חטאתי என்பதிலிருந்து வேறுபட்டிருந்தாலும் அதனுடன் இணைந்த அறநெறிக் குற்றத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַצֹּאן
  choice: ஆடுகளாகிய இவர்கள்
  rationale: மக்களை ஆடுகளாக உருவகிக்கும் மூலச்சொல்லின் மேய்ப்பன் உருவகத்தை வெளிப்படையாகப் பேணுகிறது.
- source_word: יָדְךָ
  choice: உமது கை
  rationale: தண்டிக்கும் வல்லமையைக் குறிக்கும் மூல உருவகத்தை விளக்கமாக மாற்றாமல் அப்படியே பேணுகிறது.
- source_word: בֵית אָבִי
  choice: என் தந்தையின் வீட்டார்
  rationale: பௌதிக வீட்டைக் காட்டிலும் தந்தைவழிக் குடும்பத்தைக் குறிக்கும் எபிரெயப் பயன்பாட்டைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: தெய்வீக தண்டனையும் தாவீதின் குற்றப்பொறுப்பும்
  choice: தாவீதின் ஒப்புதலையும், தண்டனை தன்னிடமும் தன் தந்தையின் வீட்டாரிடமும் திரும்ப வேண்டும் என்ற வேண்டுதலையும் நேரடியாகப் பேணுதல்
  alternative: மக்களுக்கான தண்டனையின் நீதியை விளக்கிச் சமன்செய்தல்
  rationale: மூலவசனம் எழுப்பும் நீதிசார் மற்றும் இறையியல் பதற்றத்தை விளக்கமிட்டு அகற்றாமல் அப்படியே வைக்கிறது.
- issue: மக்களை ஆடுகள் என்று அழைக்கும் உருவகம்
  choice: “ஆடுகளாகிய இவர்கள்” என்று உருவகத்தைப் பேணுதல்
  alternative: “குற்றமற்ற மக்கள்” என்று பொருள் விளக்குதல்
  rationale: மூலத்தில் குற்றமின்மை நேரடியாகக் கூறப்படவில்லை; “இவர்கள் என்ன செய்தார்கள்?” என்ற கேள்வியிலும் ஆடு உருவகத்திலும் அது உணர்த்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமான வேதாகம நடை. உரையாடலில் வலியுறுத்தல் இயல்பாக அமைய “நான்தான்” பயன்படுத்தப்பட்டுள்ளது. பெயர்ச்சொல் உருவகமும் ‘உமது கை’ என்ற மூல உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
