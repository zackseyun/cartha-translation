base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/015.yaml
  text: So Yahweh sent a plague on Israel from the morning until the appointed time[a], and seventy thousand men of the people died, from Dan to Beersheba.
translation:
  language: ta
  text: அப்போது யாவே இஸ்ரவேல்மீது காலையிலிருந்து நியமிக்கப்பட்ட நேரம்வரை[a] கொள்ளைநோயை அனுப்பினார். தாண் முதல் பெயெர்செபா வரை மக்களில் எழுபதாயிரம் ஆண்கள் இறந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குறிக்கப்பட்ட நேரம்வரை.’ எபிரெயச் சொற்றொடர் நியமிக்கப்பட்ட அல்லது நிர்ணயிக்கப்பட்ட ஒரு நேரத்தைக் குறிக்கலாம்; ‘கூடுகையின் நேரம்வரை’ என்பது இங்கு குறைவான சாத்தியமுள்ள பொருள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: அனுப்பினார்
  rationale: வினைச்சொல்லின் நேரடிப் பொருள் ‘கொடுத்தார்’ என்றாலும், கொள்ளைநோயுடன் வரும் இச்சூழலில் ‘அனுப்பினார்’ என்பது இயல்பான தமிழாகவும் தேவனுடைய நேரடி செயற்பாட்டைப் பாதுகாக்கும் வகையிலும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தேவப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் பொதுவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: דֶּבֶר
  choice: கொள்ளைநோய்
  rationale: உயிரிழப்பை ஏற்படுத்தும் பரவலான நோயைக் குறிக்கும் இச்சொல், நவீனத் தமிழில் தெளிவாகவும் இச்சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேல்மீது
  rationale: தேசத்தின்மீது வந்த தண்டனை என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵהַבֹּקֶר
  choice: காலையிலிருந்து
  rationale: நிகழ்வின் தொடக்க நேரத்தைத் தெளிவாகக் காக்கிறது.
- source_word: וְעַד עֵת מוֹעֵד
  choice: நியமிக்கப்பட்ட நேரம்வரை
  rationale: מוֹעֵד என்பதன் ‘நியமிக்கப்பட்ட அல்லது குறிக்கப்பட்ட நேரம்’ என்ற காலப் பொருளைச் சூழலுக்கேற்ப வழங்குகிறது; அதன் சாத்தியமான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיָּמָת
  choice: இறந்தார்கள்
  rationale: ஒருமை வடிவிலுள்ள எபிரெய வினைச்சொல் எண்ணிக்கையுடன் வரும் கூட்டுப் பொருளைக் குறிக்கிறது; தமிழில் பன்மை வினை இயல்பானது.
- source_word: מִן הָעָם
  choice: மக்களில்
  rationale: இறந்தவர்கள் அந்த மக்களிடையே இருந்தவர்கள் என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: தாண்முதல் பெயெர்செபாவரை
  rationale: இஸ்ரவேல் நாட்டின் முழுப் பரப்பையும் குறிக்கும் புவியியல் மரபுத்தொடரை நேரடியாகப் பாதுகாக்கிறது.
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: எழுபதாயிரம் ஆண்கள்
  rationale: אִישׁ என்ற ஆண்பால் சொல்லை பொதுவான ‘மக்கள்’ எனத் தட்டையாக்காமல், அதன் பாலினச் சுட்டுதலைக் காக்கிறது.
theological_decisions:
- issue: தீர்ப்பில் தேவனுடைய செயற்பாடு
  choice: யாவே ... கொள்ளைநோயை அனுப்பினார்
  alternative: யாவே ... கொள்ளைநோய் வர அனுமதித்தார்
  rationale: எபிரெய உரை செயலை நேரடியாக யாவேக்கே உரித்தாக்குகிறது; ‘அனுமதித்தார்’ என்று மென்மைப்படுத்துவதற்கு உரையில் ஆதாரம் இல்லை.
- issue: עֵת מוֹעֵד என்பதன் பொருள்
  choice: நியமிக்கப்பட்ட நேரம்வரை
  alternative: குறிக்கப்பட்ட நேரம்வரை; கூடுகையின் நேரம்வரை
  rationale: இக்கதையின் சூழலில் நிர்ணயிக்கப்பட்ட கால எல்லையே மிகச் சாத்தியம். அதேவேளை, எபிரெயச் சொற்றொடரின் உண்மையான பொருள் விரிவை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. தேவனுடைய செயற்பாடும் காலச் சொற்றொடரின் தெளிவின்மையும் மென்மைப்படுத்தப்படாமல் காக்கப்பட்டுள்ளன.
