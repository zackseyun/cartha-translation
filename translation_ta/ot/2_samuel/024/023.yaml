  naturalness: மரியாதைப் பன்மையுடன் ‘உங்கள்/உங்களை’ பயன்படுத்தியிருப்பது நவீனத் தரத் தமிழில் இயல்பானது. ‘உங்களை ஏற்றுக்கொள்வாராக’ என்பதும் தெளிவான வேண்டுதல் நடை. அடிக்குறிப்பு ஆ-வில் ‘உங்கள்மேல் பிரியமாயிருப்பாராக’ என்பதற்குப் பதில் ‘உங்கள்மேல் மகிழ்ச்சியாயிருப்பாராக’ என்பது குறைவாக இயல்பானது; ‘உங்கள்மேல் பிரியமாயிருப்பாராக’ என்பதே ஏற்றது, எனவே அது தக்கவைக்கப்படுகிறது.
