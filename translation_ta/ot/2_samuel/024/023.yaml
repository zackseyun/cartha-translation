base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/023.yaml
  text: Araunah the king gave all this to the king[a]. And Araunah said to the king[b], “May Yahweh your God accept you.”
translation:
  language: ta
  text: அரசனாகிய அரவுனா இவை அனைத்தையும் அரசனுக்குக் கொடுத்தான்.[a] அரவுனா அரசனிடம், “உங்கள் கடவுளாகிய யாவே உங்களை ஏற்றுக்கொள்வாராக”[b] என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில், “அரவுனா அரசன்” என்று உள்ளது. அரவுனாவுக்கு அரசப் பட்டம் இருந்ததாகப் பொருள்படுவதைத் தவிர்க்கச் சில மொழிபெயர்ப்புகள் இதை எளிமைப்படுத்துகின்றன; ஆனால் அந்தப் பட்டம் எபிரெய உரையில் உள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உங்கள்மேல் பிரியமாயிருப்பாராக” அல்லது “உங்களுக்குத் தயவு காட்டுவாராக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: இவை அனைத்தையும்
  rationale: முந்தைய வசனத்தில் பலிக்காக முன்வைக்கப்பட்ட களம், மாடுகள், மரக்கருவிகள் ஆகியவற்றின் முழுத்தொகுதியையும் இயல்பான தமிழில் சுட்டுகிறது.
- source_word: נָתַן
  choice: கொடுத்தான்
  rationale: கதைநடையில் வரும் qatal வடிவை இறந்தகால நிகழ்வாக நேரடியாகத் தருகிறது.
- source_word: אֲרַוְנָה
  choice: அரவுனா
  rationale: சாமுவேல் நூலில் உள்ள எபிரெயப் பெயரின் தமிழ் ஒலிபெயர்ப்பு; நாளாகமத்தில் வரும் ‘ஓர்னான்’ இங்கு கொண்டுவரப்படவில்லை.
- source_word: הַמֶּלֶךְ
  choice: அரசனாகிய
  rationale: அரவுனாவைத் தொடர்ந்து வரும் ‘அரசன்’ என்ற இணைப்புப் பட்டத்தை அசல் உரையின்படி தக்கவைத்து, தமிழில் இயல்பாக இணைக்கிறது.
- source_word: לַמֶּלֶךְ
  choice: அரசனுக்கு
  rationale: ל முன்னொட்டு இங்கு பொருட்களைப் பெறுகிற தாவீதை மறைமுகச் செயப்படுபொருளாகக் குறிக்கிறது.
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: எபிரெயக் கதைத் தொடரின் பேச்சுவினையை இயல்பான தமிழ் மேற்கோள் அமைப்பில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழ் ஒலியமைப்புக்கு ஏற்ற வகையில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய
  rationale: தாவீது அரசரிடம் சொல்லப்படும் இரண்டாம் நபர் ஒருமை உரிமைத் தொடரை மரியாதைப் பன்மையுடன் இயல்பான தமிழில் வழங்குகிறது.
- source_word: יִרְצֶךָ
  choice: உங்களை ஏற்றுக்கொள்வாராக
  rationale: רצה என்பதன் சாதகமான ஏற்றுக்கொள்ளுதலைத் தக்கவைக்கிறது; பலிச்சூழலைக் கருத்தில் கொண்டாலும், பொருளை பலியையே ஏற்றுக்கொள்வதாக மாற்றாமல் நபரையே செயப்படுபொருளாக வைத்திருக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது அசல் வடிவைத் தக்கவைக்கிறது.
- issue: அரவுனாவுக்குரிய ‘அரசன்’ என்ற பட்டத்தைத் தக்கவைத்தல்
  choice: அரசனாகிய அரவுனா
  alternative: அரவுனா
  rationale: הַמֶּלֶךְ என்பது அரவுனாவுக்குப் பின்னர் வெளிப்படையாக வருகிறது. சூழலில் அசாதாரணமாகத் தோன்றினாலும், அதை நீக்காமல் மூல உரையின் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: יִרְצֶךָ என்பதன் பொருள்
  choice: உங்களை ஏற்றுக்கொள்வாராக
  alternative: உங்கள்மேல் பிரியமாயிருப்பாராக / உங்களுக்குத் தயவு காட்டுவாராக
  rationale: வினை நபரை நேரடியாகச் செயப்படுபொருளாகக் கொண்டிருப்பதைப் பாதுகாத்து, சாதகமான ஏற்றுக்கொள்ளுதல் என்ற பரப்பைச் சுருக்காமல் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. தாவீதிடம் பேசுவதால் ‘உங்கள்/உங்களை’ என்ற மரியாதை வடிவம் கொள்ளப்பட்டது. அசல் உரையில் அரவுனாவுடன் இணைக்கப்பட்டுள்ள அசாதாரண அரசப் பட்டமும், רצה வினையின் பொருள் பரப்பும் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டன.
