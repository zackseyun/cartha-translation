base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/013.yaml
  text: So Gad came to David and told him[a], and said to him[c][b], “Shall seven years of famine come to you in your land? Or will you flee three months before your adversaries while they pursue you? Or shall there be three days of pestilence in your land? Now know and see what answer I should return to the one who sent me.”
translation:
  language: ta
  text: 'அப்பொழுது காத் தாவீதிடம் வந்து, அவருக்குத் தெரிவித்து, அவரிடம் கூறினார்: “உமது நாட்டில் ஏழு ஆண்டுகள் பஞ்சம் வருமா?[a] அல்லது உமது பகைவர்கள் உம்மைத் துரத்த, நீர் மூன்று மாதங்கள் அவர்களுக்கு முன்பாக ஓடிப்போவதா?[b] அல்லது உமது நாட்டில் மூன்று நாட்கள் கொள்ளைநோய் உண்டாகுமா?[c] இப்போது, என்னை அனுப்பியவருக்கு நான் என்ன பதில் சொல்ல வேண்டும் என்பதை அறிந்துகொண்டு பாரும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 நாளாகமம் 21:12-இல் உள்ள இணைப் பகுதி, ‘ஏழு ஆண்டுகள் பஞ்சம்’ என்பதற்குப் பதிலாக ‘மூன்று ஆண்டுகள் பஞ்சம்’ என்று கூறுகிறது.
    reason: textual_variant
  - marker: b
    text: ‘பகைவர்கள்’ என்பதை ‘எதிரிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘கொள்ளைநோய்’ என்பதை ‘கொள்ளைத் தொற்று’ அல்லது ‘பெருந்தொற்று’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்து
  rationale: בוא என்பதன் வழக்கமான வருகைப் பொருளை, காத் தாவீதிடம் அணுகிய கதைநோக்கில் இயல்பாகத் தருகிறது.
- source_word: וַיַּגֶּד
  choice: அறிவித்து
  rationale: Hiphil வடிவிலுள்ள נגד என்பதன் ‘தெரிவித்தல்/அறிவித்தல்’ பொருளைத் தெளிவாகக் காட்டுகிறது; அடுத்து வரும் ‘சொன்னார்’ என்பதுடனான வேறுபாட்டையும் காக்கிறது.
- source_word: הֲתָבוֹא
  choice: வர வேண்டுமா?
  rationale: கேள்வியுடன் கூடிய imperfect வடிவத்தின் தெரிவு அல்லது ஆலோசனை சார்ந்த நுண்ணுணர்வை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שֶׁבַע שָׁנִים רָעָב
  choice: ஏழு ஆண்டுகள் பஞ்சம்
  rationale: רָעָב இங்கு தனிப்பட்ட பசியை அல்ல, நாட்டளவிலான பஞ்சத்தைக் குறிக்கிறது; WLC-இன் ‘ஏழு’ என்ற வாசகமே முதன்மை உரையில் மொழிபெயர்க்கப்படுகிறது.
- source_word: בְּאַרְצֶךָ
  choice: உமது நாட்டில்
  rationale: இங்கு אֶרֶץ தாவீதின் ஆட்சிப்பகுதி அல்லது நாட்டைக் குறிக்கிறது.
- source_word: אִם שְׁלֹשָׁה חֳדָשִׁים נֻסְךָ לִפְנֵי צָרֶיךָ
  choice: அல்லது உமது பகைவர்கள் உம்மைத் துரத்தும்போது, நீர் மூன்று மாதங்கள் அவர்களுக்கு முன்பாகத் தப்பியோட வேண்டுமா?
  rationale: சுருக்கமாக அமைந்த எபிரெய வாக்கியத்தை மிகைப்படுத்தாமல் தெளிவுபடுத்துகிறது; נוס என்பதன் தப்பியோடும் பொருளையும் לִפְנֵי என்பதன் ‘அவர்களுக்கு முன்பாக’ என்ற அமைப்பையும் காக்கிறது.
- source_word: צָרֶיךָ
  choice: உமது பகைவர்கள்
  rationale: צַר என்பதற்கு சூழலில் இயல்பான ‘பகைவர்’ பொருள் பொருந்துகிறது; ‘எதிரிகள்’ என்பதும் சாத்தியமான மாற்று.
- source_word: וְהוּא רֹדְפֶךָ
  choice: உம்மைத் துரத்தும்போது
  rationale: எபிரெயில் ஒருமைச் சுட்டுப்பெயர் இருந்தாலும் முன்வரும் பன்மையான பகைவர்களைத் தொகுதியாகச் சுட்டுவதாகப் புரிந்துகொண்டு, தமிழில் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: וְאִם הֱיוֹת שְׁלֹשֶׁת יָמִים דֶּבֶר
  choice: அல்லது உமது நாட்டில் மூன்று நாட்கள் கொள்ளைநோய் உண்டாக வேண்டுமா?
  rationale: דֶּבֶר குறிக்கும் பரவலான கொடிய தொற்றுநோய் அல்லது plague என்ற பொருளை மரியாதையான, வேதாகமச் சூழலுக்கு ஏற்ற தமிழில் ‘கொள்ளைநோய்’ எனத் தருகிறது.
- source_word: עַתָּה דַּע וּרְאֵה
  choice: இப்போது ... அறிந்து தீர்மானியும்
  rationale: சொல்லுக்கு சொல் ‘அறிந்து பாரும்’ என்பது தமிழில் நோக்கத்தைத் தெளிவாகச் சொல்லாது; இணைந்த கட்டளைகள் சிந்தித்து முடிவெடுக்கும்படி அழைப்பதால் ‘அறிந்து தீர்மானியும்’ என இயல்பாக்கப்பட்டுள்ளது.
- source_word: מָה אָשִׁיב שֹׁלְחִי דָּבָר
  choice: நான் என்னை அனுப்பியவரிடம் என்ன பதிலைத் திரும்பச் சொல்ல வேண்டும்
  rationale: השיב דבר என்ற ‘பதில் கொண்டுசெல்லுதல்/திரும்பச் சொல்லுதல்’ மரபுத்தொடரை நவீன தமிழில் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: 1 நாளாகமம் 21:12-இன் இணை விவரத்துடனான எண் வேறுபாடு
  choice: மசோரெட்டிக் உரையிலுள்ள ‘ஏழு ஆண்டுகள்’ என்பதை முதன்மை உரையில் மொழிபெயர்த்தல்
  alternative: ‘மூன்று ஆண்டுகள்’ என்று 1 நாளாகமம் 21:12 வாசிக்கிறது
  rationale: கொடுக்கப்பட்ட WLC உரை ‘ஏழு ஆண்டுகள்’ என்று வாசிப்பதால் அதுவே மொழிபெயர்க்கப்படுகிறது. இணைப் பகுதியின் வேறுபாடு ஒத்திசைக்கப்படாமல் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
- issue: דֶּבֶר என்பதன் மொழிபெயர்ப்பு
  choice: கொள்ளைநோய்
  alternative: கொள்ளைத் தொற்று / பெருந்தொற்று
  rationale: தெய்வீகத் தீர்ப்பின் சூழலில் வரும் கொடிய பரவல் நோய் என்ற பொருளைத் தருகிறது; குறிப்பிட்ட நவீன மருத்துவ நோயாகத் தவறாகக் குறுக்காமல் உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசனிடம் உரையாடும் சூழலுக்கேற்ற ‘உமது/உம்மை/நீர்’ மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. நடை கண்ணியமாகவும் சாதாரண வாசகருக்குத் தெளிவாகவும் வைக்கப்பட்டுள்ளது; மூலத்தின் மூன்று தெரிவுகளும் கேள்வி வடிவில் இணையாகப் பாதுகாக்கப்பட்டுள்ளன.
