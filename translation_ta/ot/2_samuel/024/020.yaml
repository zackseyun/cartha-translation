revisions:
- from: அர்வனா வெளியே பார்த்தபோது, ராஜாவும் அவருடைய பணியாளர்களும் தன்னை நோக்கி வருவதைக் கண்டான்.[a] அப்போது அர்வனா வெளியே வந்து, தரையில் முகம் படும்படி ராஜாவுக்கு முன்பாகத் தாழ்ந்து வணங்கினான்.
  to: அரவுனா வெளியே பார்த்து, ராஜாவையும் அவருடைய பணியாளர்களையும் தன்னை நோக்கி வருவதைக் கண்டான்.[a] அப்போது அரவுனா வெளியே வந்து, தரையில் முகம் படும்படி ராஜாவுக்கு முன்பாகத் தாழ்ந்து வணங்கினான்.
  rationale: The revision corrects the transliteration of Araunah’s name, slightly improves the narrative flow, and clarifies that the servants belong to the king. It retains the contextually appropriate main rendering ‘தன்னை நோக்கி வருவதைக்’ while preserving the Hebrew expression’s ambiguity in the anchored footnote. The homage language remains non-doctrinal and physically specific.
