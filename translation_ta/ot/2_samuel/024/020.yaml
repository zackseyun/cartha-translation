base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/020.yaml
  text: Araunah looked out and saw the king and his servants passing by him[a]. So Araunah went out and bowed down to the king with his face to the ground.
translation:
  language: ta
  text: அரவுனா வெளியே பார்த்து, ராஜாவையும் அவருடைய பணியாளர்களையும் தன்னை நோக்கி வருவதைக் கண்டான்.[a] அப்போது அரவுனா வெளியே வந்து, தரையில் முகம் படும்படி ராஜாவுக்கு முன்பாகத் தாழ்ந்து வணங்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன்னைக் கடந்து செல்வதை” அல்லது “தன்னை நெருங்கி வருவதை.” எபிரெயத் தொடர், ராஜாவும் அவருடைய பணியாளர்களும் அரவுனாவுடன் தொடர்புடைய திசையில் நகர்ந்ததைக் கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: வெளியே பார்த்தபோது
  rationale: உயரமான இடத்திலிருந்தோ ஓர் திறப்பின் வழியாகவோ வெளியே பார்க்கும் நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיַּרְא
  choice: கண்டான்
  rationale: முந்தைய ‘பார்த்தபோது’ என்பதற்குப் பின் நிகழும் கண்டறிதலை எபிரெயக் கதைநடைக்கு ஏற்ப காட்டுகிறது.
- source_word: עֲבָדָיו
  choice: அவருடைய பணியாளர்கள்
  rationale: அரசருடன் வந்த ஊழியர்கள் அல்லது பரிவாரத்தாரைக் குறிக்கக்கூடிய சொல்லை, சமூகத் தாழ்வை மிகைப்படுத்தாமல் நேரடியாக வழங்குகிறது.
- source_word: עֹבְרִים עָלָיו
  choice: தன்னை நோக்கி வருவதை
  rationale: இந்த எபிரெயத் தொடர் அர்வனாவுடன் தொடர்புடைய திசையில் அவர்கள் நகர்வதைச் சொல்கிறது; சூழலில் தாவீது அவனிடம் வருவதால் இது இயல்பான பொருள். மாற்றுச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיֵּצֵא
  choice: வெளியே வந்து
  rationale: יצא என்பதன் வழக்கமான பொருளையும், அர்வனா வெளியே பார்த்த இடத்திலிருந்து புறப்பட்டதையும் இயல்பாகக் காட்டுகிறது.
- source_word: וַיִּשְׁתַּחוּ
  choice: தாழ்ந்து வணங்கினான்
  rationale: உடலைத் தாழ்த்தி மரியாதை செலுத்தும் செயலைக் காட்டுகிறது; மனித அரசருக்கு தெய்வ வழிபாடு செய்ததாகத் தவறாக உணர்த்தாது.
- source_word: אַפָּיו אָרְצָה
  choice: தரையில் முகம் படும்படி
  rationale: முகம் தரையை நோக்கிய முழுத் தாழ்வை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲרַוְנָה
  choice: அர்வனா
  rationale: சாமுவேல் நூலிலுள்ள எபிரெயப் பெயர்வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது; நாளாகமத்தின் ‘ஒர்னான்’ வடிவத்தை இங்கு கொண்டுவரவில்லை.
theological_decisions:
- issue: மனித அரசருக்கு முன்பாக அர்வனா செய்த செய்கையின் தன்மை
  choice: ராஜாவுக்கு முன்பாகத் தாழ்ந்து வணங்கினான்
  alternative: ராஜாவை வழிபட்டான்
  rationale: எபிரெய வினைச்சொல் வழிபாட்டையும் மனிதருக்கு மரியாதையாகத் தாழ்வதையும் குறிக்கலாம். இங்கு செயல் மனித அரசரான தாவீதுக்கு முன்பாக நடைபெறுவதால், உடல்செயலைப் பாதுகாத்து தெய்வ வழிபாடு என்ற பொருளைத் திணிக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. ‘ராஜா’ என்பது பொதுவாக அறியப்படும் வடிவமாகவும், ‘தாழ்ந்து வணங்கினான்’ என்பது அரசருக்குரிய மரியாதைச் செயலைத் தெளிவாகவும் வழங்குகிறது.
