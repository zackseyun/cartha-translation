base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/002.yaml
  text: So the king said to Joab[a], the commander of the army who was with him, “Go about now through all the tribes of Israel, from Dan to Beer-sheba, and count the people, so that I may know the number of the people.”
translation:
  language: ta
  text: அப்போது அரசன் தன்னுடன் இருந்த படைத்தளபதி யோவாபிடம், “இப்போது இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலும், தாண் முதல் பெயெர்செபா வரை சுற்றிச் சென்று, மக்களைக் கணக்கெடுங்கள்[a]; நான் மக்களின் எண்ணிக்கையை அறிந்துகொள்ளும்படி” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களைப் பதிவுசெய்யுங்கள்” அல்லது “மக்களை அணிவகுத்துக் கணக்கிடுங்கள்.” எபிரெய வினை மக்களை எண்ணுவதையோ பதிவுசெய்வதையோ குறிக்கலாம்; சில சூழல்களில் அதற்குப் படை சார்ந்த பொருளும் உண்டு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர் வடிவம் கதை நிகழ்வை முன்னெடுத்துச் செல்கிறது; நவீன தமிழில் இயல்பான நிகழ்வுத் தொடரை இது வெளிப்படுத்துகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: எபிரெய உரை இங்கு தாவீதின் பெயரைச் சொல்லாமல் அவரது பட்டத்தையே பயன்படுத்துகிறது; அதையே மொழிபெயர்ப்பு காக்கிறது.
- source_word: שַׂר הַחַיִל
  choice: படைத்தளபதி
  rationale: שַׂר என்பது தலைவர் அல்லது அதிகாரியையும், חַיִל இச்சூழலில் படையையும் குறிக்கிறது; ‘படைத்தளபதி’ சுருக்கமான, தெளிவான நவீனத் தமிழ்.
- source_word: אֲשֶׁר אִתּוֹ
  choice: தன்னுடன் இருந்த
  rationale: யோவாப் அரசனுடன் இருந்தார் என்பதைத் தெரிவிக்கும் உறவுத் தொடரை இயல்பான தமிழில் அளிக்கிறது.
- source_word: שׁוּט נָא
  choice: இப்போது ... சென்று
  rationale: שׁוּט ஒரு நிலப்பரப்பெங்கும் சுற்றிச் செல்வதைச் சுட்டுகிறது; נָא கட்டளையை மென்மைப்படுத்தும் துகள். அரச கட்டளையில் செயற்கையாக ‘தயவுசெய்து’ சேர்க்காமல் அதன் மென்மையை ‘இப்போது’ என்பதோடு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லாக் கோத்திரங்களின் பகுதிகளிலும்
  rationale: இயக்கத்தைக் குறிக்கும் வினையுடன் வரும் בְ, கோத்திர மக்களிடையே மட்டும் அல்லாமல் அவர்களுடைய பகுதிகளெங்கும் பயணிப்பதை இங்கு உணர்த்துகிறது.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: தாண்முதல் பெயெர்செபாவரை
  rationale: நாட்டின் வடக்கிலிருந்து தெற்குவரையிலான முழுப் பரப்பைக் குறிக்கும் நிலையான இடப்பெயர்த் தொடரை நேரடியாகக் காக்கிறது.
- source_word: וּפִקְדוּ
  choice: கணக்கெடுங்கள்
  rationale: פקד இங்கு மக்களை எண்ணுதல் அல்லது பதிவுசெய்தல் என்ற பொருளுடையது. பன்மைக் கட்டளை வடிவத்தையும் கணக்கெடுப்பின் நிர்வாகப் பொருளையும் ‘கணக்கெடுங்கள்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֶת הָעָם
  choice: மக்களை
  rationale: עָם என்பதன் பொதுவான பொருள் ‘மக்கள்’; படைச் சூழல் இருந்தாலும் உரை வீரர்களைக் குறிக்கும் தனிப்பட்ட சொல்லைப் பயன்படுத்தவில்லை.
- source_word: וְיָדַעְתִּי
  choice: அப்போது ... நான் அறிந்துகொள்வேன்
  rationale: எபிரெய வடிவத்தை நோக்கம் என்று மட்டும் உறுதியாக்காமல், தொடர்ச்சியான விளைவு அல்லது நோக்கம் ஆகிய இரண்டுக்கும் இடமளிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: מִסְפַּר הָעָם
  choice: மக்களின் எண்ணிக்கை
  rationale: கட்டமைப்பின் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தரும் இயல்பான தமிழ்.
theological_decisions:
- issue: படை-நிர்வாகச் சூழலில் הָעָם என்பதன் வரம்பு
  choice: மக்கள்
  alternative: போர்வீரர்கள் / படைவீரர்கள்
  rationale: யோவாப் படைத்தளபதியாக இருந்ததும் கணக்கெடுப்புக்குப் படை நோக்கம் இருந்திருக்கக்கூடும் என்பதும் உண்மை. ஆயினும், மூல உரை வீரர்களுக்கான தனிச்சொல்லைப் பயன்படுத்தாமல் עָם (‘மக்கள்’) என்பதையே பயன்படுத்துவதால் அதன் பரந்த பொருள் காக்கப்படுகிறது.
- issue: וְיָדַעְתִּי என்பதிலுள்ள நோக்கம் அல்லது விளைவு
  choice: அப்போது ... நான் அறிந்துகொள்வேன்
  alternative: நான் அறிந்துகொள்ளும்படி
  rationale: சூழலில் நோக்கப் பொருள் சாத்தியமானது; எனினும் எபிரெய வடிவம் நேரடியாக ‘அப்போது/அதனால் நான் அறிவேன்’ என்றும் வாசிக்கப்படலாம். மொழிபெயர்ப்பு இந்த உண்மையான நுண்ணிய திறந்தநிலையைச் சுருக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘கோத்திரம்’, ‘படைத்தளபதி’, ‘கணக்கெடுங்கள்’ ஆகிய சொற்கள் துல்லியத்தையும் இயல்பையும் சமநிலைப்படுத்துகின்றன. அடிக்குறிப்பு குறி முதன்மை உரையில் இடம்பெற்றுள்ளது.
