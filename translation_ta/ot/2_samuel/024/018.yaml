base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/018.yaml
  text: That day Gad came to David and said to him[c][b][a], “Go up and set up an altar to Yahweh on the threshing floor of Araunah the Jebusite.”
translation:
  language: ta
  text: அந்த நாளில்[a] காத் தாவீதிடம் வந்து, “மேலே சென்று, எபூசியனாகிய அரவுனாவின்[c] போரடிக்கும் களத்தில் யாவேக்கு[b] ஒரு பலிபீடத்தை நிறுவு” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “அந்த நாளில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாவேக்காக.”
    reason: lexical_alternative
  - marker: c
    text: 1 நாளாகமம் 21:18-ல் இப்பெயர் “ஒர்னான்” என்று வருகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்து
  rationale: בוא என்பதன் கால் தொடர்-இறந்தகால வடிவம் இக்கதைத் தொடரில் ‘வந்தார்’ என்ற பொருளைத் தருகிறது; தாவீதிடம் வந்தார் என்ற இலக்குடன் இது இயல்பான தமிழ்.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்த நாளில்
  rationale: எபிரேயச் சொற்றொடரின் காலக் குறிப்பை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: עֲלֵה
  choice: மேலே சென்று
  rationale: עלה என்ற கட்டளையின் ஏறிச் செல்லும் திசைப் பொருளைக் காக்கிறது; ‘ஏறு’ என்பதைவிட இச்சூழலில் இயல்பான நடை.
- source_word: הָקֵם
  choice: எழுப்பு
  rationale: קום என்பதன் ஹிஃபில் கட்டளை வடிவம் ‘நிற்கச் செய்/எழுப்பு’ என்று பொருள்படும்; பலிபீடத்தை நிறுவுவதைக் குறிப்பதற்கு ‘எழுப்பு’ மூலவினைக்கு நெருக்கமானது.
- source_word: מִזְבֵּחַ
  choice: பலிபீடம்
  rationale: מזבח என்பதற்கான தெளிவான, வழக்கமான தமிழ் வேதாகமச் சொல்.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: ל அர்ப்பணிப்பு அல்லது நோக்கத்தைக் குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயரை பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கிறது.
- source_word: בְּגֹרֶן
  choice: போரடிக்கும் களத்தில்
  rationale: גרן என்பது தானியத்தைப் போரடித்துப் பிரிக்கும் களம்; இடத்தைக் குறிக்கும் ב இங்கு ‘களத்தில்’ என இயல்பாக வருகிறது.
- source_word: ארניה
  choice: அரவுனா
  rationale: சாமுவேல் நூலில் காணப்படும் பெயரின் வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது; நாளாகமத்தின் இணைப் பகுதியில் உள்ள ‘ஒர்னான்’ வடிவத்தை இங்கு மாற்றீடாக இடவில்லை.
- source_word: הַיְבֻסִי
  choice: எபூசியனான
  rationale: அரவுனாவின் இன அடையாளத்தைத் தெரிவிக்கும் எபிரேய இனப்பெயரின் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதனைப் பட்டப்பெயரான ‘கர்த்தர்’ என்று மாற்றாமல், உடன்படிக்கைப் பெயராக ஒலிபெயர்ப்பது மூலத்தின் தனித்தன்மையைக் காக்கிறது.
- issue: לַיהוָה-இல் ל முன்னிடைச்சொல்லின் பொருள்
  choice: யாவேக்கு
  alternative: யாவேக்காக
  rationale: பலிபீடம் யாவேக்கு அர்ப்பணிக்கப்படுவதைக் குறிக்கும் இலக்கு/அர்ப்பணிப்பு நுணுக்கத்தை ‘-க்கு’ காக்கிறது; ‘-க்காக’ என்பதும் சூழலுக்கு ஏற்ற சாத்தியமான வாசிப்பு.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘போரடிக்கும் களம்’ விவசாயச் சூழலைத் தெளிவாக எடுத்துரைக்கிறது. காத் தாவீதிடம் பேசும் நேரடி கட்டளையில் மூலத்தின் ஒருமை வடிவம் காக்கப்பட்டுள்ளது.
