base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/014.yaml
  text: Then David said to Gad[a], “I am in great distress. Let us fall, please, into the hand of Yahweh, for his mercies are many[b]; but let me not fall into the hand of man.”
translation:
  language: ta
  text: '2 சாமுவேல் 24:14


    அப்போது தாவீது காதிடம், “நான் மிகுந்த நெருக்கடியில் இருக்கிறேன். தயவுசெய்து, நாம் யாவேயின் கையில் விழுவோமாக; ஏனெனில் அவருடைய இரக்கங்கள் பல.[a] ஆனால் நான் மனிதரின் கையில் விழாதிருப்பேனாக” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய இரக்கம் மிகுதி.” எபிரெயில் சொல்லுக்கு சொல், “அவருடைய இரக்கங்கள் பல.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: நான் மிகுந்த நெருக்கடியில் இருக்கிறேன்
  rationale: צַר + לִי என்பது தாவீதின் தனிப்பட்ட கடும் மனநெருக்கடியைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் உணர்ச்சி வலிமையுடனும் இதை வெளிப்படுத்துகிறது.
- source_word: נִפְּלָה נָּא
  choice: நாம் ... விழுவோமாக
  rationale: முதலாம் நபர் பன்மை cohortative வடிவம், தாவீது தன்னை மக்களோடு இணைத்துக்கொண்டு விருப்பத்தையும் வேண்டுதலையும் தெரிவிப்பதைப் பாதுகாக்கிறது. தமிழின் ‘விழுவோமாக’ அந்தத் தன்னார்வ வேண்டுகோள் நயத்தைத் தருகிறது.
- source_word: בְיַד יְהוָה
  choice: யாவேயின் கையில்
  rationale: ‘கையில்’ என்ற எபிரெய மரபுத்தொடர் ஒருவரது அதிகாரத்திற்கோ கட்டுப்பாட்டிற்கோ ஒப்படைக்கப்படுவதைக் குறிக்கிறது; உருவகத்தைத் தமிழிலும் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெய வேதத்தில் உள்ள இறைப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: כִּי רַבִּים רחמו
  choice: ஏனெனில் அவருடைய இரக்கங்கள் பல
  rationale: ‘பல’ என்ற பன்மைச் சொல்லையும் ‘இரக்கங்கள்’ என்ற வடிவத்தையும் வைத்து, எபிரெயின் சொல் அமைப்பையும் மீண்டும் மீண்டும் வெளிப்படும் இரக்கச் செயல்களின் மிகுதியையும் பாதுகாக்கிறது.
- source_word: וּבְיַד אָדָם
  choice: ஆனால் மனிதனின் கையில்
  rationale: ஆדָם இங்கு மனிதகுலத்தைப் பொதுவாகக் குறிக்கும் ஒருமை வடிவம். யாவேயின் கை—மனிதனின் கை என்ற திட்டமிட்ட முரண்பாட்டைத் தமிழில் தக்கவைக்கிறது.
- source_word: אַל אֶפֹּלָה
  choice: நான் விழாதிருப்பேனாக
  rationale: எதிர்மறைத் துகளுடன் வரும் முதலாம் நபர் வினை, தாவீதின் விருப்பத்தையும் வேண்டுதலையும் தெரிவிக்கிறது; ‘விழாதிருப்பேனாக’ அதைக் கட்டளையாக மாற்றாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயரே நேரடியாக வருகிறது. ஆகவே ஒரு பட்டப்பெயரைப் பதிலிடாமல் அதன் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- issue: யாவேயின் கைக்கும் மனிதனின் கைக்கும் இடையிலான முரண்பாடு
  choice: மூலத்தின் ‘கை’ உருவகத்தை இரு இடங்களிலும் தக்கவைத்தல்
  alternative: யாவேயின் அதிகாரத்திற்குள் / மனிதர்களின் அதிகாரத்திற்குள்
  rationale: தீர்ப்பில் யாருடைய கட்டுப்பாட்டுக்குள் விழுவது என்பதே கருத்து. ஒரே உருவகத்தை இரு இடங்களிலும் வைத்திருப்பது வசனத்தின் இறையியல் மற்றும் சொல்லாட்சிசார் அழுத்தத்தைப் பாதுகாக்கிறது.
- issue: רחמו என்பதன் பன்மை இரக்க வெளிப்பாடு
  choice: அவருடைய இரக்கங்கள் பல
  alternative: அவருடைய இரக்கம் மிகுதி
  rationale: ஒருமைச் சுருக்கம் தமிழில் இயல்பானதாக இருந்தாலும், மூலத்தின் பன்மைத் தோற்றத்தையும் இரக்கச் செயல்களின் பெருக்கத்தையும் முதன்மை உரை பாதுகாக்கிறது; இயல்பான ஒருமை மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘விழுவோமாக’, ‘விழாதிருப்பேனாக’ ஆகிய வடிவங்கள் வழக்குப் பேச்சைவிட உயர்ந்தவை; எனினும் மூலத்தின் வேண்டுதல்/விருப்ப நயத்தையும் ஒருமை–பன்மை மாற்றத்தையும் தெளிவாகப் பாதுகாக்கின்றன. ‘யாவே’ என்பது இறைப் பெயரின் தமிழ் ஒலிபெயர்ப்பு.
