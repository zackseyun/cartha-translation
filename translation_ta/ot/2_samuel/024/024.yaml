  rationale: பலிபீடத்தில் முழுவதும் எரிக்கப்படும் பலிவகையைக் குறிக்கும் நிலைபெற்ற, சுருக்கமான தமிழ்ச் சொல்.
- source_word: חִנָּם
  choice: எனக்கு எந்தச் செலவும் இல்லாமல்
  rationale: அடிப்படையில் ‘இலவசமாக/ஒன்றுமின்றி’ என்று பொருள்படும். சூழலில் தாவீது தனக்குச் செலவே இல்லாத பலியைச் செலுத்த மறுப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; நேரடியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַגֹּרֶן
  choice: போரடிக்கும் களம்
  rationale: தானியத்திலிருந்து பதரைப் பிரிக்கும் வேளாண் இடத்தைக் குறிக்கும் தெளிவான நவீனத் தமிழ் தொடர்.
- source_word: הַבָּקָר
  choice: மாடுகள்
  rationale: בָּקָר என்பது மாட்டினத்தைத் தொகுப்பாகக் குறிக்கலாம்; ‘எருதுகள்’ என்று தேவையின்றி குறிப்பாக்காமல் ‘மாடுகள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּכֶסֶף שְׁקָלִים חֲמִשִּׁים
  choice: ஐம்பது சேக்கல் வெள்ளிக்கு
  rationale: வெள்ளியின் எடையை அடிப்படையாகக் கொண்ட கொள்முதல் விலையை இயல்பான தமிழ்ச் சொல்லமைப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயரான יהוה நேரடியாக உள்ளது. அதை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், உடன்படிக்கைப் பெயராக எழுத்துப்பெயர்த்துள்ளது.
- issue: חִנָּם என்பதன் பலி சார்ந்த பொருள்
  choice: எனக்கு எந்தச் செலவும் இல்லாமல்
  alternative: இலவசமாக
  rationale: தாவீதின் கூற்று பலியைப் பெறுவதற்கான தனிப்பட்ட செலவைச் சூழலில் சுட்டுகிறது. இருப்பினும் எபிரெயச் சொல்லின் சுருக்கமான ‘இலவசமாக’ என்ற பொருள் அடிக்குறிப்பில் வைக்கப்பட்டு, அதிலுள்ள மொழியியல் திறந்தநிலை பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: மொழிநடை நவீன, மரியாதைமிக்க பொதுத் தமிழாக வைக்கப்பட்டுள்ளது. அரசன் அரவுனாவை நோக்கிப் பேசுவதால் ‘உம்மிடமிருந்து’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. ‘வாங்கியே தீருவேன்’ மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது; பலி தொடர்பான சொற்கள் சபைமரபுச் சாயலை மிகைப்படுத்தாமல் பொதுவாகப் புரியும் வகையில் தேர்ந்தெடுக்கப்பட்டுள்ளன.
