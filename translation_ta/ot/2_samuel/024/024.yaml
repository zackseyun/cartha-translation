  yaml_path: translation/ot/2_samuel/024/024.yaml
  text: But the king said to Araunah[a], “No, but I will surely buy it from you for a price[c][b]. I will not offer to Yahweh my God burnt offerings that cost me nothing.” So David bought the threshing floor and the cattle for fifty shekels of silver.
translation:
  language: ta
  text: ஆனால் அரசன் அரவுனாவிடம், “இல்லை; விலை கொடுத்து உம்மிடமிருந்து அதை நான் வாங்கியே தீருவேன். எனக்கு எந்தச் செலவும் இல்லாமல்[a] என் கடவுளாகிய யாவேக்குத் தகனபலிகளைச் செலுத்தமாட்டேன்” என்றான். பின்பு தாவீது அந்தப் போரடிக்கும் களத்தையும் மாடுகளையும்[b] ஐம்பது சேக்கல் வெள்ளிக்கு வாங்கினான்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “இலவசமாக” அல்லது “ஒன்றுமின்றி.”
    reason: lexical_alternative
  - marker: b
    text: “மாடுகள்” என்பதற்கு “எருதுகள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் மாட்டினத்தைப் பொதுவாகவோ, உழவுக்கும் பலிக்கும் பயன்படுத்தப்பட்ட எருதுகளைக் குறிப்பாகவோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: 1 நாளாகமம் 21:25-ல் தாவீது அந்த இடத்திற்காக அறுநூறு சேக்கல் தங்கம் கொடுத்ததாக உள்ளது; இவ்வசனம் போரடிக்கும் களத்திற்கும் மாடுகளுக்கும் ஐம்பது சேக்கல் வெள்ளி கொடுத்ததைத் தனியாகக் குறிப்பிடுகிறது.
    reason: cross_reference
