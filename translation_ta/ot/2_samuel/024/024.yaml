  choice: அரவுனா
  rationale: இவ்வசனத்தின் எபிரெயப் பெயர்வடிவத்தைத் தமிழ் ஒலிப்புமுறைக்கு ஏற்றவாறு எழுத்துப்பெயர்த்துள்ளது; நாளாகம இணைப்பகுதியிலுள்ள ‘ஒர்னான்’ வடிவத்தை இங்கு கொண்டு வரவில்லை.
- source_word: קָנוֹ אֶקְנֶה
  choice: நான் வாங்கியே தீருவேன்
  rationale: வினையெச்சப் பெயருடன் வினைச்சொல் திரும்ப வருவது வாங்கும் செயலை வலியுறுத்துகிறது; ‘வாங்கியே தீருவேன்’ என்பது அந்த அழுத்தத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בִּמְחִיר
  choice: உரிய விலை கொடுத்து
  rationale: מְחִיר என்பது கொள்முதல் விலை அல்லது பணம் செலுத்துதலைக் குறிக்கிறது. ‘உரிய’ என்பது இலவசமாக ஏற்க மறுக்கும் சூழலைத் தெளிவாக்குகிறது; குறிப்பிட்ட தொகையை முன்கூட்டியே நிர்ணயிப்பதில்லை.
- source_word: לַיהוָה אֱלֹהַי
  choice: என் கடவுளாகிய யாவேக்கு
  rationale: முதலாம் நபர் உரிமை விகுதியை ‘என் கடவுள்’ எனப் பாதுகாத்து, יהוה என்ற உடன்படிக்கைப் பெயரை ‘யாவே’ என எழுத்துப்பெயர்க்கிறது.
- source_word: עֹלוֹת
