translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளை கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘சுற்றிப் பயணம் செய்து’ என்பது பயணத்தின் பரவலான இயக்கத்தை வெளிப்படுத்துகிறது; தேவையற்ற விளக்கமோ சமயப்பிரிவு சார்ந்த மொழியோ சேர்க்கப்படவில்லை.
