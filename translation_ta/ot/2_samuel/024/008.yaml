  yaml_path: translation/ot/2_samuel/024/008.yaml
  text: They traveled throughout all the land, and at the end of nine months and twenty days they came to Jerusalem.
translation:
  language: ta
  text: அவர்கள் நாடு முழுவதும் சுற்றிப் பயணம் செய்து, ஒன்பது மாதங்களும் இருபது நாட்களும் முடிவடைந்தபோது எருசலேமுக்கு வந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁטוּ
  choice: சுற்றிப் பயணம் செய்து
  rationale: שׁוט என்பது ஓர் பகுதி முழுவதிலும் அங்குமிங்கும் செல்வதைக் குறிக்கிறது. மக்கள்தொகைக் கணக்கெடுப்புக்கான பயணச் சூழலில், நோக்கமின்றி அலைந்தார்கள் என்ற பொருளைத் தவிர்த்து அதன் பரப்பளவு சார்ந்த நுணுக்கத்தை இந்தத் தொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּכָל הָאָרֶץ
  choice: நாடு முழுவதும்
  rationale: ב + כל + הארץ என்பது சம்பந்தப்பட்ட பிரதேசம் முழுவதிலும் நடந்த இயக்கத்தைக் குறிக்கிறது. இச்சூழலில் הארץ என்பது பூமியையல்ல, கணக்கெடுக்கப்பட்ட நாட்டைக் குறிப்பதால் ‘நாடு’ பொருத்தமானது.
- source_word: וַיָּבֹאוּ
  choice: வந்தார்கள்
  rationale: בוא என்பதன் வழக்கமான ‘வருதல்’ என்ற பொருளைத் தக்கவைத்து, எருசலேம் இலக்காகக் குறிப்பிடப்படும் எபிரெயக் கதையோட்டத்தையும் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: מִקְצֵה
  choice: முடிவடைந்தபோது
  rationale: குறிப்பிடப்பட்ட கால அளவு நிறைவுற்ற புள்ளியை இச்சொல் குறிக்கிறது. ‘முடிவடைந்தபோது’ என்பது ‘ஒன்பது மாதங்களும் இருபது நாட்களும்’ என்பதோடு இயல்பாக இணைந்து, காலநிறைவைக் காட்டுகிறது.
- source_word: תִשְׁעָה חֳדָשִׁים וְעֶשְׂרִים יוֹם
  choice: ஒன்பது மாதங்களும் இருபது நாட்களும்
  rationale: எபிரெய மூலத்தின் கால அளவைத் துல்லியமாகவும் நவீனத் தமிழில் இயல்பாகவும் தருகிறது. ‘முடிவடைந்தபோது’ என்பதுடன் பொருந்துமாறு ‘-உம்’ இணைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְרוּשָׁלִָם
  choice: எருசலேம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம்.
