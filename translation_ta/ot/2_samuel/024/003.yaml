base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/003.yaml
  text: But Joab said to the king[a], “May Yahweh your God add to the people a hundred times as many as they are, and may the eyes of my lord the king see it. But why does my lord the king delight in this thing?”
translation:
  language: ta
  text: ஆனால் யோவாப் அரசனிடம், “உங்கள் கடவுளான யாவே மக்களின் எண்ணிக்கையை இப்போதுள்ள எண்ணிக்கையைவிட நூறு மடங்கு அதிகரிப்பாராக; என் ஆண்டவராகிய அரசனின் கண்களும் அதைக் காண்பதாக.[a] ஆனால் என் ஆண்டவராகிய அரசன் இந்தக் காரியத்தை ஏன் விரும்புகிறார்?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் ஆண்டவராகிய அரசனின் கண்களும் அவர்களைக் காண்பதாக.” எபிரெயத்தில் ‘காண்பதாக’ என்பதன் செயப்படுபொருள் வெளிப்படையாகக் கூறப்படவில்லை; மக்கள் இவ்வாறு பெருகுவதை அரசன் உயிரோடிருந்து காண வேண்டும் என்பதே கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் ... என்றான்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுத்தாலும், அரசனின் கட்டளைக்கு யோவாப் எதிர்வினையாற்றும் சூழலில் ‘ஆனால்’ என்ற எதிர்மறைத் தொடர்பு இயல்பாக உள்ளது.
- source_word: יוֹאָב
  choice: யோவாப்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: הַמֶּלֶךְ
  choice: அரசனிடம்
  rationale: உறுதியான அரசப் பட்டத்தைத் தமிழில் இயல்பான உரையாடல் அமைப்புடன் வழங்குகிறது.
- source_word: וְיוֹסֵף
  choice: பெருகச் செய்வாராக
  rationale: சூழலில் இது விருப்பம் அல்லது வாழ்த்தைக் குறிக்கும் யுசிவ் நுணுக்கம் கொண்டது; தமிழில் ‘-ஆராக’ அதை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பொதுப்பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை உரிமை விகுதியை, அரசனுக்குரிய மரியாதைப் பன்மையுடன் இயல்பாக வழங்குகிறது.
- source_word: אֶל הָעָם
  choice: மக்களை
  rationale: עָם என்பதன் பரந்த பொருளான ‘மக்கள்’ என்பதைக் காக்கிறது; படை அல்லது தேசம் என்று அளவுக்கு மீறிக் குறிப்பாக்கவில்லை.
- source_word: כָּהֵם וְכָהֵם מֵאָה פְעָמִים
  choice: இப்போது இருப்பதைப்போல் நூறு மடங்காக
  rationale: தற்போதைய எண்ணிக்கையின் நூறு மடங்கு என்ற எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: וְעֵינֵי אֲדֹנִי הַמֶּלֶךְ רֹאוֹת
  choice: என் ஆண்டவராகிய அரசனின் கண்களும் அதைக் காண்பதாக
  rationale: அரசன் அந்தப் பெருக்கைக் காண உயிரோடிருக்க வேண்டும் என்ற வாழ்த்தை வெளிப்படுத்துகிறது; எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாததால் குறிப்புடன் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: לָמָּה חָפֵץ בַּדָּבָר הַזֶּה
  choice: இந்தக் காரியத்தை ஏன் விரும்புகிறார்?
  rationale: חפץ என்பதன் ‘விரும்பு/மகிழ்ச்சி கொள்’ என்ற பொருளை இச்சூழலில் இயல்பாகவும் நேரடியாகவும் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக இருப்பதால், அதைப் பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: அரசன் காண வேண்டும் என்ற கூற்றின் இலக்கண நுணுக்கம்
  choice: கண்களும் அதைக் காண்பதாக
  alternative: அரசனின் கண்கள் பார்த்துக்கொண்டிருக்கும்போதே
  rationale: முந்தைய ‘பெருகச் செய்வாராக’ என்ற விருப்பவாக்கியத்துடன் இணைந்த வாழ்த்தாக வாசிப்பது சூழலுக்கு ஏற்றது; இருப்பினும் எபிரெய வடிவம் வெளிப்படையான செயப்படுபொருளை வழங்காததால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக்குரிய மரியாதையைப் பேணும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. அரசனை நோக்கிய ஒருமை விகுதிகள் தமிழில் மரியாதைப் பன்மையாக வழங்கப்பட்டுள்ளன; ‘என் ஆண்டவராகிய அரசன்’ என்ற அரசவை அழைப்புமுறை பாதுகாக்கப்பட்டுள்ளது.
