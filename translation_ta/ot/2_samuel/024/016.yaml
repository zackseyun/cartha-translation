  text: וַ/יִּשְׁלַח֩ יָד֨/וֹ הַ/מַּלְאָ֥ךְ יְרֽוּשָׁלִַם֮ לְ/שַׁחֲתָ/הּ֒ וַ/יִּנָּ֤חֶם יְהוָה֙ אֶל הָ֣/רָעָ֔ה וַ֠/יֹּאמֶר לַ/מַּלְאָ֞ךְ הַ/מַּשְׁחִ֤ית בָּ/עָם֙ רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ וּ/מַלְאַ֤ךְ יְהוָה֙ הָיָ֔ה עִם גֹּ֖רֶן ה/אורנה הַ/יְבֻסִֽי׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/016.yaml
  text: When the angel stretched out his hand toward Jerusalem to destroy it[a], Yahweh relented concerning the calamity and said to the angel who was destroying the people, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was by the threshing floor of Araunah the Jebusite.
translation:
  language: ta
  text: எருசலேமை அழிப்பதற்காகத் தூதன் தன் கையை நீட்டியபோது, யாவே அந்தப் பேரழிவை ஏற்படுத்துவதை நிறுத்தினார்[a]. மக்களை அழித்துக்கொண்டிருந்த தூதனிடம் அவர், “போதும்; இப்போது உன் கையை நிறுத்து” என்றார். யாவேயின் தூதன் எபூசியனான அரவுனாவின் போரடிக்கும் களத்தருகே இருந்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பேரழிவு’ என்பதற்கான எபிரெயச் சொல் רָעָה; இங்கு அது அறநெறித் தீமையை அல்ல, பேரிடர் அல்லது அழிவைக் குறிக்கிறது. இத்தொடரை, ‘யாவே அந்தப் பேரழிவைக் குறித்து மனம் மாறினார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 1 நாளாகமம் 21:15-இல் இணையான நிகழ்வில் அரவுனா ‘ஒர்னான்’ என்று அழைக்கப்படுகிறார்.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: தன் கையை நீட்டியபோது
  rationale: שׁלח + יד என்பது செயலில் இறங்குவதற்காகக் கையை நீட்டுவதைக் குறிக்கும் மரபுத்தொடர்; தமிழிலும் அதன் காட்சிப்படிமம் இயல்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: הַמַּלְאָךְ
  choice: தூதன்
  rationale: இச்சூழலில் இது கொள்ளைநோய் மற்றும் தீர்ப்பை நிறைவேற்றும் வானுலகத் தூதனைக் குறிக்கிறது.
- source_word: לְשַׁחֲתָהּ
  choice: எருசலேமை அழிப்பதற்காக
  rationale: שׁחת என்பதன் அழிவுச் செயலை நேரடியாகத் தெரிவிக்கிறது; தமிழில் பெண்பால் நகரைக் குறிக்கும் தனிப் பதிலிப்பெயர் தேவையில்லை.
- source_word: וַיִּנָּחֶם יְהוָה אֶל הָרָעָה
  choice: யாவே அந்தப் பேரழிவைக் குறித்து மனமிரங்கினார்
  rationale: נחם என்பதன் இங்குள்ள பொருள் தொடர்ந்து வரவிருந்த தண்டனையிலிருந்து இரங்கி விலகுதல்; אֶל என்ற தொடர்பையும் ‘குறித்து’ காக்கிறது. רָעָה இங்கே அறநெறித் தீமையல்ல, அழிவை உண்டாக்கும் பேரிடர்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הַמַּשְׁחִית בָּעָם
  choice: மக்களை அழித்துக்கொண்டிருந்த
  rationale: எபிரெயப் பெயரெச்சம் அப்போது தொடர்ந்து நடந்துகொண்டிருந்த அழிவுச் செயலைக் காட்டுவதால், தமிழில் தொடர்நிலை உறவுத்தொடராக வழங்கப்பட்டுள்ளது.
- source_word: רַב
  choice: போதும்
  rationale: இங்கு ‘போதுமானது’ என்ற வலிமையான இடைச்சொல்; சுருக்கமான கட்டளையாக ‘போதும்’ இயல்பாக உள்ளது.
- source_word: עַתָּה הֶרֶף יָדֶךָ
  choice: இப்போது உன் கையை நிறுத்து
  rationale: הרף என்பது செயலை விட்டுவிடுதல் அல்லது நிறுத்துதல். ‘கை’ என்ற மூலப்படிமத்தையும் செயலை நிறுத்தும் பொருளையும் இந்த மொழிபெயர்ப்பு காக்கிறது.
- source_word: הָיָה עִם
  choice: களத்தருகே இருந்தான்
  rationale: עִם இவ்விடச்சூழலில் அருகாமையைக் குறிக்கிறது; ‘அருகே’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: גֹּרֶן
  choice: போரடிக்கும் களம்
  rationale: அறுவடை செய்யப்பட்ட தானியத்திலிருந்து மணியைப் பிரிக்கும் இடத்தைக் குறிக்கும் விவசாயச் சொல்லுக்கு இயல்பான தமிழ் இணை.
- source_word: הָאֹרְנָה
  choice: அரவுனா
  rationale: சாமுவேல் நூலிலுள்ள אֲרַוְנָה என்ற பெயரின் வடிவத்தை ஒலிபெயர்க்கிறது; நாளாகமத்தின் ‘ஒர்னான்’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: וַיִּנָּחֶם יְהוָה என்பதில் கடவுளைப் பற்றிய மனித உணர்வுசார் மொழி
  choice: யாவே அந்தப் பேரழிவைக் குறித்து மனமிரங்கினார்
  alternative: யாவே அந்தப் பேரழிவிலிருந்து பின்வாங்கினார் / அந்தத் தீமைக்காக வருந்தினார்
  rationale: மூலவாக்கியம் தீர்ப்பைத் தொடராமல் இரங்கியதைச் சொல்கிறது. ‘மனமிரங்கினார்’ என்பது உரையின் உறவுசார் வலிமையைப் பாதுகாக்கிறது; கடவுள் அறநெறித் தவறு செய்தார் என்று பொருள்படச் செய்வதில்லை. ‘குறித்து’ என்பது எபிரெய மொழியின் உண்மையான நுட்பத்தையும் திறந்தவாறே வைக்கிறது.
- issue: מַלְאַךְ יְהוָה என்பவரின் அடையாளம்
  choice: யாவேயின் தூதன்
  alternative: இறைத்தோற்றம் / படைக்கப்பட்ட வானதூதன்
  rationale: வசனம் அவரை ‘யாவேயின் தூதன்’ என்றே குறிப்பிடுகிறது; அவர் இறைத்தோற்றமா அல்லது படைக்கப்பட்ட தூதரா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மனமிரங்கினார்’ என்பது இயல்பான தமிழ் மற்றும் மூலத்தின் மனித உணர்வுசார் சொல்லாட்சியைப் பாதுகாக்கும் தேர்வு. இறைப்பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது; ‘யாவேயின் தூதன்’ என்ற சொற்றொடரின் இறையியல் அடையாளம் விளக்கித் தீர்மானிக்கப்படவில்லை.
