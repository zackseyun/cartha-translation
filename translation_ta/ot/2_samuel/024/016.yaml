  source_fidelity: 'முதன்மைச் சிக்கல் וַיִּנָּחֶם יְהוָה אֶל־הָרָעָה என்பதில் உள்ளது. ‘அந்தப் பேரழிவைக் குறித்து மனமிரங்கினார்’ என்பது யாவே பேரழிவின்மேல் இரக்கம் கொண்டார் என்பதைக் குறிப்பதாக இயல்பாகப் புரியலாம்; ஆனால் எபிரெய வினைச்சொல் இச்சூழலில் திட்டமிட்ட பேரழிவைத் தொடராமல் விலகுதல்/நிறுத்துதலைக் குறிக்கிறது. மற்ற கூறுகள் மூலத்திற்குச் செவ்வனே அமைந்துள்ளன: தூதன் கையை நீட்டுதல், அழிவு, ‘போதும்’, கையை நிறுத்தும் கட்டளை, அரவுனாவின் போரடிக்கும் களத்தருகே தூதன் இருந்தமை ஆகியவை காக்கப்பட்டுள்ளன.'
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாக உள்ளது. ‘போரடிக்கும் களம்’ பொருத்தமான விவசாயச் சொல்லாகும். ஆனால் ‘பேரழிவைக் குறித்து மனமிரங்கினார்’ தமிழில் இயல்பாக இருந்தாலும், இவ்வசனத்தில் வேண்டிய ‘பேரழிவைத் தொடராமல் நிறுத்துதல்’ என்ற பொருளைத் தெளிவாகக் கொண்டுவரவில்லை.
  terminology: ‘யாவே’, ‘தூதன்’, ‘யாவேயின் தூதன்’, ‘எபூசியனான’, ‘அரவுனா’ ஆகியவை பொருத்தமானவை. ‘பேரழிவு’ רָעָה என்பதற்குச் சூழலுக்கு ஏற்றது; அது அறநெறித் தீமை அல்ல என்பதை அடிக்குறிப்பு சரியாக விளக்குகிறது. அடிக்குறிப்பு குறியீடுகள் தமிழில் பொருத்தமான இடங்களில் இணைக்கப்பட்டுள்ளன.
