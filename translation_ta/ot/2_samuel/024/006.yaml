source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ הַ/גִּלְעָ֔דָ/ה וְ/אֶל אֶ֥רֶץ תַּחְתִּ֖ים חָדְשִׁ֑י וַ/יָּבֹ֨אוּ֙ דָּ֣נָ/ה יַּ֔עַן וְ/סָבִ֖יב אֶל צִידֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/006.yaml
  text: They came to Gilead and to the land of Tahtim-hodshi[a], and they came to Dan-jaan[b], and around to Sidon.
translation:
  language: ta
  text: அவர்கள் கிலேயாத்துக்கும் தக்தீம்-ஹோத்ஷி[a] நாட்டுக்கும் வந்தார்கள்; பின்னர் தாண்-யானுக்கு[b] வந்து, சுற்றிவந்து சீதோனுக்குச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தக்தீம்-ஹோத்ஷி” என்ற எபிரெயப் பெயரின் பொருள் தெளிவில்லை. சிலர் மூல உரையைத் திருத்தி அல்லது வேறுவிதமாகப் புரிந்துகொண்டு, “காதேசிலுள்ள ஏத்தியரின் நாடு” என்பதுபோல் மொழிபெயர்க்கிறார்கள்; ஆனால் அந்த இடத்தின் பெயர் உறுதியாகத் தெரியவில்லை.
    reason: alternative_reading
  - marker: b
    text: “தாண்-யான்” என்பது பெரும்பாலும் ஓர் இடப்பெயராகக் கருதப்படுகிறது; அது எந்த இடம் என்பது உறுதியாகத் தெரியவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: வந்தார்கள்
  rationale: בוא என்பதன் தொடர்கதை வடிவம் பயணத்தின் அடுத்த கட்டத்தைச் சுட்டுகிறது. முதல் இரு இடங்களுடன் ‘வந்தார்கள்’ என்பது இயல்பான தமிழாக்கம்; எபிரெயச் சொல்லின் மறுபயன்பாட்டை ‘பின்பு ... வந்து’ எனப் பிரதிபலிக்கிறது.
- source_word: הַגִּלְעָדָה
  choice: கிலேயாத்துக்கும்
  rationale: இடப்பெயருடன் சேர்ந்த திசைச்சுட்டு -ה, கிலேயாத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் வேற்றுமை உருபால் இயல்பாகத் தரப்படுகிறது.
- source_word: אֶרֶץ
  choice: நாட்டுக்கும்
  rationale: இங்கு אֶרֶץ என்பது பூமி முழுவதையும் அல்ல, ஒரு நிலப்பரப்பு அல்லது பிரதேசத்தைக் குறிக்கிறது.
- source_word: תַּחְתִּים חָדְשִׁי
  choice: தக்தீம்-ஒத்சி
  rationale: இச்சொற்றொடரின் உரையும் புவியியல் அடையாளமும் தெளிவற்றவை. ஊகத் திருத்தத்தை முதன்மை உரையில் ஏற்காமல், இடப்பெயராக ஒலிபெயர்ப்பது மூலத்தின் ஐயத்தைப் பாதுகாக்கிறது.
- source_word: דָּנָה יַּעַן
  choice: தாண்-யான்
  rationale: இது பெரும்பாலும் ஓர் இடப்பெயராகப் புரிந்துகொள்ளப்படுகிறது. דנה-இலுள்ள திசைச்சுட்டு பயண வினையுடன் இயல்பாக வெளிப்படுகிறது.
- source_word: וְסָבִיב אֶל צִידוֹן
  choice: அங்கிருந்து சீதோனைச் சுற்றியுள்ள பகுதிகளுக்குச் சென்றார்கள்
  rationale: சொல்லுக்கு சொல் ‘சீதோனை நோக்கிச் சுற்றிலும்’ என்பது தமிழில் தெளிவில்லாமல் இருக்கும். סָבִיב குறிக்கும் சுற்றுப்புற இயக்கத்தையும் אֶל צִידוֹן குறிக்கும் சீதோனை நோக்கிய தொடர்பையும் இயல்பான பயணவிவரமாக வழங்குகிறது; துல்லியமான பயணத் திசையில் சிறு தெளிவின்மை நீடிக்கிறது.
