translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் கண்ணியமான பயணவிவர நடையில் மொழிபெயர்க்கப்பட்டது. தெளிவற்ற இரு இடப்பெயர்களும் ஊகமாக விளக்கப்படாமல் ஒலிபெயர்க்கப்பட்டு, அவற்றின் ஐயம் அடிக்குறிப்புகளில் தெரிவிக்கப்பட்டுள்ளது.
