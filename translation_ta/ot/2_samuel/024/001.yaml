source:
  edition: WLC
  text: וַ/יֹּ֨סֶף֙ אַף יְהוָ֔ה לַ/חֲר֖וֹת בְּ/יִשְׂרָאֵ֑ל וַ/יָּ֨סֶת אֶת דָּוִ֤ד בָּ/הֶם֙ לֵ/אמֹ֔ר לֵ֛ךְ מְנֵ֥ה אֶת יִשְׂרָאֵ֖ל וְ/אֶת יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/001.yaml
  text: Again the anger of Yahweh burned against Israel[a], and he incited David against them, saying, “Go[b], count Israel and Judah.”
translation:
  language: ta
  text: இஸ்ரவேலுக்கு எதிராக யாவேயின் கோபம் மீண்டும் பற்றியெரிந்தது.[a] அவர் தாவீதை அவர்களுக்கு எதிராகத் தூண்டி, “நீ போய்[b] இஸ்ரவேலையும் யூதாவையும் எண்ணு” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 நாளாகமம் 21:1-ல், சாத்தான் இஸ்ரவேலுக்கு எதிராக எழுந்து தாவீதைத் தூண்டினான் என்று கூறப்படுகிறது. இங்குள்ள முதன்மை உரை 2 சாமுவேலின் எபிரேய வாக்கியத்தில் இயல்பாக அமைந்துள்ள எழுவாயைப் பின்பற்றி, இரு விவரிப்புகளுக்கிடையேயான பதற்றத்தை இசைவாக்காமல் அப்படியே காக்கிறது.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘தொகையிடு’; ‘மக்கள்தொகைக் கணக்கெடு.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: மீண்டும்
  rationale: தொடர்ந்து வரும் கோபம் பற்றியெரிதலுடன் சேர்ந்து, செயல் மறுபடியும் நிகழ்ந்ததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: אַף יְהוָה לַחֲרוֹת
  choice: யாவேயின் கோபம் ... பற்றியெரிந்தது
  rationale: אַף என்பதன் கோபம் என்னும் மரபுப்பொருளையும் חרה אף என்ற எபிரேய உருவகத்தின் ‘எரிதல்’ கருத்தையும் தெளிவான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத்திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராக
  rationale: இந்தச் சொற்றொடரில் கோபம் இஸ்ரவேலை நோக்கி இருப்பதைத் தெரிவிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: וַיָּסֶת
  choice: அவர் ... தூண்டி
  rationale: செயலைச் செய்யுமாறு ஒருவரைத் தூண்டும் סות வினையின் காரணவினைப் பொருளை வழங்குகிறது.
- source_word: בָּהֶם
  choice: அவர்களுக்கு எதிராக
  rationale: கடினமான இச்சொற்றொடரின் சூழல்சார் பொருளை வெளிப்படுத்துகிறது; தாவீதின் நடவடிக்கை மக்களுக்கு எதிரான விளைவைக் கொண்டதாகக் காட்டுகிறது.
- source_word: לֵאמֹר
  choice: என்றார்
  rationale: நேர்கூற்றை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: לֵךְ
  choice: நீ போய்
  rationale: கட்டளையின் நேரடியான பொருளைத் தருகிறது; தமிழில் அடுத்த வினையுடன் இயல்பாக இணைகிறது.
- source_word: מְנֵה
  choice: எண்ணு
  rationale: מנה என்பதன் அடிப்படைப் பொருளான எண்ணுதல் அல்லது தொகையிடுதலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: יִשְׂרָאֵל וְאֶת יְהוּדָה
  choice: இஸ்ரவேலையும் யூதாவையும்
  rationale: மூலத்தில் தனித்தனியாகக் குறிப்பிடப்படும் இரு அரசியல்/மக்கள் அலகுகளின் பெயர்களை விரிவாக்கமின்றிக் காக்கிறது.
theological_decisions:
- issue: 1 நாளாகமம் 21:1 உடன் ஒப்பிடும்போது தாவீது தூண்டப்பட்டதில் இறைச் செயலாண்மை
  choice: அவர் தாவீதை ... தூண்டி
  alternative: ஒருவன் தாவீதைத் தூண்டினான்; அல்லது நாளாகமத்துடன் இசைவாக்கி ‘சாத்தான் தாவீதைத் தூண்டினான்’
  rationale: וַיָּסֶת என்பதன் இயல்பான எழுவாய் முன்பு குறிப்பிடப்பட்ட யாவே. ஆகவே 2 சாமுவேலின் எபிரேய உரையைப் பின்பற்றி, 1 நாளாகமம் 21:1 உடனான இறையியல் பதற்றத்தை இசைவாக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரேய உருவகமும் உரையிலுள்ள இறையியல் பதற்றமும் காக்கப்பட்டுள்ளன. ‘யாவே’ இறைத்திருப்பெயரின் தமிழ் ஒலிபெயர்ப்பாகப் பயன்படுத்தப்பட்டுள்ளது.
