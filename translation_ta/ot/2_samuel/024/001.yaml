  source_fidelity: 'எபிரேய மூலத்தின் தொடர்ச்சியையும் முக்கியப் பொருள்களையும் மொழிபெயர்ப்பு துல்லியமாகக் காக்கிறது: யாவேயின் கோபம் மீண்டும் இஸ்ரவேலுக்கு எதிராக எரிதல், யாவே தாவீதைத் தூண்டுதல், இஸ்ரவேலையும் யூதாவையும் எண்ணுமாறு கட்டளையிடல் ஆகியவை அனைத்தும் தெளிவாக உள்ளன. בָּהֶם என்பதன் சூழலால் நிர்ணயிக்கப்படும் கடினமான ‘அவர்களுக்கு எதிராக’ என்பதும் பொருத்தமாகத் தரப்பட்டுள்ளது.'
