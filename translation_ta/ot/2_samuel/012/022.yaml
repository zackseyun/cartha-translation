source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בְּ/עוֹד֙ הַ/יֶּ֣לֶד חַ֔י צַ֖מְתִּי וָֽ/אֶבְכֶּ֑ה כִּ֤י אָמַ֨רְתִּי֙ מִ֣י יוֹדֵ֔עַ יחנ/ני יְהוָ֖ה וְ/חַ֥י הַ/יָּֽלֶד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/022.yaml
  text: He said[a], “While the child was still alive, I fasted and wept, because I said, ‘Who knows? Yahweh may be gracious to me, and the child may live.’”
translation:
  language: ta
  text: அவர், “குழந்தை இன்னும் உயிரோடிருந்தபோது நான் நோன்பிருந்து அழுதேன். ஏனெனில், ‘யாருக்குத் தெரியும்? யாவே என்மேல் அருள்கூரலாம்; குழந்தையும் உயிர்வாழலாம்’ என்று சொன்னேன்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּעוֹד הַיֶּלֶד חַי
  choice: குழந்தை உயிரோடிருந்தபோது
  rationale: בְּעוֹד தொடர்ந்திருந்த கடந்தகால நிலையைக் குறிக்கிறது; இயல்பான தமிழில் ‘உயிரோடிருந்தபோது’ என்பது அந்தக் காலத் தொடர்பையும் குழந்தை அப்போது உயிருடன் இருந்ததையும் தெளிவாகத் தருகிறது.
- source_word: צַמְתִּי
  choice: நான் நோன்பிருந்தேன்
  rationale: צום உணவைத் தவிர்த்து நோன்பிருப்பதைக் குறிக்கிறது; ‘நோன்பிருந்தேன்’ என்பது சுருக்கமான, வழக்கமான தமிழ் வடிவம்.
- source_word: וָאֶבְכֶּה
  choice: அழுதேன்
  rationale: בכה அழுதல் அல்லது கண்ணீர் விடுதலைக் குறிக்கிறது; இச்சூழலின் துயரத் தொனிக்கு ‘அழுதேன்’ இயல்பாகப் பொருந்துகிறது.
- source_word: כִּי אָמַרְתִּי
  choice: ஏனெனில், … என்று நினைத்தேன்
  rationale: כִּי காரணத்தை அறிமுகப்படுத்துகிறது. இங்கு אָמַרְתִּי தாவீதின் உள்ளார்ந்த எண்ணத்தைச் சுட்டுவதால், சொல்லுக்குச் சொல் ‘சொன்னேன்’ என்பதற்குப் பதிலாக இயல்பான தமிழில் ‘நினைத்தேன்’ என வழங்கப்பட்டுள்ளது.
- source_word: מִי יוֹדֵעַ
  choice: யாருக்குத் தெரியும்?
  rationale: இந்த எபிரெய மொழிமரபு, அடுத்து என்ன நிகழலாம் என்பதைக் குறித்த உறுதியின்மையோடு கூடிய நம்பிக்கையை வெளிப்படுத்துகிறது; ‘யாருக்குத் தெரியும்?’ அதைப் பேச்சுவழக்குக்கு மிகாமல் இயல்பாகத் தருகிறது.
- source_word: יְחָנֵּנִי
  choice: என்மேல் அருள்கூரலாம்
  rationale: חנן தகுதியின் அடிப்படையிலல்லாமல் தயவு அல்லது அருள் காட்டுவதைக் குறிக்கிறது. ‘அருள்கூர்’ நேரடி தனிப்பட்ட பொருளையும் வேதாகமத்திற்குரிய கண்ணியமான தொனியையும் காக்கிறது; ‘லாம்’ உறுதியின்மையை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் தெளிவாக உச்சரிக்கத்தக்க ‘யாவே’ என்ற ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: וְחַי הַיָּלֶד
  choice: குழந்தையும் உயிர்பிழைக்கலாம்
  rationale: חיה இங்கு குழந்தை தொடர்ந்து உயிருடன் இருப்பதைக் குறிக்கிறது. முன்னுள்ள ‘யாருக்குத் தெரியும்?’ என்பதன் உறுதியின்மையையும் தாவீதின் நம்பிக்கையையும் ‘உயிர்பிழைக்கலாம்’ காக்கிறது; וְ இணைப்பை ‘உம்’ பிரதிபலிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் இறைவனுடைய தனிப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: இறைவன் எவ்வாறு பதிலளிப்பார் என்பதைக் குறித்த தாவீதின் எதிர்பார்ப்பு
  choice: யாவே என்மேல் அருள்கூரலாம்; குழந்தையும் உயிர்பிழைக்கலாம்
  alternative: யாவே என்மேல் அருள்கூருவார்; குழந்தை உயிர்பிழைக்கும்
  rationale: ‘யாருக்குத் தெரியும்?’ என்பது உறுதியான நம்பிக்கையையோ முன்னறிவிப்பையோ அல்ல, சாத்தியத்தை எதிர்நோக்கும் நம்பிக்கையையே காட்டுகிறது. ஆகவே இரு கூறுகளிலும் உறுதியின்மை காக்கப்பட்டுள்ளது.
- issue: வாவ் இணைப்பின் பொருள் உறவு
  choice: அருள்கூரலாம்; குழந்தையும் உயிர்பிழைக்கலாம்
  alternative: அருள்கூர்ந்து குழந்தையை உயிர்வாழச் செய்யலாம்
  rationale: וְ இரண்டு கூறுகளை இணைக்கிறது; இரண்டாவது கூறு விளைவாகப் புரிந்துகொள்ளப்படலாம், ஆனால் இறைவன் குழந்தையை நேரடியாக உயிர்வாழச் ‘செய்வார்’ என்ற காரணவியல் மூலத்தில் வெளிப்படையாக இல்லை. முதன்மை உரை அந்தத் திறந்த நிலையைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. ‘நோன்பிருந்தேன்,’ ‘அருள்கூரலாம்,’ ‘உயிர்பிழைக்கலாம்’ ஆகியவை மூலத்தின் சுருக்கத்தையும் தாவீதின் துயரம், விண்ணப்பம், உறுதியின்மை ஆகியவற்றையும் காக்கின்றன.
