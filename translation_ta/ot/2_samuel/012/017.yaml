  register: நவீனத் தரத்தமிழில் மரியாதையும் இயல்பும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘வீட்டின் மூப்பர்கள்’ மற்றும் ‘அப்பம் உண்ணுதல்’ ஆகிய மூலமொழிச் சாயல்கள் முதன்மை உரையில் பேணப்பட்டு, அவற்றின் விரிவான பொருள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளது.
