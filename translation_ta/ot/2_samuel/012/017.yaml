base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/017.yaml
  text: The elders of his house stood beside him to raise him up from the ground[a], but he was unwilling[b], and he would not eat bread with them.
translation:
  language: ta
  text: அவனுடைய இல்லத்தின் மூப்பர்கள்[a] அவனைத் தரையிலிருந்து எழுப்புவதற்காக அவனருகில் எழுந்து நின்றார்கள். ஆனால் அவன் இணங்கவில்லை; அவர்களோடு அப்பம் உண்ணவும் அவன் விரும்பவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனுடைய வீட்டாரின் மூப்பர்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் சொற்பட, ‘அவனுடைய வீட்டின் மூப்பர்கள்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘அவர்களோடு அப்பம்’ என்ற வெளிப்பாடு உள்ளது; இது அவர்களோடு உணவு உட்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: எழுந்து நின்றார்கள்
  rationale: קום என்பதன் எழுதல்/நிற்றல் சார்ந்த நேரடியான செயலைக் காட்டுகிறது; மூப்பர்கள் தாவீதுக்கு உதவ முனைந்த காட்சிக்கும் இயல்பாகப் பொருந்துகிறது.
- source_word: זִקְנֵי בֵיתוֹ
  choice: அவனுடைய வீட்டின் மூப்பர்கள்
  rationale: எபிரெயக் கட்டமைப்பான ‘அவனுடைய வீட்டின் மூப்பர்கள்’ என்பதை நெருக்கமாகப் பேணுகிறது; இங்கு ‘வீடு’ என்பது அரச குடும்பத்தார் அல்லது வீட்டாரைக் குறிக்கக்கூடும்.
- source_word: עָלָיו
  choice: அவனருகில்
  rationale: עַל என்பதன் அடிப்படைப் பொருள் ‘மேல்/மீது’ என்றாலும், தரையில் கிடந்த தாவீதை எழுப்ப முயலும் சூழலில் தமிழில் ‘அவனருகில்’ என்பது இயல்பாகக் காட்சியைத் தருகிறது; பகைமையாக ‘அவன்மேல் நின்றார்கள்’ என்ற தவறான எண்ணத்தையும் தவிர்க்கிறது.
- source_word: לַהֲקִימוֹ
  choice: அவனைத் ... எழுப்புவதற்காக
  rationale: קום என்பதன் ஹிஃபில் காரணவினைப் பொருளான ‘அவனை எழச் செய்தல்’ என்பதைக் காக்கிறது.
- source_word: מִן הָאָרֶץ
  choice: தரையிலிருந்து
  rationale: துக்கத்தில் தரையில் கிடந்த உடனடிச் சூழலில் אֶרֶץ என்பதற்கான இயல்பான தமிழாக்கம்.
- source_word: וְלֹא אָבָה
  choice: அவனுக்கு அதில் விருப்பமில்லை
  rationale: אָבָה குறிக்கும் மனம்/சம்மதம் இல்லாமையை, அளவுக்கு மீறி வலுவான மறுப்பு என மாற்றாமல் வெளிப்படுத்துகிறது.
- source_word: וְלֹא בָרָא אִתָּם לָחֶם
  choice: அவர்களோடு அப்பம் உண்ணவும் அவன் மறுத்துவிட்டான்
  rationale: ‘அப்பம் உண்ணுதல்’ என்ற எபிரெய வெளிப்பாட்டைப் பேணுகிறது; இங்கு அது பொதுவாக உணவு உட்கொள்வதைக் குறிக்கிறது. தொடக்கத்தில் உள்ள וְלֹא என்பதால் உணவு உண்ணாத மறுப்பைத் தெளிவாகக் கூறுகிறது.
