- from: அவனுடைய வீட்டின் மூப்பர்கள்[a] அவனைத் தரையிலிருந்து எழுப்புவதற்காக அவனருகில் எழுந்து நின்றார்கள். ஆனால் அவனுக்கு அதில் விருப்பமில்லை; அவர்களோடு அப்பம் உண்ணவும் அவன் மறுத்துவிட்டான்[b].
  to: அவனுடைய இல்லத்தின் மூப்பர்கள்[a] அவனைத் தரையிலிருந்து எழுப்புவதற்காக அவனருகில் எழுந்து நின்றார்கள். ஆனால் அவன் இணங்கவில்லை; அவர்களோடு அப்பம் உண்ணவும் அவன் விரும்பவில்லை[b].
