base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/019.yaml
  text: When David saw that his servants were whispering[a], David understood that the child was dead. So David said to his servants, “Is the child dead?” And they said, “He is dead.”
translation:
  language: ta
  text: தன் பணியாளர்கள் தங்களுக்குள் மெல்லப் பேசிக்கொண்டிருப்பதைத் தாவீது கண்டபோது, குழந்தை இறந்துவிட்டது என்று புரிந்துகொண்டார். ஆகவே தாவீது தன் பணியாளர்களிடம், “குழந்தை இறந்துவிட்டதா?” என்று கேட்டார். அதற்கு அவர்கள், “இறந்துவிட்டது”[a] என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் பணியாளர்களின் பதில் ஒரே சொல்லாக, “இறந்தது” என்று உள்ளது.
    reason: மூலமொழியின் சுருக்கமான பதிலைச் சுட்டிக்காட்டுதல்
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டபோது
  rationale: ראה என்பதன் அடிப்படைப் பொருளான காட்சிசார் கவனிப்பை இயல்பான தமிழ் தொடரமைப்பில் தருகிறது.
- source_word: מִתְלַחֲשִׁים
  choice: தங்களுக்குள் மெல்லப் பேசிக்கொண்டிருப்பதை
  rationale: לחש என்பதன் ஹித்பயேல் வடிவம் இரகசியமாக அல்லது தாழ்ந்த குரலில் பரஸ்பரம் பேசுவதைச் சுட்டுகிறது; இச்சொற்றொடர் அந்தச் சூழலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיָּבֶן
  choice: புரிந்துகொண்டார்
  rationale: காணப்பட்ட அறிகுறிகளிலிருந்து மனத்தால் உணர்ந்துகொள்வது என்ற בין சொல்லின் பொருளை நவீனத் தமிழில் நேராக வெளிப்படுத்துகிறது.
- source_word: מֵת
  choice: இறந்துவிட்டது
  rationale: மரணநிலையைச் சுட்டும் எபிரெய வடிவத்தை, குழந்தை ஏற்கெனவே இறந்துள்ளது என்ற சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: הַיָּלֶד
  choice: குழந்தை
  rationale: יֶלֶד என்பது குழந்தை அல்லது சிறுவன் எனப் பொருள்படலாம்; இங்கு தாவீதின் பச்சிளம் மகனைப் பற்றிய சூழலால் ‘குழந்தை’ மிகத் துல்லியமானது.
- source_word: עֲבָדָיו
  choice: தன் பணியாளர்கள்
  rationale: அரச குடும்பத்தில் தாவீதுக்குப் பணிபுரியும் நபர்களைக் குறிக்கும் இச்சூழலில், அடிமை நிலையைத் தேவையின்றி வலியுறுத்தாமல் עֶבֶד என்பதைக் ‘பணியாளர்கள்’ என மொழிபெயர்ப்பது பொருத்தமானது.
- source_word: הֲמֵת הַיֶּלֶד
  choice: குழந்தை இறந்துவிட்டதா?
  rationale: குழந்தை மரணநிலையில் உள்ளதா என்று கேட்கும் எபிரெய வினாவை இயல்பான தமிழில் தருகிறது.
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: கேட்டார் ... என்றார்கள்
  rationale: אמר என்பதன் அடிப்படைப் பொருள் ‘சொல்’ என்றாலும், முதல் கூற்று நேரடி வினாவாக இருப்பதால் தமிழில் ‘கேட்டார்’ என்றும் பதிலை ‘என்றார்கள்’ என்றும் வழங்குவது உரையாடலின் செயல்பாட்டை இயல்பாகக் காட்டுகிறது.
