translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வேலைக்காரர்கள்’ என்பதற்குப் பதில் அரண்மனைச் சூழலுக்கு ஏற்ற ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது; மரியாதைப் பன்மை வினைமுற்றுகள் தாவீதுக்கும் அவரது பணியாளர்களுக்கும் இயல்பாகப் பயன்படுத்தப்பட்டுள்ளன.
