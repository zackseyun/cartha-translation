  source_fidelity: 'மூல எபிரெய உரையின் வரிசையும் பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: தாவீது பணியாளர்களின் மெல்லிய பேச்சைக் கண்டு குழந்தை இறந்ததை உணர்கிறார்; பின்னர் நேரடியாகக் கேட்கிறார்; அவர்கள் சுருக்கமாக உறுதிப்படுத்துகிறார்கள். “தங்களுக்குள் மெல்லப் பேசிக்கொண்டிருப்பதை” என்பது מִתְלַחֲשִׁים என்பதன் பரஸ்பரமான, தாழ்ந்த குரல் பேச்சைச் சரியாக வெளிப்படுத்துகிறது. “இறந்துவிட்டது” சூழலில் இயல்பான தமிழ் மரணநிலைக் கூறாக உள்ளது.'
