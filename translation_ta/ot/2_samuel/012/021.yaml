  terminology: ‘பணியாளர்கள்’ அரசவைச் சூழலுக்கு ஏற்ற நடுநிலைச் சொல். ‘நோன்பிருந்து’, ‘அப்பம் உண்டீர்’ ஆகியவை வேதாகமக் கதைநடைக்கு ஏற்றவை. ‘அப்பம் உண்டீர்’ என்பதன் உணவு உட்கொள்ளுதல் என்ற மொழிவழக்குப் பொருளை அடிக்குறிப்பு சரியாக விளக்குகிறது.
