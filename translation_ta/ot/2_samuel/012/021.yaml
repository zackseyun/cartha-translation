base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/021.yaml
  text: Then his servants said to him[a], “What is this thing that you have done? While the child was alive, you fasted and wept; but when the child died, you got up and ate bread.”
translation:
  language: ta
  text: அப்போது அவனுடைய பணியாளர்கள் அவனிடம், “நீர் செய்த இந்தக் காரியம் என்ன? குழந்தை உயிரோடிருந்தபோது அதற்காக நோன்பிருந்து அழுதீர்; ஆனால் குழந்தை இறந்ததும் எழுந்து அப்பம் உண்டீரே![a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக, ‘அப்பம் உண்டீர்’; இது உணவு உட்கொள்வதையோ ஒரு வேளை உண்பதையோ குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அப்போது ... என்றார்கள்
  rationale: வாவ் தொடர் கதை நிகழ்வை முன்னெடுத்துச் செல்கிறது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையில் நிகழ்வுகளின் வரிசையை வெளிப்படுத்துகிறது.
- source_word: עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள்
  rationale: அரசவையின் சூழலில் ‘பணியாளர்கள்’ என்பது இயல்பானதும், அவர்களுடைய சட்ட அல்லது சமூக நிலையைக் தேவையின்றி முன்னிறுத்தாததுமான பொருத்தமான சொல்.
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָה
  choice: நீர் செய்த இந்தக் காரியம் என்ன?
  rationale: எபிரெய மூலத்தின் நேரடியான கேள்வி வடிவத்தையும் பணியாளர்களின் வியப்பையும் காக்கிறது; அதை வெறுமனே ‘ஏன் இப்படிச் செய்தீர்?’ என்று பொருள்விரிவாக்கவில்லை.
- source_word: בַּעֲבוּר הַיֶּלֶד חַי
  choice: குழந்தை உயிரோடிருந்தபோது அதற்காக
  rationale: குழந்தையைச் சார்ந்த காரணத்தையும், அடுத்த கூற்றோடு உள்ள காலநிலை முரணையும் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: צַמְתָּ וַתֵּבְךְּ
  choice: நோன்பிருந்து அழுதீர்
  rationale: இரு செயல்களையும் சுருக்கமான, கண்ணியமான நவீன தமிழில் நேரடியாகக் கூறுகிறது.
- source_word: וְכַאֲשֶׁר מֵת הַיֶּלֶד
  choice: ஆனால் குழந்தை இறந்ததும்
  rationale: முந்தைய நிலையுடனான கூர்மையான முரணையும் நிகழ்வின் உடனடியான தொடர்ச்சியையும் வெளிப்படுத்துகிறது.
- source_word: קַמְתָּ
  choice: எழுந்து
  rationale: இந்தச் சூழலில் קום என்பதற்கான இயல்பான தமிழ் வினையெச்ச வடிவம்.
- source_word: וַתֹּאכַל לָחֶם
  choice: அப்பம் உண்டீரே
  rationale: ‘அப்பம் உண்ணுதல்’ என்ற எபிரெய மொழிவழக்கின் வெளிப்படையான உருவகத்தைத் தக்கவைக்கிறது; ‘-ஏ’ பணியாளர்களின் வியப்பான முரண்பாட்டை இயல்பாக உணர்த்துகிறது.
