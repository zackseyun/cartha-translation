  source_fidelity: 'எபிரெய மூலத்தின் தொடர்ச்சியான வினைநடையும் பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: தாவீது அனைவரையும் ஒன்று சேர்த்தார், ரப்பாவுக்குச் சென்றார், அதற்கு எதிராகப் போரிட்டார், அதைக் கைப்பற்றினார். כָּל־הָעָם என்பதன் பொதுவான ‘மக்கள் அனைவரையும்’ என்ற வடிவம் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது; போர்ச் சூழலிலான சாத்தியமான படை-பொருள் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.'
