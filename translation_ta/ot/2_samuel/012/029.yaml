  text: וַ/יֶּאֱסֹ֥ף דָּוִ֛ד אֶת כָּל הָ/עָ֖ם וַ/יֵּ֣לֶךְ רַבָּ֑תָ/ה וַ/יִּלָּ֥חֶם בָּ֖/הּ וַֽ/יִּלְכְּדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/029.yaml
  text: Then David gathered all the people and went to Rabbah and fought against it and captured it[a].
translation:
  language: ta
  text: பின்பு தாவீது மக்கள் அனைவரையும் ஒன்றுகூட்டி, ரப்பாவுக்குச் சென்று, அதற்கு எதிராகப் போரிட்டு, அதைக் கைப்பற்றினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘படை முழுவதையும்’ அல்லது ‘படைவீரர்கள் அனைவரையும்’; எபிரெயில் சொற்பொருளாக, ‘மக்கள் அனைவரையும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: ஒன்றுகூட்டி
  rationale: אסף என்பதன் அடிப்படைப் பொருள் மக்களை ஒன்றாகச் சேர்ப்பது. போர்ச் சூழல் இருந்தாலும், முறையான படைத்திரட்டலை எபிரெயச் சொல் வெளிப்படையாகக் குறிப்பிடாததால் பொதுவான பொருள் காக்கப்படுகிறது.
- source_word: כָּל הָעָם
  choice: மக்கள் அனைவரையும்
  rationale: எபிரெயில் சொற்பொருளாக ‘மக்கள் அனைவரும்’ என்று உள்ளது. சூழலில் இது போர்வீரர்களையோ படையையோ குறிக்கக்கூடும்; எனினும் மூலத்தின் பொதுவான சொல்லை முதன்மை உரை பாதுகாக்கிறது.
- source_word: רַבָּתָה
  choice: ரப்பாவுக்கு
  rationale: ரப்பா என்ற இடப்பெயருடன் திசையைக் குறிக்கும் இறுதி ה இணைந்துள்ளது; ஆகவே நகரத்தை நோக்கிய நகர்வை ‘ரப்பாவுக்கு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: அதற்கு எதிராகப் போரிட்டு
  rationale: לחם உடன் வரும் ב இங்கு அந்த நகருக்கு எதிராகப் போரிடுவதைச் சுட்டுகிறது. பெண்பால் பின்னொட்டு தமிழில் நகரைக் குறிக்கும் இயல்பான ‘அது’ வடிவில் தரப்படுகிறது.
- source_word: וַיִּלְכְּדָהּ
  choice: அதைக் கைப்பற்றினார்
  rationale: לכד என்பது போர்ச் சூழலில் ஒரு நகரைக் கைப்பற்றுதல் அல்லது பிடித்தல் என்று பொருள்படும்; ‘கைப்பற்றினார்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
