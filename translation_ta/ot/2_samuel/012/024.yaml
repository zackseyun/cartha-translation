source:
  edition: WLC
  text: וַ/יְנַחֵ֣ם דָּוִ֗ד אֵ֚ת בַּת שֶׁ֣בַע אִשְׁתּ֔/וֹ וַ/יָּבֹ֥א אֵלֶ֖י/הָ וַ/יִּשְׁכַּ֣ב עִמָּ֑/הּ וַ/תֵּ֣לֶד בֵּ֗ן ו/יקרא אֶת שְׁמ/וֹ֙ שְׁלֹמֹ֔ה וַ/יהוָ֖ה אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/024.yaml
  text: Then David comforted Bathsheba his wife[a], and he went in to her and lay with her. She bore a son, and he named him Solomon[b]. And Yahweh loved him.
translation:
  language: ta
  text: பின்பு தாவீது தன் மனைவியான பத்சேபாளுக்கு ஆறுதல் கூறினான்[a]. அவன் அவளிடம் சென்று அவளோடு படுத்தான்[b]. அவள் ஒரு மகனைப் பெற்றாள்; தாவீது அவனுக்குச் சாலொமோன் என்று பெயரிட்டான். யாவே அவன்மேல் அன்புகூர்ந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பத்சேபாளைத் தேற்றினான்.”
    reason: lexical_alternative
  - marker: b
    text: “அவளிடம் சென்று அவளோடு படுத்தான்” என்பது பாலுறவைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְנַחֵם
  choice: ஆறுதல் கூறினான்
  rationale: பிள்ளையின் இறப்புக்குப் பிந்தைய துயரச் சூழலில், பியேல் வடிவம் துயருற்றவருக்கு ஆறுதல் அளிப்பதைக் குறிக்கிறது; இச்சொற்றொடர் இயல்பான நவீனத் தமிழில் அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בַּת שֶׁבַע
  choice: பத்சேபாள்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர் வடிவம்.
- source_word: אִשְׁתּוֹ
  choice: தன் மனைவியான
  rationale: பத்சேபாளை இக்கட்டத்தில் தாவீதின் மனைவி என்று எபிரெய உரை வெளிப்படையாக அடையாளப்படுத்துவதால் அது விடப்படவில்லை.
- source_word: וַיָּבֹא אֵלֶיהָ וַיִּשְׁכַּב עִמָּהּ
  choice: அவன் அவளிடம் சென்று அவளோடு படுத்தான்
  rationale: பாலுறவைக் குறிக்கும் எபிரெய மரபுத்தொடரின் உருவகத்தையும் இரு வினைகளையும் இயன்றவரை காக்கும், கண்ணியமான தமிழ் நடை.
- source_word: וַתֵּלֶד בֵּן
  choice: அவள் ஒரு மகனைப் பெற்றாள்
  rationale: எபிரெய வாக்கியத்தின் சுருக்கத்தையும் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ שְׁלֹמֹה
  choice: தாவீது அவனுக்குச் சாலொமோன் என்று பெயரிட்டான்
  rationale: வினையின் ஆண்பால் ஒருமை எழுவாய் சூழலில் தாவீதைக் குறிக்கிறது; தமிழில் சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்க அவரது பெயர் மீண்டும் கூறப்பட்டுள்ளது.
- source_word: שְׁלֹמֹה
  choice: சாலொமோன்
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்பட்ட பெயர் வடிவம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பாக மாற்றாமல், எபிரெய நான்கெழுத்துத் தெய்வீகப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֲהֵבוֹ
  choice: அவன்மேல் அன்புகூர்ந்தார்
  rationale: אהב என்பதன் நேரடியான ‘அன்புகூருதல்’ என்ற பொருளைத் தருகிறது; பின்னொட்டு புதிதாகப் பிறந்த மகனைக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பட்ட உடன்படிக்கைப் பெயரையே பயன்படுத்துகிறது; எனவே பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: யாவே குழந்தையை நேசித்தார் என்ற கூற்றின் வலிமை
  choice: யாவே அவன்மேல் அன்புகூர்ந்தார்
  alternative: யாவே அவனை ஏற்றுக்கொண்டார்
  rationale: אהב என்பதன் நேரடியான ‘அன்புகூருதல்’ என்ற பொருள் பாதுகாக்கப்படுகிறது; ‘ஏற்றுக்கொண்டார்’ என்று விளக்கி அதன் இறையியல் பொருளைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வரலாற்று விவரண நடை பயன்படுத்தப்பட்டுள்ளது. பாலுறவைக் குறிக்கும் மூலமொழி மரபுத்தொடர் மென்மைப்படுத்தப்படாமலும் வெளிப்படையாகக் கடுமையாக்கப்படாமலும் பாதுகாக்கப்பட்டு, அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
