base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/004.yaml
  text: A traveler came to the rich man[a], and he spared taking from his own flock and from his own herd to prepare for the traveler who had come to him. So he took the ewe lamb of the poor man and prepared it for the man who had come to him.
translation:
  language: ta
  text: ஒரு பயணி அந்தப் பணக்காரனிடம் வந்தான்.[a] தன்னிடம் வந்திருந்த அந்தப் பயணிக்காக உணவு தயாரிக்கத் தன் ஆட்டு மந்தையிலிருந்தும் மாட்டு மந்தையிலிருந்தும் எடுக்க அவனுக்கு மனம் வரவில்லை. அதனால், அந்த ஏழையின் பெண் செம்மறியாட்டுக்குட்டியை எடுத்துக்கொண்டு, தன்னிடம் வந்திருந்தவனுக்காக அதைத் தயாரித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பயணி’ என்பதற்கு ‘விருந்தினர்’ என்றும் மொழிபெயர்க்கலாம். பயணத்தில் இருப்பவரையும் விருந்தோம்பலுக்காக வந்தவரையும் குறிக்க எபிரெயம் தொடர்புடைய, ஆனால் வேறுபட்ட சொற்களைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵלֶךְ
  choice: பயணம் செய்துகொண்டிருந்த ஒருவன்
  rationale: பயணத்தில் இருப்பவரைக் குறிக்கும் பெயர்ச்சொல்லின் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; வெறும் சமூக விருந்தினன் என்ற பொருளாகக் குறுக்கவில்லை.
- source_word: וַיַּחְמֹל
  choice: எடுக்க அவனுக்கு மனம் வரவில்லை
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘இரங்குதல்/விட்டுவைத்தல்’; இச்சூழலில் தன் சொந்த மந்தைகளிலிருந்து எடுக்கத் தயங்கியதைக் குறிக்கும் தமிழ் மரபுத்தொடர் பொருத்தமாக உள்ளது.
- source_word: מִצֹּאנוֹ וּמִבְּקָרוֹ
  choice: தன் ஆட்டு மந்தையிலிருந்தோ மாட்டு மந்தையிலிருந்தோ
  rationale: எபிரெயக் கூட்டுப்பெயர்களையும் உடைமைப் பின்னொட்டுகளையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לַעֲשׂוֹת
  choice: உணவு தயாரிக்க
  rationale: உணவளிக்கும் சூழலைத் தமிழில் தெளிவாக்குகிறது; சமையல் முறையைத் தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: לָאֹרֵחַ
  choice: அந்தப் பயணிக்காக
  rationale: பயணி அல்லது விருந்தினர் எனப் பொருள்படக்கூடிய சொல்லை, முந்தைய பயணியுடன் உள்ள தொடர்பைப் பேணும் வகையில் மொழிபெயர்க்கிறது.
- source_word: כִּבְשַׂת
  choice: பெண் ஆட்டுக்குட்டியை
  rationale: எபிரெயில் உள்ள பெண்பால் குறிப்பை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: הָאִישׁ הָרָאשׁ
  choice: அந்த ஏழையின்
  rationale: பணக்காரனுக்கு எதிர்மறையாக நிறுத்தப்பட்ட வறிய மனிதனை இயல்பாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: וַיַּעֲשֶׂהָ
  choice: அதைத் தயாரித்தான்
  rationale: முந்தைய עשה வினையுடன் உள்ள சொல் தொடர்பைப் பேணுகிறது; ‘சமைத்தான்’ என்று அளவுக்கு மீறிக் குறிப்பாக்கவில்லை.
- source_word: הַבָּא לוֹ / הַבָּא אֵלָיו
  choice: தன்னிடம் வந்திருந்தவனுக்காக
  rationale: வந்த நபரைக் குறிக்கும் எபிரெயப் பெயரெச்ச அமைப்பையும் கடந்தகால நிகழ்வொழுங்கையும் இயல்பான தமிழில் தருகிறது.
