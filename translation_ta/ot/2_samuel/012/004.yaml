translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மனம் வரவில்லை’ என்பது וַיַּחְמֹל என்பதன் சூழல்சார் தயக்கம்/விட்டுவைத்தல் உணர்வை இயல்பாகத் தருகிறது; பணக்காரனுடைய வக்கிரமான ‘இரக்கம்’ என்ற கதையின் பதற்றத்தையும் முற்றாக அழிக்கவில்லை. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
