base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/023.yaml
  text: But now he is dead. Why should I fast any longer? Can I bring him back again? I am going to him[a], but he will not return to me.
translation:
  language: ta
  text: ஆனால் இப்போது அவன் இறந்துவிட்டான். இனியும் நான் ஏன் நோன்பு நோற்க வேண்டும்? என்னால் அவனை மீண்டும் கொண்டுவர முடியுமா? நான் அவனிடம் செல்வேன்[a]; ஆனால் அவன் என்னிடம் திரும்பிவர மாட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் அவனிடம் செல்கிறேன்.” எபிரேயப் பங்கேற்பு வடிவம் உறுதியான எதிர்காலத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆனால் இப்போது
  rationale: குழந்தை உயிரோடிருந்த முந்தைய நிலைக்கும் அது இறந்துவிட்ட தற்போதைய நிலைக்கும் இடையிலான முரண்பாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: מֵת
  choice: அவன் இறந்துவிட்டான்
  rationale: குழந்தை இப்போது இறந்த நிலையில் இருப்பதைத் தமிழில் இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: לָמָּה זֶּה אֲנִי צָם
  choice: இனி நான் ஏன் உண்ணாநோன்பிருக்க வேண்டும்?
  rationale: எபிரேய வினாவின் சொல்லாட்சிச் சக்தியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; 'இனி' என்பது மரணத்திற்குப் பிறகும் நோன்பைத் தொடர்வதைக் குறிக்கிறது.
- source_word: הַאוּכַל לַהֲשִׁיבוֹ עוֹד
  choice: என்னால் அவனை மீண்டும் கொண்டுவர முடியுமா?
  rationale: שוב என்பதன் காரணவினைப் பொருளான 'திரும்பச் செய்தல்' என்பதைச் சூழலுக்கேற்ற 'மீண்டும் கொண்டுவருதல்' எனத் தருகிறது; உயிர்த்தெழுதலின் முறை குறித்து கூடுதல் விளக்கம் சேர்க்கவில்லை.
- source_word: אֲנִי הֹלֵךְ אֵלָיו
  choice: நான் அவனிடம் போய்க்கொண்டிருக்கிறேன்
  rationale: הֹלֵךְ என்ற பங்கேற்புவினையின் நிகழ்நிலை வடிவத்தைப் பாதுகாக்கிறது; சூழலில் அது உறுதியான எதிர்காலத்தையும் குறிக்கக்கூடும் என்பதால் மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְהוּא לֹא יָשׁוּב אֵלַי
  choice: ஆனால் அவன் என்னிடம் திரும்பிவர மாட்டான்
  rationale: முந்தைய காரணவினை வடிவத்துடனான שוב என்ற வேர்ச்சொல் தொடர்பையும், தாவீது அவனிடம் செல்வதற்கும் குழந்தை திரும்பிவராததற்கும் உள்ள முரண்பாட்டையும் காக்கிறது.
theological_decisions:
- issue: இறந்த குழந்தையுடன் மறுமையில் உணர்வுள்ள தனிப்பட்ட சந்திப்பு நிகழும் என்று தாவீதின் கூற்று குறிப்பதாக எடுத்துக்கொள்ள வேண்டுமா?
  choice: '''நான் அவனிடம் போய்க்கொண்டிருக்கிறேன்'' என்று மட்டும் மொழிபெயர்த்து, அந்தச் செல்லுதலின் தன்மையை மரணத்துக்கு அப்பால் மேலும் வரையறுக்காமல் விடுதல்.'
  alternative: தாவீதும் இறந்து, இறந்தோரின் உலகில் குழந்தையைச் சேருவார் என்ற எளிய குறிப்பு; அல்லது மரணத்திற்குப் பின் குழந்தையுடன் தனிப்பட்ட மறுசேர்க்கை குறித்த மறைமுகக் குறிப்பு.
  rationale: எபிரேய உரை தாவீது குழந்தையிடம் செல்வார் என்றும் குழந்தை அவரிடம் திரும்பாது என்றும் மட்டுமே கூறுகிறது. இடைநிலை, மறுமை, அல்லது குழந்தைகளின் இரட்சிப்பு குறித்த குறிப்பிட்ட கோட்பாட்டை உரைக்குள் சேர்க்காமல் அதன் தெளிவின்மையையும் இறையியல் இழுபறியையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. 'உண்ணாநோன்பிருக்க' என்பது சூழலிலுள்ள மதநோன்பைத் தெளிவாகக் குறிக்கிறது. மூலத்தின் சுருக்கமான வினாக்களும் இறுதி எதிர்மறை முரண்பாடும் பாதுகாக்கப்பட்டுள்ளன.
