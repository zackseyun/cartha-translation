translation:
  language: ta
  text: அந்தப் பணக்காரனுக்கு ஆடுமாடுகள் மிக ஏராளமாக இருந்தன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעָשִׁיר הָיָה
  choice: அந்தப் பணக்காரனுக்கு ... இருந்தன
  rationale: எபிரெயத்தில் לְ உடன் הָיָה அமைக்கும் உடைமைப் பொருளைத் தமிழில் இயல்பாக ‘பணக்காரனுக்கு ... இருந்தன’ என்று மொழிபெயர்த்தோம். சூழலில் ஏழையுடன் ஒப்பிடப்படும் குறிப்பிட்ட பணக்காரன் என்பதால் ‘அந்தப்’ பயன்படுத்தப்பட்டது.
- source_word: צֹאן וּבָקָר
  choice: ஆடுமாடுகள்
  rationale: צֹאן என்பது செம்மறியாடுகள் மற்றும் வெள்ளாடுகள் உள்ளிட்ட சிறுகால்நடைகளையும், בָּקָר என்பது மாடுகளையும் குறிக்கிறது. நவீனத் தமிழில் இவ்விரண்டையும் இயல்பாகவும் சுருக்கமாகவும் ‘ஆடுமாடுகள்’ எனக் கூறலாம்.
- source_word: הַרְבֵּה מְאֹד
  choice: மிக ஏராளமாக
  rationale: அளவு மிகுதியை வலியுறுத்தும் இருசொல் அமைப்பின் தீவிரத்தை ‘மிக ஏராளமாக’ தெளிவாகத் தக்கவைக்கிறது.
