  text: And he must repay the ewe lamb fourfold[a], because he did this thing and because he had no pity.
translation:
  language: ta
  text: அந்தப் பெண் ஆட்டுக்குட்டிக்காக அவன் நான்கு மடங்கு ஈடுசெய்ய வேண்டும்; ஏனெனில் அவன் இந்தக் காரியத்தைச் செய்தான், இரக்கம் காட்டவில்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவன் இரக்கத்தோடு விட்டுவிடவில்லை.’ எபிரெய வினைச்சொல் இரக்கத்தால் தீங்கு செய்யாமல் விடுவதையோ, இரக்கம் காட்டுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכִּבְשָׂה
  choice: அந்தப் பெண் ஆட்டுக்குட்டி
  rationale: כִּבְשָׂה என்பது பெண்பால் ஆட்டுக்குட்டியைத் தெளிவாகக் குறிக்கிறது; தமிழில் இயல்பாகவும் துல்லியமாகவும் பாலினத்தை வெளிப்படுத்துகிறது.
- source_word: יְשַׁלֵּם
  choice: ஈடுசெய்ய வேண்டும்
  rationale: שׁלם என்பதன் பியேல் வடிவம் இங்கு இழப்பீடு அல்லது திருப்பிச் செலுத்துதலைக் குறிக்கிறது; தாவீதின் நீதித் தீர்ப்பின் கட்டாயத் தன்மையை ‘வேண்டும்’ வெளிப்படுத்துகிறது.
- source_word: אַרְבַּעְתָּיִם
  choice: நான்கு மடங்கு
  rationale: இச்சொல் நான்கு பங்கு அளவில் ஈடுசெய்வதைக் குறிக்கும் எபிரெய எண்ணியல் வழக்கு; ‘நான்கு மடங்கு’ தெளிவான நவீனத் தமிழ்.
- source_word: עֵקֶב אֲשֶׁר
  choice: ஏனெனில்
  rationale: தீர்ப்புக்கான காரணத்தை அறிமுகப்படுத்தும் சொற்றொடர்; தமிழில் இயல்பான காரண இணைப்புச் சொல்.
- source_word: עָשָׂה אֶת־הַדָּבָר הַזֶּה
  choice: இந்தக் காரியத்தைச் செய்தான்
  rationale: דָּבָר என்பதன் ‘காரியம்/செயல்’ என்ற பரப்பை அளவுக்கு மீறி விளக்காமல் எபிரெய அமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: לֹא חָמָל
  choice: இரக்கம் காட்டவில்லை
  rationale: חמל என்பது இரக்கத்தால் தீங்கு செய்யாமல் விடுதல் அல்லது இரங்குதல் ஆகிய இரு நுணுக்கங்களையும் கொண்டது; ‘இரக்கம் காட்டவில்லை’ சூழலில் இயல்பாக உள்ளது, மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
