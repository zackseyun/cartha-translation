  text: מַדּ֜וּעַ בָּזִ֣יתָ אֶת דְּבַ֣ר יְהוָ֗ה לַ/עֲשׂ֣וֹת הָ/רַע֮ ב/עינ/ו אֵ֣ת אוּרִיָּ֤ה הַֽ/חִתִּי֙ הִכִּ֣יתָ בַ/חֶ֔רֶב וְ/אֶ֨ת אִשְׁתּ֔/וֹ לָקַ֥חְתָּ לְּ/ךָ֖ לְ/אִשָּׁ֑ה וְ/אֹת֣/וֹ הָרַ֔גְתָּ בְּ/חֶ֖רֶב בְּנֵ֥י עַמּֽוֹן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/009.yaml
  text: Why have you despised the word of Yahweh[a], to do what is evil in his sight? You struck down Uriah the Hittite with the sword, and took his wife for yourself as a wife[c][b], and killed him with the sword of the Ammonites.
translation:
  language: ta
  text: யெகோவாவின் வார்த்தையை நீ ஏன் இகழ்ந்து, அவர் பார்வையில் தீமையானதைச் செய்தாய்? ஏத்தியனான உரியாவை நீ வாளால் வீழ்த்தி, அவனுடைய மனைவியை உனக்காக மனைவியாக எடுத்துக்கொண்டாய்[a]; அவனையோ அம்மோனியர்களின் வாளால் கொன்றாய்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவனுடைய மனைவியை உனக்காக மனைவியாக எடுத்துக்கொண்டாய்”; இந்தச் சொற்றொடர் தாவீது அவளைத் தனக்கென எடுத்துக்கொண்டதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அம்மோனின் மகன்களின் வாளால்”; அம்மோனியர்களை வழிமுறையாகப் பயன்படுத்தி தாவீது உரியாவின் மரணத்தை ஏற்படுத்தினான் என்பது பொருள்.
    reason: cultural_note
lexical_decisions:
- source_word: מַדּוּעַ
  choice: ஏன்?
  rationale: நாத்தானின் நேரடியான குற்றச்சாட்டை இயல்பான தமிழில் வலுவாக வெளிப்படுத்தும் வினாச்சொல்.
- source_word: בָּזִיתָ
  choice: அவமதித்து
  rationale: இச்சொல் வெறும் கீழ்ப்படியாமையை அல்ல, இகழ்ச்சியையும் மதிப்பின்மையையும் குறிக்கிறது.
- source_word: דְּבַר יְהוָה
  choice: யெகோவாவின் வார்த்தை
  rationale: דָּבָר என்பதன் அடிப்படை உருவகத்தைத் தக்கவைத்து, சூழலில் இறைக்கட்டளையையும் வெளிப்படுத்தப்பட்ட சித்தத்தையும் உள்ளடக்குகிறது; יהוה தனிப்பட்ட இறைப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינָיו
  choice: அவர் பார்வையில் தீமையானதைச் செய்தது
  rationale: எபிரெய மொழியின் மதிப்பீட்டு மரபுத்தொடரை இயல்பான நவீன தமிழில் பாதுகாக்கிறது.
- source_word: הִכִּיתָ בַחֶרֶב
  choice: வாளால் வீழ்த்தி
  rationale: נכה என்பதிலுள்ள தாக்குதல் பொருளைப் பாதுகாத்து, பின்னர் வரும் வெளிப்படையான ‘கொன்றாய்’ என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: לָקַחְתָּ לְּךָ לְאִשָּׁה
  choice: உனக்காக மனைவியாக எடுத்துக்கொண்டாய்
  rationale: לְךָ என்பதிலுள்ள தன்வசப்படுத்தும் வலியுறுத்தலையும் לְאִשָּׁה என்பதிலுள்ள திருமணப் பொருளையும் தக்கவைக்கிறது.
- source_word: הָרַגְתָּ
  choice: கொன்றாய்
  rationale: הרג என்பதன் நேரடியான பொருள்; குற்றத்தின் தன்மை சூழலிலேயே தெளிவாக உள்ளது என்பதால் ‘கொலைசெய்தாய்’ என்று மிகைவிளக்கம் அளிக்கப்படவில்லை.
- source_word: בְּחֶרֶב בְּנֵי עַמּוֹן
  choice: அம்மோனியர்களின் வாளால்
  rationale: அம்மோனியப் படையினரை கருவியாகப் பயன்படுத்தி தாவீது உரியாவின் மரணத்தை ஏற்படுத்தினான் என்ற செயற்பாட்டை வெளிப்படுத்துகிறது.
- source_word: אוּרִיָּה הַחִתִּי
  choice: ஏத்தியனான உரியா
  rationale: பெயரையும் இன அடையாளத்தையும் வழக்கமான தமிழ் வேதாகமப் பெயர்வடிவில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு வடிவில் வழங்குகிறது.
- issue: தாவீதின் மறைமுகப் பொறுப்பு
  choice: அவனையோ அம்மோனியர்களின் வாளால் கொன்றாய்
  alternative: அம்மோனியர்கள் அவனைக் கொல்லும்படி செய்தாய்
  rationale: மூலத்தின் நேரடியான குற்றச்சாட்டையும் ‘வாள்’ என்ற மீளுரையையும் தக்கவைத்து, தாவீதின் பொறுப்பை மெலிதாக்காமல் அம்மோனியர்களின் இடைமுகத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், நாத்தானின் நீதித்தீர்ப்பு நிறைந்த நேரடிக் குற்றச்சாட்டைத் தக்கவைக்கும் கண்ணியமான நடை. எபிரெய மூலத்தின் ‘வாள்’ மீளுரையும் தாவீதின் தனிப்பட்ட பொறுப்பும் பாதுகாக்கப்பட்டுள்ளன.
