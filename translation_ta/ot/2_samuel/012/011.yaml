revisions:
- from: 'யாவே கூறுவது இதுவே: “இதோ, உன் சொந்த வீட்டிலிருந்தே உனக்கு எதிராகப் பேரிடரை எழும்பச் செய்கிறேன். உன் கண் முன்னே உன் மனைவியரை எடுத்து, உனக்கு நெருக்கமான ஒருவனிடம்[a] கொடுப்பேன். அவன் இந்தச் சூரியன் காணும்படி[b] உன் மனைவியரோடு படுப்பான்.”'
  to: 'யாவே கூறுவது இதுவே: “இதோ, உன் சொந்த வீட்டிலிருந்தே உனக்கு எதிராகப் பேரிடரை எழுப்புகிறேன். உன் கண் முன்னே உன் மனைவியரை எடுத்து, உன் தோழனிடம்[a] கொடுப்பேன். அவன் இந்தச் சூரியனுக்கு முன்பாக[b] உன் மனைவியரோடு படுப்பான்.”'
  rationale: திருத்தம் இரண்டு நடையியல்/துல்லியப் பகுதிகளுக்கு மட்டுமே செய்யப்பட்டுள்ளது. ‘எழுப்புகிறேன்’ மֵקִים என்பதன் செயற்பாட்டுத் தன்மையைத் தெளிவாகத் தருகிறது. ‘இந்தச் சூரியனுக்கு முன்பாக’ என்பது எபிரெயத்தின் வலுவான சூரியப் படிமத்தையும் பகிரங்கத் தன்மையையும் இயல்பான தமிழில் காக்கிறது. ரֵעַ-வின் குறிப்பான ஆனால் முழுமையாக வரையறுக்கப்படாத உறவை ‘தோழன்’ என்றும் அடிக்குறிப்பில் மாற்றுப்பொருள்களுடனும் வழங்கியுள்ளோம்.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T22:32:39Z'
