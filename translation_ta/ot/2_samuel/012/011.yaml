reference: 2 Samuel 12:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִי֩ מֵקִ֨ים עָלֶ֤י/ךָ רָעָה֙ מִ/בֵּיתֶ֔/ךָ וְ/לָקַחְתִּ֤י אֶת נָשֶׁ֨י/ךָ֙ לְ/עֵינֶ֔י/ךָ וְ/נָתַתִּ֖י לְ/רֵעֶ֑י/ךָ וְ/שָׁכַב֙ עִם נָשֶׁ֔י/ךָ לְ/עֵינֵ֖י הַ/שֶּׁ֥מֶשׁ הַ/זֹּֽאת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/011.yaml
  text: 'Thus says Yahweh: Behold[a], I am raising up disaster against you from your own house, and I will take your wives before your eyes and give them to your neighbor[b], and he will lie with your wives in the sight of this sun.'
translation:
  language: ta
  text: 'யாவே கூறுவது இதுவே: “இதோ, உன் சொந்த வீட்டிலிருந்தே உனக்கு எதிராகப் பேரிடரை எழுப்புகிறேன். உன் கண் முன்னே உன் மனைவியரை எடுத்து, உன் தோழனிடம்[a] கொடுப்பேன். அவன் இந்தச் சூரியனுக்கு முன்பாக[b] உன் மனைவியரோடு படுப்பான்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் தோழன்’ என்பதற்கான எபிரெயச் சொல் ‘அயலான்,’ ‘நெருங்கியவர்,’ அல்லது ‘உடனிருப்பவர்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘இந்தச் சூரியனின் கண்களுக்கு முன்பாக’; அதாவது, மறைவாக அல்லாமல் பகிரங்கமாக.'
    reason: idiom_clarification
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரைப் பட்டப்பெயராக மாற்றாமல், தமிழில் அதன் வழக்கமான ஒலிபெயர்ப்பால் தருகிறது.
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: தீர்க்கதரிசனத் தூதர் சூத்திரத்தின் அறிவிப்புத் தன்மையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: הִנְנִי
  choice: இதோ
  rationale: அடுத்து வரும் தெய்வீகச் செயலை நோக்கிக் கவனத்தைத் திருப்பும் எபிரெயச் சொல்லின் வலியுறுத்தலைக் காக்கிறது.
- source_word: מֵקִים ... רָעָה
  choice: பேரிடரை எழும்பச் செய்கிறேன்
  rationale: רָעָה இங்கு ஒழுக்கத் தீமையைவிடத் தீர்ப்பாக வரும் கேடு அல்லது பேரிடரைக் குறிக்கிறது; ‘எழும்பச் செய்கிறேன்’ என்பது מֵקִים என்பதன் செயற்பாட்டுப் படிமத்தையும் காக்கிறது.
- source_word: מִבֵּיתֶךָ
  choice: உன் சொந்த வீட்டிலிருந்தே
  rationale: வரப்போகும் கேடு தாவீதின் சொந்த வீட்டார் அல்லது குடும்ப வட்டத்திலிருந்து எழும் என்பதைத் தெளிவாக்குகிறது.
- source_word: לְעֵינֶיךָ
  choice: உன் கண் முன்னே
  rationale: தாவீதின் பார்வைக்கும் அறிவுக்கும் முன்பாக நிகழ்வதைச் சுட்டும் எபிரெய உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: לְרֵעֶיךָ
  choice: உனக்கு நெருக்கமான ஒருவனிடம்
  rationale: רֵעַ என்பதன் ‘அயலான், தோழன், உடனிருப்பவன்’ என்ற பொருள் வரம்பை, இச்சூழலில் குறிப்பிட்ட நெருங்கிய நபரைக் குறிக்கும்படி தருகிறது; அவர் நண்பரே என்று தேவையின்றி முடிவுசெய்யவில்லை.
- source_word: וְשָׁכַב עִם
  choice: அவனுடன் படுப்பான்
  rationale: பாலுறவைக் குறிக்கும் மூலமொழியின் மறைசொல் வடிவத்தையும் அதன் கடுமையான தொனியையும் தமிழில் காக்கிறது.
- source_word: לְעֵינֵי הַשֶּׁמֶשׁ הַזֹּאת
  choice: இந்தச் சூரியன் காணும்படி
  rationale: பகிரங்கமாக நிகழ்வதை உணர்த்தும் வியப்பூட்டும் சூரியப் படிமத்தைக் காக்கும் அதேவேளையில் தமிழில் புரியும்படி அமைக்கிறது.
theological_decisions:
- issue: தெய்வீகத் தீர்ப்பில் רָעָה என்பதன் பொருள்
  choice: பேரிடர் அல்லது கேடு; ஒழுக்கத் தீமை அல்ல
  alternative: தீமை
  rationale: இந்த நீதித்தீர்ப்புச் சூழலில், சொல் தாவீதுக்கு எதிராக யாவே எழும்பச் செய்யும் அழிவூட்டும் விளைவைக் குறிக்கிறது; கடவுள் ஒழுக்கத் தீமையை உண்டாக்குகிறார் என்று மொழிபெயர்ப்பு தேவையின்றி கூறக்கூடாது.
- issue: தீர்ப்பைச் செயற்படுத்துபவராக யாவே பேசுதல்
  choice: முதல் நபர் செயற்பாட்டு வடிவம் காக்கப்பட்டது
  alternative: நிகழ அனுமதிப்பேன்
  rationale: ‘நான் எழும்பச் செய்கிறேன்’, ‘நான் எடுத்து... கொடுப்பேன்’ என்ற மூலத்தின் நேரடியான தெய்வீகச் செயற்பாட்டை மென்மைப்படுத்தாமல் காக்கிறது; அது எவ்வாறு நிறைவேறுகிறது என்பதைக் குறித்து கூடுதல் கோட்பாட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான தீர்க்கதரிசன அறிவிப்பு நடையைப் பயன்படுத்துகிறது. ‘கண் முன்னே’ மற்றும் ‘சூரியன் காணும்படி’ ஆகிய மூலப் படிமங்கள் காக்கப்பட்டுள்ளன; கடினமான எபிரெயச் சொற்றொடர்கள் மட்டும் சாதாரண வாசகருக்குப் புரியும் வகையில் இயல்பாக்கப்பட்டுள்ளன.
