  source_fidelity: 'மூல எபிரெயத்தின் முக்கியக் கூறுகள் துல்லியமாக உள்ளன: மַלְכָּם என்பதற்கு முதன்மை வாசிப்பாக ‘அவர்களுடைய அரசன்’ வைக்கப்பட்டுள்ளது; மாற்று தெய்வப்பெயர் வாசிப்பு அடிக்குறிப்பில் காக்கப்பட்டுள்ளது. ‘தலையிலிருந்து,’ ‘விலையுயர்ந்த கல்,’ ‘தாவீதின் தலையில் வைக்கப்பட்டது,’ மற்றும் நகரின் போர்க்கொள்ளை மிகுதியாக வெளியே கொண்டுவரப்பட்டது என்பன மூலத்துடன் ஒத்துள்ளன. ஆனால் ‘அதன் எடை ஒரு தாலந்து தங்கம்’ என்பது தமிழில் முழுமையற்ற பெயர்ச்சொல் தொடராகத் தோன்றுகிறது; எடை குறித்த கூறை முழு வாக்கியமாக்குதல் தேவை.'
  naturalness: நடை பொதுவாக நவீனத் தரத் தமிழுக்கும் வரலாற்று உரைநடைக்கும் ஏற்றது. எடை பற்றிய வாக்கியத்தில் மட்டும் இணைப்பு வினை இல்லாததால் இயல்பான வாசிப்பு தடைபடுகிறது. ‘ஒரு தாலந்து தங்கம் இருந்தது’ என்பது மூலத்தின் அளவியல் சொல்லமைப்பையும் தமிழின் இயல்பையும் காக்கிறது.
  terminology: ‘கிரீடம்,’ ‘தாலந்து,’ ‘விலையுயர்ந்த கல்,’ ‘கொள்ளைப்பொருள்கள்’ ஆகியவை பொருத்தமானவை. அடிக்குறிப்பில் மில்கோமின் மாற்று வாசிப்பும் தாலந்து அளவுக்கான விளக்கமும் தக்கவை. ஆங்கில ஆய்வுத் தடத்தில் உள்ள சுமார் 75 பவுண்டு (34 கிலோகிராம்) என்ற இரு அளவுகளையும் சேர்ப்பது விளக்கத்தை முழுமையாக்கும்.
