source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת עֲטֶֽרֶת מַלְכָּ/ם֩ מֵ/עַ֨ל רֹאשׁ֜/וֹ וּ/מִשְׁקָלָ֨/הּ כִּכַּ֤ר זָהָב֙ וְ/אֶ֣בֶן יְקָרָ֔ה וַ/תְּהִ֖י עַל רֹ֣אשׁ דָּוִ֑ד וּ/שְׁלַ֥ל הָ/עִ֛יר הוֹצִ֖יא הַרְבֵּ֥ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/030.yaml
  text: He took the crown of their king from his head[a]. Its weight was a talent of gold, and in it was a precious stone, and it was placed on David’s head[b]. He brought out the spoil of the city in very great quantity.
translation:
  language: ta
  text: அவன் அவர்களுடைய அரசனின் தலையிலிருந்து கிரீடத்தை எடுத்தான்[a]. அதன் எடை ஒரு தாலந்து தங்கம் இருந்தது; அதில் விலையுயர்ந்த கல் ஒன்று இருந்தது. அது தாவீதின் தலையில் வைக்கப்பட்டது. நகரத்தின் கொள்ளைப்பொருள்களையும் அவன் மிகப் பெருமளவில் வெளியே கொண்டுவந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மில்கோமின் கிரீடத்தை” (பெயர் “மல்காம்” என்றும் எழுதப்படுகிறது). இங்கு வரும் எபிரெயச் சொல்லை “அவர்களுடைய அரசன்” என்பதற்குப் பதிலாக அம்மோனியரின் தெய்வமான மில்கோமின் பெயராகவும் வாசிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: கிரீடம்
  rationale: அரசருக்குரிய தலை அணியைக் குறிக்கும் இயல்பான, நவீனத் தமிழ் சொல்.
- source_word: מַלְכָּם
  choice: அவர்களுடைய அரசன்
  rationale: மசோரா உயிர்க்குறிப்பும் வழங்கப்பட்ட சொல்லமைப்பும் இதை ‘அவர்களுடைய அரசன்’ என்று வாசிக்க ஆதரிக்கின்றன; அம்மோனிய தெய்வத்தின் பெயராக வாசிக்கும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: מֵעַל רֹאשׁוֹ
  choice: அவனுடைய தலையிலிருந்து
  rationale: מֵעַל என்பதன் நீங்கிச் செல்லும் திசைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כִּכַּר זָהָב
  choice: ஒரு தாலந்து தங்கம்
  rationale: כִּכָּר என்பது பெரிய பண்டைய எடை அலகு; அதன் தொழில்நுட்பப் பெயரைத் தக்கவைத்து அளவு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וְאֶבֶן יְקָרָה
  choice: அதில் விலையுயர்ந்த கல் ஒன்று இருந்தது
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமானது. கல் கிரீடத்துடன் தொடர்புடையது என்பதைத் தெளிவாக்குகிறது; அது எவ்வாறு பொருத்தப்பட்டிருந்தது என்பதை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִד
  choice: அது தாவீதின் தலையில் வைக்கப்பட்டது
  rationale: கிரீடம் தாவீதின் தலைமேல் வந்தடைந்த நிகழ்வை இயல்பான தமிழ் நடையில் தெரிவிக்கிறது.
- source_word: שְׁלַל הָעִיר
  choice: நகரத்தின் கொள்ளைப்பொருள்கள்
  rationale: போரில் கைப்பற்றப்பட்ட பொருட்களைக் குறிக்கும் שָׁלָל என்பதற்கு சூழலுக்கேற்ற தெளிவான தமிழ் இணை.
- source_word: הוֹצִיא הַרְבֵּה מְאֹד
  choice: மிகப் பெருமளவில் வெளியே கொண்டுவந்தான்
  rationale: ஹிஃபில் வினையின் ‘வெளியே கொண்டுவருதல்’ என்ற பொருளையும், மிகுதியைக் காட்டும் வலியுறுத்தலையும் பாதுகாக்கிறது.
theological_decisions:
- issue: מַלְכָּם என்பது ‘அவர்களுடைய அரசன்’ என்ற பொதுப்பெயரா, ‘மில்கோம்/மல்காம்’ என்ற அம்மோனிய தெய்வத்தின் பெயரா?
  choice: அவர்களுடைய அரசன்
  alternative: மில்கோம் (அல்லது மல்காம்)
  rationale: வழங்கப்பட்ட மசோரா வாசிப்பும் உடனடி சூழலில் ‘அவனுடைய தலையிலிருந்து’ என்று வருவதும் அரசனைக் குறிக்கும் வாசிப்பை ஆதரிக்கின்றன. எனினும் தெய்வப் பெயராக வாசிக்கும் உண்மையான மாற்றுவாய்ப்பு அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வரலாற்றுக் கதைநடைக்கு ஏற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தாலந்து’ என்ற பண்டைய அலகு மூலத்தின் பண்பாட்டு தன்மையைப் பாதுகாக்கத் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
