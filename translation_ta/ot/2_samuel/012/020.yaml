source:
  edition: WLC
  text: וַ/יָּקָם֩ דָּוִ֨ד מֵ/הָ/אָ֜רֶץ וַ/יִּרְחַ֣ץ וַ/יָּ֗סֶךְ וַ/יְחַלֵּף֙ שמלת/ו וַ/יָּבֹ֥א בֵית יְהוָ֖ה וַ/יִּשְׁתָּ֑חוּ וַ/יָּבֹא֙ אֶל בֵּית֔/וֹ וַ/יִּשְׁאַ֕ל וַ/יָּשִׂ֥ימוּ ל֛/וֹ לֶ֖חֶם וַ/יֹּאכַֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/020.yaml
  text: Then David got up from the ground[a], washed, anointed himself, and changed his clothes. He went into the house of Yahweh and bowed down. Then he went to his house, asked, and they set bread before him, and he ate.
translation:
  language: ta
  text: பிறகு தாவீது தரையிலிருந்து எழுந்து, குளித்து, எண்ணெய் பூசிக்கொண்டு, தமது உடைகளை மாற்றினார். அவர் யாவேயின் இல்லத்திற்குச் சென்று பணிந்தார்[a]. பின்னர் தமது வீட்டுக்குச் சென்று கேட்டார்; அவர்கள் அவருக்கு முன் அப்பத்தை வைத்தார்கள், அவர் சாப்பிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வழிபட்டார்.’ எபிரெய வினைச்சொல் பயபக்தியுடன் உடலைத் தாழ்த்திப் பணிவதையோ வழிபடுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם מֵהָאָרֶץ
  choice: தரையிலிருந்து எழுந்து
  rationale: தாவீது துக்கத்தில் தரையில் கிடந்த சூழலை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: וַיִּרְחַץ
  choice: குளித்து
  rationale: רחץ என்பது கழுவுதல் அல்லது குளித்தலைக் குறிக்கலாம்; துக்கச் சடங்கை முடித்துக்கொள்ளும் இச்சூழலில் ‘குளித்து’ என்பது இயல்பான தமிழ்.
- source_word: וַיָּסֶךְ
  choice: எண்ணெய் பூசிக்கொண்டு
  rationale: சொந்த உடலில் எண்ணெய் பூசிக்கொண்ட செயலைத் தெளிவாகக் கூறுகிறது; தமிழில் ‘அபிஷேகம் செய்துகொண்டு’ என்பது இங்கு தேவையற்ற சடங்குப் பொருளை ஏற்படுத்தலாம்.
- source_word: וַיְחַלֵּף שִׂמְלֹתוֹ
  choice: தமது உடைகளை மாற்றினார்
  rationale: எபிரெயச் சொல் ஒருமை வடிவில் இருந்தாலும் ஆடையைக் கூட்டுப்பொருளில் குறிக்கிறது; நவீன தமிழில் இவ்வடிவம் இயல்பானது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் இல்லம்
  rationale: בית என்பதன் ‘இல்லம்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; இச்சூழலில் அது யாவேயின் பரிசுத்த இடத்தைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமமான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
- source_word: וַיִּשְׁתָּחוּ
  choice: பணிந்தார்
  rationale: உடலைத் தாழ்த்திப் பணியும் செயலைப் பாதுகாக்கிறது; சூழலில் வழிபாடு உட்பட்டிருந்தாலும் அதையே மட்டும் பொருளாக நிர்ணயிக்கவில்லை.
- source_word: וַיִּשְׁאַל
  choice: கேட்டார்
  rationale: எபிரெயத்தில் கேட்கப்பட்ட பொருள் வெளிப்படையாக இல்லை. அடுத்த வாக்கியத்தில் அப்பம் வைக்கப்படுவதால் பொருள் புரிகிறது; ‘உணவு’ என்பதை உரைக்குள் சேர்க்காமல் மூலத்தின் சுருக்கத்தைப் பாதுகாக்கிறது.
- source_word: לֶחֶם
  choice: அப்பம்
  rationale: לֶחֶם என்பதன் நேரடிப் பொருளைப் பாதுகாக்கிறது; அது விரிவாக உணவையும் குறிக்கக்கூடும்.
- source_word: וַיָּשִׂימוּ לוֹ לֶחֶם
  choice: அவர்கள் அவருக்கு முன் அப்பத்தை வைத்தார்கள்
  rationale: குறிப்பிடப்படாத பன்மை எழுவாயைப் பாதுகாத்து, எபிரெய மொழிநடையை இயல்பான தமிழில் தருகிறது.
- source_word: וַיֹּאכַל
  choice: அவர் சாப்பிட்டார்
  rationale: எளிய நிகழ்வுத் தொடரின் முடிவை நவீன பொதுத்தமிழில் நேரடியாகக் கூறுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை தனிப்பட்ட இறைநாமத்தையே பயன்படுத்துவதால், பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் பெயரை ஒலிபெயர்க்கிறது.
- issue: וַיִּשְׁתָּחוּ என்பதில் உடல் பணிவா அல்லது வழிபாடா
  choice: பணிந்தார்
  alternative: வழிபட்டார்
  rationale: வினைச்சொல் உடலைத் தாழ்த்திப் பணிதலையும் வழிபாட்டையும் குறிக்கக்கூடும். யாவேயின் இல்லம் என்ற சூழல் வழிபாட்டை உணர்த்தினாலும், ‘பணிந்தார்’ மூலத்தின் உடல்சார் படிமத்தையும் பொருள் அகலத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கும் பொதுவழக்குக்கும் இடைப்பட்ட, வாசிக்க எளிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மரியாதைப் பன்மை வினைமுற்றுகள் தாவீதைக் குறிக்கின்றன; தேவையற்ற சமயக் கலைச்சொற்கள் தவிர்க்கப்பட்டுள்ளன.
