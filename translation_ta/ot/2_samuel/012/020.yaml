  source_fidelity: 'மூல எபிரெய வினைத்தொடர் முழுமையாகப் பாதுகாக்கப்பட்டுள்ளது: தாவீது தரையிலிருந்து எழுதல், குளித்தல், எண்ணெய் பூசுதல், உடை மாற்றுதல், யாவேயின் இல்லத்திற்குச் சென்று பணிதல், தன் வீட்டிற்குச் சென்று கேட்டல், அவருக்கு அப்பம் வைக்கப்படுதல், அவர் உண்ணுதல் ஆகியவை சரியான வரிசையிலும் பொருளிலும் உள்ளன. וַיִּשְׁאַל என்பதன் குறிப்பிடப்படாத பொருளை ‘கேட்டார்’ எனவே வைத்திருப்பது மூலத்தின் சுருக்கத்தைப் பாதுகாக்கிறது.'
