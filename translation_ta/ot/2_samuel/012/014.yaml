base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/014.yaml
  text: Nevertheless[a], because by this matter you have utterly scorned the enemies of Yahweh, the son born to you will surely die.
translation:
  language: ta
  text: ஆயினும், இந்தக் காரியத்தினால் நீ யாவேவின் பகைவர்களை முற்றிலும் அவமதித்ததால்[a], உனக்குப் பிறந்த மகன் நிச்சயமாக இறப்பான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பல மொழிபெயர்ப்புகள் இந்தக் கடினமான எபிரேயத் தொடரை, “யாவேவின் பகைவர்கள் யாவேவை இகழவும் (அல்லது தூஷிக்கவும்) நீ வாய்ப்பளித்தாய்” என்று விளக்கமான அல்லது திருத்தப்பட்ட வாசிப்பைப் பின்பற்றி மொழிபெயர்க்கின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶפֶס
  choice: ஆயினும்
  rationale: முந்தைய மன்னிப்பு அறிவிப்புக்குப் பின்வரும் வலுவான எதிர்மறைத் திருப்பத்தை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: …தால்
  rationale: அறிவிக்கப்படும் விளைவுக்கான காரணத்தைத் தமிழில் இயல்பான காரணவினையெச்ச அமைப்பால் காட்டுகிறது.
- source_word: נִאֵץ נִאַצְתָּ
  choice: முற்றிலும் அவமதித்ததால்
  rationale: வினையெச்சமும் முற்றுவினையும் சேர்ந்த எபிரெய வலியுறுத்தலை ‘முற்றிலும்’ என்பதால் காத்து, נאץ என்பதன் இகழ்ச்சி/அவமதிப்பு பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: אֶת אֹיְבֵי יְהוָה
  choice: யாவேவின் பகைவர்களை
  rationale: கொடுக்கப்பட்ட மசோரா உரையில் உள்ள நேரடிச் செயப்படுபொருள் அமைப்பை மாற்றாமல் மொழிபெயர்க்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בַּדָּבָר הַזֶּה
  choice: இந்தக் காரியத்தினால்
  rationale: דבר இங்கு குறிக்கும் சம்பவம் அல்லது செயலை உள்ளடக்கும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: גַּם
  choice: வாக்கிய விளைவமைப்பில் உட்பொருளாகக் காட்டப்பட்டது
  rationale: இங்கு கூடுதல் அல்லது வலியுறுத்தல் தரும் துகளின் விசை தமிழில் தனியே ‘மேலும்’ எனச் சேர்த்தால் செயற்கையாக ஒலிக்கும்; விளைவை நேரடியாக அறிவிக்கும் அமைப்பு அதன் விசையைத் தாங்குகிறது.
- source_word: הַבֵּן הַיִּלּוֹד לְךָ
  choice: உனக்குப் பிறந்த மகன்
  rationale: בן என்பதன் ஆண்பால் குறிப்பையும், செயல்பாட்டு பெயரெச்சத்தின் ‘பிறந்த’ பொருளையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: מוֹת יָמוּת
  choice: நிச்சயமாக இறப்பான்
  rationale: முடிவிலி வடிவமும் முற்றா வினையும் சேர்ந்த உறுதியான வலியுறுத்தலை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘யாவேவின் பகைவர்கள்’ இடம்பெறும் கடினமான தொடரின் எழுவாய்/செயப்படுபொருள் பொருள்
  choice: மசோரா உரையை நேரடியாகப் பின்பற்றி, தாவீது ‘யாவேவின் பகைவர்களை முற்றிலும் அவமதித்தான்’ என்று முதன்மை உரையில் வைத்தல்
  alternative: தாவீது யாவேவின் பகைவர்கள் அவமதிக்க அல்லது தூஷிக்க வாய்ப்பளித்தான்; அல்லது தாவீது யாவேவையே அவமதித்தான்
  rationale: கொடுக்கப்பட்ட WLC உரையில் אֵת குறிக்கும் நேரடிச் செயப்படுபொருள் ‘யாவேவின் பகைவர்கள்’ என்பதே. சூழலால் தூண்டப்படும் பொதுவான விளக்க அல்லது திருத்த வாசிப்பு எளிதாகத் தோன்றினாலும், உண்மையான உரைச்சிக்கலைத் தீர்த்துவிடாமல் முதன்மை உரையில் மசோரா வாசிப்பை வைத்து, மாற்று வாசிப்பை அடிக்குறிப்பில் பதிவு செய்கிறது.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆயினும்’, ‘இந்தக் காரியம்’, ‘நிச்சயமாக’ ஆகியவை மூலத்தின் எதிர்மறைத் திருப்பம், பரந்த சம்பவக் குறிப்பு, உறுதியான மரண அறிவிப்பு ஆகியவற்றைத் தெளிவாகக் காக்கின்றன.
