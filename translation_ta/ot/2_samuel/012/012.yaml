theological_decisions:
- issue: அறிவிக்கப்பட்ட தீர்ப்பில் கடவுளின் செயற்பாடு
  choice: ‘நான் ... செய்வேன்’ என்று முதலாம் நபர் தெய்வீக செயற்பாட்டை நேரடியாகப் பேணுதல்
  alternative: ‘நான் இதை நடக்கச் செய்வேன்’
  rationale: எபிரெய உரை நேரடியான முதலாம் நபர் வினையைப் பயன்படுத்துகிறது. தீர்ப்பு வரலாற்றுச் செயல்களின் வழியாக நிறைவேறினாலும், இவ்வசனத்தின் நேரடியான தெய்வீக செயற்பாட்டை மொழிபெயர்ப்பில் மென்மைப்படுத்தக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சூரியனுக்கு முன்பாக’ என்ற எபிரெய உருவகம் சற்றே அசாதாரணமாக இருந்தாலும் வேண்டுமென்றே முதன்மை உரையில் பேணப்பட்டு, அதன் இயல்பான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. அடிக்குறிப்பு குறி அதற்குரிய சொற்றொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
