  revised_text: அதில் இருந்த மக்களை அவன் வெளியே கொண்டுவந்து, அவர்களை ரம்பங்கள்[a], இரும்புக் கொத்துக்கருவிகள், இரும்புக் கோடரிகள் ஆகியவற்றைக் கொண்டு வேலை செய்ய வைத்தான்; செங்கல் சூளையிலும் அவர்களை வேலை செய்ய வைத்தான்.[b] அம்மோனியரின் எல்லா நகரங்களுக்கும் அவன் இவ்வாறே செய்தான்.[c] பின்பு தாவீதும் மக்கள் அனைவரும் எருசலேமுக்குத் திரும்பினார்கள்.
