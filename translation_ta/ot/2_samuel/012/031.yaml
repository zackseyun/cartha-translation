  source_fidelity: முதன்மை உரை எபிரெய வினைச்சொற்களின் காரணவினைப் பொருளையும், கருவிப்பட்டியலையும், செங்கல்-சூளை/செங்கல் வேலை சார்ந்த கடினமான வாசிப்பையும் நன்றாகப் பிரதிபலிக்கிறது. וְהֶעֱבִיר ... במלכן என்ற இடத்தில் கட்டாய உழைப்பு வாசிப்பைத் தேர்ந்தெடுத்திருப்பது ஆங்கில POB audit trail-உடன் ஒத்துள்ளது; மாற்று, மரணதண்டனை சார்ந்த வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
