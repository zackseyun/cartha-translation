  text: וְ/אֶת הָ/עָ֨ם אֲשֶׁר בָּ֜/הּ הוֹצִ֗יא וַ/יָּ֣שֶׂם בַּ֠/מְּגֵרָה וּ/בַ/חֲרִצֵ֨י הַ/בַּרְזֶ֜ל וּֽ/בְ/מַגְזְרֹ֣ת הַ/בַּרְזֶ֗ל וְ/הֶעֱבִ֤יר אוֹתָ/ם֙ ב/מלכן וְ/כֵ֣ן יַעֲשֶׂ֔ה לְ/כֹ֖ל עָרֵ֣י בְנֵֽי עַמּ֑וֹן וַ/יָּ֧שָׁב דָּוִ֛ד וְ/כָל הָ/עָ֖ם יְרוּשָׁלִָֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/031.yaml
  text: And he brought out the people who were in it and put them to work with saws[a], iron picks, and iron axes, and made them labor at the brick kiln. Thus he did to all the cities of the Ammonites[c][b]. Then David and all the people returned to Jerusalem.
translation:
  language: ta
  text: அதில் இருந்த மக்களை அவன் வெளியே கொண்டுவந்து, அவர்களை ரம்பங்கள்[a], இரும்புக் கொத்துக்கருவிகள், இரும்புக் கோடரிகள் ஆகியவற்றைக் கொண்டு வேலை செய்ய வைத்தான்; செங்கல் சூளையிலும் அவர்களை வேலை செய்ய வைத்தான்.[b] அம்மோனியரின் எல்லா நகரங்களுக்கும் அவன் இவ்வாறே செய்தான்.[c] பின்பு தாவீதும் மக்கள் அனைவரும் எருசலேமுக்குத் திரும்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை ரம்பத்தினிடமும், கூரிய இரும்புக் கருவிகளினிடமும், இரும்பு வெட்டுக்கருவிகளினிடமும் வைத்தான்.” இங்கு குறிப்பிடப்படும் கருவிகளின் துல்லியமான பெயர்கள் உறுதியற்றவை.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய வாசகம் கடினமானது. பாரம்பரியமாக, “அவர்களைச் செங்கல் சூளையின் வழியாகக் கடக்கச் செய்தான்” என மொழிபெயர்க்கப்படுகிறது; சிலர் இதைக் கட்டாய உழைப்பாக அல்ல, மரணதண்டனையாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: c
    text: இதே நிகழ்வைப் பற்றிய, இதேபோல் பொருள் தெளிவில்லாத சொற்களைக் கொண்ட இணைப்பகுதிக்கு 1 நாளாகமம் 20:3-ஐப் பார்க்கவும்.
    reason: cross_reference
lexical_decisions:
- source_word: הוֹצִיא
  choice: வெளியே கொண்டுவந்து
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் பொதுவாக ‘வெளியே கொண்டுவருதல்’ என்று பொருள்படும்; காரணவினைப் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: וַיָּשֶׂם
  choice: வேலை செய்ய வைத்தான்
  rationale: சொல்லடியாக ‘வைத்தான்/அமைத்தான்.’ தொடர்ந்து கருவிகள் பட்டியலிடப்படுவதால், கைதிகளை அவற்றைக் கொண்டு கட்டாய உழைப்பில் ஈடுபடுத்தியதாக முதன்மை உரை எடுத்துக்கொள்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בַּמְּגֵרָה
  choice: இரம்பங்கள்
  rationale: מְגֵרָה என்பது இரம்பம். எபிரெயத்தில் ஒருமையாக இருந்தாலும், கருவிகளின் பட்டியலில் கூட்டுப்பொருளாக இயல்பான தமிழ் பன்மை பயன்படுத்தப்பட்டது.
- source_word: בַחֲרִצֵי הַבַּרְזֶל
  choice: இரும்புக் கொத்துக்கருவிகள்
  rationale: இந்தச் சொற்றொடரின் துல்லியமான கருவிப்பெயர் உறுதியற்றது; கூரிய இரும்புக் கருவிகள் அல்லது போரடிக்கும் கருவிகள் எனப் புரிந்துகொள்ளலாம். ‘கொத்துக்கருவிகள்’ உழைப்புச் சூழலுக்கு ஏற்ற, அளவுக்கு மீறித் துல்லியப்படுத்தாத தேர்வு.
- source_word: בְמַגְזְרֹת הַבַּרְזֶל
  choice: இரும்புக் கோடரிகள்
  rationale: מַגְזֵרָה வெட்டும் கருவியைக் குறிக்கிறது. பட்டியலில் இயல்பாக வாசிக்க ‘கோடரிகள்’ என வழங்கப்படுகிறது; கருவிகளின் துல்லிய அடையாளம் உறுதியற்றது என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: וְהֶעֱבִיר אֹתָם
  choice: அவர்களை வேலை செய்ய வைத்தான்
  rationale: சொல்லடியாக ‘அவர்களைக் கடக்கச் செய்தான்.’ அடுத்துள்ள கடினமான சொற்றொடருடன் சேர்ந்து, செங்கல் தயாரிப்புப் பணியில் ஈடுபடுத்தியதாக முதன்மை உரை பொருள் தருகிறது; மரணதண்டனை சார்ந்த பாரம்பரியப் புரிதல் அடிக்குறிப்பில் விடப்படுகிறது.
- source_word: במלכן
  choice: செங்கல் சூளையில்
  rationale: வழங்கப்பட்ட மெய்யெழுத்து வடிவமும் முழுச் சொற்றொடரும் கடினமானவை. செங்கல் தயாரிப்பு அல்லது செங்கல் சூளை சார்ந்த உழைப்பு எனப் புரிந்துகொள்ளும் வாசிப்பு சூழலிலும் நாளாகம இணைப்பகுதியிலும் பொருந்துகிறது; ‘அதன் வழியாகக் கடக்கச் செய்தான்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְכֵן יַעֲשֶׂה
  choice: அவன் இவ்வாறே செய்தான்
  rationale: அம்மோனிய நகரங்களுக்குச் செய்யப்பட்டதைச் சுருக்கிக் கூறும் எபிரெயக் கதையுரை வடிவத்தை இயல்பாகக் காக்கிறது.
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: அம்மோனியரின் எல்லா நகரங்களுக்கும்
  rationale: בְנֵי עַמּוֹן என்பதற்கான இயல்பான நவீனத் தமிழ் இனப்பெயர் ‘அம்மோனியர்.’
- source_word: וַיָּשָׁב ... יְרוּשָׁלִָם
  choice: எருசலேமுக்குத் திரும்பினார்கள்
  rationale: இலக்குடன் வரும் שוב என்பதன் வழக்கமான கதையுரை பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தாவீது அம்மோனியக் கைதிகளை இரும்புக் கருவிகளாலும் சூளையாலும் கொன்றாரா, அல்லது கடுமையான கட்டாய உழைப்பில் ஈடுபடுத்தினாரா?
  choice: கருவிகளைக் கொண்டும் செங்கல் சூளையிலும் அவர்களைக் கட்டாயமாக வேலை செய்ய வைத்தார்
  alternative: அவர்களை இரம்பம் மற்றும் இரும்புக் கருவிகளின் கீழ் வைத்து, செங்கல் சூளையின் வழியாகக் கடக்கச் செய்து கொன்றார்
  rationale: וַיָּשֶׂם மற்றும் וְהֶעֱבִיר ... במלכן ஆகிய சொற்றொடர்கள் பலவாறு புரிந்துகொள்ளப்படுகின்றன. வென்ற மக்களை அடிமைப்படுத்தும் உடனடிச் சூழலும் 1 நாளாகமம் 20:3-ன் இணைப்பகுதியும் உழைப்பு வாசிப்புக்கு ஆதரவளிப்பதால் அது முதன்மை உரையில் உள்ளது. எனினும், மரணதண்டனையைக் குறிக்கும் பாரம்பரிய வாசிப்பை நீக்காமல் அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. முதன்மை உரை இயல்பான கட்டாய-உழைப்பு வாசிப்பைப் பின்பற்றுகிறது; ஆனால் எபிரெயத்தின் உண்மையான சொற்பொருள் மற்றும் விளக்கவியல் தெளிவின்மை அடிக்குறிப்புகளில் மறைக்காமல் காக்கப்பட்டுள்ளது. ‘இரம்பம்,’ ‘கொத்துக்கருவி,’ ‘கோடரி,’ ‘செங்கல் சூளை’ ஆகியவை தொழில்சார் சூழலைத் தெளிவாக்குகின்றன.
