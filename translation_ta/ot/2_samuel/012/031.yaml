  terminology: ‘அம்மோனியர்,’ ‘தாவீது,’ ‘எருசலேம்,’ ‘செங்கல் சூளை’ ஆகியவை பொருத்தமானவை. கருவிகளின் அடையாளம் உறுதியற்றது என்பதால் ‘இரும்புக் கொத்துக்கருவிகள்,’ ‘இரும்புக் கோடரிகள்’ ஆகிய நடைமுறைச் சொற்களைத் தக்கவைத்துக் கொள்ளலாம்; அடிக்குறிப்பு a அவற்றின் உறுதியின்மையைச் சரியாகச் சுட்டுகிறது.
