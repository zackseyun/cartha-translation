  edition: WLC
  text: וַ/יִּשְׁלַ֗ח בְּ/יַד֙ נָתָ֣ן הַ/נָּבִ֔יא וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ יְדִ֣ידְיָ֑הּ בַּ/עֲב֖וּר יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/025.yaml
  text: And he sent word through Nathan the prophet[a], and he called his name Jedidiah[b], because of Yahweh.
translation:
  language: ta
  text: அவர் இறைவாக்கினரான நாத்தானின் மூலம் செய்தி அனுப்பி[a], யாவேயின் பொருட்டு அவனுக்கு “யெதிதியா” என்று பெயரிட்டார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “இறைவாக்கினரான நாத்தானின் கையால் அனுப்பி.”'
    reason: எபிரெய மொழியின் முகமையைக் குறிக்கும் மரபுத்தொடரை விளக்குகிறது.
  - marker: b
    text: “யெதிதியா” என்பதற்கு “யாவின் அன்புக்குரியவன்” அல்லது “யாவேயின் அன்புக்குரியவன்” என்று பொருள் இருக்கலாம்.
    reason: தனிப்பெயரின் சாத்தியமான எபிரெயச் சொற்பொருளை வழங்குகிறது.
lexical_decisions:
- source_word: וַיִּשְׁלַח בְּיַד נָתָן הַנָּבִיא
  choice: இறைவாக்கினரான நாத்தானின் மூலம் செய்தி அனுப்பி
  rationale: שׁלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்புதல்’; בְּיַד என்பது இடைமுகம் அல்லது முகமை குறிக்கும் ‘கையின் மூலம்’ என்ற எபிரெய மரபுத்தொடர். இச்சூழலில் தொடர்புச் செய்தி நாத்தான் மூலம் அனுப்பப்பட்டதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: அவனுக்கு … என்று பெயரிட்டார்
  rationale: ‘அவனுடைய பெயரை அழைத்தார்’ என்ற எபிரெய அமைப்பு பெயரிடுதலைக் குறிக்கிறது; ‘பெயரிட்டார்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: יְדִידְיָהּ
  choice: யெதிதியா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிபெயர்ப்பு. பெயரின் சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בַּעֲבוּר
  choice: பொருட்டு
  rationale: பெயரிடுதலுக்கான காரணம் அல்லது அடிப்படையைச் சுருக்கமாகக் காட்டுகிறது; ‘காரணமாக’ அல்லது ‘நிமித்தம்’ என்பதும் சாத்தியம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் பரவலான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: ‘அனுப்பினார்’, ‘பெயரிட்டார்’ ஆகிய வினைகளின் எழுவாய்
  choice: முந்தைய வசனத்திலிருந்து தொடரும் எழுவாய் யாவே எனக் கொண்டு, தமிழிலும் ‘அவர்’ என்ற சுட்டுப்பெயரால் தொடரப்பட்டுள்ளது.
  alternative: நாத்தான் குழந்தைக்குப் பெயரிட்டார்; அல்லது தாவீது பெயரிட்டார்.
  rationale: 12:24-ன் இறுதியில் யாவே குழந்தையை நேசித்தார் என்பதே மிக அருகிலுள்ள வெளிப்படையான எழுவாய். 12:25-ன் தொடர்வினைகளுக்கு அதே எழுவாய் இயல்பாகத் தொடர்கிறது. எனினும் பெயரைக் குறிப்பிட்டவர் நாத்தான் என்று புரிந்துகொள்ளும் சாத்தியத்தைத் தமிழ் உரை தேவையின்றி விரிவாக்கி மறுப்பதில்லை.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. ‘இறைவாக்கினர்’ என்பது נָבִיא என்பதற்கான தெளிவான சமகாலச் சொல்; ‘யாவே’ தெய்வீகப் பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் எழுவாய் மீண்டும் பெயரிட்டு சொல்லப்படாததால், தமிழிலும் ‘அவர்’ என வைத்துப் பிணைப்பு பாதுகாக்கப்பட்டுள்ளது.
