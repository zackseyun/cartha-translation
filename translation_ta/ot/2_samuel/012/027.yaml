  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח יוֹאָ֛ב מַלְאָכִ֖ים אֶל דָּוִ֑ד וַ/יֹּ֨אמֶר֙ נִלְחַ֣מְתִּי בְ/רַבָּ֔ה גַּם לָכַ֖דְתִּי אֶת עִ֥יר הַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/027.yaml
  text: Then Joab sent messengers to David and said[a], “I have fought against Rabbah; I have also captured the city of waters.”
translation:
  language: ta
  text: பின்பு யோவாப் தாவீதிடம் தூதுவர்களை அனுப்பி, “நான் ரப்பாவுக்கு எதிராகப் போராடியிருக்கிறேன்; மேலும், நீரின் நகரத்தையும் கைப்பற்றியிருக்கிறேன்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் நகரத்தையும்.” இது ரப்பாவின் நீர்வழங்கலைக் கட்டுப்படுத்திய நகரப்பகுதியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: பின்பு ... அனுப்பி
  rationale: வாவ் தொடர்கதை நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; நவீன தமிழில் ‘பின்பு’ இயல்பாக நிகழ்வரிசையைத் தெரிவிக்கிறது.
- source_word: מַלְאָכִים
  choice: தூதுவர்களை
  rationale: இச்சூழலில் மனிதர்களாக அனுப்பப்பட்ட செய்தியாளர்களையே குறிக்கிறது; ‘தூதுவர்கள்’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: נִלְחַמְתִּי בְרַבָּה
  choice: நான் ரப்பாவுக்கு எதிராகப் போரிட்டு
  rationale: בְ உடன் வரும் நகரப்பெயர் இங்கு முற்றுகை அல்லது தாக்குதலின் இலக்கைக் குறிக்கிறது; ‘எதிராகப் போரிட்டு’ இராணுவச் சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רַבָּה
  choice: ரப்பா
  rationale: இடப்பெயர் நவீனத் தமிழ் ஒலிபெயர்ப்பு முறையில் வழங்கப்படுகிறது; சுற்றியுள்ள உரையிலிருந்து அம்மோனியரின் ரப்பா என்பது தெளிவாகிறது.
- source_word: גַּם
  choice: -த்தையும்
  rationale: தமிழின் இணைப்பு வேற்றுமை உருபான ‘-ஐயும்’ முதல் செயலோடு இரண்டாவது சாதனையைச் சேர்க்கும் ‘மேலும்/கூட’ என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: לָכַדְתִּי
  choice: கைப்பற்றியிருக்கிறேன்
  rationale: இராணுவ வெற்றியைக் குறிக்கும் வினையாக ‘கைப்பற்று’ பொருத்தமானது; நிறைவேறிய செயலின் தற்போதைய விளைவை ‘இருக்கிறேன்’ வெளிப்படுத்துகிறது.
- source_word: עִיר הַמָּיִם
  choice: தண்ணீர் நகரம்
  rationale: எபிரெயச் சேர்க்கைத் தொடரை மிகையாக விளக்காமல் நெருக்கமாகப் பாதுகாக்கிறது; அது நீர்வழங்கலைக் கட்டுப்படுத்திய நகரப்பகுதியைக் குறிக்கலாம் என்றாலும், அந்த விளக்கம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
