translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மூலத்தின் ‘தண்ணீர் நகரம்’ என்ற தெளிவற்ற சொற்றொடர் முதன்மை உரையில் பாதுகாக்கப்பட்டு, சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
