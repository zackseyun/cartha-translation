base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/010.yaml
  text: Now therefore[a], the sword shall never depart from your house[b], because you have despised me and have taken the wife of Uriah the Hittite to be your wife.
translation:
  language: ta
  text: ஆகவே, இனி வாள் உன் வீட்டிலிருந்து[a] ஒருபோதும் நீங்காது. ஏனெனில், நீ என்னை இகழ்ந்து[b], ஏத்தியனான உரியாவின் மனைவியை உனக்கு மனைவியாக எடுத்துக்கொண்டாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் வீடு’ என்பது உன் குடும்பத்தையோ, உன் வீட்டாரையோ, உன் அரச மரபையோ குறிக்கலாம்; எபிரேயச் சொல் இவற்றை உள்ளடக்கக்கூடியது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேய மூலத்தில், ‘நீ என்னை இகழ்ந்தாய்’ என்று உள்ளது; உரியாவுக்கும் அவன் மனைவிக்கும் எதிராகச் செய்யப்பட்ட குற்றம் இறைவனையே அவமதித்ததாக இங்கு முன்வைக்கப்படுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகவே, இனி
  rationale: וְעַתָּה என்பதில் உள்ள காலப் பொருளையும், முந்தைய குற்றச்சாட்டிலிருந்து தொடரும் தீர்ப்பின் விளைவையும் இயல்பான நவீனத் தமிழில் ஒருங்கிணைக்கிறது.
- source_word: לֹא תָסוּר ... עַד עוֹלָם
  choice: ஒருபோதும் நீங்காது
  rationale: סור என்பதன் ‘நீங்குதல்’ என்ற பொருளையும், עַד עוֹלָם தரும் நீடித்த மறுப்பின் வலிமையையும் இயல்பாகக் காட்டுகிறது.
- source_word: חֶרֶב
  choice: வாள்
  rationale: வன்முறைப் போரையும் தீர்ப்பையும் குறிக்கும் எபிரேய உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: מִבֵּיתְךָ
  choice: உன் வீட்டைவிட்டு
  rationale: ‘வீடு’ என்பது குடும்பம், வீட்டார், அரச மரபு ஆகியவற்றை உள்ளடக்கக்கூடிய எபிரேயச் சொல்லின் திட்டமிட்ட விரிவைச் சுருக்காமல் வைத்திருக்கிறது.
- source_word: עֵקֶב כִּי
  choice: ஏனெனில்
  rationale: அறிவிக்கப்பட்ட தீர்ப்புக்கான காரணத்தைத் தெளிவாகவும் இயல்பாகவும் அறிமுகப்படுத்துகிறது.
- source_word: בְזִתָנִי
  choice: நீ என்னை இகழ்ந்து
  rationale: בזה வினைச்சொல்லின் அவமதித்தல் அல்லது இகழ்தல் என்ற வலிமையையும், முதலாம் நபர் ஒருமை இறைவனையே நேரடியாகக் குறிப்பதையும் பாதுகாக்கிறது.
- source_word: וַתִּקַּח
  choice: எடுத்துக்கொண்டாய்
  rationale: முடிந்த செயலை இயல்பான தமிழில் காட்டுகிறது; அடுத்துள்ள ‘உனக்கு மனைவியாக’ என்பதுடன் சேர்ந்து மண உறவுக்காக எடுத்ததைத் தெளிவாக்குகிறது.
- source_word: אֵשֶׁת אוּרִיָּה הַחִתִּי
  choice: ஏத்தியனான உரியாவின் மனைவியை
  rationale: அவள் உரியாவின் மனைவி என்ற ஏற்கெனவே இருந்த மண உறவை வலியுறுத்தும் எபிரேயத் தொடர் அமைப்பைப் பாதுகாக்கிறது.
- source_word: לִהְיוֹת לְךָ לְאִשָּׁה
  choice: உனக்கு மனைவியாக
  rationale: ‘உனக்கு மனைவியாக இருக்கும்படி’ என்ற சொற்சொல் வடிவத்தை இயல்பான, சுருக்கமான தமிழில் தருகிறது.
theological_decisions:
- issue: ‘நீ என்னை இகழ்ந்து’ என்பதில் முதலாம் நபரின் குறிப்பு
  choice: ‘என்னை’ என்று இறைவனை நேரடியாகக் குறிக்கும் வடிவத்தைத் தக்கவைத்தல்
  alternative: ‘ஆண்டவரின் வார்த்தையை/கட்டளையை இகழ்ந்து’ என்று விளக்கி விரிவாக்குதல்
  rationale: எபிரேய உரையில் முதலாம் நபர் ஒருமை பின்னொட்டு நேரடியாக உள்ளது. உரியாவுக்கும் அவன் மனைவிக்கும் எதிரான தாவீதின் செயல் இறைவனை இகழ்வதாகவே முன்வைக்கப்படும் இறையியல் வலிமையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
- issue: ‘உன் வீடு’ என்பதன் வரம்பு
  choice: ‘உன் வீடு’ என்ற விரிவான உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘உன் குடும்பம்’, ‘உன் வீட்டார்’ அல்லது ‘உன் அரச மரபு’ என்று குறிப்பாக்குதல்
  rationale: எபிரேயச் சொல் குடும்பத்தையும் வீட்டாரையும் அரச வம்சத்தையும் உள்ளடக்கக்கூடும். ஒரு பொருளுக்கு மட்டும் அதைச் சுருக்காமல் உண்மையான பொருள் விரிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் தீர்க்கதரிசனத் தீர்ப்புக்குரிய கண்ணியமும் தீவிரமும் நிலைக்குமாறும் வடிவமைக்கப்பட்டது. ‘வீடு’ மற்றும் ‘என்னை’ ஆகியவற்றின் திட்டமிட்ட விரிவும் இறையியல் அழுத்தமும் விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டன.
