base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/008.yaml
  text: And I gave you your master's house and your master's wives into your bosom[a], and I gave you the house of Israel and Judah; and if that had been too little[b], I would have added to you such and such things.
translation:
  language: ta
  text: உன் எஜமானின் வீட்டையும், உன் எஜமானின் மனைவிகளையும் உன் மடியில்[a] கொடுத்தேன்; இஸ்ரவேல் மற்றும் யூதாவின் வீட்டையும் உனக்குக் கொடுத்தேன். இது போதாதிருந்தால், இவை போன்ற இன்னும் பலவற்றையும்[b] உனக்குச் சேர்த்துக் கொடுத்திருப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் நேரடியாக, ‘உன் மடியில்’ அல்லது ‘உன் மார்பில்.’ இந்த மரபுத்தொடர் நெருக்கமான பெறுதலையோ உடைமையையோ உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேய மரபுத்தொடரை ‘இப்படிப்பட்டவற்றையும் அப்படிப்பட்டவற்றையும்’ என்றும் மொழிபெயர்க்கலாம்; இதே வகையைச் சேர்ந்த இன்னும் பலவற்றைச் சேர்த்துக் கொடுப்பது இதன் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: கொடுத்தேன்
  rationale: נתן என்பதன் Qal wayyiqtol வடிவம்; கர்த்தர் தாவீதுக்குச் செய்தவற்றை விவரிக்கும் இறந்தகாலத் தொடர் வினையாக இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: בֵּית אֲדֹנֶיךָ
  choice: உன் எஜமானின் வீடு
  rationale: בַּיִת என்பது வீடு, வீட்டார், அரசகுலம் அல்லது உடைமைத் தொகுதி ஆகியவற்றைக் குறிக்கலாம். 'வீடு' என்ற சொல் எபிரேய உருவகத்தையும் அதன் பரந்த பொருள் வாய்ப்பையும் காக்கிறது.
- source_word: נְשֵׁי אֲדֹנֶיךָ
  choice: உன் எஜமானின் மனைவிகள்
  rationale: நேரடியான இணைப்புத் தொடர். இங்கு אֲדֹנֶיךָ சவுலைக் குறிப்பதால், இறைத்தலைப்புடன் குழப்பமில்லாத 'எஜமான்' பயன்படுத்தப்படுகிறது.
- source_word: בְּחֵיקֶךָ
  choice: உன் மடியில்
  rationale: חֵיק என்பதன் அடிப்படைப் பொருள் மார்பு அல்லது மடி. 'உன் மடியில்' என்பது நெருக்கமான ஏற்றுக்கொள்ளல் அல்லது உடைமையை உணர்த்தும் உருவகத்தைத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: בֵּית יִשְׂרָאֵל וִיהוּדָה
  choice: இஸ்ரவேல் வீடும் யூதாவும்
  rationale: முன்னுள்ள 'வீடு' என்பதுடனான இணைநிலையைப் பாதுகாக்கிறது; இது மக்கள், அரசாட்சி அல்லது அரசுரிமையின் பரப்பைக் குறிக்கக்கூடியதாக இருப்பதால் 'ராஜ்யம்' என்று விளக்கி வரையறுக்கப்படவில்லை.
- source_word: וְאִם מְעָט
  choice: இது போதாதிருந்தால்
  rationale: מְעָט என்பதன் சொற்பொருள் 'சிறிது'; இச்சூழலில் கிடைத்தவை போதாமையாக இருந்திருக்குமானால் என்ற நிபந்தனைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וְאֹסִפָה לְּךָ
  choice: உனக்குச் சேர்த்துக் கொடுத்திருப்பேன்
  rationale: יסף என்பதன் Hiphil வடிவம் 'மேலும் சேர்த்தல்' என்று பொருள் தருகிறது; முந்தைய நிபந்தனையுடன் தொடர்புடைய சாத்தியமற்ற/கருதுகோள் விளைவைத் தமிழ் வினைமுற்று வெளிப்படுத்துகிறது.
- source_word: כָּהֵנָּה וְכָהֵנָּה
  choice: இதுபோன்றவற்றையும் இன்னும் அதிகமாகவும்
  rationale: இரட்டிக்கப்பட்ட சுட்டுச் சொற்றொடர் இதே வகையானவற்றை மேலும் சேர்த்திருப்பதை உணர்த்தும் மரபுத்தொடர்; குறிப்பிடப்படாத கூடுதல்களைத் தெளிவாகவும் மிகைவிளக்கமின்றியும் தருகிறது.
theological_decisions:
- issue: சவுலின் மனைவிகள் தாவீதுக்குக் கொடுக்கப்பட்டதாகக் கூறுவது அவர்களைத் தாம்பத்தியத் துணைகளாக எடுத்துக்கொண்டதற்கு இறை அங்கீகாரம் அளிக்கிறதா
  choice: மூலத்தின் 'உன் எஜமானின் மனைவிகளை உன் மடியில் கொடுத்தேன்' என்ற கூற்றைத் தக்கவைத்து, அதன் பொருளைத் தனியாகத் தாம்பத்திய அங்கீகாரமாகவோ வெறும் பாதுகாப்புப் பொறுப்பாகவோ விரிவாக்கவில்லை.
  alternative: ‘உன் எஜமானின் அந்தப்புரத்தை உனக்குக் கொடுத்தேன்’ அல்லது ‘அவருடைய பெண்களை உன் பராமரிப்பில் ஒப்படைத்தேன்’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: எபிரேயம் அரசுரிமை மாற்றத்தோடு தொடர்புடைய நெருக்கமான உடைமை அல்லது பெறுதலைக் கூறுகிறது; அதன் நெறியியல் அல்லது தாம்பத்திய விளைவுகளை உரை வெளிப்படையாகத் தீர்மானிக்கவில்லை. எனவே இறையியல் பதற்றம் அப்படியே பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிதில் புரியும், ஆனால் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வாக்கிய இணைநிலை மற்றும் எபிரேய உருவகங்கள் இயன்றவரை காக்கப்பட்டுள்ளன; தெளிவிற்காகத் தேவையான இடங்களில் மட்டும் இயல்பான தமிழ் அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
