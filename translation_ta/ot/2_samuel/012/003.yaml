source:
  edition: WLC
  text: וְ/לָ/רָ֣שׁ אֵֽין כֹּ֗ל כִּי֩ אִם כִּבְשָׂ֨ה אַחַ֤ת קְטַנָּה֙ אֲשֶׁ֣ר קָנָ֔ה וַ/יְחַיֶּ֕/הָ וַ/תִּגְדַּ֥ל עִמּ֛/וֹ וְ/עִם בָּנָ֖י/ו יַחְדָּ֑ו מִ/פִּתּ֨/וֹ תֹאכַ֜ל וּ/מִ/כֹּס֤/וֹ תִשְׁתֶּה֙ וּ/בְ/חֵיק֣/וֹ תִשְׁכָּ֔ב וַ/תְּהִי ל֖/וֹ כְּ/בַֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/003.yaml
  text: But the poor man had nothing except one little ewe lamb[a], which he had bought. He kept it alive, and it grew up with him and with his children together; it would eat from his morsel and drink from his cup and lie in his bosom[c][b], and it was like a daughter to him.
translation:
  language: ta
  text: ஆனால் அந்த ஏழையிடம் அவன் வாங்கியிருந்த ஒரே ஒரு சிறிய பெண் ஆட்டுக்குட்டியைத் தவிர வேறொன்றும் இல்லை. அவன் அதை உயிரோடு பேணி வளர்த்தான். அது அவனோடும் அவன் மகன்களோடும் சேர்ந்து வளர்ந்தது; அவனுடைய உணவிலிருந்து உண்டு, அவனுடைய கோப்பையிலிருந்து குடித்து, அவன் மடியிலே படுத்துக்கொள்ளும். அது அவனுக்கு ஒரு மகளைப்போல் இருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָשׁ
  choice: ஏழை
  rationale: செல்வந்தனுக்கு எதிராக நிறுத்தப்படும் வறிய ஆணைக் குறிக்கிறது; தமிழில் சூழலால் ஆண்பால் குறிப்பு தெளிவாகிறது.
- source_word: אֵין כֹּל כִּי אִם
  choice: …தவிர வேறொன்றும் இல்லை
  rationale: ஒரே ஒரு விதிவிலக்கைத் தவிர முழுமையான இல்லாமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כִּבְשָׂה אַחַת קְטַנָּה
  choice: ஒரே ஒரு சிறிய பெண் ஆட்டுக்குட்டி
  rationale: எண்ணிக்கை, சிறுமை, பெண்பால் ஆகிய மூன்றையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר קָנָה
  choice: அவன் வாங்கியிருந்த
  rationale: קנה என்பதன் இச்சூழலுக்குரிய வாங்குதல் என்ற பொருளையும் முன்நிகழ்வையும் தருகிறது.
- source_word: וַיְחַיֶּהָ
  choice: உயிரோடு பேணி வளர்த்தான்
  rationale: ஹிப்இல் வடிவின் உயிரைப் பாதுகாத்தல் என்ற நேரடிப் பொருளையும் தொடர்ந்த பராமரிப்பையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: וַתִּגְדַּל
  choice: வளர்ந்தது
  rationale: குடும்பத்தோடு ஆட்டுக்குட்டி வளர்ந்ததை எளிமையாகக் கூறுகிறது.
- source_word: עִמּוֹ וְעִם בָּנָיו יַחְדָּו
  choice: அவனோடும் அவன் மகன்களோடும் சேர்ந்து
  rationale: בָּנָיו என்பதன் முறையான ‘மகன்கள்’ பொருளையும் יַחְדָּו என்பதன் ஒன்றிணைந்த குடும்ப வாழ்வையும் பாதுகாக்கிறது.
- source_word: מִפִּתּוֹ
  choice: அவனுடைய உணவிலிருந்து
  rationale: פַּת என்பது அப்பத்துண்டு அல்லது உணவுக்கவளம் என வரலாம்; நவீன தமிழில் இயல்பான ‘உணவு’ அந்தப் பகிர்வைத் தெளிவுபடுத்துகிறது.
- source_word: מִכֹּסוֹ
  choice: அவனுடைய கோப்பையிலிருந்து
  rationale: உரிமையையும் நெருக்கமான பகிர்வையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: בְחֵיקוֹ
  choice: அவன் மடியிலே
  rationale: חֵיק குறிக்கும் மார்பு/அணைப்பு/மடி பரப்பில், வீட்டுக்குள் செல்லமாக வைத்திருக்கும் குட்டிக்குப் பொருத்தமான இயல்பான தமிழ் ‘மடி’.
- source_word: תִשְׁכָּב
  choice: படுத்துக்கொள்ளும்
  rationale: ‘படுத்திருத்தல்’ என்ற உடல்சார் படிமத்தைப் பாதுகாத்து, அவசியமின்றி ‘தூங்கும்’ என்று குறிப்பாக்கவில்லை.
- source_word: וַתְּהִי לוֹ כְּבַת
  choice: அது அவனுக்கு ஒரு மகளைப்போல் இருந்தது
  rationale: உவமையையும் ஆழ்ந்த குடும்பப் பாசத்தையும் நேரடியாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: பெண் ஆட்டுக்குட்டியை மனிதக் குடும்ப உறுப்பினரைப்போல் சித்தரிக்கும் நெருக்கமான இல்லறப் படிமம்
  choice: பாசமிக்க குடும்ப மொழியைத் தெளிவாகத் தக்கவைத்தல்
  alternative: உணர்ச்சித் தீவிரத்தைக் குறைக்கும் வகையில் பொதுவாக மொழிபெயர்த்தல்
  rationale: எபிரெய உரை உவமையின் இரக்க உணர்வைத் திட்டமிட்டு உயர்த்துகிறது; இதை மென்மைப்படுத்துவது நாத்தானின் கதையின் தாக்கத்தைக் குறைக்கும்.
- issue: בָּנָיו என்பதன் மொழிபெயர்ப்பு
  choice: மகன்கள்
  alternative: பிள்ளைகள்
  rationale: மூல உரையின் ஆண்பால் பன்மையை முறையாகப் பாதுகாக்க ‘மகன்கள்’ தேர்ந்தெடுக்கப்பட்டது; பரந்த குடும்பச் சூழலைக் குறிக்கும் ‘பிள்ளைகள்’ சாத்தியமான இயல்பாக்கம் என்றாலும் அவசியமில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாய் இருந்தாலும் கண்ணியமான கதைநடை. மூலத்தின் அன்பும் பரிதாபமும் நிறைந்த இல்லறப் படிமம் பாதுகாக்கப்பட்டுள்ளது. தேவையற்ற ஆங்கில அடிக்குறிப்புகள் ஏற்கப்படவில்லை; தமிழாக்கத்தில் உண்மையான தெளிவின்மை தனி அடிக்குறிப்பு தேவைப்படாத அளவில் இயல்பாக வெளிப்படுகிறது.
