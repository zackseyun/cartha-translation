base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/015.yaml
  text: Then Nathan went to his house[a], and Yahweh struck the child whom Uriah’s wife had borne to David[c][b], and it became sick.
translation:
  language: ta
  text: பின்பு நாத்தான் தன் வீட்டுக்குப் போனான். உரியாவின் மனைவி தாவீதுக்குப் பெற்ற குழந்தையை யாவே தாக்கினார்[a][b]; அந்தக் குழந்தை நோயுற்றது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘துன்புறுத்தினார்’ அல்லது ‘வாதையால் பீடித்தார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘உரியாவின் மனைவி.’ இங்கு பத்சேபாளின் பெயரை நேரடியாகச் சொல்லாமல் இருப்பதை இந்தச் சொற்றொடர் காக்கிறது.
    reason: cultural_note
  - marker: c
    text: ‘அது நோயுற்றிருந்தது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: பின்பு ... போனான்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வின் அடுத்த கட்டத்தை முன்னெடுக்கிறது; ‘பின்பு’ என்பது இயல்பான தமிழ் கதைநடையைத் தருகிறது.
- source_word: בֵּיתוֹ
  choice: தன் வீட்டுக்கு
  rationale: ‘அவனுடைய வீடு’ என்ற எபிரெய நேரடிப் பொருளை, எழுவாயான நாத்தானைக் தெளிவாகச் சுட்டும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: וַיִּגֹּף
  choice: தாக்கினார்
  rationale: נָגַף என்பது தீங்கு விளைவிக்கும் வகையில் அடித்தல் அல்லது தாக்குதல் என்பதைக் குறிக்கிறது. நோயின் குறிப்பிட்ட தன்மையை முன்கூட்டியே நிர்ணயிக்காமல், கடவுளின் நேரடி செயற்பாட்டை இது காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הַיֶּלֶד
  choice: குழந்தை
  rationale: சூழலில் குறிப்பிடப்படுவது பிறந்த இளம் குழந்தை; ‘குழந்தை’ என்பது துல்லியமும் இயல்பும் உடையது.
- source_word: אֲשֶׁר יָלְדָה אֵשֶׁת אוּרִיָּה לְדָוִד
  choice: உரியாவின் மனைவி தாவீதுக்குப் பெற்ற குழந்தை
  rationale: எபிரெய உறவுத்தொடரின் பொருளையும், பத்சேபாளின் பெயரைச் சொல்லாமல் ‘உரியாவின் மனைவி’ என்று கூறும் கதையாடலின் திட்டமிட்ட சொல்லாட்சியையும் காக்கிறது.
- source_word: וַיֵּאָנַשׁ
  choice: அந்தக் குழந்தை நோயுற்றது
  rationale: வினை குழந்தை நோயுற்ற நிலையை அடைந்ததைக் குறிக்கிறது. தமிழில் சுட்டுப்பெயரால் ஏற்படக்கூடிய தெளிவின்மையைத் தவிர்க்க ‘அந்தக் குழந்தை’ மீண்டும் கூறப்படுகிறது; ‘மிகவும்’ போன்ற வலியுறுத்தல் முதன்மை உரையில் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: குழந்தையின் நோயில் கடவுளின் செயற்பாடு
  choice: யாவே குழந்தையைத் தாக்கினார்
  alternative: குழந்தை நோயுறும்படி யாவே செய்தார்
  rationale: எபிரெய உரை செயலை யாவேக்கு நேரடியாகக் கூறுகிறது. அதை மென்மையாக்காமலும், தாக்குதலின் வடிவத்தை உரை கூறுவதைக் கடந்து விளக்காமலும் மொழிபெயர்க்கப்படுகிறது.
- issue: பெண்ணை அடையாளப்படுத்தும் முறை
  choice: உரியாவின் மனைவி
  alternative: பத்சேபாள்
  rationale: இந்த இடத்தில் மூல உரை அவளுடைய பெயரைத் தவிர்த்து, உரியாவுடனான உறவை முன்னிறுத்துகிறது; அந்த ஒழுக்க மற்றும் கதையாடல் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இறைவனின் நேரடி செயற்பாடும் ‘உரியாவின் மனைவி’ என்ற மூலத்தின் திட்டமிட்ட சொல்லாட்சியும் மென்மையாக்கப்படவில்லை. குழந்தையைக் குறிக்கும் தமிழ் அஃறிணை இலக்கணம் இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது.
