source:
  edition: WLC
  text: וְ/עַתָּ֗ה אֱסֹף֙ אֶת יֶ֣תֶר הָ/עָ֔ם וַ/חֲנֵ֥ה עַל הָ/עִ֖יר וְ/לָכְדָ֑/הּ פֶּן אֶלְכֹּ֤ד אֲנִי֙ אֶת הָ/עִ֔יר וְ/נִקְרָ֥א שְׁמִ֖/י עָלֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/028.yaml
  text: Now gather the rest of the troops[a], camp against the city, and capture it, lest I capture the city and it be called by my name.
translation:
  language: ta
  text: இப்போது மீதமுள்ள படையினரைத் திரட்டி, நகருக்கு எதிராக முகாமிட்டு, அதைக் கைப்பற்றுங்கள். இல்லையெனில், நானே நகரைக் கைப்பற்றுவேன்; அதன்மேல் என் பெயர் அழைக்கப்படும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, அந்த நகரைக் கைப்பற்றிய பெருமை யோவாபுக்குச் சேரும். எபிரெயத்தில் சொல்லுக்கு நெருக்கமாக, “என் பெயர் அதன்மேல் அழைக்கப்படும்” என்று உள்ளது; “அது என் பெயரால் அழைக்கப்படும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: எபிரெய மொழிமரபின் சொற்பொருளையும், வெற்றிக்கான பெருமை அல்லது உரிமை யாருக்குச் சேரும் என்ற அதன் சூழல்பொருளையும் விளக்குகிறது.
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: அவசரமான அடுத்த நடவடிக்கையை அறிமுகப்படுத்தும் உரையாடல் இணைப்பாக இயல்பாக உள்ளது.
- source_word: אֱסֹף
  choice: திரட்டி
  rationale: இராணுவச் சூழலில் மீதமுள்ள படையினரை ஒன்றுசேர்க்கும் கட்டளையைத் தெளிவாகக் காட்டுகிறது.
- source_word: יֶתֶר הָעָם
  choice: மீதமுள்ள படையினரை
  rationale: עָם என்பதன் அடிப்படைப் பொருள் ‘மக்கள்’ என்றாலும், முற்றுகைப் போரின் சூழலில் தாவீதிடம் உள்ள மீதிப் போர்ப்படையையே குறிக்கிறது.
- source_word: וַחֲנֵה עַל הָעִיר
  choice: நகருக்கு எதிராக முகாமிட்டு
  rationale: חנה என்பதன் ‘முகாமிடு’ என்ற பொருளையும், עַל இங்கு குறிக்கும் பகைமை சார்ந்த நிலைப்பாட்டையும் காக்கிறது; ‘முற்றுகையிடு’ என்று விளக்கமாக விரிவாக்கவில்லை.
- source_word: וְלָכְדָהּ
  choice: அதைக் கைப்பற்றுங்கள்
  rationale: போரில் ஒரு நகரைக் கைப்பற்றுவதைக் குறிக்கும் לכד என்பதற்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: פֶּן
  choice: இல்லையெனில்
  rationale: எச்சரிக்கையுடன் கூடிய எதிர்மறை விளைவை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֶלְכֹּד אֲנִי
  choice: நானே நகரைக் கைப்பற்றிவிடுவேன்
  rationale: வலியுறுத்தப்பட்ட אֲנִי என்பதைக் ‘நானே’ என்றும், நிகழ்ந்து முடிந்துவிடக்கூடிய எச்சரிக்கைத் தொனியை ‘கைப்பற்றிவிடுவேன்’ என்றும் வெளிப்படுத்துகிறது.
- source_word: וְנִקְרָא שְׁמִי עָלֶיהָ
  choice: அதன்மேல் என் பெயர் அழைக்கப்படும்
  rationale: ‘என் பெயர் அதன்மேல் அழைக்கப்படும்’ என்ற எபிரெய மொழிமரபை நெருக்கமாகக் காத்து, பெயரிடுதல், உரிமை அல்லது வெற்றிப் பெருமை சார்ந்த நுட்பத்தை உடனே ஒரே விளக்கமாகச் சுருக்காமல் விடுகிறது.
