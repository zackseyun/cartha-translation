translation_notes:
  register: யோவாப் அரசனாகிய தாவீதிடம் பேசுவதால், ஒருமைக் கட்டளையைத் தமிழில் மரியாதை பன்மையான ‘நீங்கள்/கைப்பற்றுங்கள்’ வடிவில் வெளிப்படுத்தப்பட்டுள்ளது. நடை நவீனமானதும் கண்ணியமானதும்; இராணுவச் சூழல் தெளிவாக இருந்தாலும் மூலத்தில் இல்லாத கூடுதல் முற்றுகை விவரங்கள் சேர்க்கப்படவில்லை.
