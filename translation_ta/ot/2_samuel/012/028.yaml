  to: இப்போது மீதமுள்ள படையினரைத் திரட்டி, நகருக்கு எதிராக முகாமிட்டு, அதைக் கைப்பற்றுங்கள். இல்லையெனில், நானே நகரைக் கைப்பற்றுவேன்; அதன்மேல் என் பெயர் அழைக்கப்படும்[a].
