base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/018.yaml
  text: And on the seventh day the child died. And David’s servants were afraid to tell him that the child was dead[a], for they said, “Behold, while the child was still alive, we spoke to him, and he did not listen to our voice. How then can we say to him, ‘The child is dead’? He may do harm.”
translation:
  language: ta
  text: ஏழாம் நாளில் குழந்தை இறந்தது. குழந்தை இறந்துவிட்டது என்று தாவீதிடம் சொல்ல அவருடைய பணியாளர்கள் பயந்தார்கள்[a]. ஏனெனில், “இதோ, குழந்தை உயிரோடு இருந்தபோதே நாம் அவரிடம் பேசினோம்; அவர் நமது பேச்சைக் கேட்கவில்லை. அப்படியிருக்க, ‘குழந்தை இறந்துவிட்டது’ என்று அவரிடம் எப்படிச் சொல்வோம்? அவர் தீங்கு ஏதாவது செய்துவிடக்கூடும்” என்று அவர்கள் சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கடைசி வாக்கியத்தை, “அவர் தீமை செய்யக்கூடும்,” “அவர் மோசமாக நடந்துகொள்ளக்கூடும்,” அல்லது “அவர் தனக்கே தீங்கு செய்துகொள்ளக்கூடும்” என்றும் புரிந்துகொள்ளலாம். எபிரெயச் சொற்றொடர் சுருக்கமாக இருப்பதால், அவர்கள் அஞ்சிய செயல் துல்லியமாகக் குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
