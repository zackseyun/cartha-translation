- source_word: וַיָּמָת הַיָּלֶד
  choice: குழந்தை இறந்தது
  rationale: יֶלֶד என்பதற்கு ‘குழந்தை’ என்பது இங்குள்ள பச்சிளம் குழந்தைச் சூழலுக்கு ஏற்றது.
- source_word: וַיִּרְאוּ עַבְדֵי דָוִד
  choice: தாவீதின் பணியாளர்கள் பயந்தார்கள்
  rationale: இங்கு ירא என்பது மரியாதையையல்ல, அச்சத்தைக் குறிக்கிறது; ‘பணியாளர்கள்’ நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: לְהַגִּיד לוֹ כִּי מֵת הַיֶּלֶד
  choice: குழந்தை இறந்துவிட்டது என்று தாவீதிடம் சொல்ல
  rationale: அறிவிக்க வேண்டிய செய்தியின் நிறைவேறிய நிலையை ‘இறந்துவிட்டது’ இயல்பாக வெளிப்படுத்துகிறது; பெயரைத் திரும்பச் சொல்வது தமிழில் குறிப்பைத் தெளிவாக்குகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் செயல்பாட்டை கண்ணியமான, வழக்கிலுள்ள தமிழில் தக்கவைக்கிறது.
- source_word: בִּהְיוֹת הַיֶּלֶד חַי
  choice: குழந்தை உயிரோடு இருந்தபோதே
  rationale: முந்தைய நிலையையும் இப்போதைய இறப்பையும் ஒப்பிடும் வலியுறுத்தலை ‘போதே’ இயல்பாகக் காட்டுகிறது.
- source_word: דִּבַּרְנוּ אֵלָיו
  choice: நாம் அவரிடம் பேசினோம்
  rationale: דבר אל என்பதன் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: וְלֹא שָׁמַע בְּקוֹלֵנוּ
  choice: அவர் நமது பேச்சைக் கேட்கவில்லை
  rationale: எபிரெய மொழிமரபின் பொருள் ‘எங்களுக்குச் செவிசாய்க்கவில்லை’; சொல்லுக்குச் சொல் ‘குரலைக் கேட்கவில்லை’ என்பதைக் காட்டிலும் இது நவீனத் தமிழில் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: וְאֵיךְ נֹאמַר אֵלָיו
  choice: அப்படியிருக்க ... அவரிடம் எப்படிச் சொல்வோம்?
  rationale: முந்தைய கூற்றிலிருந்து எழும் அச்சமிக்க வினாவின் அனுமானத் தொடர்பை ‘அப்படியிருக்க’ வெளிப்படுத்துகிறது.
- source_word: וְעָשָׂה רָעָה
  choice: அவர் தீங்கு ஏதாவது செய்துவிடக்கூடும்
  rationale: ரָעָה குறிக்கும் தீமை அல்லது தீங்கை வைத்துக்கொண்டு, செயல் யாருக்கு எதிரானது என்பதைக் குறிப்பிடாமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: וְעָשָׂה רָעָה என்பதில் அஞ்சப்படும் செயல் என்ன?
  choice: அவர் தீங்கு ஏதாவது செய்துவிடக்கூடும்
  alternative: அவர் தனக்கே தீங்கு செய்துகொள்ளக்கூடும்; அவர் தீமை செய்யக்கூடும்; அவர் மோசமாக நடந்துகொள்ளக்கூடும்
  rationale: எபிரெயத்தில் செயலின் பாதிக்கப்படுபவர் அல்லது துல்லியமான தன்மை குறிப்பிடப்படவில்லை. தற்கொலை, ஒழுக்கத் தீமை, அல்லது வெறும் உணர்ச்சிவசப்பட்ட எதிர்வினை என்று தீர்மானிக்காமல் அந்தத் திறந்த தன்மையை முதன்மை உரை காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கதைநடைக்கு ஏற்ற கண்ணியமான, எளிதில் புரியும் நடை. பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன. மூலத்தின் தெளிவின்மையை விளக்க அடிக்குறிப்பு பயன்படுத்தப்பட்டுள்ளது.
