base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/013.yaml
  text: Then David said to Nathan[a], “I have sinned against Yahweh.” And Nathan said to David, “Yahweh also has taken away your sin[b]; you shall not die.”
translation:
  language: ta
  text: அப்போது தாவீது நாத்தானிடம், “நான் யாவேக்கு எதிராகப் பாவம் செய்தேன்” என்றார். நாத்தான் தாவீதிடம், “யாவேயும் உமது பாவத்தை நீக்கிவிட்டார்[a]; நீர் சாகமாட்டீர்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது பாவத்தை அகற்றிவிட்டார்.” எபிரெய வினைச்சொல் சொற்பட “கடந்து போகச் செய்தார்” என்று பொருள்படும்; இங்கு அது பாவக் குற்றப்பொறுப்பை நீக்குவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீர் மரிக்கமாட்டீர்.” எபிரெயம் ‘நீர் சாகமாட்டீர்’ என்று மட்டுமே கூறுகிறது. சட்டச் சூழல் மரணத் தண்டனையிலிருந்து விடுவிக்கப்பட்டதைக் குறிக்கக்கூடும்; ஆனால் ‘கொல்லப்படமாட்டீர்’ என்று வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: நான் ... பாவம் செய்தேன்
  rationale: חטא வினையின் Qal perfect முதலாம் நபர் ஒருமை வடிவம். முடிந்த செயலை நேரடியான ஒப்புக்கொள்ளுதலாக இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு விரோதமாக
  rationale: חטא உடன் வரும் ל இங்கு குற்றம் யாருக்கு எதிரானது என்ற உறவைக் குறிக்கிறது; ‘விரோதமாக’ என்பது தமிழில் தெளிவான பாவ அறிக்கையைத் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் காணப்படும் தனிப்பெயரான יהוה-ஐ பொதுப் பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என ஒலிபெயர்க்கிறது.
- source_word: גַּם
  choice: -வும்
  rationale: ‘யெகோவாவும்’ என்பதிலுள்ள இணைப்பு விகுதி גַּם என்பதன் தொடர்ச்சி அல்லது வலியுறுத்தல் நுணுக்கத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: הֶעֱבִיר
  choice: நீக்கிவிட்டார்
  rationale: עבר என்பதன் Hiphil வடிவம் சொற்பட ‘கடந்து போகச் செய்தார்’ என்று பொருள்படலாம்; பாவத்துடன் இங்கு அது பாவக் குற்றப்பொறுப்பை அகற்றியதைக் குறிக்கிறது. ‘நீக்கிவிட்டார்’ தெளிவாகவும் மிகை விளக்கமின்றியும் உள்ளது.
- source_word: חַטָּאתְךָ
  choice: உமது பாவத்தை
  rationale: חטאת என்பதற்கு பாவம், குற்றப்பொறுப்பு, பாவநிவாரணப் பலி ஆகிய பொருள்கள் இருக்கலாம். இங்கு தாவீது சற்றுமுன் ஒப்புக்கொண்ட குற்றமே நேரடிக் குறிப்பு; எனவே ‘பாவம்’ பொருத்தமானது.
- source_word: לֹא תָמוּת
  choice: நீர் சாகமாட்டீர்
  rationale: மறுக்கப்பட்ட מות imperfect வடிவம் தாவீது சாகமாட்டார் என்று கூறுகிறது. ‘கொல்லப்படமாட்டீர்’ என்று சட்டத் தண்டனையை வெளிப்படையாகச் சேர்க்காமல், மூலத்தின் எளிய கூற்றைப் பாதுகாக்கிறது.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: அப்போது ... என்றார்; அதற்கு ... என்றார்
  rationale: எபிரெயக் கதைத் தொடரை வார்த்தைக்கு வார்த்தை மீளாமல், அதன் வரிசையையும் பதிலுரையின் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, தமிழில் பரவலாக அறியப்படும் வடிவத்தைப் பயன்படுத்துகிறது; எபிரெய உச்சரிப்பு முழுமையாக உறுதியானதல்ல.
- issue: הֶעֱבִיר חַטָּאתְךָ கூறும் மன்னிப்பின் இயல்பு
  choice: உமது பாவத்தை நீக்கிவிட்டார்
  alternative: உமது பாவத்தை அகற்றிவிட்டார்; உமது பாவம் கடந்து போகும்படி செய்தார்
  rationale: இறைவன் தாவீதின் பாவத்தை அகற்றி, அதன் விளைவாக அவரை மரணத்திலிருந்து விடுவித்தார் என்று வசனம் கூறுகிறது; ஆனால் இங்கே பரிகாரத்தின் செயல்முறையை விளக்கவில்லை. எனவே பின்னைய கோட்பாட்டுச் சொற்களைச் சேர்க்காமல் அந்தத் திறந்த நிலையைக் காக்கிறது.
- issue: לֹא תָמוּת என்பதிலுள்ள மரணக் கூற்று
  choice: நீர் சாகமாட்டீர்
  alternative: நீர் கொல்லப்படமாட்டீர்
  rationale: சூழல் மரணத் தண்டனையை நினைவூட்டினாலும், எபிரெயம் சொற்பட ‘சாகமாட்டீர்’ என்றே கூறுகிறது. சட்டரீதியான விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் ambiguity-ஐப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதை ஒருமை (‘உமது’, ‘நீர்’) பயன்படுத்தப்பட்டுள்ளது. நடை கண்ணியமாகவும் சாதாரண வாசகர்களுக்குத் தெளிவாகவும் வைக்கப்பட்டுள்ளது. ‘சாகமாட்டீர்’ என்பது மூலத்தின் நேரடியான ‘die’ என்பதைக் காக்கிறது; அடிக்குறிப்பில் ‘மரிக்கமாட்டீர்’ மாற்றாக வழங்கப்படுகிறது.
