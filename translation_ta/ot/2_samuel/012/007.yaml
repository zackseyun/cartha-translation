base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/007.yaml
  text: 'Then Nathan said to David[a], “You are the man! Thus says Yahweh, the God of Israel: I anointed you king over Israel, and I delivered you from the hand of Saul.”'
translation:
  language: ta
  text: 'அப்போது நாத்தான் தாவீதிடம், “நீயே அந்த மனிதன்! இஸ்ரவேலின் கடவுளாகிய யாவே இவ்வாறு கூறுகிறார்: ‘நானே உன்னை இஸ்ரவேலின்மேல் அரசனாக அபிஷேகம் செய்தேன்; நானே உன்னை சவுலின் கையிலிருந்து விடுவித்தேன்.’” என்றார்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையில் நிகழ்வின் தொடர்ச்சியைக் காட்டுகிறது.
- source_word: אַתָּה הָאִישׁ
  choice: நீயே அந்த மனிதன்!
  rationale: வினைச்சொல் இல்லாத எபிரெய வாக்கியம் மிகுந்த வலியுறுத்தலுடன் உச்சக்கட்டக் குற்றச்சாட்டை முன்வைக்கிறது. ‘நீயே’ அந்த வலியுறுத்தலைத் தமிழில் தருகிறது; ‘அந்த மனிதன்’ முந்தைய உவமையில் குறிப்பிடப்பட்ட மனிதனை இயல்பாகச் சுட்டுகிறது.
- source_word: כֹּה אָמַר
  choice: இவ்வாறு கூறுகிறார்
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தின் முறையான தன்மையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டம் அல்ல, எபிரெய வேதாகமத்தின் தெய்வீகப் பெயர்; ஆகவே தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: இணைப்புக் கட்டமைப்பைத் தெளிவான, மரியாதைக்குரிய தமிழில் தருகிறது.
- source_word: אָנֹכִי ... וְאָנֹכִי
  choice: நானே ... நானே
  rationale: தனிப்பட்ட சுட்டுப்பெயரின் மீளுரைப்பிலும் வலியுறுத்தலிலும் உள்ள குற்றம்சாட்டும் வலிமையைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מְשַׁחְתִּיךָ לְמֶלֶךְ
  choice: உன்னை ... அரசனாக அபிஷேகம் செய்தேன்
  rationale: மன்னராட்சிப் பதவிக்கான எண்ணெய்பூசித் தேர்ந்தெடுத்தலைக் குறிக்கும் மூலச்சொல்லின் வரலாற்று மற்றும் இறையியல் நிறையைப் பாதுகாக்கிறது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல்
  rationale: அரசாட்சியின் அதிகார எல்லையைக் குறிக்கும் עַל என்பதன் பொருளை நேரடியாகத் தருகிறது.
- source_word: הִצַּלְתִּיךָ
  choice: உன்னை ... விடுவித்தேன்
  rationale: ஆபத்து மற்றும் பகைவரின் அதிகாரத்திலிருந்து மீட்ட செயலைக் குறிக்கிறது; இச்சூழலில் தேவையற்ற பிற இறையியல் அர்த்தங்களைச் சேர்ப்பதில்லை.
- source_word: מִיַּד שָׁאוּל
  choice: சவுலின் கையிலிருந்து
  rationale: ‘கை’ என்பது அதிகாரம் அல்லது பிடியைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் ஏற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: אָנֹכִי என்பதன் இருமுறை வலியுறுத்தல்
  choice: நானே ... நானே
  alternative: நான் ... நான்
  rationale: தாவீதுக்கு வழங்கிய அரசப் பதவியும் பாதுகாப்பும் யாவே செய்தவை என்பதை வலியுறுத்தும் மூலத்தின் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; தீர்க்கதரிசன அறிவிப்புக்கு உரிய கண்ணியமான நடை காக்கப்பட்டுள்ளது. ‘அபிஷேகம்’ வரலாற்று அரச நியமனச் செயலைப் பாதுகாக்கப் பயன்படுத்தப்பட்டுள்ளது; மிகப் பழமையான வாக்கிய அமைப்புகள் தவிர்க்கப்பட்டுள்ளன.
