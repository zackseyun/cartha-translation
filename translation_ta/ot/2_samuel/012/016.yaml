  text: וַ/יְבַקֵּ֥שׁ דָּוִ֛ד אֶת הָ/אֱלֹהִ֖ים בְּעַ֣ד הַ/נָּ֑עַר וַ/יָּ֤צָם דָּוִד֙ צ֔וֹם וּ/בָ֥א וְ/לָ֖ן וְ/שָׁכַ֥ב אָֽרְצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/016.yaml
  text: And David sought God on behalf of the boy[b][a]. David fasted a fast, and he went in and spent the night and lay on the ground.
translation:
  language: ta
  text: தாவீது அந்தச் சிறுவனுக்காக[a] கடவுளை நாடினார். அவர் நோன்பு நோற்று[b], உள்ளே சென்று, இரவு முழுவதும் தரையில் படுத்திருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சிறுவன்’ என்பது நோயால் தாக்கப்பட்ட தாவீதின் ஆண் குழந்தையைக் குறிக்கிறது (வச. 15, 18). இங்குள்ள எபிரெயச் சொல்லை ‘குழந்தை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் ‘நோன்பை நோற்றார்’ என்பதுபோல் ஒரே வேரைச் சேர்ந்த வினைச்சொல்லும் பெயர்ச்சொல்லும் சேர்ந்து வந்து செயலை வலியுறுத்துகின்றன. இயல்பான தமிழில் ‘உண்ணாவிரதம் இருந்தார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: நாடினார்
  rationale: בקש என்பதன் அடிப்படைப் பொருளான ஆர்வத்துடன் தேடுதல் அல்லது நாடுதலை இது காக்கிறது; இச்சூழலில் கடவுளிடம் வேண்டிக்கொண்டார் என்ற பொருள் இயல்பாகப் புலப்படும், ஆனால் வினைச்சொல் மட்டுமே தராத வலிமையைச் சேர்க்கவில்லை.
- source_word: אֶת־הָאֱלֹהִים
  choice: கடவுளை
  rationale: எபிரெய உரையில் தாவீது நாடியவர் கடவுள் என்று நேரடியாகக் குறிப்பிடப்படுகிறது.
- source_word: בְּעַד
  choice: அந்தச் சிறுவனுக்காக
  rationale: בעד இங்கு மற்றொருவரின் நலனுக்காகச் செய்யப்படும் வேண்டுதலைக் குறிக்கிறது; தமிழில் ‘-க்காக’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַנַּעַר
  choice: அந்தச் சிறுவன்
  rationale: נער என்பதன் நேரடியான பொருட்களில் ‘சிறுவன்’ ஒன்றாகும். சூழலில் இது நோயுற்ற தாவீதின் ஆண் குழந்தையைக் குறிக்கிறது; அந்தக் குறிப்பு அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: וַיָּצָם ... צוֹם
  choice: உண்ணாநோன்பு நோற்று
  rationale: வினைச்சொல்லும் அதே வேரைச் சேர்ந்த பெயர்ச்சொல்லும் இணையும் எபிரெய வலியுறுத்தலை, தமிழில் இயல்பாக அமைந்த ‘உண்ணாநோன்பு நோற்று’ என்ற பெயர்–வினைத் தொடரால் ஓரளவு பிரதிபலிக்கிறது.
- source_word: וּבָא
  choice: உள்ளே சென்று
  rationale: בוא இங்கு உள்ளே செல்லுதலைக் குறிக்கிறது; தமிழ்க் கதைநடையில் ‘உள்ளே சென்று’ இயல்பானது.
- source_word: וְלָן
  choice: இரவு முழுவதும்
  rationale: לון ஓரிடத்தில் இரவைக் கழிப்பதைக் குறிக்கிறது. அடுத்துள்ள படுத்திருத்தலுடன் இணைத்து இயல்பான தமிழில் கால அளவு வெளிப்படுத்தப்படுகிறது.
- source_word: וְשָׁכַב אָרְצָה
  choice: தரையில் படுத்துக் கிடந்தார்
  rationale: שכב மற்றும் ארצה ஆகியவை தரையில் படுத்திருக்கும் உடல்நிலையைச் சுட்டுகின்றன; ‘தரை’ என்பது வீட்டின் தரையா வெளிப்புற நிலமா என்பதைத் தேவையின்றி நிர்ணயிப்பதில்லை.
theological_decisions:
- issue: கடவுளை ‘நாடுதல்’ என்பது ஜெபமா அல்லது பொதுவாகத் தேடுதலா
  choice: கடவுளை நாடினார்
  alternative: கடவுளிடம் மன்றாடினார்
  rationale: சூழல் மன்றாட்டை உணர்த்தினாலும், בקש என்ற வினைச்சொல் தனியாக ‘மன்றாடினார்’ என்ற வலிமையான விளக்கத்தை கட்டாயப்படுத்தாது. ஆகவே மூலத்தின் பரந்த பொருளும் அதன் சூழல்சார் ஜெபத் தொனியும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உண்ணாநோன்பு நோற்று’ என்பது சற்றே இலக்கியத் தொனி கொண்டிருந்தாலும் இயல்பான தமிழ்த் தொடராகவும் எபிரெய வலியுறுத்தலை பிரதிபலிப்பதாகவும் உள்ளது.
