id: 2SA.12.1
reference: 2 Samuel 12:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֧ח יְהוָ֛ה אֶת נָתָ֖ן אֶל דָּוִ֑ד וַ/יָּבֹ֣א אֵלָ֗י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ שְׁנֵ֣י אֲנָשִׁ֗ים הָיוּ֙ בְּ/עִ֣יר אֶחָ֔ת אֶחָ֥ד עָשִׁ֖יר וְ/אֶחָ֥ד רָֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/001.yaml
  text: Then Yahweh sent Nathan to David. He came to him and said to him[a], “There were two men in one city, one rich and one poor.”
translation:
  language: ta
  text: பின்பு யாவே நாத்தானை தாவீதிடம் அனுப்பினார். நாத்தான் தாவீதிடம் வந்து, அவரிடம், “ஒரு நகரத்தில் இரண்டு மனிதர்கள் இருந்தார்கள்[a]. ஒருவன் செல்வந்தன்; இன்னொருவன் ஏழை” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு நகரத்தில் இரண்டு மனிதர்கள் வாழ்ந்தார்கள்.” எபிரெயத்தில் சொல்லுக்குச் சொல், “ஒரு நகரத்தில் இரண்டு மனிதர்கள் இருந்தார்கள்.”
    reason: הָיוּ என்பதைக் ‘இருந்தார்கள்’ என்று நேரடியாகவோ, சூழலுக்கேற்ப ‘வாழ்ந்தார்கள்’ என்று இயல்பாகவோ புரிந்துகொள்ள முடியும்.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினார்
  rationale: שׁלח என்பதன் வழக்கமான கதைநடைப் பொருள் ‘அனுப்புதல்’; நவீனத் தமிழில் இது இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கு எழுத்துப் பெயர்; ஆகவே அதைப் பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: אֶת נָתָן
  choice: நாத்தானை
  rationale: אֶת என்பது நேரடி செயப்படுபொருள் குறியீடு; தமிழில் இரண்டாம் வேற்றுமை உருபுடன் நாத்தான் என்ற பெயர் தரப்பட்டுள்ளது.
- source_word: אֶל דָּוִד
  choice: தாவீதிடம்
  rationale: אֶל இங்கு நாத்தான் அனுப்பப்பட்ட இலக்கைச் சுட்டுகிறது; ‘தாவீதுக்கு எதிராக’ என்று பொருளை முன்கூட்டியே தீவிரப்படுத்தாமல் ‘தாவீதிடம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיָּבֹא אֵלָיו
  choice: நாத்தான் தாவீதிடம் வந்து
  rationale: בוא אֶל என்பது ‘ஒருவரிடம் வருதல்’ எனப் பொருள்படும். தமிழில் சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்க இருவரின் பெயர்களும் வெளிப்படையாகத் தரப்பட்டுள்ளன.
- source_word: וַיֹּאמֶר לוֹ
  choice: அவரிடம் … என்று கூறினார்
  rationale: எபிரெயத்தில் மறைமுகச் செயப்படுபொருள் வெளிப்படையாக இருப்பதால் ‘அவரிடம்’ தக்கவைக்கப்பட்டுள்ளது.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: இரண்டு மனிதர்கள்
  rationale: இது உவமையில் வரும் இரண்டு ஆண்களைக் குறிக்கும் பொதுவான சொற்றொடர்; ‘இரண்டு மனிதர்கள்’ மூலத்தின் வடிவத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הָיוּ
  choice: இருந்தார்கள்
  rationale: היה இங்கு இருப்பைக் குறிக்கும் வினையாக உள்ளது. ‘வாழ்ந்தார்கள்’ என்பது சூழலுக்கு ஏற்ற மாற்றாக இருந்தாலும், மூலத்தில் வெளிப்படையாக இல்லாத வாழ்விட நுணுக்கத்தைச் சேர்க்கும்.
- source_word: בְּעִיר אֶחָת
  choice: ஒரு நகரத்தில்
  rationale: சொல்லுக்குச் சொல் ‘ஒரு நகரத்தில்’; ‘ஒரே நகரத்தில்’ என்பது இருவரும் அதே நகரத்தில் இருந்தனர் என்பதைச் சற்று வலியுறுத்தும் என்பதால் தவிர்க்கப்பட்டுள்ளது.
- source_word: אֶחָד עָשִׁיר
  choice: ஒருவன் செல்வந்தன்
  rationale: எபிரெயத்தின் வினையற்ற கூறை இயல்பான தமிழில் எழுவாய்–பயனிலை அமைப்பாகத் தருகிறது.
- source_word: וְאֶחָד רָאשׁ
  choice: இன்னொருவன் ஏழை
  rationale: רָאשׁ என்பது வறிய அல்லது ஏழையான ஒருவரைக் குறிக்கிறது; செல்வந்தனுக்கு நேர்மாறான தெளிவான தமிழ்ச் சொல் ‘ஏழை’.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையில் தனிப்பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது; ‘யாவே’ என்பது எபிரெயப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட மீளமைக்கப்பட்ட உச்சரிப்பைத் தமிழில் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான வினைநடையை இயல்பான தமிழ்ச் சொற்றொடராக அமைத்துள்ள போதிலும், நாத்தான் தாவீதிடம் வந்ததும் அவரிடமே கூறியதும் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
