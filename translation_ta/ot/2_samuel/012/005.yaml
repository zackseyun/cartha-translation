  text: וַ/יִּֽחַר אַ֥ף דָּוִ֛ד בָּ/אִ֖ישׁ מְאֹ֑ד וַ/יֹּ֨אמֶר֙ אֶל נָתָ֔ן חַי יְהוָ֕ה כִּ֣י בֶן מָ֔וֶת הָ/אִ֖ישׁ הָ/עֹשֶׂ֥ה זֹֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/005.yaml
  text: Then David burned with anger against the man greatly[a], and he said to Nathan, “As Yahweh lives, the man who has done this is a son of death!”
translation:
  language: ta
  text: அப்போது அந்த மனிதன்மீது தாவீதின் கோபம் மிகவும் பற்றியெரிந்தது. அவர் நாத்தானிடம், “யாவே வாழ்வதுபோல, இதைச் செய்த அந்த மனிதன் சாவுக்குரியவன்[a]!” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில் நேரடியாக, “மரணத்தின் மகன்”; அதாவது, சாகத் தகுதியானவன் அல்லது மரணத் தண்டனைக்குரியவன்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף דָּוִד
  choice: தாவீதின் கோபம் பற்றியெரிந்தது
  rationale: எபிரேய மொழியின் ‘கோபம் எரிதல்’ என்ற வலுவான உருவகத்தை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: בָּאִישׁ
  choice: அந்த மனிதன்மீது
  rationale: தாவீதின் கோபம் செலுத்தப்பட்ட நபரைக் குறிக்கும் בְּ முன்னிடைச்சொல்லின் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: מְאֹד
  choice: மிகவும்
  rationale: தாவீதின் கோபத்தின் தீவிரத்தை வெளிப்படையாகப் பிரதிபலிக்கிறது.
- source_word: חַי יְהוָה
  choice: யாவே உயிரோடிருப்பது உறுதி!
  rationale: இது சத்திய உறுதிமொழிச் சூத்திரம். தமிழில் அதன் சத்திய வலிமையையும் தெய்வீகப் பெயரையும் காக்கும் இயல்பான வடிவம்.
- source_word: בֶן מָוֶת
  choice: சாவுக்குரியவன்
  rationale: சொல்லுக்கு சொல் ‘மரணத்தின் மகன்’ என்றாலும், இங்கு மரணத் தண்டனைக்குத் தகுதியான அல்லது மரணத்திற்குப் பாத்திரமான ஒருவனைக் குறிக்கும் எபிரேய மரபுத்தொடரின் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: הָאִישׁ הָעֹשֶׂה זֹאת
  choice: இதைச் செய்த அந்த மனிதன்
  rationale: குறிப்பிட்ட குற்றச்செயலால் அந்த மனிதனை அடையாளப்படுத்தும் எபிரேயப் பெயரெச்சத் தொடரைத் தெளிவான தமிழ்ச் சார்பு வாக்கியமாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: בֶן מָוֶת என்பதை சொல்லுருவாகவா அல்லது பொருளுருவாகவா வழங்குவது
  choice: சாவுக்குரியவன்
  alternative: மரணத்தின் மகன்
  rationale: ‘மரணத்தின் மகன்’ என்பது தமிழில் தவறாகப் புரியக்கூடும்; ‘சாவுக்குரியவன்’ மரணத்திற்கு உட்பட்டவன் அல்லது மரணத் தண்டனைக்குத் தகுதியானவன் என்ற மூல மரபுத்தொடரின் நீதித்துறைச் சார்ந்த வலிமையை இயல்பாகக் காக்கிறது. அதன் நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘பற்றியெரிந்தது’ மூலத்தின் தீவிர உருவகத்தைத் தக்கவைக்கிறது; ‘சாவுக்குரியவன்’ தெளிவுக்காகப் பொருளுருவில் தரப்பட்டு, நேரடி எபிரேயச் சொற்றொடர் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
