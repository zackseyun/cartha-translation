  text: וַ/יִּלָּ֣חֶם יוֹאָ֔ב בְּ/רַבַּ֖ת בְּנֵ֣י עַמּ֑וֹן וַ/יִּלְכֹּ֖ד אֶת עִ֥יר הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/026.yaml
  text: And Joab fought against Rabbah of the Ammonites and captured the royal city[a].
translation:
  language: ta
  text: யோவாப் அம்மோனியரின் ரப்பாவுக்கு எதிராகப் போரிட்டு, அரச நகரத்தைக் கைப்பற்றினான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தலைநகரத்தைக் கைப்பற்றினான்.’ எபிரெய மொழியில் சொல்லுக்குச் சொல், ‘அரசாட்சி/அரசுரிமையின் நகரம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֶם
  choice: எதிராகப் போரிட்டு
  rationale: நிஃபால் வடிவிலுள்ள לחם போரில் ஈடுபடுவதைக் குறிக்கிறது. சூழலில் உள்ள எதிர்நிலையை இயல்பான தமிழில் வெளிப்படுத்த ‘எதிராகப் போரிட்டு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: רַבַּת בְּנֵי עַמּוֹן
  choice: அம்மோனியரின் ரப்பா
  rationale: ‘ரப்பா’ என்பது இடப்பெயர்; בְּנֵי עַמּוֹן என்பது அம்மோன் மக்களைக் குறிக்கும் வழக்கமான இன-அரசியல் பெயர். ‘அம்மோனியரின் ரப்பா’ என்பது மூலத்தின் உறவைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיִּלְכֹּד
  choice: கைப்பற்றினான்
  rationale: לכד என்பது குறிப்பாகப் போர்ச் சூழலில் பிடித்தல் அல்லது கைப்பற்றுதல் என்று பொருள்படும். நகரத்தை இராணுவ ரீதியாக வசப்படுத்தியதை ‘கைப்பற்றினான்’ துல்லியமாகக் காட்டுகிறது.
- source_word: עִיר הַמְּלוּכָה
  choice: அரச நகரம்
  rationale: இந்த எபிரெயச் சொற்றொடர் நேரடியாக ‘அரசாட்சி/அரசுரிமையின் நகரம்’ எனப் பொருள்படும். ‘அரச நகரம்’ மூலத்துக்கு நெருக்கமாகவும் இயல்பாகவும் உள்ளது; ‘தலைநகரம்’ என்பது சாத்தியமான ஆனால் சற்றே விளக்கமளிக்கும் மொழிபெயர்ப்பு என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. போர்ச் சூழலைத் தெளிவாக்க ‘எதிராகப் போரிட்டு’ என்றும், עִיר הַמְּלוּכָה என்பதன் உண்மையான சொற்பொருள் வரம்பைப் பாதுகாக்க ‘அரச நகரம்’ என்றும் பயன்படுத்தப்பட்டுள்ளது.
