  yaml_path: translation/ot/genesis/018/013.yaml
  text: And the LORD said to Abraham, “Why did Sarah laugh, saying, ‘Will I really bear a child, now that I am old?’”
translation:
  language: ta
  text: அப்போது ஆண்டவர் ஆபிரகாமிடம், “சாராள், ‘நான் முதிர்ந்தவளாக இருக்கையில், உண்மையிலேயே பிள்ளை பெறுவேனா?’ என்று சொல்லி, ஏன் சிரித்தாள்?” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தேவனுடைய உடன்படிக்கைப் பெயரைக் குறிக்கும் வழக்கமான, மரியாதைமிக்க தமிழ் வேதாகம நடை; தனிப்பெயரின் செயல்பாட்டை முற்றிலும் மறைக்காமல் பொதுவாசகர்களுக்குப் பரிச்சயமான வடிவம்.
- source_word: לָמָּה זֶּה צָחֲקָה
  choice: ஏன் சிரித்து
  rationale: எபிரெயக் கேள்வியின் இயல்பான தமிழாக்கம்; זֶּה இங்கு கேள்விக்கு வலியுறுத்தல் தருவதால் தனியே சொல்லாக்கப்படவில்லை.
- source_word: הַאַף אֻמְנָם
  choice: உண்மையிலேயே ... பெறுவேனா?
  rationale: பல கேள்வித் துகள்களின் வலியுறுத்தலையும் சாராளின் நம்பமுடியாத வியப்பையும் இயல்பான நவீன தமிழில் பாதுகாக்கிறது.
- source_word: אֵלֵד
  choice: பிள்ளை பெறுவேனா
  rationale: மூலத்தில் நேரடியாக ‘பெறுதல்/பிரசவித்தல்’ என்றாலும், சூழலில் பிள்ளைப்பேற்றைக் குறிக்கும் இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: וַאֲנִי זָקַנְתִּי
  choice: நான் முதிர்ந்துவிட்ட பிறகும்
  rationale: சாராளின் முதுமை ஏற்கெனவே ஏற்பட்ட நிலை என்பதை நிறைவுவினை காட்டுகிறது; கேள்விக்குள் இயல்பாக இணைக்க ‘பிறகும்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: தெய்வீகப் பெயர் יהוה-ன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: தமிழில் நிலைபெற்ற மரியாதைமிக்க பிரதிநிதிப்பைத் தேர்ந்தெடுக்கிறது; குறிப்பிட்ட உச்சரிப்பை உரைக்குள் கட்டாயப்படுத்தாமல் மூலத்தின் தெய்வீக அடையாளத்தைச் சுட்டுகிறது.
- issue: சாராளின் கேள்வியின் தொனி
  choice: உண்மையிலேயே ... பெறுவேனா?
  alternative: நிச்சயமாகப் பெறுவேனா?
  rationale: இது வெறும் தகவல் கேள்வி அல்ல; நம்பமுடியாத வியப்பையும் சந்தேகத் தொனியையும் கொண்டது. ‘உண்மையிலேயே’ அந்தத் திறந்த தொனியைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்க, வாசிக்க எளிய உரைநடை. நேரடி உரையின் உள்ளேயுள்ள மேற்கோள் தெளிவாக வைக்கப்பட்டுள்ளது; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
