source:
  edition: WLC
  text: א֠וּלַי יַחְסְר֞וּ/ן חֲמִשִּׁ֤ים הַ/צַּדִּיקִם֙ חֲמִשָּׁ֔ה הֲ/תַשְׁחִ֥ית בַּ/חֲמִשָּׁ֖ה אֶת כָּל הָ/עִ֑יר וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית אִם אֶמְצָ֣א שָׁ֔ם אַרְבָּעִ֖ים וַ/חֲמִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/028.yaml
  text: Suppose five of the fifty righteous are lacking—will you destroy the whole city for five? And he said[c][b][a], “I will not destroy it if I find forty-five there.”
translation:
  language: ta
  text: “ஒருவேளை ஐம்பது நீதிமான்களில் ஐந்து பேர் குறைவாக இருந்தால்,[a] அந்த ஐந்து பேர் குறைவினால் நகரம் முழுவதையும் அழித்துவிடுவீரா?” என்று கேட்டான். அதற்கு அவர், “அங்கே நாற்பத்தைந்து பேரை நான் கண்டால், அதை அழிக்கமாட்டேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சார்ந்த முறையில்: “ஒருவேளை ஐம்பது நீதிமான்கள் ஐந்து பேர் குறைந்திருந்தால்.”'
    reason: எபிரெயத்தில் ‘ஐம்பது நீதிமான்கள்’ இலக்கண எழுவாயாகவும், ‘ஐந்து’ குறைவின் அளவாகவும் அமைந்துள்ள அசாதாரண சொல்லமைப்பைக் காட்டுகிறது.
lexical_decisions:
- source_word: אוּלַי
  choice: ஒருவேளை
  rationale: ஆபிரகாம் முன்வைக்கும் தயக்கத்துடனான கற்பனைச் சூழலை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: יַחְסְרוּן חֲמִשִּׁים הַצַּדִּיקִם חֲמִשָּׁה
  choice: ஐம்பது நீதிமான்களில் ஐந்து பேர் குறைவாக இருந்தால்
  rationale: தேவையான ஐம்பது என்ற எண்ணிக்கையில் ஐந்து பேர் குறைந்து நாற்பத்தைந்து பேர் மட்டுமே இருப்பதைக் குழப்பமின்றி தெரிவிக்கிறது; எபிரெயச் சொல்லமைப்பின் பொருளையும் இயல்பான தமிழையும் சமநிலைப்படுத்துகிறது.
- source_word: הַצַּדִּיקִם
  choice: நீதிமான்கள்
  rationale: மனிதர்களைக் குறிக்கும் பன்மையையும், இச்சூழலிலுள்ள ஒழுக்க மற்றும் நீதித்தீர்ப்பு சார்ந்த பொருளையும் காக்கும் நிலையான தமிழ் வேதாகமச் சொல்.
- source_word: הֲתַשְׁחִית
  choice: அழித்துவிடுவீரா
  rationale: שׁחת என்பதன் ஹிஃபில் வடிவிலுள்ள ‘அழித்தல்’ என்ற நேரடிப் பொருளைத் தருகிறது; கேள்வியின் மரியாதைத் தொனிக்காக உயர்திணை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
- source_word: בַּחֲמִשָּׁה
  choice: அந்த ஐந்து பேர் குறைவுக்காக
  rationale: בְּ இங்கு காரணம் அல்லது கணக்கைச் சுட்டுவதை வெளிப்படுத்துகிறது; வெறும் ‘ஐந்து பேருக்காக’ என்று மொழிபெயர்த்தால் ஐந்து நீதிமான்களுக்காக நகரம் அழிக்கப்படுமா என்ற எதிர்பொருள் தோன்றக்கூடும் என்பதால் ‘குறைவு’ தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: אֶת כָּל הָעִיר
  choice: நகரம் முழுவதையும்
  rationale: நகரத்தின் முழுமையையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: לֹא אַשְׁחִית
  choice: அதை அழிக்கமாட்டேன்
  rationale: முந்தைய ‘அழித்தல்’ என்ற வினையை மீண்டும் பயன்படுத்தி எபிரெய உரையின் சொல் தொடர்பைக் காக்கிறது; ‘அதை’ என்பது நகரத்தைக் குறிக்கிறது.
- source_word: אִם אֶמְצָא שָׁם אַרְבָּעִים וַחֲמִשָּׁה
  choice: அங்கே நாற்பத்தைந்து பேரை நான் கண்டால்
  rationale: நிபந்தனை அமைப்பையும் ‘அங்கே’ என்ற இடச்சுட்டையும் காத்து, எண்ணிக்கையை நவீன தமிழின் இயல்பான வடிவில் தருகிறது.
- source_word: וַיֹּאמֶר
  choice: அதற்கு அவர் ... என்றார்
  rationale: பேச்சுக்கு அளிக்கப்படும் பதிலைத் தமிழில் தெளிவாக்குகிறது; எபிரெயத்தில் எழுவாய் மறைமுகமாக இருப்பதை மதித்து இறைவனின் பெயரை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: הַצַּדִּיקִם என்பதன் மொழிபெயர்ப்பு
  choice: நீதிமான்கள்
  alternative: நேர்மையானவர்கள்
  rationale: ‘நீதிமான்கள்’ என்பது இப்பரிந்துரைப் பேச்சிலுள்ள ஒழுக்க மற்றும் நீதித்தீர்ப்பு சார்ந்த நிறையைப் பாதுகாக்கிறது; ‘நேர்மையானவர்கள்’ என்பது பொருளை தனிப்பட்ட நேர்மைக்கு மட்டும் சுருக்கக்கூடும்.
- issue: וַיֹּאמֶר என்பதன் மறைமுக எழுவாய்
  choice: அவர்
  alternative: ஆண்டவர்
  rationale: சூழலில் பேசுபவர் ஆண்டவர் என்பது தெளிவாக இருந்தாலும், இவ்வசனத்தின் எபிரெய உரை பெயரையோ பட்டத்தையோ மீண்டும் குறிப்பிடவில்லை; ஆகவே மொழிபெயர்ப்பில் அதைச் சேர்க்காமல் எழுவாயின் மறைமுகத் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. ஆபிரகாம் இறைவனிடம் பேசுவதால் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. ‘ஐந்து பேர் குறைவுக்காக’ என்பது எபிரெயத்தின் காரணப் பொருளைத் தெளிவாக்கி, தமிழில் ஏற்படக்கூடிய எதிர்பொருளைத் தவிர்க்கிறது.
