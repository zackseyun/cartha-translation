  terminology: ‘நீதிமான்கள்,’ ‘நகரம் முழுவதையும்,’ and ‘அழித்துவிடுவீரா / அழிக்கமாட்டேன்’ are suitable, consistent renderings in a respectful modern-standard Tamil register. The implicit divine subject is correctly retained as ‘அவர்.’
