revisions:
- from: 'யாவே சொன்னார்: “சோதோமில், அந்த நகருக்குள் நீதிமான்கள் ஐம்பது பேரை நான் கண்டால், அவர்களுக்காக அந்த இடம் முழுவதையும் அழிக்காமல் விட்டுவிடுவேன்[a].”'
  to: 'யாவே சொன்னார்: “சோதோம் நகருக்குள் நீதிமான்கள் ஐம்பது பேரை நான் கண்டால், அவர்களுக்காக அந்த இடம் முழுவதையும் காப்பாற்றுவேன்[a].”'
  rationale: The revision replaces an overly explicit reference to destruction with “காப்பாற்றுவேன்,” which preserves the contextual sense of sparing while leaving the Hebrew verb’s pardon-related breadth available in the footnote. It also smooths the location phrase into natural modern Tamil and retains the divine name, conditional form, number, righteous persons, collective scope, and beneficiary relationship.
