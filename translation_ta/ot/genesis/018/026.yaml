  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אִם אֶמְצָ֥א בִ/סְדֹ֛ם חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר וְ/נָשָׂ֥אתִי לְ/כָל הַ/מָּק֖וֹם בַּ/עֲבוּרָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/026.yaml
  text: And Yahweh said[a], “If I find fifty righteous people within the city of Sodom, then I will spare the whole place for their sake.”
translation:
  language: ta
  text: 'யாவே சொன்னார்: “சோதோம் நகருக்குள் நீதிமான்கள் ஐம்பது பேரை நான் கண்டால், அவர்களுக்காக அந்த இடம் முழுவதையும் காப்பாற்றுவேன்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த இடம் முழுவதையும் மன்னிப்பேன்.” இங்குள்ள எபிரெய வினைச்சொல் குற்றத்தைச் சுமந்து அகற்றுதல் அல்லது தீர்ப்பைத் தடுத்து நிறுத்துதல் என்ற பொருளையும் தரலாம்.
    reason: וְנָשָׂאתִי என்பதன் மன்னித்தல்/விட்டுவிடுதல் சார்ந்த மாற்றுப் பொருளைத் தக்கவைக்கிறது; முதன்மை உரையில் ‘காப்பாற்றுவேன்’ என்பது சூழலுக்கேற்ற ‘spare’ என்னும் பொருளை வழங்குகிறது.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைபெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய உச்சரிப்பைத் தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: וַיֹּאמֶר
  choice: சொன்னார்
  rationale: எபிரெயக் கதைத் தொடரின் இயல்பான வினைமுறையை நவீனத் தமிழில் எளிமையாக வழங்குகிறது; வசனத் தொடக்கத்தில் ‘அப்போது’ அல்லது ‘மேலும்’ சேர்ப்பது அவசியமில்லை.
- source_word: אִם אֶמְצָא
  choice: நான் கண்டால்
  rationale: நிபந்தனை அமைப்பையும் முதலாம் நபர் எழுவாயையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בִסְדֹם ... בְּתוֹךְ הָעִיר
  choice: சோதோமில், அந்த நகருக்குள்
  rationale: ‘சோதோமில்’ என்றும் பின்னர் ‘நகருக்குள்’ என்றும் வரும் மூலமொழியின் இடக் குறிப்புகளை ஒன்றாகக் கலக்காமல், தமிழில் புரியும்படி பாதுகாக்கிறது.
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: நீதிமான்கள் ஐம்பது பேர்
  rationale: צַדִּיקִם என்பது நீதியுள்ள நபர்களைக் குறிக்கிறது; எபிரெயம் கட்டாயப்படுத்தாத ஆண் பாலின வரம்பைச் சேர்க்காமல் ‘பேர்’ என வழங்கப்படுகிறது.
- source_word: וְנָשָׂאתִי
  choice: அழிக்காமல் விட்டுவிடுவேன்
  rationale: נָשָׂא என்பதன் அடிப்படைப் பொருள் ‘சுமத்தல்/சுமந்து செல்லுதல்’; இச்சூழலில் அது குற்றத்தை மன்னித்தல் அல்லது தீர்ப்பை நிறுத்திவைத்தல் என்ற கருத்தைத் தருகிறது. வரவிருக்கும் அழிவுத் தீர்ப்பின் சூழலில் ‘அழிக்காமல் விட்டுவிடுவேன்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְכָל הַמָּקוֹם
  choice: அந்த இடம் முழுவதையும்
  rationale: தீர்ப்புக்குரிய முழுப் பகுதியையும் குறிக்கும் பரப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּעֲבוּרָם
  choice: அவர்களுக்காக
  rationale: அந்த நீதிமான்களை முன்னிட்டு அல்லது அவர்களுக்காகச் செய்யப்படும் செயலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை வழங்குதல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலவசனம் இறைபெயரையே நேரடியாகப் பயன்படுத்துகிறது. எனவே பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், பெயரை ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: וְנָשָׂאתִי என்பதில் மன்னிப்பா அல்லது தீர்ப்பிலிருந்து காப்பாற்றுதலா
  choice: அழிக்காமல் விட்டுவிடுவேன்
  alternative: மன்னித்துவிடுவேன்
  rationale: உடனடியான சூழல் சோதோமின் அழிவைப் பற்றியது என்பதால் முதன்மை உரை தீர்ப்பை நிறுத்துவதைத் தெளிவாக்குகிறது. அதேவேளையில், வினைச்சொல்லின் மன்னிப்பு/குற்றத்தை அகற்றுதல் சார்ந்த பொருளை அடிக்குறிப்பு மூலம் திறந்துவைக்கிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘சோதோமில் ... நகருக்குள்’ என்ற இடக் குறிப்பு மறுபடியும் வருவது மென்மையாகப் பாதுகாக்கப்பட்டுள்ளது; இறைபெயர் பட்டமாக மாற்றப்படவில்லை.
