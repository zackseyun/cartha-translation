id: GEN.18.27
reference: Genesis 18:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֥עַן אַבְרָהָ֖ם וַ/יֹּאמַ֑ר הִנֵּה נָ֤א הוֹאַ֨לְתִּי֙ לְ/דַבֵּ֣ר אֶל אֲדֹנָ֔/י וְ/אָנֹכִ֖י עָפָ֥ר וָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/027.yaml
  text: Then Abraham answered and said[a], “Behold, please, I have dared to speak to my Lord, though I am dust and ashes.”
translation:
  language: ta
  text: 'அப்போது ஆபிரகாம் பதிலளித்துச் சொன்னான்: “இதோ, தயவுசெய்து, நான் என் ஆண்டவரிடம் பேசத் துணிந்திருக்கிறேன்; நானோ தூசியும் சாம்பலும்தான்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: மறுமொழியாகச் சொன்னான்
  rationale: எபிரெய மூலத்திலுள்ள ‘பதிலளித்தான்’ மற்றும் ‘சொன்னான்’ ஆகிய இரு உரையாடல் வினைகளின் அமைப்பை இயல்பான தமிழில் ஒருங்கிணைத்துப் பாதுகாக்கிறது.
- source_word: הִנֵּה נָא
  choice: இதோ, தயவுசெய்து கவனியும்!
  rationale: הִנֵּה கவனத்தை ஈர்க்கும் சொல்லாகவும், נָא பணிவான வேண்டுகோளாகவும் செயல்படுகின்றன. அவற்றின் இரு உரையாடல் பணிகளையும் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הוֹאַלְתִּי
  choice: பேசத் துணிந்திருக்கிறேன்
  rationale: ஒரு செயலைத் தானாக மேற்கொள்ளுதல் அல்லது அதற்குத் துணிதல் என்ற பொருளைத் தருகிறது; இச்சூழலில் ஆபிரகாமின் பணிவையும் துணிவையும் ஒருசேர காட்டுகிறது.
- source_word: אֶל־אֲדֹנָי
  choice: என் ஆண்டவரிடம்
  rationale: முதல் நபர் உடைமைப் பொருளைப் பாதுகாக்கிறது. சூழலில் ஆபிரகாம் கர்த்தராக அடையாளப்படுத்தப்படும் தெய்வீக நபரிடம் பேசுவதால் ‘ஆண்டவர்’ பொருத்தமானது; சொல்லின் மரியாதைமிக்க மனித அழைப்பு வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: וְאָנֹכִי
  choice: நானோ
  rationale: எபிரெய இணைப்புச்சொல்லின் சூழல்சார் எதிர்மறை ஒப்பீட்டை இயல்பான தமிழில் காட்டுகிறது; ஆபிரகாமின் துணிவுக்கும் தாழ்நிலைக்கும் இடையிலான முரணை வெளிப்படுத்துகிறது.
- source_word: עָפָר וָאֵפֶר
  choice: தூசியும் சாம்பலும்தான்
  rationale: மரணத்தன்மையையும் அற்பத்தன்மையையும் குறிக்கும் மூல உருவகத்தை நேரடியாகவும் இயல்பாகவும் பாதுகாக்கிறது.
theological_decisions:
- issue: ஆபிரகாமின் அழைப்பில் אֲדֹנָי என்பதன் பொருள்
  choice: என் ஆண்டவர்
  alternative: என் தலைவர்
  rationale: இச்சொல் மரியாதைக்குரிய மனிதரையும் குறிக்கக்கூடும். எனினும் உடனடி இலக்கியச் சூழல் ஆபிரகாம் கர்த்தருடன் பேசுவதாக அடையாளப்படுத்துவதால், முதன்மை உரையில் ‘என் ஆண்டவர்’ என வழங்கப்பட்டுள்ளது; சொல் மட்டத்திலுள்ள மாற்று வாய்ப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘துணிந்திருக்கிறேன்’ பணிவுக்குள் நிலைக்கும் ஆபிரகாமின் துணிவைப் பாதுகாக்கிறது. ‘இதோ, தயவுசெய்து கவனியும்’ என்பது கவன ஈர்ப்பையும் பணிவான வேண்டுகோளையும் வெளிப்படுத்துகிறது; தெய்வத்திடம் ஒருமை மரியாதையுடன் பேசும் இலக்கிய நடையாக ‘கவனியும்’ பயன்படுத்தப்பட்டுள்ளது.
