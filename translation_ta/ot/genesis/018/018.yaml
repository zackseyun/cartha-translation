base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/018.yaml
  text: Abraham will surely become a great and mighty nation[a], and all the nations of the earth will be blessed in him.
translation:
  language: ta
  text: ஆபிரகாம் நிச்சயமாகப் பெரியதும் வலிமைமிக்கதுமான ஒரு தேசமாக ஆவான்; பூமியின் எல்லா தேசங்களும் அவனில் ஆசீர்வதிக்கப்படும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமியின் எல்லா தேசங்களும் அவனை முன்மாதிரியாகக் கொண்டு தங்களை ஆசீர்வதித்துக்கொள்ளும்.” எபிரெய வடிவத்தை இவ்வாறும் புரிந்துகொள்ளலாம்; முதன்மை உரை அதைச் செயப்பாட்டு பொருளில், “அவனில் ஆசீர்வதிக்கப்படும்” என்று எடுத்துக்கொள்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: הָיוֹ יִהְיֶה
  choice: நிச்சயமாக ... ஆவான்
  rationale: முற்றுவினைக்கு முன் வரும் வினையெச்ச வடிவம் வலியுறுத்தலைக் காட்டுகிறது. தமிழ் மொழியில் எதிர்காலத்தையும் உறுதியான வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்த “நிச்சயமாக ... ஆவான்” பயன்படுத்தப்பட்டது.
- source_word: לְגוֹי
  choice: ஒரு தேசமாக
  rationale: גוי என்பது பொதுவாக ஒரு தேசத்தையோ மக்களினத்தையோ குறிக்கும். இதே வசனத்தின் பிற்பகுதியில் வரும் தேசங்களோடும் உடன்படிக்கை வாக்குறுதியின் சூழலோடும் “தேசம்” நன்கு பொருந்துகிறது.
- source_word: גָּדוֹל
  choice: பெரிய
  rationale: அளவையும் மேன்மையையும் உள்ளடக்கக்கூடிய எபிரெயச் சொல்லின் விரிவான பொருளை “பெரிய” தக்கவைக்கிறது.
- source_word: וְעָצוּם
  choice: வலிமைமிக்க
  rationale: עצום வலிமை, ஆற்றல், பெருமை ஆகிய கருத்துகளைத் தரலாம். “வலிமைமிக்க” என்பது இதை வெறும் எண்ணிக்கைப் பெருக்காகக் குறுக்காமல், “பெரிய” என்பதோடு இயல்பாக இணைகிறது.
- source_word: וְנִבְרְכוּ
  choice: ஆசீர்வதிக்கப்படும்
  rationale: ברך என்பதன் நிஃபால் வடிவத்தைச் செயல்படு பொருளில் ஏற்று, தேசங்கள் ஆசீர்வாதத்தைப் பெறுவதாக மொழிபெயர்க்கிறது. தற்சுட்டுப் பொருளும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בּוֹ
  choice: அவனில்
  rationale: ב என்ற முன்னிடைச்சொல்லின் நேரடியான தொடர்பு அல்லது சூழல் சார்ந்த பொருளை “அவனில்” தக்கவைக்கிறது; “அவன் மூலமாக” என்பது சாத்தியமானாலும் மூலத்தில் வெளிப்படையாக இல்லாத கருவிப் பொருளைச் சேர்க்கக்கூடும்.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: பூமியின் எல்லா தேசங்களும்
  rationale: ஆதியாகமத்தில் இது உலகளாவிய விரிவைக் குறிக்கும் வழக்கமான சொற்றொடர். “பூமி” உலகளாவிய நோக்கையும், “தேசங்கள்” גוי என்பதுடனான சொல் ஒற்றுமையையும் காக்கின்றன.
theological_decisions:
- issue: ஆபிரகாமிய ஆசீர்வாத வாக்கியத்தின் பொருள்
  choice: 'தேசங்கள் ஆபிரகாமோடு உள்ள தொடர்பில் ஆசீர்வாதத்தைப் பெறுகின்றன: “அவனில் ஆசீர்வதிக்கப்படும்.”'
  alternative: தேசங்கள் ஆபிரகாமை முன்மாதிரியாகக் கொண்டு “தங்களை ஆசீர்வதித்துக்கொள்வார்கள்.”
  rationale: ברך என்பதன் நிஃபால் வடிவத்திற்கு இங்கு செயல்படு பொருளும் தற்சுட்டுப் பொருளும் விவாதிக்கப்பட்டுள்ளன. உடன்படிக்கைச் சூழலுக்கு செயல்படு வாசிப்பு நன்கு பொருந்துவதால் அது முதன்மை உரையில் வைக்கப்படுகிறது; உண்மையான மொழியியல் மாற்றுவாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. “பெரியதும் வலிமைமிக்கதுமான” என்ற இணைப்பு மூலத்தின் உயர்ந்த வாக்குறுதி நடையைத் தக்கவைக்கிறது; இறையியல் குழு சார்ந்த தனிப்பட்ட சொற்பயன்பாடுகள் தவிர்க்கப்பட்டுள்ளன.
