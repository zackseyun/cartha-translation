  text: וַ/יָּקֻ֤מוּ מִ/שָּׁם֙ הָֽ/אֲנָשִׁ֔ים וַ/יַּשְׁקִ֖פוּ עַל פְּנֵ֣י סְדֹ֑ם וְ/אַ֨בְרָהָ֔ם הֹלֵ֥ךְ עִמָּ֖/ם לְ/שַׁלְּחָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/016.yaml
  text: Then the men rose up from there and looked down toward Sodom[b][a], and Abraham was walking with them to send them on their way.
translation:
  language: ta
  text: பின்பு அந்த மனிதர்கள் அங்கிருந்து எழுந்து, சோதோமை நோக்கிக் கீழே பார்த்தார்கள்[a]. ஆபிரகாம் அவர்களை வழியனுப்புவதற்காக[b] அவர்களுடன் நடந்துசென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சோதோமை நோக்கிப் பார்த்தார்கள்.” எபிரெய வினைச்சொல் உயரமான ஓர் இடத்திலிருந்து வெளியே அல்லது கீழே நோக்கிப் பார்ப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களை அனுப்பிவைப்பதற்காக.” புறப்படும் விருந்தினர்களுடன் சென்று அவர்களை வழியனுப்புவதை எபிரெயச் சொற்றொடர் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ מִשָּׁם
  choice: அங்கிருந்து எழுந்து
  rationale: קום என்பதன் எழுதல் என்ற அடிப்படைப் பொருளையும், முந்தைய நிகழ்விடத்திலிருந்து கதை நகர்வதையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הָאֲנָשִׁים
  choice: அந்த மனிதர்கள்
  rationale: எபிரெய உரை சாதாரணமாக ‘மனிதர்கள்’ என்றே கூறுகிறது. ‘தேவதூதர்கள்’ என்று முன்கூட்டியே அடையாளப்படுத்தாமல் கதையின் திட்டமிட்ட தெளிவின்மையைப் பேணுகிறது.
- source_word: וַיַּשְׁקִפוּ עַל־פְּנֵי סְדֹם
  choice: சோதோமை நோக்கிக் கீழே பார்த்தார்கள்
  rationale: שׁקף உயரமான இடத்திலிருந்து வெளியே அல்லது கீழே நோக்கிப் பார்ப்பதைக் குறிக்கக்கூடும்; עַל־פְּנֵי இங்கு சோதோமின் திசையைச் சுட்டுகிறது.
- source_word: הֹלֵךְ עִמָּם
  choice: அவர்களுடன் நடந்துசென்றார்
  rationale: நிகழ்ந்துகொண்டிருந்த உடன்செல்லும் செயலை எபிரெயப் பங்கேற்புவினை காட்டுகிறது; தமிழில் ‘நடந்துசென்றார்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְשַׁלְּחָם
  choice: அவர்களை வழியனுப்புவதற்காக
  rationale: புறப்படும் விருந்தினர்களுடன் சிறிது தூரம் சென்று அவர்களை வழியனுப்பும் விருந்தோம்பல் வழக்கை இச்சூழலில் குறிக்கிறது.
theological_decisions:
- issue: הָאֲנָשִׁים என்பவர்களின் அடையாளம்
  choice: முதன்மை உரையில் ‘அந்த மனிதர்கள்’
  alternative: ‘அந்த வருகையாளர்கள்’ அல்லது ‘தேவதூதர்கள்’
  rationale: இந்த வசனத்தின் எபிரெய உரை அவர்களை ‘மனிதர்கள்’ என்றே அழைக்கிறது. அவர்களின் அடையாளத்தை இவ்விடத்திலேயே விளக்கித் தீர்க்காமல், மூல உரையின் கதையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மனிதர்கள்’ என்பது மூல உரையின் சாதாரண பெயர்ச்சொல்லையும் அதன் கதையியல் தெளிவின்மையையும் காக்கிறது; ‘வழியனுப்புதல்’ விருந்தோம்பல் சூழலை இயல்பாக எடுத்துரைக்கிறது.
