  source_fidelity: 'மூல எபிரெய உரையின் நிகழ்வுவரிசையும் பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: மனிதர்கள் அங்கிருந்து எழுதல், சோதோமின் திசையை நோக்கி உயரத்திலிருந்து/கீழ்நோக்கிப் பார்தல், ஆபிரகாம் அவர்களுடன் சென்று வழியனுப்புதல் ஆகியவை அனைத்தும் சரியாக வெளிப்பட்டுள்ளன. הָאֲנָשִׁים என்பதற்கு விளக்கம்சேர்க்காமல் ‘அந்த மனிதர்கள்’ எனத் தருவது மூலத்தின் சொல்லாட்சிக்கும் கதையியல் தெளிவின்மைக்கும் உண்மையானது.'
  naturalness: நடை நவீன தரநிலைத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. ‘சோதோமை நோக்கிக் கீழே பார்த்தார்கள்’ மற்றும் ‘அவர்களுடன் நடந்துசென்றார்’ ஆகியவை தெளிவான, வாசிக்க எளிய வடிவங்கள்.
