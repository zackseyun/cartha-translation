source:
  edition: WLC
  text: וַ֠/יֹּאמֶר אַל נָ֞א יִ֤חַר לַֽ/אדֹנָ/י֙ וַ/אֲדַבֵּ֔רָה אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם שְׁלֹשִׁ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אֶֽעֱשֶׂ֔ה אִם אֶמְצָ֥א שָׁ֖ם שְׁלֹשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/030.yaml
  text: Then he said[a], “Please, let not my Lord be angry, and I will speak. Perhaps thirty will be found there.” And he said, “I will not do it if I find thirty there.”
translation:
  language: ta
  text: அப்போது அவர், “என் ஆண்டவரே,[a] தயவுசெய்து கோபப்பட வேண்டாம்; நான் பேசட்டும். ஒருவேளை அங்கே முப்பது பேர் காணப்படலாம்” என்றார். அதற்கு அவர், “அங்கே முப்பது பேரைக் கண்டால், நான் அதைச் செய்யமாட்டேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் தலைவரே” அல்லது “ஐயா.” எபிரெயச் சொல் மரியாதைமிக்க அழைப்பாகவும் வாசிக்கப்படலாம்; இச்சூழலில் அது ஆண்டவரைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל נָא יִחַר
  choice: தயவுசெய்து கோபமடையாதீர்
  rationale: எதிர்மறை வேண்டுகோள், பணிவைக் குறிக்கும் נָא, கோபம் மூள்வதைக் குறிக்கும் חרה ஆகியவற்றை இயல்பான நவீன தமிழில் பணிவான வேண்டுகோளாகத் தருகிறது.
- source_word: לַאדֹנָי
  choice: என் ஆண்டவரே
  rationale: முதல் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் வரும் மரியாதைமிக்க அழைப்பைத் தக்கவைக்கிறது; சூழலில் ஆபிரகாம் தெய்வீக உரையாடுபவரை நோக்கிப் பேசுகிறார்.
- source_word: וַאֲדַבֵּרָה
  choice: நான் இன்னும் பேசுகிறேன்
  rationale: தொடர்ந்து பேச அனுமதி கோரும் cohortative நயத்தைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘இன்னும்’ சேர்க்கப்பட்டுள்ளது; இது உரையாடலின் தொடர்ச்சியைத் தெளிவாக்குகிறது.
- source_word: אוּלַי
  choice: ஒருவேளை
  rationale: ஆபிரகாமின் தயக்கமும் பணிவும் கலந்த ஊகத்தை இயல்பான தமிழில் தருகிறது.
- source_word: יִמָּצְאוּן
  choice: காணப்பட்டால்
  rationale: מצא வினையின் நிஃபால் வடிவிலுள்ள செயப்பாட்டு நயத்தையும், இங்கு உள்ள மறைமுக நிபந்தனை உணர்வையும் காக்கிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: எளிய இடச்சுட்டுச் சொல்லுக்கு இயல்பான தமிழ் இணை.
- source_word: שְׁלֹשִׁים
  choice: முப்பது பேர்
  rationale: எண் நேரடியாக மொழிபெயர்க்கப்படுகிறது; சூழலில் எண்ணப்படுவது மனிதர்கள் என்பதால் தமிழில் ‘பேர்’ சேர்க்கப்படுகிறது.
- source_word: לֹא אֶעֱשֶׂה
  choice: நான் அதைச் செய்யமாட்டேன்
  rationale: எபிரெயத்தில் செயப்படுபொருள் கூறப்படாமல் இருந்தாலும், முந்தைய சூழலில் நகரத்தை அழிப்பதே குறிப்பு; ‘அதை’ என்பது அந்தச் சுருக்கத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: אִם אֶמְצָא
  choice: கண்டால்
  rationale: எளிய நிபந்தனை அமைப்பைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ஆபிரகாமின் அழைப்பில் אֲדֹנָי என்பதன் பொருள்
  choice: என் ஆண்டவரே
  alternative: என் தலைவரே / ஐயா
  rationale: தெய்வீக உரையாடுபவரை நோக்கிய மரியாதைமிக்க அழைப்பு என்பது சூழலுக்கு ஏற்றது. ஆயினும் எபிரெய வடிவம் மரியாதைக்குரிய மனிதத் தலைவரையும் குறிக்கக்கூடியதால், அந்த மொழியியல் மாற்றுவாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; இங்கு இல்லாத உடன்படிக்கைப் பெயர் இறக்குமதி செய்யப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பணிவும் மரியாதையும் நிறைந்த உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘கோபமடையாதீர்’ மற்றும் ‘ஆண்டவரே’ ஆகிய வடிவங்கள் கண்ணியமான உயர்திணை ஒருமையைப் பேணுகின்றன; தேவையற்ற பழமொழிநடை தவிர்க்கப்பட்டுள்ளது.
