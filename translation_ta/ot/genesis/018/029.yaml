base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/029.yaml
  text: He spoke to him again and said[a], “Perhaps forty will be found there.” And he said[b], “I will not do it for the sake of the forty.”
translation:
  language: ta
  text: அவர் மீண்டும் அவரிடம், “ஒருவேளை அங்கே நாற்பது பேர் காணப்பட்டால்?” என்று பேசினார். அதற்கு அவர், “அந்த நாற்பது பேருக்காக நான் அதைச் செய்யமாட்டேன்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நாற்பது பேருக்காக நான் அதை அழிக்கமாட்டேன்.” எபிரெய உரையில் செயல் வெளிப்படையாகக் குறிப்பிடப்படாமல், “நான் செய்யமாட்டேன்” என்று மட்டுமே உள்ளது; எந்தச் செயல் என்பது சூழலிலிருந்து புரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד לְדַבֵּר
  choice: மீண்டும் அவரிடம் பேசி
  rationale: יסף + עוד + வினையெச்சம் தொடர்ந்து அல்லது மறுபடியும் செய்வதைக் குறிக்கிறது. இச்சூழலில் ஆபிரகாம் தனது வேண்டுதலை மீண்டும் தொடர்வதால், நவீன தமிழில் இயல்பாக ‘மீண்டும் ... பேசி’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: אֵלָיו
  choice: அவரிடம்
  rationale: אֶל ஒருவரை நோக்கிய பேச்சின் திசையைக் குறிக்கிறது; தமிழில் ‘அவரிடம்’ இயல்பான நேரடி இணை.
- source_word: אוּלַי
  choice: ஒருவேளை
  rationale: ஆபிரகாமின் தயக்கமும் மரியாதையும் கலந்த சாத்தியக் கூற்றை ‘ஒருவேளை’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִמָּצְאוּן
  choice: காணப்பட்டால்
  rationale: מצא என்பதன் நிபால் வடிவம் ‘காணப்படுதல்’ என்ற செயல்பாட்டு-பெறுநிலைப் பொருளைக் கொண்டது. பேச்சுவார்த்தையின் நிபந்தனைத் தன்மையைத் தமிழில் ‘காணப்பட்டால்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: எளிய இடச்சுட்டு வினையடை; ‘அங்கே’ நேரடியும் இயல்புமான மொழிபெயர்ப்பு.
- source_word: אַרְבָּעִים
  choice: நாற்பது பேர்
  rationale: மூலத்தில் எண்ணிக்கை மட்டும் இருந்தாலும், முந்தைய வசனங்களின் சூழலில் அது நீதிமான்களைக் குறிக்கிறது. தமிழில் மனிதர்களின் எண்ணிக்கைக்கு ‘பேர்’ சேர்ப்பது இயல்பானது; ‘நீதிமான்கள்’ என்று வெளிப்படையாகச் சேர்க்கப்படவில்லை.
- source_word: לֹא אֶעֱשֶׂה
  choice: நான் அதைச் செய்யமாட்டேன்
  rationale: עשה வினையின் செயப்படுபொருள் மூலத்தில் சொல்லப்படாமல், முந்தைய உரையாடலிலிருந்து புரிந்துகொள்ளப்படுகிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘அதை’ சேர்க்கப்பட்டது; ஆனால் ‘அழிக்கமாட்டேன்’ எனச் செயலைக் குறிப்பாக்கவில்லை.
- source_word: בַּעֲבוּר הָאַרְבָּעִים
  choice: அந்த நாற்பது பேருக்காக
  rationale: בַּעֲבוּר இங்கு அந்த நாற்பது பேரை முன்னிட்டு அல்லது அவர்களின் நிமித்தம் நடவடிக்கை எடுக்காமல் இருப்பதைக் குறிக்கிறது. ‘...பேருக்காக’ இந்த இடைமன்றாட்டுச் சூழலில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: לֹא אֶעֱשֶׂה என்பதில் இறைச்செயலின் செயப்படுபொருள் மறைமுகமாக இருப்பது
  choice: முதன்மை உரையில் ‘அதைச் செய்யமாட்டேன்’ என்று வைத்து, செயலைக் குறிப்பாக ‘அழித்தல்’ என வரையறுக்காமல் விடுதல்
  alternative: ‘அதை அழிக்கமாட்டேன்’ அல்லது ‘நகரத்தை அழிக்கமாட்டேன்’
  rationale: எபிரெய உரை செயலை வெளிப்படையாகச் சொல்லாமல் முந்தைய உரையாடலிலிருந்து புரிந்துகொள்ள விடுகிறது. ‘அதைச் செய்யமாட்டேன்’ தமிழில் புரிதலைக் காக்கிறது; அதேவேளை மூலத்தில் இல்லாத குறிப்பான செயலை முதன்மை உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் உரையாடலின் பணிவான தொனியும் காக்கப்பட்டுள்ளன. ‘ஒருவேளை’ ஆபிரகாமின் தயக்கமான விண்ணப்பத்தையும், ‘அதைச் செய்யமாட்டேன்’ மூலத்தின் நோக்கமுள்ள மறைமுகத்தன்மையையும் பாதுகாக்கின்றன. இரு பேச்சாளர்களுக்கும் மூலத்தில் பெயர்கள் வராததால் ‘அவர்’ என்ற சுட்டுப்பெயர் தொடரப்பட்டுள்ளது.
