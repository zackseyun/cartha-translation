  source_fidelity: 'மூலத்தின் முக்கியப் பொருள்கள் காக்கப்பட்டுள்ளன: ידע-வின் நேரடிப் பொருளான ‘அறிதல்,’ ஆண்பால் பன்மையான ‘மகன்கள்,’ ‘யாவேயின் வழி,’ ‘நீதி மற்றும் நியாயம்,’ மற்றும் ‘அவரைக் குறித்து சொன்னது’ ஆகியவை துல்லியமாக உள்ளன. ஆனால் நடப்பு சொல்வரிசை, மூலத்தின் நோக்கத் தொடர்களையும் இறுதி விளைவுத் தொடரையும் தமிழில் தேவையற்ற அளவு குழப்பமாக்குகிறது.'
  naturalness: ‘தனக்குப் பின் தன் மகன்களுக்கும்’ என்ற அமைப்பு கட்டளையிடுதல் ஆபிரகாமுக்குப் பின்னரே நிகழ்வதுபோல் தற்காலிகமாகப் படிக்கப்படலாம். ‘அவனுக்குப் பின்வரும்’ என்று மாற்றுவதும், வினைத் தொடர்களைச் சீரமைப்பதும் நவீனத் தரத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
  terminology: ‘யாவே,’ ‘நீதி,’ ‘நியாயம்,’ ‘வீட்டார்,’ மற்றும் மரியாதைப் பன்மையான ‘தாம்’ ஆகிய தேர்வுகள் பொருத்தமானவை. அடிக்குறிப்பு d-இல் உள்ள நேரடி மேற்கோளை ‘ஆபிரகாமைக் குறித்து’ என்று ஒரே பெயரால் தெளிவுபடுத்துவது நல்லது.
  issues:
  - severity: medium
    issue: நோக்கத் தொடர்களின் சொல்வரிசை தெளிவற்றது
    rationale: நடப்பு உரையில் ‘யாவே ... நிகழச் செய்யவும்’ என்பது ‘நான் அவனை அறிந்திருக்கிறேன்’ என்பதுடன் இறுதியில் இணைவதால் வாசிப்பு சிரமமாகிறது. இரு לְמַעַן தொடர்களின் தொடர்பைத் தக்கவைத்தபடியே தமிழ் வினைத் தொடரைச் சீரமைக்க வேண்டும்.
  - severity: low
    issue: ‘தனக்குப் பின்’ என்ற இடம் தற்காலிகத் தெளிவின்மையை உருவாக்குகிறது
    rationale: אַחֲרָיו என்பது ஆபிரகாமுக்குப் பின்வரும் மக்களையும் வீட்டாரையும் சுட்டுகிறது. ‘அவனுக்குப் பின்வரும்’ என்பது இத்தொடர்பைத் தெளிவாக வெளிப்படுத்துகிறது.
  revised_text: ஏனெனில், அவன் அவனுக்குப் பின்வரும் தன் மகன்களுக்கும்[b] தன் வீட்டாருக்கும் கட்டளையிடவும், அவர்கள் நீதியையும் நியாயத்தையும் செய்து யாவேயின் வழியைக்[c] கடைப்பிடிக்கவும், யாவே ஆபிரகாமைக் குறித்து தாம் சொன்னதை[d] அவனுக்கு நிகழச் செய்யவும், நான் அவனை அறிந்திருக்கிறேன்.[a]
  revised_footnotes:
  - marker: a
    text: அல்லது, “நான் அவனைத் தேர்ந்தெடுத்திருக்கிறேன்.” எபிரெய வினை வழக்கமாக “அறி” என்று பொருள்படும்; இச்சூழலில் அது சிறப்பான அங்கீகாரம் அல்லது தேர்வையும் உணர்த்தலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரெய மூலத்தில் “மகன்கள்” என்பது ஆண்பால் பன்மை. “வீட்டார்” என்ற அடுத்த சொல், மகன்களைத் தாண்டி ஆபிரகாமின் குடும்ப நிர்வாகத்துக்குட்பட்டவர்களையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, யாவே வேண்டுகிற வாழ்வுமுறை.
    reason: cultural_note
  - marker: d
    text: அல்லது, “ஆபிரகாமுக்கு தாம் வாக்களித்ததை நிறைவேற்றவும்.” எபிரெய மூலத்தில் இன்னும் நேரடியாக, “ஆபிரகாமைக் குறித்து தாம் சொன்னதை” என்று உள்ளது.
    reason: lexical_alternative
  revision_rationale: மூலத்தின் இரு நோக்கத் தொடர்களையும், ‘அறிந்திருக்கிறேன்’ என்ற முக்கிய வினையை இறுதியில் வைக்கும் எபிரெய வாக்கிய ஓட்டத்தையும் காத்து, ‘அவனுக்குப் பின்வரும்’ மூலம் ஆபிரகாமுக்குப் பிந்தைய மக்களையும் வீட்டாரையும் தெளிவாக்கினேன். அடிக்குறிப்பு d-இன் நேரடி மேற்கோளில் சுட்டுப்பெயருக்குப் பதிலாக ‘ஆபிரகாமைக்’ பயன்படுத்தி குறிப்பு தனித்து வாசிக்கும்போதும் தெளிவாக இருக்கச் செய்தேன்.
