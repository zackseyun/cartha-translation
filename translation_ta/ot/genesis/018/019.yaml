  text: כִּ֣י יְדַעְתִּ֗י/ו לְמַעַן֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֶת בָּנָ֤י/ו וְ/אֶת בֵּית/וֹ֙ אַחֲרָ֔י/ו וְ/שָֽׁמְרוּ֙ דֶּ֣רֶךְ יְהוָ֔ה לַ/עֲשׂ֥וֹת צְדָקָ֖ה וּ/מִשְׁפָּ֑ט לְמַ֗עַן הָבִ֤יא יְהוָה֙ עַל אַבְרָהָ֔ם אֵ֥ת אֲשֶׁר דִּבֶּ֖ר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/019.yaml
  text: For I have known him[a], so that he may command his children and his household after him, and they may keep the way of Yahweh by doing righteousness and justice[d][c][b], so that Yahweh may bring upon Abraham what he has spoken concerning him.
translation:
  language: ta
  text: ஏனெனில், அவன் அவனுக்குப் பின்வரும் தன் மகன்களுக்கும்[b] தன் வீட்டாருக்கும் கட்டளையிடவும், அவர்கள் நீதியையும் நியாயத்தையும் செய்து யாவேயின் வழியைக்[c] கடைப்பிடிக்கவும், யாவே ஆபிரகாமைக் குறித்து தாம் சொன்னதை[d] அவனுக்கு நிகழச் செய்யவும், நான் அவனை அறிந்திருக்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் அவனைத் தேர்ந்தெடுத்திருக்கிறேன்.” எபிரெய வினை வழக்கமாக “அறி” என்று பொருள்படும்; இச்சூழலில் அது சிறப்பான அங்கீகாரம் அல்லது தேர்வையும் உணர்த்தலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரெய மூலத்தில் “மகன்கள்” என்பது ஆண்பால் பன்மை. “வீட்டார்” என்ற அடுத்த சொல், மகன்களைத் தாண்டி ஆபிரகாமின் குடும்ப நிர்வாகத்துக்குட்பட்டவர்களையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, யாவே வேண்டுகிற வாழ்வுமுறை.
    reason: cultural_note
  - marker: d
    text: அல்லது, “ஆபிரகாமுக்கு தாம் வாக்களித்ததை நிறைவேற்றவும்.” எபிரெய மூலத்தில் இன்னும் நேரடியாக, “ஆபிரகாமைக் குறித்து தாம் சொன்னதை” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் தருகிறது.
- source_word: יְדַעְתִּיו
  choice: நான் அவனை அறிந்திருக்கிறேன்
  rationale: ידע என்பதன் அடிப்படைப் பொருளான ‘அறிதல்’ என்பதைக் காக்கிறது; இச்சூழலில் உள்ள தனிப்பட்ட அங்கீகாரம் அல்லது தேர்வு என்ற உட்பொருளை முதன்மை உரையில் தீர்மானித்துவிடாமல் விடுகிறது.
- source_word: לְמַעַן אֲשֶׁר
  choice: …இடவும் / …செய்யவும்
  rationale: எபிரெய நோக்கப் பொருளைத் தமிழில் தொடர்ச்சியான நோக்க வினையெச்சங்களால் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְצַוֶּה
  choice: கட்டளையிடவும்
  rationale: פיעל வடிவின் வலிமையான ‘கட்டளையிடு, பொறுப்பளி’ என்ற பொருளைப் பேணுகிறது.
- source_word: בָּנָיו
  choice: தன் மகன்களுக்கும்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையில் உள்ளதால் ‘மகன்கள்’ என்று பாலினத் துல்லியத்துடன் மொழிபெயர்க்கப்படுகிறது.
- source_word: בֵּיתוֹ
  choice: தன் வீட்டாருக்கும்
  rationale: கட்டிடத்தைக் காட்டிலும் ஆபிரகாமின் குடும்பம் மற்றும் குடும்ப நிர்வாகத்துக்குட்பட்ட அனைவரையும் குறிக்கும் சமூகப் பொருளைத் தருகிறது.
- source_word: אַחֲרָיו
  choice: தனக்குப் பின்
  rationale: ஆபிரகாமுக்குப் பிந்தைய தலைமுறைத் தொடர்ச்சியைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְשָׁמְרוּ
  choice: கடைப்பிடிக்கவும்
  rationale: ‘வழி’ என்பதுடன் வரும் שׁמר, உண்மையுடன் பின்பற்றி ஒழுகுவதைச் சுட்டுவதால் இத்தேர்வு பொருத்தமானது.
- source_word: דֶּרֶךְ יְהוָה
  choice: யாவேயின் வழி
  rationale: யாவே வேண்டுகிற வாழ்வுமுறையைக் குறிக்கும் உடன்படிக்கை சார்ந்த ஒழுக்கவியல் உருவகத்தைப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
- source_word: לַעֲשׂוֹת צְדָקָה וּמִשְׁפָּט
  choice: நீதியையும் நியாயத்தையும் செய்து
  rationale: צדקה மற்றும் משפט ஆகிய இணைச் சொற்களை வேறுபடுத்திக் காட்டுவதோடு, அத்தகைய செயல்களால் யாவேயின் வழி கடைப்பிடிக்கப்படுகிறது என்ற தொடர்பையும் தெளிவாக்குகிறது.
- source_word: הָבִיא ... עַל
  choice: அவனுக்கு நிகழச் செய்யவும்
  rationale: ‘அவன்மேல் கொண்டுவருதல்’ என்ற எபிரெய மொழிநடையை இயல்பான தமிழாக்கமாகத் தருகிறது; சொன்னது நிறைவேறுதல் என்ற சூழல்சார் கருத்தையும் அளவுக்கு மீறாமல் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר דִּבֶּר עָלָיו
  choice: ஆபிரகாமைக் குறித்து தாம் சொன்னதை
  rationale: ‘அவனைக் குறித்து சொன்னது’ என்ற எபிரெய அமைப்பைத் தெளிவாகப் பேணுகிறது; அதை முதன்மை உரையிலேயே ‘வாக்குறுதி’ என்று விளக்கவில்லை.
theological_decisions:
- issue: ידע என்பதைத் தேர்வு சார்ந்த பொருளிலா அல்லது உறவுசார் அறிதலாகவா மொழிபெயர்ப்பது
  choice: நான் அவனை அறிந்திருக்கிறேன்
  alternative: நான் அவனைத் தேர்ந்தெடுத்திருக்கிறேன்
  rationale: சூழல் சிறப்பான அங்கீகாரத்தையும் நோக்கத்தையும் உணர்த்தினாலும், வினையின் நேரடிப் பொருள் ‘அறிதல்.’ ‘தேர்ந்தெடுத்தல்’ என்று முதன்மை உரையில் தருவது ஒரு உட்பொருளைத் தீர்மானமான விளக்கமாக்கிவிடும்; எனவே அது அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது; பட்டத்தை மாற்றீடாக இடாமல் பெயரையே ஒலிபெயர்ப்பது மூலவடிவைத் தெளிவாகப் பேணுகிறது.
- issue: דבר עליו என்பதை ‘வாக்குறுதி’ என விளக்கலாமா
  choice: அவரைக் குறித்து சொன்னது
  alternative: அவருக்கு வாக்களித்தது
  rationale: இங்கு சொல்லப்பட்டது வாக்குறுதியைக் குறிக்கலாம்; ஆயினும் எபிரெய உரை பொதுவாக ‘சொன்னது’ என்றே கூறுவதால் அதன் அகலத்தையும் இறையியல் நுணுக்கத்தையும் முதன்மை உரை காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வேதாகமப் பெருமிதமும் கொண்ட இயல்பான நடை பயன்படுத்தப்பட்டுள்ளது. இறைவன் தம்மைக் குறிக்கும் இடத்தில் மரியாதைப் பன்மையான “தாம்” பயன்படுத்தப்பட்டுள்ளது; ஆபிரகாமைக் குறிக்கும் சுட்டுப்பெயர்கள் ஒருமையில் வைக்கப்பட்டுள்ளன. நீண்ட எபிரெய நோக்க வாக்கியத்தின் இணைப்புகள் தமிழில் வாசிக்கத் தெளிவாக மறுவரிசைப்படுத்தப்பட்டாலும், அதன் இரு לְמַעַן நோக்கத் தொடர்களும் பேணப்பட்டுள்ளன.
