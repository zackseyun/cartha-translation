base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/017.yaml
  text: And Yahweh said[a], “Shall I hide from Abraham what I am doing?”
translation:
  language: ta
  text: 'யாவே சொன்னார்: “நான் செய்வதை ஆபிரகாமிடமிருந்து மறைப்பேனா[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் நேரடியாக: “நான் செய்து கொண்டிருப்பதை ஆபிரகாமிடமிருந்து மறைக்கிறேனா?”'
    reason: எபிரெய வினாவிலுள்ள பங்கெச்சங்கள் நிகழ்காலத் தொடர்ச்சி வாசிப்பையும் தரலாம்; முதன்மை உரை ஆலோசனைத் தன்மையுள்ள வினாவை இயல்பாகக் காக்கிறது.
lexical_decisions:
- source_word: וַֽ/יהֹוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பெயரான יהוה என்பதை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், தமிழில் நிலைபெற்ற ‘யெகோவா’ என்ற வடிவில் வழங்குகிறது.
- source_word: אָמָר
  choice: சொன்னார்
  rationale: வழக்கமான இறந்தகாலக் கதைநடையை இயல்பான நவீன தமிழில் முன்னெடுக்கிறது.
- source_word: הַֽ/מְכַסֶּה
  choice: மறைப்பேனா?
  rationale: கேள்வித்துகளுடன் வந்துள்ள பங்கெச்ச வடிவம் தனக்குள் ஆராயும் வினாவாக உள்ளது; தமிழில் எதிர்கால வினா அந்த deliberative நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵֽ/אַבְרָהָם
  choice: ஆபிரகாமிடமிருந்து
  rationale: ‘மறைத்தல்’ என்பதுடன் מִן குறிக்கும் பிரிவை இயல்பாகத் தருகிறது.
- source_word: אֲשֶׁר אֲנִי עֹשֶׂה
  choice: நான் செய்யப்போவதை
  rationale: சொல்லாட்சியில் ‘நான் செய்வதை/செய்துகொண்டிருப்பதை’ என்றாலும், சூழலில் இன்னும் நிகழவிருக்கும் செயலையே குறிக்கிறது; ‘செய்யப்போவதை’ அந்த prospective பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: எபிரெய மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. பொதுப்பட்டமாக மாற்றாமல் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பைத் தேர்ந்தெடுக்கிறது; ‘யாவே’ என்பது சாத்தியமான மாற்று ஒலிபெயர்ப்பு.
- issue: עֹשֶׂה என்பதன் காலநிலை நுணுக்கம்
  choice: செய்யப்போவதை
  alternative: செய்வதை / செய்துகொண்டிருப்பதை
  rationale: பங்கெச்சத்தின் வடிவியல் தெளிவின்மையை அடிக்குறிப்பில் காக்கும்போது, நிகழவிருக்கும் சோதோம் குறித்த செயலைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் முதன்மை உரை தருகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கதைநடை. ‘மறைப்பேனா?’ என்பது செயற்கையான சொல்லுக்குச் சொல் அமைப்பைத் தவிர்த்து எபிரெய வினாவின் ஆலோசனைத் தன்மையைத் தக்கவைக்கிறது.
