  text: Please let a little water be brought[a], and wash your feet[b], and rest yourselves under the tree.
translation:
  language: ta
  text: தயவுசெய்து, கொஞ்சம் தண்ணீர் கொண்டுவரட்டும்; உங்கள் கால்களைக் கழுவி, அந்த மரத்தின் கீழ் சாய்ந்து இளைப்பாறுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֻקַּח נָא
  choice: தயவுசெய்து, … கொண்டுவரட்டும்
  rationale: לקח என்பதன் செயல்பாட்டு/வேண்டுகோள் வடிவத்தையும் נָא தரும் பணிவான வேண்டுகோளையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; செய்பவரை எபிரெயம் குறிப்பிடாததையும் தக்கவைக்கிறது.
- source_word: מְעַט מַיִם
  choice: கொஞ்சம் தண்ணீர்
  rationale: சிறிய அளவைக் குறிக்கும் எபிரெயச் சொற்றொடரை சாதாரணமாகவும் இயல்பாகவும் வழங்குகிறது; ஆபிரகாமின் அடக்கமான விருந்தோம்பல் மொழியையும் காக்கிறது.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: உங்கள் கால்களைக் கழுவிக்கொண்டு
  rationale: விருந்தினர்களை நோக்கிய பன்மை வேண்டுகோளையும் கால் கழுவும் விருந்தோம்பல் வழக்கையும் தெளிவாகக் காட்டுகிறது; அடுத்த செயலில் இயல்பாக இணைகிறது.
- source_word: וְהִשָּׁעֲנוּ
  choice: சாய்ந்து இளைப்பாறுங்கள்
  rationale: שען என்பதன் ‘சாய்/ஆதரவாகச் சாய்ந்திரு’ என்ற அடிப்படைப் பொருளையும் இச்சூழலில் உள்ள ஓய்வெடுக்கும் கருத்தையும் ஒன்றாகப் பாதுகாக்கிறது.
- source_word: תַּחַת הָעֵץ
  choice: அந்த மரத்தடியில்
  rationale: குறிப்பிட்ட மரத்தைக் காட்டும் எபிரெயத் திட்டவட்ட உருபை ‘அந்த’ என வெளிப்படுத்தி, ‘மரத்தடியில்’ என்ற இயல்பான தமிழைப் பயன்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: மொழிநடை நவீனத் தரத் தமிழாகவும், பணிவான விருந்தோம்பல் வேண்டுகோளாகவும் அமைக்கப்பட்டுள்ளது. ‘சாய்ந்து இளைப்பாறுங்கள்’ என்பது மூல வினையின் உடல் நிலை சார்ந்த பொருளையும் சூழலின் ஓய்வு கருத்தையும் தேவையின்றி ஒன்றுக்கொன்று மாற்றாமல் தக்கவைக்கிறது.
