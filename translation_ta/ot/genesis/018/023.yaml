base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/023.yaml
  text: Then Abraham came near and said[a], “Will you indeed sweep away the righteous with the wicked?”
translation:
  language: ta
  text: பின்பு ஆபிரகாம் அருகே வந்து, “நீதிமானைத் தீயவனோடு சேர்த்து உண்மையிலேயே துடைத்தழித்துவிடுவீரா?[a]” என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அழித்துவிடுவீரா?”; எபிரேய வினைச்சொல் நியாயத்தீர்ப்பில் அகற்றப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: அருகே வந்து
  rationale: נגשׁ என்பது அணுகுதல் அல்லது அருகே வருதல் எனப் பொருள்படும். ஆபிரகாம் பரிந்து பேசுவதற்காக முன்னே வந்த உடல் மற்றும் உரையாடல் இயக்கத்தை இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַבְרָהָם
  choice: ஆபிரகாம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: וַיֹּאמַר
  choice: என்று கேட்டான்
  rationale: אמר என்பதன் அடிப்படைப் பொருள் ‘சொன்னான்’ என்றாலும், தொடர்ந்து வருவது நேரடியான கேள்வி என்பதால், நவீனத் தமிழில் ‘என்று கேட்டான்’ என்பது உரையாடலின் செயல்பாட்டை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַאַף
  choice: உண்மையிலேயே
  rationale: கேள்விக்குறியுடன் சேர்ந்த אַף வியப்பும் வலியுறுத்தலும் கொண்ட கேள்வியை உருவாக்குகிறது; ‘உண்மையிலேயே’ அந்த வலிமையை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: תִּסְפֶּה
  choice: துடைத்தழித்துவிடுவீரா
  rationale: ספה இங்கு நியாயத்தீர்ப்பில் முற்றாக அகற்றுவதைக் குறிக்கிறது. ‘துடைத்தழித்தல்’ எபிரேயச் சொல்லின் வலுவான காட்சித்தன்மையையும் அழிவின் கருத்தையும் காக்கிறது.
- source_word: צַדִּיק
  choice: நீதிமானை
  rationale: ஒருமை வடிவம் பொதுவகையைச் சுட்டுகிறது. ‘நீதிமான்’ என்பது வெறும் குற்றமின்மையைவிட ஒழுக்க மற்றும் நீதிநிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: עִם
  choice: தீயவனோடு சேர்த்து
  rationale: עִם என்பதன் ‘உடன்’ என்ற பொருளையும், ஒரே தீர்ப்புக்குள் இருவரும் சேர்க்கப்படுவார்கள் என்ற கேள்வியின் கருத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רָשָׁע
  choice: தீயவன்
  rationale: இது ஒருமையில் பொதுவகையாக வரும் ஒழுக்கப் பிரிவைக் குறிக்கிறது. ‘தீயவன்’ நவீன வாசகர்களுக்கு நேரடியாகப் புரியும் சொல்; ‘நீதிமான்’ என்பதற்கான தெளிவான எதிரிணையாகவும் அமைகிறது.
theological_decisions:
- issue: ஒருமையில் வரும் பொதுவான ஒழுக்க வகைகள்
  choice: צַדִּיק மற்றும் רָשָׁע ஆகியவற்றை ‘நீதிமான்’, ‘தீயவன்’ என்ற ஒருமைப் பொதுவகைகளாக மொழிபெயர்த்தல்.
  alternative: ‘நீதிமான்கள்’, ‘தீயவர்கள்’ என்று பன்மையாக்குதல்.
  rationale: எபிரேய உரை ஒருமை வடிவங்களைப் பயன்படுத்தி தெய்வீக நீதியைப் பற்றிய பொதுக் கொள்கையை எழுப்புகிறது. ஒருமையைத் தக்கவைப்பது அந்த பிரதிநிதித்துவ வலிமையையும் உரையின் வடிவத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் உரையாடலின் கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. கடவுளை நோக்கிய வினாவில் மரியாதைப் பன்மை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது; எபிரேயத்தின் வலியுறுத்தலும் நீதிமான்–தீயவன் என்ற பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
