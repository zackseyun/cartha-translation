  source_fidelity: வ.எ. 18:23-இன் எபிரேய உரைக்கு மொழிபெயர்ப்பு உண்மையுள்ளது. וַיִּגַּשׁ என்பதன் அணுகுதல், הַאַף-இன் வலியுறுத்தும் வினா, תִּסְפֶּה-இன் நியாயத்தீர்ப்பில் அகற்றுதல்/அழித்தல், மற்றும் צַדִּיק–רָשָׁע எனும் ஒருமை பொதுவகை எதிரிணை அனைத்தும் காக்கப்பட்டுள்ளன. ‘சேர்த்து’ என்பது עִם-இன் பகிர்ந்துகொள்ளும் தீர்ப்பு என்ற பொருளைத் தெளிவாகத் தருகிறது.
  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாகவும், கடவுளை நோக்கிய கேள்விக்குரிய மரியாதைப் பன்மையுடனும் உள்ளது. ‘அருகே வந்து’ மற்றும் ‘என்று கேட்டான்’ கதையாடல் சூழலில் சரளமாக அமைகின்றன. ‘துடைத்தழித்துவிடுவீரா?’ வலுவான அழிவு-உருவகத்தை இயல்பாகக் கொண்டுசெல்கிறது.
  terminology: ‘ஆபிரகாம்’ வழக்கமான தமிழ் வேதாகமப் பெயர்வடிவம். ‘நீதிமான்’ மற்றும் ‘தீயவன்’ எபிரேயத்தின் ஒழுக்க/நீதித் தகுதிவகைகளைப் பாதுகாக்கும் பொருத்தமான எதிர்ச் சொற்கள். அடிக்குறிப்பு துடைத்தழித்தல் என்பதற்கான பாதுகாப்பான சொல் மாற்றை வழங்கி, மூலவினையின் தீர்ப்பு சார்ந்த நுணுக்கத்தையும் சரியாகக் குறிப்பிடுகிறது.
