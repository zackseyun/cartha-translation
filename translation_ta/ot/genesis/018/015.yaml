reference: Genesis 18:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/תְּכַחֵ֨שׁ שָׂרָ֧ה לֵ/אמֹ֛ר לֹ֥א צָחַ֖קְתִּי כִּ֣י יָרֵ֑אָה וַ/יֹּ֥אמֶר לֹ֖א כִּ֥י צָחָֽקְתְּ׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/015.yaml
  text: But Sarah denied it[a], saying, “I did not laugh,” because she was afraid. But he said, “No[b], but you did laugh.”
translation:
  language: ta
  text: ஆனால் சாராள் பயந்ததால், “நான் சிரிக்கவில்லை” என்று சொல்லி மறுத்தாள்.[a] அதற்கு அவர், “இல்லை; நீ சிரித்தாயே” என்றார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாராள் பொய் சொன்னாள்,” அல்லது சுருக்கமாக, “சாராள் மறுத்தாள்.” எபிரெய வினைச்சொல் மறுத்தல் அல்லது பொய் சொல்லுதல் என்ற பொருளைக் கொள்ளலாம்; இங்கு அவள் சிரித்ததை மறுப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இவ்வாக்கியப் பகுதியில் பேச்சாளர் பெயரிட்டு குறிப்பிடப்படவில்லை; சுற்றியுள்ள கதைச்சூழல் அவரை யெகோவாவுடன் அடையாளப்படுத்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּכַחֵשׁ
  choice: அதை மறுத்தாள்
  rationale: פיעל வடிவிலுள்ள כחשׁ மறுத்தல் அல்லது பொய்யாகப் பேசுதல் என்ற பொருளைக் கொள்ளலாம். இச்சூழலில் சாராள் தான் சிரித்ததை மறுப்பதே நேரடிக் கருத்து; ஆகவே பிரதான உரையில் தேவையற்ற ஒழுக்கத் தீர்ப்பைச் சேர்க்காமல் ‘அதை மறுத்தாள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לֵאמֹר
  choice: என்று சொல்லி
  rationale: நேர்க் கூற்றை அறிமுகப்படுத்தும் வழக்கமான மேற்கோள் அமைப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא צָחַקְתִּי
  choice: நான் சிரிக்கவில்லை
  rationale: முதல் நபர் ஒருமை நிறைவுவினையின் நேரடியான மறுப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: כִּי יָרֵאָה
  choice: பயந்ததால்
  rationale: כִּי இங்கு சாராளின் மறுப்புக்கான காரணத்தைக் குறிக்கிறது; தமிழில் காரணத்தை இயல்பாக வெளிப்படுத்த வாக்கியத்தின் தொடக்கத்தில் அமைக்கப்பட்டது.
- source_word: וַיֹּאמֶר
  choice: அதற்கு அவர் ... என்றார்
  rationale: தொடர்ந்து வரும் பதிலைச் சுட்டும் ஆண்பால் ஒருமை வினை வடிவம். ‘அதற்கு’ என்பது சாராளின் மறுப்புக்கும் பதிலுக்கும் இடையிலான எதிர்மறைத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: לֹא כִּי צָחָקְתְּ
  choice: இல்லை; நீ சிரித்தாய்
  rationale: முதல் לֹא சாராளின் மறுப்பை நிராகரிக்கிறது; כִּי இங்கு எதிர்வாதத்தையோ வலியுறுத்தலையோ தருகிறது. ‘இல்லை; நீ சிரித்தாய்’ என்பது அந்தச் செறிவான திருத்தத்தை இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: וַיֹּאמֶר என்பதன் மறைமுக எழுவாயான பேச்சாளரின் அடையாளம்
  choice: ‘அவர் ... என்றார்’ என்று பொதுவாக மொழிபெயர்த்தல்
  alternative: ‘யெகோவா கூறினார்’ அல்லது ‘அந்த மனிதர்களில் ஒருவர் கூறினார்’
  rationale: இவ்வாக்கியப் பகுதியில் எழுவாய் மீண்டும் பெயரிட்டு குறிப்பிடப்படவில்லை; ஆண்பால் ஒருமை வினை மட்டுமே உள்ளது. சுற்றியுள்ள கதைச்சூழல் பேச்சாளரை யெகோவாவுடன் அடையாளப்படுத்தினாலும், இவ்வசனம் வெளிப்படையாகச் சொல்லாத பெயரைப் பிரதான உரையில் சேர்க்காமல் சூழலே அடையாளத்தைத் தெரிவிக்க விடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified narrative register பயன்படுத்தப்பட்டது. எபிரெய உரையின் சுருக்கமான மறுப்பும் பதிலின் வலிமையும் காக்கப்பட்டுள்ளன; பேச்சாளரின் அடையாளம் பிரதான உரையில் தேவையின்றி வெளிப்படுத்தப்படவில்லை.
