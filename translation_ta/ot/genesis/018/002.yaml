base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/002.yaml
  text: He lifted up his eyes and looked[a], and behold, three men were standing near him. When he saw them[b], he ran from the entrance of the tent to meet them and bowed down to the ground.
translation:
  language: ta
  text: அவர் கண்களை உயர்த்திப் பார்த்தார்; இதோ, மூன்று ஆண்கள் அவருக்கு அருகில் நின்றுகொண்டிருந்தார்கள்.[a] அவர்களைக் கண்டதும், அவர் கூடார வாசலிலிருந்து அவர்களைச் சந்திக்க ஓடி, தரையை நோக்கித் தாழ்ந்து வணங்கினார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவருக்கு மிக அருகில் நின்றுகொண்டிருந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய முன்னிடைச்சொல் நெருக்கமான அருகாமையைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘தரையில் விழுந்து பணிந்தார்’ என்றும் மொழிபெயர்க்கலாம். இந்த வினை ஆழ்ந்த மரியாதையைக் காட்டும் உடல் அசைவைக் குறிக்கிறது; அதுவே தனியாக ‘வழிபட்டார்’ என்ற பொருளைக் கட்டாயப்படுத்துவதில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: அவர் கண்களை உயர்த்திப் பார்த்தார்
  rationale: எபிரெய மொழியின் காட்சிப்பூர்வமான சொல்லாடலைத் தக்கவைத்தபடியே, நவீன தமிழில் இயல்பாகப் புரியும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: காட்சியை வாசகரின் கவனத்திற்கு உயிரோட்டமாகக் கொண்டுவரும் எபிரெய உரையாடல் அடையாளத்தின் வலிமையை இது தக்கவைக்கிறது.
- source_word: שְׁלֹשָׁה אֲנָשִׁים
  choice: மூன்று ஆண்கள்
  rationale: மூலத்தில் பாலினத்தைக் குறிப்பாகச் சுட்டும் ‘ஆண்கள்’ என்ற பொருள் உள்ளதால், பொதுவான ‘மனிதர்கள்’ என்பதற்குப் பதிலாக அது நேரடியாகத் தரப்பட்டுள்ளது.
- source_word: נִצָּבִים עָלָיו
  choice: அவரருகே நின்றுகொண்டிருந்தார்கள்
  rationale: עַל என்ற முன்னிடைச்சொல் இங்கு நெருக்கமான இடநிலையைக் குறிக்கலாம். ‘அவருக்கு மேலாக’ என்பது தமிழில் தவறான உடல்நிலைப் படிமத்தை உருவாக்கக்கூடும் என்பதால் இயல்பான அருகாமைப் பொருள் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיַּרְא
  choice: அவர்களைக் கண்டதும்
  rationale: இரண்டாவது முறை வரும் வினை, ஆபிரகாமின் உடனடி செயலுக்கான காலத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיָּרָץ לִקְרָאתָם
  choice: அவர்களைச் சந்திக்க ஓடி
  rationale: வினைச்சொல் நேரடியாக ஓடுதலைக் குறிக்கிறது; ஆபிரகாமின் விரைவையும் ஆர்வத்தையும் இது காக்கிறது.
- source_word: מִפֶּתַח הָאֹהֶל
  choice: கூடார வாசலிலிருந்து
  rationale: கூடாரத்தின் திறப்பு அல்லது நுழைவிடத்தை நவீன தமிழில் சுருக்கமாகவும் இயல்பாகவும் ‘வாசல்’ குறிக்கிறது.
- source_word: וַיִּשְׁתַּחוּ אָרְצָה
  choice: தரைமட்டும் குனிந்து வணங்கினார்
  rationale: இது ஆழமாகப் பணியும் உடல் அசைவைக் காட்டுகிறது; ஆனால் அந்தச் செயலைத் தனிப்பட ‘வழிபாடு’ என்று தீர்மானிக்கவில்லை.
theological_decisions:
- issue: ஆபிரகாமின் செயல் ஒரு தெய்வீக நபருக்குச் செய்யப்பட்ட வழிபாடா என்பது
  choice: ‘வழிபட்டார்’ என்று அல்லாமல், ‘தரைமட்டும் குனிந்து வணங்கினார்’ என்று மொழிபெயர்த்தல்
  alternative: வழிபட்டார்
  rationale: எபிரெய வினை மனிதருக்கோ கடவுளுக்கோ காட்டப்படும் ஆழ்ந்த மரியாதையான பணிவைக் குறிக்க முடியும். இவ்வசனம் வருகையாளர்களை முதலில் ‘மூன்று ஆண்கள்’ என்று காட்டுவதால், ‘வழிபட்டார்’ என்பது உரை இன்னும் வெளிப்படையாகத் தீர்மானிக்காத இறையியல் கேள்வியை முன்கூட்டியே முடிவுசெய்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையான மூன்றாம் நபர் வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற இலக்கியமான ஆனால் பொதுவாகப் புரியும் சொல் கதைசொல்லலின் உயிரோட்டத்தைத் தக்கவைக்கிறது. ‘வணங்கினார்’ மரியாதையையும் சாத்தியமான சமயப் பொருளையும் திறந்துவைத்தாலும், ‘தரைமட்டும் குனிந்து’ என்பது முதன்மையாக உடல் அசைவைக் குறிப்பதன் மூலம் உரையின் தெளிவின்மையைப் பாதுகாக்கிறது.
