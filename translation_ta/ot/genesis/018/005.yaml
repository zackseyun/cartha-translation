base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/005.yaml
  text: And let me bring a morsel of bread[a], so that you may refresh your hearts; after that you may pass on, since this is why you have passed by your servant. And they said, “Yes[b], do as you have said.”
translation:
  language: ta
  text: “நான் கொஞ்சம் அப்பம் கொண்டுவரட்டும்[a]; அதைச் சாப்பிட்டு உங்கள் உள்ளத்தைத் தெம்பூட்டிக்கொள்ளுங்கள்[b]. அதன்பின் நீங்கள் தொடர்ந்து செல்லலாம். இதற்காகத்தானே உங்கள் அடியேன் இருக்கும் இடமாக வந்திருக்கிறீர்கள்.” அதற்கு அவர்கள், “சரி, நீ சொன்னபடியே செய்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘ஓர் அப்பத்துண்டு.’ விருந்தோம்பல் சூழலில் இது அடக்கமாகக் குறைத்துக் கூறும் சொல்லாட்சி.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘உங்கள் இதயங்களைத் தாங்குங்கள்’ அல்லது ‘வலுப்படுத்துங்கள்.’ இந்த எபிரெய மொழிமரபு உணவால் தெம்படைவதைக் குறிக்கிறது.
    reason: idiom
lexical_decisions:
- source_word: וְאֶקְחָה
  choice: நான் ... கொண்டுவருகிறேன்
  rationale: לקח என்பதன் முதலாம் நபர் cohortative வடிவம் இங்கு சாதாரண எதிர்காலத்தைக் காட்டாமல், ஆபிரகாமின் மரியாதையான முன்வருதலைக் காட்டுகிறது. நவீன தமிழில் ‘கொண்டுவருகிறேன்’ அந்தத் தொனியை இயல்பாகத் தருகிறது.
- source_word: פַת לֶחֶם
  choice: கொஞ்சம் அப்பம்
  rationale: இது சிறிதளவு அப்பத்தைக் குறிக்கும் விருந்தோம்பல் சார்ந்த அடக்கமான சொல்லாட்சி. ‘கொஞ்சம் அப்பம்’ இயல்பான தமிழில் அந்தக் குறைத்துக் கூறும் தொனியைத் தக்கவைக்கிறது.
- source_word: וְסַעֲדוּ לִבְּכֶם
  choice: உங்கள் உள்ளத்தைத் தெம்பூட்டிக்கொள்ளுங்கள்
  rationale: நேரடியாக ‘உங்கள் இதயத்தைத் தாங்குங்கள்/வலுப்படுத்துங்கள்’ என்ற பொருளுடைய எபிரெய மொழிமரபு, உணவால் புத்துணர்வு பெறுவதைக் குறிக்கிறது. தேர்ந்த மொழிபெயர்ப்பு இதயத்தின் உருவகத்தை ‘உள்ளம்’ மூலம் தக்கவைத்து, பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַחַר תַּעֲבֹרוּ
  choice: அதன்பின் நீங்கள் தொடர்ந்து செல்லலாம்
  rationale: עבר இங்கு பயணத்தைத் தொடர்வதைக் குறிக்கிறது. ‘தொடர்ந்து செல்லலாம்’ என்பது நவீன தமிழில் சூழலுக்கேற்ற இயல்பான மொழிபெயர்ப்பு.
- source_word: כִּי עַל כֵּן
  choice: இதற்காகத்தானே
  rationale: இந்தக் கூட்டுச் சொற்றொடர் ஆபிரகாமின் விருந்தோம்பல் வேண்டுகோளுக்கான காரணத்தை வலியுறுத்துகிறது. தமிழின் ‘இதற்காகத்தானே’ காரணத்தையும் பணிவான வேண்டுகோள் தொனியையும் சுருக்கமாகக் காட்டுகிறது.
- source_word: עֲבַרְתֶּם עַל עַבְדְּכֶם
  choice: உங்கள் அடியேனிடம் வந்திருக்கிறீர்கள்
  rationale: விருந்தினர்கள் ஆபிரகாம் இருக்கும் இடத்தின் வழியாக வந்ததையும், அவர் தம்மைத் தாழ்த்திப் பேசுவதையும் இச்சொற்றொடர் குறிக்கிறது. தமிழில் ‘உங்கள் அடியேன்’ என்பது அடிமை நிலையைத் தேவையின்றி வலியுறுத்தாமல் மரியாதையான தன்னடக்கப் பேச்சை வெளிப்படுத்துகிறது.
- source_word: כֵּן תַּעֲשֶׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: சரி, நீ சொன்னபடியே செய்
  rationale: விருந்தினர்களின் சுருக்கமான சம்மதத்தையும், ஆபிரகாம் முன்மொழிந்தபடியே செய்யுமாறு கூறுவதையும் இயல்பான நேரடிப் பேச்சில் தருகிறது.
