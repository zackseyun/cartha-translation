source:
  edition: WLC
  text: הֲ/יִפָּלֵ֥א מֵ/יְהוָ֖ה דָּבָ֑ר לַ/מּוֹעֵ֞ד אָשׁ֥וּב אֵלֶ֛י/ךָ כָּ/עֵ֥ת חַיָּ֖ה וּ/לְ/שָׂרָ֥ה בֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/014.yaml
  text: Is anything too difficult for Yahweh? At the appointed time I will return to you[a], about this time next year[b], and Sarah will have a son.
translation:
  language: ta
  text: யாவேக்கு இயலாத காரியம் ஏதாவது உண்டா?[a] குறித்த காலத்தில், அடுத்த ஆண்டு இதே நேரத்தில்[b], நான் உன்னிடம் திரும்பி வருவேன்; சாராளுக்கு ஒரு மகன் பிறப்பான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்கு வியப்புக்குரிய காரியம் ஏதாவது உண்டா?” எபிரெய வினைச்சொல், அசாதாரணமானது அல்லது மனித ஆற்றலுக்கு அப்பாற்பட்டது என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் உள்ள கடினமான மரபுத்தொடர், சொற்சார்ந்து “உயிர்ப்பின் காலத்தின்படி” எனப் புரிந்துகொள்ளப்படலாம். சூழலில் இது அடுத்த ஆண்டு இதே பருவத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִפָּלֵא
  choice: இயலாத
  rationale: פלא என்பதன் நிபால் வடிவம் வியப்புக்குரியதாக அல்லது ஒருவரின் ஆற்றலுக்கு அப்பாற்பட்டதாக இருப்பதைக் குறிக்கலாம். இங்குள்ள வினாவாக்கியத்தில் ‘இயலாத’ என்பது யாவேயின் ஆற்றலுக்கு அப்பாற்பட்டது என்ற கருத்தை இயல்பான தமிழில் தருகிறது; ‘முடியவே முடியாத’ என்பது எபிரெயச் சொல்லைவிட வலுவானதாகிவிடும்.
- source_word: מֵיְהוָה
  choice: யாவேக்கு
  rationale: מן என்ற முன்னொட்டு இங்கு வரம்பையோ ஆற்றலுக்கு அப்பாற்பட்ட நிலையையோ குறிக்கிறது. தமிழில் ‘யாவேக்கு இயலாத’ என்பது இயல்பாக அந்த உறவைத் தெரிவிக்கிறது. יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: דָּבָר
  choice: காரியம் ஏதாவது
  rationale: דבר என்பது சொல், விஷயம், காரியம் எனப் பரந்த பொருள் உடையது. இந்த வினாவில் ‘காரியம் ஏதாவது’ என்பது அதன் பொதுவான பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לַמּוֹעֵד
  choice: குறித்த காலத்தில்
  rationale: מועד என்பது நியமிக்கப்பட்ட அல்லது நிர்ணயிக்கப்பட்ட நேரத்தைக் குறிக்கிறது. ‘குறித்த காலத்தில்’ என்பது நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אָשׁוּב אֵלֶיךָ
  choice: நான் உன்னிடம் திரும்பி வருவேன்
  rationale: שוב இங்கு மீண்டும் வருதலைக் குறிக்கிறது; אֵלֶיךָ ஆண்பால் ஒருமையில் ஆபிரகாமைக் குறிக்கிறது. பெயரைச் சேர்க்காமல் மூலத்தின் இரண்டாம் நபர் வடிவம் காக்கப்பட்டுள்ளது.
- source_word: כָּעֵת חַיָּה
  choice: அடுத்த ஆண்டு இதே நேரத்தில்
  rationale: சொல்லுக்கு நெருக்கமாக ‘உயிருள்ள காலத்தின்படி’ எனத் தோன்றக்கூடிய இந்தக் கடினமான மரபுத்தொடர், சூழலில் அடுத்த ஆண்டின் இதே பருவத்தைக் குறிக்கிறது. தெளிவுக்காக அதன் சூழல்சார் பொருள் முதன்மை உரையில் தரப்பட்டு, சொற்சார்ந்த தன்மை அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: וּלְשָׂרָה בֵן
  choice: சாராளுக்கு ஒரு மகன் இருப்பான்
  rationale: இறுதிக் கூறு எபிரெயத்தில் வினைச்சொல் இல்லாதது. எதிர்கால வாக்குறுதியின் சூழலைக் காத்து, ‘சாராளுக்கு ஒரு மகன் இருப்பான்’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது; ‘பிறப்பான்’ எனச் சேர்த்து வினையைத் தீர்மானிப்பது தவிர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் பொதுப்பட்டம் அல்ல, יהוה என்ற தனிப்பெயரே உள்ளது. ‘யாவே’ என்பது அதன் பரவலாக ஏற்கப்படும் ஒலிப்பைத் தமிழில் நேரடியாகக் காட்டுகிறது.
- issue: வினாவாக்கியத்தின் வலிமை
  choice: யாவேக்கு இயலாத காரியம் ஏதாவது உண்டா?
  alternative: யாவேக்கு மிகவும் வியப்பான காரியம் ஏதாவது உண்டா?; யாவேக்கு முடியாதது ஏதாவது உண்டா?
  rationale: இந்த வினா வாக்குறுதியை நிறைவேற்றும் யாவேயின் ஆற்றலை வலியுறுத்துகிறது. ‘இயலாத’ என்பது அந்தக் கருத்தைத் தெளிவாகத் தருகிறது; அதேவேளை פלא என்பதிலுள்ள ‘வியப்புக்குரிய’ என்ற உண்மையான பொருள் வாய்ப்பை அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் இறைமொழிக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘குறித்த காலத்தில்’, ‘திரும்பி வருவேன்’ போன்ற வடிவங்கள் தெளிவையும் மூலத்துக்கு நெருக்கத்தையும் சமநிலைப்படுத்துகின்றன. சாராளைப் பற்றிய வினையற்ற எபிரெயக் கூறு தேவையற்ற விளக்கச் சேர்க்கையின்றி காக்கப்பட்டுள்ளது.
