base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/008.yaml
  text: Then he took curds and milk and the calf that he had prepared[a], and set it before them[b]. He stood by them under the tree while they ate.
translation:
  language: ta
  text: பின்பு அவர் தயிரும் பாலும், சமைத்திருந்த கன்றுக்குட்டியையும்[a] எடுத்து அவர்களுக்கு முன் வைத்தார். அவர்கள் சாப்பிட்டுக்கொண்டிருக்கையில், அவர் மரத்தடியில் அவர்களருகே நின்றுகொண்டிருந்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தயிர்’ என்பதற்குப் பதிலாக ‘வெண்ணெய்’ அல்லது ‘பாலேடு’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் கெட்டியான ஒரு பால் பொருளைக் குறிக்கிறது; சூழலைப் பொறுத்து அதன் துல்லிய வகை மாறலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லளவில், ‘அவர்கள்மேல் நின்றுகொண்டிருந்தார்.’ இங்கு அவர் விருந்தோம்புகிறவராக அருகில் நின்று அவர்களைக் கவனித்தார் என்பதே பொருளாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאָה
  choice: தயிர்
  rationale: இச்சொல் கெட்டியான பால் பொருளைக் குறிக்கிறது; மேய்ப்புச் சூழலில் நவீன மேசை வெண்ணெயைவிட ‘தயிர்’ இயல்பானதும் சூழலுக்கேற்றதுமான தேர்வு. அதன் துல்லிய வகை உறுதியற்றதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: חָלָב
  choice: பால்
  rationale: பாலைக் குறிக்கும் பொதுவான எபிரெயச் சொல்லின் நேரடியான, இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: וּבֶן הַבָּקָר
  choice: கன்றுக்குட்டியின் இறைச்சி
  rationale: சொல்லளவில் ‘மந்தையின்/மாடுகளின் மகன்’ என்பது இளம் மாட்டைக் குறிக்கும் மரபுத்தொடர். முந்தைய வசனத்தில் விலங்கு சமைக்கப்பட்டதால், இங்கு உணவாக வைக்கப்பட்டதைத் தமிழில் இயல்பாகத் தெளிவுபடுத்த ‘இறைச்சி’ சேர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר עָשָׂה
  choice: சமைத்திருந்த
  rationale: עשה பொதுவாக ‘செய்/உருவாக்கு’ எனப் பொருள்பட்டாலும், உணவுச் சூழலில் ‘சமைத்திருந்த’ என்பது கருத்தை இயல்பாகத் தருகிறது.
- source_word: וַיִּתֵּן לִפְנֵיהֶם
  choice: அவர்கள்முன் வைத்தார்
  rationale: சொல்லளவில் ‘அவர்கள்முன் கொடுத்தார்’ என்றாலும், விருந்தினர்முன் உணவைப் பரிமாறி வைப்பதே இங்குள்ள பொருள்.
- source_word: וְהוּא עֹמֵד עֲלֵיהֶם
  choice: அவர் அவர்களருகே நின்றுகொண்டிருந்தார்
  rationale: עַל சொல்லளவில் ‘மேல்’ என வரலாம்; இவ்விருந்தோம்பல் சூழலில் ஆபிரகாம் அருகில் நின்று விருந்தினரைக் கவனித்தார் என்பதே இயல்பான பொருள். சொல்லளவிலான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: תַּחַת הָעֵץ
  choice: மரத்தடியில்
  rationale: ‘மரத்தின் கீழ்’ என்ற எபிரெயத் தொடருக்கான இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: וַיֹּאכֵלוּ
  choice: அவர்கள் சாப்பிட்டுக்கொண்டிருக்கையில்
  rationale: எபிரெயத்தில் ‘அவர்கள் சாப்பிட்டார்கள்’ என்று தொடர்ந்தாலும், ஆபிரகாம் நின்றிருந்ததற்கும் அவர்கள் சாப்பிட்டதற்கும் இடையிலான ஒரேகாலத் தொடர்பைத் தமிழில் இவ்வடிவம் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: விருந்தினர்களின் பிற்கால இறையியல் அடையாளத்தை மொழிபெயர்ப்பிலேயே முன்னிறுத்த வேண்டுமா
  choice: வசனத்தை ஆபிரகாமின் விருந்தோம்பலை விவரிக்கும் சாதாரண கதைநடையில் மொழிபெயர்த்தல்
  alternative: விருந்தினர்களின் தெய்வீக நிலையைச் சுட்டுமாறு பணிவிடை மொழியை உயர்த்திக் கூறுதல்
  rationale: இந்த வசனம் நேரடியாக ஆபிரகாமின் விருந்தோம்பலையே விவரிக்கிறது. எபிரெய மூலத்தில் வெளிப்படையாக இல்லாத கிறிஸ்தவ அல்லது திரித்துவ விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல் இருப்பது உண்மையான இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமான கதைநடையிலும் வடிவமைக்கப்பட்டது. ‘சாப்பிட்டுக்கொண்டிருக்கையில்’ என்பது இயல்பான பேச்சு-எழுத்து நடையைத் தருகிறது; ‘அவர்களருகே’ என்பது விருந்தோம்பல் சூழலைத் தெளிவுபடுத்துகிறது. மூலத்தின் உண்மையான சொற்பொருள் சாத்தியங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
