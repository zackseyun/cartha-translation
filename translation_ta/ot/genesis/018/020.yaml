source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה זַעֲקַ֛ת סְדֹ֥ם וַ/עֲמֹרָ֖ה כִּי רָ֑בָּה וְ/חַ֨טָּאתָ֔/ם כִּ֥י כָבְדָ֖ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/020.yaml
  text: Then Yahweh said[a], “The outcry against Sodom and Gomorrah is great[b], and their sin is very severe.”
translation:
  language: ta
  text: 'அப்போது யாவே சொன்னார்: “சோதோம் மற்றும் கொமோராவுக்கு எதிராக எழுந்த கூக்குரல்[a] மிகப் பெரிதாக இருக்கிறது; அவர்களுடைய பாவம் மிகவும் கடுமையானது[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சோதோம் மற்றும் கொமோராவின் கூக்குரல் மிகப் பெரிதாக இருக்கிறது.” எபிரெயத்தை இன்னும் சொற்சார்ந்து இவ்வாறு மொழிபெயர்க்கலாம்; முதன்மை உரை அந்தக் கூக்குரல் அவர்களுக்கு எதிராக எழுந்தது என்பதைச் சூழலிலிருந்து தெளிவாக்குகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுடைய பாவம் மிகவும் பாரமானது.” எபிரெயம் சொற்சார்ந்து அது “மிகவும் கனமாக” இருப்பதாகச் சொல்கிறது; இது அதன் மிகுந்த தீவிரத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... சொன்னார்
  rationale: வாவ் தொடர்வினை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; ‘அப்போது’ அதன் தொடர்ச்சியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, இறைப்பெயரான நான்கு எழுத்துப் பெயர்; தமிழில் அதன் பொதுவான ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்படுகிறது.
- source_word: זַעֲקַת סְדֹם וַעֲמֹרָה
  choice: சோதோம், கொமோராவுக்கு எதிராக எழுந்த கூக்குரல்
  rationale: זַעֲקָה என்பது கடுமையான அநீதியால் எழும் முறையீட்டுக் கூக்குரலைக் குறிக்கலாம். எபிரெயத்தில் உள்ள ‘சோதோம், கொமோராவின் கூக்குரல்’ என்ற அமைப்பு யாருக்கு எதிரான கூக்குரல் என்பதை வெளிப்படையாகச் சொல்லாததால், சூழலுக்கேற்ற பொருள் முதன்மை உரையில் தெளிவாக்கப்பட்டுள்ளது; சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כִּי רָבָּה
  choice: மிகப் பெரிதாக இருக்கிறது
  rationale: பெண்பால் ஒருமை வினையடை זַעֲקַת என்பதோடு இயைந்து, கூக்குரலின் பெருமளவைக் குறிக்கிறது.
- source_word: וְחַטָּאתָם
  choice: அவர்களுடைய பாவம்
  rationale: ஒருமை வடிவம் மக்களின் தீச்செயலைத் தொகுப்பாகக் குறிப்பிடுகிறது; ‘பாவம்’ அதன் நேரடியான மற்றும் இயல்பான தமிழ் இணை.
- source_word: כִּי כָבְדָה מְאֹד
  choice: மிகவும் கடுமையானது
  rationale: כבד என்பதன் அடிப்படைப் பொருள் ‘கனமாக இருத்தல்’; அற மற்றும் நீதித்துறைச் சூழலில் அது குற்றத்தின் மிகுந்த தீவிரத்தைக் குறிக்கும். ‘மிகவும் கடுமையானது’ இதை தெளிவான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை ஒரு பட்டப்பெயரை அல்ல, இஸ்ரவேலுக்கு வெளிப்படுத்தப்பட்ட தனிப்பட்ட இறைப்பெயரையே பயன்படுத்துகிறது. ஆகவே அதை பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: சோதோம், கொமோரா தொடர்பான கூக்குரலின் திசை
  choice: அவர்களுக்கு எதிராக எழுந்த கூக்குரல்
  alternative: சோதோம், கொமோராவின் கூக்குரல்
  rationale: எபிரெய வடிவம் சொற்சார்ந்து உடைமைத் தொடர்பாக இருந்தாலும், சூழல் அந்த நகரங்களின் அநீதியைப் பற்றிய முறையீட்டைக் குறிக்கிறது. முதன்மை உரை சூழற்பொருளைத் தருகிறது; உண்மையான இலக்கணத் திறந்தநிலை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. இடப்பெயர்கள் வழக்கமான தமிழ் வடிவங்களில் தரப்பட்டுள்ளன; அரைப்புள்ளி இரண்டு இணையான கூற்றுகளையும் தெளிவாகப் பிரிக்கிறது.
