revisions:
- from: யெகோவா ஆபிரகாமோடு பேசி முடித்ததும் அங்கிருந்து புறப்பட்டுச் சென்றார்[a]. ஆபிரகாமும் தன் இடத்திற்குத் திரும்பிச் சென்றார்.
  to: யாவே ஆபிரகாமிடம் பேசி முடித்தபின் புறப்பட்டுச் சென்றார்[a]; ஆபிரகாமும் தன் இடத்திற்குத் திரும்பினார்.
  rationale: The revision removes the unsupported «அங்கிருந்து», renders יהוה as «யாவே» in accordance with the POB source/audit-trail decision, and uses «ஆபிரகாமிடம்» to reflect the Hebrew preposition אֶל without implying a mutual conversation. The second clause remains lexically close and leaves «தன் இடம்» unspecified, as in the Hebrew.
