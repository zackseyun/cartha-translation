  text: וַ/יֵּ֣לֶךְ יְהוָ֔ה כַּ/אֲשֶׁ֣ר כִּלָּ֔ה לְ/דַבֵּ֖ר אֶל אַבְרָהָ֑ם וְ/אַבְרָהָ֖ם שָׁ֥ב לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/033.yaml
  text: Then Yahweh went his way when he had finished speaking to Abraham[a], and Abraham returned to his place.
translation:
  language: ta
  text: யாவே ஆபிரகாமிடம் பேசி முடித்தபின் புறப்பட்டுச் சென்றார்[a]; ஆபிரகாமும் தன் இடத்திற்குத் திரும்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: יהוה (YHWH). ‘யெகோவா’ என்பது மாற்று ஒலிபெயர்ப்பு.'
    reason: இறைநாமத்தின் எபிரெய வடிவத்தையும் மாற்று தமிழ் ஒலிபெயர்ப்பையும் குறிப்பிடுதல்.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: அங்கிருந்து புறப்பட்டுச் சென்றார்
  rationale: הלך இங்கு உரையாடல் முடிந்தபின் அவ்விடத்தைவிட்டுச் செல்வதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் இருப்பதற்காக ‘அங்கிருந்து புறப்பட்டுச் சென்றார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה ஒரு பட்டப்பெயராக மாற்றப்படாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவமான ‘யெகோவா’ என வழங்கப்பட்டது; இதன் உச்சரிப்பு குறித்த உறுதியின்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: כַּאֲשֶׁר
  choice: முடித்ததும்
  rationale: இங்கு כַּאֲשֶׁר புறப்படுதல் நிகழ்ந்த காலச் சூழலைக் காட்டுகிறது. כִּלָּה உடன் இணைத்து ‘முடித்ததும்’ என்பது இயல்பான தமிழ் காலத் தொடர்பைத் தருகிறது.
- source_word: כִּלָּה לְדַבֵּר
  choice: பேசி முடித்ததும்
  rationale: כלה + வினையெச்சம் ஓர் செயல் நிறைவடைந்ததைக் குறிக்கிறது; ‘பேசி முடித்ததும்’ அந்த நிறைவும் அடுத்த நிகழ்வின் தொடர்ச்சியும் தெளிவாகக் காட்டுகிறது.
- source_word: אֶל אַבְרָהָם
  choice: ஆபிரகாமோடு
  rationale: אֶל அடிப்படையில் ‘ஆபிரகாமிடம்’ என வரலாம்; உரையாடல் சூழலில் நவீன தமிழில் ‘ஆபிரகாமோடு பேசி’ இயல்பாக உள்ளது. இது பரஸ்பர உரையாடலை மிகைப்படுத்தாமல் பேசப்பட்ட நபரை அடையாளப்படுத்துகிறது.
- source_word: שָׁב
  choice: திரும்பிச் சென்றார்
  rationale: שוב இங்கு முன் இருந்த இடத்திற்குத் திரும்புவதைக் குறிக்கிறது. ‘திரும்பிச் சென்றார்’ தமிழ் கதைநடையில் இயல்பானது.
- source_word: לִמְקֹמוֹ
  choice: தன் இடத்திற்கு
  rationale: מקום என்பதன் நேரடிப் பொருள் ‘இடம்’. ‘வீடு’ எனக் குறிப்பாக்காமல் எபிரெய உரையின் பொதுத்தன்மை பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இறைநாமமான יהוה-ஐ மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் ஒரு தனிப்பெயர் இருப்பதால் அதை ‘கர்த்தர்’ என்ற பட்டப்பெயரால் மாற்றவில்லை. நான்கு எபிரெய மெய்யெழுத்துகளின் பண்டைய உச்சரிப்பு உறுதியாகத் தெரியாததால், தமிழில் அறியப்பட்ட ‘யெகோவா’ முதன்மை உரையில் வைக்கப்பட்டு ‘யாவே’ மாற்று ஒலிபெயர்ப்பாக அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தன் இடம்’ என்பதன் மூலம் மூலத்தின் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது; அது ‘வீடு’ என்று விளக்கப்படவில்லை.
