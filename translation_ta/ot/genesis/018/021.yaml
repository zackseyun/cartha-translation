base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/021.yaml
  text: I will go down now and see whether they have done altogether according to its outcry that has come to me[a]; and if not[b], I will know.
translation:
  language: ta
  text: நான் இப்போது இறங்கிப்போய், என்னிடம் வந்துள்ள அதன் கூக்குரலுக்கு ஏற்ப அவர்கள் முழுமையாகச் செய்திருக்கிறார்களா என்று பார்ப்பேன்[a]; அப்படி இல்லையென்றால், நான் அறிவேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னிடம் வந்துள்ள கூக்குரல் தெரிவிப்பதுபோலவே அவர்கள் முழுமையாகச் செய்திருக்கிறார்களா என்று பார்ப்பேன்.” ‘செய்தல்’ என்பதோடு ‘முழுமை’ என்பதைக் கூட்டும் எபிரெய மரபுத்தொடர், கூக்குரல் சுட்டும் தீமை முழு அளவில் நடந்ததா என்று கேட்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதன் கூக்குரலுக்கு ஏற்பவே அவர்கள் முழுமையாகச் செய்திருக்கிறார்களா என்று பார்ப்பேன்.” எபிரெயத்தில் ‘முழுமையாக’ என்பதன் தொடர்பு கூக்குரலுடனும் அவர்கள் செய்ததுடனும் நெருக்கமாக இணைந்துள்ளது.
    reason: previous_rendering
lexical_decisions:
- source_word: אֵרֲדָה נָּא
  choice: நான் இப்போது இறங்கிப்போய்
  rationale: இறங்குதல் என்ற உருவகமனித மொழியையும், cohortative வடிவின் உறுதியான நோக்கத்தையும், נָא குறிக்கும் உடனடித்தன்மையையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וְאֶרְאֶה
  choice: பார்ப்பேன்
  rationale: இங்கு ‘பார்’ என்பது ஆராய்ந்து உண்மையை உறுதிசெய்துகொள்வதைக் குறிக்கிறது; அதேவேளை எபிரெயச் சொல்லின் எளிய உருவகத்தை மாற்றாமல் காக்கிறது.
- source_word: הַכְּצַעֲקָתָהּ
  choice: அதன் கூக்குரலின்படியே
  rationale: צעקה என்பது கடும் அநீதியால் எழும் முறையீட்டுக் கூக்குரலைக் குறிக்கலாம். பெண்பால் ஒருமை பின்னொட்டை ‘அதன்’ என்று வழங்குவது, அது நகரத்தையோ பகுதியையோ சுட்டும் தெளிவின்மையைப் பாதுகாக்கிறது; ‘அதற்கு எதிரான’ என்று விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: הַבָּאָה אֵלַי
  choice: என்னிடம் வந்துள்ள
  rationale: ‘கூக்குரல்’ என்பதை விளக்கும் participial தொடரை இயல்பான தமிழ் பெயரெச்சத் தொடராக வழங்குகிறது.
- source_word: עָשׂוּ כָּלָה
  choice: அவர்கள் முற்றிலும் செய்திருக்கிறார்களா
  rationale: பன்மை வினையின் குறிப்பிடப்படாத எழுவாயை ‘அவர்கள்’ என்று காக்கிறது. כָּלָה தரும் முழுமை எண்ணத்தை ‘முற்றிலும்’ என வழங்கி, கடினமான எபிரெய மரபுத்தொடரை அளவுக்கு மீறி விளக்காமல் வைக்கிறது.
- source_word: וְאִם לֹא
  choice: இல்லையென்றால்
  rationale: முந்தைய விசாரணைக்கு எதிரான நிபந்தனையை நவீனத் தமிழில் தெளிவாகவும் சுருக்கமாகவும் காட்டுகிறது.
- source_word: אֵדָעָה
  choice: நான் அறிந்துகொள்வேன்
  rationale: ידע என்பதன் ‘அறிதல்/உறுதிசெய்துகொள்ளுதல்’ பொருளையும் cohortative நோக்கத்தையும் தக்கவைக்கிறது; ‘கண்டுபிடிப்பேன்’ என்று அதிகமாக விளக்கவில்லை.
theological_decisions:
- issue: தேவன் மனிதரைப்போல் இறங்கிச் சென்று பார்ப்பதாகக் கூறப்படும் உருவகமனிதச் சித்தரிப்பு
  choice: ‘இறங்கிப்போய் ... பார்ப்பேன்’ என்ற மொழியை அப்படியே தக்கவைத்தல்
  alternative: ‘நான் விசாரித்துத் தீர்ப்பளிப்பேன்’ என்று இறையறிவின் கோட்பாட்டுக்கு ஏற்ப விளக்கிப் பெயர்த்தல்
  rationale: மூல எபிரெய உரை தேவனுடைய செயலை மனித அனுபவத்துக்கு ஏற்ற மொழியில் சித்தரிக்கிறது. அதன் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு அமைதியாகத் தீர்த்துவிடாமல் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அதன் கூக்குரல்’ மற்றும் ‘முற்றிலும் செய்திருக்கிறார்களா’ என்ற சற்றுக் கடினமான அமைப்புகள் மூலத்தின் உண்மையான தெளிவின்மையையும் மரபுத்தொடரையும் காக்கின்றன; அடிக்குறிப்பு அவற்றை விளக்குகிறது.
