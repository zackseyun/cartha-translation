revisions:
- from: அவர், “என் ஆண்டவரே[a], உமது கண்களில் எனக்குத் தயவு கிடைத்திருக்குமானால், தயவுசெய்து உமது அடியேனைக் கடந்து போகாதீர்” என்றார்.
  to: அவர், “என் ஆண்டவரே[a], உமது கண்களில் எனக்குத் தயவு கிடைத்திருக்குமானால், தயவுசெய்து உமது அடியானாகிய என்னை விட்டு கடந்து போகாதீர்” என்றார்.
  rationale: The revision preserves the Hebrew’s ambiguity in the main text while making the footnote’s divine-address alternative explicit. It also clarifies the spatial sense of the request without changing its meaning or its deferential register.
