id: GEN.18.3
reference: Genesis 18:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר אֲדֹנָ֗/י אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ אַל נָ֥א תַעֲבֹ֖ר מֵ/עַ֥ל עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/003.yaml
  text: And he said[a], “My lord, if I have found favor in your eyes, please do not pass by your servant.”
translation:
  language: ta
  text: அவர், “என் ஆண்டவரே[a], உமது கண்களில் எனக்குத் தயவு கிடைத்திருக்குமானால், தயவுசெய்து உமது அடியானாகிய என்னை விட்டு கடந்து போகாதீர்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இங்கு ஆபிரகாம் வருகையாளரிடம் மரியாதையுடன் பேசுவதைவிட, குறிப்பாகக் கடவுளை நோக்கிப் பேசியதாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: அவர் ... என்றார்
  rationale: எபிரேயக் கதைநடையின் வழக்கமான வினை வடிவத்தை இயல்பான நவீனத் தமிழ் நேர்பேச்சு அமைப்பில் தருகிறது.
- source_word: אֲדֹנָי
  choice: என் ஆண்டவரே
  rationale: உயர்ந்தவரை மரியாதையுடன் அழைக்கும் பொருளையும், இது கடவுளை நோக்கிய அழைப்பாக இருக்கக்கூடிய வாய்ப்பையும் ஒரே அளவில் திறந்துவைக்கிறது.
- source_word: אִם נָא
  choice: '... இருக்குமானால்'
  rationale: மரியாதையான வேண்டுகோளுக்கான நிபந்தனைத் தொடக்கத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது; נָא என்பதன் வேண்டுதல் நயம் பின்னர் வரும் ‘தயவுசெய்து’ என்பதில் வெளிப்படுகிறது.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: உமது கண்களில் எனக்குத் தயவு கிடைத்திருக்குமானால்
  rationale: ஆதரவைப் பெற்றிருப்பதைக் குறிக்கும் எபிரேய மரபுத்தொடரின் கண் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: אַל נָא
  choice: தயவுசெய்து ... போகாதீர்
  rationale: தடை வேண்டுகோளின் பணிவையும் அவசரத்தையும் இயல்பான மரியாதைத் தமிழில் தருகிறது.
- source_word: תַעֲבֹר מֵעַל
  choice: கடந்து போகாதீர்
  rationale: ஒருவரைக் கடந்து தொடர்ந்து செல்வதைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: עַבְדֶּךָ
  choice: உமது அடியேன்
  rationale: மதிப்பிற்குரிய ஒருவரிடம் பேசும்போது பயன்படுத்தப்படும் பணிவான தன்மைக் குறிப்பாக இங்கு பொருந்துகிறது; சமூக அடிமை நிலையைக் காரணமின்றி முன்னிறுத்துவதில்லை.
theological_decisions:
- issue: אֲדֹנָי என்பது கடவுளுக்குரிய ‘ஆண்டவர்’ என்ற பட்டமா, வருகையாளருக்கான மரியாதை அழைப்பா?
  choice: என் ஆண்டவரே
  alternative: ஆண்டவரே
  rationale: ஆதியாகமம் 18-இன் விரிந்த சூழல் கர்த்தரின் தோற்றத்தைச் சொன்னாலும், இவ்வசனத்தின் நேரடி உரை ஒருமை முன்னிலையால் ஒரு வருகையாளரை மரியாதையுடன் அழைப்பதாகவும் வாசிக்கப்படலாம். ‘என் ஆண்டவரே’ இரு சாத்தியங்களையும் தீர்மானிக்காமல் பாதுகாக்கிறது; குறிப்பில் மாற்று வாசிப்பு தரப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ். ‘உமது’, ‘அடியேன்’, ‘போகாதீர்’ ஆகியவை விருந்தினரிடம் ஆபிரகாம் காட்டும் உயர்ந்த மரியாதையையும் பணிவையும் வெளிப்படுத்துகின்றன; தேவையற்ற சமயத் தீர்மானத்தைத் தவிர்க்கின்றன.
