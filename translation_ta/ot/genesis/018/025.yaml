revisions:
- from: அப்படிப்பட்ட ஒரு செயலைச் செய்வது உமக்கு ஒருபோதும் ஏற்புடையதல்ல—நீதிமானையும் தீயவனோடு கொன்றுவிட்டு, நீதிமானும் தீயவனைப்போலவே ஆகும்படி செய்வது உமக்கு ஒருபோதும் ஏற்புடையதல்ல! பூமி முழுவதற்கும் நீதிபதியானவர் நீதியைச் செய்ய மாட்டாரா?[a]
  to: இத்தகைய செயலைச் செய்வது உமக்குத் தகாதது—நீதிமானைத் தீயவனோடு சேர்த்துக் கொன்று, நீதிமானையும் தீயவனைப்போல நடத்துவது. இது உமக்குத் தகாதது! பூமி முழுவதற்கும் நீதிபதியானவர் நீதியைச் செய்ய மாட்டாரா?[a]
  rationale: The revision removes the possible sequential sense of «கொன்றுவிட்டு» and avoids implying that the righteous becomes morally wicked. It makes explicit the source clause’s objection that the righteous be treated as the wicked, while preserving the verse’s force, repetition, and rhetorical question.
