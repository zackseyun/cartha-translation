review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the doubled repudiation, the righteous–wicked contrast, and the final rhetorical question. However, «கொன்றுவிட்டு» can imply a sequential completed action, and «நீதிமானும் தீயவனைப்போலவே ஆகும்படி» may suggest that the righteous becomes morally like the wicked. The Hebrew protests equal destructive/judicial treatment, not a moral transformation. The revision expresses this distinction more directly.
  naturalness: The proposed wording is fluent modern standard Tamil and retains a reverent singular address. «இது உமக்குத் தகாதது!» is a natural, emphatic rendering of the second standalone חָלִילָה לָּךְ.
  terminology: «நீதிமான்», «தீயவன்», «நீதிபதி», and «நீதி» are appropriate in this judicial and theological context. «நீதிமானையும் தீயவனைப்போல நடத்துவது» conveys the comparative force without adding a doctrinal interpretation.
  issues:
  - severity: medium
    issue: «கொன்றுவிட்டு» and «ஆகும்படி» weaken the intended judicial comparison.
    rationale: «கொன்றுவிட்டு» can read as “after killing,” while «தீயவனைப்போலவே ஆகும்படி» can imply moral change. The Hebrew objects to killing the righteous together with the wicked, with the resulting treatment of the righteous as though wicked.
  revised_text: இத்தகைய செயலைச் செய்வது உமக்குத் தகாதது—நீதிமானைத் தீயவனோடு சேர்த்துக் கொன்று, நீதிமானையும் தீயவனைப்போல நடத்துவது. இது உமக்குத் தகாதது! பூமி முழுவதற்கும் நீதிபதியானவர் நீதியைச் செய்ய மாட்டாரா?[a]
