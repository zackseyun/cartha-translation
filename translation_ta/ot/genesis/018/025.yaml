base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/025.yaml
  text: Far be it from you to do such a thing—to put the righteous to death with the wicked[a], so that the righteous would be like the wicked. Far be it from you! Shall not the Judge of all the earth do justice?
translation:
  language: ta
  text: இத்தகைய செயலைச் செய்வது உமக்குத் தகாதது—நீதிமானைத் தீயவனோடு சேர்த்துக் கொன்று, நீதிமானையும் தீயவனைப்போல நடத்துவது. இது உமக்குத் தகாதது! பூமி முழுவதற்கும் நீதிபதியானவர் நீதியைச் செய்ய மாட்டாரா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமி முழுவதற்கும் நீதிபதியானவர் நீதியானதைச் செய்ய மாட்டாரா?”
    reason: מִשְׁפָּט என்பதை இச்சூழலில் ‘நீதி’ என்ற பெயர்ச்சொல்லாகவும், ‘நீதியானது’ என்ற பொருளிலும் இயல்பாக மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: חָלִילָה
  choice: உமக்கு ஒருபோதும் ஏற்புடையதல்ல
  rationale: கடும் மறுப்பையும் அருவருப்பையும் வெளிப்படுத்தும் எபிரெய மரபுத்தொடரின் வலிமையை இயல்பான நவீனத் தமிழில் தருகிறது; இருமுறை வருவதையும் அப்படியே காக்கிறது.
- source_word: מֵעֲשֹׂת כַּדָּבָר הַזֶּה
  choice: அப்படிப்பட்ட ஒரு செயலைச் செய்வது
  rationale: ‘இந்தக் காரியத்தைச் செய்வதிலிருந்து’ என்ற சொற்சொல் அமைப்பைத் தமிழில் இயல்பாகவும் அதே குறிப்புடனும் தெரிவிக்கிறது.
- source_word: לְהָמִית
  choice: கொன்றுவிட்டு
  rationale: מות என்பதன் காரணவினை வடிவிலுள்ள ‘சாகச் செய்தல்/கொல்லுதல்’ என்ற பொருளைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: צַדִּיק
  choice: நீதிமான்
  rationale: இங்கு உள்ள ஒழுக்க மற்றும் நீதிமன்றச் சார்ந்த பொருளைத் தக்கவைத்து, ‘தீயவன்’ என்பதற்கு நேரான எதிர்ச் சொல்லாக அமைகிறது.
- source_word: עִם רָשָׁע
  choice: தீயவனோடு
  rationale: எபிரெய ஒருமை வடிவத்தையும் நீதிமான்–தீயவன் என்ற பிரதிநிதித்துவ எதிர்மறையையும் காக்கிறது.
- source_word: וְהָיָה כַצַּדִּיק כָּרָשָׁע
  choice: நீதிமானும் தீயவனைப்போலவே ஆகும்படி
  rationale: நீதிமானுக்கும் தீயவனுக்கும் ஒரே நிலை ஏற்படும் என்ற சகிக்க முடியாத விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֲשֹׁפֵט כָּל הָאָרֶץ
  choice: பூமி முழுவதற்கும் நீதிபதியானவர்
  rationale: தேவனுக்கான பட்டப்பெயராகவும், நியாயத்தீர்ப்பின் உலகளாவிய பரப்பையும் தெளிவாகக் காக்கிறது.
- source_word: מִשְׁפָּט
  choice: நீதி
  rationale: வெறும் தீர்ப்புச் செயலைவிட நீதியாகச் செயல்படுதல் என்ற ஒழுக்க-நீதித்துறை வலிமையை இச்சூழலில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தேவனுடைய நீதியான குணத்தை நோக்கி ஆபிரகாம் முன்வைக்கும் துணிவான வினா
  choice: பூமி முழுவதற்கும் நீதிபதியானவர் நீதியைச் செய்ய மாட்டாரா?
  alternative: பூமி முழுவதற்கும் நீதிபதியானவர் நீதியானதைச் செய்ய மாட்டாரா?
  rationale: எபிரெய வினா ‘நிச்சயமாகச் செய்வார்’ என்ற உடன்பாட்டு விடையை எதிர்பார்க்கிறது. ஆபிரகாமின் துணிவை மென்மைப்படுத்தாமல், מִשְׁפָּט என்பதன் நீதித்துறை மற்றும் ஒழுக்க வலிமையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; தேவனை நோக்கிய உரையில் மரியாதை ஒருமையான ‘உமக்கு’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் கடும் மறுப்பு, அதன் இருமுறை மீளுரை, நீதிமான்–தீயவன் எதிரிணை, இறுதி வினாவின் துணிவு ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
