  text: וַ/יֹּאמְר֣וּ אֵׄלָׄ֔יׄ/וׄ אַיֵּ֖ה שָׂרָ֣ה אִשְׁתֶּ֑/ךָ וַ/יֹּ֖אמֶר הִנֵּ֥ה בָ/אֹֽהֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/009.yaml
  text: Then they said to him[a], “Where is Sarah your wife?” And he said, “There, in the tent.”
translation:
  language: ta
  text: பின்னர் அவர்கள் அவனிடம்[a], “உன் மனைவி சாராள் எங்கே?” என்று கேட்டார்கள். அதற்கு அவன், “அதோ, கூடாரத்தில் இருக்கிறாள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில் ‘அவனிடம்’ என்ற சொல்லின் மேல் சிறப்புப் புள்ளிகள் இடப்பட்டுள்ளன; அவற்றின் நோக்கம் உறுதியாகத் தெரியவில்லை.
    reason: WLC உரையில் אֵלָיו என்பதன் மேல் காணப்படும் பழங்கால எழுத்தர் குறியீட்டைத் தெரிவிக்கிறது; அது மொழிபெயர்ப்பின் அடிப்படைப் பொருளை மாற்றுவதில்லை.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: பின்னர் அவர்கள் ... கேட்டார்கள்
  rationale: தொடர்ச்சியான அடுத்த நிகழ்வை அறிமுகப்படுத்தும் wayyiqtol வடிவம். நேரடி உரை கேள்வியாக இருப்பதால், தமிழில் இயல்பாக ‘சொன்னார்கள்’ என்பதற்குப் பதில் ‘கேட்டார்கள்’ என வழங்கப்பட்டது.
- source_word: אֵלָיו
  choice: அவனிடம்
  rationale: אֶל முன்னிடைச்சொல்லும் மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டும் சேர்ந்து, ஆபிரகாமை நோக்கிய உரையைக் குறிக்கின்றன.
- source_word: אַיֵּה
  choice: எங்கே?
  rationale: இடத்தை விசாரிக்கும் வினையடை; நவீன தமிழில் இயல்பான நேரடிக் கேள்வியாக வழங்கப்பட்டது.
- source_word: שָׂרָה אִשְׁתֶּךָ
  choice: உன் மனைவி சாராள்
  rationale: எபிரெய உரையின் ‘சாராள், உன் மனைவி’ என்ற பொருளைத் தெளிவான, இயல்பான தமிழ் சொல்வரிசையில் வழங்குகிறது.
- source_word: הִנֵּה
  choice: அதோ
  rationale: கவனத்தை ஓர் இடத்தை நோக்கித் திருப்பும் சுட்டிடைச்சொல். ‘இதோ’ என்பதும் சாத்தியம்; கேட்கப்பட்ட இடத்தைக் காட்டும் பதிலில் ‘அதோ’ இயல்பாக உள்ளது.
- source_word: בָאֹהֶל
  choice: கூடாரத்தில்
  rationale: ב முன்னிடைச்சொல், குறிப்புச் சுட்டுடன் வரும் אֹהֶל என்பதோடு சேர்ந்து ‘அந்தக் கூடாரத்தில்’ அல்லது சூழலுக்கேற்ப ‘கூடாரத்தில்’ என்று பொருள்படுகிறது.
- source_word: הִנֵּה בָאֹהֶל
  choice: அதோ, கூடாரத்தில் இருக்கிறாள்
  rationale: எபிரெயில் உள்ள சுருக்கமான இடப்பதிலைப் பாதுகாக்கும் அதேவேளையில், தமிழில் முழுமையாகவும் இயல்பாகவும் ஒலிக்க மறைந்துள்ள பெண்பால் எழுவாயும் வினையும் வெளிப்படுத்தப்பட்டுள்ளன.
