translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய பதிலின் சுட்டுத்தன்மையை ‘அதோ’ என்பதாலும், தமிழின் இயல்புக்காக மறைந்துள்ள ‘இருக்கிறாள்’ என்பதாலும் சமநிலைப்படுத்துகிறது.
