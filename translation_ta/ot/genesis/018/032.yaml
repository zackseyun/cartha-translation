  text: וַ֠/יֹּאמֶר אַל נָ֞א יִ֤חַר לַֽ/אדֹנָ/י֙ וַ/אֲדַבְּרָ֣ה אַךְ הַ/פַּ֔עַם אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם עֲשָׂרָ֑ה וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּ/עֲב֖וּר הָ/עֲשָׂרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/032.yaml
  text: Then he said[a], “Please, let not my lord be angry, and I will speak only this once more. Perhaps ten will be found there.” And he said[c][b], “I will not destroy it for the sake of the ten.”
translation:
  language: ta
  text: அப்போது அவர், “தயவுசெய்து, என் ஆண்டவரே[a], கோபங்கொள்ள வேண்டாம்; இன்னும் இந்த ஒருமுறை மட்டும் பேச அனுமதியுங்கள். ஒருவேளை அங்கே பத்துப் பேர் காணப்படலாம்” என்றார். அதற்கு அவர், “அந்தப் பத்துப் பேருக்காக அதை[b] அழிக்கமாட்டேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் ஆண்டவரே” என்பது மரியாதையான அழைப்பு; எபிரெயத்தில் இங்கு யாவே என்ற இறைப்பெயர் இடம்பெறவில்லை.
    reason: theological_ambiguity
  - marker: b
    text: எபிரெயத்தில் “அந்தப் பத்துப் பேருக்காக அழிக்கமாட்டேன்” என்று மட்டுமே உள்ளது; “அதை” என்பது சூழலிலிருந்து சேர்க்கப்பட்டுள்ளது.
    reason: implicit_object
lexical_decisions:
- source_word: אַל נָא יִחַר
  choice: தயவுசெய்து ... கோபங்கொள்ள வேண்டாம்
  rationale: நָא என்பதன் பணிவான வேண்டுகோளையும், חרה குறிக்கும் கோபம் மூளுதல் என்ற சொல்லாட்சியையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: לַאדֹנָי
  choice: என் ஆண்டவர்
  rationale: ஆபிரகாம் தன்னுடன் பேசுகிறவரை மரியாதையுடனும் தாழ்மையுடனும் நேரடியாக அழைப்பதைப் பிரதிபலிக்கிறது; இங்கு יהוה என்ற உடன்படிக்கைப் பெயர் பயன்படுத்தப்படவில்லை.
- source_word: וַאֲדַבְּרָה אַךְ הַפַּעַם
  choice: இந்த ஒருமுறை மட்டும் நான் பேசுகிறேன்
  rationale: கூட்டேச்சை வடிவத்தின் வேண்டுகோள்/நோக்க உணர்வையும், אַךְ הַפַּעַם கூறும் இறுதியான ஒரே வேண்டுகோள் என்ற வரம்பையும் இயல்பாகக் காட்டுகிறது.
- source_word: אוּלַי יִמָּצְאוּן שָׁם עֲשָׂרָה
  choice: ஒருவேளை அங்கே பத்துப் பேர் காணப்படலாம்
  rationale: אוּלַי குறிக்கும் சாத்தியத்தையும், מצא என்பதன் நிபால் வடிவிலுள்ள ‘காணப்படுதல்’ என்ற பொருளையும் காக்கிறது. சூழலில் எண்ணப்படுபவர்கள் மனிதர்கள் என்பதால் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: לֹא אַשְׁחִית
  choice: அதை அழிக்கமாட்டேன்
  rationale: ஹிபீல் வடிவிலுள்ள שׁחת இங்கு ‘அழித்தல்’ என்று பொருள்படுகிறது. எபிரெயத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள், நகரத்தை/இடத்தைச் சுட்டுவதாகச் சூழலிலிருந்து தமிழில் சேர்க்கப்பட்டுள்ளது.
- source_word: בַּעֲבוּר הָעֲשָׂרָה
  choice: அந்தப் பத்துப் பேருக்காக
  rationale: בַּעֲבוּר என்பதன் ‘அவர்களை முன்னிட்டு/அவர்களுக்காக’ என்ற பரிந்துபேசும் தர்க்கத்தைத் தெரிவிக்கிறது; குறிப்பிட்ட பத்துப் பேரைச் சுட்டும் எபிரெயச் சுட்டுறுப்பு ‘அந்த’ என்பதால் வெளிப்படுகிறது.
theological_decisions:
- issue: ஆபிரகாமின் அழைப்பில் אֲדֹנָי என்பதன் குறிப்பு
  choice: என் ஆண்டவர்
  alternative: ஆண்டவரே / என் எஜமானே
  rationale: இந்த வசனத்தின் சொல் יהוה அல்ல; அது மரியாதையான நேரடி அழைப்பாகவும், தெய்வீக ஆண்டவரைக் குறிக்கும் பட்டமாகவும் வாசிக்கப்படக்கூடிய பதற்றத்தை முற்றிலும் தீர்மானிக்காமல் ‘என் ஆண்டவர்’ காக்கிறது.
- issue: לֹא אַשְׁחִית என்பதன் மறைந்த செயப்படுபொருள்
  choice: அதை அழிக்கமாட்டேன்
  alternative: அழிக்கமாட்டேன்
  rationale: தமிழில் வாக்கியத் தெளிவுக்காக நகரம்/இடத்தைக் குறிக்கும் ‘அதை’ சேர்க்கப்படுகிறது; அடிக்குறிப்பு அது மூலத்தில் வெளிப்படையாக இல்லை என்பதைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், உரையாடலுக்குரிய பணிவும் வேதாகமக் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘கோபங்கொள்ள வேண்டாம்’ என்பது நேரடி வேண்டுகோளாக இயல்பாக ஒலிக்கிறது; ‘என் ஆண்டவர்’ மூலத்தின் மரியாதையையும் குறிப்பின் நுட்பமான தெளிவின்மையையும் பேணுகிறது.
