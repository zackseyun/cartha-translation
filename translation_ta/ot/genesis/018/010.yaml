  text: וַ/יֹּ֗אמֶר שׁ֣וֹב אָשׁ֤וּב אֵלֶ֨י/ךָ֙ כָּ/עֵ֣ת חַיָּ֔ה וְ/הִנֵּה בֵ֖ן לְ/שָׂרָ֣ה אִשְׁתֶּ֑/ךָ וְ/שָׂרָ֥ה שֹׁמַ֛עַת פֶּ֥תַח הָ/אֹ֖הֶל וְ/ה֥וּא אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/010.yaml
  text: And he said[a], “I will surely return to you about this time next year, and behold[c][b], Sarah your wife will have a son.” And Sarah was listening at the entrance of the tent behind him.
translation:
  language: ta
  text: 'அவர் கூறினார்: “நான் நிச்சயமாக உன்னிடம் திரும்பி வருவேன்; அடுத்த ஆண்டு இதே காலத்தில்[a], இதோ, உன் மனைவி சாராளுக்கு ஒரு மகன் இருப்பான்.” அப்போது சாராள், அவருக்குப் பின்னால் இருந்த கூடார வாசலில்[b] கேட்டுக்கொண்டிருந்தாள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லுக்குச் சொல் வடிவம் ‘உயிருள்ள காலத்தின்படி’ என்பதாகும்; இச்சூழலில் அது ‘அடுத்த ஆண்டு இதே காலத்தில்’ எனப் பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேய வாசகம் மிகச் சுருக்கமாக, ‘கூடார வாசல்; அது/அவர் அவருக்குப் பின்னால் இருந்தது/இருந்தார்’ என்று அமைகிறது. கூடார வாசல் பேசியவருக்குப் பின்னால் இருந்தது என்றும், சாராள் அங்கே கேட்டுக்கொண்டிருந்தாள் என்றும் இங்கு பொருள் கொள்ளப்பட்டுள்ளது.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவர் கூறினார்
  rationale: எபிரேயக் கதைநடையின் தொடர்ச்சியை இயல்பான தமிழில் தருகிறது; பேசியவர் யார் என்பதை இந்த வசனத்துக்கு அப்பாற்பட்டு குறிப்பாக்கவில்லை.
- source_word: שׁוֹב אָשׁוּב
  choice: நான் நிச்சயமாக ... திரும்பி வருவேன்
  rationale: வினையெச்ச முழுமையும் அதே வேருடைய வினையும் சேர்ந்த அமைப்பு தரும் வலியுறுத்தலை ‘நிச்சயமாக’ வெளிப்படுத்துகிறது.
- source_word: כָּעֵת חַיָּה
  choice: அடுத்த ஆண்டு இதே காலத்தில்
  rationale: சொல்லுக்குச் சொல் வடிவத்தை விட, சூழலில் குறிக்கப்படும் அடுத்த ஆண்டின் இதே காலத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரேய இடைச்சொல்லின் அறிவிப்பு வலிமையைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: בֵן לְשָׂרָה אִשְׁתֶּךָ
  choice: உன் மனைவி சாராளுக்கு ஒரு மகன் இருப்பான்
  rationale: வினைச்சொல் இல்லாத எபிரேய உடைமை அமைப்பை அதிகமாக விளக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: שָׂרָה שֹׁמַעַת
  choice: சாராள் ... கேட்டுக்கொண்டிருந்தாள்
  rationale: பங்கேற்பு வினை வடிவம் காட்டும் தொடர்ச்சியான செயலைத் தமிழின் ‘கொண்டிருந்தாள்’ வடிவம் வெளிப்படுத்துகிறது.
- source_word: פֶּתַח הָאֹהֶל וְהוּא אַחֲרָיו
  choice: அவருக்குப் பின்னால் இருந்த கூடார வாசலில்
  rationale: சாராளின் இருப்பிடத்தையும் அது பேசியவருக்குப் பின்னால் இருந்ததையும் இயல்பான தமிழ் சொற்றொடராக இணைக்கிறது; மூலத்தின் சுருக்கமான சுட்டுப்பெயர் அமைப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: பேசியவரின் அடையாளம்
  choice: ‘அவர்’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது
  alternative: ‘ஆண்டவர்’ அல்லது ‘அந்த மனிதர்களில் ஒருவர்’
  rationale: இவ்வசனத்தின் எபிரேய உரை மூன்றாம் நபர் ஒருமையை மட்டுமே பயன்படுத்துகிறது; பரந்த சூழலிலிருந்து ஒரு குறிப்பிட்ட அடையாளத்தை இங்கே சேர்க்காமல் மூலத்தின் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
- issue: சாராளுக்குக் கிடைக்கும் மகனைச் சொல்லும் வினையற்ற அமைப்பு
  choice: ‘ஒரு மகன் இருப்பான்’
  alternative: ‘ஒரு மகன் பிறந்திருப்பான்’
  rationale: பிறப்பே சூழலில் இயல்பாகப் புரிந்தாலும், மூலத்தில் இல்லாத வினையை மிகக் குறிப்பாகச் சேர்க்காமல் வாக்குறுதியின் சுருக்கத்தையும் வலிமையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டது. ‘இதோ’ என்ற வேதாகம அறிவிப்பு நடை பாதுகாக்கப்பட்டாலும், மற்ற சொற்றொடர்கள் இயல்பான தமிழ் வாக்கிய அமைப்பில் தரப்பட்டுள்ளன.
