source:
  edition: WLC
  text: וַ/תִּצְחַ֥ק שָׂרָ֖ה בְּ/קִרְבָּ֣/הּ לֵ/אמֹ֑ר אַחֲרֵ֤י בְלֹתִ/י֙ הָֽיְתָה לִּ֣/י עֶדְנָ֔ה וַֽ/אדֹנִ֖/י זָקֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/012.yaml
  text: So Sarah laughed to herself[a], saying, “After I am worn out, shall I have pleasure, while my lord is old?”
translation:
  language: ta
  text: சாராள் தனக்குள் சிரித்துக்கொண்டு, “நான் தளர்ந்துபோன பிறகு, என் கணவரும் முதியவராக இருக்கிறாரே; எனக்கு இன்பம் உண்டாகுமா[a]?” என்று சொன்னாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்கு மகிழ்ச்சி உண்டாகுமா?” ‘இன்பம்’ என மொழிபெயர்க்கப்பட்ட சொல் புதுப்பெறும் தாம்பத்திய இன்பத்தையோ இளமைத் துடிப்பையோ குறிப்பதாகவும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְחַק
  choice: சிரித்துக்கொண்டு
  rationale: צחק என்பதன் இயல்பான பொருள் ‘சிரி’. இங்கு சாராளின் உள்ளார்ந்த எதிர்வினையே குறிக்கப்படுவதால், கேலி செய்தாள் என்று மிகைப்படுத்தாமல் நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: בְּקִרְבָּהּ
  choice: தனக்குள்
  rationale: சொல்லுக்கு நெருக்கமாக ‘அவளுக்குள்’ என்று பொருள்படும் தொடர்; உள்ளத்தில் நிகழ்ந்த சிரிப்பையும் பேச்சையும் இயல்பான நவீன தமிழில் ‘தனக்குள்’ என்பது தெளிவாகக் காட்டுகிறது.
- source_word: אַחֲרֵי בְלֹתִי
  choice: நான் தளர்ந்துபோன பிறகு
  rationale: בלה என்பது தேய்ந்து அல்லது வலுவிழந்து போதலைக் குறிக்கிறது. ஆபிரகாமின் முதுமை தனியாகச் சொல்லப்படுவதால், இதை வெறுமனே ‘நான் முதியவளான பிறகு’ என்று மாற்றாமல் உடல் தளர்ச்சியின் நுண்பொருள் காக்கப்பட்டது.
- source_word: הָיְתָה לִּי עֶדְנָה
  choice: எனக்கு இன்பம் கிடைக்குமா
  rationale: עֶדְנָה அரிய சொல்லாக இருந்து இன்பம், உடல்சார் மகிழ்ச்சி அல்லது புதுப்பெற்ற உயிர்த்துடிப்பு ஆகிய நிழற்பொருள்களைத் தரலாம். ‘இன்பம்’ என்ற பரந்த சொல் இவற்றில் ஒன்றை மட்டும் முடிவுசெய்யாமல் விடுகிறது.
- source_word: וַאדֹנִי
  choice: என் கணவரும்
  rationale: இது சாராள் ஆபிரகாமைக் குறிக்கும் மரியாதைமிக்க அழைப்பு. தமிழில் ‘என் ஆண்டவர்’ என்பது இறைத்தலைப்பாகத் தவறாகப் புரியக்கூடும்; ‘என் எஜமானர்’ என்பது எஜமான்–ஊழியர் உறவை மிகுதியாக உணர்த்தும். ஆகவே சூழலிலுள்ள உறவைத் தெளிவுபடுத்தி மரியாதைப் பன்மையைத் தக்கவைக்கும் ‘என் கணவரும்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: זָקֵן
  choice: முதியவராக இருக்கையில்
  rationale: ஆபிரகாம் முதியவர் என்பதை நேரடியாகவும் மரியாதையான நவீன தமிழிலும் தெரிவிக்கிறது; வாக்கியச் சூழலில் உள்ள முரண்பாட்டை ‘இருக்கையில்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: עֶדְנָה என்பதன் பொருள் வரம்பு
  choice: ‘இன்பம்’ என்ற பரந்த சொல்லால் மொழிபெயர்த்தல்
  alternative: ‘தாம்பத்திய இன்பம்’ அல்லது ‘மீண்டும் இளமைத் துடிப்பு’ என்று குறிப்பாக்குதல்
  rationale: சாராளின் வயது, உடல்நிலை, ஆபிரகாமின் முதுமை ஆகியவை உடல் மற்றும் தாம்பத்திய நிழற்பொருள்களை உருவாக்கினாலும், எபிரெயச் சொல் அவற்றில் ஒன்றை மட்டும் வெளிப்படையாக நிர்ணயிக்கவில்லை. எனவே முதன்மை உரை அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: וַאדֹנִי என்ற மரியாதைச் சொல்லின் குறிப்பு
  choice: ‘என் கணவர்’ என்று உறவைக் குறிப்பிட்டு மரியாதைப் பன்மையைப் பயன்படுத்துதல்
  alternative: ‘என் ஆண்டவர்’ என்று சொல்லுக்கு நெருக்கமாக மொழிபெயர்த்தல்
  rationale: இங்கு குறிக்கப்படுபவர் ஆபிரகாம்; கடவுள் அல்ல. தமிழில் இறைத்தலைப்பாகப் புரிந்துகொள்ளப்படும் வாய்ப்பைத் தவிர்த்து, சாராளின் மரியாதைத் தொனியை வினைமுற்று வடிவம் வழியாகக் காக்கிறது.
translation_notes:
  register: இயல்பான, நவீன, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தனக்குள்’ உள்ளார்ந்த சிரிப்பைக் காட்டுகிறது; ‘தளர்ந்துபோன’ என்பது முதுமை என்று மட்டும் பொதுமைப்படுத்தாமல் உடல் வலுவிழப்பை உணர்த்துகிறது. கேள்வி வடிவம் சாராளின் வியப்பையும் ஐயத்தையும் காக்கிறது.
