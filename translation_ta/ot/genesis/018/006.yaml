reference: Genesis 18:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְמַהֵ֧ר אַבְרָהָ֛ם הָ/אֹ֖הֱלָ/ה אֶל שָׂרָ֑ה וַ/יֹּ֗אמֶר מַהֲרִ֞י שְׁלֹ֤שׁ סְאִים֙ קֶ֣מַח סֹ֔לֶת ל֖וּשִׁי וַ/עֲשִׂ֥י עֻגֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/006.yaml
  text: So Abraham hurried into the tent to Sarah and said[a], “Quickly[b], knead three seahs of fine flour and make cakes.”
translation:
  language: ta
  text: ஆபிரகாம் கூடாரத்துக்குள் சாராவிடம் விரைந்து சென்று, “விரைவாக, மூன்று சேயா[a][b] மிக நன்றாக அரைத்த மாவைப் பிசைந்து, அப்பங்களைச் செய்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சேயா’ என்பது பண்டைய கால உலர் அளவை. மூன்று சேயா என்பது ஏறக்குறைய 20–22 லிட்டர்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “மூன்று அளவுகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: விரைந்து சென்று
  rationale: இந்த வினை வேகமாகச் செயல்படுவதைக் குறிக்கிறது; நவீனத் தமிழில் கதையின் அவசரத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָאֹהֱלָה אֶל שָׂרָה
  choice: கூடாரத்துக்குள் சாராவிடம்
  rationale: ‘கூடாரம்’ என்ற சொல்லுடன் சேர்ந்த திசைச்சுட்டு முடிவு, கூடாரத்தை நோக்கிய இயக்கத்தைக் காட்டுகிறது; சூழலில் சாராவிடம் உள்ளே செல்வது இயல்பான பொருள்.
- source_word: מַהֲרִי
  choice: சீக்கிரம்!
  rationale: இது சாராவை நோக்கிக் கூறப்பட்ட பெண்பால் ஒருமை கட்டளை; தனிச்சொல் கட்டளையாக அமைப்பது மூலத்தின் அவசரத் தொனியைப் பாதுகாக்கிறது.
- source_word: שְׁלֹשׁ סְאִים
  choice: மூன்று சேயா
  rationale: ‘சேயா’ என்பது குறிப்பிட்ட பண்டைய உலர் அளவை; பொதுவான ‘அளவுகள்’ என்பதற்குப் பதிலாக அலகின் வரலாற்றுத் தன்மையைப் பாதுகாக்க ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: קֶמַח סֹלֶת
  choice: உயர்தர மாவு
  rationale: இந்தச் சொற்றொடர் நன்றாக அரைக்கப்பட்ட தேர்ந்த மாவைக் குறிக்கிறது; ‘உயர்தர மாவு’ அதன் தரத்தைக் குறிக்கும் வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לוּשִׁי
  choice: பிசைந்து
  rationale: இந்த வினை வெறுமனே கலப்பதை அல்ல, மாவைப் பிசைவதைக் குறிப்பாகக் குறிக்கிறது.
- source_word: וַעֲשִׂי עֻגוֹת
  choice: அப்பங்கள் செய்
  rationale: עֻגוֹת என்பது விரைவாகத் தயாரிக்கக்கூடிய அப்ப வகைகளைக் குறிக்கிறது; வடிவம் அல்லது சுடும் முறையை அளவுக்கு மீறிக் குறிப்பிடாமல் ‘அப்பங்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
