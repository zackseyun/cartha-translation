revisions:
- from: ஆபிரகாம் கூடாரத்துக்குள் சாராவிடம் விரைந்து சென்று, “சீக்கிரம்! மூன்று சேயா[a][b] உயர்தர மாவைப் பிசைந்து, அப்பங்கள் செய்” என்றார்.
  to: ஆபிரகாம் கூடாரத்துக்குள் சாராவிடம் விரைந்து சென்று, “விரைவாக, மூன்று சேயா[a][b] மிக நன்றாக அரைத்த மாவைப் பிசைந்து, அப்பங்களைச் செய்” என்றார்.
  rationale: The revision makes the fine-milling sense of סֹלֶת explicit and smooths the urgent feminine-singular command in idiomatic Tamil. It retains the ancient measure, the approximate explanatory note, and the bread-cake sense without over-specifying their form or preparation.
