translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் உரையின் கண்ணியமும் கதையின் அவசரமும் நிலைக்குமாறும் மொழிபெயர்க்கப்பட்டுள்ளது. பண்டைய அளவலகான ‘சேயா’ உரையில் பாதுகாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
