revisions:
- from: ஒருவேளை நகருக்குள் நீதிமான்கள் ஐம்பது பேர் இருந்தால், உண்மையிலேயே அதை அழித்துப்போட்டு, அதற்குள் இருக்கும் ஐம்பது நீதிமான்களுக்காக அந்த இடத்தை விட்டுவைக்காமல்[a] இருப்பீரா?
  to: ஒருவேளை நகருக்குள் ஐம்பது நீதிமான்கள் இருந்தால், உண்மையிலேயே அதை அழித்துவிடுவீரா, அதற்குள் இருக்கும் ஐம்பது நீதிமான்களுக்காக அந்த இடத்தை விட்டுவைக்க மாட்டீரா?[a]
