source:
  edition: WLC
  text: אוּלַ֥י יֵ֛שׁ חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר הַ/אַ֤ף תִּסְפֶּה֙ וְ/לֹא תִשָּׂ֣א לַ/מָּק֔וֹם לְמַ֛עַן חֲמִשִּׁ֥ים הַ/צַּדִּיקִ֖ם אֲשֶׁ֥ר בְּ/קִרְבָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/024.yaml
  text: Suppose there are fifty righteous people within the city[c][b][a]. Will you indeed sweep it away and not spare the place for the sake of the fifty righteous who are within it?
translation:
  language: ta
  text: ஒருவேளை நகருக்குள் ஐம்பது நீதிமான்கள் இருந்தால், உண்மையிலேயே அதை அழித்துவிடுவீரா, அதற்குள் இருக்கும் ஐம்பது நீதிமான்களுக்காக அந்த இடத்தை விட்டுவைக்க மாட்டீரா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த இடத்தை மன்னிக்க மாட்டீரா?”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי יֵשׁ
  choice: ஒருவேளை ... இருந்தால்
  rationale: ஆபிரகாமின் தயக்கத்துடன் கூடிய கற்பனை நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; உறுதியான கூற்றாக மாற்றவில்லை.
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: நீதிமான்கள் ஐம்பது பேர்
  rationale: צַדִּיקִם என்பது நீதியுள்ள நபர்களைக் குறிக்கிறது; ஆண்களை மட்டும் குறிப்பதாக மூலத்தில் இல்லை.
- source_word: בְּתוֹךְ הָעִיר
  choice: நகருக்குள்
  rationale: நகரின் எல்லைக்குள் இருப்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַאַף
  choice: உண்மையிலேயே
  rationale: கேள்வியிலுள்ள வலியுறுத்தலை மிகைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: תִּסְפֶּה
  choice: அதை அழித்துப்போட்டு
  rationale: நியாயத்தீர்ப்பில் முற்றாக அகற்றுதல் அல்லது அழித்தல் என்ற சூழல்சார் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וְלֹא תִשָּׂא לַמָּקוֹם
  choice: அந்த இடத்தை விட்டுவைக்காமல்
  rationale: நகர்மீது வரவிருந்த அழிவை நிறுத்தி அதைக் காப்பாற்றுதல் என்ற உடனடி சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לְמַעַן
  choice: '...க்காக'
  rationale: நீதிமான்களின் நிமித்தம் அந்த இடம் அழிக்கப்படாமல் விடப்பட வேண்டும் என்ற வேண்டுகோளின் அடிப்படையை வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר בְּקִרְבָּהּ
  choice: அதற்குள் இருக்கும்
  rationale: ஐம்பது நீதிமான்கள் அந்த நகருக்குள் இருப்பதை மூலத்தின் தொடர்புச்சொல் அமைப்புக்கு ஏற்ப வெளிப்படுத்துகிறது.
theological_decisions:
- issue: נשא என்பதன் பொருள்
  choice: அழிவிலிருந்து விட்டுவைத்தல்
  alternative: அந்த இடத்தை மன்னித்தல்
  rationale: இங்கு நகரத்தை அழிப்பதற்கும் அதை அழிக்காமல் விடுவதற்கும் இடையிலான முரண்பாடே முதன்மையானது. எனினும், נשא என்பதில் மன்னித்தல் அல்லது பொறுத்தல் என்ற நிழற்பொருள் இருக்கக்கூடியதால் அதனை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஆபிரகாம் கடவுளிடம் மரியாதையுடன் நேரடியாகப் பேசும் தொனியைப் பேண “இருப்பீரா” பயன்படுத்தப்பட்டுள்ளது. கேள்வியின் வலியுறுத்தலும் வேண்டுகோளின் துணிவும் தக்கவைக்கப்பட்டுள்ளன; பழமையான அல்லது சமயப்பிரிவுக்கே உரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
