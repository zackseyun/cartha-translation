  yaml_path: translation/ot/genesis/018/011.yaml
  text: Abraham and Sarah were old[a], advanced in days; the way of women had ceased to be with Sarah.
translation:
  language: ta
  text: ஆபிரகாமும் சாராளும் வயது முதிர்ந்து, பல ஆண்டுகளைக் கடந்தவர்களாக இருந்தார்கள். பெண்களுக்குரிய வழக்கம்[a] சாராளுக்கு நின்றுபோயிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘பெண்களின் வழி.’ சாராளுக்கு இனி மாதவிடாய் ஏற்படவில்லை என்பதைக் குறிக்கும் நயமான மரபுத்தொடர் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵנִים
  choice: வயது முதிர்ந்து
  rationale: முதுமையை இயல்பான, கண்ணியமான நவீனத் தமிழில் தெரிவிக்கிறது; அடுத்துவரும் வயதைக் குறிக்கும் எபிரெயச் சொற்றொடருடனான மீளுரையையும் தக்கவைக்கிறது.
- source_word: בָּאִים בַּיָּמִים
  choice: பல ஆண்டுகளைக் கடந்தவர்களாக
  rationale: சொல்லுக்குச் சொல் ‘நாட்களுக்குள் வந்தவர்கள்’ என்ற எபிரெய மரபுத்தொடர் வயதில் மிகவும் முன்னேறியிருப்பதைக் குறிக்கிறது. தமிழில் புரியும்படி அதன் காலப் பயண உருவகத்தை ஓரளவு பேணுகிறது.
- source_word: חָדַל לִהְיוֹת
  choice: நின்றுபோயிருந்தது
  rationale: ஒரு வழக்கமான உடல் நிகழ்வு ஏற்கெனவே முடிவடைந்திருந்ததை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: אֹרַח כַּנָּשִׁים
  choice: பெண்களுக்குரிய வழக்கம்
  rationale: ‘பெண்களின் வழி’ என்ற எபிரெய நயவுரையின் மறைமுகத் தன்மையைப் பேணியபடி, நவீனத் தமிழில் புரிந்துகொள்ளக்கூடியதாக உள்ளது.
- source_word: לְשָׂרָה
  choice: சாராளுக்கு
  rationale: இந்நிலை சாராளைப் பொறுத்தவரை இனி இல்லை என்ற உறவைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
