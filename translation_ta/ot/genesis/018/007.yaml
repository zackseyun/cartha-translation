- from: ஆபிரகாம் மாட்டு மந்தையிடம் ஓடி, மென்மையானதும் நல்லதுமான ஒரு கன்றைத் தேர்ந்தெடுத்து, அதை அந்த இளைஞனிடம்[a] கொடுத்தான்; அவன் அதைத் தயாரிக்க விரைந்தான்.
  to: ஆபிரகாம் மாட்டு மந்தையிடம் ஓடி, மென்மையானதும் நல்லதுமான ஒரு கன்றை எடுத்து, அதை அந்த இளைஞனிடம்[a] கொடுத்தான்; அதைத் தயாரிக்க விரைந்தான்.
