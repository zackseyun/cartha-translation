  yaml_path: translation/ot/genesis/018/007.yaml
  text: And Abraham ran to the herd and took a tender and good calf and gave it to the young man[a], and he hurried to prepare it.
translation:
  language: ta
  text: ஆபிரகாம் மாட்டு மந்தையிடம் ஓடி, மென்மையானதும் நல்லதுமான ஒரு கன்றை எடுத்து, அதை அந்த இளைஞனிடம்[a] கொடுத்தான்; அதைத் தயாரிக்க விரைந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பணியாளன்’ அல்லது ‘சிறுவன்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் (הַנַּעַר), சூழலைப் பொறுத்து ஓர் இளைஞனையோ, சிறுவனையோ, பணியாளனையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּקָר
  choice: மாட்டு மந்தை
  rationale: இங்கு இந்த எபிரெயச் சொல் ஒரு தனி விலங்கை அல்ல, மாடுகளைத் தொகுப்பாகக் குறிக்கிறது. ‘மாட்டு மந்தை’ என்பது கன்றைத் தேர்ந்தெடுக்கும் காட்சியைத் தெளிவாகக் காட்டுகிறது.
- source_word: רָץ
  choice: ஓடி
  rationale: வினைச்சொல்லின் நேரடியான பொருள் ‘ஓடுதல்’; ஆபிரகாமின் விருந்தோம்பலிலுள்ள அவசரத்தையும் உயிரோட்டத்தையும் இது காக்கிறது.
- source_word: בֶּן־בָּקָר
  choice: ஒரு கன்று
  rationale: சொல்லுக்குச் சொல் ‘மாட்டின் மகன்’ என்றாலும், இது இளம் மாட்டைக் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழில் ‘கன்று’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: רַךְ וָטוֹב
  choice: மென்மையானதும் நல்லதுமான
  rationale: רַךְ என்பதன் ‘மென்மையான’ என்ற உணர்வையும், טוֹב குறிப்பிடும் நல்ல தரத்தையும் தனித்தனியாகப் பாதுகாக்கிறது.
- source_word: וַיִּקַּח
  choice: தேர்ந்தெடுத்து
  rationale: அடிப்படைப் பொருள் ‘எடுத்தான்’ என்பதாக இருந்தாலும், மந்தையிலிருந்து குறிப்பிட்ட கன்றை எடுத்துக்கொண்ட சூழலில் ‘தேர்ந்தெடுத்து’ என்பது தமிழில் செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַנַּעַר
  choice: அந்த இளைஞன்
  rationale: נַעַר என்பது சிறுவன், இளைஞன், அல்லது பணியாள் எனச் சூழலுக்கேற்ப பொருள்படலாம். முதன்மை உரையில் ‘இளைஞன்’ என்பது பணியாள் என்ற விளக்கத்தைத் தேவையின்றி புகுத்தாமல் சொற்பொருளின் பரப்பை ஓரளவு காக்கிறது.
- source_word: וַיְמַהֵר
  choice: விரைந்தான்
  rationale: செயலை உடனடியாகவும் வேகமாகவும் செய்ததைச் சுருக்கமாகவும் கண்ணியமான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: לַעֲשׂוֹת אֹתוֹ
  choice: அதைத் தயாரிக்க
  rationale: עשה பொதுவாக ‘செய்/உண்டாக்கு’ எனப் பொருள்பட்டாலும், உணவுக்கான விலங்கை ஆயத்தப்படுத்தும் இச்சூழலில் ‘தயாரிக்க’ என்பதே நோக்கத்தைத் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: וַיְמַהֵר (‘விரைந்தான்’) என்பதன் எழுவாய்
  choice: ‘அவன்’ என்ற பிரதிப்பெயரால் எழுவாயை வெளிப்படையாக அடையாளப்படுத்தாமல் வைத்தல்
  alternative: ‘அந்த இளைஞன் அதைத் தயாரிக்க விரைந்தான்’ அல்லது ‘ஆபிரகாம் அதைத் தயாரிக்க விரைந்தான்’
  rationale: எபிரெய தொடர் இலக்கண ரீதியில் ஆபிரகாமைத் தொடரலாம்; நிகழ்ச்சிச் சூழல் இளைஞன் தயாரித்ததாகவும் புரிந்துகொள்ள இடமளிக்கிறது. ‘அவன்’ இந்த இயல்பான இருபொருள் வாய்ப்பைத் தீர்மானமாக நீக்காது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதே நேரத்தில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான விரைவான செயல்களை வெளிப்படுத்த ‘ஓடி’, ‘தேர்ந்தெடுத்து’, ‘கொடுத்தான்’, ‘விரைந்தான்’ என்ற வினைத் தொடர் காக்கப்பட்டுள்ளது.
