source:
  edition: WLC
  text: וַ/יִּפְנ֤וּ מִ/שָּׁם֙ הָֽ/אֲנָשִׁ֔ים וַ/יֵּלְכ֖וּ סְדֹ֑מָ/ה וְ/אַ֨בְרָהָ֔ם עוֹדֶ֥/נּוּ עֹמֵ֖ד לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/022.yaml
  text: Then the men turned from there and went toward Sodom[a], but Abraham still stood before Yahweh.
translation:
  language: ta
  text: அப்போது அந்த மனிதர்கள் அங்கிருந்து திரும்பி, சோதோமை நோக்கிச் சென்றார்கள்.[a] ஆனால் ஆபிரகாம் இன்னும் யாவேவின் முன்னிலையில் நின்றுகொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில பழமையான சாட்சிகள், “யாவே இன்னும் ஆபிரகாமின் முன்னிலையில் நின்றுகொண்டிருந்தார்” என்று வாசிக்கின்றன. எபிரெய மசோரெட்டிக் உரையோ, “ஆபிரகாம் இன்னும் யாவேவின் முன்னிலையில் நின்றுகொண்டிருந்தார்” என்று வாசிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּפְנוּ מִשָּׁם
  choice: அங்கிருந்து திரும்பி
  rationale: פנה இங்கு திசைமாறிப் புறப்படுவதைக் குறிக்கிறது; மִשָּׁם என்பதன் இடப்பொருளையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: הָאֲנָשִׁים
  choice: அந்த மனிதர்கள்
  rationale: எபிரெய உரை இவர்களை வெளிப்படையாக ‘மனிதர்கள்’ என்றே குறிப்பிடுகிறது; அவர்களின் அடையாளத்தை விளக்கமாகச் சேர்க்காமல் கதையின் மேற்பரப்பு சொல்லாட்சியைப் பேணுகிறது.
- source_word: וַיֵּלְכוּ סְדֹמָה
  choice: சோதோமை நோக்கிச் சென்றார்கள்
  rationale: இடப்பெயருடன் சேர்ந்துள்ள திசைகாட்டும் ה, சோதோமை நோக்கிய இயக்கத்தைச் சுட்டுகிறது.
- source_word: עוֹדֶנּוּ עֹמֵד
  choice: இன்னும் ... நின்றுகொண்டிருந்தார்
  rationale: வினையெச்ச வடிவம் தொடர்ந்த நிலையைச் சுட்டுவதால், நவீன தமிழில் நீடித்த செயற்பாங்கு இயல்பாக அமைகிறது.
- source_word: לִפְנֵי
  choice: முன்னிலையில்
  rationale: இந்தச் சொல் ‘முன்பு/முன்னிலையில்’ என்ற இட மற்றும் உறவுப் பொருள்களை உடையது; இங்கு ஒருவரின் சந்நிதியில் நிற்பதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் பட்டம் அல்ல, தனிப்பெயர் உள்ளது. ஆகவே அதைப் பொதுப் பட்டமாக மாற்றாமல் தமிழில் பரவலாக அறியப்படும் பெயர்வடிவம் பயன்படுத்தப்பட்டது.
- issue: இறுதி வாக்கியத்தின் உரைப்பாடம்
  choice: ஆபிரகாம் இன்னும் யெகோவாவின் முன்னிலையில் நின்றுகொண்டிருந்தார்
  alternative: யெகோவா இன்னும் ஆபிரகாமின் முன்னிலையில் நின்றுகொண்டிருந்தார்
  rationale: வழங்கப்பட்ட WLC மசோரெட்டிக் உரை ஆபிரகாமையே எழுவாயாகக் கொண்டுள்ளது. சில பழமையான சாட்சிகளில் உள்ள மாற்று உரைப்பாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; முதன்மை உரையில் தீர்மானித்து கலக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், மரியாதைமிக்க வேதாகம நடையுடன், மூல உரையின் இயக்கமும் உரைவேறுபாடும் பேணப்பட்டுள்ளன.
