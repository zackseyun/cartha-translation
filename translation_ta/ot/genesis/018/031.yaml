  text: וַ/יֹּ֗אמֶר הִנֵּֽה נָ֤א הוֹאַ֨לְתִּי֙ לְ/דַבֵּ֣ר אֶל אֲדֹנָ֔/י אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם עֶשְׂרִ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּ/עֲב֖וּר הָֽ/עֶשְׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/031.yaml
  text: Then he said[a], “See now, I have undertaken to speak to my Lord. Perhaps twenty will be found there.” And he said[b], “I will not destroy it for the sake of the twenty.”
translation:
  language: ta
  text: பின்பு அவர், “இப்போது பாருங்கள், நான் என் ஆண்டவரிடம் பேசத் துணிந்திருக்கிறேன்[a]. ஒருவேளை அங்கே இருபது பேர் காணப்படலாம்” என்றார். அதற்கு ஆண்டவர், “அந்த இருபது பேரின் பொருட்டு நான் அதை அழிக்கமாட்டேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் ஆண்டவரிடம் பேச முனைந்திருக்கிறேன்.”
    reason: הוֹאַלְתִּי என்பது ‘துணிதல்’ அல்லது ‘முன்வந்து தொடங்குதல்’ என்ற நெருக்கமான பொருள் நிழல்களைக் கொண்டிருக்கலாம்.
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் இந்த மரியாதையான தொடர், தமிழில் அளவுக்கு மீறிய சொற்சொல் மொழிபெயர்ப்பைத் தவிர்த்து, ஆபிரகாமின் பணிவான உரைநடையோடு இயல்பாக ‘இதோ’ என வழங்கப்படுகிறது.
- source_word: הוֹאַלְתִּי
  choice: பேசத் துணிந்துவிட்டேன்
  rationale: ஆண்டவரிடம் பேசும் ஆபிரகாமின் பணிவையும், அவ்வாறு பேசத் தைரியம் கொண்டதையும் இந்தச் சொற்றொடர் வெளிப்படுத்துகிறது; வெறும் ‘தொடங்கினேன்’ என்பதைவிட சூழலுக்குப் பொருந்துகிறது.
- source_word: לְדַבֵּר אֶל אֲדֹנָי
  choice: என் ஆண்டவரிடம் பேச
  rationale: எபிரெயச் சொல்லமைப்பைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தருகிறது; ‘ஆண்டவர்’ இங்கு தெய்வீக உரையாடுபவரைக் குறிக்கும் பட்டப்பெயர்.
- source_word: אוּלַי
  choice: ஒருவேளை
  rationale: ஆபிரகாமின் தயக்கமும் மரியாதையும் கலந்த சாத்தியக் கூற்றை இயல்பாகக் காட்டுகிறது.
- source_word: יִמָּצְאוּן שָׁם עֶשְׂרִים
  choice: அங்கே இருபது பேர் காணப்படலாம்
  rationale: எபிரெய மொழியின் செயப்பாட்டு வடிவைத் தக்கவைத்து, எண்ணிக்கை மனிதர்களைக் குறிக்கிறது என்பதைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: לֹא אַשְׁחִית
  choice: நான் அதை அழிக்கமாட்டேன்
  rationale: எபிரெயத்தில் வெளிப்படையாக இல்லாத ஆனால் சூழலில் புரியும் நகரம் அல்லது இடத்தைக் குறிக்கும் செயப்படுபொருள் தமிழில் ‘அதை’ என்று வழங்கப்படுகிறது.
- source_word: בַּעֲבוּר הָעֶשְׂרִים
  choice: அந்த இருபது பேரின் பொருட்டு
  rationale: குறிப்பிட்ட அந்த இருபது பேருக்காக இடம் காப்பாற்றப்படும் என்ற பரிந்துபேசுதலின் தர்க்கத்தையும் எபிரெயத் திட்டவட்ட உருபையும் தக்கவைக்கிறது.
theological_decisions:
- issue: אֲדֹנָי என்பதன் குறிப்பு
  choice: என் ஆண்டவர்
  alternative: என் தலைவன்
  rationale: ஆதியாகமம் 18-ன் விரிந்த சூழலில் ஆபிரகாம் பேசுகிறவர் தெய்வீக உரையாடுபவர். எனினும் இவ்வசனத்தில் יהוה என்ற திருப்பெயர் வராததால், அதைச் சேர்க்காமல் பட்டப்பெயராகவே மொழிபெயர்க்கப்பட்டுள்ளது.
- issue: இரண்டாவது וַיֹּאמֶר என்பதன் பேசுபவர்
  choice: அதற்கு ஆண்டவர் … என்றார்
  alternative: அதற்கு அவர் … என்றார்
  rationale: எபிரெயத்தில் பெயர் மீண்டும் குறிப்பிடப்படாவிட்டாலும் உரையாடல் சூழலில் பதிலளிப்பவர் ஆண்டவர் என்பது தெளிவு. தமிழில் தொடர்ச்சியான இரண்டு ‘அவர்’ வடிவங்கள் குழப்பம் தருவதால் சூழல் சார்ந்த அடையாளம் வெளிப்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் கண்ணியமும் கொண்ட உரைநடை பயன்படுத்தப்பட்டுள்ளது. ஆபிரகாமின் பணிவான தயக்கமும் ஆண்டவரின் சுருக்கமான பதிலும் காக்கப்பட்டுள்ளன; பழமையான அல்லது சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
