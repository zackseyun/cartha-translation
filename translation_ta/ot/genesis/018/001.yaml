  text: וַ/יֵּרָ֤א אֵלָי/ו֙ יְהוָ֔ה בְּ/אֵלֹנֵ֖י מַמְרֵ֑א וְ/ה֛וּא יֹשֵׁ֥ב פֶּֽתַח הָ/אֹ֖הֶל כְּ/חֹ֥ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/001.yaml
  text: And Yahweh appeared to him by the oaks of Mamre[a], while he was sitting at the entrance of the tent in the heat of the day.
translation:
  language: ta
  text: யாவே மம்ரேயின் பெரிய மரங்களருகே[a] அவனுக்குத் தோன்றினார்; அவன் பகலின் வெப்பத்தில் கூடாரத்தின் வாசலில் உட்கார்ந்திருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மம்ரேயின் கருவாலி மரங்களருகே” அல்லது “மம்ரேயின் டெரிபிந்த் மரங்களருகே.” இங்குள்ள எபிரெயச் சொல் கருவாலி அல்லது டெரிபிந்த் போன்ற பெரிய மரங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: தோன்றினார்
  rationale: נפעל வடிவம் இங்கு கண்களுக்குப் புலப்படும் தோற்றத்தைச் சுட்டுகிறது; விளக்கத்தைச் சேர்க்காமல் எபிரெயச் சொல்லின் நேரடியான பொருளைத் தக்கவைக்கிறது.
- source_word: אֵלָיו
  choice: அவனுக்கு
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட ஆபிரகாமைச் சுட்டும் மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டை நேரடியாக வழங்குகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயராகிய நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு வடிவில் வழங்குகிறது.
- source_word: בְּאֵלֹנֵי
  choice: பெரிய மரங்களருகே
  rationale: אֵלוֹן என்பது கருவாலி அல்லது டெரிபிந்த் போன்ற பெரிய மரங்களைக் குறிக்கலாம். மரவகை உறுதியில்லாததால் பொதுவான சொல்லை முதன்மை உரையில் வைத்து, மாற்றுகளை அடிக்குறிப்பில் தருகிறது.
- source_word: מַמְרֵא
  choice: மம்ரே
  rationale: இடப்பெயர் தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: וְהוּא יֹשֵׁב
  choice: அப்போது அவன் ... உட்கார்ந்திருந்தான்
  rationale: எபிரெயப் பெயரெச்சத் தொடர் நிகழ்வின் பின்னணிச் சூழலைக் காட்டுவதால், தமிழில் இயல்பான தொடர்நிலை வினையாக வழங்கப்படுகிறது.
- source_word: פֶּתַח הָאֹהֶל
  choice: கூடாரத்தின் வாசலில்
  rationale: פֶּתַח என்பதன் திறப்பு அல்லது நுழைவிடம் என்ற தெளிவான பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כְּחֹם הַיּוֹם
  choice: பகலின் வெப்பவேளையில்
  rationale: நாளின் வெப்பமான நேரத்தைக் குறிக்கிறது; குறிப்பாக நண்பகல் என்று உரையில் இல்லாத நேரத்தை நிர்ணயிக்காமல் பொருளைக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: எபிரெய உரை தெய்வீகப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. பட்டமாகிய ‘கர்த்தர்’ என்று மாற்றாமல் தனிப்பெயராகவே வழங்கப்பட்டுள்ளது; ‘யாவே’ என்பது மூல உச்சரிப்பை மீட்டுருவாக்கும் மாற்று ஒலிபெயர்ப்பு.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மரவகை குறித்த மூலமொழியின் தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
