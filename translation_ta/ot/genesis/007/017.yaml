  yaml_path: translation/ot/genesis/007/017.yaml
  text: And the flood was on the earth forty days[a], and the waters increased and lifted up the ark, so that it rose above the earth.
translation:
  language: ta
  text: வெள்ளம் பூமியின்மேல் நாற்பது நாட்கள் நீடித்தது; தண்ணீர் பெருகிப் பேழையை உயர்த்தியது; அது பூமிக்கு மேலாக எழும்பியது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: நீடித்தது
  rationale: கால அளவைக் குறிக்கும் ‘நாற்பது நாட்கள்’ என்பதோடு வரும் இவ்வினை, வெள்ளம் அந்தக் காலம் முழுவதும் இருந்ததைக் குறிக்கிறது; தமிழில் ‘நீடித்தது’ இயல்பாக அந்த நீடிப்பை வெளிப்படுத்துகிறது.
- source_word: הַמַּבּוּל
  choice: வெள்ளம்
  rationale: நோவாவின் காலப் பெருவெள்ளத்தைக் குறிக்கும் சூழலில் தெளிவான, வழக்கமான தமிழ் சொல்.
- source_word: אַרְבָּעִים יוֹם
  choice: நாற்பது நாட்கள்
  rationale: எபிரெய உரையின் கால அளவை நேரடியாகக் காட்டுகிறது; ‘நீடித்தது’ என்பதால் தமிழில் தனியாக ‘நாட்களுக்கு’ என்று மாற்றத் தேவையில்லை.
- source_word: עַל הָאָרֶץ
  choice: பூமியின்மேல்
  rationale: இந்த வெள்ளச் சூழலில் אֶרֶץ என்பதற்கு விரிந்த பொருளான ‘பூமி’ பொருத்தமானது; עַל என்பதன் உறவை ‘மேல்’ வெளிப்படுத்துகிறது.
- source_word: וַיִּרְבּוּ הַמַּיִם
  choice: தண்ணீர் பெருகி
  rationale: רבה இங்கு தண்ணீரின் அளவும் பரப்பும் அதிகரித்ததைக் குறிக்கிறது; ‘பெருகி’ இயல்பான தமிழாக்கம்.
- source_word: וַיִּשְׂאוּ אֶת הַתֵּבָה
  choice: பேழையை உயர்த்தியது
  rationale: தண்ணீர் பேழையை நிலத்திலிருந்து மேலெழச் செய்த செயலின் திசையையும் விளைவையும் தெளிவாகக் காட்டுகிறது.
- source_word: הַתֵּבָה
  choice: பேழை
  rationale: நோவாவின் கப்பல் போன்ற பாதுகாப்புக் கலத்தைக் குறிக்கத் தமிழ் வேதாகம வழக்கில் நிலைபெற்ற, சூழலுக்குத் துல்லியமான சொல்.
- source_word: וַתָּרָם
  choice: அது எழும்பியது
  rationale: பெண்பால் ஒருமை வடிவம் பேழையைக் குறிக்கிறது; தண்ணீர் உயர்த்தியதன் விளைவாகப் பேழை மேலெழுந்ததை இயல்பாகத் தெரிவிக்கிறது.
- source_word: מֵעַל הָאָרֶץ
  choice: பூமிக்கு மேலாக
  rationale: பூமியின் மேற்பரப்பிலிருந்து விலகி உயர்ந்த நிலையைத் தெரிவிக்கிறது; ‘மேலாக’ என்பது מֵעַל குறிக்கும் உயர்ந்த இட உறவைப் பாதுகாக்கிறது.
