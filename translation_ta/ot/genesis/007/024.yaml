  yaml_path: translation/ot/genesis/007/024.yaml
  text: And the waters prevailed over the earth for 150 days[a].
translation:
  language: ta
  text: தண்ணீர் பூமியின்மேல் நூற்று ஐம்பது நாட்கள் மேலோங்கியிருந்தது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பூமியின்மேல்’ என்பதற்குப் பதிலாக ‘நிலத்தின்மேல்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய אֶרֶץ என்ற சொல் சூழலைப் பொறுத்து இவ்விரு பொருள்களையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: வலிமையுடன் மேலோங்கி நின்றது
  rationale: גבר என்பதன் Qal வடிவம் தண்ணீர் வலுப்பெற்று மேலாதிக்கம் கொண்டிருந்ததைச் சுட்டுகிறது. தமிழில் ‘வலிமையுடன் மேலோங்கி நின்றது’ என்பது வெறும் அளவு அதிகரிப்பை மட்டும் அல்லாமல், அதன் ஓங்கிய ஆதிக்கத்தையும் காலநீடிப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמַּיִם
  choice: தண்ணீர்
  rationale: எபிரெயத்தில் இது வடிவியல் ரீதியாகப் பன்மைச் சொல். ஆனால் இச்சூழலில் நவீனத் தமிழின் இயல்பான கூட்டு/திரள்பொருள் பயன்பாடு ‘தண்ணீர்’; அதனால் ஒருமை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַל הָאָרֶץ
  choice: பூமியின்மேல்
  rationale: עַל என்பதற்கு ‘மேல்’ என்றும், אֶרֶץ என்பதற்கு சூழலைப் பொறுத்து ‘பூமி’ அல்லது ‘நிலம்’ என்றும் பொருள் கொள்ளலாம். பெருவெள்ளக் கதையின் விரிந்த இலக்கியச் சூழலுக்கு ‘பூமி’ பொருத்தமாக உள்ளது.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: நூற்று ஐம்பது நாட்கள்
  rationale: எபிரெய எண்ணிக்கைச் சொற்றொடர் சொற்சொல்லாக ‘ஐம்பதும் நூறும் நாள்’ என்ற வரிசையில் இருந்தாலும், தமிழில் இயல்பாக ‘நூற்று ஐம்பது நாட்கள்’ என வழங்கப்படுகிறது; வேற்றுமை உருபின்றியே காலநீடிப்பு தெளிவாகிறது.
theological_decisions:
- issue: பெருவெள்ளக் கதையில் אֶרֶץ என்பதன் பரப்பு
  choice: பூமி
  alternative: நிலம்
  rationale: உடனடியான கதைச்சூழல் பெருவெள்ளத்தை விரிந்த, உலகளாவிய சொற்களில் விவரிப்பதால் ‘பூமி’ முதன்மை வாசிப்பாகத் தேர்ந்தெடுக்கப்பட்டது. எனினும் אֶרֶץ என்பதற்கு ‘நிலம்’ என்ற பொருளும் உண்மையான மொழியியல் சாத்தியமாக இருப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வலிமையுடன் மேலோங்கி நின்றது’ என்பது மூல வினையின் வலிமை மற்றும் நீடித்த ஆதிக்கம் ஆகிய இரண்டையும் காக்கிறது.
