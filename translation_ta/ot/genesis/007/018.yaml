translation:
  language: ta
  text: தண்ணீர் வலுப்பெற்று, பூமியின்மேல் மிகவும் பெருகியது; பேழை தண்ணீரின் மேற்பரப்பில் நகர்ந்துசென்றது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: வலுப்பெற்று
  rationale: גבר என்பதன் அடிப்படைப் பொருளான ‘வலிமை பெறுதல்’ என்பதை இயல்பான தமிழில் தருகிறது; வெறும் நீர்மட்ட உயர்வை மட்டும் குறிக்காமல், வெள்ளநீரின் மேலோங்கும் வலிமையையும் காக்கிறது.
- source_word: הַמַּיִם
  choice: தண்ணீர்
  rationale: எபிரேயத்தில் வடிவம் பன்மையாக இருந்தாலும், இச்சூழலில் நவீனத் தமிழில் ‘தண்ணீர்’ என்பது இயல்பான தொகுதிப்பெயர்.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: மிகவும் பெருகியது
  rationale: רבה உடன் வரும் מְאֹד தரும் தீவிரமான அதிகரிப்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: עַל הָאָרֶץ
  choice: பூமியின்மேல்
  rationale: אֶרֶץ என்பதற்கு ‘நிலம்’ அல்லது ‘பூமி’ என்ற இரு சாத்தியங்களும் உள்ளன; வெள்ளக் கதையின் விரிந்த சூழலில் ‘பூமி’ பொருத்தமானது, ஆனால் சொல்லின் பரப்பைத் தாண்டி கூடுதல் விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: וַתֵּלֶךְ
  choice: மிதந்து சென்றது
  rationale: சொற்பொருளில் ‘சென்றது’; தண்ணீரின் மேற்பரப்பில் பேழை நகர்வதை நவீனத் தமிழில் இயல்பாகச் சொல்ல ‘மிதந்து சென்றது’ பொருத்தமான சூழல்சார் இணையாகும்.
- source_word: הַתֵּבָה
  choice: பேழை
  rationale: நோவாவின் תֵּבָה என்பதற்கான நிலைபெற்ற, மரியாதைமிக்க தமிழ் வேதாகமச் சொல்.
- source_word: עַל פְּנֵי הַמָּיִם
  choice: தண்ணீரின் மேற்பரப்பில்
  rationale: ‘தண்ணீரின் முகத்தின்மேல்’ என்ற எபிரேய மரபுத்தொடரின் இயல்பான நவீனத் தமிழ் பொருளைத் தருகிறது.
