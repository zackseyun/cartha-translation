  verdict: revise
  source_fidelity: காலக்குறிப்பு, தேதியின் வலியுறுத்தல், ‘மாபெரும் ஆழம்,’ மற்றும் வானியல் உருவகம் ஆகியவை எபிரேய மூலத்துக்கு உண்மையாக உள்ளன. ஆனால் נִבְקְעוּ என்பதற்கு ‘பிளந்து திறந்தன’ என்பது ‘திறத்தல்’ என்ற தேவையற்ற கூடுதல் செயலைச் சேர்க்கிறது; ‘பிளந்தன’ என்பது மூல வினையின் பேரழிவான பிளவுறுதலை நேரடியாகக் காட்டுகிறது.
  naturalness: உரை பொதுவாக நவீன நிலையான தமிழில் தெளிவாக உள்ளது. கோடுகளுக்குள் மீண்டும் வரும் ‘அதே நாளில்’ என்பதற்குப் பதிலாக காற்புள்ளிகளுடன் தொடர்வது வாசிப்பில் இயல்பாகும்.
  terminology: ‘நோவா,’ ‘மாபெரும் ஆழம்,’ ‘ஊற்றுகள்,’ ‘வானங்களின் சாளரங்கள்’ ஆகியவை பொருத்தமானவை. ‘மதகுகள்’ என்பது சாளரங்கள் என்ற உருவகத்துக்கு ஒரு செல்லத்தக்க மாற்றுச் சொல். ஆங்கில audit trail-இல் [a] குறி ‘நோவாவின் வாழ்வு’ என்பதற்குப் பின்னர் இருப்பினும், அதன் குறிப்பு ‘great deep’-இன் ஊற்றுகளைப் பற்றியது; இது ஆங்கிலத்தில் anchor பொருத்தமின்மையாகத் தோன்றுகிறது. தமிழில் குறிகள் தொடர்புடைய சொற்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
