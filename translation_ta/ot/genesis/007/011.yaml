  text: בִּ/שְׁנַ֨ת שֵׁשׁ מֵא֤וֹת שָׁנָה֙ לְ/חַיֵּי נֹ֔חַ בַּ/חֹ֨דֶשׁ֙ הַ/שֵּׁנִ֔י בְּ/שִׁבְעָֽה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ בַּ/יּ֣וֹם הַ/זֶּ֗ה נִבְקְעוּ֙ כָּֽל מַעְיְנֹת֙ תְּה֣וֹם רַבָּ֔ה וַ/אֲרֻבֹּ֥ת הַ/שָּׁמַ֖יִם נִפְתָּֽחוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/011.yaml
  text: In the six hundredth year of Noah’s life[a], in the second month, on the seventeenth day of the month, on that day all the springs of the great deep burst open[b], and the windows of the heavens were opened.
translation:
  language: ta
  text: நோவாவின் வாழ்நாளின் அறுநூறாம் ஆண்டில், இரண்டாம் மாதம், அந்த மாதத்தின் பதினேழாம் நாளில், அதே நாளில், மாபெரும் ஆழத்தின் ஊற்றுகள் அனைத்தும் பிளந்தன[a]; வானங்களின் சாளரங்கள் திறக்கப்பட்டன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மாபெரும் ஆழத்தின் நீரூற்றுகள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வானங்களின் மதகுகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שֵׁשׁ מֵאוֹת שָׁנָה לְחַיֵּי נֹחַ
  choice: நோவாவின் வாழ்நாளின் அறுநூறாம் ஆண்டில்
  rationale: எபிரேய காலக்குறிப்பு நோவாவின் வாழ்நாளை அடிப்படையாகக் கொண்டு ஆண்டைக் குறிப்பிடுகிறது; தமிழில் இயல்பாகவும் துல்லியமாகவும் அமையும் வடிவம்.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: இரண்டாம் மாதம்
  rationale: மாதத்தின் வரிசையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: அந்த மாதத்தின் பதினேழாம் நாளில்
  rationale: எபிரேய மொழியின் எண்ணிக்கை அமைப்பு தேதியைக் குறிக்கும் வரிசை எண்ணாகச் செயல்படுவதால், தமிழில் ‘பதினேழாம் நாள்’ என்று வழங்கப்பட்டது.
- source_word: בַּיּוֹם הַזֶּה
  choice: அதே நாளில்
  rationale: முன்பு குறிப்பிடப்பட்ட குறிப்பிட்ட நாளை வலியுறுத்தும் எபிரேய தொடரை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: נִבְקְעוּ
  choice: பிளந்து திறந்தன
  rationale: בקע வேரின் நிஃபால் வடிவம் பிளக்கப்படுதல் அல்லது பிளந்து திறத்தலைக் குறிக்கிறது; பேரழிவின் தீவிரத்தையும் வினையின் வடிவத்தையும் இது காக்கிறது.
- source_word: כָּל מַעְיְנֹת תְּהוֹם רַבָּה
  choice: மாபெரும் ஆழத்தின் ஊற்றுகள் அனைத்தும்
  rationale: מַעְיָן என்பதற்கு ‘ஊற்று’ இயல்பான பொருள்; תְּהוֹם רַבָּה என்பதிலுள்ள ஆதிகால ஆழ்நீர் உருவகத்தை ‘மாபெரும் ஆழம்’ பாதுகாக்கிறது.
- source_word: וַאֲרֻבֹּת הַשָּׁמַיִם
  choice: வானங்களின் சாளரங்கள்
  rationale: אֲרֻבּוֹת என்பதன் சாளரம் அல்லது திறப்பு என்ற உருவகத்தையும், שָׁמַיִם என்பதன் பன்மை வடிவத்தையும் மொழிபெயர்ப்பு காக்கிறது.
- source_word: נִפְתָּחוּ
  choice: திறக்கப்பட்டன
  rationale: நிஃபால் வடிவத்தின் செயப்பாட்டு நுணுக்கத்தை நேரடியாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: வெள்ளநீரைப் பற்றிய அண்டவியல் உருவகம்
  choice: ‘மாபெரும் ஆழம்’, ‘வானங்களின் சாளரங்கள்’ என்ற மூல உருவகங்கள் அப்படியே தக்கவைக்கப்பட்டன.
  alternative: ‘நிலத்தடி நீர் பீறிட்டது’, ‘வானத்தின் மதகுகள் திறந்தன’ போன்ற நவீன விளக்கமுறை மொழிபெயர்ப்பு.
  rationale: வசனத்தின் பழங்கால அண்டவியல் மொழி கதையாடலின் வலிமைக்கு முக்கியமானது. அதை நவீன அறிவியல் விளக்கமாக மாற்றாமல், மூலத்தில் உள்ள பொருள் நெருக்கடியையும் காட்சியுருவத்தையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் காலக்குறிப்பு வரிசையும் இணையான பேரழிவுக் காட்சிகளும் காக்கப்பட்டுள்ளன; நீண்ட வாக்கியத்தின் பகுதிகளைத் தெளிவுபடுத்த கோடுகளும் அரைப்புள்ளியும் பயன்படுத்தப்பட்டுள்ளன.
