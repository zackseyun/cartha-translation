- from: அப்போது யாவே நோவாவிடம், “நீயும் உன் வீட்டார் அனைவரும் பேழைக்குள் வாருங்கள்; ஏனெனில், இந்தத் தலைமுறையில் நீ என் முன்னிலையில் நீதிமானாக இருப்பதை நான் கண்டேன்” என்றார்.
  to: அப்போது யாவே நோவாவிடம், “நீ உன் வீட்டார் அனைவரோடும் பேழைக்குள் வா; ஏனெனில், இந்தத் தலைமுறையில் என் முன்னிலையில் உன்னை நீதிமானாகக் கண்டேன்” என்றார்.
  rationale: The revision retains the source’s singular address to Noah while explicitly including his entire household, and it renders God’s completed assessment with a direct Tamil equivalent. No disputed reading, theological inference, or additional detail has been introduced.
