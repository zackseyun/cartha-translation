id: GEN.7.1
reference: Genesis 7:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ לְ/נֹ֔חַ בֹּֽא אַתָּ֥ה וְ/כָל בֵּיתְ/ךָ֖ אֶל הַ/תֵּבָ֑ה כִּֽי אֹתְ/ךָ֥ רָאִ֛יתִי צַדִּ֥יק לְ/פָנַ֖/י בַּ/דּ֥וֹר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/001.yaml
  text: Then Yahweh said to Noah, “Enter the ark, you and all your household, because I have seen that you are righteous before me in this generation.”
translation:
  language: ta
  text: அப்போது யாவே நோவாவிடம், “நீ உன் வீட்டார் அனைவரோடும் பேழைக்குள் வா; ஏனெனில், இந்தத் தலைமுறையில் என் முன்னிலையில் உன்னை நீதிமானாகக் கண்டேன்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர் வடிவத்தின் கதை முன்னேற்றத்தை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: בֹּא
  choice: பேழைக்குள் வாருங்கள்
  rationale: எபிரெய கட்டளை வடிவின் அடிப்படைப் பொருள் ‘வா/உள்ளே வா’; நோவாவுடன் அவரது வீட்டாரும் இணைக்கப்பட்டிருப்பதால் மரியாதைப் பன்மை தமிழில் இயல்பாக அமைகிறது.
- source_word: בֵּיתְךָ
  choice: உன் வீட்டார் அனைவரும்
  rationale: இங்கு ‘வீடு’ என்பது கட்டடத்தை அல்ல, நோவாவின் குடும்பத்தையும் குடும்ப அலகையும் குறிக்கிறது.
- source_word: הַתֵּבָה
  choice: பேழை
  rationale: நோவாவின் תֵּבָה என்பதற்கான நிலைபெற்ற தமிழ் வேதாகமச் சொல்; பெட்டி போன்ற கப்பல் வடிவ அமைப்பையும் மரபான அடையாளத்தையும் தக்கவைக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் காரண இடைச்சொல்லின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: רָאִיתִי
  choice: நான் கண்டேன்
  rationale: எபிரெய நிறைவேற்ற வடிவை நேரடியாகப் பிரதிபலித்து, கடவுளின் ஏற்கெனவே செய்யப்பட்ட மதிப்பீட்டை வெளிப்படுத்துகிறது.
- source_word: צַדִּיק
  choice: நீதிமான்
  rationale: צַדִּיק என்பதன் வழக்கமான வேதாகமத் தமிழ் இணை; ஒழுக்க மற்றும் உறவுசார் நீதியின் இறையியல் எடையைப் பாதுகாக்கிறது.
- source_word: לְפָנַי
  choice: என் முன்னிலையில்
  rationale: ‘என் முகத்திற்கு முன்’ என்ற எபிரெய மரபுத்தொடரின் மதிப்பீட்டு/சன்னிதி சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בַּדּוֹר הַזֶּה
  choice: இந்தத் தலைமுறையில்
  rationale: நோவாவின் சமகாலத்தவர்களைக் குறிக்கும் דּוֹר என்பதற்கு நேரான, இயல்பான மொழிபெயர்ப்பு.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: நோவாவின் நீதிமானான நிலை
  choice: நீ என் முன்னிலையில் நீதிமானாக இருப்பதை நான் கண்டேன்
  alternative: நீ ஒருவனே என் முன்னிலையில் நீதிமான் / நான் உன்னை நீதிமானாகக் கருதினேன்
  rationale: மூலம் நோவாவைப் பற்றிய கடவுளின் மதிப்பீட்டைச் சொல்கிறது; ‘ஒருவனே’ என்பதைச் சேர்க்கவோ, அந்த நீதியின் அடிப்படையை விளக்கவோ இல்லை. ஆகவே இறையியல் பதற்றம் தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. ‘வீட்டார்’ குடும்ப அலகை இயல்பாகக் குறிக்கிறது. ‘நீதிமான்’ மற்றும் ‘பேழை’ ஆகியவை நிலைபெற்ற வேதாகமச் சொற்களாகத் தக்கவைக்கப்பட்டுள்ளன.
