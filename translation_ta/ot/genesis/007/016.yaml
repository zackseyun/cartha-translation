base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/016.yaml
  text: And those that entered[a], male and female from all flesh, as God had commanded him[c][b]; and Yahweh shut him in.
translation:
  language: ta
  text: உள்ளே வந்தவை[a], எல்லா உயிரினங்களிலிருந்தும்[b] ஆணும் பெண்ணுமாக, கடவுள் அவனுக்குக் கட்டளையிட்டபடியே வந்தன; யாவே அவனை உள்ளே அடைத்தார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உள்ளே வந்துகொண்டிருந்தவை’ அல்லது ‘உள்ளே நுழைந்தவை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொற்சொல்லாக, ‘எல்லா மாம்சத்திலிருந்தும்’; இது இங்கு உயிரினங்களைக் கூட்டாகக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: ‘யாவே அவனுக்குப் பின்னால் மூடினார்’ என்றும் மொழிபெயர்க்கலாம். எதை மூடினார் என்று எபிரெயம் வெளிப்படையாகக் கூறவில்லை; சூழலில் பேழையின் கதவு அல்லது நுழைவாயில் உட்பொருளாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּאִים ... בָּאוּ
  choice: உள்ளே வந்தவை ... வந்தன
  rationale: எபிரெயத்தில் பெயர்ச்சொல்லாகச் செயல்படும் பங்கேற்பு வடிவமும் பின்னர் வரும் முற்றுவினையும் தனித்தனியாக உள்ளன. தமிழிலும் ‘வந்தவை ... வந்தன’ என்று மீளுரைப்பதன் மூலம் அந்த அமைப்பு காக்கப்படுகிறது; பேழைக்குள் நுழைந்ததைச் சூழல் தெளிவாக்குவதால் முதலில் ‘உள்ளே’ சேர்க்கப்பட்டுள்ளது.
- source_word: זָכָר וּנְקֵבָה
  choice: ஆணும் பெண்ணுமாக
  rationale: உயிரினங்களின் பாலின வேறுபாட்டைக் குறிக்கும் வழக்கமான இணைச்சொல்; நவீனத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: מִכָּל בָּשָׂר
  choice: எல்லா உயிரினங்களிலிருந்தும்
  rationale: ‘எல்லா மாம்சத்திலிருந்தும்’ என்பது சொற்சொல் வடிவம்; இங்கு בָּשָׂר உயிருள்ள படைப்புகளைத் தொகுப்பாகக் குறிப்பதால், தமிழில் பொருள் தெளிவாக ‘எல்லா உயிரினங்களிலிருந்தும்’ என வழங்கப்பட்டுள்ளது. ‘இலிருந்து’ என்பது מִן முன்னிடைச்சொல்லின் வலுவைக் காக்கிறது.
- source_word: כַּאֲשֶׁר צִוָּה אֹתוֹ אֱלֹהִים
  choice: கடவுள் அவனுக்குக் கட்டளையிட்டபடியே
  rationale: கடவுளின் முந்தைய கட்டளைக்கு ஏற்ப நுழைவு நிகழ்ந்தது என்ற முறை/ஒப்புமையை ‘படியே’ இயல்பாக வெளிப்படுத்துகிறது. ஆங்கில கால அமைப்பை நகலெடுக்காமல் எபிரெயக் கதைத் தொடரைத் தமிழில் தருகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: பொதுவான தெய்வீகப் பட்டத்திற்கான இயல்பான நவீனத் தமிழ் இணை.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיִּסְגֹּר יְהוָה בַּעֲדוֹ
  choice: யாவே அவனை உள்ளே வைத்து அடைத்தார்
  rationale: எபிரெயம் கதவு என்ற செயப்படுபொருளை வெளிப்படையாகக் கூறவில்லை. ‘அவனை உள்ளே வைத்து அடைத்தார்’ என்பது நோவா பாதுகாப்பாக உள்ளே அடைக்கப்பட்ட உணர்வைத் தருகிறது; ‘கதவை’ என மூலத்தில் இல்லாத சொல்லை முதன்மை உரையில் சேர்ப்பதில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரான நான்கு எழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது உரையின் பெயர்/பட்ட வேறுபாட்டைக் காக்கிறது; ‘யாவே’ என்பது சாத்தியமான உச்சரிப்பை பிரதிபலிக்கிறது.
- issue: בַּעֲדוֹ என்பதில் கதவு வெளிப்படையாக உள்ளதா
  choice: கதவு என்ற சொல்லை முதன்மை உரையில் சேர்க்காமல் ‘அவனை உள்ளே வைத்து அடைத்தார்’
  alternative: யாவே அவனுக்குப் பின்னால் கதவை மூடினார்
  rationale: சூழலில் பேழையின் நுழைவாயில் அல்லது கதவு உட்பொருளாக இருக்கலாம்; ஆனால் எபிரெயம் அதை வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே அந்த உட்பொருள் அடிக்குறிப்பில் மட்டும் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதைநடைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. விலங்குகளைச் சுட்டுவதால் ‘வந்தன/அவை’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மீளுரை, ‘எல்லா மாம்சம்’ என்ற தொகுப்புப் பயன்பாடு, கதவு குறிப்பிடப்படாத தன்மை ஆகியவை உரையிலும் அடிக்குறிப்புகளிலும் பாதுகாக்கப்பட்டுள்ளன.
