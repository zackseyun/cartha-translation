  language: ta
  text: நாற்பது பகலும் நாற்பது இரவும் பூமியின்மேல் மழை பெய்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי הַגֶּשֶׁם
  choice: மழை பெய்தது
  rationale: எபிரேய மொழியில் சொற்பொருளாக ‘மழை இருந்தது/நிகழ்ந்தது’ என்ற அமைப்பு வந்தாலும், மழையைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வழக்கு ‘மழை பெய்தது’ என்பதாகும்; ஆங்கில ஆலோசனை அடுக்கின் ‘fell’ என்பதற்கும் இது பொருந்துகிறது.
- source_word: עַל הָאָרֶץ
  choice: பூமியின்மேல்
  rationale: வெள்ளக் கதையின் பரந்த சூழலில் הָאָרֶץ என்பதன் ‘பூமி/நிலம்’ என்ற பொருள் வரம்பைத் தேவையின்றி குறுக்காமல் ‘பூமி’ என வழங்கப்பட்டுள்ளது.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: நாற்பது பகலும் நாற்பது இரவும்
  rationale: கால அளவையும் பகல்–இரவு இணைப்பையும் தெளிவாகவும் இயல்பாகவும் தக்கவைக்கிறது.
