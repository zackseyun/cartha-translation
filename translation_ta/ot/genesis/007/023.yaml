  text: וַ/יִּ֜מַח אֶֽת כָּל הַ/יְק֣וּם אֲשֶׁ֣ר עַל פְּנֵ֣י הָֽ/אֲדָמָ֗ה מֵ/אָדָ֤ם עַד בְּהֵמָה֙ עַד רֶ֨מֶשׂ֙ וְ/עַד ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יִּמָּח֖וּ מִן הָ/אָ֑רֶץ וַ/יִשָּׁ֧אֶר אַךְ נֹ֛חַ וַֽ/אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָֽה־־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/023.yaml
  text: He blotted out every living thing that was on the face of the ground[a], from man to livestock to creeping things and to the birds of the heavens. They were blotted out from the earth, and only Noah was left[c][b], and those who were with him in the ark.
translation:
  language: ta
  text: அவர் நிலத்தின் மேற்பரப்பில் இருந்த உயிருள்ள ஒவ்வொன்றையும்—மனிதர் முதல் கால்நடைகள், ஊர்ந்து செல்லும் உயிரினங்கள், வானத்துப் பறவைகள்[c] வரை—துடைத்து அழித்தார்[a][b]. அவை பூமியிலிருந்து துடைத்து அழிக்கப்பட்டன. நோவா மட்டுமே மீந்திருந்தார்; அவருடன் பேழையில் இருந்தவையும் மீந்திருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘துடைத்து அழித்தார்’ என்பதற்கு ‘துடைத்து அகற்றினார்’ என்றும் மொழிபெயர்க்கலாம்; எபிரேய வினைச்சொல் துடைத்து நீக்குதல் அல்லது அழித்தொழித்தல் என்ற உருவகத்தைக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘மனிதர்’ என்பது இங்கு மனிதகுலத்தைப் பிரதிநிதித்துவமாகக் குறிக்கிறது; ‘மனிதகுலம் முதல்’ என்பதும் சாத்தியம்.
    reason: lexical_alternative
  - marker: c
    text: ‘வானத்தின் பறவைகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמַח / וַיִּמָּחוּ
  choice: துடைத்தழித்தார் / துடைத்தழிக்கப்பட்டன
  rationale: מחה என்பதிலுள்ள துடைத்து அகற்றுதல் அல்லது அழித்தொழித்தல் என்ற உருவகத்தை இயல்பான தமிழில் காக்கிறது; இரண்டாவது வடிவத்தின் செயப்பாட்டு அமைப்பும் பிரதிபலிக்கப்படுகிறது.
- source_word: כָּל הַיְקוּם
  choice: உயிருள்ள அனைத்தையும்
  rationale: வெள்ளச் சூழலில் இச்சொல் அரூபமான ‘இருப்பு’ என்பதைவிட நிலத்தில் வாழும் உயிரினங்களைக் குறிக்கிறது.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: நிலத்தின் மேற்பரப்பில்
  rationale: எபிரேய மொழியின் ‘நிலத்தின் முகத்தின்மேல்’ என்ற உருவகத்தைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: מֵאָדָם
  choice: மனிதர் முதல்
  rationale: אָדָם இங்கு மனிதகுலத்தைப் பிரதிநிதித்துவமாகக் குறிக்கிறது; பட்டியலின் தொடக்கத்தை ‘முதல்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּהֵמָה
  choice: கால்நடைகள்
  rationale: வீட்டு அல்லது வளர்ப்பு நிலவிலங்குகளைக் குறிக்கும் தெளிவான பொதுத் தமிழ் சொல்.
- source_word: רֶמֶשׂ
  choice: ஊர்ந்து செல்லும் உயிரினங்கள்
  rationale: தரைக்கு அருகில் நகரும் சிறு உயிரினங்கள் என்ற பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: עוֹף הַשָּׁמַיִם
  choice: வானத்துப் பறவைகள்
  rationale: எபிரேய மரபுத்தொடரை இயல்பான, இலக்கிய நயமுள்ள தமிழில் வழங்குகிறது.
- source_word: מִן הָאָרֶץ
  choice: பூமியிலிருந்து
  rationale: வெள்ளக் கதையின் விரிந்த கதைச்சூழலில் אֶרֶץ என்பதற்கு ‘பூமி’ பொருத்தமானது; வசனத்தின் கூற்றை மேலும் விரிவாக்காமல் காக்கிறது.
- source_word: וַיִּשָּׁאֶר אַךְ נֹחַ
  choice: நோவா ... மட்டுமே மீந்தார்கள்
  rationale: אַךְ என்பதன் கட்டுப்படுத்தும் ‘மட்டுமே’ பொருளையும் שׁאר என்பதன் ‘மீதமிருத்தல்’ பொருளையும் காக்கிறது; தொடரும் கூட்டெழுவாயுடன் தமிழ் வினை பன்மையில் அமைக்கப்பட்டுள்ளது.
- source_word: וַאֲשֶׁר אִתּוֹ בַּתֵּבָה
  choice: அவருடன் பேழையில் இருந்தவர்கள்
  rationale: நோவாவுடன் இருந்த மனிதர்களைக் குறிக்கும் சார்புத் தொடரை இயல்பாக வழங்குகிறது; תֵּבָה என்பதற்கு நோவா வரலாற்றில் மரபாகவும் தெளிவாகவும் உள்ள ‘பேழை’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: வெள்ள அழிவின் பரப்பு
  choice: வசனம் குறிப்பிடும் நிலவாழ் உயிரினங்களும் அவை பூமியிலிருந்து துடைத்தழிக்கப்பட்டதும் நேரடியாக மொழிபெயர்க்கப்படுகிறது.
  alternative: இதை மண்டல அளவிலான மிகைப்படுத்தலாகவோ, வெளிப்படையான உலகளாவிய அறிவியல் கூற்றாகவோ விளக்குதல்.
  rationale: எபிரேய உரையின் கதை வலிமையைக் குறைக்காமலும் அதன் சொற்களைத் தாண்டி விரிவாக்காமலும் வைத்து, வெள்ளத்தின் பரப்பைப் பற்றிய விளக்க முடிவை வாசகரிடம் விடுகிறது.
- issue: ‘நோவா மட்டுமே’ என்பதற்கும் அவருடன் இருந்தவர்களுக்கும் இடையிலான உறவு
  choice: ‘நோவாவும், அவருடன் ... இருந்தவர்களும் மட்டுமே’ என்று ஒருங்கிணைத்து வழங்கப்படுகிறது.
  alternative: ‘நோவா மட்டுமே மீந்தார்; அவருடன் இருந்தவர்களும்...’ என்று சொற்சொல்லாகப் பிரித்தல்.
  rationale: אַךְ נֹחַ என்ற வலியுறுத்தலைக் காக்கும் போதும், அடுத்த இணைப்புத் தொடர் நோவாவுடன் இருந்தவர்களையும் மீந்த குழுவில் சேர்ப்பதைத் தமிழில் முரண்பாடின்றித் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘துடைத்தழித்தார்’ எபிரேய உருவகத்தை காக்கிறது; ‘பேழை’ ஆதியாகமச் சூழலுக்குரிய மரபான சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
