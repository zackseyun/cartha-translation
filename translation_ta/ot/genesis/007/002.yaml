  edition: WLC
  text: מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה תִּֽקַּח לְ/ךָ֛ שִׁבְעָ֥ה שִׁבְעָ֖ה אִ֣ישׁ וְ/אִשְׁתּ֑/וֹ וּ/מִן הַ/בְּהֵמָ֡ה אֲ֠שֶׁר לֹ֣א טְהֹרָ֥ה הִ֛וא שְׁנַ֖יִם אִ֥ישׁ וְ/אִשְׁתּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/002.yaml
  text: From every clean animal you shall take for yourself seven pairs[a], a male and its mate; and from the animals that are not clean, two[b], a male and its mate.
translation:
  language: ta
  text: சுத்தமான ஒவ்வொரு மிருகத்திலிருந்தும், ஆணும் அதற்குரிய பெண்ணுமான ஏழு ஜோடிகளை[a] உனக்காக எடுத்துக்கொள்; சுத்தமல்லாத மிருகங்களிலிருந்து, ஆணும் அதற்குரிய பெண்ணுமான இரண்டை[b] எடுத்துக்கொள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “ஏழு ஏழு, ஆணும் அதன் இணையும்.” இது பெரும்பாலும் ஏழு ஜோடிகளைக் குறிக்கிறது; சிலர் இதை மொத்தம் ஏழு மிருகங்கள் எனப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அசுத்தமான மிருகங்கள்.” எபிரெயம், “சுத்தமாக இல்லாத மிருகங்கள்” என்று கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל הַבְּהֵמָה
  choice: ஒவ்வொரு மிருகத்திலிருந்தும்
  rationale: מִן + כֹּל மூலத் தொகுதியிலிருந்து பகிர்ந்தெடுக்கும் பொருளைத் தருகிறது. בְּהֵמָה இங்கு பொதுவாக நில மிருகத்தைக் குறிப்பதால், நவீன தமிழில் தெளிவான ‘மிருகம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַטְּהוֹרָה
  choice: சுத்தமான
  rationale: טָהוֹר இங்கு சுத்தம்/சுத்தமின்மை என்ற வகைப்பாட்டைக் குறிக்கிறது. ‘சடங்குசார் சுத்தமான’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத விளக்கத்தைச் சேர்க்கும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: תִּקַּח לְךָ
  choice: உனக்காக எடுத்துக்கொள்
  rationale: வினை அறிவுறுத்தலாக உள்ளது; לְךָ என்பதையும் இயல்பான தமிழில் ‘உனக்காக’ எனப் பாதுகாக்கிறது.
- source_word: שִׁבְעָה שִׁבְעָה
  choice: ஏழு ஜோடிகளை
  rationale: திரும்பக் கூறப்பட்ட எண் பகிர்வு அல்லது தொகுதி அமைப்பைக் குறிக்கிறது; தொடர்ந்து வரும் ‘ஆணையும் அதன் இணையையும்’ என்பதால் ஏழு ஆண்-பெண் ஜோடிகள் என்பது சூழலில் இயல்பான புரிதல். உண்மையான மாற்றுப் புரிதல் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: אִישׁ וְאִשְׁתּוֹ
  choice: ஆணையும் அதன் இணையையும்
  rationale: சொல்லுக்குச் சொல் ‘ஒருவனும் அவன் மனைவியும்’ என்றாலும், மிருகங்களைப் பற்றிய சூழலில் பாலின இணையைச் சுட்டும் மரபுத்தொடர். ‘ஆண், பெண்’ என்பதைவிட ‘இணை’ மூலத்தின் உறவு நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר לֹא טְהֹרָה הִוא
  choice: சுத்தமல்லாத
  rationale: எபிரெயம் தனி எதிர்ச்சொல்லைப் பயன்படுத்தாமல் ‘சுத்தமானது அல்ல’ என மறுப்பு வடிவில் கூறுகிறது; தமிழிலும் அதைப் பாதுகாக்க ‘சுத்தமல்லாத’ பயன்படுத்தப்பட்டது.
- source_word: שְׁנַיִם
  choice: இரண்டை
  rationale: மூலத்தில் நேரடியாக ‘இரண்டு’ என்று உள்ளது. அடுத்து வரும் ஆண்-இணை விளக்கம் இவை ஒரு ஜோடி என்பதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: சுத்தமான மிருகங்களின் எண்ணிக்கையைக் குறிக்கும் சொற்றொடரின் பொருள்
  choice: ஏழு ஜோடிகள்
  alternative: மொத்தம் ஏழு மிருகங்கள்; அல்லது சொல்லுக்குச் சொல் ‘ஏழு ஏழு’
  rationale: שִׁבְעָה שִׁבְעָה என்பதற்குப் பின் ‘ஆணையும் அதன் இணையையும்’ வருவதும், சுத்தமல்லாத மிருகங்களைப் பற்றி ‘இரண்டு’ என்று கூறப்படுவதும் ஜோடிகளாக எண்ணப்படுவதை வலுவாகச் சுட்டுகின்றன. ஆயினும், ஏழு தனித்தனி மிருகங்கள் என்ற புரிதல் வரலாற்றில் இருப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மிருகம்,’ ‘சுத்தமான,’ ‘இணை’ ஆகிய சொற்கள் எளிதில் புரியக்கூடியவையாகவும் மூலத்தின் வகைப்பாடு மற்றும் இணை அமைப்பைத் துல்லியமாகப் பாதுகாப்பவையாகவும் உள்ளன. வாக்கிய சமநிலைக்காக இறுதியில் ‘எடுத்துக்கொள்’ இயல்பாக மீண்டும் வழங்கப்பட்டுள்ளது.
