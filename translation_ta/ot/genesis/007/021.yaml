base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/021.yaml
  text: 'And all flesh that moved on the earth died: birds[a], livestock, wild animals, every swarming thing that swarms on the earth, and all mankind.'
translation:
  language: ta
  text: பூமியில் நடமாடிய உயிருள்ள அனைத்தும்—பறவைகள், கால்நடைகள், காட்டு விலங்குகள், பூமியில் கூட்டமாகத் திரியும் எல்லாச் சிற்றுயிரினங்கள், மனிதகுலம் முழுவதும்[a]—இறந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் உள்ள சொல் இங்கு மனித இனத்தை ஒட்டுமொத்தமாகக் குறிக்கிறது. அல்லது, ‘மனிதர்கள் அனைவரும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: இறந்தன
  rationale: גוע என்பது இறத்தல் அல்லது உயிர்விடுதல் என்பதைக் குறிக்கிறது. இங்கு பட்டியலிடப்பட்ட உயிர்கள் அனைத்துக்கும் பொருந்தும் இயல்பான, நேரடியான தமிழ் சொல் ‘இறந்தன’.
- source_word: כָּל בָּשָׂר
  choice: உயிருள்ள அனைத்தும்
  rationale: சொல்லுக்குச் சொல் ‘எல்லா மாம்சமும்’ என்ற எபிரெய மொழிமரபு இச்சூழலில் மனிதர்களையும் விலங்குகளையும் உள்ளடக்கிய உயிர்களைச் சுட்டுகிறது. நவீன தமிழில் அதன் பொருளை இயல்பாகத் தெரிவிக்க ‘உயிருள்ள அனைத்தும்’ என வழங்கப்பட்டது.
- source_word: הָרֹמֵשׂ
  choice: நடமாடிய
  rationale: רמש என்பது சூழலுக்கேற்ப நகர்தல், ஊர்தல் அல்லது கூட்டமாகத் திரிதல் ஆகியவற்றைக் குறிக்கலாம். பறவைகள் முதல் சிற்றுயிர்கள் வரை விரிந்த பட்டியல் வருவதால், பரந்த பொருளுடைய ‘நடமாடிய’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עַל הָאָרֶץ
  choice: பூமியில்
  rationale: הָאָרֶץ இங்கு வெள்ளப்பெருக்கு வருணனையின் பரந்த நிலவுலகச் சூழலைக் குறிக்கிறது; ‘பூமியில்’ என்பது தெளிவான, இயல்பான இணை.
- source_word: בָּעוֹף
  choice: பறவைகள்
  rationale: עוֹף பறக்கும் உயிரினங்களைப் பரந்த வகையில் குறிக்கக்கூடும்; இப்பட்டியலில் ‘பறவைகள்’ என்பது இயல்பான வகைப்பெயர்.
- source_word: וּבַבְּהֵמָה
  choice: கால்நடைகள்
  rationale: בְּהֵמָה இங்கு காட்டு விலங்குகளுக்கு மாறாக மனிதர்களால் வளர்க்கப்படும் நிலவாழ் விலங்குகளைக் குறிக்கிறது.
- source_word: וּבַחַיָּה
  choice: காட்டு விலங்குகள்
  rationale: חַיָּה இப்பட்டியலில் கால்நடைகளிலிருந்து வேறுபட்ட, மனிதர்களால் வளர்க்கப்படாத விலங்குகளைக் குறிக்கிறது.
- source_word: וּבְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: கூட்டங்கூட்டமாகத் திரியும் சிற்றுயிரினங்கள் அனைத்தும்
  rationale: שֶׁרֶץ மற்றும் அதனுடன் தொடர்புடைய שׁרץ ஆகியவை பெருகி நெருக்கமாக இயங்கும் சிறு உயிர்களைச் சுட்டுகின்றன. ‘கூட்டங்கூட்டமாகத் திரியும் சிற்றுயிரினங்கள்’ என்பது தமிழில் இயல்பாக அந்த வகையையும் இயக்கத்தையும் தெரிவிக்கிறது.
- source_word: וְכֹל הָאָדָם
  choice: மனிதகுலம் முழுவதும்
  rationale: הָאָדָם இங்கு ஓர் ஆண் தனிநபரை அல்ல, மனித இனத்தை ஒட்டுமொத்தமாகக் குறிக்கிறது. ‘மனிதகுலம் முழுவதும்’ அந்தக் கூட்டு பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: הָאָדָם என்பதன் கூட்டு மனித இனப் பொருள்
  choice: மனிதகுலம் முழுவதும்
  alternative: மனிதர்கள் அனைவரும்
  rationale: குறிப்பிட்ட ஓர் ஆணையோ ஆண்களை மட்டும் சுட்டாமலும், மனித இனத்தை மொத்தமாகச் சுட்டும் எபிரெயப் பயன்பாட்டைப் பாதுகாக்கிறது. மாற்று வாசகமும் பொருளில் சாத்தியமானது; முதன்மை வாசகம் கூட்டு இனப் பொருளை வலியுறுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதவிவரணைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. நீண்ட எபிரெயப் பட்டியலைத் தெளிவாகக் காட்ட இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன; வினைச்சொல் இறுதியில் வைக்கப்பட்டதால் தமிழ் வாக்கிய ஓட்டம் இயல்பாக உள்ளது.
