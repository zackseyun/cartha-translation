lexical_decisions:
- source_word: שְׁנַיִם שְׁנַיִם
  choice: இரண்டிரண்டாக
  rationale: மீண்டும் வரும் எண்ணுச்சொல் ஒவ்வொரு இணையாக வந்ததைக் குறிக்கிறது. ‘இரண்டிரண்டாக’ என்பது அதன் பகிர்வுப் பொருளையும் எபிரெய வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בָּאוּ
  choice: வந்தன
  rationale: בוא என்பது வருதல்/செல்லுதல் என்ற பொதுவான இயக்க வினை. நோவாவை நோக்கிய கதையாடல் பார்வையை ‘வந்தன’ காக்கிறது; பன்மை உயிரினங்களைத் தமிழில் இயல்பாகச் சுட்டுகிறது.
- source_word: אֶל נֹחַ
  choice: நோவாவிடம்
  rationale: אֶל இங்கு நோவாவை நோக்கிய இயக்கத்தைக் குறிக்கிறது. ‘நோவாவிடம்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: אֶל הַתֵּבָה
  choice: பேழைக்குள்
  rationale: אֶל என்பதன் அடிப்படைப் பொருள் ‘நோக்கி/இடம்’ என்றாலும், இயக்கச் சூழலும் பேழை இலக்காக இருப்பதும் உள்ளே நுழைவதைக் காட்டுகின்றன. தமிழில் ‘பேழைக்குள்’ இதைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: זָכָר וּנְקֵבָה
  choice: ஆணும் பெண்ணுமாக
  rationale: உயிரினங்களின் இரு பால்களைக் குறிக்கும் எபிரெயச் சொற்றொடரை விரிவாக்கமின்றி இயல்பான தமிழில் வழங்குகிறது.
- source_word: כַּאֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: நிகழ்வு கடவுளின் முந்தைய கட்டளைக்கு முற்றிலும் ஒத்திருந்ததை ‘-படியே’ தெளிவாகக் காட்டுகிறது.
- source_word: צִוָּה אֱלֹהִים
  choice: கடவுள் … கட்டளையிட்ட
  rationale: எபிரெய நிறைவுற்ற வினை, உயிரினங்கள் வருவதற்கு முந்தைய கட்டளையைச் சுட்டுகிறது. தமிழ் சார்பு வினையெச்ச அமைப்பு காலவரிசையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இந்தக் கதையாடல் சூழலில் ஒரே கடவுளைக் குறிக்கும் வழக்கமான ஒருமை மொழிபெயர்ப்பு.
theological_decisions:
- issue: உயிரினங்கள் வந்ததற்கான செயற்பாடு
  choice: உயிரினங்கள் நோவாவிடம் வந்தன என்றும் அது கடவுள் நோவாவுக்குக் கட்டளையிட்டபடியே நடந்தது என்றும் மட்டும் உரை கூறுகிறது.
  alternative: அவை இயற்கை உள்ளுணர்வால் மட்டும் வந்தன; அல்லது நோவா மட்டுமே அவற்றைக் கூட்டிவந்தார்.
  rationale: அவை எவ்வாறு வந்து சேர்ந்தன என்ற செயல்முறையை மூலவசனம் விளக்கவில்லை. எனவே கடவுளின் கட்டளைக்கும் நிகழ்வுக்கும் உள்ள தொடர்பை வைத்துக்கொண்டு, சொல்லப்படாத செயல்முறையை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டது. ‘பேழை’ என்பது நோவாவின் பெட்டகத்திற்கான நிலைபெற்ற வேதாகமத் தமிழ்ச் சொல். தொடக்கத்திலுள்ள ‘இரண்டிரண்டாக’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது; இடைச் செருகலான ‘ஆணும் பெண்ணுமாக’ மூலச் சொல் வரிசையையும் இணைகளின் தன்மையையும் வெளிப்படுத்துகிறது.
