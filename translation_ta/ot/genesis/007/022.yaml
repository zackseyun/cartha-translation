source:
  edition: WLC
  text: כֹּ֡ל אֲשֶׁר֩ נִשְׁמַת ר֨וּחַ חַיִּ֜ים בְּ/אַפָּ֗י/ו מִ/כֹּ֛ל אֲשֶׁ֥ר בֶּ/חָֽרָבָ֖ה מֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/022.yaml
  text: Everything on the dry land in whose nostrils was the breath of the spirit of life died[a][b].
translation:
  language: ta
  text: உலர்ந்த நிலத்தில், தங்கள் நாசிகளில் உயிர்மூச்சைக் கொண்டிருந்த அனைத்தும் இறந்தன.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “உயிரின் மூச்சு.” எபிரெயத்தில் சொற்சொல்லாக, “உயிரின் ஆவியின் மூச்சு.”'
    reason: lexical_alternative
  - marker: b
    text: 'முந்தைய மொழிபெயர்ப்பு: “உயிரின் ஆவியின் மூச்சு.”'
    reason: previous_rendering
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: அனைத்தும்
  rationale: மனிதர்களையும் விலங்குகளையும் உள்ளடக்கும் முழுமையான பொதுப்பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: נִשְׁמַת רוּחַ חַיִּים
  choice: உயிர்மூச்சு
  rationale: எபிரெயச் சொற்றொடர் உயிரளிக்கும் அல்லது உயிரைக் குறிக்கும் மூச்சைச் சுட்டுகிறது. அதன் கூறுகளைச் சொற்சொல்லாக அடுக்குவது தமிழில் இயல்பற்றதாகவும் தேவையற்ற தத்துவப் பொருளை உணர்த்துவதாகவும் இருக்கும்; ‘உயிர்மூச்சு’ அதன் மையப் பொருளைத் தெளிவாகத் தருகிறது, மேலும் முழுமையான சொற்சொல் அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּאַפָּיו
  choice: தங்கள் நாசிகளில்
  rationale: எபிரெயத்தில் ஒருமை ஆண்பால் பின்னொட்டு இருந்தாலும் அது தொகுப்பில் உள்ள ஒவ்வொன்றையும் பகிர்வாகக் குறிக்கிறது. தமிழில் உயிரினங்கள் அனைத்தையும் உள்ளடக்கும் மரியாதையற்ற பன்மைச் சுட்டு இயல்பாக அமைகிறது.
- source_word: מִכֹּל אֲשֶׁר בֶּחָרָבָה
  choice: உலர்ந்த நிலத்தில்
  rationale: வெள்ளநீருக்கு வெளியேயுள்ள வறண்ட தரையையும் அங்கு வாழ்ந்த உயிரினங்களையும் வரையறுக்கிறது; நீர்வாழ் உயிரினங்கள் இவ்வாக்கியத்தின் வரம்பில் இல்லை என்பதையும் காட்டுகிறது.
- source_word: מֵתוּ
  choice: இறந்தன
  rationale: நிகழ்ந்த மரணத்தை நேரடியாகக் கூறும் வினை; ‘அழிந்தன’ என்பதைவிட மூலத்தின் எளிய நேரடித் தன்மையைப் பேணுகிறது.
theological_decisions:
- issue: נִשְׁמַת רוּחַ חַיִּים என்பதில் רוּחַ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘உயிர்மூச்சு’
  alternative: ‘உயிரின் ஆவிக்குரிய மூச்சு’ அல்லது ‘உயிரின் ஆவியின் மூச்சு’
  rationale: רוּחַ என்பதற்கு ‘ஆவி’, ‘மூச்சு’, ‘காற்று’ ஆகிய பொருள் எல்லைகள் உள்ளன. இச்சேர்க்கை உயிரளிக்கும் மூச்சை ஒருங்கிணைந்த முறையில் குறிக்கலாம். முதன்மை உரையில் இயல்பான பொருள் தரப்பட்டு, ‘ஆவி’ அடங்கிய சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; இதனால் தனிப்பட்ட மனித ஆவி குறித்த ஒரு கோட்பாடு உரைக்குள் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘நாசிகள்’ என்பது உடற்கூறு குறிக்கும் துல்லியமான, பரவலாகப் புரியும் சொல். ‘தங்கள்’ என்பது பகிர்வான ஒருமையைக் கூட்டாக இயல்பாக வெளிப்படுத்துகிறது; ‘அனைத்தும் இறந்தன’ என்பது மனிதர்களும் விலங்குகளும் அடங்கிய விரிந்த வரம்புக்கு ஏற்ற நடுநிலை அமைப்பு.
