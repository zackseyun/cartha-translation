base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/014.yaml
  text: they[a], and every wild animal according to its kind, and every livestock animal according to its kind, and every creeping thing that creeps on the earth according to its kind[b], and every bird according to its kind—every winged bird.
translation:
  language: ta
  text: அவர்களும், தத்தம் இனத்தின்படி எல்லாக் காட்டு விலங்குகளும், தத்தம் இனத்தின்படி எல்லாக் கால்நடைகளும், தத்தம் இனத்தின்படி நிலத்தில் ஊர்ந்து செல்லும் எல்லா உயிரினங்களும், தத்தம் இனத்தின்படி எல்லாப் பறவைகளும்—சிறகுள்ள எல்லாப் பறவைகளும்[a]—பேழைக்குள் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “ஒவ்வொரு பறவையும், ஒவ்வொரு சிறகும்.” சிறகுள்ள பறவைகள் அனைத்தையும் வலியுறுத்தும் இணைவிளக்க வகைப்பாட்டு மொழி இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: அவர்களும்
  rationale: முந்தைய வசனத்திலுள்ள நோவாவையும் அவருடன் பேழைக்குள் சென்றவர்களையும் குறிக்கும் பன்மைச் சுட்டுப்பெயர்; எபிரெய உரையின் தொடர்ச்சியைத் தமிழில் இயல்பாகக் காட்ட ‘அவர்களும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַחַיָּה
  choice: காட்டு விலங்குகள்
  rationale: ஆதியாகமத்தின் விலங்கு வகைப்பாட்டில் இது בְּהֵמָה எனும் கால்நடை வகையிலிருந்து வேறுபட்ட காட்டு விலங்குகளைக் குறிக்கிறது.
- source_word: הַבְּהֵמָה
  choice: கால்நடைகள்
  rationale: வீட்டில் வளர்க்கப்படும் நாற்கால் விலங்குகள் அல்லது கால்நடைகள் என்ற வகையைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது; ‘மாடுகள்’ என்று குறுகலாக்கப்படவில்லை.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: தத்தம் இனத்தின்படி
  rationale: ஒவ்வொரு வகையும் அதனதன் இனத்தின்படி வந்தது என்ற வகைப்பாட்டு மொழியைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: நிலத்தில் ஊர்ந்து செல்லும் எல்லா உயிரினங்கள்
  rationale: பெயர்ச்சொல்லும் அதே வேரிலான வினையெச்சமும் தரும் மீளுரையை அளவோடு பிரதிபலித்து, தரையில் நகரும் சிற்றுயிர்களின் வகையைக் குறிக்கிறது.
- source_word: הָעוֹף
  choice: பறவைகள்
  rationale: עוֹף என்பதற்கு விரிவாகப் பறக்கும் உயிரினங்கள் என்ற பொருள் இருக்கலாம்; ஆனால் தொடர்ந்து வரும் צִפּוֹר மற்றும் כָּנָף இங்கு பறவைகளையே மையப்படுத்துகின்றன.
- source_word: כֹּל צִפּוֹר כָּל כָּנָף
  choice: சிறகுள்ள எல்லாப் பறவைகளும்
  rationale: சொல்லர்த்தமாக ‘ஒவ்வொரு பறவை, ஒவ்வொரு சிறகு’ என்ற இணைவிளக்க அமைப்பை, அதன் வலியுறுத்தலைத் தக்கவைத்து நவீனத் தமிழில் புரியும் வகையில் வழங்குகிறது.
