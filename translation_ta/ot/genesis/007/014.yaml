translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வாக்கியத்தின் தொடர்ச்சி என்பதால் ‘அவர்களும்’ என்று தொடங்குகிறது; தமிழில் வாக்கியம் நிறைவடைய சூழலிலிருந்து ‘பேழைக்குள் சென்றார்கள்’ இறுதியில் வெளிப்படையாக வழங்கப்பட்டுள்ளது.
