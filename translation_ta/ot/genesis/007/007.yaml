translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. எபிரெயத்தில் முதலில் நோவா ஒருமை வினையுடன் வருவதையும், மற்ற குடும்பத்தினர் ‘அவனுடன்’ சென்றதாக அமைவதையும் பிரதிபலிக்க, நோவாவை முதன்மை எழுவாயாக வைத்து ‘ஆகியோருடன் ... சென்றான்’ என்ற இயல்பான தமிழ் அமைப்பு பயன்படுத்தப்பட்டது.
