  yaml_path: translation/ot/genesis/007/007.yaml
  text: And Noah, with his sons, his wife, and his sons’ wives with him, entered the ark because of the waters of the flood.
translation:
  language: ta
  text: பெருவெள்ளத்தின் நீர் காரணமாக, நோவா தன் மகன்கள், தன் மனைவி, தன் மகன்களின் மனைவிகள் ஆகியோருடன் பேழைக்குள் சென்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: சென்றான்
  rationale: בוא என்பது சூழலுக்கேற்ப ‘வந்தான்’, ‘சென்றான்’, அல்லது ‘உள்ளே நுழைந்தான்’ எனப் பொருள்படும். பேழையை நோக்கிய இயக்கத்தைத் தமிழில் இயல்பாகக் காட்ட, ‘பேழைக்குள் சென்றான்’ என வழங்கப்பட்டது.
- source_word: נֹחַ
  choice: நோவா
  rationale: நֹחַ என்ற தனிப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: בָנָיו
  choice: தன் மகன்கள்
  rationale: எபிரெயச் சொல் பொதுவாகப் பிள்ளைகள் என்று அல்லாமல் மகன்களையே குறிப்பதால் அந்தத் துல்லியம் காக்கப்பட்டது.
- source_word: אִשְׁתּוֹ
  choice: தன் மனைவி
  rationale: இந்தச் சூழலில் אִשָּׁה என்பதன் பொருள் தெளிவாக ‘மனைவி’ என்பதாகும்.
- source_word: נְשֵׁי בָנָיו
  choice: தன் மகன்களின் மனைவிகள்
  rationale: ‘அவனுடைய மகன்களின் மனைவிகள்’ என்ற எபிரெயக் கட்டமைப்பைத் தெளிவாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: אִתּוֹ
  choice: ஆகியோருடன்
  rationale: குடும்பத்தினர் நோவாவுடன் சென்றார்கள் என்ற உடன்செல்லும் உறவைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֶל הַתֵּבָה
  choice: பேழைக்குள்
  rationale: אֶל குறிக்கும் திசையையும் תֵּבָה குறிக்கும் நோவாவின் பேழையையும் சேர்த்து, உள்ளே சென்ற இயக்கத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִפְּנֵי
  choice: காரணமாக
  rationale: இங்கு இந்த முன்னிடைச்சொல் காரணத்தை அல்லது தூண்டிய சூழலைக் குறிக்கிறது; அதனால் ‘காரணமாக’ என்பது தெளிவான நவீனத் தமிழ் வடிவம்.
- source_word: מֵי הַמַּבּוּל
  choice: பெருவெள்ளத்தின் நீர்
  rationale: ‘வெள்ளத்தின் நீர்’ என்ற எபிரெயச் சொற்றொடரின் இரு கூறுகளையும் வெளிப்படையாகக் காக்கிறது; மַבּוּל குறிக்கும் தனித்த பெருவெள்ளச் சூழலும் தெளிவாகிறது.
