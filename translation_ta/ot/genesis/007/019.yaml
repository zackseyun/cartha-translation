  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הַ/מַּ֗יִם גָּֽבְר֛וּ מְאֹ֥ד מְאֹ֖ד עַל הָ/אָ֑רֶץ וַ/יְכֻסּ֗וּ כָּל הֶֽ/הָרִים֙ הַ/גְּבֹהִ֔ים אֲשֶׁר תַּ֖חַת כָּל הַ/שָּׁמָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/019.yaml
  text: And the waters prevailed exceedingly over the earth[b][a], and all the high mountains under all the heavens were covered.
translation:
  language: ta
  text: தண்ணீர் பூமியின்மேல்[a] மிக மிக மேலோங்கியது; வானங்கள் அனைத்திற்கும் கீழுள்ள[b] உயரமான மலைகள் அனைத்தும் மூடப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘பூமி’ என்பதற்குப் பதிலாக, வெள்ளத்தின் பரப்பைச் சூழலில் எவ்வளவு விரிவாகப் புரிந்துகொள்கிறோம் என்பதைப் பொறுத்து, ‘நிலம்’ என்றும் மொழிபெயர்க்கலாம் (எபிரேயச் சொல்: אֶרֶץ).'
    reason: alternative_reading
  - marker: b
    text: ‘வானங்கள் அனைத்திற்கும் கீழ்’ என்பதை ‘முழு வானத்தின் கீழ்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְרוּ
  choice: மிகுதியாகப் பெருகியது
  rationale: גבר என்பது வலுப்பெறுதல், மேலோங்குதல், மிகுதல் ஆகிய பொருள்களைத் தருகிறது. வெள்ளச் சூழலில் தண்ணீர் தொடர்ந்து வலுப்பெற்று உயர்ந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מְאֹד מְאֹד
  choice: மிகவும் மிகுதியாக
  rationale: இருமுறை வரும் מְאֹד செயலைத் தீவிரப்படுத்துகிறது. தமிழில் வலியுறுத்தலை இயல்பாகவும் தெளிவாகவும் எடுத்துரைக்கிறது.
- source_word: עַל הָאָרֶץ
  choice: பூமியின்மேல்
  rationale: עַל என்பதற்கு ‘மேல்’; אֶרֶץ என்பதற்கு சூழலின்படி ‘பூமி’ அல்லது ‘நிலம்’ என்று பொருள். அடுத்துள்ள விரிவான வானக் குறிப்புடன் ‘பூமி’ முதன்மை வாசிப்பாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיְכֻסּוּ
  choice: மூடப்பட்டன
  rationale: எபிரெய வடிவின் விளைவை இயல்பான தமிழ் செயப்பாட்டு அமைப்பில் தருகிறது; மலைகள் தண்ணீரால் மூடப்பட்டன என்பது சூழலில் தெளிவு.
- source_word: כָּל הֶהָרִים הַגְּבֹהִים
  choice: உயரமான மலைகள் அனைத்தும்
  rationale: הָרִים என்பதற்கு இங்கு ‘மலைகள்’ என்றும் גְּבֹהִים என்பதற்கு ‘உயரமான’ என்றும் நேரடியாகத் தரப்பட்டுள்ளது; כָּל குறிக்கும் முழுமையும் பாதுகாக்கப்படுகிறது.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: வானங்கள் அனைத்திற்கும் கீழிருந்த
  rationale: שָׁמַיִם வடிவியல் ரீதியாகப் பன்மை. அதன் வடிவையும் விரிவான அளவையும் பாதுகாக்க ‘வானங்கள் அனைத்திற்கும் கீழ்’ என மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: வெள்ளக் கதையில் אֶרֶץ என்பதன் பரப்பு
  choice: பூமி
  alternative: நிலம்
  rationale: ‘வானங்கள் அனைத்திற்கும் கீழ்’ என்ற இவ்வசனத்தின் மொழி கதையினுள் விரிவான பரப்பைக் காட்டுவதால் ‘பூமி’ முதன்மை வாசிப்பாக உள்ளது. இருப்பினும் אֶרֶץ என்பதன் இயல்பான ‘நிலம்’ என்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; நவீன அறிவியல் முடிவு எதுவும் உரைக்குள் புகுத்தப்படவில்லை.
- issue: כָּל הַשָּׁמָיִם என்பதன் வடிவும் தமிழாக்கமும்
  choice: வானங்கள் அனைத்தும்
  alternative: முழு வானம்
  rationale: மூலத்தின் பன்மை வடிவை முதன்மை உரையில் காக்கிறது; ஒருமைத் தொகுப்புப் பொருளுடைய இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். மூலத்தின் தீவிரம், முழுமைக் குறிப்புகள், மற்றும் אֶרֶץ என்பதிலுள்ள உண்மையான பொருள் இருமை பாதுகாக்கப்பட்டுள்ளன.
