revisions:
- from: தண்ணீர் பூமியின்மேல்[a] மிகவும் மிகுதியாகப் பெருகியது; வானங்கள் அனைத்திற்கும் கீழிருந்த உயரமான மலைகள் அனைத்தும் மூடப்பட்டன.[b]
  to: தண்ணீர் பூமியின்மேல்[a] மிக மிக மேலோங்கியது; வானங்கள் அனைத்திற்கும் கீழுள்ள[b] உயரமான மலைகள் அனைத்தும் மூடப்பட்டன.
