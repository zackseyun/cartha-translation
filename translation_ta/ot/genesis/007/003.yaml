  text: גַּ֣ם מֵ/ע֧וֹף הַ/שָּׁמַ֛יִם שִׁבְעָ֥ה שִׁבְעָ֖ה זָכָ֣ר וּ/נְקֵבָ֑ה לְ/חַיּ֥וֹת זֶ֖רַע עַל פְּנֵ֥י כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/003.yaml
  text: Also from the birds of the sky[a], seven and seven, male and female, to keep offspring alive on the face of all the earth.
translation:
  language: ta
  text: வானத்துப் பறவைகளிலிருந்தும் ஆணும் பெண்ணுமாக ஏழேழு[a] எடுத்துக்கொள்; பூமியெங்கும் அவற்றின் சந்ததியை உயிரோடு காக்கும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஏழு ஜோடிகள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் சொல்லுக்கு சொல் “ஏழு, ஏழு” என்று உள்ளது. இந்தப் பகிர்வு முறையை ஏழேழாக அல்லது ஏழு ஜோடிகளாகப் புரிந்துகொள்ளலாம்; முதன்மை உரை எபிரெய வடிவை நெருக்கமாகப் பேணுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם מֵעוֹף הַשָּׁמַיִם
  choice: வானத்துப் பறவைகளிலிருந்தும்
  rationale: גַּם முந்தைய கட்டளையுடன் இவ்வகையையும் இணைக்கிறது; தமிழ் ‘-உம்’ அதை இயல்பாக வெளிப்படுத்துகிறது. הַשָּׁמַיִם இச்சூழலில் ‘வானம்’ என்றும் עוֹף ‘பறவைகள்’ என்றும் மொழிபெயர்க்கப்பட்டன.
- source_word: שִׁבְעָה שִׁבְעָה
  choice: ஏழேழு
  rationale: எபிரெய எண்ணின் இரட்டிப்பைத் தமிழின் பகிர்வுப்பொருள் தரும் இயல்பான வடிவில் காக்கிறது; ‘ஏழு ஜோடிகள்’ என்று மட்டும் பொருளைத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: זָכָר וּנְקֵבָה
  choice: ஆணும் பெண்ணுமாக
  rationale: இனப்பெருக்கப் பாலின இணையை நேரடியாகவும் இச்சூழலில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לְחַיּוֹת
  choice: உயிரோடு நிலைத்திருப்பதற்காக
  rationale: Hiphil வடிவத்தின் உயிரைப் பாதுகாத்து நீடிக்கச் செய்யும் நோக்கத்தைத் தெளிவாகத் தருகிறது.
- source_word: זֶרַע
  choice: அவற்றின் சந்ததி
  rationale: சொல்லின் நேர்ப்பொருள் ‘விதை’ என்றாலும், இங்கு பெருவெள்ளத்திற்குப் பின் பறவைகளின் வழித்தோன்றல் தொடர்வதைக் குறிக்கிறது; ‘சந்ததி’ அந்த உயிரியல் பொருளைத் தெளிவாக்குகிறது.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: பூமியெங்கும்
  rationale: எபிரெய மரபுத்தொடரின் பரப்பெங்கும் என்ற பொருளை நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: '[elliptical verb supplied from Genesis 7:2]'
  choice: எடுத்துக்கொள்
  rationale: எபிரெய வசனம் முந்தைய வசனத்தின் கட்டளை வினையைச் சார்ந்துள்ளதால், தனியே வாசிக்கப்படும் தமிழில் பொருள் தெளிவாக இருக்க அந்த வினை சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
theological_decisions:
- issue: שִׁבְעָה שִׁבְעָה என்பது ஏழு தனிப்பறவைகளையா, ஏழு ஜோடிகளையா குறிக்கிறது?
  choice: முதன்மை உரையில் ‘ஏழேழு’ என்று எபிரெய வடிவின் தெளிவின்மையைப் பேணுதல்
  alternative: ‘ஏழு ஜோடிகள்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: எண்ணை இரட்டிக்கும் எபிரெய பகிர்வு அமைப்பு ‘ஏழு ஜோடிகள்’ எனப் புரிந்துகொள்ள இடமளித்தாலும், அதையே கட்டாயப்படுத்தாது; ஆகவே மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையும் மதிப்புமிக்க வேதாகம நடையும் இணைக்கப்பட்டுள்ளன. முந்தைய வசனத்திலிருந்து புரிந்துகொள்ளப்படும் ‘எடுத்துக்கொள்’ என்ற வினை, தனி வசனமாக வாசிக்கத் தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது. ‘ஏழேழு’ என்ற வடிவம் மூலத்தின் உண்மையான பொருள் நெகிழ்வைப் பேணுகிறது.
