  terminology: “சுத்தமான / சுத்தமில்லாத” appropriately represents the ritual-category contrast without importing a more specific doctrinal interpretation. “விலங்குகள்,” “பறவைகள்,” and “ஊர்ந்து செல்லும் அனைத்தும்” are accurate contextual category terms. The footnote correctly identifies “தீட்டான” as an idiomatic alternative while noting the Hebrew’s literal negative formulation.
