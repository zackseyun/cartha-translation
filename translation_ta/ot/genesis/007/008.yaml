  source_fidelity: 'The Tamil preserves the Hebrew’s four-part catalog and repeated מִן (''from''): clean animals, animals described analytically as not clean, birds, and all that creeps on the ground. The unfinished syntax and final dash appropriately retain the verse’s continuation into the following verse.'
