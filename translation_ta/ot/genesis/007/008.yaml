base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/008.yaml
  text: From the clean animals and from the animals that are not clean[a], and from the birds and everything that creeps on the ground—
translation:
  language: ta
  text: சுத்தமான விலங்குகளிலிருந்தும், சுத்தமில்லாத விலங்குகளிலிருந்தும்[a], பறவைகளிலிருந்தும், நிலத்தின்மேல் ஊர்ந்து செல்லும் அனைத்திலிருந்தும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தீட்டான விலங்குகளிலிருந்தும்.’ எபிரேய மொழியில் இன்னும் சொற்சொல்லாக, ‘சுத்தமாக இல்லாத விலங்குகளிலிருந்தும்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  choice: -இலிருந்தும்
  rationale: பட்டியலிடப்படும் ஒவ்வொரு வகையிலிருந்தும் எடுக்கப்பட்டவற்றைக் குறிக்கும் எபிரேய முன்னிடைச்சொல்லை, மீள வரும் தமிழ் வேற்றுமை உருபால் வெளிப்படுத்துகிறது.
- source_word: בְּהֵמָה
  choice: விலங்குகள்
  rationale: பறவைகளுக்கும் ஊர்ந்து செல்லும் உயிரினங்களுக்கும் மாறான ஒரு பரந்த வகையை இங்கு குறிக்கிறது; ‘கால்நடைகள்’ என்று மொழிபெயர்த்தால் வளர்ப்பு விலங்குகளுக்கு மட்டும் பொருளைச் சுருக்கக்கூடும்.
- source_word: טְּהוֹרָה
  choice: சுத்தமான
  rationale: பலிசார் அல்லது சடங்குசார் விலங்கு வகைப்பாட்டைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: אֲשֶׁר אֵינֶנָּה טְהֹרָה
  choice: சுத்தமில்லாத
  rationale: எபிரேயத்தில் உள்ள ‘சுத்தமாக இல்லாத’ என்ற மறுப்பு அமைப்பை இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது; ‘தீட்டான’ என்பது சாத்தியமான மாற்று.
- source_word: עוֹף
  choice: பறவைகள்
  rationale: சொல் பறக்கும் உயிரினங்களை விரிவாகக் குறிக்கக்கூடியதாயினும், இச்சூழலில் இயல்பான பொதுத் தமிழ் வகைப்பெயர் இதுவே.
- source_word: כֹּל אֲשֶׁר רֹמֵשׂ
  choice: ஊர்ந்து செல்லும் அனைத்தும்
  rationale: தரையில் ஊர்ந்து அல்லது தவழ்ந்து இயங்கும் சிறு உயிரினங்களின் வகையை, எபிரேய வினைச்சொல் கருத்துக்கு நெருக்கமாகக் கூறுகிறது.
- source_word: עַל הָאֲדָמָה
  choice: நிலத்தின்மேல்
  rationale: இங்கு உயிரினங்கள் இயங்கும் தரைப்பரப்பைக் குறிக்கிறது; ‘பூமியின்மேல்’ என்பதைவிட சூழலுக்கு இயல்பானது.
theological_decisions:
- issue: சுத்த வகைப்பாட்டின் எதிர்மறை வடிவம்
  choice: சுத்தமில்லாத
  alternative: தீட்டான
  rationale: மூல எபிரேயம் தனித்த எதிர்ச்சொல்லைப் பயன்படுத்தாமல் ‘சுத்தமாக இல்லாத’ என்று கூறுகிறது; அதிலுள்ள சொற்றொடர் வேறுபாட்டையும் சாத்தியமான நுணுக்கத்தையும் தமிழில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் தொடரும் பட்டியல் அமைப்பைக் காட்ட ‘-இலிருந்தும்’ மீள வழங்கப்பட்டு, வசனம் தொடர்வதைக் குறிக்க இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது.
