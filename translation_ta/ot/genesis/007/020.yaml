source:
  edition: WLC
  text: חֲמֵ֨שׁ עֶשְׂרֵ֤ה אַמָּה֙ מִ/לְ/מַ֔עְלָ/ה גָּבְר֖וּ הַ/מָּ֑יִם וַ/יְכֻסּ֖וּ הֶ/הָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/020.yaml
  text: The waters rose fifteen cubits higher, and the mountains were covered.
translation:
  language: ta
  text: தண்ணீர் இன்னும் பதினைந்து முழம் உயர்ந்தது[a]; மலைகள் மூடப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தண்ணீர் பதினைந்து முழம் மேலாகப் பெருகியது.” இது மலைச் சிகரங்களுக்கு மேலான அளவைக் குறிக்கலாம்; எபிரெய உரை ஒப்பீட்டுப் புள்ளியை வெளிப்படையாகச் சொல்லவில்லை.
    reason: מִלְמַעְלָה மற்றும் גָּבְרוּ ஆகியவற்றின் பொருள் தொடர்பில் உள்ள உண்மையான இலக்கண, சூழல் சார்ந்த தெளிவின்மையைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: גָּבְרוּ
  choice: உயர்ந்தது
  rationale: இங்கு தண்ணீரின் மட்டம் மேலெழுந்து மலைகளை மூடியதைக் குறிக்கிறது. எபிரெயச் சொல்லின் அடிப்படைப் பொருளான ‘வலுப்பெறு/மேலோங்கு’ என்பதைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: אַמָּה
  choice: முழம்
  rationale: முழங்கையிலிருந்து விரல் நுனிவரை அடிப்படையாகக் கொண்ட பண்டைய நீள அலகிற்கான வழக்கமான தமிழ் வேதாகமச் சொல்.
- source_word: וַיְכֻסּוּ
  choice: மூடப்பட்டன
  rationale: எபிரெய வினையின் செயப்பாட்டு வடிவத்தையும், மலைகள் தண்ணீரால் மறைக்கப்பட்டதையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: பதினைந்து முழம் என்பது எதனுடன் ஒப்பிடப்படுகிறது?
  choice: முதன்மை உரையில் ‘இன்னும் பதினைந்து முழம் உயர்ந்தது’ என்று வைத்து, அளவின் தொடர்பைத் தீர்மானிக்காமல் விடுதல்
  alternative: தண்ணீர் மலைகளுக்கு மேல் பதினைந்து முழம் நின்றது
  rationale: מִלְמַעְלָה (‘மேல்நோக்கி/மேலாக’) என்ற சொற்றொடர் அளவு மேல்நோக்கி இருந்ததைத் தெளிவுபடுத்தினாலும், அது உயர்ந்த மொத்த அளவா அல்லது மலைச் சிகரங்களுக்கு மேலான ஆழமா என்பதை வாக்கியம் வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே உரையில் இல்லாத தொடர்பைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘முழம்’ என்ற பரவலாக அறியப்பட்ட பண்டைய அளவுச் சொல் தக்கவைக்கப்பட்டது; ‘இன்னும்’ என்பது higher/upward என்ற கருத்தை வாசிக்க எளிதாக வெளிப்படுத்துகிறது.
