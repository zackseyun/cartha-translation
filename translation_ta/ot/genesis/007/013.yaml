  text: בְּ/עֶ֨צֶם הַ/יּ֤וֹם הַ/זֶּה֙ בָּ֣א נֹ֔חַ וְ/שֵׁם וְ/חָ֥ם וָ/יֶ֖פֶת בְּנֵי נֹ֑חַ וְ/אֵ֣שֶׁת נֹ֗חַ וּ/שְׁלֹ֧שֶׁת נְשֵֽׁי בָנָ֛י/ו אִתָּ֖/ם אֶל הַ/תֵּבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/013.yaml
  text: On that very day Noah entered the ark[a], with Shem, Ham, and Japheth, Noah’s sons, and Noah’s wife[c][b], and the three wives of his sons with them.
translation:
  language: ta
  text: அந்த நாளிலேயே நோவாவும், நோவாவின் மகன்களான சேம், காம், யாப்பேத்தும், நோவாவின் மனைவியும், அவர்களுடன்[b] அவருடைய மகன்களின் மூன்று மனைவிகளும் பேழைக்குள் சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பேழைக்குள் வந்தார்கள்.’ எபிரெய வினைச்சொல் நேரடியாக ‘வந்தான்’ என இருந்தாலும், இச்சூழலில் அது பேழைக்குள் நுழைந்ததைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அவர்களுடன்.’ இந்தப் பன்மைச் சொல், ஏற்கெனவே பெயரிடப்பட்ட குடும்பக் குழுவைக் குறிப்பதாக இயல்பாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: அந்த நாளிலேயே
  rationale: בְּעֶצֶם என்ற வலியுறுத்தலை இயல்பான நவீனத் தமிழில் ‘அந்த நாளிலேயே’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בָּא ... אֶל הַתֵּבָה
  choice: பேழைக்குள் சென்றார்கள்
  rationale: בָּא என்பதன் அடிப்படைப் பொருள் ‘வந்தான்’ என்றாலும், אֶל הַתֵּבָה என்ற இலக்குடன் இச்சூழலில் பேழைக்குள் நுழைந்த செயலைக் குறிக்கிறது. பல நபர்கள் இணைந்த எழுவாயாக இருப்பதால் தமிழில் இயல்பான பன்மை வினை பயன்படுத்தப்பட்டது.
- source_word: נֹחַ
  choice: நோவா
  rationale: தமிழில் நிலைபெற்றுள்ள பெயரெழுத்தாக்கம்.
- source_word: שֵׁם וְחָם וָיֶפֶת
  choice: சேம், காம், யாப்பேத்
  rationale: எபிரெயப் பெயர்களுக்கான தெளிவான, தமிழில் வழக்கமான வடிவங்கள்.
- source_word: בְּנֵי נֹחַ
  choice: நோவாவின் மகன்களான
  rationale: முன்னர் குறிப்பிடப்பட்ட மூன்று பெயர்களையும் நோவாவின் மகன்கள் என இயல்பாக அடையாளப்படுத்துகிறது.
- source_word: וְאֵשֶׁת נֹחַ
  choice: நோவாவின் மனைவியும்
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: וּשְׁלֹשֶׁת נְשֵׁי בָנָיו
  choice: அவருடைய மகன்களின் மூன்று மனைவிகளும்
  rationale: மனைவிகளின் எண்ணிக்கையையும் குடும்ப உறவையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אִתָּם
  choice: அவர்களுடன்
  rationale: மூலத்தின் ஆண்பால் பன்மைச் சுட்டுப்பெயரைப் பன்மையாகவே வைத்துப் பாதுகாக்கிறது; இது ஏற்கெனவே குறிப்பிடப்பட்ட குடும்பக் குழுவைக் குறிக்கிறது.
- source_word: הַתֵּבָה
  choice: பேழை
  rationale: நோவா வரலாற்றில் תֵּבָה என்பதற்குத் தமிழில் நிலைபெற்ற, dignified equivalent.
