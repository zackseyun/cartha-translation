  yaml_path: translation/ot/genesis/007/006.yaml
  text: Noah was six hundred years old[b][a], and the flood was upon the earth.
translation:
  language: ta
  text: நோவாவுக்கு அறுநூறு வயது இருந்தது; வெள்ளநீர் பூமியின்மேல்[a] இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நிலத்தின்மேல்.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: நோவா
  rationale: வாக்கியத் தொடக்க இணைப்பான וְ தமிழில் கட்டாயமாகத் தனிச் சொல்லால் மொழிபெயர்க்கப்பட வேண்டியதில்லை; அரைப்புள்ளி இரு உட்பிரிவுகளின் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது. நֹחַ என்ற பெயர் தமிழின் வழக்கமான வடிவில் ‘நோவா’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן שֵׁשׁ מֵאוֹת שָׁנָה
  choice: அறுநூறு வயதாக இருந்தது
  rationale: ‘அறுநூறு ஆண்டுகளின் மகன்’ என்ற எபிரேய வயது மரபுத்தொடரின் இயல்பான தமிழ்ப் பொருள் இது.
- source_word: וְ/הַ/מַּבּוּל … מַיִם
  choice: வெள்ளநீர்
  rationale: מַבּוּל என்பது பெருவெள்ளத்தையும், மַיִם என்பது நீரையும் குறிக்கின்றன. ‘வெள்ளம் நீராக இருந்தது’ என்ற சொல்லுக்குச் சொல் அமைப்பை விட, இரண்டின் பொருளையும் சுருக்கமாகவும் இயல்பாகவும் ‘வெள்ளநீர்’ வெளிப்படுத்துகிறது.
- source_word: הָיָה
  choice: வந்தது
  rationale: இங்கு הָיָה நிகழ்வு ஏற்பட்டதைச் சுட்டுகிறது. ‘வெள்ளநீர் … இருந்தது’ என்பதைவிட ‘வந்தது’ நவீன தமிழில் இயல்பாக இருந்து, மூலத்தின் நிகழ்வுத்தன்மையைத் தருகிறது.
- source_word: עַל הָ/אָרֶץ
  choice: பூமியின்மேல்
  rationale: עַל என்பது ‘மேல்’; הָאָרֶץ என்பது சூழலில் ‘பூமி’ அல்லது ‘நிலம்’ எனப் பொருள்படலாம். பெருவெள்ளக் கதையின் விரிந்த சூழலுக்கு ‘பூமி’ முதன்மை வாசிப்பாகத் தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டது.
theological_decisions:
- issue: הָאָרֶץ என்பதன் பரப்பு
  choice: பூமி
  alternative: நிலம்
  rationale: எபிரேயச் சொல் இரு பொருள்களையும் ஏற்கிறது. பெருவெள்ளக் கதையின் உடனடிச் சூழலில் ‘பூமி’ பொருத்தமான முதன்மை வாசிப்பு; இருப்பினும் ‘நிலம்’ என்ற உண்மையான சொற்பொருள் வாய்ப்பு மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரு இணை உட்பிரிவுகள் அரைப்புள்ளியால் இணைக்கப்பட்டுள்ளன; காலத்தைக் குறிக்கும் ‘அப்போது’ அல்லது ‘போது’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத சொற்கள் சேர்க்கப்படவில்லை.
