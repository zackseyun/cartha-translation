revisions:
- from: உயிர்மூச்சு[a] இருந்த எல்லா மாம்சத்திலிருந்தும் அவை இரண்டிரண்டாக நோவாவிடம் பேழைக்குள் வந்தன.
  to: உயிர்மூச்சு உள்ள எல்லா உயிரினங்களும் இரண்டிரண்டாக நோவாவிடம் பேழைக்குள் வந்தன.[a]
  rationale: The revision replaces an overly literal and unclear rendering of “all flesh” with “all living creatures,” which communicates the Hebrew flood-language referent naturally in modern Tamil. The core lexical ambiguity of רוּחַ is retained in the footnote.
