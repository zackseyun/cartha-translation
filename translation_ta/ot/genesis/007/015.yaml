  yaml_path: translation/ot/genesis/007/015.yaml
  text: They came to Noah into the ark[a], two by two from all flesh in which was the breath of life.
translation:
  language: ta
  text: உயிர்மூச்சு உள்ள எல்லா உயிரினங்களும் இரண்டிரண்டாக நோவாவிடம் பேழைக்குள் வந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயிரின் ஆவி.” எபிரேயச் சொல் רוּחַ என்பதற்கு “மூச்சு,” “காற்று,” அல்லது “ஆவி” என்று பொருள் வரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: அவை வந்தன
  rationale: בוא என்பதன் இறந்தகாலத் தொடர்நிகழ்வு வடிவம் இங்கு எளிய வருகையைக் குறிக்கிறது. உயிரினங்களைச் சுட்டுவதால், நவீன தமிழில் இயல்பான அஃறிணைப் பன்மையாக ‘அவை வந்தன’ பயன்படுத்தப்பட்டது.
- source_word: אֶל נֹחַ
  choice: நோவாவிடம்
  rationale: אֶל என்பது நோவாவை நோக்கிய இயக்கத்தைக் குறிக்கிறது; ‘நோவாவிடம்’ இந்த உறவைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֶל הַתֵּבָה
  choice: பேழைக்குள்
  rationale: אֶל அடிப்படையில் ‘நோக்கி/இடம்’ எனப் பொருள்படலாம்; இச்சூழலில் உயிரினங்கள் கப்பலுக்குள் நுழைவதே இயக்கத்தின் முடிவு என்பதால் ‘பேழைக்குள்’ பொருத்தமானது.
- source_word: שְׁנַיִם שְׁנַיִם
  choice: இரண்டிரண்டாக
  rationale: மீண்டும் வரும் எண் பகிர்வுமுறையில் இணை இணையாக வந்ததைக் குறிக்கிறது; ‘இரண்டிரண்டாக’ அதனைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: מִכָּל הַבָּשָׂר
  choice: எல்லா மாம்சத்திலிருந்தும்
  rationale: בָּשָׂר என்பதன் நேர்ப்பொருள் ‘மாம்சம்.’ வெள்ளப்பெருக்கு உரையில் அது உயிருள்ள படைப்புகளை விரிவாகக் குறிக்கிறது. ‘மாம்சம்’ என்ற சொல் மூலத்தின் உருவகத்தையும் கதைமுழுவதிலுள்ள சொல்லிணைப்பையும் பாதுகாக்கிறது.
- source_word: אֲשֶׁר בּוֹ
  choice: இருந்த
  rationale: ‘அதில் இருந்த’ என்ற எபிரேய உறவுக்கூற்றை தமிழில் பெயரெச்சத் தொடராக இயல்பாக்கி, ‘உயிர்மூச்சு இருந்த எல்லா மாம்சம்’ என வழங்குகிறது.
- source_word: רוּחַ חַיִּים
  choice: உயிர்மூச்சு
  rationale: רוּחַ என்பதற்கு ‘மூச்சு,’ ‘காற்று,’ ‘ஆவி’ ஆகிய பொருள்கள் உண்டு. உயிரினங்களை விவரிக்கும் இச்சூழலில் ‘உயிர்மூச்சு’ முதன்மைப் பொருளாக இயல்பாக உள்ளது; ‘ஆவி’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: רוּחַ חַיִּים என்பதிலுள்ள רוּחַ என்ற சொல்லின் பொருள்
  choice: உயிர்மூச்சு
  alternative: உயிரின் ஆவி
  rationale: பேழைக்குள் வரும் உயிரினங்களைப் பற்றிய படைப்பு மற்றும் வெள்ளப்பெருக்குச் சூழல் உடலுயிரைக் காட்டும் ‘மூச்சு’ என்ற பொருளை முன்னிறுத்துகிறது. இருப்பினும் ‘ஆவி’ என்ற உண்மையான சொற்பொருள் சாத்தியத்தை அடிக்குறிப்பு வெளிப்படையாக வைத்திருக்கிறது; எந்த ஓர் மானிடவியல் கோட்பாட்டையும் வசனத்துக்குள் திணிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, ஆனால் ஆதியாகமக் கதையின் மரியாதையான இலக்கியத் தொனியைப் பேணும் நடை. ‘மாம்சம்’ என்பது வழக்குப் பேச்சில் குறைவாக இருந்தாலும், மூல எபிரேயச் சொல்லையும் வெள்ளப்பெருக்கு உரையின் கருப்பொருள் ஒத்திசைவையும் காக்கத் திட்டமிட்டு வைக்கப்பட்டது.
