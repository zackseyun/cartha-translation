id: GEN.7.5
reference: Genesis 7:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ נֹ֑חַ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/005.yaml
  text: And Noah did according to all that Yahweh had commanded him[a].
translation:
  language: ta
  text: யாவே நோவாவுக்குக் கட்டளையிட்ட அனைத்தின்படியும் நோவா செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தார்
  rationale: עשה என்பது பொதுவாக ‘செய்/உருவாக்கு’ என்று பொருள்படும். இங்கு கட்டளைக்கு இணங்கச் செயல்பட்டதைக் குறிக்கும் அமைப்பில் ‘செய்தார்’ என்பது இயல்பாகவும் மூலத்தின் விரிவான பொருளைச் சுருக்காமலும் உள்ளது.
- source_word: נֹחַ
  choice: நோவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: כְּכֹל אֲשֶׁר
  choice: அனைத்தின்படியும்
  rationale: כְּ என்ற முன்னொட்டு காட்டும் ஒத்திசைவு அல்லது இணக்கத்தையும், כֹּל காட்டும் முழுமையையும் சேர்த்துப் பாதுகாக்கிறது.
- source_word: צִוָּהוּ
  choice: தனக்குக் கட்டளையிட்ட
  rationale: צוה என்பதன் நேர்ப்பொருள் ‘கட்டளையிடு’. வினையுடன் சேர்ந்துள்ள மூன்றாம் நபர் ஆண்பால் ஒருமைச் சுட்டுப்பெயரைத் தமிழில் ‘தனக்கு’ என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழ் வாசகர்களிடையே நிலைபெற்ற தனிப்பெயர் வடிவில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. ‘கர்த்தர்’ என்பது பெயருக்குப் பதிலான பட்டம்; ‘யாவே’ என்பது மற்றொரு அறிஞர் மறுகட்டமைப்பு. தமிழ் வேதாகம வழக்கில் பரவலாக அறியப்படும் ‘யெகோவா’ தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான, கண்ணியமான நடை. எபிரெயச் சொல்வரிசையை வற்புறுத்தாமல், ‘அனைத்தின்படியும்’ என்பதன் மூலம் முழுமையான இணக்கத்தைத் தெளிவாக வைத்திருக்கிறது.
