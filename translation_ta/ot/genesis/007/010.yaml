base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/010.yaml
  text: And after seven days[b][a], the waters of the flood came upon the earth.
translation:
  language: ta
  text: ஏழு நாட்களுக்குப் பிறகு, பெருவெள்ளத்தின் நீர் பூமியின் மேல் வந்தது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிலத்தின் மேல்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் אֶרֶץ என்ற சொல் சூழலுக்கேற்ப ‘பூமி’ அல்லது ‘நிலம்’ என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘அவ்வாறு நிகழ்ந்தது; ஏழு நாட்களுக்குப் பிறகு, பெருவெள்ளத்தின் நீர் பூமியின் மேல் இருந்தது.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לְשִׁבְעַת הַיָּמִים
  choice: ஏழு நாட்கள் முடிந்தபோது
  rationale: குறிப்பிட்ட ஏழு நாள் காலம் நிறைவடைந்த பின்பு அடுத்த நிகழ்வு நடந்ததைக் குறிக்கும் எபிரெயக் கதைநடை அமைப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּמֵי הַמַּבּוּל
  choice: பெருவெள்ளத்தின் நீர்
  rationale: מַבּוּל நோவாவின் காலப் பெருவெள்ளத்தைக் குறிக்கிறது; இணைப்பு வடிவிலுள்ள מֵי என்பதற்கு இங்கு ஒருமைப்பொருள் கொண்ட இயல்பான தமிழாக ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָיוּ עַל
  choice: மேல் வந்தது
  rationale: சொல்லுக்குச் சொல் ‘மேல் இருந்தது’ எனலாம்; ஆனால் சூழலில் வெள்ளநீர் வந்தடைந்த நிகழ்வை இது குறிக்கிறது. ஆகவே நிகழ்வுத்தன்மையை இயல்பாகக் காட்ட ‘மேல் வந்தது’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: אֶרֶץ என்பதற்கு ‘பூமி’ அல்லது ‘நிலம்’ எனப் பொருள் வரலாம். பெருவெள்ளக் கதையின் இச்சூழலில் ‘பூமி’ முதன்மைத் தேர்வாக உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: பெருவெள்ளக் கதையில் אֶרֶץ என்பதன் பரப்பு
  choice: பூமி
  alternative: நிலம்
  rationale: எபிரெயச் சொல் இரு பொருள்களையும் ஏற்கக்கூடியது. கதையின் பரந்த சூழலுக்கு ஏற்ப முதன்மை உரையில் ‘பூமி’ பயன்படுத்தப்படுகிறது; ஆனால் வசனம் மட்டும் கொண்டு மாற்று வாசிப்பை முற்றிலும் நீக்காமல் அடிக்குறிப்பில் ‘நிலம்’ தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை. எபிரெய மூலத்தின் கால நிறைவு மற்றும் நிகழ்வுத் தொடர்ச்சி இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளன; אֶרֶץ என்பதிலுள்ள உண்மையான பொருள் இருமை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
