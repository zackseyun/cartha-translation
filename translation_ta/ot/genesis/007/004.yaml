  text: כִּי֩ לְ/יָמִ֨ים ע֜וֹד שִׁבְעָ֗ה אָֽנֹכִי֙ מַמְטִ֣יר עַל הָ/אָ֔רֶץ אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה וּ/מָחִ֗יתִי אֶֽת כָּל הַ/יְקוּם֙ אֲשֶׁ֣ר עָשִׂ֔יתִי מֵ/עַ֖ל פְּנֵ֥י הָֽ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/004.yaml
  text: For in seven more days I will make it rain on the earth forty days and forty nights[d][c][b][a], and I will wipe out every living thing that I have made from the face of the ground.
translation:
  language: ta
  text: ஏனெனில், இன்னும் ஏழு நாட்களில்[a] நான் பூமியின்மேல் நாற்பது நாட்களும் நாற்பது இரவுகளும் மழை பெய்யச் செய்வேன்; நான் உண்டாக்கிய உயிருள்ள அனைத்தையும்[b] மண்ணின் மேற்பரப்பிலிருந்து துடைத்தழிப்பேன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இன்னும் ஏழு நாட்களுக்குப் பிறகு’ என்றும் மொழிபெயர்க்கலாம். மழை தொடங்குவதற்கு முன் ஏழு நாட்கள் மீதமிருப்பதை எபிரேய வழக்கு குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், ‘நிற்கிறவை அனைத்தும்’ அல்லது ‘இருப்பவை அனைத்தும்’ என்ற சொல் உள்ளது; இச்சூழலில் அது உயிருள்ள படைப்புகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘துடைத்துவிடுவேன்’ அல்லது ‘அழித்தொழிப்பேன்’ என்றும் மொழிபெயர்க்கலாம். எபிரேய வினை துடைத்து நீக்குதல் அல்லது அழித்தெழுதுதல் போன்ற உருவகத்தைத் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்திலுள்ள கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לְיָמִים עוֹד שִׁבְעָה
  choice: இன்னும் ஏழு நாட்களில்
  rationale: மழை தொடங்குவதற்கு ஏழு நாட்கள் மீதமுள்ளன என்ற எபிரேயக் காலவழக்கை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: אָנֹכִי מַמְטִיר
  choice: நான் … மழை பெய்யச் செய்வேன்
  rationale: வலியுறுத்தப்பட்ட ‘நான்’ என்பதையும், மழையைப் பெய்யச் செய்யும் இறைச் செயலாண்மையைக் குறிக்கும் causative வினையையும் பாதுகாக்கிறது.
- source_word: עַל הָאָרֶץ
  choice: பூமியின்மேல்
  rationale: வெள்ளத் தீர்ப்பின் விரிவான மொழிநடைக்கு ஏற்ற பொதுவான பொருளைத் தருகிறது; பின்னர் வரும் אֲדָמָה என்பதிலிருந்து சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: நாற்பது நாட்களும் நாற்பது இரவுகளும்
  rationale: கால அளவைத் தெளிவாகவும் இயல்பான தமிழிலும் நேரடியாக வழங்குகிறது.
- source_word: כָּל הַיְקוּם
  choice: உயிருள்ள அனைத்தையும்
  rationale: இச்சூழலில் வெள்ளத் தீர்ப்புக்கு உட்படும் படைக்கப்பட்ட உயிருள்ள ஒழுங்கைக் குறிக்கிறது; ‘இருப்பவை அனைத்தும்’ என்று அளவுக்கு மீறிப் பொதுமைப்படுத்துவதைத் தவிர்க்கிறது.
- source_word: וּמָחִיתִי
  choice: துடைத்தழிப்பேன்
  rationale: துடைத்தல் அல்லது அழித்தொழித்தல் என்ற מחה வினையின் உயிரோட்டமான உருவகத்தையும் முழுமையான நீக்கத்தையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: மண்ணின் மேற்பரப்பிலிருந்து
  rationale: ‘நிலம்/மண்’ என்ற אֲדָמָה சொல்லை முன்னுள்ள ‘பூமி’ என்பதிலிருந்து வேறுபடுத்தி, ‘முகம்’ என்ற எபிரேய வழக்கின் இடவியல் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: אֶרֶץ மற்றும் הַיְקוּם ஆகியவற்றில் வெள்ளத் தீர்ப்பின் பரப்பு
  choice: ‘பூமி’, ‘உயிருள்ள அனைத்தும்’ என்ற விரிவான படைப்பு சார்ந்த மொழியைப் பயன்படுத்துதல்
  alternative: אֶרֶץ என்பதை ‘நாடு/நிலப்பகுதி’ என்று மொழிபெயர்த்து தீர்ப்பை வட்டார அளவுக்குக் குறுக்குதல்
  rationale: வசனத்தின் மொழி கடவுள் உண்டாக்கியவற்றின் மேல் வரும் பரந்த தீர்ப்பை முன்வைக்கிறது. அதேவேளையில், மொழிபெயர்ப்பு வெள்ளத்தின் புவியியல் பரப்பைப் பற்றிய பிற்கால அறிவியல் அல்லது பிரிவுசார் முடிவை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘பூமி’/‘மண்’ என்ற சொல்வேறுபாடு பாதுகாக்கப்பட்டுள்ளது; இறைச் செயலாண்மையைத் தெளிவுபடுத்த ‘மழை பெய்யச் செய்வேன்’ பயன்படுத்தப்பட்டுள்ளது.
