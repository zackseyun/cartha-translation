translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து தொடரும் மறை வினை தமிழில் தெளிவுக்காக ‘தாக்கினார்கள்’ என வழங்கப்பட்டுள்ளது; இடப்பெயரின் உண்மையான சொற்பொருள் தெளிவின்மை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
