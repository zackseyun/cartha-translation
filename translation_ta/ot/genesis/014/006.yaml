source:
  edition: WLC
  text: וְ/אֶת הַ/חֹרִ֖י בְּ/הַרְרָ֣/ם שֵׂעִ֑יר עַ֚ד אֵ֣יל פָּארָ֔ן אֲשֶׁ֖ר עַל הַ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/006.yaml
  text: and the Horites in their hill country of Seir[a], as far as El-paran, which is by the wilderness.
translation:
  language: ta
  text: சேயீரிலுள்ள அவர்களுடைய மலைநாட்டில் இருந்த ஓரியர்களையும், பாலைவனத்தை ஒட்டியுள்ள ஏல்-பாரான்[a] வரையிலும் தாக்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏல் பாரான்’; இதை நிலையான இடப்பெயராக அல்லாமல் அதன் சொற்பிறப்பின்படி புரிந்துகொண்டால், ‘பாரானின் பெரிய மரம்,’ ‘பாரானின் கருவாலி மரம்,’ அல்லது ‘பாரானின் தெரபிந்து மரம்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: …ஓரியர்களையும்
  rationale: முந்தைய வசனத்தில் வரும் ‘தாக்கினார்கள்’ என்ற வினையைத் தொடர்ந்து, எபிரெயப் பொருள் சுட்டியுடன் இணைக்கப்பட்ட மற்றொரு தாக்கப்பட்ட மக்களைக் ‘-ஐயும்’ குறிக்கிறது; தமிழில் சூழலிலிருந்து வினையை இயல்பாக நிரப்பியுள்ளோம்.
- source_word: הַחֹרִי
  choice: ஓரியர்கள்
  rationale: இது ஓரியர் என அறியப்பட்ட மக்களைக் குறிக்கும் இனப்பெயர்; தமிழில் வழக்கமான ஒலிபெயர்ப்பைப் பன்மையில் பயன்படுத்தியுள்ளோம்.
- source_word: בְּהַרְרָם
  choice: அவர்களுடைய மலைநாட்டில்
  rationale: ‘அவர்களுடைய மலைகளில்’ என்ற சொற்பொருளை, ஒரு மக்கள் வாழ்ந்த மலைப்பகுதி என்னும் கருத்தைத் தெளிவாகத் தெரிவிக்கும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: שֵׂעִיר
  choice: சேயீரிலுள்ள
  rationale: சேயீர் என்பது இடப்பெயர்; மலைநாடு அமைந்த இடத்தைக் காட்டும் வகையில் தமிழில் இணைக்கப்பட்டுள்ளது.
- source_word: עַד
  choice: வரையிலும்
  rationale: படையெடுப்பின் புவியியல் எல்லையைச் சுட்டுகிறது.
- source_word: אֵיל פָּארָן
  choice: ஏல்-பாரான்[a]
  rationale: இதை நிலையான இடப்பெயராக ஒலிபெயர்ப்பது, אֵיל என்பதற்கு ‘பெரிய மரம்/கருவாலி/தேவதாரு வகை மரம்’ சார்ந்த சொற்பிறப்புப் பொருளை பிரதான உரையில் உறுதிப்படுத்துவதைத் தவிர்க்கிறது; மாற்று புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר עַל הַמִּדְבָּר
  choice: பாலைவனத்தை ஒட்டியுள்ள
  rationale: உறவுத்தொடர் ஏல்-பாரானின் இருப்பிடத்தைச் சொல்கிறது; עַל இங்கே தரும் பரந்த அண்மை/எல்லைப்புற இடவுணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
