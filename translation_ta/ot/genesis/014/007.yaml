base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/007.yaml
  text: Then they turned back and came to En-mishpat (that is[a], Kadesh), and struck all the country of the Amalekites[c][b], and also the Amorites who were living in Hazazon-tamar.
translation:
  language: ta
  text: பின்பு அவர்கள் திரும்பி, ஏன்-மிஸ்பாத்துக்கு[a]—அதாவது காதேசுக்கு—வந்து, அமலேக்கியரின் நிலப்பகுதி முழுவதையும்[b] தாக்கினார்கள்; மேலும் ஹசசோன்-தாமாரில்[c] குடியிருந்த எமோரியரையும் தாக்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஏன்-மிஸ்பாத்” என்பதற்கு “நியாயத்தீர்ப்பின் ஊற்று” என்று பொருள்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “அமலேக்கியரின் வயல்வெளி முழுவதையும்.” எபிரெயத்தில் சொல்லுக்குச் சொல் “அமலேக்கியனின் வயல் முழுவதையும்” என்று உள்ளது; இது அமலேக்கியர் வாழ்ந்த பிரதேசத்தைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: 2 நாளாகமம் 20:2 ஹசசோன்-தாமாரை ஏன்-கேதியுடன் அடையாளப்படுத்துகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: பின்பு அவர்கள் திரும்பி
  rationale: שׁוב என்பதன் திசைமாற்றப் பொருளையும் wayyiqtol வடிவத்தின் தொடர்ச்சியான கதைநடையையும் இயல்பான தமிழில் தருகிறது.
- source_word: וַיָּבֹאוּ אֶל
  choice: வந்து
  rationale: முந்தைய ‘திரும்பி’ என்பதுடன் இணைந்து இலக்கை நோக்கிய வருகையைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: עֵין מִשְׁפָּט
  choice: ஏன்-மிஸ்பாத்
  rationale: இது இடப்பெயராகச் செயல்படுவதால் மொழிபெயர்க்காமல் எபிரெய ஒலிப்புக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளது; பெயரின் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הִוא קָדֵשׁ
  choice: அதாவது காதேசுக்கு
  rationale: முந்தைய இடப்பெயரை காதேசுடன் அடையாளப்படுத்தும் விளக்கத் தன்மையைத் தெளிவாகத் தருகிறது.
- source_word: וַיַּכּוּ
  choice: தாக்கினார்கள்
  rationale: נכה என்பது தாக்குதல், அடித்தல், முறியடித்தல் ஆகிய பரந்த பொருள்களைக் கொள்ளலாம். வெற்றி முழுமையானது என்று மிகைப்படுத்தாமல் இங்கு ‘தாக்கினார்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: כָּל שְׂדֵה הָעֲמָלֵקִי
  choice: அமலேக்கியரின் நிலப்பகுதி முழுவதையும்
  rationale: שׂדה என்பதன் அடிப்படைப் பொருள் ‘வயல்/வெளி’; இச்சூழலில் அது ஒரு மக்கள் வாழ்ந்த பிரதேசத்தைக் குறிக்கிறது. ‘நிலப்பகுதி’ புவியியல் பொருளை இயல்பாகத் தருகிறது.
- source_word: וְגַם אֶת הָאֱמֹרִי
  choice: மேலும் ... எமோரியரையும்
  rationale: וְגַם என்பதன் சேர்க்கை வலியுறுத்தலை ‘மேலும் ... -ஐயும்’ என்ற தமிழ் அமைப்பு தக்கவைக்கிறது; ஒருமை இனப்பெயர் கூட்டுப்பொருளில் பன்மையாகத் தரப்பட்டுள்ளது.
- source_word: הַיֹּשֵׁב
  choice: குடியிருந்த
  rationale: பங்கேற்புவினை அந்த மக்களின் தொடர்ந்த வசிப்பிட நிலையைக் குறிக்கிறது; ‘குடியிருந்த’ நவீனத் தமிழில் இயல்பானது.
- source_word: בְּחַצְצֹן תָּמָר
  choice: அத்சத்சோன்-தாமாரில்
  rationale: இடப்பெயர் எபிரெய மெய்யொலிகளுக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டு, בְ என்பதற்கு இடவேற்றுமை ‘-இல்’ பயன்படுத்தப்பட்டுள்ளது.
