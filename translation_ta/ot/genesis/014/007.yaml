translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமக் கதைநடையின் சுருக்கமும் காக்கப்பட்டுள்ளன. இடப்பெயர்கள் எபிரெய மூலத்துக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளன. ஒருமை வடிவிலுள்ள இனப்பெயர்கள் தமிழின் இயல்புப்படி கூட்டுப் பன்மையாக வழங்கப்பட்டுள்ளன; மூலத்தின் மறுபடியான וַיַּכּוּ செயல் தமிழில் இரு பொருட்களுடனும் தெளிவாக மீளக் கூறப்பட்டுள்ளது.
