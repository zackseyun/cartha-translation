base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/014.yaml
  text: When Abram heard that his kinsman had been taken captive[a], he led out his trained men, born in his household, three hundred and eighteen[b], and pursued them as far as Dan.
translation:
  language: ta
  text: தன் சகோதரன்[a] சிறைபிடிக்கப்பட்டதை ஆபிராம் கேள்விப்பட்டபோது, தன் வீட்டில் பிறந்த, பயிற்சி பெற்ற முந்நூற்றுப் பதினெட்டு ஆட்களை அணிதிரட்டி[b], அவர்களைச் சிறைபிடித்தவர்களைத் தாண்வரை துரத்திச் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அவனுடைய சகோதரன்’; இச்சொல் சகோதரன் மகன் போன்ற நெருங்கிய ஆண் உறவினரையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அணிதிரட்டி’ என மொழிபெயர்க்கப்பட்ட வினையை ‘வெளியே அழைத்துச் சென்றான்,’ ‘வெளியே கொண்டுவந்தான்,’ அல்லது ‘ஆயுதமளித்தான்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבָּה
  choice: சிறைபிடிக்கப்பட்டதை
  rationale: שׁבה என்பதன் நிஃபால் வடிவம் போரில் சிறைபிடிக்கப்படுவதைக் குறிக்கிறது; ‘சிறைபிடிக்கப்பட்டதை’ என்பது அந்த இராணுவச் சூழலைத் தெளிவாகக் காக்கிறது.
- source_word: אָחִיו
  choice: தன் சகோதரன்
  rationale: இங்கு லோத்து ஆபிராமின் மருமகன் என்றாலும், எபிரெயச் சொல் நேரடியாக ‘சகோதரன்’ என்று கூறுகிறது; அது நெருங்கிய ஆண் உறவினரையும் குறிக்கக்கூடும் என்பதால் மூலச்சொல் முதன்மை உரையில் காக்கப்பட்டு விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיָּרֶק
  choice: அணிதிரட்டி
  rationale: வினைச்சொல்லின் துல்லிய நுட்பம் விவாதத்திற்குரியது; சூழலில் ஆட்களைப் போர்த் தொடர்ச்சிக்காகத் தயார்படுத்தி வெளியே கொண்டுவருவதைக் குறிக்கிறது. ‘அணிதிரட்டி’ என்பது ‘ஆயுதமளித்தான்’ அல்லது ‘வெளியே அழைத்துச் சென்றான்’ என்ற ஒன்றில் மிகையாக முடிவு செய்யாமல் இராணுவச் சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חֲנִיכָיו
  choice: பயிற்சி பெற்ற ஆட்கள்
  rationale: ஆபிராமின் அதிகாரத்தின்கீழ் பயிற்சி பெற்றவர்களை இது குறிக்கிறது; ‘பயிற்சி பெற்ற ஆட்கள்’ என்பது இயல்பான நவீனத் தமிழில் இராணுவச் சூழலுக்குப் பொருந்துகிறது.
- source_word: יְלִידֵי בֵיתוֹ
  choice: தன் வீட்டிலேயே பிறந்த
  rationale: ஆபிராமின் வீட்டாரிடையே பிறந்த சார்புடையவர்களைக் குறிக்கும் சொற்றொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁמֹנָה עָשָׂר וּשְׁלֹשׁ מֵאוֹת
  choice: முந்நூற்றுப் பதினெட்டுப் பேர்
  rationale: எபிரெய மூலத்திலுள்ள முழு எண்ணிக்கையைத் தெளிவாகவும் கண்ணியமான உரைநடையிலும் வழங்குகிறது.
- source_word: וַיִּרְדֹּף
  choice: அவர்களைத் ... துரத்திச் சென்றான்
  rationale: רדף இங்கு இராணுவத் துரத்தலைக் குறிக்கிறது; தமிழில் இயல்புக்காகச் சூழலிலிருந்து புரியும் பன்மைச் செயப்படுபொருள் சேர்க்கப்பட்டுள்ளது.
- source_word: עַד דָּן
  choice: தாண்வரை
  rationale: עַד குறிக்கும் எல்லையை ‘வரை’ துல்லியமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: லோத்துக்குப் பயன்படுத்தப்பட்ட உறவுமுறைச் சொல்
  choice: முதன்மை உரையில் ‘தன் சகோதரன்’ என்று வைத்தல்
  alternative: தன் நெருங்கிய உறவினன் / தன் மருமகன்
  rationale: אָחִיו என்பதன் மேற்பரப்பு அர்த்தம் ‘அவனுடைய சகோதரன்’; அது நெருங்கிய ஆண் உறவினரையும் குறிக்கலாம். லோத்து ஆபிராமின் மருமகன் என்ற சூழலுக்கேற்ப உரையை அமைதியாக மாற்றாமல், மூலத்தின் சொற்பயன்பாட்டையும் அதன் விரிந்த உறவுமுறைப் பொருளையும் காக்கிறது.
- issue: וַיָּרֶק என்ற வினையின் உறுதியற்ற நுட்பம்
  choice: ‘அணிதிரட்டி’
  alternative: வெளியே அழைத்துச் சென்றான் / ஆயுதமளித்தான்
  rationale: மூலவினையின் துல்லிய நுட்பம் உறுதியற்றதால், ஆட்களைப் போருக்காகத் திரட்டிய பொதுவான கருத்தை முதன்மை உரை வழங்குகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத்தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சகோதரன்’ மூலத்தின் திட்டமிட்ட உறவுமுறைச் சொல்லைக் காக்கிறது; ‘அணிதிரட்டி’ விவாதத்திற்குரிய வினையின் பொருளில் அளவுக்கு மீறிய தீர்மானத்தைத் தவிர்க்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்களுக்குப் பின்பே முதன்மை உரையில் இடப்பட்டுள்ளன.
