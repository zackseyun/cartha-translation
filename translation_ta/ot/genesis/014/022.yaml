source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אַבְרָ֖ם אֶל מֶ֣לֶךְ סְדֹ֑ם הֲרִימֹ֨תִי יָדִ֤/י אֶל יְהוָה֙ אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/022.yaml
  text: But Abram said to the king of Sodom[a], “I have raised my hand to Yahweh, God Most High[c][b], possessor of heaven and earth.”
translation:
  language: ta
  text: ஆனால் ஆபிராம் சோதோமின் அரசனிடம், “வானத்தையும் பூமியையும் உடையவராகிய[b] உன்னத இறைவனான யாவேவை நோக்கி என் கையை உயர்த்தியிருக்கிறேன்[a].” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் கையை உயர்த்தியிருக்கிறேன்” என்பது உறுதிமொழி செய்வதைக் குறிக்கும் எபிரேயச் சைகை; அதாவது, ஆபிராம் ஆணையிட்டு உறுதிமொழி செய்கிறார்.
    reason: cultural_note
  - marker: b
    text: “உடையவர்” என்பதற்குப் பதிலாக “படைத்தவர்” என்றும் மொழிபெயர்க்கலாம். இதற்கான எபிரேயச் சொல் ‘உடைமையாளர்’, ‘சொந்தக்காரர்’ அல்லது இச்சூழலில் ‘படைத்தவர்’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் ... என்றார்
  rationale: தொடர்கதை வாவ் நிகழ்வை முன்னெடுத்தாலும், முந்தைய வசனத்தில் சோதோமின் அரசன் கூறியதற்கு ஆபிராம் அளிக்கும் மாறுபட்ட பதிலைத் தமிழில் இயல்பாகக் காட்ட ‘ஆனால்’ பொருத்தமானது.
- source_word: אַבְרָם
  choice: ஆபிராம்
  rationale: எபிரேயப் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: מֶלֶךְ סְדֹם
  choice: சோதோமின் அரசன்
  rationale: எபிரேய இணைப்புத் தொடரின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: הֲרִימֹתִי יָדִי
  choice: என் கையை உயர்த்தியிருக்கிறேன்
  rationale: மூலத்தின் காட்சிப்பூர்வமான உறுதிமொழிச் சைகையை மறைமுகமாக ‘ஆணையிட்டேன்’ என்று மாற்றாமல் காக்கிறது; அதன் பண்பாட்டு பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தை ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் தருகிறது.
- source_word: אֵל עֶלְיוֹן
  choice: உன்னதமான இறைவன்
  rationale: தலைப்பை ஒலிபெயர்க்காமல் அதன் பொருளை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: קֹנֵה
  choice: உடையவர்
  rationale: קנה என்பதன் உடைமை/சொந்தம் என்ற மையப் பொருளை இயல்பான தமிழில் காக்கிறது; ‘படைத்தவர்’ என்ற சாத்தியப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: வானத்தையும் பூமியையும்
  rationale: முழுப் படைப்பையும் குறிக்கும் எபிரேய இருமுனைச் சொல்லாட்சியை தமிழில் வழக்கமான வடிவில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் தனிப்பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல் காக்கிறது. தமிழ் வாசகர்களிடையே அறியப்பட்ட ஒலிவடிவமான ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பது மற்றொரு சாத்திய ஒலிபெயர்ப்பு.
- issue: קֹנֵה שָׁמַיִם וָאָרֶץ என்பதன் பொருள்
  choice: வானத்தையும் பூமியையும் உடையவர்
  alternative: வானத்தையும் பூமியையும் படைத்தவர்
  rationale: எபிரேய வினையெச்சம் உடைமை, பெற்றுக்கொள்ளுதல், சில சூழல்களில் படைத்தல் ஆகிய பொருள் வாய்ப்புகளைக் கொண்டது. பிரதான உரை உடைமைப் பொருளைக் காக்கிறது; படைப்பாளர் என்ற முக்கிய மாற்றுப் பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: கையை உயர்த்துதல் என்ற சொல்லாட்சியின் உறுதிமொழிப் பொருள்
  choice: உருவகச் சைகையை பிரதான உரையில் காத்தல்
  alternative: ‘நான் ஆணையிட்டிருக்கிறேன்’ என்று நேரடியாகப் பொருளாக்குதல்
  rationale: மூலத்தின் உடல் சைகையை நீக்காமல் வைத்துக்கொண்டு, அதன் உறுதிமொழிப் பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் உறுதிமொழிச் சைகையும் קֹנֵה என்ற சொல்லின் பொருள் விரிவும் தேவையின்றித் தீர்மானிக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் பிரதான உரையில் இடம்பெறுகின்றன.
