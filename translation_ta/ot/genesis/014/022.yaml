  terminology: ‘உடையவர்’ suitably preserves the possessive sense of קֹנֵה without deciding the creator/possessor question. ‘உன்னத இறைவன்’ is an appropriate rendering of אֵל עֶלְיוֹן. The footnote markers must be placed on the expressions they explain.
  issues:
