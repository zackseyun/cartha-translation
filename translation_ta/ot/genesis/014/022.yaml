    rationale: Placing the marker directly after the idiom makes its referent unambiguous.
  - severity: low
    issue: The rendering of the divine name as ‘யெகோவா’ does not correspond closely to the POB audit trail’s source-oriented ‘Yahweh.’
    rationale: ‘யாவே’ is a more suitable modern Tamil transliteration for the source-oriented divine-name policy and avoids importing a later conventional vocalization.
