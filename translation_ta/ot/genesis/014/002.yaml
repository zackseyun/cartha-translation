id: GEN.14.2
reference: Genesis 14:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: עָשׂ֣וּ מִלְחָמָ֗ה אֶת בֶּ֨רַע֙ מֶ֣לֶךְ סְדֹ֔ם וְ/אֶת בִּרְשַׁ֖ע מֶ֣לֶךְ עֲמֹרָ֑ה שִׁנְאָ֣ב מֶ֣לֶךְ אַדְמָ֗ה וְ/שֶׁמְאֵ֨בֶר֙ מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִיא צֹֽעַר־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/002.yaml
  text: they made war against Bera king of Sodom[a], Birsha king of Gomorrah, Shinab king of Admah, Shemeber king of Zeboiim, and the king of Bela (that is[c][b], Zoar).
translation:
  language: ta
  text: அவர்கள் சோதோமின் அரசன் பேரா, கொமோராவின் அரசன் பிர்சா, அத்மாவின் அரசன் சினாப், செபோயீமின் அரசன் செமேபேர், பேலாவின் அரசன் (பேலா என்பது சோவார்) ஆகியோருக்கு எதிராகப் போரிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשׂוּ מִלְחָמָה
  choice: போரிட்டார்கள்
  rationale: ‘போர் செய்தார்கள்’ என்ற எபிரெயச் சொற்றொடரின் பொருளை இயல்பான நவீன தமிழில் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: אֶת ... וְאֶת
  choice: ஆகியோருக்கு எதிராக
  rationale: இங்கு אֶת போர் எதிர்த்து நடத்தப்பட்ட தரப்பினரைச் சுட்டுகிறது. ஒரே ‘எதிராக’ முழுப் பட்டியலையும் ஆளும் வகையில் அமைப்பது, ஐந்து அரசர்களும் போரின் எதிர்த்தரப்பினர் என்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: בֶּרַע
  choice: பேரா
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: מֶלֶךְ סְדֹם
  choice: சோதோமின் அரசன்
  rationale: அரசப் பட்டத்தையும் இடப்பெயரையும் இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: בִּרְשַׁע
  choice: பிர்சா
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: עֲמֹרָה
  choice: கொமோரா
  rationale: தமிழில் பரவலாக அறியப்படும் வேதாகம இடப்பெயர் வடிவம்.
- source_word: שִׁנְאָב
  choice: சினாப்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: אַדְמָה
  choice: அத்மா
  rationale: எபிரெய இடப்பெயருக்கு ஏற்ற தமிழ் ஒலிபெயர்ப்பு.
- source_word: שֶׁמְאֵבֶר
  choice: செமேபேர்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: צביים
  choice: செபோயீம்
  rationale: மசோரா உயிர்க்குறிப்புகளைக் கருத்தில் கொண்டு இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מֶלֶךְ בֶּלַע
  choice: பேலாவின் அரசன்
  rationale: மற்ற அரசர்களைப் போலல்லாமல் இவரது தனிப்பெயர் தரப்படவில்லை; நகரத்தைச் சார்ந்த அரசர் என்ற மூல உரையின் அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
- source_word: הִיא צֹעַר
  choice: பேலா என்பது சோவார்
  rationale: பேலா என்ற இடத்தைச் சோவார் என அடையாளப்படுத்தும் மூல உரையின் விளக்கக் குறிப்பைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட அரசர் பட்டியல் ‘ஆகியோருக்கு எதிராக’ என்பதன் கீழ் ஒரே இணையான தொடராக அமைக்கப்பட்டுள்ளது; இதனால் எபிரெயத்தில் முதல் இரு பெயர்களுக்கு மட்டும் வெளிப்படையாக வரும் אֶת குறியீட்டைத் தமிழில் தவறாகப் பிரித்துணர்வது தவிர்க்கப்படுகிறது.
