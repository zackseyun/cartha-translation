source:
  edition: WLC
  text: וַֽ/יְבָרְכֵ֖/הוּ וַ/יֹּאמַ֑ר בָּר֤וּךְ אַבְרָם֙ לְ/אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/019.yaml
  text: And he blessed him and said[a], “Blessed be Abram by God Most High[b], possessor of heaven and earth.”
translation:
  language: ta
  text: அவன் ஆபிராமை ஆசீர்வதித்து, “வானத்தையும்[b] பூமியையும் உடைமையாகக் கொண்ட[a] உன்னதமான தேவனால் ஆபிராம் ஆசீர்வதிக்கப்படுவாராக!” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “வானத்தையும் பூமியையும் படைத்தவர்.” எபிரெய வினையெச்சம் “உடைமையாகக் கொண்டவர்,” “உரிமையாளர்,” அல்லது இச்சூழலில் “படைத்தவர்” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “வானங்களையும் பூமியையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: அவன் ஆபிராமை ஆசீர்வதித்து
  rationale: எபிரெயத் தொடர்கதை வடிவத்தையும் ஆண்பால் ஒருமைப் பொருள் பின்னொட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. சூழலிலிருந்து ‘அவனை’ என்பது ஆபிராமைக் குறிக்கும் என்பதால் பெயர் தெளிவுக்காக வழங்கப்பட்டுள்ளது.
- source_word: וַיֹּאמַר
  choice: என்றான்
  rationale: ஆசீர்வாத உரையைத் தொடர்ந்து வரும் எபிரெயக் கூற்று அறிமுகத்தை இயல்பான தமிழ் நேர்க் கூற்று அமைப்பில் தருகிறது.
- source_word: בָּרוּךְ
  choice: ஆசீர்வதிக்கப்பட்டவராக இருப்பாராக
  rationale: செயப்பாட்டு வினையெச்சத்தின் ஆசீர்வாதச் சூத்திர வலிமையைத் தமிழில் மரியாதையும் உயர்ந்த நடையும் கொண்ட விருப்பவாக்கியமாக வெளிப்படுத்துகிறது; வெறும் கடந்தகால நிகழ்வாக மாற்றவில்லை.
- source_word: אַבְרָם
  choice: ஆபிராம்
  rationale: இவ்விடத்தில் பெயர் இன்னும் ஆபிரகாம் என்று மாற்றப்படவில்லை; ஆகவே மூலப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְאֵל
  choice: இறைவனால்
  rationale: ஆசீர்வாதச் சூத்திரத்தில் לְ இறைவனை ஆசீர்வாதத்தின் ஆதாரமாகக் குறிக்கக்கூடும்; தமிழ் செயப்பாட்டு அமைப்பில் ‘இறைவனால்’ இதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: אֵל עֶלְיוֹן
  choice: உன்னதமான இறைவன்
  rationale: பெயர்ச்சொல்–பெயரடை வடிவிலுள்ள இறைப்பட்டத்தை கூடுதல் சமயவிளக்கம் இன்றி தெளிவான நவீன தமிழில் தருகிறது.
- source_word: קֹנֵה
  choice: உடைமையாகக் கொண்டவர்
  rationale: קנה என்பதன் ‘பெற்றுக்கொள்/உடைமையாகக் கொள்’ என்ற அடிப்படைப் பொருளை முன்னிலைப்படுத்துகிறது. இச்சூழலில் சாத்தியமான ‘படைத்தவர்’ என்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: வானத்தையும் பூமியையும்
  rationale: முழுப் படைப்பையும் குறிக்கும் இணைச்சொற்றொடரை இயல்பான தமிழில் தருகிறது. שָׁמַיִם வடிவின் பன்மைத்தன்மையைச் சுட்டும் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: இறைப்பட்டத்தில் קֹנֵה என்பதன் பொருள்
  choice: வானத்தையும் பூமியையும் உடைமையாகக் கொண்டவர்
  alternative: வானத்தையும் பூமியையும் படைத்தவர்
  rationale: קנה என்பது உடைமையாகக் கொள்ளுதல் அல்லது வைத்திருத்தல் என்றும், சில சூழல்களில் படைத்தல் என்றும் பொருள்படலாம். முதன்மை உரை அதன் பரந்த சொற்பொருளைத் தக்கவைத்து, படைப்பைக் குறிக்கும் வாசிப்பை அடிக்குறிப்பில் வழங்குவதால் இறையியல் தெளிவின்மையைத் தேவையின்றித் தீர்மானிப்பதில்லை.
- issue: בָּרוּךְ ... לְאֵל עֶלְיוֹן என்ற ஆசீர்வாதச் சூத்திரத்தின் உறவு
  choice: உன்னதமான இறைவனால் ஆபிராம் ஆசீர்வதிக்கப்பட்டவராக இருப்பாராக
  alternative: ஆபிராம் உன்னதமான இறைவனுக்குரிய ஆசீர்வதிக்கப்பட்டவர்
  rationale: לְ என்பதை இச்சூழலில் ஆசீர்வாதத்தின் ஆதாரத்தைக் குறிப்பதாக வாசிப்பது இயல்பானது. இருப்பினும் சொற்றொடரின் உறவை உரிமை அல்லது அர்ப்பணிப்பு சார்ந்ததாக விரிவுபடுத்தாமல், ஆசீர்வாதச் சூத்திரத்தின் முதன்மையான வலிமை பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நேர்க் கூற்றின் இயல்புக்காக ‘என்றான்’ இறுதியில் வைக்கப்பட்டுள்ளது. ஆபிராமைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டு, ஆசீர்வாதச் சூத்திரத்தின் உயர்ந்த நடை பேணப்பட்டுள்ளது.
