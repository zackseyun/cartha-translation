translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. எபிரேய வாக்கியத்தின் தொடர்ச்சியான செயல்கள் இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டன; பொருள் வரிசை காக்கப்பட்டது. இறுதியில் உள்ள மசோரா குறியீடு மொழிபெயர்ப்புக்குரிய சொல் அல்ல.
