  text: וַ/יֵּחָלֵ֨ק עֲלֵי/הֶ֧ם לַ֛יְלָה ה֥וּא וַ/עֲבָדָ֖י/ו וַ/יַּכֵּ֑/ם וַֽ/יִּרְדְּפֵ/ם֙ עַד חוֹבָ֔ה אֲשֶׁ֥ר מִ/שְּׂמֹ֖אל לְ/דַמָּֽשֶׂק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/015.yaml
  text: By night he and his servants divided themselves against them, struck them down, and pursued them as far as Hobah, which is north of Damascus.
translation:
  language: ta
  text: அவர் இரவில் தம் பணியாளர்களைக் குழுக்களாகப் பிரித்து அவர்களுக்கு எதிராகச் சென்று, அவர்களைத் தாக்கி முறியடித்தார்; தமஸ்குவுக்கு வடக்கே உள்ள ஹோபா வரை அவர்களைத் துரத்திச் சென்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּחָלֵק עֲלֵיהֶם
  choice: பிரிந்து அவர்களைத் தாக்கி
  rationale: இந்த வினை வடிவம் சொற்பொருளில் ‘அவர்களுக்கு எதிராகத் தன்னைப் பிரித்துக்கொண்டார்’ என இருந்தாலும், சூழலில் ஆபிராமும் அவரது ஆட்களும் குழுக்களாகப் பிரிந்து திடீர்த் தாக்குதல் நடத்தியதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் மூலத்தின் படைத்துறைச் செயலையும் காக்கவும் இவ்வாறு தரப்பட்டது.
- source_word: עֲבָדָיו
  choice: அவருடைய பணியாளர்கள்
  rationale: עֶבֶד என்பது சூழலின்படி அடிமை, ஊழியர், பணியாளர் எனப் பொருள்படும். இவர்கள் ஆபிராமின் வீட்டாரில் பயிற்சி பெற்ற ஆட்கள் என்பதால், சமூக நிலையை அளவுக்கு மீறித் தீர்மானிக்காத ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיַּכֵּם
  choice: முறியடித்தார்கள்
  rationale: נכה என்ற வினை ‘அடித்தல்/தாக்குதல்’ முதல் ‘தோற்கடித்தல்’ வரை பொருள்படும். போர் சூழலில் வெற்றிகரமான தாக்குதலைக் குறிக்க ‘முறியடித்தார்கள்’ இயல்பானது; அனைவரையும் கொன்றார்கள் என்று தேவையின்றி வலுப்படுத்தவில்லை.
- source_word: חוֹבָה
  choice: ஓபா
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது; அதன் சரியான நவீன அடையாளம் உறுதியற்றது.
- source_word: מִשְּׂמֹאל לְדַמָּשֶׂק
  choice: தமஸ்குவுக்கு வடக்கே
  rationale: எபிரேயத்தில் சொற்பொருளாக ‘தமஸ்குவின் இடப்புறத்தில்’ உள்ளது. கிழக்கு நோக்கிய திசைநிலைப்படி இடப்புறம் வடக்கைக் குறிக்கும்; இன்றைய தமிழ் வாசகருக்கு ‘வடக்கே’ தெளிவானது.
