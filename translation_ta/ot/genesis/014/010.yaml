id: GEN.14.10
reference: Genesis 14:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עֵ֣מֶק הַ/שִׂדִּ֗ים בֶּֽאֱרֹ֤ת בֶּאֱרֹת֙ חֵמָ֔ר וַ/יָּנֻ֛סוּ מֶֽלֶךְ סְדֹ֥ם וַ/עֲמֹרָ֖ה וַ/יִּפְּלוּ שָׁ֑מָּ/ה וְ/הַ/נִּשְׁאָרִ֖ים הֶ֥רָ/ה נָּֽסוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/010.yaml
  text: The Valley of Siddim was full of bitumen pits[a], and the kings of Sodom and Gomorrah fled and fell there[c][b], while the rest fled to the hill country.
translation:
  language: ta
  text: சித்தீம் பள்ளத்தாக்கு நிலக்கீல் குழிகள் நிறைந்ததாக இருந்தது[a]. சோதோம், கொமோரா ஆகிய நகரங்களின் அரசர்கள் தப்பியோடி, அங்கே விழுந்தார்கள்[b]; எஞ்சியவர்கள் மலைப்பகுதிக்குத் தப்பியோடினார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தார்க் குழிகள்” அல்லது “அஸ்பால்ட் குழிகள்”; எபிரெயச் சொல் நிலக்கீல் நிறைந்த குழிகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அவர்கள் சித்தீம் பள்ளத்தாக்கில் விழுந்தார்கள்; அங்கிருந்த நிலக்கீல் குழிகளில் விழுந்திருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “மலைகளுக்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵמֶק הַשִּׂדִּים
  choice: சித்தீம் பள்ளத்தாக்கு
  rationale: עֵמֶק என்பது ‘பள்ளத்தாக்கு’; הַשִּׂדִּים என்பது இடப்பெயர். தமிழில் இயல்பான இடப்பெயர்க் கட்டமைப்பாக வழங்கப்பட்டுள்ளது.
- source_word: בֶּאֱרֹת בֶּאֱרֹת חֵמָר
  choice: நிலக்கீல் குழிகள் நிறைந்ததாக இருந்தது
  rationale: ‘குழிகள்’ என்ற சொல்லின் இரட்டிப்பு அத்தகைய குழிகள் ஏராளமாக இருந்ததை வலியுறுத்துகிறது. חֵמָר என்பதற்கு தார் போன்ற இயற்கைப் பொருளைக் குறிக்கும் துல்லியமான நவீன சொல் ‘நிலக்கீல்’.
- source_word: וַיָּנֻסוּ ... נָסוּ
  choice: தப்பியோடி ... தப்பியோடினார்கள்
  rationale: போர்க்களத்திலிருந்து ஓடிப்போவதைக் குறிக்கும் נוס என்பதன் கருத்தை இயல்பாகவும் இரு இடங்களிலும் ஒரேவிதமாகவும் வெளிப்படுத்துகிறது.
- source_word: מֶלֶךְ סְדֹם וַעֲמֹרָה
  choice: சோதோம், கொமோரா ஆகிய நகரங்களின் அரசர்கள்
  rationale: מֶלֶךְ வடிவில் ஒருமையாக இருந்தாலும், பின்வரும் வினைகள் பன்மையில் உள்ளன; மேலும் சூழலில் இரு நகரங்களுக்கும் தனித்தனி அரசர்கள் உள்ளனர். எனவே பன்மை இயல்பானது.
- source_word: וַיִּפְּלוּ שָׁמָּה
  choice: அங்கே விழுந்தார்கள்
  rationale: נפל என்பதன் நேரடியான பொருள் ‘விழுதல்’. அவர்கள் குழிகளில் விழுந்திருக்கலாம் என்ற சூழல் சார்ந்த கருத்தை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்காமல், எபிரெய உரையின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: וְהַנִּשְׁאָרִים
  choice: எஞ்சியவர்கள்
  rationale: முன்னர் குறிப்பிடப்பட்டவர்களைத் தவிர மீதமிருந்தவர்களை இயல்பான தமிழில் குறிக்கிறது.
- source_word: הֶרָה
  choice: மலைப்பகுதிக்கு
  rationale: הַר என்பதுடன் திசையைக் குறிக்கும் முடிவு சேர்ந்துள்ளது. இது ‘மலைப்பகுதிக்கு’ அல்லது ‘மலைகளுக்கு’ என்று பொருள்படலாம்; முதன்மை உரையில் புவியியல் நிலப்பகுதியைக் குறிக்கும் இயல்பான தமிழ் தேர்ந்தெடுக்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. ‘நிலக்கீல்’ துல்லியத்திற்காக முதன்மை உரையில் வைக்கப்பட்டு, பரவலாக அறியப்பட்ட ‘தார்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது. எபிரெய உரையில் குழிகளுக்குள் விழுந்தார்கள் என்று நேரடியாகச் சொல்லப்படாததால் அந்தத் தெளிவின்மை முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது.
