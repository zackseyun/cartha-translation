translation_notes:
  register: நவீன செந்தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் ‘ராஜா’ என்பதற்குப் பதிலாக ‘அரசன்’ பயன்படுத்தப்பட்டது. மூலத்தின் சுருக்கமான பட்டியல் அமைப்பும் இறுதியில் வரும் எதிர்நிலை வலியுறுத்தலும் நீண்ட விளக்க வினைச்சொல் சேர்க்காமல் கோடுகுறி மூலம் பாதுகாக்கப்பட்டுள்ளன.
