source:
  edition: WLC
  text: אֵ֣ת כְּדָרְלָעֹ֜מֶר מֶ֣לֶךְ עֵילָ֗ם וְ/תִדְעָל֙ מֶ֣לֶךְ גּוֹיִ֔ם וְ/אַמְרָפֶל֙ מֶ֣לֶךְ שִׁנְעָ֔ר וְ/אַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר אַרְבָּעָ֥ה מְלָכִ֖ים אֶת הַ/חֲמִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/009.yaml
  text: Chedorlaomer king of Elam[a], Tidal king of Goiim, Amraphel king of Shinar, and Arioch king of Ellasar—four kings against the five.
translation:
  language: ta
  text: ஏலாம் அரசன் கெதர்லாகோமர், கோயீம்[a] அரசன் திதால், சிநெயார் அரசன் அம்ராப்பேல், எல்லாசார் அரசன் அரியோக்கு—ஐந்து அரசர்களுக்கு எதிராக நான்கு அரசர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாடுகளின் அரசன் திதால்.’ எபிரெயச் சொல் גּוֹיִם (கோயீம்) பொதுப்பெயராக ‘நாடுகள்’ என்று பொருள்படலாம்; இங்கு அது ஓர் இடப்பெயராகவும் இருக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵת ... אֶת
  choice: எதிராக
  rationale: போரைக் குறிக்கும் இந்தப் பட்டியல் அமைப்பில் אֵת எதிர்தரப்பைக் குறிக்கிறது. தமிழில் அந்த உறவைத் தெளிவாகவும் இயல்பாகவும் காட்ட ‘எதிராக’ பயன்படுத்தப்பட்டது.
- source_word: כְּדָרְלָעֹמֶר
  choice: கெதர்லாகோமர்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாக வழங்கும் பெயரெழுத்தாக்கம்.
- source_word: מֶלֶךְ עֵילָם
  choice: ஏலாம் அரசன்
  rationale: எபிரெய இணைப்புத் தொடரை இயல்பான தமிழ்ப் பெயரடை அமைப்பில் நேரடியாக வழங்குகிறது.
- source_word: תִדְעָל
  choice: திதால்
  rationale: தனிப்பெயர் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிக்கு ஏற்ப பெயரெழுத்தாக்கப்பட்டது.
- source_word: גּוֹיִם
  choice: கோயீம்
  rationale: இங்கு அரசரின் ஆட்சிப்பகுதியைக் குறிக்கும் இடப்பெயராக இருக்க வாய்ப்புள்ளதால் முதன்மை உரையில் ‘கோயீம்’ எனப் பெயரெழுத்தாக்கப்பட்டது; பொதுப்பெயரான ‘நாடுகள்’ என்ற வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: אַמְרָפֶל
  choice: அம்ராப்பேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் வழங்கும் பெயரெழுத்தாக்கம்.
- source_word: שִׁנְעָר
  choice: சிநெயார்
  rationale: வேறொரு வரலாற்றுப் பகுதியுடன் அடையாளப்படுத்தாமல் மூல இடப்பெயரே பெயரெழுத்தாக்கப்பட்டது.
- source_word: אַרְיוֹךְ
  choice: அரியோக்கு
  rationale: தனிப்பெயர் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֶלָּסָר
  choice: எல்லாசார்
  rationale: ஊகமான புவியியல் அடையாளத்தைச் சேர்க்காமல் மூல இடப்பெயர் பெயரெழுத்தாக்கப்பட்டது.
- source_word: אַרְבָּעָה מְלָכִים
  choice: இந்த நான்கு அரசர்கள்
  rationale: ‘நான்கு அரசர்கள்’ என்பது நேரடி பொருள்; முன் பட்டியலிடப்பட்டவர்களை இயல்பாகச் சுட்டுவதற்காக தமிழில் ‘இந்த’ சேர்க்கப்பட்டது.
- source_word: הַחֲמִשָּׁה
  choice: ஐந்து அரசர்கள்
  rationale: எபிரெயத்தில் ‘அந்த ஐவர்’ என்று சுருக்கமாக இருந்தாலும், தமிழில் யாரைக் குறிக்கிறது என்பதைத் தெளிவாக்க முன்சூழலிலிருந்து ‘அரசர்கள்’ வெளிப்படையாக வழங்கப்பட்டது.
