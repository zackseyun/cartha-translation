revisions:
- from: ஏலாம் அரசன் கெதர்லாகோமர், கோயீம்[a] அரசன் திதால், சிநெயார் அரசன் அம்ராப்பேல், எல்லாசார் அரசன் அரியோக்கு—ஐந்து அரசர்களுக்கு எதிராக இந்த நான்கு அரசர்கள்.
  to: ஏலாம் அரசன் கெதர்லாகோமர், கோயீம்[a] அரசன் திதால், சிநெயார் அரசன் அம்ராப்பேல், எல்லாசார் அரசன் அரியோக்கு—ஐந்து அரசர்களுக்கு எதிராக நான்கு அரசர்கள்.
