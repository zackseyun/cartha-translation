  text: וַ/יֵּצֵ֣א מֶֽלֶךְ סְדֹם֮ לִ/קְרָאת/וֹ֒ אַחֲרֵ֣י שׁוּב֗/וֹ מֵֽ/הַכּוֹת֙ אֶת כְּדָרלָעֹ֔מֶר וְ/אֶת הַ/מְּלָכִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ אֶל עֵ֣מֶק שָׁוֵ֔ה ה֖וּא עֵ֥מֶק הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/017.yaml
  text: Then the king of Sodom went out to meet him after his return from defeating Kedorlaomer and the kings who were with him[a], to the Valley of Shaveh (that is[b], the King's Valley).
translation:
  language: ta
  text: கெதர்லாகோமரையும் அவனோடு இருந்த அரசர்களையும் தோற்கடித்துவிட்டுத் திரும்பி வந்த ஆபிராமைச் சந்திக்க, சோதோமின் அரசன் சாவே பள்ளத்தாக்கிற்கு—அதாவது, அரசரின் பள்ளத்தாக்கிற்கு அல்ல, அரசரின் பள்ளத்தாக்கு—புறப்பட்டுச் சென்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: புறப்பட்டுச் சென்றான்
  rationale: தொடர்ந்து நிகழும் கதைச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது; ஒருவரைச் சந்திக்க ஓர் இடத்திற்குச் சென்ற இயக்கத்தையும் தெளிவாக்குகிறது.
- source_word: מֶלֶךְ סְדֹם
  choice: சோதோமின் அரசன்
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: לִקְרָאתוֹ
  choice: ஆபிராமைச் சந்திக்க
  rationale: சொல்லின் இயல்பான பொருள் ‘அவனைச் சந்திக்க’ என்பதாகும். சூழலில் அந்தப் பதிலிப்பெயர் ஆபிராமைக் குறிப்பதால், தமிழில் தவறான தொடர்பு ஏற்படாதவாறு பெயர் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אַחֲרֵי שׁוּבוֹ מֵהַכּוֹת
  choice: தோற்கடித்துவிட்டுத் திரும்பி வந்த
  rationale: நכה என்பதன் இச்சூழலிலான போர்வெற்றிப் பொருளையும், வெற்றிக்குப் பின் திரும்பிய காலவரிசையையும் இயல்பாகக் காக்கிறது.
- source_word: כְּדָרלָעֹמֶר
  choice: கெதர்லாகோமர்
  rationale: எபிரெயப் பெயரின் ஒலிவடிவத்தைத் தமிழில் நேரடியாகவும் வாசிக்க ஏதுவாகவும் எழுத்துப்பெயர்க்கிறது.
- source_word: וְאֶת־הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: அவனோடு இருந்த அரசர்களையும்
  rationale: இங்குள்ள ‘அவன்’ கெதர்லாகோமரைக் குறிக்கிறது; தொடர்புச் சொல்லமைப்பு இயல்பான தமிழில் காக்கப்பட்டுள்ளது.
- source_word: אֶל עֵמֶק שָׁוֵה
  choice: சாவே பள்ளத்தாக்கிற்கு
  rationale: אֶל என்பதன் திசைநோக்கிய பொருளை ‘-க்கு’ விகுதி காக்கிறது; சாவே இடப்பெயராக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: הוּא עֵמֶק הַמֶּלֶךְ
  choice: அதாவது, அரசனின் பள்ளத்தாக்கிற்கு
  rationale: முந்தைய இடப்பெயரை அடையாளப்படுத்தும் விளக்கக் கூற்றைத் தமிழில் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
