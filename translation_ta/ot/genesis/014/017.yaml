translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் பதிலிப்பெயராக உள்ள ஆபிராமின் பெயர், தமிழில் கெதர்லாகோமருடன் குழப்பம் ஏற்படாமல் இருக்கச் சூழலின் அடிப்படையில் வெளிப்படுத்தப்பட்டுள்ளது. இடத்தை நோக்கிய இயக்கத்தைக் காக்க ‘பள்ளத்தாக்கிற்கு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
