  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ סְדֹ֖ם אֶל אַבְרָ֑ם תֶּן לִ֣/י הַ/נֶּ֔פֶשׁ וְ/הָ/רְכֻ֖שׁ קַֽח לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/021.yaml
  text: Then the king of Sodom said to Abram[a], “Give me the people[b], and take the possessions for yourself.”
translation:
  language: ta
  text: அப்போது சோதோமின் அரசன் ஆபிராமிடம், “மக்களை[a] எனக்குக் கொடு; உடைமைகளை[b] உனக்காக எடுத்துக்கொள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் எழுத்துப்படி, “உயிரை” அல்லது “ஆளை” என்று ஒருமையில் உள்ளது; இங்கு அது மீட்கப்பட்ட மக்களைக் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “பொருட்களை” அல்லது “சொத்துகளை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர் கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; நவீனத் தமிழில் இயல்பான தொடர்ச்சியை ‘அப்போது’ வெளிப்படுத்துகிறது.
- source_word: מֶלֶךְ סְדֹם
  choice: சோதோமின் அரசன்
  rationale: எபிரெயக் கட்டமைப்பு இயல்பான தமிழ் உடைமைத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: אֶל אַבְרָם
  choice: ஆபிராமிடம்
  rationale: אֶל என்பதன் திசை/முகவரி பொருளை பேச்சு வினையுடன் இயல்பாக ‘-இடம்’ வெளிப்படுத்துகிறது.
- source_word: תֶּן לִי
  choice: என்னிடம் ஒப்படைத்துவிடும்
  rationale: சூழலில் மீட்கப்பட்ட மக்களை அரசனிடம் திருப்பிக் கொடுக்குமாறு கேட்பதால், வெறும் ‘கொடும்’ என்பதைக் காட்டிலும் ‘ஒப்படைத்துவிடும்’ நோக்கத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַנֶּפֶשׁ
  choice: மக்களை
  rationale: נֶפֶשׁ ஒருமையில் இருந்தாலும் இங்கு கூட்டுப்பொருளில் மீட்கப்பட்ட ஆட்களைக் குறிக்கிறது; ‘மக்கள்’ இயல்பான நவீனத் தமிழ். மூலத்தின் ஒருமை வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: וְהָרְכֻשׁ
  choice: உடைமைகளை
  rationale: רְכוּשׁ அசையும் சொத்து, பொருட்கள் அல்லது உடைமைகளைக் குறிக்கும்; மக்களுடன் காணப்படும் எதிர்மறை இணைப்பை ‘உடைமைகள்’ பரந்த முறையில் காக்கிறது.
- source_word: קַח לָךְ
  choice: நீர் எடுத்துக்கொள்ளும்
  rationale: לָךְ தரும் தனக்கான பயன்/உரிமை நுணுக்கத்தை ‘எடுத்துக்கொள்ளும்’ இயல்பாக வெளிப்படுத்துகிறது; மரியாதையான ஒருமை கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது.
