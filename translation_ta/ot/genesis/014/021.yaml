revisions:
- from: அப்போது சோதோமின் அரசன் ஆபிராமிடம், “மக்களை[a] என்னிடம் ஒப்படைத்துவிடும்; உடைமைகளை[b] நீர் எடுத்துக்கொள்ளும்” என்றான்.
  to: அப்போது சோதோமின் அரசன் ஆபிராமிடம், “மக்களை[a] எனக்குக் கொடு; உடைமைகளை[b] உனக்காக எடுத்துக்கொள்” என்றான்.
  rationale: The revision replaces an interpretively stronger request with the direct equivalent “எனக்குக் கொடு” and uses parallel, non-honorific singular imperatives (“கொடு … எடுத்துக்கொள்”). “உனக்காக” explicitly conveys the benefactive force of לָךְ. Footnote markers remain attached to the terms they explain, and both notes retain the lexical alternatives and the collective contextual sense.
