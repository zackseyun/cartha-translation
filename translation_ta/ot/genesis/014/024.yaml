base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/024.yaml
  text: I will take nothing except only what the young men have eaten[a], and the share of the men who went with me—Aner, Eshcol, and Mamre[c][b]. Let them take their share.
translation:
  language: ta
  text: நான் எதையும் எடுத்துக்கொள்ள மாட்டேன்; இளைஞர்கள் சாப்பிட்டது, என்னுடன் சென்ற மனிதர்களான ஆனேர், எஸ்கோல், மம்ரே ஆகியோரின் பங்கு ஆகியவை மட்டும் விதிவிலக்குகள்.[a] அவர்கள் தங்கள் பங்கை எடுத்துக்கொள்ளட்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பணியாளர்கள் சாப்பிட்டது.’ הַנְּעָרִים என்ற எபிரெயச் சொல் சூழலுக்கேற்ப இளைஞர்களையோ பணியாளர்களையோ உடனிருந்தவர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்கள் தங்கள் பங்கை எடுத்துக்கொள்வார்கள்.’ எபிரெய வினைவடிவத்தை எளிய எதிர்காலமாகவும் புரிந்துகொள்ளலாம்; இங்கு அனுமதிப் பொருள் சூழலுக்கு ஏற்றதாக உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלְעָדַי רַק
  choice: எனக்கென்று எதையும் எடுத்துக்கொள்ள மாட்டேன்; ... மட்டுமே விதிவிலக்கு
  rationale: எபிரெய உரை முந்தைய வசனத்திலுள்ள ஆபிராமின் மறுப்பைச் சார்ந்த விதிவிலக்குத் தொடராகத் தொடங்குகிறது. தமிழில் முழுமையான, இயல்பான வாக்கியமாக அமைய மறைமுகமாக உள்ள வினை சேர்க்கப்பட்டது; רַק தரும் கட்டுப்படுத்தும் வலியுறுத்தலை ‘மட்டுமே’ காக்கிறது.
- source_word: אֲשֶׁר אָכְלוּ הַנְּעָרִים
  choice: இளைஞர்கள் சாப்பிட்டதும்
  rationale: נְעָרִים என்பதன் நேரடியான பொருள் ‘இளைஞர்கள்’; சூழலில் பணியாளர்கள் அல்லது உடனிருப்பவர்களையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְחֵלֶק הָאֲנָשִׁים אֲשֶׁר הָלְכוּ אִתִּי
  choice: என்னுடன் வந்த மனிதர்களான ... ஆகியோரின் பங்கும்
  rationale: חֵלֶק என்பது கொள்ளைப் பொருள் பகிர்வுச் சூழலில் ‘பங்கு’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது; הלך என்பதிலுள்ள உடன் சென்ற இயக்கக் கருத்து ‘என்னுடன் வந்த’ என்பதில் காக்கப்படுகிறது.
- source_word: עָנֵר אֶשְׁכֹּל וּמַמְרֵא
  choice: ஆனேர், எஸ்கோல், மம்ரே
  rationale: ஆட்பெயர்கள் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: הֵם יִקְחוּ חֶלְקָם
  choice: அவர்கள் தங்கள் பங்கை எடுத்துக்கொள்ளட்டும்
  rationale: இச்சூழலில் எபிரெய நிறைவுறா வினை எதிர்கால முன்னறிவிப்பைவிட அனுமதி அல்லது இசைவை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: முந்தைய வசனத்திலிருந்து தொடரும் மறைமுக மறுப்பு
  choice: ‘எனக்கென்று எதையும் எடுத்துக்கொள்ள மாட்டேன்’ என்று மறைமுக வினையை வெளிப்படையாகச் சேர்த்தல்
  alternative: ‘இளைஞர்கள் சாப்பிட்டதும் ... பங்கும் மட்டும்’ என்ற வினையற்ற தொடராக விடுதல்
  rationale: בִּלְעָדַי என்பது முந்தைய வசனத்தின் மறுப்பைச் சார்ந்துள்ளது. தமிழில் பொருள் தெளிவாகவும் வாக்கியம் முழுமையாகவும் இருக்க, புதிய இறையியல் கருத்தைச் சேர்க்காமல் அந்த மறைமுகத் தொடர்ச்சி வெளிப்படுத்தப்படுகிறது.
- issue: יִקְחוּ என்பதன் செயல்பாட்டு நுட்பம்
  choice: அனுமதியாக ‘எடுத்துக்கொள்ளட்டும்’
  alternative: எளிய எதிர்காலமாக ‘எடுத்துக்கொள்வார்கள்’
  rationale: ஆபிராம் தனக்கான கொள்ளைப் பங்கை மறுத்தாலும் கூட்டாளிகள் தங்களுக்குரிய பங்கைப் பெற அனுமதிக்கும் சூழல், அனுமதிப் பொருளை ஆதரிக்கிறது; மாற்று இலக்கண வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் உரைநடைக் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘எனக்கென்று’, ‘மட்டுமே விதிவிலக்கு’ ஆகியவை முந்தைய வசனத்தைச் சார்ந்த எபிரெயத் துண்டை தமிழில் தெளிவான முழு வாக்கியமாக்குகின்றன; பெயர்ப் பட்டியலின் இயல்பான ஓட்டமும் காக்கப்பட்டுள்ளது.
