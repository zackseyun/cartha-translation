source:
  edition: WLC
  text: אִם מִ/חוּט֙ וְ/עַ֣ד שְׂרֽוֹךְ נַ֔עַל וְ/אִם אֶקַּ֖ח מִ/כָּל אֲשֶׁר לָ֑/ךְ וְ/לֹ֣א תֹאמַ֔ר אֲנִ֖י הֶעֱשַׁ֥רְתִּי אֶת אַבְרָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/023.yaml
  text: that I would not take from a thread to a sandal strap[a], or anything that is yours, lest you say, ‘I have made Abram rich.’
translation:
  language: ta
  text: ஒரு நூலிலிருந்து செருப்பின் வார்வரை, உனக்குச் சொந்தமான எதையும் நான் எடுத்துக்கொள்ள மாட்டேன்[a]; அப்போது, ‘நான்தான் ஆபிராமைச் செல்வந்தனாக்கினேன்’ என்று நீ சொல்லாதபடி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் இது விடுபட்ட ஓர் ஆணைச் சூத்திரம். சொல்லுக்குச் சொல்: “ஒரு நூலிலிருந்து செருப்பின் வார்வரை என்றால், உனக்குச் சொந்தமான எல்லாவற்றிலிருந்தும் நான் எடுத்தால்...” இதன் பொருள், எதையும் எடுத்துக்கொள்ள மாட்டேன் என்று ஆணையிட்டு மறுப்பதாகும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם ... וְאִם
  choice: எதையும் நான் எடுத்துக்கொள்ள மாட்டேன்
  rationale: முந்தைய வசனத்தில் தொடங்கிய ஆணையின் தொடர்ச்சியாக இது மறுப்பை உணர்த்தும் விடுபட்ட எபிரெய ஆணைச் சூத்திரம். தமிழில் அதன் பொருளைத் தெளிவாக எதிர்மறை வாக்கியமாகத் தருகிறது.
- source_word: מִחוּט
  choice: ஒரு நூல்
  rationale: חוּט என்பது நூல் அல்லது மெல்லிய கயிற்றைக் குறிக்கிறது; மிகச் சிறிய பொருளைக் குறிக்கும் மூலப்படிமத்தைப் பேணுகிறது.
- source_word: וְעַד שְׂרֹוךְ נַעַל
  choice: செருப்பின் வார்வரை
  rationale: பண்டைய காலச் செருப்பைக் கட்டும் வாரை இயல்பான நவீன தமிழில் குறிக்கிறது; ‘நூல் முதல் ... வரை’ என்ற எபிரெய வரம்பையும் பேணுகிறது.
- source_word: אֶקַּח
  choice: நான் எடுத்துக்கொள்ள மாட்டேன்
  rationale: ஆணைச் சூழலில் வினைச்சொல் உறுதியான மறுப்பைத் தெரிவிப்பதால் தமிழில் எதிர்மறை எதிர்கால வடிவம் இயல்பானது.
- source_word: מִכָּל אֲשֶׁר לָךְ
  choice: உனக்குச் சொந்தமானவற்றில் ... எதையும்
  rationale: உடைமைப் பொருளையும் כָּל என்பதன் முழுமையான பரப்பையும் தெளிவாகத் தருகிறது.
- source_word: וְלֹא תֹאמַר
  choice: என்று நீ சொல்ல முடியாது
  rationale: ஆபிராமின் மறுப்பின் நோக்கத்தையும் அதன் விளைவாக அரசன் பெருமைபாராட்ட இயலாததையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הֶעֱשַׁרְתִּי
  choice: நான்தான் ... செல்வந்தனாக்கினேன்
  rationale: עשר என்பதன் ஹிஃபில் வடிவமான ‘செல்வந்தனாக்கு’ என்ற காரணவினைப் பொருளைப் பேணுகிறது; எழுவாயின் பெருமைபாராட்டை ‘நான்தான்’ வெளிப்படுத்துகிறது.
- source_word: אַבְרָם
  choice: ஆபிராம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
theological_decisions:
- issue: விடுபட்ட ஆணைச் சூத்திரம்
  choice: ஆணையுடன் கூடிய உறுதியான மறுப்பாக, ‘எதையும் நான் எடுத்துக்கொள்ள மாட்டேன்’ என்று மொழிபெயர்த்தல்
  alternative: ‘ஒரு நூல் முதல் செருப்பின் வார்வரை என்றால், உனக்குரிய எதையாவது நான் எடுத்தால்...’ என சொற்சொல்லாக நிபந்தனை வடிவில் தருதல்
  rationale: אִם ... וְאִם என்பது இங்கு சாதாரண நிபந்தனை அல்ல; முந்தைய வசனத்தில் ஆபிராம் கையை உயர்த்தி ஆணையிட்டதன் தொடர்ச்சியான, தண்டனைப் பகுதி விடுபட்ட ஆணைச் சூத்திரம். மறுப்பை வெளிப்படுத்துவது பொருளைத் தெளிவாக்குகிறது; விடுபட்ட மூலவடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: அரசனின் சாத்தியமான பெருமைபாராட்டு
  choice: ‘நான்தான் ஆபிராமைச் செல்வந்தனாக்கினேன்’
  alternative: ‘நான் ஆபிராமைச் செல்வந்தனாக்கினேன்’
  rationale: எபிரெயத்தில் தனிப்பட்ட சுட்டுப்பெயர் אֲנִי வினை வடிவத்துக்கு மேலாக வெளிப்படையாக இருப்பதால், ‘நான்தான்’ அதன் வலியுறுத்தலை இயல்பான தமிழில் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் ஆணையின் கண்ணியமான தொனியைப் பேணும் வகையிலும் வடிவமைக்கப்பட்டது. ‘செருப்பின் வார்’ பண்டைய பொருளைத் துல்லியமாகவும் இயல்பாகவும் காட்டுகிறது.
