source:
  edition: WLC
  text: וּ/בָרוּךְ֙ אֵ֣ל עֶלְי֔וֹן אֲשֶׁר מִגֵּ֥ן צָרֶ֖י/ךָ בְּ/יָדֶ֑/ךָ וַ/יִּתֶּן ל֥/וֹ מַעֲשֵׂ֖ר מִ/כֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/020.yaml
  text: And blessed be God Most High[a], who delivered your enemies into your hand[b]. And he gave him a tenth of everything.
translation:
  language: ta
  text: '“உன் எதிரிகளை உன் கையில் ஒப்புக்கொடுத்த உன்னதமான இறைவன் போற்றப்படுவாராக!”


    மேலும், அவர் அவருக்கு எல்லாவற்றிலிருந்தும் பத்தில் ஒரு பங்கைக்[b] கொடுத்தார்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கொடுத்தார்’ என்பதற்கான எழுவாயை எபிரெயம் மீண்டும் குறிப்பிடவில்லை. சூழலின்படி ஆபிராம் மெல்கிசேதேக்கிற்குப் பத்தில் ஒரு பங்கைக் கொடுத்தார் என்பதே மிகவும் இயல்பான பொருள்; மெல்கிசேதேக்கு கொடுத்தார் என்ற வாசிப்பும் இலக்கண அளவில் சாத்தியம்.
    reason: alternative_reading
  - marker: b
    text: மரபுவழியாக, “தசமபாகம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: போற்றப்படுவாராக
  rationale: ஆசீர்வாத அறிவிப்பாக வரும் எபிரெயப் பெயரெச்சத் தொடரை, நவீனத் தமிழில் இறைவனைப் புகழும் இயல்பான வாழ்த்துத் தொடராக அளிக்கிறது.
- source_word: אֵל עֶלְיוֹן
  choice: உன்னதமான இறைவன்
  rationale: אֵל என்பதை இறைவன் என்றும், עֶלְיוֹן என்னும் உயர்நிலைத் திருப்பெயரை உன்னதமான என்றும் பொருள் தெளிவுடன் வழங்குகிறது.
- source_word: מִגֵּן
  choice: ஒப்புக்கொடுத்த
  rationale: இங்கு ‘காத்தார்’ என்பதல்ல, எதிரிகளை ஒருவரது அதிகாரத்துக்குள் ஒப்படைத்தார் என்ற வினைப்பொருள் உள்ளது; ‘உன் கையில்’ என்ற மூல உருவகத்தோடும் இது இயல்பாகப் பொருந்துகிறது.
- source_word: צָרֶיךָ
  choice: உன் எதிரிகளை
  rationale: இரண்டாம் நபர் ஒருமை உரிமை விகுதியுடன் வரும் பன்மைச் சொல்லின் தெளிவான நவீனத் தமிழ் வடிவம்.
- source_word: בְיָדֶךָ
  choice: உன் கையில்
  rationale: ஒருவரது அதிகாரத்துக்குள் கொடுத்தல் என்ற எபிரெய உருவகத்தைத் தமிழிலும் புரியக்கூடிய நேரடி வடிவில் காக்கிறது.
- source_word: וַיִּתֶּן לוֹ
  choice: பின்பு அவர் அவருக்குக் கொடுத்தார்
  rationale: தொடர்நிகழ்வைக் குறிக்கும் வினை வடிவை ‘பின்பு’ என இயல்பாகக் காட்டுகிறது; மூலத்தில் எழுவாய் மீண்டும் குறிப்பிடப்படாததால் பெயர்களைச் சேர்க்காமல் சுட்டுப்பெயர்களையே வைத்திருக்கிறது.
- source_word: מַעֲשֵׂר
  choice: பத்தில் ஒரு பங்கு
  rationale: சொல்லின் அடிப்படைப் பொருளான ‘பத்திலொன்று’ என்பதை, பின்னாளைய நிறுவனம் சார்ந்த நிழற்பொருளைத் தேவையின்றி ஏற்றாமல் எளிய தமிழில் தருகிறது.
- source_word: מִכֹּל
  choice: எல்லாவற்றிலிருந்தும்
  rationale: முழுத் தொகையிலிருந்து அந்தப் பங்கு எடுக்கப்பட்டது என்ற מִן முன்னிடைச்சொல்லின் பொருளையும் כֹּל என்பதன் முழுமையையும் காக்கிறது.
theological_decisions:
- issue: וַיִּתֶּן என்ற வினையின் மறைந்துள்ள எழுவாய் யார்?
  choice: பெயரைச் சேர்க்காமல், ‘அவர் அவருக்கு ... கொடுத்தார்’ என மூலத்தின் சுட்டுப்பெயர் அமைப்பை வைத்தல்; சூழலில் ஆபிராம் மெல்கிசேதேக்கிற்குக் கொடுத்தார் என்பதே இயல்பான வாசிப்பு.
  alternative: மெல்கிசேதேக்கு ஆபிராமுக்குக் கொடுத்தார் என்று வாசித்தல்.
  rationale: எபிரெய வாக்கியம் எழுவாயை மீண்டும் வெளிப்படையாகக் கூறவில்லை. முன்னும் பின்னுமுள்ள சூழலும் பிற்கால வேதாகமச் சான்றும் ஆபிராமை எழுவாயாக வலுவாகச் சுட்டினாலும், உண்மையான இலக்கண மறைபொருளை மொழிபெயர்ப்பில் பெயர் சேர்த்து முற்றாகத் தீர்த்துவிடாமல் அடிக்குறிப்பில் விளக்குவது பொருத்தமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு மரியாதையைத் தக்கவைக்கும் எளிய நடையைப் பயன்படுத்துகிறது. ‘உன்னதமான இறைவன்’, ‘உன் கையில்’ ஆகியவை மூலத்தின் திருப்பெயரையும் உருவகத்தையும் காக்கின்றன. இரு ஆண் நபர்களையும் மரியாதைப் பன்மைச் சுட்டுப்பெயர்களால் குறிப்பதால், தமிழ் நடையில் கண்ணியம் காக்கப்படுவதோடு மூலத்தின் எழுவாய் மறைவும் வெளிப்படையாகத் தீர்க்கப்படவில்லை.
