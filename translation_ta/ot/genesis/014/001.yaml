base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/001.yaml
  text: 'And it happened in the days of Amraphel king of Shinar[a], Arioch king of Ellasar, Chedorlaomer king of Elam, and Tidal king of nations:'
translation:
  language: ta
  text: 'சிநெயாரின் அரசன் அம்ராப்பேல், எல்லாசாரின் அரசன் அரியோக், ஏலாமின் அரசன் கெதர்லாயோமெர், கோயிமின்[a] அரசன் திதால் ஆகியோரின் நாட்களில் நிகழ்ந்தது என்னவென்றால்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேசங்களின் அரசன்.” எபிரெயத்தில் கோயிம் என்பது பொதுவாக “தேசங்கள்” என்று பொருள்படும்; ஆனால் இங்கே மற்ற அரசப் பட்டங்களைப் போல ஓர் இடப்பெயராகவும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: நிகழ்ந்தது என்னவென்றால்
  rationale: எபிரெயக் கதைத் தொடக்கத்தைப் பழமையான வழக்கின்றி இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; அடுத்த வசனத்தில் நிறைவடையும் வாக்கியத்தையும் திறந்த நிலையில் வைத்திருக்கிறது.
- source_word: בִּימֵי
  choice: ஆகியோரின் நாட்களில்
  rationale: ‘நாட்களில்’ என்ற மூல உருவகத்தையும் காலச் சூழல் அறிமுகத்தையும் காக்கிறது.
- source_word: אַמְרָפֶל מֶלֶךְ שִׁנְעָר
  choice: சிநெயாரின் அரசன் அம்ராப்பேல்
  rationale: தனிப்பெயரையும் இடப்பெயரையும் ஒலிபெயர்த்து, தமிழ் மொழியின் இயல்பான பட்டப்பெயர் வரிசையில் தருகிறது.
- source_word: אַרְיוֹךְ מֶלֶךְ אֶלָּסָר
  choice: எல்லாசாரின் அரசன் அரியோக்
  rationale: அரசப் பட்டமும் இடப்பெயரும் நேரடியாகத் தரப்பட்டு, பெயர்கள் எபிரெய ஒலிக்கு அண்மையாக ஒலிபெயர்க்கப்படுகின்றன.
- source_word: כְּדָרְלָעֹמֶר מֶלֶךְ עֵילָם
  choice: ஏலாமின் அரசன் கெதர்லாயோமெர்
  rationale: மெய்யெழுத்து மற்றும் உயிர்க்குறிப்புகளின் அடிப்படையில் தனிப்பெயரை ஒலிபெயர்த்து, ஏலாம் என்ற இடப்பெயரைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְתִדְעָל מֶלֶךְ גּוֹיִם
  choice: கோயிமின் அரசன் திதால்
  rationale: இவ்வசனத்தின் இணை அமைப்பில் גּוֹיִם ஓர் இடப்பெயராகச் செயல்படக்கூடும் என்பதால் முதன்மை உரையில் ஒலிபெயர்க்கப்படுகிறது; அதன் பொதுவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: גּוֹיִם என்பது இடப்பெயரா அல்லது பொதுப்பெயரா
  choice: முதன்மை உரையில் ‘கோயிம்’ என்ற இடப்பெயர் ஒலிபெயர்ப்பு
  alternative: ‘தேசங்களின் அரசன்’
  rationale: மற்ற மூன்று அரசர்களின் பட்டங்களிலும் அரசாட்சிப் பகுதியின் பெயர் வருவதால் இடப்பெயர் வாசிப்பு சூழலுக்கு நன்றாகப் பொருந்துகிறது; எனினும் எபிரெயச் சொல்லின் வழக்கமான பொருளை அடிக்குறிப்பு மூலம் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரசப் பட்டங்கள் தமிழின் இயல்பான ‘இடத்தின் அரசன் + பெயர்’ வரிசையில் அமைக்கப்பட்டுள்ளன. வசனம் அடுத்த வசனத்துடன் தொடரும் இலக்கண அமைப்பை இறுதிக் குறியீடு காக்கிறது.
