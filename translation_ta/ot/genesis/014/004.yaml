lexical_decisions:
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: பன்னிரண்டு ஆண்டுகள்
  rationale: எபிரெயச் சொற்றொடர் கால நீடிப்பைக் குறிக்கிறது; தமிழில் இந்த வடிவமே இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: עָבְדוּ אֶת כְּדָרְלָעֹמֶר
  choice: அவர்கள் கெதர்லாகோமேருக்குக் கீழ்ப்பட்டிருந்தார்கள்
  rationale: עבד என்பதன் அடிப்படைப் பொருள் ‘பணிசெய்’ என்றாலும், இங்குள்ள அரசியல் சூழலில் ஓர் அரசனுக்குக் கப்பம் செலுத்திக் கீழ்ப்பட்டிருக்கும் சிற்றரசர்களின் நிலையைக் குறிக்கிறது. ‘கீழ்ப்பட்டிருந்தார்கள்’ என்பது அதை இயல்பான நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כְּדָרְלָעֹמֶר
  choice: கெதர்லாகோமேர்
  rationale: தனிப்பெயர் எபிரெய ஒலிப்புக்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: ஆனால் பதின்மூன்றாம் ஆண்டில்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘பதின்மூன்று ஆண்டு’ என இருந்தாலும், முந்தைய பன்னிரண்டு ஆண்டுகளுக்குப் பின் வந்த பதின்மூன்றாம் ஆண்டை இது குறிக்கிறது. இணைப்புச் சொல் இங்கு நிகழும் மாறுபாட்டைத் தமிழில் ‘ஆனால்’ என இயல்பாகக் காட்டுகிறது.
- source_word: מָרָדוּ
  choice: கலகம் செய்தார்கள்
  rationale: מרד என்பது ஆட்சிக்கு எதிராகக் கிளர்தல் அல்லது கலகம் செய்தல் என்று பொருள்படும்; இங்குள்ள அரசியல் சூழலுக்கு ‘கலகம் செய்தார்கள்’ பொருத்தமானது.
