revisions:
- from: பன்னிரண்டு ஆண்டுகள் அவர்கள் கெதர்லாகோமேருக்குக் கீழ்ப்பட்டிருந்தார்கள்; ஆனால் பதின்மூன்றாம் ஆண்டில் அவர்கள் கலகம் செய்தார்கள்.
  to: அவர்கள் பன்னிரண்டு ஆண்டுகள் கெதர்லாயோமருக்குக் கீழ்ப்பட்டிருந்தார்கள்; ஆனால் பதின்மூன்றாம் ஆண்டில் கிளர்ச்சி செய்தார்கள்.[a]
  rationale: The revision retains the source's twelve-year period of subjection and rebellion in the thirteenth year, while correcting the personal-name transliteration, using a more precise term for political revolt, and preserving the audit-trail alternative-name footnote anchor.
