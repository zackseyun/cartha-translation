  language: ta
  text: அவர்கள் பன்னிரண்டு ஆண்டுகள் கெதர்லாயோமருக்குக் கீழ்ப்பட்டிருந்தார்கள்; ஆனால் பதின்மூன்றாம் ஆண்டில் கிளர்ச்சி செய்தார்கள்.[a]
  philosophy: optimal-equivalence
