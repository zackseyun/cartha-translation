  yaml_path: translation/ot/genesis/014/003.yaml
  text: All these joined together in the Valley of Siddim (that is[a], the Salt Sea).
translation:
  language: ta
  text: இவர்கள் அனைவரும் சித்தீம் பள்ளத்தாக்கில் ஒன்றுசேர்ந்தனர்; அதுவே[a] உப்புக் கடல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பிற்காலப் பெயரின்படி, சாக்கடல்.
    reason: பிற்காலத்தில் பரவலாக அறியப்படும் இடப்பெயரை வழங்குகிறது; மூல எபிரெயத்தின் ‘உப்புக் கடல்’ என்ற பெயர் முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: இவர்கள் அனைவரும்
  rationale: כָּל உடன் வரும் אֵלֶּה அனைவரையும் கூட்டாகக் குறிக்கிறது. சூழலில் அரசர்கள் குறிக்கப்பட்டாலும், எபிரெயத்தில் இல்லாத ‘அரசர்கள்’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: חָבְרוּ
  choice: ஒன்றுகூடினார்கள்
  rationale: חבר என்ற வினையின் கால் வடிவம் ஒன்றுசேர்தல் அல்லது இணைதல் என்னும் அடிப்படைப் பொருளைக் கொண்டது. ‘கூட்டணி அமைத்தார்கள்’ என்பது அரசியல் நோக்கத்தை அதிகமாக விளக்கிவிடும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: אֶל
  choice: -இல்
  rationale: אֶל பொதுவாக திசையைக் குறித்தாலும், இங்கு ஒன்றுகூடும் வினையுடன் இடத்தைச் சுட்டுகிறது; இயல்பான தமிழில் இடவேற்றுமை உருபு பொருத்தமானது.
- source_word: עֵמֶק הַשִּׂדִּים
  choice: சித்தீம் பள்ளத்தாக்கு
  rationale: עֵמֶק என்பது பள்ளத்தாக்கைக் குறிக்கிறது; שִׂדִּים இடப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: הוּא
  choice: அதுதான்
  rationale: முன்னர் கூறப்பட்ட சித்தீம் பள்ளத்தாக்கை அடுத்து வரும் இடத்துடன் அடையாளப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָם הַמֶּלַח
  choice: உப்புக் கடல்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘உப்புக் கடல்.’ பிற்காலத்தில் பரவலான ‘சவக்கடல்’ என்ற பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
