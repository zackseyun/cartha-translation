  source_fidelity: மூல எபிரெயத்தின் כָּל־אֵלֶּה, חָבְרוּ, עֵמֶק הַשִּׂדִּים, மற்றும் יָם הַמֶּלַח ஆகியவை பெரும்பாலும் சரியாகப் பிரதிபலிக்கப்படுகின்றன. ஆனால் ‘இவர்கள்’ என்பது தமிழில் மனிதர்களைக் குறிக்கும் சுட்டுப்பெயர்; மூலத்தின் ‘இவர்கள் அனைவரும்’ என்பது முன்னைய வசனங்களில் குறிப்பிடப்பட்ட அரசர்களைச் சுட்டுவதால் சூழலுக்கு ஏற்றது. இருப்பினும் ‘ஒன்றுகூடினார்கள்’ என்பது வெறும் கூடுகையைச் சுட்டி, חָבְרוּ-வின் ‘ஒன்றுசேர்ந்தனர்/இணைந்தனர்’ என்னும் தொடர்புச் சாயலை ஓரளவு குறைக்கிறது. ‘ஒன்றுசேர்ந்தனர்’ பாதுகாப்பான, நேரடியான தேர்வு.
  naturalness: ‘சித்தீம் பள்ளத்தாக்கில்’ மற்றும் ‘உப்புக் கடல்’ இயல்பான நவீன பொதுத்தமிழாக உள்ளன. ‘அதுதான்’ பேச்சுவழக்குச் சாயலுடையது; விளக்க அடையாளப்படுத்தலுக்கான ‘அதுவே’ கண்ணியமான வேதாகம உரைநடையிலும் நவீன தமிழிலும் இயல்பாக அமையும். அடிக்குறிப்பில் ‘சவக்கடல்’ என்பதற்குப் பதிலாகப் பரவலாக நிலைபெற்ற ‘சாக்கடல்’ பயன்படுத்தப்பட வேண்டும்.
  terminology: சித்தீம் இடப்பெயர் ஒலிபெயர்ப்பாக ஏற்றது. ‘உப்புக் கடல்’ மூலப்பெயரைத் துல்லியமாகப் பாதுகாக்கிறது. பிற்கால/நவீன பெயரை அடிக்குறிப்பில் ‘சாக்கடல்’ எனத் தருவது தமிழ்ப் பயன்பாட்டுக்கு ஒத்தது. ஆங்கில அடிக்குறிப்பின் ‘Or, by later name’ என்ற தகுதியைத் தமிழில் ‘பிற்காலப் பெயரின்படி’ எனத் தக்கவைத்தல் சரியானது.
