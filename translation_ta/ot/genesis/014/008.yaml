  text: וַ/יֵּצֵ֨א מֶֽלֶךְ סְדֹ֜ם וּ/מֶ֣לֶךְ עֲמֹרָ֗ה וּ/מֶ֤לֶךְ אַדְמָה֙ וּ/מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִוא צֹ֑עַר וַ/יַּֽעַרְכ֤וּ אִתָּ/ם֙ מִלְחָמָ֔ה בְּ/עֵ֖מֶק הַ/שִּׂדִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/008.yaml
  text: Then the king of Sodom[a], the king of Gomorrah, the king of Admah, the king of Zeboiim, and the king of Bela (that is, Zoar) went out, and they drew up for battle with them in the Valley of Siddim.
translation:
  language: ta
  text: பின்பு சோதோமின் அரசனும், கொமோராவின் அரசனும், அத்மாவின் அரசனும், செபோயீமின் அரசனும், பேலாவின் அரசனும் (அதாவது, சோவார்) புறப்பட்டு, சித்தீம் பள்ளத்தாக்கில் அவர்களோடு போருக்காக அணிவகுத்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, “அவர்களோடு போருக்காக அணிவகுத்தார்கள்” என்று உள்ளது. போர்ச் சூழலை வெளிப்படையாகக் காட்ட சில மொழிபெயர்ப்புகள் “அவர்களுக்கு எதிராக” என்று வழங்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: பின்பு ... புறப்பட்டு
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. எபிரெயத்தில் வினை ஒருமையில் இருந்தாலும், தொடர்ந்து வரும் கூட்டெழுவாய் பல அரசர்களைக் குறிப்பிடுவதால் தமிழில் இயல்பாகக் கூட்டுச் செயல் வடிவில் மொழிபெயர்க்கப்பட்டது.
- source_word: מֶלֶךְ
  choice: அரசன்
  rationale: ஒவ்வொரு நகரத்தின் ஆட்சியாளருக்கும் வரும் பட்டத்தை எபிரெய மூலத்தின் மறுமொழிவையும் முறையான ஓசையையும் காக்கத் திரும்பத் திரும்ப வழங்குகிறது.
- source_word: סְדֹם / עֲמֹרָה / אַדְמָה / צביים
  choice: சோதோம் / கொமோரா / அத்மா / செபோயீம்
  rationale: எபிரெய இடப்பெயர்களின் ஒலியை நவீனத் தமிழில் தெளிவாகக் குறிக்கும் பெயர்ப்புகள்.
- source_word: בֶּלַע הִוא צֹעַר
  choice: பேலா (அதாவது, சோவார்)
  rationale: பேலாவே சோவார் என்று அடையாளப்படுத்தும் விளக்கக் கூற்றை அடைப்புக்குறிக்குள் தெளிவாகக் காட்டுகிறது.
- source_word: וַיַּעַרְכוּ
  choice: அணிவகுத்து நின்றார்கள்
  rationale: ערך என்பதன் இராணுவச் சூழல் படைகளைப் போர் ஒழுங்கில் நிறுத்துவதைக் குறிக்கிறது; பொதுவான ‘ஆயத்தமானார்கள்’ என்பதைவிட இந்தத் தேர்வு அந்த நுணுக்கத்தைக் காக்கிறது.
- source_word: אִתָּם מִלְחָמָה
  choice: அவர்களோடு போரிட
  rationale: אִתָּם என்பதன் அடிப்படை ‘அவர்களோடு’ என்ற உறவைத் தக்கவைத்தபடியே, מִלְחָמָה மற்றும் இராணுவச் சூழல் காட்டும் பகைமையான ஈடுபாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּעֵמֶק הַשִּׂדִּים
  choice: சித்தீம் பள்ளத்தாக்கில்
  rationale: עֵמֶק என்பதற்கு நவீனத் தமிழின் இயல்பான ‘பள்ளத்தாக்கு’ பயன்படுத்தப்பட்டு, சித்தீம் இடப்பெயராக ஒலிபெயர்க்கப்பட்டது.
