  source_fidelity: அரசர்களின் பட்டியல், பேலா–சோவார் அடையாளக் குறிப்பு, சித்தீம் பள்ளத்தாக்கு, மற்றும் போருக்கான அணிவகுப்பு ஆகியவை மூலத்திற்கு உண்மையாக உள்ளன. ஆனால் “அவர்களோடு போரிட” என்பது தமிழில் ‘அவர்களுக்கு எதிராகப் போரிட’ என்ற பொருளைச் சற்றே முன்கூட்டியே உறுதிப்படுத்துகிறது. எபிரெயத்தின் אִתָּם (‘அவர்களோடு/அவர்களுடன்’) கொண்டுள்ள வெளிப்பாட்டை முதன்மை உரையில் காப்பது சிறந்தது.
