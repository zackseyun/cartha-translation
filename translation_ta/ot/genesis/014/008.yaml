  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடைத் தெளிவும் கொண்ட பதிவு. எபிரெயத்தின் அரசர் பட்ட மறுமொழிவு காக்கப்பட்டுள்ளது; அசட்டுத் தொன்மைச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
