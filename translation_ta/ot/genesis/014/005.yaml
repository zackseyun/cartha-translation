base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/005.yaml
  text: In the fourteenth year[a], Kedorlaomer came, along with the kings who were with him, and they defeated the Rephaim at Ashteroth-karnaim, the Zuzim at Ham[c][b], and the Emim at Shaveh-kiriathaim.
translation:
  language: ta
  text: பதினான்காம் ஆண்டில், கெதர்லாயோமெர்[a] தன்னோடு இருந்த அரசர்களுடன் வந்தான். அவர்கள் அஷ்தரோத்-கர்னாயீமில் ரெபாயீமையும்[b], ஹாமில் சூசீமையும், சாவே-கிரியாத்தாயீமில்[c] ஏமீமையும் தோற்கடித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கெதர்லாயோமெர் என்ற பெயர் வேறு ஒலிபெயர்ப்பு மரபுகளில் சற்றே மாறுபட்டு எழுதப்படலாம்; இங்குள்ள வடிவம் எபிரெயப் பெயரின் ஒலியை அண்மையாகப் பின்பற்றுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ரெபாயீம் என்பதைச் சிலர் ‘இராட்சதர்கள்’ என்று மொழிபெயர்க்கிறார்கள்; இங்கு அது ஒரு மக்கள் குழுவின் பெயராகவே வைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: சாவே-கிரியாத்தாயீம் என்பதை ‘கிரியாத்தாயீமின் சமவெளி’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
