  rationale: இணைப்புச் சொல்லுடன் தொடங்கும் எபிரெய காலக் குறிப்பை, தமிழ் கதைநடையில் இயல்பாகவும் துல்லியமாகவும் தருகிறது.
- source_word: בָּא
  choice: வந்தான்
  rationale: בוא என்ற வினையின் பொதுவான பொருளான ‘வருதல்’ என்பதையே காக்கிறது; போர்ச் சூழலைக் கருதி ‘படையெடுத்து வந்தான்’ என்று மூலத்தில் இல்லாத நுண்பொருளைச் சேர்க்கவில்லை.
- source_word: כְדָרְלָעֹמֶר
  choice: கெதர்லாயோமெர்
  rationale: எபிரெயப் பெயரின் ஒலிவடிவத்தைத் தமிழில் அண்மையாக எழுத்துப்பெயர்க்கிறது.
- source_word: וְהַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: தன்னோடு இருந்த அரசர்களுடன்
  rationale: கெதர்லாயோமெருடன் இணைந்திருந்த அரசர்களைக் குறிக்கும் உடனிருப்பு உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיַּכּוּ
  choice: தோற்கடித்தார்கள்
  rationale: נכה என்பதன் அடிப்படைப் பொருள் ‘அடித்தல்’ என்றாலும், இங்குள்ள போரியல் பட்டியலில் மக்கள் குழுக்களை வென்றதைக் குறிக்கிறது; ‘தோற்கடித்தார்கள்’ என்பது அந்தச் சூழலைத் தெளிவாகத் தருகிறது.
- source_word: רְפָאִים
