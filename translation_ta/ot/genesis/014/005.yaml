  rationale: இது ஒரு மக்கள் குழுவின் பெயர் என்பதால், ‘இராட்சதர்கள்’ என்று பொருள்விளக்கம் செய்யாமல் எழுத்துப்பெயர்க்கப்படுகிறது.
- source_word: בְּעַשְׁתְּרֹת קַרְנַיִם
  choice: அஷ்தரோத்-கர்னாயீமில்
  rationale: போர் நடந்த இடத்தைக் குறிக்கும் கூட்டுப் பெயராக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: הַזּוּזִים
  choice: சூசீம்
  rationale: மக்கள் குழுவின் பெயரைத் தமிழில் எழுத்துப்பெயர்க்கிறது.
- source_word: בְּהָם
  choice: ஹாமில்
  rationale: இதை ஓர் இடப்பெயராகக் கொண்டு எழுத்துப்பெயர்த்து, இடத்தைக் குறிக்கும் ‘இல்’ வேற்றுமையைச் சேர்க்கிறது.
- source_word: הָאֵימִים
  choice: ஏமீம்
  rationale: மக்கள் குழுவின் பெயரை மொழிபெயர்க்காமல் எழுத்துப்பெயர்க்கிறது.
- source_word: בְּשָׁוֵה קִרְיָתָיִם
  choice: சாவே-கிரியாத்தாயீமில்
  rationale: பெயரிடப்பட்ட இடங்களின் தொடருக்கு ஏற்ப இதைக் கூட்டிடப்பெயராகக் காக்கிறது; שָׁוֵה என்பதைக் கட்டாயமாக ‘சமவெளி’ என்று பொருள்கொள்ளவில்லை.
theological_decisions:
- issue: ரெபாயீம் என்ற பெயரின் பொருள்
  choice: மக்கள் குழுவின் பெயராக ‘ரெபாயீம்’ என்று காக்கப்பட்டது.
  alternative: ‘இராட்சதர்கள்’ என்று மொழிபெயர்த்தல்.
  rationale: உடனடிச் சூழலும் இலக்கணமும் இதை ஓர் இனப்பெயராகக் காட்டுகின்றன; ‘இராட்சதர்கள்’ என்பது வசனம் நேரடியாகக் கூறாத விளக்கத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரிதான தனிப்பெயர்களும் மக்கள் குழுக்களின் பெயர்களும் எபிரெய ஒலிக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், கெதர்லாயோமெரின் வருகையும் கூட்டரசர்களின் வெற்றியும் என்ற நிகழ்வுநிலை காக்கப்பட்டுள்ளது.
