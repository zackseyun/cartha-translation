  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ஆபிராமுக்கு மரியாதைப் பன்மை வினைமுற்று பயன்படுத்தப்பட்டாலும், மூலத்தின் உறவு மற்றும் உடன்படிக்கை சார்ந்த தெளிவின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
