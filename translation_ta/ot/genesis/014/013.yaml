  yaml_path: translation/ot/genesis/014/013.yaml
  text: Then a fugitive came and told Abram the Hebrew[a]. Now he was dwelling by the oaks of Mamre the Amorite, brother of Eshcol and brother of Aner[c][b]; these were allies of Abram.
translation:
  language: ta
  text: அப்போது தப்பிவந்த ஒருவன் எபிரேயனாகிய ஆபிராமிடம் வந்து தெரிவித்தான். ஆபிராம் அப்போது எமோரியனான மம்ரேயின் பெரிய மரங்களருகே[a] குடியிருந்தார். மம்ரே எஸ்கோலின் சகோதரனும் ஆனேரின் சகோதரனுமாயிருந்தான்[b]. இவர்கள் ஆபிராமுடன் உடன்படிக்கை செய்துகொண்ட கூட்டாளிகள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மம்ரேயின் ஓக் மரங்களருகே” அல்லது “மம்ரேயின் தெரபிந்த் மரங்களருகே.” எபிரேயச் சொல் பெரிய மரங்களைக் குறிக்கலாம்; அவை பொதுவாக ஓக் அல்லது தெரபிந்த் மரங்களாக அடையாளப்படுத்தப்படுகின்றன.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எஸ்கோலின் உறவினனும் ஆனேரின் உறவினனும்.” “சகோதரன்” என்பதற்கான எபிரேயச் சொல் விரிவான குடும்ப உறவையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், “உடன்படிக்கையின் உரிமையாளர்கள்”; அதாவது, உடன்படிக்கையால் ஆபிராமுடன் இணைக்கப்பட்டவர்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: הַפָּלִיט
  choice: தப்பிவந்த ஒருவன்
  rationale: போர் ஆபத்திலிருந்து தப்பி வந்த நபரை இயல்பான தமிழில் குறிக்கிறது; உயிர்தப்பியவன் என்ற பொருளும் சூழலில் மறுக்கப்படவில்லை.
- source_word: וַיַּגֵּד
  choice: செய்தியைத் தெரிவித்தான்
  rationale: சொல்லுதல் அல்லது அறிக்கையிடுதல் என்ற நேரடியான கதைநடைப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: הָעִבְרִי
  choice: எபிரேயனாகிய
  rationale: ஆபிராமுக்குப் பயன்படுத்தப்பட்டுள்ள இன அல்லது சமூக அடையாளத்தை வழக்கமான தமிழில் பாதுகாக்கிறது.
- source_word: שֹׁכֵן
  choice: குடியிருந்தார்
  rationale: அக்காலத்தில் தொடர்ந்து வசித்த நிலையைக் குறிக்கும் எபிரேயப் பெயரெச்ச வினையின் நீடித்த தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: மம்ரேக்குச் சொந்தமான பெரிய மரங்களின் அருகே
  rationale: אֵלוֹן என்பதன் தாவரவியல் அடையாளம் உறுதியல்ல; ஓக் அல்லது தெரபிந்த் என்று தேவையின்றி முடிவுசெய்யாமல், மம்ரேயுடன் உள்ள தொடர்பையும் வாசிக்கத் தெளிவாகக் காட்டுகிறது.
- source_word: הָאֱמֹרִי
  choice: எமோரியனான
  rationale: மம்ரேயின் இன அடையாளத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֲחִי אֶשְׁכֹּל וַאֲחִי עָנֵר
  choice: எஸ்கோலுக்கும் ஆனேருக்கும் சகோதரன்
  rationale: אָח என்பதன் முதன்மையான பொருளான சகோதரன் என்பதைக் காக்கிறது; விரிவான உறவினர் என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בַּעֲלֵי בְרִית
  choice: உடன்படிக்கை செய்துகொண்ட கூட்டாளிகள்
  rationale: சொல்லுக்குச் சொல் பொருளான ‘உடன்படிக்கையின் உரிமையாளர்கள்’ என்ற எபிரேய மரபுத்தொடர், உடன்படிக்கையால் இணைக்கப்பட்டவர்களைக் குறிக்கிறது; நவீன தமிழில் அதன் அரசியல்-சமூகப் பொருளைத் தெளிவாக்குகிறது.
