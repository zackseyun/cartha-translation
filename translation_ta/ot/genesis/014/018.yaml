  source_fidelity: 'மூல எபிரெய வசனத்தின் எல்லா கூறுகளும் துல்லியமாக உள்ளன: மெல்கிசேதேக்கு சாலேமின் அரசன்; அவர் அப்பத்தையும் திராட்சரசத்தையும் வெளியே கொண்டுவந்தார்; மேலும் உன்னதமான கடவுளின் ஆசாரியனாக இருந்தார். பிற்காலச் சடங்கு அல்லது இறையியல் விளக்கம் எதுவும் சேர்க்கப்படவில்லை.'
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘சாலேமின் அரசனான மெல்கிசேதேக்கு’ மற்றும் ‘வெளியே கொண்டுவந்தான்’ இயல்பாக வாசிக்கப்படுகின்றன. ‘ஆசாரியன்’ வேதாகமப் பதிவுக்கேற்ற பொதுவான, புரிந்துகொள்ளத்தக்க சொல்.
  terminology: பெயர் ‘மெல்கிசேதேக்கு’ நிலைபெற்ற தமிழ் வேதாகம ஒலிபெயர்ப்பு மரபுடன் ஒத்துள்ளது. ‘அப்பம்,’ ‘திராட்சரசம்,’ ‘ஆசாரியன்,’ ‘உன்னதமான கடவுள்’ ஆகியவை மூலத்தின் பொருளையும் உரையின் பதிவையும் நன்றாகக் காக்கின்றன. எபிரெய ‘எல் எல்யோன்’ அடிக்குறிப்பு தலைப்பின் மூலவடிவத்தைத் தகுந்தவாறு வழங்குகிறது.
