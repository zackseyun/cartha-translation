source:
  edition: WLC
  text: וּ/מַלְכִּי צֶ֨דֶק֙ מֶ֣לֶךְ שָׁלֵ֔ם הוֹצִ֖יא לֶ֣חֶם וָ/יָ֑יִן וְ/ה֥וּא כֹהֵ֖ן לְ/אֵ֥ל עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/018.yaml
  text: And Melchizedek king of Salem brought out bread and wine[b][a]. He was a priest of God Most High.
translation:
  language: ta
  text: சாலேமின் அரசனான மெல்கிசேதேக்கு அப்பத்தையும் திராட்சரசத்தையும் வெளியே கொண்டுவந்தான்.[a] அவன் உன்னதமான கடவுளின்[b] ஆசாரியனாக இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வெளியே கொண்டுவந்தான்’ என்பதை ‘கொண்டுவந்தான்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில்: ‘எல் எல்யோன்’; அதாவது, ‘உன்னதமான கடவுள்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִּי צֶדֶק
  choice: மெல்கிசேதேக்கு
  rationale: இது இங்கு ஒருவரின் பெயராகச் செயல்படுவதால், அதன் சாத்தியமான பொருளை மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: מֶלֶךְ שָׁלֵם
  choice: சாலேமின் அரசன்
  rationale: מֶלֶךְ என்பதற்கு இயல்பான தமிழ் இணை ‘அரசன்’; שָׁלֵם இடப்பெயராக ‘சாலேம்’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: הוֹצִיא
  choice: வெளியே கொண்டுவந்தான்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே வரச் செய்தல்/வெளியே கொண்டுவருதல்’ என்ற தெளிவான இயக்கத்தைக் குறிக்கிறது; அதை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: לֶחֶם וָיָיִן
  choice: அப்பத்தையும் திராட்சரசத்தையும்
  rationale: இங்கு לֶחֶם என்பது அப்பத்தையும் יָיִן என்பது திராட்சரசத்தையும் நேரடியாகக் குறிக்கின்றன.
- source_word: כֹהֵן
  choice: ஆசாரியன்
  rationale: வழிபாட்டுச் சேவை புரிபவரைக் குறிக்கும் பொதுவான பதவி; பிற்கால இஸ்ரவேலிய ஆசாரிய அமைப்பின் விவரங்களை வசனத்துக்குள் கொண்டுவரவில்லை.
- source_word: אֵל עֶלְיוֹן
  choice: உன்னதமான கடவுள்
  rationale: אֵל என்பது ‘கடவுள்’ என்றும் עֶלְיוֹן என்பது ‘உன்னதமான’ என்றும் பொருள்பட மொழிபெயர்க்கப்பட்டது; வாசகருக்குத் தெளிவாக இருக்கும்படி தெய்வீகப் பட்டப்பெயர் மொழிபெயர்க்கப்பட்டது.
- source_word: וְהוּא
  choice: அவன் ... இருந்தான்
  rationale: இணைப்புச் சொல்லுடன் வரும் சுட்டுப்பெயர் மெல்கிசேதேக்கின் அடையாளத்தை விளக்கும் புதிய உட்கூற்றைத் தொடங்குகிறது; தமிழில் தனி வாக்கியமாக இயல்பாக வழங்கப்பட்டது.
theological_decisions:
- issue: அப்பமும் திராட்சரசமும் பிற்காலத் திருவிருந்து சார்ந்த பொருளை முன்வைக்கும் வகையில் மொழிபெயர்க்கப்பட வேண்டுமா?
  choice: வரலாற்றுச் செயலாக எளிமையாக ‘அப்பத்தையும் திராட்சரசத்தையும் வெளியே கொண்டுவந்தான்’ என்று வழங்கப்பட்டது.
  alternative: திருவிருந்தை முன்னறிவிக்கும் பொருள் தெளிவாகத் தோன்றும் சொற்களைப் பயன்படுத்துதல்.
  rationale: இந்த வசனம் அப்பத்தையும் திராட்சரசத்தையும் கொண்டுவந்த செயலை மட்டும் கூறுகிறது; பிற்கால வேதாகமப் பயன்பாட்டை இங்கு விளக்கமாகச் சேர்ப்பது மூலவசனத்தை மீறும்.
- issue: אֵל עֶלְיוֹן என்பதை தனிப்பெயராக ஒலிபெயர்ப்பதா, பட்டப்பெயராக மொழிபெயர்ப்பதா?
  choice: ‘உன்னதமான கடவுள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘எல் எல்யோன்’ என்று ஒலிபெயர்த்தல்.
  rationale: இத்தொடர் தெய்வீகப் பெயர்/பட்டம் என்ற இயல்பான இருமுகத் தன்மையைக் கொண்டிருந்தாலும், அதன் பொருளை வாசகர் நேரடியாக அறிய பட்டப்பெயராக மொழிபெயர்த்து, எபிரெய வடிவம் அடிக்குறிப்பில் தரப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டது. பெயர்கள் ஒலிபெயர்க்கப்பட்டன; தெய்வீகப் பட்டம் பொருள்பட மொழிபெயர்க்கப்பட்டது. பிற்கால சடங்கு அல்லது சமயக் கோட்பாட்டு விளக்கங்கள் மூலவசனத்துக்குள் சேர்க்கப்படவில்லை.
