- from: பின்பு அவர்கள் சோதோம், கொமோரா நகரங்களின் உடைமைகள் அனைத்தையும், அவர்களுடைய உணவு அனைத்தையும்[a] எடுத்துக்கொண்டு அங்கிருந்து சென்றார்கள்.
  to: பின்பு அவர்கள் சோதோம், கொமோராவின் உடைமைகள் அனைத்தையும், அவர்களுடைய உணவு அனைத்தையும்[a] எடுத்துக்கொண்டு சென்றார்கள்.
