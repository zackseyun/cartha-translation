id: GEN.14.11
reference: Genesis 14:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ֠/יִּקְחוּ אֶת כָּל רְכֻ֨שׁ סְדֹ֧ם וַ/עֲמֹרָ֛ה וְ/אֶת כָּל אָכְלָ֖/ם וַ/יֵּלֵֽכוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/011.yaml
  text: Then they took all the possessions of Sodom and Gomorrah[a], and all their food, and went away.
translation:
  language: ta
  text: பின்பு அவர்கள் சோதோம், கொமோராவின் உடைமைகள் அனைத்தையும், அவர்களுடைய உணவு அனைத்தையும்[a] எடுத்துக்கொண்டு சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய உணவுக் கையிருப்பு அனைத்தையும்.” இதற்கான எபிரெயச் சொல் பொதுவாக உணவையோ, பயணம் அல்லது போருக்காகச் சேமித்து வைத்த உணவுப் பொருள்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: எடுத்துக்கொண்டு
  rationale: לקח என்பதன் வழக்கமான கதைநடைப் பொருளான ‘எடுத்தார்கள்’ என்பதைப் பாதுகாக்கிறது; கொள்ளையிட்டார்கள் என்று சூழலை விரித்துரைக்காமல், அடுத்துள்ள ‘சென்றார்கள்’ என்பதுடன் இயல்பாக இணைகிறது.
- source_word: כָּל
  choice: அனைத்தையும்
  rationale: உடைமைகளையும் உணவையும் குறிக்கும் இரு இடங்களிலும் வரும் முழுமையைக் காட்டும் சொல்லைத் தமிழிலும் இருமுறை வழங்குகிறது.
- source_word: רְכֻשׁ
  choice: உடைமைகள்
  rationale: அசையும் சொத்துகள், பொருள்கள், செல்வம் ஆகியவற்றை உள்ளடக்கக்கூடிய பரந்த, இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: סְדֹם וַעֲמֹרָה
  choice: சோதோம், கொமோரா
  rationale: தமிழ் வேதாகம மரபில் அறியப்பட்ட இடப்பெயர் வடிவங்கள்; ‘நகரங்களின்’ என்பது தமிழில் உரிமைத் தொடர்பை இயல்பாகத் தெளிவாக்குகிறது.
- source_word: אָכְלָם
  choice: அவர்களுடைய உணவு
  rationale: אָכְלָם என்பதிலுள்ள உணவு என்ற அடிப்படைப் பொருளையும் மூன்றாம் நபர் பன்மை உடைமை விகுதியையும் நேரடியாகக் காட்டுகிறது; ‘உணவுக் கையிருப்பு’ என்ற சூழல்சார் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיֵּלֵכוּ
  choice: அங்கிருந்து சென்றார்கள்
  rationale: கொள்ளைப் பொருள்களை எடுத்த பின் அவர்கள் புறப்பட்டுச் சென்றதை இயல்பான தமிழில் தெரிவிக்கிறது; ‘அங்கிருந்து’ என்பது ‘went away’ என்ற சூழல்சார் திசையை வெளிப்படுத்துகிறது.
