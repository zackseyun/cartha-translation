  text: וַ/יָּ֕שֶׁב אֵ֖ת כָּל הָ/רְכֻ֑שׁ וְ/גַם֩ אֶת ל֨וֹט אָחִ֤י/ו וּ/רְכֻשׁ/וֹ֙ הֵשִׁ֔יב וְ/גַ֥ם אֶת הַ/נָּשִׁ֖ים וְ/אֶת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/016.yaml
  text: He brought back all the possessions[a]; he also brought back Lot his kinsman, and his possessions[d][c][b], and also the women and the people.
translation:
  language: ta
  text: அவன் எல்லாச் சொத்துகளையும் திரும்பக் கொண்டுவந்தான்; தன் உறவினனான லோத்தையும் லோத்தின் சொத்துகளையும் திரும்பக் கொண்டுவந்தான்; மேலும் பெண்களையும் மக்களையும் கொண்டுவந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב / הֵשִׁיב
  choice: திரும்பக் கொண்டுவந்தான்
  rationale: שׁוב என்பதன் ஹிஃபில் வடிவங்கள் இங்கு பிடித்துச் செல்லப்பட்ட பொருட்களையும் ஆட்களையும் மீண்டும் கொண்டுவருவதைக் குறிக்கின்றன. ‘திரும்பக் கொண்டுவந்தான்’ என்பது காரணவினைப் பொருளையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: כָּל הָרְכֻשׁ / וּרְכֻשׁוֹ
  choice: எல்லாச் சொத்துகள் / அவனுடைய சொத்துகள்
  rationale: רְכוּשׁ என்பது உடைமைகள், பொருட்கள், சொத்து ஆகியவற்றைக் குறிக்கலாம். ‘சொத்துகள்’ என்பது இச்சூழலில் பரந்த பொருளைத் தருவதோடு, இரு இடங்களிலும் ஒரே சொல்லைத் தொடர்ந்து பயன்படுத்த உதவுகிறது.
- source_word: וְגַם
  choice: கூட
  rationale: இருமுறை வரும் சேர்க்கை மற்றும் வலியுறுத்தல் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; இறுதிப் பட்டியலில் அது வெளிப்படையாக வைக்கப்பட்டுள்ளது, முன் கூறுகளில் ‘-உம்’ உருபுகள் அதே சேர்க்கைப் பணியைச் செய்கின்றன.
- source_word: לוֹט אָחִיו
  choice: தன் உறவினனாகிய லோத்து
  rationale: אָחִיו என்பதன் நேரடிப் பொருள் ‘அவனுடைய சகோதரன்’; ஆனால் எபிரெயத்தில் அது பரந்த உறவுமுறையையும் குறிக்கலாம். ஆதியாகமக் கதையில் லோத்து ஆபிராமின் சகோதரன் மகன் என்பதால், ‘உறவினன்’ சூழலுக்கேற்ற துல்லியமான மொழிபெயர்ப்பு; நேரடிப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: הַנָּשִׁים
  choice: பெண்கள்
  rationale: נָשִׁים என்பது பெண்களையோ மனைவிகளையோ குறிக்கக்கூடும்; இங்கு சூழல் அதை ‘மனைவிகள்’ என்று மட்டுப்படுத்தாததால் பரந்த ‘பெண்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: עָם என்பது பொதுவாக ஒரு மக்கள் குழுவைக் குறிக்கிறது. பாலினம் அல்லது சமூக நிலையைச் சுருக்காமல் ‘மக்கள்’ அதன் பரந்த பொருளைக் காக்கிறது.
