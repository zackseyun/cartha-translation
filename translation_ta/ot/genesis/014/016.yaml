revisions:
- from: அவன் எல்லாச் சொத்துகளையும் திரும்பக் கொண்டுவந்தான்; தன் உறவினனாகிய லோத்தையும்[a] அவனுடைய சொத்துகளையும் திரும்பக் கொண்டுவந்தான்; பெண்களையும் மக்களையும் கூடக் கொண்டுவந்தான்.
