translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. எபிரெய வசனத்தின் இரண்டு முக்கிய வினைச்சொல் அமைப்புகள் அரைப்புள்ளியால் பிரிக்கப்பட்டுள்ளன; இறுதியில் வினைச்சொல் இயல்பான தமிழுக்கேற்ப சுருக்கப்பட்டாலும், மீட்டுக் கொண்டுவருதல் என்ற செயல் தெளிவாகத் தொடர்கிறது.
