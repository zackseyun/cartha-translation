source:
  edition: WLC
  text: וַ/יִּקְח֨וּ אֶת ל֧וֹט וְ/אֶת רְכֻשׁ֛/וֹ בֶּן אֲחִ֥י אַבְרָ֖ם וַ/יֵּלֵ֑כוּ וְ/ה֥וּא יֹשֵׁ֖ב בִּ/סְדֹֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/012.yaml
  text: They took Lot[a], Abram’s nephew, and his possessions, and went away[b]. Now he was dwelling in Sodom.
translation:
  language: ta
  text: அவர்கள் ஆபிராமின் சகோதரனுடைய மகனான லோத்தையும் அவனுடைய உடைமைகளையும் எடுத்துக்கொண்டு புறப்பட்டுச் சென்றார்கள். அவன் சோதோமில் குடியிருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: எடுத்துக்கொண்டு
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்’. போர்ச் சூழலில் ‘பிடித்துக்கொண்டு’ என்பதும் சாத்தியம்; ஆனால் அது மூல வினைச்சொல் வெளிப்படையாகக் கூறுவதைவிட வலிமையானது.
- source_word: רְכֻשׁוֹ
  choice: அவனுடைய உடைமைகள்
  rationale: רְכוּשׁ என்பது ஒருவருக்குச் சொந்தமான பொருட்களையும் செல்வத்தையும் குறிக்கிறது. ‘உடைமைகள்’ என்பது இச்சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בֶּן אֲחִי אַבְרָם
  choice: ஆபிராமின் சகோதரனுடைய மகன்
  rationale: மூல எபிரெய உறவுமுறைச் சொல்லாக்கத்தைத் தெளிவாகப் பாதுகாக்கிறது. தமிழில் ‘மருமகன்’ என்பது சகோதரரின் மகனையும் மகளின் கணவனையும் குறிக்கக்கூடியதால் இங்கு தவிர்க்கப்பட்டது.
- source_word: וַיֵּלֵכוּ
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: הלך என்பதன் வழக்கமான பொருள் ‘சென்றார்கள்’. லோத்தையும் உடைமைகளையும் கொண்டுசென்ற சூழலில், அவ்விடத்தைவிட்டு அகன்றதை ‘புறப்பட்டுச் சென்றார்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהוּא יֹשֵׁב בִּסְדֹם
  choice: அப்போது அவன் சோதோமில் குடியிருந்தான்
  rationale: இந்தக் கூற்று லோத்தின் இருப்பிடத்தைப் பின்னணித் தகவலாக அளிக்கிறது. ‘குடியிருந்தான்’ என்பது יֹשֵׁב என்பதன் தொடர்நிலைப் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குத் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. உறவுமுறையில் ஏற்படக்கூடிய ‘மருமகன்’ என்ற தமிழ்ச் சொல்லின் இருபொருளைத் தவிர்த்து, மூலத்தின் நேரடியான ‘சகோதரனுடைய மகன்’ என்ற வடிவம் பயன்படுத்தப்பட்டது.
