  text: וַ/אֲנִ֣י בְּ/בֹאִ֣/י מִ/פַּדָּ֗ן מֵ֩תָה֩ עָלַ֨/י רָחֵ֜ל בְּ/אֶ֤רֶץ כְּנַ֨עַן֙ בַּ/דֶּ֔רֶךְ בְּ/ע֥וֹד כִּבְרַת אֶ֖רֶץ לָ/בֹ֣א אֶפְרָ֑תָה וָ/אֶקְבְּרֶ֤/הָ שָּׁם֙ בְּ/דֶ֣רֶךְ אֶפְרָ֔ת הִ֖וא בֵּ֥ית לָֽחֶם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/007.yaml
  text: As for me[a], when I came from Paddan, Rachel died to my sorrow in the land of Canaan on the way, while there was still some distance to go to Ephrath; and I buried her there on the way to Ephrath (that is[c][b], Bethlehem).
translation:
  language: ta
  text: “நானோ, பதானிலிருந்து[a] வந்தபோது, கானான் நாட்டில், எப்ராத்தாவை அடைய இன்னும் சிறிது தொலைவு[b] இருந்த நிலையில், வழியிலேயே ராகேல் என்னருகில் இறந்துபோனாள்[c]. நான் அவளை அங்கே எப்ராத்தாவுக்குப் போகும் வழியில் அடக்கம் செய்தேன்; எப்ராத்தா என்பது பெத்லகேம்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில் ‘பதான்’ என்று மட்டுமே உள்ளது; தொடர்புடைய வேறு பகுதிகளை அடிப்படையாகக் கொண்டு சில மொழிபெயர்ப்புகள் இதை ‘பதான் அராம்’ என்று விரிவாக்குகின்றன.
    reason: lexical_alternative
  - marker: b
    text: ‘சிறிது தொலைவு’ என்பது எஞ்சியிருந்த ஒரு நிலத்தூரத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரின் மொழிபெயர்ப்பு; அதன் துல்லியமான தொலைவு தெரியவில்லை.
    reason: cultural_note
  - marker: c
    text: சொல்லெழுத்தாக, ‘ராகேல் என்மீது இறந்தாள்.’ இந்த எபிரெய மரபுத்தொடர் அவள் யாக்கோபின் அருகில் இறந்ததையோ, அவளுடைய மரணம் அவர்மீது ஏற்படுத்திய தனிப்பட்ட துயரச்சுமையையோ வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: நானோ
  rationale: தனிப்பட்ட நினைவுக்கு மாறுவதையும் ‘நான்’ என்பதற்குள்ள வலியுறுத்தலையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: בְּבֹאִי
  choice: வந்துகொண்டிருந்தபோது
  rationale: בְּ உடன் வரும் infinitive construct காலச்சூழலைக் குறிக்கிறது; பயணம் நடந்துகொண்டிருந்த நிலையையும் தமிழ் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִפַּדָּן
  choice: பதானிலிருந்து
  rationale: எபிரெய உரையில் உள்ள ‘பதான்’ என்ற குறுகிய பெயரையே பின்பற்றுகிறது; தொடர்புடைய வசனங்களிலிருந்து ‘பதான் அராம்’ என்று விரிவாக்கவில்லை.
- source_word: מֵתָה עָלַי
  choice: என்னருகில் இறந்துபோனாள்
  rationale: சொல்லெழுத்தாக ‘என்மீது இறந்தாள்’ எனும் கடினமான எபிரெய மரபுத்தொடரின் அருகாமை சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது; அதன் தனிப்பட்ட துயரச்சுமை உட்படக்கூடிய தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: கானான் நாட்டில்
  rationale: மூலத்தின் புவியியல் குறிப்பை முழுமையாகவும் இயல்பாகவும் தருகிறது.
- source_word: בַּדֶּרֶךְ
  choice: வழியிலேயே
  rationale: பயணப்பாதையிலேயே மரணம் நிகழ்ந்தது என்பதைத் தெளிவாகவும் வலியுறுத்தலுடனும் தெரிவிக்கிறது.
- source_word: בְּעוֹד כִּבְרַת אֶרֶץ לָבֹא אֶפְרָתָה
  choice: எப்ராத்தாவை அடைய இன்னும் சிறிது தொலைவு இருந்த நிலையில்
  rationale: כִּבְרַת אֶרֶץ குறிக்கும் துல்லியமற்ற மீதித் தொலைவை அளவுக்கு மீறிய துல்லியமின்றி இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וָאֶקְבְּרֶהָ שָּׁם
  choice: நான் அவளை அங்கே ... அடக்கம் செய்தேன்
  rationale: தொடர்ந்து நிகழ்ந்த யாக்கோபின் தனிப்பட்ட செயலை நேரடியாகக் கூறி, שָׁם என்பதையும் பாதுகாக்கிறது.
- source_word: בְּדֶרֶךְ אֶפְרָת
  choice: எப்ராத்தாவுக்குப் போகும் வழியில்
  rationale: பாதை அல்லது இடத்தை எப்ராத்தாவுடன் தொடர்புபடுத்தும் மூலச் சொற்றொடரைத் தெளிவான தமிழில் தருகிறது.
- source_word: הִוא בֵּית לָחֶם
  choice: எப்ராத்தா என்பது பெத்லகேம்
  rationale: இரு இடப்பெயர்களையும் அடையாளப்படுத்தும் மூலத்தின் விளக்கக் கூற்றை நேரடியாகத் தருகிறது.
theological_decisions:
- issue: מֵתָה עָלַי என்ற மரபுத்தொடரின் பொருள்
  choice: முதன்மை உரையில் ‘என்னருகில் இறந்துபோனாள்’; அடிக்குறிப்பில் தனிப்பட்ட துயரச்சுமையையும் குறிப்பிடுதல்
  alternative: ‘எனக்குப் பெருந்துயரமாக இறந்துபோனாள்’ அல்லது சொல்லெழுத்தாக ‘என்மீது இறந்தாள்’
  rationale: மரபுத்தொடர் யாக்கோபின் அருகில் நிகழ்ந்த மரணத்தையோ அதன் தனிப்பட்ட தாக்கத்தையோ வலியுறுத்தலாம். ஒன்றை மட்டும் இறுதியான பொருளாக நிர்ணயிக்காமல் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘நானோ’ தலைப்புமாற்றத்தையும் வலியுறுத்தலையும் இயல்பாகக் காட்டுகிறது. இடப்பெயர்கள் பொதுவான தமிழ் வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்றவாறு தரப்பட்டுள்ளன. மூலத்தின் நீண்ட வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
