source:
  edition: WLC
  text: וּ/מוֹלַדְתְּ/ךָ֛ אֲשֶׁר הוֹלַ֥דְתָּ אַחֲרֵי/הֶ֖ם לְ/ךָ֣ יִהְי֑וּ עַ֣ל שֵׁ֧ם אֲחֵי/הֶ֛ם יִקָּרְא֖וּ בְּ/נַחֲלָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/006.yaml
  text: But your offspring whom you father after them will be yours[b][a]; they will be called by the name of their brothers in their inheritance.
translation:
  language: ta
  text: ஆனால், அவர்களுக்குப் பிறகு உனக்குப் பிறக்கும் உன் பிள்ளைகள்[a] உனக்குரியவர்களாக இருப்பார்கள்; தங்கள் சகோதரர்களின் பெயரின்கீழ் அவர்கள் தங்கள் மரபுரிமைப் பங்கில் கணக்கிடப்படுவார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்குப் பிறகு உனக்குப் பிறக்கும் உன் சந்ததியினர்.”
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அவர்கள் தனித்தனி கோத்திரங்களுக்கான மரபுரிமைப் பங்குகளைப் பெறாமல், எப்பிராயீம் மற்றும் மனாசேயின் பெயரின்கீழ் கணக்கிடப்படுவார்கள்.
    reason: cross_reference
lexical_decisions:
- source_word: וּמוֹלַדְתְּךָ
  choice: நீ பெறும் உன் பிள்ளைகள்
  rationale: இச்சொல் ஒருவருக்குப் பிறந்தவர்களைக் குறிக்கிறது. சூழலில் யோசேப்புக்குப் பின்னர் பிறக்கும் பிள்ளைகளே குறிக்கப்படுவதால், நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הוֹלַדְתָּ
  choice: நீ பெறும்
  rationale: ילד என்பதன் Hiphil வடிவம் இங்கே தந்தையாகப் பிள்ளைகளைப் பெறுதல் அல்லது பிறக்கச் செய்தல் என்ற பொருளில் யோசேப்பைக் குறிக்கிறது. தமிழில் ஆணைப் பற்றிப் பேசும்போது ‘பிள்ளைகளைப் பெறுதல்’ என்பது இயல்பான வழக்கு.
- source_word: אַחֲרֵיהֶם
  choice: அவர்களுக்குப் பிறகு
  rationale: எப்பிராயீம், மனாசே ஆகியோருக்குப் பிறகு பிறப்பவர்களை நேரடியாகக் குறிக்கும் எபிரெயச் சொல்லமைப்பு பாதுகாக்கப்பட்டுள்ளது.
- source_word: לְךָ יִהְיוּ
  choice: உனக்குரியவர்களாக இருப்பார்கள்
  rationale: எப்பிராயீமும் மனாசேயும் யாக்கோபின் பிள்ளைகளாகக் கணக்கிடப்படுவதற்கு மாறாக, பின்னர் பிறப்பவர்கள் யோசேப்புக்குரியவர்களாக இருப்பார்கள் என்ற குடும்ப மற்றும் சட்ட உறவை வெளிப்படுத்துகிறது.
- source_word: עַל שֵׁם אֲחֵיהֶם
  choice: தங்கள் சகோதரர்களின் பெயரால்
  rationale: பின்னர் பிறக்கும் பிள்ளைகள் தனிக் கோத்திரப் பெயரில் அல்லாமல் தங்கள் சகோதரர்களின் பெயரின்கீழ் கணக்கிடப்படுவார்கள் என்ற கருத்தைத் தருகிறது; அதேவேளை ‘பெயர்’ என்ற மூலச்சொல் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֲחֵיהֶם
  choice: தங்கள் சகோதரர்கள்
  rationale: மூலத்தில் உள்ள குடும்ப உறவுச் சொல் அப்படியே வைக்கப்பட்டுள்ளது; சூழலில் இவர்கள் எப்பிராயீமும் மனாசேயும் ஆவர்.
- source_word: יִקָּרְאוּ
  choice: அழைக்கப்படுவார்கள்
  rationale: קרא என்பதன் Niphal வடிவத்தின் முதன்மைப் பொருளான ‘அழைக்கப்படுதல்/பெயரிடப்படுதல்’ காக்கப்பட்டுள்ளது. உரிமைப்பங்கு குறித்த சூழலில் இது ஒரு பெயரின்கீழ் கணக்கிடப்படுவதையும் உணர்த்துகிறது.
- source_word: בְּנַחֲלָתָם
  choice: அவர்களுடைய உரிமைப்பங்கில்
  rationale: נַחֲלָה என்பது மரபுரிமையாகக் கிடைக்கும் நிலம் அல்லது ஒதுக்கப்பட்ட பங்கைக் குறிக்கிறது. கோத்திர நிலப்பங்கின் சூழலைத் தெளிவாக்க ‘உரிமைப்பங்கு’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: பின்னர் பிறக்கும் யோசேப்பின் பிள்ளைகளின் கோத்திர நிலை
  choice: மூலத்தின் ‘சகோதரர்களின் பெயரால் ... அழைக்கப்படுவார்கள்’ என்ற சொல்லாட்சி முதன்மை உரையில் காக்கப்பட்டு, அதன் நடைமுறைப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
  alternative: அவர்கள் எப்பிராயீம் அல்லது மனாசே கோத்திரத்தில் சேர்க்கப்படுவார்கள் என்று முதன்மை உரையிலேயே விளக்கமாக மொழிபெயர்த்தல்.
  rationale: மூலத்தின் பெயரிடுதல் சார்ந்த மொழியையும் அதன் ஓரளவு மறைமுகத்தன்மையையும் பாதுகாத்து, ஒரு குறிப்பிட்ட விளக்கத்தை முதன்மை உரைக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைக் கையாள்கிறது. ‘உரிமைப்பங்கு’ என்பது மரபுரிமையாக ஒதுக்கப்படும் கோத்திர நிலப்பங்கை சாதாரண வாசகருக்குத் தெளிவாக உணர்த்துகிறது; மூலத்தின் ‘பெயரால் அழைக்கப்படுதல்’ என்ற உருவகம் திட்டமிட்டு காக்கப்பட்டுள்ளது.
