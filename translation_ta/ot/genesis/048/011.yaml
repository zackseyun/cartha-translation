  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף רְאֹ֥ה פָנֶ֖י/ךָ לֹ֣א פִלָּ֑לְתִּי וְ/הִנֵּ֨ה הֶרְאָ֥ה אֹתִ֛/י אֱלֹהִ֖ים גַּ֥ם אֶת זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/011.yaml
  text: And Israel said to Joseph[a], “I did not expect to see your face, and behold, God has let me see even your offspring.”
translation:
  language: ta
  text: இஸ்ரவேல் யோசேப்பிடம், “உன் முகத்தைக் காண்பேன்[a] என்று நான் எதிர்பார்க்கவில்லை; இதோ, உன் சந்ததியையும்கூடக் காணும்படி கடவுள் செய்திருக்கிறார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன்னை நேரில் காண்பேன்.’ எபிரெய மொழியில் ‘உன் முகத்தைக் காண்பது’ என்பது ஒருவரை நேரில் காண்பதைக் குறிக்கும்; மூலத்தின் சொல்லமைப்பு முதன்மை உரையில் தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: எபிரெயக் கதைநடையின் வழக்கமான தொடர்ச்சியைத் தமிழில் இயல்பான உரையாடல் அமைப்பின் முடிவில் வரும் ‘என்றார்’ என்பதால் வெளிப்படுத்துகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: மூல உரை ‘யாக்கோபு’ என்பதற்குப் பதிலாக உடன்படிக்கைப் பெயரான ‘இஸ்ரவேல்’ என்பதையே பயன்படுத்துவதால் அதைப் பேணுகிறது.
- source_word: רְאֹה פָנֶיךָ
  choice: உன் முகத்தைக் காண்பேன்
  rationale: ‘உன்னை நேரில் காண்பது’ என்ற எபிரெய மரபுத்தொடரின் பொருளைத் தருவதோடு, ‘முகம்’ என்ற மூல உரையின் தெளிவான உருவகத்தையும் உணர்ச்சிச் செறிவையும் தக்கவைக்கிறது.
- source_word: לֹא פִלָּלְתִּי
  choice: நான் எதிர்பார்க்கவில்லை
  rationale: இச்சூழலில் வினைச்சொல் ‘ஜெபித்தல்’ என்பதைக் காட்டிலும் எதிர்பார்த்தல் அல்லது எண்ணிப்பார்த்தல் என்ற பொருளைத் தருகிறது; யோசேப்பை மீண்டும் காண நேர்ந்த வியப்புக்கு ‘எதிர்பார்க்கவில்லை’ இயல்பாகப் பொருந்துகிறது.
- source_word: וְהִנֵּה
  choice: ஆனால் இதோ
  rationale: முந்தைய எதிர்பார்ப்புக்கும் இப்போது கிடைத்த மிகுதியான அனுபவத்துக்கும் இடையிலான வியப்பான திருப்பத்தை ‘இதோ’ பேணுகிறது; ‘ஆனால்’ தமிழில் அந்த மாறுபாட்டை இயல்பாக இணைக்கிறது.
- source_word: הֶרְאָה אֹתִי
  choice: காணும்படி கடவுள் செய்திருக்கிறார்
  rationale: ראה என்பதன் காரணவினை வடிவத்தை நேரடியாகப் பேணி, கடவுள் இதைக் காணச் செய்தார் என்ற கருத்தைத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இது தனிப்பட்ட உடன்படிக்கைப் பெயர் அல்ல, பொதுவான இறைப்பட்டம்; நவீனத் தமிழில் ‘கடவுள்’ நேரடியும் இயல்புமான மொழிபெயர்ப்பு.
- source_word: גַּם
  choice: -யையும்கூட
  rationale: யோசேப்பைக் கண்டதற்கும் அப்பாற்பட்டு அவரது சந்ததியையும் கண்ட மிகுதியான வியப்பையும் வலியுறுத்துகிறது.
- source_word: זַרְעֶךָ
  choice: உன் சந்ததி
  rationale: זֶרַע என்பதன் ஒருமைத் தொகுப்புப் பொருளைப் பேணுகிறது; உடனிருக்கும் மக்களை மட்டும் குறுக்காமல் வழிமரபைக் குறிக்கும் இயல்பான தமிழ் சொல்.
theological_decisions:
- issue: முற்பிதாக்களின் வரலாற்றில் אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: தேவன்
  rationale: இங்கு வழக்கமான இறைப்பட்டமே உள்ளது; குறிப்பிட்ட சமய மரபின் சொல்வழக்கைத் திணிக்காமல், கடவுளின் பராமரிப்புச் செயலை நவீன பொதுத்தமிழில் இயல்பாகத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘முகத்தைக் காண்பேன்’ என்ற எபிரெயச் சொல்லுருவமும் ‘இதோ’ என்ற வியப்புக் குறிப்பும் பேணப்பட்டுள்ளன; அரிதான அல்லது குறிப்பிட்ட திருச்சபை மரபுடன் மட்டும் தொடர்புடைய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
