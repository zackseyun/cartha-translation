  yaml_path: translation/ot/genesis/048/021.yaml
  text: Then Israel said to Joseph[a], “Behold, I am about to die[b], but God will be with you and will bring you back to the land of your fathers.”
translation:
  language: ta
  text: பின்பு இஸ்ரவேல் யோசேப்பிடம், “இதோ, நான் இறக்கப்போகிறேன். ஆனால்[a] கடவுள் உங்களோடு[b] இருப்பார்; அவர் உங்களை உங்கள் தந்தையரின் நாட்டிற்குத் திரும்பக் கொண்டுபோவார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுள் உங்களோடு இருப்பார்.’ எபிரெயில் உள்ள இணைப்புச் சொல் அடிப்படையில் ‘மற்றும்’ என்ற பொருளுடையது; ஆனால் இங்கே, யாக்கோபு இறந்தாலும் கடவுள் அவர்களோடு தொடர்ந்து இருப்பார் என்ற கருத்து வேறுபாட்டை அது குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘உங்களோடு’, ‘உங்களை’, ‘உங்கள்’ என்பவற்றுக்கு இணையான எபிரெய வடிவங்கள் பன்மையில் உள்ளன; ஆகவே இந்த வாக்குறுதி யோசேப்பை மட்டும் அல்லாமல் அவரது குடும்பத்தார் அல்லது வழித்தோன்றல்களையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீனத் தமிழில் இயல்பான தொடர்ச்சியை ‘பின்பு’ வெளிப்படுத்துகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: எபிரெய மூலத்தில் ‘யாக்கோபு’ என்பதற்குப் பதிலாக உடன்படிக்கைப் பெயரான ‘இஸ்ரவேல்’ பயன்படுத்தப்பட்டிருப்பதால் அதையே தக்கவைக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் உரையாடல் சுட்டுச்சொல்லின் வலிமையை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָנֹכִי מֵת
  choice: நான் சாகப்போகிறேன்
  rationale: இங்கு வினையெச்ச வடிவம் மரணம் நெருங்கியிருப்பதைக் குறிக்கிறது; ஏற்கெனவே இறந்துவிட்டதாகப் பொருள்படாமல் அதைத் தெளிவாகக் கூறுகிறது.
- source_word: וְהָיָה אֱלֹהִים עִמָּכֶם
  choice: ஆனால் கடவுள் உங்களோடு இருப்பார்
  rationale: וְ என்பது வடிவில் இணைப்புச் சொல் என்றாலும், இஸ்ரவேலின் நெருங்கிய மரணத்துக்கும் கடவுளின் தொடர்ந்திருக்கும் உடனிருப்புக்கும் இடையிலான கருத்து வேறுபாட்டை இச்சூழலில் ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வினை அமைப்பும் சூழலும் இஸ்ரவேலின் ஒரே கடவுளைக் குறிப்பதால் நவீன நிலையான தமிழ்ச் சொல் பயன்படுத்தப்படுகிறது.
- source_word: עִמָּכֶם
  choice: உங்களோடு
  rationale: எபிரெய பின்னொட்டு பன்மையில் உள்ளது. தமிழில் ‘உங்களோடு’ அதைப் பாதுகாக்கிறது; அது யோசேப்பைத் தாண்டி அவரது குடும்பத்தார் அல்லது வழித்தோன்றல்களையும் உள்ளடக்குகிறது.
- source_word: וְהֵשִׁיב אֶתְכֶם
  choice: அவர் உங்களை ... திரும்பக் கொண்டுபோவார்
  rationale: 'שׁוב என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளுடையது: கடவுள் அவர்களைத் திரும்பச் செய்வார். ‘திரும்பக் கொண்டுபோவார்’ இந்தப் பொருளை இயல்பான தமிழில் தருகிறது.'
- source_word: אֶל אֶרֶץ אֲבֹתֵיכֶם
  choice: உங்கள் தந்தையரின் நாட்டிற்கு
  rationale: மூலத்தின் ‘தந்தையர்’ என்ற ஆண்பால் சார்ந்த சொல்லையும், முற்பிதாக்களுக்கு வாக்களிக்கப்பட்ட மூதாதையர் நாட்டைக் குறிக்கும் பொருளையும் நெருக்கமாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலின் வாக்குறுதியில் உள்ள பன்மைப் பிரதிப்பெயர்களின் குறிப்பு
  choice: ‘உங்களோடு’, ‘உங்களை’, ‘உங்கள்’ என்று பன்மையைத் தக்கவைத்தல்
  alternative: யோசேப்பை மட்டும் குறிக்கும் ஒருமை மரியாதை வடிவமாக வாசித்தல்
  rationale: பிந்தைய வாக்கியப் பகுதிகளில் எபிரெய பின்னொட்டுகள் அனைத்தும் பன்மையில் உள்ளன. ஆகவே வாக்குறுதி யோசேப்பைத் தாண்டி அவரது குடும்பத்தார் அல்லது வழித்தோன்றல்களுக்கும் விரிவதை மொழிபெயர்ப்பு மறைக்கவில்லை.
- issue: ‘கடவுள் உங்களோடு இருப்பார்’ என்பதற்கு முன் வரும் וְ-இன் உரையாடல் வலிமை
  choice: எதிர்மறை இணைப்பாக ‘ஆனால்’
  alternative: எளிய இணைப்பாக ‘மேலும்’ அல்லது ‘அப்பொழுது’
  rationale: மூல இணைப்புச் சொல் அடிப்படையில் ‘மற்றும்’ என்றாலும், இஸ்ரவேல் இறக்கவிருக்கிறார்; அதற்கு மாறாக கடவுள் அவர்களோடு தொடர்ந்திருப்பார் என்பதே சூழலின் கருத்து வேறுபாடு. அடிக்குறிப்பு முறையான மாற்றைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ மூலத்தின் கவன ஈர்ப்பைத் தக்கவைக்கிறது; ‘சாகப்போகிறேன்’ நெருங்கிய மரணத்தை இயல்பாகக் கூறுகிறது. ‘நீங்கள்’ வடிவம் தமிழில் மரியாதை ஒருமையாகவும் அமையக்கூடும் என்பதால், எபிரெயின் தெளிவான பன்மை அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
