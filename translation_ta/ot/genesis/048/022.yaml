base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/022.yaml
  text: And I give you one portion above your brothers[a], which I took from the hand of the Amorite with my sword and with my bow.
translation:
  language: ta
  text: நானோ, உன் சகோதரர்களைவிட உனக்கு ஒரு பங்கைக் கூடுதலாக அளிக்கிறேன்[a]. அதை நான் என் வாளாலும் என் வில்லாலும் அமோரியனின் கையிலிருந்து கைப்பற்றினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘பங்கு’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் שְׁכֶם (ஷெகேம்), ‘தோள்’ அல்லது ‘மலைச்சரிவு’ என்றும் பொருள்படலாம்; அது செகேம் என்ற இடப்பெயரையும் நினைவூட்டலாம். ஆகவே, இந்த வாசகம் யோசேப்புக்குக் கிடைக்கும் கூடுதல் பங்கையும், பின்னர் அவனோடு தொடர்புபடுத்தப்பட்ட செகேம் பகுதியையும் ஒருசேர சுட்டக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: நானோ
  rationale: வினைச்சொல்லிலேயே எழுவாய் அடங்கியிருந்தும் தனிப்பட்ட சுட்டுப்பெயர் இடம்பெறுவதால் வரும் வலியுறுத்தலை, இயல்பான தமிழில் ‘நானோ’ என வெளிப்படுத்துகிறது.
- source_word: נָתַתִּי
  choice: அளிக்கிறேன்
  rationale: இறந்தகால வடிவமாக இருந்தாலும், யாக்கோபின் மரணசாசனத் தன்மையுள்ள உரையில் இது இப்போதே வழங்குவதை அறிவிக்கும் நிகழ்காலச் செயற்பாட்டு பொருளில் வருகிறது.
- source_word: שְׁכֶם אַחַד
  choice: ஒரு பங்கு
  rationale: இச்சூழலில் யோசேப்புக்கு சகோதரர்களைவிடக் கூடுதலாக வழங்கப்படும் சுதந்தரப் பங்கை இது குறிக்க வாய்ப்பு மிகுதி. அதே நேரத்தில் ‘தோள்/மலைச்சரிவு’ என்ற சொற்பொருளும் செகேம் என்ற இடப்பெயருடனான சொல்விளையாட்டும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: עַל אַחֶיךָ
  choice: உன் சகோதரர்களைவிட ... கூடுதலாக
  rationale: עַל இங்கு ஒப்பீட்டுடன் கூடிய மேலதிகப் பங்கைக் குறிக்கிறது; தமிழில் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲשֶׁר לָקַחְתִּי
  choice: அதை நான் ... கைப்பற்றினேன்
  rationale: לקח என்பதன் ‘எடுத்தல்/கைப்பற்றுதல்’ பொருளையும், அடுத்து வரும் ஆயுதக் குறிப்பால் வெளிப்படும் வலிமைப் பயன்பாட்டையும் இயல்பான தமிழில் தருகிறது.
- source_word: מִיַּד הָאֱמֹרִי
  choice: அமோரியனின் கையிலிருந்து
  rationale: உடைமை அல்லது அதிகாரத்திலிருந்து எடுத்தல் என்ற எபிரெய மரபுத்தொடரைப் பாதுகாக்கிறது; ஒருமை வடிவமும் மூலத்தைப் பின்பற்றுகிறது.
- source_word: בְּחַרְבִּי וּבְקַשְׁתִּי
  choice: என் வாளாலும் என் வில்லாலும்
  rationale: இரு ஆயுதங்களையும் நேரடியாகக் குறிப்பிட்டு, இரண்டுடனும் இணைந்துள்ள எபிரெய முன்னிடைச்சொல்லின் வலிமையைத் தமிழில் இணைப்புச் சொல்லை மீண்டும் பயன்படுத்திப் பாதுகாக்கிறது.
theological_decisions:
- issue: שְׁכֶם என்பது பொதுப்பெயரா, நில அமைப்பைக் குறிக்கும் சொல்லா, அல்லது செகேம் என்ற இடப்பெயரைக் குறிக்கும் சொல்விளையாட்டா என்பது
  choice: முதன்மை உரையில் ‘ஒரு பங்கு’ என்று மொழிபெயர்த்து, மற்ற சாத்தியங்களை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘ஒரு மலைச்சரிவு’ அல்லது ‘செகேம் என்னும் ஒரு பகுதி’
  rationale: சூழல் யோசேப்புக்குக் கிடைக்கும் கூடுதல் சுதந்தரப் பங்கை வலியுறுத்துகிறது. எனினும் எபிரெயச் சொல்லின் ‘தோள்/மலைச்சரிவு’ பொருளையும் செகேம் இடத்துடனான சாத்தியமான தொடர்பையும் மறைக்காமல் அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘நானோ’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது; ‘ஒரு பங்கைக் கூடுதலாக’ சாதாரண வாசகருக்குத் தெளிவாக உள்ளது. இரண்டாவது வாக்கியமாகப் பிரித்தது தமிழின் இயல்பான வாசிப்போட்டத்தை மேம்படுத்துகிறது; தொடர்புச் சொற்றொடரின் பொருள் மாறவில்லை.
