base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/009.yaml
  text: And Joseph said to his father[a], “They are my sons, whom God has given me here.” And he said, “Please bring them to me[b], and I will bless them.”
translation:
  language: ta
  text: யோசேப்பு தன் தந்தையிடம், “இவர்கள் என் மகன்கள்; கடவுள் இவர்களை எனக்கு இங்கே[a] கொடுத்தார்” என்றான். அதற்கு அவர், “தயவுசெய்து அவர்களை என்னிடம் அழைத்து வாருங்கள்[b]; நான் அவர்களை ஆசீர்வதிப்பேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த இடத்தில்.” எபிரெயச் சொற்றொடர் யோசேப்பு இருந்த இடத்தை இன்னும் குறிப்பாகச் சுட்டலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நான் அவர்களை ஆசீர்வதிக்கும்படி, தயவுசெய்து அவர்களை என்னிடம் அழைத்து வாருங்கள்.”
    reason: syntactic_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יוֹסֵף אֶל־אָבִיו
  choice: யோசேப்பு தன் தந்தையிடம் ... என்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான தமிழ்ச் சொல் வரிசையிலும் இறந்தகால வினையிலும் அளிக்கிறது; אָבִיו என்பதன் உறவுமுறையையும் துல்லியமாகக் காக்கிறது.
- source_word: בָּנַי הֵם
  choice: இவர்கள் என் மகன்கள்
  rationale: בָּנַי என்பது பொதுவான ‘பிள்ளைகள்’ அல்ல, ஆண்பால் பன்மையான ‘மகன்கள்’; முன்னிலையில் உள்ளவர்களைச் சுட்டும் வகையில் הֵם இயல்பாக ‘இவர்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר נָתַן לִי אֱלֹהִים
  choice: கடவுள் இவர்களை எனக்கு ... கொடுத்தார்
  rationale: மகன்கள் கடவுளால் அளிக்கப்பட்டவர்கள் என்ற மூலவாக்கியத்தின் நேரடியான பொருளைத் தெளிவாகக் காக்கிறது. אֱלֹהִים இச்சூழலில் ஒருமையாகக் கடவுளைக் குறிக்கிறது.
- source_word: בָּזֶה
  choice: இங்கே
  rationale: சுட்டிடைச் சொல்லின் இடவியல் பொருளை இயல்பான நவீன தமிழில் தருகிறது; இன்னும் குறிப்பான ‘இந்த இடத்தில்’ என்ற வாய்ப்பை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: קָחֶם נָא אֵלַי
  choice: தயவுசெய்து இவர்களை என்னிடம் கொண்டுவா
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடு’ என்றாலும், ஆசீர்வதிப்பதற்காக யாக்கோபிடம் மகன்களை அருகில் கொண்டுவரும் இச்சூழலில் ‘கொண்டுவா’ இயல்பானது. נָא வேண்டுகோளின் பணிவை ‘தயவுசெய்து’ என வெளிப்படுத்துகிறது.
- source_word: וַאֲבָרֲכֵם
  choice: நான் இவர்களை ஆசீர்வதிப்பேன்
  rationale: வேண்டுகோளைத் தொடர்ந்து வரும் நோக்கம்/உறுதியை நேரடியான, இயல்பான தமிழில் தருகிறது; நோக்கவாக்கியமாகவும் புரிந்துகொள்ளக்கூடிய நுணுக்கம் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: אֱלֹהִים என்பதன் குறிப்பு
  choice: இஸ்ரவேலின் கடவுளைக் குறிக்கும் ஒருமை ‘கடவுள்’
  alternative: பொதுவான ‘ஒரு கடவுள்’ அல்லது பன்மையான ‘தெய்வங்கள்’
  rationale: யோசேப்பின் கூற்றும் முற்பிதாக்கள் பற்றிய உடனடிக் கதைச்சூழலும் ஒரே கடவுளையே மகன்களை அளித்தவராகக் குறிப்பிடுகின்றன; இதற்கு அப்பாற்பட்ட சமயப்பிரிவு சார்ந்த விளக்கம் சேர்க்கப்படவில்லை.
- issue: וַאֲבָרֲכֵם என்பதன் வாக்கிய உறவு
  choice: ‘நான் இவர்களை ஆசீர்வதிப்பேன்’ என்ற உறுதி/நோக்கம்
  alternative: ‘நான் இவர்களை ஆசீர்வதிக்கும்படி’ என்ற வெளிப்படையான நோக்கவாக்கியம்
  rationale: எபிரெய வடிவம் வேண்டுகோளின் நோக்கத்தையும் பேச்சாளரின் எண்ணத்தையும் தாங்குகிறது. முதன்மை உரை இயல்பான தமிழைத் தேர்ந்தெடுக்கிறது; மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. யோசேப்பு தன் தந்தையிடம் ஒருமை மரியாதையற்ற வடிவில் பேசுவது தமிழில் கடுமையாக ஒலிக்கக்கூடும் என்றாலும், கட்டளையின் எபிரெய ஒருமையையும் குடும்பச் சூழலையும் காக்க ‘கொண்டுவா’ பயன்படுத்தப்பட்டுள்ளது; தந்தையைக் குறிக்கும் விவரிப்பில் ‘அவர்’ என்ற மரியாதை வடிவம் தொடர்கிறது. ஆங்கில ஆலோசனை உரையில் [a] குறி ‘his father’ என்பதற்குப் பின் தவறாகத் தோன்றினாலும், அதன் அடிக்குறிப்பு בָּזֶה (‘இங்கே’) என்பதைக் குறிப்பதால் தமிழில் சரியான சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
