  register: நவீன பொதுத்தமிழில் கண்ணியமான கதைநடை. எப்பிராயீம், மனாசே, இஸ்ரவேல் ஆகிய பெயர்கள் வழக்கமான தமிழ் வேதாகம வடிவங்களில் தரப்பட்டுள்ளன; ஆசீர்வாதத்துக்கான கைமாற்றத்தின் இடவமைப்பு துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளது.
