base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/013.yaml
  text: And Joseph took the two of them—Ephraim in his right hand, at Israel’s left, and Manasseh in his left hand, at Israel’s right—and brought them near to him.
translation:
  language: ta
  text: யோசேப்பு அவர்கள் இருவரையும் எடுத்துக்கொண்டு, எப்பிராயீமைத் தன் வலது கையில் இஸ்ரவேலின் இடப்பக்கமாகவும், மனாசேயைத் தன் இடது கையில் இஸ்ரவேலின் வலப்பக்கமாகவும் வைத்து, அவரிடம் கொண்டுவந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: அழைத்துக்கொண்டான்
  rationale: இங்கு மகன்களைத் தன் இரு பக்கங்களிலும் நிலைநிறுத்திக் கொண்ட செயலை இயல்பான தமிழில் தெரிவிக்கிறது; அடுத்துள்ள கை மற்றும் இடக் குறிப்புகளோடும் பொருந்துகிறது.
- source_word: מִשְּׂמֹאל יִשְׂרָאֵל / מִימִין יִשְׂרָאֵל
  choice: இஸ்ரவேலின் இடப்பக்கத்திலும் / இஸ்ரவேலின் வலப்பக்கத்திலும்
  rationale: எபிரெய இடவுறவுச் சொற்றொடர்களை ‘பக்கத்தில்’ என்று வழங்குவது யோசேப்பின் கைகளுக்கும் இஸ்ரவேலின் பக்கங்களுக்கும் இடையிலான நிலையைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: וַיַּגֵּשׁ אֵלָיו
  choice: அவர்களை அவரிடம் நெருங்கக் கொண்டுவந்தான்
  rationale: הגשׁ என்னும் காரணவினையின் ‘அருகே கொண்டுவருதல்’ என்ற பொருளையும், אֵלָיו சுட்டும் இஸ்ரவேலையும் காக்கிறது.
theological_decisions: []
