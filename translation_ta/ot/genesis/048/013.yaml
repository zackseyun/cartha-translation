revisions:
- from: யோசேப்பு அவர்கள் இருவரையும் அழைத்துக்கொண்டான்—எப்பிராயீமைத் தன் வலது கையால் இஸ்ரவேலின் இடப்பக்கத்திலும், மனாசேயைத் தன் இடது கையால் இஸ்ரவேலின் வலப்பக்கத்திலும் வைத்துக்கொண்டு—அவர்களை அவரிடம் நெருங்கக் கொண்டுவந்தான்.
  to: யோசேப்பு அவர்கள் இருவரையும் எடுத்துக்கொண்டு, எப்பிராயீமைத் தன் வலது கையில் இஸ்ரவேலின் இடப்பக்கமாகவும், மனாசேயைத் தன் இடது கையில் இஸ்ரவேலின் வலப்பக்கமாகவும் வைத்து, அவரிடம் கொண்டுவந்தான்.
  rationale: The revision renders וַיִּקַּח with the direct Tamil எடுத்துக்கொண்டு, retains the source’s precise hand-and-side arrangement, and renders וַיַּגֵּשׁ אֵלָיו as “brought [them] near to him.” No footnote is needed because the spatial relationships can be expressed clearly in the main text.
