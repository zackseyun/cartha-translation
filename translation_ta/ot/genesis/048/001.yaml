base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/001.yaml
  text: After these things[a], it was said to Yoseph, “Look, your father is sick.” So he took his two sons with him, Manasseh and Ephraim.
translation:
  language: ta
  text: இந்த நிகழ்வுகளுக்குப் பிறகு, யோசேப்பிடம், “இதோ, உன் தந்தை நோயுற்றிருக்கிறார்” என்று ஒருவர்[a] சொன்னார். அப்போது அவர் தம் இரு மகன்களாகிய மனாசேயையும் எப்பிராயீமையும் தம்முடன் அழைத்துக்கொண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “யோசேப்பிடம் அவர் சொன்னார்”; சொன்னவர் யார் என்பது குறிப்பிடப்படவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: நேரடியாகத் தனிச்சொல்லாக மொழிபெயர்க்காமல், தொடரின் கதை நகர்வில் வெளிப்படுத்தப்பட்டது
  rationale: இந்த வடிவம் புதிய கதைநிகழ்வை அறிமுகப்படுத்துகிறது; தமிழில் செயற்கையான ‘அப்போது நிகழ்ந்ததாவது’ போன்ற தொடர் தேவையில்லை.
- source_word: אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: இந்த நிகழ்வுகளுக்குப் பிறகு
  rationale: דְּבָרִים என்பதன் பரந்த பொருளைச் சூழலில் நிகழ்வுகள் என இயல்பாக வெளிப்படுத்தி, முந்தைய பகுதிக்கான காலத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: וַיֹּאמֶר לְיוֹסֵף
  choice: யோசேப்பிடம் ... என்று ஒருவர் சொன்னார்
  rationale: எபிரெய உரையில் பேசுபவர் பெயரிடப்படவில்லை. ‘ஒருவர்’ என்பது பெயரிடப்படாத ஆண்பால் ஒருமை எழுவாயைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் சுட்டிடைச்சொல்லின் உடனடித்தன்மையை நவீன, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָבִיךָ חֹלֶה
  choice: உன் தந்தை நோயுற்றிருக்கிறார்
  rationale: தற்போதைய உடல்நிலையைக் குறிக்கும் பெயரெச்சப் பயன்பாட்டை இயல்பான தமிழில் தருகிறது; தந்தையைக் குறிக்கும் மரியாதைப் பன்மையும் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּקַּח
  choice: அப்போது அவர் ... அழைத்துக்கொண்டார்
  rationale: அடுத்த நிகழ்ச்சிக்கான கதை நகர்வை ‘அப்போது’ வெளிப்படுத்துகிறது; மகன்களைத் தம்முடன் கூட்டிச் சென்றார் என்ற சூழல்பொருளை ‘அழைத்துக்கொண்டார்’ இயல்பாகத் தருகிறது.
- source_word: שְׁנֵי בָנָיו עִמּוֹ
  choice: தம்முடன் தம் இரு மகன்களான
  rationale: யோசேப்பு தன் இரு மகன்களையும் உடன் கொண்டுசென்றதைத் தெளிவாகக் காட்டுகிறது; மரியாதையான தற்சுட்டுப் பெயர்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: மனாசேயையும் எப்பிராயீமையும்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட பெயரெழுத்துப்பெயர்ப்புகளைப் பயன்படுத்தி, இருவரும் வினையின் நேரடிச் செயப்படுபொருள்கள் என்பதை ‘ஐயும்’ உருபுகள் காட்டுகின்றன.
theological_decisions:
- issue: செய்தியைச் சொன்னவரின் அடையாளம்
  choice: ‘ஒருவர் சொன்னார்’ என்று பெயரிடப்படாத நிலையைக் காத்தல்
  alternative: ‘அவரிடம் சொல்லப்பட்டது’ அல்லது குறிப்பிட்ட ஒருவரை எழுவாயாகச் சேர்த்தல்
  rationale: மூலத்தில் பேசுபவர் குறிப்பிடப்படவில்லை; அவரை அடையாளப்படுத்துவது உரைக்கு அப்பாற்பட்ட தீர்மானமாகிவிடும். செயப்பாட்டு வடிவத்தைவிட ‘ஒருவர்’ மூலத்தின் பெயரிடப்படாத தனிப்பட்ட எழுவாயை நெருக்கமாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. யோசேப்புக்கு மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பது הִנֵּה-வின் கவன ஈர்ப்பைத் தக்கவைக்கிறது.
