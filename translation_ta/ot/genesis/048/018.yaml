revisions:
- from: யோசேப்பு தன் தகப்பனிடம், “அப்படியல்ல, என் தகப்பனே! இவன்தான் முதற்பேறானவன். உமது வலது கையை இவனுடைய தலையின்மேல் வையுங்கள்” என்றான்.
  to: யோசேப்பு தன் தந்தையிடம், “அப்படியல்ல, என் தந்தையே; ஏனெனில் இவன்தான் முதற்பிறந்தவன். உமது வலது கையை இவனுடைய தலையின்மேல் வையுங்கள்” என்றான்.
  rationale: The revision explicitly translates the explanatory כִּי as ‘ஏனெனில்’ and substitutes the natural modern Tamil term ‘முதற்பிறந்தவன்’ for ‘முதற்பேறானவன்.’ It retains Joseph's respectful address and the direct demonstrative reference to the son.
  reviewer_model: gpt-5.6-terra
