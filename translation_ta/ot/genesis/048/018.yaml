id: GEN.48.18
reference: Genesis 48:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יוֹסֵ֛ף אֶל אָבִ֖י/ו לֹא כֵ֣ן אָבִ֑/י כִּי זֶ֣ה הַ/בְּכֹ֔ר שִׂ֥ים יְמִינְ/ךָ֖ עַל רֹאשֽׁ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/018.yaml
  text: And Joseph said to his father, “Not so, my father, for this one is the firstborn. Put your right hand on his head.”
translation:
  language: ta
  text: யோசேப்பு தன் தந்தையிடம், “அப்படியல்ல, என் தந்தையே; ஏனெனில் இவன்தான் முதற்பிறந்தவன். உமது வலது கையை இவனுடைய தலையின்மேல் வையுங்கள்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: வாவ்-தொடர்வினை கதையை முன்னெடுக்கிறது. தமிழில் உரையாடலின் முடிவில் ‘என்றான்’ என்று அமைப்பது இயல்பான கதைநடை.
- source_word: אֶל אָבִיו
  choice: தன் தகப்பனிடம்
  rationale: אֶל திசை/முகவரியைக் குறிக்கிறது; மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டைத் தமிழில் இயல்பாக ‘தன் தகப்பனிடம்’ எனத் தெளிவுபடுத்துகிறது.
- source_word: לֹא כֵן
  choice: அப்படியல்ல
  rationale: தவறான செயலைத் திருத்தும் நேரடியான எதிர்ப்பை வெளிப்படுத்துகிறது; வெறும் ‘இல்லை’ என்பதைவிட மூலமொழியின் ‘அவ்வாறல்ல’ என்ற பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: אָבִי
  choice: என் தகப்பனே
  rationale: முதல் நபர் ஒருமை பின்னொட்டையும் மரியாதையான நேரடி அழைப்பையும் வெளிப்படையாகக் காட்டுகிறது.
- source_word: כִּי
  choice: —
  rationale: இங்கு யோசேப்பின் திருத்தத்திற்கான விளக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் தனி இணைப்புச்சொல் இன்றியே அடுத்த வாக்கியமாக அமைப்பது இயல்பாக அதே காரணத் தொடர்பை உணர்த்துகிறது.
- source_word: זֶה
  choice: இவன்தான்
  rationale: யோசேப்பு அருகிலுள்ள மகனைச் சுட்டிக்காட்டும் தன்மையை ‘இவன்’ பாதுகாக்கிறது; ‘தான்’ அடையாளத்தை வலியுறுத்துகிறது.
- source_word: הַבְּכֹר
  choice: முதற்பேறானவன்
  rationale: பிறப்பு வரிசையுடன் குடும்ப நிலை மற்றும் ஆசீர்வாத உரிமை சார்ந்த முக்கியத்துவத்தையும் ‘முதற்பேறு’ என்ற சொல் பாதுகாக்கிறது.
- source_word: שִׂים
  choice: வையுங்கள்
  rationale: கட்டளைப் பொருளைத் தருகிறது; தகப்பனிடம் மகன் பேசும் சூழலில் மரியாதைப் பன்மை நவீனத் தமிழில் இயல்பானது.
- source_word: יְמִינְךָ
  choice: உமது வலது கையை
  rationale: ימין இச்சூழலில் வலது கையைக் குறிக்கிறது. ‘உமது’ என்ற வடிவம் மரியாதையைப் பேணுகிறது.
- source_word: עַל רֹאשׁוֹ
  choice: இவனுடைய தலையின்மேல்
  rationale: ஆசீர்வதிக்கும் கைவைப்பு சைகையைத் தெளிவாகக் குறிக்கிறது; எபிரேய மூன்றாம் நபர் பின்னொட்டைச் சூழலுக்கேற்ப ‘இவனுடைய’ என வழங்குகிறது.
theological_decisions:
- issue: ஆசீர்வாதச் சூழலில் பிறப்புரிமை நிலையைச் சுட்டும் சொல்
  choice: முதற்பேறானவன்
  alternative: மூத்தவன்
  rationale: הַבְּכֹר வெறும் வயது மூப்பை மட்டுமல்லாமல் பிறப்பு வரிசை, குடும்ப நிலை, ஆசீர்வாதம் ஆகியவற்றுடன் தொடர்புடைய சொல்லாக இருப்பதால் ‘முதற்பேறானவன்’ அந்த முக்கியத்துவத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். உரையாடலில் யோசேப்பு தகப்பனிடம் காட்டும் மரியாதைக்காக ‘உமது’, ‘வையுங்கள்’ பயன்படுத்தப்பட்டுள்ளன; ‘அப்படியல்ல’ அவனுடைய நேரடியான திருத்தத்தையும் மரியாதையையும் சமநிலைப்படுத்துகிறது.
