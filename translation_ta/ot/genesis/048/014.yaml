base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/014.yaml
  text: Then Israel stretched out his right hand and placed it on Ephraim’s head[a], though he was the younger, and his left hand on Manasseh’s head, crossing his hands, for Manasseh was the firstborn.
translation:
  language: ta
  text: அப்போது இஸ்ரவேல் தன் வலது கையை நீட்டி, இளையவனான எப்பிராயீமின் தலையின்மேல் வைத்தான்; தன் இடது கையை மனாசேயின் தலையின்மேல் வைத்தான். மனாசே முதற்பேறானவன் என்பதால், இஸ்ரவேல் தன் கைகளை வேண்டுமென்றே குறுக்காக வைத்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் கைகளைத் திட்டமிட்டு அமைத்தான்.” எபிரேயச் சொற்றொடர் நோக்கத்துடனும் திறமையாகவும் கைகளை அமைத்ததை வலியுறுத்தலாம்; இங்கு அவன் கைகளைக் குறுக்காக வைத்ததைச் சூழல் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: நீட்டி
  rationale: கையை அனுப்புதல் அல்ல, உடல்சார் செயலில் கையை நீட்டுதல் என்பதே இங்கு பொருள்; நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: וַיָּשֶׁת
  choice: வைத்தான்
  rationale: ஒருவரின் தலையின்மேல் கையை வைக்கும் செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: יְמִינוֹ / שְׂמֹאלוֹ
  choice: தன் வலது கை / தன் இடது கை
  rationale: இரு கைகளையும் வெளிப்படையாகக் குறிப்பிட்டு, எபிரெய உரையின் இணை அமைப்பையும் ஆசீர்வாதச் செயலையும் தெளிவாக்குகிறது.
- source_word: וְהוּא הַצָּעִיר
  choice: இளையவனான எப்பிராயீம்
  rationale: எப்பிராயீம் இளையவன் என்ற முரண்பாட்டுச் சூழலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: שִׂכֵּל אֶת יָדָיו
  choice: தன் கைகளை வேண்டுமென்றே குறுக்காக வைத்தான்
  rationale: சொற்றொடர் கடினமானது; உடனடிச் சூழலில் வலது கை இளையவன்மீதும் இடது கை முதற்பேறானவன்மீதும் வைக்கப்படுவது, இது திட்டமிட்ட குறுக்குவைப்பு என்பதைக் காட்டுகிறது. ‘வேண்டுமென்றே’ என்பது செயலின் நோக்கத்தன்மையைப் பாதுகாக்கிறது.
- source_word: כִּי
  choice: என்பதால்
  rationale: மனாசே முதற்பேறானவன் என்ற காரணமே வழக்கத்திற்கு மாறான கை அமைப்பை விளக்குகிறது.
- source_word: הַבְּכֹר
  choice: முதற்பேறானவன்
  rationale: வெறும் வயது மூப்பை அல்லாமல், ஆசீர்வாதச் சூழலில் முக்கியமான பிறப்பு வரிசை மற்றும் நிலையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: שִׂכֵּל אֶת יָדָיו என்பதன் பொருள்
  choice: யாக்கோபு தன் கைகளைத் திட்டமிட்டுக் குறுக்காக வைத்தான்
  alternative: யாக்கோபு தன் கைகளைத் திறமையாக அல்லது திட்டமிட்டு அமைத்தான்; குறுக்காக வைத்ததைச் சொற்றொடர் நேரடியாகக் கூறாமல் இருக்கலாம்
  rationale: இளைய எப்பிராயீமின் தலையில் வலது கையும் முதற்பேறான மனாசேயின் தலையில் இடது கையும் வைக்கப்பட்டதாக உடனடிச் சூழல் கூறுவதால், குறுக்காக வைத்தல் மிகச் சாத்தியமான பொருள். அதேவேளை எபிரெயச் சொற்றொடரின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; முதற்பேறுரிமை குறித்த எதிர்பார்ப்பு மாற்றப்படுவதைத் தாண்டிய பிற்காலக் கோட்பாடு எதுவும் உரைக்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் மொழியாக்கப்பட்டுள்ளது. ‘தலையின்மேல்’, ‘முதற்பேறானவன்’ ஆகிய வடிவங்கள் இயல்பையும் பண்பாட்டு-இறையியல் முக்கியத்துவத்தையும் சமநிலைப்படுத்துகின்றன.
