revisions:
- from: யோசேப்பு, தன் தந்தை எப்பிராயீமின் தலையின்மேல் தமது வலது கையை வைத்திருப்பதைக் கண்டபோது, அது அவன் கண்களுக்குத் தவறாகத் தோன்றியது[a]. எனவே, எப்பிராயீமின் தலையின்மேலிருந்து மனாசேயின் தலையின்மேல் அந்தக் கையை மாற்றுவதற்காகத் தன் தந்தையின் கையைப் பிடித்தான்.
  to: யோசேப்பு தன் தந்தை எப்பிராயீமின் தலையின்மேல் அவருடைய வலது கையை வைத்திருந்ததைக் கண்டபோது, அது அவன் பார்வையில் விரும்பத்தகாததாக இருந்தது[a]. அவன் தன் தந்தையின் கையைப் பிடித்து, அதை எப்பிராயீமின் தலையின்மேலிருந்து அகற்றி மனாசேயின் தலையின்மேல் வைப்பதற்காகச் செய்தான்.
