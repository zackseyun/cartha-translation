base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/017.yaml
  text: When Joseph saw that his father had placed his right hand on Ephraim’s head[a], it was displeasing in his eyes, and he took hold of his father’s hand to remove it from Ephraim’s head to Manasseh’s head.
translation:
  language: ta
  text: யோசேப்பு தன் தந்தை எப்பிராயீமின் தலையின்மேல் அவருடைய வலது கையை வைத்திருந்ததைக் கண்டபோது, அது அவன் பார்வையில் விரும்பத்தகாததாக இருந்தது[a]. அவன் தன் தந்தையின் கையைப் பிடித்து, அதை எப்பிராயீமின் தலையின்மேலிருந்து அகற்றி மனாசேயின் தலையின்மேல் வைப்பதற்காகச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இயல்பாக: “அது அவனுக்குப் பிடிக்கவில்லை.” எபிரெய மொழியில் சொல்லுக்கு சொல், “அது அவன் கண்களில் கெட்டதாக இருந்தது.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא ... כִּי
  choice: '... வைத்திருப்பதைக் கண்டபோது'
  rationale: כִּי இங்கு யோசேப்பு கண்டதன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; ‘கண்டபோது’ என்பது தொடர் நிகழ்வையும் அவனுடைய உடனடி எதிர்வினையையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: יָשִׁית
  choice: வைத்திருப்பதை
  rationale: שׁית என்பதன் ‘வை/அமை’ என்ற பொருளைப் பேணுகிறது; யோசேப்பு கண்ட நேரத்தில் கை ஏற்கெனவே தலையின்மேல் இருந்த நிலையைத் தமிழில் தெளிவாக்குகிறது.
- source_word: יַד יְמִינוֹ
  choice: தமது வலது கையை
  rationale: ஆசீர்வாதச் செயலில் வலது கையின் முக்கியத்துவத்தைப் பேணும் இயல்பான தமிழ். ‘தமது’ என்பது எழுவாயான தந்தையைச் சுட்டுகிறது.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: அது அவன் கண்களுக்குத் தவறாகத் தோன்றியது
  rationale: எபிரெயச் சொல்லாட்சியில் உள்ள ‘அவன் கண்களில் கெட்டதாக இருந்தது’ என்ற உடலுறுப்பு உருவகத்தைப் பேணுகிறது; இச்சூழலில் ஒழுக்கரீதியான ‘தீமை’ என்று மிகைப்படுத்தாமல், யோசேப்புக்கு அது தவறெனத் தோன்றியதை வெளிப்படுத்துகிறது.
- source_word: וַיִּתְמֹךְ
  choice: பிடித்தான்
  rationale: תמך இங்கு கையை வேறு இடத்துக்கு மாற்றுவதற்காக உடலால் பற்றிக்கொள்வதைக் குறிக்கிறது; ‘பிடித்தான்’ இயல்பானதும் தேவையற்ற வன்மையைச் சேர்க்காததும் ஆகும்.
- source_word: לְהָסִיר אֹתָהּ
  choice: அந்தக் கையை மாற்றுவதற்காக
  rationale: הסיר என்பதன் அகற்று/விலக்கு என்ற இயக்கத்தை, அடுத்துள்ள இலக்கான மனாசேயின் தலையுடன் சேர்த்து தெளிவான தமிழில் தருகிறது.
- source_word: מֵעַל רֹאשׁ אֶפְרַיִם עַל רֹאשׁ מְנַשֶּׁה
  choice: எப்பிராயீமின் தலையின்மேலிருந்து மனாசேயின் தலையின்மேல்
  rationale: ஒரு தலையிலிருந்து மற்றொரு தலையின்மேல் கையை மாற்றும் திசையையும் עַל கூறும் மேற்பரப்புத் தொடர்பையும் துல்லியமாகப் பேணுகிறது.
