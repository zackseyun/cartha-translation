translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அவன் கண்களுக்குத் தவறாகத் தோன்றியது’ என்பது மூலத்தின் கண்-உருவகத்தைத் தக்கவைத்தபடியே, இங்கு ஒழுக்கத் தீமையைத் தவறாக உணர்த்தாமல் அமைக்கப்பட்டுள்ளது. யாக்கோபைக் குறிக்கும் மரியாதைப் பன்மை ‘தமது’ என்றும், யோசேப்பைக் குறிக்கும் ஒருமை ‘அவன்’ என்றும் வேறுபடுத்தப்பட்டுள்ளது.
