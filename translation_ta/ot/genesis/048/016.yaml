base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/016.yaml
  text: The angel who has redeemed me from all evil[a], may he bless the boys; and may my name and the name of my fathers Abraham and Isaac be called on them[e][d][c][b]; and may they multiply greatly in the midst of the land.
translation:
  language: ta
  text: எல்லாத் தீமையிலிருந்தும்[a] என்னை மீட்ட அந்தத் தூதர் இந்தப் பிள்ளைகளை ஆசீர்வதிப்பாராக. என் பெயரும் என் தந்தையரான ஆபிரகாம், ஈசாக்கு ஆகியோரின் பெயரும் அவர்கள்மேல் சூட்டப்படட்டும்[b]. அவர்கள் நிலத்தின் நடுவில்[d] மிகுதியாகப் பெருகட்டும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எல்லாத் தீங்கிலிருந்தும்’ அல்லது ‘ஒவ்வொரு துன்பத்திலிருந்தும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒழுக்கத் தீமையோடு பேரிடர், தீங்கு ஆகியவற்றையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, ‘என் பெயரும் என் தந்தையரான ஆபிரகாம், ஈசாக்கு ஆகியோரின் பெயரும் அவர்கள்மேல் அழைக்கப்படட்டும்.’ இந்த எபிரெய மரபுத்தொடர் அவர்கள் அந்தக் குடும்பப் பெயரையும் அடையாளத்தையும் தாங்குவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘அவர்கள் ஒரு பெருங்கூட்டமாக வளரட்டும்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள அரிதான எபிரெய வினை மீன்களைப் போல ஏராளமாகப் பெருகும் உருவகத்தை உணர்த்தக்கூடும்.
    reason: lexical_alternative
  - marker: d
    text: ‘பூமியின் நடுவில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சூழலுக்கேற்ப ‘நிலம்’ அல்லது ‘பூமி’ எனப் பொருள்படும்.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: அந்தத் தூதர்
  rationale: מַלְאָךְ என்பது ‘தூதர்’ அல்லது ‘வானதூதர்’ எனப் பொருள்படலாம். இங்கு தெய்வீகப் பாதுகாப்புடன் தொடர்புடையவராக இருப்பதால் ‘அந்தத் தூதர்’ என்று மொழிபெயர்ப்பது இயல்பாகவும், அவரது அடையாளத்தை மேலதிகமாகத் தீர்மானிக்காமலும் உள்ளது.
- source_word: הַגֹּאֵל אֹתִי
  choice: என்னை மீட்ட
  rationale: גאל என்பது மீட்பவர் அல்லது விடுவிப்பவர் செய்யும் செயலைக் குறிக்கிறது. யாக்கோபு தன் கடந்தகால வாழ்வில் பெற்ற பாதுகாப்பைத் திரும்பிப் பார்ப்பதால், நிறைவேறிய செயலைக் காட்டும் ‘என்னை மீட்ட’ பொருத்தமானது.
- source_word: מִכָּל רָע
  choice: எல்லாத் தீமையிலிருந்தும்
  rationale: רָע என்பது ஒழுக்கத் தீமையையும் தீங்கு, துன்பம், பேரிடர் போன்றவற்றையும் குறிக்கக்கூடும். ‘தீமை’ எபிரெயச் சொல்லின் பரந்த பொருளைத் தக்கவைக்கிறது; சூழலில் தீங்கு அல்லது துன்பம் என்ற பொருளும் அடங்கும்.
- source_word: יְבָרֵךְ
  choice: ஆசீர்வதிப்பாராக
  rationale: ஆசீர்வாதச் சூழலில் இந்த வினைவடிவம் விருப்பம் அல்லது வேண்டுதலைக் குறிக்கிறது. ‘ஆசீர்வதிப்பாராக’ என்பது அதை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַנְּעָרִים
  choice: இந்தப் பிள்ளைகளை
  rationale: இது எப்பிராயீம், மனாசே ஆகிய இரு இளம் ஆண் சந்ததியரைக் குறிக்கிறது. தமிழில் சூழலுக்கேற்ற இயல்பான குறிப்பு ‘இந்தப் பிள்ளைகள்’ ஆகும்.
- source_word: וְיִקָּרֵא בָהֶם שְׁמִי
  choice: என் பெயர் அவர்கள்மேல் சூட்டப்படட்டும்
  rationale: சொல்லுக்கு நெருக்கமாக இது ‘என் பெயர் அவர்கள்மேல் அழைக்கப்படட்டும்’ என்பதாகும். குடும்ப அடையாளமும் உரிமையும் அவர்களுடன் இணைக்கப்படுவதை ‘பெயர் அவர்கள்மேல் சூட்டப்படட்டும்’ என்பது தமிழில் புரியத்தக்க விதத்தில் கூறுகிறது; மூல உருவகமும் ஓரளவு தக்கவைக்கப்படுகிறது.
- source_word: וְשֵׁם אֲבֹתַי אַבְרָהָם וְיִצְחָק
  choice: என் தந்தையரான ஆபிரகாம், ஈசாக்கு ஆகியோரின் பெயர்
  rationale: எபிரெயத்தில் ‘பெயர்’ ஒருமையில் இருந்து இருவரின் குடும்ப அடையாளத்தைத் தொகுத்துக் குறிக்கிறது. தமிழிலும் ஒருமையைத் தக்கவைத்துள்ளது.
- source_word: וְיִדְגּוּ לָרֹב
  choice: மிகுதியாகப் பெருகட்டும்
  rationale: அரிதான דגה வினை மீனைப் போல ஏராளமாகப் பெருகும் நிழற்பொருளைக் கொண்டிருக்கலாம். முதன்மை உரையில் தெளிவான தமிழுக்காக ‘மிகுதியாகப் பெருகட்டும்’ பயன்படுத்தப்பட்டு, உருவகச் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: இந்த நிலத்தின் நடுவில்
  rationale: אֶרֶץ என்பது ‘நிலம்’ அல்லது ‘பூமி’ எனப் பொருள்படலாம். முற்பிதாக்களுக்கும் சந்ததிக்கும் வாக்களிக்கப்பட்ட நிலம் என்ற சூழலில் ‘இந்த நிலம்’ பொருத்தமானது; விரிவான பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: யாக்கோபின் ஆசீர்வாதத்தில் வரும் ‘தூதர்’ யார்?
  choice: ‘அந்தத் தூதர்’ என்று மட்டும் கூறி, அவரது இயல்பைத் திட்டவட்டமாக வரையறுக்கவில்லை.
  alternative: அவர் தேவனின் வெளிப்பாடு எனக் கருதுதல்; அல்லது தேவனுக்காகச் செயல்படும் படைக்கப்பட்ட தூதர் எனக் கருதுதல்.
  rationale: இந்த வசனம் தேவனுடைய பாதுகாப்பையும் தூதரின் செயலையும் நெருக்கமாக இணைத்தாலும், தூதரின் இயல்பை எபிரெய உரை வெளிப்படையாக விளக்கவில்லை. ஆகவே அந்த இறையியல் அழுத்தமும் தெளிவின்மையும் அப்படியே விடப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான ஆசீர்வாத நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆசீர்வதிப்பாராக’, ‘சூட்டப்படட்டும்’, ‘பெருகட்டும்’ ஆகிய விருப்பவினை வடிவங்கள் மூலத்தின் வேண்டுதல் நயத்தைத் தக்கவைக்கின்றன. தூதரின் அடையாளம் குறித்த இறையியல் முடிவு உரைக்குள் சேர்க்கப்படவில்லை.
