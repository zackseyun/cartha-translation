revisions:
- from: எல்லாத் தீமையிலிருந்தும்[a] என்னை மீட்ட அந்தத் தூதர் இந்தப் பிள்ளைகளை ஆசீர்வதிப்பாராக. என் பெயரும் என் தந்தையரான ஆபிரகாம், ஈசாக்கு ஆகியோரின் பெயரும் அவர்கள்மேல் சூட்டப்படட்டும்[b]. அவர்கள் இந்த நிலத்தின் நடுவில்[d] மிகுதியாகப் பெருகட்டும்[c].
