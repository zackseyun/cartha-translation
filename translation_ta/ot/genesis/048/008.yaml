base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/008.yaml
  text: When Israel saw Joseph's sons[a], he said[b], “Who are these?”
translation:
  language: ta
  text: இஸ்ரவேல்[a] யோசேப்பின் மகன்களைப் பார்த்தபோது, “இவர்கள் யார்?” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘இஸ்ரவேல்’ என்பது யாக்கோபின் மற்றொரு பெயர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: பார்த்தபோது
  rationale: தொடர்ந்து வரும் உரைக்கு முன்பான நிகழ்வை இயல்பான தமிழில் காலத் தொடர்புடன் காட்டுகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: மூல எபிரெய உரை ‘யாக்கோபு’ என்பதற்குப் பதிலாக ‘இஸ்ரவேல்’ என்ற பெயரையே பயன்படுத்துவதால் அதுவே தக்கவைக்கப்படுகிறது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் எபிரெய இலக்கண உருபு; தமிழில் இதற்குத் தனிச் சொல் தேவையில்லை.
- source_word: בְּנֵי יוֹסֵף
  choice: யோசேப்பின் மகன்களை
  rationale: ‘யோசேப்பின் மகன்கள்’ என்ற உடைமைத் தொடர்பை இயல்பான தமிழில் தருகிறது; வாக்கியத்தில் செயப்படுபொருள் வேற்றுமை உருபு சேர்க்கப்பட்டுள்ளது.
- source_word: וַיֹּאמֶר
  choice: என்று கேட்டார்
  rationale: சொல்லப்பட்ட நேரடி உரை ஒரு கேள்வியாக இருப்பதால், எபிரெய ‘சொன்னார்’ என்பதன் உரையாடல் செயல்பாட்டை இயல்பான தமிழில் ‘கேட்டார்’ என வழங்குகிறது.
- source_word: מִי אֵלֶּה
  choice: இவர்கள் யார்?
  rationale: முன்னிலையில் உள்ள மனிதர்களின் அடையாளத்தைக் கேட்கும் பன்மைக் கேள்விக்கு இயல்பான நவீனத் தமிழ் வடிவம்.
theological_decisions:
- issue: முற்பிதாவின் பெயர்
  choice: இஸ்ரவேல்
  alternative: யாக்கோபு
  rationale: இவ்வசனத்தில் மூல உரை உடன்படிக்கையுடன் தொடர்புடைய ‘இஸ்ரவேல்’ என்ற பெயரைப் பயன்படுத்துகிறது; அதை ‘யாக்கோபு’ என மாற்றாமல் மூலத்தின் சொல் தேர்வு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பார்த்தபோது’ நிகழ்வுகளின் காலத் தொடர்பைக் காட்டுகிறது; மனிதர்களைக் குறிப்பதால் ‘இவர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
