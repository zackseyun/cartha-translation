source:
  edition: WLC
  text: וַ/יּוֹצֵ֥א יוֹסֵ֛ף אֹתָ֖/ם מֵ/עִ֣ם בִּרְכָּ֑י/ו וַ/יִּשְׁתַּ֥חוּ לְ/אַפָּ֖י/ו אָֽרְצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/012.yaml
  text: Then Joseph brought them out from between his knees[a], and he bowed with his face to the ground.
translation:
  language: ta
  text: பின்பு யோசேப்பு அவர்களை யாக்கோபின் முழங்கால்களுக்கு இடையிலிருந்து வெளியே கொண்டு வந்தான்; முகங்குப்புறத் தரையில் விழுந்து வணங்கினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: விலக்கி
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் பிறரை இருந்த இடத்திலிருந்து வெளியே வரச் செய்வதைக் குறிக்கிறது. இங்கு யோசேப்பு தன் மகன்களை யாக்கோபின் அருகிலிருந்த நிலையிலிருந்து விலக்குவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֹתָם
  choice: அவர்களை
  rationale: இது எப்பிராயீம், மனாசே ஆகிய இருவரையும் குறிக்கும் நேரடி செயப்படுபொருள் சுட்டுப்பெயர்.
- source_word: מֵעִם בִּרְכָּיו
  choice: அவருடைய முழங்கால்களுக்கு இடையிலிருந்து
  rationale: எபிரெய முன்சொல் சொற்படியாக ‘அருகிலிருந்து/உடனிருந்த இடத்திலிருந்து’ என்று பொருள்படலாம். ஆசீர்வாத நிகழ்வில் சிறுவர்கள் யாக்கோபுக்கு மிக அருகில் இருந்த உடல் நிலையைக் ‘முழங்கால்களுக்கு இடையிலிருந்து’ என்பது தெளிவாகவும் இயல்பாகவும் எடுத்துரைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּשְׁתַּחוּ
  choice: குனிந்து வணங்கினான்
  rationale: שׁחה வடிவம் மரியாதையுடன் உடலைத் தாழ்த்தி வணங்குவதைக் குறிக்கிறது. தொடர்ந்து வரும் ‘முகம் தரையை நோக்கும்படி’ என்ற சொற்றொடருடன் இணைந்து முழு உடல்நிலையையும் காட்டுகிறது.
- source_word: לְאַפָּיו אָרְצָה
  choice: தன் முகம் தரையை நோக்கும்படி
  rationale: ‘அவனுடைய முகம் தரையை நோக்கி’ என்ற திசைசார் பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது; வணக்கத்தின் ஆழமான உடல்நிலையை மிகைப்படுத்தாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘அவருடைய முழங்கால்கள்’ என்பதில் உடைமையாளரின் குறிப்பு
  choice: யாக்கோபின் முழங்கால்கள்
  alternative: யோசேப்பின் முழங்கால்கள்
  rationale: முந்தைய சூழலில் யாக்கோபு சிறுவர்களைத் தன்னருகே அணைத்து ஆசீர்வதிக்கத் தயாராகிறார்; இங்கு யோசேப்பு அவர்களை யாக்கோபிடமிருந்து விலக்குகிறான். ஆகவே ஒருமை ஆண்பால் பின்னொட்டு இயல்பாக யாக்கோபைக் குறிக்கிறது. பெயரை உரைக்குள் சேர்க்காமல் எபிரெயத்தின் சுட்டுப்பெயர் அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அவருடைய’ என்பது யாக்கோபைக் குறிக்கிறது; ‘தன்’ என்பது யோசேப்பைக் குறிக்கிறது என்று வேறுபடுத்தி குழப்பம் குறைக்கப்பட்டுள்ளது. எபிரெயச் சொற்றொடரின் இடவியல் தெளிவின்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
