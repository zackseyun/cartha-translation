base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/010.yaml
  text: Israel’s eyes were dim with age[a]; he could not see. So he brought them near to him[b], and he kissed them and embraced them.
translation:
  language: ta
  text: இஸ்ரவேலின் கண்கள் முதுமையால் மங்கியிருந்தன[a]; அவரால் பார்க்க முடியவில்லை. யோசேப்பு அவர்களை இஸ்ரவேலின் அருகே கொண்டுவந்தான்; இஸ்ரவேல் அவர்களை முத்தமிட்டு அணைத்துக்கொண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லர்த்தமாக, “இஸ்ரவேலின் கண்கள் முதுமையால் கனத்திருந்தன.” இந்த மரபுத்தொடர் அவருடைய பார்வை மங்கியிருந்ததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கண்கள்
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது; மூலத்தில் உள்ள ‘இஸ்ரவேல்’ என்ற பெயரையே தக்கவைக்கிறது.
- source_word: כָּבְדוּ מִזֹּקֶן
  choice: முதுமையால் மங்கியிருந்தன
  rationale: சொல்லர்த்தமாக ‘முதுமையால் கனத்திருந்தன’ என்றாலும், பார்வைத்திறன் குறைந்ததைச் சுட்டும் எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: அவரால் பார்க்க முடியவில்லை
  rationale: பார்க்க இயலாத நிலையைக் கண்ணியமான, இயல்பான நவீன தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: וַיַּגֵּשׁ אֹתָם אֵלָיו
  choice: அவர் அவர்களைத் தம்மருகே நெருங்கிவரச் செய்து
  rationale: ஹிஃபில் வினையின் ‘அருகே வரச் செய்தல்/கொண்டுவருதல்’ என்ற காரணவினைப் பொருளையும் אֵלָיו என்பதன் ‘தம்மருகே’ என்ற இடநிலையையும் காக்கிறது. வினையின் மறைந்துள்ள எழுவாயை பெயரிட்டு தீர்மானிக்காமல் சுட்டுப்பெயரால் வழங்குகிறது.
- source_word: וַיִּשַּׁק לָהֶם
  choice: அவர்களுக்கு முத்தமிட்டு
  rationale: לְ உடன் வரும் எபிரெயப் பயன்பாட்டை இயல்பான தமிழில் ‘அவர்களுக்கு முத்தமிட்டு’ என்று வழங்குகிறது.
- source_word: וַיְחַבֵּק לָהֶם
  choice: அவர்களை அணைத்துக்கொண்டார்
  rationale: அன்பான உடல் செயலை உரையின் கண்ணியமான நடைக்கு ஏற்ற ‘அணைத்துக்கொண்டார்’ என்பதால் தெரிவிக்கிறது.
theological_decisions:
- issue: וַיַּגֵּשׁ என்ற வினையின் மறைந்துள்ள எழுவாய்
  choice: முதன்மை உரையில் ‘அவர்’ என்று வைத்து, இயல்பான தொடர்ச்சியில் இஸ்ரவேலைச் சுட்டவிடுதல்
  alternative: ‘யோசேப்பு அவர்களை அவரருகே கொண்டுவந்தான்’
  rationale: எபிரெய வினையில் எழுவாய் பெயரிட்டு கூறப்படவில்லை. உடனடி இலக்கணத் தொடர்ச்சி இஸ்ரவேலை நோக்கினாலும், முந்தைய சூழலின் அடிப்படையில் யோசேப்பு என்று புரிந்துகொள்ளும் வாய்ப்பும் உள்ளது; ஆகவே மூலத்தின் தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இஸ்ரவேலைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; செயல்களின் எழுவாய் குறித்த எபிரெயத் தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
