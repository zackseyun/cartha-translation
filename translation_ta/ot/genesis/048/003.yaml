base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/003.yaml
  text: And Jacob said to Joseph[a], “God Almighty appeared to me at Luz in the land of Canaan and blessed me,”
translation:
  language: ta
  text: யாக்கோபு யோசேப்பிடம், “கானான் நாட்டிலுள்ள லூசில் எல்லாம் வல்ல இறைவன்[a] எனக்குத் தோன்றி, என்னை ஆசீர்வதித்தார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “எல் ஷத்தாய்.” இது மரபாக “எல்லாம் வல்ல இறைவன்” என்று மொழிபெயர்க்கப்படுகிறது; ஷத்தாய் என்ற சொல்லின் துல்லிய நுண்பொருள் குறித்து கருத்து வேறுபாடு உள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: எபிரெயக் கதைத் தொடரில் வரும் உரையாடல் வினையைத் தமிழில் இயல்பான நேர்கூற்று அமைப்பில் வாக்கிய முடிவில் வைத்துள்ளது; தொடர்ச்சியைச் செயற்கையாக மிகைப்படுத்தவில்லை.
- source_word: אֶל
  choice: இடம்
  rationale: பேச்சு நோக்கிச் சொல்லப்பட்ட நபரைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: אֵל שַׁדַּי
  choice: எல்லாம் வல்ல இறைவன்
  rationale: இது ஒரு தெய்வீகப் பட்டம். வழக்கமான தமிழ் வேதாகமச் சொல்லாட்சியுடனும் நவீன வாசிப்புடனும் பொருந்துமாறு பொருளாக்கப்பட்டுள்ளது; שַׁדַּי என்பதன் துல்லிய நுண்பொருள் விவாதத்திற்குரியது என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: נִרְאָה
  choice: தோன்றி
  rationale: ראה என்பதன் நிஃபால் வடிவம் இங்கு வெளிப்பட்டுத் தோன்றுதலைக் குறிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத விளக்கத்தைச் சேர்க்காமல் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: אֵלַי
  choice: எனக்கு
  rationale: தோற்றத்தின் நோக்குநபர் யாக்கோபு என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּלוּז
  choice: லூசில்
  rationale: நிகழ்வு நடந்த இடத்தைக் குறிக்கும் இயல்பான தமிழ் வேற்றுமை வடிவம்.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: கானான் நாட்டிலுள்ள
  rationale: மூலத்தின் ‘கானான் நாடு’ என்ற புவியியல் குறிப்பையும் லூசுடனான தொடர்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַיְבָרֶךְ אֹתִי
  choice: என்னை ஆசீர்வதித்தார்
  rationale: அதே தெய்வீக எழுவாயின் செயலை மரியாதைப் பன்மை வினைமுற்றுடன் இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: אֵל שַׁדַּי என்ற தெய்வீகப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: எல்லாம் வல்ல இறைவன்
  alternative: எல் ஷத்தாய்
  rationale: பட்டத்தை ஒலிபெயர்ப்பதைவிட அதன் மரபான பொருளை முதன்மை உரையில் தருகிறது. அதேவேளை שַׁדַּי என்பதன் துல்லிய நுண்பொருள் உறுதியற்றதால், எபிரெய வடிவமும் விவாதநிலையும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. நேர்கூற்று தமிழ் இலக்கணத்திற்கேற்ப வாக்கிய முடிவில் ‘என்றார்’ என முடிகிறது; இறைவனைக் குறிக்கும் வினை மரியாதை வடிவில் உள்ளது.
