  revised_text: 'அவர் யோசேப்பை ஆசீர்வதித்து, கூறினார்: “என் முன்னோர்களான ஆபிரகாமும் ஈசாக்கும் எவர் முன்னிலையில் நடந்து வாழ்ந்தார்களோ[a], அந்தத் தேவன், என் வாழ்வின் தொடக்கத்திலிருந்து[b] இந்நாள்வரை என்னை மேய்த்துவந்தவர்[c],'
