  revision_rationale: சிறிய நடை மற்றும் தெளிவுத் திருத்தங்கள் மட்டுமே செய்யப்பட்டுள்ளன. மூல எபிரெயத்தின் தொடர் வினைகள் ‘ஆசீர்வதித்து, கூறினார்’ எனத் தெளிவாக்கப்பட்டன; מֵעוֹדִי-யின் பிறப்பை மட்டும் குறிக்காத பரந்த தொடக்கக் கருத்தைத் தக்கவைத்து இயல்பான ‘தொடக்கத்திலிருந்து’ பயன்படுத்தப்பட்டது. மேய்ப்பர் உருவகம் மாற்றப்படவில்லை; இணை அடையாளக்கூற்றில் தமிழின் ஓட்டத்திற்காக ‘தேவன்’ என்பதற்குப் பதில் ‘மேய்த்துவந்தவர்’ பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடர்வதால் இறுதிக் காற்புள்ளி பாதுகாக்கப்பட்டுள்ளது.
