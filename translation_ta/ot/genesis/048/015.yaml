  source_fidelity: 'மூல எபிரெயத்தின் வாக்கிய அமைப்பும் பொருளும் பெரும்பாலும் துல்லியமாகக் காக்கப்பட்டுள்ளன: யோசேப்பை ஆசீர்வதித்தல், ஆபிரகாம்-ஈசாக்கு தேவனுக்கு முன்பாக நடந்துவாழ்தல், வாழ்வின் தொடக்கத்திலிருந்து இந்நாள்வரை தேவனுடைய மேய்ப்புப் பராமரிப்பு ஆகியவை சரியாக உள்ளன. ஆனால் ‘ஆசீர்வதித்துக் கூறினார்’ என்பது இரண்டு தனி வினைகளை இணைத்து, ‘ஆசீர்வதித்து, கூறினார்’ என்பதைக் காட்டிலும் சற்றே மங்கலாக்குகிறது. மேலும் ‘அந்தத் தேவன்’ என்பதற்குப் பின் தொடரும் இரண்டாம் இணை அடையாளக்கூற்றில் ‘தேவன்’ சேர்ப்பது மூலத்தின் மீளுரைப்பைத் தக்கவைத்தாலும், தொடர்ச்சியான தொடர்புச் சொற்றொடர்களுடன் சிறிது கனமாகிறது; ‘என்னை மேய்த்துவந்தவர்’ என அமைத்தால் மூலத்தின் இணை அமைப்பு இயல்பாகத் தெளிவாகும்.'
  naturalness: ‘எவர் முன்னிலையில் நடந்து வாழ்ந்தார்களோ’ நவீன தரத் தமிழில் இயல்பாகவும் மூல உருவகத்தைப் பாதுகாப்பதாகவும் உள்ளது. ‘என்னை மேய்த்துவந்த தேவன்’ புரிந்துகொள்ளத்தக்கது; ஆனால் மனிதரை நேரடியாக ‘மேய்த்தல்’ என்று சொல்வது சில வாசகர்களுக்குச் சற்றே கடினமாக இருக்கலாம். உருவகத்தை மாற்றாமல் ‘என்னை மேய்த்துவந்தவர்’ என்பது இங்கு ஓட்டமாக அமைகிறது. ‘வாழ்வின் தொடக்கமுதல்’ என்பதற்குப் பதில் ‘வாழ்வின் தொடக்கத்திலிருந்து’ என்பது வழக்கமான உரைநடை வடிவம்.
  terminology: ஆபிரகாம், ஈசாக்கு, யோசேப்பு ஆகிய பெயர் வடிவங்கள் நிலையான தமிழ் வேதாகமப் பயன்பாட்டுடன் ஒத்துள்ளன. ‘தேவன்,’ ‘ஆசீர்வதித்தார்,’ ‘மேய்த்துவந்தவர்’ ஆகிய சொற்கள் பொருத்தமான கண்ணியமான பதிவில் உள்ளன. அடிக்குறிப்பு a-வில் ‘நடத்தல்’ என்பது வினைச்சொல்லாகத் தவறாகக் குறிக்கப்படலாம்; இங்கு ‘நடந்து வாழ்தல்’ அல்லது ‘நடத்தல்’ என்பது வாழ்க்கையை நடத்துதல் என்ற சொல்லாட்சியாகத் தெளிவுபடுத்தப்பட வேண்டும்.
