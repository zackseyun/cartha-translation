base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/015.yaml
  text: And he blessed Joseph and said[a], “The God before whom my fathers Abraham and Isaac walked[b], the God who has shepherded me from my beginning to this day,”
translation:
  language: ta
  text: 'அவர் யோசேப்பை ஆசீர்வதித்து, கூறினார்: “என் முன்னோர்களான ஆபிரகாமும் ஈசாக்கும் எவர் முன்னிலையில் நடந்து வாழ்ந்தார்களோ[a], அந்தத் தேவன், என் வாழ்வின் தொடக்கத்திலிருந்து[b] இந்நாள்வரை என்னை மேய்த்துவந்தவர்[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் முன்னோர்களான ஆபிரகாமும் ஈசாக்கும் எவர் முன்னிலையில் வாழ்ந்தார்களோ.” ‘நடந்து வாழ்தல்’ என்பது தேவனுடைய முன்னிலையில் ஒருவர் தம் வாழ்க்கையை நடத்துவதைக் குறிக்கும் எபிரெயச் சொல்லாட்சி.
    reason: idiom_clarification
  - marker: b
    text: அல்லது, “என் வாழ்நாளெல்லாம்.” எபிரெயச் சொற்றொடர் யாக்கோபின் வாழ்வு அல்லது இருப்பின் தொடக்கத்திலிருந்தே தேவன் அவரைப் பராமரித்ததை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “என் மேய்ப்பராக இருந்தவர்” அல்லது “எனக்கு உணவளித்துவந்தவர்.” எபிரெய வினைச்சொல் மேய்ப்பரின் தொடர்ச்சியான பராமரிப்பையும் தேவைகளை நிறைவேற்றுவதையும் உருவகமாகக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ אֶת יוֹסֵף
  choice: அவர் யோசேப்பை ஆசீர்வதித்துக் கூறினார்
  rationale: எபிரெய உரை ஆசீர்வாதம் யோசேப்பின் மகன்களை நோக்கித் தொடர்ந்தாலும், யோசேப்பையே ஆசீர்வதித்தார் என்று வெளிப்படையாகக் கூறுகிறது; சூழலோடு ஒத்திசைக்க இதை மாற்றவில்லை.
- source_word: הָאֱלֹהִים
  choice: அந்தத் தேவன் / தேவன்
  rationale: குறிப்பிட்ட ஒரே தேவனை அவருடைய உறவுமுறையாலும் செயல்களாலும் அடையாளப்படுத்தும் எபிரெயத் திட்டவட்டத்தைக் காட்டுகிறது; தமிழில் முதல் குறிப்பில் ‘அந்தத்’ சேர்ப்பது இயல்பான இணைப்பை வழங்குகிறது.
- source_word: אֲשֶׁר הִתְהַלְּכוּ אֲבֹתַי לְפָנָיו
  choice: என் முன்னோர்கள் ... எவர் முன்னிலையில் நடந்து வாழ்ந்தார்களோ
  rationale: ‘முன்னிலையில் நடத்தல்’ என்ற உடன்படிக்கைசார் உருவகத்தைத் தக்கவைத்து, இது வாழ்க்கை நடத்தையைக் குறிக்கிறது என்பதை நவீன தமிழில் இயல்பாகத் தெரிவிக்க ‘நடந்து வாழ்ந்தார்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: אַבְרָהָם וְיִצְחָק
  choice: ஆபிரகாம், ஈசாக்கு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர் வடிவங்கள்.
- source_word: הָרֹעֶה אֹתִי
  choice: என்னை மேய்த்துவந்த
  rationale: மேய்ப்பரின் தொடர்ச்சியான பராமரிப்பு, வழிநடத்தல், உணவளித்தல் ஆகியவற்றை உள்ளடக்கும் செயற்பாட்டு உருவகத்தையும் எபிரெய நிகழ்காலப் பங்கேற்பெயரின் நீடித்த தன்மையையும் காக்கிறது.
- source_word: מֵעוֹדִי
  choice: என் வாழ்வின் தொடக்கமுதல்
  rationale: யாக்கோபின் வாழ்வு அல்லது இருப்பின் ஆரம்பத்திலிருந்து என்ற பரந்த பொருளைக் காக்கிறது; ‘பிறந்ததுமுதல்’ என்று குறிப்பிட்ட பிறப்பு நிகழ்வுக்கு மட்டும் சுருக்கவில்லை.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை
  rationale: ஆரம்பத்திலிருந்து பேசும் தற்போதைய நாள்வரை தொடர்ந்த காலத்தைக் காட்டும் இயல்பான, கண்ணியமான தமிழ் வடிவம்.
theological_decisions:
- issue: தேவனுக்கு முன்பாக நடத்தல் என்ற முற்பிதாக்களின் சொல்லாட்சியை மொழிபெயர்த்தல்
  choice: எவர் முன்னிலையில் நடந்து வாழ்ந்தார்களோ
  alternative: எவரைப் பின்பற்றினார்களோ / எவர் முன்னிலையில் வாழ்ந்தார்களோ
  rationale: கீழ்ப்படிதல் என்ற ஒரே கருத்தாகச் சுருக்காமல், தேவனுடைய பார்வையில் அவரோடு உறவுடன் வாழ்தல் என்ற உருவகத்தின் உறவுமுறை மற்றும் உடன்படிக்கை நயத்தைத் தக்கவைக்கிறது.
- issue: தெய்வீக மேய்ப்பர் உருவகத்தை மொழிபெயர்த்தல்
  choice: என்னை மேய்த்துவந்த தேவன்
  alternative: என் மேய்ப்பராக இருந்த தேவன் / எனக்கு உணவளித்துவந்த தேவன்
  rationale: பராமரிப்பு மட்டுமன்றி வழிநடத்தல் மற்றும் பாதுகாப்பையும் உள்ளடக்கும் மேய்ப்பர் உருவகத்தைச் செயற்பாட்டு வடிவில் காக்கிறது; குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- issue: מֵעוֹדִי குறிக்கும் காலத் தொடக்கம்
  choice: என் வாழ்வின் தொடக்கமுதல்
  alternative: நான் பிறந்ததுமுதல் / என் வாழ்நாளெல்லாம்
  rationale: சொல் குறிக்கும் ஆரம்பகாலம் அல்லது இருப்பின் தொடக்கம் என்ற திறந்த நயத்தைப் பாதுகாத்து, பிறப்பு என்ற ஒரே நிகழ்வாகக் குறுக்காமல் வைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடையைக் கொண்டுள்ளது. ‘முன்னோர்கள்’ என்பது பன்மை ‘தந்தையர்’ ஏற்படுத்தக்கூடிய இயல்பின்மையைத் தவிர்க்கிறது. வசனம் அடுத்த வசனத்தில் தொடரும் ஆசீர்வாத வேண்டுதலின் தொடக்கமாக இருப்பதால், நிறைவு குறியீடு இடாமல் காற்புள்ளியுடன் முடிக்கப்பட்டுள்ளது.
