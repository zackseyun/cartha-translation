base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/020.yaml
  text: So he blessed them that day[a], saying, “By you Israel will bless, saying, ‘May God make you like Ephraim and like Manasseh.’” And he set Ephraim before Manasseh.
translation:
  language: ta
  text: அந்த நாளில் அவர் அவர்களை ஆசீர்வதித்து, “உன்னைக் கொண்டு இஸ்ரவேல், ‘கடவுள் உன்னை எப்பிராயீமைப் போலவும் மனாசேயைப் போலவும் ஆக்குவாராக’ என்று சொல்லி ஆசீர்வதிக்கும்[a]” என்றார். அவர் எப்பிராயீமை மனாசேக்கு முன் வைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னில் இஸ்ரவேல் ஆசீர்வதிக்கும்”; அதாவது, ஆசீர்வதிக்கும்போது இஸ்ரவேல் எப்பிராயீம், மனாசே என்னும் பெயர்களை ஓர் ஆசீர்வாதச் சூத்திரமாகப் பயன்படுத்தும்.
    reason: בְּךָ என்பதன் ‘உன்னில்’ என்ற சொற்படியான மாற்றையும், இச்சூழலில் பெயர்களைச் சார்ந்த ஆசீர்வாதச் சூத்திரம் என்ற அதன் பொருளையும் காட்டுகிறது.
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: அவர் அவர்களை ஆசீர்வதித்து
  rationale: பியேல் வினை வடிவமும் பன்மை நேரடிப் பொருள் பின்னொட்டும் எப்பிராயீம், மனாசே ஆகிய இருவரையும் குறிக்கின்றன.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்த நாளில்
  rationale: குறிப்பிட்ட காலத்தைக் காட்டும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: בְּךָ
  choice: உன்னைக் கொண்டு
  rationale: בְּ இங்கு இவர்களை முன்மாதிரியாக அல்லது ஆசீர்வாதச் சூத்திரத்தில் குறிப்பாகப் பயன்படுத்துவதைக் காட்டுகிறது; எபிரெயச் சொல்லின் கருவி/சார்பு நயத்தைப் பேணுகிறது.
- source_word: יְבָרֵךְ יִשְׂרָאֵל
  choice: இஸ்ரவேல் ... ஆசீர்வதிப்பான்
  rationale: முற்றுப்பெறா வினை எதிர்கால அல்லது வழக்கமான செயலைக் குறிக்கலாம். ‘இஸ்ரவேல்’ என்பதன் மூலவடிவம் அப்படியே வைக்கப்படுகிறது.
- source_word: יְשִׂמְךָ אֱלֹהִים
  choice: கடவுள் உன்னை ... ஆக்குவாராக
  rationale: ஆசீர்வாதச் சூழலில் இது விருப்பத்தை வெளிப்படுத்தும் வடிவம்; שׂים என்பதன் ‘ஆக்கு’ நயம் தமிழில் தெளிவாகிறது.
- source_word: כְּאֶפְרַיִם וְכִמְנַשֶּׁה
  choice: எப்பிராயீமைப் போலவும் மனாசேயைப் போலவும்
  rationale: இருமுறை வரும் ஒப்புமை முன்னொட்டின் அழுத்தத்தையும் ஓசையையும் ‘போலவும் ... போலவும்’ பேணுகிறது.
- source_word: וַיָּשֶׂם אֶת אֶפְרַיִם לִפְנֵי מְנַשֶּׁה
  choice: இவ்வாறு அவர் மனாசேயைவிட எப்பிராயீமுக்கு முன்னுரிமை கொடுத்தார்
  rationale: לִפְנֵי இச்சூழலில் வெறும் இட அமைப்பை விட ஆசீர்வாத வரிசையிலான முன்னுரிமையைக் குறிக்கிறது; இயல்பான தமிழில் அந்த உட்பொருள் தெளிவாக வழங்கப்படுகிறது.
theological_decisions:
- issue: ‘இஸ்ரவேல்’ என்பதன் குறிப்பு
  choice: ‘இஸ்ரவேல்’ என விரிவாக்கமின்றி மொழிபெயர்க்கப்பட்டது.
  alternative: ‘யாக்கோபு’ அல்லது ‘இஸ்ரவேல் மக்கள்’ என்று வெளிப்படையாகக் கூறுதல்.
  rationale: எபிரெய உரை ‘இஸ்ரவேல்’ என்று மட்டுமே கூறுகிறது; அது மூதாதையான யாக்கோபையும் அவரிடமிருந்து தோன்றும் மக்களையும் ஒலிக்கச் செய்யும் சாத்தியத்தைத் திறந்தவாறே வைக்கிறது.
- issue: எப்பிராயீமை மனாசேக்கு முன் வைத்ததன் பொருள்
  choice: ஆசீர்வாதத்தில் முன்னுரிமை கொடுத்தார் என மொழிபெயர்க்கப்பட்டது.
  alternative: உடலளவில் ‘மனாசேக்கு முன் எப்பிராயீமை வைத்தார்’ என மொழிபெயர்த்தல்.
  rationale: முந்தைய கையிடல் நிகழ்வைத் தொடர்ந்து, இவ்வாக்கியம் ஆசீர்வாதச் சூத்திரத்தில் எப்பிராயீமின் பெயர் முதலிடத்தில் வருவதன் முன்னுரிமையைச் சுருக்கமாகக் கூறுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில், ஆசீர்வாதச் சூத்திரத்தின் மறுமொழி ஓசையும் ‘இஸ்ரவேல்’ என்பதிலுள்ள திட்டமிட்ட தெளிவின்மையும் பேணப்பட்டுள்ளன.
