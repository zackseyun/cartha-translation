  source_fidelity: முதல் வாக்கியமும் ஆசீர்வாதச் சூத்திரமும் எபிரெய மூலத்தின் பொருளை நன்றாகப் பின்பற்றுகின்றன. ஆனால் וַיָּשֶׂם ... לִפְנֵי என்பதற்கு ‘முன்னுரிமை கொடுத்தார்’ என்பது சூழலுக்கு ஏற்ற விளக்கமாக இருந்தாலும், மூலத்தில் உள்ள ‘முன் வைத்தார்’ என்ற சொல்லாட்சியை விட அதிகமாக விளக்குகிறது. அதை நேரடியாக வழங்குவது சிறந்தது.
