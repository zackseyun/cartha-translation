id: GEN.48.4
reference: Genesis 48:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י הִנְ/נִ֤י מַפְרְ/ךָ֙ וְ/הִרְבִּיתִ֔/ךָ וּ/נְתַתִּ֖י/ךָ לִ/קְהַ֣ל עַמִּ֑ים וְ/נָ֨תַתִּ֜י אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את לְ/זַרְעֲ/ךָ֥ אַחֲרֶ֖י/ךָ אֲחֻזַּ֥ת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/004.yaml
  text: And he said to me, ‘Look, I will make you fruitful and multiply you, and I will make you into an assembly of peoples, and I will give this land to your offspring after you as an everlasting possession.’
translation:
  language: ta
  text: அவர் என்னிடம், “இதோ, நான் உன்னைப் பலுகவும் பெருகவும் செய்வேன்; உன்னைப் பல மக்களினங்களின் கூட்டமாக்குவேன்; இந்த நாட்டை உனக்குப் பின்வரும் உன் சந்ததிக்கு என்றென்றும் உரிமைச் சொத்தாகக் கொடுப்பேன்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: இதோ, நான்
  rationale: கவனத்தை ஈர்க்கும் הִנֵּה என்பதையும், முதல் நபர் சுட்டுப்பெயரையும் இயல்பான தமிழில் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: מַפְרְךָ וְהִרְבִּיתִךָ
  choice: உன்னைப் பலுகிப் பெருகச் செய்வேன்
  rationale: பலன்தரச் செய்தல் மற்றும் எண்ணிக்கையில் பெருகச் செய்தல் என்ற இணையான வாக்குறுதிகளைச் சுருக்காமல் காக்கிறது.
- source_word: קְהַל עַמִּים
  choice: மக்களினங்களின் கூட்டம்
  rationale: קהל என்பதன் ‘கூட்டம்/சபை’ கருத்தையும் עמים என்பதன் பன்மையையும் காக்கிறது; ஒரே தேசம் என்று குறுக்கவில்லை.
- source_word: זַרְעֲךָ אַחֲרֶיךָ
  choice: உனக்குப் பின்வரும் உன் சந்ததி
  rationale: ‘வித்து’ என்ற நேரடி உருவகத்துக்குப் பதிலாக, இங்கு குறிக்கப்படும் வருங்கால வழித்தோன்றல்களை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: אֲחֻזַּת עוֹלָם
  choice: என்றென்றும் உரிமைச் சொத்து
  rationale: אֲחֻזָּה என்பதிலுள்ள நிலையான உடைமை/உரிமைக் கருத்தையும் עוֹלָם என்பதிலுள்ள காலவரையற்ற நீடிப்பையும் காக்கிறது.
theological_decisions:
- issue: עוֹלָם என்ற சொல்லின் கால அளவு
  choice: என்றென்றும்
  alternative: நிரந்தரமான
  rationale: வாக்குறுதியின் வலிமையை முன்கூட்டியே வரையறுக்காமல், மூலத்தின் நீடித்த அல்லது காலவரையற்ற உடைமைக்கான மொழியைத் தக்கவைக்கிறது.
- issue: עַמִּים என்ற பன்மையின் அடையாளம்
  choice: மக்களினங்கள்
  alternative: மக்கள்
  rationale: யாக்கோபின் சந்ததியிலிருந்து பல மக்கள் குழுக்கள் உருவாகும் என்ற மூலத்தின் பன்மையைத் தெளிவாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க வேதாகம நடையிலும் வடிவமைக்கப்பட்டது. ‘இதோ’ கவன ஈர்ப்பைத் தக்கவைக்கிறது; வாக்குறுதியின் மூன்று பகுதிகளும் அரைப்புள்ளிகளால் தெளிவாகப் பிரிக்கப்பட்டுள்ளன.
