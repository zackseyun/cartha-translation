base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/005.yaml
  text: And now[a], your two sons, who were born to you in the land of Egypt before I came to you in Egypt, are mine; Ephraim and Manasseh shall be mine[c][b], like Reuben and Simeon.
translation:
  language: ta
  text: இப்போது, நான் எகிப்தில் உன்னிடம் வருவதற்கு முன்பு[a], எகிப்து நாட்டில் உனக்குப் பிறந்த உன் இரண்டு மகன்களும் என்னுடையவர்கள். எப்பிராயீமும் மனாசேயும் ரூபனையும் சிமியோனையும் போல எனக்குரியவர்களாக இருப்பார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரை இன்னும் நேரடியாக, “நான் எகிப்தில் உன்னிடம் வரும்வரை” என்றும் மொழிபெயர்க்கலாம்; சூழலில், யாக்கோபு வருவதற்கு முன்பு பிறந்த மகன்களையே இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, எப்பிராயீமும் மனாசேயும் யாக்கோபின் சொந்த மகன்களாகக் கணக்கிடப்பட்டு, ரூபன் மற்றும் சிமியோனுக்கு ஒப்பான நிலையைப் பெறுவார்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: யாக்கோபின் உரையில் தொடங்கும் புதிய, வலியுறுத்தப்பட்ட அறிவிப்பை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: שְׁנֵי בָנֶיךָ
  choice: உன் இரண்டு மகன்களும்
  rationale: எண்ணிக்கையையும் யோசேப்புடனான உறவையும் தெளிவாகப் பாதுகாக்கிறது; தமிழில் எழுவாயாக இயல்பாக அமைகிறது.
- source_word: הַנּוֹלָדִים לְךָ
  choice: உனக்குப் பிறந்த
  rationale: மகன்களை விவரிக்கும் எபிரெயப் பெயரெச்சத் தொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டில்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள ‘நாடு’ என்ற கூறைப் பாதுகாக்கிறது.
- source_word: עַד בֹּאִי אֵלֶיךָ מִצְרָיְמָה
  choice: நான் எகிப்தில் உன்னிடம் வருவதற்கு முன்பு
  rationale: עַד என்பதன் அடிப்படை வடிவம் ‘வரை’ என்றாலும், இச்சூழலில் யாக்கோபு வருவதற்கு முந்திப் பிறந்த மகன்களைக் குறிப்பதால் தமிழில் ‘முன்பு’ என்பது கால எல்லையைத் தெளிவாகக் கூறுகிறது; நேரடி மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לִי הֵם
  choice: என்னுடையவர்கள்
  rationale: தொழில்நுட்பமான ‘தத்தெடுத்தேன்’ என்ற சொல்லைச் சேர்க்காமல், யாக்கோபின் வலுவான உறவுரிமைக் கூற்றைப் பாதுகாக்கிறது.
- source_word: אֶפְרַיִם וּמְנַשֶּׁה
  choice: எப்பிராயீமும் மனாசேயும்
  rationale: தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்ற ஒலிபெயர்ப்புகள்.
- source_word: כִּרְאוּבֵן וְשִׁמְעוֹן
  choice: ரூபனையும் சிமியோனையும் போல
  rationale: כְּ குறிக்கும் ஒப்புமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יִהְיוּ לִי
  choice: எனக்குரியவர்களாக இருப்பார்கள்
  rationale: எதிர்கால அறிவிப்பின் solemn force-ஐ இயல்பான தமிழில் தருவதோடு, முன்வரும் ‘என்னுடையவர்கள்’ என்பதன் பொருளையும் தொடர்கிறது.
theological_decisions:
- issue: எப்பிராயீம் மற்றும் மனாசே மீதான யாக்கோபின் உரிமைக் கூற்றின் தன்மை
  choice: அவர்கள் யாக்கோபுக்குரியவர்கள் என்றும் ரூபன், சிமியோன் ஆகியோரைப் போன்ற நிலையுடையவர்கள் என்றும் நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர்களை என் சொந்த மகன்களாகத் தத்தெடுக்கிறேன்’ என்று வெளிப்படையாகக் கூறுதல்.
  rationale: எபிரெய உரை இணைத்துக்கொள்ளப்படுதலையும் மகன் நிலையையும் உணர்த்தினாலும், தொழில்நுட்பமான ‘தத்தெடுப்பு’ சொல்லைப் பயன்படுத்தவில்லை. ஆகவே அதன் உட்கருத்தை மிகையாக வரையறுக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. மூலத்தில் ‘எகிப்து’ இருமுறை வருவதால் அந்த மீளுரைப்பும் பாதுகாக்கப்பட்டது. ‘என்னுடையவர்கள் / எனக்குரியவர்கள்’ என்பது உறவுரிமையைக் காட்டுகிறது; உடைமைப் பொருளாகத் தவறாகச் சுருக்காமல், தொழில்நுட்பச் சட்டச் சொல்லையும் சேர்க்காமல் அமைக்கப்பட்டது.
