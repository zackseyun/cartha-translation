base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/019.yaml
  text: But his father refused and said[a], “I know, my son, I know. He too will become a people, and he too will become great. Nevertheless, his younger brother will become greater than he, and his offspring will become the fullness of nations.”
translation:
  language: ta
  text: ஆனால் அவனுடைய தந்தை மறுத்து, “எனக்குத் தெரியும், என் மகனே, எனக்குத் தெரியும். இவனும் ஒரு மக்களினமாக ஆவான்; இவனும் பெரியவனாவான். இருப்பினும், இவனுடைய இளைய சகோதரன் இவனைவிடப் பெரியவனாவான்; அவனுடைய சந்ததி தேசங்களின் நிறைவாகும்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “தேசங்களின் பெருந்திரளாகும்.” எபிரெயத்தில் இன்னும் சொற்படியாக, “தேசங்களின் நிறைவாகும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: மறுத்து
  rationale: מאן என்பது வெறும் தயக்கத்தையல்ல, திட்டவட்டமான மறுப்பைக் குறிக்கிறது; யோசேப்பின் செயலை யாக்கோபு ஏற்க மறுத்த சூழலுக்கு இது பொருந்துகிறது.
- source_word: יָדַעְתִּי ... יָדַעְתִּי
  choice: எனக்குத் தெரியும் ... எனக்குத் தெரியும்
  rationale: எபிரெய உரையின் வலியுறுத்தும் மறுபடியுரைத்தலை இயல்பான தமிழில் அப்படியே பாதுகாக்கிறது.
- source_word: בְנִי
  choice: என் மகனே
  rationale: யோசேப்பை நேரடியாக அழைக்கும் உடைமைப் பொருளுள்ள விளிப்பைத் தக்கவைக்கிறது.
- source_word: גַּם הוּא יִהְיֶה לְעָם
  choice: இவனும் ஒரு மக்களினமாக ஆவான்
  rationale: עָם என்பதன் கூட்டு மக்களைக் குறிக்கும் அடிப்படைப் பொருளைத் தக்கவைக்கிறது; அருகில் இருப்பவரைச் சுட்டும் தமிழ் நடை காரணமாக ‘இவன்’ பயன்படுத்தப்படுகிறது.
- source_word: וְגַם הוּא יִגְדָּל
  choice: இவனும் பெரியவனாவான்
  rationale: גדל என்பதிலுள்ள வளர்ந்து பெருமை அல்லது முக்கியத்துவம் அடையும் எதிர்கால நுட்பத்தை வெளிப்படுத்துகிறது.
- source_word: וְאוּלָם
  choice: இருப்பினும்
  rationale: மனாசேயும் பெரியவனாவான் என்ற கூற்றுக்கும் எப்பிராயீமின் மேலான நிலைக்கும் இடையிலான வலுவான முரண்பாட்டைக் குறிக்கிறது.
- source_word: אָחִיו הַקָּטֹן
  choice: இவனுடைய இளைய சகோதரன்
  rationale: הַקָּטֹן இங்கு உடல் அளவையல்ல, குடும்பப் பிறப்பு வரிசையைக் குறிப்பதால் ‘இளைய’ என்பது இயல்பான தேர்வு.
- source_word: יִגְדַּל מִמֶּנּוּ
  choice: இவனைவிடப் பெரியவனாவான்
  rationale: ஒப்பீட்டைக் குறிக்கும் מן என்பதையும், வளர்ந்து மேன்மை அடையும் வினை நுட்பத்தையும் பாதுகாக்கிறது.
- source_word: וְזַרְעוֹ
  choice: அவனுடைய சந்ததி
  rationale: זרע என்பதன் கூட்டு ஒருமைப் பொருளை நவீன, கண்ணியமான தமிழில் தருகிறது.
- source_word: יִהְיֶה מְלֹא הַגּוֹיִם
  choice: தேசங்களின் நிறைவாகும்
  rationale: מְלֹא என்பதன் ‘நிறைவு/முழுமை’ என்ற சொற்பொருளையும் הַגּוֹיִם என்பதன் நிர்ணயத் தன்மையையும் பாதுகாத்து, தெளிவற்ற தன்மையை விளக்கவுரையாக மாற்றாமல் விடுகிறது.
theological_decisions:
- issue: מְלֹא הַגּוֹיִם என்பதன் பொருள்
  choice: தேசங்களின் நிறைவு
  alternative: திரளான தேசங்கள்
  rationale: இச்சொற்றொடர் எண்ணிக்கையின் பெருக்கத்தைக் குறிக்கலாம்; எனினும் ‘திரள்’ என்று மட்டும் பொருள் தீர்மானிக்காமல், மூலத்தின் ‘நிறைவு’ என்ற சொல் மற்றும் அதன் சாத்தியமான இறையியல் ஒலிப்புகளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. உரையாடலின் வலியுறுத்தும் மறுபடியுரைத்தலும், சகோதரர்களுக்கிடையிலான எதிர்மறை ஒப்பீடும், இறுதிச் சொற்றொடரின் உண்மையான பொருள் நெகிழ்வும் பாதுகாக்கப்பட்டுள்ளன.
