  yaml_path: translation/ot/genesis/048/002.yaml
  text: And it was told to Jacob[a], and it was said, “Look, your son Joseph has come to you.” And Israel strengthened himself and sat up on the bed.
translation:
  language: ta
  text: யாக்கோபுக்கு, “இதோ, உங்கள் மகன் யோசேப்பு உங்களிடம் வந்திருக்கிறார்” என்று தெரிவிக்கப்பட்டது. இஸ்ரவேல் தன் பலத்தைத் திரட்டிக்கொண்டு, கட்டிலில் எழுந்து உட்கார்ந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “இஸ்ரவேல் தன்னைப் பலப்படுத்திக்கொண்டார்.”'
    reason: ‘தன் பலத்தைத் திரட்டிக்கொண்டு’ என்பதற்குப் பின்னுள்ள தற்சுட்டு வினை வடிவத்தின் நெருக்கமான சொற்பொருள் மாற்றைக் காட்டுகிறது.
lexical_decisions:
- source_word: וַיַּגֵּד לְיַעֲקֹב וַיֹּאמֶר
  choice: யாக்கோபுக்குச் செய்தி தெரிவிக்கப்பட்டது. அவரிடம் ... என்று சொல்லப்பட்டது
  rationale: எபிரெய உரையிலுள்ள ‘தெரிவித்தான்’ மற்றும் ‘சொன்னான்’ ஆகிய இரு வினைகளையும் தனித்தனியாக வெளிப்படுத்துகிறது; செய்பவர் குறிப்பிடப்படாததையும் தமிழில் இயல்பான செயப்பாட்டு வடிவில் காக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லின் வலிமையை நவீன, கண்ணியமான தமிழில் இயல்பாகத் தருகிறது.
- source_word: בִּנְךָ יוֹסֵף בָּא אֵלֶיךָ
  choice: உங்கள் மகன் யோசேப்பு உங்களிடம் வந்திருக்கிறார்
  rationale: யோசேப்பு வந்து சேர்ந்துவிட்டதையும் அதன் தற்போதைய தொடர்பையும் நிறைவுவினை வடிவம் வெளிப்படுத்துகிறது.
- source_word: וַיִּתְחַזֵּק
  choice: தன் பலத்தைத் திரட்டிக்கொண்டு
  rationale: நோயுற்ற நிலையில் இஸ்ரவேல் முயன்று தன்னை வலுப்படுத்திக்கொண்டார் என்ற தற்சுட்டுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיֵּשֶׁב עַל הַמִּטָּה
  choice: கட்டிலில் எழுந்து உட்கார்ந்தார்
  rationale: அடிப்படைப் பொருள் ‘கட்டிலின்மேல் உட்கார்ந்தார்’; நோயுற்றவர் படுத்திருந்த நிலையிலிருந்து உட்கார்ந்தார் என்பதைச் சூழல் உணர்த்துவதால் ‘எழுந்து’ என்பது தமிழில் அசைவைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: ஒரே வசனத்தில் ‘யாக்கோபு’ என்றும் ‘இஸ்ரவேல்’ என்றும் பெயர் மாறுவது
  choice: மூலத்தில் உள்ள பெயர் மாற்றத்தை அப்படியே காத்தல்
  alternative: நடை ஒருமைக்காக இரண்டு இடங்களிலும் ‘யாக்கோபு’ என்று வழங்குதல்
  rationale: இந்தப் பெயர் மாற்றத்துக்கு இலக்கிய அல்லது இறையியல் முக்கியத்துவம் இருக்கலாம்; அதை ஒரே பெயராகச் சீராக்குவது மூலத்திலுள்ள நுட்பத்தை இழக்கச் செய்யும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. யாக்கோபிடம் மரியாதைப் பன்மையில் பேசப்படுவதால் ‘உங்கள்’, ‘உங்களிடம்’ என்றும், யோசேப்பைக் குறிக்கும் வினையில் ‘வந்திருக்கிறார்’ என்றும் வழங்கப்பட்டுள்ளது. மூலத்தில் செய்பவர் பெயரிடப்படாத தன்மை செயப்பாட்டு வாக்கியங்களால் காக்கப்பட்டுள்ளது.
