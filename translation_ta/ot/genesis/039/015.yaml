  to: நான் குரலை உயர்த்திக் கூப்பிட்டதைக் அவன் கேட்டபோது, அவன் தன் ஆடையை என்னருகே விட்டுவிட்டு, தப்பியோடி வெளியே சென்றான்.[a]
