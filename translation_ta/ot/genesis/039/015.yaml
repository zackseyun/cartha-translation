  text: וַ/יְהִ֣י כְ/שָׁמְע֔/וֹ כִּֽי הֲרִימֹ֥תִי קוֹלִ֖/י וָ/אֶקְרָ֑א וַ/יַּעֲזֹ֤ב בִּגְד/וֹ֙ אֶצְלִ֔/י וַ/יָּ֖נָס וַ/יֵּצֵ֥א הַ/חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/015.yaml
  text: And when he heard that I had raised my voice and cried out[b][a], he left his garment beside me and fled and went outside.
translation:
  language: ta
  text: நான் குரலை உயர்த்திக் கூப்பிட்டதைக் அவன் கேட்டபோது, அவன் தன் ஆடையை என்னருகே விட்டுவிட்டு, தப்பியோடி வெளியே சென்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தன் ஆடையை என்னிடம் விட்டுவிட்டு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְשָׁמְעוֹ
  choice: கேட்டவுடன்
  rationale: וַיְהִי உடன் வரும் temporal כְּ + infinitive அமைப்பு, நிகழ்வுகளின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் ‘கேட்டவுடன்’ எனத் தெரிவிக்கிறது.
- source_word: כִּי הֲרִימֹתִי קוֹלִי וָאֶקְרָא
  choice: நான் குரலை உயர்த்திக் கூப்பிட்டதை
  rationale: כִּי இங்கு அவன் கேட்டதன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. ‘குரலை உயர்த்திக் கூப்பிட்டேன்’ என்பது எபிரெயச் சொல்லமைப்பையும் அவசரமான உரத்த அழைப்பையும் காக்கிறது.
- source_word: וַיַּעֲזֹב בִּגְדוֹ
  choice: அவன் தன் ஆடையை ... விட்டுவிட்டு
  rationale: בֶּגֶד ஒருமையில் இருப்பதால் ‘ஆடை’ என்று ஒருமையில் மொழிபெயர்க்கப்பட்டுள்ளது; עזב இச்சூழலில் அதனை அங்கே விட்டுச் சென்றதைக் குறிக்கிறது.
- source_word: אֶצְלִי
  choice: என்னருகே
  rationale: אֵצֶל அருகாமையையோ ஒருவரிடம் இருப்பதையோ குறிக்கலாம். முதன்மை உரையில் இடவியல் நெருக்கத்தைத் தெளிவாகக் காட்ட ‘என்னருகே’ பயன்படுத்தப்பட்டுள்ளது; ‘என்னிடம்’ என்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וַיָּנָס
  choice: தப்பியோடி
  rationale: נוּס திடீரெனத் தப்பி ஓடுவதைக் குறிக்கிறது; ‘தப்பியோடி’ அதன் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: וַיֵּצֵא הַחוּצָה
  choice: வெளியே சென்றான்
  rationale: வினைச்சொல்லும் திசையைக் குறிக்கும் הַחוּצָה என்பதும் உள்ளிருந்து வெளியே சென்ற நகர்வைக் காட்டுகின்றன.
