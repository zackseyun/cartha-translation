translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. குற்றஞ்சாட்டும் பெண்ணின் நேரடி உரைச் சூழலைக் காக்க முதல் நபர் வடிவம் தொடர்கிறது. எபிரெய மொழியின் நீண்ட தொடர் வாக்கியம் இயல்பான தமிழ் ஓட்டத்துடன் வழங்கப்பட்டுள்ளது.
