  text: וַ/יַּעֲזֹ֣ב כָּל אֲשֶׁר ל/וֹ֮ בְּ/יַד יוֹסֵף֒ וְ/לֹא יָדַ֤ע אִתּ/וֹ֙ מְא֔וּמָה כִּ֥י אִם הַ/לֶּ֖חֶם אֲשֶׁר ה֣וּא אוֹכֵ֑ל וַ/יְהִ֣י יוֹסֵ֔ף יְפֵה תֹ֖אַר וִ/יפֵ֥ה מַרְאֶֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/006.yaml
  text: So he left all that he had in Joseph’s hand[a], and he knew nothing with him except the food that he ate[b]. Now Joseph was handsome in form and handsome in appearance.
translation:
  language: ta
  text: அவன் தனக்கிருந்த எல்லாவற்றையும் யோசேப்பின் கையில் விட்டுவிட்டான்.[a] தான் உண்ணும் உணவைத் தவிர, யோசேப்பின் பொறுப்பில் இருந்த எதைப்பற்றியும் அவன் கவலைப்படவில்லை.[b] யோசேப்பு அழகிய உடல்வடிவமும் அழகிய தோற்றமும் கொண்டவனாக இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யோசேப்பின் கையில்’ என்பது அவனுடைய பொறுப்பில் அல்லது அதிகாரத்தின் கீழ் என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: idiom
  - marker: b
    text: 'எபிரெயில் சொல்லுக்குச் சொல்: ‘அவனோடு எதையும் அறியவில்லை; தான் உண்ணும் அப்பத்தைத் தவிர.’ இங்கு ‘அப்பம்’ என்பது பொதுவாக உணவைக் குறிக்கலாம்.'
    reason: literal_rendering_and_lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: விட்டுவிட்டான்
  rationale: עזב என்பதன் அடிப்படைப் பொருளான ‘விடுதல்’ என்பதைக் காக்கிறது; இந்த நிர்வாகச் சூழலில் எல்லாவற்றையும் யோசேப்பின் பொறுப்பில் விட்டுவைத்ததையும் இயல்பாக உணர்த்துகிறது.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: தனக்கிருந்த எல்லாவற்றையும்
  rationale: போத்திபாரின் உடைமைகளையும் வீட்டுக் காரியங்களையும் உள்ளடக்கும் எபிரெய விரிவை இயல்பான தமிழில் தருகிறது.
- source_word: בְּיַד יוֹסֵף
  choice: யோசேப்பின் கையில்
  rationale: அதிகாரம் அல்லது பொறுப்பைக் குறிக்கும் ‘கை’ என்ற எபிரெய உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் காக்கிறது.
- source_word: וְלֹא יָדַע אִתּוֹ מְאוּמָה
  choice: யோசேப்பின் பொறுப்பில் இருந்த எதைப்பற்றியும் அவன் கவலைப்படவில்லை
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘அவனோடு எதையும் அறியவில்லை’ என்றாலும், சூழலில் போத்திபார் யோசேப்பு கவனித்த காரியங்களைக் கண்காணிக்கவோ அவற்றைக் குறித்துக் கவலைப்படவோ இல்லை என்பதே பொருள். தமிழ் வாசகருக்கு இயல்பாகவும் தெளிவாகவும் இதைத் தெரிவிக்கிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַלֶּחֶם אֲשֶׁר הוּא אֹכֵל
  choice: தான் உண்ணும் உணவு
  rationale: לֶחֶם என்பதன் நேரடிப் பொருள் ‘அப்பம்’; இங்கு அது பொதுவாக உணவை அல்லது உணவுண்ணுதலைக் குறிப்பதாக இருப்பதால் ‘உணவு’ இயல்பான தெரிவாகும்.
- source_word: יְפֵה תֹאַר
  choice: அழகிய உடல்வடிவம்
  rationale: יְפֵה תֹאַר உடற்கட்டு அல்லது உருவ அமைப்பைக் குறிக்கிறது; அடுத்துள்ள தோற்றக் குறிப்பிலிருந்து வேறுபாட்டைக் காக்கிறது.
- source_word: וִיפֵה מַרְאֶה
  choice: அழகிய தோற்றம்
  rationale: கண்ணுக்குத் தெரியும் வெளித்தோற்றத்தைக் குறிக்கிறது; எபிரெய இணை அமைப்பின் இரண்டாவது கூறைத் தெளிவாக வழங்குகிறது.
