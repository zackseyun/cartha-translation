translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘கையில்’ என்ற மூல உருவகம் காக்கப்பட்டு, கடினமான எபிரெய மரபுத்தொடர் சூழலுக்கேற்ற இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உடல்வடிவம்/தோற்றம்’ என்ற இணைச்சொற்கள் மூலத்தின் இரு தனித்த குறிப்புகளையும் காக்கின்றன.
