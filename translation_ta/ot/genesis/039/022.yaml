  text: וַ/יִּתֵּ֞ן שַׂ֤ר בֵּית הַ/סֹּ֨הַר֙ בְּ/יַד יוֹסֵ֔ף אֵ֚ת כָּל הָ֣/אֲסִירִ֔ם אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/סֹּ֑הַר וְ/אֵ֨ת כָּל אֲשֶׁ֤ר עֹשִׂים֙ שָׁ֔ם ה֖וּא הָיָ֥ה עֹשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/022.yaml
  text: And the chief of the prison put into Yosef’s hand all the prisoners who were in the prison[a], and whatever was done there[c][b], he was the one doing it.
translation:
  language: ta
  text: சிறைச்சாலைத் தலைவர், சிறைச்சாலையில் இருந்த கைதிகள் அனைவரையும் யோசேப்பின் பொறுப்பில் ஒப்படைத்தார். அங்கே செய்யப்படும் அனைத்திற்கும் அவனே பொறுப்பாயிருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “அங்கே செய்யப்படுவதையெல்லாம் அவனே செய்து வந்தான்.” இந்த வாசகம் யோசேப்பின் செயற்பாட்டான மேற்பார்வையையும் தொடர்ச்சியான பொறுப்பையும் வலியுறுத்துகிறது.
    reason: எபிரெயத்தின் வலியுறுத்தப்பட்ட சுட்டுப்பெயரையும் היה + பங்கேற்புவினை அமைப்பின் தொடர்ச்சியான நுட்பத்தையும் காக்கிறது; அவர் எல்லா வேலைகளையும் தனிப்பட்ட முறையில் செய்தார் என்று கட்டாயப்படுத்தாமல் விடுகிறது.
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: சிறைச்சாலைத் தலைவர்
  rationale: சிறைச்சாலைக்குப் பொறுப்பான அதிகாரியை இயல்பான நவீனத் தமிழில் குறிக்கிறது; שַׂר என்பதன் ‘தலைவர்/மேற்பார்வையாளர்’ பொருளையும் காக்கிறது.
- source_word: בְּיַד יוֹסֵף
  choice: யோசேப்பின் பொறுப்பில்
  rationale: ‘யோசேப்பின் கையில்’ என்ற எபிரெய வழக்குச் சொல்லின் பொருள், ஒருவரின் கட்டுப்பாட்டிலும் பொறுப்பிலும் ஒப்படைத்தல் என்பதாகும்; தமிழில் அதன் கருத்தைத் தெளிவாக வழங்குகிறது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: כָּל הָאֲסִירִם
  choice: கைதிகள் அனைவரையும்
  rationale: சிறையில் அடைக்கப்பட்டவர்களைக் குறிக்கும் தெளிவான, பொதுவழக்கிலுள்ள தமிழ்ச் சொல்.
- source_word: וְאֵת כָּל אֲשֶׁר עֹשִׂים שָׁם
  choice: அங்கே செய்யப்பட்ட அனைத்தையும்
  rationale: பன்மைச் செய்பொருளைத் திட்டவட்டமாக அடையாளப்படுத்தாத எபிரெய அமைப்பைத் தமிழில் இயல்பான செயப்பாட்டு வடிவில் தருகிறது.
- source_word: הוּא הָיָה עֹשֶׂה
  choice: அவனே செய்துவந்தான்
  rationale: הוּא தரும் வலியுறுத்தலை ‘அவனே’ என்பதும், היה + பங்கேற்புவினை தரும் தொடர்ச்சியான அல்லது வழக்கமான செயற்பாட்டை ‘செய்துவந்தான்’ என்பதும் காக்கின்றன.
