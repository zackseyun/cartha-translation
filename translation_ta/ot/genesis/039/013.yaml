  text: וַ/יְהִי֙ כִּ/רְאוֹתָ֔/הּ כִּֽי עָזַ֥ב בִּגְד֖/וֹ בְּ/יָדָ֑/הּ וַ/יָּ֖נָס הַ/חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/013.yaml
  text: And it happened[a], when she saw that he had left his garment in her hand and had fled outside,
translation:
  language: ta
  text: அவன் தன் ஆடையை[a] அவளுடைய கையில் விட்டுவிட்டு வெளியே தப்பி ஓடியதை அவள் கண்டபோது,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உடையை”; எபிரெயச் சொல் பொதுவானது; அது குறிப்பாக “மேலங்கியை” மட்டுமே குறிக்க வேண்டியதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: …கண்டபோது,
  rationale: וַיְהִי இங்கு அடுத்த நிகழ்வை அறிமுகப்படுத்தும் கதைத் தொடர்ச்சி வடிவமாகச் செயல்படுகிறது. தனியாக ‘அது நிகழ்ந்தது’ என்று மொழிபெயர்ப்பது தமிழில் செயற்கையாக இருக்கும்; தொடர்ந்து வரும் காலவினைத் துணைவாக்கியமும் இறுதிக் காற்புள்ளியும் அதன் உரையாடல் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: כִּרְאוֹתָהּ
  choice: அவள் கண்டபோது
  rationale: כְּ + ראה என்பதன் infinitive construct மற்றும் மூன்றாம் நபர் பெண்பால் ஒருமை பின்னொட்டு சேர்ந்து ‘அவள் கண்டபோது’ என்ற காலப் பொருளைத் தருகின்றன.
- source_word: כִּי
  choice: …ஓடியதை
  rationale: இங்கு כִּי அவள் கண்டதன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் ‘என்று’ என்பதைக் காட்டிலும் பெயராக்கப்பட்ட ‘-தை’ அமைப்பு இயல்பாக அந்த உள்ளடக்க உறவைத் தெரிவிக்கிறது.
- source_word: עָזַב
  choice: விட்டுவிட்டு
  rationale: சூழலில் ‘விட்டுச் செல்’ என்பதே நேரடிப் பொருள். தொடர்ந்து நிகழ்ந்த தப்பியோட்டத்துடன் செயல் வரிசையை இயல்பாக இணைக்க ‘விட்டுவிட்டு’ பயன்படுத்தப்பட்டது.
- source_word: בִּגְדוֹ
  choice: தன் ஆடை
  rationale: בגד என்பது குறிப்பிட்ட வகை மேலங்கியை அவசியமாகக் குறிக்காமல், பொதுவாக ஆடை அல்லது உடையைக் குறிக்கும். எழுவாயான ஆணையே சுட்டுவதால் தமிழின் இயல்பான தற்சுட்டுப் பெயரடையான ‘தன்’ பயன்படுத்தப்பட்டது.
- source_word: בְּיָדָהּ
  choice: அவளுடைய கையில்
  rationale: எபிரெய உரையின் தெளிவான, காட்சியளிக்கும் சொல்லாட்சியை நேரடியாகப் பாதுகாக்கிறது; ‘தன் கையில்’ என்று சொன்னால் தமிழில் அது யோசேப்பின் கையைக் குறிக்கும் குழப்பம் ஏற்படலாம்.
- source_word: וַיָּנָס
  choice: தப்பி ஓடியதை
  rationale: נוס என்பது ஆபத்திலிருந்து அல்லது பிடியிலிருந்து விரைந்து தப்பிச் செல்வதைக் குறிக்கிறது. ‘ஓடினான்’ என்பதைவிட ‘தப்பி ஓடினான்’ அதன் வலிமையைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: הַחוּצָה
  choice: வெளியே
  rationale: திசையைக் குறிக்கும் הָ- முடிவுடன் இச்சொல் வெளியை நோக்கிய நகர்வைக் குறிக்கிறது; ‘வெளியே’ என்பது அதற்கான இயல்பான நவீனத் தமிழ் வடிவம்.
