base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/004.yaml
  text: And Joseph found favor in his eyes and served him[c][b][a], and he appointed him over his house and put all that he had into his hand.
translation:
  language: ta
  text: யோசேப்பு தன் எஜமானின் பார்வையில் தயவு பெற்றான்; அவனுக்குச் சேவை செய்தான். அவனுடைய எஜமான் அவனைத் தன் வீட்டின் மேற்பார்வையாளனாக நியமித்து, தனக்கிருந்த அனைத்தையும் யோசேப்பின் கையில் ஒப்படைத்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யோசேப்பின் கையில்” என்பது யோசேப்பின் அதிகாரத்திற்கும் பொறுப்பிற்கும் ஒப்படைத்ததைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְצָא ... חֵן בְּעֵינָיו
  choice: அவன் பார்வையில் தயவு பெற்றான்
  rationale: ‘ஒருவரின் கண்களில் தயவைக் கண்டடைதல்’ என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; ‘தயவு’ இக்கதைச் சூழலில் தெய்வவியல் சார்ந்த கூடுதல் பொருளைத் திணிக்காமல் ஏற்றுக்கொள்ளுதலைக் குறிக்கிறது.
- source_word: וַיְשָׁרֶת אֹתוֹ
  choice: அவனுக்குப் பணிவிடை செய்தான்
  rationale: שרת இங்கு போத்திபாருக்குச் செய்த தனிப்பட்ட சேவையைச் சுட்டுகிறது; ‘பணிவிடை செய்தான்’ என்பது மரியாதையான, தெளிவான தமிழ்.
- source_word: וַיַּפְקִדֵהוּ עַל־בֵּיתוֹ
  choice: அவன் யோசேப்பைத் தன் வீட்டுக்குப் பொறுப்பாளராக நியமித்து
  rationale: פקד என்பதன் நிர்வாகப் பொறுப்பு அளிக்கும் பொருளையும், בַּיִת என்பதன் வீடு/வீட்டு நிர்வாகம் என்ற பரப்பையும் இயல்பாக வெளிப்படுத்துகிறது. யோசேப்பின் பெயரை மீண்டும் கூறுவது தமிழ் சுட்டுப்பெயர் குழப்பத்தைக் குறைக்கிறது; செய்பவரை பெயரிட்டு மூலத்தைவிட அதிகமாகத் தீர்மானிக்கவில்லை.
- source_word: וְכָל־יֶשׁ־לוֹ
  choice: தனக்கிருந்த அனைத்தையும்
  rationale: போத்திபாருக்குச் சொந்தமான உடைமைகள் மற்றும் நிர்வாகத்தின் கீழிருந்த அனைத்தையும் உள்ளடக்கும் விரிவான சொற்றொடர்.
- source_word: נָתַן בְּיָדוֹ
  choice: அவன் கையில் ஒப்படைத்தான்
  rationale: ‘கையில் கொடுத்தல்’ என்ற மூல உருவகத்தைப் பேணியபடியே, அதிகாரத்திலும் பராமரிப்பிலும் ஒப்படைத்தல் என்ற பொருளை ‘ஒப்படைத்தான்’ தெளிவாக்குகிறது.
