revisions:
- from: யோசேப்பு அவன் பார்வையில் தயவு பெற்றான்; அவனுக்குப் பணிவிடை செய்தான். அவன் யோசேப்பைத் தன் வீட்டுக்குப் பொறுப்பாளராக நியமித்து, தனக்கிருந்த அனைத்தையும் அவன் கையில் ஒப்படைத்தான்.[a]
  to: யோசேப்பு தன் எஜமானின் பார்வையில் தயவு பெற்றான்; அவனுக்குச் சேவை செய்தான். அவனுடைய எஜமான் அவனைத் தன் வீட்டின் மேற்பார்வையாளனாக நியமித்து, தனக்கிருந்த அனைத்தையும் யோசேப்பின் கையில் ஒப்படைத்தான்.[a]
  rationale: The revision retains the Hebrew idiom of entrusting matters ‘into [Joseph’s] hand’ and every element of the source, while resolving pronoun ambiguity in idiomatic modern Tamil. It also uses a neutral narrative verb for Joseph’s service and expresses his administrative role over the household clearly.
