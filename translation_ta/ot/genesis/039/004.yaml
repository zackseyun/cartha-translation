translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் தொடர்ச்சியான ஆண்பால் சுட்டுப்பெயர்கள் முழுமையாக விரிவாக்கப்படவில்லை; ஆனால் யார் நியமிக்கப்பட்டார் என்பதைத் தெளிவுபடுத்த ‘யோசேப்பை’ மீண்டும் கூறப்பட்டுள்ளது. ‘வீடு’ என்பது கட்டிடத்தை மட்டும் அல்லாமல் வீட்டு நிர்வாகம் அல்லது குடும்ப அமைப்பையும் குறிக்கக்கூடும்.
