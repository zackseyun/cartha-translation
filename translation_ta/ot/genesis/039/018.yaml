translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified narrative register பயன்படுத்தப்பட்டது. குற்றச்சாட்டைச் சொல்லும் பெண்ணின் நேரடி உரையாக இருப்பதால் முதல் நபர் வடிவங்கள் காக்கப்பட்டன; எபிரேயத்தில் குறிப்பிடப்படாத ஆடை வகை சேர்க்கப்படவில்லை. அடிக்குறிப்பு குறியீடு தொடர்புடைய வாக்கியத்தின் முடிவில் இடப்பட்டுள்ளது.
