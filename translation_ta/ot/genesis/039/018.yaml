source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/הֲרִימִ֥/י קוֹלִ֖/י וָ/אֶקְרָ֑א וַ/יַּעֲזֹ֥ב בִּגְד֛/וֹ אֶצְלִ֖/י וַ/יָּ֥נָס הַ/חֽוּצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/018.yaml
  text: And when I raised my voice and cried out[a], he left his garment beside me and fled outside.
translation:
  language: ta
  text: நான் என் குரலை உயர்த்திக் கூப்பிட்டபோது, அவன் தன் ஆடையை[a] என் அருகில் விட்டுவிட்டு வெளியே ஓடிப்போனான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனுடைய மேலாடையை’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல்லான בֶּגֶד பொதுவாக ஓர் ஆடையைக் குறிக்கிறது; அது எந்த வகை ஆடை என்பதைத் துல்லியமாகக் குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּהֲרִימִי
  choice: நான் ... உயர்த்திக் ... போது
  rationale: וַיְהִי இங்கு தொடர்ந்து வரும் நிகழ்வை அறிமுகப்படுத்துகிறது; כ prefixed infinitive construct காலப்பொருளைத் தருகிறது. இயல்பான தமிழில் ‘போது’ அமைப்பு இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: קוֹלִי
  choice: என் குரலை
  rationale: קוֹל என்பது இச்சூழலில் ‘குரல்’; ‘குரலை உயர்த்துதல்’ என்பது எபிரேயச் சொல்லாட்சியையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: וָאֶקְרָא
  choice: கூப்பிட்ட
  rationale: קרא அழைத்தல் அல்லது உரக்கக் கூப்பிடுதல் என்று பொருள்படலாம். அபாயம் அறிவிக்கும் இச்சூழலில் ‘கூப்பிட்டேன்’ அவசரத்தை உணர்த்துகிறது; துல்லியமான ஒலியளவை மிகைப்படுத்தவில்லை.
- source_word: וַיַּעֲזֹב
  choice: விட்டுவிட்டு
  rationale: עזב இங்கு ஆடையை அங்கேயே விட்டுச் சென்றதைக் குறிக்கிறது. தொடர்ச்சியான செயல்களை இயல்பான தமிழில் இணைக்க ‘விட்டுவிட்டு’ பயன்படுத்தப்பட்டது.
- source_word: בִּגְדוֹ
  choice: தன் ஆடையை
  rationale: בֶּגֶד என்பது குறிப்பிட்ட ஆடை வகையைச் சுட்டாத பொதுச் சொல். ‘ஆடை’ மூலத்தின் பொதுத்தன்மையைப் பாதுகாக்கிறது.
- source_word: אֶצְלִי
  choice: என் அருகில்
  rationale: אצל அண்மை அல்லது பக்கத்திலிருப்பதைக் குறிக்கிறது. ‘என் அருகில்’ இடத்தொடர்பைத் தெளிவாகக் கூறுகிறது; உடைமைப் பொருளைத் தேவையின்றி புகுத்தாது.
- source_word: וַיָּנָס הַחוּצָה
  choice: வெளியே ஓடிப்போனான்
  rationale: נוס தப்பியோடுதல் அல்லது விரைந்து ஓடிப்போதலைக் குறிக்கிறது; הַחוּצָה வெளிநோக்கிய இயக்கத்தைக் காட்டுகிறது. ‘வெளியே ஓடிப்போனான்’ இரண்டையும் இயல்பான நவீன தமிழில் தருகிறது.
