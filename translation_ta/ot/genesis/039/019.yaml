source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲדֹנָ֜י/ו אֶת דִּבְרֵ֣י אִשְׁתּ֗/וֹ אֲשֶׁ֨ר דִּבְּרָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר כַּ/דְּבָרִ֣ים הָ/אֵ֔לֶּה עָ֥שָׂהּ לִ֖/י עַבְדֶּ֑/ךָ וַ/יִּ֖חַר אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/019.yaml
  text: And it happened that when his master heard the words of his wife that she spoke to him[a], saying[b], “According to these words your servant did to me,” his anger burned.
translation:
  language: ta
  text: அவனுடைய எஜமான், “உம்முடைய அடிமை எனக்கு இப்படிப்பட்ட காரியங்களைச் செய்தான்” என்று தன் மனைவி தன்னிடம் சொன்ன வார்த்தைகளைக் கேட்டபோது, அவனுடைய கோபம் மூண்டது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: கேட்டபோது
  rationale: எபிரெயக் கதைத் தொடரில் וַיְהִי அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது; தமிழில் தனியே ‘அப்போது நடந்தது’ எனச் சேர்ப்பதைவிட, காலத்தைக் குறிக்கும் ‘கேட்டபோது’ என்ற இயல்பான கட்டமைப்பு தொடர்ச்சியையும் நேர உறவையும் தெளிவாகக் காட்டுகிறது.
- source_word: אֲדֹנָיו
  choice: அவனுடைய எஜமான்
  rationale: இங்கு யோசேப்பின் உரிமையாளரும் வீட்டுத் தலைவருமான போத்திபாரைக் குறிக்கிறது; ‘எஜமான்’ அடிமைச் சூழலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: דִּבְרֵי אִשְׁתּוֹ אֲשֶׁר דִּבְּרָה אֵלָיו
  choice: தன் மனைவி தன்னிடம் சொன்ன வார்த்தைகள்
  rationale: ‘வார்த்தைகள்’ என்பதைத் தக்கவைத்து, தொடர்புச் சொற்றொடரை நவீன தமிழில் இயல்பாக அமைக்கிறது. ‘தன்/தன்னிடம்’ என்பது ஒரே எஜமானையே சுட்டுவதைத் தெளிவாக்குகிறது.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: இப்படிப்பட்ட காரியங்களை
  rationale: כְּ இங்கு ஒப்புமை அல்லது வகை/முறை சார்ந்த பொருளைக் கொண்டிருக்கலாம்; ‘இப்படிப்பட்ட’ என்பது குற்றச்சாட்டின் தன்மையைச் சுட்டுகிறது, அதேவேளை தேவையற்ற துல்லியத்தைத் திணிக்காது.
- source_word: עַבְדְּךָ
  choice: உம்முடைய அடிமை
  rationale: עבד ‘வேலைக்காரன்/ஊழியன்’ என்றும் ‘அடிமை’ என்றும் பொருள்படலாம்; யோசேப்பு போத்திபாரால் வாங்கப்பட்டவர் என்பதால் இச்சூழலில் ‘அடிமை’ அவரது கட்டுப்பட்ட நிலையைக் குறிப்பாக வெளிப்படுத்துகிறது.
- source_word: עָשָׂה לִי
  choice: எனக்கு ... செய்தான்
  rationale: לִי என்பதன் எளிய ‘எனக்கு’ என்ற பொருளைத் தக்கவைத்து, எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘எனக்கு எதிராக’ என்பதைச் சேர்க்கவில்லை.
- source_word: וַיִּחַר אַפּוֹ
  choice: அவனுடைய கோபம் பற்றியெரிந்தது
  rationale: எபிரெய மரபுத்தொடரின் எரிதல் உருவகத்தைத் தக்கவைக்கும் அதே நேரத்தில், நவீன தமிழில் வலிமையாகவும் புரியத்தக்கதாகவும் உள்ளது.
theological_decisions:
- issue: யார்மீது கோபம் பற்றியெரிந்தது என்பது வெளிப்படையாகச் சொல்லப்படவில்லை
  choice: ‘அவனுடைய கோபம் பற்றியெரிந்தது’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது
  alternative: ‘யோசேப்பின்மீது அவனுடைய கோபம் பற்றியெரிந்தது’
  rationale: எபிரெய மூலவாக்கியம் கோபத்தின் இலக்கை வெளிப்படையாகக் குறிப்பிடவில்லை. சூழலில் யோசேப்பு இயல்பான இலக்காகத் தோன்றினாலும், மொழிபெயர்ப்பு அந்த ஊகத்தை உரைக்குள் சேர்க்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான வேதாகம நடையுடன் சாதாரண வாசகர்களுக்குப் புரியும் வாக்கிய அமைப்பு. ‘எஜமான்’ மற்றும் ‘அடிமை’ என்பவை வீட்டடிமைச் சூழலை மறைக்காமல் காட்டுகின்றன. நேரடி உரையில் மரியாதைப் பன்மையான ‘உம்முடைய’ பயன்படுத்தப்பட்டுள்ளது.
