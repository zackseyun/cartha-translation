  text: וַ/תִּקְרָ֞א לְ/אַנְשֵׁ֣י בֵיתָ֗/הּ וַ/תֹּ֤אמֶר לָ/הֶם֙ לֵ/אמֹ֔ר רְא֗וּ הֵ֥בִיא לָ֛/נוּ אִ֥ישׁ עִבְרִ֖י לְ/צַ֣חֶק בָּ֑/נוּ בָּ֤א אֵלַ/י֙ לִ/שְׁכַּ֣ב עִמִּ֔/י וָ/אֶקְרָ֖א בְּ/ק֥וֹל גָּדֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/014.yaml
  text: Then she called the men of her household and said to them[a], “Look, he has brought a Hebrew man to us to mock us. He came in to me to lie with me[b], and I cried out with a loud voice.”
translation:
  language: ta
  text: அப்போது அவள் தன் வீட்டைச் சேர்ந்த ஆண்களைக் கூப்பிட்டு அவர்களிடம், “பாருங்கள்! நம்மைக் கேலி செய்வதற்காக[a] அவர் ஓர் எபிரெய மனிதனை நம்மிடம் கொண்டுவந்திருக்கிறார். அவன் என்னோடு படுப்பதற்காக[b] என்னிடம் வந்தான்; நான் உரத்த குரலில் கத்தினேன்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “நம்மைப் பார்த்துச் சிரிப்பதற்காக,” “நம்மைத் தன் விளையாட்டுப் பொருளாக்குவதற்காக.” எபிரெய வினை கேலி செய்வதையோ இழிவான முறையில் விளையாட்டாக்குவதையோ குறிக்கலாம்; இச்சூழலில் அந்தக் குற்றச்சாட்டு பாலியல் அவமானத்தின் பொருளையும் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “என்னோடு படுப்பது” என்பது இங்கு பாலுறவைக் குறிக்கும் மரபுத்தொடர்.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַתִּקְרָא
  choice: அப்போது அவள் ... கூப்பிட்டு
  rationale: வழக்குரையின் தொடர்ச்சியை அப்போது இயல்பாகக் காட்டுகிறது; கூப்பிட்டு என்பது அவள் வீட்டிலிருந்த ஆண்களை அழைத்ததைக் குறிக்கிறது.
- source_word: לְאַנְשֵׁי בֵיתָהּ
  choice: தன் வீட்டைச் சேர்ந்த ஆண்களை
  rationale: אַנְשֵׁי என்பதன் ஆண்பால் பன்மையையும், בֵיתָהּ என்பதன் குடும்பம் அல்லது வீட்டாரைச் சார்ந்த சமூகப் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: רְאוּ
  choice: பாருங்கள்!
  rationale: கவனத்தை ஈர்க்கும் பன்மை ஏவலை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: הֵבִיא לָנוּ
  choice: நம்மிடம் கொண்டுவந்திருக்கிறார்
  rationale: בוא என்பதன் காரணவினை வடிவான ‘கொண்டுவருதல்’ என்பதையும், לָנוּ என்பதன் ‘நம்மிடம்’ என்ற பொருளையும் காக்கிறது; நிறைவுற்ற செயல் தற்போதைய குற்றச்சாட்டுக்கு உரியதாக இருப்பதை வினைவடிவு உணர்த்துகிறது.
- source_word: אִישׁ עִבְרִי
  choice: ஓர் எபிரெய மனிதனை
  rationale: யோசேப்பை ஓர் ஆணாகவும் எபிரெய இனத்தைச் சேர்ந்தவராகவும் அடையாளப்படுத்தும் குற்றஞ்சாட்டும் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: לְצַחֶק בָּנוּ
  choice: நம்மைக் கேலி செய்வதற்காக
  rationale: צחק இங்கு கேலி செய்தல் அல்லது ஒருவரை விளையாட்டுப் பொருளாக்குதல் என்ற பரந்த இழிவுபடுத்தும் பொருளைக் கொண்டிருக்கலாம்; சூழலில் பாலியல் அவமானத்தின் நிழலும் உள்ளது. முதன்மை உரை அந்தப் பொருளை அளவுக்கு மீறிக் குறுக்காமல் வைக்கிறது.
- source_word: בָּא אֵלַי
  choice: என்னிடம் வந்தான்
  rationale: בוא + אֶל என்பதன் நேரடியான இயக்கப் பொருளைச் சீரான தமிழில் தருகிறது; மூலத்தில் இல்லாத வலுக்கட்டாய நுழைவைச் சேர்க்கவில்லை.
- source_word: לִשְׁכַּב עִמִּי
  choice: என்னோடு படுப்பதற்காக
  rationale: பாலுறவைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கு நெருக்கமான, தமிழிலும் புரியக்கூடிய சொல்லாட்சியைப் பயன்படுத்துகிறது.
- source_word: וָאֶקְרָא בְּקוֹל גָּדוֹל
  choice: நான் உரத்த குரலில் கத்தினேன்
  rationale: கத்தினேன் என்பது அவசரச் சூழலிலான கூக்குரலை இயல்பாகக் காட்டுகிறது; உரத்த குரலில் என்பது எபிரெயச் சொற்றொடரின் வலிமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: צחק என்ற வினையின் பொருள் பரப்பு
  choice: முதன்மை உரையில் ‘கேலி செய்வதற்காக’ என்று வைத்து, மாற்றுப் பொருட்களை அடிக்குறிப்பில் தருதல்
  alternative: ‘பாலியல் வன்முறை செய்ய’ அல்லது ‘அவமானப்படுத்த’ என்று குறிப்பாக்குதல்
  rationale: மூல வினை கேலி, ஏளனம், விளையாட்டாக்குதல் போன்ற பொருட்களை ஏற்கிறது; இந்தச் சூழல் பாலியல் அவமானத்தை உணர்த்தினாலும், மூலத்தில் உள்ள பன்முகத்தன்மையை ஒரே குறிப்பான குற்றமாக மாற்றக் கூடாது.
- issue: לִשְׁכַּב עִמִּי என்ற பாலியல் மரபுத்தொடர்
  choice: ‘என்னோடு படுப்பதற்காக’ என்று மரபுத்தொடரின் உருவகத்தைப் பேணுதல்
  alternative: ‘என்னோடு உடலுறவு கொள்வதற்காக’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: மூலத்தின் மறைமுகமான ஆனால் தெளிவான பாலியல் சொல்லாட்சியைப் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் பொருளை உறுதிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. பெண்ணின் குற்றஞ்சாட்டும் குரல் நேரடியாக வைக்கப்பட்டுள்ளது; மூலத்தில் தெளிவாக இல்லாத வன்முறை அல்லது நோக்கம் சேர்க்கப்படவில்லை.
