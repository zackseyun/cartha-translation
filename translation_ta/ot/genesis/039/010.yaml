  text: וַ/יְהִ֕י כְּ/דַבְּרָ֥/הּ אֶל יוֹסֵ֖ף י֣וֹם י֑וֹם וְ/לֹא שָׁמַ֥ע אֵלֶ֛י/הָ לִ/שְׁכַּ֥ב אֶצְלָ֖/הּ לִ/הְי֥וֹת עִמָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/010.yaml
  text: And it happened[a], as she spoke to Yosef day after day, that he did not listen to her, to lie beside her or to be with her.
translation:
  language: ta
  text: அவள் யோசேப்பிடம் நாள்தோறும் பேசிவந்தபோது, அவள் அருகில் படுத்துக்கொள்ளவோ,[a] அவளுடன் இருக்கவோ அவன் அவளுக்குச் செவிகொடுக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவளோடு படுத்துக்கொள்ள’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் பாலுறவைக் குறிக்கக்கூடும்; ‘அவள் அருகில் படுத்துக்கொள்ள’ என்பது அதன் இடஞ்சார்ந்த சொல்லமைப்பைக் காப்பதுடன், அடுத்து வரும் ‘அவளுடன் இருக்க’ என்பதற்கும் தனி வலிமையைத் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבְּרָהּ
  choice: அவள் ... பேசிவந்தபோதிலும்
  rationale: וַיְהִי இங்கு கதையின் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது; தமிழ் நடையில் அதைத் தனியே ‘நடந்தது’ என்று மொழிபெயர்ப்பதைவிட, தொடர்ந்து வந்த சூழலைக் குறிக்கும் இணைப்பாக இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது. כְּדַבְּרָהּ என்பதன் காலத் தொடர்பையும், அடுத்துள்ள ‘நாள்தோறும்’ தரும் தொடர்ச்சியையும் ‘பேசிவந்தபோதிலும்’ எடுத்துரைக்கிறது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: எபிரெயப் பெயரின் தமிழில் நிலைபெற்ற, எளிதில் அறியப்படும் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: יוֹם יוֹם
  choice: நாள்தோறும்
  rationale: பெயர்ச்சொல்லின் இரட்டிப்பு தொடர்ச்சியான தினசரி நிகழ்வைக் குறிக்கிறது; ‘நாள்தோறும்’ நவீனத் தமிழில் இயல்பாக அதைக் காட்டுகிறது.
- source_word: וְלֹא שָׁמַע אֵלֶיהָ
  choice: அவன் அவளுக்குச் செவிகொடுக்கவில்லை
  rationale: שׁמע אֶל என்பது ஒருவரின் பேச்சைக் கேட்டு அதற்கு இணங்குதல் அல்லது கவனம் செலுத்துதல் என்ற பரந்த பொருளைக் கொண்டது. ‘செவிகொடுக்கவில்லை’ என்பது வெறும் ஒலி கேட்காததைக் காட்டாமல் அவளது வேண்டுகோளை ஏற்காததைக் காட்டுகிறது.
- source_word: לִשְׁכַּב אֶצְלָהּ
  choice: அவள் அருகில் படுத்துக்கொள்ள
  rationale: שׁכב பாலுறவைக் குறிக்கக்கூடும்; ஆனால் אֵצֶל என்பதன் இடஞ்சார்ந்த ‘அருகில்’ என்ற பொருளை முதன்மை உரை காக்கிறது. சூழலில் உள்ள பாலியல் உட்குறிப்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: לִהְיוֹת עִמָּהּ
  choice: அவளுடன் இருக்க
  rationale: היה עם என்பதன் பரந்த ‘ஒருவருடன் இருத்தல்’ என்ற பொருள் காக்கப்படுகிறது. இதனால் பாலுறவை மட்டும் அல்லாமல் அவளுடன் நெருக்கமாகத் தங்குவதையும் யோசேப்பு தவிர்த்தான் என்ற சாத்தியமான தனிப்பொருள் நிலைத்திருக்கிறது.
theological_decisions:
- issue: யோசேப்பின் மறுப்பின் பரப்பு
  choice: ‘அவள் அருகில் படுத்துக்கொள்ளவோ அவளுடன் இருக்கவோ’ என்ற இரண்டு தனித்த சொற்றொடர்களும் காக்கப்பட்டன.
  alternative: இரண்டையும் பாலுறவை மட்டும் குறிக்கும் ஒரே கருத்தாகச் சுருக்குதல்.
  rationale: எபிரெய உரை பாலியல் உட்குறிப்பைத் தரும் முதல் சொற்றொடரையும், பரந்த உடனிருப்பைக் குறிக்கும் இரண்டாவது சொற்றொடரையும் அடுத்தடுத்து வைக்கிறது. அவற்றுக்கிடையிலான சாத்தியமான வேறுபாட்டைத் தீர்மானித்து விடாமல் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கொண்டுள்ளது. ‘பேசிவந்தபோதிலும்’ தொடர்ச்சியான வற்புறுத்தலையும் யோசேப்பின் நிலையான மறுப்பையும் இயல்பாக இணைக்கிறது; பாலியல் பொருள் வெளிப்படையாக மிகைப்படுத்தப்படாமல், மூலத்தின் தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
