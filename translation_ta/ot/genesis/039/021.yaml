id: GEN.39.21
reference: Genesis 39:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יֵּ֥ט אֵלָ֖י/ו חָ֑סֶד וַ/יִּתֵּ֣ן חִנּ֔/וֹ בְּ/עֵינֵ֖י שַׂ֥ר בֵּית הַ/סֹּֽהַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/021.yaml
  text: But Yahweh was with Joseph and extended covenant faithfulness to him[b][a], and he gave him favor in the eyes of the chief of the prison.
translation:
  language: ta
  text: ஆனால் யாவே யோசேப்புடன் இருந்தார்; அவர் அவனுக்கு மாறாத அன்பைக் காட்டி, சிறைச்சாலைத் தலைவரின் பார்வையில் யோசேப்புக்குத் தயவு கிடைக்கச் செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலின் தேவனுடைய தனிப்பட்ட பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: וַיְהִי ... אֶת
  choice: யோசேப்புடன் இருந்து
  rationale: இந்த எபிரெயச் சொற்றொடர் உடனிருப்பைத் தெரிவிக்கிறது; யோசேப்பு வரலாற்றில் திரும்பத் திரும்ப வரும் கருத்தையும் தெளிவாகக் காக்கிறது.
- source_word: וַיֵּט אֵלָיו חָסֶד
  choice: அவனுக்கு மாறாத அன்பைக் காட்டினார்
  rationale: נָטָה உடன் வரும் இந்த மரபுத்தொடர் அன்பையோ தயவையோ ஒருவரிடம் செலுத்துவதைக் குறிக்கிறது. ‘காட்டினார்’ இயல்பான தமிழாகவும், ‘மாறாத அன்பு’ חֶסֶד என்பதன் நிலையான, பற்றுறுதியுள்ள தன்மையைக் காக்கும் வகையிலும் உள்ளது.
- source_word: חִנּוֹ בְּעֵינֵי
  choice: பார்வையில் யோசேப்புக்குத் தயவு கிடைக்கச் செய்தார்
  rationale: ஒருவரின் பார்வையில் ஏற்றுக்கொள்ளப்படுதல் அல்லது தயவு பெறுதல் என்ற எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: சிறைச்சாலைத் தலைவர்
  rationale: சிறைச்சாலைக்குப் பொறுப்பான தலைமை அதிகாரியைக் குறிக்கும் சொற்றொடரை இயல்பாகவும் அதன் நிர்வாகப் பொருளை மிகைப்படுத்தாமலும் வழங்குகிறது.
- source_word: וַ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் யோசேப்பு சிறையில் வைக்கப்பட்டதற்கும் இங்கு யாவே அவனுடன் இருந்ததற்கும் இடையிலான சூழல் சார்ந்த முரண்பாட்டைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: חָסֶד என்பதிலுள்ள இறை அன்பும் பற்றுறுதியும்
  choice: மாறாத அன்பு
  alternative: உடன்படிக்கைப் பற்றுறுதி; பற்றுமாறாத அன்பு; இரக்கம்
  rationale: உடனடிச் சூழலில் ஓர் உடன்படிக்கை வெளிப்படையாகக் குறிப்பிடப்படாததால், ‘உடன்படிக்கைப் பற்றுறுதி’ என்பதை முதன்மை உரையில் சேர்ப்பது விளக்கத்தை மிகைப்படுத்தலாம். ‘மாறாத அன்பு’ நிலையான இறைநன்மையையும் பற்றுறுதியையும் இயல்பான தமிழில் காக்கிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: יהוה என்ற இறைப்பெயர்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, உரையின் தனித்துவத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘சிறைச்சாலைத் தலைவர்’ என்பது பதவியைச் சொற்சொல்லாகக் கடினப்படுத்தாமல் இயல்பாகக் குறிக்கிறது; இரண்டாவது கூறில் குழப்பம் தவிர்க்க ‘யோசேப்புக்கு’ என்ற பெயர் மீண்டும் பயன்படுத்தப்பட்டது.
