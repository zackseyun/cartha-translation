  text: אֵ֣ין שַׂ֣ר בֵּית הַ/סֹּ֗הַר רֹאֶ֤ה אֶֽת כָּל מְא֨וּמָה֙ בְּ/יָד֔/וֹ בַּ/אֲשֶׁ֥ר יְהוָ֖ה אִתּ֑/וֹ וַֽ/אֲשֶׁר ה֥וּא עֹשֶׂ֖ה יְהוָ֥ה מַצְלִֽיחַ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/023.yaml
  text: The chief of the prison paid attention to nothing that was in his hand[a], because Yahweh was with him; and whatever he did[c][b], Yahweh made prosper.
translation:
  language: ta
  text: சிறைச்சாலையின் தலைமை அதிகாரி, யோசேப்பின் பொறுப்பிலிருந்த எந்தக் காரியத்தையும் கவனிக்கவில்லை[a]; ஏனெனில் யாவே அவனோடு இருந்தார். யோசேப்பு செய்ததையெல்லாம் யாவே வெற்றியடையச் செய்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லெழுத்தாக, ‘அவன் கையிலிருந்த எந்தக் காரியத்தையும் பார்க்கவில்லை.’ ‘கையில்’ என்பது யோசேப்பிடம் ஒப்படைக்கப்பட்ட பொறுப்பைக் குறிக்கும் மரபுத்தொடர். ‘எதைக் குறித்தும் கவலைப்படவில்லை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘யாவே யோசேப்பு செய்ததையெல்லாம் செழிக்கச் செய்தார்’ அல்லது ‘வெற்றிபெறச் செய்தார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: சிறைச்சாலையின் தலைமை அதிகாரி
  rationale: שַׂר என்பது சாதாரண காவலரை அல்ல, பொறுப்பும் அதிகாரமும் கொண்ட தலைமை அலுவலரைக் குறிக்கிறது. இந்தத் தமிழாக்கம் அதன் நிர்வாகப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵין ... רֹאֶה אֶת כָּל מְאוּמָה
  choice: எதையும் கண்காணிக்கவில்லை
  rationale: சொல்லெழுத்தாக ‘எதையும் பார்க்கவில்லை’ என்றாலும், இச்சூழலில் யோசேப்பிடம் ஒப்படைக்கப்பட்ட காரியங்களை அதிகாரி ஆய்வு செய்யவோ மேற்பார்வையிடவோ தேவையில்லாத நிலையைக் குறிக்கிறது. ‘கண்காணிக்கவில்லை’ அந்தச் செயல்பாட்டுப் பொருளைத் தருகிறது.
- source_word: בְּיָדוֹ
  choice: அவன் பொறுப்பிலிருந்த
  rationale: ‘அவன் கையில்’ என்பது அவனுடைய கட்டுப்பாட்டில் அல்லது பொறுப்பில் ஒப்படைக்கப்பட்டவற்றைக் குறிக்கும் எபிரேய மரபுத்தொடர். நவீனத் தமிழில் பொருள் தெளிவாக இருக்க ‘பொறுப்பிலிருந்த’ என வழங்கப்பட்டுள்ளது.
- source_word: בַּאֲשֶׁר יְהוָה אִתּוֹ
  choice: ஏனெனில் யாவே அவனோடு இருந்தார்
  rationale: בַּאֲשֶׁר இங்கு காரணத்தைக் காட்டுகிறது. ‘ஏனெனில்’ அந்தத் தொடர்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַאֲשֶׁר הוּא עֹשֶׂה
  choice: அவன் செய்ததையெல்லாம்
  rationale: இந்த உறவுத்தொடர் யோசேப்பு மேற்கொண்ட அனைத்துச் செயல்களையும் முழுமையாகக் குறிக்கிறது; தமிழில் இது இயல்பான தொகுப்பு வடிவம்.
- source_word: מַצְלִיחַ
  choice: வெற்றியடையச் செய்தார்
  rationale: 'צלח என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருள் கொண்டது: யாவே யோசேப்பின் செயல்கள் வெற்றி பெறும்படி செய்தார். தமிழின் காரணவினை அமைப்பு இதைத் தெளிவாகக் காக்கிறது.'
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: யோசேப்பின் வெற்றியில் யாவேயின் செயல்பாடு
  choice: யாவே வெற்றியடையச் செய்தார்
  alternative: அவன் செய்ததெல்லாம் வெற்றியடைந்தது
  rationale: மַצְלִיחַ என்ற காரணவினை வடிவம் வெற்றி யாவேயின் செயற்பாட்டால் ஏற்பட்டது என்பதைச் சொல்கிறது; ஆகவே காரணவினைத் தன்மை வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மதிப்புறு நடையுடனும் அமைக்கப்பட்டுள்ளது. ‘தலைமை அதிகாரி’, ‘கண்காணிக்கவில்லை’, ‘பொறுப்பிலிருந்த’ ஆகிய சொற்கள் நிர்வாகச் சூழலை இயல்பாகத் தருகின்றன. இறைவனைக் குறிக்கும் வினைமுற்றில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
