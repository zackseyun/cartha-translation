source:
  edition: WLC
  text: וְ/יוֹסֵ֖ף הוּרַ֣ד מִצְרָ֑יְמָ/ה וַ/יִּקְנֵ֡/הוּ פּוֹטִיפַר֩ סְרִ֨יס פַּרְעֹ֜ה שַׂ֤ר הַ/טַּבָּחִים֙ אִ֣ישׁ מִצְרִ֔י מִ/יַּד֙ הַ/יִּשְׁמְעֵאלִ֔ים אֲשֶׁ֥ר הוֹרִדֻ֖/הוּ שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/001.yaml
  text: Joseph had been brought down to Egypt[a], and Potiphar, an officer of Pharaoh, the captain of the guard, an Egyptian[b], bought him from the Ishmaelites who had brought him down there.
translation:
  language: ta
  text: யோசேப்பு எகிப்துக்குக் கொண்டுவரப்பட்டிருந்தான். பார்வோனின் அதிகாரியும்[a] காவற்படைத் தலைவனுமான எகிப்தியனாகிய போத்திபார், அவனை அங்கே கொண்டுவந்த இஸ்மவேலர்களிடமிருந்து அவனை விலைக்கு வாங்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதிகாரி’ என்பதற்கான எபிரெயச் சொல் ‘அண்ணகன்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּרַד
  choice: கொண்டுவரப்பட்டிருந்தான்
  rationale: ירד என்பதன் ஹொஃபால் வடிவம் பிறவினைப் பொருளுடைய செயல்பாட்டு வினை; யோசேப்பு பிறரால் எகிப்துக்குக் கொண்டுவரப்பட்டதையும், அது போத்திபார் அவனை வாங்குவதற்கு முன்பே நிகழ்ந்ததையும் இவ்வடிவம் இயல்பான தமிழில் தெரிவிக்கிறது. ‘கீழே’ அல்லது ‘இறக்கி’ என்று நேரடியாகச் சேர்ப்பது இங்கு தமிழில் தேவையற்ற இடவியல் பொருளை உருவாக்கும்.
- source_word: מִצְרָיְמָה
  choice: எகிப்துக்கு
  rationale: திசையைக் குறிக்கும் எபிரெயப் பின்னொட்டு எகிப்தை நோக்கிய நகர்வைக் காட்டுகிறது; ‘எகிப்துக்கு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: וַיִּקְנֵהוּ
  choice: அவனை விலைக்கு வாங்கினான்
  rationale: அடிமை விற்பனைச் சூழலில் קנה என்பது பணம் கொடுத்து வாங்குதலைக் குறிக்கிறது. ‘விலைக்கு’ என்பது பரிமாற்றத் தன்மையைத் தெளிவாக்குகிறது; புதிய கருத்தைச் சேர்ப்பதில்லை.
- source_word: סְרִיס פַּרְעֹה
  choice: பார்வோனின் அதிகாரி
  rationale: סְרִיס என்பது அரசவையின் அதிகாரியையோ உடல் அமைப்பில் அண்ணகனையோ குறிக்கலாம். சூழலில் நிர்வாகப் பதவிப் பொருள் முதன்மை உரைக்கு இயல்பானது; மற்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שַׂר הַטַּבָּחִים
  choice: காவற்படைத் தலைவர்
  rationale: இந்தப் பதவி அரச காவலர்கள் அல்லது தண்டனை நிறைவேற்றுவோரின் தலைவரைக் குறித்திருக்கலாம். ‘காவற்படைத் தலைவர்’ அலுவல் நிலையைத் தெளிவாகச் சொல்லி, விவாதத்திற்குரிய உட்பொருளை அளவுக்கு மீறி வரையறுக்காது.
- source_word: אִישׁ מִצְרִי
  choice: எகிப்தியனாகிய
  rationale: אִישׁ உடன் வரும் இனப்பெயரை தமிழில் ‘எகிப்தியனாகிய’ என்று இயல்பாகச் சொல்லலாம்; ‘எகிப்திய மனிதன்’ என்பது இவ்விடத்தில் செயற்கையாக ஒலிக்கும்.
- source_word: מִיַּד הַיִּשְׁמְעֵאלִים
  choice: இஸ்மவேலர்களிடமிருந்து
  rationale: ‘கையிலிருந்து’ என்ற சொல்லடியான எபிரெய மரபுத்தொடர் இங்கு விற்பவர்களிடமிருந்து வாங்கியதைக் குறிக்கிறது; ‘இடமிருந்து’ அதனை இயல்பான தமிழில் தருகிறது.
- source_word: אֲשֶׁר הוֹרִדֻהוּ שָׁמָּה
  choice: யோசேப்பை அங்கே கொண்டுவந்த
  rationale: உறவுப்பெயர் தொடர் இஸ்மவேலர்களையே சுட்டுகிறது. தெளிவுக்காக ‘அவனை’ என்பதற்குப் பதிலாக ‘யோசேப்பை’ பயன்படுத்தப்பட்டுள்ளது; שָׁמָּה என்பதற்கு ‘அங்கே’ பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: போத்திபாரைப் பற்றிய סְרִיס என்ற சொல்லின் பொருள்
  choice: முதன்மை உரையில் ‘பார்வோனின் அதிகாரி’
  alternative: ‘பார்வோனின் அண்ணகன்’
  rationale: எபிரெயச் சொல் அரச அதிகாரியையும் அண்ணகனையும் குறிக்கக்கூடும். போத்திபார் திருமணமானவர் என்று பின்னர் சொல்லப்படுவது மட்டும் அதன் உடல்சார் பொருளை முற்றிலும் விலக்கப் போதாது; ஆகவே பரந்த பதவிப் பொருள் முதன்மை உரையில் தரப்பட்டு, உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. பெயர்கள் பொதுவான தமிழ் வேதாகம வழக்கில் ‘யோசேப்பு,’ ‘பார்வோன்,’ ‘போத்திபார்,’ ‘இஸ்மவேலர்கள்’ என எழுதப்பட்டுள்ளன.
