translation_notes:
  register: நவீன, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பாலுறவு அழைப்பின் நேரடித்தன்மை மறைக்கப்படவில்லை; அதேவேளை மூலத்தில் இல்லாத வெளிப்படையான சொற்களும் சேர்க்கப்படவில்லை.
