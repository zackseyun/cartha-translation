source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/תִּשָּׂ֧א אֵֽשֶׁת אֲדֹנָ֛י/ו אֶת עֵינֶ֖י/הָ אֶל יוֹסֵ֑ף וַ/תֹּ֖אמֶר שִׁכְבָ֥/ה עִמִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/007.yaml
  text: And after these things[a], his master's wife cast her eyes on Yosef and said, “Lie with me.”
translation:
  language: ta
  text: இவற்றுக்குப் பிறகு, அவனுடைய எஜமானின் மனைவி யோசேப்பின்மேல் கண் வைத்தாள்[a]. அவள் அவனிடம், “என்னோடு படு” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘யோசேப்பை நோக்கித் தன் கண்களை உயர்த்தினாள்.’ இங்கே இந்த மரபுத்தொடர் அவன்மேல் குறிவைத்த, ஆசை நிறைந்த கவனத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: இவற்றுக்குப் பிறகு
  rationale: எபிரெயக் கதைநடையில் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் சொற்றொடர். மூலத்தின் வடிவத்தை நெருக்கமாகக் காத்தபடியே இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ אֶל
  choice: கண் வைத்தாள்
  rationale: சொல்லுக்குச் சொல் ‘தன் கண்களை உயர்த்தினாள்’ என்றாலும், இச்சூழலில் இது வெறும் பார்வையைக் காட்டாமல் குறிவைத்த, ஆசை நிறைந்த கவனத்தைக் குறிக்கிறது. ‘கண் வைத்தாள்’ என்பது அந்த இடைமொழிப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵשֶׁת אֲדֹנָיו
  choice: அவனுடைய எஜமானின் மனைவி
  rationale: பெண்ணை யோசேப்பின் எஜமானோடு உள்ள உறவின் அடிப்படையில் அடையாளப்படுத்தும் மூலமொழிக் கட்டமைப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: எபிரெயப் பெயரான யோசேஃப் என்பதற்கான தமிழில் நிலைபெற்ற, எளிதில் வேற்றுமை உருபேற்கும் வடிவம்.
- source_word: שִׁכְבָה עִמִּי
  choice: என்னோடு படு
  rationale: இது நேரடியான பாலுறவு அழைப்பு. ‘படு’ என்பது மூல வினையின் நேரடித்தன்மையைப் பாதுகாக்கிறது; தேவையற்ற நாசூக்காக்கலையோ விளக்கச் சேர்க்கையையோ தவிர்க்கிறது.
