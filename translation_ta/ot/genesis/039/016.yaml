lexical_decisions:
- source_word: וַתַּנַּח
  choice: வைத்திருந்தாள்
  rationale: இச்சூழலில் ஆடையைத் தன்னிடம் தொடர்ந்து வைத்திருந்த செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בִּגְדוֹ
  choice: அவனுடைய ஆடையை
  rationale: בֶּגֶד என்பதன் பொதுவான பொருள் ‘ஆடை’; எந்தக் குறிப்பிட்ட ஆடை வகை என்பதைக் மூலவசனம் வரையறுக்கவில்லை.
- source_word: אֶצְלָהּ
  choice: தன்னருகே
  rationale: ‘அவளருகில்/அவளிடம்’ என்ற இடத்தொடர்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: עַד בּוֹא אֲדֹנָיו אֶל־בֵּיתוֹ
  choice: அவனுடைய எஜமான் வீட்டுக்கு வரும்வரை
  rationale: ‘அவனுடைய எஜமான் தனது வீட்டிற்குள் வரும் வரை’ என்ற எபிரெய அமைப்பை இயல்பான தமிழில் சுருக்கமின்றி தெரிவிக்கிறது; சூழலில் அது எஜமானின் சொந்த வீடு என்பது தெளிவு.
