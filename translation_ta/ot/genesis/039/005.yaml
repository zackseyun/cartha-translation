  text: וַ/יְהִ֡י מֵ/אָז֩ הִפְקִ֨יד אֹת֜/וֹ בְּ/בֵית֗/וֹ וְ/עַל֙ כָּל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת בֵּ֥ית הַ/מִּצְרִ֖י בִּ/גְלַ֣ל יוֹסֵ֑ף וַ/יְהִ֞י בִּרְכַּ֤ת יְהוָה֙ בְּ/כָל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ בַּ/בַּ֖יִת וּ/בַ/שָּׂדֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/005.yaml
  text: And from the time he appointed him over his house and over all that he had[a], Yahweh blessed the Egyptian’s house because of Joseph, and Yahweh’s blessing was on all that he had[b], in the house and in the field.
translation:
  language: ta
  text: அவன் அவனைத் தன் வீட்டையும் தனக்கிருந்த எல்லாவற்றையும் மேற்பார்வையிட நியமித்த காலத்திலிருந்து[a], யோசேப்பின் காரணமாக யாவே அந்த எகிப்தியனின் வீட்டை ஆசீர்வதித்தார். வீட்டிலும் வயலிலும் அவனுக்கிருந்த எல்லாவற்றின்மேலும் யாவேயின் ஆசீர்வாதம் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் அவனைத் தன் வீட்டையும் தனக்கிருந்த எல்லாவற்றையும் மேற்பார்வையிட நியமித்தது முதல்.”
    reason: מֵאָז காலத்தின் தொடக்கப்புள்ளியைக் குறிக்கிறது; ‘காலத்திலிருந்து’ மற்றும் ‘அது முதல்’ ஆகிய இரு வடிவங்களும் அந்தக் கருத்தை இயல்பாகத் தருகின்றன.
lexical_decisions:
- source_word: מֵאָז
  choice: நியமித்த காலத்திலிருந்து
  rationale: ஒரு குறிப்பிட்ட நிகழ்விலிருந்து தொடங்கிய காலநிலையைச் சுட்டுகிறது; தமிழ் வாக்கியத்தில் இயல்பாகவும் மூலத்தின் காலத் தொடர்பைத் தெளிவாகவும் தருகிறது.
- source_word: הִפְקִיד
  choice: பொறுப்பாளராக நியமித்த
  rationale: ஹிஃபில் வடிவம் மேற்பார்வை அல்லது நிர்வாகப் பொறுப்பை ஒப்படைப்பதைக் குறிக்கிறது; அதிகாரப்பூர்வ நியமனமும் நடைமுறைப் பொறுப்பும் இச்சொற்றொடரில் வெளிப்படுகின்றன.
- source_word: בְּבֵיתוֹ וְעַל כָּל אֲשֶׁר יֶשׁ־לוֹ
  choice: தன் வீட்டுக்கும் தனக்கிருந்த எல்லாவற்றுக்கும் பொறுப்பாளராக
  rationale: இடத்தைக் காட்டுவது மட்டுமல்லாமல், யோசேப்பிடம் ஒப்படைக்கப்பட்ட நிர்வாக அதிகாரத்தின் பரப்பைக் காட்டும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיְבָרֶךְ
  choice: ஆசீர்வதித்தார்
  rationale: பொருளாதார வளம் விளைவாக இருந்தாலும், மூலத்தில் உள்ள ברך என்ற நேரடியான இறை ஆசீர்வாதச் சொல்லைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்து இறைப்பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בֵּית הַמִּצְרִי
  choice: அந்த எகிப்தியனின் வீடு
  rationale: சூழலில் முன்பே குறிப்பிடப்பட்ட எகிப்தியனையும், அவனுடைய இல்லம் அல்லது வீட்டார் சார்ந்த முழுத் துறையையும் குறிக்கிறது.
- source_word: בִּגְלַל יוֹסֵף
  choice: யோசேப்பின் நிமித்தம்
  rationale: யோசேப்பே அந்த ஆசீர்வாதம் அந்த வீட்டிற்கு வந்ததற்கான காரணம் அல்லது அடிப்படை என்பதை בגלל குறிக்கிறது.
- source_word: בִּרְכַּת יְהוָה
  choice: யாவேயின் ஆசீர்வாதம்
  rationale: இறைப்பெயருடனான எபிரெயக் கட்டமைப்பை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: בְּכָל אֲשֶׁר יֶשׁ־לוֹ
  choice: அவனுக்கிருந்த எல்லாவற்றின்மேலும்
  rationale: ஆசீர்வாதத்தின் முழுமையான பரப்பை வெளிப்படுத்துகிறது; ב என்ற முன்னொட்டு இங்கு ஆசீர்வாதம் தங்கியிருந்த துறையை அல்லது பொருட்களைச் சுட்டுகிறது.
- source_word: בַּבַּיִת וּבַשָּׂדֶה
  choice: வீட்டிலும் வயலிலும்
  rationale: இல்லம் மற்றும் வேளாண் நிலம் ஆகிய முழுப் பரப்பையும் குறிக்கும் மூலத்தின் தெளிவான உருவகத்தைச் சுருக்கமின்றித் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது; ‘யாவே’ என்பது சாத்தியமான எபிரெய உச்சரிப்பை அணுகும் நவீன வடிவம்.
- issue: யோசேப்பின் காரணமாக வந்த ஆசீர்வாதத்தின் தன்மை
  choice: யோசேப்பின் நிமித்தம் யாவே ... ஆசீர்வதித்தார்
  alternative: யோசேப்பால் அந்த வீடு செழித்தது
  rationale: விளைவு செழிப்பாக இருந்திருக்கலாம்; ஆயினும் மூலவாக்கியம் செய்பவராக யாவேயைத் தெளிவாகக் குறிப்பிடுகிறது. ஆகவே இறைச் செயலை மனிதச் சாதனையாக மாற்றாமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘பொறுப்பாளராக நியமித்த’ என்பது நிர்வாக அதிகாரத்தை இயல்பாக எடுத்துரைக்கிறது. ‘வீட்டிலும் வயலிலும்’ என்ற மூலத்தின் இணை அமைப்பு அப்படியே பாதுகாக்கப்பட்டுள்ளது; பிரிவுசார் சொற்பயன்பாடுகள் தவிர்க்கப்பட்டுள்ளன.
