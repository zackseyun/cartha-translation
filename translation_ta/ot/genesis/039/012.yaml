  yaml_path: translation/ot/genesis/039/012.yaml
  text: Then she grabbed him by his garment[a], saying[b], “Lie with me!” But he left his garment in her hand and fled and went outside.
translation:
  language: ta
  text: அவள் அவனுடைய ஆடையைப் பிடித்து, “என்னோடு படு!” என்றாள். ஆனால் அவன் தன் ஆடையை அவள் கையில் விட்டுவிட்டு, தப்பியோடி வெளியே சென்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּתְפְּשֵׂהוּ
  choice: அவள் அவனுடைய ஆடையைப் பிடித்துக்கொண்டு
  rationale: תפשׂ உறுதியாகப் பற்றிப் பிடித்தலைக் குறிக்கிறது. தமிழில் அடுத்துள்ள בְבִגְדוֹ உடன் இணைத்து இவ்வாறு மொழிபெயர்ப்பது இயல்பாகவும் காட்சியின் திடீர் உடல் நடவடிக்கையைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּבִגְדוֹ / בִּגְדוֹ
  choice: அவனுடைய ஆடையை / தன் ஆடையை
  rationale: בגד என்பது குறிப்பிட்ட வகையைச் சொல்லாத பொதுவான ஆடைச்சொல். ஆகவே ‘மேலங்கி’ அல்லது ‘அங்கி’ என்று மிகையாகக் குறிப்பாக்காமல் ‘ஆடை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לֵאמֹר
  choice: என்றாள்
  rationale: இந்த infinitive construct நேரடிப் பேச்சை அறிமுகப்படுத்துகிறது. எபிரெய வடிவத்தை இயந்திரமாகப் பின்பற்றும் ‘சொல்லி’ என்பதைவிட, தமிழ்க் கதையாடலில் ‘என்றாள்’ இயல்பானது.
- source_word: שִׁכְבָה עִמִּי
  choice: என்னோடு படு!
  rationale: שׁכב עם என்பது இங்கு பாலுறவுக்கான மென்மொழி. ‘என்னோடு படு’ மூலத்தின் ‘படு’ என்ற உருவகத்தைப் பாதுகாத்து, தமிழிலும் பாலியல் அழைப்பைச் சூழலில் தெளிவாக உணர்த்துகிறது.
- source_word: וַיַּעֲזֹב
  choice: விட்டுவிட்டு
  rationale: עזב இங்கு ஆடையை அவளது கையில் விட்டுச் செல்வதைக் குறிக்கிறது. தொடரும் தப்பியோட்டத்துடன் இயல்பாக இணைக்க ‘விட்டுவிட்டு’ பயன்படுத்தப்பட்டது.
- source_word: בְּיָדָהּ
  choice: அவள் கையில்
  rationale: יד என்பதன் நேரடிப் பொருள் ‘கை’; இங்கு ஆடை அவளுடைய உடல் பிடியிலும் வசத்திலும் இருந்ததை இந்த இயல்பான தமிழ் சொற்றொடர் தெரிவிக்கிறது.
- source_word: וַיָּנָס
  choice: தப்பியோடி
  rationale: נוס அவசரமாகத் தப்பிச் செல்வதைச் சுட்டுகிறது. ‘தப்பியோடி’ அந்த அவசரத்தையும் நோக்கத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיֵּצֵא הַחוּצָה
  choice: வெளியே சென்றான்
  rationale: יצא + החוצה உள்ளிருந்து வெளிப்புறத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது. ‘வெளியே சென்றான்’ தெளிவான, இயல்பான தமிழ்.
