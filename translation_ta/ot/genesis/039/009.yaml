  text: אֵינֶ֨/נּוּ גָד֜וֹל בַּ/בַּ֣יִת הַ/זֶּה֮ מִמֶּ/נִּי֒ וְ/לֹֽא חָשַׂ֤ךְ מִמֶּ֨/נִּי֙ מְא֔וּמָה כִּ֥י אִם אוֹתָ֖/ךְ בַּ/אֲשֶׁ֣ר אַתְּ אִשְׁתּ֑/וֹ וְ/אֵ֨יךְ אֶֽעֱשֶׂ֜ה הָ/רָעָ֤ה הַ/גְּדֹלָה֙ הַ/זֹּ֔את וְ/חָטָ֖אתִי לֵֽ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/009.yaml
  text: There is no one greater in this house than I am[a], and he has withheld nothing from me except you, because you are his wife[b]. So how could I do this great evil and sin against God?
translation:
  language: ta
  text: இந்த வீட்டில் என்னைவிட மேலானவர் யாரும் இல்லை[a]. அவர் உன்னைத் தவிர வேறு எதையும் எனக்குத் தராமல் வைத்திருக்கவில்லை; ஏனெனில் நீ அவருடைய மனைவி. அப்படியானால், நான் எப்படி இந்தப் பெரும் தீமையை[b]ச் செய்து கடவுளுக்கு எதிராகப் பாவம் செய்வேன்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த வீட்டில் என்னைவிட உயர்ந்தவர் யாரும் இல்லை.” எபிரெய மொழியில், யோசேப்பைவிட உயர்ந்தவர் அந்த வீட்டில் எவரும் இல்லை என்று நேரடியாக மறுக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “தீமை” என்பதற்கான எபிரெயச் சொல் பொல்லாப்பு, அக்கிரமம் அல்லது தவறு என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵינֶנּוּ גָדוֹל ... מִמֶּנִּי
  choice: இந்த வீட்டில் என்னைவிடப் பெரியவர் யாரும் இல்லை
  rationale: אֵין அமைப்பு ஒருவரின் இல்லாமையை மறுத்துரைக்கிறது; யோசேப்பு வீட்டில் தனக்கு அளிக்கப்பட்ட உயர்ந்த நிலையைக் குறிப்பிடுகிறார். இத்தமிழாக்கம் எபிரெய வாக்கியத்தின் இயல்பான பொருளைப் பாதுகாக்கிறது.
- source_word: בַּבַּיִת הַזֶּה
  choice: இந்த வீட்டில்
  rationale: בַּיִת என்பது வீடு அல்லது வீட்டார்/இல்ல நிர்வாகம் ஆகியவற்றைக் குறிக்கலாம். ‘வீட்டில்’ என்பது எபிரெய உருவகத்தைப் பாதுகாத்தபடியே இச்சூழலில் முழு இல்ல நிர்வாகத்தையும் இயல்பாக உள்ளடக்குகிறது.
- source_word: חָשַׂךְ מִמֶּנִּי מְאוּמָה
  choice: வேறு எதையும் அவர் எனக்குத் தடுத்து வைக்கவில்லை
  rationale: חָשַׂךְ என்பது தடுத்து வைத்தல் அல்லது விலக்கி வைத்தல். மறுப்புடன் வரும் מְאוּמָה ‘எதையும் இல்லை’ என்ற பொருளைத் தருகிறது.
- source_word: כִּי אִם אוֹתָךְ
  choice: உன்னைத் தவிர
  rationale: மறுப்பு வாக்கியத்துக்குப் பின் כִּי אִם தெளிவான விதிவிலக்கைக் குறிக்கிறது.
- source_word: בַּאֲשֶׁר אַתְּ אִשְׁתּוֹ
  choice: நீ அவருடைய மனைவியாக இருப்பதால்
  rationale: இந்தத் தொடர் விதிவிலக்கிற்கான காரணத்தை அளிக்கிறது; நவீனத் தமிழில் காரண உறவைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְאֵיךְ
  choice: ஆகவே, நான் எப்படி
  rationale: וְ இங்கு முந்தைய உண்மைகளிலிருந்து வரும் அறநெறி முடிவை அறிமுகப்படுத்துகிறது; ‘ஆகவே’ அதன் அனுமானத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: הָרָעָה הַגְּדֹלָה הַזֹּאת
  choice: இந்தப் பெரும் தீமை
  rationale: רָעָה என்பது தீமை, பொல்லாப்பு அல்லது தவறு எனப் பொருள்படலாம். ‘பெரும் தீமை’ மூலத்தின் அறநெறி வலிமையையும் சுட்டுச் சொல்லும் அமைப்பையும் பாதுகாக்கிறது.
- source_word: וְחָטָאתִי לֵאלֹהִים
  choice: கடவுளுக்கு எதிராகப் பாவம் செய்ய
  rationale: חטא + ל ஒருவருக்கு எதிராகப் பாவம் செய்வதைக் குறிக்கலாம். தமிழில் ‘எதிராகப் பாவம் செய்’ என்பது உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யோசேப்பின் பேச்சில் אֱלֹהִים என்பதன் குறிப்பு
  choice: கடவுள்
  alternative: ஒரு தெய்வம்
  rationale: ஆதியாகமக் கதையில் யோசேப்பு தான் வணங்கும் உண்மைக் கடவுளைக் குறிப்பிடுகிறார்; இங்கு அறநெறிக் குற்றம் மனித எஜமானுக்கு மட்டுமல்ல, கடவுளுக்கும் எதிரானதாகச் சொல்லப்படுகிறது.
- issue: பாவத்தின் இரட்டை அறநெறிப் பரிமாணம்
  choice: ‘இந்தப் பெரும் தீமையைச் செய்து கடவுளுக்கு எதிராகப் பாவம்’ என்ற இணைப்பைப் பாதுகாத்தல்
  alternative: இதை வெறும் எஜமானுக்கு எதிரான துரோகமாக மட்டும் விளக்குதல்
  rationale: மூல உரை செயலைத் ‘தீமை’ என்றும் ‘கடவுளுக்கு எதிரான பாவம்’ என்றும் கூறுகிறது. இரண்டையும் தனித்தும் தொடர்புடனும் வைத்திருப்பது உரையின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘வீடு’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; உரையில் வெளிப்படையாக இல்லாத திருமணச் செயலை விரிவாகச் சேர்க்காமல், ‘இந்தப் பெரும் தீமை’ என்ற உண்மையான மறைமுகத்தன்மை காக்கப்பட்டுள்ளது.
