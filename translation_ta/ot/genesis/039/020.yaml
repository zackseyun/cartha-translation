  text: וַ/יִּקַּח֩ אֲדֹנֵ֨י יוֹסֵ֜ף אֹת֗/וֹ וַֽ/יִּתְּנֵ֨/הוּ֙ אֶל בֵּ֣ית הַ/סֹּ֔הַר מְק֕וֹם אֲשֶׁר אסורי הַ/מֶּ֖לֶךְ אֲסוּרִ֑ים וַֽ/יְהִי שָׁ֖ם בְּ/בֵ֥ית הַ/סֹּֽהַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/020.yaml
  text: So Joseph’s master took him and put him into the prison[a], the place where the king’s prisoners were confined[b]. And he was there in the prison.
translation:
  language: ta
  text: ஆகவே, யோசேப்பின் எஜமான் அவனை அழைத்துச் சென்று சிறைச்சாலையில்[a] வைத்தான்; அது அரசனின் கைதிகள் அடைத்து வைக்கப்பட்டிருந்த இடம்[b]. அவன் அங்கே அந்தச் சிறைச்சாலையில் இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “சோஹரின் வீடு.” ‘சோஹர்’ என்பது சிறை அல்லது காவல் நிலையத்தைக் குறிக்கும் எகிப்தியச் சொல்லாக இருக்கலாம்.
    reason: cultural_note
  - marker: b
    text: எபிரெயத்தில் ‘அரசனின் கைதிகள்’ என்பதிலும் ‘அடைத்து வைக்கப்பட்டிருந்த’ என்பதிலும் ஒரே வேர் மீண்டும் வருகிறது; சொல்லுக்குச் சொல், “அரசனின் கட்டப்பட்டவர்கள் கட்டப்பட்டிருந்த இடம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֵי יוֹסֵף
  choice: யோசேப்பின் எஜமான்
  rationale: இந்தக் கதையின் சூழலில் אֲדֹנֵי என்பது தெய்வீகப் பட்டம் அல்ல; யோசேப்பின்மேல் அதிகாரமுள்ள மனித எஜமானைக் குறிக்கிறது. ‘எஜமான்’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: וַיִּקַּח
  choice: பிடித்து
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்’. இங்கு ஒருவரைக் காவலுக்கு எடுத்துக்கொள்ளும் சூழலில் ‘பிடித்து’ இயல்பாக உள்ளது; ‘கைப்பற்றி’ போன்ற அதிக வன்முறையைக் கூறும் சொல்லைத் தவிர்க்கிறது.
- source_word: וַיִּתְּנֵהוּ אֶל
  choice: அவனை வைத்தான்
  rationale: נתן + אֶל இங்கு ஒருவரை ஒரு குறிப்பிட்ட இடத்தில் வைப்பதைக் குறிக்கிறது. சிறைச்சாலையை முன்னரே இடக்குறிப்பாக அமைத்ததால் ‘அவனை வைத்தான்’ தெளிவான தமிழாகிறது.
- source_word: בֵּית הַסֹּהַר
  choice: சிறைச்சாலை
  rationale: சொல்லுக்குச் சொல் ‘சோஹரின் வீடு’; ஆனால் சூழலில் இது காவலில் வைக்கும் சிறையைக் குறிக்கிறது. ‘சிறைச்சாலை’ நவீனத் தமிழில் தெளிவான இணைச்சொல்.
- source_word: מְקוֹם אֲשֶׁר
  choice: அரசனின் கைதிகள் அடைத்து வைக்கப்பட்டிருந்த சிறைச்சாலையில்
  rationale: எபிரெயத்தில் சிறை ‘அரசனின் கைதிகள் அடைக்கப்பட்டிருந்த இடம்’ என்று விளக்கப்படுகிறது. தமிழில் செயற்கையான இரட்டிப்பைத் தவிர்த்து, அந்த விளக்கத்தை உறவெச்சத் தொடராக இயல்பாக இணைக்கிறது.
- source_word: אֲסוּרֵי הַמֶּלֶךְ אֲסוּרִים
  choice: அரசனின் கைதிகள் அடைத்து வைக்கப்பட்டிருந்த
  rationale: אסר என்ற வேர் ‘கைதிகள்’ மற்றும் ‘அடைத்து வைக்கப்பட்டிருந்த’ என்பவற்றில் பொருளளவில் பிரதிபலிக்கிறது. மூலத்தின் வேர்ச்சொல் மீளுருவாக்கத்தை இயல்பான தமிழில் ஓரளவு காக்கிறது.
- source_word: וַיְהִי שָׁם
  choice: அவன் அங்கே ... இருந்தான்
  rationale: இது யோசேப்பு அந்த இடத்தில் இருந்ததை எளிமையாகக் கூறுகிறது; ‘தொடர்ந்து இருந்தான்’ என்று மூலத்தில் வெளிப்படையாக இல்லாத நீடிப்பைச் சேர்க்கவில்லை.
- source_word: בְּבֵית הַסֹּהַר
  choice: சிறைச்சாலையில்
  rationale: மூலத்தில் இடம் மறுபடியும் குறிப்பிடப்படுகிறது. தமிழிலும் அந்த மீளுரையை வைத்திருப்பது வலியுறுத்தலைக் காக்கிறது.
