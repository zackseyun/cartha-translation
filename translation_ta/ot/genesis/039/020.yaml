  to: ஆகவே, யோசேப்பின் எஜமான் அவனை அழைத்துச் சென்று சிறைச்சாலையில்[a] வைத்தான்; அது அரசனின் கைதிகள் அடைத்து வைக்கப்பட்டிருந்த இடம்[b]. அவன் அங்கே அந்தச் சிறைச்சாலையில் இருந்தான்.
