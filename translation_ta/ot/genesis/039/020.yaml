  source_fidelity: ‘பிடித்து’ என்பது וַיִּקַּח (‘எடுத்துக்கொண்டு/took’) என்பதைக் காட்டிலும் கைது செய்தல் அல்லது வலுக்கட்டாயமாகப் பற்றிக்கொள்ளுதல் என்ற வலுவான பொருளைத் தருகிறது. மேலும், மூலத்தில் ‘சிறைச்சாலை’ முதலில் கூறப்பட்டு, பின்னர் ‘அரசனின் கைதிகள் அடைத்து வைக்கப்பட்டிருந்த இடம்’ என விளக்கப்படும் அப்போசிஷன் உள்ளது; வரைவு அதை உறவெச்சத்துக்குள் இணைத்து அந்த அமைப்பை மறைக்கிறது.
