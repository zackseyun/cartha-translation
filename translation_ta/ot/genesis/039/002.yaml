source:
  edition: WLC
  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יְהִ֖י אִ֣ישׁ מַצְלִ֑יחַ וַ/יְהִ֕י בְּ/בֵ֥ית אֲדֹנָ֖י/ו הַ/מִּצְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/002.yaml
  text: Yahweh was with Joseph[a], and he became a successful man; and he was in the house of his Egyptian master.
translation:
  language: ta
  text: யாவே யோசேப்புடன் இருந்தார்; அவர் வெற்றிகரமான மனிதரானார்; அவர் தன் எகிப்திய எஜமானின் வீட்டில் இருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செழித்தோங்கிய மனிதர்.” எபிரெயப் பங்கேற்புவினை வெற்றியடைகிறவரையோ செழித்தோங்குகிறவரையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெயத் தெய்வீகப் பெயரைத் தலைப்பாக மாற்றாமல், தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: אֶת יוֹסֵף
  choice: யோசேப்போடு
  rationale: ‘யோசேப்புடன் இருந்தார்’ என்ற தெய்வீக உடனிருப்பைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: אִישׁ מַצְלִיחַ
  choice: வெற்றிபெற்ற மனிதர்
  rationale: מַצְלִיחַ என்பதன் வெற்றி அடைதல் அல்லது செழித்தோங்குதல் என்ற பரந்த பொருளை, வெறும் பொருளாதாரச் செழிப்பாகக் குறுக்காமல் தருகிறது.
- source_word: בְּבֵית אֲדֹנָיו
  choice: தம் எஜமானின் வீட்டில்
  rationale: Joseph மீது அதிகாரம் கொண்டவரைக் குறிக்கும் אֲדֹנָיו என்பதற்கு இச்சூழலில் ‘எஜமான்’ இயல்பானது; בְּבֵית என்பதன் வீட்டுச் சூழலையும் காக்கிறது.
- source_word: הַמִּצְרִי
  choice: எகிப்திய
  rationale: எஜமானின் இன/நாட்டு அடையாளத்தைத் தமிழில் இயல்பான பெயரடையாக வழங்குகிறது.
- source_word: וַיְהִי ... וַיְהִי ... וַיְהִי
  choice: இருந்தார் ... ஆனார் ... இருந்தார்
  rationale: மூன்று தொடர்ச்சியான היה வடிவங்களின் உரைநடை முன்னேற்றத்தைக் காக்கிறது; நடுக் கூறில் உருவான நிலையை ‘ஆனார்’ எனத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே
  rationale: தலைப்பான ‘கர்த்தர்’ என்று மாற்றாமல் தனிப்பட்ட தெய்வீகப் பெயரைப் பாதுகாக்கிறது; நான்கு மெய்யெழுத்துப் பெயரின் துல்லிய உச்சரிப்பு உறுதியாக இல்லாததால் தமிழில் பரவலாக அறியப்படும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: யோசேப்பின் வெற்றிக்கும் யெகோவாவின் உடனிருப்புக்கும் உள்ள தொடர்பு
  choice: ‘அதனால்’ என்று காரணத் தொடர்பை வெளிப்படுத்துதல்
  alternative: இரு கூறுகளையும் ‘மற்றும்’ என்று மட்டும் இணைத்தல்
  rationale: எபிரெய வாக்கியத் தொடரில் உடனிருப்பைத் தொடர்ந்து வெற்றி வருவது காரணத் தொடர்பைச் சுட்டுகிறது; இருப்பினும் வெற்றியின் தன்மையைச் செல்வம் என்று வரையறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரை. ‘எஜமான்’ என்பது இங்குள்ள அதிகார உறவைத் தெளிவாகக் காட்டுகிறது. அடிக்குறி குறியீடு மாற்றுச் சொல்லாக்கத்துடன் தொடர்புடைய இடத்திலேயே வைக்கப்பட்டுள்ளது.
