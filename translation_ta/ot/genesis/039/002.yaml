revisions:
- from: யெகோவா யோசேப்போடு இருந்தார்; அதனால் அவர் வெற்றிபெற்ற மனிதராக ஆனார்.[a] அவர் தம் எகிப்திய எஜமானின் வீட்டில் இருந்தார்.
  to: யாவே யோசேப்புடன் இருந்தார்; அவர் வெற்றிகரமான மனிதரானார்; அவர் தன் எகிப்திய எஜமானின் வீட்டில் இருந்தார்.[a]
  rationale: The revision aligns the divine name with the mandated Yahweh rendering, removes an unstated causal connector, retains the three-clause progression of the Hebrew, and gives a clearer Tamil lexical-alternative footnote. The footnote marker is placed after the clause containing «வெற்றிகரமான மனிதரானார்», the expression to which it applies.
