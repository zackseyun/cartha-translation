base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/017.yaml
  text: Then she spoke to him with words like these[a], saying, “The Hebrew servant whom you brought to us came to me to mock me.”
translation:
  language: ta
  text: 'பின்பு அவள் அவனிடம் இவ்வாறான வார்த்தைகளைக் கூறினாள்: “நீங்கள் எங்களிடம் கொண்டுவந்த அந்த எபிரேய அடிமை என்னைக் கேலி செய்வதற்காக என்னிடம் வந்தான்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னை விளையாட்டுப் பொருளாக்க”; இச்சொற்றொடர் இச்சூழலில் பாலியல் அல்லது துன்புறுத்தும் நுட்பத்தையும் கொண்டிருக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: பின்பு அவள் அவனிடம் ... சொன்னாள்
  rationale: வழக்கை முன்னெடுக்கும் wayyiqtol தொடரை இயல்பான தமிழில் ‘பின்பு’ என்று காட்டுகிறது; எபிரெய மூலத்திலுள்ள சுட்டுப்பெயரைப் போலவே ‘அவனிடம்’ என வைத்துள்ளது.
- source_word: כַּדְּבָרִים הָאֵלֶּה לֵאמֹר
  choice: இதுபோன்ற வார்த்தைகளைச் சொன்னாள்
  rationale: כַּדְּבָרִים הָאֵלֶּה என்பது அவளுடைய அறிக்கையின் சாரத்தை அறிமுகப்படுத்துகிறது. லֵאמֹר-ஐ தனியே செயற்கையாக மொழிபெயர்க்காமல், நேரடி கூற்றை அறிமுகப்படுத்தும் இயல்பான தமிழ்த் தொடரில் இணைத்துள்ளது.
- source_word: הָעֶבֶד הָעִבְרִי
  choice: அந்த எபிரேய அடிமை
  rationale: עֶבֶד இச்சூழலில் வீட்டுக்குரிய பிணைப்பட்ட அடிமை நிலையைக் குறிக்கிறது; அதனால் மென்மையாக்கும் ‘வேலைக்காரன்’ என்பதற்குப் பதிலாக ‘அடிமை’ பயன்படுத்தப்பட்டுள்ளது. הָעִבְרִי இன அடையாளமாக ‘எபிரேய’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר הֵבֵאתָ לָּנוּ
  choice: நீர் எங்களிடம் கொண்டுவந்த
  rationale: அவள் கணவன்மீது குற்றம் சுமத்தும் தொனியையும், மூலத்திலுள்ள முதல் நபர் பன்மையான ‘எங்களுக்கு/எங்களிடம்’ என்பதையும் காக்கிறது. மரியாதை ஒருமையான ‘நீர்’ குடும்பத் தலைவனிடம் பேசும் dignified Tamil register-க்கு ஏற்றது.
- source_word: בָּא אֵלַי
  choice: என்னிடம் வந்தான்
  rationale: בוא + אל அவளை நோக்கிய வருகையை நேரடியாகக் குறிக்கிறது. ‘என்னோடு சேர வந்தான்’ போன்ற பாலியல் பொருளை முன்கூட்டியே மிகைப்படுத்தாமல் எளிய இயக்கப் பொருளைத் தக்கவைக்கிறது.
- source_word: לְצַחֶק בִּי
  choice: என்னைக் கேலி செய்ய
  rationale: צחק இங்கு ஏளனம் அல்லது தவறான விளையாட்டாக நடத்துதல் என்ற குற்றச்சாட்டைக் கொண்டுள்ளது. ‘கேலி செய்ய’ அதன் வெளிப்படையான இழிவுபடுத்தும் வலிமையைத் தருகிறது; சூழலில் சாத்தியமான பாலியல் அல்லது துன்புறுத்தும் நுட்பம் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. யோசேப்பின் சட்ட மற்றும் சமூக நிலையைத் தெளிவாகக் காட்ட ‘அடிமை’ தேர்ந்தெடுக்கப்பட்டது. மூலத்தின் திட்டமிட்ட தெளிவின்மையைத் தீர்த்துவிடாமல், צחק என்பதன் பரந்த நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
