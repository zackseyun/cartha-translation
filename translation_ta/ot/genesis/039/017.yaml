- from: 'பின்பு அவள் அவனிடம் இதுபோன்ற வார்த்தைகளைச் சொன்னாள்: “நீர் எங்களிடம் கொண்டுவந்த அந்த எபிரேய அடிமை என்னைக் கேலி செய்ய என்னிடம் வந்தான்[a].”'
  to: 'பின்பு அவள் அவனிடம் இவ்வாறான வார்த்தைகளைக் கூறினாள்: “நீங்கள் எங்களிடம் கொண்டுவந்த அந்த எபிரேய அடிமை என்னைக் கேலி செய்வதற்காக என்னிடம் வந்தான்[a].”'
