translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எஜமான்’ என்பது வீட்டுச் சூழலிலுள்ள சமூக உறவைத் தெளிவுபடுத்துகிறது. எபிரெய மொழியின் கை-உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
