base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/008.yaml
  text: But he refused and said to his master's wife[a], "Look, my master does not concern himself with what is in the house[c][b], and everything that belongs to him he has put into my hand."
translation:
  language: ta
  text: ஆனால் அவன் மறுத்து, தன் எஜமானின் மனைவியிடம், “இதோ, வீட்டில் என்ன இருக்கிறது என்பதைப் பற்றி என் எஜமான் கவலைப்படுவதில்லை[a]; தனக்குச் சொந்தமான அனைத்தையும் அவர் என் கையில் கொடுத்திருக்கிறார்[b]” என்று கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “என்னோடு, வீட்டில் என்ன இருக்கிறது என்பதை அறியவில்லை.” வீட்டுக் காரியங்களை யோசேப்பின் மேற்பார்வையில் விட்டுவிட்டு, அவற்றைப் பற்றி எஜமான் அக்கறை கொள்ளாமல் இருப்பதை இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் பொறுப்பில் ஒப்படைத்திருக்கிறார்.” எபிரெயத்தில் சொல்லுக்குச் சொல், “என் கையில் கொடுத்திருக்கிறார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: ஆனால் அவன் மறுத்து
  rationale: וַ־ என்பதன் தொடர்ச்சியையும், முந்தைய வசனத்திலுள்ள அழைப்புக்கு எதிரான யோசேப்பின் மறுப்பையும் ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது; מָאֵן என்பதற்கு ‘மறுத்தான்’ நேரான பொருள்.
- source_word: וַיֹּאמֶר אֶל־אֵשֶׁת אֲדֹנָיו
  choice: தன் எஜமானின் மனைவியிடம்
  rationale: எபிரெயக் கட்டமைப்பிலுள்ள உறவையும் உரையாடலின் நோக்குநரையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: הֵן
  choice: இதோ
  rationale: அடுத்து சொல்லப்படுவதற்குக் கவனத்தை ஈர்க்கும் உரையாடல் துகளின் செயல்பாட்டைப் பாதுகாக்கிறது.
- source_word: אֲדֹנִי
  choice: என் எஜமான்
  rationale: போத்திபாருக்கும் யோசேப்புக்கும் இடையிலான வீட்டுப் பணியாளர்–எஜமான் உறவைத் தெளிவாகக் குறிக்கிறது.
- source_word: לֹא יָדַע אִתִּי מַה בַּבָּיִת
  choice: வீட்டில் உள்ளவற்றைப் பற்றி என் எஜமான் என்னிடம் எதுவும் விசாரிப்பதில்லை
  rationale: சொல்லுக்குச் சொல் ‘என்னோடு அறியவில்லை’ எனத் தெளிவில்லாமல் மொழிபெயர்ப்பதைத் தவிர்த்து, வீட்டுக் காரியங்களை யோசேப்பின் மேற்பார்வைக்கு விட்டுவிட்டதால் எஜமான் அவற்றைப் பற்றி விசாரிப்பதில்லை என்ற சூழல்சார் பொருளைத் தருகிறது; אִתִּי-யின் இருப்பை ‘என்னிடம்’ என்பதால் ஓரளவு பாதுகாக்கிறது.
- source_word: וְכֹל אֲשֶׁר יֶשׁ־לוֹ
  choice: தனக்குச் சொந்தமான அனைத்தையும்
  rationale: எஜமானுடைய உடைமைகளின் முழுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נָתַן בְּיָדִי
  choice: என் கையில் கொடுத்திருக்கிறார்
  rationale: ஒப்படைத்தல் மற்றும் அதிகாரம் அளித்தல் ஆகிய பொருள்களைத் தரும் எபிரெய உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் பாதுகாக்கிறது.
