base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/003.yaml
  text: His master saw that Yahweh was with him[a], and that Yahweh made prosper in his hand all that he did.
translation:
  language: ta
  text: அவனுடைய எஜமான், யாவே அவனோடு இருப்பதையும், அவன் செய்கிற அனைத்தையும் யாவே அவன் கையில்[a] வெற்றிபெறச் செய்வதையும் கண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவன் மூலமாக’ அல்லது ‘அவனுடைய பொறுப்பில்’; எபிரெயத்தில் சொல்லர்த்தமாக, ‘அவன் கையில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டான்
  rationale: ראה என்பதன் எளிய கதைநடைப் பொருளான ‘கண்டான்’ என்பதைக் காக்கிறது; சூழலில் கவனித்து உணர்ந்தான் என்ற உட்பொருளையும் ஏற்கக்கூடியதாக உள்ளது.
- source_word: אֲדֹנָיו
  choice: அவனுடைய எஜமான்
  rationale: இங்கு யோசேப்பின் வீட்டு எஜமானான போத்திபாரைக் குறிக்கிறது. நவீனத் தமிழில் அந்தச் சமூக உறவைத் தெளிவாகக் காட்டும் இயல்பான சொல் ‘எஜமான்’.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமமான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் ஒலிபெயர்ப்பான ‘யாவே’ என்று தருகிறது.
- source_word: אִתּוֹ
  choice: அவனோடு இருப்பதை
  rationale: யோசேப்புடன் கடவுளின் உடனிருப்பை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְכֹל אֲשֶׁר הוּא עֹשֶׂה
  choice: அவன் செய்கிற அனைத்தையும்
  rationale: எபிரெயச் சொற்றொடரின் முழுமையான பரப்பையும், தொடர்ச்சியான செயற்பாட்டைக் குறிக்கும் நிகழ்காலத் தன்மையையும் காக்கிறது.
- source_word: מַצְלִיחַ
  choice: வெற்றிபெறச் செய்வதை
  rationale: צלח என்பதன் ஹிஃபீல் வடிவிலுள்ள காரணவினைப் பொருளைக் காத்து, வெற்றிக்குக் காரணர் யாவே என்பதைக் காட்டுகிறது.
- source_word: בְּיָדוֹ
  choice: அவன் கையில்
  rationale: எபிரெய மொழியின் நேரடியான உருவகத்தைத் தக்கவைக்கிறது; இது யோசேப்பின் மூலமாகவோ அவனுடைய பொறுப்பின் கீழோ என்பதைக் குறிக்கக்கூடியதால் அந்த நுட்பத்தை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைநாமம் நேரடியாக உள்ளது; அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: בְּיָדוֹ என்பதிலுள்ள உருவகத்தையும் பொருள் நெகிழ்வையும் காத்தல்
  choice: முதன்மை உரையில் ‘அவன் கையில்’
  alternative: அவன் மூலமாக / அவனுடைய பொறுப்பில்
  rationale: இந்தச் சொற்றொடர் கருவித்தன்மை, முகமை அல்லது பொறுப்பின் எல்லை ஆகிய நுட்பங்களை ஏற்கலாம். ஒன்றை மட்டும் தேர்ந்தெடுத்து பொருளைச் சுருக்காமல் எபிரெய உருவகம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையான ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொல் வரிசையைத் தமிழுக்கு இயல்பாக மாற்றியபோதும், ‘அவன் கையில்’ என்ற மூல உருவகமும் அதன் பொருள் நெகிழ்வும் காக்கப்பட்டுள்ளன.
