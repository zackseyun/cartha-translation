  source_fidelity: 'மூல எபிரெயத்தின் இரு பொருள்-வாக்கியங்களும் துல்லியமாகக் காக்கப்பட்டுள்ளன: எஜமான் யாவே யோசேப்போடு இருப்பதைக் கண்டான்; யோசேப்பு செய்கிற அனைத்தையும் யாவே வெற்றிபெறச் செய்கிறார் என்பதையும் கண்டான். הִצְלִיחַ (ஹிஃபீல்) என்ற காரணவினைப் பொருள் ‘வெற்றிபெறச் செய்வது’ மூலம் தெளிவாக வெளிப்படுகிறது. ‘அவன் கையில்’ என்பது בְּיָדוֹ-வின் நேரடியான உருவகத்தைப் பாதுகாக்கிறது.'
