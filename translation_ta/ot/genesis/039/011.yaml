  to: அப்படியிருக்க, ஒரு நாள்[a], அவன் தன் வேலையைச் செய்வதற்காக வீட்டுக்குள் சென்றான். அப்போது வீட்டைச் சேர்ந்த ஆண்களில் ஒருவரும் அங்கே வீட்டில் இருக்கவில்லை.
  rationale: வசனத்தின் நிகழ்வைத் தொடுக்கும் וַיְהִי-யை “அப்படியிருக்க” எனச் சேர்த்துள்ளோம். மூலத்தின் இரட்டை இடக்குறிப்பான שָׁם בַּבָּיִת-ஐ “அங்கே வீட்டில்” எனத் தக்கவைத்துள்ளோம்; இச்சிறு மீளுரை எபிரெய வலியுறுத்தலைக் காக்கிறது. அடிக்குறிப்பு சொற்படியான வடிவத்தையும் அதன் மரபுத்தொடர்பொருளையும் தெளிவாகக் குறிப்பிடும் வகையில் திருத்தப்பட்டுள்ளது.
