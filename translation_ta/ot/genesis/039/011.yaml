base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/011.yaml
  text: And it happened on such a day that he went into the house to do his work[b][a], and none of the men of the house was there in the house.
translation:
  language: ta
  text: அப்படியிருக்க, ஒரு நாள்[a], அவன் தன் வேலையைச் செய்வதற்காக வீட்டுக்குள் சென்றான். அப்போது வீட்டைச் சேர்ந்த ஆண்களில் ஒருவரும் அங்கே வீட்டில் இருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படி, “இந்த நாளில்/இந்த நாளைப் பற்றி.” இங்குள்ள எபிரெய மரபுத்தொடர், “இத்தகைய ஒரு சந்தர்ப்பத்தில்” அல்லது “ஒரு நாள்” என்ற பொருளில் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהַיּוֹם הַזֶּה
  choice: ஒரு நாள்
  rationale: இது கதையின் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் எபிரெய மரபுத்தொடர். சொற்படி உள்ள ‘இந்த நாளைப் போல’ என்ற வடிவத்தைவிட, குறிப்பிட்ட ஒரு சந்தர்ப்பத்தைக் குறிக்கும் ‘ஒரு நாள்’ என்பது இயல்பான நவீனத் தமிழில் பொருளைத் தெளிவாகத் தருகிறது; சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: அவன் ... வீட்டுக்குள் சென்றான்
  rationale: בוא என்பதுடன் சேர்ந்த திசைகாட்டும் ־ה, வீட்டின் உள்ளே சென்ற இயக்கத்தைத் தெளிவாகக் குறிக்கிறது. ‘வீட்டுக்குள் சென்றான்’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַעֲשׂוֹת מְלַאכְתּוֹ
  choice: தன் வேலையைச் செய்வதற்காக
  rationale: מְלָאכָה இச்சூழலில் ஒருவருக்குரிய வேலை அல்லது கடமையைக் குறிக்கிறது. ‘தன் வேலை’ என்பது உரிமைப் பின்னொட்டையும் பொதுவான பொருளையும் காக்கிறது.
- source_word: וְאֵין אִישׁ מֵאַנְשֵׁי הַבַּיִת
  choice: வீட்டைச் சேர்ந்த ஆண்களில் ஒருவரும் ... இருக்கவில்லை
  rationale: எபிரெய உரை வீட்டைச் சேர்ந்த ‘ஆண்கள்’ என்று வெளிப்படையாகக் கூறுகிறது. எதிர்மறை இருப்புநிலையைத் தமிழில் இயல்பாகக் காட்ட ‘ஒருவரும் ... இருக்கவில்லை’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שָׁם בַּבָּיִת
  choice: அங்கே வீட்டில்
  rationale: שָׁם (‘அங்கே’) மற்றும் בַּבָּיִת (‘வீட்டில்’) ஆகிய இரு இடக்குறிப்புகளையும் விடாமல் காத்து, மூலத்தின் வலியுறுத்தலைப் பிரதிபலிக்கிறது.
