  register: நவீனத் தரத் தமிழில், மரியாதையும் கதைநடையின் தெளிவும் காக்கப்பட்டுள்ளன. ‘அங்கே வீட்டில்’ என்பது தமிழில் சற்றே மீளுரைப்பாகத் தோன்றினாலும், மூல எபிரெயத்தின் இரட்டை இடக்குறிப்பையும் அதன் வலியுறுத்தலையும் பாதுகாக்கிறது.
