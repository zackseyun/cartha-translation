  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֧ם גַּם אֶת זֶ֛ה מֵ/עִ֥ם פָּנַ֖/י וְ/קָרָ֣/הוּ אָס֑וֹן וְ/הֽוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/רָעָ֖ה שְׁאֹֽלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/029.yaml
  text: If you also take this one from me[a], and harm happens to him, then you will bring my gray hair down to Sheol in misery.
translation:
  language: ta
  text: நீங்கள் இவனையும் என்னிடமிருந்து அழைத்துச் சென்று, இவனுக்குப் பேரிடர் ஏதாவது நேரிட்டால், என் நரைத்த தலையைத் துயரத்தோடு பாதாளத்திற்குள் இறக்கிவிடுவீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பாதாளம்” என்பது இறந்தோரின் உலகத்தைக் குறிக்கிறது; “கல்லறை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְקַחְתֶּם גַּם אֶת־זֶה
  choice: நீங்கள் இவனையும் ... அழைத்துச் சென்று
  rationale: வாவ் + நிறைவுற்ற வினை இங்கு நிபந்தனைத் தொடரில் வருகிறது; ‘இவனையும்’ என்பது முந்தைய இழப்புடன் சேர்த்துக் கூறும் גַּם என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵעִם פָּנַי
  choice: என்னிடமிருந்து
  rationale: சொல்லுக்குச் சொல் ‘என் முன்னிலையிலிருந்து/என் முகத்தருகிலிருந்து’; இங்கு யாக்கோபின் அருகிலிருந்து பிரித்துக் கொண்டுசெல்லுதலை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: וְקָרָהוּ אָסוֹן
  choice: இவனுக்கு ஏதாவது ஆபத்து நேரிட்டால்
  rationale: קרה என்பது ‘நேரிடுதல்’, אָסוֹן என்பது கடுமையான கேடு அல்லது விபத்தைக் குறிக்கிறது. ‘ஆபத்து நேரிட்டால்’ மூலத்தின் உறுதியற்ற பேரிடர் எண்ணத்தைப் பேணுகிறது.
- source_word: וְהוֹרַדְתֶּם
  choice: கொண்டுபோவீர்கள்
  rationale: ירד என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளில் ‘கீழே கொண்டுபோதல்’ என்பதாகும்; பாதாளத்தை நோக்கிய இறக்கத்தைத் தொடர்ந்து வரும் இலக்கு வெளிப்படுத்துகிறது.
- source_word: שֵׂיבָתִי
  choice: என் நரைத்த தலையை
  rationale: எழுத்துப்படி ‘என் நரை’; இது முதுமையடைந்த தன்னைச் சுட்டும் ஆகுபெயர். தமிழில் ‘நரைத்த தலை’ மூல உருவகத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: בְּרָעָה
  choice: துயரத்தோடு
  rationale: இங்கு ஒழுக்கத் தீமையைக் காட்டாமல், துன்பம், துயரம் அல்லது வேதனையான நிலையைக் குறிக்கிறது.
- source_word: שְׁאֹלָה
  choice: பாதாளத்திற்கு
  rationale: இறந்தோரின் உலகம்/உறைவிடம் என்ற பழைய ஏற்பாட்டு கருத்தைத் தமிழில் வழக்கமான ‘பாதாளம்’ மூலம் தருகிறது; அதை வெறும் கல்லறையாகக் குறுக்கவில்லை.
theological_decisions:
- issue: שְׁאוֹל என்பதன் மொழிபெயர்ப்பு
  choice: பாதாளம்
  alternative: கல்லறை; இறந்தோரின் உலகம்
  rationale: மூலச் சொல் ஒரு புதைகுழியை மட்டும் குறிப்பதில்லை; அதேவேளை பின்னாளைய நரகக் கோட்பாட்டை இதற்குள் புகுத்தக் கூடாது. ‘பாதாளம்’ அந்தப் பழைய ஏற்பாட்டு தெளிவின்மையைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், குடும்பத் துயரத்தின் உணர்ச்சி வலிமையையும் எபிரேய உருவகமான ‘நரைத்த தலை’ என்பதையும் பேணும் கண்ணியமான நடை.
