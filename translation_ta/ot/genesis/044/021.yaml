revisions:
- from: அப்போது நீர் உமது பணியாளர்களிடம், “அவனை என்னிடம் கீழே அழைத்து வாருங்கள்; நான் அவன்மேல் என் கண்ணை வைப்பேன்[a]” என்று சொன்னீர்.
  to: அப்போது நீர் உமது பணியாளர்களிடம், “அவனை கீழே என்னிடம் கொண்டு வாருங்கள்; நான் அவன்மீது என் பார்வையைச் செலுத்துவேன்[a]” என்று சொன்னீர்.
  rationale: 'The revision retains every component of the Hebrew: sequential narration, servants, descent to Joseph, and the purpose of setting his eye upon the brother. It improves Tamil syntax and avoids assigning the Hebrew idiom the narrower sense of surveillance or guardianship. The footnote preserves both the literal Hebrew image and the viable alternative reading.'
