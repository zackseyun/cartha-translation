review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the narrative sequence, Joseph's respectful second-person address, the plural causative imperative to bring the younger brother down, and the purpose clause. However, the placement of கீழே after என்னிடம் is awkward in Tamil, and கண்ணை வைப்பேன் can more readily suggest keeping watch than the Hebrew idiom's deliberately open sense of seeing/inspection/attention.
  naturalness: A small revision improves idiomatic modern standard Tamil while retaining the source's directional and figurative wording. கீழே என்னிடம் கொண்டு வாருங்கள் is clearer, and பார்வையைச் செலுத்துவேன் is natural without forcing a single interpretation of the Hebrew idiom.
  terminology: பணியாளர்கள் is suitable for עבדים in this courtly context. The respectful singular நீர் / உமது / சொன்னீர் appropriately reflects Judah's address to Joseph. No theological terminology is at issue.
  issues:
  - severity: low
    issue: Word order in the command is awkward.
    rationale: என்னிடம் கீழே அழைத்து வாருங்கள் can momentarily make கீழே modify என்னிடம். Placing கீழே before என்னிடம் and using கொண்டு வாருங்கள் yields a clearer rendering of הורידוהו אלי.
  - severity: medium
    issue: கண்ணை வைப்பேன் is potentially misleading as the main rendering.
    rationale: Although structurally close to the Hebrew, this Tamil wording often conveys watching or guarding someone. The Hebrew idiom permits seeing, inspection, or special attention; அவன்மீது என் பார்வையைச் செலுத்துவேன் preserves this breadth more naturally, with the literal imagery documented in the footnote.
  revised_text: அப்போது நீர் உமது பணியாளர்களிடம், “அவனை கீழே என்னிடம் கொண்டு வாருங்கள்; நான் அவன்மீது என் பார்வையைச் செலுத்துவேன்[a]” என்று சொன்னீர்.
