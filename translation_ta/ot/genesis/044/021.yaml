translation_notes:
  register: நவீனத் தரத் தமிழில், யூதா யோசேப்பிடம் பேசும் அரசவைச் சூழலுக்கேற்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. எபிரேய மரபுத்தொடரின் உண்மையான பொருள் விரிவைச் சுருக்காமல் அதன் உருவகம் முதன்மை உரையில் வைக்கப்பட்டு, இயல்பான மாற்றுவாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
