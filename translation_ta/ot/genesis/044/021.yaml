base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/021.yaml
  text: Then you said to your servants[a], ‘Bring him down to me, that I may set my eyes on him.’
translation:
  language: ta
  text: அப்போது நீர் உமது பணியாளர்களிடம், “அவனை கீழே என்னிடம் கொண்டு வாருங்கள்; நான் அவன்மீது என் பார்வையைச் செலுத்துவேன்[a]” என்று சொன்னீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் அவனைப் பார்ப்பேன்.” எபிரேய மரபுத்தொடர் சொல்லுக்குச் சொல், “அவன்மேல் என் கண்ணை வைப்பேன்” என்கிறது; இது அவனைப் பார்ப்பது, ஆராய்வது, அல்லது அவனுக்குச் சிறப்புக் கவனம் செலுத்துவது ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: அப்போது ... சொன்னீர்
  rationale: தொடர்நிகழ்வைக் குறிக்கும் wayyiqtol வடிவின் வரிசைத் தன்மையை இயல்பான தமிழில் ‘அப்போது’ எனக் காட்டி, யோசேப்பை நேரடியாக மரியாதையுடன் விளிக்கும் ஒருமையையும் காக்கிறது.
- source_word: עֲבָדֶיךָ
  choice: உமது பணியாளர்களிடம்
  rationale: עבד என்பதற்கு ‘அடிமை’ என்ற பொருளும் உண்டு; ஆனால் இங்கு அரசவைச் சூழலில் யோசேப்புக்குக் கீழ்ப்பட்டவர்களைக் குறிக்கும் உறவுநிலை முன்னிலையில் இருப்பதால் ‘பணியாளர்கள்’ பொருத்தமானது.
- source_word: הוֹרִדֻהוּ
  choice: அவனை ... கீழே அழைத்து வாருங்கள்
  rationale: ירד என்பதன் Hiphil பன்மை ஏவல் வடிவையும், எகிப்துக்குச் செல்வதை இறங்கிச் செல்வதாகக் கூறும் ஆதியாகமத்தின் திசைநுட்பத்தையும் காக்கிறது.
- source_word: אֵלָי
  choice: என்னிடம்
  rationale: யோசேப்பை நோக்கிய இயக்கத்தை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְאָשִׂימָה עֵינִי עָלָיו
  choice: நான் அவன்மேல் என் கண்ணை வைப்பேன்
  rationale: ‘அவன்மேல் என் கண்ணை வைப்பேன்’ என்ற எபிரேய உருவகத்தைத் தக்கவைக்கிறது. இது அவனைப் பார்ப்பது, ஆராய்வது, அல்லது அவனுக்குச் சிறப்புக் கவனம் செலுத்துவது ஆகிய நிழற்பொருள்களைக் கொண்டிருக்கலாம்; ‘அவனைப் பார்த்துக்கொள்வேன்’ என்று மட்டும் மொழிபெயர்த்தால் கவனித்துப் பாதுகாப்பதாகப் பொருளை அளவுக்கு மீறி முடிவுசெய்துவிடும்.
