  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֲדֹנִ֣/י שָׁאַ֔ל אֶת עֲבָדָ֖י/ו לֵ/אמֹ֑ר הֲ/יֵשׁ לָ/כֶ֥ם אָ֖ב אוֹ אָֽח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/019.yaml
  text: My lord asked his servants, saying, ‘Do you have a father or a brother?’
translation:
  language: ta
  text: “என் ஆண்டவரே, ‘உங்களுக்கு ஒரு தந்தையோ சகோதரனோ இருக்கிறாரா?’ என்று தங்கள் ஊழியர்களிடம் கேட்டீர்கள்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: என் ஆண்டவரே
  rationale: எகிப்திய ஆட்சியாளரிடம் பேசும் மரியாதையும் பணிவும் நிறைந்த நேரடி அழைப்பைத் தக்கவைக்கிறது.
- source_word: שָׁאַל
  choice: கேட்டீர்கள்
  rationale: நேரடிக் கேள்வியின் சூழலில் இயல்பான நவீனத் தமிழ் வினைச்சொல்; எபிரெய வினையின் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: עֲבָדָיו
  choice: தங்கள் ஊழியர்களிடம்
  rationale: சகோதரர்கள் ஆட்சியாளருக்கு முன் தங்களைப் பணிவுடன் குறிப்பிடும் அரசவை வழக்கை வெளிப்படுத்துகிறது; இச்சூழலில் ‘அடிமைகள்’ என மிகைப்படுத்துவதைத் தவிர்க்கிறது. மூன்றாம் நபர் வடிவம் தமிழின் மரியாதைமிக்க நேரடி உரையில் இயல்பாக ‘தங்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: לֵאמֹר
  choice: என்று
  rationale: தொடர்ந்து வரும் நேரடிக் கூற்றை அறிமுகப்படுத்த தமிழில் இயல்பான உருபு; தனியாக ‘சொல்லி’ என மொழிபெயர்ப்பது தேவையற்ற கடினத்தன்மையை உண்டாக்கும்.
- source_word: הֲיֵשׁ לָכֶם
  choice: உங்களுக்கு ... இருக்கிறாரா?
  rationale: உடைமை அல்லது இருப்பைக் கேட்கும் எபிரெய அமைப்பை மனிதர்களைக் குறிக்கும் இயல்பான தமிழ் கேள்வியாக வழங்குகிறது.
- source_word: אָב
  choice: ஒரு தந்தை
  rationale: குடும்பத்தில் அத்தகைய ஒருவர் இருக்கிறாரா என்ற வரையறையற்ற ஒருமைக் கேள்வியைப் பாதுகாக்கிறது.
- source_word: אָח
  choice: சகோதரன்
  rationale: எபிரெய ஒருமையைத் தக்கவைக்கிறது; தமிழில் ‘ஒரு’ என்பது இணைந்த ‘தந்தையோ ... சகோதரனோ’ அமைப்பில் இரண்டிற்கும் இயல்பாகப் பொருந்துகிறது.
