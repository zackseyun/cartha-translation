  register: நவீன நிலையான தமிழில், யூதா யோசேப்பிடம் பேசும் மரியாதைமிக்க அரசவைப் பாணி காக்கப்பட்டுள்ளது. ‘என் ஆண்டவரே’ என்ற அழைப்பும் ‘தங்கள்/கேட்டீர்கள்’ என்ற உயர்வு ஒருமை வடிவங்களும் இயல்பான பணிவை வெளிப்படுத்துகின்றன.
