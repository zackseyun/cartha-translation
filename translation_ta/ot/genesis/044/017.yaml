base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/017.yaml
  text: But he said[a], "Far be it from me to do this. The man in whose hand the cup was found—he shall be my servant[b], but you may go up in peace to your father."
translation:
  language: ta
  text: அவன், “நான் இப்படிச் செய்வது அறவே கூடாது! யாருடைய கையில் அந்தக் கோப்பை கண்டுபிடிக்கப்பட்டதோ, அவனே எனக்கு அடிமையாக இருப்பான்.[a] நீங்களோ உங்கள் தந்தையிடம் நலமுடன் செல்லுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் ‘பணியாளர்’ அல்லது ‘அடிமை’ என்று பொருள்படலாம்; இங்கு தண்டனையாக விதிக்கப்படும் கட்டாயப் பிணைப்பைக் குறிப்பதால் ‘அடிமை’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: நான் … நினைத்துக்கூட பார்க்க முடியாது
  rationale: கடுமையான மறுப்பையும் அருவருப்பையும் வெளிப்படுத்தும் எபிரெய மரபுத்தொடரை, நவீன தமிழில் இயல்பாகவும் வலிமையாகவும் தருகிறது.
- source_word: מֵעֲשׂוֹת זֹאת
  choice: இப்படிச் செய்வதை
  rationale: மறுக்கப்படும் செயலை நேரடியாகவும் இயல்பாகவும் குறிப்பிடுகிறது.
- source_word: הָאִישׁ אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: யாருடைய கையில் அந்தக் கோப்பை கண்டுபிடிக்கப்பட்டதோ
  rationale: ‘கையில்’ என்ற மூலமொழியின் தெளிவான உருவகத்தைத் தக்கவைத்து, தமிழில் இயல்பான தொடர்புத் தொடராக அமைக்கிறது.
- source_word: הוּא יִהְיֶה לִּי עָבֶד
  choice: அவனே எனக்கு அடிமையாக இருப்பான்
  rationale: הוּא என்பதன் எதிர்மறை வலியுறுத்தலை ‘அவனே’ தக்கவைக்கிறது. தண்டனையாக விதிக்கப்படும் கட்டாயப் பிணைப்பை இச்சூழலில் ‘அடிமை’ தெளிவாகக் காட்டுகிறது; சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְאַתֶּם עֲלוּ
  choice: நீங்களோ … செல்லுங்கள்
  rationale: தண்டிக்கப்படுபவனுக்கும் விடுவிக்கப்படும் மற்ற சகோதரர்களுக்கும் உள்ள முரண்பாட்டை ‘நீங்களோ’ காட்டுகிறது. பயணத்தின் புவியியல் திசையைச் சொற்சொல்லாக ‘மேலே செல்லுங்கள்’ என்று கூறுவது தமிழில் இயல்பற்றதால் பொதுவான இயக்கவினை பயன்படுத்தப்படுகிறது.
- source_word: לְשָׁלוֹם
  choice: நலமுடன்
  rationale: தீங்கின்றி பாதுகாப்பாகச் செல்ல அனுமதிக்கப்படுவதைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: אֶל אֲבִיכֶם
  choice: உங்கள் தந்தையிடம்
  rationale: இலக்கை நேரடியாகவும் தெளிவாகவும் மொழிபெயர்க்கிறது.
