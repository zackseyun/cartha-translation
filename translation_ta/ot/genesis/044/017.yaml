  rationale: The revision renders the opening Hebrew idiom as a forceful repudiation rather than a statement of psychological inability, removes an added connective, and corrects the lexical alternative in the footnote. It otherwise preserves the draft’s faithful contrast, concrete ‘in whose hand’ construction, and natural modern Tamil register.
