translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கதையின் அதிகாரபூர்வமான உரையாடல் தொனியைத் தக்கவைக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கையில்’ என்ற மூலமொழியின் concrete expression பாதுகாக்கப்பட்டுள்ளது; ‘நலமுடன்’ என்பது சமயவழக்கில் மட்டும் ஒலிக்கக்கூடிய ‘சமாதானத்துடன்’ என்பதைக் காட்டிலும் இச்சூழலில் இயல்பானது.
