- from: அதற்கு அவன், “நான் இப்படிச் செய்வதை நினைத்துக்கூட பார்க்க முடியாது! யாருடைய கையில் அந்தக் கோப்பை கண்டுபிடிக்கப்பட்டதோ, அவனே எனக்கு அடிமையாக இருப்பான்.[a] நீங்களோ உங்கள் தந்தையிடம் நலமுடன் செல்லுங்கள்” என்றான்.
