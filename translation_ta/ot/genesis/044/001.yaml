base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/001.yaml
  text: Then he commanded the one over his house[a], saying, “Fill the men's sacks with food, as much as they can carry, and put each man's silver in the mouth of his sack.”
translation:
  language: ta
  text: பின்பு அவன் தன் வீட்டின் பொறுப்பில் இருந்தவனுக்குக் கட்டளையிட்டு, “அந்த மனிதர்களின் சாக்குகளில் அவர்கள் சுமக்கக்கூடிய அளவுக்கு உணவை நிரப்பு; ஒவ்வொருவனுடைய வெள்ளியையும் அவனுடைய சாக்கின் வாயில்[a] வை” என்று கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “சாக்கின் வாயில்”; அதாவது, சாக்கின் திறப்பில்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: பின்பு அவன் ... கட்டளையிட்டு
  rationale: வழக்குரைத் தொடரை முன்னெடுக்கும் wayyiqtol வடிவத்தையும் צוה என்பதன் ‘கட்டளையிடு’ என்ற பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר עַל בֵּיתוֹ
  choice: தன் வீட்டை மேற்பார்வையிட்டவன்
  rationale: ‘தன் வீட்டின்மேல் இருந்தவன்’ என்ற எபிரேயச் சொற்றொடர் வீட்டின் நிர்வாகப் பொறுப்பில் இருந்த அதிகாரியைக் குறிக்கிறது. ‘மேற்பார்வையிட்டவன்’ என்பது ‘பணிப்பொறுப்பாளர்’ போன்ற குறிப்பிட்ட பதவிப்பெயரைத் திணிக்காமல் பொருளைத் தெளிவாக்குகிறது.
- source_word: מַלֵּא
  choice: நிரப்பு
  rationale: מלא வினையின் கட்டளை வடிவத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: אַמְתְּחֹת
  choice: சாக்குகள்
  rationale: பயணத்தில் தானியமோ உணவுப்பொருள்களோ எடுத்துச் செல்லப் பயன்படும் பெரிய பைகளைக் குறிக்கும் பழங்காலச் சூழலுக்கு ‘சாக்குகள்’ பொருத்தமானது.
- source_word: הָאֲנָשִׁים
  choice: அந்த மனிதர்களின்
  rationale: மூலத்தில் உள்ள ‘மனிதர்கள்’ என்ற குறிப்பைத் தக்கவைக்கிறது; சூழலை அடிப்படையாகக் கொண்டு ‘சகோதரர்கள்’ என்று மாற்றவில்லை.
- source_word: אֹכֶל
  choice: உணவு
  rationale: אֹכֶל என்பது பொதுவாக உணவைக் குறிக்கிறது. சூழலில் தானியம் இருந்தாலும், மூலச்சொல்லைவிடக் குறுகிய பொருளைத் திணிக்காமல் ‘உணவு’ என வழங்கப்படுகிறது.
- source_word: כַּאֲשֶׁר יוּכְלוּן שְׂאֵת
  choice: அவர்கள் சுமக்கக்கூடிய அளவுக்கு
  rationale: יכולת என்ற ஆற்றலையும் שׂאת என்ற சுமத்தல்/சுமத்திச் செல்லுதல் கருத்தையும் தெளிவான நவீனத் தமிழில் ஒருங்கிணைக்கிறது.
- source_word: כֶּסֶף אִישׁ
  choice: ஒவ்வொருவனுடைய வெள்ளி
  rationale: אישׁ என்பதன் பகிர்ந்தளிக்கும் பொருளை ‘ஒவ்வொருவனுடைய’ என்றும் כסף என்பதன் நேரடிப் பொருளை ‘வெள்ளி’ என்றும் தக்கவைக்கிறது; ‘பணம்’ என்று விளக்கமாக்கவில்லை.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: அவனுடைய சாக்கின் வாயில்
  rationale: ‘சாக்கின் வாய்’ என்ற எபிரேய உருவகத்தைத் தமிழிலும் புரிந்துகொள்ளக்கூடிய வகையில் தக்கவைக்கிறது; அதன் பொருள் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
