  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘வீட்டின்மேல் இருந்தவன்’ என்ற நிர்வாகக் கருத்து இயல்பாக ‘வீட்டை மேற்பார்வையிட்டவன்’ என வழங்கப்பட்டுள்ளது. ‘வெள்ளி’ மற்றும் ‘சாக்கின் வாய்’ ஆகிய மூல உருவாக்கங்கள் தக்கவைக்கப்பட்டுள்ளன; அடிக்குறிப்பு குறியீடு அதற்குரிய சொற்றொடரிலேயே வைக்கப்பட்டுள்ளது.
