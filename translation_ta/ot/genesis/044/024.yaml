    text: 'அல்லது, ‘என் தந்தையான உமது பணியாளரிடம்.’ எபிரெயச் சொல்வரிசை: ‘உமது பணியாளரிடம், என் தந்தையிடம்.’'
    reason: lexical_alternative
  revision_rationale: The revision replaces the interpretive ‘திரும்பிச் சென்றபோது’ with ‘மேலே சென்றபோது’ to preserve the Hebrew ascent verb, while retaining natural modern Tamil, Judah’s deferential speech, and the supplied lexical alternative.
