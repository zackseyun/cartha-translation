  yaml_path: translation/ot/genesis/044/024.yaml
  text: And when we went up to your servant my father[a], we told him the words of my lord.
translation:
  language: ta
  text: நாங்கள் உமது பணியாளரான என் தந்தையிடம்[a] மேலே சென்றபோது, என் ஆண்டவனின் வார்த்தைகளை அவரிடம் தெரிவித்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, ‘என் தந்தையான உமது பணியாளரிடம்.’ எபிரெயச் சொல்வரிசை: ‘உமது பணியாளரிடம், என் தந்தையிடம்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: சென்றபோது
  rationale: எபிரெயக் கதைத் தொடரின் நிகழ்வுமாற்றத்தைத் தமிழில் இயல்பான காலத் துணைவாக்கியமாக வெளிப்படுத்துகிறது; ‘அப்போது நிகழ்ந்ததாவது’ என்பது இங்கு தேவையற்ற கடினநடையாக இருக்கும்.
- source_word: עָלִינוּ
  choice: திரும்பிச் சென்றோம்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்லுதல்’. இங்கு எகிப்திலிருந்து கானானுக்குச் சென்றதைக் குறிக்கிறது; தமிழில் ‘மேலே சென்றோம்’ புவியியல் நோக்கத்தைத் தெளிவாகச் சொல்லாது என்பதால் சூழலுக்கேற்ற ‘திரும்பிச் சென்றோம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶל
  choice: இடம்
  rationale: இலக்கைச் சுட்டும் எபிரெய முன்னிடைச்சொல் தமிழில் ‘அவரிடம்’ என்ற இயல்பான வடிவில் தரப்பட்டுள்ளது.
- source_word: עַבְדְּךָ אָבִי
  choice: உமது பணியாளராகிய என் தந்தை
  rationale: யூதா யோசேப்பிடம் காட்டும் பணிவையும் ‘என் தந்தை’ என்ற உறவையும் காக்கிறது. எபிரெயச் சொல்வரிசையும் பெருமளவில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַנַּגֶּד
  choice: தெரிவித்தோம்
  rationale: Hiphil வடிவிலுள்ள נגד என்பதன் ‘அறியச் செய்தல், தெரிவித்தல்’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לוֹ
  choice: அவரிடம்
  rationale: செய்தி தெரிவிக்கப்படும் நபரைத் தமிழில் இயல்பான வேற்றுமை வடிவில் குறிக்கிறது.
- source_word: אֵת דִּבְרֵי
  choice: வார்த்தைகளை
  rationale: ‘செய்தி’ அல்லது ‘சொன்னதை’ என்று விளக்கமாக்காமல், דִּבְרֵי என்பதன் வெளிப்படையான ‘வார்த்தைகள்’ என்ற வடிவைத் தக்கவைக்கிறது.
- source_word: אֲדֹנִי
  choice: என் ஆண்டவன்
  rationale: இது இறைப் பெயர் அல்ல; யோசேப்புக்கான மரியாதைத் தலைப்பு. ‘என் ஆண்டவன்’ பணிவான அழைப்பின் வெளிப்படையான வடிவைப் பாதுகாக்கிறது.
