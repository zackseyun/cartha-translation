revisions:
- from: நாங்கள் உமது பணியாளராகிய என் தந்தையிடம்[a] திரும்பிச் சென்றபோது, என் ஆண்டவனின் வார்த்தைகளை அவரிடம் தெரிவித்தோம்.
  to: நாங்கள் உமது பணியாளரான என் தந்தையிடம்[a] மேலே சென்றபோது, என் ஆண்டவனின் வார்த்தைகளை அவரிடம் தெரிவித்தோம்.
  rationale: The revision replaces the interpretive ‘திரும்பிச் சென்றபோது’ with ‘மேலே சென்றபோது’ to preserve the Hebrew ascent verb, while retaining natural modern Tamil, Judah’s deferential speech, and the supplied lexical alternative.
