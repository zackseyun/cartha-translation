  edition: WLC
  text: הֲ/ל֣וֹא זֶ֗ה אֲשֶׁ֨ר יִשְׁתֶּ֤ה אֲדֹנִ/י֙ בּ֔/וֹ וְ/ה֕וּא נַחֵ֥שׁ יְנַחֵ֖שׁ בּ֑/וֹ הֲרֵעֹתֶ֖ם אֲשֶׁ֥ר עֲשִׂיתֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/005.yaml
  text: Is this not the one from which my master drinks and by which he indeed practices divination? You have done evil in doing this[a][b].
translation:
  language: ta
  text: ‘என் எஜமான் குடிப்பது இதிலிருந்துதானே? இதை வைத்துத்தான் அவர் குறிபார்க்கிறார் அல்லவா? இதைச் செய்து நீங்கள் தீமை செய்துவிட்டீர்கள்[a][b]’ என்று சொல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதை வைத்தே அவர் நிச்சயமாகக் குறிபார்ப்பார்.” எபிரேயத்தில் வலியுறுத்தலுக்காக வினையின் முடிவுறா வடிவம் வினைமுற்றுடன் சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, “நீங்கள் செய்ததில் தீமை செய்தீர்கள்.”
    reason: previous_rendering
lexical_decisions:
- source_word: הֲלוֹא זֶה
  choice: இது ... தானே?
  rationale: ஒப்புதலை எதிர்பார்க்கும் எபிரேய வினாவை இயல்பான தமிழ் வினாவாகப் பாதுகாக்கிறது; ‘இது’ என்பது சூழலில் உள்ள பாத்திரத்தைக் குறிக்கிறது.
- source_word: אֲשֶׁר יִשְׁתֶּה אֲדֹנִי בּוֹ
  choice: என் எஜமான் குடிப்பது இதிலிருந்துதானே?
  rationale: בּוֹ என்பதன் பொருளை தமிழ் வழக்குக்கு ஏற்ற ‘இதிலிருந்து’ எனத் தருகிறது. אֲדֹנִי இங்கு பணியாளர் யோசேப்பைக் குறிப்பிடும் சமூகத் தலைப்பு என்பதால் ‘என் எஜமான்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְהוּא נַחֵשׁ יְנַחֵשׁ בּוֹ
  choice: இதை வைத்துத்தான் அவர் குறிபார்க்கிறார் அல்லவா?
  rationale: בּוֹ-வின் கருவிப் பொருளை ‘இதை வைத்து’ என்றும், infinitive absolute + finite verb தரும் வலியுறுத்தலை ‘தான்’ என்றும் வெளிப்படுத்துகிறது. נחש என்பதற்கு இச்சூழலில் புரியக்கூடிய ‘குறிபார்க்கிறார்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הֲרֵעֹתֶם
  choice: நீங்கள் தீமை செய்துவிட்டீர்கள்
  rationale: Hiphil வடிவின் ஒழுக்கத் தீவிரத்தை ‘தவறு’ என்று மெலிதாக்காமல் ‘தீமை செய்தீர்கள்’ எனப் பாதுகாக்கிறது; நிறைவுற்ற செயலை ‘செய்துவிட்டீர்கள்’ வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר עֲשִׂיתֶם
  choice: இதைச் செய்து
  rationale: எபிரேய உறவுச் சொற்றொடரின் செயலைச் சுட்டும் பங்கை இயல்பான தமிழில் தருகிறது; சொற்சொல்லான மீளுரையைத் தவிர்க்கிறது.
theological_decisions:
- issue: யோசேப்பு உண்மையில் குறிபார்த்தாரா, அல்லது வேடம்/சோதனையின் ஒரு பகுதியாக மட்டுமே அப்படிச் சொல்லப்பட்டதா?
  choice: பணியாளனின் உரைக்குள் உள்ள கூற்றை நேரடியாக, ‘அவர் குறிபார்க்கிறார்’ என மொழிபெயர்த்தல்
  alternative: ‘அவர் இதனால் குறி அறியக்கூடும்’ என்று தூரப்படுத்துதல் அல்லது இது வெறும் தோற்றம் என மென்மைப்படுத்துதல்
  rationale: எபிரேய உரை பணியாளனின் பேச்சில் குறிபார்த்தலை நேரடியாகக் கூறுகிறது. யோசேப்பின் உண்மையான நடைமுறை அல்லது நோக்கம் பற்றிய இறையியல் முடிவை மொழிபெயர்ப்பு திணிக்காமல், உரையிலுள்ள பதற்றத்தை அப்படியே விடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘எஜமான்’ என்பது இங்கு மனித அதிகாரியைக் குறிக்கிறது; ‘குறிபார்த்தல்’ பழங்கால divination நடைமுறையை பொதுவாசகர் புரியும் வகையில் தருகிறது. மேற்கோள் அமைப்பு, முந்தைய வசனத்தில் உள்ள ‘என்று சொல்’ என்ற கட்டளையை இவ்வசனம் நிறைவு செய்கிறது.
