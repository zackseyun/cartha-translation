  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான குடும்பச் சொல்லாட்சி பயன்படுத்தப்பட்டது. ‘என் ஆண்டவர்’ என்பது மரியாதையையும் அதிகார உறவையும் காக்கிறது; எபிரெய மரபுத்தொடர்களின் நெருக்கமான வடிவங்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
