base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/020.yaml
  text: And we said to my lord[a], ‘We have an elderly father, and a young son born in his old age. His brother is dead, so he alone is left of his mother[c][b], and his father loves him.’
translation:
  language: ta
  text: நாங்கள் எங்கள் ஆண்டவரிடம், ‘எங்களுக்கு வயதான ஒரு தந்தை இருக்கிறார்; அவருடைய முதிர்வயதில் பிறந்த ஓர் இளம் மகனும் இருக்கிறான்.[a] அவனுடைய சகோதரன் இறந்துவிட்டான். தன் தாயின் மகன்களில் அவன் மட்டுமே எஞ்சியிருக்கிறான்;[b] அவனுடைய தந்தை அவனை நேசிக்கிறார்’ என்று சொன்னோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “முதிர்வயதின் பிள்ளை”; அதாவது, தந்தை முதிர்ந்த வயதில் பிறந்த பிள்ளை.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “அவனுடைய தாய்க்கு அவன் மட்டுமே எஞ்சியிருக்கிறான்.” அதாவது, தன் தாயின் மகன்களில் எஞ்சியிருப்பவன் இவன் மட்டுமே.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: என் ஆண்டவர்
  rationale: யோசேப்பை உயரதிகாரியாக மதித்து அழைக்கும் சொல்லாகும்; சமூகப் படிநிலையையும் மூலத்தின் தொடர்ச்சியான அழைப்புமுறையையும் காக்கிறது.
- source_word: זָקֵן
  choice: வயதான
  rationale: தந்தையின் முதிர்ந்த வயதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יֶלֶד זְקֻנִים קָטָן
  choice: அவருடைய முதிர்வயதில் பிறந்த ஓர் இளம் மகன்
  rationale: ‘முதிர்வயதின் பிள்ளை’ என்ற எபிரெய மரபுத்தொடரின் பொருளையும், קָטָן குறிக்கும் இளமையையும் தெளிவாக இணைக்கிறது.
- source_word: וְאָחִיו מֵת
  choice: அவனுடைய சகோதரன் இறந்துவிட்டான்
  rationale: மரணத்தின் தற்போதைய விளைவைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: וַיִּוָּתֵר הוּא לְבַדּוֹ לְאִמּוֹ
  choice: தன் தாயின் மகன்களில் அவன் மட்டுமே எஞ்சியிருக்கிறான்
  rationale: தாய்க்குரிய மகன்களில் இவனே மீதியாக இருப்பதை இயல்பாகவும் தெளிவாகவும் சொல்கிறது; நெருக்கமான சொற்சார் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְאָבִיו אֲהֵבוֹ
  choice: அவனுடைய தந்தை அவனை நேசிக்கிறார்
  rationale: אהב என்பதன் நேரடியான பொருளையும் தந்தையின் தனிப்பட்ட அன்பையும் காக்கிறது.
