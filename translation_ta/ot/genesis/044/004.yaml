  text: הֵ֠ם יָֽצְא֣וּ אֶת הָ/עִיר֮ לֹ֣א הִרְחִיקוּ֒ וְ/יוֹסֵ֤ף אָמַר֙ לַֽ/אֲשֶׁ֣ר עַל בֵּית֔/וֹ ק֥וּם רְדֹ֖ף אַחֲרֵ֣י הָֽ/אֲנָשִׁ֑ים וְ/הִשַּׂגְתָּ/ם֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם לָ֛/מָּה שִׁלַּמְתֶּ֥ם רָעָ֖ה תַּ֥חַת טוֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/004.yaml
  text: They had gone out of the city; they had not gone far[a], when Joseph said to the one over his house, “Get up, pursue the men, and when you overtake them, say to them, ‘Why have you repaid evil for good?’”
translation:
  language: ta
  text: அவர்கள் நகரத்தைவிட்டு வெளியேறி இன்னும் வெகுதூரம் போகாதபோது, யோசேப்பு தன் வீட்டுப் பொறுப்பாளரிடம்[a], “எழுந்து, அந்த மனிதர்களைத் துரத்திச் செல். நீ அவர்களை எட்டிப்பிடித்ததும், அவர்களிடம், ‘நன்மைக்குத் தீமையை ஏன் கைம்மாறாகச் செய்தீர்கள்?’ என்று கேள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லுக்குச் சொல், “தன் வீட்டின்மேல் உள்ளவனிடம்”; அதாவது, வீட்டை நிர்வகித்த பொறுப்பாளரிடம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצְאוּ אֶת הָעִיר
  choice: நகரத்தைவிட்டு வெளியேறி
  rationale: יָצָא என்பதன் ‘வெளியேறு’ என்ற பொருளையும், நகரத்திலிருந்து புறப்பட்டதைச் சுட்டும் எபிரேய வழக்கையும் இயல்பான தமிழில் தருகிறது.
- source_word: לֹא הִרְחִיקוּ
  choice: இன்னும் வெகுதூரம் போகாதபோது
  rationale: רחק என்பதன் ஹிஃபில் வடிவம் இங்கு தொலைவாகச் செல்லுதலைக் குறிக்கிறது; அடுத்த நிகழ்வுடன் உள்ள காலத் தொடர்பையும் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: לַאֲשֶׁר עַל בֵּיתוֹ
  choice: தன் வீட்டுப் பொறுப்பாளரிடம்
  rationale: சொல்லுக்குச் சொல் ‘தன் வீட்டின்மேல் இருந்தவனிடம்’; சூழலில் வீட்டை நிர்வகிக்கும் அதிகாரியை இயல்பாகக் குறிக்க ‘வீட்டுப் பொறுப்பாளர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: קוּם רְדֹף אַחֲרֵי
  choice: எழுந்து, ... துரத்திச் செல்
  rationale: קוּם கட்டளையின் அவசரச் செயலூக்கத்தையும், רדף אחרי என்பதன் பின்தொடர்ந்து துரத்தும் பொருளையும் காக்கிறது.
- source_word: הָאֲנָשִׁים
  choice: அந்த மனிதர்களை
  rationale: குறிப்பிட்ட ஆண்களைக் குறிக்கும் எபிரேயப் பன்மையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְהִשַּׂגְתָּם
  choice: நீ அவர்களை எட்டிப்பிடித்ததும்
  rationale: נשׂג என்பதன் ஹிஃபில் வடிவம் ‘எட்டுதல்/முந்திப் பிடித்தல்’ என்று பொருள்படும்; தொடர்ச்சியான கட்டளை அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: שִׁלַּמְתֶּם רָעָה תַּחַת טוֹבָה
  choice: நன்மைக்குப் பதிலாக ஏன் தீமை செய்தீர்கள்?
  rationale: שלם என்பதன் பதில்செய்தல் அல்லது கைம்மாறு செய்தல் என்ற கருத்தையும், רעה/טובה என்ற அறநெறி எதிர்மறையையும் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
