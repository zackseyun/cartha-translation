  register: நவீன பொதுத்தமிழில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இறங்கிப் போதல்’ மற்றும் ‘முகத்தைப் பார்த்தல்’ ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டு, இரண்டாவதன் மரபுத்தொடர் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
