  source_fidelity: 'மூல எபிரெய வாக்கியத்தின் கூறுகள் அனைத்தும் துல்லியமாக உள்ளன: முந்தைய பதிலை அறிமுகப்படுத்தும் எதிர்நிலைத் தொடர்பு, எகிப்துக்கு ‘இறங்கிப் போதல்,’ இளைய சகோதரன் உடனிருப்பதற்கான நிபந்தனை, அதனைத் தொடர்ந்து செல்லும் விளைவு, மற்றும் அவன் இல்லாதபோது அந்த மனிதனின் முகத்தைக் காண இயலாமை ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ‘இல்லாமல்’ என்பது இறுதிக் கூற்றின் நிபந்தனைப் பொருளை இயல்பாகத் தருகிறது.'
