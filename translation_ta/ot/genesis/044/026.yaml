base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/026.yaml
  text: But we said[a], ‘We cannot go down. If our youngest brother is with us, then we will go down[c][b], for we cannot see the man's face unless our youngest brother is with us.’
translation:
  language: ta
  text: ஆனால் நாங்கள், “எங்களால் இறங்கிப் போக முடியாது. எங்கள் இளைய சகோதரன் எங்களுடன் இருந்தால், நாங்கள் இறங்கிப் போவோம். ஏனெனில், எங்கள் இளைய சகோதரன் எங்களுடன் இல்லாமல் அந்த மனிதனின் முகத்தை எங்களால் பார்க்க முடியாது[a]” என்றோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படி, “அந்த மனிதனின் முகத்தைப் பார்க்க.” இது அவன் முன்னிலையில் வருவது அல்லது அவனை நேரில் சந்திப்பது என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: ஆனால் நாங்கள் … என்றோம்
  rationale: வாவ் தொடர் கதையை முன்னெடுத்தாலும், முந்தைய கோரிக்கைக்கு யூதா கூறிய எதிர்மறையான பதிலை நினைவுகூரும் இச்சூழலில் ‘ஆனால்’ இயல்பான மென்மையான முரண்பாட்டைக் காட்டுகிறது.
- source_word: לֹא נוּכַל לָרֶדֶת
  choice: எங்களால் இறங்கிப் போக முடியாது
  rationale: יכל இயலாமையைக் குறிக்கிறது. எகிப்தை நோக்கிய பயணத்தை ירד ‘இறங்குதல்’ எனக் கூறுவதால், மூலத்தின் திசைச்சொல் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אִם יֵשׁ אָחִינוּ הַקָּטֹן אִתָּנוּ
  choice: எங்கள் இளைய சகோதரன் எங்களுடன் இருந்தால்
  rationale: நிபந்தனை வாக்கியம் மூலத்தில் நேர்மறையாக அமைந்துள்ளது. குடும்பச் சூழலில் הַקָּטֹן என்பது உடலளவில் சிறியவன் என்பதல்ல, சகோதரர்களில் இளையவன் என்பதைக் குறிக்கிறது.
- source_word: וְיָרַדְנוּ
  choice: நாங்கள் இறங்கிப் போவோம்
  rationale: முந்தைய நிபந்தனையின் விளைவைத் தனி வாக்கியமாகச் சொல்லி, எபிரெய உரையின் இரண்டு படிநிலைக் கட்டமைப்பும் இயல்பான தமிழும் பாதுகாக்கப்படுகின்றன.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அவர்கள் ஏன் செல்ல இயலாது என்பதற்கான காரணத்தை இச்சொல் அறிமுகப்படுத்துகிறது.
- source_word: לִרְאוֹת פְּנֵי הָאִישׁ
  choice: அந்த மனிதனின் முகத்தை … பார்க்க
  rationale: ‘அந்த மனிதனின் முகத்தைப் பார்க்க’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; இச்சொற்றொடர் அவன் முன்னிலையில் வருதல் அல்லது அவனை நேரில் சந்தித்தல் என்ற வழக்குப் பொருளையும் கொண்டுள்ளது.
- source_word: וְאָחִינוּ הַקָּטֹן אֵינֶנּוּ אִתָּנוּ
  choice: எங்கள் இளைய சகோதரன் எங்களுடன் இல்லாமல்
  rationale: எபிரெயத்தில் இணைப்புச் சொல்லால் தொடரும் இக்கூற்று, சகோதரன் உடன் இல்லாத சூழ்நிலையில் அவர்களால் அந்த மனிதன் முன் வர முடியாது என்ற நிபந்தனைப் பொருளைத் தருகிறது; தமிழில் ‘இல்லாமல்’ அதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
