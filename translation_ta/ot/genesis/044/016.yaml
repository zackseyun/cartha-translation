  text: וַ/יֹּ֣אמֶר יְהוּדָ֗ה מַה נֹּאמַר֙ לַֽ/אדֹנִ֔/י מַה נְּדַבֵּ֖ר וּ/מַה נִּצְטַדָּ֑ק הָ/אֱלֹהִ֗ים מָצָא֙ אֶת עֲוֺ֣ן עֲבָדֶ֔י/ךָ הִנֶּ/נּ֤וּ עֲבָדִים֙ לַֽ/אדֹנִ֔/י גַּם אֲנַ֕חְנוּ גַּ֛ם אֲשֶׁר נִמְצָ֥א הַ/גָּבִ֖יעַ בְּ/יָדֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/016.yaml
  text: And Judah said[a], “What shall we say to my lord? What shall we speak? Or how shall we justify ourselves? God has found out the guilt of your servants. Here we are, my lord’s servants[c][b], both we and the one in whose hand the cup was found.”
translation:
  language: ta
  text: யூதா, “என் ஆண்டவரிடம் நாங்கள் என்ன சொல்வோம்? என்ன பேசுவோம்? அல்லது, எங்களை எப்படிக் குற்றமற்றவர்கள் என்று நிரூபிப்போம்?[a] கடவுள் உமது அடியார்களின் குற்றத்தைக் கண்டுபிடித்துவிட்டார்.[b] இதோ, நாங்களும் யாருடைய கையில் அந்தக் கிண்ணம் கண்டுபிடிக்கப்பட்டதோ அவனும் என் ஆண்டவரின் அடிமைகள்.[c]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களை எப்படிச் சரியானவர்கள் என்று காட்டிக்கொள்வோம்?” எபிரேய வினைச்சொல் தம்மைச் சரியானவர்கள் எனக் காட்டுதல் அல்லது தம்மை நியாயப்படுத்திக்கொள்ளுதல் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உமது அடியார்களின் அக்கிரமத்தை வெளிப்படுத்திவிட்டார்.” ‘குற்றம்’ என மொழிபெயர்க்கப்பட்ட எபிரேயச் சொல் அக்கிரமம், குற்றப்பொறுப்பு, அல்லது அதன் விளைவு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: முதலில் வரும் “அடியார்கள்” என்பது உயர்ந்தவரிடம் பணிவுடன் தம்மைக் குறிப்பிடும் வழக்கு; பின்னர் வரும் “அடிமைகள்” என்பது சகோதரர்கள் ஏற்றுக்கொள்ள முன்வரும் அடிமை நிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאדֹנִי
  choice: என் ஆண்டவரிடம் / என் ஆண்டவருக்கு
  rationale: இங்கு אָדוֹן என்பது அதிகார நிலையிலுள்ள யோசேப்பைக் குறிக்கும் மரியாதை விளிப்பு; இறைப்பட்டம் அல்ல. ‘என் ஆண்டவர்’ அரண்மனைச் சூழலின் பணிவான மொழியைத் தக்கவைக்கிறது.
- source_word: נֹאמַר / נְדַבֵּר
  choice: என்ன சொல்வோம்? என்ன பேசுவோம்?
  rationale: இரு நெருங்கிய வினைச்சொற்களையும் தனித்தனியாக மொழிபெயர்த்து, யூதாவின் தற்காப்பற்ற நிலையை வெளிப்படுத்தும் சொல்லடுக்கைப் பாதுகாக்கிறது.
- source_word: נִצְטַדָּק
  choice: எங்களை எப்படி நீதிமான்களாகக் காட்டிக்கொள்வோம்?
  rationale: צדק என்பதன் ஹித்பஅேல் வடிவம் தங்களைச் சரியானவர்கள் அல்லது குற்றமற்றவர்கள் எனக் காட்டுவதைச் சுட்டுகிறது. தமிழ் நடை இயல்பாக இருக்கவும், மூலத்தின் நீதிசார் பொருள் நிலைக்கவும் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: מָצָא אֶת עֲוֹן
  choice: குற்றத்தைக் கண்டுபிடித்துவிட்டார்
  rationale: மறைந்திருந்த குற்றப்பொறுப்பை கடவுள் வெளிச்சத்துக்குக் கொண்டுவந்தார் என்ற மூல மொழியின் உருவகத்தையும் நிகழ்ந்துவிட்ட செயல் உணர்வையும் தக்கவைக்கிறது.
- source_word: עֲבָדֶיךָ / עֲבָדִים
  choice: உமது அடியார்கள் / அடிமைகள்
  rationale: முதல் இடத்தில் עֶבֶד உயரதிகாரியிடம் பணிவுடன் தம்மைக் குறிப்பிடும் வழக்கு; இரண்டாவது இடத்தில் அவர்கள் ஏற்றுக்கொள்ளும் கட்டுப்பட்ட அடிமை நிலை நேரடியாகக் கூறப்படுகிறது. எனவே பொருள்சார் வேறுபாடு தமிழிலும் காட்டப்பட்டுள்ளது.
- source_word: הִנֶּנּוּ
  choice: இதோ, ... இருக்கிறோம்
  rationale: சரணடைந்து தங்களை ஒப்படைக்கும் முன்வைப்புத் தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: גַּם אֲנַחְנוּ גַּם אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: நாங்களும், யாருடைய கையில் அந்தக் கிண்ணம் கண்டுபிடிக்கப்பட்டதோ அவனும்
  rationale: இரட்டை גַּם குறிக்கும் இரு தரப்பினரின் உள்ளடக்கத்தையும், ‘கையில் கண்டுபிடிக்கப்பட்டது’ என்ற மூலத்தின் சட்டவிசாரணைச் சாயலையும் பாதுகாக்கிறது.
- source_word: הַגָּבִיעַ
  choice: அந்தக் கிண்ணம்
  rationale: குறிப்பிட்ட, முன்பே அறியப்பட்ட பாத்திரம் என்பதைக் ‘அந்த’ தெளிவாக்குகிறது; ‘கிண்ணம்’ இன்றைய தமிழில் இயல்பானது.
theological_decisions:
- issue: יְהוּדָה கூறும் הָאֱלֹהִים என்பதன் குறிப்பு
  choice: கடவுள் தாமே அவர்களுடைய மறைந்த குற்றத்தை வெளிப்படுத்தியதாக யூதா ஒப்புக்கொள்கிறான்.
  alternative: ஏதோ ஒரு தெய்வீக வல்லமை அவர்களுடைய தவறை வெளிப்படுத்தியது.
  rationale: ஆதியாகமக் கதையோட்டத்தில் இச்சொல் ஒரே கடவுளைக் குறிக்கிறது. இருப்பினும் ‘குற்றம்’ என்பது கிண்ணச் சம்பவத்தை மட்டுமா அல்லது சகோதரர்களின் முந்தைய குற்றப்பொறுப்பையும் உள்ளடக்குகிறதா என்பதை மொழிபெயர்ப்பு வரையறுக்காமல் விடுகிறது.
- issue: עָוֹן என்பதன் பொருள் பரப்பு
  choice: குற்றம்
  alternative: அக்கிரமம் / குற்றப்பொறுப்பு / குற்றத்திற்கான தண்டனை
  rationale: எபிரேயச் சொல் செயல், குற்றப்பொறுப்பு, அதன் விளைவு ஆகியவற்றைத் தாங்கக்கூடும். இங்கு ‘குற்றம்’ அந்தப் பொருள் நெருக்கடியை மிகையாகத் தீர்மானிக்காமல் இயல்பாக வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’ என்பது யோசேப்பின் உயர்ந்த அதிகார நிலைக்கு ஏற்ற பணிவைத் தருகிறது; தேவையற்ற பழந்தமிழ் சொற்களும் பிரிவுசார் இறையியல் சொற்பயன்பாடும் தவிர்க்கப்பட்டுள்ளன.
