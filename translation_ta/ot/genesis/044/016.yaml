revisions:
- from: அப்போது யூதா, “என் ஆண்டவரிடம் நாங்கள் என்ன சொல்வோம்? என்ன பேசுவோம்? எங்களை எப்படி நீதிமான்களாகக் காட்டிக்கொள்வோம்?[a] கடவுள் உமது அடியார்களின் குற்றத்தைக் கண்டுபிடித்துவிட்டார்.[b] இதோ, நாங்களும், யாருடைய கையில் அந்தக் கிண்ணம் கண்டுபிடிக்கப்பட்டதோ அவனும், என் ஆண்டவருக்கு அடிமைகளாக இருக்கிறோம்.[c]” என்றான்.
  to: யூதா, “என் ஆண்டவரிடம் நாங்கள் என்ன சொல்வோம்? என்ன பேசுவோம்? அல்லது, எங்களை எப்படிக் குற்றமற்றவர்கள் என்று நிரூபிப்போம்?[a] கடவுள் உமது அடியார்களின் குற்றத்தைக் கண்டுபிடித்துவிட்டார்.[b] இதோ, நாங்களும் யாருடைய கையில் அந்தக் கிண்ணம் கண்டுபிடிக்கப்பட்டதோ அவனும் என் ஆண்டவரின் அடிமைகள்.[c]” என்றான்.
  rationale: The revision preserves the source’s rhetorical progression and legal-register ambiguity while improving modern Tamil flow. It explicitly represents the alternative/disjunctive force before the third question and uses “குற்றமற்றவர்கள் என்று நிரூபிப்போம்” for the contextual sense of the Hitpael of צדק. The final sentence is tightened to a direct nominal surrender statement, preserving the meaningful servant/slave distinction marked in the notes.
