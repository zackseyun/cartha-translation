  yaml_path: translation/ot/genesis/044/013.yaml
  text: Then they tore their clothes[a], and each man loaded his donkey, and they returned to the city.
translation:
  language: ta
  text: அப்போது அவர்கள் தங்கள் ஆடைகளைக்[a] கிழித்தார்கள்; ஒவ்வொருவரும் தன் கழுதையின் மேல் சுமை ஏற்றிக்கொண்டு நகரத்திற்குத் திரும்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலாடைகளை.” எபிரெயச் சொல் பொதுவாக ஆடைகளைக் குறிக்கலாம்; சில சூழல்களில் மேலாடையையும் குறிக்கும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְעוּ
  choice: கிழித்தார்கள்
  rationale: קרע என்பது ஆடையைக் கிழிப்பதைக் குறிக்கிறது; இச்சூழலில் அது அதிர்ச்சி, துயரம் அல்லது மனவேதனையின் வெளிப்பாடாகும். தமிழில் நேரடியான செயலை இயல்பாகக் காக்கிறது.
- source_word: שִׂמְלֹתָם
  choice: தங்கள் ஆடைகளை
  rationale: שִׂמְלָה பொதுவாக ஆடை அல்லது உடையைக் குறிக்கும்; சில சூழல்களில் குறிப்பாக மேலாடையையும் சுட்டலாம். ‘ஆடைகள்’ என்பது இங்கு இயல்பானதும் தேவையற்ற குறுக்கத்தைத் தவிர்ப்பதும் ஆகும்.
- source_word: וַיַּעֲמֹס אִישׁ עַל חֲמֹרוֹ
  choice: ஒவ்வொருவரும் தன் கழுதையின்மேல் சுமையை ஏற்றிக்கொண்டு
  rationale: עמס என்பது சுமையை ஏற்றுவதைக் குறிக்கிறது. אִישׁ பகிர்ந்தளிக்கும் பொருளில் ‘ஒவ்வொருவரும்’ என வருகிறது; அவர்கள் பயணத்தைத் தொடர்வதற்காகக் கழுதைகளில் சுமையை மீண்டும் ஏற்றிய செயல் இயல்பாக வெளிப்படுகிறது.
- source_word: חֲמֹרוֹ
  choice: தன் கழுதையின்மேல்
  rationale: חֲמוֹר என்பதன் வழக்கமான நவீனத் தமிழ் இணை ‘கழுதை’; உடைமைப் பொருளை ‘தன்’ தெளிவாகக் காட்டுகிறது.
- source_word: וַיָּשֻׁבוּ
  choice: திரும்பினார்கள்
  rationale: שׁוּב என்பதன் ‘திரும்புதல்’ என்ற அடிப்படைப் பொருளை கண்ணியமான நவீன நடையில் தருகிறது.
- source_word: הָעִירָה
  choice: நகரத்திற்கு
  rationale: சொல்லின் இறுதியில் உள்ள திசைகாட்டும் ה, நகரத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் ‘நகரத்திற்கு’ என்று இயல்பாக வெளிப்படுகிறது.
