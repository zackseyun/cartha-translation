translation_notes:
  register: நவீன தரநிலைத் தமிழில் எளிமையான, கண்ணியமான கதைநடை. எபிரேயத்தின் தொடர்ச்சியான இணைப்புகளை அப்படியே சுமையாகப் பின்பற்றாமல், சூழ்நிலைத் துணைவாக்கியத்தை தனி வாக்கியமாக்கி வாசிப்புத் தெளிவு பேணப்பட்டுள்ளது. 'அவர்' என்ற மரியாதை ஒருமை யோசேப்பைக் குறிக்கிறது; சகோதரர்களின் செயல் பன்மையில் உள்ளது.
