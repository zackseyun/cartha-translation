base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/014.yaml
  text: Then Judah and his brothers came into Joseph’s house[a]. He was still there[b], and they fell to the ground before him.
translation:
  language: ta
  text: யூதாவும் அவன் சகோதரர்களும் யோசேப்பின் வீட்டுக்குள் வந்தார்கள். அவர் இன்னும் அங்கேயே இருந்தார்; அவர்கள் அவருக்கு முன்பாகத் தரையில் விழுந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் அவருக்கு முன்பாகத் தரையில் சாஷ்டாங்கமாக விழுந்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்தார்கள்
  rationale: בוא என்பதன் வழக்கமான இறந்தகாலக் கதைநடைப் பொருளை இயல்பான தமிழில் தருகிறது; யூதாவோடு சகோதரர்களும் சேர்ந்த கூட்டெழுவாயாக இருப்பதால் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוּדָה וְאֶחָיו
  choice: யூதாவும் அவன் சகோதரர்களும்
  rationale: யூதாவை முன்னணிப் பாத்திரமாகத் தனியே குறிப்பிடுவதையும், மற்றவர்களை அவனுடைய சகோதரர்கள் என உறவுமுறையோடு குறிப்பிடுவதையும் காக்கிறது.
- source_word: בֵּיתָה יוֹסֵף
  choice: யோசேப்பின் வீட்டுக்குள்
  rationale: בֵּיתָה என்பதிலுள்ள திசைநோக்குச் சுட்டு வீட்டை நோக்கிய அல்லது வீட்டுக்குள் சென்ற இயக்கத்தைக் குறிக்கிறது; சூழலில் 'வீட்டுக்குள்' என்பது இயல்பும் துல்லியமும் உடையது.
- source_word: וְהוּא עוֹדֶנּוּ שָׁם
  choice: அவர் இன்னும் அங்கேயே இருந்தார்
  rationale: עוֹדֶנּוּ குறிக்கும் தொடர்நிலையை 'இன்னும்' என்பதும், שָׁם என்பதன் இடவலியுறுத்தலை 'அங்கேயே' என்பதும் தெளிவாகக் காட்டுகின்றன.
- source_word: וַיִּפְּלוּ
  choice: விழுந்தார்கள்
  rationale: வினையின் அடிப்படைப் பொருளான 'விழுதல்' காக்கப்படுகிறது; அடுத்துவரும் 'அவருக்கு முன்பாகத் தரையில்' என்ற சொற்றொடர் பணிந்து வீழ்ந்த செயலைத் தெளிவாக்குகிறது.
- source_word: לְפָנָיו
  choice: அவருக்கு முன்பாக
  rationale: '''அவருடைய முகத்திற்கு முன்'' என்ற எபிரேய மரபுத்தொடரின் இயல்பான நவீனத் தமிழ் இணை.'
- source_word: אָרְצָה
  choice: தரையில்
  rationale: தரையை நோக்கிய கீழ்நோக்கு இயக்கத்தைத் தமிழில் இயல்பாகக் குறிக்கிறது; 'விழுந்தார்கள்' என்பதோடு சேர்ந்து உடல் நிலையைத் தெளிவாக்குகிறது.
