revisions:
- from: அவன் அவர்களை எட்டிப்பிடித்து, இந்த வார்த்தைகளை அவர்களிடம் பேசினான்:[a]
  to: அவன் அவர்களைச் சென்றடைந்து, இந்த வார்த்தைகளை அவர்களிடம் கூறினான்:[a]
