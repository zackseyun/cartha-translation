lexical_decisions:
- source_word: וַיַּשִּׂגֵם
  choice: அவன் அவர்களை எட்டிப்பிடித்து
  rationale: נשׂג என்பதன் ஹிஃபில் வடிவம், பின்னால் சென்று அவர்களை அடைந்த நிகழ்வைக் குறிக்கிறது. சூழலுக்கு ஏற்ற இயல்பான நவீனத் தமிழாக ‘எட்டிப்பிடித்து’ தேர்ந்தெடுக்கப்பட்டது; ‘முந்திச் சென்று’ என்ற பொருள் இங்கு வேண்டாததாக இருக்கலாம்.
- source_word: וַיְדַבֵּר
  choice: பேசினான்
  rationale: דבר என்பதன் அடிப்படைப் பொருளான ‘பேசு’ என்பதையும், தொடர்ந்து வரும் ‘இந்த வார்த்தைகள்’ என்ற நேரடிச் செயப்படுபொருளுடனான எபிரெயச் சொல்லிணைப்பையும் காக்கிறது.
- source_word: אֲלֵהֶם
  choice: அவர்களிடம்
  rationale: אֶל குறிக்கும் பேச்சின் திசையை இயல்பான தமிழில் ‘அவர்களிடம்’ என்று வழங்குகிறது.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகளை
  rationale: சொல்லப்படவிருக்கும் உரையை அறிமுகப்படுத்தும் எபிரெய மொழியின் நேரடியான ‘இந்த வார்த்தைகள்’ என்ற பொருளைப் பாதுகாக்கிறது.
