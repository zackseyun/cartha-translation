revisions:
- from: ஆகவே இப்போது, உமது அடியேனாகிய நான் இந்த இளைஞனுக்குப் பதிலாக என் ஆண்டவருக்கு அடிமையாக இங்கேயே தங்கியிருக்கத் தயவுசெய்து அனுமதியும்; இளைஞனோ தன் சகோதரர்களுடன் மேலே செல்லட்டும்.[a]
  to: எனவே இப்போது, உமது அடியேனாகிய நான் இந்த இளைஞனுக்குப் பதிலாக என் ஆண்டவருக்கு அடிமையாகத் தங்கியிருக்கத் தயவுசெய்து அனுமதியுங்கள்; இளைஞன் தன் சகோதரர்களுடன் மேலே செல்லட்டும்.[a]
  rationale: The revision corrects the Tamil request syntax while retaining the verse’s polite imperative, social register, and the semantic distinction between deferential ‘servant’ language and literal enslavement. It preserves the geographically meaningful ‘go up’ and its correctly anchored cultural note.
