source:
  edition: WLC
  text: וְ/עַתָּ֗ה יֵֽשֶׁב נָ֤א עַבְדְּ/ךָ֙ תַּ֣חַת הַ/נַּ֔עַר עֶ֖בֶד לַֽ/אדֹנִ֑/י וְ/הַ/נַּ֖עַר יַ֥עַל עִם אֶחָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/033.yaml
  text: So now[a], please let your servant remain instead of the boy as a servant to my lord[b], and let the boy go up with his brothers.
translation:
  language: ta
  text: எனவே இப்போது, உமது அடியேனாகிய நான் இந்த இளைஞனுக்குப் பதிலாக என் ஆண்டவருக்கு அடிமையாகத் தங்கியிருக்கத் தயவுசெய்து அனுமதியுங்கள்; இளைஞன் தன் சகோதரர்களுடன் மேலே செல்லட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “மேலே செல்லட்டும்.” எகிப்திலிருந்து கானானை நோக்கிச் செல்லும் பயணத்தை இவ்வாறு குறிப்பிடுவது வழக்கம்.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: யூதாவின் வேண்டுகோளின் உச்சக்கட்டத்தை அறிமுகப்படுத்தும் இணைப்பையும் உரையாடல் சார்ந்த காலநிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יֵשֶׁב נָא
  choice: இங்கேயே தங்கியிருக்கத் தயவுசெய்து அனுமதியும்
  rationale: ישׁב இங்கு ‘உட்காருதல்’ என்பதைக் காட்டிலும் பின்தங்கி இருப்பதைக் குறிக்கிறது; נָא பணிவான வேண்டுகோளைச் சுட்டுகிறது. ‘இங்கேயே’ என்பது சூழலில் தெளிவாக உள்ள தங்கியிருத்தலை இயல்பாக்குகிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியேனாகிய நான்
  rationale: யோசேப்பிடம் யூதா தன்னைத் தாழ்த்திப் பேசும் மரியாதைமிக்க சுயகுறிப்பு இது; இவ்விடத்தில் நேரடியான அடிமை நிலையைக் குறிப்பதல்ல.
- source_word: תַּחַת הַנַּעַר
  choice: இந்த இளைஞனுக்குப் பதிலாக
  rationale: תחת இங்கு இடம்சார்ந்த ‘கீழே’ என்ற பொருளில் அல்லாமல் ஒருவருக்குப் பதிலாக மற்றொருவர் நிற்கும் மாற்றீட்டுப் பொருளில் வருகிறது.
- source_word: הַנַּעַר
  choice: இளைஞன்
  rationale: נער என்பதன் பாதுகாப்பும் உறவுமுறையும் கலந்த சித்தரிப்பைத் தக்கவைத்தபடி, பென்யமீனைச் சிறு குழந்தையாகத் தவறாக உணர்த்தாமல் உள்ளது.
- source_word: עֶבֶד
  choice: அடிமை
  rationale: முன்னுள்ள மரியாதைமிக்க சுயகுறிப்பிலிருந்து வேறுபட்டு, இங்கு யோசேப்பின் வீட்டில் உண்மையாகக் கட்டுப்பட்ட நிலையில் இருப்பதே முன்வைக்கப்படுகிறது.
- source_word: לַאדֹנִי
  choice: என் ஆண்டவருக்கு
  rationale: இது யோசேப்பைக் குறிக்கும் மனிதருக்குரிய மரியாதைப் பட்டம்; தெய்வீகக் குறிப்பை இறக்குமதி செய்யாமல் சமூக மரியாதை நிலையைத் தக்கவைக்கிறது.
- source_word: וְהַנַּעַר יַעַל
  choice: இளைஞனோ ... மேலே செல்லட்டும்
  rationale: வேண்டுகோளின் தொடர்ச்சியான அனுமதிப் பொருளையும் עלה என்பதன் ‘மேலே செல்லுதல்’ என்ற பயண மொழியையும் பாதுகாக்கிறது.
- source_word: עִם אֶחָיו
  choice: தன் சகோதரர்களுடன்
  rationale: குடும்ப உறவைக் குறிக்கும் சொல்லின் நேரான, சூழலுக்குப் பொருத்தமான மொழிபெயர்ப்பு.
