review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the temporal/result sequence, Benjamin's absence, Jacob's consequent death, the servants' role, the concrete image of gray hair, grief, and Sheol. The rendering of the Hiphil idiom as “இறங்கச் செய்வோம்,” however, is less idiomatic in Tamil and can sound as though only the hair—not the aged father metonymically represented by it—is being made to descend.
  naturalness: “அவர் காணும்போது” is understandable but slightly abrupt because its subject is not stated in the immediate clause. “அவர் ... காணும்போது” is clearer and natural. Recasting the final verbal phrase as “ஷியோலுக்கு இறக்குவோம்” retains the Hebrew downward/causative imagery while reading more naturally in modern Tamil.
  terminology: “ஷியோல்” appropriately preserves the semantic breadth of שְׁאוֹל, and the lexical-alternative footnote is correctly anchored. “பணியாளர்கள்” is a suitable neutral modern rendering of the deferential courtly self-reference in this context.
  issues:
  - severity: low
    issue: The subject of “காணும்போது” is only implicit.
    rationale: The Hebrew suffix identifies the father as the one seeing. Explicitly retaining “அவர்” immediately with the verb improves Tamil clarity without adding meaning.
  - severity: medium
    issue: “நரைமுடியைத் ... இறங்கச் செய்வோம்” is awkward Tamil for the Hebrew idiom.
    rationale: The Hebrew deliberately uses the concrete metonym “gray hair,” but Tamil “இறக்குவோம்” better conveys the causative downward motion and avoids an overly mechanical phrasing.
  revised_text: அப்போது, அவர் அந்தப் பையன் இல்லை என்பதைக் காணும்போது, அவர் இறந்துபோவார்; உங்கள் பணியாளர்களாகிய நாங்கள், எங்கள் தந்தையான உங்கள் பணியாளரின் நரைமுடியைத் துயரத்தோடு ஷியோலுக்கு[a] இறக்குவோம்.
  revised_footnotes:
  - marker: a
    text: அல்லது, ‘கல்லறைக்கு’ அல்லது ‘இறந்தோரின் உலகத்திற்கு.’ எபிரெயத்தில் ‘ஷியோல்.’
    reason: lexical_alternative
  revision_rationale: The revision makes the father the explicit subject of seeing and replaces the less natural causative construction with “இறக்குவோம்.” It preserves the Hebrew’s concrete “gray hair” image, the plural agency of the speakers, the sorrow motif, and the deliberately untranslated semantic range of Sheol.
