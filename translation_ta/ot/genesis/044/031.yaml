revisions:
- from: அப்போது, அந்தப் பையன் இல்லை என்பதை அவர் காணும்போது, அவர் இறந்துபோவார்; உங்கள் பணியாளர்களாகிய நாங்கள், எங்கள் தந்தையான உங்கள் பணியாளரின் நரைமுடியைத் துயரத்தோடு ஷியோலுக்கு[a] இறங்கச் செய்வோம்.
  to: அப்போது, அவர் அந்தப் பையன் இல்லை என்பதைக் காணும்போது, அவர் இறந்துபோவார்; உங்கள் பணியாளர்களாகிய நாங்கள், எங்கள் தந்தையான உங்கள் பணியாளரின் நரைமுடியைத் துயரத்தோடு ஷியோலுக்கு[a] இறக்குவோம்.
  rationale: The revision makes the father the explicit subject of seeing and replaces the less natural causative construction with “இறக்குவோம்.” It preserves the Hebrew’s concrete “gray hair” image, the plural agency of the speakers, the sorrow motif, and the deliberately untranslated semantic range of Sheol.
