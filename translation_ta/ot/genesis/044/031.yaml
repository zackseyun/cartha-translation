  text: וְ/הָיָ֗ה כִּ/רְאוֹת֛/וֹ כִּי אֵ֥ין הַ/נַּ֖עַר וָ/מֵ֑ת וְ/הוֹרִ֨ידוּ עֲבָדֶ֜י/ךָ אֶת שֵׂיבַ֨ת עַבְדְּ/ךָ֥ אָבִ֛י/נוּ בְּ/יָג֖וֹן שְׁאֹֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/031.yaml
  text: then[a], when he sees that the boy is not there, he will die, and your servants will bring down the gray hair of your servant our father to Sheol in sorrow.
translation:
  language: ta
  text: அப்போது, அவர் அந்தப் பையன் இல்லை என்பதைக் காணும்போது, அவர் இறந்துபோவார்; உங்கள் பணியாளர்களாகிய நாங்கள், எங்கள் தந்தையான உங்கள் பணியாளரின் நரைமுடியைத் துயரத்தோடு ஷியோலுக்கு[a] இறக்குவோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கல்லறைக்கு’ அல்லது ‘இறந்தோரின் உலகத்திற்கு.’ எபிரெயத்தில் ‘ஷியோல்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: அப்போது
  rationale: முந்தைய நிபந்தனையின் விளைவை அறிமுகப்படுத்தும் எபிரெயச் சொற்றொடரின் உரையாடல் செயல்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּרְאוֹתוֹ
  choice: அவர் காணும்போது
  rationale: כ முன்னொட்டுடன் வரும் வினையெச்ச வடிவம் காலச் சூழலைக் குறிக்கிறது; அடுத்த உட்பிரிவு காணப்படுவதன் உள்ளடக்கத்தை வழங்குகிறது.
- source_word: כִּי אֵין הַנַּעַר
  choice: அந்தப் பையன் இல்லை என்பதை
  rationale: אֵין இச்சூழலில் எதிர்பார்க்கப்பட்ட இடத்தில் இல்லாமையைக் குறிக்கிறது; ‘காணாமல் போய்விட்டான்’ என்று மொழிபெயர்த்தால் மரணம் அல்லது நிரந்தர இழப்பு என்ற கூடுதல் பொருள் வரக்கூடும்.
- source_word: הַנַּעַר
  choice: அந்தப் பையன்
  rationale: நַעַר என்பது இளைஞனையும் குறிக்கலாம்; ஆனால் தந்தையின் பார்வையையும் குடும்பச் சூழலின் உணர்ச்சியையும் ‘பையன்’ இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: וָמֵת
  choice: அவர் இறந்துபோவார்
  rationale: இங்கே வரும் வடிவம் முன் கூறப்பட்ட சூழ்நிலையின் எதிர்கால விளைவைக் குறிக்கிறது; இறப்பவர் யாக்கோபு என்பதையும் ஆண்பால் ஒருமை சுட்டுகிறது.
- source_word: וְהוֹרִידוּ
  choice: இறங்கச் செய்வோம்
  rationale: ירד வேரின் ஹிஃபில் வடிவம் ஒருவரை கீழே இறங்கச் செய்வதைக் குறிக்கிறது. ‘ஷியோலுக்கு இறங்குதல்’ என்ற மூலப்படிமத்தை இது காக்கிறது.
- source_word: עֲבָדֶיךָ
  choice: உங்கள் பணியாளர்களாகிய நாங்கள்
  rationale: ஆட்சியாளரிடம் மரியாதையுடன் தம்மைக் குறிப்பிடும் நீதிமன்றப் பேச்சு இது; வினையின் முதல் நபர் பன்மைப் பொருளைத் தமிழில் தெளிவுபடுத்த ‘நாங்கள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: שֵׂיבַת
  choice: நரைமுடியை
  rationale: சொல் நேரடியாக நரையைக் குறித்தும் விரிவாக முதுமையைக் குறித்தும் வருகிறது. மூலத்தின் தெளிவான உருவகத்தை ‘நரைமுடி’ காக்கிறது.
- source_word: עַבְדְּךָ אָבִינוּ
  choice: எங்கள் தந்தையான உங்கள் பணியாளரின்
  rationale: யூதா யாக்கோபை ஒரே நேரத்தில் ‘எங்கள் தந்தை’ என்றும் ஆட்சியாளரின் ‘பணியாளர்’ என்றும் குறிப்பிடும் இணைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: בְּיָגוֹן
  choice: துயரத்தோடு
  rationale: יָגוֹן ஆழ்ந்த துயரத்தைக் குறிக்கிறது; בְּ முன்னொட்டின் உடனிகழ்ச்சி/நிலைப் பொருளை இயல்பாகத் தருகிறது.
- source_word: שְׁאֹלָה
  choice: ஷியோலுக்கு
  rationale: எபிரெயச் சொல் கல்லறையை மட்டும் அல்லாமல் இறந்தோரின் உலகத்தையும் குறிக்கக்கூடியதால், அதன் பொருள் வரம்பைச் சுருக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: שְׁאוֹל என்பதன் மொழிபெயர்ப்பு
  choice: ஷியோல்
  alternative: கல்லறை; இறந்தோரின் உலகம்
  rationale: ஒலிபெயர்ப்பு எபிரெயச் சொல்லின் விரிவான பொருள் வரம்பையும் பண்டைய கருத்துலகையும் காக்கிறது; ஒரு குறிப்பிட்ட மறுமை அல்லது அண்டவியல் விளக்கத்தை வசனத்திற்குள் திணிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் உரையின் உணர்ச்சித் தீவிரமும் காக்கப்பட்டுள்ளன. ‘நரைமுடியை … இறங்கச் செய்வோம்’ என்ற சற்றே அபூர்வமான அமைப்பு, மூல எபிரெயத்தின் திட்டமிட்ட உருவகத்தைப் பாதுகாக்கிறது.
