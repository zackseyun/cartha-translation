base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/032.yaml
  text: For your servant became surety for the boy to my father[a], saying, ‘If I do not bring him to you[b], then I will bear the blame before my father all my days.’
translation:
  language: ta
  text: ஏனெனில், உமது அடியவனாகிய நான் அந்தப் பையனுக்காக என் தந்தையிடம் உத்தரவாதம் அளித்தேன்[a], ‘அவனை உம்மிடம் கொண்டுவராவிட்டால், என் வாழ்நாளெல்லாம் என் தந்தையின் முன் பழியைச் சுமப்பேன்[b]’ என்று கூறினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்தப் பையனுக்கு உத்தரவாதம் அளித்தேன்’ அல்லது ‘அந்தப் பையனுக்காக என்னையே பிணையாக ஒப்புக்கொடுத்தேன்.’ எபிரெய வினைச்சொல், உத்தரவாதியாகப் பொறுப்பேற்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நேராக, ‘என் தந்தைக்கு எதிராக வாழ்நாளெல்லாம் பாவஞ்செய்தவனாயிருப்பேன்.’ இங்கு நீடித்த குற்றப்பொறுப்பு அல்லது பழி என்பதே கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: யூதா முன்வைக்கும் வேண்டுகோளுக்கான காரணத்தைத் தொடர்ந்து விளக்கும் இணைப்புச் சொல்.
- source_word: עַבְדְּךָ
  choice: உமது அடியவனாகிய நான்
  rationale: உயர் அதிகாரியிடம் தன்னைத் தாழ்த்திக் குறிப்பிடும் அரசவைப் பேச்சு நடையைப் பாதுகாக்கிறது; இச்சூழலில் அடிமை உடைமையை தேவையின்றி வலியுறுத்தவில்லை.
- source_word: עָרַב אֶת הַנַּעַר מֵעִם אָבִי
  choice: அந்தப் பையனுக்காக என் தந்தையிடம் பொறுப்பேற்றுக்கொண்டு
  rationale: עָרַב என்பதிலுள்ள உத்தரவாதியாகப் பொறுப்பேற்கும் பொருளையும், அந்த உறுதி தந்தையிடம் அளிக்கப்பட்டதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַנַּעַר
  choice: அந்தப் பையன்
  rationale: பென்யமீனை குடும்ப உறவின் பார்வையில் குறிக்கும் சொல்லாகும்; அவர் சிறு குழந்தை என்று கட்டாயப்படுத்தாமல் எபிரெயச் சொல்லின் உறவுசார் நயத்தைத் தருகிறது.
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: அவனை உம்மிடம் திரும்பக் கொண்டுவராவிட்டால்
  rationale: நிபந்தனையைத் தெளிவாகக் காட்டுகிறது; பயணச் சூழலில் ‘திரும்ப’ என்பது தந்தையிடம் மீண்டும் கொண்டுவருவதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְחָטָאתִי לְאָבִי
  choice: என் தந்தையின் முன் பழியைச் சுமப்பேன்
  rationale: சொல்லுக்கு நேரான ‘பாவஞ்செய்தவனாயிருப்பேன்’ என்ற பொருளுக்குப் பின்னுள்ள நீடித்த குற்றப்பொறுப்பு அல்லது பழி என்ற சூழல்சார் கருத்தைத் தருகிறது; அடிக்குறிப்பில் நேரடிப் பொருள் பாதுகாக்கப்படுகிறது.
- source_word: כָּל הַיָּמִים
  choice: என் வாழ்நாளெல்லாம்
  rationale: வாழ்நாள் முழுவதும் நீடிக்கும் பொறுப்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: וְחָטָאתִי என்பதின் பாவம்/குற்றப்பொறுப்பு நயம்
  choice: முதன்மை உரையில் ‘பழியைச் சுமப்பேன்’
  alternative: ‘என் தந்தைக்கு விரோதமாகப் பாவஞ்செய்தவனாயிருப்பேன்’
  rationale: இங்கு யூதா தன் உறுதிமொழியை நிறைவேற்றத் தவறினால் வாழ்நாள் முழுவதும் ஏற்படும் குற்றப்பொறுப்பைப் பேசுகிறார். இருப்பினும் வினைச்சொல்லின் நேரடியான ‘பாவம்’ நயம் அடிக்குறிப்பில் மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன, கண்ணியமான தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. யோசேப்பிடம் பேசும் மரியாதைநிலையை ‘உமது’, ‘அடியவன்’ என்பவை காக்கின்றன; சட்டரீதியான உத்தரவாத நயம் ‘பொறுப்பேற்றுக்கொண்டு’ என்பதாலும், நேரடியான பாவ நயம் அடிக்குறிப்பாலும் பாதுகாக்கப்படுகிறது.
