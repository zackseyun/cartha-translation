  text: הַ/בֹּ֖קֶר א֑וֹר וְ/הָ/אֲנָשִׁ֣ים שֻׁלְּח֔וּ הֵ֖מָּה וַ/חֲמֹרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/003.yaml
  text: As soon as the morning was light[a], the men were sent away, they and their donkeys.
translation:
  language: ta
  text: காலை வெளுத்ததும்[a], அந்த மனிதர்களும் அவர்களுடைய கழுதைகளும் அனுப்பிவைக்கப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காலையில் வெளிச்சம் வந்ததும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּקֶר אוֹר
  choice: காலை வெளுத்ததும்
  rationale: אוֹר என்பது இங்கு வெளிச்சம் தோன்றுவதைக் குறிக்கும் வினைச்சொல். ‘காலை வெளுத்ததும்’ என்பது விடியற்கால நிகழ்வை இயல்பான நவீனத் தமிழில் கூறுவதோடு, காலத்தைக் குறிக்கும் எபிரெய வாக்கிய அமைப்பையும் பிரதிபலிக்கிறது.
- source_word: וְהָאֲנָשִׁים
  choice: அந்த மனிதர்கள்
  rationale: முன்னரே குறிப்பிடப்பட்ட மனிதர்களைக் குறிக்கும் வரையறுக்கப்பட்ட பன்மை பெயர்ச்சொல் என்பதால் ‘அந்த மனிதர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שֻׁלְּחוּ
  choice: அனுப்பிவைக்கப்பட்டார்கள்
  rationale: שלח என்பதன் புஅல் வினைவடிவிலுள்ள செயப்பாட்டு பொருளைத் தக்கவைத்து, அவர்கள் அங்கிருந்து புறப்பட அனுப்பப்பட்டார்கள் என்ற சூழலையும் தெளிவாகக் காட்டுகிறது.
- source_word: הֵמָּה וַחֲמֹרֵיהֶם
  choice: தங்களுடைய கழுதைகளுடன்
  rationale: எபிரெயத்தில் ‘அவர்களும் அவர்களுடைய கழுதைகளும்’ என்று ஒருங்கிணைக்கப்பட்டுள்ளது. தமிழில் பயணிகளும் அவர்களுடைய விலங்குகளும் ஒன்றாக அனுப்பப்பட்டனர் என்ற பொருளை இயல்பாகத் தெரிவிக்க ‘தங்களுடைய கழுதைகளுடன்’ என வழங்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. செயப்பாட்டு வினை வடிவம் பாதுகாக்கப்பட்டுள்ளது; எபிரெய மொழியின் விடியற்காலச் சொற்றொடர் தமிழில் வழக்கமான ‘காலை வெளுத்ததும்’ என்று வழங்கப்பட்டுள்ளது.
