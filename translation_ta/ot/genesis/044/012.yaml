  text: And he searched[a], beginning with the oldest and finishing with the youngest, and the cup was found in Benjamin’s sack.
translation:
  language: ta
  text: அவன் மூத்தவனிடமிருந்து தொடங்கி இளையவன்வரை தேடினான். அப்போது கிண்ணம்[a] பென்யமீனின் சாக்கில் கண்டெடுக்கப்பட்டது.
  philosophy: optimal-equivalence
