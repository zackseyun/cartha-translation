translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெயச் சொல்லொழுங்கிலுள்ள ‘மூத்தவனிடமிருந்து தொடங்கி இளையவனிடம் முடித்தல்’ என்ற முன்னேற்றமும், ‘கண்டெடுக்கப்பட்டது’ என்ற செயப்பாட்டு வடிவமும் பாதுகாக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் அடிக்குறி ‘searched’ என்பதற்குப் பின் இருந்தாலும், அதன் உள்ளடக்கம் הַגָּבִיעַ என்பதைக் குறிக்கும் என்பதால் தமிழில் ‘கிண்ணம்’ என்பதற்குப் பின் பொருத்தப்பட்டுள்ளது.
