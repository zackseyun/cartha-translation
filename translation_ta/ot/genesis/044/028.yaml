  yaml_path: translation/ot/genesis/044/028.yaml
  text: One left me, and I said, ‘Surely he has been torn to pieces,’ and I have not seen him until now.
translation:
  language: ta
  text: ஒருவன் என்னைவிட்டுப் போனான். நான், ‘நிச்சயமாக அவன் கிழித்துத் துண்டாடப்பட்டிருப்பான்’ என்று சொன்னேன். இன்றுவரை நான் அவனைப் பார்க்கவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הָאֶחָד מֵאִתִּי
  choice: ஒருவன் என்னைவிட்டுப் போய்விட்டான்
  rationale: הָאֶחָד என்பது இங்கு முன்பு குறிப்பிடப்பட்ட இரு மகன்களில் ‘ஒருவன்’ என்பதைக் குறிக்கிறது; מֵאִתִּי பிரிவை உணர்த்துவதால் இயல்பான தமிழில் ‘என்னைவிட்டுப்’ என வழங்கப்பட்டது.
- source_word: אַךְ טָרֹף טֹרָף
  choice: நிச்சயமாக அவன் பீறிக் கிழிக்கப்பட்டிருப்பான்
  rationale: אַךְ உறுதியை வலியுறுத்துகிறது. ஒரே வேர்ச்சொல்லின் infinitive absolute + finite verb அமைப்பு தீவிர உறுதியைக் குறிக்கிறது; விலங்கால் கொல்லப்பட்டதைக் குறிக்கும் சூழலைப் பாதுகாக்க ‘பீறிக் கிழிக்கப்பட்டிருப்பான்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְלֹא רְאִיתִיו עַד הֵנָּה
  choice: இன்றுவரை நான் அவனைப் பார்க்கவில்லை
  rationale: עַד הֵנָּה என்பதன் காலவழிப் பொருள் ‘இப்போதுவரை’; நவீனத் தமிழில் இயல்பாக ‘இன்றுவரை’ என வழங்கப்பட்டது.
