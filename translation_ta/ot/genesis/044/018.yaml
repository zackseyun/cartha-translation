base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/018.yaml
  text: Then Judah came near to him and said[a], “Please, my lord, let your servant speak a word in my lord’s hearing, and do not let your anger burn against your servant[c][b], for you are like Pharaoh.”
translation:
  language: ta
  text: அப்போது யூதா அவரை நெருங்கி, “என் ஆண்டவரே, தயவுசெய்து உமது அடியான் என் ஆண்டவர் கேட்கும்படி ஒரு வார்த்தை பேச அனுமதியுங்கள்.[a] உமது அடியான் மீது உமது கோபம் எரிய வேண்டாம்; ஏனெனில் நீர் பார்வோனைப் போன்றவர்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “என் ஆண்டவரின் காதுகளில்.” இது, ஆண்டவர் கேட்கும்படி பேசுவதைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגַּשׁ אֵלָיו יְהוּדָה
  choice: அப்போது யூதா அவரை நெருங்கி
  rationale: נגשׁ குறிக்கும் உடல்ரீதியான அணுகுதலை ‘நெருங்கி’ இயல்பாகத் தக்கவைக்கிறது; אֵלָיו என்பதன் சுட்டுப்பொருளையும் வெளிப்படுத்துகிறது.
- source_word: בִּי אֲדֹנִי
  choice: என் ஆண்டவரே, தயவுசெய்து
  rationale: בִּי என்பது பணிவான வேண்டுகோளின் தொடக்கம். ‘தயவுசெய்து’ நவீன தமிழில் அதன் மரியாதைத் தொனியைத் தருகிறது; אֲדֹנִי என்பதற்கு அரசவைச் சூழலுக்கு ஏற்ற ‘என் ஆண்டவரே’ பயன்படுத்தப்படுகிறது.
- source_word: יְדַבֶּר נָא עַבְדְּךָ דָבָר
  choice: உமது அடியான் ... ஒரு வார்த்தை பேச அனுமதியும்
  rationale: தன்னை ‘உமது அடியான்’ என்று குறிப்பிடும் யூதாவின் பணிவையும், நָא உடன் வரும் வேண்டுகோள் வலிமையையும், דָבָר என்ற ஒருமையையும் பாதுகாக்கிறது.
- source_word: בְּאָזְנֵי אֲדֹנִי
  choice: என் ஆண்டவர் கேட்கும்படி
  rationale: சொல்லுக்குச் சொல் ‘என் ஆண்டவரின் காதுகளில்’ என்ற எபிரேய மரபுத்தொடர், கேட்பதற்காகப் பேசுதல் என்று பொருள்படும்; தமிழில் இயல்பான பொருளை வழங்குகிறது.
- source_word: וְאַל יִחַר אַפְּךָ בְּעַבְדֶּךָ
  choice: உமது அடியான் மேல் உமது கோபம் பற்றியெரிய வேண்டாம்
  rationale: கோபம் எரிவதாகக் கூறும் எபிரேய உருவகத்தைத் தமிழில் வாசிக்கத்தக்க விதத்தில் தக்கவைக்கிறது; בְּ இங்கு கோபம் செலுத்தப்படும் நபரை ‘மேல்’ எனக் குறிக்கிறது.
- source_word: כִּי כָמוֹךָ כְּפַרְעֹה
  choice: ஏனெனில் நீர் பார்வோனைப் போன்றவர்
  rationale: யோசேப்பின் அதிகாரமும் நிலையுமே பார்வோனோடு ஒப்பிடப்படுகின்றன. ‘போன்றவர்’ என்பது நேரடியான ஒப்பீட்டைத் தருகிறது; சமத்துவத்தை அளவுக்கு மீறி வலியுறுத்தவில்லை.
theological_decisions:
- issue: யோசேப்பை பார்வோனுடன் ஒப்பிடுவதன் தன்மை
  choice: நீர் பார்வோனைப் போன்றவர்
  alternative: நீர் பார்வோனுக்குச் சமமானவர்
  rationale: כָמוֹךָ כְּפַרְעֹה என்பது ஒப்பீட்டை வெளிப்படுத்துகிறது. அதிகாரம் அல்லது பிரதிநிதித்துவ நிலை குறித்த இயல்பான தெளிவின்மையைப் பாதுகாக்க, துல்லியமான சமத்துவத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், அரசவைச் சூழலுக்குரிய பணிவும் கண்ணியமும் தக்கவைக்கப்பட்டுள்ளன. ‘உமது’, ‘நீர்’, ‘அடியான்’, ‘அனுமதியும்’ ஆகிய வடிவங்கள் மரியாதைமிக்க வேண்டுகோளை இயல்பாக வெளிப்படுத்துகின்றன; மூலத்தின் கோபம் எரியும் உருவகமும் பாதுகாக்கப்பட்டுள்ளது.
