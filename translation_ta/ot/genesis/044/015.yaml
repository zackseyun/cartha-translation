base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/015.yaml
  text: And Joseph said to them[a], “What is this deed that you have done? Did you not know that a man like me indeed practices divination?”
translation:
  language: ta
  text: யோசேப்பு அவர்களிடம், “நீங்கள் செய்த இந்தச் செயல் என்ன? என்னைப் போன்ற ஒருவன் நிச்சயமாகக் குறிபார்ப்பான் என்று உங்களுக்குத் தெரியாதா?[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நிச்சயமாகக் குறிபார்த்து அறிந்துகொள்வான்,” “குறிபார்ப்பதில் நிச்சயமாக வல்லவன்,” அல்லது “இப்படிப்பட்டவற்றை நிச்சயமாகக் கண்டுபிடிப்பான்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் குறிபார்த்தலைக் குறிக்கும் ஒரே வேரிலிருந்து வந்த வினை வலியுறுத்தப்பட்ட அமைப்பில் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הַמַּעֲשֶׂה הַזֶּה
  choice: இந்தச் செயல் என்ன?
  rationale: מַעֲשֶׂה என்பது செயல் அல்லது செய்கையைக் குறிக்கிறது. குற்றஞ்சாட்டும் தொனியைத் தக்கவைத்துக்கொண்டே இயல்பான நவீன தமிழை வழங்குகிறது.
- source_word: עֲשִׂיתֶם
  choice: நீங்கள் செய்த
  rationale: முடிந்த செயலைக் குறிக்கும் எபிரெய வினையை, தற்போதைய குற்றச்சாட்டுடன் தொடர்புடைய இறந்தகாலச் செயலாக இயல்பாக மொழிபெயர்க்கிறது.
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: உங்களுக்குத் தெரியாதா?
  rationale: உடன்பாடான பதிலை எதிர்பார்க்கும் எதிர்மறை வினாவின் சொல்லாட்சியையும் கண்டிக்கும் தொனியையும் காக்கிறது.
- source_word: נַחֵשׁ יְנַחֵשׁ
  choice: நிச்சயமாகக் குறிபார்ப்பான்
  rationale: இறைவாக்கு அல்லது சகுனம் போன்ற குறிகளைக் கொண்டு அறிய முயலும் செயலைக் குறிக்கும் נחש வேர்ச்சொல்லையும், infinitive absolute உடன் வரும் வினையின் வலியுறுத்தலையும் நேரடியாகக் காட்டுகிறது.
- source_word: אִישׁ אֲשֶׁר כָּמֹנִי
  choice: என்னைப் போன்ற ஒருவன்
  rationale: ஆண்பால் ஒருமையையும் ஒப்புமையையும் இயல்பான தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்.
theological_decisions:
- issue: யோசேப்பு உண்மையிலேயே குறிபார்த்தாரா, அல்லது எகிப்திய அதிகாரியின் வேடத்தில் அவ்வாறு பேசினாரா?
  choice: அவரது கூற்றை நேரடியாக, ‘என்னைப் போன்ற ஒருவன் நிச்சயமாகக் குறிபார்ப்பான்’ என்று மொழிபெயர்த்தல்
  alternative: ‘என்னைப் போன்ற ஒருவன் இப்படிப்பட்ட காரியங்களை நிச்சயமாகக் கண்டுபிடித்துவிடுவான்’ என்று குறிபார்த்தலை மறைமுகமாக்குதல்
  rationale: எபிரெயம் נחש என்ற குறிபார்த்தல்/சகுனம் பார்த்தல் சார்ந்த வேர்ச்சொல்லை வலியுறுத்தி இருமுறை பயன்படுத்துகிறது. யோசேப்பு உண்மையில் அதைப் பழகினாரா அல்லது தந்திரமாகப் பேசினாரா என்பதை உரை இங்கு தீர்மானிக்காததால், மொழிபெயர்ப்பும் அந்தத் தெளிவின்மையைத் தீர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் கதைநடையின் செறிவும் காக்கப்பட்டுள்ளன. ‘குறிபார்ப்பான்’ என்பது சகுனம் அல்லது பிற குறிகளைக் கொண்டு மறைந்ததை அறிய முயலும் செயலை வெளிப்படையாகச் சொல்கிறது; யோசேப்பின் கூற்றின் உண்மைநிலையை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
