  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אֶת גְּבִיעִ֞/י גְּבִ֣יעַ הַ/כֶּ֗סֶף תָּשִׂים֙ בְּ/פִי֙ אַמְתַּ֣חַת הַ/קָּטֹ֔ן וְ/אֵ֖ת כֶּ֣סֶף שִׁבְר֑/וֹ וַ/יַּ֕עַשׂ כִּ/דְבַ֥ר יוֹסֵ֖ף אֲשֶׁ֥ר דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/002.yaml
  text: And put my cup[a], the silver cup, in the mouth of the youngest one's sack, along with the silver for his grain purchase." And he did according to Joseph's word[b], which he had spoken.
translation:
  language: ta
  text: “என் கிண்ணத்தை, அந்த வெள்ளிக் கிண்ணத்தை, இளையவனுடைய சாக்கின் வாயில்[a], அவன் தானியம் வாங்கக் கொடுத்த வெள்ளியோடு சேர்த்து வை” என்றார். யோசேப்பு சொன்னபடியே அவன் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் ‘சாக்கின் வாயில்’; அதாவது சாக்கின் திறப்பில்.
    reason: cultural_note
lexical_decisions:
- source_word: גְּבִיעִי גְּבִיעַ הַכֶּסֶף
  choice: என் கிண்ணத்தை, அந்த வெள்ளிக் கிண்ணத்தை
  rationale: גְּבִיעַ என்பது கிண்ணம் அல்லது கோப்பையைக் குறிக்கும். இயல்பான நவீன தமிழுக்காக ‘கிண்ணம்’ தேர்ந்தெடுக்கப்பட்டு, எபிரெயச் சொல்லடுக்கின் வலியுறுத்தல் இணைப்புச் சொற்றொடராகத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: תָּשִׂים
  choice: வை
  rationale: שׂים என்பதன் பொதுவான பொருள் ‘வை/இடு’. இங்கு நேரடியான கட்டளைக்கு ‘வை’ இயல்பாக உள்ளது.
- source_word: בְּפִי
  choice: வாயில்
  rationale: சாக்கின் திறப்பைக் குறிக்கும் எபிரெய உருவகம் நேரடியாகத் தக்கவைக்கப்பட்டுள்ளது; அதன் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: אַמְתַּחַת
  choice: சாக்கு
  rationale: தானியத்தைக் கொண்டு செல்லப் பயன்படும் பெரிய பையைச் சுட்டுவதால் ‘சாக்கு’ பொருத்தமானது.
- source_word: הַקָּטֹן
  choice: இளையவன்
  rationale: சொல்லளவில் ‘சிறியவன்/இளையவன்’; சூழலில் சகோதரர்களில் இளையவனைக் குறிக்கிறது. பெயரைச் சேர்க்காமல் ‘இளையவன்’ என வழங்கப்பட்டுள்ளது.
- source_word: כֶּסֶף שִׁבְרוֹ
  choice: அவன் தானியம் வாங்கக் கொடுத்த வெள்ளி
  rationale: כֶּסֶף என்பதன் பொருளான ‘வெள்ளி’யையும், שׁבר என்பதன் தானியம் வாங்குதல் என்ற வணிகச் சூழலையும் ஒன்றாகப் பாதுகாக்கிறது.
- source_word: וַיַּעַשׂ כִּדְבַר יוֹסֵף אֲשֶׁר דִּבֵּר
  choice: யோசேப்பு சொன்னபடியே அவன் செய்தான்
  rationale: சொல்லளவிலான நீண்ட மறுபதிப்பை விட, முழுப் பொருளையும் தக்கவைக்கும் இயல்பான தமிழ் நடை. அச்செயலைச் செய்தவன் முன்சூழலில் குறிப்பிடப்பட்ட பணியாளர் என்பதால் எபிரெய மூலத்தைப் போல ‘அவன்’ என்றே வைக்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வெள்ளி’ என்ற மூலச் சொல்லும் ‘என் கிண்ணத்தை, அந்த வெள்ளிக் கிண்ணத்தை’ என்ற வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன. மேற்கோள் முடிந்த பின்னுள்ள வாக்கியம் தமிழில் இயல்பாகச் சுருக்கப்பட்டுள்ளது.
