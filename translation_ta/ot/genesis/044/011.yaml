  yaml_path: translation/ot/genesis/044/011.yaml
  text: So each man hurried and lowered his sack to the ground[b][a], and each man opened his sack.
translation:
  language: ta
  text: அவர்கள் விரைந்தனர்; ஒவ்வொருவரும் தன் சாக்கைத் தரையில் இறக்கினர்; ஒவ்வொருவரும் தன் சாக்கைத் திறந்தனர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இரண்டு செயல்களிலும் ‘ஒவ்வொருவரும் தன் சாக்கை’ என்ற பகிர்வுநிலை அமைப்பு மீண்டும் வருகிறது; ஒவ்வொருவரும் தமக்குரிய சாக்கை இறக்கித் திறந்ததை இது வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: அவர்கள் விரைந்து
  rationale: מהר என்பதன் பொருள் உடனடியாகவும் வேகமாகவும் செயல்படுதல். ‘விரைந்து’ என்பது இயல்பான, கண்ணியமான நவீனத் தமிழ் நடையில் கதையின் வேகத்தைப் பாதுகாக்கிறது.
- source_word: וַיּוֹרִדוּ
  choice: இறக்கி
  rationale: ירד என்பதன் ஹிஃபில் வடிவம் ‘கீழே செல்லச் செய்தல்’ எனப் பொருள்படும். இங்கு சாக்குகளைத் தரைக்குக் கீழிறக்கும் செயலை ‘இறக்கி’ துல்லியமாகக் குறிக்கிறது.
- source_word: אִישׁ ... אַמְתַּחְתּוֹ
  choice: ஒவ்வொருவரும் தன் சாக்கை
  rationale: אִישׁ இங்கு பகிர்வுநிலைப் பொருளில் வருகிறது. பாலினத்தைத் தேவையின்றி முன்னிறுத்தாமல், ஒவ்வொரு சகோதரரும் தமக்குரிய சாக்கில் செய்த செயலை ‘ஒவ்வொருவரும் தன் சாக்கை’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַמְתַּחַת
  choice: சாக்கு
  rationale: தானியம் அல்லது பயணப் பொருட்களை வைத்துச் சுமக்கும் கொள்கலனை இது குறிக்கிறது. யோசேப்பின் கதைக் சூழலுக்கு ‘சாக்கு’ பொருத்தமானது.
- source_word: אָרְצָה
  choice: தரையில்
  rationale: திசையைக் குறிக்கும் இவ்வடிவம் தரையை நோக்கிய கீழிறக்கத்தைச் சுட்டுகிறது. ‘தரையில் இறக்கி’ என்பது தமிழில் இயல்பாகவும் சூழலுக்குத் துல்லியமாகவும் உள்ளது.
- source_word: וַיִּפְתְּחוּ
  choice: திறந்தார்கள்
  rationale: פתח என்பதன் நேரடிப் பொருள் ‘திறத்தல்’. கூடுதல் விளக்கமின்றி ‘திறந்தார்கள்’ செயலைத் தெளிவாகக் கூறுகிறது.
