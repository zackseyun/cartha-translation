source:
  edition: WLC
  text: הֵ֣ן כֶּ֗סֶף אֲשֶׁ֤ר מָצָ֨אנוּ֙ בְּ/פִ֣י אַמְתְּחֹתֵ֔י/נוּ הֱשִׁיבֹ֥נוּ אֵלֶ֖י/ךָ מֵ/אֶ֣רֶץ כְּנָ֑עַן וְ/אֵ֗יךְ נִגְנֹב֙ מִ/בֵּ֣ית אֲדֹנֶ֔י/ךָ כֶּ֖סֶף א֥וֹ זָהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/008.yaml
  text: Look[a], the silver that we found in the mouths of our sacks we brought back to you from the land of Canaan. So how could we steal silver or gold from your master's house?
translation:
  language: ta
  text: இதோ, எங்கள் மூட்டைகளின் வாயில்[a] நாங்கள் கண்ட வெள்ளியைக் கானான் நாட்டிலிருந்து உங்களிடம் திருப்பிக் கொண்டுவந்தோமே! அப்படியிருக்க, உங்கள் எஜமானின் வீட்டிலிருந்து வெள்ளியையோ தங்கத்தையோ நாங்கள் எப்படித் திருடுவோம்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக, ‘எங்கள் மூட்டைகளின் வாயில்’; இது ஒரு பை அல்லது மூட்டையின் திறப்பைக் குறிக்கும் சொல்லாட்சி.
    reason: cultural_note
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: வாதத்தின் ஆதாரத்தைக் கவனிக்கச் செய்யும் வலியுறுத்தல் இடைச்சொல்லாக இருப்பதால், இயல்பானதும் கண்ணியமானதுமான ‘இதோ’ பயன்படுத்தப்பட்டது.
- source_word: כֶּסֶף
  choice: வெள்ளி
  rationale: சூழலில் இது பணமாகப் பயன்பட்ட வெள்ளியைக் குறித்தாலும், பின்னர் வரும் ‘தங்கம்’ என்பதுடன் அமைந்துள்ள நேரடியான இணையைப் பாதுகாக்க ‘வெள்ளி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מָצָאנוּ
  choice: நாங்கள் கண்ட
  rationale: எளிய இறந்தகாலச் செயலை இயல்பான தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: בְּפִי אַמְתְּחֹתֵינוּ
  choice: எங்கள் மூட்டைகளின் வாயில்
  rationale: கொள்கலனின் திறப்பை ‘வாய்’ என்று கூறும் எபிரெய உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் பாதுகாக்கிறது; ‘மூட்டைகள்’ பயணத்திற்கும் தானியத்திற்கும் பயன்படுத்தப்பட்ட பெரிய பைகளைக் குறிக்கிறது.
- source_word: הֱשִׁיבֹנוּ אֵלֶיךָ
  choice: உங்களிடம் திருப்பிக் கொண்டுவந்தோமே
  rationale: הֱשִׁיבֹנוּ என்பதின் காரணவினைப் பொருளான ‘திரும்பச் செய்தோம்/திருப்பிக் கொண்டுவந்தோம்’ என்பதைக் காட்டுகிறது. ‘-ஓமே’ முந்தைய நேர்மையான செயலைச் சான்றாக முன்வைக்கும் வாத வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵאֶרֶץ כְּנָעַן
  choice: கானான் நாட்டிலிருந்து
  rationale: புவியியல் குறிப்பைத் தெளிவாகவும் நவீனத் தமிழுக்கு இயல்பாகவும் வழங்குகிறது.
- source_word: וְאֵיךְ נִגְנֹב
  choice: அப்படியிருக்க, ... நாங்கள் எப்படித் திருடுவோம்?
  rationale: முந்தைய செயலின் அடிப்படையில் திருடியிருப்பது சாத்தியமற்றது என வாதிடும் தொடர்ச்சியையும் வினாவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִבֵּית אֲדֹנֶיךָ
  choice: உங்கள் எஜமானின் வீட்டிலிருந்து
  rationale: இங்கு אֲדֹנֶיךָ தெய்வீகப் பட்டம் அல்ல; பணியாளரின் எஜமானாகிய யோசேப்பைக் குறிக்கிறது. ‘வீடு’ என்ற மூல உருவகமும் பாதுகாக்கப்பட்டது.
- source_word: כֶּסֶף אוֹ זָהָב
  choice: வெள்ளியையோ தங்கத்தையோ
  rationale: மூலத்தில் உள்ள உலோகங்களின் நேரடியான இணையைப் பாதுகாப்பதோடு, தமிழின் மாற்று இணைப்பான ‘-ஓ ... -ஓ’ மூலம் இயல்பாக வழங்குகிறது.
