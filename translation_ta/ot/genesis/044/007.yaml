  text: וַ/יֹּאמְר֣וּ אֵלָ֔י/ו לָ֚/מָּה יְדַבֵּ֣ר אֲדֹנִ֔/י כַּ/דְּבָרִ֖ים הָ/אֵ֑לֶּה חָלִ֨ילָ/ה֙ לַ/עֲבָדֶ֔י/ךָ מֵ/עֲשׂ֖וֹת כַּ/דָּבָ֥ר הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/007.yaml
  text: And they said to him[b][a], “Why does my lord speak words like these? Far be it from your servants to do such a thing.”
translation:
  language: ta
  text: அவர்கள் அவனிடம், “என் ஆண்டவர் ஏன் இப்படிப்பட்ட வார்த்தைகளைப் பேசுகிறார்?[a] உமது அடியார்கள் இப்படிப்பட்ட செயலைச் செய்வது நினைத்துக்கூட பார்க்க முடியாதது!” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏன் இப்படிப் பேசுகிறார்?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: அவர்கள் அவனிடம் ... என்றார்கள்
  rationale: எபிரெயக் கதைத் தொடரையும், யோசேப்பின் வீட்டுப் பொறுப்பாளரைக் குறிக்கும் மறைமுகச் சுட்டையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: אֲדֹנִי
  choice: என் ஆண்டவர்
  rationale: இது இறைப்பட்டம் அல்ல; உயர்ந்த நிலையிலுள்ள மனிதரிடம் பேசும் மரியாதையான ஒருமை விளி. ‘எஜமான்’ என்பதும் சாத்தியம், ஆனால் ‘ஆண்டவர்’ மூலத்தின் மரியாதைத் தொனியை நெருக்கமாகக் காக்கிறது.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: இப்படிப்பட்ட வார்த்தைகளை
  rationale: ‘இவற்றைப் போன்ற வார்த்தைகள்’ என்ற மூலப் பொருளை இயல்பான நவீன தமிழில் தருகிறது; மாற்றாக ‘இப்படிப் பேசுகிறார்’ என்று சுருக்கலாம்.
- source_word: חָלִילָה לַעֲבָדֶיךָ
  choice: உமது அடியார்களுக்கு வெகு தூரமாயிருப்பதாக
  rationale: கடுமையான மறுப்பைக் குறிக்கும் எபிரெய மரபுத்தொடரின் உருவகத்தைப் பாதுகாக்கிறது. ‘ஒருபோதும் மாட்டோம்’ என்பது இயல்பானது என்றாலும் மூலத்தின் வலிமையான வடிவத்தைச் சுருக்கிவிடும்.
- source_word: מֵעֲשׂוֹת כַּדָּבָר הַזֶּה
  choice: இப்படிப்பட்ட ஒரு செயலைச் செய்வது
  rationale: குற்றஞ்சாட்டப்பட்ட செயலையே சுட்டுகிறது; தமிழில் ‘காரியம்’ என்பதைக் காட்டிலும் ‘செயல்’ இச்சூழலில் தெளிவாக உள்ளது.
