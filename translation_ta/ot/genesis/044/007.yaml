translation_notes:
  register: நவீன, கண்ணியமான உரைநடை. ‘என் ஆண்டவர்/உமது அடியார்கள்’ என்பது அரண்மனைச் சூழலிலான மரியாதை மற்றும் தாழ்மையான சுயக்குறிப்பைப் பேணுகிறது. חָלִילָה என்பதன் வலிமையான மறுப்பை தமிழில் மூல உருவகத்தோடு வைத்திருக்கிறது.
