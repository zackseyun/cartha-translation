base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/009.yaml
  text: Whichever of your servants it is found with[a], let him die[b], and we also will become servants to my lord.
translation:
  language: ta
  text: “உமது பணியாளர்களில் யாரிடம் அது கண்டுபிடிக்கப்படுகிறதோ[a], அவன் சாகட்டும்[b]; நாங்களும் என் தலைவரின் அடிமைகளாவோம்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘பணியாளர்கள்’ என்றும் பின்னர் ‘அடிமைகள்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ள இரு சொற்களும் ஒரே எபிரெய வேரிலிருந்து வந்தவை. முதலில் அவர்கள் மரியாதையுடன் தங்களைக் குறிப்பிடுகிறார்கள்; பின்னர் தண்டனையாக உண்மையான அடிமைநிலையை முன்வைக்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவன் இறப்பான்.”
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ מֵעֲבָדֶיךָ
  choice: உமது பணியாளர்களில் எவனிடம் அது கண்டுபிடிக்கப்படுகிறதோ
  rationale: אֲשֶׁר ஓர் உறுதியற்ற தொடர்புச் சொல்லாக உள்ளது; מן பகுதியைக் குறிக்கும் பொருளில் ‘பணியாளர்களில்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது. முந்தைய சூழலில் பேசப்படும் கோப்பையைச் சுட்டுவதற்காக ‘அது’ சேர்க்கப்பட்டுள்ளது; אִתּוֹ உடைமை அல்லது ஒருவரிடம் இருப்பதைக் குறிக்கிறது.
- source_word: וָמֵת
  choice: அவன் சாகட்டும்
  rationale: இணைப்புடன் வரும் நிறைவுவினை இங்கு அவர்கள் முன்வைக்கும் உறுதிமொழி போன்ற தண்டனை விளைவைக் குறிக்கிறது. ‘சாகட்டும்’ அதன் வலியுறுத்தலையும் முன்மொழிவுத் தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְגַם אֲנַחְנוּ נִהְיֶה
  choice: நாங்களும் … அடிமைகளாவோம்
  rationale: וְגַם தரும் கூடுதல் வலியுறுத்தலை ‘நாங்களும்’ காக்கிறது. נִהְיֶה ஒரு புதிய நிலைக்குள் வருவதைச் சுட்டுவதால் ‘அடிமைகளாவோம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לַאדֹנִי
  choice: என் தலைவருக்கு
  rationale: இது தெய்வத்தைக் குறிக்கும் பட்டம் அல்ல; அதிகாரமுள்ள மனிதரிடம் மரியாதையுடன் பேசும் சொல். எபிரெய 1ஆம் நபர் ஒருமை உரிமை விகுதியை ‘என்’ காக்கிறது.
- source_word: לַעֲבָדִים
  choice: அடிமைகளாக
  rationale: இங்கு தண்டனையாக உண்மையான கட்டுப்பட்ட அடிமைநிலைக்குள் செல்வதே கருத்து; ஆகவே பொதுவான ‘பணியாளர்கள்’ என்பதைக் காட்டிலும் ‘அடிமைகள்’ துல்லியமானது.
theological_decisions:
- issue: ஒரே עבד வேர் இவ்வசனத்தில் இருமுறை வருவது
  choice: முதல் இடத்தில் ‘பணியாளர்கள்’; இரண்டாம் இடத்தில் ‘அடிமைகள்’
  alternative: இரண்டு இடங்களிலும் ‘அடிமைகள்’ அல்லது இரண்டு இடங்களிலும் ‘பணியாளர்கள்’
  rationale: முதல் இடத்தில் சகோதரர்கள் அதிகாரியிடம் தங்களைத் தாழ்மையுடன் குறிப்பிடுகிறார்கள்; அங்கு ‘பணியாளர்கள்’ இயல்பான மரியாதைமொழி. இரண்டாம் இடத்தில் தண்டனையாக கட்டுப்பட்ட அடிமைநிலை தெளிவாக முன்வைக்கப்படுவதால் ‘அடிமைகள்’ பொருத்தமானது.
- issue: וָמֵת என்பதன் வினை வலிமை
  choice: ‘அவன் சாகட்டும்’ என்ற முன்மொழிவு/விருப்ப வலிமை
  alternative: ‘அவன் சாவான்’ என்ற எதிர்கால அல்லது உறுதியான விளைவு
  rationale: எபிரெய வடிவம் இலக்கணரீதியாக நிறைவுவினையாக இருந்தாலும், இந்த உறுதிமொழி போன்ற சூழலில் தண்டனையை முன்வைக்கும் வலிமை கொண்டதாகப் புரிந்துகொள்ளலாம். மாற்று வாசிப்பை அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அதிகாரியிடம் பேசும் மரியாதைத் தொனியைப் பேணும் வகையில் ‘உமது’, ‘என் தலைவர்’ பயன்படுத்தப்பட்டுள்ளன. வாக்கியம் கண்ணியமாகவும் பொதுவாசகர்களுக்குப் புரியும்படியும் அமைக்கப்பட்டுள்ளது; சட்டரீதியான அடிமைநிலை இரண்டாம் עבד சொல்லில் தெளிவாக்கப்பட்டுள்ளது.
