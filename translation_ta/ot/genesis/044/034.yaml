source:
  edition: WLC
  text: כִּי אֵיךְ֙ אֶֽעֱלֶ֣ה אֶל אָבִ֔/י וְ/הַ/נַּ֖עַר אֵינֶ֣/נּוּ אִתִּ֑/י פֶּ֚ן אֶרְאֶ֣ה בָ/רָ֔ע אֲשֶׁ֥ר יִמְצָ֖א אֶת אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/034.yaml
  text: For how can I go up to my father if the boy is not with me? Otherwise, I would have to see the disaster that would come upon my father.
translation:
  language: ta
  text: அந்தப் பையன் என்னுடன் இல்லாதிருக்கையில், நான் எப்படி என் தந்தையிடம் செல்வேன்? என் தந்தைக்கு நேரிடும் துயரத்தை நான் காண நேரிடுமோ!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶעֱלֶה
  choice: திரும்பிப் போவேன்
  rationale: எபிரெயச் சொல் சொற்படியாக ‘மேலே செல்வேன்’ என்றாலும், இச்சூழலில் தந்தையிடம் திரும்பிச் செல்வதைக் குறிக்கிறது; இயல்பான தமிழுக்காக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הַנַּעַר
  choice: அந்தப் பையன்
  rationale: இங்கு யூதா பென்யமீனைச் சுட்டுகிறார்; ‘பையன்’ என்பது נַעַר என்பதன் சூழலுக்கேற்ற பொதுவான பொருள்.
- source_word: בָרָע
  choice: துயரத்தை
  rationale: רָעָה என்பது தீங்கு, பேரிடர், துன்பம் ஆகிய பரப்பைக் கொண்டது. தந்தைக்கு ஏற்படவிருக்கும் கடும் வேதனையையும் அழிவூட்டும் விளைவையும் இயல்பாக வெளிப்படுத்த ‘துயரம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יִמְצָא אֶת־אָבִי
  choice: என் தந்தைக்கு நேரிடும்
  rationale: சொற்படியாக ‘என் தந்தையைக் கண்டடையும்’; தமிழில் ஒரு தீங்கு ஒருவருக்கு நிகழ்வதை ‘நேரிடும்’ என்பது தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், யூதாவின் உணர்ச்சிமிக்க வேண்டுகோளையும் வினாவாக அமைந்த எபிரெய வாக்கியத்தின் வலிமையையும் காக்கும் கண்ணியமான நடை. இறுதியிலுள்ள פֶּן என்பதன் அச்சம்/தவிர்க்க முடியாத விளைவு இங்கு ‘காண வேண்டியதாகிவிடுமே’ என வெளிப்படுத்தப்பட்டுள்ளது.
