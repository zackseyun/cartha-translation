translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையான ஒருமை (‘நீர்’, ‘உமது’) பயன்படுத்தப்பட்டுள்ளது. அரசவைச் சூழலின் பணிவைத் தக்கவைத்தபடியே, மிகப் பழமையான அல்லது சமய வழக்குக்கு மட்டும் உரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
