source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל עֲבָדֶ֔י/ךָ אִם לֹ֥א יֵרֵ֛ד אֲחִי/כֶ֥ם הַ/קָּטֹ֖ן אִתְּ/כֶ֑ם לֹ֥א תֹסִפ֖וּ/ן לִ/רְא֥וֹת פָּנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/023.yaml
  text: And you said to your servants[a], ‘If your youngest brother does not come down with you, you shall not continue to see my face.’
translation:
  language: ta
  text: நீர் உமது பணியாளர்களிடம், ‘உங்கள் இளைய சகோதரன் உங்களோடு இறங்கி வராவிட்டால், நீங்கள் மீண்டும் என் முகத்தைக் காணமாட்டீர்கள்[a]’ என்று சொன்னீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பொருளை இயல்பாகக் கூறினால், “நீங்கள் மீண்டும் என் முன்னிலையில் வரமாட்டீர்கள்.”
    reason: ‘என் முகத்தைக் காணுதல்’ என்பது ஒருவரின் முன்னிலையில் வந்து நிற்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: என்று சொன்னீர்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரில் வரும் இறந்தகால வினை; யோசேப்பை மரியாதையாக ஒருமையில் விளிக்கத் தமிழில் ‘சொன்னீர்’ என வழங்கப்பட்டது.
- source_word: עֲבָדֶיךָ
  choice: உமது பணியாளர்களிடம்
  rationale: עבד என்பதற்கு ‘அடிமை’ என்றும் பொருள் உண்டு; ஆனால் இங்கு யூதா அரசவை மரியாதையுடன் தன்னையும் சகோதரர்களையும் குறிப்பிடுவதால், கட்டாய அடிமை நிலையைக் கூடுதலாக உணர்த்தாத ‘பணியாளர்கள்’ பொருத்தமானது.
- source_word: אִם לֹא
  choice: வராவிட்டால்
  rationale: எதிர்மறை நிபந்தனையைத் தமிழில் இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: יֵרֵד
  choice: இறங்கி வராவிட்டால்
  rationale: ירד என்பதன் திசை சார்ந்த ‘கீழே இறங்கு’ என்ற பொருளையும், எகிப்திலுள்ள பேச்சாளரை நோக்கி வருவதையும் தக்கவைக்கிறது.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: உங்கள் இளைய சகோதரன்
  rationale: குழுவில் வயதில் இளையவனைக் குறிக்கிறது; வெறுமனே ‘தம்பி’ என்பதைவிட மூலத்தின் ஒப்பீட்டுப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: אִתְּכֶם
  choice: உங்களோடு
  rationale: உடன்செல்லுதலை எளிய, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא תֹסִפוּן לִרְאוֹת פָּנָי
  choice: நீங்கள் மீண்டும் என் முகத்தைக் காணமாட்டீர்கள்
  rationale: יסף கட்டமைப்பின் ‘இனி/மீண்டும் செய்யாதிருத்தல்’ என்ற பொருளையும், ‘என் முகத்தைக் காணுதல்’ என்ற எபிரெய உருவகத்தையும் காக்கிறது.
