revisions:
- from: அதற்கு அவன், “இப்போதும் நீங்கள் சொன்னபடியே ஆகட்டும். எவனிடம் அது கண்டுபிடிக்கப்படுகிறதோ, அவன் எனக்கு அடிமையாக இருப்பான்; மற்றவர்களாகிய நீங்கள் குற்றமற்றவர்களாக இருப்பீர்கள்” என்றான்.
  to: அவன் பதிலளித்து, “இப்போதும், நீங்கள் சொன்னபடியே ஆகட்டும். அது எவனிடம் கண்டுபிடிக்கப்படுகிறதோ, அவன் எனக்கு அடிமையாக இருப்பான்; நீங்கள் குற்றமற்றவர்களாக இருப்பீர்கள்” என்றான்.
  rationale: The revision retains the draft’s faithful rendering and its essential sentence break, while removing an interpretive addition in the final plural clause. “அவன் பதிலளித்து” is also a more natural modern Tamil narrative introduction than “அதற்கு அவன்.”
