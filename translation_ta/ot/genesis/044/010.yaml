source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר גַּם עַתָּ֥ה כְ/דִבְרֵי/כֶ֖ם כֶּן ה֑וּא אֲשֶׁ֨ר יִמָּצֵ֤א אִתּ/וֹ֙ יִהְיֶה לִּ֣/י עָ֔בֶד וְ/אַתֶּ֖ם תִּהְי֥וּ נְקִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/010.yaml
  text: And he said[a], “Even now, let it be according to your words. The one with whom it is found will be my servant[b], and you will be innocent.”
translation:
  language: ta
  text: அவன் பதிலளித்து, “இப்போதும், நீங்கள் சொன்னபடியே ஆகட்டும். அது எவனிடம் கண்டுபிடிக்கப்படுகிறதோ, அவன் எனக்கு அடிமையாக இருப்பான்; நீங்கள் குற்றமற்றவர்களாக இருப்பீர்கள்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: இப்போதும்
  rationale: உடனடியான பதிலையும் גַּם என்பதன் வலியுறுத்தலையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: כְדִבְרֵיכֶם כֶּן הוּא
  choice: நீங்கள் சொன்னபடியே ஆகட்டும்
  rationale: அவர்கள் கூறியதற்குப் பதிலாக ஒப்புதல் தெரிவிக்கும் எபிரெயச் சொற்றொடரை இயல்பாகப் பிரதிபலிக்கிறது; அடுத்த வாக்கியத்திலிருந்து தனியாக வைத்து, அவர்களின் கடுமையான முன்மொழிவை அப்படியே ஏற்றதாகத் தவறாகப் புரிந்துகொள்வதைத் தவிர்க்கிறது.
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ
  choice: எவனிடம் அது கண்டுபிடிக்கப்படுகிறதோ
  rationale: கிண்ணம் யாருடைய உடைமையில் கிடைக்கிறதோ அவரைச் சுட்டும் தொடர்புவாக்கியத்தை நெருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: יִהְיֶה לִּי עָבֶד
  choice: அவன் எனக்கு அடிமையாக இருப்பான்
  rationale: עֶבֶד இச்சூழலில் தண்டனையாக விதிக்கப்படும் கட்டாயப் பிணைப்பட்ட நிலையைக் குறிக்கிறது; ஆகவே பொதுவான பணியாளரைக் குறிக்கும் ‘வேலைக்காரன்’ என்பதைக் காட்டிலும் ‘அடிமை’ துல்லியமானது. יִהְיֶה என்பதற்கு ‘இருப்பான்’ நெருக்கமானது.
- source_word: וְאַתֶּם תִּהְיוּ נְקִיִּם
  choice: மற்றவர்களாகிய நீங்கள் குற்றமற்றவர்களாக இருப்பீர்கள்
  rationale: נְקִיִּם என்பது குற்றத்திலிருந்தும் அதற்கான பொறுப்பிலிருந்தும் விடுபட்டிருப்பதைக் குறிக்கிறது. தமிழில் யாரை ‘நீங்கள்’ குறிக்கிறது என்பதைத் தெளிவுபடுத்த ‘மற்றவர்களாகிய’ சேர்க்கப்பட்டுள்ளது.
