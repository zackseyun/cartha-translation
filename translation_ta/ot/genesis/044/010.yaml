translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகர்களுக்குத் தெளிவாகவும் கண்ணியமாகவும் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையிலுள்ள முக்கிய இடைநிறுத்தத்தைப் பின்பற்றி முதல் ஒப்புதல் கூற்றுக்கும் அடுத்த தண்டனைத் தீர்ப்புக்கும் இடையில் முற்றுப்புள்ளி வைக்கப்பட்டது.
