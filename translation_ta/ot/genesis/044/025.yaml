  yaml_path: translation/ot/genesis/044/025.yaml
  text: Then our father said[a], ‘Go back; buy us a little food.’
translation:
  language: ta
  text: அப்போது எங்கள் தந்தை, ‘நீங்கள் திரும்பிப் போய், நமக்குக் கொஞ்சம் உணவு வாங்குங்கள்’ என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திரும்புங்கள்; நமக்குக் கொஞ்சம் தானியம் வாங்குங்கள்.’ எபிரெயத்தில் பொதுவாக ‘உணவு’ எனப் பொருள்படும் சொல் உள்ளது; எனினும் விரிந்த சூழல் தானியத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் ‘அப்போது’ அதன் தொடர்ச்சியுணர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אָבִינוּ
  choice: எங்கள் தந்தை
  rationale: இங்கு சகோதரர்களின் நேரடித் தந்தையான யாக்கோபையே குறிக்கிறது.
- source_word: שֻׁבוּ
  choice: திரும்பிப் போய்
  rationale: மீண்டும் முந்தைய இடத்திற்குப் பயணம் செய்யும்படி கட்டளையிடும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: שִׁבְרוּ
  choice: வாங்கி வாருங்கள்
  rationale: யோசேப்பின் கதையில் இந்த வினை உணவு அல்லது தானியம் வாங்குவதைக் குறிக்கிறது; தமிழில் பயணத்தின் நோக்கத்தையும் திரும்பிவருவதையும் இயல்பாகச் சொல்வதற்காக ‘வாங்கி வாருங்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: לָנוּ
  choice: நமக்கு
  rationale: பேசுகிற தந்தை தன்னையும் கேட்போரையும் உள்ளடக்குவதால், மேற்கோள் பேச்சுக்குள் உள்ளடக்கும் பன்மையான ‘நமக்கு’ பொருத்தமானது.
- source_word: מְעַט
  choice: கொஞ்சம்
  rationale: சிறிய அளவைக் குறிக்கும் எளிய, இயல்பான நவீனத் தமிழ் சொல்.
- source_word: אֹכֶל
  choice: உணவு
  rationale: எபிரெயச் சொல் பொதுவாக உணவைக் குறிக்கிறது; சூழலில் தானியம் என்றாலும் மூலத்தின் பரந்த பொருளைச் சுருக்காமல் காக்கிறது.
