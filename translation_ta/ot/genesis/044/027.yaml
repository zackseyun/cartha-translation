  yaml_path: translation/ot/genesis/044/027.yaml
  text: Then your servant[a], my father, said to us, ‘You know that my wife bore me two sons.’
translation:
  language: ta
  text: அப்போது உமது பணியாளராகிய என் தந்தை எங்களிடம், ‘என் மனைவி எனக்கு இருவரைப் பெற்றாள் என்பது உங்களுக்கே தெரியும்’ என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுப்பதால், இயல்பான தமிழ் கதைநடையில் ‘அப்போது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עַבְדְּךָ אָבִי
  choice: என் தந்தையாகிய உமது பணியாளர்
  rationale: யூதா யோசேப்பிடம் காட்டும் பணிவையும், குறிப்பிடப்படுபவர் தன் தந்தை என்பதையும் ஒருங்கே காக்கிறது.
- source_word: אֵלֵינוּ
  choice: எங்களிடம்
  rationale: ‘எங்களுக்குச் சொன்னார்’ என்ற பொருளை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: אַתֶּם יְדַעְתֶּם
  choice: உங்களுக்கே தெரியும்
  rationale: வெளிப்படையாக வரும் இரண்டாம் நபர் பன்மைப் பெயர்ச்சொல்லின் வலியுறுத்தலை ‘-க்கே’ மூலம் காக்கிறது; மேற்கோளின் சூழலில் தொடரும் அறிவை நிகழ்காலத் தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: כִּי
  choice: என்பது
  rationale: அறியப்பட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இணைப்பாக உள்ளது.
- source_word: שְׁנַיִם
  choice: இருவரை
  rationale: எபிரெயத்தில் ‘இரண்டு’ என்பது மட்டும் உள்ளது; மனிதர்களைக் குறிக்கும் சூழலைத் தமிழின் உயர்திணை எண்ணுப்பெயர் இயல்பாக வெளிப்படுத்துகிறது, ‘மகன்கள்’ என்பதை உரைக்குள் சேர்க்காமல் மூலத்தின் சுருக்கத்தையும் காக்கிறது.
- source_word: יָלְדָה לִּי
  choice: எனக்கு ... பெற்றாள்
  rationale: எபிரெய வினை மற்றும் மறைமுகப் பொருளை இயல்பான தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: אִשְׁתִּי
  choice: என் மனைவி
  rationale: இச்சூழலில் אִשָּׁה என்பதன் திருமண உறவுப் பொருள் தெளிவாக உள்ளது.
