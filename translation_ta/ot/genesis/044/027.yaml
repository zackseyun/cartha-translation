- from: அப்போது என் தந்தையாகிய உமது பணியாளர் எங்களிடம், ‘என் மனைவி எனக்கு இருவரைப் பெற்றாள் என்பது உங்களுக்கே தெரியும்[a]’ என்றார்.
  to: அப்போது உமது பணியாளராகிய என் தந்தை எங்களிடம், ‘என் மனைவி எனக்கு இருவரைப் பெற்றாள் என்பது உங்களுக்கே தெரியும்’ என்றார்.
  rationale: The revision changes only the word order of the appositional phrase to idiomatic modern Tamil. It retains the source's unspecified “two” as «இருவரை» and removes the now-inapplicable lexical-addition footnote.
