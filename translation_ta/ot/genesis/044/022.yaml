base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/022.yaml
  text: And we said to my lord[a], ‘The boy cannot leave his father, for if he should leave his father, he would die.’
translation:
  language: ta
  text: நாங்கள் என் ஆண்டவரிடம், “அந்த இளைஞனால் தன் தந்தையை விட்டுப் பிரிய முடியாது; அவன் தன் தந்தையை விட்டுப் பிரிந்தால், அவர் இறந்துவிடுவார்[a]” என்று சொன்னோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “அவன் தன் தந்தையை விட்டுப் பிரிகிறான்; பின்னர் இறக்கிறான்” எனலாம். “இறக்கிறான்” என்பதற்கான எழுவாயை எபிரெயம் வெளிப்படையாகக் குறிப்பிடவில்லை; சூழல் அது தந்தையைக் குறிப்பதாகக் காட்டுகிறது.
    reason: மூல எபிரெயத்தின் மறைமுக எழுவாயையும் சொற்சொல் மாற்றையும் பதிவு செய்தல்.
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: அப்போது நாங்கள் ... சொன்னோம்
  rationale: தொடர்நிகழ்வைக் குறிக்கும் wayyiqtol வடிவத்தின் கதை ஓட்டத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶל אֲדֹנִי
  choice: என் ஆண்டவரிடம்
  rationale: யோசேப்பிடம் யூதா காட்டும் அரசவை மரியாதையையும் முதல் நபர் ஒருமை உடைமைப் பின்னொட்டையும் காக்கிறது.
- source_word: לֹא יוּכַל
  choice: முடியாது
  rationale: יכולת அல்லது ஆற்றலின்மையை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: הַנַּעַר
  choice: அந்த இளைஞன்
  rationale: נער என்பது சிறுவன் முதல் இளைஞன் வரை குறிக்கக்கூடும்; பென்யமீனைத் தந்தையோடு சார்புடையவராகச் சித்தரிக்கும் சூழலைக் காத்துக்கொண்டே, வயதை அளவுக்கு மீறிக் குறைக்காத சொல்லாக ‘இளைஞன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לַעֲזֹב
  choice: விட்டுப் பிரிய
  rationale: இங்கு עזב என்பது ஒழுக்கநெறி சார்ந்த ‘கைவிடுதல்’ என்பதைக் காட்டிலும் ஒருவரை விட்டு அகல்வதைக் குறிக்கிறது.
- source_word: אָבִיו
  choice: தன் தந்தை
  rationale: எபிரெயத்தில் இருமுறை வரும் உறவுக் குறிப்பைத் தமிழிலும் இருமுறை காத்து, இயல்பான தற்சுட்டு வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְעָזַב
  choice: அவன் ... விட்டுப் பிரிந்தால்
  rationale: இணைப்புடன் வரும் qatal வடிவம் இச்சூழலில் நிபந்தனைப் பொருளில் செயல்படுவதால், தமிழில் ‘பிரிந்தால்’ எனத் தரப்பட்டுள்ளது.
- source_word: וָמֵת
  choice: அவரோ இறந்துவிடுவார்
  rationale: எபிரெயத்தில் வினையின் எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை. அடுத்துள்ள சூழல் தந்தையே இறப்பார் என்பதைக் காட்டுவதால் முதன்மை உரையில் மரியாதை ஒருமையான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் வடிவ ambiguity அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: וָמֵת என்பதன் மறைமுக எழுவாய்
  choice: தந்தை இறந்துவிடுவார் என்று முதன்மை உரையில் வெளிப்படுத்தப்பட்டது
  alternative: இளைஞன் இறந்துவிடுவான்; அல்லது எழுவாயைத் தெளிவுபடுத்தாமல் ‘இறப்பு நேரிடும்’ என்று மொழிபெயர்த்தல்
  rationale: எபிரெய வடிவம் எழுவாயைப் பெயரிட்டு கூறாவிட்டாலும், ஆதியாகமம் 44:31-இன் உடனடி விரிவாக்கம் மகன் இல்லாமல் வந்தால் தந்தை இறப்பார் எனத் தெளிவாக்குகிறது. இருப்பினும் இலக்கண வடிவின் தெளிவின்மை அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான அரசவைப் பேச்சுநடை பயன்படுத்தப்பட்டுள்ளது. ‘தகப்பன்’ என்பதற்குப் பதிலாக இன்றைய பொதுவழக்கில் இயல்பான ‘தந்தை’ தேர்ந்தெடுக்கப்பட்டது; யோசேப்புக்கான மரியாதை ‘என் ஆண்டவர்’ என்ற சொல்லால் காக்கப்பட்டுள்ளது.
