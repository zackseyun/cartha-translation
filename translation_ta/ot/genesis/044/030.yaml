  yaml_path: translation/ot/genesis/044/030.yaml
  text: Now[a], when I come to your servant my father[b], and the boy is not with us—his life being bound up with the boy’s life—
translation:
  language: ta
  text: இப்போது, உமது அடியவனாகிய என் தந்தையிடம் நான் வரும்போது, இளைஞன் எங்களோடு இல்லாதபோது—அவருடைய உயிர் இளைஞனுடைய உயிரோடு பிணைக்கப்பட்டிருக்கிற நிலையில்[a][b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல் மொழிபெயர்த்தால், “அவருடைய நெஃபெஷ் அவனுடைய நெஃபெஷோடு பிணைக்கப்பட்டுள்ளது.” எபிரெயத்தில் נֶפֶשׁ (நெஃபெஷ்) என்ற ஒரே சொல் இருவருக்கும் பயன்படுத்தப்பட்டுள்ளது; அது இங்கு ‘உயிர்/தன்னுயிர்’ என்ற பொருளைத் தருகிறது. இரண்டாவது சுட்டுப்பின்னொட்டு சூழலின்படி இளைஞனாகிய பென்யமீனைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இதனை, “இளைஞன் எங்களோடு இல்லாதபோது, ஏனெனில் அவருடைய உயிர் இளைஞனுடைய உயிரோடு பிணைக்கப்பட்டிருக்கிறது—” என்றும் மொழிபெயர்க்கலாம்.
    reason: syntactic_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: யூதா தன் வேண்டுகோளின் அடுத்த நிலையை முன்வைப்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; தொடக்க ו என்பதன் தொடர்ச்சிப் பொருள் உரையோட்டத்தில் உள்ளடங்கியுள்ளது.
- source_word: כְּבֹאִי
  choice: நான் வரும்போது
  rationale: כְּ + வினையெச்சப் பெயர் + முதலாம் நபர் ஒருமை பின்னொட்டு ஆகியவை தரும் காலப் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֶל־עַבְדְּךָ אָבִי
  choice: உமது அடியவனாகிய என் தந்தையிடம்
  rationale: யோசேப்பிடம் யூதா காட்டும் பணிவையும், ‘உமது அடியவன்’ என்பது ‘என் தந்தை’ என்பதைக் குறிப்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַנַּעַר
  choice: இளைஞன்
  rationale: נַעַר என்பது இச்சூழலில் சிறு குழந்தையை அவசியம் குறிக்காமல் இளவயதினரைக் குறிக்கிறது; ‘இளைஞன்’ நவீனத் தமிழில் வயது சார்ந்த தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: אֵינֶנּוּ אִתָּנוּ
  choice: எங்களோடு இல்லாவிட்டால்
  rationale: எதிர்நோக்கப்படும் சூழ்நிலைக்குள் வரும் எளிய எதிர்மறை இருப்புக் கூற்றைத் தமிழின் நிபந்தனைத் தொடரமைப்பில் இயல்பாக வழங்குகிறது.
- source_word: וְנַפְשׁוֹ
  choice: அவருடைய உயிர்
  rationale: இங்கு נֶפֶשׁ தந்தையின் உயிரையும் வாழ்வையும் குறிக்கிறது; தொழில்நுட்பமான ‘ஆத்துமா’ என்பதைக் காட்டிலும் ‘உயிர்’ சூழலுக்குப் பொருத்தமானது.
- source_word: קְשׁוּרָה
  choice: பிணைக்கப்பட்டிருக்கிற
  rationale: செயப்படுபொருள் நிலையை உணர்த்தும் எபிரெயப் பங்கேற்பு வடிவத்தையும் ஆழமான உறவுப் பிணைப்பையும் பாதுகாக்கிறது.
- source_word: בְנַפְשׁוֹ
  choice: இளைஞனுடைய உயிரோடு
  rationale: இறுதிப் பின்னொட்டு சூழலின்படி பென்யமீனைக் குறிக்கிறது; தமிழில் பெயரைக் கூறுவது சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: וְנַפְשׁוֹ קְשׁוּרָה בְנַפְשׁוֹ என்ற தொடரின் தொடர்பு
  choice: ‘பிணைக்கப்பட்டிருக்கிற நிலையில்’ எனச் சூழ்நிலைப் பங்கேற்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஏனெனில் ... பிணைக்கப்பட்டிருக்கிறது’ என்று காரணவாக்கியமாக மொழிபெயர்க்கலாம்.
  rationale: எபிரெயப் பங்கேற்பு தந்தையின் நிலையை விளக்குகிறது; காரணப் பொருள் சூழலில் சாத்தியமானதாயினும், அதை வெளிப்படையாகத் தீர்மானிக்காமல் மூலத்தின் திறந்த தொடர்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. யூதாவின் பணிவான அரண்மனைப் பேச்சைத் தக்கவைக்க ‘உமது அடியவன்’ வைக்கப்பட்டது. வசனம் அடுத்த வசனத்தில் நிறைவடையும் நிபந்தனைத் தொடராக இருப்பதால், முடிவில் நீண்ட கோடு வைத்து அதன் நிறைவுறாத அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
