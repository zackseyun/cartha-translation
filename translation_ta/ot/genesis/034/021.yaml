base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/021.yaml
  text: These men are at peace with us[a]. Let them dwell in the land and trade in it, for, you see, the land is broad enough for them. We will take their daughters for wives for ourselves[d][c][b], and we will give our daughters to them.
translation:
  language: ta
  text: “இந்த மனிதர்கள் நம்முடன் சமாதானமாக இருக்கிறார்கள்[a]. அவர்கள் இந்த நாட்டில் குடியிருந்து, அதில் வணிகம் செய்யட்டும்[b]. இதோ, அவர்களுக்கு இடமளிக்கும் அளவுக்கு நாடு விசாலமாக இருக்கிறது[c]. அவர்களுடைய மகள்களை நமக்கு மனைவிகளாக எடுத்துக்கொள்வோம்; நம்முடைய மகள்களை அவர்களுக்குக் கொடுப்போம்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நம்முடன் நட்புறவாக இருக்கிறார்கள்” அல்லது “நம்முடன் நல்லுறவில் இருக்கிறார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அதன் வழியாக வணிகம் செய்யட்டும்” என்றும் பொருள் கொள்ளலாம்; எபிரெயச் சொற்றொடர் நாட்டிற்குள் நடைபெறும் வணிகத்தையோ, அதன் வழியாக நடைபெறும் வணிகத்தையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “இதோ, நாடு அவர்களுக்கு முன்பாகக் கைகளின் அகலமுடையதாக இருக்கிறது” என்று உள்ளது. இது அவர்களுக்குப் போதிய இடமும் விரிவும் இருப்பதைக் குறிக்கும் ஓர் எபிரெய மொழிமரபு.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁלֵמִים
  choice: நம்முடன் சமாதானமாக இருக்கிறார்கள்
  rationale: இச்சூழலில் இந்தச் சொல் முழுமை என்ற பொதுப்பொருளைவிட, இரு தரப்பினருக்கிடையேயான அமைதியான உறவைக் குறிக்கிறது; தமிழ் வாசகர்களுக்கு இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וְיֵשְׁבוּ
  choice: குடியிருக்கட்டும்
  rationale: வடிவில் imperfect ஆக இருந்தாலும், நகரத்தார் இவர்களைக் குடியேற அனுமதிக்க வேண்டும் என்ற ஊக்குவிப்பு அல்லது முன்மொழிவாக இங்கு செயல்படுகிறது.
- source_word: וְיִסְחֲרוּ אֹתָהּ
  choice: அதில் வணிகம் செய்யட்டும்
  rationale: סחר வணிகச் செயல்பாட்டைக் குறிக்கிறது; பெண்பால் சுட்டுப்பெயர் நாட்டைக் குறிக்கிறது. இடத்திற்குள் அல்லது அதன் வழியாக வணிகம் செய்வது என்ற சாத்தியமான நுணுக்கத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: רַחֲבַת יָדַיִם לִפְנֵיהֶם
  choice: அவர்களுக்கு இடமளிக்கும் அளவுக்கு நாடு விசாலமாக இருக்கிறது
  rationale: ‘கைகளில் அகன்றது, அவர்களுக்கு முன்பாக’ என்ற எபிரெய மொழிமரபு, அவர்கள் குடியிருக்கப் போதிய பரப்பும் இடமும் உள்ளதைக் குறிக்கிறது; தமிழில் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נִקַּח לָנוּ לְנָשִׁים
  choice: நமக்கு மனைவிகளாக எடுத்துக்கொள்வோம்
  rationale: முதல் நபர் பன்மை imperfect இங்கு பரிந்துரை அல்லது கூட்டு நோக்கத்தை வெளிப்படுத்துகிறது; לָנוּ என்பதும் தமிழ் உரையில் ‘நமக்கு’ என்று பாதுகாக்கப்படுகிறது.
- source_word: נִתֵּן לָהֶם
  choice: நம்முடைய மகள்களை அவர்களுக்குக் கொடுப்போம்
  rationale: முந்தைய மணவுறவு முன்மொழிவுக்கு இணையான பரஸ்பர ஏற்பாட்டை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: காரணமாக முன்வைக்கப்படும் நாட்டின் விசாலத்தன்மைக்கு கவனத்தை ஈர்க்கும் உரையாடல் குறியீட்டின் வலிமையை, நவீனமும் கண்ணியமுமான தமிழில் காக்கிறது.
