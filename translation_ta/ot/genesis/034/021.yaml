translation_notes:
  register: நவீன தரநிலைத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பான, கண்ணியமான உரைநடை. உரையின் பேச்சுத் தன்மையை மேற்கோள் குறிகள் காட்டுகின்றன. எபிரெய மொழியின் ஊக்குவிப்பு வடிவம் ‘-ட்டும்’ மற்றும் ‘-வோம்’ வழியாகவும், הִנֵּה என்பதன் கவன ஈர்ப்பு ‘இதோ’ வழியாகவும் காக்கப்பட்டுள்ளது.
