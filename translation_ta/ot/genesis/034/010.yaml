source:
  edition: WLC
  text: וְ/אִתָּ֖/נוּ תֵּשֵׁ֑בוּ וְ/הָ/אָ֨רֶץ֙ תִּהְיֶ֣ה לִ/פְנֵי/כֶ֔ם שְׁבוּ֙ וּ/סְחָר֔וּ/הָ וְ/הֵֽאָחֲז֖וּ בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/010.yaml
  text: You may dwell with us[a], and the land will be before you. Settle in it, trade in it[b], and acquire property in it.
translation:
  language: ta
  text: “நீங்கள் எங்களோடு குடியிருக்கலாம்; இந்த நிலம் உங்கள் முன் இருக்கும்.[a] இதில் குடியிருங்கள், வணிகம் செய்யுங்கள், இதில் உடைமை பெறுங்கள்.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “இந்த நிலம் உங்களுக்குக் கிடைக்கும்.” சொல்லுக்குச் சொல்: “இந்த நிலம் உங்கள் முன் இருக்கும்.”'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இதில் உடைமைகளைப் பெறுங்கள்” அல்லது “இதில் நிலவுரிமை பெறுங்கள்.” எபிரெயச் சொற்றொடர் நிலத்தில் ஒரு உடைமை அல்லது சொத்துரிமை பெறுவதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתָּנוּ תֵּשֵׁבוּ
  choice: நீங்கள் எங்களோடு குடியிருக்கலாம்
  rationale: יָשַׁב என்பதன் குடியிருத்தல் அல்லது வாழ்தல் என்ற பொருளைத் தருகிறது. இச்சூழலில் இது கட்டளையோ முன்னறிவிப்போ அல்லாமல் அழைப்பாக இருப்பதால், ‘குடியிருக்கலாம்’ என்பது இயல்பான அனுமதி/அழைப்பு நயத்தை வெளிப்படுத்துகிறது.
- source_word: וְהָאָרֶץ תִּהְיֶה לִפְנֵיכֶם
  choice: இந்த நாடு உங்கள் முன் இருக்கும்
  rationale: ‘உங்கள் முன் இருக்கும்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, நாடு அவர்களுக்குக் கிடைக்கக்கூடியதாக இருக்கும் என்ற சூழ்நிலைப் பொருளை அடிக்குறிப்பில் விளக்குகிறது. הָאָרֶץ இங்கு சுற்றியுள்ள நிலப்பகுதியைக் குறிப்பதால் ‘இந்த நாடு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שְׁבוּ
  choice: இதில் குடியேறி
  rationale: முதல் יָשַׁב வடிவத்தின் குடியிருப்பு சார்ந்த பொருளையே இக்கட்டளை தொடர்கிறது; இங்கு நிலத்தில் நிரந்தரமாக வாழத் தொடங்கும் கருத்தை ‘குடியேறி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּסְחָרוּהָ
  choice: வணிகம் செய்து
  rationale: סחר என்பது வாணிக அல்லது வர்த்தக நடவடிக்கையைச் சுட்டுகிறது. ‘வணிகம் செய்து’ என்பது நவீனத் தமிழில் தெளிவாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: וְהֵאָחֲזוּ בָּהּ
  choice: நிலச்சொத்துகளைப் பெற்றுக்கொள்ளுங்கள்
  rationale: אָחַז என்பதன் நிபால் வடிவம் இங்கு நிலத்தில் உடைமை அல்லது நிலவுரிமை பெறுவதைக் குறிக்கலாம். வெறுமனே நிலத்தைக் கைப்பற்றுதல் என்ற பொருளைத் திணிக்காமல், சமூக-சட்டச் சூழலை ‘நிலச்சொத்துகளைப் பெற்றுக்கொள்ளுங்கள்’ வெளிப்படுத்துகிறது.
