translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிமையும் கொண்ட நேரடி உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் இணை வாக்கிய ஓட்டம் காக்கப்பட்டுள்ளது; ‘உங்கள் முன் இருக்கும்’ என்ற உண்மையான உருவகத் தெளிவின்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
