source:
  edition: WLC
  text: וַ/יָּבֹ֥א חֲמ֛וֹר וּ/שְׁכֶ֥ם בְּנ֖/וֹ אֶל שַׁ֣עַר עִירָ֑/ם וַֽ/יְדַבְּר֛וּ אֶל אַנְשֵׁ֥י עִירָ֖/ם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/020.yaml
  text: So Hamor and Shechem his son came to the gate of their city and spoke to the men of their city[a], saying[b],
translation:
  language: ta
  text: 'ஹாமோரும் அவனுடைய மகன் சீகேமும் தங்கள் நகரத்தின் வாசலுக்கு வந்து, தங்கள் நகரத்து ஆண்களிடம் இவ்வாறு பேசினார்கள்[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நகர வாசல் அக்காலத்தில் பொதுவிவகாரங்கள் ஆலோசிக்கப்பட்ட இடமாக இருந்தது; இங்கு ‘நகரத்து ஆண்கள்’ என்பது அங்கு கூடியிருந்த ஆண் நகரவாசிகளைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்து
  rationale: בוא என்பதன் Qal wayyiqtol கதைநிகழ்வை முன்னெடுக்கிறது; குறிப்பிடப்பட்ட இடத்தை அடைவதை இயல்பான தமிழில் ‘வந்து’ எனத் தருகிறது.
- source_word: חֲמוֹר
  choice: ஆமோர்
  rationale: தனிப்பெயரை மொழிபெயர்க்காமல், நவீனத் தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: וּשְׁכֶם בְּנוֹ
  choice: அவனுடைய மகன் சீகேமும்
  rationale: மகன் என்ற உறவை வெளிப்படையாகக் காத்து, இயல்பான தமிழ் சொல் வரிசையைப் பயன்படுத்துகிறது.
- source_word: אֶל שַׁעַר עִירָם
  choice: தங்கள் நகரத்தின் வாசலுக்கு
  rationale: שַׁעַר என்பதன் நேரடியான பொருளான ‘வாசல்’ என்பதையும், עִירָם உள்ள பன்மை உடைமைப் பின்னொட்டையும் காக்கிறது.
- source_word: וַיְדַבְּרוּ
  choice: பேசினார்கள்
  rationale: דבר + אֶל என்பது ஒருவரிடம் பேசுதல் அல்லது உரையாற்றுதல் என்று பொருள்படும்; பொதுக்கூட்டச் சூழலுக்கும் இது பொருந்துகிறது.
- source_word: אֶל אַנְשֵׁי עִירָם
  choice: தங்கள் நகரத்து ஆண்களிடம்
  rationale: אַנְשֵׁי என்பதிலுள்ள ஆண்பால் குறிப்பை ‘ஆண்கள்’ என்று காக்கிறது; நடுநிலையான ‘மக்கள்’ என்று மாற்றவில்லை.
- source_word: לֵאמֹר
  choice: 'பேசினார்கள்:'
  rationale: அடுத்த வசனத்தில் நேரடிக் கூற்று வருவதால், தமிழில் இரட்டிப்பாக ஒலிக்கும் ‘இவ்வாறு சொல்லி’ என்பதைத் தவிர்த்து முக்காற்புள்ளி மூலம் பேச்சு அறிமுகச் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. எபிரெய உரையின் ‘தங்கள் நகரத்தின் வாசல்’ என்ற உடைமை அமைப்பும், ‘நகரத்து ஆண்கள்’ என்ற பாலினக் குறிப்பும் பாதுகாக்கப்பட்டுள்ளன. வசனம் அடுத்த வசனத்தின் நேரடிப் பேச்சை அறிமுகப்படுத்துவதால் இறுதியில் முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
