revisions:
- from: 'ஆமோரும் அவனுடைய மகன் சீகேமும் தங்கள் நகரத்தின் வாசலுக்கு வந்து, தங்கள் நகரத்து ஆண்களிடம் பேசினார்கள்[a]:'
  to: 'ஹாமோரும் அவனுடைய மகன் சீகேமும் தங்கள் நகரத்தின் வாசலுக்கு வந்து, தங்கள் நகரத்து ஆண்களிடம் இவ்வாறு பேசினார்கள்[a]:'
  rationale: The revision corrects the transliteration of Hamor and renders the Hebrew speech introducer explicitly and idiomatically. It otherwise preserves the draft’s accurate syntax, civic-gate wording, and gender-specific reference to the town’s men.
