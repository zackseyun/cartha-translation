  terminology: Names are correctly transliterated as அமோர் and சீகேம். “மனைவியாகக் கொடுங்கள்” clearly conveys giving her in marriage. The revised footnote retains the Hebrew soul/attachment imagery without calling an interpretive Tamil paraphrase strictly word-for-word.
