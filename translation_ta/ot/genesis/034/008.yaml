  text: וַ/יְדַבֵּ֥ר חֲמ֖וֹר אִתָּ֣/ם לֵ/אמֹ֑ר שְׁכֶ֣ם בְּנִ֗/י חָֽשְׁקָ֤ה נַפְשׁ/וֹ֙ בְּ/בִתְּ/כֶ֔ם תְּנ֨וּ נָ֥א אֹתָ֛/הּ ל֖/וֹ לְ/אִשָּֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/008.yaml
  text: And Hamor spoke with them[a], saying, “My son Shechem longs for your daughter. Please give her to him as a wife.”
translation:
  language: ta
  text: அமோர் அவர்களுடன் பேசி, “என் மகன் சீகேம் உங்கள் மகள்மீது ஆழ்ந்த பற்று கொண்டிருக்கிறான்.[a] தயவுசெய்து அவளை அவனுக்கு மனைவியாகக் கொடுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் மகன் சீகேம் உங்கள் மகளை மிகவும் விரும்புகிறான்.” எபிரேயத்தில் நேரடியான உருவகம், “அவனுடைய உள்ளம் உங்கள் மகளிடம் பற்றிக்கொண்டுள்ளது.”
    reason: חָשְׁקָה נַפְשׁוֹ என்ற எபிரேயச் சொற்றொடர் ஆழ்ந்த பற்று, ஏக்கம், அல்லது தீவிர விருப்பம் ஆகிய நுண்ணர்த்தங்களைத் தரக்கூடும்.
lexical_decisions:
- source_word: וַיְדַבֵּר חֲמוֹר אִתָּם לֵאמֹר
  choice: அமோர் அவர்களுடன் பேசி, … என்றான்
  rationale: דבר என்பதன் ‘பேசுதல்’ என்ற பொருளையும், אִתָּם என்பதன் ‘அவர்களுடன்’ என்ற உறவுப்பொருளையும் காக்கிறது; לֵאמֹר அறிமுகப்படுத்தும் நேர்கூற்றைத் தமிழில் இயல்பாக ‘என்றான்’ என்று முடிக்கிறது.
- source_word: שְׁכֶם בְּנִי
  choice: என் மகன் சீகேம்
  rationale: எபிரேயச் சொல்லிணைப்பின் உறவை நவீனத் தமிழில் இயல்பான வரிசையில் தருகிறது.
- source_word: חָשְׁקָה נַפְשׁוֹ בְּבִתְּכֶם
  choice: உங்கள் மகள்மீது ஆழ்ந்த பற்றுக்கொண்டிருக்கிறது
  rationale: ‘அவனுடைய நெஃபெஷ் பற்றிக்கொண்டது/விரும்பியது’ என்ற உருவகத்தையும் தீவிர உணர்வையும் காக்க ‘உள்ளம்’ மற்றும் ‘ஆழ்ந்த பற்று’ பயன்படுத்தப்பட்டுள்ளன; மகள் ஒருமையிலும், ‘உங்கள்’ பன்மை மரியாதையல்லாது குடும்பத்தாரைக் குறிக்கும் வகையிலும் உள்ளது.
- source_word: תְּנוּ נָא אֹתָהּ לוֹ לְאִשָּׁה
  choice: தயவுசெய்து அவளை அவனுக்கு மனைவியாகக் கொடுங்கள்
  rationale: נָא-வின் பணிவான வேண்டுகோளை ‘தயவுசெய்து’ என்றும், לְאִשָּׁה என்பதன் திருமண நோக்கை ‘மனைவியாக’ என்றும் தெளிவாக வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன, கண்ணியமான, எளிதில் புரியும் பொதுத் தமிழ். ‘உள்ளம் … ஆழ்ந்த பற்றுக்கொண்டிருக்கிறது’ என்பது மூல உருவகத்தையும் இயல்பான தமிழ் நடையையும் சமநிலைப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
