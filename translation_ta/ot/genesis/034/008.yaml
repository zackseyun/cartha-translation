  verdict: revise
  source_fidelity: The draft accurately conveys Hamor’s address, identifies Shechem as his son, preserves the plural addressees with singular “daughter,” and renders the polite marriage request faithfully. The idiom חָשְׁקָה נַפְשׁוֹ is appropriately represented as strong attachment, with a lexical alternative supplied in the note.
