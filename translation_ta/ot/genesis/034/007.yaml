  edition: WLC
  text: וּ/בְנֵ֨י יַעֲקֹ֜ב בָּ֤אוּ מִן הַ/שָּׂדֶה֙ כְּ/שָׁמְעָ֔/ם וַ/יִּֽתְעַצְּבוּ֙ הָֽ/אֲנָשִׁ֔ים וַ/יִּ֥חַר לָ/הֶ֖ם מְאֹ֑ד כִּֽי נְבָלָ֞ה עָשָׂ֣ה בְ/יִשְׂרָאֵ֗ל לִ/שְׁכַּב֙ אֶת בַּֽת יַעֲקֹ֔ב וְ/כֵ֖ן לֹ֥א יֵעָשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/007.yaml
  text: And Jacob’s sons came in from the field when they heard it, and the men were grieved and very angry, because he had done an outrageous thing in Israel by lying with Jacob’s daughter, for such a thing must not be done.
translation:
  language: ta
  text: யாக்கோபின் மகன்கள் இதைக் கேள்விப்பட்டதும் வயலிலிருந்து வந்தார்கள். அவர்கள் மனம் வருந்தி, மிகவும் கோபமடைந்தார்கள். ஏனெனில், யாக்கோபின் மகளோடு படுத்ததன் மூலம் அவன் இஸ்ரவேலில் அருவருக்கத்தக்க இழிசெயலைச் செய்திருந்தான்; இப்படிப்பட்ட செயலைச் செய்யவே கூடாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְעַצְּבוּ
  choice: மனம் வருந்தி
  rationale: இந்த வினை ஆழ்ந்த மனவேதனை அல்லது துயரத்தைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: וַיִּחַר לָהֶם מְאֹד
  choice: மிகவும் கோபமடைந்தார்கள்
  rationale: எபிரெய மொழியின் தீவிரமான கோபத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: נְבָלָה
  choice: ஒரு கொடுஞ்செயல்
  rationale: இச்சொல் வெறும் அவமானத்தை அல்ல, சமூக மற்றும் ஒழுக்க எல்லைகளை மீறும் அருவருப்பான குற்றச்செயலைக் குறிக்கிறது; ‘கொடுஞ்செயல்’ அந்த வலிமையைச் சுருக்கமாகக் காக்கிறது.
- source_word: לִשְׁכַּב אֶת בַּת יַעֲקֹב
  choice: யாக்கோபின் மகளோடு படுத்ததன் மூலம்
  rationale: மூலத்தின் பாலியல் நயவுரையை நேரடித் தன்மையுடன், ஆனால் தேவையற்ற வெளிப்படைத்தன்மையின்றி காக்கிறது.
- source_word: וְכֵן לֹא יֵעָשֶׂה
  choice: இப்படிப்பட்ட செயலைச் செய்யவே கூடாது
  rationale: மூலத்தில் உள்ள வலுவான சமூக-ஒழுக்கத் தடைநிலையை ‘வே’ என்னும் வலியுறுத்தலுடன் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: בְיִשְׂרָאֵל என்ற காலத்திற்கு முன்தோன்றுவது போல் தோன்றும் சமூகப் பெயர்
  choice: இஸ்ரவேலில்
  alternative: இஸ்ரவேல் குடும்பத்தில் / இஸ்ரவேல் மக்களிடையே
  rationale: மசோரெட்டிக் மூலத்தின் சொற்பயன்பாட்டை மாற்றாமல் காக்கிறது. உரையின் கதைசொல்லல் நோக்கிலுள்ள இறையியல் மற்றும் சமூகத் திணிவை விளக்கி மறுவடிவமைக்கவில்லை.
- issue: וְכֵן לֹא יֵעָשֶׂה என்பதன் கட்டாய வலிமை
  choice: செய்யவே கூடாது
  alternative: செய்யப்படுவதில்லை
  rationale: இது வழக்கத்தை விவரிப்பதோடு மட்டுமல்லாமல் கடுமையான ஒழுக்கத் தடை அல்லது கண்டனத்தையும் வெளிப்படுத்துகிறது; தமிழில் அந்தத் திணிவை இயல்பாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் dignified narrative register பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மீளுருவாக்கமான ‘மகன்கள்… அந்த மனிதர்கள்’ என்பதும், உணர்ச்சி முன்னேற்றமான மனவருத்தம் முதல் கடும் கோபம் வரையிலான வரிசையும் பாதுகாக்கப்பட்டுள்ளன.
