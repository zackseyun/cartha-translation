revisions:
- from: யாக்கோபின் மகன்கள் இதைக் கேள்விப்பட்டதும் வயலிலிருந்து வந்தார்கள். அந்த மனிதர்கள் மனம் வருந்தி, மிகவும் கோபமடைந்தார்கள். ஏனெனில், யாக்கோபின் மகளோடு படுத்ததன் மூலம் அவன் இஸ்ரவேலில் ஒரு கொடுஞ்செயலைச் செய்திருந்தான்; இப்படிப்பட்ட செயலைச் செய்யவே கூடாது.
  to: யாக்கோபின் மகன்கள் இதைக் கேள்விப்பட்டதும் வயலிலிருந்து வந்தார்கள். அவர்கள் மனம் வருந்தி, மிகவும் கோபமடைந்தார்கள். ஏனெனில், யாக்கோபின் மகளோடு படுத்ததன் மூலம் அவன் இஸ்ரவேலில் அருவருக்கத்தக்க இழிசெயலைச் செய்திருந்தான்; இப்படிப்பட்ட செயலைச் செய்யவே கூடாது.
  rationale: The revision sharpens the rendering of נְבָלָה as a severe shameful outrage rather than a necessarily violent act, and makes the participant reference idiomatic in modern Tamil. It retains the source’s past action, its phrase ‘in Israel,’ the sexual euphemism, and the final categorical condemnation.
