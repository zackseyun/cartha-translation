translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பரஸ்பரத் திருமண ஏற்பாட்டைக் குறிக்கும் மூலத்தின் ‘எடுத்துக்கொள்’ என்ற சொல்லாட்சி காக்கப்பட்டு, இறுதித் தொடரிலுள்ள ‘ஆதல்/இருத்தல்’ நுணுக்கம் அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
