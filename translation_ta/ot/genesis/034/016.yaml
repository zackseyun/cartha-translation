  text: וְ/נָתַ֤נּוּ אֶת בְּנֹתֵ֨י/נוּ֙ לָ/כֶ֔ם וְ/אֶת בְּנֹתֵי/כֶ֖ם נִֽקַּֽח לָ֑/נוּ וְ/יָשַׁ֣בְנוּ אִתְּ/כֶ֔ם וְ/הָיִ֖ינוּ לְ/עַ֥ם אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/016.yaml
  text: then we will give our daughters to you[a], and we will take your daughters for ourselves, and we will live with you and become one people.
translation:
  language: ta
  text: அப்போது நாங்கள் எங்கள் மகள்களை உங்களுக்குக் கொடுப்போம்; உங்கள் மகள்களை எங்களுக்காக எடுத்துக்கொள்வோம்; உங்களோடு குடியிருந்து ஒரே மக்களாக ஆவோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரே மக்களாக இருப்போம்.” எபிரெயத் தொடர் சொற்சொல்லாக “ஒரே மக்களாக இருப்போம்” எனப் பொருள்படுகிறது; அதை விளைவாக உருவாகும் நிலையைக் குறிக்கும் “ஒரே மக்களாக ஆவோம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַנּוּ
  choice: அப்போது நாங்கள் … கொடுப்போம்
  rationale: முந்தைய நிபந்தனையைத் தொடர்ந்து வரும் விளைவை இந்தச் சூழலில் வாவுடன் கூடிய வினை வடிவம் குறிக்கிறது; ஆகவே இயல்பான தமிழில் ‘அப்போது’ சேர்க்கப்பட்டுள்ளது.
- source_word: אֶת־בְּנֹתֵינוּ לָכֶם
  choice: எங்கள் மகள்களை உங்களுக்குக் கொடுப்போம்
  rationale: ‘மகள்கள்’ என்ற உறவுமுறைச் சொல்லையும், கொடுப்பதன் மறைமுகப் பெறுநரைக் குறிக்கும் לָכֶם என்பதையும் நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: וְאֶת־בְּנֹתֵיכֶם נִקַּח לָנוּ
  choice: உங்கள் மகள்களை எங்களுக்காக எடுத்துக்கொள்வோம்
  rationale: לקח என்பதன் அடிப்படைப் பொருளான ‘எடுத்துக்கொள்’ என்பதைக் காக்கிறது. சூழல் திருமணத்தைத் தெளிவுபடுத்துவதால் ‘மணம் செய்துகொள்வோம்’ என்று வெளிப்படையாக விரிவாக்கப்படவில்லை; לָנוּ என்பதன் பயனுறு பொருள் ‘எங்களுக்காக’ எனத் தரப்பட்டுள்ளது.
- source_word: וְיָשַׁבְנוּ אִתְּכֶם
  choice: உங்களோடு குடியிருந்து
  rationale: ישב இங்கு சேர்ந்து வாழ்வதையும் குடியிருப்பதையும் குறிக்கிறது; ‘குடியிருந்து’ என்பது சமூகக் குடியேற்றச் சூழலுக்கு ஏற்ற, தற்போதைய இயல்பான தமிழ்.
- source_word: וְהָיִינוּ לְעַם אֶחָד
  choice: ஒரே மக்களாக ஆவோம்
  rationale: עם என்பது நவீன அரசியல் நாட்டை விட ஒரு மக்கள் குழுவைக் குறிக்கிறது. היה உடன் வரும் இத்தொடர் முன்மொழியப்படும் ஒன்றிணைவின் விளைவு நிலையைச் சுட்டுவதால் ‘ஆவோம்’ என வழங்கப்பட்டுள்ளது; ‘இருப்போம்’ என்ற முறையான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
