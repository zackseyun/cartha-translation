  yaml_path: translation/ot/genesis/034/001.yaml
  text: Dinah[a], the daughter of Leah, whom she had borne to Jacob, went out to see the daughters of the land.
translation:
  language: ta
  text: யாக்கோபுக்கு லேயாள் பெற்ற மகளான தீனாள், அந்த நாட்டின் பெண்களைப் பார்க்க[a] வெளியே சென்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நாட்டின் பெண்களைச் சந்திக்க.” எபிரெயத்தில் சொல்லுக்கு சொல், “அந்த நாட்டின் மகள்களைப் பார்க்க” என்று உள்ளது.
    reason: ‘பார்க்க’ என்பது நேரடிப் பொருள்; இச்சூழலில் அது சமூகச் சந்திப்பைக் குறிக்கவும் கூடும். மேலும் ‘நாட்டின் மகள்கள்’ என்ற மூல மொழி மரபுத்தொடரை வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: வெளியே சென்றாள்
  rationale: יצא என்பதன் இயல்பான கதைநடைப் பொருள் ‘வெளியே செல்’. மூலத்தில் கூறப்படாத புறப்பட்ட இடத்தைச் சேர்க்காமல் செயலை இயல்பான தமிழில் தருகிறது.
- source_word: דִינָה
  choice: தீனாள்
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: בַּת לֵאָה אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: லேயாள் யாக்கோபுக்குப் பெற்ற மகளாகிய
  rationale: தீனாளின் தாய்வழி அடையாளத்தையும் யாக்கோபே தந்தை என்பதையும் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது; எபிரெய உறவுக்கூற்றை ஒரே தமிழ் அடைமொழித் தொடராக அமைக்கிறது.
- source_word: לִרְאוֹת
  choice: பார்க்க
  rationale: ראה என்ற வினையின் நேரடிப் பொருளைத் தக்கவைக்கிறது. சூழலில் ‘சந்திக்க/பழகச் செல்லுதல்’ என்ற நுட்பம் இருக்கக்கூடும்; அதனை முதன்மை உரையில் உறுதியாக்கவில்லை.
- source_word: בִּבְנוֹת הָאָרֶץ
  choice: அந்த நாட்டின் பெண்களை
  rationale: ‘நாட்டின் மகள்கள்’ என்ற எபிரெய மரபுத்தொடர் அங்குள்ள உள்ளூர் பெண்களைக் குறிக்கிறது. நவீன தமிழில் ‘பெண்கள்’ என்பது இயல்பான பொருள்சார் இணை; சொல்லுக்கு சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
