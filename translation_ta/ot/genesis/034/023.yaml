  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூலத்தின் ஒப்புதலை எதிர்பார்க்கும் வினாவும், நிபந்தனையை வலியுறுத்தும் אַךְ என்பதும் பாதுகாக்கப்பட்டுள்ளன; மூலத்தில் வெளிப்படையாக இல்லாத ‘கோரிக்கை’ போன்ற சொல்லை முதன்மை உரையில் சேர்க்கவில்லை.
