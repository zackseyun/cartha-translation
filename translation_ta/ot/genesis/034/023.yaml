  text: מִקְנֵ/הֶ֤ם וְ/קִנְיָנָ/ם֙ וְ/כָל בְּהֶמְתָּ֔/ם הֲ/ל֥וֹא לָ֖/נוּ הֵ֑ם אַ֚ךְ נֵא֣וֹתָה לָ/הֶ֔ם וְ/יֵשְׁב֖וּ אִתָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/023.yaml
  text: Will not their livestock[a], their property, and all their animals be ours? Only let us agree with them[b], and they will dwell with us.
translation:
  language: ta
  text: அவர்களுடைய கால்நடைகளும், சொத்துகளும்[a], எல்லா விலங்குகளும் நம்முடையவையாக இருக்குமல்லவா? நாம் அவர்களுக்கு இணங்குவோம்[b]; அதுவே போதும்; அப்போது அவர்கள் நம்மோடு குடியிருப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உடைமைகளும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுக்குச் சம்மதிப்போம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵהֶם
  choice: அவர்களுடைய கால்நடைகள்
  rationale: מִקְנֶה இங்கு பொருளாதார மதிப்புடைய வளர்ப்பு மந்தைகளைக் குறிக்கிறது; ‘கால்நடைகள்’ என்பது அதன் பரந்த பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: קִנְיָנָם
  choice: அவர்களுடைய சொத்துகள்
  rationale: קִנְיָן என்பது ஒருவர் பெற்ற அல்லது உடைமையாக்கிய பொருள்களைக் குறிக்கிறது; ‘சொத்துகள்’ அதன் பொருளாதாரப் பொருளை மிகையாகக் குறுக்காமல் காக்கிறது.
- source_word: כָל בְּהֶמְתָּם
  choice: எல்லா விலங்குகளும்
  rationale: בְּהֵמָה என்பது பொதுவாக விலங்குகளை, குறிப்பாக வீட்டில் வளர்க்கப்படும் விலங்குகளை, குறிக்கும் பரந்த சொல். முந்தைய சொல்லுக்கு ‘கால்நடைகள்’ பயன்படுத்தப்பட்டுள்ளதால், ‘விலங்குகள்’ தேவையற்ற மறுபடியுரைத்தலைத் தவிர்த்து כָל என்பதின் முழுமையையும் காக்கிறது.
- source_word: הֲלוֹא לָנוּ הֵם
  choice: நம்முடையவையாக இருக்குமல்லவா?
  rationale: הֲלוֹא ஒப்புதலை எதிர்பார்க்கும் வினாவை அறிமுகப்படுத்துகிறது. ‘இருக்குமல்லவா?’ என்பது இங்குள்ள சூழ்ச்சிமிக்க வற்புறுத்தலையும் எதிர்கால நோக்கையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַךְ
  choice: மட்டும்
  rationale: אַךְ இங்கு வரம்பு அல்லது நிபந்தனையைச் சுட்டுகிறது; தமிழில் ‘மட்டும்’ அதைப் பொருத்தமாக வெளிப்படுத்துகிறது.
- source_word: נֵאֹותָה לָהֶם
  choice: நாம் அவர்களுக்கு இணங்குவோம்
  rationale: אוה என்பதன் நிபால் வடிவம் சம்மதித்தல், மனமுவந்து ஏற்றுக்கொள்ளுதல் என்ற பொருளைக் கொண்டது. ‘இணங்குவோம்’ என்பது வேண்டுகோளை உரையில் வெளிப்படையாகச் சேர்க்காமல் அந்தப் பொருளைக் காக்கிறது.
- source_word: וְיֵשְׁבוּ אִתָּנוּ
  choice: அப்போது அவர்கள் நம்மோடு குடியிருப்பார்கள்
  rationale: יָשַׁב வாழ்தல் அல்லது குடியேறுதல் என்ற இரு நெருங்கிய நுணுக்கங்களையும் கொண்டுள்ளது; ‘குடியிருப்பார்கள்’ இங்கு பேசப்படும் சமூகக் குடியேற்றத்தை இயல்பாகக் காட்டுகிறது. ‘அப்போது’ என்பது இணக்கத்தின் விளைவைத் தமிழில் தெளிவாக இணைக்கிறது.
