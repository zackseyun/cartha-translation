  text: Then Hamor, the father of Shechem, went out to Jacob to speak with him.
translation:
  language: ta
  text: அப்போது சீகேமின் தந்தையான ஹாமோர், யாக்கோபுடன் பேசுவதற்காக அவரிடம் புறப்பட்டுச் சென்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: புறப்பட்டுச் சென்றான்
  rationale: יצא என்பதன் ‘வெளியே/புறப்பட்டுச் செல்லுதல்’ என்ற திசைநுட்பத்தையும், wayyiqtol வடிவின் தொடர்கதை இறந்தகாலச் செயலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֲמוֹר
  choice: ஆமோர்
  rationale: எபிரேயப் பெயரின் தொடக்க ח ஒலி தமிழில் இயல்பாக அமைய ‘ஆமோர்’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲבִי שְׁכֶם
  choice: சீகேமின் தந்தையான
  rationale: எபிரேய இணைப்புத் தொடரின் உறவைத் தெளிவாகவும், தமிழ் வாக்கியத்தில் இயல்பாகவும் காட்டுகிறது.
- source_word: אֶל יַעֲקֹב
  choice: யாக்கோபிடம்
  rationale: אֶל குறிக்கும் ஒருவரை நோக்கிய இயக்கத்தை ‘-இடம்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: לְדַבֵּר אִתּוֹ
  choice: யாக்கோபுடன் பேசுவதற்காக
  rationale: לְ உடன் வரும் infinitive நோக்கத்தைக் குறிக்கிறது; אִתּוֹ உரையாடல் சார்ந்த ‘அவருடன்’ என்ற பொருளைத் தருகிறது. சுட்டுப்பெயரின் குறிப்பைத் தெளிவுபடுத்தப் பெயர் மீண்டும் இடப்பட்டுள்ளது.
- source_word: וַ
  choice: அப்போது
  rationale: கதை நிகழ்வின் தொடர்ச்சியையும் அடுத்த நிகழ்வுக்கான நகர்வையும் நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. மூலத்தின் சொற்றொடர் உறவுகள் பாதுகாக்கப்பட்டபோதும், தமிழ் நடைக்கு ஏற்றவாறு பெயர் மீளுரைக்கப்பட்டுள்ளது.
