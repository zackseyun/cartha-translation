source:
  edition: WLC
  text: הַרְבּ֨וּ עָלַ֤/י מְאֹד֙ מֹ֣הַר וּ/מַתָּ֔ן וְ/אֶ֨תְּנָ֔ה כַּ/אֲשֶׁ֥ר תֹּאמְר֖וּ אֵלָ֑/י וּ/תְנוּ לִ֥/י אֶת הַֽ/נַּעֲרָ֖ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/012.yaml
  text: Demand from me a very large bride-price and gift[a], and I will give whatever you say to me; only give me the young woman as a wife.
translation:
  language: ta
  text: “என்னிடமிருந்து மிக அதிகமான மணப்பரிசையும் அன்பளிப்பையும் கேளுங்கள்; நீங்கள் என்னிடம் சொல்வதையெல்லாம் நான் கொடுப்பேன். அந்த இளம்பெண்ணை மட்டும் எனக்கு மனைவியாகக் கொடுங்கள்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַרְבּוּ עָלַי מְאֹד
  choice: என்னிடமிருந்து மிக அதிகமான … கேளுங்கள்
  rationale: ரבה என்பதன் பன்மை ஏவல் வடிவமும் עָלַי என்பதும், பேசுகிறவர்மீது விதிக்கப்படும் தொகையை மிகுதியாகக் கேட்குமாறு கூறுகின்றன. இயல்பான நவீனத் தமிழில் இந்தப் பரிவர்த்தனை சார்ந்த வலிமையை இவ்வாறு வெளிப்படுத்தலாம்.
- source_word: מֹהַר
  choice: மணப்பரிசு
  rationale: மணமகன் அல்லது அவனுடைய குடும்பம் மணப்பெண்ணின் குடும்பத்திற்குக் கொடுக்கும் திருமணத் தொகையை இது குறிக்கிறது. தமிழில் ‘மணப்பரிசு’ சூழலுக்கு ஏற்ற, புரிந்துகொள்ளக்கூடிய சொல்; ‘வரதட்சணை’ என்பது எதிர்திசைச் செலுத்தலைக் குறிக்கக்கூடும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: וּמַתָּן
  choice: அன்பளிப்பு
  rationale: மணப்பரிசுடன் சேர்த்துக் கொடுக்கப்படும் கூடுதல் பரிசு அல்லது காணிக்கையை ஒருமைத் தொகுப்புச் சொல்லாகக் குறிக்கிறது.
- source_word: וְאֶתְּנָה
  choice: நான் கொடுப்பேன்
  rationale: விருப்பம் அல்லது உறுதியை வெளிப்படுத்தும் cohortative வடிவத்தைத் தமிழில் இயல்பான எதிர்கால உறுதிமொழியாக வழங்குகிறது.
- source_word: כַּאֲשֶׁר תֹּאמְרוּ אֵלָי
  choice: நீங்கள் என்னிடம் சொல்வதையெல்லாம்
  rationale: அவர்கள் குறிப்பிடும் எந்தத் தொகையையோ நிபந்தனையையோ ஏற்றுக்கொள்ளும் திறந்த உறுதியைத் தக்கவைக்கிறது.
- source_word: וּתְנוּ לִי
  choice: மட்டும் எனக்கு … கொடுங்கள்
  rationale: இணைப்புச் சொல் உரையின் உச்சக் கோரிக்கையை முன்னிறுத்துகிறது. ‘மட்டும்’ என்பது புதிய நிபந்தனையைச் சேர்க்காமல் அந்த வேண்டுகோளின் தீவிரத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַנַּעֲרָ
  choice: அந்த இளம்பெண்
  rationale: திருமண வயதுடைய இளம் பெண்ணைக் குறிக்கும் சொல்லுக்கு நவீனமும் மரியாதையானதுமான இணை.
- source_word: לְאִשָּׁה
  choice: மனைவியாக
  rationale: எபிரேயத்தின் வழக்கமான திருமணத் தொடரைச் சுருக்கமாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
