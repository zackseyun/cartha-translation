translation_notes:
  register: நவீன நிலையான தமிழ்; நேரடி உரையின் அவசரத்தையும் பரிவர்த்தனைச் சூழலையும் காக்கும் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘வரதட்சணை’ என்ற தவறாகப் புரிந்துகொள்ளக்கூடிய சொல்லைத் தவிர்த்து ‘மணப்பரிசு’ பயன்படுத்தப்பட்டது. தனி அடிக்குறிப்பு இன்றி பொருள் தெளிவாக இருப்பதால் எந்த அடிக்குறிப்பு குறியீடும் சேர்க்கப்படவில்லை.
