- from: அவர்களுடைய வார்த்தைகள் அமோருக்கும் அமோரின் மகன் சீகேமுக்கும் நல்லவையாகத் தோன்றின.[a]
  to: அவர்களுடைய வார்த்தைகள் ஹாமோருக்கும் ஹாமோரின் மகன் சேகேமுக்கும் நல்லதாகத் தோன்றின.[a]
  rationale: The revision retains the source’s plural “their words,” its evaluation by both named persons, and the explicit “son of Hamor.” It improves source-oriented rendering of the names and uses a more natural Tamil predicate without narrowing the semantic range. The footnote remains a valid lexical alternative for the idiom.
