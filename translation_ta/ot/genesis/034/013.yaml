base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/013.yaml
  text: Jacob’s sons answered Shechem and Hamor his father deceitfully and spoke[b][a], because he had defiled Dinah their sister.
translation:
  language: ta
  text: யாக்கோபின் மகன்கள் சீகேமுக்கும் அவன் தகப்பனாகிய ஏமோருக்கும் வஞ்சகமாக[a] பதிலளித்துப் பேசினார்கள்; ஏனெனில் சீகேம் அவர்களுடைய சகோதரி தீனாளைத் தீட்டுப்படுத்தியிருந்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வஞ்சனையுடன்.” எபிரேயத்தில் “வஞ்சனையில்/வஞ்சனையுடன்” என்ற பெயர்ச்சொல் வினையடைப் பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுடைய சகோதரி தீனாளை வன்முறைக்கு உட்படுத்தியிருந்தான்.” எபிரேயம் நேரடியாக “தீட்டுப்படுத்தியிருந்தான்” என்று கூறி, அந்தச் சொல்லின் ஒழுக்க மற்றும் சடங்கு சார்ந்த மொழியைப் பேணுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: பதிலளித்துப்
  rationale: முந்தைய முன்மொழிவுக்குக் கொடுக்கப்பட்ட மறுமொழியை ענה குறிக்கிறது; ‘பதிலளித்துப்’ என்பது தமிழில் இயல்பாக அந்தத் தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: בְנֵי יַעֲקֹב
  choice: யாக்கோபின் மகன்கள்
  rationale: எபிரேய கட்டமைப்பின் குடும்ப உறவை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: בְּמִרְמָה
  choice: வஞ்சகமாக
  rationale: מִרְמָה என்பதன் வஞ்சனை அல்லது ஏமாற்றம் என்ற பொருளையும், בְּ முன்னொட்டுடன் வரும் வினையடைச் செயலையும் இயல்பாகத் தருகிறது.
- source_word: וַיְדַבֵּרוּ
  choice: பேசினார்கள்
  rationale: דבר என்பதன் ‘பேசுதல்’ என்ற பொதுவான பொருளைப் பேணுகிறது; முந்தைய ‘பதிலளித்தல்’ என்பதிலிருந்து மூலத்தில் உள்ள வினை வேறுபாடும் தக்கவைக்கப்படுகிறது.
- source_word: אֲשֶׁר
  choice: ஏனெனில்
  rationale: இங்கு அடுத்த கூற்று மகன்களின் வஞ்சகமான பதிலுக்கான காரணத்தை அளிப்பதால், காரணப் பொருள் தெளிவாக வெளிப்படுகிறது.
- source_word: טִמֵּא
  choice: தீட்டுப்படுத்தியிருந்தான்
  rationale: פיעל வடிவிலுள்ள טמא என்பதன் ‘தீட்டாக்குதல்/தூய்மையைக் கெடுத்தல்’ என்ற ஒழுக்க மற்றும் சடங்கு சார்ந்த சொற்புலத்தைப் பேணுகிறது; நிகழ்வு பதிலுக்கு முன்பே நடந்ததையும் நிறைவுற்ற காலம் காட்டுகிறது.
- source_word: אֲחֹתָם
  choice: அவர்களுடைய சகோதரி
  rationale: சகோதரர்களின் குடும்ப உறவையும் அவர்களுடைய செயலைத் தூண்டும் பின்னணியையும் நேரடியாகப் பேணுகிறது.
- source_word: אֶת שְׁכֶם וְאֶת חֲמוֹר אָבִיו
  choice: சீகேமுக்கும் அவன் தகப்பனாகிய ஏமோருக்கும்
  rationale: இரு நேரடிப் பெறுபவர்களையும் காட்டி, ‘அவன் தகப்பன்’ என்பது ஏமோரைக் குறிக்கிறது என்பதை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: טִמֵּא என்ற சொல்லின் ஒழுக்க–சடங்கு சார்ந்த உருவகம்
  choice: தீட்டுப்படுத்தியிருந்தான்
  alternative: பாலியல் வன்முறைக்கு உட்படுத்தியிருந்தான் / மானபங்கப்படுத்தியிருந்தான்
  rationale: மாற்றுச் சொற்கள் நிகழ்வின் தன்மையை விளக்கக்கூடும்; ஆனால் மூலத்தின் ‘தீட்டாக்குதல்’ என்ற சொல்லாட்சியையும் அதிலுள்ள தெய்வீக–ஒழுக்க அழுத்தத்தையும் மாற்றிவிடும். ஆகவே முதன்மை உரையில் மூல உருவகம் பேணப்பட்டு, சூழல்சார் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டுள்ளது. ‘தகப்பனாகிய’ என்பது கதைநடைக்கு ஏற்ற சிறிதளவு உயர்ந்த பதிவு; ‘பதிலளித்துப் பேசினார்கள்’ என்பது தமிழில் ஓரளவு மீளுரைப்பாகத் தோன்றினாலும், וַיַּעֲנוּ மற்றும் וַיְדַבֵּרוּ என்ற இரு தனித்த வினைகளையும் நோக்கத்துடன் பேணுகிறது. காரணக் கூற்றில் உள்ள ஒருமை ஆண்பால் வினையின் சூழல்சார் குறிப்பு தெளிவாக இருக்க ‘சீகேம்’ மீண்டும் சொல்லப்பட்டுள்ளது.
