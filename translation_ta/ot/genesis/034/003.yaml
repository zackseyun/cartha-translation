  to: அவன் உள்ளம் யாக்கோபின் மகளான தீனாளோடு பற்றிக்கொண்டது[a]. அவன் அந்த இளம்பெண்ணை நேசித்து, அவளிடம் கனிவாகப் பேசினான்[b].
