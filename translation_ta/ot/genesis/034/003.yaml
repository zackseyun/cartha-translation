  text: וַ/תִּדְבַּ֣ק נַפְשׁ֔/וֹ בְּ/דִינָ֖ה בַּֽת יַעֲקֹ֑ב וַ/יֶּֽאֱהַב֙ אֶת הַֽ/נַּעֲרָ֔ וַ/יְדַבֵּ֖ר עַל לֵ֥ב הַֽ/נַּעֲרָֽ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/003.yaml
  text: His soul clung to Dinah[a], the daughter of Jacob[b], and he loved the young woman and spoke to the heart of the young woman.
translation:
  language: ta
  text: அவன் உள்ளம் யாக்கோபின் மகளான தீனாளோடு பற்றிக்கொண்டது[a]. அவன் அந்த இளம்பெண்ணை நேசித்து, அவளிடம் கனிவாகப் பேசினான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய உள்ளம் தீனாளோடு இணைந்தது.” எபிரெய மொழியில் சொல்லுக்குச் சொல், “அவனுடைய உயிர் தீனாளோடு பற்றிக்கொண்டது.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “அந்த இளம்பெண்ணின் இதயத்தின்மேல் பேசினான்.” இது கனிவாகவோ, ஆறுதலாகவோ, நம்பிக்கையூட்டும் விதமாகவோ பேசுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק נַפְשׁוֹ
  choice: அவனுடைய உயிர் ... பற்றிக்கொண்டது
  rationale: דבק என்பதன் ஒட்டிக்கொள்ளுதல் அல்லது நெருக்கமாகப் பற்றிக்கொள்ளுதல் என்ற உருவக வலிமையையும், נפשׁ என்பதன் உயிர்/உள்ளான தன்மை என்ற எபிரெய வெளிப்பாட்டையும் காக்கிறது.
- source_word: בְּדִינָה בַּת יַעֲקֹב
  choice: யாக்கோபின் மகளான தீனாளை
  rationale: தீனாளை யாக்கோபின் மகள் என்று அடையாளப்படுத்தும் எபிரெய இணைப்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וַיֶּאֱהַב
  choice: நேசித்து
  rationale: אהב என்பதன் நேரடியான பொருள் ‘நேசித்தல்’; ‘ஆசைப்பட்டான்’ போன்ற அதிக விளக்கமளிக்கும் சொல்லைத் தவிர்க்கிறது.
- source_word: הַנַּעֲרָ
  choice: அந்த இளம்பெண்
  rationale: נַעֲרָה என்பது பெண்/இளம்பெண் எனப் பொருள்படும்; இச்சூழலில் ‘இளம்பெண்’ என்பது மரியாதையான, இயல்பான நவீனத் தமிழ்.
- source_word: וַיְדַבֵּר עַל לֵב הַנַּעֲרָ
  choice: அந்த இளம்பெண்ணின் மனதைத் தொடும்படி பேசினான்
  rationale: ‘இதயத்தின் மேல்/இதயத்திடம் பேசுதல்’ என்ற எபிரெய மரபுத்தொடரை, கனிவாகவோ ஆறுதலாகவோ நம்பிக்கையூட்டும் விதமாகவோ பேசுதல் என்ற அதன் பொருள் விரிவை முற்றிலும் குறுக்காமல் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: சுற்றியுள்ள நிகழ்வில் இடம்பெற்ற வன்முறைக்குப் பின் வரும் உணர்ச்சிசார் மொழி
  choice: சீகேமின் பற்றுதலையும் நேசத்தையும் இவ்வசனம் கூறுகிறபடியே மொழிபெயர்த்து, அவனுடைய முந்தைய செயலை நியாயப்படுத்தும் அல்லது காதல்மயமாக்கும் சொற்களைச் சேர்க்கவில்லை.
  alternative: மொழிபெயர்ப்பிலேயே கண்டனச் சொற்களைச் சேர்த்தல், அல்லது நிகழ்வை அதிகமாகக் காதல்மயமாகச் சொல்லுதல்.
  rationale: எபிரெய உரை இங்கு அவனுடைய பற்றுதல், நேசம், பேச்சு ஆகியவற்றை நேரடியாக விவரிக்கிறது. சுற்றியுள்ள வன்முறையை மறைக்காமலும், இந்த வசனத்தில் இல்லாத ஒழுக்கத் தீர்ப்பைச் சேர்க்காமலும் அந்த பதற்றத்தை அப்படியே வைக்க வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உயிர் ... பற்றிக்கொண்டது’ என்ற செறிவான எபிரெய உருவகம் முதன்மை உரையில் காக்கப்பட்டுள்ளது; இறுதி மரபுத்தொடர் தமிழில் புரியும்படி மொழிபெயர்க்கப்பட்டு, அதன் சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
