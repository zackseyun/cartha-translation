  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளன. எபிரெய வாக்கியத்தின் தொடர் செயல்கள் அரைப்புள்ளியால் தெளிவாக இணைக்கப்பட்டுள்ளன.
