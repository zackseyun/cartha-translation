- from: அவர்கள் ஆமோரையும் அவன் மகன் சீகேமையும் வாளால்[a] கொன்றார்கள்; தீனாளைச் சீகேமின் வீட்டிலிருந்து அழைத்துக்கொண்டு வெளியேறினார்கள்.
  to: அவர்கள் ஆமோரையும் அவன் மகன் சீகேமையும் வாளால்[a] கொன்றார்கள்; தீனாளைச் சீகேமின் வீட்டிலிருந்து எடுத்துக்கொண்டு வெளியேறினார்கள்.
  rationale: “அழைத்துக்கொண்டு” என்பதற்குப் பதிலாக “எடுத்துக்கொண்டு” பயன்படுத்தப்பட்டுள்ளது. இது எபிரெய வினைச்சொல்லின் நடுநிலையான ‘எடுத்துக்கொண்டார்கள்/கொண்டுசென்றார்கள்’ என்ற பொருளைத் தக்கவைத்து, தீனாவின் விருப்பம் அல்லது செயற்பாட்டைப் பற்றி மூலத்தில் இல்லாத குறிப்பைச் சேர்க்காமல் இருக்கிறது. பிற பகுதிகள் மூலத்திற்கும் நவீன தமிழ் கதைநடைக்கும் ஏற்றவையாக உள்ளன.
