base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/026.yaml
  text: They also killed Hamor and his son Shechem with the sword[a], and they took Dinah from Shechem’s house and went out.
translation:
  language: ta
  text: அவர்கள் ஆமோரையும் அவன் மகன் சீகேமையும் வாளால்[a] கொன்றார்கள்; தீனாளைச் சீகேமின் வீட்டிலிருந்து எடுத்துக்கொண்டு வெளியேறினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “வாளின் வாயால்”; இது வாளால் கொல்வதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת חֲמוֹר וְאֶת שְׁכֶם בְּנוֹ
  choice: அவர்கள் ஆமோரையும் அவன் மகன் சீகேமையும்
  rationale: எபிரெய நேரடி உருபுகள் தமிழில் ‘-ஐ’ வேற்றுமை உருபால் வெளிப்படுகின்றன. தொடர்ச்சியையும் கூடுதல் பொருட்களையும் ‘-உம்’ காட்டுகிறது; சீகேம் ஆமோரின் மகன் என்ற உறவும் தெளிவாகப் பாதுகாக்கப்படுகிறது.
- source_word: הָרְגוּ
  choice: கொன்றார்கள்
  rationale: הרג என்பதன் நேரடியான கதைநடைப் பொருளை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: לְפִי חָרֶב
  choice: வாளால்
  rationale: சொல்லுக்குச் சொல் ‘வாளின் வாயால்’ என்ற எபிரெய மரபுத்தொடர், வாளைக் கொண்டு கொல்வதைக் குறிக்கிறது. முதன்மை உரையில் இயல்பான தமிழைத் தேர்ந்தெடுத்து, சொற்படியான வடிவத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: וַיִּקְחוּ אֶת דִּינָה
  choice: தீனாளை … அழைத்துக்கொண்டு
  rationale: לקח என்பதன் பரந்த பொருள் ‘எடுத்துக்கொள்/கொண்டுசெல்’. இங்கு ஒரு நபரை வீட்டிலிருந்து கூட்டிச் செல்லும் சூழலில் ‘அழைத்துக்கொண்டு’ என்பது இயல்பான தமிழ்; ‘மீட்டனர்’ அல்லது ‘கைப்பற்றினர்’ போன்ற மூலத்தில் வெளிப்படாத மதிப்பீட்டைச் சேர்க்கவில்லை.
- source_word: מִבֵּית שְׁכֶם
  choice: சீகேமின் வீட்டிலிருந்து
  rationale: בית இச்சூழலில் உடனடியான பௌதிக வீடு அல்லது குடியிருப்பைக் குறிப்பதாக இயல்பாகப் புரிகிறது; உடைமைத் தொடர்பும் பாதுகாக்கப்படுகிறது.
- source_word: וַיֵּצֵאוּ
  choice: வெளியேறினார்கள்
  rationale: יצא என்பதன் வெளியே செல்லும் இயக்கத்தைச் சுருக்கமான, இயல்பான தமிழ் கதைநடையில் தருகிறது.
