base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/025.yaml
  text: On the third day[a], while they were in pain, two of Jacob’s sons, Simeon and Levi, Dinah’s brothers, each took his sword, came against the city while it felt secure[b], and killed every male.
translation:
  language: ta
  text: மூன்றாம் நாளில், அவர்கள் வலியால் அவதிப்பட்டுக்கொண்டிருந்தபோது, யாக்கோபின் மக்களில் இருவரும் தீனாவின் சகோதரர்களுமான சிமியோனும் லேவியும் தத்தம் வாளை எடுத்துக்கொண்டு, பாதுகாப்பாக இருந்த நகரத்துக்கு எதிராக வந்து[a], எல்லா ஆண்களையும் கொன்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அச்சமின்றி நகரத்துக்கு எதிராக வந்து.” எபிரெயச் சொல் தாக்க வந்தவர்களின் முறையையோ, நகரம் எச்சரிக்கையின்றிப் பாதுகாப்பாக இருந்த நிலையையோ விவரிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי
  choice: மூன்றாம் நாளில்
  rationale: וַיְהִי என்ற எபிரெயக் கதைத் தொடரைத் தமிழில் தனியாகச் சொல்லாமல், காலக் குறிப்பை முன்னிறுத்துவது இயல்பான நவீன நடையையும் நிகழ்வுகளின் தொடர்ச்சியையும் காக்கிறது.
- source_word: בִּהְיוֹתָם כֹּאֲבִים
  choice: அவர்கள் வலியால் அவதிப்பட்டுக்கொண்டிருந்தபோது
  rationale: ஒரே நேரத்தில் நீடித்திருந்த வலிநிலையைத் தெளிவாகக் காட்டுகிறது; சூழலில் அது விருத்தசேதனத்தால் ஏற்பட்ட வலி என்றாலும், மூலத்தில் இல்லாத காரணத்தை வசனத்துக்குள் சேர்க்கவில்லை.
- source_word: שְׁנֵי בְנֵי יַעֲקֹב
  choice: யாக்கோபின் மக்களில் இருவர்
  rationale: யாக்கோபின் எல்லா மக்களிலும் இருவரைக் குறிக்கும் பகுதி சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֲחֵי דִינָה
  choice: தீனாவின் சகோதரர்கள்
  rationale: சிமியோனும் லேவியும் தீனாவுடன் கொண்ட உறவை விளக்கும் இணை அடையாளத்தை நேரடியாகக் காக்கிறது.
- source_word: אִישׁ חַרְבּוֹ
  choice: தத்தம் வாளை எடுத்துக்கொண்டு
  rationale: אִישׁ என்பதன் பகிர்ந்தளிக்கும் பொருளையும், ஒவ்வொருவரும் தமது வாளை எடுத்தனர் என்பதையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיָּבֹאוּ עַל הָעִיר
  choice: நகரத்தின்மேல் வந்து
  rationale: בוא על என்பதிலுள்ள எதிராக/மேல் வந்து அணுகும் பகைமை இயக்கத்தைப் பாதுகாக்கிறது; ‘தாக்கினர்’ என்று செயலை முன்கூட்டியே விரிவுபடுத்தவில்லை.
- source_word: בֶּטַח
  choice: பாதுகாப்பாக இருந்த
  rationale: சூழலில் நகரம் தன்னைப் பாதுகாப்பான நிலையில் இருப்பதாகக் கருதி எச்சரிக்கையின்றி இருந்ததைக் குறிக்கும் வாசிப்பை முதன்மைப்படுத்துகிறது; மாற்று இலக்கண இணைப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וַיַּהַרְגוּ כָּל זָכָר
  choice: ஆண்கள் எல்லாரையும் கொன்றார்கள்
  rationale: הרג என்பதன் நேரடியான ‘கொல்’ பொருளையும், כָּל זָכָר என்பதன் முழுமையையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: בֶּטַח யாருடைய நிலையை விவரிக்கிறது என்பது
  choice: நகரம் பாதுகாப்பாக இருந்தது என முதன்மை உரையில் எடுத்துக்கொள்ளப்பட்டது
  alternative: சிமியோனும் லேவியும் அச்சமின்றி அல்லது துணிவுடன் நகரத்தின்மேல் வந்தார்கள்
  rationale: எபிரெயச் சொல் நகரத்தின் எச்சரிக்கையற்ற பாதுகாப்பு நிலையையோ தாக்க வந்தவர்களின் நம்பிக்கையான முறையையோ குறிக்கலாம். சூழலில் நகரத்தின் பாதிப்புக்குள்ளான, எச்சரிக்கையற்ற நிலை பொருத்தமாக இருப்பினும், உண்மையான இலக்கணத் தெளிவின்மையை அடிக்குறிப்பு வெளிப்படையாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டது. ‘தத்தம் வாளை’ என்பது ஒவ்வொருவரும் தமது வாளை எடுத்ததைக் குறிக்கும் சுருக்கமான இயல்பான வடிவம். பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்புகளின்படி வழங்கப்பட்டன.
