base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/019.yaml
  text: And the young man did not delay to do the thing[a], because he delighted in Jacob’s daughter[d][c][b], and he was honored above all his father’s house.
translation:
  language: ta
  text: அந்த இளைஞன் அந்தக் காரியத்தைச் செய்யத் தாமதிக்கவில்லை[a]. ஏனெனில், யாக்கோபின் மகள்மேல் அவன் மிகுந்த விருப்பம் கொண்டிருந்தான்[b]. மேலும், தன் தகப்பனின் வீட்டார் அனைவரையும்விட அவன் அதிக மதிப்புப் பெற்றவனாக இருந்தான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தக் காரியத்தைச் செய்யத் தயங்கவில்லை.”
    reason: אֵחַר என்பதற்கு இங்கு முதன்மையாக ‘தாமதித்தல்’ என்ற காலம் சார்ந்த பொருள் இருந்தாலும், சூழலில் ‘தயங்குதல்’ என்ற நுட்பமும் சாத்தியம்.
  - marker: b
    text: அல்லது, “யாக்கோபின் மகளை அவன் மிகவும் விரும்பினான்” அல்லது “யாக்கோபின் மகளால் அவன் மகிழ்ச்சியடைந்தான்.”
    reason: חָפֵץ என்பது விருப்பம், ஆசை, மகிழ்ச்சி ஆகிய ஒன்றோடொன்று தொடர்புடைய பொருள் நிழல்களை உடையது.
  - marker: c
    text: அல்லது, “தன் தகப்பனின் வீட்டார் அனைவரிலும் அவனே மிகவும் மதிக்கப்பட்டவன்.”
    reason: பெயரடை மற்றும் מִכֹּל சேர்ந்த எபிரெயக் கட்டமைப்பை ஒப்பீடாகவும் உயர்நிலைப் பொருளிலும் இயல்பாக வெளிப்படுத்தலாம்.
lexical_decisions:
- source_word: אֵחַר
  choice: தாமதிக்கவில்லை
  rationale: இந்த வினைச்சொல் காலந்தாழ்த்துதல் அல்லது தாமதித்தலைக் குறிக்கிறது. சூழலில் தயக்கத்தைவிட உடனடியாகச் செயல்பட்டதையே முதன்மையாக உணர்த்துகிறது.
- source_word: הַנַּעַר
  choice: அந்த இளைஞன்
  rationale: இது சீகேமைக் குறிக்கிறது. நவீன தமிழில் வயதையும் கதைச்சூழலையும் இயல்பாகக் காட்டும் சொல் ‘இளைஞன்’.
- source_word: לַעֲשׂוֹת הַדָּבָר
  choice: அந்தக் காரியத்தைச் செய்ய
  rationale: முந்தைய வசனங்களில் கோரப்பட்ட செயலைச் சுட்டுகிறது; எபிரெயச் சொல்லாட்சியையும் தமிழின் இயல்பையும் காக்கிறது.
- source_word: חָפֵץ בְּבַת יַעֲקֹב
  choice: யாக்கோபின் மகள்மேல் அவன் மிகுந்த விருப்பம் கொண்டிருந்தான்
  rationale: חָפֵץ மகிழ்ச்சி, நாட்டம், விருப்பம் அல்லது ஆசை ஆகிய பொருள் நிழல்களைக் கொண்டது. ‘மிகுந்த விருப்பம்’ அதன் வலிமையைத் தெரிவிக்கிறது; அதை வெறும் பாலியல் ஆசையாக மட்டும் சுருக்கவில்லை.
- source_word: נִכְבָּד מִכֹּל בֵּית אָבִיו
  choice: தன் தகப்பனின் வீட்டார் அனைவரையும்விட அவன் அதிக மதிப்புப் பெற்றவனாக இருந்தான்
  rationale: נִכְבָּד மதிக்கப்படுதல் அல்லது கண்ணியமுடையவராக இருத்தலைக் குறிக்கிறது. מִכֹּל ஒப்பீட்டை வெளிப்படுத்துவதால் ‘அனைவரையும்விட’ என்று மொழிபெயர்க்கப்பட்டது; ‘வீட்டார்’ என்பது இங்கு வீட்டை அல்ல, தகப்பனின் குடும்பத்தார் அல்லது குடும்பக் குழுவினரைக் குறிக்கிறது.
