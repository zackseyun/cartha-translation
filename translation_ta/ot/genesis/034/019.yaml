translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘தகப்பன்’ என்பது ஆதியாகமக் கதைநடையின் மரியாதைமிக்க பதிவுக்கு ஏற்றதாகத் தேர்ந்தெடுக்கப்பட்டது. காரணத்தையும் இறுதி தகவலையும் தனித்தனி வாக்கியங்களாக அமைத்தது தமிழில் வாசிப்பை இயல்பாக்குகிறது; எபிரெய மூலத்தின் தர்க்கத் தொடர்புகள் ‘ஏனெனில்’ மற்றும் ‘மேலும்’ என்பவற்றால் பாதுகாக்கப்பட்டுள்ளன.
