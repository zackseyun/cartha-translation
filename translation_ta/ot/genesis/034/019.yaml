  source_fidelity: 'மூல எபிரெயத்தின் வினைத் தொடர்புகளும் பொருளும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: לֹא אֵחַר என்பதன் காலந்தாழ்த்தாமை ‘தாமதிக்கவில்லை’ எனவும், חָפֵץ என்பதன் வலுவான விருப்பம் ‘மிகுந்த விருப்பம் கொண்டிருந்தான்’ எனவும், נִכְבָּד מִכֹּל என்பதன் ஒப்பீட்டு உயர்வு ‘அனைவரையும்விட அதிக மதிப்புப் பெற்றவனாக’ எனவும் சரியாக வெளிப்படுகின்றன. ‘வீட்டார்’ என்பது בֵּית אָבִיו என்பதிலுள்ள குடும்ப/வீட்டுக்குழு பொருளை இயல்பாகத் தருகிறது.'
