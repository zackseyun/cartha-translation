translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘விருத்தசேதனம்’ என்பது இச்சூழலுக்குரிய நிலைபெற்ற வேதாகமச் சொல்லாகத் தக்கவைக்கப்பட்டுள்ளது; זָכָר என்பதன் வயது சாராத ஆண்பால் பரப்பை ‘ஆண்பாலினர்’ பாதுகாக்கிறது.
