  text: אַךְ בְּ֠/זֹאת יֵאֹ֨תוּ לָ֤/נוּ הָ/אֲנָשִׁים֙ לָ/שֶׁ֣בֶת אִתָּ֔/נוּ לִ/הְי֖וֹת לְ/עַ֣ם אֶחָ֑ד בְּ/הִמּ֥וֹל לָ֨/נוּ֙ כָּל זָכָ֔ר כַּ/אֲשֶׁ֖ר הֵ֥ם נִמֹּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/022.yaml
  text: 'Only on this condition will the men agree with us[a], to dwell with us and to become one people: that every male among us be circumcised, just as they are circumcised.'
translation:
  language: ta
  text: 'இந்த ஒரு நிபந்தனையின்பேரில் மட்டுமே அந்த ஆண்கள் நம்மோடு குடியிருக்கவும் ஒரே மக்களாக ஆகவும் நமக்கு இணங்குவார்கள்[a]: அவர்கள் விருத்தசேதனம் செய்யப்பட்டிருப்பதுபோலவே நம்மிடையிலுள்ள ஆண்பாலினர் அனைவரும் விருத்தசேதனம் செய்துகொள்ள வேண்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நமக்குச் சம்மதிப்பார்கள்’ அல்லது ‘நம்மிடம் விருப்பமுள்ளவர்களாக இருப்பார்கள்’; எபிரெய வினை ஒப்புதல் அல்லது மனமுவந்த இணக்கத்தைத் தெரிவிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: இந்த ஒரு நிபந்தனையின்பேரில் மட்டுமே
  rationale: אַךְ என்பதன் வரையறுக்கும் வலிமையையும் בְּזֹאת அறிமுகப்படுத்தும் நிபந்தனையையும் இயல்பான நவீனத் தமிழில் ஒன்றாக வெளிப்படுத்துகிறது.
- source_word: יֵאֹתוּ לָנוּ
  choice: நமக்கு இணங்குவார்கள்
  rationale: אוה வினையின் நிபால் வடிவம் விருப்பத்துடன் ஒப்புதல் அல்லது சம்மதம் தெரிவித்தலைக் குறிக்கிறது; பேச்சுவார்த்தைச் சூழலில் ‘இணங்குவார்கள்’ இயல்பாக உள்ளது, அதே நேரத்தில் அதன் பொருள் மாற்றுகளைக் காலடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: הָאֲנָשִׁים
  choice: அந்த ஆண்கள்
  rationale: முன்னரே குறிப்பிடப்பட்ட சீகேமின் ஆண்களைக் குறிக்கும் குறிப்பிட்ட ஆண்பால் பன்மையைப் பாதுகாக்கிறது.
- source_word: לָשֶׁבֶת אִתָּנוּ
  choice: நம்மோடு குடியிருக்க
  rationale: ישב இங்கு சேர்ந்து வசிப்பது அல்லது குடியிருப்பது என்ற பொருளில் வருகிறது; ‘குடியிருக்க’ சமூகமாக ஒன்றாக வாழும் கருத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: לִהְיוֹת לְעַם אֶחָד
  choice: ஒரே மக்களாக ஆக
  rationale: ஒருங்கிணைந்த மக்கள் சமூகமாக மாறும் விளைவு சார்ந்த பொருளைப் பாதுகாக்கிறது; குலச் சூழலில் ‘தேசம்’ என்பதைக் காட்டிலும் ‘மக்கள்’ பொருத்தமானது.
- source_word: בְּהִמּוֹל לָנוּ כָּל זָכָר
  choice: நம்மிடையிலுள்ள ஆண்பாலினர் அனைவரும் விருத்தசேதனம் செய்துகொள்ள வேண்டும்
  rationale: நிபந்தனையாக விதிக்கப்பட்ட செயலைத் தெளிவாக்குகிறது. זָכָר வயதுவந்த ஆண்களை மட்டும் அல்லாமல் ஆண்பாலார் அனைவரையும் குறிக்கக்கூடியதால் ‘ஆண்பாலினர் அனைவரும்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר הֵם נִמֹּלִים
  choice: அவர்களைப் போலவே
  rationale: அவர்களுடைய விருத்தசேதன நடைமுறையே ஒப்பீட்டின் அளவுகோல் என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; பிரதான வாக்கியத்திலுள்ள விருத்தசேதனக் குறிப்புடன் சேர்ந்து முழுப் பொருள் தெளிவாகிறது.
