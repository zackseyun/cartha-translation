base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/029.yaml
  text: They took captive all their wealth and all their little ones and their wives[c][b][a], and plundered everything that was in the house.
translation:
  language: ta
  text: அவர்களுடைய சிறு பிள்ளைகள்[a] அனைவரையும் அவர்களுடைய மனைவிகளையும் சிறைப்பிடித்துக் கொண்டுபோனார்கள்; அவர்களுடைய செல்வம் முழுவதையும் வீட்டில்[b] இருந்த அனைத்தையும் கொள்ளையடித்தார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சிறு பிள்ளைகள்’ என்பதற்குப் பதிலாக ‘பிள்ளைகள்’ அல்லது ‘சார்ந்திருப்போர்’ என்றும் பொருள் கொள்ளலாம்; எபிரெய טַף பெரும்பாலும் சிறு பிள்ளைகளையோ வீட்டைச் சார்ந்திருப்போரையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘வீட்டில்’ என்பதற்கு ‘வீட்டாரிடத்தில்’ அல்லது ‘குடும்பத்தாரிடம்’ என்ற விரிவான பொருளும் இருக்கலாம்; எபிரெயச் சொல் வீட்டையும், சில சூழல்களில் வீட்டாரையும் அவர்களுடைய உடைமைகளையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெய மூலத்தில் செல்வம், சிறு பிள்ளைகள், மனைவிகள் என்ற கலந்த பட்டியலுக்குப் பிறகு ‘சிறைப்பிடித்தார்கள்’ மற்றும் ‘கொள்ளையிட்டார்கள்’ என்ற இரண்டு வினைகள் வருகின்றன. தமிழில் பொருள் தெளிவுக்காக மனிதர்களைச் சிறைப்பிடித்ததாகவும் உடைமைகளைக் கொள்ளையடித்ததாகவும் பிரித்து மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: source_syntax
lexical_decisions:
- source_word: חֵילָם
  choice: அவர்களுடைய செல்வம் முழுவதையும்
  rationale: חַיִל இச்சூழலில் படைவலிமையை அல்ல, செல்வம், உடைமைகள், வளங்கள் ஆகியவற்றைக் குறிக்கிறது. ‘செல்வம்’ என்பது இதை கால்நடைகளுக்கு மட்டும் சுருக்காமல் விரிவாக வெளிப்படுத்துகிறது.
- source_word: טַפָּם
  choice: அவர்களுடைய சிறு பிள்ளைகள் அனைவரையும்
  rationale: טַף பொதுவாக வீட்டாரில் உள்ள சிறு பிள்ளைகளையோ சார்ந்திருப்போரையோ குறிக்கும். ‘சிறு பிள்ளைகள்’ அதன் முதன்மையான வயதுசார் நுணுக்கத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: נְשֵׁיהֶם
  choice: அவர்களுடைய மனைவிகளையும்
  rationale: אִשָּׁה என்பதற்கு ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள் வரலாம். உடைமைகளும் வீட்டாரும் பட்டியலிடப்படும் இச்சூழலில் உறவுமுறைப் பொருளான ‘மனைவிகள்’ இயல்பானது.
- source_word: שָׁבוּ
  choice: சிறைப்பிடித்துக் கொண்டுபோனார்கள்
  rationale: שָׁבָה என்பது போர்ச் சூழலில் ஒருவரைச் சிறைப்பிடித்துக் கொண்டுபோவதைக் குறிக்கிறது. மனிதர்கள் வெறுமனே பிடிக்கப்பட்டார்கள் என்பதைக் காட்டிலும் அவர்களது சிறைநிலையை இச்சொற்றொடர் தெளிவாக்குகிறது.
- source_word: וַיָּבֹזּוּ
  choice: கொள்ளையடித்தார்கள்
  rationale: בזז என்பது வன்முறையாகக் கொள்ளைப்பொருளை எடுத்துக்கொள்வதைக் குறிக்கிறது. ‘கொள்ளையடித்தார்கள்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: வீட்டில் இருந்த அனைத்தையும்
  rationale: בַּבָּיִת என்பதன் ஒருமை வடிவத்தை ‘வீட்டில்’ என்று நேரடியாகக் காக்கிறது; அது சூழலின்படி வீடு அல்லது வீட்டார் சார்ந்த உடைமைகள் என்ற விரிவான பொருளையும் கொள்ளலாம்.
theological_decisions:
- issue: கலந்த பொருட்களுக்கு முன்வரும் שָׁבוּ וַיָּבֹזּוּ ஆகிய இரு வினைகளின் தொடர்பு
  choice: மனிதர்களை ‘சிறைப்பிடித்துக் கொண்டுபோனார்கள்’ என்றும் செல்வத்தையும் வீட்டிலிருந்தவற்றையும் ‘கொள்ளையடித்தார்கள்’ என்றும் பொருளுக்கேற்றவாறு அமைத்தல்
  alternative: எபிரெயச் சொல் வரிசையை அப்படியே பின்பற்றி செல்வம், பிள்ளைகள், மனைவிகள் அனைத்தையும் இரு வினைகளுக்கும் ஒரே கலந்த பட்டியலாக அமைத்தல்
  rationale: எபிரெயத்தில் எல்லாப் பொருட்களும் முதலில் வந்து, பின்னர் ‘சிறைப்பிடித்தார்கள், கொள்ளையிட்டார்கள்’ என்ற வினைகள் வருகின்றன. தமிழில் அதே அமைப்பு செல்வத்தையும் ‘சிறைப்பிடித்தார்கள்’ எனத் தவறாகப் புரிந்துகொள்ளச் செய்யும். எனவே முழுத் தகவலையும் காத்து, ஒவ்வொரு செயலும் இயல்பாக ஏற்கும் பொருளுடன் இணைக்கப்பட்டது; மூல அமைப்பு அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. ‘கொள்ளையடித்தார்கள்’ என்பது வன்முறையான சூறையாடலைத் தெளிவாகக் காட்டுகிறது; ‘சிறைப்பிடித்துக் கொண்டுபோனார்கள்’ மனிதர்களுக்கு நேர்ந்த செயலை இயல்பாக வெளிப்படுத்துகிறது. எபிரெயத்தின் கலந்த பட்டியல் அமைப்பால் உருவாகும் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
