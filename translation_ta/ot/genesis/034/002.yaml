base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/002.yaml
  text: When Shechem son of Hamor the Hivite[a], the prince of the land, saw her[b], he took her and lay with her and humiliated her.
translation:
  language: ta
  text: ஏவியனான ஆமோரின் மகனும் அந்நாட்டின் தலைவனுமான சீகேம் அவளைப் பார்த்தபோது, அவளை எடுத்துக்கொண்டு, அவளோடு உடலுறவு கொண்டு, அவளை இழிவுபடுத்தினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வினைச்சொல் ‘துன்புறுத்தினான்,’ ‘தாழ்த்தினான்,’ அல்லது ‘இழிவுபடுத்தினான்’ என்றும் பொருள்படலாம்; இந்தச் சூழலில் அது பாலியல் மீறலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא אֹתָהּ
  choice: அவளைப் பார்த்தபோது
  rationale: ראה என்பதன் இயல்பான கதைநடைப் பொருள் ‘பார்த்தான்’; தொடரும் செயல்களுடன் இயல்பாக இணைக்க ‘பார்த்தபோது’ என வழங்கப்பட்டுள்ளது.
- source_word: שְׁכֶם בֶּן חֲמוֹר הַחִוִּי
  choice: இவ்வியனான ஆமோரின் மகன் சீகேம்
  rationale: தனிப்பெயர்களும் இனப்பெயரும் எபிரெய வடிவங்களுக்கு நெருக்கமாக, தமிழில் வாசிக்கத்தக்க ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன.
- source_word: נְשִׂיא הָאָרֶץ
  choice: அந்நாட்டின் தலைவன்
  rationale: נָשִׂיא என்பது தலைவர், முதன்மையானவர், அல்லது இளவரசர் எனக் குறிக்கலாம். அரச மரபைத் தேவையின்றி குறிப்பதாகாமல் சமூக-அரசியல் அதிகாரத்தை வெளிப்படுத்த ‘தலைவன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיִּקַּח אֹתָהּ
  choice: அவளைப் பிடித்துக்கொண்டு
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொண்டான்’. இங்குள்ள தொடர்ச்சியான பாலியல் வன்முறைச் சூழலில் செயலில் உள்ள கட்டாயத் தன்மையை இயல்பான தமிழில் ‘பிடித்துக்கொண்டு’ வெளிப்படுத்துகிறது.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: அவளோடு உடலுறவு கொண்டு
  rationale: இது பாலுறவைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘உடலுறவு கொண்டு’ என்பது அதன் பொருளைத் தெளிவாகவும் கண்ணியமான நவீன தமிழிலும் கூறுகிறது.
- source_word: וַיְעַנֶּהָ
  choice: அவளைப் பாலியல் வன்முறைக்கு உள்ளாக்கினான்
  rationale: פיעל வடிவிலுள்ள ענה துன்புறுத்துதல், தாழ்த்துதல், அவமானப்படுத்துதல், மீறுதல் ஆகிய பொருட்களை உடையது. இப்பாலியல் சூழலில் நடந்த வன்முறையை மறைக்காமல் கூறுவதற்கும், ஒரே சொல்லின் தனிப்பொருளை மீறி சட்டரீதியான நுணுக்கங்களைச் சேர்க்காமல் இருப்பதற்கும் இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: பாலியல் வன்முறையை மறைமுகமாக்காமலும் எபிரெயச் சொல்லை அளவுக்கு மீறித் திட்டவட்டப்படுத்தாமலும் மொழிபெயர்த்தல்
  choice: “அவளைப் பிடித்துக்கொண்டு, அவளோடு உடலுறவு கொண்டு, அவளைப் பாலியல் வன்முறைக்கு உள்ளாக்கினான்”
  alternative: “அவளை எடுத்துக்கொண்டு, அவளோடு படுத்து, அவளை அவமானப்படுத்தினான்”
  rationale: வினைச்சொற்களின் வரிசை கட்டாயமான பாலியல் அத்துமீறலை விவரிக்கிறது. தேர்ந்தெடுக்கப்பட்ட வாசகம் அந்த வன்முறையைத் தெளிவாக்குகிறது; அடிக்குறிப்பு ענה என்பதன் பரந்த சொற்பொருள் வரம்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பாலியல் வன்முறை மென்மைப்படுத்தப்படாமல் கூறப்பட்டாலும், மூலத்தின் சொற்பொருள் பரப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
