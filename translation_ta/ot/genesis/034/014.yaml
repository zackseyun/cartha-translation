translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நேரடியான உடற்கூறு சொல்லாக்கம் முதன்மை உரையில் காக்கப்பட்டு, வழக்கமான சமயச் சொல்லாக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
