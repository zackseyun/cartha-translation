  yaml_path: translation/ot/genesis/034/014.yaml
  text: And they said to them[a], “We cannot do this thing, to give our sister to a man who has a foreskin, for that is a disgrace to us.”
translation:
  language: ta
  text: அவர்கள் அவர்களிடம், “முன்தோல் உள்ள ஒரு மனிதனுக்கு எங்கள் சகோதரியைக் கொடுக்கும் இந்தக் காரியத்தை எங்களால் செய்ய முடியாது[a]; ஏனெனில், அது எங்களுக்கு அவமானம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “விருத்தசேதனம் செய்யப்படாத ஒரு மனிதனுக்கு எங்கள் சகோதரியைக் கொடுக்கும் இந்தக் காரியத்தை.” சொல்லுக்குச் சொல்: “முன்தோல் உள்ள ஒரு மனிதனுக்கு.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵיהֶם
  choice: அவர்கள் அவர்களிடம் ... என்றார்கள்
  rationale: אמר என்பதன் இயல்பான கதைநடைப் பொருளையும், אֲלֵיהֶם என்பதிலுள்ள பன்மை மறைமுகச் செயப்படுபொருளையும் காக்கிறது.
- source_word: לֹא נוּכַל לַעֲשׂוֹת הַדָּבָר הַזֶּה
  choice: இந்தக் காரியத்தை எங்களால் செய்ய முடியாது
  rationale: יכל குறிக்கும் இயலாமையையும், הַדָּבָר הַזֶּה என்பதிலுள்ள ‘இந்தக் காரியம்’ என்ற பெயர்ச்சொல் வடிவத்தையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: לָתֵת אֶת אֲחֹתֵנוּ
  choice: எங்கள் சகோதரியைக் கொடுக்க
  rationale: נתן என்பதன் ‘கொடுக்க’ என்ற நேரடிப் பொருளை வைத்திருக்கிறது; திருமணத்திற்குக் கொடுப்பது என்பது சுற்றுப்பின்னணியிலிருந்து தெளிவாகிறது.
- source_word: לְאִישׁ אֲשֶׁר לוֹ עָרְלָה
  choice: முன்தோல் உள்ள ஒரு மனிதனுக்கு
  rationale: ‘முன்தோல் உடைய ஒரு மனிதன்’ என்ற எபிரெய நேரடி சொல்லமைப்பைத் தமிழில் தெளிவாகக் காக்கிறது; ‘விருத்தசேதனம் செய்யப்படாதவன்’ என்ற இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי חֶרְפָּה הִוא לָנוּ
  choice: அது எங்களுக்கு அவமானம்
  rationale: חֶרְפָּה குறிக்கும் சமூக இழிவு, நிந்தை, அவமானம் ஆகிய பொருள் வட்டத்தை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
