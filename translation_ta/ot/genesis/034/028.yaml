  yaml_path: translation/ot/genesis/034/028.yaml
  text: They took their flocks[a], their herds, their donkeys, and whatever was in the city and whatever was in the field.
translation:
  language: ta
  text: அவர்களுடைய ஆட்டு மந்தைகளையும், மாட்டு மந்தைகளையும், கழுதைகளையும், நகரத்தில் இருந்தவற்றையும் வயல்வெளியில் இருந்தவற்றையும் எடுத்துக்கொண்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֹאנָם
  choice: அவர்களுடைய ஆட்டு மந்தைகள்
  rationale: צֹאן என்பது செம்மறியாடுகளையும் வெள்ளாடுகளையும் முதன்மையாகக் குறிக்கும் கூட்டுப்பெயர். தமிழில் இயல்பாகவும் இரு வகைகளையும் உள்ளடக்கும் வகையிலும் ‘ஆட்டு மந்தைகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּקָרָם
  choice: அவர்களுடைய மாட்டு மந்தைகள்
  rationale: בָּקָר என்பது மாடுகளைக் குறிக்கும் கூட்டுப்பெயர். மூலத்தின் கூட்டுப் பொருளையும் צֹאן உடனான இணைப்பையும் காக்க ‘மாட்டு மந்தைகள்’ பயன்படுத்தப்பட்டது.
- source_word: חֲמֹרֵיהֶם
  choice: அவர்களுடைய கழுதைகள்
  rationale: இச்சொல் நேரடியாகக் கழுதைகளைக் குறிக்கிறது; நவீனத் தமிழில் வழக்கமான சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲשֶׁר בָּעִיר
  choice: நகரத்தில் இருந்தவை
  rationale: אֲשֶׁר என்ற உறவுநிலை அமைப்பு இங்கு எடுத்துக்கொள்ளப்பட்ட பொருட்களை விரிவாகச் சுட்டுகிறது. ‘நகரத்தில் இருந்தவை’ என்பது அதன் திட்டவட்டமாக வரையறுக்கப்படாத பரப்பை இயல்பாகக் காட்டுகிறது.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: வயல்வெளியில் இருந்தவை
  rationale: שָׂדֶה என்பது வயல் அல்லது திறந்த நாட்டுப்புறப் பகுதியைக் குறிக்கலாம். சூழலில் இரு சாத்தியங்களையும் ஓரளவு தாங்கும் இயல்பான தமிழ்ச் சொல்லாக ‘வயல்வெளி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לָקָחוּ
  choice: எடுத்துக்கொண்டார்கள்
  rationale: לָקַח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்’. கொள்ளைச் சூழல் இருந்தாலும், ‘கவர்ந்துகொண்டார்கள்’ என விளக்கத்தை வலுப்படுத்தாமல் மூலத்திற்கு நெருக்கமாக ‘எடுத்துக்கொண்டார்கள்’ என வழங்கப்பட்டது.
