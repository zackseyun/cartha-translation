source:
  edition: WLC
  text: וַ/יֹּאמְר֑וּ הַ/כְ/זוֹנָ֕ה יַעֲשֶׂ֖ה אֶת אֲחוֹתֵֽ/נוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/031.yaml
  text: But they said[a], “Should he treat our sister like a prostitute?”
translation:
  language: ta
  text: ஆனால் அவர்கள், “அவன் எங்கள் சகோதரியை ஒரு விலைமகளைப் போல நடத்துவானா?[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் எங்கள் சகோதரியை ஒரு விலைமகளைப் போல செய்வானா?” எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் ‘செய்/ஆக்கு’; ஆனால் இச்சூழலில் அது ‘நடத்து’ என்ற பொருளில் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: ஆனால் அவர்கள் ... என்றார்கள்
  rationale: וַ־ இணைப்புடன் வரும் இந்த வினை முந்தைய வசனத்தில் யாக்கோபு கூறிய கண்டனத்துக்கு எதிரான சகோதரர்களின் கூர்மையான பதிலை அறிமுகப்படுத்துகிறது. சூழலின் எதிர்மறைத் தொடர்பை இயல்பான தமிழில் ‘ஆனால்’ வெளிப்படுத்துகிறது.
- source_word: הַכְזוֹנָה
  choice: ஒரு விபச்சாரியைப் போல
  rationale: வினாக்குறி הַ, ஒப்புமையைக் குறிக்கும் כְּ, மற்றும் ‘விபச்சாரி’ எனப் பொருள்படும் זוֹנָה ஆகியவற்றின் அமைப்பைத் தெளிவாகப் பேணுகிறது. நவீனத் தமிழில் இது புரிந்துகொள்ளக்கூடிய, கண்ணியமான சொற்றொடர்.
- source_word: יַעֲשֶׂה
  choice: நடத்தலாமா
  rationale: עָשָׂה என்பதன் அடிப்படைப் பொருள் ‘செய்/உருவாக்கு’ என்றாலும், ஒருவரை நேரடிப் பொருளாகக் கொண்ட இச்சூழலில் ‘நடத்து’ என்பது தமிழில் இயல்பான பொருள். முற்றுப்பெறாத வினைவடிவமும் வினாக்குறி அமைப்பும் சேர்ந்து கண்டனம் நிறைந்த சொல்லாட்சிக் கேள்வியாக மொழிபெயர்க்கப்பட்டுள்ளன.
- source_word: אֶת־אֲחוֹתֵנוּ
  choice: எங்கள் சகோதரியை
  rationale: אֶת என்பது நேரடிப் பொருள் குறியீடு என்பதால் தனியாக மொழிபெயர்க்கப்படவில்லை; אֲחוֹתֵנוּ என்பதிலுள்ள ‘எங்கள் சகோதரி’ என்ற குடும்ப உறவும் பன்மை உடைமையும் நேரடியாகப் பேணப்பட்டுள்ளன.
theological_decisions:
- issue: கேள்வியின் ஒழுக்கத் தொனி
  choice: ‘நடத்தலாமா?’ என்ற சொல்லாட்சிக் கேள்வியாகப் பேணப்பட்டது
  alternative: ‘அவன் எங்கள் சகோதரியை ... நடத்திவிட்டானே!’ என்று வெளிப்படையான குற்றச்சாட்டாக மாற்றுதல்
  rationale: எபிரெய உரை வினா வடிவில் உள்ளது. அது கடுமையான கண்டனத்தை உணர்த்தினாலும், உரையிலுள்ள வினா மற்றும் அதன் நெறிசார் பதற்றம் விளக்கவுரையால் தீர்மானிக்கப்படாமல் அப்படியே வைக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. சகோதரர்களின் கூர்மையான எதிர்வினையை ‘ஆனால்’ மற்றும் சொல்லாட்சிக் கேள்வி இயல்பாக வெளிப்படுத்துகின்றன; மூலத்தின் சுருக்கமும் பொருள் இருமையும் அடிக்குறிப்புடன் பேணப்பட்டுள்ளன.
