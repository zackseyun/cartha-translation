- from: உங்களிடையே உள்ள ஆண்கள் அனைவரும் விருத்தசேதனம் செய்யப்பட்டு[b], நீங்கள் எங்களைப் போல ஆனால், இந்த ஒரு நிபந்தனையின்பேரில் மட்டுமே நாங்கள் உங்களுக்குச் சம்மதிப்போம்[a].
  to: 'இந்த ஒரு நிபந்தனையின்பேரில் மட்டுமே நாங்கள் உங்களோடு உடன்படுவோம்: உங்களிடையே உள்ள ஒவ்வோர் ஆணும் விருத்தசேதனம் செய்யப்பட்டு, நீங்கள் எங்களைப் போல ஆகினால்.'
