translation_notes:
  register: நவீனத் தரத் தமிழில், பேச்சுவார்த்தையின் கட்டுப்படுத்தும் தொனியைத் தக்கவைக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘விருத்தசேதனம்’ என்பது பொதுவாக அறியப்பட்ட வேதாகமச் சொல்; தேவையற்ற சமயவழித் தனிச்சொல்லாக்கம் தவிர்க்கப்பட்டுள்ளது.
