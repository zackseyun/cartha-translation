source:
  edition: WLC
  text: אַךְ בְּ/זֹ֖את נֵא֣וֹת לָ/כֶ֑ם אִ֚ם תִּהְי֣וּ כָמֹ֔/נוּ לְ/הִמֹּ֥ל לָ/כֶ֖ם כָּל זָכָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/015.yaml
  text: 'Only on this condition will we agree with you: if you become like us[b][a], by circumcising every male among you.'
translation:
  language: ta
  text: 'இந்த ஒரு நிபந்தனையின்பேரில் மட்டுமே நாங்கள் உங்களோடு உடன்படுவோம்: உங்களிடையே உள்ள ஒவ்வோர் ஆணும் விருத்தசேதனம் செய்யப்பட்டு, நீங்கள் எங்களைப் போல ஆகினால்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: இந்த ஒரு நிபந்தனையின்பேரில் மட்டுமே
  rationale: אַךְ இங்கு உடன்பாட்டை ஒரே நிபந்தனைக்குள் வரையறுக்கிறது; בְּזֹאת அந்த நிபந்தனையைச் சுட்டுகிறது. தமிழில் இவ்வாறு கூறுவது கட்டுப்படுத்தும் வலியுறுத்தலையும் பேச்சுவார்த்தைச் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נֵאוֹת לָכֶם
  choice: நாங்கள் உங்களுக்குச் சம்மதிப்போம்
  rationale: Niphal வடிவிலுள்ள אוה விருப்பத்துடன் இணங்குதல் அல்லது சம்மதித்தல் என்ற பொருளைக் கொண்டது. לָכֶם என்பதன் திசைநிலைத் தொடர்பையும் தமிழின் இயல்பான சொல்லாட்சியையும் இது காக்கிறது.
- source_word: אִם תִּהְיוּ כָמֹנוּ
  choice: நீங்கள் எங்களைப் போல ஆனால்
  rationale: אִם நிபந்தனையை அறிமுகப்படுத்துகிறது; היה இங்கு புதிய நிலைக்குள் வருவதைக் குறிக்கிறது. ‘ஆனால்’ என்பது ‘ஆகினால்’ என்ற நிபந்தனைப் பொருளில் இயல்பான நவீனத் தமிழ்.
- source_word: לְהִמֹּל לָכֶם כָּל זָכָר
  choice: உங்களிடையே உள்ள ஆண்கள் அனைவரும் விருத்தசேதனம் செய்யப்பட்டு
  rationale: להמל என்பது Niphal infinitive என்பதால் செயப்படுபொருள் உணர்வை ‘செய்யப்பட்டு’ காக்கிறது. כָּל זָכָר பகிர்வுப் பொருளில் ஒவ்வொரு ஆணையும் உள்ளடக்குகிறது; לָכֶם அவர்களுடைய குழுவைச் சுட்டுவதால் ‘உங்களிடையே உள்ள’ என மொழிபெயர்க்கப்பட்டுள்ளது.
