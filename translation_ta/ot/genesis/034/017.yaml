  yaml_path: translation/ot/genesis/034/017.yaml
  text: But if you will not listen to us[a], to be circumcised[b], then we will take our daughter and go.
translation:
  language: ta
  text: ஆனால், விருத்தசேதனம் செய்துகொள்ளும்படி எங்கள் சொல்லுக்குச் செவிகொடுக்காவிட்டால்[a], எங்கள் மகளை அழைத்துக்கொண்டு புறப்பட்டுப் போய்விடுவோம்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விருத்தசேதனம் செய்துகொள்வதன் மூலம் எங்களுக்குச் செவிகொடுக்காவிட்டால்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் ‘விருத்தசேதனம் செய்துகொள்ள’ என்ற வினை வடிவம், அவர்கள் எங்கள் சொல்லுக்குச் செவிகொடுக்க வேண்டிய கோரிக்கையின் உள்ளடக்கத்தையோ, அதனுடன் தொடர்புடைய செயலையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: ஆனால், ... கேட்காவிட்டால்
  rationale: முந்தைய முன்மொழிவுக்கு மாறான நிபந்தனையை וְאִם அறிமுகப்படுத்துவதால், இயல்பான தமிழில் ‘ஆனால்’ என்பதுடன் நிபந்தனை வினைமுற்று பயன்படுத்தப்பட்டது.
- source_word: תִשְׁמְעוּ אֵלֵינוּ
  choice: நாங்கள் சொல்வதை நீங்கள் கேட்காவிட்டால்
  rationale: שׁמע + אֶל என்பதன் ‘ஒருவருக்குச் செவிகொடு/அவர் சொல்வதைக் கேள்’ என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; ‘கீழ்ப்படியாவிட்டால்’ என்பது மூலத்தின் உடனடிச் சொல்லாட்சியைவிட வலுவானது.
- source_word: לְ/הִמּוֹל
  choice: விருத்தசேதனம் செய்துகொள்ளும்படி
  rationale: நிபால் வினையெச்சம் சுன்னத்துச் செயலை ஏற்றுக்கொள்வதைக் குறிக்கிறது. தமிழில் ‘செய்துகொள்ள’ என்பது பிறரால் தமக்கு அந்தச் செயலைச் செய்வித்துக்கொள்ளும் பொருளை இயல்பாக வெளிப்படுத்துகிறது; லְ வினையெச்சம் கேட்க வேண்டிய கோரிக்கையின் உள்ளடக்கமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְ/לָקַחְנוּ אֶת בִּתֵּנוּ
  choice: எங்கள் மகளை அழைத்துக்கொண்டு
  rationale: לקח என்பதற்கு அடிப்படையாக ‘எடுத்துக்கொள்’ என்ற பொருள் இருந்தாலும், ஒருவரைத் தம்முடன் கூட்டிச் செல்வதைத் தமிழில் ‘அழைத்துக்கொண்டு’ என்பது இயல்பாகக் குறிக்கிறது. בִּתֵּנוּ என்பதன் ‘எங்கள் மகள்’ என்ற வடிவம் மாற்றமின்றிப் பாதுகாக்கப்பட்டது.
- source_word: וְ/הָלָכְנוּ
  choice: போய்விடுவோம்
  rationale: இந்தச் சூழலில் הלך புறப்பட்டுச் செல்வதைக் குறிக்கிறது. ‘போய்விடுவோம்’ நிபந்தனையின் விளைவாக அவர்கள் அங்கிருந்து விலகிச் செல்வதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: לְהִמּוֹל என்ற வினையெச்சத்துக்கும் ‘எங்களுக்குச் செவிகொடுங்கள்’ என்ற கோரிக்கைக்கும் உள்ள தொடர்பு
  choice: ‘விருத்தசேதனம் செய்துகொள்ளும்படி நாங்கள் சொல்வதை ... கேட்காவிட்டால்’ என்று, விருத்தசேதனத்தை அவர்கள் சொல்வதன் உள்ளடக்கமாக வழங்குதல்
  alternative: ‘விருத்தசேதனம் செய்துகொள்வதன் மூலம் எங்களுக்குச் செவிகொடுக்காவிட்டால்’ என்று, அதைச் செவிகொடுப்பதற்கான வழியாக வழங்குதல்
  rationale: எபிரெய வாக்கிய அமைப்பு உள்ளடக்கம் அல்லது அதற்கேற்ற செயல்பாடு ஆகிய நெருங்கிய நுணுக்கங்களை அனுமதிக்கிறது. முதன்மை உரை இயல்பான தமிழில் கோரிக்கையின் உள்ளடக்கத்தைத் தருகிறது; மாற்று உறவு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது. இதனால் உரைக்கு அப்பாற்பட்ட சமயக் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘விருத்தசேதனம்’ என்பது வேதாகமத் தமிழில் நிலைபெற்ற சொல்; ‘அழைத்துக்கொண்டு போய்விடுவோம்’ என்பது மூலத்தின் இரு தொடர்வினைகளையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
