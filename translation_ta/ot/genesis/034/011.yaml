translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘கண்களில் தயவு கிடைத்தல்’ என்ற உருவகம் முதன்மை உரையில் காக்கப்பட்டு, இயல்பான ‘பார்வையில்’ என்பது அடிக்குறிப்பில் தரப்பட்டுள்ளது. பேச்சாளர் ஆண் என்பதால் ‘என்றான்’ பயன்படுத்தப்பட்டது.
