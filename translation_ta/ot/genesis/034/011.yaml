  text: וַ/יֹּ֤אמֶר שְׁכֶם֙ אֶל אָבִ֣י/ה וְ/אֶל אַחֶ֔י/הָ אֶמְצָא חֵ֖ן בְּ/עֵינֵי/כֶ֑ם וַ/אֲשֶׁ֥ר תֹּאמְר֛וּ אֵלַ֖/י אֶתֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/011.yaml
  text: Then Shechem said to her father and to her brothers[a], “Let me find favor in your eyes, and whatever you say to me[b], I will give.”
translation:
  language: ta
  text: அப்போது சேகேம் அவளுடைய தந்தையிடமும் அவளுடைய சகோதரர்களிடமும், “உங்கள் கண்களில் எனக்குத் தயவு கிடைக்கட்டும்[a]. நீங்கள் என்னிடம் எதைக் கூறினாலும்[b], அதை நான் கொடுப்பேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் பார்வையில் எனக்குத் தயவு கிடைக்கட்டும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீங்கள் என்னிடம் எதைக் கேட்டாலும், அதை நான் கொடுப்பேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர் வடிவம் கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; நவீன தமிழில் அதன் தொடர்ச்சிப் பொருளை இயல்பாக வெளிப்படுத்த ‘அப்போது’ பயன்படுத்தப்பட்டது.
- source_word: שְׁכֶם
  choice: சீகேம்
  rationale: எபிரெய தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: אֶל אָבִיהָ וְאֶל אַחֶיהָ
  choice: அவளுடைய தந்தையிடமும் அவளுடைய சகோதரர்களிடமும்
  rationale: மீண்டும் வரும் אֶל இரு தரப்பினரையும் தனித்தனியாகச் சுட்டுகிறது; אַחֶיהָ ஆண்பால் பன்மை என்பதால் ‘சகோதரர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֶמְצָא חֵן
  choice: எனக்குத் தயவு கிடைக்கட்டும்
  rationale: ஏற்றுக்கொள்ளுதல் அல்லது நல்லெண்ணத்தை வேண்டுகிற எபிரெய மரபுத்தொடரின் வேண்டுகோள் தன்மையை இது இயல்பாகக் காக்கிறது.
- source_word: בְּעֵינֵיכֶם
  choice: உங்கள் கண்களில்
  rationale: எபிரெய மூலத்தின் ‘கண்களில்’ என்ற உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் காக்கிறது.
- source_word: וַאֲשֶׁר
  choice: எதை ... ஆனாலும்
  rationale: வரையறுக்கப்படாத தொடர்புச் சொல்லின் திறந்த பொருளை ‘எதை ... ஆனாலும்’ வெளிப்படுத்துகிறது.
- source_word: תֹּאמְרוּ אֵלַי
  choice: நீங்கள் என்னிடம் ... சொன்னாலும்
  rationale: אָמַר + אֶל என்பதன் நேரடிப் பொருளான ‘ஒருவரிடம் சொல்’ என்பதைக் காக்கிறது; சூழலுக்கேற்ப ‘கேட்டாலும்’ என்பது சாத்தியமானாலும் அதிக விளக்கமானது.
- source_word: אֶתֵּן
  choice: அதை நான் கொடுப்பேன்
  rationale: נָתַן என்பதன் பரந்த அடிப்படைப் பொருள் ‘கொடு’; மணமகள் விலை என்ற சூழலை முன்னிட்டு ‘செலுத்துவேன்’ என்று பொருளைக் குறுக்கவில்லை.
