translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. முதல் வாக்கியத்தில் வரும் ‘அவன்’ சீகேமைச் சுட்டுகிறது; அடுத்த வாக்கியத்தில் சுட்டுப்பெயர் குழப்பம் ஏற்படாமல் ‘யாக்கோபின் மகன்கள்’ என்று பெயர் மீண்டும் தரப்பட்டுள்ளது. மூலத்தில் இல்லாத தொடக்க கால/உரையாடல் குறிப்புச்சொல் சேர்க்கப்படவில்லை. ஆங்கில ஆலோசனை உரையில் அடிக்குறி குறியீடு ‘field’ என்பதற்குப் பின் இருந்தாலும், அடிக்குறிப்பு טִמֵּא என்ற சொல்லைப் பற்றியது என்பதால் தமிழில் அதற்குரிய ‘தீட்டுப்படுத்தினான்’ என்பதற்குப் பின் பொருத்தப்பட்டுள்ளது.
