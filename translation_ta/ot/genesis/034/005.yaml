base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/005.yaml
  text: Jacob heard that he had defiled his daughter Dinah. But his sons were with his livestock in the field[a], so Jacob kept silent until they came.
translation:
  language: ta
  text: யாக்கோபு, தன் மகளான தீனாளை அவன் தீட்டுப்படுத்தினான்[a] என்று கேள்விப்பட்டான். ஆனால் யாக்கோபின் மகன்கள் அவனுடைய கால்நடைகளுடன் வயல்வெளியில் இருந்தார்கள். ஆகவே அவர்கள் வரும்வரை யாக்கோபு மௌனமாக இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் மகள் தீனாளுக்கு அவன் அவமரியாதை செய்தான்.’ எபிரெய வினைச்சொல் சொல்லுக்குச் சொல் ‘தீட்டுப்படுத்தினான்’ அல்லது ‘அசுத்தமாக்கினான்’ என்று பொருள்படும்; இச்சூழலில் அது தீனாளுக்கு இழைக்கப்பட்ட பாலியல் அவமதிப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: கேள்விப்பட்டான்
  rationale: அறிக்கை அல்லது செய்தியைக் கேட்டறிவதை இங்கு குறிக்கிறது; இயல்பான தமிழ் கதைநடைக்கு ‘கேள்விப்பட்டான்’ பொருத்தமானது.
- source_word: כִּי
  choice: என்று
  rationale: யாக்கோபு கேள்விப்பட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: טִמֵּא
  choice: தீட்டுப்படுத்தினான்
  rationale: பியேல் வடிவம் அடிப்படையில் ‘தீட்டாக்குதல்/தூய்மையைக் கெடுத்தல்’ என்று பொருள்படும். இச்சூழலில் தீனாளுக்கு இழைக்கப்பட்ட பாலியல் அவமதிப்பைக் குறித்தாலும், எபிரெயச் சொல்லைவிடக் கூடுதலாகக் குறிப்பாக்காமல் அதன் தார்மீக-சமூக வலிமையை இத்தேர்வு காக்கிறது.
- source_word: בִתּוֹ
  choice: தன் மகள்
  rationale: இது யாக்கோபின் மகள் என்பதைத் தமிழில் இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: וּבָנָיו
  choice: ஆனால் யாக்கோபின் மகன்கள்
  rationale: மகன்கள் அப்போது அங்கில்லாதது யாக்கோபின் மௌனத்தை விளக்கும் மெல்லிய முரண்பாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது; பெயரை மீண்டும் கூறுவது தமிழில் சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்கிறது.
- source_word: הָיוּ אֶת מִקְנֵהוּ בַּשָּׂדֶה
  choice: அவனுடைய கால்நடைகளுடன் வயல்வெளியில் இருந்தார்கள்
  rationale: அவர்கள் கால்நடைகளை மேய்த்துக்கொண்டிருந்தார்கள் என்று மூலத்தில் வெளிப்படையாக இல்லாத செயலைச் சேர்க்காமல், அவர்களுடைய இருப்பிடத்தையும் உடனிருப்பையும் கூறுகிறது.
- source_word: מִקְנֵהוּ
  choice: அவனுடைய கால்நடைகள்
  rationale: மந்தைகள் உள்ளிட்ட வளர்ப்பு விலங்குகளை உள்ளடக்கும் விரிவான, இயல்பான தமிழ் சொல்.
- source_word: וְהֶחֱרִשׁ
  choice: மௌனமாக இருந்தான்
  rationale: பேசாமல் அல்லது உடனடியாகப் பதிலளிக்காமல் அடங்கியிருந்ததை கண்ணியமான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: עַד בֹּאָם
  choice: அவர்கள் வரும்வரை
  rationale: ‘அவர்கள் வரும் வரை’ என்பதே எபிரெயச் சொற்றொடரின் நேரடியான பொருள்; ‘திரும்பி வரும்வரை’ என்பது சூழலுக்கு ஏற்றதாக இருந்தாலும் மூலத்தில் வெளிப்படையாக இல்லை.
