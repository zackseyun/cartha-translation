translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் இருமுறை வரும் நகரவாசல் மரபுத்தொடர் தமிழில் முழுமையாக இருமுறை மொழிபெயர்க்கப்பட்டால் செயற்கையாக இருப்பதால், முதல் இடத்தில் ‘நகரவாசிகள்’ என்றும் இரண்டாம் இடத்தில் ‘நகரத்து ஆண்கள்’ என்றும் அதன் சூழற்பொருள் தரப்பட்டுள்ளது. ‘அவனுடைய’ என்பது அண்மைய ஒருமை உரிமையாளர் அமோரைக் குறிக்கும் மூலத்தின் வடிவத்தைத் தக்கவைக்கிறது.
