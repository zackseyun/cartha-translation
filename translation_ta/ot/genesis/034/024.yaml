base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/024.yaml
  text: And all who went out of the gate of his city listened to Hamor and to Shechem his son[a], and every male, all who went out of the gate of his city[c][b], was circumcised.
translation:
  language: ta
  text: அமோருக்கும், அவன் மகனான சீகேமுக்கும், அவனுடைய நகரத்து ஆண்கள் அனைவரும்[a] செவிகொடுத்தார்கள்[b]. அவனுடைய நகரத்து ஆண்கள் அனைவரும் விருத்தசேதனம் செய்யப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “அவனுடைய நகரத்தின் வாசலிலிருந்து வெளியே செல்கிற அனைவரும்.” இது நகரத்தின் பொது வாழ்விலும் முடிவெடுப்பிலும் பங்குகொண்ட நகரத்து ஆண்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “அமோருக்கும் அவன் மகன் சீகேமுக்கும் செவிசாய்த்தார்கள்.” எபிரெயச் சொற்றொடர் வெறுமனே கேட்பதோடு, அவர்களுடைய முன்மொழிவுக்கு இசைந்து பதிலளிப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֶל
  choice: செவிகொடுத்தார்கள்
  rationale: שׁמע אל என்பது வெறுமனே கேட்டதைக் காட்டிலும் ஒருவரின் சொல்லை ஏற்று அதன்படி செயல்படுவதைக் குறிக்கலாம். ‘செவிகொடுத்தார்கள்’ என்பது அந்தப் பதிலளிக்கும் நுண்ணுணர்வை இயல்பான தமிழில் தக்கவைக்கிறது; ‘கீழ்ப்படிந்தார்கள்’ என்று மிகுதியாகப் பொருள்கொள்ளவில்லை.
- source_word: כָּל יֹצְאֵי שַׁעַר עִירוֹ
  choice: அவனுடைய நகரவாசிகள் அனைவரும்
  rationale: சொல்லுக்குச் சொல் ‘அவனுடைய நகரத்தின் வாசலிலிருந்து புறப்படுகிற அனைவரும்.’ நகரவாசிகளின் பொது வாழ்வில் பங்குகொண்ட ஆண்களைக் குறிக்கும் எபிரெய மரபுத்தொடர் என்பதால், இயல்பான தமிழில் அதன் சூழற்பொருள் தரப்பட்டுள்ளது; விவரம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּנוֹ
  choice: அவன் மகன்
  rationale: சீகேம் அமோரின் மகன் என்பதை நேரடியாகக் குறிப்பிடுகிறது.
- source_word: וַיִּמֹּלוּ
  choice: விருத்தசேதனம் செய்துகொண்டார்கள்
  rationale: நிஃபால் வடிவம் இங்கு செயலுக்கு உட்பட்டதையோ தாமே அந்தச் சடங்கை ஏற்றுக்கொண்டதையோ குறிக்கலாம். தமிழ் இயல்பில் ‘செய்துகொண்டார்கள்’ அவர்கள் இதற்கு உடன்பட்டு அதை மேற்கொண்டதைத் தெரிவிக்கிறது; ஒவ்வொருவரும் தாமே உடல்செயலைச் செய்தனர் என்று கட்டாயப்படுத்தாது.
- source_word: כָּל זָכָר
  choice: ஆண்கள் அனைவரும்
  rationale: זָכָר பாலினத்தைச் சுட்டும் ‘ஆண்’ எனப் பொருள்படும். பன்மை வினையோடு இயல்பாக அமைய ‘ஆண்கள் அனைவரும்’ என்று தரப்பட்டுள்ளது.
