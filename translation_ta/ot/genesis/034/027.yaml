base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/027.yaml
  text: The sons of Jacob came upon the slain and plundered the city[c][b][a], because they had defiled their sister.
translation:
  language: ta
  text: யாக்கோபின் மகன்கள் கொல்லப்பட்டவர்கள்மேல் வந்தார்கள்[a]; அந்த நகரத்தைக் கொள்ளையிட்டார்கள்; ஏனெனில் அந்த நகரத்தார் யாக்கோபின் மகன்களின் சகோதரியைத் தீட்டுப்படுத்தியிருந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கொல்லப்பட்டவர்களுக்கு எதிராக வந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத் தொடர் ஏற்கெனவே கொல்லப்பட்டவர்கள்மேல் அல்லது அவர்களுக்கு எதிராக வருவதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொற்சொல்லாக, ‘அவர்கள் தங்கள் சகோதரியைத் தீட்டுப்படுத்திய நகரம்’ என்று சுருக்கமாக உள்ளது. பன்மை வினையின் செய்பவர்கள் வெளிப்படையாகக் குறிப்பிடப்படவில்லை; சூழலின்படி நகரத்தாரைக் குறிக்கிறது.
    reason: source_ambiguity
lexical_decisions:
- source_word: בְּנֵי יַעֲקֹב
  choice: யாக்கோபின் மகன்கள்
  rationale: எபிரெயக் கூட்டு அமைப்பை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது; குடும்பக் குழுவின் மீதான கதைசார் வலியுறுத்தலையும் காக்கிறது.
- source_word: בָּאוּ עַל הַחֲלָלִים
  choice: கொல்லப்பட்டவர்களின் நடுவே வந்து
  rationale: חֲלָלִים என்பது வன்முறையில் கொல்லப்பட்டவர்களைக் குறிக்கிறது. בָּאוּ עַל என்பது அவர்கள்மேல், அவர்களிடம், அல்லது அவர்களிடையே வந்ததைச் சுட்டலாம்; சூழலில் இயல்பாகப் புரியுமாறு ‘நடுவே வந்து’ எனத் தரப்பட்டுள்ளது.
- source_word: וַיָּבֹזּוּ הָעִיר
  choice: அந்த நகரத்தைக் கொள்ளையிட்டார்கள்
  rationale: בזז என்பது போருக்குப் பின் பொருட்களைச் சூறையாடுவதைக் குறிக்கிறது; ‘கொள்ளையிட்டார்கள்’ தெளிவான, தற்போதைய தமிழ்ச் சொல்.
- source_word: אֲשֶׁר
  choice: ஏனெனில்
  rationale: இது வடிவத்தில் தொடர்புச் சொல் என்றாலும், இங்குள்ள சுருக்கமான தொடரில் நகரம் கொள்ளையிடப்பட்டதற்கான காரணத்தை எடுத்துரைக்கும் பொருள் இயல்பாக உள்ளது.
- source_word: טִמְּאוּ
  choice: தீட்டுப்படுத்தியிருந்தார்கள்
  rationale: פיעל வடிவிலுள்ள טמא ஒழுக்க, சமூக, தூய்மை சார்ந்த அவமதிப்பின் பரப்பைத் தக்கவைக்கிறது. முன்னரே நிகழ்ந்த செயலைக் காட்ட இறந்தகால நிறைவு வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲחוֹתָם
  choice: யாக்கோபின் மகன்களின் சகோதரியை
  rationale: சொற்பொருள் ‘அவர்களுடைய சகோதரி.’ தமிழில் அருகிலுள்ள ‘அந்த நகரத்தார்’ என்பவர்களையே ‘அவர்கள்’ குறிக்கும் என்ற தவறான புரிதலைத் தவிர்க்க, உரிய தொடர்பு வெளிப்படையாக மீண்டும் சொல்லப்பட்டுள்ளது.
