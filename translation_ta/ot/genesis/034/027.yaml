translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குத் தெளிவாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. மூலத்தின் சுருக்கமான தொடர்புத் தொடரால் தமிழில் தோன்றக்கூடிய தவறான சுட்டுப்பெயர் தொடர்பைத் தவிர்க்க ‘அந்த நகரத்தார்’ மற்றும் ‘யாக்கோபின் மகன்களின் சகோதரி’ என்று வெளிப்படுத்தப்பட்டுள்ளது; மூல அமைப்பின் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
