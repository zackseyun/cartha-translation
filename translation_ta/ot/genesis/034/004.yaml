translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. தந்தையிடம் பேசுவதால் மரியாதைப் பன்மையான “தாருங்கள்” தேர்ந்தெடுக்கப்பட்டது; வசனம் சீகேமின் கோரிக்கையை மட்டும் பதிவு செய்கிறது, அதை ஒழுக்கரீதியாக ஏற்றுக்கொள்வதாக மொழிநடை மாற்றப்படவில்லை.
