  language: ta
  text: சீகேம் தன் தந்தை ஏமோரிடம், “இந்தப் பெண்ணை எனக்கு மனைவியாகப் பெற்றுத் தாருங்கள்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח־לִי
  choice: எனக்குப் பெற்றுத் தாருங்கள்
  rationale: இங்கு தந்தை திருமணத்தை ஏற்பாடு செய்து பெண்ணை மகனுக்கு மனைவியாகப் பெற வேண்டும் என்ற பொருளில் வரும் எபிரெய கட்டளையை, நவீனத் தமிழில் இயல்பாகவும் அதன் நோக்கைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: הַיַּלְדָּה הַזֹּאת
  choice: இந்தப் பெண்ணை
  rationale: יַלְדָּה என்பது இளம் பெண்ணைக் குறிக்கிறது; சூழலில் அவமதிப்பான அல்லது குழந்தைப் பருவத்தைக் கட்டாயப்படுத்தும் சொல்லைத் தவிர்த்து இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டது.
- source_word: לְאִשָּׁה
  choice: மனைவியாக
  rationale: திருமண உறவின் நோக்கத்தை நேரடியாகப் பாதுகாக்கிறது.
