translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பானதும் கண்ணியமானதுமான நடை. ‘கலப்புத் திருமணம் செய்துகொள்ளுங்கள்’ என்பது இன்றைய தமிழில் வேறு சமூகப் பொருள்நிழல்களை ஏற்படுத்தக்கூடும் என்பதால், பரஸ்பரத் திருமணக் கூட்டுறவைத் தெளிவாகக் காட்டும் ‘திருமண உறவு செய்துகொள்ளுங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
