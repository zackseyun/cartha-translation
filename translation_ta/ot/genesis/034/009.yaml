base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/009.yaml
  text: 'Intermarry with us: give your daughters to us[b][a], and take our daughters for yourselves.'
translation:
  language: ta
  text: 'எங்களோடு திருமண உறவு ஏற்படுத்திக்கொள்ளுங்கள்[a]: உங்கள் மகள்களை எங்களுக்குத் திருமணம் செய்து கொடுங்கள்; எங்கள் மகள்களை உங்கள் மனைவிகளாக எடுத்துக்கொள்ளுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொல்லுக்குச் சொல்: ‘எங்களோடு திருமணங்கள் செய்துகொள்ளுங்கள்.’ எபிரேய வினைச்சொல் பரஸ்பரமான திருமணக் கூட்டுறவை ஏற்படுத்துவதைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְחַתְּנוּ אֹתָנוּ
  choice: எங்களோடு திருமண உறவு செய்துகொள்ளுங்கள்
  rationale: התחתן என்பதன் ஹித்பயேல் வடிவம் பரஸ்பரமாகத் திருமண உறவுகளை ஏற்படுத்துவதைக் குறிக்கிறது. இந்தத் தமிழ் நடை அந்தப் பரஸ்பரத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּנֹתֵיכֶם
  choice: உங்கள் மகள்களை
  rationale: இது இரண்டாம் நபர் ஆண்பால் பன்மை பின்னொட்டுடன் வரும் நேரடியான பன்மை வடிவம்.
- source_word: תִּתְּנוּ לָנוּ
  choice: எங்களுக்குக் கொடுங்கள்
  rationale: இச்சூழலில் נתן என்பது மகள்களைத் திருமணத்திற்குக் கொடுப்பதைக் குறிக்கிறது. தொடக்கச் சொற்றொடர் திருமணச் சூழலைத் தெளிவாக்குவதால் எபிரெயச் சொல்லமைப்பு சுருக்கமாகப் பாதுகாக்கப்படுகிறது.
- source_word: וְאֶת בְּנֹתֵינוּ תִּקְחוּ לָכֶם
  choice: எங்கள் மகள்களை உங்களுக்காக எடுத்துக்கொள்ளுங்கள்
  rationale: לקח இங்கு திருமணத்திற்காக எடுத்துக்கொள்வதைக் குறிக்கிறது. இந்த மொழிபெயர்ப்பு எபிரெய மூலத்தின் ‘கொடுங்கள்/எடுத்துக்கொள்ளுங்கள்’ என்ற பரஸ்பர அமைப்பைப் பாதுகாக்கிறது.
