translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மூலத்தின் ‘நாற்றமெடுக்கச் செய்தல்’ என்ற உயிரோட்டமான உருவகம் முதன்மை உரையில் வைக்கப்பட்டு, அதன் சூழற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. எதிர்கால அச்சுறுத்தலைக் காட்டும் வினைத் தொடர் தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
