  text: וַ/יֹּ֨אמֶר יַעֲקֹ֜ב אֶל שִׁמְע֣וֹן וְ/אֶל לֵוִי֮ עֲכַרְתֶּ֣ם אֹתִ/י֒ לְ/הַבְאִישֵׁ֨/נִי֙ בְּ/יֹשֵׁ֣ב הָ/אָ֔רֶץ בַּֽ/כְּנַעֲנִ֖י וּ/בַ/פְּרִזִּ֑י וַ/אֲנִי֙ מְתֵ֣י מִסְפָּ֔ר וְ/נֶאֶסְפ֤וּ עָלַ/י֙ וְ/הִכּ֔וּ/נִי וְ/נִשְׁמַדְתִּ֖י אֲנִ֥י וּ/בֵיתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/030.yaml
  text: Then Jacob said to Simeon and Levi[a], “You have brought trouble on me, making me stink among the inhabitants of the land, among the Canaanites and the Perizzites. Since I am few in number, they will gather against me and strike me down[b], and I will be destroyed—I and my household.”
translation:
  language: ta
  text: அப்போது யாக்கோபு சிமியோனையும் லேவியையும் நோக்கி, “நீங்கள் என்னைப் பெருந்தொல்லைக்குள்ளாக்கிவிட்டீர்கள். இந்த நாட்டில் குடியிருக்கும் கானானியர், பெரிசியர் மத்தியில் என்னைத் துர்நாற்றம் வீசச் செய்துவிட்டீர்கள்.[a] என்னுடன் இருப்பவர்கள் எண்ணிக்கையில் மிகக் குறைவானவர்கள். அவர்கள் எனக்கு எதிராக ஒன்றுகூடி என்னைத் தாக்குவார்கள்; அப்போது நானும் என் வீட்டாரும் அழிந்துபோவோம்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பொருள்படி, “அவர்களிடையே என்னை அருவருப்புக்குரியவனாக்கிவிட்டீர்கள்.” எபிரெயத்தில் சொல்லர்த்தமாக, “என்னைத் துர்நாற்றம் வீசச் செய்துவிட்டீர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲכַרְתֶּם
  choice: எனக்குப் பெருந்தொல்லை உண்டாக்கிவிட்டீர்கள்
  rationale: עכר என்பது ஒருவர்மேல் தொல்லை அல்லது கேடு வரச்செய்வதைக் குறிக்கிறது. இத்தமிழாக்கம் யாக்கோபின் கடுமையான குற்றச்சாட்டை இயல்பாக வெளிப்படுத்துகிறது; அதேவேளை குறிப்பிட்ட வகையான பேரழிவாக அதை மிகைப்படுத்தவில்லை.
- source_word: לְהַבְאִישֵׁנִי
  choice: என்னை நாற்றமெடுக்கச் செய்துவிட்டீர்கள்
  rationale: באש என்ற வினையின் இபில் வடிவம் சொல்லர்த்தமாக ‘நாற்றமெடுக்கச் செய்தல்’ என்பதாகும்; இங்கு அது மக்களிடையே அருவருப்புக்குரியவனாக அல்லது வெறுக்கப்படுபவனாக ஆக்குவதை உருவகமாகக் குறிக்கிறது. எபிரெய மூலத்தின் வலுவான படிமம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
- source_word: בְּיֹשֵׁב הָאָרֶץ
  choice: இந்த நாட்டில் குடியிருக்கும்
  rationale: கூட்டொருமையான יֹשֵׁב நாட்டின் குடியிருப்போரைச் சுட்டுகிறது. தொடர்ந்து வரும் கானானியரும் பெரிசியரும் அந்தக் குடியிருப்போர் யார் என்பதை விளக்குவதால், தமிழில் இவ்வாறு தொடர்புபடுத்துவது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בַּכְּנַעֲנִי וּבַפְּרִזִּי
  choice: கானானியரிடமும் பெரிசியரிடமும்
  rationale: ב முன்னொட்டு யாக்கோபின் பெயர் கெட்டுப்போன சமூக வட்டத்தைச் சுட்டுகிறது. ‘-இடமும்’ என்ற அமைப்பு ‘அவர்களிடையே/அவர்களின் பார்வையில்’ என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: מְתֵי מִסְפָּר
  choice: எண்ணிக்கையில் மிகக் குறைவானவன்
  rationale: இந்த எபிரெய மரபுத்தொடர் எண்ணிக்கையில் சிறியவர்களாக இருப்பதைக் குறிக்கிறது. ஒருமை ‘நான்’ வடிவத்தைப் பேணியபடியே, யாக்கோபும் அவனைச் சேர்ந்தவர்களும் குறைந்த எண்ணிக்கையினர் என்ற கூட்டுப்பொருளைத் தமிழ் வெளிப்படுத்துகிறது.
- source_word: וְנֶאֶסְפוּ עָלַי
  choice: அவர்கள் எனக்கு எதிராக ஒன்றுகூடி
  rationale: אסף என்பதன் நிபால் வடிவம் பகைவர்கள் தாமாக ஒன்றுதிரண்டு எதிராக வருவதைச் சுட்டுகிறது. ‘ஒன்றுகூடி’ என்பது அந்தத் தற்சார்பு/கூட்டு நுட்பத்தை இயல்பான தமிழில் தருகிறது.
- source_word: וְהִכּוּנִי
  choice: என்னைத் தாக்குவார்கள்
  rationale: נכה என்பது அடித்தல், தாக்குதல், வீழ்த்துதல் ஆகிய பரந்த பொருள்களைக் கொண்டது. அடுத்ததாக முழு அழிவு குறிப்பிடப்படுவதால், இங்கு ‘தாக்குவார்கள்’ என்பது தேவையற்ற விளக்கத்தைச் சேர்க்காமல் வன்முறை அச்சுறுத்தலைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְנִשְׁמַדְתִּי
  choice: அழிந்துபோவோம்
  rationale: שׁמד முழுமையான அழிவை அல்லது ஒழித்துக்கட்டப்படுதலைக் குறிக்கிறது. ‘அழிந்துபோவோம்’ என்பது நவீனத் தமிழில் நேரடியானதும் வலுவானதும் ஆகும். எபிரெயத்தில் பின்னர் வரும் ‘நானும் என் வீட்டாரும்’ என்பதன் கூட்டுப்பொருளுக்கேற்ப தமிழ் பன்மை பயன்படுத்தப்படுகிறது.
- source_word: בֵּיתִי
  choice: என் வீட்டார்
  rationale: בַּיִת இங்கு கட்டடத்தை அல்ல, யாக்கோபின் குடும்பம் மற்றும் அவனுடைய இல்லத்துடன் சேர்ந்தவர்களை உள்ளடக்கிய வீட்டுக் குழுவைக் குறிக்கிறது. ‘வீட்டார்’ அந்த விரிவை ‘குடும்பம்’ என்பதைக் காட்டிலும் நன்றாகப் பேணுகிறது.
