base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/022.yaml
  text: Zillah also bore Tubal-cain[a], a forger of every cutting tool of bronze and iron[b]. And the sister of Tubal-cain was Naamah.
translation:
  language: ta
  text: சில்லாவும் தூபால்-காயீனைப் பெற்றெடுத்தாள். அவன் வெண்கலத்தாலும் இரும்பாலும் ஆன எல்லா வெட்டுக் கருவிகளையும் உருவாக்குபவன்.[a][b] தூபால்-காயீனின் சகோதரி நாமா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வெண்கலத்திலும் இரும்பிலும் வேலைசெய்யும் ஒவ்வொரு கைவினைஞன்’ என்றும் புரிந்துகொள்ளலாம். ‘தூபால்-காயீன்’ என்பதற்குப் பின்வரும் எபிரெயச் சொற்றொடர் கடினமானது; அது உலோகக் கருவிகளை உருவாக்குபவனையா, உலோகக் கைவினைஞனையா குறிக்கிறது என்பது உறுதியல்ல. ‘உருவாக்குபவன்’ என்பதற்கான சொல்லில் கூராக்குதல் அல்லது சுத்தியலால் அடித்தல் என்ற நுணுக்கமும் இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘வெண்கலம்’ என்பதை ‘செம்பு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַם הִוא
  choice: சில்லாளும்
  rationale: எழுவாயுடன் இணைந்த ‘உம்’ விகுதி, மற்றொரு மனைவியாகிய சில்லாளும் பிள்ளை பெற்றாள் என்ற சேர்க்கைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יָלְדָה
  choice: பெற்றெடுத்தாள்
  rationale: வம்சவரலாற்றுச் சூழலில் குழந்தையைப் பெற்றாள் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: תּוּבַל קַיִן
  choice: தூபால்-காயீன்
  rationale: கூட்டுப் பெயரின் இரு கூறுகளையும் ஒலிபெயர்த்து, அவற்றின் அமைப்பைக் காட்ட இடைக்கோடு பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֹטֵשׁ
  choice: வடிப்பவன்
  rationale: உலோகத்தைச் சுத்தியலால் அடித்தல், கூராக்குதல் அல்லது வடித்தல் ஆகியவற்றை உள்ளடக்கக்கூடிய தொழிற்பெயரின் சூழல்சார் பொருளை ‘வடிப்பவன்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: כָּל חֹרֵשׁ
  choice: எல்லாவகையான வெட்டுக் கருவிகளையும்
  rationale: கடினமான எபிரெயச் சொற்றொடரை உலோகத்தால் செய்யப்பட்ட கருவிகளைக் குறிப்பதாக முதன்மை உரையில் எடுத்துரைக்கிறது; ‘வெட்டுக்’ என்பது கூராக்கும் தொழிலுடன் உள்ள தொடர்பை வெளிப்படுத்துகிறது. மனிதக் கைவினைஞர்களைக் குறிக்கும் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: பண்டைய உலோகப் பட்டியல்களில் வழக்கமான பொருத்தம்; ‘செம்பு’ என்ற பொருளும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בַרְזֶל
  choice: இரும்பு
  rationale: இவ்வுலோகப் பெயருக்கான நேரான, நிலையான தமிழ்ச் சொல்.
- source_word: אֲחוֹת
  choice: சகோதரி
  rationale: உறவுமுறையைத் துல்லியமாகக் குறிக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: נַעֲמָה
  choice: நாமாள்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
