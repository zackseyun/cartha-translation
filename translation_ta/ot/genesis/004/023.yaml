base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/023.yaml
  text: 'And Lamech said to his wives[a], “Adah and Zillah, hear my voice; wives of Lamech, listen to my word: for I have killed a man for wounding me[b], even a young man for striking me.”'
translation:
  language: ta
  text: 'லாமேக்கு தன் மனைவிகளிடம் சொன்னான்:


    “ஆதாவே, சில்லாவே, என் குரலைக் கேளுங்கள்;

    லாமேக்கின் மனைவிகளே, என் சொல்லுக்குச் செவிகொடுங்கள்.


    என்னைக் காயப்படுத்தியதற்காக ஒரு மனிதனைக் கொன்றேன்[a];

    என்னை அடித்ததற்காக ஓர் இளைஞனையும் கொன்றேன்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “என் காயத்துக்காக ஒரு மனிதனையும், என் தழும்புக்காக ஓர் இளைஞனையும் கொன்றேன்” என மொழிபெயர்க்கலாம். எபிரெயத்தில் ‘காயம்’, ‘தழும்பு’ என்ற பெயர்ச்சொற்கள் உள்ளன.
    reason: lexical_alternative
  - marker: b
    text: லாமேக்கின் சொற்களை நிகழ்ந்த கொலையின் அறிக்கையாக அல்லாமல், “என்னைக் காயப்படுத்துகிற ஒருவனை நான் கொல்வேன்” என்ற அச்சுறுத்தல் அல்லது பொதுவான பெருமைப் பேச்சாகச் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: לְנָשָׁיו
  choice: தன் மனைவிகளிடம்
  rationale: இச்சூழலில் 3ஆம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியுடன் வரும் பன்மைச் சொல் லாமேக்கின் மனைவிகளையே தெளிவாகக் குறிக்கிறது; நவீன தமிழில் இயல்பாக இருப்பதற்காக ‘தன்’ பயன்படுத்தப்பட்டது.
- source_word: שְׁמַעַן קוֹלִי
  choice: என் குரலைக் கேளுங்கள்
  rationale: ‘குரல்’ என்ற எபிரெய நேரடி உருவகத்தைத் தக்கவைத்து, பெண்பால் பன்மைக் கட்டளையைத் தமிழில் மரியாதைப் பன்மை வடிவில் இயல்பாக வழங்குகிறது.
- source_word: הַאְזֵנָּה אִמְרָתִי
  choice: என் சொல்லுக்குச் செவிகொடுங்கள்
  rationale: முதல் அடியின் ‘கேளுங்கள்’ என்பதிலிருந்து வேறுபட்ட, கவனமாகக் கேட்கும் தீவிரத்தையும் கவிதை இணைநிலையையும் ‘செவிகொடுங்கள்’ காக்கிறது; אִמְרָה என்பதன் ஒருமையும் ‘சொல்’ எனத் தக்கவைக்கப்படுகிறது.
- source_word: הָרַגְתִּי
  choice: கொன்றேன்
  rationale: எபிரெய நிறைவுவினையின் மிக நேரடியான கடந்தகால அறிக்கை இங்கு பொருந்துகிறது; நிகழ்ந்த கொலையைக் குறிக்கும் வாசிப்பை முதன்மைப்படுத்துகிறது, ஆனால் மாற்று அச்சுறுத்தல் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְפִצְעִי
  choice: என்னைக் காயப்படுத்தியதற்காக
  rationale: לְ முன்னிடைச்சொல் மற்றும் ‘என் காயம்’ என்ற பெயர்ச்சொல் அமைப்பு பழிவாங்குதலின் காரணம் அல்லது சந்தர்ப்பத்தைக் குறிக்கலாம். அதனை நவீன தமிழில் இயல்பான வினைச்சொல் தொடராக அளிக்கிறது.
- source_word: יֶלֶד
  choice: ஓர் இளைஞன்
  rationale: இந்தச் சொல் குழந்தை, சிறுவன், இளைஞன் எனப் பொருள்படலாம். אִישׁ என்பதுடன் இணைநிலையில் வயதில் இளைய ஆணைக் குறிக்க ‘இளைஞன்’ பொருத்தமானது; சிறு குழந்தை என்று தேவையின்றி வரையறுக்கவில்லை.
- source_word: לְחַבֻּרָתִי
  choice: என்னை அடித்ததற்காக
  rationale: חַבּוּרָה என்பது அடி, தழும்பு அல்லது காயத்தைக் குறிக்கும். காரண அல்லது பழிவாங்குதல் உறவை இயல்பான தமிழில் வெளிப்படுத்தி, முந்தைய ‘காயப்படுத்துதல்’ என்பதிலிருந்து ஓரளவு வேறுபாட்டையும் காக்கிறது.
theological_decisions:
- issue: லாமேக்கின் கூற்று நிகழ்ந்த கொலையின் அறிக்கையா, அச்சுறுத்தலா?
  choice: ‘கொன்றேன்’ என்று நிகழ்ந்த செயலின் அறிக்கையாக முதன்மை உரையில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘என்னைக் காயப்படுத்தினால் ஒரு மனிதனைக் கொல்வேன்’ என்ற பொதுவான பெருமைப் பேச்சு அல்லது அச்சுறுத்தல்.
  rationale: எபிரெய qatal வடிவம் இயல்பாக நிறைவேறிய செயலைக் குறிக்கிறது. ஆயினும் கவிதைச் சூழலில் அது பொதுவான அல்லது நிபந்தனை சார்ந்த அச்சுறுத்தலாகப் புரிந்துகொள்ளப்பட்டுள்ளதால், அந்தச் சாத்தியம் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
- issue: லாமேக்கின் கொலை பழிவாங்குதலா அல்லது தற்காப்பா?
  choice: ‘காயப்படுத்தியதற்காக... அடித்ததற்காக’ என்று காரணத்தை மட்டும் கூறி, தற்காப்பு என்ற நியாயப்படுத்தலைச் சேர்க்கவில்லை.
  alternative: அவன் தற்காப்புக்காகக் கொன்றான் என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: மூல உரை தாக்குதலுக்கும் கொலைக்கும் உள்ள தொடர்பைக் கூறுகிறது; ஆனால் லாமேக்கின் நோக்கத்தை அறநெறி ரீதியாக நியாயப்படுத்துவதில்லை. ஆகவே அந்த இறையியல் மற்றும் அறநெறி இழுபறி தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. எபிரெயக் கவிதையின் இரட்டை அழைப்பு, இணைநிலைச் சொற்றொடர்கள், ‘குரல்/சொல்’ வேறுபாடு ஆகியவை காக்கப்பட்டுள்ளன. ‘செவிகொடுங்கள்’ இலக்கிய நயமுடையதாயினும் பொதுவாகப் புரியக்கூடிய நடையாகும்.
