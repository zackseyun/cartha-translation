  text: וְ/הֶ֨בֶל הֵבִ֥יא גַם ה֛וּא מִ/בְּכֹר֥וֹת צֹאנ֖/וֹ וּ/מֵֽ/חֶלְבֵ/הֶ֑ן וַ/יִּ֣שַׁע יְהוָ֔ה אֶל הֶ֖בֶל וְ/אֶל מִנְחָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/004.yaml
  text: And Abel also brought some of the firstborn of his flock[a], and of their fat portions. And Yahweh regarded Abel and his offering[b],
translation:
  language: ta
  text: ஆபேலும் தன் மந்தையின் முதற்பேறானவற்றில் சிலவற்றையும், அவற்றின் கொழுப்புப் பகுதிகளையும்[a] கொண்டுவந்தான். யாவே ஆபேலையும் அவனுடைய காணிக்கையையும் தயவுடன் நோக்கினார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “அவற்றின் கொழுப்பிலிருந்து.” இது காணிக்கையாகச் செலுத்தப்பட்ட விலங்குகளின் சிறந்த கொழுப்புப் பகுதிகளைக் குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: “ஆபேலையும் அவனுடைய காணிக்கையையும் பொருட்படுத்தினார்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶבֶל
  choice: ஆபேலும்
  rationale: வழக்கமான எபிரேயக் கதைத் தொடரிணைப்பையும், காயீனைப் பின்தொடரும் ஆபேலின் செயலை இயல்பான தமிழிலும் காட்டுகிறது.
- source_word: הֵבִיא
  choice: கொண்டுவந்தான்
  rationale: பலியோ காணிக்கையோ கொண்டுவரும் சூழலில் בוא வினையின் Hiphil வடிவத்துக்கு நேரான, இயல்பான தமிழ்.
- source_word: גַם הוּא
  choice: -உம்
  rationale: ஆபேலும் காயீனைப் போலவே காணிக்கை கொண்டுவந்தான் என்ற வலியுறுத்தலைத் தமிழின் இணைப்பும்மை சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מִבְּכֹרוֹת צֹאנוֹ
  choice: தன் மந்தையின் முதற்பேறானவற்றில் சிலவற்றை
  rationale: מן பகுதியைக் குறிக்கும் பயன்பாடு என்பதால், எல்லா முதற்பேறுகளையும் அல்லாமல் அவற்றில் சிலவற்றை ஆபேல் கொண்டுவந்தான் என்பதைத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: וּמֵחֶלְבֵהֶן
  choice: அவற்றின் கொழுப்புப் பகுதிகளை
  rationale: חֵלֶב என்பதன் நேரடிப் பொருளான கொழுப்பையும், பலியிடுதலில் சிறப்பாகப் பிரிக்கப்பட்ட கொழுப்புப் பகுதிகளையும் தேவையற்ற விளக்கமின்றி தக்கவைக்கிறது.
- source_word: וַיִּשַׁע
  choice: பொருட்படுத்தினார்
  rationale: ஒருவரை நோக்கித் திரும்பிக் கவனம் செலுத்துதல் அல்லது சாதகமாகக் கருதுதல் என்ற பொருளைத் தருகிறது; ஏற்றுக்கொண்ட விதத்தை உரை கூறாததால் அதனைச் சேர்ப்பதில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶל הֶבֶל וְאֶל מִנְחָתוֹ
  choice: ஆபேலையும் அவனுடைய காணிக்கையையும்
  rationale: மீண்டும் வரும் אֶל இரண்டையும் இறை நோக்கின் தனித்தனி இலக்குகளாகக் காட்டுவதைத் தமிழின் இரட்டைப் பொருள் உருபால் இயல்பாகப் பாதுகாக்கிறது.
- source_word: מִנְחָתוֹ
  choice: அவனுடைய காணிக்கை
  rationale: מִנְחָה என்பது பரிசு அல்லது அர்ப்பணம் என்னும் பரந்த பொருளுடையது; இங்கு வழிபாட்டுச் சூழலுக்கு இயல்பான சொல் ‘காணிக்கை’.
theological_decisions:
- issue: וַיִּשַׁע என்பதில் வெளிப்படும் இறை மறுமொழியின் தன்மை
  choice: யாவே ஆபேலையும் அவன் காணிக்கையையும் ‘பொருட்படுத்தினார்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தயவுடன் நோக்கினார்’ அல்லது ‘ஏற்றுக்கொண்டார்’.
  rationale: எபிரேய வினை சாதகமான கவனத்தை உணர்த்தினாலும், அது எவ்வாறு வெளிப்பட்டது என்பதை வசனம் குறிப்பிடவில்லை. ‘ஏற்றுக்கொண்டார்’ என்பது முடிவை மிகத் தெளிவாக நிர்ணயிக்கக்கூடும்; ‘பொருட்படுத்தினார்’ என்பது சாதகமான மறுமொழியைச் சுட்டியபடியே உரையின் இடைவெளியைப் பாதுகாக்கிறது.
translation_notes:
  register: நடை நவீனத் தரத் தமிழில் எளிமையாகவும் மதிப்புடனும் வைக்கப்பட்டுள்ளது. ‘முதற்பேறானவை’, ‘கொழுப்புப் பகுதிகள்’, ‘காணிக்கை’ ஆகியவை மூலத்தின் பலி சார்ந்த சொற்பொருளைத் தக்கவைக்கின்றன. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்புக் குறிகள் அவை விளக்கும் சொற்றொடர்களுடன் பொருந்தாமல் இடமாற்றம் அடைந்திருந்ததால், மூல எபிரேயத்தின் அடிப்படையில் [a] கொழுப்புப் பகுதிகளுக்குப் பின்னும் [b] இறை மறுமொழிக்குப் பின்னும் வைக்கப்பட்டுள்ளன.
