source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל קָ֑יִן לָ֚/מָּה חָ֣רָה לָ֔/ךְ וְ/לָ֖/מָּה נָפְל֥וּ פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/006.yaml
  text: Then Yahweh said to Cain[a], “Why are you angry, and why has your face fallen?”
translation:
  language: ta
  text: அப்போது யாவே காயீனிடம், “உனக்கு ஏன் கோபம்? உன் முகம் ஏன் வாடியிருக்கிறது?[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் முகம் ஏன் சோர்ந்திருக்கிறது?” எபிரெயத்தில் சொல்லுக்குச் சொல், “உன் முகம் ஏன் விழுந்தது?”
    reason: மூல எபிரெய உருவகத்தையும் அதன் இயல்பான மாற்று மொழிபெயர்ப்பையும் காட்டுகிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர் வடிவம் கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது. நவீன தமிழில் “அப்போது” நிகழ்வுகளின் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது; “என்றார்” மூலத்தின் பொதுவான ‘சொன்னார்’ என்ற வினையைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைவனின் தனிப்பெயரான நான்கு எழுத்துப் பெயர். அதை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக “யாவே” என வழங்கப்பட்டுள்ளது.
- source_word: אֶל קָיִן
  choice: காயீனிடம்
  rationale: אֶל இங்கு பேசப்படும் நபரைச் சுட்டுகிறது; தமிழில் “காயீனிடம்” என்பது இயல்பான இணைவு. קָיִן என்ற பெயர் “காயீன்” என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לָמָּה חָרָה לָךְ
  choice: உனக்கு ஏன் கோபம்?
  rationale: חָרָה என்பதன் அடிப்படை உருவகம் ‘எரிதல்’ என்றாலும், இச்சொற்றொடர் கோபத்தை குறிக்கும் எபிரெய மரபுத்தொடர். “உனக்கு ஏன் கோபம்?” அதன் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְלָמָּה נָפְלוּ פָנֶיךָ
  choice: உன் முகம் ஏன் வாடியிருக்கிறது?
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘உன் முகம் ஏன் விழுந்தது?’ என்பதாகும். தமிழில் “முகம் வாடியிருக்கிறது” என்பது துயரம் அல்லது மனச்சோர்வு முகத்தில் தெரிவதை இயல்பாகச் சொல்கிறது; மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் இறைவனின் தனிப்பெயரே நேரடியாக வருகிறது. ஆகவே அதை “கர்த்தர்” என்று மாற்றாமல் ஒலிபெயர்ப்பு செய்யப்பட்டுள்ளது. “யாவே” என்பது நவீன ஆய்வில் பொதுவாக ஏற்கப்படும் உச்சரிப்பைப் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீன, மரியாதையான, எளிதில் புரியும் பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. நேரடியான இரண்டு கேள்விகளின் சுருக்கமும் தீவிரமும் காக்கப்பட்டுள்ளன; வழக்கிலில்லாத சொல்லுக்குச் சொல் உருவகம் முதன்மை உரையில் இயல்பாக்கப்பட்டு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
