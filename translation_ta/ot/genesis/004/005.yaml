base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/005.yaml
  text: But for Cain and for his offering he had no regard[a]. So Cain became very angry[b], and his face fell.
translation:
  language: ta
  text: ஆனால் காயீனையும் அவனுடைய காணிக்கையையும் அவர் தயவுடன் நோக்கவில்லை.[a] அப்போது காயீன் மிகவும் கோபமடைந்தான்; அவன் முகம் வாடியது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “காயீனுக்கும் அவனுடைய காணிக்கைக்கும் அவர் மதிப்பளிக்கவில்லை.”'
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அவனுடைய முகம் விழுந்தது”; இது மனம் தளர்ந்து முகம் வாடியதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל קַיִן וְאֶל מִנְחָתוֹ
  choice: காயீனையும் அவனுடைய காணிக்கையையும்
  rationale: மீண்டும் வரும் אֶל, שָׁעָה என்ற வினையின் இரு பொருள்களையும்—காயீனையும் அவன் காணிக்கையையும்—குறிக்கிறது. மִנְחָה இச்சூழலில் வழிபாட்டுக்குரிய காணிக்கையைக் குறிக்கிறது.
- source_word: לֹא שָׁעָה
  choice: தயவுடன் நோக்கவில்லை
  rationale: שָׁעָה என்பது இங்கு சாதகமாக நோக்குதல் அல்லது மதிப்பளித்தல் என்னும் பொருளைத் தருகிறது. இத்தொடர் தெய்வீக அங்கீகாரம் வழங்கப்படாததை இயல்பான தமிழில் தெரிவிக்கிறது; அதற்கான காரணத்தைச் சேர்ப்பதில்லை.
- source_word: וַיִּחַר ... מְאֹד
  choice: மிகவும் கோபமடைந்தான்
  rationale: எபிரெயச் சொற்றொடரின் ‘எரிதல்’ உருவகத்தைச் சொற்சொல்லாகக் கொண்டுவராமல், கடுமையான கோபம் எழுந்ததை நவீனத் தமிழில் தெளிவாகத் தருகிறது. மְאֹד என்பதற்கு ‘மிகவும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּפְּלוּ פָנָיו
  choice: அவன் முகம் வாடியது
  rationale: சொற்சொல்லாக ‘அவனுடைய முகம் விழுந்தது’ என்றாலும், அது வெளிப்படும் மனச்சோர்வு அல்லது சுளிப்பைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘முகம் வாடியது’ உருவகத்தையும் இயல்பான தமிழையும் காக்கிறது.
theological_decisions:
- issue: காயீனின் காணிக்கைக்கு இறைவன் அளித்த பதிலின் தன்மை
  choice: ‘தயவுடன் நோக்கவில்லை’ என்று மொழிபெயர்த்து, அங்கீகாரம் வழங்கப்படாததை மட்டும் குறிப்பிடுதல்
  alternative: ‘ஏற்றுக்கொள்ளவில்லை’ என்று இன்னும் வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: எபிரெய உரை காயீனையும் அவன் காணிக்கையையும் அவர் சாதகமாக நோக்கவில்லை என்று கூறுகிறது; அதற்கான காரணத்தை இவ்வசனம் விளக்கவில்லை. ஆகவே எந்தக் கோட்பாட்டுக் காரணமும் மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘காணிக்கை’ வழிபாட்டுச் சூழலைத் தெளிவாக்குகிறது. ‘தயவுடன் நோக்கவில்லை’ என்பது மறுக்கப்பட்ட அங்கீகாரத்தைத் தெரிவிக்கிறது; மறுப்புக்கான காரணத்தை ஊகித்துச் சேர்ப்பதில்லை. அடிக்குறிப்பு குறியீடுகள் உரையில் முறையாக இடம்பெற்றுள்ளன.
