translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் கண்ணியமாகவும் மொழிபெயர்க்கப்பட்டது. எபிரெய பாலுறவு மரபுத்தொடர் தமிழில் தெளிவுக்காகப் பொருள் வழியில் தரப்பட்டு அடிக்குறிப்பில் சொற்படியான வடிவம் குறிப்பிடப்பட்டுள்ளது. நகரம் கட்டும் செயலில் உள்ள தொடர்நிலைக் கூறு பிரதான உரையில் பாதுகாக்கப்பட்டுள்ளது.
