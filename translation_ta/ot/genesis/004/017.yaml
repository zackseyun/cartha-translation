  source_fidelity: 'மூல எபிரெயத்தின் நிகழ்வுவரிசையும் பொருளும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: காயீன் மனைவியுடன் உடலுறவு கொண்டது, அவள் கருவுற்று ஏனோக்கைப் பெற்றது, காயீன் நகரம் கட்டிக்கொண்டிருந்தது, அதை மகன் ஏனோக்கின் பெயரால் அழைத்தது ஆகியவை அனைத்தும் சரியாக உள்ளன. בֹנֶה உடனான היה அமைப்பின் தொடர்நிலைக் சாத்தியத்தை ‘கட்டிக்கொண்டிருந்தான்’ நன்றாக வெளிப்படுத்துகிறது; அது கட்டாயமான ஒரே விளக்கம் எனக் கூறப்படவில்லை.'
