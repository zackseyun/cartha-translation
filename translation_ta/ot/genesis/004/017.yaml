base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/017.yaml
  text: Cain knew his wife[a], and she conceived and bore Enoch. He was building a city[d][c][b], and he named the city after his son Enoch.
translation:
  language: ta
  text: காயீன் தன் மனைவியுடன் உடலுறவு கொண்டான்[a]. அவள் கருவுற்று ஏனோக்கைப் பெற்றாள். காயீன் ஒரு நகரத்தைக் கட்டிக்கொண்டிருந்தான்[b]; அந்த நகரத்திற்குத் தன் மகன் ஏனோக்கின் பெயரைச் சூட்டினான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் சொற்பொருளாக, “தன் மனைவியை அறிந்தான்.” இது உடலுறவைக் குறிக்கும் வழக்குச் சொற்றொடர்.
    reason: cultural_note
  - marker: b
    text: 'இந்த எபிரெய இலக்கண அமைப்பு தொடர்ந்து நடைபெற்ற செயலைக் குறிக்கக்கூடும். வேறு மொழிபெயர்ப்பு: “ஒரு நகரத்தைக் கட்டினான்.”'
    reason: lexical_alternative
  - marker: c
    text: 'எபிரெய மூலத்தில் இன்னும் சொற்படியான வடிவம்: “அந்த நகரத்தின் பெயரைத் தன் மகனின் பெயரின்படி அழைத்தான்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: உடலுறவு கொண்டான்
  rationale: எபிரெய மொழியில் சொற்பொருளாக ‘அறிந்தான்’ என்றாலும், இச்சூழலில் இது பாலுறவைக் குறிக்கும் வழக்குச் சொற்றொடர். நவீனத் தமிழில் ‘அறிந்தான்’ என்பது பொருளைத் தெளிவாக உணர்த்தாததால் இயல்பான பொருள் மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- source_word: אִשְׁתּוֹ
  choice: தன் மனைவியுடன்
  rationale: இணைக்கப்பட்ட தன்மைச் சுட்டும் பின்னொட்டும் திருமணச் சூழலும் ‘தன் மனைவி’ என்பதைக் கோருகின்றன; உடலுறவைக் குறிக்கும் தமிழ் வினையுடன் ‘உடன்’ இயல்பாக அமைகிறது.
- source_word: וַתַּהַר וַתֵּלֶד
  choice: அவள் கருவுற்று ... பெற்றாள்
  rationale: கருத்தரித்தல் மற்றும் குழந்தையைப் பெற்றெடுத்தல் ஆகிய தொடர்ச்சியான நிகழ்வுகளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: חֲנוֹךְ
  choice: ஏனோக்கு
  rationale: தமிழ் வேதாகமப் பெயர் மரபில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: וַיְהִי בֹּנֶה עִיר
  choice: ஒரு நகரத்தைக் கட்டிக்கொண்டிருந்தான்
  rationale: היה உடன் வரும் பங்கேற்பு வடிவம் தொடர்ந்துகொண்டிருந்த செயலைக் குறிக்கக்கூடும்; ‘கட்டிக்கொண்டிருந்தான்’ அந்த முன்னேற்றத் தன்மையைப் பாதுகாக்கிறது.
- source_word: וַיִּקְרָא שֵׁם הָעִיר כְּשֵׁם בְּנוֹ
  choice: அந்த நகரத்திற்குத் தன் மகன் ஏனோக்கின் பெயரைச் சூட்டினான்
  rationale: ‘நகரத்தின் பெயரை மகனின் பெயரின்படி அழைத்தான்’ என்ற எபிரெய மொழி அமைப்பை, பொருளை முழுமையாகப் பாதுகாக்கும் இயல்பான நவீனத் தமிழில் தருகிறது.
