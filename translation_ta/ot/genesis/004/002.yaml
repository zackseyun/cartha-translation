  to: அவள் மீண்டும் காயீனின் சகோதரனாகிய ஆபேலைப் பெற்றெடுத்தாள்.[a] ஆபேல் மந்தைகளை மேய்ப்பவனானான்;[b] காயீனோ நிலத்தைப் பண்படுத்துபவனாக இருந்தான்.[c]
  rationale: திருத்தம் மூலத்தின் பொருளை மாற்றவில்லை. அடிக்குறிப்பு a-இல் உள்ள செயவைத்தல் சாயலை நீக்கி, יסף + infinitive அமைப்பின் மறுபிறப்பு/தொடர்ச்சி நுணுக்கம் தெளிவாக்கப்பட்டுள்ளது. b அடிக்குறிப்பு צאן பற்றிய பண்பாட்டு விளக்கமாக மட்டும் வைக்கப்பட்டுள்ளது. பிரதான உரையில் தொழிலைக் குறிக்கும் தமிழ்நடை சிறிது இயல்பாக்கப்பட்டுள்ளது.
