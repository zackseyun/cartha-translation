  text: וַ/תֹּ֣סֶף לָ/לֶ֔דֶת אֶת אָחִ֖י/ו אֶת הָ֑בֶל וַֽ/יְהִי הֶ֨בֶל֙ רֹ֣עֵה צֹ֔אן וְ/קַ֕יִן הָיָ֖ה עֹבֵ֥ד אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/002.yaml
  text: And she gave birth again[a], to his brother Abel. Abel became a shepherd of flocks[c][b], but Cain was a worker of the ground.
translation:
  language: ta
  text: அவள் மீண்டும் காயீனின் சகோதரனாகிய ஆபேலைப் பெற்றெடுத்தாள்.[a] ஆபேல் மந்தைகளை மேய்ப்பவனானான்;[b] காயீனோ நிலத்தைப் பண்படுத்துபவனாக இருந்தான்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவள் தொடர்ந்து பெற்றெடுத்தாள்.’ எபிரெய மரபுத்தொடர் சொற்படியாக ‘பெறுவதற்கு மேலும் செய்தாள்’ என்று அமைந்து, மறுபடியும் செய்தல் அல்லது தொடர்ந்து செய்தல் என்ற கருத்தைத் தருகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘மந்தைகள்’ என்பது குறிப்பாகச் செம்மறியாடுகளையும் வெள்ளாடுகளையும் போன்ற சிறிய கால்நடைகளைக் குறிக்கும்.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘நிலத்தை உழுகிறவனாக இருந்தான்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּסֶף לָלֶדֶת
  choice: அவள் மீண்டும் ... பெற்றெடுத்தாள்
  rationale: יסף என்பதுடன் வினையெச்சம் சேரும் இந்த எபிரெய மரபுத்தொடர், ஒரு செயலை மறுபடியும் செய்வதையோ தொடர்வதையோ குறிக்கிறது. இப்பிறப்பு வரிசையில் ‘மீண்டும் ... பெற்றெடுத்தாள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: אֶת אָחִיו אֶת הָבֶל
  choice: காயீனின் சகோதரனாகிய ஆபேலை
  rationale: ‘அவனுடைய’ என்ற எபிரெயப் பிரதிப்பெயர் காயீனைக் குறிக்கிறது. தமிழில் குழப்பம் தவிர்க்கப் பெயர் வெளிப்படையாகக் கொடுக்கப்பட்டு, ஆபேல் காயீனின் சகோதரன் என்ற உறவுமுறை வலியுறுத்தப்படுகிறது.
- source_word: הֶבֶל
  choice: ஆபேல்
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவில் தரப்படுகிறது.
- source_word: וַיְהִי
  choice: ஆனான்
  rationale: இங்கு היה ஆபேலின் தொழில் அல்லது பங்கை அறிமுகப்படுத்துகிறது. ‘ஆனான்’ கதை நகர்வை இயல்பாக வெளிப்படுத்துகிறது; ‘இருந்தான்’ என்பதும் சாத்தியம்.
- source_word: רֹעֵה צֹאן
  choice: ஆட்டு மந்தைகளை மேய்ப்பவன்
  rationale: רעה என்பது மேய்த்துப் பராமரிப்பதையும் צאן என்பது குறிப்பாகச் செம்மறியாடுகள், வெள்ளாடுகள் போன்ற சிறிய கால்நடைகளின் மந்தையையும் குறிக்கிறது. ‘ஆட்டு மந்தைகள்’ இந்தக் கூட்டுப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: קַיִן
  choice: காயீன்
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவில் தரப்படுகிறது.
- source_word: הָיָה עֹבֵד אֲדָמָה
  choice: நிலத்தைப் பண்படுத்துகிறவனாக இருந்தான்
  rationale: עבד + אדמה என்பது நிலத்தில் வேலைசெய்து அதைப் பயிரிடுவதைக் குறிக்கிறது. பொதுவான ‘விவசாயி’ என்பதைவிட இத்தேர்வு மூலத்தின் சொற்படிமத்தையும் ஆதியாகமத்தின் ‘நிலம்’ என்ற கருப்பொருள் இணைப்பையும் காக்கிறது.
- source_word: וְ
  choice: காயீனோ
  rationale: எபிரெய இணைப்புச்சொல் அடிப்படையில் ‘மற்றும்/ஆனால்’ என வரலாம். தமிழின் ‘-ஓ’ அமைப்பு சகோதரர்களின் வேறுபட்ட தொழில்களை இயல்பாக எதிரெதிராக நிறுத்துகிறது; எந்தத் தொழிலுக்கும் ஒழுக்க மதிப்பீட்டைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: சகோதரர்களின் தொழில்கள் பற்றிய கதைசொல்லல்
  choice: இருவரின் வெவ்வேறு தொழில்களையும் ஒழுக்க அல்லது ஆன்மிகத் தரவரிசை இல்லாமல் விவரித்தல்
  alternative: ஒரு தொழில் மற்றொன்றைவிட உயர்ந்தது என மறைமுகமாக உணர்த்துதல்
  rationale: இந்த வசனத்தில் எபிரெய உரை தொழில்களை விளக்கமாக மட்டுமே முன்வைக்கிறது; அவற்றுக்கிடையே எந்த ஒழுக்க அல்லது இறையியல் மதிப்பீட்டையும் வெளிப்படையாகக் கூறவில்லை.
- issue: וַיְהִי என்பதின் காலநிலை நுணுக்கம்
  choice: ஆபேலின் தொழில் கதைப்போக்கில் அறிமுகமாகும் விதமாக ‘ஆனான்’ என்று மொழிபெயர்த்தல்
  alternative: நிலையான நிலையைக் காட்டும் ‘இருந்தான்’
  rationale: இரு வாசிப்புகளும் היה என்பதன் பொருள் வரம்புக்குள் உள்ளன. முதன்மை உரை கதை நகர்வை வெளிப்படுத்துகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: மொழிநடை நவீனமான, பொதுவாகப் புரியும், ஆனால் கண்ணியமான தமிழில் அமைக்கப்பட்டுள்ளது. ‘காயீனோ’ என்ற வடிவம் எபிரெய இணைப்பின் எதிரெதிர் அமைப்பை இயல்பாகத் தருகிறது; தொழில்களுக்கு இடையே மதிப்பீடு சேர்க்கப்படவில்லை. ‘நிலம்’ என்பது தொடக்க ஆதியாகமப் பகுதிகளில் אֲדָמָה என்பதற்கான கருப்பொருள் தொடர்ச்சியைப் பாதுகாக்கிறது.
