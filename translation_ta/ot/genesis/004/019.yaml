base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/019.yaml
  text: Lamech took for himself two wives[a]. The name of the one was Adah[b], and the name of the other was Zillah.
translation:
  language: ta
  text: லாமேக்கு தனக்கென இரண்டு மனைவிகளை எடுத்துக்கொண்டான். ஒருத்தியின் பெயர் ஆதாள்; மற்றவளின்[a] பெயர் சில்லாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “இரண்டாமவளின் பெயர் சில்லாள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח לוֹ
  choice: தனக்கென எடுத்துக்கொண்டான்
  rationale: לקח என்பதன் அடிப்படைப் பொருளான ‘எடுத்துக்கொள்’ என்பதையும், לוֹ தரும் தன்நல/தனக்குரிய நுணுக்கத்தையும் காக்கிறது; அடுத்து வரும் ‘மனைவிகள்’ திருமணப் பொருளைத் தெளிவாக்குகிறது.
- source_word: שְׁתֵּי נָשִׁים
  choice: இரண்டு மனைவிகளை
  rationale: נָשִׁים என்பது பெண்கள் அல்லது மனைவிகள் எனப் பொருள்படலாம்; לקח לוֹ என்ற திருமணச் சூழலில் ‘மனைவிகள்’ என்பதே தெளிவான பொருள்.
- source_word: שֵׁם הָאַחַת
  choice: ஒருத்தியின் பெயர்
  rationale: இருவரில் ஒருவரைக் குறிக்கும் எபிரெய இணைப்பை இயல்பான தமிழில் வழங்குகிறது.
- source_word: עָדָה
  choice: ஆதாள்
  rationale: எபிரெய ஒலிவடிவமான ʿĀdâ-வைத் தமிழில் நெருக்கமாக ஒலிபெயர்க்கிறது.
- source_word: וְשֵׁם הַשֵּׁנִית
  choice: மற்றவளின் பெயர்
  rationale: הַשֵּׁנִית என்பதன் சொற்பொருள் ‘இரண்டாமவள்’; ஆனால் இருவர் மட்டுமே உள்ள சூழலில் ‘மற்றவள்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது. சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: צִלָּה
  choice: சில்லாள்
  rationale: எபிரெய Ṣillâ-வின் வலிய ṣ ஒலிக்கும் இறுதி āh ஒலிக்கும் நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: லாமேக்கின் பலமனைவி ஏற்பாட்டை எவ்வாறு கூறுவது
  choice: ‘இரண்டு மனைவிகள்’ என்று நிகழ்வை மட்டும் கூறுதல்
  alternative: ‘இரண்டு பெண்களை மணந்தான்’ அல்லது ஒழுக்க மதிப்பீட்டைச் சேர்த்தல்
  rationale: வசனம் திருமண உறவைத் தெளிவாக விவரிக்கிறது; ஆனால் அதைப் பற்றி ஒழுக்கத் தீர்ப்பு வழங்கவில்லை. எனவே மொழிபெயர்ப்பும் மதிப்பீட்டைச் சேர்க்காமல் உரையின் இறுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் எபிரெய வாக்கிய அமைப்புக்கு அளவான நெருக்கத்துடனும் மொழிபெயர்க்கப்பட்டது. ‘மணந்தான்’ என்பது இயல்பான மாற்றாக இருந்தாலும், மூலத்தின் לקח (‘எடுத்துக்கொண்டான்’) என்ற வடிவம் இங்கே பாதுகாக்கப்பட்டது.
