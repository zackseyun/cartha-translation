revisions:
- from: ஏனெனில், காயினுக்காக ஏழு மடங்கு பழிவாங்கப்படும்[a]; லாமேக்குக்காகவோ எழுபத்தேழு மடங்கு[b] பழிவாங்கப்படும்.
  to: ஏனெனில், காயினின் பழிக்காக ஏழு மடங்கு பழி வாங்கப்படும்; லாமேக்கின் பழிக்காகவோ எழுபத்தேழு மடங்கு பழி வாங்கப்படும்.
  rationale: The revision uses the natural Tamil expression ‘[ஒருவரின்] பழிக்காக ... பழி வாங்கப்படும்,’ avoiding the unnatural implication that Cain or Lamech themselves are the grammatical object of vengeance. It retains the causal connector, the passive/assured-future force, the escalating parallelism, and the source's seventy-seven reading. Footnote anchors are intentionally omitted because the supplied draft contains footnotes a and b but no corresponding anchor placement in the revised text is structurally necessary under the requested text field; the footnote content is retained unchanged.
