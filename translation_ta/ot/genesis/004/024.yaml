base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/024.yaml
  text: For Cain is avenged sevenfold[b][a], and Lamech seventy-sevenfold.
translation:
  language: ta
  text: ஏனெனில், காயினின் பழிக்காக ஏழு மடங்கு பழி வாங்கப்படும்; லாமேக்கின் பழிக்காகவோ எழுபத்தேழு மடங்கு பழி வாங்கப்படும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் வரும் லாமேக்கின் கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இங்கு செயல்படுகிறது.
- source_word: שִׁבְעָתַיִם
  choice: ஏழு மடங்கு
  rationale: பழிவாங்குதலின் ஏழு மடங்கான அளவைத் தமிழில் இயல்பாகவும் கவிதை இணைப்பைத் தக்கவைத்தும் தெரிவிக்கிறது.
- source_word: יֻקַּם
  choice: பழிவாங்கப்படும்
  rationale: נקם என்பதன் ஹோஃபால் வடிவம் செயப்பாட்டு பொருளில் ‘பழிவாங்கப்படுதல்’ என்பதைக் குறிக்கிறது. எபிரெய நிறைவுறா வினைவடிவம் உறுதியாக நிகழப்போகும் செயலைக் குறிக்கக்கூடும் என்பதால் தமிழ் எதிர்காலச் செயப்பாட்டு வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: קָיִן
  choice: காயின்
  rationale: தனிப்பெயர் தமிழின் வழக்கமான வேதாகம ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது.
- source_word: וְלֶמֶךְ
  choice: லாமேக்குக்காகவோ
  rationale: இணைப்புச் சொல் காயினுக்கும் லாமேக்குக்கும் இடையிலான ஒப்பீட்டு உயர்வைச் சுட்டுகிறது; ‘-வோ’ அந்த மாறுபாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שִׁבְעִים וְשִׁבְעָה
  choice: எழுபத்தேழு மடங்கு
  rationale: சொற்றொடர் நேரடியாக ‘எழுபதும் ஏழும்’ என்று பொருள்பட்டு எழுபத்தேழைக் குறிக்கிறது. ‘மடங்கு’ என்பது முந்தைய ‘ஏழு மடங்கு’ என்பதுடனான கவிதை இணைப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: லாமேக்கின் பழிவாங்குதல் குறித்த எண்ணின் விளக்கம்
  choice: எழுபத்தேழு மடங்கு
  alternative: எழுபது முறை ஏழு மடங்கு; எழுபத்தேழு முறை
  rationale: שִׁבְעִים וְשִׁבְעָה என்ற எபிரெய அமைப்பு இயல்பாக ‘எழுபத்தேழு’ என்பதையே குறிக்கிறது; ‘எழுபது முறை ஏழு’ என்று பொருள்கொள்வது பிற்கால வேதப்பகுதியின் சொற்களை இங்கு இறக்குமதி செய்யும் அபாயம் கொண்டது. ‘மடங்கு’ என்பது காயினைப் பற்றிய இணையான வரியுடன் ஒத்திசைகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைத் தன்மையும் இரு பகுதிகளின் உயர்வுறும் இணைப்பும் காக்கப்பட்டுள்ளன. ‘பழிவாங்கப்படும்’ என்ற வினை இரு பகுதிகளிலும் வெளிப்படையாகத் தரப்பட்டதால் சாதாரண வாசகருக்கு பொருள் தெளிவாகிறது; மூலத்தின் உறுதியான எதிர்காலம்/பொதுநியதி என்ற நுண்ணிய தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
