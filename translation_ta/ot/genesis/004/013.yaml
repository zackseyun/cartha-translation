source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר קַ֖יִן אֶל יְהוָ֑ה גָּד֥וֹל עֲוֺנִ֖/י מִ/נְּשֹֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/013.yaml
  text: And Cain said to Yahweh[a], “My iniquity is too great to bear.”
translation:
  language: ta
  text: காயீன் யாவேயிடம், “என் அக்கிரமம் என்னால் தாங்க முடியாத அளவுக்குப் பெரிதாயிருக்கிறது” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் குற்றப்பழி என்னால் தாங்க முடியாத அளவுக்குப் பெரிதாயிருக்கிறது”; வேறொரு வாசிப்பு, “என் தண்டனை என்னால் தாங்க முடியாத அளவுக்குப் பெரிதாயிருக்கிறது.” மேலும், “என் அக்கிரமம் மன்னிக்க முடியாத அளவுக்குப் பெரிதாயிருக்கிறது” என்றும் பொருள்கொள்ளலாம். எபிரெயச் சொற்கள் அக்கிரமம், குற்றப்பழி, அல்லது அதற்கான தண்டனையையும்; தாங்குதல் அல்லது சில சூழல்களில் மன்னித்தலையும் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான தமிழ்ச் சொற்றொடரில் வெளிப்படுத்துகிறது.
- source_word: קַיִן
  choice: காயீன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயரெழுத்தாக்கம்.
- source_word: אֶל
  choice: இடம்
  rationale: பேச்சு யாரை நோக்கி உரைக்கப்பட்டது என்பதை இயல்பான தமிழில் குறிக்க ‘யெகோவாவிடம்’ என இணைக்கப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நிலைபெற்றுள்ள ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: גָּדוֹל
  choice: தாங்க முடியாத அளவுக்குப் பெரிது
  rationale: מן உடன் வரும் ஒப்பீட்டு அமைப்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: עֲוֺנִי
  choice: என் அக்கிரமம்
  rationale: עָוֹן என்பதன் முதன்மையான ‘அக்கிரமம்/குற்றம்’ பொருளை முதன்மை உரையில் நேரடியாகப் பாதுகாக்கிறது; ‘குற்றப்பழி’ அல்லது ‘தண்டனை’ என்ற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: מִנְּשֹׂא
  choice: தாங்க முடியாத
  rationale: נשא வினையின் ‘சுமத்தல்/தாங்குதல்’ பொருளையும் מן குறிக்கும் அளவு-ஒப்பீட்டையும் சுருக்கமான இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: עֲוֺנִי מִנְּשֹׂא என்பதிலுள்ள பொருள் மயக்கம்
  choice: “என் அக்கிரமம் தாங்க முடியாத அளவுக்குப் பெரிதாயிருக்கிறது”
  alternative: “என் குற்றப்பழி தாங்க முடியாத அளவுக்குப் பெரிதாயிருக்கிறது”; “என் தண்டனை தாங்க முடியாத அளவுக்குக் கடுமையானது”; அல்லது “என் அக்கிரமம் மன்னிக்க முடியாத அளவுக்குப் பெரிது”
  rationale: עָוֹן என்பது அக்கிரமம், குற்றப்பழி, அல்லது அதற்கான தண்டனையைக் குறிக்கலாம்; נשא என்பது தாங்குதல் என்றும் சில சூழல்களில் மன்னித்தல் என்றும் பொருள்படலாம். முதன்மை உரை சொற்பொருளுக்கு நெருக்கமான வாசிப்பைத் தருகிறது; மாற்று வாசிப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ். மூலத்தின் சுருக்கத்தையும் முக்கியமான பொருள் மயக்கத்தையும் பாதுகாக்கிறது; ‘அக்கிரமம்’ என்பது சற்றே உயர்ந்தாலும் பரவலாகப் புரியக்கூடிய வேதாகமச் சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது.
