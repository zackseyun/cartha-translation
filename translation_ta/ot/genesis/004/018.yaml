source:
  edition: WLC
  text: וַ/יִּוָּלֵ֤ד לַֽ/חֲנוֹךְ֙ אֶת עִירָ֔ד וְ/עִירָ֕ד יָלַ֖ד אֶת מְחֽוּיָאֵ֑ל וּ/מְחִיּיָאֵ֗ל יָלַד֙ אֶת מְת֣וּשָׁאֵ֔ל וּ/מְתוּשָׁאֵ֖ל יָלַ֥ד אֶת לָֽמֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/018.yaml
  text: To Hanok was born Irad[a], and Irad fathered Mehujael, and Mehujael fathered Methushael, and Methushael fathered Lamech.
translation:
  language: ta
  text: ஹனோக்குக்கு ஈராத் பிறந்தான். ஈராத் மெஹூயாயேலை[a]ப் பெற்றான்; மெஹூயாயேல் மெதூஷாயேலைப் பெற்றான்; மெதூஷாயேல் லாமெக்கைப் பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இந்த வசனத்தில் ஒரே பெயரை எபிரெய மொழி இரண்டு எழுத்துவடிவங்களில் தருகிறது: மெஹூயாயேல், மெஹிய்யாயேல்.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּוָּלֵד
  choice: பிறந்தான்
  rationale: ילד என்பதன் நிஃபால் வடிவம் செயல்பாட்டு வினையாக அல்லாமல் பிறப்பைச் சுட்டும் வினையாக உள்ளது. தமிழில் ‘ஹனோக்குக்கு ஈராத் பிறந்தான்’ என்பது இயல்பாகவும் மூலத்தின் வேறுபாட்டைத் தக்கவைத்தும் உள்ளது.
- source_word: לַחֲנוֹךְ
  choice: ஹனோக்குக்கு
  rationale: ל முன்னொட்டு குழந்தை யாருக்குப் பிறந்தது என்பதைக் குறிக்கிறது. חֲנוֹךְ என்ற எபிரெயப் பெயர் மூலத்தை அணுகிய ஒலிபெயர்ப்பில் ‘ஹனோக்’ என வழங்கப்பட்டு, தமிழின் நான்காம் வேற்றுமை உருபு சேர்க்கப்பட்டுள்ளது.
- source_word: עִירָד
  choice: ஈராத்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் நெருக்கமாக வழங்கும் ஒலிபெயர்ப்பு.
- source_word: יָלַד
  choice: பெற்றான்
  rationale: இந்த வம்சவரலாற்றுத் தொடர்களில் Qal வடிவம் தந்தையாகப் பிள்ளையைப் பெறுதலைக் குறிக்கிறது. ‘பெற்றான்’ என்பது சுருக்கமான, இயல்பான நவீனத் தமிழ்; சூழலில் தந்தைவழிப் பிறப்பைக் குறிக்கிறது.
- source_word: מְחוּיָאֵל / מְחִיּיָאֵל
  choice: மெகூயவேல்
  rationale: ஒரே பெயருக்கு வசனத்திற்குள் காணப்படும் இரு எபிரெய எழுத்துவடிவங்களையும் முதன்மை உரையில் ஒரே வடிவமாக வழங்குவது வாசிப்பை எளிதாக்குகிறது; எழுத்துவடிவ வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מְתוּשָׁאֵל
  choice: மெத்தூசாவேல்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிகளைத் தமிழில் நெருக்கமாக வழங்கும் ஒலிபெயர்ப்பு.
- source_word: לָמֶךְ
  choice: லாமெக்
  rationale: எபிரெயத் தனிப்பெயரின் மூல ஒலிப்பை அணுகிய தமிழ் ஒலிபெயர்ப்பு.
