base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/009.yaml
  text: Then Yahweh said to Cain[a], “Where is Abel your brother?” And he said, “I do not know. Am I my brother’s keeper?”
translation:
  language: ta
  text: பின்பு யாவே காயீனிடம், “உன் சகோதரன் ஆபேல் எங்கே?” என்று கேட்டார். அதற்கு அவன், “எனக்குத் தெரியாது[a]. என் சகோதரனுக்குக் காவலாளி நானா?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்குத் தெரியவில்லை.” எபிரேய நிறைவு வினை வடிவத்தை இறந்தகால மறுப்பாகவும் மொழிபெயர்க்கலாம்; ஆனால் இச்சூழலில் தனக்குத் தற்போது தெரியாது என்று கூறுவதாக இயல்பாகப் பொருள்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיֹּאמֶר
  choice: பின்பு … கேட்டார் / அதற்கு அவன் … என்றான்
  rationale: தொடர்கதை நகர்வை ‘பின்பு’ காட்டுகிறது. முதல் நேரடி உரை கேள்வியாக இருப்பதால் தமிழில் ‘கேட்டார்’ இயல்பானது; இரண்டாவது உரைக்கு ‘என்றான்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֵי
  choice: எங்கே
  rationale: இடத்தை வினவும் சொல்லின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: הֶבֶל
  choice: ஆபேல்
  rationale: தனிப்பெயர் தமிழின் வழக்கமான வேதாகம ஒலிவடிவத்தில் தரப்பட்டுள்ளது.
- source_word: אָחִיךָ
  choice: உன் சகோதரன்
  rationale: ஆண்பால் ஒருமை உறவுமுறையையும் இரண்டாம் நபர் ஒருமை உடைமையையும் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: לֹא יָדַעְתִּי
  choice: எனக்குத் தெரியாது
  rationale: எபிரெய நிறைவுவினை வடிவம் இருந்தாலும், உரையாடல் சூழலில் இது தற்போது தனக்குத் தெரியாது என்று காயீன் மறுப்பதாக இயல்பாகப் புரிகிறது; காலநிலை மாற்றுச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: הֲשֹׁמֵר
  choice: காவலாளி
  rationale: שמר என்பதன் காத்தல், கண்காணித்தல் என்ற பொருளையும், பொறுப்பைப் பற்றிய காயீனின் சொல்லாட்சித் தன்மையுள்ள கேள்வியையும் கூடுதல் விளக்கமின்றிப் பாதுகாக்கிறது.
- source_word: אָחִי
  choice: என் சகோதரன்
  rationale: முதலாம் நபர் ஒருமை உடைமையையும் ஆண்பால் குடும்ப உறவையும் வெளிப்படையாகத் தருகிறது.
- source_word: אָנֹכִי
  choice: நானா
  rationale: சுயாதீனப் பதிலிப்பெயரின் வலியுறுத்தல் தமிழின் கேள்வி அமைப்பான ‘நானா?’ என்பதில் இயல்பாக வெளிப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் பட்டமல்ல, இறைவனின் தனிப்பெயரே உள்ளது. ஆகவே அதை ‘கர்த்தர்’ என்ற பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, உரையின் பெயர்சார் தன்மையைப் பாதுகாக்கிறது.
- issue: காயீனின் இறுதிக் கேள்வியில் பொறுப்புணர்வை வெளிப்படையாகச் சேர்ப்பதா
  choice: ‘என் சகோதரனின் காவலாளி நானா?’ என்று சொல்லாட்சித் தன்மையுள்ள கேள்வியாகவே வைத்தல்
  alternative: ‘என் சகோதரனைக் காக்க வேண்டியது என் பொறுப்பா?’
  rationale: மாற்று வாசகம் மறைமுகமாக உள்ள பொறுப்பு என்ற கருத்தை வெளிப்படுத்திவிடும். மூலத்தின் சுருக்கத்தையும் அதன் அறநெறிசார் பதற்றத்தையும் தீர்த்துவிடாமல் தற்போதைய வடிவம் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையைப் பயன்படுத்துகிறது. உரையாடல் இயல்புக்காக முதல் וַיֹּאמֶר ‘கேட்டார்’ எனச் சூழலுக்கேற்ப வழங்கப்பட்டுள்ளது; ‘காவலாளி’ மூலத்தின் சுருக்கமான சொல்லாட்சித் தன்மையுள்ள கேள்வியைப் பாதுகாக்கிறது.
