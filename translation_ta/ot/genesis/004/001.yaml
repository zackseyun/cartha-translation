source:
  edition: WLC
  text: וְ/הָ֣/אָדָ֔ם יָדַ֖ע אֶת חַוָּ֣ה אִשְׁתּ֑/וֹ וַ/תַּ֨הַר֙ וַ/תֵּ֣לֶד אֶת קַ֔יִן וַ/תֹּ֕אמֶר קָנִ֥יתִי אִ֖ישׁ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/001.yaml
  text: And Adam knew Eve his wife[a]; and she conceived and bore Cain, and said[b], “I have acquired a man from Yahweh.”
translation:
  language: ta
  text: ஆதாம் தன் மனைவியாகிய ஏவாளை அறிந்தான்; அவள் கருவுற்று காயீனை[a]ப் பெற்றெடுத்தாள். அப்போது அவள், “யாவேவிடமிருந்து ஓர் ஆணைப் பெற்றுக்கொண்டேன்”[b] என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “காயீன்” என்ற பெயர், “பெற்றுக்கொண்டேன்” அல்லது “கைக்கொண்டேன்” என்று பொருள்படும் கானீதி (קָנִיתִי) என்ற எபிரெய வினையுடன் ஒத்தொலிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “யாவேயுடன் ஓர் ஆணைப் பெற்றுக்கொண்டேன்.” இதை “யாவேவிடமிருந்து” அல்லது “யாவேயின் உதவியால்” என்றும் புரிந்துகொள்ளலாம்; “ஓர் ஆணை—யாவேயையே—பெற்றுக்கொண்டேன்” என்ற வாசிப்பும் சாத்தியமெனக் கருதப்பட்டாலும் அது குறைவான வாய்ப்புடையது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָאָדָם
  choice: ஆதாம்
  rationale: இங்கு הָאָדָם பொதுவாக மனிதகுலத்தைக் குறிக்காமல், முன்பு அறிமுகமான குறிப்பிட்ட மனிதனான ஆதாமைக் குறிக்கிறது. எபிரெய முன்னொட்டான வாவ் தரும் தொடர்ச்சியைத் தமிழ்ச் சொற்றொடரின் ஓட்டமும் அரைப்புள்ளியும் வெளிப்படுத்துகின்றன.
- source_word: יָדַע
  choice: அறிந்தான்
  rationale: ידע என்பதன் அடிப்படைப் பொருள் ‘அறிதல்’; இச்சூழலில் அது தாம்பத்திய உடலுறவைக் குறிக்கும் மரியாதையான மறைமுகச் சொல். மூலமொழியின் இலக்கிய உருவகத்தைப் பாதுகாக்க ‘அறிந்தான்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֶת חַוָּה אִשְׁתּוֹ
  choice: தன் மனைவியாகிய ஏவாளை
  rationale: பெயரையும் அவளுடைய உறவுநிலையையும் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: וַתַּהַר
  choice: அவள் கருவுற்று
  rationale: הרה வினையின் வழக்கமான பிறப்புக் கதைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַתֵּלֶד אֶת קַיִן
  choice: காயீனைப் பெற்றெடுத்தாள்
  rationale: ילד வினையின் பிறப்பைச் சுட்டும் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: קַיִן
  choice: காயீன்
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; קָנִיתִי என்பதுடனான எபிரெயச் சொல் விளையாட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: קָנִיתִי
  choice: பெற்றுக்கொண்டேன்
  rationale: קנה என்பதன் ‘பெறு/சம்பாதி/கைக்கொள்’ என்ற பொருளை இப்பிறப்புச் சூழலில் இயல்பாகத் தருகிறது; ‘படைத்தேன்’ என்ற தவறான இறையியல் உணர்வைத் தவிர்க்கிறது.
- source_word: אִישׁ
  choice: ஓர் ஆண்
  rationale: பிறந்த குழந்தையைக் குறிப்பிட்டாலும், எபிரெயம் ‘மகன்’ அல்லது ‘குழந்தை’ என்பதற்குப் பதிலாக אִישׁ என்ற ஆண்பாலைக் குறிக்கும் சொல்லைப் பயன்படுத்துகிறது. ‘ஓர் ஆண்’ அந்தச் சொல் தேர்வைப் பாதுகாக்கிறது.
- source_word: אֶת יְהוָה
  choice: யாவேவிடமிருந்து
  rationale: சிக்கலான אֶת என்பதை இங்கு மூலத்தை அளிப்பதாகப் புரிந்து, குழந்தை யாவேவிடமிருந்து கிடைத்தான் என்ற ஏவாளின் ஒப்புதலை இயல்பான தமிழில் வெளிப்படுத்துகிறது. உண்மையான இலக்கணப் பொருள் மயக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமமான יהוה ஒரு பொதுப் பட்டமாக மாற்றப்படாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: ஏவாளின் கூற்றிலுள்ள אֶת יְהוָה என்பதன் பொருள்
  choice: யாவேவிடமிருந்து
  alternative: யாவேயுடன்; யாவேயின் உதவியால்; ‘ஒரு மனிதனை—யாவேயையே—பெற்றுக்கொண்டேன்’
  rationale: எபிரெயக் கட்டமைப்பு உண்மையாகவே பலவிதமாகப் புரிந்துகொள்ளப்படக்கூடியது. முதன்மை உரை, குழந்தையின் ஆதாரம் யாவே என்று ஏவாள் ஒப்புக்கொள்வதாக எடுத்துக்கொள்கிறது; மற்ற முக்கிய வாசிப்புகளை அடிக்குறிப்பு வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடையின் சுருக்கமும் காக்கப்பட்டுள்ளன. ‘அறிந்தான்’ என்பது மூல எபிரெயத்தின் தாம்பத்திய மறைமுகச் சொல்லைத் தக்கவைக்கிறது; தொடரும் கருவுறுதல் அதன் சூழற்பொருளைத் தெளிவாக்குகிறது. அரிதான இறுதி எபிரெயக் கட்டமைப்பின் பொருள் மயக்கம் முதன்மை உரையில் கட்டாயமாகத் தீர்க்கப்படாமல் அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
