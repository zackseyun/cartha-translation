  text: וַ/יֹּ֥אמֶר קַ֖יִן אֶל הֶ֣בֶל אָחִ֑י/ו וַֽ/יְהִי֙ בִּ/הְיוֹתָ֣/ם בַּ/שָּׂדֶ֔ה וַ/יָּ֥קָם קַ֛יִן אֶל הֶ֥בֶל אָחִ֖י/ו וַ/יַּהַרְגֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/008.yaml
  text: And Cain said to Abel his brother. Then[a], while they were in the field, Cain rose up against Abel his brother and killed him.
translation:
  language: ta
  text: காயீன் தன் சகோதரன் ஆபேலிடம் சொன்னான். பின்பு[a], அவர்கள் வயலில் இருந்தபோது, காயீன் தன் சகோதரன் ஆபேலுக்கு எதிராக எழுந்து அவனைக் கொன்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மசோரெட்டிக் எபிரேய உரையில், “காயீன் தன் சகோதரன் ஆபேலிடம் சொன்னான்” என்று மட்டுமே உள்ளது; அவன் என்ன சொன்னான் என்பது அதில் இல்லை. செப்துவஜிந்தா, சமாரிய ஐந்தாகமம், வுல்காத்தா போன்ற பழமையான சாட்சிகளில், “வயலுக்குப் போவோம்” என்ற சொற்கள் காணப்படுகின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: சொன்னான்
  rationale: אָמַר என்பதன் நேரடியான பொருள் ‘சொல்’ என்பதாகும். மசோரா எபிரெய உரையில் சொல்லப்பட்ட வார்த்தைகள் விடுபட்டிருந்தாலும், வினைச்சொல்லை அதன் இயல்பான பொருளிலேயே மொழிபெயர்க்கிறது.
- source_word: אֶל
  choice: ஆபேலிடம்
  rationale: ஒருவரை நோக்கிய பேச்சின் திசையை אֶל குறிக்கிறது; நவீன தமிழில் ‘ஆபேலிடம் சொன்னான்’ என்பது இயல்பாகவும் எபிரெய அமைப்புக்கு நெருக்கமாகவும் உள்ளது.
- source_word: אָחִיו
  choice: தன் சகோதரனாகிய
  rationale: ‘அவனுடைய சகோதரன்’ என்ற உறவைத் தெளிவாகத் தக்கவைக்கிறது; ஒரே வசனத்தில் இருமுறை வரும் இச்சொல் சகோதரக் கொலையின் தீவிரத்தை வலியுறுத்துகிறது.
- source_word: וַיְהִי בִּהְיוֹתָם
  choice: பின்பு, அவர்கள் ... இருந்தபோது
  rationale: இது நிகழ்வுக்கான காலப் பின்னணியை அமைக்கும் எபிரெயக் கதைநடைச் சொற்றொடர். தமிழில் தெளிவான காலத் தொடர்ச்சியையும் ஒரே நேரத்தில் நிலவிய சூழலையும் வெளிப்படுத்துகிறது.
- source_word: בַּשָּׂדֶה
  choice: வயல்வெளியில்
  rationale: שָׂדֶה என்பது வயல் அல்லது திறந்த வெளிப்பகுதியைக் குறிக்கலாம். ‘வயல்வெளி’ இரு நிழற்பொருள்களையும் இயல்பாக உள்ளடக்குகிறது.
- source_word: וַיָּקָם ... אֶל
  choice: எதிராக எழுந்து
  rationale: தாக்குதலைக் குறிக்கும் எபிரெய உருவகச் சொல்லாட்சியைத் தக்கவைக்கிறது; ‘தாக்கினான்’ என்று விளக்கமாகச் சுருக்குவதைத் தவிர்க்கிறது.
- source_word: וַיַּהַרְגֵהוּ
  choice: அவனைக் கொன்றான்
  rationale: הרג என்பதன் நேரடியான பொருள் ‘கொல்’ என்பதாகும். ‘கொலை செய்தான்’ என்பது சட்ட அல்லது அறவியல் வகைப்பாட்டை அதிகமாக முன்னிறுத்தக்கூடும்.
theological_decisions:
- issue: மசோரா எபிரெய உரையில் இல்லாத காயீனின் பேச்சுச் சொற்களை முதன்மை உரையில் சேர்ப்பதா
  choice: கொடுக்கப்பட்ட WLC மசோரா உரையின் குறுகிய வாசகத்தை முதன்மை உரையில் வைத்துக் கொண்டு, பழமையான சாட்சிகளிலுள்ள கூடுதல் சொற்களை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: “வயல்வெளிக்குப் போவோம்” என்பதை முதன்மை உரையில் சேர்த்து, மசோரா உரையின் விடுபாட்டை அடிக்குறிப்பில் குறிப்பிடுதல்
  rationale: கொடுக்கப்பட்ட மூலமொழி உரையில் பேச்சின் உள்ளடக்கம் இல்லை. ஆயினும் செப்துவஜிந்தா, சமாரிய ஐந்நூல், வுல்காத்தா ஆகிய பழமையான சாட்சிகள் ஒரு வாசகத்தைப் பாதுகாக்கின்றன. எந்த வாசகம் மூலமானது என்பதை மறைமுகமாக முடிவுசெய்யாமல், மசோரா வாசகத்தை மொழிபெயர்த்து உரைவேறுபாட்டை வெளிப்படையாகக் குறிப்பிடுவது உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கதைநடையின் கண்ணியத்தையும் எபிரெய உரையின் மீளுரையையும் காக்க, ‘தன் சகோதரனாகிய ஆபேல்’ என்ற குறிப்பு இரு இடங்களிலும் தக்கவைக்கப்பட்டது. ‘வயல்வெளி’ என்பது சாதாரண வாசகருக்குப் புரியும் வகையில் வயல்/திறந்த வெளி என்ற பொருள் வரம்பை இயல்பாக எடுத்துரைக்கிறது.
