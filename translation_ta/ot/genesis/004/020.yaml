source:
  edition: WLC
  text: וַ/תֵּ֥לֶד עָדָ֖ה אֶת יָבָ֑ל ה֣וּא הָיָ֔ה אֲבִ֕י יֹשֵׁ֥ב אֹ֖הֶל וּ/מִקְנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/020.yaml
  text: Adah bore Jabal[a]; he was the father of those who dwell in tents and have livestock.
translation:
  language: ta
  text: ஆதா யாபாலைப் பெற்றெடுத்தாள்; அவனே கூடாரங்களில் வாழ்ந்து கால்நடைகளை வைத்திருப்பவர்களின் தந்தையாக[a] இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கூடாரங்களில் வாழ்ந்து கால்நடைகளை வைத்திருப்பவர்களின் முன்னோடி.” இங்கு “தந்தை” என்பதற்கான எபிரெயச் சொல் ஒரு வாழ்க்கைமுறையின் மூதாதை, தோற்றுவிப்பவர், அல்லது முன்மாதிரியான தொடக்கநபரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: பெற்றெடுத்தாள்
  rationale: வம்சவரலாற்றுச் சூழலில் ילד என்பதன் பிறப்பித்தல் என்ற பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: עָדָה
  choice: ஆதா
  rationale: எபிரெயப் பெயரின் ஒலிப்பை நவீனத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: יָבָל
  choice: யாபால்
  rationale: எபிரெயப் பெயரின் தொடக்க y ஒலியையும் நீண்ட உயிரொலிகளையும் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: הוּא הָיָה
  choice: அவனே
  rationale: யாபாலை வலியுறுத்தி அடையாளப்படுத்தும் எபிரெயக் கூற்றைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; வாக்கியத்தின் பெயர்ப்பயனிலை நிகழ்கால வடிவமின்றியே ‘அவன் தந்தையாக இருந்தான்’ என்ற பொருளை வெளிப்படுத்துகிறது.
- source_word: אֲבִי
  choice: தந்தை
  rationale: மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது; இச்சூழலில் முன்னோர், ஒரு வாழ்க்கைமுறையின் தொடக்கர் அல்லது முன்னோடி என்ற விரிவான பொருள் இருக்கலாம்.
- source_word: יֹשֵׁב אֹהֶל
  choice: கூடாரங்களில் குடியிருப்பவர்கள்
  rationale: ஒருமை வடிவிலுள்ள எபிரெயப் பங்கேற்புச் சொல் ஒரு மக்கள் வகுப்பைக் கூட்டாகக் குறிக்கிறது; தமிழில் பன்மை இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וּמִקְנֶה
  choice: கால்நடைகளை வைத்திருப்பவர்கள்
  rationale: מִקְנֶה என்பது மாடுகள் மட்டும் அல்லாமல் வளர்ப்பு மந்தைகள் அனைத்தையும் குறிக்கும். மூலத்தில் வெளிப்படையான வினை இல்லாததால், ‘வளர்ப்பவர்கள்’ அல்லது ‘மேய்ப்பவர்கள்’ எனக் கூடுதல் தொழில்சார் நுணுக்கம் சேர்க்காமல் ‘வைத்திருப்பவர்கள்’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: ‘தந்தை’ என்ற பண்பாட்டு-வம்சவழிப் பயன்பாடு
  choice: முதன்மை உரையில் ‘தந்தை’ என்ற எபிரெய உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘முன்னோடி’ அல்லது ‘தொடக்கர்’ என்று நேரடியாக விளக்குதல்
  rationale: இது உடல்சார் மூதாதை, வாழ்க்கைமுறையின் தொடக்கர், அல்லது முன்மாதிரி என்ற பல சாத்தியங்களை உடையது. முதன்மை உரையில் ஒன்றை மட்டும் தீர்மானிக்காமல், அடிக்குறிப்பில் பொருள் வரம்பு விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான வம்சவரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. ‘குடியிருப்பவர்கள்’ என்பது கூடார வாழ்க்கையைத் தெளிவுபடுத்துகிறது; ‘கால்நடைகள்’ என்பது மாடுகள் மட்டுமல்லாமல் ஆடுகள் உள்ளிட்ட வளர்ப்பு மந்தைகளையும் உள்ளடக்குகிறது.
