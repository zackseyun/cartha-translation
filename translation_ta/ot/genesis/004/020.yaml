- from: ஆதா யாபாலைப் பெற்றெடுத்தாள்; கூடாரங்களில் குடியிருந்து கால்நடைகளை வைத்திருப்பவர்களின் தந்தை அவனே.[a]
  to: ஆதா யாபாலைப் பெற்றெடுத்தாள்; அவனே கூடாரங்களில் வாழ்ந்து கால்நடைகளை வைத்திருப்பவர்களின் தந்தையாக[a] இருந்தான்.
