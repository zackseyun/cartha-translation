source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מֶ֣ה עָשִׂ֑יתָ ק֚וֹל דְּמֵ֣י אָחִ֔י/ךָ צֹעֲקִ֥ים אֵלַ֖/י מִן הָֽ/אֲדָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/010.yaml
  text: And he said[a], “What have you done? The voice of your brother’s blood is crying out to me from the ground.”
translation:
  language: ta
  text: 'அவர் சொன்னார்: “நீ என்ன செய்தாய்? உன் சகோதரனின் இரத்தத்தின்[a] குரல் நிலத்திலிருந்து என்னிடம் கூக்குரலிடுகிறது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “இரத்தங்கள்” என்று பன்மையில் உள்ளது; இரத்தம் சிந்தப்பட்ட சூழல்களில் இப்பன்மை வழக்கமாகப் பயன்படுத்தப்படுகிறது. தமிழில் இயல்பாக “இரத்தம்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவர் சொன்னார்
  rationale: வழக்கமான எபிரெயக் கதைநடைத் தொடர்ச்சியை இயல்பான தமிழில் தருகிறது; காலவரிசையை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: מֶה עָשִׂיתָ
  choice: நீ என்ன செய்தாய்?
  rationale: முடிந்த செயலைப் பற்றிய நேரடியான இறைக் குற்றச்சாட்டை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: קוֹל
  choice: குரல்
  rationale: இரத்தம் கடவுளை நோக்கிக் கூக்குரலிடுவதாக வரும் உயிரூட்டப்பட்ட உருவகத்தை ‘சத்தம்’ என்பதைக் காட்டிலும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: דְּמֵי
  choice: இரத்தம்
  rationale: எபிரெயத்தில் பன்மை வடிவம் இருந்தாலும், இரத்தம் சிந்துதலைக் குறிக்கும் இச்சூழலில் தமிழின் இயல்பான திரள்பொருள் ஒருமையான ‘இரத்தம்’ பொருத்தமானது; மூலவடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: אָחִיךָ
  choice: உன் சகோதரனின்
  rationale: எபிரெயச் சார்பு அமைப்பை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: צֹעֲקִים
  choice: கூக்குரலிடுகிறது
  rationale: நீதிக்காக எழும் தீவிர அழைப்பையும் தொடரும் செயலையும் தக்கவைக்கிறது. எபிரெய வினை பன்மை ‘இரத்தங்கள்’ என்பதோடு இயைந்தாலும், தமிழில் ‘இரத்தம்’ ஒருமையாக இருப்பதால் வினையும் ஒருமையில் அமைந்துள்ளது.
- source_word: אֵלַי
  choice: என்னை நோக்கி
  rationale: கூக்குரல் கடவுளையே நோக்கி எழுகிறது என்பதை நேரடியாகத் தெரிவிக்கிறது.
- source_word: מִן הָאֲדָמָה
  choice: நிலத்திலிருந்து
  rationale: காயீன் நிகழ்வில் நிலம்/மண் சார்ந்த படிமத்தைத் தக்கவைத்தபடி, பொதுவான நவீனத் தமிழில் இயல்பாக ஒலிக்கிறது.
theological_decisions:
- issue: ஆபேலின் சிந்தப்பட்ட இரத்தம் உயிருள்ளதுபோல் கூக்குரலிடும் உருவகம்
  choice: இரத்தத்தின் குரல் கடவுளை நோக்கிக் கூக்குரலிடுகிறது என்ற உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: இரத்தப்பழி நீதியைக் கோருகிறது என்று கருத்தை விளக்கி மொழிபெயர்த்தல்
  rationale: எபிரெய உரை இரத்தத்தை உயிரூட்டிக் காட்டும் வலிமையான உருவகத்தைப் பயன்படுத்துகிறது. அதைச் சுருக்கமான கோட்பாட்டு விளக்கமாக மாற்றாமல் வைத்திருப்பது உரையின் அறநெறி மற்றும் இறையியல் அழுத்தத்தையும் அதன் திறந்த பொருள் பரப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘குரல்’ மற்றும் ‘கூக்குரலிடுகிறது’ என்பவை மூலத்தின் உயிரூட்டப்பட்ட படிமத்தையும் தீவிரத்தையும் தக்கவைக்கின்றன.
