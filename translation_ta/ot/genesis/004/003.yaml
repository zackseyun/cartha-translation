language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַֽ/יְהִ֖י מִ/קֵּ֣ץ יָמִ֑ים וַ/יָּבֵ֨א קַ֜יִן מִ/פְּרִ֧י הָֽ/אֲדָמָ֛ה מִנְחָ֖ה לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/003.yaml
  text: And in the course of time[c][b][a], Cain brought to Yahweh an offering from the fruit of the ground.
translation:
  language: ta
  text: சில காலம் சென்றபின்[a], காயீன் நிலத்தின் விளைச்சலில் சிலவற்றை[b] யாவேக்குக்[c] காணிக்கையாகக் கொண்டுவந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘நாட்களின் முடிவிலிருந்து’; அதாவது, ஒரு காலப்பகுதி கடந்தபின்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நிலத்தின் கனியிலிருந்து.’
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் יהוה (YHWH) என்ற இறைப் பெயர்; ‘கர்த்தர்’ என்றும் மரபாக வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ יָמִים
  choice: சில காலம் சென்றபின்
  rationale: וַיְהִי அடுத்த நிகழ்வைத் தொடங்குகிறது; מִקֵּץ יָמִים என்பது சொல்லுக்குச் சொல் ‘நாட்களின் முடிவிலிருந்து’ என்றாலும், இச்சூழலில் காலம் கடந்ததைக் குறிக்கும் இயல்பான காலத் தொடர்.
- source_word: וַיָּבֵא
  choice: கொண்டுவந்தான்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் இங்கு ஒன்றைக் கொண்டுவந்து சமர்ப்பிப்பதைக் குறிக்கிறது.
- source_word: קַיִן
  choice: காயீன்
  rationale: எபிரெய தனிப்பெயருக்கு ஏற்ற, தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: מִפְּרִי הָאֲדָמָה
  choice: நிலத்தின் விளைச்சலில் சிலவற்றை
  rationale: פְּרִי என்பது இங்கு பயிர் விளைச்சலைக் குறிக்கிறது; אֲדָמָה என்பது நிலம். מִן பகுதியைக் குறிக்கக்கூடியதால் ‘சிலவற்றை’ என இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: מִנְחָה
  choice: காணிக்கையாக
  rationale: מִנְחָה என்பது பரிசு, திறை அல்லது காணிக்கை எனப் பரந்த பொருளுடையது; இறைவழிபாட்டுச் சூழலில் ‘காணிக்கை’ தெளிவானதும் வகையை மிகையாகக் குறுக்காததும் ஆகும்.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: לְ என்பது பெறுநரைக் குறிக்கும் ‘-க்கு’; יהוה என்ற தனிப்பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் பொதுப்பட்டம் அல்ல, יהוה என்ற தனிப்பெயரே உள்ளது. ஆகவே அதைப் பட்டமாக மாற்றாமல், ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புக்கு அருகாக ‘யாவே’ என வழங்குவது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: מִקֵּץ יָמִים என்பதன் பொருள்
  choice: காலம் கடந்ததைக் குறிக்கும் ‘சில காலம் சென்றபின்’
  alternative: நாட்களின் முடிவில்
  rationale: இங்கு இறுதிக்காலத்தைப் பற்றிய கருத்து இல்லை; காணிக்கையைக் கொண்டுவந்ததற்கு முன் ஒரு காலப்பகுதி கடந்ததை கதைச்சூழல் குறிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘விளைச்சல்’ வேளாண் சூழலில் ‘கனி’ என்பதைவிட இயல்பானது; சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
