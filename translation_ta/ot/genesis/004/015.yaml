source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר ל֣/וֹ יְהוָ֗ה לָ/כֵן֙ כָּל הֹרֵ֣ג קַ֔יִן שִׁבְעָתַ֖יִם יֻקָּ֑ם וַ/יָּ֨שֶׂם יְהוָ֤ה לְ/קַ֨יִן֙ א֔וֹת לְ/בִלְתִּ֥י הַכּוֹת אֹת֖/וֹ כָּל מֹצְאֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/015.yaml
  text: Then Yahweh said to him[a], “Therefore whoever kills Cain, vengeance will be taken on him sevenfold.” And Yahweh put a mark on Cain[b], lest anyone finding him should strike him.
translation:
  language: ta
  text: அப்போது யாவே அவனிடம்[a], “ஆகையால், காயீனைக் கொல்கிற எவர்மீதும் ஏழுமடங்கு பழிவாங்கப்படும்” என்றார். காயீனைக் கண்டடையும் எவரும் அவனைத் தாக்காதபடி, யாவே காயீன்மேல் ஓர் அடையாளத்தை வைத்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனிடம்’ என்பது காயீனைக் குறிக்கிறது.
    reason: referent_clarification
  - marker: b
    text: ‘குறி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பொதுவாக ஓர் அடையாளத்தையோ வேறுபடுத்திக் காட்டும் குறியையோ குறிக்கலாம்; அது எந்த வடிவில் இருந்தது என்பதை இவ்வுரை குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לָכֵן
  choice: ஆகையால்
  rationale: காயீனுக்கு யாவே அளிக்கும் பதிலின் முடிவுறுத்தும் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: כָּל הֹרֵג קַיִן
  choice: காயீனைக் கொல்கிற எவன்
  rationale: எபிரெய மொழியின் பொதுவான, வரையறுக்கப்படாத பொருளை நவீன தமிழில் இயல்பாக எடுத்துரைக்கிறது.
- source_word: שִׁבְעָתַיִם
  choice: ஏழுமடங்கு
  rationale: பழிவாங்குதலின் ஏழு மடங்கான அளவைச் சுருக்கமாகவும் துல்லியமாகவும் வெளிப்படுத்துகிறது.
- source_word: יֻקָּם
  choice: பழிவாங்கப்படும்
  rationale: எபிரெயச் செயப்பாட்டு வடிவத்தையும் செய்பவர் குறிப்பிடப்படாத நிலையையும் காக்கிறது; சூழலில் பழிவாங்குதல் காயீனைக் கொல்பவன்மீது வருவதை ‘எவன்மீதும்’ தெளிவாக்குகிறது.
- source_word: אוֹת
  choice: அடையாளம்
  rationale: இச்சொல் ஒரு குறியையோ வேறுபடுத்திக் காட்டும் அடையாளத்தையோ குறிக்கலாம்; அதன் வடிவம் என்னவென்று வசனம் கூறாததால் பொதுவான தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְבִלְתִּי הַכּוֹת אֹתוֹ
  choice: அவனைத் தாக்காதபடி
  rationale: எதிர்மறை நோக்கத்தைக் காட்டுவதோடு, נכה என்பதன் நேரடியான ‘தாக்கு/அடி’ பொருளையும் காக்கிறது; ‘கொல்லாதபடி’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: כָּל מֹצְאוֹ
  choice: காயீனைக் காண்கிற எவரும்
  rationale: எபிரெயப் பங்கேற்புச் சொல்லின் வரையறுக்கப்படாத பொதுவான வீச்சைத் தெளிவான தமிழில் தருகிறது; சுட்டுப்பெயரின் குழப்பத்தைத் தவிர்க்க காயீனின் பெயர் மீண்டும் பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: காயீனுக்கு வழங்கப்பட்ட אות என்பதன் இயல்பு
  choice: அதன் வடிவத்தையோ தன்மையையோ குறிப்பிடாமல் ‘அடையாளம்’ என மொழிபெயர்க்கப்பட்டது.
  alternative: குறி
  rationale: எபிரெய உரை அது உடலில் இடப்பட்ட குறியா, காணத்தக்க வேறு அடையாளமா, அல்லது வேறுவகைச் சின்னமா என்பதை வரையறுக்கவில்லை; ஊகத்தை மொழிபெயர்ப்புக்குள் கொண்டுவராமல் இந்தத் தெளிவின்மை காக்கப்படுகிறது.
- issue: ஏழுமடங்கு பழிவாங்கப்படுபவர் யார்
  choice: காயீனைக் கொல்பவன்மீதே பழிவாங்குதல் வரும் என்று வாக்கிய அமைப்பில் தெளிவுபடுத்தப்பட்டது.
  alternative: ‘அவன் ஏழுமடங்கு பழிவாங்கப்படுவான்’ என்ற சொற்சார்ந்த ஆனால் தமிழில் குழப்பமளிக்கக்கூடிய வடிவம்
  rationale: எபிரெயச் செயப்பாட்டு வடிவம் சுருக்கமானது; சூழல் காயீனைக் கொல்பவருக்கு எதிரான எச்சரிக்கையைக் காட்டுகிறது. செய்பவரைச் சேர்க்காமல், பழிவாங்குதலின் இலக்கு மட்டும் தெளிவாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில், மரியாதையும் வேதாகம உரைக்கு ஏற்ற கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவே’ எனத் தேவனுடைய தனிப்பெயர் காக்கப்பட்டுள்ளது. செயப்பாட்டு வடிவத்தின் சுருக்கமும் אות என்பதன் தெளிவின்மையும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
