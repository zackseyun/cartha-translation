base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/011.yaml
  text: And now you are cursed from the ground[c][b][a], which has opened its mouth to receive your brother’s blood from your hand.
translation:
  language: ta
  text: இப்போதோ, நீ நிலத்திலிருந்து சபிக்கப்பட்டிருக்கிறாய்[a]. உன் கையிலிருந்து உன் சகோதரனின் இரத்தத்தை[b] ஏற்றுக்கொள்ள அந்த நிலம் தன் வாயைத் திறந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிலத்தால்’ அல்லது ‘நிலத்தைவிட்டு’ என்றும் பொருள் கொள்ளலாம். எபிரேயச் சொல், நிலம் சாபத்தின் மூலமாக இருப்பதையோ காயீன் நிலத்திலிருந்து பிரிக்கப்படுவதையோ சுட்டக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: எபிரேயத்தில் ‘இரத்தங்கள்’; இங்கு இரத்தம் சிந்தப்பட்டதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: இணைப்பையும் உடனடியான விளைவுக்கான மாறுதலையும் இயல்பான நவீனத் தமிழில் உணர்த்துகிறது.
- source_word: אָרוּר אָתָּה
  choice: நீ ... சபிக்கப்பட்டிருக்கிறாய்
  rationale: காயீன் சாபத்திற்குள்ளான நிலையைக் குறிக்கும் எபிரேயப் பயனைக் கண்ணியமான, இயல்பான தமிழில் தருகிறது.
- source_word: מִן הָאֲדָמָה
  choice: நிலத்தினின்று
  rationale: מִן என்பதிலுள்ள மூலத்திலிருந்து வருதல் அல்லது பிரிதல் ஆகிய இரு சாத்தியங்களையும் முடிந்தவரை திறந்தே வைக்கிறது.
- source_word: אֲשֶׁר פָּצְתָה אֶת פִּיהָ
  choice: அந்த நிலம் தன் வாயைத் திறந்தது
  rationale: நிலம் வாய் திறப்பதாக உருவகப்படுத்தப்படும் எபிரேயப் படிமத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לָקַחַת
  choice: பெற்றுக்கொள்ள
  rationale: சிந்தப்பட்ட இரத்தத்தை நிலம் உள்வாங்கியதைக் குறிக்கும் சூழலில் இயல்பாகவும் படிமத்துக்கு உண்மையாகவும் உள்ளது.
- source_word: דְּמֵי אָחִיךָ
  choice: உன் சகோதரனின் இரத்தத்தை
  rationale: எபிரேயப் பன்மையான ‘இரத்தங்கள்’ இங்கு இரத்தம் சிந்தப்பட்டதைக் குறிக்கும் மரபுத்தொடர்; ஒருமை தமிழில் இயல்பாகப் பொருளைத் தருகிறது.
- source_word: מִיָּדֶךָ
  choice: உன் கையிலிருந்து
  rationale: காயீனின் நேரடிப் பொறுப்பை வெளிப்படுத்தும் மூலமொழியின் உயிருள்ள படிமத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: சாபத்துக்கும் நிலத்துக்கும் இடையிலான உறவு
  choice: ‘நிலத்தினின்று’ என்று மொழிபெயர்த்து மூலமொழியின் பொருள் நெகிழ்வைத் திறந்தே வைத்தல்
  alternative: ‘நிலத்தால்’ அல்லது ‘நிலத்தைவிட்டு’
  rationale: מִן என்பது சாபத்தின் மூலம் நிலம் என்பதையோ, நிலத்திலிருந்து பிரிக்கப்படுதல் என்பதையோ சுட்டக்கூடும். வசனம் ஒன்றை மட்டும் உறுதிசெய்யாததால் மொழிபெயர்ப்பும் அந்த இறையியல் அழுத்தத்தைத் தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘நிலத்தினின்று’ என்பது அன்றாடப் பேச்சைவிட சற்றே உயர்ந்த நடை கொண்டிருந்தாலும், மூலமொழியின் திட்டமிட்ட இருபொருள் வாய்ப்பைப் பாதுகாப்பதற்காகத் தேர்ந்தெடுக்கப்பட்டது.
