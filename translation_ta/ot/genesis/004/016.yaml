base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/016.yaml
  text: Then Cain went out from before Yahweh and settled in the land of Nod[a], east of Eden.
translation:
  language: ta
  text: அப்போது காயீன் யாவேவின் முன்னிலையிலிருந்து புறப்பட்டு, ஏதேனுக்குக் கிழக்கே உள்ள நோத் நாட்டில்[a] குடியேறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நோத்’ என்ற பெயர், ‘அலைந்து திரிதல்’ என்று பொருள்படும் எபிரெயச் சொல்லை ஒத்தொலிக்கிறது; இது இவ்வதிகாரத்தில் முன்பு காயீனுக்கு வழங்கப்பட்ட தீர்ப்பை எதிரொலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: புறப்பட்டு
  rationale: יצא என்பதன் வெளியே செல்லும் இயக்கத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; பிரிவின் முறையைத் தேவையின்றி விளக்கவில்லை.
- source_word: מִלִּפְנֵי
  choice: முன்னிலையிலிருந்து
  rationale: எபிரெய மொழியின் ‘முகத்திற்கு முன்பிருந்து’ என்ற இடம் மற்றும் உறவு சார்ந்த சொல்லாட்சியைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெயத் தனிப்பெயரான நான்கெழுத்துப் பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: וַיֵּשֶׁב
  choice: குடியேறினான்
  rationale: ישב இச்சூழலில் ஓர் இடத்தில் வாழத் தொடங்குதல் அல்லது தங்கியிருத்தலைக் குறிக்கிறது; ‘குடியேறினான்’ அதைத் தெளிவாகவும் இயல்பாகவும் சொல்கிறது.
- source_word: בְּאֶרֶץ נוֹד
  choice: நோத் நாட்டில்
  rationale: נוֹד இங்கு இடப்பெயராகச் செயல்படுவதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்படுகிறது; ‘அலைந்து திரிதல்’ என்பதுடனான சொல் தொடர்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: קִדְמַת עֵדֶן
  choice: ஏதேனுக்குக் கிழக்கே இருந்த
  rationale: ஏதேனை ஒப்பிட்டு நோத் நாட்டின் கிழக்குத் திசை அமைவிடத்தை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: עֵדֶן
  choice: ஏதேன்
  rationale: இடப்பெயர் என்பதால் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: கடவுளுடன் தொடர்புபடுத்திக் காயீனின் புறப்பாட்டை எவ்வாறு சொல்வது
  choice: யாவேவின் முன்னிலையிலிருந்து புறப்பட்டு
  alternative: யாவேவின் பிரசன்னத்தைவிட்டு விலகி
  rationale: மூலத்தின் இடம்-உறவு சார்ந்த சொல்லாட்சியைப் பாதுகாத்து, இது வெறும் இடமாற்றமா அல்லது இறைவனிடமிருந்து அந்நியப்படுதலா என்ற கதையியல்-இறையியல் பதற்றத்தை விளக்கித் தீர்க்காமல் அப்படியே விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதையியல் நடை. எபிரெயச் சொற்றொடரின் இறையியல் பதற்றம் விளக்கிச் சமப்படுத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
