base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/026.yaml
  text: And to Seth also a son was born[a], and he called his name Enosh[b]. At that time people began to call on the name of Yahweh.
translation:
  language: ta
  text: சேத்துக்கும் ஒரு மகன் பிறந்தான்; சேத் அவனுக்கு ஏனோஷ் என்று பெயரிட்டான். அப்போது மக்கள் யாவேயின் பெயரைச் சொல்லி அழைக்கத் தொடங்கினர்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “அப்போது யாவேயின் பெயரைச் சொல்லி அழைப்பது தொடங்கப்பட்டது.”
    reason: lexical_alternative
  - marker: b
    text: சிறுபான்மை விளக்கம் הוּחַל என்ற வினையை “அவமதிக்கப்பட்டது” என்ற பொருளில் கொள்கிறது. அதன்படி, “அப்போது மக்கள் யாவேயின் பெயரை அவமதிக்கத் தொடங்கினர்” என்று மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְשֵׁת גַּם הוּא
  choice: சேத்துக்கும்
  rationale: וּ, לְ, גַּם ஆகியவற்றின் கூட்டுப் பொருளான தொடர்ச்சியையும் சேர்த்தலையும் இயல்பான தமிழில் ‘சேத்துக்கும்’ வெளிப்படுத்துகிறது; הוּא இங்கு வலியுறுத்தலாக இருப்பதால் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: יֻלַּד בֵּן
  choice: ஒரு மகன் பிறந்தான்
  rationale: எபிரெய மொழியின் செயப்பாட்டு வடிவத்தைத் தமிழில் இயல்பான பிறப்புத் தொடராக வழங்குகிறது; சேத் மகனைப் பெற்றான் என்று செயப்படுபொருள் மாற்றப்படவில்லை.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ אֱנוֹשׁ
  choice: அவன் அவனுக்கு ஏனோஷ் என்று பெயரிட்டான்
  rationale: ‘அவனுடைய பெயரை ஏனோஷ் என்று அழைத்தான்’ என்ற எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: אֱנוֹשׁ
  choice: ஏனோஷ்
  rationale: ஆள்பெயரை அதன் எபிரெய ஒலிக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கிறது; இங்கு ‘மனிதன்/மரணத்துக்குரியவன்’ என்ற பொதுப்பெயர்ப் பொருள் மொழிபெயர்க்கப்படவில்லை.
- source_word: אָז
  choice: அக்காலத்தில்தான்
  rationale: காலத்தைக் குறிக்கும் சொல்லைத் தெளிவாகக் காட்டுவதோடு, புதிய நடைமுறை தொடங்கிய காலத்தை இயல்பான தமிழில் வலியுறுத்துகிறது.
- source_word: הוּחַל
  choice: தொடங்கினர்
  rationale: இச்சூழலில் பொதுவாக ஏற்கப்படும் தொடக்கப் பொருளை இயல்பான பன்மை மனித எழுவாயுடன் தருகிறது; எபிரெய வடிவத்தின் சொற்சொல் அமைப்பும் மாற்றுப் பொருளும் அடிக்குறிப்புகளில் பாதுகாக்கப்படுகின்றன.
- source_word: לִקְרֹא בְּשֵׁם
  choice: பெயரைச் சொல்லி அழைக்க
  rationale: இம்மரபுத்தொடர் இறைவனை அவரது பெயரால் அழைத்து வேண்டுதல் அல்லது வழிபாட்டில் அணுகுதல் என்பதைக் குறிக்கலாம். ‘பெயரைச் சொல்லி அழைக்க’ என்பது அந்த வழிபாட்டு நுணுக்கத்தையும் சொற்றொடரின் திறந்த பொருளையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீக நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய உச்சரிப்பை அணுகும் நவீனத் தமிழ் எழுத்துப்பெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: הוּחַל לִקְרֹא בְּשֵׁם יְהוָה என்பதன் விளக்கம்
  choice: மக்கள் யாவேயின் பெயரைச் சொல்லி அழைக்கத் தொடங்கினர்
  alternative: யாவேயின் பெயரைச் சொல்லி அழைப்பது அப்போது தொடங்கப்பட்டது; அல்லது, மக்கள் யாவேயின் பெயரைத் தீட்டுப்படுத்தத் தொடங்கினர்
  rationale: הוּחַל என்பதை இங்கு ‘தொடங்கப்பட்டது’ என்ற தொடக்கப் பொருளில் கொள்வது சூழலுக்கும் קרא בשם என்ற இறைவனை அழைக்கும் மரபுத்தொடருக்கும் நன்றாகப் பொருந்துகிறது. எனினும், வினையை ‘தீட்டுப்படுத்து/அவமதி’ என்று கொள்ளும் சிறுபான்மை விளக்கம் உண்மையான மொழியியல் வாய்ப்பாக இருப்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயரே நேரடியாக உள்ளது; ஆகவே அதை ஒரு பட்டமாக மாற்றாமல் எழுத்துப்பெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில் கண்ணியமும் எளிமையும் காக்கப்பட்டுள்ளன. ‘பெயரைச் சொல்லி அழைக்க’ என்பது வழிபாட்டு வேண்டுதலை இயல்பாக உணர்த்தினாலும், வெறும் பெயரால் அழைத்தல் அல்லது அறிவித்தல் என்ற சாத்தியத்தை முற்றிலும் மூடவில்லை. வழங்கப்பட்ட ஆங்கில உரையில் [a], [b] குறிகள் முதல் இரண்டு கூற்றுகளுக்குப் பின் இருந்தபோதும், அவற்றின் அடிக்குறிப்பு உள்ளடக்கம் இறுதி விவாதத்துக்குரிய கூற்றையே விளக்குவதால் தமிழில் அந்தக் கூற்றுக்குப் பின் பொருத்தப்பட்டுள்ளன.
