- from: சேத்துக்கும் ஒரு மகன் பிறந்தான்; அவன் அவனுக்கு ஏனோஷ் என்று பெயரிட்டான். அக்காலத்தில்தான் மக்கள் யாவேயின் பெயரைச் சொல்லி அழைக்கத் தொடங்கினர்.[a][b]
  to: சேத்துக்கும் ஒரு மகன் பிறந்தான்; சேத் அவனுக்கு ஏனோஷ் என்று பெயரிட்டான். அப்போது மக்கள் யாவேயின் பெயரைச் சொல்லி அழைக்கத் தொடங்கினர்.[a][b]
  rationale: மூலத்தின் காலக் குறிப்பை மிகைப்படுத்தாமல் “அப்போது” எனத் திருத்தினேன். சேத் பெயரிடுபவர் என்பதைக் குறிப்பிட்டு பதிலிப்பெயர் தெளிவின்மையை நீக்கினேன். முதன்மை வாசிப்பில் கרא בשם என்பதற்கான திறந்த, அழைப்பு/வேண்டுதல் சார்ந்த சொற்றொடரைப் பாதுகாத்தேன்; விவாதத்திற்குரிய הוּחַל மாற்றுவாசிப்பை அடிக்குறிப்பில் தெளிவான தமிழில் வைத்தேன். இரு அடிக்குறிப்புகளும் அவை விளக்கும் இறுதிக் கூற்றுக்குப் பின் நங்கூரமிடப்பட்டுள்ளன.
