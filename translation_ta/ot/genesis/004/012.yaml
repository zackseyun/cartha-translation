id: GEN.4.12
reference: Genesis 4:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֤י תַֽעֲבֹד֙ אֶת הָ֣/אֲדָמָ֔ה לֹֽא תֹסֵ֥ף תֵּת כֹּחָ֖/הּ לָ֑/ךְ נָ֥ע וָ/נָ֖ד תִּֽהְיֶ֥ה בָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/012.yaml
  text: When you work the ground[a], it will no longer yield its strength to you[d][c][b]. You will be a wanderer and a fugitive on the earth.
translation:
  language: ta
  text: நீ நிலத்தைப் பயிரிடும்போது[a], அது இனி தன் வலிமையை உனக்குத் தராது[b]. நீ பூமியில்[d] அலைந்து திரிபவனாகவும் நாடோடியாகவும் இருப்பாய்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனெனில் நீ நிலத்தைப் பயிரிடும்போது” அல்லது “நீ நிலத்தைப் பயிரிட்டால்.” எபிரெய இணைப்புச்சொல், இவ்வாக்கியத்தை காரணமாக எடுத்துக்கொள்கிறோமா அல்லது கால/நிபந்தனைச் சூழலாக எடுத்துக்கொள்கிறோமா என்பதைப் பொறுத்து பலவாறு மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “அது தன் வலிமையை உனக்குத் தொடர்ந்து கொடுக்காது.” இங்கு நிலத்தின் ‘வலிமை’ என்பது அதன் விளைவிக்கும் ஆற்றலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அமைதியற்ற அலைவோனாகவும் இடம்பெயர்ந்தவனாகவும்.” எபிரெய மொழியில் பொருள் ஒட்டிய இரண்டு சொற்கள் இணைந்து காயீனின் நிலைகொள்ளாத நிலையை வலியுறுத்துகின்றன.
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “நாட்டில்” அல்லது “நிலத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: பயிரிடும்போது
  rationale: இணைப்புச்சொல் இங்கு காயீன் நிலத்தைப் பயிரிடும் சூழலை அறிமுகப்படுத்துகிறது. காலப்பொருளைத் தரும் ‘போது’ இயல்பானது; காரண அல்லது நிபந்தனைப் பொருளும் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: תַעֲבֹד אֶת־הָאֲדָמָה
  choice: நிலத்தைப் பயிரிடு
  rationale: עבד இங்கு நிலத்தில் உழைத்துப் பயிரிடுவதைக் குறிக்கிறது. ‘பயிரிடு’ என்பது வேளாண்மைச் சூழலைத் தெளிவாகவும் நவீனத் தமிழில் இயல்பாகவும் தெரிவிக்கிறது; אֲדָמָה என்பதற்கு ‘நிலம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֹא תֹסֵף תֵּת
  choice: இனி ... தராது
  rationale: יסף + வினையெச்ச அமைப்பு ஒரு செயல் இனிமேல் தொடராது என்பதைக் குறிக்கிறது. ‘இனி ... தராது’ அந்த நிறுத்தப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: כֹּחָהּ
  choice: தன் வலிமை
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருளான ‘வலிமை’ பாதுகாக்கப்படுகிறது; சூழலில் அது நிலத்தின் விளைவிக்கும் ஆற்றலைக் குறிக்கிறது.
- source_word: נָע וָנָד
  choice: நிலையற்ற நாடோடி
  rationale: ஒன்றோடொன்று பொருள் ஒட்டிய இரு சொற்களும் காயீனின் நிலைகொள்ள முடியாத அலைச்சலை வலியுறுத்துகின்றன. ‘நிலையற்ற நாடோடி’ இந்த இரட்டைப் படிமத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בָאָרֶץ
  choice: பூமியில்
  rationale: ஆதியாகமத்தின் தொடக்ககால விரிந்த சூழலில் אָרֶץ என்பதற்கு ‘பூமி’ பொருத்தமானது; ‘நாட்டில்’ அல்லது ‘நிலத்தில்’ என்பதும் மொழியியல் ரீதியில் சாத்தியம்.
theological_decisions:
- issue: காயீனுக்கான தீர்ப்பின் பரப்பு
  choice: நிலத்தின் விளைச்சல் மறுக்கப்படுவதையும் நிலைகொள்ளாத அலைச்சலையும் உள்ளடக்கிய தெளிவான தீர்ப்பு
  alternative: முற்றிலும் மனநிலை சார்ந்த அமைதியின்மை மட்டும்; அல்லது ஒரு குறிப்பிட்ட பகுதிக்குள் மட்டுப்பட்ட நாடுகடத்தல் மட்டும்
  rationale: வசனம் நிலத்தின் விளைவிக்கும் ஆற்றல் மறுக்கப்படுவதையும் காயீன் நிலையற்ற நாடோடியாக இருப்பதையும் இணைத்துக் கூறுகிறது. பின்னாளைய கோட்பாட்டுப் பிரிவுகளைச் சேர்க்காமல் பொருளாதார மற்றும் சமூக இரு பரிமாணங்களும் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘தன் வலிமை’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டு, ‘நிலையற்ற நாடோடி’ என்ற இயல்பான சொற்றொடரால் எபிரெய இரட்டைச் சொற்களின் தீவிரம் வெளிப்படுத்தப்பட்டுள்ளது.
