  text: הֵן֩ גֵּרַ֨שְׁתָּ אֹתִ֜/י הַ/יּ֗וֹם מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה וּ/מִ/פָּנֶ֖י/ךָ אֶסָּתֵ֑ר וְ/הָיִ֜יתִי נָ֤ע וָ/נָד֙ בָּ/אָ֔רֶץ וְ/הָיָ֥ה כָל מֹצְאִ֖/י יַֽהַרְגֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/014.yaml
  text: Look[a], today you have driven me away from the face of the ground, and I will be hidden from your face. I will be a wanderer and a fugitive on the earth[b], and whoever finds me will kill me.
translation:
  language: ta
  text: இதோ, இன்று நீர் என்னை நிலத்தின் முகத்திலிருந்து துரத்திவிட்டீர்; உமது முகத்திலிருந்தும் நான் மறைக்கப்படுவேன்.[a] நான் பூமியில்[b] அலைபவனாகவும் நாடோடியாகவும் இருப்பேன்; என்னைக் கண்டுபிடிப்பவன் எவனும் என்னைக் கொன்றுவிடுவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது பிரசன்னத்திலிருந்து நான் மறைந்திருப்பேன்’ / ‘உமது பிரசன்னத்திலிருந்து நான் மறைக்கப்படுவேன்.’ எபிரேயத்தில் சொல்லுக்குச் சொல் ‘உமது முகத்திலிருந்து’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நாட்டில்.’ எபிரேயச் சொல் אֶרֶץ சூழலுக்கேற்ப ‘பூமி’ அல்லது ‘நாடு’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து வலியுறுத்தும் உரையாடல் இடைச்சொல்; நவீன தமிழிலும் கண்ணியமான வேதாகம நடைக்கு ஏற்ற இயல்பான இணை.
- source_word: גֵּרַשְׁתָּ
  choice: துரத்திவிட்டீர்
  rationale: வெளியேற்றுதல் அல்லது விரட்டியனுப்புதல் என்ற வலிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: நிலத்தின் முகத்திலிருந்து
  rationale: எபிரேய மொழியின் ‘நிலத்தின் முகம்’ என்ற உருவகத்தைப் பேணுவதோடு, ஆதியாகமம் 4-இல் காயீனுக்கும் பயிரிடும் நிலத்துக்கும் உள்ள தொடர்பையும் தக்கவைக்கிறது.
- source_word: וּמִפָּנֶיךָ אֶסָּתֵר
  choice: உமது முகத்திலிருந்தும் நான் மறைக்கப்படுவேன்
  rationale: நிபால் வடிவின் இயல்பான செயப்பாட்டு/தற்சுட்டுப் பொருளையும் ‘உமது முகம்’ என்ற எபிரேய உருவகத்தையும் பாதுகாக்கிறது.
- source_word: נָע וָנָד
  choice: அலைந்து திரியும் நாடோடி
  rationale: இரு நெருங்கிய சொற்களும் குறிக்கும் நிலையற்ற, இடம்பெயர்ந்த வாழ்வை இயல்பான தமிழில் ஒருங்கிணைத்துக் காட்டுகிறது; வெறும் ‘அலைபவன்’ என்பதைவிட இரட்டைப் பொருளின் வலிமை தக்கவைக்கப்படுகிறது.
- source_word: בָּאָרֶץ
  choice: பூமியில்
  rationale: אֶרֶץ என்பதன் விரிவான பொருள் இச்சூழலில் பொருந்துகிறது; ‘நாட்டில்’ என்ற பிராந்தியப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: כָל מֹצְאִי
  choice: என்னைக் காண்கிற எவனும்
  rationale: כָל + பெயரெச்ச வடிவத்தின் வரையறையற்ற பொதுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יַהַרְגֵנִי
  choice: என்னைக் கொன்றுவிடுவான்
  rationale: הרג என்ற பொதுவான ‘கொல்லுதல்’ வினையைத் தெளிவான நவீன தமிழில் தருகிறது; ‘-விடுவான்’ காயீனின் அச்சத்தில் உள்ள எதிர்பார்க்கப்பட்ட விளைவை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: וּמִפָּנֶיךָ אֶסָּתֵר என்பதில் இறைமுகம்/இறைப்பிரசன்னம் குறித்த உருவகம்
  choice: உமது முகத்திலிருந்தும் நான் மறைக்கப்படுவேன்
  alternative: உமது பிரசன்னத்திலிருந்து நான் மறைந்திருப்பேன் / மறைக்கப்படுவேன்
  rationale: ‘உமது முகம்’ என்ற மூலமொழியின் உறவுசார் உருவகத்தையும் தேவனிடமிருந்து விலக்கப்படுதலின் இறையியல் அழுத்தத்தையும் விளக்கித் தீர்க்காமல் பேணுகிறது. நிபால் வடிவில் உள்ள செயப்பாட்டு அல்லது தற்சுட்டு நுணுக்கம் உண்மையான தெளிவின்மையாக அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘நீர்/உமது’ பயன்படுத்தப்பட்டுள்ளன. ‘நிலத்தின் முகம்’ மற்றும் ‘உமது முகம்’ ஆகிய மூலமொழி உருவகங்கள் திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளன.
