  source_fidelity: 'முக்கியமாக மூலத்துடன் ஒத்துள்ளது: நிலம்/பூமி வேறுபாடு, ‘முகம்’ உருவகம், வெளியேற்றம், மற்றும் கொல்லப்படுவேன் என்ற அச்சம் அனைத்தும் பேணப்பட்டுள்ளன. ஆனால் כָּל מֹצְאִי என்பது ‘என்னைக் காண்கிற’ அல்ல, ‘என்னைக் கண்டுபிடிப்பவன்/கண்டவன்’ என்பதே; மேலும் נָע וָנָד என்ற இரட்டை நிலை ஒரே ‘அலைந்து திரியும் நாடோடி’ என்ற சொல்லாக்கத்தில் ஓரளவு சுருங்குகிறது.'
