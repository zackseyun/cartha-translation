  text: וְ/שֵׁ֥ם אָחִ֖י/ו יוּבָ֑ל ה֣וּא הָיָ֔ה אֲבִ֕י כָּל תֹּפֵ֥שׂ כִּנּ֖וֹר וְ/עוּגָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/021.yaml
  text: And the name of his brother was Jubal[c][b][a]; he was the father of all who play the lyre and the pipe.
translation:
  language: ta
  text: அவனுடைய சகோதரனின் பெயர் யூபால்; யாழையும் குழலையும்[b] வாசிக்கிற அனைவருக்கும் அவன் தந்தையாக[a] இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தந்தை” என்பது இங்கு இந்த இசைமரபைப் பின்பற்றுவோரின் முன்னோடி அல்லது தோற்றுவித்தவர் என்ற பொருளைக் கொண்டிருக்கலாம்; அவர்கள் ஒவ்வொருவருக்கும் நேரடி உயிரியல் தந்தை என்று அவசியம் பொருளல்ல.
    reason: cultural_note
  - marker: b
    text: “குழல்” என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் எந்தப் பண்டைய இசைக்கருவியைக் குறிக்கிறது என்பது உறுதியாகத் தெரியவில்லை; அது புல்லாங்குழல் அல்லது வேறொரு ஊதுகுழல் வகையாக இருந்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אָחִיו
  choice: அவனுடைய சகோதரனின் பெயர்
  rationale: முந்தைய வசனத்தில் வரும் யாபாலைக் குறிக்கும் உறவைத் தெளிவாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது; தொடக்க இணைப்புச் சொல் தமிழில் தனியாகத் தேவையில்லை.
- source_word: יוּבָל
  choice: யூபால்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: הוּא הָיָה
  choice: அவன் ... இருந்தான்
  rationale: எபிரெய மொழியின் வலியுறுத்தப்பட்ட எழுவாயுடன் கூடிய நிலைப்பாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: אֲבִי
  choice: தந்தையாக
  rationale: எபிரெய மரபுத்தொடரைத் தக்கவைக்கிறது; இங்கு நேரடி உயிரியல் தந்தை என்பதைக் காட்டிலும் ஒரு கலைமரபின் முன்னோடி அல்லது தோற்றுவித்தவர் என்ற விரிவான பொருள் உள்ளது.
- source_word: כָּל תֹּפֵשׂ
  choice: வாசிக்கிற அனைவருக்கும்
  rationale: תֹּפֵשׂ என்பதன் அடிப்படைப் பொருள் ‘பிடித்தல்/கையாளுதல்’; இசைக்கருவிகளுடன் வரும்போது அவற்றை வாசிப்பதைக் குறிக்கிறது.
- source_word: כִּנּוֹר
  choice: நரம்பிசைக் கருவி
  rationale: பண்டைய כִּנּוֹר நவீன வீணையோ யாழோடு முற்றிலும் ஒன்றல்ல; குறிப்பிட்ட தவறான அடையாளத்தைத் தவிர்த்து, அதன் கருவி வகையைத் தெளிவாகக் காட்டுகிறது.
- source_word: עוּגָב
  choice: குழல்
  rationale: பண்டைய கருவியின் துல்லியமான வடிவம் உறுதியில்லை; ‘குழல்’ என்பது மிகையாகக் குறிப்பாக்காமல் காற்றிசைக் கருவியை இயல்பான தமிழில் குறிக்கிறது.
theological_decisions:
- issue: ‘அனைவருக்கும் தந்தை’ என்பதன் நோக்கம்
  choice: எபிரெய மரபுத்தொடரான ‘தந்தை’ என்பதை முதன்மை உரையில் தக்கவைத்து, முன்னோடி/தோற்றுவித்தவர் என்ற பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘முன்னோடி’ அல்லது ‘தோற்றுவித்தவர்’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: மூலத்தின் உருவக மொழியையும் அதன் பண்பாட்டு-வம்சவழிப் பதற்றத்தையும் காக்கிறது; ஒவ்வொரு இசைக்கலைஞருக்கும் நேரடி உயிரியல் தந்தை என்ற தவறான புரிதலை அடிக்குறிப்பு தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் dignified, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. ‘நரம்பிசைக் கருவி’ என்பது organological துல்லியமின்மையை ஒப்புக்கொண்டு தவறான நவீன கருவி அடையாளத்தைத் தவிர்க்கிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடப்பட்டுள்ளன.
