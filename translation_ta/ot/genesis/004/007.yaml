  text: הֲ/ל֤וֹא אִם תֵּיטִיב֙ שְׂאֵ֔ת וְ/אִם֙ לֹ֣א תֵיטִ֔יב לַ/פֶּ֖תַח חַטָּ֣את רֹבֵ֑ץ וְ/אֵלֶ֨י/ךָ֙ תְּשׁ֣וּקָת֔/וֹ וְ/אַתָּ֖ה תִּמְשָׁל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/007.yaml
  text: If you do well[a], will there not be acceptance? But if you do not do well, sin is crouching at the door; its desire is for you[d][c][b], but you must rule over it.
translation:
  language: ta
  text: நீ நன்மை செய்தால், ஏற்றுக்கொள்ளப்பட மாட்டாயா?[a] ஆனால் நீ நன்மை செய்யாவிட்டால், பாவம் வாசலில் பதுங்கிக் கிடக்கிறது; அதன் வேட்கை உன்னை நோக்கியிருக்கிறது,[b][c] ஆனால் நீ அதை ஆள வேண்டும்.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, “உயர்த்துதல் இல்லையா?” இது காயீனின் முகம் உயர்த்தப்படுவதையோ அவன் ஏற்றுக்கொள்ளப்படுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பாவநிவாரணப் பலி வாசலில் படுத்திருக்கிறது.” எனினும் உடனடிச் சூழலிலுள்ள படிமம், பதுங்கும் மிருகமாக ஆளுருவாக்கப்பட்ட பாவத்தையே இயல்பாகச் சுட்டுகிறது.
    reason: alternative_reading
  - marker: c
    text: “வேட்கை” என்பதற்கு “ஏக்கம்” அல்லது “உந்துதல்” என்றும் மொழிபெயர்க்கலாம். ஆதியாகமம் 3:16-இல் உள்ள ஒத்த சொல்லாட்சியை ஒப்பிடுக.
    reason: cross_reference
  - marker: d
    text: அல்லது, “நீ அதை ஆள்வாய்,” அல்லது “நீ அதை ஆள முடியும்.” எபிரெயத்தை அறிவுறுத்தலாகவோ முன்னறிவிப்பாகவோ சாத்தியத்தைக் குறிக்கும் கூற்றாகவோ வாசிக்க முடியும்.
    reason: alternative_reading
lexical_decisions:
- source_word: תֵּיטִיב
  choice: நன்மை செய்தால் / நன்மை செய்யாவிட்டால்
  rationale: இங்கு யטב என்பதன் ஹிபீல் வடிவம் வெறுமனே நலமாக இருப்பதை அல்ல, நன்மையானதை அல்லது சரியானதைச் செய்வதைக் குறிக்கிறது. எபிரெய நிபந்தனை அமைப்பையும் அறநெறிப் பொருளையும் இத்தேர்வு இயல்பான தமிழில் காக்கிறது.
- source_word: שְׂאֵת
  choice: ஏற்றுக்கொள்ளப்பட மாட்டாயா?
  rationale: இந்தச் சொல் சொற்படியாக ‘உயர்த்துதல்’ என்பதுடன் தொடர்புடையது. சூழலில் காயீனின் முகம் உயர்த்தப்படுவதையோ அவன் ஏற்றுக்கொள்ளப்படுவதையோ குறிக்கலாம். முதன்மை உரையில் ‘ஏற்றுக்கொள்ளப்படுதல்’ தெளிவாக உள்ளது; மூலத்தின் சுருக்கமான இருபொருள் சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: לַפֶּתַח
  choice: வாசலில்
  rationale: இது நேரடியான இடவியல் சொற்றொடர். ‘வாசலில்’ என்பது நுழைவிடத்திலேயே காத்திருக்கும் அபாயத்தின் உயிரோட்டமான படிமத்தைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: חַטָּאת
  choice: பாவம்
  rationale: חַטָּאת என்பது ‘பாவம்’ அல்லது ‘பாவநிவாரணப் பலி’ எனப் பொருள்படலாம். ‘பதுங்கிக் கிடக்கிறது’ என்ற விலங்கு உருவகம் இங்கு பாவம் ஆளுருவாக்கப்படுவதையே அதிகம் ஆதரிக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: רֹבֵץ
  choice: பதுங்கிக் கிடக்கிறது
  rationale: இந்தப் பங்கேற்புவினை ஒரு விலங்கு குனிந்து கிடப்பதையோ இரைக்காகப் பதுங்குவதையோ சித்தரிக்கிறது. ‘பதுங்கிக் கிடக்கிறது’ என்பது தொடரும் உடனடி அச்சுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תְּשׁוּקָתוֹ
  choice: அதன் வேட்கை
  rationale: இந்தப் பெயர்ச்சொல் விருப்பம், ஏக்கம், உந்துதல் ஆகிய பொருள்களைக் கொள்ளலாம். ‘வேட்கை’ ஆதியாகமம் 3:16-இல் உள்ள ஒத்த சொல்லாட்சியுடனான தொடர்பைக் காக்கிறது; அதன் துல்லிய இயல்பை மிகையாக விளக்கவில்லை.
- source_word: תִּמְשָׁל בּוֹ
  choice: நீ அதை அடக்கி ஆள வேண்டும்
  rationale: எபிரெய நிறைவுறா வினை இங்கு அறிவுறுத்தல், முன்னறிவிப்பு அல்லது சாத்தியம் எனப் புரிந்துகொள்ளப்படலாம். எச்சரிக்கைச் சூழலில் ‘ஆள வேண்டும்’ என்பது அறிவுறுத்தலின் வலிமையைத் தருகிறது; ‘அடக்கி’ என்பது பாவம் பதுங்கும் மிருகமாகச் சித்தரிக்கப்படுவதுடன் இயல்பாக இணைகிறது.
theological_decisions:
- issue: காயீன் பாவத்தை ஆள்வான் என்ற வாக்குறுதியா, அதை ஆளும்படியான கட்டளையா, அல்லது அவனால் ஆள முடியும் என்ற கூற்றா?
  choice: முதன்மை உரை இதை அறிவுறுத்தலாக, ‘நீ அதை அடக்கி ஆள வேண்டும்’ என்று வழங்குகிறது.
  alternative: ‘நீ அதை ஆள்வாய்’ அல்லது ‘நீ அதை ஆள முடியும்.’
  rationale: תִּמְשָׁל என்ற நிறைவுறா வினை ஒன்றுக்கு மேற்பட்ட நுணுக்கங்களை அனுமதிக்கிறது. சூழலில் கடவுள் காயீனை எச்சரித்து அறிவுறுத்துவதால் கட்டளை/கடமைப் பொருள் முதன்மை உரையில் பொருத்தமானது. ஆனால் உறுதியான விளைவையோ மனித திறனைப் பற்றிய வளர்ச்சியடைந்த கோட்பாட்டையோ மொழிபெயர்ப்பில் திணிக்காமல் மாற்றுகள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘வாசல்’, ‘பதுங்கிக் கிடக்கிறது’, ‘வேட்கை’, ‘அடக்கி ஆள வேண்டும்’ ஆகியவை மூலத்தின் வாசற்படி, வேட்டைவிலங்கு, ஆசை, ஆட்சி ஆகிய படிமத் தொடர்புகளைத் தெளிவாகக் காக்கின்றன. விவாதத்திற்குரிய சொற்பொருள் மற்றும் இறுதி வினையின் முறைமை அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
