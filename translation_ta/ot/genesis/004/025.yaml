  text: וַ/יֵּ֨דַע אָדָ֥ם עוֹד֙ אֶת אִשְׁתּ֔/וֹ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵׁ֑ת כִּ֣י שָֽׁת לִ֤/י אֱלֹהִים֙ זֶ֣רַע אַחֵ֔ר תַּ֣חַת הֶ֔בֶל כִּ֥י הֲרָג֖/וֹ קָֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/025.yaml
  text: And Adam knew his wife again[a], and she bore a son and called his name Seth, for she said, “God has appointed for me another offspring in place of Abel, because Cain killed him.”
translation:
  language: ta
  text: ஆதாம் மீண்டும் தன் மனைவியுடன் சேர்ந்தான். அவள் ஒரு மகனைப் பெற்றெடுத்து, அவனுக்குச் சேத்[a] என்று பெயரிட்டாள். “கடவுள் எனக்கு ஆபேலுக்குப் பதிலாக வேறொரு சந்ததியை வைத்திருக்கிறார்; ஏனெனில் காயீன் அவனைக் கொன்றுவிட்டான்” என்று அவள் சொன்னாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சேத்’ என்ற பெயர், ‘வைத்தார்’ அல்லது ‘அமைத்தார்’ என்று பொருள்படும் எபிரெய வினைச்சொல்லைப் போல ஒலிக்கிறது; இங்கு ஒரு சொல்விளையாட்டு உள்ளது.
    reason: எபிரெய மூலத்தில் உள்ள பெயர்–வினைச்சொல் தொடர்பைத் தமிழில் நேரடியாக மறுஉருவாக்க முடியாததால் விளக்கப்படுகிறது.
lexical_decisions:
- source_word: וַיֵּדַע
  choice: தன் மனைவியுடன் சேர்ந்தான்
  rationale: மனைவியுடனான பாலுறவைக் குறிக்கும் எபிரெய மரியாதை மறைசொல்லை, மிக வெளிப்படையாக்காமலும் தமிழில் பொருள் தவறாகப் புரியாதவாறும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עוֹד
  choice: மீண்டும்
  rationale: முன்னர் நிகழ்ந்த தாம்பத்தியச் சேர்க்கை இப்போது மறுபடியும் நிகழ்ந்ததை நேரடியாகக் குறிக்கிறது.
- source_word: וַתֵּלֶד בֵּן
  choice: ஒரு மகனைப் பெற்றெடுத்து
  rationale: பிறப்பைத் தெளிவாகவும் நவீனத் தமிழில் இயல்பாகவும் கூறுகிறது.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: அவனுக்குச் ... என்று பெயரிட்டாள்
  rationale: எபிரெய பெயரிடும் சூத்திரத்தின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: שֵׁת
  choice: சேத்
  rationale: இப்பெயரின் தமிழில் வழக்கிலுள்ள ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: שָׁת
  choice: வைத்திருக்கிறார்
  rationale: שִׁית என்ற வினையின் அடிப்படைப் பொருளான ‘வைத்தல்/அமைத்தல்’ என்பதைக் காத்து, கடவுள் அளித்த ஏற்பாட்டை வெளிப்படுத்துகிறது; சேத் என்ற பெயருடனான எபிரெயச் சொல்விளையாட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: זֶרַע
  choice: சந்ததி
  rationale: ‘விதை’ என்ற உருவகத்தைச் சொற்சொல்லாகத் திணிக்காமல், குழந்தையையும் தொடரும் வழிமரபையும் குறிக்கக்கூடிய மூலச்சொல்லின் பரப்பைத் தக்கவைக்கிறது.
- source_word: תַּחַת
  choice: பதிலாக
  rationale: இங்கு சொல்லப்படும் மாற்றீடு அல்லது இடநிரப்புப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הֲרָגוֹ
  choice: அவனைக் கொன்றுவிட்டான்
  rationale: மூலத்தின் பொதுவான ‘கொல்லுதல்’ வினையைப் பிரதிபலிக்கிறது; அதைவிடக் குறிப்பான சட்ட அல்லது ஒழுக்க வகைப்பாட்டை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
theological_decisions:
- issue: சேத்தின் பெயருக்கான பெண்ணின் விளக்கம்
  choice: கடவுள் எனக்கு ... வேறொரு சந்ததியை வைத்திருக்கிறார்
  alternative: கடவுள் எனக்கு வேறொரு குழந்தையைத் தந்திருக்கிறார்
  rationale: மாற்று வாசகம் கருத்தை இயல்பாக்கினாலும், ‘வைத்தார்’ என்ற மூல வினையையும் சேத் என்ற பெயருடனான சொல்விளையாட்டையும் மறைத்துவிடும். தேர்ந்த வாசகம் கடவுளே இந்த மாற்றீட்டை ஏற்படுத்தியவர் என்ற கூற்றையும் மூலத்தின் சொல் தொடர்பையும் காக்கிறது.
- issue: பாலுறவைக் குறிக்கும் எபிரெய மறைசொல்
  choice: தன் மனைவியுடன் சேர்ந்தான்
  alternative: தன் மனைவியை அறிந்தான்
  rationale: ‘அறிந்தான்’ என்பது எபிரெய வடிவத்தை அப்படியே பிரதிபலித்தாலும் நவீனத் தமிழில் தேவையான பாலுறவுப் பொருளை இயல்பாகத் தெரிவிக்காது. ‘சேர்ந்தான்’ மூலத்தின் அடக்கமான இலக்கியத் தொனியைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சேர்ந்தான்’ என்பது அடக்கமான மறைசொல்லாகவும், ‘கடவுள்’ என்பது பொதுவாகப் புரியும் இறைச்சொல்லாகவும் பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் காரணவியல் தொடரும், ஆபேலுக்குப் பதிலான சந்ததி என்ற இறையியல் பதற்றமும் தீர்த்துவிடப்படாமல் காக்கப்பட்டுள்ளன.
