  source_fidelity: 'மூல எபிரெயத்தின் நிகழ்வுவரிசையும் முக்கியப் பொருள்களும் துல்லியமாகக் காக்கப்பட்டுள்ளன: ஆதாம் மீண்டும் மனைவியுடன் கூடுதல், மகன் பிறத்தல், சேத் எனப் பெயரிடுதல், ஆபேலுக்குப் பதிலான மற்றொரு சந்ததியை கடவுள் வைத்தார் என்ற காரணவிளக்கம், காயீன் ஆபேலைக் கொன்றது ஆகியவை அனைத்தும் உள்ளன. ‘சேர்ந்தான்’ எபிரெய மறைசொல்லின் அடக்கமான பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது. ‘வைத்திருக்கிறார்’ שָׁת என்ற வினையின் set/place பொருளையும், நிறைவுபெற்ற செயல் தற்போதைய விளைவுடையதாகக் கூறப்படும் தமிழ்நடையையும் ஏற்றவாறு வெளிப்படுத்துகிறது.'
  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாகவும் வாசிக்கத் தெளிவாகவும் உள்ளது. ‘ஒரு மகனைப் பெற்றெடுத்து’ மற்றும் ‘அவனுக்குச் சேத் என்று பெயரிட்டாள்’ ஆகியவை பெயரிடல் சூத்திரத்தைச் சீராகத் தருகின்றன. ‘வேறொரு சந்ததி’ சற்றே இலக்கியமானதாக இருந்தாலும், மூலத்தின் זֶרַע என்ற சொல்லின் பிள்ளை/தொடர்ச்சி சார்ந்த பரப்பைத் தக்கவைக்கும் ஏற்ற தெரிவாகும்.
