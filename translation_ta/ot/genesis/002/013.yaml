  text: இரண்டாவது ஆற்றின் பெயர் கீகோன்; அது கூஷ் நாடு முழுவதையும் சுற்றி ஓடுகிறது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கூஷ் நாடு முழுவதையும் சூழ்ந்திருக்கிறது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கூஷ் என்பது பண்டைய இடப்பெயர்; மரபாக அது எகிப்துக்குத் தெற்கேயுள்ள பகுதிகளோடு தொடர்புபடுத்தப்படுகிறது. எபிரெய உரை அந்தப் பண்டைய பெயரையே வழங்குகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם
  choice: பெயர்
  rationale: וְ முந்தைய ஆற்றின் விவரிப்பைத் தொடர்ந்து அடுத்ததை அறிமுகப்படுத்துகிறது; இயல்பான தமிழ் வாக்கியத் தொடரில் தனியாக ‘மேலும்’ என்று சேர்க்காமல் இந்த இணைப்பு தெளிவாக உள்ளது. שֵׁם என்பதற்கு நேரான பொருள் ‘பெயர்’.
- source_word: הַ/נָּהָר הַ/שֵּׁנִי
  choice: இரண்டாவது ஆற்றின்
  rationale: נָהָר என்பது இச்சூழலில் ‘ஆறு’; הַשֵּׁנִי ஆறுகளின் வரிசையில் ‘இரண்டாவது’ என்பதைக் குறிக்கிறது.
- source_word: גִּיחוֹן
  choice: கீகோன்
  rationale: பண்டைய தனிப்பெயரை மொழிபெயர்க்காமல், எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: הוּא הַ/סּוֹבֵב
  choice: அது ... சுற்றி ஓடுகிறது
  rationale: הוּא பெயரிடப்பட்ட ஆற்றையே மீண்டும் சுட்டுகிறது; סבב என்பதன் தொடர்ச்சியான விளக்கப் பொருளை, ஆற்றுக்குப் பொருத்தமான இயல்பான தமிழில் ‘சுற்றி ஓடுகிறது’ என வழங்குகிறது.
- source_word: אֵת כָּל אֶרֶץ
  choice: நாடு முழுவதையும்
  rationale: כָּל אֶרֶץ என்பது குறிப்பிட்ட நிலப்பரப்பு முழுவதையும் குறிக்கிறது; ‘நாடு முழுவதையும்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: כּוּשׁ
  choice: கூஷ்
  rationale: இது பண்டைய இடப்பெயர். ‘எத்தியோப்பியா’ என்று அடையாளப்படுத்துவது காலத்திற்குப் பிந்தைய விளக்கத்தை உரைக்குள் கொண்டுவரக்கூடும் என்பதால் மூலப் பெயரே ஒலிபெயர்க்கப்படுகிறது.
