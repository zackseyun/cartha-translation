id: GEN.2.8
reference: Genesis 2:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּטַּ֞ע יְהוָ֧ה אֱלֹהִ֛ים גַּן בְ/עֵ֖דֶן מִ/קֶּ֑דֶם וַ/יָּ֣שֶׂם שָׁ֔ם אֶת הָֽ/אָדָ֖ם אֲשֶׁ֥ר יָצָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/008.yaml
  text: And Yahweh God planted a garden in Eden[a], in the east, and there he put the man whom he had formed.
translation:
  language: ta
  text: யாவே தேவன் ஏதேனில், கிழக்கில்[a], ஒரு தோட்டத்தை நட்டு, தாம் உருவாக்கிய மனிதனை அங்கே வைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிழக்கு நோக்கி.” எபிரேயச் சொற்றொடர் ஓர் இடத்தை (“கிழக்கில்”) அல்லது திசை/நோக்கத்தைச் சுட்டலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: நட்டு
  rationale: נטע என்பது இச்சூழலில் செடிகளை நட்டு ஒரு தோட்டத்தை அமைப்பதைக் குறிக்கிறது; ‘நட்டு’ என்பது நேரான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: יְהוָה אֱלֹהִים
  choice: யாவே தேவன்
  rationale: יהוה என்ற தனிப்பட்ட இறைப் பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது; אֱלֹהִים என்பதற்கு இச்சூழலில் வழக்கமான ‘தேவன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: גַּן
  choice: ஒரு தோட்டத்தை
  rationale: גן என்பது பயிரிடப்பட்ட அல்லது பாதுகாக்கப்பட்ட தோட்டத்தைக் குறிக்கிறது. எபிரேயத்தில் பெயர்ச்சொல் முதன்முறையாக அறிமுகப்படுத்தப்படுவதால் தமிழில் இயல்பாக ‘ஒரு’ சேர்க்கப்பட்டுள்ளது.
- source_word: בְעֵדֶן
  choice: ஏதேனில்
  rationale: עֵדֶן இங்கு இடப்பெயர்; ஆகவே ‘ஏதேன்’ என்று ஒலிபெயர்த்து, இடவேற்றுமை உருபுடன் வழங்கப்பட்டுள்ளது.
- source_word: מִקֶּדֶם
  choice: கிழக்கில்
  rationale: இந்தச் சொற்றொடர் தோட்டத்தின் இருப்பிடத்தை ‘கிழக்கில்’ எனக் குறிக்கலாம். திசை அல்லது நோக்கத்தைக் குறிக்கும் சாத்தியமும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיָּשֶׂם שָׁם
  choice: அங்கே வைத்தார்
  rationale: שׂים என்பது ‘வை/இடம் செய்’ என்றும் שָׁם என்பது ‘அங்கே’ என்றும் பொருள்படும்; தமிழ் நடையில் இவை இயல்பாக இணைக்கப்பட்டுள்ளன.
- source_word: הָאָדָם
  choice: மனிதனை
  rationale: இங்கு אָדָם பொதுவாக மனிதகுலத்தைக் குறிக்காமல், முன்பு உருவாக்கப்பட்ட குறிப்பிட்ட மனிதரைக் குறிக்கிறது. நவீன தமிழில் ‘மனிதனை’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֲשֶׁר יָצָר
  choice: தாம் உருவாக்கிய
  rationale: יצר என்பது ‘உருவாக்கு, வடிவமை’ என்று பொருள்படும். தொடர்பெயரெச்ச அமைப்பான ‘தாம் உருவாக்கிய’ செய்பவரைத் தெளிவுபடுத்தி எபிரேயத் தொடரை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: הָאָדָם என்பதன் குறிப்பு
  choice: மனிதனை
  alternative: மனிதகுலத்தை; ஆணை
  rationale: இச்சூழலில் இச்சொல் தேவன் ஏற்கெனவே உருவாக்கிய குறிப்பிட்ட மனிதரைக் குறிக்கிறது; மனிதகுலம் முழுவதையும் குறிக்கவில்லை. ‘ஆண்’ என்று மொழிபெயர்ப்பதைவிட ‘மனிதன்’ என்பது אָדָם என்ற சொல்லின் அடிப்படை மனிதத் தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. வாக்கிய ஓட்டம் இயல்பாக இருக்க தொடர்ச்சியான எபிரேய வினைகள் தமிழ் வினையெச்சம் மற்றும் இறுதி வினையாக அமைக்கப்பட்டுள்ளன; மூலத்தின் இடம்/திசை தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
