id: GEN.2.1
reference: Genesis 2:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְכֻלּ֛וּ הַ/שָּׁמַ֥יִם וְ/הָ/אָ֖רֶץ וְ/כָל צְבָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/001.yaml
  text: Thus the heavens and the earth were finished[b][a], and all their hosts.
translation:
  language: ta
  text: இவ்வாறு வானமும் பூமியும், அவற்றிலுள்ள அனைத்தும்[a] நிறைவுபெற்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவற்றின் எல்லாச் சேனையும்”; அதாவது வானத்தையும் பூமியையும் நிரப்பும் படைப்புகளின் முழுத் திரள்.
    reason: lexical_and_cultural_note
  - marker: b
    text: அல்லது, “முழுமையடைந்தன.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכֻלּוּ
  choice: நிறைவுபெற்றன
  rationale: כלה என்ற வேர்ச்சொல்லின் passive wayyiqtol வடிவம், படைப்புகள் முழுமையாக நிறைவடைந்த நிலையைச் சுட்டுகிறது. ‘நிறைவுபெற்றன’ என்பது அதன் செயப்பாட்டு மற்றும் விளைவுநிலைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַשָּׁמַיִם
  choice: வானம்
  rationale: எபிரெயத்தில் வடிவத்தால் பன்மையாக இருந்தாலும், படைப்புச் சூழலில் தமிழின் வழக்கமான ‘வானம்’ என்பது மேலுலகப் படைப்புத் தளத்தை இயல்பாகக் குறிக்கிறது.
- source_word: וְהָאָרֶץ
  choice: பூமியும்
  rationale: இங்கு אֶרֶץ ஒரு குறிப்பிட்ட நிலப்பகுதியை அல்ல, வானத்துடன் இணைந்த மண்ணுலகப் படைப்புத் தளத்தைக் குறிக்கிறது.
- source_word: וְכָל צְבָאָם
  choice: அவற்றிலுள்ள அனைத்தும்
  rationale: צָבָא என்பதன் அடிப்படைப் படிமம் அணிவகுப்பு அல்லது திரள் என்றாலும், இச்சுருக்க வசனத்தில் வானத்தையும் பூமியையும் நிரப்பும் படைப்புகள் அனைத்தையும் குறிக்கிறது. சொற்சொல்லான ‘அவற்றின் சேனைகள்’ நவீன தமிழில் தவறாக இராணுவப் பொருளை முன்னிறுத்தக்கூடும்; எனவே விரிவான பொருள் தெளிவாக வழங்கப்படுகிறது.
theological_decisions:
- issue: ‘அவற்றின் צבא’ என்பதன் பரப்பு
  choice: வானத்திலும் பூமியிலும் உள்ள படைப்புகள் அனைத்தையும் உள்ளடக்கும் விரிவான குறிப்பு
  alternative: முக்கியமாக விண்மீன்கள் அல்லது அணிவகுத்த சேனைகள் பற்றிய குறுகிய குறிப்பு
  rationale: ‘வானமும் பூமியும்’ என்ற முழுமையான இணைப்பைத் தொடர்ந்து வருவதால், இந்தச் சொற்றொடர் படைக்கப்பட்ட ஒழுங்கின் மொத்த உள்ளடக்கத்தையும் சுருக்குகிறது. ஆயினும் மூலச்சொல்லின் ‘திரள்/சேனை’ படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘வானமும் பூமியும்’ என்ற பரிச்சயமான அண்டமுழுமைக் கூற்று தக்கவைக்கப்பட்டுள்ளது; צְבָאָם என்பதற்கான சொற்சொல்லான இராணுவப் படிமம் முதன்மை உரையை இயல்பற்றதாக்காமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
