  source_fidelity: மூல எபிரெயத்தின் வினைச்சொல் செயப்பாட்டு நிறைவுநிலையையும், ‘வானம்–பூமி’ என்ற அண்டமுழுமைக் இணைப்பையும், அவற்றை நிரப்பும் முழுத் தொகுதியையும் மொழிபெயர்ப்பு துல்லியமாகத் தருகிறது. צְבָאָם என்பதன் ‘திரள்/அணி’ படிமம் முதன்மை உரையில் பொருள்விரிவாகவும் அடிக்குறிப்பில் சொற்சார் விளக்கமாகவும் பாதுகாக்கப்பட்டுள்ளது.
