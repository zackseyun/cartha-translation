reference: Genesis 2:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּצְמַ֞ח יְהוָ֤ה אֱלֹהִים֙ מִן הָ֣/אֲדָמָ֔ה כָּל עֵ֛ץ נֶחְמָ֥ד לְ/מַרְאֶ֖ה וְ/ט֣וֹב לְ/מַאֲכָ֑ל וְ/עֵ֤ץ הַֽ/חַיִּים֙ בְּ/ת֣וֹךְ הַ/גָּ֔ן וְ/עֵ֕ץ הַ/דַּ֖עַת ט֥וֹב וָ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/009.yaml
  text: And Yahweh God caused to grow from the ground every tree that is pleasant to the sight and good for food[a], and the tree of life in the midst of the garden[b], and the tree of the knowledge of good and evil.
translation:
  language: ta
  text: யாவே தேவன் நிலத்திலிருந்து கண்ணுக்கு இன்பமானதும் உணவாக நல்லதுமான எல்லா மரங்களையும், தோட்டத்தின் நடுவிலுள்ள வாழ்வின் மரத்தையும், நன்மை தீமை பற்றிய அறிவின் மரத்தையும்[a] முளைக்கச் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நன்மை தீமை பற்றிய அறிவு” என்பது ஒழுக்கப் பகுத்தறிவையா, முதிர்ச்சியையா, அல்லது அனைத்தையும் உள்ளடக்கும் அறிவையா குறிக்கிறது என்பதில் விளக்கங்கள் வேறுபடுகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּצְמַח
  choice: முளைக்கச் செய்தார்
  rationale: צמח என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளைக் கொண்டிருப்பதால், வெறுமனே ‘முளைத்தது’ என்பதற்குப் பதிலாக ‘முளைக்கச் செய்தார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה אֱלֹהִים
  choice: யாவே தேவன்
  rationale: יהוה என்ற தனிப்பெயர் ஒலிபெயர்ப்பாக ‘யாவே’ என்றும், אֱלֹהִים இயல்பான தமிழ் வேதாகம நடையில் ‘தேவன்’ என்றும் தரப்பட்டுள்ளது.
- source_word: מִן הָאֲדָמָה
  choice: நிலத்திலிருந்து
  rationale: இங்கு אֲדָמָה தாவரங்கள் வளரும் மண்ணையோ நிலத்தையோ குறிக்கிறது; ‘நிலத்திலிருந்து’ என்பது இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: כָּל עֵץ
  choice: எல்லா மரங்களையும்
  rationale: כָּל உடன் வரும் ஒருமைத் தொகுப்புப்பெயரின் பகிர்ந்தளிக்கும் பொருள் தமிழில் இயல்பாகப் பன்மையில் தரப்பட்டுள்ளது.
- source_word: נֶחְמָד לְמַרְאֶה
  choice: பார்வைக்கு விரும்பத்தக்கதும்
  rationale: மரங்கள் காண்பதற்கு ஈர்ப்பும் இன்பமும் அளிப்பதைச் சொல்கிறது; ‘விரும்பத்தக்க’ என்பது மூலத்தின் ஆசைக்குரிய/மகிழ்ச்சியூட்டும் நுண்பொருளைக் காக்கிறது.
- source_word: וְטוֹב לְמַאֲכָל
  choice: உணவுக்கு நல்லதுமான
  rationale: உணவாக உகந்த நன்மையை எளிய, நெருக்கமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְעֵץ הַחַיִּים
  choice: வாழ்வின் மரத்தையும்
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவாகப் பிரதிபலிக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: בְּתוֹךְ הַגָּן
  choice: தோட்டத்தின் நடுவில்
  rationale: בְּתוֹךְ இங்கு தோட்டத்தின் நடுப்பகுதியை அல்லது அதன் மத்தியில் இருப்பதைச் சுட்டுகிறது.
- source_word: וְעֵץ הַדַּעַת טוֹב וָרָע
  choice: நன்மை தீமை பற்றிய அறிவின் மரத்தையும்
  rationale: דַּעַת טוֹב וָרָע என்ற விவாதத்திற்குரிய சொற்றொடரை ஒரு குறிப்பிட்ட விளக்கமாகச் சுருக்காமல், அதன் சொற்பொருள் சார்ந்த அமைப்புடன் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் நான்கெழுத்து இறைப்பெயரை பொதுப்பட்டமாக மாற்றாமல் தனிப்பெயராகக் காக்க ‘யாவே’ பயன்படுத்தப்பட்டது.
- issue: ‘நன்மை தீமை பற்றிய அறிவு’ என்பதன் பொருள்
  choice: சொற்றொடரை விளக்க விரிவாக்கமின்றிப் பாதுகாத்தல்
  alternative: ஒழுக்கப் பகுத்தறிவு / அனைத்தையும் அறிதல் / நன்மை பயப்பதையும் தீமை பயப்பதையும் அறிதல்
  rationale: இந்த எபிரெயச் சொற்றொடர் ஒழுக்க அறிவு, முதிர்ச்சி, முழுமையான அறிவு போன்ற பல விளக்கங்களுக்கு இடமளிக்கிறது; முதன்மை உரை அவற்றில் ஒன்றைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. நீண்ட எபிரெய வாக்கியத்தின் இணைப்பமைப்பு காக்கப்பட்டாலும், தமிழில் வினை தெளிவாக நிறைவுபெற இறுதியில் ‘முளைக்கச் செய்தார்’ மீண்டும் வழங்கப்பட்டது.
