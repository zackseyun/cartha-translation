revisions:
- from: யாவே தேவன், பார்வைக்கு விரும்பத்தக்கதும் உணவுக்கு நல்லதுமான எல்லா மரங்களையும் நிலத்திலிருந்து முளைக்கச் செய்தார்; தோட்டத்தின் நடுவில் வாழ்வின் மரத்தையும், நன்மை தீமை பற்றிய அறிவின் மரத்தையும்[a] முளைக்கச் செய்தார்.
  to: யாவே தேவன் நிலத்திலிருந்து கண்ணுக்கு இன்பமானதும் உணவாக நல்லதுமான எல்லா மரங்களையும், தோட்டத்தின் நடுவிலுள்ள வாழ்வின் மரத்தையும், நன்மை தீமை பற்றிய அறிவின் மரத்தையும்[a] முளைக்கச் செய்தார்.
