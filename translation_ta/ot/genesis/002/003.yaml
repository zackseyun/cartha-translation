- from: ஆகவே, தேவன் ஏழாம் நாளை ஆசீர்வதித்து, அதைப் பரிசுத்தமாக்கினார்[a]. ஏனெனில், தேவன் படைத்துச் செய்த தமது எல்லா வேலையிலிருந்தும் அந்த நாளில் அவர் ஓய்ந்தார்[b][c].
  to: தேவன் ஏழாம் நாளை ஆசீர்வதித்து, அதைப் பரிசுத்தமாக்கினார்[a]. ஏனெனில், தேவன் படைத்துச் செய்த தமது எல்லா வேலையிலிருந்தும் அந்த நாளில் அவர் ஓய்ந்தார்[b][c].
