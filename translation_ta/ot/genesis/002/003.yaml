base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/003.yaml
  text: So God blessed the seventh day and made it holy[d][c][b][a], because on it he rested from all his work that God had created to make.
translation:
  language: ta
  text: தேவன் ஏழாம் நாளை ஆசீர்வதித்து, அதைப் பரிசுத்தமாக்கினார்[a]. ஏனெனில், தேவன் படைத்துச் செய்த தமது எல்லா வேலையிலிருந்தும் அந்த நாளில் அவர் ஓய்ந்தார்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதைப் பரிசுத்தமானதாகப் பிரித்துவைத்தார்.’
    reason: lexical_alternative
  - marker: b
    text: ‘ஓய்ந்தார்’ என்பதற்கான எபிரெய வினைச்சொல் ‘செய்வதை நிறுத்தினார்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொற்சொல்லாக, ‘தேவன் செய்வதற்காகப் படைத்த தமது எல்லா வேலையிலிருந்தும்.’ இறுதித் தொடர் பொருள் காண்பதற்குக் கடினமானது; ‘தேவன் படைத்துச் செய்த’ அல்லது ‘தேவன் படைப்பதன் மூலம் செய்த’ என்றும் புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: ஆசீர்வதித்து
  rationale: பரך என்பதன் பיעேல் வடிவம் அந்த நாளுக்கு ஆசீர்வாதம் அளித்ததைக் குறிக்கிறது; ‘ஆசீர்வதித்தார்’ என்பது இயல்பான, நிலைபெற்ற தமிழ் மொழிபெயர்ப்பு.
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: ஒருமை வினையோடு வரும் இச்சொல் ஒரே தேவனைக் குறிக்கிறது; தமிழ் வேதாகம நடையில் மரியாதையும் தெளிவும் கொண்ட பொதுவான இணைச்சொல் இது.
- source_word: יוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாள்
  rationale: பெயர்ச்சொல்லையும் வரிசை எண்ணையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיְקַדֵּשׁ אֹתוֹ
  choice: அதைப் பரிசுத்தமாக்கினார்
  rationale: קדש என்பதன் பיעேல் வடிவம் பரிசுத்தமாக்குதல் அல்லது பரிசுத்தமானதாகப் பிரித்துவைத்தல் என்ற பொருளைக் கொண்டது. முதன்மை மொழிபெயர்ப்பு அதன் பரிசுத்தத் தன்மையைத் தெளிவாகக் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: ஏழாம் நாள் ஆசீர்வதிக்கப்பட்டு பரிசுத்தமாக்கப்பட்டதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: בּוֹ
  choice: அந்த நாளில்
  rationale: இதன் சுட்டுப்பொருள் ஏழாம் நாள் என்பதால், தமிழில் ‘அந்த நாளில்’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: שָׁבַת
  choice: ஓய்ந்தார்
  rationale: இவ்வினை நிறுத்துதல் அல்லது ஓய்தல் என்று பொருள்படலாம். படைப்புச் சூழலிலும் ஓய்வுநாள் தொடர்பிலும் ‘ஓய்ந்தார்’ இயல்பானது; ‘செய்வதை நிறுத்தினார்’ என்பதும் சாத்தியம் என்பதை அடிக்குறிப்பு காக்கிறது.
- source_word: מִכָּל מְלַאכְתּוֹ
  choice: தமது எல்லா வேலையிலிருந்தும்
  rationale: מלאכה வேலை, தொழில் அல்லது செயற்பாடு என்பதைக் குறிக்கிறது. ‘எல்லா வேலையிலிருந்தும்’ என்பது விரிவானதும் இயல்பானதும்; ‘தமது’ மரியாதை ஒருமையைத் தெளிவாக்குகிறது.
- source_word: אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת
  choice: தேவன் படைத்துச் செய்த
  rationale: இறுதியிலுள்ள לַעֲשׂוֹת தொடரின் இலக்கண உறவு கடினமானது. ‘படைத்துச் செய்த’ என்பது தமிழில் வாசிக்கத்தக்க வகையில் இரு வினைகளையும் காக்கிறது; சொற்சொல் அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: שָׁבַת என்பதையும் ஓய்வுநாள் தொடர்பையும் மொழிபெயர்த்தல்
  choice: ஓய்ந்தார்
  alternative: செய்வதை நிறுத்தினார்
  rationale: ‘ஓய்ந்தார்’ என்பது ஓய்வுநாளுடனான உரைத் தொடர்பைக் காக்கிறது; தேவன் களைப்படைந்தார் என்று உரை கூறுவதாகத் தனியே விளக்கவில்லை. ‘நிறுத்தினார்’ என்ற சொற்பொருள் வாய்ப்பு அடிக்குறிப்பில் விடப்பட்டுள்ளது.
- issue: וַיְקַדֵּשׁ אֹתוֹ என்பதிலுள்ள பரிசுத்தக் கருத்து
  choice: அதைப் பரிசுத்தமாக்கினார்
  alternative: அதைப் பரிசுத்தமானதாகப் பிரித்துவைத்தார்
  rationale: முதன்மை வாசகம் பரிசுத்தம் என்ற மையக் கருத்தை நேரடியாகக் காக்கிறது; ‘பிரித்துவைத்தார்’ என்பது சாத்தியமான விளக்க விரிவாக்கம் மட்டுமே.
- issue: אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת என்ற கடினமான இறுதித் தொடர்
  choice: தேவன் படைத்துச் செய்த
  alternative: தேவன் செய்வதற்காகப் படைத்த
  rationale: முதன்மை வாசகம் தமிழில் பொருள் புரியுமாறு இரு வினைகளையும் இணைக்கிறது; ஆனால் எபிரெயச் சொல்லாட்சியின் உண்மையான இலக்கணத் தெளிவின்மையை அடிக்குறிப்பில் வெளிப்படையாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘தேவன்’, ‘ஆசீர்வதித்தார்’, ‘பரிசுத்தமாக்கினார்’ ஆகிய நிலைபெற்ற சொற்கள் காக்கப்பட்டுள்ளன; கடினமான எபிரெய இறுதித் தொடரின் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
