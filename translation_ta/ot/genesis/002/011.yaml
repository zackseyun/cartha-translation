  text: שֵׁ֥ם הָֽ/אֶחָ֖ד פִּישׁ֑וֹן ה֣וּא הַ/סֹּבֵ֗ב אֵ֚ת כָּל אֶ֣רֶץ הַֽ/חֲוִילָ֔ה אֲשֶׁר שָׁ֖ם הַ/זָּהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/011.yaml
  text: The name of the first is Pishon; it is the one that goes around all the land of Havilah[a], where there is gold.
translation:
  language: ta
  text: முதல் ஆற்றின் பெயர் பீசோன்; அது ஆவிலா நாடு முழுவதையும் சுற்றிச் செல்கிறது[a]; அந்த நாட்டில் தங்கம் உள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆவிலா நாடு முழுவதையும் சூழ்ந்து செல்கிறது.” எபிரெய வினையெச்சம் “சுற்றிச் செல்கிறது” அல்லது “சூழ்கிறது” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם הָאֶחָד
  choice: முதலாவதன் பெயர்
  rationale: நான்கு ஆறுகளின் வரிசையில் הָאֶחָד என்பது ‘முதலாவது’ என்ற வரிசைப் பொருளில் வருகிறது; எபிரெய வாக்கியத்தின் சுருக்கத்தையும் தமிழில் இயல்பாகப் பேணுகிறது.
- source_word: פִּישׁוֹן
  choice: பீசோன்
  rationale: ஆற்றின் இயற்பெயர்; எபிரெய ஒலிப்புக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַסֹּבֵב
  choice: சுற்றிச் செல்கிறது
  rationale: סבב என்பதன் ‘சுற்றிச் செல்/சூழ்ந்துசெல்’ என்ற இயக்கப் பொருளைப் பேணுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘ஓடுகிறது’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: אֵת כָּל אֶרֶץ הַחֲוִילָה
  choice: ஆவிலா நாடு முழுவதையும்
  rationale: כָּל என்பதன் முழுமைப் பொருளையும், אֶרֶץ என்பதன் இங்குள்ள நிலப்பகுதி/நாடு என்ற பொருளையும் இயல்பான தமிழில் தருகிறது; ஆவிலா என்பது இடப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: אֲשֶׁר שָׁם הַזָּהָב
  choice: தங்கம் கிடைக்கும்
  rationale: ‘அங்கே தங்கம் உள்ளது’ என்ற இருப்பிடக் கருத்தை, ஆவிலா நாட்டை விளக்கும் இயல்பான தமிழ்ச் சார்புத்தொடராகத் தருகிறது.
