source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ הָֽ/אָדָם֒ זֹ֣את הַ/פַּ֗עַם עֶ֚צֶם מֵֽ/עֲצָמַ֔/י וּ/בָשָׂ֖ר מִ/בְּשָׂרִ֑/י לְ/זֹאת֙ יִקָּרֵ֣א אִשָּׁ֔ה כִּ֥י מֵ/אִ֖ישׁ לֻֽקֳחָה זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/023.yaml
  text: Then the man said[a], “This at last is bone of my bones and flesh of my flesh; this one will be called woman[b], because from man she was taken.”
translation:
  language: ta
  text: அப்போது அந்த மனிதன், “இறுதியாக,[a] இவள்தான் என் எலும்புகளின் எலும்பும், என் சதையின் சதையும்! இவள் ‘பெண்’[b] என்று அழைக்கப்படுவாள்; ஏனெனில் இவள் ஆணிடமிருந்து எடுக்கப்பட்டாள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் நேரடியாக: “இந்த முறை, இவள்தான்.”'
    reason: זֹאת הַפַּעַם என்ற எபிரெயத் தொடரின் நேரடிப் பொருள் ‘இந்த முறை’; இச்சூழலில் அது நிறைவு அல்லது கண்டடைதலின் உணர்வையும் தருகிறது.
  - marker: b
    text: எபிரெயத்தில் ‘பெண்’ (இஷ்ஷா) என்பதும் ‘ஆண்’ (இஷ்) என்பதும் ஒலியால் தொடர்புடைய சொற்களாக அமைந்து இங்கு சொல்விளையாட்டை உருவாக்குகின்றன.
    reason: மூல எபிரெயத்தின் אִשָּׁה / אִישׁ ஒலிசார் சொல்விளையாட்டை தமிழில் இயல்பாக முழுமையாக மீளுருவாக்க முடியாது.
lexical_decisions:
- source_word: הָאָדָם
  choice: அந்த மனிதன்
  rationale: இங்கு אָדָם பொதுவாக மனிதகுலத்தைக் குறிக்காமல், பின்னர் வரும் אִישׁ/אִשָּׁה வேறுபாட்டில் ஆண் மனிதரைக் குறிக்கிறது. ‘அந்த மனிதன்’ என்பது முன்பே குறிப்பிடப்பட்ட மனிதரைச் சுட்டுகிறது; அதேவேளை உடனடியாக ‘ஆண்’ என்று மொழிபெயர்த்து எபிரெயச் சொற்களின் வேறுபாட்டை மறைக்கவில்லை.
- source_word: זֹאת הַפַּעַם
  choice: இப்போதுதான்—இவள்தான்
  rationale: இந்த எபிரெயத் தொடர் ‘இந்த முறை’ என்ற நேரடிப் பொருளையும், நீண்ட எதிர்பார்ப்புக்குப் பின் கிடைத்த நிறைவை உணர்த்தும் ‘இப்போதுதான்/கடைசியாக’ என்ற இயல்பான உணர்வையும் கொண்டுள்ளது. தமிழில் ‘இப்போதுதான்—இவள்தான்’ என்பது அந்தக் கண்டடைதலின் வலியுறுத்தலையும் זֹאת என்பதின் பெண்பால் சுட்டுதலையும் இயல்பாகக் காக்கிறது.
- source_word: עֶצֶם מֵעֲצָמַי
  choice: என் எலும்பிலிருந்து எலும்பு
  rationale: מִן என்பதின் ‘இலிருந்து’ என்ற மூலப்பொருளைக் காத்து, பெண் மனிதனிடமிருந்து உருவாக்கப்பட்டதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וּבָשָׂר מִבְּשָׂרִי
  choice: என் சதையிலிருந்து சதை
  rationale: முந்தைய ‘எலும்பிலிருந்து எலும்பு’ என்பதுடன் உள்ள எபிரெய இணைநிலையைப் பேணி, מִן என்பதையும் வெளிப்படையாக மொழிபெயர்க்கிறது.
- source_word: לְזֹאת יִקָּרֵא
  choice: இவள் ... என்று அழைக்கப்படுவாள்
  rationale: பெண்பால் சுட்டுப்பெயரின் வலியுறுத்தலையும், קרא வினையின் நிஃபால் பெயரிடும் வடிவத்தையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אִשָּׁה
  choice: பெண்
  rationale: இச்சூழலில் பெண் மனிதரைக் குறிக்கும் வழக்கமான தமிழ் சொல். இதை ‘மனைவி’ என்று குறுக்குவது மூலத்தில் உள்ள விரிவான பொருளை தேவையின்றி வரையறுக்கும்.
- source_word: מֵאִישׁ
  choice: ஆணிடமிருந்து
  rationale: אִישׁ இங்கு אִשָּׁה உடன் அமைந்த பாலின வேறுபாடும் சொல்விளையாட்டும் சார்ந்த சொல்லாக உள்ளது. ‘ஆண்’ என்பது சூழலுக்கேற்ற தெளிவான இணைச்சொல்.
- source_word: לֻקֳחָה זֹאת
  choice: இவள் ... எடுக்கப்பட்டதால்
  rationale: பெண்பால் ஒருமைச் செயப்பாட்டு வடிவத்தையும் இறுதி זֹאת என்பதின் சுட்டுதலையும் ஒரே இயல்பான தமிழ்த் தொடரில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: הָאָדָם என்பதின் சூழல்சார் பொருள்
  choice: அந்த மனிதன்
  alternative: மனிதன் / அந்த ஆண்
  rationale: இந்த வசனத்தில் அந்தச் சொல் குறிப்பிட்ட முதல் மனிதரைக் குறிக்கிறது. ஆயினும் அடுத்து வரும் אִישׁ என்பதிலிருந்து அதன் சொல்வேறுபாட்டைக் காக்க ‘அந்த மனிதன்’ தேர்ந்தெடுக்கப்பட்டது; இதனால் மனிதகுலம் குறித்த கூடுதல் கோட்பாட்டுக் கருத்து வசனத்துக்குள் புகுத்தப்படவில்லை.
- issue: אִישׁ / אִשָּׁה சொல்விளையாட்டு
  choice: ஆண் ... பெண்
  alternative: கணவன் ... மனைவி
  rationale: மூலத்தின் பாலின இணையை ‘ஆண்/பெண்’ காக்கிறது. எபிரெயத்தில் உள்ள ஒலியொற்றுமை தமிழில் முழுமையாக மீளுருவாக்க முடியாததால் அது அடிக்குறிப்பில் விளக்கப்படுகிறது. ‘கணவன்/மனைவி’ என்பது இவ்வசனத்தின் சொற்பொருளை தேவையின்றி திருமணப் பங்குகளாகக் குறுக்கும்.
- issue: זֹאת הַפַּעַם என்பதின் கால/நிறைவு நுட்பம்
  choice: இப்போதுதான்—இவள்தான்
  alternative: இந்த முறை இவள்
  rationale: மூலம் ‘இந்த முறை’ என்ற சொற்பொருளையும், முந்தைய விலங்குகளிடையே தகுந்த துணை இல்லாத பின்னணியில் நிறைவு அல்லது கண்டடைதலின் உணர்வையும் அனுமதிக்கிறது. முதன்மை உரை இயல்பான தமிழ் உணர்வைத் தருகிறது; நேரடி மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமுள்ள ஆனால் பொதுவாசகருக்குத் தெளிவான உரை. ‘இவள்தான்’ என்ற வலியுறுத்தலும் ஆச்சரியக்குறியும் மனிதனின் கண்டடைதல் மற்றும் மகிழ்ச்சித் தொனியை வெளிப்படுத்துகின்றன. ‘எலும்பிலிருந்து எலும்பு / சதையிலிருந்து சதை’ என்ற இணை அமைப்பு மூலத்தின் உருவகத்தையும் சமச்சீரையும் காக்கிறது.
