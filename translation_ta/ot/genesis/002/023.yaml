- from: அப்போது அந்த மனிதன், “இப்போதுதான்[a]—இவள்தான் என் எலும்பிலிருந்து எலும்பும், என் சதையிலிருந்து சதையும்! இவள் ஆணிடமிருந்து எடுக்கப்பட்டதால், ‘பெண்’[b] என்று அழைக்கப்படுவாள்” என்றான்.
