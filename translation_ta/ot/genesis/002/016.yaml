id: GEN.2.16
reference: Genesis 2:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְצַו֙ יְהוָ֣ה אֱלֹהִ֔ים עַל הָֽ/אָדָ֖ם לֵ/אמֹ֑ר מִ/כֹּ֥ל עֵֽץ הַ/גָּ֖ן אָכֹ֥ל תֹּאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/016.yaml
  text: And Yahweh God commanded the man[a], saying[b], “From every tree of the garden you may surely eat.”
translation:
  language: ta
  text: 'யாவே தேவன் மனிதனுக்குக் கட்டளையிட்டுச் சொன்னார்: “தோட்டத்திலுள்ள ஒவ்வொரு மரத்திலிருந்தும் நீ தாராளமாகச் சாப்பிடலாம்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் ஒரே வினைச்சொல்லின் இரண்டு வடிவங்கள் இணைந்து வலியுறுத்துகின்றன. இதை “நிச்சயமாகச் சாப்பிடலாம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டுச் சொன்னார்
  rationale: צוה என்பதன் அதிகாரபூர்வமான கட்டளையிடும் பொருளையும், தொடர்ந்து வரும் לֵאמֹר என்பதையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: יְהוָה אֱלֹהִים
  choice: யாவே தேவன்
  rationale: יְהוָה என்ற தனிப்பெயரை ‘யாவே’ என்று ஒலிபெயர்த்து, אֱלֹהִים என்பதை வழக்கமான ‘தேவன்’ என்று வழங்குகிறது.
- source_word: עַל הָאָדָם
  choice: அந்த மனிதனிடம்
  rationale: இங்கு הָאָדָם பொதுவாக மனிதகுலத்தைக் குறிக்காமல், முன்பு உருவாக்கப்பட்ட குறிப்பிட்ட மனிதனைக் குறிக்கிறது; צוה உடன் வரும் עַל கட்டளையைப் பெறுபவரைக் குறிக்கிறது.
- source_word: מִכֹּל עֵץ הַגָּן
  choice: தோட்டத்திலுள்ள ஒவ்வொரு மரத்திலிருந்தும்
  rationale: מן என்பதன் ‘இலிருந்து’ என்ற பொருளையும், כֹּל என்பதன் முழுமையான அனுமதியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூலத்தில் ‘கனி’ என்ற சொல் இல்லாததால் அதைச் சேர்க்கவில்லை.
- source_word: אָכֹל תֹּאכֵל
  choice: தாராளமாகச் சாப்பிடலாம்
  rationale: வினையெச்ச முழுவடிவமும் வினைமுற்றும் இணையும் எபிரெய வலியுறுத்தலை, இச்சூழலில் கட்டாயமாக அல்லாமல் அளிக்கப்படும் முழு அனுமதியாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைத் தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்க ஒலிபெயர்க்கப்பட்டது.
- issue: הָאָדָם என்பதன் குறிப்பு
  choice: அந்த மனிதன்
  alternative: மனிதன்; மனிதகுலம்
  rationale: கதைச் சூழலில் தோட்டத்தில் வைக்கப்பட்ட தனிப்பட்ட ஆண் மனிதனையே குறிக்கிறது; மனிதகுலம் முழுவதையும் பொதுவாகக் குறிக்கவில்லை.
- issue: אָכֹל תֹּאכֵל என்பதன் வினைநிலை
  choice: சாப்பிடலாம்
  alternative: சாப்பிட வேண்டும்; நிச்சயமாகச் சாப்பிடுவாய்
  rationale: இலக்கண வடிவம் வலியுறுத்தலைக் கொண்டிருந்தாலும், இங்கு அதன் உரையாடல் செயல்பாடு சாப்பிடும்படி கட்டாயப்படுத்துவது அல்ல; பரந்த அனுமதியை வழங்குவதாகும்.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘மரத்தின் கனியை’ என்று விளக்கமாகச் சேர்க்காமல், மூலத்தின் ‘ஒவ்வொரு மரத்திலிருந்தும்’ என்ற சொல்லமைப்பு பாதுகாக்கப்பட்டது. வலியுறுத்தல் ‘தாராளமாக’ என்பதால் பிரதிபலிக்கப்பட்டு, மாற்று வடிவம் அடிக்குறிப்பில் தரப்பட்டது.
