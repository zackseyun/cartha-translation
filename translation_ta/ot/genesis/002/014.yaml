base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/014.yaml
  text: And the name of the third river is Hiddekel[a]; it is the one that goes east of Asshur[b]. And the fourth river is the Euphrates.
translation:
  language: ta
  text: மூன்றாவது ஆற்றின் பெயர் இதெக்கேல்[a]; அது அசூருக்குக் கிழக்கே[b] ஓடுகிறது. நான்காவது ஆறு யூபிராத்து.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதெக்கேல் என்பது பாரம்பரியமாக டைகிரிஸ் ஆற்றுடன் அடையாளப்படுத்தப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அசீரியாவுக்குக் கிழக்கே”; எபிரெயத்தில், “அசூருக்குக் கிழக்கே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם
  choice: பெயர்
  rationale: எபிரெயச் சொல்லின் வழக்கமான பொருளையும், ஆற்றைப் பெயரிட்டு அறிமுகப்படுத்தும் சூத்திர அமைப்பையும் நேரடியாகப் பேணுகிறது.
- source_word: נָּהָר
  choice: ஆறு
  rationale: இச்சூழலில் பெரிய நீரோட்டத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: שְּׁלִישִׁי
  choice: மூன்றாவது
  rationale: வரிசை எண்ணை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: חִדֶּקֶל
  choice: இதெக்கேல்
  rationale: எபிரெயப் பெயரின் ஒலிவடிவத்தைத் தமிழில் பெயர்த்தெழுதுகிறது; டைகிரிஸ் என்ற பாரம்பரிய அடையாளம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הוּא הַהֹלֵךְ
  choice: அது ... ஓடுகிறது
  rationale: ஆற்றைக் குறிக்கும் הוּא என்பதையும், தொடர்ச்சியான போக்கைக் குறிக்கும் הֹלֵךְ என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ஆற்றைப் பொறுத்தவரை ‘ஓடுகிறது’ என்பது ‘செல்கிறது’ என்பதைவிட இயல்பானது.
- source_word: קִדְמַת
  choice: கிழக்கே
  rationale: புவியியல் சூழலில் ‘கிழக்கில்/கிழக்கே’ என்ற திசைப் பொருள் பொருத்தமானது; வேறு சாத்தியத்தை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: אַשּׁוּר
  choice: அசூர்
  rationale: எபிரெயப் பெயரைப் பெயர்த்தெழுதி, அது அசீரியாவைக் குறிக்கக்கூடிய சாத்தியத்தை அடிக்குறிப்பில் பேணுகிறது.
- source_word: רְבִיעִי
  choice: நான்காவது
  rationale: வரிசை எண்ணை நேரடியாகத் தருகிறது.
- source_word: פְרָת
  choice: யூபிராத்து
  rationale: இவ்வாற்றிற்கான தமிழில் பரவலாக அறியப்படும் பாரம்பரியப் பெயரைப் பயன்படுத்துவது நவீன வாசகருக்கு தெளிவளிக்கிறது.
