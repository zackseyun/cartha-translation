source:
  edition: WLC
  text: וַ/יִּצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים מִן הָֽ/אֲדָמָ֗ה כָּל חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/אֵת֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יָּבֵא֙ אֶל הָ֣/אָדָ֔ם לִ/רְא֖וֹת מַה יִּקְרָא ל֑/וֹ וְ/כֹל֩ אֲשֶׁ֨ר יִקְרָא ל֧/וֹ הָֽ/אָדָ֛ם נֶ֥פֶשׁ חַיָּ֖ה ה֥וּא שְׁמֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/019.yaml
  text: Yahweh God formed from the ground every wild animal and every bird of the sky[a], and he brought them to the man to see what he would call them. Whatever the man called each living creature[b], that was its name.
translation:
  language: ta
  text: யெகோவா தேவன் நிலத்திலிருந்து எல்லாக் காட்டு விலங்குகளையும் வானத்துப் பறவைகள் அனைத்தையும் உருவாக்கினார்[a]. அவற்றை மனிதனிடம் கொண்டுவந்து, அவன் அவற்றை என்னவென்று அழைப்பான் என்று பார்த்தார். ஒவ்வொரு உயிரினத்தையும் மனிதன்[b] என்னவென்று அழைத்தானோ, அதுவே அதன் பெயராயிற்று.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உருவாக்கியிருந்தார்.” எபிரெய வினை வடிவம் பொதுவாக எளிய இறந்தகாலத்தில் மொழிபெயர்க்கப்பட்டாலும், சூழலில் இதை முன்னரே நிகழ்ந்த செயலாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “ஆதாம்.” எபிரெயில் இங்கு הָאָדָם (ஹா-ஆதாம்), சொல்லுக்கு சொல் “மனிதன்” என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצֶר
  choice: உருவாக்கினார்
  rationale: எபிரெய வழக்கமான தொடர்கதை இறந்தகாலத்தை நேரடியாகக் காட்டுகிறது. தமிழில் எளிய இறந்தகாலம் இயல்பாக உள்ளது; சூழலால் சாத்தியமான முன்னிறந்தகாலப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה אֱלֹהִים
  choice: யெகோவா தேவன்
  rationale: தெய்வீகப் பெயரான יהוה என்பதை பொதுப்பட்டமாக மாற்றாமல் ‘யெகோவா’ என்று ஒலிபெயர்த்து, אֱלֹהִים என்பதை இயல்பான தமிழ் வேதாகம நடையில் ‘தேவன்’ என வழங்குகிறது.
- source_word: מִן הָאֲדָמָה
  choice: நிலத்திலிருந்து
  rationale: אֲדָמָה என்பது மண் அல்லது நிலத்தைக் குறிக்கிறது. ‘நிலத்திலிருந்து’ என்பது மனிதன் நிலத்திலிருந்து உருவாக்கப்பட்ட சுற்றியுள்ள உரையுடன் உள்ள சொல்லிணைப்பையும் காக்கிறது.
- source_word: כָּל חַיַּת הַשָּׂדֶה
  choice: எல்லாக் காட்டு விலங்குகளையும்
  rationale: வெளிநிலம் அல்லது திறந்த வெளியில் வாழும் நிலவிலங்குகளை நவீன தமிழில் தெளிவாகக் குறிக்கும் இயல்பான சொற்றொடர்.
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: வானத்துப் பறவைகள் அனைத்தையும்
  rationale: עוֹף இங்கு பறவைகளைச் சுட்டுவது மிகவும் இயல்பு; ‘வானத்து’ என்பது அவற்றின் வான்சார் வருணனையைத் தக்கவைக்கிறது.
- source_word: וַיָּבֵא אֶל הָאָדָם
  choice: அவற்றை மனிதனிடம் கொண்டுவந்து
  rationale: முந்திய இரு தொகுப்புகளையும் குறிக்கும் பன்மைப் பொருள் தமிழில் வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது. הָאָדָם இங்கு பெயராக அல்லாமல் ‘மனிதன்’ என்ற பொதுப்பெயராக வழங்கப்படுகிறது.
- source_word: לִרְאוֹת מַה יִּקְרָא לוֹ
  choice: அவன் அவற்றை என்னவென்று அழைப்பான் என்று பார்த்தார்
  rationale: ‘பார்த்தார்’ என்பது לִרְאוֹת என்பதையும், ‘அழைப்பான்’ என்பது קרא என்பதையும் நேரடியாகப் பிரதிபலிக்கிறது; நோக்கப் பொருள் தமிழில் இயல்பான வாக்கியமாக அமைக்கப்பட்டுள்ளது.
- source_word: נֶפֶשׁ חַיָּה
  choice: உயிருள்ள ஒவ்வொன்றையும்
  rationale: இங்கு உயிருள்ள ஜீவராசியைக் குறிக்கிறது. ‘ஆத்துமா’ போன்ற பிற்கால இறையியல் நுண்பொருளைத் தேவையின்றி புகுத்தாமல், பகிர்ந்தளிக்கும் சூழலைத் தமிழில் தெளிவாக்குகிறது.
- source_word: הוּא שְׁמוֹ
  choice: அதுவே அதன் பெயராயிற்று
  rationale: வினைச்சொல்லில்லாத எபிரெய வாக்கியத்தை இயல்பான தமிழில் வழங்குகிறது; ‘அதன்’ என்பது பெயரிடப்பட்ட உயிரினத்தைக் குறிக்கிறது.
theological_decisions:
- issue: וַיִּצֶר என்பதன் காலப்பொருளும் படைப்பின் நிகழ்வரிசையும்
  choice: எளிய இறந்தகாலமாக ‘உருவாக்கினார்’
  alternative: முன்னிறந்தகாலமாக ‘உருவாக்கியிருந்தார்’
  rationale: எபிரெய வடிவம் இயல்பாகக் கதையை முன்னெடுக்கும் எளிய இறந்தகாலம். ஆயினும் சூழல் முன்நிகழ்வைக் குறிக்கலாம்; அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் வைக்கப்படுகிறது, படைப்பு வரிசையை மொழிபெயர்ப்பே தீர்மானிக்கவில்லை.
- issue: הָאָדָם என்பது பொதுப்பெயரா தனிப்பெயரா
  choice: மனிதன்
  alternative: ஆதாம்
  rationale: உறுப்புடன் வரும் எபிரெயச் சொல் நேரடியாக ‘மனிதன்’ என்று பொருள்படுகிறது; அடுத்துள்ள אֲדָמָה (‘நிலம்’) என்பதுடனான சொல் தொடர்பையும் இது காக்கிறது. பாரம்பரிய தனிப்பெயர் வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதானதாயும் மரியாதைமிக்கதாயும் அமைக்கப்பட்டுள்ளது. ‘என்னவென்று அழைப்பான்/அழைத்தானோ’ என்ற மீளுரைத்தல் மூலத்தின் קרא என்ற சொல்லிணைப்பைக் காக்கிறது. தெய்வீகப் பெயர் பொதுப்பட்டமாக மறைக்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
