  text: וַ/יִּקַּ֛ח יְהוָ֥ה אֱלֹהִ֖ים אֶת הָֽ/אָדָ֑ם וַ/יַּנִּחֵ֣/הוּ בְ/גַן עֵ֔דֶן לְ/עָבְדָ֖/הּ וּ/לְ/שָׁמְרָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/015.yaml
  text: Then Yahweh God took the man and placed him in the garden of Eden to work it and to keep it[a][b].
translation:
  language: ta
  text: யாவே தேவன் மனிதனை எடுத்து, ஏதேன் தோட்டத்தில் அவனை வைத்தார்[b]; தோட்டத்தைப் பண்படுத்தவும் அதைக் காத்துக்கொள்ளவும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதில் உழைக்கவும் அதைப் பாதுகாக்கவும்.” எபிரெய வினைச்சொற்கள் “வேலைசெய்/பண்படுத்து” என்றும் “காத்துக்கொள்/பாதுகாக்க/கவனித்துக்கொள்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “வைத்தார்” என்று மொழிபெயர்க்கப்பட்டுள்ள வினைச்சொல் “இளைப்பாறச் செய்தார்” அல்லது “குடியமர்த்தினார்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: யாவே தேவன்
  rationale: தெய்வீகப் பெயரான יהוה என்பதை ஒரு பட்டத்தால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்த்து, אֱלֹהִים என்பதை இயல்பான தமிழில் ‘தேவன்’ என்று வழங்குகிறது.
- source_word: הָאָדָם
  choice: மனிதனை
  rationale: இங்கு பொதுவாக மனிதகுலம் அல்ல, முன்பு உருவாக்கப்பட்ட தனிப்பட்ட மனிதனே குறிக்கப்படுகிறார். ‘மனிதன்’ என்பது தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: וַיִּקַּח
  choice: எடுத்து
  rationale: לקח என்ற வினையின் நேரடியான ‘எடுத்தார்’ என்ற பொருளைப் பாதுகாக்கிறது; செயலின் தன்மையை மொழிபெயர்ப்பிலேயே தேவையின்றி விரிவுபடுத்தவில்லை.
- source_word: וַיַּנִּחֵהוּ
  choice: அவனை அங்கே வைத்தார்
  rationale: நוח என்பதன் ஹிப்இல் வடிவம் ‘வைத்தல்/அமர்த்தல்’ என்றும் ‘இளைப்பாறச் செய்தல்/குடியமர்த்தல்’ என்றும் பொருள்படலாம். தோட்டத்திற்குள் வைக்கப்படும் இச்சூழலில் ‘வைத்தார்’ இயல்பான முதன்மைப் பொருள்; மற்ற நுண்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּגַן עֵדֶן
  choice: ஏதேன் தோட்டத்தில்
  rationale: எபிரெயக் கட்டமைப்பையும் ‘ஏதேன்’ என்ற இடப்பெயரையும் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: לְעָבְדָהּ
  choice: தோட்டத்தில் வேலை செய்யவும்
  rationale: עבד என்பது ‘வேலை செய்தல், பணிசெய்தல், பயிரிடுதல்’ ஆகிய பொருள்களைக் கொள்ளலாம். ‘வேலை செய்ய’ என்பது விவசாயப் பொருளுக்கு மட்டும் குறுக்காமல் அதன் விரிவான பொருளைப் பாதுகாக்கிறது.
- source_word: וּלְשָׁמְרָהּ
  choice: அதைக் காத்துக்கொள்ளவும்
  rationale: שמר என்பதிலுள்ள ‘காத்தல், பாதுகாத்தல், கவனித்துக்கொள்ளுதல்’ என்ற பொருள் வரம்பை ‘காத்துக்கொள்ள’ இயல்பாகத் தாங்குகிறது; வெறும் இராணுவக் காவல் என்ற குறுகிய எண்ணத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: ஏதேனில் மனிதனுக்குக் கொடுக்கப்பட்ட பணியின் தன்மை
  choice: தோட்டத்தில் வேலை செய்து அதைக் காத்துக்கொள்ளும் பொறுப்பாக வசனம் கூறுவதை மட்டும் மொழிபெயர்த்தல்
  alternative: இந்தச் சொற்களை முதன்மையாக ஆசாரியப் பணி மற்றும் பரிசுத்த இடக் காவலின் உருவகமாகவோ, முற்றிலும் விவசாயப் பணியாகவோ விளக்குதல்
  rationale: עבד, שמר ஆகிய வினைகள் விவசாயப் பணியையும் சேவை/காவல் நுண்பொருள்களையும் தாங்கக்கூடும். ஆனால் இவ்வசனமே ஒரு குறிப்பிட்ட பிற்கால இறையியல் வகைப்பாட்டை கட்டாயப்படுத்தவில்லை; ஆகவே மொழிபெயர்ப்பு அந்த விவாதத்தைத் தீர்மானிக்காமல் சொற்களின் பொதுவான பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதாகப் புரியக்கூடிய, அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘யாவே’ என்ற தனிப்பெயர் பாதுகாக்கப்பட்டுள்ளது. எபிரெய வினைகளின் விரிவான பொருள் வரம்பும் இறையியல் தெளிவின்மையும் முதன்மை உரை மற்றும் அடிக்குறிப்புகள் மூலம் தக்கவைக்கப்பட்டுள்ளன.
