  source_fidelity: 'முதன்மை உரை எபிரெய வாக்கியத்தின் பொருளை மொத்தத்தில் சரியாக வழங்குகிறது: யாவே தேவன் மனிதனை எடுத்து ஏதேன் தோட்டத்தில் வைத்தார்; தோட்டத்தை வேலைசெய்து காக்கும் நோக்கமும் தக்கவைக்கப்பட்டுள்ளது. எனினும், ‘தோட்டத்தில் வேலை செய்ய’ என்பது எபிரெயப் பிரதிப்பெயர் நேரடியாகத் தோட்டத்தையே குறிக்கும் நுணுக்கத்தை ஓரளவு மங்கலாக்குகிறது. ‘தோட்டத்தைப் பண்படுத்த’ என்பது இச்சூழலில் עבד-ன் இயல்பான வேளாண்மைப் பயன்பாட்டைத் தெளிவாக வழங்குகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.'
  naturalness: ‘மனிதனை எடுத்து’ மற்றும் ‘அவனை அங்கே வைத்தார்’ இயல்பானவை. நோக்கத் தொடரில் ‘தோட்டத்தைப் பண்படுத்தவும் அதைக் காத்துக்கொள்ளவும்’ என்பது நவீன பொதுத்தமிழில் அதிகத் துல்லியமாகவும் இயல்பாகவும் உள்ளது. அடிக்குறிப்பு குறியீடுகளை அவை விளக்கும் சொற்களுக்கருகில் வைப்பதும் வாசிப்பைத் தெளிவாக்குகிறது.
  terminology: ‘யாவே தேவன்,’ ‘மனிதன்,’ ‘ஏதேன் தோட்டம்,’ ‘காத்துக்கொள்ளுதல்’ ஆகியவை பொருத்தமானவை. ‘பண்படுத்துதல்’ இங்கு தோட்டத்தை உழுது பராமரிக்கும் பொருளில் இயல்பானது; அது சிறப்பான ஆசாரிய அல்லது இறையியல் விளக்கத்தைத் திணிக்கவில்லை.
