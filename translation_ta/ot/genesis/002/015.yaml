  rationale: திருத்தம் தோட்டத்தை நேரடிப் பொருளாகக் கொண்ட எபிரெய வினை வடிவத்தைத் தமிழில் வெளிப்படையாகக் காட்டுகிறது. עבד-ன் பரந்த ‘வேலைசெய்தல்’ நுண்பொருளும் שמר-ன் ‘பாதுகாத்தல்/கவனித்துக்கொள்ளல்’ நுண்பொருளும் அடிக்குறிப்பில் தொடர்ந்தும் வழங்கப்படுகின்றன. வாதத்திற்குரிய ஆசாரிய அல்லது உருவக விளக்கம் எதுவும் சேர்க்கப்படவில்லை.
