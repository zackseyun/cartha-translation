  text: וַ/יִּקְרָ֨א הָֽ/אָדָ֜ם שֵׁמ֗וֹת לְ/כָל הַ/בְּהֵמָה֙ וּ/לְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/לְ/כֹ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה וּ/לְ/אָדָ֕ם לֹֽא מָצָ֥א עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/020.yaml
  text: And the man gave names to all the livestock[a], to the birds of the sky, and to every wild animal[c][b], but for the man no helper corresponding to him was found.
translation:
  language: ta
  text: அந்த மனிதன்[a] எல்லா வளர்ப்பு விலங்குகளுக்கும், வானத்துப் பறவைகளுக்கும், எல்லா காட்டு விலங்குகளுக்கும் பெயர்களிட்டான். ஆனால் அந்த மனிதனுக்கு அவனுக்கு ஒத்த துணையாளர்[b] ஒருவரும் காணப்படவில்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆதாம் எல்லா ... பெயர்களிட்டான்; ஆனால் ஆதாமுக்கு ...”
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அவனுக்குப் பொருத்தமான துணை.”
    reason: lexical_alternative
  - marker: c
    text: எபிரெயில், “அவன் காணவில்லை”; எனவே, “ஆனால் அந்த மனிதன் தனக்கு ஒத்த துணையாளர் ஒருவரையும் காணவில்லை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם / לְאָדָם
  choice: அந்த மனிதன் / அந்த மனிதனுக்கு
  rationale: இரண்டு இடங்களிலும் தோட்டக் கதையில் வரும் குறிப்பிட்ட மனிதனையே குறிக்கிறது. முதல் இடத்தில் எபிரெய definite article இருப்பதால் பொதுவான ‘மனிதகுலம்’ என்பதற்குப் பதிலாக ‘அந்த மனிதன்’ பொருத்தமானது; ‘ஆதாம்’ என்பது சாத்தியமான மாற்று வாசிப்பு.
- source_word: וַיִּקְרָא ... שֵׁמוֹת
  choice: பெயர்களிட்டான்
  rationale: இந்த எபிரெய மரபுத்தொடர் பெயர்களை வழங்கும் செயலைக் குறிக்கிறது; தமிழில் ‘பெயர்களிட்டான்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַבְּהֵמָה
  choice: வளர்ப்பு விலங்குகள்
  rationale: இங்கு மனிதர்களால் வளர்க்கப்படும் விலங்குகளின் வகுப்பு குறிக்கப்படுகிறது; இது பின்னர் வரும் காட்டு விலங்குகளிலிருந்து அவற்றைத் தெளிவாக வேறுபடுத்துகிறது.
- source_word: עוֹף הַשָּׁמַיִם
  choice: வானத்துப் பறவைகள்
  rationale: எபிரெயச் சொல்லாட்சியின் வானம் சார்ந்த படிமத்தைப் பாதுகாக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  choice: எல்லா காட்டு விலங்குகள்
  rationale: வளர்ப்பு விலங்குகளுக்கு மாறாக வெளியில் வாழும் வளர்க்கப்படாத நிலவிலங்குகளை இச்சூழலில் இயல்பாகக் குறிக்கிறது.
- source_word: עֵזֶר
  choice: துணையாளர்
  rationale: உதவி செய்கிற ஒருவரைக் குறிக்கும் பெயர்ச்சொல். ‘துணையாளர்’ என்பது உறவுசார் சூழலில் இயல்பானது; மூலச்சொல் தாழ்ந்த நிலையை உணர்த்தாததால் அத்தகைய பொருளைச் சேர்க்கவில்லை.
- source_word: כְּנֶגְדּוֹ
  choice: அவனுக்கு இணையான
  rationale: ‘அவனுக்கு எதிரே/அவனோடு பொருந்தி நிற்கும்’ என்ற தொடர்பு மற்றும் ஒத்திசைவு நுட்பத்தைப் பாதுகாக்கிறது; ‘தகுந்த’ அல்லது ‘பொருத்தமான’ என்பதைக் காட்டிலும் மூலத்தின் உருவகத்திற்கு நெருக்கமானது.
- source_word: לֹא מָצָא
  choice: காணப்படவில்லை
  rationale: எபிரெயில் இலக்கணப்படி ‘அவன் காணவில்லை’ என்ற செயப்பாட்டு வடிவம் இருந்தாலும், தேடலின் முடிவாக அத்தகைய துணையாளர் இல்லாததைத் தமிழில் செயப்பாட்டு எதிர்மறை வடிவம் இயல்பாக வெளிப்படுத்துகிறது; மூல வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ஆதாம் என்ற சொல்லை பொதுப்பெயராகவா தனிப்பெயராகவா மொழிபெயர்ப்பது
  choice: அந்த மனிதன்
  alternative: ஆதாம்
  rationale: இந்த இடத்தில் தோட்டத்திலுள்ள குறிப்பிட்ட ஆண் மனிதன் குறிக்கப்படுகிறான்; முதல் பயன்பாட்டில் definite article இருப்பதால் பொதுப்பெயர் உணர்வு இன்னும் முன்னிலையில் உள்ளது. இருந்தாலும் தனிப்பெயர் போல் வாசிப்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: עֵזֶר כְּנֶגְדּוֹ என்பதன் உறவுசார் பொருள்
  choice: அவனுக்கு இணையான துணையாளர்
  alternative: அவனுக்குப் பொருத்தமான துணை
  rationale: மூலச்சொற்கள் உதவியையும் அவனுக்கு எதிர்நின்று பொருந்தும் இணைத்தன்மையையும் ஒருங்கே வெளிப்படுத்துகின்றன. இவ்வடிவம் கீழ்ப்படிதல் அல்லது தாழ்வு என்ற கருத்தைச் சேர்க்காமல் அந்தத் திறந்த நுட்பத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பெயர்களிட்டான்’, ‘வானத்துப் பறவைகள்’, ‘துணையாளர்’ ஆகியவை இயல்பான தமிழ் சொல்லோட்டத்தைத் தருகின்றன; அதேவேளை எபிரெய மூலத்தின் தொடர்பு நுட்பமும் செயப்பாட்டு/செயப்படுபாட்டு தெளிவின்மையும் அடிக்குறிப்புகள் மூலம் பாதுகாக்கப்பட்டுள்ளன.
