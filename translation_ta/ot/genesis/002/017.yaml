  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/מֵ/עֵ֗ץ הַ/דַּ֨עַת֙ ט֣וֹב וָ/רָ֔ע לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ כִּ֗י בְּ/י֛וֹם אֲכָלְ/ךָ֥ מִמֶּ֖/נּוּ מ֥וֹת תָּמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/017.yaml
  text: but from the tree of the knowledge of good and evil you shall not eat[a], for in the day you eat from it[b], you shall surely die.
translation:
  language: ta
  text: ஆனால் நன்மை தீமை பற்றிய அறிவின் மரத்திலிருந்து நீ உண்ணக் கூடாது[b]. ஏனெனில், அதிலிருந்து நீ உண்ணும் நாளில்[a] நீ நிச்சயமாகச் சாவாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயம்: “நீ அதிலிருந்து உண்ணும் நாளில்.” இந்த மொழிவழக்கு “நீ அதிலிருந்து உண்ணும்போது” என்றும் பொருள்படலாம்.'
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயச் சொற்றொடர் சொற்படியாக: “நன்மை தீமை பற்றிய அறிவின் மரத்திலிருந்து—நீ அதிலிருந்து உண்ணக் கூடாது.”'
    reason: source_structure
lexical_decisions:
- source_word: וּמֵעֵץ
  choice: ஆனால் … மரத்திலிருந்து
  rationale: வாவ் இணைப்பும் מִן முன்னொட்டும் சொற்படியாக ‘மரத்திலிருந்து’ எனப் பொருள்படும்; முந்தைய வசனத்தின் அனுமதிக்கு மாறான தடையைச் சூழல் காட்டுவதால், வாவ் ‘ஆனால்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: הַדַּעַת טוֹב וָרָע
  choice: நன்மை தீமை பற்றிய அறிவு
  rationale: דַּעַת என்பது ‘அறிவு/அறிதல்’ என்பதைக் குறிக்கிறது. טוֹב וָרָע என்ற இணை எதிர்ச்சொற்களின் நெறி மற்றும் பகுத்தறிவு சார்ந்த நிறையை ‘நன்மை தீமை’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: לֹא תֹאכַל
  choice: நீ உண்ணக் கூடாது
  rationale: மறுப்பு வினை வடிவத்தின் கட்டளைத் தடையை நவீனத் தமிழில் தெளிவாகவும் மதிப்புடனும் தெரிவிக்கிறது.
- source_word: מִמֶּנּוּ
  choice: அதிலிருந்து
  rationale: מִן முன்னிடைச்சொல்லின் ‘இலிருந்து’ என்ற பொருளைத் தக்கவைத்து, எபிரெய உரையில் வரும் மீளுரைப்பையும் இரண்டாவது வாக்கியத்தில் பிரதிபலிக்கிறது.
- source_word: בְּיוֹם אֲכָלְךָ
  choice: நீ உண்ணும் நாளில்
  rationale: எபிரெய காலவழக்கின் சொல் உருவத்தையும் அதன் விளக்கத் திறந்தநிலையையும் தக்கவைக்கிறது; அதை முதன்மை உரையில் வெறுமனே ‘உண்ணும்போது’ என்று தீர்மானிக்கவில்லை.
- source_word: מוֹת תָּמוּת
  choice: நீ நிச்சயமாகச் சாவாய்
  rationale: வினையெச்ச முழுவடிவமும் வரையறுக்கப்பட்ட வினையும் சேர்ந்த எபிரெய வலியுறுத்தல் மரணத்தின் உறுதியைத் தெரிவிக்கிறது; ‘நிச்சயமாக’ அந்த வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ‘நீ உண்ணும் நாளில்’ என்பதன் காலப் பொருளும் மரணத்தின் நிறைவேற்றமும்
  choice: எபிரெய மொழிவழக்கை ‘நீ உண்ணும் நாளில்’ என்று தக்கவைத்து, மரணம் உடனடியான உடல் மரணமா, மரணத்தன்மையின் தொடக்கமா, அல்லது உறுதியான மரணத் தீர்ப்பா என்பதைத் தீர்மானிக்காமல் விடுதல்
  alternative: ‘நீ அதிலிருந்து உண்ணும்போது’ என்று இயக்கநிகர்ப்பாக மொழிபெயர்த்தல் அல்லது அதே நாளில் உடனடி உடல் மரணம் என்று விளக்குதல்
  rationale: பின்வரும் கதையில் ஆதாம் அதே நாட்காட்டி நாளில் உடலால் இறப்பதாகச் சொல்லப்படாததால் உருவாகும் உண்மையான வேதவியல் இழுபறியை மொழிபெயர்ப்பு மறைத்துவிடக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மதிப்புடைய நடையைப் பயன்படுத்துகிறது. ‘அறிவின் மரம்’ என்ற சற்றே செறிவான அமைப்பு, மூலத்தின் பெயர்ச்சொல் வடிவத்தைக் காக்கிறது. ‘உண்ணும் நாளில்’ என்ற சொற்றொடர் திட்டமிட்டு விடப்பட்டதால், காலப் பொருள் குறித்த மூலத்தின் திறந்தநிலை நிலைக்கிறது.
