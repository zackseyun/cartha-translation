  yaml_path: translation/ot/genesis/002/022.yaml
  text: And the rib that the LORD God had taken from the man, he built into a woman, and he brought her to the man.
translation:
  language: ta
  text: யெகோவா தேவன் மனிதனிடமிருந்து எடுத்த விலா எலும்பை ஒரு பெண்ணாகக் கட்டியமைத்து, அவளை மனிதனிடம் அழைத்து வந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: கட்டியமைத்து
  rationale: எபிரெய வினைச்சொல்லின் அடிப்படைப் பொருள் ‘கட்டுதல்’; பெண்ணை உருவாக்கிய செயலை இயல்பான தமிழில் தெரிவிக்க ‘கட்டியமைத்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַצֵּלָע
  choice: விலா எலும்பை
  rationale: இச்சூழலில் மனிதனிடமிருந்து எடுக்கப்பட்ட உடற்பகுதியைக் குறிக்கிறது; பாரம்பரியமும் சூழலும் ஆதரிக்கும் ‘விலா எலும்பு’ தெளிவான தமிழ் வடிவம்.
- source_word: יְהוָה אֱלֹהִים
  choice: யெகோவா தேவன்
  rationale: தெய்வீகப் பெயரையும் אֱלֹהִים என்ற பட்டத்தையும் வேறுபடுத்திக் காக்கிறது; நவீன தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட வடிவம்.
- source_word: לְאִשָּׁה
  choice: ஒரு பெண்ணாக
  rationale: לְ முன்னொட்டு இங்கு உருவாக்கத்தின் விளைவைக் குறிக்கிறது; ‘பெண்ணாக’ என்பது அந்த மாற்றத்தை நேரடியாகக் காட்டுகிறது.
- source_word: הָאָדָם
  choice: மனிதன்
  rationale: இப்பகுதியில் சொல்லின் பொதுப்பொருளையும் குறிப்பிட்ட முதல் மனிதனைக் குறிக்கும் சூழலையும் பாதுகாக்க, தனிப்பெயரான ‘ஆதாம்’ என்பதற்குப் பதில் ‘மனிதன்’ பயன்படுத்தப்பட்டது.
- source_word: וַיְבִאֶהָ
  choice: அவளை ... அழைத்து வந்தார்
  rationale: பெண்ணைக் குறிக்கும் பெண்பால் பொருள் பின்னொட்டை வெளிப்படையாகக் காட்டி, இயக்கத்தையும் வருகையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: பெண்ணின் உருவாக்கத்தை விவரிக்கும் בנה என்ற வினைச்சொல்
  choice: கட்டியமைத்து
  alternative: உருவாக்கி / செய்து
  rationale: மூலத்தில் உள்ள ‘கட்டுதல்’ என்ற உருவகத்தை மறைக்காமல், தமிழில் கடினமாகத் தோன்றாத வடிவில் பாதுகாக்கப்பட்டது.
- issue: יהוה என்ற உடன்படிக்கைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: பெயரை பொதுப்பட்டமாக மாற்றாமல் தனிப்பெயராக வைத்திருக்கிறது; தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் எளிதில் புரியும் நடையில் அமைக்கப்பட்டது. எபிரெய வாக்கியத்தின் செயல்வரிசை—எடுத்தல், கட்டியமைத்தல், அழைத்து வருதல்—பாதுகாக்கப்பட்டுள்ளது.
