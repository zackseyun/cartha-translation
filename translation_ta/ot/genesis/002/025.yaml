source:
  edition: WLC
  text: וַ/יִּֽהְי֤וּ שְׁנֵי/הֶם֙ עֲרוּמִּ֔ים הָֽ/אָדָ֖ם וְ/אִשְׁתּ֑/וֹ וְ/לֹ֖א יִתְבֹּשָֽׁשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/025.yaml
  text: And the man and his wife were both naked[a], and they were not ashamed.
translation:
  language: ta
  text: அந்த மனிதனும் அவன் மனைவியும் இருவருமே நிர்வாணமாக இருந்தார்கள்[a]; அவர்கள் வெட்கப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், ‘அவர்கள் இருவரும் … நிர்வாணமாக’ என்று உள்ளது; அந்த இணையின் இருவருமே ஆடையின்றி இருந்ததை இச்சொல்லமைப்பு வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: இருந்தார்கள்
  rationale: இங்கு היה என்ற வினைச்சொல் நிலையைச் சுட்டும் இறந்தகாலக் கதையாடல் வடிவில் வருகிறது; எனவே ‘இருந்தார்கள்’ என்பது இயல்பான மொழிபெயர்ப்பு.
- source_word: שְׁנֵיהֶם
  choice: இருவருமே
  rationale: இந்தக் கூற்று அந்த இணையின் இருவருக்கும் பொருந்துவதை எபிரெயச் சொல் வலியுறுத்துகிறது; ‘இருவருமே’ அந்த வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: עֲרוּמִּים
  choice: நிர்வாணமாக
  rationale: இச்சொல் ஆடை அணியாத நிலையைக் குறிக்கிறது. ‘நிர்வாணமாக’ என்பது தெளிவான, கண்ணியமான நவீனத் தமிழ் வழக்கு.
- source_word: הָאָדָם
  choice: அந்த மனிதன்
  rationale: இங்கு குறிப்பிடப்படுபவர் ‘அவன் மனைவி’ என்பவருடன் இணைத்துச் சொல்லப்படும் தனிப்பட்ட ஆண்; ‘அந்த மனிதன்’ கதையின் குறிப்பிட்ட நபரைச் சுட்டுகிறது.
- source_word: וְאִשְׁתּוֹ
  choice: அவன் மனைவியும்
  rationale: மூன்றாம் ஆண்பால் ஒருமை உடைமை விகுதியுடன் வரும் אִשָּׁה இச்சூழலில் இயல்பாக ‘அவன் மனைவி’ என்று பொருள்படுகிறது.
- source_word: לֹא
  choice: இல்லை / -வில்லை
  rationale: தமிழில் வினைமுற்றுடன் இணையும் எதிர்மறை வடிவான ‘வெட்கப்படவில்லை’ எபிரெய எதிர்மறையை நேராக வெளிப்படுத்துகிறது.
- source_word: יִתְבֹּשָׁשׁוּ
  choice: வெட்கப்படவில்லை
  rationale: בוש என்ற வேரின் இவ்வடிவம் வெட்கத்தை அனுபவிப்பதைக் குறிக்கிறது; ‘வெட்கப்படவில்லை’ என்பது வெறும் சங்கடத்தைவிட ஆழமான ‘shame’ கருத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: இச்சூழலில் אָדָם என்பதன் மொழிபெயர்ப்பு
  choice: அந்த மனிதன்
  alternative: மனிதன் / மனித உயிர்
  rationale: வசனம் அவரை ‘அவன் மனைவி’ என்பவருடன் இணைத்துக் குறிப்பிடுவதால், இங்கு மனிதகுலம் பொதுவாக அல்லாமல் குறிப்பிட்ட ஆண் நபரே குறிக்கப்படுகிறார். ‘அந்த’ என்பது முன்பே அறிமுகமான அந்த நபரைத் தமிழில் இயல்பாகச் சுட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘இருவருமே’ மூலம் மூலமொழியின் வலியுறுத்தல் தக்கவைக்கப்பட்டுள்ளது; ‘வெட்கப்படவில்லை’ என்பது உளவியல் சங்கடம் என்ற குறுகிய பொருளுக்குள் கருத்தைச் சுருக்காமல் வெட்கம் என்ற முழுப் பொருளை வழங்குகிறது.
