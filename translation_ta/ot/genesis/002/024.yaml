  text: עַל כֵּן֙ יַֽעֲזָב אִ֔ישׁ אֶת אָבִ֖י/ו וְ/אֶת אִמּ֑/וֹ וְ/דָבַ֣ק בְּ/אִשְׁתּ֔/וֹ וְ/הָי֖וּ לְ/בָשָׂ֥ר אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/024.yaml
  text: Therefore a man shall leave his father and his mother and cling to his wife[b][a], and they shall become one flesh.
translation:
  language: ta
  text: ஆகையால், ஒரு மனிதன் தன் தந்தையையும் தாயையும் விட்டு, தன் மனைவியைப் பற்றிக்கொள்வான்[a]; அவர்கள் ஒரே மாம்சமாவார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உறுதியாக இணைந்திருப்பான்’ அல்லது ‘விடாமல் பற்றிக்கொள்வான்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை வலுவான, நீடித்த பற்றைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஒரே மாம்சம்’ என்பது உடல் ஒன்றிப்பையும் ஒரு புதிய உறவுப் பிணைப்பு உருவாவதையும் உள்ளடக்கும் எபிரெயச் சொற்றொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: இதனால்
  rationale: முந்தைய படைப்பு நிகழ்விலிருந்து பெறப்படும் முடிவையும் காரணத் தொடர்பையும் இயல்பான தமிழில் குறிக்கிறது.
- source_word: יַעֲזָב
  choice: விட்டு
  rationale: இங்குள்ள வினைவடிவம் நேரடிக் கட்டளையாக அல்லாமல் பொதுவான, நெறிசார்ந்த நிகழ்வாக வருகிறது. ‘கைவிட்டு’ என்பது தேவையற்ற புறக்கணிப்பு உணர்வைத் தரக்கூடும்.
- source_word: אִישׁ
  choice: ஒரு மனிதன்
  rationale: எபிரெய மூலத்தின் ஆண்பால் ஒருமையையும் திருமணச் சூழலில் அதன் பிரதிநிதித்துவப் பயன்பாட்டையும் காக்கிறது.
- source_word: אָבִיו ... אִמּוֹ
  choice: தன் தந்தையையும் தாயையும்
  rationale: ‘பெற்றோர்’ என்று தொகுக்காமல், மூலம் தனித்தனியாகக் குறிப்பிடும் தந்தை மற்றும் தாயை அப்படியே காக்கிறது.
- source_word: וְדָבַק
  choice: உறுதியாக இணைந்திருப்பான்
  rationale: דבק குறிக்கும் வலுவான பற்று அல்லது ஒட்டியிருத்தலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; வெறும் ‘சேர்வான்’ என்பதைக் காட்டிலும் அதன் தொடர்ச்சியும் வலிமையும் தெளிவாகின்றன.
- source_word: בְּאִשְׁתּוֹ
  choice: தன் மனைவியோடு
  rationale: இந்தத் திருமணச் சூழலில் אִשָּׁה என்பது பொதுவாக ஒரு பெண்ணை அல்ல, அவனுடைய மனைவியைக் குறிக்கிறது.
- source_word: וְהָיוּ
  choice: அவர்கள் ... ஆவார்கள்
  rationale: பன்மை வினையின் பொதுவான எதிர்கால அல்லது நெறிசார்ந்த தன்மையைத் தக்கவைத்து, ஒரு புதிய நிலைக்கு வருவதை ‘ஆவார்கள்’ தெரிவிக்கிறது.
- source_word: לְבָשָׂר אֶחָד
  choice: ஒரே மாம்சம்
  rationale: உடல் ஒன்றிப்பையும் புதிய உறவுப் பிணைப்பையும் உள்ளடக்கக்கூடிய எபிரெய உருவகத்தின் திறந்த அர்த்தத்தை விளக்கமாகச் சுருக்காமல் காக்கிறது.
theological_decisions:
- issue: திருமணக் கூற்றிலுள்ள ஆண்பால் பிரதிநிதித்துவ மொழி
  choice: ஒரு மனிதன்
  alternative: ஒருவர்
  rationale: மூலம் வெளிப்படையாக ஆண்பால் ஒருமையான אִישׁ என்பதைக் கொண்டிருப்பதால், பாலின வேறுபாட்டை மறைக்கும் பொதுமைப்படுத்தலைத் தவிர்க்கிறது.
- issue: கூற்றின் தன்மை
  choice: பொதுவான நெறிசார்ந்த நிகழ்வாக ‘இணைந்திருப்பான் ... ஆவார்கள்’
  alternative: நேரடிக் கட்டளை வடிவம்
  rationale: எபிரெய வினைகள் படைப்பு நிகழ்வை அடிப்படையாகக் கொண்ட பொதுக் கோட்பாட்டைத் தெரிவிக்கின்றன; மூலத்தில் இல்லாத நேரடிக் கட்டளையைச் சேர்க்கவில்லை.
- issue: ‘ஒரே மாம்சம்’ என்பதன் பொருள்
  choice: உருவகத்தை மொழிபெயர்ப்பில் அப்படியே காத்தல்
  alternative: உடலுறவு அல்லது குடும்பப் பிணைப்பு என்று ஒரே பொருளாக விளக்குதல்
  rationale: இந்தச் சொற்றொடரில் உடல் ஒன்றிப்பும் புதிய உறவுப் பிணைப்பும் இரண்டும் ஒலிக்கக்கூடும்; அவற்றில் ஒன்றை மட்டும் தேர்ந்தெடுத்து இறையியல் அழுத்தத்தைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘தகப்பன்’ என்பதற்குப் பதில் பொதுப் பயன்பாட்டிலுள்ள ‘தந்தை’ பயன்படுத்தப்பட்டது. ‘ஒரே மாம்சம்’ என்ற மரபுச் சொற்றொடர் அதன் பல அடுக்குப் பொருளையும் இறையியல் பதற்றத்தையும் காக்கும் வகையில் விடப்பட்டுள்ளது; அதன் பொருள் அடிக்குறிப்பில் சுருக்கமாக விளக்கப்படுகிறது.
