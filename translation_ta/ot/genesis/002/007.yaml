source:
  edition: WLC
  text: וַ/יִּיצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים אֶת הָֽ/אָדָ֗ם עָפָר֙ מִן הָ֣/אֲדָמָ֔ה וַ/יִּפַּ֥ח בְּ/אַפָּ֖י/ו נִשְׁמַ֣ת חַיִּ֑ים וַֽ/יְהִ֥י הָֽ/אָדָ֖ם לְ/נֶ֥פֶשׁ חַיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/007.yaml
  text: Then Yahweh God formed the man from the dust of the ground[a], and breathed into his nostrils the breath of life[b], and the man became a living creature.
translation:
  language: ta
  text: பின்பு யாவே தேவன் நிலத்தின் புழுதியிலிருந்து மனிதனை உருவாக்கி, அவனுடைய நாசிகளில் உயிர்மூச்சை ஊதினார். அப்போது அந்த மனிதன் உயிருள்ள உயிரினமாக ஆனான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயிருள்ள உயிராக ஆனான்”; பாரம்பரிய மொழிபெயர்ப்பு, “உயிருள்ள ஆத்துமாவானான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: யாவே தேவன்
  rationale: தனிப்பட்ட இறைப்பெயரான יְהוָה என்பதை ‘யாவே’ என்று ஒலிபெயர்த்து, அடுத்துள்ள பொதுப் பட்டமான אֱלֹהִים என்பதை ‘தேவன்’ என்று வழங்குகிறது.
- source_word: וַיִּיצֶר
  choice: உருவாக்கி
  rationale: יצר என்பது குயவன் வடிவமைப்பதுபோன்ற கைக்கூடிய உருவாக்குதலைக் குறிக்கிறது; ‘உருவாக்கி’ என்பது அந்தச் செயற்படிமத்தை இயல்பான தமிழில் தருகிறது.
- source_word: הָאָדָם
  choice: மனிதனை / அந்த மனிதன்
  rationale: இங்கு குறிப்பிட்ட தனி மனிதரே கதைப்பொருளாக இருப்பதால் ‘மனிதன்’ பொருத்தமானது; ‘அந்த’ என்பது இரண்டாம் குறிப்பில் எபிரெய வரையறைச் சுட்டையும் தொடர்ச்சியையும் இயல்பாகக் காட்டுகிறது.
- source_word: עָפָר מִן־הָאֲדָמָה
  choice: நிலத்தின் புழுதியிலிருந்து
  rationale: עָפָר என்பதன் புழுதி/தளர்ந்த மண் என்ற காட்சியையும் אֲדָמָה என்பதன் நிலம் என்ற பொருளையும் காக்கிறது. எபிரெயத்தின் சுருக்கமான பொருள்-அடைமொழி அமைப்பு தமிழில் இயல்பாக இருக்க ‘இலிருந்து’ பயன்படுத்தப்படுகிறது.
- source_word: בְּאַפָּיו
  choice: அவனுடைய நாசிகளில்
  rationale: உடல்சார்ந்த தெளிவைத் தக்கவைத்து, இரு நாசித்துளைகளைக் குறிக்கும் எபிரெய வழக்கை சுருக்கமான நவீன தமிழில் வழங்குகிறது.
- source_word: נִשְׁמַת חַיִּים
  choice: உயிர்மூச்சை
  rationale: ‘உயிரை அளிக்கும் மூச்சு/உயிரின் மூச்சு’ என்ற சொற்றொடரின் கருத்தை இயல்பாகவும் செறிவாகவும் தருகிறது; חַיִּים என்ற எபிரெயப் பன்மையை செயற்கையாகப் பிரதிபலிக்கவில்லை.
- source_word: לְנֶפֶשׁ חַיָּה
  choice: உயிருள்ள ஓர் உயிரினமானான்
  rationale: נֶפֶשׁ இங்கு உடலிலிருந்து பிரிந்த பொருளற்ற ‘ஆத்துமா’ என்று அவசியம் குறிக்காமல், முழுமையான உயிருள்ள ஜீவியைக் குறிக்கிறது. ‘உயிரினம்’ என்பது இதே எபிரெயச் சொற்றொடர் விலங்குகளுக்கும் பயன்படுவதைக் காக்கிறது.
theological_decisions:
- issue: הָאָדָם என்பதன் தனிமனித மற்றும் மனிதகுலப் பரப்பு
  choice: மனிதன்
  alternative: மனித உயிர் / மனிதகுலம்
  rationale: இக்கதைநிலையில் உருவாக்கப்படும் குறிப்பிட்ட தனிமனிதரே நேரடிக் குறிப்பாக உள்ளார். அதேவேளையில் ‘மனிதன்’ என்ற தமிழ் சொல் அவரது மனிதகுலப் பிரதிநிதித்துவத்தை முற்றிலும் நீக்குவதில்லை.
- issue: לְנֶפֶשׁ חַיָּה என்பதன் மனித இயல்பியல் பொருள்
  choice: உயிருள்ள ஓர் உயிரினம்
  alternative: உயிருள்ள ஓர் உயிர்; பாரம்பரியமாக, உயிருள்ள ஆத்துமா
  rationale: உரை மனிதன் தனியே ஓர் ‘ஆத்துமாவைப் பெற்றான்’ என்று சொல்லாமல், அவன் உயிருள்ள நֶפֶשׁ ஆனான் என்று கூறுகிறது. ஆகவே உடல்–ஆத்துமா இருமையை உரைக்குள் முன்கூட்டியே புகுத்தாமல், முழு உயிருள்ள ஜீவியைக் குறிக்கும் மொழி தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘யாவே’ இறைப்பெயரை வெளிப்படையாகக் காக்கிறது. ‘உயிர்மூச்சு’ வாசிப்புக்கு எளிதான கூட்டுச்சொல்; ‘உயிரினம்’ சிறிது உயிரியல் நிழல் கொண்டிருந்தாலும், נֶפֶשׁ חַיָּה என்பதன் முழு உயிருள்ள ஜீவி என்ற பரப்பையும் விலங்குகளுடனான சொற்பயன்பாட்டு தொடர்பையும் தெளிவாகப் பாதுகாக்கிறது.
