source:
  edition: WLC
  text: וְ/כֹ֣ל שִׂ֣יחַ הַ/שָּׂדֶ֗ה טֶ֚רֶם יִֽהְיֶ֣ה בָ/אָ֔רֶץ וְ/כָל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה טֶ֣רֶם יִצְמָ֑ח כִּי֩ לֹ֨א הִמְטִ֜יר יְהוָ֤ה אֱלֹהִים֙ עַל הָ/אָ֔רֶץ וְ/אָדָ֣ם אַ֔יִן לַֽ/עֲבֹ֖ד אֶת הָֽ/אֲדָמָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/005.yaml
  text: No shrub of the field was yet on the earth[a], and no plant of the field had yet sprung up, because Yahweh God had not caused it to rain on the earth[c][b], and there was no man to work the ground.
translation:
  language: ta
  text: வயலின் புதர் எதுவும் இன்னும் பூமியில் இருக்கவில்லை[a]; வயலின் செடி எதுவும் இன்னும் முளைக்கவில்லை. ஏனெனில் யாவே தேவன் பூமியின்மேல் மழை பெய்யச் செய்திருக்கவில்லை[b]; நிலத்தைப் பண்படுத்த மனிதர் எவரும் இல்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வயலின் புதர்ச்செடி.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் இறைப்பெயர் יהוה (யாவே) வருகிறது; மரபாக, “கர்த்தராகிய தேவன்” என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “மண்ணைப் பயிரிட மனிதர் எவரும் இல்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂיחַ הַשָּׂדֶה
  choice: வயல்வெளியின் புதர்ச்செடி
  rationale: שִׂיחַ என்பது பொதுவான செடியைவிட புதர் அல்லது புதர்ச்செடியைக் குறிக்கிறது. அடுத்துள்ள עֵשֶׂב என்பதிலிருந்து வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: טֶרֶם יִהְיֶה בָאָרֶץ
  choice: இன்னும் பூமியில் இருக்கவில்லை
  rationale: טֶרֶם என்பது ‘இன்னும் இல்லை’ என்ற காலப்பொருளைத் தருகிறது; בָאָרֶץ படைப்புச் சூழலில் ‘பூமியில்’ என இயல்பாக வருகிறது.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: வயல்வெளியின் செடி
  rationale: עֵשֶׂב புல்வகை அல்லது மென்மையான தாவர வளர்ச்சியைப் பரந்த முறையில் குறிக்கலாம். ‘செடி’ என்பது பொருளை மிகையாகக் குறுக்காமல் நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: טֶרֶם יִצְמָח
  choice: இன்னும் முளைக்கவில்லை
  rationale: צמח என்பதன் வளர்ந்து வெளிப்படுதல் அல்லது முளைத்தல் என்ற பொருளை ‘முளைக்கவில்லை’ நேரடியாக வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இங்கு முந்தைய நிலைக்கான காரணத்தை அறிமுகப்படுத்துவதால் காரண இணைப்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: הִמְטִיר
  choice: மழை பெய்யச் செய்திருக்கவில்லை
  rationale: מטר என்பதன் ஹிஃபீல் வடிவிலுள்ள காரணவினைப் பொருளை ‘பெய்யச் செய்தல்’ பாதுகாக்கிறது.
- source_word: יְהוָה אֱלֹהִים
  choice: யாவே தேவன்
  rationale: יְהוָה என்ற தனிப்பெயரை ‘யாவே’ என ஒலிபெயர்த்து, אֱלֹהִים என்பதை ‘தேவன்’ என வழங்குகிறது.
- source_word: וְאָדָם אַיִן
  choice: மனிதன் எவனும் இருக்கவில்லை
  rationale: אָדָם இங்கு நிலத்தைப் பண்படுத்தக்கூடிய மனிதன் இல்லாமையைப் பிரதிநிதித்துவ ஒருமையில் குறிக்கிறது. ‘மனிதன் எவனும்’ என்பது பாலினத்தைத் தேவையின்றி முன்னிறுத்தாமல் ஒருமை அமைப்பைத் தக்கவைக்கிறது.
- source_word: לַעֲבֹד אֶת הָאֲדָמָה
  choice: நிலத்தைப் பண்படுத்த
  rationale: עבד இச்சூழலில் உழைத்தல் அல்லது பயிரிடுதல் என்றும் אֲדָמָה பயிரிடத்தக்க நிலம் என்றும் பொருள்படும். ‘பண்படுத்த’ என்பது குறிப்பிட்ட உழவுமுறையைத் திணிக்காமல் கருத்தைத் தருகிறது.
- source_word: הָאָרֶץ / הָאֲדָמָה
  choice: பூமி / நிலம்
  rationale: אֶרֶץ என்ற பரந்த பூமி/நிலப்பரப்புக்கும் אֲדָמָה என்ற பண்படுத்தப்படும் மண்ணுக்கும் இடையிலான எபிரெய வேறுபாட்டைப் பாதுகாக்க இரண்டு வேறு தமிழ்ச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக வருவதால் அதை பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- issue: אָדָם என்பதன் சூழல்சார் பொருள்
  choice: மனிதன் எவனும்
  alternative: ஆண் எவனும்
  rationale: இங்கு வலியுறுத்தப்படுவது மனிதப் பயிரிடுபவர் இல்லாமையே; உயிரியல் ஆண்பாலைக் குறிப்பாக வலியுறுத்தவில்லை. ஆகவே மூலத்தின் பிரதிநிதித்துவ ஒருமையும் பரந்த மனிதப் பொருளும் தக்கவைக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. שִׂיחַ மற்றும் עֵשֶׂב, அத்துடன் אֶרֶץ மற்றும் אֲדָמָה ஆகிய சொல் வேறுபாடுகள் இயன்றவரைத் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன; மூலத்தில் இல்லாத தொடக்க உரையாடல் இணைப்புச் சொல் சேர்க்கப்படவில்லை.
