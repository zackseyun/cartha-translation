  to: 'பின்பு யாவே தேவன் சொன்னார்: “மனிதன் தனியாக இருப்பது நல்லதல்ல. அவனுக்குப் பொருத்தமான உதவித் துணையை[a] நான் உண்டாக்குவேன்.”'
  rationale: The revision restores the explicit help/aid component of עֵזֶר in the main text, while retaining the corresponding/suitable sense of כְּנֶגְדּוֹ. It also relocates the footnote marker to the phrase under discussion. No theological hierarchy is introduced.
