id: GEN.2.18
reference: Genesis 2:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְהוָ֣ה אֱלֹהִ֔ים לֹא ט֛וֹב הֱי֥וֹת הָֽ/אָדָ֖ם לְ/בַדּ֑/וֹ אֶֽעֱשֶׂהּ לּ֥/וֹ עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/018.yaml
  text: Then Yahweh God said[a], “It is not good for the man to be alone. I will make a helper corresponding to him.”
translation:
  language: ta
  text: 'பின்பு யாவே தேவன் சொன்னார்: “மனிதன் தனியாக இருப்பது நல்லதல்ல. அவனுக்குப் பொருத்தமான உதவித் துணையை[a] நான் உண்டாக்குவேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனுக்கு ஒத்த உதவித் துணை,” “அவனுக்கு ஏற்ற உதவித் துணை,” அல்லது “அவனுடன் பொருந்தும் உதவித் துணை” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் வெறும் கீழ்நிலை உதவியாளரைக் குறிக்காமல், அவனுக்கு இணையாகப் பொருந்துகிற ஒருவரைக் குறிக்கிறது.
    reason: עֵזֶר כְּנֶגְדּוֹ என்பதன் மாற்று மொழிபெயர்ப்புகளையும், உதவி மற்றும் ஒத்திசைவு என்ற உறவுசார் நுணுக்கத்தையும் விளக்குகிறது.
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: யாவே தேவன்
  rationale: தனிப்பட்ட இறைப்பெயரான יְהוָה என்பதை ‘யாவே’ என ஒலிபெயர்த்து, אֱלֹהִים என்பதை இயல்பான தமிழில் ‘தேவன்’ என வழங்குகிறது.
- source_word: וַיֹּאמֶר
  choice: பின்பு ... சொன்னார்
  rationale: வாவ் தொடர் உரையின் முன்னேற்றத்தைத் தெரிவிப்பதால் ‘பின்பு’ இயல்பாகச் சேர்க்கப்பட்டுள்ளது; சொல்லின் மையப் பொருள் ‘சொன்னார்’.
- source_word: לֹא טוֹב הֱיוֹת הָאָדָם לְבַדּוֹ
  choice: மனிதன் தனியாக இருப்பது நல்லதல்ல
  rationale: எபிரெய வாக்கியத்தின் மதிப்பீட்டையும் தனிமை நிலையையும் நேரடியாகவும் இயல்பான தமிழிலும் காக்கிறது. இங்கு הָאָדָם தோட்டத்தில் உள்ள குறிப்பிட்ட மனிதனைக் குறிக்கிறது.
- source_word: אֶעֱשֶׂה־לּוֹ
  choice: அவனுக்கு ... நான் உண்டாக்குவேன்
  rationale: முதல் நபர் முற்றுப்பெறாத வினை இறை நோக்கத்தை வெளிப்படுத்துகிறது; לּוֹ என்பதன் நன்மை/உறவுப் பொருளை ‘அவனுக்கு’ காக்கிறது.
- source_word: עֵזֶר
  choice: துணை
  rationale: உதவி வழங்கும் ஒருவரைக் குறிக்கிறது. தமிழில் ‘துணை’ என்பது வெறும் கீழ்நிலை உதவியாளரைச் சுட்டாமல் உறவுசார் உதவியையும் இணைநிலையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כְּנֶגְדּוֹ
  choice: அவனுக்குப் பொருத்தமான
  rationale: அவனுக்கு எதிரே இருந்து, அவனுடன் ஒத்துப்போகும் அல்லது அவனுக்கு இணையாகப் பொருந்தும் ஒருவரைச் சுட்டும் சொற்றொடரின் உறவுசார் கருத்தை வாசிக்க இயல்பான தமிழில் தருகிறது; மாற்று நுணுக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: הָאָדָם என்பதன் சூழல்சார் பொருள்
  choice: மனிதன்
  alternative: ஆண்; மனிதகுலம்
  rationale: இங்கு தோட்டத்தில் உருவாக்கப்பட்ட தனிப்பட்ட மனிதனே நேரடியாகக் குறிக்கப்படுகிறார். ‘மனிதன்’ என்பது அந்த ஒருமையையும் மனித அடையாளத்தையும் காக்கிறது; ‘மனிதகுலம்’ என்று பொதுமைப்படுத்துவதில்லை.
- issue: עֵזֶר כְּנֶגְדּוֹ என்பதில் படிநிலை அர்த்தம் உள்ளதா
  choice: அவனுக்குப் பொருத்தமான ஒரு துணை
  alternative: அவனுக்கு ஒத்த ஒரு துணை; அவனுக்கு எதிர்நிற்கும் துணை; அவனுக்கு ஏற்ற உதவியாளர்
  rationale: எபிரெயம் தாழ்வு அல்லது மேலாதிக்கத்தைத் தானாகக் கூறவில்லை. ‘துணை’ மற்றும் ‘பொருத்தமான’ என்ற தேர்வு உதவியையும் பரஸ்பரப் பொருத்தத்தையும் வெளிப்படுத்தி, பின்னைய சமூக அல்லது சமய முடிவுகளை வசனத்திற்குள் புகுத்தாமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘யாவே’ என்ற இறைப்பெயர் தக்கவைக்கப்பட்டுள்ளது. ‘துணை’ என்பது இயல்பான தமிழையும் எபிரெயத்தின் படிநிலைத் தீர்மானமின்மையையும் காக்கிறது.
