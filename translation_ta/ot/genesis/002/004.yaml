base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/004.yaml
  text: These are the generations of the heavens and the earth when they were created[c][b][a], in the day that Yahweh God made the earth and the heavens.
translation:
  language: ta
  text: 'வானங்களுக்கும் பூமிக்கும் உண்டான தோற்ற வரலாறு[a] இதுவே: அவை படைக்கப்பட்டபோது—யாவே[c] தேவன் பூமியையும் வானங்களையும் உண்டாக்கிய நாளில்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் தோதெலோத் (תּוֹלְדוֹת); ‘தலைமுறைகள்,’ ‘வரலாறு,’ ‘கணக்கு,’ அல்லது ‘தோற்றங்கள்’ என்றும் பொருள்படலாம். ஆதியாகமத்தில் இது ஒரு புதிய பகுதியை அறிமுகப்படுத்தும் தொடராக அடிக்கடி வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நாளில்’ என்ற எபிரெயச் சொற்றொடர் இங்கு ‘போது’ அல்லது ‘அந்தக் காலத்தில்’ என்ற பொருளிலும் பயன்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் இறைப்பெயர் YHWH (יהוה); பாரம்பரியமாக ‘கர்த்தர்’ என்று வழங்கப்படுகிறது. இங்கு அது ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה תוֹלְדוֹת
  choice: அவற்றின் தோற்ற வரலாறு இதுவே
  rationale: எபிரெயச் சொற்றொடரின் பன்மைச் சுட்டையும், ஆதியாகமப் பகுதிகளை அறிமுகப்படுத்தும் תוֹלְדוֹת என்ற சூத்திரத்தின் ‘தோற்றம்/வரலாறு’ சார்ந்த விரிந்த பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַשָּׁמַיִם וְהָאָרֶץ
  choice: வானங்களும் பூமியும்
  rationale: שָׁמַיִם என்பதன் எபிரெய பன்மை வடிவத்தை ‘வானங்கள்’ என்று காத்து, படைக்கப்பட்ட முழு ஒழுங்கைக் குறிக்கும் இணைச்சொற்றொடரைப் பாதுகாக்கிறது.
- source_word: בְּהִבָּרְאָם
  choice: படைக்கப்பட்டபோது
  rationale: ב முன்னொட்டின் காலப் பொருளையும் ברא வினையின் நிஃபால் செயப்பாட்டு வலிமையையும் தெளிவாகத் தருகிறது.
- source_word: בְּיוֹם עֲשׂוֹת
  choice: உண்டாக்கிய நாளில்
  rationale: ‘நாளில்’ என்ற எபிரெய மொழிநடையைத் தக்கவைத்துள்ளது; இங்கு அது ஒரு 24 மணிநேர நாளை அவசியமாகக் குறிக்காமல் ‘அப்போது/அந்தக் காலத்தில்’ என்று பொருள்படலாம் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: יְהוָה אֱלֹהִים
  choice: யாவே தேவன்
  rationale: יהוה என்ற தனிப்பெயரை பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்த்து, אֱלֹהִים என்பதற்கு தமிழில் நிலைபெற்ற ‘தேவன்’ என்பதைக் கொடுக்கிறது.
- source_word: אֶרֶץ וְשָׁמָיִם
  choice: பூமியையும் வானங்களையும்
  rationale: முந்தைய இணையின் தலைகீழ் சொல் வரிசையைப் பாதுகாத்து, எபிரெயச் சொற்களின் குறித்த பொருளைத் தமிழில் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் நான்கு எழுத்து இறைப்பெயரை ஒரு பட்டப்பெயரால் மறைக்காமல், பரவலாக ஏற்கப்படும் மறுகட்டமைக்கப்பட்ட உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கிறது; பழைய மாற்றுகளை அடிக்குறிப்பில் தெரிவிக்கிறது.
- issue: תוֹלְדוֹת என்பதன் பொருள்
  choice: தோற்ற வரலாறு
  alternative: தலைமுறைகள்; வரலாற்றுக் குறிப்பு; தோற்றங்கள்
  rationale: இங்கு வானங்களுக்கும் பூமிக்கும் உயிரியல் ‘தலைமுறைகள்’ என்ற நேரடிப் பொருள் இயல்பாக இல்லை. ஆதியாகமத்தில் பகுதி அறிமுகச் சூத்திரமாக வரும் சொல்லின் தோற்றம் மற்றும் தொடரும் வரலாறு ஆகிய இரு பரிமாணங்களையும் ‘தோற்ற வரலாறு’ வெளிப்படுத்துகிறது; உண்மையான சொற்பொருள் விரிவு அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: בְּיוֹם என்ற காலச் சொற்றொடர்
  choice: நாளில்
  alternative: போது; அந்தக் காலத்தில்
  rationale: மூலத்தின் இலக்கிய வடிவத்தை முதன்மை உரையில் காக்கிறது; அது கட்டாயமாக ஒரு நாளின் அளவை நிர்ணயிக்காது என்ற மொழியியல் நெகிழ்வை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த நிகழ்வுரைக்கான தலைப்பாகச் செயல்படுவதால் இறுதியில் நீள்கோடு இடப்பட்டுள்ளது. ‘வானங்கள்’ என்ற பன்மையும் இறுதி இணையின் தலைகீழ் வரிசையும் மூலத்தை நெருக்கமாகப் பின்பற்றுகின்றன.
