  yaml_path: translation/ot/genesis/002/010.yaml
  text: A river flowed out of Eden to water the garden[a], and from there it divided and became four headwaters.
translation:
  language: ta
  text: ஒரு ஆறு தோட்டத்துக்குத் தண்ணீர் பாய்ச்சுவதற்காக ஏதேனிலிருந்து புறப்பட்டு ஓடியது. அங்கிருந்து அது பிரிந்து நான்கு முதன்மைக் கிளைகளாயிற்று[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “நான்கு தலைகள்.” இங்கு இந்தச் சொல் ஆற்றின் நான்கு முதன்மைப் பிரிவுகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהָר
  choice: ஒரு ஆறு
  rationale: נָהָר என்பது ‘ஆறு’ என்று பொருள். வாக்கியத் தொடக்கத்திலுள்ள וְ சூழலின் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் தேவையற்ற ‘இப்போது’ அல்லது கட்டாயமான ‘மேலும்’ என்பதைக் கூட்டாமல் இயல்பாக விடப்பட்டுள்ளது.
- source_word: יֹצֵא מֵעֵדֶן
  choice: ஏதேனிலிருந்து புறப்பட்டு ஓடியது
  rationale: יצא என்ற வினையின் பங்கேற்பு வடிவம் தொடர்ந்து வெளியேறிச் செல்லும் செயலைக் காட்டுகிறது. ஆற்றைப் பற்றிய தமிழில் ‘புறப்பட்டு ஓடியது’ என்பது மூலத்திலிருந்து வெளிப்பட்டுப் பாய்ந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: לְהַשְׁקוֹת אֶת־הַגָּן
  choice: தோட்டத்துக்குத் தண்ணீர் பாய்ச்சுவதற்காக
  rationale: לְ உடன் வரும் வினையெச்சம் நோக்கத்தைக் குறிக்கிறது. שׁקה என்பதற்கு இச்சூழலில் ‘தண்ணீர் பாய்ச்சுதல்’ என்பது தெளிவான, தொழில்நுட்பச் சுமையற்ற தமிழ்.
- source_word: וּמִשָּׁם יִפָּרֵד
  choice: அங்கிருந்து அது பிரிந்து
  rationale: מִשָּׁם என்பது ‘அங்கிருந்து’; פרד என்பதன் நிபால் வடிவம் ஆறு தானாகப் பிரிவதை அல்லது பிரிக்கப்பட்ட நிலையை அனுமதிக்கிறது. ‘அது பிரிந்து’ இந்த இயல்பான இருமையைத் தேவையின்றி தீர்க்காமல் காக்கிறது.
- source_word: וְהָיָה לְאַרְבָּעָה רָאשִׁים
  choice: நான்கு முதன்மைக் கிளைகளாயிற்று
  rationale: היה விளைவான நிலையைச் சுட்டுவதால் ‘ஆயிற்று’ என மொழிபெயர்க்கப்பட்டது. רָאשִׁים என்பதன் நேர்ப்பொருள் ‘தலைகள்’; ஆற்றுச் சூழலில் வாசகருக்குப் புரியும்படி ‘முதன்மைக் கிளைகள்’ என வழங்கி, நேர்ப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
