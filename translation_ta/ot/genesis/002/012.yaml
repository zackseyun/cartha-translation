  source_fidelity: 'எபிரெய மூலத்தின் பொருள் துல்லியமாகத் தரப்பட்டுள்ளது: குறிப்பிட்ட நாட்டின் தங்கம் நல்ல தரமுடையது என்றும், அங்கே பிடெல்லியமும் ஓனிக்ஸ் கல்லும் உள்ளன என்றும் உரை தெரிவிக்கிறது. שָׁם என்பதன் இடக்குறிப்பு ‘அங்கே’ எனவும், אֶבֶן என்பதன் வெளிப்படையான ‘கல்’ என்பதும் பாதுகாக்கப்பட்டுள்ளன.'
