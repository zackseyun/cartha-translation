  terminology: உறுதியற்ற பொருளடையாளங்களான בְּדֹלַח மற்றும் שֹׁהַם ஆகியவற்றுக்கு முறையே ஒலிபெயர்ப்பு/மரபான பெயர் பயன்படுத்தப்பட்டு, அடிக்குறிப்புகளில் ஐயம் சரியாகப் பாதுகாக்கப்பட்டுள்ளது. ‘ஓனிக்ஸ் கல்’ எபிரெய אֶבֶן-ஐப் பிரதிபலிக்கிறது. அடிக்குறிப்பு குறியீடுகள் உரையில் சரியான பொருட்களோடு இணைக்கப்பட்டுள்ளன.
