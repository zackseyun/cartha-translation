  register: நவீன பொதுத்தமிழில், எளிமையும் கண்ணியமும் கொண்ட உரை. உறுதியாக அடையாளம் காணப்படாத இரு பொருட்களுக்கும் ஒலிபெயர்ப்பு அல்லது மரபான அடையாளம் முதன்மை உரையில் வைக்கப்பட்டு, உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
