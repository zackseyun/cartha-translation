source:
  edition: WLC
  text: וּֽ/זֲהַ֛ב הָ/אָ֥רֶץ הַ/הִ֖וא ט֑וֹב שָׁ֥ם הַ/בְּדֹ֖לַח וְ/אֶ֥בֶן הַ/שֹּֽׁהַם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/012.yaml
  text: And the gold of that land is good[b][a]; bdellium and onyx stone are there.
translation:
  language: ta
  text: அந்த நாட்டின் தங்கம் தரமானது; அங்கே பிடெல்லியம்[a] மற்றும் ஓனிக்ஸ் கல்[b] கிடைக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பிடெல்லியம்’ என்பது ஒருவகை நறுமணப் பிசினைக் குறிக்கலாம்; இதற்கான எபிரெயச் சொல்லின் துல்லியமான பொருள் உறுதியில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘ஓனிக்ஸ்’ என்பதற்குப் பதிலாக ‘பெரில்’ போன்ற வேறொரு விலையுயர்ந்த கல்லையும் இது குறிக்கலாம்; שֹׁהַם என்ற எபிரெயச் சொல்லால் குறிக்கப்படும் கல் எது என்பது உறுதியில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזֲהַב הָאָרֶץ הַהִוא
  choice: அந்த நாட்டின் தங்கம்
  rationale: וְ முந்தைய வசனத்துடன் இவ்வாக்கியத்தை இணைக்கிறது; தமிழில் தொடர்ச்சியான உரைநடையில் தனியாக ‘மேலும்’ சேர்க்காமல் இயல்பாக இணைக்க முடிகிறது. הָאָרֶץ הַהִוא என்பது முந்தைய வசனத்தில் கூறப்பட்ட அவிலா நாட்டைக் குறிக்கிறது.
- source_word: טוֹב
  choice: தரமானது
  rationale: இங்கு טוֹב தங்கத்தின் தரத்தை மதிப்பிடுகிறது. ‘நல்லது’ என்பதைவிட ‘தரமானது’ நவீன தமிழில் இப்பொருளைத் தெளிவாகவும் மிகைவிளக்கமின்றியும் தெரிவிக்கிறது.
- source_word: שָׁם
  choice: அங்கே … கிடைக்கின்றன
  rationale: שָׁם என்பதன் இடப்பொருளை ‘அங்கே’ நேரடியாகத் தருகிறது; தொடர்ந்து வரும் இரண்டு பொருட்களும் அங்கு காணப்படுகின்றன என்பதை இயல்பான தமிழில் ‘கிடைக்கின்றன’ தெரிவிக்கிறது.
- source_word: הַבְּדֹלַח
  choice: பிடெல்லியம்
  rationale: குறிக்கப்படும் பொருள் உறுதியாக அடையாளம் காணப்படாததால், மணமுள்ள பிசின் என்று தீர்மானித்துவிடாமல் மரபான பெயரை ஒலிபெயர்த்துள்ளது.
- source_word: וְאֶבֶן הַשֹּׁהַם
  choice: மற்றும் ஓனிக்ஸ் கல்
  rationale: אֶבֶן என்பதைக் ‘கல்’ என்று வெளிப்படையாகத் தருகிறது. שֹׁהַם என்பதற்கு மரபாக ‘ஓனிக்ஸ்’ பயன்படுத்தப்பட்டாலும், கனிமத்தின் துல்லியமான அடையாளம் உறுதியல்ல; அதனை அடிக்குறிப்பு சுட்டுகிறது.
