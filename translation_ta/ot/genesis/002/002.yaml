base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/002.yaml
  text: By the seventh day God had finished his work that he had done[a], and he rested on the seventh day from all his work that he had done.
translation:
  language: ta
  text: ஏழாம் நாளுக்குள், கடவுள் தாம் செய்திருந்த வேலையை முடித்திருந்தார்[a]. தாம் செய்திருந்த எல்லா வேலையிலிருந்தும் அவர் ஏழாம் நாளில் ஓய்ந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடியாக: “ஏழாம் நாளில் கடவுள் தாம் செய்த வேலையை முடித்தார்.” எபிரேயச் சொற்றொடர் இவ்வாறும் மொழிபெயர்க்கப்படுகிறது; சூழலில் சாத்தியமான பொருளைத் தெரிவிக்க முதன்மை உரையில் “ஏழாம் நாளுக்குள் ... முடித்திருந்தார்” என்று தரப்பட்டுள்ளது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְכַל
  choice: முடித்திருந்தார்
  rationale: כלה என்பது ‘முடித்தல், நிறைவு செய்தல்’ என்று பொருள்படும். ஏழாம் நாளில் அவர் ஓய்ந்தார் என அடுத்த பகுதி கூறுவதால், வேலை அதற்குள் முடிவடைந்திருந்ததைத் தமிழில் இயல்பாகத் தெரிவிக்க இறந்தகால நிறைவு வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு பன்மை வடிவச் சொல் ஒருமை வினையுடன் வந்து ஒரே கடவுளைக் குறிக்கிறது; நவீன பொதுத் தமிழில் ‘கடவுள்’ இயல்பான இணைச்சொல்.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாள் வந்தபோது
  rationale: சொல்லுக்கு நெருக்கமாக ‘ஏழாம் நாளில்’ என்றாலும், சூழலில் படைப்புப் பணி ஏழாம் நாளுக்குள் முடிந்திருந்தது என்ற சாத்தியமான காலப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது. நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מְלַאכְתּוֹ
  choice: தாம் செய்திருந்த வேலை
  rationale: מְלָאכָה என்பது வேலை அல்லது பணி. மரியாதை ஒருமையுடன் ‘தாம்’ பயன்படுத்தி, படைப்புச் சூழலில் பொதுவான ‘வேலை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲשֶׁר עָשָׂה
  choice: தாம் செய்திருந்த
  rationale: עשה என்பது ‘செய்/உண்டாக்கு’ என்ற பரந்த பொருளுடையது. பொருள் உற்பத்தியாக மட்டும் சுருக்காமல் எபிரேயத்தின் பொதுவான செயற்பொருளைப் பாதுகாக்கிறது.
- source_word: וַיִּשְׁבֹּת
  choice: ஓய்ந்தார்
  rationale: שבת என்பதன் அடிப்படைப் பொருள் ‘நிறுத்துதல், ஓய்தல்’. இங்கு சோர்வு நீங்குதல் என்பதை அவசியமாகக் குறிக்காமல் வேலையிலிருந்து விலகியதை ‘ஓய்ந்தார்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִכָּל
  choice: எல்லா ... இலிருந்தும்
  rationale: מן உடன் כָּל வருவது, கடவுள் தமது வேலையின் முழுமையிலிருந்தும் ஓய்ந்தார் என்பதைக் குறிக்கிறது.
theological_decisions:
- issue: கடவுள் ஏழாம் நாளிலும் வேலை செய்தார் என்று வசனம் குறிக்கிறதா?
  choice: முதன்மை உரை, ஏழாம் நாள் வந்தபோது வேலை ஏற்கெனவே முடிந்திருந்ததாகக் காட்டுகிறது.
  alternative: ‘ஏழாம் நாளில் கடவுள் தாம் செய்த வேலையை முடித்தார்’ என்பது எபிரேயச் சொற்றொடருக்கு மிகவும் நேரடியான மொழிபெயர்ப்பு.
  rationale: בַּיּוֹם הַשְּׁבִיעִי என்பதன் நேரடிப் பொருள் ‘ஏழாம் நாளில்’. ஆனால் அதே நாளில் அவர் ஓய்ந்தார் என அடுத்த கூற்று சொல்வதால், சூழலுக்குப் பொருந்தும் காலநிலையை முதன்மை உரை வெளிப்படுத்துகிறது; எபிரேயத்தின் உண்மையான வடிவமும் அதிலுள்ள பதற்றமும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டது. கடவுளைக் குறிக்க மரியாதை ஒருமையான ‘தாம்/ஆர்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; எபிரேயத்தின் குறிப்பிடத்தக்க காலத் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
