source:
  edition: WLC
  text: וַ/יַּפֵּל֩ יְהוָ֨ה אֱלֹהִ֧ים תַּרְדֵּמָ֛ה עַל הָ/אָדָ֖ם וַ/יִּישָׁ֑ן וַ/יִּקַּ֗ח אַחַת֙ מִ/צַּלְעֹתָ֔י/ו וַ/יִּסְגֹּ֥ר בָּשָׂ֖ר תַּחְתֶּֽ/נָּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/021.yaml
  text: So Yahweh God caused a deep sleep to fall upon the man[a], and he slept; then he took one of his ribs and closed up the flesh in its place.
translation:
  language: ta
  text: அப்பொழுது யாவே தேவன் அந்த மனிதன்மேல் ஆழ்ந்த தூக்கத்தை வரப்பண்ணினார்; அவன் தூங்கினான். பின்னர் அவர் அந்த மனிதனின் விலா எலும்புகளில் ஒன்றை[a] எடுத்து, அந்த இடத்தைச் சதையால் மூடினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுடைய பக்கப் பகுதிகளில் ஒன்றை.’ எபிரெயச் சொல் விலா எலும்பு, உடலின் பக்கம், அல்லது பக்கப் பகுதி என்பதைக் குறிக்கலாம்.
    reason: צֵלָע என்பதற்கான முக்கியமான மாற்றுச் சொற்பொருளைச் சுட்டி, மூலச்சொல்லின் பொருள் வாய்ப்பை காக்கிறது.
lexical_decisions:
- source_word: וַיַּפֵּל
  choice: வரச் செய்தார்
  rationale: נפל என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளைத் தருகிறது. ‘ஆழ்ந்த தூக்கத்தை வரச் செய்தார்’ என்பது எபிரெயக் கட்டமைப்பையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: יְהוָה אֱלֹהִים
  choice: யெகோவா தேவன்
  rationale: இறைபெயரான יהוה-ஐ தனிப்பெயராகவும், אֱלֹהִים-ஐ ‘தேவன்’ என்றும் வழங்கி இணைந்த இறைப்பட்டத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: תַּרְדֵּמָה
  choice: ஆழ்ந்த தூக்கம்
  rationale: இச்சொல் கனமான, இயல்புக்கு மீறிய ஆழ்ந்த தூக்கத்தைக் குறிக்கிறது; ‘ஆழ்ந்த தூக்கம்’ நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: הָאָדָם
  choice: அந்த மனிதன்
  rationale: கட்டுரையின் இவ்விடத்தில் இது மனிதகுலத்தைப் பொதுவாக அல்ல, குறிப்பிட்ட மனிதனைக் குறிக்கிறது. எபிரெய definite article-ஐ ‘அந்த’ வெளிப்படுத்துகிறது.
- source_word: וַיִּישָׁן
  choice: அவன் தூங்கினான்
  rationale: எளிய தொடர்வினையின் நேரடிப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אַחַת מִצַּלְעֹתָיו
  choice: அவனுடைய விலா எலும்புகளில் ஒன்று
  rationale: צֵלָע என்பதற்கு ‘விலா எலும்பு’ என்றும் ‘பக்கம்’ என்றும் பொருள் வரலாம். உடலிலிருந்து ஒன்றை எடுத்து அந்த இடத்தைச் சதையால் அடைக்கும் சூழலில் ‘விலா எலும்பு’ முதன்மை மொழிபெயர்ப்பாக இயல்பாக உள்ளது; ‘பக்கம்’ அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וַיִּסְגֹּר בָּשָׂר
  choice: சதையால் அடைத்தார்
  rationale: סגר என்பதன் ‘மூடு/அடை’ என்ற பொருளையும், திறந்த இடம் சதையால் மூடப்பட்டதையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: תַּחְתֶּנָּה
  choice: அது இருந்த இடத்தை
  rationale: சொல்லுக்குச் சொல் ‘அதன் கீழே/அதற்குப் பதிலாக’ என வரக்கூடிய இவ்வடிவம், இச்சூழலில் எடுக்கப்பட்ட உடற்பகுதி இருந்த இடத்தைக் குறிக்கிறது; தமிழில் ‘அது இருந்த இடத்தை’ தெளிவான சூழல்சார் மொழிபெயர்ப்பு.
theological_decisions:
- issue: הָאָדָם என்பதன் சூழல்சார் குறிப்பு
  choice: அந்த மனிதன்
  alternative: மனித உயிர் / மனிதகுலம்
  rationale: அடுத்த வசனத்தில் பெண் உருவாக்கப்படுவதற்காக உடற்பகுதி எடுக்கப்படும் குறிப்பிட்ட தனிநபரே இங்கு குறிப்பிடப்படுகிறார்; ஆகவே பொதுவான மனிதகுலப் பொருள் இங்கு முதன்மையல்ல.
- issue: צֵלָע என்பதன் பொருள்
  choice: விலா எலும்பு
  alternative: பக்கம் / பக்கப் பகுதி
  rationale: உடற்பகுதி எடுக்கப்பட்டு அதன் இடம் சதையால் அடைக்கப்படும் காட்சி, உடற்கூறியல் பொருளான ‘விலா எலும்பு’ என்பதற்கு ஆதரவளிக்கிறது. ஆயினும் ‘பக்கம்’ என்பது உண்மையான சொற்பொருள் வாய்ப்பு என்பதால் அதை அடிக்குறிப்பில் வெளிப்படையாகக் காத்துள்ளோம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர் நிகழ்வுகள் ‘அப்போது’, ‘பின்பு’ என்பவற்றால் இயல்பாக இணைக்கப்பட்டுள்ளன; உண்மையான சொற்பொருள் இருமை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
