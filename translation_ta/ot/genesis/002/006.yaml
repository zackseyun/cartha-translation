  yaml_path: translation/ot/genesis/002/006.yaml
  text: But a mist would rise from the earth and water the whole surface of the ground[a].
translation:
  language: ta
  text: ஆனால், பூமியிலிருந்து மூடுபனி[a] எழுந்து, தரையின் மேற்பரப்பு முழுவதையும் நீரூட்டியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீரோடை’ அல்லது ‘நீர்ப்பாய்வு’. எபிரெயச் சொல் அரிதாகவே காணப்படுகிறது; அது காற்றிலுள்ள மூடுபனியைக் குறிக்காமல், நிலத்திலிருந்து ஊறிவரும் நீரைக் குறிக்கவும் வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵד
  choice: ஆனால் ... மூடுபனி
  rationale: וְ என்பது முந்தைய வசனத்தில் மழை பெய்யவில்லை என்று கூறப்பட்டதற்கு மாறான நிலையை அறிமுகப்படுத்துவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது. அரிதாக வரும் אֵד என்ற சொல்லுக்கு மேலெழும் தன்மையை முன்னிட்டு ‘மூடுபனி’ முதன்மைப் பொருளாகத் தேர்ந்தெடுக்கப்பட்டது; ‘நீரோடை’ அல்லது நிலத்திலிருந்து ஊறிப் பெருகும் ‘நீர்ப்பாய்வு’ என்ற சாத்தியங்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- source_word: יַעֲלֶה
  choice: எழும்பி
  rationale: עלה வினையின் அடிப்படைப் பொருள் மேலே செல்லுதல். கடந்தகாலச் சூழலில் வழக்கமாக அல்லது தொடர்ந்து நடந்த செயலை அடுத்த வினையுடன் இயல்பாக இணைக்க ‘எழும்பி’ என வழங்கப்பட்டுள்ளது.
- source_word: מִן הָ/אָ֑רֶץ
  choice: பூமியிலிருந்து
  rationale: படைப்பின் பரந்த சூழலில் אֶרֶץ என்பதற்கு ‘பூமி’ பொருத்தமானது; இதே வசனத்தில் வரும் אֲדָמָה என்பதிலிருந்தும் இது வேறுபடுத்தப்படுகிறது.
- source_word: וְ/הִשְׁקָה
  choice: நீர் பாய்ச்சிக்கொண்டிருந்தது
  rationale: שקה என்பதன் ஹிஃபில் வடிவம் ‘குடிக்கக் கொடு, நீர் பாய்ச்சு’ என்று பொருள்படும். இங்கு கடந்தகாலத்தில் தொடர்ந்த அல்லது வழக்கமான செயலைக் காட்ட ‘நீர் பாய்ச்சிக்கொண்டிருந்தது’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶת כָּל פְּנֵי
  choice: மேற்பரப்பு முழுவதற்கும்
  rationale: ‘முகம் முழுவதும்’ என்ற எபிரெயச் சொற்றொடர் காணக்கூடிய முழுப் பரப்பைக் குறிக்கிறது. நவீன தமிழில் இயல்பாக இருக்க ‘மேற்பரப்பு முழுவதற்கும்’ என வழங்கப்பட்டுள்ளது.
- source_word: הָֽ/אֲדָמָֽה
  choice: தரை
  rationale: אֲדָמָה என்பது மண் அல்லது பயிரிடத்தக்க தரையைக் குறிக்கிறது. இதே வசனத்திலுள்ள אֶרֶץ (‘பூமி’) என்பதிலிருந்து வேறுபாட்டைப் பேண ‘தரை’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
theological_decisions:
- issue: אֵד என்பதன் பொருள்
  choice: மூடுபனி
  alternative: நீரோடை அல்லது நிலத்திலிருந்து ஊறிப் பெருகும் நீர்ப்பாய்வு
  rationale: இச்சொல் அரிதானதும் பொருள் விவாதத்திற்குரியதுமாகும். ‘எழும்பி’ என்ற வினையுடன் ‘மூடுபனி’ நேரடியாகப் பொருந்துவதால் அது முதன்மை வாசகமாகத் தேர்ந்தெடுக்கப்பட்டது. இருப்பினும், நிலத்திலிருந்து மேலெழுந்து தரைக்கு நீர் பாய்ச்சும் ஓடை அல்லது நீர்ப்பாய்வு என்ற சாத்தியம் உறுதியானதாகக் கூறப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘பூமி’ (אֶרֶץ), ‘தரை’ (אֲדָמָה) என்ற சொல் வேறுபாடு பேணப்பட்டுள்ளது; தொடர்ச்சியான கடந்தகாலச் செயலை ‘பாய்ச்சிக்கொண்டிருந்தது’ வெளிப்படுத்துகிறது.
