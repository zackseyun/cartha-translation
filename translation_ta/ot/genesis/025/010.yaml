  text: the field that Abraham bought from the sons of Heth—there Abraham and Sarah his wife were buried[a][b][c].
translation:
  language: ta
  text: ஆபிரகாம் ஏத்தின் மக்களிடமிருந்து வாங்கிய அந்த வயல் அது; அங்கே ஆபிரகாமும் அவருடைய மனைவி சாராளும் அடக்கம் செய்யப்பட்டார்கள்[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஏத்தின் மக்கள்’ என்பதற்குப் பதிலாக ‘ஏத்தியர்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் சொல்லடிப்படையில் குடும்ப அல்லது இன உறவைக் குறிக்கிறது; அது ஏத்தியர் இனக்குழுவையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: ‘ஆபிரகாம் அடக்கம் செய்யப்பட்டார்; அவருடைய மனைவி சாராளும் அடக்கம் செய்யப்பட்டாள்.’'
    reason: previous_rendering
  - marker: c
    text: 'அல்லது: ‘ஆபிரகாம் ஏத்தின் மக்களிடமிருந்து வாங்கிய அந்த வயல். அங்கே…’'
    reason: previous_rendering
lexical_decisions:
- source_word: הַשָּׂדֶה
  choice: அந்த வயல்
  rationale: இச்சொல் குறிப்பிட்ட ஒரு வயலைக் குறிக்கிறது; முந்தைய சூழலில் கூறப்பட்ட அடக்க இடமான நிலப்பகுதியைச் சுட்டுவதால், ‘அந்த வயல்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אֲשֶׁר
  choice: ஆபிரகாம் … வாங்கிய
  rationale: பெயர்ச்சொல்லை விளக்கும் எபிரெய உறவுச்சொல், தமிழில் இயல்பான பெயரெச்சத் தொடராக மாற்றப்பட்டுள்ளது.
- source_word: קָנָה
  choice: வாங்கிய
  rationale: நிலம் தொடர்பான வணிகப் பரிமாற்றச் சூழலில், ‘வாங்கிய’ என்பது நேரடியானதும் பொதுவாகப் புரியும் சொல்லுமாகும்.
- source_word: מֵאֵת
  choice: …இடமிருந்து
  rationale: வாங்கப்பட்ட பொருளின் மூலத்தைக் குறிக்கும் முன்னிடைச்சொல்; தமிழில் ‘இடமிருந்து’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי חֵת
  choice: ஏத்தின் மக்கள்
  rationale: சொல்லடிப்படையில் ‘ஏத்தின் மகன்கள்’ என்ற இன/குடும்ப வழிப் பெயர். நவீன தமிழில் கூட்டுமக்களைக் குறிக்க ‘ஏத்தின் மக்கள்’ தெளிவாக உள்ளது; இனப்பெயர் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: שָׁמָּה
  choice: அங்கே
  rationale: முன்னர் சுட்டப்பட்ட அதே அடக்க இடத்தைக் குறிப்பாகச் சுட்டும் இடவினையடை.
- source_word: קֻבַּר
  choice: அடக்கம் செய்யப்பட்டார்கள்
  rationale: ‘அடக்கம் செய்’ என்ற வினையின் செயப்பாட்டு பொருளைத் தருகிறது. எபிரெயில் வினை ஒருமையில் இருந்தாலும், அது ஆபிரகாமும் சாராளும் ஆகிய இருவருக்கும் பொருந்துவதால் தமிழில் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְשָׂרָה אִשְׁתּוֹ
  choice: அவருடைய மனைவி சாராளும்
  rationale: சாராள் ஆபிரகாமின் மனைவி என்பதைத் தெளிவாகவும் இயல்பான தமிழ் சொல் வரிசையிலும் தெரிவிக்கிறது.
