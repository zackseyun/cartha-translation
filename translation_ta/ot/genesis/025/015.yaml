  register: நவீன நிலையான தமிழில், மரியாதைமிக்க எளிய நடையில் பெயர்கள் மட்டும் கொண்ட மூலப் பட்டியல் பாதுகாக்கப்பட்டது. ஆங்கில ஒலிபெயர்ப்புக்கே உரிய ‘Tema/Temah’ மாற்று வடிவக் குறிப்பு தமிழுக்கு பொருந்தாததால் சேர்க்கப்படவில்லை.
