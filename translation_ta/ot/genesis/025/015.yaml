  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲדַד
  choice: ஹதத்
  rationale: இஸ்மவேலின் மகனுடைய இயற்பெயர்; எபிரெய மெய்யெழுத்துகளையும் ஒலியையும் நெருக்கமாகப் பின்பற்றி மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: תֵימָא
  choice: தேமா
  rationale: இயற்பெயர்; எபிரெய உச்சரிப்புக்கு நெருக்கமான, தமிழில் இயல்பாக வாசிக்கக்கூடிய ஒலிபெயர்ப்பு.
- source_word: יְטוּר
  choice: யெத்தூர்
  rationale: இயற்பெயர்; தொடக்க யோத் மற்றும் டேத் மெய்யின் ஒலியைத் தமிழில் தெளிவாகக் காட்டும் மரபான வடிவம்.
- source_word: נָפִישׁ
  choice: நாபீஷ்
  rationale: இயற்பெயர்; நீள உயிர்களையும் இறுதி ஷின் ஒலியையும் காக்கும் ஒலிபெயர்ப்பு.
- source_word: קֵדְמָה
  choice: கேதெமா
  rationale: இயற்பெயர்; எபிரெயப் பெயரின் உயிரொலி அமைப்பைத் தமிழில் வாசிக்கத்தக்க வகையில் நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: וְ / וָ
  choice: பட்டியலில் காற்புள்ளிகள்
  rationale: பெயர்களை இணைக்கும் எபிரெய வாவ் தமிழ் பட்டியல் நடையில் காற்புள்ளிகளால் இயல்பாக வெளிப்படுத்தப்படுகிறது; இறுதியில் தனி இணைப்புச்சொல் சேர்க்காமலும் பட்டியல் தெளிவாக உள்ளது.
