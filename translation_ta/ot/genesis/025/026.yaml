base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/026.yaml
  text: Afterward his brother came out[a], and his hand was grasping Esau’s heel, so his name was called Jacob. And Isaac was sixty years old when they were born.
translation:
  language: ta
  text: அதன்பின் அவனுடைய சகோதரன் வெளியே வந்தான். அவன் கை ஏசாவின் குதிகாலைப் பிடித்துக்கொண்டிருந்தது. ஆகவே அவனுக்கு யாக்கோபு[a] என்று பெயரிடப்பட்டது. அவர்கள் பிறந்தபோது ஈசாக்குக்கு அறுபது வயது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாக்கோபு’ என்ற பெயர் ‘குதிகால்’ என்ற சொல்லுடனும், பின்னர் ‘ஏமாற்றி இடம்பிடித்தல்’ என்ற கருத்துடனும் தொடர்புபடுத்தப்படுகிறது. அவன் ஏசாவின் குதிகாலைப் பிடித்துக்கொண்டிருந்த விவரம் இதனுடன் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: அதன்பின்
  rationale: முந்தைய குழந்தையின் பிறப்புக்குப் பின் நிகழ்ந்ததை இயல்பான நவீனத் தமிழில் வரிசைப்படுத்துகிறது.
- source_word: יָצָא
  choice: வெளியே வந்தான்
  rationale: பிறப்பைக் குறிக்கும் சூழலில் கருப்பையிலிருந்து வெளிவந்ததை எபிரெய மொழியின் காட்சித்தன்மையுடன் வெளிப்படுத்துகிறது; ‘பிறந்தான்’ என்று மட்டும் விளக்கமாக மாற்றவில்லை.
- source_word: אָחִיו
  choice: அவனுடைய சகோதரன்
  rationale: மூலத்தில் ‘சகோதரன்’ என்றே உள்ளது; சூழலால் அறியப்படும் ‘இரட்டையன்’ என்பதைச் சேர்க்கவில்லை.
- source_word: וְיָדוֹ אֹחֶזֶת
  choice: அவனுடைய கை … பற்றிக்கொண்டிருந்தது
  rationale: அவன் வெளியே வந்தபோது தொடர்ந்து நிலவிய செயலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: בַּעֲקֵב עֵשָׂו
  choice: ஏசாவின் குதிகாலை
  rationale: ‘குதிகால்’ என்ற நேரடிப் பொருளையும் உடைமைத் தொடர்பையும் தெளிவாகக் காக்கிறது.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: அவனுக்கு … என்று பெயரிடப்பட்டது
  rationale: யார் பெயரிட்டார் என்பதைத் தமிழ் மொழிபெயர்ப்பில் தேவையின்றி நிர்ணயிக்காமல், பெயரிடும் நிகழ்வை இயல்பாகத் தெரிவிக்கிறது.
- source_word: יַעֲקֹב
  choice: யாக்கோபு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்; குதிகால் தொடர்பான சொல் ஒலிப்பை அடிக்குறிப்பு விளக்குகிறது.
- source_word: בֶּן שִׁשִּׁים שָׁנָה
  choice: அறுபது வயது
  rationale: எபிரெய வயதுக் கூறலை இயல்பான தமிழில் வழங்குகிறது.
- source_word: בְּלֶדֶת אֹתָם
  choice: அவர்கள் பிறந்தபோது
  rationale: மூலத்தில் வெளிப்படையாக இல்லாத தாயை எழுவாயாகச் சேர்க்காமல், இருவரின் பிறந்த நேரத்தைக் குறிக்கிறது.
