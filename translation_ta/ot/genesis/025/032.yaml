- source_word: בְּכֹרָה
  choice: மூத்த மகனுக்குரிய உரிமை
  rationale: முதற்பேறான மகனின் சமூக, குடும்ப, சட்ட உரிமைகளைக் குறிக்கும் சொல்லை, பழமையான அல்லது தெளிவற்ற சொற்களைத் தவிர்த்து சாதாரண வாசகருக்குப் புரியும் நவீன தமிழில் வழங்குகிறது.
theological_decisions:
- issue: தான் சாகப்போவதாக ஏசா கூறியதன் பொருள்
  choice: மரணம் நெருங்கிவிட்டதாக அவர் கூறும் வாக்கியமாக மொழிபெயர்க்கப்பட்டது; அது நேரடியான நிலையா மிகைப்படுத்தப்பட்ட பசிக் கூற்றா என்பது தீர்மானிக்கப்படவில்லை.
  alternative: அவர் உண்மையிலேயே உடனடியாக இறக்கும் நிலையில் இருந்தார்; அல்லது கடும் பசியால் மிகைப்படுத்திப் பேசினார்.
  rationale: எபிரெய உரை அவர் ‘சாகப்போகிறேன்’ என்று கூறுவதை மட்டுமே தெரிவிக்கிறது. மொழிபெயர்ப்பு கதைசொல்லியின் நோக்கம் அல்லது ஏசாவின் ஒழுக்கநிலையை உரைக்குள் சேர்த்து முடிவுசெய்யாமல் அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
