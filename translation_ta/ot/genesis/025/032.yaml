- source_word: הוֹלֵךְ לָמוּת
  choice: சாகப்போகிறேன்
  rationale: הלך + வினையெச்ச நோக்குவடிவம் இங்கு நேரடியான பயணத்தை அல்ல, மரணம் நெருங்கிவிட்டதாக ஏசா கூறுவதை உணர்த்துகிறது. ‘சாகப்போகிறேன்’ அந்தப் பொருளை இயல்பாகவும், அது நேரடியான கூற்றா மிகைப்படுத்தலா என்பதைத் தீர்மானிக்காமலும் தருகிறது.
- source_word: וְלָמָּה
