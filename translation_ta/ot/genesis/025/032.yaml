  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடை இயல்பும் காக்கப்பட்டுள்ளன. ‘சேஷ்டபுத்திரபாகம்’ போன்ற பழமையான சமயச் சொற்களுக்குப் பதிலாக ‘மூத்த மகனுக்குரிய உரிமை’ பயன்படுத்தப்பட்டுள்ளது. ஏசாவின் பேச்சு நேரடியும் உணர்ச்சிமிக்கதுமாக உள்ளது; ஆனால் அவரது கூற்றை மொழிபெயர்ப்பு விளக்கித் தீர்ப்பதில்லை.
