  rationale: முந்தைய கூற்றிலிருந்து ஏசா எடுக்கும் நடைமுறை முடிவைத் தமிழில் தெளிவாகக் காட்டுகிறது. அதேவேளையில் கேள்வியின் வினாவடிவமும் காக்கப்படுகிறது.
- source_word: זֶּה
