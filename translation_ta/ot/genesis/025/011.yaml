base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/011.yaml
  text: And it happened after Abraham’s death that God blessed Isaac his son[a], and Isaac lived by Beer-lahai-roi.
translation:
  language: ta
  text: ஆபிரகாம் இறந்தபின், கடவுள் ஆபிரகாமின் மகனான ஈசாக்கை ஆசீர்வதித்தார். ஈசாக்கு பெயேர்-லகாய்-ரோயீக்கு[a] அருகில் வாழ்ந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பெயேர்-லகாய்-ரோயீ என்பது ஒரு கிணற்றின் பெயர்; இந்த எபிரெயப் பெயர் முன்பு ஆதியாகமம் 16:14-இல் அறிமுகப்படுத்தப்பட்டது.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי
  choice: இறந்தபின் (தொடரின் இயல்பான கதைநடை அமைப்பில்)
  rationale: எபிரெய மொழியின் தொடர்கதை முன்னேற்றத்தைத் தமிழில் தனியாக ‘அது நிகழ்ந்தது’ என்று கனமாக்காமல், காலவாக்கியத்துடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַחֲרֵי מוֹת אַבְרָהָם
  choice: ஆபிரகாம் இறந்தபின்
  rationale: காலத் தொடர்பைச் சுருக்கமாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: וַיְבָרֶךְ אֱלֹהִים
  choice: கடவுள் ... ஆசீர்வதித்தார்
  rationale: בּרך என்பதன் நேரடியான பொருளான ‘ஆசீர்வதித்தல்’ என்பதையும், இங்கு אֱלֹהִים ஒரே கடவுளைக் குறிப்பதையும் தெளிவாக வழங்குகிறது.
- source_word: אֶת יִצְחָק בְּנוֹ
  choice: அவருடைய மகன் ஈசாக்கை
  rationale: ‘அவருடைய’ என்பது அருகிலுள்ள ஆபிரகாமைக் குறிப்பதைத் தமிழில் தெளிவாக்கி, ஈசாக்கின் மகன் என்ற உறவையும் காக்கிறது.
- source_word: וַיֵּשֶׁב
  choice: வாழ்ந்தார்
  rationale: ישב இங்கு தங்கியிருத்தல் அல்லது வசித்தலைக் குறிக்கிறது; ‘வாழ்ந்தார்’ என்பது தேவையற்ற நிரந்தரக் குடியேற்றப் பொருளைச் சேர்க்காத இயல்பான தமிழ்.
- source_word: עִם
  choice: அருகில்
  rationale: இடப்பெயருடன் வரும் עִם இங்கு உடனிருப்பதை அல்ல, இட அண்மையைச் சுட்டுகிறது.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: பெயேர்-லகாய்-ரோயீ
  rationale: முன்னரே அறிமுகமான கிணற்றின் எபிரெயப் பெயரை மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்த்து, கூட்டுப்பெயரின் பகுதிகளை இணைப்புக்குறிகளால் காட்டுகிறது.
theological_decisions:
- issue: אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: தெய்வம்
  rationale: இந்தக் கதைச் சூழலில் இச்சொல் இஸ்ரவேலின் ஒரே கடவுளையே குறிக்கிறது; ‘கடவுள்’ என்பது நவீனத் தமிழில் தெளிவானதும் பொதுவானதும் ஆகும்.
- issue: בְּנוֹ என்பதில் உள்ள உறவுக் குறிப்பு
  choice: அவருடைய மகன் ஈசாக்கு
  alternative: ஈசாக்கு, அவன் மகன்
  rationale: எபிரெய உரையில் சுட்டுப்பெயரின் இலக்கண முன்னோடி ஆபிரகாம். தமிழில் ‘அவருடைய’ என்று வழங்குவது அந்த உறவை இயல்பாகவும் மரியாதையுடனும் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமான கதைநடையிலும் வடிவமைக்கப்பட்டது. மூல உரையின் தொடர்ச்சியைப் பேணியபடி, தமிழில் செயற்கையாக ஒலிக்கும் ‘அது நிகழ்ந்தது’ போன்ற தொடக்கம் தவிர்க்கப்பட்டது. அடிக்குறி குறியீடு அது விளக்கும் இடப்பெயருக்குப் பின்னரே வைக்கப்பட்டது.
