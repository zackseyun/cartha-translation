translation:
  language: ta
  text: மிஷ்மா[a], தூமா, மாசா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மிஷ்மாஅ்.’ இறுதியிலுள்ள எபிரெய மெய்யெழுத்தை வெளிப்படையாகக் காட்ட இவ்வாறும் ஒலிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁמָע
  choice: மிஷ்மா
  rationale: வம்சப் பட்டியலில் வரும் இயற்பெயர் என்பதால் பொருள் மொழிபெயர்க்காமல், எபிரெய உச்சரிப்பைத் தமிழில் ஒலிபெயர்த்துள்ளது. இறுதி ע தமிழில் இயல்பாகத் தனி மெய்யொலியால் குறிக்கப்படவில்லை.
- source_word: דוּמָה
  choice: தூமா
  rationale: எபிரெய דּ இங்குத் ‘த’ ஒலிக்கு நெருக்கமாகவும், நீண்ட ū ‘தூ’ எனவும், இறுதி āh ‘மா’ எனவும் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מַשָּׂא
  choice: மாசா
  rationale: இது இஸ்மவேலிய வம்சப் பட்டியலிலுள்ள இயற்பெயர்; ‘சுமை’ அல்லது ‘இறைவாக்கு’ என்று மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது. שּׂ ஒலி ‘ச’ என்றும், இறுதி א தனியே வெளிப்படாததாகவும் வழங்கப்பட்டுள்ளது.
