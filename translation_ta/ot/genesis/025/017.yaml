  text: וְ/אֵ֗לֶּה שְׁנֵי֙ חַיֵּ֣י יִשְׁמָעֵ֔אל מְאַ֥ת שָׁנָ֛ה וּ/שְׁלֹשִׁ֥ים שָׁנָ֖ה וְ/שֶׁ֣בַע שָׁנִ֑ים וַ/יִּגְוַ֣ע וַ/יָּ֔מָת וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/017.yaml
  text: 'These were the years of Ishmael’s life: one hundred and thirty-seven years[a]. And he breathed his last and died[b], and was gathered to his people.'
translation:
  language: ta
  text: இஸ்மவேலின் வாழ்நாளின் ஆண்டுகள் நூற்று முப்பத்தேழு ஆண்டுகள். அவனும் கடைசி மூச்சை விட்டான்; இறந்தான்; தன் மக்களிடம் சேர்க்கப்பட்டான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தன் மக்களிடம் சேர்க்கப்பட்டான்’ என்பது மரண அறிவிப்புகளில் பயன்படுத்தப்படும் எபிரெய மரபுத்தொடர். இது ஒருவரது முன்னோர்களுடன் இணைதல், உறவினரிடையே அடக்கம் செய்யப்படுதல், அல்லது இரண்டையும் குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה שְׁנֵי חַיֵּי יִשְׁמָעֵאל
  choice: இஸ்மவேல் வாழ்ந்த ஆண்டுகள்
  rationale: எபிரெய மொழியின் வாழ்நாள்-கணக்கீட்டு மரபுத்தொடரை இயல்பான நவீனத் தமிழில் தருகிறது; வசனம் ஒரு வாழ்நாள் சுருக்கமாக அமைவதையும் காக்கிறது.
- source_word: מְאַת שָׁנָה וּשְׁלֹשִׁים שָׁנָה וְשֶׁבַע שָׁנִים
  choice: நூற்று முப்பத்தேழு
  rationale: எபிரெய எண்ணிக்கை வரிசையைத் துல்லியமான மொத்தமாக, தமிழில் இயல்பாக வழங்குகிறது; முன்வரும் ‘ஆண்டுகள்’ என்பதால் அதை மறுபடியும் சொல்லவில்லை.
- source_word: וַיִּגְוַע
  choice: கடைசி மூச்சை விட்டு
  rationale: அடுத்துள்ள ‘இறந்தான்’ என்பதிலிருந்து வேறுபட்ட גוע வினையின் உயிர் நீங்குதல் அல்லது இறுதி மூச்சுவிடுதல் என்ற நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: וַיָּמָת
  choice: இறந்தான்
  rationale: மூலத்தில் அடுத்தடுத்து வரும் இரு இறப்பு வினைகளையும் ஒன்றாகச் சுருக்காமல் தனித்தனியாகத் தக்கவைக்கிறது.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: தன் மக்களிடம் சேர்க்கப்பட்டான்
  rationale: மரண அறிவிப்புகளில் வரும் எபிரெய மரபுத்தொடரின் உருவகத்தையும், ‘அவர்களிடம்’ என்ற திசைச்சார்ந்த பொருளையும் தக்கவைத்து, குறிப்பிட்ட ஓர் விளக்கத்தைத் திணிக்காமல் விடுகிறது.
theological_decisions:
- issue: ‘தன் மக்களிடம் சேர்க்கப்பட்டான்’ என்ற மரண மரபுத்தொடரின் பொருள்
  choice: மரபுத்தொடரை விளக்கித் தீர்மானிக்காமல் அப்படியே தக்கவைத்தல்
  alternative: முன்னோர்களின் கல்லறையில் அடக்கம் செய்யப்பட்டான்; அல்லது மரணத்துக்குப் பின் தன் முன்னோர்களுடன் இணைந்தான்
  rationale: இது உறவினருடன் அடக்கம் செய்யப்படுதல், இறந்த முன்னோர்களுடன் இணைதல், அல்லது இரண்டையும் குறிக்கக்கூடும். எபிரெய உரை எந்த ஒரு பொருளையும் மட்டும் கட்டாயப்படுத்தாததால் அந்த இறையியல் திறந்தநிலை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான மரண அறிவிப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடைசி மூச்சை விட்டு இறந்தான்’ என்ற நோக்கமுள்ள மீளுரைத்தல் மூலத்தின் இரண்டு தனித்த வினைகளைப் பாதுகாக்கிறது; ‘தன் மக்களிடம் சேர்க்கப்பட்டான்’ என்பது அதன் விளக்கத் திறந்தநிலையைத் தக்கவைக்கிறது.
