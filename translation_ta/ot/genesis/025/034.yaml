reference: Genesis 25:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/יַעֲקֹ֞ב נָתַ֣ן לְ/עֵשָׂ֗ו לֶ֚חֶם וּ/נְזִ֣יד עֲדָשִׁ֔ים וַ/יֹּ֣אכַל וַ/יֵּ֔שְׁתְּ וַ/יָּ֖קָם וַ/יֵּלַ֑ךְ וַ/יִּ֥בֶז עֵשָׂ֖ו אֶת הַ/בְּכֹרָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/034.yaml
  text: And Jacob gave Esau bread and lentil stew[a], and he ate and drank and rose and went away[b]. Thus Esau despised the birthright.
translation:
  language: ta
  text: யாக்கோபு ஏசாவுக்கு அப்பமும் பருப்புக் கூழும் கொடுத்தான். அவன் சாப்பிட்டான், குடித்தான், எழுந்தான், போனான். இவ்வாறு ஏசா மூத்த மகனுக்குரிய உரிமையை இகழ்ந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָתַן
  choice: கொடுத்தான்
  rationale: எளிய பரிமாற்றத்தை மேலதிக நுணுக்கம் சேர்க்காமல் நேரடியாகக் குறிக்கிறது.
- source_word: לֶחֶם
  choice: அப்பம்
  rationale: கூழுடன் இணைத்துச் சொல்லப்படுவதால், பொதுவான ‘உணவு’ என்பதைக் காட்டிலும் குறிப்பான அப்பத்தையே இங்கு குறிக்கிறது.
- source_word: נְזִיד עֲדָשִׁים
  choice: பருப்புக் கூழ்
  rationale: பருப்பால் சமைக்கப்பட்ட கெட்டியான உணவை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ וַיָּקָם וַיֵּלַךְ
  choice: அவன் சாப்பிட்டான், குடித்தான், எழுந்தான், போனான்
  rationale: எபிரெய உரையின் விரைவான தொடர் வினை அமைப்பையும் சுருக்கமான கதை ஓட்டத்தையும் தனித்தனி வினைகளால் காக்கிறது.
- source_word: וַיִּבֶז
  choice: இகழ்ந்தான்
  rationale: அலட்சியத்தை மட்டுமல்ல, மதிப்பற்றதாகக் கருதிய அவமதிப்பையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: הַבְּכֹרָה
  choice: மூத்த மகனுக்குரிய உரிமை
  rationale: முதற்பேறான மகனுக்குரிய குடும்ப மற்றும் சட்டச் சிறப்புரிமையை பழமையான சொற்கள் இன்றி தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: ஏசா தனது முதற்பேற்று நிலையை எவ்வாறு மதித்தான் என்பதைக் குறிக்கும் இறுதி மதிப்பீடு
  choice: இவ்வாறு ஏசா மூத்த மகனுக்குரிய உரிமையை இகழ்ந்தான்
  alternative: ஏசா மூத்த மகனுக்குரிய உரிமையை அவமதித்தான்
  rationale: இறுதி வாக்கியம் முந்தைய செயல்களின் பொருளைச் சுருக்கிக் கூறுகிறது. ‘இவ்வாறு’ அந்தத் தொடர்பை வெளிப்படுத்துகிறது; ‘இகழ்ந்தான்’ என்பது மூல வினையின் வலுவான எதிர்மறை மதிப்பீட்டை விளக்க விரிவாக்கமின்றிக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயும் கண்ணியமானதாயும் உள்ள நடை. தொடர்ச்சியான எபிரெய வினைகளின் வேகத்தைக் காக்கச் சுருக்கமான தனித்தனி வாக்கியக் கூறுகள் பயன்படுத்தப்பட்டுள்ளன.
