source:
  edition: WLC
  text: וַ/יֵּצֵ֤א הָ/רִאשׁוֹן֙ אַדְמוֹנִ֔י כֻּלּ֖/וֹ כְּ/אַדֶּ֣רֶת שֵׂעָ֑ר וַ/יִּקְרְא֥וּ שְׁמ֖/וֹ עֵשָֽׂו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/025.yaml
  text: The first came out reddish[a], all of him like a hairy cloak[c][b], and they called his name Esau.
translation:
  language: ta
  text: முதலில் பிறந்தவன் சிவந்த தோற்றமுடையவனாக[a] வெளியே வந்தான்; அவன் உடல் முழுவதும் மயிராலான மேலாடையைப் போல[b] இருந்தது. அவர்கள் அவனுக்கு ஏசா என்று பெயரிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘செந்நிறமானவனாக’ அல்லது ‘சிவப்பானவனாக.’ எபிரேயப் பெயரடை சிவப்பு கலந்த தோற்றத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மயிர் மேலாடையைப் போல’ அல்லது ‘மயிராலான போர்வையைப் போல.’ எபிரேய மொழியில் ‘மேலாடை’ என்பதையும் ‘மயிர்’ என்பதையும் இணைத்த உவமை உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: வெளியே வந்தான்
  rationale: பிறப்பை விவரிக்கும் எபிரேய வினையின் நேரடியான உருவகத்தையும் இயல்பான நவீனத் தமிழையும் காக்கிறது.
- source_word: הָרִאשׁוֹן
  choice: முதலில் பிறந்தவன்
  rationale: இரட்டையரில் பிறப்பு வரிசையில் முதலில் வந்தவனைக் குறிக்கிறது; தமிழில் சூழலைத் தெளிவாக எடுத்துரைக்கிறது.
- source_word: אַדְמוֹנִי
  choice: சிவந்த தோற்றமுடையவனாக
  rationale: சிவப்பு கலந்த தோற்றம் அல்லது நிறத்தைச் சுட்டும் பெயரடையின் நுணுக்கத்தைப் பாதுகாக்கிறது; முற்றிலும் 'சிவப்பு' என்று மிகைப்படுத்துவதில்லை.
- source_word: כֻּלּוֹ
  choice: அவன் உடல் முழுவதும்
  rationale: விவரிப்பு அவனுடைய முழு உடலுக்கும் பொருந்துவதைத் தமிழில் வெளிப்படையாகக் காட்டுகிறது.
- source_word: כְּאַדֶּרֶת שֵׂעָר
  choice: மயிராலான மேலாடையைப் போல
  rationale: ‘மேலாடை’ மற்றும் ‘மயிர்’ ஆகிய இரு கூறுகளையும் கொண்ட எபிரேய உவமையை விளக்கப் பொருளாக்காமல் அப்படியே காக்கிறது.
- source_word: וַיִּקְרְאוּ שְׁמוֹ
  choice: அவர்கள் அவனுக்கு ... என்று பெயரிட்டார்கள்
  rationale: எபிரேயப் பெயரிடும் மரபுத்தொடரின் பொருளை இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: עֵשָׂו
  choice: ஏசா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம்.
