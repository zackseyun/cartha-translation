    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported idea that names were bestowed at particular locations. “குடியிருப்புகளின்படியும் முகாம்களின்படியும்” preserves the Hebrew prepositional formula and its likely enumerative force without deciding too narrowly between ‘in’ and ‘by.’ The remainder retains the draft’s accurate and modern terminology.
