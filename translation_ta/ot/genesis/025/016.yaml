  text: אֵ֣לֶּה הֵ֞ם בְּנֵ֤י יִשְׁמָעֵאל֙ וְ/אֵ֣לֶּה שְׁמֹתָ֔/ם בְּ/חַצְרֵי/הֶ֖ם וּ/בְ/טִֽירֹתָ֑/ם שְׁנֵים עָשָׂ֥ר נְשִׂיאִ֖ם לְ/אֻמֹּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/016.yaml
  text: 'These are the sons of Ishmael[a], and these are their names[c][b], by their settlements and by their encampments: twelve princes according to their peoples.'
translation:
  language: ta
  text: 'இஸ்மவேலின் மகன்கள் இவர்களே; அவர்களுடைய குடியிருப்புகளின்படியும் முகாம்களின்படியும் அவர்களுடைய பெயர்கள் இவையே: தத்தம் மக்களினங்களுக்கு உரிய பன்னிரண்டு தலைவர்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தலைவர்கள்” என்பதற்கு “குலத்தலைவர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הֵם בְּנֵי יִשְׁמָעֵאל
  choice: இஸ்மவேலின் மகன்கள் இவர்களே
  rationale: உடனடியான சூழலில் முன்பு பட்டியலிடப்பட்டவர்கள் இஸ்மவேலின் நேரடி மகன்கள்; ஆகவே ‘சந்ததியினர்’ என்பதைவிட ‘மகன்கள்’ துல்லியமானது.
- source_word: וְאֵלֶּה שְׁמֹתָם בְּחַצְרֵיהֶם וּבְטִירֹתָם
  choice: அவர்களுடைய குடியிருப்புகளிலும் முகாம்களிலும் வழங்கிய பெயர்கள் இவையே
  rationale: בְּ முன்னிடைச்சொல்லின் இடவியல் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது. பெயர்கள் அந்த இடங்களில் வழங்கிய பெயர்கள் என இணைப்பதால், மகன்களே அந்த இடங்களில் வாழ்ந்தனர் என்று தேவையின்றி தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: שְׁנֵים עָשָׂר נְשִׂיאִם
  choice: பன்னிரண்டு தலைவர்கள்
  rationale: נָשִׂיא என்பது தலைவன், குலத்தலைவன், அரசன் போன்ற பொருள்களைக் கொள்ளலாம். இங்கு அரச மரபை முன்கூட்டியே உணர்த்தாத ‘தலைவர்கள்’ தெளிவும் நடுநிலையும் உடையது.
- source_word: לְאֻמֹּתָם
  choice: தத்தம் மக்களினங்களுக்கு உரிய
  rationale: אֻמָּה குறிக்கும் தனித்த மக்கள் குழுக்களை ‘மக்களினங்கள்’ நெருக்கமாக வெளிப்படுத்துகிறது; לְ என்பதன் தொடர்பு அல்லது உரிய நிலையும் காக்கப்படுகிறது.
theological_decisions:
- issue: நְשִׂיאִם என்பதன் பதவி நிலை
  choice: தலைவர்கள்
  alternative: இளவரசர்கள் / குலத்தலைவர்கள்
  rationale: மூலச்சொல் உயர்ந்த சமூகத் தலைமையைக் குறிக்கிறது; ஆனால் அரச வம்சப் பதவியை கட்டாயப்படுத்தாது. எனவே நடுநிலையான பதிப்பு தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘குடியிருப்புகள்’ மற்றும் ‘முகாம்கள்’ நிலையானதும் இடம்பெயரும் தன்மையுடையதுமான வாழ்விடங்களின் இணைப்பைப் பேணுகின்றன. அடிக்குறி குறியீடு பிரதான உரையில் இடம்பெற்றுள்ளது.
