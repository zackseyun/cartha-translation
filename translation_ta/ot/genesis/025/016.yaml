  to: 'இஸ்மவேலின் மகன்கள் இவர்களே; அவர்களுடைய குடியிருப்புகளின்படியும் முகாம்களின்படியும் அவர்களுடைய பெயர்கள் இவையே: தத்தம் மக்களினங்களுக்கு உரிய பன்னிரண்டு தலைவர்கள்.[a]'
