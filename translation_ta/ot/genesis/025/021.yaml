source:
  edition: WLC
  text: וַ/יֶּעְתַּ֨ר יִצְחָ֤ק לַֽ/יהוָה֙ לְ/נֹ֣כַח אִשְׁתּ֔/וֹ כִּ֥י עֲקָרָ֖ה הִ֑וא וַ/יֵּעָ֤תֶר ל/וֹ֙ יְהוָ֔ה וַ/תַּ֖הַר רִבְקָ֥ה אִשְׁתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/021.yaml
  text: And Isaac prayed to Yahweh for his wife[a], because she was barren. And Yahweh answered him[b], and Rebekah his wife conceived.
translation:
  language: ta
  text: ஈசாக்கு தன் மனைவிக்காக[a] யாவேயிடம் மன்றாடினார்; ஏனெனில் அவள் மலடியாக இருந்தாள். யாவே அவரது மன்றாட்டுக்கு இணங்கினார்[b]; ஈசாக்கின் மனைவி ரெபெக்காள் கருவுற்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் மனைவிக்கு எதிரே இருந்து.” இங்கு வரும் எபிரெய சொற்றொடர், அவளை முன்னிட்டு அல்லது அவளுக்காக மன்றாடினார் என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மன்றாடினார்,” “மன்றாட்டுக்கு இணங்கினார்” ஆகிய இரண்டிற்கும் எபிரெயத்தில் ஒரே வேர்ச்சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּעְתַּר / וַיֵּעָתֶר (עתר)
  choice: மன்றாடினார் / அவரது மன்றாட்டுக்கு இணங்கினார்
  rationale: ஒரே எபிரெய வேர்ச்சொல் இரு வடிவங்களில் வேண்டுதலையும் அதற்கு யாவே செவிசாய்த்ததையும் இணைக்கிறது. தமிழில் ஒரே சொல்லை இயல்பற்ற முறையில் திரும்பச் சொல்லாமல், ‘மன்றாடு / மன்றாட்டுக்கு இணங்கு’ என்று வழங்குவது அந்தச் சொல்விளையாட்டையும் பரஸ்பரத் தொடர்பையும் முடிந்தவரை காக்கிறது.
- source_word: לַיהוָה / יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள கடவுளின் தனிப்பெயரான יהוה-ஐ பட்டப்பெயராக மாற்றாமல், தமிழில் தெளிவாக ஒலிபெயர்க்கிறது.
- source_word: לְנֹכַח אִשְׁתּוֹ
  choice: தன் மனைவிக்காக
  rationale: לְנֹכַח என்பதன் அடிப்படைப் பொருள் ‘எதிரே/முன்னிலையில்’ என்றாலும், இச்சூழலில் மனைவியை முன்னிட்டு அல்லது அவளுக்காக வேண்டுதல் செய்வதைக் குறிக்கலாம். முதன்மை உரையில் இயல்பான சூழற்பொருள் தரப்பட்டு, நேரடியான இடப்பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: עֲקָרָה
  choice: மலடியாக
  rationale: கருத்தரிக்க இயலாத நிலையைச் சுருக்கமாகவும் இக்கதையின் சூழலுக்கு துல்லியமாகவும் குறிக்கிறது; ‘குழந்தையில்லாதவள்’ என்பது நிலையின் விளைவை மட்டும் கூறும்.
- source_word: וַתַּהַר
  choice: கருவுற்றாள்
  rationale: கருத்தரித்தாள் என்ற பொருளை இயல்பான, கண்ணியமான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: רִבְקָה
  choice: ரெபெக்காள்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவத்தைப் பின்பற்றுகிறது.
theological_decisions:
- issue: עתר என்ற ஒரே வேர்ச்சொல் மனித வேண்டுதலுக்கும் தெய்வீகப் பதிலுக்கும் பயன்படுத்தப்படுதல்
  choice: ஈசாக்கு மன்றாடினார்; யாவே அவரது மன்றாட்டுக்கு இணங்கினார்
  alternative: ஈசாக்கு வேண்டினார்; யாவே அவருக்குப் பதிலளித்தார்
  rationale: தெய்வீகப் பதிலை இயந்திரமயமான விளைவாகக் காட்டாமல், மூலத்தில் உள்ள ஒரே வேர்ச்சொல்லின் தொடர்பைத் தமிழில் வெளிப்படுத்துகிறது.
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூல உரையில் பட்டப்பெயர் அல்ல, தனிப்பெயர் நேரடியாக இருப்பதால் அதை ஒலிபெயர்த்து வழங்குகிறது; குறிப்பிட்ட சமயப் பிரிவின் தனிப்பட்ட விளக்கத்தைச் சேர்க்கவில்லை.
- issue: לְנֹכַח என்பதன் சூழற்பொருளும் இடப்பொருளும்
  choice: மனைவிக்காக
  alternative: மனைவிக்கு எதிரே இருந்து
  rationale: ஜெபம் அவளைச் சார்ந்தது என்ற இயல்பான சூழற்பொருளை முதன்மை உரையில் தருகிறது; அவள் உடனிருந்தாளா என்பதை உரை உறுதியாகத் தீர்மானிக்காததால் நேரடியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மன்றாடு’ என்பது வேண்டுதலின் தீவிரத்தை மிகைப்படுத்தாமல் ஜெபச் சூழலைத் தருகிறது. அரைப்புள்ளிகள் எபிரெயக் கதையோட்டத்தின் தொடர்ச்சியைக் காக்கின்றன.
