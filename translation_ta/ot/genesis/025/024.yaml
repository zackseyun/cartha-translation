translation:
  language: ta
  text: அவள் பிரசவிப்பதற்கான நாட்கள் நிறைவடைந்தபோது, இதோ, அவளுடைய கருப்பையில் இரட்டைப் பிள்ளைகள் இருந்தனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלְאוּ יָמֶיהָ
  choice: அவளுடைய நாட்கள் நிறைவடைந்தபோது
  rationale: מלא உடன் வரும் ‘நாட்கள் நிறைவடைதல்’ என்ற எபிரெய மரபுத்தொடரின் வடிவத்தையும், குறிப்பிட்ட காலம் முடிவடைந்தது என்ற பொருளையும் காக்கிறது.
- source_word: לָלֶדֶת
  choice: பெற்றெடுப்பதற்கான
  rationale: ילד என்ற வினையின் இச்சூழலுக்குரிய பொருளை இயல்பான நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: அடுத்து வரும் வியப்புக்குரிய அல்லது முக்கியமான செய்தியின்மீது கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் குறிப்பானின் வலிமையைப் பாதுகாக்கிறது.
- source_word: תוֹמִם
  choice: இரட்டைப் பிள்ளைகள்
  rationale: ‘இரட்டையர்’ என்ற பொருளை, கருப்பையிலுள்ள குழந்தைகளைக் குறிக்கும் இச்சூழலில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּבִטְנָהּ
  choice: அவளுடைய கருப்பையில்
  rationale: בטן என்பதற்கு ‘வயிறு’ என்றும் பொருள் வரலாம்; ஆனால் பிரசவச் சூழலில் ‘கருப்பை’ என்பதே துல்லியமான, இயல்பான தமிழ் சொல்.
