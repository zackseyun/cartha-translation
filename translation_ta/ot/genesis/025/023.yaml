  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לָ֗/הּ שְׁנֵ֤י גיים בְּ/בִטְנֵ֔/ךְ וּ/שְׁנֵ֣י לְאֻמִּ֔ים מִ/מֵּעַ֖יִ/ךְ יִפָּרֵ֑דוּ וּ/לְאֹם֙ מִ/לְאֹ֣ם יֶֽאֱמָ֔ץ וְ/רַ֖ב יַעֲבֹ֥ד צָעִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/023.yaml
  text: And Yahweh said to her[a], “Two nations are in your womb, and two peoples will be separated from within you; and one people will be stronger than the other[b], and the older will serve the younger.”
translation:
  language: ta
  text: யாவே அவளிடம், “உன் கருப்பையில் இரண்டு நாடுகள் உள்ளன; உன் உள்ளிருந்து இரண்டு மக்களினங்கள் பிரிந்துவரும். ஒரு மக்களினம் மற்றொன்றைவிட வலிமை பெறும்; மூத்தவன் இளையவனுக்குச் சேவை செய்வான்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெரியவன் சிறியவனுக்குச் சேவை செய்வான்.”
    reason: ரַב மற்றும் צָעִיר என்பவை இச்சூழலில் ‘மூத்தவன்/இளையவன்’ என்று பொருள்படுவது இயல்பானது; எனினும் அவை பெரிய/சிறிய அல்லது உயர்ந்த/தாழ்ந்த நிலை என்ற பொருள் விரிவையும் கொண்டிருக்கலாம்.
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பட்ட பெயராகிய நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பில் தருகிறது.
- source_word: שְׁנֵי גיים
  choice: இரண்டு நாடுகள்
  rationale: גוי என்பதன் இன-அரசியல் மக்கள் தொகுதி என்ற பொருளைத் தருகிறது; அடுத்த இணைவரியிலுள்ள לְאֻמִּים என்பதிலிருந்து சொல்லாட்சியிலும் வேறுபடுத்துகிறது.
- source_word: בְּבִטְנֵךְ
  choice: உன் கருப்பையில்
  rationale: கர்ப்பத்தைப் பற்றிய இச்சூழலில் בטן என்பதற்குத் துல்லியமும் இயல்பும் கொண்ட தமிழ் சொல்.
- source_word: שְׁנֵי לְאֻמִּים
  choice: இரண்டு மக்கள்
  rationale: இரு மக்கள் சமூகங்களைக் குறிக்கும் இணைச் சொல்லைத் தமிழில் இயல்பாக வழங்கி, முந்தைய ‘நாடுகள்’ என்பதுடனான கவிதை இணைப்பைப் பேணுகிறது.
- source_word: מִמֵּעַיִךְ יִפָּרֵדוּ
  choice: உனக்குள்ளிருந்து பிரிவார்கள்
  rationale: ‘உள்ளுறுப்புகளிலிருந்து’ என்ற சொல்லாட்சியைச் சூழலுக்கேற்ற இயல்பான தமிழாக்கமாகத் தருகிறது; Niphal வினையின் பிரிவுறும் கருத்தையும் பேணுகிறது.
- source_word: וּלְאֹם מִלְאֹם יֶאֱמָץ
  choice: ஒரு மக்கள் மற்ற மக்களைவிட வலிமை பெறுவார்கள்
  rationale: இரு மக்கள் குழுக்களுக்கிடையிலான ஒப்பீட்டையும், אמץ வேரின் வலிமையடைதல் அல்லது மேலோங்குதல் என்ற இயக்கமுள்ள பொருளையும் வெளிப்படுத்துகிறது.
- source_word: וְרַב יַעֲבֹד צָעִיר
  choice: மூத்தவன் இளையவனுக்குப் பணிசெய்வான்
  rationale: இரட்டையரைப் பற்றிய சூழலில் רב/צעיר என்ற எதிரிணையை பிறப்பு வரிசையாக இயல்பாகப் புரியவைக்கிறது; עבד என்பதன் விரிவான ‘சேவை செய்’ பொருளை ‘பணிசெய்’ பேணுகிறது.
theological_decisions:
- issue: וְרַב יַעֲבֹד צָעִיר என்பதிலுள்ள רב மற்றும் צעיר ஆகியவற்றின் பொருள்
  choice: மூத்தவன் இளையவனுக்குப் பணிசெய்வான்
  alternative: பெரியவன் சிறியவனுக்குப் பணிசெய்வான்
  rationale: கருப்பையிலுள்ள இரட்டையரைச் சூழல் சுட்டுவதால் ‘மூத்தவன்/இளையவன்’ என்பது இயல்பான முதன்மை வாசிப்பு. எனினும், எபிரெயச் சொற்கள் வயதை மட்டுமல்லாமல் பெருமை, நிலை அல்லது அளவையும் குறிக்கக்கூடும்; ஆகவே அந்த உண்மையான பொருள் விரிவை அடிக்குறிப்பில் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான தீர்க்கதரிசன உரை. இணை அமைப்பு இயன்றவரை பேணப்பட்டுள்ளது. ‘மக்கள்’ கூட்டுப்பெயராக இருப்பதால் மரியாதை/பன்மை ஒத்திசைவுடன் ‘பிரிவார்கள்’, ‘வலிமை பெறுவார்கள்’ பயன்படுத்தப்பட்டுள்ளன.
