  text: 'ஆபிரகாமின் மகனான ஈசாக்கின் தலைமுறைகள்[a] இவையே: ஆபிரகாம் ஈசாக்கைப் பெற்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தலைமுறைகள்’ என்பதற்கான எபிரெயச் சொல் தோலெதோத்; இதை ‘வரலாறு’ அல்லது ‘வம்சவழி’ என்றும் மொழிபெயர்க்கலாம். இது ஆதியாகமத்தில் மீண்டும் மீண்டும் வரும் ஒரு தலைப்புச் சொல்.
