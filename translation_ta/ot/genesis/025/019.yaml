lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவையே
  rationale: வாவ் இணைப்புச்சொல்லுடன் வரும் சுட்டுப்பெயர் புதிய பகுதியை அறிமுகப்படுத்துகிறது. தமிழில் தேவையற்ற காலப்பொருளைச் சேர்க்காமல், தலைப்புச் சூத்திரத்தின் வலியுறுத்தலை ‘இவையே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תּוֹלְדֹת
  choice: தலைமுறைகள்
  rationale: ஆதியாகமத்தில் மீண்டும் மீண்டும் வரும் கட்டமைப்புச் சொல்லின் பரந்த பொருளையும் இலக்கியத் தொடர்பையும் காக்கிறது; ‘சந்ததியினர்’ போன்ற குறுகிய பொருளுக்கு இதை வரையறுக்கவில்லை.
- source_word: יִצְחָק
  choice: ஈசாக்கு
  rationale: தமிழில் நிலைபெற்றுள்ள பெயர்வடிவம்; வேற்றுமை உருபுடன் ‘ஈசாக்கின்’ என்று வருகிறது.
- source_word: בֶּן אַבְרָהָם
  choice: ஆபிரகாமின் மகனான
  rationale: வம்ச அடையாளத்தைத் தெளிவாக வைத்துக்கொண்டு, தமிழில் பெயருடன் இயல்பாக இணையும் வடிவம்.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: இங்கு ஹிஃபில் வடிவம் ‘தந்தையாகப் பெற்றான்/பிறப்பித்தான்’ என்ற வம்சாவளிப் பொருளைக் கொண்டது. ‘பெற்றான்’ என்பது தமிழில் தந்தையைக் குறித்தும் பயன்படும் சுருக்கமான, இயல்பான வம்சாவளிச் சொல்; ‘பிறப்பித்தான்’ செயற்கையாக ஒலிக்கும்.
- source_word: אֶת יִצְחָק
  choice: ஈசாக்கைப்
  rationale: אֶת தனியாக மொழிபெயர்க்கப்படாது; நேர்செயப்படுபொருள் தமிழின் ஐ வேற்றுமையுடன் குறிக்கப்படுகிறது.
