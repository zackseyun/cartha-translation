  text: And Abraham breathed his last and died in a good old age[a], old and full[b], and he was gathered to his people.
translation:
  language: ta
  text: ஆபிரகாம் கடைசி மூச்சை விட்டு இறந்தார்; அவர் நல்ல முதிர்வயதில், முதியவராகவும் நிறைவடைந்தவராகவும் இருந்தார்; அவர் தம் மக்களோடு சேர்க்கப்பட்டார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “தம் மக்களோடு சேர்க்கப்பட்டார்” என்பது மரணத்தைக் குறிக்கும் மரபான எபிரெயச் சொற்றொடர். இறந்த உறவினரோடு ஒன்றுசேர்வதை இது உணர்த்தக்கூடும்; ஆனால் அது எவ்வாறு நிகழ்கிறது என்பதை இச்சொற்றொடர் துல்லியமாகக் குறிப்பிடவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: கடைசி மூச்சை விட்டு
  rationale: இறப்புச் செய்திகளில் גוע என்பது உயிர் நீங்குவதைக் குறிக்கிறது. அடுத்து வரும் ‘இறந்தார்’ என்பதிலிருந்து இதை வேறுபடுத்தி, இயல்பான தமிழில் எபிரெயச் சொற்றொடரின் வலிமையைப் பேணுகிறது.
- source_word: וַיָּמָת
  choice: இறந்தார்
  rationale: מות என்பது இறப்பைக் குறிக்கும் வழக்கமான, நேரடியான வினைச்சொல்; மூலத்தின் வெளிப்படையான கூற்றை மென்மைப்படுத்தாமல் தருகிறது.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: நல்ல முதிர்வயதில்
  rationale: שֵׂיבָה என்பது நரைமுதிர்ந்த வயதையும் טוֹבָה அதன் நல்ல தன்மையையும் குறிக்கிறது. தமிழில் வயதும் அதன் நேர்மறை மதிப்பும் இயல்பாக வெளிப்படுகின்றன.
- source_word: זָקֵן
  choice: வயது முதிர்ந்து
  rationale: ‘முதியவர்/முதிர்ந்தவர்’ என்ற தனித்த விளக்கத்தைப் பேணி, மூலத்தில் வரிசையாக அடுக்கப்பட்டுள்ள விவரணைகளைச் சுருக்காமல் தருகிறது.
- source_word: וְשָׂבֵעַ
  choice: நிறைவுற்றவராக
  rationale: שָׂבֵעַ என்பதன் அடிப்படைப் பொருள் ‘நிறைந்த, திருப்தியடைந்த’ என்பதாகும். எபிரெயத்தில் ‘நாட்கள்’ என்று வெளிப்படையாக இல்லாததால் அதைச் சேர்க்காமல், இறப்புச் சூழலில் வாழ்வின் நிறைவை உணர்த்தும் இயல்பான தமிழைத் தேர்ந்தெடுக்கிறது.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: அவர் தம் மக்களோடு சேர்க்கப்பட்டார்
  rationale: இது மரணத்தைக் குறிக்கும் மரபான எபிரெயச் சொற்றொடர். அதை வெறும் அடக்கம் என்றோ மறுமையில் உறவினரோடு ஒன்றுசேர்தல் என்றோ தீர்மானிக்காமல், அதன் உருவகத்தையும் தெளிவின்மையையும் பேணுகிறது.
- source_word: עַמָּיו
  choice: தம் மக்கள்
  rationale: עם என்பதன் நேரடியான கூட்டுறவுப் பொருளைப் பேணுகிறது; ‘மூதாதையர்’ அல்லது ‘உறவினர்’ என்று பொருளைத் தேவையின்றி குறுக்கவில்லை.
theological_decisions:
- issue: ‘தம் மக்களோடு சேர்க்கப்பட்டார்’ என்பதன் பொருள்
  choice: அடக்கம், இறந்த உறவினரோடு ஒன்றுசேர்தல், அல்லது மரணத்திற்குப் பிந்தைய உணர்வுள்ள இருப்பு ஆகியவற்றுள் ஒன்றை மட்டும் குறிப்பதாகத் தீர்மானிக்காமல், மரபான இறப்புச் சொற்றொடரைப் பேணுதல்.
  alternative: குடும்பக் கல்லறையில் அடக்கம் செய்யப்பட்டார்; அல்லது மரணத்திற்குப் பின் மூதாதையரோடு ஒன்றுசேர்ந்தார் என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: எபிரெயச் சொற்றொடர் இத்தகைய கருத்துகளை நினைவூட்டக்கூடும்; ஆனால் இந்த வசனம் அவற்றுள் ஒன்றை மட்டும் உறுதியாகக் குறிப்பிடவில்லை. ஆகவே அதன் இறையியல் பதற்றமும் பொருள் விரிவும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கடைசி மூச்சை விட்டு இறந்தார்’ என்ற இரட்டை வெளிப்பாடு மூலத்திலுள்ள இரண்டு வினைச்சொற்களையும் பேணுகிறது. ‘நல்ல முதிர்வயதில்’ மற்றும் ‘வயது முதிர்ந்து’ என்ற மீளுரைப்பும் எபிரெயத்தின் திட்டமிட்ட விவரண அடுக்கை பிரதிபலிக்கிறது.
