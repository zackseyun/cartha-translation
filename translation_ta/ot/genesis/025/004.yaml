translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாக வாசிக்கக்கூடிய, அதே நேரத்தில் வம்சப்பட்டியலின் சுருக்கமான அமைப்பையும் ‘மகன்கள்’ என்ற துல்லியத்தையும் காக்கும் நடை. ஆங்கில ஆலோசனை உரையில் அடிக்குறி குறியீடு ‘Ephah’ என்பதற்குப் பின் இருந்தாலும், அதன் உள்ளடக்கம் חֲנֹךְ பற்றியது என்பதால் தமிழில் அது ‘ஹனோக்கு’ என்பதற்குப் பின் பொருத்தப்பட்டுள்ளது.
