  yaml_path: translation/ot/genesis/025/004.yaml
  text: And the sons of Midian were Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.
translation:
  language: ta
  text: 'மிதியானின் மகன்கள்: ஏஃபா, ஏஃபேர், ஹனோக்கு[a], அவீதா, எல்தா ஆகியோர். இவர்கள் அனைவரும் கெத்தூராவின் மகன்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில மரபு மொழிபெயர்ப்புகளில் இந்தப் பெயர் ‘ஏனோக்கு’ என்று வழங்கப்படுகிறது; எபிரெய வடிவம் ‘ஹனோக்கு’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: மிதியானின் மகன்கள்
  rationale: வம்சப்பட்டியல் சூழலில் בְּנֵי என்பதன் ஆண்பால் பன்மையையும் உறவையும் நேரடியாகக் காட்டுகிறது; தொடக்க ו இணைப்பைத் தமிழின் இயல்பான தொடரமைப்பு வெளிப்படுத்துகிறது.
- source_word: עֵיפָה
  choice: ஏபா
  rationale: எபிரெயப் பெயரின் ஒலியை நவீன தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
- source_word: עֵפֶר
  choice: ஏபெர்
  rationale: எபிரெய உச்சரிப்பை நெருக்கமாகப் பிரதிபலிக்கும் தமிழாக்கம்.
- source_word: חֲנֹךְ
  choice: ஹனோக்கு
  rationale: חֲנֹךְ என்ற எபிரெய வடிவத்தை நேரடியாகப் பிரதிபலிக்கிறது; மரபாகப் பயன்படும் ‘ஏனோக்கு’ என்ற வடிவத்துடன் காரணமின்றி ஒன்றுபடுத்தவில்லை.
- source_word: אֲבִידָע
  choice: அபிதா
  rationale: எபிரெயப் பெயரின் மெய் மற்றும் உயிர் ஒலிகளைத் தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: אֶלְדָּעָה
  choice: எல்தாகா
  rationale: பெயரிலுள்ள דּ மற்றும் ע ஒலித்தொடரைத் தமிழில் வாசிக்கத்தக்க வகையில் நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: כָּל אֵלֶּה
  choice: இவர்கள் அனைவரும்
  rationale: பட்டியலிடப்பட்ட நபர்களைத் தொகுத்துச் சுட்டும் எபிரெயச் சொற்றொடரின் முழுமையான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בְּנֵי קְטוּרָה
  choice: கெத்தூராவின் மகன்கள்
  rationale: எபிரெய வம்சப்பட்டியல் அமைப்பை நேரடியாகக் காக்கிறது; קְטוּרָה என்ற பெயரை ஒலியடிப்படையில் எழுத்துப்பெயர்க்கிறது.
