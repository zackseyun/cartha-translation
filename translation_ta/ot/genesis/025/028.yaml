base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/028.yaml
  text: Isaac loved Esau because game was in his mouth[a], but Rebekah loved Jacob.
translation:
  language: ta
  text: வேட்டையாடிய இரை அவன் வாயில் இருந்ததால்[a], ஈசாக்கு ஏசாவை நேசித்தான்; ஆனால் ரெபெக்காள் யாக்கோபை நேசித்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘வேட்டையாடிய இரை அவன் வாயில் இருந்ததால்.’ ஏசா கொண்டுவந்த வேட்டையாடிய இரையை ஈசாக்கு விரும்பி உண்டதால் அவன் ஏசாவை விரும்பினான் என்பது இந்தச் சொற்றொடரின் சாத்தியமான பொருள்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: நேசித்தான்
  rationale: ஆண்பால் ஒருமை Qal wayyiqtol வடிவம் கடந்தகாலக் கதைநிகழ்வை இயல்பாகக் குறிக்கிறது.
- source_word: אֶת עֵשָׂו
  choice: ஏசாவை
  rationale: אֶת மொழிபெயர்க்கப்படாமல், தமிழில் நேர்ச்செயப்படுபொருளைக் குறிக்கும் ‘ஐ’ உருபு பெயருடன் சேர்க்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: என்பதால்
  rationale: ஈசாக்கு ஏசாவை நேசித்ததற்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צַיִד
  choice: வேட்டையாடிய இறைச்சி
  rationale: வேட்டையால் கிடைத்த இரை அல்லது உணவைக் குறிக்கிறது. ‘மான் இறைச்சி’ என்று பொருளைக் குறுக்காமல், வேட்டையாடிக் கொண்டுவந்த மாமிச உணவு என்ற பரந்த பொருளைத் தருகிறது.
- source_word: בְּפִיו
  choice: அவன் வாயில் இருந்தது
  rationale: ‘அவனுடைய வாயில்’ என்ற எபிரெய மொழியின் தெளிவான உருவகப் படிமத்தைப் பாதுகாக்கிறது; இதை ‘அவனுக்குப் பிடித்திருந்தது’ என்று உரையிலேயே விளக்கி ambiguity-ஐ நீக்கவில்லை.
- source_word: וְרִבְקָה
  choice: ஆனால் ரெபெக்காள்
  rationale: וְ அடிப்படையில் ‘மற்றும்’ என்றாலும், இங்கு தந்தை மற்றும் தாயின் மாறுபட்ட விருப்பங்களை எதிர்மறையாக இணைக்கிறது; ‘ஆனால்’ அந்த உரையாடல் உறவை இயல்பாகக் காட்டுகிறது.
- source_word: אֹהֶבֶת
  choice: நேசித்தாள்
  rationale: பெண்பால் ஒருமை participle தொடர்ச்சியான அல்லது வழக்கமான நேசத்தைச் சுட்டலாம்; கடந்தகாலக் கதைச்சூழலில் ‘நேசித்தாள்’ இயல்பான தமிழ் வடிவம்.
- source_word: אֶת יַעֲקֹב
  choice: யாக்கோபை
  rationale: אֶת தனியாக மொழிபெயர்க்கப்படாமல், தமிழின் நேர்ச்செயப்படுபொருள் ‘ஐ’ உருபு பெயருடன் சேர்க்கப்பட்டுள்ளது.
