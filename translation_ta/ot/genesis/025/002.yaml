translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிமையும் கொண்ட மரபுவழிப் பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் ஆங்கில வடிவிலிருந்து அல்லாமல் எபிரேய மூலத்தின் ஒலியமைப்பை முன்னிறுத்தி தமிழாக்கப்பட்டுள்ளன. ‘ஆகியோரை’ என்பது பட்டியலை இயல்பாக முடித்து, குறிப்பிடப்பட்ட அனைவரும் ‘பெற்றாள்’ என்பதன் செயப்படுபொருள்கள் என்பதைத் தெளிவாக்குகிறது.
