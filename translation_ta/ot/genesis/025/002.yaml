translation:
  language: ta
  text: அவள் அவருக்குச் சிம்ரான், யொக்சான், மெதான், மிதியான், யிஷ்பாக், சூவா ஆகியோரைப் பெற்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: பெற்றாள்
  rationale: ילד என்பதன் Qal wayyiqtol மூன்றாம் நபர் பெண்பால் ஒருமை வடிவம்; பெண் ஒருத்தி கடந்த காலத்தில் பிள்ளைகளைப் பெற்ற நிகழ்வைச் சுருக்கமாகக் கூறுகிறது. தமிழ் மரபுவழிப் பட்டியல் நடையில் ‘பெற்றாள்’ இயல்பாகவும் தாய்மைப் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: לוֹ
  choice: அவருக்கு
  rationale: ילד வினையுடன் வரும் לְ மற்றும் ஆண்பால் ஒருமை பின்னொட்டு, பிள்ளைகளின் தந்தையைக் குறிக்கிறது. தமிழில் ‘அவருக்கு ... பெற்றாள்’ என்பது அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶת
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: ஒவ்வொரு பெயருக்கும் முன் வரும் நேரடி செயப்படுபொருள் குறியீடு; தமிழில் தனிச் சொல்லாக இதற்கு இணை தேவையில்லை. பெயர்ப்பட்டியலின் வேற்றுமை அமைப்பில் அதன் பணி வெளிப்படுகிறது.
- source_word: זִמְרָן
  choice: சிம்ரான்
  rationale: எபிரேய தனிப்பெயரின் ஒலியை நவீனத் தமிழ் எழுத்துமுறைக்கு ஏற்றவாறு ஒலிபெயர்த்துள்ளது.
- source_word: יָקְשָׁן
  choice: யொக்சான்
  rationale: எபிரேய யோத் தொடக்கத்தையும் qoph மற்றும் shin ஒலிகளையும் தமிழில் நெருக்கமாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: מְדָן
  choice: மேதான்
  rationale: தனிப்பெயரை மூல எபிரேய உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்த்துள்ளது; அடுத்த பெயரான மீதியானிலிருந்து வேறுபாடும் காக்கப்படுகிறது.
- source_word: מִדְיָן
  choice: மீதியான்
  rationale: எபிரேய மִדְיָן என்ற தனிப்பெயரின் மெய் மற்றும் உயிர் அமைப்பைத் தமிழில் தெளிவாக ஒலிபெயர்க்கிறது.
- source_word: יִשְׁבָּק
  choice: இஸ்பாக்
  rationale: எபிரேய தனிப்பெயரைத் தமிழ் வாசிப்புக்கு ஏற்றபடி ஒலிபெயர்த்துள்ளது; தொடக்க யோத்தின் குறில் உயிரொலி தமிழில் ‘இ’ எனத் தரப்பட்டுள்ளது.
- source_word: שׁוּחַ
  choice: சூவா
  rationale: நீண்ட ū உயிரையும் இறுதி ח ஒலியின் மென்மையான வெளிப்பாட்டையும் தமிழ் வாசிப்புக்கு இயல்பாகக் காட்டும் ஒலிபெயர்ப்பு.
