  text: וַ/יְהִ֤י יִצְחָק֙ בֶּן אַרְבָּעִ֣ים שָׁנָ֔ה בְּ/קַחְתּ֣/וֹ אֶת רִבְקָ֗ה בַּת בְּתוּאֵל֙ הָֽ/אֲרַמִּ֔י מִ/פַּדַּ֖ן אֲרָ֑ם אֲח֛וֹת לָבָ֥ן הָ/אֲרַמִּ֖י ל֥/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/020.yaml
  text: Isaac was forty years old when he took Rebekah[a], the daughter of Bethuel the Aramean from Paddan-aram, the sister of Laban the Aramean[b], to be his wife.
translation:
  language: ta
  text: ஈசாக்கு நாற்பது வயதுடையவனாக இருந்தபோது, பதான்-அராமைச் சேர்ந்த அரமேயனான பெத்துவேலின் மகளும், அரமேயனான லாபானின் சகோதரியுமான ரெபெக்காளைத் தனக்கு மனைவியாக எடுத்துக்கொண்டான்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் வழக்கமான தமிழில், ‘ரெபெக்காளை மணந்துகொண்டான்’ என்றும் கூறலாம். எபிரேயம் சொல்லுக்குச் சொல், ‘ரெபெக்காளைத் தனக்கு மனைவியாக எடுத்துக்கொண்டான்’ என்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அரமேயன்’ என்பது பழைய மரபுவழி மொழிபெயர்ப்பான ‘சீரியன்’ என்பதைவிட எபிரேய இனப்பெயரைத் துல்லியமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יִצְחָק בֶּן אַרְבָּעִים שָׁנָה
  choice: ஈசாக்கு நாற்பது வயதானபோது
  rationale: எபிரேய வயதுக் குறிப்பான ‘நாற்பது ஆண்டுகளின் மகன்’ என்பதை இயல்பான நவீனத் தமிழில் ‘நாற்பது வயது’ என்று வழங்குகிறது; וַיְהִי இங்கு நிகழ்வின் காலத்தை அறிமுகப்படுத்துகிறது.
- source_word: בְּקַחְתּוֹ ... לְאִשָּׁה
  choice: தனக்கு மனைவியாக எடுத்துக்கொண்டான்
  rationale: לקח என்பதன் ‘எடுத்துக்கொள்’ என்ற அடிப்படைப் பொருளையும், திருமணச் சூழலைத் தெளிவாக்கும் לְאִשָּׁה என்பதையும் ஒன்றாகப் பாதுகாக்கிறது.
- source_word: רִבְקָה
  choice: ரெபெக்காள்
  rationale: எபிரேயப் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: בַּת בְּתוּאֵל
  choice: பெத்துவேலின் மகள்
  rationale: வம்ச உறவைக் குறிப்பிடும் எபிரேய அமைப்பை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: הָאֲרַמִּי
  choice: அரமேயன்
  rationale: אֲרַמִּי குறிக்கும் இன அடையாளத்தை வரலாற்றுத் துல்லியத்துடன் வழங்குகிறது; பழைய ‘சீரியன்’ என்ற மொழிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: מִפַּדַּן אֲרָם
  choice: பதான் அராமைச் சேர்ந்த
  rationale: இடப்பெயரை மொழிபெயர்க்காமல் ஒலிபெயர்த்து, מִן காட்டும் பிறப்பிடம் அல்லது சேர்ந்த இடம் என்ற உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲחוֹת לָבָן
  choice: லாபானின் சகோதரி
  rationale: எபிரேய உறவுமுறைக் குறிப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לוֹ
  choice: தனக்கு
  rationale: திருமணச் சூத்திரத்தில் ஈசாக்குக்குரிய மனைவியாகும் உறவைத் தமிழின் தற்சுட்டுப் பெயரால் தெளிவாகக் காட்டுகிறது.
