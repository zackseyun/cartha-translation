translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. நீண்ட வம்சவழித் தொடரைத் தமிழில் வாசிக்க எளிதாக ‘மகளும் ... சகோதரியுமான’ என்ற இணை அமைப்பில் வழங்கி, மூலத்தின் இரு அடையாளக் குறிப்புகளையும் பாதுகாக்கிறது.
