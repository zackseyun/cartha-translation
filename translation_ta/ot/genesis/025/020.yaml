  to: ஈசாக்கு நாற்பது வயதுடையவனாக இருந்தபோது, பதான்-அராமைச் சேர்ந்த அரமேயனான பெத்துவேலின் மகளும், அரமேயனான லாபானின் சகோதரியுமான ரெபெக்காளைத் தனக்கு மனைவியாக எடுத்துக்கொண்டான்[a][b].
