source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר יַעֲקֹ֑ב מִכְרָ֥/ה כַ/יּ֛וֹם אֶת בְּכֹֽרָתְ/ךָ֖ לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/031.yaml
  text: Jacob said[a], “Sell me your birthright today.”
translation:
  language: ta
  text: யாக்கோபு, “இன்றே உன் முதற்பிறந்தவனுக்குரிய உரிமையை எனக்கு விற்றுவிடு” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுத்துச் செல்கிறது. இயல்பான தமிழ் உரையாடல் அமைப்பில் மேற்கோளுக்குப் பின் வரும் ‘என்றான்’ இதைத் தெளிவாகக் காட்டுகிறது.
- source_word: יַעֲקֹב
  choice: யாக்கோபு
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்பட்ட பெயர்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: מִכְרָה
  choice: விற்றுவிடு
  rationale: מכר என்பதன் ஆண்பால் ஒருமை கட்டளை வடிவம் ‘விற்’ என்பதாகும். ‘விற்றுவிடு’ என்பது பரிவர்த்தனையை நிறைவேற்றுமாறு கோரும் உடனடியான, நேரடியான தொனியை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இறுதியிலுள்ள paragogic ה-க்கு தனி பொருள் சேர்க்கப்படவில்லை.
- source_word: כַיּוֹם
  choice: இன்றே
  rationale: இந்தச் சூழலில் כַּיּוֹם உடனடியாகவும் அன்றே கட்டுப்படுத்தும் வகையிலும் செய்யப்படும் பரிவர்த்தனையை வலியுறுத்துகிறது. ‘இன்றே’ அந்த வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; மாற்று நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֶת
  choice: '[நேரடிச் செயப்படுபொருள் குறியீடு; மொழிபெயர்க்கப்படவில்லை]'
  rationale: אֶת உறுதியான நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கணச் சொல்; தமிழில் இதற்குத் தனிச்சொல் தேவையில்லை.
- source_word: בְּכֹרָתְךָ
  choice: உன் தலைமகன் உரிமை
  rationale: בְּכֹרָה குடும்பத்தின் முதற்பிறந்த மகனுக்குரிய நிலை, உரிமைகள், சலுகைகள் ஆகியவற்றைக் குறிக்கிறது. ‘தலைமகன் உரிமை’ என்பது இதை நவீன, புரிந்துகொள்ளக்கூடிய தமிழில் தெரிவிக்கிறது.
- source_word: לִי
  choice: எனக்கு
  rationale: לִי பரிவர்த்தனையின் பெறுநராக யாக்கோபைக் குறிக்கிறது. தமிழில் ‘எனக்கு விற்றுவிடு’ என்பது இயல்பான சொற்றொடர்.
