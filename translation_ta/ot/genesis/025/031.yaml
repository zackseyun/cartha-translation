- from: யாக்கோபு, “இன்றே உன் தலைமகன் உரிமையை எனக்கு விற்றுவிடு[a]” என்றான்.
  to: யாக்கோபு, “இன்றே உன் முதற்பிறந்தவனுக்குரிய உரிமையை எனக்கு விற்றுவிடு” என்றான்.
  rationale: The revision retains the direct imperative and the contextually immediate force of כַּיּוֹם. It replaces a potentially ambiguous expression for the birthright with a precise modern Tamil equivalent and corrects the footnote so that it offers ‘this day/as of this day’ without adding the unsupported sense ‘from today onward.’
