  register: நவீன தரத் தமிழ்; எளிமையானாலும் கண்ணியமான கதைநடை. எபிரெய வாக்கியத் தொடக்கத்தின் தொடர்ச்சித் தொடர்பைத் தமிழில் இயல்பாகக் காட்ட ‘அப்போது’ இரண்டாம் வாக்கியத்தில் பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் தனியான ‘இப்போது’ என்ற காலச்சொல் இல்லை. மூலத்தின் இரண்டு இணைக்கப்பட்ட நிகழ்வுகள் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளன.
