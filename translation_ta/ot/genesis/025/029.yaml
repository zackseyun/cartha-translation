  text: וַ/יָּ֥זֶד יַעֲקֹ֖ב נָזִ֑יד וַ/יָּבֹ֥א עֵשָׂ֛ו מִן הַ/שָּׂדֶ֖ה וְ/ה֥וּא עָיֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/029.yaml
  text: Jacob was cooking a stew[a], and Esau came in from the field[c][b], and he was exhausted.
translation:
  language: ta
  text: யாக்கோபு ஒரு குழம்பைச் சமைத்துக்கொண்டிருந்தான்[a]; ஏசா வயல்வெளியிலிருந்து[b] வந்தான்; அவன் களைத்திருந்தான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு கொதிக்கவைத்த உணவைச் சமைத்துக்கொண்டிருந்தான்.” எபிரெய வினைச்சொல் கொதிக்கவைத்துச் சமைப்பதைக் குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வயலிலிருந்து.” இச்சொல் சூழலைப் பொறுத்து திறந்த வெளி அல்லது நாட்டுப்புறப் பகுதியையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “சோர்ந்திருந்தான்” அல்லது “தளர்ந்துபோயிருந்தான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּזֶד
  choice: வேகவைத்துக்கொண்டிருந்தான்
  rationale: זיד இச்சூழலில் உணவை நீரில் கொதிக்கவைத்து சமைப்பதைக் குறிக்கிறது. தொடர்ச்சியாக நடந்துகொண்டிருந்த பின்னணிச் செயலை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: נָזִיד
  choice: ஒரு கூழை
  rationale: נָזִיד என்பது கொதிக்கவைத்துத் தயாரிக்கும் கெட்டியான உணவு. ‘கூழ்’ என்பது இங்கு இயல்பான, பொதுமக்களுக்கு எளிதில் புரியும் தமிழ்ச் சொல்; அதன் துல்லியமான தன்மை சூழலில் முழுமையாகத் தீர்மானிக்கப்படாததால் அடிக்குறிப்பு மாற்றுவழியைத் தருகிறது.
- source_word: וַיָּבֹא
  choice: வந்தான்
  rationale: בוא என்பதன் அடிப்படைப் பொருள் ‘வருதல்/உள்ளே வருதல்’. எங்கிருந்து வந்தான் என்பது அடுத்த சொற்றொடரில் தெளிவாக இருப்பதால் தமிழில் ‘வந்தான்’ இயல்பாக உள்ளது.
- source_word: מִן הַשָּׂדֶה
  choice: வெளியிலிருந்து
  rationale: הַשָּׂדֶה இங்கு வயல் மட்டுமல்லாது திறந்த வெளி அல்லது நாட்டுப்புறப் பகுதியையும் குறிக்கக்கூடும். ஏசாவின் வேட்டையாடும் சூழலுக்கு ஏற்றவாறு ‘வெளியிலிருந்து’ அந்தப் பரப்பை இயல்பாகக் குறிக்கிறது; நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְהוּא עָיֵף
  choice: அவன் மிகவும் களைத்திருந்தான்
  rationale: עָיֵף உடல் சோர்வு, களைப்பு, சில சூழல்களில் தளர்ச்சி ஆகியவற்றைக் குறிக்கிறது. அடுத்த வசனத்தின் தீவிரத்துக்கு ஏற்ற அளவை ‘மிகவும் களைத்திருந்தான்’ இயல்பாக வெளிப்படுத்துகிறது.
