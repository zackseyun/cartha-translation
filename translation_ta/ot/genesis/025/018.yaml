- from: அவர்கள் ஆவிலா தொடங்கி, எகிப்துக்கு எதிரே அசூர் நோக்கிச் செல்லும் வழியில் உள்ள சூர் வரை குடியேறினார்கள். அவன் தன் சகோதரர்கள் அனைவருக்கும் எதிரே குடியேறினான்[a].
  to: அவர்கள் ஆவிலாவிலிருந்து சூர்வரை குடியேறினார்கள். சூர் எகிப்துக்கு எதிரே, அசூர்[b] நோக்கிச் செல்லும் வழியில் உள்ளது. அவன் தன் சகோதரர்கள் அனைவருக்கும் எதிரே குடியேறினான்[a].
  rationale: சூரை விளக்கும் புவியியல் தொடர்புச் சொற்றொடர் தெளிவாகப் படுமாறு வாக்கிய அமைப்பு சீரமைக்கப்பட்டது. அசூர்/அசீரியா என்ற audit-trail பெயரியல் மாற்று அடிக்குறிப்பாகச் சேர்க்கப்பட்டது. இறுதித் தொடரின் விவாதத்திற்குரிய இடவியல்/பகைமை இருபொருள் வாய்ப்பும், நָפָל வினையின் வழக்கமான சொற்பொருளும் மாற்றமின்றிக் காக்கப்பட்டன.
