base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/018.yaml
  text: They settled from Havilah to Shur[a], which is opposite Egypt as you go toward Asshur[b]. He settled opposite all his brothers.
translation:
  language: ta
  text: அவர்கள் ஆவிலாவிலிருந்து சூர்வரை குடியேறினார்கள். சூர் எகிப்துக்கு எதிரே, அசூர்[b] நோக்கிச் செல்லும் வழியில் உள்ளது. அவன் தன் சகோதரர்கள் அனைவருக்கும் எதிரே குடியேறினான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எதிரே” என்பது இங்கு இடத்தைக் குறிக்கலாம்; “எதிராக” என்ற பகைமை சார்ந்த பொருளும் சாத்தியம். “குடியேறினான்” என மொழிபெயர்க்கப்பட்ட எபிரெய வினைச்சொல்லின் வழக்கமான பொருள் “விழுந்தான்” என்பதாகும்.
    reason: alternative_reading
  - marker: b
    text: “அசூர்” என்பதை “அசீரியா” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּנוּ
  choice: குடியேறினார்கள்
  rationale: שׁכן என்பதன் பன்மை வினை இங்கு ஒரு நிலப்பரப்பில் தங்கி வாழ்வதைக் குறிக்கிறது; “குடியேறினார்கள்” என்பது அந்தப் புவியியல் சூழலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: מֵחֲוִילָה עַד שׁוּר
  choice: ஆவிலா தொடங்கி ... சூர் வரை
  rationale: வாழ்ந்த நிலப்பரப்பின் எல்லையைச் சுட்டும் எபிரெய வரம்புச் சொற்றொடர் தமிழில் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרַיִם
  choice: எகிப்துக்கு எதிரே ... உள்ள
  rationale: עַל־פְּנֵי என்பதன் “முகத்திற்கு முன்/எதிரே” என்ற புவியியல் பொருளைத் திசையை அளவுக்கு மீறிக் குறிப்பாக்காமல் காக்கிறது.
- source_word: בֹּאֲכָה אַשּׁוּרָה
  choice: அசூர் நோக்கிச் செல்லும் வழியில்
  rationale: திசை குறிக்கும் இறுதி எழுத்துடன் உள்ள வடிவம் அசூரை நோக்கிய இயக்கத்தைக் குறிக்கிறது; அசூர் என்பது பெயரொலிப்பாக வைக்கப்பட்டுள்ளது.
- source_word: עַל־פְּנֵי כָל־אֶחָיו
  choice: தன் சகோதரர்கள் அனைவருக்கும் எதிரே
  rationale: இது இடநிலையையோ எதிர்ப்பான உறவையோ குறிக்கக்கூடிய சொற்றொடர். “எதிரே” இரு சாத்தியங்களையும் முழுமையாகத் தீர்மானிக்காமல் காக்கிறது.
- source_word: נָפָל
  choice: குடியேறினான்
  rationale: נפל பொதுவாக “விழுந்தான்” என்று பொருள்பட்டாலும், இச்சூழலில் இஸ்மவேல் தன் உறவினருக்கு எதிரே/முன்பாகத் தங்கி வாழ்ந்ததைக் குறிக்கும் மரபுத்தொடரின் ஓர் அங்கமாகப் புரிந்துகொள்ளப்படுகிறது. ஒருமை வினை மீண்டும் இஸ்மவேலைக் குறிக்கிறது.
theological_decisions:
- issue: עַל־פְּנֵי כָל־אֶחָיו נָפָל என்ற இறுதித் தொடரின் பொருள்
  choice: அவன் தன் சகோதரர்கள் அனைவருக்கும் எதிரே குடியேறினான்
  alternative: அவன் தன் சகோதரர்கள் அனைவருக்கும் எதிராக வாழ்ந்தான்; அல்லது, சொற்படியாக, அவன் தன் சகோதரர்கள் அனைவருக்கும் முன்பாக விழுந்தான்
  rationale: ஆதியாகமம் 16:12-ன் பின்னணியில் பகைமை சார்ந்த பொருள் சாத்தியமானது; எனினும் எபிரெயத் தொடர் புவியியல் இடநிலையையும் குறிக்கலாம். ஆகவே முதன்மை உரை “எதிரே” என்று ambiguity-ஐ காக்கிறது; மரபுத்தொடரின் சிக்கல் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு ஆவிலா, சூர், அசூர் என ஒலிபெயர்க்கப்பட்டுள்ளன. வசனத்தின் விவாதத்திற்குரிய இறுதித் தொடர் ஒரே விளக்கமாக முடிவுசெய்யப்படாமல் முதன்மை உரையிலும் அடிக்குறிப்பிலும் அதன் இருபொருள் வாய்ப்பு காக்கப்பட்டுள்ளது.
