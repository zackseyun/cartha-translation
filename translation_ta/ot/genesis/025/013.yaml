base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/013.yaml
  text: 'And these are the names of the sons of Ishmael[a], by their names according to their generations: the firstborn of Ishmael was Nebaioth, and Kedar, and Adbeel, and Mibsam.'
translation:
  language: ta
  text: 'இஸ்மவேலின் மகன்களின் பெயர்கள் இவை; பெயர்வாரியாகவும் அவர்களுடைய தலைமுறை வரிசைகளின்படியும்[a]: இஸ்மவேலின் முதற்பேறானவன் நெபாயோத்; மேலும் கேதார், அத்பெயேல், மிப்சாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய சந்ததி வரிசைகளின்படி.” எபிரெயச் சொல் மரபுவழியான வம்சத் தொடரையோ தலைமுறைகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவையே
  rationale: புதிய பெயர்ப்பட்டியலை அறிமுகப்படுத்தும் எபிரெயச் சொல்லமைப்பை இயல்பான நவீனத் தமிழில் தருகிறது; முன்சூழலுடனான தொடர்ச்சி பட்டியல் வடிவத்திலேயே வெளிப்படுகிறது.
