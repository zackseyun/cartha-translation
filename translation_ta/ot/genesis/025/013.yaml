- source_word: בִּשְׁמֹתָם
  choice: அவரவர் பெயர்களின்படி
  rationale: ‘அவர்களுடைய பெயர்களின்படி’ என்ற மூலத்தின் மீளுரைப்பைத் தக்கவைத்தபடியே தமிழில் ஒவ்வொருவரின் தனிப்பெயரைக் குறிக்கும் இயல்பான வடிவமாக உள்ளது.
