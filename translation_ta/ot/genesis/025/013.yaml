- source_word: נְבָיֹת
  choice: நெபாயோத்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பை அண்மையாகப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: קֵדָר
