translation:
  language: ta
  text: ஆபிரகாம் இன்னொரு மனைவியை மணந்தார்[a]. அவளுடைய பெயர் கெத்தூராள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆபிரகாம் மீண்டும் ஒரு மனைவியை மணந்தார்.” எபிரெயத்தில், ‘ஆபிரகாம் சேர்த்தார்; ஒரு மனைவியை எடுத்தார்’ என்ற சேர்க்கைச் சொல்லமைப்பு உள்ளது.
    reason: וַיֹּסֶף ... וַיִּקַּח என்பதிலுள்ள சேர்த்தல்/மீண்டும் செய்தல் என்ற நுட்பத்தையும் மாற்று மொழிபெயர்ப்பையும் காட்டுகிறது.
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: மறுபடியும்
  rationale: יסף என்பதன் சேர்த்தல் அல்லது மீண்டும் செய்தல் என்ற நுட்பத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எபிரெய மொழியின் ‘சேர்த்து... எடுத்தார்’ என்ற சொல்லமைப்பைச் செயற்கையாகப் பிரதிபலிக்கவில்லை.
- source_word: וַיִּקַּח
  choice: ஏற்றுக்கொண்டார்
  rationale: אִשָּׁה என்பதுடன் வரும் לקח, ஒருவரை மனைவியாகக் கொள்வதைக் குறிக்கும் வழக்குச் சொற்றொடர். ‘ஏற்றுக்கொண்டார்’ என்பது திருமணப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אִשָּׁה
  choice: ஒரு மனைவியை
  rationale: לקח உடன் வரும் இச்சூழலில் אִשָּׁה என்பது பொதுவாக ‘பெண்’ என்பதல்ல, ‘மனைவி’ என்பதே.
- source_word: וּשְׁמָהּ
  choice: அவள் பெயர்
  rationale: எளிய எபிரெய பெயரறிமுகக் கூற்றைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: קְטוּרָה
  choice: கெத்தூராள்
  rationale: தமிழ் வேதாகமப் பெயர்வழக்கில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: וַיֹּסֶף என்பதன் சேர்த்தல்/மீண்டும் செய்தல் சார்ந்த பொருளை எவ்வாறு வெளிப்படுத்துவது
  choice: ஆபிரகாம் மறுபடியும் ஒரு மனைவியை ஏற்றுக்கொண்டார்
  alternative: ஆபிரகாம் இன்னொரு மனைவியை ஏற்றுக்கொண்டார்
  rationale: மூலத்தில் உள்ள additive/repetitive நுட்பத்தை ‘மறுபடியும்’ பாதுகாக்கிறது; இது முந்தைய மனைவிகளுடனான கால அல்லது சட்ட உறவை உரை கூறுவதைவிட அதிகமாகத் தீர்மானிக்காது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியக்கூடிய, இயல்பான, கண்ணியமான நடை. ‘மறுபடியும்’ மூலத்தின் உண்மையான நுட்பத்தைப் பாதுகாக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
