  text: וְ/אֵ֛לֶּה תֹּלְדֹ֥ת יִשְׁמָעֵ֖אל בֶּן אַבְרָהָ֑ם אֲשֶׁ֨ר יָלְדָ֜ה הָגָ֧ר הַ/מִּצְרִ֛ית שִׁפְחַ֥ת שָׂרָ֖ה לְ/אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/012.yaml
  text: These are the generations of Ishmael[a], Abraham’s son, whom Hagar the Egyptian, Sarah’s servant woman[b], bore to Abraham.
translation:
  language: ta
  text: சாராவின் அடிமைப் பெண்ணான[b] எகிப்தியப் பெண் ஆகார் ஆபிரகாமுக்குப் பெற்ற மகனான இஸ்மவேலின் வம்சவரலாறு[a] இதுவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்மவேலின் சந்ததியினர் இவர்கள்.” “வம்சவரலாறு” என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் (தோல்தோத்) ஆதியாகமத்தில் திரும்பத் திரும்ப வரும் ஒரு பகுதித் தலைப்பு; அது “சந்ததியினர்” அல்லது “குடிவழி” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சாராவின் பணிப்பெண்.” இங்குள்ள எபிரெயச் சொல் ஒரு பெண் அடிமையை அல்லது கட்டுப்பட்ட பெண் பணியாளரைச் சுட்டுகிறது; அவளுடைய அடிமை நிலையை வெளிப்படையாகக் காக்க “அடிமைப் பெண்” பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: இதுவே
  rationale: இது ஆதியாகமத்தில் ஒரு புதிய வம்சப் பகுதியை அறிமுகப்படுத்தும் சூத்திரம். எபிரெய இணைப்புச் சொல்லைத் தனியாக ‘மேலும்’ என்று மொழிபெயர்க்காமல், தமிழில் இயல்பான தலைப்பு நடையில் கொடுக்கிறது.
- source_word: תֹּלְדֹת
  choice: வம்சவரலாறு
  rationale: இந்தச் சொல் சந்ததியினரை மட்டுமல்லாமல் அவர்களைக் குறித்த தொடரும் வரலாற்றையும் சுட்டக்கூடிய ஆதியாகமத்தின் முக்கிய அமைப்புச் சொல்; ‘வம்சவரலாறு’ அதன் இரு பரிமாணங்களையும் ஓரளவு காக்கிறது.
- source_word: יִשְׁמָעֵאל
  choice: இஸ்மவேல்
  rationale: தமிழில் நிலைபெற்ற வேதாகமப் பெயர் வடிவம்.
- source_word: בֶּן אַבְרָהָם
  choice: ஆபிரகாமின் மகன்
  rationale: எபிரெய இணைப்புநிலை உறவை இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר יָלְדָה
  choice: ஆகார் ... பெற்றெடுத்த
  rationale: வினைச்சொல்லின் பெண்பால் எழுவாயான ஆகாரைத் தெளிவாக வைத்தும், தாயின் பிள்ளைப்பேற்றை இயல்பான தமிழில் கூறியும் உள்ளது.
- source_word: הַמִּצְרִית
  choice: எகிப்தியப் பெண்
  rationale: ஆகாரின் இன/நாட்டுச் சார்பைத் தெளிவாகவும் இயல்பாகவும் குறிப்பிடுகிறது.
- source_word: שִׁפְחַת שָׂרָה
  choice: சாராவின் அடிமைப் பெண்
  rationale: שִׁפְחָה குறிக்கும் கட்டுப்பட்ட அடிமை நிலையைக் ‘வேலைக்காரி’ போன்ற மென்மைப்படுத்தப்பட்ட சொல்லைவிடத் தெளிவாகக் காக்கிறது.
- source_word: לְאַבְרָהָם
  choice: ஆபிரகாமுக்கு
  rationale: பிள்ளைப்பேற்றுச் சூழலில் தந்தையாகிய ஆபிரகாமுடனான உறவை எபிரெய முன்னிடைச்சொல்லுக்கு ஏற்றவாறு காட்டுகிறது.
theological_decisions:
- issue: ஆகாரின் சமூக நிலையை மொழிபெயர்த்தல்
  choice: அடிமைப் பெண்
  alternative: வேலைக்காரி / பணிப்பெண்
  rationale: மூலச்சொல் சுதந்திரமான வீட்டு ஊழியரைக் காட்டாமல் உரிமைக் கட்டுப்பாட்டுக்குட்பட்ட பெண்ணைக் குறிக்கிறது; ஆகவே வரலாற்று மற்றும் சமூகத் தீவிரத்தை மென்மைப்படுத்தவில்லை.
translation_notes:
  register: நவீன செந்தமிழ்ச் சார்புடைய, ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. மூலத்தின் உறவுப்பெயர்களையும் ஆபிரகாம் என்ற பெயர் மீண்டும் வருவதையும் காத்து, நீண்ட எபிரெய உறவுத்தொடரை தமிழில் வாசிக்கத்தக்க வகையில் அமைத்துள்ளது.
