translation_notes:
  register: நவீன, பொதுவாகப் புரியும், ஆனால் கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஏசாவின் அவசரமும் சற்றுக் கரடுமுரடான பேச்சும் ‘விழுங்கக் கொடு’ என்ற சொற்றொடராலும் ‘சிவப்பானதை’ என்ற இரட்டிப்பாலும் தக்கவைக்கப்பட்டுள்ளன. ‘ஏதோம்’ என்ற பெயருக்கான காரணத்தைச் சொல்லும் இறுதி வாக்கியம் மூலத்தின் பெயரிடும் நடையைப் பாதுகாக்கிறது.
