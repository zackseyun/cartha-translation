  source_fidelity: மூலத்தின் உணவுப் பெயரற்ற ‘சிவப்பு, சிவப்பு’ என்ற மீளுரையும் ஏசாவின் களைப்பும் சரியாகத் தக்கவைக்கப்பட்டுள்ளன. ஆனால் ‘கொஞ்சம் எனக்கு விழுங்கக் கொடு’ என்ற சொல்வரிசை இயல்பாக இல்லை; נָא-வின் வேண்டுகோள் நுணுக்கமும் தெளிவாகத் தெரிவதில்லை. பெயரிடும் இறுதி வாசகத்தின் செயப்பாட்டு வடிவம் மூலத்தின் பெயரிடும் வழக்கிற்கு ஏற்றது.
  naturalness: திருத்தப்பட்ட வாசகம் நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது; ‘நான் விழுங்கக் கொடு’ என்பது ஏசாவின் அவசரமான, கரடுமுரடான வேண்டுகோளை வெளிப்படுத்துகிறது. மீளுரை இடைக்கோட்டால் பாதுகாக்கப்படுகிறது.
  terminology: ‘ஏசா,’ ‘யாக்கோபு,’ ‘ஏதோம்’ ஆகிய பெயர்கள் நிலையான தமிழ்வேதாகமப் பயன்பாட்டுக்கு ஏற்றவை. ‘ஏதோம்’ என்பது எபிரெய ‘சிவப்பு’ சொல்லுடன் ஒலிப்பொருத்தம் மட்டுமல்ல, அதே சொல்வடிவத்திலான சொல்விளையாட்டு என்பதால் அடிக்குறிப்பு அவ்வாறு துல்லியப்படுத்தப்பட்டுள்ளது.
