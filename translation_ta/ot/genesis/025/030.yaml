base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/030.yaml
  text: Esau said to Jacob[a], “Please let me gulp down some of that red stuff, that red stuff there[c][b], because I am exhausted.” Therefore his name was called Edom.
translation:
  language: ta
  text: ஏசா யாக்கோபிடம், “தயவுசெய்து, இந்தச் சிவப்பானதை—இந்தச் சிவப்பானதைக் கொஞ்சம் நான் விழுங்கக் கொடு; நான் களைத்துப்போயிருக்கிறேன்” என்றான்[a]. அதனால்தான் அவனுடைய பெயர் ஏதோம் என்று அழைக்கப்பட்டது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் உணவின் பெயர் குறிப்பிடப்படாமல், ‘சிவப்பானது, சிவப்பானது’ என்று திரும்பச் சொல்லப்படுகிறது. இது ஏசாவின் அவசரமான பேச்சைச் சுட்டிக்காட்டலாம். பல மொழிபெயர்ப்புகள் இங்கே ‘குழம்பு’ என்று சேர்க்கின்றன.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘ஏதோம்’ என்ற பெயரும் ‘சிவப்பு’ என்ற சொல்லும் ஒரே சொல்வடிவத்தைப் பகிர்கின்றன; இதுவே இவ்வசனத்தின் சொல்விளையாட்டு.
    reason: wordplay
lexical_decisions:
- source_word: הַלְעִיטֵנִי נָא
  choice: கொஞ்சம் எனக்கு விழுங்கக் கொடு
  rationale: לעט என்பதன் ஹிஃபில் வடிவம் வெறுமனே ‘உணவளி’ என்பதைக் காட்டிலும், பேராவலுடன் விழுங்கும் செயலைக் குறிக்கிறது. נָא வேண்டுகோளின் தொனியைத் தருகிறது; தமிழில் ‘கொஞ்சம்’ அந்தத் தொனியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִן הָאָדֹם הָאָדֹם הַזֶּה
  choice: இந்தச் சிவப்பானதை—இந்தச் சிவப்பானதை
  rationale: எபிரெயத்தில் உணவின் பெயர் சொல்லப்படாமல் ‘சிவப்பானது’ என்பது இருமுறை வருகிறது. ஏசாவின் அவசரமான, தோற்றத்தை மட்டுமே கவனிக்கும் பேச்சைத் தக்கவைக்க, ‘கூழ்’ போன்ற பெயர்ச்சொல் மூலவசனத்தில் சேர்க்கப்படவில்லை.
- source_word: כִּי עָיֵף אָנֹכִי
  choice: நான் களைத்துப்போயிருக்கிறேன்
  rationale: עָיֵף உடல் களைப்பையும் சோர்வையும் குறிக்கிறது. இத்தமிழ் நடை அவசரத்தையும் இயல்பான பேச்சுத் தொனியையும் தருகிறது; ‘மயங்கப்போகிறேன்’ எனப் பொருளை மிகைப்படுத்தவில்லை.
- source_word: עַל כֵּן
  choice: அதனால்தான்
  rationale: பெயரிடப்பட்டதற்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெயத் தொடரை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: קָרָא שְׁמוֹ אֱדוֹם
  choice: அவனுடைய பெயர் ஏதோம் என்று அழைக்கப்பட்டது
  rationale: எபிரெயப் பெயரிடும் வாய்பாட்டை நெருக்கமாகப் பின்பற்றுகிறது; அழைத்தவர் யார் என்பதை மூலவசனம் வெளிப்படையாகக் குறிப்பிடாததால் செயப்பாட்டு வடிவம் அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: אֱדוֹם
  choice: ஏதோம்
  rationale: இது ஒரு தனிப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது; ‘சிவப்பு’ என்பதுடனான சொல் விளையாட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
