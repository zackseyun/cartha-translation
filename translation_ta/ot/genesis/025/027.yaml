base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/027.yaml
  text: When the boys grew up[a], Esau became a skillful hunter, a man of the field, but Jacob was a quiet man[b], dwelling in tents.
translation:
  language: ta
  text: அந்தச் சிறுவர்கள் வளர்ந்து பெரியவர்களானபோது, ஏசா திறமையான வேட்டைக்காரனாகவும் வெளிநிலத்தில் வாழ்பவனாகவும் ஆனான். யாக்கோபோ அமைதியான மனிதனாக[a], கூடாரங்களில் வாழ்ந்துவந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அமைதியான” என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல், சூழலைப் பொறுத்து “குற்றமற்ற,” “நேர்மையான,” “கபடமற்ற,” “எளிய” அல்லது “முழுமையான” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדְּלוּ הַנְּעָרִים
  choice: அந்தச் சிறுவர்கள் வளர்ந்து பெரியவர்களானபோது
  rationale: இரட்டைச் சகோதரர்கள் குழந்தைப் பருவத்திலிருந்து முதிர்ந்ததைக் குறிக்கும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: אִישׁ יֹדֵעַ צַיִד
  choice: திறமையான வேட்டைக்காரன்
  rationale: வேட்டையை அறிந்தவன் என்ற சொல்லமைப்பு, பழக்கமும் திறமையும் வாய்ந்த வேட்டைக்காரனைச் சுட்டுகிறது.
- source_word: אִישׁ שָׂדֶה
  choice: வெளிநிலங்களில் திரிபவன்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘வெளிநிலத்தின் மனிதன்’; இங்கு கூடாரங்களில் வாழும் யாக்கோபுக்கு மாறாக ஏசாவின் வெளிப்புற வாழ்க்கை முறையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אִישׁ תָּם
  choice: அமைதியான மனிதன்
  rationale: תָּם என்ற சொல் முழுமை, நேர்மை, கபடமின்மை அல்லது எளிமை ஆகிய பொருள்களை ஏற்கக்கூடும். உடனடிச் சூழலில் ஏசாவின் வெளிநில வாழ்க்கைக்கு எதிராக யாக்கோபின் அமைதியான கூடார வாழ்க்கையைக் காட்டும் வகையில் மொழிபெயர்க்கப்பட்டது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: יֹשֵׁב אֹהָלִים
  choice: கூடாரங்களில் வாழ்ந்துவந்தான்
  rationale: பங்கேற்புவினை குறிக்கும் வழக்கமான, தொடர்ச்சியான வாழ்வுமுறையை ‘வாழ்ந்துவந்தான்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யாக்கோபை விவரிக்கும் תָּם என்பதன் பொருள்
  choice: ஒழுக்கத் தீர்ப்பை வெளிப்படையாக முன்வைக்காமல் ‘அமைதியான’ என்று மொழிபெயர்த்து, பொருள் விரிவை அடிக்குறிப்பில் வழங்குதல்
  alternative: குற்றமற்றவன்; நேர்மையானவன்; கபடமற்றவன்; எளியவன்; முழுமையானவன்
  rationale: வசனத்தின் உடனடி அமைப்பு ஏசாவின் வேட்டை மற்றும் வெளிநில வாழ்க்கையை யாக்கோபின் கூடார வாழ்க்கையுடன் வேறுபடுத்துகிறது. மூலச்சொல்லின் சாத்தியமான ஒழுக்கப் பொருளை முற்றிலும் நீக்காமல் அடிக்குறிப்பில் வைத்திருப்பது உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ஏசாவின் வெளிநில வாழ்க்கைக்கும் யாக்கோபின் கூடார வாழ்க்கைக்கும் இடையிலான இலக்கிய எதிர்மறைத் தொடர்பு தெளிவாக வைக்கப்பட்டுள்ளது; תָּם என்பதன் பொருள் திட்டவட்டமாகச் சுருக்கப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
