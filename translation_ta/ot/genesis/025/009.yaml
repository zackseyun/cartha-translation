- from: அவருடைய மகன்களான ஈசாக்கும் இஸ்மவேலும் அவரை மக்பேலா குகையில் அடக்கம் செய்தார்கள். அது மம்ரேக்கு எதிரே இருந்த ஏத்தியனான சோகாரின் மகன் எப்ரோனுடைய வயலில் இருந்தது.[a]
  to: அவருடைய மகன்களான ஈசாக்கும் இஸ்மவேலும் அவரை, மம்ரேக்கு எதிரே[a] இருந்த ஏத்தியனான சோகாரின் மகன் எப்ரோனுடைய வயலிலுள்ள மக்பேலா குகையில் அடக்கம் செய்தார்கள்.
