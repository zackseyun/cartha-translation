base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/009.yaml
  text: His sons Isaac and Ishmael buried him in the cave of Machpelah[a], in the field of Ephron son of Zohar the Hittite, which is opposite Mamre.
translation:
  language: ta
  text: அவருடைய மகன்களான ஈசாக்கும் இஸ்மவேலும் அவரை, மம்ரேக்கு எதிரே[a] இருந்த ஏத்தியனான சோகாரின் மகன் எப்ரோனுடைய வயலிலுள்ள மக்பேலா குகையில் அடக்கம் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மம்ரேக்கு முன்பாக” அல்லது “மம்ரேக்கு முகமாக.” எபிரெயச் சொற்றொடர் ஓர் அடையாள இடத்துக்கு முன்பாகவோ எதிராகவோ உள்ள இடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: அவரை அடக்கம் செய்தார்கள்
  rationale: קבר என்பதன் தொடர்கதை இறந்தகாலச் செயலை இயல்பான நவீனத் தமிழில் காட்டுகிறது; אֹתוֹ முந்தைய வசனத்திலுள்ள ஆபிரகாமைக் குறிக்கிறது.
- source_word: יִצְחָק וְיִשְׁמָעֵאל בָּנָיו
  choice: அவருடைய மகன்களான ஈசாக்கும் இஸ்மவேலும்
  rationale: בָּנָיו என்பதன் பின்னொட்டு ஆபிரகாமைக் குறிக்கிறது; பெயர்களுக்கும் ‘மகன்கள்’ என்பதற்கும் உள்ள விளக்கவுரைத் தொடர்பு தமிழில் தெளிவாகப் பாதுகாக்கப்படுகிறது.
- source_word: אֶל מְעָרַת הַמַּכְפֵּלָה
  choice: மக்பேலா குகையில்
  rationale: אֶל பொதுவாக திசையைக் குறித்தாலும், அடக்கச் சூழலில் தமிழின் இயல்பான இடக்குறிப்பு ‘குகையில்’ என்பதாகும்; மக்பேலா இடப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֶל שְׂדֵה עֶפְרֹן
  choice: எப்ரோனுடைய வயலில்
  rationale: இரண்டாவது אֶל அடக்கம் நடந்த இடத்தை மேலும் குறிப்பாக்குகிறது; construct அமைப்பு இயல்பான தமிழ் உடைமை வடிவில் தரப்படுகிறது.
- source_word: בֶּן צֹחַר הַחִתִּי
  choice: ஏத்தியனான சோகாரின் மகன்
  rationale: בֶּן மரபுவழித் தொடர்பாக ‘மகன்’ என்று மொழிபெயர்க்கப்படுகிறது; הַחִתִּי வழக்கமான தமிழ் இனப்பெயரான ‘ஏத்தியன்’ என வழங்கப்படுகிறது.
- source_word: אֲשֶׁר עַל פְּנֵי מַמְרֵא
  choice: அது மம்ரேக்கு எதிரே இருந்த
  rationale: עַל־פְּנֵי என்ற புவியியல் சொற்றொடர் ‘எதிரே’, ‘முன்பாக’, அல்லது ‘முகமாக’ என்ற இடத்தொடர்பைக் குறிக்கலாம்; திசையை தேவையின்றி குறிப்பாக்காமல் ‘எதிரே’ முதன்மை உரையில் தரப்படுகிறது.
