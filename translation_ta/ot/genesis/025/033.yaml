source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יַעֲקֹ֗ב הִשָּׁ֤בְעָ/ה לִּ/י֙ כַּ/יּ֔וֹם וַ/יִּשָּׁבַ֖ע ל֑/וֹ וַ/יִּמְכֹּ֥ר אֶת בְּכֹרָת֖/וֹ לְ/יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/033.yaml
  text: And Jacob said[b][a], “Swear to me today.” So he swore to him and sold his birthright to Jacob.
translation:
  language: ta
  text: யாக்கோபு, “இன்றே எனக்குச் சத்தியம் செய்து கொடு[a]” என்றான். ஏசா அவனுக்குச் சத்தியம் செய்து, தன் முதற்பேறுரிமையை[b] யாக்கோபுக்கு விற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த நாளில் எனக்குச் சத்தியம் செய்து கொடு”; அல்லது, “இன்று எனக்குச் சத்தியம் செய்து கொடு.”
    reason: lexical_alternative
  - marker: b
    text: “முதற்பேறுரிமை” என்பது முதற்பேறான மகனுக்குரிய உரிமைகளையும் குடும்பத்தில் அவனுக்குரிய நிலையையும் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁבְעָה לִּי
  choice: எனக்கு ஆணையிட்டுக் கொடு
  rationale: எபிரெய உறுதிமொழிச் சூத்திரத்தின் நேரடியான கட்டளையையும், யாரிடம் ஆணையிடப்படுகிறது என்பதையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: כַּיּוֹם
  choice: இன்றே
  rationale: ‘இன்று/இந்த நாளிலேயே’ என்ற காலப்பொருளையும் சூழலிலுள்ள உடனடித் தன்மையையும் சுருக்கமாகக் காட்டுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: அவனுக்கு ஆணையிட்டு
  rationale: முன்னுள்ள கட்டளையுடன் உள்ள சொல்லியல் தொடர்பைப் பேணி, ஆணை யாக்கோபுக்குக் கொடுக்கப்பட்டது என்பதைக் காட்டுகிறது.
- source_word: וַיִּמְכֹּר
  choice: விற்றான்
  rationale: מכר என்பதன் பரிவர்த்தனை சார்ந்த நேரடிப் பொருளைப் பாதுகாக்கிறது.
- source_word: בְּכֹרָתוֹ
  choice: தன் மூத்தமகன் உரிமையை
  rationale: முதற்பேறான மகனுக்குரிய குடும்பச் சட்டநிலை மற்றும் உரிமைகளைக் குறிக்கும் சொல்லை சாதாரண வாசகருக்குத் தெளிவாக வழங்குகிறது.
- source_word: לְיַעֲקֹב
  choice: யாக்கோபுக்கு
  rationale: விற்பனையின் பெறுநரை இயல்பான தமிழ் வேற்றுமையுருபில் குறிக்கிறது.
theological_decisions:
- issue: בְּכֹרָה என்பதன் இயல்பு
  choice: மூத்தமகன் உரிமை
  alternative: முதற்பேற்றுரிமை
  rationale: இவ்வசனம் முதற்பேறான மகனின் உரிமை மற்றும் நிலையை விற்ற பரிவர்த்தனையைச் சொல்கிறது. ‘மூத்தமகன் உரிமை’ என்பது கூடுதல் கோட்பாட்டுப் பொருளைச் சேர்க்காமல் கருத்தைத் தெளிவாகக் கூறுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகருக்குப் புரியக்கூடியதுமான நடை. எபிரெய மூலத்தின் தொடர்ச்சியான கட்டளையும் செயற்பாடுகளும் பேணப்பட்டுள்ளன. குழப்பம் தவிர்க்க இரண்டாம் வாக்கியத்தின் மறைமுக எழுவாய் ‘ஏசா’ என வெளிப்படுத்தப்பட்டுள்ளது; இது உடனடி சூழலால் உறுதிப்படுத்தப்படுகிறது.
