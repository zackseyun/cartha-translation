revisions:
- from: யாக்கோபு, “இன்றே எனக்கு ஆணையிட்டுக் கொடு[a]” என்றான். ஏசாவும் அவனுக்கு ஆணையிட்டு, தன் மூத்தமகன் உரிமையை[b] யாக்கோபுக்கு விற்றான்.
  to: யாக்கோபு, “இன்றே எனக்குச் சத்தியம் செய்து கொடு[a]” என்றான். ஏசா அவனுக்குச் சத்தியம் செய்து, தன் முதற்பேறுரிமையை[b] யாக்கோபுக்கு விற்றான்.
  rationale: 'The revision renders the Hebrew oath formula faithfully and idiomatically: Jacob commands Esau to swear to him, and Esau then swears to him. It removes the unsupported ‘from today onward’ alternative and uses the conventional, source-accurate term முதற்பேறுரிமை, with a concise explanatory note.'
  reviewer_model: gpt-5.6-terra
