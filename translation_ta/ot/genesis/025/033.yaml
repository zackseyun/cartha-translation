    text: அல்லது, “இந்த நாளில் எனக்குச் சத்தியம் செய்து கொடு”; அல்லது, “இன்று எனக்குச் சத்தியம் செய்து கொடு.”
    reason: lexical_alternative
  - marker: b
    text: “முதற்பேறுரிமை” என்பது முதற்பேறான மகனுக்குரிய உரிமைகளையும் குடும்பத்தில் அவனுக்குரிய நிலையையும் குறிக்கிறது.
    reason: cultural_note
