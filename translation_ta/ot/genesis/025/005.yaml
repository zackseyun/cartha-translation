lexical_decisions:
- source_word: וַיִּתֵּן
  choice: கொடுத்தார்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு’. தொடர் நிகழ்வைக் குறிக்கும் wayyiqtol வடிவம் இங்கு இயல்பாக இறந்தகால வினையாக மொழிபெயர்க்கப்படுகிறது.
- source_word: אַבְרָהָם
  choice: ஆபிரகாம்
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர் வடிவம்.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண அடையாளம்; தமிழில் தனிச் சொல்லாக இதற்கு இணை தேவையில்லை.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: தனக்குச் சொந்தமான அனைத்தையும்
  rationale: சொற்றொடரின் நேரடிப் பொருள் ‘அவருக்குரிய அனைத்தும்’ அல்லது ‘அவருக்குச் சொந்தமான அனைத்தும்’. தேர்ந்த வடிவம் உரிமை என்னும் நுணுக்கத்தையும் முழுமையையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: לְיִצְחָק
  choice: ஈசாக்குக்குக்
  rationale: לְ இங்கு பெறுபவரைக் குறிக்கிறது; தமிழின் நான்காம் வேற்றுமை உருபு அதைத் தெளிவாக வெளிப்படுத்துகிறது.
