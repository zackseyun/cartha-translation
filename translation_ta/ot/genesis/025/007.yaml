  yaml_path: translation/ot/genesis/025/007.yaml
  text: 'These are the days of the years of Abraham’s life that he lived: one hundred seventy-five years[a].'
translation:
  language: ta
  text: ஆபிரகாம் வாழ்ந்த வாழ்நாட்கள் மொத்தம் நூற்று எழுபத்தைந்து ஆண்டுகள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “ஆபிரகாம் வாழ்ந்த அவரது வாழ்க்கையின் ஆண்டுகளின் நாட்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: மொத்தம்
  rationale: இந்த இணைப்புச்சொல் மற்றும் சுட்டுப்பெயர் முந்தைய விவரிப்பைச் சுருக்கி மொத்த ஆயுளை அறிவிக்கின்றன; இயல்பான தமிழில் வாக்கிய அமைப்போடு ‘மொத்தம்’ இதைத் தெரிவிக்கிறது.
- source_word: יְמֵי שְׁנֵי חַיֵּי אַבְרָהָם
  choice: ஆபிரகாமுடைய வாழ்நாட்கள்
  rationale: ‘ஆபிரகாமின் வாழ்வின் ஆண்டுகளுடைய நாட்கள்’ என்ற எபிரெயக் கூறு அவரது முழு ஆயுளைக் குறிக்கிறது. ‘வாழ்நாட்கள்’ என்பது அதன் ‘நாட்கள்’ கூறையும் ஆயுட்காலப் பொருளையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אֲשֶׁר חָי
  choice: ஆபிரகாம் வாழ்ந்த
  rationale: ஆயுளை மீண்டும் வலியுறுத்தும் சார்புத் தொடரைத் தெளிவாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: מְאַת שָׁנָה וְשִׁבְעִים שָׁנָה וְחָמֵשׁ שָׁנִים
  choice: நூற்று எழுபத்தைந்து ஆண்டுகள்
  rationale: எபிரெயில் 100 + 70 + 5 என்று கூட்டல் வடிவில் தரப்பட்டுள்ள துல்லியமான வயதை வழக்கமான தமிழ் எண் வடிவில் அளிக்கிறது.
- source_word: אַבְרָהָם
  choice: ஆபிரகாம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெயச் சொற்றொடரின் இயல்பற்ற மறுபடிவை முதன்மை உரையில் ‘வாழ்நாட்கள்’ என இயல்பாக்கி, அதன் சொற்சார்ந்த வடிவத்தை அடிக்குறிப்பில் பாதுகாத்துள்ளது.
