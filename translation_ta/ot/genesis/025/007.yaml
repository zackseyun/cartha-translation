- from: ஆபிரகாம் வாழ்ந்த அவருடைய வாழ்நாட்கள் மொத்தம் நூற்று எழுபத்தைந்து ஆண்டுகள்.[a]
  to: ஆபிரகாம் வாழ்ந்த வாழ்நாட்கள் மொத்தம் நூற்று எழுபத்தைந்து ஆண்டுகள்.[a]
  rationale: The revision removes an unneeded possessive pronoun that makes the Tamil awkward. It preserves the source's lifespan formulation in the main text through “வாழ்நாட்கள்” and gives the more formally literal, repetitive Hebrew expression in the footnote. The age remains exactly 175 years.
