  text: וַ/יִּתְרֹֽצֲצ֤וּ הַ/בָּנִים֙ בְּ/קִרְבָּ֔/הּ וַ/תֹּ֣אמֶר אִם כֵּ֔ן לָ֥/מָּה זֶּ֖ה אָנֹ֑כִי וַ/תֵּ֖לֶךְ לִ/דְרֹ֥שׁ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/022.yaml
  text: And the children struggled together within her[a], and she said, “If it is so, why am I like this?” So she went to inquire of Yahweh.
translation:
  language: ta
  text: அவளுக்குள் பிள்ளைகள் ஒருவரோடொருவர் மோதிக்கொண்டார்கள். அப்போது அவள், “இப்படியானால், நான் ஏன் இப்படி இருக்கிறேன்?[a]” என்று சொல்லி, யாவேயிடம் விசாரிக்கச் சென்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் ஏன்?” எபிரெயச் சொற்றொடர் சொற்கள் விடுபட்ட சுருக்கமான அமைப்பில் உள்ளது; “எனக்கு ஏன் இப்படி?” என்றும் இதைப் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְרֹצֲצוּ
  choice: ஒருவரோடொருவர் மோதிக்கொண்டார்கள்
  rationale: இந்த வினையின் பரஸ்பர/தீவிர வடிவம் கருவிலிருந்த பிள்ளைகளுக்கிடையே நடந்த வலுவான மோதலைக் குறிக்கிறது. ‘மோதிக்கொண்டார்கள்’ என்பது அதைக் இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தில் இல்லாத அளவுக்கு ‘ஒருவரையொருவர் நசுக்கினார்கள்’ என்றும் மிகைப்படுத்துவதில்லை.
- source_word: הַבָּנִים
  choice: பிள்ளைகள்
  rationale: இச்சொல் ‘மகன்கள்’ எனவும் பொருள்படலாம். ஆனால் பிறப்பதற்கு முந்தைய இச்சூழலில் ‘பிள்ளைகள்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது; அடுத்த வசனத்தில் வெளிப்படும் அவர்களுடைய ஆண் பாலினத்தையும் இது மறுப்பதில்லை.
- source_word: בְּקִרְבָּהּ
  choice: அவளுக்குள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘அவளுடைய உள்ளே/உட்பகுதியில்’ என்பதாகும். ‘அவளுக்குள்’ என்பது கருப்பையைக் குறிப்பாகச் சேர்க்காமல் உடலுக்குள் நிகழ்ந்ததைத் தெளிவாகக் காட்டுகிறது.
- source_word: אִם כֵּן
  choice: இப்படியானால்
  rationale: ரெபெக்காள் அனுபவித்த நிலையைச் சுட்டும் நிபந்தனைச் சொற்றொடரை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: לָמָּה זֶּה אָנֹכִי
  choice: நான் ஏன் இப்படி இருக்கிறேன்?
  rationale: எபிரெய மொழியில் இக்கூற்று சொற்கள் விடுபட்ட சுருக்கமான, தெளிவற்ற அமைப்பில் உள்ளது. கர்ப்பத்தில் ஏற்பட்ட கடுமையான மோதலுக்கு அவள் காட்டிய வேதனையான எதிர்வினையை இத்தேர்வு இயல்பாக வெளிப்படுத்துகிறது; இருப்பினும் மூலத்தின் பிற சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: யாவேயிடம் விசாரிக்க
  rationale: ஒரு நபரை நோக்கிய דרש இங்கு இறைவனிடமிருந்து விளக்கம் அல்லது வழிகாட்டுதல் கேட்பதைக் குறிக்கிறது. பொதுவான ‘தேட’ என்பதைக் காட்டிலும் ‘விசாரிக்க’ என்பது இச்சூழலுக்குத் துல்லியமானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், ‘Yahweh’ என்பதற்கேற்ற தமிழொலிப்பெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல வசனம் இறைப்பெயரான יהוה என்பதை நேரடியாகப் பயன்படுத்துகிறது. எனவே ஒரு பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாகவும், குறைவாக ஆதரிக்கப்படும் பழைய ஒலிப்பெயர்ப்பான ‘யெகோவா’ என்பதற்குப் பதிலாகவும், ‘Yahweh’ என்பதற்கேற்ற ‘யாவே’ பயன்படுத்தப்படுகிறது.
- issue: לָמָּה זֶּה אָנֹכִי என்பதிலுள்ள பொருள் தெளிவின்மை
  choice: நான் ஏன் இப்படி இருக்கிறேன்?
  alternative: நான் ஏன்? / எனக்கு ஏன் இப்படி?
  rationale: கர்ப்பகால வேதனையின் சூழலில் நிலையைப் பற்றிய கேள்வியாக வாசிப்பது இயல்பானது. எனினும், இது இருப்பையே குறித்த ஆழமான கேள்வியாகவும் புரிந்துகொள்ளப்படக்கூடிய எபிரெயச் சுருக்கம் என்பதால், அந்தத் தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கருவிலுள்ள இயக்கத்தின் தீவிரத்தையும் எபிரெயக் கூற்றின் உண்மையான தெளிவின்மையையும் சமநிலையுடன் பாதுகாக்கிறது.
