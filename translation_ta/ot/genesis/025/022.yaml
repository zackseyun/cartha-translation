  source_fidelity: 'வசனம் எபிரெய மூலத்தின் முக்கிய கூறுகளைத் துல்லியமாகக் காக்கிறது: கருவிலுள்ள பிள்ளைகளின் பரஸ்பரமான தீவிர அசைவு/மோதல், ரெபெக்காளின் சுருக்கமான துயரக் கேள்வி, யாவேயிடம் விசாரிக்க அவள் சென்றது ஆகியவை அனைத்தும் முறையாக வெளிப்படுத்தப்பட்டுள்ளன. “நான் ஏன் இப்படி இருக்கிறேன்?” என்பது לָמָּה זֶּה אָנֹכִי என்ற தெளிவற்ற சொல்லமைப்புக்கு சூழலுக்கு ஏற்ற முதன்மை வாசிப்பாகும்; அடிக்குறிப்பு மாற்றுவாசிப்புகளையும் சுருக்கத் தன்மையையும் காக்கிறது.'
