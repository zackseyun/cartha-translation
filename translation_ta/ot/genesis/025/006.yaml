  text: וְ/לִ/בְנֵ֤י הַ/פִּֽילַגְשִׁים֙ אֲשֶׁ֣ר לְ/אַבְרָהָ֔ם נָתַ֥ן אַבְרָהָ֖ם מַתָּנֹ֑ת וַֽ/יְשַׁלְּחֵ֞/ם מֵ/עַ֨ל יִצְחָ֤ק בְּנ/וֹ֙ בְּ/עוֹדֶ֣/נּוּ חַ֔י קֵ֖דְמָ/ה אֶל אֶ֥רֶץ קֶֽדֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/006.yaml
  text: But to the sons of his concubines[a], Abraham gave gifts, and while he was still alive he sent them away from his son Isaac[b], eastward to the land of the east.
translation:
  language: ta
  text: ஆனால், ஆபிரகாம் தம் துணை மனைவிகளின்[a] மகன்களுக்கு அன்பளிப்புகளைக் கொடுத்தார்; தாம் உயிரோடிருந்தபோதே அவர்களைத் தம் மகன் ஈசாக்கிடமிருந்து பிரித்து, கிழக்கே, கிழக்கு நாட்டிற்கு[b] அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல், குடும்பத்தில் முதன்மை மனைவியைவிடக் குறைந்த சட்டநிலை கொண்ட அங்கீகரிக்கப்பட்ட துணை மனைவிகளைக் குறிக்கிறது.
    reason: lexical_clarification
  - marker: b
    text: அல்லது, “கிழக்குப் பகுதிக்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: ஆனால் ... மகன்களுக்கு
  rationale: முந்தைய வசனத்தில் ஈசாக்குக்குக் கொடுக்கப்பட்ட முழுச் சொத்துக்கும் இங்கு மற்ற மகன்களுக்குக் கொடுக்கப்பட்ட அன்பளிப்புகளுக்கும் இடையிலான வேறுபாட்டை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது; לִ என்ற முன்னொட்டின் பெறுபவர் பொருளை ‘மகன்களுக்கு’ காக்கிறது.
- source_word: הַפִּילַגְשִׁים
  choice: துணை மனைவிகள்
  rationale: அங்கீகரிக்கப்பட்டிருந்தாலும் முதன்மை மனைவியைவிடக் குறைந்த குடும்பச் சட்டநிலை கொண்ட பெண்களைச் சுட்டும் எபிரெயச் சொல்லை, இழிவான தொனியின்றி நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: נָתַן ... מַתָּנֹת
  choice: அன்பளிப்புகளைக் கொடுத்தார்
  rationale: வினை–பெயர்ச்சொல் இணைப்பை நேரடியாகக் காக்கிறது; வாரிசுரிமையாகச் சொத்தை அளித்ததிலிருந்து இவற்றை வேறுபடுத்தவும் ‘அன்பளிப்புகள்’ உதவுகிறது.
- source_word: וַיְשַׁלְּחֵם מֵעַל יִצְחָק בְּנוֹ
  choice: அவர்களைத் தன் மகன் ஈசாக்கைவிட்டுப் பிரித்து ... அனுப்பிவிட்டார்
  rationale: וַיְשַׁלְּחֵם என்பதன் அனுப்புதல் பொருளையும் מֵעַל என்பதன் பிரித்தகற்றும் நுணுக்கத்தையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: בְּעוֹדֶנּוּ חַי
  choice: தான் உயிரோடிருக்கும்போதே
  rationale: ஆபிரகாம் இறப்பதற்கு முன்பே இதைச் செய்தார் என்ற கால வலியுறுத்தலை ‘போதே’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: קֵדְמָה אֶל אֶרֶץ קֶדֶם
  choice: கிழக்கே, கிழக்கு நாட்டிற்கு
  rationale: முதலில் திசையையும் பின்னர் சென்ற பகுதியையும் குறிப்பிடும் எபிரெய உரையின் மீளுரைப்பைச் சுருக்காமல் காக்கிறது.
theological_decisions:
- issue: פִּילֶגֶשׁ என்பவர்களின் திருமணச் சமூகநிலை
  choice: துணை மனைவிகள்
  alternative: மறுமனையாட்டிகள் / வைப்பாட்டிகள்
  rationale: மூலச்சொல் அங்கீகரிக்கப்பட்ட ஆனால் இரண்டாம் நிலை மண உறவைக் குறிக்கிறது. ‘துணை மனைவிகள்’ அந்த வேறுபாட்டைச் சுட்டுகிறது; அதேவேளை இழிவான நவீன உட்பொருளையோ தேவையற்ற சமய மரபுச் சொல்லாட்சியையோ சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘கிழக்கே, கிழக்கு நாட்டிற்கு’ என்ற மீளுரை மூல எபிரெயத்தின் திசை–பகுதி அமைப்பை நோக்கத்துடன் காக்கிறது.
