revisions:
- from: ஆனால் ஆபிரகாம் தன் துணை மனைவிகளின்[a] மகன்களுக்கு அன்பளிப்புகளைக் கொடுத்தார். தான் உயிரோடிருக்கும்போதே, அவர்களைத் தன் மகன் ஈசாக்கைவிட்டுப் பிரித்து, கிழக்கே, கிழக்கு நாட்டிற்கு[b] அனுப்பிவிட்டார்.
  to: ஆனால், ஆபிரகாம் தம் துணை மனைவிகளின்[a] மகன்களுக்கு அன்பளிப்புகளைக் கொடுத்தார்; தாம் உயிரோடிருந்தபோதே அவர்களைத் தம் மகன் ஈசாக்கிடமிருந்து பிரித்து, கிழக்கே, கிழக்கு நாட்டிற்கு[b] அனுப்பினார்.
  rationale: The revision makes only idiomatic and register-level adjustments. It retains the Hebrew’s directional repetition (“கிழக்கே, கிழக்கு நாட்டிற்கு”), its temporal clause, and its contextual sense that Abraham removed these sons from proximity to Isaac while still living.
