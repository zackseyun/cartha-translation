  yaml_path: translation/ot/genesis/024/039.yaml
  text: And I said to my master[a], ‘Perhaps the woman will not follow me.’
translation:
  language: ta
  text: நான் என் எஜமானிடம், “ஒருவேளை அந்தப் பெண் என்னைப் பின்தொடர்ந்து வராமல் போகலாம்[a]” என்றேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “எனக்குப் பின்னால் செல்லாமல் போகலாம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: அப்போது நான் … என்றேன்
  rationale: வய்யிக்தோல் வடிவம் கடந்தகாலக் கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; நவீன தமிழில் இயல்பான தொடர்ச்சியை ‘அப்போது’ வெளிப்படுத்துகிறது.
- source_word: אֶל אֲדֹנִי
  choice: என் எஜமானிடம்
  rationale: இங்கு אָדוֹן என்பது பணியாளரின் மனிதத் தலைவரான ஆபிரகாமைக் குறிக்கிறது; ‘எஜமான்’ அந்த சமூக உறவைத் தெளிவாகவும் இறைப்பட்டமாகத் தவறாகப் புரிந்துகொள்ளாத வகையிலும் தருகிறது.
- source_word: אֻלַי
  choice: ஒருவேளை
  rationale: இந்த இடைச்சொல் சாத்தியத்தையும் உறுதியின்மையையும் குறிக்கிறது; ‘ஒருவேளை’ இயல்பான நவீனத் தமிழ்.
- source_word: לֹא תֵלֵךְ
  choice: வராமல் போகலாம்
  rationale: இங்கே imperfect வடிவம் எதிர்காலத்தில் நிகழாமல் இருக்கக்கூடிய சாத்தியத்தைச் சொல்கிறது; אֻלַי உடன் தமிழில் ‘போகலாம்’ என்ற அமைப்பு இயல்பாக அந்த ஐயத்தை வெளிப்படுத்துகிறது.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: எபிரெயச் சொல் பொதுவாக ‘பெண்’ என்றே பொருள்படும்; சூழல் மணமகளைப் பற்றியதாக இருந்தாலும் ‘மனைவி’ என்று முன்கூட்டியே குறிப்பாக்கப்படவில்லை. தமிழில் முன் குறிப்பிடப்பட்ட நபரைக் குறிக்க ‘அந்தப்’ இயல்பாக உள்ளது.
- source_word: אַחֲרַי
  choice: என்னைப் பின்தொடர்ந்து
  rationale: சொல்லுக்கு நேரடியாக ‘எனக்குப் பின்னால்’ என்று பொருள்; הלך உடன் சேரும்போது ஒருவருடன் செல்வது அல்லது பின்தொடர்வது என்ற இயல்பான பொருளைத் தருகிறது.
