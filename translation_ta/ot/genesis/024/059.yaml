  yaml_path: translation/ot/genesis/024/059.yaml
  text: So they sent away Rebekah their sister[a], and her nurse, and Abraham’s servant, and his men.
translation:
  language: ta
  text: அவர்கள் தங்கள் சகோதரியான ரெபெக்காளையும், அவளுடைய செவிலித்தாயையும்[a], ஆபிரகாமின் பணியாளனையும், அவனுடைய ஆட்களையும் அனுப்பிவைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் குறிப்பாக, ‘அவளுடைய பாலூட்டும் செவிலித்தாய்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: அனுப்பிவைத்தார்கள்
  rationale: பயணத்திற்காக ஒருவரைப் புறப்படச் செய்யும் பியேல் வினையின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רִבְקָה
  choice: ரெபெக்காள்
  rationale: தமிழ் வேதாகம மரபில் நன்கு அறியப்பட்ட எபிரெயப் பெண்பெயரின் வடிவம்.
- source_word: אֲחֹתָם
  choice: தங்கள் சகோதரி
  rationale: உடனடியான குடும்பச் சூழலில் אָחוֹת என்பதன் நேரான பொருளான ‘சகோதரி’ பொருத்தமானது; பன்மை உடைமைப் பின்னொட்டையும் ‘தங்கள்’ தக்கவைக்கிறது.
- source_word: מֵנִקְתָּהּ
  choice: அவளுடைய செவிலித்தாய்
  rationale: ינק என்பதிலிருந்து வந்த இச்சொல் குழந்தைக்குப் பாலூட்டி வளர்த்த பெண்ணைக் குறிக்கிறது. ‘செவிலித்தாய்’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது; குறிப்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עֶבֶד אַבְרָהָם
  choice: ஆபிரகாமின் பணியாளன்
  rationale: இணைப்புநிலை அமைப்பை நேராகக் காட்டுகிறது. இச்சூழலில் அடிமை நிலையை விட ஒப்படைக்கப்பட்ட பணியே முன்னிலையில் இருப்பதால் ‘பணியாளன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲנָשָׁיו
  choice: அவனுடைய ஆட்கள்
  rationale: பின்னொட்டு ஆபிரகாமின் பணியாளனைக் குறிக்கிறது. அவர்களின் துல்லியமான பங்கை ஊகிக்காமல் ‘அவனுடைய ஆட்கள்’ எபிரெயச் சொல்லின் பொதுவான பொருளைத் தக்கவைக்கிறது.
