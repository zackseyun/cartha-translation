revisions:
- from: அப்படியே அவர்கள் தங்கள் சகோதரி ரெபெக்காளையும், அவளுடைய செவிலித்தாயையும்[a], ஆபிரகாமின் பணியாளனையும், அவனுடைய ஆட்களையும் அனுப்பிவைத்தார்கள்.
  to: அவர்கள் தங்கள் சகோதரியான ரெபெக்காளையும், அவளுடைய செவிலித்தாயையும்[a], ஆபிரகாமின் பணியாளனையும், அவனுடைய ஆட்களையும் அனுப்பிவைத்தார்கள்.
  rationale: The revision removes an unsupported connective, makes the appositional relationship of Rebekah and “their sister” idiomatic in Tamil, and corrects the footnote so that it preserves the more specific wet-nurse sense without adding that she raised Rebekah or was her mother.
