  text: וַ/תָּ֨רָץ֙ הַֽ/נַּעֲרָ֔ וַ/תַּגֵּ֖ד לְ/בֵ֣ית אִמָּ֑/הּ כַּ/דְּבָרִ֖ים הָ/אֵֽלֶּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/028.yaml
  text: Then the young woman ran and told her mother's household about these things[a].
translation:
  language: ta
  text: அப்போது அந்த இளம்பெண் ஓடிப்போய், இந்தக் காரியங்களைத் தன் தாயின் வீட்டாரிடம்[a] சொன்னாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் தாயின் வீட்டுக்கு.’ எபிரெயச் சொற்றொடர், தாயின் வீடு என்ற இடத்தையோ தாயுடன் தொடர்புடைய வீட்டாரையோ குடும்பத்தாரையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרָץ
  choice: ஓடிப்போய்
  rationale: רוּץ என்பது வேகமாக ஓடுவதைக் குறிக்கிறது. தொடர்ச்சியான கதைநடையில் ‘ஓடிப்போய்’ என்பது இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: הַנַּעֲרָ
  choice: அந்த இளம்பெண்
  rationale: נַעֲרָה என்பது இளம் பெண்ணைக் குறிக்கிறது. சூழலில் ரெபெக்காளைக் குறிப்பதால், ‘சிறுமி’ என்பதைவிட ‘இளம்பெண்’ துல்லியமாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַתַּגֵּד
  choice: சொன்னாள்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ‘தெரிவித்தல், சொல்லுதல்’ என்று பொருள்படும். இக்கதைநடையில் ‘சொன்னாள்’ தெளிவான இயல்பான சொல்.
- source_word: לְבֵית אִמָּהּ
  choice: தன் தாயின் வீட்டாரிடம்
  rationale: בַּיִת என்பது கட்டடமான ‘வீடு’ என்பதையும் அதனுடன் தொடர்புடைய ‘வீட்டார்/குடும்பத்தார்’ என்பதையும் குறிக்கலாம். இங்கு செய்தியை மனிதர்களிடம் சொல்வது முன்னிலையாக இருப்பதால் ‘வீட்டாரிடம்’ முதன்மை உரையாகத் தேர்ந்தெடுக்கப்பட்டது; ‘வீட்டுக்கு’ என்ற மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: இந்தக் காரியங்களை
  rationale: דְּבָרִים என்பது ‘வார்த்தைகள்,’ ‘காரியங்கள்,’ அல்லது ‘நிகழ்வுகள்’ என்று பொருள்படலாம். ரெபெக்காள் நடந்தவற்றை எடுத்துச் சொல்வதால் ‘இந்தக் காரியங்களை’ சூழலுக்கு இயல்பாகப் பொருந்துகிறது.
