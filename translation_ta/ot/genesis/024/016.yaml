base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/016.yaml
  text: The young woman was very beautiful in appearance[a], a virgin; no man had known her. She went down to the spring, filled her jar[b], and came up.
translation:
  language: ta
  text: அந்த இளம்பெண் தோற்றத்தில் மிகவும் அழகானவள். அவள் கன்னிப்பெண்; எந்த ஆணும் அவளை அறிந்திருக்கவில்லை[a]. அவள் நீரூற்றுக்கு[b] இறங்கிச் சென்று, தன் குடத்தை நிரப்பிக்கொண்டு மேலே வந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, எந்த ஆணும் அவளுடன் பாலுறவு கொண்டிருக்கவில்லை. எபிரெயத்தில் சொல்லுக்குச் சொல், “எந்த ஆணும் அவளை அறிந்திருக்கவில்லை.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “நீரூற்றுக்கு”; சில மொழிபெயர்ப்புகள் “கிணற்றுக்கு” என வழங்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָ
  choice: அந்த இளம்பெண்
  rationale: נַעֲרָה என்பது பொதுவாகத் திருமண வயதிலுள்ள இளம் பெண்ணைக் குறிக்கலாம். ‘இளம்பெண்’ என்பது இன்றைய தமிழில் இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: טֹבַת מַרְאֶה מְאֹד
  choice: தோற்றத்தில் மிகவும் அழகானவள்
  rationale: இந்த எபிரெயச் சொற்றொடர் அவளுடைய வெளித்தோற்றத்தின் அழகை மிகைப்படுத்தாமல் நேரடியாக விவரிக்கிறது; ‘தோற்றத்தில் மிகவும் அழகானவள்’ அதன் பொருளையும் வலியுறுத்தலையும் காக்கிறது.
- source_word: בְּתוּלָה
  choice: கன்னிப்பெண்
  rationale: בְּתוּלָה இங்கு பாலுறவு கொள்ளாத பெண்ணைக் குறிக்கிறது. ‘கன்னிப்பெண்’ என்பது தெளிவான, வழக்கிலுள்ள தமிழ் மொழிபெயர்ப்பு.
- source_word: וְאִישׁ לֹא יְדָעָהּ
  choice: எந்த ஆணும் அவளை அறிந்திருக்கவில்லை
  rationale: יָדַע (‘அறிதல்’) என்பது பாலுறவைக் குறிக்கும் எபிரெய மரியாதை வழக்கு. நேரடியான உருவகத்தைத் தமிழிலும் காத்து, அதன் குறிப்பிட்ட பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: הָעַיְנָה
  choice: நீரூற்றுக்கு
  rationale: עַיִן இங்கு நீர் தோன்றும் ஊற்று அல்லது நீராதாரத்தைக் குறிக்கிறது; בְּאֵר என்பதுபோல வெட்டப்பட்ட கிணற்றைக் குறிக்கும் சொல் அல்ல. எனவே ‘நீரூற்று’ துல்லியமானது.
- source_word: כַדָּהּ
  choice: தன் குடத்தை
  rationale: כַּד என்பது தண்ணீர் மொள்ளப் பயன்படும் குடம். தமிழ் கதையோட்டத்தில் ‘தன் குடம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַתָּעַל
  choice: மேலே வந்தாள்
  rationale: עָלָה என்பது மேலே செல்லுதல் அல்லது வருதல். முன்பு ஊற்றுக்கு இறங்கிச் சென்றதற்கு எதிரான இடநிலையை ‘மேலே வந்தாள்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அறிதல்’ என்ற பாலுறவுக் குறிப்பு
  choice: மூலத்தின் ‘அறிதல்’ என்ற மரியாதை வழக்கை முதன்மை உரையில் காத்தல்
  alternative: ‘எந்த ஆணும் அவளுடன் பாலுறவு கொண்டிருக்கவில்லை’ என்று பொருளை நேரடியாகக் கூறுதல்
  rationale: மூல எபிரெயத்தின் இலக்கிய அடக்கத்தையும் சொல்வடிவத்தையும் காப்பதோடு, தவறான புரிதலைத் தவிர்க்க அடிக்குறிப்பில் பொருள் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதையுரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் இல்லாத தொடக்கக் காலக் குறிச்சொல் சேர்க்கப்படவில்லை; ‘இறங்கிச் சென்று/மேலே வந்தாள்’ என்ற இடநிலை எதிர்மறைத் தொடர்பும் காக்கப்பட்டுள்ளது.
