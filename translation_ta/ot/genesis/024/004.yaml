  text: but you shall go to my land and to my kindred[b][a], and take a wife for my son Isaac.
translation:
  language: ta
  text: ஆனால் நீ என் நாட்டிற்கும் என் உறவினர்களிடமும்[a] சென்று, என் மகனாகிய ஈசாக்குக்காக[b] ஒரு மனைவியைப் பெற்றுக்கொள்ள வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் பிறந்த இடத்திற்கு.” எபிரெயச் சொல் ஒருவரின் பிறப்பிடத்தையோ அவருடைய உறவுக் குழுவையோ குறிக்கலாம். இங்கு சூழல் உறவினர்களைக் குறிக்கும் பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “என் மகனுக்காக, ஈசாக்குக்காக.”'
    reason: source_structure
lexical_decisions:
- source_word: כִּי
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கானானியப் பெண்களில் ஒருத்தியை மனைவியாகக் கொள்ளக்கூடாது என்ற தடைக்கு மாறான கட்டளையை அறிமுகப்படுத்துவதால், இங்கு எதிர்மறைத் தொடர்பைக் காட்டும் ‘ஆனால்’ பொருத்தமானது.
- source_word: אֶל אַרְצִי
  choice: என் நாட்டிற்கு
  rationale: אֶרֶץ இங்கு ஆபிரகாமின் சொந்தப் பிரதேசத்தைக் குறிக்கிறது. நவீன தேசிய அரசைக் குறிப்பதாக இல்லாமல், இயல்பான தமிழில் புவியியல் சார்ந்த பொருளை ‘நாடு’ தருகிறது.
- source_word: וְאֶל מוֹלַדְתִּי
  choice: என் உறவினரிடத்திற்கு
  rationale: מוֹלֶדֶת என்பது பிறந்த இடத்தையோ இன/குடும்ப உறவுக் குழுவையோ குறிக்கலாம். ஈசாக்குக்கு ஆபிரகாமின் சொந்த மக்களிடமிருந்து மனைவி எடுக்கும் சூழல் உறவினர்களைக் குறிக்கும் பொருளை ஆதரிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: תֵּלֵךְ
  choice: போய் … வேண்டும்
  rationale: இங்கு வினை கட்டளை அல்லது கடமையை வெளிப்படுத்துகிறது. தமிழில் ‘வேண்டும்’ அமைப்பு அந்தக் கட்டளை வலிமையை இயல்பாகத் தருகிறது.
- source_word: וְלָקַחְתָּ
  choice: அழைத்துக்கொண்டு வர வேண்டும்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’; ஆனால் ஊழியன் தனக்காக மனைவி எடுப்பதாகத் தவறாகப் புரியாதபடி, இந்தத் திருமணத் தூதின் சூழலில் மகனுக்கான மனைவியைப் பெற்று அழைத்துவருவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִשָּׁה
  choice: ஒரு மனைவி
  rationale: אִשָּׁה ‘பெண்’ அல்லது ‘மனைவி’ எனப் பொருள்படலாம்; திருமணச் சூழல் ‘மனைவி’ என்பதைத் தேவைப்படுத்துகிறது.
- source_word: לִבְנִי לְיִצְחָק
  choice: என் மகனாகிய ஈசாக்குக்காக
  rationale: மீண்டும் வரும் לְ உடன் ‘என் மகனுக்காக, ஈசாக்குக்காக’ என்ற பயனாளி-விளக்கப்பெயர் அமைப்பு உள்ளது. அதன் பொருளை இழக்காமல் இயல்பான தமிழில் ஒரே சொற்றொடராக வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: מוֹלַדְתִּי என்பதன் உறவுக் குழு/பிறந்த இடம் என்ற இருபொருள்
  choice: முதன்மை உரையில் ‘என் உறவினரிடத்திற்கு’
  alternative: ‘நான் பிறந்த இடத்திற்கு’
  rationale: மனைவியை ஆபிரகாமின் மக்களிடமிருந்து பெற வேண்டும் என்பதே உடனடிச் சூழலின் நோக்கம்; இருப்பினும் எபிரெயச் சொல்லின் இடம்சார்ந்த சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘அழைத்துக்கொண்டு வர வேண்டும்’ என்பது எபிரெய வினையின் திருமணச் சூழலைத் தெளிவுபடுத்துகிறது; ஊழியனே அந்தப் பெண்ணை மனைவியாக எடுத்துக்கொள்கிறான் என்ற தவறான தமிழ் வாசிப்பைத் தவிர்க்கிறது.
