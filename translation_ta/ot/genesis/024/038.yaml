base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/038.yaml
  text: But you shall go to my father's house and to my clan[a], and you shall take a wife for my son.
translation:
  language: ta
  text: ஆனால், நீ என் தந்தையின் வீட்டிற்கும் என் குலத்தாரிடமும்[a] சென்று, என் மகனுக்கு ஒரு மனைவியைப் பெற வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் குடும்பத்தாரிடம்’ அல்லது ‘என் உறவினரிடம்’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் உடனடி வீட்டாரை மட்டும் அல்ல, விரிந்த குடும்ப உறவுக் குழுவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: மாறாக
  rationale: முந்தைய தடைக்கு எதிர்மாறான கட்டளையை அறிமுகப்படுத்தும் வலியுறுத்தலுள்ள எதிர்மறைத் திருப்பமாக இச்சொற்றொடர் இங்கு பயன்படுகிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் ‘மாறாக’ அந்தப் பொருளைத் தருகிறது.
- source_word: בֵּית אָבִי
  choice: என் தந்தையின் வீட்டிற்கு
  rationale: ‘என் தந்தையின் வீடு’ என்ற எபிரேய வடிவத்தை நெருக்கமாகக் காக்கிறது; சூழலில் இது தந்தையின் குடும்ப வீட்டையும் குடும்பச் சூழலையும் குறிக்கக்கூடும்.
- source_word: תֵּלֵךְ
  choice: நீ ... போய்
  rationale: திருமண ஏற்பாட்டுக்கான அடுத்த செயலைத் தமிழில் இயல்பான தொடர் வினையெச்சமாக இணைக்கிறது; கட்டளையின் வலிமை இறுதி ‘வேண்டும்’ என்பதில் வெளிப்படுகிறது.
- source_word: מִשְׁפַּחְתִּי
  choice: என் குலத்தாரிடம்
  rationale: உடனடி குடும்பத்தைக் காட்டிலும் விரிந்த உறவுக் குழுவை இச்சொல் குறிக்கிறது. ‘குலத்தார்’ அந்த விரிந்த உறவுமுறைப் பொருளைத் தமிழில் காக்கிறது.
- source_word: וְלָקַחְתָּ
  choice: தேர்ந்தெடுக்க வேண்டும்
  rationale: לָקַח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்’; ஆனால் ஒருவருக்காக மனைவியைப் பெறும் திருமண ஏற்பாட்டுச் சூழலில், தமிழில் ‘மனைவியைத் தேர்ந்தெடுக்க வேண்டும்’ என்பது மனிதரைப் பொருள்போல் எடுத்துக்கொள்வதாக ஒலிக்காமல் செயற்பொருளை இயல்பாகத் தருகிறது.
- source_word: אִשָּׁה לִבְנִי
  choice: என் மகனுக்கு ஒரு மனைவியை
  rationale: אִשָּׁה இங்கு திருமணச் சூழலால் ‘மனைவி’ என்றும், לִבְנִי பயன் அல்லது நோக்கைக் குறைப்பதால் ‘என் மகனுக்கு’ என்றும் மொழிபெயர்க்கப்படுகிறது.
