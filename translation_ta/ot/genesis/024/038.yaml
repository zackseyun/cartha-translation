translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் எளிமையும் காக்கப்பட்டுள்ளன. ‘குலத்தார்’ என்பது வழக்கில் சற்றே உயர்நடையாக இருந்தாலும், மூலத்தின் விரிந்த உறவுக் குழு என்ற பொருளை ‘குடும்பம்’ என்பதைக் காட்டிலும் துல்லியமாகத் தருகிறது; அதற்காக அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
