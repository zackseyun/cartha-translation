  text: And Abraham said to his servant[a], the oldest of his household, who ruled over all that belonged to him[b], “Please put your hand under my thigh.”
translation:
  language: ta
  text: ஆபிரகாம் தன் வீட்டாரில் மூத்தவரும் தனக்கிருந்த அனைத்தையும் நிர்வகித்தவருமான தன் பணியாளரிடம், “தயவுசெய்து உன் கையை என் தொடைக்குக் கீழே வை[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தொடையின் கீழ் கையை வைப்பது பண்டைய காலத்தில் சத்தியம் செய்யும்போது பயன்படுத்தப்பட்ட ஒரு சைகை; அது முக்கியமான உறுதிமொழிப் பற்றுறுதியைச் சுட்டியிருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்தும் இறந்தகால வினை.
- source_word: עַבְדּוֹ
  choice: தன் பணியாளரிடம்
  rationale: עבד என்பதற்கு ‘அடிமை’ அல்லது ‘பணியாளர்’ எனப் பொருள் வரலாம்; இங்கு நம்பிக்கைக்குரிய வீட்டுப் பொறுப்பாளர் என்ற சூழலை ‘பணியாளர்’ இயல்பாக எடுத்துரைக்கிறது, சட்டநிலையைத் தேவையின்றி தீர்மானிக்கவில்லை.
- source_word: זְקַן בֵּיתוֹ
  choice: தன் வீட்டாரில் மூத்தவர்
  rationale: வயதிலும் அல்லது மூப்புநிலையிலும் முதன்மையானவர் என்ற எபிரெயச் சொல்லின் நெகிழ்வைத் தக்கவைத்து, வீட்டினரிடையே அவரது மூத்த நிலையைச் சுட்டுகிறது.
- source_word: הַמֹּשֵׁל בְּכָל אֲשֶׁר־לוֹ
  choice: தனக்கிருந்த அனைத்தையும் நிர்வகித்தவர்
  rationale: מֹשֵׁל குறிக்கும் அதிகாரத்துடன் மேற்பார்வை செய்தலை, தமிழில் இச்சூழலுக்குப் பொருத்தமான ‘நிர்வகித்தவர்’ என இயல்பாக வழங்குகிறது.
- source_word: שִׂים נָא
  choice: தயவுசெய்து ... வை
  rationale: கட்டளை வினையுடன் வரும் נָא-வின் பணிவான அல்லது வலியுறுத்திக் கேட்கும் தொனியைப் பாதுகாக்கிறது.
- source_word: יָדְךָ
  choice: உன் கையை
  rationale: நேரடியான பொருத்தமான மொழிபெயர்ப்பு.
- source_word: תַּחַת יְרֵכִי
  choice: என் தொடையின் கீழ்
  rationale: பண்பாட்டுக்கே உரிய சத்தியச் சைகையை விளக்கிச் சேர்க்காமல், எபிரெயச் சொற்றொடரை நேரடியாகத் தக்கவைக்கிறது.
