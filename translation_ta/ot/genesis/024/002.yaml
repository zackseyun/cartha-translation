  source_fidelity: 'முதன்மை உரை எபிரெய மூலத்துக்கு உண்மையாக உள்ளது: ஆபிரகாம் தம் பணியாளரை, வீட்டாரில் மூத்தவரும் தமக்கிருந்த அனைத்தையும் நிர்வகித்தவருமாக அடையாளப்படுத்தி, கையைத் தம் தொடையின் கீழ் வைக்குமாறு பணிவுடன் கேட்கிறார். ஆனால் பண்பாட்டு விளக்கக் குறிப்பின் அடையாளம் பணியாளரிடம் இணைக்கப்பட்டிருப்பது பொருளுக்கு ஏற்றதல்ல; அது ‘தொடையின் கீழ்’ என்ற சைகையுடன் இணைக்கப்பட வேண்டும்.'
  naturalness: ‘தன் வீட்டாரில் மூத்தவரும் தனக்கிருந்த அனைத்தையும் நிர்வகித்தவருமான’ என்பது நவீனத் தரநிலைத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘என் தொடையின் கீழ் வை’ என்பதற்குப் பதிலாக ‘என் தொடைக்குக் கீழே வை’ என்பது சொல்லிணைவு மற்றும் பேச்சோட்டத்தில் சற்றே இயல்பானது; பொருள் மாறாது.
