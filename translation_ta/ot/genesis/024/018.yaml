base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/018.yaml
  text: She said[a], “Drink, my lord,” and she quickly lowered her jar onto her hand and gave him a drink.
translation:
  language: ta
  text: அவள், “ஐயா[a], குடியுங்கள்” என்றாள்; உடனே தன் குடத்தைத் தன் கையின்மேல் இறக்கி, அவருக்குக் குடிக்கக் கொடுத்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் ஆண்டவரே.” எபிரெயத்தில் நேரடியாக இவ்வாறு உள்ளது; இங்கு இது ஒரு மனிதரிடம் மரியாதையாகப் பேசும் விளிப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵה
  choice: குடியுங்கள்
  rationale: இது இரண்டாம் நபர் ஆண்பால் ஒருமை ஏவல் வடிவம். தமிழில் மரியாதையான நேரடி அழைப்பை இயல்பாகத் தெரிவிக்க “குடியுங்கள்” தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲדֹנִי
  choice: ஐயா
  rationale: இங்கு இது இறைவனைக் குறிக்கும் பட்டம் அல்ல; அறிமுகமில்லாத ஒரு மனிதரிடம் காட்டப்படும் மரியாதையான விளிப்பு. “ஐயா” என்பது நவீனத் தமிழில் இயல்பான இணை; எபிரெயச் சொல்லின் நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַתְמַהֵר
  choice: விரைவாக
  rationale: செயல் தாமதமின்றி நடந்ததை இது தெரிவிக்கிறது. அடுத்த வினையோடு இணைந்த வினையடையாக மொழிபெயர்ப்பது தமிழில் இயல்பாக உள்ளது.
- source_word: וַתֹּרֶד כַּדָּהּ
  choice: தன் குடத்தை ... இறக்கி
  rationale: குடம் சுமந்திருந்த நிலையிலிருந்து கீழே கொண்டுவரப்பட்ட செயலை “இறக்கி” தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַל יָדָהּ
  choice: கையின்மேல்
  rationale: எபிரெய உரை நேரடியாக “அவளுடைய கையின்மேல்” என்கிறது. இவ்வசனத்தில் சொல்லப்படாத தோள் போன்ற விவரத்தைச் சேர்க்காமல் அந்த உடல்சார்ந்த படிமம் காக்கப்பட்டது.
- source_word: וַתַּשְׁקֵהוּ
  choice: அவருக்குக் குடிக்கக் கொடுத்தாள்
  rationale: שׁקה என்பதன் ஹிஃபில் வடிவம் ஒருவருக்குக் குடிக்கக் கொடுப்பதை அல்லது குடிக்கச் செய்வதை குறிக்கிறது. தேர்ந்தெடுக்கப்பட்ட சொற்றொடர் அந்தக் காரணவினைப் பொருளை இயல்பான தமிழில் தருகிறது.
