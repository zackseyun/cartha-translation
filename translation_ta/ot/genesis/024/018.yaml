  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. “ஐயா” என்பதற்கு ஏற்றவாறு “குடியுங்கள்,” “அவருக்கு” ஆகிய மரியாதை வடிவங்கள் தொடர்ச்சியாகப் பயன்படுத்தப்பட்டுள்ளன; எபிரெய உரையின் சுருக்கமும் செயல்களின் வேகமும் காக்கப்பட்டுள்ளன.
