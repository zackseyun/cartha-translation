  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַֽ/יְהִי ה֗וּא טֶרֶם֮ כִּלָּ֣ה לְ/דַבֵּר֒ וְ/הִנֵּ֧ה רִבְקָ֣ה יֹצֵ֗את אֲשֶׁ֤ר יֻלְּדָה֙ לִ/בְתוּאֵ֣ל בֶּן מִלְכָּ֔ה אֵ֥שֶׁת נָח֖וֹר אֲחִ֣י אַבְרָהָ֑ם וְ/כַדָּ֖/הּ עַל שִׁכְמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/015.yaml
  text: And it happened[a], before he had finished speaking, that behold, Rebekah was coming out—she who had been born to Bethuel son of Milcah, the wife of Nahor[b], Abraham’s brother—with her jar on her shoulder.
translation:
  language: ta
  text: அவன் பேசிமுடிப்பதற்குமுன்னே, இதோ, ஆபிரகாமின் சகோதரனான நாகோரின் மனைவி மில்காளின் மகனாகிய பெத்துவேலுக்குப் பிறந்த ரெபெக்காள், தன் தோள்மேல் குடத்தை வைத்துக்கொண்டு வெளியே வந்துகொண்டிருந்தாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי הוּא טֶרֶם כִּלָּה לְדַבֵּר
  choice: அவன் இன்னும் பேசி முடிக்காதிருக்கும்போதே
  rationale: טֶרֶם மற்றும் כִּלָּה ஆகியவை அவன் பேச்சு முடிவதற்கு முன்பே அடுத்த நிகழ்வு தொடங்கியதைச் சுட்டுகின்றன. וַיְהִי என்பதன் கதைத் தொடர்ச்சி செயல்பாடு தமிழின் காலவாக்கிய அமைப்பில் இயல்பாக வெளிப்படுகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கதையில் கவனத்தை உடனடியாகத் திருப்பும் எபிரெயச் சொல்லின் உயிரோட்டத்தையும் திடீர் காட்சிப்படுத்தலையும் ‘இதோ’ காக்கிறது.
- source_word: רִבְקָה יֹצֵאת
  choice: ரெபெக்காள் ... வெளியே வந்துகொண்டிருந்தாள்
  rationale: பெண்பால் ஒருமை நிகழ்காலப் பெயரெச்சம், அந்தக் கணத்தில் நடந்துகொண்டிருந்த செயலைக் காட்சிப்படுத்துவதால் தொடர்நிலை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אֲשֶׁר יֻלְּדָה לִבְתוּאֵל בֶּן מִלְכָּה אֵשֶׁת נָחוֹר אֲחִי אַבְרָהָם
  choice: ஆபிரகாமின் சகோதரனான நாகோரின் மனைவி மில்காளுக்குப் பிறந்த பெத்துவேலின் மகள்
  rationale: 'எபிரெய மூலத்தின் வம்சத் தொடர்புகளைத் தமிழில் குழப்பமின்றி வெளிப்படுத்துகிறது: மில்காள் நாகோரின் மனைவி; பெத்துவேல் அவர்களுடைய மகன்; ரெபெக்காள் பெத்துவேலின் மகள். ‘மகள்’ என்பது மூலத்தில் உள்ள பிறப்பு உறவை இயல்பான தமிழில் தெளிவாக்குகிறது.'
- source_word: וְכַדָּהּ עַל שִׁכְמָהּ
  choice: தன் தோள்மேல் குடத்தை வைத்துக்கொண்டு
  rationale: குடம் அவளுக்குரியது என்பதையும் அது அவளுடைய தோள்மேல் இருந்ததையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது; தண்ணீர் என்பது சூழலில் விளங்குவதால் சேர்க்கப்படவில்லை.
