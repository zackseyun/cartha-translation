translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற சற்றே உயர்ந்த கவனஈர்ப்புச் சொல் மூலத்தின் கதைநடை வலிமையைப் பாதுகாக்கிறது; மற்ற அமைப்புகள் இயல்பான தமிழ்ச் சொற்றொடராக வடிவமைக்கப்பட்டுள்ளன.
