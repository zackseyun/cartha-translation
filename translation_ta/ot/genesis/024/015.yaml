revisions:
- from: அவன் இன்னும் பேசி முடிக்காதிருக்கும்போதே, இதோ, ஆபிரகாமின் சகோதரனான நாகோரின் மனைவி மில்காளுக்குப் பிறந்த பெத்துவேலின் மகள் ரெபெக்காள், தன் தோள்மேல் குடத்தை வைத்துக்கொண்டு வெளியே வந்துகொண்டிருந்தாள்.
  to: அவன் பேசிமுடிப்பதற்குமுன்னே, இதோ, ஆபிரகாமின் சகோதரனான நாகோரின் மனைவி மில்காளின் மகனாகிய பெத்துவேலுக்குப் பிறந்த ரெபெக்காள், தன் தோள்மேல் குடத்தை வைத்துக்கொண்டு வெளியே வந்துகொண்டிருந்தாள்.
  rationale: 'The revision preserves the Hebrew’s two linked genealogical descriptions: Bethuel is identified as Milcah’s son, and Rebekah as one born to Bethuel. It also uses a concise, natural Tamil temporal clause without altering the narrative aspect or emphasis.'
