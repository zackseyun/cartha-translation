source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אֲ֠שֶׁר לֹֽא עָזַ֥ב חַסְדּ֛/וֹ וַ/אֲמִתּ֖/וֹ מֵ/עִ֣ם אֲדֹנִ֑/י אָנֹכִ֗י בַּ/דֶּ֨רֶךְ֙ נָחַ֣/נִי יְהוָ֔ה בֵּ֖ית אֲחֵ֥י אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/027.yaml
  text: And he said[a], “Blessed be Yahweh, the God of my master Abraham, who has not forsaken his steadfast love and his faithfulness from my master. As for me[b], Yahweh has led me on the way to the house of my master’s brothers.”
translation:
  language: ta
  text: அவன், “என் எஜமானாகிய ஆபிரகாமின் கடவுளான யாவே போற்றப்படுவாராக! அவர் தமது மாறாத அன்பையும் நம்பகத்தன்மையையும் என் எஜமானிடமிருந்து விலக்கிக்கொள்ளவில்லை. என்னையோ, என் எஜமானின் சகோதரர்களின்[a] வீட்டுக்குச் செல்லும் வழியில் யாவே வழிநடத்தினார்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்கள்” என்பது இங்கு ஆபிரகாமின் ஆண் உறவினர்களையோ அவரது குடும்ப வழியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: போற்றப்படுவாராக
  rationale: இது யாவேக்குச் செலுத்தப்படும் வாழ்த்துருவப் புகழ்மொழி; இயல்பான நவீனத் தமிழில் புகழ்ச்சியின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் தலைப்பால் மாற்றாமல், எபிரெய தனிப்பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: என் எஜமானாகிய ஆபிரகாமின் கடவுள்
  rationale: எபிரெய இணைப்புத் தொடரையும், ஊழியன் ஆபிரகாமைக் குறிப்பிடும் மரியாதைமிக்க אֲדֹנִי என்பதையும் இயல்பான தமிழில் காக்கிறது.
- source_word: לֹא עָזַב
  choice: காட்டத் தவறவில்லை
  rationale: ஒருவரிடமிருந்து அன்பையும் உண்மைத்தன்மையையும் விலக்கிக்கொள்ளவில்லை என்ற எபிரெய மரபுத்தொடரின் சூழற்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חַסְדּוֹ
  choice: தமது மாறாத அன்பு
  rationale: חֶסֶד என்பதிலுள்ள நிலையான அன்பு, இரக்கம், விசுவாசமான பற்றுறுதி ஆகிய நிழற்பொருள்களை மிகையாக விளக்காமல் எடுத்துரைக்கிறது.
- source_word: וַאֲמִתּוֹ
  choice: உண்மைத்தன்மை
  rationale: חֶסֶד உடன் இணைந்தபோது אֱמֶת என்பது வெறும் உண்மை என்பதைக் காட்டிலும் நம்பத்தகுந்த விசுவாசத்தன்மையைச் சுட்டுகிறது.
- source_word: אָנֹכִי
  choice: என்னையோ
  rationale: முன்னிலைப்படுத்தப்பட்ட தனிப்பெயர்ச்சொல்லின் வலியுறுத்தலைத் தமிழின் ‘-ஓ’ அமைப்பால் காக்கிறது.
- source_word: נָחַנִי
  choice: வழிநடத்தினார்
  rationale: பயணத்தில் யாவேயின் தனிப்பட்ட, நோக்கமுள்ள வழிகாட்டுதலை இயல்பாகக் குறிக்கிறது.
- source_word: בֵּית אֲחֵי אֲדֹנִי
  choice: என் எஜமானின் சகோதரர்களுடைய வீடு
  rationale: ‘வீடு’ மற்றும் ‘சகோதரர்கள்’ என்ற மூலச் சொற்களைத் தக்கவைக்கிறது; இங்கு சகோதரர்கள் என்பது ஆபிரகாமின் ஆண் உறவினரையோ குடும்ப வழியையோ குறிக்கலாம்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் அதனை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: חֶסֶד וֶאֱמֶת என்ற இணைச்சொல்லின் நுண்பொருள்
  choice: மாறாத அன்பும் உண்மைத்தன்மையும்
  alternative: உடன்படிக்கைப் பற்றுறுதியும் உண்மையும்
  rationale: உறவுசார் நிலைத்தன்மையையும் நம்பகத்தன்மையையும் வாசிக்க எளிய தமிழில் தருகிறது; ‘உடன்படிக்கை’ என்ற கருத்தை மூலத்தில் வெளிப்படையாக இல்லாத இடத்தில் சேர்க்கவில்லை.
- issue: מֵעִם אֲדֹנִי உடன் עזב என்பதன் தொடர்பு
  choice: என் எஜமானுக்கு ... காட்டத் தவறவில்லை
  alternative: என் எஜமானிடமிருந்து ... விலக்கிக்கொள்ளவில்லை
  rationale: எபிரெய சொற்றொடரின் ‘விட்டுவிடவில்லை/விலக்கவில்லை’ என்ற உருவகத்தை இயல்பான தமிழாக்கமாக்குகிறது; அன்பும் உண்மைத்தன்மையும் யாரை நோக்கியவை என்பதையும் தெளிவாக்குகிறது.
- issue: אֲחֵי என்பதன் உறவுமுறை விரிவு
  choice: சகோதரர்கள்
  alternative: ஆண் உறவினர்கள் / உறவினர் குடும்பம்
  rationale: மூலத்தின் ஆண்பால் பன்மைச் சொல்லை முதன்மை உரையில் காத்து, சூழலில் அதன் விரிவான குடும்பப் பொருளை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டிற்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘எஜமான்’ கதைச் சூழலிலுள்ள ஊழியன்–தலைவன் உறவைத் தெளிவாகக் காட்டுகிறது. அடிக்குறி [a] முதன்மை உரையில் உரிய இடத்தில் சேர்க்கப்பட்டுள்ளது.
