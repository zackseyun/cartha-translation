base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/049.yaml
  text: Now if you are going to show kindness and faithfulness to my master[a], tell me; but if not, tell me, so that I may turn to the right or to the left.
translation:
  language: ta
  text: இப்போது நீங்கள் என் எஜமானுக்குத் தயவும் நம்பகத்தன்மையும் காட்டப் போகிறீர்கள் என்றால், என்னிடம் சொல்லுங்கள்; இல்லையென்றால், அதையும் என்னிடம் சொல்லுங்கள்; அப்போது நான் வலப்பக்கமோ இடப்பக்கமோ திரும்புவேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, வேறொரு வழியையோ நடவடிக்கையையோ தேர்ந்தெடுப்பேன்.
    reason: எபிரெயத்தில் வரும் வலது/இடது திசை உருவகத்தின் சூழல்சார் பொருளை விளக்குகிறது; பிரதான உரையில் திசை மொழி அப்படியே காக்கப்படுகிறது.
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: ஊழியக்காரரின் உரையிலிருந்து உடனடியாக ஒரு முடிவைக் கோரும் நிலைக்கு மாறுவதை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: אִם יֶשְׁכֶם עֹשִׂים
  choice: நீங்கள் ... காட்டப் போகிறீர்கள் என்றால்
  rationale: ‘உங்களிடம்/உங்களில் செய்வது இருக்கிறதெனில்’ என்ற எபிரெய பங்கேற்புவினை அமைப்பின் முன்நோக்கிய விருப்பத்தையும் நோக்கத்தையும் சூழலுக்கு ஏற்ற தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֶסֶד וֶאֱמֶת
  choice: அன்பும் உண்மையும்
  rationale: חֶסֶד என்பதிலுள்ள உறவுசார் இரக்கமுள்ள பற்றுறுதியை ‘அன்பு’ இயல்பாகக் காட்டுகிறது; אֱמֶת என்பதிலுள்ள நம்பகத்தன்மை/உறுதிப்பாட்டை ‘உண்மை’ பாதுகாக்கிறது. இச்சொல் இணையின் செறிவான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶת אֲדֹנִי
  choice: என் எஜமானுக்கு
  rationale: இந்தச் செயல் யாரை நோக்கியது என்பதைத் தமிழில் இயல்பான நான்காம் வேற்றுமை உருபுடன் காட்டுகிறது.
- source_word: הַגִּידוּ לִי
  choice: என்னிடம் சொல்லுங்கள்
  rationale: நேரடியான பதிலைக் கோரும் பன்மை ஏவலை தெளிவாகவும் மரியாதையாகவும் வழங்குகிறது.
- source_word: וְאִם לֹא
  choice: இல்லையென்றாலும்
  rationale: சாதகமான பதில் இல்லாத மாற்று நிலையைக் குறுகிய, இயல்பான தமிழில் வேறுபடுத்துகிறது.
- source_word: וְאֶפְנֶה
  choice: அப்போது நான் ... திரும்பிச் செல்வேன்
  rationale: கோஹோர்டேட்டிவ் வடிவத்தின் விளைவுசார் நோக்கத்தையும் பேச்சாளரின் தீர்மானத்தையும் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַל יָמִין אוֹ עַל שְׂמֹאל
  choice: வலப்பக்கமோ இடப்பக்கமோ
  rationale: வேறொரு வழியைத் தேடுவேன் என்ற இடியோமப் பொருளைத் தரும் மூல மொழியின் திசை உருவகத்தை அப்படியே பாதுகாக்கிறது.
