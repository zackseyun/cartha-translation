- from: இப்போது நீங்கள் என் எஜமானுக்கு அன்பும் உண்மையும் காட்டப் போகிறீர்கள் என்றால், என்னிடம் சொல்லுங்கள்; இல்லையென்றாலும் என்னிடம் சொல்லுங்கள். அப்போது நான் வலப்பக்கமோ இடப்பக்கமோ திரும்பிச் செல்வேன்.[a]
  to: இப்போது நீங்கள் என் எஜமானுக்குத் தயவும் நம்பகத்தன்மையும் காட்டப் போகிறீர்கள் என்றால், என்னிடம் சொல்லுங்கள்; இல்லையென்றால், அதையும் என்னிடம் சொல்லுங்கள்; அப்போது நான் வலப்பக்கமோ இடப்பக்கமோ திரும்புவேன்.[a]
  rationale: மூலத்தின் மாற்று நிபந்தனையைத் துல்லியமாக்க ‘இல்லையென்றாலும்’ ‘இல்லையென்றால்’ என மாற்றப்பட்டது. இரண்டாவது ‘சொல்லுங்கள்’ மூலத்தில் இருப்பதை இயல்பாகச் சுட்ட ‘அதையும்’ சேர்க்கப்பட்டது. தேவையற்ற இயக்க நிழலைத் தவிர்க்க ‘திரும்பிச் செல்வேன்’ என்பதற்குப் பதில் ‘திரும்புவேன்’ இடப்பட்டுள்ளது. חֶסֶד וֶאֱמֶת இணையின் உறவுசார் தயை மற்றும் நம்பகத்தன்மை ஆகிய இரு பொருள்களையும் தெளிவுபடுத்த சொற்கள் மாற்றப்பட்டுள்ளன.
