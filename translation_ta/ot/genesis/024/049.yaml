translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமான உரையாடல் நடை. ‘எஜமான்’ என்ற சொல் வேலைக்காரன்–தலைவன் உறவைத் தெளிவாக வைத்திருக்கிறது. எபிரெயச் சொல் இணையின் ஒலி ஒற்றுமையையும் பாரம்பரியத் தெளிவையும் காக்க ‘அன்பும் உண்மையும்’ பயன்படுத்தப்பட்டுள்ளது; திசை உருவகம் பிரதான உரையில் பாதுகாக்கப்பட்டுள்ளது.
