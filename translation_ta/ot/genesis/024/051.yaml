base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/051.yaml
  text: Look[a], Rebekah is before you. Take her and go, and let her be the wife of your master's son, just as Yahweh has spoken.
translation:
  language: ta
  text: “இதோ, ரெபெக்கா உன் முன்னால் இருக்கிறாள். அவளை அழைத்துக்கொண்டு போ. யாவே கூறியபடியே அவள் உன் எஜமானின் மகனுக்கு மனைவியாக இருக்கட்டும்[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனைவியாக ஆகட்டும்.” எபிரெய வினைவடிவம் ‘இருக்கட்டும்’ அல்லது ‘ஆகட்டும்’ என்ற இரு நுட்பங்களையும் அனுமதிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: உடனிருக்கும் நபர்மீது கவனத்தை ஈர்க்கும் எபிரெயச் சுட்டிடைச்சொல்லின் உயிரோட்டத்தையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: רִבְקָה
  choice: ரெபெக்கா
  rationale: எபிரெயத் தனிப்பெயரின் நவீன தமிழுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: לְפָנֶיךָ
  choice: உன் முன்னால் இருக்கிறாள்
  rationale: சொற்றொடரின் ‘உனக்கு முன்பாக’ என்ற வடிவத்தையும், அவள் இங்கே ஒப்படைக்கத் தயாராக இருக்கிறாள் என்ற சூழல்சார்ந்த பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: קַח וָלֵךְ
  choice: அவளை அழைத்துக்கொண்டு போ
  rationale: இரண்டு தொடர்ச்சியான கட்டளைகளையும் தமிழில் இயல்பாக இணைக்கிறது; எபிரெயில் வெளிப்படையாக இல்லாத பெண்பால் பொருள் சூழலிலிருந்து தெளிவாக உள்ளது.
- source_word: וּתְהִי אִשָּׁה
  choice: மனைவியாக இருக்கட்டும்
  rationale: היה வினையின் வேண்டுகோள்/அனுமதி நுட்பத்தை ‘இருக்கட்டும்’ காக்கிறது; אִשָּׁה திருமணச் சூழலில் ‘மனைவி’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: உன் எஜமானின் மகனுக்கு
  rationale: லாமேத் குறிக்கும் உறவு அல்லது நோக்கத்தைத் தமிழின் திருமண வழக்குக்கு ஏற்ற ‘மகனுக்கு மனைவி’ என்ற அமைப்பில் தருகிறது; אֲדֹנֶיךָ இச்சூழலில் ‘எஜமான்’ ஆகும்.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: கூறியபடியே
  rationale: தெய்வீகக் கூற்றுடன் நிகழ்வு ஒத்துப்போவதைக் குறிக்கும் ‘எப்படிக் கூறினாரோ அப்படியே’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக இருப்பதால், பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- issue: וּתְהִי என்பதின் வேண்டுகோள்/அனுமதி நுட்பம்
  choice: மனைவியாக இருக்கட்டும்
  alternative: மனைவியாக ஆகட்டும்
  rationale: எபிரெய வடிவம் ‘இருக்கட்டும்’ அல்லது ‘ஆகட்டும்’ எனப் புரியக்கூடியது. முதன்மை உரை நிலை/பங்கு குறிக்கும் வாசிப்பைத் தருகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ மூலத்தின் கவன ஈர்ப்பை காக்கிறது; ‘அழைத்துக்கொண்டு போ’ கட்டளையைச் சொல்லுக்குச் சொல் கடினமாக்காமல் இயல்பாகத் தருகிறது. தெய்வீகப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
