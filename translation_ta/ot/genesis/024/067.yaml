translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமும் எளிய வாசிப்புத்தன்மையும் பேணப்பட்டுள்ளன. ‘அழைத்துச் சென்றான்’, ‘ஏற்றுக்கொண்டான்’, ‘ஆறுதல் அடைந்தான்’ ஆகியவை மூலத்தின் தொடர் செயல்களை இயல்பாகத் தருகின்றன. ‘தன் தாயை இழந்தபின்’ என்பது சூழலைத் தெளிவாக்கினாலும், மூலத்தில் மரணம் வெளிப்படையாகச் சொல்லப்படாததை அடிக்குறிப்பு பாதுகாக்கிறது.
