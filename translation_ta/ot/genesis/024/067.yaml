base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/067.yaml
  text: And Isaac brought her into the tent of Sarah his mother[a], and he took Rebekah, and she became his wife, and he loved her[b]. So Isaac was comforted after his mother's death.
translation:
  language: ta
  text: ஈசாக்கு அவளைத் தன் தாய் சாராளின் கூடாரத்திற்குள் அழைத்துச் சென்றான்.[a] அவன் ரெபெக்காளைத் தனக்குக் கொண்டான்; அவள் அவனுக்கு மனைவியானாள். அவன் அவளை நேசித்தான். இவ்வாறு, தன் தாய்க்குப் பிறகு ஈசாக்கு ஆறுதல் அடைந்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் தாய் சாராளுடைய கூடாரத்திற்குள்.” எபிரெயச் சொல் வரிசை இரு அமைப்புகளுக்கும் இடமளிக்கிறது; அடிப்படைப் பொருள் ஒன்றே.
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, “தன் தாய்க்குப் பின்.” சூழலில் இது தாயின் மரணம் அல்லது இழப்புக்குப் பிந்தைய காலத்தைக் குறிக்கிறது; ஆனால் “மரணம்” என்ற சொல் எபிரெயத்தில் வெளிப்படையாக இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִאֶהָ
  choice: அவளை ... அழைத்துச் சென்றான்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘அவளை வரச்செய்தான்/அழைத்துச் சென்றான்’ என்று பொருள்படும். தமிழில் நுழைவையும் தனிப்பட்ட அழைத்துச் செல்லுதலையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: הָאֹהֱלָה
  choice: கூடாரத்திற்குள்
  rationale: திசையைக் குறிக்கும் இறுதி ה, கூடாரத்தை நோக்கிய இயக்கத்தையும் சூழலில் அதற்குள் நுழைவதையும் குறிக்கிறது.
- source_word: שָׂרָה אִמּוֹ
  choice: தன் தாய் சாராளின்
  rationale: சாராள் ஈசாக்கின் தாய் என்பதையும் கூடாரம் அவளுடையது என்பதையும் இயல்பான தமிழ் உறவுத்தொடரில் வெளிப்படுத்துகிறது.
- source_word: וַיִּקַּח אֶת־רִבְקָה
  choice: ரெபெக்காளை ஏற்றுக்கொண்டான்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொண்டான்’; திருமணச் சூழலில் ‘மனைவியாக ஏற்றுக்கொண்டான்’ என்ற உட்பொருள் உண்டு. அடுத்த கூற்று அவள் மனைவியானதைத் தனியே சொல்வதால், ‘திருமணம் செய்தான்’ என்று இரு கூறுகளையும் ஒன்றாக்காமல் ‘ஏற்றுக்கொண்டான்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: அவள் அவனுக்கு மனைவியானாள்
  rationale: היה + ל + אשה என்ற மரபுத்தொடர் திருமண உறவு ஏற்பட்டதைக் குறிக்கிறது; தமிழ் வடிவம் அதன் கதையோட்ட முன்னேற்றத்தைப் பாதுகாக்கிறது.
- source_word: וַיֶּאֱהָבֶהָ
  choice: அவன் அவளை நேசித்தான்
  rationale: אהב என்பதன் நேரான பொருளான அன்பைத் துல்லியமாக வழங்குகிறது.
- source_word: וַיִּנָּחֵם
  choice: ஆறுதல் அடைந்தான்
  rationale: இங்கு נחם என்பதன் நிஃபால் வடிவம் மனந்திரும்புதலை அல்ல, ஆறுதல் பெறுதலைக் குறிக்கிறது.
- source_word: אַחֲרֵי אִמּוֹ
  choice: தன் தாயை இழந்தபின்
  rationale: எபிரெயத்தில் சொற்சொல்லாக ‘தன் தாய்க்குப் பின்’ என்றிருந்தாலும், சாராளின் மரணத்திற்குப் பிந்தைய துயரமே சூழலில் குறிக்கப்படுகிறது. ‘இழந்தபின்’ என்பது ‘மரணம்’ என்ற சொல்லை நேரடியாகச் சேர்க்காமல் இயல்பான தமிழில் அதைப் புலப்படுத்துகிறது.
