revisions:
- from: ஈசாக்கு அவளைத் தன் தாய் சாராளின் கூடாரத்திற்குள் அழைத்துச் சென்றான்.[a] அவன் ரெபெக்காளை ஏற்றுக்கொண்டான்; அவள் அவனுக்கு மனைவியானாள். அவன் அவளை நேசித்தான். இவ்வாறு, தன் தாயை இழந்தபின் ஈசாக்கு ஆறுதல் அடைந்தான்.[b]
  to: ஈசாக்கு அவளைத் தன் தாய் சாராளின் கூடாரத்திற்குள் அழைத்துச் சென்றான்.[a] அவன் ரெபெக்காளைத் தனக்குக் கொண்டான்; அவள் அவனுக்கு மனைவியானாள். அவன் அவளை நேசித்தான். இவ்வாறு, தன் தாய்க்குப் பிறகு ஈசாக்கு ஆறுதல் அடைந்தான்.[b]
  rationale: The revision makes the marriage idiom more faithful to לקח while keeping the next clause distinct, and it removes the explicit inference of loss from the main rendering of אַחֲרֵי אִמּוֹ. The existing footnote appropriately supplies the contextual explanation without overstating the Hebrew.
