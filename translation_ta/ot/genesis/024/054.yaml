  text: וַ/יֹּאכְל֣וּ וַ/יִּשְׁתּ֗וּ ה֛וּא וְ/הָ/אֲנָשִׁ֥ים אֲשֶׁר עִמּ֖/וֹ וַ/יָּלִ֑ינוּ וַ/יָּק֣וּמוּ בַ/בֹּ֔קֶר וַ/יֹּ֖אמֶר שַׁלְּחֻ֥/נִי לַֽ/אדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/054.yaml
  text: Then he and the men who were with him ate and drank[a], and they spent the night there. When they arose in the morning, he said, “Send me away to my master.”
translation:
  language: ta
  text: பின்பு அவனும் அவனோடு இருந்த ஆட்களும் சாப்பிட்டுக் குடித்து, அங்கே இரவைக் கழித்தார்கள். காலையில் அவர்கள் எழுந்தபோது, அவன், “என் எஜமானிடம் என்னை அனுப்பிவிடுங்கள்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் தலைவரிடம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல்லான אֲדֹנִי என்பதற்கு “என் தலைவர்” அல்லது “என் எஜமான்” என்று பொருள் கொள்ளலாம்; இங்கு அது பணியாளரின் மனித எஜமானாகிய ஆபிரகாமைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: சாப்பிட்டுக் குடித்து
  rationale: உண்பதும் குடிப்பதும் ஆகிய தொடர்ச்சியான செயல்களை இயல்பான நவீனத் தமிழில் சுருக்கமாகவும் மூலத்தின் வரிசையைப் பேணியும் தெரிவிக்கிறது.
- source_word: הוּא וְהָאֲנָשִׁים אֲשֶׁר עִמּוֹ
  choice: அவனும் அவனோடு இருந்த ஆட்களும்
  rationale: எபிரெயத்தில் வெளிப்படையாக உள்ள ஒருமைப் பெயர்ச்சுட்டையும் அவனுடன் இருந்த ஆண்களையும் தெளிவாகக் காட்டுகிறது.
- source_word: וַיָּלִינוּ
  choice: அங்கே இரவைக் கழித்தார்கள்
  rationale: לון/לין என்பதன் ‘இரவு தங்குதல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; சூழலில் அந்த இடத்திலேயே தங்கியதை ‘அங்கே’ தெளிவாக்குகிறது.
- source_word: וַיָּק֣וּמוּ בַבֹּקֶר
  choice: காலையில் அவர்கள் எழுந்தபோது
  rationale: கதைநிகழ்வின் அடுத்த செயலை இயல்பான காலவாக்கியமாகத் தருகிறது.
- source_word: שַׁלְּחֻנִי
  choice: என்னை அனுப்பிவிடுங்கள்
  rationale: புறப்பட்டுச் செல்ல அனுமதித்து அனுப்ப வேண்டும் என்ற கட்டளை வடிவத்தின் சூழல்சார்ந்த பொருளைத் தெரிவிக்கிறது.
- source_word: לַאדֹנִי
  choice: என் எஜமானிடம்
  rationale: இங்கு ஆபிரகாமைச் சுட்டும் אָדוֹן, பணியாளருக்கும் அவரது மனித எஜமானுக்கும் உள்ள உறவை குறிக்கிறது; ‘எஜமான்’ இதைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ஆபிரகாமைக் குறிக்கும் אָדוֹן என்பதன் மொழிபெயர்ப்பு
  choice: என் எஜமானிடம்
  alternative: என் தலைவரிடம்
  rationale: இச்சொல் இங்கு தெய்வீகப் பட்டமல்ல; பணியாளரின் மனித எஜமானாகிய ஆபிரகாமைக் குறிக்கிறது. ‘எஜமான்’ அந்தச் சமூக உறவைத் தெளிவாகத் தெரிவிக்கிறது; அதேவேளை ‘தலைவர்’ என்பது சாத்தியமான மாற்று.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கதைநடையின் சுருக்கம் பேணப்பட்டுள்ளது; உரையாடலில் உள்ள பன்மைக் கட்டளை ‘அனுப்பிவிடுங்கள்’ எனத் தெளிவாகத் தரப்பட்டுள்ளது.
