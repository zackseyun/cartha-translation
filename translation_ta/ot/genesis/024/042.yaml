base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/042.yaml
  text: Today I came to the spring and said[a], ‘O Yahweh, God of my master Abraham[b], if now you are prospering my way on which I am going—’
translation:
  language: ta
  text: இன்று நான் நீரூற்றுக்கு[a] வந்து, ‘என் எஜமானாகிய ஆபிரகாமின் கடவுளான யாவே, நான் சென்றுகொண்டிருக்கும் என் வழியில் தயவுசெய்து நீர் வெற்றி அளித்தால்—’ என்று சொன்னேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கிணறு’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் இன்னும் குறிப்பாக நீரூற்று அல்லது நீராதாரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבֹא הַיּוֹם
  choice: இன்று நான் ... வந்து
  rationale: வாவ் தொடர்வினை கடந்தகால நிகழ்வை விவரிக்கிறது; הַיּוֹם காலவினையடையாக வந்து, அதே நாளில் வந்ததை வலியுறுத்துகிறது.
- source_word: הָעָיִן
  choice: நீரூற்றுக்கு
  rationale: עַיִן என்பது குறிப்பாக இயற்கையான நீரூற்று அல்லது நீராதாரத்தைக் குறிக்கிறது; பொதுவான ‘கிணறு’ என்பதைக் காட்டிலும் ‘நீரூற்று’ எபிரெயச் சொல்லுக்கு நெருக்கமானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரின் தமிழ் ஒலிபெயர்ப்பு; அதை ஒரு பட்டப்பெயராக மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கிறது.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: என் எஜமானாகிய ஆபிரகாமின் கடவுள்
  rationale: இங்கு אֲדֹנִי என்பது தெய்வீகப் பட்டப்பெயர் அல்ல; பணியாளனின் மனித எஜமானான ஆபிரகாமைக் குறிக்கிறது.
- source_word: אִם יֶשְׁךָ נָּא מַצְלִיחַ
  choice: இப்போது நீர் வெற்றியடையச் செய்கிறீர் என்றால்
  rationale: இந்த எபிரெயத் தொடர் நிறைவுபெறாத நிபந்தனை வடிவிலும் மன்றாட்டுத் தொனியிலும் உள்ளது. צלח என்பதன் ஹிஃபில் வடிவம் வெற்றியடையச் செய்வதைக் குறிக்கிறது; נָא தரும் மன்றாட்டுத் தொனி ‘இப்போது’ என்பதில் மென்மையாக வெளிப்படுகிறது.
- source_word: דַּרְכִּי
  choice: என் வழியை
  rationale: ‘என் வழி’ என்ற மூலத்தின் உடைமைப்பொருளை நேரடியாகப் பாதுகாக்கிறது; சூழலில் அது பணியாளனின் பயணம் அல்லது பணியைக் குறிக்கிறது.
- source_word: אֲשֶׁר אָנֹכִי הֹלֵךְ עָלֶיהָ
  choice: நான் சென்றுகொண்டிருக்கும்
  rationale: ‘அதன்மேல் நான் சென்றுகொண்டிருக்கிறேன்’ என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் நான்கெழுத்துத் தெய்வீகப் பெயர் நேரடியாக உள்ளது. ‘யாவே’ என்பது பெரும்பாலான ஆய்வாளர்கள் ஏற்கும் உச்சரிப்பைத் தமிழில் ஒலிபெயர்த்து, பெயரைப் பட்டப்பெயராக மாற்றாமல் பாதுகாக்கிறது.
- issue: முடிவுறாத நிபந்தனை வாக்கியம்
  choice: என்றால்—
  alternative: என்றால், என் வேண்டுதலை நிறைவேற்றும்
  rationale: எபிரெய வசனம் நிபந்தனையை முடிக்காமல் நிற்கிறது; அடுத்த வசனத்தில் தொடரும் எண்ணத்தை இங்கே நிரப்பாமல் நீண்ட கோட்டால் அதன் பதற்றத்தையும் இலக்கணத் திறந்தநிலையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க வேதாகம நடையிலும் அமைக்கப்பட்டது. யாவேயை நோக்கிய உரையில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டது. மூலத்தின் நிறைவுபெறாத நிபந்தனை அமைப்பு நீண்ட கோட்டுடன் பாதுகாக்கப்பட்டது.
