lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அதற்கு அவர்கள் … என்றார்கள்
  rationale: வழக்கமான எபிரேயக் கதைத் தொடரை இயல்பான தமிழில் காட்டுகிறது; இங்கு முந்தைய பேச்சுக்கான பதில் என்பதால் ‘அதற்கு’ பொருத்தமானது.
- source_word: נִקְרָא
  choice: அழைத்து
  rationale: முதலாம் நபர் பன்மை விருப்பக் கூற்றை அடுத்துள்ள ‘கேட்போம்’ உடன் இயல்பாக இணைக்கிறது; சூழலில் அவளை வரவழைப்பதே பொருள்.
- source_word: לַנַּעֲרָ
  choice: அந்த இளம்பெண்ணை
  rationale: திருமண வயதிலுள்ள ரெபெக்காளைக் குறிக்கும் נַעֲרָה என்பதற்கு, குழந்தை என்ற தவறான எண்ணத்தையும் பழமையான நடையையும் தவிர்க்கும் நவீனத் தமிழ் இணை.
- source_word: וְנִשְׁאֲלָה אֶת־פִּיהָ
  choice: அவளிடமே கேட்போம்
  rationale: சொல்லுக்கு சொல் ‘அவளுடைய வாயைக் கேட்போம்’ என்ற எபிரேய மரபுத்தொடர், அவளுடைய சொந்தப் பதிலை நேரடியாகக் கேட்பதைக் குறிக்கிறது. ‘அவளிடமே’ அந்த வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
