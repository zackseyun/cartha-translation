  yaml_path: translation/ot/genesis/024/057.yaml
  text: And they said[b][a], “Let us call the young woman and ask her.”
translation:
  language: ta
  text: அதற்கு அவர்கள், “அந்த இளம்பெண்ணை அழைத்து, அவளிடமே கேட்போம்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “அவளுடைய வாயைக் கேட்போம்”; அதாவது, அவளுடைய சொந்தப் பதிலை அவளிடமிருந்தே நேரடியாகக் கேட்போம்.
