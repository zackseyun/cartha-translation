revisions:
- from: அந்த மனிதன் வீட்டுக்குள் வந்தான். அவன் ஒட்டகங்களின் சுமைகளை இறக்கி[a], அவற்றுக்கு வைக்கோலும் தீவனமும் கொடுத்தான்; மேலும், அவனும் அவனுடன் இருந்த மனிதர்களும் தங்கள் கால்களைக் கழுவிக்கொள்ளத் தண்ணீர் கொடுத்தான்.[b]
  to: அந்த மனிதன் வீட்டுக்குள் வந்தான். அவன் ஒட்டகங்களின் கட்டுகளை அவிழ்த்து[a], அவற்றுக்கு வைக்கோலும் தீவனமும் கொடுத்தான்; மேலும், அவனுடைய கால்களையும் அவனுடன் இருந்த மனிதர்களின் கால்களையும் கழுவுவதற்குத் தண்ணீர் கொடுத்தான்.[b]
  rationale: The revision preserves the Hebrew’s unnamed third-person masculine subject and the narrative ambiguity noted by the audit trail, while avoiding an interpretive insertion of Laban. It restores the explicit possessive distinction in the foot-washing clause and uses a broader rendering for the idiomatic camel action. Footnote anchors and their lexical/subject-ambiguity functions are retained.
