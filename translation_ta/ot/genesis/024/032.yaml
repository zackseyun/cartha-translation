base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/032.yaml
  text: So the man came into the house and unloaded the camels and gave straw and feed to the camels[b][a], and water to wash his feet and the feet of the men who were with him.
translation:
  language: ta
  text: அந்த மனிதன் வீட்டுக்குள் வந்தான். அவன் ஒட்டகங்களின் கட்டுகளை அவிழ்த்து[a], அவற்றுக்கு வைக்கோலும் தீவனமும் கொடுத்தான்; மேலும், அவனுடைய கால்களையும் அவனுடன் இருந்த மனிதர்களின் கால்களையும் கழுவுவதற்குத் தண்ணீர் கொடுத்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரைச் சொல்லுக்குச் சொல் மொழிபெயர்த்தால், ‘ஒட்டகங்களைத் திறந்தான்’ என்று வரும். வந்தபின் ஒட்டகங்களின் சேணம், கட்டுகள் அல்லது பிற உபகரணங்களைக் கழற்றி அவற்றை இளைப்பாறவிட்டதைக் குறிக்கும் மரபுத்தொடர் இது. ‘ஒட்டகங்களின் சுமைகளை இறக்கினான்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவிழ்த்தான்,’ ‘கொடுத்தான்’ என்பவற்றின் செய்பவர் அந்த மனிதன் என்று எபிரெய இலக்கணத்தின் இயல்பான தொடர்ச்சிப்படி இங்கு மொழிபெயர்க்கப்பட்டுள்ளது. ஆனால் முந்தைய வசனத்தின் சூழலைக் கொண்டு, விருந்தோம்பிய லாபானே இவற்றைச் செய்தான் என்றும் புரிந்துகொள்ளலாம்; இந்த வசனத்தின் எபிரெய உரை அவன் பெயரைக் குறிப்பிடவில்லை.
    reason: subject_ambiguity
lexical_decisions:
- source_word: וַיָּבֹא הָאִישׁ הַבַּיְתָה
  choice: அந்த மனிதன் வீட்டுக்குள் வந்தான்
  rationale: בוא with the directional ending on ‘house’ indicates movement into the house. ‘அந்த மனிதன்’ retains the explicit source designation rather than replacing it with the interpretive ‘வேலைக்காரன்’.
- source_word: וַיְפַתַּח הַגְּמַלִּים
  choice: ஒட்டகங்களின் சுமைகளை இறக்கி
  rationale: פתח literally means ‘open,’ but in this setting refers idiomatically to relieving the camels by loosening or removing their gear/load. This is expressed naturally in modern Tamil, with the lexical range noted.
- source_word: תֶּבֶן וּמִסְפּוֹא
  choice: வைக்கோலும் தீவனமும்
  rationale: תבן denotes straw/stubble, while מספוא denotes animal fodder or feed. The paired Tamil terms preserve the distinction clearly.
- source_word: וּמַיִם לִרְחֹץ רַגְלָיו
  choice: அவனும் … தங்கள் கால்களைக் கழுவிக்கொள்ளத் தண்ணீர்
  rationale: The infinitive expresses the purpose for which water was supplied. Tamil recasts the body-part construction naturally while retaining the referents.
- source_word: וְרַגְלֵי הָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: அவனுடன் இருந்த மனிதர்களும் தங்கள் கால்களை
  rationale: This preserves the explicit plural ‘men’ and their association with the man in idiomatic modern Tamil.
theological_decisions:
- issue: வַיְפַתַּח and וַיִּתֵּן verbs' implicit subject
  choice: The main text lets ‘அவன்’ continue from ‘அந்த மனிதன்,’ reflecting the most immediate grammatical linkage.
  alternative: Understand the unnamed subject of the hospitality actions as Laban, based on the preceding context.
  rationale: The Hebrew does not name Laban in this verse. Its third-person masculine singular verbs can naturally continue with ‘the man,’ though the host-guest context permits Laban as the implied agent. The footnote preserves this genuine narrative ambiguity without inserting a name into the text.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘தீவனம்’ என்பது தெளிவான பொதுவழக்குச் சொல்; ‘மனிதன்/மனிதர்கள்’ என்பவை மூலத்தின் אישׁ/אנשים சொற்களைத் துல்லியமாகப் பிரதிபலிக்கின்றன. எபிரெய மூலத்தில் உள்ள செய்பவர் குறித்த தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
