reference: Genesis 24:62
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/יִצְחָק֙ בָּ֣א מִ/בּ֔וֹא בְּאֵ֥ר לַחַ֖י רֹאִ֑י וְ/ה֥וּא יוֹשֵׁ֖ב בְּ/אֶ֥רֶץ הַ/נֶּֽגֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/062.yaml
  text: Isaac had come from Beer-lahai-roi[b][a], and he was dwelling in the land of the Negev.
translation:
  language: ta
  text: ஈசாக்கு பெயேர்-லகாய்-ரோயியிலிருந்து[b] வந்திருந்தான்[a]. அவன் நெகேவ் நாட்டில் குடியிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஈசாக்கு பெயேர்-லகாய்-ரோயியிலிருந்து வந்தான்.” எபிரெயக் கட்டமைப்பை இறந்தகால நிறைவாக அல்லாமல் எளிய இறந்தகாலத்திலும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: பெயேர்-லகாய்-ரோயி என்பது முன்பு ஆகாருடன் தொடர்புபடுத்தப்பட்ட ஓர் இடப்பெயர் (தொடக்க நூல் 16:14 பார்க்கவும்).
    reason: cross_reference
lexical_decisions:
- source_word: בָּא
  choice: வந்திருந்தான்
  rationale: בוא என்பதன் Qal முற்றுவினை, நிறைவடைந்த வருகையைக் குறிக்கிறது. அடுத்த நிகழ்வுக்கு முன்பே இந்த வருகை நடந்ததாகக் கதை ஓட்டம் காட்டுவதால், தமிழில் இறந்தகால நிறைவைக் காட்டும் ‘வந்திருந்தான்’ இயல்பாக உள்ளது; எனினும் ‘வந்தான்’ என்பதும் சாத்தியம்.
- source_word: מִבּוֹא
  choice: இலிருந்து
  rationale: מִן + בוא என்ற சுருக்கமான எபிரெயக் கட்டமைப்பு இங்கு இயக்கத்தின் தொடக்க இடத்தைக் குறிக்கிறது; ஆகவே இடப்பெயருடன் இணையும் தமிழ் நீங்கல் உருபான ‘இலிருந்து’ பயன்படுத்தப்பட்டது.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: பெயேர்-லகாய்-ரோயி
  rationale: இது ஓர் இடப்பெயர்; பொருள் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது. கூட்டுப் பெயரின் பகுதிகளைத் தெளிவுபடுத்த இணைப்புக்குறிகள் வைக்கப்பட்டன.
- source_word: יוֹשֵׁב
  choice: குடியிருந்தான்
  rationale: பங்கேற்புவினை தொடரும் நிலை அல்லது வழக்கமான வசிப்பைக் காட்டுகிறது. ‘குடியிருந்தான்’ அந்த நீடித்த குடியிருப்பு நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: நெகேவ் நாட்டில்
  rationale: נֶגֶב தெற்கிலுள்ள வறண்ட நிலப்பகுதியின் புவியியல் பெயராக இங்கு வருகிறது; אֶרֶץ என்பதையும் வெளிப்படுத்த ‘நெகேவ் நாட்டில்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְהוּא
  choice: அவன்
  rationale: எபிரெயில் வெளிப்படையாக உள்ள ஆண்பால் ஒருமைப் பெயர்ப்பதிலி பின்னணித் தகவலுக்கு மாறுதலைக் குறிக்கிறது. தமிழில் புதிய வாக்கியத்தின் தொடக்கத்தில் ‘அவன்’ என்று இயல்பாகத் தரப்பட்டது; וְ என்பதற்காக தேவையற்ற இணைப்புச் சொல்லைச் சேர்க்கவில்லை.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. மூலத்தில் தனியான ‘இப்போது’ என்ற காலச் சொல் இல்லாததால் அத்தகைய தொடக்கச் சொல் சேர்க்கப்படவில்லை. தொடர்ச்சியான வசிப்பை ‘குடியிருந்தான்’ என்றும், கதை நிகழ்வுகளின் முன்நிலையை ‘வந்திருந்தான்’ என்றும் வேறுபடுத்திக் காட்டுகிறது.
