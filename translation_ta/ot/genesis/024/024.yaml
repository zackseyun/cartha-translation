  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட உறவுமுறைத் தொடரைத் தெளிவாக்க ‘மகனான’ சேர்க்கப்பட்டுள்ளது; மூலத்தின் பொருள் மாற்றப்படவில்லை.
