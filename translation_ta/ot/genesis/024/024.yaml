base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/024.yaml
  text: She said to him[a], “I am the daughter of Bethuel son of Milcah, whom she bore to Nahor.”
translation:
  language: ta
  text: அவள் அவனிடம், “மில்க்காள் நாகோருக்குப் பெற்றெடுத்த[a] மகனான பெத்துவேலின் மகள் நான்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நாகோருக்காகப் பெற்றெடுத்த” என்றும் மொழிபெயர்க்கலாம். எபிரெயப் பிறப்பு மரபுத்தொடரில் “ஒருவருக்குப் பெற்றெடுத்தல்” என்பது பொதுவாகத் தந்தையை அடையாளப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: அவள் அவனிடம் ... என்றாள்
  rationale: தொடர்நிகழ்வைக் குறிக்கும் வַ־ என்பதைத் தமிழில் தனியாகக் காட்டாமல், இயல்பான கதைநடையில் இறந்தகால வினையாக வழங்குகிறது; אֵלָיו பேச்சின் திசையை ‘அவனிடம்’ எனத் தெளிவுபடுத்துகிறது.
- source_word: בַּת בְּתוּאֵל אָנֹכִי
  choice: பெத்துவேலின் மகள் நான்
  rationale: வினையில்லாத எபிரெய அடையாள வாக்கியத்தின் வலியுறுத்தலை இயல்பான தமிழ்ச் சொல்வரிசையில் காக்கிறது.
- source_word: בֶּן מִלְכָּה
  choice: மில்க்காளின் மகனான
  rationale: பெத்துவேல் மில்க்காளின் மகன் என்ற உறவைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: אֲשֶׁר יָלְדָה לְנָחוֹר
  choice: மில்க்காள் நாகோருக்குப் பெற்றெடுத்த
  rationale: יָלְדָה என்பதன் பெண்பால் எழுவாயை மில்க்காள் என வெளிப்படையாகக் காட்டி, לְ־ குறிக்கும் தந்தைத் தொடர்பை ‘நாகோருக்கு’ என்று காக்கிறது.
- source_word: בְּתוּאֵל / מִלְכָּה / נָחוֹר
  choice: பெத்துவேல் / மில்க்காள் / நாகோர்
  rationale: தனிப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
