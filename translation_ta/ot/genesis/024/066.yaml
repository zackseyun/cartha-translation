  yaml_path: translation/ot/genesis/024/066.yaml
  text: And the servant told Isaac all the things that he had done[a][b].
translation:
  language: ta
  text: அந்த வேலைக்காரன்[b] தான் செய்த எல்லாவற்றையும்[a] ஈசாக்கிடம் விவரித்துச் சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எல்லாக் காரியங்களையும்’ அல்லது ‘எல்லா நிகழ்வுகளையும்’; எபிரெயச் சொல் דְּבָרִים சூழலுக்கேற்ப சொற்கள், காரியங்கள் அல்லது நிகழ்வுகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அடிமை’; எபிரெயச் சொல் עֶבֶד ‘வேலைக்காரன்’ அல்லது ‘அடிமை’ ஆகிய இரு பொருள்களிலும் வரலாம். இங்கு அவனுடைய சமூக நிலையைவிட அவன் ஆற்றும் பணி முன்னிலைப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: விவரித்துச் சொன்னான்
  rationale: Piel வடிவிலுள்ள ספר இங்கு நடந்தவற்றை எடுத்துரைப்பதைக் குறிக்கிறது. ‘விவரித்துச் சொன்னான்’ என்பது வெறும் ‘சொன்னான்’ என்பதைவிட நிகழ்வுகளை மீள எடுத்துரைத்த உணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: הָעֶבֶד
  choice: அந்த வேலைக்காரன்
  rationale: עֶבֶד என்பதற்கு ‘வேலைக்காரன்’ அல்லது ‘அடிமை’ என்று பொருள் வரலாம். இச்சூழலில் அவனுடைய பணி முன்னிலைப்படுவதால் ‘வேலைக்காரன்’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, சட்ட அல்லது சமூக நிலையை வலியுறுத்தக்கூடிய மாற்றுச் சொல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְיִצְחָק
  choice: ஈசாக்கிடம்
  rationale: יִצְחָק என்ற பெயர் வழக்கமான நவீன தமிழ் வேதாகமப் பெயர் வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது; לְ என்னும் முன்னொட்டு சொல்லின் பெறுநரைக் குறிப்பதால் ‘-இடம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: எல்லாவற்றையும்
  rationale: דְּבָרִים என்பது சொற்கள், காரியங்கள் அல்லது நிகழ்வுகளைக் குறிக்கக்கூடும். இங்கு பயணத்தின்போது நடந்த செயல்கள் மற்றும் நிகழ்வுகள் அனைத்தையும் உள்ளடக்கும் இயல்பான விரிவான சொற்றொடராக ‘எல்லாவற்றையும்’ அமைகிறது.
- source_word: אֲשֶׁר עָשָׂה
  choice: தான் செய்த
  rationale: עָשָׂה நிறைவுற்ற செயலைக் குறிக்கிறது. முன்பு வேலைக்காரன் செய்த செயல்களை இப்போது அவனே எடுத்துரைப்பதை ‘தான் செய்த’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
