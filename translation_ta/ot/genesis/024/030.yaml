base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/030.yaml
  text: And it happened[a], when he saw the nose ring and the bracelets on his sister’s hands, and when he heard the words of Rebekah his sister, saying, “This is what the man said to me,” that he went to the man. And behold[d][c][b], he was standing by the camels at the spring.
translation:
  language: ta
  text: அவன் மூக்குத்தியையும் தன் சகோதரியின் கைகளில் இருந்த வளையல்களையும் கண்டபோது, “அந்த மனிதர் என்னிடம் இப்படித்தான் பேசினார்” என்று தன் சகோதரி ரெபெக்காள் சொன்ன வார்த்தைகளைக் கேட்டபோது, அந்த மனிதரிடம் சென்றான். இதோ, அவர் நீரூற்றருகே ஒட்டகங்களின் அருகில் நின்றுகொண்டிருந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: தனி வார்த்தையாக மொழிபெயர்க்காமல், காலநிலைத் தொடர்களோடு இயல்பாக இணைத்தல்
  rationale: இங்கு וַיְהִי எபிரெயக் கதைத் தொடரை முன்னெடுக்கும் வடிவம்; தமிழில் ‘அப்போது நிகழ்ந்ததாவது’ எனச் சேர்ப்பது கனமாகவும் தேவையற்றதாகவும் இருக்கும்.
- source_word: הַנֶּזֶם
  choice: மூக்குத்தி
  rationale: נֶזֶם பொதுவாக வளைய ஆபரணத்தைக் குறிக்கலாம்; ஆனால் ஆதியாகமம் 24:47 அது ரெபெக்காளின் மூக்கில் இடப்பட்டதாகத் தெளிவுபடுத்துகிறது.
- source_word: הַצְּמִדִים עַל יְדֵי אֲחֹתוֹ
  choice: தன் சகோதரியின் கைகளில் இருந்த ... வளையல்கள்
  rationale: יָד என்பதன் நேரடிப் பொருள் ‘கை’; ஆபரணத்தின் இயல்பைத் தமிழில் ‘வளையல்கள்’ தெளிவாகத் தருகிறது.
- source_word: כֹּה דִבֶּר אֵלַי הָאִישׁ
  choice: அந்த மனிதர் என்னிடம் இப்படித்தான் பேசினார்
  rationale: כֹּה என்பதன் ‘இவ்வாறு/இப்படியே’ என்ற காட்டுச் சுட்டுப் பொருளைப் பாதுகாக்கிறது.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: அந்த மனிதரிடம் சென்றான்
  rationale: லாபானின் நகர்வைத் தமிழில் இயல்பாகக் கூறுகிறது; בוא + אֶל இங்கு இலக்கை நோக்கிச் செல்வதைக் குறிக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: காட்சியை உயிரோட்டமாக முன்வைக்கும் எபிரெயச் சுட்டிடைச்சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: עֹמֵד עַל הַגְּמַלִּים עַל הָעָיִן
  choice: ஒட்டகங்களின் அருகே நீரூற்றண்டையில் நின்றுகொண்டிருந்தார்
  rationale: עֹמֵד தொடர்நிலையைச் சுட்டுகிறது; עַל இங்கு மேலிருப்பதை அல்ல, அருகாமையைச் சுட்டுகிறது; עַיִן நீரூற்று அல்லது இயற்கை நீராதாரம்.
