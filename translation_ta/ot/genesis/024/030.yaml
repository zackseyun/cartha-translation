translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையான, கண்ணியமான நடை. நீண்ட எபிரெய வாக்கியத்தின் இரு காலநிலைத் தொடர்களும் பாதுகாக்கப்பட்டுள்ளன. லாபானின் சகோதரிக்கான ‘தன்’ தெளிவாக வைக்கப்பட்டுள்ளது; ஆபிரகாமின் ஊழியரைக் குறிக்கும் இடங்களில் இயல்பான மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
