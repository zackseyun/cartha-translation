  yaml_path: translation/ot/genesis/024/052.yaml
  text: And when Abraham’s servant heard their words[c][b][a], he bowed down to the ground before Yahweh.
translation:
  language: ta
  text: ஆபிரகாமின் பணியாளன் அவர்கள் சொன்னதைக் கேட்டபோது, யாவேவின் முன்பாகத் தரைவரைத் தாழ்ந்து பணிந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தரையில் விழுந்து வணங்கினான்.’ எபிரெய வினைச்சொல் உடலைத் தாழ்த்திப் பணிவதையும், சூழலைப் பொறுத்து வழிபாட்டு வணக்கத்தையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: கேட்டபோது
  rationale: எபிரெயக் கதைத் தொடரின் நிகழ்வுமாற்றத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது; ‘அப்போது நிகழ்ந்ததாவது’ என்று சொற்சொல்லாக மொழிபெயர்க்காமல் காலத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: עֶבֶד אַבְרָהָם
  choice: ஆபிரகாமின் பணியாள்
  rationale: இங்கு ஆபிரகாமின் வீட்டுப் பிரதிநிதியாகச் செயல்படுபவரை அடையாளப்படுத்துகிறது. ‘அடிமை’ என்பது சாத்தியமான பொருளாயினும், இவ்விடத்தில் அவரது சமூக நிலையை வலியுறுத்துவது நோக்கமல்ல.
- source_word: דִּבְרֵיהֶם
  choice: அவர்கள் சொன்னதை
  rationale: ‘அவர்களுடைய வார்த்தைகள்’ என்பதன் பொருளை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיִּשְׁתַּחוּ אַרְצָה
  choice: தரைமட்டும் பணிந்தான்
  rationale: வினைச்சொல் தாழக் குனிதல் அல்லது சாஷ்டாங்கமாகப் பணிதல் ஆகிய உடல் நிலையையும், சூழலில் உள்ள பயபக்தியையும் குறிக்கலாம். אַרְצָה குறிப்பிடும் கீழ்நோக்கிய இயக்கத்தையும் இச்சொற்றொடர் காக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לְ என்பதன் அடிப்படைத் திசை/பெறுநர் உணர்வை, பயபக்தியுடன் பணியும் செயலில் இயல்பான தமிழாக வெளிப்படுத்துகிறது; தேவனுடைய தனிப்பட்ட பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: וַיִּשְׁתַּחוּ என்பதை வெளிப்படையாக ‘வணங்கினான்’ என்று மொழிபெயர்ப்பதா
  choice: தரைமட்டும் பணிந்தான்
  alternative: யாவேவை வணங்கினான் / யாவேக்கு முன்பாகச் சாஷ்டாங்கமாக விழுந்தான்
  rationale: இச்சொல் வழிபாட்டுக்குரிய வணக்கத்தைக் குறிக்கக்கூடும்; ஆனால் வசனம் உடல் செயலை אַרְצָה மூலம் வெளிப்படையாக முன்னிறுத்துகிறது. ஆகவே வழிபாட்டு உணர்வை மறுக்காமலும் அதையே மட்டும் பொருளாக நிர்ணயிக்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் வரும் நான்கு எழுத்து இறைப்பெயரை பொதுப்பட்டமாக மாற்றாமல் தனிப்பட்ட பெயராக ஒலிபெயர்க்கிறது.
translation_notes:
  register: நவீன, மரியாதையான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பணியாள்’ என்பது சூழலுக்கேற்ற இயல்பான சொல்லாகவும், ‘தரைமட்டும் பணிந்தான்’ என்பது உடல் செயலும் பயபக்தியும் இடையிலுள்ள மூலமொழியின் அர்த்தத் திறப்பைப் பாதுகாக்கும் சொல்லாக்கமாகவும் தேர்ந்தெடுக்கப்பட்டுள்ளது.
