base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/048.yaml
  text: Then I bowed down and worshiped Yahweh[a], and I blessed Yahweh, the God of my master Abraham, who led me on the true way to take the daughter of my master's brother for his son.
translation:
  language: ta
  text: அப்போது நான் குனிந்து யாவேவை வணங்கினேன்; என் எஜமானான ஆபிரகாமின் கடவுளாகிய யாவேவைப் போற்றினேன். என் எஜமானின் சகோதரரின் மகளை, என் எஜமானின் மகனுக்காக அழைத்துவரும் பொருட்டு, யாவே என்னை உண்மையின் வழியில் நடத்தினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “உண்மையின் வழியில்.” இச்சொற்றொடர் “நம்பகமான வழியில்” அல்லது “நம்பிக்கைக்குரிய பாதையில்” என்றும் பொருள்படலாம்; யாவேவின் நம்பகமான வழிநடத்துதலை இது வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקֹּד
  choice: நான் தலைகுனிந்து
  rationale: உடலைத் தாழ்த்தி வணங்கும் செயலைக் குறிக்கிறது; மண்டியிட்டதாக அளவுக்கு மீறிக் குறிப்பாக்காமல் உடல்சார் சைகையைப் பாதுகாக்கிறது.
- source_word: וָאֶשְׁתַּחֲוֶה לַיהוָה
  choice: யாவேவை வழிபட்டேன்
  rationale: இறைவனை நோக்கிய மரியாதையான பணிவையும் வழிபாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; முந்தைய ‘தலைகுனிந்து’ என்பதுடன் சேர்ந்து உடல்சார் பணிவும் தெளிவாகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்தான இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பரவலான ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: וָאֲבָרֵךְ אֶת יְהוָה
  choice: யாவேவை வாழ்த்தினேன்
  rationale: בּרך என்பதன் அடிப்படைச் சொல் தொடர்பைப் பாதுகாக்கிறது; இங்கு கடவுளை வாழ்த்துதல் என்பது அவரைப் போற்றிப் புகழ்வதைக் குறிக்கிறது.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: என் எஜமானாகிய ஆபிரகாமின் கடவுள்
  rationale: אֲדֹנִי என்பது இங்கு தெய்வீகப் பட்டம் அல்ல, பணியாளரின் மனித எஜமானான ஆபிரகாமைக் குறிக்கிறது.
- source_word: הִנְחַנִי
  choice: என்னை நடத்தினார்
  rationale: נחה என்பதன் ஹிஃபீல் வடிவம் வழிகாட்டி நடத்துதலைக் குறிக்கிறது; தமிழில் இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: בְּדֶרֶךְ אֱמֶת
  choice: உண்மையான வழியில்
  rationale: ‘உண்மை/நம்பகத்தன்மையின் வழியில்’ என்ற எபிரெயச் சொற்றொடரின் உண்மை மற்றும் விசுவாசத்தன்மை சார்ந்த நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: לָקַחַת
  choice: அழைத்துச் செல்லும்படி
  rationale: திருமண ஏற்பாட்டின் சூழலில் பெண்ணை மகனுக்காகத் தன்னுடன் கொண்டுசெல்லும் நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது; ‘திருமணம் செய்துவைக்க’ என்று வெளிப்படையாகச் சேர்த்து மூலத்தை விரிவாக்கவில்லை.
- source_word: בַּת אֲחִי אֲדֹנִי
  choice: என் எஜமானின் சகோதரருடைய மகளை
  rationale: மூலத்தின் உறவுமுறைச் சொற்றொடரை அப்படியே பாதுகாக்கிறது; வம்சப்பட்டியல் அடிப்படையில் உறவைச் சீர்செய்து மறுவிளக்கம் செய்யவில்லை.
- source_word: לִבְנוֹ
  choice: அவருடைய மகனுக்காக
  rationale: பின்னொட்டு ஆபிரகாமைக் குறிக்கிறது; தமிழ்ச் சூழலில் அதன் தொடர்பு தெளிவாக உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல், ‘Yahweh’ என்பதற்குரிய தமிழ் ஒலிபெயர்ப்பாக வழங்கப்பட்டுள்ளது.
- issue: בְּדֶרֶךְ אֱמֶת என்பதிலுள்ள אֱמֶת-இன் நுட்பம்
  choice: உண்மையான வழியில்
  alternative: சரியான வழியில் / நம்பகமான பாதையில்
  rationale: வெறும் திசைசார் சரித்தன்மை என்று சுருக்காமல், ‘உண்மை’ மற்றும் ‘நம்பகத்தன்மை’ ஆகிய இரு சாத்தியங்களையும் உரையும் அடிக்குறிப்பும் சேர்ந்து பாதுகாக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் மரியாதைமிக்கதாயும் வடிவமைக்கப்பட்டது. ‘எஜமான்’ மனித அதிகார உறவைத் தெளிவாக்குகிறது. மூலத்தின் மீளுரைத்தலைப் பாதுகாக்க ‘யாவே’ இருமுறையும் வைக்கப்பட்டுள்ளது; நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
