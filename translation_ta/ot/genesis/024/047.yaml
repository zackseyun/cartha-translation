base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/047.yaml
  text: Then I asked her[a], saying, ‘Whose daughter are you?’ And she said, ‘The daughter of Bethuel son of Nahor[c][b], whom Milcah bore to him.’ Then I put the ring on her nose and the bracelets on her hands.
translation:
  language: ta
  text: பின்பு நான் அவளிடம், “நீ யாருடைய மகள்?” என்று கேட்டேன். அதற்கு அவள், “நாகோருக்கு மில்காள் பெற்ற பெத்துவேலின் மகள் நான்” என்றாள். அப்போது நான் அந்த வளையத்தை அவளுடைய மூக்கிலும், வளையல்களை அவளுடைய கைகளிலும்[a] அணிவித்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கைகளிலும்” என்பது சூழலில் இன்னும் குறிப்பாக “மணிக்கட்டுகளிலும்” எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁאַל אֹתָהּ וָאֹמַר
  choice: பின்பு நான் அவளிடம் ... என்று கேட்டேன்
  rationale: எபிரெய மொழியில் ‘கேட்டேன்; சொன்னேன்’ என இரு வினைகள் இருந்தாலும், கேள்வியின் சொற்களே அடுத்ததாக வருவதால் நவீனத் தமிழில் இயல்பாக ஒரே கேள்வி வினையாக வழங்கப்பட்டுள்ளது; தொடர் நிகழ்வை ‘பின்பு’ காட்டுகிறது.
- source_word: בַּת מִי אַתְּ
  choice: நீ யாருடைய மகள்?
  rationale: உறவுமுறையை நேரடியாகக் கேட்கும் எபிரெய வாக்கியத்தின் இயல்பான தமிழ் இணை.
- source_word: בַּת בְּתוּאֵל בֶּן נָחוֹר אֲשֶׁר יָלְדָה לּוֹ מִלְכָּה
  choice: நாகோருக்கு மில்காள் பெற்ற பெத்துவேலின் மகள் நான்
  rationale: பெத்துவேல் நாகோரின் மகன் என்பதையும், அவரை மில்காள் நாகோருக்குப் பெற்றாள் என்பதையும் தெளிவாகப் பாதுகாக்கிறது; தமிழில் உறவுத் தொடரை இயல்பான வரிசையில் அமைக்கிறது.
- source_word: הַנֶּזֶם עַל אַפָּהּ
  choice: அந்த வளையத்தை அவளுடைய மூக்கிலும்
  rationale: נֶזֶם என்பது பொதுவாக வளையத்தைக் குறிக்கலாம்; அதன் இடத்தைத் தொடர்ந்து வரும் ‘மூக்கில்’ என்ற சொல் தெளிவுபடுத்துவதால் ‘மூக்குத்தி’ என முன்கூட்டியே குறுக்காமல் ‘வளையம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְהַצְּמִידִים עַל יָדֶיהָ
  choice: வளையல்களை அவளுடைய கைகளிலும் அணிவித்தேன்
  rationale: צְמִידִים அணிகலன் வளையல்களைக் குறிக்கிறது. יָדֶיהָ என்பதற்கு முறையாக ‘கைகள்’ என்று வழங்கப்பட்டு, சூழலில் மணிக்கட்டுகளைக் குறிக்கக்கூடிய நுட்பம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
