  terminology: பெத்துவேல், நாகோர், மில்காள் ஆகிய பெயரெழுத்தாக்கம் சீராக உள்ளது. “வளையம்” என்பது நெசெம் என்பதன் பொதுப் பொருளைத் தக்கவைத்து, “மூக்கில்” அதன் பயன்பாட்டைத் தெளிவாக்குகிறது. “வளையல்கள்” மற்றும் கைகள்/மணிக்கட்டுகள் குறித்த அடிக்குறிப்பு பொருத்தமானது.
