  source_fidelity: எபிரெய மூலத்தின் நிகழ்வுத் தொடரும் கேள்வி-பதில் அமைப்பும் சரியாகப் பாதுகாக்கப்பட்டுள்ளன. பெத்துவேல் நாகோரின் மகன்; மில்காள் அவரை நாகோருக்குப் பெற்றாள் என்ற வம்சத் தொடர்பு தமிழில் தெளிவாக உள்ளது. நெசெம் மூக்கில் வைக்கப்பட்ட வளையமாகவும், צמידים கைகளில் வைக்கப்பட்ட வளையல்களாகவும் துல்லியமாக வழங்கப்பட்டுள்ளன.
