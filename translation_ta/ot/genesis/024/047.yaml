translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. உரையாடல் இயல்பாக அமைக்கப்பட்டாலும், வம்சத் தொடர்பும் அணிகலன்கள் வைக்கப்பட்ட உடற்பகுதிகளும் மூலத்துக்கு நெருக்கமாகப் பாதுகாக்கப்பட்டுள்ளன.
