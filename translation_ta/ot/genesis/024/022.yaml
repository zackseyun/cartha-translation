translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மனிதன்’ என்ற மூலச்சொல்லும், வளையம் அணியும் இடத்தைப் பற்றிய எபிரெயச் சொல்லின் உண்மையான தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு [a] தொடர்புடைய ‘பொன் வளையம்’ என்பதற்குப் பின்னும், [b] ‘பேக்கா’ என்பதற்குப் பின்னும் வைக்கப்பட்டுள்ளன.
