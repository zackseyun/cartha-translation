base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/022.yaml
  text: And when the camels had finished drinking[a], the man took a gold ring weighing a beka[b], and two bracelets for her hands weighing ten shekels of gold.
translation:
  language: ta
  text: ஒட்டகங்கள் குடித்து முடித்தபோது, அந்த மனிதன் ஒரு பெக்கா[b] எடையுள்ள பொன் வளையம் ஒன்றையும்[a], அவளுடைய கைகளுக்காக மொத்தம் பத்துச் சேக்கல் பொன் எடையுள்ள இரண்டு காப்புகளையும் எடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பொன் மூக்குவளையம்’; எபிரெயச் சொல் மூக்கிலோ காதிலோ அணியும் வளையத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ஒரு பெக்கா என்பது அரைச் சேக்கலுக்குச் சமமான எடை அலகு.
    reason: cultural_note
lexical_decisions:
- source_word: כַּאֲשֶׁר כִּלּוּ הַגְּמַלִּים לִשְׁתּוֹת
  choice: ஒட்டகங்கள் குடித்து முடித்தபோது
  rationale: இந்த எபிரெயக் கட்டமைப்பு ஒட்டகங்கள் குடித்து முடிந்த நேரத்தில் அடுத்த செயல் நிகழ்ந்ததைக் குறிக்கிறது; உடனடித்தன்மையை அளவுக்கு மீறி வலியுறுத்தாமல் இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: சூழலில் இவர் ஆபிரகாமின் பணியாளர் என்றாலும், இவ்வசனத்தின் எபிரெய உரை ‘மனிதன்’ என்றே கூறுவதால் அதையே காக்கிறது.
- source_word: נֶזֶם זָהָב
  choice: பொன் வளையம்
  rationale: נֶזֶם என்பது மூக்கிலோ காதிலோ அணியும் வளையத்தைக் குறிக்கக்கூடும். எந்த இடத்தில் அணிவது என்பதை மூலச்சொல் இங்கு தெளிவுபடுத்தாததால் பொதுவான ‘வளையம்’ முதன்மை உரையில் வைக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בֶּקַע מִשְׁקָלוֹ
  choice: ஒரு பேக்கா எடையுள்ள
  rationale: பண்டைய எடை அலகான ‘பேக்கா’வை நேரடியாகத் தக்கவைத்து, அதன் மதிப்பை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: וּשְׁנֵי צְמִידִים
  choice: இரண்டு காப்புகள்
  rationale: மூலத்தில் எண்ணிக்கை வெளிப்படையாக ‘இரண்டு’ என்று உள்ளது. அணிகலனைக் குறிக்கும் இயல்பான, கண்ணியமான தமிழ்ச் சொல்லாக ‘காப்புகள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַל יָדֶיהָ
  choice: அவளுடைய கைகளுக்காக
  rationale: சொல்லளவில் ‘அவளுடைய கைகளின்மேல்’ என இருந்தாலும், וַיִּקַּח என்பதோடு இணையும் சூழலில் அவளுக்காக எடுத்த அணிகலன்கள் என்ற பொருளை இயல்பாகத் தெரிவிக்கிறது; ‘மணிக்கட்டுகள்’ அல்லது ‘கைகள்’ என்று அணியும் துல்லிய இடத்தை உரை தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: עֲשָׂרָה זָהָב מִשְׁקָלָם
  choice: பத்துச் சேக்கல் பொன் எடையுள்ள
  rationale: இரண்டு காப்புகளின் மொத்த எடை கூறப்படுகிறது. எபிரெய அளவீட்டு வழக்கில் உள்ளடங்கிய எடை அலகான ‘சேக்கல்’ தமிழில் தெளிவுக்காக வெளிப்படுத்தப்பட்டுள்ளது.
