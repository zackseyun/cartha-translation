revisions:
- from: ஒட்டகங்கள் குடித்து முடித்தபோது, அந்த மனிதன் ஒரு பேக்கா[b] எடையுள்ள பொன் வளையம் ஒன்றையும்[a], அவளுடைய கைகளுக்காகப் பத்துச் சேக்கல் பொன் எடையுள்ள இரண்டு காப்புகளையும் எடுத்தான்.
  to: ஒட்டகங்கள் குடித்து முடித்தபோது, அந்த மனிதன் ஒரு பெக்கா[b] எடையுள்ள பொன் வளையம் ஒன்றையும்[a], அவளுடைய கைகளுக்காக மொத்தம் பத்துச் சேக்கல் பொன் எடையுள்ள இரண்டு காப்புகளையும் எடுத்தான்.
