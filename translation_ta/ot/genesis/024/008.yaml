translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் ஆபிரகாமின் கட்டளைக்குரிய கண்ணியமும் உறுதியும் நிலைக்குமாறு மொழிநடை அமைக்கப்பட்டுள்ளது. பயணச் சூழலில் ‘உன்னுடன் வர’ இயல்பான முதன்மை வாசகமாகத் தேர்ந்தெடுக்கப்பட்டு, எபிரெய மொழியின் நேரடி உருவகம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
