source:
  edition: WLC
  text: וְ/אִם לֹ֨א תֹאבֶ֤ה הָֽ/אִשָּׁה֙ לָ/לֶ֣כֶת אַחֲרֶ֔י/ךָ וְ/נִקִּ֕יתָ מִ/שְּׁבֻעָתִ֖/י זֹ֑את רַ֣ק אֶת בְּנִ֔/י לֹ֥א תָשֵׁ֖ב שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/008.yaml
  text: But if the woman is not willing to go after you[a], then you will be free from this oath of mine[b]; only you must not take my son back there.
translation:
  language: ta
  text: ஆனால் அந்தப் பெண் உன்னுடன் வர விரும்பாவிட்டால்[a], என்னுடைய இந்தச் சத்தியத்திலிருந்து நீ விடுபடுவாய்[b]. ஆனால் என் மகனை மட்டும் அங்கே திரும்பக் கொண்டுபோகாதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னைப் பின்தொடர்ந்து வர”; சொல்லுக்குச் சொல், “உனக்குப் பின்னால் செல்ல.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்னுடைய இந்தச் சத்தியத்திலிருந்து நீ விலக்கப்படுவாய்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם לֹא תֹאבֶה
  choice: ஆனால் ... வர விரும்பாவிட்டால்
  rationale: וְאִם முந்தைய கட்டளைக்கு மாறான ஒரு நிபந்தனையை அறிமுகப்படுத்துகிறது; לֹא תֹאבֶה என்பது வெறும் மறுப்பை விட மனவிருப்பமின்மையைச் சுட்டுகிறது.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: இந்நிலையில் அவள் இன்னும் அடையாளம் காணப்படாத வருங்கால மணப்பெண்; ஆகவே ‘மனைவி’ என்று முன்கூட்டியே கூறாமல் எபிரெயச் சொல்லின் இயல்பான பொருள் தரப்பட்டுள்ளது.
- source_word: לָלֶכֶת אַחֲרֶיךָ
  choice: உன்னுடன் வர
  rationale: சொல்லுக்குச் சொல் ‘உனக்குப் பின்னால் செல்ல’ என்றாலும், இங்கு பயணச் சூழலில் இயல்பான தமிழாக ‘உன்னுடன் வர’ அமைந்துள்ளது; நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְנִקִּיתָ
  choice: நீ விடுபடுவாய்
  rationale: נקה என்பதன் நிபால் வடிவம் இங்கு சத்தியத்தால் ஏற்பட்ட கடமையிலிருந்து விலக்கப்படுவதைக் குறிக்கிறது.
- source_word: מִשְּׁבֻעָתִי זֹאת
  choice: என்னுடைய இந்தச் சத்தியத்திலிருந்து
  rationale: שְׁבֻעָה என்பதன் உறுதிமொழி சார்ந்த பொருளையும், முதலாம் நபர் உரிமை விகுதியையும், זֹאת என்ற சுட்டையும் தக்கவைக்கிறது.
- source_word: רַק אֶת־בְּנִי לֹא תָשֵׁב שָׁמָּה
  choice: ஆனால் என் மகனை மட்டும் அங்கே திரும்பக் கொண்டுபோகாதே
  rationale: רַק விதிக்கப்படும் வரம்பை வலியுறுத்துகிறது; שוב என்பதன் ஹிஃபில் வடிவத்திலுள்ள காரணவினைப் பொருள் ‘திரும்பக் கொண்டுபோ’ என்பதால் வெளிப்படுகிறது; שָׁמָּה என்பதற்கு ‘அங்கே’ வழங்கப்பட்டுள்ளது.
