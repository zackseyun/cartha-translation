  source_fidelity: எபிரெய மூலத்தின் நிபந்தனை, பெண்ணின் விருப்பம் சார்ந்த மறுப்பு, சத்தியத்திலிருந்து பணியாளன் விடுவிக்கப்படுதல், மற்றும் மகனை அங்கே மீண்டும் கொண்டுபோகக்கூடாது என்ற கடுமையான வரம்பு ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. ‘உன்னுடன் வர’ என்பது לָלֶכֶת אַחֲרֶיךָ என்பதற்கான சூழலுக்கேற்ற இயல்பான மொழிபெயர்ப்பு; நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
