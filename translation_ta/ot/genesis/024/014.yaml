  source_fidelity: லְעַבְדְּךָ לְיִצְחָק என்பதற்கு உடனடியான ஜெபச் சூழலும் இரு லamed வடிவங்களும், ‘உமது அடியான எனக்காக, ஈசாக்குக்காக’ என்ற இரட்டை நோக்குப் பொருளையே முதன்மையாக ஆதரிக்கின்றன. தற்போதைய முதன்மை உரையின் ‘உமது அடியான் ஈசாக்குக்காக’ என்பது சாத்தியமான appositional வாசிப்பு என்றாலும், அதை முதன்மையாக்குவது மூலத்தின் சிறந்த பொருளை மாற்றுகிறது. וּבָהּ-ஐ ‘அவள் மூலமாக’ என்றும் חֶסֶד-ஐ ‘மாறாத அன்பு’ என்றும் தருவது பொருத்தமானது.
  naturalness: ‘உங்கள் ஒட்டகங்களுக்கும் தண்ணீர் காட்டுவேன்’ என்பதற்குப் பதிலாக ‘உங்கள் ஒட்டகங்களுக்கும் தண்ணீர் கொடுப்பேன்’ என்பது நவீன நிலையான தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. மற்ற வாக்கிய அமைப்பு ஜெபத்தின் விருப்பப் பொருளைத் தக்கவைத்துள்ளது.
  terminology: ‘இளம்பெண்,’ ‘குடம்,’ ‘ஒட்டகங்கள்,’ ‘நியமித்தவள்,’ ‘எஜமான்,’ மற்றும் ‘மாறாத அன்பு’ ஆகியவை வரலாற்று மற்றும் இறையியல் சூழலுக்கு ஏற்றவை. தேவனை நோக்கிய மரியாதைப் பன்மையும் காக்கப்பட்டுள்ளது.
