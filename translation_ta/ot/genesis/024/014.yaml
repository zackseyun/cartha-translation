  text: וְ/הָיָ֣ה הַֽ/נַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֨י/הָ֙ הַטִּי נָ֤א כַדֵּ/ךְ֙ וְ/אֶשְׁתֶּ֔ה וְ/אָמְרָ֣ה שְׁתֵ֔ה וְ/גַם גְּמַלֶּ֖י/ךָ אַשְׁקֶ֑ה אֹתָ֤/הּ הֹכַ֨חְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יִצְחָ֔ק וּ/בָ֣/הּ אֵדַ֔ע כִּי עָשִׂ֥יתָ חֶ֖סֶד עִם אֲדֹנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/014.yaml
  text: And let it be that the young woman to whom I say[a], ‘Please lower your jar so that I may drink,’ and who says, ‘Drink, and I will also water your camels’—let her be the one you have appointed for your servant, for Isaac[c][b]. By her I will know that you have shown steadfast love to my master.
translation:
  language: ta
  text: நான் எந்த இளம்பெண்ணிடம், ‘தயவுசெய்து உன் குடத்தைச் சாய்த்து, நான் குடிக்கத் தா’ என்று சொல்கிறேனோ, அவள், ‘குடியுங்கள்; உங்கள் ஒட்டகங்களுக்கும் தண்ணீர் கொடுப்பேன்’ என்று சொன்னால், அவளே உமது அடியான எனக்காகவும் ஈசாக்குக்காகவும் நீர் நியமித்தவளாக இருக்கட்டும்.[a] அவள் மூலமாக, நீர் என் எஜமானுக்கு மாறாத அன்பு காட்டியிருக்கிறீர் என்பதை நான் அறிந்துகொள்வேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வாசிப்பு: “உமது அடியான் ஈசாக்குக்காக நீர் நியமித்தவளாக இருக்கட்டும்.” எபிரெயச் சொற்றொடரை ‘உமது அடியான்’ என்பதற்கு ஈசாக்கை விளக்கும் இணைப்பாகவும் வாசிக்கலாம். முதன்மை உரை, ஜெபிப்பவன் தன்னை தேவனுடைய அடியான் என்று குறிப்பிடுவதாகவும், ‘ஈசாக்குக்காக’ என்பது தனி நோக்குச் சொற்றொடராகவும் எடுத்துக்கொள்கிறது.'
    reason: alternative_reading
  - marker: b
    text: அல்லது, “இதன் மூலமாக.” எபிரெயில் சொற்படியாக “அவள் மூலமாக” என்று உள்ளது; இது இளம்பெண்ணை அறிகுறியாகச் சுட்டலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: அவளே ... இருக்கட்டும்
  rationale: எபிரெய வேண்டுதல்/விருப்பப் பொருளை நீண்ட தமிழ்ச் சொற்றொடரின் முடிவில் இயல்பாக வெளிப்படுத்துகிறது; தொடக்கத்தில் தேவையற்ற இரட்டிப்பு தவிர்க்கப்படுகிறது.
- source_word: הַנַּעֲרָ
  choice: இளம்பெண்
  rationale: திருமண வயதிலுள்ள இளம் பெண்ணைக் குறிக்கும்; நவீனத் தமிழில் இயல்பானதும் மரியாதையானதும்.
- source_word: הַטִּי נָא כַדֵּךְ
  choice: தயவுசெய்து உன் குடத்தைச் சாய்த்து
  rationale: הטה என்பதன் சாய்த்தல்/தாழ்த்துதல் பொருளையும் נָא என்பதன் பணிவான வேண்டுகோளையும் நேரடியாகக் காக்கிறது.
- source_word: וְאֶשְׁתֶּה
  choice: நான் குடிக்கத் தா
  rationale: குடத்தைச் சாய்ப்பதன் நோக்கத்தையும் பேசுபவரின் வேண்டுகோளையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: உங்கள் ஒட்டகங்களுக்கும் தண்ணீர் காட்டுவேன்
  rationale: שׁקה என்பதன் ‘குடிக்கக் கொடுத்தல்’ பொருளை கால்நடைகளுக்குத் தண்ணீர் கொடுப்பதற்கான இயல்பான தமிழ்ச் சொல்லாட்சியில் தருகிறது.
- source_word: אֹתָהּ הֹכַחְתָּ
  choice: அவளே ... நீர் நியமித்தவளாக
  rationale: இச்சூழலில் ஹிஃபில் வடிவம் தேர்ந்தெடுத்து நிர்ணயித்தல்/நியமித்தல் என்னும் பொருளைக் கொண்டுள்ளது.
- source_word: לְעַבְדְּךָ לְיִצְחָק
  choice: உமது அடியான் ஈசாக்குக்காக
  rationale: இரண்டாவது לְ apposition ஆக ஈசாக்கை ‘உமது அடியான்’ என அடையாளப்படுத்துவது சூழலுக்கும் இயல்பான எபிரெய தொடரமைப்புக்கும் ஏற்றது; மற்றொரு இலக்கண வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּבָהּ אֵדַע
  choice: அவள் மூலமாக ... அறிந்துகொள்வேன்
  rationale: பெண்பால் ஒருமை பின்னொட்டு நேரடியாக இளம்பெண்ணைக் குறிக்கிறது; அவளே அறிகுறியாக இருப்பதைத் தெளிவாகக் காக்கிறது.
- source_word: חֶסֶד
  choice: மாறாத அன்பு
  rationale: வெறும் தயவைவிட ஆழமான, உறுதியான உறவுப்பற்று மற்றும் நன்மையை வெளிப்படுத்துகிறது; இங்கு உடன்படிக்கை என்ற தொழில்நுட்பப் பொருளை தேவையின்றி திணிக்கவில்லை.
- source_word: עִם אֲדֹנִי
  choice: என் எஜமானுக்கு
  rationale: எபிரெயில் சொற்படியாக ‘என் எஜமானோடு’ என்றாலும், அன்பு காட்டுதல் என்பதோடு தமிழில் இலக்கு வேற்றுமை இயல்பானது.
theological_decisions:
- issue: לְעַבְדְּךָ לְיִצְחָק என்பதிலுள்ள ‘உமது அடியான்’ யாரைக் குறிக்கிறது?
  choice: 'ஈசாக்கை விளக்கும் apposition: ‘உமது அடியான் ஈசாக்குக்காக’'
  alternative: முதல் சொற்றொடர் ஜெபிக்கும் ஊழியனைச் சுட்டி, பின்னர் தனியாக ‘ஈசாக்குக்காக’ என வாசித்தல்
  rationale: மணமகள் ஈசாக்குக்காகத் தேர்ந்தெடுக்கப்படுவது உடனடிச் சூழலுடன் தெளிவாகப் பொருந்துகிறது; இரண்டாவது לְ பெயரை apposition ஆக அறிமுகப்படுத்துவது எபிரெயில் இயல்பானது. இருப்பினும் வடிவியல் சாத்தியமான மாற்று வாசிப்பு மறைக்கப்படவில்லை.
- issue: חֶסֶד என்பதன் இறையியல் நிறை
  choice: மாறாத அன்பு
  alternative: தயவு; உண்மையுள்ள அன்பு; உடன்படிக்கைப் பற்றுறுதி
  rationale: தேவனின் உறுதியான, அருளுள்ள உறவுப்பற்றைத் தக்கவைத்தாலும், இவ்விடத்தில் ‘உடன்படிக்கை’ என்னும் குறிப்பிட்ட இறையியல் கருத்தை உரைக்குள் சேர்ப்பதில்லை.
- issue: וּבָהּ என்பதன் சுட்டுப்பொருள்
  choice: 'அந்த இளம்பெண்: ‘அவள் மூலமாக’'
  alternative: 'நிகழ்வு அல்லது அறிகுறி: ‘இதன் மூலமாக’'
  rationale: பெண்பால் ஒருமைப் பின்னொட்டு மிக இயல்பாக הַנַּעֲרָ என்னும் இளம்பெண்ணையே மீண்டும் சுட்டுகிறது; நிகழ்வை விரிவாகச் சுட்டும் வாசிப்பும் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்திற்கேற்ற கண்ணியமான நடையும் சாதாரண வாசகருக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. தேவனை நோக்கும் இடங்களில் மரியாதைப் பன்மை (‘நீர்’, ‘உமது’) பயன்படுத்தப்படுகிறது; இளம்பெண்ணிடம் மேற்கோளாகச் சொல்லப்படும் வார்த்தைகளில் இயல்பான ஒருமை (‘உன்’) காக்கப்படுகிறது. ‘எஜமான்’ என்பது பணியாளன்–தலைவன் உறவை வரலாற்றுச் சூழலுக்கேற்றவாறு தெரிவிக்கிறது.
