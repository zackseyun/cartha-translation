  register: நவீனத் தரத் தமிழில் dignified ஆனால் எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் காரணவினையின் ‘கொண்டுபோ/கொண்டுவா’ என்ற சூழல்சார் இரு வாய்ப்புகளும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
