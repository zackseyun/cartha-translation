  text: וַ/יֹּ֥אמֶר אֵלָ֖י/ו אַבְרָהָ֑ם הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תָּשִׁ֥יב אֶת בְּנִ֖/י שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/006.yaml
  text: Abraham said to him[a], “Be careful that you do not take my son back there.”
translation:
  language: ta
  text: ஆபிரகாம் அவனிடம், “கவனமாக இரு; என் மகனை மீண்டும் அங்கே அழைத்துச் செல்லாதே” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் மகனை மீண்டும் அங்கே திரும்பச் செல்ல வைக்காதே.” எபிரெய வினை காரணவினை வடிவில் உள்ளது; அதன் நேரடிப் பொருள் “திரும்பச் செய்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: எபிரெயக் கதைநடையில் வரும் வழக்கமான இறந்தகாலச் சொல்லாடலை இயல்பான தமிழ் நேர்கூற்றின் முடிவில் ‘என்றார்’ என வழங்குகிறது.
- source_word: אֵלָיו
  choice: அவனிடம்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை மறைமுகச் செயப்படுபொருளை நவீன தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: הִשָּׁמֶר לְךָ
  choice: எச்சரிக்கையாக இரு
  rationale: நிபால் கட்டளை வடிவமும் நெறிசார் தன்மைப் பொருளுடைய לְךָ என்பதும் சேர்ந்து தரும் வலியுறுத்தப்பட்ட எச்சரிக்கையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: פֶּן
  choice: …விடாதபடி
  rationale: எதிர்மறை எச்சரிக்கையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: תָּשִׁיב
  choice: மறுபடியும் … கொண்டுபோ
  rationale: שׁוב என்பதன் ஹிஃபில் வடிவம் ‘திரும்பச் செய்’ என்ற காரணவினைப் பொருள் தருகிறது; பயணச் சூழலில் ‘மறுபடியும் அங்கே கொண்டுபோ’ என்பது இயல்பான தமிழ்.
- source_word: אֶת־בְּנִי
  choice: என் மகனை
  rationale: நேரடிச் செயப்படுபொருள் குறியீட்டுடன் முதல் நபர் ஒருமை உடைமை விகுதி சேர்ந்த பெயரின் நேரான மொழிபெயர்ப்பு.
- source_word: שָׁמָּה
  choice: அங்கே
  rationale: ஒரு இடத்தை நோக்கிய திசைப் பொருளைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
