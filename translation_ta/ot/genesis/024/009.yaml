source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם הָ/עֶ֨בֶד֙ אֶת יָד֔/וֹ תַּ֛חַת יֶ֥רֶךְ אַבְרָהָ֖ם אֲדֹנָ֑י/ו וַ/יִּשָּׁ֣בַֽע ל֔/וֹ עַל הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/009.yaml
  text: So the servant put his hand under the thigh of Abraham his master and swore to him concerning this matter[a].
translation:
  language: ta
  text: அப்போது அந்தப் பணியாள் தன் எஜமானான ஆபிரகாமின் தொடைக்குக் கீழே தன் கையை வைத்தான்; இந்தக் காரியத்தைக் குறித்து அவருக்கு சத்தியம் செய்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தொடைக்குக் கீழே’ என்பது உறுதியான சத்தியத்துடன் தொடர்புடைய எபிரேய சொல்லாட்சியின் நேரடி மொழிபெயர்ப்பு. இது இடுப்புப் பகுதியுடனோ அல்லது உடன்படிக்கையோடு தொடர்புடைய சந்ததியுடனோ அடையாளரீதியாக இணைந்தது என்று சிலர் புரிந்துகொள்கிறார்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֶבֶד
  choice: பணியாள்
  rationale: עֶבֶד என்பது பணியாள் அல்லது அடிமை எனப் பொருள்படலாம். இங்கு ஆபிரகாமின் வீட்டில் அவன் ஆற்றும் பொறுப்பே முன்னிலைப்படுவதால், சமூக அதிகார உறவையும் இயல்பான தமிழையும் காக்கும் வகையில் ‘பணியாள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיָּשֶׂם ... אֶת יָדוֹ
  choice: தன் கையை வைத்து
  rationale: שׂוּם என்பதன் அடிப்படைப் பொருள் ‘வை, இடு’ என்பதாகும்; உடல் அசைவைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: תַּחַת יֶרֶךְ
  choice: தொடைக்குக் கீழே
  rationale: יָרֵךְ என்பதன் நேரடிப் பொருள் ‘தொடை’. சடங்கின் சாத்தியமான அடையாளப் பொருளை முதன்மை உரைக்குள் சேர்க்காமல் எபிரெயச் சொல்லாட்சியே காக்கப்படுகிறது.
- source_word: אַבְרָהָם אֲדֹנָיו
  choice: தன் எஜமானாகிய ஆபிரகாம்
  rationale: மனித சமூகச் சூழலில் אֲדוֹן என்பது அதிகாரமுள்ள வீட்டுத் தலைவரைக் குறிக்கிறது. ‘எஜமான்’ அந்த உறவைத் தெளிவாகக் காட்டுகிறது; தெய்வீகப் பட்டமாகத் தவறாகப் புரிந்துகொள்ளப்படுவதையும் தவிர்க்கிறது.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: அவருக்கு ஆணையிட்டுக் கொடுத்தான்
  rationale: நிபால் வடிவிலுள்ள שׁבע என்பது உறுதிமொழி அல்லது ஆணை செய்வதைக் குறிக்கிறது. ‘ஆணையிட்டுக் கொடுத்தான்’ என்பது לוֹ குறிக்கும் தனிப்பட்ட நோக்கையும் சடங்கான உறுதிப்பாட்டையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: இந்தக் காரியத்தைக் குறித்து
  rationale: דָּבָר இங்கு முந்தைய வசனங்களில் ஆபிரகாம் வழங்கிய குறிப்பிட்ட கட்டளையைக் குறிக்கிறது; ஆகவே ‘காரியம்’ சூழலுக்கு ஏற்ற தெளிவான மொழிபெயர்ப்பு.
theological_decisions:
- issue: ஆணைச் சைகையை நேரடியாக மொழிபெயர்ப்பதா அல்லது அதன் அடையாளப் பொருளை விளக்கி மொழிபெயர்ப்பதா
  choice: ‘தொடைக்குக் கீழே’ என்று நேரடியாக மொழிபெயர்த்து, சாத்தியமான அடையாள விளக்கத்தை அடிக்குறிப்பில் தருதல்
  alternative: பிறப்புறுப்பு, இடுப்பு அல்லது உடன்படிக்கைச் சந்ததி தொடர்பான சைகை என விளக்கவுரையாக மொழிபெயர்த்தல்
  rationale: எபிரெய உரை உடல் செயலை மட்டும் கூறுகிறது; அதன் பொருளை வெளிப்படையாக விளக்கவில்லை. நேரடி சொல்லாட்சியைக் காப்பது உண்மையான விளக்கத் தெளிவின்மையைப் பாதுகாத்து, ஒரு குறிப்பிட்ட கருத்தை முதன்மை உரையில் திணிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பணியாள்’ மற்றும் ‘எஜமான்’ ஆகியவை வீட்டுச் சமூகத்தின் அதிகார உறவை வெளிப்படுத்துகின்றன; சடங்கின் தெளிவற்ற அடையாளப் பொருள் முதன்மை உரையில் தீர்மானிக்கப்படவில்லை.
