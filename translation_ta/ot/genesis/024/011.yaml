source:
  edition: WLC
  text: וַ/יַּבְרֵ֧ךְ הַ/גְּמַלִּ֛ים מִ/ח֥וּץ לָ/עִ֖יר אֶל בְּאֵ֣ר הַ/מָּ֑יִם לְ/עֵ֣ת עֶ֔רֶב לְ/עֵ֖ת צֵ֥את הַ/שֹּׁאֲבֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/011.yaml
  text: And he made the camels kneel down outside the city by the well of water at evening time[b][a], at the time when the women go out to draw water.
translation:
  language: ta
  text: அவன் ஒட்டகங்களை நகரத்திற்கு வெளியே, தண்ணீர்க் கிணற்றருகே மாலை நேரத்தில்—தண்ணீர் எடுக்கும் பெண்கள் வெளியே வரும் நேரத்தில்—மண்டியிடச் செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּבְרֵךְ
  choice: மண்டியிடச் செய்தான்
  rationale: ברך என்பதன் ஹிஃபில் வடிவம் இங்கு ஒட்டகங்களை மண்டியிட வைக்கும் காரணவினைப் பொருளைக் கொண்டுள்ளது; இயல்பான தமிழில் அந்தச் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַגְּמַלִּים
  choice: ஒட்டகங்களை
  rationale: முன்னரே குறிப்பிடப்பட்ட பயணக் குழுவின் ஒட்டகங்களைக் குறிக்கும் உருபுடனான பன்மைப் பெயர்ச்சொல்.
- source_word: מִחוּץ לָעִיר
  choice: நகரத்திற்கு வெளியே
  rationale: מִחוּץ என்பது ‘வெளியே’; עִיר என்பது சூழலின்படி நகரம் அல்லது ஊர் என அமையலாம். பொதுவான நிலையான சொல்லாக ‘நகரம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶל בְּאֵר הַמָּיִם
  choice: தண்ணீர்க் கிணற்றருகே
  rationale: אֶל இயக்கத்தை நோக்கிக் காட்டினாலும், ஒட்டகங்கள் மண்டியிட்ட பின் இருந்த இடத்தை இயல்பான தமிழில் ‘கிணற்றருகே’ எனச் சொல்வது பொருத்தமானது; ‘தண்ணீர்’ என்ற எபிரெயச் சொல்லும் தக்கவைக்கப்படுகிறது.
- source_word: לְעֵת עֶרֶב
  choice: மாலை நேரத்தில்
  rationale: மாலைப் பொழுதைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: לְעֵת צֵאת הַשֹּׁאֲבֹת
  choice: தண்ணீர் எடுக்கும் பெண்கள் வெளியே வரும் நேரத்தில்
  rationale: הַשֹּׁאֲבֹת என்பது பெண்பால் பன்மை வினையெச்சம்; ஆகவே பெண்கள் என்ற பாலினத் தகவலை வெளிப்படையாகப் பாதுகாக்கிறது. צֵאת என்பதன் ‘வெளியே வருதல்’ என்ற பொருளும் தக்கவைக்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், dignified ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயத்தில் தொடர்ச்சியாக வரும் இரு காலக் குறிப்புகளும் கோடுகளால் இணைக்கப்பட்டு, இரண்டாவது குறிப்பு முதலாவதை விளக்கும் இயல்பான தமிழாக்கமாக அமைக்கப்பட்டுள்ளது.
