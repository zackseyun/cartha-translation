base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/050.yaml
  text: Then Laban and Bethuel answered and said[a], “The matter has come from Yahweh[b]; we cannot speak to you bad or good.”
translation:
  language: ta
  text: 'அப்போது லாபானும் பெத்துவேலும் பதிலளித்துச் சொன்னார்கள்: “இந்தக் காரியம் யாவேயிடமிருந்து வந்தது; உம்மிடம் தீமையோ நன்மையோ சொல்ல எங்களால் முடியாது.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தீமையோ நன்மையோ சொல்ல” என்பது இரு எதிர்முனைகளை இணைக்கும் எபிரெயச் சொற்றொடர். இச்சூழலில், யாவே தீர்மானித்த காரியத்தை அவர்கள் எதிர்க்கவோ மாற்றவோ முடியாது என்பதைக் குறிக்கலாம்.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: மறுமொழி கூறினார்கள்
  rationale: எபிரெய உரையாடல் அறிமுகத்தில் வரும் ‘பதிலளித்து, சொன்னார்கள்’ என்ற இரட்டைச் சொல்லாக்கத்தின் செயல்பாட்டையும் இயல்பான நவீனத் தமிழையும் இணைக்கிறது.
- source_word: מֵיְהוָה יָצָא הַדָּבָר
  choice: இந்தக் காரியம் யாவேயிடமிருந்து வந்தது
  rationale: יָצָא உடன் வரும் מִן மூலத்தைக் குறிக்கிறது; הַדָּבָר இங்கு திருமண முன்மொழிவு சார்ந்த காரியத்தைக் குறிக்கிறது. ‘வந்தது’ இயல்பாகவும் மூலத்தின் கருத்தைத் தெளிவாகவும் தருகிறது.
- source_word: לֹא נוּכַל
  choice: எங்களால் முடியாது
  rationale: יכל வெளிப்படுத்தும் இயலாமையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: דַּבֵּר אֵלֶיךָ
  choice: உம்மிடம் ... சொல்ல
  rationale: பேச்சு ஒருவரை நோக்கிச் செலுத்தப்படுவதை ‘உம்மிடம்’ காக்கிறது; இச்சூழலில் ‘சொல்ல’ என்பது இயல்பான தமிழ்.
- source_word: רַע אוֹ טוֹב
  choice: தீயதோ நல்லதோ
  rationale: மூலத்தின் எதிரிணையையும் அதன் சொல் வரிசையையும் காக்கிறது; அதன் இடியோமப் பொருளை முதன்மை உரையில் விரித்து ஒரே விளக்கமாக முடிவுசெய்யவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது; அதை பொதுப்பட்டமாக மாற்றாமல் தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- issue: ‘தீயதோ நல்லதோ சொல்ல’ என்ற எதிரிணையின் பொருள்
  choice: எபிரெய இடியோமத்தை முதன்மை உரையில் காக்குதல்
  alternative: யாவே தீர்மானித்ததை எதிர்க்கவோ மாற்றவோ முடியாது
  rationale: இச்சொற்றொடர் சூழலில் எதிர்ப்பதற்கோ மாற்றுவதற்கோ தங்களுக்கு உரிமையில்லை என்பதைக் குறிக்கலாம்; ஆயினும் அந்த விளக்கத்தை முதன்மை உரைக்குள் சேர்ப்பது மூலத்தின் சுருக்கத்தையும் உண்மையான இடியோமத் தன்மையையும் நீக்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வேதாகம உரைநடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபருக்கான மரியாதை வடிவமாக ‘உம்மிடம்’ தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் சுருக்கமும் இறையியல் பதற்றமும் காக்கப்பட்டன.
