translation_notes:
  register: நவீன தரமான தமிழில், கண்ணியமான கதைநடை மற்றும் வேலைக்காரனின் மரியாதைமிக்க பேச்சு பேணப்பட்டுள்ளன. ‘எஜமான்’ என்பது אֲדֹנִי என்பதன் சமூக உறவை இயல்பாகக் காட்டுகிறது. ஆண் குறிக்கும் பிரதிப்பெயர்களால் ஏற்படக்கூடிய குழப்பத்தைத் தவிர்க்க ‘அந்த மகனுக்கு’ என வெளிப்படுத்தப்பட்டுள்ளது.
