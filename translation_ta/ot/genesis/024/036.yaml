  text: וַ/תֵּ֡לֶד שָׂרָה֩ אֵ֨שֶׁת אֲדֹנִ֥/י בֵן֙ לַֽ/אדֹנִ֔/י אַחֲרֵ֖י זִקְנָתָ֑/הּ וַ/יִּתֶּן לּ֖/וֹ אֶת כָּל אֲשֶׁר לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/036.yaml
  text: And Sarah[a], my master's wife, bore a son to my master after her old age, and he gave him all that he had.
translation:
  language: ta
  text: என் எஜமானின் மனைவியாகிய சாராள், தான் முதிர்வயதடைந்த பின்பு என் எஜமானுக்கு ஒரு மகனைப் பெற்றெடுத்தாள்; அவர் தமக்கிருந்த அனைத்தையும் அந்த மகனுக்குக் கொடுத்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: பெற்றெடுத்தாள்
  rationale: ילד என்பதன் Qal wayyiqtol வடிவம் தொடர்ச்சியான இறந்தகாலக் கதைநடையைக் குறிக்கிறது; குழந்தையைப் பெற்றெடுப்பதை நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: אֵשֶׁת אֲדֹנִי
  choice: என் எஜமானின் மனைவியாகிய
  rationale: எஜமானிடம் வேலைக்காரன் காட்டும் மரியாதையைப் பேணும் கட்டமைப்பு; தமிழில் சாராளை இயல்பாக அடையாளப்படுத்துகிறது.
- source_word: בֵן
  choice: ஒரு மகனை
  rationale: எபிரெயத்தில் பெயர்ச்சொல் இங்கு குறிப்புச் சுட்டில்லாமல் உள்ளது; சூழலில் ஈசாக்கு அறியப்பட்டவராயினும், பிறப்புச் செய்திக்குரிய இயல்பான தமிழ் வடிவம் இது.
- source_word: לַאדֹנִי
  choice: என் எஜமானுக்கு
  rationale: ל குறிக்கும் உறவு அல்லது பயனாளிப் பொருளைத் தமிழின் வேற்றுமை உருபு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַחֲרֵי זִקְנָתָהּ
  choice: தான் முதிர்வயதடைந்த பின்பு
  rationale: சொல்லர்த்தமாக ‘அவளுடைய முதுமைக்குப் பின்பு’ என்றாலும், சாராள் முதிர்ந்த வயதை அடைந்த பின்னர் என்பதே எபிரெயச் சொற்றொடரின் சூழல்சார் காலப்பொருள்; விசித்திரமான தமிழைத் தவிர்த்து அந்த வலியுறுத்தலைப் பேணுகிறது.
- source_word: וַיִּתֶּן לוֹ
  choice: அவர் ... அந்த மகனுக்குக் கொடுத்தார்
  rationale: தொடர்ச்சியான இறந்தகால வினை; மறைந்துள்ள எழுவாய் ஆபிரகாம் என்பதையும் לוֹ குறிப்பிடுவது முன்சொன்ன மகன் என்பதையும் தமிழில் குழப்பமின்றித் தெளிவாக்குகிறது.
- source_word: אֶת כָּל אֲשֶׁר לוֹ
  choice: தமக்கிருந்த அனைத்தையும்
  rationale: ஆபிரகாமுக்குச் சொந்தமான உடைமைகள் அனைத்தையும் குறிக்கும் முழுமையான உடைமைச் சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
