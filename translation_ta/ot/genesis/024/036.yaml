  terminology: “எஜமான்” suitably conveys אֲדֹנִי in the servant's deferential speech, and “சாராள்” is an established Tamil biblical form. “ஒரு மகன்” accurately retains the indefinite presentation of the Hebrew while remaining clear in context.
