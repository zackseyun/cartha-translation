  source_fidelity: 'The Tamil accurately represents the Hebrew narrative sequence: Sarah, identified as the speaker''s master''s wife, bore a son to the master after reaching old age; Abraham then gave the son all that belonged to him. The explicit Tamil phrase “அந்த மகனுக்கு” correctly resolves the Hebrew pronominal referent without altering it.'
