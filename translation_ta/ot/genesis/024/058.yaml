  yaml_path: translation/ot/genesis/024/058.yaml
  text: So they called Rebekah and said to her, “Will you go with this man?” And she said, “I will go.”
translation:
  language: ta
  text: அவர்கள் ரெபெக்காளை அழைத்து, “நீ இந்த மனிதனுடன் போவாயா?” என்று அவளிடம் கேட்டார்கள். அதற்கு அவள், “நான் போவேன்” என்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ לְרִבְקָה
  choice: அவர்கள் ரெபெக்காளை அழைத்து
  rationale: קרא என்பதற்கு இச்சூழலில் ஒருவரை வரும்படி அழைத்தல் என்ற பொருள். வலுக்கட்டாயத் தொனி தரக்கூடிய ‘வரவழைத்தார்கள்’ என்பதைவிட ‘அழைத்து’ இயல்பானது. רִבְקָה என்ற பெயருக்கு தமிழில் நிலைபெற்ற ‘ரெபெக்காள்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיֹּאמְרוּ אֵלֶיהָ
  choice: என்று அவளிடம் கேட்டார்கள்
  rationale: எபிரெயத்தில் நேரடியாக ‘அவளிடம் சொன்னார்கள்’ என்றாலும், அதைத் தொடர்ந்து வருவது கேள்வி என்பதால் நவீன தமிழில் ‘கேட்டார்கள்’ என்பது இயல்பான உரையாடல் நடை; கருத்தில் எதையும் சேர்ப்பதில்லை.
- source_word: הֲתֵלְכִי
  choice: நீ ... போவாயா?
  rationale: הלך என்பது பொதுவான ‘போ’ என்ற வினை. ‘போக விரும்புகிறாயா?’ அல்லது ‘போகச் சம்மதமா?’ என்று விருப்பம் அல்லது சம்மதத்தை வெளிப்படையாகச் சேர்க்காமல், மூலத்தின் நேரடியான கேள்வி பாதுகாக்கப்படுகிறது.
- source_word: עִם הָאִישׁ הַזֶּה
  choice: இந்த மனிதனுடன்
  rationale: אִישׁ என்பதன் நேரடிப் பொருள் ‘மனிதன்/ஆண்’. இங்கு குறிப்பிடப்படுபவர் ஆபிரகாமின் வேலைக்காரராக இருந்தாலும், மூலத்தில் ‘வேலைக்காரன்’ என்று இல்லை; ஆகவே ‘இந்த மனிதன்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַתֹּאמֶר אֵלֵךְ
  choice: அதற்கு அவள், “நான் போவேன்” என்றாள்
  rationale: אמר என்பதற்கு ‘சொல்’ என்ற அடிப்படைப் பொருளை ‘என்றாள்’ இயல்பாகக் காட்டுகிறது. אֵלֵךְ என்பது எளிய, உறுதியான முதல் நபர் கூற்று; ‘நான் போவேன்’ அதைப் பொருள் கூட்டாமல் தருகிறது.
