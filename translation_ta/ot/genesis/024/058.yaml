  source_fidelity: 'மூல எபிரெயத்தின் நிகழ்வுவரிசையும் பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: ரெபெக்காளை அழைத்தல், அவளிடம் இந்த மனிதனுடன் போவாளா எனக் கேட்குதல், அவளது உறுதியான ‘நான் போவேன்’ என்ற பதில் ஆகியவை அனைத்தும் உள்ளன. ‘கேட்டார்கள்’ என்பது வினவல் வடிவிலான நேரடி உரைக்கு இயல்பான தமிழ்; மூலத்தின் பொருளை மாற்றுவதில்லை.'
