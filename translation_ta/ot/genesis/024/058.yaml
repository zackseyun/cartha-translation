translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீ’ என்பது ஒருமை வினைமுற்றுக்கும் குடும்பச் சூழலிலான நேரடி உரையாடலுக்கும் பொருந்துகிறது. மூலத்தின் கேள்வி–பதில் சுருக்கமும் ரெபெக்காளின் உறுதியான பதிலும் பாதுகாக்கப்பட்டுள்ளன.
