  text: Then the man bowed down and worshiped Yahweh[a][b].
translation:
  language: ta
  text: அப்போது அந்த மனிதன் தாழ்ந்து வணங்கி, யாவேயைத் தொழுதான்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்கு முன்பாகப் பணிந்தான்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அந்த மனிதன்”; இது ஆபிரகாமின் வேலைக்காரரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: தலைகுனிந்து
  rationale: קָדַד என்பது உடலை அல்லது தலையைத் தாழ்த்தி வணங்குவதைக் குறிக்கிறது. அடுத்து வரும் வழிபாட்டுச் செயலில் இருந்து இந்த உடல் அசைவை இயல்பான தமிழில் வேறுபடுத்திக் காட்டுகிறது.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: எபிரெய உரை இவ்விடத்தில் ‘வேலைக்காரன்’ என்று விளக்காமல், பொதுப்பெயரான אִישׁ (‘மனிதன்’) என்பதையே பயன்படுத்துகிறது. சூழலில் இவர் ஆபிரகாமின் வேலைக்காரர்.
- source_word: וַיִּשְׁתַּחוּ
  choice: தொழுதுகொண்டான்
  rationale: שׁחה என்பதன் இவ்வடிவம் பயபக்தியுடன் பணிந்து வணங்குவதைக் குறிக்கிறது. செயல் யாவேக்கு செலுத்தப்படுவதால் ‘தொழுதுகொண்டான்’ அதன் வழிபாட்டுப் பொருளை இயல்பாகத் தெரிவிக்கிறது; முந்தைய வினை உடல் தாழ்த்துதலை ஏற்கெனவே காட்டுகிறது.
- source_word: לַיהוָה
  choice: யாவேயை
  rationale: יהוה என்ற தனிப்பட்ட இறைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது. ל முன்னொட்டு குறிக்கும் நோக்குப் பொருள் தமிழில் ‘-ஐ’ வேற்றுமையால் இயல்பாக வெளிப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரை பொதுப் பட்டமாக மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புக்கு நெருக்கமாக ‘யாவே’ என வழங்குகிறது.
- issue: וַיִּשְׁתַּחוּ என்பதை உடல் பணிவாகவா வழிபாடாகவா வழங்குவது
  choice: தொழுதுகொண்டான்
  alternative: தரையில் விழுந்து பணிந்துகொண்டான்
  rationale: யாவே இச்செயலின் நோக்காக இருப்பதால் வழிபாட்டுப் பொருள் தெளிவாக உள்ளது. அதே நேரத்தில், உடல் பணிவைக் காட்டும் மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான இரண்டு எபிரெய வினைகளின் வேறுபாடு ‘தலைகுனிந்து’ மற்றும் ‘தொழுதுகொண்டான்’ என்பவற்றால் பாதுகாக்கப்பட்டுள்ளது.
