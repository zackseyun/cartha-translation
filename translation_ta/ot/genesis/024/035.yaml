source:
  edition: WLC
  text: וַ/יהוָ֞ה בֵּרַ֧ךְ אֶת אֲדֹנִ֛/י מְאֹ֖ד וַ/יִּגְדָּ֑ל וַ/יִּתֶּן ל֞/וֹ צֹ֤אן וּ/בָקָר֙ וְ/כֶ֣סֶף וְ/זָהָ֔ב וַ/עֲבָדִם֙ וּ/שְׁפָחֹ֔ת וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/035.yaml
  text: And Yahweh has greatly blessed my master[a], and he has become great. He has given him flocks and herds, silver and gold, male servants and female servants, camels and donkeys.
translation:
  language: ta
  text: யாவே என் எஜமானை மிகுதியாக ஆசீர்வதித்திருக்கிறார்; அவர் மிகவும் பெரியவராகியிருக்கிறார். அவர் அவருக்கு ஆட்டு மந்தைகளையும் மாட்டு மந்தைகளையும், வெள்ளியையும் தங்கத்தையும், ஆண் பணியாளர்களையும் பெண் பணியாளர்களையும்[a], ஒட்டகங்களையும் கழுதைகளையும் கொடுத்திருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண் அடிமைகளையும் பெண் அடிமைகளையும்.” எபிரெயச் சொற்கள் சூழலுக்கேற்ப வீட்டுப் பணியாளர்களையோ அடிமைகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יהוה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் வரும் தனிப்பட்ட இறைப் பெயரைப் பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ என்ற வடிவில் தருகிறது.
- source_word: בֵּרַךְ ... מְאֹד
  choice: மிகுதியாக ஆசீர்வதித்திருக்கிறார்
  rationale: வினையின் ‘ஆசீர்வதித்தல்’ என்ற பொருளையும் מְאֹד காட்டும் வலியுறுத்தலையும், அதன் தற்போதைய விளைவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲדֹנִי
  choice: என் எஜமான்
  rationale: இங்கு ஆபிரகாமைக் குறிக்கும் மனித எஜமான்–பணியாளர் உறவைத் தெளிவாகக் காட்டுகிறது; இது இறைப்பட்டம் அல்ல.
- source_word: וַיִּגְדָּל
  choice: அவர் மேன்மையடைந்திருக்கிறார்
  rationale: செல்வம் மட்டுமன்றி பெருமை, செல்வாக்கு, உயர்நிலை ஆகியவற்றையும் உள்ளடக்கக்கூடிய ‘பெரியவராதல்’ என்ற விரிந்த பொருளைப் பாதுகாக்கிறது.
- source_word: צֹאן וּבָקָר
  choice: ஆட்டு மந்தைகளையும் மாட்டு மந்தைகளையும்
  rationale: צֹאן என்பது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய சிறுகால்நடைக் கூட்டுச் சொல்; இயல்பான தமிழில் ‘ஆட்டு மந்தைகள்’ என்றும், בָּקָר என்பதற்கு ‘மாட்டு மந்தைகள்’ என்றும் தரப்பட்டுள்ளது.
- source_word: כֶּסֶף וְזָהָב
  choice: வெள்ளியையும் தங்கத்தையும்
  rationale: செல்வத்தின் உலோக வடிவைக் குறிப்பிடும் மூலச்சொற்களின் நேரடியான பொருளைப் பாதுகாக்கிறது.
- source_word: עֲבָדִם וּשְׁפָחֹת
  choice: ஆண் பணியாளர்களையும் பெண் பணியாளர்களையும்
  rationale: பாலின வேறுபாட்டைப் பாதுகாத்து, இச்சொற்கள் சூழலின்படி பணியாளர்களையோ அடிமைகளையோ குறிக்கக்கூடிய தெளிவின்மையை அடிக்குறிப்பில் பதிவு செய்கிறது.
- source_word: גְּמַלִּים וַחֲמֹרִים
  choice: ஒட்டகங்களையும் கழுதைகளையும்
  rationale: இரு கால்நடைப் பெயர்களுக்கும் நேரான, நவீனத் தமிழ் இணைகள்.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டமல்ல, தனிப்பட்ட இறைப் பெயரே உள்ளது. அதை ‘கர்த்தர்’ என்று மறைக்காமல் பெயராக வழங்கப்படுகிறது; தமிழ் வாசகர்களுக்கு பரவலாக அறியப்பட்ட பெயர்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: עֲבָדִם / שְׁפָחֹת என்பவற்றின் சமூக நிலை
  choice: ஆண் பணியாளர்கள் மற்றும் பெண் பணியாளர்கள்
  alternative: ஆண் அடிமைகள் மற்றும் பெண் அடிமைகள்
  rationale: இவை வீட்டுப் பணியாளர்களையோ அடிமைகளையோ குறிக்கலாம். உடைமைகளின் பட்டியலில் வருவதால் ‘அடிமைகள்’ என்பது உண்மையான சாத்தியம்; எனினும் இவ்வசனம் அவர்களுடைய சட்ட நிலையைத் தனியாகத் தீர்மானிக்காததால், பிரதான உரையில் பொதுவான சொற்களையும் அடிக்குறிப்பில் வலுவான மாற்றையும் தருகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடையைப் பயன்படுத்துகிறது. பட்டியலின் இணை அமைப்பு காக்கப்பட்டுள்ளது; ‘மேன்மையடைந்திருக்கிறார்’ என்பது செல்வத்தை மட்டும் கூறாமல் மூலத்தின் விரிந்த பொருளைத் தக்கவைக்கிறது.
