base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/063.yaml
  text: And Isaac went out to meditate in the field toward evening[a], and he lifted up his eyes and looked, and behold, camels were coming.
translation:
  language: ta
  text: மாலை நெருங்கும் வேளையில் ஈசாக்கு வயல்வெளியில் தியானிப்பதற்காக[a] வெளியே சென்றார். அவர் தம் கண்களை ஏறெடுத்துப் பார்த்தபோது, இதோ, ஒட்டகங்கள் வந்துகொண்டிருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நடப்பதற்காக,’ ‘சிந்திப்பதற்காக,’ ‘உரையாடுவதற்காக,’ அல்லது ஒருவேளை ‘வேண்டிக்கொள்வதற்காக.’ இங்குள்ள எபிரேய வினைச்சொல் அரிதானது; இவ்விடத்தில் அதன் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: வெளியே சென்றார்
  rationale: יצא என்பதன் Qal wayyiqtol வடிவம் வெளியை நோக்கிய உடல் இயக்கத்தைக் குறிக்கிறது; இயல்பான தமிழ் நடையில் கதைத் தொடரைத் தெளிவாகக் காட்டுகிறது.
- source_word: יִצְחָק
  choice: ஈசாக்கு
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: לָשׂוּחַ
  choice: தியானிப்பதற்காக
  rationale: שׂוח அரிதாக வரும், இங்கு சரியான நுண்பொருள் விவாதத்திற்குரிய வினைச்சொல். தனிமையில் சிந்தனைமிக்க செயல்பாட்டைச் சுட்டும் சாத்தியமான முதன்மைப் பொருளாக இது தேர்ந்தெடுக்கப்பட்டது; உறுதியின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בַּשָּׂדֶה
  choice: வயல்வெளியில்
  rationale: שׂדה என்பது வயல் அல்லது திறந்த வெளிப்புற நிலப்பகுதியைக் குறிக்கிறது; ‘வயல்வெளியில்’ என்பது சூழலுக்கேற்ற இயல்பான தமிழ்.
- source_word: לִפְנוֹת עָרֶב
  choice: மாலை நெருங்கும் வேளையில்
  rationale: சொல்லடியாக ‘மாலை திரும்பும்/சாயும் நேரத்தில்’ என்ற எபிரேய மரபுத்தொடர் மாலை அணுகுவதைச் சுட்டுகிறது.
- source_word: וַיִּשָּׂא עֵינָיו
  choice: அவர் தம் கண்களை ஏறெடுத்து
  rationale: பார்வையை உயர்த்தி அல்லது தொலைவில் செலுத்தும் எபிரேய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וַיַּרְא
  choice: பார்த்தபோது
  rationale: முந்தைய பார்வைச் செயலோடு இயல்பாக இணைத்து, அவர் கண்ட காட்சிக்கு வழிவகுக்கும் தொடர்ச்சியைத் தமிழில் தருகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீரெனக் கண்ணில் பட்ட குறிப்பிடத்தக்க காட்சியின்மீது கவனத்தை ஈர்க்கும் הִנֵּה என்ற சொல்லின் கதைநடை உயிரோட்டத்தைப் பாதுகாக்கிறது.
- source_word: גְמַלִּים בָּאִים
  choice: ஒட்டகங்கள் வந்துகொண்டிருந்தன
  rationale: בָּאִים என்ற நிகழ்காலப் பங்கேற்பு வடிவம் அப்போது தொடர்ந்துகொண்டிருந்த அணுகுதலைக் காட்டுகிறது.
