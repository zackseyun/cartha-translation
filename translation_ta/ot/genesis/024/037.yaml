translation_notes:
  register: நவீனத் தரத்தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எஜமான்’, ‘சத்தியம் செய்யவைத்து’, ‘மனைவியாக எடுக்காதே’ ஆகியவை காலச்சூழலையும் ஆணையின் தீவிரத்தையும் இயல்பாகத் தக்கவைக்கின்றன.
