source:
  edition: WLC
  text: וַ/יַּשְׁבִּעֵ֥/נִי אֲדֹנִ֖/י לֵ/אמֹ֑ר לֹא תִקַּ֤ח אִשָּׁה֙ לִ/בְנִ֔/י מִ/בְּנוֹת֙ הַֽ/כְּנַעֲנִ֔י אֲשֶׁ֥ר אָנֹכִ֖י יֹשֵׁ֥ב בְּ/אַרְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/037.yaml
  text: And my master made me swear[a], saying, ‘You shall not take a wife for my son from the daughters of the Canaanites, in whose land I am dwelling.’
translation:
  language: ta
  text: என் எஜமான் என்னைச் சத்தியம் செய்யவைத்து, ‘நான் யாருடைய நாட்டில் குடியிருக்கிறேனோ, அந்தக் கானானியரின்[a] மகள்களில் ஒருத்தியை என் மகனுக்கு மனைவியாக எடுக்காதே’ என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் இங்கு ‘கானானியன்’ என்பது ஒருமை வடிவில் ஒரு மக்களினத்தைக் கூட்டாகக் குறிக்கிறது; சொற்சொல்லாக, ‘நான் எவனுடைய நாட்டில் குடியிருக்கிறேனோ, அந்தக் கானானியனின் மகள்கள்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבִּעֵנִי
  choice: என்னைச் சத்தியம் செய்யவைத்து
  rationale: שׁבע என்பதன் ஹிஃபில் வடிவம் ஒருவரைச் சத்தியம் செய்யவைப்பதையோ ஆணைக்குக் கட்டுப்படுத்துவதையோ குறிக்கிறது. இத்தமிழாக்கம் அதன் செயப்பாட்டு வலிமையை இயல்பாகத் தக்கவைக்கிறது.
- source_word: אֲדֹנִי
  choice: என் எஜமான்
  rationale: இங்கு வேலைக்காரன் தனது மனிதத் தலைவரான ஆபிரகாமைக் குறிப்பிடுகிறான்; கடவுளைக் குறிப்பிடவில்லை. ‘எஜமான்’ அந்தச் சமூக உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לֹא תִקַּח אִשָּׁה לִבְנִי
  choice: என் மகனுக்கு மனைவியாக எடுக்காதே
  rationale: திருமணச் சூழலில் אִשָּׁה என்பது ‘மனைவி’ என்று பொருள்படும். இரண்டாம் நபர் ஒருமை வினைமுற்றின் தடைப் பொருளை இயல்பான நேரடிக் கட்டளையாக ‘எடுக்காதே’ வெளிப்படுத்துகிறது.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: அந்தக் கானானியரின் மகள்களில் ஒருத்தியை
  rationale: ‘மகள்கள்’ என்ற எபிரெய குடும்ப-இனக் குறிப்பைத் தக்கவைத்து, מִן என்பதன் ஒரு குழுவிலிருந்து தேர்ந்தெடுக்கும் பொருளைத் தமிழில் ‘மகள்களில் ஒருத்தியை’ என இயல்பாக அளிக்கிறது.
- source_word: אֲשֶׁר אָנֹכִי יֹשֵׁב בְּאַרְצוֹ
  choice: நான் யாருடைய நாட்டில் குடியிருக்கிறேனோ, அந்தக் கானானியரின்
  rationale: ‘அவனுடைய நாட்டில் நான் குடியிருக்கிறேன்’ என்ற நிலத்தை மையப்படுத்திய உறவுத் தொடரைத் தக்கவைக்கிறது. எபிரெய ஒருமை கூட்டுப்பெயர் தமிழில் இயல்பாகப் பன்மையில் தரப்பட்டு, அதன் வடிவம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: יֹשֵׁב
  choice: குடியிருக்கிறேனோ
  rationale: பங்கேற்புவினை தொடர்ந்து வசித்துவரும் நிலையைக் குறிக்கிறது; ‘குடியிருக்கிறேன்’ அந்த நீடித்த வசிப்பைப் பொருத்தமாக வெளிப்படுத்துகிறது.
