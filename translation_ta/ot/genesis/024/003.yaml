  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אַשְׁבִּ֣יעֲ/ךָ֔ בַּֽ/יהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וֵֽ/אלֹהֵ֖י הָ/אָ֑רֶץ אֲשֶׁ֨ר לֹֽא תִקַּ֤ח אִשָּׁה֙ לִ/בְנִ֔/י מִ/בְּנוֹת֙ הַֽ/כְּנַעֲנִ֔י אֲשֶׁ֥ר אָנֹכִ֖י יוֹשֵׁ֥ב בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/003.yaml
  text: and I will make you swear by Yahweh[a], the God of heaven and the God of the earth, that you shall not take a wife for my son from the daughters of the Canaanites, among whom I dwell.
translation:
  language: ta
  text: 'வானத்தின் கடவுளும் பூமியின் கடவுளுமான யாவே பேரில் உன்னைச் சத்தியம் செய்ய வைப்பேன்: நான் யார்களிடையே குடியிருக்கிறேனோ, அந்தக் கானானியரின் மகள்களில் ஒருத்தியை என் மகனுக்கு மனைவியாக நீ எடுத்துக்கொள்ளக் கூடாது.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַשְׁבִּיעֲךָ
  choice: உன்னை ஆணையிட வைப்பேன்
  rationale: שׁבע என்பதன் ஹிஃபில் வடிவம் மற்றொருவரை ஆணையிடச் செய்யும் காரணவினைப் பொருளைக் கொண்டது; தமிழில் ‘ஆணையிட வைப்பேன்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּיהוָה
  choice: யாவேமீது
  rationale: בְּ இங்கு யார்மீது ஆணையிடப்படுகிறது என்பதைக் குறிக்கிறது; יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֱלֹהֵי הַשָּׁמַיִם וֵאלֹהֵי הָאָרֶץ
  choice: வானத்தின் கடவுளும் பூமியின் கடவுளுமான
  rationale: எபிரெயத்தில் ‘கடவுள்’ என்ற உறவுநிலைச் சொற்றொடர் இருமுறை வருவதைக் காத்து, வானமும் பூமியும் என்ற அகில அளவையும் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר לֹא תִקַּח
  choice: நீ எடுத்துக்கொள்ளக் கூடாது
  rationale: இது ஆணையின் உள்ளடக்கமாக வரும் உறுதியான தடையைத் தெளிவான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: אִשָּׁה לִבְנִי
  choice: என் மகனுக்கு மனைவியாக
  rationale: திருமணச் சூழலில் אִשָּׁה என்பது பொதுவாக ‘பெண்’ என்பதைக் காட்டிலும் ‘மனைவி’ என்ற பொருளைக் கொண்டுள்ளது.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: அந்தக் கானானியர்களின் மகள்களில் ஒருத்தியை
  rationale: ‘மகள்கள்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்தபடியே, ஒரு மனைவியைத் தேர்ந்தெடுப்பதைக் குறிக்க ‘ஒருத்தியை’ சேர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר אָנֹכִי יוֹשֵׁב בְּקִרְבּוֹ
  choice: நான் யார்களிடையே குடியிருக்கிறேனோ, அந்தக் கானானியர்கள்
  rationale: יוֹשֵׁב என்ற நிகழ்காலத் தொடர்ச்சியையும், בְּקִרְבּוֹ குறிக்கும் ஒரு மக்களினத்தின் நடுவே வாழும் சமூகச் சூழலையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் நான்கு எழுத்துகளாலான இறைத் தனிப்பெயரான יהוה-ஐ நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்திலுள்ள தனிப்பெயரை வெளிப்படையாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஆணையின் தீவிரத்தைக் காக்க ‘ஆணையிட வைப்பேன்’ என்றும், மூலத்தின் ‘கானானியரின் மகள்கள்’ என்ற உருவகத்தைத் தக்கவைக்க ‘மகள்களில் ஒருத்தியை’ என்றும் வழங்கப்பட்டுள்ளது.
