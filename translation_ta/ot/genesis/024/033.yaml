translation_notes:
  register: இயல்பான, நவீன, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. முதல் பேச்சாளருக்கு ‘அவன்’ என்றும் பதிலளிப்பவருக்கு ‘அவர்’ என்றும் கொடுத்திருப்பது, எபிரெய உரையில் இருவருக்கும் வரும் ஒரே ஆண்பால் ஒருமை வடிவங்களால் தமிழில் உருவாகக்கூடிய குழப்பத்தைக் குறைக்கிறது; பதிலளிப்பவரின் பெயர் மூலவசனத்தில் இல்லாததால் சேர்க்கப்படவில்லை.
