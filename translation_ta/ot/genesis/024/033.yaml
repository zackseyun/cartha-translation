base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/033.yaml
  text: Food was set before him to eat[a], but he said, “I will not eat until I have spoken my words.” And he said, “Speak.”
translation:
  language: ta
  text: அவன் சாப்பிடுவதற்காக உணவு அவனுக்கு முன் வைக்கப்பட்டது. ஆனால் அவன், “நான் சொல்ல வேண்டியதைச் சொல்லும்வரை[a] சாப்பிடமாட்டேன்” என்றான். அதற்கு அவன், “பேசு” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொற்சொல்லாக, “நான் என் வார்த்தைகளைப் பேசும்வரை.” இச்சொற்றொடர், “நான் சொல்ல வேண்டியதைச் சொல்லும்வரை” என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּשַׂם / ויישם
  choice: வைக்கப்பட்டது
  rationale: சׂים என்பதன் பொருள் ‘வை/அமை’. உணவை வைத்தவர் யார் என்பது இங்கு முன்னிலைப்படுத்தப்படாததால், எபிரெய உரையின் செயப்பாட்டு வடிவத்தை இயல்பான தமிழ்ச் செயப்பாட்டு வாக்கியமாக வழங்குகிறது.
- source_word: לְפָנָיו
  choice: அவனுக்கு முன்
  rationale: ‘அவனுடைய முகத்திற்கு/சந்நிதிக்கு முன்’ என்பதன் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: לֶאֱכֹל
  choice: அவன் சாப்பிடுவதற்காக
  rationale: לְ உடன் வரும் வினையெச்சம் நோக்கத்தைக் குறிக்கிறது; உணவு அவன் சாப்பிடுவதற்காக வைக்கப்பட்டது என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: לֹא אֹכַל
  choice: சாப்பிடமாட்டேன்
  rationale: பேசுபவரின் உறுதியான மறுப்பையும், பின்னர் நிகழக்கூடிய செயலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַד אִם
  choice: சொல்லும்வரை
  rationale: அவன் சாப்பிடுவதற்கு முன் நிறைவேற வேண்டிய வரம்பை ‘வரை’ துல்லியமாகக் குறிக்கிறது; ‘சொல்லாவிட்டால்’ என்று மொழிபெயர்ப்பது பொருளை மாற்றிவிடும்.
- source_word: דִּבַּרְתִּי דְּבָרַי
  choice: நான் சொல்ல வேண்டியதைச் சொல்லும்வரை
  rationale: சொல்ல வேண்டிய செய்தி அல்லது காரியம் என்ற சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது. ‘என் வார்த்தைகளைப் பேசும்வரை’ என்ற சொற்சொல்லான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: דַּבֵּר
  choice: சொல்லுங்கள்
  rationale: தொடர்ந்து பேச அனுமதிக்கும் ஒருமை கட்டளையின் இயல்பான தமிழ் இணை. மரியாதைப் பன்மை தமிழில் சமூக உறவை இயல்பாக வெளிப்படுத்துகிறது; ‘பேசு’ தேவையற்ற கடுமையை உணர்த்தக்கூடும்.
