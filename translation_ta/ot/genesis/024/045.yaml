  terminology: ‘ரெபெக்கா,’ ‘உள்ளத்தில்,’ ‘இதோ,’ ‘ஊற்று,’ and ‘குடம்’ are appropriate. The notes correctly retain the distinction between inward speech/prayer and between spring and well.
