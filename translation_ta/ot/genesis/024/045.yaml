base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/045.yaml
  text: Before I had finished speaking in my heart[a], behold, Rebekah came out with her jar on her shoulder, and she went down to the spring and drew water. Then I said to her[b], ‘Please give me a drink.’
translation:
  language: ta
  text: “நான் என் உள்ளத்தில் பேசி முடிப்பதற்குள்[a], இதோ, ரெபெக்கா தன் தோளில் குடத்தைச் சுமந்தபடி வெளியே வந்தாள். அவள் ஊற்றுக்கு[b] இறங்கிச் சென்று தண்ணீர் எடுத்தாள். அப்போது நான் அவளிடம், ‘தயவுசெய்து எனக்குக் குடிக்கத் தண்ணீர் கொடு’ என்றேன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “என் இதயத்திடம் பேசுதல்”; இது உள்ளார்ந்த பேச்சையோ ஜெபத்தையோ குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: “நீரூற்று” என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள எபிரெயச் சொல் ஊற்றைக் குறிக்கிறது, வழக்கமாக ‘கிணறு’ என்பதற்குப் பயன்படுத்தப்படும் சொல் அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם אֲכַלֶּה
  choice: பேசிமுடிப்பதற்குள்
  rationale: சுட்டப்படும் நேரத்தில் செயல் இன்னும் முடிவடையவில்லை என்பதைக் காட்டும் எபிரெய காலநுட்பத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְדַבֵּר אֶל־לִבִּי
  choice: என் உள்ளத்தில் பேச
  rationale: சொல்லுக்கு நெருக்கமாக ‘என் இதயத்திடம் பேச’ என்ற எபிரெய மரபுத்தொடர் உள்ளார்ந்த பேச்சையோ ஜெபத்தையோ குறிக்கிறது; பொருளை ஒருதலைப்பட்சமாகத் தீர்மானிக்காமல் ‘என் உள்ளத்தில் பேச’ என்று வழங்கப்பட்டுள்ளது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீர் நிகழ்வையும் காட்சியின் உயிரோட்டத்தையும் குறிக்கும் உரையாடல் துகளின் வலிமையைப் பாதுகாக்கிறது.
- source_word: רִבְקָה
  choice: ரெபெக்கா
  rationale: நவீனத் தமிழில் இயல்பாக ஒலிக்கும் பெயர்வடிவம்; எபிரெயப் பெயரையும் அடையாளம் காணக்கூடியதாக வைத்திருக்கிறது.
- source_word: יֹצֵאת
  choice: வெளியே வந்தாள்
  rationale: הִנֵּה என்பதற்குப் பின் வரும் நிகழ்காலப் பெயரெச்சத்தின் உடனடி, உயிரோட்டமான கதைநடையைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: כַדָּהּ
  choice: தன் குடத்தை
  rationale: כד என்பது தண்ணீர் எடுக்கப் பயன்படும் குடம் அல்லது ஜாடி; ‘குடம்’ தமிழ்ச் சூழலில் தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: עַל־שִׁכְמָהּ
  choice: தன் தோள்மேல்
  rationale: மூலத்தின் நேரடியான இடவுறவைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַתֵּרֶד הָעַיְנָה
  choice: ஊற்றுக்கு இறங்கிச் சென்றாள்
  rationale: עַיִן இங்கு பொதுவான ‘கிணறு’ என்பதிலிருந்து வேறுபட்ட இயற்கை நீரூற்றைக் குறிக்கிறது; இயக்கத்தின் கீழ்நோக்கிய தன்மையையும் மொழிபெயர்ப்பு காக்கிறது.
- source_word: וַתִּשְׁאָב
  choice: தண்ணீர் எடுத்தாள்
  rationale: வினைச்சொல் தண்ணீர் இறைத்தல் அல்லது எடுத்தலைக் குறிக்கிறது; தமிழில் பொருளை இயல்பாகத் தெளிவாக்க ‘தண்ணீர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: הַשְׁקִינִי נָא
  choice: தயவுசெய்து எனக்குக் குடிக்கத் தண்ணீர் கொடு
  rationale: ஹிஃபில் கட்டளை வடிவின் ‘குடிக்கக் கொடு’ என்ற பொருளையும் נָא குறிக்கும் பணிவான வேண்டுகோளையும் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘உள்ளத்தில் பேசுதல்’ என்பது எண்ணமா ஜெபமா
  choice: என் உள்ளத்தில் பேச
  alternative: எனக்குள் ஜெபிக்க
  rationale: சூழல் ஜெபத்தைக் குறிக்கக்கூடும்; ஆனால் எபிரெய சொற்றொடர் உள்ளார்ந்த பேச்சு என்ற பரந்த பொருளையும் அனுமதிக்கிறது. ஆகவே இறையியல் விளக்கத்தை உரைக்குள் கட்டாயப்படுத்தாமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குத் தெளிவானதாயும் கதைநடையின் கண்ணியத்தையும் உயிரோட்டத்தையும் காக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதோ’ என்ற உயர்நடைச் சுட்டுச்சொல் மூலத்தின் திடீர் காட்சிப்படுத்தலைக் காக்கிறது; மற்ற சொற்றொடர்கள் இயல்பான தற்போதைய தமிழில் அமைந்துள்ளன.
