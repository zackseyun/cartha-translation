  text: And he said[a], “I am Abraham’s servant.”
translation:
  language: ta
  text: அவன் “நான் ஆபிரகாமின் பணியாள்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
