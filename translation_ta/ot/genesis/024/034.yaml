lexical_decisions:
- source_word: וַיֹּאמַר
  choice: என்றான்
  rationale: வாவ் தொடர்வினையுடன் வரும் אמר கதைநிகழ்வை முன்னெடுக்கிறது. தமிழில் மேற்கோளைத் தொடர்ந்து வரும் ‘என்றான்’ இயல்பான கதைநடையைத் தருகிறது; இணைப்பைத் தேவையின்றி மிகைப்படுத்துவதில்லை.
- source_word: עֶבֶד
  choice: பணியாள்
  rationale: עֶבֶד என்பது ‘பணியாள்’ அல்லது ‘அடிமை’ எனப் பொருள்படலாம். இங்கு பேசுகிறவர் ஆபிரகாமின் வீட்டில் தமக்குள்ள பொறுப்பை மரியாதையான சுயஅறிமுகமாகக் குறிப்பிடுவதால் ‘பணியாள்’ சூழலுக்கு இயல்பாகப் பொருந்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אַבְרָהָם
  choice: ஆபிரகாம்
  rationale: எபிரெய தனிப்பெயர் நவீனத் தமிழ் வேதாகம வழக்கில் நிலைபெற்ற வடிவில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: אָנֹכִי
  choice: நான்
  rationale: தனி மறுபெயர் வெளிப்படையான சுயஅடையாளப்படுத்தலைக் காட்டுகிறது. தமிழில் ‘நான் ... பணியாள்’ என்ற பெயர்ப்பயனிலை அமைப்பு, மூலத்தின் வலியுறுத்தலை இயல்பாகத் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பணியாள்’ பொதுவாசகருக்கு இயல்பாக இருக்கும்; எபிரெயச் சொல்லின் கடுமையான சமூகப் பொருளான ‘அடிமை’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
