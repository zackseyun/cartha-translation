  text: The man watched her silently[a], to know whether Yahweh had made his journey successful or not.
translation:
  language: ta
  text: அந்த மனிதன் அவளை மௌனமாக உற்றுநோக்கிக்கொண்டிருந்தான்[a]; யாவே தன் பயணத்தை வெற்றியடையச் செய்தாரா இல்லையா என்பதை அறிய.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
