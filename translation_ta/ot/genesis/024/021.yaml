    reason: מִשְׁתָּאֵה என்பது கூர்ந்து கவனித்தல் என்பதோடு வியப்பு அல்லது திகைப்பு கலந்த பார்வையையும் குறிக்கக்கூடும்.
lexical_decisions:
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: எபிரெய உரை பொதுப்பெயரான אִישׁ என்பதையே பயன்படுத்துகிறது. சூழலில் இவர் ஆபிரகாமின் பணியாளர் என்றாலும், அதை மொழிபெயர்ப்புக்குள் சேர்க்காமல் மூலச்சொல்லைப் பேணுகிறது.
- source_word: מִשְׁתָּאֵה
  choice: உற்றுப் பார்த்துக்கொண்டிருந்தான்
  rationale: இந்தப் பங்கேற்புவினை தொடர்ந்து கூர்ந்து கவனிப்பதைக் குறிக்கிறது; வியப்பு கலந்திருக்கக்கூடிய சாத்தியத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: לָהּ
  choice: அவளை
  rationale: அவளே அந்த மனிதனின் கூர்ந்த கவனத்திற்குரியவள் என்பதை இயல்பான தமிழில் குறிக்கிறது.
- source_word: מַחֲרִישׁ
  choice: மௌனமாக
  rationale: חרשׁ என்பதன் இவ்வடிவம் பேசாமல் அமைதியாக இருப்பதைக் குறிக்கிறது; வினையடை வடிவம் நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: לָדַעַת
  choice: அறிந்துகொள்வதற்காக
  rationale: இறுதிநிலை வினை நோக்கத்தை வெளிப்படுத்துகிறது. இங்கு ஏற்கெனவே தெரிந்த ஒன்றை அறிவது அல்ல, நிகழ்வின் முடிவைக் கண்டறிவது என்பதால் ‘அறிந்துகொள்ள’ பொருத்தமானது.
- source_word: הַהִצְלִיחַ
  choice: வெற்றியடையச் செய்தாரா
  rationale: צלח என்பதன் ஹிஃபில் வடிவத்திலுள்ள காரணவினைப் பொருளை—வெற்றி பெறச் செய்தல்—தெளிவாகப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான יהוה என்பதை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துத் தருகிறது.
- source_word: דַּרְכּוֹ
  choice: தன் பயணத்தை
  rationale: דרך என்பதன் அடிப்படைப் பொருள் ‘வழி’ என்றாலும், இக்கதைக்களத்தில் அது அந்த மனிதனின் பயணத்தையும் அதனுடன் தொடர்புடைய முயற்சியையும் குறிக்கிறது.
- source_word: אִם לֹא
  choice: இல்லையா
  rationale: மறைமுக வினாவில் ‘...செய்தாரா இல்லையா’ என்று இரு சாத்தியங்களையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் பட்டப்பெயர் அல்ல, நான்கெழுத்துத் தெய்வீகப் பெயரே உள்ளது. எனவே அதைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: பயணம் வெற்றியடைந்ததா என்பது குறித்த மனிதனின் அறிவு
  choice: அவர் இன்னும் முடிவை அறிந்துகொள்ள முயல்கிறார்
  alternative: பயணம் வெற்றியடைந்தது என்று அவர் ஏற்கெனவே உறுதியாக நம்பினார்
  rationale: ‘...ஆ இல்லையா என்பதை அறிந்துகொள்ள’ என்ற மூல உரை, அந்தக் கணத்தில் அவர் முடிவை ஆராய்ந்துகொண்டிருந்தார் என்பதைக் காட்டுகிறது; அவரது உள்ளார்ந்த நம்பிக்கையை அதற்கு மேல் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. ‘அந்த மனிதன்’ என்பது சூழலால் அறியப்படும் நபரைச் சுட்டுகிறது; ‘பணியாளர்’ என்று விளக்கிச் சேர்க்கப்படவில்லை. ‘மௌனமாக உற்றுப் பார்த்துக்கொண்டிருந்தான்’ என்பது தொடரும் இரு பங்கேற்புவினைகளையும் இயல்பான தமிழில் இணைக்கிறது.
