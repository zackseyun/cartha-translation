  yaml_path: translation/ot/genesis/024/019.yaml
  text: When she had finished giving him a drink[a], she said, “I will draw water for your camels also, until they have finished drinking.”
translation:
  language: ta
  text: அவனுக்குக் குடிக்கக் கொடுத்து முடித்ததும்[a], அவள், “உங்கள் ஒட்டகங்களுக்காகவும், அவை குடித்து முடிக்கும்வரை தண்ணீர் இறைப்பேன்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல் நெருக்கமாக: “அவனுக்குக் குடிக்கக் கொடுத்து முடித்தபின், அவள், ‘உங்கள் ஒட்டகங்களுக்காகவும் அவை குடித்து முடிக்கும்வரை தண்ணீர் இறைப்பேன்’ என்றாள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּכַל לְהַשְׁקֹתוֹ
  choice: அவனுக்குக் குடிக்கக் கொடுத்து முடித்ததும்
  rationale: כּלה என்பதன் நிறைவு அர்த்தத்தையும், שׁקה என்பதன் ஹிப்ஃபில் வடிவிலுள்ள ‘குடிக்கக் கொடுத்தல்’ என்ற காரணவினை அர்த்தத்தையும் இயல்பான தமிழ் நிகழ்வுத் தொடராகக் காட்டுகிறது.
- source_word: וַתֹּאמֶר
  choice: அவள் … என்றாள்
  rationale: எபிரெயக் கதைநடையின் அடுத்த நிகழ்வைத் தமிழின் இயல்பான நேர்கூற்று அமைப்பில் தருகிறது.
- source_word: גַּם לִגְמַלֶּיךָ
  choice: உங்கள் ஒட்டகங்களும் … அவற்றுக்காகவும்
  rationale: גַּם என்பதன் சேர்க்கைப் பொருளைப் பாதுகாத்து, ஒட்டகங்களும் குடிப்பதையும் அவற்றுக்காகத் தண்ணீர் இறைப்பதையும் தமிழில் தெளிவாக்குகிறது.
- source_word: אֶשְׁאָב
  choice: தண்ணீர் இறைப்பேன்
  rationale: שׁאב என்பது கிணறு போன்ற நீராதாரத்திலிருந்து தண்ணீர் எடுப்பதைக் குறிக்கிறது; சூழலால் விளங்கும் ‘தண்ணீர்’ என்பதை வெளிப்படையாகச் சேர்ப்பது இயல்பான தமிழாகும்.
- source_word: עַד אִם כִּלּוּ לִשְׁתֹּת
  choice: குடித்து முடிக்கும்வரை
  rationale: עַד אִם என்ற முடிவெல்லையையும், כִּלּוּ לִשְׁתֹּת என்ற ‘குடித்து முடித்தல்’ பொருளையும் சுருக்கமாகவும் துல்லியமாகவும் தருகிறது.
