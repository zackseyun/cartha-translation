translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் எபிரெயப் பின்னொட்டுக்கு, அந்நியரிடம் பேசும் மரியாதைச் சூழலைக் கருத்தில் கொண்டு ‘உங்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
