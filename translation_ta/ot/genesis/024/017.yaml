  edition: WLC
  text: וַ/יָּ֥רָץ הָ/עֶ֖בֶד לִ/קְרָאתָ֑/הּ וַ/יֹּ֕אמֶר הַגְמִיאִ֥י/נִי נָ֛א מְעַט מַ֖יִם מִ/כַּדֵּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/017.yaml
  text: The servant ran to meet her and said[a], “Please let me drink a little water from your jar.”
translation:
  language: ta
  text: அந்தப் பணியாள் அவளைச் சந்திக்க ஓடிப்போய், “தயவுசெய்து உன் குடத்திலிருந்து கொஞ்சம் தண்ணீர் எனக்குக் குடிக்கக் கொடு[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் குடத்திலிருந்து கொஞ்சம் தண்ணீர் எனக்குக் குடிக்கத் தா.” எபிரெயக் கட்டளை வடிவத்தை ‘எனக்குக் குடிக்கக் கொடு’ என்றும் ‘எனக்குக் குடிக்கத் தா’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: ஓடிப்போய்
  rationale: ரוץ என்ற வினை இங்கு நேரடியாக ஓடுவதைக் குறிக்கிறது; தொடர்ச்சியான எபிரெயக் கதைநடையை இயல்பான தமிழில் இணைவினையெச்சமாக வழங்குகிறது.
- source_word: הָעֶבֶד
  choice: அந்தப் பணியாள்
  rationale: עֶבֶד என்பதற்கு பணியாள் அல்லது அடிமை என்று பொருள் வரலாம். இச்சூழலில் ஆபிரகாமின் நம்பிக்கைக்குரிய இல்லப் பிரதிநிதியாகச் செயல்படுபவர் முன்னிலைப்படுவதால் ‘பணியாள்’ பொருத்தமானது; முன்னரே அறிமுகமானவரைக் குறிப்பதால் ‘அந்தப்’ சேர்க்கப்பட்டுள்ளது.
- source_word: לִקְרָאתָהּ
  choice: அவளைச் சந்திக்க
  rationale: לִקְרָאתָהּ என்பது அவளை நோக்கிச் சென்று சந்திப்பதை நோக்கமாகக் காட்டுகிறது; ‘அவளைச் சந்திக்க’ இதை இயல்பாகப் பாதுகாக்கிறது.
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: நேரடிப் பேச்சுக்குப் பின் வரும் இயல்பான தமிழ் கதைநடை வடிவம்; ஆண்பால் ஒருமையையும் வெளிப்படுத்துகிறது.
- source_word: הַגְמִיאִינִי
  choice: எனக்குக் குடிக்கக் கொடு
  rationale: גמא என்பதன் ஹிஃபில் கட்டளை வடிவம் ஒருவருக்குக் குடிக்கக் கொடுப்பதை அல்லது குடிக்க அனுமதிப்பதைச் சுட்டலாம். ‘எனக்குக் குடிக்கக் கொடு’ தமிழில் இயல்பாகவும் எபிரெயச் செயப்பாட்டு நுணுக்கத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: நָא வேண்டுகோளின் பணிவைச் சுட்டுகிறது; நவீனத் தமிழில் ‘தயவுசெய்து’ இயல்பான இணை.
- source_word: מְעַט מַיִם
  choice: கொஞ்சம் தண்ணீர்
  rationale: מְעַט அளவின் சிறுமையைச் சுட்டுகிறது. ‘கொஞ்சம் தண்ணீர்’ சாதாரண நவீனத் தமிழில் இயல்பாக இருந்து வேண்டுகோளின் அடக்கத்தையும் காக்கிறது.
- source_word: מִכַּדֵּךְ
  choice: உன் குடத்திலிருந்து
  rationale: כַּד என்பது தண்ணீர் எடுக்கவும் சுமக்கவும் பயன்படும் குடம்; பெண்பால் ஒருமை உடைமைப் பின்னொட்டு ‘உன்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
