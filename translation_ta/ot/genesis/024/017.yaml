translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிமையும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பணியாள்’, ‘குடம்’, ‘தண்ணீர்’ ஆகியவை பொதுவாகப் புரியும் சொற்கள். மூலத்தின் பணிவான வேண்டுகோளும் கட்டளை வடிவத்தின் உண்மையான இருபொருள் வாய்ப்பும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
