base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/055.yaml
  text: But her brother and her mother said[a], “Let the young woman stay with us a few days, or ten; after that she may go.”
translation:
  language: ta
  text: ஆனால் அவளுடைய சகோதரனும் தாயும், “அந்த இளம்பெண் எங்களோடு சில நாட்கள், அல்லது பத்து நாட்கள் தங்கட்டும்; அதற்குப் பிறகு அவள் போகலாம்” என்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் நேரடியாக: “நாட்கள், அல்லது பத்து.” இந்தச் சொற்றொடர் “சில நாட்கள், அல்லது பத்து நாட்கள்” என்று பொருள்படலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் ... என்றார்கள்
  rationale: எபிரெய மொழியில் வினை ஒருமையில் இருந்தாலும், ‘அவளுடைய சகோதரனும் தாயும்’ என்ற கூட்டெழுவாயை இயல்பான தமிழில் பன்மை வினையால் குறித்தோம். முந்தைய வசனத்திலுள்ள பணியாளனின் அவசர வேண்டுகோளுக்கு எதிரான பதிலைச் சூழல் காட்டுவதால் וַ־ என்பதை ‘ஆனால்’ என மொழிபெயர்த்தோம்.
- source_word: אָחִיהָ וְאִמָּהּ
  choice: அவளுடைய சகோதரனும் தாயும்
  rationale: எபிரெய மூலத்தின் ஒருமை ‘சகோதரன்’ என்பதையும் சொல் வரிசையையும் தக்கவைக்கிறது.
- source_word: תֵּשֵׁב
  choice: தங்கட்டும்
  rationale: புறப்படுவதைச் சற்றுத் தாமதிக்கக் கோரும் சூழலில் ישב என்பதற்கு இயல்பான தமிழ் ‘தங்கட்டும்’.
- source_word: הַנַּעֲרָ
  choice: அந்த இளம்பெண்
  rationale: נַעֲרָה என்பதன் வயது மற்றும் பெண்பால் குறிப்பை மரியாதையான நவீன தமிழில் வெளிப்படுத்துகிறது; குறிப்பிட்ட ரெபெக்காளைச் சுட்டுவதால் ‘அந்த’ பயன்படுத்தப்பட்டது.
- source_word: אִתָּנוּ
  choice: எங்களோடு
  rationale: உடனிருப்பதைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: יָמִים אוֹ עָשׂוֹר
  choice: சில நாட்களாவது, அல்லது பத்து நாட்களாவது
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘நாட்கள், அல்லது பத்து.’ יָמִים இங்கு ‘சில நாட்கள்’ எனப் பொருள்படலாம்; עָשׂוֹר உடன் ‘நாட்கள்’ தமிழில் தெளிவுக்காக நிரப்பப்பட்டது. ‘ஆவது’ மாற்று கால அளவுகளை முன்வைக்கும் கோரிக்கையை இயல்பாகக் காட்டுகிறது.
- source_word: אַחַר
  choice: அதற்குப் பிறகு
  rationale: அடுத்தடுத்த நிகழ்வின் காலத்தைத் தெளிவாகக் குறிக்கும் இயல்பான தமிழ்.
- source_word: תֵּלֵךְ
  choice: அவள் போகலாம்
  rationale: சூழலில் இளம்பெண்ணே எழுவாய். ‘போகலாம்’ என்பது வெறும் எதிர்காலத்தைவிட அனுமதி அல்லது வேண்டுகோள் நயத்தைத் தக்கவைக்கிறது.
