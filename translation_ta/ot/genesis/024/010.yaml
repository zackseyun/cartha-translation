base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/010.yaml
  text: Then the servant took ten of his master's camels and went[a], with all kinds of good things from his master in his hand. And he arose and went to Aram-naharaim[d][c][b], to the city of Nahor.
translation:
  language: ta
  text: பின்பு அந்தப் பணியாளன் தன் எஜமானின் ஒட்டகங்களில் பத்தை எடுத்துக்கொண்டு, தன் எஜமானின் எல்லா நல்ல பொருள்களையும் தன் கையில் வைத்துக்கொண்டு புறப்பட்டான். பின்னர் அவன் எழுந்து, அராம்-நஹராயீமிலுள்ள நாகோரின் நகரத்திற்குச் சென்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“அராம்-நஹராயீம்” என்பது பாரம்பரியமாக “இரு நதிகளின் அராம்” அல்லது “மெசொப்பொத்தாமியா” என்று வழங்கப்படுகிறது. “தன் கையில்” என்பது உடைமை, கட்டுப்பாடு, அல்லது பொறுப்பைக் குறிக்கலாம்; இங்கு அவன் எடுத்துச் சென்ற மதிப்புள்ள பொருள்களைக் குறிக்கக்கூடும். வேறு வகையில்: “தன் எஜமானின் எல்லா நல்ல பொருள்களும் அவன் கையில் இருந்தன.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֶבֶד
  choice: அந்தப் பணியாளன்
  rationale: עֶבֶד என்பது பணியாளர் அல்லது அடிமை எனப் பொருள்படலாம். இக்குடும்பச் சூழலில் ஆபிரகாமின் நம்பிக்கைக்குரிய வீட்டுப் பணியாளனைக் குறிக்க இயல்பான, கண்ணியமான சொல்லாக ‘பணியாளன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עֲשָׂרָה גְמַלִּים מִגְּמַלֵּי אֲדֹנָיו
  choice: தன் எஜமானுடைய ஒட்டகங்களில் பத்தை
  rationale: מִן குறிக்கும் தொகுதியிலிருந்து தேர்ந்தெடுக்கும் பொருளைத் தமிழில் இயல்பாகவும் துல்லியமாகவும் வெளிப்படுத்துகிறது.
- source_word: אֲדֹנָיו
  choice: அவனுடைய எஜமான்
  rationale: வீட்டு நிர்வாக உறவைக் குறிக்கும் אָדוֹן என்பதற்கு இச்சூழலில் ‘எஜமான்’ பொருத்தமானது; தெய்வீகப் பட்டத்தைக் குறிப்பது போன்ற தவறான உணர்வைத் தவிர்க்கிறது.
- source_word: וְכָל טוּב אֲדֹנָיו בְּיָדוֹ
  choice: அவனுடைய எஜமானின் விலைமதிப்புள்ள பொருள்களெல்லாம் அவன் பொறுப்பில் இருந்தன
  rationale: טוּב இங்கு எஜமானின் செல்வம் அல்லது பரிசுகளாகக் கொண்டு செல்லப்பட்ட மதிப்புள்ள பொருள்களைக் குறிக்கிறது. בְּיָדוֹ என்ற ‘அவன் கையில்’ என்னும் எபிரெய மரபுத்தொடரின் உடைமை, கட்டுப்பாடு அல்லது பொறுப்பு என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: அவன் எழுந்து ... சென்றான்
  rationale: நோக்கமுள்ள செயலைத் தொடங்குவதைச் சுட்டும் קוּם என்பதையும், அதைத் தொடர்ந்து வரும் ‘சென்றான்’ என்பதையும் தனித்தனியாகக் காத்து, எபிரெயக் கதைநடையின் வரிசையைப் பாதுகாக்கிறது.
- source_word: אֲרַם נַהֲרַיִם
  choice: அராம் நகாராயிம்
  rationale: இடப்பெயர் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிவடிவத்துக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது; பாரம்பரிய விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עִיר נָחוֹר
  choice: நாகோரின் நகரம்
  rationale: இணைப்புநிலைத்தொடரை நேரடியாகக் காட்டுகிறது; அது நாகோருடன் தொடர்புடைய நகரம் என்பதைக் கூறினாலும், அவரே அதை நிறுவினார் என்று தீர்மானிப்பதில்லை.
