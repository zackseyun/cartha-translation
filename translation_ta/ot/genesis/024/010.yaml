translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் காணப்படும் பயணத்தைத் தொடங்கும் வினைகளின் மீளுருவாக்கம் முற்றிலும் நீக்கப்படாமல், தமிழில் இயல்பாக அமைய ‘புறப்பட்டான்’ என்றும் பின்னர் ‘எழுந்து ... சென்றான்’ என்றும் தரப்பட்டுள்ளது. இடப்பெயர்கள் எபிரெய வடிவத்துக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
