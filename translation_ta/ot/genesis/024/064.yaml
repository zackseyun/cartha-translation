base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/064.yaml
  text: Rebekah lifted up her eyes and saw Isaac[a], and she got down from the camel.
translation:
  language: ta
  text: ரெபெக்காள் தன் கண்களை ஏறெடுத்தாள்; ஈசாக்கைக் கண்டாள்; ஒட்டகத்திலிருந்து இறங்கினாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “ஒட்டகத்தின்மேலிருந்து விழுந்தாள்.” இங்கே “விழுந்தாள்” என்பது ஒட்டகத்திலிருந்து இறங்கியதைக் குறிக்கும் மரபுத்தொடராக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ
  choice: தன் கண்களை ஏறெடுத்துப் பார்த்தபோது
  rationale: எபிரேய மொழியின் ‘தன் கண்களை உயர்த்தினாள்’ என்ற காட்சிப்படிமத்தை இயல்பான, dignified நவீனத் தமிழில் ‘கண்களை ஏறெடுத்துப் பார்த்தாள்’ என்ற வழக்கால் பாதுகாக்கிறது.
- source_word: וַתֵּרֶא
  choice: கண்டாள்
  rationale: ראה என்பதன் அடிப்படைப் பொருளான நேரடியான பார்வையுணர்வைத் தெளிவாகத் தருகிறது.
- source_word: אֶת יִצְחָק
  choice: ஈசாக்கை
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர்வடிவம், உரிய வேற்றுமை உருபுடன் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַתִּפֹּל מֵעַל הַגָּמָל
  choice: ஒட்டகத்திலிருந்து இறங்கினாள்
  rationale: נפל பொதுவாக ‘விழு’ என்று பொருள்பட்டாலும், இச்சூழலில் ஒட்டகத்திலிருந்து இறங்குவதைக் குறிக்கும் மரபுத்தொடராக இருப்பதே அதிக சாத்தியம். ‘இறங்கினாள்’ நவீனத் தமிழில் தவறான விபத்து உணர்வைத் தவிர்த்து சூழலுக்குரிய பொருளைத் தருகிறது; நேரடியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
