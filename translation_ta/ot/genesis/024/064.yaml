translation_notes:
  register: இயல்பான, தற்போதைய, கண்ணியமான தமிழ்நடை. எபிரேயக் காட்சிப்படிமம் இயன்றவரை பாதுகாக்கப்பட்டு, தவறாகப் புரியக்கூடிய சொற்சொல்லான வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
