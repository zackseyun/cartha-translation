lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: காட்சியை உடனடியாகச் சுட்டிக்காட்டும் எபிரெயச் சொல்லின் உயிரோட்டத்தையும், நவீனத் தமிழின் இயல்பான நடையையும் காக்கிறது.
- source_word: נִצָּב
  choice: நிற்கிறேன்
  rationale: நிகழ்காலத்தில் தொடரும் நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַל עֵין הַמָּיִם
  choice: நீரூற்றருகே
  rationale: עֵין என்பது இங்கு கிணற்றைவிடத் துல்லியமாக இயற்கையான நீரூற்று அல்லது நீராதாரத்தைக் குறிக்கிறது.
- source_word: וְהָיָה
  choice: எந்த ... சொல்வேனோ
  rationale: அடுத்த வசனத்தில் நிறைவடையும் வேண்டுதல் சார்ந்த நிபந்தனை அமைப்பை தமிழில் இயல்பான தொடர்புத் தொடராகக் காட்டுகிறது; இவ்வசனம் தனியாக முழுமையடையாததையும் காக்கிறது.
- source_word: הָעַלְמָה
  choice: இளம்பெண்
  rationale: திருமண வயதுடைய இளம் பெண்ணைக் குறிக்கிறது; இந்தச் சொல் தனியாகக் கன்னித்தன்மையை வெளிப்படையாகக் கூறுவதில்லை.
- source_word: לִשְׁאֹב
  choice: தண்ணீர் மொள்ள
  rationale: நீரை ஒரு பாத்திரத்தில் எடுக்கும் செயலைத் தமிழில் இயல்பாகவும் சூழலுக்கேற்றவாறும் தெரிவிக்கிறது.
- source_word: הַשְׁקִינִי נָא
  choice: தயவுசெய்து ... எனக்குக் குடிக்கக் கொடு
  rationale: שקה என்பதன் காரணவினைப் பொருளான ‘குடிக்கக் கொடு’ என்பதையும் נָא-வின் பணிவான வேண்டுகோளையும் தெளிவாகக் காக்கிறது.
- source_word: מְעַט מַיִם מִכַּדֵּךְ
  choice: உன் குடத்திலிருந்து கொஞ்சம் தண்ணீர்
  rationale: அளவையும் நீர் எடுக்கப்படும் பாத்திரத்தையும் நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: עַלְמָה என்பதன் மொழிபெயர்ப்பு
  choice: இளம்பெண்
  alternative: கன்னிப்பெண்; மணமகள் வயதுடைய இளம்பெண்
  rationale: இச்சூழலில் எபிரெயச் சொல் இளம், திருமண வயதுடைய பெண்ணைக் குறிக்கிறது; அது தனக்குள் கன்னித்தன்மையைத் திட்டவட்டமாக வலியுறுத்தாததால், பிரதான உரையில் அதைவிட வலுவான இறையியல் முடிவைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனை வாக்கியத்தின் முதல் பகுதியாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘நீரூற்று’ என்பது மூலத்தின் עֵין என்பதைக் ‘கிணறு’ என்பதைக் காட்டிலும் துல்லியமாகப் பிரதிபலிக்கிறது.
