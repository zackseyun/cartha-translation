  text: Look[a], I am standing by the spring of water, and let it be that the young woman who comes out to draw, to whom I say[b], ‘Please let me drink a little water from your jar,’
translation:
  language: ta
  text: இதோ, நான் நீரூற்றருகே நிற்கிறேன். தண்ணீர் எடுக்க வருகிற இளம்பெண்ணிடம்[a], ‘தயவுசெய்து உன் குடத்திலிருந்து எனக்குக் கொஞ்சம் தண்ணீர் குடிக்கக் கொடு’ என்று நான் சொல்வேனோ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் திருமண வயதுடைய ஓர் இளம்பெண்ணைக் குறிக்கிறது; அது தனியாக ‘கன்னிப்பெண்’ என்று வெளிப்படையாகப் பொருள்படுவதில்லை.
