  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֵלָ֔י/ו גַּם תֶּ֥בֶן גַּם מִסְפּ֖וֹא רַ֣ב עִמָּ֑/נוּ גַּם מָק֖וֹם לָ/לֽוּן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/025.yaml
  text: Then she said to him[a], “We have plenty of both straw and fodder, and also a place to spend the night.”
translation:
  language: ta
  text: அப்போது அவள் அவனிடம், “எங்களிடம் வைக்கோலும் கால்நடைத் தீவனமும் ஏராளமாக இருக்கின்றன; இரவு தங்குவதற்கு இடமும் இருக்கிறது” என்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: மேலும் அவள் ... என்றாள்
  rationale: தொடர்ந்து அவள் கூறிய இன்னொரு செய்தியை வாவ்-தொடர்ச்சியுடன் இயல்பான தமிழ் கதைநடையில் வெளிப்படுத்துகிறது.
- source_word: אֵלָיו
  choice: அவனிடம்
  rationale: முன்னிடைச்சொல்லையும் ஆண்பால் ஒருமை பின்னொட்டையும் நேரடியாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: גַּם ... גַּם ... גַּם
  choice: '...உம் ...உம்; ... இடமும்'
  rationale: மீண்டும் வரும் גַּם பட்டியலின் சேர்க்கை மற்றும் வலியுறுத்தலைத் தமிழின் இணைப்பும்மை மூலம் இயல்பாகப் பாதுகாக்கிறது.
- source_word: תֶּבֶן
  choice: வைக்கோல்
  rationale: கால்நடைகளுக்கான வசதிகள் பேசப்படும் சூழலில் தெளிவான, பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: מִסְפּוֹא
  choice: கால்நடைத் தீவனம்
  rationale: இது விலங்குகளுக்கான உணவைக் குறிக்கிறது; ‘தீவனம்’ என்பதன் பொருளை ‘கால்நடை’ தெளிவுபடுத்துகிறது.
- source_word: רַב
  choice: ஏராளமாக
  rationale: கிடைக்கிற பொருட்களின் மிகுதியை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: עִמָּנוּ
  choice: எங்களிடம் ... இருக்கின்றன
  rationale: சொல்லுக்குச் சொல் ‘எங்களுடன்’ என்றாலும், உடைமை அல்லது கையிருப்பை இச்சூழலில் தமிழில் இயல்பாக ‘எங்களிடம்’ என்று கூறுவது பொருளைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: מָקוֹם
  choice: இடம்
  rationale: குறிப்பிட்ட ஓர் அறை என்று வரையறுக்காமல், எபிரெயச் சொல்லின் பொதுவான பொருளைப் பாதுகாக்கிறது.
- source_word: לָלוּן
  choice: இரவு தங்குவதற்கு
  rationale: இரவைத் தங்கிக் கழிப்பது என்ற வினையின் பொருளை நவீன தமிழில் இயல்பாக வழங்குகிறது.
