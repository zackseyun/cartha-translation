translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் அதேவேளை கண்ணியமான கதைநடை. எபிரெய மூலத்தின் சேர்த்துச் சொல்லும் அமைப்பு இணைப்பும்மை வழியாகத் தக்கவைக்கப்பட்டுள்ளது; தேவையற்ற விளக்கமோ குறிப்பிட்ட தங்குமிட வகையோ சேர்க்கப்படவில்லை.
