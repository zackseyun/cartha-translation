source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בּ֖וֹא בְּר֣וּךְ יְהוָ֑ה לָ֤/מָּה תַעֲמֹד֙ בַּ/ח֔וּץ וְ/אָנֹכִי֙ פִּנִּ֣יתִי הַ/בַּ֔יִת וּ/מָק֖וֹם לַ/גְּמַלִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/031.yaml
  text: And he said[a], “Come in, blessed of Yahweh. Why do you stand outside? I have prepared the house, and a place for the camels.”
translation:
  language: ta
  text: அவன், “யாவேவால் ஆசீர்வதிக்கப்பட்டவரே, உள்ளே வாருங்கள். ஏன் வெளியே நிற்கிறீர்கள்? நான் வீட்டில் இடம் ஒழுங்குபடுத்தியுள்ளேன்; ஒட்டகங்களுக்கும் இடம் ஏற்பாடு செய்துள்ளேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவன் … என்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; பேசுபவரைக் குறிக்கும் ஆண்பால் ஒருமை வடிவத்தையும் காக்கிறது.
- source_word: בּוֹא
  choice: உள்ளே வாருங்கள்
  rationale: விருந்தோம்பல் சூழலில் இந்தக் கட்டளை வீட்டுக்குள் வருவதைக் குறிக்கிறது; மரியாதைப் பன்மை தமிழில் இயல்பான அழைப்பாக உள்ளது.
- source_word: בְּרוּךְ יְהוָה
  choice: யாவேயின் ஆசிபெற்றவரே
  rationale: செயப்பாட்டு வினையெச்சம் இங்கு விளிப்பாகச் செயல்படுகிறது. இந்தத் தேர்வு யாவேவுடனான தொடர்பையும் ஆசிபெற்ற நிலையையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לָמָּה תַעֲמֹד בַּחוּץ
  choice: ஏன் வெளியே நிற்கிறீர்கள்?
  rationale: நேரடிக் கேள்வியையும் עמד என்பதன் நிற்றல்/தங்கியிருத்தல் சார்ந்த அடிப்படைப் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: פִּנִּיתִי
  choice: ஆயத்தப்படுத்தியிருக்கிறேன்
  rationale: வினைச்சொல்லின் அடிப்படை உணர்வு இடத்தை அகற்றி ஒழுங்குசெய்து தயாராக்குதல்; இவ்விருந்தோம்பல் சூழலில் அதன் விளைவைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: הַבַּיִת
  choice: வீட்டை
  rationale: வசிப்பிடத்தைக் குறிக்கும் நேரடியான, வழக்கமான தமிழ் சொல்.
- source_word: וּמָקוֹם לַגְּמַלִּים
  choice: ஒட்டகங்களுக்கான இடத்தையும்
  rationale: ஒட்டகங்களைத் தங்கவைக்கவோ கட்டிவைக்கவோ இடம் என்பதைக் கூடுதலாக விளக்காமல், மூலத்தின் பொதுவான சொல்லாட்சியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: בְּרוּךְ יְהוָה என்பதில் ஆசீர்வாதத்தின் தொடர்பு
  choice: யாவேயின் ஆசிபெற்றவரே
  alternative: யாவேவால் ஆசீர்வதிக்கப்பட்டவரே
  rationale: எபிரெய வடிவம் ஆசிபெற்ற நபரை விளித்து அழைக்கிறது; தமிழ் முதன்மை உரை அதன் சுருக்கத்தையும் விளிப்பு இயல்பையும் காக்கிறது. மாற்று வடிவம் யாவேயைச் செய்பவராக இன்னும் வெளிப்படையாகக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் dignified ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. விருந்தோம்பல் சூழலுக்கேற்ற மரியாதைப் பன்மையான “வாருங்கள்/நிற்கிறீர்கள்” பயன்படுத்தப்பட்டுள்ளது; இது எபிரெய ஒருமையை எண்ணிக்கையில் மாற்றுவதல்ல, தமிழ் மரியாதை வழக்கை பிரதிபலிப்பதாகும்.
