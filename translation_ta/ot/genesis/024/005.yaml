base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/005.yaml
  text: And the servant said to him[a], “Perhaps the woman will not be willing to follow me to this land[b]. Should I then take your son back to the land from which you came?”
translation:
  language: ta
  text: வேலைக்காரன் அவரிடம், “ஒருவேளை அந்தப் பெண் என்னைப் பின்தொடர்ந்து[a] இந்த நாட்டிற்கு வர விரும்பாவிட்டால், நீங்கள் புறப்பட்டுவந்த நாட்டிற்கு உங்கள் மகனை நான் திரும்பக் கொண்டுபோக வேண்டுமா?[b]” என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “எனக்குப் பின்னால் செல்ல.”
    reason: lexical_alternative
  - marker: b
    text: ‘திரும்பக் கொண்டுபோக’ என்ற வினை எபிரெயத்தில் வலியுறுத்தும் அமைப்பில் உள்ளது. இதை, “உங்கள் மகனை நான் உண்மையிலேயே திரும்பக் கொண்டுபோக வேண்டுமா?” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: வேலைக்காரன்
  rationale: עֶבֶד என்பதற்கு ‘அடிமை’ அல்லது ‘பணியாளர்’ என்ற பொருள்களும் உண்டு. இக்கதைச் சூழலில் ஆபிரகாமின் வீட்டில் பொறுப்புடன் பணியாற்றும் கீழ்நிலை நபரைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல் ‘வேலைக்காரன்’.
- source_word: אוּלַי
  choice: ஒருவேளை
  rationale: நிகழக்கூடிய ஐயப்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא תֹאבֶה
  choice: வர விரும்பாவிட்டால்
  rationale: אָבָה குறிக்கும் மனவிருப்பம் அல்லது சம்மதத்தைப் பாதுகாக்கிறது. இலக்கில் செல்லும் பொருள் அடுத்த சொற்றொடருடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: எபிரெய உரை வயதையோ வருங்கால மனைவி என்ற நிலையையோ வெளிப்படையாகச் சேர்க்காமல் ‘அந்தப் பெண்’ என்று மட்டுமே குறிப்பிடுகிறது.
- source_word: לָלֶכֶת אַחֲרַי
  choice: என்னைப் பின்தொடர்ந்து
  rationale: சொல்லாட்சியில் ‘எனக்குப் பின்னால் செல்ல’ என்பதைக் குறிக்கும்; தமிழில் ‘என்னைப் பின்தொடர்ந்து’ என்பது திசைசார்ந்த கருத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: אֶל הָאָרֶץ הַזֹּאת
  choice: இந்த நாட்டிற்கு
  rationale: אֶרֶץ இங்கு ஒரு பிரதேசம் அல்லது நாட்டைக் குறிக்கிறது; நவீனத் தமிழில் இச்சூழலுக்கு ‘நாடு’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הֶהָשֵׁב אָשִׁיב
  choice: நான் திரும்பக் கொண்டுபோக வேண்டுமா?
  rationale: שוב வினையின் வலியுறுத்தப்பட்ட அமைப்பு திரும்ப அழைத்துச் செல்வதைப் பற்றிய ஆலோசனைக் கேள்வியாக உள்ளது. ‘வேண்டுமா?’ கட்டாயத்தை உறுதிப்படுத்தாமல் அந்தக் கேள்வித் தன்மையைப் பாதுகாக்கிறது; வலியுறுத்தல் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: אֶת בִּנְךָ
  choice: உங்கள் மகனை
  rationale: நேரடியான பொருளை நவீன மரியாதைத் தமிழில் வழங்குகிறது.
- source_word: אֶל הָאָרֶץ אֲשֶׁר יָצָאתָ מִשָּׁם
  choice: நீங்கள் புறப்பட்டுவந்த நாட்டிற்கு
  rationale: יָצָא என்பதன் ‘புறப்பட்டுச் செல்லுதல்’ என்ற அடிப்படை உணர்வையும், இப்போது பேசப்படும் இடத்தை நோக்கிய வருகையையும் சுருக்கமாகப் பாதுகாக்கிறது.
