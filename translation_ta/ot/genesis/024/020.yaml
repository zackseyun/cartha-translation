translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் விரைவான தொடர் நடவடிக்கைகள் தமிழில் இயல்பாக ஒலிக்கும்படி இணைக்கப்பட்டுள்ளன; ‘மொள்ள’ என்பது கிணற்றிலிருந்து தண்ணீர் எடுக்கும் செயலுக்கான துல்லியமான சொலாகத் தேர்ந்தெடுக்கப்பட்டது.
