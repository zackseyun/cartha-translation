base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/020.yaml
  text: She quickly emptied her jar into the trough[a], and ran again to the well to draw water, and drew for all his camels.
translation:
  language: ta
  text: அவள் விரைந்து தன் குடத்திலிருந்த தண்ணீரைத் தொட்டியில் ஊற்றிவிட்டு[a], தண்ணீர் எடுக்க மறுபடியும் கிணற்றுக்கு ஓடினாள்; அவனுடைய எல்லா ஒட்டகங்களுக்கும் தண்ணீர் எடுத்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் குடத்தைத் தொட்டியில் காலியாக்கிவிட்டு.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: அவள் விரைந்து
  rationale: இந்த வினைச்சொல் அவள் தாமதமின்றி வேகமாகச் செயல்பட்டதைச் சுட்டுகிறது; ‘விரைந்து’ என்பது இயல்பான, கண்ணியமான நவீனத் தமிழ்.
- source_word: וַתְּעַר כַּדָּהּ
  choice: தன் குடத்திலிருந்த தண்ணீரை ... ஊற்றிவிட்டு
  rationale: ערה என்பது இங்கு குடத்தின் உள்ளடக்கத்தை ஊற்றிக் காலியாக்குவதைக் குறிக்கிறது. தமிழில் குடத்தையே ‘ஊற்றினாள்’ என்று சொல்வதைவிட அதன் தண்ணீரை ஊற்றினாள் என்பது இயல்பாகவும் பொருள்தெளிவுடனும் உள்ளது.
- source_word: כַּדָּהּ
  choice: தன் குடம்
  rationale: כַּד என்பது தண்ணீர் எடுத்து வரப் பயன்படும் குடம் அல்லது கலம்; இச்சூழலில் ‘குடம்’ என்பது சாதாரண வாசகருக்கு உடனடியாகப் புரியும் சொல்.
- source_word: הַשֹּׁקֶת
  choice: தொட்டி
  rationale: இந்தப் பெயர்ச்சொல் விலங்குகளுக்குத் தண்ணீர் வைக்கும் தொட்டியைக் குறிக்கிறது. ஒட்டகங்கள் குறிப்பிடப்படுவதால் ‘தொட்டி’ என்ற சுருக்கமான வடிவே சூழலில் தெளிவாக உள்ளது.
- source_word: וַתָּרָץ עוֹד
  choice: மறுபடியும் ... ஓடினாள்
  rationale: רוץ ஓடுதலையும் עוֹד செயல் மீண்டும் நிகழ்ந்ததையும் குறிக்கின்றன; தமிழ் வாக்கிய ஒழுங்கில் இவ்வமைப்பு இரண்டையும் தெளிவாகக் காக்கிறது.
- source_word: הַבְּאֵר
  choice: கிணறு
  rationale: בְּאֵר என்பதன் இக்கதைச்சூழலுக்குப் பொருத்தமான வழக்கமான பொருள் ‘கிணறு’.
- source_word: לִשְׁאֹב
  choice: தண்ணீர் மொள்ள
  rationale: கிணற்றிலிருந்து தண்ணீரை எடுக்கும் செயலை שאב குறிக்கிறது; ‘தண்ணீர் மொள்ள’ என்பது இச்செயலுக்கான துல்லியமான, இயல்பான தமிழ்.
- source_word: וַתִּשְׁאַב
  choice: தண்ணீர் மொண்டாள்
  rationale: முன்னர் வந்த அதே வினை மீண்டும் பயன்படுத்தப்பட்டிருப்பதைத் தமிழிலும் காக்கிறது; எல்லா ஒட்டகங்களுக்கும் தேவையான தண்ணீரை எடுத்த செயலை நேரடியாகக் கூறுகிறது.
- source_word: לְכָל גְּמַלָּיו
  choice: அவனுடைய ஒட்டகங்கள் எல்லாவற்றுக்கும்
  rationale: כָּל வெளிப்படுத்தும் முழுமையைப் பாதுகாத்து, தண்ணீர் யாருக்காக மொள்ளப்பட்டது என்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
