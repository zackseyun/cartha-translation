- from: அவள் விரைந்து தன் குடத்திலிருந்த தண்ணீரைத் தொட்டியில் ஊற்றிவிட்டு[a], தண்ணீர் மொள்ள மறுபடியும் கிணற்றுக்கு ஓடினாள்; அவனுடைய ஒட்டகங்கள் எல்லாவற்றுக்கும் தண்ணீர் மொண்டாள்.
  to: அவள் விரைந்து தன் குடத்திலிருந்த தண்ணீரைத் தொட்டியில் ஊற்றிவிட்டு[a], தண்ணீர் எடுக்க மறுபடியும் கிணற்றுக்கு ஓடினாள்; அவனுடைய எல்லா ஒட்டகங்களுக்கும் தண்ணீர் எடுத்தாள்.
