  source_fidelity: 'மூல எபிரெய உரையின் தொடர்ச்சியும் பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: ரெபெக்காள் பணியாளனிடம் அடையாளம் கேட்கிறாள்; வயலில் அவர்களைச் சந்திக்க நடந்துவரும் மனிதரைக் குறிப்பிடுகிறாள்; பணியாளன் அவரைத் தன் மனித எஜமான் என அடையாளப்படுத்துகிறான்; பின்னர் அவள் முக்காட்டால் தன்னை மூடிக்கொள்கிறாள். “அந்த” என்பது הַלָּזֶה என்பதற்கான சூழலுக்கேற்ற தெரிவாகும்; அடிக்குறிப்பு “இந்த” என்ற சாத்தியத்தையும் முறையாகப் பாதுகாக்கிறது.'
