base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/065.yaml
  text: And she said to the servant[a], “Who is this man walking in the field to meet us?” And the servant said[c][b], “He is my master.” Then she took the veil and covered herself.
translation:
  language: ta
  text: அவள் அந்தப் பணியாளனிடம், “நம்மைச் சந்திக்க வயல்வெளியில் நடந்துவருகிற அந்த மனிதர்[a] யார்?” என்று கேட்டாள். அதற்குப் பணியாளன், “அவர் என் எஜமான்[b]” என்றான். அப்போது அவள் முக்காட்டை எடுத்து, தன்னை மூடிக்கொண்டாள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்த மனிதர்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சுட்டுச்சொல் கண்ணுக்குத் தெரியும் ஒருவரைச் சுட்டுகிறது; தமிழில் இடச்சூழலைப் பொறுத்து “அந்த” அல்லது “இந்த” எனக் கூறலாம்.
    reason: lexical_alternative
  - marker: b
    text: “என் ஆண்டவர்” என்றும் மொழிபெயர்க்கலாம். இங்கு எபிரெயச் சொல் பணியாளனின் மனித எஜமானைக் குறிக்கிறது; கடவுளுக்குரிய பட்டத்தை அல்ல.
    reason: lexical_alternative
  - marker: c
    text: '“முக்காடிட்டுக்கொண்டாள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை தற்சுட்டுப் பொருளுடையது: அவள் முக்காட்டை எடுத்து அதனால் தன்னை மூடிக்கொண்டாள்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: பணியாளன்
  rationale: עֶבֶד என்பது பணியாளர் அல்லது அடிமை எனப் பொருள்படலாம். இச்சூழலில் ஆபிரகாமின் வீட்டுப் பொறுப்பை மேற்கொண்டவரைக் குறிக்க இயல்பான நவீனத் தமிழில் ‘பணியாளன்’ பொருத்தமானது; அவரது சமூக நிலையைத் தேவையின்றி மறைப்பதோ மிகைப்படுத்துவதோ இல்லை.
- source_word: הַלָּזֶה
  choice: அந்த
  rationale: கண்ணுக்குத் தெரிந்து சற்றுத் தொலைவில் வயல்வெளியில் வந்துகொண்டிருக்கும் மனிதரைச் சுட்டுவதால் தமிழில் ‘அந்த’ என்பது இயல்பான இடச்சுட்டு.
- source_word: הַהֹלֵךְ בַּשָּׂדֶה לִקְרָאתֵנוּ
  choice: நம்மைச் சந்திக்க வயல்வெளியில் நடந்துவருகிற
  rationale: הֹלֵךְ என்பதன் தொடர்நிலைச் செயலை ‘நடந்துவருகிற’ என்றும், לִקְרָאתֵנוּ என்பதன் அவர்களை நோக்கிய சந்திப்பு இயக்கத்தை ‘நம்மைச் சந்திக்க’ என்றும் தனித்தனியாகப் பாதுகாக்கிறது.
- source_word: הוּא אֲדֹנִי
  choice: அவர் என் எஜமான்
  rationale: மரியாதைக்குரிய மனித எஜமானைச் சுட்டும் இவ்விடத்தில் ‘அவர்’ இயல்பான தமிழ்மரியாதையை வழங்குகிறது; ‘எஜமான்’ பணியாளர்–எஜமான் உறவைத் தெளிவாகக் கூறுகிறது, தெய்வீகப் பட்டத்தைப் புகுத்தவில்லை.
- source_word: הַצָּעִיף
  choice: முக்காடு
  rationale: பெண் தன்னை மூடிக்கொள்ளப் பயன்படுத்தும் ஆடை அல்லது முகமூடுதுணியை இச்சூழலில் ‘முக்காடு’ தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: וַתִּתְכָּס
  choice: தன்னை மூடிக்கொண்டாள்
  rationale: எபிரெய வினையின் தற்சுட்டுப் பொருளைப் பாதுகாத்து, அவள் எடுத்த முக்காட்டால் தன்னையே மூடிக்கொண்டதைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֲדֹנִי என்பதன் மனித அல்லது தெய்வீக குறிப்பு
  choice: என் எஜமான்
  alternative: என் ஆண்டவர்
  rationale: பேசுபவர் ஈசாக்கின் குடும்பப் பணியாளர்; ஆகவே இங்கு சொல் மனித எஜமானைக் குறிக்கிறது. ‘ஆண்டவர்’ தெய்வீகப் பட்டமாகப் புரிந்துகொள்ளப்படும் வாய்ப்புள்ளதால் தவிர்க்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் சாதாரண வாசகர்களுக்கும் உடனடியாகப் புரியும் நடையில் வடிவமைக்கப்பட்டது. ‘நடந்துவருகிற’ என்பது காட்சியின் இயக்கத்தையும், ‘அவர்’ என்பது இயல்பான மனித மரியாதையையும் தக்கவைக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின்னர் முதன்மை உரையில் இடப்பட்டுள்ளன.
