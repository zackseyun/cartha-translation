  text: וַ/יֹּאמַ֓ר יְהוָ֗ה אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם הַקְרֵה נָ֥א לְ/פָנַ֖/י הַ/יּ֑וֹם וַ/עֲשֵׂה חֶ֕סֶד עִ֖ם אֲדֹנִ֥/י אַבְרָהָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/012.yaml
  text: And he said[a], “O Yahweh, God of my master Abraham, please grant success before me today[c][b], and show steadfast love to my master Abraham.”
translation:
  language: ta
  text: அவன், “என் எஜமானாகிய ஆபிரகாமின் கடவுளான யாவே, இன்று எனக்கு வெற்றி அருளும்[a]; என் எஜமானாகிய ஆபிரகாமுக்கு நிலையான அன்பைக் காட்டும்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இன்று அதை என் முன்னே நிகழச் செய்து.” விரும்பிய சந்திப்பை யாவே ஏற்படுத்த வேண்டும் என்பதே எபிரெய வினையின் கருத்து.
    reason: lexical_alternative
  - marker: b
    text: “நிலையான அன்பு” என்பதற்கான எபிரெயச் சொல் ஹெசெத் (חֶסֶד); இது மாறாத அன்பு, உண்மையுள்ள தயவு, உடன்படிக்கைப் பற்றுறுதி ஆகிய நுட்பங்களையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் இறைப்பெயரான YHWH-ஐ, அதன் தனிப்பெயர் தன்மையைப் பேணும் வகையில் ‘யாவே’ என்று ஒலிபெயர்த்துள்ளது.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: என் எஜமானாகிய ஆபிரகாமின் கடவுள்
  rationale: பேசுகிறவன் ஆபிரகாமின் பணியாளன் என்பதால் אֲדֹנִי என்பதற்கு இயல்பான உறவுசார் சொல்லாக ‘என் எஜமான்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַקְרֵה נָא לְפָנַי הַיּוֹם
  choice: இன்று எனக்கு வெற்றி வாய்க்கச் செய்து
  rationale: קרה என்பதன் ஹிஃபில் கட்டளை வடிவம், விரும்பிய சந்திப்பை இறைவன் நிகழச் செய்ய வேண்டும் என்ற வேண்டுதலைக் குறிக்கிறது. ‘வெற்றி வாய்க்கச் செய்து’ என்பது சூழலின் நோக்கத்தையும் இறைச் செயலையும் இயல்பான தமிழில் எடுத்துரைக்கிறது; נָא-வின் பணிவான வேண்டுதல் வினைமுற்றின் வேண்டுகோள் அமைப்பில் வெளிப்படுகிறது.
- source_word: וַעֲשֵׂה חֶסֶד
  choice: உடன்பிறழாத அன்பைக் காட்டும்
  rationale: חֶסֶד என்பது சாதாரண இரக்கத்தைவிட உறுதியான பற்றும் நம்பகமான அன்பும் கொண்ட சொல். ‘உடன்பிறழாத அன்பு’ அதன் விசுவாசமான, நிலையான இயல்பைப் பேணுகிறது.
- source_word: עִם אֲדֹנִי אַבְרָהָם
  choice: என் எஜமானாகிய ஆபிரகாமுக்கு
  rationale: עִם என்பதன் அடிப்படைப் பொருள் ‘உடன்’ என்றாலும், ‘அன்பைக் காட்டு’ என்ற தமிழ் தொடருடன் இலக்காகும் நபரை ‘-க்கு’ வேற்றுமையில் குறிப்பிடுவது இயல்பானது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப் பட்டப்பெயராக மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: חֶסֶד என்பதன் பொருள் நுட்பம்
  choice: உடன்பிறழாத அன்பு
  alternative: தயவு / இரக்கம் / உடன்படிக்கைப் பற்றுறுதி
  rationale: இச்சொல்லின் அன்பு, நம்பகத்தன்மை, விசுவாசம் ஆகிய பரப்பைத் தக்கவைத்தபடி, ‘உடன்படிக்கை’ என்ற கருத்தை மூலத்தைவிட வெளிப்படையாக முதன்மை உரையில் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: הַקְרֵה என்பதில் இறைச் செயலுக்கும் வெற்றிக்கும் இடையிலான நுட்பம்
  choice: வெற்றி வாய்க்கச் செய்து
  alternative: அதை என் முன்னே நிகழச் செய்து
  rationale: சூழலில் வேண்டப்படுவது பணியின் வெற்றிக்குரிய சந்திப்பு. முதன்மை உரை அந்த நோக்கத்தை இயல்பாகத் தருகிறது; நிகழ்வை இறைவன் ஏற்படுத்தும் மூலத்தின் நேரடி நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேண்டுதல் தொனியும் கொண்ட நடை. ‘எஜமான்’ பணியாளர்–ஆபிரகாம் உறவைத் தெளிவாக்குகிறது. இறுதி ‘காட்டும்’ என்பது தமிழில் பணிவான வேண்டுகோளை வெளிப்படுத்தும் இலக்கிய-பொதுநடை வடிவம்.
