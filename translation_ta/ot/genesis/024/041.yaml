source:
  edition: WLC
  text: אָ֤ז תִּנָּקֶה֙ מֵ/אָ֣לָתִ֔/י כִּ֥י תָב֖וֹא אֶל מִשְׁפַּחְתִּ֑/י וְ/אִם לֹ֤א יִתְּנוּ֙ לָ֔/ךְ וְ/הָיִ֥יתָ נָקִ֖י מֵ/אָלָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/041.yaml
  text: Then you will be free from my oath when you come to my family; and if they do not give to you[a], you will be free from my oath.
translation:
  language: ta
  text: அப்போது, நீ என் குடும்பத்தாரிடம் செல்லும்போது என் சத்தியத்திலிருந்து[a] விடுபடுவாய்; அவர்கள் உனக்குக் கொடுக்காவிட்டால், என் சத்தியத்திலிருந்து விடுபடுவாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் சாபத்திலிருந்து”; எபிரேயச் சொல், சாபம் அல்லது தண்டனை இணைந்த ஒரு சத்தியத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּנָּקֶה / נָקִי
  choice: விடுபடுவாய்
  rationale: இங்கு இச்சொற்கள் பொதுவான ஒழுக்கக் குற்றமின்மையை அல்ல, ஆணையுறுதியால் ஏற்பட்ட கடமை அல்லது பொறுப்பிலிருந்து விடுவிக்கப்படுவதைக் குறிக்கின்றன. இரு இடங்களிலும் ஒரே சொல்லாக்கம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: מֵאָלָתִי
  choice: என் ஆணையுறுதியிலிருந்து
  rationale: אָלָה என்பது சாபம் அல்லது தண்டனை மறைமுகமாக இணைந்த ஆணையுறுதியைக் குறிக்கலாம். இச்சூழலில் ஆபிரகாம் ஊழியர்மேல் வைத்த உறுதிப்பாட்டுக் கடமையே முன்னிலையில் இருப்பதால், ‘ஆணையுறுதி’ முதன்மை மொழிபெயர்ப்பாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: כִּי
  choice: செல்லும்போது
  rationale: இங்கு כִּי காலத்தையும் நிபந்தனைச் சூழலையும் சுட்டக்கூடும். ‘செல்லும்போது’ என்பது சூழலில் இயல்பாக இருந்து, நிபந்தனைத் தன்மையை அளவுக்கு மீறித் தீர்மானிக்காமல் விடுகிறது.
- source_word: תָבֹא אֶל־מִשְׁפַּחְתִּי
  choice: நீ என் குடும்பத்தாரிடம் செல்லும்போது
  rationale: מִשְׁפָּחָה விரிந்த குடும்பத்தையோ குலத்தாரையோ குறிக்கிறது. நவீன தமிழில் ‘குடும்பத்தார்’ உறவினரைக் கூட்டாக இயல்பாகக் குறிக்கிறது.
- source_word: וְאִם לֹא יִתְּנוּ לָךְ
  choice: அவர்கள் உனக்குக் கொடுக்காவிட்டாலும்
  rationale: எபிரேயத்தில் கொடுக்கப்படும் பொருள் வெளிப்படையாகக் கூறப்படவில்லை; சூழலில் அது மணப்பெண்ணைக் குறிக்கிறது. தமிழிலும் செயப்படுபொருளை விடுவது இயல்பாகவும் மூலத்தின் மறைமுகத்தன்மையைப் பாதுகாப்பதாகவும் உள்ளது.
theological_decisions:
- issue: ஆணையுறுதிச் சூழலில் אָלָה என்பதன் பொருள்
  choice: ஆணையுறுதி
  alternative: சாபம்
  rationale: இச்சொல்லில் ஆணையுறுதியுடன் இணைந்த சாபம் அல்லது தண்டனையின் கருத்து இருக்கலாம். எனினும் இவ்வசனத்தின் முதன்மைக் கவனம் ஊழியர் ஏற்றுக்கொண்ட உறுதிப்பாட்டுக் கடமையிலிருந்து விடுபடுவதில் இருப்பதால், ‘ஆணையுறுதி’ முதன்மை உரையில் வைக்கப்பட்டு, ‘சாபம்’ அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தில் மறைந்துள்ள செயப்படுபொருள் தமிழிலும் சேர்க்கப்படவில்லை; ஆணையுறுதி–சாபம் என்ற பொருள் நுணுக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
