translation_notes:
  register: மொழிநடை நவீனத் தரத்தமிழாகவும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதாகவும் வைக்கப்பட்டுள்ளது. மூலத்தின் ‘நகரத்து ஆண்களின் மகள்கள்’ என்ற சற்றே அசாதாரணமான சொல்லாட்சி பொருள் இழக்காமல் பிரதான உரையில் தக்கவைக்கப்பட்டு, அதன் இயல்பான சமூகப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
