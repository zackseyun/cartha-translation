  edition: WLC
  text: הִנֵּ֛ה אָנֹכִ֥י נִצָּ֖ב עַל עֵ֣ין הַ/מָּ֑יִם וּ/בְנוֹת֙ אַנְשֵׁ֣י הָ/עִ֔יר יֹצְאֹ֖ת לִ/שְׁאֹ֥ב מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/013.yaml
  text: Look[a], I am standing by the spring of water[c][b], and the daughters of the men of the city are coming out to draw water.
translation:
  language: ta
  text: இதோ, நான் நீரூற்றின்[a] அருகில் நிற்கிறேன்; நகரத்து ஆண்களின் மகள்கள்[b] தண்ணீர் எடுக்க வெளியே வருகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீரூற்று’ என்பதற்கு ‘நீர் ஊறும் இடம்’ என்றும் பொருள் கொள்ளலாம். இங்கு வரும் எபிரெயச் சொல் வழக்கமாக ‘கிணறு’ என்பதற்குப் பயன்படுத்தப்படும் சொல்லல்ல.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘நகரத்து ஆண்களின் மகள்கள்’; இது அந்த நகரின் இளம் பெண்களைக் குறிக்கும் குடும்பம் சார்ந்த சமூகச் சொல்லாட்சி.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: உடனிருக்கும் காட்சியின்மீது கவனத்தைத் திருப்பும் சுட்டிடைச்சொல்லின் உயிரோட்டத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: אָנֹכִי
  choice: நான்
  rationale: தனித்த முதலாம் நபர் பெயர்ச்சொல்லை இயல்பாகத் தருகிறது; தேவையில்லாத வலியுறுத்தலைச் சேர்க்கவில்லை.
- source_word: נִצָּב
  choice: நிற்கிறேன்
  rationale: இச்சூழலில் நிகழ்கால நிலைப்பாட்டைக் குறிக்கும் நிஃபால் வினையெச்சத்தின் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל עֵין הַמָּיִם
  choice: நீரூற்றின் அருகில்
  rationale: עַל இங்கு நீராதாரத்துக்கு அருகிலுள்ள இடத்தைக் குறிக்கிறது; עֵין הַמָּיִם வழக்கமான ‘கிணறு’ என்பதல்ல, இயற்கையாக ஊறும் நீராதாரம்.
- source_word: וּבְנוֹת אַנְשֵׁי הָעִיר
  choice: நகரத்து ஆண்களின் மகள்கள்
  rationale: எபிரெய உரையின் குடும்பத்தொடர்புள்ள சமூகச் சொல்லாட்சியையும் אַנְשֵׁי என்பதிலுள்ள ஆண்பால் குறிப்பையும் தக்கவைக்கிறது.
- source_word: יֹצְאֹת
  choice: வெளியே வருகிறார்கள்
  rationale: பெண்பால் பன்மை நிகழ்நிலை வினையெச்சம் குறிக்கும் நடந்துகொண்டிருக்கும் அல்லது உடனடியாக நிகழும் செயலை, நீரூற்றருகே நிற்பவரின் பார்வையிலிருந்து தருகிறது.
- source_word: לִשְׁאֹב מָיִם
  choice: தண்ணீர் எடுக்க
  rationale: நீராதாரத்திலிருந்து தண்ணீர் முகந்து கொண்டுவரும் செயலைப் பொதுவாகவும் இயல்பாகவும் புரியத்தக்க நவீனத் தமிழில் கூறுகிறது.
