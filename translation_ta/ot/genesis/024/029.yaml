  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் இரட்டை אֶל கட்டமைப்பு தமிழில் இயல்பாக அமைய முதன்மை உரையில் இடவுறவாக வழங்கப்பட்டு, அதன் மாற்றுப் புரிதல் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
