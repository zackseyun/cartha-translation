base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/029.yaml
  text: Rebekah had a brother[a], and his name was Laban; and Laban ran out to the man[b], outside by the spring.
translation:
  language: ta
  text: ரெபெக்காளுக்கு ஒரு சகோதரன் இருந்தான்; அவன் பெயர் லாபான். லாபான் வெளியே, நீரூற்றருகே இருந்த அந்த மனிதனிடம் ஓடினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அந்த மனிதனிடம், வெளியே, நீரூற்றிடம் ஓடினான்.” மாற்றாக, இரண்டாவது சொற்றொடரை நேரடியாக வைத்து, “அந்த மனிதனிடமும் நீரூற்றிடமும் ஓடினான்” என்றும் புரிந்துகொள்ளலாம்.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וּ/לְ/רִבְקָה אָח
  choice: ரெபெக்காளுக்கு ஒரு சகோதரன் இருந்தான்
  rationale: எபிரெய மொழியின் ‘ரெபெக்காளுக்கு ஒரு சகோதரன்’ என்ற உடைமை/இருப்பு மரபுத்தொடரை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּ/שְׁמ/וֹ לָבָן
  choice: அவன் பெயர் லாபான்
  rationale: பெயரை அறிமுகப்படுத்தும் எபிரெய மரபுத்தொடரைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַ/יָּרָץ לָבָן
  choice: லாபான் ... ஓடினான்
  rationale: וַיָּרָץ என்பதன் அடிப்படைப் பொருளான ‘ஓடினான்’ என்பதைக் காக்கிறது; வெளியே செல்லும் திசை அடுத்த சொல்லால் தெரிவிக்கப்படுகிறது.
- source_word: אֶל הָ/אִישׁ
  choice: அந்த மனிதனிடம்
  rationale: ஆபிரகாமின் ஊழியனைச் சுட்டினாலும், மூலத்தில் உள்ள பொதுப்பெயரான ‘மனிதன்’ என்பதையே மொழிபெயர்ப்பு காக்கிறது.
- source_word: הַ/ח֖וּצָ/ה
  choice: வெளியே
  rationale: வெளிப்புறத்தை நோக்கிய இயக்கத்தைச் சுட்டும் திசை வடிவத்தைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: אֶל הָ/עָיִן
  choice: நீரூற்றருகே
  rationale: עַיִן இங்கு கிணற்றை விட இயற்கையான நீரூற்றைக் குறிக்கிறது. தொடரிலுள்ள இரண்டாவது אֶל என்பதை, மனிதன் இருந்த இடத்துடன் தொடர்புபடுத்தி இயல்பான தமிழில் இடவுருபாக வழங்குகிறது; மூலத்தின் கட்டமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
