  yaml_path: translation/ot/genesis/024/046.yaml
  text: She quickly lowered her jar from her shoulder and said[a], ‘Drink, and I will also give water to your camels.’ So I drank, and she also gave water to the camels.
translation:
  language: ta
  text: அவள் விரைந்து தன் குடத்தைத் தோளிலிருந்து[a] இறக்கி, “குடியுங்கள்; உங்கள் ஒட்டகங்களுக்கும் தண்ணீர் கொடுப்பேன்” என்றாள். ஆகவே நான் குடித்தேன்; ஒட்டகங்களுக்கும் அவள் தண்ணீர் கொடுத்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்கு சொல், “அவள்மேலிருந்து.” இங்கு உடற்பகுதி வெளிப்படையாகக் குறிப்பிடப்படவில்லை; முந்தைய சூழல் குடம் அவளுடைய தோளில் இருந்ததைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: அவள் விரைந்து
  rationale: מהר என்பது விரைவாகச் செயல்படுவதைக் குறிக்கிறது. அடுத்த செயல்வினையுடன் ‘விரைந்து’ என இணைப்பது ரெபெக்காளின் உடனடி செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַתּוֹרֶד
  choice: இறக்கி
  rationale: இங்கு Hiphil வடிவிலுள்ள ירד, ஒன்றைக் கீழே கொண்டுவருதல் என்று பொருள்படும். குடத்தைத் தன் உடல்மேலிருந்து கீழே கொண்டுவந்த செயலை ‘இறக்கி’ தெளிவாகக் குறிக்கிறது.
- source_word: כַּדָּהּ
  choice: தன் குடத்தை
  rationale: כד என்பது தண்ணீர் எடுக்கப் பயன்படும் குடம் அல்லது ஜாடி. சூழலுக்கு இயல்பான தமிழ்ச் சொல் ‘குடம்’; உடைமை எழுவாயையே சார்வதால் ‘தன்’ பயன்படுத்தப்பட்டது.
- source_word: מֵעָלֶיהָ
  choice: தோளிலிருந்து[a]
  rationale: எபிரெயச் சொற்றொடர் சொல்லுக்கு சொல் ‘அவள்மேலிருந்து’ என்று மட்டுமே கூறி உடற்பகுதியைக் குறிப்பிடவில்லை. ஆனால் ஆதியாகமம் 24:45-இன் உடனடிச் சூழல் குடம் அவளுடைய தோளில் இருந்ததைத் தெளிவுபடுத்துவதால், இயல்பான தமிழில் ‘தோளிலிருந்து’ என மொழிபெயர்த்து, மூலத்தின் குறைந்த விவரத்தை அடிக்குறிப்பில் பாதுகாத்துள்ளோம்.
- source_word: שְׁתֵה
  choice: குடியுங்கள்
  rationale: இது நேரடியான கட்டளை. ஒருவரை மரியாதையுடன் அழைக்கும் நவீனத் தமிழுக்கு ‘குடியுங்கள்’ இயல்பாக அமைகிறது; பன்மை என்பது தமிழின் மரியாதை வழக்கு, பலரைச் சுட்டுவது அல்ல.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: உங்கள் ஒட்டகங்களுக்கும் தண்ணீர் கொடுப்பேன்
  rationale: Hiphil வடிவிலுள்ள שקה, குடிக்கக் கொடுத்தல் அல்லது தண்ணீர் வழங்குதல் என்று பொருள்படும். ‘தண்ணீர் கொடுப்பேன்’ என்பது செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וָאֵשְׁתְּ
  choice: ஆகவே நான் குடித்தேன்
  rationale: தொடர்கதை இணைப்பு, அவளுடைய அழைப்பைத் தொடர்ந்து வேலைக்காரன் குடித்ததைச் சொல்கிறது. ‘ஆகவே’ அந்த விளைவுத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְגַם הַגְּמַלִּים הִשְׁקָתָה
  choice: ஒட்டகங்களுக்கும் அவள் தண்ணீர் கொடுத்தாள்
  rationale: முந்தைய கூற்றிலுள்ள שקה என்பதற்குக் கொடுத்த அதே பொருளை இங்கும் பேணி, அவள் சொன்னதைச் செய்தாள் என்பதைத் தெளிவாகக் காட்டுகிறது.
