translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. நேரடி உரையில் ஒருவருக்கான மரியாதை வடிவமாக ‘குடியுங்கள்/உங்கள்’ பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயத்தில் உடற்பகுதி வெளிப்படையாக இல்லாத இடத்தின் உண்மையான நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
