source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אַל תְּאַחֲר֣וּ אֹתִ֔/י וַֽ/יהוָ֖ה הִצְלִ֣יחַ דַּרְכִּ֑/י שַׁלְּח֕וּ/נִי וְ/אֵלְכָ֖ה לַֽ/אדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/056.yaml
  text: But he said to them[a], “Do not delay me, since Yahweh has made my journey successful. Send me away so that I may go to my master.”
translation:
  language: ta
  text: ஆனால் அவன் அவர்களிடம், “என்னைத் தாமதப்படுத்தாதீர்கள். யாவே என் பயணத்தை[a] வெற்றிபெறச் செய்திருக்கிறார். நான் என் எஜமானிடம் போகும்படி என்னை அனுப்பிவிடுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “என் வழி”; இங்கே அது பணியாளனின் பயணத்தை அல்லது அவனுக்கு ஒப்படைக்கப்பட்ட பணியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: ஆனால் அவன் அவர்களிடம் … என்றான்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுத்தாலும், முந்தைய வசனத்தில் குடும்பத்தார் முன்வைத்த தாமதத்துக்கு இங்கு எதிர்மறையான பதில் வருவதால் ‘ஆனால்’ இயல்பாகப் பொருந்துகிறது.
- source_word: אַל תְּאַחֲרוּ אֹתִי
  choice: என்னைத் தாமதிக்கச் செய்யாதீர்கள்
  rationale: אַחַר என்பதன் ஹிஃபீல் வடிவம் ஒருவரைத் தாமதப்படுத்துதல் அல்லது தடுத்து வைத்தல் என்ற பொருள் தருகிறது; אַל உடன் இது தடைக் கட்டளையாக உள்ளது.
- source_word: וַיהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைபெயரான יהוה-ஐ பொதுப்பட்டப் பெயராக மாற்றாமல் தனிப்பெயராகத் தருகிறது.
- source_word: הִצְלִיחַ דַּרְכִּי
  choice: என் பயணத்தை வெற்றிபெறச் செய்திருக்கிறார்
  rationale: הִצְלִיחַ என்ற ஹிஃபீல் வடிவம் வெற்றியடையச் செய்தல் என்ற இறைச் செயற்பாட்டைக் காட்டுகிறது. דֶּרֶךְ என்பதன் நேரடிப் பொருள் ‘வழி’; இச்சூழலில் அது பணியாளனின் பயணம் அல்லது பணியைக் குறிக்கிறது.
- source_word: שַׁלְּחוּנִי
  choice: என்னை அனுப்பிவிடுங்கள்
  rationale: שלח என்பதன் பியேல் கட்டளை வடிவம், தன்னைப் புறப்பட அனுமதித்து அனுப்புமாறு கேட்பதை வெளிப்படுத்துகிறது.
- source_word: וְאֵלְכָה לַאדֹנִי
  choice: என் எஜமானிடம் நான் போகும்படி
  rationale: முதலாம் நபர் cohortative வடிவம் பேசுபவரின் நோக்கத்தைச் சுட்டுகிறது. אֲדֹנִי இங்கு மனித எஜமானான ஆபிரகாமைக் குறிக்கிறது; ஆகவே ‘எஜமான்’ என்று மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் நான்கு எழுத்துகளாலான இறைத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதனைப் பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. எபிரெயத் தொடரின் எதிர்மறைத் திருப்பம் ‘ஆனால்’ மூலம் காட்டப்பட்டுள்ளது; தேவையற்ற சமயமரபுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
