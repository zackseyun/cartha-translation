revisions:
- from: என்னிடம், ‘நீங்களும் குடியுங்கள்; உங்கள் ஒட்டகங்களுக்கும் தண்ணீர் இறைப்பேன்’ என்று சொல்லும் பெண்ணே, என் எஜமானுடைய மகனுக்காக யெகோவா நியமித்த பெண்ணாக இருக்கட்டும்[a].
  to: அவள் என்னிடம், ‘நீங்களும் குடியுங்கள்; உங்கள் ஒட்டகங்களுக்கும் தண்ணீர் இறைப்பேன்’ என்று சொன்னால், அவளே என் எஜமானின் மகனுக்காக யாவே நியமித்த பெண்ணாக இருக்கட்டும்[a].
  rationale: வாக்கியம் நேரடியான அடையாள நிபந்தனையாக மறுசீரமைக்கப்பட்டுள்ளது; இதனால் எபிரெயத்தின் ‘அவள் என்னிடம் சொல்லி’ என்ற தொடர்ச்சியும், சூழலிலுள்ள வேண்டுதல் வலிமையும் தெளிவாகின்றன. இறைநாமம் POB-இன் ‘Yahweh’ தீர்மானத்துக்கு ஏற்ப ‘யாவே’ எனத் திருத்தப்பட்டுள்ளது. அடிக்குறிப்பு அடையாளக் கூற்று மற்றும் הֹכִיחַ-ன் மாற்றுப் பொருள்களைப் பாதுகாக்கிறது.
