    issue: யְהוָה ‘யெகோவா’ என வழங்கப்பட்டுள்ளது.
    rationale: மூலத்தில் இறைநாமம் நேரடியாக உள்ளது; ஆங்கில POB audit trail அதனை ‘Yahweh’ எனத் தீர்மானிக்கிறது. ஆகவே தமிழில் அதனுடன் ஒத்த ‘யாவே’ பயன்படுத்தப்பட வேண்டும்.
