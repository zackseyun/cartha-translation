source:
  edition: WLC
  text: וְ/אָמְרָ֤ה אֵלַ/י֙ גַּם אַתָּ֣ה שְׁתֵ֔ה וְ/גַ֥ם לִ/גְמַלֶּ֖י/ךָ אֶשְׁאָ֑ב הִ֣וא הָֽ/אִשָּׁ֔ה אֲשֶׁר הֹכִ֥יחַ יְהוָ֖ה לְ/בֶן אֲדֹנִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/044.yaml
  text: and says to me[a], ‘You also drink, and I will draw water for your camels as well’—let her be the woman whom Yahweh has appointed for my master’s son.
translation:
  language: ta
  text: அவள் என்னிடம், ‘நீங்களும் குடியுங்கள்; உங்கள் ஒட்டகங்களுக்கும் தண்ணீர் இறைப்பேன்’ என்று சொன்னால், அவளே என் எஜமானின் மகனுக்காக யாவே நியமித்த பெண்ணாக இருக்கட்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “அவளே என் எஜமானின் மகனுக்காக யாவே தீர்மானித்த—அல்லது, குறிப்பிட்டுத் தேர்ந்தெடுத்த—பெண்.”'
    reason: הִוא הָאִשָּׁה என்ற அடையாளக் கூற்றின் இலக்கண வாசிப்பையும், הֹכִיחַ என்பதற்கான ‘தீர்மானித்த/குறிப்பிட்டுத் தேர்ந்தெடுத்த’ என்ற சொற்பொருள் மாற்றுகளையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וְאָמְרָה אֵלַי
  choice: என்னிடம் ... என்று சொல்லும்
  rationale: முந்தைய வசனத்தில் தொடங்கிய நிபந்தனை சார்ந்த வேண்டுதலின் தொடர்ச்சியாக உள்ளதால், எபிரெய நிறைவுவினையைத் தமிழில் இயல்பான தொடர்பெயர் அமைப்பாக வழங்குகிறது.
- source_word: גַּם אַתָּה שְׁתֵה
  choice: நீங்களும் குடியுங்கள்
  rationale: גַּם மற்றும் தனிப்பட்ட சுட்டுப்பெயர் தரும் ‘நீங்களும்’ என்ற வலியுறுத்தலையும், கட்டளை வினையின் மரியாதையான நேரடி அழைப்பையும் காக்கிறது.
- source_word: וְגַם לִגְמַלֶּיךָ אֶשְׁאָב
  choice: உங்கள் ஒட்டகங்களுக்கும் தண்ணீர் இறைப்பேன்
  rationale: שׁאב என்பது கிணற்றிலிருந்து தண்ணீர் இறைத்தல்/எடுத்தல்; சூழலில் மறைந்துள்ள ‘தண்ணீர்’ தமிழில் வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது. וְגַם என்பதன் இணைப்புப் பொருள் ‘ஒட்டகங்களுக்கும்’ என்பதில் காக்கப்படுகிறது.
- source_word: הִוא הָאִשָּׁה
  choice: அந்தப் பெண்ணே ... பெண்ணாக இருக்கட்டும்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் அடையாள வேண்டுதலின் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘மனைவி’ என்று முன்கூட்டியே பொருளைச் சுருக்காமல் אִשָּׁה என்பதற்கு ‘பெண்’ என வழங்குகிறது.
- source_word: אֲשֶׁר הֹכִיחַ
  choice: நியமித்த
  rationale: Hiphil வடிவம் இச்சூழலில் தீர்மானித்தல், குறிப்பிட்டுத் தேர்ந்தெடுத்தல் அல்லது நியமித்தல் என்ற பொருளைக் கொள்ளலாம்; திருமணத்திற்கான தெய்வீகத் தேர்வை ‘நியமித்த’ தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைநாமமான நான்கெழுத்துப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயரொலிப்பாக வழங்குகிறது.
- source_word: לְבֶן אֲדֹנִי
  choice: என் எஜமானுடைய மகனுக்காக
  rationale: לְ குறிக்கும் தொடர்பு/நோக்கத்தையும், אֲדֹנִי என்பதன் இச்சூழலுக்குரிய மனித எஜமானைக் குறிக்கும் பொருளையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: மூலத்தில் தனிப்பட்ட இறைநாமம் நேரடியாக இருப்பதால் அதை ஒரு பட்டமாக மாற்றாமல் பெயராகவே வழங்கப்பட்டுள்ளது; தமிழில் வாசகர்களுக்கு பரவலாக அறிமுகமான ‘யெகோவா’ பயன்படுத்தப்படுகிறது.
- issue: הִוא הָאִשָּׁה என்பதன் உரைநடை வலிமை
  choice: பெண்ணாக இருக்கட்டும்
  alternative: அவளே அந்தப் பெண்
  rationale: தனி வாக்கியமாக இது அடையாளப்படுத்தும் கூற்றாக வாசிக்கக்கூடியதாயினும், 24:43 முதல் தொடரும் ஊழியக்காரனின் வேண்டுதல்/அடையாள அமைப்பு தமிழில் விருப்பவினை வடிவை இயல்பாக்குகிறது. மாற்று வாசிப்பின் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: הֹכִיחַ என்பதன் தெய்வீகச் செயல்பாடு
  choice: நியமித்த
  alternative: தீர்மானித்த / குறிப்பிட்டுத் தேர்ந்தெடுத்த
  rationale: தேவன் பெண்ணைத் தேர்ந்தெடுத்திருப்பதைச் சூழல் சுட்டுகிறது; சொல்லின் பரந்த பொருளை ஒரே கோட்பாட்டு விளக்கமாகச் சுருக்காமல் மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையான நேரடி பேச்சுக்கு ‘நீங்கள்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘எஜமான்’, ‘தண்ணீர் இறைப்பேன்’ ஆகியவை பழங்கால வீட்டுப்பணி மற்றும் கிணற்றுச் சூழலைத் தெளிவாகவும் இயல்பாகவும் எடுத்துரைக்கின்றன. உரை கண்ணியமானதாய் இருந்தாலும் பொதுவாசகர்களுக்குப் புரியும் நடை காக்கப்பட்டுள்ளது.
