base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/060.yaml
  text: And they blessed Rebekah and said to her[a], “Our sister, may you become thousands of ten thousands[b], and may your offspring possess the gate of those who hate them.”
translation:
  language: ta
  text: அவர்கள் ரெபெக்காளை ஆசீர்வதித்து அவளிடம், “எங்கள் சகோதரியே, நீ பதினாயிரங்களின் ஆயிரங்களாகப் பெருகுவாயாக[a]; உன் சந்ததி தன்னை வெறுப்பவர்களின் வாசலைக் கைப்பற்றுவதாக[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எண்ணற்ற பெருந்திரளாக.” எபிரெயில் சொல்லுக்குச் சொல், “பதினாயிரங்களின் ஆயிரங்களாக.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தன் பகைவர்களின் வாசலை உரிமையாக்கிக்கொள்வதாக.” எபிரெயில் சொல்லுக்குச் சொல், “தன்னை வெறுப்பவர்களின் வாசலைக் கைப்பற்றுவதாக.” இங்கு “வாசல்” என்பது நகரத்தின் வலிமையையும் அதன் மீதான கட்டுப்பாட்டையும் குறிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: ஆசீர்வதித்து
  rationale: பியேல் வினை இங்கு ரெபெக்காள்மீது ஆசீர்வாதம் உரைப்பதைக் குறிக்கிறது; தமிழில் நேரடியும் இயல்புமாக உள்ளது.
- source_word: רִבְקָה
  choice: ரெபெக்காள்
  rationale: தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்ற, எபிரெய வடிவத்தை நெருங்கிய ஒலிபெயர்ப்பு.
- source_word: אֲחֹתֵנוּ
  choice: எங்கள் சகோதரியே
  rationale: விளித்தல் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֲיִי
  choice: பெருகுவாயாக
  rationale: ஆசீர்வாத விருப்பைத் தமிழின் வாழ்த்துவினை வடிவில் தருகிறது; எண்ணற்ற மக்களாக ஆகுதல் என்னும் சூழற்பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְאַלְפֵי רְבָבָה
  choice: பல்லாயிரம் பதினாயிரங்களாக
  rationale: ‘ஆயிரங்கள்’ மற்றும் ‘பதினாயிரம்’ ஆகிய எபிரெய எண்ணியல் கூறுகளையும் அதன் மிகைப்படுத்திய பெருக்காசீர்வாதத்தையும் காக்கிறது.
- source_word: וְיִירַשׁ
  choice: கைப்பற்றுவதாக
  rationale: ירש என்பதன் உடைமையாக்குதல் அல்லது வெற்றிகொண்டு கட்டுப்பாட்டில் கொண்டுவருதல் என்ற பொருளை, பகைவரின் வாசல் என்ற சூழலில் தெளிவாகத் தருகிறது.
- source_word: זַרְעֵךְ
  choice: உன் சந்ததி
  rationale: எபிரெயில் உள்ள ஒருமைத் தொகுப்புப்பெயரின் வடிவையும் வாக்குத்தத்த மொழியின் இலக்கிய எதிரொலியையும் காக்கிறது.
- source_word: שַׁעַר
  choice: வாசல்
  rationale: பாதுகாக்கப்பட்ட நகர நுழைவாயிலையும் அதனால் குறிக்கப்படும் அதிகாரம் மற்றும் கட்டுப்பாட்டையும் கொண்டுள்ள மூல உருவகத்தை காக்கிறது.
- source_word: שֹׂנְאָיו
  choice: தன்னை வெறுப்பவர்கள்
  rationale: ‘அவனை/அதை வெறுப்பவர்கள்’ என்ற எபிரெயப் பங்கேற்புவினையின் நேரடிப் பொருளைத் தருகிறது; ‘தன்னை’ என்பது ‘சந்ததி’ என்ற ஒருமைத் தொகுப்பைத் தெளிவாகச் சுட்டுகிறது.
theological_decisions:
- issue: ‘சந்ததி’ என்ற ஒருமைத் தொகுப்புப்பெயரும் அதைக் குறிக்கும் ஒருமைச் சுட்டும்
  choice: உன் சந்ததி தன்னை வெறுப்பவர்களின்
  alternative: உன் சந்ததியினர் தங்களை வெறுப்பவர்களின்
  rationale: זַרְעֵךְ என்பது இலக்கணத்தில் ஒருமையான தொகுப்புப்பெயர்; שֹׂנְאָיו என்பதிலுள்ள ஒருமைச் சுட்டையும் தமிழின் ‘தன்னை’ இயல்பாகக் காக்கிறது. இதனால் அதைத் தனிநபராகவோ பன்மையாகவோ கட்டாயமாகத் தீர்மானிக்காமல் மூலத்தின் இலக்கிய மற்றும் உடன்படிக்கைத் தளர்வை நிலைநிறுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் dignified வாழ்த்து நடையைப் பயன்படுத்துகிறது. ‘பெருகுவாயாக’ மற்றும் ‘கைப்பற்றுவதாக’ ஆகியவை ஆசீர்வாதத்தின் விருப்பநிலையை இயல்பாகத் தருகின்றன. மூலத்தின் எண்ணியல் மிகைப்படுத்தலும் ‘வாசல்’ உருவகமும், ‘சந்ததி’ என்ற ஒருமைத் தொகுப்பின் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
