base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/053.yaml
  text: Then the servant brought out articles of silver and articles of gold and garments[a], and gave them to Rebekah; he also gave choice gifts to her brother and to her mother.
translation:
  language: ta
  text: பின்பு அந்தப் பணியாளர் வெள்ளிப் பொருட்களையும் பொன் பொருட்களையும் ஆடைகளையும் வெளியே எடுத்து ரெபெக்காளுக்குக் கொடுத்தான். அவளுடைய சகோதரனுக்கும் தாய்க்கும் சிறப்பான பரிசுகளையும்[a] கொடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விலைமதிப்புள்ள பரிசுகள்’ என்றும் மொழிபெயர்க்கலாம். מִגְדָּנֹת என்ற சொல் மிகவும் சிறப்பான அல்லது விலைமதிப்புள்ள பரிசுகளைக் குறிக்கலாம்; சில சூழல்களில் சுவையான உணவுப்பொருட்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: வெளியே எடுத்து
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே கொண்டுவருதல்’ என்று பொருள்படும்; பொருட்களை வைத்திருந்த இடத்திலிருந்து எடுத்த செயலை இயல்பான தமிழில் இது தெளிவாகக் காட்டுகிறது.
- source_word: הָעֶבֶד
  choice: அந்தப் பணியாளர்
  rationale: עֶבֶד என்பது பணியாளர் அல்லது அடிமை எனப் பொருள்படலாம். இக்கதைச் சூழலில் வீட்டுத் தலைவனின் சார்பில் பொறுப்புடன் செயல்படும் நபரை ‘பணியாளர்’ இயல்பாகவும் தேவையற்ற சமூக விளக்கத்தைத் திணிக்காமலும் குறிக்கிறது.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: வெள்ளிப் பொருட்களையும் பொன் பொருட்களையும்
  rationale: כְּלִי என்பது பாத்திரம் மட்டுமல்லாமல் பலவகைப் பொருட்களையும் குறிக்கும் பரந்த சொல். எனவே ‘பொருட்கள்’ மூலத்தின் பொருள் வரம்பைப் பாதுகாக்கிறது.
- source_word: וּבְגָדִים
  choice: ஆடைகளையும்
  rationale: בְּגָדִים என்பதற்கான இயல்பான நவீனத் தமிழ் இணை ‘ஆடைகள்’; பரிசளிக்கும் சூழலுக்கும் இது பொருந்துகிறது.
- source_word: וַיִּתֵּן לְרִבְקָה
  choice: ரெபெக்காளுக்குக் கொடுத்தான்
  rationale: முன் குறிப்பிடப்பட்ட வெள்ளி, பொன் பொருட்கள் மற்றும் ஆடைகளே கொடுக்கப்பட்டவை என்பது தமிழ் வாக்கிய இணைப்பில் தெளிவாக இருப்பதால் தேவையற்ற சுட்டுப்பெயர் சேர்க்கப்படவில்லை.
- source_word: וּמִגְדָּנֹת
  choice: சிறப்பான பரிசுகளையும்
  rationale: מִגְדָּנוֹת என்பது தேர்ந்தெடுக்கப்பட்ட, அரிய அல்லது மதிப்புமிக்க அன்பளிப்புகளைக் குறிக்கலாம்; சில சூழல்களில் சுவையான உணவுப்பொருட்களையும் குறிக்கலாம். ‘சிறப்பான பரிசுகள்’ இத்திருமண ஏற்பாட்டுச் சூழலுக்கு இயல்பாகப் பொருந்தி, விலையை மட்டும் வலியுறுத்துவதைத் தவிர்க்கிறது.
- source_word: לְאָחִיהָ וּלְאִמָּהּ
  choice: அவளுடைய சகோதரனுக்கும் தாய்க்கும்
  rationale: இருவரும் ரெபெக்காளின் உறவினர்கள் என்பதை ‘அவளுடைய’ தெளிவாக்குகிறது; இருமுறை வரும் לְ தமிழ் இணைப்பில் ‘-க்கும் ... -க்கும்’ என இயல்பாகப் பிரதிபலிக்கப்படுகிறது.
