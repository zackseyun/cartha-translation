translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வெள்ளிப் பொருட்கள்’, ‘பொன் பொருட்கள்’ ஆகியவை மூலச் சொல்லின் பரந்த பொருளைத் தக்கவைக்கின்றன. மூலத்தில் இரு கொடுத்தல் செயல்களும் தொடர்ச்சியாக வருவதால், தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் מִגְדָּנֹת என்பதற்கான ‘சிறப்பான பரிசுகள்’ என்பதன் பின்னரே வைக்கப்பட்டுள்ளது.
