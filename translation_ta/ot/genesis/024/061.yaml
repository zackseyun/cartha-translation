  text: וַ/תָּ֨קָם רִבְקָ֜ה וְ/נַעֲרֹתֶ֗י/הָ וַ/תִּרְכַּ֨בְנָה֙ עַל הַ/גְּמַלִּ֔ים וַ/תֵּלַ֖כְנָה אַחֲרֵ֣י הָ/אִ֑ישׁ וַ/יִּקַּ֥ח הָ/עֶ֛בֶד אֶת רִבְקָ֖ה וַ/יֵּלַֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/061.yaml
  text: Then Rebekah and her young women arose[a], mounted the camels, and went after the man. And the servant took Rebekah and went on his way.
translation:
  language: ta
  text: பின்பு ரெபெக்காளும் அவளுடைய இளம்பெண்களும்[a] எழுந்து, ஒட்டகங்களின் மேல் ஏறி, அந்த மனிதனைப் பின்தொடர்ந்து சென்றார்கள். அந்தப் பணியாளன் ரெபெக்காளை அழைத்துக்கொண்டு சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளுடைய பெண் உதவியாளர்கள்.” எபிரெயச் சொல் இளம்பெண்களைக் குறிக்கிறது; இச்சூழலில் அவர்கள் ரெபெக்காளுடன் வந்த பெண் உதவியாளர்களாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: எழுந்து
  rationale: קום என்பதன் அடிப்படைப் பொருளான எழுதல் என்பதைத் தக்கவைத்து, தொடரும் பயணச் செயல்களின் இயல்பான தொடக்கமாக அமைகிறது.
- source_word: נַעֲרֹתֶיהָ
  choice: அவளுடைய இளம்பெண் பணியாளர்கள்
  rationale: נַעֲרָה முதன்மையாக இளம்பெண்ணைக் குறிக்கிறது; சூழல் அவர்கள் ரெபெக்காளுடன் செல்லும் பெண் உதவியாளர்கள் என்பதைக் காட்டுவதால், வயது/பால் சார்ந்த அடிப்படைப் பொருளையும் சூழல்சார் பணியையும் ஒருங்கிணைக்கிறது.
- source_word: וַתִּרְכַּבְנָה עַל הַגְּמַלִּים
  choice: ஒட்டகங்கள்மேல் ஏறி
  rationale: רכב על இங்கு பயணத்திற்கு ஒட்டகங்கள்மேல் ஏறும் தொடக்கச் செயலைக் குறிக்கிறது; தமிழில் இயல்பாகவும் மூலத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: אַחֲרֵי הָאִישׁ
  choice: அந்த மனிதனைப் பின்தொடர்ந்து
  rationale: אַחֲרֵי என்பதன் ‘பின்னால்/பின்தொடர்ந்து’ என்ற பயணச் சூழலிலான பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: சூழலில் அவர் ஆபிரகாமின் பணியாளன் என்றாலும், எபிரெய உரை இங்கு ‘மனிதன்’ என்றே கூறுவதால் அந்தக் கதைநடை வேறுபாடு பாதுகாக்கப்படுகிறது.
- source_word: וַיִּקַּח הָעֶבֶד אֶת רִבְקָה
  choice: அந்தப் பணியாளன் ரெபெக்காளை அழைத்துக்கொண்டு
  rationale: לקח என்பதன் ‘எடுத்துக்கொள்/கொண்டுசெல்’ பொருளை, ஒருவரை பயணத்தில் உடன் அழைத்துச் செல்லும் இச்சூழலுக்கு இயல்பான தமிழில் தருகிறது; உடைமைப்படுத்துதல் என்ற தவறான ஒலிப்பையும் தவிர்க்கிறது.
- source_word: הָעֶבֶד
  choice: அந்தப் பணியாளன்
  rationale: עֶבֶד என்பதற்கு அடிமை அல்லது பணியாளன் எனப் பொருள் வரலாம்; இங்கு ஆபிரகாமின் நம்பிக்கைக்குரிய வீட்டுப் பிரதிநிதி என்பதால் ‘பணியாளன்’ சூழலுக்கு ஏற்றது.
- source_word: וַיֵּלַךְ
  choice: புறப்பட்டான்
  rationale: הלך அடிப்படையில் ‘சென்றான்’ என்றாலும், இப்பயணச் சூழலில் ‘புறப்பட்டான்’ என்பது செயல் தொடர்வதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; இலக்கையோ பயண முறையையோ கூடுதலாக நிர்ணயிக்கவில்லை.
