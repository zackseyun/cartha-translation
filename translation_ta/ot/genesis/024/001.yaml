  to: ஆபிரகாம் முதியவராகவும், வயதில் மிகவும் முதிர்ந்தவராகவும் இருந்தார்[a]; யாவே ஆபிரகாமை எல்லாவற்றிலும் ஆசீர்வதித்திருந்தார்.
