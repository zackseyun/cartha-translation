  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אַבְרָהָ֣ם זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַֽ/יהוָ֛ה בֵּרַ֥ךְ אֶת אַבְרָהָ֖ם בַּ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/001.yaml
  text: Abraham was old[a], advanced in years, and Yahweh had blessed Abraham in all things.
translation:
  language: ta
  text: ஆபிரகாம் முதியவராகவும், வயதில் மிகவும் முதிர்ந்தவராகவும் இருந்தார்[a]; யாவே ஆபிரகாமை எல்லாவற்றிலும் ஆசீர்வதித்திருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், «நாட்களுக்குள் வந்தவர்»; இது மிகவும் முதிர்ந்த வயதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: ஆபிரகாம்
  rationale: வாவ் இங்கு புதிய கதைப்பகுதியைத் தொடுக்கும் இணைப்பாக உள்ளது. தமிழில் செயற்கையான தொடக்க ‘மேலும்’ என்பதைக் காட்டிலும், வாக்கியத் தொடர்ச்சியும் சூழலும் அந்த இணைப்பை இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: זָקֵן
  choice: முதியவராகி
  rationale: ஆபிரகாமின் முதுமையை நேரடியாகவும் இயல்பான நவீனத் தமிழிலும் தெரிவிக்கிறது.
- source_word: בָּא בַּיָּמִים
  choice: வயது மிகவும் முதிர்ந்திருந்தார்
  rationale: சொல்லுக்குச் சொல் ‘நாட்களுக்குள் வந்தார்’ என்ற எபிரெய மரபுத்தொடர், மிகவும் வயது முதிர்ந்த நிலையைக் குறிக்கிறது. தமிழில் பொருளைத் தெளிவாகத் தருவதோடு, அடிப்படை உருவகத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: וַֽ/יהוָה
  choice: யாவே
  rationale: יהוה என்ற தனிப்பட்ட இறைப் பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், ‘Yahweh’ என்பதற்கேற்ற தமிழ்ப் பெயரெழுத்தாக்கமாக வழங்குகிறது.
- source_word: בֵּרַךְ
  choice: ஆசீர்வதித்திருந்தார்
  rationale: இக்கதை தொடங்குவதற்கு முன்பே ஆபிரகாமுக்குக் கிடைத்திருந்த ஆசீர்வாதத்தைப் பின்னணிநிலையாக எபிரெய நிறைவேற்ற வினை காட்டுவதால், தமிழில் இறந்தகால நிறைவுநிலை பயன்படுத்தப்படுகிறது.
- source_word: בַּ/כֹּל
  choice: எல்லாவற்றிலும்
  rationale: ஆசீர்வாதத்தின் முழுமையான பரப்பைத் தெரிவிக்கிறது; அதை பொருட்செல்வத்துக்கு மட்டும் சுருக்குவதில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. ‘யாவே’ என்பது அதனைப் பெயராகவே பாதுகாக்கிறது; ‘ஆண்டவர்’ பொதுப்பட்டமாகும், ‘யெகோவா’ வேறுபட்ட பாரம்பரிய உச்சரிப்பைப் பிரதிபலிக்கிறது.
- issue: בַּכֹּל குறிக்கும் ஆசீர்வாதத்தின் பரப்பு
  choice: எல்லாவற்றிலும்
  alternative: எல்லா விதத்திலும் / எல்லாவற்றையும் கொடுத்து
  rationale: எபிரெய சொற்றொடர் திட்டமிட்டே விரிவானது. ஆசீர்வாதம் எவ்வகையில் வந்தது என்பதைச் சுருக்கமாக நிர்ணயிக்காமல் அதன் பொதுமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூலத்தின் இரட்டைக் குறிப்பான ‘முதியவர்’ மற்றும் ‘வயது மிகவும் முதிர்ந்தவர்’ இரண்டும் பாதுகாக்கப்பட்டுள்ளன; வாசிப்பை எளிதாக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
