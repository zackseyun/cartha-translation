  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மதிப்புடனும் அமைக்கப்பட்டுள்ளது. ‘தந்தை’ என்பது தெளிவான சமகாலச் சொல்லாகவும், ‘இரவு தங்குதல்’ என்பது பழமையான அல்லது செயற்கையான விடுதிசார் சொற்களைத் தவிர்க்கும் வழக்கமான சொற்றொடராகவும் தேர்ந்தெடுக்கப்பட்டது.
