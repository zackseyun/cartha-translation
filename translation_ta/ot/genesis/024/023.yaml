  text: וַ/יֹּ֨אמֶר֙ בַּת מִ֣י אַ֔תְּ הַגִּ֥ידִי נָ֖א לִ֑/י הֲ/יֵ֧שׁ בֵּית אָבִ֛י/ךְ מָק֥וֹם לָ֖/נוּ לָ/לִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/023.yaml
  text: And he said[a], “Whose daughter are you? Please tell me. Is there room in your father’s house for us to spend the night?”
translation:
  language: ta
  text: அவன் அவளிடம், “நீ யாருடைய மகள்? தயவுசெய்து எனக்குச் சொல். நாங்கள் இரவு தங்குவதற்கு உன் தந்தையின் வீட்டில் இடம் இருக்கிறதா?”[a] என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாங்கள் தங்குவதற்கு உன் தந்தையின் வீட்டில் இடம் இருக்கிறதா?”
    reason: லָלִין என்ற வினையை ‘இரவு தங்குவதற்கு’ என்றும் சுருக்கமாக ‘தங்குவதற்கு’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவன் அவளிடம் … என்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான தமிழில் தருகிறது; உரையாடல் யாரை நோக்கியது என்பதையும் சூழலுக்கேற்ப தெளிவாக்குகிறது.
- source_word: בַּת מִי אַתְּ
  choice: நீ யாருடைய மகள்?
  rationale: குடும்ப அடையாளத்தை விசாரிக்கும் எபிரெயக் கேள்வியை இயல்பாகவும் நேரடியாகவும் தருகிறது.
- source_word: הַגִּידִי נָא לִי
  choice: தயவுசெய்து எனக்குச் சொல்
  rationale: נָא என்பதன் வேண்டுகோள் தன்மையை ‘தயவுசெய்து’ வெளிப்படுத்துகிறது; לִי என்பதையும் ‘எனக்கு’ என்று காக்கிறது.
- source_word: הֲיֵשׁ
  choice: இருக்கிறதா?
  rationale: இருப்பு அல்லது கிடைப்பை விசாரிக்கும் ஆம்/இல்லை கேள்வியை இயல்பான தமிழில் தருகிறது.
- source_word: בֵּית אָבִיךְ
  choice: உன் தந்தையின் வீட்டில்
  rationale: தந்தையின் வீடு அல்லது வீட்டார் சார்ந்த விருந்தோம்பல் சூழலைச் சுருக்காமல் காக்கிறது.
- source_word: מָקוֹם
  choice: இடம்
  rationale: தங்குவதற்குக் கிடைக்கும் இடத்தைக் குறிக்கும் மூலச்சொல்லின் பரந்த பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: לָנוּ
  choice: நாங்கள்
  rationale: பேசுகிறவரையும் அவருடன் வந்தவர்களையும் உள்ளடக்கும் முதல் நபர் பன்மையைப் பாதுகாக்கிறது.
- source_word: לָלִין
  choice: இரவு தங்குவதற்கு
  rationale: விருந்தோம்பல் சூழலில் ஒரே இரவு தங்குவதைக் குறிக்கும் வினையின் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
