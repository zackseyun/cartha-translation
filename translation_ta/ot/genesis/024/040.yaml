  text: וַ/יֹּ֖אמֶר אֵלָ֑/י יְהוָ֞ה אֲשֶׁר הִתְהַלַּ֣כְתִּי לְ/פָנָ֗י/ו יִשְׁלַ֨ח מַלְאָכ֤/וֹ אִתָּ/ךְ֙ וְ/הִצְלִ֣יחַ דַּרְכֶּ֔/ךָ וְ/לָקַחְתָּ֤ אִשָּׁה֙ לִ/בְנִ֔/י מִ/מִּשְׁפַּחְתִּ֖/י וּ/מִ/בֵּ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/040.yaml
  text: And he said to me[a], ‘Yahweh, before whom I have walked, will send his angel with you and make your journey successful[b], and you will take a wife for my son from my clan and from my father’s house.’
translation:
  language: ta
  text: அவர் என்னிடம், “நான் யாருடைய முன்னிலையில் நடந்து வந்தேனோ, அந்த யாவே தமது தூதனை உன்னோடு அனுப்பி, உன் பயணத்தை வெற்றியடையச் செய்வார்[a]. நீ என் மகனுக்காக என் குலத்திலிருந்தும்[b] என் தந்தையின் வீட்டாரிலிருந்தும் ஒரு பெண்ணை மனைவியாகக் கொள்வாய்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் வழியைச் செழிக்கச் செய்வார்.”
    reason: எபிரெயச் சொற்றொடர் ‘வழி’ என்பதையும் வெற்றி அல்லது செழிப்பு அளித்தல் என்பதையும் நேரடியாகக் கூறுகிறது.
  - marker: b
    text: அல்லது, “என் உறவினர் குழுவிலிருந்தும்”; எபிரெயச் சொல் உடனடிக் குடும்பத்தைவிட விரிந்த உறவினர் பிரிவைக் குறிக்கலாம்.
    reason: மூலச் சொல்லின் உறவுமுறைப் பரப்பைத் தெளிவுபடுத்தும் சொல் மாற்று.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: הִתְהַלַּכְתִּי לְפָנָיו
  choice: யாருடைய முன்னிலையில் நான் நடந்து வந்தேனோ
  rationale: ஒருவர் கடவுளின் முன்னிலையில் தம் வாழ்வை நடத்துவதைக் குறிக்கும் உடன்படிக்கைச் சொல்வழக்கைப் பாதுகாக்கிறது; ‘உண்மையாக வாழ்ந்தேன்’ என்று விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
- source_word: מַלְאָכוֹ
  choice: தமது தூதனை
  rationale: இச்சூழலில் யாவே அனுப்பும் விண்ணுலகத் தூதரைக் குறிக்கிறது; மரியாதை ஒருமைக்கு ஏற்றவாறு ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אִתָּךְ
  choice: உன்னோடு
  rationale: உடன்செல்லுதலை இயல்பான நவீனத் தமிழில் நேரடியாகக் குறிக்கிறது.
- source_word: וְהִצְלִיחַ דַּרְכֶּךָ
  choice: உன் பயணத்தை வெற்றிபெறச் செய்வார்
  rationale: צלח என்பதன் காரணவினைப் பொருளையும், דֶּרֶךְ இங்கு பயணப் பணியைக் குறிக்கும் சூழல்சார் பொருளையும் தெளிவாகத் தருகிறது.
- source_word: וְלָקַחְתָּ אִשָּׁה
  choice: ஒரு பெண்ணை மனைவியாகக் கொள்வாய்
  rationale: திருமணத்தைச் சுட்டும் எபிரெயச் சொல்வழக்கை இயல்பாகவும் கண்ணியமாகவும் தமிழில் தருகிறது.
- source_word: לִבְנִי
  choice: என் மகனுக்காக
  rationale: בן என்பதன் ஆண்பால் சார்ந்த குறிப்பைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: מִמִּשְׁפַּחְתִּי
  choice: என் குலத்திலிருந்தும்
  rationale: מִשְׁפָּחָה உடனடிக் குடும்பத்தைவிட விரிந்த உறவினர் பிரிவைக் குறிக்கக்கூடும்; ‘குலம்’ அந்தப் பரப்பைச் சுருக்கமாகத் தருகிறது.
- source_word: וּמִבֵּית אָבִי
  choice: என் தந்தையின் வீட்டாரிலிருந்தும்
  rationale: தந்தைவழிக் குடும்பம் அல்லது குடும்பக் குழுவைக் குறிக்கும் בֵּית אָב என்ற சொல்லிணையை, வெறும் கட்டடமாகப் புரிந்துகொள்ளாத வகையில் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: தெய்வீகப் பெயரைப் பட்டப்பெயராக மாற்றாமல் பாதுகாக்கிறது; ‘யெகோவா’ என்பதற்குப் பதிலாக Yahweh என்ற ஒலிப்பைத் தமிழில் பிரதிபலிக்கிறது.
- issue: ‘அவருடைய முன்னிலையில் நடந்தேன்’ என்ற சொல்வழக்கின் பொருள்
  choice: சொல்வழக்கைத் தக்கவைத்து, ‘முன்னிலையில் நடந்து வந்தேன்’ என மொழிபெயர்த்தல்
  alternative: அவருக்கு உண்மையாக வாழ்ந்தேன்; அவரது சந்நிதியில் வாழ்ந்தேன்
  rationale: இது கடவுளுக்கு முன்பாக வாழ்ந்த வாழ்க்கையையும் பொறுப்புள்ள உறவையும் உணர்த்துகிறது; ஆனால் ‘உண்மையாக’ போன்ற விளக்கச் சொல்லைச் சேர்த்து மூலத்தின் மறைபொருளை ஒரே விதமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ஆபிரகாமின் உரைக்குள் உள்ள தெய்வீக வாக்குறுதியின் எதிர்காலத் தன்மை காக்கப்பட்டுள்ளது. ‘நடந்து வந்தேன்’ என்ற வேதாகமச் சொல்வழக்கு புரிந்துகொள்ளத்தக்க வடிவில் தக்கவைக்கப்பட்டுள்ளது; ‘குலம்’ மற்றும் ‘தந்தையின் வீட்டார்’ ஆகியவை தொடர்புடையதாயினும் வேறுபட்ட இரு உறவுமுறைச் சொற்களாக மொழிபெயர்க்கப்பட்டுள்ளன.
