revisions:
- from: அவர் என்னிடம், “யாருடைய முன்னிலையில் நான் நடந்து வந்தேனோ, அந்த யாவே தமது தூதனை உன்னோடு அனுப்பி, உன் பயணத்தை வெற்றிபெறச் செய்வார்[a]. நீ என் மகனுக்காக என் குலத்திலிருந்தும்[b] என் தந்தையின் வீட்டாரிலிருந்தும் ஒரு பெண்ணை மனைவியாகக் கொள்வாய்” என்றார்.
