  rationale: 'ஒரே குறைந்தளவிலான நடையியல் திருத்தம் செய்யப்பட்டுள்ளது: பயணத்துக்கு வெற்றி அளிக்கும் யாவேயின் செயலைக் குறிக்கும் காரணவினைத் தன்மையைத் தெளிவாகவும் இயல்பாகவும் காட்ட ‘வெற்றிபெறச் செய்வார்’ என்பது ‘வெற்றியடையச் செய்வார்’ என மாற்றப்பட்டது. மற்ற சொற்கள் மூலத்தின் சொல்லமைப்பு, உறவுமுறை வேறுபாடு, மற்றும் தெய்வீகப் பெயர் ஆகியவற்றை நன்கு காக்கின்றன.'
