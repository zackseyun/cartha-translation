base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/007.yaml
  text: Yahweh[a], the God of heaven, who took me from my father's house and from the land of my birth, and who spoke to me and who swore to me, saying, ‘To your offspring I will give this land’—he will send his angel before you, and you shall take a wife for my son from there.
translation:
  language: ta
  text: வானத்தின் கடவுளான யாவே—என்னை என் தந்தையின் வீட்டிலிருந்தும் நான் பிறந்த நாட்டிலிருந்தும் அழைத்துக்கொண்டுவந்தவரும், என்னிடம் பேசி, ‘உன் சந்ததிக்கு இந்த நாட்டைக் கொடுப்பேன்’ என்று எனக்குச் சத்தியம் செய்தவருமான அவரே—தமது வானதூதனை[a] உனக்கு முன்பாக அனுப்புவார்; நீ அங்கிருந்து என் மகனுக்காக ஒரு மனைவியை அழைத்து வருவாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தூதனை.’ எபிரெயச் சொல் மனிதத் தூதனையோ வானதூதனையோ குறிக்கலாம்; இச்சூழலில் வானதூதன் என்பதே அதிக வாய்ப்புள்ள பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: வானத்தின் கடவுள்
  rationale: எபிரெயக் கட்டமைப்பை நெருக்கமாகப் பின்பற்றுவதோடு, நவீன தமிழிலும் தெளிவாக உள்ளது.
- source_word: לְקָחַנִי
  choice: என்னை அழைத்துக்கொண்டுவந்தவர்
  rationale: இங்கு ஆபிரகாமை அவரது முந்தைய இடத்திலிருந்து கடவுள் வழிநடத்திக் கொண்டுவந்த செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; வெறும் ‘எடுத்தவர்’ என்பது தமிழில் தெளிவற்றதாக இருக்கும்.
- source_word: מִבֵּית אָבִי
  choice: என் தகப்பனின் வீட்டிலிருந்து
  rationale: குடும்பத்தையும் குடும்பச் சூழலையும் குறிக்கும் மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וּמֵאֶרֶץ מוֹלַדְתִּי
  choice: நான் பிறந்த நாட்டிலிருந்து
  rationale: பிறந்த நிலம் அல்லது தாய்நாடு என்ற பொருளை மிகையாக விளக்காமல் நேரடியாகத் தருகிறது.
- source_word: דִּבֶּר לִי
  choice: என்னோடு பேசி
  rationale: ‘வாக்குறுதி அளித்து’ என்று பொருளை முன்கூட்டியே சுருக்காமல், மூலத்தின் பொதுவான ‘பேசுதல்’ வினையைப் பாதுகாக்கிறது.
- source_word: נִשְׁבַּע לִי
  choice: எனக்கு ஆணையிட்டுச் சத்தியம் செய்து
  rationale: எனக்கு உறுதிமொழி செய்தார் என்ற சத்தியப் பொருளைத் தெளிவாகவும் மரியாதையான நடையிலும் தருகிறது.
- source_word: לְזַרְעֲךָ
  choice: உன் சந்ததிக்கு
  rationale: எபிரெயச் சொல்லின் கூட்டொருமைப் பொருளைத் தமிழில் இயல்பாகக் குறிக்கிறது; ‘வித்து’ இங்கு நவீன வாசகருக்கு செயற்கையாக இருக்கும்.
- source_word: אֶתֵּן אֶת הָאָרֶץ הַזֹּאת
  choice: இந்த நாட்டைக் கொடுப்பேன்
  rationale: வாக்குறுதியின் எதிர்காலத் தன்மையையும் நிலப்பரப்பைக் குறிக்கும் பொருளையும் நேரடியாக வழங்குகிறது.
- source_word: הוּא
  choice: அவரே
  rationale: மூலத்திலுள்ள வலியுறுத்தலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִשְׁלַח מַלְאָכוֹ לְפָנֶיךָ
  choice: தமது தூதனை உனக்கு முன்பாக அனுப்புவார்
  rationale: מַלְאָךְ என்பதன் அடிப்படை ‘தூதன்’ பொருளையும், இச்சூழலில் அது வானதூதனாக இருப்பதற்கான வாய்ப்பையும் காலடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי מִשָּׁם
  choice: நீ அங்கிருந்து என் மகனுக்கு ஒரு மனைவியை அழைத்துவருவாய்
  rationale: ‘பெண்ணை எடுப்பாய்’ என்ற அசட்டான நேரடிமொழிபெயர்ப்பைத் தவிர்த்து, பணியாளரின் பொறுப்பையும் அங்கிருந்து அழைத்து வருதல் என்ற சூழற்பொருளையும் இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக இருப்பதால், பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: מַלְאָכוֹ என்பதன் பொருள்
  choice: தமது தூதன்
  alternative: தமது வானதூதன்
  rationale: מַלְאָךְ என்பது மனிதத் தூதனையோ வானதூதனையோ குறிக்கலாம். கடவுளின் வழிநடத்துதல் பற்றிய இச்சூழலில் வானதூதன் என்பதே அதிக வாய்ப்புடையது; எனினும் மூலச் சொல்லின் உண்மையான சொற்பொருள் விரிவை முதன்மை உரையிலும் காலடிக்குறிப்பிலும் பாதுகாக்க ‘தூதன்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையான, வாசிக்க எளிய உரைநடை. ஆபிரகாமின் உறுதியான நம்பிக்கையை ‘அவரே’ மூலம் வலியுறுத்துகிறது. நீண்ட எபிரெய வாக்கியத்தின் தொடர்புகளை கோடுகளும் தனி இறுதி வாக்கியமும் கொண்டு தெளிவாக்குகிறது.
