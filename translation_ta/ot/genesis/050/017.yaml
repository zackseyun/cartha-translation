base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/017.yaml
  text: 'This is what you shall say to Yosef: ‘Please forgive the transgression of your brothers and their sin, because they repaid you with evil. And now, please forgive the transgression of the servants of the God of your father.’ And Yosef wept when they spoke to him.'
translation:
  language: ta
  text: 'யோசேப்பிடம் நீங்கள் இப்படிச் சொல்லுங்கள்: “தயவுசெய்து, உன் சகோதரர்களின் மீறுதலையும் அவர்களுடைய பாவத்தையும் மன்னித்துவிடு; ஏனெனில் அவர்கள் உனக்குத் தீமை செய்தார்கள். இப்போது, உன் தந்தையின் கடவுளின் ஊழியர்களின் மீறுதலையும் தயவுசெய்து மன்னித்துவிடு.” அவர்கள் அவரிடம் பேசும்போது யோசேப்பு அழுதார்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂא נָא
  choice: தயவுசெய்து … மன்னித்துவிடு
  rationale: சொற்பொருளில் ‘தயவுசெய்து தூக்கிக்கொள்/சுமந்துகொள்’; குற்றம் அல்லது பாவம் பொருளாக வரும்போது ‘மன்னி’ என்பது இயல்பான சூழற்பொருள். נָא-வின் மன்றாட்டுத் தொனியை ‘தயவுசெய்து’ காக்கிறது.
- source_word: פֶּשַׁע
  choice: மீறுதல்
  rationale: கலகம் அல்லது உறவுசார் விசுவாசமின்மை உட்பட எல்லை மீறிய குற்றத்தை உணர்த்தும் சொல்லை, பொதுவான ‘குற்றம்’ என்பதைக் காட்டிலும் நெருக்கமாகக் காட்டுகிறது.
- source_word: חַטָּאתָם
  choice: அவர்களுடைய பாவம்
  rationale: நெறிசார் தவறைக் குறிக்கும் எபிரெயச் சொல்லின் வழக்கமான, தெளிவான இணை.
- source_word: רָעָה גְמָלוּךָ
  choice: உனக்குத் தீமை செய்தார்கள்
  rationale: சொல்லுக்கு நெருக்கமாக ‘உனக்குத் தீமையைத் திருப்பிச் செய்தார்கள்’; நவீன தமிழில் இயல்பாகவும் பொருள் மாறாமலும் வழங்கப்பட்டது.
- source_word: עַבְדֵי אֱלֹהֵי אָבִיךָ
  choice: உன் தந்தையின் கடவுளுடைய ஊழியர்கள்
  rationale: ‘அடியார்கள்’ சாத்தியமானாலும், இங்கு கடவுளுக்குச் சேவைசெய்பவர்கள்/அவருக்குச் சொந்தமானவர்கள் என்ற உறவை நவீன மரியாதைத் தமிழில் ‘ஊழியர்கள்’ தெரிவிக்கிறது.
- source_word: בְּדַבְּרָם אֵלָיו
  choice: அவர்கள் இவ்வாறு தன்னிடம் பேசியபோது
  rationale: எபிரெய பன்மை வினையின் தெளிவற்ற கர்த்தாவை ‘அவர்கள்’ என்றே காக்கிறது; முந்தைய வசனத்தின் தூதர்களா அல்லது சகோதரர்களா என்பதைத் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: சகோதரர்களின் இரண்டு அடையாளங்கள்
  choice: ‘உன் சகோதரர்கள்’ என்றும் ‘உன் தந்தையின் கடவுளுடைய ஊழியர்கள்’ என்றும் இரு விளக்கங்களையும் அப்படியே வைத்தல்
  alternative: இரண்டையும் ஒன்றிணைத்து ‘கடவுளுடைய ஊழியர்களான உன் சகோதரர்கள்’ என மொழிபெயர்த்தல்
  rationale: மூலத்தில் மன்னிப்புக்கான வேண்டுகோள் இருமுறை வருகிறது; குடும்ப உறவும் பகிரப்பட்ட கடவுள் பற்றிய உறவும் தனித்தனியாக வலியுறுத்தப்படுகின்றன.
- issue: כִּי-யின் தொடர்பு
  choice: தீமை செய்ததை ஒப்புக்கொள்ளும் தனி வாக்கியமாக வழங்குதல்
  alternative: ‘ஏனெனில் அவர்கள் உனக்குத் தீமை செய்தார்கள்’ என்று நேரடியான காரண இணைப்பாக வழங்குதல்
  rationale: כִּי காரணத்தை அறிமுகப்படுத்தலாம்; ஆனால் தமிழில் ‘அவர்கள் தீமை செய்ததால் மன்னி’ என்பது தவறான காரணவியல் நிழலை உண்டாக்கலாம். ‘ஆனாலும்’ குற்ற ஒப்புக்கொள்ளலும் மன்னிப்பு மன்றாட்டும் இடையிலான இயல்பான உரைத் தொடர்பை வெளிப்படுத்துகிறது; குற்றத்தைத் தணிக்கவில்லை.
- issue: யோசேப்பு அழுததற்கான காரணம்
  choice: அவர் அழுதார் என்று மட்டும் கூறுதல்
  alternative: துக்கத்தால் அல்லது மனமுருகி அழுதார் என காரணம் சேர்த்தல்
  rationale: மூலம் உணர்ச்சிக்கான காரணத்தை விளக்கவில்லை; அதன் திறந்த தன்மை காக்கப்பட்டது.
translation_notes:
  register: மரியாதைமிக்க, தற்போதைய பொதுத் தமிழ். மேற்கோளுக்குள் யோசேப்பை ஒருமையில் அணுகுவதால் ‘உன்/உனக்கு’ பயன்படுத்தப்பட்டது. ‘மன்னித்துவிடு’ வேண்டுகோளின் உணர்ச்சித் தீவிரத்தை இயல்பாகக் காட்டுகிறது; தேவையற்ற சமயக் குழு சார்ந்த சொற்கள் தவிர்க்கப்பட்டன.
