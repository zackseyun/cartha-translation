reference: Genesis 50:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֵּלְכוּ֙ גַּם אֶחָ֔י/ו וַֽ/יִּפְּל֖וּ לְ/פָנָ֑י/ו וַ/יֹּ֣אמְר֔וּ הִנֶּ֥/נּֽוּ לְ/ךָ֖ לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/018.yaml
  text: Then his brothers also came and fell down before him and said[a], “Here we are, your servants.”
translation:
  language: ta
  text: அவனுடைய சகோதரர்களும் வந்து, அவன் முன் விழுந்து, “இதோ, நாங்கள் உங்கள் அடிமைகள்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: வந்து
  rationale: הלך என்பதன் அடிப்படைப் பொருள் ‘செல்/நட’; ஆனால் இக்காட்சியில் சகோதரர்கள் யோசேப்பை அணுகுவதால், தமிழில் ‘வந்து’ என்பது இயல்பான காட்சிநோக்கைத் தருகிறது.
- source_word: גַּם אֶחָיו
  choice: அவனுடைய சகோதரர்களும்
  rationale: גַּם என்பது, முன்பு செய்தி அனுப்பியதுடன் கூட சகோதரர்களும் நேரில் வந்ததைச் சுட்டும் சேர்க்கைப் பொருளைத் தருகிறது.
- source_word: וַיִּפְּלוּ לְפָנָיו
  choice: அவனுக்கு முன்பாக விழுந்து
  rationale: נפל + לפני என்பது ஒருவருக்கு முன் விழுந்து கீழ்ப்படிதலையும் பணிவையும் வெளிப்படுத்துவதைக் குறிக்கிறது; உடல்செயலையும் அதன் வலிமையையும் மொழிபெயர்ப்பு காக்கிறது.
- source_word: הִנֶּנּוּ
  choice: இதோ, நாங்கள்
  rationale: தங்களை நேரடியாக ஒப்படைத்து முன்னிறுத்தும் எபிரெயச் சொல்லாக்கத்தின் வலிமையை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְךָ לַעֲבָדִים
  choice: உங்களுக்கு அடிமைகள்
  rationale: இது யோசேப்புக்கு முழுமையாகக் கீழ்ப்படிந்த நிலையைத் தாங்களே ஏற்றுக்கொள்வதைச் சொல்கிறது. ‘உங்களுக்கு’ என்பது ஒருமை மரியாதையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: עֲבָדִים என்ற சொல்லைத் தீவிரமான தன்னடக்கச் சூழலில் மொழிபெயர்த்தல்
  choice: அடிமைகள்
  alternative: வேலையாட்கள் / பணியாளர்கள்
  rationale: עֲבָדִים என்பது பணியாளர்களையோ அடிமைகளையோ குறிக்கலாம். இங்கு சகோதரர்கள் சாதாரண சேவையை முன்வைக்காமல், யோசேப்பின் அதிகாரத்தின்கீழ் தங்களை முழுமையாக ஒப்படைக்கிறார்கள்; ஆகவே ‘அடிமைகள்’ அந்தத் தீவிரத்தைக் காக்கிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதோ’ என்பது மூலத்தின் தங்களை முன்னிறுத்தும் வலிமையைத் தக்கவைக்கிறது; ‘உங்களுக்கு’ என்பது உரையாடலில் இயல்பான மரியாதை ஒருமையாகப் பயன்படுத்தப்பட்டுள்ளது.
