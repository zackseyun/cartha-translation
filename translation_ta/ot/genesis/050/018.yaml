revisions:
- from: அவனுடைய சகோதரர்களும் வந்து, அவனுக்கு முன்பாக விழுந்து, “இதோ, நாங்கள் உங்களுக்கு அடிமைகள்[a]” என்றார்கள்.
  to: அவனுடைய சகோதரர்களும் வந்து, அவன் முன் விழுந்து, “இதோ, நாங்கள் உங்கள் அடிமைகள்” என்றார்கள்.
  rationale: The revision improves idiomatic modern Tamil by using the possessive phrase “உங்கள் அடிமைகள்” and the concise “அவன் முன்.” It retains the Hebrew emphasis, the brothers’ self-submission, and the lexical-alternative footnote.
  reviewer_model: gpt-5.6-terra
