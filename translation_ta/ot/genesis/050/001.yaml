  text: וַ/יִּפֹּ֥ל יוֹסֵ֖ף עַל פְּנֵ֣י אָבִ֑י/ו וַ/יֵּ֥בְךְּ עָלָ֖י/ו וַ/יִּשַּׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/001.yaml
  text: Then Joseph fell on his father's face and wept over him and kissed him[a].
translation:
  language: ta
  text: அப்போது யோசேப்பு தன் தந்தையின் முகத்தின்மேல் விழுந்து, அவர்மீது அழுது, அவரை முத்தமிட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: விழுந்து
  rationale: נפל என்பதன் தொடர்கதை வடிவம் நிறைவுற்ற கடந்தகாலச் செயலைக் குறிக்கிறது. ‘விழுந்து’ என்பது உடல்சார்ந்த அசைவை நேரடியாகவும், எபிரெயச் சொல்லில் இல்லாத உணர்ச்சித் தீவிரத்தைச் சேர்க்காமலும் தருகிறது.
- source_word: עַל פְּנֵי אָבִיו
  choice: தன் தகப்பனின் முகத்தின்மேல்
  rationale: எபிரெய மூலத்தின் ‘தன் தகப்பனுடைய முகத்தின்மேல்’ என்ற தெளிவான உடல்சார்ந்த காட்சியைப் பாதுகாக்கிறது; வெறுமனே ‘அவர்மேல் சாய்ந்தான்’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: וַיֵּבְךְּ עָלָיו
  choice: அவர்மேல் அழுது
  rationale: בכה என்பது அழுதல் அல்லது கண்ணீர் விடுதலைக் குறிக்கும். עַל உடன் வரும் வடிவத்தின் உடலருகிய துக்கக் காட்சியை ‘அவர்மேல் அழுது’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: וַיִּשַּׁק לוֹ
  choice: அவரை முத்தமிட்டான்
  rationale: נשק என்பதன் கால் வடிவம் பொதுவாக ‘முத்தமிடு’ என்று பொருள்படும்; לֹו என்ற எபிரெய மரபுத்தொடர் தமிழில் நேரடி செயப்படுபொருளுடன் இயல்பாகத் தரப்படுகிறது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: நவீனத் தமிழ் வேதாகம வழக்கில் பரவலாக அறியப்படும் பெயர்வடிவம்.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘தகப்பன்’ என்பது ஆதியாகமக் கதைநடையின் மரியாதைமிக்க வேதாகமப் பதிவைத் தக்கவைக்கிறது; தொடர்ச்சியான மூன்று செயல்களும் மூலத்தின் வேகமான வரிசைப்படியே தரப்பட்டுள்ளன.
