revisions:
- from: அப்போது யோசேப்பு தன் தகப்பனின் முகத்தின்மேல் விழுந்து, அவர்மேல் அழுது, அவரை முத்தமிட்டான்.[a]
  to: அப்போது யோசேப்பு தன் தந்தையின் முகத்தின்மேல் விழுந்து, அவர்மீது அழுது, அவரை முத்தமிட்டான்.
