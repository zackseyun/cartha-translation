translation_notes:
  register: நவீனத் தரத் தமிழ்; பார்வோனிடம் முன்வைக்கப்படும் பணிவான வேண்டுகோளுக்கேற்ற மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நேரடி உரையும் உறுதிமொழி, அடக்கம், திரும்பிவருதல் ஆகிய கருத்துகளும் காக்கப்பட்டுள்ளன.
