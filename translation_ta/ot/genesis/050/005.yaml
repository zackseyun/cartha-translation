  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אָבִ֞/י הִשְׁבִּיעַ֣/נִי לֵ/אמֹ֗ר הִנֵּ֣ה אָנֹכִי֮ מֵת֒ בְּ/קִבְרִ֗/י אֲשֶׁ֨ר כָּרִ֤יתִי לִ/י֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן שָׁ֖מָּ/ה תִּקְבְּרֵ֑/נִי וְ/עַתָּ֗ה אֶֽעֱלֶה נָּ֛א וְ/אֶקְבְּרָ֥ה אֶת אָבִ֖/י וְ/אָשֽׁוּבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/005.yaml
  text: My father made me swear, saying, ‘Look, I am dying. In my grave that I dug for myself in the land of Canaan, there you shall bury me.’ So now, please let me go up and bury my father; then I will return.
translation:
  language: ta
  text: “என் தந்தை, ‘இதோ, நான் இறக்கப்போகிறேன். கானான் தேசத்தில் எனக்காக நான் வெட்டிய கல்லறையில் அங்கே நீ என்னை அடக்கம் செய்ய வேண்டும்’ என்று சொல்லி, என்னைச் சத்தியம் செய்ய வைத்தார். இப்போது தயவுசெய்து, நான் சென்று என் தந்தையை அடக்கம் செய்து திரும்பிவர அனுமதியுங்கள்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁבִּיעַנִי
  choice: என்னிடம் ஆணையிட்டு
  rationale: ஹிப்ஃபில் வடிவம் ‘என்னைச் சத்தியம் செய்ய வைத்தார்’ என்ற பொருளுடையது; இயல்பான தமிழில் கட்டாயமான உறுதிமொழியைச் சுட்ட ‘என்னிடம் ஆணையிட்டு’ என வழங்கப்பட்டுள்ளது.
- source_word: הִנֵּה אָנֹכִי מֵת
  choice: இதோ, நான் சாகப்போகிறேன்
  rationale: הִנֵּה என்பதன் கவன ஈர்ப்பை ‘இதோ’ காக்கிறது; מֵת இங்கு நெருங்கிவரும் மரணத்தைக் குறிக்கும் சூழ்நிலைப் பொருளில் வழங்கப்பட்டுள்ளது.
- source_word: כָּרִיתִי
  choice: நான் வெட்டிய
  rationale: அடிப்படைப் பொருளான ‘வெட்டு/தோண்டு’ என்பதையும் பாறைக் கல்லறைச் சூழலையும் காக்கும் நேரடி சொல்.
- source_word: אֶעֱלֶה נָּא
  choice: நான் போய் … அனுமதியுங்கள்
  rationale: நிலவியல் சார்ந்த ‘மேலே செல்வது’ தமிழில் இலக்கைச் சொல்லாமல் இயல்பற்றதாக இருப்பதால் இயக்கத்தை ‘போய்’ என்றும், נָא-வின் பணிவான வேண்டுகோளை ‘அனுமதியுங்கள்’ என்றும் வெளிப்படுத்துகிறது.
- source_word: וְאָשׁוּבָה
  choice: திரும்பிவர
  rationale: யோசேப்பு எகிப்துக்குத் திரும்புவேன் என்ற உறுதியைச் சுருக்கமாகவும் தெளிவாகவும் காக்கிறது.
