review_pass:
  verdict: revise
  source_fidelity: The draft conveys the overall sense, but הִשְׁבִּיעַנִי specifically means that Jacob made Joseph swear, not merely that he gave him an order. It also omits the locative emphasis of שָׁמָּה (“there”). The polite request introduced by נָא is better expressed explicitly as “தயவுசெய்து.”
  naturalness: The revised wording is natural modern standard Tamil and retains an appropriately respectful register for Joseph’s request to Pharaoh’s court.
  terminology: “சத்தியம் செய்ய வைத்தார்” accurately represents the causative oath expression. “அடக்கம் செய்ய” and “கல்லறை” are clear, suitable terms in this context. “இறக்கப்போகிறேன்” is more neutral and formal than “சாகப்போகிறேன்.”
  issues:
  - severity: medium
    issue: The expression for making an oath is weakened.
    rationale: “என்னிடம் ஆணையிட்டு” means ‘commanding me’ rather than ‘making me swear’ (הִשְׁבִּיעַנִי).
  - severity: low
    issue: The adverb ‘there’ is omitted.
    rationale: שָׁמָּה specifies the burial location and should be represented as “அங்கே.”
  - severity: low
    issue: The politeness of the request is only implicit.
    rationale: נָא carries a courteous plea; “தயவுசெய்து” expresses it naturally in Tamil.
