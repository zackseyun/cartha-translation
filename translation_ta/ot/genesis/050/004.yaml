translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் கதைநடைத் தெளிவும் பேணப்பட்டுள்ளன. ‘கண்களில் தயவு’ என்ற மூலமொழி உருவகம் புரியக்கூடியதால் தக்கவைக்கப்பட்டது. வசனம் அடுத்த வசனத்தில் தொடரும் நேரடி உரையைத் தொடங்குவதால் இறுதியில் முக்காற்புள்ளி பயன்படுத்தப்பட்டது.
