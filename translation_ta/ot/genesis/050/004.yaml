  - severity: low
    issue: ‘பார்வோன் கேட்கும்படி அவரிடம் சொல்லுங்கள்’ is redundant and slightly awkward.
    rationale: The phrase ‘பார்வோன் கேட்கும்படி’ already specifies the intended recipient/hearing. The added ‘அவரிடம்’ is not needed and may over-specify the manner of delivery.
