base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/004.yaml
  text: When the days of his mourning had passed[a], Joseph spoke to Pharaoh’s household, saying, “If I have now found favor in your eyes, please speak in Pharaoh’s hearing[b], saying,”
translation:
  language: ta
  text: 'அவருக்காக அழுத நாட்கள் முடிந்தபின்[a], யோசேப்பு பார்வோனின் இல்லத்தாரிடம், “உங்கள் கண்களில் எனக்குத் தயவு கிடைத்திருக்குமானால், தயவுசெய்து பார்வோன் கேட்கும்படி சொல்லுங்கள்[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்காகத் துக்கங்கொண்ட நாட்கள் முடிந்தபின்.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “பார்வோனின் செவிகளில்.” இது பார்வோன் கேட்கும்படி சொல்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: முடிந்தபின்
  rationale: காலப்பகுதி கடந்துவிட்டதை עבר குறிக்கிறது; அடுத்ததாக யோசேப்பு பேசிய நிகழ்வுடன் இயல்பாக இணைக்க ‘முடிந்தபின்’ பயன்படுத்தப்பட்டது.
- source_word: יְמֵי בְכִיתוֹ
  choice: அவருக்காக அழுத நாட்கள்
  rationale: בכי என்பதன் அடிப்படைப் பொருள் ‘அழுகை.’ இறுதிச்சடங்கு சார்ந்த துக்கச் சூழலைத் தெளிவுபடுத்தியும், மூலத்தின் ‘அழுத நாட்கள்’ என்ற உருவகத்தைப் பேணியும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אֶל־בֵּית פַּרְעֹה
  choice: பார்வோனின் வீட்டாரிடம்
  rationale: בית இங்கு கட்டிடத்தை மட்டும் அல்லாமல் அரச வீட்டைச் சேர்ந்த பணியாளர்களையும் அவையினரையும் குறிக்கிறது; ‘வீட்டார்’ அந்த சமூகப் பொருளையும் எபிரெய உருவகத்தையும் இயல்பாகத் தருகிறது.
- source_word: אִם־נָא מָצָאתִי חֵן בְּעֵינֵיכֶם
  choice: உங்கள் கண்களில் எனக்குத் தயவு கிடைத்திருக்குமானால்
  rationale: ‘ஒருவரின் கண்களில் தயவு கிடைத்தல்’ என்ற எபிரெய மரபுத்தொடரின் உருவகத்தைத் தமிழிலும் புரியக்கூடிய வகையில் பேணுகிறது; נָא தரும் பணிவான வேண்டுகோள் தொனி அடுத்துள்ள ‘தயவுசெய்து’ என்பதில் வெளிப்படுகிறது.
- source_word: דַּבְּרוּ נָא
  choice: தயவுசெய்து … அவரிடம் சொல்லுங்கள்
  rationale: பன்மை ஏவலும் வேண்டுகோள் இடைச்சொல்லும் மரியாதையான வேண்டுதலாக இயல்பான தமிழில் தரப்பட்டுள்ளன.
- source_word: בְּאָזְנֵי פַרְעֹה
  choice: பார்வோன் கேட்கும்படி
  rationale: சொல்லுக்குச் சொல் ‘பார்வோனின் செவிகளில்’ என்றாலும், ஒருவருக்குக் கேட்கும்படி செய்தியைத் தெரிவிப்பதே இம்மரபுத்தொடரின் பொருள்.
- source_word: לֵאמֹר
  choice: 'சொல்லுங்கள்:'
  rationale: யோசேப்பு பார்வோனிடம் தெரிவிக்க விரும்பும் செய்தியை அறிமுகப்படுத்துகிறது; செய்தி அடுத்த வசனத்தில் தொடர்வதால் முக்காற்புள்ளி இடப்பட்டது.
