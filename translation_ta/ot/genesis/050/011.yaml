base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/011.yaml
  text: When the inhabitants of the land[a], the Canaanites, saw the mourning at the threshing floor of Atad, they said, “This is a grievous mourning for the Egyptians.” Therefore its name was called Abel-mizraim[c][b], which is beyond the Jordan.
translation:
  language: ta
  text: அந்த நாட்டில் வாழ்ந்த கானானியர்கள், ஆத்தாதின் போரடிக்கும் களத்தில் நடந்த துக்க அனுசரிப்பைக் கண்டபோது, “எகிப்தியர்களுக்கு இது மிகுந்த துக்க அனுசரிப்பு” என்றார்கள். அதனால், யோர்தானுக்கு அப்பால்[b] இருந்த அந்த இடத்திற்கு ஆபேல்-மிஸ்ராயீம்[a] என்று பெயரிடப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆபேல்-மிஸ்ராயீம்” என்ற பெயர் எபிரெயத்தில் “எகிப்தின் துக்கம்” என்பதுபோல் ஒலிக்கிறது; கானானியர்கள் அந்த நிகழ்வை விவரித்த விதத்தை இது எதிரொலிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “யோர்தானுக்கு மறுபக்கத்தில்” என்றும் மொழிபெயர்க்கலாம்; இச்சொற்றொடரின் பொருள் பேசுபவரின் புவியியல் நோக்குநிலையைச் சார்ந்தது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַכְּנַעֲנִי
  choice: அந்த நாட்டில் வாழ்ந்த கானானியர்கள்
  rationale: ஒருமை வடிவிலுள்ள பங்கேற்புவினை இங்கு ஒரு கூட்டத்தைக் குறிக்கிறது; ‘கானானியர்’ என்பது அந்தக் குடியிருப்பாளர்களை அடையாளப்படுத்துகிறது. தமிழில் இயல்பான கூட்டுப் பன்மையாக மொழிபெயர்க்கப்பட்டது.
- source_word: הָאֵבֶל
  choice: துக்க அனுசரிப்பு
  rationale: இச்சொல் இறந்தவருக்காக மேற்கொள்ளப்படும் துக்கத்தையும் அதனுடன் தொடர்புடைய சடங்கு வெளிப்பாடுகளையும் குறிக்கிறது; சூழலுக்கு ஏற்றபடி ‘துக்க அனுசரிப்பு’ என வழங்கப்பட்டது.
- source_word: בְּגֹרֶן הָאָטָד
  choice: ஆத்தாதின் போரடிக்கும் களத்தில்
  rationale: גֹּרֶן என்பது தானியத்தைப் போரடிக்கும் களம். இடத்தைக் குறிக்கும் בְּ தமிழில் ‘-இல்’ என இயல்பாக வழங்கப்பட்டது.
- source_word: אֵבֶל כָּבֵד
  choice: மிகுந்த துக்க அனுசரிப்பு
  rationale: כָּבֵד என்பதன் அடிப்படைப் பொருள் ‘கனமானது’; இங்கு துக்கத்தின் தீவிரத்தைச் சுட்டுவதால், நவீன தமிழில் இயல்பான ‘மிகுந்த’ பயன்படுத்தப்பட்டது.
- source_word: לְמִצְרָיִם
  choice: எகிப்தியர்களுக்கு
  rationale: வடிவில் இடப்பெயரான ‘எகிப்து’ இருந்தாலும், சூழலில் துக்கம் அனுசரிக்கும் எகிப்தியக் குழுவைக் குறிக்கிறது.
- source_word: עַל כֵּן
  choice: அதனால்
  rationale: பெயரிடப்பட்டதற்கான காரணத்தை அறிமுகப்படுத்தும் இயல்பான தமிழ்ச் சொல்.
- source_word: קָרָא שְׁמָהּ
  choice: அந்த இடத்திற்கு … என்று பெயரிடப்பட்டது
  rationale: பெயரிட்டவர் யார் என்பதை மூல உரை குறிப்பிடாததால், தமிழிலும் செயப்பாட்டு வடிவம் பயன்படுத்தப்பட்டு குறிப்பிடப்படாத எழுவாய் சேர்க்கப்படவில்லை.
- source_word: אָבֵל מִצְרַיִם
  choice: ஆபேல்-மிஸ்ராயீம்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டது; אֵבֶל (‘துக்கம்’) என்பதுடனான சொல்விளையாட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால்
  rationale: ஆற்றின் மறுபக்கத்தைக் குறிக்கும் மரபான சொற்றொடர்; இது பேசுபவரின் புவியியல் நோக்குநிலையைச் சார்ந்தது.
