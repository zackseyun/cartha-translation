translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமச் சூழலுக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘போரடிக்கும் களம்’ சாதாரண வாசகருக்குப் புரியுமாறு தொழில்சார் இடப்பெயரைத் தெளிவுபடுத்துகிறது. இடப்பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற வகையில் ஒலிபெயர்க்கப்பட்டுள்ளன.
