  text: וַ/יָּבֹ֜אוּ עַד גֹּ֣רֶן הָאָטָ֗ד אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּ֨סְפְּדוּ שָׁ֔ם מִסְפֵּ֛ד גָּד֥וֹל וְ/כָבֵ֖ד מְאֹ֑ד וַ/יַּ֧עַשׂ לְ/אָבִ֛י/ו אֵ֖בֶל שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/010.yaml
  text: When they came to the threshing floor of Atad[a], which is beyond the Jordan, they lamented there with a very great and grievous lamentation[e][d][c][b], and he observed seven days of mourning for his father.
translation:
  language: ta
  text: அவர்கள் யோர்தானுக்கு அப்பால் இருந்த[b] ஆத்தாதின்[a] கதிரடிக்கும் களத்துக்கு வந்தபோது, அங்கே மிகப் பெரியதும் கடுமையானதுமான புலம்பலுடன் புலம்பினார்கள்.[c] அவன் தன் தந்தைக்காக ஏழு நாட்கள் துக்கம் அனுசரித்தான்.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆத்தாத்’ என்பது ‘முட்செடி’ அல்லது ‘முள்புதர்’ என்ற பொருளுடைய சொல்லுடன் தொடர்புடையதாக இருக்கலாம்; இங்கு அது இடப்பெயராக வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘யோர்தானுக்கு மறுபுறத்தில்’ / ‘யோர்தானின் மறுகரையில்.’
    reason: alternative_reading
  - marker: c
    text: எபிரெய மொழியில், ‘மிகப் பெரியதும் மிகவும் கனமானதுமான புலம்பல்’; இது துக்கத்தின் தீவிரத்தை வெளிப்படுத்தும் சொல்லாட்சி.
    reason: cultural_note
  - marker: d
    text: 'எபிரெய வினை ஒருமையில் உள்ளது: ‘அவன் துக்கம் அனுசரித்தான்.’ இது யோசேப்பைக் குறிப்பதாக இருக்கலாம்; சில மொழிபெயர்ப்புகள் சூழலுக்கேற்ப ‘அவர்கள்’ என்று தருகின்றன.'
    reason: alternative_reading
lexical_decisions:
- source_word: גֹּרֶן
  choice: கதிரடிக்கும் களம்
  rationale: தானியக் கதிர்களிலிருந்து மணிகளைப் பிரிக்கும் வேளாண் இடத்தைக் குறிக்கும் வழக்கமான பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: הָאָטָד
  choice: ஆத்தாத்
  rationale: இச்சூழலில் இது גֹּרֶן הָאָטָד என்ற இடப்பெயரின் பகுதியாகச் செயல்படுவதால், அதன் சொற்பொருளை மொழிபெயர்க்காமல் பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால்
  rationale: ஆற்றின் மறுபுறத்தைக் குறிக்கும் எபிரெய வழக்கைத் தக்கவைத்து, எந்தப் பக்கத்திலிருந்து பார்க்கப்படுகிறது என்பதைத் தேவையின்றி முடிவுசெய்யாமல் விடுகிறது.
- source_word: וַיִּסְפְּדוּ
  choice: புலம்பினார்கள்
  rationale: இறந்தவருக்காக வெளிப்படையாகவும் முறையாகவும் புலம்புவதைக் குறிக்கும் ספד வினையின் இறப்புச் சடங்கு சார்ந்த பொருளைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: מִסְפֵּד גָּדוֹל וְכָבֵד מְאֹד
  choice: மிகப் பெரியதும் கடுமையானதுமான புலம்பல்
  rationale: גָּדוֹל, כָבֵד, מְאֹד ஆகியவற்றின் தீவிரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘கனமான’ என்ற சொல் இங்கு மரத்தமிழாக ஒலிப்பதால் ‘கடுமையான’ எனப் பொருள்வழி தரப்பட்டுள்ளது.
- source_word: וַיַּעַשׂ ... אֵבֶל
  choice: துக்கம் அனுசரித்தான்
  rationale: ‘துக்கத்தைச் செய்தான்’ என்ற சொற்சொல் மொழிபெயர்ப்பைத் தவிர்த்து, குறிப்பிட்ட காலம் முறையாகத் துக்கம் கடைப்பிடித்ததை இயல்பாகத் தெரிவிக்கிறது.
- source_word: לְאָבִיו
  choice: தன் தந்தைக்காக
  rationale: மூன்றாம் ஆண் ஒருமை உடைமைப் பின்னொட்டைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: துக்க அனுசரிப்பின் கால அளவை நேரடியாகக் குறிக்கிறது.
theological_decisions:
- issue: பன்மை வினைகளுக்குப் பின் வரும் וַיַּעַשׂ என்ற ஒருமை வினையின் எழுவாய்
  choice: ‘அவன் ... துக்கம் அனுசரித்தான்’ என்று எபிரெய ஒருமையைத் தக்கவைத்தல்; சூழலில் இது யோசேப்பைக் குறிக்கும் வாய்ப்பு மிகுதி.
  alternative: குழுவை மொத்தமாகக் கருதி ‘அவர்கள் ... துக்கம் அனுசரித்தார்கள்’ என்று மொழிபெயர்த்தல்.
  rationale: மசோரா உரை ‘வந்தார்கள்’, ‘புலம்பினார்கள்’ என்ற பன்மையிலிருந்து ‘அவன் அனுசரித்தான்’ என்ற ஒருமைக்கு மாறுகிறது. அதைச் சீராக்காமல் பாதுகாப்பது மூல உரையின் கவனமாற்றத்தையும் யோசேப்பின் முதன்மைப் பங்கையும் பிரதிபலிக்கிறது; மாற்று வாசிப்பை அடிக்குறிப்பு குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கதிரடிக்கும் களம்’, ‘புலம்பல்’, ‘துக்கம் அனுசரித்தான்’ ஆகியவை வேளாண், இறப்புச் சடங்கு, காலக்கெடு கொண்ட துக்கம் ஆகிய மூலக் கருத்துகளை இயல்பாகத் தருகின்றன. எபிரெய ஒருமை வினையும் புவியியல் நோக்குநிலையின் தெளிவின்மையும் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
