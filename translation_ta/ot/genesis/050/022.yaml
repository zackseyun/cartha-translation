translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் ஒரே வாக்கியமாக இணைக்கப்பட்டுள்ள தகவல், தமிழில் இயல்பாகவும் தெளிவாகவும் வாசிக்க இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. ‘அங்கே இருந்தார்கள்’ என்பது எகிப்து என்ற இடக் குறிப்பை வீட்டாருக்கும் தெளிவாகப் பொருத்துகிறது.
