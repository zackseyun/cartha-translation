  yaml_path: translation/ot/genesis/050/022.yaml
  text: Joseph remained in Egypt[a], he and his father's household, and Joseph lived 110 years.
translation:
  language: ta
  text: யோசேப்பும் அவரது தந்தையின் வீட்டாரும் எகிப்தில் குடியிருந்தனர்[a]; யோசேப்பு 110 ஆண்டுகள் வாழ்ந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எகிப்தில் தங்கியிருந்தனர்.”
    reason: יָשַׁב் வினைச்சொல் இச்சூழலில் ‘குடியிரு,’ ‘தங்கியிரு,’ அல்லது ‘தொடர்ந்து வாழ்ந்திரு’ எனப் பொருள்படலாம். ‘குடியிருந்தனர்’ குடியிருப்பின் தொடர்ச்சியைக் காட்டுகிறது; ‘தங்கியிருந்தனர்’ ஏற்ற மாற்றாகும்.
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: தங்கியிருந்தார்
  rationale: ישב என்பதற்கு ‘குடியிரு, தங்கு, தொடர்ந்து இரு’ என்ற பொருள்கள் உண்டு. யாக்கோபின் மரணத்திற்குப் பிறகும் யோசேப்பு எகிப்திலேயே தொடர்ந்து வாழ்ந்ததைக் கதையின் சுருக்கச் சூழலில் ‘தங்கியிருந்தார்’ இயல்பாகத் தெரிவிக்கிறது; பின்னர் வரும் ויחי என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: בְּמִצְרַיִם
  choice: எகிப்திலேயே
  rationale: இது யோசேப்பு தங்கியிருந்த இடத்தைக் குறிக்கும் நேரடியான இடவேற்றுமைத் தொடர். தொடர்ந்திருத்தலைத் தமிழில் இயல்பாக வலியுறுத்த ‘-லேயே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הוּא וּבֵית אָבִיו
  choice: அவரும் அவருடைய தந்தையின் வீட்டாரும்
  rationale: בֵית இங்கு கட்டடத்தை மட்டும் அல்லாமல் குடும்பம் அல்லது விரிவான வீட்டுக் குழுவைக் குறிக்கிறது. ‘வீட்டார்’ அந்த சமூகப் பொருளை நவீன தமிழில் தெளிவாகக் கொண்டுவருகிறது.
- source_word: וַיְחִי
  choice: வாழ்ந்தார்
  rationale: חיה இங்கு யோசேப்பின் மொத்த ஆயுட்காலத்தை அறிமுகப்படுத்துகிறது. வயதைக் குறிப்பிடும் தமிழ்ச் சொல்லாக்கத்தில் ‘வாழ்ந்தார்’ இயல்பானது.
- source_word: מֵאָה וָעֶשֶׂר שָׁנִים
  choice: 110 ஆண்டுகள்
  rationale: மூலத்தின் எண்ணளவை அப்படியே காக்கிறது; நவீன வாசிப்புத் தெளிவுக்காக இலக்கங்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு நிலைபெற்ற பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
