base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/014.yaml
  text: Then Joseph returned to Egypt[a], he and his brothers and all who had gone up with him to bury his father[b], after he had buried his father.
translation:
  language: ta
  text: யோசேப்பு தன் தந்தையை அடக்கம் செய்தபின், அவனும் அவன் சகோதரர்களும், அவனுடைய தந்தையை அடக்கம் செய்வதற்காக அவனுடன் சென்றிருந்த[a] அனைவரும் எகிப்துக்குத் திரும்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொற்பட, ‘அவனுடன் மேலே சென்றிருந்த அனைவரும்.’ எகிப்திலிருந்து கானானுக்குச் செல்வதை ‘மேலே செல்வது’ என்று குறிப்பிடுவது வேதாகமத்தில் வழக்கமான மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பினார்கள்
  rationale: שׁוב என்பது முன்பு விட்டுச் சென்ற இடத்திற்குத் திரும்புவதைக் குறிக்கிறது. விரிவாக்கப்பட்ட கூட்டெழுவாய்க்கு ஏற்ப தமிழில் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִצְרַיְמָה
  choice: எகிப்துக்கு
  rationale: இறுதியில் உள்ள திசைச் சுட்டு ה, எகிப்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது; ‘எகிப்துக்கு’ என்பது இயல்பான தமிழ் வடிவம்.
- source_word: הוּא וְאֶחָיו
  choice: அவனும் அவன் சகோதரர்களும்
  rationale: יוסף என்ற முதன்மை எழுவாயைத் தொடர்ந்து வரும் வலியுறுத்தல்/விளக்க அமைப்பைத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: וְכָל הָעֹלִים אִתּוֹ
  choice: அவனுடன் சென்றிருந்த அனைவரும்
  rationale: עֹלִים என்பதன் சொற்பொருள் ‘மேலே செல்கிறவர்கள்’ என்றாலும், இங்கு எகிப்திலிருந்து கானானுக்குச் சென்ற முந்தைய பயணத்தில் உடன் சென்றவர்களைக் குறிக்கிறது. தமிழில் இயல்பாக இருக்க ‘சென்றிருந்த’ என வழங்கி, ஏறிச் செல்லும் எபிரெய மரபுத்தொடரை அடிக்குறிப்பில் குறிப்பிட்டுள்ளோம்.
- source_word: לִקְבֹּר אֶת־אָבִיו
  choice: அவனுடைய தந்தையை அடக்கம் செய்வதற்காக
  rationale: לְ உடன் வரும் வினையெச்ச அமைப்பு பயணத்தின் நோக்கத்தைத் தெரிவிக்கிறது.
- source_word: אַחֲרֵי קָבְרוֹ אֶת־אָבִיו
  choice: யோசேப்பு தன் தந்தையை அடக்கம் செய்தபின்
  rationale: אַחֲרֵי கால வரிசையைச் சுட்டுகிறது. இணைந்துள்ள ஒருமை ஆண்பால் பின்னொட்டு சூழலில் யோசேப்பைக் குறிக்கிறது; தமிழில் இயல்பும் தெளிவும் பெற பெயரை வெளிப்படையாகக் கொடுக்காமல் reflexive ‘தன்’ மூலம் யோசேப்பைச் சுட்டுகிறது.
