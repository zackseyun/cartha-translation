translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நீண்ட எழுவாய் அமைப்பு தமிழில் தெளிவாக அமைய காலவினையெச்சத் தொடர் முன்னிலைப்படுத்தப்பட்டுள்ளது; ‘தந்தை’ என்ற சொல் பொதுவாகப் புரியும் நவீன மரியாதைநடைக்காகத் தேர்ந்தெடுக்கப்பட்டது.
