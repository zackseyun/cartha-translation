base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/026.yaml
  text: So Joseph died at the age of a hundred and ten years[c][b][a], and they embalmed him and placed him in a coffin in Egypt.
translation:
  language: ta
  text: யோசேப்பு நூற்றுப்பத்து வயதில் இறந்தார். அவருடைய உடலைப் பதனிட்டு, எகிப்தில் ஒரு சவப்பெட்டியில் வைத்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சவப்பெட்டி’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் மற்ற இடங்களில் ‘பெட்டி’ அல்லது ‘பேழை’ என்றும் பொருள்படும்; இங்கு அடக்கச் சூழலில் அது சவப்பெட்டியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தார்
  rationale: מות என்ற வினை இறப்பை நேரடியாகக் குறிக்கிறது; மரியாதையுடனும் இயல்பாகவும் உள்ள நேரடி தமிழ் இணை இது.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: நூற்றுப்பத்து வயதில்
  rationale: எபிரெய மொழியில் வயதைச் சொல்லப் பயன்படும் ‘... ஆண்டுகளின் மகன்’ என்ற மரபுத்தொடரை இயல்பான நவீன தமிழில் இவ்வாறு வழங்குகிறது.
- source_word: וַיַּחַנְטוּ
  choice: அவருடைய உடலைப் பதனிட்டு
  rationale: חנט என்பது, குறிப்பாக எகிப்தியச் சூழலில், சடலத்தை அழியாமல் பாதுகாக்கும் முறையைக் குறிக்கிறது. ‘மம்மியாக்கி’ என்பதைவிட ‘உடலைப் பதனிட்டு’ என்பது வினையின் பொருளை மிகைப்படுத்தாமல் தெளிவாகத் தருகிறது.
- source_word: וַיִּישֶׂם
  choice: வைத்தார்கள்
  rationale: שׂים என்பதன் பொதுவான ‘வை/இடு’ என்ற பொருளை இயல்பான தமிழில் வழங்குகிறது; ஒருமை வடிவம் பெயரிடப்படாத பன்மைச் செய்பவர்களைக் குறிக்கும் சூழலில் தமிழில் பன்மையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בָּאָרוֹן
  choice: ஒரு சவப்பெட்டியில்
  rationale: אָרוֹן என்பது பெட்டி, பேழை, அல்லது சவப்பெட்டி எனச் சூழலுக்கேற்ப பொருள்படும். இங்கு உடலைப் பதனிடும் அடக்கச் சூழல் ‘சவப்பெட்டி’ என்பதைக் கோருகிறது.
- source_word: בְּמִצְרָיִם
  choice: எகிப்தில்
  rationale: இடப்பெயரின் வழக்கமான தமிழ் வடிவம்.
- source_word: וַ
  choice: புதிய வாக்கியத் தொடர்ச்சியால் வெளிப்படுத்தப்பட்டது
  rationale: தொடக்க வாவ் முந்தைய நிகழ்வைத் தொடர்ந்து இறுதி நிகழ்வை அறிமுகப்படுத்துகிறது. தமிழில் கட்டாயமாக ‘ஆகவே’ சேர்ப்பது காரணவியல் நுணுக்கத்தை மிகைப்படுத்தக்கூடும்; இயல்பான கதைத் தொடரால் அதன் பணி வெளிப்படுகிறது.
