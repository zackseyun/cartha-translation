base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/002.yaml
  text: Then Joseph commanded his servants[a], the physicians, to embalm his father[b], and the physicians embalmed Israel.
translation:
  language: ta
  text: பின்பு யோசேப்பு தன் பணியாளர்களான[a] மருத்துவர்களுக்குத் தன் தந்தையின் உடலைப் பதப்படுத்தும்படி கட்டளையிட்டான்; மருத்துவர்கள் இஸ்ரவேலின் உடலைப் பதப்படுத்தினார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் அடிமைகளான”; எபிரெயச் சொல் சூழலுக்கு ஏற்ப பணியாளர்களையோ அடிமைகளையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “இஸ்ரவேல்,” அதாவது யாக்கோபு.
    reason: name_clarification
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டான்
  rationale: צוה என்பது அதிகாரத்துடன் உத்தரவிடுவதைக் குறிக்கிறது; ‘கட்டளையிட்டான்’ அதன் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: עֲבָדָיו
  choice: தன் பணியாளர்களாகிய
  rationale: עבד என்பது சூழலுக்கு ஏற்ப பணியாளர் அல்லது அடிமை எனப் பொருள்படலாம். இங்கு அரண்மனைச் சேவையில் மருத்துவப் பணி செய்பவர்கள் முன்னிலைப்படுவதால் ‘பணியாளர்கள்’ பொருத்தமானது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הָרֹפְאִים
  choice: மருத்துவர்கள்
  rationale: רפא வேரிலிருந்து வந்த இச்சொல் குணப்படுத்தும் தொழிலைச் செய்பவர்களைக் குறிக்கிறது; நவீனத் தமிழில் ‘மருத்துவர்கள்’ தெளிவும் கண்ணியமும் உடையது.
- source_word: לַחֲנֹט / וַיַּחַנְטוּ
  choice: உடலைப் பதப்படுத்த / உடலைப் பதப்படுத்தினார்கள்
  rationale: חנט இச்சூழலில் எகிப்திய முறையில் இறந்த உடலை அழியாமல் பாதுகாக்கத் தயார் செய்வதைக் குறிக்கிறது. ‘உடலைப் பதப்படுத்துதல்’ தமிழில் செயலைத் தெளிவாக உணர்த்துகிறது; இரு இடங்களிலும் ஒரே சொல்லாக்கம் காக்கப்படுகிறது.
- source_word: אָבִיו
  choice: தன் தந்தையின்
  rationale: எளிய உடைமைத் தொடர்பைக் குறிக்கிறது; தமிழில் எழுவாயைக் குறிக்கும் இயல்பான தற்படர்க்கைப் பெயரான ‘தன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: எபிரெய மூலத்தில் ‘யாக்கோபு’ என்பதற்குப் பதிலாக ‘இஸ்ரவேல்’ என்ற பெயரே உள்ளது; அந்தப் பெயர்த் தேர்வு மாற்றமின்றிக் காக்கப்படுகிறது.
theological_decisions:
- issue: עבד என்பதன் சமூக நிலையைத் தமிழில் எடுத்துரைத்தல்
  choice: பணியாளர்கள்
  alternative: அடிமைகள்
  rationale: இவ்வசனத்தின் கவனம் அவர்களுடைய அடிமை நிலைமையில் அல்ல, யோசேப்பின் கீழ் மருத்துவர்களாக அவர்கள் செய்த பணியில் உள்ளது. எனினும் எபிரெயச் சொல்லுக்குள்ள ‘அடிமைகள்’ என்ற சாத்தியம் மறைக்கப்படாமல் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: தந்தையைக் குறிக்கும் இறுதி பெயர்
  choice: இஸ்ரவேல்
  alternative: யாக்கோபு
  rationale: மூல உரையின் பெயரியல் மாற்றத்தையும் அதன் சாத்தியமான இலக்கிய அல்லது இறையியல் நுணுக்கத்தையும் அழிக்காமல், ‘இஸ்ரவேல்’ அப்படியே காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘எம்பாம் செய்தல்’ போன்ற ஒலிபெயர்ப்பைத் தவிர்த்து, பொதுவாசகர்களுக்குப் புரியும் ‘உடலைப் பதப்படுத்துதல்’ பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் மீளுரையும் ‘இஸ்ரவேல்’ என்ற பெயர்த் தேர்வும் காக்கப்பட்டுள்ளன.
