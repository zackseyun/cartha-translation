- source_word: וַיְצַוּוּ אֶל־יוֹסֵף
  choice: அவர்கள் யோசேப்புக்குச் செய்தி அனுப்பி
  rationale: צוה என்பதன் வழக்கமான பொருள் ‘கட்டளையிடுதல்.’ எனினும் אֶל־יוֹסֵף என்பதுடனும் தொடர்ந்து வரும் மறைமுக மேற்கோளுடனும் இங்கு அது யோசேப்புக்குச் செய்தியைத் தெரிவிக்கச் செய்தல் என்ற சூழல்சார் பொருளைக் கொண்டிருக்க வாய்ப்புள்ளது. இயல்பான தமிழுக்காக ‘செய்தி அனுப்பி’ என மொழிபெயர்க்கப்பட்டு, சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֵאמֹר
  choice: என்றார்கள்
  rationale: முதலாவது לֵאמֹר அறிவிக்கப்படும் பேச்சை அறிமுகப்படுத்துகிறது; தமிழில் ‘என்றார்கள்’ இயல்பாகக் கதைநடையை நிறைவு செய்கிறது.
- source_word: אָבִיךָ
  choice: உங்கள் தந்தை
  rationale: யோசேப்பை நோக்கிய இரண்டாம் நபர் ஒருமைப் possessive. மரியாதையும் இயல்பான நவீனத் தமிழும் கருதி ‘உங்கள்’ பயன்படுத்தப்படுகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்டார்
