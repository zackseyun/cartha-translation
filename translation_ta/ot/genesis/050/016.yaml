  language: ta
  text: 'ஆகவே அவர்கள் யோசேப்புக்குச் செய்தி அனுப்பினர்[a]: “உங்கள் தந்தை இறப்பதற்கு முன் இவ்வாறு கட்டளையிட்டார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சார்பாக, “அவர்கள் யோசேப்புக்குக் கட்டளையிட்டார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் பொதுவாக “கட்டளையிடு” என்று பொருள்படும்; ஆனால் இங்கு யோசேப்புக்குச் செய்தி அனுப்பியதைக் குறிக்கலாம்.
    reason: lexical_alternative
