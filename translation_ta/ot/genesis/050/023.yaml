base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/023.yaml
  text: Joseph saw Ephraim’s children to the third generation[a]. Also[b], the children of Machir son of Manasseh were born on Joseph’s knees.
translation:
  language: ta
  text: யோசேப்பு எப்பிராயீமின் மூன்றாம் தலைமுறை வரையான பிள்ளைகளைக் கண்டார்.[a] மனாசேயின் மகன் மாகீரின் பிள்ளைகளும் யோசேப்பின் முழங்கால்களின் மேல் பிறந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எப்பிராயீமின் மூன்றாம் தலைமுறை வரையான பிள்ளைகளைக் காணும்வரை யோசேப்பு வாழ்ந்தார்.” எபிரெயத்தில் சொல்லுக்குச் சொல், “யோசேப்பு கண்டார்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “யோசேப்பின் முழங்கால்களின் மேல் பிறந்தார்கள்” என்பது குடும்ப அங்கீகாரம், வரவேற்பு, அல்லது அந்தப் பிள்ளைகளைச் சிறப்பாக ஏற்றுக்கொள்ளுதல் ஆகியவற்றைக் குறிக்கக்கூடிய ஓர் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டார்
  rationale: எபிரெய வினைச்சொல்லின் நேரடிப் பொருளான ‘கண்டார்’ என்பதைத் தக்கவைக்கிறது; இச்சூழலில் அவர் அந்தத் தலைமுறையைக் காணும்வரை வாழ்ந்தார் என்பதும் இயல்பாகக் குறிப்பாகிறது.
- source_word: לְאֶפְרַיִם
  choice: எப்பிராயீமின்
  rationale: வம்சவழித் தொடரைக் குறிக்கும் ל முன்னொட்டைத் தமிழில் இயல்பான உடைமை வேற்றுமையாக மொழிபெயர்க்கிறது.
- source_word: בְּנֵי שִׁלֵּשִׁים
  choice: மூன்றாம் தலைமுறைப் பிள்ளைகள்
  rationale: எப்பிராயீமிலிருந்து மூன்றாம் தலைமுறைவரை உள்ள சந்ததியைக் குறிக்கிறது; குறிப்பிட்ட உறவுமுறையை எபிரெயத்தைவிட அதிகமாக வரையறுக்கவில்லை.
- source_word: גַּם
  choice: -உம்
  rationale: இரண்டாம் கூற்றை முதலாவதுடன் கூடுதலாக இணைக்கும் எளிய, இயல்பான தமிழ் வடிவம்.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: மனாசேயின் மகன் மாகீரின் பிள்ளைகள்
  rationale: மாகீரை மனாசேயின் மகனாகத் தெளிவாக அடையாளப்படுத்தி, בְּנֵי என்பதன் வம்ச/பிள்ளைகள் என்ற பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: יֻלְּדוּ
  choice: பிறந்தார்கள்
  rationale: ילד வினையின் செயப்பாட்டு வடிவத்தை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: עַל בִּרְכֵּי יוֹסֵף
  choice: யோசேப்பின் முழங்கால்கள்மேல்
  rationale: குடும்ப அங்கீகாரம் அல்லது ஏற்றுக்கொள்ளுதலைக் குறிக்கக்கூடிய பண்பாட்டு உருவகத்தை விளக்கமாக மாற்றாமல் அப்படியே பாதுகாக்கிறது.
theological_decisions:
- issue: ‘யோசேப்பின் முழங்கால்கள்மேல் பிறந்தார்கள்’ என்ற சொற்றொடரின் துல்லியமான சமூகப் பொருள்
  choice: உருவகத்தை முதன்மை உரையில் நேரடியாகத் தக்கவைத்தல்
  alternative: யோசேப்பு அவர்களைத் தமது குடும்பத்தாராக ஏற்றுக்கொண்டார்
  rationale: இச்சொற்றொடர் குடும்ப அங்கீகாரம், வரவேற்பு அல்லது சிறப்பான ஏற்றுக்கொள்ளுதல் ஆகியவற்றைக் குறிக்கலாம்; ஆனால் அவற்றில் ஒன்றை மட்டும் உரைத் தெளிவாக நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிமையும் கொண்ட நடை. ‘கண்டார்’ மற்றும் ‘முழங்கால்கள்மேல் பிறந்தார்கள்’ என்பவை மூலத்தின் உருவத்தையும் தெளிவின்மையையும் தக்கவைக்கின்றன; தேவையான விளக்கம் அடிக்குறிப்புகளில் வழங்கப்பட்டுள்ளது.
