review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the brothers' fear, Joseph's possible hostility, and his recompense for their prior wrongdoing. However, “பகைத்தால் என்ன செய்வது?” adds an explicit “what shall we do?” nuance not present in the Hebrew; the source poses their apprehension about what Joseph may do. The intensive construction in וְהָשֵׁב יָשִׁיב is well represented by “முழுமையாக,” while “பழிவாங்க” is contextually suitable.
  naturalness: The Tamil is generally fluent and clear. Recasting the first clause as a direct apprehensive question more naturally follows the Hebrew and avoids the added response-oriented question. “தந்தை” is the more neutral modern-standard term here.
  terminology: Names and key relational terminology are sound. “தீமை” and “பழிவாங்குவானோ” appropriately communicate the moral and retaliatory context without asserting Joseph's actual intention.
  issues:
  - severity: medium
    issue: “யோசேப்பு நம்மைப் பகைத்தால் என்ன செய்வது?” adds an explicit question about the brothers' own course of action.
    rationale: לוּ יִשְׂטְמֵנוּ יוֹסֵף expresses their anxious possibility—whether Joseph may hate/bear hostility toward them—not a stated question about what they themselves should do. A direct “...வானோ?” rendering retains the source's apprehensive ambiguity.
  revised_text: யோசேப்பின் சகோதரர்கள் தங்கள் தந்தை இறந்துவிட்டதைக் கண்டபோது, “யோசேப்பு நம்மைப் பகைத்துக்கொண்டு, நாம் அவனுக்குச் செய்த எல்லாத் தீமைக்கும் அவன் நம்மை முழுமையாகப் பழிவாங்குவானோ?” என்று சொன்னார்கள்.
