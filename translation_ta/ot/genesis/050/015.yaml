source:
  edition: WLC
  text: וַ/יִּרְא֤וּ אֲחֵֽי יוֹסֵף֙ כִּי מֵ֣ת אֲבִי/הֶ֔ם וַ/יֹּ֣אמְר֔וּ ל֥וּ יִשְׂטְמֵ֖/נוּ יוֹסֵ֑ף וְ/הָשֵׁ֤ב יָשִׁיב֙ לָ֔/נוּ אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֥ר גָּמַ֖לְנוּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/015.yaml
  text: When Joseph’s brothers saw that their father was dead, they said, “What if Joseph hates us and fully repays us for all the evil that we did to him?”
translation:
  language: ta
  text: யோசேப்பின் சகோதரர்கள் தங்கள் தந்தை இறந்துவிட்டதைக் கண்டபோது, “யோசேப்பு நம்மைப் பகைத்துக்கொண்டு, நாம் அவனுக்குச் செய்த எல்லாத் தீமைக்கும் அவன் நம்மை முழுமையாகப் பழிவாங்குவானோ?” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לוּ יִשְׂטְמֵנוּ
  choice: நம்மைப் பகைத்தால் என்ன செய்வது?
  rationale: לוּ இங்கு அச்சம் கலந்த சாத்தியத்தை வெளிப்படுத்துகிறது; שׂטם என்பது ஆழ்ந்த பகை அல்லது விரோதம் கொள்வதைக் குறிக்கிறது. இயல்பான நவீன தமிழில் சகோதரர்களின் அச்சத்தைத் தெளிவாகத் தருகிறது.
- source_word: וְהָשֵׁב יָשִׁיב לָנוּ
  choice: அவன் நம்மை முழுமையாகப் பழிவாங்கக்கூடும்
  rationale: முற்றுப்பெயருடன் வந்த வினைச்சொல் வலியுறுத்தலைக் கொண்டுள்ளது. சூழலில் இது செய்த தீமைக்குப் பதிலடி கொடுப்பதைக் குறிக்கிறது; ‘முழுமையாக’ அந்த வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: כָּל־הָרָעָה אֲשֶׁר גָּמַלְנוּ אֹתוֹ
  choice: நாம் அவனுக்குச் செய்த எல்லாத் தீமைக்கும்
  rationale: גמל இங்கு ஒருவரிடம் ஒரு செயலைச் செய்தல் அல்லது அவருக்கு உரிய விதத்தில் நடத்துதல் என்ற பொருளில் எதிர்மறைச் சூழலில் வருகிறது; ‘செய்த எல்லாத் தீமை’ இயல்பாகவும் மூலப்பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: אָבִיהֶם
  choice: தங்கள் தகப்பன்
  rationale: ‘அவர்களுடைய தகப்பன்’ என்பதைக் காட்டிலும் உருபொருந்திய ‘தங்கள்’ தமிழில் இயல்பானது; ‘தகப்பன்’ கண்ணியமான வேதாகம நடையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: யோசேப்பின் மனநிலையை உறுதிப்படுத்தாமல் சகோதரர்களின் அச்சமாக வைத்தல்
  choice: “பகைத்தால் என்ன செய்வது?... பழிவாங்கக்கூடும்”
  alternative: “யோசேப்பு நிச்சயமாக நம்மைப் பகைத்து... பழிவாங்குவான்”
  rationale: எபிரெய உரை யோசேப்பின் உண்மையான நோக்கத்தை அறிவிப்பதில்லை; சகோதரர்களின் அச்சத்தையும் ஊகத்தையும் மட்டுமே வெளிப்படுத்துகிறது. ஆகவே அதை உறுதியான கூற்றாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான வாக்கிய அமைப்புடன் கண்ணியமான வேதாகம நடை. மூலத்தில் உள்ள அச்சம் சார்ந்த சாத்தியமும் வினைச்சொல் வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
