  source_fidelity: மூலத்தின் முக்கிய இணை அமைப்பான חָשַׁב (‘எண்ணு/நோக்கம்கொள்’) இரு இடங்களிலும் ஒரே வினையால் நன்றாகக் காக்கப்பட்டுள்ளது; ‘தீமை’ மற்றும் ‘நன்மை’ என்பதும் பொருத்தமானவை. ஆனால் ‘எனக்குத் தீமை செய்ய எண்ணினீர்கள்’ என்பது தமிழ் வழக்கில் ‘தீமை செய்வதை எண்ணினீர்கள்’ என்ற பொருளைத் தரலாம்; மூலத்தின் ‘எனக்கு எதிராகத் தீமையை எண்ணினீர்கள்/நோக்கினீர்கள்’ என்ற குறிக்கோள்-அமைப்பைத் தெளிவாக்க வேண்டும். மேலும் ‘இன்று நடப்பதை நிகழச் செய்து’ என்பது ‘நடப்பது’ மற்றும் ‘நிகழச் செய்வது’ என்ற தேவையற்ற மடக்கை உருவாக்குகிறது. כַּיּוֹם הַזֶּה குறிக்கும் இப்போது தென்படும் நிலையை ‘இன்று காணப்படுகிறபடி’ என இயல்பாகக் கூறலாம்.
  naturalness: ‘நீங்களோ’ மற்றும் ‘ஆனால்’ இணைப்பு இயல்பானது. திருத்தப்பட்ட வடிவத்தில் ‘எனக்கு எதிராகத் தீமையை எண்ணினீர்கள்’ மூலத்திற்கும் நவீன நிலையான தமிழ் நடைக்கும் தெளிவானது. ‘இன்று காணப்படுகிறபடி நிகழச் செய்து’ என்பது முழுமையாகச் சொற்சொல்லாக இல்லாவிட்டாலும், எபிரெய மரபுத்தொடரின் தற்போதைய, கண்கூடான விளைவு உணர்வைத் தக்கவைக்கிறது.
  terminology: ‘கடவுள்,’ ‘தீமை,’ ‘நன்மை,’ ‘உயிரோடு காக்க’ ஆகியவை சரியான, நடுநிலையான சொற்கள். ‘அநேகர்’ புரியக்கூடியதாயினும், நவீன பொதுநடையில் ‘பலருடைய உயிரைக் காக்க’ இயல்பாகவும், עַם רָב குறிக்கும் பெரும் எண்ணிக்கையையும் தெளிவாகவும் தருகிறது.
