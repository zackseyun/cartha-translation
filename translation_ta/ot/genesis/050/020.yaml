base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/020.yaml
  text: As for you[a], you intended evil against me, but God intended it for good, in order to bring about what is happening this day—to keep many people alive.
translation:
  language: ta
  text: நீங்களோ எனக்கு எதிராகத் தீமையை எண்ணினீர்கள்; ஆனால் கடவுள் அதை நன்மைக்காக எண்ணினார்; இன்று காணப்படுகிறபடி நிகழச் செய்து, பலருடைய உயிரைக் காக்கும்படி.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல் நெருக்கமாக: “இன்றிருப்பதுபோல் நிகழச் செய்து.” இந்த எபிரெய மரபுத்தொடர் இப்போது கண்கூடாகத் தெரியும் விளைவைச் சுட்டுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲשַׁבְתֶּם / חֲשָׁבָהּ
  choice: எண்ணினீர்கள் / எண்ணினார்
  rationale: இரு இடங்களிலும் ஒரே எபிரெய வினை வந்திருப்பதால், மனிதரின் தீய நோக்கத்துக்கும் கடவுளின் நல்ல நோக்கத்துக்கும் இடையிலான திட்டமிட்ட இணைப்பை ஒரே தமிழ் வினையால் காக்கிறது.
- source_word: עָלַי רָעָה
  choice: எனக்குத் தீமை செய்ய
  rationale: עָלַי இச்சூழலில் எதிர்மறையான நோக்கைக் குறிக்கிறது; רָעָה சகோதரர்களின் செயலில் உள்ள ஒழுக்கத் தீமையையும் தீங்கு விளைவிக்கும் நோக்கத்தையும் தக்கவைக்கிறது.
- source_word: לְטֹבָה
  choice: நன்மைக்காக
  rationale: ‘தீமை’ என்பதற்கு எதிராக நிற்கும் ‘நன்மை’ என்ற தெளிவான முரணைக் காக்கிறது.
- source_word: לְמַעַן עֲשֹׂה
  choice: நிகழச் செய்து ... காக்கும்படி
  rationale: לְמַעַן நோக்கத்தையும், עשה காணக்கூடிய வரலாற்று விளைவை ஏற்படுத்தியதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כַּיּוֹם הַזֶּה
  choice: இன்று நடப்பதை
  rationale: இப்போது கண்முன் காணப்படும் தற்போதைய விளைவைச் சுட்டும் எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לְהַחֲיֹת עַם רָב
  choice: அநேகரை உயிரோடு காக்க
  rationale: ஹிபீல் வடிவத்தின் ‘உயிரைப் பாதுகாத்தல்’ என்ற பொருளையும், עַם רָב குறிக்கும் பெரும் எண்ணிக்கையிலான மக்களையும் இயல்பாகக் கூறுகிறது.
theological_decisions:
- issue: 'மனிதத் தீமையும் கடவுளின் பராமரிப்பும்: חשב என்ற வினையின் இணை அமைப்பு'
  choice: சகோதரர்களுக்கும் கடவுளுக்கும் ‘எண்ணு’ என்ற ஒரே அடிப்படை வினையைப் பயன்படுத்துதல்
  alternative: மனிதர்களுக்கு ‘எண்ணினீர்கள்,’ கடவுளுக்கு ‘நன்மையாக மாற்றினார்’ என்று வேறு வினைகளைப் பயன்படுத்துதல்
  rationale: எபிரெயம் மனிதரின் தீய நோக்கையும் கடவுளின் நல்ல நோக்கையும் ஒரே வினையால் இணைக்கிறது. ‘மாற்றினார்’ என்பது மூலத்தில் இல்லாத தீர்வைச் சேர்க்கக்கூடும்; ஒரே வினையைத் தக்கவைப்பது கடவுளே ஒழுக்கத் தீமையின் ஆசிரியர் என்று கூறாமல், உரையின் இறையியல் இழுவிசையைப் பாதுகாக்கிறது.
- issue: רָעָה என்பதன் ஒழுக்கப் பொருள்
  choice: தீமை
  alternative: தீங்கு
  rationale: இங்கு சகோதரர்களின் குற்றமுள்ள நோக்கம் பேசப்படுவதால், வெறும் பாதிப்பைக் காட்டும் ‘தீங்கு’ என்பதைவிட ‘தீமை’ ஒழுக்கப் பாரத்தைச் சரியாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் உள்ள நடை. ‘நீங்களோ ... ஆனால்’ என்ற அமைப்பு எதிர்மறை ஒப்பீட்டைத் தெளிவாக்குகிறது; ‘எண்ணினீர்கள் / எண்ணினார்’ என்ற மீளுருவாக்கம் மூலத்தின் திட்டமிட்ட இணைப்பைக் காக்கிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய வாக்கிய முடிவில் இடப்பட்டுள்ளது.
