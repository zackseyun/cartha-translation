- from: நீங்களோ எனக்குத் தீமை செய்ய எண்ணினீர்கள்; ஆனால் இன்று நடப்பதை நிகழச் செய்து, அநேகரை உயிரோடு காக்கும்படி, கடவுள் அதையே நன்மைக்காக எண்ணினார்.[a]
  to: நீங்களோ எனக்கு எதிராகத் தீமையை எண்ணினீர்கள்; ஆனால் கடவுள் அதை நன்மைக்காக எண்ணினார்; இன்று காணப்படுகிறபடி நிகழச் செய்து, பலருடைய உயிரைக் காக்கும்படி.[a]
  rationale: ‘எனக்கு எதிராகத் தீமையை எண்ணினீர்கள்’ என்பது மூலத்தில் உள்ள adversative עָלַי மற்றும் חָשַׁב-ன் நோக்கப்பொருளைத் தெளிவாகத் தருகிறது; இரு חָשַׁב வடிவங்களுக்கும் ‘எண்ணு’ என்ற ஒரே வினை தொடர்கிறது. ‘இன்று காணப்படுகிறபடி நிகழச் செய்து’ என்பது עֲשׂוֹת כַּיּוֹם הַזֶּה-ன் நோக்கப்பொருளையும் இன்றைய கண்கூடான விளைவையும் தமிழில் மடக்கில்லாமல் வெளிப்படுத்துகிறது. இறுதி ‘காக்கும்படி’ முதன்மை வினையான ‘எண்ணினார்’ உடன் நோக்கத் தொடர்பில் இருப்பதால், மூலத்தின் לְמַעַן அமைப்பு பாதுகாக்கப்படுகிறது.
