  text: And Pharaoh said[a], “Go up and bury your father, as he made you swear.”
translation:
  language: ta
  text: பார்வோன், “மேலே சென்று, உன் தந்தை உன்னைச் சத்தியம் செய்ய வைத்தபடியே அவரை அடக்கம் செய்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: வாவ் தொடர் வடிவம் கதையை முன்னெடுத்துச் செல்கிறது. தமிழில் உரையாடலுக்குப் பின் வரும் ‘என்றான்’ இயல்பான கதைநடையைத் தருகிறது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரசரைக் குறிக்கும் மரபான தமிழ்ப் பெயர்ப்பு வடிவம்; இங்கு இது பெயர்/பட்டமாகச் செயல்படுகிறது.
- source_word: עֲלֵה
  choice: மேலே சென்று
  rationale: עלה என்பதன் திசைசார் பொருளான ‘மேலே செல்லுதல்’ என்பதைக் காக்கிறது; இச்சூழலில் எகிப்திலிருந்து கானானுக்குச் செல்வதைக் குறிக்கிறது.
- source_word: וּקְבֹר
  choice: அடக்கம் செய்
  rationale: கல்லறையில் புதைப்பதைக் குறிக்கும் קבר என்பதற்கு நவீனத் தமிழில் இயல்பாகவும் மரியாதையாகவும் உள்ள சொற்றொடர்.
- source_word: אֶת אָבִיךָ
  choice: உன் தந்தை ... அவரை
  rationale: நேரடிச் செயப்படுபொருளையும் இரண்டாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டையும் தெளிவான இயல்புத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר
  choice: படியே
  rationale: ஒப்புமை அல்லது முறையைச் சுட்டும் எபிரெயச் சொல்லைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הִשְׁבִּיעֶךָ
  choice: உன்னிடம் சத்தியம் வாங்கிய
  rationale: שׁבע என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளை, தந்தை யோசேப்பைச் சத்தியம் செய்ய வைத்தார் என்ற வகையில் இயல்பான தமிழில் காக்கிறது.
