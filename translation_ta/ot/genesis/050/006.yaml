  naturalness: வரைவு பொதுவாக இயல்பாக உள்ளது. ஆனால் ‘உன்னிடம் சத்தியம் வாங்கிய’ என்பது பேசுவழக்கில் ஏற்கத்தக்கதாக இருந்தாலும், மூலத்தின் ‘சத்தியம் செய்ய வைத்த’ என்ற காரணவினை வலிமையைச் சற்றே மறைக்கலாம். ‘உன்னைச் சத்தியம் செய்ய வைத்த’ என்பது தெளிவாகவும் நவீன பொதுத்தமிழுக்கு இயல்பாகவும் உள்ளது.
