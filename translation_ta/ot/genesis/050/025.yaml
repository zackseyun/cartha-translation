  yaml_path: translation/ot/genesis/050/025.yaml
  text: Then Joseph made the sons of Israel swear, saying, “God will surely attend to you, and you must bring up my bones from here.”
translation:
  language: ta
  text: அப்போது யோசேப்பு இஸ்ரவேல் மக்களிடம் சத்தியம் வாங்கி, “கடவுள் நிச்சயமாக உங்களைக் கவனித்துக்கொள்வார்; அப்போது நீங்கள் இங்கிருந்து என் எலும்புகளை எடுத்துக்கொண்டு செல்ல வேண்டும்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁבַּע
  choice: ஆணையிட்டு
  rationale: ஹிஃபில் வடிவம் பிறரை ஆணையிடச் செய்வதை உணர்த்துகிறது; தமிழில் ‘அவர்களிடம் ஆணையிட்டு’ என்பது இயல்பாக அந்த causative பொருளைத் தருகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சூழலில் இது யாக்கோபின் நேரடி மகன்களை மட்டும் அல்லாமல் இஸ்ரவேல் சமூகத்தாரைக் குறிக்கக்கூடும்; ‘மக்கள்’ அந்தக் கூட்டு அர்த்தத்தை இயல்பாகத் தருகிறது.
- source_word: פָּקֹד יִפְקֹד
  choice: நிச்சயமாக … கவனித்துக்கொள்வார்
  rationale: ஒரே வேர்ச்சொல்லின் infinitive absolute + finite verb அமைப்பு உறுதியை வலியுறுத்துகிறது. פקד இங்கு கடவுள் தம் மக்களுக்காகச் செயல்படுவதைக் குறிக்கிறது; ‘கவனித்துக்கொள்வார்’ என்பது ‘சந்திப்பார்’ என்பதைவிட இயல்பானது.
- source_word: וְהַעֲלִתֶם
  choice: எடுத்துக்கொண்டு போக வேண்டும்
  rationale: இது ‘மேலே கொண்டு செல்லுதல்’ என்ற causative வினை; எகிப்திலிருந்து வரவிருக்கும் புறப்பாட்டை நோக்கிய கட்டளையின் கடமையை ‘வேண்டும்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַצְמֹתַי
  choice: என் எலும்புகளை
  rationale: மூலத்தின் நேரடியான உடல்சார் சொல்லை அப்படியே பாதுகாக்கிறது.
theological_decisions:
- issue: פקד என்ற வினையின் தெய்வீகச் செயல்
  choice: கடவுள் நிச்சயமாக உங்களைக் கவனித்துக்கொள்வார்
  alternative: கடவுள் நிச்சயமாக உங்களைச் சந்திப்பார்
  rationale: இங்கு ‘வருகை’ மட்டும் அல்லாமல், உடன்படிக்கை மக்களுக்காகக் கடவுள் தலையிட்டுச் செயல்படுவது நோக்கமாக உள்ளது. இருப்பினும் குறிப்பிட்ட செயல்முறையை மொழிபெயர்ப்பு மிகையாக நிர்ணயிக்கவில்லை.
- issue: וְהַעֲלִתֶם என்பதின் modal வலிமை
  choice: போக வேண்டும்
  alternative: எடுத்துக்கொண்டு போவீர்கள்
  rationale: ஆணையின் சூழலில் இணைப்புடன் வரும் perfect வடிவம் வெறும் எதிர்கால முன்னறிவிப்பை விட அவர்கள் ஏற்றுக்கொண்ட கடமையைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘இஸ்ரவேலின் மக்கள்’ என்பது ‘இஸ்ரவேலின் புத்திரர்’ என்ற பழைய நடைமொழியைத் தவிர்த்து, கூட்டு மக்களைக் குறிக்கும் பொருளைப் பாதுகாக்கிறது. மேற்கோளுக்குள் ‘அப்போது’ சேர்க்கப்பட்டது; அது கடவுளின் கவனிப்பைத் தொடர்ந்து எலும்புகளை எடுத்துச் செல்ல வேண்டிய காலத் தொடர்பைத் தமிழில் தெளிவாக்குகிறது.
