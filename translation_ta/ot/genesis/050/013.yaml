  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. நீளமான எபிரெய உறவுத்தொடர் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; இதனால் வாங்கப்பட்டது மக்பேலா நிலம் என்பது தெளிவாகிறது, ஆனால் மூலத்திலுள்ள அனைத்து தகவல்களும் காக்கப்படுகின்றன.
