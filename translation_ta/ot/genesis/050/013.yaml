base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/013.yaml
  text: His sons carried him to the land of Canaan and buried him in the cave of the field of Machpelah[a], which Abraham had bought with the field as a burial property from Ephron the Hittite[c][b], opposite Mamre.
translation:
  language: ta
  text: அவருடைய மகன்கள் அவரைச் சுமந்துகொண்டு கானான் நாட்டுக்குப் போய், மம்ரேக்கு எதிரே உள்ள மக்பேலா வயலின் குகையில் அவரை அடக்கம் செய்தார்கள். அந்த வயலை ஆபிரகாம் அடக்க இடத்திற்கான உடைமையாக[a] ஏத்தியனான எப்ரோனிடமிருந்து வாங்கியிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அடக்கத்திற்கான நிரந்தர உடைமையாக.” எபிரெயச் சொற்றொடர், அந்த வயல் அடக்கத்திற்கென உரிமையுடன் பெற்ற சொத்து என்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: அவரை ... கொண்டுபோய்
  rationale: נשׂא இச்சூழலில் யாக்கோபின் உடலைத் தூக்கிச் செல்வதைக் குறிக்கிறது. தமிழில் “கொண்டுபோய்” இயல்பாகவும் தெளிவாகவும் அந்த இடமாற்றத்தைத் தெரிவிக்கிறது.
- source_word: בָנָיו
  choice: அவருடைய மகன்கள்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையில் குறிப்பாக “மகன்கள்” என்று கூறுவதால் அதே பாலினத் துல்லியம் காக்கப்படுகிறது.
- source_word: אַרְצָה כְּנַעַן
  choice: கானான் நாட்டுக்கு
  rationale: திசைநோக்கைக் காட்டும் வடிவமும் “நாடு” என்ற பெயர்ச்சொல்லும் இயல்பான நவீனத் தமிழில் முழுமையாக வெளிப்படுகின்றன.
- source_word: בִּמְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: மக்பேலா நிலத்திலுள்ள குகையில்
  rationale: எபிரெயச் சேர்க்கைத் தொடரின் குகை–நிலம்–மக்பேலா உறவைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: அந்த நிலத்தை ஆபிரகாம் ... வாங்கியிருந்தார்
  rationale: எபிரெயில் நேரடி செயப்படுபொருளாக “நிலம்” மீண்டும் குறிப்பிடப்படுவதைக் காக்கிறது; ஆங்கிலத்திலுள்ள குழப்பமான “with the field” அமைப்பைத் தவிர்த்து, வாங்கப்பட்டது நிலமே என்பதைத் தெளிவாக்குகிறது.
- source_word: לַאֲחֻזַּת קֶבֶר
  choice: கல்லறைக்கான உரிமைச் சொத்தாக
  rationale: אֲחֻזָּה என்பதிலுள்ள நிலையான உடைமை அல்லது உரிமைப் பொருளையும், கல்லறைப் பயன்பாட்டையும் ஒருங்கே தெரிவிக்கிறது.
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: ஏத்தியனான எப்ரோனிடமிருந்து
  rationale: மூலத்தின் இன அடையாளத்தையும் விற்பவரின் பெயரையும் இயல்பான தமிழில் காக்கிறது.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: மம்ரேக்கு எதிரே
  rationale: மம்ரேவுடன் தொடர்புடைய இட அமைப்பை “அருகே” என்று பொதுமைப்படுத்தாமல், முன்னால் அல்லது எதிரே என்ற இடவியல் பொருளுடன் வழங்குகிறது.
