- from: அவருடைய மகன்கள் அவரை கானான் நாட்டுக்குக் கொண்டுபோய், மம்ரேக்கு எதிரே[b] இருந்த மக்பேலா நிலத்திலுள்ள குகையில் அடக்கம் செய்தார்கள். அந்த நிலத்தை ஆபிரகாம் கல்லறைக்கான உரிமைச் சொத்தாக[a] ஏத்தியனான எப்ரோனிடமிருந்து வாங்கியிருந்தார்.
  to: அவருடைய மகன்கள் அவரைச் சுமந்துகொண்டு கானான் நாட்டுக்குப் போய், மம்ரேக்கு எதிரே உள்ள மக்பேலா வயலின் குகையில் அவரை அடக்கம் செய்தார்கள். அந்த வயலை ஆபிரகாம் அடக்க இடத்திற்கான உடைமையாக[a] ஏத்தியனான எப்ரோனிடமிருந்து வாங்கியிருந்தார்.
  rationale: மறுஅமைப்பு மூலத்தில் உள்ள உடலைச் சுமந்து சென்ற செயலைத் தெளிவாகக் காட்டுகிறது; மக்பேலா வயலின் குகை என்றும், ஆபிரகாம் வாங்கியது அந்த வயலே என்றும் இயல்பான தமிழ் வாக்கியங்களில் வெளிப்படுத்துகிறது. “அடக்க இடத்திற்கான உடைமை” என்பது אֲחֻזַּת קֶבֶר என்பதிலுள்ள நிலையான உடைமை மற்றும் அடக்க நோக்கம் ஆகிய இரண்டையும் காக்கிறது. இடவியல் மாற்றுப்பொருளுக்கான b குறிப்பு தொடர்ந்தும் வழங்கப்படுகிறது; உரையில் அந்த இடத்தில் நேரடி அடிக்குறிப்பு அடையாளம் தேவையில்லை எனில் வெளியீட்டு அமைப்பில் b-ஐ நீக்கலாம், ஆனால் இம்மதிப்பாய்வில் வழங்கப்பட்ட அடிக்குறிப்புத் தொகுப்பு பாதுகாக்கப்பட்டுள்ளது.
