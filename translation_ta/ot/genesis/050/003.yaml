translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘உடலைப் பதப்படுத்துதல்’ என்பது பண்டைய எகிப்திய உடல் பாதுகாப்புச் செயல்முறையை சமயப்பிரிவு சாராத முறையில் தெளிவாகக் குறிக்கிறது.
