source:
  edition: WLC
  text: וַ/יִּמְלְאוּ ל/וֹ֙ אַרְבָּעִ֣ים י֔וֹם כִּ֛י כֵּ֥ן יִמְלְא֖וּ יְמֵ֣י הַ/חֲנֻטִ֑ים וַ/יִּבְכּ֥וּ אֹת֛/וֹ מִצְרַ֖יִם שִׁבְעִ֥ים יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/003.yaml
  text: Forty days were completed for him[a], for that is how the days of embalming are completed[b]; and Egypt wept for him seventy days.
translation:
  language: ta
  text: அவருக்காக நாற்பது நாட்கள் நிறைவடைந்தன; ஏனெனில், உடலைப் பதப்படுத்துவதற்கான நாட்கள் இவ்வாறுதான் நிறைவடையும்.[a] எகிப்து[b] அவருக்காக எழுபது நாட்கள் அழுதது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பதப்படுத்துவதற்கான நாட்கள் இவ்வாறே நிறைவேற்றப்படும்.”
    reason: alternative_reading
  - marker: b
    text: இங்கு “எகிப்து” என்பது எகிப்திய மக்களைக் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלְאוּ לּוֹ אַרְבָּעִים יוֹם
  choice: அவருக்காக நாற்பது நாட்கள் நிறைவடைந்தன
  rationale: מלא என்பது நிர்ணயிக்கப்பட்ட காலம் முழுமையடைந்ததைக் குறிக்கிறது. செய்பவர் குறிப்பிடப்படாத எபிரெய அமைப்பையும், காலமே வாக்கியத்தின் மையமாக இருப்பதையும் இந்த இயல்பான தமிழ் வடிவம் காக்கிறது.
- source_word: כִּי כֵן
  choice: ஏனெனில் ... இவ்வாறுதான்
  rationale: நாற்பது நாட்கள் ஏன் தேவைப்பட்டன என்பதை விளக்கும் காரணத் தொடர்பையும் வழக்கமான நடைமுறையையும் வெளிப்படுத்துகிறது.
- source_word: יִמְלְאוּ יְמֵי הַחֲנֻטִים
  choice: உடலைப் பதப்படுத்துவதற்கான நாட்கள் ... நிறைவடையும்
  rationale: சுற்றியுள்ள சூழலில் இறந்த யாக்கோபின் உடலைப் பாதுகாக்கும் பதப்படுத்தும் செயல்முறையே குறிக்கப்படுகிறது. செயப்படுபொருள் சார்ந்த எபிரெய வடிவத்தை தமிழில் புரியக்கூடிய செயல்முறைச் சொல்லாக்கமாக வழங்குகிறது.
- source_word: וַיִּבְכּוּ אֹתוֹ
  choice: அவருக்காக ... அழுதது
  rationale: בכה என்பதன் நேரடியான உணர்ச்சிப் பொருளான ‘அழுதல்’ காக்கப்படுகிறது; இதை முறைப்படியான துக்கச் சடங்காக மிகைவிளக்கம் செய்யவில்லை.
- source_word: מִצְרַיִם
  choice: எகிப்து
  rationale: மக்களைக் கூட்டாகக் குறிக்கும் இடப்பெயரை மூலத்தின் உருவகத்துக்கு ஏற்ப வைத்திருக்கிறது; அதன் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: שִׁבְעִים יוֹם
  choice: எழுபது நாட்கள்
  rationale: எண்ணும் கால அலகும் நேரடியாகவும் இயல்பான தமிழ் வரிசையிலும் மொழிபெயர்க்கப்பட்டுள்ளன.
