source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר אֲלֵ/הֶ֛ם יוֹסֵ֖ף אַל תִּירָ֑אוּ כִּ֛י הֲ/תַ֥חַת אֱלֹהִ֖ים אָֽנִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/019.yaml
  text: But Joseph said to them[a], “Do not fear, for am I in the place of God?”
translation:
  language: ta
  text: ஆனால் யோசேப்பு அவர்களிடம், “பயப்படாதீர்கள்; நான் கடவுளின் இடத்தில் இருக்கிறேனா?[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, “நான் கடவுளுக்குக் கீழ்ப்பட்டவனா?” எபிரெயச் சொற்றொடர் ஒரு மரபுத்தொடர்; இங்கு அதற்கு “நான் கடவுளின் இடத்தில் இருக்கிறேனா?” என்பதே மிகச் சாத்தியமான பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: எபிரெயக் கதைநடையில் אָמַר என்பதன் வழக்கமான உரையாடல் அறிமுகத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲלֵהֶם
  choice: அவர்களிடம்
  rationale: אֶל மற்றும் பன்மைச் சுட்டுப்பெயர் பின்னொட்டு, உரை யாரை நோக்கிச் சொல்லப்பட்டது என்பதைக் குறிக்கிறது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர்வடிவம்.
- source_word: אַל תִּירָאוּ
  choice: பயப்படாதீர்கள்
  rationale: எதிர்மறைக் கட்டளையின் பொருளை மரியாதைப் பன்மையுடன் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: כִּי
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு כִּי அடுத்துவரும் வினாவை ஆறுதலுக்கான காரணமாக அறிமுகப்படுத்துகிறது. தமிழில் இரண்டு அடுத்தடுத்த வாக்கியங்களின் தொடர்பே அந்த விளக்கப்பொருளை இயல்பாக வெளிப்படுத்துகிறது; ‘ஏனெனில்’ என்று சேர்ப்பது உரையாடலைச் சற்றுக் கடினமாக்கும்.
- source_word: הֲתַחַת
  choice: இடத்தில் இருக்கிறேனா?
  rationale: תַּחַת אֱלֹהִים என்ற சொற்றொடர் இச்சூழலில் கடவுளுக்குரிய இடத்தையோ அதிகாரத்தையோ ஒருவர் ஏற்றுக்கொள்வதைக் குறிக்கும் மொழிவழக்காகப் புரிந்துகொள்ளப்படுகிறது. கேள்வித்துகள் הֲ தமிழில் வினாவடிவத்தால் தெரிவிக்கப்படுகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும் இங்கு இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கும் வழக்கமான ஒருமைப் பயன்பாடு.
- source_word: אָנִי
  choice: நான்
  rationale: சுயாதீனச் சுட்டுப்பெயரின் வலியுறுத்தலை வினாவில் வெளிப்படையாகப் பேணுகிறது.
theological_decisions:
- issue: கடவுளுக்குரிய அதிகாரத்தைப் பற்றிய யோசேப்பின் வினாவின் பொருள்
  choice: பழிவாங்கும் நீதிபதியாகக் கடவுளின் இடத்தைத் தான் எடுத்துக்கொள்ளவில்லை என்று யோசேப்பு மறைமுகமாக மறுக்கிறார்.
  alternative: தான் கடவுளுக்குக் கீழ்ப்பட்டவனா என்று யோசேப்பு கேட்கிறார்.
  rationale: சகோதரர்கள் பழிவாங்கப்படுவோம் என்று அஞ்சும் உடனடிச் சூழலிலும், அடுத்த வசனத்தில் கடவுளின் நோக்கம் வலியுறுத்தப்படுவதாலும், ‘கடவுளின் இடத்தில்’ என்பதே மிக இயல்பான பொருள். ஆயினும் எபிரெயச் சொல்லின் நேரடிப் பரப்பை அடிக்குறிப்பில் பேணியுள்ளோம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பயப்படாதீர்கள்’ என்பது இயல்பான நேரடி ஆறுதல்; சொல்லாட்சியின் ஐயப்பாட்டை முதன்மை உரையில் தீர்மானமாக்காமல் அடிக்குறிப்பில் மாற்று வாசிப்பாகப் பேணியுள்ளோம்.
