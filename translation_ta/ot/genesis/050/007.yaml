base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/007.yaml
  text: So Joseph went up to bury his father[a], and with him went up all Pharaoh’s servants, the elders of his household, and all the elders of the land of Egypt.
translation:
  language: ta
  text: யோசேப்பு தன் தந்தையை அடக்கம் செய்ய ஏறிச் சென்றான்[a]. பார்வோனின் பணியாளர்கள் அனைவரும், பார்வோனின் வீட்டாரில் இருந்த மூப்பர்களும், எகிப்து நாட்டின் மூப்பர்கள் அனைவரும் அவனுடன் ஏறிச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், எகிப்திலிருந்து கானானுக்குச் செல்வது வழக்கமாக ‘ஏறிச் செல்வது’ என்று குறிப்பிடப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: ஏறிச் சென்றான்
  rationale: עָלָה என்பதன் ‘மேலே செல்/ஏறிச் செல்’ என்ற புவியியல் வழக்கைத் தக்கவைக்கிறது; எகிப்திலிருந்து கானானுக்குச் செல்வதை எபிரெய மொழி இவ்வாறு குறிப்பிடுகிறது.
- source_word: לִקְבֹּר
  choice: அடக்கம் செய்வதற்காக
  rationale: קָבַר என்பதன் ‘புதைத்தல்/அடக்கம் செய்தல்’ என்ற பொருளை, மரியாதையான நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: אָבִיו
  choice: தன் தந்தையை
  rationale: எபிரெய உரையிலுள்ள எளிய உடைமைப் பொருளைத் தெளிவான தமிழில் தருகிறது; தேவையற்ற வலியுறுத்தலைச் சேர்க்கவில்லை.
- source_word: וַיַּעֲלוּ אִתּוֹ
  choice: அவனுடன் ஏறிச் சென்றார்கள்
  rationale: மூலத்தில் மீண்டும் வரும் עָלָה வினையைத் தக்கவைத்து, கதையின் சொல்லோட்டத்தையும் புவியியல் நுணுக்கத்தையும் பாதுகாக்கிறது.
- source_word: כָּל עַבְדֵי פַרְעֹה
  choice: பார்வோனின் பணியாளர்கள் அனைவரும்
  rationale: עֶבֶד என்பதன் பரந்த ‘பணியாளர்/ஊழியர்’ பொருளைத் தருகிறது; இங்கு அவர்களுடைய பதவியை ‘அதிகாரிகள்’ என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: זִקְנֵי בֵיתוֹ
  choice: பார்வோனின் வீட்டாரின் மூப்பர்களும்
  rationale: זָקֵן என்பதைக் ‘மூப்பர்’ என்றும் בַּיִת என்பதைக் குடும்பம் மட்டுமல்லாமல் அரச வீட்டாரையும் குறிக்கக்கூடிய ‘வீட்டார்’ என்றும் தருகிறது. தமிழில் சுட்டுப்பெயர் குழப்பம் வராதபடி பார்வோனின் பெயர் மீண்டும் குறிப்பிடப்படுகிறது.
- source_word: וְכֹל זִקְנֵי אֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டின் மூப்பர்கள் அனைவரும்
  rationale: ‘மூப்பர்கள்’ என்பதையும் ‘நாடு’ என்பதையும் தக்கவைத்து, பார்வோனின் வீட்டாருக்கு அப்பாற்பட்ட விரிவான தேசியத் தலைமையைக் குறிக்கிறது.
