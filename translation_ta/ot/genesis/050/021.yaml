base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/021.yaml
  text: So now[a], do not be afraid. I myself will provide for you and your little ones.” Thus he comforted them and spoke to their hearts.
translation:
  language: ta
  text: “எனவே இப்போது பயப்படாதீர்கள். நானே உங்களையும் உங்கள் சிறுபிள்ளைகளையும் பராமரிப்பேன்” என்று அவர் கூறினார். இவ்வாறு அவர் அவர்களுக்கு ஆறுதலளித்து, அவர்களிடம் கனிவாகப் பேசினார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களுக்கு நம்பிக்கையூட்டும் விதமாகப் பேசினார்” என்றும் மொழிபெயர்க்கலாம்; சொல்லுக்குச் சொல், “அவர்களுடைய இதயத்தின் மீது பேசினார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: וְ என்பதன் இணைப்புத் தன்மையையும் עַתָּה என்பதன் காலக் குறிப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; யோசேப்பின் முடிவான உறுதியுரையையும் அறிமுகப்படுத்துகிறது.
- source_word: אַל תִּירָאוּ
  choice: பயப்படாதீர்கள்
  rationale: எதிர்மறைக் கட்டளையாக அமைந்துள்ள ஆறுதலுரையைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: אָנֹכִי
  choice: நானே
  rationale: தனி ஆள்பெயர்ச் சுட்டின் வலியுறுத்தலைப் பாதுகாத்து, யோசேப்பு தனிப்பட்ட முறையில் பொறுப்பேற்பதை வெளிப்படுத்துகிறது.
- source_word: אֲכַלְכֵּל
  choice: பராமரிப்பேன்
  rationale: உணவு உள்ளிட்ட பொருளாதாரத் தேவைகளைத் தொடர்ந்து வழங்கிப் பேணுதல் என்ற பொருளை, சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: טַפְּכֶם
  choice: உங்கள் சிறுபிள்ளைகள்
  rationale: சிறு குழந்தைகள் என்ற வயது நுணுக்கத்தையும் குடும்பப் பாசத்தின் தொனியையும் பாதுகாக்கிறது.
- source_word: וַיְנַחֵם אֹתָם
  choice: அவர் அவர்களுக்கு ஆறுதலளித்து
  rationale: נחם வினையின் ஆறுதல்படுத்துதல் என்ற பொருளை இயல்பாகத் தருகிறது; தொடரும் உரையாடல் செயலோடு தமிழில் சீராக இணைக்கிறது.
- source_word: וַיְדַבֵּר עַל לִבָּם
  choice: அவர்களுடைய உள்ளத்தோடு பேசினார்
  rationale: ‘அவர்களுடைய இதயம்/உள்ளத்தோடு பேசினார்’ என்ற எபிரெய உருவகத்தைப் பாதுகாக்கிறது; கனிவாகவும் நம்பிக்கையூட்டும் விதமாகவும் பேசினார் என்ற சொற்றொடரின் சூழல் பொருளை அடிக்குறிப்பு விளக்குகிறது.
