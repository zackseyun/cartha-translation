base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/008.yaml
  text: and all the household of Joseph[a], and his brothers, and his father's household; only their little ones, their flocks[c][b], and their herds they left in the land of Goshen.
translation:
  language: ta
  text: யோசேப்பின் குடும்பத்தார் அனைவரும், அவனுடைய சகோதரர்களும், அவனுடைய தந்தையின் குடும்பத்தாரும் சென்றார்கள்; தங்கள் சிறு பிள்ளைகளையும்[a], ஆட்டு மந்தைகளையும்[b], மாட்டு மந்தைகளையும் மட்டும் கோசேன் நாட்டில் விட்டுச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சிறு பிள்ளைகள்’ என்பது இளம் வயதுடைய பிள்ளைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆட்டு மந்தைகள்’ என்பதில் செம்மறியாடுகளும் வெள்ளாடுகளும் அடங்கலாம்.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְכֹל בֵּית יוֹסֵף
  choice: யோசேப்பின் குடும்பத்தார் அனைவரும்
  rationale: בֵּית என்பது இச்சூழலில் கட்டிடத்தை அல்ல, யோசேப்புடன் தொடர்புடைய குடும்பத்தாரை அல்லது வீட்டாரைக் குறிக்கிறது; כֹל என்பதன் முழுமையையும் ‘அனைவரும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְאֶחָיו
  choice: அவனுடைய சகோதரர்களும்
  rationale: பன்மை אָח இங்கு யோசேப்பின் ஆண் உடன்பிறந்தவர்களைக் குறிக்கிறது; ‘சகோதரர்கள்’ துல்லியமான நவீனத் தமிழ்.
- source_word: וּבֵית אָבִיו
  choice: அவனுடைய தந்தையின் குடும்பத்தாரும்
  rationale: בֵּית אָבִיו என்பது தந்தையின் கட்டிடத்தைவிட அவருடைய குடும்பம் அல்லது வீட்டாரைக் குறிக்கிறது.
- source_word: רַק טַפָּם
  choice: தங்கள் சிறு பிள்ளைகளையும் மட்டும்
  rationale: רַק விதிவிலக்கை வலியுறுத்துகிறது; טַף சிறுவயதுப் பிள்ளைகளைச் சுட்டுவதால் ‘சிறு பிள்ளைகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְצֹאנָם
  choice: ஆட்டு மந்தைகளையும்
  rationale: צֹאן என்பது பொதுவாக ஆடுகள் மற்றும் வெள்ளாடுகள் போன்ற சிறு கால்நடைகளின் கூட்டுப்பெயர்; இயல்பான தமிழில் ‘ஆட்டு மந்தைகள்’ என வழங்கப்பட்டது.
- source_word: וּבְקָרָם
  choice: மாட்டு மந்தைகளையும்
  rationale: בָּקָר என்பது மாடுகள் அல்லது பெரிய கால்நடைகளைக் குறிக்கும் கூட்டுப்பெயர்; ‘மாட்டு மந்தைகள்’ இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עָזְבוּ
  choice: விட்டுவிட்டார்கள்
  rationale: வினைச்சொல் இங்கு கைவிடுதலை அல்ல, கோசேனில் தங்கவைத்துவிட்டுச் சென்றதைக் குறிக்கிறது; ‘விட்டுவிட்டார்கள்’ இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: கோசேன் நாட்டில்
  rationale: אֶרֶץ என்பதையும் இடப்பெயரையும் சுருக்கமின்றி இயல்பான தமிழில் வெளிப்படுத்துகிறது.
