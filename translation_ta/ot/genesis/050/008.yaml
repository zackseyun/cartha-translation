translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய வாசிப்புத் தன்மையும் காக்கப்பட்டுள்ளன. எபிரேய வசனம் முந்தைய வசனத்தின் வினைச்சொல்லைத் தொடர்ந்து சார்ந்திருப்பதால், தமிழில் பொருள் முழுமை பெற ‘சென்றார்கள்’ சேர்க்கப்பட்டுள்ளது; பட்டியலுக்குப் பின் வரும் விதிவிலக்கு அரைப்புள்ளியால் இணைக்கப்பட்டுள்ளது.
