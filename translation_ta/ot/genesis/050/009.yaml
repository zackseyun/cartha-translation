  yaml_path: translation/ot/genesis/050/009.yaml
  text: Chariots and horsemen also went up with him[c][b][a], and the company became very large.
translation:
  language: ta
  text: தேர்களும்[b] குதிரைவீரர்களும் அவனோடு மேலே சென்றன[a]; அந்தக் கூட்டம் மிகவும் பெரியதாக இருந்தது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேலே சென்றன’ என்பது ‘புறப்பட்டுச் சென்றன’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘தேர்’ என்று ஒருமையில் உள்ளது; அது தேர்ப்படையைக் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, ‘அந்த முகாம் மிகவும் கனமாக இருந்தது’; அதாவது, அது மிகப் பெரிய, கணிசமான கூட்டமாக இருந்தது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: மேலே சென்றார்கள்
  rationale: עָלָה என்பதன் அடிப்படைப் பொருளான ‘மேலே செல்’ என்பதையும், எகிப்திலிருந்து கானானுக்குச் செல்லும் பயணத் திசையையும் காக்கிறது. கலவையான எழுவாயில் மனிதர்களைக் குறிக்கும் அருகிலுள்ள ‘குதிரைவீரர்கள்’ என்பதற்கு இயல்பாக வினைமுற்று அமைக்கப்பட்டுள்ளது.
- source_word: עִמּוֹ
  choice: அவனோடு
  rationale: சூழலில் யோசேப்பைக் குறிக்கும் முன்னிடைச்சொல் மற்றும் ஆண்பால் ஒருமை பின்னொட்டின் நேரான மொழிபெயர்ப்பு.
- source_word: גַּם ... גַּם
  choice: தேர்களும் ... குதிரைவீரர்களும்
  rationale: இருமுறை வரும் גַּם, இரு பிரிவுகளையும் சேர்த்தும் வலியுறுத்தியும் கூறுகிறது; தமிழின் இணைப்பு ‘-உம் ... -உம்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רֶכֶב
  choice: தேர்கள்
  rationale: எபிரெயத்தில் ஒருமையாக இருந்தாலும், இங்கு தேர்ப்படையைக் கூட்டுப்பொருளில் குறிக்கிறது. சாதாரண வாசகருக்குத் தெளிவாகப் பன்மையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: פָּרָשִׁים
  choice: குதிரைவீரர்கள்
  rationale: குதிரையில் செல்லும் படைவீரர்களைக் குறிக்கும் சொல்லுக்கு இயல்பான, தெளிவான நவீனத் தமிழ்.
- source_word: הַמַּחֲנֶה
  choice: பயணக்கூட்டம்
  rationale: מַחֲנֶה என்பதற்கு ‘முகாம்’ என்ற பொருள் உண்டு; ஆனால் இங்கு நிலையாகத் தங்கிய முகாமைவிடப் பயணம் செய்யும் முழுக் கூட்டத்தையே குறிக்கிறது.
- source_word: כָּבֵד מְאֹד
  choice: மிகப் பெரியதாக
  rationale: சொல்லர்த்தமாக ‘மிகவும் கனமானதாக’ இருந்தாலும், ஒரு கூட்டத்தைப் பொறுத்தவரை அதன் பெருமளவு அல்லது கணிசமான தன்மையைக் குறிக்கும் மரபுத்தொடர். ‘மிகப் பெரியதாக’ என்பது சூழற்பொருளைத் தெளிவாகத் தருகிறது.
