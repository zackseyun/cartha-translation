translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பயணக்கூட்டம்’ என்பது நகர்ந்து செல்லும் குழுவைக் குறிக்கிறது; ‘முகாம்’ என்றால் நிலையாகத் தங்கியிருக்கும் இடம் என்ற தவறான எண்ணம் ஏற்படக்கூடும். வசனத்தின் எபிரெய இணைப்பு அமைப்பை தமிழின் ‘-உம் ... -உம்’ வடிவம் இயல்பாகக் காக்கிறது.
