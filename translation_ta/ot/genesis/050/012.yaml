review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Jacob's sons as the actors and preserves their compliance with his prior command. However, “தங்களுக்குக்” is a reflexive/honorific form that naturally refers back to the singular subject (“அவர்”), creating an incorrect sense; the recipients of the command must be explicitly “அவர்களுக்குக்” (the sons).
  naturalness: The proposed revision uses clear modern standard Tamil. “அவருக்காகச் செய்தார்கள்” naturally conveys that they carried out the action on Jacob's behalf in this burial context.
  terminology: “மகன்கள்” accurately represents בָנָיו. “கட்டளையிட்டபடியே” appropriately conveys the manner/conformity expressed by כֵּן כַּאֲשֶׁר and the command verb צִוָּם. No theological terminology is involved.
  issues:
  - severity: high
    issue: Incorrect reflexive pronoun in “அவர் தங்களுக்குக் கட்டளையிட்டபடியே.”
    rationale: “தங்களுக்குக்” points reflexively/honorifically to “அவர்,” rather than identifying Jacob's sons as those commanded. The Hebrew suffix in צִוָּם means “them,” referring to the sons.
  revised_text: அவர் அவர்களுக்குக் கட்டளையிட்டபடியே, அவருடைய மகன்கள் அவருக்காகச் செய்தார்கள்.
  revised_footnotes: []
  revision_rationale: Replaced the ambiguous and semantically incorrect reflexive pronoun “தங்களுக்குக்” with “அவர்களுக்குக்,” preserving the Hebrew object “them.” The remaining wording retains the source sequence and meaning in idiomatic modern Tamil.
