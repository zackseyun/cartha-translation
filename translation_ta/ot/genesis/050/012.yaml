  text: וַ/יַּעֲשׂ֥וּ בָנָ֖י/ו ל֑/וֹ כֵּ֖ן כַּ/אֲשֶׁ֥ר צִוָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/012.yaml
  text: So his sons did for him as he had commanded them.
translation:
  language: ta
  text: அவர் அவர்களுக்குக் கட்டளையிட்டபடியே, அவருடைய மகன்கள் அவருக்காகச் செய்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: செய்தார்கள்
  rationale: עשה என்பது பொதுவாக ‘செய்’ என்று பொருள்படும். இங்கு யாக்கோபின் அடக்க அறிவுறுத்தல்களை நிறைவேற்றியதைக் குறிக்க இயல்பான தமிழ்ச் சொல் ‘செய்தார்கள்’.
- source_word: בָנָיו
  choice: அவருடைய மகன்கள்
  rationale: எபிரெயச் சொல் குறிப்பாக ‘அவருடைய மகன்கள்’ என்று கூறுகிறது; பாலினக் குறிப்பைத் துல்லியமாகப் பேணுகிறது.
- source_word: לוֹ
  choice: அவருக்கு
  rationale: לֹו இச்சூழலில் யாக்கோபுக்காக, அவரது சார்பில் செய்யப்பட்ட செயலைக் குறிக்கிறது. தமிழில் ‘அவருக்கு’ என்பது இதனைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כֵּן כַּאֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: כֵּן மற்றும் כַּאֲשֶׁר இணைந்து, மகன்களின் செயல் கட்டளைக்கு முற்றிலும் ஏற்ப இருந்ததைக் காட்டுகின்றன. ‘படியே’ அந்த ஒப்புமையையும் இணக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צִוָּם
  choice: தங்களுக்குக் கட்டளையிட்ட
  rationale: צוה என்பதன் பொருள் ‘கட்டளையிடு’. ‘தங்களுக்குக்’ என்பது கட்டளையின் பெறுநர்கள் மகன்களே என்பதைத் தெளிவாக்குகிறது; பெயரெச்சத் தொடர், கட்டளை முன்பே கொடுக்கப்பட்டதை தமிழில் இயல்பாக உணர்த்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான நடை. ‘அவர்/அவருடைய’ என்பது யாக்கோபைக் குறிக்கிறது; ‘தங்களுக்கு’ என்பது அவருடைய மகன்களைக் குறிக்கும் தற்குறிப்பு வடிவம். மூலத்தின் எளிய வாக்கிய அமைப்பும் கட்டளைக்குக் கீழ்ப்படிந்த செயலும் பேணப்பட்டுள்ளன.
