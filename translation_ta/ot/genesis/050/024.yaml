base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/024.yaml
  text: And Joseph said to his brothers[a], “I am dying, but God will surely visit you and bring you up from this land to the land that he swore to Abraham, to Isaac, and to Jacob.”
translation:
  language: ta
  text: யோசேப்பு தன் சகோதரர்களிடம், “நான் சாகப்போகிறேன்; ஆனால் கடவுள் நிச்சயமாக உங்களைக் கவனிப்பார்[a]. அவர் உங்களை இந்த நாட்டிலிருந்து மேலே அழைத்துச் சென்று, ஆபிரகாமுக்கும் ஈசாக்குக்கும் யாக்கோபுக்கும் சத்தியம் செய்து வாக்களித்த நாட்டிற்கு அழைத்துச் செல்வார்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்களை நிச்சயமாகச் சந்திப்பார்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொற்றொடர், கடவுள் தம் மக்கள்மீது தீர்மானமாகக் கவனம் செலுத்தி அவர்களுக்காகச் செயல்படுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: தன் சகோதரர்கள்
  rationale: ஆண்பால் பன்மை வடிவமும் ஆதியாகமத்தின் சூழலும் யோசேப்பின் ஆண் சகோதரர்களையே குறிக்கின்றன.
- source_word: אָנֹכִי מֵת
  choice: நான் சாகப்போகிறேன்
  rationale: எபிரெயப் பெயரெச்சத் தொடர் உடன்நெருங்கிய மரணத்தைக் குறிக்கிறது; இது நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: פָּקֹד יִפְקֹד
  choice: நிச்சயமாக உங்களைக் கவனித்து உதவுவார்
  rationale: வினையெச்ச மூலவடிவமும் முற்றுவினையும் சேர்ந்த அமைப்பு உறுதியை வலியுறுத்துகிறது. פקד இங்கு வெறும் சந்திப்பை அல்ல, தம் மக்கள்மீது கடவுள் தீர்மானமாகக் கவனம் செலுத்தி அவர்களுக்காகச் செயல்படுவதைக் குறிக்கிறது.
- source_word: וֵאלֹהִים
  choice: ஆனால் கடவுள்
  rationale: இணைப்புச் சொல், யோசேப்பு இறந்தாலும் கடவுள் செயல்படுவார் என்ற கருத்து வேறுபாட்டை இச்சூழலில் வெளிப்படுத்துகிறது.
- source_word: וְהֶעֱלָה אֶתְכֶם
  choice: உங்களை ... மேலே அழைத்துச் செல்வார்
  rationale: עלה என்பதன் காரணவினை வடிவிலுள்ள ‘மேலே கொண்டுசெல்லுதல்’ என்ற திசைசார் உருவகத்தைத் தமிழில் இயன்றவரை காக்கிறது.
- source_word: מִן הָאָרֶץ הַזֹּאת
  choice: இந்த நாட்டிலிருந்து
  rationale: யோசேப்பு இருக்கும் எகிப்தைச் சுட்டும் நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: אֶל הָאָרֶץ אֲשֶׁר נִשְׁבַּע
  choice: கொடுப்பதாகத் தாம் ஆணையிட்ட நாட்டிற்கு
  rationale: ‘கொடுப்பதாக’ என்பது எபிரெயத்தில் வெளிப்படையாக இல்லாவிட்டாலும், ‘நாட்டை ஆணையிட்டார்’ என்று தமிழில் தெளிவின்றி வருவதைத் தவிர்க்கச் சூழலிலிருந்து நிரப்பப்படுகிறது; ‘ஆணையிட்ட’ என்பது சத்தியத்துடன் அளித்த உறுதியைக் காட்டுகிறது.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: ஆபிரகாமுக்கும் ஈசாக்குக்கும் யாக்கோபுக்கும்
  rationale: மூன்று முன்னோர்களுக்கும் முன் வரும் எபிரெய முன்னிடைச்சொல்லின் மீளுரையைத் தமிழ் வேற்றுமை உருபின் மீளுரை மூலம் காக்கிறது.
theological_decisions:
- issue: פָּקֹד יִפְקֹד என்பதில் கடவுளின் வாக்களிக்கப்பட்ட செயலின் தன்மை
  choice: கடவுள் உறுதியாகக் கவனித்து உதவுவார்
  alternative: கடவுள் நிச்சயமாகச் சந்திப்பார் / கண்ணோக்குவார்
  rationale: எபிரெய அமைப்பு செயலின் உறுதியை வலியுறுத்துகிறது. உடன்படிக்கைச் சூழலில் இது கடவுள் தம் மக்களைக் கவனித்து அவர்களுக்காகச் செயல்படுவதை உள்ளடக்குகிறது; செயலின் துல்லியமான முறையை மொழிபெயர்ப்பு தேவையின்றி குறுக்குவதில்லை.
- issue: நிலத்தைப் பற்றிய ஆணையின் மறைந்திருக்கும் நிறைவு
  choice: ‘கொடுப்பதாக’ என்பதைத் தமிழில் வெளிப்படுத்துதல்
  alternative: ‘அவர் ஆணையிட்ட நாடு’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: எபிரெயத்தில் கொடுக்கும் செயல் சூழலால் உணர்த்தப்படுகிறது. தமிழில் தேவையான பொருள் நிறைவை வழங்க இது வெளிப்படுத்தப்படுகிறது; புதிய இறையியல் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘மேலே அழைத்துச் செல்வார்’ என்பது தமிழில் சிறிது குறியீட்டுத்தன்மையுடன் இருந்தாலும், மூலத்தின் திசைசார் மொழியைப் பாதுகாக்கத் தேர்ந்தெடுக்கப்பட்டது.
