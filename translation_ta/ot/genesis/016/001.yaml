source:
  edition: WLC
  text: וְ/שָׂרַי֙ אֵ֣שֶׁת אַבְרָ֔ם לֹ֥א יָלְדָ֖ה ל֑/וֹ וְ/לָ֛/הּ שִׁפְחָ֥ה מִצְרִ֖ית וּ/שְׁמָ֥/הּ הָגָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/001.yaml
  text: Sarai[a], Abram’s wife, had borne him no children, and she had an Egyptian servant woman whose name was Hagar.
translation:
  language: ta
  text: ஆபிராமின் மனைவி சாராய் அவருக்குப் பிள்ளை பெற்றிருக்கவில்லை. அவளுக்கு ஆகார் என்ற பெயருடைய எகிப்திய அடிமைப்பெண்[a] ஒருத்தி இருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடிமைப்பெண்’ என்பதற்கு மரபாக ‘பணிப்பெண்’ அல்லது ‘வேலைக்காரி’ என்றும் மொழிபெயர்க்கப்படுகிறது. எபிரெயச் சொல் שִׁפְחָה வீட்டைச் சார்ந்த பணிகளில் ஈடுபட்ட, அடிமை நிலையில் இருந்த பெண்ணைக் குறிக்கிறது; அவளுடைய கட்டுப்பட்ட சமூக நிலையைத் தெளிவாகக் காட்ட இங்கே ‘அடிமைப்பெண்’ என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂרַי
  choice: சாராய்
  rationale: வாவ் இணைப்புச் சொல் இங்கு பின்னணித் தகவலைத் தொடங்குகிறது; தமிழில் தேவையற்ற ‘இப்போது’ அல்லது இயல்பற்ற ‘மேலும்’ சேர்க்காமல் பெயரிலிருந்து தொடங்குவது இயல்பான கதைநடையைத் தருகிறது.
- source_word: אֵשֶׁת אַבְרָם
  choice: ஆபிராமின் மனைவி
  rationale: எபிரெயக் கட்டமைப்பிலுள்ள ‘ஆபிராமின் மனைவி’ என்ற உறவை நேராகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לֹא יָלְדָה לוֹ
  choice: அவருக்குப் பிள்ளை பெற்றிருக்கவில்லை
  rationale: ‘அவருக்கு’ என்ற மறைமுகப் பொருளையும், தொடரும் நிகழ்வுகளுக்கான பின்னணிநிலையையும் காக்கிறது. தமிழில் வாக்கியத்தை நிறைவு செய்ய ‘பிள்ளை’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: וְלָהּ
  choice: அவளுக்கு ... ஒருத்தி இருந்தாள்
  rationale: எபிரெய மொழியின் உடைமைக்கான ‘அவளுக்கு இருந்தது’ அமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: שִׁפְחָה
  choice: அடிமைப்பெண்
  rationale: இச்சொல் வெறும் வீட்டுப் பணியாளரை அல்ல, கட்டுப்பட்ட சமூக நிலையிலிருந்த பெண் அடிமையைக் குறிக்கிறது; ஆகவே அந்த நிலையை மறைக்காத சொல் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: מִצְרִית
  choice: எகிப்திய
  rationale: அந்தப் பெண்ணின் எகிப்திய இன-நாட்டு அடையாளத்தை இயல்பான பெயரடையாகத் தருகிறது.
- source_word: וּשְׁמָהּ הָגָר
  choice: ஆகார் என்ற பெயருடைய
  rationale: அவளுடைய பெயரை வெளிப்படையாக அடையாளப்படுத்தும் மூலவாக்கியத்தை இயல்பான தமிழ்ச் சொல்லமைப்பில் வழங்குகிறது.
