source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הַרְבָּ֥ה אַרְבֶּ֖ה אֶת זַרְעֵ֑/ךְ וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/010.yaml
  text: Then the angel of Yahweh said to her[a], “I will greatly multiply your offspring, so that it cannot be counted because of its multitude.”
translation:
  language: ta
  text: பின்பு யாவேயின் தூதர் அவளிடம்[a], “நான் உன் சந்ததியை மிகவும் பெருகச் செய்வேன்; அதன் பெருந்திரளினால் அதை எண்ண முடியாது” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் வானதூதர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: வாவ்-தொடர்வினை கதையின் நிகழ்வை முன்னெடுக்கிறது; நவீனத் தமிழில் ‘பின்பு’ இயல்பாக அந்த வரிசையை வெளிப்படுத்துகிறது.
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאַךְ என்பதற்கு ‘தூதர்’ அல்லது சூழலைப் பொறுத்து ‘வானதூதர்’ என்று பொருள் கொள்ளலாம். ‘தூதர்’ என்ற சொல் மூலத்தின் இயல்பான இருபொருள் வாய்ப்பைத் தக்கவைக்கிறது; יְהוָה தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: הַרְבָּה אַרְבֶּה
  choice: மிகவும் பெருகச் செய்வேன்
  rationale: வினையெச்சப் பெயருடன் அதே வேர்ச்சொல்லின் முற்றுவினை வருவது செயலை அளவின் அடிப்படையில் வலியுறுத்துகிறது. ‘மிகவும் பெருகச் செய்வேன்’ என்பது அந்த வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: זַרְעֵךְ
  choice: உன் சந்ததி
  rationale: זֶרַע என்பது ஒருமை வடிவிலுள்ள கூட்டுப்பொருள் சொல். ‘சந்ததி’ அந்தக் கூட்டொருமையையும் வழிவந்தோரைக் குறிக்கும் பொருளையும் தக்கவைக்கிறது.
- source_word: וְלֹא יִסָּפֵר
  choice: அதை எண்ண முடியாது
  rationale: ספר என்பதன் நிபால் வடிவம் ‘எண்ணப்படுதல்’ என்பதைக் குறிக்கிறது; இங்கு எண்ணிக்கைக்கு அப்பாற்பட்ட மிகுதியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵרֹב
  choice: அதன் பெருந்திரளினால்
  rationale: מִן உடன் வரும் רֹב பெரும் எண்ணிக்கையைக் காரணமாகக் காட்டுகிறது. ‘அதன்’ என்பது கூட்டொருமையான ‘சந்ததி’யை மீண்டும் சுட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ‘யாவே’ என்று ஒலிபெயர்ப்பது தனிப்பெயரைத் தக்கவைக்கிறது.
- issue: מַלְאַךְ יְהוָה என்பவரின் அடையாள நுணுக்கம்
  choice: யாவேயின் தூதர்
  alternative: யாவேயின் வானதூதர்
  rationale: מַלְאַךְ அடிப்படையில் அனுப்பப்பட்ட ‘தூதர்’ என்பதைக் குறிக்கிறது; இவ்வசனம் மட்டும் அந்த நபரின் இயல்பைப் பற்றிய இறையியல் கேள்வியை முழுமையாகத் தீர்ப்பதில்லை. எனவே பொதுவான ‘தூதர்’ தேர்வு செய்யப்பட்டுள்ளது.
- issue: הַרְבָּה אַרְבֶּה வலியுறுத்தும் விதம்
  choice: மிகவும் பெருகச் செய்வேன்
  alternative: நிச்சயமாகப் பெருகச் செய்வேன்
  rationale: இணைப்பு இங்கு உறுதிப்பாட்டை மட்டும் அல்லாமல் பெருக்கத்தின் மிகுதியை வலியுறுத்துகிறது; எனவே அளவுசார் வலிமை முன்னிலைப்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடையாக்கம். ‘சந்ததி’ கூட்டொருமையாகப் பயன்படுத்தப்பட்டுள்ளது; ‘தூதர்’ என்பது மூலச்சொல்லின் தூதர்/வானதூதர் நுணுக்கத்தைத் திறந்தவாறு வைக்கிறது.
