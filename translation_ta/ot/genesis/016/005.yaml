  text: וַ/תֹּ֨אמֶר שָׂרַ֣י אֶל אַבְרָם֮ חֲמָסִ֣/י עָלֶי/ךָ֒ אָנֹכִ֗י נָתַ֤תִּי שִׁפְחָתִ/י֙ בְּ/חֵיקֶ֔/ךָ וַ/תֵּ֨רֶא֙ כִּ֣י הָרָ֔תָה וָ/אֵקַ֖ל בְּ/עֵינֶ֑י/הָ יִשְׁפֹּ֥ט יְהוָ֖ה בֵּינִ֥/י וּ/בֵינֶֽיׄ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/005.yaml
  text: Then Sarai said to Abram[a], “The wrong done to me is on you. I gave my female servant into your embrace, and when she saw that she had conceived, I became contemptible in her eyes[b]. May Yahweh judge between me and you.”
translation:
  language: ta
  text: அப்போது சாராய் ஆபிராமிடம், “எனக்கு நேர்ந்த அநியாயத்துக்கு நீரே பொறுப்பு[a]. என் அடிமைப் பெண்ணை உமது மடியில் கொடுத்தேன்[b]. அவள் கருவுற்றதை அறிந்தபோது, அவள் பார்வையில் நான் இழிவானவளானேன். எனக்கும் உமக்கும் இடையே யாவே தீர்ப்பளிப்பாராக” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் இன்னும் நேரடியாக, “என் அநியாயம் உம்மேல்” என்று உள்ளது. இந்த நேரடி வாசகம் வேறுவிதமாகப் புரிந்துகொள்ளப்படலாம்; ஆனால் இச்சூழலில், சாராய்க்கு நேர்ந்த அநியாயத்திற்கான பொறுப்பை ஆபிராம்மீது சுமத்தும் குற்றச்சாட்டாகவே பொருள் கொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில், “உமது மடியில்.” இது இங்கு நெருக்கமான பாலுறவை நயமாகக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמָסִי עָלֶיךָ
  choice: எனக்கு நேர்ந்த அநியாயத்துக்கு நீரே பொறுப்பு
  rationale: חָמָס என்பது கொடுமை, அநியாயம், தீங்கு ஆகிய பொருள்களைக் கொள்ளும். சாராய் தன் குற்றத்தை ஒப்புக்கொள்வதாக அல்லாமல், தனக்கு நேர்ந்த அநியாயத்துக்கு ஆபிராம் பொறுப்பெனக் குற்றஞ்சாட்டுவதே சூழலுக்குப் பொருந்துகிறது. עָלֶיךָ-வின் பொறுப்பு சுமத்தும் வலிமையையும் இவ்வாக்கியம் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שִׁפְחָתִי
  choice: என் அடிமைப் பெண்
  rationale: שִׁפְחָה ஒரு பெண் அடிமையையோ கட்டுப்பட்ட பணிப்பெண்ணையையோ குறிக்கிறது. அவளுடைய சமூக நிலையைக் குழப்பமின்றி வெளிப்படுத்த ‘அடிமைப் பெண்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּחֵיקֶךָ
  choice: உமது மடியில்
  rationale: חֵיק என்பதன் நேர்ப்பொருள் ‘மடி/மார்பு’. இங்கு அது பாலுறவு சார்ந்த நெருக்கத்தை நயமாகக் குறிக்கும் உருவகம்; தமிழிலும் ‘மடியில் கொடுத்தேன்’ அந்த உருவகத்தைத் தக்கவைக்கிறது.
- source_word: הָרָתָה
  choice: கருவுற்றிருப்பதை
  rationale: இந்த வினை கருவுறுதல் நிறைவேறிய நிலையைக் குறிக்கிறது. தொடரின் இயல்புக்கேற்ப ‘கருவுற்றிருப்பதை’ என வழங்கப்பட்டது.
- source_word: וָאֵקַל בְּעֵינֶיהָ
  choice: அவளுடைய பார்வையில் நான் இழிவானவளானேன்
  rationale: קלל இங்கு ஒருவரின் மதிப்பு குறைந்து இழிவாகக் கருதப்படுவதைக் குறிக்கிறது; בְּעֵינֶיהָ என்ற எபிரெய மதிப்பீட்டு மரபுத்தொடரும் ‘அவளுடைய பார்வையில்’ என்று பாதுகாக்கப்பட்டுள்ளது.
- source_word: יִשְׁפֹּט יְהוָה
  choice: யாவே தீர்ப்பளிப்பாராக
  rationale: יִשְׁפֹּט இங்கு வேண்டுதல் அல்லது நீதித் தீர்ப்புக்கான அழைப்பை வெளிப்படுத்துகிறது. ‘தீர்ப்பளிப்பாராக’ அந்த வேண்டுதல் வலிமையைத் தருகிறது; יְהוָה தனிப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: எனக்கும் உமக்கும் இடையே
  rationale: இரு தரப்பினருக்கிடையே கடவுள் நடுவராகத் தீர்ப்பளிக்க வேண்டும் என்ற நேரடியான வேண்டுகோளை இது காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கையின் தனிப்பெயரான நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிவடிவமான ‘யாவே’ என வழங்குவது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: சாராயின் குற்றச்சாட்டில் பொறுப்பு யார்மீது சுமத்தப்படுகிறது
  choice: தனக்கு நேர்ந்த அநியாயத்துக்கு ஆபிராம் பொறுப்பு என்று சாராய் கூறுகிறாள்
  alternative: ‘என் அநியாயம் உம்மேல் இருப்பதாக’ என்ற மிக நேரடியான, ஆனால் பொருள் தெளிவில்லாத வாசிப்பு
  rationale: חֲמָסִי என்ற உடைமை வடிவம் ‘என் அநியாயம்/எனக்கு நேர்ந்த அநியாயம்’ என இருவிதமாகப் புரியக்கூடும். சூழலும் עָלֶיךָ என்பதன் பொறுப்பு சுமத்தும் பயன்பாடும் இரண்டாவது புரிதலை ஆதரிக்கின்றன; இருப்பினும் நேரடி வடிவத்தின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, நேரடியான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. சாராய் ஆபிராமை நோக்கிப் பேசுவதால் மரியாதை ஒருமை வடிவங்களான ‘நீர்/உமது/உமக்கும்’ பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் குற்றச்சாட்டு வலிமை, சமூக இழிவு, நீதித் தீர்ப்புக்கான வேண்டுதல் ஆகியவை மென்மைப்படுத்தப்படவில்லை.
