  naturalness: ‘என் அடிமைப் பெண்ணிடம் செல்லுங்கள்’ என்பது நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான விவிலிய நடையாக உள்ளது. பிற வாக்கியங்களும் இயல்பாக உள்ளன. ‘கட்டியெழுப்பப்படலாம்’ என்பது திட்டமிட்ட உருவக மொழிபெயர்ப்பாக இருப்பதால், அதன் வழக்கத்துக்கு மாறான தன்மை அடிக்குறிப்பால் உரிய முறையில் விளக்கப்படுகிறது.
