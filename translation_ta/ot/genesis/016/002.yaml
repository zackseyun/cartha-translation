  text: וַ/תֹּ֨אמֶר שָׂרַ֜י אֶל אַבְרָ֗ם הִנֵּה נָ֞א עֲצָרַ֤/נִי יְהוָה֙ מִ/לֶּ֔דֶת בֹּא נָא֙ אֶל שִׁפְחָתִ֔/י אוּלַ֥י אִבָּנֶ֖ה מִמֶּ֑/נָּה וַ/יִּשְׁמַ֥ע אַבְרָ֖ם לְ/ק֥וֹל שָׂרָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/002.yaml
  text: Then Sarai said to Abram[a], “Look now, Yahweh has kept me from bearing children. Please go in to my female servant; perhaps I will be built up through her.” And Abram listened to the voice of Sarai.
translation:
  language: ta
  text: அப்போது சாராய் ஆபிராமிடம், “இதோ, யாவே என்னைப் பிள்ளை பெறாதபடி தடுத்திருக்கிறார். தயவுசெய்து என் அடிமைப் பெண்ணிடம் செல்லுங்கள். ஒருவேளை அவள் மூலமாக நான் கட்டியெழுப்பப்படலாம்[a]” என்றாள். ஆபிராம் சாராயின் குரலுக்குச் செவிகொடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, “ஒருவேளை அவள் மூலம் எனக்குப் பிள்ளைகள் கிடைக்கலாம்” அல்லது “ஒருவேளை அவள் மூலம் என் குடும்பம் நிலைபெறலாம்.” எபிரெயத்தில் சொல்லுக்குச் சொல், “ஒருவேளை அவள் மூலமாக நான் கட்டப்படலாம்” என்று உள்ளது.
    reason: ‘கட்டப்படுதல்’ என்ற எபிரெய உருவகத்தின் குழந்தைப்பேறு மற்றும் குடும்பம் நிறுவப்படுதல் சார்ந்த பொருள் வாய்ப்புகளை விளக்குகிறது.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: அப்போது ... என்றாள்
  rationale: தொடர்கதை முன்னேற்றத்தைக் காட்டும் வாவ் தொடர்வினையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הִנֵּה נָא
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் வலிமையை இயல்பான, சுருக்கமான தமிழில் தருகிறது; נָא-வின் வேண்டுகோள் நயம் அடுத்த வாக்கியத்தில் ‘தயவுசெய்து’ என்பதால் தெளிவாகிறது.
- source_word: עֲצָרַנִי ... מִלֶּדֶת
  choice: என்னைப் பிள்ளை பெறாதபடி தடுத்திருக்கிறார்
  rationale: சாராயின் குழந்தைப்பேற்றை யாவே தடுத்தார் என்று மூலவாசகம் நேரடியாகக் கூறுவதை மென்மைப்படுத்தாமல், தமிழில் இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரின் பொதுவாக ஏற்றுக்கொள்ளப்படும் ஒலிபெயர்ப்பை பயன்படுத்துகிறது; பட்டப்பெயராக மாற்றவில்லை.
- source_word: בֹּא נָא אֶל
  choice: தயவுசெய்து ... சேர்ந்துகொள்ளுங்கள்
  rationale: பாலுறவைக் குறிக்கும் மூலத்தின் மரியாதையான மறைமுகச் சொல்லாட்சியை, வெறும் இடமாற்றமாகத் தவறாகப் புரியாதவாறு நவீனத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: שִׁפְחָתִי
  choice: என் அடிமைப் பெண்
  rationale: அவளுடைய கட்டுப்பட்ட சமூக நிலையைக் ‘வேலைக்காரி’ என்று மென்மைப்படுத்தாமல் தெளிவாகக் காட்டுகிறது.
- source_word: אוּלַי אִבָּנֶה מִמֶּנָּה
  choice: ஒருவேளை அவள் மூலமாக நான் கட்டியெழுப்பப்படலாம்
  rationale: குழந்தை அல்லது குடும்பத்தைப் பெறுதல் என்ற சூழல் பொருளோடு, ‘கட்டப்படுதல்’ என்ற எபிரெய உருவகத்தையும் அதன் சொல்விளையாட்டையும் பாதுகாக்கிறது.
- source_word: וַיִּשְׁמַע ... לְקוֹל
  choice: குரலுக்குச் செவிகொடுத்தான்
  rationale: ‘குரலைக் கேட்டான்/குரலுக்குச் செவிகொடுத்தான்’ என்ற மூல மொழிநடையைப் பாதுகாத்து, ஆபிராம் சம்மதித்ததையும் இயல்பாக உணர்த்துகிறது.
theological_decisions:
- issue: சாராயின் குழந்தையின்மையில் யாவேயின் பங்கு
  choice: யாவே என்னைப் பிள்ளை பெறாதபடி தடுத்திருக்கிறார்
  alternative: யாவே எனக்குக் குழந்தை பிறக்கவிடவில்லை
  rationale: சாராய் தன் நிலையை யாவேயின் செயலாகவே விளக்குகிறாள். அந்தக் கூற்றைச் சுருக்கவோ, நியாயப்படுத்தவோ, விரிவான இறையியல் விளக்கமாக மாற்றவோ இல்லை.
- issue: பாலுறவைக் குறிக்கும் மறைமுகச் சொல்லாட்சி
  choice: என் அடிமைப் பெண்ணோடு சேர்ந்துகொள்ளுங்கள்
  alternative: என் அடிமைப் பெண்ணோடு உடலுறவு கொள்ளுங்கள்
  rationale: மூலத்தின் மறைமுகமான, கண்ணியமான பதிவைத் தக்கவைத்தபடியே தமிழில் பொருள் புரியும்படி கூறுகிறது.
- issue: אִבָּנֶה என்பதிலுள்ள உருவகத்தின் பொருள்
  choice: நான் கட்டியெழுப்பப்படலாம்
  alternative: அவள் மூலம் எனக்குப் பிள்ளைகள் கிடைக்கலாம்
  rationale: குடும்பம் அல்லது இல்லம் உருவாகுதல் என்ற கருத்து உள்ளதாயினும், மூலவாசகத்தின் ‘கட்டப்படுதல்’ உருவகத்தையும் அதன் உண்மையான பொருள் விரிவையும் முதன்மை உரையில் காக்கிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. சாராய் ஆபிராமிடம் பேசுவதில் மரியாதைப் பன்மை இடம்பெற்றுள்ளது. ‘அடிமைப் பெண்’ என்பது சமூக நிலையை மென்மைப்படுத்தாமல் காட்டுகிறது; ‘சேர்ந்துகொள்ளுங்கள்’ என்பது மூலத்தின் பாலுறவு மறைமுகச் சொல்லாட்சியைப் பாதுகாக்கிறது.
