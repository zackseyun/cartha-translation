source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הִנָּ֥/ךְ הָרָ֖ה וְ/יֹלַ֣דְתְּ בֵּ֑ן וְ/קָרָ֤את שְׁמ/וֹ֙ יִשְׁמָעֵ֔אל כִּֽי שָׁמַ֥ע יְהוָ֖ה אֶל עָנְיֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/011.yaml
  text: Then the angel of Yahweh said to her[a], “Behold, you are pregnant and will bear a son, and you shall call his name Ishmael, because Yahweh has heard your affliction.”
translation:
  language: ta
  text: பின்பு யாவேயின் தூதர்[a] அவளிடம், “இதோ, நீ கர்ப்பமாயிருக்கிறாய்; ஒரு மகனைப் பெற்றெடுப்பாய். அவனுக்கு இஸ்மவேல் என்று பெயரிடுவாய்; ஏனெனில், யாவே உன் துன்பத்தைக் கேட்டிருக்கிறார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் செய்தியாளர்.”
    reason: מַלְאַךְ என்பது பரலோகத் ‘தூதர்’ என்பதையும் பொதுவான ‘செய்தியாளர்’ என்பதையும் குறிக்கக்கூடியதால் இந்தச் சொற்பொருள் மாற்று தரப்படுகிறது.
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאַךְ என்பது ‘தூதர்’ அல்லது ‘செய்தியாளர்’ எனப் பொருள்படலாம். இச்சூழலில் ‘தூதர்’ என்பது இயல்பான தமிழாகவும், அந்த நபரின் அடையாளத்தை மேலும் வரையறுக்காமல் எபிரெயச் சொல்லின் திறந்த தன்மையைப் பாதுகாப்பதாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் ஏற்ற ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்படுகிறது.
- source_word: הִנָּךְ הָרָה
  choice: இதோ, நீ கர்ப்பமாயிருக்கிறாய்
  rationale: הִנָּךְ கவனத்தை ஈர்க்கும் அறிவிப்புச் சொல்லாக இருப்பதால் ‘இதோ’ எனவும், הָרָה தெளிவான நவீன தமிழில் ‘கர்ப்பமாயிருக்கிறாய்’ எனவும் தரப்படுகிறது.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: ஒரு மகனைப் பெற்றெடுப்பாய்
  rationale: வரவிருக்கும் ஆண் குழந்தையின் பிறப்பை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: וְקָרָאת שְׁמוֹ
  choice: அவனுக்கு … என்று பெயரிடுவாய்
  rationale: ‘அவனுடைய பெயரை அழைப்பாய்’ என்ற எபிரெய மொழிமரபை, அதன் பெயரிடும் பொருள் தெளிவாகத் தோன்றும் இயல்பான தமிழில் தருகிறது; எதிர்கால வடிவம் அறிவிப்பிற்குள் உள்ள கட்டளையுணர்வையும் தக்கவைக்கிறது.
- source_word: יִשְׁמָעֵאל
  choice: இஸ்மவேல்
  rationale: தனிப்பெயர் வழக்கமான தமிழ் வடிவில் ஒலிபெயர்க்கப்படுகிறது; அதை மொழிபெயர்த்து மாற்றாமல், அடுத்த காரணவாக்கியத்தில் உள்ள ‘கேட்டார்’ என்ற சொல் விளையாட்டு பாதுகாக்கப்படுகிறது.
- source_word: כִּי שָׁמַע יְהוָה אֶל עָנְיֵךְ
  choice: ஏனெனில், யாவே உன் துன்பத்தைக் கேட்டிருக்கிறார்
  rationale: כִּי பெயரிடுவதற்கான காரணத்தைக் குறிக்கிறது. שָׁמַע என்பதன் ‘கேள்’ என்ற பொருளைத் தக்கவைத்து இஸ்மவேல் என்ற பெயருடனான ஒலிப்பொருள் தொடர்பைப் பாதுகாக்கிறது; עֳנִי என்பது அவளுடைய ஒடுக்கப்பட்ட, துன்பமான நிலையைக் குறிக்கும் பரந்த சொல்லாக இருப்பதால் ‘துன்பம்’ எனத் தரப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. ஆகவே பட்டப்பெயரான ‘கர்த்தர்’ என்பதைக் கொண்டு மாற்றாமல் பெயரையே ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: מַלְאַךְ יְהוָה என்பவரின் அடையாளம்
  choice: யாவேயின் தூதர்
  alternative: யாவேயின் செய்தியாளர்
  rationale: இவ்வசனம் கூறுவதைவிட மேலாக அவரைத் தெய்வத்தோடு அடையாளப்படுத்தவோ, குறிப்பிட்ட கிறிஸ்தவத் தோற்றமாக விளக்கவோ செய்யாமல் எபிரெயச் சொற்றொடரையே பாதுகாக்கிறது.
- issue: இஸ்மவேல் என்ற பெயருக்கும் ‘கேட்டார்’ என்பதற்கும் உள்ள தொடர்பு
  choice: பெயரை ஒலிபெயர்த்து, காரணவாக்கியத்தில் ‘கேட்டிருக்கிறார்’ என்பதைப் பாதுகாத்தல்
  alternative: பெயரின் பொருளை முதன்மை உரையிலேயே ‘தேவன் கேட்கிறார்’ என மொழிபெயர்த்தல்
  rationale: தனிப்பெயரை மொழிபெயர்த்து மாற்றுவது உரையின் பெயரிடும் வடிவத்தைச் சிதைக்கும். மூலத்தில் உள்ள பெயர்–வினைச்சொல் தொடர்பு ‘இஸ்மவேல்’ மற்றும் ‘கேட்டிருக்கிறார்’ என்பவற்றின் அருகாமையால் போதுமான அளவில் வெளிப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம அறிவிப்பிற்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘நீ’ என்ற ஒருமை முகவரி மூலத்தின் இரண்டாம் நபர் பெண்பால் ஒருமையை இயல்பாகப் பிரதிபலிக்கிறது; தெய்வத்தைச் சுட்டும் வினையில் மரியாதை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
