  yaml_path: translation/ot/genesis/016/015.yaml
  text: Hagar bore a son to Abram[a], and Abram called the name of his son, whom Hagar bore, Ishmael.
translation:
  language: ta
  text: ஆகார் ஆபிராமுக்கு ஒரு மகனைப் பெற்றாள்; ஆபிராம், ஆகார் பெற்றெடுத்த தனது மகனுக்கு இஸ்மவேல் என்று பெயரிட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: பெற்றாள்
  rationale: יָלַד என்பதன் கால் வினைச்சொல், பெண் எழுவாயுடன் வரும்போது ‘பெற்றெடு’ என்று பொருள்படும். இங்கு ‘ஒரு மகனைப் பெற்றாள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: לְאַבְרָם
  choice: ஆபிராமுக்கு
  rationale: 'לְ முன்னிடைச்சொல் இங்கு உறவு அல்லது பயனாளியைக் குறிக்கிறது: ஆகார் பெற்ற மகன் ஆபிராமின் மகனாக இருக்கிறார். ‘ஆபிராமுக்கு’ என்பது மூலத்தின் தொடர்பைச் சுருக்கமாகப் பாதுகாக்கிறது.'
- source_word: בֵּן
  choice: ஒரு மகனை
  rationale: எபிரெயச் சொல்லுக்கு குறிப்புச் சுட்டு இல்லாததால், தமிழில் இயல்பாக ‘ஒரு மகனை’ என வழங்கப்பட்டுள்ளது.
- source_word: וַיִּקְרָא ... שֶׁם
  choice: பெயரிட்டார்
  rationale: קרא שם என்பதன் சொற்படியான அமைப்பு ‘பெயரை அழைத்தார்’ என்றாலும், நபருக்குப் பெயர் சூட்டும் செயலை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் ‘பெயரிட்டார்’ எனச் சொல்வது பொருத்தமானது.
- source_word: בְּנוֹ
  choice: தன் மகனுக்கு
  rationale: மூன்றாம் நபர் எழுவாய் ஆபிராமையே உடைமையாளராகக் குறிக்கும் சூழலில், தமிழ் தற்சுட்டுப் பெயரடையான ‘தன்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֲשֶׁר יָלְדָה הָגָר
  choice: ஆகார் பெற்றெடுத்த
  rationale: உறவுநிலைத் தொடர் மகனை அடையாளப்படுத்துகிறது; ஆகாரின் பெயரை மீண்டும் வெளிப்படையாகக் கூறும் மூலத்தின் வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: יִשְׁמָעֵאל
  choice: இஸ்மவேல்
  rationale: יִשְׁמָעֵאל என்ற எபிரெயப் பெயருக்கான நிலைபெற்ற தமிழ் வேதாகமப் பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
