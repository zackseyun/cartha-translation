translation_notes:
  register: மூலத்தின் இருமுறை வரும் ‘பெற்றாள்/பெற்றெடுத்த’ என்ற மீளுரையைப் பாதுகாத்து, சொற்படியான எபிரெயப் பெயரிடும் மரபுத்தொடரை நவீனத் தமிழின் இயல்பான ‘பெயரிட்டார்’ என வழங்கியுள்ளோம். நடை தற்போதைய, கண்ணியமான, பொதுவாசகருக்குப் புரியும் தரமான தமிழ்.
