source:
  edition: WLC
  text: וַֽ/יִּמְצָאָ֞/הּ מַלְאַ֧ךְ יְהוָ֛ה עַל עֵ֥ין הַ/מַּ֖יִם בַּ/מִּדְבָּ֑ר עַל הָ/עַ֖יִן בְּ/דֶ֥רֶךְ שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/007.yaml
  text: And the angel of Yahweh found her by a spring of water in the wilderness[b][a], by the spring on the way to Shur.
translation:
  language: ta
  text: யாவேயின் வானதூதர்[a][b] அவளை வனாந்தரத்தில் ஒரு நீரூற்றருகே கண்டார். அந்த ஊற்று சூருக்குச் செல்லும் வழியில் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் தூதர்.” எபிரெயச் சொல் “தூதர்” அல்லது “வானதூதர்” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “யாவே” என்பது יהוה (YHWH) என்ற எபிரெய இறைப் பெயரின் ஒலிபெயர்ப்பு. பாரம்பரிய மொழிபெயர்ப்புகளில் இது “கர்த்தர்” என வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְצָאָהּ
  choice: அவளைக் கண்டார்
  rationale: מצא என்பதன் இயல்பான கதைநடைப் பொருள் ‘கண்டார்’; பெண்பால் ஒருமை பின்னொட்டு ஆகாரைக் குறிக்கிறது. தமிழில் இது சந்திப்பை மிகையாக விளக்காமல் இயல்பாகத் தெரிவிக்கிறது.
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאַךְ என்பது ‘தூதர்’ அல்லது ‘வானதூதர்’ எனப் பொருள்படலாம். ‘தூதர்’ இரு சாத்தியங்களையும் ஓரளவு திறந்தே வைத்திருப்பதால் அடிச்சொல்லின் உண்மையான பொருள் அகலத்தைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியத்தக்க ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குகிறது.
- source_word: עַל עֵין הַמַּיִם
  choice: ஒரு நீரூற்றருகே
  rationale: עַיִן இச்சூழலில் நீர் பொங்கிவரும் ஊற்றைக் குறிக்கிறது; עַל இடத்தைக் குறிக்கும் வகையில் ‘அருகே’ என இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது மணற்பாலைவனத்தை மட்டும் அல்லாமல் மக்கள் குடியிருப்பு குறைந்த வறண்ட வெளியையும் குறிக்கலாம்; ‘வனாந்தரம்’ அந்தப் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: עַל הָעַיִן
  choice: அந்த ஊற்றருகே
  rationale: முன்பு குறிப்பிடப்பட்ட அதே நீரூற்றை மீண்டும் சுட்டுவதால், எபிரெய உரையின் மீளுரையைத் தெளிவாகப் பாதுகாக்க ‘அந்த ஊற்று’ என வழங்கப்பட்டுள்ளது.
- source_word: בְּדֶרֶךְ שׁוּר
  choice: சூருக்குச் செல்லும் வழியில்
  rationale: דֶּרֶךְ என்பது வழி அல்லது சாலையைக் குறிக்கும்; இங்கு திசை மற்றும் நிலவியல் இருப்பிடத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: מַלְאַךְ என்பதன் பொருள்
  choice: தூதர்
  alternative: வானதூதர்
  rationale: இச்சொல் மனிதத் தூதரையும் வானுலகத் தூதரையும் குறிக்கக்கூடும். சூழல் இறைத் தூதரைச் சுட்டினாலும், ‘தூதர்’ என்ற சொல் மூலத்தின் சொற்பொருள் அகலத்தைச் சுருக்காமல் வைத்திருக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: מַלְאַךְ יְהוָה என்ற தொடரில் இறைப் பெயரை வழங்குதல்
  choice: யாவேயின் தூதர்
  alternative: கர்த்தருடைய தூதர்
  rationale: மூல உரையில் יהוה என்ற தனிப்பெயர் நேரடியாக உள்ளது. ‘யாவே’ அதை ஒரு பட்டப்பெயராக மாற்றாமல் பாதுகாக்கிறது; பாரம்பரிய மாற்று அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன வாசகர்களுக்குப் புரியக்கூடிய, ஆனால் கதைநடைக்கேற்ற கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. ‘வனாந்தரம்’ என்பது மணற்பாலைவனம் என்ற குறுகிய படிமத்தைத் தவிர்த்து மூலச்சொல்லின் பரந்த நிலவியல் பொருளைத் தக்கவைக்கிறது. கோடுகள் ஒரே ஊற்றைக் குறிக்கும் மீளுரையைத் தெளிவான இடைச்சேர்க்கையாகக் காட்டுகின்றன.
