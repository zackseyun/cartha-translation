  text: Abram was eighty-six years old when Hagar bore Ishmael to Abram[a].
translation:
  language: ta
  text: ஆகார் இஸ்மவேலை ஆபிராமுக்குப் பெற்றெடுத்தபோது, ஆபிராமுக்கு எண்பத்தாறு வயது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: ஆபிராம்
  rationale: எபிரெயப் பெயரான אַבְרָם தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவில் ஒலிபெயர்க்கப்பட்டது; தொடக்க וְ இயல்பான தமிழ் வாக்கிய அமைப்பில் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: בֶּן שְׁמֹנִים שָׁנָה וְ/שֵׁשׁ שָׁנִים
  choice: ஆபிராமுக்கு எண்பத்தாறு வயது
  rationale: בן உடன் வரும் எண் மற்றும் ‘ஆண்டு’ சொற்கள் வயதைக் குறிக்கும் எபிரெய மரபுத்தொடர். இயல்பான நவீன தமிழில் ‘எண்பத்தாறு வயது’ என வழங்கப்பட்டது.
- source_word: בְּ/לֶדֶת
  choice: பெற்றெடுத்தபோது
  rationale: בְ + ילד என்பதன் infinitive construct காலத்தைக் குறிக்கும் உட்பிரிவை அறிமுகப்படுத்துகிறது; ‘பெற்றெடுத்தபோது’ அதன் பொருளை இயல்பாகத் தருகிறது.
- source_word: הָגָר
  choice: ஆகார்
  rationale: எபிரெயப் பெயர் தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֶת יִשְׁמָעֵאל
  choice: இஸ்மவேலை
  rationale: אֶת நேரடி செயப்படுபொருள் குறியீடு என்பதால் தனியே மொழிபெயர்க்கப்படவில்லை; יִשְׁמָעֵאל வழக்கமான தமிழ் வடிவில் ஒலிபெயர்க்கப்பட்டு வேற்றுமை உருபு சேர்க்கப்பட்டது.
- source_word: לְ/אַבְרָם
  choice: ஆபிராமுக்கு
  rationale: לְ இச்சூழலில் குழந்தைப் பிறப்புக்கும் ஆபிராமுக்கும் உள்ள உறவைச் சுட்டுகிறது. தமிழ் ‘ஆபிராமுக்குப் பெற்றெடுத்தாள்’ என்பது ‘to/for Abram’ என்ற இரு நுணுக்கங்களையும் இயல்பாகத் தாங்குகிறது.
