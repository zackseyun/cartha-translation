translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான உரைநடை. எபிரெய வாக்கியத்தின் கால உறவு தெளிவாக வைக்கப்பட்டுள்ளது. לְ என்பதிலுள்ள ‘to/for’ நுணுக்க வேறுபாடு தமிழின் ‘-க்கு’ உருபில் இயல்பாகவே பாதுகாக்கப்படுவதால் அடிக்குறிப்பு தேவையில்லை.
