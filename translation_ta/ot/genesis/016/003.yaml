id: GEN.16.3
reference: Genesis 16:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/תִּקַּ֞ח שָׂרַ֣י אֵֽשֶׁת אַבְרָ֗ם אֶת הָגָ֤ר הַ/מִּצְרִית֙ שִׁפְחָתָ֔/הּ מִ/קֵּץ֙ עֶ֣שֶׂר שָׁנִ֔ים לְ/שֶׁ֥בֶת אַבְרָ֖ם בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/אַבְרָ֥ם אִישָׁ֖/הּ ל֥/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/003.yaml
  text: So Sarai[a], Abram’s wife, took Hagar the Egyptian, her female servant, after Abram had lived ten years in the land of Canaan[b], and gave her to Abram her husband as a wife.
translation:
  language: ta
  text: ஆபிராம் கானான் நாட்டில் வாழ்ந்து பத்து ஆண்டுகள் முடிந்தபின், ஆபிராமின் மனைவியான சாராய், தன் எகிப்திய அடிமைப் பெண்ணான ஆகாரை எடுத்து, தன் கணவனான ஆபிராமுக்கு மனைவியாகக் கொடுத்தாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקַּח
  choice: அழைத்து
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்’; ஒருவரைச் செயற்பாட்டின் பொருளாகக் கொண்ட இச்சூழலில், நவீன தமிழில் இயல்பாகவும் உடைமைப் பொருளைப் போல ஒலிக்காமலும் இருக்க ‘அழைத்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: ஆபிராமின் மனைவியான சாராய்
  rationale: சாராயை ஆபிராமின் மனைவியாக அடையாளப்படுத்தும் எபிரெய இணைப்பை இயல்பான தமிழ் அடைமொழித் தொடராக அளிக்கிறது.
- source_word: הָגָר הַמִּצְרִית
  choice: எகிப்திய ... ஆகார்
  rationale: பெயர் வழக்கமான தமிழ் வடிவில் ஒலிபெயர்க்கப்பட்டு, இன/நாட்டு அடையாளம் ‘எகிப்திய’ என்று பாதுகாக்கப்பட்டது.
- source_word: שִׁפְחָתָהּ
  choice: தன் ... அடிமைப் பெண்
  rationale: שִׁפְחָה இங்கு பெண் அடிமையைக் குறிக்கிறது. சமூக நிலையைக் மென்மையாக்காமல் ‘அடிமைப் பெண்’ என்று வெளிப்படையாக மொழிபெயர்க்கப்பட்டது.
- source_word: מִקֵּץ עֶשֶׂר שָׁנִים לְשֶׁבֶת אַבְרָם בְּאֶרֶץ כְּנָעַן
  choice: ஆபிராம் கானான் நாட்டில் குடியேறிப் பத்து ஆண்டுகள் முடிந்தபின்
  rationale: מִקֵּץ என்பதிலுள்ள காலநிறைவு உணர்வையும், கானானில் ஆபிராம் வாழ்ந்த காலமே கணக்கிடப்படுகிறது என்பதையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַתִּתֵּן אֹתָהּ לְאַבְרָם אִישָׁהּ
  choice: தன் கணவன் ஆபிராமுக்கு ... கொடுத்தாள்
  rationale: சாராயே தொடர்ந்தும் எழுவாய் என்பதையும், אִישָׁהּ என்பது ‘அவளுடைய கணவன்’ என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לוֹ לְאִשָּׁה
  choice: மனைவியாக
  rationale: மூலத்தில் אִשָּׁה என்றே உள்ளது; ‘மறுமனைவி’ அல்லது ‘வைப்பாட்டி’ போன்ற கூடுதல் சட்ட அல்லது சமூக வகைப்பாட்டைச் சேர்க்காமல் அதன் நேரடிப் பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஆகாரின் சமூக மற்றும் திருமண நிலை
  choice: ஆகாரை ‘அடிமைப் பெண்’ என்றும் ஆபிராமுக்கு ‘மனைவியாக’ கொடுக்கப்பட்டவள் என்றும் இரண்டையும் உரையில் வைத்தல்
  alternative: ‘வைப்பாட்டியாக’ அல்லது ‘மறுமனைவியாக’ என்று ஒரே நிலைக்குள் விளக்குதல்
  rationale: எபிரெய உரை ஆகாரை சாராயின் שִׁפְחָה என்றும், ஆபிராமுக்கு אִשָּׁה ஆகக் கொடுக்கப்பட்டவள் என்றும் கூறுகிறது. இந்த இரு நிலைகளுக்கிடையேயான சமூக மற்றும் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான வேதாகம உரைநடை. ‘குடியேறி’ என்பது שׁבת என்பதன் இச்சூழலிலான வாழ்வு/வசிப்பு பொருளை இயல்பாகக் கொடுக்கிறது. தேவையற்ற அடிக்குறிப்புகள் சேர்க்கப்படவில்லை.
