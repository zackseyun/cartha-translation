source:
  edition: WLC
  text: וַ/תִּקְרָ֤א שֵׁם יְהוָה֙ הַ/דֹּבֵ֣ר אֵלֶ֔י/הָ אַתָּ֖ה אֵ֣ל רֳאִ֑י כִּ֣י אָֽמְרָ֗ה הֲ/גַ֥ם הֲלֹ֛ם רָאִ֖יתִי אַחֲרֵ֥י רֹאִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/013.yaml
  text: So she called the name of Yahweh who spoke to her[a], “You are a God who sees me,” for she said[c][b], “Have I really here seen after the One who sees me?”
translation:
  language: ta
  text: தன்னோடு பேசிய யாவேக்கு அவள், “என்னைக் காண்கிற இறைவன் நீர்”[a] என்று பெயரிட்டாள். ஏனெனில் அவள், “இங்கே, என்னைக் காண்கிறவருக்குப் பின் நான் உண்மையாகவே கண்டேனா?”[b] என்று சொன்னாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “காண்கிற இறைவன் நீர்” அல்லது “காணுதலின் இறைவன் நீர்” என்றும் பொருள்கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: இறுதி வாக்கியம் பொருள் தெளிவில்லாத கடினமான எபிரெயத் தொடர். “என்னைக் கண்டவரைக் கண்ட பின்பும் நான் இங்கே உயிரோடு இருக்கிறேனா?” என்றும் இதைப் பொருள்கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרָא שֵׁם יְהוָה
  choice: யாவேக்கு அவள் … என்று பெயரிட்டாள்
  rationale: ‘பெயரை அழைத்தாள்’ என்ற எபிரெய மொழிநடையைச் சொற்சொல்லாகப் பின்பற்றாமல், ஒருவர் இன்னொருவருக்கு ஒரு பெயர் அல்லது பட்டம் வழங்கும் பொருளைத் தெளிவான நவீனத் தமிழில் தருகிறது. יְהוָה என்பது பட்டமாக மாற்றப்படாமல் ‘யாவே’ எனப் பெயரெழுத்தாக்கப்பட்டுள்ளது.
- source_word: הַדֹּבֵר אֵלֶיהָ
  choice: தன்னோடு பேசிய
  rationale: பங்கேற்புவினை வடிவம் யாவே ஆகாரோடு பேசினவர் என்பதை அடையாளப்படுத்துகிறது; ‘தன்னோடு’ என்பது அவளைக் குறிக்கும் இயல்பான தமிழ் எதிர்வினைப்பெயர்.
- source_word: אַתָּה אֵל רֳאִי
  choice: என்னைக் காண்கிற இறைவன் நீர்
  rationale: רֳאִי என்பது ‘காணுதல்’ அல்லது ‘என்னைக் காண்கிறவர்’ எனப் பொருள்படக்கூடிய கடினமான வடிவம். சூழலில் கடவுள் ஆகாரைக் கவனித்துக் காண்கிறார் என்ற கருத்தை இயல்பாக வெளிப்படுத்துகிறது; எபிரெயத்தில் இல்லாத வரையறையை மிகைப்படுத்தவில்லை.
- source_word: כִּי אָמְרָה
  choice: ஏனெனில் அவள் … என்று சொன்னாள்
  rationale: பெயரிட்டதற்கான விளக்கத்தை அறிமுகப்படுத்தும் காரணத்தொடரைத் தெளிவாகத் தருகிறது.
- source_word: הֲגַם הֲלֹם
  choice: இங்கே நானும் உண்மையில் … கண்டேனா?
  rationale: கேள்வி, வியப்பு, வலியுறுத்தல் ஆகியவற்றைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רָאִיתִי אַחֲרֵי רֹאִי
  choice: என்னைக் காண்கிறவருக்குப் பின் … நானும் … கண்டேனா?
  rationale: ‘கண்டேன்’, ‘பின்’, ‘என்னைக் காண்கிறவர்’ என்ற எபிரெயச் சொற்கூறுகளை முடிந்தவரைத் தக்கவைத்து, கடினமான தொடரின் தெளிவின்மையைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் பெயரெழுத்தாக்குவது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: אֵל רֳאִי என்ற பட்டத்தின் பொருள்
  choice: என்னைக் காண்கிற இறைவன் நீர்
  alternative: காண்கிற இறைவன் நீர் / காணுதலின் இறைவன் நீர்
  rationale: உடனடிச் சூழலில் ஆகார் கடவுளால் காணப்பட்டதை முன்னிறுத்துகிறது; இருப்பினும் மற்ற இலக்கணச் சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- issue: רָאִיתִי אַחֲרֵי רֹאִי என்ற இறுதித் தொடரின் விளக்கம்
  choice: என்னைக் காண்கிறவருக்குப் பின், இங்கே நானும் உண்மையில் கண்டேனா?
  alternative: என்னைக் கண்டவரைக் கண்ட பின்பும் நான் இங்கே உயிரோடு இருக்கிறேனா?
  rationale: எபிரெயத் தொடர் சுருக்கமானதும் பொருள் தெளிவில்லாததும் ஆகும். உயிர் பிழைத்திருப்பதை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்காமல், பொதுவான விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க உரைநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நேரடியாக அழைக்கும் இடத்தில் ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது. கடினமான இறுதித் தொடர் மென்மையாக்கப்படாமல், வாசிக்கத்தக்க அளவில் அதன் மூலத் தெளிவின்மை தக்கவைக்கப்பட்டுள்ளது.
