base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/009.yaml
  text: Then the angel of Yahweh said to her[c][b][a], “Return to your mistress and humble yourself under her hand.”
translation:
  language: ta
  text: அப்போது யாவேயின் தூதர் அவளிடம், “உன் எஜமானியிடம் திரும்பிப் போ; அவளுடைய அதிகாரத்தின்கீழ் உன்னைத் தாழ்த்திக்கொள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் நேரடியாக, “அவளுடைய கையின் கீழ் உன்னைத் தாழ்த்திக்கொள்” என்று உள்ளது. “கையின் கீழ்” என்பது ஒருவரின் அதிகாரத்திற்கு உட்பட்டிருப்பதைக் குறிக்கும் மரபுத்தொடர். வினைச்சொல் “துன்புறுத்தப்படுதலை ஏற்றுக்கொள்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאַךְ என்பது ‘தூதர்’ அல்லது சூழலின்படி ‘தேவதூதர்’ எனப் பொருள்படலாம். இங்கு விண்ணுலகத் தூதரைக் குறிக்கும் சூழல் இருந்தாலும், ‘தூதர்’ என்பது எபிரேயச் சொல்லின் இயல்பான இருபொருள் வாய்ப்பைத் தமிழில் ஓரளவு காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தனிப்பட்ட பெயராக ஒலிபெயர்த்துள்ளது.
- source_word: שׁוּבִי
  choice: திரும்பிப் போ
  rationale: பெண்பால் ஒருமை கட்டளையின் நேரடியான வலிமையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: גְּבִרְתֵּךְ
  choice: உன் எஜமானி
  rationale: ஆகார்–சாராய் சமூக உறவில் பெண் அதிகாரியையும் அடிமைப் பெண்ணின் உரிமையாளரையும் குறிக்கும் சொல்லுக்கு ‘எஜமானி’ துல்லியமானது.
- source_word: וְהִתְעַנִּי
  choice: கீழ்ப்படிந்து இரு
  rationale: Hitpael வடிவம் தன்னைத் தாழ்த்தி அல்லது அடக்கிக்கொண்டு அதிகாரத்திற்கு உட்படுவதை இச்சூழலில் குறிக்கிறது. தமிழில் ‘கீழ்ப்படிந்து இரு’ சமூக உறவையும் தொடர்ந்த நிலைப்பாட்டையும் தெளிவாகக் காட்டுகிறது; துன்புறுத்தலைக் கட்டளையிடுவதாக மிகைப்படுத்தாது.
- source_word: תַּחַת יָדֶיהָ
  choice: அவளுடைய அதிகாரத்திற்கு
  rationale: சொல்லுக்கு சொல் ‘அவளுடைய கையின் கீழ்’ என்ற எபிரேய மரபுத்தொடர் இங்கு ‘அவளுடைய அதிகாரத்தின் கீழ்’ என்று பொருள்படுகிறது. இயல்பான தமிழுக்காக பொருள் நேரடியாக வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் இருப்பதால் அதை பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: מַלְאַךְ என்பதை ‘தூதர்’ அல்லது ‘தேவதூதர்’ என வழங்குதல்
  choice: தூதர்
  alternative: தேவதூதர்
  rationale: கதைச்சூழல் விண்ணுலகத் தூதரைச் சுட்டினாலும், மூலச்சொல் அடிப்படையில் ‘செய்தியாளர்/தூதர்’ என்று பொருள்படும். ‘தூதர்’ என்பது தேவையற்ற அடையாளக் கோட்பாட்டைச் சேர்க்காமல் மூலத்தின் சொற்பரப்பைக் காக்கிறது.
- issue: וְהִתְעַנִּי என்பதன் தாழ்த்தப்படுதல்/துன்புறுதல் சார்ந்த பதற்றம்
  choice: கீழ்ப்படிந்து இரு[a]
  alternative: உன்னைத் தாழ்த்திக்கொள்; அவளுடைய அதிகாரத்தில் துன்பத்தை ஏற்றுக்கொள்
  rationale: இந்த வினை வேர் தாழ்த்துதல் அல்லது துன்புறுத்துதல் என்ற கடுமையான நிழற்பொருளைக் கொண்டிருக்கலாம். சூழலில் அதிகாரத்திற்கு உட்படுதல் முதன்மையானது; ஆனால் கடுமையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மதிப்பும் கதைநடை இயல்பும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘எஜமானி’ சமூகப் படிநிலையைத் தெளிவாகக் காட்டுகிறது. கடினமான எபிரேய மரபுத்தொடர் முதன்மை உரையில் பொருள்வழியாகவும், அதன் சொற்படிமமும் வினையின் கடுமையான மாற்றுப் பொருளும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளன.
