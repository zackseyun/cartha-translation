  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל שָׂרַ֗י הִנֵּ֤ה שִׁפְחָתֵ/ךְ֙ בְּ/יָדֵ֔/ךְ עֲשִׂי לָ֖/הּ הַ/טּ֣וֹב בְּ/עֵינָ֑יִ/ךְ וַ/תְּעַנֶּ֣/הָ שָׂרַ֔י וַ/תִּבְרַ֖ח מִ/פָּנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/006.yaml
  text: Then Abram said to Sarai[a], “Look, your female servant is in your hand; do to her what is good in your eyes.” Then Sarai afflicted her, and she fled from her presence.
translation:
  language: ta
  text: அப்போது ஆபிராம் சாராயிடம், “இதோ, உன் அடிமைப்பெண் உன் கையில் இருக்கிறாள்; உன் பார்வைக்கு நல்லது எதுவோ, அதன்படி அவளிடம் நடந்துகொள்” என்றான். பின்பு சாராய் அவளைத் துன்புறுத்தினாள்[a]; அவள் சாராயிடமிருந்து ஓடிப்போனாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளைக் கடுமையாக நடத்தினாள்” / “அவளை ஒடுக்கினாள்.” இதற்கான எபிரெய வினை துன்புறுத்துதல், இழிவுபடுத்துதல் அல்லது கடுமையாக நடத்துதல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: எபிரெயச் சொல்லின் சுட்டிக்காட்டும் வலிமையை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: שִׁפְחָתֵךְ
  choice: உன் அடிமைப்பெண்
  rationale: ஆகாரின் பிணைக்கப்பட்ட சமூக நிலையையும் வீட்டுக்குள் நிலவும் அதிகார ஏற்றத்தாழ்வையும் ‘வேலைக்காரி’ என்று மென்மைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: בְּיָדֵךְ
  choice: உன் கையில்
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய மொழிமரபைத் தமிழிலும் புரியத்தக்க உருவகமாகப் பாதுகாக்கிறது.
- source_word: עֲשִׂי לָהּ הַטּוֹב בְּעֵינָיִךְ
  choice: உன் பார்வைக்கு நல்லது எதுவோ, அதை அவளிடம் செய்
  rationale: ‘உன் பார்வைக்கு நல்லது’ என்ற மூலமொழி உருவகத்தையும், செயல் ஆகாரை நோக்கிச் செலுத்தப்படுவதையும் தக்கவைக்கிறது; ‘உன் விருப்பப்படி’ என முழுமையாகப் பொழிப்புரை செய்யவில்லை.
- source_word: וַתְּעַנֶּהָ
  choice: அவளைத் துன்புறுத்தினாள்
  rationale: பீல் வடிவிலுள்ள ענה குறிப்பிடும் ஒடுக்குதல், இழிவுபடுத்துதல் அல்லது கடுமையான நடத்தையை, அதன் துல்லிய வடிவத்தை ஊகிக்காமல் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַתִּבְרַח
  choice: தப்பியோடினாள்
  rationale: வெறும் புறப்படுதலை அல்லாமல், கடுமையான சூழலிலிருந்து ஓடித் தப்புவதைச் சுருக்கமாகவும் தீவிரமாகவும் வெளிப்படுத்துகிறது.
- source_word: מִפָּנֶיהָ
  choice: சாராயின் முன்னிலையிலிருந்து
  rationale: ‘அவளுடைய முன்னிலையிலிருந்து’ என்ற எபிரெயச் சொற்றொடரைத் தக்கவைத்து, தமிழில் பிரதிப்பெயர் குழப்பம் ஏற்படாதபடி சாராயின் பெயரைத் தெளிவாகக் குறிப்பிடுகிறது.
theological_decisions:
- issue: ஆகாரின் சமூக நிலையை மொழிபெயர்த்தல்
  choice: அடிமைப்பெண்
  alternative: வேலைக்காரி / பணிப்பெண்
  rationale: இந்த நிகழ்வில் வீட்டுக்குள் உள்ள அதிகார உறவு முக்கியமானது. ஆகாரின் பிணைக்கப்பட்ட நிலையைப் பொதுவான பணிசெய்யும் நிலையாக மென்மைப்படுத்தாமல் ‘அடிமைப்பெண்’ வெளிப்படுத்துகிறது.
- issue: וַתְּעַנֶּהָ என்பதில் சாராயின் நடத்தையின் கடுமை
  choice: துன்புறுத்தினாள்
  alternative: கடுமையாக நடத்தினாள் / ஒடுக்கினாள் / இழிவுபடுத்தினாள்
  rationale: எபிரெய வினை உண்மையான துன்பத்தையும் கடுமையான நடத்தையையும் குறிக்கிறது; ஆனால் அதன் குறிப்பிட்ட வடிவத்தை வசனம் கூறவில்லை. எனவே தீவிரத்தைப் பாதுகாத்து, தேவையற்ற விவரத்தைச் சேர்க்காத சொல் தேர்ந்தெடுக்கப்பட்டது; மாற்றுச் சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உன் கையில்’ மற்றும் ‘உன் பார்வைக்கு நல்லது’ என்ற மூலமொழி உருவகங்கள் புரியத்தக்க வகையில் தக்கவைக்கப்பட்டுள்ளன; சமூக அதிகாரமும் சாராயின் செயலின் தீவிரமும் மென்மைப்படுத்தப்படவில்லை.
