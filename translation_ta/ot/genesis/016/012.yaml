  text: וְ/ה֤וּא יִהְיֶה֙ פֶּ֣רֶא אָדָ֔ם יָד֣/וֹ בַ/כֹּ֔ל וְ/יַ֥ד כֹּ֖ל בּ֑/וֹ וְ/עַל פְּנֵ֥י כָל אֶחָ֖י/ו יִשְׁכֹּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/012.yaml
  text: And he will be a wild donkey of a man[a]; his hand will be against everyone, and everyone's hand against him[c][b], and he will dwell opposite all his brothers.
translation:
  language: ta
  text: அவன் காட்டுக் கழுதையைப் போன்ற மனிதனாக இருப்பான்[a]. அவனுடைய கை எல்லாருக்கும் எதிராகவும், எல்லாருடைய கை அவனுக்கு எதிராகவும் இருக்கும். அவன் தன் சகோதரர்கள் எல்லாருக்கும் எதிரே குடியிருப்பான்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், அவன் காட்டுக் கழுதையுடன் ஒப்பிடப்படுகிறான். இது வெறுமனே அவன் ‘காட்டு இயல்புள்ளவன்’ என்று சொல்வதைவிட வலுவான விலங்கு உருவகமாகும்.
    reason: lexical_alternative
  - marker: b
    text: ‘எதிரே’ என்பதற்கான எபிரெய சொற்றொடரை ‘முன்பாக’, ‘கண் எதிரில்’ அல்லது ‘எதிர்த்து’ என்றும் புரிந்துகொள்ளலாம்; அது இடத்தையோ உறவையோ எதிர்ப்பையோ சுட்டலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘சகோதரர்கள்’ என்பது உடன்பிறந்தவர்களை மட்டும் அல்லாமல், நெருங்கிய உறவினர்களையோ தொடர்புடைய மக்களையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּרֶא אָדָם
  choice: காட்டுக் கழுதையைப் போன்ற மனிதன்
  rationale: פֶּרֶא என்பது வெறுமனே ‘காட்டு இயல்புள்ளவன்’ என்பதல்ல; காட்டுக் கழுதை அல்லது ஓனாகர் என்னும் விலங்கைக் குறிக்கிறது. இயல்பான தமிழில் உவமையைத் தெளிவாகவும் உயிரோட்டமாகவும் காக்க ‘காட்டுக் கழுதையைப் போன்ற மனிதன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אָדָם
  choice: மனிதன்
  rationale: இங்கு இந்தச் சொல் பொதுவான மனிதகுலத்தைக் குறிக்காமல், ஆண் தனிநபரான இஸ்மவேலைக் குறிக்கிறது.
- source_word: יָדוֹ בַכֹּל
  choice: அவனுடைய கை எல்லாருக்கும் எதிராக
  rationale: ‘கை’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, சூழலில் உள்ள எதிர்ப்பு அல்லது பகைமைப் பொருளை ‘எதிராக’ என்று வெளிப்படுத்துகிறது.
- source_word: וְיַד כֹּל בּוֹ
  choice: எல்லாருடைய கை அவனுக்கு எதிராக
  rationale: முந்தைய கூறுடன் உள்ள இணை அமைப்பையும் பரஸ்பர எதிர்ப்பையும் தக்கவைக்க ‘கை’ உருவகம் மீண்டும் பயன்படுத்தப்பட்டது.
- source_word: וְעַל־פְּנֵי
  choice: எதிரே
  rationale: இச்சொற்றொடர் ‘முன்பாக’, ‘எதிரில்’, ‘எதிராக’ போன்ற இடம் மற்றும் உறவு சார்ந்த நுண்பொருள்களை ஏற்கக்கூடியது. ‘எதிரே’ என்பது அதன் தெளிவின்மையை ஓரளவு காக்கிறது.
- source_word: כָּל־אֶחָיו
  choice: தன் சகோதரர்கள் எல்லாரும்
  rationale: אָח என்பதன் முதன்மைப் பொருள் ‘சகோதரன்’; அது விரிவாக நெருங்கிய உறவினரையோ தொடர்புடைய மக்களையோ குறிக்கக்கூடும் என்பதால் அந்த நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יִשְׁכֹּן
  choice: குடியிருப்பான்
  rationale: שׁכן என்பது வசித்தல், குடியேறுதல், தங்கியிருத்தல் ஆகியவற்றைக் குறிக்கிறது. முன்னறிவிப்பின் தொனிக்கும் இயல்பான நவீன தமிழுக்கும் ‘குடியிருப்பான்’ பொருந்துகிறது.
theological_decisions:
- issue: פֶּרֶא אָדָם என்ற உருவகம் இஸ்மவேலை எவ்வாறு வருணிக்கிறது
  choice: விலங்கு உருவகத்தை வெளிப்படையாகத் தக்கவைத்து, ‘காட்டுக் கழுதையைப் போன்ற மனிதன்’ என்று மொழிபெயர்த்தல்
  alternative: ‘காட்டு மனிதன்’ என்று பொதுமைப்படுத்துதல்
  rationale: மூல உரையின் வலுவான உருவகத்தை மென்மைப்படுத்தாமல் காக்கிறது; அதேவேளை, மூலத்தில் வெளிப்படையாக இல்லாத ஒழுக்கத் தீர்ப்பைச் சேர்க்காமல், கட்டுப்படாத சுதந்திரம் மற்றும் மோதலை நினைவூட்டும் படிமமாகவே விடுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான முன்னறிவிப்பு நடை பயன்படுத்தப்பட்டது. மூலத்தின் ‘கை’ என்ற இணை உருவகமும் காட்டுக் கழுதை உவமையும் தக்கவைக்கப்பட்டுள்ளன; வְעַל־פְּנֵי என்பதிலுள்ள இடம்/உறவு சார்ந்த தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
