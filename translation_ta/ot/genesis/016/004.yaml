  text: וַ/יָּבֹ֥א אֶל הָגָ֖ר וַ/תַּ֑הַר וַ/תֵּ֨רֶא֙ כִּ֣י הָרָ֔תָה וַ/תֵּקַ֥ל גְּבִרְתָּ֖/הּ בְּ/עֵינֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/004.yaml
  text: He went in to Hagar[a], and she conceived. When she saw that she had conceived, her mistress was despised in her eyes.
translation:
  language: ta
  text: அவன் ஆகாருடன் சேர்ந்தான்; அவள் கருவுற்றாள். அவள் கருவுற்றிருப்பதை அறிந்தபோது, அவள் பார்வையில் அவளுடைய எஜமானி அற்பமானவளானாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லுக்கு சொல், “அவளுடைய பார்வையில் அவளுடைய எஜமானி அற்பமானவளானாள்.” இதன் பொருள், ஆகார் தன் எஜமானியை அற்பமாகக் கருதினாள் என்பதாகவும், அவளை இகழ்ந்தாள் என்பதாகவும் கொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל־הָגָר
  choice: அவன் ஆகாருடன் சேர்ந்தான்
  rationale: இச்சூழலில் בוא אל என்பது பாலுறவைக் குறிக்கும் மரியாதையான மறைமுகச் சொற்றொடர். ‘உடலுறவுகொண்டான்’ என்பதைவிட ‘சேர்ந்தான்’ மூலத்தின் கதைநடையையும் நயத்தையும் காக்கிறது; ‘அவளிடம் சென்றான்’ என்பதைவிட கருத்தைத் தெளிவாக உணர்த்துகிறது.
- source_word: הָגָר
  choice: ஆகார்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: וַתַּהַר / הָרָתָה
  choice: கருவுற்றாள் / கருவுற்றிருப்பதை
  rationale: הרה என்ற வினை கருத்தரித்தலையும் கர்ப்பநிலையையும் குறிக்கக்கூடும். தமிழில் ஒரே சொல்லை மீண்டும் பயன்படுத்துவது எபிரெய மூலத்தின் சொல் மீளுருவை இயல்பாகப் பேணுகிறது.
- source_word: וַתֵּרֶא כִּי
  choice: அறிந்தபோது
  rationale: ראה כי இங்கு ஆகார் தன் கர்ப்பநிலையை உணர்ந்ததைச் சுட்டுகிறது. சொற்பொருளான ‘கண்டபோது’ என்பதைக் காட்டிலும் ‘அறிந்தபோது’ நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַתֵּקַל ... בְּעֵינֶיהָ
  choice: அற்பமாகக் கருதினாள்
  rationale: קלל இங்கு ஒருவரைத் தாழ்வாக அல்லது மதிப்பற்றவராக எண்ணுவதைக் குறிக்கிறது; בְּעֵינֶיהָ என்பது மதிப்பீட்டைக் குறிக்கும் எபிரெய மரபுத்தொடர். இத்தமிழாக்கம் உண்மையில் சாராய் மாறிவிட்டாள் என்று கூறாமல், ஆகாரின் பார்வையில் ஏற்பட்ட மதிப்பீட்டு மாற்றத்தைத் தெரிவிக்கிறது.
- source_word: גְּבִרְתָּהּ
  choice: தன் எஜமானியை
  rationale: גברת என்பது அதிகாரமுள்ள பெண் எஜமானியைக் குறிக்கிறது. ‘எஜமானி’ இங்குள்ள சமூக உறவை நேரடியாகவும் புரியத்தக்க வகையிலும் தருகிறது.
theological_decisions:
- issue: இறுதி தொடரில் ஆகாரின் உள்ளார்ந்த மதிப்பீடா அல்லது அவளுடைய இகழ்ச்சியான நடத்தையா என்பதிலுள்ள நுண்ணிய தெளிவின்மை
  choice: தன் எஜமானியை அற்பமாகக் கருதினாள்
  alternative: அவளுடைய பார்வையில் அவளுடைய எஜமானி அற்பமானவளானாள்; அல்லது, அவள் தன் எஜமானியை இகழ்ந்தாள்
  rationale: எபிரெய இலக்கணத்தில் ‘அவளுடைய எஜமானி’ எழுவாயாக இருந்தாலும், ‘அவளுடைய பார்வையில்’ என்பது ஆகாரின் மதிப்பீட்டையே மையப்படுத்துகிறது. முதன்மை மொழிபெயர்ப்பு இயல்பான தமிழில் அதைக் கூறுகிறது; இகழ்ந்து நடத்தியிருக்கலாம் என்ற சாத்தியத்தை அடிக்குறிப்பு திறந்துவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பாலுறவைக் குறிக்கும் மூலத்தின் மறைமுக நயம் ‘சேர்ந்தான்’ என்பதால் பேணப்பட்டுள்ளது; இறுதி எபிரெய மரபுத்தொடரின் பொருள் இயல்பான தமிழில் தரப்பட்டு, அதன் நுண்ணிய மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
