  text: וַ/יֹּאמַ֗ר הָגָ֞ר שִׁפְחַ֥ת שָׂרַ֛י אֵֽי מִ/זֶּ֥ה בָ֖את וְ/אָ֣נָה תֵלֵ֑כִי וַ/תֹּ֕אמֶר מִ/פְּנֵי֙ שָׂרַ֣י גְּבִרְתִּ֔/י אָנֹכִ֖י בֹּרַֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/008.yaml
  text: And he said[a], “Hagar, Sarai’s servant woman, where have you come from, and where are you going?” And she said[b], “I am fleeing from the presence of Sarai my mistress.”
translation:
  language: ta
  text: அவன், “சாராயின் அடிமைப் பெண்ணாகிய ஆகாரே[a], நீ எங்கிருந்து வந்தாய்? எங்கே போகிறாய்?” என்றான். அதற்கு அவள், “என் எஜமானி சாராயின் முன்னிலையிலிருந்து நான் தப்பியோடிக்கொண்டிருக்கிறேன்[b]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பணிப்பெண்’ அல்லது ‘பெண் வேலைக்காரி’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் சாராயின் அதிகாரத்திற்குக் கீழிருந்த அடிமை நிலையிலிருந்த பெண்ணைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘முன்னிலையிலிருந்து’ என்பது எழுத்துப்படியான மொழிபெயர்ப்பு; இங்கு சாராயிடமிருந்து விலகித் தப்பியோடுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחַת
  choice: அடிமைப் பெண்ணாகிய
  rationale: שִׁפְחָה என்பது சாராயின் அதிகாரத்திற்குக் கீழிருந்த பெண் அடிமையைக் குறிக்கிறது. ‘அடிமைப் பெண்’ அவளுடைய பாலினத்தையும் கட்டுண்ட சமூக நிலையையும் மென்மைப்படுத்தாமல் தெளிவாகக் காட்டுகிறது.
- source_word: אֵי מִזֶּה בָאת
  choice: நீ எங்கிருந்து வந்தாய்?
  rationale: மூலமொழியின் பிறப்பிடம் அல்ல, இப்போது வந்த இடம் குறித்த இயல்பான கேள்வியை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: וְאָנָה תֵלֵכִי
  choice: எங்கே போகிறாய்?
  rationale: אָנָה இலக்கை விசாரிக்கிறது; நிறைவடையாத வினை வடிவத்தின் நிகழ்/எதிர்கால நோக்கை இயல்பான தமிழ் நிகழ்காலத்தில் காக்கிறது.
- source_word: מִפְּנֵי
  choice: முன்னிலையிலிருந்து
  rationale: ‘முகம்/முன்னிலை ஆகியவற்றிலிருந்து’ என்ற எபிரெயச் சொல்லாட்சியை வெளிப்படையாகக் காக்கிறது; சூழலில் ஒருவரிடமிருந்து விலகித் தப்புவதைக் குறிக்கிறது.
- source_word: גְּבִרְתִּי
  choice: என் எஜமானி
  rationale: பெண்பால் வடிவம் பெண் அதிகாரி அல்லது உரிமையாளரைக் குறிக்கிறது. ‘எஜமானி’ அந்தச் சமூக உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: בֹּרַחַת
  choice: நான் தப்பியோடிக்கொண்டிருக்கிறேன்
  rationale: பங்கேற்பு வினை வடிவம் தொடர்ந்து நடந்துகொண்டிருக்கும் தப்பியோடும் செயலைக் குறிக்கிறது; ‘கொண்டிருக்கிறேன்’ அந்த நீடித்த அம்சத்தைக் காக்கிறது.
- source_word: וַיֹּאמַר
  choice: அவன் … என்றான்
  rationale: முந்தைய வசனத்தில் பேச்சாளர் கர்த்தருடைய தூதர் என்பது தெளிவாயினும், இவ்வசனம் ‘அவன் சொன்னான்’ என்றே கூறுகிறது; ஆகவே பட்டத்தைச் சேர்க்காமல் மூலத்தின் வெளிப்பாட்டைப் பேணுகிறது.
- source_word: שָׂרַי
  choice: சாராய்
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவத்தில் தரப்பட்டுள்ளது.
- source_word: הָגָר
  choice: ஆகார்
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவத்தில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: ஆகாரின் சமூக நிலையை எவ்வாறு மொழிபெயர்ப்பது
  choice: அடிமைப் பெண்
  alternative: வேலைக்காரி / பணிப்பெண்
  rationale: வசனம் ஆகாரை சாராயின் கட்டுப்பாட்டிற்குக் கீழிருந்த பெண்ணாக அடையாளப்படுத்துகிறது. ‘வேலைக்காரி’ போன்ற மென்மையான சொற்கள் கட்டுண்ட நிலையைக் மறைக்கக்கூடும்; ‘அடிமைப் பெண்’ மூலத்தின் சமூகத் தீவிரத்தைப் பேணுகிறது.
- issue: பேச்சாளர் கர்த்தருடைய தூதர் என்று இவ்வசனத்தில் வெளிப்படையாகச் சேர்ப்பதா
  choice: அவன் … என்றான்
  alternative: கர்த்தருடைய தூதர் சொன்னார்
  rationale: முந்தைய வசனம் பேச்சாளரை அடையாளப்படுத்தினாலும், இவ்வசனத்தின் எபிரெய உரை அந்தப் பட்டத்தை மீண்டும் கூறவில்லை. எனவே சூழலால் தெளிவானதை உரைக்குள் கூடுதலாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ஆகாரின் அடிமை நிலை மென்மைப்படுத்தப்படவில்லை; அதேவேளை ‘முன்னிலையிலிருந்து’ என்ற எபிரெயச் சொல்லாட்சி பிரதான உரையில் காக்கப்பட்டுள்ளது. வினாக்கள் தமிழில் நேரடியான, எளிதில் புரியும் பேச்சு நடையில் தரப்பட்டுள்ளன.
