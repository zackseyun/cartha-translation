base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/014.yaml
  text: Therefore the well was called Beer-lahai-roi. Look, it is between Kadesh and Bered.
translation:
  language: ta
  text: ஆகையால் அந்தக் கிணறு பெயேர்-லஹாய்-ரோயீ[a] என்று அழைக்கப்பட்டது. இதோ, அது காதேஷுக்கும் பாரேதுக்கும் இடையில் இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெயேர்-லஹாய்-ரோயீ” என்பதன் துல்லியமான பொருள் உறுதியல்ல. இதை “என்னைக் காண்கிற உயிருள்ளவரின் கிணறு” என்றும், “உயிரின் தரிசனக் கிணறு” என்றும் பொருள் கொள்ளலாம்.
    reason: எபிரெய இடப்பெயரின் பொருள் மற்றும் இலக்கண உறவு பற்றிய உண்மையான தெளிவின்மையை, ஒரு விளக்கத்தை உரையில் திணிக்காமல் தெரிவிக்கிறது.
lexical_decisions:
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: முந்தைய நிகழ்வின் விளைவாகப் பெயரிடப்பட்டதை இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: קָרָא
  choice: அழைக்கப்பட்டது
  rationale: எபிரெய வடிவம் செய்பவரைத் தெளிவாகக் குறிப்பிடாமல் இருப்பதால், தமிழில் இயல்பான செயப்பாட்டு வடிவம் பயன்படுத்தப்பட்டது.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: பெயேர்-லகாய்-ரோயீ
  rationale: இது இடப்பெயராக இருப்பதால் ஒலிபெயர்க்கப்பட்டது; அதன் பொருள் குறிப்பு வழியாகத் தரப்படுகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: வாசகரின் கவனத்தை இடத்தின்மீது திருப்பும் மூலமொழியின் சுட்டும் வலிமையைப் பாதுகாக்கிறது.
- source_word: בֵין ... וּבֵין
  choice: '...க்கும் ...க்கும் இடையில்'
  rationale: இரு இடங்களுக்கு நடுவிலான அமைவிடத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: பெயேர்-லகாய்-ரோயீ என்பதன் பொருளிலுள்ள இலக்கணத் தெளிவின்மை
  choice: பெயரை உரையில் ஒலிபெயர்த்து, அதன் சாத்தியமான பொருளை அடிக்குறிப்பில் அளித்தல்
  alternative: ‘என்னைக் காண்கிற உயிருள்ளவரின் கிணறு’ என்று பொருளை நேரடியாக உரையில் மொழிபெயர்த்தல்
  rationale: לַחַי רֹאִי என்ற சொற்றொடரின் துல்லியமான உறவு பலவாறு புரிந்துகொள்ளப்படலாம்; உரையில் ஒரே விளக்கத்தைத் திணிக்காமல் இடப்பெயரைப் பாதுகாப்பது பொருத்தமானது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வேதாகம உரைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. காதேசு, பேரேது ஆகிய பெயர்கள் தமிழ் ஒலியமைப்புக்கு ஏற்றவாறு தரப்பட்டுள்ளன; הִנֵּה என்பதின் கவன ஈர்ப்பு ‘இதோ’ என்று பாதுகாக்கப்பட்டுள்ளது.
