source:
  edition: WLC
  text: וַֽ/יְחִ֣י מְתוּשֶׁ֗לַח אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת לֶ֔מֶךְ שְׁתַּ֤יִם וּ/שְׁמוֹנִים֙ שָׁנָ֔ה וּ/שְׁבַ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/026.yaml
  text: After he fathered Lamech, Methuselah lived 782 years and fathered sons and daughters.
translation:
  language: ta
  text: லாமேக்குக்குத் தந்தையான பிறகு, மெத்தூசலா எழுநூற்று எண்பத்திரண்டு ஆண்டுகள் வாழ்ந்தான்; அவன் மகன்களையும் மகள்களையும் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்து
  rationale: வம்சவரலாற்றுச் சூழலில் חיה ஒருவரின் வாழ்நாள் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் வாக்கிய ஓட்டத்துக்கு ஏற்றவாறு வினையெச்சமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מְתוּשֶׁלַח
  choice: மெத்தூசலா
  rationale: எபிரெய தனிப்பெயருக்கு தமிழில் வழக்கிலுள்ள ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־לֶמֶךְ
  choice: லாமேக்கைப் பெற்ற பிறகு
  rationale: அடுத்து வரும் காலப்பகுதியை אַחֲרֵי தெளிவாகக் குறிக்கிறது. ילד என்பதன் ஹிஃபில் வடிவம் ஆண் வழி மகப்பேற்றைக் குறித்தாலும், தமிழில் ஒரு தந்தையைப் பற்றியும் இயல்பாகப் பயன்படுத்தப்படும் ‘பெற்ற’ என்பது பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: שְׁתַּיִם וּשְׁמוֹנִים שָׁנָה וּשְׁבַע מֵאוֹת שָׁנָה
  choice: 782 ஆண்டுகள்
  rationale: எபிரெய எண்ணமைப்பு சொற்சொல்லாக ‘இரண்டும் எண்பதும் ஆண்டுகள், மேலும் எழுநூறு ஆண்டுகள்’ என இருந்தாலும், அதன் மொத்த மதிப்பு தமிழின் இயல்பான எண் வரிசையில் 782 என்று தரப்பட்டுள்ளது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றில் ילד என்பதன் ஹிஃபில் வடிவம் பிள்ளைகளைப் பெற்ற தந்தையைக் குறிக்கிறது; முன் வரும் அதே வேர்ச்சொல்லுடன் தமிழிலும் ஒரே சொல்லாட்சி பேணப்பட்டுள்ளது.
- source_word: בָּנִים וּבָנוֹת
  choice: மகன்களையும் மகள்களையும்
  rationale: மூலத்தில் ஆண், பெண் பிள்ளைகள் தனித்தனியாகக் குறிப்பிடப்படுவதால், பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக அந்த வேறுபாடு தக்கவைக்கப்பட்டுள்ளது.
