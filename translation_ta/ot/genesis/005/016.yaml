source:
  edition: WLC
  text: וַֽ/יְחִ֣י מַֽהֲלַלְאֵ֗ל אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת יֶ֔רֶד שְׁלֹשִׁ֣ים שָׁנָ֔ה וּ/שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/016.yaml
  text: After he fathered Jared, Mahalalel lived eight hundred and thirty years and fathered sons and daughters.
translation:
  language: ta
  text: யாரேதுக்குத் தந்தையான பிறகு, மகலாலெயேல் எண்ணூற்று முப்பது ஆண்டுகள் வாழ்ந்தார்; அவர் மகன்களையும் மகள்களையும் பெற்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்து
  rationale: இந்த வம்சவரலாற்றுச் சூத்திரத்தில், பெயர் குறிப்பிடப்பட்ட மகன் பிறந்தபின் தொடர்ந்த வாழ்நாளைக் குறிக்கிறது; தமிழில் இயல்பாக வாக்கியத்தோடு இணைக்க வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: מַהֲלַלְאֵל
  choice: மகலலெயேல்
  rationale: எபிரேய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயன்றவரை பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: אַחֲרֵי
  choice: பிறகு
  rationale: யாரேது பிறந்ததைத் தொடர்ந்து வந்த காலப்பகுதியைச் சுட்டும் காலத் தொடர்புச் சொல்.
- source_word: הוֹלִידוֹ
  choice: பெற்ற பிறகு
  rationale: ஹிஃபில் வடிவம் ஆண் பெற்றோராகப் பிள்ளையைப் பெறுதல் அல்லது பிறப்பித்தல் என்பதைக் குறிக்கிறது. தமிழில் ‘யாரேதைப் பெற்ற பிறகு’ என்பது இயல்பாகவும் தந்தையின் பங்கைச் சூழலில் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: יֶרֶד
  choice: யாரேது
  rationale: எபிரேயப் பெயரான Yered என்பதன் ஒலியை அடிப்படையாகக் கொண்ட தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: שְׁלֹשִׁים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: எண்ணூற்று முப்பது ஆண்டுகள்
  rationale: எபிரேயத்தில் ‘முப்பது ஆண்டு மற்றும் எட்டு நூறு ஆண்டு’ என அமைந்த எண்ணை, மொத்த மதிப்பை மாற்றாமல் இயல்பான தமிழ் வரிசையில் அளிக்கிறது.
- source_word: וַיּוֹלֶד
  choice: பெற்றார்
  rationale: இங்கு மேலும் பிள்ளைகளைத் தந்தையாகப் பெற்றார் என்பதைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் மரியாதையான நடையிலும் உள்ளது.
- source_word: בָּנִים וּבָנוֹת
  choice: மகன்களையும் மகள்களையும்
  rationale: மூலத்தில் ஆண், பெண் பிள்ளைகள் தனித்தனியாகக் குறிப்பிடப்படுவதைக் காக்கிறது.
