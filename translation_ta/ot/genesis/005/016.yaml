translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வம்சவரலாற்று நடை. மூலத்தின் நிகழ்வுவரிசையும் ஆண், பெண் சந்ததியைக் குறிப்பாகச் சொல்லும் தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
