source:
  edition: WLC
  text: וַֽ/יְהִי֙ כָּל יְמֵי לֶ֔מֶךְ שֶׁ֤בַע וְ/שִׁבְעִים֙ שָׁנָ֔ה וּ/שְׁבַ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יָּמֹֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/031.yaml
  text: So all the days of Lamech were seven hundred seventy-seven years[a], and he died.
translation:
  language: ta
  text: லாமேக்கின் வாழ்நாட்கள் அனைத்தும் எழுநூற்று எழுபத்தேழு ஆண்டுகள்[a]. பின்பு அவன் இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இந்த எண் சொல்லுக்கு சொல், “ஏழும் எழுபதும் ஆண்டுகள்; மேலும் ஏழு நூறு ஆண்டுகள்” என்ற வரிசையில் வருகிறது; அதாவது 777 ஆண்டுகள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כָּל יְמֵי
  choice: வாழ்நாட்கள் அனைத்தும்
  rationale: ஒருவருடைய வாழ்நாளின் மொத்தக் காலத்தைக் குறிக்கும் எபிரெய வழக்கை, மூலத்தின் ‘நாட்கள்’ என்ற உருவகத்தைத் தக்கவைத்தபடி இயல்பான தமிழில் தருகிறது. வַיְהִי-யின் கதைத் தொடர்ச்சி தனியாகச் செயப்படுத்தப்படாமல் முழு வாக்கிய அமைப்பில் வெளிப்படுகிறது.
- source_word: לֶמֶךְ
  choice: லாமேக்கு
  rationale: தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு; உருபு சேரும்போது ‘லாமேக்கின்’ என வருகிறது.
- source_word: שֶׁבַע וְשִׁבְעִים ... וּשְׁבַע מֵאוֹת
  choice: எழுநூற்று எழுபத்தேழு
  rationale: எபிரெயத்தில் ஒன்று, பத்து, நூறு என்ற வரிசையில் கூறப்பட்ட மொத்த எண்ணான 777-ஐ நவீன தமிழின் இயல்பான எண் வரிசையில் தெளிவாகத் தருகிறது.
- source_word: שָׁנָה
  choice: ஆண்டுகள்
  rationale: எபிரெயத்தில் எண்ணுக்குப் பின் ஒருமை வடிவம் வந்தாலும், தமிழில் 777 என்ற எண்ணுடன் பன்மையான ‘ஆண்டுகள்’ இயல்பானது.
- source_word: וַיָּמֹת
  choice: பின்பு அவன் இறந்தான்
  rationale: வம்சவரலாற்றில் மீண்டும் மீண்டும் வரும் நிறைவு வாய்ப்பாட்டையும் கதைத் தொடர்ச்சியையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஆதியாகமம் 5-இன் வம்சவரலாற்று ஆயுட்கால வாய்ப்பாடு
  choice: எண்ணை வரலாற்று ஆயுட்காலச் சுருக்கமாக எந்த விளக்கக் கட்டுப்பாடும் இன்றித் தெளிவாக மொழிபெயர்த்தல்
  alternative: எண்ணை அடையாளப் பொருளுடையதாக மொழிபெயர்ப்பிலேயே விளக்குதல்
  rationale: எபிரெய உரை நேரடியான ஆயுட்கால எண்ணையும் மரண அறிவிப்பையும் தருகிறது. அதன் அடையாள அல்லது வேறு விளக்கத்தை மொழிபெயர்ப்புக்குள் புகுத்தாமல் உரையின் வெளிப்படையான பொருளைப் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘வாழ்நாட்கள் அனைத்தும்’ என்பது மூலத்தின் சொல்லோவியத்தைத் தக்கவைக்கிறது; ‘பின்பு அவன் இறந்தான்’ என்பது வம்சவரலாற்றின் மீளும் ஓசையையும் தீவிரத்தையும் காக்கிறது.
