source:
  edition: WLC
  text: וַֽ/יְהִי נֹ֕חַ בֶּן חֲמֵ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֣וֹלֶד נֹ֔חַ אֶת שֵׁ֖ם אֶת חָ֥ם וְ/אֶת יָֽפֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/032.yaml
  text: When Noah was five hundred years old[a], he fathered Shem, Ham[b], and Japheth.
translation:
  language: ta
  text: நோவாவுக்கு ஐந்நூறு வயதானபோது, அவர் சேம், காம், யாப்பேத் ஆகியோருக்குத் தந்தையானார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சேம், காம், யாப்பேத்’ என்ற வரிசை எபிரெய மூலத்தைப் பின்பற்றுகிறது. இது கட்டாயமாகப் பிறப்பு வரிசையைக் குறிப்பதுமில்லை; மூவரும் ஒரே ஆண்டில் பிறந்தார்கள் என்று கூறுவதுமில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי
  choice: வயதானபோது
  rationale: இங்கு இந்த வடிவம் அடுத்த நிகழ்வுக்கான காலச் சூழலை அறிமுகப்படுத்துகிறது. எபிரெய மொழிநடையைச் சொற்சொல்லாகப் பின்பற்றாமல், அதன் காலப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בֶּן חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: ஐந்நூறு வயது
  rationale: בן + எண் + שנה என்பது ஒருவரின் வயதைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘ஐந்நூறு வயது’ என்பது அதன் இயல்பான தமிழ் இணை.
- source_word: וַיּוֹלֶד
  choice: பெற்றார்
  rationale: ஆண் எழுவாயுடன் வரும் ילד என்பதன் ஹிஃபில் வடிவம் ‘தந்தையானார்/பிள்ளைகளைப் பெற்றார்’ என்ற பொருளைக் கொண்டது. ‘பெற்றார்’ என்பது சுருக்கமானதும் இயல்பானதும்; இச்சூழலில் தந்தையாகப் பெற்றார் என்பது தெளிவு.
- source_word: נֹחַ
  choice: நோவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற தனிப்பெயர் வடிவம்.
- source_word: שֵׁם
  choice: சேம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: חָם
  choice: காம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: יָפֶת
  choice: யாப்பேத்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற ஒலிபெயர்ப்பு.
theological_decisions:
- issue: சேம், காம், யாப்பேத் என்ற பெயர்ப்பட்டியல் பிறப்பு வரிசையைக் குறிக்கிறதா
  choice: எபிரெய மூலத்தின் பெயர் வரிசையை மாற்றாமல் வைத்திருத்தல்; மூவரும் ஒரே ஆண்டில் பிறந்ததாக முதன்மை உரையில் கூறாதிருத்தல்
  alternative: ஊகிக்கப்படும் பிறப்பு வரிசைப்படி பெயர்களை மாற்றுதல் அல்லது மூவரும் நோவாவின் ஐந்நூறாவது வயதில் பிறந்ததாகத் தெளிவுபடுத்துதல்
  rationale: மூலவசனம் பெயர்களை இந்த வரிசையில் தருகிறது; ஆனால் இந்த வரிசையே பிறப்பு வரிசை என்றோ, மூவரும் ஒரே ஆண்டில் பிறந்தார்கள் என்றோ கட்டாயப்படுத்தவில்லை. ஆகவே மூலத்திலுள்ள தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் காலத் தொடர்பு இயல்பான ‘வயதானபோது’ அமைப்பால் தரப்பட்டுள்ளது; பெயர் வரிசையும் மூலத்தின் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
