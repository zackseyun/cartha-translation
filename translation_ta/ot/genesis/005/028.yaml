  yaml_path: translation/ot/genesis/005/028.yaml
  text: And Lamech lived one hundred and eighty-two years, and fathered a son.
translation:
  language: ta
  text: லாமேக்கு நூற்று எண்பத்திரண்டு ஆண்டுகள் வாழ்ந்தபின், ஒரு மகனுக்குத் தந்தையானான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்தபின்
  rationale: வம்சவரலாற்றுச் சூத்திரத்தில் חיה என்பது அடுத்த நிகழ்வு வரையிலான வாழ்நாளைக் குறிக்கிறது. எபிரேய தொடர் வினை அமைப்பை இயல்பான தமிழில் வெளிப்படுத்த, கால எண்ணிக்கையோடு ‘வாழ்ந்தபின்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לֶמֶךְ
  choice: லாமேக்கு
  rationale: தமிழ் வேதாகமப் பெயர்மரபில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: שְׁתַּיִם וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: நூற்று எண்பத்திரண்டு ஆண்டுகள்
  rationale: எபிரேயத்தில் ‘இரண்டும் எண்பதும் ... நூறும்’ என்ற வரிசையில் வரும் எண்ணிக்கை, இயல்பான தமிழ் எண்ணமைப்பில் 182 ஆண்டுகள் என வழங்கப்பட்டது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: ஆண் எழுவாயுடன் வரும் ילד என்பதன் ஹிஃபில் வடிவம் ‘ஒரு பிள்ளைக்குத் தந்தையானான்/பெற்றான்’ என்று பொருள்படும். வம்சவரலாற்றுச் சூழலில் ‘பெற்றான்’ என்பது சுருக்கமானதும் இயல்பானதும்; தாயின் பிரசவத்தைக் குறிப்பதாக இங்கு புரிந்துகொள்ள வேண்டியதில்லை.
- source_word: בֵּן
  choice: ஒரு மகனை
  rationale: בֵּן என்பது ‘மகன்’ என்று பொருள். இவ்வசனத்தில் அவன் இன்னும் பெயரிடப்படாததால் தமிழில் ‘ஒரு மகனை’ என்பது இயல்பான வடிவம்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரலாற்றுக்கேற்ற சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. எபிரேய வாக்கிய இணைப்பை சொற்குச் சொல் ‘மற்றும்’ எனத் தொடராமல், நிகழ்வுகளின் காலத் தொடர்பை ‘வாழ்ந்தபின்’ என்று இயல்பாக வெளிப்படுத்துகிறது.
