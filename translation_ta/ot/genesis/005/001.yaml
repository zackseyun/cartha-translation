base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/001.yaml
  text: This is the book of the generations of Adam[a]. In the day God created man[b], he made him in the likeness of God.
translation:
  language: ta
  text: இது ஆதாமின் வம்சவரலாற்று நூல். கடவுள் மனிதனை[a] படைத்த நாளில்[b], அவர் அவனைக் கடவுளின் சாயலில் உண்டாக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள எபிரேயச் சொல் மனிதரைப் பொதுவாக, அதாவது ‘மனிதகுலத்தை,’ குறிக்கவும் முடியும்; இதே சொல் வசனத்தின் முதல் பகுதியில் ‘ஆதாம்’ என்ற இயற்பெயராக வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நாளில்’ என்ற எபிரேய மரபுத்தொடர் காலப்பொருளில் ‘படைத்தபோது’ என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה סֵפֶר
  choice: இது ... நூல்
  rationale: எழுவாய் வினையற்ற எபிரேயத் தலைப்பை இயல்பான தமிழில் காட்டுகிறது; סֵפֶר என்பதன் எழுத்துப்பூர்வ ஆவணம்/நூல் என்ற பொருளையும் தக்கவைக்கிறது.
- source_word: תּוֹלְדֹת
  choice: தலைமுறைகளைப் பற்றிய
  rationale: ஆதாமிலிருந்து தோன்றும் தலைமுறைகளையும் அவற்றின் வரலாற்றுப் பதிவையும் குறிக்கும் ஆதியாகமத்தின் முக்கியச் சொல்லின் பரப்பை மிகக் குறுக்காமல் வெளிப்படுத்துகிறது.
- source_word: אָדָם (முதல் இடம்)
  choice: ஆதாம்
  rationale: தொடரும் வம்சவரிசையின் மூதாதையைக் குறிக்கும் தலைப்பாக இருப்பதால், இங்கு இது இயற்பெயராகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: בְּיוֹם בְּרֹא
  choice: படைத்த நாளில்
  rationale: ‘படைத்தபோது’ என்ற காலப்பொருள் சாத்தியமாக இருந்தாலும், மூலத்தின் ‘நாளில்’ என்ற வடிவத்தையும் ஆதியாகமம் 1–2 உடனான எதிரொலியையும் காக்கிறது.
- source_word: אָדָם (இரண்டாம் இடம்)
  choice: மனிதனை
  rationale: இங்கு படைப்புக் குறிப்பை எதிரொலிக்கும் பொதுப்பெயர் பொருள் முன்னிலையாகிறது; தமிழில் ஒருமை நேர்பொருளையும் மனிதரைப் பொதுவாகக் குறிக்கும் திறனையும் இது தக்கவைக்கிறது.
- source_word: בִּדְמוּת אֱלֹהִים
  choice: கடவுளின் சாயலில்
  rationale: דְּמוּת என்பதன் ‘ஒத்திருத்தல்/சாயல்’ பொருளை வழங்கி, இங்கு இல்லாத צֶלֶם (‘உருவம்’) என்ற வேறு சொல்லோடு ஒன்றாக்குவதைத் தவிர்க்கிறது.
- source_word: עָשָׂה אֹתוֹ
  choice: அவனை உண்டாக்கினார்
  rationale: עשה என்பதன் ‘உண்டாக்கு’ என்ற பரந்த பொருளையும் எபிரேய மூன்றாம் நபர் ஆண்பால் ஒருமை சுட்டுப்பெயரையும் காக்கிறது; கடவுளைக் குறிக்கும் வினையில் இயல்பான மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ஒரே வசனத்தில் אָדָם என்பதற்கு வரும் இரு பயன்பாடுகள்
  choice: முதல் இடத்தில் ‘ஆதாம்’; படைப்புக் கூற்றில் ‘மனிதன்’
  alternative: இரு இடங்களிலும் ‘ஆதாம்’, அல்லது இரண்டாம் இடத்தில் ‘மனிதகுலம்’
  rationale: முதல் பயன்பாடு வரவிருக்கும் வம்சவரிசையின் பெயரிடப்பட்ட மூதாதையைக் குறிக்கிறது. இரண்டாவது படைப்புக் கதையை எதிரொலித்து மனிதரைப் பொதுவாகக் குறிக்கிறது; அதேவேளை அடுத்துள்ள ஆண்பால் ஒருமை சுட்டுப்பெயரின் வடிவத்தையும் மொழிபெயர்ப்பு மறைக்கவில்லை.
- issue: ‘கடவுளின் சாயல்’ என்பதற்கும் படைப்புக் கதையின் ‘உருவம்’ மொழிக்கும் உள்ள உறவு
  choice: ‘சாயல்’ என்று தனித்தே மொழிபெயர்த்தல்
  alternative: ‘கடவுளின் உருவத்தில்’ என்று ஒத்திசைத்தல்
  rationale: இவ்வசனத்தில் דְּמוּת என்ற சொல்லே உள்ளது; צֶלֶם இல்லை. ஆகவே அருகிலுள்ள படைப்புப் பகுதிகளின் சொற்களோடு அமைதியாக ஒன்றாக்காமல் மூலத்தின் வேறுபாடு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதில் புரியக்கூடிய, ஆனால் தலைப்புக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நூல்’, ‘நாளில்’, ‘சாயல்’ ஆகியவை மூலத்தின் வடிவத் தொடர்புகளைத் தக்கவைக்கின்றன; கடவுளைக் குறிக்கும் வினை தமிழின் வழக்கமான மரியாதை வடிவில் உள்ளது.
