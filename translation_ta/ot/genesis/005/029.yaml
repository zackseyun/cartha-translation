  text: וַ/יִּקְרָ֧א אֶת שְׁמ֛/וֹ נֹ֖חַ לֵ/אמֹ֑ר זֶ֞֠ה יְנַחֲמֵ֤/נוּ מִֽ/מַּעֲשֵׂ֨/נוּ֙ וּ/מֵ/עִצְּב֣וֹן יָדֵ֔י/נוּ מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר אֵֽרְרָ֖/הּ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/029.yaml
  text: And he called his name Noah[a], saying, “This one will comfort us from our work and from the painful toil of our hands, from the ground that Yahweh has cursed.”
translation:
  language: ta
  text: அவன் அவனுக்கு நோவா[a] என்று பெயரிட்டு, “நமது வேலையிலிருந்தும், நமது கைகளின் வேதனைமிக்க உழைப்பிலிருந்தும், யாவே சபித்த நிலத்திலிருந்தும் இவன் நமக்கு ஆறுதல் அளிப்பான்” என்று கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நோவா என்ற பெயர் எபிரேயத்தில் “ஓய்வு” அல்லது “நிம்மதி” என்பதைக் குறிக்கும் சொல்லுடன் ஒத்தொலிக்கிறது; இங்குள்ள “ஆறுதல் அளிப்பான்” என்ற வினையுடனும் சொல் விளையாட்டு உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: அவனுக்கு … என்று பெயரிட்டு
  rationale: எபிரேயப் பெயரிடும் சூத்திரத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘அவனுடைய பெயரை அழைத்தான்’ என்ற செயற்கையான சொல்லாக்கத்தைத் தவிர்க்கிறது.
- source_word: נֹחַ
  choice: நோவா[a]
  rationale: தமிழில் நிலைபெற்றுள்ள பெயர் வடிவம் பயன்படுத்தப்படுகிறது; பெயருக்கும் தொடர்ந்து வரும் வினைக்கும் இடையிலான எபிரேய ஒலிச்சொல் விளையாட்டு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: זֶה
  choice: இவன்
  rationale: குழந்தையைச் சுட்டும் demonstrative-இன் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יְנַחֲמֵנוּ
  choice: நமக்கு ஆறுதல் அளிப்பான்
  rationale: נחם என்பதன் முதன்மைப் பொருளான ‘ஆறுதலளித்தல்/தேற்றுதல்’ என்பதைக் நேரடியாகக் கொடுக்கிறது; ‘ஓய்வு அளிப்பான்’ என மாற்றி பெயரின் ஒலித்தொடர்பை சொற்பிறப்பாகக் காட்டுவதில்லை.
- source_word: מִמַּעֲשֵׂנוּ
  choice: நமது வேலையிலிருந்தும்
  rationale: இச்சூழலில் מַעֲשֶׂה ஒழுக்கச் செயல்களை அல்ல, மனித உழைப்பையும் வேலையையும் குறிக்கிறது; מן முன்னிடைச்சொல்லின் ‘இலிருந்து’ பொருளும் தக்கவைக்கப்படுகிறது.
- source_word: וּמֵעִצְּבוֹן יָדֵינוּ
  choice: நமது கைகளின் வேதனைமிக்க உழைப்பிலிருந்தும்
  rationale: ஆதியாகமம் 3:17-ஐ எதிரொலிக்கும் עִצָּבוֹן என்பதிலுள்ள வேதனை மற்றும் கடின உழைப்பு ஆகிய இரு நுண்ணுணர்வுகளையும், ‘கைகள்’ என்ற மூலப்படிமத்தையும் பாதுகாக்கிறது.
- source_word: מִן־הָאֲדָמָה אֲשֶׁר אֵרְרָהּ
  choice: சபித்த நிலத்தினால் ஏற்பட்ட
  rationale: அருகிலுள்ள உழைப்புத் துன்பத்தின் மூலமாகச் சபிக்கப்பட்ட நிலத்தைப் புரிந்துகொள்வது இயல்பான தமிழில் வெளிப்படுகிறது; ‘நிலம்’ என்பது ஆதியாகமத்தின் மண்/நிலம் சார்ந்த தொடர்பைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றீடாக இடாமல், எபிரேய நான்கெழுத்துத் திருப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: நோவா என்ற பெயருக்கும் יְנַחֲמֵנוּ என்ற வினைக்கும் உள்ள தொடர்பு
  choice: முதன்மை உரையில் ‘நமக்கு ஆறுதல் அளிப்பான்’; அடிக்குறிப்பில் ‘ஓய்வு/நிம்மதி’ என்ற பெயரொலித் தொடர்பு
  alternative: ‘நமக்கு ஓய்வு அளிப்பான்’ அல்லது ‘நமக்கு நிம்மதி தருவான்’
  rationale: வினை נחם பொதுவாக ‘ஆறுதலளி/தேற்று’ என்று பொருள்படும்; நோவா என்ற பெயர் ‘ஓய்வு/நிம்மதி’யை நினைவூட்டும் ஒலிச்சொல் விளையாட்டை உருவாக்குகிறது. இவை கடுமையான ஒரே சொற்பிறப்பு என்று தீர்மானிக்காமல் இரு அம்சங்களும் பாதுகாக்கப்படுகின்றன.
- issue: מִן־הָאֲדָמָה என்பதன் தொடர்பு
  choice: ‘சபித்த நிலத்தினால் ஏற்பட்ட’ என்பது வேலைக்கும் வேதனைமிக்க உழைப்புக்கும் காரண/மூலத் தொடர்பாக வழங்கப்படுகிறது
  alternative: ‘யாவே சபித்த நிலத்திலிருந்து’ என்று அடுத்தடுத்து சொற்சொல்லாக வழங்குதல்
  rationale: எபிரேயத்தில் தொடரின் இணைப்பு ஓரளவு சுருக்கமாக இருப்பதால், தமிழில் அதன் இயல்பான காரணத் தொடர்பு தெரிவிக்கப்படுகிறது; நிலமே சபிக்கப்பட்டது என்ற கருத்து மாற்றப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘இவன்’ என்பது தந்தை குழந்தையைச் சுட்டிச் சொல்வதன் நேரடியான வலிமையைப் பாதுகாக்கிறது. ‘யாவே’ தனிப்பட்ட இறைப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
