  text: וַֽ/יְחִי יֶ֗רֶד אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת חֲנ֔וֹךְ שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/019.yaml
  text: And Yered lived eight hundred years after he fathered Hanokh[a], and he fathered sons and daughters.
translation:
  language: ta
  text: யெரெட் ஹனோக்கைப்[a] பெற்ற பிறகு எண்ணூறு ஆண்டுகள் வாழ்ந்தான்; மகன்களையும் மகள்களையும் பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இப்பெயர்களின் மரபான தமிழ் வடிவங்கள் ‘யாரேத்’, ‘ஏனோக்கு’ என்பவை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்து
  rationale: வம்சவரலாற்றுச் சூத்திரத்தில் חיה என்பது குறிப்பிடப்பட்ட காலம் வாழ்ந்ததைக் குறிக்கிறது; தொடர்வாக்கியத்துடன் இயல்பாக இணைய வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: יֶרֶד
  choice: யெரேத்
  rationale: எபிரேயப் பெயரின் ஒலிவடிவத்தைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது; மரபான தமிழ் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אַחֲרֵי
  choice: பிறகு
  rationale: பெயரிடப்பட்ட மகன் பிறந்ததைத் தொடர்ந்து வந்த காலத்தைத் தெளிவாகக் குறிக்கும் இயல்பான நவீனத் தமிழ் காலச்சொல்.
- source_word: הוֹלִידוֹ
  choice: பெற்ற
  rationale: הוליד என்பதன் causative வடிவம் இங்கு ஆண் முன்னோரின் தந்தைமைச் செயலைக் குறிக்கிறது. தமிழில் ‘பெற்றான்’ என்பது ஆணுக்கும் இயல்பாகப் பயன்பட்டு, ‘பெற்றெடுத்தான்’ என்ற தாய்மை சார்ந்த பொருளைத் தவிர்க்கிறது.
- source_word: אֶת חֲנוֹךְ
  choice: ஹனோக்கை
  rationale: חֲנוֹךְ என்ற எபிரேயப் பெயரை மூல ஒலிக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்த்து, வேற்றுமை உருபுடன் வழங்குகிறது.
- source_word: שְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: எண்ணூறு ஆண்டுகள்
  rationale: காலநீளத்தைக் குறிக்கும் எண் தொடரைத் தெளிவான இயல்பான தமிழில் வழங்குகிறது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: முந்தைய ילד வேர்ச்சொல்லின் பொருளைத் தொடர்ந்து காத்து, ஆண் முன்னோர் பிற பிள்ளைகளுக்குத் தந்தையானதைக் குறிக்கிறது.
- source_word: בָּנִים וּבָנוֹת
  choice: மகன்களையும் மகள்களையும்
  rationale: எபிரேயம் ஆண், பெண் பிள்ளைகளைத் தனித்தனியாகக் குறிப்பிடுவதால், பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக அந்தத் தனித்தன்மை பாதுகாக்கப்படுகிறது.
