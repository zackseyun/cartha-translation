source:
  edition: WLC
  text: וַֽ/יְחִי לֶ֗מֶךְ אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת נֹ֔חַ חָמֵ֤שׁ וְ/תִשְׁעִים֙ שָׁנָ֔ה וַ/חֲמֵ֥שׁ מֵאֹ֖ת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/030.yaml
  text: And Lamech lived five hundred and ninety-five years after he fathered Noah[a], and he fathered sons and daughters.
translation:
  language: ta
  text: நோவாவைப் பெற்ற பிறகு, லாமேக்கு ஐந்நூற்று தொண்ணூற்றைந்து ஆண்டுகள் வாழ்ந்தான்; மேலும், மகன்களையும் மகள்களையும் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்து
  rationale: ஆதியாகமம் 5-இன் வம்சவரலாற்றுச் சூத்திரத்தில், குறிப்பிடப்பட்ட பிறப்புக்குப் பிந்தைய வாழ்நாள் காலத்தைக் குறிக்கிறது; தமிழில் தொடர்வினை அமைப்பு இயல்பாக உள்ளது.
- source_word: אַחֲרֵי
  choice: பிறகு
  rationale: நோவாவின் பிறப்புக்குப் பிந்தைய காலத்தைத் தெளிவாகக் குறிக்கும் இயல்பான காலவியல் சொல்.
- source_word: הוֹלִידוֹ
  choice: பெற்ற பிறகு
  rationale: ஹிப்ஃபீல் வடிவம் ஆண் பெற்றோரைச் சார்ந்த ‘தந்தையானான்/பெற்றான்’ என்ற பொருளைக் கொண்டது. தமிழில் ‘நோவாவைப் பெற்ற பிறகு’ என்பது இயல்பாகவும் தந்தைச் செயப்பொருளைச் சூழலால் தெளிவாகவும் தருகிறது.
- source_word: נֹחַ
  choice: நோவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: חָמֵשׁ וְתִשְׁעִים ... וַחֲמֵשׁ מֵאוֹת שָׁנָה
  choice: ஐந்நூற்று தொண்ணூற்றைந்து ஆண்டுகள்
  rationale: எபிரெய எண்ணமைப்பு 95 + 500 என வந்தாலும், மொத்தமான 595-ஐ இயல்பான தமிழ் எண்ணமைப்பில் வழங்குகிறது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் பிள்ளைகளுக்குத் தந்தையானதைக் குறிக்கும்; ‘பெற்றான்’ என்பது நவீன தமிழில் இயல்பான ஆண் பெற்றோர் பயன்பாடு.
- source_word: בָּנִים וּבָנוֹת
  choice: மகன்களையும் மகள்களையும்
  rationale: மூலத்தில் ஆண், பெண் பிள்ளைகள் தனித்தனியாகக் குறிப்பிடப்படுவதைக் காக்கிறது.
