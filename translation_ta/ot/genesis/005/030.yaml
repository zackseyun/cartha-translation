translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்கவும் பொதுவாசகர்களுக்கு எளிதாகவும் அமைக்கப்பட்டது. எபிரெய தொடர்வாக்கிய அமைப்பு தமிழில் இயல்பான தொடர்வினை வடிவில் தரப்பட்டுள்ளது; பொருள் சார்ந்த தெளிவின்மை எதுவும் தேவையின்றி தீர்க்கப்படவில்லை.
