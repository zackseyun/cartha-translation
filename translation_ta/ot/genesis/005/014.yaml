  text: So all the days of Kenan were nine hundred and ten years[b][a], and he died.
translation:
  language: ta
  text: கேனானின்[b] வாழ்நாட்களெல்லாம்[a] தொள்ளாயிரத்துப் பத்து ஆண்டுகள்; அவன் இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லாட்சிப்படி, ‘கேனானின் நாட்கள்’; திரும்பத் திரும்ப வரும் இந்த வம்சவரலாற்றுச் சொற்றொடர் அவனுடைய முழு வாழ்நாளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சில பாரம்பரிய மொழிபெயர்ப்புகளில் இந்தப் பெயர் ‘காயினான்’ என வழங்கப்படுகிறது; இங்குள்ள எபிரெய வடிவம் ‘கேனான்’.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: இவ்வாறு ... இருந்தன
  rationale: தொடர்ச்சியாக வரும் வம்சவரலாற்றுச் சுருக்கத்தை இயல்பான தமிழில் இணைக்கிறது; எபிரெய இணைப்புச்சொல்லின் தொடர்ச்சிப் பொருளையும் காக்கிறது.
- source_word: כָּל יְמֵי
  choice: வாழ்நாட்களெல்லாம்
  rationale: சொல்லாட்சிப்படி ‘நாட்களெல்லாம்’; இங்கு ஒருவரின் முழு வாழ்நாளைக் குறிக்கும் நிலையான வம்சவரலாற்றுச் சூத்திரம். ‘வாழ்நாட்கள்’ என்பது தமிழில் இயல்பாகவும் பொருள் தெளிவாகவும் உள்ளது.
- source_word: קֵינָן
  choice: கேனான்
  rationale: எபிரெயப் பெயரின் ஒலிவடிவத்தை நேரடியாகப் பிரதிபலிக்கும் நவீன தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: עֶשֶׂר שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: தொள்ளாயிரத்துப் பத்து ஆண்டுகள்
  rationale: எபிரெயில் ‘பத்து ஆண்டுகளும் ஒன்பது நூறு ஆண்டும்’ என்ற வரிசையில் உள்ள எண்ணை இயல்பான தமிழ் எண் வரிசையில் 910 ஆண்டுகள் என்று வழங்குகிறது.
- source_word: וַיָּמֹת
  choice: பின்பு அவன் இறந்தான்
  rationale: வம்சவரலாற்றின் வழக்கமான முடிவுரையைத் தெளிவான, எளிய தமிழில் தருகிறது; ‘பின்பு’ நிகழ்வுத் தொடர்ச்சியை வெளிப்படுத்துகிறது.
