translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரலாற்றுக்குரிய சுருக்கமான மற்றும் கண்ணியமான நடை. எபிரெய ‘நாட்கள்’ என்ற ஆயுள் சொல்லாட்சியை ‘வாழ்நாட்கள்’ எனத் தெளிவாகவும் இயல்பாகவும் பேணுகிறது.
