source:
  edition: WLC
  text: וַ/יְהִ֖י כָּל יְמֵ֣י חֲנ֑וֹךְ חָמֵ֤שׁ וְ/שִׁשִּׁים֙ שָׁנָ֔ה וּ/שְׁלֹ֥שׁ מֵא֖וֹת שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/023.yaml
  text: So all the days of Enoch were three hundred sixty-five years.
translation:
  language: ta
  text: ஆக, ஏனோக்கின் வாழ்நாட்கள் அனைத்தும் முந்நூற்று அறுபத்தைந்து ஆண்டுகள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ஆக, ... ஆண்டுகள்
  rationale: வம்சவரலாற்றின் சுருக்கக் கூற்றை அறிமுகப்படுத்தும் தொடர் வடிவத்தை இயல்பான தமிழில் ‘ஆக’ எடுத்துரைக்கிறது.
- source_word: כָּל יְמֵי
  choice: வாழ்நாட்கள் அனைத்தும்
  rationale: ‘நாட்கள் அனைத்தும்’ என்ற எபிரெயச் சொல்லாட்சியில் முழு ஆயுளும் குறிக்கப்படுகிறது; ‘வாழ்நாட்கள்’ என்பது அந்த உருவகத்தைப் பேணும் இயல்பான நவீனத் தமிழ்.
- source_word: חֲנוֹךְ
  choice: ஏனோக்கு
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: חָמֵשׁ וְשִׁשִּׁים ... וּשְׁלֹשׁ מֵאוֹת
  choice: முந்நூற்று அறுபத்தைந்து
  rationale: எபிரெயத்தில் கூறுகள் வேறு வரிசையில் இருந்தாலும், மொத்தமான 365-ஐ வழக்கமான தமிழ் எண் வரிசையில் வழங்குகிறது.
- source_word: שָׁנָה ... שָׁנָה
  choice: ஆண்டுகள்
  rationale: எபிரெயக் கட்டமைப்பில் ‘ஆண்டு’ இருமுறை வந்தாலும், தமிழில் மொத்த வயதை இயல்பாக ஒருமுறை பன்மையில் கூறுவது பொருத்தமானது.
