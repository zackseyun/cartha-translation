base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/004.yaml
  text: After he fathered Seth[a], Adam lived eight hundred years and fathered sons and daughters.
translation:
  language: ta
  text: சேத்துக்குத் தந்தையான பிறகு[a], ஆதாம் எண்ணூறு ஆண்டுகள் வாழ்ந்தார்; மேலும் அவர் மகன்களுக்கும் மகள்களுக்கும் தந்தையானார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: ‘அவர் சேத்தைப் பெற்ற பிறகு, ஆதாமின் நாட்கள் எண்ணூறு ஆண்டுகளாக இருந்தன.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי אָדָם
  choice: ஆதாம் ... வாழ்ந்து
  rationale: எபிரெய மொழிநடையில் சொல்லுக்குச் சொல் ‘ஆதாமின் நாட்கள் ... இருந்தன’ என்று வரும். ஒருவரின் வாழ்நாள் நீடிப்பை இயல்பான நவீனத் தமிழில் ‘ஆதாம் ... வாழ்ந்து’ என்று தெரிவிக்கிறது.
- source_word: אָדָם
  choice: ஆதாம்
  rationale: இந்த வம்சவரலாற்றுச் சூழலில் இது மனிதகுலத்தைக் குறிக்கும் பொதுப்பெயர் அல்ல; தனிநபரின் பெயர்.
- source_word: אַחֲרֵי
  choice: பிறகு
  rationale: பின்னர் நிகழும் காலத்தைத் தெளிவாகக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: הוֹלִידוֹ אֶת שֵׁת
  choice: சேத்துக்குத் தந்தையான
  rationale: הוליד என்பதன் ஆண்பால் சார்ந்த ‘தந்தையாகுதல்/பிள்ளை பெறுதல்’ என்ற பொருளைப் பாதுகாத்து, ஆண் ஒருவர் குழந்தையைப் ‘பெற்றெடுத்தார்’ எனத் தவறாக உணர்த்தாமல் இயல்பான தமிழில் தருகிறது.
- source_word: שְׁמֹנֶה מֵאֹת שָׁנָה
  choice: எண்ணூறு ஆண்டுகள்
  rationale: ஆண்டுகளின் காலஅளவை நேரடியாகவும் தெளிவாகவும் தருகிறது.
- source_word: וַיּוֹלֶד
  choice: பெற்றார்
  rationale: வம்சவரலாற்றுச் சூழலில் ஒருவருக்குப் பிள்ளைகள் உண்டானார்கள் என்ற செயற்பொருளை இயல்பான தமிழில் தருகிறது; ‘பெற்றெடுத்தார்’ என்ற பிரசவப் பொருளைத் தவிர்க்கிறது.
- source_word: בָּנִים וּבָנוֹת
  choice: மகன்களையும் மகள்களையும்
  rationale: எபிரெயம் ஆண், பெண் பிள்ளைகள் எனத் தனித்தனியாகக் குறிப்பிடுவதைப் பொதுவான ‘பிள்ளைகள்’ என்று சுருக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: אָדָם என்பதன் பொருள்
  choice: தனிப்பெயரான ‘ஆதாம்’
  alternative: ‘மனிதன்’
  rationale: இது பெயரிடப்பட்ட தனிநபரைத் தொடரும் வம்சவரலாற்றுப் பகுதி; ஆகவே இங்கு மனிதகுலத்தைப் பொதுவாகக் குறிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘சேத்துக்குத் தந்தையான’ என்பது மூலத்தின் ஆண்-சார்ந்த causative கருத்தைப் பாதுகாக்கிறது; ‘மகன்களையும் மகள்களையும்’ என்பது மூலத்தின் பாலினத் தனித்தன்மையைத் தக்கவைக்கிறது.
