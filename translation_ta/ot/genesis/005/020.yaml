lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: வாழ்நாட்கள் அனைத்தும்
  rationale: வம்சவரலாற்றில் ஒருவருடைய மொத்த வாழ்நாளைக் குறிக்கும் எபிரெய மரபுத்தொடரை, அதன் வடிவத்தையும் இயல்பான நவீனத் தமிழையும் சமநிலைப்படுத்தி வழங்குகிறது.
- source_word: יֶרֶד
  choice: யெரேது
  rationale: எபிரெயப் பெயரின் ஒலிவடிவத்தை நேரடியாகப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு; வேற்றுமை உருபுடன் உரையில் ‘யெரேதின்’ என வருகிறது.
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: தொள்ளாயிரத்து அறுபத்திரண்டு ஆண்டுகள்
  rationale: எபிரெய எண்ணமைப்பை நவீனத் தமிழின் இயல்பான வரிசையில் ஒருங்கிணைத்து, மொத்த வயதான 962 ஆண்டுகளைத் தெளிவாகக் கூறுகிறது.
- source_word: וַיָּמֹת
  choice: பின்பு அவன் இறந்தான்
  rationale: வம்சவரலாற்றின் வழக்கமான நிறைவு வாய்பாட்டைத் தெளிவாகக் காக்கிறது; ‘பின்பு’ என்பது தொடர்ச்சியைக் காட்டும் வாவ் அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
