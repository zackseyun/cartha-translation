source:
  edition: WLC
  text: וַ/יִּתְהַלֵּ֨ךְ חֲנ֜וֹךְ אֶת הָֽ/אֱלֹהִ֗ים אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת מְתוּשֶׁ֔לַח שְׁלֹ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/022.yaml
  text: Enoch walked with God three hundred years after he fathered Methuselah[b][a], and he fathered sons and daughters.
translation:
  language: ta
  text: ஏனோக்கு மெத்தூசலாவுக்குத் தந்தையான பிறகு முந்நூறு ஆண்டுகள் கடவுளோடு நடந்தார்[a]; அவர் மகன்களையும் மகள்களையும் பெற்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளுடன் உறவில் வாழ்ந்தார்.’ எபிரேயச் சொல்லாடலின் நேரடிப் பொருள் ‘கடவுளோடு நடந்தார்’ என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: நடந்தார்
  rationale: הלך என்பதன் ஹித்பயேல் வடிவம் இங்கு ஒருவரின் வாழ்க்கை நடத்தையைச் சுட்டும் உருவகச் சொல்லாடல். அதன் உருவக வலிமையை விளக்கவுரையாகக் குறுக்காமல், தமிழிலும் ‘நடந்தார்’ என்று தக்கவைக்கிறது.
- source_word: אֶת הָאֱלֹהִים
  choice: கடவுளோடு
  rationale: இந்தச் சொல்லாடலில் אֶת உறவுநிலையைக் குறிக்கும் ‘உடன்/ஓடு’ என்ற பொருளில் வருகிறது. இயல்பான நவீனத் தமிழுக்காக ‘கடவுளோடு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אַֽחֲרֵי הוֹלִידוֹ אֶת מְתוּשֶׁלַח
  choice: மெத்தூசலாவைப் பெற்ற பிறகு
  rationale: காலத் தொடர்பைத் தெளிவாகக் காட்டுகிறது. ילד என்பதன் காரணவினை ஆண் பெற்றோரைக் குறித்தாலும், தமிழில் ‘பெற்ற பிறகு’ என்பது தந்தையானதை இயல்பாகச் சொல்கிறது.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: முந்நூறு ஆண்டுகள்
  rationale: எண்ணிக்கையையும் கால அளவையும் நேரடியாகவும் இயல்பாகவும் தருகிறது; இது ஏனோக்கு கடவுளோடு நடந்த கால அளவு என்பதைத் தமிழ் வாக்கிய அமைப்பு தெளிவாக்குகிறது.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: அவர் மகன்களையும் மகள்களையும் பெற்றார்
  rationale: எபிரேய உரை ஆண், பெண் பிள்ளைகளைத் தனித்தனியாகக் குறிப்பிடுவதால் பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக இரண்டையும் வெளிப்படையாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: ஏனோக்கு ‘கடவுளோடு நடந்தார்’ என்பதன் இயல்பு
  choice: ‘கடவுளோடு நடந்தார்’ என்ற உறவுசார் உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘கடவுளுடன் நெருங்கிய உறவில் வாழ்ந்தார்’
  rationale: மாற்று வாசகம் கருத்தை விளக்கினாலும், மூலத்தின் திறந்த உருவகத்தையும் அதன் இறையியல் ஆழத்தையும் ஒரு குறிப்பிட்ட விளக்கத்துக்குள் அடக்கிவிடும். ஆகவே மூல உருவகம் தக்கவைக்கப்பட்டு, விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: இயல்பான நவீனத் தமிழில், மரியாதையும் எளிமையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. காலச் சொற்றொடர் வாக்கியத்தின் தொடக்கத்தில் வைக்கப்பட்டதால், ‘முந்நூறு ஆண்டுகள்’ என்பது ஏனோக்கின் கடவுளோடான நடைக்கு உரிய கால அளவு என்பது குழப்பமின்றித் தெரிகிறது. இறைபெயராக பொதுவாகப் புரியும் ‘கடவுள்’ பயன்படுத்தப்பட்டுள்ளது.
