revisions:
- from: மெத்தூசலாவைப் பெற்ற பிறகு, ஏனோக்கு முந்நூறு ஆண்டுகள் கடவுளோடு நடந்தார்[a]; அவர் மகன்களையும் மகள்களையும் பெற்றார்.
  to: ஏனோக்கு மெத்தூசலாவுக்குத் தந்தையான பிறகு முந்நூறு ஆண்டுகள் கடவுளோடு நடந்தார்[a]; அவர் மகன்களையும் மகள்களையும் பெற்றார்.
  rationale: «பெற்ற பிறகு» என்பதற்குப் பதிலாக «தந்தையான பிறகு» என மாற்றப்பட்டுள்ளது. இதனால் ஆண் பெற்றோரைக் குறிக்கும் எபிரேய வினைச்சொல்லின் பொருள் தெளிவாகத் தக்கவைக்கப்படுகிறது; காலத் தொடர்பும் முந்நூறு ஆண்டுகள் என்பது ஏனோக்கு கடவுளோடு நடந்த கால அளவு என்பதும் மாற்றமின்றி உள்ளது. ஆங்கில audit trail-இல் உள்ள previous-rendering குறிப்பு இலக்குமொழியில் தனி சொல்-வரிசை மாற்றாகப் பொருந்தாததால் சேர்க்கப்படவில்லை; தமிழ்ப் பிரதியில் உள்ள [a] குறிப்பு சரியாக இணைக்கப்பட்டுள்ளது.
