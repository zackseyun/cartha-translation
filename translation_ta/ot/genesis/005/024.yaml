base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/024.yaml
  text: Enoch walked with God[a], and he was no more, because God took him.
translation:
  language: ta
  text: ஏனோக்கு கடவுளோடு நடந்தார்; பின்பு அவர் இல்லாமற்போனார்[a], ஏனெனில் கடவுள் அவரை எடுத்துக்கொண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “அவர் இல்லை.” ஏனோக்கு இனி இல்லை என்பதை இந்த எபிரேயச் சொற்றொடர் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: நடந்துவந்தார்
  rationale: הלך என்பதன் ஹித்பயேல் வடிவம் இங்கு வெறும் உடல் இயக்கத்தை அல்ல, தொடர்ந்த வாழ்க்கை முறையையும் உறவுசார் நடத்தையையும் குறிக்கிறது. ‘நடந்துவந்தார்’ என்பது அந்த நீடித்த தன்மையையும் எபிரேய உருவகத்தையும் காக்கிறது.
- source_word: אֶת הָאֱלֹהִים
  choice: கடவுளோடு
  rationale: הלך உடன் வரும் אֶת இங்கு உடனிருத்தலையும் துணைநடப்பையும் குறிக்கிறது. ‘கடவுளோடு’ என்பது எளிய பொருளையும் உறவின் நெருக்கத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: וְאֵינֶנּוּ
  choice: பின்பு அவர் இல்லாமற்போனார்
  rationale: எபிரேயச் சொற்றொடரின் நேரடிப் பொருள் ‘அவர் இல்லை’ என்பதாகும். தமிழில் ‘இல்லாமற்போனார்’ என்பது அவர் இனி அங்கு இல்லை என்ற கருத்தைத் தெரிவிக்கிறது; அது எப்படி நிகழ்ந்தது என்பதை விளக்கிச் சேர்ப்பதில்லை.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: ஏனோக்கு இல்லாமற்போனதற்கான காரணத்தை இங்கு כִּי அறிமுகப்படுத்துகிறது. ‘ஏனெனில்’ அந்தக் காரண உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: לָקַח אֹתוֹ
  choice: அவரை எடுத்துக்கொண்டார்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’. ‘எடுத்துக்கொண்டார்’ என்பது தெய்வீகச் செயலைக் காக்கிறது; ஆனால் எங்கு எடுத்துச் சென்றார் அல்லது எந்த முறையில் எடுத்தார் என்று மூலத்தில் இல்லாத தகவலைச் சேர்ப்பதில்லை.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இந்தக் கதைச் சூழலில் אֱלֹהִים ஒரே கடவுளைக் குறிக்கிறது. ‘கடவுள்’ என்பது நவீன பொதுத்தமிழில் இயல்பானதும் தெளிவானதும் ஆகும்.
theological_decisions:
- issue: ஏனோக்கு இறக்கவில்லை அல்லது பரலோகத்திற்கு எடுத்துக்கொள்ளப்பட்டார் என்று வெளிப்படையாகக் கூறுவதா
  choice: ‘அவர் இல்லாமற்போனார்; ஏனெனில் கடவுள் அவரை எடுத்துக்கொண்டார்’ என்ற மூலத்தின் கட்டுப்பாடான சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: ‘அவர் இறக்கவில்லை’, ‘கடவுள் அவரைப் பரலோகத்திற்கு எடுத்துக்கொண்டார்’, அல்லது ‘அவர் மறுரூபமாக எடுத்துக்கொள்ளப்பட்டார்’ என்று விளக்குதல்
  rationale: இந்த வசனம் அசாதாரணமான தெய்வீக எடுத்துக்கொள்ளுதலை வலுவாக உணர்த்தினாலும், எபிரேய உரை ‘பரலோகத்திற்கு’ என்று சொல்லவோ, இந்த வசனத்திலேயே மரணத்தை நேரடியாக மறுக்கவோ இல்லை. ஆகவே பிற்கால வேதாகம விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல், மூலத்தின் இறையியல் நெருக்கடியும் சுருக்கமும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கடவுளோடு நடந்துவந்தார்’ என்ற எபிரேய உருவகம் பாதுகாக்கப்பட்டுள்ளது. ‘இல்லாமற்போனார்’ என்பது மரணம், பரலோக ஏற்றுக்கொள்ளுதல், அல்லது வேறு முறை எனத் தீர்மானிக்காமல் உரையின் கட்டுப்பாட்டைத் தக்கவைக்கிறது. அடிக்குறிப்பு குறியீடு அது விளக்கும் சொற்றொடருக்குப் பிறகே வைக்கப்பட்டுள்ளது.
