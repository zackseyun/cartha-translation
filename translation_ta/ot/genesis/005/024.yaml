revisions:
- from: ஏனோக்கு கடவுளோடு நடந்துவந்தார். பின்பு அவர் இல்லாமற்போனார்[a]; ஏனெனில் கடவுள் அவரை எடுத்துக்கொண்டார்.
  to: ஏனோக்கு கடவுளோடு நடந்தார்; பின்பு அவர் இல்லாமற்போனார்[a], ஏனெனில் கடவுள் அவரை எடுத்துக்கொண்டார்.
  rationale: The revision changes only ‘நடந்துவந்தார்’ to ‘நடந்தார்’ in order to avoid a destination-oriented implication absent from the Hebrew. The main text continues to avoid stating that Enoch died, was taken to heaven, or was translated. The footnote retains the literal alternative while removing the unnecessary locative implication ‘அங்கு.’
