translation:
  language: ta
  text: ஏனோசின் வாழ்நாட்கள் அனைத்தும் தொள்ளாயிரத்து ஐந்து ஆண்டுகள். அவன் இறந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: வாழ்நாட்கள் அனைத்தும்
  rationale: வம்சவரலாற்றுச் சுருக்கத்தில் இந்த எபிரெயச் சொற்றொடர் ஒருவரின் மொத்த வாழ்நாளைக் குறிக்கிறது. ‘வாழ்நாட்கள் அனைத்தும்’ என்பது மூலத்தின் வடிவத்தையும் இயல்பான தமிழையும் சமநிலைப்படுத்துகிறது.
- source_word: אֱנוֹשׁ
  choice: ஏனோசு
  rationale: எபிரெயப் பெயரின் ஒலிவடிவத்தை நெருக்கமாகக் காட்டும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: חָמֵשׁ שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: தொள்ளாயிரத்து ஐந்து ஆண்டுகள்
  rationale: எபிரெயில் ‘ஐந்து ஆண்டுகளும் ஒன்பது நூறு ஆண்டுகளும்’ என்ற வரிசையில் உள்ள எண்ணை, பொருள் தெளிவாக இருக்க இயல்பான தமிழ் எண் அமைப்பில் 905 ஆண்டுகள் என வழங்குகிறது.
- source_word: וַיָּמֹת
  choice: பின்பு அவன் இறந்தான்
  rationale: வம்சவரலாற்றின் வழக்கமான நிறைவு வாய்ப்பாட்டைத் தெளிவான தமிழில் தருகிறது; தொடர்ச்சியைக் காட்டும் וַ־ இங்கு ‘பின்பு’ என வெளிப்படுத்தப்பட்டுள்ளது.
