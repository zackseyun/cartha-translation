translation_notes:
  register: நவீன பொதுத்தமிழில், எளிமையும் கண்ணியமும் கொண்ட வம்சவரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. ‘எனவே’ முந்தைய விவரங்களின் மொத்தத் தொகையை அறிமுகப்படுத்துகிறது; அரைப்புள்ளி மொத்த வாழ்நாளையும் மரண அறிவிப்பையும் தெளிவாக இணைக்கிறது.
