id: GEN.5.13
reference: Genesis 5:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְחִ֣י קֵינָ֗ן אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת מַֽהֲלַלְאֵ֔ל אַרְבָּעִ֣ים שָׁנָ֔ה וּ/שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/013.yaml
  text: And Kenan lived eight hundred and forty years after he fathered Mahalalel[b][a], and he fathered sons and daughters.
translation:
  language: ta
  text: கேனான் மகலாலெயேலுக்குத் தந்தையான பிறகு[a] எண்ணூற்று நாற்பது ஆண்டுகள் வாழ்ந்தான்; அவன் மகன்களையும் மகள்களையும் பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரு இடங்களிலும் உள்ள வினைச்சொல்லை, இன்னும் வெளிப்படையாக, ‘தந்தையானான்’ என்று மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்து
  rationale: வம்சவரலாற்றின் ஆயுட்காலக் கூற்றில் חיה என்பது ‘வாழ்தல்’ என இயல்பாகப் பொருள்படுகிறது; தொடர்வாக்கியத்தின் தமிழ் ஓட்டத்திற்காக வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: קֵינָן
  choice: கேனான்
  rationale: எபிரெயப் பெயரின் ஒலியை நவீனத் தமிழில் தெளிவாகக் குறிக்கும் வடிவம்.
- source_word: אַחֲרֵי
  choice: பிறகு
  rationale: மகலாலெயேல் பிறந்ததைத் தொடர்ந்து வந்த காலப்பகுதியைச் சுட்டும் இயல்பான தமிழ்ச் சொல்.
- source_word: הוֹלִידוֹ / וַיּוֹלֶד
  choice: பெற்ற / பெற்றான்
  rationale: ஆண் எழுவாயுடன் வரும் ילד என்பதன் Hiphil வடிவம் குழந்தைக்குத் தந்தையானதைக் குறிக்கிறது. ‘பெற்றான்’ என்பது தமிழில் மரபாகவும் சுருக்கமாகவும் இதைத் தெரிவிக்கிறது; இரு இடங்களிலும் சொல் தொடர்பு பேணப்பட்டுள்ளது.
- source_word: מַהֲלַלְאֵל
  choice: மகலாலெயேல்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியமைப்பைத் தமிழ் வாசிப்புக்கு ஏற்றவாறு வழங்குகிறது.
- source_word: אַרְבָּעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: எண்ணூற்று நாற்பது ஆண்டுகள்
  rationale: எபிரெயில் ‘நாற்பது ஆண்டுகளும் எண்ணூறு ஆண்டுகளும்’ என வரும் மொத்தத்தைத் தமிழின் இயல்பான எண் வரிசையில் 840 ஆண்டுகள் என வழங்குகிறது.
- source_word: בָּנִים וּבָנוֹת
  choice: மகன்களையும் மகள்களையும்
  rationale: மூலத்தில் ஆண், பெண் பிள்ளைகள் தனித்தனியாகக் குறிப்பிடப்படுவதைக் காக்கிறது.
