  yaml_path: translation/ot/genesis/005/006.yaml
  text: Seth lived 105 years and fathered Enosh[a].
translation:
  language: ta
  text: சேத் 105 ஆண்டுகள் வாழ்ந்து, ஏனோஷைப் பெற்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, ‘ஏனோஷுக்குத் தந்தையானான்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்தபோது
  rationale: வம்சவரலாற்று வயதுக் குறிப்பில், அடுத்த நிகழ்வு நடந்த சமயத்தில் சேத் எத்தனை ஆண்டுகள் வாழ்ந்திருந்தான் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שֵׁת
  choice: சேத்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியை நவீனத் தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: חָמֵשׁ שָׁנִים וּמְאַת שָׁנָה
  choice: 105 ஆண்டுகள்
  rationale: சொல்லுக்குச் சொல் ‘ஐந்து ஆண்டுகளும் நூறு ஆண்டும்’ என அமைந்த எபிரெய எண் தொடர் 105 ஆண்டுகளைக் குறிக்கிறது; எண்களால் எழுதுவது தெளிவான நவீன நடை.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் ஆண் எழுவாயுடன் வரும் ילד, பிள்ளைக்குத் தந்தையானதைக் குறிக்கிறது. தமிழில் ‘பெற்றான்’ இயல்பாகவும் சுருக்கமாகவும் உள்ளது; இதன் தந்தைமைக் கருத்தை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: אֶת אֱנוֹשׁ
  choice: ஏனோசை
  rationale: אֶת என்பது நேர்ச்செயப்படுபொருள் குறியீடு; தமிழில் வேற்றுமை உருபால் வெளிப்படுகிறது. אֱנוֹשׁ என்ற பெயர் எபிரெய உச்சரிப்பை நெருக்கமாகப் பின்பற்றி ‘ஏனோசு’ என எழுத்துப்பெயர்க்கப்பட்டு, இங்கு இரண்டாம் வேற்றுமையில் ‘ஏனோசை’ ஆகிறது.
theological_decisions: []
