  register: நவீன நிலையான தமிழில், வம்சவரலாற்றின் சுருக்கமான நடையைப் பேணும் கண்ணியமான மொழிநடை. எபிரெய வசனத்தின் தொடர்ச்சியான இரண்டு வினைகளைத் தமிழில் இயல்பாக இணைக்க ‘வாழ்ந்தபோது’ பயன்படுத்தப்பட்டுள்ளது.
