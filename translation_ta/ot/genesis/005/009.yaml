  text: וַֽ/יְחִ֥י אֱנ֖וֹשׁ תִּשְׁעִ֣ים שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת קֵינָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/009.yaml
  text: Enosh lived ninety years and fathered Kenan[a][b].
translation:
  language: ta
  text: ஏனோஷ் தொண்ணூறு ஆண்டுகள் வாழ்ந்து, கேனானுக்குத் தந்தையானார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வயதானபோது
  rationale: வம்சவரலாற்றின் வயதுக் கூற்றில் חיה என்பது வாழ்ந்த ஆண்டுகளைக் குறிக்கிறது. அடுத்த நிகழ்வுடன் இயல்பாக இணைக்க தமிழில் ‘தொண்ணூறு வயதானபோது’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: אֱנוֹשׁ
  choice: ஏனோசு
  rationale: எபிரேயப் பெயரான אֱנוֹשׁ என்பதன் ஒலியமைப்பைத் தமிழில் நெருக்கமாகக் காட்டும் பெயர்ப்பு.
- source_word: תִּשְׁעִים שָׁנָה
  choice: தொண்ணூறு வயது
  rationale: வயதைக் குறிக்கும் எபிரேயத் தொடருக்கு இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: וַיּוֹלֶד
  choice: பெற்றார்
  rationale: ஆண் எழுவாயுடன் வரும் ילד என்பதன் ஹிஃபில் வடிவம் வம்சவரலாற்றில் ஒருவருக்குப் பிள்ளை பிறந்ததைக் குறிக்கிறது. ‘பெற்றார்’ என்பது தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது; இது தந்தையானார் என்ற பொருளில் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண உருபு; தமிழில் தனிச் சொல்லாகத் தேவையில்லை.
- source_word: קֵינָן
  choice: கேனான்
  rationale: மசோரா எபிரேய உரையின் קֵינָן என்ற பெயரை நேரடியாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரலாற்றுக்குரிய சுருக்கத்தையும் கண்ணியமான நடையையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டது. எபிரேய வாக்கிய அமைப்பை அப்படியே பின்பற்றாமல், தமிழில் இயல்பான காலத் துணைவாக்கிய வடிவம் பயன்படுத்தப்பட்டது.
