- from: ஏனோசைப் பெற்ற பிறகு, சேத் எண்ணூற்று ஏழு ஆண்டுகள் வாழ்ந்து, மகன்களையும் மகள்களையும் பெற்றான்.
  to: ஏனோசுக்குத் தந்தையான பிறகு, சேத் எண்ணூற்று ஏழு ஆண்டுகள் வாழ்ந்தான்; மகன்களுக்கும் மகள்களுக்கும் தந்தையானான்.
