  text: וַֽ/יְחִי שֵׁ֗ת אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת אֱנ֔וֹשׁ שֶׁ֣בַע שָׁנִ֔ים וּ/שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/007.yaml
  text: After he fathered Enosh, Seth lived eight hundred and seven years and fathered sons and daughters.
translation:
  language: ta
  text: ஏனோசுக்குத் தந்தையான பிறகு, சேத் எண்ணூற்று ஏழு ஆண்டுகள் வாழ்ந்தான்; மகன்களுக்கும் மகள்களுக்கும் தந்தையானான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்து
  rationale: இந்த வம்சவரலாற்றுச் சூத்திரத்தில், குறிப்பிட்ட நிகழ்வுக்குப் பிந்தைய சேத்தின் வாழ்நாளைக் குறிக்கிறது; இயல்பான தமிழில் தொடர்வினையாக வழங்கப்பட்டுள்ளது.
- source_word: אֲחֲרֵי
  choice: பிறகு
  rationale: ஏனோசின் பிறப்புக்குப் பிந்தைய காலத்தை அறிமுகப்படுத்தும் காலக் குறிப்பு.
- source_word: הוֹלִידוֹ אֶת־אֱנוֹשׁ
  choice: ஏனோசைப் பெற்ற
  rationale: ஹிபில் வடிவம் தந்தையாகப் பிள்ளையைப் பெறுதலைக் குறிக்கிறது. தமிழில் ‘பெற்ற’ என்பது ஆண் எழுவாயுடனும் இயல்பாகப் பயன்பட்டு, வம்சவரலாற்றுப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: שֶׁבַע שָׁנִים וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: எண்ணூற்று ஏழு ஆண்டுகள்
  rationale: எபிரெயத்தில் சிறிய எண் முதலில் வந்தாலும், மொத்தமான 807 ஆண்டுகளை இயல்பான தமிழ் எண் வரிசையில் வழங்குகிறது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றில் பிள்ளைகளைப் பெற்ற தந்தை என்ற பொருளை நவீன, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בָּנִים וּבָנוֹת
  choice: மகன்களையும் மகள்களையும்
  rationale: மூலம் ஆண் மற்றும் பெண் பிள்ளைகளைத் தனித்தனியாகக் குறிப்பிடுவதால், பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக அந்த வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன தரநிலைத் தமிழில், வம்சவரலாற்றுக்கேற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை. ‘ஏனோசு’ என்பதற்குப் பதிலாக நவீன உச்சரிப்புக்கு இயல்பான ‘ஏனோஸ்’ பயன்படுத்தப்பட்டுள்ளது; ‘சேத்’ என்ற பெயர் பரவலான தமிழ் வடிவில் தரப்பட்டுள்ளது.
