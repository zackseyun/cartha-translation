id: GEN.5.21
reference: Genesis 5:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַֽ/יְחִ֣י חֲנ֔וֹךְ חָמֵ֥שׁ וְ/שִׁשִּׁ֖ים שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת מְתוּשָֽׁלַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/021.yaml
  text: Enoch lived sixty-five years and fathered Methuselah.
translation:
  language: ta
  text: ஏனோக்கு அறுபத்தைந்து வயதானபோது மெத்தூசலாவைப் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வயதானபோது
  rationale: இந்த வம்சவரலாற்றுச் சூத்திரத்தில் חיה என்பது குழந்தை பிறக்கும் நிகழ்வு வரையிலான வயதைக் குறிக்கிறது. தமிழில் ‘அறுபத்தைந்து வயதானபோது’ என்பது அந்தப் பொருளை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது; ‘அறுபத்தைந்து ஆண்டுகள் வாழ்ந்து’ என்பதில் அந்த வயதிலேயே வாழ்க்கை முடிந்தது போன்ற தவறான எண்ணம் ஏற்படக்கூடும்.
- source_word: חֲנוֹךְ
  choice: ஏனோக்கு
  rationale: எபிரேயப் பெயரின் ஒலியைப் பின்பற்றி, தமிழில் வழக்கிலுள்ள மரியாதையான பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: חָמֵשׁ וְשִׁשִּׁים שָׁנָה
  choice: அறுபத்தைந்து
  rationale: எபிரேயத்தில் ‘ஐந்தும் அறுபதும்’ என்ற வரிசையில் உள்ள எண்ணிக்கை, இயல்பான நவீன தமிழில் ‘அறுபத்தைந்து’ என்று வழங்கப்பட்டுள்ளது; ‘வயது’ என்பதால் ஆண்டு என்ற அலகு உள்ளடக்கமாகத் தெளிவாகிறது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: ஆண் எழுவாயுடன் வரும் ילד என்ற வினை வம்சவரலாற்றுச் சூழலில் ‘தந்தையானான்/பெற்றான்’ என்று பொருள்படும். ‘பெற்றான்’ என்பது நவீன தமிழில் சுருக்கமானதும் இயல்பானதும் ஆகும்; இங்கு அது தந்தையாகப் பெற்றதையே சூழல் தெளிவாக்குகிறது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது எபிரேய நேரடிச் செயப்படுபொருள் குறியீடு. தமிழில் ‘மெத்தூசலாவைப்’ என்பதிலுள்ள ‘ஐ’ வேற்றுமை உருபால் அதன் இலக்கணப் பணி வெளிப்படுகிறது.
- source_word: מְתוּשָׁלַח
  choice: மெத்தூசலா
  rationale: எபிரேயத் தனிப்பெயரின் ஒலியைப் பின்பற்றும், தமிழில் அடையாளம் காணத்தக்க பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
