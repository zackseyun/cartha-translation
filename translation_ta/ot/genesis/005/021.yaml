  register: நவீன பொதுத்தமிழில், வம்சவரலாற்றுக்கேற்ற சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. மூலத்தின் நிகழ்வுவரையிலான வாழ்நாள் குறிப்பை இயல்பான தமிழ் வயது அமைப்பால் வெளிப்படுத்துகிறது.
