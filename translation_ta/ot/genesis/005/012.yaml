lexical_decisions:
- source_word: וַיְחִי
  choice: வயதானபோது
  rationale: חיה என்பதன் ‘வாழ்ந்தான்’ என்ற அடிப்படைப் பொருளும், வம்சவரலாற்றுச் சூத்திரத்தில் அது ஒருவரின் வயதைக் குறிப்பதும் தமிழில் இயல்பாக வெளிப்படுமாறு அடுத்துள்ள கால அளவுடன் சேர்த்து மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: קֵינָן
  choice: கேனான்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பைத் தமிழில் தெளிவாகக் காட்டும் பெயர்ப்பு.
- source_word: שִׁבְעִים שָׁנָה
  choice: எழுபது வயது
  rationale: இது மகலாலெயேலைப் பெற்றபோது கேனானுக்கு இருந்த வயதைக் குறிக்கிறது; நவீனத் தமிழில் ‘எழுபது வயதானபோது’ என்பது இயல்பான வடிவம்.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் ילד ஆண் வழிப் பிள்ளைப்பேற்றைக் குறிக்கிறது. ‘பெற்றான்’ என்பது தமிழில் சுருக்கமாகவும் இயல்பாகவும் இதைத் தெரிவிக்கிறது; அதன் குறிப்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶת
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது எபிரெய மொழியின் நேரடிச் செயப்படுபொருள் குறியீடு; தமிழில் அதன் பணி வேற்றுமை உருபால் இயல்பாக வெளிப்படுகிறது.
- source_word: מַהֲלַלְאֵל
  choice: மகலாலெயேல்
  rationale: எபிரெயப் பெயரின் கூறுகளையும் ஒலியமைப்பையும் தமிழில் வாசிக்கத்தக்க வகையில் பிரதிபலிக்கும் பெயர்ப்பு.
