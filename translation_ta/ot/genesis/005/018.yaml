  text: Jered lived one hundred sixty-two years and fathered Enoch.
translation:
  language: ta
  text: யாரேது நூற்று அறுபத்திரண்டு ஆண்டுகள் வாழ்ந்து, ஏனோக்கைப் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்து
  rationale: வம்சவரலாற்றுச் சூத்திரத்தில் חיה என்பது ஒருவரின் வயதை அறிமுகப்படுத்தும் வகையில் ‘வாழ்ந்தான்’ என்று பொருள்படும்; அடுத்த வினையுடன் இயல்பாக இணைக்க ‘வாழ்ந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יֶרֶד
  choice: யாரேது
  rationale: தமிழ் வேதாகமப் பெயர்மரபில் பரவலாக அறியப்படும் வடிவம் பயன்படுத்தப்பட்டது; இது எபிரெயப் பெயரின் தமிழ் ஒலிபெயர்ப்பாகும்.
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּמְאַת שָׁנָה
  choice: நூற்று அறுபத்திரண்டு ஆண்டுகள்
  rationale: எபிரெய எண்ணமைப்பு சொற்படியாக ‘இரண்டும் அறுபதும் ... நூறும்’ என அமைந்தாலும், அதன் மதிப்பை நவீன தமிழின் இயல்பான எண்ணமைப்பில் தெளிவாகக் கொடுக்கிறது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் ילד என்பதன் ஆண்பால் causative வடிவம் ‘ஒரு மகனுக்குத் தந்தையானான்/பெற்றான்’ என்ற பொருளைத் தருகிறது. ‘பெற்றான்’ என்பது தமிழில் தந்தையைப் பற்றியும் இயல்பாகப் பயன்படுத்தப்படும் சுருக்கமான வம்சவரலாற்றுச் சொல்.
- source_word: אֶת חֲנוֹךְ
  choice: ஏனோக்கை
  rationale: אֶת என்பது நேரடிச் செயப்படுபொருள் குறியீடு; தமிழில் பெயருடன் ‘ஐ’ உருபாக வெளிப்படுகிறது. חֲנוֹךְ என்பதற்கு தமிழ் வேதாகம மரபிலுள்ள ‘ஏனோக்கு’ பயன்படுத்தப்பட்டது.
