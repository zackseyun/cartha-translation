translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வம்சவரலாற்று நடையைப் பயன்படுத்துகிறது. எபிரெய வாக்கியத்தின் பொருளைப் பாதுகாத்தபடி, தமிழ் வாசிப்புக்கு இயல்பாக கால அளவு வினையுடன் இணைக்கப்பட்டுள்ளது.
