revisions:
- from: ஏனோசு கேனானைப் பெற்ற பிறகு எண்ணூற்றுப் பதினைந்து ஆண்டுகள் வாழ்ந்து, மகன்களையும் மகள்களையும் பெற்றான்.
  to: ஏனோஷ் கேனானுக்குத் தந்தையான பிறகு எண்ணூற்றுப் பதினைந்து ஆண்டுகள் வாழ்ந்தான்; அவன் மகன்களையும் மகள்களையும் பெற்றான்.
  rationale: The revision clarifies that Enosh fathered Kenan, adopts a closer transliteration of the Hebrew name, and uses two clear finite clauses while preserving every element of the Hebrew verse. No footnote is necessary because no material ambiguity is introduced or suppressed.
