  text: וַֽ/יְחִ֣י אֱנ֗וֹשׁ אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת קֵינָ֔ן חֲמֵ֤שׁ עֶשְׂרֵה֙ שָׁנָ֔ה וּ/שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/010.yaml
  text: And Enosh lived eight hundred and fifteen years after he fathered Kenan[c][b][a], and he fathered sons and daughters.
translation:
  language: ta
  text: ஏனோஷ் கேனானுக்குத் தந்தையான பிறகு எண்ணூற்றுப் பதினைந்து ஆண்டுகள் வாழ்ந்தான்; அவன் மகன்களையும் மகள்களையும் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்து
  rationale: வம்சவரலாற்றுச் சூத்திரத்தில் חיה என்பதன் இயல்பான தமிழ் பொருள் ‘வாழ்’; தொடர்வாக்கிய அமைப்புக்கேற்ப ‘வாழ்ந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֱנוֹשׁ
  choice: ஏனோசு
  rationale: எபிரெயப் பெயரின் ஒலிவடிவத்தைத் தமிழில் தெளிவாகப் பிரதிபலிக்கும் வழக்கமான எழுத்துப்பெயர்ப்பு.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת קֵינָן
  choice: கேனானைப் பெற்ற பிறகு
  rationale: கால உறவையும், Hiphil ילד குறிக்கும் ஆண் வம்சவழிப் பெற்றெடுத்தல்/தந்தையானதையும் இயல்பான தமிழில் தருகிறது.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: எண்ணூற்றுப் பதினைந்து ஆண்டுகள்
  rationale: எபிரெயில் 15 + 800 என அமைந்த மொத்த காலத்தை இயல்பான தமிழ் எண் வரிசையில் அளிக்கிறது.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: மகன்களையும் மகள்களையும் பெற்றான்
  rationale: மூலத்தில் ஆண், பெண் பிள்ளைகள் தனித்தனியாகக் குறிப்பிடப்படுவதைக் காத்து, ילד என்பதையும் முன்னைய பயன்பாட்டுடன் இசைவாக மொழிபெயர்க்கிறது.
