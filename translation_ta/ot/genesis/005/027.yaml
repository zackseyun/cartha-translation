lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: வாழ்நாட்கள் மொத்தம்
  rationale: எபிரெய மரபுத்தொடரின் ‘அவருடைய நாட்கள் அனைத்தும்’ என்ற பொருளை, ஆதியாகமம் 5-ன் வம்சவரலாற்றுச் சுருக்க நடையைத் தக்கவைத்தபடி இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מְתוּשֶׁלַח
  choice: மெத்தூசலா
  rationale: எபிரெய தனிப்பெயருக்கு தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: תֵּשַׁע וְשִׁשִּׁים ... וּתְשַׁע מֵאוֹת שָׁנָה
  choice: தொள்ளாயிரத்து அறுபத்தொன்பது ஆண்டுகள்
  rationale: எபிரெயில் முதலில் 69, பின்னர் 900 என வரும் எண்ணை, அதன் சரியான மொத்த மதிப்பான 969 ஆக இயல்பான தமிழ் எண் வரிசையில் வழங்குகிறது.
- source_word: וַיָּמֹת
  choice: பின்பு அவர் இறந்தார்
  rationale: வம்சவரலாற்றின் நிறைவு நிகழ்வைத் தெரிவிக்கும் wayyiqtol வடிவை இயல்பான தொடர் உரையாகத் தருகிறது; மரியாதை ஒருமை தமிழில் மனிதரைச் சுட்டும் வழக்குக்கு ஏற்றது.
