  text: וַ/יִּֽהְי֞וּ כָּל יְמֵ֤י אָדָם֙ אֲשֶׁר חַ֔י תְּשַׁ֤ע מֵאוֹת֙ שָׁנָ֔ה וּ/שְׁלֹשִׁ֖ים שָׁנָ֑ה וַ/יָּמֹֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/005.yaml
  text: So all the days of Adam that he lived were nine hundred and thirty years[a], and he died.
translation:
  language: ta
  text: ஆதாம் வாழ்ந்த நாட்களெல்லாம் மொத்தம் தொள்ளாயிரத்து முப்பது ஆண்டுகள்[a]; அவர் இறந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘ஆதாம்’ என்ற சொல் சில சூழல்களில் ‘மனிதன்’ அல்லது ‘மனிதகுலம்’ என்றும் பொருள்படும்; ஆனால் இங்கே வம்சவரலாற்றில் வரும் ஆதாம் என்னும் தனிநபரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: வாழ்ந்த நாட்களெல்லாம் மொத்தம்
  rationale: வம்சவரலாற்றில் திரும்ப வரும் எபிரெயச் சுருக்கக் கூறின் ‘அவர் வாழ்ந்த எல்லா நாட்களும்’ என்ற உருவகத்தைத் தக்கவைத்தபடி, மொத்த ஆயுளைக் குறிப்பிடுவதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָדָם
  choice: ஆதாம்
  rationale: இச்சூழல் வம்சவரலாறு என்பதால், இது மனிதகுலத்தைப் பொதுவாகக் குறிக்காமல் ஆதாம் என்னும் தனிநபரின் பெயராக வருகிறது.
- source_word: אֲשֶׁר חַי
  choice: வாழ்ந்த
  rationale: ‘அவர் வாழ்ந்த’ என்ற தொடர்புச் சொல்லைத் தமிழில் பெயரெச்சமாக இயல்பாகவும் சுருக்கமாகவும் வழங்குகிறது.
- source_word: תְּשַׁע מֵאוֹת ... וּשְׁלֹשִׁים שָׁנָה
  choice: தொள்ளாயிரத்து முப்பது ஆண்டுகள்
  rationale: எபிரெய மூலத்தின் முழு எண்ணையும் வம்சவரலாற்றின் இலக்கிய நடைக்கு ஏற்றவாறு சொற்களால் தருகிறது.
- source_word: וַיָּמֹת
  choice: பின்பு அவர் இறந்தார்
  rationale: வாழ்நாள் மொத்தத்தைத் தொடர்ந்து மரணம் நிகழ்ந்ததை இயல்பான தமிழில் கூறுகிறது; ஆதியாகமம் 5-இல் மீண்டும் மீண்டும் வரும் மரணச் சுருக்கத்தின் நேரடியான தாக்கத்தையும் தக்கவைக்கிறது.
theological_decisions:
- issue: אָדָם என்பதன் பொருள்
  choice: தனிப்பெயராக ‘ஆதாம்’
  alternative: மனிதன் / மனிதகுலம்
  rationale: ஆதியாகமம் 5-இன் வம்சவரலாற்றுச் சூழலில் இச்சொல் பெயரிடப்பட்ட தனிநபரையே குறிக்கிறது; பொதுப்பெயராக மொழிபெயர்த்தால் வம்சத் தொடர்பு மறைந்துவிடும்.
- issue: மரணத்தை முடிவுக் கூற்றாகத் தக்கவைத்தல்
  choice: பின்பு அவர் இறந்தார்
  alternative: அவர் மரணமடைந்தார்
  rationale: மூலத்தில் உள்ள சுருக்கமான, திரும்பத் திரும்ப வரும் மரணக் கூற்றை மென்மைப்படுத்தாமல் தெளிவாகத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. எபிரெய வம்சவரலாற்றுக் கூறின் ‘வாழ்ந்த நாட்கள்’ என்ற வடிவம் முடிந்தவரை தக்கவைக்கப்பட்டுள்ளது.
