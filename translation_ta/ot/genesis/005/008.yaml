  yaml_path: translation/ot/genesis/005/008.yaml
  text: So all the days of Seth were nine hundred and twelve years, and he died.
translation:
  language: ta
  text: சேத்தின் வாழ்நாட்கள் அனைத்தும் தொள்ளாயிரத்துப் பன்னிரண்டு ஆண்டுகள்; பின்பு அவர் இறந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: வாழ்நாட்கள் அனைத்தும்
  rationale: மரபுப்பட்டியல் சுருக்கச் சூத்திரத்தில் மொத்த வாழ்நாளைக் குறிக்கும் எபிரெயச் சொற்றொடரை, அதன் வடிவத்தையும் இயல்பான நவீனத் தமிழையும் சமநிலைப்படுத்தி வழங்குகிறது.
- source_word: שֵׁת
  choice: சேத்
  rationale: தனிப்பெயர் தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவில் தரப்பட்டுள்ளது.
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: தொள்ளாயிரத்துப் பன்னிரண்டு ஆண்டுகள்
  rationale: எபிரெயத்தில் ‘பன்னிரண்டு ஆண்டுகளும் தொள்ளாயிரம் ஆண்டுகளும்’ என்ற வரிசையில் உள்ள மொத்த எண்ணை, தமிழில் இயல்பான எண் வரிசையில் 912 ஆண்டுகள் எனத் தருகிறது.
- source_word: וַיָּמֹת
  choice: பின்பு அவர் இறந்தார்
  rationale: மரபுப்பட்டியலில் மீண்டும் வரும் நிறைவுச் சூத்திரத்தின் எளிமையையும் மரணத்தைத் தெரிவிக்கும் நேரடியான பொருளையும் காக்கிறது; ‘பின்பு’ தொடர்ச்சியான நிகழ்வை இயல்பான தமிழில் குறிக்கிறது.
