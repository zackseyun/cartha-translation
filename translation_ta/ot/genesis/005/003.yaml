base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/003.yaml
  text: Adam lived one hundred thirty years and fathered a son in his likeness[a], according to his image[c][b], and called his name Seth.
translation:
  language: ta
  text: ஆதாம் நூற்று முப்பது ஆண்டுகள் வாழ்ந்தான்; தன் சாயலில், தன் உருவத்தின்படி[b] ஒரு மகனைப் பெற்றான்[a]; அவனுக்குச் சேத் என்று பெயரிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, ‘ஒரு மகனைத் தோற்றுவித்தான்’; எபிரெய வினை ஆண் எழுவாயுடன் வரும்போது தந்தையாதலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தன் சாயலில், தன் உருவத்தின்படி’ என்ற சொற்கள் ஆதியாகமம் 1:26-27 ஐ நினைவூட்டுகின்றன.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்தபோது
  rationale: வம்சவரலாற்று வயதுக் குறிப்பில் חיה என்பது வாழ்ந்த காலத்தைச் சுட்டுகிறது; அடுத்த நிகழ்வுடன் இயல்பாக இணைக்கத் தமிழில் ‘வாழ்ந்தபோது’ என வழங்கப்பட்டது.
- source_word: אָדָם
  choice: ஆதாம்
  rationale: இங்கு பொதுவான ‘மனிதன்’ என்ற பொருளில் அல்லாமல், வம்சவரலாற்றிலுள்ள தனிப்பெயராக வருகிறது.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: நூற்று முப்பது ஆண்டுகள்
  rationale: எபிரெய எண்ணிக்கையையும் ‘ஆண்டுகள்’ என்ற கால அலகையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיּוֹלֶד
  choice: ஒரு மகனைப் பெற்றான்
  rationale: ஆண் எழுவாயுடன் வரும் ילד என்பதன் ஹிப்ஃபில் வடிவம் ‘பெற்றெடுத்தான்/தந்தையானான்’ என்ற பொருளுடையது. நவீன தமிழில் ‘ஒரு மகனைப் பெற்றான்’ இயல்பாக உள்ளது; ‘மகன்’ என்பது பின்னர் சேத் எனப் பெயரிடப்படுவதால் சூழலிலிருந்து வெளிப்படுகிறது.
- source_word: בִּדְמוּתוֹ
  choice: தன் சாயலில்
  rationale: דְּמוּת குறிக்கும் ஒப்புமை அல்லது ஒத்த தன்மையை ‘சாயல்’ இயல்பாகத் தருகிறது; ஆதியாகமம் 1:26-27 இன் மொழியொலியையும் காக்கிறது.
- source_word: כְּצַלְמוֹ
  choice: தன் உருவத்தின்படி
  rationale: צֶלֶם என்பதற்கு ‘உருவம்’ என்றும் כ முன்னொட்டுக்கு ‘-இன்படி’ என்றும் வழங்கி, דְּמוּת மற்றும் צֶלֶם ஆகிய இரு சொற்களையும் ஒன்றாக்காமல் வேறுபடுத்துகிறது.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ שֵׁת
  choice: அவனுக்குச் சேத் என்று பெயரிட்டான்
  rationale: ‘அவனுடைய பெயரை சேத் என்று அழைத்தான்’ என்ற எபிரெய மொழிமரபின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: שֵׁת
  choice: சேத்
  rationale: எபிரெய தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: ஆதாமுடைய மகனுக்கும் ஆதாமுடைய சாயல் மற்றும் உருவத்துக்கும் உள்ள உறவு
  choice: இந்தச் சொற்றொடரை ஆதாமோடுள்ள ஒற்றுமையாக நேரடியாக மொழிபெயர்த்து, ஆதியாகமம் 1:26-27 உடனான மொழியொலியைப் பாதுகாத்தல்
  alternative: வீழ்ச்சிக்குப் பின் தேவனுடைய சாயல் குறைந்தது அல்லது இழக்கப்பட்டது என இவ்வசனத்துக்குள்ளேயே விளக்குதல்
  rationale: இவ்வசனம் ஆதியாகமம் 1:26-27 ஐ நினைவூட்டினாலும், அந்த ஒற்றுமையின் முழுத் தெய்வியல் விளைவுகளைத் தானே விவரிக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அந்தத் தொடர்பையும் பதற்றத்தையும் காக்கிறது; ஒரு குறிப்பிட்ட கோட்பாட்டு முடிவைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு இயல்பாகவும் கண்ணியமாகவும் அமைந்த நடை. ‘சாயல்’ மற்றும் ‘உருவம்’ என இரு வேறு எபிரெயச் சொற்களின் வேறுபாடு பாதுகாக்கப்பட்டுள்ளது. எபிரெயச் சொற்றொடரின் இயல்பற்ற நேரடி வடிவத்துக்குப் பதிலாக ‘பெயரிட்டான்’ பயன்படுத்தப்பட்டுள்ளது.
