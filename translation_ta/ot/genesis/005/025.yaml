lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்தபோது
  rationale: வம்சவரலாற்றுச் சூத்திரத்தில் חיה என்பது வாழ்ந்த காலத்தைக் குறிக்கிறது. அடுத்த வினையுடன் இயல்பாக இணைக்கத் தமிழில் காலத் தொடர்புடைய வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: מְתוּשֶׁלַח
  choice: மெத்தூசலா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: שֶׁבַע וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: நூற்று எண்பத்தேழு ஆண்டுகள்
  rationale: எபிரெய எண்ணமைப்பின் பொருளைத் தமிழின் வழக்கமான எண்ணமைப்பில் துல்லியமாக வழங்குகிறது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: Hiphil வடிவமான ילד இங்கு ஆண் வம்சவரலாற்றில் ‘தந்தையானான்/மகனைப் பெற்றான்’ எனப் பொருள்படும். ‘பெற்றான்’ என்பது சுருக்கமான, இயல்பான தமிழ்; தந்தை வழி வம்சத் தொடர்பைச் சூழல் தெளிவுபடுத்துகிறது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண அடையாளம்; தமிழில் வேற்றுமை உருபின் மூலம் அதன் பணி வெளிப்படுகிறது.
- source_word: לָמֶךְ
  choice: லாமேக்கு
  rationale: எபிரெயத் தனிப்பெயர் லாமேக்; ‘பெற்றான்’ என்பதன் செயப்படுபொருளாகத் தமிழின் ‘ஐ’ உருபு இணைக்கப்பட்ட வடிவம்.
