revisions:
- from: மகலலேல் அறுபத்தைந்து ஆண்டுகள் வாழ்ந்து, யாரேதைப் பெற்றான்.
  to: மகலலேல் அறுபத்தைந்து ஆண்டுகள் வாழ்ந்தபோது, யாரேத்தைப் பெற்றான்.
  rationale: The revision preserves the Hebrew number and male genealogical action, clarifies the temporal force of the formula, and corrects the personal-name/object inflection. No footnote is needed because the translation does not resolve a textual or semantic ambiguity beyond what the source states.
