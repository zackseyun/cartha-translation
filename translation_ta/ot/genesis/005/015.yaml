  yaml_path: translation/ot/genesis/005/015.yaml
  text: Mahalalel lived sixty-five years and fathered Jared.
translation:
  language: ta
  text: மகலலேல் அறுபத்தைந்து ஆண்டுகள் வாழ்ந்தபோது, யாரேத்தைப் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்து
  rationale: வம்சவரலாற்றுச் சூத்திரத்தில் חיה என்பது அடுத்த நிகழ்வு வரையிலான வாழ்நாளைக் குறிக்கிறது; தொடரும் வாக்கிய அமைப்புக்கு இயல்பாக ‘வாழ்ந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מַהֲלַלְאֵל
  choice: மகலலேல்
  rationale: எபிரெயத் தனிப்பெயர் பொருளாக்கப்படாமல், அதன் ஒலிக்கு நெருக்கமான நவீனத் தமிழ் எழுத்துப்பெயர்ப்பாக வழங்கப்பட்டது.
- source_word: חָמֵשׁ שָׁנִים וְשִׁשִּׁים שָׁנָה
  choice: அறுபத்தைந்து ஆண்டுகள்
  rationale: எபிரெயில் ‘ஐந்து ஆண்டுகளும் அறுபது ஆண்டும்’ என்ற வரிசையில் உள்ள எண்ணின் துல்லிய மதிப்பை இயல்பான தமிழ் எண் வரிசையில் தருகிறது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றில் ילד ஆண் ஒருவன் பிள்ளைக்குத் தந்தையானதைக் குறிக்கிறது. ‘பெற்றான்’ என்பது தமிழ் வேதாகம வம்சப்பட்டியல் நடையில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது; இங்கு கருப்பொருள் ஆண்பால் என்பதால் தந்தைமைச் சூழல் தெளிவாகிறது.
- source_word: אֶת יָרֶד
  choice: யாரேதை
  rationale: אֶת என்பது நேரடிச் செயப்படுபொருள் குறியீடு; தமிழில் ‘யாரேதை’ என்ற வேற்றுமை வடிவால் அது வெளிப்படுகிறது. יָרֶד என்பதன் முதல் உயிரொலியைப் பேணும் வகையில் ‘யாரேது’ என்ற பெயரின் செயப்படுபொருள் வடிவம் பயன்படுத்தப்பட்டது.
