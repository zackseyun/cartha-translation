translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரலாற்றுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. பழமையான ‘ஜனிப்பித்தான்’ போன்ற சொல்லைத் தவிர்த்து, பொதுவாசகர்களுக்குப் புரியும் ‘பெற்றான்’ பயன்படுத்தப்பட்டுள்ளது.
