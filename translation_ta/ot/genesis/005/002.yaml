source:
  edition: WLC
  text: זָכָ֥ר וּ/נְקֵבָ֖ה בְּרָאָ֑/ם וַ/יְבָ֣רֶךְ אֹתָ֗/ם וַ/יִּקְרָ֤א אֶת שְׁמָ/ם֙ אָדָ֔ם בְּ/י֖וֹם הִבָּֽרְאָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/002.yaml
  text: Male and female he created them[a], and he blessed them and called their name Man on the day they were created.
translation:
  language: ta
  text: ஆணாகவும் பெண்ணாகவும் அவர்களைப் படைத்தார்; அவர்களை ஆசீர்வதித்தார்; அவர்கள் படைக்கப்பட்ட நாளில் அவர்களுக்கு “மனிதர்”[a] என்று பெயரிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ஆதாம். இச்சொல் “மனிதன்” அல்லது ஒட்டுமொத்த “மனிதகுலம்” என்பதைக் குறிக்கலாம்; “ஆதாம்” என்ற தனிப்பட்ட பெயராகவும் வருகிறது.
    reason: אָדָם என்ற எபிரெயச் சொல்லின் கூட்டு மனிதப் பொருளையும் தனிப்பெயர்ப் பொருளையும் காக்கும் மாற்று வாசிப்பு.
lexical_decisions:
- source_word: זָכָר וּנְקֵבָה
  choice: ஆணாகவும் பெண்ணாகவும்
  rationale: இரு எபிரெயப் பதங்களின் இணையான பாலினக் குறிப்பை இயல்பான நவீனத் தமிழில் காக்கிறது; இங்கு ‘ஆண், பெண்’ என்பது படைக்கப்பட்ட மனிதர்களின் பாலின அடையாளத்தைக் குறிக்கிறது.
- source_word: בְּרָאָם
  choice: அவர்களைப் படைத்தார்
  rationale: בּרא என்ற வினையின் எளிய இறந்தகாலச் செயலைவும், பன்மைச் சுட்டையும் தெளிவாகக் காக்கிறது; வினையின் எழுவாயாகிய கடவுள் முந்தைய வசனத்திலிருந்து புரிந்துகொள்ளப்படுகிறார்.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: அவர்களை ஆசீர்வதித்தார்
  rationale: தெய்வீக ஆசீர்வாதச் செயலைச் சுருக்கமாகவும் வழக்கமான தமிழிலும் தருகிறது.
- source_word: וַיִּקְרָא אֶת־שְׁמָם
  choice: அவர்களுக்கு … என்று பெயரிட்டார்
  rationale: சொல்லுக்குச் சொல் ‘அவர்களுடைய பெயரை … என்று அழைத்தார்’ என்பதற்குப் பதிலாக, ஒரே பெயர் இருவருக்கும் வழங்கப்பட்டதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָדָם
  choice: மனிதர்
  rationale: ஆணையும் பெண்ணையும் சேர்த்துக் குறிக்கும் கூட்டு மனித அடையாளத்தை முதன்மைப்படுத்துகிறது. அதே எபிரெயச் சொல் ‘ஆதாம்’ என்ற தனிப்பட்ட பெயராகவும் இருப்பதால் அந்த உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בְּיוֹם הִבָּרְאָם
  choice: அவர்கள் படைக்கப்பட்ட நாளில்
  rationale: காலக் குறிப்பையும் எபிரெயத்தின் செயப்பாட்டு வடிவத்தையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: אָדָם என்பது இங்கு கூட்டு மனித அடையாளமா அல்லது ஆதாம் என்ற தனிப்பட்ட பெயரா?
  choice: மனிதர்
  alternative: ஆதாம்; மனிதகுலம்; மனிதன்
  rationale: உடனடி சூழலில் ஆணும் பெண்ணும் ஒன்றாக ஒரே பெயரால் அழைக்கப்படுகின்றனர்; ஆகவே கூட்டு மனிதப் பொருள் முதன்மையானது. எனினும், மரபுவரிசைச் சூழலிலும் எபிரெயச் சொல்லின் வடிவத்திலும் ‘ஆதாம்’ என்ற தனிப்பெயர் சாத்தியமாக இருப்பதால் அதைத் தீர்த்துவிடாமல் அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனிதர்’ என்பது ஆண் ஒருவரை மட்டும் சுட்டாமல் இருவருக்கும் வழங்கப்பட்ட கூட்டு அடையாளத்தைத் தமிழில் இயல்பாக வெளிப்படுத்தத் தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் இருபொருள் தன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
