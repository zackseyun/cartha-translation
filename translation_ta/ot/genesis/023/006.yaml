review_pass:
  verdict: revise
  source_fidelity: The draft broadly conveys the verse, including the respectful address, the superlative-capable expression נְשִׂיא אֱלֹהִים, the choice burial places, and the collective assurance. However, ‘இறந்த உம்மவர்’ is not idiomatic Tamil, and the final wording can misleadingly suggest transfer of ownership rather than refusal of access for burial.
  naturalness: ‘எங்கள் வேண்டுகோளைக் கேளும்’ adds ‘request’ beyond the direct imperative ‘Hear us’ and is less direct than natural modern Tamil. ‘இறந்த உம்மவர்’ is especially unnatural. The revised wording uses respectful, clear modern Tamil while retaining the formal setting.
  terminology: ‘கடவுளின் தலைவர்’ retains the Hebrew construct phrase and its ambiguity adequately, with the superlative reading supplied in the footnote. ‘கல்லறை’ is suitable for קבר in this context. ‘உமது இறந்தவர்’ is a clearer and more natural rendering of מֵתֶךָ.
  issues:
  - severity: medium
    issue: ‘இறந்த உம்மவர்’ is unidiomatic.
    rationale: This expression does not naturally identify the deceased person belonging to or associated with Abraham. ‘உமது இறந்தவர்’ is both understandable and closer to the possessive form of מֵתֶךָ.
  - severity: low
    issue: ‘எங்கள் வேண்டுகோளைக் கேளும்’ adds ‘வேண்டுகோள்’ (‘request’).
    rationale: שְׁמָעֵנוּ directly means ‘Hear/listen to us’; the added noun is unnecessary and slightly narrows the wording.
  - severity: medium
    issue: ‘தன் கல்லறையை உமக்குத் தர மறுக்கமாட்டான்’ may imply giving ownership.
    rationale: The Hebrew states that no one will withhold his burial place from Abraham, with the following infinitive expressing prevention from burial. Tamil should express refusal of use/access without implying a property transfer.
  revised_text: “எங்களுக்குச் செவிகொடுங்கள், என் ஆண்டவரே! நீர் எங்கள் நடுவில் கடவுளின் தலைவராக இருக்கிறீர்.[a] எங்கள் மிகச் சிறந்த கல்லறைகளில் ஒன்றில் உமது இறந்தவரை அடக்கம் செய்யுங்கள். உமது இறந்தவரை அடக்கம் செய்ய முடியாதபடி, எங்களில் ஒருவரும் தன் கல்லறையை உமக்கு மறுக்கமாட்டான்.”
