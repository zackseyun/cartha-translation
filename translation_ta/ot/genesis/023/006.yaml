  to: “எங்களுக்குச் செவிகொடுங்கள், என் ஆண்டவரே! நீர் எங்கள் நடுவில் கடவுளின் தலைவராக இருக்கிறீர்.[a] எங்கள் மிகச் சிறந்த கல்லறைகளில் ஒன்றில் உமது இறந்தவரை அடக்கம் செய்யுங்கள். உமது இறந்தவரை அடக்கம் செய்ய முடியாதபடி, எங்களில் ஒருவரும் தன் கல்லறையை உமக்கு மறுக்கமாட்டான்.”
