  choice: முதன்மை உரையில் ‘கடவுளின் தலைவர்’ என்று வடிவ ஒற்றுமையைப் பாதுகாத்தல்
  alternative: ‘மிகவும் வல்லமைமிக்க தலைவர்’ என்று உயர்நிலைப் பொருளில் மொழிபெயர்த்தல்
  rationale: இது கடவுளோடு தனிப்பட்ட உறவைச் சுட்டலாம் அல்லது எபிரெய மொழியின் உயர்நிலை/மிகைப்படுத்தும் மரபாக இருக்கலாம். உரை தீர்மானிக்காததை மொழிபெயர்ப்பு தீர்மானிக்காமல், மாற்றுப் பொருளை அடிக்குறிப்பில் வைத்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையான ஒருமை விளிப்பும் வினைமுற்றுகளும் பயன்படுத்தப்பட்டுள்ளன. குடும்ப இழப்பைக் குறிக்கும் இடத்தில் ‘இறந்த உம்மவர்’ என்று இயல்பான, கண்ணியமான சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது; பழமையான அல்லது குறிப்பிட்ட சமயப் பிரிவுக்குரிய சொற்கள் தவிர்க்கப்பட்டன.
