  text: שְׁמָעֵ֣/נוּ אֲדֹנִ֗/י נְשִׂ֨יא אֱלֹהִ֤ים אַתָּה֙ בְּ/תוֹכֵ֔/נוּ בְּ/מִבְחַ֣ר קְבָרֵ֔י/נוּ קְבֹ֖ר אֶת מֵתֶ֑/ךָ אִ֣ישׁ מִמֶּ֔/נּוּ אֶת קִבְר֛/וֹ לֹֽא יִכְלֶ֥ה מִמְּ/ךָ֖ מִ/קְּבֹ֥ר מֵתֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/006.yaml
  text: 'Hear us[a], my lord: you are a prince of God among us. Bury your dead in the choicest of our tombs. None of us will withhold his tomb from you[b], from burying your dead.'
translation:
  language: ta
  text: “எங்களுக்குச் செவிகொடுங்கள், என் ஆண்டவரே! நீர் எங்கள் நடுவில் கடவுளின் தலைவராக இருக்கிறீர்.[a] எங்கள் மிகச் சிறந்த கல்லறைகளில் ஒன்றில் உமது இறந்தவரை அடக்கம் செய்யுங்கள். உமது இறந்தவரை அடக்கம் செய்ய முடியாதபடி, எங்களில் ஒருவரும் தன் கல்லறையை உமக்கு மறுக்கமாட்டான்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் எங்கள் நடுவில் மிகவும் வல்லமைமிக்க தலைவராக இருக்கிறீர்.” “கடவுளின் தலைவர்” என்ற எபிரெயச் சொற்றொடர் உயர்நிலைப் பொருளில் இவ்வாறு பயன்படக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעֵנוּ
  choice: எங்கள் வேண்டுகோளைக் கேளும்
  rationale: שׁמע என்பதன் கட்டளை வடிவமும் முதலாம் நபர் பன்மை பின்னொட்டும் நேரடியான மரியாதை வேண்டுகோளைத் தருகின்றன; தமிழில் வெறும் ‘எங்களைக் கேளும்’ என்பதைவிட இது இயல்பாக உள்ளது.
- source_word: אֲדֹנִי
  choice: என் ஆண்டவரே
  rationale: ஆபிரகாமை நோக்கிய மரியாதையான விளிப்பு; எபிரெயச் சமூக மரியாதையைப் பாதுகாக்கிறது.
- source_word: נְשִׂיא אֱלֹהִים
  choice: கடவுளின் தலைவர்
  rationale: சொல்லுக்கு நெருக்கமான ‘கடவுளின் தலைவர்’ என்ற அமைப்பை முதன்மை உரையில் வைத்து, அது மிக உயர்ந்த அல்லது வல்லமைமிக்க தலைவர் என்னும் எபிரெய உயர்நிலைப் பயன்பாடாக இருக்கக்கூடியதை அடிக்குறிப்பில் தருகிறது.
- source_word: בְּתוֹכֵנוּ
  choice: எங்கள் நடுவில்
  rationale: சமூகத்தின் மத்தியில் என்ற பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּמִבְחַר קְבָרֵינוּ
  choice: எங்களுடைய கல்லறைகளில் மிகச் சிறந்த ஒன்றில்
  rationale: מבחר என்பதன் ‘தேர்ந்தெடுக்கப்பட்ட/மிகச் சிறந்த’ பொருளையும், பல கல்லறைகளிலிருந்து ஒன்றை வழங்கும் சூழலையும் தெளிவாகக் காட்டுகிறது.
- source_word: קְבֹר אֶת־מֵתֶךָ
  choice: இறந்த உம்மவரை அடக்கம் செய்யும்
  rationale: מֵתֶךָ என்பது ஆபிரகாமுக்குரிய இறந்த நபரைக் குறிக்கிறது; தமிழில் ‘உமது இறந்தவர்’ என்பதைக் காட்டிலும் இவ்வடிவம் இயல்பாகவும் மரியாதையாகவும் உள்ளது.
- source_word: אִישׁ מִמֶּנּוּ
  choice: எங்களில் ஒருவனும்
  rationale: மறுப்பு வாக்கியத்தில் பகிர்ந்தளிக்கும் பொருளுடன் ‘எங்களில் ஒருவர்கூட இல்லை’ என்பதைச் சுட்டுகிறது.
- source_word: אֶת־קִבְרוֹ
  choice: தன் கல்லறையை
  rationale: ஒவ்வொருவருக்கும் உரிய தனிப்பட்ட அடக்க இடத்தைத் தமிழின் தற்சுட்டுப் பெயரால் இயல்பாகக் காட்டுகிறது.
- source_word: לֹא יִכְלֶה מִמְּךָ
  choice: உமக்குத் தர மறுக்கமாட்டான்
  rationale: இச்சூழலில் כלה என்பது தடுத்து வைத்தல் அல்லது மறுத்தல் எனப் பொருள்படுகிறது; கல்லறையைப் பயன்படுத்த அனுமதிக்கும் கருத்தைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִקְּבֹר מֵתֶךָ
  choice: இறந்த உம்மவரை அடக்கம் செய்வதற்கு
  rationale: מן + வினையெச்ச அமைப்பு தடைசெய்வதை அல்லது மறுப்பதைச் சார்ந்துள்ளது; தமிழில் நோக்கத் தொடர்புடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
