base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/009.yaml
  text: and let him give me the cave of Machpelah[a], which belongs to him, which is at the end of his field. For the full price in silver[d][c][b], let him give it to me among you as a burial property.
translation:
  language: ta
  text: அவனுக்குச் சொந்தமானதும் அவனுடைய வயலின் ஓரத்தில்[a] இருப்பதுமான மக்பேலா குகையை அவன் எனக்குக் கொடுக்கட்டும். முழு விலைக்கான வெள்ளியைச் செலுத்தி[b] அதை உங்கள் நடுவில் எனக்கு அடக்கத்திற்கான உடைமையாக[c] கொடுக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய வயலின் கடைக்கோடியில்.” எபிரெயச் சொல் வயலின் ஓரத்தையோ கடைசிப் பகுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “முழு வெள்ளிக்கு”; இது முழு விலையையும் வெள்ளியில் செலுத்துவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அடக்கத்திற்கான உடைமையாக.” எபிரெயச் சொல் அடக்கம் செய்யும் பயன்பாட்டை மட்டுமல்ல, சட்டப்பூர்வ உடைமையையும் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: அவன் எனக்குக் கொடுக்கட்டும்
  rationale: வேண்டுகோளின் சூழலில் வரும் எபிரெய வினை வடிவத்தை இயல்பான தமிழ் வேண்டுகோள் வடிவில் தருகிறது.
- source_word: מְעָרַת הַמַּכְפֵּלָה
  choice: மக்பேலா குகை
  rationale: இடப்பெயரை ஒலிபெயர்த்து, தமிழ் வழக்கிற்கு இயல்பான பெயர்ச்சொல் அமைப்பைப் பயன்படுத்துகிறது.
- source_word: אֲשֶׁר לוֹ
  choice: அவனுக்குச் சொந்தமானது
  rationale: உடைமை மற்றும் இந்தப் பேரத்தின் சட்டப்பூர்வச் சொத்து நுணுக்கத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר בִּקְצֵה שָׂדֵהוּ
  choice: அவனுடைய வயலின் ஓரத்தில் இருப்பது
  rationale: קצה என்பதன் எல்லை அல்லது கடைக்கோடி என்ற இடவியல் பொருளை, மிகையாகக் குறிப்பாக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: בְּכֶסֶף מָלֵא
  choice: முழு வெள்ளி விலைக்கு
  rationale: சலுகையோ அன்பளிப்போ அல்லாமல் முழுத் தொகையும் வெள்ளியில் செலுத்தப்படுவதைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: יִתְּנֶנָּה
  choice: அதைக் கொடுக்கட்டும்
  rationale: வாங்கும் சூழல் இருந்தாலும், மூலத்தில் உள்ள נתן என்ற ‘கொடு’ வினையைப் பாதுகாக்கிறது.
- source_word: בְּתוֹכְכֶם
  choice: உங்கள் நடுவில்
  rationale: இத்தேயர் சமூகத்தின் மத்தியில், அவர்களது அங்கீகாரத்துடன் நடைபெறும் பரிமாற்றத்தை மூலத்திற்கு நெருக்கமாகக் காட்டுகிறது.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: அடக்கச் சொத்தாக
  rationale: பிணத்தை அடக்கம் செய்வதற்கான இடம் மட்டுமல்ல, சட்டப்பூர்வமாக உடைமையாக்கப்படும் நிலம் என்பதையும் சுருக்கமாக உணர்த்துகிறது.
theological_decisions:
- issue: அடக்க இடத்தின் சட்டப்பூர்வ உடைமை
  choice: அடக்கச் சொத்தாக
  alternative: அடக்கம் செய்வதற்கான இடமாக
  rationale: אֲחֻזָּה வெறும் பயன்பாட்டு அனுமதியைக் காட்டாமல், நிலையான உடைமை அல்லது உரிமையைக் குறிக்கிறது; உரை கூறுவதைத் தாண்டிய இறையியல் முடிவு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் சட்டப்பூர்வப் பேரத்தின் தொனியும் காக்கப்பட்டுள்ளன. மூலத்தின் இருமுறை வரும் ‘கொடு’ வினையும் வேண்டுகோள் வடிவமும் பாதுகாக்கப்பட்டுள்ளன; ‘அடக்கச் சொத்து’ என்பது சாதாரண வாசகருக்குப் புரியுமாறு சட்ட உரிமை நுணுக்கத்தையும் தக்கவைக்கிறது.
