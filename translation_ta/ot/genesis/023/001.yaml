translation:
  language: ta
  text: சாராள் நூற்று இருபத்தேழு ஆண்டுகள் வாழ்ந்தாள்; இவையே சாராளின் வாழ்நாளின் ஆண்டுகள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ חַיֵּי שָׂרָה
  choice: சாராள் ... வாழ்ந்தாள்
  rationale: எபிரெயச் சொற்றொடர் எழுத்துப்படி ‘சாராளின் வாழ்நாள் இருந்தது’ என அமைந்தாலும், தமிழில் இயல்பாகவும் பொருள் மாறாமலும் வயதைக் கூற ‘வாழ்ந்தாள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: מֵאָה שָׁנָה וְעֶשְׂרִים שָׁנָה וְשֶׁבַע שָׁנִים
  choice: நூற்று இருபத்தேழு ஆண்டுகள்
  rationale: மூலத்தில் நூறு, இருபது, ஏழு எனத் தனித்தனியாகக் கூறப்பட்ட மொத்த வயது, இயல்பான நவீன தமிழில் ஒருங்கிணைத்து வழங்கப்பட்டது.
- source_word: שְׁנֵי חַיֵּי שָׂרָה
  choice: சாராளின் வாழ்நாளின் ஆண்டுகள்
  rationale: மூலத்தின் முடிவிலுள்ள வலியுறுத்தும் மறுபதிப்பைப் பாதுகாக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
