  source_fidelity: மூல எபிரெயத்தில் சாராளின் ஆயுள் நூறு, இருபது, ஏழு ஆண்டுகள் எனக் கூறப்பட்டு, அதே கருத்து முடிவில் வலியுறுத்தி மீண்டும் சொல்லப்படுகிறது. தமிழாக்கம் மொத்த வயதைத் துல்லியமாகத் தருவதோடு, அந்த நிறைவுரை மறுபதிப்பையும் பேணுகிறது.
  naturalness: “சாராள் நூற்று இருபத்தேழு ஆண்டுகள் வாழ்ந்தாள்” நவீன தரத் தமிழில் இயல்பானது. “இவையே சாராளின் வாழ்நாளின் ஆண்டுகள்” என்பது சற்றே முறையான நடையாயினும், மூலத்தின் திட்டமிட்ட மறுபதிப்புக்கு ஏற்ற கண்ணியமான மொழிநடையாக உள்ளது.
  terminology: “சாராள்” என்பது நிலையான தமிழ் வேதாகமப் பெயர்வடிவம். “வாழ்நாள்” மற்றும் “ஆண்டுகள்” ஆகியவை மூலத்தின் life/years சொல்லாட்சியைச் சரியாக வெளிப்படுத்துகின்றன.
