  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளது. வசனத்தின் எபிரெய மறுபதிப்பு நீக்கப்படாமல் இயல்பான தமிழில் தக்கவைக்கப்பட்டுள்ளது.
