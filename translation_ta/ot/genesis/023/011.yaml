base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/011.yaml
  text: 'No[a], my lord, listen to me: I give you the field, and I give you the cave that is in it[b]. In the sight of the sons of my people I give it to you[c]. Bury your dead.'
translation:
  language: ta
  text: “இல்லை[a], ஐயா, என் பேச்சைக் கேளுங்கள். அந்த நிலத்தை உங்களுக்குக் கொடுக்கிறேன்; அதிலுள்ள குகையையும் உங்களுக்குக் கொடுக்கிறேன். என் மக்களின் முன்னிலையில் அதை உங்களுக்குக் கொடுக்கிறேன்[b]. உங்களுடைய இறந்தவரை அடக்கம் செய்யுங்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் முறையாக, “அப்படியல்ல, ஐயா; என் பேச்சைக் கேளுங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “என் மக்களின் மகன்களுடைய கண்களுக்கு முன்பாக”; அதாவது, அவரது சமூகத்தைச் சேர்ந்த சாட்சிகளின் முன்னிலையில் பொதுவாக இந்தக் கொடை அறிவிக்கப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא
  choice: இல்லை
  rationale: ஆபிரகாமின் முன்மொழிவை மரியாதையுடன் மறுத்துத் திருத்தும் தொடக்கச் சொல்லாக இங்கு வருகிறது. ‘இல்லை’ என்பது இயல்பான நவீனத் தமிழ்; சூழலால் அதன் பணிவான தொனி வெளிப்படுகிறது.
- source_word: אֲדֹנִי
  choice: ஐயா
  rationale: பேச்சுவார்த்தையில் ஆபிரகாமை மரியாதையுடன் அழைக்கும் சொல். ‘ஐயா’ சமூக மரியாதையை இயல்பான தமிழில் தருகிறது; ‘என் ஆண்டவரே’ என்பது இன்றைய வாசகருக்கு தேவனைச் சுட்டும் அழைப்பாகத் தவறாக ஒலிக்கக்கூடும்.
- source_word: שְׁמָעֵנִי
  choice: நான் சொல்வதைக் கேளுங்கள்
  rationale: எபிரெய வினை இங்கு கவனித்துக் கேட்கும்படி வேண்டுகிறது. தமிழில் இது நேரடியும் மரியாதையானதும் இயல்பானதுமான வேண்டுகோள்.
- source_word: הַשָּׂדֶה
  choice: அந்த நிலம்
  rationale: שׂדה என்பது திறந்த நிலப்பரப்பு அல்லது வயலைக் குறிக்கலாம். இங்கு சொத்துப் பரிமாற்றச் சூழலில் ‘நிலம்’ பொருத்தமானது; ‘வயல்’ தேவையில்லாமல் பயிரிடப்பட்ட நிலம் என்ற எண்ணத்தைத் தரலாம்.
- source_word: נָתַתִּי לָךְ
  choice: உங்களுக்குக் கொடுக்கிறேன்
  rationale: இறந்தகால வடிவம் இங்கு உடனடி சொத்துப் பரிமாற்றத்தை நிகழ்த்தும் அறிவிப்பாகப் பயன்படுகிறது. தமிழ் நிகழ்காலம் அந்தச் செயற்பாட்டு வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמְּעָרָה אֲשֶׁר בּוֹ
  choice: அதிலுள்ள குகை
  rationale: குகை அந்த நிலத்திற்குள் இருப்பதைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: לְעֵינֵי בְנֵי עַמִּי
  choice: என் மக்களின் முன்னிலையில்
  rationale: சொல்லுக்குச் சொல் ‘என் மக்களின் மகன்களுடைய கண்களுக்கு முன்பாக’ என்றாலும், இது சமூகத்தாரின் பொது சாட்சியைக் குறிக்கும் மரபுத்தொடர். தமிழில் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: קְבֹר מֵתֶךָ
  choice: உங்களுடைய இறந்தவரை அடக்கம் செய்யுங்கள்
  rationale: ஒருமை வடிவம் சாராளைக் குறிக்கிறது. ‘அடக்கம் செய்யுங்கள்’ என்பது புதைப்பதைக் குறிக்கும் மரியாதையான, பொதுவான நவீனத் தமிழ் வெளிப்பாடு.
