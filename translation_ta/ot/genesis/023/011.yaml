translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையான நேரடி உரை பயன்படுத்தப்பட்டுள்ளது. ‘ஐயா’ மற்றும் ‘கேளுங்கள்’ சமூக மரியாதையை வெளிப்படுத்துகின்றன; மிகப் பழமையான அல்லது குறிப்பிட்ட சமய மரபுக்குரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன. நிலத்தையும் குகையையும் ‘கொடுக்கிறேன்’ என்ற நிகழ்காலம், எபிரெய இறந்தகால வடிவத்தின் செயற்பாட்டு சொத்துப் பரிமாற்றத் தன்மையைப் பாதுகாக்கிறது.
