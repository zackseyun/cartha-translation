base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/003.yaml
  text: Then Abraham rose from before his dead wife and spoke to the sons of Heth[a], saying,
translation:
  language: ta
  text: 'அப்போது ஆபிரகாம் தன் இறந்த மனைவியின் அருகிலிருந்து எழுந்து, ஏத்தின் மகன்களிடம்[a] பேசினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏத்தியர்களிடம்”; எபிரெயத்தில், “ஏத்தின் மகன்களிடம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: அப்போது ... எழுந்து
  rationale: வய்யிக்தோல் வடிவம் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ இயல்பான தமிழ் நிகழ்வுவரிசையைத் தருகிறது, ‘எழுந்து’ செயலைப் பாதுகாக்கிறது.
- source_word: מֵעַל פְּנֵי
  choice: அருகிலிருந்து
  rationale: சொல்லுக்கு சொல் ‘முகத்தின் முன்னிலையிலிருந்து’ என்றாலும், இச்சூழலில் ஆபிரகாம் உடலின் அருகாமையிலிருந்து விலகி எழுவதைக் குறிக்கிறது; ‘அருகிலிருந்து’ நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: מֵתוֹ
  choice: இறந்துபோன தன் மனைவியின்
  rationale: எபிரெயத்தில் சொற்பட ‘அவருடைய இறந்தவர்’ என உள்ளது. முந்தைய சூழலில் குறிப்பிடப்படுபவர் சாராள் என்பதால், தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க ‘இறந்துபோன தன் மனைவி’ என வழங்கப்படுகிறது.
- source_word: וַיְדַבֵּר
  choice: பேசத் தொடங்கினார்
  rationale: דבר אֶל என்பது ஒருவரிடம் பேசுவதைக் குறிக்கிறது. அடுத்த வசனத்தில் உரை தொடருவதால், לֵאמֹר உடன் சேர்ந்த கட்டமைப்பை இயல்பான தமிழில் ‘பேசத் தொடங்கினார்:’ என ஒருங்கிணைக்கிறது.
- source_word: בְּנֵי חֵת
  choice: ஏத்தின் மக்கள்
  rationale: சொற்பட ‘ஏத்தின் மகன்கள்.’ இங்கு அது ஏத்தின் வழிவந்த இனக்குழுவைக் குறிக்கிறது; ‘ஏத்தின் மக்கள்’ பொருளையும் எபிரெயப் பெயரையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: לֵאמֹר
  choice: 'பேசத் தொடங்கினார்:'
  rationale: இந்த இறுதிவினையெச்சம் அடுத்த வசனத்தில் வரும் நேரடி உரையை அறிமுகப்படுத்துகிறது. தமிழில் தனியாக ‘சொல்லி’ என முடிப்பதைவிட இரட்டைப்புள்ளியுடன் கூடிய இவ்வடிவம் இயல்பானது.
