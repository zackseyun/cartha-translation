base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/020.yaml
  text: So the field and the cave that was in it were deeded to Abraham as a burial property from the sons of Heth[a][b][c].
translation:
  language: ta
  text: இவ்வாறு, அந்த நிலமும் அதிலிருந்த குகையும்[a], ஏத்தின் சந்ததியினரிடமிருந்து[c] ஆபிரகாமுக்கு அடக்கத்திற்கான உடைமையாகச் சட்டப்படி உறுதிசெய்யப்பட்டன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை, “அந்த நிலமும் அதற்குள் இருந்த குகையும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: previous_rendering
  - marker: b
    text: இதனை இன்னும் சொல்லுக்குச் சொல்லாக, “ஆபிரகாமுக்கு அடக்கத்திற்கான உடைமையாக நிலைநாட்டப்பட்டன” என்றும் மொழிபெயர்க்கலாம். இங்கு எபிரெய வினை, உரிமை சட்டப்படி உறுதிப்படுத்தப்பட்டதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “ஏத்தியர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: சட்டப்படி உறுதிசெய்யப்பட்டன
  rationale: இந்த நிலம் வாங்கப்பட்ட சட்டச் சூழலில், קום என்பது அந்தச் சொத்து ஆபிரகாமின் உரிமையாகச் செல்லுபடியாக நிலைநாட்டப்பட்டதைக் குறிக்கிறது. தமிழில் இந்தச் சட்டப்பூர்வப் பொருளைத் தெளிவாகக் காட்டுகிறது; எபிரெய வினையின் அடிப்படைப் பொருளான ‘எழுந்தது’ என்பதைப் பொருத்தமின்றி மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
- source_word: הַשָּׂדֶה
  choice: அந்த நிலம்
  rationale: வாங்கப்பட்ட குறிப்பிட்ட நிலப்பகுதியைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: அதிலிருந்த குகையும்
  rationale: நிலத்திற்குள் இருந்த குகையைக் குறிக்கும் தொடர்புச் சொல்லைச் சுருக்கமாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: לְאַבְרָהָם
  choice: ஆபிரகாமுக்கு
  rationale: சட்டப்பூர்வ உடைமையைப் பெறுபவர் ஆபிரகாம் என்பதைத் தத்திவேற்றுமையில் காட்டுகிறது.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: அடக்கத்திற்கான உடைமையாக
  rationale: אֲחֻזָּה என்பதிலுள்ள நிரந்தர உடைமை அல்லது உரிமை என்ற சட்ட நுணுக்கத்தையும், கல்லறைப் பயன்பாட்டையும் ஒன்றாகப் பாதுகாக்கிறது.
- source_word: מֵאֵת
  choice: இடமிருந்து
  rationale: உரிமை மாற்றத்தின் மூலத்தைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: בְּנֵי חֵת
  choice: ஏத்தின் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் குலவழிப் பொருளைத் தக்கவைத்தபடி, நவீன தமிழில் ‘ஏத்தின் மகன்கள்’ என்பதைக் காட்டிலும் இயல்பாக உள்ளது.
