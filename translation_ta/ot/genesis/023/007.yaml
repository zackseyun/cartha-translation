base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/007.yaml
  text: Then Abraham rose and bowed down to the people of the land[a], to the sons of Heth.
translation:
  language: ta
  text: அப்போது ஆபிரகாம் எழுந்து, அந்த நாட்டின் மக்களான ஏத்தின் மகன்களுக்கு[a] முன்பாகக் குனிந்து வணங்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, ‘ஏத்தியர்.’ எபிரெயத்தில், ‘ஏத்தின் மகன்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: அப்போது ஆபிரகாம் எழுந்து
  rationale: קום என்பதன் Qal wayyiqtol வடிவம் எழுதல் அல்லது எழுந்து நிற்றலைக் குறிக்கிறது. தொடர்ச்சியான וַ இயல்பான தமிழ் கதைநடையில் ‘அப்போது’ என்று வழங்கப்பட்டுள்ளது.
- source_word: וַיִּשְׁתַּחוּ
  choice: குனிந்து வணங்கினார்
  rationale: שׁחה என்ற வினை உடலைத் தாழ்த்தி மரியாதை செலுத்துவதைக் குறிக்கிறது. முழுமையாகத் தரையில் விழுந்ததாக அளவுக்கு மீறிக் கூறாமல், உடல்சார் சைகையையும் மரியாதையையும் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: לְעַם הָאָרֶץ
  choice: அந்த நாட்டின் மக்களுக்கு முன்பாக
  rationale: இங்கு לְ என்பது வணக்கச் சைகை யாரை நோக்கியது என்பதைக் குறிக்கிறது; தமிழில் ‘முன்பாகக் குனிந்து வணங்கினார்’ என்பது இயல்பாக உள்ளது. עַם הָאָרֶץ என்பதன் சொல்லமைப்பு ‘அந்த நாட்டின் மக்கள்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לִבְנֵי חֵת
  choice: ஏத்தின் மகன்களுக்கு
  rationale: எபிரெயச் சொற்றொடரின் நேர்பொருள் ‘ஏத்தின் மகன்கள்.’ இனக்குழுவை மரபுவழி உறவால் சுட்டும் மூல வடிவம் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது; சூழலுக்கேற்ற ‘ஏத்தியர்’ என்பது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: חֵת
  choice: ஏத்
  rationale: தனிப்பெயர் நவீன நிலையான தமிழுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளது.
