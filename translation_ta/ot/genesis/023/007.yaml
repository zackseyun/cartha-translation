translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மதிப்புமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘ஏத்தின் மகன்கள்’ என்ற மூலத்தின் மரபுவழி இனக்குழுக் குறிப்பு முதன்மை உரையில் வைக்கப்பட்டு, பொதுவான இனப்பெயர் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
