translation_notes:
  register: நவீன நிலையான தமிழில், பொது வாசிப்புக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மூலத்தில் தனியான ‘இப்போது’ என்ற காலச்சொல் இல்லாததால் அது சேர்க்கப்படவில்லை. நீண்ட எபிரெய வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டாலும், பொது சாட்சி சூழலும் அடுத்த வசனத்துக்கு வழிவகுக்கும் நேரடிப் பேச்சு அறிமுகமும் பாதுகாக்கப்பட்டுள்ளன.
