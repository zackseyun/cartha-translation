  yaml_path: translation/ot/genesis/023/010.yaml
  text: Ephron was sitting among the sons of Heth[a], and Ephron the Hittite answered Abraham in the hearing of the sons of Heth, before all who entered the gate of his city, saying[b],
translation:
  language: ta
  text: 'எப்ரோன் ஏத்தின் மகன்களிடையே[a] அமர்ந்திருந்தான். ஏத்தியனான எப்ரோன், ஏத்தின் மகன்கள் கேட்கும்படியாகவும் தன் நகரத்தின் வாசலுக்கு வந்த அனைவரின் முன்னிலையிலும்[b] ஆபிரகாமுக்குப் பதிலளித்துச் சொன்னான்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரண்டு இடங்களிலும் வரும் “ஏத்தின் மகன்கள்” என்பதை “ஏத்தியர்கள்” என்றும் மொழிபெயர்க்கலாம்; எபிரெய மொழியில் சொல்லுக்கு சொல் “ஏத்தின் மகன்கள்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “நகரத்தின் வாசல்” என்பது சாட்சிகளின் முன்னிலையில் சட்ட மற்றும் வணிக நடவடிக்கைகள் நடைபெற்ற பொது இடத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב
  choice: அமர்ந்திருந்தான்
  rationale: எப்ரோன் அப்போது சபையினரிடையே அமர்ந்திருந்த தொடர்நிலையை எபிரெயப் பங்கேற்புவினை காட்டுகிறது; தமிழ் தொடர்நிலை வடிவம் அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּתוֹךְ
  choice: இடையே
  rationale: கூடியிருந்த சமூகக் குழுவினுள் எப்ரோன் இருந்ததை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: בְּנֵי חֵת
  choice: ஏத்தின் மகன்கள்
  rationale: ‘ஏத்தின் மகன்கள்’ என்ற எபிரெயச் சொற்றொடரின் வடிவத்தைப் பாதுகாத்து, பின்னர் வரும் இன அடையாளமான ‘ஏத்தியன்’ என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: וַיַּעַן
  choice: பதிலளித்துச் சொன்னான்
  rationale: உரையாடலில் வரும் ‘பதிலளித்தான்’ என்ற பொருளையும், அடுத்து நேரடிப் பேச்சை அறிமுகப்படுத்தும் לֵאמֹר என்பதையும் தமிழில் ஓட்டமாக இணைக்கிறது.
- source_word: הַחִתִּי
  choice: ஏத்தியனான
  rationale: எப்ரோனின் இன அடையாளத்தைத் தெளிவாகவும் இயல்பாகவும் குறிப்பிடுகிறது.
- source_word: בְּאָזְנֵי
  choice: கேட்கும்படியாக
  rationale: சொல்லுக்கு சொல் ‘காதுகளில்’ என்பதற்குப் பதிலாக, கூடியிருந்தோர் கேட்கும் வகையில் வெளிப்படையாகப் பேசியது என்ற எபிரெய மரபுத்தொடரின் பொருளைத் தருகிறது.
- source_word: לְכֹל בָּאֵי שַׁעַר עִירוֹ
  choice: தன் நகரத்தின் வாசலுக்குள் வந்த அனைவரின் முன்னிலையிலும்
  rationale: நகரவாசலுக்குள் வந்த அனைவரும் இந்தப் பொது நடவடிக்கையின் சாட்சிகளாக இருந்தனர் என்பதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: לֵאמֹר
  choice: 'சொன்னான்:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடிப் பேச்சை இயல்பாக அறிமுகப்படுத்துகிறது.
