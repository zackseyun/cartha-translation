base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/002.yaml
  text: And Sarah died in Kiriath-arba (that is[a], Hebron) in the land of Canaan[b], and Abraham came to mourn for Sarah and to weep for her.
translation:
  language: ta
  text: சாராள் கானான் நாட்டில் உள்ள கீரியாத்-அர்பாவில், அதாவது எபிரோனில்[a], இறந்தாள். ஆபிரகாம் சாராளுக்காகப் புலம்பவும்[b] அவளுக்காக அழவும் வந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கீரியாத்-அர்பா என்பது இங்கே எபிரோன் என அடையாளப்படுத்தப்படுகிறது.
    reason: cross_reference
  - marker: b
    text: அல்லது, “சாராளுக்காகத் துக்கம் அனுசரிக்கவும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: இறந்தாள்
  rationale: מות என்பது இறப்பை நேரடியாகக் குறிக்கிறது. எபிரெய உரையின் நேரடியான தன்மையை மென்மைப்படுத்தாமல், இயல்பான தமிழில் பெண்பால் எழுவாயுடன் தருகிறது.
- source_word: בְּקִרְיַת אַרְבַּע
  choice: கீரியாத்-அர்பாவில்
  rationale: இடப்பெயர் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; பின்னொட்டு இடத்தைக் குறிக்கும் בְּ என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הִוא חֶבְרוֹן
  choice: அதாவது எப்ரோனில்
  rationale: இந்த எபிரெய அடையாளப்படுத்தும் உட்செருகல், கீரியாத்-அர்பாவே எப்ரோன் என்பதைத் தெளிவுபடுத்துகிறது. இடவேற்றுமைத் தொடர்ச்சிக்காக ‘எப்ரோனில்’ என்று தரப்பட்டுள்ளது.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: கானான் நாட்டிலுள்ள
  rationale: אֶרֶץ என்ற வெளிப்படையான ‘நாடு/நிலம்’ என்னும் சொல்லைப் பாதுகாத்து, தமிழில் இடப்பெயரை இயல்பாகத் தொடர்புபடுத்துகிறது.
- source_word: וַיָּבֹא
  choice: வந்தார்
  rationale: בוא என்பதன் அடிப்படை ‘வருதல்/செல்லுதல்’ பொருள்களில், இக்கதைப் பார்வைக்கு ‘வந்தார்’ பொருந்துகிறது. ஆபிரகாமைக் குறிக்கும் மரியாதைப் பன்மை நவீனத் தமிழ் உரைநடைக்கு இயல்பானது.
- source_word: לִסְפֹּד לְשָׂרָה
  choice: சாராளுக்காகப் புலம்பவும்
  rationale: ספד என்பது இறந்தவருக்காகத் துக்கம் அனுசரித்துப் புலம்புவதைக் குறிக்கிறது. ‘புலம்ப’ அதன் வெளிப்படையான துக்கச் செயலைத் தக்கவைக்கிறது; לְשָׂרָה ‘சாராளுக்காக’ என இயல்பாகத் தரப்படுகிறது.
- source_word: וְלִבְכֹּתָהּ
  choice: அவளுக்காக அழவும்
  rationale: בכה என்பது அழுதல் அல்லது கண்ணீர் விடுதலைக் குறிக்கிறது. பெண்பால் ஒருமை பின்னொட்டு ‘அவளுக்காக’ என்று வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
