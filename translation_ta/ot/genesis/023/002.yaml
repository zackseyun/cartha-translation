translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் நிகழ்வின் துக்கமிக்க கண்ணியத்தைத் தக்கவைக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்புகளுக்கு ஏற்ப வழங்கப்பட்டுள்ளன; எபிரெய வாக்கியத்தின் இரு வேறுபட்ட துக்கச் செயல்களான புலம்புதலும் அழுதலும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன.
