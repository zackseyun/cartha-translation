  rationale: אמר என்பதன் infinitive construct நேரடிப் பேச்சை அறிமுகப்படுத்துகிறது. ‘பதிலளித்து ... சொன்னார்கள்’ என்பது எபிரெய உரையமைப்பைக் காத்து இயல்பான தமிழை அளிக்கிறது.
