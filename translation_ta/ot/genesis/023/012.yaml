lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: தலைவணங்கினார்
  rationale: இந்த வினைச்சொல் மரியாதையையும் பணிவையும் காட்டும் உடல் அசைவாகக் குனிந்து வணங்குவதைக் குறிக்கிறது. இங்கு ஏத்தியரோடு நடைபெறும் சமூகப் பேச்சுவார்த்தைச் சூழலில், தெய்வ வழிபாடு என்ற தவறான பொருளைத் தவிர்த்து மரியாதைச் செய்கையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: ‘ஒருவருக்கு முன்பாக’ அல்லது ‘ஒருவரின் முன்னிலையில்’ என்ற உறவுநிலைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: עַם
  choice: மக்கள்
  rationale: பரிவர்த்தனைக்கு சாட்சியாகவும் பேச்சுவார்த்தையில் ஒரு சமூகக் குழுவாகவும் இருக்கும் உள்ளூர் மக்களைக் குறிக்கிறது.
- source_word: הָאָרֶץ
  choice: அந்த நாட்டின்
  rationale: עַם הָאָרֶץ என்ற தொடரில் உள்ளூர் நிலப்பகுதியின் குடிமக்களைக் குறிக்கிறது; தமிழில் ‘அந்த நாட்டின் மக்கள்’ என்பது இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: וַ
  choice: அப்போது
  rationale: வாவ் இணைந்த wayyiqtol வடிவம் கதை நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; ‘அப்போது’ நிகழ்வின் தொடர்ச்சியை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: אַבְרָהָם
  choice: ஆபிரகாம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் மரபான பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
