source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵן֩ קָבַ֨ר אַבְרָהָ֜ם אֶת שָׂרָ֣ה אִשְׁתּ֗/וֹ אֶל מְעָרַ֞ת שְׂדֵ֧ה הַ/מַּכְפֵּלָ֛ה עַל פְּנֵ֥י מַמְרֵ֖א הִ֣וא חֶבְר֑וֹן בְּ/אֶ֖רֶץ כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/019.yaml
  text: After this[a], Abraham buried Sarah his wife in the cave of the field of Machpelah, facing Mamre (that is, Hebron), in the land of Canaan.
translation:
  language: ta
  text: இதற்குப் பின்பு, ஆபிரகாம் தன் மனைவியான சாராளை, கானான் நாட்டில் மம்ரேக்கு எதிரே[a]—அதாவது எபிரோன்—இருந்த மக்பேலா வயலின் குகையில் அடக்கம் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மம்ரேக்கு முன்பாக.” எபிரெயச் சொற்றொடர் மம்ரேக்கு முன்பாக அல்லது எதிரே இருந்த ஓர் இடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: இதற்குப் பின்பு
  rationale: இது நிகழ்வுகளின் காலவரிசையை இயல்பான நவீன தமிழில் காட்டுகிறது; எபிரெயச் சொற்றொடரில் இல்லாத கூடுதல் குறிப்பைச் சேர்ப்பதில்லை.
- source_word: קָבַר
  choice: அடக்கம் செய்தார்
  rationale: ‘புதைத்தார்’ என்பதைக் காட்டிலும் மனித உடலை மரியாதையுடன் அடக்கம் செய்வதைக் குறிக்க நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: אֶת שָׂרָה אִשְׁתּוֹ
  choice: தன் மனைவி சாராளை
  rationale: உறவையும் பெயரையும் தெளிவாகத் தெரிவிக்கும் இயல்பான தமிழ் சொல்வரிசை.
- source_word: אֶל מְעָרַת
  choice: குகையில்
  rationale: முன்னிடைச்சொல் சொற்படி ‘குகைக்குள்’ என இருக்கக்கூடும்; ஆனால் அடக்கம் செய்த செயலை இடத்துடன் இணைக்கத் தமிழில் ‘குகையில்’ இயல்பானது.
- source_word: מְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: மக்பேலா வயலின் குகை
  rationale: குகைக்கும் வயலுக்கும் இடையிலான எபிரெயக் கட்டமைப்பு உறவை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: மம்ரேக்கு எதிரே
  rationale: மம்ரேக்கு முன்பாக அல்லது அதை நோக்கிய எதிர்ப்புறத்தில் இருந்த இடத்தொடர்பைத் திசையை மிகத் துல்லியமாக நிர்ணயிக்காமல் தெரிவிக்கிறது.
- source_word: הִוא חֶבְרוֹן
  choice: அதாவது, எபிரோனில்
  rationale: மம்ரே இருந்த இடத்தை எபிரோன் என அடையாளப்படுத்தும் விளக்கத்தைத் தமிழில் தெளிவாக வழங்குகிறது; வாக்கியத்தில் இடப்பொருத்தத்திற்காக வேற்றுமை உருபு சேர்க்கப்பட்டுள்ளது.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: கானான் நாட்டிலுள்ள
  rationale: எபிரெயில் வெளிப்படையாக உள்ள ‘கானான் நாடு’ என்ற புவியியல் குறிப்பைப் பாதுகாத்து, தமிழில் குகையுடன் இயல்பாக இணைக்கிறது.
