    issue: “அதாவது, எபிரோனில்” adds a locative case to the Hebrew identification הִוא חֶבְרוֹן.
    rationale: The Hebrew identifies the referenced locality as Hebron; it does not say “in Hebron” at this point. Retaining “அதாவது எபிரோன்” preserves the apposition and avoids obscuring what is being identified.
