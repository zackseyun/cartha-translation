revisions:
- from: இதற்குப் பின்பு, ஆபிரகாம் தன் மனைவி சாராளைக் கானான் நாட்டிலுள்ள மக்பேலா வயலின் குகையில், மம்ரேக்கு எதிரே[a]—அதாவது, எபிரோனில்—அடக்கம் செய்தார்.
