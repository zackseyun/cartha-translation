translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்புகளின்படி தரப்பட்டுள்ளன. மூலத்தின் இடவியல் தெளிவின்மையைப் பாதுகாக்க அடிக்குறிப்பு குறி அதற்குரிய ‘மம்ரேக்கு எதிரே’ என்ற தொடரோடு இணைக்கப்பட்டுள்ளது.
