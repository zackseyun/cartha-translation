  text: אֲדֹנִ֣/י שְׁמָעֵ֔/נִי אֶרֶץ֩ אַרְבַּ֨ע מֵאֹ֧ת שֶֽׁקֶל כֶּ֛סֶף בֵּינִ֥/י וּ/בֵֽינְ/ךָ֖ מַה הִ֑וא וְ/אֶת מֵתְ/ךָ֖ קְבֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/015.yaml
  text: 'My lord[a], listen to me: a piece of land worth four hundred shekels of silver—what is that between me and you? Bury your dead.'
translation:
  language: ta
  text: '“ஐயா, நான் சொல்வதைக் கேளுங்கள்: நானூறு சேக்கல் வெள்ளி மதிப்புள்ள ஒரு நிலத்துண்டு[a]—எனக்கும் உங்களுக்கும் இடையில் அது என்ன? உங்கள் இறந்தவரை அடக்கம் செய்யுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “நிலம்—நானூறு சேக்கல் வெள்ளி—எனக்கும் உங்களுக்கும் இடையில் அது என்ன?” எனலாம். எபிரெய மொழிநடை இங்கு சில சொற்களைத் தவிர்த்துச் சுருக்கமாக அமைந்து, பேச்சுவார்த்தையில் விலையைப் பெரிதல்ல எனக் காட்டுகிறது.
    reason: மூலத்தின் நீக்கவடிவையும் மாற்று நேரடி மொழிபெயர்ப்பையும் விளக்குகிறது.
lexical_decisions:
- source_word: אֲדֹנִי
  choice: ஐயா
  rationale: எப்ரோனை மரியாதையுடன் அழைக்கும் சொல்; இது இறைப்பட்டம் அல்ல. நவீன தமிழில் சமூக மரியாதையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁמָעֵנִי
  choice: நான் சொல்வதைக் கேளுங்கள்
  rationale: வேண்டுகோள் தொனியிலுள்ள கட்டளை. ‘எனக்குச் செவிகொடுங்கள்’ என்பதைக் காட்டிலும் பொதுவான நவீன தமிழில் இயல்பானது.
- source_word: אֶרֶץ
  choice: ஒரு நிலத்துண்டு
  rationale: பொதுவாக நிலத்தைக் குறிக்காமல், பேச்சுவார்த்தையில் உள்ள குறிப்பிட்ட நிலப்பகுதியைக் குறிக்கிறது.
- source_word: אַרְבַּע מֵאֹת שֶׁקֶל כֶּסֶף
  choice: நானூறு சேக்கல் வெள்ளி மதிப்புள்ள
  rationale: எபிரெய வாக்கியம் சுருக்கமான நீக்கவடிவில் விலையை அல்லது மதிப்பைச் சுட்டுகிறது; ‘மதிப்புள்ள’ என்பது புதிய தகவல் சேர்க்காமல் தமிழில் உறவைத் தெளிவாக்குகிறது.
- source_word: בֵּינִי וּבֵינְךָ
  choice: எனக்கும் உங்களுக்கும் இடையில்
  rationale: முதல் நபர் மற்றும் இரண்டாம் நபர் ஒருமையை வெளிப்படையாக வைத்திருந்து, தனிப்பட்ட பேச்சுவார்த்தைத் தொனியைப் பாதுகாக்கிறது.
- source_word: מַה הִוא
  choice: அது என்ன?
  rationale: தொகையை இருவருக்கிடையில் அற்பமானதாகக் காட்டும் சொல்லாட்சிக் கேள்வியின் சுருக்கத்தையும் திறந்த தன்மையையும் பாதுகாக்கிறது.
- source_word: וְאֶת מֵתְךָ קְבֹר
  choice: உங்கள் இறந்தவரை அடக்கம் செய்யுங்கள்
  rationale: இறந்த நபரைக் குறிக்கும் ஒருமையைப் பேணி, இறுதி கட்டளையை நேரடியாக வழங்குகிறது. தொடக்க வாவுக்கு இங்கு தனியான இணைப்புச் சொல் சேர்க்காமல் இருப்பது தமிழில் இயல்பாகவும் மூலத்தின் நேரடித்தன்மைக்கு நெருக்கமாகவும் உள்ளது.
