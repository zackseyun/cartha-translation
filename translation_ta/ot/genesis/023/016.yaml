base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/016.yaml
  text: 'So Abraham listened to Ephron[a], and Abraham weighed out for Ephron the silver that he had spoken in the hearing of the sons of Heth: four hundred shekels of silver[b], current with the merchant.'
translation:
  language: ta
  text: அப்போது ஆபிரகாம் எப்ரோனின் சொல்லுக்குச் செவிகொடுத்தான். ஏத்தின் மக்கள்[a] கேட்டுக்கொண்டிருக்கையில் எப்ரோன் கூறிய நானூறு சேக்கல் வெள்ளியை—வணிகத்தில் செல்லுபடியாக இருந்த வெள்ளியை[b]—ஆபிரகாம் எப்ரோனுக்கு எடைபோட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏத்தியர்’; சொல்லர்த்தமாக, ‘ஏத்தின் மகன்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வணிகர் ஏற்றுக்கொள்ளும் வெள்ளி’ அல்லது ‘வணிகரின் தரமான எடையின்படி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אַבְרָהָם אֶל עֶפְרוֹן
  choice: ஆபிரகாம் எப்ரோனின் சொல்லுக்குச் செவிகொடுத்தான்
  rationale: שׁמע אל என்பது ஒருவருக்குச் செவிகொடுத்து அவர் சொன்னதை ஏற்றுக்கொள்வதைக் குறிக்கும் மரபுத்தொடர். விலையை ஒப்புக்கொண்டார் என்று வினையை மிகுதியாக விளக்காமல், பரிவர்த்தனைச் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּשְׁקֹל
  choice: நிறுத்துக் கொடுத்தான்
  rationale: שׁקל என்பது நாணயங்கள் உருவாவதற்கு முந்தைய சூழலில் பணமாகப் பயன்படுத்தப்பட்ட உலோகத்தை எடைபோடுவதைக் குறிக்கிறது. ‘நிறுத்துக் கொடுத்தான்’ என்பது எடைபோட்டதையும் அதைச் செலுத்தியதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַכֶּסֶף
  choice: வெள்ளி
  rationale: כֶּסֶף இங்கு பணமாகப் பயன்படுத்தப்பட்ட வெள்ளி உலோகத்தையே குறிக்கிறது; பொதுவான ‘பணம்’ என்பதைவிட வரலாற்றுச் சூழலைத் துல்லியமாகக் காக்கிறது.
- source_word: אֲשֶׁר דִּבֶּר
  choice: கூறிய
  rationale: דבר என்பதன் நேரடிப் பொருள் ‘பேசுதல்/கூறுதல்.’ சூழலில் எப்ரோன் கூறிய வெள்ளியின் அளவைக் குறிக்கும் வகையில், கூடுதல் விளக்கமின்றி ‘கூறிய’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּאָזְנֵי בְנֵי חֵת
  choice: ஏத்தின் மக்கள் கேட்கும்படி
  rationale: ‘ஏத்தின் மக்களின் செவிகளில்’ என்ற எபிரேய உருவகத்தை இயல்பான தமிழில் வழங்கி, விலை பொதுவாகச் சாட்சிகள் முன்னிலையில் கூறப்பட்டதையும் காக்கிறது.
- source_word: בְנֵי חֵת
  choice: ஏத்தின் மக்கள்
  rationale: சொல்லாட்சியின் நேரடிப் பொருள் ‘ஏத்தின் மகன்கள்.’ தமிழில் இனவழிச் சமூகத்தைக் குறிக்க இயல்பான ‘மக்கள்’ பயன்படுத்தப்பட்டு, ‘ஏத்தியர்’ என்ற இனப்பெயர் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אַרְבַּע מֵאוֹת שֶׁקֶל כֶּסֶף
  choice: வெள்ளி நானூறு சேக்கல்
  rationale: பண்டைய எடை அலகான ‘சேக்கல்’ ஒலிபெயர்க்கப்பட்டு, வெள்ளியின் பொருளும் அளவும் தெளிவாகக் காக்கப்பட்டுள்ளன.
- source_word: עֹבֵר לַסֹּחֵר
  choice: வணிகரிடம் செல்லுபடியாகும்
  rationale: இம்மரபுத்தொடர் வணிகத்தில் ஏற்றுக்கொள்ளப்பட்ட அல்லது வணிகரின் தரநிலைக்கு ஏற்ப இருந்த வெள்ளியைக் குறிக்கலாம். முதன்மை உரை அதன் ‘செல்லுபடியாகும்’ பொருளைத் தக்கவைக்கிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
