base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/004.yaml
  text: I am a foreigner and a sojourner among you[a]. Give me a burial site among you[b], so that I may bury my dead out of my sight.
translation:
  language: ta
  text: “நான் உங்களிடையே அந்நியனும் குடியிருப்பவனுமாக இருக்கிறேன். உங்களிடையே அடக்க நிலம்[a] ஒன்றை எனக்கு உரிமையாகக் கொடுங்கள்; அப்போது என் மறைந்தவரை என் கண்முன்னிலிருந்து[b] அகற்றி அடக்கம் செய்வேன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடக்க நிலம்’ என்பதற்கான எபிரெயத் தொடர், கல்லறை தோண்டுவதற்கான ஓர் இடத்தை மட்டுமல்லாமல், உடைமையாக அல்லது உரிமையாகக் கொண்ட நிலத்தையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘என் முன்னிலிருந்து.’
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר
  choice: அந்நியன்
  rationale: தன் சொந்த இனத்தாரின் நிலத்துக்கு வெளியே, முழுமையான நில உரிமையில்லாமல் வாழ்பவரைக் குறிக்கிறது. ‘அந்நியன்’ என்பது ஆபிரகாமின் வெளியாளர் நிலையைக் கண்ணியமான நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְתוֹשָׁב
  choice: தங்கியிருப்பவன்
  rationale: அந்த இடத்தில் வசித்தாலும் சொந்த நில உரிமையோ பூர்வீகக் குடிமகன் நிலையோ இல்லாதவரைச் சுட்டுகிறது. ‘தங்கியிருப்பவன்’ என்பது גֵּר உடனான இணைப்பையும் குடியிருப்பின் நிலையையும் தேவையின்றி ‘தற்காலிகம்’ என்று மிகைப்படுத்தாமல் காக்கிறது.
- source_word: עִמָּכֶם
  choice: உங்களிடையே
  rationale: சொல்லுக்கு சொல் ‘உங்களுடன்’ எனலாம்; இச்சமூகச் சூழலில் அவர்களிடையே வசிப்பதையும் அவர்களுடைய பகுதியில் நிலம் கோருவதையும் ‘உங்களிடையே’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: תְּנוּ לִי
  choice: எனக்குக் கொடுங்கள்
  rationale: נתן என்ற வினையின் கட்டளை வடிவை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲחֻזַּת קֶבֶר
  choice: அடக்க நிலம் ஒன்றை எனக்கு உரிமையாக
  rationale: אֲחֻזָּה வெறும் கல்லறை இடத்தை மட்டுமல்லாமல் நில உடைமை அல்லது உரிமையையும் குறிக்கலாம். இயல்பான தமிழுக்காக பெயர்ச்சொல் தொடரை வினையடை அமைப்பாக மாற்றி, இவ்வதிகாரத்தில் முக்கியமான சொத்துரிமை நுட்பம் காக்கப்பட்டுள்ளது.
- source_word: וְאֶקְבְּרָה
  choice: அப்போது ... அடக்கம் செய்வேன்
  rationale: கோரிக்கையைத் தொடர்ந்து வரும் cohortative நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவை வெளிப்படுத்துகிறது. ‘அப்போது’ அந்தத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: מֵתִי
  choice: என் இறந்தவர்
  rationale: எபிரெயச் சொல் முதலாம் நபர் பின்னொட்டுடன் இறந்த குடும்ப உறுப்பினரைக் குறிக்கிறது. சாராள் என்று பெயரிட்டு மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்காமல், ஒருமையையும் உறவையும் காக்கிறது.
- source_word: מִלְּפָנַי
  choice: என் கண்முன்னிருந்து அகற்றி
  rationale: சொல்லுக்கு சொல் ‘என் முன்னிலிருந்து’ என்பதாகும். உடலைத் தன் முன்னிலையிலிருந்து அகற்றி அடக்கம் செய்வதே சூழலின் பொருள்; ‘கண்முன்னிருந்து அகற்றி’ மூல உருவகத்தையும் இயல்பான தமிழ் பொருளையும் இணைக்கிறது.
