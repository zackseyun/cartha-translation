translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரதேசி’, ‘சஞ்சாரி’ போன்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன. இரு அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்றொடர்களின் பின்னர் முதன்மை உரையில் இடம்பெற்றுள்ளன.
