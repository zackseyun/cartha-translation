translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான சட்டப் பரிமாற்ற நடையைப் பயன்படுத்துகிறது. இவ்வசனம் முந்தைய வசனத்தின் தொடராக இருப்பதால், மூலத்தில் இல்லாத வினைச்சொல் சேர்க்காமல் வாக்கியத் துணுக்கு வடிவம் பாதுகாக்கப்பட்டுள்ளது. [a] குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
