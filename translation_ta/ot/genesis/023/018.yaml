  text: לְ/אַבְרָהָ֥ם לְ/מִקְנָ֖ה לְ/עֵינֵ֣י בְנֵי חֵ֑ת בְּ/כֹ֖ל בָּאֵ֥י שַֽׁעַר עִירֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/018.yaml
  text: to Abraham as a possession before the eyes of the sons of Heth[a], before all who entered the gate of his city.
translation:
  language: ta
  text: ஆபிரகாமுக்கு உடைமையாக, ஏத்தின் மகன்களின்[a] கண்களுக்கு முன்பாகவும், அவனுடைய நகரவாசலுக்கு வந்த அனைவரின் முன்னிலையிலும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏத்தியர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַבְרָהָם
  choice: ஆபிரகாமுக்கு
  rationale: உரிமை மாற்றத்தின் பெறுநரை לְ முன்னொட்டு குறிக்கிறது; தமிழில் ‘ஆபிரகாமுக்கு’ என்பது அந்தச் சட்டப் பரிமாற்ற உறவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: לְמִקְנָה
  choice: உடைமையாக
  rationale: מִקְנָה என்பது வாங்கிப் பெறப்பட்ட சொத்து அல்லது உடைமையைக் குறிக்கிறது; இங்கு வாங்கும் செயலையல்ல, அதன் விளைவான உரிமை நிலையையே ‘உடைமையாக’ தெரிவிக்கிறது.
- source_word: לְעֵינֵי
  choice: கண்களுக்கு முன்பாக
  rationale: பொதுமக்கள் காணும் விதத்திலும் சட்டச் சாட்சிகளின் முன்னிலையிலும் நிகழ்ந்ததைச் சுட்டும் எபிரெய உருவகத்தை முடிந்தவரை பாதுகாக்கிறது.
- source_word: בְנֵי חֵת
  choice: ஏத்தின் மகன்கள்
  rationale: சொற்றொடரின் நேரடிப் பொருளான குடும்ப/இன அடையாளத்தைப் பாதுகாக்கிறது; சூழலுக்கேற்ற ‘ஏத்தியர்கள்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּכֹל בָּאֵי
  choice: வந்த அனைவருக்கும் முன்பாக
  rationale: நகரவாசலில் கூடியிருந்த முழுச் சாட்சிக் குழுவின் முன்னிலையில் உரிமை மாற்றம் நடந்தது என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שַׁעַר עִירוֹ
  choice: அவனுடைய நகரத்தின் வாசல்
  rationale: மூலத்தின் உரிமைச் சுட்டையும் நகரவாசல் என்ற பொது மற்றும் சட்ட நடவடிக்கைகளுக்குரிய இடத்தையும் பாதுகாக்கிறது; ‘அவன்’ யாரைக் குறிக்கிறது என்ற மூலத்தின் மறைமுகத்தன்மையும் தீர்க்கப்படவில்லை.
