- from: ஆபிரகாமுக்கு உடைமையாக, ஏத்தின் மகன்களின்[a] கண்களுக்கு முன்பாகவும், அவனுடைய நகரத்தின் வாசலுக்குள் வந்த அனைவருக்கும் முன்பாகவும்.
  to: ஆபிரகாமுக்கு உடைமையாக, ஏத்தின் மகன்களின்[a] கண்களுக்கு முன்பாகவும், அவனுடைய நகரவாசலுக்கு வந்த அனைவரின் முன்னிலையிலும்.
