  yaml_path: translation/ot/genesis/023/014.yaml
  text: And Ephron answered Abraham, saying to him,
translation:
  language: ta
  text: 'எப்ரோன் ஆபிரகாமுக்குப் பதிலளித்துச் சொன்னான்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: பதிலளித்துச் சொன்னது
  rationale: ענה என்பதன் உரையாடல் பயன்பாடு முந்தைய பேச்சுக்கான பதிலை அறிமுகப்படுத்துகிறது. அடுத்த வசனத்தின் நேரடிக் கூற்றை இயல்பாகத் தொடங்குவதற்காக, לֵאמֹר உடன் இணைத்து இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: עֶפְרוֹן
  choice: எப்ரோன்
  rationale: எபிரேயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் தெளிவாகக் காட்டும் வழக்கமான எழுத்துப்பெயர்ப்பு.
- source_word: אֶת אַבְרָהָם
  choice: ஆபிரகாமுக்கு
  rationale: אֵת நேரடி செயப்படுபொருளைக் குறிக்கிறது; ஆனால் ענה உடன் இங்கு பதில் யாரை நோக்கியது என்பதைத் தமிழ் இயல்பாக நான்காம் வேற்றுமையில் தெரிவிக்கிறது.
- source_word: לֵאמֹר
  choice: சொன்னது
  rationale: பின்வரும் நேரடிப் பேச்சை அறிமுகப்படுத்தும் எபிரேயச் சொல்லமைப்பை, தமிழில் இயல்பான பேச்சு அறிமுகமாக வழங்குகிறது.
- source_word: לוֹ
  choice: ஆபிரகாமுக்கு என்ற வடிவில் உட்படுத்தப்பட்டது
  rationale: இந்தப் பிரதிப்பெயர் ஆபிரகாமையே சுட்டுகிறது. தமிழில் ‘ஆபிரகாமுக்குப் பதிலளித்துச் சொன்னது’ என்பதில் அதன் உறவு இயல்பாக வெளிப்படுவதால், தனியாக ‘அவனுக்கு’ என்று மீண்டும் கூறுவது தேவையற்ற இரட்டிப்பாகும்.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. மூலத்தின் ‘பதிலளித்து, சொல்லும்படி’ என்ற தொடரை சொற்சொல்லாகக் கடினப்படுத்தாமல், அடுத்த வசனத்திலுள்ள நேரடிப் பேச்சைத் தொடங்கும் இயல்பான தமிழ் வாக்கியமாக அமைக்கப்பட்டுள்ளது.
