  yaml_path: translation/ot/genesis/023/017.yaml
  text: So Ephron’s field at Machpelah[a], which was before Mamre—the field, the cave that was in it, and every tree in the field, within all its surrounding border—was confirmed
translation:
  language: ta
  text: இவ்வாறு, மம்ரேக்கு எதிரே மக்பேலாவில் இருந்த எப்ரோனின் வயல்—அந்த வயலும் அதிலிருந்த குகையும், வயலின் முழுச் சுற்றெல்லைக்குள்ளும் இருந்த ஒவ்வொரு மரமும்—உறுதிப்படுத்தப்பட்டது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிலைநாட்டப்பட்டது’ அல்லது ‘உரிமை மாற்றப்பட்டது’ என்றும் மொழிபெயர்க்கலாம்; இங்கு வரும் எபிரெய வினைச்சொல், விற்பனைச் சூழலில் சொத்து சட்டரீதியாக உறுதிசெய்யப்பட்டதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: உறுதிப்படுத்தப்பட்டது
  rationale: விற்பனைச் சூழலில் קום என்பது வெறுமனே ‘எழுந்தது/நின்றது’ என்பதைக் காட்டாமல், சொத்து உரிமை சட்டரீதியாக உறுதிசெய்யப்பட்டதைக் குறிக்கும் மரபுத்தொடராக உள்ளது.
- source_word: שְׂדֵה עֶפְרוֹן
  choice: எப்ரோனின் வயல்
  rationale: எபிரெயச் சார்புநிலைத் தொடர் இயல்பான தமிழில் உடைமைத் தொடர்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: בַּמַּכְפֵּלָה
  choice: மக்பேலாவில்
  rationale: மக்பேலா இடப்பெயராக ஒலிபெயர்க்கப்பட்டு, இருப்பிடத்தைக் குறிக்கும் ‘-இல்’ வேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: לִפְנֵי מַמְרֵא
  choice: மம்ரேக்கு எதிரே
  rationale: לִפְנֵי என்பதன் இடம்சார் ‘முன்பாக/எதிரே’ என்ற பொருளைத் திசையைத் தேவையின்றி நிர்ணயிக்காமல் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: הַשָּׂדֶה וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: அந்த வயலும் அதிலிருந்த குகையும்
  rationale: சொத்தின் கூறுகளைப் பட்டியலிடும் எபிரெயச் சட்டநடை தெளிவாகத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: וְכָל הָעֵץ אֲשֶׁר בַּשָּׂדֶה
  choice: ஒவ்வொரு மரமும்
  rationale: כָל உடன் வரும் ஒருமை கூட்டுப்பெயர், அனைத்தையும் உள்ளடக்கும் சட்டநடைக்கு ஏற்றவாறு பகிர்நிலைப் பொருளில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר בְּכָל גְּבֻלוֹ סָבִיב
  choice: வயலின் எல்லைக்குள் சுற்றிலும் இருந்த
  rationale: சொத்தின் முழுச் சுற்றெல்லைக்குள் இருந்த மரங்கள் அனைத்தும் சேர்க்கப்பட்டன என்ற பரப்பளவுச் சிறப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
