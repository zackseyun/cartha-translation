  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֶל עֶפְר֜וֹן בְּ/אָזְנֵ֤י עַם הָ/אָ֨רֶץ֙ לֵ/אמֹ֔ר אַ֛ךְ אִם אַתָּ֥ה ל֖וּ שְׁמָעֵ֑/נִי נָתַ֜תִּי כֶּ֤סֶף הַ/שָּׂדֶה֙ קַ֣ח מִמֶּ֔/נִּי וְ/אֶקְבְּרָ֥ה אֶת מֵתִ֖/י שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/013.yaml
  text: 'And he spoke to Ephron in the hearing of the people of the land[a], saying, “If only you would hear me: I give the silver for the field; take it from me[b], so that I may bury my dead there.”'
translation:
  language: ta
  text: அவன் அந்நாட்டு மக்கள் கேட்கும்படி எப்ரோனிடம், “தயவுசெய்து நான் சொல்வதைக் கேளும்[a]. வயலுக்கான வெள்ளியை நான் தருகிறேன்[b]; அதை என்னிடமிருந்து பெற்றுக்கொள்ளும். அங்கே என் மறைந்தவரை அடக்கம் செய்யும்படி” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் எனக்குச் செவிகொடுத்தால் நன்றாயிருக்கும்.” இது எபிரெயில் உள்ள பணிவான வேண்டுகோளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், “வயலுக்கான வெள்ளியை நான் கொடுத்துவிட்டேன்.” இங்குள்ள நிறைவுவினை பேரத்தில் முறையான, செயல்நிறைவேற்றும் முன்மொழிவைக் குறிக்கலாம்; “நான் கொடுப்பேன்” என்பதும் சாத்தியம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினான்
  rationale: דבר என்பதன் பேச்சுச் செயலைத் தெளிவாகக் காட்டி, தொடர்ந்து வரும் நேரடிக் கூற்றுடன் இயல்பாக இணைகிறது.
- source_word: בְּאָזְנֵי עַם הָאָרֶץ
  choice: அந்நாட்டு மக்கள் கேட்கும்படி
  rationale: ‘அந்நாட்டு மக்களின் காதுகளில்’ என்ற எபிரெய மொழிமரபைச் சொல்லுக்குச் சொல் மொழிபெயர்க்காமல், உரையாடல் பொதுமக்கள் கேட்கும் முன்னிலையில் நடந்தது என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי
  choice: தயவுசெய்து நான் சொல்வதைக் கேளும்
  rationale: சற்றுத் துண்டுபட்ட எபிரெய சொற்றொடரின் பணிவான, வற்புறுத்திக் கேட்கும் தொனியை நவீன மரியாதைத் தமிழில் வெளிப்படுத்துகிறது; அதன் வடிவநெருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: נָתַתִּי
  choice: நான் தருகிறேன்
  rationale: எபிரெய நிறைவுவினை இப்பேரத்தில் நடைமுறைக்கு வரும் முறையான கொடுப்பனவு முன்மொழிவாகச் செயல்படுகிறது. நிகழ்கால வடிவம் தமிழில் அந்தச் செயல்நிறைவேற்றும் கூற்றை இயல்பாகக் காட்டுகிறது; வடிவநெருக்கமான வாசிப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: כֶּסֶף הַשָּׂדֶה
  choice: வயலுக்கான வெள்ளி
  rationale: כֶּסֶף என்பதன் நேரடிப் பொருளான ‘வெள்ளி’யையும், அது வயலுக்குரிய கொடுப்பனவு என்பதையும் பாதுகாக்கிறது; ‘விலை’ என்று பொருளை அதிகமாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: קַח מִמֶּנִּי
  choice: அதை என்னிடமிருந்து பெற்றுக்கொள்ளும்
  rationale: சூழலில் மறைந்துள்ள செயப்படுபொருள் வெள்ளி என்பதால் ‘அதை’ சேர்க்கப்பட்டுள்ளது. விற்பனைப் பேச்சில் வெறும் ‘எடுத்துக்கொள்ளும்’ என்பதைவிட ‘பெற்றுக்கொள்ளும்’ இயல்பானதும் மரியாதையானதும் ஆகும்.
- source_word: וְאֶקְבְּרָה
  choice: அப்போது … அடக்கம் செய்வேன்
  rationale: கொடுப்பனவை ஏற்றுக்கொள்வதன் நோக்கம் அல்லது விளைவைத் தமிழில் இயல்பாகக் காட்டுகிறது; எபிரெய விருப்பவினையின் முன்னோக்கிய நோக்கம் காக்கப்படுகிறது.
- source_word: מֵתִי
  choice: என்னுடைய இறந்தவரை
  rationale: எபிரெயில் பாலினமோ உறவுமுறையோ இங்கு வெளிப்படையாகக் குறிப்பிடப்படவில்லை. சூழலில் சாராள் குறிக்கப்பட்டாலும், மொழிபெயர்ப்பு மூலத்தின் பொதுவான ‘என் இறந்தவர்’ என்ற சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: שָׁמָּה
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் எளிய வினையடை; தமிழில் நேரடியும் இயல்பானதும் ஆகும்.
