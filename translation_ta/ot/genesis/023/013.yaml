revisions:
- from: அவன் அந்நாட்டு மக்கள் கேட்கும்படி எப்ரோனிடம், “தயவுசெய்து நான் சொல்வதைக் கேளும்[a]. வயலுக்கான வெள்ளியை நான் தருகிறேன்[b]; அதை என்னிடமிருந்து பெற்றுக்கொள்ளும். அப்போது என்னுடைய இறந்தவரை அங்கே அடக்கம் செய்வேன்” என்றான்.
  to: அவன் அந்நாட்டு மக்கள் கேட்கும்படி எப்ரோனிடம், “தயவுசெய்து நான் சொல்வதைக் கேளும்[a]. வயலுக்கான வெள்ளியை நான் தருகிறேன்[b]; அதை என்னிடமிருந்து பெற்றுக்கொள்ளும். அங்கே என் மறைந்தவரை அடக்கம் செய்யும்படி” என்றான்.
