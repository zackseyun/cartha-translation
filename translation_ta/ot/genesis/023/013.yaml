translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதை ஒருமையைச் சுட்டும் ‘நீர்/கேளும்/பெற்றுக்கொள்ளும்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. சட்டப்பூர்வமான பொதுப் பேரத்தின் கண்ணியமான தொனி காக்கப்பட்டாலும், அரிதான அல்லது மிகப் பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
