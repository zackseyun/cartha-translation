revisions:
- from: இஸ்மவேலைக் குறித்தும் உன் வேண்டுதலைக் கேட்டேன். இதோ, நான் அவனை ஆசீர்வதித்திருக்கிறேன்; அவனைப் பலுகிப் பெருகச் செய்வேன்; அவனை மிகவும் மிகுதியாகப் பெருகச் செய்வேன். அவன் பன்னிரண்டு தலைவர்களுக்குத் தந்தையாவான்; அவனை ஒரு பெரிய இனமாக்குவேன்.
  to: இஸ்மவேலைக் குறித்தும், உன்னைக் கேட்டேன். இதோ, நான் அவனை ஆசீர்வதித்தேன்; அவனைப் பலுகச் செய்வேன்; அவனை மிகவும் மிகுதியாகப் பெருகச் செய்வேன். அவன் பன்னிரண்டு தலைவர்களைப் பெறுவான்; அவனை ஒரு பெரிய இனமாக்குவேன்.
  rationale: The revision adheres more closely to the Hebrew and the English POB audit trail by retaining ‘heard you’ without adding an explicit noun, and by rendering Ishmael’s fathering of twelve chiefs with a direct, idiomatic Tamil expression. The perfect ‘I have blessed’ is represented by “ஆசீர்வதித்தேன்,” while the following promises remain future-oriented.
