  text: וּֽ/לְ/יִשְׁמָעֵ֘אל שְׁמַעְתִּי/ךָ֒ הִנֵּ֣ה בֵּרַ֣כְתִּי אֹת֗/וֹ וְ/הִפְרֵיתִ֥י אֹת֛/וֹ וְ/הִרְבֵּיתִ֥י אֹת֖/וֹ בִּ/מְאֹ֣ד מְאֹ֑ד שְׁנֵים עָשָׂ֤ר נְשִׂיאִם֙ יוֹלִ֔יד וּ/נְתַתִּ֖י/ו לְ/ג֥וֹי גָּדֽוֹל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/020.yaml
  text: And as for Ishmael, I have heard you. Look, I have blessed him, and will make him fruitful, and will multiply him exceedingly. He will father twelve princes, and I will make him into a great nation.
translation:
  language: ta
  text: இஸ்மவேலைக் குறித்தும், உன்னைக் கேட்டேன். இதோ, நான் அவனை ஆசீர்வதித்தேன்; அவனைப் பலுகச் செய்வேன்; அவனை மிகவும் மிகுதியாகப் பெருகச் செய்வேன். அவன் பன்னிரண்டு தலைவர்களைப் பெறுவான்; அவனை ஒரு பெரிய இனமாக்குவேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַעְתִּיךָ
  choice: உன் வேண்டுதலைக் கேட்டேன்
  rationale: எழுத்துப்படி ‘உன்னைக் கேட்டேன்’ என்றாலும், முந்தைய வசனத்தில் இஸ்மவேலைப் பற்றி ஆபிரகாம் கூறிய வேண்டுதலை ஏற்றுக்கொண்டதைச் சூழல் குறிக்கிறது; இயல்பான தமிழில் அந்த மறைபொருளைத் தெளிவுபடுத்துகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் குறியீட்டை dignified, வழக்கமான தமிழில் காக்கிறது.
- source_word: הִפְרֵיתִי
  choice: பலுகிப் பெருகச் செய்வேன்
  rationale: פרה என்பதன் சந்ததி பெருக்கம் சார்ந்த பொருளைத் தமிழின் இயல்பான வேதாகமச் சொல்லிணைப்பால் தருகிறது.
- source_word: בִּמְאֹד מְאֹד
  choice: மிகவும் மிகுதியாக
  rationale: இருமுறை வரும் מְאֹד என்பதன் தீவிர வலியுறுத்தலைக் காக்கிறது.
- source_word: נְשִׂיאִם
  choice: தலைவர்கள்
  rationale: נָשִׂיא என்பது குல அல்லது சமூகத் தலைவரைக் குறிக்கலாம்; ‘இளவரசர்கள்’ என்று அரச வம்சப் பொருளை அளவுக்கு மீறி விதிப்பதைத் தவிர்க்கிறது.
- source_word: גּוֹי גָּדוֹל
  choice: ஒரு பெரிய இனம்
  rationale: גּוֹי என்பதன் மக்களினம்/தேசம் சார்ந்த பொருளை இங்கு சந்ததி வாக்குறுதியின் சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இஸ்மவேலுக்கான வாக்குறுதியும் உடன்படிக்கை வரிசையும்
  choice: ஆசீர்வாதம், பெருக்கம், பெரிய இனமாக்குதல் ஆகியவற்றை முழுமையாகக் காக்கிறது
  alternative: இந்த ஆசீர்வாதத்தை ஈசாக்கின் உடன்படிக்கை வாக்குறுதியோடு ஒன்றாக்குதல் அல்லது தாழ்த்திக் காட்டுதல்
  rationale: எபிரெய உரை இஸ்மவேலுக்குக் குறிப்பிடத்தக்க தெய்வீக ஆசீர்வாதத்தைத் தெளிவாக அளிக்கிறது; அதே அதிகாரத்தின் அடுத்த வசனமே உடன்படிக்கையின் தனித்த வரிசையை விளக்குவதால், இவ்வசனத்தில் கூடுதல் விளக்கத்தை இறக்குமதி செய்யக்கூடாது.
- issue: הִנֵּה בֵּרַכְתִּי என்பதன் காலநிலை
  choice: ‘இதோ, நான் அவனை ஆசீர்வதித்திருக்கிறேன்’
  alternative: ‘இதோ, நான் அவனை ஆசீர்வதிப்பேன்’
  rationale: மூலத்தில் ‘ஆசீர்வதித்தேன்’ என்ற நிறைவேற்ற வடிவம் உள்ளது; இது அடுத்துவரும் எதிர்காலச் செயல்களுக்கு உறுதியளிக்கும் அறிவிப்பாகவும் ஒலிக்கிறது. நிறைவேற்றப்பட்ட/உறுதிசெய்யப்பட்ட தன்மையைத் தமிழ் வடிவம் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க வேதாகம நடையுடனும் வடிவமைக்கப்பட்டது. தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டன; மூலத்தின் வலியுறுத்தலும் வாக்குறுதி வரிசையும் காக்கப்பட்டன.
