base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/019.yaml
  text: And God said[a], “No, but Sarah your wife shall bear you a son, and you shall call his name Isaac. And I will establish my covenant with him as an everlasting covenant for his offspring after him.”
translation:
  language: ta
  text: 'கடவுள் சொன்னார்: “இல்லை; உன் மனைவி சாராள்தான் உனக்கு ஒரு மகனைப் பெறுவாள். நீ அவனுக்கு ஈசாக்கு[a] என்று பெயரிடுவாய். நான் அவனுடன் என் உடன்படிக்கையை நிலைநாட்டுவேன்; அது அவனுக்குப் பின் வரும் அவன் சந்ததிக்கான என்றென்றுமுள்ள உடன்படிக்கையாக இருக்கும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஈசாக்கு” என்ற பெயர், “அவன் சிரிக்கிறான்” அல்லது “அவன் சிரிப்பான்” என்று பொருள்படும் எபிரெய வினைச்சொல்லைப் போல ஒலிக்கிறது.
    reason: பெயரில் உள்ள எபிரெயச் சொல்விளையாட்டைத் தமிழில் நேரடியாகக் காட்ட முடியாததால்.
lexical_decisions:
- source_word: אֲבָל
  choice: இல்லை; ... சாராள்தான்
  rationale: முந்தைய வசனத்தில் இஸ்மவேலைக் குறித்து ஆபிரகாம் விடுத்த வேண்டுகோளுக்கு இது திருத்தமான பதில். ‘இல்லை’ மறுப்பையும், ‘தான்’ சாராள்மீது விழும் வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
- source_word: יֹלֶדֶת
  choice: பெறுவாள்
  rationale: இது வடிவில் நிகழ்காலப் பெயரெச்சமாக இருந்தாலும், வாக்குறுதியான எதிர்கால நிகழ்வைக் குறிக்கிறது; தமிழில் எதிர்கால வினை இயல்பாக உள்ளது.
- source_word: וְקָרָאתָ אֶת־שְׁמוֹ
  choice: நீ அவனுக்கு ... என்று பெயரிடுவாய்
  rationale: எபிரெயப் பெயரிடும் சூத்திரத்தையும் எதிர்கால வடிவத்தையும் தெளிவான நவீன தமிழில் காக்கிறது; இதை வெளிப்படையான கட்டளையாக மட்டும் சுருக்கவில்லை.
- source_word: יִצְחָק
  choice: ஈசாக்கு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட பெயர்வடிவம்; பெயரிலுள்ள எபிரெயச் சொல்விளையாட்டு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַהֲקִמֹתִי אֶת־בְּרִיתִי אִתּוֹ
  choice: நான் அவனுடன் என் உடன்படிக்கையை நிலைநாட்டுவேன்
  rationale: உடன்படிக்கையைச் செல்லுபடியாக நிலைபெறச் செய்தல் என்ற பொருளையும், ஈசாக்குடன் உள்ள உறவையும் நேரடியாகக் காட்டுகிறது.
- source_word: לִבְרִית עוֹלָם
  choice: என்றென்றுமுள்ள உடன்படிக்கையாக
  rationale: நீடித்து நிலைக்கும் உடன்படிக்கை என்ற பொருளைக் காக்கிறது; தேவையற்ற தத்துவ நுணுக்கங்களைச் சேர்ப்பதில்லை.
- source_word: לְזַרְעוֹ אַחֲרָיו
  choice: அவனுக்குப் பின் வரும் அவன் சந்ததிக்கான
  rationale: זֶרַע என்பதன் கூட்டொருமைப் பொருளை ‘சந்ததி’ காக்கிறது; அதை இன அல்லது தேசியப் பொருளாக மட்டும் குறுக்கவில்லை.
theological_decisions:
- issue: உடன்படிக்கை வாக்குறுதியின் வரம்பும் தொடர்ச்சியும்
  choice: உடன்படிக்கை ஈசாக்குடன் நிலைநாட்டப்பட்டு, அவனுக்குப் பின் வரும் அவன் சந்ததிக்கும் தொடரும் என வசனம் கூறும் அளவிலேயே மொழிபெயர்க்கப்பட்டது.
  alternative: இதை இன/தேசிய வாக்குறுதியாக மட்டும் குறுக்குதல் அல்லது பிற்கால கிறிஸ்தவ உடன்படிக்கை இறையியலை நேரடியாக இதில் வரையறுத்தல்.
  rationale: எபிரெய உரை ஈசாக்கையும் அவன் சந்ததியையும் தெளிவாகக் குறிப்பிடுகிறது; அதன் இறையியல் வரம்பை மொழிபெயர்ப்பு தானாகக் குறுக்கவோ விரிவாக்கவோ கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘சாராள்தான்’ என்பது திருத்தமும் வலியுறுத்தலும் கொண்ட אֲבָל என்பதன் சூழல்சார் வலிமையை வெளிப்படுத்துகிறது. ‘சந்ததி’ கூட்டொருமையைத் தக்கவைக்கிறது.
