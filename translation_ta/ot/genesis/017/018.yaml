  text: וַ/יֹּ֥אמֶר אַבְרָהָ֖ם אֶל הָֽ/אֱלֹהִ֑ים ל֥וּ יִשְׁמָעֵ֖אל יִחְיֶ֥ה לְ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/018.yaml
  text: And Abraham said to God[a], “Oh, that Ishmael might live before you!”
translation:
  language: ta
  text: ஆபிரகாம் கடவுளிடம், “இஸ்மவேல் உமது முன்னிலையில் வாழ்ந்தால் எவ்வளவு நன்றாயிருக்கும்![a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்மவேல் உமக்கு முன்பாக வாழ்ந்தால் எவ்வளவு நன்றாயிருக்கும்!” அல்லது “இஸ்மவேல் உமது தயவின்கீழ் வாழ்ந்தால் எவ்வளவு நன்றாயிருக்கும்!”
    reason: லְפָנֶיךָ என்பதன் சொற்சார்ந்த பொருள் ‘உமக்கு முன்பாக’; சூழலில் அது கடவுளின் முன்னிலை அல்லது தயவையும் குறிக்கலாம்.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: வாவ் தொடர்ச்சியுடன் வரும் உரையாடல் வினை கதைநிகழ்வை முன்னெடுக்கிறது. தமிழில் மேற்கோளுக்குப் பின் வரும் ‘என்றார்’ இயல்பாகவும் மரியாதைக்குரிய நடையிலும் இதை வெளிப்படுத்துகிறது.
- source_word: אֶל הָאֱלֹהִים
  choice: கடவுளிடம்
  rationale: பேசுதல் வினையுடன் אֶל குறிக்கும் நோக்கை ‘-ிடம்’ இயல்பாக வெளிப்படுத்துகிறது; הָאֱלֹהִים சூழலில் குறிப்பிட்ட ஒரே கடவுளைக் குறிக்கிறது.
- source_word: לוּ
  choice: வாழ்ந்தால் போதுமே
  rationale: இங்கு לוּ நிபந்தனையை அல்ல, ஏக்கமுள்ள விருப்பத்தை அறிமுகப்படுத்துகிறது. ‘-ஆல் போதுமே’ என்பது நவீன தமிழில் அந்த உணர்ச்சிமிக்க விருப்பத்தை இயல்பாகக் காட்டுகிறது.
- source_word: יִשְׁמָעֵאל
  choice: இஸ்மவேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: יִחְיֶה
  choice: வாழ்ந்தால்
  rationale: לוּ உடன் வரும் நிறைவுறா வினைவடிவம் ஆபிரகாமின் விருப்பத்தைக் குறிக்கிறது; தமிழில் விருப்பத் தொடரின் ஒரு பகுதியாக ‘வாழ்ந்தால்’ இயல்பாக அமைகிறது.
- source_word: לְפָנֶיךָ
  choice: உமக்கு முன்பாக
  rationale: ‘உமது முகத்திற்கு முன்/உமது முன்னிலையில்’ என்ற மூல உருவகத்தை நேரடியாகப் பாதுகாக்கிறது; அருள் அல்லது உடன்படிக்கை ஆசீர்வாதம் என்று பொருளை விரிவாக்கவில்லை.
theological_decisions:
- issue: இஸ்மவேல் கடவுளுக்கு முன்பாக வாழ வேண்டும் என்ற ஆபிரகாமின் விருப்பத்தின் நுட்பம்
  choice: உமக்கு முன்பாக
  alternative: உமது முன்னிலையில்; உமது தயவின்கீழ்
  rationale: எபிரெயச் சொற்றொடர் கடவுளின் முன்னிலையையும் தயவையும் மறைமுகமாக உணர்த்தக்கூடும். ஆனால் இங்கு அந்த வாழ்வின் உடன்படிக்கை சார்ந்த உள்ளடக்கம் வெளிப்படையாக வரையறுக்கப்படவில்லை. ஆகவே இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் சுருக்கமான மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய ஒருமை மரியாதைக்கு ‘உமக்கு’ பயன்படுத்தப்பட்டுள்ளது. ‘வாழ்ந்தால் போதுமே’ என்பது לוּ-வின் ஏக்க விருப்பத்தை இயல்பான தமிழில் தருகிறது; அடிக்குறிப்பு לְפָנֶיךָ என்பதன் பொருள் பரப்பைக் காட்டுகிறது.
