base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/015.yaml
  text: Then God said to Abraham[a], “As for Sarai your wife, you shall not call her name Sarai, for Sarah is her name.”
translation:
  language: ta
  text: பின்பு கடவுள் ஆபிரகாமிடம், “உன் மனைவி சாராயைப் பொறுத்தவரை, அவளுடைய பெயரைச் சாராய் என்று நீ அழைக்கக் கூடாது; சாரா என்பதே அவளுடைய பெயர்.[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் இயல்பாக, “இனி அவளைச் சாராய் என்று அழைக்காதே; அவளுடைய பெயர் சாரா” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: வாவ் தொடர்வினை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; ‘பின்பு’ அதன் தொடர்ச்சியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இச்சூழலில் ஒருமையாகக் குறிக்கப்படும் இஸ்ரவேலின் கடவுளுக்கான இயல்பான பொதுத் தமிழ் சொல்.
- source_word: אֶל־אַבְרָהָם
  choice: ஆபிரகாமிடம்
  rationale: பேச்சு யாரை நோக்கி உரைக்கப்படுகிறது என்பதை இயல்பான தமிழ் வேற்றுமை வடிவில் தெரிவிக்கிறது.
- source_word: שָׂרַי אִשְׁתְּךָ
  choice: உன் மனைவி சாராய்
  rationale: சாராயை ஆபிரகாமின் மனைவியாக அடையாளப்படுத்தும் எபிரெயச் சொற்றொடரை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: לֹא תִקְרָא
  choice: நீ அழைக்கக் கூடாது
  rationale: இறை உரையில் வரும் தடை அல்லது கட்டளையின் வலிமையை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: אֶת־שְׁמָהּ
  choice: அவளுடைய பெயரை
  rationale: பெயரிடுதலை மையப்படுத்தும் எபிரெயச் சொற்றொடரையும் ‘பெயர்’ என்ற சொல்லின் மீளுரைப்பையும் காக்கிறது.
- source_word: כִּי
  choice: ;
  rationale: இங்கு அடுத்த பெயர் அறிவிப்பு முந்தைய தடைக்கான விளக்கமாக வருகிறது; தமிழில் அரைப்புள்ளியால் அந்த நெருங்கிய விளக்கத் தொடர்பு இயல்பாக வெளிப்படுகிறது.
- source_word: שָׂרָה שְׁמָהּ
  choice: சாரா என்பதே அவளுடைய பெயர்
  rationale: வினைச்சொல் இல்லாத எபிரெயப் பெயர் அறிவிப்பையும் ‘சாரா’ என்பதிலுள்ள வலியுறுத்தலையும் காக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத எதிர்கால வினையைச் சேர்க்கவில்லை.
theological_decisions:
- issue: பெயர் மாற்ற அறிவிப்பின் காலமும் வலியுறுத்தலும்
  choice: ‘அவளுடைய பெயரைச் சாராய் என்று நீ அழைக்கக் கூடாது; சாரா என்பதே அவளுடைய பெயர்’ என்ற நேரடி அறிவிப்பு
  alternative: ‘இனி அவளைச் சாராய் என்று அழைக்காதே; அவளுடைய பெயர் சாரா’
  rationale: மூல எபிரெயம் தடையையும் புதிய பெயரின் அறிவிப்பையும் முறையான பெயரிடும் வடிவில் தருகிறது. முதன்மை மொழிபெயர்ப்பு ‘இனி’ என்ற மூலத்தில் வெளிப்படையாக இல்லாத சொல்லையோ வெளிப்படையான எதிர்கால வினையையோ சேர்க்காமல் அந்த இறுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சாராய்’ மற்றும் ‘சாரா’ என்ற இரு வேறு பெயர் வடிவங்களும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன; முறையான பெயரிடும் அறிவிப்பின் தொனியும் காக்கப்பட்டுள்ளது.
