base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/007.yaml
  text: And I will establish my covenant between me and you and your offspring after you throughout their generations as an everlasting covenant[b][a], to be God to you and to your offspring after you.
translation:
  language: ta
  text: எனக்கும் உனக்கும், உனக்குப் பின்வரும் உன் சந்ததிக்கும்[a] இடையே, அவர்களுடைய தலைமுறைகள்தோறும் என் உடன்படிக்கையை என்றென்றும் நிலைக்கும் உடன்படிக்கையாக நிலைநாட்டுவேன்; உனக்குக் கடவுளாகவும்[b], உனக்குப் பின்வரும் உன் சந்ததிக்குக் கடவுளாகவும் இருப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சந்ததி’ என்பது ஒருமை வடிவிலுள்ள எபிரெயக் கூட்டுப்பெயரை மொழிபெயர்க்கிறது; இதை ‘விதை’ அல்லது ‘சந்ததியினர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இதனை இயல்பான தமிழில் ‘உன் கடவுளாக’ என்றும் சொல்லலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: நிலைநாட்டுவேன்
  rationale: הקים என்பதன் உடன்படிக்கைச் சூழலிலான ‘நிறுவுதல்/உறுதிப்படுத்துதல்’ பொருளை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது; வெறும் பராமரிப்பை மட்டும் குறிக்காது.
- source_word: בְּרִיתִי
  choice: என் உடன்படிக்கையை
  rationale: בְּרִית என்பதற்கான தெளிவான நவீனத் தமிழ் இணை; முதல் நபர் உரிமையும் நேரடியாகப் பாதுகாக்கப்படுகிறது.
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין
  choice: எனக்கும் உனக்கும் ... இடையே
  rationale: எபிரெயச் சொல்லமைப்பில் மீண்டும் வரும் ‘இடையே’ என்ற உறவுக் கட்டமைப்பை இயல்பான தமிழ் தொடராக மாற்றி, உடன்படிக்கையின் தரப்புகளைத் தெளிவாக வைத்திருக்கிறது.
- source_word: זַרְעֲךָ
  choice: உன் சந்ததி
  rationale: זֶרַע என்பது ஒருமை வடிவிலுள்ள கூட்டுப்பெயர். ‘சந்ததி’ அதன் கூட்டு இயல்பையும் ஒருமை வடிவையும் தமிழில் ஓரளவு பாதுகாக்கிறது; ‘விதை’ என்பது இச்சூழலில் இயல்பற்றதாக இருக்கும்.
- source_word: אַחֲרֶיךָ
  choice: உனக்குப் பின்வரும்
  rationale: காலத்திலும் வம்சத் தொடரிலும் பின்னர் வருவோரைக் குறிக்கும் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: לְדֹרֹתָם
  choice: அவர்களுடைய தலைமுறைகள்தோறும்
  rationale: தொடர்ச்சியாக வரும் ஒவ்வொரு தலைமுறையிலும் உடன்படிக்கை நீடிப்பதை வெளிப்படுத்துகிறது; பன்மை உரிமைச் சுட்டும் பாதுகாக்கப்படுகிறது.
- source_word: לִבְרִית עוֹלָם
  choice: என்றென்றும் நிலைக்கும் உடன்படிக்கையாக
  rationale: עוֹלָם என்பதன் நீடித்த, முடிவற்ற காலப் பொருளை எளிதில் புரியும் தமிழில் வழங்குகிறது; לְ என்பதன் பயனிலைத் தொடர்பும் ‘உடன்படிக்கையாக’ என்பதில் வெளிப்படுகிறது.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: உனக்குக் கடவுளாக ... இருப்பேன்
  rationale: ‘உனக்கு கடவுளாக இருத்தல்’ என்ற எபிரெய உடன்படிக்கைச் சூத்திரத்தின் உறவுசார் வடிவை நெருக்கமாகப் பாதுகாக்கிறது; இயல்பான ‘உன் கடவுளாக’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: உனக்குப் பின்வரும் உன் சந்ததிக்குக் கடவுளாகவும்
  rationale: முந்தைய זֶרַע மொழிபெயர்ப்புடன் ஒருமைப்பாட்டைப் பேணி, வாக்குறுதி சந்ததிக்கும் உரியது என்பதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ஆபிரகாமின் זֶרַע என்ற கூட்டொருமைப் பெயர்
  choice: உன் சந்ததி
  alternative: உன் விதை / உன் சந்ததியினர்
  rationale: ‘சந்ததி’ என்பது ஒருவரையா பலரையா என்று தேவையின்றி முடிவுசெய்யாமல், மூலத்தின் கூட்டொருமைத் தன்மையையும் அதன் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
- issue: உடன்படிக்கைச் சூத்திரமான לִהְיוֹת לְךָ לֵאלֹהִים
  choice: உனக்குக் கடவுளாக இருப்பேன்
  alternative: உன் கடவுளாக இருப்பேன்
  rationale: மூலத்தின் ‘உனக்குக் கடவுளாக’ என்ற உறவுசார் சொல்லமைப்பை முதன்மைப்படுத்துகிறது; கூடுதல் கோட்பாட்டுப் பொருளைச் சேர்க்காமல் இயல்பான மாற்றை அடிக்குறிப்பில் பதிவு செய்கிறது.
- issue: בְּרִית עוֹלָם என்பதன் கால நீடிப்பு
  choice: என்றென்றும் நிலைக்கும் உடன்படிக்கை
  alternative: நிரந்தர உடன்படிக்கை
  rationale: עוֹלָם என்பதன் நீடித்த தன்மையை உறுதியாகத் தெரிவிக்கிறது; அதன் வரம்பைப் பற்றிய பின்னைய இறையியல் விவாதத்தை மொழிபெயர்ப்பில் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெய வசனத்தின் ஒரே நீண்ட உடன்படிக்கை வாக்கிய ஓட்டம் அரைப்புள்ளியால் பாதுகாக்கப்பட்டுள்ளது. ‘சந்ததி’ மற்றும் ‘உனக்குக் கடவுளாக’ ஆகியவை மூலத்தின் திட்டமிட்ட தெளிவின்மையையும் உறவுசார் மொழியையும் காக்கின்றன.
