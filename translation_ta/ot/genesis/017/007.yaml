  terminology: «உடன்படிக்கை», «சந்ததி», and «கடவுளாக» are consistent and suitable. «சந்ததி» appropriately preserves the collective-singular flexibility of זרע; the supplied lexical footnote usefully records alternatives. The footnote for the covenant formula is also appropriate.
  issues:
