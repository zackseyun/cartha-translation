  text: And Abraham was ninety-nine years old when the flesh of his foreskin was circumcised.
translation:
  language: ta
  text: ஆபிரகாமுடைய நுனித்தோலின் சதை விருத்தசேதனம் செய்யப்பட்டபோது, அவருக்கு தொண்ணூற்றொன்பது வயது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: ஆபிரகாம்
  rationale: ו இங்கு கதைத் தொடர்ச்சியைக் குறிக்கிறது; இயல்பான தமிழ் வாக்கிய அமைப்பில் தனியாக ‘மேலும்’ என்று மொழிபெயர்க்காமல் தொடர்ச்சி வெளிப்படுகிறது.
- source_word: בֶּן תִּשְׁעִים וָתֵשַׁע שָׁנָה
  choice: அவருக்கு தொண்ணூற்றொன்பது வயது
  rationale: ‘தொண்ணூற்றொன்பது ஆண்டுகளின் மகன்’ என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் வயதுக் குறிப்பாக வழங்குகிறது.
- source_word: בְּ/הִמֹּל/וֹ
  choice: விருத்தசேதனம் செய்யப்பட்டபோது
  rationale: בְּ உடன் வரும் வினையெச்சப் பெயர்ச்சொல் வடிவம் காலச் சூழலைக் குறிக்கிறது; எபிரெய வடிவின் செயப்பாட்டு நுணுக்கமும் தமிழில் காக்கப்படுகிறது.
- source_word: בְּשַׂר עָרְלָת/וֹ
  choice: அவரின் நுனித்தோல் சதை
  rationale: ‘அவருடைய நுனித்தோலின் சதை’ என்ற உறுதியான உடற்குறிப்பைத் தெளிவாகவும், தமிழில் மிகுந்த செயற்கைத்தன்மை இல்லாமலும் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘விருத்தசேதனம்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் தக்கவைக்கப்பட்டு, மூலத்தின் உடற்கூறு சார்ந்த குறிப்பும் சுருக்கப்படாமல் காக்கப்பட்டுள்ளது.
