source:
  edition: WLC
  text: וְ/נָתַתִּ֣י לְ֠/ךָ וּ/לְ/זַרְעֲ/ךָ֨ אַחֲרֶ֜י/ךָ אֵ֣ת אֶ֣רֶץ מְגֻרֶ֗י/ךָ אֵ֚ת כָּל אֶ֣רֶץ כְּנַ֔עַן לַ/אֲחֻזַּ֖ת עוֹלָ֑ם וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵ/אלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/008.yaml
  text: And I will give to you and to your offspring after you the land of your sojournings—all the land of Canaan—as an everlasting possession[b][a], and I will be their God.
translation:
  language: ta
  text: நீ அந்நியராக வாழ்ந்துவரும் நாடான கானான் நாடு முழுவதையும் உனக்கும் உனக்குப் பின்வரும் உன் சந்ததிக்கும் நிரந்தர உடைமையாக[a] கொடுப்பேன்; நான் அவர்களுக்குத் தேவனாக இருப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிரந்தர உடைமையாக இருக்கும்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: கொடுப்பேன்
  rationale: உடன்படிக்கை வாக்குறுதியின் சூழலில், இணைப்புடன் வரும் எபிரெய நிறைவுவினை எதிர்கால வாக்குறுதியைக் குறிக்கிறது.
- source_word: לְךָ וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: உனக்கும் உனக்குப் பின் வரும் உன் சந்ததிக்கும்
  rationale: זֶרַע என்பது கூட்டுப்பொருள் கொண்ட பெயர்ச்சொல்; ‘சந்ததி’ அந்தப் பொருளையும் தலைமுறைத் தொடர்ச்சியையும் இயல்பாகத் தருகிறது.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: நீ அந்நியனாகத் தங்கியிருக்கும் நாடு
  rationale: מְגוּרִים என்பது சொந்த நாட்டவராக அல்லாமல் அந்நியக் குடியிருப்பாளராகத் தங்கும் நிலையைச் சுட்டுகிறது; இந்த மொழிபெயர்ப்பு அதனைத் தெளிவாகக் காக்கிறது.
- source_word: אֵת כָּל אֶרֶץ כְּנַעַן
  choice: கானான் நாடு முழுவதையும்
  rationale: כָּל என்பதன் முழுமையையும், முன் வந்த நிலப்பகுதியை ‘கானான் நாடு’ என விளக்கும் appositional அமைப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: לַאֲחֻזַּת עוֹלָם
  choice: என்றென்றும் உரிமைச் சொத்தாக
  rationale: אֲחֻזָּה நிலையான உடைமை அல்லது நிலச்சொத்தைக் குறிக்கிறது; עוֹלָם நீடித்த உடன்படிக்கைத் தன்மையைத் தருகிறது. காலநீட்சி சொத்திற்கா அல்லது உடைமையாயிருப்பதற்கா இணைகிறது என்ற இலக்கண நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  choice: நான் அவர்களுக்கு இறைவனாக இருப்பேன்
  rationale: இது வழக்கமான உடன்படிக்கை உறவுச் சூத்திரம்; இறைவனில் இயல்புமாற்றம் நிகழ்வதாகக் கூறாமல் உறவைத் துல்லியமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூத்திரத்தைப் பிற்காலக் கோட்பாட்டு நுணுக்கங்கள் இன்றி மொழிபெயர்த்தல்
  choice: நான் அவர்களுக்கு இறைவனாக இருப்பேன்
  alternative: நான் அவர்களுக்கு இறைவனாய் ஆவேன்
  rationale: எபிரெயம் இறைவனின் இயல்பில் மாற்றத்தை அல்ல, உடன்படிக்கை உறவைச் சொல்கிறது; ‘இருப்பேன்’ அந்தப் பொருளைப் பாதுகாக்கிறது.
- issue: עוֹלָם என்பதன் காலநீட்சியை அளவுக்கு மீறி வரையறுக்காமல் காத்தல்
  choice: என்றென்றும்
  alternative: நிரந்தரமாக
  rationale: சொல் நீடித்த அல்லது முடிவற்ற காலத்தைச் சுட்டலாம்; ‘என்றென்றும்’ உடன்படிக்கை மொழியின் வலிமையை வைத்துக்கொண்டு அதன் துல்லியமான காலவியலைத் தீர்மானிக்காது.
translation_notes:
  register: நவீன செந்தமிழுக்கேற்ற, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அந்நியனாகத் தங்கியிருக்கும்’ என்பது மூலத்தில் உள்ள குடியிருப்பு-அந்நியர் நிலையை இயல்பாக விளக்குகிறது; ‘உரிமைச் சொத்து’ நில உடைமையின் பொருளைத் தெளிவாக்குகிறது.
