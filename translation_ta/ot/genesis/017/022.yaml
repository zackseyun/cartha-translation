source:
  edition: WLC
  text: וַ/יְכַ֖ל לְ/דַבֵּ֣ר אִתּ֑/וֹ וַ/יַּ֣עַל אֱלֹהִ֔ים מֵ/עַ֖ל אַבְרָהָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/022.yaml
  text: When he finished speaking with him[a], God went up from Abraham.
translation:
  language: ta
  text: அவர் அவனோடு பேசி முடித்தபோது, கடவுள் ஆபிரகாமிடமிருந்து மேலே சென்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுள் ஆபிரகாமிடமிருந்து ஏறிச் சென்றார்.’ எபிரெய மொழியில் ‘மேலே சென்றார்/ஏறிச் சென்றார்’ என்ற வினைச்சொல் பயன்படுத்தப்பட்டு, கடவுளின் தோற்றம் முடிவடைந்தது இடஞ்சார்ந்த மொழியில் சித்தரிக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: முடித்தபோது
  rationale: כלה என்பதன் wayyiqtol வடிவம் செயல் நிறைவடைந்ததைக் குறிக்கிறது; அடுத்த முதன்மைச் செயலுடன் உள்ள காலத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לְדַבֵּר
  choice: பேசி
  rationale: דבר என்பதன் infinitive construct, כלה உடன் சேர்ந்து ‘பேசி முடித்தல்’ என்ற பொருளைத் தருகிறது; தமிழில் வினையெச்சத் தொடர் இயல்பானது.
- source_word: אִתּוֹ
  choice: அவனோடு
  rationale: את என்னும் முன்னிடைச்சொல் இங்கு உரையாடலின் பரஸ்பரத் தொடர்பைக் குறிக்கிறது. சூழலில் ‘அவன்’ ஆபிரகாமைக் குறிக்கிறது.
- source_word: וַיַּעַל
  choice: மேலே சென்றார்
  rationale: עלה என்பதன் ‘மேலே போதல்/ஏறிச் செல்லுதல்’ என்ற இடஞ்சார்ந்த உருவகத்தைப் பாதுகாக்கிறது; வெறுமனே ‘புறப்பட்டார்’ என்று பொருளைத் தட்டையாக்கவில்லை.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவில் பன்மையாக இருந்தாலும், ஒருமை வினைச்சொல்லும் சூழலும் ஒரே கடவுளைக் குறிக்கின்றன; நவீனத் தமிழில் பொதுவாகப் புரியும் மரியாதையான சொல்.
- source_word: מֵעַל
  choice: ஆபிரகாமிடமிருந்து
  rationale: சொல்லுக்கு நேரடியாக ‘மேலிருந்து/மேலாக இருந்து’ என்ற இடஞ்சார்ந்த நிழல் இருந்தாலும், இச்சூழலில் பிரிவின் தொடக்கப் புள்ளியை இயல்பான தமிழில் ‘ஆபிரகாமிடமிருந்து’ எனக் கூறுகிறது; மேல்நோக்கிய இயக்கம் வினையில் தக்கவைக்கப்பட்டுள்ளது.
- source_word: אַבְרָהָם
  choice: ஆபிரகாம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
theological_decisions:
- issue: கடவுள் பிரிந்து செல்வதை மனிதர்போன்ற இடஞ்சார்ந்த மொழியில் விவரித்தல்
  choice: ‘கடவுள் ஆபிரகாமிடமிருந்து மேலே சென்றார்’ என்ற இடஞ்சார்ந்த மொழியைத் தக்கவைத்தல்
  alternative: ‘கடவுள் ஆபிரகாமிடமிருந்து புறப்பட்டார்’ அல்லது ‘விலகினார்’
  rationale: எபிரெய உரை மேலே செல்லும் காட்சிப்படுத்தலை வெளிப்படையாகப் பயன்படுத்துகிறது. அதைத் தக்கவைப்பது கடவுளின் தோற்றம் முடிவடைவதை உரை கூறும் விதத்திலேயே காட்டுகிறது; கடவுள் இடத்தால் கட்டுப்பட்டவர் என்ற கோட்பாட்டுத் தீர்வை மொழிபெயர்ப்பு திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. ‘மேலே சென்றார்’ என்பது மூலத்தின் செங்குத்தான இயக்கக் காட்சியை இயல்பாகப் பாதுகாக்கிறது; அடிக்குறிப்பில் ‘ஏறிச் சென்றார்’ என்ற மாற்று வழங்கப்பட்டுள்ளது.
