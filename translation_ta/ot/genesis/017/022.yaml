  source_fidelity: 'The Tamil accurately represents the Hebrew sequence: completion of speaking with Abraham, followed by God''s upward departure from him. ‘மேலே சென்றார்’ preserves the concrete ascent language of וַיַּעַל, while ‘ஆபிரகாமிடமிருந்து’ is an idiomatic contextual rendering of מֵעַל.'
