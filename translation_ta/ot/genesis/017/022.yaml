  terminology: ‘கடவுள்’ and ‘ஆபிரகாம்’ are appropriate and consistent with standard Tamil biblical usage. The footnote supplies a legitimate lexical alternative, ‘ஏறிச் சென்றார்,’ without weakening the spatial imagery.
