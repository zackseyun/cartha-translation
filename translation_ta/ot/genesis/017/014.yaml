  text: וְ/עָרֵ֣ל זָכָ֗ר אֲשֶׁ֤ר לֹֽא יִמּוֹל֙ אֶת בְּשַׂ֣ר עָרְלָת֔/וֹ וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּ֑י/הָ אֶת בְּרִיתִ֖/י הֵפַֽר׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/014.yaml
  text: And an uncircumcised male who is not circumcised in the flesh of his foreskin—that person shall be cut off from his people[b][a]; he has broken my covenant.
translation:
  language: ta
  text: தன் நுனித்தோலின் சதையில் விருத்தசேதனம் செய்யப்படாத ஆண் எவனோ, அந்த நபர்[a] தன் மக்களிடமிருந்து அறுத்துப்போடப்படுவான்[b]; அவன் என் உடன்படிக்கையை மீறிவிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த உயிர்.” எபிரெயத்தில் ‘உயிர்/நபர்’ என்று பொருள்படும் נֶפֶשׁ என்ற சொல் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “அறுத்துப்போடப்படுதல்” என்பது கடுமையான உடன்படிக்கைத் தண்டனையைக் குறிக்கும் மரபுத்தொடர். சூழலைப் பொறுத்து அது சமூகத்திலிருந்து விலக்கப்படுவதையோ மரணத்தையோ குறிக்கலாம்; இவ்வசனம் அதை மேலும் குறிப்பாக விளக்கவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָרֵל זָכָר
  choice: விருத்தசேதனம் செய்யப்படாத ஆண்
  rationale: עָרֵל என்பது விருத்தசேதனம் செய்யப்படாதவரைக் குறிக்கிறது; זָכָר உடன் வருவதால் ஆண் நபர் என்பது தெளிவாகிறது. நவீனத் தமிழில் இயல்பாகவும் உடன்படிக்கையின் அடையாளத்தைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: אֲשֶׁר לֹא יִמּוֹל
  choice: செய்யப்படாத
  rationale: மூலத்தின் நிஃபால் வடிவிலுள்ள செயப்பாட்டு அல்லது தற்செயல்பாட்டு நுணுக்கத்தைத் தமிழ்ச் செயப்பாட்டு வடிவம் காக்கிறது; இங்கு பொதுவான சட்ட நிபந்தனை கூறப்படுகிறது.
- source_word: אֶת בְּשַׂר עָרְלָתוֹ
  choice: தன் நுனித்தோலின் சதையில்
  rationale: எபிரெயச் சொற்றொடரின் உடற்கூறு சார்ந்த துல்லியத்தைப் பொதுமைப்படுத்தாமல் காக்கிறது. தமிழில் செயப்பாட்டு வினையுடன் ‘சதையில்’ என்பது இயல்பான தொடர்பை அளிக்கிறது.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: அந்த நபர் அறுத்துப்போடப்படுவான்
  rationale: נפש இச்சட்டச் சூழலில் முழு நபரைக் குறிக்கிறது; ‘ஆத்துமா’ என்று மொழிபெயர்ப்பது பிற்கால மனித இயல்பியல் கருத்தைத் தேவையின்றி புகுத்தக்கூடும். ‘அறுத்துப்போடப்படுவான்’ என்பது כרת என்ற உடன்படிக்கைத் தண்டனை மரபுத்தொடரின் வலிமையையும் தெளிவின்மையையும் காக்கிறது.
- source_word: מֵעַמֶּיהָ
  choice: தன் மக்களிடமிருந்து
  rationale: பெண்பால் பின்னொட்டு இலக்கணத்தில் נפש என்பதோடு ஒத்திருந்தாலும், குறிக்கப்படுபவன் விருத்தசேதனம் செய்யப்படாத ஆண். ‘மக்கள்’ என்பது עם என்ற உடன்படிக்கைச் சமூகச் சொல்லை நேரடியாகக் காட்டுகிறது.
- source_word: אֶת בְּרִיתִי
  choice: என் உடன்படிக்கையை
  rationale: ברית என்பதற்கான வழக்கமான, பொருள் நிறைந்த தமிழ்ச் சொல் ‘உடன்படிக்கை’; ஆதியாகமம் 17 முழுவதிலும் இதை ஒரேவிதமாக வைத்திருக்க உதவுகிறது.
- source_word: הֵפַר
  choice: மீறிவிட்டான்
  rationale: הפר என்பது உடன்படிக்கையை முறித்தல், மீறுதல் அல்லது செல்லாததாக்குதல் எனப் பொருள்படலாம். இங்கு ‘மீறிவிட்டான்’ நவீனத் தமிழில் இயல்பாக இருந்து, தண்டனைக்கான காரணத்தைத் தெளிவாகக் கூறுகிறது; ‘முறித்துவிட்டான்’ என்பதும் சாத்தியம்.
theological_decisions:
- issue: כרת (‘அறுத்துப்போடுதல்’) என்ற உடன்படிக்கைத் தண்டனையின் பொருள்
  choice: ‘தன் மக்களிடமிருந்து அறுத்துப்போடப்படுவான்’ என்ற மரபுத்தொடரைத் தக்கவைத்தல்
  alternative: ‘சமூகத்திலிருந்து விலக்கப்படுவான்’ அல்லது ‘கொல்லப்படுவான்’
  rationale: இவ்வசனம் தண்டனை சமூக விலக்கா, மரணமா, அல்லது வேறு கடுமையான தெய்வீக நியாயத்தீர்ப்பா என்பதைத் தனியாகத் தீர்மானிக்கவில்லை. எனவே மூலத்தின் இறையியல் மற்றும் சட்டத் திணறலைத் தீர்த்துவிடாமல் காக்கப்படுகிறது.
- issue: נפש என்பதன் மொழிபெயர்ப்பு
  choice: நபர்
  alternative: உயிர் அல்லது ஆத்துமா
  rationale: இங்கு உடன்படிக்கைத் தண்டனைக்கு உட்படும் தனிநபரையே נפש குறிக்கிறது. ‘நபர்’ என்பது உடலிலிருந்து பிரிந்த ஓர் ஆத்துமாவைப் பற்றிய குறுகிய இறையியல் கருத்தை புகுத்தாமல் சட்டப் பொருளைத் தெளிவாகத் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதச் சட்ட உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘விருத்தசேதனம்’ பொதுவாக அறியப்பட்ட சமய-உடற்கூறு சொலாகத் தக்கவைக்கப்பட்டது; தெளிவற்ற உடன்படிக்கைத் தண்டனை விளக்கவுரையால் ஒரே பொருளுக்கு மட்டுப்படுத்தப்படவில்லை.
