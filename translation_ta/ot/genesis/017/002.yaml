  text: וְ/אֶתְּנָ֥ה בְרִיתִ֖/י בֵּינִ֣/י וּ/בֵינֶ֑/ךָ וְ/אַרְבֶּ֥ה אוֹתְ/ךָ֖ בִּ/מְאֹ֥ד מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/002.yaml
  text: And I will make my covenant between me and you[a], and I will multiply you exceedingly.
translation:
  language: ta
  text: எனக்கும் உனக்கும் இடையே என் உடன்படிக்கையை ஏற்படுத்துவேன்[a]; உன்னை மிக மிகப் பெருகச் செய்வேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “எனக்கும் உனக்கும் இடையே என் உடன்படிக்கையை அளிப்பேன்” அல்லது “வைப்பேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנָה
  choice: ஏற்படுத்துவேன்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு/வை’ என்பதாக இருந்தாலும், בְּרִית உடன் வரும் இச்சூழலில் உடன்படிக்கையைச் செயல்படுத்தி நிலைநிறுத்தும் பொருளை இயல்பான தமிழில் ‘ஏற்படுத்துவேன்’ தெளிவாகத் தருகிறது; நேரடியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְרִיתִי
  choice: என் உடன்படிக்கையை
  rationale: בְּרִית என்பதன் முறையான, இறையியல் நிறை கொண்ட தமிழ்ச் சொல் ‘உடன்படிக்கை’; முதலாம் நபர் ஒருமை உரிமை விகுதி ‘என்’ எனக் காட்டப்பட்டுள்ளது.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: எனக்கும் உனக்கும் இடையே
  rationale: இரு தரப்புகளுக்கிடையிலான உறவைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: וְאַרְבֶּה
  choice: பெருகச் செய்வேன்
  rationale: רבה என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளில் எண்ணிக்கையை அதிகரிக்கச் செய்வதைக் குறிக்கிறது.
- source_word: אֹתְךָ
  choice: உன்னை
  rationale: எபிரெய உரை ஆபிராமை இரண்டாம் நபர் ஆண்பால் ஒருமையில் நேரடியாகக் குறிக்கிறது; சந்ததியைக் குறிக்கும் உட்பொருளை முதன்மை உரையில் விரித்துரைக்கவில்லை.
- source_word: בִּמְאֹד מְאֹד
  choice: மிக மிக
  rationale: מְאֹד இருமுறை வருவதன் வலியுறுத்தலைத் தமிழிலும் இயல்பான மறுபதிப்பால் பாதுகாக்கிறது.
theological_decisions:
- issue: נתן + ברית என்ற உடன்படிக்கைச் சொல்லாட்சி
  choice: என் உடன்படிக்கையை ஏற்படுத்துவேன்
  alternative: என் உடன்படிக்கையை அளிப்பேன் / வைப்பேன்
  rationale: ‘ஏற்படுத்துவேன்’ என்பது உடன்படிக்கையை வெறும் பொருளாகக் கொடுப்பதாகத் தோன்றாமல், இச்சூழலிலுள்ள உடன்படிக்கைச் செயலை இயல்பாக வெளிப்படுத்துகிறது. அதேவேளை, ‘கொடு/வை’ என்ற வினையின் நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது; உடன்படிக்கை புதிதாகத் தொடங்கப்படுகிறதா அல்லது உறுதிப்படுத்தப்படுகிறதா என்பதை மொழிபெயர்ப்பு தேவையின்றித் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஆபிராமை நேரடியாகக் குறிக்கும் ‘உன்னை’ என்பதும், மூலத்தின் வலியுறுத்தலைக் காக்கும் ‘மிக மிக’ என்பதும் விரிவுரை இன்றி பாதுகாக்கப்பட்டுள்ளன.
