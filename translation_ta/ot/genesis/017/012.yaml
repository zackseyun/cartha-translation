base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/012.yaml
  text: And at eight days old, every male among you throughout your generations shall be circumcised—whether born in the house or bought with silver from any foreigner who is not from your offspring.
translation:
  language: ta
  text: எட்டு நாள் வயதான[a] ஒவ்வொரு ஆணும் உங்களிடையே தலைமுறைதோறும் விருத்தசேதனம் செய்யப்பட வேண்டும்—வீட்டில் பிறந்தவனாக இருந்தாலும், உன் சந்ததியைச் சாராத எந்த அந்நியனிடமிருந்தாவது வெள்ளி கொடுத்து வாங்கப்பட்டவனாக[b][c] இருந்தாலும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், ‘எட்டு நாட்களின் மகன்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பணம் கொடுத்து வாங்கப்பட்டவன்.’
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்கு சொல், ‘உன் வித்தைச் சாராத அந்நியனின் ஒவ்வொரு மகனிடமிருந்தும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן שְׁמֹנַת יָמִים
  choice: எட்டு நாட்களான
  rationale: ‘எட்டு நாட்களின் மகன்’ என்ற எபிரெய மொழிவழக்கின் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; எட்டாம் நாளில் விருத்தசேதனம் செய்ய வேண்டிய காலக் குறிப்பையும் காக்கிறது.
- source_word: יִמּוֹל
  choice: விருத்தசேதனம் செய்யப்பட வேண்டும்
  rationale: நிபால் வினைவடிவின் செயப்பாட்டு உணர்வையும் கட்டளையின் சட்டபூர்வத் தொனியையும் தெளிவாகக் காக்கிறது.
- source_word: לָכֶם כָּל זָכָר
  choice: ஒவ்வொரு ஆணும் ... உங்களிடையே
  rationale: כָּל זָכָר என்பதன் முழுமையான பரப்பையும், לָכֶם குறிக்கும் உடன்படிக்கைச் சமூகச் சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְדֹרֹתֵיכֶם
  choice: தலைமுறைதோறும்
  rationale: அடுத்தடுத்த தலைமுறைகளுக்கும் தொடர்ந்து பொருந்துவதைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: יְלִיד בָּיִת
  choice: வீட்டில் பிறந்தவன்
  rationale: ஒருவரின் வீட்டாருக்குள் பிறந்த நபரைச் சுட்டும் மூலமொழிச் சொல்லுக்கு நெருக்கமான, புரியக்கூடிய மொழிபெயர்ப்பு.
- source_word: וּמִקְנַת כֶּסֶף
  choice: வெள்ளி கொடுத்து வாங்கப்பட்டவன்
  rationale: כֶּסֶף என்பதன் ‘வெள்ளி’ என்னும் திடமான பொருளாதாரச் சொல்லையும், கொள்முதல் செய்யப்பட்ட நிலைமையையும் காக்கிறது.
- source_word: מִכֹּל בֶּן נֵכָר
  choice: எந்த அந்நியனிடமிருந்தாவது
  rationale: சொல்லுக்கு சொல் ‘அந்நியனின் மகன் ஒவ்வொருவனிடமிருந்தும்’ என்றாலும், இங்கு அந்நியரைச் சுட்டும் எபிரெய மொழிவழக்கை இயல்பான தமிழில் தருகிறது.
- source_word: אֲשֶׁר לֹא מִזַּרְעֲךָ הוּא
  choice: உன் சந்ததியைச் சேராத
  rationale: זֶרַע என்பதன் வம்சவழிப் பொருளை ‘சந்ததி’ எனத் தெளிவாகத் தெரிவிக்கிறது; அந்நியன் ஆபிரகாமின் உயிரியல் வழித்தோன்றல் அல்ல என்பதைக் காட்டுகிறது.
theological_decisions:
- issue: ஆபிரகாமின் உடன்படிக்கை வீட்டாருக்குள் விருத்தசேதனக் கட்டளையின் பரப்பு
  choice: உயிரியல் சந்ததியினரை மட்டுமல்லாமல், வீட்டில் பிறந்தவர்களையும் அந்நியரிடமிருந்து வாங்கப்பட்ட ஆண்களையும் வசனம் உள்ளடக்குகிறது.
  alternative: கட்டளையை முதன்மையாக அல்லது முற்றிலும் ஆபிரகாமின் உயிரியல் சந்ததியினருக்கே வரையறுத்தல்.
  rationale: மூல எபிரெய உரை வீட்டில் பிறந்தவர்களையும் வாங்கப்பட்டவர்களையும் வெளிப்படையாகச் சேர்த்து, ஆபிரகாமின் சந்ததியைச் சேராதவர்களுக்கும் கட்டளையை விரிவுபடுத்துகிறது; இதற்கு அப்பாற்பட்ட பிற்கால இறையியல் முடிவுகள் மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான சட்டபூர்வத் தொனி காக்கப்பட்டுள்ளது. ஒருமை ‘உன்’ ஆபிரகாமைச் சுட்டுவதும், பன்மை ‘உங்களிடையே’ உடன்படிக்கைச் சமூகத்தைச் சுட்டுவதும் மூல உரைப்படியே வேறுபடுத்தப்பட்டுள்ளன. அடிமை/வீட்டார் அமைப்பை மறைக்காமல், மூலத்தின் சமூகச் சூழல் நேரடியாகத் தரப்பட்டுள்ளது.
