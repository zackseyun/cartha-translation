base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/005.yaml
  text: Your name shall no longer be called Abram[a], but your name shall be Abraham, for I have made you the father of a multitude of nations.
translation:
  language: ta
  text: உன் பெயர் இனி ஆபிராம் என்று அழைக்கப்படாது; ஆபிரகாம் என்பதே உன் பெயராக இருக்கும். ஏனெனில், பல நாடுகளின் தந்தையாக உன்னை ஆக்கியிருக்கிறேன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, ‘பல நாடுகளின் தந்தையாக உன்னைக் கொடுத்திருக்கிறேன்.’
    reason: נְתַתִּיךָ என்பதன் அடிப்படைப் பொருளான ‘கொடுத்திருக்கிறேன்’ என்பதைக் காட்டும் சொற்பொருள் மாற்றுவழி.
lexical_decisions:
- source_word: יִקָּרֵא
  choice: அழைக்கப்படாது
  rationale: קרא என்பதன் நிஃபால் வடிவம் இங்கு பெயரிடுதலைக் குறிக்கும் செயப்பாட்டு வடிவம்; தமிழில் ‘அழைக்கப்படுதல்’ என்பது இயல்பானதும் நேரடியானதும் ஆகும்.
- source_word: עוֹד
  choice: இனி
  rationale: לֹא என்பதோடு சேர்ந்து, இப்போதிலிருந்து பழைய பெயர் தொடராது என்ற காலப்பொருளைத் தருகிறது.
- source_word: אַבְרָם
  choice: ஆபிராம்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: וְהָיָה שִׁמְךָ
  choice: என்பதே உன் பெயராக இருக்கும்
  rationale: சொல்லாட்சியின் மாறுபாட்டை இயல்பான தமிழில் தெளிவுபடுத்தி, புதிய பெயரை வலியுறுத்துகிறது.
- source_word: אַבְרָהָם
  choice: ஆபிரகாம்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: புதிய பெயருக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்க இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: אַב
  choice: தந்தை
  rationale: இங்கு நேரடியான குடும்பச் சொல்லும், பல நாடுகளின் மூதாதை என்ற விரிவான உடன்படிக்கைப் பொருளும் இணைந்து நிற்கின்றன.
- source_word: הֲמוֹן
  choice: பல
  rationale: ஏராளம் அல்லது பெருந்திரள் என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது; ‘பல நாடுகள்’ என்பது வாசிப்புக்கு தெளிவானது.
- source_word: גּוֹיִם
  choice: நாடுகள்
  rationale: ஆதியாகமத்தின் உடன்படிக்கைச் சூழலில் பல இனமக்கள் அல்லது தேசங்களைக் குறிக்கும்; ‘புறஜாதியார்’ என்பது இங்கு காலத்துக்கு முந்திய வேறுபாட்டை இறக்குமதி செய்யும்.
- source_word: נְתַתִּיךָ
  choice: உன்னை ஆக்கியிருக்கிறேன்
  rationale: சொற்சொல்லாக ‘உன்னைக் கொடுத்திருக்கிறேன்’ என்றாலும், இத்தகைய பயனிலை அமைப்பில் ‘ஆக்கியிருக்கிறேன்’ என்பது இயல்பான தமிழ்; எபிரெய நிறைவுவடிவத்தின் நிறைவேற்றப்பட்ட அறிவிப்பையும் காக்கிறது.
theological_decisions:
- issue: தேவனுடைய மறுபெயரிடும் அறிவிப்பில் நிறைவுற்ற காலப்பொருள்
  choice: பல நாடுகளுக்குத் தந்தையாக உன்னை ஆக்கியிருக்கிறேன்
  alternative: பல நாடுகளுக்குத் தந்தையாக உன்னை ஆக்குவேன்
  rationale: எபிரெயில் נְתַתִּיךָ நிறைவுவடிவில் உள்ளது. எதிர்காலமாக மாற்றாமல், இன்னும் வரலாற்றில் முழுமையாக வெளிப்படாத வாக்குறுதியை தேவன் நிறைவேறிய உண்மையாக அறிவிக்கும் பதற்றத்தை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மறுபெயரிடும் சூத்திரம் இயல்பாக அமைக்கப்பட்டாலும், எபிரெய நிறைவுவடிவம் எதிர்காலமாக மாற்றப்படவில்லை. அடிக்குறி குறியீடு அதற்குரிய வினைச்சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
