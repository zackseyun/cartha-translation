base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/013.yaml
  text: The one born in your house and the one bought with your money must surely be circumcised[c][b][a], and my covenant shall be in your flesh as an everlasting covenant.
translation:
  language: ta
  text: உன் வீட்டில் பிறந்தவனும் உன் பணத்தால் வாங்கப்பட்டவனும் கண்டிப்பாக விருத்தசேதனம் செய்யப்பட வேண்டும்[a][b][c]. என் உடன்படிக்கை உங்கள் உடலில் நித்திய உடன்படிக்கையாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிச்சயமாக விருத்தசேதனம் செய்யப்படுவான்.” எபிரெயத்தில் வினைச்சொல்லின் வலியுறுத்தும் முழுவடிவமும் ஒரு முடிவுறு வினை வடிவமும் இணைந்து பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
  - marker: b
    text: “வீட்டில் பிறந்தவன்,” “பணத்தால் வாங்கப்பட்டவன்” என்பவை ஆபிரகாமின் குடும்பத்தைச் சேர்ந்தவர்களை—அங்கே பிறந்தவர்களையும் விலைகொடுத்து வாங்கப்பட்டவர்களையும்—குறிக்கின்றன.
    reason: cultural_note
  - marker: c
    text: எபிரெயச் சொற்றொடரை இன்னும் சொல்லடியாக, “உன் வீட்டில் பிறந்தவனும் உன் பணத்தால் வாங்கப்பட்டவனும் நிச்சயமாக விருத்தசேதனம் செய்யப்படுவான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: previous_rendering
lexical_decisions:
- source_word: הִמּוֹל יִמּוֹל
  choice: கண்டிப்பாக விருத்தசேதனம் செய்யப்பட வேண்டும்
  rationale: ஒரே வேர்ச்சொல்லின் வினையெச்ச முழுவடிவமும் வினைமுற்றும் இணைந்து கட்டளையின் வலியுறுத்தலைக் காட்டுகின்றன. ‘கண்டிப்பாக ... செய்யப்பட வேண்டும்’ என்பது கடமையையும் வலியுறுத்தலையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: יְלִיד בֵּיתְךָ
  choice: உன் வீட்டில் பிறந்தவன்
  rationale: சொல்லடியாக ‘உன் வீட்டில் பிறந்தவன்’ அல்லது ‘வீட்டில் பிறந்தவன்.’ அடிமை என்ற நிலையைச் சொற்றொடர் தனியாக வெளிப்படையாகக் கூறாததால் அதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: וּמִקְנַת כַּסְפֶּךָ
  choice: உன் பணத்தால் வாங்கப்பட்டவன்
  rationale: விலைகொடுத்து குடும்பத்தில் சேர்க்கப்பட்ட ஒருவரைக் குறிக்கிறது. ‘வெள்ளி’ என்ற சொல்லடியான பொருளைவிட, இச்சூழலில் ‘பணம்’ என்பது தெளிவான இயல்பான தமிழ்.
- source_word: בְרִיתִי
  choice: என் உடன்படிக்கை
  rationale: בְּרִית என்பதன் உடன்படிக்கை சார்ந்த மையப் பொருளை நேரடியாகப் பேணுகிறது.
- source_word: בִּבְשַׂרְכֶם
  choice: உங்கள் உடலில்
  rationale: பன்மை இரண்டாம் நபரையும் உடலில் தாங்கப்படும் விருத்தசேதன அடையாளத்தையும் தெளிவாகக் காட்டுகிறது. தமிழில் ‘சதையில்’ என்பதைவிட ‘உடலில்’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: לִבְרִית עוֹלָם
  choice: நித்திய உடன்படிக்கையாக
  rationale: לִ முன்னொட்டு இங்கு நிலை அல்லது செயல்பாட்டை உணர்த்துகிறது; עוֹלָם என்பதன் நீடித்த தன்மையை ‘நித்திய’ பேணுகிறது.
theological_decisions:
- issue: உடலிலுள்ள அடையாளத்துக்கும் உடன்படிக்கைக்கும் இடையிலான தொடர்பு
  choice: ‘என் உடன்படிக்கை உங்கள் உடலில் ... இருக்கும்’ என்ற மூலத்தின் நேரடியான தொடர்பைப் பேணுதல்
  alternative: விருத்தசேதனம் உடன்படிக்கையை வெறுமனே குறிக்கும் அடையாளம் என்று விளக்குவது, அல்லது அந்த அடையாளமே உடன்படிக்கையை ஏற்படுத்துகிறது என்று வலுப்படுத்துவது
  rationale: எபிரெய உரை அடையாளத்தையும் உடன்படிக்கையையும் நெருக்கமாக இணைக்கிறது; ஆனால் அந்தத் தொடர்பை ஒரு பிற்கால இறையியல் முறைக்குள் வரையறுப்பதில்லை. ஆகவே அதன் இறையியல் இழுவிசை தீர்க்கப்படாமல் பேணப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஆபிரகாமைக் குறிக்கும் ‘உன்’ என்ற ஒருமையும், உடன்படிக்கை அடையாளத்தைத் தாங்கும் குழுவைக் குறிக்கும் ‘உங்கள்’ என்ற பன்மையும் மூல எபிரெயத்தின்படி வேறுபடுத்தப்பட்டுள்ளன.
