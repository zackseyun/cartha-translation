base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/006.yaml
  text: And I will make you exceedingly fruitful[a], and I will make nations from you[b], and kings will come from you.
translation:
  language: ta
  text: நான் உன்னை மிக மிகப் பெருகச் செய்வேன்[a]; உன்னைப் பல தேசங்களாக ஆக்குவேன்; அரசர்கள் உன்னிடமிருந்து தோன்றுவார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சொல்லாக, “மிகவும், மிகவும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அரசர்கள் உன்னிடமிருந்து புறப்படுவார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְרֵתִי
  choice: செழித்துப் பெருகச் செய்வேன்
  rationale: פרה என்பதன் ஹிஃபில் வடிவம் ‘பலனுள்ளவராகச் செய், பெருகச் செய்’ என்ற காரணவினைப் பொருளைக் கொண்டது. தமிழில் இயல்பாகவும், சந்ததிப் பெருக்கைக் குறிக்கும் சூழலுக்கு ஏற்றவாறும் ‘செழித்துப் பெருகச் செய்வேன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בִּמְאֹד מְאֹד
  choice: அளவுகடந்து
  rationale: மְאֹד இருமுறை வருவது வாக்குறுதியை வலுவாக மிகைப்படுத்துகிறது. ‘அளவுகடந்து’ என்பது அந்த வலியுறுத்தலை இயல்பான நவீன தமிழில் தருகிறது; சொற்சொல்லான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וּנְתַתִּיךָ לְגוֹיִם
  choice: உன்னைப் பல தேசங்களாக ஆக்குவேன்
  rationale: 'נתן உடன் לְ வரும் இக்கட்டமைப்பு விளைவைக் குறிக்கிறது: ஆபிரகாம் பல தேசங்களுக்குத் தந்தையாக ஆவார். எபிரெய வாக்கியத்தின் சுருக்கத்தையும் அதன் வம்சவழி சார்ந்த பொருளையும் இம்மொழியாக்கம் காக்கிறது.'
- source_word: לְגוֹיִם
  choice: பல தேசங்களாக
  rationale: גּוֹיִם என்பது இங்கு ஆபிரகாமிடமிருந்து உருவாகும் பல தேசிய இனக்குழுக்களைக் குறிக்கிறது; குறிப்பாக ‘புறவினத்தார்’ என்ற பிற்கால சமயப் பொருளை இங்கு புகுத்தக்கூடாது.
- source_word: וּמְלָכִים
  choice: அரசர்கள்
  rationale: מְלָכִים என்பதன் நேரான பொருள் ‘அரசர்கள்’; பொதுவான ‘ஆட்சியாளர்கள்’ என்பதைவிட இது துல்லியமானது.
- source_word: מִמְּךָ יֵצֵאוּ
  choice: உன்னிடமிருந்து தோன்றுவார்கள்
  rationale: יצא என்பதன் அடிப்படைப் பொருள் ‘புறப்படு’; ஆனால் வம்சவழிச் சூழலில் ‘உன்னிடமிருந்து தோன்றுவார்கள்’ என்பது மூலத்திலுள்ள தோற்றுவாய்ப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஆபிரகாமுக்கு வாக்களிக்கப்பட்ட சந்ததியின் பரப்பு
  choice: ஆபிரகாம் பல தேசங்களுக்கும் அரசர்களுக்கும் மூதாதையாக ஆவார் என்ற வம்சவழி வாக்குறுதியாக மொழிபெயர்க்கப்பட்டது.
  alternative: தேசங்களிடையே ஆபிரகாமுக்கு ஒரு சிறப்பு நிலை அளிக்கப்படுவதாக மட்டும் வாசிக்கலாம்.
  rationale: உடனடியாகச் சுற்றியுள்ள உடன்படிக்கைச் சூழல் சந்ததியையும் வம்சத்தையும் வலியுறுத்துகிறது. ஆகவே பிற்கால இறையியல் அமைப்புகளைப் புகுத்தாமல், சொற்றொடர்கள் வம்சவழிப் பொருளில் மொழிபெயர்க்கப்பட்டன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பலுகச் செய்வேன்’ போன்ற பழைய நடை தவிர்க்கப்பட்டு, மனிதரின் சந்ததிப் பெருக்கை இயல்பாக உணர்த்தும் ‘செழித்துப் பெருகச் செய்வேன்’ தேர்ந்தெடுக்கப்பட்டது. இரண்டாவது அடிக்குறி அதற்குரிய ‘அரசர்கள்’ கூறின் முடிவில் வைக்கப்பட்டுள்ளது.
