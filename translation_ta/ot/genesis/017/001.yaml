  text: וַ/יְהִ֣י אַבְרָ֔ם בֶּן תִּשְׁעִ֥ים שָׁנָ֖ה וְ/תֵ֣שַׁע שָׁנִ֑ים וַ/יֵּרָ֨א יְהוָ֜ה אֶל אַבְרָ֗ם וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֲנִי אֵ֣ל שַׁדַּ֔י הִתְהַלֵּ֥ךְ לְ/פָנַ֖/י וֶ/הְיֵ֥ה תָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/001.yaml
  text: When Abram was ninety-nine years old[a], Yahweh appeared to Abram and said to him, “I am God Almighty. Walk before me, and be blameless.”
translation:
  language: ta
  text: ஆபிராம் தொண்ணூற்றொன்பது வயதானபோது, யாவே ஆபிராமுக்குத் தோன்றி, “நான் சர்வவல்லமையுள்ள தேவன்[a]. என் முன்னிலையில் நடந்து, குற்றமற்றவனாய் இரு” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “எல் ஷத்தாய்.” “ஷத்தாய்” என்பதன் துல்லியமான பொருள் விவாதத்திற்குரியது; பாரம்பரியமாக இப்பெயர் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்படுவதும் உண்டு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... בֶּן תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים
  choice: ஆபிராம் தொண்ணூற்றொன்பது வயதானபோது
  rationale: எபிரெயக் கதைத் தொடக்கத்தையும் வயதைக் குறிக்கும் மரபுத்தொடரையும் இயல்பான நவீனத் தமிழில் காலப் பின்னணியாக வழங்குகிறது.
- source_word: וַיֵּרָא
  choice: தோன்றி
  rationale: யாவே எழுவாயாகவும் ஆபிராம் தோற்றத்தைப் பெறுபவராகவும் உள்ள இந்நிஃபால் வடிவத்தின் இயல்பான பொருள் ‘தோன்றினார்’ என்பதாகும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: ஒரு பட்டத்தால் மாற்றாமல், எபிரெயத் தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֵל שַׁדַּי
  choice: சர்வவல்லமையுள்ள தேவன்
  rationale: தெய்வீகப் பட்டத்தின் வழக்கமான பொருளைத் தெளிவான தமிழில் தருகிறது; ‘ஷத்தாய்’ என்பதன் துல்லியமான நுட்பம் உறுதியற்றதால் மூல வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הִתְהַלֵּךְ לְפָנַי
  choice: என் முன்னிலையில் நடந்து
  rationale: ஒருவரின் வாழ்க்கை நடத்தையைக் குறிக்கும் ‘நட’ என்ற உருவகத்தையும் தேவனின் முன்னிலையில் வாழும் உடன்படிக்கைத் தொனியையும் பாதுகாக்கிறது.
- source_word: וֶהְיֵה תָמִים
  choice: குற்றமற்றவனாய் இரு
  rationale: תָמִים குறிக்கும் நேர்மை, முழுமை, பழியற்ற தன்மை ஆகிய அறநெறி வலிமையைத் தக்கவைத்து, முற்றிலும் பாவமற்ற பரிபூரணத்தை அவசியமாகக் கூறாமல் இருக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: வசனம் தனிப்பட்ட தெய்வீகப் பெயரையே பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்த்துள்ளது.
- issue: אֵל שַׁדַּי என்ற தெய்வீகப் பட்டத்தை வழங்குதல்
  choice: சர்வவல்லமையுள்ள தேவன்
  alternative: எல் ஷத்தாய்
  rationale: பட்டத்தின் மரபான பொருளை முதன்மை உரையில் தெளிவாக வழங்குகிறது; எனினும் שַׁדַּי என்பதன் சொற்பிறப்பும் துல்லியமான நுட்பமும் விவாதத்திற்குரியவை என்பதால் ஒலிபெயர்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: תָמִים என்பதன் அறநெறிப் பொருள்
  choice: குற்றமற்றவனாய்
  alternative: முழுமையானவனாய்; உத்தமனாய்
  rationale: இச்சொல் முழுமை மற்றும் நேர்மையைக் குறிக்கக்கூடும். ‘குற்றமற்றவனாய்’ என்பது அறநெறிக் கோரிக்கையைத் தக்கவைத்தாலும், தத்துவார்த்தமான முழுப் பாவமின்மையை உரைக்குள் திணிப்பதில்லை.
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘என் முன்னிலையில் நடந்து’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது. தெய்வீகப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டு, אֵל שַׁדַּי பொருள் மொழிபெயர்ப்பாகவும் அதன் உறுதியற்ற நுட்பம் அடிக்குறிப்பிலும் தரப்பட்டுள்ளது.
