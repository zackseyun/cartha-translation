  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת יִשְׁמָעֵ֣אל בְּנ֗/וֹ וְ/אֵ֨ת כָּל יְלִידֵ֤י בֵית/וֹ֙ וְ/אֵת֙ כָּל מִקְנַ֣ת כַּסְפּ֔/וֹ כָּל זָכָ֕ר בְּ/אַנְשֵׁ֖י בֵּ֣ית אַבְרָהָ֑ם וַ/יָּ֜מָל אֶת בְּשַׂ֣ר עָרְלָתָ֗/ם בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אִתּ֖/וֹ אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/023.yaml
  text: So Abraham took Ishmael his son[a], and all those born in his house, and all those bought with his money, every male among the men of Abraham’s household, and circumcised the flesh of their foreskin on that very day[d][c][b], just as God had spoken to him.
translation:
  language: ta
  text: ஆபிரகாம் தன் மகன் இஸ்மவேலையும், தன் வீட்டில் பிறந்த அனைவரையும், தன் பணத்தால் வாங்கப்பட்ட அனைவரையும், ஆபிரகாமின் வீட்டாரில் இருந்த ஒவ்வோர் ஆணையும் கூட்டிக்கொண்டு, அந்த நாளிலேயே அவர்களுடைய முன்தோலின் சதையை விருத்தசேதனம் செய்தார்; கடவுள் அவரிடம் கூறியபடியே செய்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இந்த நாளிலேயே”; ஆபிரகாம் அதே நாளில் உடனடியாகச் செயல்பட்டார் என்பதை வலியுறுத்தும் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: அழைத்து
  rationale: இங்கு לָקַח என்பது ஆபிரகாம் விருத்தசேதனம் செய்ய வேண்டியவர்களைத் தம்மிடம் சேர்த்துச் செயல்பட்டதைக் குறிக்கிறது; தமிழில் வெறுமனே ‘எடுத்தார்’ என்பதைவிட ‘அழைத்து’ என்பது சூழலுக்கு இயல்பானது.
- source_word: יְלִידֵי בֵיתוֹ
  choice: தன் வீட்டில் பிறந்த அனைவரையும்
  rationale: ‘தன் வீட்டில் பிறந்தவர்கள்’ என்ற எபிரெய உருவகத்தைப் பேணுகிறது; அவர்களுடைய சமூக நிலையை மூல உரையைவிட அதிகமாகக் குறிப்பதில்லை.
- source_word: מִקְנַת כַּסְפּוֹ
  choice: தன் பணத்தால் வாங்கப்பட்ட அனைவரையும்
  rationale: விலை கொடுத்து வீட்டாரோடு சேர்க்கப்பட்ட நபர்களைக் குறிக்கும் பொருளாதார அர்த்தத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כָּל זָכָר בְּאַנְשֵׁי בֵּית אַבְרָהָם
  choice: ஆபிரகாமின் வீட்டாரில் இருந்த ஆண்கள் அனைவரையும்
  rationale: זָכָר என்பதன் ஆண்பால் குறிப்பைத் தக்கவைத்தபடி, தமிழில் தேவையற்ற மறுகூறலைத் தவிர்த்து இயல்பாக வழங்குகிறது.
- source_word: וַיָּמָל אֶת בְּשַׂר עָרְלָתָם
  choice: அவர்களுடைய முன்தோலின் சதையை விருத்தசேதனம் செய்தார்
  rationale: விருத்தசேதனத்திற்கான வழக்கமான சொல்லையும், மூலத்தின் உடல்சார்ந்த ‘முன்தோலின் சதை’ என்ற குறிப்பையும் தக்கவைக்கிறது.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: அன்றைய நாளிலேயே
  rationale: அதே நாளில் உடனடியாகக் கீழ்ப்படிந்தார் என்ற எபிரெய வலியுறுத்தலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים
  choice: கடவுள் தம்மிடம் கூறியபடியே
  rationale: דבר + אִתּוֹ என்பதிலுள்ள ‘அவரோடு/அவரிடம் பேசுதல்’ என்ற நுணுக்கத்தை சூழலுக்கு இயல்பான தமிழில் தருகிறது; ‘கூறியபடியே’ கட்டளைக்குக் கீழ்ப்படிந்த ஒற்றுமையையும் காட்டுகிறது.
theological_decisions:
- issue: אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: தேவன்
  rationale: இச்சூழலில் ஆபிரகாமுடன் உடன்படிக்கை தொடர்பாகப் பேசும் ஒரே கடவுளே குறிக்கப்படுகிறார்; ‘கடவுள்’ என்பது நவீன பொதுத்தமிழில் இயல்பான, மதிப்புக்குரிய வடிவம்.
- issue: வீட்டாரின் பாலினக் குறிப்பு
  choice: ஆண்கள் அனைவரையும்
  alternative: வீட்டார் அனைவரையும்
  rationale: மூலத்தில் זָכָר என்று வெளிப்படையாக ‘ஆண்’ குறிப்பிடப்படுவதால், பாலினக் குறிப்பை பொதுமைப்படுத்தாமல் தக்கவைக்கிறது.
- issue: கடவுள் ஆபிரகாமிடம் பேசிய விதம்
  choice: தம்மிடம் கூறியபடியே
  alternative: தம்மோடு பேசியபடியே
  rationale: אִתּוֹ ‘அவரோடு’ அல்லது ‘அவரிடம்’ என இருவிதமாகப் புரியக்கூடியது. இங்கு முந்தைய கட்டளையை நிறைவேற்றுதல் முன்னிலையிலிருப்பதால் ‘கூறியபடியே’ இயல்பானது; உரையாடல் நுணுக்கத்தை மாற்று வடிவம் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமும் தெளிவும் கொண்ட உரை. நீளமான எபிரெயப் பட்டியலை வாசிக்க எளிதாக்க இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன. ‘விருத்தசேதனம்’ என்பது சூழலுக்குரிய நிலையான வேதாகமச் சொல்; ‘முன்தோலின் சதை’ மூலத்தின் தெளிவான உடல்சார்ந்த மொழியைப் பேணுகிறது. மரியாதை ஒருமைக்காக ஆபிரகாமைக் குறிக்கும் இடத்தில் ‘தம்மிடம்’ பயன்படுத்தப்பட்டுள்ளது.
