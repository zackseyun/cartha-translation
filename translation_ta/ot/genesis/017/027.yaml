base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/027.yaml
  text: And all the men of his household[a], those born in the house and those bought with money from a foreigner, were circumcised with him.
translation:
  language: ta
  text: அவனுடைய வீட்டைச் சேர்ந்த ஆண்கள் அனைவரும்—அவனுடைய வீட்டில் பிறந்தவர்களும், ஒரு அந்நியரிடமிருந்து பணம் கொடுத்து வாங்கப்பட்டவர்களும்—அவனோடு விருத்தசேதனம் செய்யப்பட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל אַנְשֵׁי בֵיתוֹ
  choice: அவனுடைய வீட்டைச் சேர்ந்த ஆண்கள் அனைவரும்
  rationale: וְכָל முழுமையைக் குறிக்கிறது; אַנְשֵׁי בֵיתוֹ என்பது அவனுடைய வீடு அல்லது குடும்ப அமைப்பைச் சேர்ந்த ஆண்களைக் குறிக்கிறது. சூழல் விருத்தசேதனத்தைப் பற்றியதால் ‘ஆண்கள்’ என்பது துல்லியமும் இயல்பும் உடையது.
- source_word: יְלִיד בָּיִת
  choice: அந்த வீட்டில் பிறந்தவர்கள்
  rationale: வீட்டுக் குழுமத்திற்குள் பிறந்தவர்களைக் குறிக்கும் சமூகப் பொருளை, பழமையான அல்லது தெளிவற்ற சொல்லாக்கமின்றி வெளிப்படுத்துகிறது.
- source_word: וּמִקְנַת כֶּסֶף
  choice: பணம் கொடுத்து வாங்கப்பட்டவர்கள்
  rationale: பணம் செலுத்திப் பெறப்பட்ட நபர்களைக் குறிக்கும் பரிவர்த்தனைப் பொருளை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: מֵאֵת בֶּן נֵכָר
  choice: அந்நியன் ஒருவனிடமிருந்து
  rationale: בֶּן נֵכָר என்பதன் சொற்பொருள் ‘அந்நியத்தின் மகன்’ என்றாலும், இங்கு அது அந்நியன் அல்லது வெளியாளர் என்னும் எபிரெய மரபுத்தொடர். தமிழில் ‘அந்நியன்’ அதன் சூழற்பொருளைத் தெளிவாகத் தருகிறது.
- source_word: נִמֹּלוּ
  choice: விருத்தசேதனம் செய்யப்பட்டார்கள்
  rationale: நிஃபால் வடிவத்தின் செயப்பாட்டு பொருளைக் காக்கிறது; அவர்கள் தாங்களே செய்துகொண்டார்கள் என்ற பிரதிபலிப்பு அர்த்தத்தைச் சேர்க்கவில்லை.
- source_word: אִתּוֹ
  choice: அவனோடு
  rationale: ஆபிரகாமுடன் சேர்ந்து அல்லது அதே நிகழ்வில் விருத்தசேதனம் செய்யப்பட்டதைச் சுருக்கமாகக் காட்டுகிறது.
