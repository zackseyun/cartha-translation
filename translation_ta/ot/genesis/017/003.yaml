  yaml_path: translation/ot/genesis/017/003.yaml
  text: Then Abram fell on his face, and God spoke with him, saying,
translation:
  language: ta
  text: 'அப்போது ஆபிராம் முகங்குப்புற விழுந்தார். கடவுள் அவருடன் பேசித் தாம் கூறியதாவது:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: விழுந்தார்
  rationale: נפל என்பதன் Qal wayyiqtol வடிவம் கடந்தகாலத்தில் நிறைவுற்ற தொடர் நிகழ்வைக் குறிக்கிறது. தொடர்ந்து வரும் ‘முகங்குப்புற’ என்ற சொல் பணிந்து விழுதலைத் தெளிவாக்குவதால், வினையில் கூடுதல் விளக்கம் சேர்க்கப்படவில்லை.
- source_word: עַל־פָּנָיו
  choice: முகங்குப்புற
  rationale: உடலைத் தாழ்த்திப் பணிவதைக் குறிக்கும் எபிரெய வழக்கை, அதன் உடல்நிலைப் படிமத்தையும் இயல்பான நவீனத் தமிழையும் காக்கும் வகையில் மொழிபெயர்க்கிறது.
- source_word: אַבְרָם
  choice: ஆபிராம்
  rationale: இக்கட்டத்தில் பெயர் இன்னும் ஆபிரகாம் என்று மாற்றப்படவில்லை; ஆகவே எபிரெயப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: וַיְדַבֵּר
  choice: பேசி
  rationale: דבר என்பதன் Piel வடிவத்தின் இயல்பான பொருள் ‘பேசுதல்’. அடுத்து வரும் לֵאמֹר உடன் இணைந்து தமிழ் வாக்கியத்தில் இயல்பாக அமைய வினையெச்சமாக வழங்கப்பட்டுள்ளது.
- source_word: אִתּוֹ
  choice: அவருடன்
  rationale: את என்ற முன்னிடைச்சொல்லின் ‘உடன்’ என்ற உறவுசார் நுணுக்கத்தைப் பாதுகாக்கிறது; ‘அவரிடம்’ என்பதும் சூழலில் சாத்தியமான இயல்பான மாற்று.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும், இங்கு வினை ஒருமையில் உள்ளது; சூழலும் ஒரே கடவுளையே குறிக்கிறது. நவீன பொதுத்தமிழில் ‘கடவுள்’ இயல்பானதும் கண்ணியமானதும் ஆகும்.
- source_word: לֵאמֹר
  choice: சொன்னதாவது
  rationale: אמר என்பதன் infinitive construct நேரடி உரையை அறிமுகப்படுத்துகிறது. அடுத்த வசனத்தில் தொடங்கும் கடவுளின் உரைக்குத் தெளிவாக வழிவகுக்கும் இயல்பான தமிழ் வடிவம் இது.
- source_word: וַ
  choice: அப்போது
  rationale: தொடக்க waw நிகழ்வுகளின் தொடர்ச்சியைச் சுட்டுகிறது; வெறும் ‘மற்றும்’ என்பதைக் காட்டிலும் ‘அப்போது’ நவீனத் தமிழில் கதை நகர்வை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֱלֹהִים என்பதன் எண்ணும் குறிப்பும்
  choice: ஒருமை ‘கடவுள்’
  alternative: வடிவவியல் அடிப்படையில் மட்டும் ‘கடவுள்கள்’
  rationale: אֱלֹהִים வடிவத்தில் பன்மைபோல் இருந்தாலும், இங்கு அதனுடன் வரும் וַיְדַבֵּר வினை ஒருமையில் உள்ளது; உடன்படிக்கையின் கடவுள் ஆபிராமுடன் பேசும் சூழலும் ஒருமைக் குறிப்பை உறுதிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘முகங்குப்புற’ மூலத்தின் உடல்நிலைப் படிமத்தைச் சுருக்கமாகக் காக்கிறது; ‘அவருடன் பேசி’ אִתּוֹ என்பதிலுள்ள உறவுசார் நுணுக்கத்தைத் தக்கவைக்கிறது. வசனம் அடுத்த வசனின் நேரடி உரையை அறிமுகப்படுத்துவதால் முடிவில் முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
