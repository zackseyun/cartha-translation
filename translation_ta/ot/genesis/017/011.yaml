id: GEN.17.11
reference: Genesis 17:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/נְמַלְתֶּ֕ם אֵ֖ת בְּשַׂ֣ר עָרְלַתְ/כֶ֑ם וְ/הָיָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵינֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/011.yaml
  text: You shall circumcise the flesh of your foreskin[a], and it shall be a sign of the covenant between me and you.
translation:
  language: ta
  text: நீங்கள் உங்கள் நுனித்தோலின் சதையை விருத்தசேதனம் செய்ய வேண்டும்; அது எனக்கும் உங்களுக்கும் இடையிலான உடன்படிக்கையின் அடையாளமாக[a] இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உடன்படிக்கையின் சின்னமாக.”
    reason: אוֹת என்பதற்கு ‘அடையாளம்’, ‘சின்னம்’ ஆகிய இரு நெருங்கிய பொருள்களும் உள்ளன.
lexical_decisions:
- source_word: וּנְמַלְתֶּם
  choice: நீங்கள் ... விருத்தசேதனம் செய்ய வேண்டும்
  rationale: இணைப்புடன் வந்துள்ள Qal வினைமுற்று இங்கு உடன்படிக்கை சார்ந்த கட்டளையின் வலிமையைக் கொண்டுள்ளது. நவீனத் தமிழில் ‘செய்ய வேண்டும்’ என்பது அந்தக் கட்டளைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּשַׂר
  choice: சதையை
  rationale: எபிரெயச் சொல்லின் நேரடியான உடல்சார்ந்த பொருளைத் தக்கவைத்து, நுனித்தோலைக் குறிக்கும் தொடருடன் இணைக்கிறது.
- source_word: עָרְלַתְכֶם
  choice: உங்கள் நுனித்தோலின்
  rationale: இந்த உடற்கூறு சார்ந்த சூழலில் עָרְלָה என்பது ‘நுனித்தோல்’ எனப் பொருள்படும். இரண்டாம் நபர் பன்மை உருபை ‘உங்கள்’ தக்கவைக்கிறது.
- source_word: וְהָיָה
  choice: அது ... இருக்கும்
  rationale: முன்னர் கட்டளையிடப்பட்ட விருத்தசேதனத்தைச் சுட்டி, அதன் உடன்படிக்கை சார்ந்த நிலையை எதிர்கால/விதிப்பொருளில் இயல்பாகக் கூறுகிறது.
- source_word: לְאוֹת
  choice: அடையாளமாக
  rationale: אוֹת என்பதன் வெளிப்படையான பொருள் ‘அடையாளம்’; לְ முன்னொட்டின் பயனைக் காட்ட ‘அடையாளமாக’ என்பது இயல்பான தமிழ் வடிவம்.
- source_word: בְּרִית
  choice: உடன்படிக்கையின்
  rationale: சூழலில் தேவன் ஆபிரகாமுடன் ஏற்படுத்தும் குறிப்பிட்ட உடன்படிக்கையே சுட்டப்படுகிறது; தமிழின் வேற்றுமைத் தொடரில் அந்தக் குறிப்புத்தன்மை இயல்பாக வெளிப்படுகிறது.
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: எனக்கும் உங்களுக்கும் இடையிலான
  rationale: எபிரெய மூலத்தின் உறவுநிலையையும் இரண்டாம் நபர் பன்மையையும் நேரடியாகவும் இயல்பாகவும் தக்கவைக்கிறது.
theological_decisions:
- issue: விருத்தசேதனத்தின் உடன்படிக்கை சார்ந்த தன்மை
  choice: உடன்படிக்கையின் அடையாளம்
  alternative: உடன்படிக்கையின் சின்னம்
  rationale: மூலம் விருத்தசேதனத்தை உடன்படிக்கையின் אוֹת என்று கூறுகிறது. அதன் இறையியல் முக்கியத்துவத்தைத் தக்கவைத்தாலும், அது எவ்வாறு செயல்படுகிறது என்பது குறித்து வசனம் கூறாத சமயப்பிரிவு சார்ந்த விளக்கத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘விருத்தசேதனம்’ என்பது இச்சூழலுக்குரிய நிலைபெற்ற சொல்லாக இருப்பதால் தக்கவைக்கப்பட்டது; பழைய நடையின் ‘பண்ணக்கடவீர்கள்’ தவிர்க்கப்பட்டது.
