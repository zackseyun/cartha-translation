  text: I will bless her[a], and moreover I will give you a son by her. I will bless her, and she will become nations[b]; kings of peoples will come from her.
translation:
  language: ta
  text: நான் அவளை ஆசீர்வதிப்பேன்; மேலும், அவள் மூலம் உனக்கு ஒரு மகனைக் கொடுப்பேன். நான் அவளை ஆசீர்வதிப்பேன்; அவளிடமிருந்து நாடுகள் தோன்றும்[a]. மக்களினங்களின் அரசர்கள் அவளிடமிருந்து வருவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவள் நாடுகளின் தாயாவாள்.” எபிரெயத்தில் சொல்லுக்கு சொல், “அவள் நாடுகளாக இருப்பாள்/ஆவாள்.”
    reason: மூலத்தின் குறிப்பிடத்தக்க சொல்லாட்சியையும் இயல்பான மாற்று மொழிபெயர்ப்பையும் காட்டுதல்
lexical_decisions:
- source_word: וּבֵרַכְתִּי אֹתָהּ / וּבֵרַכְתִּיהָ
  choice: நான் அவளை ஆசீர்வதிப்பேன் / நான் அவளை ஆசீர்வதிப்பேன்
  rationale: ברך என்பதன் உடன்படிக்கைச் சூழலிலுள்ள இறை அருள் சார்ந்த வலிமையை ‘ஆசீர்வதிப்பேன்’ நேரடியாகத் தக்கவைக்கிறது. எபிரெய உரையின் வலியுறுத்தும் மறுபடியும் கூறுதல் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְגַם
  choice: மேலும்
  rationale: இது வெறும் இணைப்பைத் தாண்டிய கூட்டல் மற்றும் வலியுறுத்தல் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: נָתַתִּי מִמֶּנָּה לְךָ בֵּן
  choice: அவள் மூலம் உனக்கு ஒரு மகனைக் கொடுப்பேன்
  rationale: வாக்குறுதியின் சூழலில் qatal வடிவம் எதிர்கால உறுதியைக் குறிக்கிறது. ‘அவள் மூலம்’ என்பது மகன் சாராளிடமிருந்து பிறப்பான் என்ற மூல உரையின் உறவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְהָיְתָה לְגוֹיִם
  choice: அவள் நாடுகளாக உருவாவாள்
  rationale: ‘அவள் நாடுகளாக இருப்பாள்/ஆவாள்’ என்ற எபிரெய மொழியின் குறிப்பிடத்தக்க கூட்டு உருவகத்தைப் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘தாய்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: גוֹיִם
  choice: நாடுகள்
  rationale: முற்பிதாக்களின் வாக்குறுதிச் சூழலில் பல அரசியல்-இனக் குழுக்களைக் குறிக்கும் இயல்பான நேரடி இணைச்சொல்.
- source_word: מַלְכֵי עַמִּים
  choice: மக்களினங்களின் அரசர்கள்
  rationale: עמים என்பதை ‘மக்களினங்கள்’ என்று தருவதால் முந்தைய גוים (‘நாடுகள்’) என்பதிலிருந்து உள்ள சொல் வேறுபாடு பாதுகாக்கப்படுகிறது.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: அவளிடமிருந்து தோன்றுவார்கள்
  rationale: ‘அவளிடமிருந்து இருப்பார்கள்’ என்ற சொல்லாட்சியின் வம்சத்தோற்றப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சாராளிடமிருந்து வரும் நாடுகள் குறித்த வாக்குறுதி
  choice: அவள் நாடுகளாக உருவாவாள்; மக்களினங்களின் அரசர்கள் அவளிடமிருந்து தோன்றுவார்கள்
  alternative: அவள் நாடுகளுக்குத் தாயாவாள்; மக்களினங்களின் அரசர்கள் அவளிடமிருந்து தோன்றுவார்கள்
  rationale: ‘தாய்’ என்பது கருத்தில் அடங்கியிருந்தாலும் எபிரெய மூலத்தில் வெளிப்படையாக இல்லை. ஆகவே, சாராளிலிருந்து பல நாடுகளும் அரச வம்சங்களும் உருவாகும் உடன்படிக்கை வாக்குறுதியின் கூட்டு உருவகத்தையும் அதன் சிறு பதற்றத்தையும் முதன்மை உரை தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘ஆசீர்வதிப்பேன்’ என்ற உடன்படிக்கைச் சொல் மற்றும் எபிரெய உரையின் மறுபடியும் கூறுதல் தக்கவைக்கப்பட்டுள்ளன. ‘அவள் நாடுகளாக உருவாவாள்’ என்பது தமிழில் சற்றுக் குறிப்பிடத்தக்க சொல்லாட்சியாக இருந்தாலும், மூலத்தின் திட்டமிட்ட கூட்டு உருவகத்தைப் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் இயல்பான பொருளை விளக்குகிறது.
