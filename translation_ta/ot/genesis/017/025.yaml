base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/025.yaml
  text: And Ishmael his son was thirteen years old when the flesh of his foreskin was circumcised[a].
translation:
  language: ta
  text: அவனுடைய மகனான இஸ்மவேல், தன் நுனித்தோலின் சதையில் விருத்தசேதனம் செய்யப்பட்டபோது, பதின்மூன்று வயதுடையவனாக இருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִשְׁמָעֵאל
  choice: இஸ்மவேல்
  rationale: வாவ் இணைப்புச்சொல் எபிரெயக் கதைத் தொடரை மட்டுமே குறிக்கிறது; தமிழில் வசனத்தை இயல்பாகத் தொடங்க தனியே மொழிபெயர்க்கப்படவில்லை. பெயர் வழக்கமான தமிழ் வடிவில் தரப்பட்டுள்ளது.
- source_word: בְּנוֹ
  choice: அவனுடைய மகன்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியை நேரடியாகப் பேணுகிறது; சூழலில் இது ஆபிரகாமைக் குறிக்கிறது.
- source_word: בֶּן שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: பதின்மூன்று வயதுடையவனாக இருந்தான்
  rationale: ‘பதின்மூன்று ஆண்டுகளின் மகன்’ என்ற எபிரெய வயதுக் கூறை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: בְּהִמֹּלוֹ
  choice: விருத்தசேதனம் செய்யப்பட்டபோது
  rationale: בְּ உடன் வந்த பெயரெச்ச வினைவடிவின் காலப் பொருளையும், இங்கு உள்ள செயப்பாட்டு உணர்வையும் வெளிப்படுத்துகிறது.
- source_word: בְּשַׂר עָרְלָתוֹ
  choice: தனது நுனித்தோலின் சதை
  rationale: மூலத்தில் உள்ள உடற்கூறு சார்ந்த தெளிவான சொற்றொடரை ‘விருத்தசேதனம் செய்யப்பட்டான்’ என்று மட்டும் சுருக்காமல் பேணுகிறது.
theological_decisions:
- issue: உடன்படிக்கையின் அடையாளத்தை விவரிக்கும் உடற்கூறு மொழி
  choice: ‘தனது நுனித்தோலின் சதை’ என்று வெளிப்படையாகப் பேணப்பட்டது
  alternative: ‘அவன் விருத்தசேதனம் செய்யப்பட்டபோது’ என்று மட்டும் சுருக்குதல்
  rationale: மூல எபிரெயம் செயலை மட்டுமல்ல, விருத்தசேதனம் செய்யப்பட்ட உடற்பகுதியையும் திட்டவட்டமாகக் குறிப்பிடுகிறது; அந்த உடன்படிக்கைச் சொற்சாயலை மொழிபெயர்ப்பு நீக்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘விருத்தசேதனம்’ என்பது வேதாகமப் பயன்பாட்டில் நிலைபெற்ற சொல்லாக இருப்பதால் பயன்படுத்தப்பட்டது; மூலத்தின் வெளிப்படையான உடற்கூறு மொழியும் பேணப்பட்டது.
