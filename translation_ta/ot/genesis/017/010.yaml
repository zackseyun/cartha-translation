- issue: இரண்டாம் நபர் எண்ணில் உள்ள மாற்றத்தைப் பாதுகாத்தல்
  choice: உங்களுக்கும் … உன் சந்ததிக்கும்
  alternative: உனக்கும் … உன் சந்ததிக்கும்
  rationale: எபிரெய மூலத்தில் בֵּינֵיכֶם பன்மையாகவும் זַרְעֲךָ மற்றும் אַחֲרֶיךָ ஒருமையாகவும் உள்ளன. தமிழில் சற்றே பதற்றமாகத் தோன்றினாலும், இந்த உண்மையான இலக்கண மாற்றம் ஒரே எண்ணாகச் சீராக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘விருத்தசேதனம்’ என்பது இச்சடங்குக்கான பரவலாக அறியப்பட்ட துல்லியமான சொல்லாக வைக்கப்பட்டது. மூலத்தில் உள்ள ஒருமை–பன்மை மாற்றம் திட்டமிட்டு பாதுகாக்கப்பட்டது.
