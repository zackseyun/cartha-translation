base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/010.yaml
  text: 'This is my covenant[a], which you shall keep, between me and you and your offspring after you: every male among you shall be circumcised.'
translation:
  language: ta
  text: 'எனக்கும் உங்களுக்கும், உனக்குப் பின் வரும் உன் சந்ததிக்கும்[a] இடையே நீங்கள் கடைப்பிடிக்க வேண்டிய என் உடன்படிக்கை இதுவே: உங்களிடையுள்ள ஒவ்வோர் ஆணும் விருத்தசேதனம் செய்யப்பட வேண்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்குப் பின் வரும் உன் வழித்தோன்றல்களுக்கும்.” எபிரெயச் சொல்லான זֶרַע ஒரு கூட்டு ஒருமைச் சொல்; அது சந்ததியையோ வழித்தோன்றல்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת בְּרִיתִי
  choice: என் உடன்படிக்கை இதுவே
  rationale: எபிரெய மொழியில் வெளிப்படையாக இல்லாத இணைப்புவினையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; בְּרִית என்பதற்கு வேதாகமச் சூழலில் நிலையான, உறவையும் கட்டுப்பாட்டையும் குறிக்கும் ‘உடன்படிக்கை’ பயன்படுத்தப்பட்டது.
- source_word: אֲשֶׁר תִּשְׁמְרוּ
  choice: நீங்கள் கடைப்பிடிக்க வேண்டிய
  rationale: இங்கு imperfect வடிவம் உடன்படிக்கையோடு இணைந்த கடமையை வெளிப்படுத்துகிறது; ‘கடைப்பிடிக்க வேண்டிய’ என்பது கட்டளையின் வலிமையையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין זַרְעֲךָ אַחֲרֶיךָ
  choice: எனக்கும் உங்களுக்கும், உனக்குப் பின் வரும் உன் சந்ததிக்கும் இடையே
  rationale: மூலத்தில் உள்ள ‘நீங்கள்’ என்ற பன்மையையும் ‘உன்’ என்ற ஒருமையையும் மறைக்காமல் காக்கிறது. זֶרַע என்பதன் கூட்டு இயல்பை ‘சந்ததி’ வெளிப்படுத்துகிறது; אַחֲרֶיךָ காலத் தொடர்ச்சியாக ‘உனக்குப் பின் வரும்’ என்று தரப்பட்டது.
- source_word: הִמּוֹל לָכֶם כָּל זָכָר
  choice: உங்களிடையே உள்ள ஆண்கள் அனைவரும் விருத்தசேதனம் செய்யப்பட வேண்டும்
  rationale: infinitive absolute இங்கு உடன்படிக்கையின் கட்டாய நிபந்தனையாகச் செயல்படுகிறது. ‘செய்யப்பட வேண்டும்’ அதன் கட்டளை வலிமையைக் காக்கிறது; לָכֶם சூழலின்படி ‘உங்களிடையே’ என்றும் כָּל זָכָר பாலினக் குறிப்பைத் துல்லியமாக ‘ஆண்கள் அனைவரும்’ என்றும் மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: உடன்படிக்கையின் அடையாளத்துக்கான கட்டளையில் பாலினக் குறிப்பை மொழிபெயர்த்தல்
  choice: உங்களிடையே உள்ள ஆண்கள் அனைவரும் விருத்தசேதனம் செய்யப்பட வேண்டும்
