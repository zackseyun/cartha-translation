id: GEN.17.4
reference: Genesis 17:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֲנִ֕י הִנֵּ֥ה בְרִיתִ֖/י אִתָּ֑/ךְ וְ/הָיִ֕יתָ לְ/אַ֖ב הֲמ֥וֹן גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/004.yaml
  text: As for me[a], behold, my covenant is with you[b], and you will become the father of a multitude of nations.
translation:
  language: ta
  text: நானோ[a]—இதோ, என் உடன்படிக்கை உன்னோடு இருக்கிறது; நீ திரளான நாடுகளுக்குத் தந்தையாவாய்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என்னைப் பொறுத்தவரை—இதோ, என் உடன்படிக்கை உன்னோடு இருக்கிறது’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் தொடக்கத்திலுள்ள தனிநிலைப் பிரதிப்பெயரும் சுட்டிக்காட்டும் இடைச்சொல்லும் வலியுறுத்தலைத் தருகின்றன.
    reason: lexical_alternative
  - marker: b
    text: ‘நீ திரளான நாடுகளுக்குத் தந்தையாக இருப்பாய்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: நானோ
  rationale: தனிநிலைப் பிரதிப்பெயர் வலியுறுத்தப்பட்டுத் தலைப்பாக்கப்பட்டுள்ளது. தமிழில் ‘நானோ’ என்பது இந்த உரையாடல் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: பின்வரும் அறிவிப்பின்மீது கவனத்தைத் திருப்பும் சுட்டிக்காட்டும் இடைச்சொல்லின் நேரடியான, கண்ணியமான தமிழ் வடிவம்.
- source_word: בְרִיתִי
  choice: என் உடன்படிக்கை
  rationale: ஆபிரகாம் வரலாற்றில் வரும் நிலையான உடன்படிக்கைச் சொல்லையும் அதன் இறையியல் முக்கியத்துவத்தையும் காக்கிறது.
- source_word: אִתָּךְ
  choice: உன்னோடு
  rationale: எபிரெயச் சொல் நேரடியாக ‘உன்னோடு’ எனப் பொருள்படும்; ‘எனக்கும் உனக்கும் இடையில்’ என்று மூலத்தில் இல்லாத விரிவைச் சேர்க்கவில்லை.
- source_word: וְהָיִיתָ
  choice: நீ … தந்தையாவாய்
  rationale: உடன்படிக்கை அறிவிப்பிலுள்ள எதிர்கால விளைவு மற்றும் புதிய நிலைக்கு வருதல் ஆகியவற்றை ‘ஆவாய்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְאָב
  choice: தந்தையாக
  rationale: ஒரு வரையறுக்கும் பங்கிற்கு ஆபிராம் நியமிக்கப்படுவதைத் தமிழில் இயல்பாகக் கூறுகிறது; மூலத்தின் ‘தந்தையாக/தந்தையாய்’ என்ற உறவைப் பேணுகிறது.
- source_word: הֲמוֹן
  choice: திரளான
  rationale: மிகப் பெரிய எண்ணிக்கை அல்லது பெருந்திரள் என்ற பொருளைத் தருகிறது; அடுத்த வசனத்தின் பெயரிடல் விளக்கத்துடனான கருத்துத் தொடர்பையும் காக்கிறது.
- source_word: גּוֹיִם
  choice: நாடுகள்
  rationale: பிற்காலத் தொழில்நுட்பப் பொருளில் ‘புறஜாதிகள்’ என்று குறுக்காமல், ஆபிரகாமிலிருந்து உருவாகும் பல நாடுகள் அல்லது மக்கள் குழுக்களைப் பொதுவாகக் குறிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கை அறிவிப்பும் ஆபிரகாமின் பங்கும்
  choice: ‘என் உடன்படிக்கை உன்னோடு இருக்கிறது; நீ திரளான நாடுகளுக்குத் தந்தையாவாய்’ என்று நேரடியான தெய்வீக வாக்குறுதியாக மொழிபெயர்த்தல்.
  alternative: ‘நான் உன்னோடு என் உடன்படிக்கையை ஏற்படுத்துகிறேன்’ அல்லது ‘நீ பல மக்களின் மூதாதையாவாய்’ என்று விளக்கமாக விரித்துரைத்தல்.
  rationale: மூலம் உடன்படிக்கை உறவையும் அதன் வாக்குறுதியான விளைவையும் நேரடியாகக் கூறுகிறது. ‘ஏற்படுத்துகிறேன்’ என்ற வினையையோ ‘மூதாதை’ என்ற விளக்கச் சொல்லையோ சேர்க்காமல், அதன் உடன்படிக்கை மற்றும் வாக்குறுதித் தன்மையை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நானோ—இதோ’ என்ற அமைப்பு மூலத்தின் தொடக்க வலியுறுத்தலைக் காக்கிறது; ‘உடன்படிக்கை’ என்பது ஆதியாகமத்தின் தொடர்ச்சியான முக்கியச் சொல்லாகப் பேணப்பட்டுள்ளது.
