  text: On that very day Abraham and his son Ishmael were circumcised.
translation:
  language: ta
  text: அதே நாளிலேயே ஆபிரகாமும் அவருடைய மகன் இஸ்மவேலும் விருத்தசேதனம் செய்யப்பட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: அதே நாளிலேயே
  rationale: இந்த எபிரெய காலச் சொற்றொடர் குறிப்பிட்ட அந்த நாளையே வலியுறுத்துகிறது. ‘அதே நாளிலேயே’ என்பது அந்த வலியுறுத்தலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: נִמּוֹל
  choice: விருத்தசேதனம் செய்யப்பட்டார்கள்
  rationale: இது நிஃபால் வடிவிலுள்ள செயப்பாட்டு வினை. எபிரெயத்தில் வினை ஒருமையில் இருந்தாலும், அதற்குப் பின்வரும் ஆபிரகாம் மற்றும் இஸ்மவேல் என்ற கூட்டெழுவாயைத் தமிழில் இயல்பாகப் பன்மை வினையால் குறிக்கப்படுகிறது.
- source_word: אַבְרָהָם
  choice: ஆபிரகாம்
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: וְיִשְׁמָעֵאל
  choice: இஸ்மவேலும்
  rationale: இணைப்புச் சொல்லை ‘-உம்’ மூலம் இயல்பாக வெளிப்படுத்தி, பெயருக்கு நிலையான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּנוֹ
  choice: அவருடைய மகன்
  rationale: மூன்றாம் ஆண்பால் ஒருமை உரிமைப் பின்னொட்டு இஸ்மவேலை ஆபிரகாமின் மகனாகக் குறிப்பிடுகிறது. மரியாதையான மனிதச் சுட்டில் ‘அவருடைய’ என்பது இயல்பான நவீனத் தமிழ்.
