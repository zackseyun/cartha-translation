source:
  edition: WLC
  text: וְ/אֶת בְּרִיתִ֖/י אָקִ֣ים אֶת יִצְחָ֑ק אֲשֶׁר֩ תֵּלֵ֨ד לְ/ךָ֤ שָׂרָה֙ לַ/מּוֹעֵ֣ד הַ/זֶּ֔ה בַּ/שָּׁנָ֖ה הָ/אַחֶֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/021.yaml
  text: But I will establish my covenant with Isaac[a], whom Sarah will bear to you at this time next year.
translation:
  language: ta
  text: ஆனால், சாராள் அடுத்த ஆண்டு இதே குறித்த காலத்தில் உனக்குப் பெற்றெடுக்கவிருக்கும் ஈசாக்குடன் என் உடன்படிக்கையை நிலைநிறுத்துவேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும், சாராள் அடுத்த ஆண்டு இதே குறித்த காலத்தில் உனக்குப் பெற்றெடுக்கவிருக்கும் ஈசாக்குடன் என் உடன்படிக்கையை நிலைநிறுத்துவேன்.” எபிரெய இணைப்புச்சொல்லை எளிமையாக “மேலும்” என்றும் மொழிபெயர்க்கலாம்; ஆனால் முந்தைய வசனத்தில் இஸ்மவேலைக் குறித்துக் கொடுக்கப்பட்ட வாக்குறுதியுடன் உள்ள வேறுபாட்டை இச்சூழல் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: ஆனால்
  rationale: וְ என்பது அடிப்படையில் ‘மற்றும்’ எனப் பொருள்படலாம்; எனினும் முந்தைய வசனத்தில் இஸ்மவேலைக் குறித்த வாக்குறுதியிலிருந்து ஈசாக்குடனான உடன்படிக்கைக்கு மாறும் எதிர்மறைத் தொடர்பை இங்கு ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּרִיתִי
  choice: என் உடன்படிக்கை
  rationale: בְּרִית என்பது இச்சூழலில் இறைவன் ஏற்படுத்தும் உறுதியான உடன்படிக்கையைக் குறிக்கிறது; முதலாம் நபர் ஒருமை உரிமை விகுதி ‘என்’ என வழங்கப்பட்டுள்ளது.
- source_word: אָקִים
  choice: நிலைநிறுத்துவேன்
  rationale: קום என்பதன் ஹிஃபில் வடிவம் உடன்படிக்கையை உறுதியாக ஏற்படுத்தி நிலைபெறச் செய்வதைக் குறிக்கிறது; ‘நிலைநிறுத்துவேன்’ இந்த உடன்படிக்கைச் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: אֶת יִצְחָק
  choice: ஈசாக்குடன்
  rationale: אֶת நேரடி செயப்படுபொருள் குறியீடாக இருந்தாலும், தமிழில் உடன்படிக்கையின் உறவுப் பங்காளியை ‘ஈசாக்குடன்’ என்று கூறுவது இயல்பாகவும் பொருளுக்கு உண்மையாகவும் உள்ளது.
- source_word: אֲשֶׁר תֵּלֵד לְךָ שָׂרָה
  choice: சாராள் உனக்குப் பெற்றெடுக்கப்போகிற
  rationale: உறவுப்பெயரெச்சத் தொடர் வாக்குறுதியான மகனை அடையாளப்படுத்துகிறது; לְךָ என்பதிலுள்ள தந்தையுடனான தொடர்பு ‘உனக்கு’ எனப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לַמּוֹעֵד הַזֶּה בַּשָּׁנָה הָאַחֶרֶת
  choice: அடுத்த ஆண்டு இதே குறித்த காலத்தில்
  rationale: מוֹעֵד என்பது குறிக்கப்பட்ட அல்லது நிர்ணயிக்கப்பட்ட நேரத்தைக் குறிக்கிறது; בַּשָּׁנָה הָאַחֶרֶת என்பது ‘அடுத்த ஆண்டு’ என இயல்பாக வழங்கப்படுகிறது.
theological_decisions:
- issue: உடன்படிக்கை ஈசாக்குடன் நிலைநிறுத்தப்படுதல்
  choice: இறைவன் தமது உடன்படிக்கையை ஈசாக்குடன் நிலைநிறுத்துவார் என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: இஸ்மவேலுக்கான முந்தைய ஆசீர்வாத வாக்குறுதியையும் இந்த உடன்படிக்கையையும் ஒன்றாகக் கருதுதல்.
  rationale: வசனம் ஈசாக்கை உடன்படிக்கையின் பங்காளியாகத் தெளிவாகக் குறிப்பிடுகிறது; ஆனால் இதிலிருந்து பிற்காலத் தத்துவ முடிவுகள் எதுவும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘உடன்படிக்கை’, ‘நிலைநிறுத்துவேன்’, ‘குறித்த காலம்’ ஆகியவை மூலத்தின் உடன்படிக்கை மற்றும் நிர்ணயிக்கப்பட்ட நேரம் சார்ந்த நுணுக்கங்களைப் பாதுகாக்கின்றன.
