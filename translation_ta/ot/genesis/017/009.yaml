base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/009.yaml
  text: And God said to Abraham[a], “As for you, you shall keep my covenant, you and your offspring after you throughout their generations.”
translation:
  language: ta
  text: 'கடவுள் ஆபிரகாமிடம் சொன்னார்: “நீயோ என் உடன்படிக்கையைக் கடைப்பிடிக்க வேண்டும்—நீயும், உனக்குப் பின்வரும் உன் சந்ததியும்[a], தலைமுறைதோறும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “உன் வித்து.” எபிரெயச் சொல் ஒருமை வடிவில் இருந்தாலும், இங்கு கூட்டாக வழித்தோன்றல்களைக் குறிக்கிறது.
    reason: זֶרַע என்ற எபிரெயச் சொல்லின் நேரடி உருவகத்தையும் அதன் ஒருமை-கூட்டுப்பொருள் தன்மையையும் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: சொன்னார்
  rationale: தொடரும் கதைநடையில் இயல்பான இறந்தகால வினையாக உள்ளது; எபிரெய வாவ்-தொடர்நிலையின் முன்னேற்றத்தை வசனச் சூழல் வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: ஆபிரகாமுடன் உடன்படிக்கை பேசுகிற இறைவனைக் குறிக்கும் பொதுவான, நேரடியான நவீனத் தமிழ் சொல்.
- source_word: אֶל־אַבְרָהָם
  choice: ஆபிரகாமிடம்
  rationale: எபிரெய உரையில் பெயர் ‘ஆபிரகாம்’ என்றே உள்ளது; אֶל என்பதன் உரையாடல் நோக்கம் தமிழில் ‘-இடம்’ மூலம் இயல்பாகத் தரப்படுகிறது.
- source_word: וְאַתָּה
  choice: நீயோ
  rationale: முன்னிறுத்தப்பட்ட தனிப்பெயரின் வலியுறுத்தலையும், கடவுளின் வாக்குறுதிகளிலிருந்து ஆபிரகாமின் கடமைக்கான உரையாடல் மாற்றத்தையும் ‘நீயோ’ தெளிவாகக் காட்டுகிறது.
- source_word: אֶת־בְּרִיתִי
  choice: என் உடன்படிக்கையை
  rationale: முதல் நபர் உரிமை விகுதியையும் மையமான உடன்படிக்கைச் சொல்லையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: תִּשְׁמֹר
  choice: கடைப்பிடிக்க வேண்டும்
  rationale: שׁמר என்பதன் ‘காத்தல்/கடைப்பிடித்தல்’ பொருள்களில், உடன்படிக்கை சார்ந்த கடமையை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: אַתָּה וְזַרְעֲךָ
  choice: நீயும் ... உன் சந்ததியும்[a]
  rationale: மீண்டும் வரும் ‘நீ’ என்பதையும், זֶרַע என்பதன் கூட்டுப்பொருளையும் பாதுகாக்கிறது. சொல்லின் நேரடி ‘வித்து’ உருவகம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אַחֲרֶיךָ
  choice: உனக்குப் பின்வரும்
  rationale: ஆபிரகாமுக்குப் பின்னான வழித்தோன்றல் தொடர்ச்சியைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: לְדֹרֹתָם
  choice: தலைமுறைதோறும்
  rationale: அடுத்தடுத்த தலைமுறைகள் முழுவதிலும் தொடரும் கடமையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உடன்படிக்கைக் கடமையை மேலதிக சட்ட அல்லது சடங்கு நுணுக்கம் சேர்க்காமல் மொழிபெயர்த்தல்
  choice: என் உடன்படிக்கையைக் கடைப்பிடிக்க வேண்டும்
  alternative: என் உடன்படிக்கையைக் காக்க வேண்டும்
  rationale: இந்த வசனம் ஆபிரகாமுக்கும் அவன் சந்ததிக்கும் உள்ள உடன்படிக்கைப் பொறுப்பைச் சொல்கிறது. ‘கடைப்பிடிக்க’ என்பது கட்டளையின் வலிமையைத் தக்கவைத்தபடி, உரையில் இல்லாத சமயப்பிரிவு சார்ந்த பொருளைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீயோ’ மூலத்தின் வலியுறுத்தலைத் தக்கவைக்கிறது; நீண்ட கோடு, அதன்பின் வரும் ‘நீயும் ... சந்ததியும்’ என்ற விளக்கச் சேர்க்கையை மூலத்தின் வாக்கிய அமைப்புக்கு நெருக்கமாக இணைக்கிறது.
