base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/017.yaml
  text: Then Abraham fell on his face and laughed[a], and said in his heart, “Will a child be born to a man a hundred years old? And will Sarah, who is ninety years old, give birth?”
translation:
  language: ta
  text: அப்போது ஆபிரகாம் முகங்குப்புற விழுந்து சிரித்தார். அவர் தம் உள்ளத்தில், “நூறு வயதான ஒருவருக்கு ஒரு மகன் பிறப்பானா? தொண்ணூறு வயதான சாராள் பிள்ளை பெறுவாளா?” என்று சொல்லிக்கொண்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: முகங்குப்புற விழுந்து
  rationale: எபிரெயச் சொற்றொடர் முகம் தரையில் படும்படியான விழுதல் அல்லது பணிவுடன் விழுதலைக் குறிக்கிறது; தமிழில் இயல்பாகவும் நேரடியாகவும் இவ்வாறு கூறலாம்.
- source_word: וַיִּצְחָק
  choice: சிரித்தார்
  rationale: צחק என்பதன் நேரடியான பொருள் ‘சிரி’; மகிழ்ச்சியா அவநம்பிக்கையா என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல் விடுகிறது.
- source_word: וַיֹּאמֶר בְּלִבּוֹ
  choice: தம் உள்ளத்தில் ... என்று சொல்லிக்கொண்டார்
  rationale: சொல்லப்படாத உள்ளார்ந்த பேச்சைக் குறிக்கும் எபிரெய மரபுத்தொடரின் கருத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַלְּבֶן
  choice: ஒரு மகன்
  rationale: בן என்பது இங்கு நேரடியாக ‘மகன்’ என்று உள்ளது; சூழலில் வாக்குறுதியளிக்கப்பட்ட ஆண் சந்ததியைக் குறிக்கும் சொல் என்பதால் பாலினத்தைப் பொதுமைப்படுத்தாமல் மூலத்தைப் பின்பற்றுகிறது.
- source_word: יִוָּלֵד
  choice: பிறப்பானா
  rationale: ילד என்பதன் நிஃபால் வடிவம் பிறத்தலைக் குறிக்கும் வழக்கமான செயல்படுபொருளற்ற வடிவம்.
- source_word: מֵאָה שָׁנָה
  choice: நூறு வயதான
  rationale: வயதைக் குறிக்கும் எபிரெயக் கட்டமைப்புக்கு இயல்பான தமிழ் இணை.
- source_word: וְאִם
  choice: '... பெறுவாளா?'
  rationale: இரண்டாவது வினாவைத் தொடுக்கும் אם இங்கு நிபந்தனைக்குப் பதிலாக இணையான சொல்லாட்சிவினாவை அறிமுகப்படுத்துகிறது; தமிழில் தனி வினாவாக இயல்பாக வெளிப்படுகிறது.
- source_word: הֲבַת תִּשְׁעִים שָׁנָה
  choice: தொண்ணூறு வயதான சாராள்
  rationale: சொல்லுக்கு சொல் ‘தொண்ணூறு ஆண்டுகளின் மகள்’ என்ற வயது மரபுத்தொடரின் பொருளை, கூடுதல் பெயர்ச்சொல் சேர்க்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: תֵּלֵד
  choice: பிள்ளை பெறுவாளா
  rationale: பெண் எழுவாயுடன் வரும் Qal ילד குழந்தையைப் பெற்றெடுப்பதைக் குறிக்கிறது; ‘பிள்ளை பெறுதல்’ தெளிவான, இயல்பான தமிழ்.
theological_decisions:
- issue: ஆபிரகாமின் சிரிப்பின் தன்மை
  choice: எந்த மதிப்பீட்டு அடைமொழியும் சேர்க்காமல் ‘சிரித்தார்’ என்று நடுநிலையாக மொழிபெயர்த்தல்
  alternative: ‘அவநம்பிக்கையுடன் சிரித்தார்’ அல்லது ‘மகிழ்ச்சியுடன் சிரித்தார்’
  rationale: வசனம் சிரிப்பைப் பதிவு செய்தாலும் அதன் ஒழுக்க அல்லது விசுவாசத் தன்மையை வெளிப்படையாக வரையறுக்கவில்லை; ஆகவே கதையிலுள்ள இறையியல் இழுபறி காக்கப்படுகிறது.
- issue: בן என்பதன் பாலினக் குறிப்புத்தன்மை
  choice: ‘மகன்’ என்று மொழிபெயர்த்தல்
  alternative: ‘பிள்ளை’ என்று பொதுமைப்படுத்தல்
  rationale: மூல எபிரெயத்தில் ஆண்பால் பெயர்ச்சொல் உள்ளது; சூழலில் ஈசாக்கைப் பற்றிய குறிப்பும் இருப்பதால் மூலத்தின் குறிப்புத்தன்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கண்ணியமும் கொண்ட எளிய நடையில் வடிவமைக்கப்பட்டது. ‘தம்’ என்பது ஆபிரகாமின் உள்ளார்ந்த பேச்சைத் தெளிவுபடுத்துகிறது. மூலத்தில் வெளிப்படாத சிரிப்பின் நோக்கம் அல்லது மனநிலை சேர்க்கப்படவில்லை.
