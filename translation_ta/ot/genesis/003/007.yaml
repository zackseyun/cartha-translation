theological_decisions:
- issue: புதிய அறிவுக்கும் வெட்கம் அல்லது ஒழுக்க உணர்வுக்கும் உள்ள தொடர்பு
  choice: கண்கள் திறக்கப்பட்டன, தாங்கள் நிர்வாணமாக இருப்பதை அறிந்தார்கள், பின்னர் இடுப்புக் கச்சைகளைச் செய்தார்கள் என்று மட்டும் விவரித்தல்
  alternative: ‘வெட்கமடைந்தார்கள்’ அல்லது ‘மனச்சாட்சி விழித்தது’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: வெட்கம் ஏற்பட்டதை நிகழ்ச்சித் தொடர் உணர்த்தினாலும், இந்த வசனம் அதை நேரடியாகச் சொல்லவில்லை. ஆகவே இறையியல் விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்காமல் கதையின் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: חֲגֹרֹת என்பதன் ஆடை வடிவம்
  choice: இடுப்புக் கச்சைகள்
  alternative: மறைப்புகள்; முன்துணிகள்
  rationale: இந்தச் சொல் உடலைச் சுற்றிக் கட்டப்படும் ஒன்றைக் குறிக்கிறது. ‘இடுப்புக் கச்சைகள்’ அதன் உடல் அமைவிடத்தை வெளிப்படுத்துகிறது; ஆனால் வடிவம் முழுமையாகத் தீர்மானிக்கப்படாததால் மாற்றுகள் அடிக்குறிப்பில் குறிப்பிடப்படுகின்றன.
