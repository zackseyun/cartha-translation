base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/007.yaml
  text: Then the eyes of both of them were opened[a], and they knew that they were naked[b]. So they sewed fig leaves together and made coverings for themselves.
translation:
  language: ta
  text: அப்போது அவர்கள் இருவரின் கண்களும் திறக்கப்பட்டன; தாங்கள் நிர்வாணமாக இருப்பதை அவர்கள் அறிந்தார்கள். எனவே, அத்தி இலைகளைத் தைத்து, தங்களுக்காக இடுப்புக் கச்சைகளை[a] செய்துகொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இடுப்பை மறைக்கும் துணிகளை” அல்லது “முன்துணிகளை.”
    reason: חֲגֹרֹת என்ற சொல் இடுப்பைச் சுற்றிக் கட்டப்படும் பொருளைக் குறிக்கிறது; அதன் துல்லிய வடிவம் உறுதியாகக் குறிப்பிடப்படவில்லை.
