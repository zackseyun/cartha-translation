  text: וְ/אֵיבָ֣ה אָשִׁ֗ית בֵּֽינְ/ךָ֙ וּ/בֵ֣ין הָֽ/אִשָּׁ֔ה וּ/בֵ֥ין זַרְעֲ/ךָ֖ וּ/בֵ֣ין זַרְעָ֑/הּ ה֚וּא יְשׁוּפְ/ךָ֣ רֹ֔אשׁ וְ/אַתָּ֖ה תְּשׁוּפֶ֥/נּוּ עָקֵֽב׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/015.yaml
  text: And I will put enmity[a] between you and the woman, and between your seed[b] and her seed; he will crush your head[c][d], and you will bruise his heel.
translation:
  language: ta
  text: “உனக்கும் அந்தப் பெண்ணுக்கும் இடையில், உன் வித்துக்கும்[b] அவளுடைய வித்துக்கும் இடையில் பகைமையை[a] ஏற்படுத்துவேன். அவன்[c] உன் தலையை நசுக்குவான்[d]; நீ அவனுடைய குதிகாலைக் காயப்படுத்துவாய்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விரோதத்தை.”
    reason: lexical_alternative
  - marker: b
    text: இரு இடங்களிலும் எபிரெய மொழியில் “வித்து” என்றே உள்ளது; இச்சொல் கூட்டாகச் சந்ததியினரையோ, அவர்களைப் பிரதிநிதித்துவப்படுத்தும் ஒருவரையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அது.” கூட்டுப்பொருள் கொண்ட பெயர்ச்சொல்லான “வித்து” என்பதற்குப் பின் எபிரெயத்தில் ஆண்பால் ஒருமைச் சுட்டுப்பெயர் வருகிறது.
    reason: alternative_reading
  - marker: d
    text: இரு வாக்கியப் பகுதிகளிலும் எபிரெயத்தில் ஒரே வினைதான் வருகிறது. அதை “காயப்படுத்து” அல்லது “தாக்கு” என்றும் மொழிபெயர்க்கலாம்; தலைக்கு ஏற்படும் காயத்தின் அதிகத் தீவிரத்தை “நசுக்கு” வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיבָה
  choice: பகைமை
  rationale: நீடித்த, செயல்படும் எதிர்ப்பைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்; ‘விரோதம்’ என்பதும் சாத்தியம்.
- source_word: אָשִׁית
  choice: ஏற்படுத்துவேன்
  rationale: ‘வைப்பேன்/நிறுத்துவேன்’ என்ற சொல்லடி பொருளைவிட, இரு தரப்புகளுக்கிடையே பகைமையை நிறுவுவதை இயல்பான தமிழில் தெளிவாகச் சொல்கிறது.
- source_word: בֵּינְךָ ... וּבֵין הָאִשָּׁה
  choice: உனக்கும் அந்தப் பெண்ணுக்கும் இடையிலும்
  rationale: எபிரெய மொழியின் உறவுநிலை அமைப்பையும் குறிப்பிட்ட பெண்ணைக் குறிக்கும் சுட்டையும் தக்கவைக்கிறது.
- source_word: זַרְעֲךָ ... זַרְעָהּ
  choice: உன் வித்து ... அவளுடைய வித்து
  rationale: இரு இடங்களிலும் வரும் ஒரே ‘வித்து’ உருவகத்தைப் பாதுகாக்கிறது; அது கூட்டாகச் சந்ததியையும், அவர்களைப் பிரதிநிதித்துவப்படுத்தும் ஒருவரையும் குறிக்கக்கூடிய தெளிவின்மையை விடாமல் வைத்திருக்கிறது.
- source_word: הוּא
  choice: அவன்
  rationale: எபிரெயச் சொல் ஆண்பால் ஒருமை; முன்வரும் கூட்டுப்பொருள் கொண்ட ‘வித்து’ என்பதோடு இருந்தாலும், பிரதிநிதியான தனிநபர் குறிப்பு சாத்தியத்தை வெளிப்படையாக வைத்திருக்கிறது.
- source_word: יְשׁוּפְךָ ... תְּשׁוּפֶנּוּ
  choice: நசுக்குவான் ... காயப்படுத்துவாய்
  rationale: எபிரெயத்தில் ஒரே அரிய வினை இருமுறையும் வருகிறது. தலைக்கும் குதிகாலுக்கும் ஏற்படும் தாக்கங்களின் வேறுபட்ட தீவிரத்தைத் தமிழில் இயல்பாக வெளிப்படுத்த இவ்விரு சொற்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் ஒரே வினை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: רֹאשׁ
  choice: தலை
  rationale: உடற்பகுதியைக் குறிக்கும் நேரடியான பொருள்.
- source_word: עָקֵב
  choice: குதிகால்
  rationale: உடற்பகுதியைக் குறிக்கும் நேரடியான பொருள்.
theological_decisions:
- issue: பெண்ணின் ‘வித்து’ கூட்டுச் சந்ததியையா அல்லது ஒரு பிரதிநிதியான தனிநபரையா குறிக்கிறது
  choice: இரு இடங்களிலும் ‘வித்து’ என்றும், அதைத் தொடர்ந்து ஆண்பால் ஒருமையான ‘அவன்’ என்றும் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘சந்ததி’ என்று கூட்டுப்பொருளில் மொழிபெயர்த்து, பின்னர் ‘அது’ அல்லது பன்மைப் பெயர்ச்சொல்லைப் பயன்படுத்துதல்.
  rationale: மூல எபிரெயம் ஒரே கூட்டுப்பெயரை இருமுறை பயன்படுத்தி, பின்னர் ஆண்பால் ஒருமைப் பெயர்ச்சொல்லைக் கொண்டுவருகிறது. இந்த வடிவம் கூட்டுப் பொருளையும் பிரதிநிதித் தனிநபர் சாத்தியத்தையும் திறந்தவையாக வைக்கிறது; குறிப்பிட்ட மேசியானிய விளக்கத்தை மொழிபெயர்ப்புக்குள் கட்டாயமாகச் சேர்க்கவில்லை.
- issue: שׁוּף என்ற ஒரே வினையை இரு உறுப்புகளிலும் எவ்வாறு மொழிபெயர்ப்பது
  choice: தலைக்கு ‘நசுக்கு’, குதிகாலுக்கு ‘காயப்படுத்து’ என வழங்கப்பட்டது.
  alternative: இரு இடங்களிலும் ‘தாக்கு’ அல்லது ‘காயப்படுத்து’ என்று ஒரே சொல்லைப் பயன்படுத்துதல்.
  rationale: மூலத்தில் ஒரே அரிய வினை மீண்டும் வந்தாலும், தாக்கப்படும் தலை மற்றும் குதிகால் ஆகியவை விளைவின் தீவிர வேறுபாட்டைக் காட்டுகின்றன. முதன்மை உரை அந்த வேறுபாட்டை வெளிப்படுத்துகிறது; அடிக்குறிப்பு மூல வினையின் மீளுரைப்பைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘வித்து’ என்பது அன்றாட ‘சந்ததி’யைவிட மூல உருவகத்தையும் அதன் கூட்டுப்/தனிநபர் தெளிவின்மையையும் சிறப்பாகப் பாதுகாப்பதால் தேர்ந்தெடுக்கப்பட்டது. பாம்பை ஒருமை ‘நீ’ என்று நேரடியாக அழைக்கும் மூலத்தின் தொனி தக்கவைக்கப்பட்டுள்ளது.
