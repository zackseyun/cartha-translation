source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אֶת קֹלְ/ךָ֥ שָׁמַ֖עְתִּי בַּ/גָּ֑ן וָ/אִירָ֛א כִּֽי עֵירֹ֥ם אָנֹ֖כִי וָ/אֵחָבֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/010.yaml
  text: And he said[a], “I heard your voice in the garden, and I was afraid because I was naked, so I hid myself.”
translation:
  language: ta
  text: அவன், “தோட்டத்தில் உமது சத்தத்தைக்[a] கேட்டேன். நான் நிர்வாணமாக இருந்ததால் பயந்தேன்; அதனால் ஒளிந்துகொண்டேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது குரலை.” எபிரெய மொழியில் உள்ள קוֹל (கோல்) என்ற சொல் “சத்தம்” அல்லது “குரல்” எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அதற்கு அவன் … என்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியையும், முன் கேள்விக்கான ஆதாமின் பதில் என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶת קֹלְךָ
  choice: உமது சத்தத்தை
  rationale: קוֹל என்பது ‘சத்தம்’ அல்லது ‘குரல்’ என இரு பொருள்களையும் தரலாம். இங்கு பேசப்பட்ட சொற்கள் என்று குறுக்காமல், கேட்ட ஒலியைக் குறிக்கும் விரிவான ‘சத்தம்’ முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
- source_word: שָׁמַעְתִּי
  choice: கேட்டேன்
  rationale: கால் நிறைவுவினை, முதலாம் நபர் ஒருமைக்கான நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: בַּגָּן
  choice: தோட்டத்தில்
  rationale: முன்னரே அறிமுகமான குறிப்பிட்ட தோட்டம் என்பதைச் சூழல் தெளிவாக்குகிறது.
- source_word: וָאִירָא
  choice: பயந்தேன்
  rationale: ஆதாம் அனுபவித்த பயத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כִּי
  choice: இருந்ததால்
  rationale: ஆதாம் பயந்ததற்கான காரணத்தைச் சுட்டும் காரணப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֵירֹם אָנֹכִי
  choice: நான் நிர்வாணமாக இருந்ததால்
  rationale: எபிரெயப் பெயரெச்ச வாக்கியம் காலத்தைக் குறிப்பாகச் சுட்டாதபோதும், கடந்தகாலக் கதைச்சூழலுக்கு ஏற்றவாறு ‘இருந்தேன்’ என்ற பொருள் தமிழில் இயல்பாக வழங்கப்படுகிறது.
- source_word: וָאֵחָבֵא
  choice: அதனால் ஒளிந்துகொண்டேன்
  rationale: வினையின் தன்னைச் சார்ந்த பொருளை ‘ஒளிந்துகொண்டேன்’ காக்கிறது; முந்தைய பயத்தின் விளைவாக இது நிகழ்ந்ததை ‘அதனால்’ இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: தேவனுடைய இருப்புடன் தொடர்புடைய קוֹל என்பதன் மொழிபெயர்ப்பு
  choice: உமது சத்தம்
  alternative: உமது குரல்
  rationale: தேவனை ஆதாம் கேட்டான் என்று உரை கூறினாலும், அந்த இடத்தில் தேவன் சொற்களாகப் பேசியதாகத் திட்டவட்டமாகக் கூறவில்லை. ஆகவே மூலச்சொல்லின் விரிவான பொருளான ‘சத்தம்’ முதன்மை உரையில் வைக்கப்பட்டு, மரபான மற்றும் சாத்தியமான ‘குரல்’ அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய ஒருமை மரியாதை உடைமை வடிவமாக ‘உமது’ வைக்கப்பட்டுள்ளது; ‘ஒளிந்துகொண்டேன்’ என்பது எபிரெய வினையின் தன்னைச் சார்ந்த பொருளை இயல்பாகக் காக்கிறது.
