source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הַ/נָּחָ֖שׁ אֶל הָֽ/אִשָּׁ֑ה לֹֽא מ֖וֹת תְּמֻתֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/004.yaml
  text: But the serpent said to the woman[b][a], “You will not surely die.”
translation:
  language: ta
  text: ஆனால் பாம்பு பெண்ணிடம், “நீங்கள் நிச்சயமாகச் சாகமாட்டீர்கள்[a]” என்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், ‘சாகவே சாகமாட்டீர்கள்’ என்பதற்கு ஒப்பான வலியுறுத்தல் அமைப்பு; அதாவது, ‘நிச்சயமாகச் சாகமாட்டீர்கள்.’
    reason: மூலமொழியின் வலியுறுத்தல் அமைப்பை விளக்குதல்
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் ... என்றது
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுத்தாலும், இங்கு பாம்பின் கூற்று முன்பு கொடுக்கப்பட்ட எச்சரிக்கையை நேரடியாக மறுப்பதால், எதிர்மறைத் தொடர்பை இயல்பாக வெளிப்படுத்த ‘ஆனால்’ பயன்படுத்தப்பட்டது.
- source_word: הַנָּחָשׁ
  choice: பாம்பு
  rationale: נָחָשׁ என்பதன் இயல்பான நவீனத் தமிழ் இணைச்சொல் ‘பாம்பு’; இது கதையின் உயிரினத்தையும் அதன் இலக்கியப் பங்கையும் கூடுதல் விளக்கமின்றி தெரிவிக்கிறது.
- source_word: הָאִשָּׁה
  choice: பெண்
  rationale: אִשָּׁה என்பது ‘பெண்’ அல்லது ‘மனைவி’ எனப் பொருள்படலாம். இந்தக் கதைப்பகுதியில் ஏவாள் பெயரிடப்படுவதற்கு முன் தொடர்ந்து ‘பெண்’ எனக் குறிப்பிடப்படுவதால் அதுவே தக்கது.
- source_word: מוֹת תְּמֻתוּן
  choice: நிச்சயமாகச் சாகமாட்டீர்கள்
  rationale: வினையெச்சப் பெயருருவும் வினைமுற்றும் இணையும் எபிரெய வலியுறுத்தல், לֹא என்ற மறுப்புடன் சேர்ந்து மரணத்தைத் திட்டவட்டமாக மறுக்கிறது. ‘நிச்சயமாகச் சாகமாட்டீர்கள்’ என்பது அந்த வலிமையைத் தெளிவான தமிழில் காக்கிறது. இரண்டாம் நபர் பன்மை வடிவம் ‘நீங்கள்’ மூலம் தக்கவைக்கப்பட்டது.
theological_decisions:
- issue: பாம்பின் மறுப்பின் வலிமை
  choice: “நீங்கள் நிச்சயமாகச் சாகமாட்டீர்கள்” என்ற நேரடியான, திட்டவட்டமான மறுப்பு
  alternative: “நீங்கள் சாகமாட்டீர்கள்” என்ற வலியுறுத்தல் குறைந்த மொழிபெயர்ப்பு
  rationale: לֹא + வினையெச்சப் பெயருரு + வினைமுற்று அமைப்பு முந்தைய இறை எச்சரிக்கையை வலுவாக மறுக்கிறது. மரணம் உடனடியானதா அல்லது பின்னர் நிகழ்வதா என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல், மூலத்தின் இறையியல் பதற்றத்தை அப்படியே விடுகிறது.
- issue: இரண்டாம் நபர் பன்மை
  choice: நீங்கள்
  alternative: நீ
  rationale: תְּמֻתוּן இலக்கணரீதியாக இரண்டாம் நபர் ஆண்பால் பன்மை. பாம்பு பெண்ணிடம் பேசினாலும், ஒருமையாக மாற்றாமல் மூலத்தின் பன்மையைப் பாதுகாக்கிறது; அது யாரையெல்லாம் உள்ளடக்குகிறது என்பதை உரை வெளிப்படையாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான நடையமைப்பு பயன்படுத்தப்பட்டது. ‘சர்ப்பம்’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘பாம்பு’ தேர்ந்தெடுக்கப்பட்டது. ‘நீங்கள்’ மரியாதை ஒருமையாகவும் அமையக்கூடிய தமிழ்ச் சொல் என்றாலும், இங்கு அது எபிரெய மூலத்தின் பன்மையை இயன்றவரை காக்கிறது.
