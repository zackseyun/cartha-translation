  text: וַ/יֹּ֣אמֶר יְהוָ֣ה אֱלֹהִ֗ים הֵ֤ן הָֽ/אָדָם֙ הָיָה֙ כְּ/אַחַ֣ד מִמֶּ֔/נּוּ לָ/דַ֖עַת ט֣וֹב וָ/רָ֑ע וְ/עַתָּ֣ה פֶּן יִשְׁלַ֣ח יָד֗/וֹ וְ/לָקַח֙ גַּ֚ם מֵ/עֵ֣ץ הַֽ/חַיִּ֔ים וְ/אָכַ֖ל וָ/חַ֥י לְ/עֹלָֽם׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/022.yaml
  text: Then Yahweh God said[a], “Behold, the man has become like one of us, knowing good and evil. And now, lest he reach out his hand and also take from the tree of life and eat, and live forever—”
translation:
  language: ta
  text: அப்போது யாவே தேவன், “இதோ, மனிதன் நன்மை தீமையை அறிந்து, நம்மில் ஒருவரைப் போல[a] ஆகியிருக்கிறான். இப்போது அவன் தன் கையை நீட்டி, வாழ்வின் மரத்திலிருந்தும் எடுத்து உண்டு, என்றென்றும் வாழ்ந்துவிடாதபடி—” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘நம்மில்’ என்ற பன்மை அப்படியே உள்ளது. இது விண்ணுலக ஆலோசனைக்குழுவைக் குறிக்கும் மொழி, ஆலோசனைப் பன்மை, அல்லது இறைவனுக்குள்ளான பன்மையின் முன்சுட்டு எனப் பலவாறு புரிந்துகொள்ளப்படுகிறது.
    reason: மூலத்தின் பன்மை குறிப்பை எந்த ஓர் இறையியல் விளக்கத்திற்கும் கட்டுப்படுத்தாமல் பாதுகாக்கிறது.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலருக்கு வெளிப்படுத்தப்பட்ட இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: יְהוָה என்பதுடன் இணைந்து வரும் இறைப்பட்டப்பெயரைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: הֵן
  choice: இதோ
  rationale: எபிரெயச் சுட்டிடைச்சொல்லின் கவன ஈர்ப்பையும் உரையின் கம்பீரத்தையும் காக்கிறது.
- source_word: הָאָדָם
  choice: மனிதன்
  rationale: இச்சூழலில் முன்பு குறிப்பிடப்பட்ட தனிப்பட்ட மனிதனைக் குறிக்கிறது; மனிதகுலம் என்ற பொதுப்பொருளைத் திணிக்கவில்லை.
- source_word: הָיָה
  choice: ஆகியிருக்கிறான்
  rationale: நடந்த மாற்றத்தின் தற்போதைய விளைவு தொடர்வதை எபிரெய நிறைவுவினைக்கு ஏற்றவாறு காட்டுகிறது.
- source_word: כְּאַחַד מִמֶּנּוּ
  choice: நம்மில் ஒருவரைப் போல
  rationale: ஒப்புமையையும் முதலாம் நபர் பன்மையையும் விளக்கவுரை சேர்க்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: לָדַעַת טוֹב וָרָע
  choice: நன்மை தீமையை அறிந்து
  rationale: நன்மை மற்றும் தீமை பற்றிய அறிவைக் குறிக்கும் எபிரெயத் தொடரை இயல்பான தமிழில் தருகிறது; அதன் ஒழுக்கவியல் அல்லது அறிவுசார் பரப்பைச் சுருக்கவில்லை.
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: அடுத்த நடவடிக்கைக்கான உரைநகர்வையும் அவசரத்தையும் வெளிப்படுத்துகிறது.
- source_word: פֶּן
  choice: வாழ்ந்துவிடாதபடி
  rationale: தடுக்க வேண்டியதாகக் கருதப்படும் சாத்தியத்தைத் தமிழின் எதிர்மறை நோக்கத் தொடரால் காட்டுகிறது; எபிரெயத்தில் போலவே வாக்கியத்தை நிறைவுறாமல் விட அனுமதிக்கிறது.
- source_word: יִשְׁלַח יָדוֹ
  choice: தன் கையை நீட்டி
  rationale: எபிரெய மொழிமரபின் உடல்சார் உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: וְלָקַח גַּם מֵעֵץ הַחַיִּים
  choice: வாழ்வின் மரத்திலிருந்தும் பறித்து
  rationale: גַּם என்பதன் சேர்க்கைப் பொருளை ‘-உம்’ மூலம் காத்து, மரத்திலிருந்து கனியை எடுக்கும் செயலை இயல்பாக ‘பறித்து’ என வழங்குகிறது; ‘கனி’ என்பதை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: עֵץ הַחַיִּים
  choice: வாழ்வின் மரம்
  rationale: எபிரெய இணைப்புத் தொடரின் வெளிப்படையான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לְעֹלָם
  choice: என்றென்றும்
  rationale: முடிவில்லாத காலநீட்டிப்பைக் குறிக்கும் இச்சூழலுக்குப் பொருத்தமான இயல்பான தமிழ் இணை.
theological_decisions:
- issue: ‘நம்மில் ஒருவரைப் போல’ என்பதிலுள்ள பன்மை
  choice: ‘நம்மில்’ என்ற முதலாம் நபர் பன்மையை விளக்கவுரை இன்றி அப்படியே வைத்தல்.
  alternative: இதை மகத்துவப் பன்மை, விண்ணுலக ஆலோசனைக்குழுவின் மொழி, அல்லது இறைவனுக்குள்ளான பன்மையின் முன்சுட்டு என்று மொழிபெயர்ப்பிலேயே குறிப்பாக்குதல்.
  rationale: எபிரெய மூலம் பன்மையைத் தெளிவாகக் கொண்டிருந்தாலும் அதன் குறிப்பு யாரை நோக்கியது என்பதைத் தீர்மானிக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தையும் உண்மையான தெளிவின்மையையும் பாதுகாக்கிறது.
- issue: இறை உரையின் திடீர் நிறுத்தம்
  choice: ‘என்றென்றும் வாழ்ந்துவிடாதபடி—’ என்று நீண்ட கோட்டுடன் முற்றுப்பெறாத வாக்கியமாக வைத்தல்.
  alternative: மறைந்துள்ள முதன்மை வாக்கியத்தை ஊகித்துச் சேர்த்து கருத்தை முழுமைப்படுத்துதல்.
  rationale: எபிரெய வசனம் தடுக்கும்நோக்கத் துணைவாக்கியத்துடன் திடீரென நிற்கிறது; அடுத்த வசனத்தில் செயல் தொடர்கிறது. சேர்க்கப்படாத சொற்களைப் புகுத்தாமல் இந்த இடைநிறுத்தம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ உரையின் கம்பீரத்தைக் காக்கிறது; பிற சொற்றொடர்கள் தேவையற்ற பழமையாக்கமின்றி இயல்பாக அமைக்கப்பட்டுள்ளன. இறுதி நீண்ட கோடு மூலத்திலுள்ள திடீர் இடைநிறுத்தத்தைக் காட்டுகிறது.
