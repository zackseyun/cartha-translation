  rationale: ‘பறித்து’ என்பதற்குப் பதிலாக ‘எடுத்து’ என மாற்றப்பட்டுள்ளது. இதனால் வாழ்வின் மரத்திலிருந்து எடுக்கும் செயலை மட்டும் கூறும் எபிரெய வினைச்சொல்லின் பரந்த பொருள் காக்கப்படுகிறது; கனியைப் பறித்தல் போன்ற குறிப்பிடப்படாத விவரத்தைச் சேர்ப்பதில்லை. பிற கூறுகள் மூலத்தின் பொருள், பன்மைத் தெளிவின்மை, மற்றும் திடீரென நிற்கும் வாக்கிய அமைப்பைத் தகுந்தவாறு காக்கின்றன.
