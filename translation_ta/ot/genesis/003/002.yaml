id: GEN.3.2
reference: Genesis 3:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/תֹּ֥אמֶר הָֽ/אִשָּׁ֖ה אֶל הַ/נָּחָ֑שׁ מִ/פְּרִ֥י עֵֽץ הַ/גָּ֖ן נֹאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/002.yaml
  text: And the woman said to the serpent[a], “We may eat from the fruit of the trees of the garden,”
translation:
  language: ta
  text: அந்தப் பெண் பாம்பிடம், “தோட்டத்திலுள்ள மரங்களின் கனிகளை[a] நாங்கள் உண்ணலாம்” என்று சொன்னாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘தோட்டத்தின் மரத்தின் கனியிலிருந்து நாங்கள் உண்ணலாம்.’ இங்கு ‘மரம்’ என்பது மரங்களைப் பொதுத்தொகையாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: என்று சொன்னாள்
  rationale: வாவ் தொடர் அமைப்பு கதையை முன்னெடுக்கிறது. தமிழின் இயல்பான நேர்கூற்று அமைப்பில் ‘என்று சொன்னாள்’ அதைப் பொருத்தமாக வெளிப்படுத்துகிறது; தனியாக ‘மற்றும்’ சேர்ப்பது இயல்பற்றதாக இருக்கும்.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: இங்கு אִשָּׁה திருமண உறவைச் சிறப்பாகச் சுட்டாமல், கதையில் ஏற்கெனவே அறிமுகமான பெண்ணைக் குறிக்கிறது. ‘அந்தப் பெண்’ குறிப்புத்தன்மையையும் தொடர்ச்சியையும் இயல்பாகக் காட்டுகிறது.
- source_word: אֶל הַנָּחָשׁ
  choice: பாம்பிடம்
  rationale: பேச்சு யாரை நோக்கியது என்பதை நவீன தமிழில் இயல்பாகக் காட்டுகிறது. נָחָשׁ என்பதற்கு இச்சூழலில் ‘பாம்பு’ நேரான, பொதுவாகப் புரியும் இணைச்சொல்.
- source_word: מִפְּרִי עֵץ הַגָּן
  choice: தோட்டத்திலுள்ள மரங்களின் கனிகளை
  rationale: עֵץ இலக்கண வடிவில் ஒருமையாக இருந்தாலும், இங்கு பொதுத்தொகை அல்லது பகிர்வுப் பொருளில் தோட்டத்தின் மரங்களைச் சுட்டுகிறது. தமிழில் பன்மையாக மொழிபெயர்ப்பது சூழலிலுள்ள பொதுவான அனுமதியைத் தெளிவாக்குகிறது. מן என்பதன் மூல/பகுதி நுணுக்கம் ‘கனிகளை உண்ணுதல்’ என்ற இயல்பான தமிழ் வினைத்தொடரில் உள்ளடங்குகிறது.
- source_word: נֹאכֵל
  choice: நாங்கள் உண்ணலாம்
  rationale: முதல் நபர் பன்மை முற்றுப்பெறாத வினை இச்சூழலில் அனுமதிக்கப்பட்ட செயலைக் குறிக்கிறது. ‘உண்ணலாம்’ அனுமதியை வெளிப்படுத்துகிறது; ‘நாங்கள்’ வினையிலுள்ள நபர் மற்றும் எண்ணை வெளிப்படையாகக் காக்கிறது.
theological_decisions:
- issue: பெண்ணின் பதிலில் அனுமதிக்கப்பட்ட மரங்கள் அல்லது கனிகளின் வரம்பு
  choice: ‘தோட்டத்திலுள்ள மரங்களின் கனிகள்’ என்று பொதுவான அனுமதியாக மொழிபெயர்த்தல்
  alternative: ‘தோட்டத்தின் மரத்தின் கனி’ என்று ஒருமையை அப்படியே மொழிபெயர்த்தல்
  rationale: எபிரெயத்தில் עֵץ ஒருமையாக இருந்தாலும், ஆதியாகமம் 2:16-இல் தரப்பட்ட பரந்த அனுமதியையும் அடுத்த வசனத்தில் வரும் விதிவிலக்கையும் கருத்தில் கொண்டால் இங்கு அது பொதுத்தொகைப் பொருளில் உள்ளது. பன்மை மொழிபெயர்ப்பு ஒரே ஒரு மரம் மட்டுமே குறிக்கப்படுகிறது என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது; மூல வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதே நேரத்தில் கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘சாப்பிடலாம்’ என்பதற்குப் பதிலாக வேதாகமக் கதையாடலுக்கு ஏற்ற, இன்னும் பொதுவாகப் புரியும் ‘உண்ணலாம்’ தேர்ந்தெடுக்கப்பட்டது.
