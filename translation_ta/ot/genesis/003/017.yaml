source:
  edition: WLC
  text: וּ/לְ/אָדָ֣ם אָמַ֗ר כִּֽי שָׁמַעְתָּ֮ לְ/ק֣וֹל אִשְׁתֶּ/ךָ֒ וַ/תֹּ֨אכַל֙ מִן הָ/עֵ֔ץ אֲשֶׁ֤ר צִוִּיתִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ אֲרוּרָ֤ה הָֽ/אֲדָמָה֙ בַּֽ/עֲבוּרֶ֔/ךָ בְּ/עִצָּבוֹן֙ תֹּֽאכֲלֶ֔/נָּה כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/017.yaml
  text: And to Adam he said[a], “Because you listened to the voice of your wife and ate from the tree about which I commanded you, saying, ‘You shall not eat from it,’ the ground is cursed because of you[f][e][d][c][b]; in painful toil you shall eat from it all the days of your life.”
translation:
  language: ta
  text: 'ஆதாமிடம் அவர் சொன்னார்: “நீ உன் மனைவியின் குரலுக்குச் செவிகொடுத்து, ‘இதிலிருந்து சாப்பிடக் கூடாது’ என்று நான் உனக்குக் கட்டளையிட்ட அந்த மரத்திலிருந்து சாப்பிட்டதால், உன் நிமித்தம் நிலம் சபிக்கப்பட்டது. உன் வாழ்நாளெல்லாம் வேதனைமிகுந்த உழைப்பினால் அதிலிருந்து உண்பாய்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆதாமிடம்” என்பதற்கு மாற்றாக “அந்த மனிதனிடம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: לְאָדָם
  choice: ஆதாமிடம்
  rationale: இக்கதைச் சூழலில் ஒரு குறிப்பிட்ட மனிதரே நேரடியாகக் குறிப்பிடப்படுவதால், பொதுப்பெயரான ‘மனிதன்’ என்பதற்குப் பதிலாக ‘ஆதாம்’ என்ற பெயர் இயல்பானது; மாற்றுவாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שָׁמַעְתָּ לְקוֹל אִשְׁתֶּךָ
  choice: நீ உன் மனைவியின் குரலுக்குச் செவிகொடுத்து
  rationale: ‘குரலுக்குச் செவிகொடுத்தல்’ என்ற எபிரெய மொழிநடையைத் தமிழில் புரியத்தக்க வகையில் நெருக்கமாகப் பாதுகாக்கிறது; ‘கீழ்ப்படிந்தாய்’ என்று பொருளை மிகையாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: וַתֹּאכַל מִן הָעֵץ
  choice: மரத்திலிருந்து சாப்பிட்டதால்
  rationale: מִן என்ற முன்னிடைச்சொல்லை ‘இலிருந்து’ என வெளிப்படுத்தி, காரணத்தைக் குறிக்கும் כִּי உடன் இயல்பாக இணைக்கிறது.
- source_word: אֲשֶׁר צִוִּיתִיךָ לֵאמֹר לֹא תֹאכַל מִמֶּנּוּ
  choice: ‘இதிலிருந்து சாப்பிடக் கூடாது’ என்று நான் உனக்குக் கட்டளையிட்ட
  rationale: לֵאמֹר அறிமுகப்படுத்தும் கட்டளையின் உள்ளடக்கத்தை நேரடி மேற்கோளாக வைத்திருக்கிறது; தமிழில் தேவையற்ற மறுமொழியைத் தவிர்த்து உறவுத்தொடரை இயல்பாக்குகிறது.
- source_word: אֲרוּרָה הָאֲדָמָה
  choice: நிலம் சபிக்கப்பட்டது
  rationale: வேளாண் சூழலில் הָאֲדָמָה என்பதற்கு ‘நிலம்’ தெளிவானது; எபிரெய வாக்கியத்தின் தீர்ப்புத் தன்மையைப் பேணுகிறது.
- source_word: בַּעֲבוּרֶךָ
  choice: உன் நிமித்தம்
  rationale: ஆதாமின் செயலை முன்னிட்டு நிலத்தின்மேல் வந்த விளைவைச் சுட்டுகிறது; பயனுக்காக என்ற பொருள் வராதவாறு சூழல் தெளிவுபடுத்துகிறது.
- source_word: בְּעִצָּבוֹן
  choice: வேதனைமிகுந்த உழைப்பினால்
  rationale: இச்சொல்லில் உள்ள வேதனை, துன்பம், கடின உழைப்பு ஆகிய பொருள் பரப்பை உணவுக்கான உழைப்புச் சூழலில் ஒருங்கிணைக்கிறது.
- source_word: תֹּאכֲלֶנָּה
  choice: அதிலிருந்து உண்பாய்
  rationale: பெண்பால் பின்னொட்டு ‘நிலம்’ என்பதைக் குறிக்கிறது; மண்ணையே உண்பது அல்ல, அதிலிருந்து விளைவதை உண்பது என்பதைக் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: உன் வாழ்நாளெல்லாம்
  rationale: முழு வாழ்நாளையும் குறிக்கும் எபிரெய மொழிநடையைச் சுருக்கமாகவும் கண்ணியமாகவும் வழங்குகிறது.
theological_decisions:
- issue: אָדָם என்பது பெயரா அல்லது ‘மனிதன்’ என்ற பொதுப்பெயரா
  choice: ஆதாம்
  alternative: அந்த மனிதன்
  rationale: இவ்வசனத்தில் ஏதேனின் குறிப்பிட்ட ஆண் நபர் நேரடியாக அழைக்கப்படுகிறார். ‘ஆதாம்’ என்பது அந்த தனிப்பட்ட குறியீட்டைத் தெளிவாக்குகிறது; மூலத்தின் சொற்பொருள் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: שׁמע לְקוֹל என்பதன் வலிமை
  choice: குரலுக்குச் செவிகொடுத்து
  alternative: கீழ்ப்படிந்து
  rationale: இச்சொற்றொடர் கவனித்தல் அல்லது கீழ்ப்படிதல் ஆகிய நுணுக்கங்களைக் கொள்ளலாம். ‘கீழ்ப்படிந்தாய்’ என்று இறையியல் அல்லது உறவியல் பொருளை ஒருதலைப்பட்சமாகத் தீர்மானிக்காமல் மூல உருவகத்தைப் பேணுகிறது.
- issue: בְּעִצָּבוֹן குறிக்கும் துன்பத்தின் தன்மை
  choice: வேதனைமிகுந்த உழைப்பு
  alternative: துயரம் / வேதனை
  rationale: அடுத்துவரும் நிலப் பயிரிடல் மற்றும் உணவு பெறுதல் என்ற சூழல் கடின உழைப்பை முன்னிறுத்துகிறது; அதேவேளை ‘வேதனைமிகுந்த’ என்பது முந்தைய வசனத்துடனான சொற்பொருள் தொடர்பை முற்றிலும் அழிக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், வாய்வழியாகவும் வாசிப்பதற்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சாப்பிடு’ என்பது இங்கு இயல்பான பொதுத் தமிழ்; இறுதி வினையில் ‘உண்பாய்’ என்பது தீர்ப்பின் செறிவையும் இலக்கிய ஓசையையும் காக்கிறது. மூலத்தில் இல்லாத இறையியல் விளக்கங்கள் சேர்க்கப்படவில்லை; உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
