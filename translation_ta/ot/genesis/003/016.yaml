source:
  edition: WLC
  text: אֶֽל הָ/אִשָּׁ֣ה אָמַ֗ר הַרְבָּ֤ה אַרְבֶּה֙ עִצְּבוֹנֵ֣/ךְ וְ/הֵֽרֹנֵ֔/ךְ בְּ/עֶ֖צֶב תֵּֽלְדִ֣י בָנִ֑ים וְ/אֶל אִישֵׁ/ךְ֙ תְּשׁ֣וּקָתֵ֔/ךְ וְ/ה֖וּא יִמְשָׁל בָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/016.yaml
  text: To the woman he said[a], “I will greatly multiply your pain and your conception; in pain you will bear children. Your desire will be for your husband[c][b], and he will rule over you.”
translation:
  language: ta
  text: 'பெண்ணிடம் அவர் சொன்னார்: “உன் வேதனையையும் உன் கர்ப்பகாலத்தையும்[a] நான் மிகவும் அதிகரிப்பேன்; வேதனையோடு நீ பிள்ளைகளைப்[b] பெறுவாய். உன் விருப்பம்[c] உன் கணவனை நோக்கியிருக்கும்; அவனோ உன்னை ஆளுவான்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் கருவுறுதலையும்.” எபிரெயச் சொல் கருவுறுதலையோ கர்ப்பகாலத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் நேரடியாக “மகன்களை”; இங்கு அது பொதுவாகப் பிள்ளைகள் அல்லது சந்ததியைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “ஏக்கம்.” அரிதாக வரும் எபிரெயச் சொல் பரந்த பொருளில் விருப்பத்தைக் குறிக்கலாம். சிலர் இதைக் கட்டுப்படுத்த விரும்புதல் என்று புரிந்துகொள்கிறார்கள் (ஆதியாகமம் 4:7-ஐ ஒப்பிடுக); மற்றவர்கள் உறவுசார் அல்லது பாலியல் ஏக்கம் என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: பெண்
  rationale: இந்தத் தண்டனை அறிவிப்பில் பெண் மனிதரே நேரடியாக விளிக்கப்படுகிறார்; பின்னர் אִישֵׁךְ திருமண உறவைக் குறிப்பதால் அங்கே மட்டும் ‘கணவன்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: הַרְבָּה אַרְבֶּה
  choice: நான் மிகவும் அதிகரிப்பேன்
  rationale: முற்றுவினையுடன் சேர்ந்த வினையெச்சத்தின் வலியுறுத்தலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: עִצְּבוֹנֵךְ
  choice: உன் வேதனை
  rationale: இந்தச் சொல் வேதனை, துன்பம், கடின உழைப்பு ஆகிய பொருள்களைத் தரலாம்; குழந்தைப்பேற்றுச் சூழலில் ‘வேதனை’ பொருத்தமாக இருந்தாலும் அதன் பரந்த துன்பப் பொருளை முற்றிலும் நீக்குவதில்லை.
- source_word: וְהֵרֹנֵךְ
  choice: உன் கருவுறுதல்
  rationale: எபிரெயச் சொல் கருவுறுதலையோ கர்ப்பகாலத்தையோ குறிக்கலாம். முதன்மை உரையில் ‘கருவுறுதல்’ மூலவடிவத்துக்கு நெருக்கமாக உள்ளது; மற்ற வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּעֶצֶב
  choice: வேதனையோடு
  rationale: குழந்தைகளைப் பெறும் சூழ்நிலையையோ முறையையோ குறிக்கும் முன்னிடைச்சொல் தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תֵּלְדִי בָנִים
  choice: நீ பிள்ளைகளைப் பெறுவாய்
  rationale: בָנִים என்பதன் நேரடிப் பொருள் ‘மகன்கள்’; ஆனால் இங்கு அது பொதுவாகப் பிள்ளைகள் அல்லது சந்ததியைக் குறிப்பதால் பாலின வரம்பைத் தேவையின்றி சேர்க்காத ‘பிள்ளைகள்’ பயன்படுத்தப்படுகிறது.
- source_word: אִישֵׁךְ
  choice: உன் கணவன்
  rationale: பெண்ணுடனான இவ்வுறவில் אִישׁ என்பது பொதுவான ‘ஆண்’ என்பதைவிட இயல்பாக ‘கணவன்’ என்று பொருள்படுகிறது.
- source_word: תְּשׁוּקָתֵךְ
  choice: உன் விருப்பம்
  rationale: அரிதாக வரும் இச்சொல்லின் உறவுசார், பாலியல் அல்லது கட்டுப்படுத்தும் நுண்பொருள்களில் ஒன்றைத் தீர்மானமாகத் திணிக்காமல், பரந்த பொருளுடைய சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: יִמְשָׁל בָּךְ
  choice: அவன் உன்னை ஆளுவான்
  rationale: இவ்வினைச்சொல்லின் ஆளுதல் அல்லது ஆட்சி செய்தல் என்ற நேரடிப் பொருளைத் தருகிறது; ‘அடக்கி ஆள்வான்’ போன்ற வலுவான விளக்கத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: கணவனை நோக்கிய பெண்ணின் ‘விருப்பம்’ என்பதன் பொருள்
  choice: தְּשׁוּקָה என்பதை ‘விருப்பம்’ என்று மொழிபெயர்த்து அதன் குறிப்பிட்ட தன்மையைத் திறந்தவாறே வைத்தல்.
  alternative: பாலியல் ஆசை; உறவுசார் ஏக்கம் அல்லது சார்பு; ஆதியாகமம் 4:7 உடன் ஒப்பிட்டு கட்டுப்படுத்தும் விருப்பம்.
  rationale: இச்சொல் அரிதானது; இச்சூழல் ஒரே நுண்பொருளை கட்டாயப்படுத்தவில்லை. ஆகவே முதன்மை உரை உண்மையான தெளிவின்மையைக் காக்கிறது; விளக்க வாய்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: ஆண் ஆளுதல் கட்டளையா அல்லது வீழ்ச்சிக்குப் பிந்தைய நிலையின் விவரிப்பா
  choice: ‘அவன் உன்னை ஆளுவான்’ என்று நிகழப்போகும் நிலையின் கூற்றாக மொழிபெயர்த்தல்.
  alternative: ஆண் அதிகாரத்தை விதிக்கும் மறைமுகக் கட்டளை.
  rationale: எபிரெய வினைவடிவம் என்ன நிகழும் என்று கூறுகிறது; என்ன நிகழ வேண்டும் என்று கட்டளையிடவில்லை. எனவே மொழிபெயர்ப்பு மூலத்தில் இல்லாத நெறிப்படுத்தும் கொள்கையைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் வலியுறுத்தல் இயல்பான தமிழில் தரப்பட்டுள்ளது; அரிதான தְּשׁוּקָה சொல்லின் விளக்கத் தெளிவின்மையும், ஆளுதல் பற்றிய கூற்றின் விவரிப்பு தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
