  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּקְרָ֛א יְהוָ֥ה אֱלֹהִ֖ים אֶל הָֽ/אָדָ֑ם וַ/יֹּ֥אמֶר ל֖/וֹ אַיֶּֽ/כָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/009.yaml
  text: Then Yahweh God called to the man and said to him[a], “Where are you?”
translation:
  language: ta
  text: பின்பு யாவே[a] தேவன் மனிதனை அழைத்து, அவனிடம், “நீ எங்கே இருக்கிறாய்?” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ய்ஹ்வ்ஹ் (יהוה) என்ற இறைப்பெயர்; இது தமிழில் மரபாக “கர்த்தர்” என்றும் வழங்கப்படுகிறது.
    reason: தனிப்பட்ட இறைப்பெயரின் மரபுவழி மாற்று மொழிபெயர்ப்பைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: கூப்பிட்டு
  rationale: קרא என்பதன் Qal wayyiqtol வடிவம் தொடர்ச்சியான நிகழ்வைக் குறிக்கிறது. இச்சூழலில் ‘கூப்பிட்டு’ என்பது இயல்பான தமிழில் அழைத்துப் பேசுவதைக் குறிக்கிறது; ‘வரவழைத்து’ என்பது மூலத்தில் இல்லாத கட்டளைத் தன்மையைச் சேர்க்கக்கூடும்.
- source_word: יְהוָה אֱלֹהִים
  choice: யாவே தேவன்
  rationale: יְהוָה என்ற தனிப்பட்ட இறைப்பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது; אֱלֹהִים ‘தேவன்’ என்று வழங்கப்பட்டுள்ளது. இதனால் மூலத்திலுள்ள கூட்டுத் தெய்வப்பெயர் தெளிவாகப் பாதுகாக்கப்படுகிறது.
- source_word: הָאָדָם
  choice: மனிதனை
  rationale: இங்கு הָאָדָם பொதுவான மனிதகுலத்தை அல்ல, தோட்டத்தில் தேவனால் நேரடியாக அழைக்கப்படும் குறிப்பிட்ட மனிதனைக் குறிக்கிறது. ‘மனிதனை’ என்பது அந்தக் குறிப்பிட்ட ஆண் மனிதரைச் சூழலின் வழியே இயல்பாக அடையாளப்படுத்துகிறது.
- source_word: וַיֹּאמֶר לוֹ
  choice: அவனிடம் … என்றார்
  rationale: לוֹ என்பதிலுள்ள ‘அவனிடம்’ என்ற பொருள் வெளிப்படையாகத் தக்கவைக்கப்பட்டுள்ளது. தமிழில் நேரடி உரையைத் தொடர்ந்து ‘என்றார்’ என்பது இயல்பான சொல்முறை.
- source_word: אַיֶּכָּה
  choice: நீ எங்கே இருக்கிறாய்?
  rationale: இது இரண்டாம் நபர் ஆண்பால் ஒருமையை நோக்கிய நேரடிக் கேள்வி. கூடுதல் விளக்கப் பொருள் சேர்க்காமல் இருப்பிடத்தைக் கேட்கும் கேள்வியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַ
  choice: பின்பு
  rationale: தொடக்க waw தொடர்ச்சியான கதை நிகழ்வைக் குறிக்கிறது. ‘பின்பு’ நவீனத் தமிழில் அதன் நிகழ்வுத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ அதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது; தமிழில் நிலவிவரும் ‘கர்த்தர்’ என்ற மரபு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: הָאָדָם என்பதன் குறிப்பு
  choice: மனிதன்
  alternative: மனிதகுலம்
  rationale: இந்தக் கதைச்சூழலில் தேவன் பாவச்செயலுக்குப் பிறகு ஒரு குறிப்பிட்ட ஆண் மனிதரிடம் பேசுகிறார். எனவே பொதுவான மனிதகுலத்தைக் குறிக்கும் மொழிபெயர்ப்பு தவிர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க கதைநடையிலும் வடிவமைக்கப்பட்டுள்ளது. தேவனைச் சுட்டும் வினைமுற்றில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; மனிதனைச் சுட்டும் ‘அவனிடம்’ மூல உரையின் ஒருமையைத் தக்கவைக்கிறது.
