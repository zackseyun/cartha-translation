source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר מִ֚י הִגִּ֣יד לְ/ךָ֔ כִּ֥י עֵירֹ֖ם אָ֑תָּה הֲ/מִן הָ/עֵ֗ץ אֲשֶׁ֧ר צִוִּיתִ֛י/ךָ לְ/בִלְתִּ֥י אֲכָל מִמֶּ֖/נּוּ אָכָֽלְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/011.yaml
  text: And he said[b][a], “Who told you that you were naked? Have you eaten from the tree from which I commanded you not to eat?”
translation:
  language: ta
  text: அவர், “நீ நிர்வாணமாக இருக்கிறாய் என்று உனக்குச் சொன்னது யார்? உண்ணக் கூடாது என்று நான் உனக்குக் கட்டளையிட்ட அந்த மரத்திலிருந்து நீ உண்டாயா?[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீ உண்டாயா?” என்பதை “நீ சாப்பிட்டாயா?” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவர் … என்றார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான தமிழ்ச் சொல்வரிசையில் தருகிறது; இவ்வசனத்தில் வெளிப்படையாக இல்லாத இறைப் பெயரைச் சேர்க்கவில்லை.
- source_word: מִי הִגִּיד לְךָ
  choice: உனக்குச் சொன்னது யார்?
  rationale: נגד என்பதன் ஹிஃபில் வடிவத்திலுள்ள ‘தெரிவி/சொல்’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: כִּי עֵירֹם אָתָּה
  choice: நீ நிர்வாணமாக இருக்கிறாய் என்று
  rationale: כִּי அறிக்கையின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; עֵירֹם ஆடையற்ற நிலையைக் குறிக்கிறது. எபிரெயத்தில் நிகழ்நிலை வினை வெளிப்படையாக இல்லாததால் தமிழ் இயல்புக்கேற்ப ‘இருக்கிறாய்’ சேர்க்கப்படுகிறது.
- source_word: הֲמִן הָעֵץ
  choice: அந்த மரத்திலிருந்து … உண்டாயா?
  rationale: கேள்வித்துகள் הֲ மற்றும் מן உறவைத் தெளிவாகக் காக்கிறது; முன்னரே குறிப்பிடப்பட்ட மரம் என்பதால் ‘அந்த மரம்’ இயல்பானது.
- source_word: אֲשֶׁר צִוִּיתִיךָ לְבִלְתִּי אֲכָל מִמֶּנּוּ
  choice: உண்ணக் கூடாது என்று நான் உனக்குக் கட்டளையிட்ட
  rationale: தடைப் பொருளுடைய לְבִלְתִּי + வினையெச்சக் கட்டமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மִמֶּנּוּ குறிக்கும் ‘அதிலிருந்து’ என்ற உறவு முதன்மை வாக்கியத்தின் ‘மரத்திலிருந்து’ என்பதில் தெளிவாக உள்ளது.
- source_word: אָכָלְתָּ
  choice: நீ உண்டாயா?
  rationale: கால் நிறைவுவடிவம் குறிக்கும் முடிவுற்ற செயலைத் தமிழின் இயல்பான இறந்தகால வினாவாக அளிக்கிறது.
theological_decisions:
- issue: மூன்றாம் ஆண்பால் ஒருமை வினையின் எழுவாய் அடையாளம்
  choice: அவர்
  alternative: ஆண்டவராகிய தேவன்
  rationale: இவ்வசனத்தின் எபிரெய உரையில் எழுவாய் பெயர் மீண்டும் சொல்லப்படவில்லை. முந்தைய சூழலில் அது தேவனைச் சுட்டினாலும், மூலத்தில் இல்லாத பெயரை இங்கு சேர்க்காமல் சுட்டுப்பெயர் மட்டும் பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘நிர்வாணமாக’ என்பது சூழலின் முக்கியச் சொல்லைத் துல்லியமாகக் காக்கிறது; ‘உண்ணக் கூடாது’ என்பது கட்டளையின் தடையை இயல்பாக வெளிப்படுத்துகிறது.
