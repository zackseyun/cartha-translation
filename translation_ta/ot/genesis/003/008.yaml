base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/008.yaml
  text: And they heard the sound of Yahweh God walking in the garden in the breeze of the day[c][b][a], and the man and his wife hid themselves from the presence of Yahweh God among the trees of the garden.
translation:
  language: ta
  text: பகலின் காற்று வீசும் வேளையில்[a], தோட்டத்தில் நடந்துகொண்டிருந்த யாவே தேவனின் சத்தத்தை[b] அவர்கள் கேட்டார்கள். அந்த மனிதனும்[c] அவன் மனைவியும் யாவே தேவனின் முன்னிலையிலிருந்து தங்களை மறைத்துக்கொண்டு, தோட்டத்தின் மரங்களுக்கிடையே ஒளிந்துகொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: ‘பகலின் குளிர்ச்சியான வேளையில்.’ எபிரெயில் சொல்லுக்கு சொல்: ‘பகலின் காற்றில்.’'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘யாவே தேவனின் குரலை.’ எபிரெயச் சொல் ‘சத்தம்’ அல்லது ‘குரல்’ என இருவகையிலும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயில் ‘அந்த மனிதன்’; ‘ஆதாம்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: சத்தம்
  rationale: இந்த எபிரெயச் சொல் ‘சத்தம்’ அல்லது ‘குரல்’ எனப் பொருள்படலாம். இங்கு தேவன் பேசியதாக நேரடியாகக் கூறப்படாததால், ‘சத்தம்’ என்பது தெளிவுக்கு மீறிச் செல்லாமல் மூலத்தின் பொருள் நெகிழ்வைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைபெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் தனிப்பட்ட பெயராக ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: יְהוָה என்பதுடன் இணைந்து வரும் இறைச் சுட்டுப்பெயருக்கு இயல்பான, கண்ணியமான தமிழ் வடிவம்.
- source_word: מִתְהַלֵּךְ
  choice: நடந்துகொண்டிருந்த
  rationale: தோட்டத்திற்குள் நிகழ்ந்த தொடர்ச்சியான நடமாட்டத்தை இயல்பான தமிழில் வெளிப்படுத்துவதோடு, மனித இயல்பில் வருணிக்கும் மூலத்தின் உருவகப்படுத்தலை மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: לְרוּחַ הַיּוֹם
  choice: பகலின் தென்றல் வீசும் வேளையில்
  rationale: ரூஅக் என்பது காற்று, மூச்சு அல்லது ஆவி எனப் பொருள்படலாம். இச்சூழலில் நாளின் தென்றலைக் குறிக்கும் சொற்றொடராக எடுத்துக்கொண்டு, தமிழில் இயல்பாகக் காலச்சூழலைத் தெரிவிக்கிறது; ‘பகலின் குளிர்ச்சியில்’ என்ற விளைவுசார் விளக்கத்தை முதன்மை உரையில் சேர்ப்பதில்லை.
- source_word: הָאָדָם
  choice: அந்த மனிதன்
  rationale: ‘அவன் மனைவி’ என்ற உடனடியான சூழலில் தனிப்பட்ட ஆணைக் குறிக்கிறது. அதேவேளையில் ‘ஆதாம்’ என்ற பெயரை முதன்மை உரையில் கட்டாயப்படுத்தாமல் மூலத்தின் சாத்தியமான பொதுமனித ஒலிப்பை விடுகிறது.
- source_word: מִפְּנֵי
  choice: முன்னிலையிலிருந்து விலகி
  rationale: சொல்லின் நேரடியான ‘முகம்/முன்னிலை’ சார்ந்த உறவையும், அவர்கள் மறைந்துகொண்ட செயலில் உள்ள விலகிச் செல்லும் கருத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּתוֹךְ עֵץ הַגָּן
  choice: தோட்டத்தின் மரங்களுக்கிடையே
  rationale: עֵץ இலக்கண வடிவில் ஒருமையாக இருந்தாலும் இங்கு கூட்டுப்பொருளில் மரங்களைக் குறிக்கிறது; மறைவிடத்தைச் சுட்டும் சூழலில் பன்மை தமிழ் இயல்பானது.
theological_decisions:
- issue: தோட்டத்தில் தேவன் ‘நடந்துகொண்டிருந்தார்’ என்ற மனித இயல்பிலான வருணனை
  choice: ‘நடந்துகொண்டிருந்த’ என்ற தெளிவான உடல்சார் மொழியைத் தக்கவைத்தல்
  alternative: ‘தோட்டத்தில் உலாவிக்கொண்டிருந்த’ அல்லது ‘தேவனின் பிரசன்னம் தோட்டத்தில் இருந்தது’
  rationale: எபிரெய உரை தேவனைத் தெளிவான கதைமொழியில் வருணிக்கிறது. அதை உருவகமாக விளக்கவோ, இறையியல் ஒத்திசைவுக்காக மென்மைப்படுத்தவோ செய்யாமல் அதன் பதற்றத்தைப் பாதுகாக்க வேண்டும்.
- issue: הָאָדָם என்பதன் தனிநபர் மற்றும் பிரதிநிதித்துவப் பொருள்
  choice: ‘அந்த மனிதன்’
  alternative: ‘ஆதாம்’ அல்லது ‘மனிதன்’
  rationale: ‘அவன் மனைவி’ என்ற சூழல் தனிநபரைக் காட்டுகிறது; ஆனாலும் நேரடியாக ‘ஆதாம்’ என்று பெயராக்காமல், எபிரெயச் சொல்லின் பரந்த மனிதப் பிரதிநிதித்துவ ஒலிப்பையும் திறந்தவாறு வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நீண்ட இணைப்பைத் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரித்துள்ளோம். இறைபெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது; மூலத்தில் உள்ள ‘சத்தம்/குரல்,’ ‘காற்று/குளிர்ச்சி,’ ‘மனிதன்/ஆதாம்’ ஆகிய உண்மையான நிச்சயமின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
