base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/006.yaml
  text: So the woman saw that the tree was good for food[a], and that it was a delight to the eyes, and that the tree was desirable to make one wise. So she took from its fruit and ate, and she also gave some to her husband, who was with her[b], and he ate.
translation:
  language: ta
  text: அந்தப் பெண், அந்த மரம் உண்பதற்கு நல்லது என்றும், கண்களுக்கு இன்பமானது[a] என்றும், ஞானியாக்குவதற்கு விரும்பத்தக்கது[b] என்றும் கண்டாள். ஆகவே அவள் அதன் கனியிலிருந்து எடுத்து சாப்பிட்டாள்; மேலும், தன்னுடன் இருந்த தன் கணவனுக்குக் கொடுத்தாள்; அவனும் சாப்பிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “கண்களுக்கு ஆசையூட்டுவது” அல்லது “கண்களுக்கு விரும்பத்தக்கது” என்றும் மொழிபெயர்க்கலாம். இச்சொற்றொடர் மரத்தின் கண்கவர் தோற்றத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஞானம் பெறுவதற்கு.” எபிரெய வினை வடிவம் ஞானம் பெறுவதையோ ஒருவரை ஞானியாக்குவதையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: கண்டாள்
  rationale: எளிய கதைநடைப் பார்வை வினை; வெறும் பார்வையையும் அவள் செய்த மதிப்பீட்டையும் இயல்பாகத் தாங்குகிறது.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: எபிரெய உரையின் கதைநடை அடையாளத்தைப் பேணுகிறது; இவ்விடத்தில் தேவையின்றி ‘மனைவி’ என்று மாற்றவில்லை.
- source_word: טוֹב ... לְמַאֲכָל
  choice: உண்பதற்கு நல்லது
  rationale: மரம் உணவாக ஏற்றது என்ற பொருளை நேராகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: תַאֲוָה ... לָעֵינַיִם
  choice: கண்களுக்கு இன்பம் தருவது
  rationale: கண்ணைக் கவரும் தன்மையை வெளிப்படுத்துகிறது; ‘இச்சை’ அல்லது ‘காமம்’ போன்ற தேவையற்ற எதிர்மறை அறநிறத்தைச் சேர்க்கவில்லை.
- source_word: וְנֶחְמָד
  choice: விரும்பத்தக்கது
  rationale: கவர்ச்சியானது அல்லது விரும்பப்படத்தக்கது என்ற மதிப்பீட்டை, மிகைப்படுத்தாமல் துல்லியமாகக் காட்டுகிறது.
- source_word: לְהַשְׂכִּיל
  choice: ஞானம் பெறுவதற்கு
  rationale: அறிவு, விவேகம் அல்லது ஞானம் அடைவதைக் குறிக்கும் நோக்கத்தை இயல்பான தமிழில் கூறுகிறது; எபிரெய வடிவின் காரணவினைப் பொருள் குறிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִפִּרְיוֹ
  choice: அதன் கனியை
  rationale: מן என்ற முன்னிடைச்சொல்லின் பகுதி/மூலப் பொருள் தமிழ் வாக்கியத்தில் ‘எடுத்து’ என்பதோடு இயல்பாக வெளிப்படுகிறது; ‘கனி’ ஒருமை தொகுப்புப் பொருளில் உள்ளது.
- source_word: וַתִּתֵּן גַּם לְאִישָׁהּ
  choice: தன் கணவனுக்கும் கொடுத்தாள்
  rationale: גם என்பதன் கூடுதல் பொருளை ‘-உம்’ காட்டுகிறது; אִישָׁהּ இச்சூழலில் அவளுடைய கணவனைக் குறிக்கிறது.
- source_word: עִמָּהּ
  choice: தன்னுடன் இருந்த
  rationale: அவன் அவளுடன் இருந்தான் என்ற முக்கியமான கதை விவரத்தைத் தெளிவாகவும், விளக்கச் சேர்க்கை இல்லாமலும் வழங்குகிறது.
theological_decisions:
- issue: பெண்ணின் பார்வைக்கு அறநெறி நிறம் சேர்த்தல்
  choice: ‘நல்லது,’ ‘இன்பம் தருவது,’ ‘விரும்பத்தக்கது’ என்ற ஒப்பீட்டளவில் நடுநிலையான சொற்கள் பயன்படுத்தப்பட்டன.
  alternative: ‘இச்சையைத் தூண்டியது,’ ‘பேராசைக்குரியது,’ அல்லது வெளிப்படையாகப் பாவ நிறமுள்ள சொற்களைப் பயன்படுத்துதல்.
  rationale: எபிரெய உரை முதலில் பெண்ணின் நேர்முக மதிப்பீட்டை விவரித்து, பின்னர் அவள் செய்த செயலைக் கூறுகிறது. மூலத்தில் இல்லாத எதிர்மறை அறநிறத்தை மதிப்பீட்டுச் சொற்களுக்குள் முன்கூட்டியே சேர்க்கக் கூடாது.
- issue: לְהַשְׂכִּיל என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘ஞானம் பெறுவதற்கு’ என்று மொழிபெயர்த்து, காரணவினை சார்ந்த மாற்றுப் பொருளை அடிக்குறிப்பில் தருதல்.
  alternative: ‘ஒருவரை ஞானியாக்குவதற்கு’ அல்லது ‘ஞானம் அளிப்பதற்கு’ என்று முதன்மை உரையில் மொழிபெயர்த்தல்.
  rationale: வடிவம் ஞானம்/விவேகம் அடைதலையும் ஞானியாக்குதலையும் சுட்டக்கூடும். முதன்மை உரை இயல்பான தமிழைப் பேணுகிறது; உண்மையான பொருள் விரிவு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: கணவன் அங்கு இருந்ததன் குறிப்பு
  choice: עִמָּהּ என்பதை ‘தன்னுடன் இருந்த தன் கணவன்’ என்று வெளிப்படையாக இணைத்தல்.
  alternative: ‘தன்னுடன் தன் கணவனுக்கும்’ என்ற தெளிவற்ற சொல்வரிசை.
  rationale: எபிரெய உரை கணவன் அவளுடன் இருந்ததாகக் கூறுகிறது. தமிழ் தொடரமைப்பில் இதைத் தெளிவுபடுத்துவது விளக்க விரிவாக்கம் அல்ல; மூலத்தின் கதை விவரத்தை வாசிக்கத்தக்க வகையில் வழங்குவதாகும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான எளிய கதைநடை பயன்படுத்தப்பட்டது. ‘சாப்பிட்டாள்/சாப்பிட்டான்’ என்பது சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான வடிவம்; தேவையற்ற தொன்மைநடை தவிர்க்கப்பட்டது. வாக்கியத்தின் மூன்று மதிப்பீட்டுக் கூறுகளும் இணையான அமைப்பில் வைக்கப்பட்டுள்ளன.
