base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/020.yaml
  text: And the man called his wife's name Eve[b][a], because she was the mother of all the living.
translation:
  language: ta
  text: அந்த மனிதன் தன் மனைவிக்கு ஏவாள் என்று பெயரிட்டான்[a]; ஏனெனில், அவள் உயிருள்ள எல்லாவற்றுக்கும் தாயாக இருந்தாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆதாம் தன் மனைவிக்கு ஏவாள் என்று பெயரிட்டான்.” எபிரெயில் குறிப்பிட்ட உருபுடன் “அந்த மனிதன்” என்று உள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உயிருள்ள உயிரினங்கள் அனைத்திற்கும் தாய்” / “வாழும் அனைவருக்கும் தாய்.” எபிரெயில் சொல்லுக்குச் சொல் “உயிருள்ள எல்லாவற்றிற்கும் தாய்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: பெயரிட்டான்
  rationale: קרא என்பதன் Qal வடிவம் இங்கு பெயர் சூட்டும் செயலைக் குறிக்கிறது. எபிரெய மொழியின் ‘பெயரை அழைத்தான்’ என்ற சொற்றொடரை அப்படியே இறுக்கமாகப் பின்பற்றாமல், நவீனத் தமிழில் இயல்பான ‘பெயரிட்டான்’ பயன்படுத்தப்பட்டது.
- source_word: הָאָדָם
  choice: அந்த மனிதன்
  rationale: אָדָם என்பதற்கு முன் குறிப்பிட்ட உருபு இருப்பதால், இங்கு தனிப்பெயரான ‘ஆதாம்’ என்பதைக் காட்டிலும் முன்பு குறிப்பிடப்பட்ட ‘அந்த மனிதன்’ என்பது எபிரெய வடிவத்தைத் துல்லியமாகப் பிரதிபலிக்கிறது.
- source_word: אִשְׁתּוֹ
  choice: தன் மனைவிக்கு
  rationale: இச்சூழலில் אִשָּׁה அந்த மனிதனின் மனைவியைக் குறிக்கிறது. தமிழில் பெயரிடும் வாக்கிய அமைப்புக்கு ‘தன் மனைவிக்கு’ இயல்பானது.
- source_word: חַוָּה
  choice: ஏவாள்
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்றுள்ள இப்பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: பெயரிட்டதற்கான காரணத்தை அறிமுகப்படுத்தும் காரணப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: הָיְתָה
  choice: இருந்தாள்
  rationale: היה இங்கு மாற்றத்தைவிட ஒரு நிலையைக் குறிப்பிடுவதால் ‘ஆனாள்’ என்பதற்குப் பதில் ‘இருந்தாள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֵם
  choice: தாய்
  rationale: மரபுவழி தோற்றத்தைக் குறிக்கும் אֵם என்பதன் நேரான, இயல்பான தமிழ் இணை.
- source_word: כָּל חָי
  choice: உயிருள்ள அனைவருக்கும்
  rationale: பெயரடையாகிய חָי இங்கு பெயர்ச்சொல் பொருளில் வருகிறது. இந்த மொழிபெயர்ப்பு எபிரெயச் சொற்றொடரின் சுருக்கத்தையும் அதன் பொருள் எல்லையில் உள்ள திறந்த தன்மையையும் காக்கிறது.
theological_decisions:
- issue: הָאָדָם என்பதை ‘ஆதாம்’ என்ற தனிப்பெயராகவா, ‘அந்த மனிதன்’ என்ற விவரிப்பாகவா மொழிபெயர்ப்பது
  choice: அந்த மனிதன்
  alternative: ஆதாம்
  rationale: எபிரெயில் குறிப்பிட்ட உருபு இருப்பது விவரிப்பு வாசிப்பை வலுவாக ஆதரிக்கிறது. பின்னாளைய பெயர் வழக்கை மூலத்தில் திணிக்காமல், மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டது.
- issue: ‘உயிருள்ள அனைவருக்கும் தாய்’ என்பதன் பொருள் எல்லை
  choice: பொருள் எல்லையைக் குறுக்காமல் ‘உயிருள்ள அனைவருக்கும்’ என்று வைத்தல்
  alternative: உயிருள்ள மனிதர்கள் அனைவருக்கும் தாய் / உயிருள்ள யாவற்றிற்கும் தாய்
  rationale: மூல எபிரெயச் சொற்றொடர் சுருக்கமானதும் பொருள் எல்லையில் ஓரளவு திறந்ததுமாக உள்ளது. அது மனிதர்களை மட்டுமா அல்லது இன்னும் பரந்த உயிர் வகைகளையா குறிக்கிறது என்பதை மொழிபெயர்ப்பு முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டது. ‘பெயரிட்டான்’ என்பது இயல்பான தமிழ் பெயரிடும் வழக்கைத் தருகிறது; மூலத்தின் உண்மையான இருபொருள் வாய்ப்புகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
