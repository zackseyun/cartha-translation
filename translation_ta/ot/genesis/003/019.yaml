base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/019.yaml
  text: By the sweat of your face you will eat bread until you return to the ground[a], because from it you were taken; for you are dust, and to dust you will return.
translation:
  language: ta
  text: 'உன் முகத்தின் வியர்வையால்[a] நீ அப்பம் உண்பாய்,

    நீ நிலத்திற்குத் திரும்பும்வரை;

    ஏனெனில், அதிலிருந்து நீ எடுக்கப்பட்டாய்.

    நீ தூசி;

    தூசிக்குத் திரும்புவாய்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இயல்பான தமிழில் ‘உன் நெற்றி வியர்வையால்’ என்றும் கூறலாம். எபிரெய மூலத்தில் நேரடியாக ‘உன் முகத்தின் வியர்வையால்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֵעַת אַפֶּיךָ
  choice: உன் முகத்தின் வியர்வையால்
  rationale: எபிரெயச் சொற்றொடரின் ‘உன் முகத்தின் வியர்வையால்’ என்ற நேரடியான உருவகத்தைத் தக்கவைக்கிறது. தமிழில் வழக்கமான ‘நெற்றி வியர்வையால்’ என்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תֹּאכַל לֶחֶם
  choice: நீ அப்பம் உண்பாய்
  rationale: לֶחֶם என்பதன் நேரடிப் பொருள் ‘அப்பம்’; சூழலில் அது பொதுவாக உணவையும் வாழ்வாதாரத்தையும் குறிக்கக்கூடும் என்றாலும், மூலச்சொல்லின் குறிப்பான படிமம் பாதுகாக்கப்படுகிறது.
- source_word: עַד שׁוּבְךָ אֶל הָאֲדָמָה
  choice: நீ நிலத்திற்குத் திரும்பும்வரை
  rationale: אֲדָמָה என்பது நிலம் அல்லது மண் என்பதைக் குறிக்கிறது. இங்கு ‘நிலம்’ என்பது மனிதன் எடுக்கப்பட்ட இடத்தையும் அவன் உடல் திரும்பும் இடத்தையும் இயல்பாகக் காட்டுகிறது; அடுத்துள்ள עָפָר என்பதிலிருந்து சொற்பொருள் வேறுபாட்டையும் காக்கிறது.
- source_word: כִּי מִמֶּנָּה לֻקָּחְתָּ
  choice: ஏனெனில் அதிலிருந்தே நீ எடுக்கப்பட்டாய்
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் முன் வரும் אֲדָמָה-வைச் சுட்டுகிறது. ‘எடுக்கப்பட்டாய்’ என்பது எபிரெயச் செயலப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; ‘-ஏ’ மூலத்தின் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עָפָר
  choice: தூசி
  rationale: மனிதனின் பொருள்சார் தோற்றத்தையும் மரணத்தில் மீண்டும் பூமியோடு சேர்வதையும் காட்டும் עָפָר என்பதற்கான நேரடியான, பரவலாகப் புரியக்கூடிய இணைச்சொல்.
- source_word: תָּשׁוּב
  choice: திரும்புவாய்
  rationale: இங்கு அறிவிக்கப்படும் தவிர்க்க முடியாத விளைவை நவீன, கண்ணியமான தமிழில் தெளிவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: மனிதனின் மரணத்தன்மையும் பொருள்சார் தோற்றமும்
  choice: மனிதன் எடுக்கப்பட்ட நிலத்திற்கும் தூசிக்கும் உடல்ரீதியாகத் திரும்புவான் என்ற அறிவிப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: உடல் மரணத்தைவிடத் தாழ்வுறுதலை முதன்மைப்படுத்தும் உருவக வாசிப்பு.
  rationale: אֲדָמָה (‘நிலம்’) மற்றும் עָפָר (‘தூசி’) ஆகியவற்றின் இணைப்பும் உடனடிச் சூழலும் மரணத்தையும் உடல் பூமிக்குத் திரும்புவதையும் வலுவாகச் சுட்டுகின்றன. அதற்கு அப்பாற்பட்ட பிற்காலக் கோட்பாட்டு விளக்கங்கள் உரைக்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. செய்யுள் ஓட்டத்திற்காக வரிகள் பிரிக்கப்பட்டுள்ளன; ‘நிலம்’ மற்றும் ‘தூசி’ என்ற சொற்கள் மூலத்திலுள்ள אֲדָמָה / עָפָר வேறுபாட்டைப் பாதுகாக்கின்றன.
