base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/013.yaml
  text: Then Yahweh God said to the woman[a], “What is this you have done?” And the woman said, “The serpent deceived me, and I ate.”
translation:
  language: ta
  text: அப்போது யாவே தேவன் பெண்ணிடம், “நீ செய்தது என்ன இது?” என்று கேட்டார். பெண், “பாம்பு என்னை ஏமாற்றியது[a]; நான் சாப்பிட்டேன்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னை வஞ்சித்தது.” எபிரேய வினைச்சொல் ஒருவரைத் தவறாக நம்பவைக்கிறதையோ வழிதவறச் செய்கிறதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: யாவே தேவன்
  rationale: தெய்வீகப் பெயரான יְהוָה என்பதை ‘யாவே’ என்று ஒலிபெயர்த்து, அதனுடன் வரும் אֱלֹהִים என்பதை ‘தேவன்’ என்று மொழிபெயர்க்கிறது; பெயர்–பட்டம் இணைப்பைத் தக்கவைக்கிறது.
- source_word: לָאִשָּׁה
  choice: பெண்ணிடம்
  rationale: אִשָּׁה என்பதற்கு ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள் வரலாம். இங்குள்ள கதைச் சூழலில் அவள் தொடர்ந்து ‘பெண்’ என்று குறிப்பிடப்படுவதால், திருமண உறவை முதன்மைப்படுத்தாமல் ‘பெண்ணிடம்’ என வழங்கப்பட்டுள்ளது.
- source_word: מַה זֹּאת עָשִׂית
  choice: நீ செய்த இந்தக் காரியம் என்ன?
  rationale: מַה என்ற வினாவையும் זֹּאת என்ற சுட்டையும் வெளிப்படுத்துகிறது. ‘நீ ஏன் இப்படிச் செய்தாய்?’ என்று காரண வினாவாக மாற்றாமல், எபிரேயத்தின் நேரடியான வினாவைத் தக்கவைக்கிறது.
- source_word: הַנָּחָשׁ
  choice: பாம்பு
  rationale: இது நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ள பொதுவான பெயர்; கதையில் குறிப்பிடப்பட்ட உயிரினத்தை நேரடியாகச் சுட்டுகிறது.
- source_word: הִשִּׁיאַנִי
  choice: என்னை ஏமாற்றியது
  rationale: இந்த வினைச்சொல் தவறாக நம்பச்செய்தல் அல்லது வழிதவறச் செய்தல் என்ற பொருளைக் கொண்டது. ‘ஏமாற்றியது’ என்பது அதன் பொருளை எளிய நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: וָאֹכֵל
  choice: நான் சாப்பிட்டேன்
  rationale: செயல்களின் தொடரை நேரடியாக வழங்குகிறது. ‘அதனால் நான் சாப்பிட்டேன்’ என்று எபிரேயத்தில் வெளிப்படையாக இல்லாத காரணத் தொடர்பைச் சேர்க்கவில்லை.
theological_decisions:
- issue: பெண் கூறும் பாம்பின் செயலின் தன்மை
  choice: பாம்பு என்னை ஏமாற்றியது
  alternative: பாம்பு என்னை வஞ்சித்தது / வழிதவறச் செய்தது
  rationale: பாம்பு தவறாக நம்பச்செய்தது என்ற எபிரேயத்தின் கருத்தைத் தெளிவாகக் கூறுகிறது; அதேவேளையில், பெண்ணின் பொறுப்பு குறித்த கேள்வியை மொழிபெயர்ப்பில் கூடுதலாகத் தீர்மானிப்பதில்லை.
- issue: பெண்ணின் உண்பதற்கும் பாம்பின் ஏமாற்றத்திற்கும் இடையிலான தொடர்பு
  choice: அரைப்புள்ளியுடன் ‘நான் சாப்பிட்டேன்’ என்று தொடராக வழங்குதல்
  alternative: ‘அதனால் நான் சாப்பிட்டேன்’ என்ற வெளிப்படையான காரணத் தொடர்
  rationale: וָאֹכֵל என்பது தொடர்ச்சியைத் தெரிவிக்கிறது; காரணத் தொடர்பு சூழலில் உணரப்பட்டாலும், அதை மொழிபெயர்ப்பில் வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் சுருக்கத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் வடிவமைக்கப்பட்டுள்ளது. தெய்வீகப் பெயர் ‘யாவே’ என்று தக்கவைக்கப்பட்டுள்ளது; பழமையான அல்லது மிக இலக்கியமான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
