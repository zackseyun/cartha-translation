  text: וְ/הַ/נָּחָשׁ֙ הָיָ֣ה עָר֔וּם מִ/כֹּל֙ חַיַּ֣ת הַ/שָּׂדֶ֔ה אֲשֶׁ֥ר עָשָׂ֖ה יְהוָ֣ה אֱלֹהִ֑ים וַ/יֹּ֨אמֶר֙ אֶל הָ֣/אִשָּׁ֔ה אַ֚ף כִּֽי אָמַ֣ר אֱלֹהִ֔ים לֹ֣א תֹֽאכְל֔וּ מִ/כֹּ֖ל עֵ֥ץ הַ/גָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/001.yaml
  text: The serpent was more crafty than any beast of the field that Yahweh God had made[a]. And he said to the woman, “Indeed, has God said[c][b], ‘You shall not eat from any tree of the garden’?”
translation:
  language: ta
  text: யாவே தேவன் உண்டாக்கியிருந்த வெளியிலுள்ள எல்லா விலங்குகளையும்விடப் பாம்பு தந்திரமானது[a]. அது பெண்ணிடம், “தோட்டத்திலுள்ள எந்த மரத்திலிருந்தும்[c] நீங்கள் சாப்பிடக் கூடாது என்று தேவன் உண்மையிலேயே சொன்னாரா?[b]” என்று கேட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தந்திரமானது’ என்பதற்கு ‘சூட்சுமமானது’ அல்லது ‘விவேகமானது’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சில சூழல்களில் விவேகத்தைக் குறிக்கலாம்; இங்கு தொடர்ந்து வரும் பேச்சு அதற்கு வஞ்சக நுண்பொருளைத் தருகிறது.
    reason: lexical_alternative
  - marker: b
    text: கதைசொல்லி ‘யாவே தேவன்’ என்கிறார்; ஆனால் பாம்பு ‘தேவன்’ என்று மட்டும் சொல்கிறது. மூல எபிரெய உரையிலுள்ள இந்த மாற்றம் இங்கும் பாதுகாக்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: c
    text: அல்லது, ‘தோட்டத்தின் ஒவ்வொரு மரத்திலிருந்தும்.’ எதிர்மறைக் கேள்வியில் ‘எந்த மரத்திலிருந்தும்’ என்பது தேவனுடைய கட்டளையைப் பாம்பு மிகைப்படுத்திக் கூறுவதைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנָּחָשׁ
  choice: பாம்பு
  rationale: הַנָּחָשׁ என்பதன் நேரான பொருள் ‘பாம்பு.’ தொடக்க வாவைத் தமிழில் கட்டாயமாக ‘மேலும்’ என்று மொழிபெயர்க்காமல், இயல்பான கதைநடையில் விடப்பட்டுள்ளது.
- source_word: עָרוּם
  choice: தந்திரமுள்ளது
  rationale: இந்தச் சொல் சூழலுக்கேற்ப விவேகம், சூட்சுமம், தந்திரம் ஆகிய நுண்பொருள்களைத் தரலாம்; தொடர்ந்து வரும் ஏமாற்றும் கேள்வியால் இங்கு எதிர்மறை நுண்பொருளுள்ள ‘தந்திரமுள்ளது’ பொருத்தமானது.
- source_word: מִכֹּל חַיַּת הַשָּׂדֶה
  choice: வெளியின் எல்லா விலங்குகளையும்விட
  rationale: מִן + כֹּל அமைப்பின் ஒப்பீட்டுப் பொருளை ‘எல்லா ... விட’ தெளிவாகக் காட்டுகிறது; הַשָּׂדֶה என்பதற்கு ‘வெளி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר עָשָׂה
  choice: உண்டாக்கியிருந்த
  rationale: விலங்குகளை விவரிக்கும் சார்பு வாக்கியத்தையும், கதையின் முந்தைய படைப்புச் செயலையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: יְהוָה אֱלֹהִים
  choice: யாவே தேவன்
  rationale: தெய்வீகப் பெயரான יהוה-ஐ ‘யாவே’ என ஒலிபெயர்த்து, אֱלֹהִים உடன் உள்ள இணைப்பை பாதுகாக்கிறது.
- source_word: וַיֹּאמֶר אֶל־הָאִשָּׁה
  choice: அது பெண்ணிடம் ... என்று கேட்டது
  rationale: பேசுபவர் பாம்பு என்பதால் தமிழில் இயல்பான அஃறிணைப் பதிலிடுபெயர் பயன்படுத்தப்பட்டுள்ளது; உரை கேள்வியாக இருப்பதால் ‘சொன்னது’ என்பதற்குப் பதில் ‘கேட்டது’ இயல்பான உரையாடல் வடிவம்.
- source_word: אַף כִּי
  choice: உண்மையிலேயே ... சொன்னாரா?
  rationale: ஐயத்தையும் மறைமுகச் சவாலையும் எழுப்பும் கேள்வியின் வலிமையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אָמַר אֱלֹהִים
  choice: தேவன் ... சொன்னாரா?
  rationale: பாம்பு முழு ‘யாவே தேவன்’ என்ற பெயரை அல்லாமல் אֱלֹהִים மட்டும் சொல்வதைத் தமிழிலும் பாதுகாக்கிறது.
- source_word: לֹא תֹאכְלוּ
  choice: நீங்கள் சாப்பிடக் கூடாது
  rationale: இரண்டாம் நபர் பன்மைத் தடை வடிவத்தை இயல்பான மரியாதை/பன்மைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִכֹּל עֵץ הַגָּן
  choice: தோட்டத்திலுள்ள எந்த மரத்திலிருந்தும்
  rationale: எதிர்மறைக் கேள்விக்குள் כֹּל-ஐ ‘எந்த ... உம்’ என வழங்குவது பாம்பின் மிகைப்படுத்தலைத் தெளிவாகக் காட்டுகிறது; ‘ஒவ்வொரு மரத்திலிருந்தும்’ என்பதும் இலக்கணரீதியாக சாத்தியம்.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பால் பாதுகாக்கிறது.
- issue: עָרוּם என்பதன் அறநெறி நுண்பொருள்
  choice: தந்திரமுள்ளது
  alternative: சூட்சுமமுள்ளது / விவேகமுள்ளது
  rationale: சொல்லின் சாத்தியமான நேர்மறை-எதிர்மறை பரப்பை அடிக்குறிப்பு சுட்டுகிறது; உடனடி சூழலிலுள்ள வஞ்சகக் கேள்வியால் முதன்மை உரையில் எதிர்மறை நுண்பொருள் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- issue: கதைசொல்லியும் பாம்பும் பயன்படுத்தும் இறைபெயர்களின் வேறுபாடு
  choice: கதைசொல்லியில் ‘யாவே தேவன்’; பாம்பின் பேச்சில் ‘தேவன்’
  alternative: இரு இடங்களிலும் ‘தேவன்’ அல்லது ‘யாவே தேவன்’ என்று ஒருமைப்படுத்துதல்
  rationale: மூல எபிரெய உரையில் உள்ள பெயரிடல் மாற்றத்தைத் தத்துவ விளக்கமின்றி அப்படியே பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமான வேதாகம நடையுடனும் அமைக்கப்பட்டுள்ளது. ‘சாப்பிட’ என்பது இன்றைய இயல்பான சொல்; ‘புசிக்க’ போன்ற பழமையான வடிவம் தவிர்க்கப்பட்டது. பாம்பைக் குறிக்க ‘அது’ பயன்படுத்தி, மூலத்தில் இல்லாத மனிதரூபப் பாலினச் சுட்டல் சேர்க்கப்படவில்லை.
