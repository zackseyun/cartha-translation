base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/018.yaml
  text: It will produce thorns and thistles for you[c][b][a], and you will eat the plants of the field.
translation:
  language: ta
  text: அது உனக்கு முட்களையும் முட்செடிகளையும் விளைவிக்கும்[a][c]; நீ வயல்வெளியின் தாவரங்களை[b] உண்பாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அது உனக்கு அவற்றை முளைக்கவைக்கும்’ என்றும் மொழிபெயர்க்கலாம். எபிரேய வினை காரணவினை வடிவில் உள்ளது; அதன் எழுவாய் முந்தைய வசனத்திலுள்ள நிலம்.
    reason: lexical_alternative
  - marker: b
    text: ‘வயல்வெளியின் தாவரங்கள்’ என்பதை ‘வயல்வெளியின் பசுந்தாவரங்கள்’ என்றும், மரபுவழியாக ‘வயல்வெளியின் பூண்டுகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘அது முட்களையும் முட்செடிகளையும் வளரச் செய்யும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: previous_rendering
lexical_decisions:
- source_word: וְקֹוץ
  choice: முட்கள்
  rationale: קוֹץ என்பது முள்ளுள்ள வளர்ச்சியைக் குறிக்கிறது; இணைச்சொல்லுடன் வருவதால் தமிழில் பன்மைக் கூட்டுப்பொருளாக ‘முட்கள்’ இயல்பாக உள்ளது.
- source_word: וְדַרְדַּר
  choice: முட்செடிகள்
  rationale: דַּרְדַּר என்பது קוֹץ என்பதிலிருந்து வேறுபட்ட முள்ளுள்ள களைச்செடியைக் குறிக்கிறது. குறிப்பிட்ட தாவர இனத்தைத் தேவையின்றி நிர்ணயிக்காமல் இந்த வேறுபாட்டை ‘முட்செடிகள்’ காக்கிறது.
- source_word: תַּצְמִיחַ לָךְ
  choice: உனக்கு … விளைவிக்கும்
  rationale: צמח என்பதன் ஹிஃபில் வடிவத்திலுள்ள காரணவினைப் பொருளை ‘விளைவிக்கும்’ இயல்பான தமிழில் தருகிறது. לָךְ என்பதையும் ‘உனக்கு’ என்று வெளிப்படையாக வைத்திருக்கிறது.
- source_word: וְאָכַלְתָּ
  choice: நீ … உண்பாய்
  rationale: சூழலில் தொடரும் விளைவை எதிர்கால வினையாகத் தெளிவாகவும் dignified modern Tamil usage-இலும் வழங்குகிறது.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: வயல்வெளியின் தாவரங்கள்
  rationale: עֵשֶׂב என்பது புல்லை மட்டும் அல்லாமல் உண்ணத்தக்க பசுந்தாவரங்களையும் பரந்த வகையில் குறிக்கும். ‘தாவரங்கள்’ நவீனத் தமிழில் தெளிவானது; ‘வயல்வெளியின்’ என்பது எபிரேய இணைப்பை காக்கிறது.
theological_decisions:
- issue: תַּצְמִיחַ என்ற பெண்பால் ஒருமை வினையின் எழுவாய்
  choice: முந்தைய வசனத்திலுள்ள நிலத்தைச் சுட்டும் ‘அது’
  alternative: குறிப்பிட்ட முன்னிலையில்லாத பொதுநிலை ‘அது’
  rationale: எபிரேய பெண்பால் ஒருமை வினை, முந்தைய வசனத்தின் הָאֲדָמָה (‘நிலம்’) என்பதையே இயல்பாகத் திரும்பச் சுட்டுகிறது. ‘அது’ இந்தத் தொடர்பைத் தொடர்கிறது; வசனத்தில் இல்லாத பெயர்ச்சொல்லை மீண்டும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘விளைவிக்கும்’ என்பது காரணவினைப் பொருளை மரத்துப் போன சொல்லமைப்பின்றி இயல்பாகத் தருகிறது; ‘உனக்கு’ என்பதில் சூழலிலுள்ள பாதக உறவு விளக்கமாகச் சேர்க்கப்படாமல் மூலத்தின் திறந்த தன்மை காக்கப்படுகிறது.
