  text: כִּ֚י יֹדֵ֣עַ אֱלֹהִ֔ים כִּ֗י בְּ/יוֹם֙ אֲכָלְ/כֶ֣ם מִמֶּ֔/נּוּ וְ/נִפְקְח֖וּ עֵֽינֵי/כֶ֑ם וִ/הְיִיתֶם֙ כֵּֽ/אלֹהִ֔ים יֹדְעֵ֖י ט֥וֹב וָ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/005.yaml
  text: For God knows that on the day you eat from it[a], your eyes will be opened, and you will be like God, knowing good and evil.
translation:
  language: ta
  text: ஏனெனில், நீங்கள் அதிலிருந்து சாப்பிடும் நாளில் உங்கள் கண்கள் திறக்கப்படும்; நீங்கள் நன்மை தீமையை அறிந்தவர்களாய் கடவுளைப் போல் இருப்பீர்கள் என்று கடவுள் அறிவார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்குப் பாம்பு அளிக்கும் காரணத்தை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: יֹדֵעַ אֱלֹהִים
  choice: கடவுள் அறிவார்
  rationale: எபிரெயப் பங்கேற்புவினையின் நிகழ்காலப் பொருளை இயல்பான, மரியாதையான தமிழில் தருகிறது.
- source_word: בְּיוֹם אֲכָלְכֶם מִמֶּנּוּ
  choice: நீங்கள் அதிலிருந்து சாப்பிடும் நாளில்
  rationale: காலத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரைப் பாதுகாக்கிறது; இங்கு ‘நாள்’ என்பது அவசியம் 24 மணி நேரத்தைக் குறிக்காமல், சாப்பிடும் வேளையைக் குறிக்கலாம்.
- source_word: וְנִפְקְחוּ עֵינֵיכֶם
  choice: உங்கள் கண்கள் திறக்கப்படும்
  rationale: நிஃபால் வினைவடிவின் செயப்பாட்டுப் பொருளையும் புரிதல் அல்லது விழிப்புணர்வு குறித்த உருவகத்தையும் பாதுகாக்கிறது.
- source_word: וִהְיִיתֶם כֵּאלֹהִים
  choice: நீங்கள் கடவுளைப் போல் இருப்பீர்கள்
  rationale: உடனடிச் சூழலில் אֱלֹהִים ஒரே கடவுளைக் குறிப்பதே மிகச் சாத்தியம்; இருப்பினும் வேறு சாத்தியமான பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: יֹדְעֵי טוֹב וָרָע
  choice: நன்மை தீமையை அறிந்தவர்களாய்
  rationale: பங்கேற்புவினையின் பண்புரைப் பொருளையும் ‘நன்மை தீமை’ என்ற செறிவான நெறிசார் இணைப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: כֵּאלֹהִים என்பதில் אֱלֹהִים யாரைக் குறிக்கிறது
  choice: கடவுளைப் போல்
  alternative: தெய்வங்களைப் போல்; தெய்வீக உயிர்களைப் போல்
  rationale: இப்பகுதியின் உடனடிச் சூழல் ஒரே கடவுளைத் தொடர்ந்து குறிப்பிடுவதாலும், நன்மை தீமையை அறிவது தெய்வீக அறிவோடு இணைக்கப்படுவதாலும் முதன்மை உரையில் ‘கடவுளைப் போல்’ எனத் தரப்பட்டுள்ளது. எபிரெயச் சொல்லின் உண்மையான பொருள் மாறுபாட்டை மறைக்காமல் அடிக்குறிப்பில் மாற்று வாசிப்புகள் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சாப்பிடும் நாளில்’ என்ற வடிவம் மூலத்தின் கால மரபுத்தொடரை வைத்திருக்கிறது; ‘அறிந்தவர்களாய்’ என்பது பன்மை எழுவாயுடன் பொருந்தி எபிரெயப் பங்கேற்புவினையின் சுருக்கத்தையும் காக்கிறது.
