base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/024.yaml
  text: So he drove out the man[a], and to the east of the garden of Eden he stationed the cherubim and the flame of the sword that turns every way[b], to guard the way to the tree of life.
translation:
  language: ta
  text: அவர் அந்த மனிதனைத் துரத்திவிட்டு, வாழ்வின் மரத்திற்குச் செல்லும் வழியைக் காவல் காக்க, ஏதேன் தோட்டத்தின் கிழக்கே[a] கேருபீன்களையும் எல்லாத் திசைகளிலும் சுழலும் வாளின் தீச்சுடரையும்[b] நிறுத்திவைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏதேன் தோட்டத்தின் கிழக்குப்புறத்தில்.’ எபிரேயச் சொற்றொடர் தோட்டத்தின் கிழக்குப் பக்கம் அல்லது முன்புறத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: மரபாக, ‘எல்லாத் திசைகளிலும் சுழன்றுகொண்டிருந்த சுடர்வாள்’ என மொழிபெயர்க்கப்படுகிறது. எபிரேயத்தில் இன்னும் நேரடியாக, ‘தன்னைத்தானே திருப்பிக்கொள்ளும்/எல்லாத் திசைகளிலும் சுழலும் வாளின் தீச்சுடர்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: துரத்திவிட்டு
  rationale: גרשׁ வலுக்கட்டாயமாக வெளியேற்றுவதைக் குறிக்கிறது. ‘துரத்திவிட்டு’ என்பது அந்த வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: הָאָדָם
  choice: அந்த மனிதனை
  rationale: இங்கு אָדָם மனிதகுலத்தைப் பொதுவாக அல்லாமல், முன்னர் உருவாக்கப்பட்ட குறிப்பிட்ட மனிதனைக் குறிக்கிறது; தமிழில் குறிப்புத்தன்மைக்காக ‘அந்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: וַיַּשְׁכֵּן
  choice: நிறுத்திவைத்தார்
  rationale: שׁכן என்பதன் ஹிபீல் வடிவம் ஓர் இடத்தில் தங்கவைத்தல் அல்லது நிலைநிறுத்துதலைக் குறிக்கிறது; காவல் சூழலில் ‘நிறுத்திவைத்தார்’ இயல்பாக உள்ளது.
- source_word: מִקֶּדֶם לְגַן־עֵדֶן
  choice: ஏதேன் தோட்டத்தின் கிழக்கே
  rationale: இந்த இடச்சொற்றொடர் தோட்டத்தின் கிழக்குப்புறம் அல்லது கிழக்குப் பகுதியில் என்பதைக் குறிக்கிறது; ‘கிழக்கே’ அதன் சுருக்கமான இயல்பான தமிழ் வடிவம்.
- source_word: הַכְּרֻבִים
  choice: கேருபீன்கள்
  rationale: குறிப்பிட்ட விண்ணுலக உயிரினங்களுக்கான எபிரேயப் பெயரின் மரபான தமிழ் ஒலிபெயர்ப்பு பன்மையில் தரப்பட்டுள்ளது.
- source_word: לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת
  choice: எல்லாத் திசைகளிலும் சுழலும் வாளின் தீச்சுடர்
  rationale: எபிரேயத்தின் ‘வாளின் சுடர், சுழலுகிற ஒன்று’ என்ற அமைப்பையும் தொடர்ச்சியான பலதிசை இயக்கத்தையும் முடிந்தவரை காக்கிறது.
- source_word: לִשְׁמֹר
  choice: காவல் காக்க
  rationale: இங்கு שׁמר அணுகலைத் தடுக்கும் காவலைக் குறிக்கிறது; ‘காவல் காக்க’ தமிழில் தெளிவான சூழல்சார் மொழிபெயர்ப்பு.
- source_word: דֶּרֶךְ עֵץ הַחַיִּים
  choice: வாழ்வின் மரத்திற்குச் செல்லும் வழி
  rationale: சொல்லுக்கு சொல் வடிவம் ‘வாழ்வின் மரத்தின் வழி’; இலக்கு நோக்கிய பாதை என்ற பொருளை இயல்பான தமிழில் இவ்வாறு தருகிறது.
- source_word: עֵץ הַחַיִּים
  choice: வாழ்வின் மரம்
  rationale: கூட்டுச்சொற்றொடரின் நேரடியான, தெளிவான தமிழ் வடிவம்.
theological_decisions:
- issue: אָדָם என்பதன் சூழல்சார் பொருள்
  choice: அந்த மனிதன்
  alternative: மனிதகுலம் / மனிதன்
  rationale: வசனம் ஏதேனிலிருந்து வெளியேற்றப்பட்ட குறிப்பிட்ட தனிநபரைச் சுட்டுகிறது; மனிதகுலத்தைப் பொதுவாகக் கூறவில்லை.
- issue: மரத்தை அணுகும் வழியின் உறவு
  choice: வாழ்வின் மரத்திற்குச் செல்லும் வழி
  alternative: வாழ்வின் மரத்தின் வழி
  rationale: எபிரேயச் சார்பு அமைப்பை இலக்கு நோக்கிய வழியாகப் புரிந்துகொள்ளலாம்; தமிழில் பொருள் தெளிவாக இருக்க ‘செல்லும்’ சேர்க்கப்பட்டது, புதிய இறையியல் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. மூலத்தின் செயற்பாட்டு வலிமையும் ‘வாளின் தீச்சுடர்’ என்ற சற்றே அசாதாரணமான உருவக அமைப்பும் பாதுகாக்கப்பட்டுள்ளன; தெளிவுக்காக வாக்கிய உறுப்புகள் தமிழுக்கேற்ற வரிசையில் அமைக்கப்பட்டுள்ளன.
