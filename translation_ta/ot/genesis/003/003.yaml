base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/003.yaml
  text: But from the fruit of the tree that is in the middle of the garden[a], God said, ‘You shall not eat from it, and you shall not touch it, lest you die.’
translation:
  language: ta
  text: ஆனால், தோட்டத்தின் நடுவில்[a] இருக்கும் மரத்தின் கனியிலிருந்து நீங்கள் சாப்பிடக் கூடாது; அதைத் தொடவும் கூடாது; இல்லையெனில் நீங்கள் இறந்துவிடுவீர்கள் என்று கடவுள் சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தோட்டத்தின் மத்தியில்.”
    reason: בְּתוֹךְ என்பதற்கு ‘நடுவில்’ என்றும் ‘மத்தியில்’ என்றும் இயல்பாக மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וּ/מִ/פְּרִי
  choice: ஆனால் ... கனியிலிருந்து
  rationale: וְ இங்கு முந்தைய வசனத்துடன் உள்ள முரண்பாட்டைத் தொடர்வதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது; מִן என்பதன் மூல/பிரிவு சார்ந்த பொருளை ‘கனியிலிருந்து’ காக்கிறது.
- source_word: הָעֵץ
  choice: மரம்
  rationale: குறிப்பிட்ட மரத்தைக் குறிக்கும் எளிய, இயல்பான தமிழ் சொல்; வேற்றுமை அமைப்பில் definiteness தெளிவாகிறது.
- source_word: אֲשֶׁר בְּתוֹךְ הַגָּן
  choice: தோட்டத்தின் நடுவில் இருக்கும்
  rationale: בְּתוֹךְ என்பதன் உட்பகுதி அல்லது நடுப்பகுதி என்ற இடப்பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אָמַר אֱלֹהִים
  choice: கடவுள் சொன்னார்
  rationale: முன்னர் கூறப்பட்ட உரையை எடுத்துரைக்கும் qatal வடிவை இயல்பான தமிழ் இறந்தகாலத்தில் தருகிறது.
- source_word: לֹא תֹאכְלוּ
  choice: நீங்கள் சாப்பிடக் கூடாது
  rationale: எதிர்மறை இறைக் கட்டளையின் வலிமையை நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: מִמֶּנּוּ
  choice: அதிலிருந்து
  rationale: מִן முன்னிடைச்சொல்லின் பொருளைக் காத்து, சாப்பிடப்படக் கூடாதது எதிலிருந்து வருகிறது என்பதைத் தெளிவாக்குகிறது.
- source_word: וְלֹא תִגְּעוּ בוֹ
  choice: அதைத் தொடவும் கூடாது
  rationale: נגע என்பதன் நேரடியான ‘தொடு’ என்ற பொருளையும், கூடுதலான தடையாக உள்ள וְ என்பதையும் இயல்பான தமிழில் காக்கிறது.
- source_word: פֶּן
  choice: இல்லையெனில்
  rationale: எச்சரிக்கப்படும் எதிர்மறை விளைவை அறிமுகப்படுத்தும் פֶּן என்பதற்கு வாசிக்க எளிதான இயல்பான தமிழ் இணைச்சொல்.
- source_word: תְּמֻתוּן
  choice: நீங்கள் இறந்துவிடுவீர்கள்
  rationale: பேசுபவர் எச்சரிக்கும் மரண விளைவைத் தெளிவாகத் தருகிறது; ‘இல்லையெனில்’ உடன் இணைந்து פֶּן தரும் எச்சரிக்கைச் சூழலைக் காக்கிறது.
theological_decisions:
- issue: ஆதியாகமம் 2:17-இல் உள்ள கடவுளின் கட்டளையிலிருந்து ஏவாளின் மேற்கோள் வேறுபட்டு, ‘அதைத் தொடவும் கூடாது’ என்பதைச் சேர்க்கிறது.
  choice: இந்த வசனத்தில் ஏவாள் கூறியபடியே ‘அதைத் தொடவும் கூடாது’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ஆதியாகமம் 2:17-க்கு ஒத்திசைக்க இந்தச் சொற்றொடரை நீக்குவது அல்லது அதன் வலிமையைக் குறைப்பது.
  rationale: எபிரெய உரையில் உள்ள ஏவாளின் சொற்களையும், அவை முந்தைய கட்டளையுடன் உருவாக்கும் கதை மற்றும் இறையியல் பதற்றத்தையும் மொழிபெயர்ப்பு தீர்த்துவிடாமல் காக்க வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு விளங்கும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘சாப்பிடக் கூடாது’ மற்றும் ‘தொடவும் கூடாது’ என்பவை கட்டளையின் வலிமையைப் பேணும் இயல்பான நடை; ஏவாளின் சொற்கள் முந்தைய வசனத்தோடு ஒத்திசைக்கப்படவில்லை.
