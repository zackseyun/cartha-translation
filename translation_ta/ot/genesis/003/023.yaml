source:
  edition: WLC
  text: וַֽ/יְשַׁלְּחֵ֛/הוּ יְהוָ֥ה אֱלֹהִ֖ים מִ/גַּן עֵ֑דֶן לַֽ/עֲבֹד֙ אֶת הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר לֻקַּ֖ח מִ/שָּֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/023.yaml
  text: So Yahweh God sent him out from the garden of Eden to work the ground from which he had been taken[a].
translation:
  language: ta
  text: எனவே, யாவே தேவன், அவன் எடுக்கப்பட்ட நிலத்தை உழுவதற்காக[a] அவனை ஏதேன் தோட்டத்திலிருந்து அனுப்பிவிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிலத்தைப் பண்படுத்துவதற்காக.” இங்குள்ள எபிரெய வினைச்சொல் “வேலை செய்,” “பணி செய்,” அல்லது இச்சூழலில் “பண்படுத்து” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחֵהוּ
  choice: அவனை ... அனுப்பிவிட்டார்
  rationale: שׁלח என்பதன் பியேல் வடிவம் இங்கு ஒருவரை ஓர் இடத்திலிருந்து அனுப்பிவிடுவதைக் குறிக்கிறது. அடுத்த வசனத்தில் வரும் גרשׁ என்பதற்குரிய வலுவான ‘துரத்திவிட்டார்’ என்ற நுணுக்கத்தை இங்கே முன்கூட்டியே சேர்க்காமல், தோட்டத்திலிருந்து அகற்றப்பட்டதையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: יְהוָה אֱלֹהִים
  choice: யாவே தேவன்
  rationale: יהוה என்ற தனிப்பெயரை ‘யாவே’ என்றும், אֱלֹהִים என்பதை ‘தேவன்’ என்றும் வழங்கி, எபிரெயச் சேர்க்கையைப் பாதுகாக்கிறது.
- source_word: מִגַּן עֵדֶן
  choice: ஏதேன் தோட்டத்திலிருந்து
  rationale: מִן குறிக்கும் இடத்திலிருந்து பிரிதல் அல்லது வெளியேற்றப்படுதல் தமிழில் ‘-இலிருந்து’ என்பதால் இயல்பாக வெளிப்படுகிறது.
- source_word: לַעֲבֹד אֶת הָאֲדָמָה
  choice: நிலத்தில் உழைப்பதற்காக
  rationale: עבד என்பதற்கு ‘வேலைசெய்,’ ‘பணிசெய்,’ ‘பண்படுத்து’ ஆகிய பொருள்கள் உள்ளன. நிலத்தைப் பற்றிய இச்சூழலில் ‘நிலத்தில் உழை’ என்பது வேளாண் பணியை இயல்பாகக் குறிக்கிறது; அதேவேளையில் அளவுக்கு மீறித் துல்லியப்படுத்துவதில்லை.
- source_word: אֲשֶׁר לֻקַּח מִשָּׁם
  choice: தான் எடுக்கப்பட்ட
  rationale: எபிரெயச் செயலப்பாட்டு வடிவத்தையும், மனிதன் முன்பு நிலத்திலிருந்து எடுக்கப்பட்டான் என்ற காலத் தொடர்பையும் சுருக்கமான, இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக இடம்பெறும் உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: மனிதனின் பணிக்கும் அவன் எடுக்கப்பட்ட நிலத்திற்கும் உள்ள தொடர்பு
  choice: தான் எடுக்கப்பட்ட நிலத்தில் உழைப்பதற்காக
  alternative: தான் எடுக்கப்பட்ட நிலத்தைப் பண்படுத்துவதற்காக
  rationale: ஆதியாகமம் 2–3 இல் மனிதனுக்கும் நிலத்திற்கும் உள்ள சொல் மற்றும் கருத்துத் தொடர்பைக் காக்கிறது; இந்த வசனம் வெளிப்படையாகக் கூறாத சாபம் அல்லது மீட்பு சார்ந்த விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘அனுப்பிவிட்டார்’ என்பது வெளியே அனுப்பப்பட்டதைக் காட்டுகிறது; அடுத்த வசனத்தின் வலுவான ‘துரத்துதல்’ பொருளை இவ்வசனத்தில் புகுத்தவில்லை. ‘நிலத்தில் உழை’ என்பது தமிழில் இயல்பான வேளாண் வழக்கு; அடிக்குறிப்பு எபிரெய வினையின் பரந்த பொருள் வரம்பைப் பாதுகாக்கிறது.
