revisions:
- from: எனவே, யாவே தேவன், தான் எடுக்கப்பட்ட நிலத்தில் உழைப்பதற்காக[a] அவனை ஏதேன் தோட்டத்திலிருந்து அனுப்பிவிட்டார்.
  to: எனவே, யாவே தேவன், அவன் எடுக்கப்பட்ட நிலத்தை உழுவதற்காக[a] அவனை ஏதேன் தோட்டத்திலிருந்து அனுப்பிவிட்டார்.
  rationale: The revision changes only the grammatical relation of ‘ground’ from a location to the object of cultivation, as required by the Hebrew אֶת־הָאֲדָמָה, and clarifies that the man was taken from that ground. The footnote is retained with idiomatic spacing and preserves the relevant lexical alternatives.
