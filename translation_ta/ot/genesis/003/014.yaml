  text: וַ/יֹּאמֶר֩ יְהֹוָ֨ה אֱלֹהִ֥ים אֶֽל הַ/נָּחָשׁ֮ כִּ֣י עָשִׂ֣יתָ זֹּאת֒ אָר֤וּר אַתָּה֙ מִ/כָּל הַ/בְּהֵמָ֔ה וּ/מִ/כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה עַל גְּחֹנְ/ךָ֣ תֵלֵ֔ךְ וְ/עָפָ֥ר תֹּאכַ֖ל כָּל יְמֵ֥י חַיֶּֽי/ךָ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/014.yaml
  text: Then Yahweh God said to the serpent[a], “Because you have done this, cursed are you above all livestock and above every beast of the field. On your belly you shall go[b], and dust you shall eat all the days of your life.”
translation:
  language: ta
  text: அப்போது யாவே தேவன் பாம்பிடம், “நீ இதைச் செய்ததால், எல்லா கால்நடைகளையும் வயல்வெளியில் உள்ள எல்லா விலங்குகளையும் விட நீ அதிகமாகச் சபிக்கப்பட்டவன். உன் வயிற்றின்மேல் நீ செல்வாய்; உன் வாழ்நாளெல்லாம் புழுதியைத் தின்பாய்[b].” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘புழுதியைத் தின்பது’ என்பது நேரடியான படிமத்துடன், அவமானத்தையும் தோல்வியையும் குறிக்கும் சொல்லாட்சியாகவும் இருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: יְהֹוָה אֱלֹהִים
  choice: யாவே தேவன்
  rationale: தெய்வீகப் பெயரான יהוה என்பதை ஒலிபெயர்த்து, அடுத்துள்ள אֱלֹהִים என்பதை இயல்பான தமிழில் ‘தேவன்’ என வழங்குகிறது; மூலத்தின் பெயர்–பட்டப்பெயர் இணைப்பைத் தக்கவைக்கிறது.
- source_word: הַנָּחָשׁ
  choice: பாம்பு
  rationale: இச்சூழலில் snake/serpent ஆகிய இரு பொருள்களையும் இயல்பான நவீன தமிழில் குறிக்கும் பொதுவான சொல்.
- source_word: כִּי עָשִׂיתָ זֹּאת
  choice: நீ இதைச் செய்ததால்
  rationale: வரவிருக்கும் தீர்ப்புக்கான காரணத்தைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: אָרוּר אַתָּה
  choice: நீ சபிக்கப்பட்டவன்
  rationale: எபிரெய முன்னிலைப்படுத்தலைத் தமிழில் அப்படியே பின்பற்றுவது செயற்கையாக இருப்பதால், அதன் நீதித்தீர்ப்புத் தொனியை இயல்பான வாக்கிய அமைப்பில் காக்கிறது.
- source_word: מִכָּל הַבְּהֵמָה וּמִכֹּל חַיַּת הַשָּׂדֶה
  choice: எல்லா கால்நடைகளிலும் வயல்வெளியின் எல்லா விலங்குகளிலும்
  rationale: מן என்பதன் ஒப்பீட்டுப் பொருளை ‘-இலும்’ என்ற அமைப்பால் காட்டுகிறது; בְּהֵמָה மற்றும் חַיַּת הַשָּׂדֶה இடையிலான கால்நடை–வயல்வெளி விலங்கு வேறுபாட்டையும் காக்கிறது.
- source_word: עַל גְּחֹנְךָ תֵלֵךְ
  choice: உன் வயிற்றின்மேல் நீ செல்வாய்
  rationale: תֵלֵךְ என்பது நேரடியாக ‘செல்’ என்பதே; ‘ஊர்ந்து செல்’ என்று மூலத்தில் இல்லாத முறையைச் சேர்க்காமல் வயிற்றின்மேல் செல்லும் படிமத்தைக் காக்கிறது.
- source_word: וְעָפָר תֹּאכַל
  choice: புழுதியைத் தின்பாய்
  rationale: עָפָר என்பதன் மண்/புழுதி படிமத்தை ‘புழுதி’ தெளிவாகக் காட்டுகிறது; விலங்கைக் குறித்திருப்பதால் ‘தின்பாய்’ இயல்பானது.
- source_word: כָּל יְמֵי חַיֶּיךָ
  choice: உன் வாழ்நாளெல்லாம்
  rationale: ‘உன் வாழ்வின் எல்லா நாட்களிலும்’ என்ற முழுப் பொருளைச் சுருக்கமின்றி இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: பாம்பின் அடையாளம்
  choice: முதன்மை உரையில் பாம்பை ‘பாம்பு’ என்றே குறிப்பிடுதல்
  alternative: சாத்தான் என்று விளக்கமாக விரிவாக்குதல்
  rationale: இந்த வசனம் உடனடி கதையாடலில் பாம்பையே நேரடியாகச் சுட்டுகிறது; பிற்கால வேதாகமத் தொடர்பை மொழிபெயர்ப்புக்குள் புகுத்தாமல் உரையின் இறையியல் இடைவெளியைப் பாதுகாக்கிறது.
- issue: புழுதியைத் தின்பதன் தன்மை
  choice: முதன்மை உரையில் நேரடியான உருவகத்தை அப்படியே வைத்தல்
  alternative: அவமானப்பட்டுத் தோற்பாய் என்று விளக்கிப் பெயர்த்தல்
  rationale: இந்தச் சொற்றொடர் உடல்சார் படிமத்தையும் அவமானம் அல்லது தோல்வியைக் குறிக்கும் மரபுத் தொனியையும் தாங்கக்கூடும்; மொழிபெயர்ப்பு ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் குறிப்பில் சாத்தியத்தை விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. மூலத்தின் தீர்ப்புத் தொனியும் உருவகத் தெளிவும் காக்கப்பட்டுள்ளன; ‘செல்வாய்’ என்பது எபிரெய வினையின் பொதுவான பொருளைத் தக்கவைக்கிறது.
