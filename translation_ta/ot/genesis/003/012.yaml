id: GEN.3.12
reference: Genesis 3:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר הָֽ/אָדָ֑ם הָֽ/אִשָּׁה֙ אֲשֶׁ֣ר נָתַ֣תָּה עִמָּדִ֔/י הִ֛וא נָֽתְנָה לִּ֥/י מִן הָ/עֵ֖ץ וָ/אֹכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/012.yaml
  text: And the man said[a], “The woman whom you gave to be with me—she gave me from the tree, and I ate.”
translation:
  language: ta
  text: அப்போது அந்த மனிதன், “என்னுடன் இருக்கும்படி நீர் கொடுத்த பெண்—அவள்தான் அந்த மரத்திலிருந்து எனக்குக் கொடுத்தாள்; நான் சாப்பிட்டேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָדָם
  choice: அந்த மனிதன்
  rationale: இங்கு மனிதகுலம் பொதுவாகக் குறிக்கப்படாமல், குறிப்பிட்ட ஆண் மனிதன் குறிக்கப்படுவதால் ‘அந்த மனிதன்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: הָאִשָּׁה
  choice: பெண்
  rationale: ‘மனைவி’ என்பதும் சில சூழல்களில் சாத்தியமானாலும், இங்கு எபிரெயச் சொல்லின் நேரடியான பொருளான ‘பெண்’ பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר נָתַתָּה עִמָּדִי
  choice: என்னுடன் இருக்கும்படி நீர் கொடுத்த
  rationale: עִמָּדִי என்பதிலுள்ள ‘என்னுடன்’ என்ற உறவுநிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மனிதன் கடவுளை மறைமுகமாகக் குற்றஞ்சாட்டும் பதற்றத்தையும் மென்மைப்படுத்தவில்லை.
- source_word: הִוא
  choice: அவள்தான்
  rationale: தனியாக இடம்பெறும் எபிரெயப் பிரதிப்பெயரின் வலியுறுத்தலைத் தமிழில் ‘தான்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נָתְנָה לִי
  choice: எனக்குக் கொடுத்தாள்
  rationale: நிகழ்ந்த செயலை எளிய இறந்தகாலத்தில் தெளிவாக வழங்குகிறது.
- source_word: מִן הָעֵץ
  choice: அந்த மரத்திலிருந்து
  rationale: மூலத்தில் ‘கனி’ என்ற சொல் வெளிப்படையாக இல்லாததால் அதைச் சேர்க்கவில்லை. தமிழில் கொடுக்கப்பட்ட பொருளைச் சூழலிலிருந்து இயல்பாகப் புரிந்துகொள்ள முடியும்.
- source_word: וָאֹכֵל
  choice: நானும் சாப்பிட்டேன்
  rationale: வினைநிகழ்வின் தொடர்ச்சியை இயல்பான நவீன தமிழில் தருகிறது; காரணப்பொருளைச் சேர்க்காமல் ‘அதனால்’ போன்ற விளக்கத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: மனிதன் கடவுள்மீதும் பெண்ண்மீதும் பழியை மாற்றுவதாகத் தோன்றும் உட்குறிப்பு
  choice: ‘என்னுடன் இருக்கும்படி நீர் கொடுத்த பெண்’ என்ற அமைப்பை அப்படியே பாதுகாத்தல்
  alternative: ‘என்னுடன் இருந்த பெண்’ என்று கடவுளின் செயலை மறைத்தல், அல்லது ‘நீர்தான் கொடுத்த பெண்’ என்று குற்றச்சாட்டை வலுப்படுத்தல்
  rationale: மூலவாக்கியம் மனிதனின் மறுமொழியிலுள்ள பதற்றத்தை வெளிப்படுத்துகிறது. அதை மென்மைப்படுத்தாமலும் மிகைப்படுத்தாமலும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதைமிக்க நடையில் வடிவமைக்கப்பட்டது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவமாக ‘நீர்’ பயன்படுத்தப்பட்டது. ‘அவள்தான்’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது; நீண்ட கோடு அந்த வலியுறுத்தலையும் மனிதனின் பழிமாற்றும் தொனியையும் இயல்பாக எடுத்துக்காட்டுகிறது.
