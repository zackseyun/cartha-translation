revisions:
- from: அப்போது அந்த மனிதன், “என்னுடன் இருக்கும்படி நீர் கொடுத்த பெண்—அவள்தான் அந்த மரத்திலிருந்து எனக்குக் கொடுத்தாள்; நானும் சாப்பிட்டேன்” என்றான்.
  to: அப்போது அந்த மனிதன், “என்னுடன் இருக்கும்படி நீர் கொடுத்த பெண்—அவள்தான் அந்த மரத்திலிருந்து எனக்குக் கொடுத்தாள்; நான் சாப்பிட்டேன்” என்றான்.
  rationale: The revision removes only the potentially additive particle in ‘நானும்,’ yielding a straightforward rendering of ‘and I ate.’ All source-sensitive features of the draft, including the implied object after ‘gave,’ the woman’s emphatic identification, and the implicit blame-bearing tension in ‘நீர் கொடுத்த பெண்,’ are retained.
