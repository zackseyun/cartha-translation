id: GEN.3.21
reference: Genesis 3:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּעַשׂ֩ יְהוָ֨ה אֱלֹהִ֜ים לְ/אָדָ֧ם וּ/לְ/אִשְׁתּ֛/וֹ כָּתְנ֥וֹת ע֖וֹר וַ/יַּלְבִּשֵֽׁ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/021.yaml
  text: And Yahweh God made garments of skin for the man and for his wife[b][a], and clothed them.
translation:
  language: ta
  text: யாவே தேவன் மனிதனுக்கும்[a] அவன் மனைவிக்கும் தோலினால் ஆன உடைகளை[b] செய்து, அவர்களுக்கு அணிவித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆதாமுக்கும் அவன் மனைவிக்கும்.” எபிரெய மொழியில் אָדָם என்பது சூழலுக்கேற்ப “மனிதன்” என்ற பொதுப்பெயராகவோ, “ஆதாம்” என்ற தனிப்பெயராகவோ அமையலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “தோலால் ஆன அங்கிகளை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: யாவே தேவன்
  rationale: இறைப்பெயரான יהוה என்பதைப் பட்டத்தால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்த்து, אֱלֹהִים என்பதை இயல்பான தமிழ் வழக்கில் ‘தேவன்’ என வழங்குகிறது.
- source_word: לְאָדָם
  choice: மனிதனுக்கும்
  rationale: இங்கு ஆண் மனிதன் அவன் மனைவியுடன் வேறுபடுத்திக் குறிப்பிடப்படுகிறான். இருப்பினும் אָדָם என்பதில் ‘ஆதாம்’ என்ற தனிப்பெயர் வாசிப்பும் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּלְאִשְׁתּוֹ
  choice: அவன் மனைவிக்கும்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள אִשָּׁה, இச்சூழலில் இயல்பாக ‘அவன் மனைவி’ என்று பொருள்படுகிறது.
- source_word: כָּתְנוֹת עוֹר
  choice: தோலினால் ஆன உடைகளை
  rationale: כֻּתֹּנֶת என்பது உடலை மூடும் அங்கி அல்லது உடையைக் குறிக்கும்; עוֹר என்பது தோல். தமிழில் இயல்பாகவும் மூலத்தின் பொருளை மிகைப்படுத்தாமலும் ‘தோலினால் ஆன உடைகள்’ என வழங்கப்பட்டுள்ளது.
- source_word: וַיַּעַשׂ
  choice: செய்து
  rationale: עשה என்பதன் நேரடியான பொதுப்பொருள் ‘செய்/உருவாக்கு’; வாக்கியத் தொடர்ச்சிக்கேற்ப ‘செய்து’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּלְבִּשֵׁם
  choice: அவற்றை அவர்களுக்கு அணிவித்தார்
  rationale: לבש என்பதன் ஹிஃபில் வடிவம் ‘அணியச் செய்தல்/அணிவித்தல்’ என்று பொருள்படும். உடைகளைப் பொருளாக வெளிப்படுத்தி, தமிழில் தெளிவாக ‘அவற்றை அவர்களுக்கு அணிவித்தார்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: אָדָם என்பதைப் பொதுப்பெயராகவா தனிப்பெயராகவா மொழிபெயர்ப்பது
  choice: ‘மனிதன்’ என்ற பொதுப்பெயர்
  alternative: ‘ஆதாம்’ என்ற தனிப்பெயர்
  rationale: இவ்வசனம் ஆண் மனிதனை ‘அவன் மனைவி’ என்பவளுடன் வேறுபடுத்துகிறது; இக்கதைப்பகுதியில் பொதுப்பெயர் நயம் இன்னும் தெளிவாக உள்ளது. அதேவேளையில் எபிரெயச் சொல்லின் தனிப்பெயர் வாசிப்பும் உண்மையான சாத்தியம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘யாவே’ என இறைப்பெயர் பாதுகாக்கப்பட்டுள்ளது; אָדָם மற்றும் כֻּתֹּנֶת ஆகியவற்றின் மாற்று வாசிப்புகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
