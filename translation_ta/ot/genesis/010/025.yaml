source:
  edition: WLC
  text: וּ/לְ/עֵ֥בֶר יֻלַּ֖ד שְׁנֵ֣י בָנִ֑ים שֵׁ֣ם הָֽ/אֶחָ֞ד פֶּ֗לֶג כִּ֤י בְ/יָמָי/ו֙ נִפְלְגָ֣ה הָ/אָ֔רֶץ וְ/שֵׁ֥ם אָחִ֖י/ו יָקְטָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/025.yaml
  text: 'And to Eber two sons were born: the name of the one was Peleg[a], for in his days the earth was divided, and his brother''s name was Joktan.'
translation:
  language: ta
  text: மேலும், ஏபேருக்கு இரண்டு மகன்கள் பிறந்தார்கள்; அவர்களில் ஒருவனுடைய பெயர் பெலேக்[a], ஏனெனில் அவனுடைய நாட்களில் பூமி பிரிக்கப்பட்டது; அவனுடைய சகோதரனின் பெயர் யக்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிலம் பிரிக்கப்பட்டது.” எபிரெயச் சொல் “பூமி” அல்லது “நிலம்” எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעֵבֶר יֻלַּד שְׁנֵי בָנִים
  choice: ஏபேருக்கு இரண்டு மகன்கள் பிறந்தார்கள்
  rationale: எபிரெயச் சொல்லமைப்பிலுள்ள பெறுநிலைப் பொருளையும், ילד வினையின் செயப்பாட்டு வடிவையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: שֵׁם הָאֶחָד
  choice: ஒருவனுடைய பெயர்
  rationale: ‘ஒருவனின் பெயர்’ என்ற மூலத்தின் வேறுபடுத்திக் காட்டும் அமைப்பைத் தக்கவைத்து, ‘முதலாவது’ என்று மூலத்தில் இல்லாத வரிசையைச் சேர்க்கவில்லை.
- source_word: פֶּלֶג
  choice: பேலேகு
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் எழுத்துப்பெயர்க்கிறது; இறுதி மெய்யைத் தெளிவாக உச்சரிக்க உதவும் வடிவம்.
- source_word: כִּי בְיָמָיו
  choice: ஏனெனில் அவனுடைய நாட்களில்
  rationale: כִּי வழங்கும் விளக்கக் காரணத்தையும், ‘அவனுடைய நாட்களில்’ என்ற காலச் சொற்றொடரையும் நேரடியாகக் காக்கிறது.
- source_word: נִפְלְגָה
  choice: பிரிக்கப்பட்டது
  rationale: פלג என்பதன் நிபால் வடிவிலுள்ள செயப்பாட்டுப் பொருளைத் தருகிறது; பேலேகு என்ற பெயருடனான மூலமொழிச் சொல் தொடர்பையும் இயன்றவரை உணர்த்துகிறது.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: தேசங்களின் வம்சப்பட்டியல் என்ற விரிந்த சூழலில் ‘பூமி’ பொருத்தமாக உள்ளது; ‘நிலம்/நாடு’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְשֵׁם אָחִיו יָקְטָן
  choice: அவனுடைய சகோதரனின் பெயர் யொக்தான்
  rationale: எபிரெய உடைமைத் தொடர்பை இயல்பான தமிழ்ச் சொல்லமைப்பில் வழங்குகிறது; தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: הָאָרֶץ என்பதன் பரப்பு
  choice: பூமி
  alternative: நிலம் அல்லது நாடு
  rationale: ஆதியாகமம் 10-இன் உலகளாவிய தேசப் பட்டியல் சூழல் ‘பூமி’ என்பதை ஆதரிக்கிறது. எனினும், பிரிவின் துல்லியமான இயல்பை வசனம் கூறுவதைக் கடந்து வரையறுக்காமல், எபிரெயச் சொல்லின் குறுகிய புவியியல் பொருளும் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட வம்சவரலாற்று நடை பயன்படுத்தப்பட்டது. வசனத்தின் இரண்டு இணையான பெயரிடும் கூறுகள் தெளிவுக்காக தனித்தனி வாக்கியங்களாக வழங்கப்பட்டுள்ளன; காரணக் கூறின் மூலத் தொடர்பு காக்கப்பட்டுள்ளது.
