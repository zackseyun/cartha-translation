  edition: WLC
  text: וַֽ/יְהִ֥י מוֹשָׁבָ֖/ם מִ/מֵּשָׁ֑א בֹּאֲ/כָ֥ה סְפָ֖רָ/ה הַ֥ר הַ/קֶּֽדֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/030.yaml
  text: And their settlement was from Mesha as you go toward Sephar[a], the hill country of the east.
translation:
  language: ta
  text: அவர்கள் குடியிருந்த பகுதி மேசாவிலிருந்து செப்பாரை நோக்கி, கிழக்கிலுள்ள மலைநாடு வரை இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் குடியிருப்பு மேசாவிலிருந்து, கிழக்கின் மலையான செப்பாரை நோக்கி இருந்தது.”
    reason: ‘மலை’ என்பது கிழக்கிலுள்ள மலைப்பகுதியைக் குறிக்கிறதா, அல்லது செப்பாரை ‘கிழக்கின் மலை’ என்று விளக்குகிறதா என்பதில் எபிரேயச் சொற்றொடர் சுருக்கமாகவும் இருபொருளுக்கு இடமளிப்பதாகவும் உள்ளது.
lexical_decisions:
- source_word: וַיְהִי
  choice: இருந்தது
  rationale: היה வினையின் எளிய இருப்புப் பொருளைத் தக்கவைத்து, முந்தைய விவரணையுடன் தொடரும் எபிரேயக் கதைநடையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מוֹשָׁבָם
  choice: அவர்கள் குடியிருந்த பகுதி
  rationale: מוֹשָׁב என்பது வாழிடம் அல்லது குடியிருப்புப் பகுதியைக் குறிக்கலாம். இங்கு மக்கள் வாழ்ந்த நிலப்பரப்பின் எல்லை விவரிக்கப்படுவதால், ‘அவர்கள் குடியிருந்த பகுதி’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: מִמֵּשָׁא
  choice: மேசாவிலிருந்து
  rationale: இது ஓர் இடப்பெயர்; எபிரேய உச்சரிப்பை அணுகும் வகையில் ‘மேசா’ என்று ஒலிபெயர்க்கப்பட்டு, מִן முன்னிடைச்சொல் ‘-இலிருந்து’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: בֹּאֲכָה
  choice: போகும் திசையில்
  rationale: בוא அடிப்படையிலான இந்த நிலவியல் வழக்கு ஓர் இடத்தை நோக்கிய இயக்கம் அல்லது திசையைக் குறிக்கிறது. ‘போகும் திசையில்’ என்பது அதைப் புரியத்தக்க நவீன தமிழில் தருகிறது.
- source_word: סְפָרָה
  choice: செப்பாருக்கு
  rationale: இது திசையைக் குறிக்கும் ה இறுதியுடன் வந்துள்ள இடப்பெயர். அந்தத் திசைப் பொருள் தமிழ் வேற்றுமையுருபிலும் சுற்றியுள்ள சொற்றொடரிலும் வெளிப்படுத்தப்படுகிறது.
- source_word: הַר
  choice: மலைநாடு
  rationale: நிலவியல் எல்லை விவரிப்பில் הַר ஒரு தனி மலையையோ மலைப்பாங்கான பகுதியையோ குறிக்கலாம். முதன்மை உரையில் பிராந்தியப் பொருளான ‘மலைநாடு’ தேர்ந்தெடுக்கப்பட்டு, தனி மலை என்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: הַקֶּדֶם
  choice: கிழக்கிலுள்ள
  rationale: קֶדֶם இங்கு கிழக்கு அல்லது கிழக்குப் பகுதியைக் குறிக்கிறது. ‘கிழக்கிலுள்ள’ என்பது הַר உடனான தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
