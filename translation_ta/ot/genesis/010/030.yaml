translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified நிலவியல் நடையில் வடிவமைக்கப்பட்டது. ‘குடியிருந்த பகுதி’ என்பது தனிநபர் வசிப்பிடத்தைவிட இனக்குழுவின் நிலப்பரப்பைக் காட்டுகிறது. மூலத்தின் நிலவியல் சுருக்கமும் ‘மலை/மலைநாடு’ என்ற ambiguity-யும் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளன.
