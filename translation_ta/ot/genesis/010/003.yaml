lexical_decisions:
- source_word: וּ/בְנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பது בֵּן என்பதன் பன்மை இணைப்புநிலை வடிவம். வம்சவரிசைச் சூழலில் “மகன்கள்” என்பது இயல்பாகவும் மூலத்துக்கு நெருக்கமாகவும் உள்ளது. எபிரெய முன்னொட்டு וּ தொடர்ச்சியைச் சுட்டினாலும், முந்தைய வசனத்துடன் தமிழில் இயல்பான பட்டியல் தொடர்ச்சிக்காக தனியே “மேலும்” சேர்க்கப்படவில்லை.
- source_word: גֹּמֶר
  choice: கோமர்
  rationale: ஆள்பெயர்; எபிரெய ஒலிப்புக்கு ஏற்றவாறு தமிழில் ஒலிபெயர்க்கப்பட்டது. இணைப்புநிலையைத் தமிழில் “கோமேரின்” எனக் காட்ட உயிர்மாற்றம் செய்யப்பட்டுள்ளது.
- source_word: אַשְׁכֲּנַז
  choice: அஸ்கெனாஸ்
  rationale: ஆள்பெயர்; எபிரெய வடிவத்தை அடிப்படையாகக் கொண்டு தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְ/רִיפַת
  choice: ரீபத்
  rationale: WLC/மசோரா உரையின் רִיפַת என்ற வாசகத்தை முதன்மை உரையில் பின்பற்றுகிறது. 1 நாளாகமம் 1:6-இன் வேறுபட்ட வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְ/תֹגַרְמָה
  choice: தோகர்மா
  rationale: ஆள்பெயர்; எபிரெய ஒலிப்பை அடிப்படையாகக் கொண்டு தமிழில் ஒலிபெயர்க்கப்பட்டது.
