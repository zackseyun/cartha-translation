  register: நவீன பொதுத்தமிழில், வம்சவரிசைக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை. ஆள்பெயர்கள் மூல எபிரெய வடிவங்களிலிருந்து நேரடியாக ஒலிபெயர்க்கப்பட்டுள்ளன; உரையில் உள்ள [a] குறி அடிக்குறிப்புடன் பொருந்துகிறது.
