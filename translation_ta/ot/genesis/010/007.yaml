id: GEN.10.7
reference: Genesis 10:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/בְנֵ֣י כ֔וּשׁ סְבָא֙ וַֽ/חֲוִילָ֔ה וְ/סַבְתָּ֥ה וְ/רַעְמָ֖ה וְ/סַבְתְּכָ֑א וּ/בְנֵ֥י רַעְמָ֖ה שְׁבָ֥א וּ/דְדָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/007.yaml
  text: 'And the sons of Cush: Seba[a], Havilah, Sabtah, Raamah, and Sabteca[b]. And the sons of Raamah: Sheba and Dedan.'
translation:
  language: ta
  text: 'கூஷின் மகன்கள்[a]: செவா, ஹவிலா, சவ்தா, ராமா, சவ்தெகா[b]. ராமாவின் மகன்கள்: ஷெவா, தெதான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வம்சப் பட்டியல்களில் எபிரெய மொழியின் ‘மகன்கள்’ என்பது உடனடியாகப் பிறந்த மகன்களை மட்டுமல்லாமல், வழித்தோன்றல்களையோ ஒரு குலம் அல்லது மக்கள் குழுவின் தோற்றத்தையோ குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: இந்த வசனத்திலுள்ள பல பெயர்கள் தனிநபர்களை மட்டுமல்லாமல், மக்களினங்களையோ நிலப்பகுதிகளையோ அவற்றின் பெயருக்குரிய மூதாதையர்களையோ குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பதன் நேரடியான பொருள் ‘மகன்கள்’. வம்சப் பட்டியலில் இது உடனடிப் புதல்வர்களை மட்டுமல்லாமல் வழித்தோன்றல்களையோ மக்கள் குழுக்களின் மூதாதையரையோ குறிக்கக்கூடும்; அந்த விரிவை அடிக்குறிப்பு விளக்குகிறது.
- source_word: כּוּשׁ
  choice: கூஷ்
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் பெயரெழுத்தாக்கம்.
- source_word: סְבָא
  choice: செபா
  rationale: שְׁבָא என்பதிலிருந்து வேறுபாடு தெளிவாக இருக்க, samekh எழுத்தை ‘ச’ ஒலியால் பெயரெழுத்தாக்குகிறது.
- source_word: חֲוִילָה
  choice: அவிலா
  rationale: தொடக்க எபிரெய மெய்யின் மென்மையான தொண்டையொலியைத் தமிழில் இயல்பாக ‘அ’ எனக் கொண்டு செய்யப்பட்ட பெயரெழுத்தாக்கம்.
- source_word: סַבְתָּה
  choice: சப்தா
  rationale: எபிரெயப் பெயரின் மெய்யொலி வரிசையைத் தெளிவாகப் பாதுகாக்கும் தமிழ் பெயரெழுத்தாக்கம்.
- source_word: רַעְמָה
  choice: ராமா
  rationale: நடுவிலுள்ள ע தமிழில் தனி இணைஒலி இல்லாததால், எபிரெய உயிரொலியை இயல்பாக வெளிப்படுத்தும் பெயரெழுத்தாக்கம்.
- source_word: סַבְתְּכָא
  choice: சப்தெகா
  rationale: எபிரெயப் பெயரின் மெய் மற்றும் உயிர் வரிசையை நெருக்கமாகப் பிரதிபலிக்கும் வடிவம்.
- source_word: וּבְנֵי רַעְמָה
  choice: ராமாவின் மகன்கள்
  rationale: மூலத்தின் மீளும் வம்சவழிச் சூத்திரத்தைப் பாதுகாத்து, தமிழில் இயல்பான உடைமைத் தொடராக வழங்குகிறது.
- source_word: שְׁבָא
  choice: ஷெபா
  rationale: שׁ என்ற ஒலியை ‘ஷ’ என வழங்குவதால், இவ்வசனத்திலுள்ள סְבָא (‘செபா’) என்ற வேறு பெயரிலிருந்து தெளிவாக வேறுபடுகிறது.
- source_word: דְדָן
  choice: தெதான்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பை தமிழில் வாசிக்க ஏற்ற வகையில் பிரதிபலிக்கும் பெயரெழுத்தாக்கம்.
