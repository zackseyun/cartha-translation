translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான வம்சப் பட்டியல் நடையைப் பேணுகிறது. ‘குமாரர்கள்’ என்பதற்குப் பதிலாக இன்றைய வாசகர்களுக்கு இயல்பான ‘மகன்கள்’ பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலியை அடிப்படையாகக் கொண்டு தமிழாக்கப்பட்டுள்ளன; குறிப்பாக செபா/ஷெபா வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
