source:
  edition: WLC
  text: וְ/כ֖וּשׁ יָלַ֣ד אֶת נִמְרֹ֑ד ה֣וּא הֵחֵ֔ל לִֽ/הְי֥וֹת גִּבֹּ֖ר בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/008.yaml
  text: And Cush fathered Nimrod[d][c][b][a]; he began to be a mighty man on the earth.
translation:
  language: ta
  text: கூஷ் நிம்ரோத்துக்குத் தந்தையானான்; அவன் பூமியில் வலிமைமிக்கவனாக இருக்கத் தொடங்கினான்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வலிமைமிக்கவன்’ என்பதை ‘வீரன்’ அல்லது ‘போர்வீரன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பூமியில்’ என்பதற்கு மாற்றாக ‘நாட்டில்’ அல்லது ‘நிலத்தில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכ֖וּשׁ
  choice: கூஷ்
  rationale: வாவ் வம்சவரிசையின் தொடர்ச்சியை இணைக்கிறது; தனித்தமிழ் வாக்கியத்தில் அதை வெளிப்படையாக மொழிபெயர்க்காமல் விடுவது இயல்பானது. כּוּשׁ என்பது ‘கூஷ்’ என ஒலிபெயர்க்கப்பட்ட தனிப்பெயர்.
- source_word: יָלַ֣ד
  choice: நிம்ரோதுக்குத் தந்தையானான்
  rationale: வம்சவரிசைச் சூழலில் ילד ஆண் வழிப் பிறப்புறவைச் சுட்டுகிறது. ‘தந்தையானான்’ என்பது நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருள் குறியீடு; தமிழில் தனிச் சொல்லாக இதற்கு இணை தேவையில்லை.
- source_word: נִמְרֹ֑ד
  choice: நிம்ரோத்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிவடிவத்தைத் தமிழில் பிரதிபலிக்கிறது.
- source_word: ה֣וּא
  choice: அவன்
  rationale: நிம்ரோத்தை மீண்டும் சுட்டும் தனிப்பட்ட சுட்டுப்பெயர்; தமிழில் வெளிப்படையான எழுவாயாக இயல்பாக வழங்கப்படுகிறது.
- source_word: הֵחֵ֔ל לִֽהְי֥וֹת
  choice: ஆகத் தொடங்கினான்
  rationale: இந்தக் கட்டமைப்பின் நேரடியான பொருள் ‘இருக்க/ஆகத் தொடங்கினான்.’ ‘முதலாவதாக ஆனான்’ என்ற முன்னுரிமைக் கருத்தை எபிரெயம் கட்டாயப்படுத்தாததால் அது சேர்க்கப்படவில்லை.
- source_word: גִּבֹּ֖ר
  choice: வலிமைமிக்கவன்
  rationale: גִּבּוֹר வலிமைமிக்கவன், வீரன் அல்லது போர்வீரன் எனப் பொருள்படலாம். இங்கு இராணுவப் பொருளாக மட்டும் குறுக்காமல் அதன் பொருள் அகலத்தை ‘வலிமைமிக்கவன்’ காக்கிறது.
- source_word: בָּאָֽרֶץ
  choice: பூமியில்
  rationale: Genesis 10-இன் தேசங்களின் வம்சப்பட்டியல் சூழலில் אֶרֶץ என்பதற்கு உலகளாவிய ‘பூமி’ பொருள் பொருத்தமானது; எனினும் ‘நாட்டில்’ என்பதும் மொழியியல் ரீதியில் சாத்தியம்.
theological_decisions:
- issue: אֶרֶץ என்பதன் பரப்பு
  choice: பூமியில்
  alternative: நாட்டில் / நிலத்தில்
  rationale: தேசங்களின் வம்சப்பட்டியல் என்ற விரிந்த சூழல் ‘பூமி’ என்பதை ஆதரிக்கிறது; எபிரெயச் சொல்லின் பிராந்தியப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: הֵחֵל לִהְיוֹת என்பதன் வலிமை
  choice: ஆகத் தொடங்கினான்
  alternative: முதன்முதலில் ஆனான் / முதலாவதாக ஆனான்
  rationale: எபிரெயம் தொடக்கத்தைக் குறிக்கிறது; நிம்ரோத் வரலாற்றில் முதலாவது நபர் என்ற விளக்கத்தைத் தெளிவாகக் கூறவில்லை. ஆகவே முன்னுரிமையைச் சேர்க்காமல் மூலத்தின் தெளிவின்மையும் இறையியல் பதற்றமும் காக்கப்படுகின்றன.
- issue: גִּבּוֹר என்பதன் தன்மை
  choice: வலிமைமிக்கவன்
  alternative: வீரன் / போர்வீரன்
  rationale: இப்பதம் உடல், சமூக அல்லது இராணுவ வலிமையைச் சுட்டக்கூடும். உடனடியான வசனம் எந்த ஒரு நுண்பொருளையும் மட்டும் நிர்ணயிக்காததால் அகலமான சொல் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் மதிப்புமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டது. வம்சவரிசைச் சொல்லாக்கத்தில் வழக்கொழிந்த ‘பெற்றான்’ என்பதால் தாய்மை/பிறப்பித்தல் குறித்த குழப்பம் ஏற்படாதபடி ‘தந்தையானான்’ பயன்படுத்தப்பட்டது. வாக்கியத்தின் எபிரெய இணைப்புச்சொல் தமிழில் தேவையற்றதால் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
