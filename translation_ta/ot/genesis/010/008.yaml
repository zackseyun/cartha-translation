revisions:
- from: கூஷ் நிம்ரோதுக்குத் தந்தையானான்; அவன் பூமியில் வலிமைமிக்கவனாகத் தொடங்கினான்[a][b].
  to: கூஷ் நிம்ரோத்துக்குத் தந்தையானான்; அவன் பூமியில் வலிமைமிக்கவனாக இருக்கத் தொடங்கினான்[a][b].
  rationale: The revision makes the Tamil syntax explicitly convey ‘began to be’ and standardizes Nimrod’s spelling. It retains the draft’s source-sensitive refusal to introduce ‘was the first to become,’ preserves the broad sense of גִּבּוֹר, and keeps both footnote anchors correctly attached to the terms they qualify.
