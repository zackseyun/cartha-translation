  text: Joktan fathered Almodad[a], Sheleph, Hazarmaveth, and Jerah.
translation:
  language: ta
  text: யோக்தான் அல்மோதாத், ஷாலெப், ஹட்சர்மாவேத், யாராக் ஆகியோரின் தந்தையானான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில் ஒவ்வொரு பெயருக்கும் முன் “மற்றும்” வருகிறது: “யோக்தான் அல்மோதாதையும் ஷாலெப்பையும் ஹட்சர்மாவேத்தையும் யாராக்கையும் தந்தையாகப் பெற்றான்.” தமிழில் பட்டியலாக இயல்புபடுத்தப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָקְטָן
  choice: யொக்தான்
  rationale: எபிரேயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது; தொடக்க வாவ் தொடர்ச்சியைக் குறிப்பதால், முந்தைய வசனத்துடன் இணையும் தமிழ்ச் சூழலில் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: יָלַד
  choice: பெற்றான்
  rationale: வம்சப்பட்டியல் சூழலில் ஆண் முன்னோரிடமிருந்து வந்த சந்ததியைச் சுட்டுகிறது; நவீனத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் எபிரேய இலக்கணக் குறி; அதன் பணி தமிழ் வேற்றுமை உருபாலும் வாக்கிய அமைப்பாலும் வெளிப்படுகிறது.
- source_word: אַלְמוֹדָד
  choice: அல்மோதாத்
  rationale: எபிரேயத் தனிப்பெயரின் ஒலிப்பை அடிப்படையாகக் கொண்ட எழுத்துப்பெயர்ப்பு.
- source_word: שָׁלֶף
  choice: சேலேப்
  rationale: எபிரேயத் தனிப்பெயரின் ஒலிப்பை அடிப்படையாகக் கொண்ட எழுத்துப்பெயர்ப்பு.
- source_word: חֲצַרְמָוֶת
  choice: அத்சர்மாவேத்
  rationale: தொடக்க ח ஒலியைத் தமிழில் அளவுக்கு மிகாமல் அணுகி, பெயரின் எபிரேய வடிவை நெருக்கமாகப் பாதுகாக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: יָרַח
  choice: ஏராஹ்
  rationale: எபிரேய யோத் இங்கு மெய்யொலியாகத் தெளிவாகக் கேட்காத பெயர்வடிவத்தைப் பின்பற்றி செய்யப்பட்ட எழுத்துப்பெயர்ப்பு.
