  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை. மூலத்தில் ஒவ்வொரு பெயருக்கும் முன் வரும் וְ இணைப்பின் மீளுருவாக்கம் முதன்மை உரையில் இயல்பான தமிழ்ப் பட்டியலாக மென்மைப்படுத்தப்பட்டு, அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
