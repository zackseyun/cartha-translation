translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சவரலாற்றுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘என்பவனைப் பெற்றான்’ என்பது பெயருக்கும் செயப்படுபொருள் உருபுக்கும் இடையிலான ஒலிச் சிக்கலைத் தவிர்த்து, ஆண் முன்னோரின் தந்தைத்துவத்தை இயல்பாகத் தெரிவிக்கிறது.
