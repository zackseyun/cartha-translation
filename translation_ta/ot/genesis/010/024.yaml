base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/024.yaml
  text: Arpachshad fathered Shelah[a], and Shelah fathered Eber.
translation:
  language: ta
  text: அர்பக்ஷாத் ஷெலாகுக்குத் தந்தையானான்; ஷெலாக் ஏபேருக்குத் தந்தையானான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: அர்பக்ஷாத்
  rationale: எபிரேயப் பெயரான אַרְפַּכְשַׁד என்பதன் ஒலிவடிவத்தைத் தமிழில் நெருக்கமாகப் பிரதிபலிக்கும் பெயர்ப்பு; வசனத்தின் தொடக்கத்தில் உள்ள וְ தமிழின் இயல்பான வாக்கியத் தொடக்கத்திற்காகத் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: יָלַד
  choice: பெற்றான்
  rationale: ஆண் எழுவாயைக் கொண்ட வம்சவரலாற்றுச் சூழலில் ‘தந்தையானான்/பெற்றெடுத்தான்’ என்ற பொருளைச் சுருக்கமாகவும் தமிழில் வழக்கமாகவும் தெரிவிக்கிறது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண அடையாளம்; அதன் பணி தமிழ் வேற்றுமை அமைப்பிலும் சொல் வரிசையிலும் வெளிப்படுகிறது.
- source_word: שָׁלַח / וְ/שֶׁלַח
  choice: ஷேலாக் / ஷேலாக்
  rationale: இவ்வசனத்தில் காணப்படும் எபிரேயப் பெயரின் மெய் மற்றும் உயிரொலிகளை நெருக்கமாகப் பிரதிபலிக்கிறது; וְ இரண்டாவது வாக்கியக்கூற்றில் அரைப்புள்ளியால் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: עֵבֶר
  choice: ஏபேர்
  rationale: எபிரேய עֵבֶר பெயரின் ஒலிப்பைத் தமிழில் நெருக்கமாகக் காட்டுகிறது; தொடக்க ஆயின் தனி தமிழ் ஒலியாகக் குறிக்கப்படவில்லை.
