revisions:
- from: அர்பக்ஷாத் ஷேலாக்[a] என்பவனைப் பெற்றான்; ஷேலாக் ஏபேர் என்பவனைப் பெற்றான்.
  to: அர்பக்ஷாத் ஷெலாகுக்குத் தந்தையானான்; ஷெலாக் ஏபேருக்குத் தந்தையானான்.
  rationale: The revision retains the two linked genealogical assertions and their order, while using a Tamil idiom that explicitly marks each man as father. It also corrects Shelah’s initial vowel to align more closely with the Hebrew vocalization and narrows the footnote to a supportable lexical explanation.
  reviewer_model: gpt-5.6-terra
