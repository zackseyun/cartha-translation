base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/029.yaml
  text: Ophir[a], Havilah, and Jobab. All these were the sons of Joktan.
translation:
  language: ta
  text: ஓபீர், ஹவிலா, யோபாப் ஆகியோரையும் பெற்றான். இவர்கள் அனைவரும் யொக்தானின் மகன்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யொக்தானின் வழித்தோன்றல்கள்.” வம்சவரிசைகளில் “மகன்கள்” என்பதற்கான எபிரெயச் சொல் சில நேரங்களில் விரிவான பொருளில் பயன்படலாம்; ஆனால் இங்கே இப்போது பட்டியலிடப்பட்ட மகன்களையே குறிப்பது மிகவும் இயல்பானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: ஆகியோரையும்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் வினைச்சொல்லின் நேர்செயப்படுபொருள்களாக இப்பெயர்களை אֵת குறிக்கிறது; தமிழில் ‘-ஐ/ஆகியோரையும்’ மூலம் பட்டியலின் தொடர்ச்சி இயல்பாக வெளிப்படுகிறது.
- source_word: אוֹפִר
  choice: ஓபீர்
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: חֲוִילָה
  choice: அவிலா
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு; தொடக்க חֲ ஒலி தமிழில் இயல்பாக ‘அ’ என வழங்கப்படுகிறது.
- source_word: יוֹבָב
  choice: யோபாப்
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: כָּל אֵלֶּה
  choice: இவர்கள் அனைவரும்
  rationale: பட்டியலிடப்பட்ட நபர்களைத் தொகுத்துக் கூறும் எபிரெய சொற்றொடரின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: வம்சவரிசைகளில் இச்சொல் விரிவாக ‘வழித்தோன்றல்கள்’ எனப் பொருள்படக்கூடும்; ஆனால் உடனடிச் சூழலில் பெயரிடப்பட்ட ஆண் பிள்ளைகளைக் குறிப்பதால் ‘மகன்கள்’ இயல்பான முதன்மைப் பொருள்.
- source_word: יָקְטָן
  choice: யொக்தான்
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பை அணுகும் தமிழ் ஒலிபெயர்ப்பு.
theological_decisions: []
translation_notes:
  register: நவீனச் செந்தமிழ் கலந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. இவ்வசனம் முந்தைய வசனத்தில் தொடங்கிய பிறப்புப் பட்டியலின் தொடர்ச்சி என்பதால், தமிழில் மறைந்திருக்கும் வினையைத் தெளிவாக்க ‘பெற்றான்’ சேர்க்கப்பட்டுள்ளது; அடிக்குறி குறியீடு உரையில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
