translation_notes:
  register: நவீன, கண்ணியமான வம்சவரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. ‘பெற்றான்’ என்பது பொதுவாசகர்களுக்கு இயல்பாக இருந்து, எபிரெய மூலத்தின் தந்தைவழி வம்சப் பொருளைச் சூழலிலேயே தக்கவைக்கிறது. விளக்கக்குறி அது விளக்கும் ‘ஏத்’ என்ற பெயருக்குப் பின் வைக்கப்பட்டுள்ளது.
