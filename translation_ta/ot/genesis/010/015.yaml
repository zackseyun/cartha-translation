  text: וּ/כְנַ֗עַן יָלַ֛ד אֶת צִידֹ֥ן בְּכֹר֖/וֹ וְ/אֶת חֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/015.yaml
  text: And Canaan fathered Sidon his firstborn[a], and Heth.
translation:
  language: ta
  text: கானான் தன் முதற்பேறான சீதோனையும் ஏத்தையும் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: கானான்
  rationale: וְ வம்சவரிசையின் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் தொடர்ச்சியான பட்டியல் நடையில் தனியாக ‘மேலும்’ சேர்க்காமல் இயல்பாக விடப்பட்டுள்ளது. כְנַעַן என்ற பெயர் ‘கானான்’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: יָלַד
  choice: பெற்றான்
  rationale: ஆண் வம்சத்தொடரில் ילד பிள்ளைகளைப் பெற்றெடுத்த தந்தை உறவைக் குறிக்கிறது. ‘பெற்றான்’ என்பது பழமையான ‘பிறப்பித்தான்’ என்பதைவிட இயல்பான நவீனத் தமிழ்; சூழல் தந்தை வழி உறவைத் தெளிவாக்குகிறது.
- source_word: אֶת
  choice: '[மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் எபிரெய இலக்கணச் சொல்; தமிழில் தனியான சொல் தேவையில்லை.
- source_word: צִידֹן
  choice: சீதோன்
  rationale: צִידֹן என்ற பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: בְּכֹר/וֹ
  choice: தன் முதற்பேறான
  rationale: בְּכוֹרוֹ என்பது ‘அவனுடைய முதற்பேறு’ என்று பொருள். ‘தன் முதற்பேறான’ என்பது கானானுடனான உறவைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: וְ/אֶת
  choice: -ஐயும்
  rationale: இணைப்புச் சொல் மற்றும் நேரடிச் செயப்படுபொருள் குறியீடு ஆகிய இரண்டும் தமிழில் இணைப்பும்மை ‘-உம்’ மற்றும் வேற்றுமை உருபு ‘-ஐ’ மூலம் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளன.
- source_word: חֵת
  choice: ஏத்
  rationale: חֵת என்ற தனிப்பெயர் ‘ஏத்’ என ஒலிபெயர்க்கப்பட்டுள்ளது; மூலவசனத்தில் இல்லாத ‘ஏத்தியரின் மூதாதை’ என்ற விளக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
