- from: கானான் தன் முதற்பேறான சீதோனையும், ஏத்[a] என்பவனையும் பெற்றான்.
  to: கானான் தன் முதற்பேறான சீதோனையும் ஏத்தையும் பெற்றான்.
  rationale: The revision preserves every element of the Hebrew genealogy—Canaan, Sidon as his firstborn, and Heth—while removing a minor non-source expansion and smoothing Tamil coordination. The footnote remains anchored to «ஏத்» and provides only the genealogical cross-reference context reflected in the English audit trail.
