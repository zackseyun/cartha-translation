  text: and Hadoram[a], and Uzal, and Diklah.
translation:
  language: ta
  text: ஹதோராமையும்[a], ஊசாலையும், திக்லாவையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவை நாடுகளின் பட்டியலில் வரும் இயற்பெயர்கள்; இவற்றின் எழுத்துமுறை மரபுக்கு மரபு சற்றே மாறலாம், ஆனால் அதனால் பொருள் மாறுவதில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אֶת
  choice: -ஐயும்
  rationale: אֵת நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கணக் குறியீடு; அதற்கு முன் வரும் וְ பட்டியலின் உறுப்புகளை இணைக்கிறது. தமிழில் இவ்விரண்டையும் இயல்பாகச் செயப்படுபொருள் வேற்றுமை உருபும் இணைப்பிடைச்சொல்லும் சேர்ந்த ‘-ஐயும்’ என்பதால் வெளிப்படுத்தலாம்.
- source_word: הֲדוֹרָם
  choice: ஹதோராம்
  rationale: இது நாடுகளின் பட்டியலில் வரும் இயற்பெயர். எபிரேய ஒலிவடிவத்தைத் தமிழில் நெருக்கமாகக் காட்டும் வகையில் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אוּזָל
  choice: ஊசால்
  rationale: இயற்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல், எபிரேய ஒலிவடிவத்துக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: דִּקְלָה
  choice: திக்லா
  rationale: இயற்பெயர் என்பதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது; ‘திக்லா’ என்பது எபிரேய மெய்யொலி அமைப்பைத் தமிழில் தெளிவாகப் பிரதிபலிக்கிறது.
