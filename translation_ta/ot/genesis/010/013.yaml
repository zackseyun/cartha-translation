id: GEN.10.13
reference: Genesis 10:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/מִצְרַ֡יִם יָלַ֞ד אֶת לוּדִ֧ים וְ/אֶת עֲנָמִ֛ים וְ/אֶת לְהָבִ֖ים וְ/אֶת נַפְתֻּחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/013.yaml
  text: And Mizraim fathered the Ludim[a], the Anamim, the Lehabim[b], and the Naphtuhim.
translation:
  language: ta
  text: மிஸ்ராயீம் லூதீமையும், அனாமீமையும், லெஹாபீமையும், நப்துஹீமையும் பெற்றான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெற்றான்” என்பதற்கு “தந்தையானான்” அல்லது “வம்சத்துக்குத் தோற்றுவித்தான்” என்றும் பொருள் கொள்ளலாம்; எபிரெய வினைச்சொல் சந்ததியினரை உருவாக்குவதைக் குறிக்கும் வழக்கமான வம்சவரலாற்றுச் சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: மிஸ்ராயீம்
  rationale: தேசத்தைக் குறிக்கும் ‘எகிப்து’ என்று மொழிபெயர்க்காமல், நாடுகளின் வம்சப்பட்டியலில் முன்னோராக வரும் இயற்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: יָלַד
  choice: பெற்றான்
  rationale: ஆண் முன்னோரை எழுவாயாகக் கொண்ட வம்சவரலாற்றுச் சூழலில், சந்ததியை உருவாக்கியதைக் குறிக்கும் இயல்பான தமிழ் சொல்; நேரடி மகப்பேற்றையும் பரந்த வம்சத் தோற்றத்தையும் உள்ளடக்கக்கூடிய எபிரெயச் சொல்லின் நெகிழ்வைத் தக்கவைக்கிறது.
- source_word: לוּדִים
  choice: லூதியர்
  rationale: பன்மை மக்கள் குழுப் பெயராக, தமிழில் இயல்பாக அமையும் ‘-யர்’ வடிவில் ஒலிபெயர்க்கப்பட்டது.
- source_word: עֲנָמִים
  choice: அனாமியர்
  rationale: பிற்கால இன அடையாளத்தைத் திணிக்காமல், எபிரெய மக்கள் குழுப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לְהָבִים
  choice: லெகாபியர்
  rationale: எபிரெய மெய்யெழுத்தான ה இங்கு உரசொலியாக இருப்பதைத் தமிழில் ‘க’ மூலம் அண்மையாகக் காட்டி, ஊகத்திற்குரிய வரலாற்று அடையாளத்தைத் தவிர்க்கிறது.
- source_word: נַפְתֻּחִים
  choice: நப்துகியர்
  rationale: எபிரெய வடிவத்தை அடிப்படையாகக் கொண்ட மக்கள் குழுப் பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருள் குறியீடு; தமிழின் ‘-ஐ’ வேற்றுமை உருபால் அதன் இலக்கணப் பணி வெளிப்படுகிறது.
- source_word: וְ
  choice: -உம் / மற்றும்
  rationale: பட்டியலில் ஒவ்வொரு செயப்படுபொருளுடனும் இணையும் எபிரெய இணைப்பைத் தமிழில் ‘-உம்’ என்ற இயல்பான பட்டியல் அமைப்பு வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יָלַד என்பதன் வம்சவரலாற்றுப் பொருள்
  choice: பெற்றான்
  alternative: தந்தையானான் / தோற்றுவித்தான்
  rationale: மிஸ்ராயீமை இந்த மக்கள் குழுக்களின் முன்னோராகச் சித்தரிக்கும் உரையின் கருத்தைத் தக்கவைத்து, அவர்கள் உடனடி மகன்களா அல்லது வழிவந்த சந்ததிக் குழுக்களா என்பதைத் தேவையின்றி முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் சுருக்கமான, கண்ணியமான வம்சப்பட்டியல் நடை பயன்படுத்தப்பட்டது. மக்கள் குழுப் பெயர்களுக்கு தமிழில் இயல்பான மரியாதைப் பன்மை/குழுப் பன்மையான ‘-யர்’ வடிவம் தரப்பட்டது; அதேவேளை மூல எபிரெய ஒலிவடிவம் இயன்றவரை பாதுகாக்கப்பட்டது.
