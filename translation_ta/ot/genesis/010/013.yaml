  rationale: The verse is revised only to correct the transliteration of the four Hebrew people-group names and to move the lexical footnote anchor to “பெற்றான்.” The revised wording retains the source’s terse genealogy, preserves the eponymous name மிஸ்ராயீம், and does not make a historical or ethnic identification beyond the Hebrew text.
