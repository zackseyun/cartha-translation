  yaml_path: translation/ot/genesis/010/006.yaml
  text: 'And the sons of Ham: Cush[a], Mizraim, Put[b], and Canaan.'
translation:
  language: ta
  text: 'காமின் மகன்கள்: கூஷ், மிஸ்ராயிம்[a], பூத்[b], கானான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் “மிஸ்ராயிம்.” பல மொழிபெயர்ப்புகள் இதை “எகிப்து” என்று தருகின்றன. இந்த வம்சப்பட்டியலில் இது ஒருவரின் அல்லது ஒரு குலமுதல்வரின் பெயராகக் கொள்ளப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: “பூத்” என்பதற்கு சில ஆங்கில மொழிபெயர்ப்புகளில் மரபுவழியாக “Phut” என்ற வடிவமும் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: மகன்கள்
  rationale: கட்டமைப்பு வடிவிலுள்ள பன்மைச் சொல்லை வம்சப்பட்டியலின் நேரடியான சொற்பயன்பாட்டின்படி “மகன்கள்” எனத் தந்துள்ளது; விரிவான பொருளில் சந்ததியினரையும் இது குறிக்கலாம். தொடக்க ו தனி “மேலும்” என மொழிபெயர்க்கப்படாமல், பட்டியல் தொடர்ச்சி இயல்பான தமிழில் வெளிப்படுகிறது.
- source_word: חָם
  choice: காம்
  rationale: எபிரேயப் பெயர் நவீனத் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כּוּשׁ
  choice: கூஷ்
  rationale: எபிரேய כּוּשׁ என்ற பெயரின் ஒலியை நெருக்கமாகப் பாதுகாக்கும் வழக்கமான தமிழ் வடிவம்.
- source_word: וּ/מִצְרַיִם
  choice: மிஸ்ராயிம்
  rationale: இங்கு நாடாகிய எகிப்தை மட்டும் சுட்டும் பொதுப்பெயராக அல்லாமல், வம்சப்பட்டியலில் முன்னோரின் பெயராகச் செயல்படுவதால் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּ/פוּט
  choice: பூத்
  rationale: எபிரேயப் பெயரின் பொதுவான தமிழ் வேதாகம ஒலிபெயர்ப்பு வடிவம் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: וּ/כְנָעַן
  choice: கானான்
  rationale: எபிரேயப் பெயருக்கான நிலைபெற்ற தமிழ் வடிவம் பயன்படுத்தப்பட்டுள்ளது; பட்டியலின் இணைப்புகள் தமிழில் இயல்பாக காற்புள்ளிகளால் காட்டப்பட்டுள்ளன.
