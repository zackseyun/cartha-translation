translation_notes:
  register: சுருக்கமான வம்சப்பட்டியல் நடையைப் பாதுகாத்து, நவீனத் தரத் தமிழில் இயல்பான “சேமின் மகன்கள்” என்ற கட்டமைப்பு பயன்படுத்தப்பட்டுள்ளது. தனிப்பெயர்கள் பிற்கால நாடுகளின் பெயர்களாகப் பொருளாக்கப்படாமல் எபிரேயத்திலிருந்து ஒலிபெயர்க்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் [a] குறி தவறாக “Elam” என்பதோடு இணைந்திருந்தாலும், அதன் குறிப்பின் உள்ளடக்கத்திற்கேற்ப தமிழில் “அர்பக்ஷாத்” என்பதோடு இணைக்கப்பட்டுள்ளது.
