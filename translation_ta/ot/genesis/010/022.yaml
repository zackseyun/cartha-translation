  text: בְּנֵ֥י שֵׁ֖ם עֵילָ֣ם וְ/אַשּׁ֑וּר וְ/אַרְפַּכְשַׁ֖ד וְ/ל֥וּד וַֽ/אֲרָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/022.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud[b], and Aram.'
translation:
  language: ta
  text: 'சேமின் மகன்கள்: ஏலாம், அஷ்ஷூர்[b], அர்பக்ஷாத்[a], லூத், அராம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயப் பெயர் “அர்பக்ஷாத்”; கிரேக்க மொழியின் தாக்கமுள்ள மரபுவழி வடிவம் “அர்பக்சாத்” என வழங்கப்படுவதுண்டு.
    reason: lexical_alternative
  - marker: b
    text: “அஷ்ஷூர்”, “அராம்” என்ற எபிரேயப் பெயர்கள், பிற்காலத்தில் முறையே அசீரியா, சீரியா என்று அறியப்பட்ட பகுதிகள் அல்லது மக்களுடன் அடிக்கடி தொடர்புபடுத்தப்படுகின்றன.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் பன்மைக் கட்டமைப்பு வடிவம். வம்சப்பட்டியல் சூழலில் எபிரேய உரையின் ஆண் வழி அமைப்பை நேரடியாகப் பாதுகாக்கிறது; “சந்ததியினர்” என்பது மூலத்தைவிட விரிவான பொருளைத் தரும்.
- source_word: שֵׁם
  choice: சேம்
  rationale: தனிப்பெயரை மொழிபெயர்க்காமல், தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: עֵילָם
  choice: ஏலாம்
  rationale: இங்கே வம்சத்தவரின் பெயராக வரும் தனிப்பெயரின் எபிரேய ஒலியை நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: אַשּׁוּר
  choice: அஷ்ஷூர்
  rationale: இப்பெயரில் உள்ள இரட்டித்த שׁ ஒலியைப் பாதுகாக்கும் ஒலிபெயர்ப்பு. “அசீரியா” எனப் பிற்காலப் பகுதியின் பெயரை இடாமல், வம்சப்பட்டியலின் தனிப்பெயர் வடிவம் தக்கவைக்கப்பட்டுள்ளது.
- source_word: אַרְפַּכְשַׁד
  choice: அர்பக்ஷாத்
  rationale: எபிரேய மெய்யெழுத்து அமைப்பை நெருக்கமாகப் பின்பற்றும் ஒலிபெயர்ப்பு; கிரேக்கத்தின் தாக்கமுள்ள மரபுவழி வடிவத்திலிருந்து வேறுபடுத்துகிறது.
- source_word: לוּד
  choice: லூத்
  rationale: இங்கு ஒருமையில் உள்ள எபிரேய தனிப்பெயரை நேரடியாக ஒலிபெயர்க்கிறது; “லூதீம்” போன்ற வேறொரு வடிவத்தை இறக்குமதி செய்யவில்லை.
- source_word: אֲרָם
  choice: அராம்
  rationale: எபிரேய தனிப்பெயரைப் பாதுகாக்கிறது; பிற்காலப் புவியியல் பெயரான “சீரியா” என்று பொருளாக்கவில்லை.
