source:
  edition: WLC
  text: הֽוּא הָיָ֥ה גִבֹּֽר צַ֖יִד לִ/פְנֵ֣י יְהוָ֑ה עַל כֵּן֙ יֵֽאָמַ֔ר כְּ/נִמְרֹ֛ד גִּבּ֥וֹר צַ֖יִד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/009.yaml
  text: He was a mighty hunter before Yahweh; therefore it is said[a], “Like Nimrod, a mighty hunter before Yahweh.”
translation:
  language: ta
  text: அவன் யாவேயின் முன்னிலையில் வல்லமைமிக்க வேட்டைக்காரனாக இருந்தான். அதனால்தான், “நிம்ரோதைப் போல, யாவேயின் முன்னிலையில் வல்லமைமிக்க வேட்டைக்காரன்” என்று சொல்லப்படுகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, விரிவான சூழலைக் கருத்தில் கொண்டு இச்சொற்றொடரைப் பகைமையான பொருளில் எடுத்தால், “யாவேக்கு எதிராக” அல்லது “யாவேயை எதிர்த்து” எனலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: גִבֹּר צַיִד
  choice: வல்லமைமிக்க வேட்டைக்காரன்
  rationale: இச்சொற்றொடர் தனித்தனியாக ‘வல்லமையுள்ள மனிதன்’ என்றும் ‘வேட்டை’ என்றும் கூறாமல், வேட்டையாடுவதில் அசாதாரண ஆற்றல் கொண்ட ஒருவரைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் இதை ‘வல்லமைமிக்க வேட்டைக்காரன்’ என வழங்கலாம்.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: அடிப்படையான இட/உறவுப் பொருளான ‘முன்னிலையில், முன்பாக’ என்பதைக் காக்கிறது; எதிர்த்துநிற்றல் என்ற சாத்தியமான சூழல் சார்ந்த பொருளை முதன்மை உரையில் திணிப்பதில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தெய்வீகப் பெயரைக் குறிக்கும் நான்கு எபிரெய் எழுத்துகளின் ஒலிபெயர்ப்பு; ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மாற்றாமல் தனிப்பெயரைப் பாதுகாக்கிறது.
- source_word: עַל כֵּן
  choice: அதனால்தான்
  rationale: ஒரு பழமொழி அல்லது வழக்குச் சொல்லுக்கான காரணத்தை அறிமுகப்படுத்தும் சூத்திரத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יֵאָמַר
  choice: என்று சொல்லப்படுகிறது
  rationale: எபிரெயிலுள்ள ஆளில்லா செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, வழக்கில் சொல்லப்படும் ஒரு மொழியை அறிமுகப்படுத்துகிறது.
- source_word: כְּנִמְרֹד
  choice: நிம்ரோதுபோல்
  rationale: כְּ என்ற ஒப்புமை முன்னொட்டின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: நிம்ரோதைப் பற்றிய לִפְנֵי יְהוָה என்பதன் பொருள்
  choice: யாவேக்கு முன்பாக
  alternative: யாவேக்கு எதிராக / யாவேயை எதிர்த்து
  rationale: எபிரெய் சொற்றொடரின் நேரடியான பொருள் ‘யாவேக்கு முன்பாக’ அல்லது ‘யாவேயின் முன்னிலையில்’ என்பதாகும். விரிவான சூழலில் பகைமையான நுண்பொருள் இருக்கலாம் என்றாலும் அது உறுதியானதல்ல; ஆகவே முதன்மை உரை தெளிவின்மையைப் பாதுகாக்கிறது, மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: மொழிநடை நவீனத் தரத் தமிழாகவும், பொதுவாசகர்களுக்குப் புரியும் வகையிலும், அதேவேளை வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. பழமொழித் தன்மையைப் பாதுகாக்க மேற்கோள் சுருக்கமாக வைக்கப்பட்டுள்ளது.
