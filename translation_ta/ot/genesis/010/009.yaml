revisions:
- from: அவன் யாவேக்கு முன்பாக வல்லமைமிக்க வேட்டைக்காரனாக இருந்தான். அதனால்தான், “நிம்ரோதுபோல் யாவேக்கு முன்பாக வல்லமைமிக்க வேட்டைக்காரன்” என்று சொல்லப்படுகிறது.[a]
  to: அவன் யாவேயின் முன்னிலையில் வல்லமைமிக்க வேட்டைக்காரனாக இருந்தான். அதனால்தான், “நிம்ரோதைப் போல, யாவேயின் முன்னிலையில் வல்லமைமிக்க வேட்டைக்காரன்” என்று சொல்லப்படுகிறது.[a]
