  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְֽ/אֶת פַּתְרֻסִ֞ים וְ/אֶת כַּסְלֻחִ֗ים אֲשֶׁ֨ר יָצְא֥וּ מִ/שָּׁ֛ם פְּלִשְׁתִּ֖ים וְ/אֶת כַּפְתֹּרִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/014.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: ta
  text: பத்ரூசீமையும், கஸ்லூஹீமையும் (அவர்களிடமிருந்து பெலிஸ்தியர்கள் தோன்றினார்கள்[a]), கப்தோரீமையும் பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “அங்கிருந்து பெலிஸ்தியர்கள் புறப்பட்டார்கள்.” இந்த எபிரெயச் சொற்றொடரை, உடனடியாக முன் குறிப்பிடப்பட்ட கஸ்லூஹீமுடன் பெலிஸ்தியர்களின் தோற்றத்தை இணைப்பதாகப் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: பத்ரூசீம்
  rationale: பத்ரோசுடன் தொடர்புடைய மக்களினப் பெயர்; எபிரெய வடிவத்தைத் தமிழில் ஒலிபெயர்த்தது.
- source_word: כַּסְלֻחִים
  choice: கஸ்லூசீம்
  rationale: உறுதியாக அடையாளம் காண முடியாத மக்களினப் பெயர் என்பதால், பொருள் ஊகிக்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: அவர்களிடமிருந்து ... தோன்றினார்கள்
  rationale: சொல்லர்த்தமான ‘அங்கிருந்து புறப்பட்டார்கள்’ என்பதன் வம்சப்பட்டியல் சார்ந்த தோற்றப் பொருளை இயல்பான தமிழில் தருகிறது; ‘வம்சத்தில் பிறந்தார்கள்’ என்று வலுப்படுத்தவில்லை.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் மக்களினப் பெயர்.
- source_word: כַּפְתֹּרִים
  choice: கப்தோரீம்
  rationale: கப்தோருடன் தொடர்புடைய மக்களினப் பெயரை எபிரெய வடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கிறது.
- source_word: וְאֶת
  choice: -ஐயும்
  rationale: தொடர்ச்சியான பட்டியலில் இணைப்பையும் நேர்முகச் செயப்படுபொருள் உறவையும் இயல்பான தமிழ் வேற்றுமை உருபால் காட்டுகிறது.
theological_decisions:
- issue: ‘அங்கிருந்து பெலிஸ்தியர்கள் புறப்பட்டார்கள்’ என்ற கூறின் குறிப்பு
  choice: உடனடியாக முன்னுள்ள கஸ்லூசீமுடன் இணைத்து, ‘அவர்களிடமிருந்து பெலிஸ்தியர்கள் தோன்றினார்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அங்கிருந்து பெலிஸ்தியர்கள் புறப்பட்டார்கள்’ என்று இடக்குறிப்பை மட்டும் வெளிப்படையாக வைத்திருக்கலாம்.
  rationale: வம்சப்பட்டியலின் தொடரில் உடனடியாக முன்னுள்ள மக்களினமே இயல்பான தொடர்பாகத் தெரிகிறது. இருப்பினும் எபிரெயத்தின் מִשָּׁם என்பது சொல்லர்த்தமாக ‘அங்கிருந்து’ என்பதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான தமிழ். மக்களினப் பெயர்கள் எபிரெயப் பன்மை வடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன. வசனம் முந்தைய வசனத்தின் வினைச்சொல்லைத் தொடர்வதால் இயல்பான முழு வாக்கியத்திற்காக ‘பெற்றான்’ சேர்க்கப்பட்டுள்ளது; இது பட்டியலின் வாக்கிய அமைப்பை வெளிப்படுத்துகிறது.
