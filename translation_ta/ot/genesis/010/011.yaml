  text: מִן הָ/אָ֥רֶץ הַ/הִ֖וא יָצָ֣א אַשּׁ֑וּר וַ/יִּ֨בֶן֙ אֶת נִ֣ינְוֵ֔ה וְ/אֶת רְחֹבֹ֥ת עִ֖יר וְ/אֶת כָּֽלַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/011.yaml
  text: From that land Asshur went out and built Nineveh[a], Rehoboth-Ir, and Calah.
translation:
  language: ta
  text: அந்த நாட்டிலிருந்து அசூர்[a] புறப்பட்டுச் சென்று நினிவேயையும், ரெகொபோத்-ஈரையும், காலாகையும் கட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நாட்டிலிருந்து அவன் அசீரியாவுக்குப் புறப்பட்டுச் சென்று நினிவேயையும், ரெகொபோத்-ஈரையும், காலாகையும் கட்டினான்.” இவ்வாசிப்பில், முந்தைய வசனத்தில் வரும் நிம்ரோது, ‘அவன்’ என்ற சுட்டுப்பெயரின் முன்னோடியாகும்; אַשּׁוּר என்பது அசூர் என்னும் நபரை அல்ல, அசீரியா என்னும் நாட்டைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הָאָרֶץ הַהִוא
  choice: அந்த நாட்டிலிருந்து
  rationale: מִן என்பது புறப்படும் இடத்தைக் குறிக்கிறது; אֶרֶץ இங்கு மண்ணை அல்ல, முன்பு குறிப்பிடப்பட்ட நிலப்பகுதி அல்லது நாட்டைக் குறிக்கிறது.
- source_word: יָצָא
  choice: புறப்பட்டுச் சென்று
  rationale: יצא என்பதன் அடிப்படைப் பொருள் ‘வெளியே போதல்/புறப்படுதல்.’ அடுத்துவரும் கட்டுதல் என்னும் செயலுடன் தமிழில் இயல்பாக இணைய ‘புறப்பட்டுச் சென்று’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אַשּׁוּר
  choice: அசூர்
  rationale: இந்தப் பெயர் அசூர் என்னும் நபரையோ அசீரியா என்னும் நாட்டையோ குறிக்கலாம். உடனடி வாக்கிய அமைப்பில் இதை வினைக்குப் பின்வரும் வெளிப்படையான எழுவாயாகக் கொண்டு, நபரின் பெயராக ‘அசூர்’ என முதன்மைப் பாடத்தில் தரப்பட்டுள்ளது; புவிப்பெயராகக் கொள்ளும் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיִּבֶן
  choice: கட்டினான்
  rationale: בנה என்பதன் நேரடிப் பொருள் ‘கட்டுதல்.’ ‘நிறுவினான்’ என்பது கூடுதல் விளக்கத்தை உட்புகுத்தக்கூடியதால் நேரடியான சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: נִינְוֵה
  choice: நினிவே
  rationale: இடப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: רְחֹבֹת עִיר
  choice: ரெகொபோத்-ஈர்
  rationale: மீண்டும் மீண்டும் வரும் אֶת குறியீட்டுடன் நகரங்களின் பட்டியலில் இது இடம்பெறுவதால், ‘நகரத்தின் விசாலமான இடங்கள்’ என்று பொருளாக்காமல் கூட்டுப் புவிப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כָּלַח
  choice: காலாகு
  rationale: எபிரெய இடப்பெயரின் பொருத்தமான தமிழ் ஒலிபெயர்ப்பு; வேற்றுமை உருபு சேரும்போது முதன்மைப் பாடத்தில் ‘காலாகையும்’ என வருகிறது.
theological_decisions:
- issue: אַשּׁוּר என்பதன் பொருளும் வாக்கியத்தின் எழுவாயும்
  choice: 'அசூரே எழுவாய்: ‘அசூர் புறப்பட்டுச் சென்று’'
  alternative: 'முந்தைய வசனத்திலுள்ள நிம்ரோதே மறைமுக எழுவாய்: ‘அவன் அசீரியாவுக்குப் புறப்பட்டுச் சென்று’'
  rationale: எபிரெய மெய்யெழுத்துப் பாடத்தில் אַשּׁוּר என்பது அசூர் என்னும் நபரையோ அசீரியா என்னும் நாட்டையோ குறிக்கக்கூடும். உடனடி வாக்கிய அமைப்பு அசூரை வெளிப்படையான எழுவாயாக வாசிக்க இயலுவதால் அது முதன்மைப் பாடத்தில் வைக்கப்பட்டுள்ளது. எனினும், முந்தைய வசனத்தின் நிம்ரோதை எழுவாயாகத் தொடர்ந்து வாசிக்கும் பழமையான மாற்று விளக்கமும் மொழியியல் ரீதியாகச் சாத்தியமானதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘புறப்பட்டுச் சென்று’ என்பது கதைநடையின் இயக்கத்தைத் தெளிவாகத் தருகிறது. இடப்பெயர்கள் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளன; மூலத்தின் உண்மையான இலக்கண மற்றும் பெயர்ச்சொல் இரட்டுறவு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
