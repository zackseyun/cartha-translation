  yaml_path: translation/ot/genesis/010/028.yaml
  text: and Obal[a], and Abimael, and Sheba.
translation:
  language: ta
  text: ஓபாலையும், அபிமாயேலையும், சேபாவையும் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת
  choice: -ஐயும் / -யையும்
  rationale: எபிரெயத்தின் וְ (‘மற்றும்’) மற்றும் நேர் செயப்படுபொருளைக் குறிக்கும் אֶת ஆகிய இரண்டையும், தமிழில் ஒவ்வொரு பெயருடனும் இணையும் செயப்படுபொருள் வேற்றுமை உருபும் ‘உம்’ இடைச்சொல்லும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: עוֹבָל
  choice: ஓபால்
  rationale: மரபுப்பட்டியலில் வரும் இயற்பெயர் என்பதால் பொருள் மொழிபெயர்க்காமல் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: אֲבִימָאֵל
  choice: அபிமாயேல்
  rationale: இயற்பெயரின் உட்கூறுகளை மொழிபெயர்க்காமல், எபிரெய உச்சரிப்பைத் தமிழில் இயல்பாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
- source_word: שְׁבָא
  choice: சேபா
  rationale: இச்சூழலில் உள்ள שְׁבָא என்ற பெயரின் எபிரெய உச்சரிப்பைப் பின்பற்றும் எழுத்துப்பெயர்ப்பு; வேறு எபிரெய வடிவிலுள்ள பெயருடன் இதைக் கலக்கவில்லை.
- source_word: '[implied governing verb from Genesis 10:26]'
  choice: பெற்றான்
  rationale: எபிரெய மூலத்தில் இவ்வசனம் முந்தைய வசனத்தின் ‘பெற்றான்’ என்ற வினையைத் தொடர்ந்து வரும் செயப்படுபொருள் பட்டியல். தனியாக வாசிக்கும்போதும் தமிழில் முழுமையான, இயல்பான வாக்கியமாக இருக்க அந்த வினை இங்கு வெளிப்படையாக மீளளிக்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில் சுருக்கமான மரபுப்பட்டியல் நடை பயன்படுத்தப்பட்டது. ஒவ்வொரு பெயரிலும் ‘-ஐயும்/-யையும்’ சேர்த்ததால் எபிரெயத்தில் மீண்டும் மீண்டும் வரும் இணைப்பும் செயப்படுபொருள் குறியும் தமிழில் இயல்பாகப் பாதுகாக்கப்பட்டுள்ளன.
