base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/010.yaml
  text: The beginning of his kingdom was Babel[a], Erech, Accad, and Calneh[b], in the land of Shinar.
translation:
  language: ta
  text: அவனுடைய அரசின் தொடக்கம் சினெயார் நாட்டிலுள்ள பாபேல்[a], ஏரேக்கு, அக்காத், கல்னே[b] ஆகிய நகரங்களாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாபேல்’ என்பதை ‘பாபிலோன்’ என்றும் வழங்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ஏரேக்கு பொதுவாகப் பண்டைய ஊருக் நகரத்துடனும், அக்காத் அக்காட் நகரத்துடனும் அடையாளப்படுத்தப்படுகின்றன.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי
  choice: இருந்த ... ஆகிய நகரங்களே
  rationale: இங்கு היה என்பதன் தொடர்கதை வடிவம் எளிய இறந்தகால இணைப்புச் சொல்லாகச் செயல்படுகிறது; தமிழில் இடத்தைக் குறிக்கும் பட்டியலுடன் இயல்பாக அமைய இவ்வாறு வடிவமைக்கப்பட்டது.
- source_word: רֵאשִׁית
  choice: தொடக்கம்
  rationale: அரசின் ஆரம்ப மையத்தையோ முதற்கட்டப் பரப்பையோ குறிக்கிறது; ‘தலைநகர்’ அல்லது ‘முதன்மைப் பகுதி’ என்று தேவையின்றி பொருளைத் தீர்மானிக்காமல் மூலத்தின் விரிவைத் தக்கவைக்கிறது.
- source_word: מַמְלַכְתּוֹ
  choice: அவனுடைய அரசு
  rationale: பட்டியலிடப்பட்ட நகரங்களைக் கொண்ட ஆட்சிப்பரப்பை இங்கு குறிக்கிறது; நவீனத் தமிழில் ‘அரசு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בָּבֶל
  choice: பாபேல்
  rationale: எபிரெயப் பெயரின் ஒலிப்பெயர்ப்பைத் தக்கவைத்து, ஆதியாகமம் 11 உடனான இலக்கியத் தொடர்பையும் பாதுகாக்கிறது.
- source_word: אֶרֶךְ
  choice: ஏரேக்கு
  rationale: எபிரெயப் பெயரின் வடிவத்தைத் தமிழில் ஒலிப்பெயர்க்கிறது; வரலாற்று அடையாளமான ஊருக் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אַכַּד
  choice: அக்காது
  rationale: எபிரெய இடப்பெயரின் ஒலியைத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது; வரலாற்றில் அக்காட் என வழங்கப்படுவது அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: כַלְנֵה
  choice: கல்னே
  rationale: மசோரா உரையின் כַלְנֵה என்ற வாசகத்தை நேரடியாக ஒலிப்பெயர்க்கிறது.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: சினெயார் நாட்டிலிருந்த
  rationale: אֶרֶץ என்பதன் புவியியல் பொருளை ‘நாடு’ என்று தெளிவாகத் தக்கவைத்து, நகரங்கள் அந்நாட்டில் இருந்தன என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
