lexical_decisions:
- source_word: וּבְנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பதன் நேரடியான வம்சப்பட்டியல் பொருளைத் தக்கவைக்கிறது. தொடக்க வாவ் இணைப்புச்சொல், தொடர்ச்சியான பட்டியலின் இயல்பான தமிழ் நடையில் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: אֲרָם
  choice: அராம்
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: עוּץ
  choice: ஊஸ்
  rationale: எபிரெய தனிப்பெயரை நவீன தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: חוּל
  choice: ஹூல்
  rationale: தொடக்க ח ஒலையும் நீண்ட ஊ ஒலியையும் தெளிவாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: גֶתֶר
  choice: கேத்தேர்
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: מַשׁ
  choice: மாஷ்
  rationale: WLC மசோரா உரையிலுள்ள மַשׁ என்ற வாசகத்தை முதன்மை உரையில் நேரடியாக ஒலிபெயர்க்கிறது; 1 நாளாகமம் 1:17-ன் மாறுபட்ட வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
