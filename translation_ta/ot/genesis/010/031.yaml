  text: אֵ֣לֶּה בְנֵי שֵׁ֔ם לְ/מִשְׁפְּחֹתָ֖/ם לִ/לְשֹׁנֹתָ֑/ם בְּ/אַרְצֹתָ֖/ם לְ/גוֹיֵ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/031.yaml
  text: These are the sons of Shem[a], by their clans, by their languages, in their lands, by their nations.
translation:
  language: ta
  text: இவர்களே சேமின் மகன்கள்; அவரவர் குலங்களின்படியும், மொழிகளின்படியும், தங்கள் நாடுகளிலும், இனங்களின்படியும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவர்களே
  rationale: எபிரேயச் சுட்டுச் சொல்லை இயல்பான தமிழில் வலியுறுத்தலுடன் வெளிப்படுத்துகிறது; வினையற்ற மூல வாக்கியத்தின் அடையாளப்படுத்தும் தன்மையையும் காக்கிறது.
- source_word: בְנֵי שֵׁם
  choice: சேமின் மகன்கள்
  rationale: வம்சப்பட்டியலுக்குரிய ஆண் வழிச் சொல்லாட்சியை முறையாகப் பேணுகிறது; שֵׁם என்பதற்கு தமிழில் வழக்கமான ‘சேம்’ என்ற பெயர்வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவரவர் குலங்களின்படியும்
  rationale: מִשְׁפָּחָה இங்கு குடும்பத்தைவிட விரிந்த வம்சக் குழுவைக் குறிக்கிறது. முன்னொட்டு לְ வகைப்படுத்தலைக் குறிப்பதால் ‘-இன்படி’ பொருத்தமானது.
- source_word: לִלְשֹׁנֹתָם
  choice: மொழிகளின்படியும்
  rationale: לָשׁוֹן என்பதன் நேர்ப்பொருள் ‘நாவு’ என்றாலும், இச்சூழலில் மொழியைக் குறிக்கிறது; நவீன தமிழில் ‘மொழி’ தெளிவானது.
- source_word: בְּאַרְצֹתָם
  choice: தங்கள் நாடுகளிலும்
  rationale: בְ என்ற இடப்பொருளை மற்ற வகைப்படுத்தல் முன்னொட்டுகளிலிருந்து வேறுபடுத்தி ‘-இலும்’ எனக் காட்டுகிறது. ‘நாடுகள்’ இங்கு நவீன அரசுகளைக் கட்டாயமாகக் குறிக்காமல் மக்கள் வாழும் நிலப்பகுதிகளைக் குறிக்கிறது.
- source_word: לְגוֹיֵהֶם
  choice: இனங்களின்படியும்
  rationale: גּוֹי என்பது இங்கு மக்கள் இனங்கள் அல்லது தேசத்தார் குழுக்களைக் குறிக்கிறது; ‘இனங்கள்’ தமிழில் இயல்பாகவும் ‘நாடுகள்’ என்ற முந்தைய புவியியல் சொல்லிலிருந்து தெளிவாக வேறுபட்டும் உள்ளது.
