lexical_decisions:
- source_word: וּ/בְנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பது ‘மகன்கள்’ என்பதன் இணைப்புநிலைப் பன்மை. இந்த வம்சப் பட்டியலில் எபிரெய வடிவை நேரடியாகப் பாதுகாக்க ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது; ‘வழித்தோன்றல்கள்’ என்பது சாத்தியமானாலும் அதிக விளக்கவுரையாக அமையும். தொடக்க וּ தனித்தமிழ் வசனத்தில் பட்டியலின் தொடர்ச்சியால் இயல்பாக வெளிப்படுவதால் தனிச்சொல்லாக மொழிபெயர்க்கப்படவில்லை.
- source_word: יָוָן
  choice: யாவான்
  rationale: தனிப்பெயர் என்பதால் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֱלִישָׁה
  choice: எலீஷா
  rationale: தேசங்களின் பட்டியலில் வரும் தனிப்பெயர் அல்லது இடப்பெயர்; எபிரெய ஒலிப்பைத் தொடர்ந்து ஒலிபெயர்க்கப்பட்டது.
- source_word: וְ/תַרְשִׁישׁ
  choice: தர்ஷீஷ்
  rationale: தனிப்பெயர் அல்லது மக்கள்/இடப்பெயராக இருப்பதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது; பட்டியல் நடையில் וְ தனியாகக் காட்டப்படவில்லை.
- source_word: כִּתִּים
  choice: கித்தீம்
  rationale: மக்கள் அல்லது இடத்தைக் குறிக்கும் பெயர்; எபிரெய வடிவத்துக்கு நெருக்கமான, தமிழில் வாசிக்க இயல்பான ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: וְ/דֹדָנִים
  choice: தோதானீம்
  rationale: WLC/மசோரா மூலப்பாடத்தின் דֹדָנִים வாசகத்தை முதன்மைப் பாடத்தில் ஒலிபெயர்த்தோம். ‘ரோதானீம்’ என்ற முக்கிய பாடவேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
