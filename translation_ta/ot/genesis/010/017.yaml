  rationale: அர்கீயர் என்பதை மூல எபிரேயப் பெயருக்கும் நிலையான தமிழ் வேதாகமப் பயன்பாட்டிற்கும் ஏற்ற அர்க்கியர் எனத் திருத்தியுள்ளேன். அடிக்குறிப்பில் இலக்கண விளக்கத்தைத் துல்லியப்படுத்தியுள்ளேன்; கூட்டுப்பொருள் மற்றும் மாற்று ‘குலம்’ வாசிப்பைத் தக்கவைத்துள்ளேன்.
