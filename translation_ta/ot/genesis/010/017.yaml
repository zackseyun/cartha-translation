  - marker: a
    text: அல்லது, ‘ஏவியக் குலத்தையும், அர்க்கியக் குலத்தையும், சீனியக் குலத்தையும்.’ எபிரேயத்தில் இவை திட்டவுருபுடன் வரும் ஒருமை இனப்பெயர் வடிவங்களாக இருந்தாலும், மக்கள் குழுக்களையோ குலங்களையோ கூட்டாகக் குறிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: -ஐயும் / -ரையும்
  rationale: எபிரெய வְ conjunction-ஐயும் אֶת நேர்முக வேற்றுமை உருபையும் தமிழில் ஒருங்கிணைத்து, பட்டியலின் ஒவ்வொரு இனப்பெயருக்கும் ‘-ரையும்’ என வழங்குவது இயல்பாக உள்ளது.
- source_word: הַחִוִּי
  choice: ஏவியர்
  rationale: இது கானானிலிருந்து வந்த ஓர் இனக்குழுவைக் குறிக்கும் ஒருமை வடிவிலான கூட்டுப்பொருள் இனப்பெயர்; தமிழில் மரபாக அறியப்படும் ‘ஏவியர்’ அந்தக் கூட்டுப்பொருளைத் தருகிறது.
- source_word: הָעַרְקִי
  choice: அர்கீயர்
  rationale: அர்கா என்னும் இடத்துடன் தொடர்புடைய மக்களைக் குறிக்கும் இனப்பெயர்; ‘அர்கீயர்’ அதன் பெயர்த்தன்மையையும் பட்டியலின் அமைப்பையும் காக்கிறது.
- source_word: הַסִּינִי
  choice: சீனியர்
  rationale: சீன் என்னும் பெயருடன் தொடர்புடைய இனக்குழுவைக் குறிக்கும் இனப்பெயர்; ‘சீனியர்’ மூலத்தின் பெயர்த்தன்மையைப் பாதுகாக்கிறது.
