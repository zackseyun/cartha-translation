  terminology: The established and understandable Tamil forms சீதோன், கேரார், காசா, சோதோம், கொமோரா, அத்மா, and செபோயீம் are suitable. ‘லாஷா’ and the alternative ‘லேஷா’ more faithfully distinguish Hebrew shin in the final toponym.
