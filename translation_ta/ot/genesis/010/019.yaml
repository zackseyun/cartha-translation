language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַֽ/יְהִ֞י גְּב֤וּל הַֽ/כְּנַעֲנִי֙ מִ/צִּידֹ֔ן בֹּאֲ/כָ֥ה גְרָ֖רָ/ה עַד עַזָּ֑ה בֹּאֲ/כָ֞ה סְדֹ֧מָ/ה וַ/עֲמֹרָ֛ה וְ/אַדְמָ֥ה וּ/צְבֹיִ֖ם עַד לָֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/019.yaml
  text: And the border of the Canaanites was from Sidon[a], as you go toward Gerar, as far as Gaza; and as you go toward Sodom and Gomorrah and Admah and Zeboiim, as far as Lasha.
translation:
  language: ta
  text: கானானியர்களின் எல்லை சீதோனிலிருந்து, கேராரை நோக்கிச் செல்லும் வழியில் காசா வரையிலும், சோதோம், கொமோரா, அத்மா, செபோயீம் ஆகியவற்றை நோக்கிச் செல்லும் வழியில் லாஷா[a] வரையிலும் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “லேஷா.”
    reason: இடப்பெயரின் மாற்று ஒலிபெயர்ப்பைச் சுட்டுகிறது.
lexical_decisions:
- source_word: וַיְהִי
  choice: இருந்தது
  rationale: היה என்பதன் இறந்தகாலக் கூற்றைத் தமிழில் இயல்பான வாக்கிய முடிவாகத் தருகிறது; தொடக்க வாவ் தனியே ‘மேலும்’ என மொழிபெயர்க்கப்படாமல் கதைத் தொடர்ச்சியில் உணர்த்தப்படுகிறது.
- source_word: גְּבוּל הַכְּנַעֲנִי
  choice: கானானியர்களின் எல்லை
  rationale: ஒருமை வடிவிலுள்ள இனப்பெயர் இங்கு மக்களைக் கூட்டாகக் குறிக்கிறது; ‘எல்லை’ பின்வரும் இடவியல் வரையறைக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: מִצִּידֹן
  choice: சீதோனிலிருந்து
  rationale: מִן தொடக்க இடத்தைக் குறிக்கிறது; சீதோன் என்பது தமிழில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: בֹּאֲכָה
  choice: நோக்கிச் செல்லும் வழியில்
  rationale: எல்லை விவரிப்புகளில் இவ்வடிவம் ஓர் இடத்தை நோக்கிய திசை அல்லது பயணப் பாதையைக் குறிக்கிறது; இலக்கை அடைந்ததாகக் கூறாமல் அந்தத் திசைநோக்கை காக்கிறது.
- source_word: עַד
  choice: வரையிலும்
  rationale: எல்லையின் நீட்சியும் முடிவுப் புள்ளியும் தெளிவாக வெளிப்படுகிறது.
- source_word: גְרָרָה / עַזָּה
  choice: கேரார் / காசா
  rationale: திசைச்சுட்டும் ה சேர்க்கையைத் தமிழ் வேற்றுமை மற்றும் சொற்றொடர் வெளிப்படுத்துகின்றன; இடப்பெயர்கள் வழக்கமான தமிழ் வடிவங்களில் தரப்பட்டுள்ளன.
- source_word: סְדֹמָה וַעֲמֹרָה וְאַדְמָה וּצְבֹיִם
  choice: சோதோம், கொமோரா, அத்மா, செபோயீம்
  rationale: எல்லைப் பாதையில் குறிப்பிடப்படும் இடப்பெயர்களை எபிரெய வரிசையிலேயே வைத்துள்ளது.
- source_word: לָשַׁע
  choice: லாசா
  rationale: மசோரா உயிர்க்குறிப்பை நேரடியாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் தெளிவும் கொண்ட இடவியல் உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரண்டு திசைச் சொற்றொடர்களும் ஒரே எல்லை விளக்கமாகப் பாதுகாக்கப்பட்டுள்ளன; அடிக்குறி அது சார்ந்த ‘லாசா’ என்பதற்குப் பின்னரே வைக்கப்பட்டுள்ளது.
