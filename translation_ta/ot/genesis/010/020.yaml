language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֵ֣לֶּה בְנֵי חָ֔ם לְ/מִשְׁפְּחֹתָ֖/ם לִ/לְשֹֽׁנֹתָ֑/ם בְּ/אַרְצֹתָ֖/ם בְּ/גוֹיֵ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/020.yaml
  text: These are the sons of Ham[a], by their clans, by their languages, in their lands[b], by their nations.
translation:
  language: ta
  text: இவர்களே காமின் மகன்கள்; அவரவர் குலங்களின்படியும் மொழிகளின்படியும், தங்கள் நாடுகளிலும் இனங்களிலும் உள்ளவர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவர்களே
  rationale: சுருக்கமாக அடையாளப்படுத்தும் எபிரெயச் சுட்டுப்பெயரின் வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: בְנֵי חָם
  choice: காமின் மகன்கள்
  rationale: வம்சவரலாற்றுச் சூழலில் בְנֵי என்பது சந்ததியினரையும் உள்ளடக்கக்கூடும்; எனினும் மூலத்தின் முறையான ‘மகன்கள்’ என்ற உறவுமுறையைப் பேணுகிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவரவர் குலங்களின்படியும்
  rationale: לְ குறிக்கும் வகைப்படுத்தல் பொருளையும், מִשְׁפָּחוֹת குறிக்கும் உறவுசார் குழுக்களையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לִלְשֹׁנֹתָם
  choice: மொழிகளின்படியும்
  rationale: לָשׁוֹן என்பதன் சொற்பொருள் ‘நாக்கு’; இச்சூழலில் அது மொழியைக் குறிக்கிறது. வகைப்படுத்தும் அமைப்பும் காக்கப்படுகிறது.
- source_word: בְאַרְצֹתָם
  choice: தங்கள் நாடுகளிலும்
  rationale: בְ என்பதன் இடப்பொருளை ‘-இல்’ காட்டுகிறது; אַרְצוֹת என்பது இங்கு மக்கள் வாழும் நிலப்பகுதிகள் அல்லது நாடுகளைக் குறிக்கிறது.
- source_word: בְגוֹיֵהֶם
  choice: இனங்களின்படியும்
  rationale: גּוֹיֵהֶם குறிக்கும் தனித்த மக்கள் குழுக்களை ‘இனங்கள்’ இயல்பாகத் தருகிறது; தொடரின் வகைப்படுத்தும் தன்மையைச் சூழலுக்கேற்ப வெளிப்படுத்துகிறது.
theological_decisions:
- issue: בְנֵי என்பதன் வம்சவழிப் பரப்பு
  choice: மகன்கள்
  alternative: சந்ததியினர்
  rationale: இது உடனடி உயிரியல் மகன்களை மட்டும் அவசியமாகக் குறிக்காமல் இருக்கலாம்; ஆயினும் வம்சவரலாற்று வாய்பாட்டின் உறவுசார் வடிவத்தை மொழிபெயர்ப்பில் பேணி, பரந்த பொருளைச் சூழல் திறந்தவாறே விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரெய வசனத்தின் தொடர்ச்சியான வகைப்படுத்தல் அமைப்பு இயல்பான தமிழில் தெளிவாகத் தெரிய இறுதியில் ‘வகைப்படுத்தப்பட்டவர்கள்’ சேர்க்கப்பட்டுள்ளது; இடத்தைக் குறிக்கும் בְאַרְצֹתָם மட்டும் ‘நாடுகளிலும்’ என வேறுபடுத்தப்பட்டுள்ளது.
