source:
  edition: WLC
  text: אֵ֣לֶּה מִשְׁפְּחֹ֧ת בְּנֵי נֹ֛חַ לְ/תוֹלְדֹתָ֖/ם בְּ/גוֹיֵ/הֶ֑ם וּ/מֵ/אֵ֜לֶּה נִפְרְד֧וּ הַ/גּוֹיִ֛ם בָּ/אָ֖רֶץ אַחַ֥ר הַ/מַּבּֽוּל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/032.yaml
  text: These are the families of the sons of Noah[a], according to their generations, by their nations[c][b]; and from these the nations were separated on the earth after the flood.
translation:
  language: ta
  text: இவையே நோவாவின் மகன்களின் குடும்பங்கள்[a]; அவர்களுடைய தலைமுறைகளின்படியும், அவர்களுடைய தேசங்களின்படியும். இவர்களிலிருந்தே வெள்ளத்திற்குப் பிறகு பூமியில் தேசங்கள் பிரிந்தன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குடும்பங்கள்’ என்பதற்கு ‘குலங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பிரிந்தன’ என்பதற்கு ‘தனித்தனியாகின’ அல்லது ‘பிரிந்து பரவின’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: குடும்பங்கள்
  rationale: உறவுமுறை அடிப்படையிலான குடும்பப் பிரிவுகளைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘குலங்கள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְתוֹלְדֹתָם
  choice: அவர்களுடைய தலைமுறைகளின்படி
  rationale: תּוֹלְדוֹת என்பதன் தலைமுறைகள், சந்ததிவழிகள், வம்சவரலாறுகள் ஆகிய அர்த்தவாய்ப்புகளில், மூலத்தின் மரபுவழிச் சுருக்கத்தையும் தெளிவின்மையையும் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: בְּגוֹיֵהֶם
  choice: அவர்களுடைய தேசங்களின்படி
  rationale: இங்குள்ள ב வகைப்படுத்தலைக் குறிக்கிறது; இணையான எபிரெய முன்சொல் தொடர்களைத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: וּמֵאֵלֶּה
  choice: இவர்களிலிருந்தே
  rationale: முன்னர் பட்டியலிடப்பட்ட நோவாவின் மகன்களின் குடும்பங்களிலிருந்து தேசங்கள் தோன்றியதை இயல்பாக இணைக்கிறது; ‘-ஏ’ மூலத்தின் சுட்டுவலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: נִפְרְדוּ
  choice: பிரிந்து பரவின
  rationale: נפרד என்பதிலுள்ள பிரிதல் கருத்தைத் தக்கவைத்தபடி, பூமியில் தேசங்கள் பரவிய சூழ்நிலைப் பொருளையும் இயல்பான தமிழில் தெரிவிக்கிறது; ‘பிரிக்கப்பட்டன’ என்ற செயப்பாட்டு வாசிப்பும் சாத்தியம்.
- source_word: הַגּוֹיִם
  choice: தேசங்கள்
  rationale: நோவாவின் மக்களிடமிருந்து உருவான தனித்தனி மக்கள்-தேசக் குழுக்களைக் குறிக்கும் வழக்கமான, சூழலுக்குப் பொருத்தமான சொல்.
- source_word: בָּאָרֶץ
  choice: பூமியில்
  rationale: தேசங்களின் வெள்ளத்துக்குப் பிந்தைய விரிவான பரவலைச் சுருக்கும் இச்சூழலில் אֶרֶץ உலகளாவிய ‘பூமி’ எனப் புரிந்துகொள்ளப்படுகிறது.
- source_word: אַחַר הַמַּבּוּל
  choice: வெள்ளத்திற்குப் பிறகு
  rationale: காலத் தொடரை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது; முந்தைய பெருவெள்ள நிகழ்வைச் சுட்டுகிறது.
theological_decisions:
- issue: אֶרֶץ என்பதன் பரப்பு
  choice: உலகளாவிய ‘பூமி’
  alternative: குறிப்பிட்ட ‘நாடு/நிலம்’
  rationale: ஆதியாகமம் 10 நோவாவின் சந்ததியிலிருந்து உருவான தேசங்களின் பரவலை மொத்தமாகச் சுருக்குவதால், ‘பூமி’ என்பது உரையின் பரந்த நோக்கைப் பாதுகாக்கிறது.
- issue: נִפְרְדוּ என்பதன் செயற்பாட்டு நுணுக்கம்
  choice: பிரிந்து பரவின
  alternative: பிரிக்கப்பட்டன / பிரிந்தன
  rationale: நிபால் வடிவம் நடுநிலை அல்லது செயப்பாட்டு நுணுக்கத்தை ஏற்கக்கூடும். முதன்மை உரை பிரிதலையும் அதன் விளைவான பரவலையும் இயல்பாகச் சொல்கிறது; வெளிப்புறச் செயற்படுத்துபவரைத் திட்டவட்டமாகச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. எபிரெய வசனத்தின் இரண்டு இணையான வகைப்படுத்தல் தொடர்களும் ‘…படியும்’ என்ற அமைப்பால் பாதுகாக்கப்பட்டுள்ளன. தமிழில் முழுமையான வாக்கியமாக அமைய ‘பட்டியலிடப்பட்டவை’ என்பது வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது; இது ‘இவையே … குடும்பங்கள்’ என்ற பெயர்ச்சொல் வாக்கியத்தின் உட்பொருளை விளக்குகிறது.
