base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/016.yaml
  text: and the Jebusites[a], and the Amorites, and the Girgashites.
translation:
  language: ta
  text: எபூசியரையும்[a], எமோரியரையும், கிர்காசியரையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இனப்பெயர்கள் ஒருமை வடிவில் உள்ளன (‘எபூசியன்,’ ‘எமோரியன்,’ ‘கிர்காசியன்’); ஆனால் இந்த வம்சப் பட்டியலில் அவை மக்கள் குழுக்களைக் கூட்டாகக் குறிக்கின்றன. எனவே தமிழில் ‘எபூசியர்,’ ‘எமோரியர்,’ ‘கிர்காசியர்’ என்று கொடுக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: எபூசியர்
  rationale: எபிரெய வடிவம் ஒருமை இனப்பெயராக இருந்தாலும், ஆதியாகமம் 10-இன் மக்கள் பட்டியலில் ஒரு மக்கள் குழுவைக் கூட்டாகக் குறிக்கிறது. தமிழில் மரியாதைப் பன்மை வடிவமான ‘எபூசியர்’ இயல்பாக அந்தக் கூட்டுப் பொருளைத் தருகிறது.
- source_word: הָאֱמֹרִי
  choice: எமோரியர்
  rationale: சுற்றியுள்ள இனப்பெயர்களைப் போலவே, ஒருமை வடிவம் இங்கு ஒரு முழு மக்கள் குழுவைக் கூட்டாகக் குறிக்கிறது; ‘எமோரியர்’ என்பது இயல்பான தமிழ் இனப்பெயர் வடிவம்.
- source_word: הַגִּרְגָּשִׁי
  choice: கிர்காசியர்
  rationale: எபிரெய ஒருமை இனப்பெயர் இங்கு கூட்டுப் பொருளில் வருகிறது; ‘கிர்காசியர்’ அந்த மக்கள் குழுவைத் தெளிவாகக் குறிக்கிறது.
- source_word: וְאֶת / וְאֵת
  choice: -ஐயும்
  rationale: וְ என்பது தொடரும் பட்டியலின் இணைப்புச் சொல்; אֵת என்பது நேர்செயப்படுபொருள் குறியீடு. தமிழில் இவை தனிச் சொற்களாக அல்லாமல் ஒவ்வொரு இனப்பெயருடனும் இணையும் ‘-ஐயும்’ என்ற உருபால் இயல்பாக வெளிப்படுகின்றன.
