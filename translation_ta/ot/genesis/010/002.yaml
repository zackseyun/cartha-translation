  yaml_path: translation/ot/genesis/010/002.yaml
  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
translation:
  language: ta
  text: 'யாப்பேத்தின் மகன்கள்: கோமர், மாகோகு, மாதாய், யாவான்[a], தூபால், மேசேக்கு, தீராஸ்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'பிற்காலப் பயன்பாட்டில் சில பெயர்களுக்கு இன அல்லது நிலப்பகுதிசார் அடையாளங்கள் இருக்கலாம்: “மாதாய்” என்பது “மேதியர்” என்றும், “யாவான்” என்பது “அயோனியா” அல்லது “கிரேக்கர்” என்றும் பொருள்படலாம். முதன்மை உரை எபிரேய வம்சப்பெயர்களை ஒலிபெயர்த்து வழங்குகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: ஆண்பால் வம்சப்பட்டியலை அறிமுகப்படுத்தும் בֵּן என்பதன் பன்மை இணைப்புவடிவம். ‘மகன்கள்’ என்பது எபிரேயச் சொல்லின் நேரடிப் பொருளையும் வம்சப்பட்டியலின் அமைப்பையும் காக்கிறது.
- source_word: יֶפֶת
  choice: யாப்பேத்
  rationale: தனிப்பட்ட பெயர்; தமிழ் வாசிப்புக்கு இயல்பான, வழக்கிலுள்ள ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: גֹּמֶר
  choice: கோமர்
  rationale: இங்கு மகனின் பெயராக வருவதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מָגוֹג
  choice: மாகோகு
  rationale: பிற்காலப் பயன்பாட்டில் இன அல்லது நிலப்பகுதிசார் தொடர்புகள் இருந்தாலும், இங்கு வம்சப்பட்டியலிலுள்ள பெயராகச் செயல்படுவதால் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מָדַי
  choice: மாதாய்
  rationale: மேதியருடன் தொடர்புபடுத்தக்கூடிய பெயராயினும், இங்கு தனிப்பெயராக வழங்கப்படுவதால் எபிரேய வடிவம் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: יָוָן
  choice: யாவான்
  rationale: சில இடங்களில் ஐோனியா அல்லது கிரேக்கர்களைக் குறிக்கக்கூடிய சொல்; இங்கு வம்சப்பட்டியலின் தனிப்பெயர் வடிவம் பாதுகாக்கப்பட்டுள்ளது.
- source_word: תֻבָל
  choice: தூபால்
  rationale: தனிப்பெயர் என்பதால் எபிரேய உச்சரிப்பை நெருங்கிய தமிழ் வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מֶשֶׁךְ
  choice: மேசேக்கு
  rationale: தனிப்பெயர்; தமிழில் தெளிவாக வாசிக்க ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: תִירָס
  choice: தீராஸ்
  rationale: தனிப்பெயர் என்பதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
