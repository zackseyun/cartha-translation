base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/005.yaml
  text: From these the coastlands of the nations were separated in their lands[a], each according to his language, by their clans[c][b], in their nations.
translation:
  language: ta
  text: இவர்களிடமிருந்து தேசங்களின் கடலோர மக்கள்[a] தத்தம் நிலங்களில், ஒவ்வொருவரும் தத்தம் மொழியின்படி, தத்தம் குலங்களின்படி, தத்தம் தேசங்களில் பிரிந்து வாழ்ந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேசங்களின் தீவுகள்” அல்லது “தேசங்களின் கடலோரப் பகுதிகள்.” எபிரெயச் சொல் தீவுகளையோ கடலோரப் பகுதிகளையோ குறிக்கலாம்; இங்கு அவற்றில் வாழ்ந்த மக்களைக் குறிக்கும் ஆகுபெயராகவும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: இவர்களிடமிருந்து
  rationale: מִן உடன் வரும் demonstrative, முன்பு பட்டியலிடப்பட்ட சந்ததியினரிடமிருந்து இந்த மக்கள் தோன்றிப் பிரிந்தனர் என்ற மூலத்தைக் குறிக்கிறது.
- source_word: נִפְרְדוּ
  choice: பிரிந்து பரவினர்
  rationale: פרד என்பதன் Niphal வடிவம் பிரிதல் அல்லது தனித்தனியாகச் செல்லுதல் என்ற பொருளைக் கொண்டது. மக்கள் தங்கள் பகுதிகளில் பரவிய சூழலை இயல்பான தமிழில் தெரிவிக்க இரு தொடர்புடைய வினைகள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: אִיֵּי הַגּוֹיִם
  choice: கடலோரத் தேச மக்கள்
  rationale: אִיִּים என்பது தீவுகளையோ கடலோரப் பகுதிகளையோ குறிக்கலாம். இங்கு பிரிவதும் பரவுவதும் மக்களே என்பதால், இடப்பெயரை மக்களைக் குறிக்கும் ஆகுபெயராகப் புரிந்து இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது; நேரடியான புவியியல் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּאַרְצֹתָם
  choice: தத்தம் நிலங்களில்
  rationale: אֶרֶץ இங்கு ஒவ்வொரு மக்கள் குழுவுக்கும் உரிய நிலப்பகுதியைக் குறிக்கிறது. ‘தத்தம்’ என்பது எபிரெயப் பன்மை உடைமைப் பொருளை தமிழில் பகிர்வுறத் தெளிவாக்குகிறது.
- source_word: אִישׁ לִלְשֹׁנוֹ
  choice: மொழியின்படியும்
  rationale: சொல்லுக்குச் சொல் ‘ஒவ்வொருவன் அவனுடைய மொழியின்படி’ என்ற பகிர்வுறு தொடர். முன் வரும் ‘தத்தம்’ அதன் பொருளை இயல்பான தமிழில் தொடரச் செய்கிறது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: குலங்களின்படியும்
  rationale: מִשְׁפָּחָה இத்தகைய வம்ச மற்றும் இனப் பட்டியல் சூழலில் தனிக் குடும்பத்தைவிட விரிவான குலக் குழுவைக் குறிக்கிறது.
- source_word: בְּגוֹיֵהֶם
  choice: தேசங்களின்படியும்
  rationale: גּוֹי என்பது இங்கு தனித்த மக்கள் அல்லது தேசக் குழுவைக் குறிக்கிறது. தொடர்ச்சியான வகைப்பாட்டைத் தெளிவுபடுத்த ‘தேசங்களின்படியும்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: אִיֵּי הַגּוֹיִם என்பது நிலப்பகுதிகளைக் குறிக்கிறதா அல்லது அங்கு வாழும் மக்களைக் குறிக்கிறதா?
  choice: முதன்மை உரையில் மக்களைக் குறிக்கும் ஆகுபெயராக ‘கடலோரத் தேச மக்கள்’
  alternative: ‘தேசங்களின் தீவுகள்’ அல்லது ‘தேசங்களின் கடலோரப் பகுதிகள்’
  rationale: எபிரெயத் தொடர் நேரடியாக புவியியல் பகுதிகளைக் குறிக்கக்கூடும்; ஆனால் נִפְרְדוּ என்ற வினையும் இனப்பட்டியல் சூழலும் அப்பகுதிகளில் வாழும் மக்கள் பிரிந்து பரவியதைக் காட்டுகின்றன. ஐயுறவு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரெய வசனத்தின் நிலம், மொழி, குலம், தேசம் என்ற வகைப்பாட்டு வரிசை காக்கப்பட்டுள்ளது; இடப்பகுதியா மக்களா என்ற உண்மையான ஐயுறவு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
