  text: and the Arvadites[a], the Zemarites, and the Hamathites. Afterward the clans of the Canaanites were scattered.
translation:
  language: ta
  text: அர்வாதியரையும், செமாரியரையும், ஆமாத்தியரையும் பெற்றான். பின்னர் கானானியரின்[a] குலங்கள் சிதறிப்போயின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘கானானியன்’ என்பது இலக்கண ஒருமையிலுள்ள கூட்டுப் பெயராக வந்து, கானானிய மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְוָדִי
  choice: அர்வாதியர்
  rationale: ஒருமை வடிவிலுள்ள இனப்பெயர் இச்சூழலில் ஒரு மக்கள் குழுவைக் கூட்டாகக் குறிக்கிறது; தமிழில் மரியாதைப் பன்மை வடிவம் இயல்பாக அந்தக் கூட்டுப்பொருளை வெளிப்படுத்துகிறது.
- source_word: הַצְּמָרִי
  choice: செமாரியர்
  rationale: சுற்றியுள்ள இனப்பெயர்களைப் போலவே இது ஒரு மக்கள் குழுவைக் கூட்டாகக் குறிக்கிறது.
- source_word: הַחֲמָתִי
  choice: ஆமாத்தியர்
  rationale: இது பட்டியலிலுள்ள கூட்டுப்பொருள் கொண்ட இனப்பெயர்; தமிழில் பன்மை மக்கள் பெயராக வழங்கப்பட்டுள்ளது.
- source_word: וְאַחַר
  choice: பின்னர்
  rationale: பட்டியலிடப்பட்ட சந்ததிகளுக்குப் பின்பு நிகழ்ந்ததைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: נָפֹצוּ
  choice: சிதறிப்போயின
  rationale: நிஃபால் வடிவின் செயல்படுபொருள்/நிலைமாற்ற நுணுக்கத்தைப் பாதுகாத்து, குலங்கள் பல இடங்களுக்குப் பிரிந்து சென்றதைக் காட்டுகிறது.
- source_word: מִשְׁפְּחוֹת
  choice: குலங்கள்
  rationale: இனவியல் மற்றும் வம்சவரலாற்றுச் சூழலில் அணுக்கக் குடும்பங்களை விடப் பெரிய உறவுக் குழுக்களைக் குறிக்கிறது.
- source_word: הַכְּנַעֲנִי
  choice: கானானியர்
  rationale: எபிரெயத்தில் இலக்கண ஒருமையாக இருந்தாலும், இங்கு கானானிய மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் கூட்டினப்பெயராக உள்ளது.
