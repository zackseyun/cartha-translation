translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. முந்தைய வசனத்திலிருந்து தொடரும் எபிரெய ‘எத்’ குறியீட்டுப் பட்டியலை தமிழில் முழுமையான வாக்கியமாக்க ‘பெற்றான்’ சேர்க்கப்பட்டுள்ளது; இது உடனடி இலக்கியச் சூழலிலிருந்து நிரப்பப்படுகிறது. அடிக்குறி குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
