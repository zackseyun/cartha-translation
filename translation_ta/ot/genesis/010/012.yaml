id: GEN.10.12
reference: Genesis 10:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְֽ/אֶת רֶ֔סֶן בֵּ֥ין נִֽינְוֵ֖ה וּ/בֵ֣ין כָּ֑לַח הִ֖וא הָ/עִ֥יר הַ/גְּדֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/012.yaml
  text: and Resen[a], between Nineveh and Calah[b]; that is the great city.
translation:
  language: ta
  text: நினிவேக்கும் காலாகுக்கும்[a] இடையிலுள்ள ரெசேனையும் கட்டினான்; அதுவே பெரிய நகரம்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காலாகு’ என்பதற்கு அசீரிய மொழி வடிவத்தைப் பின்பற்றி ‘கல்ஹு’ என்றும் வழங்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அதுவே பெரிய நகரம்’ என்பது ரெசேனை மட்டும் குறிக்கலாம்; அல்லது நினிவேக்கும் காலாகுக்கும் இடையிலிருந்த விரிவான நகர்ப்பகுதியைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶת
  choice: ரெசேனையும்
  rationale: וְ இணைப்பையும் אֶת நேரடி செயப்படுபொருள் குறியீட்டையும் காட்டுகிறது. தமிழில் பெயருடன் சேரும் ‘-ஐயும்’ இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רֶסֶן
  choice: ரெசேன்
  rationale: எபிரெய இடப்பெயரின் ஒலியை நவீன தமிழில் தெளிவாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: בֵּין ... וּבֵין
  choice: நினிவேக்கும் காலாகுக்கும் இடையில்
  rationale: இரண்டு இடங்களுக்கு நடுவிலான அமைவிடத்தைக் குறிக்கும் இணை முன்னிடைத் தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: נִינְוֵה
  choice: நினிவே
  rationale: தமிழில் வழக்கமாக அறியப்படும் வேதாகம இடப்பெயர் வடிவம்.
- source_word: כָּלַח
  choice: காலாகு
  rationale: எபிரெய மெய்யெழுத்து வடிவத்தை அடிப்படையாகக் கொண்ட தெளிவான தமிழ் எழுத்துப்பெயர்ப்பு; அசீரிய வடிவமான ‘கல்ஹு’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הִוא
  choice: அதுவே
  rationale: சுயாதீனப் பதிலிப்பெயரின் சுட்டும் மற்றும் வலியுறுத்தும் தன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: הָעִיר הַגְּדֹלָה
  choice: பெரிய நகரம்
  rationale: இரு சொற்களிலும் உள்ள வரையறைத் தன்மையை தமிழ் சுட்டுப்பெயர் அமைப்பு ஏற்கெனவே வெளிப்படுத்துகிறது; ‘பெரிய’ என்பது அளவையும் முக்கியத்துவத்தையும் உள்ளடக்கக்கூடிய இயல்பான பொருத்தம்.
theological_decisions:
- issue: ‘அதுவே பெரிய நகரம்’ என்பதன் குறிப்பு
  choice: இறுதிக் கூற்று யாரை அல்லது எதைச் சுட்டுகிறது என்பதை முதன்மை உரையில் தீர்மானிக்காமல் ‘அதுவே’ என்று வைக்கப்பட்டுள்ளது.
  alternative: அது ரெசேனை மட்டும் குறிக்கலாம்; அல்லது நினிவே–காலாகு இடையிலான விரிவான நகர்ப்பகுதியைக் குறிக்கலாம்.
  rationale: எபிரெய தொடரமைப்பு குறிப்பின் எல்லையைத் தெளிவாகத் தீர்மானிப்பதில்லை. ஆகவே உரையின் உண்மையான தெளிவின்மை காக்கப்படுகிறது.
translation_notes:
  register: நடை நவீனமும் கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரிவதுமானதாக வைக்கப்பட்டுள்ளது. எபிரெயத்தில் முந்தைய வசனத்திலிருந்து தொடரும் ‘கட்டினான்’ என்னும் வினை இவ்வசனத்தில் வெளிப்படையாக மீண்டும் வரவில்லை; தனித்த வசனமாகத் தமிழில் முழுமையான வாக்கியம் அமைய அது சூழலிலிருந்து வழங்கப்பட்டுள்ளது. ‘இருந்த’ என்பது இடஅமைவை இயல்பாகத் தெரிவிக்கும் துணைச்சொல்.
