  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת בְּנֵי נֹ֔חַ שֵׁ֖ם חָ֣ם וָ/יָ֑פֶת וַ/יִּוָּלְד֥וּ לָ/הֶ֛ם בָּנִ֖ים אַחַ֥ר הַ/מַּבּֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/001.yaml
  text: 'These are the generations of the sons of Noah: Shem[a], Ham, and Japheth. And sons were born to them after the flood.'
translation:
  language: ta
  text: நோவாவின் மகன்களான சேம், காம், யாப்பேத் ஆகியோரின் தலைமுறைகள் இவை.[a] பெருவெள்ளத்திற்குப் பிறகு அவர்களுக்கு மகன்கள் பிறந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நோவாவின் மகன்களின் வழிவந்தவர்களைப் பற்றிய பதிவு.” ‘தலைமுறைகள்’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயத் தலைப்புச் சொல், ஒரு வம்சத்தையோ ஒருவரிடமிருந்து தொடர்வனவற்றையோ பரந்த பொருளில் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவை
  rationale: இந்தச் சொற்றொடர் புதிய பகுதியை அறிமுகப்படுத்துகிறது. தமிழில் ‘இவை’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது; וְ-இன் உரையாடல் இணைப்பை தனியாகச் செயற்கையாகச் சேர்க்க வேண்டியதில்லை.
- source_word: תּוֹלְדֹת
  choice: தலைமுறைகள்
  rationale: ஆதியாகமம் முழுவதும் திரும்பத் திரும்ப வரும் தலைப்புச் சூத்திரத்தின் வடிவத்தையும், வம்சம் அல்லது ஒருவரிடமிருந்து தொடர்வன என்ற அதன் பரந்த பொருளையும் காக்கிறது.
- source_word: בְּנֵי נֹחַ
  choice: நோவாவின் மகன்களான
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவான, இயல்பான தமிழில் தருகிறது; தொடர்ந்து வரும் மூன்று பெயர்களையும் நோவாவின் மகன்கள் என அடையாளப்படுத்துகிறது.
- source_word: שֵׁם חָם וָיָפֶת
  choice: சேம், காம், யாப்பேத்
  rationale: தனிப்பட்ட பெயர்கள் நவீனத் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன.
- source_word: וַיִּוָּלְדוּ
  choice: பிறந்தார்கள்
  rationale: ילד வினையின் நிஃபால் வடிவம் இங்கு ‘பிறத்தல்’ என்ற செயலற்ற/தன்னிகழ்வுப் பொருளைக் கொண்டது; ‘பெற்றார்கள்’ அல்லது ‘பிறப்பித்தார்கள்’ என்று செய்பொருள் சார்ந்த அர்த்தத்தைச் சேர்க்கவில்லை.
- source_word: לָהֶם
  choice: அவர்களுக்கு
  rationale: பிறப்பு அவர்களோடு கொண்ட உறவு அல்லது உடைமையைச் சுட்டும் לָ-வைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּנִים
  choice: மகன்கள்
  rationale: மூலத்தில் உள்ள ஆண்பால் பன்மையைத் துல்லியமாகக் காக்கிறது; வம்சப்பட்டியல் சூழலுக்கும் இது பொருந்துகிறது.
- source_word: אַחַר הַמַּבּוּל
  choice: பெருவெள்ளத்திற்குப் பிறகு
  rationale: மַבּוּל என்பதற்கான ஆதியாகமச் சூழலுக்கு ஏற்ற தெளிவான தமிழ் சொல் ‘பெருவெள்ளம்’; காலத் தொடர்பும் நேரடியாகக் காக்கப்படுகிறது.
theological_decisions:
- issue: ஆதியாகமத்தின் תּוֹלְדֹת தலைப்புச் சூத்திரத்தை மொழிபெயர்த்தல்
  choice: தலைமுறைகள்
  alternative: வழிவந்தவர்கள் / வம்ச வரலாறு
  rationale: ‘தலைமுறைகள்’ என்பது ஆதியாகமத்தின் இலக்கிய அமைப்பை வெளிப்படுத்தும் முக்கியச் சொல்லை ஒரேமுறையில் காக்கிறது; அதை வழிவந்தவர்கள் என்று மட்டும் குறுக்கிவிடாமல் மூலத்தின் பரந்த பொருள் வாய்ப்பையும் விடுகிறது.
- issue: בָּנִים என்ற பாலினக் குறிப்புள்ள சொல்லை மொழிபெயர்த்தல்
  choice: மகன்கள்
  alternative: பிள்ளைகள்
  rationale: எபிரெயச் சொல் வெளிப்படையாக ஆண்பால் பன்மையில் உள்ளது; இங்குள்ள வம்சப்பட்டியல் ஆண் வழிவந்தவர்களைப் பற்றியது என்பதால் ‘மகன்கள்’ மூலத்துக்கு நெருக்கமானது.
translation_notes:
  register: நவீனத் தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. தலைப்புச் சூத்திரத்தில் மூலத்தின் இலக்கியத் தன்மை காக்கப்பட்டாலும், வாக்கிய அமைப்பு தமிழுக்கு இயல்பாக வைக்கப்பட்டுள்ளது.
