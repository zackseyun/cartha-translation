source:
  edition: WLC
  text: וּ/לְ/שֵׁ֥ם יֻלַּ֖ד גַּם ה֑וּא אֲבִי֙ כָּל בְּנֵי עֵ֔בֶר אֲחִ֖י יֶ֥פֶת הַ/גָּדֽוֹל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/021.yaml
  text: And to Shem also[a], the father of all the sons of Eber, the brother of Japheth the elder, children were born.
translation:
  language: ta
  text: ஏபேரின் மகன்கள் அனைவருக்கும் தந்தையும், மூத்தவனான யாப்பேத்தின் சகோதரனுமான[a] சேமுக்கும் பிள்ளைகள் பிறந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏபேரின் மகன்கள் அனைவருக்கும் தந்தையும், யாப்பேத்தின் மூத்த சகோதரனுமான சேமுக்கும் பிள்ளைகள் பிறந்தனர்.” எபிரெயத்தில் “பெரியவர்/மூத்தவர்” என்று பொருள்படும் பெயரடை சேமையோ யாப்பேத்தையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְשֵׁם
  choice: சேமுக்கும்
  rationale: இணைப்பிடைச்சொல்லும் முன்னிடைச்சொல்லும் வம்சப்பட்டியலில் சேமையும் அடுத்தவராக அறிமுகப்படுத்துகின்றன. தமிழில் ‘சேமுக்கும்’ என்பது தொடர்ச்சியையும் சேர்க்கைப் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יֻלַּד גַּם הוּא
  choice: பிள்ளைகள் பிறந்தனர்
  rationale: எபிரெயத்தில் ஒருமை வடிவ வினை இருந்தாலும், இச்சூழலில் அது ஒருவருக்குப் பிறந்த சந்ததியினரை அறிமுகப்படுத்தும் மரபுவழக்காகும். தமிழில் பன்மைப் பொருளை வெளிப்படையாகக் கூறுவது இயல்பானது; ‘גם הוא’ தரும் ‘அவனுக்கும்’ என்ற சேர்க்கை வலியுறுத்தல் ‘சேமுக்கும்’ என்பதில் அடங்கியுள்ளது.
- source_word: אֲבִי כָּל בְּנֵי עֵבֶר
  choice: ஏபேரின் மகன்கள் அனைவருக்கும் தந்தை
  rationale: வம்சவழிச் சூழலில் אָב முன்னோர் அல்லது மூதாதை என்ற விரிவான பொருளைக் கொள்ளலாம். ஆயினும் மூலத்தின் நேரடியான உருவகத்தையும், ‘ஏபேரின் மகன்கள்’ என்ற குறிப்பிட்ட சொல்லாட்சியையும் காக்க ‘தந்தை’ மற்றும் ‘மகன்கள்’ பயன்படுத்தப்பட்டுள்ளன.
- source_word: אֲחִי יֶפֶת הַגָּדוֹל
  choice: மூத்தவனான யாப்பேத்தின் சகோதரன்
  rationale: הַגָּדוֹל என்பதற்கு இக்குடும்ப உறவுச் சூழலில் ‘பெரியவன்’ என்பதைவிட ‘மூத்தவன்’ என்பது இயல்பானது. முதன்மை உரை அதை யாப்பேத்துடன் இணைக்கிறது; சேமுடன் இணைக்கும் இலக்கண வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: הַגָּדוֹל என்ற பெயரடை சேமையா யாப்பேத்தையா குறிக்கிறது என்பது
  choice: யாப்பேத்தைச் சுட்டுவதாகக் கொண்டு, ‘மூத்தவனான யாப்பேத்தின் சகோதரன்’ என்று மொழிபெயர்த்தல்
  alternative: சேமைக் குறிக்கிறது எனக் கொண்டு, ‘யாப்பேத்தின் மூத்த சகோதரன்’ என்று மொழிபெயர்த்தல்
  rationale: எபிரெயச் சொற்றொடர் இரண்டு இலக்கண இணைப்புகளுக்கும் இடமளிக்கிறது. இது வம்சவழியைச் சார்ந்த உண்மையான மொழியியல் தெளிவின்மை; ஆகவே முதன்மை உரையில் ஒரு சாத்திய வாசிப்பு தரப்பட்டு, மற்றது அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெய இணைப்புச் சொற்றொடர் தமிழில் இயல்பாகப் புரியும்படி பெயரெச்சத் தொடராக அமைக்கப்பட்டுள்ளது; மூலத்தின் முக்கிய வம்சவழிச் சொற்கள் முற்றிலும் எளிமைப்படுத்தப்படவில்லை.
