  text: the Kenites[a], the Kenizzites, and the Kadmonites—
translation:
  language: ta
  text: கேனியர்களையும், கெனிசியர்களையும், கத்மோனியர்களையும்[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லான קַדְמֹנִי (கத்மோனி) என்பது ‘கிழக்கு’ அல்லது ‘கிழக்கத்திய’ என்பதுடன் தொடர்புடையது. இங்கு அது மக்கள் இனங்களின் பட்டியலில் வருவதால், ‘கத்மோனியர்கள்’ என்ற இனப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת / וְאֶת / וְאֵת
  choice: -ஐ / -யையும்
  rationale: எபிரெய மொழியின் நேரடி செயப்படுபொருள் குறிகள் தனிச் சொற்களாக மொழிபெயர்க்கப்படாமல், தமிழ் வேற்றுமை உருபான ‘ஐ’ மற்றும் பட்டியலை இணைக்கும் ‘உம்’ மூலம் வெளிப்படுத்தப்பட்டுள்ளன.
- source_word: הַקֵּינִי
  choice: கேனியர்கள்
  rationale: வரையறைச் சுட்டுடன் வரும் இனப்பெயர் ஒரு மக்கள் குழுவைக் கூட்டாகக் குறிக்கிறது; எனவே தமிழில் இயல்பான பன்மை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַקְּנִזִּי
  choice: கெனிசியர்கள்
  rationale: நிலப்பகுதியில் வாழும் மக்கள் இனங்களின் பட்டியலில் வரும் கூட்டுப் பொருளுடைய இனப்பெயராக இருப்பதால் பன்மையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַקַּדְמֹנִי
  choice: கத்மோனியர்கள்
  rationale: இந்தச் சொல் ‘கிழக்கு’ என்பதுடன் தொடர்புடையதாக இருந்தாலும், இணையான இனப்பெயர்களின் பட்டியலில் ஒரு குறிப்பிட்ட மக்கள் குழுவின் பெயராகச் செயல்படுகிறது; ஆகவே பொருளாக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
