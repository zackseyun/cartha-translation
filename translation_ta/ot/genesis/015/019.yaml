translation_notes:
  register: நவீன தரமான தமிழில், இனக்குழுக்களை இயல்பான பன்மை வடிவில் குறிப்பிடும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இந்த வசனம் அடுத்த வசனத்திலும் தொடரும் பட்டியலின் ஒரு பகுதி என்பதால் முடிவில் நீண்ட கோடு வைக்கப்பட்டுள்ளது; அடிக்குறிப்பு குறி தொடர்புடைய ‘கத்மோனியர்கள்’ என்பதற்குப் பின் அமைக்கப்பட்டுள்ளது.
