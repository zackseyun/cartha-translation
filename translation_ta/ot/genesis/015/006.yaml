  text: וְ/הֶאֱמִ֖ן בַּֽ/יהוָ֑ה וַ/יַּחְשְׁבֶ֥/הָ לּ֖/וֹ צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/006.yaml
  text: And he believed Yahweh[c][b][a], and he counted it to him as righteousness.
translation:
  language: ta
  text: ஆபிராம் ஆண்டவரை நம்பினார்[a]; ஆண்டவர் அதை ஆபிராமுக்கு நீதியாகக் கணக்கிட்டார்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவரில் நம்பிக்கை வைத்தார்.”
    reason: lexical_alternative
  - marker: b
    text: “கணக்கிட்டார்” என்பதை “மதித்தார்” அல்லது “அவருடைய கணக்கில் வரவு வைத்தார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெய வாக்கிய அமைப்பு பொதுவாக, ஆண்டவர் ஆபிராம் நம்பியதை அவருக்கு நீதியாகக் கணக்கிட்டார் என்று புரிந்துகொள்ளப்படுகிறது. “ஆபிராம் ஆண்டவரை நம்பி, அவரை அல்லது அதை நீதியாகக் கருதினார்” என்ற பொருளில், “கணக்கிட்டார்” என்பதன் எழுவாயாக ஆபிராமைக் கொள்ளும் வாசிப்பும் இலக்கண ரீதியில் முன்வைக்கப்படுகிறது; ஆனால் அது குறைவான சாத்தியமுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֶאֱמִן
  choice: அவர் நம்பினார்
  rationale: אמן என்பதன் ஹிஃபில் வடிவம் இங்கு ஒருவர்மேல் நம்பிக்கை வைப்பதைக் குறிக்கிறது. தமிழில் “நம்பினார்” என்பது நம்புதல், நம்பிக்கை வைத்தல் ஆகிய இரு நுணுக்கங்களையும் இயல்பாகத் தாங்குகிறது.
- source_word: בַּיהוָה
  choice: ஆண்டவரை
  rationale: בְּ முன்னொட்டு நம்பிக்கையின் இலக்காக יהוה-ஐக் குறிக்கிறது. இறைப் பெயரைக் கணிப்பான ஒலிபெயர்ப்பால் நிரப்பாமல், நவீனத் தமிழில் மரியாதையுடனும் இயல்பாகவும் “ஆண்டவர்” என்று வழங்கப்பட்டுள்ளது.
- source_word: וַיַּחְשְׁבֶהָ
  choice: அவர் அதை ... கணக்கிட்டார்
  rationale: חשב என்பது மதித்தல், கணக்கிடுதல், ஒருவருடைய கணக்கில் சேர்த்தல் என்ற பொருள் கொண்டது. “கணக்கிட்டார்” அதன் கணக்கீட்டு நுணுக்கத்தைப் பாதுகாக்கிறது; பெண்பால் ஒருமை பின்னொட்டு, ஆபிராமின் நம்புதலாகிய செயலை “அதை” என்று சுட்டுகிறது.
- source_word: לּוֹ
  choice: அவருக்கு
  rationale: לְ உடன் வந்துள்ள சுட்டுப்பெயர் பின்னொட்டு, யாருக்கு அது கணக்கிடப்பட்டது என்பதைக் காட்டுகிறது. “அவருக்கு” இதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: צְדָקָה
  choice: நீதியாக
  rationale: צְדָקָה இங்கு நீதியான நிலை அல்லது நேர்மை எனும் கருத்தைக் குறிக்கிறது. “நீதியாக” என்பது மூலத்தின் சுருக்கத்தையும் பிற்கால வேதாகமத் தொடர்புகளையும் தேவையற்ற விளக்கமின்றிப் பாதுகாக்கிறது.
theological_decisions:
- issue: “கணக்கிட்டார்” என்பதன் எழுவாய்
  choice: 'ஆண்டவரே எழுவாய்: ஆபிராம் ஆண்டவரை நம்பினார்; ஆண்டவர் அதை ஆபிராமுக்கு நீதியாகக் கணக்கிட்டார்.'
  alternative: 'ஆபிராமே எழுவாய்: அவர் ஆண்டவரை நம்பி, அவரை அல்லது அதை நீதியாகக் கருதினார்.'
  rationale: சூழலும் எபிரெய வாக்கியத் தொடரும் ஆண்டவரை எழுவாயாகக் கொள்வதை வலுவாக ஆதரிக்கின்றன. இருப்பினும் மூலத்தில் எழுவாய் மீண்டும் வெளிப்படையாகப் பெயரிடப்படாததால், பிரதான உரையில் “அவர்” என வைத்து அந்த வடிவத்தைப் பாதுகாத்து, மாற்று வாசிப்பை அடிக்குறிப்பில் பதிவு செய்துள்ளோம்.
- issue: וַיַּחְשְׁבֶהָ-வில் உள்ள பெண்பால் பின்னொட்டின் குறிப்பு
  choice: அது ஆபிராமின் நம்புதலாகிய செயலைக் குறிக்கிறது; பிரதான உரையில் “அதை” என மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: அது ஆபிராமின் நம்பிக்கை அல்லது அவரது முழுப் பதிலை விரிவாகக் குறிக்கலாம்.
  rationale: உடனடியாகப் பெண்பால் பெயர்ச்சொல் இல்லாவிட்டாலும், எபிரெயத்தில் ஒரு செயல் அல்லது நிகழ்வை பெண்பால் பின்னொட்டால் சுட்ட முடியும். “நம்பிக்கை” போன்ற விளக்கப் பெயர்ச்சொல்லை உரைக்குள் சேர்க்காமல் “அதை” என்பது மூலத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. “கர்த்தர்” என்ற மரபுவழிச் சொல்லுக்குப் பதிலாக இயல்பான “ஆண்டவர்” தேர்ந்தெடுக்கப்பட்டது. மூலத்தில் உள்ள சுட்டுப்பெயர் சார்ந்த அளவான தெளிவின்மை பிரதான உரையில் பாதுகாக்கப்பட்டு, அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
