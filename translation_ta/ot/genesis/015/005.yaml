base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/005.yaml
  text: Then he brought him outside and said[a], “Please look toward the heavens and count the stars, if you are able to count them.” Then he said to him, “So shall your offspring be.”
translation:
  language: ta
  text: பின்பு அவர் அவனை வெளியே அழைத்துச் சென்று, “வானத்தை நோக்கிப் பார்; நட்சத்திரங்களை எண்ணு; அவற்றை எண்ண உன்னால் முடியுமானால்” என்றார். மேலும் அவர் அவனிடம், “உன் சந்ததி[a] அவ்வாறே இருக்கும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் வித்து.” எபிரெயப் பெயர்ச்சொல் வடிவில் ஒருமையாக இருந்தாலும், கூட்டுப்பொருளில் வழித்தோன்றல்களை ஒட்டுமொத்தமாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא אֹתוֹ הַחוּצָה
  choice: அவர் அவனை வெளியே அழைத்துக்கொண்டு வந்து
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ஒருவரை வெளியே செல்லச் செய்வதைக் குறிக்கிறது. ‘வெளியே அழைத்துக்கொண்டு வந்து’ என்பது அந்தச் செயப்பாட்டு நுணுக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: הַבֶּט נָא הַשָּׁמַיְמָה
  choice: வானத்தை நோக்கிப் பார்
  rationale: הבט என்பது ‘பார்’ என்ற கட்டளை; שמימה-வின் திசைகாட்டும் வடிவத்தை ‘வானத்தை நோக்கி’ வெளிப்படுத்துகிறது. נא கட்டளையை மென்மைப்படுத்தவோ வலியுறுத்தவோ செய்யும்; தமிழில் செயற்கையாக ‘தயவுசெய்து’ சேர்க்காமல் இயல்பான கட்டளை நடையில் அதன் தொனியை வைத்திருக்கிறது.
- source_word: וּסְפֹר הַכּוֹכָבִים אִם תּוּכַל לִסְפֹּר אֹתָם
  choice: உன்னால் நட்சத்திரங்களை எண்ண முடிந்தால், அவற்றை எண்ணு
  rationale: எண்ணுவதற்கான திறனைச் சோதிக்கும் நிபந்தனையையும் அதைத் தொடர்ந்து வரும் கட்டளையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: כֹּה יִהְיֶה
  choice: அவ்வாறே இருக்கும்
  rationale: முன்னர் காட்டப்பட்ட எண்ணிலடங்கா நட்சத்திரங்களோடு செய்யப்படும் ஒப்பீட்டைச் சுருக்கமாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: זַרְעֶךָ
  choice: உன் சந்ததி
  rationale: זֶרַע இலக்கண வடிவில் ஒருமையாக இருந்தாலும் இங்கு கூட்டுப்பொருளில் வழித்தோன்றல்களைக் குறிக்கலாம். ‘சந்ததி’ என்பது அந்த ஒருமை–கூட்டுப்பொருள் நெகிழ்வை இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: ஆபிராமுக்கான வாக்குறுதியில் זַרְעֶךָ என்பதன் ஒருமை/கூட்டுப்பொருள் நுணுக்கம்
  choice: உன் சந்ததி
  alternative: உன் வித்து; உன் சந்ததியினர்
  rationale: ‘சந்ததி’ என்பது எபிரெயச் சொல்லின் கூட்டுப்பொருளைத் தருவதோடு, அதை வெளிப்படையான பன்மையாக மாற்றாமல் அதன் ஒருமை வடிவத்தின் சாத்தியமான இறையியல் ஒலிப்பையும் திறந்தவாறு வைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாக வாசிக்கக்கூடிய, ஆனால் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தில் பெயர்கள் இன்றி வரும் சுட்டுப்பெயர்கள் தமிழிலும் ‘அவர்/அவன்’ எனப் பாதுகாக்கப்பட்டுள்ளன; சூழல் அவற்றின் referents-ஐத் தெளிவாக்குகிறது.
