revisions:
- from: பின்பு அவர் அவனை வெளியே அழைத்துக்கொண்டு வந்து, “வானத்தை நோக்கிப் பார்; உன்னால் நட்சத்திரங்களை எண்ண முடிந்தால், அவற்றை எண்ணு” என்றார். மேலும் அவர் அவனிடம், “உன் சந்ததி[a] அவ்வாறே இருக்கும்” என்றார்.
  to: பின்பு அவர் அவனை வெளியே அழைத்துச் சென்று, “வானத்தை நோக்கிப் பார்; நட்சத்திரங்களை எண்ணு; அவற்றை எண்ண உன்னால் முடியுமானால்” என்றார். மேலும் அவர் அவனிடம், “உன் சந்ததி[a] அவ்வாறே இருக்கும்” என்றார்.
  rationale: The revision restores the Hebrew rhetorical order of command followed by the ability qualification, improves the natural Tamil expression for leading someone outside, and refines the footnote while preserving the lexical and theological ambiguity of זַרְעֶךָ. No doctrinal interpretation has been added.
