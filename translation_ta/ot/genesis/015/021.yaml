  yaml_path: translation/ot/genesis/015/021.yaml
  text: and the Amorites, and the Canaanites, and the Girgashites, and the Jebusites.
translation:
  language: ta
  text: அமோரியர்களையும், கானானியர்களையும், கிர்காசியர்களையும், எபூசியர்களையும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת
  choice: -ஐயும்
  rationale: וְ என்பது பட்டியலின் தொடர்ச்சியைச் சுட்டுகிறது; אֶת திட்டவட்டமான நேரடிச் செயப்படுபொருளைக் குறிக்கிறது. தமிழில் மக்கள் குழுப் பெயர்களுடன் பன்மை விகுதியைத் தொடர்ந்து ‘-ஐயும்’ சேர்ப்பது இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָאֱמֹרִי
  choice: அமோரியர்களை
  rationale: எபிரெயத்தில் ஒருமை வடிவிலுள்ள இனப்பெயர் இங்கு ஒரு மக்கள் குழுவை ஒட்டுமொத்தமாகக் குறிக்கிறது; ஆகவே தமிழில் மரியாதை சாராத மனிதப் பன்மையாக ‘அமோரியர்கள்’ என்று வழங்கப்பட்டுள்ளது.
- source_word: הַכְּנַעֲנִי
  choice: கானானியர்களை
  rationale: கூட்டுப்பொருளுடைய எபிரெய ஒருமை இனப்பெயர், பட்டியலிலுள்ள மக்கள் குழுவைக் குறிக்கும் வகையில் இயல்பான தமிழ்ப் பன்மையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַגִּרְגָּשִׁי
  choice: கிர்காசியர்களை
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பை தமிழில் அண்மையாகக் காத்து, மக்கள் குழுவைக் காட்ட பன்மை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַיְבוּסִי
  choice: எபூசியர்களை
  rationale: மக்கள் குழுவைக் குறிக்கும் கூட்டொருமை இனப்பெயர் தமிழில் இயல்பான பன்மையாக வழங்கப்பட்டுள்ளது; வழக்கமான தமிழ் வேதாகமப் பெயர்வடிவமான ‘எபூசியர்’ பின்பற்றப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், முந்தைய வசனத்திலிருந்து தொடரும் செயப்படுபொருள் பட்டியலாகச் சுருக்கமாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. ஒவ்வொரு இனப்பெயரிலும் ‘-ஐயும்’ மீண்டும் வருவது எபிரெயத்தின் וְאֶת மீளுருவை இயல்பான தமிழில் பிரதிபலிக்கிறது.
