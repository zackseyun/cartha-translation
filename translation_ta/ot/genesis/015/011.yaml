base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/011.yaml
  text: And the birds of prey came down on the carcasses[a], and Abram drove them away.
translation:
  language: ta
  text: இரைப்பறவைகள் சடலங்களின்மேல் இறங்கி வந்தன[a]; அவற்றை ஆபிராம் விரட்டிவிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரைப்பறவை சடலங்களின்மேல் இறங்கி வந்தது.” எபிரெயச் சொல் இலக்கணத்தில் ஒருமையாக இருந்தாலும், பறவைகளைக் கூட்டாகக் குறிக்கலாம்; இங்கு அத்தகைய கூட்டுப் பொருளே அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: இறங்கி வந்தன
  rationale: ירד என்பது ‘கீழே இறங்கு/இறங்கி வா’ என்று பொருள்படும். பறவைகள் சடலங்களை நோக்கி வந்த இயக்கத்தை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது; எழுவாய் கூட்டுப் பொருளில் மொழிபெயர்க்கப்பட்டதால் வினை பன்மையில் உள்ளது.
- source_word: הָעַיִט
  choice: இரைப்பறவைகள்
  rationale: עַיִט என்பது இரையைப் பிடிக்கும் அல்லது இறந்த உடலைத் தின்னும் பறவைகளைக் குறிக்கும் பொதுப்பெயராகவும், ஒருமை வடிவிலுள்ள கூட்டுப்பெயராகவும் வரலாம். குறிப்பாக ‘கழுகுகள்’ அல்லது ‘பிணந்தின்னிப் பறவைகள்’ என்று சொல்வது மூலச்சொல்லைவிடக் குறுகிய பொருளைத் தரும்.
- source_word: הַפְּגָרִים
  choice: சடலங்கள்
  rationale: פֶּגֶר என்பது இறந்த உடல் அல்லது சடலம். இங்கு வெட்டப்பட்ட விலங்குகளின் உடல்களைக் குறிப்பதால் ‘சடலங்கள்’ துல்லியமாகவும் சுருக்கமாகவும் உள்ளது; ‘துண்டுகள்’ என்பது சொல்லின் பொருளை முழுமையாகத் தராது.
- source_word: וַיַּשֵּׁב אֹתָם
  choice: அவற்றை ... விரட்டிவிட்டான்
  rationale: שׁוב என்பதன் ஹிஃபில் வடிவம் இங்கு அவற்றைத் திரும்பிச் செல்லச் செய்தல், அதாவது அங்கிருந்து விரட்டுதல் என்ற பொருளைத் தருகிறது. ‘விரட்டிவிட்டான்’ என்பது ஆபிராமின் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אַבְרָם
  choice: ஆபிராம்
  rationale: இந்தக் கட்டத்தில் அவருடைய பெயர் இன்னும் ஆபிராம் என்பதே; பின்னர் வழங்கப்படும் ஆபிரகாம் என்ற பெயரை இங்கு முன்னதாகப் பயன்படுத்தவில்லை.
