  text: בַּ/יּ֣וֹם הַ/ה֗וּא כָּרַ֧ת יְהוָ֛ה אֶת אַבְרָ֖ם בְּרִ֣ית לֵ/אמֹ֑ר לְ/זַרְעֲ/ךָ֗ נָתַ֨תִּי֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/נְּהַ֣ר מִצְרַ֔יִם עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/018.yaml
  text: On that day Yahweh made a covenant with Abram[a], saying, “To your offspring I have given this land, from the river of Egypt as far as the great river[b], the Euphrates.”
translation:
  language: ta
  text: அந்நாளில் யாவே ஆபிராமுடன் ஓர் உடன்படிக்கை செய்தார்[a]. அவர், “எகிப்தின் ஆற்றிலிருந்து[b] பெரிய ஆறான யூபிராத்து வரை உள்ள இந்த நாட்டை உன் சந்ததிக்கு நான் கொடுத்திருக்கிறேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “உடன்படிக்கையை வெட்டினார்.” சுற்றியுள்ள பகுதியில் விவரிக்கப்படும் உடன்படிக்கைச் சடங்கை இந்த மொழிமரபு பிரதிபலிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “எகிப்தின் ஆறு” என்று எபிரெயம் கூறுகிறது. இது எந்த நீர்நிலையைக் குறிக்கிறது என்பது விவாதத்திற்குரியது; சிலர் இதை “எகிப்தின் ஓடை” அல்லது “எகிப்தின் வறண்ட பள்ளத்தாக்கு” என மொழிபெயர்க்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: அந்நாளில்
  rationale: குறிப்பிட்ட அந்த நிகழ்வு நடந்த காலத்தைக் குறிக்கும் இயல்பான, செம்மையான நவீனத் தமிழ் வடிவம்.
- source_word: כָּרַת ... בְּרִית
  choice: ஓர் உடன்படிக்கை செய்தார்
  rationale: எபிரெய மொழிமரபின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; சொல்லுக்குச் சொல் வடிவமான ‘உடன்படிக்கையை வெட்டினார்’ என்பது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்துக் காட்டுகிறது.
- source_word: לְזַרְעֲךָ
  choice: உன் சந்ததிக்கு
  rationale: זֶרַע என்பதன் கூட்டொருமைப் பொருளை இயல்பான தமிழில் தருகிறது; ஒருவரையோ பல தலைமுறையினரையோ தேவையின்றி தனித்துக் கட்டுப்படுத்தவில்லை.
- source_word: נָתַתִּי
  choice: நான் கொடுத்திருக்கிறேன்
  rationale: நிறைவேற்றப்பட்ட செயலைப்போல் உறுதியாக அறிவிக்கும் எபிரெய நிறைவுவினையின் உடன்படிக்கைச் சார்ந்த வலிமையைப் பாதுகாக்கிறது.
- source_word: הָאָרֶץ הַזֹּאת
  choice: இந்த நாடு
  rationale: நிலப்பரப்புக்கான வாக்குறுதி என்ற சூழலில் இயல்பான தமிழ்ச் சொல்.
- source_word: מִנְּהַר מִצְרַיִם
  choice: எகிப்தின் ஆற்றிலிருந்து
  rationale: נָהָר என்பதன் வழக்கமான பொருளான ‘ஆறு’ என்பதைக் கொண்ட நேரடியான மொழிபெயர்ப்பு.
- source_word: עַד הַנָּהָר הַגָּדֹל נְהַר פְּרָת
  choice: பெரிய ஆறாகிய யூபிராத்து ஆறுவரை
  rationale: எல்லையைக் குறிக்கும் עַד என்பதையும், ‘பெரிய ஆறு’ என்பதற்கு யூபிராத்து விளக்கப்பெயராக நிற்பதையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூலத்திற்குச் சார்ந்தது.
- issue: נָתַתִּי என்ற வினையின் காலம் மற்றும் உடன்படிக்கை வலிமை
  choice: நான் கொடுத்திருக்கிறேன்
  alternative: நான் கொடுக்கிறேன்; நான் கொடுத்தேன்
  rationale: நிறைவு வடிவம் வாக்குறுதியை உறுதியாக அளிக்கப்பட்ட ஒன்றாக முன்வைக்கலாம். இந்தத் தேர்வு வரலாற்று நிறைவேற்றத்தின் நேரத்தைத் தேவையின்றி முடிவு செய்யாமல் அந்த உறுதியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. உடன்படிக்கை மொழியின் விழுமியத்தையும் புவியியல் குறிப்பின் தெளிவின்மையையும் பாதுகாக்க அடிக்குறிப்புகள் சேர்க்கப்பட்டுள்ளன.
