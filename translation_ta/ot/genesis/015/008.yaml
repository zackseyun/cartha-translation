source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר אֲדֹנָ֣/י יֱהוִ֔ה בַּ/מָּ֥ה אֵדַ֖ע כִּ֥י אִֽירָשֶֽׁ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/008.yaml
  text: And he said[a], “Lord Yahweh, how will I know that I will possess it?”
translation:
  language: ta
  text: அவர், “ஆண்டவராகிய யாவே, நான் அதைச் சொந்தமாகப் பெறுவேன்[a] என்பதை எதனால் அறிவேன்?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் அதைச் சுதந்தரிப்பேன்.”
    reason: ירשׁ என்பதற்கு இச்சூழலில் ‘சொந்தமாகப் பெறுதல்/உடைமையாக்குதல்’ என்பதோடு ‘சுதந்தரித்தல்’ என்றும் பொருள் வரலாம்.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: அப்போது அவர் … என்றார்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை இயல்பான நவீனத் தமிழில் முன்னெடுக்கிறது; பேசுபவர் முந்தைய சூழலிலிருந்து தெளிவாகிறார்.
- source_word: אֲדֹנָי יֱהוִה
  choice: ஆண்டவராகிய யாவே
  rationale: אֲדֹנָי என்ற அதிகாரப் பட்டத்தையும் יהוה என்ற இறைப்பெயரையும் வேறுபடுத்திக் காக்கிறது; தமிழில் இயல்பான அழைப்புத் தொடராக உள்ளது.
- source_word: בַּמָּה
  choice: எதனால்
  rationale: சொல்லுக்கு நெருக்கமான ‘எதன் மூலம்?’ என்ற பொருளைத் தருகிறது; ஆபிராம் உறுதிப்படுத்தும் அடையாளம் அல்லது வழிமுறையைக் கேட்பதைத் தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: אֵדַע
  choice: அறிந்துகொள்வேன்
  rationale: ידע என்பதன் முதல் நபர் ஒருமை நிறைவுறா வடிவத்தின் எதிர்கால/விளைவு சார்ந்த கேள்விப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: என்பதை
  rationale: அறிய விரும்பும் செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இணைப்பாகத் தமிழில் இயல்பாக அமைகிறது.
- source_word: אִירָשֶׁנָּה
  choice: அதைச் சொந்தமாக்கிக்கொள்வேன்
  rationale: ירשׁ என்பதன் நிலத்தை உடைமையாக்குதல்/சுதந்தரித்தல் என்ற பொருள் வரம்பில், முந்தைய வசனத்தின் நிலத்தைக் குறிக்கும் பெண்பால் பின்னொட்டையும் உண்மையான உடைமைப் பெறுதலையும் தெளிவாகக் காட்டுகிறது; ‘சுதந்தரித்துக்கொள்வேன்’ என்ற உடன்படிக்கை நயமுள்ள மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: אֲדֹנָי יֱהוִה என்ற கூட்டுச் சொல்லில் இறைப்பெயரை மொழிபெயர்த்தல்
  choice: ஆண்டவராகிய யாவே
  alternative: ஆண்டவராகிய கர்த்தர்
  rationale: மூலத்தில் உள்ள பட்டத்தையும் தனிப்பட்ட இறைப்பெயரையும் ஒன்றாக்காமல் வெளிப்படையாகப் பாதுகாக்கிறது; குறிப்பிட்ட சமயப்பிரிவு சார்ந்த விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: ירשׁ என்பதன் உடைமை மற்றும் சுதந்தர நயங்கள்
  choice: சொந்தமாக்கிக்கொள்வேன்
  alternative: சுதந்தரித்துக்கொள்வேன்
  rationale: இங்கு வாக்குக்கொடுக்கப்பட்ட நிலத்தை உண்மையில் உடைமையாகப் பெறுவதே நேரடிப் பொருள்; அதேவேளை ‘சுதந்தரித்தல்’ என்ற செல்லத்தக்க உடன்படிக்கை நயம் அடிக்குறிப்பில் நிலைநிறுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘எதனால்’ மூலத்தின் வழிமுறை சார்ந்த கேள்வியைப் பாதுகாக்கிறது; ‘சொந்தமாக்கிக்கொள்வேன்’ நிலத்தைப் பெறும் பொருளைத் தெளிவாக்குகிறது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் இடம்பெற்றுள்ளது.
