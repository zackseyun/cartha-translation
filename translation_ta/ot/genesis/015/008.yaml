revisions:
- from: அப்போது அவர், “ஆண்டவராகிய யாவே, நான் அதைச் சொந்தமாக்கிக்கொள்வேன் என்பதை எதனால் அறிந்துகொள்வேன்?” என்றார்.[a]
  to: அவர், “ஆண்டவராகிய யாவே, நான் அதைச் சொந்தமாகப் பெறுவேன்[a] என்பதை எதனால் அறிவேன்?” என்றார்.
  rationale: The revision improves idiomatic modern Tamil, keeps the Hebrew’s request for a means of assurance (“எதனால்”), and retains the lexical inheritance alternative in a precisely anchored footnote. It also removes an unneeded temporal addition.
