source:
  edition: WLC
  text: וְ/אַתָּ֛ה תָּב֥וֹא אֶל אֲבֹתֶ֖י/ךָ בְּ/שָׁל֑וֹם תִּקָּבֵ֖ר בְּ/שֵׂיבָ֥ה טוֹבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/015.yaml
  text: As for you[a], you will go to your fathers in peace; you will be buried at a good old age.
translation:
  language: ta
  text: நீயோ சமாதானத்துடன் உன் தந்தையரிடம்[a] செல்வாய்; நல்ல முதிர்வயதில் அடக்கம் செய்யப்படுவாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் மூதாதையரிடம்.” எபிரெயத்தில் நேரடியாக “உன் தந்தையரிடம்” என்று உள்ளது; இது ஒருவர் இறந்து முந்தைய தலைமுறையினருடன் சேர்வதைக் குறிக்கும் வழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: நீயோ
  rationale: இணைப்புச்சொல்லுடன் வரும் தனிப்பட்ட சுட்டுப்பெயர், ஆபிராமின் சந்ததியினரிடமிருந்து ஆபிராமை நோக்கித் தலைப்பை மாற்றி அவரை வலியுறுத்துகிறது. நவீன தமிழில் “நீயோ” இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תָּבוֹא
  choice: செல்வாய்
  rationale: அடிப்படை வினை ‘வருதல்’ என்றாலும், ‘தந்தையரிடம்’ என்பதுடன் இங்கு மரணத்தைக் குறிக்கும் வழக்காக உள்ளது; தமிழில் “செல்வாய்” இயல்பான இயக்கத்தையும் இறப்பைக் குறிக்கும் மறைமுகப் பொருளையும் காக்கிறது.
- source_word: אֶל אֲבֹתֶיךָ
  choice: உன் தந்தையரிடம்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான குடும்ப உருவகத்தைப் பாதுகாக்கிறது. இது முன்னோரைக் குறிக்கும் மரண வழக்கு; “மூதாதையரிடம்” என்பது சாத்தியமான விளக்க மொழிபெயர்ப்பு.
- source_word: בְּשָׁלוֹם
  choice: சமாதானத்துடன்
  rationale: שָׁלוֹם என்பது அமைதி, நலம், முழுமை ஆகிய பொருள் பரப்பைக் கொண்டது. “சமாதானத்துடன்” சுருக்கமாகவும் மரியாதையான நடையிலும் மூலத்தின் விரிவை ஓரளவு காக்கிறது.
- source_word: תִּקָּבֵר
  choice: அடக்கம் செய்யப்படுவாய்
  rationale: קבר என்பதன் நிபால் வடிவம் அடக்கம் செய்யப்படுதலைக் குறிக்கும் நேரடியான செயப்பாட்டு வடிவம். இச்சொல் நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: நல்ல முதிர்வயதில்
  rationale: இச்சொற்றொடர் நேர்மறையான பொருளுடன் கூடிய நரைமுதிர்ந்த நீண்ட வயதைக் குறிக்கிறது. “நல்ல முதிர்வயதில்” காலச் சார்பையும் טוֹבָה என்பதன் நன்மதிப்பையும் காக்கிறது.
theological_decisions:
- issue: ‘உன் தந்தையரிடம் செல்வாய்’ என்பதன் பொருள்
  choice: ஆபிராம் இறந்து முந்தைய தலைமுறையினருடன் சேர்வதைக் குறிக்கும் வழக்கை அப்படியே வைத்தல்
  alternative: மூதாதையருடன் உடலடக்கம் செய்யப்படுதல் என்ற குறிப்பிட்ட பொருள், அல்லது மரணத்திற்குப் பின் அவர்களுடன் உணர்வுள்ள உறவு என்ற வலுவான கூற்று
  rationale: ஆபிராம் தமது உடனடி முன்னோர்களுடன் ஒரே இடத்தில் அடக்கம் செய்யப்படவில்லை என்பதால், இது உடலடக்கத்தை மட்டும் குறிக்காது. அதேவேளை, மரணத்திற்குப் பிந்தைய நிலை குறித்த விரிவான கோட்பாட்டையும் வசனம் வெளிப்படையாக நிர்ணயிக்கவில்லை. எனவே மூலத்தின் இறையியல் நெருக்கடியும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதையான வேதாகம நடையைப் பயன்படுத்துகிறது. “நீயோ” தலைப்பு மாற்றத்தை இயல்பாகக் காட்டுகிறது; “தந்தையரிடம் செல்வாய்” என்ற மூல உருவகம் அடிக்குறிப்பு விளக்கத்துடன் பாதுகாக்கப்படுகிறது.
