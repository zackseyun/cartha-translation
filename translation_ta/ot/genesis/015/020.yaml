lexical_decisions:
- source_word: וְאֶת
  choice: -ஐயும் / -ரையும்
  rationale: וְ தொடரும் பட்டியலில் ஒவ்வொரு மக்கள் குழுவையும் இணைக்கிறது; אֵת நேரடி செயப்படுபொருளைக் குறிக்கிறது. தமிழில் இவ்விரண்டின் பொருளும் இயல்பாக ‘-ஐயும் / -ரையும்’ என்ற வேற்றுமை இணைப்பால் வெளிப்படுகிறது.
- source_word: הַחִתִּי
  choice: இத்தியர்
  rationale: எபிரெயில் ஒருமை வடிவிலிருந்தாலும், இங்கு இது ஒரு மக்கள் குழுவைக் கூட்டாகக் குறிக்கிறது; அதனால் தமிழில் மரியாதைப் பன்மை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַפְּרִזִּי
  choice: பெரிசியர்
  rationale: இந்த இனப்பெயரும் எபிரெயில் ஒருமை வடிவில் கூட்டுப் பொருளைக் கொண்டது; தமிழில் மக்கள் குழுவைக் குறிக்கும் பன்மை வடிவமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הָרְפָאִים
  choice: ரெப்பாயீமியர்
  rationale: நிலத்தில் வாழ்ந்த மக்களின் பட்டியலாகிய இச்சூழலில் இது இனப்பெயராக இருப்பது மிகப் பொருத்தமானது. ‘ராட்சதர்கள்’ என்ற விளக்கப் பொருளை முதன்மை உரையில் புகுத்தாமல், பெயரின் தன்மை ஒலிபெயர்ப்பால் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: רְפָאִים என்பதை இனப்பெயராகக் கொள்வதா அல்லது உடல் தன்மையை விவரிக்கும் சொல்லாகக் கொள்வதா
  choice: ‘ரெப்பாயீமியர்’ என்ற இனப்பெயராக வழங்கப்பட்டது
  alternative: ‘ராட்சதர்கள்’
  rationale: ஆதியாகமம் 15:19–21 வாக்குத்தத்த நாட்டில் வாழ்ந்த மக்கள் குழுக்களைப் பட்டியலிடுகிறது. எனவே இங்கு இனப்பெயர் என்ற வாசிப்பே சூழலுக்கு மிகவும் பொருந்துகிறது; வேறு சூழல்களில் காணப்படும் ‘ராட்சதர்கள்’ என்ற தொடர்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், தொடரும் மக்கள் பட்டியலுக்கேற்ற சுருக்கமான நடையும் ஒவ்வொரு இனப்பெயருக்கும் ‘-ரையும்’ என்ற இணையான அமைப்பும் பயன்படுத்தப்பட்டுள்ளன. வசனம் அடுத்த பட்டியல் உறுப்புக்குத் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
