  yaml_path: translation/ot/genesis/015/014.yaml
  text: But I will also judge the nation that they serve[b][a], and afterward they will come out with great possessions.
translation:
  language: ta
  text: ஆனால், அவர்கள் பணிசெய்யும்[a] தேசத்தையும் நான் நியாயந்தீர்ப்பேன்; அதற்குப் பிறகு அவர்கள் மிகுந்த உடைமைகளுடன்[b] வெளியே வருவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள் அடிமைகளாகப் பணிசெய்யும்’; எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் ‘பணிசெய்’ என்பதாகும். ஆனால் இச்சூழலில் அது ஓர் அந்நிய தேசத்தின்கீழ் கட்டாயமாகப் பணிசெய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மிகுந்த செல்வத்துடன்’ அல்லது ‘ஏராளமான பொருட்களுடன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: ஆனால் ... தேசத்தையும்
  rationale: וְ தொடர்ச்சியையும் גַם சேர்த்துக் கூறும் வலியுறுத்தலையும் தருகிறது. முந்தைய வசனத்தில் கூறப்பட்ட ஒடுக்குதலுடன் உள்ள கருத்து வேறுபாட்டை ‘ஆனால்’ காட்டுகிறது; ‘-யும்’ அதன் சேர்த்துக் கூறும் பொருளைக் காக்கிறது.
- source_word: הַגּוֹי
  choice: தேசம்
  rationale: גּוֹי என்பது பொதுவாக ஒரு தேசத்தையோ மக்களினத்தையோ குறிக்கும். இங்கு ஆபிராமின் சந்ததியார் பணிசெய்யும் அந்நிய அரசியல் சமூகத்தை ‘தேசம்’ நேரடியாகக் குறிக்கிறது.
- source_word: אֲשֶׁר יַעֲבֹדוּ
  choice: அவர்கள் பணிசெய்யும்
  rationale: עבד என்பதன் அடிப்படைப் பொருள் ‘பணிசெய்/சேவைசெய்’ என்பதாகும். சூழலில் இது கட்டாய உழைப்பைக் குறித்தாலும், மூலத்தின் வெளிப்படையான சொல்லாட்சியை முதன்மை உரை பாதுகாக்கிறது.
- source_word: דָּן אָנֹכִי
  choice: நான் நியாயந்தீர்ப்பேன்
  rationale: דָּן என்பது நீதித்துறை சார்ந்த ‘நியாயந்தீர்’ என்ற பொருளைக் கொண்டது; אָנֹכִי முதலாம் நபரை வலியுறுத்துகிறது. சூழல் எதிர்காலச் செயலைக் குறிப்பதால் எதிர்கால வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְאַחֲרֵי כֵן
  choice: அதற்குப் பிறகு
  rationale: இச்சொற்றொடர் நிகழ்வுகளின் காலவரிசையைத் தெளிவாகக் காட்டுகிறது; தமிழில் இயல்பான சமமான தொடர் இது.
- source_word: יֵצְאוּ
  choice: அவர்கள் வெளியே வருவார்கள்
  rationale: יצא என்பது ‘வெளியே போ/வா’ என்று பொருள்படும். அடிமைத்தனத்திலிருந்து புறப்படுவதைத் தமிழில் ‘வெளியே வருவார்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בִּרְכֻשׁ גָּדוֹל
  choice: மிகுந்த உடைமைகளுடன்
  rationale: רְכוּשׁ என்பது சொத்து, பொருட்கள், உடைமைகள் ஆகியவற்றைக் குறிக்கிறது. ‘உடைமைகள்’ அதன் திடப்பொருள் சார்ந்த பரப்பைக் காக்கிறது; גָּדוֹל இங்கு அளவைக் குறிப்பதால் ‘மிகுந்த’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ஒடுக்கும் தேசத்தின்மீது வரும் இறைத் தீர்ப்பின் தன்மை
  choice: நியாயந்தீர்ப்பேன்
  alternative: தண்டிப்பேன்
  rationale: דָּן நீதித்துறை சார்ந்த மொழியாகும். ‘நியாயந்தீர்ப்பேன்’ என்பது சட்ட மற்றும் ஒழுக்கத் தீர்ப்பின் நுணுக்கத்தைப் பாதுகாக்கிறது; தீர்ப்பின் விளைவை மட்டும் முன்னிறுத்தும் ‘தண்டிப்பேன்’ என்பதைப் போல பொருளைச் சுருக்குவதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நியாயந்தீர்ப்பேன்’ என்ற வேதாகமப் பயன்பாட்டிற்கு ஏற்ற, இன்னும் புரிந்துகொள்ளக்கூடிய சொல் நீதித்துறை நுணுக்கத்தைப் பாதுகாக்கிறது. அடிமைத்தனம் என்ற சூழல் அடிக்குறிப்பில் தெளிவாக்கப்பட்டாலும், மூல எபிரெயத்தின் ‘பணிசெய்’ என்ற சொல்லாட்சி முதன்மை உரையில் காக்கப்பட்டுள்ளது.
