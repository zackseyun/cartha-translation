- from: அப்போது அவர் ஆபிராமிடம், “உன் சந்ததியினர் தங்களுக்குச் சொந்தமல்லாத ஒரு நாட்டில் அந்நியக் குடியிருப்பாளர்களாக[a] இருப்பார்கள் என்பதை நீ உறுதியாக அறிந்துகொள். அங்கே அவர்கள் அடிமைப்படுத்தப்பட்டு ஒடுக்கப்படுவார்கள்[b]—நானூறு ஆண்டுகள்,” என்றார்.
  to: அப்போது அவர் ஆபிராமிடம், “உன் சந்ததியினர் தங்களுக்குச் சொந்தமல்லாத ஒரு நாட்டில் அந்நியர்களாக[a] வாழ்வார்கள் என்பதை நீ உறுதியாக அறிந்துகொள். அவர்கள் அந்நாட்டினருக்குப் பணிசெய்வார்கள்[b]; அந்நாட்டினர் அவர்களை நானூறு ஆண்டுகள் ஒடுக்குவார்கள்,” என்றார்.
  rationale: The revision corrects the source-form error concerning וַעֲבָדוּם, distinguishes service from subsequent affliction, and expresses the contextually supplied referents naturally and explicitly in Tamil. It also removes the dangling duration while retaining the stated four hundred years. No disputed theological interpretation is introduced.
