review_pass:
  verdict: revise
  source_fidelity: 'The draft''s passive rendering conveys the broad outcome but obscures the Hebrew verbal sequence. In the WLC, וַעֲבָדוּם is Qal, ‘they will serve them,’ not the causative ‘they will enslave them.’ The following וְעִנּוּ אֹתָם has the foreign people as its contextually inferred subject: they will afflict Abram’s offspring. Rendering the two clauses distinctly better reflects the source while making the referents clear in Tamil.'
  naturalness: ‘அந்நியக் குடியிருப்பாளர்கள்’ is understandable but bureaucratic in modern Tamil. ‘அந்நியர்களாக வாழ்வார்கள்,’ supported by a note, is more idiomatic. The draft’s final dash followed by ‘நானூறு ஆண்டுகள்’ is syntactically suspended and unnatural; attaching the duration to the oppression clause is clear and faithful to the Hebrew word order and sense.
  terminology: ‘சந்ததியினர்,’ ‘தங்களுக்குச் சொந்தமல்லாத நாடு,’ and ‘ஒடுக்குதல்’ are suitable. ‘பணிசெய்வார்கள்’ accurately represents the non-causative Hebrew verb without prematurely specifying a particular institution of servitude.
  issues:
  - severity: high
    issue: The footnote and lexical decision treat וַעֲבָדוּם as ‘they will make them serve/enslave them.’
    rationale: The pointed WLC form is Qal (‘they will serve them’), not Hiphil (‘they will cause them to serve’). The translation and note should preserve the distinction.
  - severity: medium
    issue: The duration is detached with an em dash.
    rationale: ‘ஒடுக்கப்படுவார்கள்—நானூறு ஆண்டுகள்’ is incomplete-sounding Tamil. It should be integrated into the clause.
  - severity: low
    issue: ‘அந்நியக் குடியிருப்பாளர்கள்’ has an administrative register.
    rationale: A more natural wording can retain the resident-foreigner nuance through a footnote.
  revised_text: அப்போது அவர் ஆபிராமிடம், “உன் சந்ததியினர் தங்களுக்குச் சொந்தமல்லாத ஒரு நாட்டில் அந்நியர்களாக[a] வாழ்வார்கள் என்பதை நீ உறுதியாக அறிந்துகொள். அவர்கள் அந்நாட்டினருக்குப் பணிசெய்வார்கள்[b]; அந்நாட்டினர் அவர்களை நானூறு ஆண்டுகள் ஒடுக்குவார்கள்,” என்றார்.
