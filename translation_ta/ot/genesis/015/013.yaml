base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/013.yaml
  text: Then he said to Abram[a], “Know for certain that your offspring will be sojourners in a land not theirs[c][b], and they will enslave them and afflict them four hundred years.”
translation:
  language: ta
  text: அப்போது அவர் ஆபிராமிடம், “உன் சந்ததியினர் தங்களுக்குச் சொந்தமல்லாத ஒரு நாட்டில் அந்நியர்களாக[a] வாழ்வார்கள் என்பதை நீ உறுதியாக அறிந்துகொள். அவர்கள் அந்நாட்டினருக்குப் பணிசெய்வார்கள்[b]; அந்நாட்டினர் அவர்களை நானூறு ஆண்டுகள் ஒடுக்குவார்கள்,” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வேற்று நாட்டில் குடியிருப்பவர்களாக.’ எபிரெயச் சொல் தமக்குச் சொந்தமல்லாத நாட்டில் அந்நியர்களாக வாழ்பவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அவர்கள் அவர்களுக்குப் பணிசெய்வார்கள்.’ அடுத்த வினைச்சொல்லில், ஆபிராமின் சந்ததியினரை ஒடுக்குவோர் அந்நாட்டினர் என்பதைக் சூழல் காட்டுகிறது.
    reason: source_form
lexical_decisions:
- source_word: יָדֹעַ תֵּדַע
  choice: நீ உறுதியாக அறிந்துகொள்
  rationale: வினையெச்சப் பெயருடன் அதே வேருடைய வினை வருவது அறிதலின் உறுதியை வலியுறுத்துகிறது. இச்சொற்றொடர் அந்த வலியுறுத்தலை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: גֵר
  choice: அந்நியக் குடியிருப்பாளர்கள்
  rationale: தங்களுக்குச் சொந்தமல்லாத நாட்டில், அந்த நாட்டின் பூர்வகுடிகளாக அல்லாமல் வாழ்பவர்களை இச்சொல் குறிக்கிறது. ‘அந்நியர்’ மட்டும் தராத குடியிருப்பு நுணுக்கத்தையும் இத்தேர்வு வெளிப்படுத்துகிறது.
- source_word: זַרְעֲךָ
  choice: உன் சந்ததியினர்
  rationale: எபிரெயச் சொல் ஒருமை வடிவிலுள்ள கூட்டுப்பெயர். தமிழில் மக்களைக் குறிக்கும் இயல்பான கூட்டுப் பொருளை ‘சந்ததியினர்’ தெளிவாகத் தருகிறது.
- source_word: בְּאֶרֶץ לֹא לָהֶם
  choice: தங்களுக்குச் சொந்தமல்லாத ஒரு நாட்டில்
  rationale: அந்த நாடு அவர்களுக்குரியது அல்ல என்ற மூலத்தின் சொந்தமின்மைப் பொருளை நேராகவும் இயல்பாகவும் தருகிறது.
- source_word: וַעֲבָדוּם
  choice: அவர்கள் அடிமைப்படுத்தப்படுவார்கள்
  rationale: மூலத்தில் பன்மை எழுவாயும் பன்மை செயப்படுபொருளும் உள்ளன; சூழலில் அந்த நாட்டினர் ஆபிராமின் சந்ததியினரை வலுக்கட்டாயமாகப் பணியச் செய்வது பொருள். தமிழில் குழப்பத்தைத் தவிர்க்கச் செயப்பாட்டு வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְעִנּוּ אֹתָם
  choice: ஒடுக்கப்படுவார்கள்
  rationale: பியேல் வடிவிலுள்ள ענה கடுமையாக நடத்துதல், துன்புறுத்துதல், ஒடுக்குதல் ஆகிய பொருள்களைத் தருகிறது. சமூக வன்முறையின் பரந்த பொருளை ‘ஒடுக்கப்படுவார்கள்’ இயல்பாகக் கொண்டுவருகிறது.
- source_word: אַרְבַּע מֵאוֹת שָׁנָה
  choice: நானூறு ஆண்டுகள்
  rationale: மூலத்தில் முன்னிடைச்சொல் இல்லாமல் கால அளவு இறுதியில் வருகிறது. அதே இறுதி அமைப்பைத் தக்கவைத்து, அதன் தொடர்பில் உள்ள சாத்தியமான பரப்பை மிகையாகத் தீர்மானிக்காமல் விடுகிறது.
- source_word: וַיֹּאמֶר לְאַבְרָם
  choice: அப்போது அவர் ஆபிராமிடம் … என்றார்
  rationale: தொடர்கதை முன்னேற்றத்தை ‘அப்போது’ காட்டுகிறது; தமிழ் மேற்கோள் அமைப்புக்கேற்ப ‘என்றார்’ இறுதியில் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘அடிமைப்படுத்தி ஒடுக்குவார்கள்’ என்பதன் பன்மை எழுவாய் யார்?
  choice: அந்நாட்டின் மக்கள் ஆபிராமின் சந்ததியினரை அடிமைப்படுத்தி ஒடுக்குவார்கள் என்ற பொருளைச் செயப்பாட்டு வடிவில் தெரிவித்தல்
  alternative: ஒடுக்குவோர் யார் என்பதை முற்றிலும் குறிப்பிடாத பன்மைச் செயப்படுவினை அமைப்பு
  rationale: எபிரெயத்தில் ஒடுக்குவோர் பெயரிட்டு அடையாளப்படுத்தப்படவில்லை; எனினும் ஆபிராமின் சந்ததியினர் செயப்படுபொருளாக வருகிறார்கள். செயப்பாட்டு தமிழ், ஒடுக்குவோரை மூலத்தைவிடத் துல்லியமாகப் பெயரிடாமல் இந்த உறவைத் தெளிவாக்குகிறது.
- issue: ‘நானூறு ஆண்டுகள்’ என்பதன் தொடர்பு
  choice: கால அளவை வாக்கியத்தின் முடிவில் தனித்த வலியுறுத்தலுடன் வைத்தல்
  alternative: ‘நானூறு ஆண்டுகளுக்கு அடிமைப்படுத்தப்பட்டு ஒடுக்கப்படுவார்கள்’ என்று ஒடுக்குதலோடு மட்டும் வெளிப்படையாக இணைத்தல்
  rationale: எபிரெயத்தில் கால அளவு இறுதியில் நிற்கிறது; அது முந்திய நிலைகளின் காலப்பரப்புடன் எவ்வாறு இணைகிறது என்பதில் உள்ள அமைப்புசார் நெகிழ்வை மொழிபெயர்ப்பு தேவையின்றி குறுக்கவில்லை.
translation_notes:
  register: நவீனச் செந்தமிழை அடிப்படையாகக் கொண்ட, பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடை. ‘அந்நியக் குடியிருப்பாளர்கள்’ என்பது சட்டத் துறைச் சொல்லாகத் தோன்றாமல் גֵר என்பதின் குடியிருப்பு நுணுக்கத்தை வெளிப்படுத்துகிறது. மூலத்தின் செய்பாட்டு வடிவத்தால் தமிழில் உருவாகும் பிரதிப்பெயர் குழப்பத்தைத் தவிர்க்கச் செயப்பாட்டு அமைப்பு பயன்படுத்தப்பட்டுள்ளது; அதற்கான மூல வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
