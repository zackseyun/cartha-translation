source:
  edition: WLC
  text: וְ/ד֥וֹר רְבִיעִ֖י יָשׁ֣וּבוּ הֵ֑נָּה כִּ֧י לֹא שָׁלֵ֛ם עֲוֺ֥ן הָ/אֱמֹרִ֖י עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/016.yaml
  text: And in the fourth generation they will return here[b][a], for the iniquity of the Amorites is not yet complete.
translation:
  language: ta
  text: நான்காம் தலைமுறையில் அவர்கள் இங்கே திரும்பிவருவார்கள்; ஏனெனில் எமோரியர்களின்[a] அக்கிரமம் அதுவரை இன்னும் முழுமை அடைந்திருக்காது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, ‘எமோரியனின்’; இங்கு ஒருமை வடிவம் எமோரிய மக்கள் இனத்தைத் தொகுப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அதுவரை’ என்பதற்கான எபிரேயச் சொற்றொடர் சொற்படியாக ‘இங்கே வரை’ எனப் பொருள்படும். இச்சூழலில், எமோரியர்களின் அக்கிரமம் அந்தக் காலம்வரை அதன் முழு அளவை அடைந்திருக்காது என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדֹור רְבִיעִי
  choice: நான்காம் தலைமுறையில்
  rationale: דּוֹר என்பது ‘தலைமுறை’ என்றும் רְבִיעִי என்பது ‘நான்காம்’ என்றும் பொருள்படும். தமிழில் இலக்கை நோக்கிய மீள்வருகையின் காலத்தை இயல்பாகக் குறிக்க ‘நான்காம் தலைமுறையில்’ என வழங்கப்படுகிறது; தொடக்க வாவை தனியே ‘மேலும்’ என்று மொழிபெயர்ப்பது அவசியமில்லை.
- source_word: יָשׁוּבוּ
  choice: அவர்கள் திரும்பிவருவார்கள்
  rationale: שׁוּב இச்சூழலில் மீண்டும் இந்நாட்டுக்கு வருவதைக் குறிக்கிறது. ‘திரும்பிவருவார்கள்’ என்பது இயக்கத்தையும் மீள்வருகையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֵנָּה
  choice: இங்கே
  rationale: பேசுபவர் சுட்டும் இடத்தை நோக்கிய இயக்கத்தைக் குறிக்கும் இடவினையடை; ‘இங்கே’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: மீள்வருகை தாமதமாவதற்கான காரணத்தை அறிமுகப்படுத்துவதால் காரணவியல் தொடர்பு தெளிவாகப் பாதுகாக்கப்படுகிறது.
- source_word: לֹא שָׁלֵם
  choice: இன்னும் முழுமை அடைந்திருக்காது
  rationale: שָׁלֵם இங்கு நிறைவு அல்லது முழு அளவை அடைதலைக் குறிக்கிறது. எதிர்காலச் சூழலில் עַד הֵנָּה உடன் சேர்ந்து ‘அதுவரை இன்னும் ... அடைந்திருக்காது’ என்பது காலத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲוֹן
  choice: அக்கிரமம்
  rationale: עָוֹן என்பது அக்கிரமம், குற்றம் அல்லது குற்றப்பழி ஆகிய நுண்பொருள்களைக் கொள்ளலாம். இங்கு மக்களின் ஒழுக்கத் தீமை முழு அளவை இன்னும் அடையாததாகச் சொல்லப்படுவதால் ‘அக்கிரமம்’ பொருத்தமானது; தண்டனை என்ற பொருளை மொழிபெயர்ப்பில் திணிக்கவில்லை.
- source_word: הָאֱמֹרִי
  choice: எமோரியர்களின்
  rationale: எபிரெயத்தில் ஒருமை வடிவம் இருந்தாலும் ஒரு மக்கள் இனத்தைத் தொகுப்பாகக் குறிக்க முடியும். நவீன தமிழில் இனக்குழுவை இயல்பாகச் சுட்ட பன்மை பயன்படுத்தப்படுகிறது; சொற்படியான ஒருமை அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַד הֵנָּה
  choice: அதுவரை
  rationale: சொற்படியாக ‘இங்கே வரை’ என இருந்தாலும், முன்னறிவிக்கப்பட்ட நான்காம் தலைமுறையின் காலப்புள்ளியை இச்சூழலில் குறிக்கிறது. அதன் சொற்படியான வடிவமும் காலம் சார்ந்த நுண்மையும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: நியாயத்தீர்ப்பின் தாமதமும் ஆபிராமின் சந்ததியாரின் மீள்வருகையும்
  choice: எமோரியர்களின் அக்கிரமம் முழுமை அடையாததே அவர்கள் நான்காம் தலைமுறை வரை திரும்பாததற்குத் தரப்பட்ட காரணம் என மொழிபெயர்க்கப்பட்டது.
  alternative: இந்தத் தாமதம் தேவனுடைய பொறுமையை முதன்மையாக வலியுறுத்துகிறது; அல்லது இஸ்ரவேல் எகிப்தில் உருவாக்கப்படுவதற்காகவே முதன்மையாக அமைந்தது.
  rationale: வசனம் வெளிப்படையாகக் கூறும் காரணத்தை மட்டும் மொழிபெயர்ப்பு முன்வைக்கிறது. தெய்வீகப் பொறுமை அல்லது இஸ்ரவேலின் உருவாக்கம் போன்ற விரிவான இறையியல் விளக்கங்களை உரைக்குள் சேர்க்காமல், அக்கிரமத்தின் ‘முழுமை’ குறித்த பதற்றத்தை அப்படியே வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அக்கிரமம்’, ‘முழுமை அடைதல்’ ஆகியவை மூலத்தின் ஒழுக்க மற்றும் அளவுசார் நுண்மையைப் பாதுகாக்கின்றன. எமோரியர் என்ற ஒருமைத் தொகுப்புப் பயன்பாடும் עַד הֵנָּה என்பதன் சொற்படியான வடிவமும் அடிக்குறிப்புகளில் தெளிவுபடுத்தப்பட்டுள்ளன.
