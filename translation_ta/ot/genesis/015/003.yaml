  text: וַ/יֹּ֣אמֶר אַבְרָ֔ם הֵ֣ן לִ֔/י לֹ֥א נָתַ֖תָּה זָ֑רַע וְ/הִנֵּ֥ה בֶן בֵּיתִ֖/י יוֹרֵ֥שׁ אֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/003.yaml
  text: Then Abram said[a], “Behold, you have given me no offspring, and behold[b], a son of my household will inherit me.”
translation:
  language: ta
  text: அப்போது ஆபிராம், “இதோ, நீர் எனக்குச் சந்ததி[a] கொடுக்கவில்லை; இதோ, என் வீட்டைச் சேர்ந்த ஒருவனே எனக்கு வாரிசாவான்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சந்ததி” என்பதற்கான எபிரெயச் சொல் நேரடியாக “விதை” என்று பொருள்படும்; இங்கே அது பிள்ளை அல்லது வழித்தோன்றலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் நேரடியாக, “என் வீட்டின் மகன் என்னைச் சுதந்தரிக்கிறான்” என்று உள்ளது; பொருள்பட, “எனக்கு வாரிசாகிறான்” அல்லது “என் வாரிசாவான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ்-தொடர்வினை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; நவீன தமிழில் இயல்பான நிகழ்வரிசையை இது வெளிப்படுத்துகிறது.
- source_word: הֵן / וְהִנֵּה
  choice: இதோ / இதோ
  rationale: இரு கவன ஈர்ப்புச் சொற்களும் ஆபிராமின் முறையீட்டை வலியுறுத்துகின்றன; அவற்றின் சொல்லாட்சிச் சமநிலையைத் தமிழிலும் காக்கிறது.
- source_word: לִי לֹא נָתַתָּה
  choice: நீர் எனக்குக் ... கொடுக்கவில்லை
  rationale: தேவனை நோக்கிய ஒருமை மரியாதை வடிவமான ‘நீர்’ இயல்பான, கண்ணியமான தமிழைத் தருகிறது; இதுவரை சந்ததி அளிக்கப்படவில்லை என்ற முறையீட்டையும் தெளிவாக்குகிறது.
- source_word: זָרַע
  choice: சந்ததி
  rationale: சொல்லின் நேர்ப்பொருள் ‘விதை’ என்றாலும், இங்கு அது பிள்ளை அல்லது வழித்தோன்றலைக் குறிக்கிறது; ‘சந்ததி’ அதன் ஒருமை-கூட்டுப்பொருள் நெகிழ்வைத் தக்கவைக்கிறது.
- source_word: בֶן בֵּיתִי
  choice: என் வீட்டைச் சேர்ந்த ஒருவன்
  rationale: நேரடியாக ‘என் வீட்டின் மகன்’ என்றுள்ள எபிரெயச் சொற்றொடர், ஆபிராமின் வீட்டாரைச் சேர்ந்த நபரைக் குறிக்கிறது. தமிழில் இயல்பில்லாத சொற்சொல் மொழிபெயர்ப்பைத் தவிர்த்தும், அடிமை என்ற சமூக நிலையை வசனத்தில் சேர்க்காமலும் இத்தேர்வு அமைகிறது.
- source_word: יוֹרֵשׁ אֹתִי
  choice: எனக்கு வாரிசாவான்
  rationale: எபிரெயத்தில் நேரடியாக ‘என்னைச் சுதந்தரிக்கிறவன்’ என்று இருந்தாலும், ஆபிராமின் சொத்து அல்லது குடும்பத் தொடர்ச்சிக்குரிய வாரிசு என்பதே தமிழில் புரியத்தக்க பொருள். நிகழப்போகும் விளைவை ‘வாரிசாவான்’ இயல்பாக வெளிப்படுத்துகிறது; நேரடி அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ஆபிராமின் வீட்டைச் சேர்ந்த வாரிசின் சமூக நிலை
  choice: என் வீட்டைச் சேர்ந்த ஒருவன்
  alternative: என் வீட்டில் பிறந்த அடிமை / என் வீட்டின் மகன்
  rationale: இந்த வசனம் அவனை வெளிப்படையாக ‘அடிமை’ என்று அழைக்காமல் ‘என் வீட்டின் மகன்’ என்கிறது. ஆகவே உரையில் இல்லாத குறிப்பிட்ட சமூக நிலையை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: יוֹרֵשׁ אֹתִי என்பதிலுள்ள ‘என்னைச் சுதந்தரித்தல்’ என்ற உருவகம்
  choice: எனக்கு வாரிசாவான்
  alternative: என்னைச் சுதந்தரித்துக்கொள்வான்
  rationale: நேரடி எபிரெய அமைப்பைத் தமிழில் அப்படியே கொடுத்தால் தவறாகவோ இயல்பற்றதாகவோ புரியலாம். முதன்மை உரை பொருளை இயல்பாகத் தருகிறது; மூலத்தின் உருவகமும் நிகழ்காலப் பங்கேற்புவினை நுணுக்கமும் அடிக்குறிப்பில் குறிப்பிடப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கி ‘நீர்’ என்ற மரியாதை ஒருமை கையாளப்பட்டுள்ளது. இருமுறை வரும் கவன ஈர்ப்புச் சொற்கள் ‘இதோ’ என்று ஒரேபோல மொழிபெயர்க்கப்பட்டு மூலத்தின் வலியுறுத்தல் காக்கப்பட்டுள்ளது.
