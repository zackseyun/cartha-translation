source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/שֶּׁ֨מֶשׁ֙ לָ/ב֔וֹא וְ/תַרְדֵּמָ֖ה נָפְלָ֣ה עַל אַבְרָ֑ם וְ/הִנֵּ֥ה אֵימָ֛ה חֲשֵׁכָ֥ה גְדֹלָ֖ה נֹפֶ֥לֶת עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/012.yaml
  text: As the sun was going down[a], a deep sleep fell upon Abram. And behold[b], a great dark dread fell upon him.
translation:
  language: ta
  text: சூரியன் மறைந்துகொண்டிருந்தபோது, ஆபிராம்மேல் ஆழ்ந்த உறக்கம்[a] விழுந்தது. இதோ, இருள் சூழ்ந்த பெரும் திகில் அவர்மேல் கவிந்துகொண்டிருந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆபிராம்மேல் ஒரு மயக்கநிலை விழுந்தது.” எபிரெயச் சொல் வழக்கத்திற்கு மாறாக ஆழமான, ஒருவேளை இறைவனால் உண்டாக்கப்பட்ட உறக்கத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பெரும் இருளின் திகில்” அல்லது “இருண்ட பெரும் திகில்.” எபிரெயத் தொடர் திகில் மற்றும் இருள் ஆகிய கருத்துகளைச் செறிவாக இணைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ לָבוֹא
  choice: சூரியன் மறைந்துகொண்டிருந்தபோது
  rationale: היה உடன் வரும் בוא என்ற வினையெச்ச அமைப்பு சூரியன் மறையும் நிலையை நோக்கிச் சென்றுகொண்டிருந்த காலச்சூழலைக் குறிக்கிறது. தமிழில் இது இயல்பாகவும் தொடர்நிலை உணர்வுடனும் அமைகிறது.
- source_word: תַרְדֵּמָה
  choice: ஆழ்ந்த உறக்கம்
  rationale: இச்சொல் மிக ஆழமான, சில சூழல்களில் இறைவனால் உண்டாக்கப்பட்டதாக இருக்கக்கூடிய உறக்கத்தைக் குறிக்கிறது. ‘மயக்கநிலை’ என்பது சாத்தியமானாலும் அதிக விளக்கத்தைச் சேர்க்கும்; ஆகவே அது அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: נָפְלָה עַל אַבְרָם
  choice: ஆபிராம்மேல் … விழுந்தது
  rationale: נפל על என்பதிலுள்ள ‘மேல் விழுதல்’ என்ற எபிரெய உருவகத்தைத் தமிழிலும் காக்கிறது; அதேவேளை வாக்கியம் புரிந்துகொள்ளத்தக்கதாக உள்ளது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה தரும் திடீர் கவன ஈர்ப்பையும் காட்சியின் விறுவிறுப்பையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: இருள் சூழ்ந்த பெரும் திகில்
  rationale: אֵימָה என்பது கடும் அச்சம் அல்லது திகில்; חֲשֵׁכָה என்பது இருள்; גְדֹלָה அதன் தீவிரத்தை உயர்த்துகிறது. எபிரெயில் இவை செறிவான, உறவு முழுமையாக விளக்கப்படாத தொடராக உள்ளன. வாசிக்கத்தக்க தமிழில் அவற்றின் இருள்–திகில் இணைப்பை இவ்வாறு காத்து, பிற சாத்தியங்களை அடிக்குறிப்பில் தருகிறது.
- source_word: נֹפֶלֶת עָלָיו
  choice: அவர்மேல் கவிந்துகொண்டிருந்தது
  rationale: நிகழ்காலப் பெயரெச்சத்தின் தொடரும், கண்முன் நிகழ்வதுபோன்ற உயிரோட்டத்தை ‘கொண்டிருந்தது’ காக்கிறது. ‘கவிதல்’ இருளும் திகிலும் ஒருவர்மேல் இறங்கும் உருவகத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אַבְרָם
  choice: ஆபிராம்
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்பட்ட பெயர் வடிவம் பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: வெளிப்பாட்டு சூழலில் תַּרְדֵּמָה என்பதன் இயல்பு
  choice: ஆழ்ந்த உறக்கம்
  alternative: மயக்கநிலை
  rationale: உடன்படிக்கையும் தரிசனமும் சார்ந்த சூழல் என்றாலும், எபிரெயச் சொல் நேரடியாக ஆழ்ந்த உறக்கத்தைக் குறிக்கிறது. ‘மயக்கநிலை’ என்று முதன்மை உரையில் மொழிபெயர்ப்பது உரையில் வெளிப்படையாக இல்லாத விளக்கத்தை வலுப்படுத்தும்; எனவே அந்த வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: אֵימָה חֲשֵׁכָה גְדֹלָה தொடரில் திகிலுக்கும் இருளுக்கும் உள்ள உறவு
  choice: இருள் சூழ்ந்த பெரும் திகில்
  alternative: பெரும் இருளின் திகில்; இருண்ட பெரும் திகில்
  rationale: எபிரெயத் தொடர் இருளையும் திகிலையும் செறிவாக இணைத்தாலும் அவற்றின் துல்லியமான இலக்கண உறவை முழுமையாகத் தீர்மானிக்கவில்லை. முதன்மை மொழிபெயர்ப்பு இயல்பான தமிழைத் தருகிறது; மாற்று வாசிப்புகள் அடிக்குறிப்பில் வைக்கப்பட்டு ambiguity பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதாகமக் காட்சியின் கண்ணியமும் தீவிரமும் நிலைக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதோ’ என்ற இலக்கியக் கவன ஈர்ப்பு சொல்லும், ‘விழுந்தது/கவிந்துகொண்டிருந்தது’ என்ற மூல உருவகங்களும் காக்கப்பட்டுள்ளன.
