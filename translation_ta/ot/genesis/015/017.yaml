  choice: சூரியன் மறைந்து இருள் சூழ்ந்தபோது
  rationale: சூரியனுடன் வரும் בוא மறைதலைக் குறிக்கும் எபிரெய மரபுத்தொடர். வַיְהִי அறிமுகப்படுத்தும் காலத் தொடர்ச்சியையும் עֲלָטָה குறிக்கும் இருள் அல்லது மந்தாரத்தையும் இயல்பான நவீனத் தமிழில் ஒரே காலவாக்கியமாக வழங்குகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: காட்சியைத் திடமாக வாசகரின் கவனத்துக்குக் கொண்டுவரும் சொல்லின் இலக்கியச் செறிவையும் கண்ணியத்தையும் காக்கிறது.
- source_word: תַנּוּר עָשָׁן
  choice: புகை எழும்பும் ஓர் அடுப்பு
  rationale: תַנּוּר என்பது அடுப்பு, சூளை அல்லது நெருப்பைக் கொண்டிருக்கும் அமைப்பைக் குறிக்கலாம். இந்தக் காட்சியில் ‘அடுப்பு’ என்பது மிகைப்படுத்தாமல் பொதுவாகப் புரியும் இயல்பான தமிழ்ச் சொல்; עָשָׁן புகைமிக்க தன்மையாக வழங்கப்பட்டுள்ளது.
- source_word: לַפִּיד אֵשׁ
  choice: தீப்பற்றி எரியும் ஒரு தீப்பந்தம்
  rationale: לַפִּיד என்பது தீப்பந்தம்; אֵשׁ அதன் எரியும் தன்மையை வலியுறுத்துகிறது. தமிழில் இயல்பாகவும் காட்சி தெளிவாகவும் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר עָבַר
  choice: கடந்து சென்றன
  rationale: முன்னுள்ள இரு நெருப்புக் காட்சிப் பொருட்களையும் சேர்த்து எழுவாயாகக் கொண்டு இயல்பான தமிழ்ப் பன்மையில் வழங்கப்பட்டுள்ளது. எபிரெய வினை ஒருமையில் இருப்பதால் தோன்றும் இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בֵּין הַגְּזָרִים הָאֵלֶּה
  choice: இந்தத் துண்டுகளின் நடுவே
  rationale: גְּזָרִים என்பது முந்தைய வசனத்தில் வெட்டிப் பிரிக்கப்பட்ட விலங்குகளின் பகுதிகளைக் குறிக்கிறது. சூழல் அதைத் தெளிவாக்குவதால் ‘துண்டுகள்’ என்பது சுருக்கமான, இயல்பான மொழிபெயர்ப்பு.
theological_decisions:
- issue: உடன்படிக்கைச் சடங்கில் தோன்றும் நெருப்புப் பொருட்களின் இயல்பு
  choice: அவை காணப்பட்ட விதத்தை மட்டும் விவரித்து, மொழிபெயர்ப்பு வரியில் அவற்றைக் கர்த்தருடன் நேரடியாக அடையாளப்படுத்தவில்லை.
  alternative: புகை எழும்பும் அடுப்பும் எரியும் தீப்பந்தமும் கர்த்தருடைய பிரசன்னத்தின் வெளிப்பாடு என்று நேரடியாக விளக்குதல்.
  rationale: விரிந்த சூழல் தெய்வீக உடன்படிக்கை வெளிப்பாட்டை வலுவாகச் சுட்டினாலும், இந்த வசனத்தின் எபிரெய உரை காணப்பட்ட அடையாளங்களையே பெயரிடுகிறது. எனவே இறையியல் பதற்றத்தையும் உரையின் வரம்பையும் காக்க விளக்கவுரை மொழிபெயர்ப்புக்குள் சேர்க்கப்படவில்லை.
- issue: ஒருமை வினைக்கும் இரண்டு காட்சிப் பொருட்களுக்கும் இடையிலான தொடர்பு
  choice: தமிழ் முதன்மை உரையில் இரு பொருட்களும் கடந்ததாக இயல்பான பன்மையில் வழங்கி, எபிரெய ஒருமையை அடிக்குறிப்பில் குறிப்பிட்டது.
  alternative: கடந்து சென்றது தீப்பந்தம் மட்டுமே என்று மொழிபெயர்த்தல், அல்லது ஒருமை வினையால் முழுக் காட்சியையும் ஒரு தொகுதியாக வழங்குதல்.
  rationale: אֲשֶׁר עָבַר என்ற ஒருமை வடிவம் அருகிலுள்ள ‘தீப்பந்தம்’ என்பதோடு மட்டும் தொடர்புபடுத்தப்படலாம்; ஆயினும் காட்சியிலுள்ள இரு அடையாளங்களையும் ஒன்றாகச் சுட்டும் தொகுப்பு ஒருமையாகவும் புரிந்துகொள்ளலாம். தமிழில் இயல்பற்ற கட்டமைப்பைத் தவிர்த்து, உண்மையான இலக்கணத் தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், அதேவேளை கண்ணியமான காட்சிமொழி பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பது மூலத்தின் திடமான கவன ஈர்ப்பைப் பாதுகாக்கிறது. ‘அடுப்பு’ பொதுவான சொல்லாகத் தேர்ந்தெடுக்கப்பட்டு, ‘சூளை/உலை’ என்ற மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
