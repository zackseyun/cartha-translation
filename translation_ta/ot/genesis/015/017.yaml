base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/017.yaml
  text: And when the sun had gone down and it was dark[a], behold[b], a smoking firepot and a flaming torch passed between these pieces.
translation:
  language: ta
  text: சூரியன் மறைந்து இருளானபோது, இதோ, புகை எழும் ஓர் அடுப்பும்[a] தீப்பற்றி எரியும் ஒரு தீப்பந்தமும் இந்தத் துண்டுகளின்[b] நடுவே கடந்து சென்றது.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘புகை எழும் ஒரு சூளை’ அல்லது ‘புகை எழும் ஓர் உலை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அடுப்பு அல்லது நெருப்பைக் கொண்டிருக்கும் ஓர் அமைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘துண்டுகள்’ என்பது உடன்படிக்கைச் சடங்கிற்காக முன்பு வெட்டிப் பிரிக்கப்பட்ட விலங்குகளின் பகுதிகளைக் குறிக்கிறது (ஆதியாகமம் 15:10 பார்க்கவும்).
    reason: cross_reference
  - marker: c
    text: எபிரெயில் ‘கடந்து சென்றது’ என்று ஒருமை வினை உள்ளது. அது தீப்பந்தத்தை மட்டும் குறிக்கலாம்; அல்லது அடுப்பும் தீப்பந்தமும் சேர்ந்த முழுக் காட்சியை ஒரு தொகுதியாகக் குறிக்கலாம்.
    reason: grammatical_ambiguity
lexical_decisions:
