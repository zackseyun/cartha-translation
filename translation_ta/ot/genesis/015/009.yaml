id: GEN.15.9
reference: Genesis 15:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו קְחָ֥/ה לִ/י֙ עֶגְלָ֣ה מְשֻׁלֶּ֔שֶׁת וְ/עֵ֥ז מְשֻׁלֶּ֖שֶׁת וְ/אַ֣יִל מְשֻׁלָּ֑שׁ וְ/תֹ֖ר וְ/גוֹזָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/009.yaml
  text: And he said to him[a], “Bring me a three-year-old heifer, a three-year-old female goat, a three-year-old ram, a turtledove[b], and a young pigeon.”
translation:
  language: ta
  text: அவர் அவனிடம், “மூன்று வயதான[a] ஒரு கிடாரியையும், மூன்று வயதான ஒரு பெண் வெள்ளாட்டையும், மூன்று வயதான ஒரு செம்மறியாட்டுக் கடாவையும், ஒரு காட்டுப்புறாவையும், ஒரு புறாக்குஞ்சையும் எனக்காகக் கொண்டுவா[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மூன்று வயதான” என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் அரிதானது; இங்கு அது விலங்குகள் மூன்று வயதுடையவை என்பதைக் குறிப்பதாக மரபாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “எனக்காக எடுத்துக்கொள்.” உடன்படிக்கைச் சடங்குக்காக இந்த விலங்குகளைப் பெற்று வந்து அளிப்பதே சூழலில் அதன் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: அவர் அவனிடம் … என்றார்
  rationale: எபிரெய உரையின் தொடர் கதைநடையையும், ஆண்பால் ஒருமைச் சுட்டையும் இயல்பான தமிழ் மேற்கோள் அமைப்பில் தருகிறது; முந்தைய சூழலில் ‘அவன்’ ஆபிராமைக் குறிக்கிறது.
- source_word: קְחָה לִי
  choice: எனக்காகக் கொண்டுவா
  rationale: சொல்லுக்குச் சொல் பொருள் ‘எனக்காக எடுத்துக்கொள்’ என்பதாக இருந்தாலும், உடன்படிக்கைச் சடங்குக்கான விலங்குகளைப் பெற்று அவரிடம் கொண்டுவருவதே சூழல்சார் பொருள்.
- source_word: עֶגְלָה
  choice: கிடாரி
  rationale: இளம் பெண் மாட்டைக் குறிக்கும் துல்லியமான, சுருக்கமான தமிழ்ச் சொல்.
- source_word: מְשֻׁלֶּשֶׁת / מְשֻׁלָּשׁ
  choice: மூன்று வயதான
  rationale: இங்கு பட்டியலிடப்படும் மூன்று விலங்குகளின் வயதைக் குறிப்பிடுவதாக மரபாகவும் சூழலுக்கு ஏற்றவாறும் புரிந்துகொள்ளப்படுகிறது.
- source_word: עֵז
  choice: பெண் வெள்ளாடு
  rationale: இச்சொல் இங்கு பெண் வெள்ளாட்டைக் குறிக்கிறது; நவீன வாசகருக்கு பாலினத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: אַיִל
  choice: செம்மறியாட்டுக் கடா
  rationale: பலியிடும் சூழலில் ஆண் செம்மறியாட்டைக் குறிக்கும் தெளிவான தமிழ் இணைச்சொல்.
- source_word: תֹר
  choice: காட்டுப்புறா
  rationale: பொதுவான புறாவை அல்லாமல் turtledove வகையைத் தனிப்படுத்தும் வழக்கமான தமிழ் சொல்.
- source_word: גוֹזָל
  choice: புறாக்குஞ்சு
  rationale: תֹר என்பதுடன் இணைந்து வரும் பலிசார் பட்டியலில் இச்சொல் இளம் புறாவைக் குறிக்கிறது.
theological_decisions:
- issue: מְשֻׁלֶּשֶׁת / מְשֻׁלָּשׁ என்பதன் பொருள்
  choice: மூன்று வயதான
  alternative: மூன்றாகப் பிரிக்கப்பட்ட / மும்மடங்கான
  rationale: விலங்குகளின் பட்டியலில் மூன்று முறை வரும் இவ்வடிவம் அவற்றின் வயதைக் குறிக்கிறது என்ற மரபான புரிதல் சூழலுக்கு மிகவும் இயல்பானது. இருப்பினும் எபிரெய வடிவத்தின் அரிதான தன்மையால் வேறு சொற்பிறப்பியல் விளக்கங்கள் இருப்பதை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான மேற்கோள் அமைப்பு பயன்படுத்தப்பட்டுள்ளது. ‘கிடாரி,’ ‘செம்மறியாட்டுக் கடா’ போன்ற சொற்கள் துல்லியத்தையும் பொதுவான புரிதலையும் சமநிலைப்படுத்துகின்றன; அரிதான எபிரெய வயதுச் சொல்லின் ஐயப்பாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
