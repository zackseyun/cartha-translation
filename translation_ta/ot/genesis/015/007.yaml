base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/007.yaml
  text: And he said to him[a], “I am Yahweh[c][b], who brought you out from Ur of the Chaldeans to give you this land to possess.”
translation:
  language: ta
  text: அவர் அவனிடம், “நான் யாவே; இந்த நாட்டை உனக்குக் கொடுத்து, நீ அதை உடைமையாக்கிக்கொள்ளும்படி[a] கல்தேயரின் ஊரிலிருந்து உன்னை வெளியே கொண்டுவந்தவன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உடைமையாக்கிக்கொள்ளும்படி” என்பதை “சுதந்தரித்துக்கொள்ளும்படி” அல்லது “கைப்பற்றிக்கொள்ளும்படி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: அவர் அவனிடம் … என்றார்
  rationale: எபிரேயக் கதைநடையின் தொடர்ச்சியையும் மறைமுகப் பொருளையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது.
- source_word: אֲנִי יְהוָה
  choice: யாவே நானே
  rationale: வினைச்சொல் இல்லாத எபிரேய அடையாளக் கூற்றின் வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ஒலிபெயர்க்கப்படுகிறது.
- source_word: הוֹצֵאתִיךָ
  choice: உன்னை … வெளியே கொண்டுவந்து
  rationale: יצא என்பதன் ஹிஃபீல் வடிவம் ஒருவரை ஓர் இடத்திலிருந்து வெளியே வரச்செய்வதைக் குறிக்கிறது.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: கல்தேயரின் ஊர் நகரத்திலிருந்து
  rationale: אוּר என்பதை இடப்பெயரான ‘ஊர்’ என்று ஒலிபெயர்த்து, அது பொதுப்பெயரான ‘ஊர்’ எனத் தவறாகப் புரியாதபடி ‘நகரம்’ சேர்க்கப்படுகிறது; כַּשְׂדִּים இன/பிரதேசச் சார்பை ‘கல்தேயரின்’ எனக் காட்டுகிறது.
- source_word: לָתֶת לְךָ אֶת הָאָרֶץ הַזֹּאת
  choice: இந்த நாட்டை … உனக்குக் கொடுப்பவர்
  rationale: ל infinitive-இன் நோக்கப் பொருளையும், הארץ என்பதன் நிலப்பரப்பு சார்ந்த பொருளையும் தெளிவாக வழங்குகிறது.
- source_word: לְרִשְׁתָּהּ
  choice: நீ உரிமையாக்கிக்கொள்ளும்படி
  rationale: ירשׁ இங்கு பெறுதல், உடைமையாக்குதல், சுதந்தரித்தல் ஆகிய பொருள் நிழல்களைக் கொண்டது; ‘உரிமையாக்கிக்கொள்ள’ என்பது நிலத்தைப் பெற்று தமதாக்கும் கருத்தை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது அந்த வேறுபாட்டைக் காக்கிறது.
- issue: לְרִשְׁתָּהּ என்பதில் உரிமை/சுதந்தரிப்பு நுணுக்கம்
  choice: உரிமையாக்கிக்கொள்ளும்படி
  alternative: சுதந்தரித்துக்கொள்ளும்படி
  rationale: சூழல் ஆபிராம் நாட்டைப் பெற்று உடைமையாக்குவதை முன்னிறுத்துகிறது; ஆயினும் ‘சுதந்தரித்தல்’ என்ற நுணுக்கமும் மூலச்சொல்லில் சாத்தியம் என்பதால் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘ஊர்’ என்பது நகரத்தின் பெயர் என்பதைத் தெளிவாக்க ‘ஊர் நகரம்’ பயன்படுத்தப்பட்டுள்ளது; தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
