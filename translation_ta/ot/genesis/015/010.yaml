  yaml_path: translation/ot/genesis/015/010.yaml
  text: So he brought all these to him[a], cut them in two, and placed each half opposite the other[c][b]; but he did not cut the birds in two.
translation:
  language: ta
  text: ஆகவே, அவன் இவை எல்லாவற்றையும் அவரிடம் கொண்டுவந்து[a], அவற்றை நடுவில் இரண்டாகப் பிளந்து, ஒவ்வொரு பாதியையும் அதன் மறுபாதிக்கு எதிரே வைத்தான்[b]. ஆனால் பறவைகளை அவன் இரண்டாகப் பிளக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் நேரடியாக, “இவை எல்லாவற்றையும் அவருக்காக எடுத்தான்” அல்லது “அவரிடம் எடுத்தான்.” “அவர்” யாரைக் குறிக்கிறார் என்பது இலக்கணத்தில் வெளிப்படையாக இல்லை; ஆனால் முந்தைய வசனத்தின் சூழல் “அவரிடம் கொண்டுவந்தான்” என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “ஒவ்வொரு துண்டையும் அதன் இணைக்கு எதிரே வைத்தான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח לוֹ אֶת כָּל אֵלֶּה
  choice: அவன் இவை எல்லாவற்றையும் அவரிடம் கொண்டுவந்து
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்’; ஆனால் முந்தைய வசனத்தில் தேவன் ‘என்னிடம் கொண்டுவா’ என்று கட்டளையிட்ட சூழலில், לוֹ தேவனைக் குறிக்கும் மறைமுக வேற்றுமையாக இயல்பாகப் புரிகிறது. எனவே நிகழ்வின் பொருளைத் தெளிவாகக் காட்ட ‘அவரிடம் கொண்டுவந்து’ என மொழிபெயர்க்கப்பட்டது; எபிரெயச் சொல்லமைப்பை நேரடியாகப் பிரதிபலிக்கும் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיְבַתֵּר אֹתָם בַּתָּוֶךְ
  choice: அவற்றை நடுவில் இரண்டாகப் பிளந்து
  rationale: בתר என்பது வெட்டிப் பிரிப்பதைக் குறிக்கிறது; בַּתָּוֶךְ ‘நடுவில்’ என்பதைக் குறிக்கிறது. பலியிடப்பட்ட விலங்குகளின் உடல்கள் இரு பாதிகளாகப் பிரிக்கப்பட்ட காட்சியை நவீனத் தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: וַיִּתֵּן אִישׁ בִּתְרוֹ לִקְרַאת רֵעֵהוּ
  choice: ஒவ்வொரு பாதியையும் அதற்குரிய மறுபாதிக்கு எதிரே வைத்தான்
  rationale: אִישׁ ... רֵעֵהוּ என்பது ‘ஒவ்வொன்றும் ... அதற்குரிய மற்றொன்றும்’ என்ற பகிர்மான மரபுத்தொடர். בִּתְרוֹ வெட்டிப் பிரிக்கப்பட்ட பகுதியைக் குறிக்கிறது. ‘மறுபாதி’ என்பது ஒவ்வொரு விலங்கின் இணையான வெட்டுப்பகுதியைத் தெளிவுபடுத்துகிறது; ‘எதிரே’ இடவமைப்பைப் பாதுகாக்கிறது.
- source_word: וְאֶת הַצִפֹּר לֹא בָתָר
  choice: ஆனால் பறவைகளை அவன் இரண்டாகப் பிளக்கவில்லை
  rationale: הַצִּפֹּר இலக்கணத்தில் ஒருமையாக இருந்தாலும், முந்தைய வசனத்தில் குறிப்பிடப்பட்ட இரண்டு பறவைகளையும் கூட்டாகச் சுட்டுகிறது. தமிழில் பன்மை இயல்பாகவும் தெளிவாகவும் உள்ளது. முந்தைய செயலையே இங்கு மறுப்பதால் ‘இரண்டாகப் பிளக்கவில்லை’ என்று மீண்டும் கூறப்படுகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சடங்கின் மொழி
  choice: விலங்குகள் இரண்டாகப் பிளக்கப்பட்டு, அவற்றின் பாதிகள் ஒன்றுக்கொன்று எதிரே வைக்கப்பட்டதாகக் காட்சியை நேரடியாக மொழிபெயர்த்தல்
  alternative: இது உடன்படிக்கை ஏற்படுத்தும் சடங்கு என்று வசனத்துக்குள்ளேயே விளக்கிச் சேர்த்தல்
  rationale: எபிரெய உரை சடங்கின் செயல்களை விவரிக்கிறது; அதன் இறையியல் பொருளை இவ்வசனத்தில் வெளிப்படையாக விளக்கவில்லை. ஆகவே காட்சியின் உடன்படிக்கைச் சாயலைப் பாதுகாத்தும், உரையில் இல்லாத விளக்கத்தைச் சேர்க்காமலும் மொழிபெயர்க்கப்பட்டது.
- issue: לוֹ என்பதன் குறிப்பு
  choice: ‘அவரிடம்’—சூழலின்படி தேவனிடம்
  alternative: ‘தனக்காக’ அல்லது வெறுமனே ‘எடுத்தான்’
  rationale: இலக்கண ரீதியில் தாதீவப் பயன்பாடு பலவாறு புரியக்கூடியதாயினும், 15:9-இல் ‘என்னிடம் கொண்டுவா’ என்ற கட்டளைக்கு ஆபிராம் கீழ்ப்படிவதே உடனடிச் சூழல். உண்மையான மொழியியல் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடியதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டது. ‘பிளந்து’, ‘மறுபாதி’, ‘எதிரே’ ஆகிய சொற்கள் சடங்கின் உடல்சார்ந்த காட்சியைத் தெளிவாக வைத்திருக்கின்றன. தேவனைச் சுட்டும் ‘அவரிடம்’ மரியாதை ஒருமையில் உள்ளது; மூலத்தில் பெயர் வெளிப்படையாக இல்லாததால் ‘தேவனிடம்’ என்று உரைக்குள் விரிவுபடுத்தப்படவில்லை.
