id: GEN.15.1
reference: Genesis 15:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הָיָ֤ה דְבַר יְהוָה֙ אֶל אַבְרָ֔ם בַּֽ/מַּחֲזֶ֖ה לֵ/אמֹ֑ר אַל תִּירָ֣א אַבְרָ֗ם אָנֹכִי֙ מָגֵ֣ן לָ֔/ךְ שְׂכָרְ/ךָ֖ הַרְבֵּ֥ה מְאֹֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/001.yaml
  text: After these things[a], the word of Yahweh came to Abram in a vision, saying, “Do not fear, Abram. I am a shield for you; your reward will be very great.”
translation:
  language: ta
  text: 'இவற்றுக்குப் பின்பு, தரிசனத்தில் ஆபிராமுக்கு யாவேயின் வார்த்தை வந்தது: “ஆபிராமே, பயப்படாதே. நான் உனக்குக் கேடயமாக இருக்கிறேன்; உன் வெகுமதி மிகவும் பெரிதாயிருக்கும்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நானே உன் கேடயம்; உன் வெகுமதி மிகவும் பெரியது.” எபிரெய வாக்கியத்தில் ‘இருக்கிறது/இருக்கும்’ என்ற வினை வெளிப்படையாக இல்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: இவற்றுக்குப் பின்பு
  rationale: דְּבָרִים என்பது சொற்களையோ நிகழ்வுகளையோ குறிக்கக்கூடிய பரந்த சொல். முந்தைய கதை நிகழ்ச்சிகளைச் சுட்டும் இயல்பான காலத் தொடக்கமாகவும், தேவையற்ற குறிப்பாக்கத்தைத் தவிர்க்கும் வகையிலும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: דְבַר יְהוָה
  choice: யாவேயின் வார்த்தை
  rationale: இது தெய்வீக வெளிப்பாட்டைக் குறிக்கும் நிலையான எபிரெயச் சொற்றொடர். இயல்பான தமிழில் அதன் இறையியல் வலிமையும் உடைமைத் தொடர்பும் தக்கவைக்கப்படுகின்றன.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட தெய்வீகப் பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், பெயராகவே ஒலிபெயர்க்கிறது.
- source_word: הָיָה ... אֶל אַבְרָם
  choice: ஆபிராமுக்கு ... வந்தது
  rationale: ‘வார்த்தை ஒருவரிடம் வந்தது’ என்ற வெளிப்பாட்டு நிகழ்வை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בַּמַּחֲזֶה
  choice: தரிசனத்தில்
  rationale: מַחֲזֶה என்பது காட்சியால் கிடைக்கும் வெளிப்பாட்டைக் குறிக்கிறது; ‘தரிசனம்’ நவீன வேதாகமத் தமிழில் தெளிவாகவும் dignified ஆகவும் உள்ளது.
- source_word: לֵאמֹר
  choice: 'வந்தது:'
  rationale: நேரடிப் பேச்சை அறிமுகப்படுத்தும் எபிரெய infinitive-ஐ தமிழில் தேவையற்ற ‘சொல்லி’ என்ற மரபுச் சொல்லாக்கமின்றி இருபுள்ளியால் இயல்பாக இணைக்கிறது.
- source_word: אַל תִּירָא
  choice: பயப்படாதே
  rationale: ஒருமை முன்னிலையில் கூறப்படும் நேரடியான தடையைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: מָגֵן לָךְ
  choice: நான் உனக்குக் கேடயமாக இருக்கிறேன்
  rationale: ‘கேடயம்’ என்பதற்கு உடைமைப் பின்னொட்டு இல்லாததால், ‘உன் கேடயம்’ என்று மட்டும் மாற்றாமல் לָךְ என்பதன் ‘உனக்காக/உனக்கு’ என்ற உறவைத் தக்கவைக்கிறது.
- source_word: שְׂכָרְךָ
  choice: உன் வெகுமதி
  rationale: இந்த உடன்படிக்கைச் சூழலில் ‘கூலி’ என்பதைவிட ‘வெகுமதி’ பொருத்தமானது; பலன் அல்லது பிரதிபலன் என்ற பரந்த கருத்தையும் தக்கவைக்கிறது.
- source_word: הַרְבֵּה מְאֹד
  choice: மிகவும் பெரிதாயிருக்கும்
  rationale: வினையற்ற எபிரெய வாக்கியத்திற்கு வாக்குறுதியின் சூழல் ஆதரிக்கும் எதிர்கால வினையைத் தமிழில் வழங்குகிறது; அளவின் வலியுறுத்தலையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயர் உள்ளது. ஆகவே அதை ‘யாவே’ என்று பெயராகவே வழங்குகிறது.
- issue: שְׂכָרְךָ הַרְבֵּה מְאֹד என்ற வாக்குறுதி வாக்கியத்தின் காலமும் அமைப்பும்
  choice: உன் வெகுமதி மிகவும் பெரிதாயிருக்கும்
  alternative: உன் வெகுமதி மிகவும் பெரியது
  rationale: எபிரெயில் வெளிப்படையான இணைப்பு வினை இல்லை. வாக்குறுதிச் சூழலில் எதிர்காலம் இயல்பானது; இருப்பினும் நிகழ்காலப் பொருளும் இலக்கணரீதியாக சாத்தியமுள்ளதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: மָגֵן לָךְ மற்றும் שְׂכָרְךָ ஆகியவற்றின் தொடர்பு
  choice: 'இரண்டு இணையான உறுதிமொழிகள்: கேடயமாக இருப்பது; வெகுமதி பெரிதாக இருப்பது'
  alternative: தேவனே ஆபிராமின் கேடயமும் மிகப் பெரிய வெகுமதியும் ஆவார்
  rationale: உடனடியான சொற்றொடர் அமைப்பு ‘உன் வெகுமதி’ என்பதை இரண்டாவது எழுவாயாக இயல்பாக வாசிக்க அனுமதிக்கிறது. தேவனையே ‘வெகுமதி’ என்று apposition-ஆக அடையாளப்படுத்துவது சாத்தியமான இறையியல் வாசிப்பாக இருந்தாலும், இங்கு அதைத் தெளிவான ஒரே பொருளாகத் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆபிராமே’ என்ற விளிவடிவம் நேரடி அழைப்பை இயல்பாகத் தருகிறது. பழமையான ‘அஞ்சாதே’, ‘உரைத்ததாவது’ போன்ற வடிவங்கள் தவிர்க்கப்பட்டுள்ளன.
