  text: וַ/יֹּ֣אמֶר אַבְרָ֗ם אֲדֹנָ֤/י יֱהוִה֙ מַה תִּתֶּן לִ֔/י וְ/אָנֹכִ֖י הוֹלֵ֣ךְ עֲרִירִ֑י וּ/בֶן מֶ֣שֶׁק בֵּיתִ֔/י ה֖וּא דַּמֶּ֥שֶׂק אֱלִיעֶֽזֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/002.yaml
  text: But Abram said[a], “Lord Yahweh, what will you give me, since I am going childless, and the heir of my house is Eliezer of Damascus?”
translation:
  language: ta
  text: ஆனால் ஆபிராம், “ஆண்டவராகிய யாவே, நீர் எனக்கு என்ன தருவீர்? நானோ பிள்ளையில்லாதவனாகவே போய்க்கொண்டிருக்கிறேன்; என் வீட்டின் வாரிசு[a] தமஸ்குவைச் சேர்ந்த எலியேசர்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “என் வீட்டின் மேஷெக்கின் மகன்” என்று உள்ளது. இது வழக்கத்திற்கு மாறான சொற்றொடர்; “என் வீட்டைப் பராமரிப்பவன்” அல்லது “என் வீட்டை உடைமையாக்கிக்கொள்பவன்/அதன் வாரிசு” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் ஆபிராம் ... என்றார்
  rationale: தொடர்ச்சியான கதைநடையைச் சுட்டும் வாவ் இங்கு முந்தைய வாக்குறுதிக்கு ஆபிராம் கவலையுடன் மறுமொழி கூறுவதைக் காட்டுகிறது; எனவே ‘ஆனால்’ இயல்பான தொடர்பை அளிக்கிறது.
- source_word: אֲדֹנָי יֱהוִה
  choice: ஆண்டவராகிய யாவே
  rationale: אֲדֹנָי என்ற ‘ஆண்டவர்’ பட்டத்தையும், יֱהוִה என்ற உடன்படிக்கைப் பெயரையும் தனித்தனியாகப் பாதுகாக்கிறது; தமிழில் இரண்டையும் இயல்பாக இணைக்க ‘ஆண்டவராகிய’ பயன்படுத்தப்பட்டது.
- source_word: מַה תִּתֶּן לִי
  choice: நீர் எனக்கு என்ன தருவீர்?
  rationale: இங்குள்ள முற்றுப்பெறாத வினை சூழலில் எதிர்காலப் பொருளைத் தருகிறது; மரியாதை ஒருமையுடன் நேரடியான கேள்வியாக மொழிபெயர்க்கப்பட்டது.
- source_word: וְאָנֹכִי הוֹלֵךְ עֲרִירִי
  choice: நானோ பிள்ளையில்லாதவனாகவே போய்க்கொண்டிருக்கிறேன்
  rationale: ‘போகிறேன்’ என்ற எபிரெய உருவகத்தையும், ஆபிராமின் பிள்ளையின்மையையும் பாதுகாக்கிறது; ‘நானோ’ என்பது அவரது கேள்விக்கான சூழ்நிலையை இயல்பாக முன்வைக்கிறது. மரணத்தை வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் மிதமான தெளிவின்மையும் வைக்கப்படுகிறது.
- source_word: בֶן מֶשֶׁק בֵּיתִי
  choice: என் வீட்டின் வாரிசாக இருப்பவன்
  rationale: இது அரிதானதும் பொருள் உறுதியாகாததுமான சொற்றொடர். அடுத்த வசனத்தின் வாரிசுரிமைச் சூழலில் ‘வாரிசு’ தெளிவான தமிழைத் தருகிறது; சொற்சொல்லான வடிவமும் மாற்று வாய்ப்புகளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: דַּמֶּשֶׂק אֱלִיעֶזֶר
  choice: தமஸ்குவைச் சேர்ந்த எலியேசர்
  rationale: எலியேசரைத் தமஸ்குவோடு தொடர்புபடுத்தும் மூல அமைப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֲדֹנָי יֱהוִה என்ற கூட்டுவிளிப்பில் இறைப் பெயரை மொழிபெயர்த்தல்
  choice: ஆண்டவராகிய யாவே
  alternative: ஆண்டவராகிய கர்த்தர்
  rationale: மூலத்தில் உள்ள ஆண்டவர் என்ற பட்டத்தையும் யாவே என்ற தனிப்பெயரையும் ஒன்றாகப் பாதுகாக்கிறது; ஒரே பட்டத்தை இருமுறை கூறுவது தவிர்க்கப்படுகிறது.
- issue: בֶן מֶשֶׁק בֵּיתִי என்பதன் வாரிசுரிமைப் பொருள்
  choice: என் வீட்டின் வாரிசாக இருப்பவன்
  alternative: என் வீட்டைப் பராமரிப்பவன் / என் வீட்டின் உடைமைக்குரிய மகன்
  rationale: சூழல் எலியேசர் ஆபிராமின் சொத்துக்கு வாரிசாகும் நிலையைச் சுட்டுகிறது. ஆயினும் அரிதான எபிரெயச் சொற்றொடரின் உறுதியின்மையை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடுவது எந்தத் தனிப்பட்ட கோட்பாட்டையும் திணிக்காமல் பொருள் நெருக்கடியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. கடவுளை நோக்கிய உரையில் மரியாதை ஒருமை பயன்படுத்தப்பட்டது. மூலத்தின் ‘போகிறேன்’ உருவகமும் வாரிசைக் குறிக்கும் அரிதான சொற்றொடரின் தெளிவின்மையும் முடிந்தவரை பாதுகாக்கப்பட்டுள்ளன.
