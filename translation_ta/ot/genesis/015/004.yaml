id: GEN.15.4
reference: Genesis 15:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה דְבַר יְהוָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר לֹ֥א יִֽירָשְׁ/ךָ֖ זֶ֑ה כִּי אִם֙ אֲשֶׁ֣ר יֵצֵ֣א מִ/מֵּעֶ֔י/ךָ ה֖וּא יִֽירָשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/004.yaml
  text: And behold, the word of the LORD came to him, saying, “This man will not be your heir; rather, one who comes from your own body will be your heir.”
translation:
  language: ta
  text: 'இதோ, யெகோவாவின் வார்த்தை அவனுக்கு வந்து கூறியது: “இவன் உனக்கு வாரிசாக இருக்கமாட்டான்; உன் சொந்த உடலிலிருந்து வருபவனே உனக்கு வாரிசாவான்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, தெய்வீகச் செய்தி திடீரென வருவதைச் சுட்டும் எபிரெயச் சொல்லின் இயல்பான தமிழாக்கம்.
- source_word: דְבַר יְהוָה
  choice: யெகோவாவின் வார்த்தை
  rationale: தெய்வீகப் பெயரைப் பெயராகவே காட்டி, 'வார்த்தை' என்ற இயல்பான வேதாகமத் தொடரைத் தக்கவைக்கிறது.
- source_word: לֹא יִירָשְׁךָ זֶה
  choice: இவன் உனக்கு வாரிசாக மாட்டான்
  rationale: זֶה என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட நபரைச் சுட்டுவதால், தமிழில் ஆண்பால் மனிதச் சுட்டாக 'இவன்' தெளிவாக உள்ளது; ירשׁ இங்கு வாரிசாதலைக் குறிக்கிறது.
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: உன் உடலிலிருந்து பிறப்பவன்
  rationale: சொல்லளவில் 'உன் உள்ளுறுப்புகளிலிருந்து வெளிவருபவன்'; இயல்பான தமிழில் உயிரியல் சந்ததியைத் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: הוּא יִירָשֶׁךָ
  choice: அவனே உனக்கு வாரிசாவான்
  rationale: הוּא தரும் வலியுறுத்தலை '-ஏ' மூலம் தக்கவைக்கிறது.
theological_decisions:
- issue: வாக்குத்தத்த வாரிசின் அடையாளம்
  choice: உன் உடலிலிருந்து பிறப்பவன்
  alternative: உன் சொந்த மகன்
  rationale: மூலவாக்கியம் 'மகன்' என்ற சொல்லைப் பயன்படுத்தாமல் உடல்சார்ந்த சந்ததியைச் சொல்கிறது; அதன் பரப்பையும் வலியுறுத்தலையும் குறுக்காமல் தக்கவைக்கப்பட்டது.
- issue: தெய்வீகப் பெயர் יהוה
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, தனிப்பட்ட தெய்வீகப் பெயர் இருப்பதை வெளிப்படையாகக் காட்டுகிறது; குறிப்பிட்ட சமயவிளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. மூலத்தின் 'இதோ' என்ற கவன ஈர்ப்பும், வாரிசைப் பற்றிய மறுப்பும் எதிர்மறை-நேர்மறை அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
