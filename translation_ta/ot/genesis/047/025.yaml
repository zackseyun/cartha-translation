id: GEN.47.25
reference: Genesis 47:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּאמְר֖וּ הֶחֱיִתָ֑/נוּ נִמְצָא חֵן֙ בְּ/עֵינֵ֣י אֲדֹנִ֔/י וְ/הָיִ֥ינוּ עֲבָדִ֖ים לְ/פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/025.yaml
  text: And they said[a], “You have kept us alive. May we find favor in the eyes of my lord, and we will be servants to Pharaoh.”
translation:
  language: ta
  text: அவர்கள், “நீர் எங்களை உயிரோடு காத்தீர். என் ஆண்டவரின் பார்வையில் எங்களுக்குத் தயவு கிடைக்கட்டும்[a]; நாங்கள் பார்வோனுக்கு அடிமைகளாக இருப்போம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் ஆண்டவரின் பார்வையில் எங்களுக்குத் தயவு கிடைப்பதாக.” இது பணிவான வேண்டுகோளை வெளிப்படுத்தும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அவர்கள் … என்றார்கள்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழ் நேர்கூற்றில் வெளிப்படுத்துகிறது.
- source_word: הֶחֱיִתָנוּ
  choice: நீர் எங்களை உயிரோடு காத்தீர்
  rationale: חיה என்பதன் ஹிஃபில் வடிவிலுள்ள ‘வாழச் செய்தல்/உயிருடன் பாதுகாத்தல்’ என்ற காரணவினைப் பொருளைத் தக்கவைக்கிறது; ஆன்மிக மீட்பு என்ற கூடுதல் பொருளைச் சேர்ப்பதில்லை.
- source_word: נִמְצָא חֵן
  choice: எங்களுக்குத் தயவு கிடைக்கட்டும்
  rationale: முதல் நபர் பன்மை yiqtol இங்கு பணிவான விருப்பம் அல்லது வேண்டுகோளாகச் செயல்படுவதைக் காட்டுகிறது; முடிந்துபோன நிகழ்வாக மொழிபெயர்க்கவில்லை.
- source_word: בְּעֵינֵי אֲדֹנִי
  choice: என் ஆண்டவரின் பார்வையில்
  rationale: ‘கண்களில் தயவு காணுதல்’ என்ற எபிரெய மரபுத்தொடரின் உருவகத்தை புரியக்கூடிய தமிழில் காக்கிறது; ஒருமை பின்னொட்டு காரணமாக ‘என் ஆண்டவர்’ என வழங்கப்படுகிறது.
- source_word: וְהָיִינוּ
  choice: நாங்கள் … இருப்போம்
  rationale: சூழலில் விளைவாக வரும் உறுதிப்பாட்டை எதிர்கால வடிவில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲבָדִים לְפַרְעֹה
  choice: பார்வோனுக்கு அடிமைகளாக
  rationale: இந்தப் பொருளாதாரச் சூழலில் கட்டுப்பட்ட சேவைநிலையே முன்னிலையிலிருப்பதால் עֲבָדִים என்பதற்கு ‘அடிமைகள்’ என்பது ‘வேலையாட்கள்’ என்பதைவிடத் துல்லியமானது.
theological_decisions:
- issue: עֲבָדִים என்பதன் சமூக நிலை
  choice: அடிமைகள்
  alternative: பணியாளர்கள் / ஊழியர்கள்
  rationale: உயிர் பிழைப்பதற்குப் பதிலாகப் பார்வோனின் கட்டுப்பாட்டுக்குள் தங்களை ஒப்படைக்கும் நிலையை வசனச் சூழல் சுட்டுகிறது. மென்மைப்படுத்தாமலும் பிற்காலக் கோட்பாட்டுச் சிறப்புப் பொருளைச் சேர்க்காமலும் மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க நேர்கூற்று நடை பயன்படுத்தப்பட்டுள்ளது. யோசேப்பை நோக்கிய பணிவான ஒருமை அழைப்பை ‘என் ஆண்டவர்’ என்றும், பார்வோனுக்கான கட்டுப்பட்ட சேவைநிலையை ‘அடிமைகள்’ என்றும் தெளிவாகக் காத்துள்ளது.
