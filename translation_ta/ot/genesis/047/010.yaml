  terminology: ‘யாக்கோபு’ and ‘பார்வோன்’ are established Tamil biblical forms. ‘ஆசீர்வதித்து’ is the appropriate primary rendering. The footnote preserves the contextual salutation/farewell alternatives without displacing the lexical sense ‘blessed.’
