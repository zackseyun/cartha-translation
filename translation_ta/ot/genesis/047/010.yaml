source:
  edition: WLC
  text: וַ/יְבָ֥רֶךְ יַעֲקֹ֖ב אֶת פַּרְעֹ֑ה וַ/יֵּצֵ֖א מִ/לִּ/פְנֵ֥י פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/010.yaml
  text: Then Jacob blessed Pharaoh and went out from Pharaoh’s presence[a].
translation:
  language: ta
  text: பின்பு யாக்கோபு பார்வோனை ஆசீர்வதித்து, பார்வோனின் முன்னிலையிலிருந்து வெளியே சென்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பார்வோனை வாழ்த்தினார்’ / ‘பார்வோனிடம் விடைபெற்றார்’; எபிரெய வினைச்சொல் பொதுவாக ‘ஆசீர்வதித்தார்’ என்று பொருள்படும். ஆனால் அரசரைச் சந்திக்கும் சூழலில் அது முறையான வாழ்த்து அல்லது விடைபெறுதலையும் உள்ளடக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: ஆசீர்வதித்து
  rationale: ברך என்ற வினைச்சொல்லின் வழக்கமான பொருள் ‘ஆசீர்வதித்தல்’. அரசவையின் சந்திப்புச் சூழலில் இது மரியாதையான வாழ்த்து அல்லது விடைபெறுதலையும் குறிக்கக்கூடும்; இருப்பினும் அருகிலுள்ள 7, 10ஆம் வசனங்களில் ஒரே வினை வருவதால் அதன் நேரடியான பொருள் முதன்மைப்படுத்தப்பட்டது.
- source_word: יַעֲקֹב
  choice: யாக்கோபு
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர்வடிவம்.
- source_word: אֶת
  choice: '[நேரடி செயப்படுபொருள் குறியீடு; மொழிபெயர்க்கப்படவில்லை]'
  rationale: எபிரெய நேரடி செயப்படுபொருள் குறியீட்டிற்குத் தமிழில் தனியான இணைச்சொல் தேவையில்லை.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரசரைக் குறிக்கும் பட்டத்திற்குத் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: וַיֵּצֵא
  choice: வெளியே சென்றார்
  rationale: יצא என்பதன் அடிப்படைப் பொருளான ‘வெளியே செல்லுதல்’ என்பதையும் அரசரின் அவையிலிருந்து புறப்பட்ட உடல்சார்ந்த நகர்வையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִלִּפְנֵי
  choice: பார்வோனின் முன்னிலையிலிருந்து
  rationale: ‘ஒருவரின் முன்பிலிருந்து’ என்ற எபிரெய மரபுத்தொடரை, அரசரின் சந்நிதி அல்லது அவையிலிருந்து புறப்படுதல் என்ற பொருளில் இயல்பான, கண்ணியமான தமிழில் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஆசீர்வதித்து’ என்ற முதன்மைப் பொருள் காக்கப்பட்டதுடன், அரசவைச் சூழலில் உள்ள சொற்பொருள் ஐயப்பாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
