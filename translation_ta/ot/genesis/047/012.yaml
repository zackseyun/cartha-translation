base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/012.yaml
  text: And Joseph provided his father[a], his brothers, and all his father's household with food[b], according to the number of their little ones.
translation:
  language: ta
  text: யோசேப்பு தன் தந்தைக்கும், தன் சகோதரர்களுக்கும், தன் தந்தையின் குடும்பத்தார் அனைவருக்கும், அவர்களுடைய சிறு பிள்ளைகளின் எண்ணிக்கைக்கு ஏற்ப உணவு[a] வழங்கினான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அப்பம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பொதுவாக ‘அப்பம்’ என்று நேரடியாகப் பொருள்படும்; இங்கு அது விரிவாக உணவுப் பொருட்களைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்படி, ‘சிறு பிள்ளைகளின் வாய்க்கு ஏற்ப.’ இது பிள்ளைகளின் எண்ணிக்கைக்கு அல்லது அவர்களுடைய தேவைக்கு ஏற்ப வழங்கியதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלְכֵּל
  choice: வழங்கி ... பராமரித்தான்
  rationale: பியேல் வடிவிலுள்ள இந்த வினைச்சொல் பொருளுதவி செய்து பேணுதல் அல்லது தேவைகளை வழங்கிப் பராமரித்தல் என்ற பொருளைத் தருகிறது. பஞ்சச் சூழலில் தொடர்ச்சியான ஆதரவை இயல்பான தமிழில் வெளிப்படுத்த இச்சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: לֶחֶם
  choice: உணவு
  rationale: இச்சொல் நேரடியாக ‘அப்பம்’ என்று பொருள்படலாம்; ஆனால் இங்குள்ள பஞ்சம் மற்றும் குடும்பத்திற்கான வழங்கல் என்ற சூழலில் பொதுவாக உணவுப் பொருட்களைக் குறிக்கிறது.
- source_word: כָּל בֵּית אָבִיו
  choice: தன் தகப்பனுடைய குடும்பத்தார் அனைவரும்
  rationale: ‘வீடு’ என்பது இங்கு கட்டடத்தைக் குறிக்காமல் குடும்பம் அல்லது குடும்பக் குழுவைக் குறிக்கிறது. ‘குடும்பத்தார்’ என்பது இதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לְפִי
  choice: எண்ணிக்கைக்கு ஏற்ப
  rationale: எழுத்துப்படி ‘வாய்க்கு ஏற்ப’ எனும் இந்த மரபுத்தொடர் அளவு அல்லது விகிதத்தைக் குறிக்கிறது. இங்கு சிறு பிள்ளைகளின் எண்ணிக்கையை அடிப்படையாகக் கொண்ட பகிர்வாகப் புரிந்துகொள்ளலாம்; தேவைக்கு ஏற்ப என்ற நுண்பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் அது பாதுகாக்கப்பட்டுள்ளது.
- source_word: הַטָּף
  choice: சிறு பிள்ளைகள்
  rationale: טַף என்பது குடும்பத்திலுள்ள சிறு பிள்ளைகளை அல்லது இளம் சார்பாளர்களைக் குறிக்கிறது. ‘சிறு பிள்ளைகள்’ வயது சார்ந்த மூலப்பொருளை இயல்பாகத் தக்கவைக்கிறது.
- source_word: אָבִיו ... אֶחָיו
  choice: தன் தகப்பன் ... தன் சகோதரர்கள்
  rationale: இவை நேரடியான உறவுமுறைச் சொற்கள். உடனடிச் சூழலில் யோசேப்பின் தந்தையையும் ஆண் உடன்பிறந்தவர்களையும் குறிக்கின்றன.
