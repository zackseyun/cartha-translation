- from: யோசேப்பு தன் தகப்பனுக்கும், தன் சகோதரர்களுக்கும், தன் தகப்பனுடைய குடும்பத்தார் அனைவருக்கும் உணவு வழங்கி[a], அவர்களுடைய சிறு பிள்ளைகளின் எண்ணிக்கைக்கு ஏற்ப[b] அவர்களைப் பராமரித்தான்.
  to: யோசேப்பு தன் தந்தைக்கும், தன் சகோதரர்களுக்கும், தன் தந்தையின் குடும்பத்தார் அனைவருக்கும், அவர்களுடைய சிறு பிள்ளைகளின் எண்ணிக்கைக்கு ஏற்ப உணவு[a] வழங்கினான்[b].
