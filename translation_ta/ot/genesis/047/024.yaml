base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/024.yaml
  text: And at the harvest[a], you shall give a fifth to Pharaoh, and four-fifths shall be yours for seed for the field, for your food, for those in your households, and for food for your little ones.
translation:
  language: ta
  text: விளைச்சல் கிடைக்கும்போது, அதில் ஐந்தில் ஒரு பங்கைப் பார்வோனுக்குக் கொடுக்க வேண்டும். மீதமுள்ள ஐந்தில் நான்கு பங்குகள்[a] வயலுக்கு விதையாகவும், உங்கள் உணவுக்கும், உங்கள் வீட்டாருக்கும், உங்கள் சிறு பிள்ளைகளின் உணவுக்கும் உங்களுடையவையாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், ‘நான்கு கைகள்’; இது மீதமுள்ள நான்கு பங்குகளை, அதாவது ஐந்தில் நான்கு பங்குகளைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּתְּבוּאֹת
  choice: விளைச்சல் கிடைக்கும்போது
  rationale: תְּבוּאָה என்பது விளைபொருள் அல்லது விளைச்சலைக் குறிக்கிறது. இந்நிர்வாகச் சூழலில் ב முன்னொட்டுடன் வரும் சொற்றொடரை அறுவடை விளைச்சல் கிடைக்கும் காலமாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּנְתַתֶּם חֲמִישִׁית לְפַרְעֹה
  choice: அதில் ஐந்தில் ஒரு பங்கைப் பார்வோனுக்குக் கொடுக்க வேண்டும்
  rationale: חֲמִישִׁית என்பது ஐந்தில் ஒரு பங்கு. தமிழில் பங்கீட்டைத் தெளிவுபடுத்த ‘அதில்’ சேர்க்கப்பட்டு, கட்டளைக்குரிய கடமையை ‘கொடுக்க வேண்டும்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְאַרְבַּע הַיָּדֹת
  choice: மீதமுள்ள ஐந்தில் நான்கு பங்குகள்
  rationale: ‘நான்கு கைகள்’ என்ற எபிரெய மரபுத்தொடர் ஐந்து பங்குகளில் மீதமுள்ள நான்கு பங்குகளைக் குறிக்கிறது. சொல்லுக்குச் சொல் மொழிபெயர்ப்பு தமிழில் புரியாததால் அதன் பொருள் தரப்பட்டுள்ளது; ‘மீதமுள்ள’ என்பது பங்கீட்டின் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: יִהְיֶה לָכֶם
  choice: உங்களுடையவையாக இருக்கும்
  rationale: மீதமுள்ள விளைச்சல் அவர்களுக்கு ஒதுக்கப்பட்டு அவர்களுக்குச் சொந்தமாக இருக்கும் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְזֶרַע הַשָּׂדֶה
  choice: வயலில் விதைப்பதற்கான விதைக்கு
  rationale: לְ இங்கு நோக்கத்தைக் குறிக்கிறது; அடுத்த பருவத்தில் வயலில் விதைப்பதற்காக வைத்துக்கொள்ளும் விதை என்பது தெளிவாகிறது.
- source_word: וּלְאָכְלְכֶם
  choice: உங்கள் உணவுக்கு
  rationale: אכל சார்ந்த வடிவம் இங்கு உண்ணுவதற்கான உணவைச் சுட்டுகிறது; பட்டியலில் ‘உணவுக்கு’ இயல்பாக அமைகிறது.
- source_word: וְלַאֲשֶׁר בְּבָתֵּיכֶם
  choice: உங்கள் வீடுகளில் இருப்பவர்களுக்கு
  rationale: இந்த உறவுப்பெயர்ச் சொற்றொடர் வீட்டுப் பொருட்களை அல்ல, வீடுகளில் உள்ள மக்களைக் குறிக்கிறது; தமிழில் அந்தக் குறிப்பு வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: וְלֶאֱכֹל לְטַפְּכֶם
  choice: உங்கள் சிறு பிள்ளைகளின் உணவுக்கு
  rationale: טַף பொதுவாகச் சிறு பிள்ளைகள் அல்லது சார்ந்திருக்கும் இளையோரைக் குறிக்கிறது. குடும்பச் சூழலைக் காக்கும் இயல்பான தமிழாக ‘சிறு பிள்ளைகள்’ தேர்ந்தெடுக்கப்பட்டது.
