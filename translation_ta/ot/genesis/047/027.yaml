  text: וַ/יֵּ֧שֶׁב יִשְׂרָאֵ֛ל בְּ/אֶ֥רֶץ מִצְרַ֖יִם בְּ/אֶ֣רֶץ גֹּ֑שֶׁן וַ/יֵּאָחֲז֣וּ בָ֔/הּ וַ/יִּפְר֥וּ וַ/יִּרְבּ֖וּ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/027.yaml
  text: So Israel settled in the land of Egypt[a], in the land of Goshen, and they gained possessions in it and were fruitful and multiplied greatly.
translation:
  language: ta
  text: இஸ்ரவேல் எகிப்து நாட்டிலுள்ள கோசேன் நாட்டில் குடியேறினான். அவர்கள் அங்கே உடைமைகளைப் பெற்றார்கள்[a]; பலுகி, மிகவும் பெருகினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அங்கே நிலைபெற்றார்கள்,” “அங்கே தங்களுக்கான பங்கை உறுதிப்படுத்திக்கொண்டார்கள்.” எபிரெய வினைச்சொல் உடைமையைப் பெறுவதையோ அந்த நாட்டில் உறுதியாக நிலைபெறுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: குடியேறினான்
  rationale: இங்கு ישׁב என்பது வெறுமனே வாழ்ந்ததை அல்லாமல் நிலையான வசிப்பிடத்தை ஏற்படுத்திக்கொண்டதைக் குறிக்கிறது; ‘குடியேறினான்’ அந்தச் சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: எபிரெய உரையில் உள்ள பெயரையே தக்கவைக்கிறது. தொடர்ந்து வரும் பன்மை வினைகள் இஸ்ரவேலின் குடும்பத்தாரைக் குறிக்கின்றன; அந்த ஒருமை–பன்மை மாற்றத்தை மொழிபெயர்ப்பு பாதுகாக்கிறது.
- source_word: בְּאֶרֶץ מִצְרַיִם בְּאֶרֶץ גֹּשֶׁן
  choice: எகிப்து நாட்டிலுள்ள கோசேன் நாட்டில்
  rationale: இரு சொற்றொடர்களிலும் ‘நாடு/நிலம்’ இடம்பெறுவதைப் பாதுகாத்து, கோசேன் எகிப்துக்குள் அமைந்த பகுதி என்பதை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: וַיֵּאָחֲזוּ בָהּ
  choice: அங்கே உடைமைகளைப் பெற்றார்கள்
  rationale: אחז என்பதன் நிஃபால் வடிவம் இங்கு நிலத்தில் உரிமைப் பங்கு பெறுதல் அல்லது அங்கே உறுதியாக நிலைபெறுதல் என்ற பொருள் வரம்பைக் கொண்டுள்ளது. ‘உடைமைகளைப் பெற்றார்கள்’ சூழலுக்கு ஏற்ற முதன்மைப் பொருளைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּפְרוּ וַיִּרְבּוּ מְאֹד
  choice: பலுகி, மிகவும் பெருகினார்கள்
  rationale: ஆதியாகமம் முழுவதும் ஒலிக்கும் பலுகுதல்–பெருகுதல் என்ற ஆசீர்வாத மொழியைத் தக்கவைத்து, מְאֹד என்பதன் வலியுறுத்தலை ‘மிகவும்’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘இஸ்ரவேல்’ என்ற பெயரின் பிரதிநிதித்துவப் பொருள்
  choice: முதலில் ‘இஸ்ரவேல்’ என்ற ஒருமைப் பெயரையும் அதன்பின் ‘அவர்கள்’ என்ற பன்மையையும் தக்கவைத்தல்
  alternative: முழுவதையும் ‘இஸ்ரவேலர்கள்’ என்ற பன்மையாகவோ, ‘யாக்கோபு’ என்ற பெயராகவோ மொழிபெயர்த்தல்
  rationale: மூல உரை இஸ்ரவேலை ஒருமையில் முன்வைத்து, பின்னர் அவரது குடும்பத்தாரை உள்ளடக்கும் பன்மைக்கு மாறுகிறது. அந்த மாற்றம் முற்பிதா உடன்படிக்கைக் குடும்பத்தைப் பிரதிநிதித்துவப்படுத்தும் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பலுகி… பெருகினார்கள்’ என்பது ஆதியாகமத்தின் தொடர்ச்சியான ஆசீர்வாத மொழியோசையைப் பாதுகாக்கிறது; ஒருமையிலிருந்து பன்மைக்கு மாறும் மூல உரையின் அமைப்பும் தக்கவைக்கப்பட்டுள்ளது.
