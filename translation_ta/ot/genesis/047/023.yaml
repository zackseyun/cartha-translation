  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל הָ/עָ֔ם הֵן֩ קָנִ֨יתִי אֶתְ/כֶ֥ם הַ/יּ֛וֹם וְ/אֶת אַדְמַתְ/כֶ֖ם לְ/פַרְעֹ֑ה הֵֽא לָ/כֶ֣ם זֶ֔רַע וּ/זְרַעְתֶּ֖ם אֶת הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/023.yaml
  text: Then Joseph said to the people[a], “Look, today I have bought you and your land for Pharaoh. Here is seed for you, and you shall sow the land.”
translation:
  language: ta
  text: பின்பு யோசேப்பு மக்களிடம், “இதோ, இன்று உங்களையும் உங்கள் நிலத்தையும் பார்வோனுக்காக நான் வாங்கியிருக்கிறேன்.[a] இதோ, உங்களுக்கான விதை; நிலத்தில் விதையுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இன்று உங்களையும் உங்கள் நிலத்தையும் பார்வோனுக்காக நான் உரிமையாக்கிக் கொண்டேன்.” எபிரெய வினை வாங்குவதையும், பொதுவாக உரிமையாக்கிப் பெறுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றான்
  rationale: வாவ் தொடர்கதை வரிசையை முன்னெடுத்துச் செல்கிறது; ‘பின்பு’ இயல்பான தமிழ் கதைநடையில் அந்த வரிசையை வெளிப்படுத்துகிறது.
- source_word: הָעָם
  choice: மக்களிடம்
  rationale: இங்கு எகிப்திய மக்கள் கூட்டாகக் குறிக்கப்படுகின்றனர்; ‘மக்கள்’ தெளிவான, பொதுவான தமிழ் சொல்.
- source_word: הֵן
  choice: இதோ
  rationale: வலியுறுத்தும் கவன ஈர்ப்புச் சொல்லின் சுட்டும் தன்மையை நவீன, கண்ணியமான தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: קָנִיתִי
  choice: நான் வாங்கியிருக்கிறேன்
  rationale: קנה என்பதன் நேரடியான பொருள் வாங்குதல் அல்லது உடைமையாக்குதல். பஞ்சகாலப் பரிவர்த்தனையின் சட்ட-பொருளாதாரச் சூழலில் ‘வாங்கியிருக்கிறேன்’ உரிமை மாற்றத்தைத் தெளிவாகக் காட்டுகிறது; பொதுவான ‘பெற்றுக்கொண்டேன்’ என்பதைக் காட்டிலும் துல்லியமானது.
- source_word: אֶתְכֶם
  choice: உங்களை
  rationale: நேரடி செயப்படுபொருள் மக்கள் தாமே பார்வோனின் உடைமை அல்லது பணிநிலைக்குள் கொண்டுவரப்படுவதைக் குறிக்கிறது; மூலத்தின் கடினமான கருத்தை மென்மையாக்காமல் வைக்கிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: பரிவர்த்தனை நிகழும் காலத்தை நேரடியாகக் குறிக்கிறது.
- source_word: אַדְמַתְכֶם
  choice: உங்கள் நிலத்தை
  rationale: இங்கு אדמה மக்களின் வேளாண் நிலவுடைமையைக் குறிக்கிறது; ‘நிலம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: לְפַרְעֹה
  choice: பார்வோனுக்காக
  rationale: லாமேத், யோசேப்பு பார்வோனின் சார்பாக இந்த வாங்குதலைச் செய்ததை இங்கு குறிக்கிறது.
- source_word: הֵא
  choice: இதோ
  rationale: யோசேப்பு உடனடியாக வழங்கும் விதையை அறிமுகப்படுத்தும் சுட்டுச் சொல்லின் வலிமையைப் பேணுகிறது.
- source_word: זֶרַע
  choice: விதை
  rationale: விதைப்பதற்கான தானியத்தைக் குறிக்கும் நேரடியான தமிழ் சொல்; அடுத்த வினை அதன் பயன்பாட்டைத் தெளிவாக்குகிறது.
- source_word: וּזְרַעְתֶּם
  choice: நீங்கள் ... விதையுங்கள்
  rationale: நேரடி உரையில் இவ்வடிவம் கட்டளை அல்லது அறிவுறுத்தல் வலிமையைக் கொண்டுள்ளது. ‘விதையுங்கள்’ தமிழில் அந்தச் சூழ்நிலைச் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது; ‘நீங்கள்’ என்பது எபிரெய வினையில் உள்ள பன்மை எழுவாயை வெளிப்படையாக்குகிறது.
- source_word: הָאֲדָמָה
  choice: நிலத்தை
  rationale: பயிரிடப்பட வேண்டிய நிலத்தைக் குறிக்கிறது; முந்தைய ‘உங்கள் நிலம்’ என்பதோடு சொற்பொருள் ஒற்றுமையைப் பேணுகிறது.
theological_decisions:
- issue: மக்களையும் நிலத்தையும் பார்வோனுக்காக வாங்குதல்
  choice: ‘உங்களையும் உங்கள் நிலத்தையும் ... வாங்கியிருக்கிறேன்’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உங்களையும் உங்கள் நிலத்தையும் ... உடைமையாக்கியிருக்கிறேன்’
  rationale: மூல எபிரெயம் மக்களையும் நிலத்தையும் ஒரே வினையின் செயப்படுபொருள்களாக வைக்கிறது. அதன் சமூக-இறையியல் பதற்றத்தை மென்மையாக்காமல், קנה என்பதன் வாங்குதல் சார்ந்த முதன்மைப் பொருளைப் பேணுவது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை. ‘இதோ’ என்ற சொல் இரண்டு எபிரெயச் சுட்டிடைச்சொற்களின் வலிமையையும் பேணுகிறது. ‘விதையுங்கள்’ கட்டளையையும், ‘வாங்கியிருக்கிறேன்’ நிறைவு பெற்ற பரிவர்த்தனையையும் இயல்பாக வெளிப்படுத்துகின்றன.
