source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל פַּרְעֹ֔ה יְמֵי֙ שְׁנֵ֣י מְגוּרַ֔/י שְׁלֹשִׁ֥ים וּ/מְאַ֖ת שָׁנָ֑ה מְעַ֣ט וְ/רָעִ֗ים הָיוּ֙ יְמֵי֙ שְׁנֵ֣י חַיַּ֔/י וְ/לֹ֣א הִשִּׂ֗יגוּ אֶת יְמֵי֙ שְׁנֵי֙ חַיֵּ֣י אֲבֹתַ֔/י בִּ/ימֵ֖י מְגוּרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/009.yaml
  text: And Jacob said to Pharaoh[a], “The days of the years of my sojourning are one hundred thirty years. Few and evil have been the days of the years of my life[b], and they have not attained to the days of the years of the lives of my fathers in the days of their sojourning.”
translation:
  language: ta
  text: யாக்கோபு பார்வோனிடம், “நான் அந்நியனாக வாழ்ந்த[a] ஆண்டுகளின் நாட்கள் நூற்று முப்பது ஆண்டுகள். என் வாழ்வின் ஆண்டுகளின் நாட்கள் குறைவானவையும் துன்பமிக்கவையுமாக இருந்தன; அவை, என் முற்பிதாக்களின் அந்நிய வாழ்வின் நாட்களில் அவர்களுடைய வாழ்வின் ஆண்டுகளின் நாட்களை எட்டவில்லை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அந்நியனாக வாழ்ந்த” என்பதற்கு “தற்காலிகக் குடியிருப்பாளராக வாழ்ந்த” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், சொந்த நாட்டில் நிலையாகக் குடியிராமல் அந்நியராக வாழ்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְגוּרַי / מְגוּרֵיהֶם
  choice: நான் அந்நியனாகத் தங்கியிருந்த / என் தந்தையர் அந்நியர்களாகத் தங்கியிருந்த
  rationale: மָגוּרִים என்பது சொந்த நாட்டில் நிலையாகக் குடியிருப்பதைவிட அந்நியராக அல்லது தற்காலிகக் குடியிருப்பாளராக வாழ்வதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் வரலாற்றுப் பின்னணியைத் தெளிவாகவும் வெளிப்படுத்த இந்தச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְמֵי שְׁנֵי
  choice: ஆண்டுகளின் நாட்கள்
  rationale: எபிரெய மொழியின் ‘நாட்கள்—ஆண்டுகள்’ என்ற வேண்டுமென்றே அடுக்கப்பட்ட கம்பீரமான ஆயுட்காலச் சொல்லாட்சியை இயன்றவரைத் தக்கவைக்கிறது.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: நூற்று முப்பது ஆண்டுகள்
  rationale: எண்ணின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: מְעַט
  choice: குறைவானவையாக
  rationale: தன் தந்தையரின் ஆயுட்காலத்துடன் ஒப்பிடுகையில் யாக்கோபின் வாழ்நாட்கள் எண்ணிக்கையில் குறைவு என்ற நேரடிப் பொருளைத் தருகிறது.
- source_word: רָעִים
  choice: துன்பம் நிறைந்தவையாக
  rationale: இங்கு רַע என்பது நாட்களின் ஒழுக்கக்கேட்டைக் குறிக்காமல், யாக்கோபின் வாழ்க்கையில் நேர்ந்த துயரத்தையும் கடின அனுபவங்களையும் குறிக்கிறது; ‘தீயவையாக’ என்ற சொல் தமிழில் தவறான ஒழுக்கப் பொருளைத் தூண்டக்கூடும்.
- source_word: חַיַּי / חַיֵּי אֲבֹתַי
  choice: என் வாழ்நாள் / என் தந்தையர் வாழ்ந்த
  rationale: இவை உயிர்வாழ்ந்த காலம் அல்லது ஆயுட்காலத்தைக் குறிக்கின்றன; தமிழில் பொருள் தெளிவாக இருக்க இவ்வாறு அமைக்கப்பட்டது.
- source_word: הִשִּׂיגוּ
  choice: எட்டவில்லை
  rationale: ‘அடைதல், எட்டுதல், சமமாக வருதல்’ என்ற ஒப்பீட்டுப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲבֹתַי
  choice: என் தந்தையர்
  rationale: யாக்கோபுக்கு முந்திய முற்பிதாக்களைக் குறிக்கும் குடும்பத் தொடர்ச்சியை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: முற்பிதா தன்னை அந்நியக் குடியிருப்பாளராக விவரித்தல்
  choice: அந்நியனாகத் தங்கியிருந்த
  alternative: யாத்திரை செய்த
  rationale: இந்த எபிரெயச் சொல் முதன்மையாக அந்நியராக அல்லது தற்காலிகக் குடியிருப்பாளராக வாழ்ந்த நிலையைக் குறிக்கிறது. ‘யாத்திரை’ என்பது பிற்கால ஆன்மிகப் பொருளைத் தேவையின்றி இறக்குமதி செய்யக்கூடும்.
- issue: רָעִים என்பதன் மதிப்பீடு
  choice: துன்பம் நிறைந்தவையாக
  alternative: தீயவையாக
  rationale: இங்கு யாக்கோபின் வாழ்நாட்கள் ஒழுக்கரீதியாகத் தீயவை என்று அல்லாமல், துயரமும் இடர்ப்பாடும் கொண்டவை என்று கூறப்படுகின்றன. மூலச்சொல்லின் கடுமையைப் பாதுகாத்தபடி தமிழில் தவறான ஒழுக்கப் பொருளைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘நாட்கள்—ஆண்டுகள்’ மீளுரையைப் பாதுகாக்க சிறிது உயர்ந்த நடை ஏற்றுக்கொள்ளப்பட்டுள்ளது; அதேவேளையில் ‘அந்நியனாகத் தங்கியிருந்த’ மற்றும் ‘துன்பம் நிறைந்த’ போன்ற சொற்றொடர்கள் சாதாரண வாசகருக்கும் தெளிவாக உள்ளன.
