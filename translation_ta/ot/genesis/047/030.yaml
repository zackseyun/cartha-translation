  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/שָֽׁכַבְתִּי֙ עִם אֲבֹתַ֔/י וּ/נְשָׂאתַ֨/נִי֙ מִ/מִּצְרַ֔יִם וּ/קְבַרְתַּ֖/נִי בִּ/קְבֻרָתָ֑/ם וַ/יֹּאמַ֕ר אָנֹכִ֖י אֶֽעֱשֶׂ֥ה כִ/דְבָרֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/030.yaml
  text: When I lie down with my fathers[a], carry me out of Egypt and bury me in their burial place.” And he said[c][b], “I will do as you have said.”
translation:
  language: ta
  text: “நான் என் முன்னோர்களோடு படுத்துக்கொள்ளும்போது[a], என்னை எகிப்திலிருந்து எடுத்துச் சென்று, அவர்களுடைய அடக்க இடத்தில்[b] அடக்கம் செய்.” அதற்கு அவன், “நீ சொன்னபடியே நான் செய்வேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சார்ந்து, “நான் என் தந்தையரோடு படுத்துக்கொள்ளும்போது.” இது மரணம் மற்றும் அடக்கத்துடன் தொடர்புடைய வழக்கமான எபிரெயச் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுடைய கல்லறையில்” அல்லது “அவர்களுடைய கல்லறை மண்டபத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַבְתִּי
  choice: நான் ... படுத்துக்கொள்ளும்போது
  rationale: שׁכב என்பதன் ‘படுத்துக்கொள்’ என்ற உருவகத்தைத் தக்கவைத்தபடியே, இச்சூழலில் இணைப்பை இயல்பான தமிழுக்கேற்ப காலப்பொருளில் ‘போது’ என வழங்குகிறது; ‘இறக்கும்போது’ என்று வெளிப்படையாக மாற்றி மரண உருவகத்தைத் தீர்த்துவிடவில்லை.
- source_word: עִם אֲבֹתַי
  choice: என் முன்னோர்களோடு
  rationale: אָבוֹת இங்கு குடும்பத்தின் முந்தைய தலைமுறையினரைக் குறிக்கிறது. ‘என் தந்தையரோடு’ என்பது சொற்சார்ந்த மாற்றாக இருந்தாலும், நவீன தமிழில் ‘முன்னோர்களோடு’ என்பதே இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וּנְשָׂאתַנִי
  choice: என்னை ... எடுத்துச் சென்று
  rationale: נשא இங்கு உடலை எகிப்திலிருந்து வேறிடத்துக்குக் கொண்டு செல்வதைக் குறிக்கிறது. ‘எடுத்துச் சென்று’ என்பது இயக்கத்தையும் இறுதிச் சடங்கு சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִמִּצְרַיִם
  choice: எகிப்திலிருந்து
  rationale: מן குறிக்கும் புறப்பாட்டைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: וּקְבַרְתַּנִי
  choice: என்னை ... அடக்கம் செய்
  rationale: קבר என்பதற்கான நேரடியான, கண்ணியமான நவீனத் தமிழ் மொழிபெயர்ப்பு.
- source_word: בִּקְבֻרָתָם
  choice: அவர்களுடைய அடக்க இடத்தில்
  rationale: קְבֻרָה இங்கு புதைக்கப்பட்ட இடம் அல்லது கல்லறையைக் குறிக்கலாம். ‘அடக்க இடம்’ என்பது அதன் வடிவத்தை தேவையின்றிக் குறிப்பாக்காமல் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: וַיֹּאמַר
  choice: அதற்கு அவன் ... என்றான்
  rationale: யோசேப்பின் பதிலைத் தமிழ் கதைநடையில் இயல்பாக இணைக்கிறது; எபிரெய உரையில் பெயர் மீண்டும் இடம்பெறாததால் ‘அவன்’ தக்கவைக்கப்படுகிறது.
- source_word: אָנֹכִי אֶעֱשֶׂה
  choice: நான் செய்வேன்
  rationale: தனிப்பட்ட சுட்டுப்பெயரான אָנֹכִי தரும் உறுதியைத் தமிழில் வெளிப்படையான ‘நான்’ இயல்பாகச் சுமக்கிறது.
- source_word: כִדְבָרֶךָ
  choice: நீ சொன்னபடியே
  rationale: ‘உன் வார்த்தையின்படி’ என்ற சொற்சார்ந்த பொருளை, கீழ்ப்படிந்து செய்வதாக உறுதியளிக்கும் இயல்பான நவீனத் தமிழில் வழங்குகிறது.
theological_decisions:
- issue: ‘முன்னோர்களோடு படுத்துக்கொள்ளுதல்’ என்ற மரணச் சொற்றொடர்
  choice: உருவகத்தை முதன்மை உரையில் தக்கவைத்து, அதன் மரணம் மற்றும் அடக்கத்துடன் தொடர்புடைய வழக்குப் பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘நான் இறக்கும்போது’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: நேரடி மொழிபெயர்ப்பு பொருளைத் தெளிவாக்கினாலும், மூல எபிரெய மொழியின் குடும்பத் தொடர்ச்சியையும் அடக்கத்தையும் சுட்டும் உருவகத்தையும் அதன் இயல்பான இறுக்கத்தையும் இழக்கச் செய்யும்.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மரணத்தை நேரடியாகக் கூறாமல் மூலத்தின் ‘படுத்துக்கொள்ளுதல்’ என்ற உருவகம் பாதுகாக்கப்பட்டுள்ளது; ‘அடக்க இடம்’ என்பது குறிப்பிட்ட கல்லறை வடிவத்தைத் திணிக்காத இயல்பான சொல்.
