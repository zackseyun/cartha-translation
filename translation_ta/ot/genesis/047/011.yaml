revisions:
- from: யோசேப்பு தன் தந்தையையும் தன் சகோதரர்களையும் குடியமர்த்தி, பார்வோன் கட்டளையிட்டபடியே எகிப்து நாட்டில், அந்நாட்டின் மிகச் சிறந்த பகுதியான[a] ராமெசேஸ் நாட்டில், அவர்களுக்கு நிலத்தை உடைமையாகக் கொடுத்தான்.
