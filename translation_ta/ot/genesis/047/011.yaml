  text: וַ/יּוֹשֵׁ֣ב יוֹסֵף֮ אֶת אָבִ֣י/ו וְ/אֶת אֶחָי/ו֒ וַ/יִּתֵּ֨ן לָ/הֶ֤ם אֲחֻזָּה֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/מֵיטַ֥ב הָ/אָ֖רֶץ בְּ/אֶ֣רֶץ רַעְמְסֵ֑ס כַּ/אֲשֶׁ֖ר צִוָּ֥ה פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/011.yaml
  text: So Joseph settled his father and his brothers[a], and gave them a possession in the land of Egypt, in the best part of the land, in the land of Rameses, just as Pharaoh had commanded.
translation:
  language: ta
  text: யோசேப்பு தன் தந்தையையும் தன் சகோதரர்களையும் குடியமர்த்தி, அவர்களுக்கு எகிப்து நாட்டில், அந்நாட்டின் மிகச் சிறந்த பகுதியான ராமெசேஸ் நாட்டில், ஒரு நிலவுடைமையைக் கொடுத்தான்; பார்வோன் கட்டளையிட்டபடியே செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹשֵׁב
  choice: குடியமர்த்தி
  rationale: ישׁב என்பதன் ஹிஃபில் வடிவம் பிறரை வசிக்கச் செய்தல் என்ற காரணவினைப் பொருளைக் கொண்டது; ‘குடியமர்த்தி’ என்பது அதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: אָבִיו וְאֶת־אֶחָיו
  choice: தன் தந்தையையும் தன் சகோதரர்களையும்
  rationale: எபிரெய மூலத்தில் தந்தையும் சகோதரர்களும் தனித்தனியாகக் குறிப்பிடப்படுவதால், பொதுவான ‘குடும்பத்தினர்’ என்று விரிவுபடுத்தாமல் உறவுமுறைச் சொற்கள் நேரடியாக வைக்கப்பட்டுள்ளன.
- source_word: וַיִּתֵּן לָהֶם אֲחֻזָּה
  choice: அவர்களுக்கு நிலத்தை உடைமையாகக் கொடுத்தான்
  rationale: אֲחֻזָּה என்பது உடைமையாக வைத்திருக்கும் நிலப்பகுதியைக் குறிக்கிறது. ‘நிலத்தை உடைமையாக’ என்பது நிலவுடைமைப் பொருளைத் தெளிவாகக் காட்டுகிறது; ‘சுதந்தரம்’ என மொழிபெயர்த்து தேவையற்ற உடன்படிக்கை சார்ந்த நுண்பொருளைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டில்
  rationale: אֶרֶץ என்பதன் ‘நாடு/நிலம்’ என்ற பொருளை இங்கு இயல்பான தமிழில் ‘நாடு’ எனக் கொடுக்கிறது.
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: அந்நாட்டின் மிகச் சிறந்த பகுதியான
  rationale: מֵיטַב என்பது மிகச் சிறந்த அல்லது தேர்ந்த பகுதியைக் குறிக்கிறது. ராமெசேஸ் நாட்டை விளக்கும் தொடராகத் தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: בְּאֶרֶץ רַעְמְסֵס
  choice: ராமெசேஸ் நாட்டில்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; இங்குள்ள אֶרֶץ ஒரு பிரதேசத்தைக் குறிக்கக்கூடியதாக இருந்தாலும், மூலத்தின் மீளுரையை ஓரளவு காக்க ‘நாடு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר צִוָּה פַרְעֹה
  choice: பார்வோன் கட்டளையிட்டபடியே
  rationale: யோசேப்பின் செயல் பார்வோனின் முந்தைய கட்டளைக்கு முற்றிலும் ஏற்ப இருந்ததை ‘-படியே’ இயல்பாக வெளிப்படுத்துகிறது.
