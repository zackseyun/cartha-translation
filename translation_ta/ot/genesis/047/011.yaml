translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியக்கூடிய, அதேவேளை மரியாதையும் கண்ணியமும் கொண்ட நடையில் அமைக்கப்பட்டுள்ளது. மூலத்தின் காரணவினை, உறவுமுறைச் சொற்கள், நிலவுடைமைப் பொருள் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
