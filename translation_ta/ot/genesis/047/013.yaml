base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/013.yaml
  text: There was no food in all the land[a], because the famine was very severe[b]; and the land of Egypt and the land of Canaan languished because of the famine.
translation:
  language: ta
  text: பஞ்சம் மிகவும் கடுமையாக இருந்ததால், நாடு முழுவதிலும் உணவு எதுவும் கிடைக்கவில்லை[a]; எகிப்து நாடும் கானான் நாடும் பஞ்சத்தினால் தளர்ந்துபோயின[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அப்பம்’; இங்கு பொதுவாக உணவு அனைத்தையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘சோர்ந்துபோயின’ அல்லது ‘வலுவிழந்துபோயின.’ பஞ்சத்தின் துன்புறுத்தும் விளைவை எபிரெய வினை உருவகமாக விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: உணவு
  rationale: இச்சொல்லின் நேரடிப் பொருள் ‘அப்பம்’ என்றாலும், பஞ்சச் சூழலில் பொதுவாக எல்லா உணவையும் குறிக்கும் ஆகுபெயராக வருகிறது.
- source_word: אֵין
  choice: எதுவும் கிடைக்கவில்லை
  rationale: இறந்தகாலக் கதைச்சூழலில் உணவு இல்லாமையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: בְּכָל הָאָרֶץ
  choice: நாடு முழுவதிலும்
  rationale: இங்கு הָאָרֶץ என்பது உலகம் முழுவதையும் அல்ல, சூழலில் குறிப்பிடப்படும் பாதிக்கப்பட்ட பிரதேசம் முழுவதையும் குறிக்கிறது.
- source_word: כָבֵד ... מְאֹד
  choice: மிகவும் கடுமையாக
  rationale: ‘மிகவும் கனமாக’ என்ற சொற்சொல் மொழிபெயர்ப்புக்குப் பதிலாக, பஞ்சத்தின் தீவிரத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַתֵּלַהּ
  choice: தளர்ந்துபோயின
  rationale: பஞ்சத்தின் வலுவிழக்கச் செய்யும் விளைவால் நாடுகள் சோர்ந்து, சக்தியிழந்த நிலையை உருவகமாகக் காட்டும் எபிரெய வினையின் பொருளைப் பேணுகிறது.
- source_word: אֶרֶץ מִצְרַיִם וְאֶרֶץ כְּנַעַן
  choice: எகிப்து நாடும் கானான் நாடும்
  rationale: இரு நிலப்பகுதிகளையும் எபிரெய மூலத்தைப் போலவே புவியியல் அலகுகளாகக் குறிப்பிடுகிறது.
- source_word: מִפְּנֵי הָרָעָב
  choice: பஞ்சத்தினால்
  rationale: எபிரெய காரணப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
