translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொடக்க וְ என்பதற்காக மூலத்தில் இல்லாத காலக் குறிப்பு சேர்க்கப்படவில்லை. ‘நாடுகள் தளர்ந்துபோயின’ என்ற உருவகம் மூலத்தின் ஆளுருவகத் தன்மையையும் பொருள் நெகிழ்வையும் பேணுகிறது.
