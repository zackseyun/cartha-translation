translation_notes:
  register: இயல்பான நவீனத் தரத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. பார்வோனின் நேரடியான கட்டளைத் தொனியை ஒருமை இரண்டாம் நபர் வடிவங்கள் தக்கவைக்கின்றன. எபிரெய உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் சூழல்சார் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு a/b உள்ளடக்கங்கள் இடமாறியிருந்ததால், தமிழில் குறிகள் அவை சார்ந்த சொற்றொடர்களுடன் சரியாகப் பொருத்தப்பட்டுள்ளன.
