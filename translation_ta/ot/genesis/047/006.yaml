base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/006.yaml
  text: The land of Egypt is before you[a]. Settle your father and your brothers in the best of the land; let them live in the land of Goshen. And if you know that there are capable men among them[b], then appoint them as overseers of the livestock that belongs to me.
translation:
  language: ta
  text: எகிப்து நாடு உன் முன் இருக்கிறது[a]. நாட்டின் மிகச் சிறந்த பகுதியில் உன் தந்தையையும் உன் சகோதரர்களையும் குடியமர்த்து; அவர்கள் கோசேன் நாட்டில் குடியிருக்கட்டும். அவர்களில் திறமையுள்ள ஆட்கள் இருப்பதாக உனக்குத் தெரிந்தால்[b], அவர்களை எனக்குச் சொந்தமான கால்நடைகளின் மேற்பார்வையாளர்களாக நியமி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் முன் இருக்கிறது’ என்பது, எகிப்துக்குள் ஓர் இடத்தைத் தேர்ந்தெடுக்க யோசேப்புக்கு அனுமதி இருப்பதைக் குறிக்கக்கூடிய எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: அல்லது ‘ஆற்றலுள்ள ஆட்கள்,’ ‘தகுதியுள்ள ஆட்கள்’; சொல்லுக்குச் சொல், ‘வலிமை/ஆற்றலுடைய மனிதர்கள்.’ இங்கு இச்சொற்றொடர் போர்வீரத்தைக் கட்டாயமாகக் குறிக்காது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ מִצְרַיִם לְפָנֶיךָ הִוא
  choice: எகிப்து நாடு உன் முன் இருக்கிறது
  rationale: לְפָנֶיךָ என்பதன் ‘உன் முன்’ என்ற எபிரெய உருவகத்தைத் தக்கவைக்கிறது; சூழலில் எகிப்துக்குள் இடத்தைத் தேர்ந்தெடுக்கும் உரிமையை இது குறிக்கிறது.
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: நாட்டின் மிகச் சிறந்த பகுதியில்
  rationale: מֵיטַב குறிக்கும் மிகச் சிறந்த அல்லது தேர்ந்தெடுக்கத்தக்க நிலப்பகுதியை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: הוֹשֵׁב
  choice: குடியமர்த்து
  rationale: ישׁב என்பதன் ஹிஃபில் கட்டளை வடிவிலுள்ள காரணவினைப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יֵשְׁבוּ
  choice: குடியிருக்கட்டும்
  rationale: இங்கு குறிக்கப்படுவது ஒரு இடத்தில் வசிப்பது; தமிழில் அனுமதி/ஏவல் நுணுக்கத்துடன் இயல்பாக அமைகிறது.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: கோசேன் நாட்டில்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள ‘நாடு/நிலம்’ என்ற சொல்லைத் தக்கவைக்கிறது.
- source_word: וְאִם יָדַעְתָּ וְיֶשׁ בָּם
  choice: அவர்களில் ... இருப்பதாக உனக்குத் தெரிந்தால்
  rationale: யோசேப்பின் அறிவை அடிப்படையாகக் கொண்ட நிபந்தனையைத் தெளிவான தமிழ் வாக்கிய அமைப்பில் தருகிறது.
- source_word: אַנְשֵׁי חַיִל
  choice: திறமையுள்ள ஆட்கள்
  rationale: חַיִל இங்கு போர்வீரத்தைக் கட்டாயமாகக் குறிக்காமல் வலிமை, ஆற்றல், தகுதி ஆகியவற்றைக் குறிக்கலாம்; கால்நடை நிர்வாகச் சூழலில் ‘திறமையுள்ள’ பொருத்தமானது.
- source_word: וְשַׂמְתָּם
  choice: அவர்களை ... நியமி
  rationale: ஒரு பொறுப்பில் வைப்பதைச் சூழலுக்கேற்ற நிர்வாகச் சொல்லால் தெரிவிக்கிறது.
- source_word: שָׂרֵי מִקְנֶה
  choice: கால்நடைகளின் மேற்பார்வையாளர்கள்
  rationale: שָׂרֵי என்பதன் பொறுப்பாளர்/அதிகாரி பொருளையும் מִקְנֶה என்பதன் கால்நடைப் பொருளையும் தெளிவாக வழங்குகிறது.
- source_word: עַל אֲשֶׁר לִי
  choice: எனக்குச் சொந்தமான கால்நடைகளின்
  rationale: ‘எனக்குரியவற்றின் மேல்’ என்ற மூலப்பொருளில் குறிக்கப்படும் பொருள் கால்நடைகள் என்பதைத் தமிழில் வெளிப்படையாக்குகிறது.
