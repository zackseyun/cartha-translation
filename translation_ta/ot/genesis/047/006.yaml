  source_fidelity: 'மூல எபிரெய உரையின் வாக்கிய அமைப்பும் பொருளும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன: எகிப்து யோசேப்பின் முன்/கிடைப்பில் இருப்பது, நாட்டின் சிறந்த பகுதியில் குடும்பத்தை குடியமர்த்துதல், கோசேனில் வசித்தல், தகுதியானவர்களைப் பார்வோனின் கால்நடைகளுக்குப் பொறுப்பாளர்களாக நியமித்தல் ஆகிய அனைத்தும் பாதுகாக்கப்பட்டுள்ளன. ‘எனக்குச் சொந்தமான கால்நடைகள்’ என்பது עַל אֲשֶׁר לִי என்பதன் சூழல்சார் குறிப்பைத் தெளிவாகவும் நியாயமாகவும் வெளிப்படுத்துகிறது.'
