  text: וּ/מִ/קְצֵ֣ה אֶחָ֔י/ו לָקַ֖ח חֲמִשָּׁ֣ה אֲנָשִׁ֑ים וַ/יַּצִּגֵ֖/ם לִ/פְנֵ֥י פַרְעֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/002.yaml
  text: From among his brothers he took five men and presented them before Pharaoh[a].
translation:
  language: ta
  text: அவன் தன் சகோதரர்களில் ஐந்து பேரை அழைத்துக்கொண்டு, அவர்களைப் பார்வோனுக்கு முன்பாக நிறுத்தினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் சகோதரர்களின் ஓரத்திலிருந்து”; வேறு ஒரு விளக்கத்தின்படி, “தன் சகோதரர்களில் சிறந்தவர்களிலிருந்து.” எபிரெயச் சொற்றொடர் சொல்லுக்கு சொல் “ஓரத்திலிருந்து/முனையிலிருந்து” எனப் பொருள்படும்; இங்கே யோசேப்பு தன் சகோதரர்களில் ஐந்து பேரைத் தேர்ந்தெடுத்ததைக் குறிக்கும் பகுதிப்பொருளில் பயன்படுத்தப்பட்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְצֵה אֶחָיו
  choice: தன் சகோதரர்களில்
  rationale: מִקְצֵה என்பதன் நேரடிப் பொருள் ‘ஓரத்திலிருந்து/முனையிலிருந்து’ என்றாலும், இச்சூழலில் ஒரு பெரிய குழுவிலிருந்து சிலரை எடுத்துக்கொள்வதைக் குறிக்கும் பகுதிப்பொருளில் இருப்பது இயல்பானது. ‘தன் சகோதரர்களில்’ என்பது அந்தப் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது; ‘சிறந்தவர்களில்’ என்ற விளக்கத்தை உரைக்குள் திணிக்கவில்லை.
- source_word: לָקַח
  choice: அழைத்துக்கொண்டு
  rationale: לָקַח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொண்டான்.’ மனிதர்களைப் பற்றிய இச்சூழலில் ‘அழைத்துக்கொண்டு’ என்பது இயல்பான தமிழாகவும், ஐந்து சகோதரர்களைத் தன்னுடன் கூட்டிச் சென்ற செயலைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: חֲמִשָּׁה אֲנָשִׁים
  choice: ஐந்து பேரை
  rationale: இவர்கள் ஏற்கெனவே ‘சகோதரர்கள்’ என அடையாளப்படுத்தப்பட்டுள்ளதால், ‘ஐந்து மனிதர்களை’ என்பதைக் காட்டிலும் ‘ஐந்து பேரை’ என்பது இயல்பான தமிழாகும்; எண்ணிக்கையையும் ஆண் நபர்களைக் குறிக்கும் சூழலையும் தக்கவைக்கிறது.
- source_word: וַיַּצִּגֵם
  choice: அவர்களை ... நிறுத்தினான்
  rationale: יָצַג என்பதன் ஹிபீல் வடிவம் ஒருவரை மற்றொருவரின் முன் நிறுத்துதல் அல்லது ஆஜர்படுத்துதல் எனப் பொருள்படும். அரசவைக் காட்சியில் ‘முன்பாக நிறுத்தினான்’ என்பது மூலத்தின் வடிவத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: לִפְנֵי פַרְעֹה
  choice: பார்வோனுக்கு முன்பாக
  rationale: לִפְנֵי என்பது ‘முன்பாக/சந்நிதியில்’ எனப் பொருள்படும். ‘பார்வோனுக்கு முன்பாக’ என்பது சுருக்கமானதும் வழக்கமானதும் ஆகும்.
