base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/007.yaml
  text: Then Joseph brought in Jacob his father and presented him before Pharaoh[b][a], and Jacob blessed Pharaoh.
translation:
  language: ta
  text: பின்பு யோசேப்பு தன் தந்தையான யாக்கோபை அழைத்து வந்து, பார்வோனின் முன்னிலையில் நிறுத்தினார்[a]. யாக்கோபு பார்வோனை ஆசீர்வதித்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘அவரைப் பார்வோனுக்கு முன்பாக நிற்கச் செய்தார்.’
    reason: lexical_alternative
  - marker: b
    text: ‘ஆசீர்வதித்தார்’ என்பது வெறும் மரியாதை வாழ்த்தை மட்டுமல்லாமல், முறையாகச் சொல்லப்பட்ட ஆசீர்வாதத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: அழைத்து வந்து
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் யோசேப்பு யாக்கோபைப் பார்வோனின் முன்னிலைக்கு வரச்செய்ததைக் குறிக்கிறது. நவீன தமிழில் ‘அழைத்து வந்து’ என்பது இந்தச் செயப்பாட்டு வலிமையையும் அரசவைச் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אָבִיו
  choice: தன் தகப்பனாகிய
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு யோசேப்பைக் குறிக்கிறது. ‘தன் தகப்பனாகிய’ என்பது தொடர்பைத் தெளிவாகவும் மரியாதையான வேதாகம நடையிலும் தெரிவிக்கிறது.
- source_word: וַיַּעֲמִדֵהוּ לִפְנֵי
  choice: முன்னிலையில் நிறுத்தினார்
  rationale: עמד என்பதன் ஹிஃபில் வடிவத்திற்கு நேரடியாக ‘நிற்கச் செய்தார்’ என்ற பொருள் உண்டு. ‘முன்னிலையில் நிறுத்தினார்’ என்பது அந்தக் காரணவினைப் பொருளையும் முறையான அரசவை அறிமுகத்தையும் காக்கிறது.
- source_word: לִפְנֵי פַרְעֹה
  choice: பார்வோனின் முன்னிலையில்
  rationale: לִפְנֵי என்பது ‘முன்’ அல்லது ‘முன்னிலையில்’ எனப் பொருள்படும். இங்கு நேரடியான இடப்பொருளைவிட ஒருவரின் சந்நிதியில் நிறுத்தப்படுதல் முக்கியம் என்பதால் ‘முன்னிலையில்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיְבָרֶךְ
  choice: ஆசீர்வதித்தார்
  rationale: ברך என்பதன் வழக்கமான பொருள் ‘ஆசீர்வதித்தல்.’ இதை வெறும் மரியாதை வாழ்த்தாகக் குறுக்காமல், மூலத்தின் வலிமையையும் இறையியல் பதற்றத்தையும் காக்கிறது.
- source_word: פַרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரசருக்கான பட்டத்தின் தமிழில் நிலைபெற்ற வேதாகம வடிவம்.
- source_word: וַ
  choice: பின்பு
  rationale: தொடர்ச்சியான நிகழ்வை முன்னெடுக்கும் waw-consecutive-ஐ நவீன தமிழ் கதைநடையில் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: யாக்கோபு பார்வோனிடம் செய்த செயலின் பொருள்
  choice: யாக்கோபு பார்வோனை உண்மையாகவே ஆசீர்வதித்தார்
  alternative: யாக்கோபு பார்வோனை மரியாதையாக வாழ்த்தினார்
  rationale: ברך என்ற வினையின் முதன்மைப் பொருள் ‘ஆசீர்வதித்தல்.’ சமூக நிலையில் குறைந்தவராகத் தோன்றும் முற்பிதா பேரரசனை ஆசீர்வதிக்கிறார் என்ற உரையின் இறையியல் பதற்றத்தை ‘வாழ்த்தினார்’ என்று மெலிதாக்காமல் காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. ‘தகப்பன்,’ ‘பார்வோன்,’ ‘ஆசீர்வதித்தார்’ ஆகியவை பொதுவான தமிழ் வேதாகமப் பயன்பாட்டுடன் தொடர்பைத் தக்கவைக்கின்றன; அதேவேளை வாக்கிய அமைப்பு தற்போதைய வாசகர்களுக்குத் தெளிவாக உள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
