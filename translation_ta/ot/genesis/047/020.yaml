  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. எபிரெய உரையின் பொருளாதாரச் சூழல், ஒவ்வொருவரையும் குறிக்கும் பகிர்ந்தளிக்கும் அமைப்பு, பஞ்சம் மக்கள்மேல் அழுத்திய உருவகம், இறுதியில் ஏற்பட்ட உரிமை மாற்றம் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
