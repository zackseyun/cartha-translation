base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/020.yaml
  text: So Joseph bought all the land of Egypt for Pharaoh[a], because every Egyptian sold his field, for the famine was severe upon them[b]; and the land became Pharaoh’s.
translation:
  language: ta
  text: ஆகவே யோசேப்பு எகிப்தின் நிலம் முழுவதையும் பார்வோனுக்காக வாங்கினார்[a]. பஞ்சம் அவர்கள்மேல் கடுமையாக இருந்ததால், எகிப்தியர் ஒவ்வொருவரும் தம் வயலை விற்றனர்[b]. இவ்வாறு அந்த நிலம் பார்வோனுக்குச் சொந்தமானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எகிப்தின் நிலம் முழுவதையும் பார்வோனுக்காகக் கையகப்படுத்தினார்.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லெழுத்தாக, “பஞ்சம் அவர்கள்மேல் வலிமையாக இருந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: வாங்கினார்
  rationale: קנה என்பது இங்கு எகிப்தியர்கள் தங்கள் வயல்களை விற்ற வணிகச் சூழலில் விலைகொடுத்து உரிமையாக்குவதைக் குறிக்கிறது; எனவே இயல்பான நேரடி மொழிபெயர்ப்பு ‘வாங்கினார்’.
- source_word: כָּל אַדְמַת מִצְרַיִם
  choice: எகிப்தின் நிலம் முழுவதையும்
  rationale: אַדְמָה இங்கு வெறும் மண் அல்ல, விற்பனைக்கும் உரிமை மாற்றத்திற்கும் உட்பட்ட நிலச்சொத்தைக் குறிக்கிறது. כָּל என்பதன் முழுமை ‘முழுவதையும்’ என்று வெளிப்படுத்தப்படுகிறது.
- source_word: לְפַרְעֹה
  choice: பார்வோனுக்காக
  rationale: לְ இங்கு வாங்குதலின் பயனாளி அல்லது உரிமைப் பெறுநராகப் பார்வோனைச் சுட்டுகிறது; யோசேப்பு பார்வோனின் சார்பில் செயல்பட்டதை ‘பார்வோனுக்காக’ இயல்பாகக் காட்டுகிறது.
- source_word: מִצְרַיִם אִישׁ שָׂדֵהוּ
  choice: எகிப்தியர்கள் ... ஒவ்வொருவரும் தங்கள் வயலை
  rationale: கூட்டுப் பெயருடன் வரும் אִישׁ மற்றும் ஒருமை உடைமை வடிவத்தின் பகிர்ந்தளிக்கும் பொருளை, நவீன தமிழில் ‘எகிப்தியர்கள் ... ஒவ்வொருவரும் தங்கள் வயலை’ தெளிவாகத் தருகிறது.
- source_word: חָזַק עֲלֵהֶם הָרָעָב
  choice: பஞ்சம் எகிப்தியர்கள்மேல் கடுமையாக இருந்தது
  rationale: חזק என்பதன் சொற்பொருள் ‘வலுவாக இருந்தது’; பஞ்சத்தைப் பற்றிய தமிழ்ச் சொல்லாட்சியில் ‘கடுமையாக இருந்தது’ அதன் தீவிரத்தை இயல்பாக உணர்த்துகிறது. עַל கூறும் அழுத்தத்தின் உருவகம் ‘மேல்’ என்பதால் ஓரளவு பாதுகாக்கப்படுகிறது.
- source_word: וַתְּהִי הָאָרֶץ לְפַרְעֹה
  choice: அந்த நிலம் பார்வோனுக்குச் சொந்தமானது
  rationale: இந்த இறுதிக் கூறு உரிமை மாற்றத்தின் விளைவைத் தெரிவிக்கிறது. ‘சொந்தமானது’ என்பது புதிய சட்டபூர்வ உரிமையை இயல்பான தமிழில் துல்லியமாகக் காட்டுகிறது.
