    text: 'அல்லது, இன்னும் முறையான வடிவில்: “பார்வோன் யோசேப்பிடம் சொல்லி, ‘உன் தந்தையும் உன் சகோதரர்களும் உன்னிடம் வந்தார்கள்’ என்றான்.”'
