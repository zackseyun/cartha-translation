lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னேற்றுகிறது; நவீன தமிழில் ‘அப்போது’ அதன் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரசனுக்கான இந்தப் பட்டத்தின் வழக்கமான தமிழ் வேதாகம வடிவம்.
- source_word: אֶל יוֹסֵף
  choice: யோசேப்பிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான தமிழில் குறிக்கிறது.
- source_word: לֵאמֹר
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: எபிரெய மொழியில் நேர்க்கூற்றை அறிமுகப்படுத்தும் வழக்கமான சொல்; ‘என்றான்’ என்பதோடு தமிழில் தனியே ‘சொல்லி’ எனச் சேர்ப்பது தேவையற்ற மீளுரையாக இருக்கும்.
- source_word: אָבִיךָ
