- source_word: וְאַחֶיךָ
  choice: உன் சகோதரர்களும்
  rationale: மூலத்தின் ஆண்பால் குடும்ப உறவுச் சொல்லை ‘குடும்பத்தினர்’ என்று பொதுமைப்படுத்தாமல் தக்கவைக்கிறது; இணைப்பை தமிழின் ‘-உம்’ அமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּאוּ
  choice: வந்திருக்கிறார்கள்
  rationale: முடிவுற்ற வருகையின் தற்போதைய பொருத்தத்தைத் தமிழின் நிகழ்கால நிறைவு வடிவம் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֵלֶיךָ
  choice: உன்னிடம்
  rationale: யோசேப்பை நோக்கிய வருகையைத் துல்லியமாகக் குறிக்கிறது; மூலத்தில் இல்லாத ‘இங்கே’ என்பதைக் கூட்டவில்லை.
