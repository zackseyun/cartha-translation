  language: ta
  text: அப்போது பார்வோன் யோசேப்பிடம், “உன் தந்தையும் உன் சகோதரர்களும் உன்னிடம் வந்திருக்கிறார்கள்” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
