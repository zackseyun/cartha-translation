    issue: ‘உண்மைத்தன்மை’ is less precise for אֱמֶת in this paired expression.
    rationale: In this context אֱמֶת denotes reliability, dependability, or faithful dealing. ‘நம்பகத்தன்மை’ better conveys that sense in modern Tamil.
  - severity: low
