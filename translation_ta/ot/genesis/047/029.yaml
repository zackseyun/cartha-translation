  text: וַ/יִּקְרְב֣וּ יְמֵֽי יִשְׂרָאֵ֘ל לָ/מוּת֒ וַ/יִּקְרָ֣א לִ/בְנ֣/וֹ לְ/יוֹסֵ֗ף וַ/יֹּ֤אמֶר ל/וֹ֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ שִֽׂים נָ֥א יָדְ/ךָ֖ תַּ֣חַת יְרֵכִ֑/י וְ/עָשִׂ֤יתָ עִמָּדִ/י֙ חֶ֣סֶד וֶ/אֱמֶ֔ת אַל נָ֥א תִקְבְּרֵ֖/נִי בְּ/מִצְרָֽיִם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/029.yaml
  text: When the days of Israel drew near for him to die[a], he called his son Yosef and said to him, “If now I have found favor in your eyes, please put your hand under my thigh, and deal with me in steadfast love and faithfulness[b]. Please do not bury me in Egypt.”
translation:
  language: ta
  text: இஸ்ரவேலின் நாட்கள் இறப்பதற்கு நெருங்கியபோது, அவர் தம் மகன் யோசேப்பை அழைத்து, “நான் உன் பார்வையில் தயவைப் பெற்றிருந்தால், தயவுசெய்து உன் கையை என் தொடையின் கீழ் வை[a]. என்னிடம் மாறாத அன்போடும் நம்பகத்தன்மையோடும் நடந்துகொள்[b]. தயவுசெய்து என்னை எகிப்தில் அடக்கம் செய்யாதே” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் கையை என் தொடையின் கீழ் வை’ என்பது முற்பிதாக்களின் வரலாற்றில் உறுதிமொழியுடன் தொடர்புடைய ஒரு சைகை; ஆதியாகமம் 24:2-ஐ ஒப்பிடுக.
    reason: cultural_note
  - marker: b
    text: ‘மாறாத அன்பும் நம்பகத்தன்மையும்’ என மொழிபெயர்க்கப்பட்ட எபிரேயச் சொல் இணை, பற்றுறுதியுள்ள அன்பையும் நம்பகமான செயலையும் குறிக்கிறது. ‘பற்றுறுதியுள்ள அன்போடும் உண்மையோடும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי יִשְׂרָאֵל לָמוּת
  choice: இஸ்ரவேல் இறக்கும் காலம் நெருங்கியபோது
  rationale: எபிரேய மொழிப்படிமம் சொற்சொல்லாக ‘இஸ்ரவேலின் நாட்கள் இறப்பதற்காக நெருங்கின’ என்கிறது. தமிழில் இயல்பாகவும் பொருள் தெளிவாகவும் இருக்க ‘இறக்கும் காலம் நெருங்கியபோது’ என்று வழங்கப்பட்டது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: மூலத்தில் ‘யாக்கோபு’ என்பதற்குப் பதிலாக ‘இஸ்ரவேல்’ என்ற பெயரே இருப்பதால் அது அப்படியே காக்கப்பட்டது.
- source_word: לִבְנוֹ לְיוֹסֵף
  choice: தம் மகன் யோசேப்பை
  rationale: יוֹסֵף என்ற எபிரேயப் பெயருக்கு நவீனத் தமிழில் பரவலாக அறியப்படும் ‘யோசேப்பு’ வடிவம் பயன்படுத்தப்பட்டது; மரியாதை ஒருமைக்கு ஏற்றவாறு ‘தம்’ சேர்க்கப்பட்டது.
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: உன் பார்வையில் எனக்குத் தயவு கிடைத்திருக்குமானால்
  rationale: இது பணிவான வேண்டுகோளை அறிமுகப்படுத்தும் எபிரேய மரபுத்தொடர். ‘உன் பார்வையில்’ மூல உருவகத்தையும் ‘தயவு கிடைத்திருக்குமானால்’ அதன் வேண்டுகோள் நயத்தையும் காக்கின்றன.
- source_word: שִׂים נָא יָדְךָ תַּחַת יְרֵכִי
  choice: தயவுசெய்து உன் கையை என் தொடைக்குக் கீழே வை
  rationale: நָא என்பதன் பணிவான வேண்டுகோள் வலிமை ‘தயவுசெய்து’ என வழங்கப்பட்டது. முற்பிதாக்களின் வரலாற்றில் காணப்படும் உறுதிமொழிச் சைகை மாற்றிப் பொருளுரைக்கப்படாமல் நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: וְעָשִׂיתָ עִמָּדִי חֶסֶד וֶאֱמֶת
  choice: எனக்கு மாறாத அன்புடனும் உண்மைத்தன்மையுடனும் நடந்துகொள்
  rationale: עָשָׂה עִם என்பது ஒருவரிடம் ஒரு விதத்தில் நடந்துகொள்வதைக் குறிக்கிறது. חֶסֶד என்பதன் பற்றுறுதியுள்ள அன்பும் אֱמֶת என்பதன் நம்பகமான உண்மைத்தன்மையும் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டன.
- source_word: אַל נָא תִקְבְּרֵנִי בְּמִצְרָיִם
  choice: தயவுசெய்து என்னை எகிப்தில் அடக்கம் செய்யாதே
  rationale: எதிர்மறை வேண்டுகோளில் உள்ள நָא பணிவை ‘தயவுசெய்து’ காட்டுகிறது; ‘அடக்கம் செய்யாதே’ என்பது சூழலுக்கு ஏற்ற இயல்பான தமிழ்.
theological_decisions:
- issue: חֶסֶד וֶאֱמֶת என்ற இணைச்சொல்லின் பொருள்
  choice: மாறாத அன்பும் உண்மைத்தன்மையும்
  alternative: உடன்படிக்கைப் பற்றுறுதியும் உண்மையும்; பேரன்பும் நம்பகத்தன்மையும்
  rationale: குடும்பக் கடமையையும் உறுதிமொழிச் சூழலையும் இந்தச் சொற்கள் சுட்டினாலும், மூலத்தில் வெளிப்படையாக இல்லாத ‘உடன்படிக்கை’ என்ற சொல்லை முதன்மை உரையில் சேர்க்கவில்லை. அன்பு, பற்றுறுதி, நம்பகத்தன்மை ஆகிய பொருள் நிழல்கள் அடிக்குறிப்பில் காக்கப்பட்டன.
- issue: ‘கையை தொடைக்குக் கீழே வைப்பது’ என்ற சைகை
  choice: முதன்மை உரையில் நேரடியாக மொழிபெயர்த்து அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘எனக்கு ஆணையிட்டுக் கொடு’ என்று பொருளுரைத்தல்
  rationale: சைகையின் பண்பாட்டு வடிவம் மூலக்கதையின் ஒரு பகுதியாக இருப்பதால் அது அகற்றப்படவில்லை; வாசகருக்கு அதன் செயல்பாடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடையின் கண்ணியமும் காக்கப்பட்டுள்ளன. தேவையற்ற சமயக் குழுச் சொற்கள் தவிர்க்கப்பட்டன. ‘தயவுசெய்து’ என்ற மறுபயன்பாடு மூலத்தில் இருமுறை வரும் נָא என்பதன் பணிவான மன்றாட்டை பிரதிபலிக்கிறது.
