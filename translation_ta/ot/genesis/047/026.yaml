  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. சட்டம் தொடர்ந்து நிலைத்திருப்பதைத் தெளிவுபடுத்தியபோதும், பார்வோனுக்கான ஐந்தில் ஒரு பங்கு வரியா, விளைச்சல் பங்கா என்பதை மூலத்தை மீறி குறிப்பாகத் தீர்மானிக்கவில்லை.
