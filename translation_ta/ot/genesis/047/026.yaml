base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/026.yaml
  text: 'So Joseph made it a statute that stands to this day concerning the land of Egypt: the fifth is for Pharaoh[d][c][b][a]. Only the land of the priests alone did not become Pharaoh’s.'
translation:
  language: ta
  text: 'இவ்வாறு, யோசேப்பு இதை எகிப்து நாட்டின் நிலத்தைக் குறித்த, இன்றுவரை நிலைத்திருக்கும் சட்டமாக ஏற்படுத்தினான்: ஐந்தில் ஒரு பங்கு பார்வோனுக்குரியது.[a] ஆசாரியர்களின் நிலம் மட்டுமே பார்வோனுடையதாக ஆகவில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, இருபது விழுக்காடு. எபிரெயச் சொற்றொடரை ‘ஐந்தில் ஒரு பங்கு பார்வோனுக்கு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָהּ לְחֹק
  choice: இதை ... சட்டமாக ஏற்படுத்தினான்
  rationale: שׂוּם உடன் לְחֹק வருவது ஒரு விதியைச் சட்டமாக நிறுவுவதைக் குறிக்கிறது. அֹתָהּ முந்தைய வசனத்தில் கூறப்பட்ட ஏற்பாட்டைச் சுட்டுகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை நிலைத்திருக்கும்
  rationale: கதைசொல்லியின் காலம்வரை அந்தச் சட்டம் தொடர்ந்து நடைமுறையில் இருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַל אַדְמַת מִצְרַיִם
  choice: எகிப்து நாட்டின் நிலத்திற்கான
  rationale: עַל இங்கு சட்டத்தின் பயன்பாட்டு வரம்பைக் குறிக்கிறது; எனவே நிலம் பற்றிய அல்லது நிலத்திற்குப் பொருந்தும் சட்டம் என்ற பொருள் தரப்படுகிறது.
- source_word: לְפַרְעֹה לַחֹמֶשׁ
  choice: ஐந்தில் ஒரு பங்கு பார்வோனுக்குரியது
  rationale: சுருக்கமான எபிரெய வினையற்ற தொடரின் உறவைத் தெளிவான தமிழில் தருகிறது; חֹמֶשׁ என்பது ஐந்தில் ஒரு பங்கை குறிக்கிறது.
- source_word: רַק ... לְבַדָּם
  choice: ஆசாரியர்களின் நிலம் மட்டுமே
  rationale: רַק மற்றும் לְבַדָּם ஆகிய இரண்டும் விதிவிலக்கை வலியுறுத்துகின்றன. தமிழில் ‘மட்டுமே’ அவற்றின் ஒருங்கிணைந்த கட்டுப்படுத்தும் வலிமையை இயல்பாகக் கொண்டுவருகிறது.
- source_word: לֹא הָיְתָה לְפַרְעֹה
  choice: பார்வோனுடையதாக ஆகவில்லை
  rationale: முந்தைய நிலப் பரிமாற்றத்துடன் உள்ள முரண்பாட்டைத் தக்கவைத்து, அந்த நிலம் பார்வோனின் உடைமையாக மாறாததைச் சொல்கிறது.
