  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶֽל יַעֲקֹ֑ב כַּ/מָּ֕ה יְמֵ֖י שְׁנֵ֥י חַיֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/008.yaml
  text: And Pharaoh said to Jacob[b][a], “How many are the days of the years of your life?”
translation:
  language: ta
  text: பார்வோன் யாக்கோபிடம், “உங்கள் வாழ்வின் ஆண்டுகளின் நாட்கள் எத்தனை?”[a] என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயச் சொற்றொடர் வயதை, “உங்கள் வாழ்வின் ஆண்டுகளின் நாட்கள்” என்று குறிப்பிடுகிறது. இயல்பான தமிழில்: “உங்களுக்கு எத்தனை வயது?”'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்று கேட்டான்
  rationale: இங்கு ‘சொன்னான்’ என்று நேரடியாக மொழிபெயர்க்கலாம்; ஆனால் கேள்வி வாக்கியத்தை அறிமுகப்படுத்துவதால், நவீன தமிழில் ‘கேட்டான்’ என்பது இயல்பாகவும் பொருள்துல்லியமாகவும் உள்ளது. வாவ் தொடர் கதையின் முன்னேற்றத்தைச் சுட்டுகிறது; தமிழில் தனியே ‘மேலும்’ சேர்ப்பது தேவையில்லை.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரசருக்கான பட்டத்தின் தமிழில் நிலைபெற்ற வேதாகம வடிவம்.
- source_word: אֶל יַעֲקֹב
  choice: யாக்கோபிடம்
  rationale: אֶל முகவரியைச் சுட்டுகிறது; ‘யாக்கோபிடம்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: כַּמָּה
  choice: எத்தனை
  rationale: நாட்கள் அல்லது ஆண்டுகளின் எண்ணிக்கையை வினவும் அளவுச் சொல்.
- source_word: יְמֵי שְׁנֵי חַיֶּיךָ
  choice: உங்கள் வாழ்நாளின் ஆண்டுகள்
  rationale: எபிரெயச் சொற்றொடர் சொற்சொல்லாக ‘உங்கள் வாழ்க்கையின் ஆண்டுகளுடைய நாட்கள்’ என அமைகிறது. அந்த அடுக்குமுறை தமிழில் செயற்கையாக இருப்பதால், வயதை விசாரிக்கும் பொருளைத் தெளிவாகத் தரும் ‘உங்கள் வாழ்நாளின் ஆண்டுகள்’ என மொழிபெயர்க்கப்பட்டது; ‘ஆண்டுகள்’ என்ற மூலக் கூறும் தக்கவைக்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: மரியாதையான நவீன நிலையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரசன் வயதான யாக்கோபிடம் பேசுவதால், ஒருமை விகுதி இருந்தாலும் தமிழில் இயல்பான மரியாதைப் பன்மையான ‘உங்கள்’ பயன்படுத்தப்பட்டது. மூலத்தின் முறையான வயது விசாரணை முதன்மை உரையில் ஓரளவு காக்கப்பட்டு, சொற்சொல் வடிவமும் மிக இயல்பான மாற்றும் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
