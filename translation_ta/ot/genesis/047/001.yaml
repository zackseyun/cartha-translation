  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּבֹ֣א יוֹסֵף֮ וַ/יַּגֵּ֣ד לְ/פַרְעֹה֒ וַ/יֹּ֗אמֶר אָבִ֨/י וְ/אַחַ֜/י וְ/צֹאנָ֤/ם וּ/בְקָרָ/ם֙ וְ/כָל אֲשֶׁ֣ר לָ/הֶ֔ם בָּ֖אוּ מֵ/אֶ֣רֶץ כְּנָ֑עַן וְ/הִנָּ֖/ם בְּ/אֶ֥רֶץ גֹּֽשֶׁן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/001.yaml
  text: Then Joseph went in and told Pharaoh[a], “My father and my brothers, with their flocks and their herds and all that they have, have come from the land of Canaan; and behold[c][b], they are in the land of Goshen.”
translation:
  language: ta
  text: 'பின்பு யோசேப்பு பார்வோனிடம் சென்று அறிவித்தான்: “என் தந்தையும் என் சகோதரர்களும், தங்கள் ஆட்டு மந்தைகளோடும் மாட்டு மந்தைகளோடும் தங்களுக்குச் சொந்தமான எல்லாவற்றோடும் கானான் நாட்டிலிருந்து வந்திருக்கிறார்கள்; இதோ, அவர்கள் கோசேன் நாட்டில் இருக்கிறார்கள்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: சென்று
  rationale: בוא என்பது வருதல், செல்லுதல், உள்ளே நுழைதல் ஆகிய பொருள்களைக் கொள்ளலாம். பார்வோனின் முன்னிலைக்குச் சென்ற அரண்மனைச் சூழலில் ‘சென்று’ என்பது இயல்பாக உள்ளது.
- source_word: וַיַּגֵּד לְפַרְעֹה וַיֹּאמֶר
  choice: 'பார்வோனிடம் சென்று அறிவித்தான்:'
  rationale: ‘அறிவித்தான் ... கூறினான்’ என்ற எபிரெய இரட்டை அறிமுகத்தின் தகவல் தரும் வலிமையை ‘அறிவித்தான்’ தக்கவைக்கிறது; தமிழில் தேவையற்ற மறுபடியுரைத்தலைத் தவிர்த்து நேரடிப் பேச்சை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: אָבִי וְאַחַי
  choice: என் தந்தையும் என் சகோதரர்களும்
  rationale: முதலாம் நபர் உடைமைத் தொடர்பையும் ஆண் உடன்பிறந்தோரைக் குறிக்கும் சூழலையும் நேரடியாகக் காட்டுகிறது.
- source_word: וְצֹאנָם וּבְקָרָם
  choice: தங்கள் ஆட்டு மந்தைகளோடும் மாட்டு மந்தைகளோடும்
  rationale: צאן என்பது பொதுவாக ஆடுகள் உள்ளிட்ட சிறுகால்நடை மந்தையையும், בקר என்பது மாடுகள் உள்ளிட்ட பெருங்கால்நடை மந்தையையும் குறிக்கிறது. தமிழ் வாசகருக்குப் புரியும் வகையில் மந்தைகளின் வேறுபாடு பாதுகாக்கப்படுகிறது.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: தங்களுக்குச் சொந்தமான எல்லாவற்றோடும்
  rationale: அவர்களுக்குரிய உடைமைகள் அனைத்தையும் குறிக்கும் எபிரெய சொற்றொடரை இயல்பாகவும் முழுமையாகவும் தருகிறது.
- source_word: בָּאוּ מֵאֶרֶץ כְּנָעַן
  choice: கானான் நாட்டிலிருந்து வந்திருக்கிறார்கள்
  rationale: முடிவுற்ற வருகையின் தற்போதைய விளைவை எபிரெய perfect இங்கு உணர்த்துகிறது; தமிழ் நிறைவுநிலை வடிவம் அவர்கள் இப்போது வந்தடைந்திருக்கிறார்கள் என்பதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְהִנָּם
  choice: இதோ, அவர்கள்
  rationale: הנה தற்போதைய நிலைக்குக் கவனத்தை ஈர்க்கிறது. ‘இதோ’ அதன் சுட்டும் மற்றும் கவன ஈர்ப்பு வலிமையைத் தக்கவைக்கிறது.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: கோசேன் நாட்டில்
  rationale: எபிரெயத்தில் உள்ள ‘நாடு’ என்ற புவியியல் குறிப்பைத் தக்கவைக்கிறது.
