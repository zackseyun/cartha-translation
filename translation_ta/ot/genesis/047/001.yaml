translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமக் கதையாடலுக்குரிய கண்ணியமும் கொண்ட நடை. எபிரெய மூலத்தின் தகவல்கள் அனைத்தும் தக்கவைக்கப்பட்டுள்ளன; தமிழில் தேவையற்ற வினை மறுபடியுரை மட்டும் இயல்பாக்கப்பட்டுள்ளது.
