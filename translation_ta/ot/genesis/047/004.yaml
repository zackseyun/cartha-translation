base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/004.yaml
  text: They said to Pharaoh[a], “We have come to sojourn in the land, because there is no pasture for the flocks that belong to your servants, for the famine is severe in the land of Canaan. And now, please let your servants dwell in the land of Goshen.”
translation:
  language: ta
  text: அவர்கள் பார்வோனிடம், “இந்த நாட்டில் அந்நியர்களாகத் தங்கிவாழ வந்திருக்கிறோம்[a]. ஏனெனில், உங்கள் அடியார்களின் மந்தைகளுக்கு மேய்ச்சல் நிலம் இல்லை; கானான் நாட்டில் பஞ்சம் கடுமையாக இருக்கிறது. இப்போது, உங்கள் அடியார்கள் கோசேன் நாட்டில் குடியிருக்கத் தயவுசெய்து அனுமதியுங்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த நாட்டில் தற்காலிகக் குடியிருப்பாளர்களாக வாழ வந்திருக்கிறோம்.”
    reason: גור என்ற வினைச்சொல் அந்நியராக வாழ்வதையும் தற்காலிகமாகக் குடியிருப்பதையும் குறிக்கக்கூடும் என்பதால் மாற்று மொழிபெயர்ப்பு தரப்படுகிறது.
lexical_decisions:
- source_word: לָגוּר
  choice: அந்நியர்களாகத் தங்கிவாழ
  rationale: גור என்பது நிரந்தரமாகக் குடியேறுவதைக் காட்டிலும், அந்நியராக அல்லது தற்காலிகக் குடியிருப்பாளராக வாழ்வதைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் அந்த இரு நுணுக்கங்களையும் இச்சொற்றொடர் தக்கவைக்கிறது.
- source_word: בָּאָרֶץ
  choice: இந்த நாட்டில்
  rationale: இங்கு אֶרֶץ என்பது அவர்கள் பார்வோனிடம் பேசிக்கொண்டிருக்கும் எகிப்து நாட்டைக் குறிக்கிறது; தமிழில் சூழலுக்கேற்ற சுட்டுப்பெயருடன் கூறுவது இயல்பாக உள்ளது.
- source_word: מִרְעֶה
  choice: மேய்ச்சல்
  rationale: இந்தப் பெயர்ச்சொல் கால்நடைகள் மேய்வதற்கான புல்வெளி அல்லது தீவன வசதியைக் குறிக்கிறது; ‘மேய்ச்சல்’ சுருக்கமாகவும் இயல்பாகவும் அந்தப் பொருளைத் தருகிறது.
- source_word: לַצֹּאן
  choice: மந்தைகளுக்கு
  rationale: צֹאן என்பது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய சிறு கால்நடைகளின் கூட்டுப்பெயர். ‘மந்தைகள்’ இனத்தைத் தேவையின்றி வரையறுக்காமல் கூட்டுப் பொருளைக் காக்கிறது.
- source_word: אֲשֶׁר לַעֲבָדֶיךָ
  choice: உங்கள் அடியார்களின்
  rationale: இச்சொற்றொடர் உடைமையையும் பார்வோனுக்கு முன்பான பணிவான தற்குறிப்பையும் வெளிப்படுத்துகிறது.
- source_word: כָבֵד הָרָעָב
  choice: பஞ்சம் கடுமையாக இருக்கிறது
  rationale: כָבֵד என்பதன் அடிப்படைப் பொருள் ‘கனமானது’ என்றாலும், பஞ்சத்தைப் பொறுத்தவரை அதன் தீவிரத்தைக் குறிக்கிறது; ‘கடுமையாக’ என்பது தமிழில் இயல்பான இணைவு.
- source_word: יֵשְׁבוּ נָא
  choice: குடியிருக்கத் தயவுசெய்து அனுமதியுங்கள்
  rationale: நா இணைந்த வேண்டுகோள் வடிவம் பணிவான கோரிக்கையைக் காட்டுகிறது. ‘தயவுசெய்து அனுமதியுங்கள்’ அதைத் தெளிவாக வெளிப்படுத்துகிறது; ‘குடியிருக்க’ என்பது நிரந்தர உடைமையை முன்கூட்டியே வலியுறுத்தாமல் வாழ்விடத்தைக் குறிக்கிறது.
- source_word: עֲבָדֶיךָ
  choice: உங்கள் அடியார்கள்
  rationale: அரசவையில் பார்வோனிடம் பேசும்போது இது அடிமை நிலையை அவசியமாக வலியுறுத்தாமல் பணிவான தற்குறிப்பாகச் செயல்படுகிறது; ‘அடியார்கள்’ அந்த மரியாதை நடையைத் தக்கவைக்கிறது.
- source_word: אֶרֶץ גֹּשֶׁן
  choice: கோசேன் நாட்டில்
  rationale: எபிரெயக் கட்டமைப்பிலுள்ள புவியியல் குறிப்பை வெளிப்படையாகவும் தமிழில் இயல்பாகவும் வழங்குகிறது.
