base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/031.yaml
  text: He said[a], “Swear to me,” and he swore to him. Then Israel bowed himself on the head of the bed.
translation:
  language: ta
  text: யாக்கோபு, “எனக்குச் சத்தியம் செய்” என்றார்; யோசேப்பு அவருக்குச் சத்தியம் செய்தான். பின்பு இஸ்ரவேல் படுக்கையின் தலைமாட்டில்[a] பணிந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கோலின் முனையில்.” எபிரெய மெய்யெழுத்துகளை இவ்வாறும் வாசிக்கலாம். செப்துவஜிந்தாவும் எபிரெயர் 11:21-உம் இந்த வாசிப்பைப் பிரதிபலிக்கின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: הִשָּׁבְעָה
  choice: ஆணையிட்டுக் கொடு
  rationale: இது நேரடியான கட்டளை வடிவிலுள்ள ஆணைச் சூத்திரம். நவீனத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் அதன் வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: וַיִּשָּׁבַע
  choice: ஆணையிட்டுக் கொடுத்தார்
  rationale: முந்தைய கட்டளையிலுள்ள அதே வினைச்சொல்லுடன் சொற்பொருள் தொடர்ச்சியைப் பேணுகிறது.
- source_word: וַיִּשְׁתַּחוּ
  choice: குனிந்து வணங்கினார்
  rationale: எபிரெயச் சொல் உடலைத் தாழ்த்துவதையும் வழிபடுவதையும் குறிக்கலாம். இச்சூழலில் உடல் அசைவை வெளிப்படுத்திக்கொண்டே, அது வெறும் வழிபாடு மட்டுமே என்று முடிவுசெய்யாமல் இந்த மொழிபெயர்ப்பு அதன் பொருள் விரிவை ஓரளவு காக்கிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: மூல உரை இவ்விடத்தில் ‘யாக்கோபு’ என்பதற்குப் பதிலாக ‘இஸ்ரவேல்’ என்ற பெயரையே பயன்படுத்துவதால் அதையே தக்கவைக்கிறது.
- source_word: עַל רֹאשׁ הַמִּטָּה
  choice: படுக்கையின் தலைமாட்டில்
  rationale: படுக்கையின் தலைப்புறத்தைக் குறிக்கும் எபிரெய இடவியல் தொடரை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַמִּטָּה
  choice: படுக்கை
  rationale: மசோரா உயிர்க்குறிப்பின்படி இச்சொல் ‘படுக்கை’ என்று வாசிக்கப்படுகிறது; யாக்கோபின் உடல்நிலை பற்றிய உடனடிச் சூழலுக்கும் இது பொருந்துகிறது.
theological_decisions:
- issue: எபிரெயர் 11:21, செப்துவஜிந்தாவுடன் தொடர்புடைய ‘கோல்’ என்ற வாசிப்பைப் பிரதிபலிக்கிறது; மசோரா உரையோ ‘படுக்கை’ என்று வாசிக்கிறது.
  choice: படுக்கை
  alternative: கோல்
  rationale: ஆதியாகமத்தின் முதன்மை உரையில் மசோரா எபிரெய உரையின் உயிர்க்குறிப்புள்ள வாசிப்பான ‘படுக்கை’ பின்பற்றப்படுகிறது. எனினும் மெய்யெழுத்து உரை ‘கோல்’ என்ற வாசிப்புக்கும் இடமளிப்பதாலும், எபிரெயர் 11:21-ல் அந்த வாசிப்பு முக்கியத்துவம் பெறுவதாலும், மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நடை நவீனத் தரத் தமிழாகவும், வாசிக்க எளிதானதாயும், வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. தொடக்கச் சுட்டுப்பெயர்களால் தமிழில் ஏற்படக்கூடிய குழப்பத்தைத் தவிர்க்க இரண்டாவது செயலின் கர்த்தாவாக ‘யோசேப்பு’ வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளார்; சூழலில் தெளிவாக உள்ள பெயரையே இது விளக்குகிறது.
