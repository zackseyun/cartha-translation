base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/028.yaml
  text: Jacob lived in the land of Egypt seventeen years[a], and the days of Jacob, the years of his life, were one hundred forty-seven years.
translation:
  language: ta
  text: யாக்கோபு எகிப்து நாட்டில் பதினேழு ஆண்டுகள் வாழ்ந்தார்; யாக்கோபின் நாட்கள்[a], அதாவது அவரது வாழ்வின் ஆண்டுகள், நூற்று நாற்பத்தேழு ஆண்டுகளாயின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யாக்கோபின் நாட்கள், அவரது வாழ்வின் ஆண்டுகள்”; இது அவரது மொத்த ஆயுளைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்தார்
  rationale: חיה என்பதன் தொடர்கதை வடிவம், குறிப்பிட்ட காலம் தொடர்ந்து உயிர்வாழ்ந்ததை இங்கு இயல்பாகக் குறிக்கிறது.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டில்
  rationale: மூலத்தில் உள்ள אֶרֶץ (‘நாடு’) என்பதையும் காத்து, நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: பதினேழு ஆண்டுகள்
  rationale: எண்ணிக்கையையும் கால அளவையும் தெளிவாகவும் வழக்கமான தமிழிலும் தருகிறது.
- source_word: יְמֵי יַעֲקֹב שְׁנֵי חַיָּיו
  choice: யாக்கோபின் வாழ்நாட்கள்
  rationale: ‘யாக்கோபின் நாட்கள், அவரது வாழ்வின் ஆண்டுகள்’ என்ற எபிரெய இணைப்பின் பொருளைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது; மூலத்தின் சொற்றொடர் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שֶׁבַע שָׁנִים וְאַרְבָּעִים וּמְאַת שָׁנָה
  choice: நூற்று நாற்பத்தேழு ஆண்டுகள்
  rationale: எபிரெய எண்ணமைப்பைத் தமிழின் வழக்கமான இறங்குவரிசைக்கு மாற்றி, மொத்த எண்ணிக்கையைத் துல்லியமாகக் காக்கிறது.
