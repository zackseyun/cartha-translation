revisions:
- from: 'அந்த ஆண்டு முடிந்தபோது, இரண்டாம் ஆண்டில் அவர்கள் அவனிடம் வந்து, “என் ஆண்டவரிடம் நாங்கள் இதை மறைக்கமாட்டோம்: பணம் தீர்ந்துவிட்டது[a]; கால்நடைச் செல்வமும் என் ஆண்டவரிடம் சென்றுவிட்டது. எங்கள் உடல்களையும்[b] எங்கள் நிலத்தையும் தவிர, என் ஆண்டவருக்கு முன்பாக எதுவும் மீதியில்லை” என்றார்கள்.'
  to: 'அந்த ஆண்டு முடிந்தபோது, இரண்டாம் ஆண்டில் அவர்கள் அவனிடம் வந்து, “என் ஆண்டவரிடமிருந்து நாங்கள் இதை மறைக்கமாட்டோம்: பணம் தீர்ந்துவிட்டது[a]; கால்நடைச் செல்வமும் என் ஆண்டவரிடம் சென்றுவிட்டது. எங்கள் உடல்களும்[b] எங்கள் நிலமும் தவிர, என் ஆண்டவரின் முன் எதுவும் மீதியில்லை” என்றார்கள்.'
  rationale: The revision corrects the Tamil complement/case construction required by ‘மறைக்க,’ improves the final exception clause’s fluency, and retains the Hebrew’s deferential singular, economic terminology, and spatial idiom. Footnote anchors remain attached to the words they explain.
