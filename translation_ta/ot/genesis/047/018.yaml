translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் மூலத்தின் பொருளாதார நெருக்கடியும் காக்கப்பட்டுள்ளன. குழுவினர் பேசினாலும் אֲדֹנִי என்பதிலுள்ள ஒருமை வடிவத்தைப் பிரதிபலிக்க ‘என் ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சொற்களுக்குப் பின்னர் வைக்கப்பட்டுள்ளன.
