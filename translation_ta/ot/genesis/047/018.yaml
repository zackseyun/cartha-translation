base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/018.yaml
  text: 'When that year ended[a], they came to him in the second year and said to him, “We will not hide it from my lord: the money is gone, and the livestock of the herds belongs to my lord[b]. Nothing is left before my lord except our bodies and our land.”'
translation:
  language: ta
  text: 'அந்த ஆண்டு முடிந்தபோது, இரண்டாம் ஆண்டில் அவர்கள் அவனிடம் வந்து, “என் ஆண்டவரிடமிருந்து நாங்கள் இதை மறைக்கமாட்டோம்: பணம் தீர்ந்துவிட்டது[a]; கால்நடைச் செல்வமும் என் ஆண்டவரிடம் சென்றுவிட்டது. எங்கள் உடல்களும்[b] எங்கள் நிலமும் தவிர, என் ஆண்டவரின் முன் எதுவும் மீதியில்லை” என்றார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெள்ளி தீர்ந்துவிட்டது.’ எபிரெய மொழியில் ‘வெள்ளி’ என்பது பல இடங்களில் பணத்தைக் குறிக்கும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எங்களே.’ எபிரெய மூலத்தில் நேரடியாக ‘எங்கள் உடல்கள்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֹּם הַשָּׁנָה הַהִוא
  choice: அந்த ஆண்டு முடிந்தபோது
  rationale: תמם என்பதன் ‘முடிவடைதல்’ என்ற பொருளையும், காலத்தைச் சுட்டும் எபிரெய வாக்கிய அமைப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: இரண்டாம் ஆண்டில்
  rationale: சூழலில் இது அடுத்த ஆண்டைக் குறித்தாலும், எபிரெய மூலத்தின் ‘இரண்டாம் ஆண்டு’ என்ற வெளிப்பாட்டைத் தீர்மானித்து மாற்றாமல் காக்கிறது.
- source_word: לֹא נְכַחֵד מֵאֲדֹנִי
  choice: என் ஆண்டவரிடம் நாங்கள் இதை மறைக்கமாட்டோம்
  rationale: כחד என்பதன் மறைத்தல்/ஒளித்தல் என்ற பொருளையும், אֲדֹנִי என்பதிலுள்ள ஒருமை உரிமை விகுதியையும் காக்கிறது; தமிழில் தேவையான செயப்படுபொருளாக ‘இதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: תַּם הַכֶּסֶף
  choice: பணம் தீர்ந்துவிட்டது
  rationale: כֶּסֶף சொல்லின் நேர்ப்பொருள் ‘வெள்ளி’ என்றாலும், இங்கு பரிமாற்றச் சாதனமான பணத்தைக் குறிக்கிறது; תם அதன் முற்றிலும் செலவாகிவிட்ட நிலையைக் காட்டுகிறது.
- source_word: וּמִקְנֵה הַבְּהֵמָה אֶל אֲדֹנִי
  choice: கால்நடைச் செல்வமும் என் ஆண்டவரிடம் சென்றுவிட்டது
  rationale: מִקְנֵה הַבְּהֵמָה என்பது கால்நடைகளாக உள்ள பொருளாதார உடைமையைக் குறிக்கிறது. אֶל אֲדֹנִי என்பது அவை ஆண்டவரின் வசம் மாற்றப்பட்டதைக் குறிக்கிறது; ‘சென்றுவிட்டது’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא נִשְׁאַר לִפְנֵי אֲדֹנִי
  choice: என் ஆண்டவருக்கு முன்பாக எதுவும் மீதியில்லை
  rationale: נשאר என்பதன் ‘மீதியிருத்தல்’ என்ற பொருளையும், לִפְנֵי என்பதன் ‘முன்பாக/வசத்தில்’ என்ற எபிரெய உருவகத்தையும் காக்கிறது.
- source_word: בִּלְתִּי אִם גְּוִיָּתֵנוּ וְאַדְמָתֵנוּ
  choice: எங்கள் உடல்களையும் எங்கள் நிலத்தையும் தவிர
  rationale: בִּלְתִּי אִם விதிவிலக்கை அறிமுகப்படுத்துகிறது. גְּוִיָּה இங்கு உயிருள்ள மனிதர்களின் உடலைக் குறிப்பதால், அதன் திடமான நேர்ப்பொருளான ‘உடல்கள்’ தேர்ந்தெடுக்கப்பட்டது.
