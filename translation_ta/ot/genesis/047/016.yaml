translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நிபந்தனை வடிவம் முதன்மை உரையில் காக்கப்பட்டு, சூழலுக்குரிய காரணப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. எபிரெயத்தில் விடுபட்டுள்ள உணவு என்ற செயப்படுபொருள் வாசிப்புத் தெளிவுக்காகச் சேர்க்கப்பட்டு வெளிப்படையாகக் குறிக்கப்பட்டுள்ளது.
