  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ הָב֣וּ מִקְנֵי/כֶ֔ם וְ/אֶתְּנָ֥ה לָ/כֶ֖ם בְּ/מִקְנֵי/כֶ֑ם אִם אָפֵ֖ס כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/016.yaml
  text: And Joseph said[a], “Bring your livestock, and I will give to you in exchange for your livestock[b], if the money is gone.”
translation:
  language: ta
  text: யோசேப்பு, “உங்கள் கால்நடைகளைக் கொண்டுவாருங்கள். பணம் தீர்ந்துவிட்டால்[b], உங்கள் கால்நடைகளுக்கு ஈடாக உங்களுக்கு உணவு தருவேன்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘உங்கள் கால்நடைகளுக்கு ஈடாக உங்களுக்குத் தருவேன்.’ தரப்படும் பொருளான ‘உணவு’ உடனடிப் பஞ்சச் சூழலிலிருந்து சேர்த்துக் கூறப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பணம் தீர்ந்துவிட்டதால்.’ இங்கு ‘என்றால்’ என்ற நிபந்தனைச் சொல் சூழலில் ‘என்பதால்’ என்ற காரணப் பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: கொண்டுவாருங்கள்
  rationale: இந்தப் பன்மை ஏவல் வடிவம், கால்நடைகளை ஒப்படைப்பதற்காகக் கொண்டுவரும்படி கூறுகிறது. நிர்வாகப் பரிமாற்றச் சூழலில் ‘கொண்டுவாருங்கள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מִקְנֵיכֶם
  choice: உங்கள் கால்நடைகள்
  rationale: מִקְנֶה என்பது மாடுகளை மட்டும் அல்லாமல் வளர்ப்பு மந்தை விலங்குகளைப் பொதுவாகக் குறிக்கக்கூடும்; ஆகவே ‘கால்நடைகள்’ பொருத்தமான பரந்த சொல்.
- source_word: וְאֶתְּנָה לָכֶם
  choice: உங்களுக்கு உணவு தருவேன்
  rationale: எபிரெயத்தில் தரப்படும் பொருள் வெளிப்படையாகக் கூறப்படவில்லை. உடனடிப் பஞ்சச் சூழலும் முந்தைய வசனத்தில் உணவு வாங்குவது பற்றிய குறிப்பும் காரணமாக, தமிழில் வாக்கியம் இயல்பாகவும் தெளிவாகவும் இருக்க ‘உணவு’ சேர்க்கப்பட்டுள்ளது; இதை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
- source_word: בְּמִקְנֵיכֶם
  choice: உங்கள் கால்நடைகளுக்கு ஈடாக
  rationale: இங்குள்ள בְּ பரிமாற்றத்தின் விலையையோ வழிமுறையையோ குறிக்கிறது. ‘ஈடாக’ என்பது கால்நடைகளுக்குப் பதிலாக உணவு வழங்கப்படும் பரிவர்த்தனையைத் தெளிவாகக் காட்டுகிறது.
- source_word: אִם
  choice: தீர்ந்துவிட்டால்
  rationale: אִם என்பதன் அடிப்படை நிபந்தனைப் பொருளை ‘-ஆல்’ வடிவம் காக்கிறது. இச்சூழலில் அது ‘தீர்ந்துவிட்டதால்’ என்ற காரணப் பொருளையும் தரக்கூடும் என்பதை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: אָפֵס כָּסֶף
  choice: பணம் தீர்ந்துவிட்டது
  rationale: אָפֵס என்பது முற்றிலும் தீர்ந்துபோதல் அல்லது இல்லாமற்போதலைக் குறிக்கிறது; ‘பணம் தீர்ந்துவிட்டது’ என்பது நேர்த்தியான, இயல்பான தமிழ்.
