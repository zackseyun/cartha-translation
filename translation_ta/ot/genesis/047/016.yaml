  source_fidelity: 'மூல எபிரெயத்தின் முக்கிய கூறுகள் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன: யோசேப்பின் பன்மை ஏவல், கால்நடைகளை ஒப்படைத்து அதற்குப் பதிலாக வழங்கும் பரிமாற்றம், மற்றும் பணம் தீர்ந்துபோன நிலையைச் சுட்டும் אִם-உட்பிரிவு ஆகியவை அனைத்தும் காக்கப்பட்டுள்ளன. எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘உணவு’ உடனடிச் சூழலிலிருந்து தெளிவுக்காகச் சேர்க்கப்பட்டு, அடிக்குறிப்பிலும் நேர்மையாகக் குறிப்பிடப்பட்டுள்ளது.'
  naturalness: ‘உங்கள் கால்நடைகளைக் கொண்டுவாருங்கள்’ மற்றும் ‘உங்கள் கால்நடைகளுக்கு ஈடாக உங்களுக்கு உணவு தருவேன்’ என்பது நவீன நிலையான தமிழில் தெளிவான, கண்ணியமான, இயல்பான நடை. நிபந்தனை உட்பிரிவை முன்னிலைப்படுத்தியிருப்பது தமிழில் இயல்பானது; பொருளை மாற்றுவதில்லை.
