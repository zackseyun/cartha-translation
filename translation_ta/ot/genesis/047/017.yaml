base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/017.yaml
  text: So they brought their livestock to Joseph[a], and Joseph gave them bread in exchange for the horses, the flocks, the herds, and the donkeys[b]; and he provided for them with bread in exchange for all their livestock during that year.
translation:
  language: ta
  text: அவர்கள் தங்கள் கால்நடைகளை யோசேப்பிடம் கொண்டுவந்தார்கள். யோசேப்பு குதிரைகள், ஆட்டு மந்தைகள், மாட்டு மந்தைகள், கழுதைகள் ஆகியவற்றுக்கு ஈடாக அவர்களுக்கு உணவு கொடுத்தான். அந்த ஆண்டில் அவர்களுடைய எல்லாக் கால்நடைகளுக்கும் ஈடாக உணவு கொடுத்து அவர்களைப் பராமரித்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “அப்பத்தினால் அவர்களை வழிநடத்தினான்.” இங்கு பயன்படுத்தப்பட்ட வினைச்சொல் ‘வழிநடத்து, நிர்வகி’ என்று பொருள்படலாம்; இந்தப் பஞ்சச் சூழலில், அவர்களுக்கு உணவளித்துப் பராமரித்ததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵיהֶם / מִקְנֵהֶם
  choice: அவர்களுடைய கால்நடைகள் / எல்லாக் கால்நடைகள்
  rationale: இந்த எபிரெயச் சொல் மாடுகளை மட்டும் அல்லாமல், வளர்க்கப்படும் விலங்குகளைப் பொதுவாகக் குறிக்கிறது; ‘கால்நடைகள்’ என்பது இயல்பான விரிவுப்பொருள் கொண்ட தமிழ்ச் சொல்.
- source_word: לֶחֶם
  choice: உணவு
  rationale: அடிப்படைப் பொருள் ‘அப்பம்’ என்றாலும், பஞ்சச் சூழலில் இது வாழ்வாதார உணவை விரிவாகக் குறிக்கிறது; தமிழில் பரிமாற்றத்தின் பொருளைத் தெளிவாகச் சொல்ல ‘உணவு’ இயல்பாக உள்ளது.
- source_word: בַּסּוּסִים
  choice: குதிரைகளுக்கு ஈடாக
  rationale: இங்குள்ள בְּ இடத்தையோ கருவியையோ அல்ல, பரிமாற்றமாகக் கொடுக்கப்பட்ட பொருளைக் குறிக்கிறது.
- source_word: מִקְנֵה הַצֹּאן
  choice: ஆட்டு மந்தைகள்
  rationale: צֹאן செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடும்; ‘ஆட்டு மந்தைகள்’ அந்தக் கூட்டுப்பொருளை இயல்பாகக் காக்கிறது.
- source_word: מִקְנֵה הַבָּקָר
  choice: மாட்டு மந்தைகள்
  rationale: இந்தச் சொற்றொடர் பெரிய மந்தை விலங்குகளை, குறிப்பாக மாடுகளை, கூட்டாகக் குறிக்கிறது.
- source_word: חֲמֹרִים
  choice: கழுதைகள்
  rationale: தெளிவான, தற்போதைய பொதுத்தமிழ் இணைச்சொல்.
- source_word: וַיְנַהֲלֵם
  choice: அவர்களைப் பராமரித்தான்
  rationale: נהל என்பதன் அடிப்படை அர்த்தம் ‘வழிநடத்து/நிர்வகி’; இங்கு உணவின் மூலம் மக்களைத் தாங்கிப் பராமரித்ததைக் குறிக்கிறது. மூலத்தின் உருவகத் தன்மை குறிப்பு மூலம் பாதுகாக்கப்படுகிறது.
- source_word: בְּכָל מִקְנֵהֶם
  choice: அவர்களுடைய எல்லாக் கால்நடைகளுக்கும் ஈடாக
  rationale: அந்த ஆண்டில் நடந்த மொத்தப் பண்டமாற்றைச் சுருக்கமாகக் குறிக்கும் சொற்றொடர்; ‘ஈடாக’ என்பது உறவைத் தெளிவாக்குகிறது.
- source_word: בַּשָּׁנָה הַהִוא
  choice: அந்த ஆண்டு முழுவதும்
  rationale: அந்த ஆண்டுக் காலப்பகுதி முழுவதும் இந்த ஏற்பாடு நீடித்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
