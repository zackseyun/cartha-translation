base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/003.yaml
  text: And Pharaoh said to his brothers[a], “What is your occupation?” And they said to Pharaoh, “Your servants are shepherds of flocks[b], both we and our fathers.”
translation:
  language: ta
  text: பார்வோன் அவனுடைய சகோதரர்களிடம், “உங்கள் தொழில் என்ன?”[a] என்று கேட்டான். அவர்கள் பார்வோனிடம், “உமது அடியார்களான நாங்களும் எங்கள் தந்தையரும் மந்தைகளை மேய்ப்பவர்கள்[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் வேலை என்ன?”
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில், “சிறுகால்நடை மந்தைகளை மேய்ப்பவர்கள்”; அதாவது, செம்மறியாடுகளையும் வெள்ளாடுகளையும் பராமரிப்பவர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: உங்கள் தொழில் என்ன?
  rationale: מַעֲשֶׂה என்பது செயல் அல்லது வேலையைக் குறிக்கலாம்; இங்கு பார்வோன் அவர்களுடைய வாழ்வாதாரத் தொழிலை விசாரிப்பதால், இயல்பான நவீனத் தமிழில் ‘தொழில்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: רֹעֵה צֹאן
  choice: மந்தைகளை மேய்ப்பவர்கள்
  rationale: רֹעֵה என்பது மேய்ப்பவரையும், צֹאן என்பது பொதுவாகச் செம்மறியாடுகள் மற்றும் வெள்ளாடுகள் அடங்கிய சிறுகால்நடை மந்தையையும் குறிக்கிறது. ‘மந்தைகளை மேய்ப்பவர்கள்’ என்பது இரு சொற்களின் பொருளையும் இயல்பாகத் தருகிறது; மந்தையின் வகை அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: עֲבָדֶיךָ
  choice: உமது அடியார்களான
  rationale: பார்வோனிடம் பேசும் அரசவைச் சூழலில் עבד என்பது அடிமைத்தனத்தை வலியுறுத்தாமல், பணிவான தற்குறிப்பாகப் பயன்படுகிறது. ஆகவே ‘உமது அடியார்கள்’ என்ற மரியாதைமிக்க வடிவம் பொருத்தமானது.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבוֹתֵינוּ
  choice: நாங்களும் எங்கள் தந்தையரும்
  rationale: இருமுறை வரும் גַּם, இவர்களுக்கும் முந்தைய தலைமுறைக்கும் இடையிலான தொடர்ச்சியை வலியுறுத்துகிறது. தமிழில் இரு ‘உம்’ விகுதிகளைக் கொண்ட அமைப்பு அந்த இணையான வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: אֶל אֶחָיו
  choice: அவனுடைய சகோதரர்களிடம்
  rationale: எபிரெய உரை ‘அவனுடைய சகோதரர்கள்’ என்றே கூறுகிறது; சூழலில் அந்தப் பதிற்பெயர் யோசேப்பைக் குறித்தாலும், அவரது பெயரை உரைக்குள் சேர்க்காமல் மூலத்தின் வடிவம் பாதுகாக்கப்படுகிறது.
