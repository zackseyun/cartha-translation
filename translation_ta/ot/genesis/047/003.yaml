translation_notes:
  register: நவீன வாசகர்களுக்கு எளிதில் புரியும், ஆனால் அரசவை உரையாடலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பார்வோனை நோக்கிய பணிவை வெளிப்படுத்த ‘உமது அடியார்கள்’ என்றும், தலைமுறைத் தொடர்ச்சியைத் தெளிவாகக் காட்ட ‘நாங்களும் எங்கள் தந்தையரும்’ என்றும் அமைக்கப்பட்டுள்ளது.
