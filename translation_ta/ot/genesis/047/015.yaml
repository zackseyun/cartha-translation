  text: וַ/יִּתֹּ֣ם הַ/כֶּ֗סֶף מֵ/אֶ֣רֶץ מִצְרַיִם֮ וּ/מֵ/אֶ֣רֶץ כְּנַעַן֒ וַ/יָּבֹאוּ֩ כָל מִצְרַ֨יִם אֶל יוֹסֵ֤ף לֵ/אמֹר֙ הָֽבָ/ה לָּ֣/נוּ לֶ֔חֶם וְ/לָ֥/מָּה נָמ֖וּת נֶגְדֶּ֑/ךָ כִּ֥י אָפֵ֖ס כָּֽסֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/015.yaml
  text: When the money from the land of Egypt and from the land of Canaan was gone[a], all the Egyptians came to Joseph, saying, "Give us bread[c][b]. Why should we die before you? For the money is gone."
translation:
  language: ta
  text: எகிப்து நாட்டிலிருந்தும் கானான் நாட்டிலிருந்தும் பணம் தீர்ந்துபோனபோது[a], எகிப்தியர் அனைவரும்[b] யோசேப்பிடம் வந்து, “எங்களுக்கு அப்பம்[c] கொடுங்கள். உங்கள் முன்னிலையில் நாங்கள் ஏன் சாக வேண்டும்? பணம் தீர்ந்துவிட்டதே” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெள்ளி தீர்ந்துபோனபோது”; כֶּסֶף என்ற எபிரெயச் சொல் “வெள்ளி” அல்லது “பணம்” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, “எகிப்து முழுவதும் யோசேப்பிடம் வந்தது.”
    reason: lexical_alternative
  - marker: c
    text: இங்கு “அப்பம்” என்பது பஞ்சச் சூழலில் உணவைப் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֹּם
  choice: தீர்ந்துபோனபோது
  rationale: תמם என்பது முற்றிலும் முடிவடைதல் அல்லது தீர்ந்துபோதலைக் குறிக்கிறது; பஞ்சச் சூழலில் பணம் முழுவதும் செலவாகிவிட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַכֶּסֶף
  choice: பணம்
  rationale: כֶּסֶף என்பதற்கு ‘வெள்ளி’ என்றும் ‘பணம்’ என்றும் பொருள் உண்டு. இங்கு உணவு வாங்குவதற்கான பரிமாற்றச் சாதனத்தைச் சுட்டுவதால் ‘பணம்’ பொருத்தமானது; மூலத்தின் மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: מֵאֶרֶץ מִצְרַיִם וּמֵאֶרֶץ כְּנַעַן
  choice: எகிப்து நாட்டிலிருந்தும் கானான் நாட்டிலிருந்தும்
  rationale: מן முன்னிடைச்சொல்லின் ‘இலிருந்து’ என்ற வடிவத்தைப் பாதுகாத்து, இரு நாடுகளிலிருந்த பணமும் தீர்ந்துவிட்டது என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיָּבֹאוּ כָל מִצְרַיִם
  choice: எகிப்தியர் அனைவரும் வந்து
  rationale: மூலத்தில் சொற்சொல்லாக ‘எகிப்து முழுவதும் வந்தது’ என்று இருந்தாலும், நாட்டின் மக்களே குறிக்கப்படுவதால் தெளிவான தமிழில் ‘எகிப்தியர் அனைவரும்’ என வழங்கப்பட்டுள்ளது; சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הָבָה לָּנוּ לֶחֶם
  choice: எங்களுக்கு அப்பம் கொடுங்கள்
  rationale: הָבָה לָּנוּ என்பது வேண்டுகோளுடன் கூடிய கட்டளை வடிவில் ‘எங்களுக்குக் கொடுங்கள்’ எனப் பொருள்படும். לֶחֶם என்பதன் நேரடிப் பொருளான ‘அப்பம்’ பாதுகாக்கப்பட்டு, அதன் விரிவான பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
- source_word: וְלָמָּה נָמוּת נֶגְדֶּךָ
  choice: உங்கள் முன்னிலையில் நாங்கள் ஏன் சாக வேண்டும்?
  rationale: அவசரமான வினாவை இயல்பாகப் பாதுகாக்கிறது; נֶגְדֶּךָ என்பதன் ‘உமக்கு முன்பாக/உங்கள் முன்னிலையில்’ என்ற இடவியல் பொருளை அளவுக்கு மீறி விளக்காமல் தருகிறது.
- source_word: כִּי אָפֵס כָּסֶף
  choice: பணம் தீர்ந்துவிட்டதே
  rationale: אָפֵס என்பது இல்லாமற்போதல் அல்லது தீர்ந்துவிடுதலைக் குறிக்கிறது. ‘தே’ விகுதி அவர்களது முறையீட்டிற்கான காரணத்தை இயல்பாகவும் அழுத்தமாகவும் தெரிவிக்கிறது.
