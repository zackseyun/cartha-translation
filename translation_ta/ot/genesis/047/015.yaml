translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்பம்’ என்ற மூலத்துக்கு நெருக்கமான சொல் தக்கவைக்கப்பட்டு அதன் விரிவான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. உரையாடலில் மரியாதைப் பன்மையான ‘கொடுங்கள்/உங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
