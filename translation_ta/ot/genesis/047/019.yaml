base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/019.yaml
  text: Why should we die before your eyes[a], both we and our land? Buy us and our land for bread, and we and our land will be servants to Pharaoh. Give seed, so that we may live and not die[e][d][c][b], and the land may not become desolate.
translation:
  language: ta
  text: நாங்களும் எங்கள் நிலமும் உங்கள் கண்முன்னே ஏன் சாக வேண்டும்[a]? உணவுக்காக[b] எங்களையும் எங்கள் நிலத்தையும் வாங்கிக்கொள்ளுங்கள்; நாங்களும் எங்கள் நிலமும் பார்வோனுக்கு அடிமைகளாக[c] இருப்போம். நாங்கள் சாகாமல் உயிர்வாழவும், நிலம் பாழாகாமல்[d] இருக்கவும் விதை தாருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் பார்வையில்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “அப்பத்திற்காக.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “வேலைக்காரர்களாக.” எபிரெயச் சொல் பலவகையான பணிவிடை அல்லது அடிமை நிலையைக் குறிக்கலாம்; இங்கு பொருளாதாரக் கட்டுப்பாட்டிலுள்ள அடிமை நிலை முக்கியமாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “வெறுமையாகிவிடாமல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה נָמוּת
  choice: ஏன் சாக வேண்டும்
  rationale: கேள்வி வடிவிலான வேண்டுகோளின் வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְעֵינֶיךָ
  choice: உங்கள் கண்முன்னே
  rationale: யோசேப்பின் பார்வையிலும் முன்னிலையிலும் என்பது குறிக்கும் எபிரெய உருவகத்தின் உயிரோட்டத்தைப் பாதுகாக்கிறது.
- source_word: גַּם אֲנַחְנוּ גַּם אַדְמָתֵנוּ
  choice: நாங்களும் எங்கள் நிலமும்
  rationale: גַּם ... גַּם இணைக்கும் மக்களையும் நிலத்தையும் தமிழின் இயல்பான ‘உம்...உம்’ அமைப்பில் தருகிறது.
- source_word: קְנֵה אֹתָנוּ וְאֶת אַדְמָתֵנוּ
  choice: எங்களையும் எங்கள் நிலத்தையும் வாங்கிக்கொள்ளுங்கள்
  rationale: பஞ்சநிலையிலான வணிகக் கையகப்படுத்தலைத் தெளிவாகக் காட்டுகிறது; மரியாதை ஏவல் வடிவம் சூழலுக்கு ஏற்றது.
- source_word: בַּלָּחֶם
  choice: உணவுக்காக
  rationale: சொல்லர்த்தம் ‘அப்பத்திற்காக’ என்றாலும், இங்கு לֶחֶם பொதுவாக உயிர்வாழத் தேவையான உணவைக் குறிக்கிறது; பரிமாற்றப் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲבָדִים
  choice: அடிமைகள்
  rationale: இச்சூழலில் சுதந்திர இழப்பும் பார்வோனுக்குரிய கட்டுப்பட்ட பொருளாதார நிலையும் முதன்மையானதால் ‘வேலைக்காரர்கள்’ என்பதைக் காட்டிலும் துல்லியமானது.
- source_word: וְתֶן זֶרַע
  choice: விதை தாருங்கள்
  rationale: விதைப்பதற்கான தானியத்தைச் சுட்டும் זֶרַע என்பதைக் குறுகிய, இயல்பான தமிழில் தருகிறது.
- source_word: וְהָאֲדָמָה לֹא תֵשָׁם
  choice: நிலம் பாழாகாமல் இருக்கவும்
  rationale: விளைநிலம் பயிரிடப்படாமல் வெறுமையாவதை תֵשָׁם குறிக்கிறது; நோக்கத்தை முந்தைய வினையுடன் இணைக்கிறது.
theological_decisions:
- issue: עֲבָדִים என்பதன் சமூக-சட்ட நிலை
  choice: அடிமைகள்
  alternative: வேலைக்காரர்கள் / பணியாளர்கள்
  rationale: எபிரெயச் சொல் பலவகைச் சேவையைச் சுட்டலாம்; ஆனால் மக்கள் தங்களையும் நிலத்தையும் உணவுக்காக விற்று பார்வோனுக்குச் சொந்தமான கட்டுப்பட்ட நிலையில் வருவது இங்கு முன்னிலையில் உள்ளது. மொழிபெயர்ப்பு அந்தக் கடுமையை மறைக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமான ஆனால் சாதாரண வாசகர்களுக்குப் புரியும் நடையில் அமைக்கப்பட்டது. யோசேப்பை நோக்கிய பன்மை மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெய வசனத்தின் வேண்டுகோள், பரிமாற்றம், அடிமை நிலை, விதை கோரிக்கை ஆகிய தொடர் கருத்துகள் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
