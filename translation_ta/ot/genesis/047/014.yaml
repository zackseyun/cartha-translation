base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/014.yaml
  text: And Joseph gathered up all the silver found in the land of Egypt and in the land of Canaan for the grain that they were buying[b][a], and Joseph brought the silver into Pharaoh’s house.
translation:
  language: ta
  text: எகிப்து நாட்டிலும் கானான் நாட்டிலும் கிடைத்திருந்த வெள்ளி முழுவதையும்[a], அவர்கள் வாங்கிக்கொண்டிருந்த தானியத்திற்கான கட்டணமாக யோசேப்பு சேகரித்தார். பின்னர் அந்த வெள்ளியைப் பார்வோனின் இல்லத்திற்குள்[b] கொண்டுவந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணம் முழுவதையும்.” எபிரெய மொழியில் நேரடியாக “வெள்ளி முழுவதையும்” என்று உள்ளது; அக்காலத்தில் வெள்ளி பணமாகப் பயன்படுத்தப்பட்டது.
    reason: lexical_alternative
  - marker: b
    text: “பார்வோனின் இல்லம்” என்பது அரச குடியிருப்பை மட்டுமல்லாமல், பார்வோனின் இல்லத்தாரையோ நிர்வாகத்தையோ கருவூலத்தையோ பரந்த பொருளில் குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְלַקֵּט
  choice: சேகரித்தார்
  rationale: לָקַט என்பதன் சேகரித்தல் என்ற பொருளையும், பல பரிவர்த்தனைகளிலிருந்து வெள்ளி ஒன்றுதிரட்டப்பட்டதையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: כָּל הַכֶּסֶף
  choice: வெள்ளி முழுவதையும்
  rationale: כֶּסֶף என்பதன் நேரடியான பொருள் ‘வெள்ளி’; இங்கு அது பணமாகப் பயன்படுத்தப்பட்டாலும், எபிரெய மொழியின் தெளிவான உலோகக் குறிப்பை முதன்மை உரை காக்கிறது.
- source_word: הַנִּמְצָא
  choice: இருந்த
  rationale: அந்த இரு நாடுகளிலும் காணப்பட்ட அல்லது கையிருப்பில் இருந்த வெள்ளியைக் குறிக்கும் எபிரெயப் பெயரெச்சத்தை இயல்பான தமிழில் தருகிறது.
- source_word: בְאֶרֶץ מִצְרַיִם וּבְאֶרֶץ כְּנַעַן
  choice: எகிப்து நாட்டிலும் கானான் நாட்டிலும்
  rationale: இரு நிலப்பகுதிகளையும் தனித்தனியாகக் குறிப்பிடும் மூலமொழி அமைப்பையும் புவியியல் வலியுறுத்தலையும் காக்கிறது.
- source_word: בַּשֶּׁבֶר
  choice: தானியத்திற்காக
  rationale: யோசேப்பின் கதையோட்டத்தில் שֶׁבֶר என்பது பஞ்சத்தின்போது விற்கப்பட்ட தானியத்தைக் குறிக்கிறது; בְּ பரிமாற்றத்திற்கான விலையைக் காட்டுகிறது.
- source_word: אֲשֶׁר הֵם שֹׁבְרִים
  choice: அவர்கள் வாங்கிக்கொண்டிருந்த
  rationale: இந்தச் சூழலில் שבר என்பது தானியம் வாங்குதல் என்ற மொழிவழக்குப் பொருளுடையது; பெயரெச்ச வடிவின் தொடர்ச்சியான செயலை ‘வாங்கிக்கொண்டிருந்த’ வெளிப்படுத்துகிறது.
- source_word: וַיָּבֵא ... בֵּיתָה פַרְעֹה
  choice: பார்வோனின் இல்லத்திற்குள் கொண்டுவந்தார்
  rationale: בֵּיתָה என்பதிலுள்ள திசைகாட்டும் இறுதி, உள்ளே கொண்டுசெல்வதைச் சுட்டுகிறது. ‘இல்லம்’ என்பது அரண்மனையை மட்டும் என்று குறுக்காமல் ‘வீடு/குடும்ப நிர்வாகம்’ என்ற பரந்த பொருளையும் தக்கவைக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஒரே நீண்ட எபிரெய வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; ‘பின்னர்’ கதையின் தொடர்ச்சியை இயல்பாக்குகிறது.
