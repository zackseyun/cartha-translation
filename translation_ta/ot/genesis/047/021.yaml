source:
  edition: WLC
  text: וְ/אֶ֨ת הָ/עָ֔ם הֶעֱבִ֥יר אֹת֖/וֹ לֶ/עָרִ֑ים מִ/קְצֵ֥ה גְבוּל מִצְרַ֖יִם וְ/עַד קָצֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/021.yaml
  text: As for the people[a], he moved them to the cities, from one end of the territory of Egypt to the other.
translation:
  language: ta
  text: மக்களையோ[a] அவன் எகிப்தின் நிலப்பரப்பின் ஒரு முனையிலிருந்து மறுமுனைவரை நகரங்களுக்கு மாற்றினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை நகரங்களுக்கு இடம்பெயரச் செய்தான்.” வேறுபட்ட உரைப் புரிதலைப் பின்பற்றும் சில மொழிபெயர்ப்புகள், யோசேப்பு மக்களை அடிமைகளாக்கினான் என்று கூறுகின்றன; ஆனால் இங்குள்ள எபிரெய வாசகம் அவர்களை இடமாற்றியதையே இன்னும் நேரடியாகக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  choice: மக்களை
  rationale: இது யோசேப்பின் நடவடிக்கையால் பாதிக்கப்பட்ட எகிப்திய மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது. ‘மக்கள்’ என்பது இயல்பான, பொதுவாகப் புரியக்கூடிய கூட்டுப்பெயர்.
- source_word: הֶעֱבִיר אֹתוֹ
  choice: இடம்பெயரச் செய்தான்
  rationale: עבר என்பதன் ஹிஃபில் வடிவம் ‘கடக்கச் செய், நகர்த்து, மாற்று’ என்ற பொருள்களைத் தருகிறது. இச்சூழலில் மக்களை ஓரிடத்திலிருந்து மற்றோர் இடத்துக்கு மாற்றியதைக் குறிக்க ‘இடம்பெயரச் செய்தான்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: לֶעָרִים
  choice: நகரங்களுக்கு
  rationale: ל முன்னிடைச்சொல் இங்கு சென்றடையும் இடத்தைக் குறிக்கிறது. ‘நகரங்களுக்கு’ என்பது மூலத்தின் திசைசார் பொருளைப் பாதுகாக்கிறது; ‘நகரங்களுக்குள்’ என்று கூறி தேவையற்ற குறிப்பைச் சேர்ப்பதில்லை.
- source_word: מִקְצֵה גְבוּל מִצְרַיִם וְעַד קָצֵהוּ
  choice: எகிப்தின் ஆட்சிப்பரப்பின் ஒரு முனையிலிருந்து மறுமுனைவரை
  rationale: גְבוּל இங்கு வெறும் எல்லைக்கோட்டைக் காட்டிலும் எகிப்தின் நிலப்பரப்பைக் குறிக்கிறது. ‘ஒரு முனையிலிருந்து மறுமுனைவரை’ என்ற தொடர் முழு பரப்பையும் குறிக்கும் எபிரெய இருமுனைச் சொல்லாட்சியை இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: எகிப்திய மக்கள்மீது யோசேப்பு மேற்கொண்ட நடவடிக்கையின் பொருள்
  choice: மக்களை நகரங்களுக்கு இடம்பெயரச் செய்தான்
  alternative: மக்களை அடிமைகளாக்கினான்; அல்லது நகரம் நகரமாக மாற்றினான்
  rationale: மசோரா எபிரெய வாசகம் நேரடியாக மக்களை நகர்த்துதல் அல்லது இடமாற்றுதல் பற்றியே கூறுகிறது; அடிமைகளாக்கியதாக இவ்வசனத்தில் வெளிப்படையாகச் சொல்லவில்லை. ஆகவே வேறுபட்ட உரைமரபையோ விளக்க விரிவாக்கத்தையோ முதன்மை உரைக்குள் கொண்டுவராமல், மூலவாசகத்தின் இயல்பான பொருள் தக்கவைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆட்சிப்பரப்பு’ என்பது ‘எல்லை’ என்பதை வெறும் எல்லைக்கோடாகத் தவறாகப் புரிந்துகொள்வதைத் தவிர்த்து, இங்கு குறிக்கப்படும் முழு நிலப்பரப்பை வெளிப்படுத்துகிறது.
