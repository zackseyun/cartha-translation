base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/022.yaml
  text: Only the land of the priests he did not buy[a], because the priests had an allotment from Pharaoh, and they ate their allotment that Pharaoh gave them. Therefore they did not sell their land.
translation:
  language: ta
  text: ஆசாரியர்களின் நிலத்தை மட்டும் அவன் வாங்கவில்லை. ஏனெனில், ஆசாரியர்களுக்குப் பார்வோனிடமிருந்து ஒதுக்கப்பட்ட பங்கு[a] இருந்தது; பார்வோன் அவர்களுக்குக் கொடுத்த அந்தப் பங்கை அவர்கள் உண்டார்கள். ஆகவே, அவர்கள் தங்கள் நிலத்தை விற்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிர்ணயிக்கப்பட்ட கொடுப்பனவு,” “உரிய பங்கு,” அல்லது “உணவுப்படி.” இங்குள்ள எபிரெயச் சொற்களான חֹק / חֻקָּם, முதன்மையாக ஒரு சட்டத்தைக் குறிக்காமல், ஒதுக்கி வழங்கப்பட்ட பங்கைக் குறிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: மட்டும்
  rationale: முந்தைய பொதுக் கூற்றிலிருந்து ஆசாரியர்களின் நிலத்தை விதிவிலக்காகக் காட்டும் கட்டுப்படுத்தும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אַדְמַת הַכֹּהֲנִים
  choice: ஆசாரியர்களின் நிலம்
  rationale: ஆசாரியர்களுக்குச் சொந்தமான நிலப்பகுதியைக் குறிக்கும் எபிரெயக் கட்டமைப்பின் தெளிவான தமிழ் வடிவம்.
- source_word: קָנָה
  choice: வாங்கவில்லை
  rationale: பஞ்சக்காலப் பொருளாதாரச் சூழலில் யோசேப்பு நிலத்தை விலைக்கு வாங்கியதைக் குறிக்கும் நேரடியான வினைச்சொல்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: ஆசாரியர்களின் நிலம் வாங்கப்படாததற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: חֹק / חֻקָּם
  choice: ஒதுக்கப்பட்ட பங்கு / தங்களுக்குக் கொடுத்த அந்தப் பங்கு
  rationale: இங்கு இச்சொல் முதன்மையாகச் சட்டத்தையோ கட்டளையையோ அல்ல, பார்வோனால் அதிகாரப்பூர்வமாக வழங்கப்பட்ட வாழ்வாதாரப் பங்கைக் குறிக்கிறது. இரு இடங்களிலும் ‘பங்கு’ என்பதைக் கொண்டு எபிரெயச் சொல்லின் மறுபயன்பாட்டைத் தக்கவைக்கிறது.
- source_word: מֵאֵת פַּרְעֹה
  choice: பார்வோனிடமிருந்து
  rationale: அந்தப் பங்கின் மூலத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְאָכְלוּ אֶת חֻקָּם
  choice: அந்தப் பங்கை அவர்கள் உண்டார்கள்
  rationale: எபிரெய மூலத்தின் தெளிவான ‘உண்டார்கள்’ என்ற வினையைப் பாதுகாப்பதோடு, முன்பு கூறப்பட்ட ஒதுக்கப்பட்ட பங்குடன் தொடர்பையும் தக்கவைக்கிறது.
- source_word: אֲשֶׁר נָתַן לָהֶם פַּרְעֹה
  choice: பார்வோன் தங்களுக்குக் கொடுத்த
  rationale: அந்தப் பங்கை வழங்கியவர் பார்வோன் என்பதைத் தெளிவாகவும் சுருக்கமாகவும் கூறுகிறது.
- source_word: עַל כֵּן
  choice: ஆகவே
  rationale: முந்தைய காரணத்திலிருந்து வரும் விளைவைத் தெளிவாகக் குறிக்கிறது.
- source_word: מָכְרוּ
  choice: விற்கவில்லை
  rationale: நிலத்தை விற்பனை செய்வதைக் குறிக்கும் நேரடியான வணிகச் சொல்.
- source_word: אַדְמָתָם
  choice: தங்கள் நிலம்
  rationale: ஆசாரியர்களுக்குச் சொந்தமான நிலத்தை இயல்பான தமிழில் குறிக்கிறது.
