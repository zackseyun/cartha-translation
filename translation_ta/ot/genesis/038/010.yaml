source:
  edition: WLC
  text: וַ/יֵּ֛רַע בְּ/עֵינֵ֥י יְהוָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה וַ/יָּ֖מֶת גַּם אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/010.yaml
  text: What he did was evil in the sight of Yahweh, so he put him to death also.
translation:
  language: ta
  text: அவன் செய்தது யாவேயின் பார்வையில் தீமையாக இருந்தது; ஆகவே, அவர் அவனையும் கொன்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרַע
  choice: தீமையாக இருந்தது
  rationale: רעע என்பதன் நிலைப்பொருளை நேரடியாக வெளிப்படுத்தி, செயலை வெறும் மனவருத்தம் அளித்ததாக அல்லாமல் ஒழுக்கரீதியான தீமை எனக் குறிப்பிடுகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: தெய்வீக மதிப்பீட்டைக் குறிக்கும் எபிரேய மரபுத்தொடரின் பொருளையும் அதன் பார்வை உருவகத்தையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்ற தனிப்பட்ட தெய்வீகப் பெயரை ஒரு பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: אֲשֶׁר עָשָׂה
  choice: அவன் செய்தது
  rationale: முந்தைய வசனத்தில் ஓனான் செய்த செயலைச் சுட்டும் சார்புத் தொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיָּמֶת
  choice: சாகடித்தார்
  rationale: מות என்பதன் ஹிஃபீல் காரணவினை வடிவைத் தெளிவாகக் காத்து, அவனுடைய மரணம் யாவேயின் நேரடியான தீர்ப்பு என்பதை வெளிப்படுத்துகிறது.
- source_word: גַּם אֹתוֹ
  choice: அவனையும்
  rationale: முன்பு ஏருக்கு நேரிட்ட தீர்ப்பு ஓனானுக்கும் நேரிட்டது என்ற இணைப்பை גם மற்றும் אֹתוֹ ஆகிய இரண்டின் வலிமையோடு சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரைப் பொதுப் பட்டப்பெயரால் மாற்றாமல், அதன் ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புக்கு நெருக்கமாகத் தமிழில் தருகிறது.
- issue: וַיָּמֶת என்பதில் தெய்வீகத் தீர்ப்பின் செயற்பாடு
  choice: அவர் அவனையும் சாகடித்தார்
  alternative: அவனும் இறந்துபோகச் செய்தார் / அவனும் இறந்தான்
  rationale: எபிரேய காரணவினை வடிவம் யாவே மரணத்தை நேரடியாக நிகழ்த்தியதாகக் கூறுகிறது; அதை மறைமுகமாகவோ செயலற்றதாகவோ மென்மைப்படுத்தவில்லை.
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘சாகடித்தார்’ என்பது கடுமையான சொல்லாக இருந்தாலும், மூலத்தின் காரணவினைத் தன்மையையும் தெய்வீகத் தீர்ப்பின் நேரடித் தன்மையையும் தெளிவாகக் காக்கிறது.
