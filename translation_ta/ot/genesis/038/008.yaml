  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוּדָה֙ לְ/אוֹנָ֔ן בֹּ֛א אֶל אֵ֥שֶׁת אָחִ֖י/ךָ וְ/יַבֵּ֣ם אֹתָ֑/הּ וְ/הָקֵ֥ם זֶ֖רַע לְ/אָחִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/008.yaml
  text: Then Judah said to Onan[a], “Go in to your brother’s wife, perform the duty of a brother-in-law to her, and raise up offspring for your brother.”
translation:
  language: ta
  text: அப்போது யூதா ஓனானிடம், “உன் சகோதரனுடைய மனைவியுடன் சேர்ந்துகொள்; அவளிடம் மைத்துனனுக்குரிய கடமையை நிறைவேற்றி[a], உன் சகோதரனுக்குச் சந்ததி உண்டாக்கு” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் தொழில்நுட்பமாக, “அவளிடம் மைத்துன முறைத் திருமணக் கடமையை நிறைவேற்றி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: தொடர்ச்சியான கதைநடையை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: בֹּא אֶל
  choice: '... மனைவியுடன் சேர்ந்துகொள்'
  rationale: இது திருமணச் சூழலில் உடலுறவைக் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழில் கண்ணியமாகவும் போதிய தெளிவுடனும் அதன் பொருளைத் தெரிவிக்கிறது.
- source_word: אֵשֶׁת אָחִיךָ
  choice: உன் சகோதரனுடைய மனைவி
  rationale: எபிரெய உடைமைத் தொடரின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: וְיַבֵּם אֹתָהּ
  choice: அவளிடம் மைத்துனனுக்குரிய கடமையை நிறைவேற்று
  rationale: இறந்த சகோதரனுக்காகச் சந்ததியைத் தொடரச் செய்யும் குடும்பக் கடமையைக் குறிக்கும் தொழில்நுட்ப வினையின் பொருளை, பிற்காலச் சட்ட விவரங்களைச் சேர்க்காமல் எடுத்துரைக்கிறது.
- source_word: וְהָקֵם זֶרַע
  choice: சந்ததி உண்டாக்கு
  rationale: இறந்த சகோதரனின் வழியைத் தொடரும் பிள்ளைப்பேற்றை இங்கு குறிக்கிறது; ‘விதை’ என்ற சொற்பொருள் தமிழில் இச்சூழலில் தெளிவற்றதாக இருக்கும்.
- source_word: לְאָחִיךָ
  choice: உன் சகோதரனுக்கு
  rationale: பிறக்கும் சந்ததி இறந்த சகோதரனுடையதாகக் கணிக்கப்பட வேண்டிய நோக்கையும் பயனையும் சுருக்கமாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: மைத்துனக் கடமையைக் குறிக்கும் தொழில்நுட்பச் சொல்லை எவ்வாறு மொழிபெயர்ப்பது
  choice: அவளிடம் மைத்துனனுக்குரிய கடமையை நிறைவேற்று
  alternative: அவளை மைத்துன முறைப்படி மணந்துகொள்
  rationale: יִבֵּם என்பது வெறும் திருமணத்தையோ வெறும் உடலுறவையோ மட்டும் குறிக்காமல், இறந்த சகோதரனுக்குச் சந்ததி ஏற்படுத்தும் குடும்பப் பொறுப்பைக் குறிக்கிறது. தேர்ந்தெடுக்கப்பட்ட வாசகம் அந்தப் பொறுப்பைத் தெளிவாக வைத்திருக்கிறது; அதேவேளை பிற்காலச் சட்ட அல்லது சமய விளக்கங்களை வசனத்திற்குள் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. உடலுறவைக் குறிக்கும் எபிரெய மரபுத்தொடர் மிக வெளிப்படையாகவும் மிக மறைமுகமாகவும் இல்லாமல் ‘சேர்ந்துகொள்’ என வழங்கப்பட்டுள்ளது; குடும்ப-சட்டக் கடமையின் தனித்துவம் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
