translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை. எபிரெய மொழியின் திருமண ஏற்பாட்டுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; பிரிவுசார் விளக்கங்கள் சேர்க்கப்படவில்லை.
