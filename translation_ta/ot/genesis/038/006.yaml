  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּקַּ֧ח יְהוּדָ֛ה אִשָּׁ֖ה לְ/עֵ֣ר בְּכוֹר֑/וֹ וּ/שְׁמָ֖/הּ תָּמָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/006.yaml
  text: And Judah took a wife for Er his firstborn, and her name was Tamar.
translation:
  language: ta
  text: யூதா தன் முதற்பேறான மகன் ஏருக்கு ஒரு மனைவியை மணமுடித்து வைத்தான்; அவள் பெயர் தாமார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: மணமுடித்து வைத்தான்
  rationale: לָקַח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்’ என்றாலும், தந்தையான யூதா ஏருக்காக மனைவியைத் தேர்ந்தெடுத்து மணம் செய்வித்த சூழலில், நவீன தமிழில் ‘மணமுடித்து வைத்தான்’ என்பது எபிரெயக் கட்டமைப்பின் நோக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִשָּׁה
  choice: ஒரு பெண்ணை
  rationale: இங்கு אִשָּׁה திருமண உறவுக்குள் கொண்டுவரப்படும் பெண்ணைக் குறிக்கிறது. ‘ஒரு பெண்ணை மணமுடித்து வைத்தான்’ என்ற முழுத் தொடரில் மனைவி என்ற உறவுப்பொருள் தெளிவாக உள்ளது; ‘ஒரு மனைவியை மணமுடித்து வைத்தான்’ என்பது தமிழில் இயல்பற்றது.
- source_word: לְעֵר
  choice: ஏருக்கு
  rationale: לְ இங்கு செயல் யாருக்காகச் செய்யப்பட்டது என்பதைக் குறிக்கிறது; தமிழின் ‘-க்கு’ உருபு இதை நேர்த்தியாக வெளிப்படுத்துகிறது.
- source_word: בְּכוֹרוֹ
  choice: தன் மூத்த மகன்
  rationale: בְּכוֹר என்பது முதற்பேறான மகனைக் குறிக்கிறது. இச்சூழலில் இயல்பான நவீன தமிழுக்காக ‘மூத்த மகன்’ பயன்படுத்தப்பட்டுள்ளது; ‘தன்’ என்பது அது யூதாவின் மகன் என்பதைத் தெளிவாக்குகிறது.
- source_word: וּשְׁמָהּ
  choice: அவள் பெயர்
  rationale: எபிரெயத்தின் வழக்கமான பெயர் அறிமுகச் சொற்றொடர் தமிழில் இயல்பாக ‘அவள் பெயர் ...’ என வழங்கப்படுகிறது; இறந்தகால இணைப்புச் சொல் தமிழில் தேவையில்லை.
- source_word: תָּמָר
  choice: தாமார்
  rationale: தனிப்பெயர் எபிரெய உச்சரிப்பை நெருங்கிய, தமிழில் நிலைபெற்ற வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது.
