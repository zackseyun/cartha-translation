base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/005.yaml
  text: She conceived again and bore a son[a], and she called his name Shelah[b]. And he was at Chezib when she bore him.
translation:
  language: ta
  text: அவள் மறுபடியும் ஒரு மகனைப் பெற்றாள்; அவனுக்குச் சேலா என்று பெயரிட்டாள். அவள் அவனைப் பெற்றபோது அவன் கெசீபில் இருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில பழங்காலச் சாட்சிகளும் விளக்க மரபுகளும், “அவள் அவனைப் பெற்றபோது அவள் கெசீபில் இருந்தாள்” என்று வாசிக்கின்றன. எபிரெய உரையில் “அவன் இருந்தான்” என்ற ஆண்பால் வடிவமே உள்ளது; அது யாரைக் குறிக்கிறது என்பது தெளிவாக இல்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּסֶף עוֹד וַתֵּלֶד בֵּן
  choice: அவள் மறுபடியும் ஒரு மகனைப் பெற்றாள்
  rationale: יסף + עוד மீண்டும் நிகழ்ந்த செயலைக் குறிக்கிறது. தமிழில் இயல்பாகவும் எபிரெய உரையின் நிகழ்வுப்போக்கிற்கு நெருக்கமாகவும் இருக்க, கருத்தில் உள்ள மீண்டும் மகப்பேறு பெற்ற நிகழ்வு நேரடியாகச் சொல்லப்பட்டுள்ளது.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ שֵׁלָה
  choice: அவனுக்குச் சேலா என்று பெயரிட்டாள்
  rationale: ‘அவனுடைய பெயரை அழைத்தாள்’ என்ற சொற்சொல் வடிவத்தைவிட, அதே பொருளைத் தெளிவாகத் தரும் இயல்பான நவீனத் தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְהָיָה
  choice: அவன் ... இருந்தான்
  rationale: மசோரா எபிரெய உரையில் வினைச்சொல் ஆண்பால் ஒருமையில் உள்ளது; ஆகவே அந்த இலக்கண வடிவம் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது. குறிக்கப்படும் நபர் யார் என்பதில் உள்ள தெளிவின்மை தீர்க்கப்படவில்லை.
- source_word: בִכְזִיב
  choice: கெசீபில்
  rationale: இடப்பெயர் எபிரெய ஒலிப்புக்கு ஏற்ப தமிழில் எழுத்துப்பெயர்க்கப்பட்டது; ב முன்னிடைச்சொல் இடத்தைக் குறிப்பதால் ‘-இல்’ பயன்படுத்தப்பட்டது.
- source_word: בְּלִדְתָּהּ אֹתוֹ
  choice: அவள் அவனைப் பெற்றபோது
  rationale: ב + infinitive construct இங்குத் தரும் காலப்பொருள், இயல்பான தமிழில் ‘பெற்றபோது’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: וְהָיָה என்பதன் இலக்கணப் பாலினமும் அதன் மறைமுக எழுவாயும்
  choice: ‘அவன்’ என்ற ஆண்பால் வாசகத்தை முதன்மை உரையில் வைத்தல்
  alternative: ‘அவள் அவனைப் பெற்றபோது அவள் கெசீபில் இருந்தாள்’
  rationale: WLC உரை ஆண்பால் ஒருமையை வாசிக்கிறது; இதைத் திருத்தி பெண்பாலாக்காமல் முதன்மை உரையில் பாதுகாப்பது மூலச்சான்றுக்கு விசுவாசமானது. அதேவேளையில் சில பழங்காலச் சாட்சிகள் மற்றும் விளக்க மரபுகள் பெண்பால் எழுவாயைப் புரிந்துகொள்வதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் ஆண்பால் வடிவம் மாற்றப்படாமல், அதிலுள்ள உண்மையான தெளிவின்மை அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. ‘கெசீப்/கெசீபு’ போன்ற மாற்று எழுத்துப்பெயர்ப்புகள் தேவையற்ற சுமையாக இருப்பதால் சேர்க்கப்படவில்லை.
