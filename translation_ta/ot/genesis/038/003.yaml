  text: וַ/תַּ֖הַר וַ/תֵּ֣לֶד בֵּ֑ן וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ עֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/003.yaml
  text: She conceived and bore a son[a], and he called his name Er.
translation:
  language: ta
  text: அவள் கருவுற்று ஒரு மகனைப் பெற்றாள், அவன் அவனுக்குப் “ஏர்” என்று பெயரிட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘அவன் அவனுடைய பெயரை ஏர் என்று அழைத்தான்’ என்று ஆண்பால் ஒருமை வினைச்சொல் உள்ளது; ‘அவன்’ என்பது இயல்பாக யூதாவைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּהַר
  choice: அவள் கருவுற்று
  rationale: הרה என்பது கருவுறுதலைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் நிகழ்வின் தொடர்ச்சியை இது வெளிப்படுத்துகிறது.
- source_word: וַתֵּלֶד
  choice: ஒரு மகனைப் பெற்றாள்
  rationale: Qal வடிவிலுள்ள ילד இங்கு குழந்தையைப் பெற்றெடுப்பதைக் குறிக்கிறது. ‘மகனைப் பெற்றாள்’ என்பது சுருக்கமான, இயல்பான தமிழ் கதைநடை.
- source_word: בֵּן
  choice: ஒரு மகன்
  rationale: בן இங்கு ஆண் குழந்தையையும் குடும்ப உறவையும் குறிக்கிறது; ‘மகன்’ இரண்டையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: அவனுக்கு ... என்று அவன் பெயரிட்டான்
  rationale: எபிரெயச் சொற்றொடரின் பொருள் ‘அவனுடைய பெயரை அழைத்தான்’ என்பதாக இருந்தாலும், தமிழில் ‘அவனுக்கு ... என்று பெயரிட்டான்’ இயல்பானது. வினைச்சொல்லின் ஆண்பால் ஒருமை எழுவாய் ‘அவன்’ என்று வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: עֵר
  choice: ஏர்
  rationale: எபிரெய உச்சரிப்புக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: וַיִּקְרָא (‘பெயரிட்டான்’) என்பதன் எழுவாய்
  choice: ஆண்பால் ஒருமையைப் பாதுகாத்து, யூதாவைக் குறிக்கும் ‘அவன்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: சில மொழிபெயர்ப்புகள் ‘அவள் பெயரிட்டாள்’ என மாற்றுகின்றன அல்லது ‘அவனுக்கு ஏர் என்று பெயரிடப்பட்டது’ என எழுவாயைத் தவிர்க்கின்றன.
  rationale: முந்தைய இரண்டு வினைச்சொற்கள் பெண்பால் ஒருமையில் உள்ளன; ஆனால் וַיִּקְרָא தெளிவாக ஆண்பால் ஒருமை. சூழலில் அதன் இயல்பான எழுவாய் யூதா. இந்த இலக்கண மாற்றத்தைச் சீராக்காமல் பாதுகாப்பது மூலமொழிக்குச் செம்மையாகும்.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் ஆண்பால் எழுவாய் மாற்றம் அடிக்குறிப்புடன் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
