translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற சொல் மூலத்தின் திடீர் வியப்பைத் தக்கவைக்கிறது. எபிரெயில் உள்ள פרץ சொல்விளையாட்டைத் தமிழில் முழுமையாக மறுஉருவாக்க இயலாததால், முக்கிய கருத்து உரையில் இயல்பாக வழங்கப்பட்டு அதன் வடிவம் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
