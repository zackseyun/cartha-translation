base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/029.yaml
  text: And as he drew back his hand[a], behold, his brother came out. Then she said[b], “What a breach you have made for yourself!” So his name was called Perez.
translation:
  language: ta
  text: அவன் தன் கையைப் பின்னால் இழுத்துக்கொண்டபோது, இதோ, அவனுடைய சகோதரன் வெளியே வந்தான். அப்போது அவள், “உனக்காக நீ என்ன ஒரு பிளவை ஏற்படுத்தினாய்!”[a] என்றாள். எனவே அவனுக்கு பேரேஸ் என்று பெயரிடப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “நீ உனக்காக என்ன ஒரு உடைப்பை உடைத்திருக்கிறாய்!” என்பது போன்ற சொற்றொடர் உள்ளது. ‘உடைத்தல்/பிளத்தல்’ என்ற பொருளுடைய פרץ (ப-ர-ட்ஸ்) என்ற வேர் இங்கு வினையாகவும் பெயர்ச்சொல்லாகவும் வருகிறது; ‘பேரேஸ்’ என்ற பெயரும் இதே வேரிலிருந்து வருகிறது.
    reason: lexical_wordplay
lexical_decisions:
- source_word: כְּמֵשִׁיב יָדוֹ
  choice: அவன் தன் கையைப் பின்னால் இழுத்துக்கொண்டபோது
  rationale: שׁוב என்பதன் Hiphil வடிவம், பிறப்புச் சூழலில் ஏற்கெனவே நீட்டிய கையைத் திரும்ப இழுத்துக்கொண்ட செயலைக் குறிக்கிறது. தமிழ் நடை இயல்பாக இருக்கவும் உடல்சார் செயல் தெளிவாகத் தெரியவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה கதைநிகழ்வின் திடீர் திருப்பத்தையும் வியப்பையும் உயிரோட்டமாகச் சுட்டுகிறது; ‘இதோ’ அந்த விளைவைத் தக்கவைக்கிறது.
- source_word: יָצָא אָחִיו
  choice: அவனுடைய சகோதரன் வெளியே வந்தான்
  rationale: பிறப்புச் சூழலில் יָצָא என்பதன் நேரடியான உடல்சார் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: מַה פָּרַצְתָּ עָלֶיךָ פָּרֶץ
  choice: உனக்காக நீ எப்படிப் பிளந்துகொண்டு வழி உண்டாக்கிவிட்டாய்!
  rationale: வினைச்சொல்லும் பெயர்ச்சொல்லுமாக இருமுறை வரும் פרץ வேரின் ‘உடைத்துக்கொண்டு வழி ஏற்படுத்துதல்’ என்ற கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது. கடினமான עָלֶיךָ கூறை ‘உனக்காக’ எனத் தக்கவைத்துள்ளது; எபிரெயச் சொல்விளையாட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: פָּרֶץ
  choice: பேரேஸ்
  rationale: தனிப்பெயர் நவீனத் தமிழுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்படுகிறது. பெயருக்கும் முந்தைய பிரகடனத்துக்கும் இடையிலான எபிரெயச் சொல்விளையாட்டு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: וַיִּקְרָא שְׁמוֹ פָּרֶץ
  choice: எனவே அவனுக்கு பேரேஸ் என்று பெயரிடப்பட்டது
  rationale: எபிரெயில் பெயரிடுபவர் யார் என்பது வெளிப்படையாகக் கூறப்படாததால், தமிழிலும் செயப்பாட்டு வடிவம் பயன்படுத்தப்பட்டு குறிப்பிடப்படாத எழுவாய் சேர்க்கப்படவில்லை.
