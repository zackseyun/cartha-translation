base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/004.yaml
  text: She conceived again and bore a son, and she named him Onan.
translation:
  language: ta
  text: அவள் மீண்டும் கருவுற்று ஒரு மகனைப் பெற்றாள்; அவனுக்கு ஓனான் என்று பெயரிட்டாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: அவள் கருவுற்று
  rationale: הרה என்பது கருவுறுதலைக் குறிக்கிறது. ‘கருவுற்று’ என்பது சுருக்கமான, இயல்பான நவீனத் தமிழ் நடையாகும்.
- source_word: עוֹד
  choice: மீண்டும்
  rationale: தொடர்ச்சியான பிறப்புகளை விவரிக்கும் இச்சூழலில் עוֹד தொடர்நிலையை அல்ல, மறுபடியும் நிகழ்வதைக் குறிக்கிறது.
- source_word: וַתֵּלֶד בֵּן
  choice: ஒரு மகனைப் பெற்றாள்
  rationale: ילד + בֵּן என்ற எபிரெயப் பிறப்புச் சொல்லாக்கத்தை ‘ஒரு மகனைப் பெற்றாள்’ என்பது இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: அவனுக்கு … என்று பெயரிட்டாள்
  rationale: ‘அவனுடைய பெயரை அழைத்தாள்’ என்ற சொற்சொல்லான வடிவத்தைவிட, பெயரிடும் செயலை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אוֹנָן
  choice: ஓனான்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
