translation_notes:
  register: நவீன தரத் தமிழில் இயல்பானதாயும் கண்ணியமானதாயும் வடிவமைக்கப்பட்டது. மூலத்தின் செயப்படுபொருள் அமைப்பு, உடைமைத் தொடர்பு, பன்மை ‘கயிறுகள்’, மற்றும் நָא-வின் பணிவான வேண்டுகோள் ஆகியவை பாதுகாக்கப்பட்டுள்ளன. அடிக்குறி குறியீடு அது விளக்கும் הַכֶּר נָא என்பதற்கான ‘அடையாளம் காணுங்கள்’ என்ற சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
