  text: As she was being brought out[a], she sent word to her father-in-law, saying, “I am pregnant by the man to whom these belong.” And she said, “Please identify whose signet ring, cords, and staff these are.”
translation:
  language: ta
  text: அவள் வெளியே கொண்டுவரப்பட்டபோது, தன் மாமனாருக்கு, “இந்தப் பொருள்கள் யாருக்குச் சொந்தமானவையோ, அவனால் நான் கர்ப்பமாகியிருக்கிறேன்” என்று செய்தி அனுப்பினாள். பின்னர் அவள், “இந்த முத்திரையும் கயிறுகளும் கோலும் யாருடையவை என்று தயவுசெய்து அடையாளம் காணுங்கள்[a]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தயவுசெய்து அறிந்துகொள்ளுங்கள்.” எபிரெய வினைச்சொல் ‘அறிந்துகொள்’ அல்லது ‘அடையாளம் காண்’ என்று பொருள்படலாம்; இங்கு சான்றுகளை வைத்து உரிமையாளரைத் தீர்மானிக்கும்படி வலியுறுத்தும் நயம் உள்ளது.
    reason: lexical_alternative
