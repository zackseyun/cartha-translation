- source_word: לְאִישׁ אֲשֶׁר אֵלֶּה לּוֹ אָנֹכִי הָרָה
  choice: இந்தப் பொருள்கள் எவனுக்குச் சொந்தமானவையோ, அவனால் நான் கர்ப்பமாயிருக்கிறேன்
  rationale: לְאִישׁ உடன் வரும் உடைமைத் தொடர்பையும், கர்ப்பத்திற்குக் காரணமான ஆணைக் குறிக்கும் மறைபொருளையும் இயல்பாகப் பாதுகாக்கிறது; אָנֹכִי வலியுறுத்தும் ‘நான்’ என்பதும் இடம்பெறுகிறது.
- source_word: הַכֶּר נָא
  choice: தயவுசெய்து அடையாளம் காணுங்கள்
  rationale: נכר என்பதற்கு ‘அறிந்துகொள்/அடையாளம் காண்’ என்ற பொருள் உண்டு; நָא-வின் வேண்டுகோள் நயத்தை ‘தயவுசெய்து’ தருகிறது. இச்சூழலில் சான்றுப் பொருள்களின் உரிமையாளரை நிர்ணயிக்கும் கூர்மையான அழைப்பாக உள்ளது.
- source_word: חֹתֶמֶת
  choice: முத்திரை
  rationale: தனிப்பட்ட அடையாளத்திற்கும் முத்திரையிடுதலுக்கும் பயன்படும் seal-ஐக் குறிக்கிறது. மூலத்தில் மோதிரம் என்று வெளிப்படையாக இல்லாததால் ‘முத்திரை மோதிரம்’ எனக் குறிப்பாக்கப்படவில்லை.
- source_word: פְּתִילִים
  choice: கயிறுகள்
  rationale: பன்மை வடிவத்தைப் பாதுகாக்கும் நேரடியான, பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: מַטֶּה
  choice: கோல்
  rationale: மூதாதையர் கதையாடல் சூழலில் எடுத்துச் செல்லப்படும் staff-க்கு இயல்பான தமிழ் இணை.
- source_word: לְמִי
  choice: யாருடையவை
  rationale: לְ உடன் வரும் வினாப்பெயரின் உடைமைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
