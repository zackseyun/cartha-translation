source:
  edition: WLC
  text: וַ/יְהִ֗י עֵ֚ר בְּכ֣וֹר יְהוּדָ֔ה רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְמִתֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/007.yaml
  text: Er[a], Judah’s firstborn, was evil in the sight of Yahweh, and Yahweh put him to death.
translation:
  language: ta
  text: யூதாவின் மூத்த மகனான ஏர், யாவேயின் பார்வையில் தீயவனாக இருந்தான்; யாவே அவனைச் சாகடித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதிகச் சொற்சார்பாக, ‘யாவே அவனை இறக்கச் செய்தார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: இருந்தான்
  rationale: வினைச்சொல் கதையைத் தொடர்ந்தாலும், எபிரெயத்தில் வெளிப்படையான ‘இப்போது’ என்ற காலச்சொல் இல்லை. எனவே தமிழில் தேவையற்ற தொடக்க இடைச்சொல் சேர்க்கப்படவில்லை.
- source_word: עֵר
  choice: ஏர்
  rationale: தனிப்பெயர் அதன் எபிரெய ஒலிப்புக்கு ஏற்ப தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: בְּכוֹר יְהוּדָה
  choice: யூதாவின் மூத்த மகனான
  rationale: இணைப்பு அமைப்பு மகனின் உறவையும் பிறப்பு வரிசையையும் குறிக்கிறது. ‘மூத்த மகன்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: רַע
  choice: தீயவனாக
  rationale: இங்கு அந்தச் சொல் வெறும் மோசமான நிலையை அல்ல, யாவேயின் மதிப்பீட்டில் அறநெறி சார்ந்த தீமையைக் குறிக்கிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: சொல்லுக்குச் சொல் ‘கண்களில்’ என்பதற்குப் பதிலாக, யாவேயின் மதிப்பீட்டின்படி என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பொதுப்பட்டமான ‘ஆண்டவர்’ என்பதல்ல, தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயர்; அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிப்பைத் தமிழில் எழுத்துப்பெயர்க்கிறது.
- source_word: וַיְמִתֵהוּ
  choice: அவனைச் சாகடித்தார்
  rationale: מות என்பதன் ஹிஃபில் வடிவம் நேரடியான காரணச் செயலைக் குறிக்கிறது. ‘சாகடித்தார்’ என்பது அந்தத் தெய்வீகச் செயலாற்றலை மென்மைப்படுத்தாமல், இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலவசனம் தெய்வீகத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயராக மாற்றாமல் தனிப்பெயராகவே எழுத்துப்பெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: ஏரின் மரணத்தில் தெய்வீகச் செயலாற்றல்
  choice: யாவே அவனைச் சாகடித்தார்
  alternative: யாவே அவனை இறக்கச் செய்தார்
  rationale: எபிரெயக் காரணவினை ஏரின் மரணத்தை யாவேயின் நேரடிச் செயலாகக் கூறுகிறது. அது எந்த வழியில் நடந்தது அல்லது அதற்கான விரிவான நீதி விளக்கம் என்ன என்பதை வசனம் கூறாததால், மொழிபெயர்ப்பும் அவற்றைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘கண்களில்’ போன்ற இயல்பற்ற சொற்சார்பு மரபுத்தொடரும், ‘சாகப்பண்ணினார்’ போன்ற பழைய நடையும் தவிர்க்கப்பட்டுள்ளன.
