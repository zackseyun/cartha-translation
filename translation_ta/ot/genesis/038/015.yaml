  yaml_path: translation/ot/genesis/038/015.yaml
  text: When Judah saw her[a], he thought she was a prostitute, because she had covered her face.
translation:
  language: ta
  text: யூதா அவளைப் பார்த்தபோது, அவள் தன் முகத்தை மூடியிருந்ததால், அவளை ஒரு விலைமகள் என்று நினைத்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளை ஒரு விலைமகளாகக் கருதினான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאֶהָ
  choice: யூதா அவளைப் பார்த்தபோது
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘பார்’. தொடர் நிகழ்வுகளுக்கிடையிலான காலத் தொடர்பை இயல்பான நவீனத் தமிழில் காட்ட ‘பார்த்தபோது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיַּחְשְׁבֶהָ
  choice: அவளை ... என்று நினைத்தான்
  rationale: חשב இங்கு தாமாரின் அடையாளத்தைப் பற்றிய யூதாவின் மனத் தீர்மானத்தைக் குறிக்கிறது. ‘என்று நினைத்தான்’ என்பது அந்தத் தவறான ஊகத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: לְזוֹנָה
  choice: ஒரு விபச்சாரி
  rationale: זונה என்பது பாலுறவுக்காகத் தன்னை வழங்கும் பெண்ணைக் குறிக்கிறது. ‘விபச்சாரி’ என்பது நவீனத் தமிழில் தெளிவாகப் புரியும் நேரடியான இணைச்சொல்; பழமையான அல்லது சமகாலச் சமூகவியல் நுணுக்கங்களைச் சேர்க்கும் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
- source_word: כִּי
  choice: என்பதால்
  rationale: כִּי யூதாவின் முடிவுக்கான காரணத்தை அறிமுகப்படுத்துகிறது. ‘என்பதால்’ தமிழில் காரணத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: כִסְּתָה פָּנֶיהָ
  choice: அவள் தன் முகத்தை மூடியிருந்தாள்
  rationale: כסה என்பது ‘மூடு’ என்றும் פניה என்பது ‘அவளுடைய முகம்’ என்றும் பொருள்படும். யூதாவின் ஊகத்திற்கு முன்பே நிலவிய காரணச் சூழலை ‘மூடியிருந்தாள்’ இயல்பாக வெளிப்படுத்துகிறது.
