source:
  edition: WLC
  text: וַ/יֵּ֣דַע אוֹנָ֔ן כִּ֛י לֹּ֥א ל֖/וֹ יִהְיֶ֣ה הַ/זָּ֑רַע וְ/הָיָ֞ה אִם בָּ֨א אֶל אֵ֤שֶׁת אָחִי/ו֙ וְ/שִׁחֵ֣ת אַ֔רְצָ/ה לְ/בִלְתִּ֥י נְתָן זֶ֖רַע לְ/אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/009.yaml
  text: But Onan knew that the offspring would not be his[a]; so whenever he went in to his brother’s wife, he spilled it on the ground[b], so as not to give offspring to his brother.
translation:
  language: ta
  text: ஆனால், பிறக்கும் சந்ததி தனக்குரியதாக இருக்காது என்பதை ஓனான் அறிந்திருந்தான்[a]. ஆகவே, அவன் தன் சகோதரனுடைய மனைவியுடன் உறவுகொள்ளும்போதெல்லாம், தன் சகோதரனுக்குச் சந்ததி கொடுக்காதபடி அதைத் தரையில் சிந்தினான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இங்கும் வசனத்தின் இறுதியிலும் ‘விதை’ என்று உள்ளது; இறந்த சகோதரனுக்காக வாரிசை உருவாக்கும் இந்தச் சூழலில் அது சந்ததி அல்லது வாரிசைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் நேரடியாக, ‘அதைத் தரையில் அழித்தான்/வீணாக்கினான்’ என்று உள்ளது; ஓனான் கருத்தரிப்பைத் தடுத்த செயலை இது விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: அறிந்திருந்தான்
  rationale: ידע என்பதன் வழக்கமான கதைநடைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַזָּרַע
  choice: பிறக்கும் சந்ததி
  rationale: நேர்ப்பொருள் ‘விதை’ என்றாலும், இறந்த சகோதரனுக்காக வாரிசை உருவாக்கும் இந்தச் சூழலில் பிறக்கவிருக்கும் பிள்ளை அல்லது சந்ததியையே குறிக்கிறது.
- source_word: לֹּא לוֹ יִהְיֶה הַזָּרַע
  choice: பிறக்கும் சந்ததி தனக்குரியதாக இருக்காது
  rationale: பிறக்கும் வாரிசு ஓனானுக்குரியவனாகக் கணக்கிடப்பட மாட்டான் என்ற குடும்பச் சட்டப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: וְהָיָה אִם־בָּא
  choice: உறவுகொள்ளும்போதெல்லாம்
  rationale: எபிரெயக் கட்டமைப்பு கடந்தகாலத்தில் வழக்கமாகத் திரும்பத் திரும்ப நடந்த செயலைக் குறிக்கிறது; ‘போதெல்லாம்’ அந்தத் தொடர்ச்சிப் பொருளை வெளிப்படுத்துகிறது.
- source_word: בָּא אֶל־אֵשֶׁת אָחִיו
  choice: தன் சகோதரனுடைய மனைவியுடன் உறவுகொள்ளும்போதெல்லாம்
  rationale: ‘அவளிடம் சென்றான்’ என்ற எபிரெய மறைமுகச் சொல்லாட்சியின் பாலுறவுப் பொருளை நாகரிகமாகவும் இன்றைய வாசகருக்குத் தெளிவாகவும் தருகிறது.
- source_word: וְשִׁחֵת אַרְצָה
  choice: அதைத் தரையில் சிந்தினான்
  rationale: שחת என்பதன் அடிப்படைப் பொருள் ‘அழித்தல்/வீணாக்குதல்’; இச்சூழலில் கருத்தரிப்பைத் தவிர்க்கச் செய்த செயலை ‘சிந்தினான்’ இயல்பாக வெளிப்படுத்துகிறது. எபிரெயத்தில் நேரடி செயப்படுபொருள் கூறப்படாததால் ‘அதை’ என்ற பொதுக் குறிப்பு காக்கப்படுகிறது.
- source_word: לְבִלְתִּי נְתָן זֶרַע לְאָחִיו
  choice: தன் சகோதரனுக்குச் சந்ததி கொடுக்காதபடி
  rationale: நோக்கத்தைக் குறிக்கும் உட்பிரிவையும், இறந்த சகோதரனுக்காகச் சந்ததி உருவாக்க வேண்டிய சூழலையும் நெருக்கமாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: இந்த வசனத்தில் זרע என்பதன் பொருளும் ஓனானின் செயலை விவரிக்கும் அளவும்
  choice: சட்ட/குடும்பச் சூழலில் זרע என்பதை ‘சந்ததி’ என மொழிபெயர்த்து, கருத்தரிப்பைத் தடுத்த உடல் செயலை ‘அதைத் தரையில் சிந்தினான்’ எனக் கூறுதல்
  alternative: ‘விதை’ என்பதை இரு இடங்களிலும் பயன்படுத்துதல்; அல்லது ‘விந்தைத் தரையில் சிந்தினான்’ என்று வெளிப்படையாகக் கூறுதல்
  rationale: வசனம் பிறக்கவிருக்கும் சட்டபூர்வச் சந்ததியையும், அந்தச் சந்ததி உருவாகாதபடி ஓனான் செய்த உடல் செயலையும் தொடர்புபடுத்துகிறது. ‘சந்ததி’ முதலாவதையும் இறுதியையும் தெளிவாக்குகிறது; ‘அதை’ என்பது எபிரெயத்தில் வெளிப்படையாக இல்லாத உடல் பொருளை அளவுக்கு மீறிக் குறிப்பாக்காமல் செயலைப் புரியவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பாலுறவைக் குறிக்கும் எபிரெய மறைமுகச் சொல்லாட்சி வாசகருக்குப் புரியும்படி ‘உறவுகொள்ளுதல்’ எனத் தரப்பட்டுள்ளது; தேவையற்ற வெளிப்படைத்தன்மையும் சமயக் கோட்பாட்டு விளக்கமும் தவிர்க்கப்பட்டுள்ளன.
