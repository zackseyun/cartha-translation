    rationale: எபிரெயத்தில் யூதா வழியிலிருந்து விலகி அவளை நோக்கிச் செல்கிறான். தாமார் ‘சாலையோரத்தில்’ இருந்தாள் என்பதை இவ்வசனம் மட்டும் வெளிப்படையாகச் சொல்லவில்லை; ஆகவே இயக்கத்தை மையப்படுத்தும் மொழிபெயர்ப்பு பாதுகாப்பானது.
