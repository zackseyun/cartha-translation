  source_fidelity: மொத்தத்தில் எபிரெய மூலத்தின் செயல் வரிசை, யூதா தாமாரைத் தன் மருமகள் என்று அறியாத காரணம், மற்றும் பாலுறவுக்கான மறைமுகச் சொல்லாட்சி ஆகியவை சரியாகக் காக்கப்பட்டுள்ளன. ஆனால் אֶל־הַדֶּרֶךְ என்பது யூதா அவளை நோக்கிச் சாலையிலிருந்து விலகிச் சென்றதைக் குறிக்கிறது; “சாலையோரத்தில் அவளிடம்” என்பது தாமாரின் இருப்பிடத்தைச் சற்று அதிகமாகத் தெளிவுபடுத்துகிறது. “சாலையிலிருந்து விலகி அவளிடம் சென்றான்” என்பது மூல இயக்கத்தைத் துல்லியமாகத் தருகிறது.
  naturalness: நடை நவீனத் தமிழில் இயல்பாக உள்ளது. “அதற்கு அவள்” என்பதற்குப் பதில் “அவள் அவனிடம்” என்பது உரையாடல் தொடர்ச்சியை மேலும் நேரடியாகவும் தெளிவாகவும் காட்டும்.
  terminology: “மருமகள்” כַלָּתוֹ என்பதற்குச் சரியான உறவுமுறைச் சொல். “உன்னிடம் வரட்டும் / என்னிடம் வருவதற்கு” மூலத்தின் மறைமுகத்தன்மையைப் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் பாலுறவுச் சூழலைப் பொருத்தமாக விளக்குகிறது. “கூலி” மாற்றுவாசிப்பாகச் சரியானது.
