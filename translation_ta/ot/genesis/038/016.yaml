  text: וַ/יֵּ֨ט אֵלֶ֜י/הָ אֶל הַ/דֶּ֗רֶךְ וַ/יֹּ֨אמֶר֙ הָֽבָ/ה נָּא֙ אָב֣וֹא אֵלַ֔יִ/ךְ כִּ֚י לֹ֣א יָדַ֔ע כִּ֥י כַלָּת֖/וֹ הִ֑וא וַ/תֹּ֨אמֶר֙ מַה תִּתֶּן לִּ֔/י כִּ֥י תָב֖וֹא אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/016.yaml
  text: So he turned aside to her by the road and said[a], “Please, let me come in to you,” for he did not know that she was his daughter-in-law. And she said, “What will you give me[b], that you may come in to me?”
translation:
  language: ta
  text: அவன் சாலையிலிருந்து விலகி அவளிடம் சென்று, “தயவுசெய்து, நான் உன்னிடம் வரட்டும்”[a] என்றான். அவள் தன் மருமகள் என்று அவன் அறிந்திருக்கவில்லை. அவள் அவனிடம், “நீ என்னிடம் வருவதற்கு எனக்கு என்ன கொடுப்பாய்?”[b] என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன்னிடம் வருவது” என்பது பாலுறவைக் குறிக்கும் எபிரெய மறைமுகச் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீ என்னிடம் வருவதற்கு எனக்கு என்ன கூலி கொடுப்பாய்?” எபிரெய உரை இன்னும் நேரடியாக, “எனக்கு என்ன கொடுப்பாய்?” என்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּט אֵלֶיהָ אֶל־הַדֶּרֶךְ
  choice: அவன் சாலையோரத்தில் அவளிடம் திரும்பிச் சென்று
  rationale: נטה என்பது சென்ற பாதையிலிருந்து விலகி ஒருவரை நோக்கிச் செல்வதைக் குறிக்கிறது. சாலையோரத்தில் இருந்த அவளை யூதா அணுகிய காட்சியை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: הָבָה נָּא
  choice: தயவுசெய்து
  rationale: வேண்டுகோளையும் வற்புறுத்தலையும் மென்மையாகக் குறிக்கும் இச்சொற்றொடருக்கு நவீனத் தமிழில் இயல்பான இணை இது.
- source_word: אָבוֹא אֵלַיִךְ
  choice: நான் உன்னிடம் வரட்டும்
  rationale: בוא + אל இச்சூழலில் பாலுறவைக் குறிக்கும் மறைமுகச் சொற்றொடர். வெளிப்படையாக விளக்கிப் பெயர்க்காமல் மூலத்தின் மறைமுகத் தன்மையைத் தமிழ் வாசகமும் காக்கிறது.
- source_word: כִּי לֹא יָדַע כִּי כַלָּתוֹ הִוא
  choice: அவள் தன் மருமகள் என்று அவன் அறிந்திருக்கவில்லை
  rationale: வினைக்கான காரணத்தை விளக்கும் உட்பிரிவையும் כַלָּה என்பதன் துல்லியமான உறவுமுறையையும் நேரடியாகத் தருகிறது.
- source_word: מַה תִּתֶּן לִּי
  choice: எனக்கு என்ன கொடுப்பாய்?
  rationale: சூழலில் இது கூலியைக் குறிப்பதாக இருந்தாலும், எபிரெய உரை பொதுவான ‘கொடு’ என்ற வினையையே பயன்படுத்துவதால் அதையே முதன்மை உரையில் பாதுகாக்கிறது.
- source_word: כִּי תָבוֹא אֵלָי
  choice: நீ என்னிடம் வருவதற்கு
  rationale: முதல் கூற்றில் உள்ள அதே பாலுறவு சார்ந்த மறைமுகச் சொல்லாட்சியைத் தொடர்ந்து காத்து, தமிழ் வாக்கிய அமைப்பில் இயல்பாக வழங்குகிறது.
