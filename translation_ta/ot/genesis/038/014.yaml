base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/014.yaml
  text: So she took off her widow’s garments from herself, and wrapped herself in a veil, and sat at the entrance to Enaim, which is on the road to Timnah. For she saw that Shelah had grown up, yet she had not been given to him as a wife.
translation:
  language: ta
  text: அதனால் அவள் தன் விதவைக்குரிய ஆடைகளைக் கழற்றிவிட்டு, முக்காடால் மூடிக்கொண்டு, தன்னைப் போர்த்திக்கொண்டு, திம்னாவுக்குப் போகும் வழியிலிருந்த ஏனாயிமின் நுழைவாயிலில் அமர்ந்தாள். ஏனெனில் சேலா வளர்ந்துவிட்டான் என்பதையும், அவள் அவனுக்கு மனைவியாகக் கொடுக்கப்படவில்லை என்பதையும் அவள் கண்டாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: தன் விதவைக்குரிய ஆடைகள்
  rationale: விதவை நிலையைக் குறிக்கும் தனிப்பட்ட ஆடைகளை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: וַתְּכַס בַּצָּעִיף וַתִּתְעַלָּף
  choice: முக்காடிட்டுத் தன்னை மூடிக்கொண்டு
  rationale: இரு எபிரெய வினைகளிலும் உள்ள முக்காடால் மூடுதல் மற்றும் தன்னை மறைத்துக்கொள்ளுதல் ஆகிய கருத்துகளைச் சுருக்காமல் இயல்பாக இணைக்கிறது.
- source_word: בְּפֶתַח עֵינַיִם
  choice: ஏனாயிமின் நுழைவாயிலில்
  rationale: עֵינַיִם என்பதை இங்கு இடப்பெயராகப் புரிந்துகொண்டு, פֶּתַח என்பதன் நுழைவிடம் அல்லது நுழைவாயில் என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: תִּמְנָתָה
  choice: திம்னாவுக்குப் போகும்
  rationale: இடத்தை நோக்கிய இயக்கத்தைக் குறிக்கும் எபிரெய திசைமுக முடிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא נִתְּנָה לוֹ לְאִשָּׁה
  choice: அவனுக்கு மனைவியாகத் தான் கொடுக்கப்படாதது
  rationale: மூலத்தின் இறப்புவினை அமைப்பையும் தாமாரின் அனுபவத்தையும் மாற்றாமல் காக்கிறது.
theological_decisions:
- issue: தாமாரின் செயலை நெறிசார் வகையில் விளக்க வேண்டுமா
  choice: மூலத்தில் உள்ள செயலும் காரணமும் மட்டும் கூறப்பட்டது
  alternative: அவள் ஏமாற்றத் திட்டமிட்டதாகவோ நீதியைத் தேடியதாகவோ வெளிப்படையாக விளக்குதல்
  rationale: இந்த வசனம் அவளது செயலும் சேலா வளர்ந்தும் அவளுக்கு மணமாகக் கொடுக்கப்படாததும் மட்டுமே கூறுகிறது; அவளது உள்நோக்கத்தை மொழிபெயர்ப்பில் சேர்ப்பது உரையை மீறும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் தொடர்ச்சியான கதைநடையும் இறப்புவினை அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
