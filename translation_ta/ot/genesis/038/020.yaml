translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மரபுத்தொடர்களை இயந்திரமாகச் சொல்லர்த்தப்படுத்தாமல், அவற்றின் பொருள் இயல்பான தமிழில் வழங்கப்பட்டுள்ளது; எந்தப் பிரிவுசார் விளக்கமும் சேர்க்கப்படவில்லை.
