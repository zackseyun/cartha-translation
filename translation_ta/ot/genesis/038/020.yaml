base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/020.yaml
  text: Then Judah sent the young goat by the hand of his Adullamite friend to take back the pledge from the woman's hand[c][b][a], but he did not find her.
translation:
  language: ta
  text: பின்னர் யூதா, அந்தப் பெண்ணிடமிருந்து அடைமானத்தைத் திரும்பப் பெறுவதற்காக, வெள்ளாட்டுக் குட்டியைத் தன் அதுல்லாமிய நண்பன் மூலம் அனுப்பினான்; ஆனால் அந்த நண்பன் அவளைக் காணவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: பின்னர் ... அனுப்பினான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் இயல்பான நிகழ்வுத் தொடரை ‘பின்னர்’ காட்டுகிறது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: எபிரெய தனிப்பெயரின் தமிழில் வழக்கமான வடிவம்.
- source_word: גְּדִי הָעִזִּים
  choice: வெள்ளாட்டுக் குட்டி
  rationale: இந்தச் சொற்றொடர் இளம் வெள்ளாட்டைக் குறிக்கிறது; சூழலில் முன்பு வாக்களிக்கப்பட்ட விலங்குடனும் பொருந்துகிறது.
- source_word: בְּיַד
  choice: மூலம்
  rationale: சொல்லர்த்தமாக ‘கையால்’ என்றாலும், இங்கு ஒருவர் வழியாகச் செயலை நிறைவேற்றும் முகமையைக் குறிக்கும் மரபுத்தொடர்; தமிழில் ‘மூலம்’ இயல்பாக அதைக் கூறுகிறது.
- source_word: רֵעֵהוּ
  choice: தன் ... நண்பன்
  rationale: சமூகத் தோழன் அல்லது உடனிருப்பவரைக் குறிக்கும்; இச்சூழலில் ‘நண்பன்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הָעֲדֻלָּמִי
  choice: அதுல்லாமிய
  rationale: அதுல்லாம் ஊரைச் சேர்ந்தவர் என்பதைக் குறிக்கும் இன/ஊரடைமொழி.
- source_word: לָקַחַת
  choice: திரும்பப் பெறுவதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் வினையெச்சம்; யூதா முன்பு கொடுத்த பொருட்களை மீட்டுக்கொள்ள முயல்வதால் ‘திரும்பப் பெற’ என்பது சூழலைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: הָעֵרָבוֹן
  choice: அடைமானம்
  rationale: உத்தரவாதமாக ஒப்படைக்கப்பட்ட பொருளைக் குறிக்கிறது; ‘அடைமானம்’ நவீன தமிழில் தெளிவான, சுருக்கமான இணைச்சொல்.
- source_word: מִיַּד הָאִשָּׁה
  choice: அந்தப் பெண்ணிடமிருந்து
  rationale: சொல்லர்த்தம் ‘அந்தப் பெண்ணின் கையிலிருந்து’; இங்கு உடைமை அல்லது வசமிருப்பதைச் சுட்டுவதால் தமிழில் ‘பெண்ணிடமிருந்து’ இயல்பாகப் பொருளைத் தருகிறது.
- source_word: וְלֹא מְצָאָהּ
  choice: ஆனால் அவன் அவளைக் காணவில்லை
  rationale: அனுப்பப்பட்ட முயற்சிக்கும் அதன் தோல்விக்கும் இடையிலான எதிர்மறை முடிவை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
