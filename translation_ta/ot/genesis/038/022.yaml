translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கதைநடைச் சுருக்கம் காக்கப்பட்டு, קְדֵשָׁה என்பதன் வழிபாட்டுத் தொடர்பு விளக்கமாகத் தரப்பட்டுள்ளது; ‘கோவில்’ என்ற குறுகிய நிறுவனப் பொருள் முதன்மை உரையில் திணிக்கப்படவில்லை.
