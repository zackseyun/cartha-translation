base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/022.yaml
  text: So he returned to Judah and said[a], “I did not find her, and also the men of the place said[b], ‘There has been no cult prostitute here.’”
translation:
  language: ta
  text: அவன் யூதாவிடம் திரும்பி வந்து, “நான் அவளைக் கண்டுபிடிக்கவில்லை; மேலும், அந்த இடத்து ஆண்கள், ‘இங்கே வழிபாட்டுடன் தொடர்புடைய விபசாரி[a] யாரும் இல்லை’ என்று சொன்னார்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் கெதேஷா; அடிப்படையில் ‘புனிதப்படுத்தப்பட்ட பெண்’ என்பதுடன் தொடர்புடைய சொல். இச்சூழலில் இது பாரம்பரியமாக “வழிபாட்டுடன் தொடர்புடைய விபசாரி” அல்லது “கோவில் விபசாரி” என்று மொழிபெயர்க்கப்படுகிறது; ஆனால் அதன் துல்லியமான வரலாற்றுப் பங்கு உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב אֶל־יְהוּדָה
  choice: அவன் யூதாவிடம் திரும்பி வந்து
  rationale: வழக்கமான எபிரெயக் கதைநடைத் தொடர்ச்சியை இயல்பான தமிழ் வினையெச்சத் தொடரால் வெளிப்படுத்துகிறது; אֶל என்பதன் திசைப்பொருளையும் காக்கிறது.
- source_word: לֹא מְצָאתִיהָ
  choice: நான் அவளைக் கண்டுபிடிக்கவில்லை
  rationale: முடிந்துபோன தேடலின் எதிர்மறை முடிவை நேரடியாகத் தெரிவிக்கிறது; ‘கண்டுபிடிக்க முடியவில்லை’ என்று மூலத்தில் இல்லாத இயலாமைப் பொருளைச் சேர்க்கவில்லை.
- source_word: וְגַם
  choice: மேலும்
  rationale: அறிக்கையில் அடுத்த ஆதாரச் செய்தியைச் சேர்க்கும் சொல்லின் கூட்டற்பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: அந்த இடத்து ஆண்கள்
  rationale: ‘அந்த இடத்தின் ஆண்கள்’ என்ற மூலத்தின் ஆண்பால் பன்மையைப் பொதுமைப்படுத்தாமல் காக்கிறது.
- source_word: לֹא הָיְתָה בָזֶה
  choice: இங்கே ... ஒருத்தியும் இருந்ததில்லை
  rationale: குறிப்பிட்ட இடத்தில் அப்படிப்பட்ட பெண் இருந்ததையே மறுக்கும் எபிரெய இருப்புவாக்கியத்தை இயல்பான தமிழில் தருகிறது.
- source_word: קְדֵשָׁה
  choice: வழிபாட்டுடன் தொடர்புடைய விபசாரி
  rationale: சாதாரண விபசாரியைக் குறிக்கும் זֹנָה என்பதிலிருந்து வேறுபடும் இச்சொல்லின் சமய வழிபாட்டுத் தொடர்பைக் காக்கிறது; அதேவேளையில் குறிப்பிட்ட கோவில் நிறுவனம் இருந்ததாக மிகையாகத் தீர்மானிப்பதில்லை.
