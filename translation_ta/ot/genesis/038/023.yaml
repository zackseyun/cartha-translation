translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் உரைநடை பயன்படுத்தப்பட்டுள்ளது. நேரடிப் பேச்சின் இயல்பையும் எபிரெய மூலத்தின் சுருக்கத்தையும் தக்கவைத்து, சூழலில் குறிக்கப்படும் பல அடமானப் பொருட்கள் ‘அவற்றை’ எனத் தெளிவுபடுத்தப்பட்டுள்ளன.
