base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/023.yaml
  text: And Judah said[a], “Let her keep them, lest we become a laughingstock. Look, I sent this young goat, but you did not find her.”
translation:
  language: ta
  text: யூதா, “அவற்றை அவளே வைத்துக்கொள்ளட்டும்; இல்லையென்றால் நாம் கேலிக்குரியவர்களாகிவிடுவோம்[a]. இதோ, இந்த வெள்ளாட்டுக் குட்டியை நான் அனுப்பினேன்; ஆனால் நீ அவளைக் கண்டுபிடிக்கவில்லை” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “நாம் அவமானத்திற்குள்ளாவோம்” அல்லது “நாம் கேலி செய்யப்படுவோம்.” எபிரெயத் தொடர் இகழ்ச்சிக்கும் ஏளனத்திற்கும் உரியவர்களாக ஆவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקַּח לָהּ
  choice: அவற்றை அவளே வைத்துக்கொள்ளட்டும்
  rationale: மூன்றாம் நபர் பெண்பால் வினைவடிவமும் לָהּ என்பதும் இங்கு அனுமதி அல்லது விட்டுக்கொடுக்கும் பொருளைத் தருகின்றன. சூழலில் அடமானப் பொருட்கள் பல இருப்பதால், தமிழில் மறைந்துள்ள செயப்படுபொருளை ‘அவற்றை’ என்று வெளிப்படுத்துவது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: פֶּן נִהְיֶה לָבוּז
  choice: இல்லையென்றால் நாம் கேலிக்குரியவர்களாகிவிடுவோம்
  rationale: בּוּז என்பது இகழ்ச்சி, ஏளனம், அவமதிப்பு ஆகிய பொருள்களை உடையது. சமூகத்தின் கேலிக்கும் இகழ்ச்சிக்கும் ஆளாவோம் என்ற யூதாவின் அச்சத்தை இத்தொடர் இயல்பான தமிழில் வெளிப்படுத்துகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: הִנֵּה
  choice: இதோ
  rationale: அடுத்து சொல்லப்படுவதற்கு கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் இடைச்சொல்லின் சுட்டும் வலிமையை நவீனத் தமிழில் ‘இதோ’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: שָׁלַחְתִּי הַגְּדִי הַזֶּה
  choice: இந்த வெள்ளாட்டுக் குட்டியை நான் அனுப்பினேன்
  rationale: גְּדִי என்பது இளம் வெள்ளாட்டைக் குறிக்கிறது. ‘வெள்ளாட்டுக் குட்டி’ தெளிவான பொதுத்தமிழ்; הַזֶּה என்பதன் சுட்டுப்பொருளும் ‘இந்த’ என்று தக்கவைக்கப்பட்டுள்ளது.
- source_word: וְאַתָּה לֹא מְצָאתָהּ
  choice: ஆனால் நீ அவளைக் கண்டுபிடிக்கவில்லை
  rationale: וְ இங்கு வெள்ளாட்டுக் குட்டியை அனுப்பியதற்கும் பெண்ணைக் கண்டுபிடிக்க முடியாததற்கும் இடையிலான முரணைச் சுட்டுவதால் ‘ஆனால்’ பொருத்தமானது. מְצָאתָהּ என்பதிலுள்ள பெண்பால் பின்னொட்டு ‘அவளை’ என வெளிப்படையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
