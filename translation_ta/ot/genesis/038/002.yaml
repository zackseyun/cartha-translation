translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ்க் கதைநடை. ‘தன்னுடையவளாக எடுத்துக்கொண்டான்’ என்பது மூல வினையின் நேரடித்தன்மையையும் திருமணச் சூழற்பொருளையும் சமநிலைப்படுத்துகிறது; பாலுறவுக்கான எபிரெய மரபுத்தொடர் தெளிவான தமிழில் தரப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
