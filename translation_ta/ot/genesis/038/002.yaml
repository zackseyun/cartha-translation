base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/002.yaml
  text: There Judah saw the daughter of a Canaanite man whose name was Shua[b][a], and he took her and went in to her.
translation:
  language: ta
  text: அங்கே யூதா, சூவா என்ற பெயருடைய கானானிய மனிதன் ஒருவனின் மகளைக் கண்டான்.[a] அவளை எடுத்துக்கொண்டு, அவளுடன் பாலுறவு கொண்டான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவனுடைய பெயர் சூவா” என்று உள்ளது; இது மகளை அல்ல, கானானிய மனிதனையே குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அவளிடம் சென்றான்” என்பது பாலுறவைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டான்
  rationale: ראה என்பதன் நேரடியான கதைநடைப் பொருள் ‘கண்டான்’; ‘சந்தித்தான்’ என்பது மூலத்தில் இல்லாத கருத்தைச் சேர்க்கும்.
- source_word: שָׁם
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் இந்த வினையடை தமிழ்க் கதைநடையில் இயல்பாக ‘அங்கே’ என வருகிறது.
- source_word: בַּת אִישׁ כְּנַעֲנִי
  choice: ஒரு கானானிய மனிதனின் மகள்
  rationale: ‘ஒரு மனிதனின் மகள்—அவன் கானானியன்’ என்ற எபிரெயக் கட்டமைப்பின் உறவையும் இன அடையாளத்தையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וּשְׁמוֹ שׁוּעַ
  choice: சூவா என்ற பெயருடைய
  rationale: ஆண்பால் ஒருமை உடைமைப் பின்னொட்டு, சூவா என்பது மகளின் பெயரல்ல, கானானியத் தந்தையின் பெயர் என்பதைச் சுட்டுகிறது.
- source_word: וַיִּקָּחֶהָ
  choice: அவளைத் தன்னுடையவளாக எடுத்துக்கொண்டான்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொண்டான்’; இச்சூழலில் ஒரு பெண்ணை மனைவியாக ஏற்றுக்கொள்ளும் பொருள் உட்பொதிந்துள்ளது. ‘திருமணம் செய்துகொண்டான்’ என்று முழுமையாக விளக்காமல் அந்தச் சூழற்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: அவளுடன் உறவுகொண்டான்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘அவளிடம் சென்றான்’ என்றாலும், இது பாலுறவைக் குறிக்கும் நிலையான எபிரெய மரபுத்தொடர்; தமிழில் தவறாகப் புரியாதவாறு அதன் பொருள் மொழிபெயர்க்கப்படுகிறது.
