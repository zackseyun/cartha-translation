- from: அங்கே யூதா, சூவா என்ற பெயருடைய ஒரு கானானிய மனிதனின் மகளைக் கண்டான்.[a] அவன் அவளைத் தன்னுடையவளாக எடுத்துக்கொண்டு, அவளுடன் உறவுகொண்டான்.[b]
  to: அங்கே யூதா, சூவா என்ற பெயருடைய கானானிய மனிதன் ஒருவனின் மகளைக் கண்டான்.[a] அவளை எடுத்துக்கொண்டு, அவளுடன் பாலுறவு கொண்டான்.[b]
  rationale: The revision removes the added possessive sense from the rendering of לקח while retaining its concise narrative form. It also makes the sexual sense of the Hebrew idiom explicit in idiomatic, dignified modern Tamil, with the footnote preserving the literal Hebrew expression. The revised name phrase makes clear in the main text that Shua is the father, not the daughter.
