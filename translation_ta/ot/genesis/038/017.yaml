  text: וַ/יֹּ֕אמֶר אָנֹכִ֛י אֲשַׁלַּ֥ח גְּדִֽי עִזִּ֖ים מִן הַ/צֹּ֑אן וַ/תֹּ֕אמֶר אִם תִּתֵּ֥ן עֵרָב֖וֹן עַ֥ד שָׁלְחֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/017.yaml
  text: And he said[a], “I will send a young goat from the flock.” And she said, “If you will give a pledge until you send it.”
translation:
  language: ta
  text: அதற்கு அவன், “மந்தையிலிருந்து ஒரு வெள்ளாட்டுக்குட்டியை அனுப்புவேன்” என்றான். அவள், “நீ அதை அனுப்பும்வரை ஒரு பிணையத்தைக்[a] கொடுத்தால்…” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உத்தரவாதப் பொருள்’ அல்லது ‘பிணையப் பொருள்’ என்றும் மொழிபெயர்க்கலாம் (עֵרָבוֹן).
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִי עִזִּים
  choice: ஒரு வெள்ளாட்டுக்குட்டி
  rationale: இந்த எபிரெயச் சொற்றொடர் வெள்ளாட்டின் இளங்குட்டியைக் குறிக்கிறது. ‘வெள்ளாட்டுக்குட்டி’ என்பது இயல்பான நவீனத் தமிழில் விலங்கினத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִן הַצֹּאן
  choice: மந்தையிலிருந்து
  rationale: צֹאן என்பது பொதுவாக ஆடுகள், வெள்ளாடுகள் போன்ற சிறுகால்நடைகளின் மந்தையைக் குறிக்கும். குறிப்பிட்ட விலங்கு ஏற்கெனவே வெள்ளாட்டுக்குட்டி எனச் சொல்லப்படுவதால், ‘மந்தையிலிருந்து’ என்பது இயல்பாகவும் தேவையற்ற மறுபடியுரைத்தலைத் தவிர்ப்பதாகவும் உள்ளது.
- source_word: עֵרָבוֹן
  choice: ஓர் அடைமானம்
  rationale: வாக்குறுதி நிறைவேற்றப்படும் வரை உத்தரவாதமாகக் கொடுக்கப்படும் பொருளை இச்சொல் குறிக்கிறது. ‘அடைமானம்’ அந்த இடைக்கால உத்தரவாதப் பொருளைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: עַד שָׁלְחֶךָ
  choice: நீ அதை அனுப்பும்வரை
  rationale: இது சொல்லுக்கு நெருக்கமாக ‘நீ அனுப்பும்வரை’ எனப் பொருள்படும். சூழலில் அனுப்பப்படுவது வெள்ளாட்டுக்குட்டி என்பதால், இயல்பான தமிழுக்காக ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: אִם תִּתֵּן
  choice: கொடுத்தால்…
  rationale: இது தாமார் விதிக்கும் நிபந்தனையை அறிமுகப்படுத்துகிறது. மூலத்தில் அதன் விளைவு வெளிப்படையாகச் சொல்லப்படாததால், தமிழிலும் முற்றுப்பெறாத நிபந்தனையாக முப்புள்ளியுடன் வைக்கப்பட்டுள்ளது.
- source_word: אָנֹכִי אֲשַׁלַּח
  choice: அனுப்புகிறேன்
  rationale: தனி எழுவாய்ப் பெயர் வாக்குறுதியைச் சற்றே வலியுறுத்தினாலும், தமிழில் வினைமுற்றே முதலாம் நபரைத் தெளிவாக்குகிறது. உரையாடலில் ‘அனுப்புகிறேன்’ உறுதியான உடனடி வாக்குறுதியை இயல்பாகத் தருகிறது.
