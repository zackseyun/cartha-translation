  yaml_path: translation/ot/genesis/038/030.yaml
  text: Afterward his brother came out[a], with the scarlet thread on his hand[b], and he called his name Zerah.
translation:
  language: ta
  text: அதன்பின், கையில் சிவப்பு நூல் இருந்த அவனுடைய சகோதரன் வெளியே வந்தான்; அவன் அவனுக்குச் சேராகு என்று பெயரிட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “அவன் அவனுடைய பெயரைச் சேராகு என்று அழைத்தான்.” வினை ஆண்பால் ஒருமையில் உள்ளது; பெயரிட்டவர் யார் என்பது இங்கு வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: அதன்பின்
  rationale: அடுத்ததாக நிகழ்ந்த செயலைக் குறிக்கும் காலத் தொடரை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יָצָא
  choice: வெளியே வந்தான்
  rationale: பிறப்புச் சூழலில் எபிரெய வினையின் அடிப்படைப் பொருளை இயல்பாகத் தருகிறது.
- source_word: אָחִיו
  choice: அவனுடைய சகோதரன்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியுடன் வரும் உறவுமுறையை நேரடியாகக் காட்டுகிறது.
- source_word: אֲשֶׁר עַל יָדוֹ הַשָּׁנִי
  choice: கையில் சிவப்பு நூல் இருந்த
  rationale: அந்தச் சகோதரனை அவன் கையிலிருந்த சிவப்பு அடையாளத்தால் அடையாளப்படுத்தும் சார்பு வாக்கியத்தைத் தமிழில் இயல்பாக வழங்குகிறது; 'நூல்' என்பது முந்தைய வசனத்தின் சூழலிலிருந்து நிரப்பப்படுகிறது.
- source_word: הַשָּׁנִי
  choice: சிவப்பு நூல்
  rationale: சொல்லுக்குச் சொல் 'அந்தச் சிவப்பு' அல்லது 'சிவப்புப் பொருள்'; வசனம் 28-இல் குறிப்பிடப்பட்ட நூலைக் குறிக்கும் நீக்கவழக்கைத் தெளிவாக்குகிறது.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: அவனுக்கு ... என்று பெயரிட்டார்கள்
  rationale: எபிரெய மொழிப்படியாக 'அவன் அவன் பெயரை அழைத்தான்' என இருந்தாலும், பெயரிடுதலை நவீனத் தமிழில் இயல்பாகச் சொல்கிறது. ஆண்பால் ஒருமை வினையின் எழுவாய் சூழலில் வெளிப்படையாக அடையாளம் காணப்படாததால், தமிழில் பொதுவான எழுவாய் வடிவம் பயன்படுத்தப்பட்டுள்ளது; அடிச்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: זָרַח
  choice: சேராகு
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயன்றவரை நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
theological_decisions:
- issue: பெயரிட்ட வினையின் எழுவாய்
  choice: அவனுக்கு சேராகு என்று பெயரிட்டார்கள்
  alternative: அவன் அவனுக்குச் சேராகு என்று பெயரிட்டான்
  rationale: எபிரெய வினை ஆண்பால் ஒருமையாக இருந்தாலும், இவ்வசனத்தில் அதன் எழுவாய் பெயரிட்டு குறிப்பிடப்படவில்லை. யார் பெயரிட்டார் என்பதை ஊகித்து நிர்ணயிக்காமல், தமிழில் இயல்பான எழுவாய் குறிப்பிடாத வடிவம் பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் சொல்லமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. பிறப்பின் தொடர்ச்சியும் கையிலிருந்த சிவப்பு நூலால் இரட்டையன் அடையாளப்படுத்தப்படுவதும் தெளிவாக வைக்கப்பட்டுள்ளன. மூலத்தில் வெளிப்படையாக இல்லாத எழுவாயை ஊகிக்காமல் பெயரிடும் வாக்கியம் இயல்பாக்கப்பட்டுள்ளது.
