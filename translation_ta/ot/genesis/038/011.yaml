base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/011.yaml
  text: Then Judah said to Tamar his daughter-in-law[a], “Remain a widow in your father’s house until my son Shelah grows up,” for he said, “Lest he also die like his brothers.” So Tamar went and lived in her father’s house.
translation:
  language: ta
  text: அப்போது யூதா தன் மருமகளான தாமாரிடம், “என் மகன் சேலா வளர்ந்து பெரியவனாகும்வரை, நீ உன் தந்தையின் வீட்டில் விதவையாக இரு” என்றான். ஏனெனில், “அவனும் தன் சகோதரர்களைப் போல இறந்துவிடுவானோ” என்று அவன் சொன்னான்[a]. எனவே தாமார் தன் தந்தையின் வீட்டுக்குச் சென்று அங்கே வாழ்ந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்று அவன் நினைத்தான்.” எபிரெய மொழியில் “சொன்னான்” என்பது உள்ளார்ந்த எண்ணத்தையும் அறிமுகப்படுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבִי אַלְמָנָה
  choice: விதவையாகவே இரு
  rationale: கட்டளை வினையும் விதவை என்ற சமூக நிலையையும் இயல்பான நவீன தமிழில் ஒன்றாகக் கூறுகிறது; அந்த நிலை தொடர வேண்டும் என்ற யூதாவின் கட்டளையை ‘வே’ வலியுறுத்துகிறது.
- source_word: בֵית אָבִיךְ
  choice: உன் தந்தையின் வீட்டில்
  rationale: தந்தையின் வீட்டில் குடியிருப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: עַד יִגְדַּל שֵׁלָה בְנִי
  choice: என் மகன் சேலா வளர்ந்து பெரியவனாகும்வரை
  rationale: יגדל என்பதன் வளர்ந்து முதிர்ச்சி அடையும் பொருளைத் திருமணச் சூழலில் தெளிவாகக் கூறுகிறது; திருமண வயதை வெளிப்படையாகச் சேர்த்து மிகைவிளக்கம் செய்யவில்லை.
- source_word: כִּי אָמַר
  choice: ஏனெனில் ... என்று அவன் சொன்னான்
  rationale: யூதாவின் காரணத்தை அறிமுகப்படுத்தும் כי என்பதையும், உள்ளார்ந்த எண்ணத்தையும் அறிமுகப்படுத்தக்கூடிய ‘சொன்னான்’ என்ற எபிரெயச் சொல்லையும் பாதுகாக்கிறது.
- source_word: פֶּן יָמוּת גַּם הוּא
  choice: அவனும் ... இறந்துவிடுவானோ
  rationale: פֶּן வெளிப்படுத்தும் அச்சத்தையும் தவிர்க்க விரும்பும் சாத்தியத்தையும் இயல்பான தமிழில் தருகிறது; இதை நிச்சயமான விளைவாக மாற்றவில்லை.
- source_word: כְּאֶחָיו
  choice: தன் சகோதரர்களைப் போல
  rationale: ஏர், ஓனான் ஆகியோருக்கு நேர்ந்த மரணத்தோடு செய்யப்படும் ஒப்பீட்டைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וַתֵּשֶׁב בֵּית אָבִיהָ
  choice: தன் தந்தையின் வீட்டுக்குச் சென்று அங்கே வாழ்ந்தாள்
  rationale: கதைத் தொடரில் சென்றதையும் அங்கு நிலையாக வசித்ததையும் இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: כַּלָּתוֹ
  choice: தன் மருமகளான
  rationale: இச்சூழலில் மகனின் மனைவியைக் குறிக்கும் உறவுமுறைச் சொல்லை வழக்கமான தமிழில் தருகிறது.
theological_decisions:
- issue: யூதாவின் சொல் வெளிப்படையாகப் பேசப்பட்டதா அல்லது உள்ளார்ந்த எண்ணமா
  choice: முதன்மை உரையில் ‘அவன் சொன்னான்’ என்று எபிரெய வடிவத்தைப் பாதுகாத்தல்
  alternative: ‘அவன் நினைத்தான்’ அல்லது ‘தனக்குள் சொல்லிக்கொண்டான்’
  rationale: எபிரெய אָמַר அடிப்படையில் ‘சொன்னான்’ என்பதாக இருந்தாலும் உள்ளார்ந்த சிந்தனையையும் அறிமுகப்படுத்த முடியும். முதன்மை உரையில் ஒன்றை மட்டும் தீர்மானிக்காமல், மாற்றுப் புரிதலை அடிக்குறிப்பில் தருவது உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகமக் கதையுரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘இறந்துவிடுவானோ’ என்பது யூதாவின் அச்சத்தை இயல்பாக வெளிப்படுத்துகிறது; ‘சொன்னான்’ என்பதிலுள்ள மூலமொழித் தெளிவின்மை அடிக்குறிப்பால் பாதுகாக்கப்பட்டுள்ளது.
