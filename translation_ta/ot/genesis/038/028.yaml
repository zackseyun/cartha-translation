source:
  edition: WLC
  text: וַ/יְהִ֥י בְ/לִדְתָּ֖/הּ וַ/יִּתֶּן יָ֑ד וַ/תִּקַּ֣ח הַ/מְיַלֶּ֗דֶת וַ/תִּקְשֹׁ֨ר עַל יָד֤/וֹ שָׁנִי֙ לֵ/אמֹ֔ר זֶ֖ה יָצָ֥א רִאשֹׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/028.yaml
  text: And when she was giving birth[a], he put out a hand, and the midwife took it and tied a scarlet thread on his hand, saying[c][b], “This one came out first.”
translation:
  language: ta
  text: அவள் குழந்தை பெற்றுக்கொண்டிருந்தபோது, ஒரு குழந்தை தன் கையை வெளியே நீட்டியது[a]. மருத்துவச்சி அந்தக் கையைப் பிடித்து, அதன் கையில் செந்நிற நூலைக் கட்டி[b], “இதுதான் முதலில் வெளியே வந்தது” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொற்படியாக, “ஒரு கையைக் கொடுத்தான்.” பிரசவத்தின்போது குழந்தையின் கை வெளியே தோன்றியதை இச்சொற்றொடர் குறிக்கிறது. “ஒரு கை வெளியே வந்தது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இரட்டைக் குழந்தைகளில் முதலில் தோன்றியது எது என்பதைப் பின்னர் அடையாளம் காண இந்தச் செந்நிற நூல் காணக்கூடிய அடையாளமாகக் கட்டப்பட்டது.
    reason: cultural_note
lexical_decisions:
- source_word: בְּלִדְתָּהּ
  choice: அவள் குழந்தை பெற்றுக்கொண்டிருந்தபோது
  rationale: בְּ முன்னொட்டுடன் வரும் ילד வினையின் infinitive construct மற்றும் 3ஆம் நபர் பெண்பால் ஒருமை பின்னொட்டு, பிரசவம் நடந்துகொண்டிருந்த காலச்சூழலைக் குறிக்கின்றன. இத்தமிழ் வடிவம் அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּתֶּן יָד
  choice: ஒரு குழந்தை தன் கையை வெளியே நீட்டியது
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘ஒரு கையைக் கொடுத்தான்’ என இருந்தாலும், பிரசவத்தின்போது குழந்தையின் கை வெளியே தோன்றியதைச் சொல்லும் மரபுத்தொடர் இது. எந்த இரட்டைக் குழந்தை என்பது இன்னும் அடையாளப்படுத்தப்படாததால் ‘ஒரு குழந்தை’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַמְיַלֶּדֶת
  choice: மருத்துவச்சி
  rationale: ילד வேரிலிருந்து வந்த இச்சொல் பிரசவத்திற்கு உதவும் பெண்ணைக் குறிக்கிறது; ‘மருத்துவச்சி’ என்பது நவீனத் தமிழில் சுருக்கமான, நிலையான இணைச்சொல்.
- source_word: וַתִּקְשֹׁר עַל יָדוֹ שָׁנִי
  choice: அதன் கையில் செந்நிற நூலைக் கட்டி
  rationale: שָׁנִי செந்நிறமான பொருள் அல்லது நூலைக் குறிக்கிறது. சூழலுக்குத் தேவையான ‘நூல்’ என்பதை வெளிப்படையாகச் சேர்ப்பது அடையாளக் கட்டின் தன்மையைத் தெளிவாக்குகிறது.
- source_word: זֶה יָצָא רִאשֹׁנָה
  choice: இதுதான் முதலில் வெளியே வந்தது
  rationale: זֶה குறிப்பிட்ட குழந்தையைச் சுட்டுகிறது; רִאשֹׁנָה இங்கு முதலில் வெளியே வந்ததைச் சொல்கிறது. ‘முதற்பேறானது’ என்று மொழிபெயர்ப்பது மூலத்தில் வெளிப்படையாக இல்லாத சட்ட அல்லது அந்தஸ்துச் சார்ந்த கருத்தைச் சேர்க்கக்கூடும்.
