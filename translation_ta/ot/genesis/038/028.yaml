translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘குழந்தை’ என்பதற்கேற்ப இயல்பான அஃறிணைச் சுட்டுப்பெயர் பயன்படுத்தப்பட்டாலும், எபிரெய மூலத்தின் ஆண்பால் வினை வடிவமும் சொற்படியான அமைப்பும் அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளன.
