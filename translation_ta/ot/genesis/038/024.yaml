base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/024.yaml
  text: And it happened about three months later that Judah was told[a], “Tamar your daughter-in-law has acted as a prostitute, and behold, she is also pregnant by prostitution.” Then Judah said, “Bring her out[b], and let her be burned.”
translation:
  language: ta
  text: சுமார் மூன்று மாதங்களுக்குப் பிறகு, “உன் மருமகளான தாமார் விபசாரம் செய்திருக்கிறாள்[a]; இதோ, அவள் விபசாரத்தால் கர்ப்பமாகவும் இருக்கிறாள்[b]” என்று யூதாவுக்கு அறிவிக்கப்பட்டது. அப்போது யூதா, “அவளை வெளியே கொண்டுவாருங்கள்; அவள் எரிக்கப்படட்டும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விலைமகளைப்போல் நடந்துகொண்டிருக்கிறாள்”; விரிவான பொருளில், “பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட்டிருக்கிறாள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “விபசாரத்தினால் கர்ப்பமாக இருக்கிறாள்” அல்லது “விபசாரச் செயல்களின் விளைவாகக் கர்ப்பமாக இருக்கிறாள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: பிறகு
  rationale: எபிரெயக் கதைநடையின் புதிய நிகழ்வை இயல்பான நவீனத் தமிழில் அறிமுகப்படுத்துகிறது; தனியாக ‘நிகழ்ந்தது’ என்று மொழிபெயர்ப்பதைவிட வாக்கியம் சரளமாக அமைகிறது.
- source_word: כְּמִשְׁלֹשׁ חֳדָשִׁים
  choice: சுமார் மூன்று மாதங்களுக்குப் பிறகு
  rationale: כְּ குறிக்கும் தோராயத்தையும், கதையின் கால முன்னேற்றத்தையும் தெளிவாகக் காக்கிறது.
- source_word: וַיֻּגַּד לִיהוּדָה לֵאמֹר
  choice: என்று யூதாவுக்கு அறிவிக்கப்பட்டது
  rationale: נגד என்பதன் ஹொஃபால் வடிவிலுள்ள செயப்பாட்டு அறிக்கையைப் பாதுகாத்து, நேர்கூற்றுடன் இயல்பாக இணைக்கிறது.
- source_word: זָנְתָה
  choice: விபசாரத்தில் ஈடுபட்டிருக்கிறாள்
  rationale: זנה என்பதிலுள்ள விபசாரக் குற்றச்சாட்டை பொதுவான ‘ஒழுக்கக்கேடு’ என்று மென்மையாக்காமல், நவீனத் தமிழில் புரியுமாறு தருகிறது.
- source_word: כַּלָּתֶךָ
  choice: உன் மருமகள்
  rationale: சூழலுக்கேற்ற நேரடியான உறவுமுறைச் சொல்.
- source_word: וְגַם הִנֵּה
  choice: இதோ ... கர்ப்பமாகவும்
  rationale: הִנֵּה தரும் கவன ஈர்ப்பையும் வியப்பையும் ‘இதோ’ காக்கிறது; גַּם என்பதன் கூட்டல் வலிமையை ‘-வும்’ வெளிப்படுத்துகிறது.
- source_word: הָרָה
  choice: கர்ப்பமாக
  rationale: தெளிவான, வழக்கிலுள்ள நவீனத் தமிழ் இணைச்சொல்.
- source_word: לִזְנוּנִים
  choice: விபசாரச் செயல்களால்
  rationale: זְנוּנִים என்ற பன்மை/தொகுப்புப் பெயரின் செயல்கள் சார்ந்த வலிமையையும், לְ இங்குக் காட்டும் காரண அல்லது விளைவு உறவையும் வெளிப்படுத்துகிறது.
- source_word: הוֹצִיאוּהָ
  choice: அவளை வெளியே கொண்டுவாருங்கள்
  rationale: பன்மை ஏவல் வடிவையும் பெண்பால் ஒருமை செயப்படுபொருளையும் நேரடியாகக் காக்கிறது.
- source_word: וְתִשָּׂרֵף
  choice: அவள் எரிக்கப்படட்டும்
  rationale: நிஃபால் வடிவின் செயப்பாட்டுப் பொருளையும் தீர்ப்பின் ஏவல் வலிமையையும் காக்கிறது; செய்பவரை உரை குறிப்பிடாதபடியே விடுகிறது.
theological_decisions:
- issue: பாலியல் குற்றச்சாட்டுக்கான זנה / זנונים சொற்களின் மொழிபெயர்ப்பு
  choice: ‘விபசாரத்தில் ஈடுபட்டிருக்கிறாள்’ / ‘விபசாரச் செயல்களால்’ என்று ஒரே சொல்வேரின் தொடர்பை வெளிப்படுத்துதல்
  alternative: ‘பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட்டிருக்கிறாள்’ / ‘ஒழுக்கக்கேட்டால்’
  rationale: எபிரெயச் சொற்கள் பொதுவான பாலியல் ஒழுக்கக்கேட்டைக் காட்டிலும் விபசாரம் அல்லது வேசித்தனத்தின் உருவகத்தைக் கொண்டுள்ளன. இது உரையில் சொல்லப்படும் குற்றச்சாட்டு மட்டுமே; மொழிபெயர்ப்பு அதன் உண்மைத்தன்மையை முன்கூட்டியே தீர்மானிப்பதில்லை.
- issue: யூதாவின் தீர்ப்பின் வலிமை
  choice: ‘அவளை வெளியே கொண்டுவாருங்கள்; அவள் எரிக்கப்படட்டும்’
  alternative: ‘அவளை வெளியே கொண்டுவந்து எரியுங்கள்’
  rationale: உடனடியான கடுமையான கட்டளையைப் பாதுகாக்கிறது; அதேவேளையில் תִשָּׂרֵף என்பதன் செயப்பாட்டு வடிவின்படி எரிப்பவரின் அடையாளத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வேசித்தனம்’ என்பதற்குப் பதிலாகக் குறைவாகப் பழமையான ‘விபசாரம்’ தேர்ந்தெடுக்கப்பட்டாலும், எபிரெய மூலத்தின் குற்றச்சாட்டு வலிமையும் ஒரே சொல்வேரின் மீளுரையும் காக்கப்பட்டுள்ளன. மரியாதைப் பன்மை ஏவல் (‘கொண்டுவாருங்கள்’) தமிழ் உரைநடையில் கட்டளையை இயல்பாக வெளிப்படுத்துகிறது; அது கட்டளையின் கடுமையைத் தணிப்பதற்காக அல்ல.
