  text: וַ/יִּרְבּוּ֙ הַ/יָּמִ֔ים וַ/תָּ֖מָת בַּת שׁ֣וּעַ אֵֽשֶׁת יְהוּדָ֑ה וַ/יִּנָּ֣חֶם יְהוּדָ֗ה וַ/יַּ֜עַל עַל גֹּֽזֲזֵ֤י צֹאנ/וֹ֙ ה֗וּא וְ/חִירָ֛ה רֵעֵ֥/הוּ הָ/עֲדֻלָּמִ֖י תִּמְנָֽתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/012.yaml
  text: After many days had passed[a], the daughter of Shua, Judah’s wife, died. When Judah was comforted[c][b], he went up to Timnah to his sheep shearers—he and his friend Hirah the Adullamite.
translation:
  language: ta
  text: பல நாட்கள் கடந்தபின்[a], சூவாவின் மகளான யூதாவின் மனைவி இறந்தாள். யூதா ஆறுதலடைந்தபின்[c], அவனும் அவனுடைய நண்பனான அதுல்லாமியன் ஹீராவும் திம்னாவுக்கு, அவனுடைய ஆடுகளின் மயிரைக் கத்தரிப்பவர்களிடம் ஏறிச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, ‘நீண்ட காலத்திற்குப் பின்.’ சொல்லுக்குச் சொல்: ‘நாட்கள் மிகுந்தன.’'
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘யூதா ஆறுதல் பெற்றபோது.’ இங்குள்ள எபிரெய வினைச்சொல், துக்கத்திற்குப் பின் ஆறுதல் பெறுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: பல நாட்கள் கடந்தபின்
  rationale: ‘நாட்கள் மிகுந்தன’ என்ற எபிரெய நேரடிப் பொருளை இயல்பான நவீனத் தமிழில் காலம் கடந்ததைக் குறிக்கும் வகையில் வழங்குகிறது; காலத்தின் நீளத்தை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: בַּת שׁוּעַ
  choice: சூவாவின் மகளான
  rationale: இது இங்கு தனிப்பட்ட பெயர் என்று கட்டாயப்படுத்தாமல், எபிரெயிலுள்ள உறவுமுறைச் சொற்றொடரை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: וַיִּנָּחֶם יְהוּדָה
  choice: யூதா ஆறுதலடைந்தபின்
  rationale: நחם வினையின் நிஃபால் வடிவம் துக்கத்திற்குப் பின் ஆறுதல் பெறுவதைக் குறிக்கிறது; மனந்திரும்புதல் என்ற பொருளை இங்கு புகுத்தவில்லை.
- source_word: וַיַּעַל
  choice: ஏறிச் சென்றார்கள்
  rationale: עלה என்பதிலுள்ள மேல்நோக்கிய பயண நுணுக்கத்தை ‘ஏறிச்’ என்பது காக்கிறது. யூதாவோடு ஈராவும் சென்றதால் தமிழில் இயல்பான பலர்பால் வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַל גֹּזֲזֵי צֹאנוֹ
  choice: தன் ஆடுகளுக்கு மயிர் கத்தரிப்பவர்களிடம்
  rationale: இலக்கு ஆடுகளை மயிர் கத்தரிக்கும் தொழிலாளர்களே என்பதைக் காக்கிறது; யூதாவே கத்தரிக்கச் சென்றான் என்று மாற்றவில்லை.
- source_word: הוּא וְחִירָה רֵעֵהוּ הָעֲדֻלָּמִי
  choice: அவனும் அவனுடைய நண்பனான அதுல்லாமியன் ஈராவும்
  rationale: துணைவரின் பெயர், நட்பு உறவு, அதுல்லாம் ஊரைச் சேர்ந்தவர் என்ற அடையாளம் ஆகிய அனைத்தையும் இயல்பான தமிழ் வரிசையில் தருகிறது.
- source_word: תִּמְנָתָה
  choice: திம்னாவில் … சென்றார்கள்
  rationale: இடப்பெயருடன் இணைந்த திசைச்சுட்டும் -ה, திம்னாவை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் இலக்கிடம் மற்றும் அங்கிருந்த மயிர் கத்தரிப்பவர்களை ஒருங்கிணைத்து இயல்பாகத் தரப்பட்டுள்ளது.
theological_decisions:
- issue: யூதா ‘ஆறுதலடைந்தான்’ என்பதன் பொருள்
  choice: துக்கத்திற்குப் பின் ஆறுதலடைந்ததாக மொழிபெயர்க்கப்பட்டது
  alternative: யூதா மனந்திரும்பினான் / யூதா முற்றிலும் துக்கத்திலிருந்து மீண்டான்
  rationale: சூழலும் நிஃபால் வடிவமும் இழப்புக்குப் பின் ஆறுதல் பெறுதலை ஆதரிக்கின்றன; மனந்திரும்புதல் அல்லது முழுமையான உணர்ச்சி மீட்பு ஆகியவற்றை உரை கூறுவதைக் காட்டிலும் அதிகமாக உறுதிப்படுத்தக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு தெளிவாகவும் கதையுரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘மயிர் கத்தரிப்பவர்கள்’ என்பது ஆடுகளின் ரோமத்தை வெட்டுவோரைக் குறிக்கும் தெளிவான பொதுவழக்கு. மூலத்தின் உறவுமுறை, திசைநுணுக்கு, ஆறுதல் பெறுதல் ஆகியவை தேவையற்ற விளக்கமின்றி பாதுகாக்கப்பட்டன.
