  text: וַ/יְהִ֖י בְּ/עֵ֣ת לִדְתָּ֑/הּ וְ/הִנֵּ֥ה תְאוֹמִ֖ים בְּ/בִטְנָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/027.yaml
  text: When it was time for her to give birth, behold, there were twins in her womb.
translation:
  language: ta
  text: அவள் பெற்றெடுக்கும் நேரம் வந்தபோது, இதோ, அவளுடைய கருப்பையில் இரட்டைக் குழந்தைகள் இருந்தன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: நேரம் வந்தபோது
  rationale: கதை நிகழ்வின் தொடர்ச்சியையும் காலச் சூழலையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; மூலத்தில் இல்லாத தனியான ‘இப்போது’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: לִדְתָּהּ
  choice: அவள் பெற்றெடுக்கும்
  rationale: ילד வேரிலிருந்து வந்த இந்த வினையெச்சப் பெயர்ச்சொல் வடிவமும் மூன்றாம் நபர் பெண்பால் ஒருமை பின்னொட்டும், அவள் குழந்தை பெற்றெடுப்பதைக் குறிக்கின்றன.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, எதிர்பாராத அல்லது குறிப்பிடத்தக்க நிலையைக் காட்டும் எபிரெய உரையாடல் வலிமையைப் பாதுகாக்கிறது.
- source_word: תְאוֹמִים
  choice: இரட்டைக் குழந்தைகள்
  rationale: இரட்டையாகப் பிறக்கவிருந்த இரண்டு குழந்தைகளைக் குறிக்கும் சொல்லைத் தெளிவான இயல்பான தமிழில் வழங்குகிறது.
- source_word: בְּבִטְנָהּ
  choice: அவளுடைய கருப்பையில்
  rationale: בֶּטֶן என்பதற்கு வயிறு அல்லது கருப்பை என்று பொருள் வரலாம்; பிரசவச் சூழலில் ‘கருப்பை’ துல்லியமானது.
