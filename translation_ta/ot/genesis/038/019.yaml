base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/019.yaml
  text: Then she arose and went away[b][a], and she removed her veil from upon her and put on the garments of her widowhood.
translation:
  language: ta
  text: பின்பு அவள் எழுந்து அங்கிருந்து சென்றாள்; தன் முகத்திரையை அகற்றிவிட்டு, தன் விதவைக்குரிய ஆடைகளை அணிந்துகொண்டாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  choice: அவள் எழுந்து
  rationale: קום என்பதன் Qal தொடர்வினை கதைநிகழ்வின் அடுத்த செயலைக் குறிக்கிறது; ‘எழுந்து’ என்பது இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: וַתֵּלֶךְ
  choice: அங்கிருந்து சென்றாள்
  rationale: முந்தைய ‘எழுந்து’ என்பதுடன் தொடர்வதால், அந்த இடத்தைவிட்டுப் புறப்பட்டுச் சென்ற பொருள் சூழலில் தெளிவாகிறது; ‘அங்கிருந்து’ என்பது தமிழில் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַתָּסַר
  choice: அகற்றிவிட்டு
  rationale: סור என்பதன் Hiphil வடிவம் தன்னிடமிருந்த மூடுதுணியை நீக்கிய செயலைக் குறிக்கிறது; தொடர்ச்சியான செயல்களைத் தமிழில் இயல்பாக இணைக்க ‘அகற்றிவிட்டு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: צְעִיפָהּ
  choice: தன் முகத்திரையை
  rationale: צָעִיף என்பது தலை அல்லது முகத்தை மூடும் திரையைக் குறிக்கலாம்; முந்தைய சூழலில் தாமாரின் வேடத்தை மறைத்த மூடுதுணி என்பதால் ‘முகத்திரை’ பொருத்தமானது.
- source_word: מֵעָלֶיהָ
  choice: தன் ... அகற்றிவிட்டு
  rationale: ‘அவள்மேலிருந்து’ என்ற எபிரேயப் படிமம், தமிழில் உடைமையைக் குறிக்கும் ‘தன்’ மற்றும் ‘அகற்று’ என்ற வினையால் இயல்பாகவும் முழுமையாகவும் வெளிப்படுகிறது.
- source_word: וַתִּלְבַּשׁ
  choice: அணிந்துகொண்டாள்
  rationale: לבש என்பது ஆடையை உடுத்திக்கொள்வதைக் குறிக்கிறது; ‘அணிந்துகொண்டாள்’ நவீனத் தமிழில் தெளிவான இயல்பான வடிவம்.
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: தன் விதவைக்குரிய ஆடைகளை
  rationale: இந்த இணைச்சொல் அவளுடைய விதவை நிலையோடு தொடர்புடைய ஆடைகளைக் குறிக்கிறது; ‘விதவைக்குரிய ஆடைகள்’ மூலத்தின் பொருளை இயல்பான தமிழில் காக்கிறது.
