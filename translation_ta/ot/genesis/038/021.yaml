  to: அவன் அவளுடைய ஊரைச் சேர்ந்த ஆண்களிடம், “ஏனாயிமில் வழியருகே இருந்த வழிபாட்டுத் தொடர்புடைய விலைமாது எங்கே?” என்று கேட்டான். அதற்கு அவர்கள், “இங்கே வழிபாட்டுத் தொடர்புடைய விலைமாது இல்லை” என்றார்கள்.
