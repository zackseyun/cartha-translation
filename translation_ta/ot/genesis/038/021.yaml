  text: וַ/יִּשְׁאַ֞ל אֶת אַנְשֵׁ֤י מְקֹמָ/הּ֙ לֵ/אמֹ֔ר אַיֵּ֧ה הַ/קְּדֵשָׁ֛ה הִ֥וא בָ/עֵינַ֖יִם עַל הַ/דָּ֑רֶךְ וַ/יֹּ֣אמְר֔וּ לֹא הָיְתָ֥ה בָ/זֶ֖ה קְדֵשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/021.yaml
  text: He asked the men of her place[a], saying, “Where is the cult prostitute who was at Enaim by the road?” But they said[b], “There has been no cult prostitute here.”
translation:
  language: ta
  text: அவன் அவளுடைய ஊரைச் சேர்ந்த ஆண்களிடம், “ஏனாயிமில் வழியருகே இருந்த வழிபாட்டுத் தொடர்புடைய விலைமாது எங்கே?” என்று கேட்டான். அதற்கு அவர்கள், “இங்கே வழிபாட்டுத் தொடர்புடைய விலைமாது இல்லை” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: கேட்டான்
  rationale: שׁאל என்பதன் இயல்பான கதைநடைப் பொருளை நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: אַנְשֵׁי מְקֹמָהּ
  choice: அவளுடைய ஊரைச் சேர்ந்த ஆண்களிடம்
  rationale: எபிரேய மொழியிலுள்ள மூன்றாம் நபர் பெண்பால் ஒருமை உடைமைப் பின்னொட்டைத் தக்கவைத்து, தமிழில் புரியும் வகையில் இடத்துடன் அவர்களுக்குள்ள தொடர்பை வெளிப்படுத்துகிறது.
- source_word: לֵאמֹר
  choice: என்று
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் எபிரேய அமைப்புக்கான இயல்பான தமிழ் வடிவம்.
- source_word: אַיֵּה
  choice: எங்கே?
  rationale: தேடப்படும் நபரின் இருப்பிடத்தைக் கேட்கும் நேரடியான வினாவைத் தருகிறது.
- source_word: הַקְּדֵשָׁה / קְדֵשָׁה
  choice: வழிபாட்டுச் சடங்குடன் தொடர்புடைய விலைமாது
  rationale: קְדֵשָׁה என்பதை பொதுவான 'விலைமாது' என்பதிலிருந்து வேறுபடுத்தி, அதன் வழிபாட்டு அல்லது சடங்குசார் தொடர்பை வெளிப்படுத்துகிறது; உரையில் கோவில் கட்டிடம் குறிப்பிடப்படாததால் 'கோவில் விலைமாது' என்று குறுக்கவில்லை.
- source_word: הִוא
  choice: இருந்த
  rationale: சுட்டுப்பெயரின் குறிப்பாற்றலைத் தமிழில் பெயரெச்சத் தொடர்புத் தொடருக்குள் இயல்பாக உட்படுத்துகிறது.
- source_word: בָעֵינַיִם
  choice: ஏனாயிமில்
  rationale: சூழலில் இது இடப்பெயராகச் செயல்படுவதால், 'கண்கள்' அல்லது 'ஊற்றுகள்' என மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל הַדָּרֶךְ
  choice: வழியருகே
  rationale: இங்கு עַל என்பது பாதைக்கு அருகிலுள்ள இடத்தைக் குறிப்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לֹא הָיְתָה בָזֶה קְדֵשָׁה
  choice: இங்கே அப்படிப்பட்ட விலைமாது யாரும் இருந்ததில்லை
  rationale: அந்த இடத்தில் அத்தகைய பெண் இருந்ததே இல்லை என்ற உள்ளூராரின் மறுப்பை இயல்பான தமிழ் உரையாடலாகத் தருகிறது; 'அப்படிப்பட்ட' என்பது முன்பு கூறப்பட்ட சடங்குசார் வகையை மீண்டும் சுமையின்றிக் குறிக்கிறது.
theological_decisions:
- issue: קְדֵשָׁה என்பதன் சடங்குசார் பொருள்
  choice: வழிபாட்டுச் சடங்குடன் தொடர்புடைய விலைமாது
  alternative: கோவில் விலைமாது; விலைமாது
  rationale: சொல்லின் வழிபாட்டு/சடங்குசார் தொடர்பை மறைக்காமல் தக்கவைக்கிறது; அதே சமயம் குறிப்பிட்ட கோவில் அமைப்பையோ சமய நிறுவனத்தையோ மூலத்தில் இல்லாமல் சேர்ப்பதில்லை.
translation_notes:
  register: மரியாதையும் தெளிவும் கொண்ட நவீன நிலையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. 'வழிபாட்டுச் சடங்குடன் தொடர்புடைய விலைமாது' என்பது சற்றே விளக்கமான மொழிபெயர்ப்பாக இருந்தாலும், קְדֵשָׁה மற்றும் இவ்வதிகாரத்தில் வரும் பொதுவான זֹנָה ஆகியவற்றின் வேறுபாட்டைத் தக்கவைக்கிறது. வழங்கப்பட்ட ஆங்கில அடிக்குறி குறிப்பான்கள் அவற்றின் உரைகளுடன் பொருந்தாமல் இடமாற்றம் பெற்றிருந்ததால், மூல எபிரேய வசனத்திற்கு அவசியமில்லாத அடிக்குறிகள் சேர்க்கப்படவில்லை.
