  text: At that time Judah went down from his brothers and turned aside to a certain Adullamite whose name was Hirah[a][b].
translation:
  language: ta
  text: 'அந்தக் காலத்தில்[a] யூதா தன் சகோதரர்களைவிட்டுக் கீழே சென்று, ஈரா என்ற பெயருடைய அதுல்லாமைச் சேர்ந்த ஒருவனிடம்[b] வழிமாறிச் சென்றான்.


    [a] இன்னும் சொல்லுக்குச் சொல்லான மொழிபெயர்ப்பு: “அந்தக் காலத்தில் அப்போது நிகழ்ந்தது.”


    [b] அல்லது, “அதுல்லாமிய மனிதன் ஒருவனிடம்.” எபிரெயச் சொற்றொடர் அவன் எந்த ஊரைச் சேர்ந்தவன் என்பதை மட்டும் குறிக்கலாம்; அதேவேளையில், குறிப்பிட்ட ஒரு நபரை அறிமுகப்படுத்துவதாகவும் இருக்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல்லான மொழிபெயர்ப்பு: “அந்தக் காலத்தில் அப்போது நிகழ்ந்தது.”'
    reason: lexical_alternative
