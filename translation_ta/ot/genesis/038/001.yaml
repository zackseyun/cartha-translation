    text: அல்லது, “அதுல்லாமிய மனிதன் ஒருவனிடம்.” எபிரெயச் சொற்றொடர் அவன் எந்த ஊரைச் சேர்ந்தவன் என்பதை மட்டும் குறிக்கலாம்; அதேவேளையில், குறிப்பிட்ட ஒரு நபரை அறிமுகப்படுத்துவதாகவும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: அந்தக் காலத்தில்
  rationale: எபிரெயக் கதைத் தொடக்கச் சூத்திரம் புதிய நிகழ்வை அறிமுகப்படுத்துகிறது. சொல்லுக்குச் சொல்லாக உள்ள ‘இவ்வாறு நிகழ்ந்தது’ என்பதை அடிக்குறிப்பில் வைத்து, இயல்பான நவீனத் தமிழில் காலச் சூழலை முதன்மை உரை தெரிவிக்கிறது.
- source_word: וַיֵּרֶד
  choice: கீழே சென்று
  rationale: ירד என்பதன் திசை சார்ந்த பொருளை இயல்பான கதைநடைத் தமிழில் காக்கிறது.
- source_word: מֵאֵת אֶחָיו
  choice: தன் சகோதரர்களைவிட்டு
  rationale: யூதா தன் சகோதரர்களிடமிருந்து பிரிந்து சென்றதை நேரடியாகவும் பாலினத் துல்லியத்துடனும் தெரிவிக்கிறது.
- source_word: וַיֵּט
  choice: வழிவிலகிச் சென்றான்
  rationale: נטה இங்கு ஒருவரை நோக்கித் தன் வழியிலிருந்து விலகிச் செல்வதைக் குறிக்கிறது; ‘நீட்டினான்’ போன்ற தவறான சொல்லாட்சியைத் தவிர்த்து இயக்க உணர்வைக் காக்கிறது.
- source_word: עַד
  choice: ஒருவனிடம்
  rationale: ஒரு நபரை இலக்காகக் கொண்ட இயக்கத்தை இங்கு இயல்பான தமிழில் ‘-இடம்’ என்ற வேற்றுமை வடிவம் தெரிவிக்கிறது.
- source_word: אִישׁ עֲדֻלָּמִי
  choice: அதுல்லாமைச் சேர்ந்த ஒருவன்
  rationale: அந்த நபரின் ஊர்சார் அடையாளத்தையும், கதையில் குறிப்பிட்ட ஒருவரை அறிமுகப்படுத்தும் אִישׁ என்ற சொல்லின் செயலையும் இயல்பாகக் காக்கிறது; மேலும் சொல்லுக்குச் சொல்லான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וּשְׁמוֹ חִירָה
  choice: ஈரா என்ற பெயருடைய
  rationale: பெயரிடும் உட்பிரிவைத் தமிழில் இயல்பாக முந்தைய பெயர்ச்சொல்லோடு இணைக்கிறது.
- source_word: חִירָה
  choice: ஈரா
  rationale: எபிரெயத் தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
