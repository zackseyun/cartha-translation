base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/026.yaml
  text: Then Judah recognized them and said[a], “She is more righteous than I[b], because I did not give her to Shelah my son.” And he did not know her again.
translation:
  language: ta
  text: அப்போது யூதா அவற்றை அடையாளம் கண்டு, “என்னைவிட அவளே நீதியுள்ளவள்[a]; ஏனெனில், நான் அவளை என் மகன் சேலாவுக்குக் கொடுக்கவில்லை” என்றான். அதன்பின் அவன் அவளுடன் மீண்டும் உடலுறவு கொள்ளவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைவிட அவளே நியாயத்தின் பக்கம் இருக்கிறாள்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் எழுத்துப்படி, “அவளை மீண்டும் அறியவில்லை”; இது பாலுறவைக் குறிக்கும் மறைமுகச் சொல்வழக்கு.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: அவற்றை அடையாளம் கண்டு
  rationale: முந்தைய வசனத்தில் காட்டப்பட்ட அடமானப் பொருள்களையே யூதா அடையாளம் கண்டான். எபிரெயத்தில் வெளிப்படையாக இல்லாத பன்மைச் செயப்படுபொருள் உடனடி சூழலிலிருந்து தெளிவாக இருப்பதால் தமிழில் சேர்க்கப்பட்டுள்ளது.
- source_word: צָדְקָה מִמֶּנִּי
  choice: என்னைவிட அவளே நீதியுள்ளவள்
  rationale: מִן அமைப்பு யூதாவுடன் ஒப்பிடுகையில் தாமார் நீதியுள்ளவள் அல்லது நியாயத்தின் பக்கம் உள்ளவள் என்பதைக் காட்டுகிறது. צדק என்ற சொல்லின் அறநெறி வலிமையையும் ஒப்பீட்டுத் தன்மையையும் இச்சொற்றொடர் காக்கிறது.
- source_word: כִּי עַל כֵּן
  choice: ஏனெனில்
  rationale: இங்கு இச்சொற்றொடர் யூதாவின் ஒப்புதலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் ‘ஏனெனில்’ அதன் காரணப்பொருளை இயல்பாகத் தருகிறது.
- source_word: לֹא נְתַתִּיהָ לְשֵׁלָה בְנִי
  choice: நான் அவளை என் மகன் சேலாவுக்குக் கொடுக்கவில்லை
  rationale: மூலத்தின் ‘கொடுக்கவில்லை’ என்ற நேரடி வடிவம் காக்கப்பட்டுள்ளது; திருமணத்திற்குக் கொடுப்பது என்பது கதைச் சூழலில் தெளிவாகிறது.
- source_word: וְלֹא יָסַף עוֹד לְדַעְתָּהּ
  choice: அதன்பின் அவன் அவளுடன் மீண்டும் உடலுறவு கொள்ளவில்லை
  rationale: ידע இங்கு பாலுறவைக் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழில் ‘அவளை அறியவில்லை’ என்பது இயல்பற்றதும் தவறாகப் புரிந்துகொள்ளக்கூடியதும் என்பதால் பொருள் தெளிவாக மொழிபெயர்க்கப்பட்டு, மூல மரபுத்தொடர் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது.
- source_word: שֵׁלָה
  choice: சேலா
  rationale: தனிப்பெயர் எபிரெய ஒலிப்பை அணுகும் வழக்கமான தமிழ் வடிவில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: யூதாவின் ஒப்புதலில் உள்ள அறநெறி மதிப்பீடு
  choice: இந்தச் சம்பவத்தில் தன்னுடன் ஒப்பிடுகையில் தாமார் நீதியுள்ளவள் என்று யூதா ஒப்புக்கொள்கிறான்.
  alternative: தாமார் நடைமுறை ரீதியில் மட்டுமே நியாயத்தின் பக்கம் இருந்தாள்; அல்லது அவள் முற்றிலும் பாவமற்றவள் என்று யூதா அறிவித்தான்.
  rationale: எபிரெயச் சொற்றொடர் ஒப்பீட்டுத் தன்மை கொண்டது. ஆகவே அதன் அறநெறி வலிமை காக்கப்படுகிறது; அதேவேளை தாமாரைப் பற்றிய முழுமையான பாவமின்மை அறிவிப்பாக அது விரிவுபடுத்தப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. ‘நீதியுள்ளவள்’ மூலத்தின் அறநெறிச் சொல்லைத் தக்கவைக்கிறது; ‘உடலுறவு கொள்ளவில்லை’ மறைமுக எபிரெயப் பயன்பாட்டின் பொருளைத் தெளிவாகவும் மரியாதையுடனும் தெரிவிக்கிறது. அனைத்து அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின்னர் வைக்கப்பட்டுள்ளன.
