base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/018.yaml
  text: He said[a], “What pledge shall I give you?” And she said, “Your seal, your cord, and your staff that is in your hand.” So he gave them to her and went in to her[c][b], and she conceived by him.
translation:
  language: ta
  text: அவன், “நான் உனக்கு என்ன அடைமானம் கொடுக்க வேண்டும்?” என்று கேட்டான். அதற்கு அவள், “உன் முத்திரை[a], உன் கயிறு, உன் கையிலுள்ள கோல் ஆகியவற்றைக் கொடு” என்றாள். அவன் அவற்றை அவளிடம் கொடுத்து, அவளோடு உறவுகொண்டான்[b]; அவள் அவனால் கருவுற்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முத்திரை மோதிரம்’ என்றும் மொழிபெயர்க்கலாம்; முத்திரையிடும் பொருள் எந்த வடிவில் இருந்தது என்பதை எபிரெய உரை குறிப்பிடவில்லை.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் உள்ள சொற்சொல்லான மரபுத்தொடர் ‘அவளிடம் சென்றான்’; இது பாலுறவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵרָבוֹן
  choice: அடைமானம்
  rationale: பின்னர் செலுத்த வேண்டியதற்கான உறுதியாக ஒப்படைக்கப்படும் பொருளைக் குறிக்கிறது; தமிழில் ‘அடைமானம்’ இச்சூழலை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: חֹתָמְךָ
  choice: உன் முத்திரை
  rationale: அடையாளப்படுத்தப் பயன்படும் முத்திரையைக் குறிக்கிறது; அது மோதிரம் என்று எபிரெய உரை குறிப்பிடாததால், பொருளின் வடிவத்தை மிகைப்படுத்தாமல் ‘முத்திரை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וּפְתִילֶךָ
  choice: உன் கயிறு
  rationale: முத்திரையோடு இணைந்திருக்கக்கூடிய நூல் அல்லது கயிறைக் குறிக்கிறது; விளக்கத்தைச் சேர்க்காமல் பொதுவான பொருளைத் தக்கவைக்கிறது.
- source_word: וּמַטְּךָ
  choice: கோல்
  rationale: கையில் ஏந்தப்படும் தனிப்பட்ட கோல் அல்லது தடியைக் குறிக்கிறது; இச்சூழலில் ‘கோல்’ இயல்பான, கண்ணியமான தமிழ்ச் சொல்.
- source_word: אֲשֶׁר בְּיָדֶךָ
  choice: உன் கையிலுள்ள
  rationale: எபிரெய உரையின் உருவகமற்ற நேரடியான காட்சியைச் சுருக்கமாகவும் இயல்பாகவும் தக்கவைக்கிறது; இத்தொடர் கோலைத் தழுவுகிறது.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: அவளோடு உறவுகொண்டான்
  rationale: இது பாலுறவைக் குறிக்கும் எபிரெய மரபுத்தொடர். சொற்சொல்லான தமிழ் தெளிவற்றதாக இருப்பதால், அதன் மறைமுகமான ஆனால் தெளிவான பொருள் கண்ணியமான நடையில் தரப்பட்டது.
- source_word: וַתַּהַר לוֹ
  choice: அவள் அவனால் கருவுற்றாள்
  rationale: கருத்தரித்தல் அல்லது கருவுறுதலைக் குறிக்கும் வினையையும், לוֹ காட்டும் ‘அவனால்’ என்ற உறவையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַיִּתֶּן לָּהּ
  choice: அவன் அவற்றை அவளிடம் கொடுத்து
  rationale: எபிரெய வினையில் பொருட்கள் வெளிப்படையாக மீண்டும் சொல்லப்படாவிட்டாலும், முன் குறிப்பிடப்பட்ட மூன்று பொருட்களைக் குறிக்க இயல்பான தமிழில் ‘அவற்றை’ சேர்க்கப்பட்டது.
theological_decisions:
- issue: கருவுற்றதற்கான ஆண் தொடர்பை வெளிப்படுத்துதல்
  choice: அவள் அவனால் கருவுற்றாள்
  alternative: அவள் அவனுக்காகக் கருவுற்றாள்
  rationale: לוֹ என்ற சொல்லின் உறவுப்பொருளை இயல்பான தமிழில் தந்தைத்தொடர்பாக வெளிப்படுத்துகிறது; ‘அவனுக்காக’ என்பது நோக்கம் அல்லது பயன் என்ற தவறான நிழற்பொருளை உண்டாக்கலாம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. எபிரெய உரையின் வரிசையும் பொருள் உறவுகளும் முடிந்தவரை காக்கப்பட்டுள்ளன; பாலுறவைக் குறிக்கும் மரபுத்தொடர் சொற்சொல்லாகத் தெளிவில்லாத தமிழில் விடப்படாமல், கண்ணியமாகப் பொருள்வழி தரப்பட்டுள்ளது.
