source:
  edition: WLC
  text: וַ/יֻּגַּ֥ד לְ/תָמָ֖ר לֵ/אמֹ֑ר הִנֵּ֥ה חָמִ֛י/ךְ עֹלֶ֥ה תִמְנָ֖תָ/ה לָ/גֹ֥ז צֹאנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/013.yaml
  text: And Tamar was told[a], saying, “Look, your father-in-law is going up to Timnah to shear his sheep.”
translation:
  language: ta
  text: “இதோ, உன் மாமனார் தமது ஆடுகளின்[a] மயிரைக் கத்தரிக்க திம்னாவுக்கு ஏறிச் செல்கிறார்” என்று தாமாருக்குச் சொல்லப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது மந்தையின்.”
    reason: צֹאן என்பது ஆடுகளைத் தனிப்படக் குறிக்கவும், சிறு கால்நடை மந்தையைத் தொகுப்பாகக் குறிக்கவும் இயலும்.
lexical_decisions:
- source_word: וַיֻּגַּד לְתָמָר
  choice: தாமாருக்குச் சொல்லப்பட்டது
  rationale: הֻפעל வினை வடிவின் செயப்பாட்டு, செய்தி அறிவிக்கும் பொருளைத் தக்கவைக்கிறது; தமிழில் இயல்பாகப் பெறுநரை முன்னிறுத்துகிறது.
- source_word: לֵאמֹר
  choice: என்று
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் எபிரெயச் சொல்லைத் தமிழின் இயல்பான மேற்கோள் முடிப்பான ‘என்று’ மூலம் வெளிப்படுத்துகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கேட்பவரின் கவனத்தைச் செய்தியின்மேல் திருப்பும் இடைச்சொல்லின் உரையாடல் வலிமையைப் பாதுகாக்கிறது.
- source_word: חָמִיךְ
  choice: உன் மாமனார்
  rationale: இரண்டாம் நபர் பெண்பால் ஒருமை பின்னொட்டையும் உறவுமுறைச் சொல்லையும் தெளிவாகத் தக்கவைக்கிறது.
- source_word: עֹלֶה
  choice: ஏறிச் செல்கிறார்
  rationale: நடைபெற்றுக்கொண்டிருக்கும் அல்லது உடனடியாக நிகழவிருக்கும் இயக்கத்தையும் עלה என்பதிலுள்ள மேல்நோக்கிய திசை நுட்பத்தையும் காக்கிறது.
- source_word: תִמְנָתָה
  choice: திம்னாவுக்கு
  rationale: இடப்பெயருடன் சேர்ந்த திசைகாட்டும் ה-ஐ இயல்பான தமிழ் இலக்கு வேற்றுமையால் மொழிபெயர்க்கிறது.
- source_word: לָגֹז
  choice: மயிரைக் கத்தரிக்க
  rationale: ל உடன் வரும் வினையெச்சத்தின் நோக்கப் பொருளை வெளிப்படுத்துகிறது; ஆடுகளை மயிர் கத்தரிக்கும் சூழலை இயல்பாகக் கூறுகிறது.
- source_word: צֹאנוֹ
  choice: தமது ஆடுகளின்
  rationale: צֹאן சிறு கால்நடை மந்தையைக் கூட்டாகக் குறிக்கலாம்; மயிர் கத்தரிக்கும் சூழலில் ‘ஆடுகள்’ என்பது குறிப்பான, இயல்பான பொருள். மரியாதைப் பன்மைக்கு ஏற்ற ‘தமது’ உரிமையைச் சுட்டுகிறது.
