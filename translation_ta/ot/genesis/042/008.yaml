  source_fidelity: வַיַּכֵּר / הִכִּרֻהוּ ஆகிய ஒரே எபிரெய நכר ஹிஃபில் வினை இரு கூறுகளிலும் ‘அடையாளம் கண்டுகொள்’ என ஒரேவிதமாக மொழிபெயர்க்கப்பட்டுள்ளது. யோசேப்பு அவர்களை அறிந்துகொண்டதும், அவர்கள் அவனை அறியாததுமான மூலத்தின் தெளிவான முரண்பாடு முழுமையாகப் பாதுகாக்கப்பட்டுள்ளது. ‘ஆனால்’ என்பது இச்சூழலிலுள்ள வாவ் இணைப்பின் எதிர்மறை-முரண்பாட்டு உணர்வை இயல்பாக வெளிப்படுத்துகிறது.
  naturalness: ‘யோசேப்பு தன் சகோதரர்களை அடையாளம் கண்டுகொண்டான்; ஆனால் அவர்கள் அவனை அடையாளம் கண்டுகொள்ளவில்லை’ என்பது நவீன நிலையான தமிழில் தெளிவானதும் இயல்பானதும் ஆகும். இரு கூறுகளிலும் ஒரே வினைத்தொடர் பயன்படுத்தப்பட்டிருப்பது சற்று விரிவானதாக இருந்தாலும், மூலத்தின் சொல் மீள்வருகையையும் கதைநயமான முரண்பாட்டையும் நன்றாகக் காட்டுகிறது.
  terminology: ‘யோசேப்பு’ தமிழ் வேதாகம வழக்கில் நிலைபெற்ற பெயர் வடிவம். ‘சகோதரர்கள்’ இச்சூழலில் ஆண் உடன்பிறந்தவர்களைக் குறிப்பதற்குத் துல்லியமானது. ‘அடையாளம் கண்டுகொள்’ என்பது முன்பு அறிந்த ஒருவரை மீண்டும் அறிதல்/அடையாளம் காணுதல் என்ற நכר வினையின் சூழல்சார் பொருளுக்குப் பொருத்தமானது.
