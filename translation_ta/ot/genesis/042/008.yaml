  text: וַ/יַּכֵּ֥ר יוֹסֵ֖ף אֶת אֶחָ֑י/ו וְ/הֵ֖ם לֹ֥א הִכִּרֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/008.yaml
  text: Joseph recognized his brothers[a], but they did not recognize him.
translation:
  language: ta
  text: யோசேப்பு தன் சகோதரர்களை அடையாளம் கண்டுகொண்டான்[a]; ஆனால் அவர்கள் அவனை அடையாளம் கண்டுகொள்ளவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழியில் இரு கூறுகளிலும் ஒரே வினைச்சொல் திரும்ப வருகிறது: “யோசேப்பு தன் சகோதரர்களை அடையாளம் கண்டுகொண்டான்; ஆனால் அவர்கள் அவனை அடையாளம் கண்டுகொள்ளவில்லை.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: அடையாளம் கண்டுகொண்டான்
  rationale: נכר என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் முன்பே அறிந்த ஒருவரை அடையாளம் காண்பதைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் கதைச்சூழலுக்கு ஏற்றவாறும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: אֶת־אֶחָיו
  choice: தன் சகோதரர்களை
  rationale: ஆண்பால் பன்மையிலுள்ள אָח, இச்சூழலில் யோசேப்பின் ஆண் உடன்பிறந்தவர்களையே குறிக்கிறது. எழுவாயான யோசேப்பைச் சுட்டும் உறவை இயல்பாகக் காட்ட ‘தன்’ பயன்படுத்தப்பட்டது.
- source_word: וְהֵם
  choice: ஆனால் அவர்கள்
  rationale: ו அடிப்படையில் ‘மற்றும்’ எனப் பொருள்படலாம்; இங்கு யோசேப்பு அவர்களை அடையாளம் கண்டதற்கும் அவர்கள் அவனை அடையாளம் காணாததற்கும் இடையிலான எதிர்மறை வேறுபாட்டைத் தெளிவாக வெளிப்படுத்த ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לֹא
  choice: இல்லை
  rationale: தமிழில் இறந்தகால வினைமுற்றின் மறுப்பை இயல்பாக அமைக்கும் வகையில் ‘அடையாளம் கண்டுகொள்ளவில்லை’ என்ற கட்டமைப்பில் மொழிபெயர்க்கப்பட்டது.
- source_word: הִכִּרֻהוּ
  choice: அவனை அடையாளம் கண்டுகொள்ளவில்லை
  rationale: முதல் கூறிலுள்ள அதே נכר வினைச்சொல்லின் மீள்வருகையை ‘அடையாளம் கண்டுகொள்’ என்று பாதுகாத்து, -הוּ பின்னொட்டை ‘அவனை’ எனக் காட்டுகிறது.
