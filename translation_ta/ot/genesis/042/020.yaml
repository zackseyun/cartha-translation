  yaml_path: translation/ot/genesis/042/020.yaml
  text: Then bring your youngest brother to me[a], so that your words may be verified and you will not die.” And they did so.
translation:
  language: ta
  text: உங்கள் இளைய தம்பியை என்னிடம் அழைத்து வாருங்கள். அப்போது உங்கள் வார்த்தைகள் உண்மையென உறுதிப்படும்[a]; நீங்கள் சாகமாட்டீர்கள்.” அவர்கள் அப்படியே செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்கள் வார்த்தைகள் உறுதிசெய்யப்படும்’ அல்லது ‘நம்பப்படும்.’ எபிரெய வினைச்சொல், ஒன்று உண்மையென நிலைநாட்டப்படுவதையோ நம்பத்தக்கதாக ஏற்கப்படுவதையோ குறிக்கலாம்; இங்கு சோதித்தறியும் சூழல் ‘உண்மையென உறுதிப்படும்’ என்ற பொருளுக்கு ஆதரவளிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: உங்கள் கடைசித் தம்பி
  rationale: הַקָּטֹן என்பது சொற்படியாக ‘சிறியவன்/இளையவன்’ எனப் பொருள்படும். பென்யமீனைப் பற்றிய இந்தச் சகோதரச் சூழலில், பிறப்பு வரிசையில் மிகவும் இளையவனைக் குறிக்கும் இயல்பான தமிழ்ச் சொற்றொடர் ‘கடைசித் தம்பி’ ஆகும்.
- source_word: תָּבִיאוּ אֵלַי
  choice: என்னிடம் அழைத்து வாருங்கள்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘கொண்டுவருதல்’ எனப் பொருள்படும். ஒரு நபரைப் பற்றிய தமிழ்ச் சூழலில் ‘அழைத்து வாருங்கள்’ இயல்பாகவும் மரியாதையாகவும் உள்ளது; אֵלַי என்பதையும் ‘என்னிடம்’ என்று நேரடியாகக் காக்கிறது.
- source_word: וְיֵאָמְנוּ
  choice: உண்மையென உறுதிப்படும்
  rationale: אמן என்பதன் நிஃபால் வடிவம் இங்கு சொற்கள் உண்மையானவை என நிறுவப்படுதல் அல்லது நம்பத்தக்கவையாக ஏற்கப்படுதல் என்ற பொருளைக் கொண்டுள்ளது. யோசேப்பு சகோதரர்களின் கூற்றைச் சோதிக்கும் சூழலில் ‘உண்மையென உறுதிப்படும்’ பொருத்தமானது; மூலத்தின் நுண்பொருள் வேறுபாடு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: דִבְרֵיכֶם
  choice: உங்கள் வார்த்தைகள்
  rationale: எபிரெயப் பன்மை வடிவத்தை நேரடியாகக் காத்து, அவர்கள் முன்பு கூறியவற்றோடு உள்ள தொடர்பை வெளிப்படுத்துகிறது.
- source_word: וְלֹא תָמֻתוּ
  choice: நீங்கள் சாகமாட்டீர்கள்
  rationale: கோரிக்கைக்கு இணங்குவதன் விளைவு அல்லது அதனுடன் இணைந்த உறுதி/எச்சரிக்கை என்ற எபிரெயக் கூறின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: அவர்கள் அப்படியே செய்தார்கள்
  rationale: இணங்கி நடந்ததைச் சுட்டும் எபிரெயக் கதைசொல்லல் வாய்பாட்டிற்கு இயல்பான தமிழாக்கம்.
