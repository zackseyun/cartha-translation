  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடையில் மொழிபெயர்க்கப்பட்டது. யோசேப்பின் கட்டளையின் நேரடித் தன்மையும், அதைத் தொடர்ந்து வரும் உயிர் குறித்த உறுதி/எச்சரிக்கையும் காக்கப்பட்டுள்ளன.
