  - severity: medium
    issue: ‘கடைசித் தம்பி’ is an awkward rendering of הַקָּטֹן.
    rationale: In modern Tamil, ‘கடைசித் தம்பி’ may be understood as the last-mentioned or final brother. ‘இளைய தம்பி’ is the normal idiom for a younger/youngest brother and best fits the narrative context.
