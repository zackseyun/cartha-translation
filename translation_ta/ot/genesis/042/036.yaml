source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ יַעֲקֹ֣ב אֲבִי/הֶ֔ם אֹתִ֖/י שִׁכַּלְתֶּ֑ם יוֹסֵ֤ף אֵינֶ֨/נּוּ֙ וְ/שִׁמְע֣וֹן אֵינֶ֔/נּוּ וְ/אֶת בִּנְיָמִ֣ן תִּקָּ֔חוּ עָלַ֖/י הָי֥וּ כֻלָּֽ/נָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/036.yaml
  text: 'And Jacob their father said to them[a], “You have bereaved me: Joseph is no more, and Simeon is no more, and you would take Benjamin[b]. All these things have come against me.”'
translation:
  language: ta
  text: அவர்களுடைய தந்தை யாக்கோபு அவர்களிடம், “நீங்கள் என்னைப் பிள்ளைகளை இழக்கச் செய்துவிட்டீர்கள்[a]. யோசேப்பு இல்லை; சிமியோனும் இல்லை; பென்யமீனையும் எடுத்துக்கொண்டு போக இருக்கிறீர்கள். இவையெல்லாம் எனக்கு எதிராக வந்துள்ளன[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைப் பிள்ளையற்றவனாக்கிவிட்டீர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இவையெல்லாம் எனக்கு எதிராக இருக்கின்றன.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכַּלְתֶּם
  choice: என்னைப் பிள்ளைகளை இழந்தவனாக்கிவிட்டீர்கள்
  rationale: பியேல் வினை வடிவம் ஒருவரைப் பிள்ளையிழக்கச் செய்தல் அல்லது பிள்ளையற்றவராக்குதல் என்ற காரணவினைப் பொருளைக் கொண்டது. யாக்கோபின் துயரத்தையும் மகன்களின் இழப்பையும் இச்சொற்றொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵינֶנּוּ
  choice: இல்லை
  rationale: இங்கு இது வெறும் இருப்பின்மையைவிட காணாமற்போன நிலை அல்லது இழப்பைக் குறிக்கிறது. சூழலில் “இல்லை” என்பது சுருக்கமாகவும் துயரின் வலிமையைத் தக்கவைத்தும் உள்ளது; இறந்துவிட்டான் என்று தேவையின்றி தீர்மானிக்கவில்லை.
- source_word: תִּקָּחוּ
  choice: அழைத்துக்கொண்டு போகப்போகிறீர்கள்
  rationale: இம்பெர்ஃபெக்ட் வடிவம் இங்கு முன்மொழியப்பட்ட அடுத்த செயலைக் குறித்த யாக்கோபின் எதிர்ப்பை வெளிப்படுத்துகிறது. பென்யமீனை வெறுமனே எடுத்தல் அல்ல, உடன் அழைத்துச் செல்லுதல் என்பதே தமிழில் சூழலுக்கேற்ற இயல்பான மொழியாகும்.
- source_word: עָלַי הָיוּ כֻלָּנָה
  choice: இவையெல்லாம் எனக்கு எதிராகவே வந்துள்ளன
  rationale: עָלַי என்பதிலுள்ள பாதகமான, எதிரான நுண்ணுணர்வையும் நிகழ்வுகள் யாக்கோபின்மேல் ஒட்டுமொத்தமாக வந்திருப்பதாக அவர் உணரும் நிலையையும் காக்கிறது.
- source_word: אֹתִי
  choice: என்னை
  rationale: எபிரெயில் முன்னிலைப்படுத்தப்பட்டுள்ள முதல் நபர் பொருளை வெளிப்படையாக வைத்து, இழப்பை அனுபவிப்பவர் யாக்கோபு என்பதற்கான அழுத்தத்தைக் காக்கிறது.
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: அவர்களுடைய தகப்பனாகிய யாக்கோபு
  rationale: எபிரெய் கூறுகளின் உறவைத் தெளிவாகவும், நவீன மரியாதையான தமிழில் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: யோசேப்பு மற்றும் சிமியோனின் நிலை
  choice: “இல்லை” என்று மொழிபெயர்த்து, அவர்களின் இல்லாமை அல்லது இழப்பை மட்டும் கூறுதல்
  alternative: “இறந்துவிட்டான்” அல்லது “போய்விட்டான்”
  rationale: אֵינֶנּוּ அவர்களின் இறப்பை இங்கு கட்டாயமாக உறுதிப்படுத்தவில்லை. யாக்கோபின் பார்வையில் உள்ள இழப்பையும் மூலத்தின் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. குடும்ப உறவுச் சூழலில் வேதாகம நடைக்கு ஏற்ற “தகப்பன்” பயன்படுத்தப்பட்டுள்ளது. யாக்கோபின் தொடர்ச்சியான புலம்பலைக் காட்ட அரைப்புள்ளிகள் வைக்கப்பட்டுள்ளன; மூலத்தில் உள்ள உணர்ச்சித் தீவிரமும் தெளிவின்மையும் காக்கப்பட்டுள்ளன.
