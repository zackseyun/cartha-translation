    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported temporal addition, uses a more direct and idiomatic causative for שִׁכַּלְתֶּם, and renders the intended taking of Benjamin without adding an escorting nuance. It retains the source’s ambiguity concerning Joseph’s and Simeon’s absence, the cumulative force of the final lament, and correctly placed footnote anchors.
