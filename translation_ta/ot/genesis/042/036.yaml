revisions:
- from: அவர்களுடைய தகப்பனாகிய யாக்கோபு அவர்களிடம், “நீங்கள் என்னைப் பிள்ளைகளை இழந்தவனாக்கிவிட்டீர்கள்[a]. யோசேப்பு இல்லை; சிமியோனும் இல்லை; இப்போது பென்யமீனையும் அழைத்துக்கொண்டு போகப்போகிறீர்கள். இவையெல்லாம் எனக்கு எதிராகவே வந்துள்ளன[b]” என்றார்.
  to: அவர்களுடைய தந்தை யாக்கோபு அவர்களிடம், “நீங்கள் என்னைப் பிள்ளைகளை இழக்கச் செய்துவிட்டீர்கள்[a]. யோசேப்பு இல்லை; சிமியோனும் இல்லை; பென்யமீனையும் எடுத்துக்கொண்டு போக இருக்கிறீர்கள். இவையெல்லாம் எனக்கு எதிராக வந்துள்ளன[b]” என்றார்.
  rationale: The revision removes the unsupported temporal addition, uses a more direct and idiomatic causative for שִׁכַּלְתֶּם, and renders the intended taking of Benjamin without adding an escorting nuance. It retains the source’s ambiguity concerning Joseph’s and Simeon’s absence, the cumulative force of the final lament, and correctly placed footnote anchors.
