  text: But they did not know that Joseph was listening[a], because the interpreter was between them.
translation:
  language: ta
  text: ஆனால், யோசேப்பு அவர்கள் பேசுவதைப் புரிந்துகொண்டான் என்பது அவர்களுக்குத் தெரியவில்லை; ஏனெனில், அவர்களுக்கு இடையில் மொழிபெயர்ப்பாளர் இருந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵם
  choice: ஆனால் ... அவர்கள்
  rationale: முந்தைய சூழலுடனான எதிர்மறைத் திருப்பை இயல்பான தமிழில் காட்டுகிறது; வெளிப்படையான எழுவாயையும் தக்கவைக்கிறது.
- source_word: לֹא יָדְעוּ
  choice: அவர்களுக்குத் தெரியவில்லை
  rationale: அறியாமையைக் குறிக்கும் எபிரெய வினையை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: כִּי
  choice: என்பது
  rationale: முதல் כִּי, அவர்கள் அறியாத செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: שֹׁמֵעַ
  choice: தாங்கள் பேசுவதை ... புரிந்துகொண்டான்
  rationale: שׁמע என்பதன் அடிப்படைப் பொருள் ‘கேள்’ என்றாலும், மொழிபெயர்ப்பாளர் இருந்த சூழலில் யோசேப்பு அவர்களுடைய மொழியைப் புரிந்துகொண்டதே கருத்தின் மையம். ‘தாங்கள் பேசுவதை’ என்பது தமிழில் பொருளைத் தெளிவாக்கும் சூழல்சார் நிரப்பு.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இரண்டாவது כִּי, அவர்கள் ஏன் அதை அறியவில்லை என்பதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: הַמֵּלִיץ
  choice: மொழிபெயர்ப்பாளர்
  rationale: வெவ்வேறு மொழி பேசுவோருக்கு இடையில் பேச்சை எடுத்துரைக்கும் நபரை இச்சூழலில் துல்லியமாகக் குறிக்கிறது.
- source_word: בֵּינֹתָם
  choice: அவர்களுக்கு இடையில்
  rationale: யோசேப்புக்கும் அவரது சகோதரர்களுக்கும் இடையிலான மொழி மத்தியஸ்த நிலையைத் தக்கவைக்கிறது.
