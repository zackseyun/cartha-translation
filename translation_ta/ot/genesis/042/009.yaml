  text: Then Joseph remembered the dreams that he had dreamed about them[a], and he said to them, “You are spies; you have come to see the nakedness of the land.”
translation:
  language: ta
  text: அப்போது யோசேப்பு அவர்களைக் குறித்துத் தான் கண்ட கனவுகளை நினைவுகூர்ந்தான். அவன் அவர்களிடம், “நீங்கள் உளவாளிகள்! நாட்டின் நிர்வாணத்தை[a] பார்க்க வந்திருக்கிறீர்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, “நாட்டின் வெளிப்பட்ட அல்லது பாதுகாப்பற்ற பகுதிகளை.” எபிரெயத்தில் சொல்லுக்கு சொல் “நாட்டின் நிர்வாணம்”; இது தாக்குதலுக்கு எளிதான இடங்களைக் குறிக்கும் மரபுத்தொடர்.
