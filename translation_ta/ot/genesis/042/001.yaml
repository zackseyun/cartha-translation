base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/001.yaml
  text: When Jacob saw that there was grain in Egypt[a], Jacob said to his sons, “Why do you keep looking at one another?”
translation:
  language: ta
  text: எகிப்தில் தானியம் இருப்பதை யாக்கோபு கண்டபோது, அவர் தம் மகன்களிடம், “நீங்கள் ஏன் ஒருவரையொருவர் பார்த்துக்கொண்டிருக்கிறீர்கள்?[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் ஏன் உங்களைக் காட்டிக்கொள்கிறீர்கள்?” எபிரெய வினைச்சொல்லை வேறுவிதமாகவும் புரிந்துகொள்ளலாம். ஆனால் இச்சூழலில், சகோதரர்கள் தயக்கத்துடன் ஒருவரையொருவர் பார்த்துக்கொண்டிருந்ததையே அது பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: அறிந்தபோது
  rationale: எபிரெயச் சொல் அடிப்படையில் ‘பார்த்தார்’ என்று பொருள்பட்டாலும், இங்கு எகிப்தில் தானியம் இருப்பதாக யாக்கோபுக்குத் தகவல் கிடைத்ததைச் சுட்டுகிறது. ‘அறிந்தபோது’ என்பது நிகழ்வுகளின் காலத் தொடர்பையும் கருத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: כִּי יֶשׁ
  choice: இருப்பதை
  rationale: யாக்கோபு அறிந்த செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெயக் கட்டமைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שֶׁבֶר
  choice: தானியம்
  rationale: பஞ்சகாலத்தில் வாங்கக் கிடைத்த உணவுத் தானியத்தையே இச்சொல் குறிக்கிறது; பொதுவான ‘உணவு’ என்பதைவிட ‘தானியம்’ துல்லியமானது.
- source_word: בְּמִצְרָיִם
  choice: எகிப்தில்
  rationale: இடத்தைக் குறிக்கும் בְּ முன்னிடைச்சொல்லின் நேரான தமிழ் வடிவம்.
- source_word: לְבָנָיו
  choice: தம் மகன்களிடம்
  rationale: இச்சூழலில் בָּנִים என்பது யாக்கோபின் ஆண் பிள்ளைகளைக் குறிப்பதால் ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לָמָּה
  choice: ஏன்
  rationale: நேரடியான வினாவைத் தெளிவாகவும் இயல்பாகவும் பாதுகாக்கிறது.
- source_word: תִּתְרָאוּ
  choice: ஒருவரையொருவர் பார்த்துக்கொண்டிருக்கிறீர்கள்
  rationale: ראה என்பதன் ஹித்பாயேல் வடிவம் இங்கு சகோதரர்கள் தயக்கத்துடன் செயலின்றி ஒருவரையொருவர் பார்த்துக்கொண்டிருப்பதைப் பெரும்பாலும் குறிக்கிறது. தொடரும் நிலையை ‘பார்த்துக்கொண்டிருக்கிறீர்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
