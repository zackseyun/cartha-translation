translation:
  language: ta
  text: அவன் அவர்களை மூன்று நாட்கள் காவலில் வைத்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவன் அவர்களை மூன்று நாட்கள் அடைத்துக் காவலில் வைத்தான்.’ எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் ‘சேர்த்தான்’ என்பதாகும்; ஆனால் இங்கே அது காவலில் வைப்பதைக் குறிக்கும் மரபுத்தொடரில் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: வைத்தான்
  rationale: אָסַף என்பதன் அடிப்படைப் பொருள் ‘சேர்த்தல்’; ஆனால் אֶל מִשְׁמָר என்பதுடன் இங்கு ஒருவரைக் காவலில் அடைத்து வைப்பதைக் குறிக்கும் மரபுத்தொடராக வருகிறது. ‘வைத்தான்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: אֹתָם
  choice: அவர்களை
  rationale: யோசேப்பின் சகோதரர்களைக் குறிக்கும் ஆண்பால் பன்மை நேரடிச் செயப்படுபொருள் சுட்டுப்பெயர்; மனிதர்களுக்குரிய மரியாதையான பொதுநடைத் தமிழில் ‘அவர்களை’ இயல்பானது.
- source_word: אֶל מִשְׁמָר
  choice: காவலில்
  rationale: מִשְׁמָר என்பது காவல் அல்லது பாதுகாப்பில் வைக்கப்படும் நிலை/இடத்தைக் குறிக்கிறது. ‘காவலில்’ என்பது சிறைச்சாலையென்று தேவையின்றி குறிப்பாக்காமல் அடைப்புக் காவல் என்ற பொருளைத் தருகிறது.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: மூன்று நாட்கள்
  rationale: கால அளவை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது; தமிழில் தனி இடைச்சொல் இன்றியே கால நீட்சி தெளிவாக உள்ளது.
