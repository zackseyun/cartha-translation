  rationale: The revision removes the unsupported temporal addition «இப்போது» and the added connective «அதற்கு», improves the deferential self-designation’s Tamil syntax, and makes “the youngest” explicit as «எங்களிலேயே இளையவன்». It retains the source’s euphemistic ambiguity concerning the absent brother and preserves the existing footnote anchor and content.
