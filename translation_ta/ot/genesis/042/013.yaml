revisions:
- from: அதற்கு அவர்கள், “உங்கள் பணியாளர்களாகிய நாங்கள் பன்னிரண்டு சகோதரர்கள்; கானான் நாட்டிலுள்ள ஒரே மனிதரின் மகன்கள். இதோ, இளையவன் இன்று எங்கள் தந்தையுடன் இருக்கிறான்; இன்னொருவன் இப்போது இல்லை[a]” என்றார்கள்.
