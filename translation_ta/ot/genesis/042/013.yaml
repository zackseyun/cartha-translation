base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/013.yaml
  text: And they said[a], “We, your servants, are twelve brothers, sons of one man in the land of Canaan. And behold, the youngest is with our father today, and one is no more.”
translation:
  language: ta
  text: அவர்கள், “உங்கள் பணியாளர்களான நாங்கள் பன்னிரண்டு சகோதரர்கள்; கானான் நாட்டிலுள்ள ஒரே மனிதரின் மகன்கள். இதோ, எங்களிலேயே இளையவன் இன்று எங்கள் தந்தையுடன் இருக்கிறான்; ஒருவன் இல்லை[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஒருவன் இல்லை.” இது “காணாமல் போய்விட்டான்” என்றோ, இறந்துவிட்டதைக் குறிப்பாக உணர்த்தவோ பயன்படும் மறைமுகச் சொல்லாட்சி.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அதற்கு அவர்கள் ... என்றார்கள்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை இயல்பான தமிழில் காட்டுகிறது; முன்னைய பேச்சுக்கான பதிலையும் சூழலுக்கு ஏற்றவாறு உணர்த்துகிறது.
- source_word: עֲבָדֶיךָ
  choice: உங்கள் பணியாளர்களாகிய
  rationale: இங்கு அடிமைநிலையை அல்ல, ஆட்சியாளரிடம் பேசும் பணிவான தாழ்மொழியைச் சுட்டுகிறது.
- source_word: שְׁנֵים עָשָׂר ... אַחִים אֲנַחְנוּ
  choice: நாங்கள் பன்னிரண்டு சகோதரர்கள்
  rationale: எண்ணிக்கையையும் சகோதர உறவையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: ஒரே மனிதரின் மகன்கள்
  rationale: ஆண்பால் உறவுமொழியையும் அவர்கள் ஒரே தந்தையின் மகன்கள் என்ற வலியுறுத்தலையும் காக்கிறது.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: கானான் நாட்டிலுள்ள
  rationale: எபிரெயத்தில் உள்ள ‘நாடு’ என்ற சொல்லைத் தக்கவைத்து தமிழில் இயல்பாக இணைக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה என்பதன் கவன ஈர்ப்பு மற்றும் முன்வைப்புத் தன்மையைச் சுருக்கமாகவும் மரியாதையான நடையிலும் தருகிறது.
- source_word: הַקָּטֹן
  choice: இளையவன்
  rationale: குடும்பச் சூழலில் இளைய சகோதரனைச் சுட்டுவதால், சொற்பொருளான ‘சிறியவன்’ என்பதைக் காட்டிலும் இது துல்லியமானது.
- source_word: אֶת אָבִינוּ
  choice: எங்கள் தந்தையுடன் இருக்கிறான்
  rationale: இங்குள்ள אֶת உடனிருப்பைக் குறிக்கிறது; நேர்முகச் செயப்படுபொருள் குறியீடல்ல.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: நேரடியான காலக் குறிப்பைத் துல்லியமாகத் தருகிறது.
- source_word: וְהָאֶחָד אֵינֶנּוּ
  choice: இன்னொருவன் இப்போது இல்லை
  rationale: சொல்லாட்சியின் மறைமுகத் தன்மையைக் காக்கிறது; அவன் காணாமல் போனானா அல்லது இறந்துவிட்டதாகக் கருதப்படுகிறானா என்பதைத் தீர்மானித்து விடவில்லை.
theological_decisions:
- issue: உறவுமுறையில் ஆண்பால் மொழி
  choice: ஒரே மனிதரின் மகன்கள்
  alternative: ஒரே மனிதரின் பிள்ளைகள்
  rationale: மூல எபிரெயம் ஆண்பாலில் உள்ளது; இக்கதையில் யாக்கோபின் மகன்களையே குறிப்பாகச் சுட்டுகிறது.
- issue: யோசேப்பின் நிலையைப் பற்றிய தெளிவின்மை
  choice: இன்னொருவன் இப்போது இல்லை
  alternative: இன்னொருவன் இறந்துவிட்டான்
  rationale: மூலத்தில் ‘ஒருவன் இல்லை’ என்ற மறைமுகமான சொற்றொடர் உள்ளது. மரணத்தை வெளிப்படையாகக் கூறாமல், இழப்பு அல்லது இல்லாமை என்ற உணர்வை அது தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை. யோசேப்பின் நிலை குறித்த மூலத்தின் மறைமுகத்தன்மை அடிக்குறிப்புடன் காக்கப்பட்டுள்ளது.
