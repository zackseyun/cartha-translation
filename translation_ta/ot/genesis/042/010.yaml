  register: நவீன நிலையான தமிழில், மரியாதையும் பணிவும் கொண்ட நேரடிப் பேச்சாக வடிவமைக்கப்பட்டது. ‘உமது’ மற்றும் ‘என் ஆண்டவரே’ சமூகப் படிநிலையைப் பேணுகின்றன; அதேவேளை வாக்கியம் சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான நடையில் உள்ளது.
