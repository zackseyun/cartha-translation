  text: וַ/יֹּאמְר֥וּ אֵלָ֖י/ו לֹ֣א אֲדֹנִ֑/י וַ/עֲבָדֶ֥י/ךָ בָּ֖אוּ לִ/שְׁבָּר אֹֽכֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/010.yaml
  text: But they said to him[a], “No, my lord; your servants have come to buy food.”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “இல்லை, என் ஆண்டவரே; உமது பணியாளர்களாகிய நாங்கள் உணவு வாங்குவதற்காக வந்திருக்கிறோம்” என்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தானியம் வாங்குவதற்கு.” எபிரெயத்தில் “உணவு வாங்க” என்று உள்ளது; பஞ்சத்தின் சூழலில் இங்கு குறிப்பிடப்படும் உணவு தானியமாக இருக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: அதற்கு அவர்கள் ... என்றார்கள்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுத்தாலும், முந்தைய குற்றச்சாட்டுக்கு இது மறுமொழி என்பதால், இயல்பான தமிழில் ‘அதற்கு’ என்று மொழிபெயர்க்கப்பட்டது. אֵלָיו குறிக்கும் மறுமொழியின் இலக்கு இந்த அமைப்பில் இயல்பாக வெளிப்படுகிறது.
- source_word: לֹא
  choice: இல்லை
  rationale: நேரடிப் பேச்சில் வலியுறுத்திய மறுப்பைக் காட்டும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: אֲדֹנִי
  choice: என் ஆண்டவரே
  rationale: எகிப்திய அதிகாரியிடம் காட்டப்படும் மரியாதையையும் சமூகப் படிநிலையையும் காக்கிறது; ‘ஐயா’ என்பதைவிட எபிரெயச் சொல்லின் பணிவான அழைப்புக்கு நெருக்கமானது.
- source_word: וַעֲבָדֶיךָ
  choice: உமது பணியாளர்களாகிய நாங்கள்
  rationale: இங்கு עֶבֶד அடிமை நிலையைக் கூறுவதற்குப் பதிலாக, அதிகாரியிடம் பேசும் பணிவான தற்குறிப்பாக உள்ளது. தமிழில் பேசுபவர்கள் தங்களையே குறிக்கிறார்கள் என்பதைத் தெளிவாகவும் இயல்பாகவும் காட்ட ‘நாங்கள்’ சேர்க்கப்பட்டது.
- source_word: בָּאוּ
  choice: வந்திருக்கிறோம்
  rationale: அவர்கள் வந்த நோக்கம் தற்போதைய உரையாடலுக்கும் நிலையுக்கும் தொடர்புடையதாக இருப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִשְׁבָּר
  choice: வாங்குவதற்காகவே
  rationale: பஞ்சம் மற்றும் எகிப்தின் உணவு வழங்கல் சூழலில் விலைக்கு வாங்குதல் என்பதே பொருள். குற்றச்சாட்டை மறுத்து தங்கள் உண்மையான நோக்கத்தை வலியுறுத்துவதால் ‘வே’ இயல்பாகப் பயன்படுத்தப்பட்டது.
- source_word: אֹכֶל
  choice: உணவு
  rationale: எபிரெயச் சொல் பொதுவாக உணவைக் குறிக்கிறது. சூழலில் தானியம் கருத்தில் இருந்தாலும், மூலத்தின் பரந்த சொல்லாட்சியை முதன்மை உரை காக்கிறது.
