translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ்க் கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர்ச்சியான செயல்கள் வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாக அமைக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையிலுள்ள அடிக்குறிப்புகள் இந்த எபிரெய வசனத்தில் உண்மையான உரை அல்லது பொருள் வேறுபாட்டைச் சுட்டாததால் சேர்க்கப்படவில்லை.
