base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/024.yaml
  text: He turned away from them and wept[a]. Then he returned to them and spoke to them[b], and he took Simeon from among them and bound him before their eyes.
translation:
  language: ta
  text: அவர் அவர்களைவிட்டு விலகி அழுதார். பிறகு அவர்களிடம் திரும்பிவந்து அவர்களோடு பேசினார். அவர்களிடையிலிருந்து சிமியோனைப் பிரித்தெடுத்து, அவர்கள் கண்முன்னே அவனைக் கட்டினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסֹּב מֵעֲלֵיהֶם
  choice: அவர் அவர்களைவிட்டு விலகி
  rationale: இந்தச் சொற்றொடர் அவர்களிடமிருந்து திரும்பி விலகுவதைச் சுட்டுகிறது. நவீன தமிழில் இயல்பாகவும், யோசேப்பு தனியாக அழுவதற்காக அவர்களது அருகிலிருந்து விலகியதையும் தெரிவிக்கிறது.
- source_word: וַיֵּבְךְּ
  choice: அழுதார்
  rationale: בכה என்பதன் நேரடியான கதைநடைப் பொருள் ‘அழுதல்’; தமிழில் இயல்பானதும் துல்லியமானதும் இதுவே.
- source_word: וַיָּשָׁב אֲלֵהֶם
  choice: அவர்களிடம் திரும்பிவந்து
  rationale: שוב என்பது திரும்பிவருதலைக் குறிக்கிறது; முந்தைய விலகலுக்குப் பின் நிகழ்ந்த செயலை இது தெளிவாகக் காட்டுகிறது.
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: அவர்களோடு பேசினார்
  rationale: דבר என்பதன் வழக்கமான பொருளான ‘பேசுதல்’ என்பதை இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּקַּח מֵאִתָּם אֶת שִׁמְעוֹן
  choice: அவர்களிடையிலிருந்து சிமியோனைப் பிடித்து
  rationale: מֵאִתָּם என்பது சகோதரர்களின் கூட்டத்திலிருந்து சிமியோன் தனியே எடுக்கப்பட்டதைத் தெரிவிக்கிறது. இச்சூழலில் ‘பிடித்து’ என்பது அடுத்துவரும் கட்டிவைத்த செயலோடு இயல்பாக இணைகிறது.
- source_word: וַיֶּאֱסֹר אֹתוֹ
  choice: அவனைக் கட்டினார்
  rationale: אסר இங்கு உடலால் கட்டுப்படுத்தும்படி கட்டுவதைக் குறிக்கிறது; ‘சிறையில் அடைத்தார்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத விளக்கத்தைச் சேர்த்துவிடும்.
- source_word: לְעֵינֵיהֶם
  choice: அவர்கள் கண்முன்னே
  rationale: ‘அவர்களுடைய கண்களுக்கு முன்பாக’ என்ற எபிரெய உருவகத்தின் தெளிவையும், அந்தச் செயல் அவர்கள் பார்க்கும்படி நடந்ததையும் இயல்பான தமிழில் பாதுகாக்கிறது.
