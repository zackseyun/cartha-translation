base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/007.yaml
  text: When Joseph saw his brothers[a], he recognized them, but he acted like a stranger toward them and spoke harshly with them. He said to them, “Where have you come from?” And they said, “From the land of Canaan[b], to buy food.”
translation:
  language: ta
  text: யோசேப்பு தன் சகோதரர்களைக் கண்டபோது, அவர்களை அடையாளம் கண்டுகொண்டான். ஆனால் அவர்களிடம் தன்னை அந்நியனைப்போல் காட்டிக்கொண்டு[a], அவர்களோடு கடுமையாகப் பேசினான். அவன் அவர்களிடம், “நீங்கள் எங்கிருந்து வந்தீர்கள்?” என்று கேட்டான். அதற்கு அவர்கள், “கானான் நாட்டிலிருந்து உணவு வாங்க வந்தோம்[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன்னை அவர்களுக்கு அடையாளம் தெரியாதபடி செய்துகொண்டு.” எபிரெயச் சொல், அவர்களிடம் தன்னை அந்நியனாக அல்லது அறியாதவனாகக் காட்டுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தானியம் வாங்க.” பஞ்சத்தின் இச்சூழலில் எபிரெய வினைச்சொல் குறிப்பாகத் தானியம் வாங்குவதைக் குறிக்கக்கூடும்; ஆனால் இங்குள்ள பெயர்ச்சொல் பொதுவாக “உணவு” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא יוֹסֵף אֶת־אֶחָיו
  choice: யோசேப்பு தன் சகோதரர்களைக் கண்டபோது
  rationale: தொடர்கதை அமைப்பிலுள்ள வாவ் வடிவத்தை இயல்பான தமிழ் காலத் தொடர்பாகக் கொடுத்து, அடுத்த செயலை நோக்கிச் செலுத்துகிறது.
- source_word: וַיַּכִּרֵם
  choice: அவர்களை அடையாளம் கண்டுகொண்டான்
  rationale: נכר என்பதன் ஹிஃபில் வடிவம் இங்கு ஒருவரை அடையாளம் காணுதல் என்பதைக் குறிக்கிறது.
- source_word: וַיִּתְנַכֵּר אֲלֵיהֶם
  choice: அவர்களிடம் தன்னை அந்நியன்போல் காட்டிக்கொண்டு
  rationale: ஹித்பயேல் வடிவம் அவர்களுடனான உறவில் தன்னை அறியாதவன் அல்லது அந்நியன் போல வெளிப்படுத்தியதைச் சுட்டுகிறது; உடல் வேடமாற்றத்தைத் தேவையின்றி குறிப்பதில்லை.
- source_word: וַיְדַבֵּר אִתָּם קָשׁוֹת
  choice: அவர்களோடு கடுமையாகப் பேசினான்
  rationale: קָשׁוֹת பேச்சின் கடுமையான விதத்தை விவரிக்கிறது; இந்தத் தமிழ் சொற்றொடர் இயல்பாகவும் மூலத்தின் தீவிரத்தோடும் உள்ளது.
- source_word: מֵאַיִן בָּאתֶם
  choice: நீங்கள் எங்கிருந்து வருகிறீர்கள்?
  rationale: வந்த இடத்தை விசாரிக்கும் கேள்வியை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מֵאֶרֶץ כְּנַעַן
  choice: கானான் நாட்டிலிருந்து
  rationale: אֶרֶץ כְּנַעַן என்ற புவியியல் தொடரின் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לִשְׁבָּר אֹכֶל
  choice: உணவு வாங்குவதற்காக
  rationale: שבר பஞ்சச் சூழலில் தானியம் வாங்குவதைக் குறிக்கக்கூடும்; ஆனால் אֹכֶל என்ற பெயர்ச்சொல் பொதுவாக உணவு என்பதால் பிரதான உரையில் அதையே வைத்திருக்கிறது.
