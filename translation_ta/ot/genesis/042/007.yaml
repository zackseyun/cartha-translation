translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூல எபிரெயத்தின் உறவுசார் அந்நியப்படுத்தல் என்ற நுட்பமும் ‘உணவு/தானியம்’ என்ற சொற்பொருள் விரிவும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
