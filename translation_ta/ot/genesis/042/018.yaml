  yaml_path: translation/ot/genesis/042/018.yaml
  text: On the third day Joseph said to them[a], “Do this and live, for I fear God.
translation:
  language: ta
  text: மூன்றாம் நாளில் யோசேப்பு அவர்களிடம், “இதைச் செய்யுங்கள்; உயிர்வாழுங்கள்[a]. நான் கடவுளுக்குப் பயப்படுகிறவன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதைச் செய்யுங்கள்; அப்பொழுது உயிர்வாழ்வீர்கள்.” எபிரெய மொழியில் இது நேரடியான இரு கட்டளைகளாகவோ, முதல் கட்டளையைப் பின்பற்றுவதன் விளைவாகவோ புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יוֹסֵף
  choice: யோசேப்பு அவர்களிடம் … என்றான்
  rationale: எபிரெய வழக்கில் நேர்கூற்றை அறிமுகப்படுத்தும் இயல்பான சொற்றொடர்; நவீன தமிழில் பெயரை முதலில் வைத்து, ‘அவர்களிடம் … என்றான்’ என வழங்குவது இயல்பாக உள்ளது.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: மூன்றாம் நாளில்
  rationale: காலத்தைக் குறிக்கும் எபிரெயத் தொடரின் நேர்த்தியான, இயல்பான தமிழ் வடிவம்.
- source_word: זֹאת עֲשׂוּ
  choice: இதைச் செய்யுங்கள்
  rationale: சுட்டுப்பெயரும் பன்மை ஏவல்வினையும் தெளிவாகப் பாதுகாக்கப்படுகின்றன.
- source_word: וִחְיוּ
  choice: உயிர்வாழுங்கள்
  rationale: ஏவல்வினை வடிவத்தைப் பாதுகாக்கிறது; முந்தைய கட்டளையைப் பின்பற்றினால் அவர்கள் உயிர் காக்கப்படும் என்ற விளைவுப் பொருளும் சூழலில் ஒலிக்கிறது.
- source_word: אֶת הָאֱלֹהִים
  choice: கடவுளுக்கு
  rationale: இங்கு הָאֱלֹהִים ஒரே கடவுளைக் குறிக்கிறது. தமிழ் ‘பயப்படு’ என்பதோடு நோக்குப் பொருளைக் குறிக்க ‘-க்கு’ இயல்பாக அமைகிறது.
- source_word: אֲנִי יָרֵא
  choice: நான் … பயப்படுகிறவன்
  rationale: வெளிப்படையான ‘நான்’ என்பதையும், எபிரெயப் பங்கேற்புவினை உணர்த்தும் நிலையான பண்பையும் பாதுகாக்கிறது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
theological_decisions:
- issue: אֶת הָאֱלֹהִים אֲנִי יָרֵא என்ற யோசேப்பின் அறிக்கையின் பொருள்
  choice: யோசேப்பு கடவுளுக்குப் பயப்படுகிறவன் என்று கூறி, தனது நடவடிக்கைக்கு அறநெறி அடிப்படையைக் காட்டுகிறான்.
  alternative: எகிப்திய அரசவையின் சூழலில் பொதுவான தெய்வபக்தியை மட்டும் யோசேப்பு குறிப்பிடுகிறான்.
  rationale: ஆதியாகமத்தின் விரிந்த கதைக்களம் யோசேப்பைத் தனது முன்னோர்களின் கடவுளை அறிந்தவனாகச் சித்தரிக்கிறது. எனினும் விளக்கத்தை வசனத்துக்குள் சேர்க்காமல், மூலத்தின் சுருக்கத்தையும் இறையியல் அழுத்தத்தையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உயிர்வாழுங்கள்’ மூலத்தின் ஏவல்வினை வடிவத்தை வைத்திருக்கிறது; அடிக்குறிப்பு அதன் விளைவுப் பொருளையும் பதிவு செய்கிறது. ‘பயப்படுகிறவன்’ என்பது வெறும் அச்சத்தை மட்டுமல்லாமல் நீடித்த இறைபயத்தையும் உணர்த்துகிறது.
