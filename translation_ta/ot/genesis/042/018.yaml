review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the temporal setting, Joseph's speech, the plural imperatives, and Joseph's declaration of fearing God. However, «ஏனெனில்» supplies an explicit causal connection not marked by a causal particle in the Hebrew; the Hebrew juxtaposes the clauses. Removing it better preserves the source's concise syntax and leaves the pragmatic relationship unforced.
  naturalness: «மூன்றாம் நாளில் யோசேப்பு அவர்களிடம் … என்றான்» and «இதைச் செய்யுங்கள்; உயிர்வாழுங்கள்» are clear, idiomatic modern standard Tamil. «நான் கடவுளுக்குப் பயப்படுகிறவன்» is natural and appropriately conveys the ongoing/characteristic sense of the Hebrew participle.
  terminology: «யோசேப்பு» is an established Tamil biblical name form. «கடவுள்» appropriately renders הָאֱלֹהִים here, and «கடவுளுக்குப் பயப்படுகிறவன்» preserves the reverential ‘fear God’ expression without importing further interpretation.
  issues:
  - severity: low
    issue: Explicit causal connective «ஏனெனில்»
    rationale: The Hebrew reads literally, “Do this and live; God I fear,” without a conjunction equivalent to “for/because.” Although an explanatory relation is plausible in context and reflected in the English audit trail, Tamil need not make it explicit. Juxtaposition more closely preserves the source syntax and its slight ambiguity.
  revised_text: மூன்றாம் நாளில் யோசேப்பு அவர்களிடம், “இதைச் செய்யுங்கள்; உயிர்வாழுங்கள்[a]. நான் கடவுளுக்குப் பயப்படுகிறவன்” என்றான்.
