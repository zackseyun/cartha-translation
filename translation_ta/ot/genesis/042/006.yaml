base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/006.yaml
  text: Joseph was the ruler over the land; he was the one who sold grain to all the people of the land[a]. And Joseph’s brothers came and bowed down to him with their faces to the ground.
translation:
  language: ta
  text: யோசேப்பு அந்த நாட்டின் ஆட்சியாளராக இருந்தார்; நாட்டின் மக்கள் அனைவருக்கும் தானியத்தை விற்றவர் அவரே. யோசேப்பின் சகோதரர்கள் வந்து, முகம் தரையில் படும்படி அவர்முன் பணிந்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்முன் தரையில் விழுந்து வணங்கினார்கள்.” எபிரெய வினைச்சொல், ஆழமாகக் குனிவதையோ மரியாதை செலுத்தும் விதத்தில் தரையில் விழுந்து பணிவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׁלִּיט
  choice: ஆட்சியாளர்
  rationale: அதிகாரத்தையும் ஆளுகையையும் செலுத்துபவரைக் குறிக்கிறது. குறிப்பிட்ட பதவிப் பெயரை ஊகிக்காமல், யோசேப்பின் நிர்வாக அதிகாரத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: עַל הָאָרֶץ
  choice: அந்த நாட்டின்
  rationale: இங்கு אֶרֶץ உலகம் முழுவதையும் அல்ல, சூழலில் குறிப்பிடப்படும் எகிப்து நாட்டைக் குறிக்கிறது. தமிழ் உரைநடையில் ‘அந்த நாட்டின் ஆட்சியாளர்’ இயல்பாக உள்ளது.
- source_word: הַמַּשְׁבִּיר
  choice: தானியத்தை விற்றவர்
  rationale: பஞ்சச் சூழலில் שׁבר என்பதன் ஹிஃபில் வடிவம் தானியத்தை விற்பதைக் குறிக்கிறது; சூழலில் மறைந்துள்ள பொருளை ‘தானியம்’ என்று வெளிப்படுத்துவது தெளிவளிக்கிறது.
- source_word: לְכָל עַם הָאָרֶץ
  choice: நாட்டின் மக்கள் அனைவருக்கும்
  rationale: עַם கூட்டுப்பொருள் ஒருமையாக ‘மக்கள்’ எனவும், הָאָרֶץ இச்சூழலில் உள்ளூர் நாட்டைக் குறிக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲחֵי יוֹסֵף
  choice: யோசேப்பின் சகோதரர்கள்
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான தமிழ் உடைமைத் தொடராகத் தருகிறது.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: அவர்முன் பணிந்தார்கள்
  rationale: שׁחה ஆழ்ந்து குனிதல் அல்லது தரையில் விழுந்து மரியாதை செலுத்துதல் ஆகியவற்றைக் குறிக்கலாம். இங்கு வழிபாடு என்ற சமயப் பொருளைத் திணிக்காமல் சமூக மரியாதையையும் கீழ்ப்படிதலையும் தெரிவிக்க ‘பணிந்தார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אַפַּיִם אָרְצָה
  choice: முகம் தரையில் படும்படி
  rationale: இச்சொற்றொடர் முகம் நிலத்தை நோக்கிய முழுமையான பணிவான உடல்நிலையைச் சித்தரிக்கிறது; சொற்சொல்லான ‘மூக்குத்துளைகள் நிலத்தை நோக்கி’ என்பதற்குப் பதிலாக இயல்பாகவும் தெளிவாகவும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְ
  choice: தனி முன்னிலை இணைப்புச் சொல் சேர்க்கப்படவில்லை
  rationale: வசனத்தின் தொடக்க וְ கதைத் தொடரை முன்னெடுக்கிறது. தமிழில் கட்டாயமற்ற ‘இப்போது’ அல்லது ‘மேலும்’ என்பவற்றைச் சேர்க்காமல் நேரடியாகத் தொடங்குவது இயல்பானது.
theological_decisions:
- issue: யோசேப்பின் சகோதரர்கள் அவருக்குச் செய்த செயலை எவ்வாறு மொழிபெயர்ப்பது
  choice: முகம் தரையில் படும்படி அவர்முன் பணிந்தார்கள்
  alternative: அவரை வழிபட்டார்கள் / அவர்முன் தரையில் விழுந்தார்கள்
  rationale: இக்காட்சி யோசேப்பின் முந்தைய கனவுகளுடன் தொடர்புடைய சமூகப் பணிவையும் மரியாதையையும் காட்டுகிறது; தெய்வ வழிபாட்டைத் தெளிவாகக் கூறவில்லை. தேர்ந்தெடுத்த மொழிபெயர்ப்பு உடல் நிலையையும் மரியாதைச் செயலையும் காக்கிறது; சமய வழிபாடு என்ற பொருளைத் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆட்சியாளர்,’ ‘தானியம்,’ ‘பணிந்தார்கள்’ ஆகிய சொற்கள் தேவையற்ற அலுவல் அல்லது சமயச் சிறப்புப் பொருள்களைத் தவிர்த்து மூலத்தின் பொருளைத் தெளிவாகக் கொண்டுவருகின்றன. அடிக்குறிப்பு குறியீடு அதற்குரிய பணிதல் தொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
