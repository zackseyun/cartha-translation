  text: And we said to him[a], ‘We are honest men[b]; we have not been spies.’
translation:
  language: ta
  text: நாங்கள் அவனிடம், “நாங்கள் நேர்மையானவர்கள்[a]; நாங்கள் உளவாளிகளாக இருக்கவில்லை[b]” என்று சொன்னோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாங்கள் நேர்மையுள்ளவர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நாங்கள் உளவு பார்க்கவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: என்று சொன்னோம்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரைத் தமிழில் இயல்பான நேரடிக் கூற்று அமைப்புடன் வெளிப்படுத்துகிறது. வசனத்தின் தொடக்கத்தில் வரும் இணைப்பைத் தனியாக மொழிபெயர்க்காமல், தொடர்ச்சியான சூழலில் இயல்பாக எடுத்துரைக்கிறது.
- source_word: אֵלָיו
  choice: அவனிடம்
  rationale: אֶל என்ற முன்னிடைச்சொல்லும் மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டும் சேர்ந்து ‘அவனிடம்’ அல்லது ‘அவனுக்கு’ என்று பொருள்படும்; பேச்சுச் சூழலில் ‘அவனிடம்’ இயல்பானது.
- source_word: כֵּנִים
  choice: நேர்மையானவர்கள்
  rationale: குற்றச்சாட்டுக்கு எதிரான சகோதரர்களின் தற்காப்பில், இச்சொல் நம்பத்தகுந்த, கபடமற்ற மனிதர்களைக் குறிக்கிறது. ‘நேர்மையானவர்கள்’ என்பது தெளிவான நவீனத் தமிழ்; ‘உண்மையுள்ளவர்கள்’ என்பதும் சாத்தியம்.
- source_word: אֲנָחְנוּ
  choice: நாங்கள்
  rationale: தனிநிலைப் பதிலிப்பெயர் வலியுறுத்தலைக் கொண்டுள்ளது; தமிழில் வெளிப்படையான ‘நாங்கள்’ அதை இயல்பாகத் தக்கவைக்கிறது.
- source_word: לֹא הָיִינוּ
  choice: இருந்ததில்லை
  rationale: மறுக்கப்பட்ட இறந்தகால நிலை அல்லது தொடர்ந்த செயற்பாட்டை வெளிப்படுத்துகிறது. ‘இருந்ததில்லை’ என்பது அவர்கள் உளவாளிகளாக இருந்தனர் என்ற குற்றச்சாட்டை மறுக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: מְרַגְּלִים
  choice: உளவாளிகள்
  rationale: רגל வேரிலிருந்து வந்த பன்மைப் பங்கேற்பு வடிவம் இச்சூழலில் உளவு பார்ப்பவர்களைக் குறிக்கிறது; நவீனத் தமிழில் ‘உளவாளிகள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
