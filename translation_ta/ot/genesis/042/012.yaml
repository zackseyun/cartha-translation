translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு புரியும் dignified நேரடி உரை. ‘நாட்டின் நிர்வாணம்’ என்ற எபிரெய உருவகம் விளக்கமாக மாற்றப்படாமல் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் சூழற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
