source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֲלֵ/הֶ֑ם לֹ֕א כִּֽי עֶרְוַ֥ת הָ/אָ֖רֶץ בָּאתֶ֥ם לִ/רְאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/012.yaml
  text: But he said to them[a], “No[b], but you have come to see the nakedness of the land.”
translation:
  language: ta
  text: ஆனால் அவன் அவர்களிடம், “இல்லை; நாட்டின் நிர்வாணத்தை[a]ப் பார்க்கத்தான்[b] நீங்கள் வந்திருக்கிறீர்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாட்டின் வெளிப்பட்ட பகுதிகளை’ அல்லது ‘நாட்டின் பாதுகாப்பற்ற பகுதிகளை.’ எபிரெயத்தில் சொல்லுக்குச் சொல் ‘நாட்டின் நிர்வாணம்’ என்று உள்ளது. பகைவர்களோ உளவாளிகளோ பயன்படுத்திக்கொள்ளக்கூடிய பலவீனமான இடங்களைக் குறிக்கும் உருவகம் இது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உளவு பார்க்கத்தான்.’ எபிரெய வினை சொல்லுக்குச் சொல் ‘பார்க்க’ என்று பொருள்படும்; ஆனால் இச்சூழலில் அவர்கள் வேவு பார்க்க வந்ததாக யோசேப்பு குற்றஞ்சாட்டுகிறான்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: ஆனால் அவன் அவர்களிடம் … என்றான்
  rationale: தொடர்கதை அமைப்பிலுள்ள וַ־ நிகழ்வை முன்னெடுத்தாலும், முந்தைய வசனத்தில் சகோதரர்கள் கூறிய மறுப்புக்கு எதிரான பதில் என்பதால் ‘ஆனால்’ இயல்பாக உள்ளது. אֲלֵהֶם என்பது ‘அவர்களிடம்’ என்று வழங்கப்பட்டுள்ளது.
- source_word: לֹא כִּי
  choice: இல்லை; … பார்க்கத்தான்
  rationale: לֹא அவர்களுடைய கூற்றைத் திடமாக மறுக்கிறது; இங்கு כִּי திருத்தி வலியுறுத்தும் குற்றச்சாட்டை அறிமுகப்படுத்துகிறது. தமிழில் அரைப்புள்ளியும் ‘-த்தான்’ வலியுறுத்தலும் அந்த எதிர்மறைத் திருத்தத்தை இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: עֶרְוַת הָאָרֶץ
  choice: நாட்டின் நிர்வாணத்தை
  rationale: עֶרְוָה என்பதன் நேர்ப்பொருளான ‘நிர்வாணம்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; இச்சூழலில் அது நாட்டின் வெளிப்பட்ட அல்லது பாதுகாப்பற்ற பகுதிகளைக் குறிக்கிறது. הָאָרֶץ இங்கு எகிப்தின் ஆட்சிப்பரப்பைக் குறிப்பதால் ‘நாடு’ இயல்பான தேர்வு.
- source_word: בָּאתֶם
  choice: நீங்கள் வந்திருக்கிறீர்கள்
  rationale: அவர்கள் வந்ததன் தற்போதைய தொடர்பையும் யோசேப்பின் நேரடி குற்றச்சாட்டையும் தமிழ் நிகழ்கால நிறைவுவினை இயல்பாகக் காட்டுகிறது.
- source_word: לִרְאוֹת
  choice: பார்க்க
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘பார்/காண்.’ உளவு பார்ப்பது சூழலால் உணரப்பட்டாலும், எபிரெய மூலத்தில் வழக்கமான ‘உளவு பார்’ என்ற வினை பயன்படுத்தப்படவில்லை; எனவே மூலத்தின் சொல் தேர்வும் அதன் மறைபொருளும் பாதுகாக்கப்படுகின்றன.
