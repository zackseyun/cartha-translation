  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אֶת בִּנְיָמִין֙ אֲחִ֣י יוֹסֵ֔ף לֹא שָׁלַ֥ח יַעֲקֹ֖ב אֶת אֶחָ֑י/ו כִּ֣י אָמַ֔ר פֶּן יִקְרָאֶ֖/נּוּ אָסֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/004.yaml
  text: But Jacob did not send Benjamin[a], Joseph’s brother, with his brothers, for he said, “Lest harm happen to him.”
translation:
  language: ta
  text: ஆனால் யாக்கோபு, யோசேப்பின் சகோதரனான பென்யமீனை அவனுடைய சகோதரர்களுடன் அனுப்பவில்லை. ஏனெனில், “ஒருவேளை அவனுக்குத் தீங்கு நேரிடலாம்[a]” என்று அவன் சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவேளை அவனுக்குப் பேராபத்து நேரிடலாம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: ஆனால்
  rationale: וְ முந்தைய வசனத்துடன் இணைத்தாலும், மற்ற சகோதரர்கள் சென்ற நிலையில் பென்யமீன் அனுப்பப்படாத முரண்பாட்டைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘ஆனால்’ தேர்ந்தெடுக்கப்பட்டது; אֶת தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: בִּנְיָמִין
  choice: பென்யமீன்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: אֲחִי יוֹסֵף
  choice: யோசேப்பின் சகோதரனான
  rationale: பென்யமீனை யோசேப்புடனான உறவால் அடையாளப்படுத்தும் எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: לֹא שָׁלַח
  choice: அனுப்பவில்லை
  rationale: שׁלח என்பதன் வழக்கமான பொருளான ‘அனுப்பு’ என்பதையும் நிறைவுற்ற எபிரெயக் கதைநடையையும் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: אֶת אֶחָיו
  choice: அவனுடைய சகோதரர்களுடன்
  rationale: இங்கு பென்யமீன் மற்ற சகோதரர்களோடு சேர்த்து அனுப்பப்படவில்லை என்பதே பொருள்; அதனைத் தமிழில் தேவையான உடனிகழ்ச்சிப் பொருளுடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי אָמַר
  choice: ஏனெனில் … என்று அவன் சொன்னான்
  rationale: כִּי காரணத்தைக் குறிப்பிடுகிறது; אָמַר என்பதை ‘நினைத்தான்’ என்று விளக்காமல், நேரடியாக ‘சொன்னான்’ என மொழிபெயர்க்கிறது.
- source_word: פֶּן
  choice: ஒருவேளை … நேரிடலாம்
  rationale: அஞ்சப்படும் சாத்தியத்தை அறிமுகப்படுத்தும் פֶּן என்பதன் நுணுக்கத்தை நவீன தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: יִקְרָאֶנּוּ
  choice: அவனுக்கு … நேரிடலாம்
  rationale: אָסוֹן உடன் வரும் எபிரெயச் சொற்றொடரின் ‘அவனுக்கு நிகழலாம்/நேரிடலாம்’ என்ற பொருளை இயல்பாக வழங்குகிறது.
- source_word: אָסוֹן
  choice: தீங்கு
  rationale: குறிப்பிட்ட வகையைக் கட்டாயப்படுத்தாமல், கடுமையான கேடு, விபத்து அல்லது துரதிர்ஷ்டம் என்ற சொல்லின் பரந்த பொருளைத் தக்கவைக்கிறது.
