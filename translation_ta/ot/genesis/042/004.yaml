translation_notes:
  register: நவீன தரநிலைத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒருவேளை … நேரிடலாம்’ என்பது யாக்கோபின் அச்சத்தை இயல்பாகத் தெரிவிக்கிறது; தீங்கின் தன்மையை மூலத்தைவிடக் குறிப்பாக வரையறுக்கவில்லை.
