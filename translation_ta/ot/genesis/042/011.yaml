language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כֻּלָּ֕/נוּ בְּנֵ֥י אִישׁ אֶחָ֖ד נָ֑חְנוּ כֵּנִ֣ים אֲנַ֔חְנוּ לֹא הָי֥וּ עֲבָדֶ֖י/ךָ מְרַגְּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/011.yaml
  text: We are all sons of one man[a]. We are honest[b]; your servants have not been spies.
translation:
  language: ta
  text: நாங்கள் அனைவரும் ஒரே மனிதரின் மகன்கள். நாங்கள் நேர்மையானவர்கள்[a]; உங்கள் அடியார்களாகிய நாங்கள் உளவாளிகளாக இருந்ததில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘உண்மையுள்ளவர்கள்’ அல்லது ‘நம்பத்தகுந்தவர்கள்.’ உளவு பார்த்ததாகச் சாட்டப்பட்ட குற்றச்சாட்டுக்கு மாறாக, அவர்கள் நம்பத்தகுந்தவர்களும் உள்ளத்தில் உண்மையானவர்களும் என்பதை எபிரெயச் சொல் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘உங்கள் அடியார்கள் உளவாளிகள் அல்ல’ அல்லது ‘உங்கள் அடியார்கள் உளவாளிகளாக இருக்கவில்லை.’ எபிரெய இலக்கண அமைப்பைத் தமிழில் இவ்வாறும் இயல்பாகக் கூறலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּנוּ
  choice: நாங்கள் அனைவரும்
  rationale: பேசுகிற சகோதரர்கள் முழுக் குழுவையும் குறிக்கும் எபிரெயச் சொல்லின் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: ஒரே மனிதரின் மகன்கள்
  rationale: ‘ஒரே மனிதனின் மகன்கள்’ என்ற மூலப்பொருளைப் பாதுகாக்கிறது; இங்கு ஆண் சகோதரர்களே குறிப்பிடப்படுவதால் ‘மகன்கள்’ எனத் துல்லியமாக மொழிபெயர்க்கப்படுகிறது.
- source_word: נָחְנוּ / אֲנַחְנוּ
  choice: நாங்கள்
  rationale: இரண்டு தனிப்பட்ட பதிலிடுபெயர்களிலும் உள்ள வலியுறுத்தலை, அடுத்தடுத்த வாக்கியங்களில் ‘நாங்கள்’ என்பதை வெளிப்படையாகக் கூறுவதன் மூலம் தக்கவைக்கிறது.
- source_word: כֵּנִים
  choice: நேர்மையானவர்கள்
  rationale: உளவு பார்த்ததாகச் சாட்டப்பட்ட குற்றச்சாட்டுக்கு மாறாக, தாங்கள் நம்பத்தகுந்தவர்களும் உண்மையுள்ளவர்களும் என்று அவர்கள் கூறுவதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: עֲבָדֶיךָ
  choice: உங்கள் அடியார்களாகிய நாங்கள்
  rationale: அரச அதிகாரியிடம் தாழ்மையுடன் தங்களைக் குறிப்பிடும் மரியாதை வழக்கை வெளிப்படுத்துகிறது; இங்கு அடிமை நிலையை வலியுறுத்தவில்லை.
- source_word: מְרַגְּלִים
  choice: உளவாளிகள்
  rationale: நாட்டை இரகசியமாக ஆராய வந்தவர்கள் என்ற குற்றச்சாட்டைத் தெளிவாகவும் வழக்கமான தமிழிலும் குறிக்கிறது.
- source_word: לֹא הָיוּ ... מְרַגְּלִים
  choice: உளவாளிகளாக இருந்ததில்லை
  rationale: היה உடன் வரும் தொழிற்பெயரின் நிலை அல்லது செயலை மறுக்கும் அமைப்பைத் தக்கவைத்து, அவர்கள் அவ்வாறு செயல்பட்டதே இல்லை என்ற மறுப்பை இயல்பாகத் தருகிறது.
