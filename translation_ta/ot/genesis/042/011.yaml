translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. அதிகாரியிடம் பேசும் சூழலுக்கேற்ற மரியாதைப் பன்மையாக ‘உங்கள்’ பயன்படுத்தப்பட்டுள்ளது; ‘அடியார்கள்’ என்பது அக்கால அரசவைக் கீழ்ப்படிதல் மொழிநடையைக் காட்டுகிறது.
