source:
  edition: WLC
  text: וַ/יַּעַן֩ רְאוּבֵ֨ן אֹתָ֜/ם לֵ/אמֹ֗ר הֲ/לוֹא֩ אָמַ֨רְתִּי אֲלֵי/כֶ֧ם לֵ/אמֹ֛ר אַל תֶּחֶטְא֥וּ בַ/יֶּ֖לֶד וְ/לֹ֣א שְׁמַעְתֶּ֑ם וְ/גַם דָּמ֖/וֹ הִנֵּ֥ה נִדְרָֽשׁ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/022.yaml
  text: Then Reuben answered them, saying, “Did I not tell you, ‘Do not sin against the boy’? But you did not listen. And now, look, his blood is being required.”
translation:
  language: ta
  text: 'ரூபன் அவர்களுக்குப் பதிலளித்துச் சொன்னான்: “அந்தப் பையனுக்கு எதிராகப் பாவம் செய்யாதீர்கள் என்று நான் உங்களிடம் சொல்லவில்லையா? ஆனால் நீங்கள் கேட்கவில்லை. இதோ, அவனுடைய இரத்தத்திற்கும் கணக்குக் கேட்கப்படுகிறது.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַיֶּלֶד
  choice: அந்தப் பையனுக்கு எதிராக
  rationale: בְּ இங்கு ஒருவருக்கு எதிராகச் செய்யப்படும் குற்றத்தைச் சுட்டுகிறது; יֶלֶד என்பதற்கு சூழலுக்கு ஏற்ற இயல்பான நவீனத் தமிழ் ‘பையன்’.
- source_word: דָּמוֹ
  choice: அவனுடைய இரத்தத்துக்கு
  rationale: மூலத்தின் இரத்தம் சார்ந்த நீதிப்பொறுப்பு உருவகத்தைத் தக்கவைக்கிறது; இதை ‘மரணம்’ அல்லது ‘கொலை’ என்று விளக்கி விரிவாக்கவில்லை.
- source_word: הִנֵּה
  choice: பாருங்கள்
  rationale: கவனத்தை ஈர்க்கும் உரையாடல் இடைச்சொல்லின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נִדְרָשׁ
  choice: கணக்குக் கேட்கப்படுகிறது
  rationale: דרש என்பதன் இங்கு உள்ள நீதிசார் பொருளான ‘பொறுப்புக் கோருதல்/கணக்குக் கேட்டல்’ என்பதைக் காட்டுகிறது; எபிரெய passive வடிவமும் காக்கப்படுகிறது.
theological_decisions:
- issue: ‘அவனுடைய இரத்தம் கேட்கப்படுகிறது’ என்ற நீதிசார் மொழி
  choice: அவனுடைய இரத்தத்துக்குக் கணக்குக் கேட்கப்படுகிறது
  alternative: அவனுடைய இரத்தத்திற்குப் பழிவாங்கப்படுகிறது
  rationale: மூலம் பழிவாங்குபவர் யார் என்பதையோ தண்டனையின் வடிவத்தையோ வெளிப்படையாகக் கூறவில்லை. ஆகவே தெய்வீக நீதியை மறுக்காமலும், குறிப்பிடப்படாத செய்பவரைச் சேர்க்காமலும் passive ambiguity தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், ஆனால் கண்ணியமான உரைநடை. ரூபனின் குற்றச்சாட்டு நேரடியாகவும், மூலத்தின் நீதிசார் பதற்றம் விளக்கிச் சீராக்கப்படாமலும் வைக்கப்பட்டுள்ளது.
