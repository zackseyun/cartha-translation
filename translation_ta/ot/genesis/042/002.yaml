source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר הִנֵּ֣ה שָׁמַ֔עְתִּי כִּ֥י יֶשׁ שֶׁ֖בֶר בְּ/מִצְרָ֑יִם רְדוּ שָׁ֨מָּ/ה֙ וְ/שִׁבְרוּ לָ֣/נוּ מִ/שָּׁ֔ם וְ/נִחְיֶ֖ה וְ/לֹ֥א נָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/002.yaml
  text: He said[a], “Look, I have heard that there is grain in Egypt. Go down there and buy some for us from there[b], so that we may live and not die.”
translation:
  language: ta
  text: அவர், “இதோ, எகிப்தில் தானியம் இருப்பதாகக் கேள்விப்பட்டேன். அங்கே இறங்கிச் சென்று, அங்கிருந்து நமக்காகத் தானியம் வாங்குங்கள்; நாம் உயிர்வாழவும் சாகாமல் இருக்கவும்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: அடுத்து சொல்லப்படுவதற்குக் கவனத்தை ஈர்க்கும் உரையாடல் இடைச்சொல்; நவீனத் தமிழிலும் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: שָׁמַעְתִּי
  choice: கேள்விப்பட்டேன்
  rationale: பெற்ற தகவல் இப்போதைய சூழலுக்குப் பொருந்துவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שֶׁבֶר
  choice: தானியம்
  rationale: பஞ்சம் நிலவும் இச்சூழலில் வாங்கக் கிடைக்கும் தானியத்தைக் குறிக்கிறது; பொதுவான ‘உணவு’ என்பதைவிட இது துல்லியமானது.
- source_word: רְדוּ
  choice: இறங்கிச் சென்று
  rationale: கானானிலிருந்து எகிப்துக்குச் செல்லும் பயணத்தை ‘இறங்குதல்’ எனக் குறிப்பிடும் எபிரெயத் திசைநுட்பத்தைப் பாதுகாக்கிறது.
- source_word: וְשִׁבְרוּ
  choice: தானியம் வாங்குங்கள்
  rationale: இச்சூழலில் வினைச்சொல் குறிப்பாகத் தானியம் வாங்குவதைக் குறிக்கிறது; தமிழில் பொருளை வெளிப்படையாகக் கூறுவது தெளிவாக உள்ளது.
- source_word: לָנוּ
  choice: நமக்காக
  rationale: பெறப்போகும் பயன் யாக்கோபின் குடும்பத்துக்குரியது என்பதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: மூலத்தில் வெளிப்படையாக உள்ள ‘அங்கிருந்து’ என்ற இடநீக்கப் பொருளைப் பாதுகாக்கிறது.
- source_word: וְנִחְיֶה וְלֹא נָמוּת
  choice: அப்போது நாம் உயிர்வாழ்வோம், சாகமாட்டோம்
  rationale: செயலின் நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவைத் தமிழில் இயல்பாகத் தெரிவிப்பதோடு, ‘வாழ்வது—சாகாதிருப்பது’ என்ற எபிரெய இணைப்பையும் பாதுகாக்கிறது.
