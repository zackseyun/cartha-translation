  register: நவீன நிலையான தமிழ்; குடும்பத் தலைவரின் அவசரமான கட்டளைக்கேற்ற நேரடியான, கண்ணியமான நடை. தேவையற்ற விளக்கவுரை சேர்க்கப்படவில்லை.
