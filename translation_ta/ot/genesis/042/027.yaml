translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. שַׂק மற்றும் אַמְתַּחַת என்ற இரு கொள்கலன் சொற்களுக்கிடையிலான வேறுபாட்டைக் காக்க முறையே ‘மூட்டை’, ‘பை’ என்று மொழிபெயர்க்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையின் [a] அடிக்குறிப்பு அதன் குறியீட்டு இடத்துடன் பொருந்தாததால், WLC மூலத்திலுள்ள בַּמָּלוֹן என்பதற்கான உண்மையான சொற்பொருள் விளக்கமாகத் திருத்தப்பட்டுள்ளது.
