source:
  edition: WLC
  text: וַ/יִּפְתַּ֨ח הָ/אֶחָ֜ד אֶת שַׂקּ֗/וֹ לָ/תֵ֥ת מִסְפּ֛וֹא לַ/חֲמֹר֖/וֹ בַּ/מָּל֑וֹן וַ/יַּרְא֙ אֶת כַּסְפּ֔/וֹ וְ/הִנֵּה ה֖וּא בְּ/פִ֥י אַמְתַּחְתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/027.yaml
  text: Then one of them opened his sack to give fodder to his donkey at the lodging place[a], and he saw his silver—and behold[b], it was in the mouth of his bag.
translation:
  language: ta
  text: அவர்களில் ஒருவன் தன் கழுதைக்குத் தீவனம் போடுவதற்காக, இரவு தங்கும் இடத்தில்[a] தன் மூட்டையைத் திறந்தான். அப்போது அவன் தன் வெள்ளியைக்[b] கண்டான்; இதோ, அது அவனுடைய பையின் வாயில் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, பயணத்தின்போது இரவு தங்கிய இடத்தில்; இது வணிக விடுதியைக் கட்டாயமாகக் குறிப்பதில்லை.
    reason: lexical_clarification
  - marker: b
    text: இங்கு ‘வெள்ளி’ என்பது அவன் செலுத்திய பணத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: திறந்தான்
  rationale: פתח என்பதன் நேரான பொருளான ‘திறத்தல்’ இயல்பான தமிழ் கதைநடையில் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָאֶחָד
  choice: அவர்களில் ஒருவன்
  rationale: சொல்லுக்குச் சொல் ‘அந்த ஒருவன்’ என்றாலும், சூழலில் யோசேப்பின் சகோதரர்களில் ஒருவனைக் குறிப்பதால் தமிழில் குறிப்பிடம் தெளிவாக இயல்பாக்கப்பட்டுள்ளது.
- source_word: שַׂקּוֹ
  choice: தன் மூட்டையை
  rationale: பயணத்தில் தானியத்தை எடுத்துச் செல்லும் பெரிய சாக்கைக் குறிக்க ‘மூட்டை’ இயல்பானது; பின்னர் வரும் אַמְתַּחַת என்பதற்கான ‘பை’ என்பதிலிருந்து வேறுபாடும் காக்கப்படுகிறது.
- source_word: לָתֵת מִסְפּוֹא
  choice: தீவனம் போடுவதற்காக
  rationale: மிருகத்துக்குத் தீனி கொடுப்பதை நவீனத் தமிழில் இயல்பாகச் சொல்லும் தொடர்; நோக்கத்தைக் குறிக்கும் எபிரெய அமைப்பையும் வெளிப்படுத்துகிறது.
- source_word: לַחֲמֹרוֹ
  choice: தன் கழுதைக்கு
  rationale: לְ குறிக்கும் பெறுநர் தெளிவாகவும் இயல்பாகவும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בַּמָּלוֹן
  choice: இரவு தங்கும் இடத்தில்
  rationale: מָלוֹן என்பது பயணத்தில் இரவு தங்கும் இடத்தையோ இடைநிறுத்தத்தையோ குறிக்கலாம்; ‘விடுதி’ என்று மொழிபெயர்த்து வணிகத் தங்குமிடத்தைத் தேவையின்றி உணர்த்துவது தவிர்க்கப்பட்டுள்ளது.
- source_word: וַיַּרְא אֶת־כַּסְפּוֹ
  choice: அவன் தன் வெள்ளியைக் கண்டான்
  rationale: כֶּסֶף என்பதன் ‘வெள்ளி’ என்ற பொருள் காக்கப்படுகிறது; இங்கு அது செலுத்திய பணத்தைக் குறிப்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: எதிர்பாராத கண்டுபிடிப்பையும் கதைநடையின் திடீர் கவன ஈர்ப்பையும் குறிக்கும் எபிரெய இடைச்சொல்லின் வலிமை காக்கப்படுகிறது.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: அவனுடைய பையின் வாயில்
  rationale: ஒரு கொள்கலனின் திறப்பை ‘வாய்’ என்று கூறும் எபிரெய உருவகம் தமிழிலும் புரியக்கூடியதும் இயல்பானதும் என்பதால் காக்கப்பட்டுள்ளது.
