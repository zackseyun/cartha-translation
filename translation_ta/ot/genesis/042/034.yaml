translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சின்ன சகோதரன்’ போன்ற பேச்சுவழக்கைத் தவிர்த்து ‘இளைய சகோதரன்’ என்றும், வணிக அனுமதியை இயல்பாகக் காட்ட ‘வணிகம் செய்யலாம்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது. மேற்கோளுக்குப் பிந்தைய ‘என்றார்’ வசனத்தின் விரிந்த உரையாடல் அமைப்பைத் தமிழில் நிறைவு செய்கிறது.
