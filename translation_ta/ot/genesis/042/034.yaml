  text: וְ֠/הָבִיאוּ אֶת אֲחִי/כֶ֣ם הַ/קָּטֹן֮ אֵלַ/י֒ וְ/אֵֽדְעָ֗ה כִּ֣י לֹ֤א מְרַגְּלִים֙ אַתֶּ֔ם כִּ֥י כֵנִ֖ים אַתֶּ֑ם אֶת אֲחִי/כֶם֙ אֶתֵּ֣ן לָ/כֶ֔ם וְ/אֶת הָ/אָ֖רֶץ תִּסְחָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/034.yaml
  text: Bring your youngest brother to me[a], so that I may know that you are not spies, but honest men. Then I will give your brother back to you, and you may trade in the land.”
translation:
  language: ta
  text: ‘உங்கள் எல்லாரிலும் இளைய சகோதரனை என்னிடம் அழைத்து வாருங்கள். அப்போது நீங்கள் உளவாளிகள் அல்ல, நேர்மையானவர்கள் என்று நான் அறிந்துகொள்வேன். உங்கள் சகோதரனை உங்களிடம் திருப்பி ஒப்படைப்பேன்; நீங்கள் இந்த நாட்டில் வணிகம் செய்யலாம்[a]’ என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் இந்த நாட்டில் சுற்றித் திரியலாம்.” எபிரெய வினைச்சொல் ஓரிடத்திலிருந்து மற்றோர் இடத்திற்குச் செல்வதை விரிவாகக் குறிக்கக்கூடும்; எனினும், இச்சூழலில் “வணிகம் செய்யலாம்” என்ற பொருள் சிறப்பாகப் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָבִיאוּ
  choice: அழைத்து வாருங்கள்
  rationale: בוא என்பதன் ஹிஃபில் கட்டளை வடிவம் ஒருவரை அழைத்து வருவதைக் குறிக்கிறது; நவீன தமிழில் இயல்பான கட்டளைத் தொடர்.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: உங்கள் இளைய சகோதரனை
  rationale: הַקָּטֹן உடன்பிறந்தவரைக் குறிக்கும் இச்சூழலில் வயதில் இளையவனைச் சுட்டுகிறது. ‘இளைய சகோதரன்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; அவன் அனைவரிலும் இளையவன் என்பது விரிந்த சூழலில் தெளிவாகிறது.
- source_word: וְאֵדְעָה
  choice: அப்போது … நான் அறிந்துகொள்வேன்
  rationale: கட்டளைக்குப் பின் வரும் cohortative வடிவம் எதிர்பார்க்கப்படும் விளைவை வெளிப்படுத்துகிறது; ‘அப்போது’ அந்த உரையாடல் ஓட்டத்தை இயல்பாகக் காட்டுகிறது.
- source_word: מְרַגְּלִים
  choice: உளவாளிகள்
  rationale: இங்கு இந்தப் பன்மைச் சொல் நாட்டை வேவுபார்க்க வந்தவர்கள் என்ற குற்றச்சாட்டைக் குறிக்கிறது; ‘உளவாளிகள்’ நவீன தமிழில் நேரடியான இணைச்சொல்.
- source_word: כֵנִים
  choice: நேர்மையானவர்கள்
  rationale: כֵנִים இங்கு உண்மையுள்ள, நம்பத்தகுந்த மனிதர்கள் என்ற பொருளில் ‘உளவாளிகள்’ என்பதற்கு எதிராக நிற்கிறது.
- source_word: אֶת אֲחִיכֶם אֶתֵּן לָכֶם
  choice: உங்கள் சகோதரனை உங்களிடம் திருப்பி ஒப்படைப்பேன்
  rationale: எபிரெயத்தில் நேரடியாக ‘உங்கள் சகோதரனை உங்களுக்குக் கொடுப்பேன்’ என்றாலும், காவலில் வைக்கப்பட்ட சகோதரனை மீண்டும் அவர்களிடம் ஒப்படைப்பதே சூழலின் பொருள்; ‘திருப்பி ஒப்படைப்பேன்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְאֶת הָאָרֶץ תִּסְחָרוּ
  choice: நீங்கள் இந்த நாட்டில் வணிகம் செய்யலாம்
  rationale: סחר என்பதன் வணிகப் பொருள் பஞ்சகாலத்தில் தானியம் வாங்க வந்த சூழலுக்கு நன்கு பொருந்துகிறது. வினைச்சொல் சுற்றித் திரிதல் என்ற விரிவான பொருளையும் ஏற்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
