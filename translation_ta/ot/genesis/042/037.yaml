base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/037.yaml
  text: Then Reuben said to his father[a], “You may put my two sons to death if I do not bring him back to you. Put him in my hand, and I myself will bring him back to you.”
translation:
  language: ta
  text: அப்போது ரூபன் தன் தந்தையிடம், “நான் அவனை உங்களிடம் திரும்பக் கொண்டுவராவிட்டால், என் இரண்டு மகன்களையும் கொன்றுவிடுங்கள். அவனை என் கையில் ஒப்படையுங்கள்[a]; நானே அவனை உங்களிடம் திரும்பக் கொண்டுவருவேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, “அவனை என் பொறுப்பில் விடுங்கள்.” எபிரெயத்தில், “அவனை என் கையில் கொடுங்கள்.”
    reason: எபிரெயச் சொற்றொடரின் கை உருவகத்தையும் அதன் பொறுப்பேற்றல் என்ற வழக்குப் பொருளையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר רְאוּבֵן אֶל־אָבִיו
  choice: அப்போது ரூபன் தன் தந்தையிடம் ... என்றான்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னேற்றுவதால் ‘அப்போது’ என இயல்பாகக் கொடுக்கப்பட்டுள்ளது. לֵאמֹר தனியே மொழிபெயர்க்கப்படாமல், தமிழ் நேர்க்கூற்று அமைப்பில் இறுதியிலுள்ள ‘என்றான்’ என்பதில் அதன் பணி அடங்குகிறது.
- source_word: אֶת־שְׁנֵי בָנַי תָּמִית
  choice: என் இரண்டு மகன்களையும் கொன்றுவிடுங்கள்
  rationale: מות என்பதன் ஹிஃபில் வடிவம் ‘சாகச் செய்/கொன்றுவிடு’ என்ற காரணவினைப் பொருளைக் கொண்டது. இங்கு ரூபன் தன் உறுதிமொழிக்கான கடுமையான உத்தரவாதமாகத் தந்தையிடம் கூறும் அனுமதி அல்லது கட்டளைத் தன்மையுள்ள சொல்லை தமிழ் மரியாதை ஏவல் வடிவம் வெளிப்படுத்துகிறது.
- source_word: אִם־לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: நான் அவனை உங்களிடம் திரும்பக் கொண்டுவராவிட்டால்
  rationale: בוא ஹிஃபில் அடிப்படையில் ‘கொண்டுவருதல்’ என்றாலும், பென்யமீனைத் தந்தையிடம் மீண்டும் சேர்ப்பதே சூழல் என்பதால் ‘திரும்பக் கொண்டுவருதல்’ எனத் தெளிவாக வழங்கப்பட்டுள்ளது.
- source_word: תְּנָה אֹתוֹ עַל־יָדִי
  choice: அவனை என் கையில் ஒப்படையுங்கள்[a]
  rationale: ‘என் கையின்மேல்/கையில் கொடு’ என்ற எபிரெய உருவகத்தையும், ஒருவரின் பொறுப்பில் ஒப்படைக்கும் சொற்றொடரின் பொருளையும் தமிழ் ‘கையில் ஒப்படையுங்கள்’ இயல்பாக இணைக்கிறது.
- source_word: וַאֲנִי
  choice: நானே
  rationale: வினையில் ஏற்கெனவே உள்ள முதலாம் நபருக்கு மேலாக வெளிப்படையாக வரும் אֲנִי வலியுறுத்தலைக் காட்டுவதால் ‘நானே’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲשִׁיבֶנּוּ אֵלֶיךָ
  choice: அவனை உங்களிடம் திரும்பக் கொண்டுவருவேன்
  rationale: שׁוב என்பதன் ஹிஃபில் வடிவம் ‘திரும்பச் செய்/திரும்பக் கொண்டுவா’ என்பதால், பென்யமீனைப் பாதுகாப்பாகத் தந்தையிடம் மீண்டும் கொண்டுவருவதை இச்சொற்றொடர் தெரிவிக்கிறது.
