  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. தந்தையிடம் பேசுவதால் ‘உங்களிடம்’, ‘ஒப்படையுங்கள்’ போன்ற மரியாதைப் பன்மை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ரூபனின் கடுமையான உறுதிமொழியும் ‘நானே’ என்ற வலியுறுத்தலும் தணிக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
