source:
  edition: WLC
  text: בְּ/זֹ֖את תִּבָּחֵ֑נוּ חֵ֤י פַרְעֹה֙ אִם תֵּצְא֣וּ מִ/זֶּ֔ה כִּ֧י אִם בְּ/ב֛וֹא אֲחִי/כֶ֥ם הַ/קָּטֹ֖ן הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/015.yaml
  text: 'By this you will be tested: as Pharaoh lives[a], you shall not leave this place unless your youngest brother comes here.'
translation:
  language: ta
  text: 'இதனால் நீங்கள் சோதிக்கப்படுவீர்கள்: பார்வோனின் உயிர்மேல் ஆணையாக, உங்கள் இளைய சகோதரன் இங்கே வந்தாலன்றி நீங்கள் இந்த இடத்தைவிட்டு வெளியே போகமாட்டீர்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொற்சொல்லாக, “நீங்கள் இங்கிருந்து வெளியே போனால்.” ஆணைமொழியில் இவ்வாறு வரும் “என்றால்” என்பது வலுவான மறுப்பை உணர்த்துகிறது: “நீங்கள் இங்கிருந்து வெளியே போகமாட்டீர்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  choice: இதனால்
  rationale: கருவி அல்லது சோதனையின் அளவுகோலைக் குறிக்கும் בְּ முன்னொட்டையும் זאת என்ற சுட்டுப்பெயரையும் இயல்பான தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: תִּבָּחֵנוּ
  choice: நீங்கள் சோதிக்கப்படுவீர்கள்
  rationale: בחן வினையின் நிஃபால் வடிவம், அவர்கள் கூறியது உண்மையா என்று பரிசோதிக்கப்படுவதை உணர்த்துகிறது; செயப்பாட்டு வடிவமும் மூலத்தின் இலக்கணத்தைக் காக்கிறது.
- source_word: חֵי פַרְעֹה
  choice: பார்வோனின் உயிர்மேல் ஆணையாக
  rationale: பார்வோனின் வாழ்வை முன்வைக்கும் எபிரெய ஆணைமொழியின் வலிமையை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: אִם תֵּצְאוּ מִזֶּה
  choice: நீங்கள் இந்த இடத்தைவிட்டு வெளியே போகமாட்டீர்கள்
  rationale: ஆணைமொழிக்குப் பின்வரும் אִם இங்கு சாதாரண நிபந்தனையாக அல்லாமல் வலுவான மறுப்பாகச் செயல்படுகிறது. מִזֶּה என்பதன் இடப்பொருளும் தெளிவாகத் தரப்பட்டுள்ளது.
- source_word: כִּי אִם
  choice: வந்தாலன்றி
  rationale: முன்னுள்ள மறுப்பிற்கு ஒரே விதிவிலக்கை அறிமுகப்படுத்தும் இணைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּבוֹא
  choice: வந்தால்
  rationale: בְּ உடன் வந்த வினையெச்சப் பெயரின் சூழ்நிலை அல்லது நிபந்தனைப் பொருள் தமிழில் நிபந்தனை வினைமுற்றாக இயல்பாக வழங்கப்படுகிறது.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: உங்கள் இளைய சகோதரன்
  rationale: הַקָּטֹן என்பது இச்சகோதரர் சூழலில் வயதில் இளையவரான பென்யமீனைச் சுட்டுகிறது; ‘சிறிய’ என்பதைவிட ‘இளைய’ என்பது இயல்பும் துல்லியமும் உடையது.
- source_word: הֵנָּה
  choice: இங்கே
  rationale: இவ்விடத்தை நோக்கிய வருகையைச் சுட்டும் திசை வினையடையின் பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது.
