translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சகோதரன்,’ ‘காவல்,’ ‘சோதிக்கப்படுதல்,’ ‘ஒற்றர்கள்’ போன்ற சொற்கள் இயல்பானவையாகவும் மூலத்தின் சட்டவிசாரணைத் தொனியைத் தக்கவைப்பவையாகவும் உள்ளன. எபிரெயத்தின் ‘உண்மை உங்களிடம்’ என்ற திட்டமிட்ட உருவகம் பிரதான உரையிலேயே பாதுகாக்கப்பட்டுள்ளது.
