source:
  edition: WLC
  text: שִׁלְח֨וּ מִ/כֶּ֣ם אֶחָד֮ וְ/יִקַּ֣ח אֶת אֲחִי/כֶם֒ וְ/אַתֶּם֙ הֵאָ֣סְר֔וּ וְ/יִבָּֽחֲנוּ֙ דִּבְרֵי/כֶ֔ם הַֽ/אֱמֶ֖ת אִתְּ/כֶ֑ם וְ/אִם לֹ֕א חֵ֣י פַרְעֹ֔ה כִּ֥י מְרַגְּלִ֖ים אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/016.yaml
  text: Send one of you[a], and let him bring your brother, while you remain confined, so that your words may be tested, whether the truth is with you. But if not, as Pharaoh lives[d][c][b], surely you are spies.
translation:
  language: ta
  text: உங்களில் ஒருவனை அனுப்புங்கள்; அவன் உங்கள் சகோதரனை அழைத்து வரட்டும்[a]. நீங்களோ காவலில் வைக்கப்படுங்கள்[b]. உண்மை உங்களிடம் இருக்கிறதா[c] என்று உங்கள் சொற்கள் சோதிக்கப்படட்டும். இல்லையென்றால், பார்வோனின் உயிர்மேல் ஆணையாக[d], நீங்கள் நிச்சயமாக ஒற்றர்கள்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, ‘அவன் உங்கள் சகோதரனை எடுத்துக்கொள்ளட்டும்.’ இங்கு எபிரெய வினை, சகோதரனை அழைத்துக்கொண்டு திரும்பிவருவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நீங்கள் கட்டிவைக்கப்படுங்கள்’ / ‘காவலில் இருங்கள்.’ எபிரெய வினை கட்டப்படுவதையோ காவலில் வைக்கப்படுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொற்சொல்லாக, ‘உண்மை உங்களிடம் இருக்கிறதா’; அதாவது, நீங்கள் உண்மை சொல்கிறீர்களா என்பதாகும்.
    reason: lexical_alternative
  - marker: d
    text: ‘பார்வோனின் உயிர்மேல் ஆணையாக’ என்பது பார்வோனின் உயிரை முன்வைத்துச் செய்யப்படும் ஓர் ஆணைமொழி.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ מִכֶּם אֶחָד
  choice: உங்களில் ஒருவனை அனுப்புங்கள்
  rationale: מן உடன் வரும் ‘ஒருவன்’ குழுவிலிருந்து ஒருவரைத் தேர்ந்தெடுப்பதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் துல்லியமாகவும் இவ்வாறு அமைகிறது.
- source_word: וְיִקַּח אֶת אֲחִיכֶם
  choice: அவன் உங்கள் சகோதரனை அழைத்து வரட்டும்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’; இச்சூழலில் வீட்டிலுள்ள சகோதரனை யோசேப்பிடம் கூட்டிவருவதைக் குறிப்பதால் ‘அழைத்து வரட்டும்’ இயல்பான திசைநோக்கைப் புலப்படுத்துகிறது.
- source_word: וְאַתֶּם הֵאָסְרוּ
  choice: நீங்களோ காவலில் வைக்கப்பட்டிருங்கள்
  rationale: אסר என்பதன் நிஃபால் வடிவம் கட்டப்படுதல் அல்லது காவலில் அடைக்கப்படுதலைக் குறிக்கிறது. ‘காவலில் வைக்கப்பட்டிருங்கள்’ உடல் கட்டுப்பாடு என்ற சாத்தியத்தை முற்றிலும் நீக்காமல், இச்சூழலின் தடுப்புக்காவல் பொருளைத் தெளிவாக்குகிறது.
- source_word: וְיִבָּחֲנוּ דִּבְרֵיכֶם
  choice: உங்கள் சொற்கள் சோதிக்கப்படட்டும்
  rationale: בחן இங்கு சோதித்தறிதல் அல்லது ஆராய்தலைக் குறிக்கிறது. ‘உங்கள் சொற்கள்’ என்பது எபிரெய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: הַאֱמֶת אִתְּכֶם
  choice: உண்மை உங்களிடம் இருக்கிறதா
  rationale: எபிரெய மொழித்தொடரின் ‘உண்மை உங்களோடு/உங்களிடம் இருக்கிறதா’ என்ற உருவகத்தைத் தீர்த்துவிடாமல் தமிழில் புரியத்தக்கவாறு பாதுகாக்கிறது.
- source_word: חֵי פַרְעֹה
  choice: பார்வோனின் உயிர்மேல் ஆணை
  rationale: இது பார்வோனின் உயிரை முன்வைக்கும் ஆணைமொழி. தமிழில் அதன் பண்பாட்டு மற்றும் வலியுறுத்தும் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי מְרַגְּלִים אַתֶּם
  choice: நீங்கள் நிச்சயமாக ஒற்றர்கள்தான்
  rationale: כִּי இங்கு குற்றச்சாட்டை வலியுறுத்தும் பொருளில் உள்ளது; ‘நிச்சயமாக’ மற்றும் ‘தான்’ அந்த உறுதியைத் தெரிவிக்கின்றன. מרגלים என்பதற்கு ‘ஒற்றர்கள்’ பொருத்தமான பொதுத்தமிழ்ச் சொல்.
