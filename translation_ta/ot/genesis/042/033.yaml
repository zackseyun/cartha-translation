source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלֵ֗י/נוּ הָ/אִישׁ֙ אֲדֹנֵ֣י הָ/אָ֔רֶץ בְּ/זֹ֣את אֵדַ֔ע כִּ֥י כֵנִ֖ים אַתֶּ֑ם אֲחִי/כֶ֤ם הָֽ/אֶחָד֙ הַנִּ֣יחוּ אִתִּ֔/י וְ/אֶת רַעֲב֥וֹן בָּתֵּי/כֶ֖ם קְח֥וּ וָ/לֵֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/033.yaml
  text: 'Then the man[a], the lord of the land, said to us, ‘By this I will know that you are honest: leave one of your brothers with me, take grain for the famine of your households, and go.’'
translation:
  language: ta
  text: 'அப்போது அந்த மனிதன், அந்த நாட்டின் தலைவன், எங்களிடம், ‘நீங்கள் நேர்மையானவர்கள் என்பதை இதனால் நான் அறிந்துகொள்வேன்: உங்கள் சகோதரர்களில் ஒருவனை என்னுடன் விட்டுவிட்டு, உங்கள் குடும்பங்களின் பஞ்சத்துக்குத் தேவையான தானியத்தை எடுத்துக்கொண்டு போங்கள்’ என்றார்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִישׁ אֲדֹנֵי הָאָרֶץ
  choice: அந்த மனிதன், அந்த நாட்டின் அதிகாரி
  rationale: הָאִישׁ என்பதையும் அதை விளக்கும் அப்பெயர்நிலையான אֲדֹנֵי הָאָרֶץ என்பதையும் தனித்தனியாகப் பேணுகிறது. இச்சூழலில் 'அதிகாரி' என்பது நாட்டின்மேல் அவருக்கிருந்த உயர்ந்த நிர்வாக அதிகாரத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: בְּזֹאת אֵדַע
  choice: இதனால் நான் அறிந்துகொள்வேன்
  rationale: בְּזֹאת சோதனை அல்லது அறிதலுக்கான அடையாளத்தைக் குறிக்கிறது; தொடரும் செயல்களின் விளைவாக ஏற்படும் எதிர்கால அறிதலை אֵדַע தெரிவிக்கிறது.
- source_word: כֵנִים
  choice: நேர்மையானவர்கள்
  rationale: இந்தக் கதையமைப்பில் அவர்கள் உளவாளிகள் அல்ல, உண்மையாகவும் நேர்மையாகவும் நடந்துகொள்பவர்கள் என்ற சமூக-நீதிசார் பொருளைத் தருகிறது.
- source_word: אֲחִיכֶם הָאֶחָד הַנִּיחוּ אִתִּי
  choice: உங்கள் சகோதரர்களில் ஒருவனை என்னுடன் விட்டுவிட்டு
  rationale: ஒரு சகோதரனை அந்தக் குழுவிலிருந்து தேர்ந்தெடுத்து அங்கேயே இருக்கச் செய்வதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְאֶת רַעֲבוֹן בָּתֵּיכֶם קְחוּ
  choice: உங்கள் குடும்பங்களின் பஞ்சத்துக்குத் தேவையான தானியத்தை எடுத்துக்கொண்டு
  rationale: எபிரேயத்தில் சொற்படியாக 'உங்கள் வீடுகளின் பஞ்சத்தை எடுத்துக்கொள்ளுங்கள்' என்ற சுருக்கமான தொடர் உள்ளது. உடனடிச் சூழல் எகிப்திலிருந்து தானியம் வாங்குவதைப் பற்றியதால், மறைந்துள்ள பொருளை 'தேவையான தானியம்' என்று தெளிவாக்குகிறது.
- source_word: וָלֵכוּ
  choice: போங்கள்
  rationale: முடிவிலுள்ள எளிய கட்டளையின் நேரடியான வலிமையைப் பேணுகிறது.
