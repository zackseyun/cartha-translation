translation_notes:
  register: நவீன நிலையான தமிழில், உரையாடலுக்கேற்ற இயல்புடனும் வேதாகம உரைக்குரிய கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரேயத்தின் சுருக்கமான 'பஞ்சத்தை எடுத்துக்கொள்ளுங்கள்' என்ற சொற்றொடர் சூழலின் அடிப்படையில் தெளிவாக்கப்பட்டுள்ளது; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
