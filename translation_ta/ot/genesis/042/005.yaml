translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இஸ்ரவேலின் மகன்கள்’ என்பது இங்கு யாக்கோபின் மகன்களைக் குறிப்பதைத் துல்லியமாக வைத்திருக்கிறது; ‘பஞ்சம் நிலவியது’ என்பது சொற்சொல்லான அமைப்பைவிட இயல்பான தமிழை வழங்குகிறது.
