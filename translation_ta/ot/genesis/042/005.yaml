source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לִ/שְׁבֹּ֖ר בְּ/ת֣וֹךְ הַ/בָּאִ֑ים כִּֽי הָיָ֥ה הָ/רָעָ֖ב בְּ/אֶ֥רֶץ כְּנָֽעַן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/005.yaml
  text: So the sons of Israel came to buy grain among those who were coming[b][a], because the famine was in the land of Canaan.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள் தானியம் வாங்க வந்தவர்களிடையே வந்தார்கள்[a]; ஏனெனில் கானான் நாட்டில் பஞ்சம் நிலவியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தானியம் வாங்க வந்தவர்களின் நடுவே வந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர், அவர்கள் உணவு வாங்க வந்த பெரிய கூட்டத்தில் ஒருபகுதியாக வந்ததைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: வந்தார்கள்
  rationale: בוא என்பதன் தொடர்கதை வடிவம் அடுத்த நிகழ்வைச் சொல்கிறது; எகிப்தை வந்து சேர்ந்த பார்வையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: உடனடிச் சூழலில் இது ஒரு பொதுவான இனப்பெயர் அல்ல; யாக்கோபின் ஆண் மகன்களையே குறிப்பதால் எபிரெயச் சொல்லின் துல்லியம் காக்கப்படுகிறது.
- source_word: לִשְׁבֹּר
  choice: தானியம் வாங்க
  rationale: வினைச்சொல் அடிப்படையில் ‘வாங்க’ என்று பொருள்பட்டாலும், பஞ்சம் மற்றும் யோசேப்பின் கதையமைப்பில் வாங்கப்படும் பொருள் தானியம் அல்லது உணவு என்பது தெளிவு; தமிழில் இயல்புக்காக ‘தானியம்’ வெளிப்படையாகச் சேர்க்கப்படுகிறது.
- source_word: בְּתוֹךְ הַבָּאִים
  choice: வந்தவர்களுடன்
  rationale: அவர்கள் வாங்க வருகிற பெருங்கூட்டத்தின் நடுவே, அதில் ஒரு பகுதியாக வந்தார்கள் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அவர்கள் மற்றவர்களுடன் வந்ததற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: הָיָה הָרָעָב
  choice: பஞ்சம் நிலவியது
  rationale: கதையில் ஏற்கெனவே அறியப்பட்ட பஞ்சம் கானான் நாட்டில் இருந்த நிலையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: கானான் நாட்டில்
  rationale: எபிரெயிலுள்ள புவியியல் குறிப்பான ‘கானான் நாடு’ என்பதைத் தெளிவாகப் பாதுகாக்கிறது.
