base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/021.yaml
  text: Then they said to one another[a], “Indeed, we are guilty concerning our brother, because we saw the distress of his soul when he pleaded with us, and we did not listen[b]. Therefore this distress has come upon us.”
translation:
  language: ta
  text: அப்போது அவர்கள் ஒருவருக்கொருவர், “உண்மையாகவே, நம் சகோதரன் விஷயத்தில் நாம் குற்றமுள்ளவர்கள். அவன் நம்மிடம் கெஞ்சியபோது அவனுடைய உள்ளத்தின் வேதனையைப் பார்த்தோம்; ஆனால் நாம் செவிகொடுக்கவில்லை. அதனால்தான் இந்த வேதனை நமக்கு வந்திருக்கிறது[a]” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனுடைய உள்ளத்தின் வேதனை’ என்பதிலும் ‘இந்த வேதனை’ என்பதிலும் ஒரே எபிரெயச் சொல்லின் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. இது யோசேப்பின் அப்போதைய வேதனையையும் சகோதரர்களின் தற்போதைய வேதனையையும் இணைக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמְרוּ אִישׁ אֶל־אָחִיו
  choice: அப்போது அவர்கள் ஒருவருக்கொருவர் ... சொல்லிக்கொண்டார்கள்
  rationale: אִישׁ אֶל־אָחִיו என்பதன் பரஸ்பரப் பொருளை இயல்பான தமிழில் தருகிறது; தொடக்க வாவ் தொடரும் நிகழ்வை ‘அப்போது’ எனக் காட்டுகிறது.
- source_word: אֲבָל
  choice: உண்மையாகவே
  rationale: இங்கு எதிர்மறை இணைப்பாக அல்ல, குற்றத்தை வலியுறுத்தி ஒப்புக்கொள்ளும் சொல்லாக வருகிறது.
- source_word: אֲשֵׁמִים אֲנַחְנוּ עַל־אָחִינוּ
  choice: நம் சகோதரன் விஷயத்தில் நாம் குற்றவாளிகள்
  rationale: குற்றப்பொறுப்பைத் தெளிவாகத் தருகிறது; עַל என்பதன் பொருளை ‘விஷயத்தில்’ எனக் கொண்டு, மூலத்தில் வெளிப்படையாக இல்லாத ‘எதிராக’ என்பதைச் சேர்க்கவில்லை.
- source_word: צָרַת נַפְשׁוֹ
  choice: அவனுடைய உள்ளத்தின் வேதனை
  rationale: ‘அவனுடைய נפשׁ-இன் நெருக்கடி’ என்ற எபிரெய வெளிப்பாட்டின் ஆழ்ந்த தனிப்பட்ட துயரைக் கண்ணியமான, புரியத்தக்க தமிழில் பாதுகாக்கிறது.
- source_word: בְּהִתְחַנְנוֹ אֵלֵינוּ
  choice: அவன் நம்மிடம் கெஞ்சியபோது
  rationale: חנן என்ற வினையின் தன்னிலை வடிவம் குறிக்கும் உருக்கமான வேண்டுதலைத் தருகிறது; மூலத்தில் சொல்லப்படாத வேண்டுதலின் பொருளைச் சேர்க்கவில்லை.
- source_word: וְלֹא שָׁמָעְנוּ
  choice: நாம் செவிகொடுக்கவில்லை
  rationale: வெறுமனே கேட்காததல்ல, வேண்டுதலுக்கு இணங்காததையும் கவனிக்காததையும் குறிக்கும் שׁמע-இன் சூழற்பொருளைத் தருகிறது.
- source_word: עַל־כֵּן
  choice: அதனால்தான்
  rationale: கடந்த செயலுக்கும் தற்போதைய துன்பத்திற்கும் அவர்கள் காணும் காரணவிளைவு தொடர்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בָּאָה אֵלֵינוּ הַצָּרָה הַזֹּאת
  choice: இந்த வேதனை நமக்கு வந்திருக்கிறது
  rationale: צָרָה என்ற சொல்லை முந்தைய צָרַת உடன் ‘வேதனை’ என ஒரே சொல்லால் மொழிபெயர்த்து, யோசேப்பின் வேதனைக்கும் சகோதரர்களின் தற்போதைய வேதனைக்கும் உள்ள சொல்லிணைப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: சகோதரர்கள் தங்கள் தற்போதைய துன்பத்திற்குக் கூறும் காரணம்
  choice: ‘அதனால்தான்’ என்று அவர்களுடைய காரணவிளைவு ஒப்புதலை நேரடியாக வைத்தல்
  alternative: இதைத் தெய்வீகத் தண்டனை என்று வெளிப்படையாக விளக்குதல்
  rationale: வசனம் சகோதரர்களின் குற்றவுணர்வையும் அவர்கள் காணும் விளைவையும் கூறுகிறது; இங்கு தேவனை அல்லது தெய்வீகத் தண்டனையை வெளிப்படையாகச் சேர்ப்பது மூலத்தை மீறும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரை. ‘உள்ளத்தின் வேதனை’ என்பது נפשׁ என்ற சொல்லை தமிழில் செயற்கையாக ‘ஆத்துமா’ எனக் கட்டாயப்படுத்தாமல் ஆழ்ந்த தனிப்பட்ட துயரைக் காட்டுகிறது. அடிக்குறிக் குறி [a] முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
