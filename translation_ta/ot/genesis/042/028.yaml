  yaml_path: translation/ot/genesis/042/028.yaml
  text: He said to his brothers[a], “My silver has been returned, and look, it is even in my sack!” Then their hearts failed them, and they trembled, each man to his brother, saying[b], “What is this that God has done to us?”
translation:
  language: ta
  text: அவன் தன் சகோதரர்களிடம், “என் வெள்ளிப் பணம் திருப்பி வைக்கப்பட்டிருக்கிறது; இதோ, அது என் மூட்டையிலேயே இருக்கிறது!” என்றான். அப்போது அவர்களுடைய மனத்துணிவு அவர்களைவிட்டு அகன்றது[a]. அவர்கள் நடுநடுங்கி, ஒவ்வொருவரும் தன் சகோதரனிடம்[b], “கடவுள் நமக்குச் செய்தது என்ன இது?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “அவர்களுடைய இருதயம் வெளியேறியது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒருவருக்கொருவர்.” சொல்லுக்குச் சொல், “ஒவ்வொருவனும் தன் சகோதரனிடம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּשַׁב
  choice: திருப்பி வைக்கப்பட்டிருக்கிறது
  rationale: שוב என்பதன் ஹொஃபால் வடிவம் செயப்பாட்டு பொருளில் ‘திரும்பும்படி செய்யப்பட்டது/திருப்பப்பட்டது’ என்பதைக் குறிக்கிறது. பணம் மூட்டையில் மீண்டும் வைக்கப்பட்டிருப்பதை கண்டுபிடித்த நிலையை இச்சொற்றொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כַּסְפִּי
  choice: என் வெள்ளிப் பணம்
  rationale: כֶּסֶף என்பதன் அடிப்படைப் பொருள் ‘வெள்ளி’; சூழலில் அது பணமாகப் பயன்படுத்தப்பட்ட வெள்ளியைக் குறிக்கிறது. ‘வெள்ளிப் பணம்’ என்பது பொருளையும் வரலாற்றுச் சூழலையும் தெளிவாக வைத்திருக்கிறது.
- source_word: אַמְתַּחַת
  choice: மூட்டை
  rationale: தானியம் அல்லது பயணப் பொருட்களை ஏற்றிச் செல்லும் பெரிய பையைக் குறிக்கும். இச்சூழலில் ‘மூட்டை’ இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: וְגַם הִנֵּה
  choice: இதோ, அது ... இலேயே இருக்கிறது
  rationale: הִנֵּה கவனத்தை ஈர்த்து ஆச்சரியத்தை வெளிப்படுத்துகிறது; גַם தரும் வலியுறுத்தலை ‘-இலேயே’ எடுத்துரைக்கிறது.
- source_word: וַיֵּצֵא לִבָּם
  choice: அவர்களுடைய மனத்துணிவு அவர்களைவிட்டு அகன்றது
  rationale: சொல்லுக்குச் சொல் ‘அவர்களுடைய இருதயம் வெளியேறியது’ என்ற எபிரேய மரபுத்தொடர், அச்சத்தால் துணிவு முற்றிலும் குன்றியதைச் சொல்கிறது. தமிழில் பொருளை இயல்பாகத் தருவதோடு மூலத்தின் ‘விட்டுச் செல்லுதல்’ உருவகத்தையும் இது ஓரளவு காக்கிறது.
- source_word: וַיֶּחֶרְדוּ
  choice: அவர்கள் நடுநடுங்கி
  rationale: חרד அச்சம் அல்லது கலக்கத்தால் நடுங்குவதைக் குறிக்கிறது. ‘நடுநடுங்கி’ அதன் உடல்சார்ந்த மற்றும் உணர்ச்சிசார்ந்த வலிமையை வெளிப்படுத்துகிறது.
- source_word: אִישׁ אֶל אָחִיו
  choice: ஒவ்வொருவரும் தன் சகோதரனிடம்
  rationale: எபிரேயச் சொற்றொடர் பகிர்ந்தளிக்கும் ஒருமையிலும் ஆண்பால் உறவுமுறையிலும் அமைந்துள்ளது. தமிழில் அந்த வடிவத்தையும் சகோதர உறவையும் இது தெளிவாகக் காக்கிறது.
- source_word: מַה זֹּאת
  choice: இப்படிச் செய்தது என்ன?
  rationale: இது வியப்பும் திகைப்பும் கலந்த நேரடிக் கேள்வி. அதை ‘ஏன்’ என்று காரணக் கேள்வியாக மாற்றாமல், மூலத்தின் ‘என்ன’ என்ற தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும், இவ்வாக்கியத்தின் தொடரமைப்பும் கதையோட்டமும் ஒரே தெய்வத்தைக் குறிக்கின்றன. நவீனத் தமிழில் ‘கடவுள்’ இயல்பான ஒருமை மொழிபெயர்ப்பு.
theological_decisions:
- issue: சகோதரர்களின் அச்சமிகுந்த கேள்வியில் אֱלֹהִים என்பதன் பொருள்
  choice: கடவுள்
  alternative: ஒரு தெய்வம் / தெய்வங்கள்
  rationale: வினைச்சொல் தொடரமைப்பும் ஆதியாகமக் கதையின் சூழலும் ஒருமையான தெய்வீகச் செயற்பாட்டைக் காட்டுகின்றன. எனினும், கடவுள் ஏன் இதைச் செய்தார் என்பதற்கான விளக்கத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: אִישׁ אֶל אָחִיו என்ற பாலினம் குறித்த உறவுமுறைச் சொற்றொடர்
  choice: ஒவ்வொருவரும் தன் சகோதரனிடம்
  alternative: ஒருவருக்கொருவர்
  rationale: மூலத்தில் ஆண்பால் ஒருமைச் சொற்கள் பகிர்ந்தளிக்கும் பொருளில் வருகின்றன. பொதுப்பாலாக்காமல் சகோதர உறவை மொழிபெயர்ப்பு பாதுகாக்கிறது.
- issue: מַה זֹּאת என்ற கேள்வியின் தன்மை
  choice: இப்படிச் செய்தது என்ன?
  alternative: கடவுள் நமக்கு ஏன் இப்படிச் செய்தார்?
  rationale: ‘ஏன்’ என்பது காரணத்தை வெளிப்படையாகக் கேட்கும் விளக்கவுரை. மூலத்தில் உள்ள ‘என்ன இது?’ என்ற திகைப்பையும் இறையியல் பதற்றத்தையும் தீர்த்துவிடாமல் மொழிபெயர்ப்பு காக்கிறது.
