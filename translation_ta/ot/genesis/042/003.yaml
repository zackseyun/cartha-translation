revisions:
- from: ஆகவே யோசேப்பின் சகோதரர்கள் பத்துப் பேர் எகிப்திலிருந்து தானியம் வாங்குவதற்காக அங்கே இறங்கிச் சென்றார்கள்.
  to: அப்போது யோசேப்பின் பத்து சகோதரர்கள் எகிப்திலிருந்து தானியம் வாங்குவதற்காக இறங்கிச் சென்றார்கள்.[a]
  rationale: The revision removes an unsupported locative addition, uses more idiomatic Tamil word order, and preserves the Hebrew source sense of מִמִּצְרָיִם. A footnote records the contextually possible locative rendering without suppressing the more literal main-text reading.
  reviewer_model: gpt-5.6-terra
