  yaml_path: translation/ot/genesis/042/003.yaml
  text: So Joseph’s ten brothers went down to buy grain from Egypt[a].
translation:
  language: ta
  text: அப்போது யோசேப்பின் பத்து சகோதரர்கள் எகிப்திலிருந்து தானியம் வாங்குவதற்காக இறங்கிச் சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எகிப்தில் தானியம் வாங்குவதற்காக.” எபிரெயத்தில், “எகிப்திலிருந்து தானியம் வாங்குவதற்காக” என்று உள்ளது; இது தானியத்தின் மூல இடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: இறங்கிச் சென்றார்கள்
  rationale: ירד என்பதன் ‘கீழே செல்/இறங்கிச் செல்’ என்ற புவியியல் பயணச் சொல்லாட்சியை இயல்பான தமிழில் காக்கிறது.
- source_word: אֲחֵי יוֹסֵף עֲשָׂרָה
  choice: யோசேப்பின் சகோதரர்கள் பத்துப் பேர்
  rationale: எபிரெயக் கட்டமைப்பையும் சகோதரர்களின் எண்ணிக்கையையும் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לִשְׁבֹּר
  choice: வாங்குவதற்காக
  rationale: பஞ்சச் சூழலில் שׁבר என்பது தானியத்தை விலைக்கு வாங்குவதைக் குறிக்கும்.
- source_word: בָּר
  choice: தானியம்
  rationale: இங்கு உணவுக்கான தானிய வகைகளைப் பொதுவாகக் குறிக்கும் தெளிவான நவீனத் தமிழ்ச் சொல்.
- source_word: מִמִּצְרָיִם
  choice: எகிப்திலிருந்து
  rationale: מן முன்னிடைச்சொல்லின் ‘இருந்து’ என்ற மூலப்பொருளையும் தானியத்தின் ஆதார இடத்தையும் நேரடியாகக் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘எகிப்திலிருந்து’ என்பதுடன் ‘அங்கே’ சேர்க்கப்பட்டது; இதனால் தமிழில் நோக்கிடப் பயணம் தெளிவாகி, தானியத்தின் மூல இடத்தைக் குறிக்கும் எபிரெய வடிவமும் காக்கப்படுகிறது.
