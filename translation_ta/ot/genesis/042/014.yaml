translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரேயத்தின் ‘பேசினேன்—சொல்லி’ என்ற மறுபடிவைச் சொற்சொல்லாகப் பின்பற்றாமல், அதன் மேற்கோள் அறிமுகப் பணியை இரட்டைப்புள்ளியால் வெளிப்படுத்தியுள்ளோம். அதேவேளை הוּא אֲשֶׁר என்பதன் வலியுறுத்தல் ‘இதுதான்’ என்பதில் பாதுகாக்கப்பட்டுள்ளது.
