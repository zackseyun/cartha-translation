translation:
  language: ta
  text: 'யோசேப்பு அவர்களிடம், “நான் உங்களிடம் சொன்னது இதுதான்: ‘நீங்கள் உளவாளிகள்’” என்றான்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: אמר என்பதன் தொடர்கதை வடிவம். தமிழில் மேற்கோளின் முடிவில் ‘என்றான்’ என அமைப்பது இயல்பான கதைநடை; தொடக்க இணைப்பைத் தனியே மொழிபெயர்க்க வேண்டியதில்லை.
- source_word: אֲלֵהֶם
  choice: அவர்களிடம்
  rationale: யோசேப்பு யாரை நோக்கிப் பேசினான் என்பதை இயல்பான தமிழில் நேரடியாகக் குறிக்கிறது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: தமிழில் வழக்கமாக நிலைபெற்றுள்ள இப்பெயரின் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הוּא אֲשֶׁר
  choice: இதுதான்
  rationale: முன்பு கூறிய குற்றச்சாட்டையே யோசேப்பு வலியுறுத்தி மீண்டும் சுட்டுவதைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: דִּבַּרְתִּי אֲלֵכֶם
  choice: நான் உங்களிடம் சொன்னது
  rationale: முந்தைய பேச்சின் உள்ளடக்கத்தைச் சுட்டும் சூழலில் דבר என்பதற்கு ‘சொன்னது’ என்பது இயல்பான தமிழ்; முதல் நபர் மற்றும் பன்மை முன்னிலையும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
- source_word: לֵאמֹר
  choice: ':'
  rationale: பின்வரும் நேரடி மேற்கோளை அறிமுகப்படுத்தும் எபிரேயப் பேச்சுச் சூத்திரத்தின் பணியைத் தமிழில் இரட்டைப்புள்ளி இயல்பாக நிறைவேற்றுகிறது; ‘சொல்லி’ என்று சேர்த்து தேவையற்ற மறுபடிவை உருவாக்கவில்லை.
- source_word: מְרַגְּלִים
  choice: உளவாளிகள்
  rationale: நிலத்தை மறைவாக ஆராய்பவர்களைக் குறிக்கும் சொல்லுக்கு நவீன நிலையான தமிழில் தெளிவான இணைச்சொல்.
- source_word: אַתֶּם
  choice: நீங்கள்
  rationale: இரண்டாம் நபர் ஆண்பால் பன்மைச் சுட்டுப்பெயரை தமிழில் பால்வேறுபாடு காட்டாத மரியாதை/பன்மை வடிவில் இயல்பாக வழங்குகிறது; ‘உளவாளிகள்’ உடன் சேர்ந்து பெயர்ப் பயனிலையை உருவாக்குகிறது.
