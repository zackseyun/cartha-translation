  text: וַ/יֹּ֕אמֶר לֹֽא יֵרֵ֥ד בְּנִ֖/י עִמָּ/כֶ֑ם כִּֽי אָחִ֨י/ו מֵ֜ת וְ/ה֧וּא לְ/בַדּ֣/וֹ נִשְׁאָ֗ר וּ/קְרָאָ֤/הוּ אָסוֹן֙ בַּ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר תֵּֽלְכוּ בָ֔/הּ וְ/הוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/יָג֖וֹן שְׁאֽוֹלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/038.yaml
  text: But he said[a], “My son will not go down with you, because his brother is dead, and he alone is left. If harm should happen to him on the journey on which you go[b], then you would bring my gray hair down to Sheol in sorrow.”
translation:
  language: ta
  text: ஆனால் அவர், “என் மகன் உங்களோடு இறங்கிவர மாட்டான்; ஏனெனில், அவனுடைய சகோதரன் இறந்துவிட்டான், அவன் மட்டுமே மீந்திருக்கிறான். நீங்கள் போகும் வழியில் அவனுக்கு ஏதேனும் பேராபத்து நேரிட்டால், என் நரைத்த தலையைத் துயரத்தோடு ஷியோலுக்கு[a] இறக்கிவிடுவீர்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஷியோல்” என்பது இறந்தோரின் உலகைக் குறிக்கும் எபிரெயச் சொல்; இச்சூழலில் “கல்லறை” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרֵד
  choice: இறங்கிவர மாட்டான்
  rationale: கானானிலிருந்து எகிப்துக்குச் செல்வதை எபிரெய உரை ‘இறங்குதல்’ என்று குறிப்பிடுவதால், அந்தப் புவியியல் மற்றும் கதைநடைச் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: בְּנִי
  choice: என் மகன்
  rationale: ஆண்பாலையும் தந்தை-மகன் உறவையும் நேரடியாகக் குறிக்கும் எபிரெயச் சொல்லுக்கு இயல்பான தமிழ் இணை.
- source_word: אָחִיו מֵת
  choice: அவனுடைய சகோதரன் இறந்துவிட்டான்
  rationale: யோசேப்பு இறந்துவிட்டதாக யாக்கோபு கொண்டிருந்த தற்போதைய நம்பிக்கையையும், விளைவுநிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְבַדּוֹ נִשְׁאָר
  choice: இவன் ஒருவன் மட்டுமே மீந்திருக்கிறான்
  rationale: ராகேலின் மக்களில் பென்யமீன் மட்டுமே மீந்துள்ளான் என்ற யாக்கோபின் பார்வையையும் לְבַדּוֹ என்பதன் வலியுறுத்தலையும் காக்கிறது.
- source_word: וּקְרָאָהוּ אָסוֹן
  choice: இவனுக்கு ஏதாவது தீங்கு நேரிட்டால்
  rationale: தீங்கு அல்லது பேரிடர் நேர்வதைச் சுட்டும் சொற்றொடரின் நிபந்தனைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: நீங்கள் போகும் வழியில்
  rationale: எபிரெய உரையின் ‘நீங்கள் போகும் வழி’ என்ற நேரடியான உருவகத்தையும் இயல்பான தமிழ் நடையையும் இணைக்கிறது.
- source_word: וְהוֹרַדְתֶּם
  choice: இறங்கச் செய்துவிடுவீர்கள்
  rationale: ירד என்பதன் காரணவினை வடிவமான ‘கீழே இறங்கச் செய்தல்’ என்பதையும் எச்சரிக்கையின் விளைவையும் தக்கவைக்கிறது.
- source_word: שֵׂיבָתִי
  choice: என் நரைமுடியை
  rationale: முதுமையைச் சுட்டும் மூல உரையின் உயிரோட்டமான நரைமுடி உருவகத்தைத் தக்கவைக்கிறது.
- source_word: בְּיָגוֹן
  choice: துயரத்தோடு
  rationale: יגון குறிக்கும் ஆழ்ந்த துயரத்தை தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: שְׁאֹלָה
  choice: பாதாளத்திற்குள்
  rationale: இறந்தோரின் உலகைக் குறிக்கக்கூடிய שְׁאוֹל என்பதைக் ‘கல்லறை’ என்று குறுக்காமல், தமிழ்ப் பொதுவிவிலிய நடையில் பரந்த பொருளுடைய ‘பாதாளம்’ என வழங்குகிறது.
theological_decisions:
- issue: שְׁאוֹל என்பதை ‘பாதாளம்’ அல்லது ‘கல்லறை’ என்று மொழிபெயர்த்தல்
  choice: பாதாளத்திற்குள்
  alternative: கல்லறைக்குள்; இறந்தோரின் உலகிற்குள்
  rationale: שְׁאוֹל எல்லா இடங்களிலும் வெறும் உடல் அடக்கக் கல்லறையை மட்டும் குறிக்காது. ‘பாதாளம்’ அதன் இறந்தோர் உலகம் சார்ந்த பரந்த பொருளையும் மூல உரையின் தெளிவின்மையையும் ஓரளவு காக்கிறது; அடிக்குறிப்பு மாற்றுப் பொருளை விளக்குகிறது.
translation_notes:
  register: நவீன தரமான தமிழ்; மரியாதையும் கதைநடை இயல்பும் காக்கப்பட்டுள்ளன. ‘இறங்கிவர’, ‘நரைமுடி’, ‘பாதாளம்’ ஆகியவை மூல உரையின் புவியியல், உருவகம், மற்றும் இறந்தோர் உலகம் குறித்த பொருள் அகலத்தைத் தக்கவைக்கின்றன. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் இடமாறியிருப்பதாகத் தோன்றுவதால், தமிழில் பாதாளம் குறித்த சரியான இடத்தில் [a] வைக்கப்பட்டுள்ளது.
