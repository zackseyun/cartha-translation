translation_notes:
  register: நவீன நிலையான தமிழில், விசாரணைச் சூழலுக்கேற்ற கண்ணியமான நேரடி உரை. ‘மற்றவர்களாகிய நீங்கள்’ என்பது אַתֶּם என்ற தனிப்பெயர்ச்சொல்லின் வலியுறுத்தலையும், தங்கும் ஒருவனுக்கும் செல்லும் மற்றவர்களுக்கும் உள்ள வேறுபாட்டையும் காக்கிறது. மூலத்தில் உள்ள தொடர்ச்சியான கட்டளைகள் தமிழில் ‘போய்… கொண்டுசெல்லுங்கள்’ என இயல்பாக இணைக்கப்பட்டுள்ளன.
