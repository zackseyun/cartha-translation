base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/019.yaml
  text: If you are honest[a], let one of your brothers be confined in your place of custody, and you[c][b], go and bring grain for the famine of your households.
translation:
  language: ta
  text: “நீங்கள் உண்மையாகப் பேசுகிறவர்களானால்[a], உங்கள் சகோதரர்களில் ஒருவன் நீங்கள் வைக்கப்பட்டிருக்கும் காவலிடத்தில் அடைக்கப்படட்டும்[b]. மற்றவர்களாகிய நீங்கள் போய், பஞ்சத்தில் வாடும் உங்கள் வீட்டாருக்குத் தானியம் கொண்டுசெல்லுங்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் உண்மையானவர்களானால்.” எபிரெயப் பெயரடை ‘உண்மையானவர்கள்’ அல்லது ‘உண்மை பேசுகிறவர்கள்’ என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லளவில், “உங்கள் காவலின் வீட்டில்.” இது அவர்கள் வைக்கப்பட்டிருந்த காவலிடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּנִים
  choice: உண்மையாகப் பேசுகிறவர்கள்
  rationale: இந்த விசாரணைச் சூழலில் இச்சொல் சகோதரர்கள் கூறுவது உண்மையா என்பதைக் குறிக்கிறது. ‘நேர்மையானவர்கள்’ என்பதைக் காட்டிலும் ‘உண்மையாகப் பேசுகிறவர்கள்’ சூழலுக்குப் பொருத்தமானது; எபிரெயச் சொல்லின் ‘உண்மையானவர்கள்’ என்ற வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲחִיכֶם אֶחָד
  choice: உங்கள் சகோதரர்களில் ஒருவன்
  rationale: சகோதரர்களின் கூட்டத்திலிருந்து ஒருவனைத் தனியே குறிக்கும் எபிரெயப் பகுப்புப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יֵאָסֵר
  choice: சிறைவைக்கப்படட்டும்
  rationale: אסר என்பதன் நிஃபால் வடிவம் கட்டப்படுதல் அல்லது காவலில் அடைக்கப்படுதல் ஆகியவற்றைக் குறிக்கலாம். அடுத்துள்ள காவலிடக் குறிப்பின் காரணமாக இங்கு தடுப்புக்காவல் பொருள் பொருத்தமானது; உடலால் கட்டப்படுவதைத் தேவையின்றி குறிப்பதில்லை.
- source_word: בְּבֵית מִשְׁמַרְכֶם
  choice: நீங்கள் காவலில் வைக்கப்பட்டிருக்கும் இடத்தில்
  rationale: சொல்லளவில் ‘உங்கள் காவலின் வீட்டில்’ என்று இருப்பது, சகோதரர்கள் அடைக்கப்பட்டிருந்த காவலிடத்தைக் குறிக்கிறது. நிறுவனமயமான நவீன சிறைச்சாலை என்ற கருத்தைச் சேர்க்காமல் இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: וְאַתֶּם לְכוּ
  choice: மற்றவர்களாகிய நீங்கள் போய்
  rationale: ஒரு சகோதரன் தங்கவைக்கப்படுவதற்கும் மீதமுள்ளவர்கள் செல்வதற்கும் உள்ள எதிர்நிலையை, தனிப்பெயர்ச்சொல் אַתֶּם தரும் வலியுறுத்தலுடன் வெளிப்படுத்துகிறது. எபிரெயின் எளிய இணைப்பை கடுமையான ‘ஆனால்’ என மாற்றவில்லை.
- source_word: הָבִיאוּ
  choice: கொண்டுசெல்லுங்கள்
  rationale: சகோதரர்கள் எகிப்திலிருந்து தங்கள் வீட்டாரிடம் தானியத்தை எடுத்துச் செல்ல வேண்டிய காட்சிநிலைக்கு இயல்பான தமிழ் இயக்கச் சொல் இது.
- source_word: שֶׁבֶר
  choice: தானியம்
  rationale: யோசேப்பு வரலாற்றில் இச்சொல் பஞ்சகாலத்தில் வாங்கப்படும் தானியத்தைச் சிறப்பாகக் குறிக்கிறது; பொதுவான ‘உணவு’ என்பதைக் காட்டிலும் சூழலுக்குத் துல்லியமானது.
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: பஞ்சத்தில் வாடும் உங்கள் வீட்டாருக்கு
  rationale: சொல்லளவிலான ‘உங்கள் வீடுகளின் பஞ்சம்’ தமிழில் இயல்பற்றது. பஞ்சத்தால் வீட்டார் உணவின்றி இருப்பதைக் கருத்தை மிகைப்படுத்தாமல் இயல்பாக வெளிப்படுத்துகிறது.
