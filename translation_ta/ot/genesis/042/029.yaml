  yaml_path: translation/ot/genesis/042/029.yaml
  text: Then they came to Jacob their father in the land of Canaan and told him all that had happened to them[a], saying,
translation:
  language: ta
  text: 'பின்பு அவர்கள் கானான் நாட்டிலிருந்த தங்கள் தகப்பனாகிய யாக்கோபிடம் வந்து,[a] தங்களுக்கு நேர்ந்த அனைத்தையும் அவரிடம் தெரிவித்தார்கள்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொற்சொல்லாக, “தங்கள் தகப்பனாகிய யாக்கோபிடம், கானான் நாட்டுக்கு” என்று உள்ளது. இயல்பான தமிழுக்காக இங்கே “கானான் நாட்டிலிருந்த தங்கள் தகப்பனாகிய யாக்கோபிடம்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: பின்பு அவர்கள் ... வந்து
  rationale: வழக்கமான எபிரெயக் கதைநடைத் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: தங்கள் தகப்பனாகிய யாக்கோபிடம்
  rationale: உறவுமுறையையும் பெயரையும் தெளிவாகப் பாதுகாக்கிறது; ‘தகப்பன்’ கண்ணியமான பொதுவழக்குத் திருமறை நடைக்கு ஏற்றது.
- source_word: אַרְצָה כְּנָעַן
  choice: கானான் நாட்டிலிருந்த
  rationale: இலக்கு நோக்கிய இயக்கத்தைக் குறிக்கும் எபிரெய வடிவம் உள்ளபோதிலும், யாக்கோபிடம் வருதல் என்ற முந்தைய இலக்குடன் சேர்த்து இயல்பான தமிழில் அவரது இருப்பிடமாகக் காட்டுகிறது.
- source_word: וַיַּגִּידוּ לוֹ
  choice: அவரிடம் எடுத்துச் சொல்லத் தொடங்கினார்கள்
  rationale: נגד என்பதன் அறிவித்தல்/விவரித்தல் பொருளைத் தருகிறது; தொடர்ந்து வரும் நேரடிக் கூற்றைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: אֵת כָּל הַקֹּרֹת אֹתָם
  choice: தங்களுக்கு நேர்ந்த அனைத்தையும்
  rationale: קרה வடிவம் குறிக்கும் அவர்களுக்கு நிகழ்ந்த சம்பவங்களின் முழுமையையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לֵאמֹר
  choice: 'எடுத்துச் சொல்லத் தொடங்கினார்கள்:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடிப் பேச்சை அறிமுகப்படுத்தும் செயல்பாட்டைத் தமிழில் இயல்பாகக் காட்டுகிறது; ‘தொடங்கினார்கள்’ என்பது தனிப்பட்ட தொடக்க வினை அல்ல, தொடரும் மேற்கோளுக்கான உரைநடை வடிவம்.
