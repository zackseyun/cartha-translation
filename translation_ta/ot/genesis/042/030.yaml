source:
  edition: WLC
  text: דִּ֠בֶּר הָ/אִ֨ישׁ אֲדֹנֵ֥י הָ/אָ֛רֶץ אִתָּ֖/נוּ קָשׁ֑וֹת וַ/יִּתֵּ֣ן אֹתָ֔/נוּ כִּֽ/מְרַגְּלִ֖ים אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/030.yaml
  text: The man, the lord of the land, spoke harshly with us and treated us as spies of the land.
translation:
  language: ta
  text: “அந்த மனிதன், அந்த நாட்டின் தலைவர், எங்களோடு கடுமையாகப் பேசினார்; எங்களை அந்த நாட்டை உளவுபார்ப்பவர்களாக நடத்தினார்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִישׁ אֲדֹנֵי הָאָרֶץ
  choice: அந்த மனிதன்—அந்த நாட்டின் அதிபதி
  rationale: אֲדֹנֵי என்பது இங்கு நாட்டின் அதிகாரியைச் சுட்டுகிறது; இயல்பான தமிழுக்காக ‘அதிபதி’ என வழங்கப்பட்டுள்ளது. அடையாளப்படுத்தும் இரு சொற்றொடர்களின் உறவை இடைக்கோடு தெளிவாக்குகிறது.
- source_word: דִּבֶּר ... אִתָּנוּ קָשׁוֹת
  choice: எங்களிடம் கடுமையாகப் பேசி
  rationale: קָשׁוֹת என்பதன் கடுமையான, கரடுமுரடான பேச்சு என்ற பொருளைப் பாதுகாக்கிறது; אִתָּנוּ-வை இயல்பான தமிழில் ‘எங்களிடம்’ என வழங்குகிறது.
- source_word: וַיִּתֵּן אֹתָנוּ כִּמְרַגְּלִים
  choice: நாங்கள் ... உளவுபார்க்க வந்தவர்கள் என்று கருதினார்
  rationale: נתן + כ־ இங்கு ஒருவரை ஒரு குறிப்பிட்ட வகையினராக வைத்துக் கருதுதல்/நடத்துதல் என்ற சூழற்பொருளைக் கொண்டுள்ளது. தமிழில் தெளிவாகவும் இயல்பாகவும் ‘என்று கருதினார்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מְרַגְּלִים אֶת הָאָרֶץ
  choice: அந்த நாட்டை உளவுபார்க்க வந்தவர்கள்
  rationale: முன்னிலையில் உள்ள நாட்டையே சுட்டும் குறித்த தன்மையை ‘அந்த நாடு’ காக்கிறது; ‘வந்தவர்கள்’ என்பது சகோதரர்கள்மீது சுமத்தப்பட்ட நோக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், குடும்பத்தினரிடம் நிகழ்வை எடுத்துரைக்கும் நேரடியான உரைநடை. ‘அதிபதி’ மரியாதையையும் அரசியல் அதிகாரத்தையும் காட்டுகிறது; தேவப்பெயருடன் குழப்பமடையச் செய்யாது.
