base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/035.yaml
  text: And as they were emptying their sacks[a], behold, each man’s bundle of silver was in his sack; and they saw their bundles of silver, they and their father[b], and they were afraid.
translation:
  language: ta
  text: அவர்கள் தங்கள் சாக்குகளைக் காலி செய்துகொண்டிருந்தபோது, இதோ, ஒவ்வொருவனுடைய வெள்ளிப் பணக் கட்டும் அவனவன் சாக்கில் இருந்தது. அவர்கள் தங்கள் வெள்ளிப் பணக் கட்டுகளைக் கண்டார்கள்; அவர்களும் அவர்களுடைய தந்தையும் பயந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי הֵם מְרִיקִים
  choice: அவர்கள் ... காலி செய்துகொண்டிருந்தபோது
  rationale: היה என்னும் கதைத் தொடர்ச்சிச் சொல்லையும் நிகழ்ந்துகொண்டிருந்த செயலைக் குறிக்கும் מְרִיקִים என்னும் பங்கேற்பு வடிவத்தையும் இயல்பான நவீனத் தமிழில் ஒரு காலத் துணைவாக்கியமாகத் தருகிறது.
- source_word: שַׂקֵּיהֶם
  choice: தங்கள் சாக்குகளை
  rationale: தானியம் அல்லது பொருட்களை வைத்துச் செல்லும் பழங்காலப் பெரிய பைகளைக் குறிக்கும் שַׂק என்பதற்கு ‘சாக்கு’ நேரடியும் இச்சூழலில் தெளிவுமான சொல்லாகும்.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: எதிர்பாராத கண்டுபிடிப்பையும் வியப்பையும் சுட்டும் எபிரேய இடைச்சொல்லின் கதையோட்ட வலிமையைப் பாதுகாக்கிறது.
- source_word: אִישׁ צְרוֹר כַּסְפּוֹ
  choice: ஒவ்வொருவனுடைய வெள்ளிப் பண முடிப்பும்
  rationale: אִישׁ என்பதன் பகிர்ந்தளிக்கும் பொருளை ‘ஒவ்வொருவனுடைய’ என்றும், பணமாகப் பயன்படுத்தப்பட்ட வெள்ளி கட்டி வைக்கப்பட்டிருந்ததை צְרוֹר כֶּסֶף என்பதற்கான ‘வெள்ளிப் பண முடிப்பு’ என்றும் வெளிப்படுத்துகிறது.
- source_word: בְּשַׂקּוֹ
  choice: அவனவன் சாக்கில்
  rationale: ஒவ்வொரு சகோதரனின் தனித்தனி சாக்கைக் குறிக்கும் ஒருமையையும் பகிர்ந்தளிக்கும் தொடர்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הֵמָּה וַאֲבִיהֶם
  choice: அவர்களும் அவர்களுடைய தகப்பனும்
  rationale: யார் அதைக் கண்டார்கள் என்பதைக் குறிப்பாக வலியுறுத்தும் எபிரேய அமைப்பைத் தெளிவாகத் தருகிறது.
- source_word: וַיִּירָאוּ
  choice: பயந்தார்கள்
  rationale: கண்டுபிடிப்பைத் தொடர்ந்து ஏற்பட்ட அச்சத்தை எளிய, நேரடியான நவீனத் தமிழில் தெரிவிக்கிறது.
