  to: “நாங்கள் பன்னிரண்டு சகோதரர்கள், எங்கள் தந்தையின் மகன்கள். ஒருவன் இல்லை[a]. எங்களில் இளையவன் இன்று கானான் நாட்டில் எங்கள் தந்தையுடன் இருக்கிறான்.”
