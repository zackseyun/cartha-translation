base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/032.yaml
  text: We are twelve brothers[a], sons of our father. One is no more[b], and the youngest is with our father today in the land of Canaan.
translation:
  language: ta
  text: “நாங்கள் பன்னிரண்டு சகோதரர்கள், எங்கள் தந்தையின் மகன்கள். ஒருவன் இல்லை[a]. எங்களில் இளையவன் இன்று கானான் நாட்டில் எங்கள் தந்தையுடன் இருக்கிறான்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எழுத்துப்படி, “ஒருவன் இல்லை.” எபிரேய மொழியில் வரும் இந்த வழக்கு ஒருவர் காணப்படாமல் இருக்கிறார், போய்விட்டார், அல்லது இறந்துவிட்டதாகக் கருதப்படுகிறார் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵים עָשָׂר אֲנַחְנוּ אַחִים
  choice: நாங்கள் பன்னிரண்டு சகோதரர்கள்
  rationale: வினைச்சொல் இல்லாத எபிரெய வாக்கியத்தை இயல்பான நவீனத் தமிழில் வழங்குகிறது; எண்ணிக்கையையும் உடன்பிறந்த ஆண்கள் என்ற பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: בְּנֵי אָבִינוּ
  choice: எங்கள் தந்தையின் மகன்கள்
  rationale: முந்தைய ‘சகோதரர்கள்’ என்பதற்கு விளக்கமாக வரும் இணைச்சொற்றொடரைப் பாதுகாக்கிறது; இடைக்கோடு அந்த விளக்க உறவைத் தெளிவாக்குகிறது.
- source_word: הָאֶחָד אֵינֶנּוּ
  choice: எங்களில் ஒருவன் இல்லை
  rationale: எபிரெய மொழிவழக்கின் திட்டமிடப்பட்ட தெளிவின்மையைத் தமிழிலும் காக்கிறது. இது அவன் காணப்படவில்லை, போய்விட்டான், அல்லது இறந்துவிட்டதாகக் கருதப்படுகிறான் ஆகிய நிழற்பொருள்களைத் தாங்கக்கூடும்.
- source_word: וְהַקָּטֹן
  choice: இளையவன்
  rationale: சகோதரர்களின் வரிசையைப் பற்றிய சூழலில் ‘சிறியவன்’ என்பதைவிட ‘இளையவன்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: எபிரெய காலச் சொல்லை நேரடியாகப் பாதுகாக்கிறது; ‘இப்போது’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: אֶת אָבִינוּ
  choice: எங்கள் தந்தையுடன்
  rationale: இங்கு אֶת உடனிருப்பைக் குறிக்கிறது; அதனால் தமிழில் ‘உடன்’ என்பது இயல்பான இணைவு.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: கானான் நாட்டில்
  rationale: ‘நாடு/தேசம்’ என்ற எபிரெய கூறைத் தக்கவைத்தபடி இயல்பான தமிழ்ச் சொல்லமைப்பை வழங்குகிறது.
theological_decisions:
- issue: אֵינֶנּוּ என்பதன் பொருள்—இல்லாமையா அல்லது மரணமா
  choice: எங்களில் ஒருவன் இல்லை
  alternative: எங்களில் ஒருவன் இறந்துவிட்டான்
  rationale: சகோதரர்கள் யோசேப்பை இறந்தவன் எனக் கருதியிருக்கலாம்; இருப்பினும் எபிரெய வாசகம் மரணத்தை வெளிப்படையாகச் சொல்லவில்லை. எனவே மூலத்தின் ambiguity பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. முதல் வாக்கியத்தின் விளக்க இணைப்பைத் தெளிவாக்க இடைக்கோடு இடப்பட்டுள்ளது; மூலத்தில் உள்ள மரணம் குறித்த தெளிவின்மை தீர்த்துவைக்கப்படவில்லை.
