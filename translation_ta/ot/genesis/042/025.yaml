base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/025.yaml
  text: Then Joseph gave orders to fill their containers with grain[a], to return each man's silver to his sack, and to give them provisions for the journey[d][c][b]. And so it was done for them.
translation:
  language: ta
  text: பின்பு யோசேப்பு, அவர்களுடைய கொள்கலன்களைத் தானியத்தால் நிரப்பவும், ஒவ்வொருவனுடைய வெள்ளியையும் அவனவன் சாக்கில் திருப்பி வைக்கவும், பயணத்திற்குத் தேவையான உணவுப்பொருள்களை அவர்களுக்குக் கொடுக்கவும் கட்டளையிட்டான்.[a][b] அவர்களுக்கு அவ்வாறே செய்யப்பட்டது.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கொள்கலன்கள்’ என்பதற்குப் பதிலாக ‘கலன்கள்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் பரந்த பொருளுடையது; வசனத்தின் பின்னர் ‘சாக்கு’ என்பதற்கு வேறொரு சொல் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘வெள்ளி’ என்பது இச்சூழலில் ‘பணம்’ என்றும் பொருள்படும்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அவன் அவர்களுக்கு அவ்வாறே செய்தான்.’ எபிரெய வாக்கியத்தில் செய்பவர் பெயரால் குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டான்
  rationale: צוה என்பது கட்டளை பிறப்பிப்பதைக் குறிக்கிறது. தொடர்ந்து வரும் நோக்கவினைகளுடன் ‘கட்டளையிட்டான்’ என்பது இயல்பான நவீனத் தமிழாக அமைகிறது.
- source_word: כְּלֵיהֶם
  choice: அவர்களுடைய கொள்கலன்கள்
  rationale: כְּלִי என்பது பொருள்களை வைக்கும் கலன் அல்லது கொள்கலன் என்ற பரந்த பொருளுடையது. வசனத்தின் பின்னர் வரும் שַׂק என்பதிலிருந்து இதன் வேறுபாட்டைப் பேண இங்கு பொதுவான சொல் பயன்படுத்தப்பட்டது.
- source_word: בָּר
  choice: தானியம்
  rationale: பஞ்சகால எகிப்தியச் சூழலில் בָּר தானிய விளைபொருளைக் குறிக்கிறது; குறிப்பிட்ட ஒரு தானியவகையாக இதைச் சுருக்கவில்லை.
- source_word: כַּסְפֵּיהֶם
  choice: அவர்களுடைய வெள்ளி
  rationale: כֶּסֶף என்பதன் நேரடிப் பொருள் ‘வெள்ளி’; சூழலில் அது பணமாகப் பயன்படுத்தப்படுகிறது. கதையில் பின்னர் அவர்கள் வெள்ளியைக் கண்டுபிடிப்பது வலியுறுத்தப்படுவதால் concrete wording retained.
- source_word: אִישׁ אֶל שַׂקּוֹ
  choice: ஒவ்வொருவனுடைய வெள்ளியையும் அவனவன் சாக்கில்
  rationale: אִישׁ இங்கு பகிர்வுப் பொருளில் ‘ஒவ்வொருவன்’ என வருகிறது; சம்பந்தப்பட்டவர்கள் யோசேப்பின் சகோதரர்கள் என்பதால் ஆண்பால் தக்கவைக்கப்பட்டது. שַׂק குறிப்பாகச் சாக்கைக் குறிக்கிறது.
- source_word: צֵדָה לַדָּרֶךְ
  choice: பயணத்திற்குத் தேவையான உணவுப்பொருள்கள்
  rationale: צֵדָה என்பது வழிப்பயணத்துக்கான உணவு அல்லது தேவையான பொருள்களைக் குறிக்கிறது. இச்சூழலில் இயல்பாகப் புரியும் வகையில் உணவுப்பொருள்கள் என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: அவர்களுக்கு அவ்வாறே செய்யப்பட்டது
  rationale: எபிரெயத்தில் வினை ஒருமையில் இருந்தாலும் செய்பவர் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. செயலை நிறைவேற்றிய குறிப்பிட்ட நபரை வலியுறுத்தாமல், யோசேப்பின் கட்டளை நிறைவேற்றப்பட்டதைக் காட்டும் இயல்பான தமிழ்ச் செயலப்பாட்டு வடிவம் தேர்ந்தெடுக்கப்பட்டது.
