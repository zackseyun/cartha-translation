  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கதையாடல் தொடரை ‘பின்பு’ வெளிப்படுத்துகிறது; தேவையற்ற சொல் மீளுரைகள் தவிர்க்கப்பட்டுள்ளன.
