base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/026.yaml
  text: Then they loaded their grain onto their donkeys and went from there[a].
translation:
  language: ta
  text: பின்பு அவர்கள் தங்கள் தானியத்தைத் தங்கள் கழுதைகளின் மேல் ஏற்றிக்கொண்டு, அங்கிருந்து புறப்பட்டார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் உணவுப்பொருளை’ அல்லது ‘தாங்கள் வாங்கிய தானியத்தை.’ எபிரெயச் சொல் உணவுப் பொருட்களைக் குறிக்கலாம்; ஆனால் இச்சூழலில் அது எகிப்தில் வாங்கிய தானியத்தையே பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: ஏற்றிக்கொண்டு
  rationale: נשׂא என்பதன் அடிப்படைப் பொருள் ‘தூக்குதல்/சுமத்துதல்.’ பயணத்திற்காகப் பொருளைக் கழுதைகள்மேல் வைக்கும் இச்சூழலில், ‘ஏற்றிக்கொண்டு’ என்பது இயல்பான தமிழில் செயலைத் துல்லியமாகத் தெரிவிக்கிறது.
- source_word: שִׁבְרָם
  choice: தங்கள் தானியம்
  rationale: யோசேப்பின் கதையில் שֶׁבֶר என்பது பஞ்ச காலத்தில் எகிப்தில் பெற்ற தானியத்தைப் பொதுவாகக் குறிக்கிறது. ‘தானியம்’ சூழலுக்குப் பொருத்தமானதும் சுருக்கமானதும் ஆகும்; சொல்லின் விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַל חֲמֹרֵיהֶם
  choice: கழுதைகள்மேல்
  rationale: עַל என்பது இங்கு சரக்கை விலங்குகள்மேல் ஏற்றுவதைச் சுட்டுகிறது. உடைமைப் பொருள் ஏற்கெனவே ‘தங்கள் தானியத்தை’ என்பதிலும் வினைமுற்றின் எழுவாயிலும் தெளிவாக இருப்பதால், இயல்பான தமிழுக்காக ‘தங்கள்’ மீண்டும் சேர்க்கப்படவில்லை.
- source_word: וַיֵּלְכוּ מִשָּׁם
  choice: அங்கிருந்து புறப்பட்டார்கள்
  rationale: הלך மற்றும் מִשָּׁם இணைந்து அந்த இடத்தைவிட்டுச் சென்றதைக் குறிக்கின்றன. ‘அங்கிருந்து புறப்பட்டார்கள்’ என்பது கூடுதல் இலக்கையோ பயணவிவரத்தையோ சேர்க்காமல் இயல்பான நவீன தமிழில் அந்த இயக்கத்தை வெளிப்படுத்துகிறது.
