  text: And Abraham called the name of that place, “The LORD will provide,” as it is said to this day, “On the mountain of the LORD it will be provided.”
translation:
  language: ta
  text: ஆபிரகாம் அந்த இடத்திற்கு, “ஆண்டவர் காண்பார்”[a] என்று பெயரிட்டார். இன்றுவரை, “ஆண்டவரின் மலையில் காணப்படும்”[b] என்று கூறப்படுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “ஆண்டவர் காண்பார்” என்பதே இடத்தின் பெயர். இச்சூழலில் ‘காணுதல்’ என்பது தேவையை அறிந்து அதற்கானதை அளித்தல் அல்லது ஏற்பாடு செய்தல் என்ற பொருளையும் கொண்டிருக்கலாம்.
    reason: יִרְאֶה என்பதன் நேரடிப் பொருளையும் சூழல் தரும் ‘அளித்தல்/ஏற்பாடு செய்தல்’ உட்பொருளையும் காக்கிறது.
  - marker: b
    text: எபிரெய வினை நிஃபால் வடிவத்தில் உள்ளது; “காணப்படும்” அல்லது “தோன்றும்” எனப் பொருள்படலாம். வெளிப்படையான எழுவாய் இல்லாததால், இது ஆண்டவரைக் குறிக்கலாம் என்றும், சூழலின்படி ‘அது அளிக்கப்படும்’ என்றும் விளக்கப்படலாம்.
    reason: יֵרָאֶה-யின் இலக்கண வடிவம், மறைமுக எழுவாய், மற்றும் முதல் வாக்கியத்தின் ‘காண்பார்’ என்பதுடனான சொல்விளையாட்டை பாதுகாக்கிறது.
lexical_decisions:
- source_word: יְהוָה יִרְאֶה (YHWH yirʾeh)
  choice: “ஆண்டவர் பார்த்துக்கொள்வார்”
  rationale: יִרְאֶה என்பதன் நேரடிப் பொருள் ‘பார்ப்பார்’; இச்சூழலில் அது தேவையைப் பார்த்து அளிப்பதையும் குறிக்கிறது. ‘பார்த்துக்கொள்வார்’ என்பது தமிழில் ‘காண்பார்’ என்ற அடிப்படை எண்ணத்தையும் ‘தேவையை வழங்குவார்’ என்ற சூழற்பொருளையும் இயல்பாக இணைக்கிறது.
- source_word: יֵרָאֶה (yērāʾeh)
  choice: “அவர் காணப்படுவார்”
  rationale: இது ראה (‘காண்’) என்ற வேர்ச்சொல்லின் நிஃபால் வடிவம்; இலக்கணப்படி ‘காணப்படுவார்/தோன்றுவார்’ எனப் பொருள்படலாம். முந்தைய சொல்லுடன் உள்ள எபிரெயச் சொல்விளையாட்டைப் பாதுகாக்க ‘வழங்கப்படும்’ என்று மட்டும் பொருள் விரிவாக்கம் செய்யப்படவில்லை.
- source_word: שֵׁם הַמָּקוֹם הַהוּא
  choice: “அந்த இடத்திற்கு … என்று பெயரிட்டார்”
  rationale: ‘அந்த இடத்தின் பெயரை அழைத்தார்’ என்ற எபிரெய மரபுத்தொடருக்கு இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: עַד־הַיּוֹם / הַיּוֹם
  choice: “இன்றுவரை”
  rationale: இங்கு சொல்லப்பட்டு வந்த பழமொழி அல்லது வழக்குச் சொல்லின் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ראה என்ற வேர்ச்சொல்லில் ‘காணுதல்’ மற்றும் ‘தேவையை வழங்குதல்’ ஆகிய பொருள்களின் உறவு
  choice: இடப்பெயரில் “பார்த்துக்கொள்வார்”; பழமொழியில் “காணப்படுவார்”
  alternative: இரண்டிலும் முறையே “வழங்குவார்”, “வழங்கப்படும்” என்று மொழிபெயர்த்தல்
  rationale: ஆதியாகமம் 22:8, 13 ஆகியவற்றின் சூழல் தேவன் பலிக்குரியதை அளித்ததைக் காட்டுகிறது; அதேவேளை எபிரெய உரை ‘காண்’ என்ற ஒரே வேரின் செயப்பாட்டு மற்றும் செயப்பாட்டெதிர் வடிவங்களைப் பயன்படுத்துகிறது. தேர்ந்த மொழிபெயர்ப்பு சூழற்பொருளையும் மூலத்தின் சொல்விளையாட்டையும் பாதுகாக்கிறது.
- issue: יֵרָאֶה என்பதின் மறைமுக எழுவாய்
  choice: “அவர் காணப்படுவார்” என்று இறைவனை எழுவாயாகக் கொண்ட வாசிப்பை முதன்மைப்படுத்தல்
  alternative: “அது காணப்படும்” அல்லது “அது வழங்கப்படும்”
  rationale: எபிரெய வினையில் பாலினம் ஆண்பால் ஒருமை என்றாலும் வெளிப்படையான எழுவாய் இல்லை. ‘அவர்’ என்பது ஆண்டவரைக் குறிக்கும் சாத்தியமான இயல்பான வாசிப்பு; மாற்று விளக்கங்கள் அடிக்குறிப்பில் திறந்தவையாக வைக்கப்படுகின்றன.
- issue: יהוה என்ற இறைப்பெயர்
  choice: “ஆண்டவர்”
  alternative: “யெகோவா” அல்லது “யாவே”
  rationale: நவீனத் தமிழில் வாசிக்க ஏற்ற, மரியாதைமிக்க பிரதிநிதிப் பெயர்; குறிப்பிட்ட உச்சரிப்பு மீள்கட்டமைப்பை உரைக்குள் கட்டாயப்படுத்தாது.
translation_notes:
  register: மொழிநடை நவீனத் தரத் தமிழாகவும், பொதுவாசகர்களுக்குப் புரியும் வகையிலும், அதேவேளை வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘பார்த்துக்கொள்வார்’ என்பது பேச்சுவழக்காகத் தாழாமல், தமிழில் பராமரிப்பு மற்றும் ஏற்பாடு ஆகிய இரண்டையும் இயல்பாக உணர்த்துகிறது.
