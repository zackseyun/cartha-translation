source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח אַבְרָהָם֙ אֶת יָד֔/וֹ וַ/יִּקַּ֖ח אֶת הַֽ/מַּאֲכֶ֑לֶת לִ/שְׁחֹ֖ט אֶת בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/010.yaml
  text: Then Abraham reached out his hand and took the knife to slaughter his son[a][b].
translation:
  language: ta
  text: அப்போது ஆபிரகாம் தன் கையை நீட்டி, தன் மகனை அறுப்பதற்காக[a] கத்தியை எடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘அறுப்பது’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெய வினைச்சொல், பொதுவாகக் ‘கொல்வது’ என்பதைக் காட்டிலும் குறிப்பானது; பலிக்காக அறுக்கும் பொருள்நயத்தையும் அது கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶת־יָדוֹ
  choice: தன் கையை நீட்டி
  rationale: இந்தச் சூழலில் வினைச்சொல் கையை அனுப்புவதைக் குறிக்காமல், அதை முன்னோக்கி நீட்டுவதைக் குறிக்கிறது. இந்தத் தமிழ் நடை செயலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וַיִּקַּח
  choice: எடுத்தார்
  rationale: எளிய தொடர் நிகழ்வைச் சுட்டும் பொதுவான வினைச்சொல்; பிடித்துக்கொண்டார் போன்ற மிகைப்படுத்திய நுட்பத்தைச் சேர்க்கவில்லை.
- source_word: הַמַּאֲכֶלֶת
  choice: கத்தியை
  rationale: வெட்டுவதற்கும் அறுப்பதற்கும் பயன்படும் கருவியைக் குறிக்கும் சொல்லுக்கு, இச்சூழலில் இயல்பாகப் புரியும் பொதுத் தமிழ் இணை இது.
- source_word: לִשְׁחֹט
  choice: அறுப்பதற்காக
  rationale: பொதுவான ‘கொல்வது’ என்பதைக் காட்டிலும் எபிரெய வினைச்சொல் குறிப்பாக அறுப்பதைக் குறிக்கிறது; பலியிடும் சூழலின் கடுமையையும் சாத்தியமான சடங்குசார் நயத்தையும் இது காக்கிறது.
- source_word: בְּנוֹ
  choice: தன் மகனை
  rationale: எழுவாய் ஆபிரகாம் என்பதால், உரிமைத் தொடர்பை இயல்பான தமிழில் தெளிவுபடுத்த ‘தன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַ
  choice: அப்போது
  rationale: வாவ் தொடர்வினை கதையின் அடுத்தடுத்த நகர்வைக் குறிக்கிறது; ‘அப்போது’ அந்த நிகழ்வுத் தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: שָׁחַט என்ற வினையின் பலிசார்ந்த நயத்தை மொழிபெயர்ப்பில் காப்பது
  choice: அறுப்பதற்காக
  alternative: கொல்வதற்காக
  rationale: ‘அறுப்பது’ என்பது பொதுவான கொலையைவிட குறிப்பானது; பலியிடும் சூழலோடு தொடர்புடைய மூலச்சொல்லின் சடங்குசார் மற்றும் உணர்ச்சிசார் வலிமையைப் பிற்காலக் கோட்பாடுகளைச் சேர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தன் கையை நீட்டி’ என்பது மூலத்தின் உடல்சார் செயலை இயல்பாகக் காக்கிறது; ‘அறுப்பதற்காக’ என்பது வசனத்தின் கடுமையையும் பலிசார்ந்த நயத்தையும் மென்மைப்படுத்தாமல் தருகிறது.
