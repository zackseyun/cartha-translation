  text: After these things, it was reported to Abraham, saying, “Look, Milcah also has borne sons to your brother Nahor:”
translation:
  language: ta
  text: 'இவற்றுக்குப் பின்பு ஆபிரகாமுக்கு இவ்வாறு அறிவிக்கப்பட்டது: “இதோ, மில்க்காளும் உன் சகோதரன் நாகோருக்கு மகன்களைப் பெற்றிருக்கிறாள்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: இவற்றுக்குப் பின்பு
  rationale: எபிரெயச் சொற்றொடரின் காலத் தொடர்பை இயல்பான நவீன தமிழில் சுருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: וַיֻּגַּד לְאַבְרָהָם לֵאמֹר
  choice: 'ஆபிரகாமுக்கு ஒரு செய்தி அறிவிக்கப்பட்டது:'
  rationale: செயப்பாட்டு வடிவத்தைப் பேணுகிறது; לֵאמֹר என்பதை தமிழில் இயல்பாக நேரடி கூற்றை அறிமுகப்படுத்தும் இரட்டைப்புள்ளியால் வெளிப்படுத்துகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சுட்டிடைச்சொல்லின் உரையாடல் வலிமையைப் பேணுகிறது.
- source_word: יָלְדָה ... בָּנִים
  choice: மகன்களைப் பெற்றிருக்கிறாள்
  rationale: வினையின் நிறைவு நிலையையும் בָּנִים என்பதன் ஆண்பால் பன்மை அர்த்தத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: מִלְכָּה
  choice: மில்காள்
  rationale: எபிரெயப் பெயரின் ஒலிவடிவத்தைத் தமிழில் நெருக்கமாகக் கடத்துகிறது.
- source_word: נָחוֹר
  choice: நாகோர்
  rationale: எபிரெயப் பெயரின் ஒலிவடிவத்தையும் தமிழில் வழக்கமான வேதாகமப் பெயரமைப்பையும் இணைக்கிறது.
- source_word: אָחִיךָ
  choice: உன் சகோதரன்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை உடைமையை நேரடியாகப் பேணுகிறது.
