source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֵלָ֜י/ו מַלְאַ֤ךְ יְהוָה֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֖אמֶר אַבְרָהָ֣ם אַבְרָהָ֑ם וַ/יֹּ֖אמֶר הִנֵּֽנִ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/011.yaml
  text: But the angel of Yahweh called to him from heaven and said[a], “Abraham, Abraham!” And he said[b], “Here I am.”
translation:
  language: ta
  text: அப்போது யாவேயின் தூதர்[a] வானத்திலிருந்து[b] அவரை அழைத்து, “ஆபிரகாமே, ஆபிரகாமே!” என்றார். அதற்கு அவர், “இதோ, நான் இருக்கிறேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் מַלְאָךְ என்பதற்கு ‘தூதர்’ என்றும் ‘வானதூதர்’ என்றும் பொருள் உண்டு; இங்கு அவர் வானத்திலிருந்து பேசுவதால் ‘வானதூதர்’ என்ற பொருள் பொருத்தமாக உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுருவாக ‘வானங்களிலிருந்து’; தமிழின் இயல்பான வழக்குப்படி ‘வானத்திலிருந்து’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்து
  rationale: இந்தக் கதைச் சூழலில் קרא என்பது ஒருவரை நோக்கிக் குரல் கொடுத்து அழைப்பதைக் குறிக்கிறது; ‘அழைத்து’ என்பது இயல்பான தமிழாக்கம்.
- source_word: אֵלָיו
  choice: அவரை
  rationale: אֶל என்பதன் திசைநோக்கிய பொருளைத் தமிழில் ‘அவரை அழைத்து’ என்ற இயல்பான வினைத்தொடர் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאָךְ என்பது ‘தூதர்’ அல்லது சூழலின்படி ‘வானதூதர்’ எனப் பொருள்படலாம். வானத்திலிருந்து பேசும் சூழல் வானதூதர் என்ற புரிதலை ஆதரித்தாலும், ‘தூதர்’ என்ற சொல் மூலத்தின் பொருள் விரிவைத் தக்கவைக்கிறது. יהוה என்பது தனிப்பட்ட இறைப் பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: מִן הַשָּׁמַיִם
  choice: வானத்திலிருந்து
  rationale: שָׁמַיִם வடிவில் பன்மையாக இருந்தாலும் இச்சூழலில் வானுலகைக் குறிக்கும் வழக்குச் சொல்; நவீன தமிழில் ‘வானத்திலிருந்து’ இயல்பாக உள்ளது.
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: אָמַר என்பது பொதுவான பேச்சுவினை; நேரடி உரைக்குப் பின் ‘என்றார்’ என்பது இயல்பான தமிழ் கதைநடை.
- source_word: אַבְרָהָם אַבְרָהָם
  choice: ஆபிரகாமே, ஆபிரகாமே!
  rationale: பெயரின் இரட்டிப்பு அவசரத்தையும் நேரடியான தனிப்பட்ட அழைப்பையும் வெளிப்படுத்துகிறது; தமிழ் விளிவேற்றுமை ‘-ஏ’ அழைப்பை இயல்பாக்குகிறது.
- source_word: הִנְנִי
  choice: இதோ, நான் இருக்கிறேன்
  rationale: הִנְנִי என்பது ஒருவரின் உடனிருப்பையும் பதிலளிக்கத் தயாராக இருப்பதையும் தெரிவிக்கும் மரபான பதில். ‘இதோ’ அதன் கவனஈர்ப்பு நுணுக்கத்தையும் ‘நான் இருக்கிறேன்’ அதன் நேரடிப் பொருளையும் தக்கவைக்கின்றன.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரான יהוה நேரடியாக உள்ளது. பொதுப்பட்டத்தால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: מַלְאַךְ יְהוָה என்பதை யாவேயே வெளிப்பட்டதாக விளக்கமாக மொழிபெயர்க்க வேண்டுமா
  choice: யாவேயின் தூதர்
  alternative: யாவேயின் வெளிப்பாடு
  rationale: மூலம் ‘தூதர்’ என்றே கூறுகிறது; அந்தத் தூதரின் துல்லியமான இயல்பை இவ்வசனம் விளக்கவில்லை. ஆகவே கூடுதல் இறையியல் அடையாளத்தை உரைக்குள் சேர்க்காமல் உள்ள பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. மரியாதைப் பன்மை வினைமுற்றுகள் இரு பேச்சாளர்களுக்கும் இயல்பான தமிழ்ச் சொல்லாடலுக்காகப் பயன்படுத்தப்பட்டுள்ளன; மூலத்தில் உள்ள பெயரிரட்டிப்பும் பதிலின் நேரடித் தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
