  text: וַ/יֹּ֕אמֶר בִּ֥/י נִשְׁבַּ֖עְתִּי נְאֻם יְהוָ֑ה כִּ֗י יַ֚עַן אֲשֶׁ֤ר עָשִׂ֨יתָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/לֹ֥א חָשַׂ֖כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/016.yaml
  text: and said[a], “By myself I have sworn, declares Yahweh, because you have done this thing and have not withheld your son[b], your only son,”
translation:
  language: ta
  text: 'அவர் சொன்னார்: “என்னை வைத்தே நான் ஆணையிட்டிருக்கிறேன்; யாவே அறிவிக்கிறார்: நீ இந்தக் காரியத்தைச் செய்து, உன் மகனை, உன் ஒரே மகனை[a], கொடுக்க மறுக்காததால்[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உனக்குத் தனித்துவமான மகனை” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் “ஒரே” அல்லது “தனித்துவமான” என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தடுத்து வைக்காததால்” அல்லது, இச்சூழலில், “தப்புவிக்காததால்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவர் சொன்னார்
  rationale: தொடரும் எபிரெயக் கதைநடையை இயல்பான தமிழில் எடுத்துரைக்கிறது; சூழலில் தெளிவாக உள்ள ஆண்பால் எழுவாயையும் வெளிப்படுத்துகிறது.
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: என்னை வைத்தே ஆணையிட்டு நான் சத்தியம் செய்திருக்கிறேன்
  rationale: தம்மையே சத்தியத்தின் உத்தரவாதமாகக் கொள்ளும் எபிரெய உறுதிமொழி மரபையும், நிறைவேறிய செயல் தற்போது செல்லுபடியாக இருப்பதையும் காக்கிறது.
- source_word: נְאֻם יְהוָה
  choice: இது யாவே அளிக்கும் அறிவிப்பு
  rationale: נְאֻם என்பதன் அதிகாரமிக்க தெய்வீக அறிவிப்பு இயல்பைத் தக்கவைத்து, יהוה என்ற தனிப்பெயரைத் தலைப்பாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: כִּי יַעַן אֲשֶׁר
  choice: …தால்
  rationale: வலியுறுத்தப்பட்ட காரணத் தொடர்பை இயல்பான தமிழ் காரண விகுதி மூலம் வெளிப்படுத்துகிறது; அதன் விளைவு அடுத்த வசனத்தில் தொடர்வதையும் திறந்த நிலையில் வைக்கிறது.
- source_word: עָשִׂיתָ אֶת־הַדָּבָר הַזֶּה
  choice: நீ இந்தக் காரியத்தைச் செய்து
  rationale: דָּבָר இங்கு ஆபிரகாமின் செயலைக் குறிப்பதால், ‘இந்தக் காரியம்’ தெளிவும் மரியாதையான நடையும் கொண்டது.
- source_word: וְלֹא חָשַׂכְתָּ
  choice: கொடுக்காமல் வைத்துக்கொள்ளாததால்
  rationale: ‘தடுத்து வைத்தல்/விலக்கி வைத்தல்’ என்ற வினையின் மையப் பொருளைத் தருகிறது; ‘இரக்கம் காட்டவில்லை’ போன்ற அதிக விளக்கமான பொருளை முதன்மை உரையில் புகுத்தவில்லை.
- source_word: בִּנְךָ אֶת־יְחִידְךָ
  choice: உன் மகனை, உன் ஒரே மகனை
  rationale: எபிரெயச் சொற்றொடரின் இணைவிளக்க வலியுறுத்தலைத் தெளிவான தமிழில் காக்கிறது. ‘ஒரே’ என்பது எண்ணிக்கையிலும் தனித்தன்மையிலும் உள்ள பொருள் நிழல்களைத் திறந்தவையாக வைக்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், நவீன ஆய்வில் பரவலாக ஏற்றுக்கொள்ளப்படும் உச்சரிப்புக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- issue: יְחִידְךָ என்பதிலுள்ள ‘ஒரே/தனித்துவமான’ பொருள்
  choice: உன் ஒரே மகனை
  alternative: உனக்குத் தனித்துவமானவனை / உன் அருமை மகனை
  rationale: ஈசாக்கின் தனித்த நிலையை உரை வலியுறுத்தினாலும், ‘அருமை/அன்புக்குரிய’ என்று உணர்ச்சிப் பொருளை மட்டும் முன்னிறுத்தாமல் மூலத்தின் பொருள் பரப்பை காக்கிறது.
- issue: காரண வாக்கியம் அடுத்த வசனத்தில் நிறைவுறுதல்
  choice: ‘…தால்,’ என்று வசனத்தைத் திறந்த நிலையில் முடித்தல்
  alternative: அடுத்த வசனத்தின் வாக்குறுதியை இங்கே சேர்த்து வாக்கியத்தை நிறைவு செய்தல்
  rationale: மசோரெட்டிக் வசனப் பிரிவையும் எபிரெய வாக்கியத்தின் தொடர்ச்சியையும் காக்கிறது; தனியே வாசிக்கும்போது உள்ள இலக்கணத் திணறலை செயற்கையாகத் தீர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. தெய்வீக அறிவிப்பின் மேன்மைக்காக ஓரளவு முறையான சொற்கள் வைக்கப்பட்டுள்ளன; அதேவேளையில் தேவையற்ற பழந்தமிழ் அல்லது சமயப் பிரிவுக்குரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன. வசனம் அடுத்த வசனத்தில் தொடரும் காரணக் கட்டமைப்பாகவே விடப்பட்டுள்ளது.
