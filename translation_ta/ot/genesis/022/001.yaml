source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וְ/הָ֣/אֱלֹהִ֔ים נִסָּ֖ה אֶת אַבְרָהָ֑ם וַ/יֹּ֣אמֶר אֵלָ֔י/ו אַבְרָהָ֖ם וַ/יֹּ֥אמֶר הִנֵּֽנִ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/001.yaml
  text: After these things[a], God tested Abraham and said to him, “Abraham!” And he said[b], “Here I am.”
translation:
  language: ta
  text: இவற்றுக்குப் பிறகு, கடவுள் ஆபிரகாமைச் சோதித்தார். அவர் அவனிடம், “ஆபிரகாமே!” என்றார். அதற்கு அவன், “இதோ, நான் இருக்கிறேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: இவற்றுக்குப் பிறகு
  rationale: וַיְהִי இங்கு கதைப்போக்கின் புதிய கட்டத்தை அறிமுகப்படுத்துகிறது; தமிழில் தனியாக மொழிபெயர்த்தால் தேவையற்ற கனமான நடையாகிவிடும். דְּבָרִים என்பதன் பரந்த பொருளைச் சுருக்காமல் ‘இவை’ என்று இயல்பாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: הָאֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு பொதுவான இறைச்சொல் பயன்படுத்தப்பட்டுள்ளது; இது יהוה என்ற தனிப்பெயர் அல்ல. ஆகவே நவீனத் தமிழில் இயல்பான ‘கடவுள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: נִסָּה
  choice: சோதித்தார்
  rationale: Piel வடிவிலுள்ள נסה ஒருவரைச் சோதித்து மெய்ப்பிப்பதைக் குறிக்கிறது. தீமை செய்யத் தூண்டும் பொருளை ஏற்படுத்தக்கூடிய ‘சபலப்படுத்தினார்’ போன்ற சொற்கள் தவிர்க்கப்பட்டுள்ளன.
- source_word: וַיֹּאמֶר אֵלָיו אַבְרָהָם
  choice: அவர் அவனிடம், “ஆபிரகாமே!” என்றார்
  rationale: אמר என்பதன் நேரடியான ‘சொன்னார்’ என்ற பொருளைத் தக்கவைத்தபடி, எபிரேய அழைப்புமுறையைத் தமிழின் ‘-ஏ’ விளியுருபால் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הִנֵּנִי
  choice: இதோ, நான் இருக்கிறேன்
  rationale: இந்தச் சொற்றொடர் வெறும் இருப்பிடத்தை மட்டுமல்லாமல், கவனத்துடன் பதிலளிக்கும் ஆயத்த நிலையையும் தெரிவிக்கிறது. ‘இதோ, அடியேன்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத பணிவுக் குறிப்பைச் சேர்க்கக்கூடும் என்பதால் தவிர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: கடவுளே எழுவாயாக வரும் נסה என்பதன் பொருள்
  choice: கடவுள் ஆபிரகாமைச் சோதித்தார்
  alternative: கடவுள் ஆபிரகாமைத் தீமைக்கு உட்படுத்த முயன்றார்
  rationale: இந்தச் சூழலில் வினைச்சொல் ஆபிரகாமைச் சோதித்து மெய்ப்பிப்பதைக் குறிக்கிறது; தீமை செய்யத் தூண்டுதல் என்ற கருத்தை மூல உரை கட்டாயப்படுத்தவில்லை. அதேவேளை, சோதனையின் கடுமையால் உருவாகும் கதையின் இறையியல் பதற்றம் விளக்கவுரையால் மென்மைப்படுத்தப்படவில்லை.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு நெருக்கமான, எளிதில் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளைக் குறிக்க ‘அவர்/என்றார்’ என்றும் ஆபிரகாமைக் குறிக்க ‘அவன்/என்றான்’ என்றும் கூறுவது தமிழில் பேச்சாளர்களைத் தெளிவுபடுத்துகிறது; மூலத்தின் நிகழ்வுகளுக்கு மேலான விளக்கம் சேர்க்கப்படவில்லை.
