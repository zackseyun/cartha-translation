  source_fidelity: மூல எபிரேயத்தின் நிகழ்வுவரிசை, ‘இவற்றுக்குப் பிறகு’ என்ற காலத் தொடர்பு, הָאֱלֹהִים-க்கு ‘கடவுள்,’ נסה-க்கு ‘சோதித்தார்,’ பெயரழைப்பு, மற்றும் הִנֵּנִי-யின் பதிலளிக்கும் உணர்வு ஆகியவை நம்பகமாகத் தரப்பட்டுள்ளன. וַיְהִי-யைத் தமிழில் தனியாகக் கொடுக்காமல் விட்டிருப்பது இச்சூழலில் இயல்பானது.
