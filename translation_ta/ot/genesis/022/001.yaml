  terminology: ‘கடவுள்,’ ‘சோதித்தார்,’ ‘ஆபிரகாமே’ ஆகியவை நிலையான, இயல்பான தேர்வுகள். ‘சோதித்தார்’ என்பது இவ்விடத்தில் ‘தீமைக்குத் தூண்டினார்’ என்ற பொருளைத் தவிர்த்து נסה-யின் பொருளைச் சரியாகத் தருகிறது. பெயரும் இறைவனுக்கான மரியாதைப் பன்மை வினைமுறையும் சீராக உள்ளன.
