translation:
  language: ta
  text: அவனுடைய முதற்பேறான மகன் ஊத்ஸையும், அவனுடைய சகோதரனான பூஸையும், ஆராமின் தந்தையான கேமுவேலையும் பெற்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ע֥וּץ
  choice: ஊத்ஸ்
  rationale: எபிரேயப் பெயரின் இறுதியில் உள்ள צ ஒலியைத் தக்கவைக்கும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בְּכֹר֖וֹ
  choice: அவனுடைய முதற்பேறான
  rationale: בכור என்பது வயதில் மூத்தவன் என்று மட்டும் அல்லாமல் பிறப்பு வரிசையில் முதலில் பிறந்த மகனைக் குறிக்கிறது; ‘முதற்பேறு’ அந்த மரபுவழிப் பொருளையும் தக்கவைக்கிறது.
- source_word: בּ֣וּז
  choice: பூஸ்
  rationale: எபிரேய தனிப்பெயர் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டது.
- source_word: אָחִ֑יו
  choice: ஊத்சின் சகோதரனான
  rationale: எபிரேய வாக்கியத்தில் வரும் ‘அவனுடைய சகோதரன்’ என்பது உடனடியாக முன்வரும் ஊத்சைக் குறிப்பதாக இயல்பாகப் புரிகிறது; தமிழில் சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்க பெயர் மீண்டும் கூறப்பட்டது.
- source_word: קְמוּאֵ֖ל
  choice: கேமுவேல்
  rationale: எபிரேய தனிப்பெயரின் ஒலிக்கு நெருக்கமான தமிழ் வடிவம்.
- source_word: אֲבִ֥י
  choice: தந்தையான
  rationale: நேரடியான மரபுவழிப் பொருள் ‘தந்தை’; வம்சப் பட்டியல்களில் இது முன்னோர் அல்லது மூதாதை என்ற விரிந்த பொருளையும் கொள்ளக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: אֲרָֽם
  choice: ஆராம்
  rationale: உரை பெயரை மட்டுமே தருவதால், இனத்தையோ நிலப்பகுதியையோ விளக்கமாகச் சேர்க்காமல் தனிப்பெயராக ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: אֲבִי אֲרָם என்பதன் வம்சவழிப் பொருள்
  choice: ஆராமின் தந்தையான கேமுவேல்
  alternative: ஆராமின் மூதாதையான கேமுவேல்
  rationale: எபிரேயத் தொடரின் நேரடிப் பொருள் ‘ஆராமின் தந்தை’ என்பதாகும். எனினும், வம்சப் பட்டியல்களில் ‘தந்தை’ என்பது முன்னோர் அல்லது ஒரு வம்சத்தின் தொடக்க நபரைக் குறிக்கவும் முடியும்; இந்த உண்மையான பொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடையில் மொழிபெயர்க்கப்பட்டது. இது முந்தைய வசனத்தில் தொடங்கிய ‘பெற்றாள்’ என்ற வினையின் பட்டியலைத் தொடர்வதால், வாக்கிய முடிவில் அந்த வினை சேர்க்கப்பட்டுள்ளது. தெளிவுக்காக ‘அவனுடைய சகோதரன்’ என்பதற்குப் பதிலாக ‘ஊத்சின் சகோதரன்’ என்று கூறப்பட்டுள்ளது.
