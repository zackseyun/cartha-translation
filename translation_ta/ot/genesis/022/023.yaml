  yaml_path: translation/ot/genesis/022/023.yaml
  text: And Bethuel fathered Rebekah. These eight Milcah bore to Nahor[a], Abraham’s brother.
translation:
  language: ta
  text: மேலும், பெத்துவேல் ரெபெக்காளைப் பெற்றான். இந்த எட்டுப் பேரை மில்க்காள் ஆபிரகாமின் சகோதரனான நாகோருக்குப் பெற்றெடுத்தாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சொல்லமைப்புக்கு நெருக்கமாக: “ஆபிரகாமின் சகோதரனான நாகோருக்கு மில்க்காள் பெற்றெடுத்தவர்கள் இந்த எட்டுப் பேர்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְתוּאֵל
  choice: பெத்துவேல்
  rationale: வம்சவரலாற்றின் தொடர்ச்சியைத் தமிழின் இயல்பான வாக்கியத் தொடரே உணர்த்துவதால், ו தனியாக மொழிபெயர்க்கப்படவில்லை; பெயர் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது.
- source_word: יָלַד
  choice: பெற்றான்
  rationale: ஆண் எழுவாயுடன் வரும் வம்சவரலாற்றுச் சூழலில், ‘பெற்றான்’ என்பது தந்தையானதைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் சொல்.
- source_word: אֶת רִבְקָה
  choice: ரெபெக்காளை
  rationale: אֶת என்பது நேரடி செயப்படுபொருள் குறியீடு என்பதால் தனியே மொழிபெயர்க்கப்படவில்லை; ரִבְקָה வழக்கமான தமிழ் வடிவில் தரப்பட்டுள்ளது.
- source_word: שְׁמֹנָה אֵלֶּה
  choice: இந்த எட்டுப் பேரையும்
  rationale: எண்ணிக்கையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க ‘பேர்’ சேர்க்கப்பட்டுள்ளது; சூழலில் இவர்கள் முன்னர் பட்டியலிடப்பட்ட பிள்ளைகள் என்பது தெளிவு.
- source_word: יָלְדָה
  choice: பெற்றெடுத்தாள்
  rationale: பெண் எழுவாயுடன் வரும் יָלַד என்பதன் உடல்சார்ந்த பிறப்பித்தல் பொருளை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: מִלְכָּה
  choice: மில்காள்
  rationale: எபிரெயப் பெயரின் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְ/נָחוֹר
  choice: நாகோருக்கு
  rationale: வம்சவரலாற்றுச் சொல்லமைப்பில் לְ என்பது மில்காள் நாகோருக்குப் பிள்ளைகளைப் பெற்றெடுத்தாள் என்ற உறவைச் சுட்டுகிறது; தமிழில் ‘-க்கு’ இயல்பான இணை.
- source_word: אֲחִי אַבְרָהָם
  choice: ஆபிரகாமின் சகோதரனான
  rationale: இந்தக் கட்டமைப்பு நாகோரை ஆபிரகாமின் சகோதரன் என்று அடையாளப்படுத்துகிறது; பெயருக்கு முன்னால் வரும் தமிழ்ச் சார்பு வடிவம் தெளிவாகவும் இயல்பாகவும் உள்ளது.
