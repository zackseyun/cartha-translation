  register: நவீனச் செந்தமிழும் பொதுவழக்குத் தெளிவும் இணைந்த கண்ணியமான வம்சவரலாற்று நடை பயன்படுத்தப்பட்டது. இடைக்கோடுகள் எபிரெய மொழியின் ‘அவள் பெயர் ரெஊமா’ என்ற இணைநிலைச் சொல்லமைப்பைத் தெளிவாகக் காக்கின்றன.
