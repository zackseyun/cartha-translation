base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/024.yaml
  text: And his concubine[a], whose name was Reumah, also bore Tebah, Gaham, Tahash[b], and Maacah.
translation:
  language: ta
  text: அவனுடைய துணை மனைவி[a] (அவள் பெயர் ரெஊமா) அவளும்கூட தேபாக், காகாம், தாகாஷ், மாக்கா ஆகியோரைப் பெற்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய இரண்டாம் மனைவி”; எபிரேயச் சொல் முதன்மை மனைவியிலிருந்து சமூகச் சட்டநிலையில் வேறுபட்ட மனைவியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: அவனுடைய மறுமனையாட்டி
  rationale: פִּילֶגֶשׁ என்பது முழு மனைவியிலிருந்து சமூகச் சட்டநிலையில் வேறுபட்ட துணை மனைவி அல்லது மறுமனையாட்டியைக் குறிக்கிறது. நவீனத் தமிழில் அந்த வேறுபாட்டைச் சுருக்கமாகவும் கண்ணியமாகவும் காக்க ‘மறுமனையாட்டி’ பயன்படுத்தப்பட்டது.
- source_word: וּשְׁמָהּ רְאוּמָה
  choice: அவள் பெயர் ரெஊமா
  rationale: எபிரெய உரையின் இணைநிலை அமைப்பை இயல்பான தமிழில் காக்கிறது; ரְאוּמָה ஒலிபெயர்க்கப்பட்டது.
- source_word: וַתֵּלֶד
  choice: பெற்றாள்
  rationale: இந்த வம்சவரலாற்றுச் சூழலில் ילד என்பது குழந்தைகளைப் பெற்றெடுத்ததைக் குறிக்கிறது; ‘பெற்றாள்’ இயல்பானதும் சுருக்கமானதும் ஆகும்.
- source_word: גַּם הִוא
  choice: அவளும்கூட
  rationale: மில்காளைப் போல ரெஊமாவும் பிள்ளைகளைப் பெற்றாள் என்ற வெளிப்படையான எழுவாயையும் வலியுறுத்தலையும் காக்கிறது.
- source_word: טֶבַח וְגַחַם וְתַחַשׁ וּמַעֲכָה
  choice: தேபாக், காகாம், தாகாஷ், மாகா
  rationale: நபர்களின் பெயர்கள் எபிரெய வடிவங்களிலிருந்து நவீனத் தமிழ் ஒலிமுறைக்கு ஏற்றபடி ஒலிபெயர்க்கப்பட்டன.
