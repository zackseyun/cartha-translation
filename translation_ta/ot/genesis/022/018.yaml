source:
  edition: WLC
  text: וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֣י הָ/אָ֑רֶץ עֵ֕קֶב אֲשֶׁ֥ר שָׁמַ֖עְתָּ בְּ/קֹלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/018.yaml
  text: And in your offspring all the nations of the earth will be blessed[a], because you have obeyed my voice.
translation:
  language: ta
  text: உன் சந்ததியில் பூமியின் எல்லா நாடுகளும் ஆசீர்வதிக்கப்படும்[a]; ஏனெனில் நீ என் குரலுக்குக் கீழ்ப்படிந்தாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களைத் தாமே ஆசீர்வதித்துக்கொள்வார்கள்.” இங்குள்ள எபிரெய வினைச்சொல் தற்சுட்டுப் பொருளிலும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְבָּרֲכוּ
  choice: ஆசீர்வதிக்கப்படும்
  rationale: ברך என்பதன் ஹித்பயேல் வடிவம் இங்கு செயல்பாட்டு-பெறுபொருள் அல்லது தன்மறிவினை நுணுக்கத்தைக் கொண்டிருக்கலாம். முற்பிதாக்களுக்கான வாக்குறுதியின் சூழலில் ‘ஆசீர்வதிக்கப்படும்’ என்பது வாக்குறுதியின் இயல்பைத் தெளிவாகவும் இயல்பான தமிழிலும் தருகிறது; மாற்று தன்மறிவினைப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְזַרְעֲךָ
  choice: உன் சந்ததியில்
  rationale: זֶרַע என்பது ஒருமை வடிவிலுள்ள கூட்டுப்பெயராக ‘சந்ததி/வழித்தோன்றல்கள்’ எனப் பொருள்படும். ‘சந்ததி’ அதன் கூட்டுப்பொருளைக் காத்து, ב முன்னிடைச்சொல்லை ‘-இல்’ என்று நேரடியாக வெளிப்படுத்துகிறது; கருவிப்பொருளை தேவையின்றி நிர்ணயிப்பதில்லை.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: பூமியின் எல்லா நாடுகளும்
  rationale: גּוֹיִם என்பதற்கு இச்சூழலில் ‘நாடுகள்’ என்பது நேரடியான, இயல்பான இணைச்சொல். הָאָרֶץ இங்கு உலகளாவிய பரப்பைக் குறிப்பதால் ‘பூமியின்’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: עֵקֶב אֲשֶׁר
  choice: ஏனெனில்
  rationale: இந்தச் சொற்றொடர் வாக்குறுதி மீண்டும் உறுதிப்படுத்தப்படுவதற்கான காரணத்தை அறிமுகப்படுத்துகிறது. ‘ஏனெனில்’ அதன் காரணப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: שָׁמַעְתָּ בְּקֹלִי
  choice: நீ என் குரலுக்குக் கீழ்ப்படிந்தாய்
  rationale: שׁמע בקול என்பது வெறுமனே கேட்டலை அல்ல, கேட்டதற்கேற்ப கீழ்ப்படிதலைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘என் குரலுக்குக் கீழ்ப்படிந்தாய்’ என்பது அதன் மரபுத்தொடர் உருவத்தையும் செயல்முறைப் பொருளையும் காக்கிறது.
theological_decisions:
- issue: ברך என்பதன் ஹித்பயேல் வடிவத்தில் உள்ள ஆபிரகாமிய வாக்குறுதியின் பொருள்
  choice: 'நாடுகள் ஆபிரகாமின் சந்ததியில் ஆசீர்வாதம் பெறுவதாகச் சொல்லப்படுகிறது: ‘ஆசீர்வதிக்கப்படும்.’'
  alternative: 'நாடுகள் ஆபிரகாமின் சந்ததியை முன்மாதிரியாகக் கொண்டு தங்களை ஆசீர்வதித்துக்கொள்ளும்: ‘தங்களை ஆசீர்வதித்துக்கொள்வார்கள்.’'
  rationale: உடன்படிக்கை வாக்குறுதியின் சூழல் செயல்பாட்டு-பெறுபொருள் வாசிப்பை ஆதரிக்கிறது; அதேவேளையில் ஹித்பயேல் வடிவத்தின் தன்மறிவினைச் சாத்தியத்தை மறைக்காமல் அடிக்குறிப்பில் தருவது உண்மையான மொழியியல் மற்றும் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘சந்ததி’ கூட்டுப்பொருளையும் உடன்படிக்கைச் சொற்றொடரின் சுருக்கத்தையும் காக்கிறது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் இணைக்கப்பட்டுள்ளது.
