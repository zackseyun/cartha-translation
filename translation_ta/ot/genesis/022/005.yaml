  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified narrative register பயன்படுத்தப்பட்டுள்ளது. நேரடி உரை இயல்பாக அமைக்கப்பட்டாலும், எபிரெய மூலத்தின் பன்மை வினை மற்றும் விளக்கப்படாத பதற்றம் பாதுகாக்கப்பட்டுள்ளன.
