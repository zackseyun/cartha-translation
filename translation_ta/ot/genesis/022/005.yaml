base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/005.yaml
  text: And Abraham said to his young men[a], “Stay here with the donkey. I and the boy will go over there[b], and we will worship and return to you.”
translation:
  language: ta
  text: ஆபிரகாம் தன் இளைஞர்களிடம்[a], “நீங்கள் கழுதையோடு இங்கேயே இருங்கள். நானும் அந்தப் பையனும் அங்கே சென்று, வழிபட்டு[b], உங்களிடம் திரும்பி வருவோம்[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இளைஞர்கள்” என்பதற்கு “பணியாளர்கள்” அல்லது “உதவியாளர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “பணிந்துகொண்டு”; எபிரெய வினைச்சொல் வழிபாட்டில் உடலைத் தாழ்த்திப் பணிவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ஆபிரகாம் சொல்லர்த்தமாக, “நாங்கள் உங்களிடம் திரும்பி வருவோம்” என்று பன்மையில் கூறுகிறார். இது மறைத்துப் பேசுதலா, எதிர்பார்ப்பா, அல்லது கடவுள் ஏற்பாடு செய்வார் என்ற நம்பிக்கையா என்பதை உரை விளக்கவில்லை.
    reason: theological_ambiguity
lexical_decisions:
- source_word: נְעָרָיו
  choice: தன் இளைஞர்களிடம்
  rationale: இச்சொல் இளைஞர்கள், பணியாளர்கள் அல்லது உதவியாளர்கள் எனப் பொருள்படலாம். இங்கே ஆபிரகாமுடன் வந்த இருவரைக் குறிக்கிறது; மேலும் இதே வசனத்தில் ஈசாக்கைக் குறிக்கும் נַעַר என்பதுடனான சொல் தொடர்பையும் ஓரளவு காக்கிறது.
- source_word: שְׁבוּ לָכֶם פֹּה
  choice: நீங்கள் ... இங்கேயே இருங்கள்
  rationale: יָשַׁב என்பதன் அடிப்படைப் பொருள் உட்காருதல் அல்லது தங்கியிருத்தல். மற்றவர்கள் தொடர்ந்து வராமல் அங்கே இருக்க வேண்டும் என்ற கட்டளையை இயல்பான நவீனத் தமிழில் இது தெரிவிக்கிறது.
- source_word: עִם הַחֲמוֹר
  choice: கழுதையோடு
  rationale: חֲמוֹר என்பதற்கான நேரான, வழக்கமான நவீனத் தமிழ்ச் சொல் 'கழுதை'.
- source_word: וַאֲנִי וְהַנַּעַר
  choice: நானும் பையனும்
  rationale: இங்கே נַעַר ஈசாக்கைக் குறிக்கிறது. 'பையன்' என்பது ஆபிரகாமின் பார்வையையும் கதைச் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது; அவரது துல்லிய வயதை உரை நிர்ணயிப்பதில்லை.
- source_word: נֵלְכָה עַד כֹּה
  choice: அங்கே போய்
  rationale: அவர்கள் தற்போது உள்ள இடத்திலிருந்து வேறொரு சுட்டப்பட்ட இடத்துக்குச் செல்லும் நோக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְנִשְׁתַּחֲוֶה
  choice: பணிந்துகொண்டு
  rationale: שָׁחָה என்பது உடலைத் தாழ்த்திப் பணிதலைக் குறிக்கிறது; வழிபாட்டுச் சூழலில் வழிபடுதல் என்ற பொருளையும் தருகிறது. 'பணிந்துகொண்டு' உடல்சார் உருவகத்தையும் சமயச் சூழலையும் காக்கிறது.
- source_word: וְנָשׁוּבָה אֲלֵיכֶם
  choice: உங்களிடம் திரும்பி வருவோம்
  rationale: மூலத்தில் உள்ள முதலாம் நபர் பன்மையைத் தெளிவாகக் காக்கிறது. ஆபிரகாம் தானும் ஈசாக்கும் திரும்புவார்கள் என்றே இலக்கணரீதியாகக் கூறுகிறார்.
theological_decisions:
- issue: ஆபிரகாம் திரும்புவதைப் பன்மையில் கூறுதல்
  choice: “திரும்பி வருவோம்” என்ற தெளிவான பன்மையை அப்படியே வைத்தல்
  alternative: இது மறைத்துப் பேசுதல் என்றோ, ஈசாக்கும் உயிருடன் திரும்புவான் என்ற விசுவாச அறிக்கை என்றோ வெளிப்படையாக விளக்குதல்
  rationale: வழிபடுவதற்கும் திரும்புவதற்கும் எபிரெய உரை முதலாம் நபர் பன்மை வடிவங்களையே பயன்படுத்துகிறது. அது மறைத்துப் பேசுதலா, எதிர்பார்ப்பா, அல்லது கடவுளின் ஏற்பாட்டின்மீதான நம்பிக்கையா என்பதை வசனம் விளக்கவில்லை; ஆகவே அந்த இறையியல் பதற்றம் மொழிபெயர்ப்பில் தீர்க்கப்படவில்லை.
- issue: וְנִשְׁתַּחֲוֶה என்பதன் உடல்சார் மற்றும் வழிபாட்டுப் பொருள்
  choice: “பணிந்துகொண்டு”
  alternative: “வழிபட்டுவிட்டு”
  rationale: சொல்லின் அடிப்படை உடல்சார் பொருளை முதன்மை உரையில் காத்து, இச்சூழலில் அது வழிபாட்டைக் குறிக்கிறது என்பதை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
