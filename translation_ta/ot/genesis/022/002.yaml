source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר קַח נָ֠א אֶת בִּנְ/ךָ֨ אֶת יְחִֽידְ/ךָ֤ אֲשֶׁר אָהַ֨בְתָּ֙ אֶת יִצְחָ֔ק וְ/לֶךְ לְ/ךָ֔ אֶל אֶ֖רֶץ הַ/מֹּרִיָּ֑ה וְ/הַעֲלֵ֤/הוּ שָׁם֙ לְ/עֹלָ֔ה עַ֚ל אַחַ֣ד הֶֽ/הָרִ֔ים אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽי/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/002.yaml
  text: And he said[a], “Please take your son, your only one, whom you love—Isaac—and go to the land of Moriah, and offer him there as a burnt offering on one of the mountains that I will tell you.”
translation:
  language: ta
  text: அவர், “தயவுசெய்து, உன் மகனை—உனக்கு ஒரே ஒருவனான, நீ நேசிக்கிற ஈசாக்கை—எடுத்துக்கொண்டு மோரியா தேசத்திற்குப் போ. அங்கே நான் உனக்குச் சொல்லும் மலைகளில் ஒன்றின் மேல் அவனைத் தகனபலியாகச் செலுத்து” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָא
  choice: தயவுசெய்து
  rationale: கட்டளையுடன் வரும் வேண்டுகோள் அல்லது மரியாதை நயத்தை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது; இதை காலத்தைக் குறிக்கும் ‘இப்போது’ என்று மாற்றவில்லை.
- source_word: בִּנְךָ
  choice: உன் மகனை
  rationale: בֵּן என்பதையும் இரண்டாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: יְחִידְךָ
  choice: உன் ஒரே ஒருவனாகிய
  rationale: ஈசாக்கின் ஒப்பற்ற, தனிப்பட்ட நிலையை வலியுறுத்தும் எபிரேயச் சொல்லின் ‘ஒரே/தனித்த’ பொருளைத் தக்கவைக்கிறது; இஸ்மவேலின் இருப்பை மறுப்பதாக உயிரியல் பொருளில் மட்டும் சுருக்கவில்லை.
- source_word: אֲשֶׁר אָהַבְתָּ
  choice: நீ நேசிக்கிற
  rationale: ஆபிரகாம் ஈசாக்கின்மீது கொண்டிருக்கும் நிலையான அன்பை நவீன தமிழில் இயல்பான நிகழ்கால வடிவில் தெரிவிக்கிறது.
- source_word: וְלֶךְ לְךָ
  choice: போ
  rationale: தனிப்பட்ட ஈடுபாடு அல்லது வலியுறுத்தல் கொண்டிருக்கக்கூடிய எபிரேய மரபுத்தொடரை, தேவையற்ற சொற்களைச் சேர்க்காமல் தமிழில் இயல்பான கட்டளையாகத் தருகிறது.
- source_word: אֶרֶץ הַמֹּרִיָּה
  choice: மோரியா நாட்டுக்கு
  rationale: אֶרֶץ என்பதன் ‘நாடு/பகுதி’ பொருளில், இடப்பெயரைத் தெளிவாகவும் மரபோடும் தருகிறது.
- source_word: וְהַעֲלֵהוּ
  choice: அவனை ... செலுத்து
  rationale: עֹלָה உடன் வரும் போது עלה என்பதன் ஹிஃபில் வடிவம் பலியாக அர்ப்பணிப்பதைக் குறிக்கிறது; ‘செலுத்து’ என்பது தமிழ் பலிமொழியில் இயல்பானது.
- source_word: לְעֹלָה
  choice: தகனபலியாக
  rationale: முழுவதும் எரிக்கப்படும் பலியைக் குறிக்கும் வழக்கமான பலிச்சொல்லைத் துல்லியமாகத் தருகிறது.
- source_word: עַל אַחַד הֶהָרִים
  choice: மலைகளில் ஒன்றின்மேல்
  rationale: குறிப்பிடப்படாத பல மலைகளுள் ஒன்றைச் சுட்டும் அமைப்பையும் ‘மலை’ என்ற அடிப்படைப் பொருளையும் காக்கிறது.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: நான் உனக்குச் சொல்லும்
  rationale: אמר என்பதன் ‘சொல்’ பொருளைத் தக்கவைக்கிறது; மூலத்தில் இல்லாத ‘காட்டு’ என்ற வினையைச் சேர்க்கவில்லை.
theological_decisions:
- issue: இஸ்மவேல் இருக்கும்போது ஈசாக்கை יְחִידְךָ என்று அழைப்பது
  choice: உன் ஒரே ஒருவனாகிய
  alternative: உன் ஒரே மகனாகிய
  rationale: ஈசாக்கின் தனிப்பட்ட, ஒப்பற்ற நிலையை முன்னிறுத்துகிறது; அது உயிரியல், உடன்படிக்கை அல்லது பாச உறவு ஆகியவற்றில் எதை மட்டும் குறிக்கிறது என்று உரை தீர்மானிக்காத பதற்றத்தைத் தக்கவைக்கிறது. பரவலான மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டது. கட்டளையின் தீவிரத்தையும், ‘மகன்—ஒரே ஒருவன்—நேசிக்கிறவன்—ஈசாக்கு’ என்ற படிப்படியான வலியுறுத்தலையும் கோடுகளால் தக்கவைத்துள்ளது. பலிசார் சூழலுக்கேற்ற ‘தகனபலி’ மற்றும் ‘செலுத்து’ பயன்படுத்தப்பட்டுள்ளன.
