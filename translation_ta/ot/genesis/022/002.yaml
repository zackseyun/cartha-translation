revisions:
- from: அவர், “உன் மகனை—நீ நேசிக்கிற உன் ஒரே ஒருவனாகிய[a] ஈசாக்கை—தயவுசெய்து அழைத்துக்கொண்டு, மோரியா நாட்டுக்குப் போ. அங்கே நான் உனக்குச் சொல்லும் மலைகளில் ஒன்றின்மேல் அவனைத் தகனபலியாகச் செலுத்து” என்றார்.
  to: அவர், “தயவுசெய்து, உன் மகனை—உனக்கு ஒரே ஒருவனான, நீ நேசிக்கிற ஈசாக்கை—எடுத்துக்கொண்டு மோரியா தேசத்திற்குப் போ. அங்கே நான் உனக்குச் சொல்லும் மலைகளில் ஒன்றின் மேல் அவனைத் தகனபலியாகச் செலுத்து” என்றார்.
