  text: And the angel of Yahweh called to Abraham a second time from heaven,[a]
translation:
  language: ta
  text: 'யாவேயின் தூதர்[a] வானத்திலிருந்து ஆபிரகாமை இரண்டாம் முறையாக அழைத்தார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் செய்தித் தூதர்.”
    reason: மַלְאָךְ என்பதற்கு ‘தூதர்’ என்றும் ‘செய்தித் தூதர்’ என்றும் பொருள் கொள்ள முடியும் என்பதைக் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்தார்
  rationale: கதை நிகழ்வைத் தொடரும் இறந்தகால வினையாகவும், ஒருவரை நேரடியாக விளிக்கும் செயலைக் குறிக்கும் இயல்பான நவீனத் தமிழாகவும் அமைந்துள்ளது.
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאָךְ என்பதன் ‘தூதர்/செய்தியாளர்’ என்ற அடிப்படைப் பொருளையும், இச்சூழலில் வானுலகத் தூதரைக் குறிக்கும் வழக்கையும் ‘தூதர்’ இயல்பாகத் தாங்குகிறது; அந்தத் தூதரின் இயல்பைப் பற்றிய இறையியல் விவாதத்தை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றீடாக இடாமல், எபிரேய இறைப் பெயரான יהוה என்பதைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֶל אַבְרָהָם
  choice: ஆபிரகாமை
  rationale: அழைப்பின் நேரடிப் பெறுநரைத் தமிழில் இயல்பாகச் சுட்டும் வேற்றுமை அமைப்பு.
- source_word: שֵׁנִית
  choice: இரண்டாம் முறையாக
  rationale: ‘மீண்டும்’ என்பதைவிட, எபிரேயச் சொல்லிலுள்ள வெளிப்படையான இரண்டாவது முறை என்ற எண்ணப் பொருளைத் துல்லியமாகக் காக்கிறது.
- source_word: מִן הַשָּׁמַיִם
  choice: வானத்திலிருந்து
  rationale: எபிரேயத்தில் வடிவளவில் பன்மையாக இருந்தாலும், தெய்வீகக் குரல் வரும் இடத்தைக் குறிக்கும் இச்சொற்றொடருக்கு ஒருமை வடிவமான ‘வானத்திலிருந்து’ இயல்பான தமிழாகும்.
theological_decisions:
- issue: מַלְאַךְ יְהוָה என்பதன் அடையாளமும் இயல்பும்
  choice: யாவேயின் தூதர்
  alternative: யாவேயின் செய்தியாளர்
  rationale: சொற்றொடரைச் சொற்பொருளின் எல்லைக்குள் மொழிபெயர்த்து, இவர் படைக்கப்பட்ட வானுலகத் தூதரா அல்லது கடவுளின் தனித்த வெளிப்பாடா என்ற விரிந்த இறையியல் விவாதத்தைத் தீர்க்காமல் மூல உரையின் பதற்றத்தைப் பாதுகாக்கிறது.
