base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/009.yaml
  text: Then they came to the place that God had told him[a], and Abraham built the altar there and arranged the wood. He bound Isaac his son and placed him on the altar[c][b], on top of the wood.
translation:
  language: ta
  text: அவர்கள் கடவுள் அவருக்குச் சொல்லியிருந்த இடத்திற்கு வந்தார்கள். அங்கே ஆபிரகாம் பலிபீடத்தைக் கட்டி, விறகுகளை ஒழுங்காக அடுக்கினார். பின்பு தன் மகன் ஈசாக்கைக் கட்டி, பலிபீடத்தின் மீது, விறகுகளுக்கு மேலாக வைத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விறகுகளுக்கு மேலாக” என்பதற்கு “விறகுகளின்மேல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: அவர்கள் ... வந்தார்கள்
  rationale: தொடர்ச்சியான கதைநடையை இயல்பான தமிழில் தருகிறது; ஆபிரகாமும் ஈசாக்கும் சேர்ந்த பன்மை எழுவாயைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: கடவுள் அவருக்குச் சொல்லியிருந்த
  rationale: இடத்தைப் பற்றிய இறை அறிவுறுத்தல் வருகைக்கு முன் நிகழ்ந்ததைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடத்தை
  rationale: எபிரெய definite article-ஐத் தமிழின் குறித்த பொருள் வடிவில் பிரதிபலித்து, இப்பலிக்காக அமைக்கப்பட்ட குறிப்பிட்ட பலிபீடத்தைக் குறிக்கிறது.
- source_word: וַיַּעֲרֹךְ אֶת הָעֵצִים
  choice: விறகுகளை ஒழுங்காக அடுக்கினார்
  rationale: ערך என்பதன் ஒழுங்குபடுத்துதல் அல்லது வரிசைப்படுத்துதல் என்ற பலிசார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיַּעֲקֹד
  choice: கட்டி
  rationale: עקד குறிக்கும் பிணைத்தல் செயலை மென்மைப்படுத்தாமல் சுருக்கமாகவும் நேரடியாகவும் தருகிறது.
- source_word: יִצְחָק בְּנוֹ
  choice: தன் மகன் ஈசாக்கை
  rationale: எபிரெய உரையின் உறவுமுறையையும் பெயரையும் இயல்பான தமிழ் சொல்வரிசையில் பாதுகாக்கிறது.
- source_word: וַיָּשֶׂם אֹתוֹ עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தில் வைத்தார்
  rationale: שׂים என்ற பொதுவான வைக்கும் செயலை, அதன் முறையை மேலதிகமாக விளக்காமல் தருகிறது.
- source_word: מִמַּעַל לָעֵצִים
  choice: விறகுகளின்மேல்
  rationale: அடுக்கப்பட்ட விறகுகளுக்கு மேலாக அல்லது அவற்றின் மேற்பரப்பில் இருந்த இடநிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: பலிக்கான கட்டமைப்பின் குறிப்புத்தன்மை
  choice: பலிபீடத்தை
  alternative: ஒரு பலிபீடத்தைக்
  rationale: எபிரெயச் சொல்லில் உள்ள definite article குறிப்பிட்ட பலிபீடத்தைக் காட்டுகிறது; பின்னைய இறையியல் குறியீடுகளைச் சேர்க்கவில்லை.
- issue: ஈசாக்கைக் கட்டிய செயலை மொழிபெயர்த்தல்
  choice: தன் மகன் ஈசாக்கைக் கட்டி
  alternative: தன் மகன் ஈசாக்கைக் கயிற்றால் கட்டி
  rationale: மூல வினைச்சொல்லின் பிணைத்தல் பொருளைப் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கயிற்றால்’ என்ற கருவியைச் சேர்ப்பதில்லை.
- issue: விறகுகளுக்கும் ஈசாக்குக்கும் இடையிலான இடநிலை
  choice: விறகுகளின்மேல் பலிபீடத்தில் வைத்தார்
  alternative: பலிபீடத்தில், விறகுகளுக்கு மேலாக வைத்தார்
  rationale: இரு இடநிலைகளையும் பாதுகாத்து இயல்பான தமிழில் தருகிறது; ‘மேல்’ என்பது நேரடியாகத் தொட்டிருந்ததா அல்லது மேல்நிலையில் இருந்ததா என்ற சிறிய மூலமொழி நெகிழ்வை அடிக்குறிப்பில் சுட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தொடர் எபிரெய வினைகளின் ஓட்டம் குறுகிய தமிழ் வாக்கியங்களாக இயல்பாக்கப்பட்டுள்ளது; செயல்களின் தீவிரம் மென்மைப்படுத்தப்படவில்லை.
