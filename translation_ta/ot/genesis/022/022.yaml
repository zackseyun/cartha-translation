lexical_decisions:
- source_word: כֶּשֶׂד
  choice: கெசேத்
  rationale: வம்சப்பட்டியலில் வரும் தனிப்பட்ட பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் எபிரெய ஒலிப்புக்கு அண்மையாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: חֲזוֹ
  choice: ஹசோ
  rationale: தனிப்பட்ட பெயர்; தொடக்க ח ஒலியைத் தமிழில் அண்மையாகக் காட்ட ‘ஹ’ பயன்படுத்தப்பட்டு, பெயர் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: פִּלְדָּשׁ
  choice: பில்தாஷ்
  rationale: தனிப்பட்ட பெயர் என்பதால் எபிரெய மெய்யொலி வரிசையை இயன்றவரை காக்கும் வகையில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: יִדְלָף
  choice: யித்லாப்
  rationale: தொடக்க எபிரெய யோத் ஒலி தமிழில் ‘ய’ என நேரடியாகக் காட்டப்பட்டது; ஆங்கில மரபிலுள்ள ‘J’ வடிவம் பின்பற்றப்படவில்லை.
- source_word: בְּתוּאֵל
  choice: பெத்துவேல்
  rationale: எபிரெய பெயரின் ஒலியையும் தமிழில் நிலைபெற்ற வேதாகமப் பெயர் வடிவத்தையும் கருத்தில் கொண்டு எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וְאֶת / וְאֵת
  choice: -ஐயும்
  rationale: மீண்டும் மீண்டும் வரும் வாவ் இணைப்பும் நேர்முகச் செயப்படுபொருள் குறியீடும் தமிழில் ஒவ்வொரு பெயருடனும் சேரும் ‘-ஐயும்’ வழியாக இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்தப்பட்டன.
