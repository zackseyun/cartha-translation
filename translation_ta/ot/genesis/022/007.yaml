base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/007.yaml
  text: And Isaac said to Abraham his father[a], “My father!” And he said, “Here I am, my son.” And he said, “Look, the fire and the wood—but where is the sheep for a burnt offering?”
translation:
  language: ta
  text: ஈசாக்கு தன் தந்தை ஆபிரகாமிடம், “அப்பா!” என்றான். அதற்கு அவர், “இதோ இருக்கிறேன், மகனே” என்றார். அப்போது ஈசாக்கு, “இதோ, நெருப்பும் விறகும் இருக்கின்றன; ஆனால் தகனபலிக்கான ஆடு[a] எங்கே?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் செம்மறியாடு அல்லது வெள்ளாடு போன்ற மந்தையிலுள்ள ஒரு சிறிய கால்நடையைக் குறிக்கலாம்; அது ஆட்டுக்குட்டியை மட்டும் குறிப்பதல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான் / என்றார்
  rationale: எபிரெயக் கதையாடலில் வரும் வழக்கமான ‘சொன்னான்’ என்ற வினையை, தமிழில் நேரடி உரைக்குப் பின் இயல்பாக வரும் ‘என்றான்/என்றார்’ என மொழிபெயர்த்தது; பேசுபவருக்கேற்ப மரியாதை விகுதி மாறுகிறது.
- source_word: אָבִיו
  choice: தன் தந்தை
  rationale: மூன்றாம் நபர் உடைமையைத் தெளிவாகக் காட்டி, காட்சியின் கண்ணியமான நடையைப் பேணுகிறது.
- source_word: אָבִי
  choice: அப்பா!
  rationale: சொல்லில் முதலாம் நபர் உடைமை விகுதி இருந்தாலும், தந்தையை நேரடியாக அழைக்கும் நவீனத் தமிழில் ‘அப்பா!’ என்பதே இயல்பாகவும் உணர்வுடன் கூடியதாகவும் உள்ளது.
- source_word: הִנֶּנִי
  choice: இதோ இருக்கிறேன்
  rationale: தன்னை முன்வைத்து பதிலளிக்கும் எபிரெய வழக்குச் சொல்லின் நேரடியான பொருளையும் இலக்கிய எதிரொலியையும் இயல்பான தமிழில் பேணுகிறது.
- source_word: בְּנִי
  choice: மகனே
  rationale: தமிழ் விளிப்பில் அன்பும் உறவுமுறையும் இயல்பாக வெளிப்படுகின்றன; ‘என் மகனே’ என்பது இவ்விடத்தில் தேவையற்ற அளவு வெளிப்படையாக ஒலிக்கலாம்.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கண்ணுக்கு முன் உள்ளவற்றின் மீது கவனத்தை ஈர்க்கும் சுட்டிடைச்சொல்லைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: הָאֵשׁ
  choice: நெருப்பு
  rationale: காட்சியில் எடுத்துச் செல்லப்படும் தீயை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: הָעֵצִים
  choice: விறகு
  rationale: எபிரெயில் பன்மையாக இருந்தாலும், பலிக்காக எடுத்துச் செல்லப்பட்ட எரிக்கும் மரக்கட்டைகளைத் தமிழில் ‘விறகு’ என்ற தொகுதிப்பெயர் இயல்பாகக் குறிக்கிறது.
- source_word: אַיֵּה
  choice: எங்கே?
  rationale: இடத்தைப் பற்றிய கேள்வியை நேரடியான நவீனத் தமிழில் வழங்குகிறது.
- source_word: הַשֶּׂה
  choice: ஆடு
  rationale: שֶׂה என்பது செம்மறியாட்டுக்குட்டி என்று மட்டும் அல்லாமல், செம்மறியாடு அல்லது வெள்ளாடு வகையைச் சேர்ந்த சிறிய மந்தை விலங்கைக் குறிக்கலாம். ‘ஆடு’ வாசிக்க இயல்பானது; மூலச்சொல்லின் பரப்பை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: לְעֹלָה
  choice: தகனபலிக்கான
  rationale: עֹלָה என்பது முழுவதுமாக எரித்துச் செலுத்தப்படும் பலிக்கான நிலையான எபிரெயச் சொல்; ‘தகனபலி’ அதன் பலியியல் பொருளைச் சுருக்கமாகப் பேணுகிறது.
theological_decisions:
- issue: הַשֶּׂה என்ற பலி விலங்குச் சொல்லின் பரப்பு
  choice: ஆடு
  alternative: ஆட்டுக்குட்டி / செம்மறியாடு / மந்தையிலுள்ள சிறிய கால்நடை
  rationale: மூல எபிரெயச் சொல் விலங்கின் வயதையோ செம்மறியாடு வகையையோ மட்டும் கட்டாயப்படுத்தவில்லை. ஆகவே ‘ஆட்டுக்குட்டி’ எனக் குறுக்காமல் பொதுவான சொல்லை முதன்மை உரையில் வைத்து, உண்மையான சொற்பொருள் பரப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் காட்சியின் கண்ணியத்தையும் உணர்வுத் தீவிரத்தையும் பேணும் வகையிலும் அமைக்கப்பட்டது. எபிரெயில் மீண்டும் மீண்டும் வரும் ‘சொன்னான்’ அமைப்பு தமிழில் பேசுபவர் மாற்றத்தைத் தெளிவாக்கும் அளவுக்கு மட்டும் இயல்பாக்கப்பட்டுள்ளது.
