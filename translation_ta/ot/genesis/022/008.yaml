source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַבְרָהָ֔ם אֱלֹהִ֞ים יִרְאֶה לּ֥/וֹ הַ/שֶּׂ֛ה לְ/עֹלָ֖ה בְּנִ֑/י וַ/יֵּלְכ֥וּ שְׁנֵי/הֶ֖ם יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/008.yaml
  text: And Abraham said[a], “God will provide for himself the lamb for a burnt offering, my son.” So the two of them went on together.
translation:
  language: ta
  text: ஆபிரகாம், “என் மகனே, எரிபலிக்கான ஆட்டுக்குட்டியைக் கடவுள் தமக்காக ஏற்பாடு செய்வார்[a]” என்றார். பின்பு அவர்கள் இருவரும் ஒன்றாகத் தொடர்ந்து சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொல்லுக்குச் சொல்லாக, “எரிபலிக்கான ஆட்டுக்குட்டியைக் கடவுள் தமக்காகக் காண்பார்.” இங்குள்ள எபிரெய வினைச்சொல் “காண்” என்றும், இச்சூழலில் மரபுத்தொடராக “பார்த்துக்கொள்; ஏற்பாடு செய்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: தொடர்ச்சியான எபிரெயக் கதைநடையை இயல்பான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: ஆபிரகாமின் கூற்றில் உண்மையான இறைவனைக் குறிக்கும் பொதுவான எபிரெயச் சொல்லுக்கு நவீனத் தமிழில் இயல்பான இணைச்சொல்.
- source_word: יִרְאֶה לּוֹ
  choice: தமக்காக ஏற்பாடு செய்வார்
  rationale: ראה என்பதன் நேரடிப் பொருள் ‘காண்பார்’; இச்சூழலில் அது ‘பார்த்துக்கொள்வார், ஏற்பாடு செய்வார்’ என்ற மரபுத்தொடர்ப் பொருளைக் கொண்டுள்ளது. לּוֹ என்பதிலுள்ள ‘தமக்காக’ என்ற நுணுக்கமும் வெளிப்படையாகத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: הַשֶּׂה
  choice: ஆட்டுக்குட்டியை
  rationale: שֶׂה என்பது செம்மறியாடு அல்லது வெள்ளாடு வகையைச் சேர்ந்த சிறிய கால்நடையைக் குறிக்கலாம். பலிச் சூழலிலும் முந்தைய கேள்வியுடனான தொடர்பிலும் ‘ஆட்டுக்குட்டி’ இயல்பான தமிழ் தெரிவாகும்; இனத்தைத் தேவையின்றி வரையறுப்பதில்லை.
- source_word: לְעֹלָה
  choice: எரிபலிக்கான
  rationale: עֹלָה என்பது முழுவதும் எரித்துச் செலுத்தப்படும் பலிக்கான வழக்கமான சொல்; ‘எரிபலி’ இதைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: בְּנִי
  choice: என் மகனே
  rationale: ஈசாக்கை நேரடியாகவும் பாசத்துடனும் அழைக்கும் தொனியைத் தக்கவைக்கிறது.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: பின்பு அவர்கள் இருவரும் ஒன்றாகத் தொடர்ந்து சென்றார்கள்
  rationale: ‘இருவரும்’ மற்றும் ‘ஒன்றாக’ என்ற எபிரெய வலியுறுத்தலைத் தக்கவைத்து, அவர்கள் பயணத்தைத் தொடர்ந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: கடவுளின் செயலைக் குறித்த ஆபிரகாமின் கூற்றின் பொருள்
  choice: கடவுள் தமக்காக ஆட்டுக்குட்டியை ஏற்பாடு செய்வார்
  alternative: கடவுள் தமக்காக ஆட்டுக்குட்டியைக் காண்பார் / பார்த்துக்கொள்வார்
  rationale: சூழலில் ‘காண்பார்’ என்பது மரபுத்தொடராக ‘ஏற்பாடு செய்வார்’ எனப் பொருள்படுகிறது. ‘தமக்காக’ என்பதைத் தக்கவைத்தது לּוֹ என்பதன் நுணுக்கத்தைப் பாதுகாக்கிறது. ஆபிரகாம் தவிர்த்துப் பேசுகிறாரா, தீர்க்கமாகப் பேசுகிறாரா, அல்லது இரண்டுமா என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல் கதைத் தளர்வை நிலைநிறுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தமக்காக’ என்ற அமைப்பு மூலத்தின் நுணுக்கத்தைத் தக்கவைக்கிறது; அடிக்குறிப்பு அதன் நேரடிப் பொருளையும் மரபுத்தொடர்ப் பொருளையும் விளக்குகிறது.
