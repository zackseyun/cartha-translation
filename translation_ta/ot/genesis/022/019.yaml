base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/019.yaml
  text: So Abraham returned to his young men[a], and they arose and went together to Beersheba, and Abraham stayed in Beersheba.
translation:
  language: ta
  text: ஆபிரகாம் தன் இளைஞர்களிடம் திரும்பி வந்தார்.[a] அவர்கள் எழுந்து, ஒன்றாகப் பெயெர்செபாவுக்குச் சென்றார்கள். ஆபிரகாம் பெயெர்செபாவில் குடியிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஆபிரகாம் தன் இளைஞர்களிடம் திரும்பி வந்தார்.” முந்தைய நிகழ்வில் ஈசாக்கு இருந்தபோதிலும், இந்தக் கூற்றில் அவர் குறிப்பிடப்படவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பி வந்தார்
  rationale: שׁוב என்பதன் இயல்பான கால் வடிவக் கதைநடைப் பொருள் ‘திரும்புதல்’; முந்தைய இடத்திலிருந்து பணியாளர்களிடம் மீண்டும் வந்ததைக் காட்டுகிறது.
- source_word: נְעָרָיו
  choice: தன் இளைஞர்கள்
  rationale: נַעַר என்பது சூழலுக்கேற்ப இளைஞர், பணியாளர், உதவியாளர் எனப் பொருள்படும். இங்கு அவர்கள் ஆபிரகாமுடன் வந்த பணியாளர்கள் என்றாலும், எபிரெயச் சொல்லின் வயது சார்ந்த அடிப்படைத் தன்மையை மிகைப்படுத்தாமல் காக்க ‘இளைஞர்கள்’ பயன்படுத்தப்படுகிறது.
- source_word: וַיָּקֻמוּ
  choice: அவர்கள் எழுந்து
  rationale: קום கதைநடையில் அடுத்த செயலைத் தொடங்குவதைக் குறிக்கிறது; ‘எழுந்து’ என்பது இயல்பான, கண்ணியமான தமிழ் வடிவம்.
- source_word: וַיֵּלְכוּ יַחְדָּו
  choice: ஒன்றாகச் சென்றார்கள்
  rationale: הלך + יחדו இணைந்து பயணித்ததைத் தெரிவிக்கிறது; பயண முறையைச் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கிறது.
- source_word: בְּאֵר שָׁבַע
  choice: பெயெர்செபா
  rationale: இடப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பிற்கு பதிலாக நவீனத் தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: וַיֵּשֶׁב
  choice: குடியிருந்தார்
  rationale: ישׁב இச்சூழலில் ஓர் இடத்தில் வாழ்தல் அல்லது தங்கியிருத்தலைக் குறிக்கிறது. ‘குடியிருந்தார்’ என்பது தொடர்ந்த வசிப்பை இயல்பாகக் காட்டுகிறது; புதிதாகக் குடியேறினார் என்ற கருத்தை அவசியமாகச் சேர்ப்பதில்லை.
theological_decisions:
- issue: மலையிலிருந்து ஆபிரகாம் திரும்பியதாக மட்டுமே வசனம் கூறுகிறது; ஈசாக்கு பெயரிடப்படவில்லை
  choice: மூலத்தில் உள்ளபடியே ஆபிரகாமை மட்டும் முதன்மை உரையில் குறிப்பிடுதல்
  alternative: ஈசாக்கும் திரும்பி வந்தார் என்று வெளிப்படையாகச் சேர்த்தல், அல்லது ஆபிரகாம் முதன்மைப் பாத்திரமாக மட்டும் குறிப்பிடப்பட்டதாக விளக்குதல்
  rationale: எபிரெய உரை திரும்பியவராக ஆபிரகாமை மட்டுமே வெளிப்படையாகப் பெயரிடுகிறது. ஈசாக்கைச் சேர்ப்பது உரையிலுள்ள பதற்றத்தையும் உண்மையான மறைபொருள் வாய்ப்பையும் அமைதியாகத் தீர்த்துவிடும்; ஆகவே விளக்கக் குறிப்பு மட்டும் வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத் தொடர்ச்சிச் செயல்வடிவங்கள் தமிழில் இயல்பான வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளன; ஈசாக்கைப் பற்றிய உரைமௌனம் பாதுகாக்கப்பட்டுள்ளது.
