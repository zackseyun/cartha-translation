base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/006.yaml
  text: So Abraham took the wood for the burnt offering and laid it on Isaac his son[a], and he took in his hand the fire and the knife[b], and the two of them walked on together.
translation:
  language: ta
  text: ஆபிரகாம் தகனபலிக்கான விறகுகளை[a] எடுத்து, அவற்றைத் தன் மகன் ஈசாக்கின் மேல் வைத்தார். பின்பு நெருப்பையும் கத்தியையும் தன் கையில் எடுத்துக்கொண்டார்; அவர்கள் இருவரும் ஒன்றாகத் தொடர்ந்து நடந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘தகனபலியின் விறகுகள்.’'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்கள் இருவரும் ஒன்றாகச் சென்றார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצֵי הָעֹלָה
  choice: தகனபலிக்கான விறகுகள்
  rationale: எபிரெயக் கட்டமைப்பு சொல்லுக்குச் சொல் ‘தகனபலியின் விறகுகள்’ என்று இருந்தாலும், பலியை எரிப்பதற்கான விறகுகள் என்ற உறவை நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: וַיָּשֶׂם עַל
  choice: மேல் வைத்தார்
  rationale: שׂים உடன் עַל வருவது ஒன்றை ஒருவர்மேல் வைப்பதைக் குறிக்கிறது; சுமை ஈசாக்கின்மேல் வைக்கப்பட்ட காட்சியையும் இச்சொற்றொடர் காக்கிறது.
- source_word: יִצְחָק בְּנוֹ
  choice: தன் மகன் ஈசாக்கு
  rationale: உறவையும் பெயரையும் இயல்பான தமிழ் வரிசையில் தருகிறது; ‘தன்’ என்பது வாக்கியத்தின் எழுவாயான ஆபிரகாமையே தெளிவாகச் சுட்டுகிறது.
- source_word: בְּיָדוֹ
  choice: தன் கையில்
  rationale: மூலத்தில் உள்ள ஒருமை வடிவை நேரடியாகப் பாதுகாக்கிறது; அவர் அவற்றைத் தாமே சுமந்தார் என்பதையும் காட்டுகிறது.
- source_word: הָאֵשׁ
  choice: நெருப்பு
  rationale: மூலம் எடுத்துச் செல்லப்பட்ட பாத்திரத்தையோ நெருப்பு மூட்டும் கருவியையோ குறிப்பிடாமல் ‘நெருப்பு’ என்றே கூறுவதால் அதே பொதுமை பாதுகாக்கப்படுகிறது.
- source_word: הַמַּאֲכֶלֶת
  choice: கத்தி
  rationale: இச்சொல் அறுப்பதற்குப் பயன்படும் கத்தியைக் குறிக்கலாம்; ஆனால் சூழல் அதன் பலியிடும் பயன்பாட்டை உணர்த்துவதால், கூடுதல் விளக்கம் சேர்க்காமல் பொதுவான ‘கத்தி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיֵּלְכוּ
  choice: தொடர்ந்து நடந்தார்கள்
  rationale: הלך என்பது ‘செல்/நட’ என்ற பரந்த பொருளுடையது; கதைநடையில் பயணம் தொடர்வதை ‘தொடர்ந்து நடந்தார்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: அவர்கள் இருவரும் ஒன்றாக
  rationale: இருவரையும் வெளிப்படையாகச் சுட்டும் שְׁנֵיהֶם என்பதையும், இணைந்து சென்றதைக் குறிக்கும் יַחְדָּו என்பதையும் தனித்தனியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: עֹלָה என்பதற்கான பலியியல் சொல்
  choice: தகனபலி
  alternative: மேலெழும் பலி
  rationale: சொல்லின் வேர் ‘மேலே எழுதல்’ என்ற கருத்துடன் தொடர்புடையதாக இருந்தாலும், இச்சூழலில் அது நெருப்பில் முழுமையாக எரிக்கப்படும் நிறுவப்பட்ட பலிவகையைக் குறிக்கிறது. ‘தகனபலி’ அந்தச் சடங்கியல் பொருளைத் தமிழில் சுருக்கமாகத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய தொடர் வினை அமைப்பு தமிழில் இயல்பாக வாசிக்க இரண்டு வாக்கியங்களாகவும் ஒரு அரைப்புள்ளியுடனும் வடிவமைக்கப்பட்டது. அடிக்குறிப்புக் குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின் வைக்கப்பட்டுள்ளன.
