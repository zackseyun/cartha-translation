id: GEN.22.12
reference: Genesis 22:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אַל תִּשְׁלַ֤ח יָֽדְ/ךָ֙ אֶל הַ/נַּ֔עַר וְ/אַל תַּ֥עַשׂ ל֖/וֹ מְא֑וּמָּה כִּ֣י עַתָּ֣ה יָדַ֗עְתִּי כִּֽי יְרֵ֤א אֱלֹהִים֙ אַ֔תָּה וְ/לֹ֥א חָשַׂ֛כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידְ/ךָ֖ מִמֶּֽ/נִּי־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/012.yaml
  text: And he said[a], “Do not lay your hand on the boy, and do not do anything to him, for now I know that you fear God, since you have not withheld your son, your only son[b], from me.”
translation:
  language: ta
  text: அவர், “அந்தப் பையன்மேல் உன் கையை நீட்டாதே; அவனுக்கு எதுவும் செய்யாதே. நீ கடவுளுக்குப் பயப்படுகிறாய் என்பதை இப்போது அறிந்துகொண்டேன்; ஏனெனில், உன் மகனை—உன் ஒரே மகனை[a]—என்னிடமிருந்து நீ தடுத்துவைக்கவில்லை[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “உன் மகனை, உன் ஒரேவனை.” இங்கு உடன்படிக்கையின் வாக்குறுதியின் சூழலில் ஒரே மகன் என்பது பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன் மகனைத் தப்பிக்கவிடவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁלַח יָדְךָ אֶל
  choice: கையை நீட்டாதே
  rationale: எபிரேயச் சொல்லாட்சியை இயல்பான தமிழில் நெருக்கமாகத் தக்கவைத்து, பையனைத் தாக்கவோ தீங்கு செய்யவோ வேண்டாம் என்ற பொருளை அடுத்த வாக்கியத்துடன் சேர்ந்து தெளிவாக்குகிறது.
- source_word: הַנַּעַר
  choice: அந்தப் பையன்
  rationale: நַעַר என்பது பையன், இளைஞன் எனப் பொருள்படலாம்; இக்கதைச் சூழலில் ‘பையன்’ இயல்பாக உள்ளது. குறிப்பிட்ட நபரைச் சுட்டுவதால் ‘அந்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: תַּעַשׂ לוֹ מְאוּמָּה
  choice: அவனுக்கு எதுவும் செய்யாதே
  rationale: மְאוּמָּה என்பதன் ‘எதுவும்/எதுவுமே’ என்ற பரந்த தடையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: עַתָּה יָדַעְתִּי
  choice: இப்போது அறிந்துகொண்டேன்
  rationale: ‘இப்போது நான் அறிந்தேன்’ என்ற எபிரேய வாக்கியத்தின் நிகழ்வால் உறுதிப்பட்ட அறிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இறை அறிவைப் பற்றிய பதற்றத்தைப் பரிபாஷையால் அகற்றவில்லை.
- source_word: יְרֵא אֱלֹהִים
  choice: கடவுளுக்குப் பயப்படுகிறவன்
  rationale: ‘கடவுளுக்குப் பயப்படுதல்’ என்ற நேரடியான வேதாகமச் சொல்லாட்சியைத் தக்கவைக்கிறது; ‘பக்தியுள்ளவன்’ என விளக்கமாக மாற்றவில்லை.
- source_word: חָשַׂכְתָּ
  choice: கொடுக்காமல் தடுத்துவைக்கவில்லை
  rationale: חָשַׂךְ என்பதன் அடிப்படைப் பொருளான ‘தடுத்துவைத்தல்/விலக்கிவைத்தல்’ என்பதை இச்சூழலில் தெளிவாக வழங்குகிறது. ‘தப்பவிடவில்லை’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְחִידְךָ
  choice: உன் ஒரே மகனை
  rationale: ‘உன் மகன், உன் ஒரேவன்’ என்ற வலியுறுத்தும் இணைப்பைத் தமிழில் இயல்பாக ‘உன் மகனை—உன் ஒரே மகனை’ என்று தருகிறது; ‘அன்பு மகன்’ என்ற சூழல்சார் நுணுக்கத்தைச் சொல்லுக்குள் சேர்க்கவில்லை.
- source_word: מִמֶּנִּי
  choice: எனக்கு
  rationale: எபிரேய מן (‘என்னிடமிருந்து’) என்பதன் உறவை, ஒருவருக்குரியதை அவருக்குக் கொடுக்காமல் தடுத்துவைத்தல் என்ற தமிழ்ச் சொல்லமைப்பில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘இப்போது அறிந்துகொண்டேன்’ என்பதில் வெளிப்படும் இறை அறிவு
  choice: எபிரேயத்தின் நேரடியான கூற்றைத் தக்கவைத்தல்
  alternative: ‘இப்போது வெளிப்பட்டது’ அல்லது ‘இப்போது கண்டேன்’
  rationale: மூலவாசகம் ‘இப்போது அறிந்தேன்’ என்று நேரடியாகக் கூறுகிறது. இறைவனின் அனைத்தறிவைப் பற்றிய கோட்பாட்டுடன் இதை மொழிபெயர்ப்பிலேயே சமரசப்படுத்தாமல், வாசகத்தின் உறவுமுறை அல்லது மனித உருவகப் பதற்றம் அப்படியே பாதுகாக்கப்படுகிறது.
- issue: יְחִידְךָ என்பதன் உடன்படிக்கைச் சூழல்
  choice: உன் ஒரே மகன்
  alternative: உன் ஒரேவன்; உன் தனிப்பெரும் மகன்
  rationale: ஆபிரகாமுக்கு இஸ்மவேலும் இருந்தபோதிலும், இங்கு ஈசாக்கு வாக்குறுதியின் சூழலில் ‘ஒரே’ மகன் எனக் குறிப்பிடப்படுகிறார். இந்தச் சூழலை விளக்கமாக முதன்மை உரைக்குள் சேர்க்காமல் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் கதைநடையின் சுருக்கமும் காக்கப்பட்டுள்ளன. இறைவனைக் குறிக்கும் பிரதிப்பெயர் மூலத்தில் வெளிப்படையாக இல்லாத இடத்தில் ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது. கட்டளைகளில் இயல்பான ஒருமை ‘நீ’ வடிவம் பின்பற்றப்பட்டுள்ளது.
