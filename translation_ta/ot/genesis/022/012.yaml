- from: அவர், “அந்தப் பையன்மேல் உன் கையை நீட்டாதே; அவனுக்கு எதுவும் செய்யாதே. நீ கடவுளுக்குப் பயப்படுகிறவன் என்பதை இப்போது அறிந்துகொண்டேன். ஏனெனில், உன் மகனை—உன் ஒரே மகனை[a]—எனக்குக் கொடுக்காமல் நீ தடுத்துவைக்கவில்லை[b]” என்றார்.
