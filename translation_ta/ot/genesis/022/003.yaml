  text: וַ/יַּשְׁכֵּ֨ם אַבְרָהָ֜ם בַּ/בֹּ֗קֶר וַֽ/יַּחֲבֹשׁ֙ אֶת חֲמֹר֔/וֹ וַ/יִּקַּ֞ח אֶת שְׁנֵ֤י נְעָרָי/ו֙ אִתּ֔/וֹ וְ/אֵ֖ת יִצְחָ֣ק בְּנ֑/וֹ וַ/יְבַקַּע֙ עֲצֵ֣י עֹלָ֔ה וַ/יָּ֣קָם וַ/יֵּ֔לֶךְ אֶל הַ/מָּק֖וֹם אֲשֶׁר אָֽמַר ל֥/וֹ הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/003.yaml
  text: Abraham rose early in the morning[a], saddled his donkey, took two of his young men with him and Isaac his son, split the wood for a burnt offering, and arose and went to the place that God had told him.
translation:
  language: ta
  text: ஆபிரகாம் அதிகாலையில் எழுந்து, தன் கழுதைக்குச் சேணம் பூட்டினார். தன்னுடைய இளைஞர்கள் இருவரையும்[a] தன் மகன் ஈசாக்கையும் தன்னுடன் அழைத்துக்கொண்டு, தகனபலிக்கான விறகுகளைப் பிளந்தார். பின்பு அவர் புறப்பட்டு, கடவுள் தனக்குச் சொல்லியிருந்த இடத்திற்குச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன்னுடைய பணியாளர்கள் இருவரையும்’ அல்லது ‘தன்னுடைய உதவியாளர்கள் இருவரையும்.’ இங்குள்ள எபிரெயச் சொல் சூழலுக்கேற்ப இளைஞர்களையோ ஆண் பணியாளர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: அதிகாலையில் எழுந்து
  rationale: எபிரெய வினை அதிகாலையில் எழுந்து செயல்படத் தொடங்குவதைக் குறிக்கிறது; ‘அதிகாலையில் எழுந்து’ என்பது அதன் காலச் சிறப்பையும் உடனடி நடவடிக்கையையும் இயல்பான தமிழில் தருகிறது.
- source_word: וַיַּחֲבֹשׁ אֶת־חֲמֹרוֹ
  choice: தன் கழுதைக்குச் சேணம் பூட்டினார்
  rationale: பயணத்திற்காகக் கழுதையைச் சேணமிட்டுத் தயார்செய்த செயலைத் தெளிவாகக் குறிக்கிறது.
- source_word: שְׁנֵי נְעָרָיו
  choice: தன்னுடைய இளைஞர்கள் இருவரையும்[a]
  rationale: נַעַר என்பது இளைஞர்கள், பணியாளர்கள் அல்லது உடனிருப்போர் எனச் சூழலுக்கேற்ப பொருள்படலாம். முதன்மை உரை வயதுசார்ந்த அடிப்படைப் பொருளைக் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יִצְחָק בְּנוֹ
  choice: தன் மகன் ஈசாக்கையும்
  rationale: தமிழின் இயல்பான சொல் வரிசையில் உறவுமுறையைத் தெளிவாகவும் முக்கியமாகவும் வைத்திருக்கிறது.
- source_word: וַיְבַקַּע עֲצֵי עֹלָה
  choice: தகனபலிக்கான விறகுகளைப் பிளந்தார்
  rationale: בקע என்பதன் ‘பிளத்தல்’ என்ற குறிப்பான செயற்பொருளையும், עֹלָה என்ற பலிவகையையும் பாதுகாக்கிறது.
- source_word: עֹלָה
  choice: தகனபலி
  rationale: முழுவதுமாக எரித்து அர்ப்பணிக்கப்படும் குறிப்பிட்ட பலிவகைக்கான வழக்கமான, சுருக்கமான தமிழ் வேதாகமச் சொல்.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: பின்பு அவர் புறப்பட்டு ... சென்றார்
  rationale: சொல்லுக்குச் சொல் ‘எழுந்து சென்றார்’ என்று மீண்டும் கூறுவது தமிழில் தேவையற்றதாக ஒலிக்கும்; ‘புறப்பட்டு ... சென்றார்’ இரு வினைகளின் பயணத் தொடக்கம் மற்றும் நகர்வு ஆகிய கருத்துகளை இயல்பாகக் கொண்டுவருகிறது.
- source_word: אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: கடவுள் தனக்குச் சொல்லியிருந்த
  rationale: முன்னரே வழங்கப்பட்ட இறை அறிவுறுத்தலைத் தமிழின் இறந்தகால நிறைவுவடிவம் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: עֹלָה என்ற பலிச்சொல்லின் மொழிபெயர்ப்பு
  choice: தகனபலி
  alternative: முழுவதும் எரிக்கப்படும் பலி
  rationale: இது ஒரு குறிப்பிட்ட பலிவகையைக் குறிக்கும் தொழில்நுட்பச் சொல். ‘தகனபலி’ அந்த வகையைச் சுருக்கமாகவும் மரபாகவும் அடையாளப்படுத்துகிறது; மூலத்தில் இல்லாத கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெய தொடர்வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; நிகழ்வுகளின் வரிசை மாற்றப்படவில்லை.
