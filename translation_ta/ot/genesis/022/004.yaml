  yaml_path: translation/ot/genesis/022/004.yaml
  text: On the third day Abraham lifted up his eyes and saw the place from afar[a].
translation:
  language: ta
  text: மூன்றாம் நாளில் ஆபிரகாம் தன் கண்களை உயர்த்தி, அந்த இடத்தைத் தொலைவிலிருந்து[a] கண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தூரத்திலிருந்து.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: மூன்றாம் நாளில்
  rationale: குறிப்பிட்ட மூன்றாம் நாளைக் குறிக்கும் நேரச் சொற்றொடர். ‘பயணத்தின்’ போன்ற விளக்கச் சொல் எபிரெய மூலத்தில் இல்லாததால் சேர்க்கப்படவில்லை.
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: தன் கண்களை உயர்த்தி
  rationale: ‘தன் கண்களை உயர்த்தினார்’ என்ற எபிரெய மரபுத்தொடரின் உருவகத்தையும் தொடர்ச்சியான நிகழ்வோட்டத்தையும் இயல்பான தமிழில் காக்கிறது; ‘நிமிர்ந்து பார்த்து’ என்பது பொருளைத் தரினும் மூலத்தின் சொல்லமைப்பைச் சற்றுத் தட்டையாக்கும்.
- source_word: וַיַּרְא
  choice: கண்டார்
  rationale: ראה வினையின் தொடர்ச்சியான கதைநடைச் செயலைத் தெளிவாகத் தருகிறது. தமிழ் வாக்கியத்தில் வினைமுற்று ஆண்பால் ஒருமை எழுவாயையும் வெளிப்படுத்துகிறது.
- source_word: הַמָּקוֹם
  choice: அந்த இடத்தை
  rationale: முன்னரே கடவுள் சுட்டிய குறிப்பிட்ட இடத்தைக் குறிக்கும் definite noun. தமிழில் ‘அந்த இடம்’ என்பது சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது; ‘தலம்’ தேவையற்ற சமயச் சாயலை ஏற்படுத்தலாம்.
- source_word: מֵרָחֹק
  choice: தொலைவிலிருந்து
  rationale: தூரத்திலிருந்து காணப்பட்டதை இயல்பான நவீன தமிழில் குறிக்கிறது. ‘தூரத்திலிருந்து’ என்பதும் செல்லத்தக்க மாற்று.
- source_word: אַבְרָהָם
  choice: ஆபிரகாம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயரெழுத்தாக்கம்.
