base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/013.yaml
  text: Then Abraham lifted up his eyes and looked[a], and behold, behind him was a ram caught in the thicket by its horns[b]. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
translation:
  language: ta
  text: பிறகு ஆபிரகாம் தன் கண்களை உயர்த்திப் பார்த்தார். இதோ, பின்னால்[a] ஒரு செம்மறியாட்டுக் கடா தன் கொம்புகளில் புதரில் சிக்கியிருந்தது. ஆபிரகாம் சென்று அந்தக் கடாவை எடுத்துக்கொண்டு, தன் மகனுக்குப் பதிலாக[b] அதைத் தகனபலியாகச் செலுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்குப் பின்னால்.” எபிரெய மூலத்தில் “அவருக்கு” என்பது வெளிப்படையாக இல்லை; இங்குள்ள אַחַר இடத்தைக் குறிக்கும் சொல்லாகப் பலரால் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தன் மகனின் இடத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו וַיַּרְא
  choice: தன் கண்களை உயர்த்திப் பார்த்தார்
  rationale: எபிரெய மொழியின் ‘கண்களை உயர்த்துதல்’ என்ற கதைநடைச் சொல்லாட்சியை இயல்பான நவீன தமிழில் தக்கவைக்கிறது; தொடர்ந்து வரும் וַיַּרְא-வின் பார்வைச் செயலையும் இணைத்துக் கூறுகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: எதிர்பாராத காட்சியின்மீது வாசகரின் கவனத்தைத் திருப்பும் எபிரெயக் கதைநடைத் துகளின் வலிமையைப் பாதுகாக்கிறது.
- source_word: אַיִל
  choice: செம்மறியாட்டுக் கடா
  rationale: பலிச் சூழலில் வயதுவந்த ஆண் செம்மறியாட்டைக் குறிக்கும் துல்லியமான, புரிந்துகொள்ளக்கூடிய தமிழ்ச் சொற்றொடர்.
- source_word: אַחַר
  choice: அவருக்குப் பின்னால்
  rationale: இச்சூழலில் இது இடத்தைக் குறிக்கும் வினையடையாகப் புரிந்துகொள்ளப்படுகிறது. இயல்பான தமிழுக்காக ‘அவருக்கு’ சேர்க்கப்பட்டுள்ளது; மூலத்தில் அந்தப் பிரதிப்பெயர் வெளிப்படையாக இல்லை என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: נֶאֱחַז בַּסְּבַךְ בְּקַרְנָיו
  choice: தன் கொம்புகளால் புதரில் சிக்கிக்கொண்டிருந்தது
  rationale: கடா அடர்ந்த செடிகளில் அதன் கொம்புகளின் காரணமாகப் பிடிபட்டிருந்த நிலையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַיַּעֲלֵהוּ לְעֹלָה
  choice: அதைத் தகனபலியாகச் செலுத்தினார்
  rationale: עלה மற்றும் עֹלָה ஆகியவற்றின் பலியிடும் சூழலைச் சுருக்கமாகவும் மரியாதையான தமிழிலும் தெரிவிக்கிறது.
- source_word: תַּחַת בְּנוֹ
  choice: தன் மகனுக்குப் பதிலாக
  rationale: இங்கு תחת வெளிப்படுத்தும் மாற்றீட்டுப் பொருளை நேரடியாகக் கூறுகிறது; வசனம் கூறுவதைத் தாண்டிய கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: תַּחַת בְּנוֹ என்பதிலுள்ள மாற்றீட்டுப் பொருள்
  choice: தன் மகனுக்குப் பதிலாக
  alternative: தன் மகனின் இடத்தில்
  rationale: கதையின் சூழலில் கடா மகனுக்குப் பதிலாகப் பலியிடப்படுவதை எபிரெய முன்னிடைச்சொல் தெளிவாகக் குறிக்கிறது. பின்னாளைய இறையியல் முடிவுகளை வசனத்திற்குள் சேர்க்காமல் அந்தப் பொருள் மட்டும் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற கவன ஈர்ப்புச் சொலும் ‘தகனபலி’ என்ற பரவலாக அறியப்பட்ட வேதாகமப் பலிச் சொல்லும் தக்கவைக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களின் அருகிலேயே வைக்கப்பட்டுள்ளன.
