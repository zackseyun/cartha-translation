translation:
  language: ta
  text: நான் உன்னை நிச்சயமாக ஆசீர்வதிப்பேன்; உன் சந்ததியை[a] வானத்தின் விண்மீன்களைப் போலவும், கடற்கரையில் இருக்கும் மணலைப் போலவும் நிச்சயமாகப் பெருகச் செய்வேன். உன் சந்ததி தன் பகைவர்களின் வாயிலைத் தனதாக்கிக்கொள்ளும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘உன் வித்து.’ இச்சொல் இலக்கணத்தில் ஒருமையாக இருந்து, ஒருவரையோ வழித்தோன்றல்களை ஒரு கூட்டமாகவோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தனதாக்கிக்கொள்ளும்’ என்பதற்கு ‘உரிமையாக்கிக்கொள்ளும்’ அல்லது ‘கைப்பற்றும்’ என்றும் மொழிபெயர்க்கலாம். ‘வாயில்’ என்பது பகைவர் நகரத்தின் மீதான கட்டுப்பாட்டைக் குறிக்கும் படிமமாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: நிச்சயமாக
  rationale: முந்தைய வசனத்தில் தொடங்கும் இறை ஆணையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இச்சொல்லின் உறுதிப்படுத்தும் வலிமை, தமிழில் தொடர்ந்து வரும் வாக்குறுதிகளோடு இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: בָרֵךְ אֲבָרֶכְךָ
  choice: நான் உன்னை நிச்சயமாக ஆசீர்வதிப்பேன்
  rationale: முற்றுவினைக்கு முன் வரும் வினையெச்சப் பெயரின் வலியுறுத்தலை, சொற்களை இயல்பற்ற விதத்தில் இரட்டிக்காமல் ‘நிச்சயமாக’ என்பதன் மூலம் வெளிப்படுத்துகிறது.
- source_word: וְהַרְבָּה אַרְבֶּה
  choice: நிச்சயமாகப் பெருகச் செய்வேன்
  rationale: எபிரெய வினை இரட்டிப்பின் உறுதியையும் தீவிரத்தையும் இயல்பான நவீனத் தமிழில் தருகிறது; ஆசீர்வாத வாக்கியத்தோடு இணையான அமைப்பையும் பேணுகிறது.
- source_word: זַרְעֲךָ
  choice: உன் சந்ததி
  rationale: זֶרַע என்பது இலக்கணத்தில் ஒருமையாக இருந்தாலும் கூட்டுப் பொருளில் வழித்தோன்றல்களைக் குறிக்கலாம். ‘சந்ததி’ அந்த ஒருமை–கூட்டுப் பொருள் திறனைத் தமிழில் பேணுகிறது.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: வானத்தின் விண்மீன்களைப் போல
  rationale: வான்மீன்களின் பெருந்தொகை என்ற உருவகத்தை உயர்வானதும் இயல்பானதுமான தமிழில் தருகிறது.
- source_word: וְכַחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: கடற்கரையில் இருக்கும் மணலைப் போல
  rationale: אֲשֶׁר עַל என்ற தொடர்புச் சொற்றொடரை வெளிப்படையாகப் பேணுகிறது; שְׂפַת הַיָּם என்பதைக் ‘கடற்கரை’ என்று இயல்பாக மொழிபெயர்க்கிறது.
- source_word: וְיִרַשׁ
  choice: தனதாக்கிக்கொள்ளும்
  rationale: יָרַשׁ இங்கு வெறுமனே உரிமையாகப் பெறுவதைவிட கைப்பற்றி உடைமையாக்குதல் அல்லது கட்டுப்பாட்டில் கொண்டுவருதல் என்ற செயற்பொருளைக் கொண்டுள்ளது.
- source_word: שַׁעַר
  choice: வாயில்
  rationale: மூல உருவகத்தை நேரடியாகப் பேணுகிறது; பண்டைய நகரத்தின் வாயிலைக் கைப்பற்றுவது அந்த நகரத்தின் மீது ஆட்சி அல்லது கட்டுப்பாடு பெறுவதைக் குறிக்கலாம்.
- source_word: אֹיְבָיו
  choice: தன் பகைவர்களின்
  rationale: எபிரெயத்தில் உள்ள ஒருமைச் சுட்டை தமிழின் எண்ணிக்கையை வெளிப்படையாக நிர்ணயிக்காத ‘தன்’ மூலம் இயல்பாகப் பிரதிபலிக்கிறது; இதனால் சந்ததியின் கூட்டுப் பொருளும் இலக்கண ஒருமையும் இரண்டும் திறந்தவையாக இருக்கின்றன.
theological_decisions:
- issue: זֶרַע என்ற கூட்டொருமையும் אֹיְבָיו என்ற ஒருமைச் சுட்டும்
  choice: ‘உன் சந்ததி ... தன் பகைவர்களின்’ என்று மொழிபெயர்த்தல்
  alternative: ‘உன் வழித்தோன்றல்கள் ... தங்கள் பகைவர்களின்’ அல்லது ‘உன் வித்து ... அவனுடைய பகைவர்களின்’
  rationale: மூலம் சந்ததியை இலக்கண ஒருமையில் வைத்தபடியே கூட்டுப் பொருளையும் அனுமதிக்கிறது. தமிழின் ‘சந்ததி’ மற்றும் ‘தன்’ ஆகியவை இதை ஒரு தனிநபர் சார்ந்த விளக்கமாகவோ வெறும் பன்மையாகவோ முன்கூட்டியே முடிவு செய்யாமல் அந்த இறையியல் பதற்றத்தைப் பேணுகின்றன.
- issue: ‘பகைவர்களின் வாயிலை உடைமையாக்குதல்’ என்ற உருவகம்
  choice: வாயில் என்ற மூலப் படிமத்தை வைத்துக்கொண்டு ‘தனதாக்கிக்கொள்ளும்’ என மொழிபெயர்த்தல்
  alternative: ‘பகைவர்களின் நகரங்களை வெல்லும்’
  rationale: வாயில் என்பது நகரத்தின் அதிகாரத்தையும் பாதுகாப்பையும் குறிக்கக்கூடியதாக இருந்தாலும், விளக்கத்தை நேரடியாக உரையில் பதிக்காமல் மூல உருவகத்தையே வாசகருக்காகப் பேணுகிறது.
