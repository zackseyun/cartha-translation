  text: Then he sent out the dove from him to see whether the waters had subsided from the surface of the ground[a][b].
translation:
  language: ta
  text: பின்பு, நிலத்தின் மேற்பரப்பிலிருந்து தண்ணீர் குறைந்துவிட்டதா என்று பார்ப்பதற்காக, தம்மிடமிருந்து புறாவை அனுப்பினார்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தணிந்துவிட்டதா.” இங்குள்ள எபிரெய வினைச்சொல் வெள்ளநீர் குறைந்ததைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு சொல்: “நிலத்தின் முகத்தின் மேலிருந்து.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: பின்பு ... அனுப்பினார்
  rationale: வழக்குரைத் தொடரை முன்னெடுக்கும் wayyiqtol வடிவத்தின் தொடர்ச்சிப் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַיּוֹנָה
  choice: புறாவை
  rationale: יוֹנָה என்பது புறா/மாடப்புறாவைக் குறிக்கலாம்; வெள்ளக் கதையின் சூழலிலும் பொதுத் தமிழ் பயன்பாட்டிலும் ‘புறா’ இயல்பான தேர்வு.
- source_word: מֵאִתּוֹ
  choice: தன்னிடமிருந்து
  rationale: நோவாவின் உடனிருப்பிலிருந்து புறா அனுப்பப்பட்டதை எபிரெயச் சொற்றொடருக்கு நெருக்கமாகப் பாதுகாக்கிறது; ‘பேழையிலிருந்து’ என்று மூலத்தில் இல்லாத குறிப்பைச் சேர்க்கவில்லை.
- source_word: לִרְאוֹת
  choice: பார்ப்பதற்காக
  rationale: ראה என்ற வினையின் நோக்கத்தைக் குறிக்கும் infinitive வடிவத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: הֲקַלּוּ
  choice: குறைந்துவிட்டதா
  rationale: இந்தச் சூழலில் קלל என்பது வெள்ளநீர் குறைந்ததைக் குறிக்கிறது. ‘குறைந்துவிட்டதா’ என்பது நிறைவு நிலையை உணர்த்தும் தெளிவான நவீனத் தமிழ்.
- source_word: הַמַּיִם
  choice: தண்ணீர்
  rationale: எபிரெயத்தில் வடிவியல் பன்மை இருந்தாலும், வெள்ளநீரைக் குறிக்கும் இடத்தில் தமிழில் ஒருமைத் தொகுப்புப்பெயரான ‘தண்ணீர்’ இயல்பாக உள்ளது.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: நிலத்தின் மேற்பரப்பிலிருந்து
  rationale: ‘நிலத்தின் முகத்தின்மேலிருந்து’ என்ற நேரடிப் படிமத்தை, அதன் இடவியல் பொருளைப் பாதுகாத்தபடி தெளிவான நவீன தமிழில் வழங்குகிறது.
