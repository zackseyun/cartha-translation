translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதையான வேதாகம நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத் தொடரமைப்பின் அழுத்தத்தைத் தமிழில் இயல்பாக்க வாக்கிய உறுப்புகள் மறுவரிசைப்படுத்தப்பட்டுள்ளன; மூலத்தில் உள்ள ‘தன்னிடமிருந்து’ என்ற கூறு விடப்படவில்லை.
