revisions:
- from: உன்னுடன் இருக்கும் எல்லா உயிரினங்களையும்—பறவைகள், கால்நடைகள், பூமியில் ஊர்ந்து செல்லும் எல்லா ஊரும் பிராணிகள் ஆகிய எல்லா மாம்ச உயிர்களையும்—உன்னுடன் வெளியே கொண்டுவா. அவை பூமியில் திரளாகப் பெருகி[a], பூமியில் பலுகிப் பெருகட்டும்.
  to: உன்னுடன் இருக்கும் எல்லா உயிரினங்களையும் வெளியே கொண்டுவா—எல்லா மாம்ச உயிரினங்களிலுமுள்ள பறவைகள், கால்நடைகள், பூமியில் ஊர்ந்து செல்லும் எல்லா ஊர்வனங்கள் ஆகியவற்றை உன்னுடன் கொண்டுவா. அவை பூமியில் திரளாகப் பெருகி[a], பூமியில் பலுகட்டும்; பெருகட்டும்.
  rationale: 'The revision clarifies the Hebrew comprehensive expression and its three categories, improves modern Tamil flow, and preserves the distinct sequence: swarm/teem, be fruitful, and multiply. The footnote remains attached to ‘திரளாகப் பெருகி,’ the rendering of וְשָׁרְצוּ.'
