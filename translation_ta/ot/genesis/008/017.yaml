base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/017.yaml
  text: Bring out with you every living thing that is with you[a], from all flesh—birds and livestock and every creeping thing that creeps on the earth—so that they may swarm on the earth and be fruitful and multiply on the earth.
translation:
  language: ta
  text: உன்னுடன் இருக்கும் எல்லா உயிரினங்களையும் வெளியே கொண்டுவா—எல்லா மாம்ச உயிரினங்களிலுமுள்ள பறவைகள், கால்நடைகள், பூமியில் ஊர்ந்து செல்லும் எல்லா ஊர்வனங்கள் ஆகியவற்றை உன்னுடன் கொண்டுவா. அவை பூமியில் திரளாகப் பெருகி[a], பூமியில் பலுகட்டும்; பெருகட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமியில் கூட்டம் கூட்டமாகப் பரவட்டும்.” எபிரெய வினைச்சொல் ஏராளமாகத் திரளுதல் அல்லது பெருகுதல் என்ற பொருளைக் கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: எல்லா உயிரினங்களையும்
  rationale: חַיָּה இங்கு காட்டுவிலங்குகளை மட்டும் குறுக்காமல், தொடர்ந்து பட்டியலிடப்படும் உயிருள்ள பிராணிகள் அனைத்தையும் உள்ளடக்குகிறது.
- source_word: אֲשֶׁר אִתְּךָ
  choice: உன்னுடன் இருக்கும்
  rationale: பெயர்ச்சொல்லை இயல்பான நவீன தமிழில் விளக்கும் தொடர்புச் சொற்றொடர்.
- source_word: מִכָּל בָּשָׂר
  choice: எல்லா மாம்ச உயிர்களையும்
  rationale: בָּשָׂר என்பதன் ‘மாம்சம்’ என்ற உருவகத்தைத் தக்கவைத்தபடியே, இங்கு உயிருள்ள படைப்புகளைக் கூட்டாகக் குறிப்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: בָּעוֹף
  choice: பறவைகள்
  rationale: பறக்கும் உயிரினங்கள் என்ற விரிவான சாத்தியம் இருந்தாலும், இப்பட்டியலில் இயல்பான பொதுப்பெயர் ‘பறவைகள்’ ஆகும்.
- source_word: וּבַבְּהֵמָה
  choice: கால்நடைகள்
  rationale: בְּהֵמָה குறிப்பாக மனிதருடன் வாழும் பெரிய நிலவிலங்குகளைக் குறிக்கக்கூடும்; ‘கால்நடைகள்’ நவீன தமிழில் தெளிவான தேர்வு.
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ
  choice: ஊர்ந்து செல்லும் எல்லா ஊரும் பிராணிகள்
  rationale: רֶמֶשׂ / רֹמֵשׂ ஆகிய ஒரே சொல்வேரின் மீளொலியை ‘ஊரும் / ஊர்ந்து செல்லும்’ என்பதால் இயன்றவரைத் தக்கவைக்கிறது.
- source_word: הוֹצֵא אִתָּךְ
  choice: உன்னுடன் வெளியே கொண்டுவா
  rationale: יצא என்பதன் causative கட்டளை வடிவத்தைத் தக்கவைத்து, நோவா உயிரினங்களை வெளியே அழைத்துவர வேண்டும் என்பதைத் தெளிவாக்குகிறது.
- source_word: וְשָׁרְצוּ
  choice: திரளாகப் பெருகி
  rationale: שׁרץ குறிக்கும் கூட்டமாய் அல்லது ஏராளமாய் பெருகும் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בָאָרֶץ
  choice: பூமியில்
  rationale: வெள்ளத்திற்குப் பிந்தைய பரந்த சூழலில் אָרֶץ என்பது உள்ளூர் நிலத்தைவிட ‘பூமி’ என்று பொருள்படுவது பொருத்தமானது.
- source_word: וּפָרוּ וְרָבוּ
  choice: பலுகிப் பெருகட்டும்
  rationale: ஆதியாகமத்தின் படைப்பாசீர்வாத மொழியுடன் உள்ள இலக்கியத் தொடர்பைத் தக்கவைக்கும் நிலைபெற்ற, சுருக்கமான தமிழ்ச் சொற்றொடர்.
theological_decisions:
- issue: வெள்ளத்திற்குப் பின் படைப்பாசீர்வாத மொழியின் மறுபயன்பாடு
  choice: ‘திரளாகப் பெருகி’ மற்றும் ‘பலுகிப் பெருகட்டும்’ என்ற பெருக்க மொழியைத் தக்கவைத்தல்
  alternative: ‘எண்ணிக்கையில் மிகவும் அதிகரிக்கட்டும்’ போன்ற பொதுவான விளக்க மொழி
  rationale: שׁרץ, פרה, רבה ஆகிய வினைகள் ஆதியாகமம் 1-இன் படைப்பு மற்றும் ஆசீர்வாத மொழியை நினைவூட்டுகின்றன. அந்தத் தொடர்பை மொழிபெயர்ப்பு வெளிப்படுத்துகிறது; அதற்கு மேலான கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய புரிதலும் இணையும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மாம்ச உயிர்கள்’ மூலமொழியின் உருவகத்தைப் பாதுகாக்கிறது; ‘பலுகிப் பெருகட்டும்’ படைப்பாசீர்வாதத்தின் இலக்கிய எதிரொலியைத் தக்கவைக்கச் சிறிது உயர்ந்த, ஆனால் பரவலாக அறியப்பட்ட வேதாகமத் தமிழாக வைக்கப்பட்டுள்ளது.
