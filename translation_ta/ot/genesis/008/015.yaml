lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... கூறியதாவது
  rationale: வாவ் தொடர் வடிவம் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘பின்பு’ அதன் தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது. דּבר இங்கு உரைத்தலைக் குறிக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இச்சூழலில் இச்சொல் ஒரே உண்மையான கடவுளைக் குறிக்கிறது; நவீன பொதுத் தமிழில் ‘கடவுள்’ இயல்பான இணைச்சொல்.
- source_word: אֶל
  choice: நோவாவிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதைத் தமிழில் இயல்பாகக் குறிக்க ‘-ிடம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: נֹחַ
  choice: நோவா
  rationale: எபிரேயப் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֵאמֹר
  choice: 'கூறியதாவது:'
  rationale: அடுத்து வரும் உரையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரேய வடிவத்தை, தமிழில் மேற்கோளை இயல்பாகத் தொடங்கும் ‘கூறியதாவது:’ என்ற அமைப்பு எடுத்துரைக்கிறது.
