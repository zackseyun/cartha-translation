reference: Genesis 8:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּיָּ֣חֶל ע֔וֹד שִׁבְעַ֥ת יָמִ֖ים אֲחֵרִ֑ים וַ/יְשַׁלַּח֙ אֶת הַ/יּוֹנָ֔ה וְ/לֹֽא יָסְפָ֥ה שׁוּב אֵלָ֖י/ו עֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/012.yaml
  text: Then he waited another seven days[a], and sent out the dove, and it did not return to him again.
translation:
  language: ta
  text: பின்பு அவன் மேலும் ஏழு நாட்கள் காத்திருந்து, புறாவை வெளியே அனுப்பினான். அது மீண்டும் அவனிடம் திரும்பி வரவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது இனி அவனிடம் திரும்பி வரவில்லை.” יָסְפָה + שׁוּב என்ற எபிரெய மறுப்பு அமைப்பை “மீண்டும் திரும்பி வரவில்லை” என்றும் “இனி திரும்பி வரவில்லை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיָּחֶל
  choice: பின்பு அவன் ... காத்திருந்து
  rationale: יחל என்பதற்கு இச்சூழலில் ‘காத்திரு’ என்பது இயல்பான பொருள்; வாவ் தொடர்கதை நகர்வை ‘பின்பு’ வெளிப்படுத்துகிறது.
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: இன்னும் ஏழு நாட்கள்
  rationale: முந்தைய காத்திருப்பைத் தொடர்ந்து கூடுதலான ஏழு நாட்கள் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיְשַׁלַּח אֶת־הַיּוֹנָה
  choice: புறாவை வெளியே அனுப்பினான்
  rationale: שׁלח என்பதன் அடிப்படைப் பொருளான ‘அனுப்பு’ என்பதையும், பேழையிலிருந்து புறாவை அனுப்பிய சூழலையும் தெளிவாகக் காட்டுகிறது.
- source_word: וְלֹא יָסְפָה שׁוּב
  choice: மறுபடியும் ... திரும்பி வரவில்லை
  rationale: மறுக்கப்பட்ட יסף உடன் שׁוּב சேர்ந்துள்ள தொடரை, மீண்டும் நிகழாத திரும்பிவருதலாக இயல்பான தமிழில் தருகிறது.
- source_word: אֵלָיו
  choice: அவனிடம்
  rationale: நோவாவை நோக்கிய திரும்புதலின் இலக்கைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: עוֹד
  choice: மறுபடியும்
  rationale: இறுதி עוֹד, மறுக்கப்பட்ட יסף + שׁוּב அமைப்பில் ‘மீண்டும்’ என்ற நிகழ்வுசார் பொருளைத் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மொழியிலுள்ள ‘மீண்டும் வரவில்லை / இனி வரவில்லை’ என்ற உண்மையான பொருள் நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
