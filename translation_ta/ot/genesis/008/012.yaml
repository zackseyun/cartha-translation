revisions:
- from: பின்பு அவன் இன்னும் ஏழு நாட்கள் காத்திருந்து, புறாவை வெளியே அனுப்பினான். அது மறுபடியும் அவனிடம் திரும்பி வரவில்லை.[a]
  to: பின்பு அவன் மேலும் ஏழு நாட்கள் காத்திருந்து, புறாவை வெளியே அனுப்பினான். அது மீண்டும் அவனிடம் திரும்பி வரவில்லை.[a]
  rationale: The revision makes the additional seven-day interval explicit and refines the footnote so that both legitimate renderings of the negated יָסְפָה + שׁוּב expression are retained without implying that the dove had not returned on earlier occasions.
  reviewer_model: gpt-5.6-terra
