base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/009.yaml
  text: But the dove found no resting place for the sole of her foot[a], so she returned to him, to the ark, because the waters were on the surface of all the earth[d][c][b]. Then he stretched out his hand and took her and brought her to himself into the ark.
translation:
  language: ta
  text: ஆனால், புறா தன் காலடியை வைக்க ஓய்விடம் எதையும் காணவில்லை. பூமி முழுவதின் மேற்பரப்பிலும் தண்ணீர் இருந்ததால், அது பேழையிலிருந்த அவனிடம் திரும்பி வந்தது. அவன் தன் கையை நீட்டி, அதைப் பிடித்து, பேழைக்குள் தன்னருகே கொண்டுவந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצְאָה
  choice: காணவில்லை
  rationale: מצא என்பதன் இயல்பான பொருள் ‘காணுதல்’; மறுப்பு வடிவத்துடன் தமிழில் ‘காணவில்லை’ என்பது நேர்த்தியான உரை.
- source_word: מָנוֹחַ לְכַף רַגְלָהּ
  choice: தன் உள்ளங்கால் பதிய ஓய்விடம்
  rationale: מָנוֹחַ என்பதின் ஓய்விடப் பொருளையும், כַף רֶגֶל என்பதின் ‘உள்ளங்கால்’ உருவகத்தையும் இயல்பான தமிழில் ஒன்றாகப் பாதுகாக்கிறது.
- source_word: וַתָּשָׁב אֵלָיו אֶל־הַתֵּבָה
  choice: அது பேழையிலிருந்த அவனிடம் திரும்பி வந்தது
  rationale: ‘அவனிடம்’ மற்றும் ‘பேழைக்கு’ என்ற இரு திசைக் குறிப்புகளையும் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; புறாவுக்கு தமிழில் இயல்பான அஃறிணைப் பெயர்ப்பதிலி பயன்படுத்தப்படுகிறது.
- source_word: כִּי מַיִם עַל־פְּנֵי כָל־הָאָרֶץ
  choice: பூமி முழுவதின் மேற்பரப்பிலும் தண்ணீர் இருந்ததால்
  rationale: כִּי-யின் காரணப் பொருளையும், ‘பூமி முழுவதின் முகம்/மேற்பரப்பு மீது’ என்ற எபிரெய உருவகத்தையும் பாதுகாக்கிறது.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: அவன் தன் கையை நீட்டி
  rationale: கையைச் சார்ந்த שׁלח வினைச்சொல் வழக்கின் இயல்பான தமிழ் ‘கையை நீட்டுதல்’ ஆகும்.
- source_word: וַיִּקָּחֶהָ
  choice: அதைப் பிடித்து
  rationale: לקח அடிப்படையில் ‘எடுத்துக்கொள்’ எனினும், திரும்பிய புறாவை கையால் ஏற்றுக்கொள்ளும் சூழலில் ‘பிடித்து’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו אֶל־הַתֵּבָה
  choice: பேழைக்குள் தன்னிடம் சேர்த்துக்கொண்டான்
  rationale: ‘தன்னிடம்’ மற்றும் ‘பேழைக்குள்’ ஆகிய இரு எபிரெய கூறுகளையும் காத்து, தமிழில் இயல்பாகச் சொல்கிறது.
