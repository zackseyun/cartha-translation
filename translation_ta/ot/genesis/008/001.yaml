  text: וַ/יִּזְכֹּ֤ר אֱלֹהִים֙ אֶת נֹ֔חַ וְ/אֵ֤ת כָּל הַֽ/חַיָּה֙ וְ/אֶת כָּל הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָ֑ה וַ/יַּעֲבֵ֨ר אֱלֹהִ֥ים ר֨וּחַ֙ עַל הָ/אָ֔רֶץ וַ/יָּשֹׁ֖כּוּ הַ/מָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/001.yaml
  text: But God remembered Noah[a], and all the wild animals, and all the livestock that were with him in the ark. And God caused a wind to pass over the earth[b], and the waters subsided.
translation:
  language: ta
  text: ஆனால் தேவன் நோவாவையும், பேழையில் அவனுடன் இருந்த எல்லாக் காட்டு விலங்குகளையும் எல்லாக் கால்நடைகளையும் நினைவுகூர்ந்தார்[a]. தேவன் பூமியின்மேல் ஒரு காற்றை வீசச் செய்தார்[b]; நீர் தணிந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தேவன் நோவாவைக் கருத்தில் கொண்டார்.’ ‘நினைவுகூர்ந்தார்’ என்பதற்கான எபிரெயச் சொல் பல இடங்களில் வெறும் நினைவுக்கு வருதலை மட்டுமல்லாமல், உண்மையுடன் செயல்படுவதையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: רוּחַ (ரூவாக்) என்ற எபிரெயச் சொல்லுக்கு ‘காற்று,’ ‘மூச்சு,’ அல்லது ‘ஆவி’ என்று பொருள் வரலாம். இங்கு ‘காற்று’ என்பதே சூழலுக்கு மிகவும் பொருத்தமானது; எனினும், ஆதியாகமம் 1:2-இல் நீரின்மேல் அசைந்தாடிய தேவ ஆவி/காற்றின் உருவகத்துடன் இங்கு ஒரு எதிரொலி இருப்பதாகச் சிலர் காண்கின்றனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: நினைவுகூர்ந்தார்
  rationale: எபிரெய மொழியின் உருவக வழக்கைத் தக்கவைக்கிறது. இங்கு இது வெறும் மனநினைவை மட்டுமல்லாமல், நோவாவின் நலனுக்காக தேவன் உண்மையுடன் செயல்படுவதையும் குறிக்கிறது.
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: ஒருமை வினையுடன் வரும் இச்சூழலில் இஸ்ரவேலின் ஒரே தேவனைக் குறிக்கும் வழக்கமான, கண்ணியமான தமிழ் சொல்.
- source_word: כָּל הַחַיָּה
  choice: எல்லாக் காட்டு விலங்குகள்
  rationale: அடுத்து வரும் בְּהֵמָה என்பதிலிருந்து வேறுபாட்டைப் பேணுகிறது; இவ்விணைப்பில் חַיָּה பொதுவாகக் காட்டு விலங்குகளைக் குறிக்கிறது.
- source_word: כָּל הַבְּהֵמָה
  choice: எல்லாக் கால்நடைகள்
  rationale: காட்டு விலங்குகளுக்கு மாறாக மனிதர்களால் வளர்க்கப்படும் நிலவாழ் விலங்குகளைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: אֲשֶׁר אִתּוֹ
  choice: அவனுடன் இருந்த
  rationale: எபிரெய உறவுநிலைத் தொடரின் பொருளை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: בַּתֵּבָה
  choice: பேழையில்
  rationale: நோவாவின் תֵּבָה என்பதற்கான நிலைபெற்ற வேதாகமத் தமிழ் சொல்; இச்சூழலில் கப்பல் போன்ற பேழையைக் குறிக்கிறது.
- source_word: וַיַּעֲבֵר ... רוּחַ
  choice: ஒரு காற்றை வீசச் செய்தார்
  rationale: רוּחַ என்பதன் உடனடிச் சூழலுக்குப் பொருத்தமான ‘காற்று’ என்ற பொருளையும், עבר என்பதன் காரணவினை வடிவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל הָאָרֶץ
  choice: பூமியின்மேல்
  rationale: வெள்ளக் கதையின் விரிவான சூழலில் אֶרֶץ என்பதற்கு ‘நிலம்’ என்பதைவிட ‘பூமி’ பொருத்தமானது.
- source_word: וַיָּשֹׁכּוּ הַמָּיִם
  choice: நீர் தணிந்தது
  rationale: வெள்ளநீர் அடங்குதல் அல்லது குறைதல் என்ற வினையின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַ
  choice: ஆனால்
  rationale: தீர்ப்பிலிருந்து இரக்கத்தை நோக்கிக் கதை திரும்புவதைத் தமிழில் தெளிவுபடுத்துகிறது; எபிரெய இணைப்பிடைச்சொல்லின் உரையாடல் செயல்பாட்டை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘தேவன் நோவாவை நினைவுகூர்ந்தார்’ என்பதிலுள்ள மனிதப் பண்பேற்ற மொழி
  choice: ‘நினைவுகூர்ந்தார்’ என்ற எபிரெய மொழிவழக்கைத் தக்கவைத்தல்
  alternative: ‘நோவாவைக் கருத்தில் கொண்டார்’ அல்லது ‘நோவாவின்மேல் கவனம் செலுத்தினார்’
  rationale: இது தேவன் முன்பு மறந்திருந்தார் என்று கூறுவதல்ல; நோவாவுக்காக உண்மையுடன் செயல்படுவதைச் சுட்டுகிறது. மூலத்தின் இலக்கிய வலிமையையும் இறையியல் அழுத்தத்தையும் விளக்கிச் சீராக்காமல் தக்கவைக்கிறது.
- issue: வெள்ளக் கதையில் רוּחַ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘காற்று’
  alternative: ‘ஆவி’
  rationale: நீர் தணிவதற்குக் காரணமான வானிலைச் செயலே உடனடிச் சூழலுக்கு மிகப் பொருத்தமானது. ஆயினும் ஆதியாகமம் 1:2-இன் படைப்பு உருவகத்தோடு இருக்கக்கூடிய எதிரொலியை அடிக்குறிப்பு குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பேழை,’ ‘தேவன்,’ ‘நினைவுகூர்ந்தார்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; வாக்கிய அமைப்பு இயல்பான தமிழுக்கேற்ப அமைக்கப்பட்டுள்ளது.
