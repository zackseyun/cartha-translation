  text: וַ/יָּ֣חֶל ע֔וֹד שִׁבְעַ֥ת יָמִ֖ים אֲחֵרִ֑ים וַ/יֹּ֛סֶף שַׁלַּ֥ח אֶת הַ/יּוֹנָ֖ה מִן הַ/תֵּבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/010.yaml
  text: Then he waited another seven days[a], and again sent out the dove from the ark.
translation:
  language: ta
  text: பின்பு அவன் இன்னும் ஏழு நாட்கள் காத்திருந்து[a], மறுபடியும் அந்தப் புறாவைப் பேழையிலிருந்து வெளியே அனுப்பினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பின்பு அவன் மேலும் ஏழு நாட்கள் காத்திருப்பதைத் தொடங்கினான்.” எபிரெய வினைச்சொல்லுக்கு நேரடியான பொருள் “தொடங்கினான்” என்றும் இருக்கலாம்; ஆனால் இச்சூழலில் “காத்திருந்தான்” என்பதே பொருத்தமான பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחֶל
  choice: காத்திருந்து
  rationale: இவ்வினைச்சொல் அடிப்படையில் ‘தொடங்கினான்’ எனப் பொருள்படக்கூடும்; ஆனால் கால அளவைக் குறிக்கும் தொடரோடு இங்கு ‘காத்திருந்தான்’ என்ற மரபுத்தொடர் பொருள் சூழலுக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: இன்னும் ஏழு நாட்கள்
  rationale: עוֹד மற்றும் אֲחֵרִים ஆகிய இரண்டும் முந்தைய காலப்பகுதிக்குப் பிறகான கூடுதல் ஏழு நாட்களைக் குறிக்கின்றன; நவீன தமிழில் ‘இன்னும் ஏழு நாட்கள்’ இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: וַיֹּסֶף שַׁלַּח
  choice: மறுபடியும் ... வெளியே அனுப்பினான்
  rationale: ‘மேலும் செய்தான்’ என்ற எபிரெய மரபுத்தொடர் இங்கு முன்பு செய்த செயலைத் திரும்பச் செய்ததைக் குறிக்கிறது; שׁלח என்பது பேழையிலிருந்து புறாவை வெளியே அனுப்பியதைச் சுட்டுகிறது.
- source_word: הַיּוֹנָה
  choice: அந்தப் புறாவை
  rationale: வருணனையில் ஏற்கெனவே குறிப்பிடப்பட்ட குறிப்பிட்ட புறாவை எபிரெயத் திட்டவிகுதி சுட்டுவதால் ‘அந்தப் புறா’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מִן הַתֵּבָה
  choice: பேழையிலிருந்து
  rationale: நோவாவின் கதைச்சூழலில் תֵּבָה என்பது பெருவெள்ளப் பேழையைக் குறிக்கிறது; מן என்பதன் வெளியேறும் பொருள் ‘பேழையிலிருந்து’ என்பதில் தெளிவாகிறது.
