translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்கு இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘பேழை’ என்பது ஆதியாகமப் பெருவெள்ளக் கதைச்சூழலில் நிலைபெற்ற தெளிவான சொல்லாகப் பயன்படுத்தப்பட்டது; மூலத்திலுள்ள சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
