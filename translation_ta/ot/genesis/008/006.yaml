  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதையுரை. எபிரெய மொழியின் கனமான தொடக்க வாய்பாடு முதன்மை உரையில் இயல்பான காலத் துணைவாக்கியமாக மாற்றப்பட்டுள்ளது; அதன் நேரடியான வடிவமும் מִקֵּץ என்பதன் மாற்று வாசிப்பும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
