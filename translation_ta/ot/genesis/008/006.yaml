base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/006.yaml
  text: At the end of forty days[b][a], Noah opened the window of the ark that he had made.
translation:
  language: ta
  text: நாற்பது நாட்கள் முடிந்தபோது[a][b], நோவா தான் செய்திருந்த பேழையின் சாளரத்தைத் திறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாற்பது நாட்களுக்குப் பிறகு.’ எபிரெய மொழியின் מִקֵּץ என்ற காலச் சொற்றொடரை ‘முடிந்தபோது’ என்றும், தமிழில் இன்னும் இயல்பாக ‘பிறகு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நாற்பது நாட்கள் முடிந்தபோது, நோவா தான் செய்திருந்த பேழையின் சாளரத்தைத் திறந்தான் என்று நிகழ்ந்தது.’ இவ்வடிவம் எபிரெய மொழியிலுள்ள வַיְהִי என்ற கதைத்தொடர் வாய்பாட்டை வெளிப்படையாகக் காட்டுகிறது.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְהִי
  choice: முதன்மை உரையில் தனியாக மொழிபெயர்க்காமல், ‘முடிந்தபோது’ என்ற காலத் துணைவாக்கிய அமைப்பில் அதன் கதைத்தொடர் செயல்பாட்டை வெளிப்படுத்துதல்
  rationale: இந்த எபிரெயக் கதைத்தொடர் வாய்பாடு அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது. தமிழில் ‘அப்போது நிகழ்ந்ததாவது’ என்று வெளிப்படையாக மொழிபெயர்ப்பது கனமாக இருக்கும்; காலத் துணைவாக்கியம் அதன் செயல்பாட்டை இயல்பாகத் தருகிறது. நேரடியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִקֵּץ
  choice: முடிந்தபோது
  rationale: ஒரு குறிப்பிட்ட கால அளவு நிறைவடைந்த புள்ளியை இது குறிக்கிறது. ‘நாற்பது நாட்கள் முடிந்தபோது’ என்பது பொருளைத் துல்லியமாகவும் இயல்பான நவீனத் தமிழிலும் தெரிவிக்கிறது.
- source_word: אַרְבָּעִים יוֹם
  choice: நாற்பது நாட்கள்
  rationale: எண்ணும் பெயர்ச்சொல்லும் சேர்ந்த எளிய கால அளவுக்கு நேரான, இயல்பான தமிழ் இணை.
- source_word: וַיִּפְתַּח
  choice: திறந்தான்
  rationale: இந்தச் சூழலில் פתח என்பதன் வழக்கமான பொருள் ‘திறத்தல்’; ஆண்பால் ஒருமை எழுவாயான நோவாவோடு தமிழ் வினை இயைகிறது.
- source_word: חַלּוֹן
  choice: சாளரம்
  rationale: இச்சொல் பொதுவாகச் சாளரத்தையோ சாளரம் போன்ற திறப்பையோ குறிக்கிறது. இங்கு ‘சாளரம்’ தெளிவானதும் சூழலுக்கு ஏற்றதும் ஆகும்.
- source_word: הַתֵּבָה
  choice: பேழை
  rationale: ஆதியாகமம் 6–9 இல் நோவாவின் பெரும் கலத்தைக் குறிக்கப் பயன்படும் תֵּבָה என்பதற்கான மரபுவழி, சூழலுக்கு ஏற்ற தமிழ் சொல்.
- source_word: אֲשֶׁר עָשָׂה
  choice: தான் செய்திருந்த
  rationale: தொடர்புத் துணைவாக்கியம் ‘பேழை’யை விளக்குகிறது. பேழையைச் செய்த செயல் சாளரத்தைத் திறப்பதற்கு முன்னரே நிறைவுற்றதை ‘செய்திருந்த’ தெளிவாக்குகிறது; ‘தான்’ செய்பவர் நோவா என்பதை இயல்பாகக் காட்டுகிறது.
