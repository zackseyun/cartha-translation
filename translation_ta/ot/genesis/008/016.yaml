  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: צֵ֖א מִן הַ/תֵּבָ֑ה אַתָּ֕ה וְ/אִשְׁתְּ/ךָ֛ וּ/בָנֶ֥י/ךָ וּ/נְשֵֽׁי בָנֶ֖י/ךָ אִתָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/016.yaml
  text: Come out of the ark[a], you and your wife, and your sons and your sons' wives with you.
translation:
  language: ta
  text: “நீயும் உன் மனைவியும் உன் மகன்களும் உன் மகன்களின் மனைவிகளும் உன்னோடு பேழையிலிருந்து வெளியே வா.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֵא
  choice: வெளியே வாருங்கள்
  rationale: יצא என்பதன் ஆண்பால் ஒருமை கட்டளை வடிவம். தேவன் நோவாவிடம் நேரடியாகச் சொல்வதால், நவீன மரியாதையான தமிழ் வழக்கில் ‘வெளியே வாருங்கள்’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: מִן הַתֵּבָה
  choice: பேழையிலிருந்து
  rationale: מִן என்பது உள்ளிருந்த இடத்திலிருந்து வெளியே நகர்வதைக் குறிக்கிறது. תֵּבָה என்பதற்கு நோவாவின் கப்பலைக் குறிக்கும் மரபான தமிழ் வேதாகமச் சொல் ‘பேழை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אַתָּה
  choice: நீயும்
  rationale: கட்டளைக்குப் பின் வரும் தனிப்பட்ட சுட்டுப்பெயர் பட்டியலில் நோவாவைத் தெளிவாகவும் ஓரளவு வலியுறுத்தியும் குறிப்பிடுகிறது; இணைப்பைத் தமிழில் ‘நீயும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְאִשְׁתְּךָ
  choice: உன் மனைவியும்
  rationale: உடைமைத் தொடர்புடைய இச்சூழலில் אִשָּׁה என்பது ‘பெண்’ என்பதல்ல, ‘மனைவி’ என்பதே தெளிவான பொருள்.
- source_word: וּבָנֶיךָ
  choice: உன் மகன்களும்
  rationale: בָּנִים இங்கு பொதுவாகப் பிள்ளைகள் என்பதைக் காட்டிலும் குறிப்பாக மகன்களைக் குறிக்கிறது; அடுத்ததாக அவர்களின் மனைவிகள் குறிப்பிடப்படுவதும் இதை உறுதிப்படுத்துகிறது.
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: உன் மகன்களின் மனைவிகளும்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான அமைப்பையும் பொருளையும் இயல்பான தமிழில் காக்கிறது. ‘மருமகள்களும்’ என்பது சுருக்கமான மாற்றாக இருந்தாலும் மூலத்தின் உறவுச் சொல்லமைப்பை மாற்றிவிடும்.
- source_word: אִתָּךְ
  choice: உன்னோடு
  rationale: நோவாவுடன் குடும்பத்தினர் சேர்ந்து வருவதைச் சுட்டும் உடனிருப்பு பொருளை நேரடியாகத் தருகிறது.
