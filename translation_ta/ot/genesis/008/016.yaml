translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஒரே நபரான நோவாவை நோக்கிய எபிரெய ஒருமைக் கட்டளை தமிழில் மரியாதைப் பன்மை வினைமுற்றாக வழங்கப்பட்டுள்ளது; பட்டியலிலுள்ள ஒவ்வொரு உறுப்புக்கும் ‘-உம்’ இணைப்பு பயன்படுத்தப்பட்டு மூலத்தின் கூட்டிணைப்பு தெளிவாகக் காக்கப்பட்டுள்ளது.
