  text: וַ/יִּ֥בֶן נֹ֛חַ מִזְבֵּ֖חַ לַֽ/יהוָ֑ה וַ/יִּקַּ֞ח מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה וּ/מִ/כֹּל֙ הָ/ע֣וֹף הַ/טָּהֹ֔ר וַ/יַּ֥עַל עֹלֹ֖ת בַּ/מִּזְבֵּֽחַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/020.yaml
  text: Then Noah built an altar to Yahweh[a], and took some of every clean animal and of every clean bird[b], and offered burnt offerings on the altar.
translation:
  language: ta
  text: பின்பு நோவா யாவேக்குப்[a] பலிபீடம் ஒன்றைக் கட்டி, சுத்தமான ஒவ்வொரு விலங்கு வகையிலிருந்தும் சுத்தமான ஒவ்வொரு பறவை வகையிலிருந்தும் சிலவற்றை[b] எடுத்து, அந்தப் பலிபீடத்தின்மேல் தகனபலிகளாகச் செலுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மூலத்தில் கடவுளின் தனிப்பட்ட பெயரான יהוה (YHWH) உள்ளது; இங்கு அது “யாவே” என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: divine_name
  - marker: b
    text: 'நேரடி எபிரேய வாசகம்: “சுத்தமான எல்லா விலங்குகளிலிருந்தும் சுத்தமான எல்லாப் பறவைகளிலிருந்தும் எடுத்தார்.” இங்கு பகுதியெடுக்கும் பொருளைத் தெளிவாக்க “ஒவ்வொரு ... வகையிலிருந்தும் சிலவற்றை” என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: கட்டினார்
  rationale: בנה என்பதன் நேரான பொருள் ‘கட்டு’; நவீனத் தமிழ் உரைநடைக்கு இயல்பான தெரிவு.
- source_word: מִזְבֵּחַ
  choice: பலிபீடம்
  rationale: பலியிடும் இடத்தைக் குறிக்கும் מזבח என்பதற்கான வழக்கமான, தெளிவான தமிழ்ச் சொல்.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற இறைப்பெயரை பொதுப்பட்டமாக மாற்றாமல் பெயராக ஒலிபெயர்க்கிறது; எபிரேய முன்னிடைச்சொல்லின் திசை/பெறுநர் பொருளை ‘-க்கு’ தருகிறது.
- source_word: מִכֹּל הַבְּהֵמָה הַטְּהוֹרָה
  choice: சுத்தமான எல்லா விலங்கு வகைகளிலிருந்தும் சிலவற்றை
  rationale: מִן + כֹּל என்பதன் பகுதியெடுக்கும் பொருளைத் தெளிவாக்குகிறது. ‘வகைகள்’ என்பது ஒவ்வொரு தனி விலங்கையும் பலியிட்டதாகப் பொருள்படுவதைத் தவிர்க்கும் சூழல்சார் விளக்கம்.
- source_word: וּמִכֹּל הָעוֹף הַטָּהֹר
  choice: சுத்தமான எல்லாப் பறவை வகைகளிலிருந்தும் சிலவற்றை
  rationale: עוֹף இச்சூழலில் பறவைகளைக் குறிக்கிறது; பகுதியெடுக்கும் எபிரேய அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַטְּהוֹרָה / הַטָּהֹר
  choice: சுத்தமான
  rationale: பலிக்குத் தகுதியான சடங்குசார் வகைப்பாட்டைக் குறிக்கும் நிறுவப்பட்ட சுருக்கமான சொல்; ‘சடங்குமுறைப்படி’ என்பதை முதன்மை உரையில் சேர்த்து மிகைவிளக்கம் தரவில்லை.
- source_word: וַיַּעַל עֹלֹת
  choice: தகனபலிகளாகச் செலுத்தினார்
  rationale: Hiphil עלה உடன் עֹלֹת வரும்போது பலியிடுதலைக் குறிக்கும். ‘தகனபலி’ முழுமையாக எரிக்கப்படும் பலிவகையைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: בַּמִּזְבֵּחַ
  choice: அந்தப் பலிபீடத்தின்மேல்
  rationale: இடப்பொருளை இயல்பான தமிழில் தருகிறது; முன்பு குறிப்பிடப்பட்ட பலிபீடமே என்பதால் ‘அந்த’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், ஏற்றுக்கொள்ளப்பட்ட மறுஉருவாக்கத்தின் அடிப்படையில் பெயராக ஒலிபெயர்க்கப்பட்டது.
- issue: מִכֹּל என்பதன் பகுதியெடுக்கும் பொருள்
  choice: எல்லா ... வகைகளிலிருந்தும் சிலவற்றை
  alternative: எல்லா ... இலிருந்தும்
  rationale: மூலத்தின் நேரடி அமைப்பு ‘ஒவ்வொன்றிலிருந்தும் எடுத்தார்’ என்பதாக இருந்தாலும், சூழலில் ஒவ்வொரு சுத்தமான உயிரினத்தையும் முழுவதுமாகப் பலியிட்டார் என்று பொருள் அல்ல. ‘சிலவற்றை’ என்பது உள்ளார்ந்த பகுதியெடுக்கும் பொருளை வெளிப்படுத்துகிறது; இதை அடிக்குறிப்பும் தெரிவிக்கிறது.
- issue: טָהוֹר என்பதன் பொருள்
  choice: சுத்தமான
  alternative: சடங்குமுறைப்படி சுத்தமான
  rationale: இங்கு பலிக்குத் தகுதியான வகைப்பாடே கருத்து. முதன்மை உரையில் ‘சுத்தமான’ எனச் சுருக்கமாக வைத்து, சடங்குசார் நுணுக்கத்தைச் சொற்பொருளில் மிகையாக விரிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க வேதாகம உரைநடை. ‘பலிபீடம்’, ‘தகனபலி’ போன்ற நிலைபெற்ற சமயச் சொற்கள் தேவையான துல்லியத்திற்காக வைக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
