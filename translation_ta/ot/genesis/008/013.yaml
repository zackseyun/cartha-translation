source:
  edition: WLC
  text: וַֽ֠/יְהִי בְּ/אַחַ֨ת וְ/שֵׁשׁ מֵא֜וֹת שָׁנָ֗ה בָּֽ/רִאשׁוֹן֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ חָֽרְב֥וּ הַ/מַּ֖יִם מֵ/עַ֣ל הָ/אָ֑רֶץ וַ/יָּ֤סַר נֹ֨חַ֙ אֶת מִכְסֵ֣ה הַ/תֵּבָ֔ה וַ/יַּ֕רְא וְ/הִנֵּ֥ה חָֽרְב֖וּ פְּנֵ֥י הָֽ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/013.yaml
  text: And it came about in the six hundred and first year[a], in the first month, on the first day of the month, that the waters had dried up from upon the earth. Then Noah removed the covering of the ark and looked, and behold[c][b], the surface of the ground was dry.
translation:
  language: ta
  text: அறுநூற்று ஒன்றாம் ஆண்டில்[a], முதல் மாதத்தின் முதல் நாளில், பூமியின் மேலிருந்த தண்ணீர் வற்றியிருந்தது. அப்போது நோவா பேழையின் மூடியை அகற்றிப் பார்த்தான்; இதோ, நிலத்தின் மேற்பரப்பு காய்ந்திருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது நோவாவின் வாழ்நாளின் அறுநூற்று ஒன்றாம் ஆண்டைக் குறிக்கிறது என்று சூழலிலிருந்து புரிந்துகொள்ளலாம்; ஆனால் எபிரெய உரை இங்கு ‘அறுநூற்று ஒன்றாம் ஆண்டில்’ என்று மட்டுமே கூறுகிறது.
    reason: implicit_referent
lexical_decisions:
- source_word: וַיְהִי
  choice: '[தனி சொற்றொடராக மொழிபெயர்க்காமல் காலக் குறிப்புடன் இயல்பாக இணைக்கப்பட்டது]'
  rationale: எபிரெயக் கதைநடையில் காலக் குறிப்பை அறிமுகப்படுத்தும் வழக்கமான வடிவம். தமிழில் ‘அது நிகழ்ந்தது’ என்று தனியே கூறுவது செயற்கையாக இருப்பதால், அதன் கதைத் தொடர்ச்சி காலக் குறிப்பின் அமைப்பில் வெளிப்படுத்தப்பட்டது.
- source_word: בְּאַחַת וְשֵׁשׁ מֵאוֹת שָׁנָה
  choice: அறுநூற்று ஒன்றாம் ஆண்டில்
  rationale: எபிரெய மொழியின் சொல்லமைப்பு சொற்படியாக ‘ஒன்றும் அறுநூறும் ஆண்டு’ என இருந்தாலும், நவீனத் தமிழில் இயல்பான வரிசை எண்ணாக வழங்கப்பட்டது. இது நோவாவின் வயதைக் குறிக்கலாம் என்ற சூழல்சார் புரிதலை வசனத்துக்குள் சேர்க்கவில்லை.
- source_word: בָּרִאשׁוֹן בְּאֶחָד לַחֹדֶשׁ
  choice: முதல் மாதத்தின் முதல் நாளில்
  rationale: காலண்டர் தேதியைக் குறிக்கும் எபிரெய மரபுத்தொடரைத் தெளிவான, இயல்பான தமிழில் வழங்குகிறது.
- source_word: חָרְבוּ הַמַּיִם מֵעַל הָאָרֶץ
  choice: பூமியின் மேலிருந்த தண்ணீர் வற்றியிருந்தது
  rationale: חרב என்பதன் ‘வற்றுதல்’ என்ற பொருளையும், מֵעַל என்பதன் மேற்பரப்பு தொடர்பையும் காக்கிறது; முந்திய நிகழ்வின் நிறைவுநிலையை ‘வற்றியிருந்தது’ வெளிப்படுத்துகிறது.
- source_word: וַיָּסַר
  choice: அகற்றி
  rationale: ஹிஃபில் வடிவத்தின் ‘நீக்குதல்/அகற்றுதல்’ என்ற செயப்படுத்தும் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: מִכְסֵה הַתֵּבָה
  choice: பேழையின் மூடி
  rationale: מִכְסֵה என்பது மூடும் பொருளைக் குறிக்கிறது. ‘கூரை’ என்று கட்டிட அமைப்பை மிகத் துல்லியமாக ஊகிக்காமல், தமிழில் பொருளின் பயன்பாட்டை இயல்பாகச் சொல்கிறது.
- source_word: וַיַּרְא
  choice: பார்த்தான்
  rationale: மூடியை அகற்றியபின் நோவா நோக்கிப் பார்த்த செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, எதிர்பாராத அல்லது முக்கியமான காட்சியை முன்வைக்கும் எபிரெயத் துகளின் வலிமையைத் தக்கவைக்கிறது.
- source_word: חָרְבוּ פְּנֵי הָאֲדָמָה
  choice: நிலத்தின் மேற்பரப்பு காய்ந்திருந்தது
  rationale: פְּנֵי என்பதன் ‘மேற்பரப்பு’ என்ற பொருளைக் காக்கிறது. முதல் கூறிலுள்ள தண்ணீர் ‘வற்றியது’ என்பதிலிருந்து நிலப்பரப்பு ‘காய்ந்தது’ என்பதைத் தமிழில் இயல்பாக வேறுபடுத்துகிறது.
theological_decisions:
- issue: ‘அறுநூற்று ஒன்றாம் ஆண்டு’ எதைக் கணக்கிடுகிறது என்பது
  choice: வசனம் கூறுவது போல ஆண்டை மட்டும் குறிப்பிட்டு, நோவாவின் வயது என்று உரைக்குள் வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: ‘நோவாவின் அறுநூற்று ஒன்றாம் வயதில்’ என்று மொழிபெயர்த்தல்.
  rationale: உடனடி சூழல் அதை நோவாவின் வாழ்நாள் கணக்காகப் புரிந்துகொள்ள ஆதரித்தாலும், இவ்வசனத்தின் எபிரெய உரை அதைப் பெயரிட்டு வெளிப்படையாகக் கூறவில்லை; ஆகவே உள்ளார்ந்த தெளிவின்மை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; கண்ணியமான வேதாகமக் கதைநடை. எபிரெய மொழியின் இயல்பான தெளிவின்மை காக்கப்பட்டு, தமிழில் செயற்கையான சொற்படி அமைப்புகள் தவிர்க்கப்பட்டன. ‘இதோ’ என்பதன் மூலம் הִנֵּה-வின் கவன ஈர்ப்பு பாதுகாக்கப்பட்டது.
