  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּסָּֽכְרוּ֙ מַעְיְנֹ֣ת תְּה֔וֹם וַֽ/אֲרֻבֹּ֖ת הַ/שָּׁמָ֑יִם וַ/יִּכָּלֵ֥א הַ/גֶּ֖שֶׁם מִן הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/002.yaml
  text: The springs of the deep and the windows of the heavens were shut[b][a], and the rain from the heavens was restrained.
translation:
  language: ta
  text: ஆழத்தின் ஊற்றுகளும் வானத்தின் சாளரங்களும் அடைக்கப்பட்டன[a]; வானத்திலிருந்து பெய்த மழை தடுத்து நிறுத்தப்பட்டது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வானத்தின் மதகுகள்.’ எபிரெயச் சொல் வானிலுள்ள திறப்புகள் அல்லது சாளரங்களைச் சொல்லர்த்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வானத்திலிருந்து பெய்த மழை நின்றுபோனது.’ மழை தடுத்து நிறுத்தப்பட்டதால் அது நின்றது என்பதற்கு எபிரெய வினை அழுத்தம் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּכְרוּ
  choice: அடைக்கப்பட்டன
  rationale: எபிரெய வினையின் செயப்பாட்டு வடிவத்தையும், ஊற்றுகள் மற்றும் சாளரங்கள் ஆகிய இரு எழுவாய்களுக்கும் பொருந்தும் ‘மூடப்படுதல்/அடைக்கப்படுதல்’ என்ற பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַעְיְנֹת
  choice: ஊற்றுகள்
  rationale: நீர் புறப்படும் மூலங்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: תְּהוֹם
  choice: ஆழம்
  rationale: ஆதியாகமத்தின் பேராழமான நீர்ப்பரப்பைக் குறிக்கும் உருவகத்தைச் சுருக்கமாகவும் மரியாதைமிக்க நடையிலும் தக்கவைக்கிறது.
- source_word: אֲרֻבֹּת
  choice: சாளரங்கள்
  rationale: வானிலுள்ள திறப்புகள் என்ற எபிரெய உருவகத்தை விளக்கமாக மாற்றாமல் நேரடியாகத் தக்கவைக்கிறது; ‘மதகுகள்’ என்பது பொருள் விளக்கும் மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַשָּׁמַיִם
  choice: வானம்
  rationale: எபிரெய மொழியின் வடிவத்தைத் தமிழில் செயற்கையான பன்மையாக மாற்றாமல், அதன் வானியல் உருவகத்தை இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: וַיִּכָּלֵא
  choice: தடுத்து நிறுத்தப்பட்டது
  rationale: மழை வெறுமனே நின்றது என்ற விளைவை மட்டும் அல்லாமல், அது தொடராதபடி தடுக்கப்பட்டது என்ற வினைநுட்பத்தையும் காக்கிறது.
- source_word: הַגֶּשֶׁם
  choice: மழை
  rationale: சூழலுக்கு ஏற்ற நேரடியான, பொதுவாகப் புரியும் தமிழ்ச் சொல்.
- source_word: מִן הַשָּׁמָיִם
  choice: வானத்திலிருந்து
  rationale: மூலத்தில் வரும் வானம் குறித்த சொல்லின் மறுபயன்பாட்டைத் தமிழிலும் தக்கவைக்கிறது.
