translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதையுரைக்கேற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதோ’ மூலத்தின் கவன ஈர்ப்பையும் உயிரோட்டத்தையும் காக்கிறது. புறாவைக் குறிக்க பாலினமற்ற ‘அது’ பயன்படுத்தப்பட்டுள்ளது; எபிரெய இலக்கணப் பெண்பால் தமிழில் தேவையின்றி உயிரியல் பாலாக மாற்றப்படவில்லை.
