base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/011.yaml
  text: And the dove came to him at evening time[a], and behold, a freshly plucked olive leaf was in her mouth[c][b]. So Noah knew that the waters had subsided from upon the earth.
translation:
  language: ta
  text: அந்தப் புறா மாலை நேரத்தில் அவனிடம் வந்தது[a]. இதோ, புதிதாகப் பறிக்கப்பட்ட ஒலிவ மரத்தின் இலை ஒன்று அதன் வாயில் இருந்தது[b]. ஆகவே, பூமியின் மேலிருந்த நீர் குறைந்திருந்தது[c] என்று நோவா அறிந்துகொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனிடம் திரும்பி வந்தது’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் நேரடியாக ‘வந்தது’ என்று பொருள்படும்; அது திரும்பி வந்தது என்பதைச் சூழல் உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘புதிதாகப் பறிக்கப்பட்ட’ என்பதற்கான எபிரெயச் சொல் பிய்த்து அல்லது பறித்து எடுக்கப்பட்டதைக் குறிக்கிறது; உயிருள்ள ஒலிவ மரத்திலிருந்து அந்த இலை அண்மையில் எடுக்கப்பட்டிருந்ததை இது உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘நீர் தணிந்திருந்தது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא אֵלָיו
  choice: அவனிடம் வந்தது
  rationale: בוא என்பதன் நேரடிப் பொருள் ‘வருதல்.’ முந்தைய சூழலில் புறா திரும்பி வந்தது என்பது தெளிவானாலும், அந்தக் கருத்தை வினைச்சொல்லுக்குள் சேர்க்காமல் அடிக்குறிப்பில் மாற்றாகக் கொடுக்கிறது.
- source_word: לְעֵת עֶרֶב
  choice: மாலை நேரத்தில்
  rationale: எபிரெயச் சொற்றொடரின் காலக் குறிப்பை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: அடுத்து காணப்படும் எதிர்பாராத அடையாளத்தின் மீது கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் இடைச்சொல்லின் உயிரோட்டத்தைப் பாதுகாக்கிறது.
- source_word: עֲלֵה זַיִת
  choice: ஓர் ஒலிவ மர இலை
  rationale: ‘ஒலிவின் இலை’ என்ற மூலக் கட்டமைப்பைத் தெளிவான, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: טָרָף
  choice: புதிதாகப் பறிக்கப்பட்ட
  rationale: இச்சொல் பிய்த்து அல்லது பறித்து எடுக்கப்பட்டதைக் குறிக்கிறது; இலை உயிருள்ள மரத்திலிருந்து அண்மையில் எடுக்கப்பட்டிருந்தது என்ற கதைசார் உட்பொருளையும் இந்தத் தேர்வு வெளிப்படுத்துகிறது.
- source_word: בְּפִיהָ
  choice: அது தன் வாயில் வைத்திருந்தது
  rationale: எபிரெயம் நேரடியாக ‘அதன் வாயில்’ என்கிறது. பறவைக்கு இயல்பான தமிழில் ‘அலகில்’ எனக் கூற முடிந்தாலும், மூலத்தின் உடற்கூறு சொல்லை ‘வாயில்’ எனப் பாதுகாக்கிறது.
- source_word: וַיֵּדַע
  choice: ஆகவே ... நோவா அறிந்துகொண்டான்
  rationale: இலையைக் கண்டதிலிருந்து நோவா செய்த முடிவை ‘ஆகவே’ தெளிவாக்குகிறது; தொடர் நிகழ்வில் பெற்ற அறிவை ‘அறிந்துகொண்டான்’ இயல்பாகக் காட்டுகிறது.
- source_word: קַלּוּ הַמַּיִם
  choice: தண்ணீர் குறைந்துவிட்டது
  rationale: קלל இங்கு வெள்ளத் தண்ணீர் அளவு குறைந்ததை அல்லது தணிந்ததைச் சுட்டுகிறது. தமிழில் ‘தண்ணீர்’ இயல்பாக ஒருமைத் தொகுப்புப்பெயராக வருகிறது.
- source_word: מֵעַל הָאָרֶץ
  choice: பூமியின் மேலிருந்த
  rationale: தண்ணீர் பூமியின் மேற்பரப்பை மூடியிருந்த இடவியல் தொடர்பை இயல்பான தமிழில் பாதுகாக்கிறது.
