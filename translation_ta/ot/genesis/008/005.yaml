source:
  edition: WLC
  text: וְ/הַ/מַּ֗יִם הָיוּ֙ הָל֣וֹךְ וְ/חָס֔וֹר עַ֖ד הַ/חֹ֣דֶשׁ הָֽ/עֲשִׂירִ֑י בָּֽ/עֲשִׂירִי֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ נִרְא֖וּ רָאשֵׁ֥י הֶֽ/הָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/005.yaml
  text: And the waters continued to recede until the tenth month. In the tenth month[a], on the first day of the month, the tops of the mountains became visible.
translation:
  language: ta
  text: தண்ணீர் பத்தாம் மாதம் வரை தொடர்ந்து குறைந்துகொண்டே வந்தது. பத்தாம் மாதத்தின் முதல் நாளில் மலைகளின் உச்சிகள் தென்பட்டன[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காணப்பட்டன” அல்லது “தோன்றின.” எபிரெய வினைச்சொல் மலை உச்சிகள் பார்வைக்குப் புலப்பட்டதைக் குறிக்கிறது; அது குறிப்பிட்ட பார்வையாளரைச் சுட்டுவதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּיִם
  choice: தண்ணீர்
  rationale: எபிரெயத்தில் இது பன்மை வடிவில் உள்ள திரள்பொருள் பெயராக இருந்தாலும், நவீனத் தமிழில் இதனை இயல்பாக ஒருமைத் திரள்பொருள் பெயரான ‘தண்ணீர்’ என்று குறிப்பிடுவது பொருத்தமானது.
- source_word: הָיוּ הָלוֹךְ וְחָסוֹר
  choice: தொடர்ந்து குறைந்துகொண்டே வந்தது
  rationale: היה என்பதுடன் வினையெச்ச முழுவடிவங்கள் இணைந்து, காலப்போக்கில் தொடர்ந்து நிகழ்ந்த குறைதலைக் குறிக்கின்றன. இந்தத் தமிழாக்கம் அந்த நீடித்த, படிப்படியான செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַד הַחֹדֶשׁ הָעֲשִׂירִי
  choice: பத்தாம் மாதம்வரை
  rationale: חֹדֶשׁ இங்கு கதைநிகழ்வின் காலக்கணக்கில் ‘மாதம்’ என்று பொருள்படுகிறது; עַד என்பதன் எல்லைப் பொருளை ‘வரை’ தெளிவாகத் தருகிறது.
- source_word: בָּעֲשִׂירִי בְּאֶחָד לַחֹדֶשׁ
  choice: பத்தாம் மாதத்தின் முதல் நாளில்
  rationale: எபிரெயத்தின் சுருக்கமான தேதிக் குறிப்பைத் தமிழின் இயல்பான தேதியமைப்பில் தெளிவாக வழங்குகிறது.
- source_word: נִרְאוּ
  choice: கண்ணுக்குத் தெரியத் தொடங்கின
  rationale: ראה என்பதன் நிஃபால் வடிவம் ‘காணப்பட்டன,’ ‘தோன்றின,’ அல்லது பார்வைக்குப் புலப்படலாயின என்ற பொருளைத் தரலாம். தண்ணீர் குறைந்தபோது உச்சிகள் பார்வைக்குப் புலப்படத் தொடங்கிய மாற்றத்தை இந்தச் சொற்றொடர் இயல்பாகக் காட்டுகிறது; குறிப்பிட்ட பார்வையாளரைச் சேர்ப்பதில்லை.
- source_word: רָאשֵׁי הֶהָרִים
  choice: மலைகளின் உச்சிகள்
  rationale: רֹאשׁ என்பதன் அடிப்படைப் பொருள் ‘தலை’; நிலவியல் சூழலில் ‘உச்சிகள்’ என்பது உருவகத்தைத் தக்கவைத்துக்கொண்டு இயல்பான தமிழை வழங்குகிறது. ‘சிகரங்கள்’ என்பது கூர்மையான மலைமுகடுகளை மட்டும் குறிப்பதுபோல் அமையக்கூடும்.
