  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் வகையிலும் வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியமான தொனியிலும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தின் நீடித்த செயற்பாட்டுக் கட்டமைப்பும் துல்லியமான தேதிக் குறிப்பும் பாதுகாக்கப்பட்டுள்ளன.
