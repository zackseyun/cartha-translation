- from: தண்ணீர் பத்தாம் மாதம்வரை தொடர்ந்து குறைந்துகொண்டே வந்தது. பத்தாம் மாதத்தின் முதல் நாளில் மலைகளின் உச்சிகள் கண்ணுக்குத் தெரியத் தொடங்கின[a].
  to: தண்ணீர் பத்தாம் மாதம் வரை தொடர்ந்து குறைந்துகொண்டே வந்தது. பத்தாம் மாதத்தின் முதல் நாளில் மலைகளின் உச்சிகள் தென்பட்டன[a].
  rationale: The revision makes a small source-fidelity improvement by replacing the over-specific ‘began to become visible’ with the natural Tamil “தென்பட்டன,” which can convey ‘appeared’ or ‘became visible.’ It also corrects spacing and aligns the footnote with the revised primary wording.
