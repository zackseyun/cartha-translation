  text: So Noah went out[b][a], and his sons and his wife and his sons’ wives with him.
translation:
  language: ta
  text: அப்போது நோவா வெளியே வந்தார்; அவரோடு அவருடைய மகன்களும், அவருடைய மனைவியும், அவருடைய மகன்களின் மனைவிகளும் வந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: அப்படியே ... வெளியே வந்தார்
  rationale: வாவ் தொடர்வினை முந்தைய கட்டளையைத் தொடர்ந்து நிகழ்ந்த செயலைக் குறிக்கிறது. தமிழில் ‘அப்படியே’ என்பது அந்தக் கட்டளைக்குக் கீழ்ப்படிந்து அடுத்ததாக நடந்ததை இயல்பாக வெளிப்படுத்துகிறது; יָצָא என்பதற்கு இச்சூழலில் ‘வெளியே வந்தார்’ இயல்பான மொழிபெயர்ப்பு.
- source_word: נֹחַ
  choice: நோவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: וּבָנָיו
  choice: அவருடைய மகன்களும்
  rationale: בָּנִים இங்கு பாலினத்தைக் குறிப்பாகக் காட்டும் ‘மகன்கள்’ என்பதையே குறிக்கிறது; இணைப்புப் பட்டியலின் ஓட்டத்தை ‘-உம்’ இயல்பாகக் காக்கிறது.
- source_word: וְאִשְׁתּוֹ
  choice: அவருடைய மனைவியும்
  rationale: ஒருமைப் பெயர்ச்சொல்லோடு மூன்றாம் நபர் ஆண்பால் ஒருமை உரிமை விகுதி சேர்ந்துள்ளதைக் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: וּנְשֵׁי בָנָיו
  choice: அவருடைய மகன்களின் மனைவிகளும்
  rationale: ‘அவருடைய மகன்களின் மனைவிகள்’ என்ற எபிரெய வடிவத்தைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது; ‘மருமகள்கள்’ என்ற சுருக்கமான உறவுப்பெயரை இறக்குமதி செய்யவில்லை.
- source_word: אִתּוֹ
  choice: அவரோடு
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை விகுதியுடன் உள்ள முன்னிடைச்சொல்லின் ‘அவருடன்/அவரோடு’ என்ற பொருளை இயல்பான தமிழில் வழங்குகிறது.
