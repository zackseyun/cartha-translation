revisions:
- from: அப்படியே நோவா வெளியே வந்தார்; அவரோடு அவருடைய மகன்களும், அவருடைய மனைவியும், அவருடைய மகன்களின் மனைவிகளும் வெளியே வந்தார்கள்.
  to: அப்போது நோவா வெளியே வந்தார்; அவரோடு அவருடைய மகன்களும், அவருடைய மனைவியும், அவருடைய மகன்களின் மனைவிகளும் வந்தார்கள்.
  rationale: ‘அப்போது’ conveys the forward-moving narrative connection without overstating a causal or compliance nuance. The revision retains the singular verb for Noah and expresses the accompanying family members in a natural Tamil coordinated clause, preserving the explicit ‘with him’ and the Hebrew’s distinction between sons and their wives.
