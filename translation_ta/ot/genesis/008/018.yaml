translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. எபிரெயத்தில் முதன்மை வினை ஒருமையில் இருந்தாலும், நீண்ட இணைப்புப் பட்டியலைத் தமிழில் தெளிவாக்க ‘அவரோடு’ என்பதற்குப் பின் பன்மை வினை மீண்டும் வழங்கப்பட்டுள்ளது. வசனத்தின் தொடக்க இணைப்பு முந்தைய கட்டளையின் விளைவைக் காட்டும் வகையில் ‘அப்படியே’ என மொழிபெயர்க்கப்பட்டது.
