  text: וַ/תָּ֤נַח הַ/תֵּבָה֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י בְּ/שִׁבְעָה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ עַ֖ל הָרֵ֥י אֲרָרָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/004.yaml
  text: And in the seventh month[a], on the seventeenth day of the month, the ark came to rest on the mountains of Ararat.
translation:
  language: ta
  text: ஏழாம் மாதம், அந்த மாதத்தின் பதினேழாம் நாளில், பேழை அரராத்தின் மலைகளின்மேல் வந்து தங்கியது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அரராத்தின் மலைகள்’ என்று பன்மையில் உள்ளது; இது அரராத் மலைப்பகுதியைக் குறிக்கிறது; ‘அரராத் மலை’ எனப்படும் ஒரு குறிப்பிட்ட தனி மலைச்சிகரத்தை அவசியம் குறிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּנַח
  choice: வந்து தங்கியது
  rationale: נוּחַ என்பதன் wayyiqtol வடிவம், பேழை ஒரு இடத்தில் வந்து ஓய்ந்து நிலைபெற்ற நிகழ்வைக் குறிக்கிறது. ‘வந்து தங்கியது’ என்பது அதன் நிகழ்வுத் தன்மையை இயல்பான தமிழில் தருகிறது.
- source_word: הַתֵּבָה
  choice: பேழை
  rationale: ஆதியாகமத்தில் நோவாவின் תֵּבָה என்பதற்கான நிலைபெற்ற, சூழலுக்குப் பொருத்தமான தமிழ் சொல்.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: ஏழாம் மாதம்
  rationale: மாதத்தைக் குறிக்கும் காலவியல் בְּ தமிழில் இயல்பாக உள்ளுறை பொருளில் மொழிபெயர்க்கப்படுகிறது.
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: அந்த மாதத்தின் பதினேழாம் நாளில்
  rationale: எபிரெய தேதிக் கூறுமுறையைத் தெளிவான, இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: עַל
  choice: மேல்
  rationale: எளிய இடவியல் உறவைக் குறிக்கும் முன்னிடைச்சொல்லின் இயல்பான தமிழ் இணை.
- source_word: הָרֵי אֲרָרָט
  choice: அரராத்தின் மலைகள்
  rationale: הָרֵי என்பது பன்மை construct வடிவம்; ஆகவே ஒரே மலைச்சிகரமாகக் குறுக்காமல், அரராத்துடன் தொடர்புடைய மலைப்பகுதியை பன்மையில் தருகிறது.
theological_decisions:
- issue: הָרֵי אֲרָרָט என்ற புவியியல் தொடர்
  choice: அரராத்தின் மலைகள்
  alternative: அரராத் மலை
  rationale: எபிரெய மூலத்தில் ‘மலைகள்’ என்பது பன்மையில் உள்ளது. எனவே பாரம்பரியமாக அறியப்படும் ஒரே ‘அரராத் மலை’ என்று குறிப்பாக்காமல், மூலத்தின் பன்மையையும் புவியியல் விரிவையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. மூலத்தின் பன்மை புவியியல் குறிப்பைத் தெளிவாகக் காக்கிறது; அடிக்குறிப்புக் குறி அது விளக்கும் தொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
