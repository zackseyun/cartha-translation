base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/007.yaml
  text: Then he sent out the raven[a], and it went out, going out and returning[b], until the waters had dried up from upon the earth.
translation:
  language: ta
  text: பின்பு அவன் அண்டங்காக்கையை வெளியே அனுப்பினான்; அது வெளியே சென்று, போயும் திரும்பியும் கொண்டிருந்தது[a], பூமியின்மேல் இருந்த தண்ணீர் வற்றும்வரை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை, “அது வெளியே சென்று, மீண்டும் மீண்டும் போய்த் திரும்பிக்கொண்டிருந்தது” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் தொடர்ச்சியான அல்லது மீண்டும் நிகழ்ந்த அசைவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: பின்பு அவன் ... வெளியே அனுப்பினான்
  rationale: தொடர்கதை நிகழ்வை முன்னெடுக்கும் wayyiqtol வடிவை இயல்பான நவீனத் தமிழில் ‘பின்பு’ என்று வெளிப்படுத்துகிறது; שׁלח என்பதன் அனுப்புதல் பொருளையும் காக்கிறது.
- source_word: הָעֹרֵב
  choice: அண்டங்காக்கை
  rationale: עֹרֵב என்பது raven இனப் பறவையைச் சுட்டுகிறது. பொதுவான ‘காகம்’ என்பதைக் காட்டிலும் ‘அண்டங்காக்கை’ உயிரினத்தைக் கூடுதல் துல்லியத்துடன் குறிக்கிறது.
- source_word: וַיֵּצֵא
  choice: அது வெளியே சென்று
  rationale: יצא என்பதன் பொதுவான ‘வெளியே செல்லுதல்’ பொருளைத் தருகிறது; எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘பறந்தது’ என்ற விவரத்தைச் சேர்க்கவில்லை.
- source_word: יָצוֹא וָשׁוֹב
  choice: போவதும் திரும்பிவருவதுமாக இருந்தது
  rationale: இரு infinitive absolute வடிவங்களும் தொடர்ச்சியாக அல்லது மீண்டும் மீண்டும் நிகழ்ந்த அசைவைக் காட்டுகின்றன. இந்தத் தமிழ் அமைப்பு ‘வெளியே போய் திரும்புதல்’ என்ற மூலச் சொற்களின் இயக்கத்தை இயல்பாகத் தக்கவைக்கிறது.
- source_word: עַד יְבֹשֶׁת הַמַּיִם
  choice: தண்ணீர் வற்றும்வரை
  rationale: עַד குறிக்கும் கால எல்லையையும் יבשׁ குறிக்கும் வற்றிப்போதலையும் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது. மַיִם எபிரெயத்தில் வடிவியல் பன்மையாக இருந்தாலும், ‘தண்ணீர்’ தமிழில் இயல்பான திரள்பெயர்.
- source_word: מֵעַל הָאָרֶץ
  choice: பூமியின் மேலிருந்த
  rationale: מֵעַל என்பதிலுள்ள ‘மேலிருந்து’ என்ற இடவியல் உறவைத் தக்கவைத்து, தமிழில் தண்ணீரோடு இயல்பாக இணைக்கிறது.
