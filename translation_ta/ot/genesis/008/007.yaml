  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளது. மூலத்தின் மீள்நிகழ்வு வலிமை முற்றிலும் மென்மையாக்கப்படாமல், தமிழில் புரியத்தக்கவாறு வெளிப்படுத்தப்பட்டுள்ளது.
