id: GEN.8.22
reference: Genesis 8:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: עֹ֖ד כָּל יְמֵ֣י הָ/אָ֑רֶץ זֶ֡רַע וְ֠/קָצִיר וְ/קֹ֨ר וָ/חֹ֜ם וְ/קַ֧יִץ וָ/חֹ֛רֶף וְ/י֥וֹם וָ/לַ֖יְלָה לֹ֥א יִשְׁבֹּֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/022.yaml
  text: For as long as the earth endures[a], seedtime and harvest, cold and heat, summer and winter[b], and day and night shall not cease.
translation:
  language: ta
  text: பூமி நிலைத்திருக்கும் காலமெல்லாம்[a], விதைப்பும் அறுவடையும், குளிரும் வெப்பமும், கோடையும் குளிர்காலமும்[b], பகலும் இரவும் நின்றுபோகாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘பூமியின் நாட்களெல்லாம்.’
    reason: lexical_alternative
  - marker: b
    text: இவற்றை ‘வறண்ட பருவமும் மழைக்காலமும்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹד כָּל יְמֵי הָאָרֶץ
  choice: பூமி நிலைத்திருக்கும் காலமெல்லாம்
  rationale: ‘பூமியின் நாட்களெல்லாம்’ என்ற எபிரெய நேரடியான சொற்றொடர், பூமி இருக்கும் காலம் முழுவதையும் குறிக்கிறது. இயல்பான நவீன தமிழில் அதன் காலவரம்பைத் தெளிவாகத் தெரிவிக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: זֶרַע וְקָצִיר
  choice: விதைப்பும் அறுவடையும்
  rationale: இணையாக வரும் சொற்கள் விதை என்ற பொருளை மட்டும் அல்லாமல் விதைக்கும் செயல் அல்லது பருவத்தையும் அறுவடையையும் குறிக்கின்றன.
- source_word: קֹר וָחֹם
  choice: குளிரும் வெப்பமும்
  rationale: எதிரெதிரான காலநிலை நிலைகளை நேரடியாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: קַיִץ וָחֹרֶף
  choice: கோடையும் குளிர்காலமும்
  rationale: இவை பொதுவாகக் கோடை, குளிர்காலம் எனப் பொருள்படும்; பண்டைய லெவாந்துப் பகுதியில் வறண்ட பருவம், மழைக்காலம் என்ற நுண்பொருளும் இருக்கலாம்.
- source_word: יוֹם וָלַיְלָה
  choice: பகலும் இரவும்
  rationale: தொடர்ந்து நிகழும் காலச்சுழற்சியைக் குறிக்கும் இயல்பான தமிழ் இணைச்சொல்.
- source_word: לֹא יִשְׁבֹּתוּ
  choice: நின்றுபோகாது
  rationale: שׁבת இங்கு ‘ஓய்தல், நிறுத்துதல்’ என்ற பொருளில் வருகிறது. முன் கூறப்பட்ட இயற்கைச் சுழற்சிகள் தொடர்வதை ‘நின்றுபோகாது’ தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: படைப்பின் வழக்கமான சுழற்சிகள் தொடரும் காலவரம்பு
  choice: பூமி நிலைத்திருக்கும் காலம் முழுவதும் இச்சுழற்சிகள் தொடரும் என்ற காலவரம்புள்ள வாக்குறுதி
  alternative: எந்த வரம்பும் இல்லாமல் இச்சுழற்சிகள் நித்தியமாகத் தொடரும் என்ற வாசிப்பு
  rationale: כָּל יְמֵי הָאָרֶץ (‘பூமியின் நாட்களெல்லாம்’) என்ற சொற்றொடர் வாக்குறுதியை பூமியின் காலத்தோடு இணைக்கிறது; ஆகவே உரை கூறாத நித்தியத்தன்மையை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதவாக்கியத்திற்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டது. இணைச்சொற்களின் எபிரெய ஓசைநயமும் வரிசையும் இயன்றவரை காக்கப்பட்டுள்ளன.
