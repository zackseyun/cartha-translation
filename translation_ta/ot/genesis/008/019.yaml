base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/019.yaml
  text: Every beast[a], every creeping thing, and every bird—everything that moves on the earth—went out from the ark by their families.
translation:
  language: ta
  text: எல்லா விலங்குகளும், ஊர்ந்து செல்லும் எல்லா உயிரினங்களும், எல்லாப் பறவைகளும்—நிலத்தின்மேல் நகரும் அனைத்தும்—தத்தம் குடும்பங்களின்படி[a] பேழையிலிருந்து வெளியேறின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குடும்பம் குடும்பமாக.” எபிரெயச் சொற்றொடர் விலங்குகளின் வம்சக் குழுக்கள் அல்லது பிரிவுகள் என்ற கருத்தைத் தக்கவைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: எல்லா விலங்குகளும்
  rationale: இங்கு חַיָּה என்பது ஊர்ந்து செல்லும் உயிரினங்களிலிருந்தும் பறவைகளிலிருந்தும் வேறுபடுத்தப்படும் விலங்கு வகையைக் குறிக்கிறது. காட்டு அல்லது வீட்டு விலங்குகள் என்று தேவையின்றி வரையறுக்காமல், பொதுவான வகைப்பாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: כָּל הָרֶמֶשׂ
  choice: ஊர்ந்து செல்லும் எல்லா உயிரினங்களும்
  rationale: רֶמֶשׂ என்பது தரைக்கு அருகில் நகரும் சிறு உயிரினங்களைக் குறிக்கிறது. ‘உயிரினங்கள்’ என்பது இவற்றை வெறும் பொருட்களாக அல்லாமல் உயிருள்ள படைப்புகளாகத் தெளிவாகக் காட்டுகிறது.
- source_word: וְכָל הָעוֹף
  choice: எல்லாப் பறவைகளும்
  rationale: עוֹף என்பதற்குப் பறக்கும் உயிரினங்கள் என்ற விரிவான பொருள் இருக்கக்கூடும்; ஆனால் இந்தப் பட்டியலில் ‘பறவைகள்’ என்பதே இயல்பான சூழல்சார் மொழிபெயர்ப்பு.
- source_word: כֹּל רוֹמֵשׂ עַל הָאָרֶץ
  choice: நிலத்தின்மேல் நடமாடும் அனைத்தும்
  rationale: רוֹמֵשׂ என்பது நிலத்தின்மேல் நகர்வதைக் குறிக்கும் பங்கேற்பு வடிவம். முந்தைய ‘ஊர்ந்து செல்லும்’ என்ற சொற்றொடரைத் தேவையின்றி மீண்டும் கூறாமல், இங்குள்ள விரிவான இயக்கப் பொருளை ‘நடமாடும்’ என்பதால் காக்கிறது.
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: தங்கள் தங்கள் குடும்பங்களின்படி
  rationale: מִשְׁפָּחָה என்பதன் அடிப்படைப் பொருள் ‘குடும்பம்/குலம்.’ விலங்குகள் அவற்றின் வம்சக் குழுக்களாக அல்லது பிரிவுகளாக வெளியேறிய கருத்தை, ‘வகைகளின்படி’ என்று விளக்கிவிடாமல், எபிரெய உருவகத்துடன் காக்கிறது.
- source_word: יָצְאוּ מִן הַתֵּבָה
  choice: பேழையிலிருந்து வெளியேறின
  rationale: יָצְאוּ என்பது எளிய ‘வெளியே போதல்/வருதல்’ வினை. תֵּבָה என்பதற்கு நோவாவின் நிகழ்வில் மரபாகவும் தெளிவாகவும் பயன்படும் ‘பேழை’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
