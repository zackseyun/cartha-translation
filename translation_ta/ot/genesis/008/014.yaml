  yaml_path: translation/ot/genesis/008/014.yaml
  text: And in the second month[a], on the twenty-seventh day of the month, the earth was dry.
translation:
  language: ta
  text: இரண்டாம் மாதத்தின் இருபத்தேழாம் நாளில், பூமி வறண்ட நிலையில் இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நிலம் வறண்ட நிலையில் இருந்தது.’ எபிரேய אֶרֶץ என்ற சொல் ‘பூமி,’ ‘நிலம்,’ அல்லது ‘தரை’ என்று பொருள்படலாம்; வெள்ளக் கதையின் விரிந்த அளவிலான வருணனையால் இங்கே ‘பூமி’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַשֵּׁנִי
  choice: இரண்டாம் மாதம்
  rationale: וּ தொடர்ச்சியான காலக் குறிப்பை அறிமுகப்படுத்துகிறது. தமிழில் வசனத் தொடக்கத்தில் தனியே ‘மேலும்’ சேர்ப்பதைவிட, இயல்பான காலக் குறிப்பே கதைத் தொடர்ச்சியைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּשִׁבְעָה וְעֶשְׂרִים יוֹם לַחֹדֶשׁ
  choice: அந்த மாதத்தின் இருபத்தேழாம் நாளில்
  rationale: எபிரேய தேதிக் கூறுமுறையை நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் வழங்குகிறது; ‘அந்த’ என்பது முன் கூறப்பட்ட இரண்டாம் மாதத்தையே சுட்டுகிறது.
- source_word: יָבְשָׁה
  choice: உலர்ந்திருந்தது
  rationale: Qal perfect 3fs இச்சமயத்தில் அடைந்திருந்த நிலையைச் சுட்டுகிறது. ‘உலர்ந்திருந்தது’ என்பது விளைவு நிலையை இயல்பாக வெளிப்படுத்துகிறது; நிகழ்வை ‘உலர்ந்தது’ என்று மட்டும் காட்டுவதில்லை.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: אֶרֶץ என்பதற்கு ‘பூமி’, ‘நிலம்’ ஆகிய பொருள்கள் உண்டு. வெள்ளக் கதையின் விரிந்த அளவிலான வருணனைக்கு ‘பூமி’ பொருந்துகிறது; இருப்பினும் சொற்பொருள் நெகிழ்வை அடிக்குறிப்பு பாதுகாக்கிறது.
