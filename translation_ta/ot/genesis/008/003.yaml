base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/003.yaml
  text: And the waters receded from upon the earth[a], going and returning[b], and the waters diminished at the end of a hundred and fifty days.
translation:
  language: ta
  text: தண்ணீர் பூமியின் மேலிருந்து தொடர்ந்து பின்வாங்கிக் கொண்டிருந்தது[a], நூற்று ஐம்பது நாட்களின் முடிவில் தண்ணீர் குறைந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படி, “போயும் திரும்பியும்.” இங்கு இந்தச் சொற்றொடர் தண்ணீர் தொடர்ந்து, படிப்படியாகப் பின்வாங்கியதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: பின்வாங்கிக்கொண்டே இருந்தது
  rationale: שׁוב என்பதன் அடிப்படைப் பொருள் ‘திரும்புதல்’; வெள்ளநீரைப் பற்றிய இச்சூழலில், அது நிலத்தின் மேலிருந்து விலகிச் செல்வதை இயல்பான தமிழில் ‘பின்வாங்குதல்’ எனக் கூறுகிறது.
- source_word: מֵעַל הָאָרֶץ
  choice: பூமியின் மேலிருந்து
  rationale: מֵעַל என்பதிலுள்ள ‘மேலிருந்து’ என்ற இடவியல் படிமத்தைப் பாதுகாக்கிறது; நீர் நிலத்தின் மேல் பரவியிருந்ததை இது உணர்த்துகிறது.
- source_word: הָלוֹךְ וָשׁוֹב
  choice: தொடர்ந்து … கொண்டே இருந்தது
  rationale: இரண்டு வினையெச்சங்களால் அமைந்த எபிரெயச் சொற்றொடர் செயல் தொடர்ந்து, படிப்படியாக நிகழ்ந்ததை இங்கு உணர்த்துகிறது. தமிழில் தொடர்நிலை வடிவம் அந்த நீடித்த தன்மையை இயல்பாக வெளிப்படுத்துகிறது; அதன் சொற்படி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיַּחְסְרוּ
  choice: குறைந்தது
  rationale: חסר நீரின் அளவு குறைந்ததைக் குறிக்கிறது. முன் வரும் ‘பின்வாங்கியது’ என்பதிலிருந்து வேறுபட்ட இரண்டாவது வினையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מִקְצֵה
  choice: முடிவில்
  rationale: காலத்தைக் குறிக்கும் இப்பயன்பாட்டில் ‘முடிவில்’ என்பது நூற்றைம்பது நாட்கள் நிறைவடைந்த காலப்புள்ளியை நேரடியாகக் காட்டுகிறது.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: நூற்றைம்பது நாட்கள்
  rationale: எபிரெய எண்ணிக்கையின் நேரான, இயல்பான நவீனத் தமிழ் வடிவம்.
