source:
  edition: WLC
  text: וַ/יָּ֣רַח יְהוָה֮ אֶת רֵ֣יחַ הַ/נִּיחֹחַ֒ וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל לִבּ֗/וֹ לֹֽא אֹ֠סִף לְ/קַלֵּ֨ל ע֤וֹד אֶת הָֽ/אֲדָמָה֙ בַּ/עֲב֣וּר הָֽ/אָדָ֔ם כִּ֠י יֵ֣צֶר לֵ֧ב הָ/אָדָ֛ם רַ֖ע מִ/נְּעֻרָ֑י/ו וְ/לֹֽא אֹסִ֥ף ע֛וֹד לְ/הַכּ֥וֹת אֶת כָּל חַ֖י כַּֽ/אֲשֶׁ֥ר עָשִֽׂיתִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/021.yaml
  text: And the LORD smelled the pleasing aroma, and the LORD said to himself, “I will never again curse the ground because of man, for the intention of man’s heart is evil from his youth. And I will never again strike down every living thing as I have done.”
translation:
  language: ta
  text: கர்த்தர் அந்த இனிய நறுமணத்தை முகர்ந்தார். அப்போது கர்த்தர் தமக்குள், “மனிதன் காரணமாக இனி ஒருபோதும் நிலத்தைச் சபிக்கமாட்டேன்; ஏனெனில் மனிதனுடைய இதயத்தின் நாட்டம் அவன் இளமையிலிருந்தே தீமையானது. நான் செய்ததுபோல உயிருள்ள அனைத்தையும் இனி ஒருபோதும் அழிக்கமாட்டேன்” என்று சொன்னார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: கர்த்தர்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் மரியாதைக்குரிய வடிவம்; மூலத்தில் வரும் உடன்படிக்கைப் பெயரை பொதுவான பட்டப்பெயராக முற்றிலும் கரைத்துவிடாமல் மரபான தமிழ் வாசிப்புடன் இணைக்கிறது.
- source_word: רֵיחַ הַנִּיחֹחַ
  choice: இனிய நறுமணம்
  rationale: பலியின் மணம் ஏற்றுக்கொள்ளத்தக்கதும் மனநிறைவு தருவதுமாக இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது; சொற்றொடரின் மனித உருவக மொழியையும் தக்கவைக்கிறது.
- source_word: אֶל־לִבּוֹ
  choice: தமக்குள்
  rationale: சொல்லுக்கு சொல் ‘தமது இதயத்தில்’ என்றாலும், உள்ளார்ந்த உரையை நவீன தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: בַּעֲבוּר הָאָדָם
  choice: மனிதனை முன்னிட்டு
  rationale: ‘மனிதன் காரணமாக/மனிதனை முன்னிட்டு’ என்ற காரணத் தொடர்பைத் தக்கவைத்து, கடவுள் மனிதனின் தீமையை அடிப்படையாகக் கொண்டு நிலத்தைச் சபிப்பது பற்றிய வாக்கியத்தின் பதற்றத்தை முன்கூட்டியே தீர்க்கவில்லை.
- source_word: יֵצֶר לֵב הָאָדָם
  choice: மனிதனுடைய இதயத்தின் நாட்டம்
  rationale: יֵצֶר என்பது உருவாக்கப்பட்ட மனப்போக்கு, நாட்டம் அல்லது எண்ணத்தின் வடிவமைப்பைக் குறிக்கலாம்; ‘நாட்டம்’ இந்த பரப்பைச் சுருக்காமல் இயல்பாக எடுத்துரைக்கிறது.
- source_word: מִנְּעֻרָיו
  choice: அவன் இளமையிலிருந்தே
  rationale: மூலத்தின் காலத் தொடக்கக் குறிப்பை நேராகப் பாதுகாக்கிறது; பிறப்பிலிருந்தே என்று வலுப்படுத்துவதையும் வெறும் இளமைக்காலத்தில் என்று மட்டுப்படுத்துவதையும் தவிர்க்கிறது.
- source_word: לְהַכּוֹת אֶת־כָּל־חַי
  choice: உயிருள்ள அனைத்தையும் … அழிக்க
  rationale: அடித்தல்/வாதித்தல் என்ற அடிப்படை வினை இச்சூழலில் உயிர்களை ஒழித்த பேரழிவைக் குறிக்கிறது; ‘அழிக்க’ இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
theological_decisions:
- issue: மனிதனின் இதய நாட்டம் தீமையானது என்பதன் கால எல்லை
  choice: “அவன் இளமையிலிருந்தே”
  alternative: “அவன் பிறப்பிலிருந்தே”
  rationale: மூலச் சொல் ‘இளமை’ என்பதையே குறிக்கிறது; பிறவிப்பாவம் குறித்த ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- issue: கடவுள் பலியின் மணத்தை முகர்தல்
  choice: மனித உருவக மொழியை நேரடியாகத் தக்கவைத்தல்
  alternative: “பலியால் கர்த்தர் மகிழ்ந்தார்”
  rationale: மூலத்தின் தெளிவான புலனுணர்வு உருவகத்தை விளக்கவுரையாக மாற்றாமல் பாதுகாக்கிறது.
- issue: அழிக்கப்படாத உயிர்களின் பரப்பு
  choice: “உயிருள்ள அனைத்தையும்”
  alternative: “எல்லா உயிரினங்களையும்”
  rationale: כָּל־חַי என்பதன் பரந்த, சற்றே திறந்த சொற்பயன்பாட்டைத் தக்கவைக்கிறது; அடுத்தடுத்த உடன்படிக்கைச் சூழலை இவ்வசனத்துக்குள் முன்கூட்டியே இறக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரை. “தமக்குள்” மற்றும் “இதயத்தின் நாட்டம்” ஆகியவை இயல்பையும் மூலத்தின் கருத்துச் செறிவையும் சமநிலைப்படுத்துகின்றன. அடிக்குறிப்புகள் தேவையில்லை; ஆகவே முதன்மை உரையில் அடிக்குறிப்பு குறியீடுகள் இல்லை.
