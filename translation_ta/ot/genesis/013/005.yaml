  terminology: ‘ஆட்டு மந்தைகள்’ is a usable contextual rendering of צֹאן, while the footnote properly preserves its broader sense of small livestock, particularly sheep and goats. ‘மாட்டு மந்தைகள்’ accurately represents בקר without conflating it with צֹאן. Names and ‘கூடாரங்கள்’ are consistent and appropriate.
