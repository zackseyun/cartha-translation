  yaml_path: translation/ot/genesis/013/005.yaml
  text: And Lot[a], who went with Abram, also had flocks and herds and tents.
translation:
  language: ta
  text: ஆபிராமுடன் சென்ற லோத்திடமும் ஆட்டு மந்தைகள்[a], மாட்டு மந்தைகள், கூடாரங்கள் ஆகியவை இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘ஆட்டு மந்தைகள்’ என்பதற்கான எபிரெயச் சொல், குறிப்பாகச் செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கிய சிறிய கால்நடைகளைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: லோத்திடமும்
  rationale: இணைப்புச் சொல்லும் சேர்க்கைப் பொருளும், முந்தைய வசனத்துடன் தொடர்பைத் தக்கவைத்தபடி ‘லோத்திடமும்’ என்பதில் இயல்பாக வெளிப்படுகின்றன.
- source_word: לְלוֹט ... הָיָה
  choice: லோத்திடமும் ... இருந்தன
  rationale: எபிரெயத்தில் உடைமையைக் குறிக்கும் ‘லோத்துக்கு இருந்தது’ என்ற அமைப்பை, இயல்பான நவீனத் தமிழில் இவ்வாறு வழங்குகிறது.
- source_word: הַהֹלֵךְ אֶת אַבְרָם
  choice: ஆபிராமுடன் சென்ற
  rationale: பங்கேற்பு வினைச்சொல் லோத்தை ஆபிராமுடன் உடன்சென்றவராக அடையாளப்படுத்துகிறது; தொடர்ந்த உடன்செல்லுதலின் பொருளையும் இந்த இயல்பான சொற்றொடர் போதுமான அளவு தருகிறது.
- source_word: צֹאן
  choice: ஆட்டு மந்தைகள்
  rationale: இது செம்மறியாடுகள், வெள்ளாடுகள் உள்ளிட்ட சிறிய கால்நடைகளைப் பொதுவாகக் குறிக்கிறது. சாதாரண வாசகருக்கு இயல்பான ‘ஆட்டு மந்தைகள்’ பயன்படுத்தப்பட்டு, அதன் பரந்த பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וּבָקָר
  choice: மாட்டு மந்தைகள்
  rationale: இச்சொல் பசுவினக் கால்நடைகளைக் குறிக்கிறது; ‘மாட்டு மந்தைகள்’ என்பது צֹאן என்பதற்கான இணை அமைப்பையும் கூட்டுப் பொருளையும் காக்கிறது.
- source_word: וְאֹהָלִים
  choice: கூடாரங்கள்
  rationale: பன்மையில் உள்ள எபிரெயச் சொல்லின் நேரடியான, இயல்பான தமிழ் இணைச்சொல் இது.
