id: GEN.13.7
reference: Genesis 13:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַֽ/יְהִי רִ֗יב בֵּ֚ין רֹעֵ֣י מִקְנֵֽה אַבְרָ֔ם וּ/בֵ֖ין רֹעֵ֣י מִקְנֵה ל֑וֹט וְ/הַֽ/כְּנַעֲנִי֙ וְ/הַ/פְּרִזִּ֔י אָ֖ז יֹשֵׁ֥ב בָּ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/007.yaml
  text: And there was strife between the herdsmen of Abram’s livestock and the herdsmen of Lot’s livestock[b][a]. Now the Canaanite and the Perizzite were dwelling in the land at that time.
translation:
  language: ta
  text: ஆபிராமின் கால்நடைகளை மேய்ப்பவர்களுக்கும் லோத்தின் கால்நடைகளை மேய்ப்பவர்களுக்கும் இடையே பிணக்கு ஏற்பட்டது. அப்போது கானானியரும் பெரிசியரும்[a] அந்த நாட்டில் வாழ்ந்து வந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘கானானியன், பெரிசியன்’ என்று ஒருமை இனப்பெயர்கள் கூட்டுப்பொருளில் வருகின்றன.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அக்காலத்தில் அந்த நாட்டில் குடியிருந்தார்கள்.’
    reason: translation_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ஏற்பட்டது
  rationale: கதை நிகழ்வை அறிமுகப்படுத்தும் வினைவடிவத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; வெறும் ‘இருந்தது’ என்பதைவிட பிணக்கு உருவானதைத் தெளிவாகக் கூறுகிறது.
- source_word: רִיב
  choice: பிணக்கு
  rationale: இரு தரப்பினருக்கிடையிலான சச்சரவு அல்லது மோதலைக் குறிக்கும்; நவீன தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: רֹעֵי מִקְנֵה
  choice: கால்நடைகளை மேய்ப்பவர்கள்
  rationale: מִקְנֶה என்பது ஆடுகளை மட்டும் அல்லாமல் பலவகை வளர்ப்பு விலங்குகளையும் குறிக்கலாம்; ஆகவே ‘மேய்ப்பர்கள்’ என்பதைக் காட்டிலும் இச்சொற்றொடர் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בֵּין ... וּבֵין
  choice: …க்கும் …க்கும் இடையே
  rationale: மோதலில் ஈடுபட்ட இரு தனித்தரப்புகளையும் எபிரெய அமைப்புக்கு இணையாகக் காட்டுகிறது.
- source_word: וְהַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: கானானியரும் பெரிசியரும்
  rationale: எபிரெயத்தில் இனப்பெயர்கள் ஒருமை வடிவில் கூட்டுப்பொருளுடன் வருகின்றன; தமிழில் மக்களினங்களைக் குறிக்க இயல்பான பன்மைப் பொருள் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אָז יֹשֵׁב
  choice: அப்போது … வாழ்ந்து வந்தார்கள்
  rationale: אָז என்பதன் காலக் குறிப்பையும், יֹשֵׁב என்ற பங்கேற்புவடிவத்தின் தொடர்நிலை நுணுக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בָּאָרֶץ
  choice: அந்த நாட்டில்
  rationale: குறிப்பிட்ட நிலப்பகுதியைச் சுட்டுகிறது; ஆதியாகமத்தில் ‘நாடு/நிலம்’ என்பதற்கு இருக்கக்கூடிய புவியியல் மற்றும் உடன்படிக்கைச் சார்ந்த நுணுக்கத்தை முற்றிலும் தட்டையாக்காமல் காக்கிறது.
theological_decisions:
- issue: הָאָרֶץ என்பதன் புவியியல் மற்றும் உடன்படிக்கை சார்ந்த நுணுக்கம்
  choice: அந்த நாடு
  alternative: அந்தப் பகுதி
  rationale: இங்கு வாக்கியம் முதன்மையாக புவியியல் நிலையை விவரித்தாலும், ஆதியாகமத்தில் ‘நாடு’ என்பதற்கு விரிவான கதை மற்றும் உடன்படிக்கைத் தொடர்பு இருக்கலாம். ‘பகுதி’ என்று மொழிபெயர்ப்பது அந்த நுணுக்கத்தைத் தேவையின்றிக் குறைக்கும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதான அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கால்நடைகளை மேய்ப்பவர்கள்’ என்பது பலவகை மந்தைகளையும் உள்ளடக்குகிறது; ‘வாழ்ந்து வந்தார்கள்’ தொடர்ந்த குடியிருப்பை உணர்த்துகிறது.
