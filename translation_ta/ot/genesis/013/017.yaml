id: GEN.13.17
reference: Genesis 13:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: ק֚וּם הִתְהַלֵּ֣ךְ בָּ/אָ֔רֶץ לְ/אָרְכָּ֖/הּ וּ/לְ/רָחְבָּ֑/הּ כִּ֥י לְ/ךָ֖ אֶתְּנֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/017.yaml
  text: Get up[a], walk through the land, through its length and its width[b], for I will give it to you.
translation:
  language: ta
  text: எழுந்து, அந்த நிலத்தில் அதன் நீளவாக்கிலும் அகலவாக்கிலும் நடந்து செல்[a]; ஏனெனில் அதை உனக்குக் கொடுப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நிலத்தில் அதன் நீளவாக்கிலும் அகலவாக்கிலும் சுற்றி நட.”
    reason: הִתְהַלֵּךְ என்பது ‘நடந்து செல்’ என்பதோடு ‘சுற்றி நட’ அல்லது ‘அங்குமிங்கும் நட’ என்ற நுண்பொருளையும் தரக்கூடும்.
lexical_decisions:
- source_word: ק֚וּם
  choice: எழுந்து
  rationale: קום என்பதன் கட்டளை வடிவம் எழுதல் அல்லது எழுந்து நிற்றல் என்ற நேரடியான கட்டளையைத் தருகிறது; ‘எழுந்து’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: הִתְהַלֵּ֣ךְ
  choice: நடந்து செல்
  rationale: הלך என்பதன் ஹித்பயேல் கட்டளை வடிவம் ஓரிடத்தில் நடமாடுதல் அல்லது அதன் வழியாகச் செல்லுதல் என்ற பொருளைக் கொண்டது. சூழலில் நிலத்தின் பரப்பெங்கும் செல்வதை ‘நடந்து செல்’ இயல்பாகத் தெரிவிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בָּאָרֶץ
  choice: அந்த நிலத்தில்
  rationale: இங்கு אֶרֶץ பொதுவாகப் பூமியைக் குறிக்காமல், ஆபிராமுக்குக் காட்டப்பட்ட குறிப்பிட்ட நிலப்பரப்பைக் குறிக்கிறது.
- source_word: לְאָרְכָּהּ וּלְרָחְבָּהּ
  choice: அதன் நீளவாக்கிலும் அகலவாக்கிலும்
  rationale: ‘நீளம்’ மற்றும் ‘அகலம்’ என்ற இணைச்சொற்கள் நிலத்தின் முழுப் பரப்பையும் சுட்டுகின்றன; ‘நீளவாக்கிலும் அகலவாக்கிலும்’ என்பது அந்தத் திசை மற்றும் பரப்பு உணர்வைத் தமிழில் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְךָ
  choice: உனக்கு
  rationale: கொடையின் பெறுநரான ஆபிராமைச் சுட்டும் நேரடியான நான்காம் வேற்றுமை வடிவம்.
- source_word: אֶתְּנֶנָּה
  choice: அதை ... கொடுப்பேன்
  rationale: נתן என்பதன் முதலாம் நபர் ஒருமை நிறைவுறா வடிவமும் பெண்பால் ஒருமை பின்னொட்டும் சேர்ந்து, முன்னர் குறிப்பிடப்பட்ட நிலத்தை எதிர்காலத்தில் கொடுப்பதாகத் தெரிவிக்கின்றன.
theological_decisions:
- issue: אֶתְּנֶנָּה என்பதிலுள்ள பெண்பால் ஒருமைப் பின்னொட்டின் குறிப்பு
  choice: ‘அதை’ என்பது ‘அந்த நிலத்தை’க் குறிக்கிறது.
  alternative: பின்னொட்டின் பொருளை வெளிப்படையாக ‘அந்த நிலத்தை’ என்று மீண்டும் கூறுதல்.
  rationale: எபிரெய மொழியில் பெண்பால் ஒருமையான אֶרֶץ என்பதே இயல்பான முன்னிலைச் சொல். தமிழிலும் ‘அதை’ என்று வைத்திருப்பது மூலத்தின் சுட்டுப்பெயர் அமைப்பைக் காத்து, கூடுதல் விளக்கத்தை வசனத்துக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியும் கண்ணியமுமான கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீளவாக்கிலும் அகலவாக்கிலும்’ என்பது நிலத்தின் முழுப் பரப்பைக் குறிக்கும் எபிரெய இணைச்சொல் அமைப்பை இயல்பாகத் தக்கவைக்கிறது.
