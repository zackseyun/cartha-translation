  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֧י אֶת כָּל הָ/אָ֛רֶץ אֲשֶׁר אַתָּ֥ה רֹאֶ֖ה לְ/ךָ֣ אֶתְּנֶ֑/נָּה וּֽ/לְ/זַרְעֲ/ךָ֖ עַד עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/015.yaml
  text: For all the land that you see[a], I will give to you and to your offspring forever.
translation:
  language: ta
  text: ஏனெனில், நீ காண்கிற நிலம் முழுவதையும் உனக்கும் உன் சந்ததிக்கும்[a] என்றென்றும் கொடுப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் வித்துக்கும்.” எபிரெய மொழியில் זֶרַע என்பது “விதை,” “சந்ததி,” அல்லது “வழித்தோன்றல்கள்” என்று பொருள்படக்கூடிய கூட்டுப்பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளையைத் தொடர்ந்து வரும் இறைவாக்குறுதியின் விளக்கத்தை இணைக்கிறது; காரணத்தன்மையை அளவுக்கு மீறாமல் இயல்பான தமிழில் காட்டுகிறது.
- source_word: כָּל הָאָרֶץ אֲשֶׁר אַתָּה רֹאֶה
  choice: நீ காண்கிற நிலம் முழுவதையும்
  rationale: கண்ணில் படும் நிலத்தின் முழுமையையும் குறிக்கும் எபிரெயத் தொடரைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: உனக்குக் கொடுப்பேன்
  rationale: לְךָ பெறுபவரைக் குறிக்கிறது; נתן வினையின் முற்றுப்பெறாத வடிவம் இச்சூழலில் எதிர்கால வாக்குறுதியாக உள்ளது.
- source_word: וּלְזַרְעֲךָ
  choice: உன் சந்ததிக்கும்
  rationale: זֶרַע என்பது ஒருமை வடிவிலுள்ள கூட்டுப்பெயர்; ‘சந்ததி’ அதன் கூட்டு இயல்பையும் தலைமுறைத் தொடரையும் தமிழில் இயல்பாகப் பேணுகிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த, முடிவற்ற காலத்தைச் சுட்டும் வாக்குறுதியின் வலிமையை, குறிப்பிட்ட இறுதிக்கால விளக்கத்தைச் சேர்க்காமல் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: நில வாக்குறுதியில் עַד עוֹלָם என்பதன் கால அளவு
  choice: என்றென்றும்
  alternative: ஒரு யுகம் வரை; நிரந்தரமாக
  rationale: இத்தொடர் நீடித்த அல்லது முடிவற்ற காலத்தைக் குறிக்கக்கூடும். ‘என்றென்றும்’ அதன் நேரடியான வாக்குறுதி வலிமையைப் பேணுகிறது; அதன் உடன்படிக்கை அல்லது இறுதிக்கால நிறைவேற்றம் எவ்வாறு புரிந்துகொள்ளப்பட வேண்டும் என்பதை மொழிபெயர்ப்பு தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் இணைப்பும், நிலத்தின் முழுமையும், சந்ததி என்ற கூட்டுப்பெயரின் தெளிவின்மையும், கால வாக்குறுதியின் இறையியல் அழுத்தமும் பேணப்பட்டுள்ளன.
