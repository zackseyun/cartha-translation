source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל ל֗וֹט אַל נָ֨א תְהִ֤י מְרִיבָה֙ בֵּינִ֣/י וּ/בֵינֶ֔י/ךָ וּ/בֵ֥ין רֹעַ֖/י וּ/בֵ֣ין רֹעֶ֑י/ךָ כִּֽי אֲנָשִׁ֥ים אַחִ֖ים אֲנָֽחְנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/008.yaml
  text: So Abram said to Lot[a], “Please, let there be no strife between me and you, and between my herdsmen and your herdsmen[b], for we are kinsmen.”
translation:
  language: ta
  text: ஆபிராம் லோத்திடம், “தயவுசெய்து, எனக்கும் உனக்கும் இடையிலும், என் கால்நடை மேய்ப்பவர்களுக்கும் உன் கால்நடை மேய்ப்பவர்களுக்கும் இடையிலும் தகராறு இருக்க வேண்டாம்; ஏனெனில் நாம் உறவினர்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “நாம் ஆண்கள், சகோதரர்கள்.” இங்கு “சகோதரர்கள்” என்பது ஒரே பெற்றோரின் பிள்ளைகளை மட்டும் அல்லாமல் நெருங்கிய உறவினர்களையும் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: வாவ் தொடர்நிலை கதை நிகழ்வை முன்னெடுக்கிறது; தமிழில் இயல்பான நேரடி உரை அமைப்பில் வாக்கிய முடிவிலுள்ள ‘என்றார்’ அந்தத் தொடர்ச்சியைத் தெளிவாக வழங்குகிறது.
- source_word: אַל נָא תְהִי מְרִיבָה
  choice: தயவுசெய்து தகராறு வேண்டாம்
  rationale: אַל உடன் வரும் வேண்டுகோள் வடிவமும், அதை மென்மையாக்கும் נָא என்பதும் மரியாதையான எதிர்மறை வேண்டுகோளைத் தருகின்றன. ‘தகராறு’ என்பது கருத்து மோதல் மற்றும் மேய்ப்பவர்களிடையிலான பூசல் ஆகிய இரண்டையும் உள்ளடக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: எனக்கும் உனக்கும் இடையிலும்
  rationale: எபிரெய மூலத்தில் ஒவ்வொரு தரப்பையும் தனித்தனியாகக் குறிப்பிடும் בין அமைப்பைத் தமிழிலும் காக்கிறது.
- source_word: רֹעַי ... רֹעֶיךָ
  choice: என் கால்நடை மேய்ப்பவர்கள் ... உன் கால்நடை மேய்ப்பவர்கள்
  rationale: רעה என்பதன் பங்கேற்பு வடிவம் கால்நடைகளை மேய்த்துப் பராமரிப்பவர்களைக் குறிக்கிறது. சூழலில் பலவகைக் கால்நடைகள் இருப்பதால், ஆடுகளை மட்டும் உணர்த்தக்கூடிய சொல்லைவிட இத்தேர்வு துல்லியமானது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: ஆபிராமின் வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கச் செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֲנָשִׁים אַחִים אֲנָחְנוּ
  choice: நாம் உறவினர்கள்
  rationale: இங்கு ‘சகோதரர்கள்’ என்பது ஒரே பெற்றோரின் மகன்களை மட்டும் குறிக்காமல் விரிந்த குடும்ப உறவைக் குறிக்கிறது; ஆபிராம் லோத்தின் சிறிய தந்தை என்பதால் ‘உறவினர்கள்’ சூழலுக்கேற்ற இயல்பான சமமாகும்.
theological_decisions:
- issue: ஆபிராமுக்கும் லோத்துக்கும் இடையில் אַחִים என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘உறவினர்கள்’
  alternative: ‘சகோதரர்கள்’ அல்லது சொற்சொல்லாக ‘நாம் சகோதரர்களான ஆண்கள்’
  rationale: எபிரெய אָח/אַחִים விரிந்த குடும்ப உறவையும் குறிக்க முடியும். இங்கு உயிரியல் சகோதரர்கள் என்று தவறாகப் புரிந்துகொள்ளப்படாமல், குடும்ப ஒற்றுமையை அடிப்படையாகக் கொண்ட ஆபிராமின் வேண்டுகோள் இயல்பாக வெளிப்பட ‘உறவினர்கள்’ தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், அதேவேளை கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தயவுசெய்து’ வேண்டுகோளின் மென்மையையும், மீண்டும் வரும் ‘இடையிலும்’ மூலத்தின் இணை அமைப்பையும் காக்கின்றன.
