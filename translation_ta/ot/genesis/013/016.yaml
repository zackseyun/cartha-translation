  text: וְ/שַׂמְתִּ֥י אֶֽת זַרְעֲ/ךָ֖ כַּ/עֲפַ֣ר הָ/אָ֑רֶץ אֲשֶׁ֣ר אִם יוּכַ֣ל אִ֗ישׁ לִ/מְנוֹת֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ גַּֽם זַרְעֲ/ךָ֖ יִמָּנֶֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/016.yaml
  text: And I will make your offspring like the dust of the earth[a], so that if a man can count the dust of the earth[b], then your offspring also can be counted.
translation:
  language: ta
  text: உன் சந்ததியை[a] பூமியின் தூளைப்போல ஆக்குவேன். ஒருவன்[b] பூமியின் தூளை எண்ண முடிந்தால், உன் சந்ததியையும் எண்ண முடியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் வித்து” அல்லது “உன் வழித்தோன்றல்கள்”; எபிரெயச் சொல் கூட்டாகச் சந்ததியைக் குறிக்கும் ஒருமை வடிவிலான பெயர்ச்சொல்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாராவது”; எபிரெயத்தில் ஆண்பால் ஒருமை வடிவம் பொதுப்பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: இருக்கும்படி நான் செய்வேன்
  rationale: שׂוּם என்பதன் அடிப்படைப் பொருள் ‘வைத்தல்/அமைத்தல்’; இங்கு ஒப்புமையுடன் வருவதால், தமிழில் இயல்பாகவும் காரணவினைப் பொருளுடனும் ‘இருக்கும்படி செய்வேன்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: זַרְעֲךָ
  choice: உன் சந்ததி
  rationale: זֶרַע என்பது விதையையும் உருவகமாக வழித்தோன்றல்களையும் குறிக்கும் ஒருமை வடிவிலான கூட்டுப்பெயர். ‘சந்ததி’ அதன் கூட்டொருமை நுட்பத்தைத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: பூமியின் தூளைப்போல
  rationale: எபிரெய ஒப்புமையையும் எண்ண முடியாத பெருக்கைக் காட்டும் மூலப் படிமத்தையும் நேரடியாகக் காக்கிறது.
- source_word: אֲשֶׁר אִם
  choice: …முடிந்தால்
  rationale: சந்ததி எவ்வளவு எண்ணிலடங்காததாக இருக்கும் என்பதை விளக்கும் நிபந்தனை ஒப்புமை தமிழில் இயல்பான ‘முடிந்தால்’ அமைப்பால் தரப்படுகிறது.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: மூலத்தில் ஆண்பால் ஒருமை வடிவம் பொதுப்பொருளில் பயன்படுத்தப்பட்டுள்ளது. ‘ஒருவன்’ அந்த இலக்கண வடிவைக் காக்கிறது; பொதுப்பொருள் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- source_word: לִמְנוֹת / יִמָּנֶה
  choice: எண்ண முடிந்தால் / எண்ண முடியும்
  rationale: מנה இங்கு எண்ணிக்கையிடுதலைக் குறிக்கிறது. நிபந்தனையின் இரு பகுதிகளிலும் சாத்தியத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்த இவ்வடிவங்கள் பயன்படுத்தப்பட்டன.
- source_word: גַּם
  choice: -யும்
  rationale: தூளுக்கும் சந்ததிக்கும் இடையிலான ஒத்திணைப்பைத் தமிழின் இணைப்பும்மையான ‘-யும்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஆபிராமுக்கான வாக்குறுதியில் זֶרַע என்ற கூட்டுப்பெயரின் மொழிபெயர்ப்பு
  choice: உன் சந்ததி
  alternative: உன் வித்து / உன் வழித்தோன்றல்கள்
  rationale: இவ்வசனம் ஆபிராமின் எண்ணிலடங்காத வழித்தோன்றல்களை ஒரு கூட்டொருமையாகக் குறிப்பிடுகிறது. ‘சந்ததி’ அந்த நுட்பத்தைக் காக்கிறது; அதேவேளை இவ்வசனத்திற்குள் தனிப்பட்ட மேசியா குறித்த விளக்கத்தை முன்கூட்டியே புகுத்துவதில்லை.
- issue: אִישׁ என்பதிலுள்ள பொதுப்பொருள் கொண்ட ஆண்பால் வடிவம்
  choice: ஒருவன்
  alternative: யாராவது / ஒருவர்
  rationale: மூலத்தின் ஆண்பால் ஒருமை வடிவம் பிரதான உரையில் காக்கப்படுகிறது; அது பொதுவாக எந்த மனிதரையும் குறிக்கலாம் என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘பூமியின் தூள்’ என்ற மூலப் படிமம் காக்கப்பட்டுள்ளது. நிபந்தனை வாக்கியம் சாத்தியத்தைச் சுட்டும் வகையில் இயல்பான தமிழில் அமைக்கப்பட்டுள்ளது.
