  text: Abram lived in the land of Canaan[a], and Lot lived in the cities of the plain and pitched his tents as far as Sodom.
translation:
  language: ta
  text: ஆபிராம் கானான் தேசத்தில் குடியிருந்தான்; லோத்து சமவெளியின் நகரங்களில் வசித்தான்; சோதோம் வரை கூடாரமிட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சோதோம் வரை தன் கூடாரத்தை நகர்த்தினான்.” எபிரெய வினை கூடாரமிடுதல் அல்லது கூடாரத்தை அமைத்தல் என்பதைக் குறிக்கலாம். இங்கு லோத்து தன் முகாமைச் சோதோமை நோக்கி விரிவுபடுத்தினான் என்பதே கருத்து; இந்தக் கட்டத்திலேயே அவன் நகருக்குள் குடியேறினான் என்று அவசியமாகப் பொருளல்ல.
    reason: lexical_alternative
