source:
  edition: WLC
  text: וַ/יִּשָּׂא ל֣וֹט אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן כִּ֥י כֻלָּ֖/הּ מַשְׁקֶ֑ה לִ/פְנֵ֣י שַׁחֵ֣ת יְהוָ֗ה אֶת סְדֹם֙ וְ/אֶת עֲמֹרָ֔ה כְּ/גַן יְהוָה֙ כְּ/אֶ֣רֶץ מִצְרַ֔יִם בֹּאֲ/כָ֖ה צֹֽעַר־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/010.yaml
  text: Lot lifted up his eyes and saw all the plain of the Jordan[a], that all of it was well watered before Yahweh destroyed Sodom and Gomorrah, like the garden of Yahweh, like the land of Egypt[d][c][b], as you go toward Zoar.
translation:
  language: ta
  text: லோத்து தன் கண்களை ஏறெடுத்துப் பார்த்து, யோர்தான் சமவெளி முழுவதையும்[a] கண்டான். யாவே சோதோமையும் கொமோராவையும் அழிப்பதற்கு முன்பு, அந்தப் பகுதி முழுவதும் நீர்வளம் நிறைந்திருந்தது; அது யாவேயின் தோட்டத்தைப் போலவும்[b], எகிப்து நாட்டைப் போலவும் இருந்தது, சோவாரை நோக்கிச் செல்லும்போது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோர்தான் பள்ளத்தாக்கு முழுவதையும்”; இன்னும் சொற்சொல்லாக, “யோர்தானின் வட்டாரம் முழுவதையும்.”
    reason: כִּכָּר என்பதன் புவியியல் பொருளுக்கு ஒன்றுக்கு மேற்பட்ட இயல்பான மொழிபெயர்ப்புகள் உள்ளன.
  - marker: b
    text: “யாவேயின் தோட்டம்” என்பது ஏதேன் தோட்டத்தின் செழுமையை நினைவூட்டலாம்.
    reason: மூல உரையின் சாத்தியமான இலக்கியத் தொடர்பை, அதை உறுதிப்படுத்தாமல் சுட்டுகிறது.
  - marker: c
    text: அல்லது, “சோவாரை நோக்கிய திசையில்.” எபிரெயச் சொற்றொடர் சோவாரை நோக்கிய திசையை அல்லது அணுகுமுகத்தைக் குறிக்கிறது; அது எந்த முந்தைய கூறுடன் இலக்கணமாக இணைகிறது என்பது தெளிவாகத் தீர்மானிக்கப்படவில்லை.
    reason: בֹּאֲכָה צֹעַר என்ற இறுதித் திசைக் குறிப்பின் இலக்கண இணைப்பு விவாதத்திற்குரியது; முதன்மை உரை அந்தத் தெளிவின்மையைத் தக்கவைக்கிறது.
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו
  choice: தன் கண்களை ஏறெடுத்துப் பார்த்தபோது
  rationale: எபிரெய மொழிப்படிமத்தை ஓரளவு தக்கவைத்தபடியே, பார்வையை உயர்த்திப் பார்த்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיַּרְא
  choice: கண்டான்
  rationale: கதைநடையில் வரும் எளிய பார்வைச் செயலை நேரடியாகக் குறிக்கிறது.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: யோர்தான் சமவெளி முழுவதையும்
  rationale: כִּכָּר என்பது வட்டமான நிலப்பரப்பு அல்லது சமவெளிப் பகுதியைக் குறிக்கலாம். புவியியல் சூழலில் ‘சமவெளி’ தெளிவாகவும் இயல்பாகவும் உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי כֻלָּהּ מַשְׁקֶה
  choice: அந்தப் பகுதி முழுவதும் நீர்வளம் நிறைந்திருந்தது
  rationale: מַשְׁקֶה இங்கு நன்கு நீர்ப்பாசனம் பெற்ற அல்லது மிகுந்த நீர்வளம் கொண்ட நிலப்பகுதியை விவரிக்கிறது. தமிழில் இயல்பான நிலவள விளக்கமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לִפְנֵי שַׁחֵת יְהוָה
  choice: யாவே ... அழிப்பதற்கு முன்பு
  rationale: לִפְנֵי காலத்தைக் குறிக்கிறது; שׁחת இச்சூழலில் நகரங்களை அழித்ததைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כְּגַן יְהוָה
  choice: யாவேயின் தோட்டத்தைப் போல
  rationale: எபிரெய ஒப்புமையையும் ஏதேன் தோட்டத்தை நினைவூட்டக்கூடிய தொடர்பையும் தக்கவைக்கிறது.
- source_word: כְּאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டைப் போல
  rationale: אֶרֶץ என்பதன் புவியியல் கருத்தை ‘நாடு’ என்று வெளிப்படுத்தி ஒப்புமையைத் தெளிவாக்குகிறது.
- source_word: בֹּאֲכָה צֹעַר
  choice: சோவார் திசைவரை
  rationale: சோவாரை நோக்கிய திசை அல்லது அணுகுமுகத்தைச் சுருக்கமாகக் குறிக்கிறது; மொழியியல் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. ஆகவே பட்டமாகிய ‘கர்த்தர்’ என்பதற்குப் பதிலாக ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது; ‘யாவே’ என்பது ஏற்றுக்கொள்ளப்பட்ட மறுகட்டமைக்கப்பட்ட உச்சரிப்பைத் தமிழில் பிரதிபலிக்கிறது.
- issue: ‘யாவேயின் தோட்டம்’ என்பதன் குறிப்பு
  choice: மூலத்தின் மறைமுகத் தொடர்பை மட்டும் தக்கவைத்தல்
  alternative: ‘ஏதேன் தோட்டம்’ என்று நேரடியாக்குதல்
  rationale: இந்த வசனம் ‘ஏதேன்’ என்று வெளிப்படையாகச் சொல்லவில்லை. எனவே சாத்தியமான ஏதேன் தொடர்பை அடிக்குறிப்பில் குறிப்பிடுகிறது; முதன்மை உரையில் அதைத் தீர்மானமாக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஏறெடுத்துப் பார்த்தபோது’ என்பது எபிரெய மொழிப்படிமத்தைத் தக்கவைக்கும் சற்றே உயர்ந்த ஆனால் பரிச்சயமான நடை. நீண்ட எபிரெய வாக்கியம் தமிழில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; தகவல் ஒழுங்கும் ஒப்புமைகளும் பாதுகாக்கப்பட்டுள்ளன.
