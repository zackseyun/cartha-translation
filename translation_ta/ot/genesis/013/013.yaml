source:
  edition: WLC
  text: וְ/אַנְשֵׁ֣י סְדֹ֔ם רָעִ֖ים וְ/חַטָּאִ֑ים לַ/יהוָ֖ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/013.yaml
  text: The men of Sodom were exceedingly wicked and sinful against Yahweh[a].
translation:
  language: ta
  text: சோதோமின் ஆண்கள் யாவேக்கு எதிராக மிகவும் பொல்லாதவர்களும் பாவிகளுமாக இருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் முன்னிலையில்.”
    reason: לַיהוָה என்பதை ‘யாவேக்கு எதிராக’ என்றும் ‘யாவேயின் முன்னிலையில்’ என்றும் புரிந்துகொள்ள முடியும் என்பதால் மாற்று வாசகம் தரப்படுகிறது.
lexical_decisions:
- source_word: וְ/אַנְשֵׁי סְדֹם
  choice: சோதோமின் ஆண்கள்
  rationale: אַנְשֵׁי என்பது אִישׁ என்பதன் பன்மைக் கட்டமைப்பு வடிவம்; இங்கு சோதோமின் ஆண் குடிமக்களைக் குறிப்பதால் ‘ஆண்கள்’ எனத் துல்லியமாக மொழிபெயர்க்கப்பட்டது. தொடக்க וְ சூழலில் விளக்கக் கூற்றை இணைக்கிறது; தமிழில் தனியான ‘மேலும்/இப்போது’ சேர்க்காமல் இயல்பாக விடப்பட்டுள்ளது.
- source_word: רָעִים
  choice: பொல்லாதவர்களாகவும்
  rationale: இச்சூழலில் இந்தச் சொல் சாதாரணத் தீமையையோ விரும்பத்தகாத தன்மையையோ அல்ல, ஒழுக்கரீதியான கொடுமையையும் தீய குணத்தையும் குறிக்கிறது.
- source_word: וְ/חַטָּאִים
  choice: பாவம் செய்கிறவர்களாகவும்
  rationale: இது רָעִים என்பதற்கு இணையான பன்மைப் பயனிலை; பாவத்தால் பண்பிடப்பட்டவர்களை இயல்பான நவீன தமிழில் செயல்முறைத் தொடராக வெளிப்படுத்துகிறது.
- source_word: לַ/יהוָה
  choice: யாவேக்கு எதிராக
  rationale: חטא உடன் வரும் לְ, யாருக்கு எதிராகக் குற்றம் அல்லது பாவம் செய்யப்படுகிறதோ அவரைக் குறிக்கலாம். יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: מְאֹד
  choice: மிகவும்
  rationale: கூற்றின் வலிமையை அதிகரிக்கும் இயல்பான, கண்ணியமான தமிழ்ச் சொல்; மிகுதியை மிகைப்படுத்தாமல் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய மூலத்தில் நான்கெழுத்து இறைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- issue: חַטָּאִים לַיהוָה என்பதில் לְ-இன் பொருள்
  choice: யாவேக்கு எதிராகப் பாவம் செய்கிறவர்கள்
  alternative: யாவேயின் முன்னிலையில் பாவம் செய்கிறவர்கள்
  rationale: பாவத்தின் இலக்காக யாவே இருப்பதை ‘எதிராக’ நன்றாக வெளிப்படுத்துகிறது. எனினும், அவர் முன்னிலையில் அல்லது அவரது பார்வையில் என்ற பொருளும் இலக்கணரீதியாகச் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘பொல்லாதவர்கள்’ ஒழுக்கத் தீமையையும், ‘பாவம் செய்கிறவர்கள்’ தொடர்ச்சியான பாவப் பண்பையும் தெளிவாகக் காட்டுகின்றன.
