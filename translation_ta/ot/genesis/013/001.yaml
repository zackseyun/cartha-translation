  yaml_path: translation/ot/genesis/013/001.yaml
  text: So Abram went up from Egypt[a], he and his wife and all that he had, and Lot with him, to the Negev.
translation:
  language: ta
  text: ஆபிராம் எகிப்திலிருந்து நெகேபுக்கு மேலே சென்றான்; அவனும் அவன் மனைவியும், அவனுக்கிருந்த எல்லாவற்றோடும், லோத்தும் அவனுடன் சென்றனர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தெற்கு நோக்கி.” எபிரேயச் சொல்லான ‘நெகேப்’ என்பது நெகேப் எனப்படும் தென்பகுதியையோ, பொதுவாகத் தெற்கு அல்லது தென்னிலத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: புறப்பட்டுச் சென்றான்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே போதல்’ என்றாலும், எகிப்திலிருந்து கானான் நோக்கிய பயணத்தைத் தமிழில் இயல்பாகச் சொல்ல ‘புறப்பட்டுச் சென்றான்’ என வழங்கப்பட்டது. ‘மேலே சென்றான்’ என்பது தமிழில் உயர நிலப்பரப்பை மட்டும் குறிக்கும் தவறான எண்ணத்தை ஏற்படுத்தலாம்.
- source_word: מִמִּצְרַיִם
  choice: எகிப்திலிருந்து
  rationale: מן முன்னிடைச்சொல்லையும் மִצְרַיִם இடப்பெயரையும் நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: הוּא וְאִשְׁתּוֹ
  choice: தன் மனைவியோடும்
  rationale: எபிரேய தனிப்பெயர்ச்சொல் ஆபிராமை மீண்டும் வலியுறுத்தினாலும், தமிழில் வினைமுற்று எழுவாயைத் தெளிவாக்குவதால் ‘தன் மனைவியோடும்’ என்பது இயல்பான நடை.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: தனக்கிருந்த அனைத்தோடும்
  rationale: உடைமைகள் மட்டுமல்லாமல் அவருக்குரிய அனைத்தையும் உள்ளடக்கக்கூடிய மூலமொழியின் பரந்த பொருளைச் சுருக்காமல் காக்கிறது.
- source_word: וְלוֹט עִמּוֹ
  choice: தன்னுடன் லோத்தையும் கூட்டிக்கொண்டு
  rationale: லோத்து ஆபிராமுடன் பயணித்தார் என்ற இணைப்பை இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַנֶּגְבָּה
  choice: நெகேபுக்கு
  rationale: נֶגֶב இங்கு தெற்கிலுள்ள குறிப்பிட்ட பிரதேசத்தின் பெயராகப் புரிந்துகொள்ளப்படலாம்; திசைவேற்றுமையை ‘-க்கு’ வெளிப்படுத்துகிறது. பொதுவான ‘தெற்கு நோக்கி’ என்ற பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
