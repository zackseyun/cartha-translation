translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரேய உரையில் இருமுறை வரும் ‘ஒன்றாகக் குடியிருக்க’ என்ற சொற்றொடர் வலியுறுத்தலைப் பாதுகாக்க இருமுறையும் தக்கவைக்கப்பட்டது. ‘அவர்கள்’ என்ற எபிரேயப் பன்மையின் சூழல்சார் குறிப்பு ஆபிராமும் லோத்தும் என்பதால், தமிழில் தெளிவுக்காக முதல் இடத்தில் ‘அவர்கள் இருவரும்’ என வழங்கப்பட்டது.
