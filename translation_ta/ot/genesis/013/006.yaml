  text: And the land could not support them living together, because their possessions were too great for them to live together.
translation:
  language: ta
  text: அவர்கள் இருவரும் ஒன்றாகக் குடியிருக்க அந்த நிலம் அவர்களைத் தாங்க முடியவில்லை; ஏனெனில், அவர்களுடைய உடைமைகள் மிகுதியாக இருந்ததால் அவர்களால் ஒன்றாகக் குடியிருக்க முடியவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשָׂא
  choice: தாங்க
  rationale: இங்கு நிலம் இரு குடும்பங்களையும் அவர்களின் கால்நடைகள் மற்றும் உடைமைகளுடன் ஆதரிக்கப் போதவில்லை என்ற பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: לָשֶׁבֶת
  choice: குடியிருக்க
  rationale: இந்தச் சூழலில் வெறுமனே ‘உட்கார’ என்பதல்ல, ஒரு பகுதியில் வாழ்ந்து தங்கியிருப்பதைக் குறிக்கிறது.
- source_word: רְכוּשָׁם
  choice: உடைமைகள்
  rationale: கால்நடைகள் உட்பட அவர்கள் சேர்த்திருந்த சொத்துகளைக் குறிக்கும் விரிவான, இயல்பான சொல்.
- source_word: רָב
  choice: மிகுதியாக
  rationale: உடைமைகளின் பெரும் அளவைத் தெரிவிக்கிறது; அதன் விளைவாக இருவரும் ஒரே இடத்தில் வாழ இயலவில்லை என்பதை அடுத்த வாக்கியம் தெளிவாக்குகிறது.
