base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/009.yaml
  text: Is not the whole land before you? Please separate from me. If you go to the left[a], then I will go to the right; and if you go to the right, then I will go to the left.
translation:
  language: ta
  text: நிலம் முழுவதும் உன் முன்னால் இருக்கிறதல்லவா? தயவுசெய்து என்னைவிட்டுப் பிரிந்து போ. நீ இடப்பக்கம் போனால்[a], நான் வலப்பக்கம் போவேன்; நீ வலப்பக்கம் போனால், நான் இடப்பக்கம் போவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நிபந்தனை வாக்கியங்கள் சுருக்கமாக, சொல்லுக்குச் சொல் ‘இடப்பக்கம் என்றால், நான் வலப்பக்கம் போவேன்; வலப்பக்கம் என்றால், நான் இடப்பக்கம் போவேன்’ என்று உள்ளன. தெளிவான தமிழுக்காக ‘நீ ... போனால்’ என்பது சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: இருக்கிறதல்லவா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் எபிரெய சொல்லாட்சியின் வினாவை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָל הָאָרֶץ
  choice: நாடு முழுவதும்
  rationale: இங்கு אָרֶץ என்பது முழு பூமியைக் குறிக்காமல், குடியேறுவதற்குக் கிடைத்திருந்த நிலப்பரப்பைக் குறிக்கிறது.
- source_word: לְפָנֶיךָ
  choice: உனக்கு முன்னால்
  rationale: லோத்துக்கு முன்பாக நிலம் விரிந்து கிடப்பதையும் அது அவனது தேர்வுக்கு இருப்பதையும் குறிக்கும் எபிரெய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: הִפָּרֶד נָא מֵעָלַי
  choice: தயவுசெய்து என்னைவிட்டுப் பிரிந்துபோ
  rationale: Niphal கட்டளையின் பிரிதல் கருத்தையும் נָא-வின் பணிவான வேண்டுகோளையும் தெளிவாகத் தருகிறது.
- source_word: אִם הַשְּׂמֹאל
  choice: நீ இடப்பக்கம் போனால்
  rationale: எபிரெயத்தில் வினைச்சொல் விடுபட்டுள்ளது; தெளிவான தமிழுக்காகச் சூழலிலிருந்து ‘போனால்’ சேர்க்கப்படுகிறது.
- source_word: וְאֵימִנָה
  choice: நான் வலப்பக்கம் போவேன்
  rationale: வலதுபுறத்தை நோக்கிய நகர்வைச் சுட்டும் திசை வடிவை இயல்பான தமிழில் தருகிறது.
- source_word: וְאִם הַיָּמִין
  choice: நீ வலப்பக்கம் போனால்
  rationale: இணையான நிபந்தனை அமைப்பில் விடுபட்ட இயக்க வினையைத் தமிழில் வெளிப்படையாகச் சேர்க்கிறது.
- source_word: וְאַשְׂמְאִילָה
  choice: நான் இடப்பக்கம் போவேன்
  rationale: ஆபிராமின் எதிர்த்திசை நகர்வைச் சமநிலையான இணை அமைப்பில் வெளிப்படுத்துகிறது.
