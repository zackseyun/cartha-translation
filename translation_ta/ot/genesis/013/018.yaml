base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/018.yaml
  text: So Abram moved his tent and came and settled by the oaks of Mamre[a], which are at Hebron[b], and there he built an altar to Yahweh.
translation:
  language: ta
  text: ஆபிராம் தன் கூடாரத்தைப் பெயர்த்து, எப்ரோனில் இருந்த மம்ரேயின் கருவாலி மரங்களருகே[a] வந்து குடியிருந்தார். அங்கே அவர் யாவேக்கு[b] ஒரு பலிபீடத்தைக் கட்டினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மம்ரேயின் டெரிபிந்த் மரங்களருகே.” எபிரெயச் சொல் கருவாலி அல்லது டெரிபிந்த் போன்ற பெரிய மரங்களைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் יהוה (YHWH) என்ற தனிப்பட்ட இறைப் பெயர் உள்ளது. இது இங்கே “யாவே” என ஒலிபெயர்க்கப்பட்டுள்ளது; “கர்த்தர்” என்றும் பாரம்பரியமாக மொழிபெயர்க்கப்படுகிறது.
    reason: divine_name
lexical_decisions:
- source_word: וַיֶּאֱהַל
  choice: தன் கூடாரத்தை இடம் மாற்றி
  rationale: אהל என்ற வினை கூடாரமிட்டு வாழ்வதையோ கூடாரத்தை வேறிடத்துக்கு நகர்த்துவதையோ குறிக்கிறது. முந்தைய சூழலிலும் தொடர்ந்து வரும் ‘வந்து குடியேறினார்’ என்பதுடனும் இயல்பாகப் பொருந்துவதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: வந்து குடியேறினார்
  rationale: இரண்டு எபிரெய வினைகளின் தொடர்ச்சியையும் காத்து, வருகையையும் அங்கே வசிக்கத் தொடங்கியதையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: மம்ரேயின் கருவாலி மரங்களருகே
  rationale: אֵלֹנֵי என்பது கருவாலி அல்லது டெரிபிந்த் போன்ற பெரிய மரங்களைக் குறிக்கக்கூடும். தெளிவான முதன்மை வாசகமாக ‘கருவாலி மரங்கள்’ வைக்கப்பட்டு, தாவர இனத்தின் உறுதியின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר בְּחֶבְרוֹן
  choice: எப்ரோனிலுள்ள
  rationale: இந்த உறவுத்தொடர் மம்ரேயின் மரங்கள் அமைந்திருந்த இடத்தைச் சுருக்கமாகவும் இயல்பாகவும் குறிப்பிடுகிறது.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: அங்கே அவர் ஒரு பலிபீடத்தைக் கட்டினார்
  rationale: שָׁם என்பதன் இடச் சுட்டுதலையும், מִזְבֵּחַ என்பதன் வழக்கமான ‘பலிபீடம்’ என்ற பொருளையும் நேரடியாகக் காக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப் பெயரான יהוה என்பதை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், தமிழில் ‘யாவே’ என ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல எபிரெய உரை நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதன் பெயர்த்தன்மையைப் பாதுகாக்க ‘யாவே’ எனக் கொடுக்கப்பட்டுள்ளது; சரியான பண்டைய உச்சரிப்பு முழு உறுதியுடன் அறியப்படவில்லை என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: אֵלֹנֵי என்பதில் மர இனத்தின் அடையாளம்
  choice: கருவாலி மரங்கள்
  alternative: டெரிபிந்த் மரங்கள்; பெரிய மரங்கள்
  rationale: சொல் கருவாலி அல்லது டெரிபிந்த் மரங்களைக் குறிக்கலாம். ஒரு குறிப்பிட்ட இனத்தை முழு உறுதியுடன் கூறாமல் மாற்று வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயக் கதைநடையின் செயல்வரிசை காக்கப்பட்டாலும், தமிழில் இயல்பாக அமைய வாக்கிய அமைப்பு சீராக்கப்பட்டுள்ளது.
