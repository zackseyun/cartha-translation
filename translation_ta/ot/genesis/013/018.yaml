revisions:
- from: ஆகவே ஆபிராம் தன் கூடாரத்தை இடம் மாற்றி, எப்ரோனிலுள்ள மம்ரேயின் கருவாலி மரங்களருகே[a] வந்து குடியேறினார். அங்கே அவர் யாவேக்கு[b] ஒரு பலிபீடத்தைக் கட்டினார்.
  to: ஆபிராம் தன் கூடாரத்தைப் பெயர்த்து, எப்ரோனில் இருந்த மம்ரேயின் கருவாலி மரங்களருகே[a] வந்து குடியிருந்தார். அங்கே அவர் யாவேக்கு[b] ஒரு பலிபீடத்தைக் கட்டினார்.
  rationale: The revision removes the unwarranted causal connective, uses a more idiomatic Tamil expression for moving a tent, and renders the residence verb more closely. It preserves the source's lexical ambiguity concerning the trees and the direct rendering of the divine name, with both footnote anchors retained.
