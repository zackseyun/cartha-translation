  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַֽ/יהוָ֞ה אָמַ֣ר אֶל אַבְרָ֗ם אַחֲרֵי֙ הִפָּֽרֶד ל֣וֹט מֵֽ/עִמּ֔/וֹ שָׂ֣א נָ֤א עֵינֶ֨י/ךָ֙ וּ/רְאֵ֔ה מִן הַ/מָּק֖וֹם אֲשֶׁר אַתָּ֣ה שָׁ֑ם צָפֹ֥נָ/ה וָ/נֶ֖גְבָּ/ה וָ/קֵ֥דְמָ/ה וָ/יָֽמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/014.yaml
  text: 'And Yahweh said to Abram[a], after Lot had separated from him, “Please lift up your eyes and look from the place where you are: northward and southward and eastward and westward.”'
translation:
  language: ta
  text: லோத்து ஆபிராமை விட்டுப் பிரிந்தபின், யாவே[a] ஆபிராமிடம், “தயவுசெய்து உன் கண்களை உயர்த்தி, நீ இருக்கும் இடத்திலிருந்து வடக்கு நோக்கியும் தெற்கு நோக்கியும் கிழக்கு நோக்கியும் மேற்கு நோக்கியும் பார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் יהוה (YHWH) என்ற இறைப் பெயர். அதன் பண்டைய உச்சரிப்பு துல்லியமாக அறியப்படவில்லை; இங்கு அது “யாவே” என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: மூல இறைப் பெயரையும் அதன் உச்சரிப்பிலுள்ள வரலாற்றுத் தெளிவின்மையையும் விளக்குதல்.
lexical_decisions:
- source_word: וַיהוָה
  choice: யாவே
  rationale: וְ குறிக்கும் கதைத் தொடர்ச்சி தமிழில் வாக்கிய அமைப்பாலும் முந்தைய சூழலாலும் இயல்பாக வெளிப்படுகிறது; יהוה என்ற தனிப்பட்ட இறைப் பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: אָמַר אֶל אַבְרָם
  choice: ஆபிராமிடம் … என்றார்
  rationale: எபிரெய உரையின் ‘ஆபிராமிடம் சொன்னார்’ என்ற பொருளை இயல்பான தமிழ் நேர்கூற்று அமைப்பில் தருகிறது.
- source_word: אַחֲרֵי הִפָּרֶד לוֹט מֵעִמּוֹ
  choice: லோத்து ஆபிராமைவிட்டுப் பிரிந்தபின்
  rationale: Niphal வடிவின் பிரிதல் பொருளையும், מֵעִמּוֹ யாரைக் குறிக்கிறது என்பதையும் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: שָׂא נָא עֵינֶיךָ
  choice: தயவுசெய்து உன் கண்களை உயர்த்தி
  rationale: שָׂא என்ற கட்டளையையும், நயப்படுத்தும் נָא துகளையும், ‘கண்களை உயர்த்துதல்’ என்ற மூல உருவகத்தையும் காக்கிறது.
- source_word: וּרְאֵה
  choice: பார்
  rationale: பார்வையைச் சுற்றியுள்ள நாட்டின்மேல் செலுத்தும்படி கூறும் கட்டளைக்கு இயல்பான தமிழ் வினை.
- source_word: מִן הַמָּקוֹם אֲשֶׁר אַתָּה שָׁם
  choice: நீ இருக்கிற இடத்திலிருந்து
  rationale: שָׁם என்பதன் இடப்பொருள் தமிழின் ‘இருக்கிற இடம்’ என்ற தொடரிலேயே அடங்குகிறது; ‘நிற்கிற’ என்று மூலத்தில் இல்லாத குறிப்பைச் சேர்க்கவில்லை.
- source_word: צָפֹנָה וָנֶגְבָּה וָקֵדְמָה וָיָמָּה
  choice: வடக்கேயும் தெற்கேயும் கிழக்கேயும் மேற்கேயும்
  rationale: திசைநோக்கைக் குறிக்கும் -ה வடிவங்களையும், மீண்டும் மீண்டும் வரும் இணைப்புகளின் விரிவான ஓசையையும் தமிழ் -ஏயும் தொடரால் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரையில் பொதுப்பட்டமல்ல, நான்கு மெய்யெழுத்துகளால் அமைந்த தனிப்பட்ட இறைப் பெயரே உள்ளது. ஆகவே அதை பட்டமாக மாற்றாமல் பரவலாக ஏற்கப்படும் ‘யாவே’ என்ற ஒலிபெயர்ப்பில் வழங்குகிறது; துல்லியமான பண்டைய உச்சரிப்பு முழுமையாக உறுதிப்படுத்தப்படவில்லை என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் மரியாதையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘கண்களை உயர்த்தி’ என்ற மூல உருவகம் காக்கப்பட்டுள்ளது; திசைகளின் நான்கு மடங்கு அமைப்பும் இயல்பான தமிழ் இணைப்புகளுடன் பாதுகாக்கப்பட்டுள்ளது.
