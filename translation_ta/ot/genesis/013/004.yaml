source:
  edition: WLC
  text: אֶל מְקוֹם֙ הַ/מִּזְבֵּ֔חַ אֲשֶׁר עָ֥שָׂה שָׁ֖ם בָּ/רִאשֹׁנָ֑ה וַ/יִּקְרָ֥א שָׁ֛ם אַבְרָ֖ם בְּ/שֵׁ֥ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/004.yaml
  text: to the place of the altar that he had made there at first[b][a]. And there Abram called on the name of Yahweh.
translation:
  language: ta
  text: முன்பு அங்கே அவர் அமைத்திருந்த பலிபீடம் இருந்த இடத்துக்கு; அங்கே ஆபிராம் யாவே[a]யின் நாமத்தைத் தொழுதுகொண்டார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: ‘YHWH’; மரபாக ‘கர்த்தர்’ என்று வழங்கப்படுகிறது. ‘யெகோவா’ என்பதும் ஒரு மாற்று வழங்கல்.'
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘யாவேயின் நாமத்தை அறிவித்தார்’ / ‘யாவேயை நாமம் சொல்லி வேண்டிக்கொண்டார்.’ இந்த எபிரெய மரபுத்தொடர் வேண்டுதலையும் அறிவித்தலையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹם הַמִּזְבֵּחַ
  choice: பலிபீடம் இருந்த இடம்
  rationale: இது முன்பு ஆபிராம் அமைத்த பலிபீடத்தின் குறிப்பிட்ட இடத்தைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க இவ்வாறு வழங்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר עָשָׂה שָׁם
  choice: அவர் அங்கே அமைத்திருந்த
  rationale: עָשָׂה என்பதன் அடிப்படைப் பொருள் ‘செய்தார்’; பலிபீடத்தைப் பற்றிய சூழலில் ‘அமைத்தார்’ இயல்பானது. முந்தைய செயலைக் காட்ட ‘அமைத்திருந்த’ என்று வழங்கப்பட்டுள்ளது.
- source_word: בָּרִאשֹׁנָה
  choice: முதலில்
  rationale: ஆபிராம் இதற்கு முன்பு அந்த இடத்தில் இருந்த காலத்தையும் அப்போது பலிபீடத்தை அமைத்ததையும் சுருக்கமாகக் குறிக்கிறது.
- source_word: וַיִּקְרָא ... בְּשֵׁם יְהוָה
  choice: யாவே என்னும் பெயரைச் சொல்லி அழைத்தார்
  rationale: இந்த எபிரெய மரபுத்தொடர் வேண்டுதல், வழிபாட்டுடன் அழைத்தல், பெயரை அறிவித்தல் ஆகிய பொருள் நிழல்களைக் கொண்டிருக்க முடியும். தமிழில் புரியும்படியாகவும் அந்த விரிவை முற்றிலும் ஒடுக்காமலும் இவ்வாறு வழங்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பொதுப் பட்டத்தால் மாற்றாமல், அதன் பரவலான ஒலிபெயர்ப்பை முதன்மை உரையில் பயன்படுத்துகிறது.
- source_word: אַבְרָם
  choice: ஆபிராம்
  rationale: தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக வருகிறது. ஆகவே பட்டப்பெயரைப் பதிலிடாமல் ‘யாவே’ என வழங்கி, மற்ற மரபுகளை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- issue: קרא בשם יהוה என்ற மரபுத்தொடரின் பொருள்
  choice: யாவே என்னும் பெயரைச் சொல்லி அழைத்தார்
  alternative: யாவேயின் பெயரை அறிவித்தார்; யாவேயைப் பெயரிட்டு வேண்டிக்கொண்டார்
  rationale: மரபுத்தொடர் வேண்டுதல் அல்லது வழிபாட்டுடன் அழைத்தல் மட்டுமன்றி அறிவித்தல் என்ற நிழலையும் கொண்டிருக்கலாம். முதன்மை மொழிபெயர்ப்பு ஒரு பொருளை மிகக் குறுகலாக நிர்ணயிக்காமல் இருக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமையும் நடை பயன்படுத்தப்பட்டுள்ளது. ஆபிராமைக் குறிக்கும் வினைகளில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வசனத்திலிருந்து தொடரும் இடச்சொற்றொடரால் தொடங்குவதால், தமிழில் முழுமையான வாக்கியமாக அமைய ‘வந்தார்’ என்பது சூழலிலிருந்து வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
