revisions:
- from: அவர் முதலில் அங்கே அமைத்திருந்த பலிபீடம் இருந்த இடத்துக்கு வந்தார். அங்கே ஆபிராம் யாவே[a] என்னும் பெயரைச் சொல்லி அழைத்தார்[b].
  to: முன்பு அங்கே அவர் அமைத்திருந்த பலிபீடம் இருந்த இடத்துக்கு; அங்கே ஆபிராம் யாவே[a]யின் நாமத்தைத் தொழுதுகொண்டார்[b].
  rationale: முந்தைய வசனத்திலிருந்து ஊகிக்கப்பட்ட இயக்க வினை நீக்கப்பட்டு, மூலத்தின் தொடர்ச்சியான இடச்சொற்றொடர் காக்கப்பட்டுள்ளது. «முன்பு» என்பது முந்தைய வருகையைத் தெளிவாகக் காட்டுகிறது. கרא בשם יהוה என்பதற்கு வழிபாட்டு-வேண்டுதல் சூழலைத் தரும் இயல்பான தமிழ் வழங்கல் முதன்மை உரையில் பயன்படுத்தப்பட்டு, அறிவித்தல் மற்றும் வேண்டுதல் என்ற மாற்று நிழல்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
