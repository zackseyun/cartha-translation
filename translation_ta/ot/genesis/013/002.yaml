  text: Abram was very wealthy in livestock[a], silver, and gold.
translation:
  language: ta
  text: ஆபிராம் கால்நடைகளிலும் வெள்ளியிலும் தங்கத்திலும் மிகவும் செல்வந்தராக இருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும், ஆபிராம் கால்நடைகளிலும் வெள்ளியிலும் தங்கத்திலும் மிகவும் செல்வந்தராக இருந்தார்.”
    reason: எபிரெய வாக்கியத்தின் தொடக்கத்திலுள்ள וְ என்பது முந்தைய நிகழ்வோட்டத்துடன் இணைக்கும் தொடர்ச்சிக் குறியாகும்; தமிழில் அதைச் சூழலுக்கு ஏற்ப வெளிப்படையாக விடலாம் அல்லது ‘மேலும்’ என மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: ஆபிராம்
  rationale: וְ என்பது முந்தைய நிகழ்வுடன் இணைக்கும் தொடர்ச்சிக் குறி. தனி வசனமாக இயல்பான நவீன தமிழில் தேவையற்ற ‘மேலும்’ என்பதைச் சேர்க்காமல், பெயரை நேரடியாகத் தொடக்கமாக வைத்துள்ளது.
- source_word: כָּבֵד מְאֹד
  choice: மிகவும் செல்வந்தராக
  rationale: כָּבֵד என்பதன் அடிப்படைப் பொருள் ‘கனமானவர்’; ஆனால் உடைமைகளின் பட்டியலுடன் வரும் இச்சூழலில் அது பெரும் செல்வத்தைக் குறிக்கும் மரபுத்தொடர். מְאֹד தரும் தீவிரத்தை ‘மிகவும்’ வெளிப்படுத்துகிறது.
- source_word: בַּ/מִּקְנֶה
  choice: கால்நடைகளிலும்
  rationale: מִקְנֶה இங்கு மந்தைகள் மற்றும் வீட்டில் வளர்க்கப்படும் விலங்குகள் உள்ளிட்ட கால்நடைச் செல்வத்தைக் குறிக்கிறது. בְּ குறிக்கும் செல்வத்தின் துறையை ‘-இலும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּ/כֶּסֶף
  choice: வெள்ளியிலும்
  rationale: כֶּסֶף என்பது இங்கு வெள்ளி என்ற மதிப்புமிக்க உலோகத்தைக் குறிக்கிறது; இணையான பட்டியல் அமைப்பை ‘-இலும்’ காக்கிறது.
- source_word: וּ/בַ/זָּהָב
  choice: தங்கத்திலும்
  rationale: זָהָב என்பதற்கு ‘தங்கம்’ என்பது நேரான நவீனத் தமிழ் இணை. וּ மற்றும் בְּ ஆகியவற்றின் பட்டியல் சார்ந்த இணைப்பை ‘-த்திலும்’ ஒருங்கிணைத்து வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய மரபுத்தொடரான ‘மிகவும் கனமானவர்’ என்பது தவறாகப் புரியாதபடி, அதன் சூழல்சார் பொருளான ‘மிகவும் செல்வந்தர்’ என மொழிபெயர்க்கப்பட்டுள்ளது; மூன்று செல்வ வகைகளின் இணை அமைப்பு காக்கப்பட்டுள்ளது.
