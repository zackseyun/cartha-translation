base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/003.yaml
  text: And he journeyed by stages from the Negev as far as Bethel[a], to the place where his tent had been at the beginning, between Bethel and Ai.
translation:
  language: ta
  text: அவன் நெகேபிலிருந்து பயணக் கட்டங்களாகச் சென்று, பெத்தேல்வரை, தொடக்கத்தில் அவனுடைய கூடாரம் இருந்த பெத்தேலுக்கும் ஆயிக்கும் இடையிலுள்ள அந்த இடத்துக்கு வந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: சென்றான்
  rationale: הלך என்பது பொதுவாகச் ‘செல்’ எனப் பொருள்படும்; பயணப் பாதையைக் கூறும் இச்சூழலில், ‘பயணம் செய்து ... சென்றான்’ என்பது தொலைவைக் கடந்த இயக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְמַסָּעָיו
  choice: கட்டங்கட்டமாகப் பயணம் செய்து
  rationale: מַסָּע என்பது முகாமைக் கலைத்துப் புறப்படும் பயணத்தையோ பயணத்தின் ஒரு கட்டத்தையோ குறிக்கிறது. பன்மை வடிவம் அடுத்தடுத்த பயணக் கட்டங்களைக் குறிப்பதால், ‘கட்டங்கட்டமாக’ என்பது அந்த முறையைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִנֶּגֶב
  choice: நெகேபிலிருந்து
  rationale: נֶגֶב என்பதற்கு ‘தெற்கு’ என்றும் நெகேப் நிலப்பகுதி என்றும் பொருள் உண்டு. முற்பிதாக்களின் புவியியல் சூழலில் குறிப்பிட்ட நிலப்பகுதியே இங்கு பொருத்தமானது.
- source_word: וְעַד בֵּית אֵל
  choice: பெத்தேல்வரை
  rationale: עַד பயணத்தின் எல்லையையோ சென்றடைந்த அளவையையோ குறிக்கிறது; ‘-வரை’ அதைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: עַד הַמָּקוֹם
  choice: இடம்வரை
  rationale: இரண்டாவது עַד, பெத்தேல் என்ற பொதுவான இலக்குக்குள் குறிப்பிட்ட இடத்தை மேலும் துல்லியமாக அடையாளப்படுத்துகிறது.
- source_word: אֲשֶׁר הָיָה שָׁם אהל/ה
  choice: அவனுடைய கூடாரம் இருந்த இடம்
  rationale: இந்தத் தொடர்புச் சொற்றொடர் ஆபிராமின் கூடாரம் முன்பு இருந்த இடத்தைக் குறிக்கிறது. שָׁם என்பதன் இடப்பொருள் தமிழில் ‘இருந்த இடம்’ என்பதற்குள் இயல்பாக அடங்குகிறது.
- source_word: בַּתְּחִלָּה
  choice: தொடக்கத்தில்
  rationale: இது ஆபிராம் முன்பு முகாமிட்டிருந்த நிகழ்வைத் திரும்பச் சுட்டுகிறது; ‘தொடக்கத்தில்’ அதன் காலக் குறிப்பை நேரடியாகப் பாதுகாக்கிறது.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעָי
  choice: பெத்தேலுக்கும் ஆயிக்கும் இடையே
  rationale: בֵּין ... וּבֵין இரு இடங்களுக்கு நடுவிலான இருப்பிடத்தைக் குறிக்கிறது. הָעָי என்பது ‘ஆயி’ என்ற இடப்பெயர்; எபிரெய முன்னொட்டு தனியான சுட்டுச் சொல்லாக மொழிபெயர்க்கப்படவில்லை.
