source:
  edition: WLC
  text: וַ/יִּבְחַר ל֣/וֹ ל֗וֹט אֵ֚ת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן וַ/יִּסַּ֥ע ל֖וֹט מִ/קֶּ֑דֶם וַ/יִּפָּ֣רְד֔וּ אִ֖ישׁ מֵ/עַ֥ל אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/011.yaml
  text: So Lot chose for himself all the plain of the Jordan[a], and Lot journeyed eastward; and they separated from each other.
translation:
  language: ta
  text: அப்போது லோத்து யோர்தான் சமவெளி முழுவதையும் தனக்காகத் தேர்ந்தெடுத்தான்; லோத்து கிழக்கு நோக்கிப் புறப்பட்டான்[a]. அவர்கள் ஒருவரைவிட்டு ஒருவர் பிரிந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிழக்கிலிருந்து.” எபிரேயச் சொற்றொடர் பயணத்தின் திசையையோ அதன் தொடக்க இடத்தையோ குறிக்கலாம்.
    reason: மִקֶּדֶם என்பதன் திசை மற்றும் தோற்றப்புள்ளி ஆகிய இரு சாத்தியமான பொருள்களையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: தனக்காகத் தேர்ந்தெடுத்துக்கொண்டு
  rationale: בחר என்பதன் ‘தேர்ந்தெடு’ என்ற பொருளையும், לוֹ என்பதன் தன்நலச் சார்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: யோர்தான் ஆற்றின் சமவெளி முழுவதையும்
  rationale: כִּכָּר என்பது இப்புவியியல் சூழலில் யோர்தானைச் சுற்றியுள்ள தாழ்வான சமவெளிப் பகுதியைக் குறிக்கிறது; ‘ஆற்றின்’ என்பது தமிழ் வாசகருக்கு யோர்தான் என்ற பெயரைத் தெளிவுபடுத்துகிறது.
- source_word: וַיִּסַּע
  choice: பயணப்பட்டான்
  rationale: נסע முகாமைப் பெயர்த்துப் புறப்பட்டுச் செல்வதைக் குறிக்கிறது; இங்கு ‘பயணப்பட்டான்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: מִקֶּדֶם
  choice: கிழக்கு நோக்கி
  rationale: சூழலில் பயணத்தின் திசையைக் குறிக்கும் வாசிப்பை முதன்மை உரையில் தருகிறது; ‘கிழக்கிலிருந்து’ என்ற இலக்கணரீதியாகச் சாத்தியமான வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּפָּרְדוּ
  choice: பிரிந்தார்கள்
  rationale: פרד என்பதன் நிஃபால் வடிவிலுள்ள பரஸ்பரப் பிரிவைத் தெளிவாகக் காட்டுகிறது.
- source_word: אִישׁ מֵעַל אָחִיו
  choice: ஒருவரைவிட்டு ஒருவர்
  rationale: எபிரெயச் சொற்றொடரின் பகிர்ந்தளிக்கும் பரஸ்பரப் பொருளை இயல்பான நவீன தமிழில் தருகிறது; நேரடியான ‘தன் சகோதரனைவிட்டு ஒவ்வொருவனும்’ என்பது இச்சூழலில் செயற்கையாக ஒலிக்கும்.
theological_decisions:
- issue: מִקֶּדֶם என்பதன் திசை சார்ந்த இருபொருள்
  choice: கிழக்கு நோக்கி
  alternative: கிழக்கிலிருந்து
  rationale: ஆபிராம்–லோத்து நிகழ்வின் புவியியல் ஓட்டத்தில் ‘கிழக்கு நோக்கி’ என்பது பொருத்தமானது; இருப்பினும் மூல மொழியின் மாற்று வாய்ப்பு அடிக்குறிப்பில் விடப்படாமல் தரப்படுகிறது.
- issue: אִישׁ מֵעַל אָחִיו என்பதிலுள்ள ஆண்பால் உறவுமுறை மொழி
  choice: ஒருவரைவிட்டு ஒருவர்
  alternative: ஒவ்வொருவனும் தன் சகோதரனைவிட்டு
  rationale: இங்கு சொற்றொடரின் நோக்கம் இருவரின் பரஸ்பரப் பிரிவைச் சொல்வதே. இயல்பான தமிழ் அந்தப் பொருளைத் துல்லியமாகத் தருகிறது; தனிப்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும் இயல்பான, கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘யோர்தான் ஆறு’ என்று தெளிவுபடுத்தப்பட்டு, மூலத்தின் உண்மையான இருபொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
