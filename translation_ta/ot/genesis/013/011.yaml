revisions:
- from: ஆகவே லோத்து யோர்தான் ஆற்றின் சமவெளி முழுவதையும் தனக்காகத் தேர்ந்தெடுத்துக்கொண்டு, கிழக்கு நோக்கிப் பயணப்பட்டான்[a]. இவ்வாறு அவர்கள் ஒருவரைவிட்டு ஒருவர் பிரிந்தார்கள்.
  to: அப்போது லோத்து யோர்தான் சமவெளி முழுவதையும் தனக்காகத் தேர்ந்தெடுத்தான்; லோத்து கிழக்கு நோக்கிப் புறப்பட்டான்[a]. அவர்கள் ஒருவரைவிட்டு ஒருவர் பிரிந்தனர்.
  rationale: The revision restores the Hebrew sequence of two finite actions, uses natural modern Tamil for Lot’s departure, and retains the source ambiguity of מִקֶּדֶם in a correctly anchored footnote. The final reciprocal expression is idiomatic Tamil and accurately communicates the separation of the two men.
