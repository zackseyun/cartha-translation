  yaml_path: translation/ot/genesis/027/017.yaml
  text: Then she put the tasty food and the bread that she had made into the hand of Jacob her son[a].
translation:
  language: ta
  text: பின்பு, தான் செய்த சுவையான உணவையும் அப்பத்தையும் தன் மகன் யாக்கோபின் கையில் கொடுத்தாள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தன் மகன் யாக்கோபின் கையில்”; இது அவனிடம் நேரடியாகக் கொடுத்தாள் என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: பின்பு ... கொடுத்தாள்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. נתן என்பதற்கு இச்சூழலில் ‘கொடுத்தாள்’ என்பது இயல்பான தமிழ்; בְּיַד உடன் வரும் கையின் உருவகமும் தனியே பாதுகாக்கப்படுகிறது.
- source_word: הַמַּטְעַמִּים
  choice: சுவையான உணவு
  rationale: உடனடிச் சூழலில் சிறப்பாகத் தயாரிக்கப்பட்ட சுவைமிக்க உணவைக் குறிக்கிறது. ‘சுவையான உணவு’ என்பது நவீன தமிழில் இயல்பாகவும், உணவின் வகையை மூலத்தைவிடக் குறுகச் செய்யாமலும் உள்ளது.
- source_word: הַלֶּחֶם
  choice: அப்பம்
  rationale: לֶחֶם என்பதற்கான நேரான, வேதாகமச் சூழலிலும் பொதுமக்கள் புரிந்துகொள்ளத்தக்க தமிழாக்கம்.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: தான் செய்த
  rationale: செயலைக் குறிக்கும் עשה-ஐ நேரடியாகத் தருகிறது; ‘தான்’ என்பது அதைச் செய்தவள் ரெபெக்காளே என்பதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் இணைக்கிறது.
- source_word: בְּיַד
  choice: கையில்
  rationale: எபிரெய உரையின் ஒருமை ‘கை’ என்ற உடல் சார்ந்த தெளிவான வெளிப்பாட்டைப் பாதுகாக்கிறது; தமிழில் ‘கையில் கொடுத்தாள்’ என்பது நேரடியாக ஒப்படைத்தாள் என்ற இயல்பான மரபுத்தொடர்.
- source_word: יַעֲקֹב בְּנָהּ
  choice: தன் மகன் யாக்கோபின்
  rationale: தமிழின் இயல்பான சொல் வரிசைக்காக உறவுமுறையைப் பெயருக்கு முன் வைத்து, ‘அவளுடைய மகன்’ என்ற எபிரெயப் பொருளை ‘தன் மகன்’ எனத் தெளிவாகத் தருகிறது.
