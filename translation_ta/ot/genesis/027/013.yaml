  text: וַ/תֹּ֤אמֶר ל/וֹ֙ אִמּ֔/וֹ עָלַ֥/י קִלְלָתְ/ךָ֖ בְּנִ֑/י אַ֛ךְ שְׁמַ֥ע בְּ/קֹלִ֖/י וְ/לֵ֥ךְ קַֽח לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/013.yaml
  text: His mother said to him[a], “Your curse be on me, my son. Only listen to my voice, and go[b], get them for me.”
translation:
  language: ta
  text: அவனுடைய தாய் அவனிடம், “என் மகனே, உனக்கு வரும் சாபம் என்மேல் வரட்டும். ஆனால், என் சொல்லைக் கேள்; போய் அவற்றை எனக்காகக் கொண்டுவா[a]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவற்றை” என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட ஆட்டுக்குட்டிகளைக் குறிக்கிறது; எபிரெய மூலத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை.
    reason: cross_reference
lexical_decisions:
- source_word: וַתֹּאמֶר לֹו אִמּוֹ
  choice: அவனுடைய தாய் அவனிடம் ... என்றாள்
  rationale: எபிரெயக் கதைநடையின் இயல்பான சொற்கட்டமைப்பை நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: עָלַי קִלְלָתְךָ
  choice: உனக்கு வரும் சாபம் என்மேல் வரட்டும்
  rationale: இரண்டாம் நபர் பின்னொட்டுள்ள ‘உன் சாபம்’ என்பது சூழலில் யாக்கோபுக்கு வரக்கூடிய சாபத்தைக் குறிக்கிறது; அதன் விளைவைத் தாய் ஏற்றுக்கொள்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּנִי
  choice: என் மகனே
  rationale: உறவையும் அழைப்பின் உணர்வையும் காக்கும் இயல்பான விளிவேற்றுமை வடிவம்.
- source_word: אַךְ
  choice: நீ ... கேட்டு
  rationale: இங்கு கட்டுப்படுத்தும் வலியுறுத்தல் உள்ளது; தனியாக ‘மட்டும்’ சேர்ப்பது தமிழில் செயற்கையாக அமையக்கூடும் என்பதால் கட்டளையின் நேரடியான அமைப்பில் அதன் வலிமை வெளிப்படுகிறது.
- source_word: שְׁמַע בְּקֹלִי
  choice: என் சொல்லைக் கேட்டு
  rationale: சொல்லுக்கு நெருக்கமாக ‘என் குரலைக் கேள்’ எனலாம்; ஆனால் இச்சூழலில் கீழ்ப்படிதல் என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் ‘என் சொல்லைக் கேள்’ தக்கவைக்கிறது.
- source_word: וְלֵךְ קַח לִי
  choice: போய் அவற்றை எனக்காகக் கொண்டுவா
  rationale: முந்தைய வசனத்திலுள்ள ஆட்டுக்குட்டிகள் செயப்படுபொருளாக மறைமுகமாக உள்ளன. தமிழில் தெளிவுக்காக ‘அவற்றை’ சேர்க்கப்பட்டுள்ளது; சூழலில் அவற்றைத் தாயிடம் கொண்டுவருவதே நோக்கம்.
theological_decisions:
- issue: ரெபெக்காள் சாபத்தைத் தானே ஏற்றுக்கொள்வதாகக் கூறும் மொழியின் வலிமை
  choice: உனக்கு வரும் சாபம் என்மேல் வரட்டும்
  alternative: உன் சாபம் என்மேல்
  rationale: இது அவளுடைய கூற்றை ஒழுக்கரீதியாக விளக்கவோ மென்மைப்படுத்தவோ செய்யாமல், சாபத்தின் விளைவைத் தானே ஏற்கும் உறுதியைத் தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கதைநடைக்கு ஏற்ற கண்ணியமான, எளிதில் புரியும் நடை. எபிரெய மரபுத்தொடர் தமிழில் இயல்பாக ‘என் சொல்லைக் கேட்டு’ என வழங்கப்பட்டது.
