translation_notes:
  register: நவீன நிலையான தமிழ்; இயல்பானதும் கண்ணியமானதும். எபிரெயப் பெயரெச்சத்தின் தொடர்நிலையும், ஒரே நேரத்தில் நிகழும் செயல்களும் பாதுகாக்கப்பட்டுள்ளன. ‘வேட்டைப் பொருள்’ என்பது மான் இறைச்சி போன்ற தேவையற்ற குறுக்கத்தைத் தவிர்க்கிறது.
