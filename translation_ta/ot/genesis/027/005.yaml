reference: Genesis 27:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/רִבְקָ֣ה שֹׁמַ֔עַת בְּ/דַבֵּ֣ר יִצְחָ֔ק אֶל עֵשָׂ֖ו בְּנ֑/וֹ וַ/יֵּ֤לֶךְ עֵשָׂו֙ הַ/שָּׂדֶ֔ה לָ/צ֥וּד צַ֖יִד לְ/הָבִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/005.yaml
  text: Rebekah was listening when Isaac spoke to Esau his son[b][a], and Esau went to the field to hunt game and bring it back.
translation:
  language: ta
  text: ரெபெக்காள் கேட்டுக்கொண்டிருந்தாள்; ஈசாக்கு தன் மகன் ஏசாவிடம் பேசிக்கொண்டிருந்தான். ஏசா வேட்டையாடி, வேட்டைப் பொருளைக் கொண்டுவர வயல்வெளிக்குச் சென்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/רִבְקָה
  choice: ரெபெக்காள்
  rationale: வாவ் இணைப்புச் சொல் இங்கு கதைத் தொடர்ச்சியைக் குறிக்கிறது; தனியாக ‘இப்போது’ என்று சேர்க்காமல், தமிழில் இயல்பான வாக்கியத் தொடக்கமாக விடப்பட்டுள்ளது.
- source_word: שֹׁמַעַת
  choice: கேட்டுக்கொண்டிருந்தாள்
  rationale: பெண்பால் ஒருமை நிகழ்காலப் பெயரெச்சம் பின்னணியில் நீடித்த செயலைக் காட்டுவதால், தொடர்நிலை இறந்தகாலமாக மொழிபெயர்க்கப்பட்டது.
- source_word: בְּ/דַבֵּר
  choice: பேசிக்கொண்டிருந்ததை
  rationale: בְּ உடன் வரும் infinitive construct, ரெபெக்காள் கேட்டுக்கொண்டிருந்த செயலுடன் ஈசாக்கின் பேச்சு ஒரே நேரத்தில் நடந்ததை உணர்த்துகிறது.
- source_word: אֶל־עֵשָׂו בְּנוֹ
  choice: தன் மகன் ஏசாவிடம்
  rationale: אֶל பேச்சின் நோக்குநபரைச் சுட்டுகிறது; בנוֹ ஈசாக்கின் மகன் என்பதைத் தெளிவுபடுத்துகிறது. தமிழில் இயல்பாக ‘தன் மகன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַ/יֵּלֶךְ
  choice: சென்றான்
  rationale: கதைநடையில் הלך குறிக்கும் எளிய நகர்வை நேரடியாகத் தருகிறது.
- source_word: הַ/שָּׂדֶה
  choice: வயல்வெளிக்கு
  rationale: שׂדה என்பது வயல் அல்லது திறந்த வெளி நாட்டைக் குறிக்கலாம்; வேட்டையின் சூழலில் ‘வயல்வெளி’ இரு நுணுக்கங்களையும் இயல்பாகத் தாங்குகிறது.
- source_word: לָ/צוּד צַיִד
  choice: வேட்டையாடி, வேட்டைப் பொருளை
  rationale: צוד செயல் வேட்டையாடுதலையும் ציד வேட்டையில் கிடைக்கும் விலங்கு அல்லது இரையையும் குறிக்கிறது; குறிப்பிட்ட விலங்கினத்தைச் சேர்க்காமல் பொதுப்பொருள் காக்கப்பட்டுள்ளது.
- source_word: לְ/הָבִיא
  choice: கொண்டுவருவதற்காக
  rationale: இரண்டாவது infinitive நோக்கத்தைக் குறிக்கிறது; ‘திரும்ப’ என்று மூலத்தில் இல்லாத சொல்லைச் சேர்க்காமல் கொண்டுவரும் நோக்கம் வெளிப்படுத்தப்பட்டுள்ளது.
