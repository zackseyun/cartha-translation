  register: நவீன பொதுத்தமிழில் தெளிவாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘அவள்’ மற்றும் ‘அவன்’ என்ற மூலத்தின் சுட்டுப்பெயர்கள் அப்படியே வைக்கப்பட்டுள்ளன; முந்தைய வசனச் சூழலை மொழிபெயர்ப்புக்குள் விளக்கமாகச் சேர்க்கவில்லை.
