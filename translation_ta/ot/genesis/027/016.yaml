  yaml_path: translation/ot/genesis/027/016.yaml
  text: And she put the skins of the young goats on his hands and on the smooth part of his neck.
translation:
  language: ta
  text: வெள்ளாட்டுக் குட்டிகளின் தோல்களை அவள் அவனுடைய கைகளிலும், அவனுடைய கழுத்தின் மென்மையான பகுதியிலும் போர்த்தினாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹרֹת
  choice: தோல்களை
  rationale: இது விலங்குகளிலிருந்து உரிக்கப்பட்ட தோல்களைக் குறிக்கும் பன்மைச் சொல்; இச்சூழலில் இயல்பான, நேரடியான தமிழ்ச் சொல்.
- source_word: גְּדָיֵי הָעִזִּים
  choice: வெள்ளாட்டுக் குட்டிகளின்
  rationale: எபிரெயச் சொற்றொடர் வெள்ளாடுகளின் இளம் குட்டிகளைக் குறிக்கிறது; தமிழில் ‘வெள்ளாட்டுக் குட்டிகள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הִלְבִּישָׁה
  choice: போர்த்திவிட்டாள்
  rationale: Hiphil வடிவம் ஒருவர்மேல் ஒன்றை அணிவித்தல் அல்லது போர்த்துதல் என்பதைக் குறிக்கிறது. உடற்பகுதிகள்மேல் தோல்களை வைத்துக் கட்டிய இச்சூழலில் ‘போர்த்திவிட்டாள்’ இயல்பாகப் பொருளைத் தருகிறது.
- source_word: עַל יָדָיו
  choice: அவனுடைய கைகளிலும்
  rationale: עַל என்பதன் இடப்பொருளை ‘கைகளில்’ இயல்பாக வெளிப்படுத்துகிறது; தொடரும் இணை அமைப்புக்காக ‘-உம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: חֶלְקַת צַוָּארָיו
  choice: அவனுடைய கழுத்தின் வழவழப்பான பகுதியிலும்
  rationale: חֶלְקַת என்பது மிருதுவான அல்லது முடி இல்லாத பகுதியைக் குறிக்கிறது. ‘வழவழப்பான பகுதி’ என்பது ஏசாவின் முடிநிறைந்த தோற்றத்தைப் பின்பற்றச் செய்யப்பட்ட செயலை விளக்கவுரை சேர்க்காமல் தெளிவாகக் காட்டுகிறது.
