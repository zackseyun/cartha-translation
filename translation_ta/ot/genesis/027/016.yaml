- from: வெள்ளாட்டுக் குட்டிகளின் தோல்களை அவள் அவனுடைய கைகளிலும், அவனுடைய கழுத்தின் வழவழப்பான பகுதியிலும் போர்த்திவிட்டாள்.
  to: வெள்ளாட்டுக் குட்டிகளின் தோல்களை அவள் அவனுடைய கைகளிலும், அவனுடைய கழுத்தின் மென்மையான பகுதியிலும் போர்த்தினாள்.
