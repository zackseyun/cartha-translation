  text: וַ/יֹּ֨אמֶר עֵשָׂ֜ו אֶל אָבִ֗י/ו הַֽ/בְרָכָ֨ה אַחַ֤ת הִֽוא לְ/ךָ֙ אָבִ֔/י בָּרֲכֵ֥/נִי גַם אָ֖נִי אָבִ֑/י וַ/יִּשָּׂ֥א עֵשָׂ֛ו קֹל֖/וֹ וַ/יֵּֽבְךְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/038.yaml
  text: Esau said to his father[a], “Do you have only one blessing, my father? Bless me too, my father!” Then Esau raised his voice and wept.
translation:
  language: ta
  text: ஏசா தன் தந்தையிடம், “என் தந்தையே, உங்களிடம் ஒரே ஒரு ஆசீர்வாதம்தான் இருக்கிறதா?[a] என் தந்தையே, என்னையும் ஆசீர்வதியுங்கள்!” என்றான். பின்பு ஏசா சத்தமிட்டு அழுதான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “ஆசீர்வாதம் உங்களிடம் ஒன்றுதானா, என் தந்தையே?” ஈசாக்கால் வழங்க முடிந்தது ஒரே ஓர் ஆசீர்வாதம்தானா என்ற ஏசாவின் வேதனையை எபிரெயச் சொற்றொடர் வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרָכָה אַחַת הִוא לְךָ
  choice: உங்களிடம் ஒரே ஒரு ஆசீர்வாதம்தான் இருக்கிறதா?
  rationale: எபிரெய உரை வினைச்சொல் இல்லாத கேள்வி வாக்கியம்; ஈசாக்கிடம் வழங்குவதற்கு ஒரே ஆசீர்வாதம்தான் உள்ளதா என்ற ஏசாவின் வேதனையும் அதிர்ச்சியும் இயல்பான நவீன தமிழில் வெளிப்படுகிறது.
- source_word: אָבִי
  choice: என் தந்தையே
  rationale: முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டைத் தெளிவாகக் காட்டுவதோடு, இரு இடங்களிலும் உள்ள அழைப்பையும் உணர்ச்சிமிக்க வேண்டுதலையும் மீளுருவாக்குகிறது.
- source_word: בָּרֲכֵנִי
  choice: என்னை ஆசீர்வதியுங்கள்
  rationale: ברך என்பதன் நேரடி கட்டளை வடிவத்தையும் முதலாம் நபர் ஒருமைப் பொருள் பின்னொட்டையும் கண்ணியமான நவீன தமிழில் நேரடியாக வழங்குகிறது.
- source_word: גַּם אָֽנִי
  choice: என்னையும்
  rationale: யாக்கோபுடன் சேர்த்து தானும் ஆசீர்வதிக்கப்பட வேண்டும் என்ற ஏசாவின் வேண்டுகோளை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: וַיִּשָּׂא ... קֹלוֹ
  choice: சத்தமிட்டு
  rationale: சொல்லுக்கு சொல் 'தன் குரலை உயர்த்தினான்' என்றாலும், அழுகையுடன் சேர்ந்த இந்த எபிரெய மரபுத்தொடர் உரக்க அழுதலைக் குறிக்கிறது; 'சத்தமிட்டு அழுதான்' என்பது இயல்பான தமிழ் இணைவு.
- source_word: וַיֵּבְךְּ
  choice: அழுதான்
  rationale: வினைச்சொல் கண்ணீருடன் அழுதலைக் குறிக்கிறது; தமிழில் நேரடியான, துல்லியமான சொல்.
- source_word: עֵשָׂו
  choice: ஏசா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
