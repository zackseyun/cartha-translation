  terminology: ‘ஆசீர்வாதம்,’ ‘என் தந்தையே,’ and the established Tamil biblical name form ‘ஏசா’ are suitable and consistent. The footnote appropriately identifies the verbless Hebrew construction and its rhetorical force.
