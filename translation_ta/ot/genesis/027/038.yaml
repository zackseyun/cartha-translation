translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தந்தையை நேரடியாக அழைக்கும் אָבִי என்பதற்கு உணர்ச்சியும் மரியாதையும் காக்க ‘என் தந்தையே’ என்றும், உரக்கப் புலம்பியதை இயல்பாகக் காட்ட ‘சத்தமிட்டு அழுதான்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
