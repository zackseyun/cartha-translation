  text: Now[a], my son, listen to my voice, and arise, flee to my brother Laban in Haran.
translation:
  language: ta
  text: இப்போது[a], என் மகனே, என் குரலுக்குச் செவிகொடு; எழுந்து, ஆரானிலுள்ள என் சகோதரன் லாபானிடம் தப்பியோடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மேலும், இப்போது, என் மகனே, என் குரலுக்குச் செவிகொடு; எழுந்து, ஆரானிலுள்ள என் சகோதரன் லாபானிடம் உனக்காகத் தப்பியோடு.’
    reason: וְעַתָּה என்பதிலுள்ள இணைப்பையும் בְּרַח לְךָ என்பதிலுள்ள לְךָ-வையும் இன்னும் வெளிப்படையாகக் காட்டும் சொல்லியல் மாற்று.
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: உடனடியாக வழங்கப்படும் அறிவுறுத்தலை அறிமுகப்படுத்தும் உரையாடல் குறியீடு. முன்னுள்ள וְ தமிழில் தனியே ‘மேலும்’ என மொழிபெயர்க்கப்படாமலும் இயல்பாக அமைகிறது; மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּנִי
  choice: என் மகனே
  rationale: ரெபெக்காள் யாக்கோபை நேரடியாக அழைக்கும் குடும்ப உறவையும் ஆண்பாலையும் இயல்பான தமிழ் விளிவடிவில் காக்கிறது.
- source_word: שְׁמַע בְּקֹלִי
  choice: என் குரலுக்குச் செவிகொடு
  rationale: ‘என் குரலைக் கேள்’ என்ற எபிரேயச் சொல்லமைப்பை மரியாதையான, இயல்பான தமிழில் காக்கிறது. கீழ்ப்படிதல் உட்குறிப்பாக இருந்தாலும் அதை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: וְקוּם
  choice: எழுந்து
  rationale: קום என்ற கட்டளை வடிவத்தின் பொருளைக் காத்து, தொடர்ந்து வரும் கட்டளையுடன் இயல்பாக இணைக்கிறது.
- source_word: בְּרַח לְךָ
  choice: தப்பியோடு
  rationale: ברח அவசரமாக ஆபத்திலிருந்து ஓடித் தப்புவதைக் குறிக்கிறது. לְךָ-வின் நலன்/திசை சார்ந்த நுணுக்கத்தைத் தமிழில் தனியே செயற்கையாக வெளிப்படுத்தாமல் இயல்பான வினைச்சொல்லில் அடக்குகிறது.
- source_word: אֶל לָבָן אָחִי
  choice: என் சகோதரன் லாபானிடம்
  rationale: இலக்கையும் உறவையும் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: חָרָנָה
  choice: ஆரானிலுள்ள
  rationale: இடப்பெயருடன் சேர்ந்த திசைச் சுட்டு ஆரானை நோக்கிய இயக்கத்தைக் காட்டுகிறது. ‘லாபானிடம்’ ஏற்கெனவே இலக்கைக் குறிப்பதால், தமிழில் ஆரானை லாபானின் இருப்பிடமாக இணைப்பது மறுமொழியைத் தவிர்க்கிறது.
