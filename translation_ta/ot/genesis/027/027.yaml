id: GEN.27.27
reference: Genesis 27:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּגַּשׁ֙ וַ/יִּשַּׁק ל֔/וֹ וַ/יָּ֛רַח אֶת רֵ֥יחַ בְּגָדָ֖י/ו וַֽ/יְבָרֲכֵ֑/הוּ וַ/יֹּ֗אמֶר רְאֵה֙ רֵ֣יחַ בְּנִ֔/י כְּ/רֵ֣יחַ שָׂדֶ֔ה אֲשֶׁ֥ר בֵּרֲכ֖/וֹ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/027.yaml
  text: So he came near and kissed him[a], and he smelled the smell of his garments and blessed him and said, “See[b], the smell of my son is like the smell of a field that Yahweh has blessed.”
translation:
  language: ta
  text: 'அவன் அருகில் வந்து அவரை முத்தமிட்டான். அவர் அவனுடைய ஆடைகளின் மணத்தை முகர்ந்து, அவனை ஆசீர்வதித்துச் சொன்னார்: “இதோ, என் மகனின் மணம், யாவே ஆசீர்வதித்த வயல்வெளியின் மணத்தைப் போல இருக்கிறது.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: அவன் அருகில் வந்து
  rationale: נגשׁ என்பதன் அணுகிவருதல் என்ற இயக்கத்தையும், எபிரேயக் கதைநடையின் தொடர்ச்சியையும் இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּשַּׁק לוֹ
  choice: அவரை முத்தமிட்டான்
  rationale: செயலின் பொருள் ஈசாக்கு என்பதால், தமிழ் மரியாதை வழக்கிற்கேற்ப ‘அவரை’ பயன்படுத்தப்படுகிறது; மூலத்தில் இல்லாத உணர்ச்சி விளக்கம் சேர்க்கப்படவில்லை.
- source_word: וַיָּרַח אֶת רֵיחַ בְּגָדָיו
  choice: அவர் அவனுடைய ஆடைகளின் மணத்தை முகர்ந்து
  rationale: ריח என்ற பெயர்ச்சொல்லை ‘மணம்’ எனத் தொடர்ந்து வழங்கி மூலத்தின் சொல் மறுமொழியைப் பேணுகிறது; ‘மணத்தை முகர்ந்து’ என்பது தமிழில் புரியக்கூடிய இயல்பான இணைவு.
- source_word: בְּגָדָיו
  choice: அவனுடைய ஆடைகள்
  rationale: Concrete plural בְּגָדִים என்பதற்கு நவீனத் தமிழில் இயல்பான பன்மைச் சொல்.
- source_word: וַיְבָרֲכֵהוּ
  choice: அவனை ஆசீர்வதித்து
  rationale: ברך வினையையும் அதன் ஆண்பால் ஒருமைப் பொருள் பின்னொட்டையும் நேரடியாகக் காட்டுகிறது.
- source_word: רְאֵה
  choice: இதோ
  rationale: இங்கு நேரடியான பார்வைக் கட்டளையைவிட கவனத்தை ஈர்க்கும் உரையாடல் இடைச்சொல்லாக உள்ளது; ‘இதோ’ கண்ணியமான, இயல்பான தமிழ்.
- source_word: רֵיחַ בְּנִי
  choice: என் மகனின் மணம்
  rationale: முன்னருள்ள רֵיחַ என்பதற்கும் ‘மணம்’ என்றே வழங்கி சொல்லியல் மறுமொழியைப் பேணுகிறது.
- source_word: כְּרֵיחַ שָׂדֶה
  choice: வயல்வெளியின் மணத்தைப் போல
  rationale: כְּ குறிக்கும் உவமையையும் שָׂדֶה என்பதன் வெளி/வயல் பொருளையும் இயல்பாகத் தருகிறது; சூழலில் மணமிக்க திறந்த வயல்வெளி குறிக்கப்படுவதால் ‘வயல்வெளி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲשֶׁר בֵּרֲכוֹ יְהוָה
  choice: யாவே ஆசீர்வதித்த
  rationale: சார்பு வாக்கியத்தையும் நிறைவுற்ற ஆசீர்வாதச் செயலையும் சுருக்கமான தமிழில் துல்லியமாக வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, தனிப்பட்ட இறைப் பெயர் உள்ளது. ஆகவே அதை பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, தனிப்பெயரின் இயல்பைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ஈசாக்கைக் குறிக்க மரியாதைப் பன்மையான ‘அவர்/அவரை’, யாக்கோபைக் குறிக்க ‘அவன்/அவனை’ பயன்படுத்தி, எபிரேயத்தில் வெளிப்படையாகத் தெளிவாக இருக்கும் செய்பவர்களின் வேறுபாட்டை தமிழில் குழப்பமின்றிக் காட்டியுள்ளது. רֵיחַ என்பதற்கு இரு இடங்களிலும் ‘மணம்’ என வழங்கி மூலத்தின் சொல் மறுமொழி பேணப்பட்டுள்ளது.
