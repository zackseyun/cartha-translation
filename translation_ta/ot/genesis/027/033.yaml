  text: וַ/יֶּחֱרַ֨ד יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד מְאֹד֒ וַ/יֹּ֡אמֶר מִֽי אֵפ֡וֹא ה֣וּא הַ/צָּֽד צַיִד֩ וַ/יָּ֨בֵא לִ֜/י וָ/אֹכַ֥ל מִ/כֹּ֛ל בְּ/טֶ֥רֶם תָּב֖וֹא וָ/אֲבָרֲכֵ֑/הוּ גַּם בָּר֖וּךְ יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/033.yaml
  text: Then Isaac trembled with a very great trembling and said[a], “Who then was it who hunted game and brought it to me, and I ate from all of it before you came and blessed him? Yes, and he will be blessed.”
translation:
  language: ta
  text: அப்போது ஈசாக்கு மிகப் பெரும் நடுக்கத்துடன் நடுங்கி, “அப்படியானால், வேட்டையாடி இரையை என்னிடம் கொண்டு வந்தவன் யார்? நீ வருமுன் நான் அவன் கொண்டுவந்த அனைத்தையும் சாப்பிட்டு அவனை ஆசீர்வதித்தேன். ஆம், அவன் ஆசீர்வதிக்கப்பட்டவனாகவே இருப்பான்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மையாகவே, அவன் ஆசீர்வதிக்கப்பட்டவனாக இருப்பான்.”
    reason: גַּם என்பதன் உறுதிப்படுத்தும் வலிமையை ‘ஆம்’ அல்லது ‘உண்மையாகவே’ என்று வெளிப்படுத்தலாம்.
lexical_decisions:
- source_word: וַיֶּחֱרַד ... חֲרָדָה גְּדֹלָה עַד מְאֹד
  choice: மிகவும் கடுமையாக நடுங்கி
  rationale: வினையும் அதே வேர்ச்சொல்லிலான பெயரும் சேர்ந்த எபிரெய தீவிரப்படுத்தலை இயல்பான நவீனத் தமிழில் வலுவாக வெளிப்படுத்துகிறது; அச்சம் மட்டுமே எனக் குறுக்காமல் அதிர்ச்சியால் ஏற்பட்ட உடல்-உணர்ச்சி நடுக்கத்தைப் பாதுகாக்கிறது.
- source_word: מִי אֵפוֹא הוּא
  choice: அப்படியானால் ... யார்?
  rationale: אֵפוֹא தரும் அனுமானமும் வலியுறுத்தலும் ‘அப்படியானால்’ என்பதில் இயல்பாகத் தெரிகின்றன.
- source_word: הַצָּד צַיִד
  choice: வேட்டையாடி இரையைக் கொண்டுவந்து
  rationale: צַיִד என்பதை ஒரு குறிப்பிட்ட விலங்கின் இறைச்சியாகச் சுருக்காமல், வேட்டையில் கிடைத்த உணவு/இரை என்ற பொதுவான பொருளைத் தக்கவைக்கிறது.
- source_word: וָאֹכַל מִכֹּל
  choice: அவன் கொண்டுவந்த எல்லாவற்றிலிருந்தும் சாப்பிட்டு
  rationale: מִן இன் பகுதியெடுக்கும் நுட்பத்தை ‘எல்லாவற்றிலிருந்தும்’ காக்கிறது; தமிழில் குறிப்பு தெளிவாக இருக்க மறைமுகப் பொருள் நிரப்பப்பட்டுள்ளது.
- source_word: בְּטֶרֶם תָּבוֹא
  choice: நீ வருவதற்குமுன்
  rationale: எளிய காலவாக்கியத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וָאֲבָרֲכֵהוּ
  choice: அவனை ஆசீர்வதித்தேனே
  rationale: முதல் நபர் வினையையும் முடிந்த செயல் நிலையையும் வெளிப்படையாகக் காட்டுகிறது; ‘-தேனே’ சூழலின் அதிர்ச்சியையும் உணர்தலையும் இயல்பாகச் சுமக்கிறது.
- source_word: גַּם בָּרוּךְ יִהְיֶה
  choice: ஆம், அவன் ஆசீர்வதிக்கப்பட்டவனாகவே இருப்பான்
  rationale: גַּם இன் உறுதிப்படுத்தும் வலிமையையும் יִהְיֶה இன் எதிர்கால/நிலைத்த விளைவையும் காக்கிறது.
theological_decisions:
- issue: ஏற்கெனவே வழங்கப்பட்ட ஆசீர்வாதத்தைப் பற்றிய ஈசாக்கின் இறுதி அறிவிப்பின் வலிமை
  choice: அந்த ஆசீர்வாதம் நிலைக்கும் என்ற உறுதியான அறிவிப்பு
  alternative: வெறும் மனமில்லாத ஒப்புதல் அல்லது ஏமாற்றத்துடன் கூடிய சம்மதம்
  rationale: גַּם בָּרוּךְ יִהְיֶה வலியுறுத்தப்பட்ட உறுதிப்படுத்தலாக உள்ளது. அது எவ்வாறு செயல்படுகிறது என்ற பிற்காலக் கோட்பாட்டைச் சேர்க்காமல், கதையிலுள்ள ஆசீர்வாதத்தின் நிலைத்த தன்மையையும் இறையியல் பதற்றத்தையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஈசாக்கு’, ‘ஆசீர்வதித்தேன்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; எபிரெயத்தின் சொற்படி மீளுரைப்பை தமிழில் செயற்கையாகப் பிரதியெடுக்காமல் அதன் தீவிரம் பாதுகாக்கப்பட்டுள்ளது.
