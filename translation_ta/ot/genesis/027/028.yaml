revisions:
- from: வானத்தின் பனியில் ஒரு பங்கையும்[a], பூமியின் செழுமையில் ஒரு பங்கையும், ஏராளமான தானியத்தையும் புதுத் திராட்சை மதுவையும் கடவுள் உனக்குத் தருவாராக!
  to: வானத்தின் பனியிலிருந்தும்[a], பூமியின் செழுமையிலிருந்தும், ஏராளமான தானியத்தையும் புதிய திராட்சை மதுவையும் கடவுள் உனக்குத் தருவாராக!
  rationale: The revision replaces the concrete and awkward ‘a share in’ wording with idiomatic Tamil ablative phrasing that expresses the Hebrew מן in this blessing context. It also smooths the expression for new wine. The blessing’s volitive form, agricultural imagery, abundance, and footnote alternative are retained.
