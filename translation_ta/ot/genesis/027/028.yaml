id: GEN.27.28
reference: Genesis 27:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/יִֽתֶּן לְ/ךָ֙ הָ/אֱלֹהִ֔ים מִ/טַּל֙ הַ/שָּׁמַ֔יִם וּ/מִ/שְׁמַנֵּ֖י הָ/אָ֑רֶץ וְ/רֹ֥ב דָּגָ֖ן וְ/תִירֹֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/028.yaml
  text: May God give you some of the dew of heaven[a], and some of the richness of the earth, and an abundance of grain and new wine.
translation:
  language: ta
  text: வானத்தின் பனியிலிருந்தும்[a], பூமியின் செழுமையிலிருந்தும், ஏராளமான தானியத்தையும் புதிய திராட்சை மதுவையும் கடவுள் உனக்குத் தருவாராக!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வானத்தின் பனியையும் … பூமியின் செழுமையையும்.” எபிரெய மொழி வேளாண்மை வளத்தையும் மிகுதியையும் சித்தரிக்கும் உருவகத்தைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: தருவாராக
  rationale: ஆசீர்வாதச் சூழலில் வரும் இந்த வினைவடிவம் வெறும் எதிர்கால முன்னறிவிப்பை அல்ல, ‘தருவாராக’ என்ற வாழ்த்தையும் வேண்டுதலையும் வெளிப்படுத்துகிறது.
- source_word: הָאֱלֹהִים
  choice: கடவுள்
  rationale: எபிரெய மொழியில் வரையறைச் சுட்டுடன் இருந்தாலும், இங்கு இது ஒரே கடவுளைக் குறிக்கும் இயல்பான பட்டப்பெயராக உள்ளது.
- source_word: מִטַּל הַשָּׁמַיִם
  choice: வானத்தின் பனியில் ஒரு பங்கை
  rationale: מִן என்ற முன்னிடைச்சொல்லின் பங்கீட்டுப் பொருளை வெளிப்படையாகக் காட்டுகிறது; ‘வானத்தின் பனி’ என்ற வேளாண்மை வள உருவகத்தையும் காக்கிறது.
- source_word: וּמִשְׁמַנֵּי הָאָרֶץ
  choice: பூமியின் செழுமையில் ஒரு பங்கை
  rationale: שְׁמַנֵּי என்பதன் சொற்பொருள் ‘கொழுமை’ என்பதோடு தொடர்புடையது; நிலத்தைப் பற்றிய ஆசீர்வாதத்தில் அது வளத்தையும் விளைச்சல் செழிப்பையும் குறிக்கிறது.
- source_word: וְרֹב
  choice: ஏராளமான
  rationale: רֹב குறிக்கும் மிகுதி அல்லது ஏராளம் என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: דָּגָן
  choice: தானியம்
  rationale: இது குறிப்பிட்ட ஒரு பயிரை அல்ல, தானிய விளைச்சலைப் பொதுவாகக் குறிக்கிறது.
- source_word: וְתִירֹשׁ
  choice: புதுத் திராட்சை மது
  rationale: תִּירוֹשׁ பொதுவான ‘மது’ என்பதிலிருந்து வேறுபட்டு, புதிய அல்லது அண்மையில் தயாரிக்கப்பட்ட திராட்சை மதுவைக் குறிக்கிறது.
theological_decisions:
- issue: உரையின் தன்மை
  choice: ‘கடவுள் ... தருவாராக’ என்ற ஆசீர்வாத வாழ்த்து
  alternative: ‘கடவுள் ... தருவார்’ என்ற எளிய எதிர்காலக் கூற்று
  rationale: வினைவடிவமும் ஈசாக்கின் ஆசீர்வாதச் சூழலும் இதை முன்னறிவிப்பாக மட்டும் அல்லாமல், செயலாற்றும் ஆசீர்வாத வாழ்த்தாகப் புரிந்துகொள்ள ஆதரிக்கின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைந்த ஆசீர்வாத நடை. ‘ஒரு பங்கு’ என்பது எபிரெய முன்னிடைச்சொல்லின் பங்கீட்டுப் பொருளைக் காக்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
