  text: And he said, “Look now, I have grown old; I do not know the day of my death.”
translation:
  language: ta
  text: அவர், “பார், நான் முதிர்ந்துவிட்டேன்; நான் இறக்கும் நாள் எதுவென்று எனக்குத் தெரியாது” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: இதோ, இப்போது
  rationale: הִנֵּה என்பதன் கவனத்தை ஈர்க்கும் தன்மையையும், נָא இங்கு தரும் உரையாடல் சார்ந்த மென்மை/உடன்நிலையையும் இயல்பான நவீனத் தமிழில் பிரதிபலிக்கிறது.
- source_word: זָקַנְתִּי
  choice: நான் முதிர்ந்துவிட்டேன்
  rationale: வினையின் நிறைநிலைத் தன்மையையும் வயது முதிர்ந்த நிலையை அடைந்திருப்பதையும் தெளிவாகக் காட்டுகிறது.
- source_word: יוֹם מוֹתִי
  choice: நான் இறக்கும் நாள்
  rationale: எபிரேய மொழியின் ‘என் மரணத்தின் நாள்’ என்ற அமைப்பை இயல்பான தமிழில் பொருள் மாறாமல் வழங்குகிறது.
