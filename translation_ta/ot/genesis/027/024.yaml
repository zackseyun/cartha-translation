translation_notes:
  register: நவீன, இயல்பான, கண்ணியமான தமிழ். ஈசாக்கைக் குறிக்க மரியாதை ஒருமையும், யாக்கோபைக் குறிக்க சாதாரண ஒருமையும் பயன்படுத்தப்பட்டுள்ளன. அடையாளத்தை வலியுறுத்தும் எபிரெயக் கட்டமைப்பு ‘உண்மையிலேயே ... தானா?’ என்றும், சுருக்கமான பதில் ‘நான்தான்’ என்றும் வழங்கப்பட்டுள்ளது.
