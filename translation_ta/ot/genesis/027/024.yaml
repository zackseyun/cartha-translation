source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אַתָּ֥ה זֶ֖ה בְּנִ֣/י עֵשָׂ֑ו וַ/יֹּ֖אמֶר אָֽנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/024.yaml
  text: He said[a], “Are you really my son Esau?” And he said, “I am.”
translation:
  language: ta
  text: அவர், “நீ உண்மையிலேயே என் மகன் ஏசாதானா?” என்று கேட்டார்.[a] அதற்கு அவன், “நான்தான்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழியில் சொல்லுக்குச் சொல்: “நீ இவன்தானா, என் மகன் ஏசா?” இந்தச் சொற்றொடர் ஒருவரின் அடையாளத்தை வலியுறுத்தி உறுதிப்படுத்தும் கேள்வியாக உள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவர் ... என்று கேட்டார்
  rationale: אמר என்பதன் அடிப்படைப் பொருள் ‘சொல்’ என்றாலும், இங்கு கேள்வி உரையை அறிமுகப்படுத்துவதால் இயல்பான தமிழில் ‘கேட்டார்’ என்று வழங்கப்பட்டது; முதலில் பேசுபவர் ஈசாக்கு என்பதால் மரியாதை ஒருமை பயன்படுத்தப்பட்டது.
- source_word: אַתָּה זֶה
  choice: நீ உண்மையிலேயே ... தானா?
  rationale: தனிப் பிரதிப்பெயரும் சுட்டுப்பெயரும் சேர்ந்துள்ள எபிரெயச் சொற்றொடர் அடையாளத்தை வலியுறுத்துகிறது. ‘உண்மையிலேயே ... தானா?’ என்பது அந்த வலியுறுத்தலையும் ஈசாக்கின் உறுதிப்படுத்தும் கேள்வியையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: בְּנִי
  choice: என் மகன்
  rationale: முதல் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள சொல் நேரடியாகத் தக்கவைக்கப்பட்டது.
- source_word: עֵשָׂו
  choice: ஏசா
  rationale: பெயர் நவீனத் தமிழ் வேதாகமப் பயன்பாட்டிற்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיֹּאמֶר
  choice: அதற்கு அவன் ... என்றான்
  rationale: இரண்டாவது உரைக்கூற்றின் தொடர்பை இயல்பாகக் காட்ட ‘அதற்கு’ சேர்க்கப்பட்டது. பேசுபவர் யாக்கோபு என்பதால் சாதாரண ஒருமை பயன்படுத்தப்பட்டது.
- source_word: אָֽנִי
  choice: நான்தான்
  rationale: தனித்து வரும் முதல் நபர் பிரதிப்பெயர் இங்கு சுருக்கமான சுய அடையாள உறுதிப்பாடாக உள்ளது; ‘நான்தான்’ அதன் வலியுறுத்தலை இயல்பாகப் பாதுகாக்கிறது.
