translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தகப்பன்’ என்பது வேதாகமக் கதைநடைக்கு ஏற்ற மரியாதையான உறவுமுறைச் சொலாக வைக்கப்பட்டுள்ளது; எபிரெயப் பன்மையை வெளிப்படுத்த ‘உணவுவகைகள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
