  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ֙ וַ/יִּקַּ֔ח וַ/יָּבֵ֖א לְ/אִמּ֑/וֹ וַ/תַּ֤עַשׂ אִמּ/וֹ֙ מַטְעַמִּ֔ים כַּ/אֲשֶׁ֖ר אָהֵ֥ב אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/014.yaml
  text: So he went and took them and brought them to his mother[a], and his mother prepared tasty food, just as his father loved.
translation:
  language: ta
  text: அவன் போய், அவற்றை எடுத்துத் தன் தாயிடம் கொண்டுவந்தான். அவனுடைய தாய், அவனுடைய தந்தை விரும்பியபடியே சுவையான உணவுகளை[a] தயாரித்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லை ‘சுவைமிக்க உணவுகள்’ அல்லது ‘சிறப்புணவுகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: அவன் போய்
  rationale: தொடர்ச்சியான நிகழ்வை இயல்பான தமிழ் கதைநடையில் வெளிப்படுத்துகிறது.
- source_word: וַיִּקַּח
  choice: அவற்றைப் பிடித்துக்கொண்டு
  rationale: வினையின் பொருள் எபிரெயத்தில் வெளிப்படையாக இல்லை; முந்தைய வசனத்தில் கூறப்பட்ட இரண்டு வெள்ளாட்டுக் குட்டிகளைச் சூழலிலிருந்து குறிக்க ‘அவற்றை’ சேர்க்கப்பட்டுள்ளது. உயிருள்ள விலங்குகளை எடுத்துச் செல்வதை இயல்பாகக் கூற ‘பிடித்துக்கொண்டு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיָּבֵא לְאִמּוֹ
  choice: தன் தாயிடம் கொண்டுவந்தான்
  rationale: בוא உடன் ל வருவதன் பொருளை ‘தாயிடம் கொண்டுவந்தான்’ என இயல்பாக வழங்குகிறது; மறைந்திருக்கும் பொருள் முந்தைய வினையுடன் இணைந்து புரிகிறது.
- source_word: וַתַּעַשׂ אִמּוֹ
  choice: அவனுடைய தாய் ... தயாரித்தாள்
  rationale: உணவைச் செய்வதைக் குறிக்கும் עשה என்பதற்கு நவீன தமிழில் ‘தயாரித்தாள்’ துல்லியமும் இயல்பும் உடையது.
- source_word: מַטְעַמִּים
  choice: சுவையான உணவுவகைகளை
  rationale: சிறப்பாகத் தயாரிக்கப்பட்ட, சுவைமிக்க உணவைக் குறிக்கும் சொல்லின் பன்மை வடிவத்தையும் பொருளையும் ‘உணவுவகைகள்’ காக்கிறது.
- source_word: כַּאֲשֶׁר אָהֵב אָבִיו
  choice: அவனுடைய தகப்பன் விரும்பியபடியே
  rationale: כַּאֲשֶׁר என்பதன் ஒப்பீட்டு வலிமையை ‘படியே’ என்பதும், אהב என்பதன் இச்சூழல் பொருளை ‘விரும்பிய’ என்பதும் இயல்பாகத் தருகின்றன.
