base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/031.yaml
  text: He too prepared tasty food and brought it to his father[a], and he said to his father, “Let my father rise and eat of his son's game[b], so that your soul may bless me.”
translation:
  language: ta
  text: அவனும் சுவையான உணவைச்[a] சமைத்து, அதைத் தன் தந்தையிடம் கொண்டுவந்து, தன் தந்தையிடம், “என் தந்தை எழுந்து, தம் மகன் வேட்டையாடிய இறைச்சியைச் சாப்பிட்டு, உமது ஆத்துமா[b] என்னை ஆசீர்வதிக்கும் பொருட்டு” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சுவையான உணவு” என்பது இந்நிகழ்வில் சிறப்பாகத் தயாரிக்கப்பட்ட சுவைமிக்க உணவைக் குறிக்கிறது; “ருசியான பதார்த்தங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “உமது ஆத்துமா என்னை ஆசீர்வதிக்கட்டும்” என்பது எபிரெய சொல்லாட்சி. இதற்கு இயல்பாக “நீர் என்னை ஆசீர்வதிக்க வேண்டும்” என்று பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: அவனும்
  rationale: யாக்கோபு முன்பு செய்ததற்கு இணையாக ஏசாவும் செய்தான் என்ற சேர்க்கைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מַטְעַמִּים
  choice: சுவையான உணவு
  rationale: இந்நிகழ்வில் சிறப்பாகத் தயாரிக்கப்பட்ட சுவைமிக்க உணவைக் குறிக்கிறது; நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יָקֻם אָבִי
  choice: என் தந்தை எழுந்து ... சாப்பிடட்டும்
  rationale: மூன்றாம் நபர் வடிவில் தந்தையிடம் மரியாதையுடன் வைக்கப்படும் வேண்டுகோளைப் பாதுகாக்கிறது.
- source_word: מִצֵּיד בְּנוֹ
  choice: தம் மகன் வேட்டையாடிக் கொண்டுவந்த இறைச்சி
  rationale: צַיִד என்பதன் வேட்டைப் பின்னணியையும், உணவாகத் தயாரிக்கப்பட்ட வேட்டையிறைச்சியையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בַּעֲבוּר
  choice: அப்போது
  rationale: உணவைச் சாப்பிடுவதன் நோக்கமாக அடுத்து ஆசீர்வாதம் வழங்கப்பட வேண்டும் என்ற தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: נַפְשֶׁךָ
  choice: உமது ஆத்துமா
  rationale: எபிரெய உரையின் வெளிப்படையான ‘உமது நெஃபெஷ்’ என்ற சொல்லாட்சியைத் தக்கவைத்து, அதை வெறுமனே ‘நீர்’ என்று கரைத்துவிடாமல் அதன் இலக்கிய மற்றும் உணர்ச்சிசார் வலிமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: נַפְשֶׁךָ என்பதன் நபரைக் குறிக்கும் மரபுத்தொடர் பயன்பாடு
  choice: உமது ஆத்துமா என்னை ஆசீர்வதிக்கட்டும்
  alternative: நீர் என்னை ஆசீர்வதிக்க வேண்டும்
  rationale: இது தனி ‘ஆத்துமா’ குறித்த கோட்பாட்டை நிறுவுவதாக அவசியமில்லை; முழு நபரையும் குறிக்கும் எபிரெய மரபுத்தொடராக இருக்கலாம். இருப்பினும் மூலத்தின் தனித்துவமான சொல்லாட்சியையும் அதன் பொருள் இழுப்பையும் முதன்மை உரையில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத்தமிழில், கண்ணியமான வேதாகம நடையுடன் வடிவமைக்கப்பட்டது. தந்தையை மூன்றாம் நபரில் மரியாதையுடன் அழைக்கும் மூல அமைப்பு ‘என் தந்தை ... சாப்பிடட்டும்’ எனப் பாதுகாக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
