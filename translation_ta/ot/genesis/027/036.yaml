base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/036.yaml
  text: 'And he said[a], “Is he not rightly named Jacob? For he has supplanted me these two times: he took my birthright, and look, now he has taken my blessing.” And he said, “Have you not reserved a blessing for me?”'
translation:
  language: ta
  text: 'அவன், “அவனுக்கு ‘யாக்கோபு’[a] என்று பெயரிட்டது பொருத்தம்தானே? இந்த இரண்டு முறையும் அவன் என்னைத் தந்திரமாக முந்திக்கொண்டான்: என் மூத்தமகனுக்குரிய உரிமையை எடுத்துக்கொண்டான்; இதோ, இப்போது என் ஆசீர்வாதத்தையும் எடுத்துக்கொண்டான்” என்றான். அவன், “எனக்காக ஓர் ஆசீர்வாதத்தை ஒதுக்கி வைத்திருக்கவில்லையா?” என்று கேட்டான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் ‘யாக்கோபு’ என்ற பெயருக்கும் ‘என்னைத் தந்திரமாக முந்திக்கொண்டான்’ என்று மொழிபெயர்க்கப்பட்ட வினைச்சொல்லுக்கும் சொல்விளையாட்டு உள்ளது. அந்த வினைச்சொல்லை ‘என்னை ஏமாற்றிவிட்டான்’ அல்லது ‘என் இடத்தைப் பறித்துக்கொண்டான்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי קָרָא שְׁמוֹ יַעֲקֹב
  choice: அவனுக்கு ‘யாக்கோபு’ என்று பெயரிட்டது பொருத்தம்தானே?
  rationale: கசப்பும் ஏளனமும் கலந்த வினாவாக இயல்பான தமிழில் தரப்பட்டுள்ளது; பெயருக்கும் அடுத்த வினைச்சொல்லுக்கும் இடையிலான எபிரெயச் சொல்விளையாட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וַיַּעְקְבֵנִי
  choice: அவன் என்னை மிஞ்சிவிட்டான்
  rationale: இச்சூழலில் மற்றவரைவிட தந்திரமாக முன்னிலை பெற்று அவரது இடத்தையோ நன்மையையோ கைப்பற்றுதல் என்ற பொருளைத் தருகிறது. ‘ஏமாற்றிவிட்டான்’ என்பதும் சாத்தியம்; ஆனால் அது பொருளை ஏமாற்றுதல் என்ற ஒரே கோணத்திற்குள் குறுக்கிவிடக்கூடும்.
- source_word: זֶה פַעֲמַיִם
  choice: இந்த இரண்டு முறையும்
  rationale: எபிரெயச் சொல்லாட்சியின் வலியுறுத்தலைப் பேணும் இயல்பான தமிழ்.
- source_word: בְּכֹרָתִי
  choice: என் முதற்பேறுரிமை
  rationale: முதற்பேறானவருக்குரிய குடும்ப மற்றும் சட்ட உரிமைகளைக் குறிக்கும் தெளிவான சொல்.
- source_word: וְהִנֵּה עַתָּה
  choice: இதோ, இப்போது
  rationale: பேசுபவரின் உணர்ச்சிமிக்க சுட்டுதலை நவீன, கண்ணியமான தமிழில் பேணுகிறது.
- source_word: בִּרְכָתִי
  choice: என் ஆசீர்வாதம்
  rationale: இங்கு தந்தை வழங்கும் ஆணையுடனும் விளைவுடனும் கூடிய ஆசீர்வாதத்தைக் குறிக்கும் வழக்கமான வேதாகமத் தமிழ்.
- source_word: הֲלֹא אָצַלְתָּ לִּי בְּרָכָה
  choice: எனக்காக ஓர் ஆசீர்வாதத்தை வைத்திருக்கவில்லையா?
  rationale: אָצַל என்பதன் ‘ஒதுக்கி வை/மீதியாக வை’ என்ற கருத்தை இயல்பான வேண்டுகோள் வடிவில் தருகிறது.
