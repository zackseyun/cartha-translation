translation_notes:
  register: நவீன தரத் தமிழில், குடும்ப அழைப்பின் நெருக்கத்தையும் கட்டளையின் உறுதியையும் காக்கும் கண்ணியமான நடை. எபிரேய ‘குரல்’ மரபுத்தொடர் தமிழில் தவறாக வெறும் ஒலியுணர்வாகப் படாமல் ‘சொல்லுக்குச் செவிகொடு’ என இயல்பாக்கப்பட்டுள்ளது.
