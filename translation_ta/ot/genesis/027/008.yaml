  text: Now[a], my son[b], listen to my voice as to what I command you.
translation:
  language: ta
  text: இப்போது, என் மகனே, நான் உனக்குக் கட்டளையிடுகிறபடி என் சொல்லுக்குச் செவிகொடு.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: அடுத்த அறிவுறுத்தலை உடனடியாக அறிமுகப்படுத்தும் கால/உரையாடல் குறியீடு. தமிழில் இணைப்புச் சொல்லை வெளிப்படையாகச் சேர்க்காமலும் இயல்பாக அமைகிறது.
- source_word: בְּנִי
  choice: என் மகனே
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியுடன் வரும் விளிவேற்றுமை அழைப்பு; தாயின் நேரடி அழைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: שְׁמַע בְּקֹלִי
  choice: என் சொல்லுக்குச் செவிகொடு
  rationale: எபிரேய மொழியில் சொற்படியாக ‘என் குரலுக்குச் செவிகொடு’; சூழலில் சொல்வதைக் கவனித்துப் பின்பற்றுதல் என்ற பொருள் உள்ளது. ‘கீழ்ப்படி’ என்று மட்டும் மொழிபெயர்ப்பது கேட்பதன் உருவகத்தை அழித்துவிடும்; ‘என் குரலைக் கேள்’ என்பது தமிழில் வெறும் ஒலி கேட்பதாகப் புரியலாம். தேர்ந்த வடிவம் இரண்டிற்கும் இடைப்பட்ட இயல்பான இணை.
- source_word: לַאֲשֶׁר
  choice: …பற்றி
  rationale: தொடர்ந்து வரும் கட்டளையின் உள்ளடக்கத்தை ‘செவிகொடு’ என்பதோடு இணைக்கிறது; தமிழில் இயல்பான வாக்கியத் தொடர்பை வழங்குகிறது.
- source_word: אֲנִי מְצַוָּה אֹתָךְ
  choice: நான் உனக்குக் கட்டளையிடப்போவதை
  rationale: பேச்சைத் தொடர்ந்து உடனே வழங்கப்படவுள்ள கட்டளையைச் சூழலுக்கேற்ற தமிழில் குறிக்கிறது. எபிரேய நிகழ்காலப் பங்கேற்பு உடனடி/நடைபெறும் செயலைக் குறிக்கிறது; தமிழில் ‘கட்டளையிடுகிறதை’ என்பதைவிட இங்கு எதிர்வரும் அறிவுறுத்தலைக் குறிக்கும் வடிவம் இயல்பானது.
