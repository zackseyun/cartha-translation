  yaml_path: translation/ot/genesis/027/025.yaml
  text: And he said[a], “Bring it near to me, and I will eat of my son’s game, so that my soul may bless you.” So he brought it near to him, and he ate; and he brought him wine, and he drank.
translation:
  language: ta
  text: அவர், “அதை என்னிடம் கொண்டுவா; நான் என் மகன் வேட்டையாடிக் கொண்டுவந்த இறைச்சியில் சிறிது சாப்பிட்டு, என் ஆத்துமா உன்னை ஆசீர்வதிக்கும்படி” என்றார். அவன் அதை அவரிடம் கொண்டுவந்தான்; அவர் சாப்பிட்டார். பிறகு அவன் அவருக்குத் திராட்சரசம் கொண்டுவந்தான்; அவர் குடித்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגִּשָׁה לִּי
  choice: அதை என்னிடம் கொண்டுவா
  rationale: நגשׁ என்பதன் காரணவினை ஏவல் வடிவம் ‘அருகில் கொண்டுவருதல்/முன்வைத்தல்’ என்பதைக் குறிக்கிறது. சூழலில் மறைந்துள்ள செயப்படுபொருள் தமிழில் இயல்பாக ‘அதை’ என்று சேர்க்கப்பட்டுள்ளது.
- source_word: וְאֹכְלָה
  choice: நான் ... சாப்பிடுவேன்
  rationale: முதல் நபர் cohortative ஈசாக்கின் நோக்கத்தையோ விருப்பத்தையோ தெரிவிக்கிறது; கட்டளைக்குப் பின் வரும் செயல் வரிசையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: מִצֵּיד בְּנִי
  choice: என் மகன் வேட்டையாடிக் கொண்டுவந்த இறைச்சியில் சிறிது
  rationale: צַיִד வேட்டையால் கிடைத்த உணவைச் சுட்டுகிறது; இச்சூழலில் ‘வேட்டையாடிக் கொண்டுவந்த இறைச்சி’ தெளிவான இயல்பான தமிழ். מִן இன் பகுதிப்பொருளை ‘சிறிது’ வெளிப்படுத்துகிறது.
- source_word: לְמַעַן
  choice: அப்போது
  rationale: இங்கு உண்பதற்குப் பின் ஆசீர்வதிப்பதே நோக்கம். தமிழில் ‘அப்போது’ செயல் வரிசையையும் நோக்கத் தொடர்பையும் இயல்பாகத் தருகிறது; கடுமையான காரணவிளைவு உணர்வைத் திணிக்காது.
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: என் ஆத்துமா உன்னை ஆசீர்வதிக்கும்
  rationale: எபிரெயத்தில் נַפְשִׁי வெளிப்படையான எழுவாய். அதை வெறும் ‘நான்’ என்று சுருக்காமல், மூலத்தின் தனிப்பட்ட வலிமையையும் விசித்திரமான மொழிநடையையும் காக்க ‘என் ஆத்துமா’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּגֶּשׁ לוֹ
  choice: அவன் அதை அவரிடம் கொண்டுவந்தான்
  rationale: முன்னுள்ள கட்டளையின் நגשׁ வினைச்சொல் மீண்டும் வருவதை ‘கொண்டுவந்தான்’ பிரதிபலிக்கிறது. நபர்சுட்டுப் பெயர்கள் குழப்பமடையாமல் மரியாதை வேறுபாடு பயன்படுத்தப்பட்டுள்ளது.
- source_word: יַיִן
  choice: திராட்சரசம்
  rationale: יַיִן என்பதற்கான வழக்கமான வேதாகமத் தமிழ் சொல்; மதுபானத் தன்மையை மறைக்காமல், தமிழ் வாசகர்களுக்கு தெளிவாக உள்ளது.
- source_word: וַיֵּשְׁתְּ
  choice: அவர் குடித்தார்
  rationale: שׁתה வினையின் எளிய தொடர் நிகழ்வை நேரடியாக மொழிபெயர்க்கிறது.
theological_decisions:
- issue: נַפְשִׁי என்பதைக் காக்கலாமா அல்லது ‘நான்’ என்று மரபுத்தொடராக்கலாமா
  choice: என் ஆத்துமா உன்னை ஆசீர்வதிக்கும்
  alternative: நான் உன்னை ஆசீர்வதிப்பேன்
  rationale: மூல எபிரெயம் ‘என் ஆத்துமா’ என்பதை எழுவாயாக வைத்துள்ளது. இது தனி உட்பொருள் அல்லது பிரிவுபட்ட ஆன்மா குறித்த கோட்பாட்டை அவசியமாகக் கற்பிக்காமல், முழு உள்ளத்தின் ஆழ்ந்த தனிப்பட்ட செயலைக் குறிக்கக்கூடிய எபிரெய மரபுத்தொடர். மூலத்தின் இறையியல் பதற்றத்தையும் சொல்லமைப்பையும் பிரதான உரையில் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன, மரியாதையான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஈசாக்கைக் குறிக்கும் இடங்களில் ‘அவர்’, யாக்கோபைக் குறிக்கும் இடங்களில் ‘அவன்’ எனக் கொடுத்து, எபிரெய ஆண்பால் ஒருமைச் சுட்டுப்பெயர்களால் தமிழில் உருவாகக்கூடிய குழப்பம் தவிர்க்கப்பட்டுள்ளது. ‘ஆத்துமா’ என்பது இங்கு மூலத்தின் נֶפֶשׁ சொல்லைத் தெளிவாகக் காக்கிறது; அடிக்குறிப்பு அதன் மரபுத்தொடரான பொருளையும் தருகிறது.
