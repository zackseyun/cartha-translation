base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/022.yaml
  text: So Jacob went near to Isaac his father[a], and he felt him and said, “The voice is Jacob’s voice, but the hands are Esau’s hands.”
translation:
  language: ta
  text: யாக்கோபு தன் தந்தை ஈசாக்கின் அருகில் சென்றான். ஈசாக்கு அவனைத் தடவிப் பார்த்து, “குரல் யாக்கோபின் குரல்; கைகளோ ஏசாவின் கைகள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: அருகில் சென்றான்
  rationale: נגשׁ என்பதன் ‘நெருங்குதல்/அருகில் செல்லுதல்’ என்ற பொருளையும் கதைநடையின் தொடர்ச்சியையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיְמֻשֵּׁהוּ
  choice: அவனைத் தடவிப் பார்த்து
  rationale: மெய்யாகத் தொட்டறிந்து அடையாளத்தைச் சரிபார்க்கும் செயலை מושׁ இங்கு குறிக்கிறது; ‘தொட்டார்’ என்பதைவிட ‘தடவிப் பார்த்தார்’ அந்த நோக்கமுள்ள பரிசோதனையைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַקֹּל
  choice: குரல்
  rationale: இந்தச் சூழலில் பேசுகிறவரின் ஒலியால் அவரை அடையாளம் காண்பதே கருத்தாக இருப்பதால், ‘ஒலி’ என்பதைவிட ‘குரல்’ துல்லியமானது.
- source_word: קוֹל יַעֲקֹב
  choice: யாக்கோபின் குரல்
  rationale: எபிரெயக் கட்டமைப்பின் உடைமைப் பொருளை இயல்பான தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְהַיָּדַיִם יְדֵי עֵשָׂו
  choice: கைகளோ ஏசாவின் கைகள்
  rationale: வினைச்சொல் இல்லாத எபிரெய வாக்கியத்தையும் ‘கைகள்’ என்ற சொல்லின் வலியுறுத்தும் மறுபயன்பாட்டையும் காக்கிறது. ‘-ஓ’ எதிர்மறை ஒப்பீட்டை இயல்பாக வெளிப்படுத்துவதால் எபிரெய வாவுக்கு தனியாக ‘ஆனால்’ சேர்க்கப்படவில்லை.
- source_word: אָבִיו
  choice: தன் தந்தை
  rationale: யாக்கோபுக்கும் ஈசாக்குக்கும் உள்ள உறவை மூலத்தில் இருப்பதுபோல வெளிப்படையாகக் குறிப்பிடுகிறது.
