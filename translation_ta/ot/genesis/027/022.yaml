translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தொடக்க வாவ் தனியே ‘அப்போது’ அல்லது ‘எனவே’ என்று மொழிபெயர்க்கப்படாமல், தமிழ் கதைத் தொடர்ச்சியால் வெளிப்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான எபிரெய வினைகளில் செய்பவர் மாறுவதைத் தமிழில் குழப்பமின்றிக் காட்ட ‘ஈசாக்கு’ மீண்டும் குறிப்பிடப்பட்டுள்ளது.
