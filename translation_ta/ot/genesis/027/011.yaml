  yaml_path: translation/ot/genesis/027/011.yaml
  text: But Jacob said to Rebekah his mother[a], “Look, Esau my brother is a hairy man[b], and I am a smooth man.”
translation:
  language: ta
  text: ஆனால் யாக்கோபு தன் தாய் ரெபெக்காளிடம், “இதோ[a], என் சகோதரன் ஏசா உடலில் மயிர் நிறைந்தவன்; நானோ மயிரில்லாதவன்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பார்” என்றும் மொழிபெயர்க்கலாம்; இது யாக்கோபின் எதிர்ப்பைக் கவனத்துக்குக் கொண்டுவரும் சொல்.
    reason: lexical_alternative
  - marker: b
    text: மூலமொழியில் “மென்மையானவன்” அல்லது “வழவழப்பானவன்”; ஏசாவின் உடல் மயிருக்குப் மாறாக, யாக்கோபின் உடலில் மயிர் இல்லாததைக் குறிக்கிறது.
    reason: lexical_and_contextual_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் யாக்கோபு ... என்றான்
  rationale: தொடர்கதை இணைப்பான waw நிகழ்வை முன்னெடுத்தாலும், இங்கு யாக்கோபு ரெபெக்காளின் திட்டத்துக்கு எதிரான கவலையை முன்வைப்பதால் ‘ஆனால்’ சூழலுக்கு இயல்பானது.
- source_word: אִמּוֹ
  choice: தன் தாய்
  rationale: ரெபெக்காளுக்கும் யாக்கோபுக்கும் உள்ள உறவை எபிரெய மூலத்தைப் போலவே பெயருடன் சேர்த்து அடையாளப்படுத்துகிறது.
- source_word: הֵן
  choice: இதோ
  rationale: யாக்கோபின் எதிர்ப்பை அறிமுகப்படுத்தும் கவன ஈர்ப்புத் துகளின் உரையாடல் வலிமையைப் பாதுகாக்கிறது.
- source_word: אִישׁ שָׂעִר
  choice: உடலெங்கும் முடி நிறைந்தவன்
  rationale: ஏசாவின் உடல் முடியைச் சுட்டும் பொருளை நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְאָנֹכִי
  choice: நானோ
  rationale: தனிப்பட்ட சுட்டுப்பெயரின் வலியுறுத்தலையும் ஏசாவுடனான நேரடியான முரண்பாட்டையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: אִישׁ חָלָק
  choice: உடலில் முடியில்லாதவன்
  rationale: חָלָק என்பதன் அடிப்படை ‘வழவழப்பான/மென்மையான’ கருத்தை இச்சூழலில் உடல் முடி இல்லாமை என இயல்பாக வெளிப்படுத்தி, குணநலனைப் பற்றிய தவறான புரிதலைத் தவிர்க்கிறது.
