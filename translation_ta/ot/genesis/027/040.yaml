  text: וְ/עַל חַרְבְּ/ךָ֣ תִֽחְיֶ֔ה וְ/אֶת אָחִ֖י/ךָ תַּעֲבֹ֑ד וְ/הָיָה֙ כַּ/אֲשֶׁ֣ר תָּרִ֔יד וּ/פָרַקְתָּ֥ עֻלּ֖/וֹ מֵ/עַ֥ל צַוָּארֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/040.yaml
  text: And by your sword you shall live[a], and you shall serve your brother; but when you break loose, you shall break his yoke from off your neck.
translation:
  language: ta
  text: உன் வாளினால் நீ வாழ்வாய்; உன் சகோதரனுக்குப் பணிபுரிவாய். ஆனால் நீ கட்டுப்பாட்டை உதறும்போது[a], அவனுடைய நுகத்தை உன் கழுத்திலிருந்து முறித்துப் போடுவாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ அமைதியிழக்கும்போது.” תָּרִיד என்ற எபிரெய வினைச்சொல்லின் பொருள் உறுதியற்றது. தொடர்ந்து வரும் நுகத்தை முறித்துப் போடும் உருவகம், கட்டுப்பாட்டை உதறுதல் என்ற பொருளை ஆதரிக்கிறது; “அமைதியிழக்கும்போது” என்ற பொருளும் சாத்தியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל חַרְבְּךָ תִחְיֶה
  choice: உன் வாளினால் நீ வாழ்வாய்
  rationale: עַל இங்கு கருவிப்பொருளில் வருகிறது; חֶרֶב என்பதன் நேரடியான ‘வாள்’ உருவகத்தையும், அதையே வாழ்வாதாரமாக அல்லது உயிர்வாழும் வழியாகக் கொண்டிருப்பதையும் இவ்வாசகம் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְאֶת אָחִיךָ תַּעֲבֹד
  choice: உன் சகோதரனுக்குப் பணிசெய்வாய்
  rationale: עבד என்பதன் அடிப்படைப் பொருளான ‘பணிசெய்/சேவைசெய்’ என்பதைக் காக்கிறது; அந்தக் கீழ்ப்படிதலின் அரசியல் வடிவத்தை வசனம் கூறுவதற்கு அப்பால் வரையறுக்கவில்லை.
- source_word: וְהָיָה כַּאֲשֶׁר
  choice: ஆனால் ...போது
  rationale: எதிர்காலச் சூழலை அறிமுகப்படுத்தும் காலப்பொருளையும், முன் கூறிய பணிநிலையிலிருந்து வரும் எதிர்மறைத் திருப்பத்தையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: תָּרִיד
  choice: நீ கட்டறுத்துக்கொண்டு விடுபடும்போது
  rationale: இந்த அரிய வினைச்சொல்லின் பொருள் உறுதியற்றது. தொடர்ந்து வரும் நுகத்தை முறித்தெறியும் உருவகத்தோடு பொருந்துமாறு, கட்டுப்பாட்டிலிருந்து வலுவாக விடுபடுதலை இத்தேர்வு காட்டுகிறது; வேறு சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּפָרַקְתָּ עֻלּוֹ
  choice: அவனுடைய நுகத்தை ... முறித்தெறிவாய்
  rationale: פרק என்பதிலுள்ள வலுவாக முறித்து அகற்றும் கருத்தையும், עֹל என்பதன் நேரடியான ‘நுகம்’ உருவகத்தையும் காக்கிறது.
- source_word: מֵעַל צַוָּארֶךָ
  choice: உன் கழுத்திலிருந்து
  rationale: நுகம் கழுத்தின்மேல் இருப்பதையும் அங்கிருந்து அகற்றப்படுவதையும் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ஏசா தன் சகோதரனுடன் கொண்டிருக்கவிருக்கும் உறவின் தன்மை
  choice: முதலில் பணிநிலை, பின்னர் அந்த ஆதிக்கத்திலிருந்து வலுவாக விடுபடுதல் என வசனத்தின் பதற்றத்தை அப்படியே வைத்தல்
  alternative: இதை நிரந்தர அடிமைத்தனமாகவோ, வெறும் குடும்ப மரியாதையாகவோ விளக்கி மொழிபெயர்த்தல்
  rationale: எபிரெய உரை சகோதரனுக்குப் பணிசெய்வதையும் பின்னர் அவனுடைய நுகத்தை முறித்தெறிவதையும் கூறுகிறது. ஏதோம் பற்றிய பிற்கால இறையியல் முடிவுகளை இவ்வசனத்துக்குள் கொண்டுவராமல், கீழ்ப்படிதலும் பின்னர் விடுதலையும் ஆகிய இரண்டையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாய்வழியாகவும் தெளிவாகக் கேட்கும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘வாள்,’ ‘நுகம்,’ ‘கழுத்து’ ஆகிய மூல உருவகங்கள் பொதுவாகப் புரியும் வகையில் அப்படியே வைக்கப்பட்டுள்ளன; ‘முறித்தெறிவாய்’ வினைச்சொல் மூலத்தின் வலிமையைத் தக்கவைக்கிறது.
