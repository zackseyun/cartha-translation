revisions:
- from: உன் வாளினால் நீ வாழ்வாய்; உன் சகோதரனுக்குப் பணிசெய்வாய். ஆனால் நீ கட்டறுத்துக்கொண்டு விடுபடும்போது[a], அவனுடைய நுகத்தை உன் கழுத்திலிருந்து முறித்தெறிவாய்.
  to: உன் வாளினால் நீ வாழ்வாய்; உன் சகோதரனுக்குப் பணிபுரிவாய். ஆனால் நீ கட்டுப்பாட்டை உதறும்போது[a], அவனுடைய நுகத்தை உன் கழுத்திலிருந்து முறித்துப் போடுவாய்.
