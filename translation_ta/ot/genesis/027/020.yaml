  text: וַ/יֹּ֤אמֶר יִצְחָק֙ אֶל בְּנ֔/וֹ מַה זֶּ֛ה מִהַ֥רְתָּ לִ/מְצֹ֖א בְּנִ֑/י וַ/יֹּ֕אמֶר כִּ֥י הִקְרָ֛ה יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/020.yaml
  text: Then Isaac said to his son[a], “How is it that you found it so quickly, my son?” And he said[b], “Because Yahweh your God caused it to happen before me.”
translation:
  language: ta
  text: அப்போது ஈசாக்கு தன் மகனிடம், “என் மகனே, இவ்வளவு சீக்கிரமாக அதை எப்படிக் கண்டுபிடித்தாய்?” என்று கேட்டான். அதற்கு அவன், “உங்கள் கடவுளாகிய யாவே அதை எனக்குக் கிடைக்கச் செய்தார்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அதை என் முன்னே நேரிடச் செய்தார்”; அல்லது, “எனக்கு வெற்றி கிடைக்கச் செய்தார்.”'
    reason: הִקְרָה ... לְפָנַי என்ற சொற்றொடர், ஒரு நிகழ்வை ஒருவருக்கு நேரும்படி செய்தல் அல்லது அவருக்கு அது கிடைக்க வழிசெய்தல் என்ற பொருள்களை ஏற்கக்கூடும்.
lexical_decisions:
- source_word: מַה זֶּה מִהַרְתָּ לִמְצֹא
  choice: இவ்வளவு சீக்கிரமாக அதை எப்படிக் கண்டுபிடித்தாய்?
  rationale: மַה זֶּה வியப்புடன் கூடிய கேள்வியை அறிமுகப்படுத்துகிறது; மִהַרְתָּ לִמְצֹא என்பதன் இயல்பான தமிழ் பொருள், சூழலில் மறைந்துள்ள வேட்டைப் பொருளைக் குறிக்க ‘அதை’ என்பதைச் சேர்த்து, ‘இவ்வளவு சீக்கிரமாகக் கண்டுபிடித்தாய்’ என வழங்கப்பட்டுள்ளது.
- source_word: בְּנִי
  choice: என் மகனே
  rationale: முதல் நபர் ஒருமை உடைமைப் பின்னொட்டையும் அன்பான நேரடி அழைப்பையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: הִקְרָה ... לְפָנַי
  choice: அதை எனக்குக் கிடைக்கச் செய்தார்
  rationale: הִקְרָה என்பதன் causative பொருளையும் லְפָנַי என்பதன் இச்சூழலுக்குரிய ‘எனக்காக/என் முன்னே’ என்ற நுணுக்கத்தையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது; சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டமல்ல, எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயர்; ஆகவே தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֱלֹהֶיךָ
  choice: உங்கள் கடவுள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமைப் பின்னொட்டின் ‘உன் கடவுள்’ என்ற முக்கியமான வேறுபாட்டைத் தக்கவைக்கிறது; தந்தையிடம் பேசுவதற்குரிய நவீன மரியாதைத் தமிழில் ‘உங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைத் தக்கவைக்கிறது.
- issue: הִקְרָה ... לְפָנַי என்பதில் இறைச் செயற்பாட்டின் நுணுக்கம்
  choice: அதை எனக்குக் கிடைக்கச் செய்தார்
  alternative: அதை என் முன்னே நேரிடச் செய்தார்
  rationale: யாக்கோபின் கூற்று நிகழ்வைத் தெய்வீகச் செயற்பாட்டுடன் தொடர்புபடுத்துகிறது. ‘வெற்றி கொடுத்தார்’ என்று விரிவுபடுத்தாமல் causative பொருளைத் தக்கவைத்து, எபிரெய மொழியின் இடவியல் வடிவத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. தந்தையிடம் மகன் பேசுவதால் ‘உங்கள்’ என்ற மரியாதைப் பன்மை தேர்ந்தெடுக்கப்பட்டுள்ளது; ஆனால் மூலத்தின் இரண்டாம் நபர் குறிப்பு—‘உங்கள் கடவுள்’, ‘என் கடவுள்’ அல்ல—முழுமையாகப் பாதுகாக்கப்பட்டுள்ளது.
