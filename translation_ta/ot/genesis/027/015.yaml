revisions:
- from: பின்பு ரெபெக்காள், வீட்டில் தன்னிடம் இருந்த தன் மூத்த மகன் ஏசாவின் சிறந்த ஆடைகளை[a] எடுத்து, தன் இளைய மகன் யாக்கோபுக்கு உடுத்தினாள்.[b]
  to: பின்பு ரெபெக்காள், வீட்டில் தன்னிடம் இருந்த தன் மூத்த மகனான ஏசாவின் சிறந்த ஆடைகளை[a] எடுத்து, தன் இளைய மகனான யாக்கோபுக்கு அணிவித்தாள்.
  rationale: The revision replaces the less idiomatic causative clothing expression with ‘அணிவித்தாள்,’ directly reflecting the Hebrew verb. It also removes the redundant and uninformative second footnote while retaining the useful lexical alternative for the description of Esau’s garments.
