translation_notes:
  register: நவீனத் தரத் தமிழில், கதைநடைக்கு ஏற்ற கண்ணியமான மற்றும் பொதுமக்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மூத்த மகன்—இளைய மகன்’ என்ற எதிரிணை தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது; மூலத்தின் ‘தன்னிடம் வீட்டில் இருந்த’ என்ற அமைப்பு இயல்பான தமிழ் சொல் வரிசையில் தரப்பட்டுள்ளது.
