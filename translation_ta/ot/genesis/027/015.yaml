  text: וַ/תִּקַּ֣ח רִ֠בְקָה אֶת בִּגְדֵ֨י עֵשָׂ֜ו בְּנָ֤/הּ הַ/גָּדֹל֙ הַ/חֲמֻדֹ֔ת אֲשֶׁ֥ר אִתָּ֖/הּ בַּ/בָּ֑יִת וַ/תַּלְבֵּ֥שׁ אֶֽת יַעֲקֹ֖ב בְּנָ֥/הּ הַ/קָּטָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/015.yaml
  text: Then Rebekah took the choice garments of Esau her older son[a], which were with her in the house[b], and put them on Jacob her younger son.
translation:
  language: ta
  text: பின்பு ரெபெக்காள், வீட்டில் தன்னிடம் இருந்த தன் மூத்த மகனான ஏசாவின் சிறந்த ஆடைகளை[a] எடுத்து, தன் இளைய மகனான யாக்கோபுக்கு அணிவித்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விரும்பத்தக்க ஆடைகளை’; இச்சொல் ‘மதிப்புமிக்க’ அல்லது ‘தேர்ந்தெடுக்கப்பட்ட’ என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: பின்பு ... எடுத்து
  rationale: வாவ் தொடர் வடிவம் கதையின் அடுத்த நிகழ்வைக் குறிக்கிறது; நவீன தமிழில் ‘பின்பு’ இயல்பாக நிகழ்ச்சி வரிசையை வெளிப்படுத்துகிறது.
- source_word: בִּגְדֵי
  choice: ஆடைகளை
  rationale: பன்மையிலுள்ள இச்சொல் அணியும் உடைகளைக் குறிக்கிறது; ‘ஆடைகள்’ இயல்பானதும் கண்ணியமானதும் ஆகும்.
- source_word: הַחֲמֻדֹת
  choice: சிறந்த
  rationale: விரும்பத்தக்க, மதிப்புமிக்க அல்லது தேர்ந்தெடுக்கப்பட்ட தன்மையை இச்சொல் குறிக்கிறது. ஆடைகளைக் குறிக்கும் இச்சூழலில் ‘சிறந்த’ என்பது இயல்பாகப் பொருளைத் தருகிறது; ‘விலைமதிப்புள்ள’ என்று கூறி பொருட்செல்வத்தை மிகைப்படுத்தவில்லை.
- source_word: בְּנוֹ הַגָּדֹל
  choice: தன் மூத்த மகன்
  rationale: குடும்பச் சூழலில் גָּדוֹל வயதில் மூத்தவரைக் குறிக்கிறது; பின்னுள்ள קָטָן என்பதற்கு இணையாக ‘மூத்த மகன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲשֶׁר אִתָּהּ בַּבָּיִת
  choice: வீட்டில் தன்னிடம் இருந்த
  rationale: எபிரெய உரையின் இடம் மற்றும் உடைமை சார்ந்த தெளிவினை இயல்பான தமிழில் காக்கிறது; ‘வைத்திருந்த’ என்பது திட்டமிட்டுப் பாதுகாத்தல் என்ற கூடுதல் நுண்பொருளைத் தரக்கூடும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: וַתַּלְבֵּשׁ
  choice: உடுத்தினாள்
  rationale: ஒருவருக்கு ஆடையை அணிவித்தல் என்பதே வினையின் பொருள். தமிழில் ‘யாக்கோபுக்கு உடுத்தினாள்’ என்பது இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: בְּנוֹ הַקָּטָן
  choice: தன் இளைய மகன்
  rationale: קָטָן இங்கு உடல் அளவைக் குறிக்காமல், ஏசாவுடன் ஒப்பிடும்போது வயதில் இளைய சகோதரனைக் குறிக்கிறது.
