translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் ஈசாக்கின் மேற்கோளுக்கான இரட்டைப்புள்ளியுடன் முடிகிறது; மூலத்தின் பங்கேற்புவினைத் தன்மை ‘பேசிக்கொண்டிருந்ததை’ என்பதில் காக்கப்பட்டுள்ளது.
