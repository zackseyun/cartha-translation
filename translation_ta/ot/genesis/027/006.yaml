reference: Genesis 27:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/רִבְקָה֙ אָֽמְרָ֔ה אֶל יַעֲקֹ֥ב בְּנָ֖/הּ לֵ/אמֹ֑ר הִנֵּ֤ה שָׁמַ֨עְתִּי֙ אֶת אָבִ֔י/ךָ מְדַבֵּ֛ר אֶל עֵשָׂ֥ו אָחִ֖י/ךָ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/006.yaml
  text: And Rebekah said to Jacob her son[a], “Look, I heard your father speaking to Esau your brother, saying,”
translation:
  language: ta
  text: 'ரெபெக்காள் தன் மகன் யாக்கோபிடம் சொன்னாள்: “இதோ, உன் தந்தை உன் சகோதரன் ஏசாவிடம் பேசிக்கொண்டிருந்ததை நான் கேட்டேன்; அவர் இவ்வாறு சொன்னார்:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/רִבְקָה
  choice: ரெபெக்காள்
  rationale: வாவ் இணைப்பைத் தமிழில் தனியே ‘மற்றும்’ என்று கொடுப்பது இயல்பற்றதால், தொடரும் கதைநடையால் அது உணரப்படுமாறு விடப்பட்டுள்ளது; பெயர் வழக்கமான தமிழ் வடிவில் தரப்பட்டுள்ளது.
- source_word: אָֽמְרָה אֶל יַעֲקֹב בְּנָהּ
  choice: தன் மகன் யாக்கோபிடம்
  rationale: ‘தன் மகன்’ என்ற உடைமை உறவையும் யாக்கோபை அடையாளப்படுத்தும் இணைப்பையும் இயல்பான தமிழ் சொல் வரிசையில் காக்கிறது; ‘சொன்னாள்’ என்பது மேற்கோளைத் தொடங்கும் நிறுத்தக்குறியால் தெளிவாக வெளிப்படுகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: அடுத்து சொல்லப்படுவதற்குக் கவனம் ஈர்க்கும் எபிரேய இடைச்சொல்லின் பொருளை dignified, current Tamil-இல் இயல்பாகக் காட்டுகிறது.
- source_word: שָׁמַעְתִּי
  choice: நான் கேட்டேன்
  rationale: முடிந்த இறந்தகாலச் செயலை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: אֶת אָבִיךָ מְדַבֵּר
  choice: உன் தந்தை ... பேசிக்கொண்டிருந்ததை
  rationale: பேசுதல் நடந்துகொண்டிருந்த நிலையிலேயே ரெபெக்காள் கேட்டாள் என்பதைக் குறிக்கும் பங்கேற்புவினையின் தொடர்ச்சித் தன்மையைப் பாதுகாக்கிறது.
- source_word: אֶל עֵשָׂו אָחִיךָ
  choice: உன் சகோதரன் ஏசாவிடம்
  rationale: אֶל என்பதன் நோக்குத் திசையையும், ஏசா யாக்கோபின் சகோதரன் என்ற இணைப்பையும் தெளிவாகக் காக்கிறது.
- source_word: לֵאמֹר
  choice: 'அவர் சொன்னது:'
  rationale: அடுத்த வசனத்தில் வரும் உட்பொதிந்த நேரடி மேற்கோளைத் தெளிவாக அறிமுகப்படுத்துகிறது; தமிழில் இயல்பற்ற ‘சொல்லி’ மீளுரைப்பைத் தவிர்க்கிறது.
