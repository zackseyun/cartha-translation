review_pass:
  verdict: revise
  source_fidelity: 'The identification, the claimed obedience, the game, and the idiomatic force of נַפְשֶׁךָ are substantially represented. However, the final purpose clause is misconstrued in the Tamil syntax: “இப்படிச் செய்யுங்கள்” makes Jacob ask Isaac to do an unspecified action in order to bless him, whereas the Hebrew asks him to eat the game so that he may bless Jacob.'
  naturalness: The current final sentence is not natural Tamil because the purpose expression is followed by an unanchored “இப்படிச் செய்யுங்கள்.” Reordering the purpose phrase before the requests gives a clear and natural modern Tamil sentence while retaining the source’s meaning.
  terminology: “தகப்பன்,” “மூத்த மகன்,” “வேட்டையுணவு,” and “ஆசீர்வதிக்க” fit the narrative and biblical register. Rendering נֶפֶשׁ idiomatically as “நீங்களே” is appropriate; the footnote responsibly records the literal form.
  issues:
  - severity: high
    issue: The purpose clause is syntactically and semantically mislinked.
    rationale: 'The Hebrew בַּעֲבוּר תְּבָרֲכַנִּי נַפְשֶׁךָ modifies Isaac’s eating: Jacob asks him to eat so that he may bless Jacob. “நீங்களே என்னை ஆசீர்வதிக்கும்படி இப்படிச் செய்யுங்கள்” instead introduces “do this,” which has no Hebrew counterpart and obscures what the purpose applies to.'
