  text: וַ/יֹּ֨אמֶר יַעֲקֹ֜ב אֶל אָבִ֗י/ו אָנֹכִי֙ עֵשָׂ֣ו בְּכֹרֶ֔/ךָ עָשִׂ֕יתִי כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתָּ אֵלָ֑/י קֽוּם נָ֣א שְׁבָ֗/ה וְ/אָכְלָ/ה֙ מִ/צֵּידִ֔/י בַּ/עֲב֖וּר תְּבָרֲכַ֥/נִּי נַפְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/019.yaml
  text: And Jacob said to his father[a], “I am Esau your firstborn. I have done as you told me. Please rise, sit, and eat from my game[b], so that your soul may bless me.”
translation:
  language: ta
  text: யாக்கோபு தன் தகப்பனிடம், “நான்தான் உங்கள் மூத்த மகன் ஏசா. நீங்கள் என்னிடம் சொன்னபடியே செய்தேன். நீங்களே[a] என்னை ஆசீர்வதிக்கும்படி, தயவுசெய்து எழுந்து அமர்ந்து என் வேட்டையுணவைச் சாப்பிடுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, ‘உங்கள் உயிர் என்னை ஆசீர்வதிக்கும்படி.’ இங்கு ‘உயிர்’ என்பது அந்த நபரையே குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי עֵשָׂו בְּכֹרֶךָ
  choice: நான்தான் உங்கள் மூத்த மகன் ஏசா
  rationale: அடையாளப்படுத்தும் வினையற்ற எபிரெய வாக்கியத்தையும் யாக்கோபின் நேரடியான பொய்க்கூற்றையும் இயல்பான தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: நீங்கள் என்னிடம் சொன்னபடியே செய்தேன்
  rationale: ‘என்னிடம் பேசியபடி’ என்ற சொற்சொல் வடிவத்தைவிட, முந்தைய கட்டளைக்குக் கீழ்ப்படிந்ததாகக் கூறும் பொருளை இன்றைய தமிழில் இயல்பாகத் தருகிறது.
- source_word: קוּם נָא שְׁבָה
  choice: தயவுசெய்து எழுந்து உட்கார்ந்து
  rationale: נָא என்பதன் பணிவான வேண்டுகோள் தொனியையும், அடுத்தடுத்து வரும் இரு கட்டளைகளையும் பாதுகாக்கிறது.
- source_word: וְאָכְלָה מִצֵּידִי
  choice: என் வேட்டையுணவைச் சாப்பிடுங்கள்
  rationale: צַיִד என்பது இங்கு வேட்டையில் கிடைத்த உணவைக் குறிக்கிறது; ‘வேட்டையுணவு’ சுருக்கமாகவும் சூழலுக்கேற்றவாறும் உள்ளது.
- source_word: תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: நீங்களே என்னை ஆசீர்வதிக்கும்படி
  rationale: נֶפֶשׁ இங்கு தனியாகச் செயல்படும் ‘ஆத்துமா’ குறித்த மானிடவியல் கூற்றல்ல; முழு நபரைச் சுட்டும் எபிரெய மரபுத்தொடர். ‘நீங்களே’ அதன் நபர்சார் வலியுறுத்தலை இயல்பான தமிழில் தெரிவிக்கிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: תְּבָרֲכַנִּי נַפְשֶׁךָ என்பதில் נֶפֶשׁ-ஐ மொழிபெயர்த்தல்
  choice: நீங்களே என்னை ஆசீர்வதிக்கும்படி
  alternative: உங்கள் உயிர் என்னை ஆசீர்வதிக்கும்படி
  rationale: ‘உயிர்/ஆத்துமா’ என்று சொற்சொல்லாக மொழிபெயர்த்தால், மூலத்தில் நோக்கமில்லாத தனி ஆன்மீக உறுப்பைப் பற்றிய கருத்தைத் தமிழில் உருவாக்கக்கூடும். நபரையே குறிக்கும் மரபுத்தொடரின் பொருளை முதன்மை உரை தருகிறது; மூலத்தின் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. ‘தகப்பன்’ வேதாகமக் கதைநடைக்கு உரிய கண்ணியத்தைத் தக்கவைக்கிறது; மற்ற வாக்கிய அமைப்பு சாதாரண வாசகருக்குப் புரியும் இயல்பான நடையில் உள்ளது. மூலத்திலுள்ள ‘எழுந்து—உட்கார்’ என்ற சற்றே எதிர்மாறாகத் தோன்றும் வரிசை விளக்கித் தீர்க்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
