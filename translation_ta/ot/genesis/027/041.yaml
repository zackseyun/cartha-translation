base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/041.yaml
  text: And Esau hated Jacob because of the blessing with which his father had blessed him[a], and Esau said in his heart, “The days of mourning for my father are drawing near[c][b]; then I will kill Jacob my brother.”
translation:
  language: ta
  text: 'ஏசா, தன் தகப்பன் யாக்கோபை ஆசீர்வதித்த அந்த ஆசீர்வாதத்தின் காரணமாக, யாக்கோபின்மீது பகைமை கொண்டான்[a]. ஏசா தன் உள்ளத்தில் சொல்லிக்கொண்டான்[b]: “என் தகப்பனுக்காகத் துக்கம் அனுசரிக்கும் நாட்கள் நெருங்குகின்றன[c]; அதன்பின் என் சகோதரன் யாக்கோபைக் கொன்றுவிடுவேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாக்கோபை வெறுத்தான்.” எபிரெய வினைச்சொல் கணநேர உணர்ச்சியை மட்டும் அல்லாமல் நீடித்த விரோதத்தையும் பகைமையையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “தன் இருதயத்தில் சொன்னான்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “என் தகப்பனுடைய துக்க நாட்கள் நெருங்குகின்றன.” இது ஈசாக்கின் மரணத்துக்குப் பின் அவருக்காக அனுசரிக்கப்படும் துக்கத்தையோ, ஈசாக்கே அனுபவிக்கும் துக்கக் காலத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂטֹם
  choice: பகை கொண்டான்
  rationale: שׂטם என்பது கணநேர வெறுப்பை மட்டும் அல்லாமல் நீடித்த பகைமையையும் விரோதத்தையும் குறிக்கிறது. ‘பகை கொண்டான்’ என்பது நவீனத் தமிழில் இயல்பாகவும் சூழலுக்கேற்ற வலிமையுடனும் உள்ளது.
- source_word: עַל הַבְּרָכָה
  choice: அந்த ஆசீர்வாதத்தின் காரணமாக
  rationale: עַל இங்கு காரணத்தைக் குறிக்கிறது. ‘காரணமாக’ என்பது ஏசாவின் பகைமைக்கான காரணத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר בֵּרֲכוֹ אָבִיו
  choice: தன் தகப்பன் யாக்கோபை ஆசீர்வதித்த
  rationale: எபிரெயத்தில் ஆசீர்வாதம் என்ற பெயர்ச்சொல்லோடு ஆசீர்வதித்தல் என்ற வினையும் மீண்டும் வருகிறது. தமிழிலும் அந்தச் சொல்லாட்சியைத் தக்கவைத்து, ஆசீர்வாதம் யாக்கோபுக்குக் கொடுக்கப்பட்டது என்பதைத் தெளிவாக்குகிறது.
- source_word: בְּלִבּוֹ
  choice: தன் உள்ளத்தில் சொல்லிக்கொண்டான்
  rationale: சொல்லுக்கு நெருக்கமாக ‘தன் உள்ளத்தில்’ என்பதையும், இது வெளிப்படையாகச் சொன்ன வார்த்தை அல்ல, மனத்திற்குள் செய்த தீர்மானம் என்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יִקְרְבוּ יְמֵי אֵבֶל אָבִי
  choice: என் தகப்பனுக்காகத் துக்கம் அனுசரிக்கும் நாட்கள் நெருங்குகின்றன
  rationale: இது ஈசாக்கின் மரணத்துக்குப் பின் அவருக்காக அனுசரிக்கப்படும் துக்க நாட்கள் நெருங்குவதாகப் புரிந்துகொள்ளப்படும் முதன்மையான வாசிப்பு. ஆனாலும் எபிரெயக் கட்டமைப்பிலுள்ள மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְאַהַרְגָה
  choice: அதன்பின் ... கொன்றுவிடுவேன்
  rationale: இவ்வடிவம் ஏசாவின் உறுதியான நோக்கத்தை வெளிப்படுத்துகிறது. ‘அதன்பின்’ என்பது முந்தைய துக்க நாட்களுக்குப் பிறகு செயல்படுவான் என்ற சூழல்சார் காலத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: אָחִי
  choice: என் சகோதரன்
  rationale: எபிரெயத்தில் உள்ள உடைமைச் சுட்டைத் தக்கவைக்கிறது; குடும்பத்துக்குள் நிகழவிருக்கும் வன்முறையின் துயரத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தகப்பனுடைய துக்க நாட்கள் என்பதன் பொருள்
  choice: ஈசாக்கின் மரணத்துக்குப் பின் அவருக்காக அனுசரிக்கப்படும் துக்க நாட்கள்
  alternative: ஈசாக்கே துக்கம் அனுசரிக்கும் நாட்கள்
  rationale: சூழலில் ஏசா தன் தகப்பனின் மரணத்தை எதிர்பார்த்து, அதன் பின்னர் யாக்கோபைக் கொல்லத் திட்டமிடுவது முதன்மையான புரிதல். இருப்பினும் எபிரெயத் தொடர் இரண்டாவது பொருளுக்கும் இடமளிப்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தகப்பன்’, ‘ஆசீர்வாதம்’, ‘துக்கம் அனுசரித்தல்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் இயல்பான வாக்கிய அமைப்பில் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் தொடர்ச்சியான பகைமை மற்றும் துக்க நாட்கள் குறித்த உண்மையான பொருள் இருமை பாதுகாக்கப்பட்டுள்ளன.
