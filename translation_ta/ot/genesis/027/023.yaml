source:
  edition: WLC
  text: וְ/לֹ֣א הִכִּיר֔/וֹ כִּֽי הָי֣וּ יָדָ֗י/ו כִּ/ידֵ֛י עֵשָׂ֥ו אָחִ֖י/ו שְׂעִרֹ֑ת וַֽ/יְבָרְכֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/023.yaml
  text: And he did not recognize him[a], because his hands were hairy like the hands of his brother Esau; so he blessed him.
translation:
  language: ta
  text: அவனுடைய கைகள் அவனுடைய சகோதரன் ஏசாவின் கைகளைப் போல மயிரடர்ந்திருந்ததால், அவர் அவனை அடையாளம் கண்டுகொள்ளவில்லை; ஆகவே[a] அவனை ஆசீர்வதித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனை ஆசீர்வதித்தார்.” எபிரெயக் கதை வடிவம் இங்கு நிகழ்வுகளின் எளிய தொடர்ச்சியாக மொழிபெயர்க்கப்படலாம்; எனினும், முந்தைய நிகழ்வின் விளைவையும் இது உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכִּירוֹ
  choice: அவனை அடையாளம் கண்டுகொள்ளவில்லை
  rationale: நכר என்பதன் ஹிஃபில் வடிவம் இங்கு ஒருவரைத் தொட்டு அறிந்துகொள்ளுதல் அல்லது அடையாளம் காணுதல் என்ற பொருளைத் தருகிறது. ஈசாக்கு யாக்கோபை அடையாளம் காணத் தவறிய சூழலை இச்சொற்றொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: …இருந்ததால்
  rationale: כִּי இங்கு ஈசாக்கு அவனை அடையாளம் கண்டுகொள்ளாததற்கான காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் காரணத்தை இயல்பாகக் காட்ட வாக்கிய இறுதியில் ‘இருந்ததால்’ என அமைக்கப்பட்டுள்ளது.
- source_word: יָדָיו
  choice: அவனுடைய கைகள்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியுடன் வரும் பன்மைப் பெயர்ச்சொல்லின் நேரான மொழிபெயர்ப்பு; சூழலில் இது யாக்கோபின் கைகளைக் குறிக்கிறது.
- source_word: כִּידֵי
  choice: கைகளைப் போல
  rationale: כ முன்னொட்டு ஒப்புமையைக் குறிக்கிறது. ‘கைகளைப் போல’ என்பது அந்த ஒப்புமையைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אָחִיו
  choice: அவனுடைய சகோதரன்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியுடன் வரும் உறவுமுறைச் சொல்லை நேரடியாகப் பிரதிபலிக்கிறது; இது யாக்கோபின் சகோதரனாகிய ஏசாவைக் குறிக்கிறது.
- source_word: שְׂעִרֹת
  choice: மயிரடர்ந்திருந்ததால்
  rationale: கைகளின் தொட்டுணரக்கூடிய தன்மையை விவரிக்கும் ‘மயிருள்ள’ என்ற கருத்தை, இச்சூழலில் இயல்பான நவீனத் தமிழில் ‘மயிரடர்ந்த’ எனத் தருகிறது.
- source_word: וַיְבָרְכֵהוּ
  choice: ஆகவே அவனை ஆசீர்வதித்தார்
  rationale: வாவ் தொடர்வினை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; இங்கு அடையாளம் கண்டுகொள்ளத் தவறியதன் விளைவாக ஆசீர்வதித்தார் என்ற ஓட்டத்தையும் உணர்த்தலாம். ‘ஆகவே’ அந்த விளைவுத் தொடர்பை வெளிப்படுத்துகிறது; எளிய தொடர்ச்சியாகவும் இதை வாசிக்க முடியும் என்பதைக் காலடிக்குறிப்பு பதிவு செய்கிறது.
theological_decisions:
- issue: வַיְבָרְכֵהוּ என்பதில் கதைத் தொடர்ச்சிக்கும் விளைவுத் தொடர்புக்கும் இடையிலான நுட்பம்
  choice: ஆகவே அவனை ஆசீர்வதித்தார்
  alternative: அவனை ஆசீர்வதித்தார்
  rationale: எபிரெய வாவ் தொடர்வினை அடிப்படையில் நிகழ்வுகளின் தொடர்ச்சியைச் சுட்டுகிறது; இச்சூழலில் ஈசாக்கு யாக்கோபை அடையாளம் காணாததற்குப் பின் ஆசீர்வதித்ததால் விளைவுத் தொடர்பும் உணரப்படுகிறது. முதன்மை உரை இதை வெளிப்படுத்துகிறது; மாற்று வாசிப்பு காலடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் சுட்டுப்பெயர்கள் பாதுகாக்கப்பட்டுள்ளன; ஈசாக்கைக் குறிக்கும் எழுவாய்க்கு மரியாதைப் பன்மையான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது. காரணவாக்கியம் தமிழின் இயல்பான சொல்வரிசைக்கேற்ப முன்வைக்கப்பட்டுள்ளது.
