lexical_decisions:
- source_word: וַיָּבֹא
  choice: சென்று
  rationale: בוא என்ற வினை இங்கு யாக்கோபு தன் தகப்பன் இருக்கும் இடத்திற்குள் செல்வதைக் குறிக்கிறது; தமிழ் நடையில் “சென்று” இயல்பாகக் காட்சியை முன்னெடுக்கிறது.
- source_word: אֶל אָבִיו
  choice: தன் தகப்பனிடம்
  rationale: אֶל திசையையும் அணுகுதலையும் குறிக்கிறது; “தன் தகப்பனிடம்” என்பது பெயரைச் சேர்க்காமல் எபிரெய உரையைத் துல்லியமாகப் பிரதிபலிக்கிறது.
- source_word: וַיֹּאמֶר
  choice: என்றான் / என்றார்
  rationale: பேச்சை அறிமுகப்படுத்தும் வழக்கமான எபிரெயச் சொற்றொடர்; தமிழில் பேசுபவர்களின் பாலினம் மற்றும் மரியாதை நிலைக்கு ஏற்றவாறு வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: אָבִי
  choice: என் தகப்பனே
  rationale: முதல் நபர் ஒருமை உடைமைப் பின்னொட்டையும் நேரடி அழைப்பையும் காக்கிறது.
- source_word: הִנֶּנִּי
  choice: இதோ, நான் இருக்கிறேன்
  rationale: உடனிருப்பையும் பதிலளிக்கத் தயாராக இருப்பதையும் உணர்த்தும் எபிரெயப் பதில் மரபை நெருக்கமாகக் காக்கிறது.
- source_word: מִי אַתָּה
  choice: நீ யார்
  rationale: கேட்பவரின் அடையாளத்தை நேரடியாக விசாரிக்கும் மூலமொழி அமைப்பைத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: בְּנִי
  choice: என் மகனே
  rationale: முதல் நபர் ஒருமை உடைமைப் பின்னொட்டையும் விளி வடிவிலான அன்பான அழைப்பையும் காக்கிறது.
