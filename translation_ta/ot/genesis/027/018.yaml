  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. “தகப்பன்” என்பது ஆதியாகமக் கதையாடலுக்கு ஏற்ற வேதாகமக் கண்ணிய நடையைத் தக்கவைக்கிறது; உரையாடலில் மரியாதையைக் காட்ட ஈசாக்கைக் குறிக்கும் வினைமுற்று “என்றார்” என அமைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு தொடர்புடைய முதல் பேச்சுவினைக்குப் பின் இடம்பெற்றுள்ளது.
