source:
  edition: WLC
  text: וְ/יָשַׁבְתָּ֥ עִמּ֖/וֹ יָמִ֣ים אֲחָדִ֑ים עַ֥ד אֲשֶׁר תָּשׁ֖וּב חֲמַ֥ת אָחִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/044.yaml
  text: And stay with him for a few days[a], until your brother's fury turns away.
translation:
  language: ta
  text: உன் சகோதரனின் கடுங்கோபம் தணியும்வரை, நீ அவனோடு சில நாட்கள் தங்கியிரு.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: தங்கியிரு
  rationale: ישׁב என்பதற்கு ‘அமர், குடியிரு, தங்கியிரு’ என்ற பொருள்கள் உண்டு. இங்கே ரெபெக்காள் யாக்கோபை லாபானோடு தற்காலிகமாக இருக்கச் சொல்வதால், இயல்பான நவீனத் தமிழில் ‘தங்கியிரு’ பொருத்தமானது.
- source_word: עִמּוֹ
  choice: அவனோடு
  rationale: עם என்ற முன்னிடைச்சொல்லின் மூன்றாம் நபர் ஆண்பால் ஒருமை வடிவம் ‘அவனோடு’ என நேரடியாகப் பொருள்படும்; உடனடிச் சூழலில் இது லாபானைக் குறிக்கிறது.
- source_word: יָמִים אֲחָדִים
  choice: சில நாட்கள்
  rationale: சொல்லுக்கு சொல் ‘நாட்கள், சில’ என்று வரும் எபிரெய மரபுத்தொடரை, அதன் குறுகிய தற்காலிக கால அளவைப் பாதுகாத்து இயல்பான தமிழில் ‘சில நாட்கள்’ என்று மொழிபெயர்த்துள்ளது.
- source_word: עַד אֲשֶׁר
  choice: தணியும்வரை
  rationale: இந்தச் சேர்க்கை ஒரு செயல் நீடிக்கும் காலத்தின் முடிவைக் குறிக்கும் ‘வரை’ என்ற பொருளைத் தருகிறது; அடுத்துள்ள வினையோடு இணைத்து தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: תָּשׁוּב
  choice: தணியும்
  rationale: שׁוב என்பதன் அடிப்படைப் பொருள் ‘திரும்பு/திரும்பிச் செல்.’ கடுங்கோபத்தை எழுவாயாகக் கொண்ட இச்சூழலில், கோபம் விலகுதல் அல்லது அடங்குதல் என்ற மரபுவழிப் பொருளை இயல்பான தமிழில் ‘தணியும்’ தெரிவிக்கிறது.
- source_word: חֲמַת
  choice: கடுங்கோபம்
  rationale: חֵמָה தீவிரமான, எரியும் கோபத்தைக் குறிக்கிறது. ‘கடுங்கோபம்’ அதன் வலிமையைத் தெளிவாகவும் பொதுவாகப் புரியுமாறும் வெளிப்படுத்துகிறது.
- source_word: אָחִיךָ
  choice: உன் சகோதரனின்
  rationale: இணைப்புநிலைச் சொற்றொடர் ‘உன் சகோதரனுடைய கடுங்கோபம்’ என்ற உடைமைப் பொருளைத் தருகிறது; ‘உன் சகோதரனின்’ என்பது சுருக்கமான இயல்பான வடிவம்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘தங்கியிரு’ தற்காலிக வாழ்வைக் குறிக்கிறது; ‘கடுங்கோபம் தணியும்’ என்பது எபிரெய வினையின் சொல்லுருவை விட அதன் சூழல்சார் மரபுப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
