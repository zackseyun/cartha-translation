translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதக் கதைநடைக்கு ஏற்ற கண்ணியத்துடனும் மொழியாக்கப்பட்டுள்ளது. எபிரெய வினை–பெயர் மீளுருவாக்கத்தின் தீவிரம் முதன்மை உரையில் இயல்பான தமிழாகவும், அதன் வடிவம் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
