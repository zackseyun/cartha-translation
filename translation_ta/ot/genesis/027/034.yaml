base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/034.yaml
  text: When Esau heard his father’s words[a], he cried out with an exceedingly great and bitter cry, and said to his father, “Bless me too, my father!”
translation:
  language: ta
  text: ஏசா தன் தந்தையின் வார்த்தைகளைக் கேட்டபோது, மிகவும் பெரியதும் கசப்பானதுமான ஒரு கதறலை எழுப்பினான்.[a] பின்பு அவன் தன் தந்தையிடம், “என் தந்தையே, என்னையும் ஆசீர்வதியுங்கள்!” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்கு நெருக்கமாக: “மிகப் பெரியதும் கசப்பானதுமான ஒரு கதறலை மிகுந்த அளவில் கதறினான்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: கேட்டபோது
  rationale: כִּי உடன் வரும் வினையெச்ச அமைப்பு காலச் சூழலைக் குறிக்கிறது. ‘கேட்டபோது’ என்பது உடனடித்தன்மையை அளவுக்கு மீறி வலியுறுத்தாமல் நிகழ்வுகளின் தொடரைப் இயல்பாகத் தருகிறது.
- source_word: דִּבְרֵי אָבִיו
  choice: தன் தந்தையின் வார்த்தைகள்
  rationale: דָּבָר என்பதன் நேரடியான ‘வார்த்தைகள்’ என்ற பொருளைப் பேணுவதோடு, தமிழில் எழுவாயைக் குறிக்கும் இயல்பான தற்சுட்டுப் பெயரடையான ‘தன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּצְעַק צְעָקָה
  choice: ஒரு கதறலை எழுப்பினான்
  rationale: எபிரெய வினை–பெயர் ஒருசொல் அமைப்பு செயலை வலுப்படுத்துகிறது. தமிழில் ‘கதறலைக் கதறினான்’ என்பது செயற்கையாக ஒலிப்பதால், உணர்ச்சியின் தீவிரத்தைப் பேணும் இயல்பான சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது; நேரடி அமைப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: גְּדֹלָה
  choice: பெரிதும்
  rationale: ‘பெரிய’ என்ற அடிப்படைப் பொருளையும், கதறலின் அளவு மற்றும் தீவிரம் ஆகிய இரண்டையும் திறந்தவாறு வைத்திருக்கிறது; ‘உரத்த’ என்று ஒலியளவுக்கு மட்டும் சுருக்கவில்லை.
- source_word: וּמָרָה
  choice: கசப்புமான
  rationale: மனவேதனையைக் குறிக்கும் ‘கசப்பான’ என்ற நேரடி உருவகப் பொருளைத் தக்கவைக்கிறது; அதை ‘துயரமான’ என விளக்கமாக மாற்றவில்லை.
- source_word: עַד מְאֹד
  choice: மிகவும்
  rationale: முந்திய வருணனையின் தீவிரத்தை உச்சப்படுத்தும் எபிரெய மரபுத்தொடருக்கு இயல்பான தமிழ் தீவிரப்படுத்தியாக உள்ளது.
- source_word: בָּרֲכֵנִי
  choice: என்னையும் ஆசீர்வதியுங்கள்
  rationale: கட்டளை வடிவத்தின் நேரடியான வேண்டுகோளைப் பேணுகிறது. தமிழின் மரியாதைப் பன்மை தந்தையிடம் மகன் பேசும் சூழலுக்கு இயல்பானது; பல நபர்களைக் குறிப்பதல்ல.
- source_word: גַּם אָנִי
  choice: என்னையும்
  rationale: தானும் ஆசீர்வாதம் பெற வேண்டும் என்ற ஏசாவின் வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אָבִי
  choice: என் தந்தையே
  rationale: முதலாம் நபர் உடைமை விகுதியையும் நேரடி அழைப்பின் உருக்கத்தையும் வெளிப்படையாகப் பேணுகிறது.
