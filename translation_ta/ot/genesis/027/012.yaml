source:
  edition: WLC
  text: אוּלַ֤י יְמֻשֵּׁ֨/נִי֙ אָבִ֔/י וְ/הָיִ֥יתִי בְ/עֵינָ֖י/ו כִּ/מְתַעְתֵּ֑עַ וְ/הֵבֵאתִ֥י עָלַ֛/י קְלָלָ֖ה וְ/לֹ֥א בְרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/012.yaml
  text: Perhaps my father will feel me[a], and I will seem to him like a deceiver[b], and I will bring a curse on myself and not a blessing.
translation:
  language: ta
  text: ஒருவேளை என் தந்தை என்னைத் தொட்டுணர்ந்தால்[a], நான் அவருடைய பார்வையில் ஏமாற்றுபவனைப் போல் தோன்றுவேன்; ஆசீர்வாதத்தை அல்ல, சாபத்தை என்மேல் வரவழைத்துக்கொள்வேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என்னைத் தடவிப் பார்த்தால்.’ எபிரேய வினை கையால் தொட்டுணர்வதைக் குறிக்கிறது; யாக்கோபின் அடையாளத்தை ஈசாக்கு உடல்ரீதியாகச் சோதிக்கும் சூழலுக்கு இது பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: ஒருவேளை
  rationale: யாக்கோபின் அச்சம் கலந்த சாத்தியத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יְמֻשֵּׁנִי
  choice: என்னைத் தடவிப் பார்த்தால்
  rationale: משש என்பது கையால் தொட்டுணர்வதைக் குறிக்கிறது; ஈசாக்கு யாக்கோபின் அடையாளத்தைத் தொடுதல் மூலம் சோதிக்கும் சூழலை இச்சொற்றொடர் தெளிவாகக் காட்டுகிறது.
- source_word: אָבִי
  choice: என் தகப்பன்
  rationale: உடைமைப் பொருளை நேரடியாகவும் வேதாகமச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் தருகிறது.
- source_word: וְהָיִיתִי בְעֵינָיו
  choice: நான் அவருக்கு ... போல தோன்றுவேன்
  rationale: ‘அவருடைய கண்களில்’ என்ற எபிரேய மரபுத்தொடரின் மதிப்பீடு அல்லது பார்வை சார்ந்த பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּמְתַעְתֵּעַ
  choice: ஏமாற்றுகிறவனைப் போல
  rationale: இச்சூழலில் ஒருவரைத் தவறாக வழிநடத்தி ஏமாற்றுபவன் என்ற முதன்மைப் பொருளைத் தருகிறது; கேலி செய்பவன் அல்லது முட்டாளாக்குபவன் என்ற நுண்பொருளும் சாத்தியம்.
- source_word: וְהֵבֵאתִי עָלַי
  choice: என்மேல் வரவழைத்துக்கொள்வேன்
  rationale: ஹிப்இல் வினையின் காரணவினைப் பொருளையும், செய்பவனே அதன் விளைவைத் தன்மேல் கொண்டுவருகிறான் என்பதையும் இயல்பான தமிழில் காக்கிறது.
- source_word: קְלָלָה וְלֹא בְרָכָה
  choice: ஆசீர்வாதத்துக்குப் பதிலாகச் சாபத்தையே
  rationale: சாபம்–ஆசீர்வாதம் என்ற நேர்மாறான கருத்துகளை வலியுறுத்தி, எபிரேயத்தின் ‘சாபம், ஆசீர்வாதம் அல்ல’ என்ற எதிர்மறை வேறுபாட்டை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: யாக்கோபின் அச்சத்தின் தன்மை
  choice: அவன் தகப்பனின் பார்வையில் ஏமாற்றுகிறவனாகத் தோன்றி, ஆசீர்வாதத்துக்குப் பதிலாகச் சாபத்தைப் பெறக்கூடும் என்ற அச்சமாகவே மொழிபெயர்க்கப்பட்டது.
  alternative: அவன் மனந்திரும்பியதாகவோ அல்லது ஏமாற்றத்தின் ஒழுக்கக்கேட்டை முழுமையாக ஒப்புக்கொண்டதாகவோ விளக்குதல்.
  rationale: மூலவசனம் யாக்கோபின் சாத்தியமான கண்டுபிடிப்பையும் அதன் விளைவையும் மட்டுமே கூறுகிறது; அவனுடைய உள்ளார்ந்த ஒழுக்க அல்லது இறையியல் நிலையைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தடவிப் பார்த்தால்’ என்பது வெறும் தொடுதலைவிட அடையாளத்தைத் தொட்டுச் சோதிக்கும் செயலைத் தெளிவாக்குகிறது. ‘ஆசீர்வாதத்துக்குப் பதிலாகச் சாபத்தையே’ என்பது மூலத்தின் எதிர்மறை மோதலை இயல்பான தமிழில் வலியுறுத்துகிறது; அடிக்குறிப்புகள் உண்மையான சொற்பொருள் மாற்றுகளைப் பாதுகாக்கின்றன.
