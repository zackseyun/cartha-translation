translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரேயக் கதைத் தொடக்கத்தைச் சொல்லுக்குச் சொல் பிரதிபலிக்கும் இயல்பற்ற வடிவத்துக்குப் பதிலாக தமிழ் காலத் துணைவாக்கியம் பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்புக் குறி அது சார்ந்த ‘மூத்த மகனான ஏசாவை’ என்ற தொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
