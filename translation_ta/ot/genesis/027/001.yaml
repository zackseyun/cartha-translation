source:
  edition: WLC
  text: וַ/יְהִי֙ כִּֽי זָקֵ֣ן יִצְחָ֔ק וַ/תִּכְהֶ֥יןָ עֵינָ֖י/ו מֵ/רְאֹ֑ת וַ/יִּקְרָ֞א אֶת עֵשָׂ֣ו בְּנ֣/וֹ הַ/גָּדֹ֗ל וַ/יֹּ֤אמֶר אֵלָי/ו֙ בְּנִ֔/י וַ/יֹּ֥אמֶר אֵלָ֖י/ו הִנֵּֽנִ/י־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/001.yaml
  text: It happened that when Isaac was old and his eyes were too dim to see[a], he called Esau his older son and said to him, “My son,” and he said to him, “Here I am.”
translation:
  language: ta
  text: ஈசாக்கு முதிர்ந்தபோது, பார்க்க முடியாத அளவுக்கு அவருடைய கண்கள் மங்கிப்போயின; அவர் தம் மூத்த மகனான ஏசாவை[a] அழைத்து, “என் மகனே!” என்றார். அதற்கு அவன், “இதோ, நான் இருக்கிறேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தம் முதற்பேறான மகன் ஏசாவை.”
    reason: הַגָּדֹל என்பதை உறவுமுறை ஒப்பீட்டில் ‘மூத்த’ என்றும், பிறப்பு வரிசையை வலியுறுத்தி ‘முதற்பேறான’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: …போது
  rationale: புதிய நிகழ்வை அறிமுகப்படுத்தி அதன் காலச் சூழலைக் கூறும் எபிரேயத் தொடரை, தேவையற்ற ‘இப்போது’ போன்ற சொல்லைச் சேர்க்காமல் இயல்பான தமிழ் காலத் துணைவாக்கியமாக வழங்குகிறது.
- source_word: זָקֵן
  choice: முதிர்வயதானபோது
  rationale: ஈசாக்கின் வயது முதிர்ந்த நிலையை நவீன, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: וַתִּכְהֶיןָ עֵינָיו מֵרְאֹת
  choice: பார்க்க முடியாத அளவுக்கு அவருடைய கண்கள் மங்கிப்போயின
  rationale: கண்கள் மங்கியதையும் அதனால் ஏற்பட்ட பார்வை இயலாமையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַיִּקְרָא
  choice: அழைத்து
  rationale: இச்சூழலில் ஒருவரைத் தன்னிடம் அழைப்பதைக் குறிக்கிறது; ‘வரவழைத்தார்’ என்பதைவிட எளிமையாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֶת־עֵשָׂו בְּנוֹ הַגָּדֹל
  choice: தம் மூத்த மகனான ஏசாவை
  rationale: הַגָּדֹל இங்கு யாக்கோபுடன் ஒப்பிடுகையில் வயதில் மூத்தவனான ஏசாவைக் குறிக்கிறது. ‘தம்’ என்பது ஈசாக்கையே தெளிவாகச் சுட்டுகிறது.
- source_word: בְּנִי
  choice: என் மகனே!
  rationale: முதலாம் நபர் உடைமைப் பின்னொட்டையும் அன்பான நேரடி அழைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הִנֵּנִי
  choice: இதோ, இருக்கிறேன்
  rationale: தாம் அங்கே இருப்பதையும் பதிலளிக்கத் தயாராக இருப்பதையும் காட்டும் எபிரேய மறுமொழியின் வழக்கமான பொருளைத் தக்கவைக்கிறது.
