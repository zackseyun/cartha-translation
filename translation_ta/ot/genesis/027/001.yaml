  revision_rationale: The revision retains the temporal-narrative framing and joins it to Isaac's principal action, while using idiomatic modern Tamil. It preserves the source's sense without adding an explicit temporal ‘now.’ The existing footnote remains correctly anchored to the phrase describing Esau and preserves the lexical alternative.
