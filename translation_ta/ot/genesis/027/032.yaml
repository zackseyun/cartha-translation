source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר ל֛/וֹ יִצְחָ֥ק אָבִ֖י/ו מִי אָ֑תָּה וַ/יֹּ֕אמֶר אֲנִ֛י בִּנְ/ךָ֥ בְכֹֽרְ/ךָ֖ עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/032.yaml
  text: His father Isaac said to him[a], “Who are you?” And he said, “I am your son, your firstborn[b], Esau.”
translation:
  language: ta
  text: அவனுடைய தந்தை ஈசாக்கு அவனிடம்[a], “நீ யார்?” என்றார். அவன், “நான் உங்கள் மகன், உங்கள் முதற்பேறானவன்[b], ஏசா” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயில் சொற்களின் வரிசை: ‘ஈசாக்கு, அவனுடைய தந்தை.’ தமிழில் இயல்பாக ‘அவனுடைய தந்தை ஈசாக்கு’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
  - marker: b
    text: ‘உங்கள் மூத்த மகன்’ என்றும் மொழிபெயர்க்கலாம். ‘முதற்பேறானவன்’ என்ற எபிரெயச் சொல், இச்சூழலில் முக்கியமான பிறப்பு வரிசையை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார் / என்றான்
  rationale: אָמַר என்பது பொதுவாகப் பேசுவதைக் குறிக்கும் வினைச்சொல். கேள்வி இடம்பெற்றாலும், எபிரெயச் சொல்லை மிகையாக விளக்காமல் தமிழில் இயல்பான உரையாடல் வடிவில் ‘என்றார்’ என்றும், ஏசாவின் பதிலில் ‘என்றான்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לּוֹ
  choice: அவனிடம்
  rationale: לְ முன்னொட்டுடன் மூன்றாம் ஆண்பால் ஒருமை விகுதி சேர்ந்து, பேச்சு யாரை நோக்கிக் கூறப்பட்டது என்பதைக் காட்டுகிறது; தமிழில் ‘அவனிடம்’ என்பது இயல்பான இணை.
- source_word: יִצְחָק אָבִיו
  choice: அவனுடைய தந்தை ஈசாக்கு
  rationale: எபிரெயில் சொற்களின் வரிசை நேரடியாக ‘ஈசாக்கு, அவனுடைய தந்தை’ என உள்ளது. உறவையும் பேசுபவரின் அடையாளத்தையும் காத்து, இயல்பான நவீனத் தமிழுக்காக ‘அவனுடைய தந்தை ஈசாக்கு’ என அமைக்கப்பட்டுள்ளது.
- source_word: מִי אַתָּה
  choice: நீ யார்?
  rationale: מִי என்ற வினாப்பெயரும் אַתָּה என்ற இரண்டாம் ஆண்பால் ஒருமைப் பெயரும் சேர்ந்த நேரடியான, இயல்பான தமிழ் வினா.
- source_word: אֲנִי
  choice: நான்
  rationale: எபிரெயப் பெயர்ச்சொல் வாக்கியத்தில் இணைப்புவினை வெளிப்படையாக இல்லை. தமிழிலும் இங்கு ‘நான்’ என்பதுடன் தொடர்ந்து வரும் அடையாளக் கூறுகள் இயல்பாக வாக்கியத்தை நிறைவு செய்கின்றன.
- source_word: בִּנְךָ
  choice: உங்கள் மகன்
  rationale: בֵּן என்பதுடன் இரண்டாம் ஆண்பால் ஒருமை உடைமை விகுதி சேர்ந்துள்ளது. தந்தையை நோக்கிப் பேசும் நவீனத் தமிழின் மரியாதை வழக்குக்கு ஏற்ப ‘உங்கள் மகன்’ என வழங்கப்பட்டுள்ளது; இந்த மரியாதைப் பன்மை எபிரெயில் தனியே குறிக்கப்படவில்லை.
- source_word: בְכֹרְךָ
  choice: உங்கள் முதற்பேறானவன்
  rationale: בְּכוֹר என்பது முதலில் பிறந்த மகனைக் குறிக்கிறது; சுற்றியுள்ள பிறப்புரிமைச் சூழலில் பிறப்பு வரிசைக்குள்ள முக்கியத்துவத்தையும் தக்கவைக்க ‘முதற்பேறானவன்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: עֵשָׂו
  choice: ஏசா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: בְּכוֹר என்ற சொல்லிலுள்ள பிறப்பு வரிசை மற்றும் பிறப்புரிமைச் சுட்டு
  choice: முதற்பேறானவன்
  alternative: மூத்த மகன்
  rationale: ‘மூத்த மகன்’ வயது அல்லது குடும்ப வரிசையை மட்டும் முன்னிறுத்தக்கூடும். ‘முதற்பேறானவன்’ என்பது முதலாவதாகப் பிறந்தவன் என்ற பொருளையும், ஆதியாகமம் 27-ன் பிறப்புரிமைத் தொடர்பையும் தெளிவாகக் காக்கிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கம் உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஈசாக்கின் ‘நீ’ இயல்பான தந்தை–மகன் உரையாடலைக் காட்டுகிறது; ஏசாவின் ‘உங்கள்’ தந்தையை நோக்கிய தமிழ் மரியாதை வழக்கை பிரதிபலிக்கிறது. மூலத்தின் மீளுரைத்த அடையாள அமைப்பைத் தக்கவைக்க ‘உங்கள் மகன், உங்கள் முதற்பேறானவன், ஏசா’ என்ற ஒத்திசைவு காக்கப்பட்டுள்ளது.
