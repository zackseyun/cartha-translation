  text: הָבִ֨יאָ/ה לִּ֥/י צַ֛יִד וַ/עֲשֵׂה לִ֥/י מַטְעַמִּ֖ים וְ/אֹכֵ֑לָה וַ/אֲבָרֶכְ/כָ֛ה לִ/פְנֵ֥י יְהוָ֖ה לִ/פְנֵ֥י מוֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/007.yaml
  text: Bring me game and make me tasty food[b][a], so that I may eat and bless you before Yahweh before I die.’
translation:
  language: ta
  text: ‘வேட்டையாடியதை எனக்குக் கொண்டுவந்து, எனக்காகச் சுவையான உணவுகளைத் தயாரி; நான் சாப்பிட்டு, இறப்பதற்கு முன் யாவேவின் முன்னிலையில் உன்னை ஆசீர்வதிப்பேன்’ என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבִיאָה לִי
  choice: என்னிடம் கொண்டுவந்து
  rationale: இது בוא என்பதன் காரணவினை ஏவல் வடிவம்; பேசுகிறவரிடம் ஒன்றைக் கொண்டுவரும் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: צַיִד
  choice: நீ வேட்டையாடிய இறைச்சி
  rationale: வேட்டையில் பிடிக்கப்பட்ட விலங்கு அல்லது அதன் இறைச்சியைக் குறிக்கிறது. தமிழில் ‘வேட்டையாடிய இறைச்சி’ என்பது சூழலைத் தெளிவாக்குகிறது; ‘மானிறைச்சி’ என்று குறுக்கவில்லை.
- source_word: וַעֲשֵׂה לִי
  choice: எனக்காகத் தயார் செய்
  rationale: עשה பொதுவாக ‘செய்’ என்றாலும், உணவுச் சூழலில் ‘தயார் செய்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מַטְעַמִּים
  choice: சுவையான உணவு
  rationale: சிறப்பாகத் தயாரிக்கப்பட்ட சுவைமிக்க உணவைக் குறிக்கிறது; எளிதில் புரியும் நடையைக் காக்கிறது.
- source_word: וְאֹכֵלָה
  choice: நான் அதைச் சாப்பிட்டு
  rationale: விருப்பம் அல்லது நோக்கத்தை உணர்த்தும் cohortative வடிவம். தொடர்ந்த செயல் அமைப்பைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: וַאֲבָרֶכְכָה
  choice: உன்னை ஆசீர்வதிப்பேன்
  rationale: ברך என்பதன் தீவிரவினை cohortative வடிவமும் இரண்டாம் நபர் ஒருமை பின்னொட்டும் உள்ளன; ஈசாக்கின் நோக்கமுள்ள அடுத்த செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: לִפְנֵי என்பது ‘முன்னிலையில்/சந்நிதியில்’ எனப் பொருள்படும். மூலத்தில் உள்ள இறைபெயரைப் பெயராகவே வழங்குகிறது.
- source_word: לִפְנֵי מוֹתִי
  choice: நான் இறப்பதற்கு முன்
  rationale: எபிரெய பெயர்ச்சொல் சார்ந்த அமைப்பை இயல்பான தமிழ் வினைத் தொடராக வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை வழங்குதல்
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூல உரையில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயர் நேரடியாக உள்ளது. தமிழில் பரவலாக அறியப்படும் பெயர்வடிவமான ‘யெகோவா’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, மற்றொரு சாத்தியமான ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிமையும் கொண்ட நேரடி மேற்கோள் நடை. வேட்டையால் கிடைத்த உணவு என்பதைக் குறிப்பதற்குத் தேவையான அளவு மட்டும் தெளிவாக்கப்பட்டுள்ளது; இறைபெயர் பட்டப்பெயராக மாற்றப்படவில்லை.
