  source_fidelity: 'மூலத்தின் முக்கியக் கருத்துகள் அனைத்தும் துல்லியமாக உள்ளன: ஈசாக்கின் பதில், யாக்கோபுக்கு ஏசாவின்மேலான அதிகாரம், சகோதரர்கள் ஊழியர்களாக்கப்படுதல், தானியமும் புதிய திராட்சரசமும் வழங்கப்படுதல், ஏசாவுக்காக இனி என்ன செய்ய இயலும் என்ற வினா ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ஆனால் “தானியத்தாலும் புதுத் திராட்சரசத்தாலும் அவனைத் தாங்கியிருக்கிறேன்” என்பது סמך வினையின் இச்சூழல் சார்ந்த வழங்கல்/ஆதரிப்பு பொருளைத் தரும் போதும், தமிழில் இயல்பாக இல்லை; வழங்கலை வெளிப்படையாகச் சொல்வது சிறந்தது.'
  naturalness: “அவனை உன்மேல் எஜமானனாக” என்பது அதிகார உறவை “உனக்கு எஜமானனாக” என்பதைக் காட்டிலும் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது. மேலும், தானியமும் திராட்சரசமும் கொடுத்து ஆதரித்ததாக அமைத்தல் நவீன நிலையான தமிழில் சீராக ஒலிக்கிறது.
  terminology: “எஜமான்,” “வேலைக்காரர்கள்,” “தானியம்,” “புதிய திராட்சரசம்” ஆகியவை சூழலுக்கு ஏற்றவை. עֲבָדִים என்பதற்கான “அடிமைகள்” மாற்று அடிக்குறிப்பில் விடப்பட வேண்டும். “புதிய திராட்சரசம்” என்பது “புதுத் திராட்சரசம்” என்பதைக் காட்டிலும் வழக்கமான நவீன வடிவம்.
