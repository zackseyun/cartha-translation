base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/037.yaml
  text: Isaac answered and said to Esau[a], “Look, I have made him master over you, and I have given all his brothers to him as servants. I have sustained him with grain and new wine. What then can I do for you[c][b], my son?”
translation:
  language: ta
  text: 'ஈசாக்கு ஏசாவுக்கு மறுமொழியாகச் சொன்னார்: “இதோ, அவனை உன்மேல் எஜமானனாக நியமித்துவிட்டேன்; அவனுடைய சகோதரர்கள் அனைவரையும் அவனுக்கு வேலைக்காரர்களாகக் கொடுத்துவிட்டேன்.[a] தானியமும் புதிய திராட்சரசமும் கொடுத்து அவனை ஆதரித்திருக்கிறேன்.[b] அப்படியானால், என் மகனே, உனக்காக நான் என்ன செய்ய முடியும்?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வேலைக்காரர்களாக” என்பதற்கு “அடிமைகளாக” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சூழலுக்கேற்ப இரண்டையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தானியத்தாலும் புதிய திராட்சரசத்தாலும் அவனைப் பேணியிருக்கிறேன்.” எபிரெய வினைச்சொல் ஆதரிப்பதையோ தேவையானவற்றை வழங்குவதையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: c
    text: “உனக்காக நான் என்ன செய்வேன்?” என்றும் மொழிபெயர்க்கலாம்.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: மறுமொழியாகச் சொன்னார்
  rationale: எபிரெய உரையாடல் சூத்திரத்தில் உள்ள ‘பதிலளித்து—சொன்னான்’ என்ற இரு வினைகளின் பொருளையும், தமிழில் தேவையற்ற இரட்டிப்பில்லாமல் இயல்பாகக் காட்டுகிறது.
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து வலியுறுத்தும் இடைச்சொல்லின் ஆற்றலை, நவீனத் தமிழிலும் கண்ணியமான நடையிலும் தக்கவைக்கிறது.
- source_word: גְּבִיר שַׂמְתִּיו לָךְ
  choice: அவனை உனக்கு எஜமானனாக நியமித்துவிட்டேன்
  rationale: שׂים உடன் வரும் நிலைப்பெயர் அதிகாரமுள்ள நிலையில் அமர்த்துதலைக் குறிக்கிறது. ‘எஜமான்’ குடும்ப உறவுக்குள் உள்ள மேலாதிக்கத்தைத் தெளிவாகக் காட்டுகிறது; தெய்வீகப் பட்டப்பெயரின் சாயலைத் தவிர்க்கிறது.
- source_word: כָּל אֶחָיו
  choice: அவனுடைய சகோதரர்கள் அனைவரையும்
  rationale: மூலத்தின் நேரடியான குடும்ப உறவுச் சொல்லை விரிவுபடுத்தாமல் பாதுகாக்கிறது.
- source_word: לַעֲבָדִים
  choice: வேலைக்காரர்களாக
  rationale: עבד என்பது சூழலின்படி வேலைக்காரர்களையோ அடிமைகளையோ குறிக்கலாம். இங்கு ஆசீர்வாதத்தில் கூறப்படும் கீழ்ப்படிந்த நிலையே முன்னிலையாக இருப்பதால் ‘வேலைக்காரர்கள்’ முதன்மை உரையில் இயல்பானது; வலுவான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: דָגָן
  choice: தானியம்
  rationale: பொதுவாகத் தானிய விளைபொருளைக் குறிக்கும் சொல்லுக்கு நவீனத் தமிழில் துல்லியமான பொதுப்பெயர்.
- source_word: תִּירֹשׁ
  choice: புதுத் திராட்சரசம்
  rationale: புதிய அல்லது இளம் திராட்சரசத்தைக் குறிக்கும் வேளாண்மைச் சாயலை ‘திராட்சரசம்’ என்ற தெளிவுடன் பாதுகாக்கிறது.
- source_word: סְמַכְתִּיו
  choice: அவனைத் தாங்கியிருக்கிறேன்
  rationale: ‘தாங்குதல், ஆதரித்தல்’ என்ற அடிப்படைப் பொருளையும், தானியம் மற்றும் புதுத் திராட்சரசத்தால் வாழ்வாதாரம் அளித்தல் என்ற சூழற்பொருளையும் ஒருங்கே கொண்டுள்ளது.
- source_word: וּלְכָה אֵפוֹא
  choice: அப்படியானால்
  rationale: முன்னதாகச் செய்யப்பட்ட ஏற்பாடுகளிலிருந்து ஏசாவுக்கான விளைவுக்கு மாறும் தர்க்கத் திருப்பத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מָה אֶעֱשֶׂה לְךָ
  choice: உனக்காக நான் என்ன செய்ய முடியும்?
  rationale: எபிரெய வினா வடிவத்தையும், ஏற்கெனவே ஆசீர்வாதம் வழங்கப்பட்டதால் வேறு என்ன செய்ய இயலும் என்ற சூழல்சார் இயலாமையையும் இயல்பாகக் காட்டுகிறது.
- source_word: בְּנִי
  choice: என் மகனே
  rationale: அன்பும் குடும்ப உறவும் கொண்ட நேரடி அழைப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: வழங்கப்பட்ட ஆசீர்வாதத்துக்குப் பிறகு ஈசாக்கின் வினா இயலாமையையா அல்லது எதிர்காலச் செயலைப் பற்றிய கேள்வியையா வலியுறுத்துகிறது
  choice: “நான் என்ன செய்ய முடியும்?” என்று சூழல்சார் இயலாமையை வெளிப்படுத்துதல்
  alternative: “நான் என்ன செய்வேன்?”
  rationale: מָה אֶעֱשֶׂה என்ற வடிவம் தனியாக எதிர்கால/சாத்திய வினாவாகவும் இருக்கலாம்; ஆனால் ஏற்கெனவே யாக்கோபுக்கு அதிகாரமும் வளமும் வழங்கப்பட்டதாக ஈசாக்கு கூறும் உடனடி சூழல், நடைமுறையில் மீதமுள்ள வாய்ப்பின்மையை வலியுறுத்துகிறது. அடிக்குறிப்பு மொழியியல் மாற்றைத் திறந்தவையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையாடல் சூத்திரம் தமிழில் இயல்பாகச் சுருக்கப்பட்டாலும் அதன் மறுமொழித் தன்மை பாதுகாக்கப்பட்டுள்ளது. ‘எஜமான்’, ‘வேலைக்காரர்’, ‘புதுத் திராட்சரசம்’ ஆகியவை அதிகாரம், கீழ்ப்படிதல், வேளாண்மை வளம் ஆகிய மூலச் சாயல்களைத் தெளிவாக வைத்திருக்கின்றன.
