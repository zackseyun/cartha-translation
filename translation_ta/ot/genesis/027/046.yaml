source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר רִבְקָה֙ אֶל יִצְחָ֔ק קַ֣צְתִּי בְ/חַיַּ֔/י מִ/פְּנֵ֖י בְּנ֣וֹת חֵ֑ת אִם לֹקֵ֣חַ יַ֠עֲקֹב אִשָּׁ֨ה מִ/בְּנֽוֹת חֵ֤ת כָּ/אֵ֨לֶּה֙ מִ/בְּנ֣וֹת הָ/אָ֔רֶץ לָ֥/מָּה לִּ֖/י חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/046.yaml
  text: Then Rebekah said to Isaac[a], “I am weary of my life because of the daughters of Heth. If Jacob takes a wife from the daughters of Heth like these, from the daughters of the land, what is life to me?”
translation:
  language: ta
  text: பின்பு ரெபெக்கா ஈசாக்கிடம், “ஹேத்தின் மகள்களால் என் வாழ்வே எனக்கு அலுத்துப்போயிற்று. யாக்கோபு இவர்களைப் போன்ற ஹேத்தின் மகள்களில், நாட்டின் மகள்களில் ஒருத்தியை மனைவியாக எடுத்துக்கொண்டால், எனக்கு வாழ்க்கை எதற்கு?” என்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַצְתִּי בְחַיַּי
  choice: என் வாழ்க்கையே எனக்கு வெறுத்துப்போயிற்று
  rationale: இந்த எபிரேய மரபுத்தொடர் வாழ்க்கையைக் குறித்து ஏற்பட்ட ஆழ்ந்த சலிப்பையும் அருவருப்பையும் குறிக்கிறது. நவீன தமிழில் அதன் உணர்ச்சி வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִפְּנֵי
  choice: …ஆல்
  rationale: இங்கு இடத்தைக் குறிக்காமல் காரணத்தைக் குறிக்கிறது; தமிழில் காரணப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּנוֹת חֵת
  choice: ஏத்தின் மகள்கள்
  rationale: எபிரேய மூலத்தின் குடும்ப-இன அடையாள வடிவைத் தக்கவைத்து, חֵת என்ற பெயரை ஒலிபெயர்க்கிறது.
- source_word: אִם לֹקֵחַ יַעֲקֹב אִשָּׁה
  choice: யாக்கோபும் … ஒருத்தியை மனைவியாக எடுத்துக்கொண்டால்
  rationale: திருமணத்தைக் குறிக்கும் எபிரேய ‘மனைவியை எடுத்துக்கொள்’ அமைப்பைத் தெளிவான தமிழில் பிரதிபலிக்கிறது.
- source_word: כָּאֵלֶּה
  choice: இவர்களைப் போன்ற
  rationale: முன்னரே குறிப்பிடப்பட்ட ஏசாவின் மனைவிகளைப் போன்றவர்களைச் சுட்டும் அண்மைச் சுட்டுப்பொருளைத் தக்கவைக்கிறது.
- source_word: מִבְּנוֹת הָאָרֶץ
  choice: இந்த நாட்டின் மகள்களில் ஒருத்தியை
  rationale: மூலத்தின் ‘நாட்டின் மகள்கள்’ என்ற இணை அமைப்பைத் தக்கவைத்தபடியே தமிழில் தேவையான ஒருமைப் பொருளைத் தெளிவாக்குகிறது.
- source_word: לָמָּה לִּי חַיִּים
  choice: நான் உயிரோடிருந்து என்ன பயன்?
  rationale: சொல்லுக்குச் சொல் வடிவத்தைவிட, வாழ்க்கை இனி வாழத் தகுதியற்றதாகத் தோன்றும் வினாவியல் வலிமையை இயல்பான தமிழில் தருகிறது; தற்கொலை நோக்கத்தைச் சேர்க்காமல் உள்ளது.
theological_decisions:
- issue: חֵת என்பதன் இன அடையாளம்
  choice: முதன்மை உரையில் ‘ஏத்தின் மகள்கள்’
  alternative: ‘ஏத்தியப் பெண்கள்’ அல்லது ‘ஏத்தியர்களின் மகள்கள்’
  rationale: மூல எபிரேயத்தின் பெயர் மற்றும் வம்சவழி வடிவத்தைப் பாதுகாக்கிறது; வாசகருக்குப் புரியும் இனவியல் மாற்றுப்பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: לָמָּה לִּי חַיִּים என்ற இறுதி வினாவின் பொருள்
  choice: ‘நான் உயிரோடிருந்து என்ன பயன்?’
  alternative: ‘வாழ்க்கை எனக்கு எதற்கு?’
  rationale: இது வாழ்க்கையின் பயனின்மையை வெளிப்படுத்தும் வினாவியல் மரபுத்தொடர். தேர்ந்த வடிவம் அதன் உணர்ச்சி வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மாற்று வடிவம் அதிகச் சொற்பொருள் சார்ந்தது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை. ‘ஏத்தின் மகள்கள்’ மற்றும் ‘இந்த நாட்டின் மகள்கள்’ என்ற எபிரேய இணைச்சொல் அமைப்பு இயன்றவரை பாதுகாக்கப்பட்டுள்ளது.
