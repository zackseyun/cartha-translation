revisions:
- from: பின்பு ரெபெக்காள் ஈசாக்கிடம், “ஏத்தின் மகள்களால்[a] என் வாழ்க்கையே எனக்கு வெறுத்துப்போயிற்று. யாக்கோபும் இவர்களைப் போன்ற ஏத்தின் மகள்களில் ஒருத்தியை, இந்த நாட்டின் மகள்களில் ஒருத்தியை, மனைவியாக எடுத்துக்கொண்டால், நான் உயிரோடிருந்து என்ன பயன்?” என்றாள்.
  to: பின்பு ரெபெக்கா ஈசாக்கிடம், “ஹேத்தின் மகள்களால் என் வாழ்வே எனக்கு அலுத்துப்போயிற்று. யாக்கோபு இவர்களைப் போன்ற ஹேத்தின் மகள்களில், நாட்டின் மகள்களில் ஒருத்தியை மனைவியாக எடுத்துக்கொண்டால், எனக்கு வாழ்க்கை எதற்கு?” என்றாள்.
  rationale: The revision more closely represents the Hebrew idiom of weariness with life, removes added emphasis and an added proximal demonstrative, smooths the appositional marriage phrase, and supplies the standard Tamil ethnic alternative in the footnote. The rhetorical final question remains noncommittal and does not add an explicit interpretation beyond the source.
  reviewer_model: gpt-5.6-terra
