  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לֶךְ נָא֙ אֶל הַ/צֹּ֔אן וְ/קַֽח לִ֣/י מִ/שָּׁ֗ם שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים טֹבִ֑ים וְ/אֶֽעֱשֶׂ֨ה אֹתָ֧/ם מַטְעַמִּ֛ים לְ/אָבִ֖י/ךָ כַּ/אֲשֶׁ֥ר אָהֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/009.yaml
  text: Please go to the flock and get for me from there two good young goats[a], and I will make them into tasty food for your father, just as he loves.
translation:
  language: ta
  text: தயவுசெய்து மந்தையிடம் போய், அங்கிருந்து நல்ல வெள்ளாட்டுக் குட்டிகள் இரண்டை எனக்காக எடுத்துக்கொண்டு வா. அவற்றை உன் தந்தைக்காக, அவர் விரும்புகிறபடியே சுவையான உணவுவகைகளாக[a] சமைப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சுவைமிக்க பதார்த்தங்களாக” அல்லது “சிறப்பு உணவுகளாக.”
    reason: מַטְעַמִּים என்பதற்கு சுவையான உணவுவகைகள், சுவைமிக்க பதார்த்தங்கள், அல்லது சிறப்பு உணவுகள் என்ற நெருங்கிய பொருள்கள் உள்ளன.
lexical_decisions:
- source_word: לֶךְ נָא
  choice: தயவுசெய்து ... போய்
  rationale: לֶךְ என்பது ஒருமை ஆண்பால் கட்டளை; נָא அந்தக் கட்டளையை மென்மையான வேண்டுகோளாக அல்லது வலியுறுத்தப்பட்ட கோரிக்கையாக ஆக்குகிறது. நவீன தமிழில் “தயவுசெய்து ... போய்” இவ்விரு கூறுகளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַצֹּאן
  choice: மந்தை
  rationale: צֹאן என்பது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய சிறுகால்நடை மந்தையைக் குறிக்கிறது. அடுத்த சொற்றொடர் வெள்ளாட்டுக் குட்டிகளைத் தெளிவாகக் குறிப்பிடுவதால், பொதுப்பொருளுள்ள “மந்தை” பொருத்தமானது.
- source_word: וְקַח לִי מִשָּׁם
  choice: அங்கிருந்து ... எனக்காக எடுத்துக்கொண்டு வா
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடு/பெறு’. சூழலில் ரெபெக்காவிடம் கொண்டு வர வேண்டியது உட்பொருளாக இருப்பதால், “எடுத்துக்கொண்டு வா” இயல்பான தமிழைத் தருகிறது; לִי என்பது “எனக்காக” என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: שְׁנֵי גְּדָיֵי עִזִּים
  choice: வெள்ளாட்டுக் குட்டிகள் இரண்டு
  rationale: இந்தக் கட்டமைப்பு சொல்லுக்குச் சொல் ‘வெள்ளாடுகளின் குட்டிகள் இரண்டு’ எனப் பொருள்பட்டு, இரண்டு இளம் வெள்ளாடுகளைக் குறிக்கிறது. “வெள்ளாட்டுக் குட்டிகள்” வயதையும் இனத்தையும் தெளிவாகக் காக்கிறது.
- source_word: טֹבִים
  choice: நல்ல
  rationale: இங்கு טֹבִים விலங்குகளின் தரத்தையும் சமையலுக்கான ஏற்றத்தையும் குறிக்கிறது. “நல்ல” என்பது விளக்கத்தை மிகைப்படுத்தாத நேரடியான தமிழ் இணைச்சொல்.
- source_word: וְאֶעֱשֶׂה אֹתָם מַטְעַמִּים
  choice: அவற்றை ... சுவையான உணவுவகைகளாகச் சமைப்பேன்
  rationale: מַטְעַמִּים என்பது விருப்பத்திற்கேற்ற சுவையான உணவுகள் அல்லது சிறப்பு உணவுவகைகளைக் குறிக்கும் பன்மைச் சொல். விலங்குகளை உணவாகத் தயாரிக்கும் சூழலில் “சமைப்பேன்” இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְאָבִיךָ
  choice: உன் தந்தைக்காக
  rationale: உறவுமுறையையும் உரிய கண்ணியமான நடையையும் “உன் தந்தை” காக்கிறது.
- source_word: כַּאֲשֶׁר אָהֵב
  choice: அவர் விரும்புகிறபடியே
  rationale: אהב இங்கு ஈசாக்கின் நிலையான உணவு விருப்பத்தைக் குறிக்கிறது. “விரும்புகிறபடியே” என்பது எபிரேயத்தின் ஒப்பீட்டுத் தன்மையையும் நிகழ்நிலை விருப்பத்தையும் இயல்பான தமிழில் தருகிறது.
