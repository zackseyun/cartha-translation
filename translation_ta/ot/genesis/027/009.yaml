translation_notes:
  register: நவீன நிலையான தமிழில் எளிதில் புரியக்கூடிய, அதேவேளை கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ரெபெக்காவின் கட்டளை נָא காரணமாக மென்மையான வேண்டுகோளாகத் தரப்பட்டுள்ளது. தந்தையைச் சுட்டும் இடத்தில் மரியாதைப் பன்மையான “அவர்” பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அதன் உண்மையான மூலச்சொல்லான מַטְעַמִּים-க்கு இணையான “சுவையான உணவுவகைகள்” என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
