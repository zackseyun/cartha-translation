  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, ஆனால் முறையான ஆசீர்வாத நடையைத் தக்கவைக்கும் மொழி பயன்படுத்தப்பட்டது. கவிதை இணை அமைப்புகள் வரிவடிவில் காக்கப்பட்டுள்ளன. ‘மக்களினங்கள்/தேசங்கள்’, ‘சபிப்பவர்கள்/ஆசீர்வதிப்பவர்கள்’ ஆகிய இணைகள் மூலத்தின் சமநிலையை வெளிப்படுத்துகின்றன.
