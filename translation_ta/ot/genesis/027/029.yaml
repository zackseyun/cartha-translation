base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/029.yaml
  text: Let peoples serve you[a], and nations bow down to you. Be master over your brothers, and let your mother's sons bow down to you. Cursed be those who curse you[b], and blessed be those who bless you.
translation:
  language: ta
  text: 'மக்கள் இனங்கள் உனக்குப் பணி செய்யட்டும்;

    தேசங்கள் உனக்குத் தலைவணங்கட்டும்.[a]


    உன் சகோதரர்களுக்கு நீ எஜமானனாக இரு;[b]

    உன் தாயின் மகன்கள் உனக்குத் தலைவணங்கட்டும்.


    உன்னைச் சபிப்பவர்கள் சபிக்கப்பட்டவர்களாகட்டும்;

    உன்னை ஆசீர்வதிப்பவர்கள் ஆசீர்வதிக்கப்பட்டவர்களாகட்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பணிந்து மரியாதை செலுத்தட்டும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் ஒரு மேலானவர்முன் உடலைத் தாழ்த்துவதைக் குறிக்கிறது; அது மனிதருக்குச் செலுத்தும் மரியாதையையும் கடவுளுக்குச் செலுத்தும் வழிபாட்டையும் சூழலுக்கேற்ப குறிக்கக்கூடும். இங்கு மனிதருக்குச் செலுத்தும் மரியாதையே சூழலுக்கு ஏற்றது.
    reason: lexical_alternative
  - marker: b
    text: ‘உன் சகோதரர்கள்மேல் ஆள்பவனாக இரு’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் தலைமை மற்றும் மேலாதிக்க நிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַבְדוּךָ
  choice: உனக்குப் பணிசெய்யட்டும்
  rationale: עבד என்பதன் Qal வடிவம் இங்கு வேலை செய்வதை மட்டும் அல்லாமல், ஆசீர்வாதம் பெறுகிறவனுக்குக் கீழ்ப்பட்டு சேவை செய்வதையும் குறிக்கிறது. ‘பணிசெய்யட்டும்’ இந்த விரிந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עַמִּים
  choice: மக்களினங்கள்
  rationale: பல இன அல்லது மக்கள் குழுக்களைக் குறிக்கும் பன்மைச் சொல்லாக இருப்பதால் ‘மக்களினங்கள்’ என்று மொழிபெயர்க்கப்பட்டது; அடுத்துவரும் ‘தேசங்கள்’ என்பதுடனான கவிதை இணையும் இதனால் காக்கப்படுகிறது.
- source_word: וְיִשְׁתַּחֲווּ לְךָ
  choice: உனக்குத் தலைவணங்கட்டும்
  rationale: שׁחה/השתחוה உடலைத் தாழ்த்தி மரியாதை செலுத்துவதைக் குறிக்கலாம். இங்கு மனிதனுக்கு அளிக்கப்படும் கீழ்ப்படிதலும் மரியாதையும் கருத்தாக இருப்பதால், தெய்வ வழிபாட்டை அவசியமாக உணர்த்தாத ‘தலைவணங்கட்டும்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְאֻמִּים
  choice: தேசங்கள்
  rationale: עמים என்பதற்கு இணையாகப் பெரிய மக்கள் குழுக்களைக் குறிக்கிறது. கவிதைநடையின் இணைச்சொல் வேறுபாட்டைத் தக்கவைக்க ‘தேசங்கள்’ பயன்படுத்தப்பட்டது.
- source_word: הֱוֵה גְבִיר
  choice: நீ தலைவனாக இரு
  rationale: הוה உடன் வரும் גביר, மேலாதிக்க அல்லது தலைமை நிலையில் இருப்பவனைச் சுட்டுகிறது. குடும்ப உறவுகளின் சூழலில் ‘தலைவன்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; தெய்வப் பட்டத்தோடு குழப்பத்தையும் தவிர்க்கிறது.
- source_word: לְאַחֶיךָ
  choice: உன் சகோதரர்களுக்கு
  rationale: גביר உடன் לְ வரும்போது சகோதரர்கள் மீது தலைமை வகிக்கும் உறவை உணர்த்துகிறது. தமிழில் ‘சகோதரர்களுக்கு நீ தலைவனாக இரு’ என்பது அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי אִמֶּךָ
  choice: உன் தாயின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் குடும்ப உறவைக் குறுகாமல் நேரடியாகக் காக்கிறது; பொதுவான ‘உறவினர்கள்’ என்று விரிவுபடுத்தப்படவில்லை.
- source_word: אֹרְרֶיךָ אָרוּר
  choice: உன்னைச் சபிப்பவர்கள் சபிக்கப்பட்டவர்களாகட்டும்
  rationale: சபிப்பவர்கள்மீதே சாபம் திரும்பும் இணைமொழி அமைப்பைத் தமிழில் ஆசீர்வாத அறிவிப்பின் நடையுடன் தருகிறது.
- source_word: וּמְבָרֲכֶיךָ בָּרוּךְ
  choice: உன்னை ஆசீர்வதிப்பவர்கள் ஆசீர்வதிக்கப்பட்டவர்களாகட்டும்
  rationale: முந்தைய சாபச் சொற்றொடருக்கு இணையான ஆசீர்வாத அமைப்பைத் தக்கவைக்கிறது. எபிரெயில் ஒருமை வடிவில் உள்ள பயனிலை கூட்டாகச் செயல்படுவதால் தமிழில் இயல்பான பன்மை பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: மனிதருக்கு செலுத்தப்படும் வணக்கத்தைக் குறிக்கும் மொழி
  choice: தலைவணங்கட்டும்
  alternative: பணிந்து மரியாதை செலுத்தட்டும்; வணங்கட்டும்
  rationale: எபிரெய வினைச்சொல் கடவுளையோ மனித மேலதிகாரியையோ நோக்கி உடலைத் தாழ்த்துவதைக் குறிக்கக்கூடும். ஈசாக்கு யாக்கோபுக்கு வழங்கும் இந்த ஆசீர்வாதச் சூழலில் மனிதருக்குரிய கீழ்ப்படிதலும் மரியாதையும் முன்னிலையில் உள்ளன. ‘தலைவணங்கட்டும்’ செயலைக் காக்கிறது; இதைத் தெய்வ வழிபாடு என்று தீர்மானிக்கவில்லை.
- issue: גְבִיר என்பதிலுள்ள தலைமை அல்லது எஜமானத்துவம்
  choice: தலைவன்
  alternative: எஜமான்; ஆள்பவன்
  rationale: சொல் சகோதரர்கள்மீது உள்ள மேலாதிக்கத்தை உணர்த்துகிறது. ‘தலைவன்’ குடும்பச் சூழலில் தெளிவாக உள்ளது; கடவுளுக்குரிய பட்டமாக இதை வாசிக்கத் தூண்டாமல் அதிகார உறவை வெளிப்படுத்துகிறது.
