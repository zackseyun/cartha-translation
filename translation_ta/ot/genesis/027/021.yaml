  text: וַ/יֹּ֤אמֶר יִצְחָק֙ אֶֽל יַעֲקֹ֔ב גְּשָׁ/ה נָּ֥א וַ/אֲמֻֽשְׁ/ךָ֖ בְּנִ֑/י הַֽ/אַתָּ֥ה זֶ֛ה בְּנִ֥/י עֵשָׂ֖ו אִם לֹֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/021.yaml
  text: Then Isaac said to Jacob[a], “Please come near, that I may feel you, my son, whether you are really my son Esau or not.”
translation:
  language: ta
  text: அப்போது ஈசாக்கு யாக்கோபிடம், “தயவுசெய்து அருகே வா; என் மகனே, நீ உண்மையிலேயே என் மகன் ஏசாவா இல்லையா என்று நான் உன்னைத் தொட்டுப் பார்க்கட்டும்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தயவுசெய்து அருகே வா; நான் உன்னைத் தொட்டுப் பார்க்கிறேன், என் மகனே—நீ உண்மையிலேயே என் மகன் ஏசாவா இல்லையா என்று.”
    reason: וַאֲמֻשְׁךָ என்பதன் இணைப்பு நுணுக்கத்தை ‘நான் ... பார்க்கட்டும்’ என்ற வேண்டுகோள்/நோக்க அமைப்பாகவும், ‘நான் ... பார்க்கிறேன்’ என்ற நேரடி இணைப்பாகவும் தமிழில் வெளிப்படுத்தலாம்.
lexical_decisions:
- source_word: גְּשָׁה נָּא
  choice: தயவுசெய்து அருகே வா
  rationale: גְּשָׁה என்பது ‘அருகே வா’ என்ற கட்டளை; נָּא வேண்டுகோள் அல்லது பணிவான வலியுறுத்தலைச் சேர்ப்பதால் ‘தயவுசெய்து’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: וַאֲמֻשְׁךָ
  choice: நான் உன்னைத் தொட்டுப் பார்க்கட்டும்
  rationale: מושׁ இங்கு தொடுதல் அல்லது தடவிப் பார்த்தல் மூலம் ஒருவரின் அடையாளத்தைச் சோதிப்பதைக் குறிக்கிறது. ‘தொட்டுப் பார்க்கட்டும்’ என்பது அந்தத் தொட்டுணரும் சோதனையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בְּנִי
  choice: என் மகனே
  rationale: முதல் நபர் ஒருமை உடைமை விகுதியுடன் வரும் நேரடி விளிப்பை உறவுத் தொனியோடு பாதுகாக்கிறது.
- source_word: הַאַתָּה זֶה
  choice: நீ உண்மையிலேயே … தானா
  rationale: இந்த வினா அமைப்பு ஈசாக்கின் சந்தேகத்தையும் அடையாளத்தை உறுதிப்படுத்தும் முயற்சியையும் காட்டுகிறது; ‘உண்மையிலேயே … தானா’ என்பது தமிழில் இயல்பாக அதைக் கடத்துகிறது.
- source_word: בְּנִי עֵשָׂו
  choice: என் மகன் ஏசா
  rationale: உறவையும் விசாரிக்கப்படும் குறிப்பிட்ட அடையாளத்தையும் ‘என் மகன் ஏசா’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: אִם לֹא
  choice: இல்லையா
  rationale: எபிரெய மாற்றுக் கேள்வியின் ‘அல்லது இல்லை’ என்ற நிறைவைத் தமிழின் இயல்பான ‘தானா இல்லையா’ அமைப்பு வெளிப்படுத்துகிறது.
- source_word: וַיֹּאמֶר
  choice: அப்போது … என்றார்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னேற்றுவதால் ‘அப்போது’ வரிசையை இயல்பாகக் காட்டுகிறது; ஈசாக்கைப் பற்றிய மரியாதைத் தொனிக்காக ‘என்றார்’ பயன்படுத்தப்பட்டது.
