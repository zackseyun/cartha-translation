  yaml_path: translation/ot/genesis/027/030.yaml
  text: And it happened that as soon as Isaac had finished blessing Jacob[a], and Jacob had just gone out from the presence of Isaac his father[b], Esau his brother came in from his hunting.
translation:
  language: ta
  text: ஈசாக்கு யாக்கோபை ஆசீர்வதித்து முடித்தபின், யாக்கோபு தன் தந்தை ஈசாக்கின் முன்னிலையிலிருந்து வெளியேறிய உடனேயே, அவன் சகோதரன் ஏசா தன் வேட்டையிலிருந்து வந்தான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “வெளியே செல்ல வெளியே சென்றான்” என்ற வலியுறுத்தும் வினை அமைப்பு உள்ளது; யாக்கோபு வெளியேறிய உடனடியான தருணத்தை இது வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... וַיְהִי
  choice: …முடித்தவுடனே … அப்போது
  rationale: இரு தொடர் நிகழ்வுகளையும் தமிழில் இயல்பான காலத் தொடர்புடன் எடுத்துரைக்கிறது; எபிரெயக் கதைநடையின் விரைவான நிகழ்வுவரிசையைப் பேணுகிறது.
- source_word: כַּאֲשֶׁר כִּלָּה ... לְבָרֵךְ
  choice: ஆசீர்வதித்து முடித்தவுடனே
  rationale: כלה உடன் வரும் வினையெச்சக் கட்டமைப்பு செயல் நிறைவடைந்ததைச் சுட்டுகிறது; சூழலில் உடனடித் தொடர்ச்சியையும் வெளிப்படுத்துகிறது.
- source_word: אַךְ יָצֹא יָצָא
  choice: அப்போதுதான் வெளியே சென்றிருந்தான்
  rationale: முற்றுவினையுடன் இணைந்த வினையெச்சத்தின் வலியுறுத்தலைத் தமிழில் ‘அப்போதுதான்’ எனக் காட்டி, யாக்கோபு வெளியேறிய உடனடியான தருணத்தை இயல்பாகத் தருகிறது.
- source_word: מֵאֵת פְּנֵי יִצְחָק אָבִיו
  choice: தன் தந்தை ஈசாக்கின் முன்னிலையிலிருந்து
  rationale: ‘முகத்தின் முன்பிலிருந்து’ என்ற சொற்பொருளை இயல்பான தமிழில் ‘முன்னிலையிலிருந்து’ என வழங்கி, நேரடியான சந்திப்பு நிலையைக் காக்கிறது.
- source_word: וְעֵשָׂו אָחִיו
  choice: அவன் சகோதரன் ஏசா
  rationale: எபிரெயத்தில் வெளிப்படையாகக் கூறப்படும் சகோதர உறவைப் பேணி, கதைத் தருணத்தின் பதற்றத்தைத் தக்கவைக்கிறது.
- source_word: בָּא מִצֵּידוֹ
  choice: வேட்டையிலிருந்து வந்தான்
  rationale: ציד இங்கு வேட்டையாடும் செயலையோ வேட்டைப் பயணத்தையோ குறிக்கிறது; ‘வேட்டையிலிருந்து வந்தான்’ என்பது இயல்பானதும் பொருள் தெளிவானதும் ஆகும்.
