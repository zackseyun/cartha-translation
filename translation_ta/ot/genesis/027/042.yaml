  yaml_path: translation/ot/genesis/027/042.yaml
  text: And the words of Esau, her older son, were told to Rebekah. So she sent and called Jacob, her younger son, and said to him, “Look, Esau your brother is consoling himself about you by planning to kill you.”
translation:
  language: ta
  text: ரெபெக்காளிடம் அவளுடைய மூத்த மகன் ஏசாவின் வார்த்தைகள் தெரிவிக்கப்பட்டன. ஆகவே அவள் ஆள் அனுப்பித் தன் இளைய மகன் யாக்கோபை அழைத்து, அவனிடம், “இதோ, உன் சகோதரன் ஏசா உன்னைக் கொல்வதை நினைத்து தன்னைத் தேற்றிக்கொள்கிறான்[a]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன்னைத் தேற்றிக்கொள்கிறான்” என்பது, உன்னைக் கொல்வதை நினைத்து அவன் ஆறுதல் அல்லது மனநிறைவு அடைகிறான் என்ற பொருளையும் கொண்டிருக்கலாம்.
    reason: מִתְנַחֵם என்ற சொல்லின் இச்சூழலிலுள்ள கடுமையான, ஓரளவு இருபொருளுள்ள நுணுக்கத்தை விளக்குகிறது.
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: தெரிவிக்கப்பட்டன
  rationale: இச்செயலைச் செய்தவர் குறிப்பிடப்படாத எபிரெய மறைமுக வினை வடிவத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: அழைத்துவரச் செய்து
  rationale: சொல்லுக்கு சொல் ‘ஆள் அனுப்பி அழைத்தாள்’ என்பதன் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: מִתְנַחֵם
  choice: தன்னைத் தேற்றிக்கொள்கிறான்
  rationale: நிஃபால் வினையின் தன்னிலைப் பொருளையும், கொலை எண்ணத்தில் ஆறுதல் காணும் மூலவாக்கியத்தின் கடுமையான உருவகத்தையும் பாதுகாக்கிறது.
- source_word: לְךָ לְהָרְגֶךָ
  choice: உன்னைக் கொல்வதை நினைத்து
  rationale: ‘உன்னைப் பொறுத்தவரை/உனக்கு எதிராக—உன்னைக் கொல்ல’ என்ற நோக்கத்தை தமிழில் தெளிவாகத் தருகிறது; நிகழ்ந்த கொலையாக அல்ல, எதிர்நோக்கும் எண்ணமாகக் காட்டுகிறது.
theological_decisions:
- issue: ஏசாவின் மனநிலையை நோக்கமா, திட்டமா, ஆறுதலா எனத் தீர்மானித்தல்
  choice: தன்னைத் தேற்றிக்கொள்கிறான்
  alternative: உன்னைக் கொல்லத் திட்டமிடுகிறான்
  rationale: மூலத்தின் மִתְנַחֵם என்ற அபூர்வமான, மனநிலையைக் குறிக்கும் சொல்லை வெறும் ‘திட்டமிடுதல்’ என்று ஒற்றைப்படுத்தாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மூத்த மகன்/இளைய மகன்’ என்ற இணை அமைப்பும், ‘இதோ’ என்ற கவன ஈர்ப்புச் சொல்லும் மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கின்றன.
