base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/039.yaml
  text: Then his father Isaac answered and said to him[a], “Behold, your dwelling shall be away from the richness of the earth, and away from the dew of heaven above.”
translation:
  language: ta
  text: 'அப்போது அவனுடைய தந்தை ஈசாக்கு அவனுக்குப் பதிலளித்துச் சொன்னார்: “இதோ, பூமியின் செழுமையிலிருந்து விலகி உன் குடியிருப்பு இருக்கும்; மேலிருந்து வரும் வானத்தின் பனியிலிருந்தும் விலகி இருக்கும்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் குடியிருப்பு பூமியின் செழுமையிலிருந்தும், மேலிருந்து வரும் வானத்தின் பனியிலிருந்தும் இருக்கும்.” எபிரெய முன்னிடைச்சொல் நேர்மறையாக ‘இலிருந்து/உடைய’ என்றும், விலகலைக் குறிக்கும் வகையில் ‘விலகி’ என்றும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: பதிலளித்தார்
  rationale: ענה என்பதன் வழக்கமான கதைநடைப் பொருளான ‘பதில் சொன்னார்’ என்பதை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: אָבִיו
  choice: அவனுடைய தகப்பனாகிய
  rationale: ஈசாக்குக்கும் ஏசாவுக்கும் இடையிலான தந்தை–மகன் உறவை எபிரெய உரையைப் போல வெளிப்படையாக வைத்திருக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, தொடர்ந்து வரும் உரைக்கு வலியுறுத்தல் அளிக்கும் எபிரெய உரையாடல் குறியை dignified, familiar Tamil equivalent மூலம் காக்கிறது.
- source_word: מִשְׁמַנֵּי הָאָרֶץ
  choice: பூமியின் செழுமைக்கு அப்பால்
  rationale: שְׁמַנִּים என்பதன் உருவகமான வளம் அல்லது செழுமை என்ற பொருளைத் தருகிறது; מִן இங்கு பிரிவு அல்லது விலகலைக் குறிக்கும் வாசிப்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: מוֹשָׁבֶךָ
  choice: உன் குடியிருப்பு
  rationale: מוֹשָׁב குறிக்கும் வாழிடம் அல்லது குடியிருக்கும் இடம் என்ற இடவியல் பொருளை இயல்பாகக் காக்கிறது.
- source_word: וּמִטַּל הַשָּׁמַיִם
  choice: வானத்தின் பனிக்கும் அப்பால்
  rationale: முந்தைய מִן போலவே இதையும் விலகலைக் குறிக்கும் வகையில் வாசிக்கிறது; טַל என்பதற்கு தமிழில் வழக்கமான ‘பனி’ பயன்படுத்தப்படுகிறது.
- source_word: מֵעָל
  choice: மேலே
  rationale: வானத்தின் உயர்நிலையைச் சுட்டும் எபிரெய இடவியல் சொல்லைச் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: ஈசாக்கு ஏசாவிடம் கூறியதில் מִן என்ற முன்னிடைச்சொல்லின் பொருள்
  choice: பூமியின் செழுமைக்கும் வானத்தின் பனிக்கும் ‘அப்பால்’—விலக்கப்பட்ட அல்லது தொலைவான இடம்
  alternative: பூமியின் செழுமையிலிருந்தும் வானத்தின் பனியிலிருந்தும் நன்மை பெறும் இடம்
  rationale: எபிரெய מִן மூலம் அல்லது பங்கு என்ற நேர்மறைப் பொருளையும், விலகல் என்ற எதிர்மறைப் பொருளையும் ஏற்க முடியும். முந்தைய வசனத்தில் யாக்கோபுக்குக் கொடுக்கப்பட்ட ஆசீர்வாதத்துடனான வேறுபாடும் ஏசாவின் குறைக்கப்பட்ட பங்கும் முதன்மை உரையில் விலகல் வாசிப்பை ஆதரிக்கின்றன; ஆயினும் உண்மையான மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ உரையின் solemn attention marker-ஐ காக்கிறது; ‘செழுமை’, ‘குடியிருப்பு’ ஆகியவை தெளிவையும் மூலத்தின் உருவக மற்றும் இடவியல் நுணுக்கத்தையும் சமநிலைப்படுத்துகின்றன.
