source:
  edition: WLC
  text: וַ/עֲשֵׂה לִ֨/י מַטְעַמִּ֜ים כַּ/אֲשֶׁ֥ר אָהַ֛בְתִּי וְ/הָבִ֥יאָ/ה לִּ֖/י וְ/אֹכֵ֑לָה בַּ/עֲב֛וּר תְּבָרֶכְ/ךָ֥ נַפְשִׁ֖/י בְּ/טֶ֥רֶם אָמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/004.yaml
  text: Prepare for me tasty food[a], just as I love, and bring it to me, that I may eat[c][b], so that my soul may bless you before I die.
translation:
  language: ta
  text: நான் விரும்புகிறபடி சுவையான உணவை[a] எனக்காகத் தயாரித்து என்னிடம் கொண்டுவா; நான் அதைச் சாப்பிட்டு, இறப்பதற்கு முன் என் உயிர்[b] உன்னை ஆசீர்வதிக்கும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சுவைமிக்க உணவு” அல்லது “சிறப்பு உணவுகள்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “என் உயிர் உன்னை ஆசீர்வதிக்க.” இங்கு “என் உயிர்” என்பது ஈசாக்கு தாமே, அவரது முழுத் தனிப்பட்ட இருப்பில், ஆசீர்வதிப்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה לִי מַטְעַמִּים
  choice: சுவையான உணவை எனக்காகத் தயாரித்து
  rationale: சமையல் சூழலில் עשה என்பதற்கு ‘தயாரி’ இயல்பானது. מַטְעַמִּים சிறப்பாகத் தயாரிக்கப்பட்ட சுவைமிக்க உணவைக் குறிக்கிறது; ‘சுவையான உணவு’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: כַּאֲשֶׁר אָהַבְתִּי
  choice: நான் விரும்புகிறபடி
  rationale: ஈசாக்கின் தனிப்பட்ட விருப்பத்தை இயல்பாகவும் மூலத்தின் ஒப்புமை அமைப்புக்கு நெருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: וְהָבִיאָה לִּי
  choice: என்னிடம் கொண்டுவா
  rationale: பேசுகிறவரிடம் உணவைக் கொண்டுவரும் நேரடியான கட்டளையை இயல்பான தமிழில் தருகிறது.
- source_word: וְאֹכֵלָה
  choice: நான் அதைச் சாப்பிட்டு
  rationale: கட்டளையைத் தொடர்ந்து ஈசாக்கு மேற்கொள்ள விரும்பும் செயலைக் காட்டும் cohortative வடிவை, அடுத்த நோக்கக் கூறுடன் இயல்பாக இணைக்கிறது.
- source_word: בַּעֲבוּר
  choice: ஆசீர்வதிப்பதற்காக
  rationale: இங்கு இச்சொல் இறுதி நோக்கத்தை அறிமுகப்படுத்துகிறது. தமிழ் வாக்கிய அமைப்புக்காக நோக்கக் கூறு முன்னால் வைக்கப்பட்டுள்ளது.
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: என் உயிர் உன்னை ஆசீர்வதிப்பதற்காக
  rationale: נֶפֶשׁ என்பதை முற்றிலும் நீக்கி வெறும் ‘நான்’ என்று மாற்றாமல், மூலத்தின் ‘என் உயிர்’ என்ற தனிப்பட்ட முழுமையின் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: בְּטֶרֶם אָמוּת
  choice: இறப்பதற்குமுன்
  rationale: காலக் கூறை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: נַפְשִׁי என்பதன் மொழிபெயர்ப்பு
  choice: என் உயிர்
  alternative: நான் மனமார / என் ஆத்துமா
  rationale: ‘என் உயிர்’ என்பது எபிரெயச் சொல்லின் வெளிப்படையான இருப்பைத் தக்கவைத்து, ‘ஆத்துமா’ என்பதால் உருவாகக்கூடிய உடல்–ஆத்துமா குறித்த பிற்காலத் தத்துவப் பொருளைத் தேவையின்றி இறக்குமதி செய்யாது. இது இங்கு ஈசாக்கையே அவரது முழுத் தனிப்பட்ட இருப்பில் குறிக்கும் மரபுத்தொடர் என்பதைக் காலடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிமையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. தமிழில் இயல்பான நோக்க வாக்கிய அமைப்பைப் பெற இறுதி நோக்கக் கூறு முன்வைக்கப்பட்டுள்ளது. ‘என் உயிர்’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டு காலடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
