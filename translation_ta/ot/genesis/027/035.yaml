  yaml_path: translation/ot/genesis/027/035.yaml
  text: And he said[a], “Your brother came with deceit and took your blessing.”
translation:
  language: ta
  text: அதற்கு அவர், “உன் சகோதரன் வஞ்சகமாக வந்து, உன் ஆசீர்வாதத்தை எடுத்துக்கொண்டான்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அதற்கு அவர் … என்றார்
  rationale: எபிரெயக் கதைத் தொடரில் ஈசாக்கின் பதிலை அறிமுகப்படுத்தும் வழக்கமான வடிவம். தமிழில் உரையாடல் ஓட்டத்தை இயல்பாகக் காட்ட ‘அதற்கு’ பயன்படுத்தப்பட்டது.
- source_word: בָּא
  choice: வந்து
  rationale: முடிவுற்ற கடந்தகாலச் செயலைக் குறிக்கிறது; அடுத்த வினையுடன் இணைந்த இயல்பான தமிழ்த் தொடராக ‘வந்து’ அமைக்கப்பட்டது.
- source_word: אָחִיךָ
  choice: உன் சகோதரன்
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள உறவுமுறைச் சொல்லை நேரடியாக மொழிபெயர்க்கிறது; பெயரைப் பதிலீடு செய்யாமல் மூலத்தின் வலியுறுத்தலைக் காக்கிறது.
- source_word: בְּמִרְמָה
  choice: வஞ்சகமாக
  rationale: בְּ + מִרְמָה இங்கு செயல் நடந்த விதத்தையோ வழியையோ குறிக்கிறது. ‘வஞ்சகமாக’ என்பது நவீனத் தமிழில் இயல்பாகவும் அதன் எதிர்மறை ஒழுக்கப் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: וַיִּקַּח
  choice: எடுத்துக்கொண்டான்
  rationale: לקח என்பதன் வழக்கமான பொருளைத் தருகிறது. தமிழில் ஆசீர்வாதத்தைத் தனக்குரியதாகப் பெற்ற செயலை இயல்பாகச் சொல்கிறது; ‘பறித்துக்கொண்டான்’ என்று வன்முறையை மிகைப்படுத்தவில்லை.
- source_word: בִּרְכָתֶךָ
  choice: உன் ஆசீர்வாதத்தை
  rationale: ‘உனக்குரிய ஆசீர்வாதம்’ என்ற சூழல்சார் பொருளைச் சுருக்காமல், மூலத்தின் உடைமை அமைப்பை நேரடியாகப் பாதுகாக்கிறது.
