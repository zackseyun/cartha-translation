translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வஞ்சகமாக’ என்பது எபிரெயப் பெயர்ச்சொல்-முன்னிடைச்சொல் அமைப்பைத் தமிழில் இயல்பான வினையடையாக வழங்குகிறது; தனிக் குறிப்புரை தேவையில்லை.
