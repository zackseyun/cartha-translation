  yaml_path: translation/ot/genesis/027/003.yaml
  text: Now then[b][a], please take your equipment—your quiver and your bow—and go out to the field and hunt game for me.
translation:
  language: ta
  text: இப்பொழுது, தயவுசெய்து உன் கருவிகளை—உன் அம்பறாத்தூணியையும் வில்லையும்—எடுத்துக்கொண்டு, வயல்வெளிக்குச் சென்று, எனக்காக வேட்டைப் பொருளை வேட்டையாடிப் பிடி.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேட்டையாடிப் பெறும் உணவைப் பிடி.” எபிரெயச் சொல் வெளியில் வேட்டையாடிப் பெறப்படும் உணவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: அடுத்த கட்டளையை அறிமுகப்படுத்தும் உரையாடல் மாற்றத்தையும் உடனடித் தன்மையையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: שָׂא נָא
  choice: தயவுசெய்து ... எடுத்துக்கொண்டு
  rationale: שׂא இச்சூழலில் கருவிகளை எடுத்துச் செல்வதைக் குறிக்கிறது; נָא வேண்டுகோளின் மென்மை அல்லது வலியுறுத்தலைக் காட்டுவதால் ‘தயவுசெய்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: כֵלֶיךָ
  choice: உன் வேட்டைக் கருவிகளாகிய
  rationale: כְּלִי என்பது பொதுவாகப் பொருள், கருவி அல்லது ஆயுதத்தைக் குறிக்கும் விரிவான சொல். தொடர்ந்து வரும் அம்பறாத்தூணியும் வில்லும் இதனை விளக்குவதால், வேட்டையின் சூழலைத் தெளிவுபடுத்தும் பொதுப்பெயராக இவ்வாறு தரப்பட்டது.
- source_word: תֶּלְיְךָ
  choice: உன் அம்பறாத்தூணியை
  rationale: இச்சொல் அம்புகளை வைத்துத் தொங்கவிடும் உறை அல்லது அம்பறாத்தூணியைக் குறிக்கிறது; வேட்டைச் சூழலுக்கு ஏற்ற நிலையான தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְקַשְׁתֶּךָ
  choice: உன் வில்லையும்
  rationale: קֶשֶׁת என்பதன் நேரடியான, தெளிவான தமிழ் இணை ‘வில்’.
- source_word: וְצֵא הַשָּׂדֶה
  choice: வெளிக்குச் சென்று
  rationale: שָׂדֶה இங்கு பயிர் வயலை மட்டும் அல்லாமல் திறந்த வெளி அல்லது நாட்டுப்புறத்தையும் குறிக்கலாம். வேட்டைக்குச் செல்லும் சூழலில் ‘வெளி’ அந்தப் பரப்பை இயல்பாகக் காட்டுகிறது.
- source_word: וְצוּדָה לִּי צידה
  choice: எனக்காக வேட்டையாடு
  rationale: வினையும் அதே வேர் சார்ந்த பெயர்ச்சொல்லும் சேர்ந்து ‘எனக்காக வேட்டைப் பொருளை வேட்டையாடு’ என்ற கருத்தைத் தருகின்றன. தமிழில் தேவையற்ற இரட்டிப்பைத் தவிர்த்து இயல்பாகச் சுருக்கப்பட்டது; வேட்டையாடிப் பெறும் உணவு என்ற பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
