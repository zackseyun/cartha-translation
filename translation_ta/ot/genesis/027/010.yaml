  yaml_path: translation/ot/genesis/027/010.yaml
  text: Then you shall bring it to your father, and he will eat, so that he may bless you before his death.
translation:
  language: ta
  text: அவர் அதைச் சாப்பிட்டு, இறப்பதற்கு முன் உன்னை ஆசீர்வதிப்பதற்காக, அதை உன் தந்தையிடம் கொண்டுபோ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: கொண்டுபோ
  rationale: இணைப்புச் சொல்லுடன் வரும் இரண்டாம் நபர் ஆண்பால் ஒருமை வினை வடிவம், சூழலில் அறிவுறுத்தலின் அடுத்த படியைச் சுட்டுகிறது. தமிழில் இயல்பான கட்டளை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: לְאָבִיךָ
  choice: உன் தந்தையிடம்
  rationale: אָב என்பதன் வழக்கமான, கண்ணியமான நவீனத் தமிழ் மொழிபெயர்ப்பு ‘தந்தை’; לְ என்ற முன்னொட்டின் திசைப் பொருளை ‘-இடம்’ வெளிப்படுத்துகிறது.
- source_word: וְאָכָל
  choice: அவர் அதைச் சாப்பிட்டு
  rationale: திட்டமிடப்பட்ட செயல்களின் தொடர்ச்சியில் வரும் ஈசாக்கின் அடுத்த செயலை இது குறிக்கிறது. தமிழில் இணைவினையெச்ச வடிவம் செயல் தொடர்ச்சியை இயல்பாகத் தருகிறது; ‘அதை’ என்பது சூழலில் உள்ள உணவைக் குறிக்கத் தெளிவுக்காக வெளிப்படுத்தப்பட்டது.
- source_word: בַּעֲבֻר אֲשֶׁר
  choice: ஆசீர்வதிக்கும்படி அப்படிச் செய்
  rationale: இந்தச் சேர்க்கை நோக்கத்தை அறிமுகப்படுத்துகிறது. எபிரெய வாக்கியத்தின் நோக்கத் தொடர்பை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்ட இவ்வாறு அமைக்கப்பட்டது.
- source_word: יְבָרֶכְךָ
  choice: உன்னை ஆசீர்வதிக்கும்படி
  rationale: ברך என்பதன் பியேல் வடிவம் இங்கு தந்தை மகனுக்கு அளிக்கும் ஆசீர்வாதத்தைக் குறிக்கிறது. நோக்க வாக்கியத்தோடு இணைக்க ‘-க்கும்படி’ பயன்படுத்தப்பட்டது.
- source_word: לִפְנֵי מוֹתוֹ
  choice: தான் இறப்பதற்கு முன்
  rationale: சொற்பொருள் ‘அவருடைய மரணத்திற்கு முன்.’ தமிழில் இயல்பாக இருக்க வினைச்சொல் அமைப்பு பயன்படுத்தப்பட்டது; ‘தான்’ என்பது வாக்கிய எழுவாயான தந்தையையே திரும்பச் சுட்டுகிறது.
