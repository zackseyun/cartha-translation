  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. எபிரெய மூலத்தின் செயல் வரிசையும் நோக்கத் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
