  yaml_path: translation/ot/genesis/027/026.yaml
  text: Then his father Isaac said to him[a], “Come near, please, and kiss me, my son.”
translation:
  language: ta
  text: பின்பு அவனுடைய தந்தை ஈசாக்கு அவனிடம், “தயவுசெய்து அருகே வா; என்னை முத்தமிடு, என் மகனே” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் ‘பின்பு’ அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵלָיו
  choice: அவனிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதைத் தமிழ் வழக்கில் இயல்பாகக் குறிக்கிறது.
- source_word: יִצְחָק אָבִיו
  choice: அவனுடைய தகப்பனாகிய ஈசாக்கு
  rationale: எபிரெயச் சொற்றொடரின் உறவுமுறை வலியுறுத்தலையும் பெயருடனான இணைப்பையும் காக்கிறது.
- source_word: גְּשָׁה
  choice: அருகில் வந்து
  rationale: உடலளவில் நெருங்கி வருமாறு கூறும் கட்டளையைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: கட்டளையை மென்மையாக்கும் வேண்டுகோள் இடைச்சொல்லின் பணியைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וּשְׁקָה לִּי
  choice: என்னை முத்தமிடு
  rationale: வினையுடன் சேர்ந்த முதலாம் நபர் குறிப்பு தமிழில் நேரடிச் செயப்படுபொருளாக இயல்பாக அமைகிறது.
- source_word: בְּנִי
  choice: என் மகனே
  rationale: விளிவேற்றுமையையும் தந்தை–மகன் உறவின் பாசத் தொனியையும் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரை. ‘தகப்பன்’ என்பது வேதாகமச் சூழலுக்குரிய மரியாதைத் தொனியைத் தக்கவைக்கிறது; உரையாடல் மட்டும் சாதாரண வாசகருக்கு எளிதாக அமைக்கப்பட்டுள்ளது.
