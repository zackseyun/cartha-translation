  text: until your brother’s anger turns away from you[a], and he forgets what you have done to him. Then I will send and bring you from there[c][b]. Why should I be bereaved of both of you in one day?
translation:
  language: ta
  text: உன் சகோதரனின் கோபம் உன்னைவிட்டு விலகி[a], நீ அவனுக்குச் செய்ததை அவன் மறக்கும்வரை. பிறகு நான் அனுப்பி, அங்கிருந்து உன்னை அழைத்துக்கொள்வேன்[b]. ஒரே நாளில் உங்கள் இருவரையும் நான் ஏன் இழக்க வேண்டும்?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “உன் சகோதரனின் கோபம் உன்னைவிட்டு விலகும்வரை.” கோபம் விலகுவதை எபிரெயம் ‘திரும்புதல்’ என்ற வினைச்சொல்லால் கூறுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அங்கிருந்து உன்னை எடுத்துக்கொள்வேன்.” இங்கு அங்கிருந்து உன்னை அழைத்துவருவது பொருள்.
    reason: lexical_alternative
  - marker: c
    text: “ஒரே நாளில் உங்கள் இருவரையும் இழப்பது” என்பது இவர்களின் மோதலின் விளைவாக இரு மகன்களையும் இழந்துவிடுவேனோ என்ற ரெபெக்காளின் அச்சத்தைக் குறிக்கலாம்; இருவரும் ஒரே விதத்தில் இழக்கப்படுவார்கள் என்று வசனம் கூறவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: עַד שׁוּב אַף אָחִיךָ מִמְּךָ
  choice: உன் சகோதரனுக்கு உன்மேல் இருக்கும் கோபம் தணிந்து ... வரை
  rationale: שׁוּב + אַף என்பது கோபம் ஒருவரைவிட்டு விலகுவதைச் சுட்டும் எபிரெய மொழிவழக்கு. நவீன தமிழில் ‘கோபம் தணிதல்’ இயல்பாகவும் பொருளுக்கு நெருக்கமாகவும் உள்ளது. முந்தைய வசனத்திலிருந்து தொடரும் காலவரம்பைத் தமிழில் முழுமையாக்க ‘அங்கே இரு’ சூழலிலிருந்து வெளிப்படையாகச் சேர்க்கப்பட்டது.
- source_word: וְשָׁכַח אֵת אֲשֶׁר עָשִׂיתָ לּוֹ
  choice: நீ அவனுக்குச் செய்ததை அவன் மறக்கும்வரை
  rationale: யாக்கோபின் முந்தைய செயலை நேரடியாகவும் இயல்பான தமிழிலும் எடுத்துரைக்கிறது.
- source_word: וְשָׁלַחְתִּי
  choice: பிறகு நான் ஆள் அனுப்பி
  rationale: வினைச்சொல் வெறுமனே ‘அனுப்புவேன்’ என்று இருந்தாலும், யாரையாவது அனுப்புவதே சூழலில் பொருள்; ‘ஆள்’ என்பது தமிழில் தேவையான இயல்பான நிரப்பல்.
- source_word: וּלְקַחְתִּיךָ מִשָּׁם
  choice: அங்கிருந்து உன்னை அழைத்துக்கொள்வேன்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’; இங்கு ரெபெக்காள் யாக்கோபை அங்கிருந்து வரவழைப்பதைக் குறிக்கிறது. ‘திரும்ப’ என்பது எபிரெயத்தில் வெளிப்படையாக இல்லாததால் முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: לָמָה אֶשְׁכַּל גַּם שְׁנֵיכֶם יוֹם אֶחָד
  choice: ஒரே நாளில் உங்கள் இருவரையும் நான் ஏன் இழக்க வேண்டும்?
  rationale: שכל பிள்ளைகளைப் பறிகொடுத்த தாயின் துயரைக் குறிக்கலாம். ‘இழக்க வேண்டும்’ என்பது தற்போதைய தமிழில் இயல்பாக இருந்து அந்தப் பறிகொடுத்தல் உணர்வையும் காக்கிறது.
theological_decisions:
- issue: ‘ஒரே நாளில் இருவரையும் இழத்தல்’ என்பதன் துல்லிய நிகழ்வுமுறை
  choice: இரு மகன்களையும் இழப்பேன் என்ற ரெபெக்காளின் பொதுவான அச்சமாகவே மொழிபெயர்க்கப்பட்டது.
  alternative: ஏசா கொல்லப்படுவதும் யாக்கோபு பழிவாங்கப்பட்டு கொல்லப்படுவதும் எனத் தெளிவுபடுத்துதல்.
  rationale: மூலவசனம் இழப்பின் முறையை விளக்கவில்லை; ஆகவே சாத்தியமான நிகழ்வை உரைக்குள் உறுதிப்படுத்தாமல் அதன் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். ‘கோபம் தணிதல்,’ ‘ஆள் அனுப்பி,’ ‘அழைத்துக்கொள்வேன்’ போன்ற இயல்பான சொற்றொடர்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் தெளிவின்மை குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
