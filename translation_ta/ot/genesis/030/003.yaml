  text: וַ/תֹּ֕אמֶר הִנֵּ֛ה אֲמָתִ֥/י בִלְהָ֖ה בֹּ֣א אֵלֶ֑י/הָ וְ/תֵלֵד֙ עַל בִּרְכַּ֔/י וְ/אִבָּנֶ֥ה גַם אָנֹכִ֖י מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/003.yaml
  text: Then she said[a], “Here is my female servant Bilhah. Go in to her, so that she may bear on my knees[c][b], and I too may be built up through her.”
translation:
  language: ta
  text: அப்போது அவள், “இதோ, என் பணிப்பெண் பில்காள் இருக்கிறாள். நீ அவளிடம் செல்; அவள் என் முழங்கால்களின்மேல் பிள்ளை பெறவும்[a], அவள் மூலமாக நானும் கட்டியெழுப்பப்படவும்[b]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “என் முழங்கால்களின்மேல் பிள்ளை பெறவும்.” பணிப்பெண்ணுக்குப் பிறக்கும் குழந்தையை மனைவி தன் குழந்தையாகக் குறியீட்டளவில் ஏற்றுக்கொள்ளும் அக்கால வழக்கை இது குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “அவள் மூலமாக நானும் பிள்ளைகளைப் பெறவும்.” எபிரெயத்தில் “கட்டியெழுப்பப்பட” என்ற குடும்பம் அல்லது சந்ததி சார்ந்த உருவகம் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָתִי
  choice: என் பணிப்பெண்
  rationale: אמה என்பது சமூகத்தில் கீழ்நிலையில் இருந்த பெண் பணியாளரை அல்லது அடிமைப் பெண்ணைக் குறிக்கலாம். ‘பணிப்பெண்’ என்பது நவீன தமிழில் இயல்பாகவும் மரியாதையான நடையிலும் அந்தச் சார்புநிலையை வெளிப்படுத்துகிறது.
- source_word: בֹּא אֵלֶיהָ
  choice: நீ அவளிடம் உறவுகொள்
  rationale: இது பாலுறவைக் குறிக்கும் எபிரெய மறைமுகச் சொற்றொடர். தமிழில் சொற்சொல்லாக மொழிபெயர்த்தால் பொருள் தெளிவாகாது; ‘உறவுகொள்’ அதன் மறைமுகத் தன்மையையும் பொருளையும் காக்கிறது.
- source_word: וְתֵלֵד עַל בִּרְכַּי
  choice: அவள் என் முழங்கால்களின்மேல் பிள்ளை பெறட்டும்
  rationale: ‘என் முழங்கால்களின்மேல்’ என்ற பண்பாட்டுச் சிறப்புடைய உருவகத்தை முதன்மை உரையில் வைத்துப், תֵלֵד என்பதன் மகப்பேற்றுப் பொருளை ‘பிள்ளை பெறட்டும்’ என இயல்பாக வழங்குகிறது.
- source_word: וְאִבָּנֶה
  choice: நானும் கட்டியெழுப்பப்படுவேன்
  rationale: בנה வினையின் நிபால் வடிவிலுள்ள ‘கட்டியெழுப்பப்படுதல்’ என்ற உருவகத்தைப் பாதுகாக்கிறது. இச்சூழலில் அது பிள்ளைகள் மூலம் குடும்பம் உருவாகுதல் அல்லது நிலைபெறுதலைக் குறிக்கிறது.
- source_word: מִמֶּנָּה
  choice: அவள் மூலமாக
  rationale: பில்காள் வழியாக ராகேல் எதிர்பார்க்கும் குடும்பப் பெருக்கைச் சாதனப் பொருளில் இயல்பாகக் காட்டுகிறது.
- source_word: גַם אָנֹכִי
  choice: நானும்
  rationale: ராகேலின் பிள்ளையின்மைக்கும் பில்காள் பெறவிருக்கும் பிள்ளைக்கும் இடையிலான எதிர்நிலையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பில்காளின் குழந்தை ராகேலுடையதாகக் கருதப்படும் விதம்
  choice: ‘என் முழங்கால்களின்மேல்’ என்ற மூல உருவகத்தை உரையில் காத்து, அதன் சாத்தியமான சமூகப் பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: நேரடியாக ‘அந்தக் குழந்தையை என் குழந்தையாக ஏற்றுக்கொள்வேன்’ என்று பொருள் விளக்கி மொழிபெயர்த்தல்
  rationale: மூலச் சொற்றொடர் ஒரு பண்பாட்டு நடைமுறையைச் சுட்டக்கூடும்; ஆனால் அதன் துல்லியமான சடங்கு இயல்பு உறுதியல்ல. ஆகவே பொருளை ஒரே விளக்கமாக முடிவுசெய்யாமல் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பாலுறவைக் குறிக்கும் எபிரெய மறைமுக மொழி தமிழிலும் மென்மையாகத் தரப்பட்டுள்ளது; ‘முழங்கால்களின்மேல்’ மற்றும் ‘கட்டியெழுப்பப்படுவேன்’ ஆகிய மூல உருவகங்கள் விளக்க அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
