revisions:
- from: அப்போது அவள், “இதோ, என் பணிப்பெண் பில்காள் இருக்கிறாள். நீ அவளிடம் உறவுகொள்; அவள் என் முழங்கால்களின்மேல் பிள்ளை பெறட்டும்[a]. அவள் மூலமாக நானும் கட்டியெழுப்பப்படுவேன்[b]” என்றாள்.
  to: அப்போது அவள், “இதோ, என் பணிப்பெண் பில்காள் இருக்கிறாள். நீ அவளிடம் செல்; அவள் என் முழங்கால்களின்மேல் பிள்ளை பெறவும்[a], அவள் மூலமாக நானும் கட்டியெழுப்பப்படவும்[b]” என்றாள்.
