  text: כִּ֡י מְעַט֩ אֲשֶׁר הָיָ֨ה לְ/ךָ֤ לְ/פָנַ/י֙ וַ/יִּפְרֹ֣ץ לָ/רֹ֔ב וַ/יְבָ֧רֶךְ יְהוָ֛ה אֹתְ/ךָ֖ לְ/רַגְלִ֑/י וְ/עַתָּ֗ה מָתַ֛י אֶֽעֱשֶׂ֥ה גַם אָנֹכִ֖י לְ/בֵיתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/030.yaml
  text: For the little that you had before me has increased into abundance[a], and Yahweh has blessed you at my coming. And now[b], when shall I also provide for my own household?
translation:
  language: ta
  text: நான் வருவதற்கு முன்பு உம்மிடம் இருந்தது கொஞ்சமே; ஆனால் அது பெருகி மிகுதியாயிற்று. என் வருகையால்[a] யாவே உம்மை ஆசீர்வதித்தார். இப்போதோ, என் சொந்தக் குடும்பத்திற்காக நானும் எப்போது ஏற்பாடு செய்வேன்?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படி, ‘என் காலடியில்.’ இது ‘நான் வந்ததிலிருந்து’ அல்லது ‘என் நிமித்தம்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் சொந்த வீட்டிற்காக நானும் எப்போது ஏதாவது செய்வேன்?’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט אֲשֶׁר הָיָה לְךָ לְפָנַי
  choice: நான் வருவதற்கு முன்பு உம்மிடம் இருந்தது கொஞ்சமே
  rationale: לְפָנַי என்பதன் சொற்பொருள் ‘எனக்கு முன்’ என்றாலும், இச்சூழலில் யாக்கோபு வருவதற்கு முன்பு லாபானிடம் இருந்த சிறிய உடைமையைக் குறிக்கிறது; நவீன தமிழில் காலப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּפְרֹץ לָרֹב
  choice: அது பெருகி மிகுதியாயிற்று
  rationale: פרץ குறிக்கும் வேகமான அல்லது எல்லைமீறிய பெருக்கத்தையும், לָרֹב குறிக்கும் மிகுதியான விளைவையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதநாமமான YHWH-ஐ பெயராகவே ஒலிபெயர்க்கிறது.
- source_word: לְרַגְלִי
  choice: என் வருகையால்
  rationale: சொற்படி ‘என் காலடியில்’ என இருந்தாலும், இங்கு யாக்கோபின் வருகையுடன் அல்லது அவன் நிமித்தமாக ஆசீர்வாதம் வந்ததைக் குறிக்கும் மரபுத்தொடர்; சூழலுக்கு ஏற்ற காரணப்பொருள் தமிழில் தரப்படுகிறது.
- source_word: מָתַי אֶעֱשֶׂה גַם אָנֹכִי לְבֵיתִי
  choice: என் சொந்தக் குடும்பத்திற்காக நானும் எப்போது ஏற்பாடு செய்வேன்?
  rationale: עשה לְבֵיתִי என்பதிலுள்ள குடும்ப நலனுக்காகச் செயல்படும் பொருளை ‘ஏற்பாடு செய்வேன்’ என்பது இயல்பாக வெளிப்படுத்துகிறது; גַם אָנֹכִי-யின் வலியுறுத்தலை ‘நானும்’ தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, தனிப்பட்ட இறைநாமம் உள்ளது; ஆகவே அதை மறைக்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: לְרַגְלִי ஆசீர்வாதத்தின் கால அல்லது காரண உறவு
  choice: என் வருகையால்
  alternative: நான் வந்ததிலிருந்து / என் நிமித்தம்
  rationale: இந்த மரபுத்தொடர் யாக்கோபின் வருகையோடு ஆசீர்வாதத்தை இணைக்கிறது; காரணப்பொருள் சூழலில் வலுவாக இருந்தாலும் மற்ற சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரமான, மரியாதைமிக்க தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. லாபானை நோக்கிய ஒருமை இரண்டாம் நபர் வடிவம் தமிழில் இயல்பான மரியாதைக்காக ‘உம்மிடம்/உம்மை’ என வழங்கப்பட்டுள்ளது. ‘வீடு’ என்பதன் குடும்பப் பொருள் முதன்மை உரையில் ‘குடும்பம்’ எனத் தெளிவாக்கப்பட்டு, சொற்சார்ந்த மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
