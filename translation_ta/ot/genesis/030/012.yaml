  register: நவீன, தரமான, கண்ணியமான தமிழ் நடை. எபிரெய வசனத்தின் தகவல் வரிசை பெரும்பாலும் பேணப்பட்டு, தமிழுக்கேற்ற இயல்பான வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
