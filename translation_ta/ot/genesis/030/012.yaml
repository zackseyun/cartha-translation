  yaml_path: translation/ot/genesis/030/012.yaml
  text: And Zilpah[a], Leah's female servant, bore Jacob a second son.
translation:
  language: ta
  text: லேயாளின் பணிப்பெண்ணான[a] சில்பாள் யாக்கோபுக்கு இரண்டாவது மகனைப் பெற்றெடுத்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘லேயாளின் அடிமைப்பெண்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் லேயாளைச் சார்ந்திருந்த பெண் அடிமை அல்லது பணிப்பெண்ணைக் குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: பெற்றெடுத்தாள்
  rationale: ילד என்பதன் தொடர்கதை வடிவம் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது; தமிழில் குழந்தைப் பிறப்பை இயல்பாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: זִלְפָּה
  choice: சில்பாள்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாகப் பெயர்த்தெழுதுகிறது.
- source_word: שִׁפְחַת לֵאָה
  choice: லேயாளின் பணிப்பெண்ணான
  rationale: இந்தக் கட்டமைப்புச் சொற்றொடர் சில்பாளுக்கும் லேயாளுக்கும் இடையிலான சார்பு மற்றும் சமூக நிலையைச் சுட்டுகிறது. ‘பணிப்பெண்’ என்பது பாலினத்தையும் பணிநிலையையும் நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது; அடிமை நிலையின் சாத்தியமான வலிமையான நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בֵּן שֵׁנִי
  choice: இரண்டாவது மகனை
  rationale: சொல்லாட்சிப்படி ‘இரண்டாவது மகன்’; இச்சூழலில் சில்பாள் யாக்கோபுக்குப் பெற்ற இரண்டாவது மகனைக் குறிக்கிறது.
- source_word: לְיַעֲקֹב
  choice: யாக்கோபுக்கு
  rationale: לְ என்பது பிறப்புச் சூத்திரத்தில் தந்தை அல்லது பயனாளரைச் சுட்டுகிறது; ‘யாக்கோபுக்கு’ என்பது அந்த உறவைத் தமிழில் சுருக்கமாகப் பேணுகிறது.
