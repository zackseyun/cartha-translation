  text: וַ/יֶּחֱמ֥וּ הַ/צֹּ֖אן אֶל הַ/מַּקְל֑וֹת וַ/תֵּלַ֣דְןָ הַ/צֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּ/טְלֻאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/039.yaml
  text: So the flock mated by the rods[a], and the flock bore striped, speckled[b], and spotted young.
translation:
  language: ta
  text: அவ்வாறு, மந்தை அந்தக் கோல்களின் முன் இனச்சேர்ந்தது; அந்த மந்தை வரிகளுள்ள[a], சிறுபுள்ளிகளுள்ள, திட்டுகளுள்ள[b] குட்டிகளை ஈன்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வரிகளுள்ள’ என்பதற்கு ‘பட்டைகளுள்ள’ என்றும் மொழிபெயர்க்கலாம்; சில மரபுவழி மொழிபெயர்ப்புகளில் ‘வளைய வரிகளுள்ள’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘சிறுபுள்ளிகளுள்ள’ (נְקֻדִּים) என்பதற்கும் ‘திட்டுகளுள்ள’ (טְלֻאִים) என்பதற்கும் இடையிலான வேறுபாடு தோராயமானது; பின்னைய சொல்லை ‘ஒட்டுகளுள்ள,’ ‘திட்டுத்திட்டாக உள்ள,’ அல்லது ‘மங்கலான புள்ளிகளுள்ள’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱמוּ
  choice: இனச்சேர்க்கை கொண்டது
  rationale: יחם என்பது விலங்குகள் சூடேறி இனப்பெருக்கத்திற்குத் தயாராவதைக் குறிக்கும்; இச்சூழலில் நிகழ்ந்த இனப்பெருக்கச் செயலை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַצֹּאן
  choice: மந்தை
  rationale: צאן என்பது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய சிறுகால்நடைகளின் கூட்டுப்பெயர். ‘மந்தை’ அதன் கூட்டுப்பொருளைக் காக்கிறது; எபிரெய மூலத்தைப் போல இரு வாக்கியப் பகுதிகளிலும் மீண்டும் வருகிறது.
- source_word: אֶל הַמַּקְלוֹת
  choice: அந்தக் கோல்களுக்கு முன்பாக
  rationale: אֶל என்பதற்கு ‘நோக்கி’ அல்லது ‘அருகில்’ என்ற பொருள்கள் இருக்கலாம்; முந்தைய வசனங்களில் விவரிக்கப்படும் அமைப்பில், ஆடுகள் கோல்களைப் பார்க்கும் இடத்தில் இருந்ததைக் ‘முன்பாக’ தெளிவாகவும் அளவுக்கு மீறி விளக்காமலும் தெரிவிக்கிறது.
- source_word: וַתֵּלַדְןָ
  choice: குட்டிகளை ஈன்றது
  rationale: ילד என்பது ‘ஈன்றெடுத்தல்’ என்று பொருள். மூலத்தில் குட்டிகள் என்ற பெயர்ச்சொல் வெளிப்படையாக இல்லாவிட்டாலும், தொடர்ந்து வரும் தோற்ற விவரணைகளுக்கு உரிய பெயர்ச்சொல்லைத் தமிழில் இயல்புக்காகச் சேர்க்கிறது.
- source_word: עֲקֻדִּים
  choice: வரிகளுள்ள
  rationale: இந்தச் சொல் பட்டைகள் அல்லது வரிகள் போன்ற அடையாளங்களுள்ள விலங்குகளைக் குறிக்கிறது. ‘வரிகளுள்ள’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: נְקֻדִּים
  choice: சிறுபுள்ளிகளுள்ள
  rationale: இந்தச் சொல் சிறிய புள்ளி அடையாளங்களைக் குறிக்கிறது; அடுத்துவரும் பெரிய அல்லது ஒழுங்கற்ற திட்டுகளைக் குறிக்கும் சொல்லிலிருந்து வேறுபடுத்த ‘சிறுபுள்ளிகளுள்ள’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּטְלֻאִים
  choice: திட்டுகளுள்ள
  rationale: இந்தச் சொல் ஒழுங்கற்ற பெரிய புள்ளிகள், படிவங்கள் அல்லது நிறத்திட்டுகளைக் குறிக்கலாம். ‘திட்டுகளுள்ள’ என்பது நְקֻדִּים என்பதிலுள்ள சிறுபுள்ளிகளுடன் உள்ள தோராயமான வேறுபாட்டைக் காட்டுகிறது.
