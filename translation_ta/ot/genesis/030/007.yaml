source:
  edition: WLC
  text: וַ/תַּ֣הַר ע֔וֹד וַ/תֵּ֕לֶד בִּלְהָ֖ה שִׁפְחַ֣ת רָחֵ֑ל בֵּ֥ן שֵׁנִ֖י לְ/יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/007.yaml
  text: Bilhah[a], Rachel’s female servant, conceived again and bore Jacob a second son.
translation:
  language: ta
  text: ராகேலின் அடிமைப் பெண்ணான பில்காள் மீண்டும் கருவுற்று, யாக்கோபுக்கு இரண்டாவது மகனைப் பெற்றெடுத்தாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: கருவுற்று
  rationale: הרה என்பது கர்ப்பமடைதல் அல்லது கருத்தரித்தலைக் குறிக்கிறது; பிறப்பைத் தொடர்ந்து கூறும் இவ்விடத்தில் இயல்பான நவீனத் தமிழ் சொல்லாக ‘கருவுற்று’ அமைகிறது.
- source_word: עוֹד
  choice: மீண்டும்
  rationale: இப்பிறப்பு வரலாற்றுச் சூழலில் עוֹד நிகழ்வு மறுபடியும் நடந்ததைக் குறிக்கிறது.
- source_word: וַתֵּלֶד
  choice: பெற்றெடுத்தாள்
  rationale: கால் வடிவிலுள்ள ילד இங்கு ஒரு மகனைப் பெற்றெடுத்ததைக் குறிக்கிறது; ‘பெற்றெடுத்தாள்’ தெளிவான, இயல்பான தமிழ்.
- source_word: שִׁפְחַת
  choice: அடிமைப் பெண்ணான
  rationale: שִׁפְחָה கீழ்நிலையிலிருந்த பெண் அடிமை அல்லது பணிப்பெண்ணைக் குறிக்கிறது; ‘அடிமைப் பெண்’ அவளுடைய கட்டுப்பட்ட சமூக நிலையை மறைக்காமல் வெளிப்படுத்துகிறது.
- source_word: בֵּן שֵׁנִי
  choice: இரண்டாவது மகனை
  rationale: எபிரெயச் சொற்றொடரின் நேர்பொருள் ‘இரண்டாவது மகன்’; தமிழில் வேற்றுமை உருபுடன் ‘இரண்டாவது மகனை’ இயல்பாக அமைகிறது.
- source_word: לְיַעֲקֹב
  choice: யாக்கோபுக்கு
  rationale: இங்குள்ள ל உறவு அல்லது தந்தைமையைச் சுட்டுகிறது; அதன் வடிவத்தையும் பொருளையும் ‘யாக்கோபுக்கு’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: בִּלְהָה שִׁפְחַת רָחֵל
  choice: ராகேலின் அடிமைப் பெண்ணான பில்காள்
  rationale: மூலத்தின் உடன்பெயர்ச்சித் தொடர்பைத் தெளிவான தமிழில் காட்டி, பில்காளை ராகேலுடனான சமூக உறவால் அடையாளப்படுத்துகிறது.
