translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதையாடலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அடிமைப் பெண்’ என்பது மூலத்தில் உள்ள கட்டுப்பட்ட சமூக நிலையை வெளிப்படையாகக் காட்டுகிறது.
