- from: இன்று உமது மந்தை முழுவதற்குள்ளும் நான் சென்று, புள்ளிகளும் திட்டுகளும் உள்ள ஒவ்வொரு செம்மறியாட்டையும், செம்மறியாடுகளில் கருமை நிறமுள்ள ஒவ்வொரு ஆட்டையும்[a], வெள்ளாடுகளில் திட்டுகளும் புள்ளிகளும் உள்ள ஒவ்வொன்றையும்[b] அங்கிருந்து பிரித்தெடுக்கட்டும்; அதுவே எனக்குக் கூலியாக இருக்கும்.
  to: இன்று நான் உமது மந்தை முழுவதிலும் சென்று, புள்ளிகளும் திட்டுகளும் உள்ள ஒவ்வொரு செம்மறியாட்டையும், செம்மறியாடுகளில் அடர்நிறமுள்ள ஒவ்வொன்றையும், வெள்ளாடுகளில் திட்டுகளும் புள்ளிகளும் உள்ள ஒவ்வொன்றையும் அங்கிருந்து பிரித்தெடுக்க அனுமதியுங்கள்; அவையே எனக்குக் கூலியாக இருக்கும்.
  rationale: திருத்தம் எபிரெய மூலத்தின் பொருளை மாற்றாமல், யாக்கோபின் முன்மொழிவில் உள்ள விருப்ப/அனுமதி கோரும் நயத்தைத் தமிழில் இலக்கண ரீதியாகத் தெளிவாக்குகிறது. நிறச்சொல்லின் அளவுக்கு மீறிய குறிப்பாக்கமும் தவிர்க்கப்பட்டுள்ளது. அடிக்குறிப்புகள் மூல நிறவகைச் சொற்களின் நிச்சயமின்மையைப் பாதுகாக்கின்றன.
