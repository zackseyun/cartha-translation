translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உமது’ என்பது மரியாதையும் வேதாகம உரையாடலுக்கேற்ற இயல்பும் கொண்ட வடிவமாகத் தேர்ந்தெடுக்கப்பட்டது. செம்மறியாடு–வெள்ளாடு வேறுபாடு தெளிவாக வைக்கப்பட்டதுடன், நிற வடிவங்களின் எபிரெயச் சொற்களில் உள்ள நுண்ணிய தெளிவின்மை அடிக்குறிப்பில் பேணப்பட்டுள்ளது.
