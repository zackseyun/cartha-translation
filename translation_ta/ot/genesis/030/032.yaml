  yaml_path: translation/ot/genesis/030/032.yaml
  text: Let me pass through all your flock today[a], removing from there every speckled and spotted sheep, every dark-colored lamb among the sheep, and every spotted and speckled one among the goats[b]; and that will be my wages.
translation:
  language: ta
  text: இன்று நான் உமது மந்தை முழுவதிலும் சென்று, புள்ளிகளும் திட்டுகளும் உள்ள ஒவ்வொரு செம்மறியாட்டையும், செம்மறியாடுகளில் அடர்நிறமுள்ள ஒவ்வொன்றையும், வெள்ளாடுகளில் திட்டுகளும் புள்ளிகளும் உள்ள ஒவ்வொன்றையும் அங்கிருந்து பிரித்தெடுக்க அனுமதியுங்கள்; அவையே எனக்குக் கூலியாக இருக்கும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶעֱבֹר
  choice: நான் சென்று
  rationale: இந்த முதலாம் நபர் முற்றுப்பெறா வினை வடிவம் எதிர்காலத்தையோ விருப்பத்தையோ குறிக்கலாம். யாக்கோபின் முன்மொழிவில், தொடர்ந்து வரும் ‘பிரித்தெடுக்கட்டும்’ என்பதோடு சேர்ந்து அனுமதி கோரும் விருப்பப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּכָל צֹאנְךָ
  choice: உமது மந்தை முழுவதற்குள்ளும்
  rationale: צֹאן என்பது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய சிறுகால்நடை மந்தையைக் குறிக்கும் கூட்டுப்பெயர். ‘மந்தை’ தமிழில் இயல்பாக அந்தப் பொதுப்பொருளைப் பேணுகிறது.
- source_word: הָסֵר מִשָּׁם
  choice: அங்கிருந்து பிரித்தெடுக்கட்டும்
  rationale: விலங்குகளை மந்தையிலிருந்து நீக்குவதோடு அவற்றைத் தனியாகப் பிரிக்கும் செயலையும் சூழல் சுட்டுவதால் ‘பிரித்தெடுக்க’ என மொழிபெயர்க்கப்பட்டது.
- source_word: נָקֹד
  choice: புள்ளிகள் உள்ள
  rationale: சிறு புள்ளிகள் அல்லது பொட்டுகளால் குறிக்கப்பட்ட நிறத்தோற்றத்தைக் குறிக்கிறது.
- source_word: טָלוּא
  choice: திட்டுகள் உள்ள
  rationale: வேறு நிறத் திட்டுகள் அல்லது படலங்கள் கொண்ட தோற்றத்தைக் குறிக்கிறது; נָקֹד என்பதிலிருந்து சாத்தியமான வேறுபாட்டைப் பேணுகிறது.
- source_word: חוּם
  choice: கருமை நிறமுள்ள
  rationale: இச்சொல் கருமையான அல்லது பழுப்பு நிறமான தோற்றத்தைக் குறிக்கலாம். குறிப்பிட்ட நவீன நிறச்சாயலை அளவுக்கு மீறித் துல்லியப்படுத்தாமல் ‘கருமை நிறமுள்ள’ எனத் தரப்பட்டது.
- source_word: בַּכְּשָׂבִים
  choice: செம்மறியாடுகளில்
  rationale: כְּשָׂבִים என்பது ஆட்டுக்குட்டிகளைக் குறிக்கக்கூடியதாயினும், இங்கு வெள்ளாடுகளுக்கு எதிராகச் செம்மறியாட்டு இனத்தைப் பொதுவாகக் குறிக்கும் சூழல் உள்ளது.
- source_word: בָּעִזִּים
  choice: வெள்ளாடுகளில்
  rationale: עִזִּים என்பதற்கான இயல்பான நவீனத் தமிழ் இனப்பெயர் ‘வெள்ளாடுகள்’.
- source_word: וְהָיָה שְׂכָרִי
  choice: அதுவே எனக்குக் கூலியாக இருக்கும்
  rationale: שָׂכָר என்பது வேலைக்குரிய கூலி அல்லது ஊதியத்தைக் குறிக்கிறது; ஒருமை அமைப்பையும் முன் கூறிய விலங்குகளின் தொகுப்பைச் சுட்டும் தன்மையையும் ‘அதுவே’ பேணுகிறது.
