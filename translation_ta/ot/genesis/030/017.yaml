lexical_decisions:
- source_word: וַיִּשְׁמַע ... אֶל
  choice: செவிகொடுத்தார்
  rationale: שׁמע என்பதுடன் אֶל வரும்போது வெறுமனே ஒலியைக் கேட்டல் என்பதைக் காட்டிலும் கவனித்துக் கேட்டு சாதகமாகப் பதிலளிக்கும் நுணுக்கம் உண்டு. ‘செவிகொடுத்தார்’ என்பது அதை இயல்பான தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இக்கதைச் சூழலில் இச்சொல் ஒரே கடவுளைக் குறிக்கிறது; நவீன பொதுத் தமிழில் ‘கடவுள்’ இயல்பான தெரிவாகும்.
- source_word: לֵאָה
  choice: லேயாள்
  rationale: எபிரெயப் பெயருக்கு வழக்கிலுள்ள தமிழ் வேதாகமப் பெயர்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וַתַּהַר
  choice: அவள் கருவுற்று
  rationale: הרה என்ற வினையின் கருத்தை பிறப்புக் கதைக்கேற்ற தெளிவான, கண்ணியமான நவீன தமிழில் தருகிறது.
- source_word: וַתֵּלֶד
  choice: பெற்றாள்
  rationale: ילד இங்கு குழந்தையைப் பெற்றெடுத்தலைக் குறிக்கிறது; ‘பெற்றாள்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: לְיַעֲקֹב
  choice: யாக்கோபுக்கு
  rationale: לְ குறிக்கும் தொடர்பைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: בֵּן חֲמִישִׁי
  choice: ஐந்தாவது மகனை
  rationale: எண்ணிக்கை வரிசையையும் ஆண் குழந்தை என்ற பொருளையும் நேரடியாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: שׁמע אֶל என்பதில் உள்ள இறைப் பதிலின் நுணுக்கம்
  choice: கடவுள் லேயாளுக்குச் செவிகொடுத்தார்
  alternative: கடவுள் லேயாளுடைய வேண்டுதலைக் கேட்டார்
  rationale: எபிரெய உரையில் ‘வேண்டுதல்’ என்ற பெயர்ச்சொல் வெளிப்படையாக இல்லை. ஆகவே கடவுள் சாதகமாகக் கேட்டுப் பதிலளித்தார் என்ற சூழல் நுணுக்கத்தை ‘செவிகொடுத்தார்’ பாதுகாக்கிறது; அதேவேளை உரையில் இல்லாத சொல்லை முதன்மை உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சுருக்கமும் நிகழ்வுகளின் வரிசையும் காக்கப்பட்டுள்ளன; ‘செவிகொடுத்தார்’ என்ற சொல் வெறும் கேள்வியைக் காட்டிலும் சாதகமான கவனத்தை இயல்பாக உணர்த்துகிறது.
