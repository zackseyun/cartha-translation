  yaml_path: translation/ot/genesis/030/004.yaml
  text: So she gave him Bilhah her servant as a wife[a], and Jacob went in to her.
translation:
  language: ta
  text: எனவே அவள் தன் அடிமைப் பெண்ணாகிய[a] பில்காளை அவனுக்கு மனைவியாகக் கொடுத்தாள்; யாக்கோபு அவளுடன் சேர்ந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணிப்பெண்ணாகிய.” எபிரெயச் சொல் கீழ்நிலைச் சமூக அந்தஸ்திலிருந்த பெண் பணியாள் அல்லது அடிமையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: எனவே அவள் ... கொடுத்தாள்
  rationale: வாவ் தொடர்வினை கதையின் நிகழ்வை முன்னெடுத்துச் செல்கிறது; முந்தைய வசனத்தின் விளைவைக் காட்டும் இயல்பான தமிழாக ‘எனவே’ பயன்படுத்தப்பட்டது.
- source_word: לּוֹ
  choice: அவனுக்கு
  rationale: எபிரெய மறைமுகச் செயப்படுபொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בִּלְהָה
  choice: பில்காள்
  rationale: தமிழ் வேதாகமப் பெயரிடும் மரபுக்கு ஏற்ப தனிப்பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: שִׁפְחָתָהּ
  choice: தன் அடிமைப் பெண்ணான
  rationale: இந்தச் சொல் தாழ்நிலையிலிருந்த பெண் பணியாள் அல்லது அடிமையைக் குறிக்கிறது. ‘அடிமைப் பெண்’ அந்தக் காலத்தின் சமூகச் சார்புநிலையைத் தெளிவாகக் காட்டுகிறது; ‘தன்’ என்பது எழுவாயான ராகேலுடனான உறவை இயல்பான தமிழில் குறிக்கிறது.
- source_word: לְאִשָּׁה
  choice: மனைவியாக
  rationale: இக்கட்டமைப்பு திருமண அல்லது துணைவி உறவுக்குள் கொடுப்பதைக் குறிக்கிறது; மூலத்தில் உள்ள உறவுசார் சொல்லை விளக்கவுரை சேர்க்காமல் காக்கிறது.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: அவளுடன் சேர்ந்தான்
  rationale: இது பாலுறவைக் குறிக்கும் எபிரெய நாகரிக மறைமொழி. தமிழில் புரியக்கூடிய அதேவேளை தேவையற்ற வெளிப்படைத்தன்மையைத் தவிர்க்கும் நாகரிகமான சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: יַעֲקֹב
  choice: யாக்கோபு
  rationale: தமிழில் நிலைபெற்ற வேதாகமப் பெயர் வடிவம் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: பில்காளின் உறவு நிலை
  choice: மனைவியாக
  alternative: மறுமனைவியாக / வைப்பாட்டியாக
  rationale: மூல எபிரெயம் אִשָּׁה என்ற பொதுவான ‘பெண்/மனைவி’ சொல்லையே பயன்படுத்துகிறது. சூழலிலிருந்து ஒரு குறிப்பிட்ட சட்ட அல்லது சமய வகைப்பாட்டைச் சேர்க்காமல் மூலத்தின் சொல் தேர்வும் பதற்றமும் காக்கப்பட்டன.
translation_notes:
  register: நவீன, தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. பாலுறவைக் குறிக்கும் மூலத்தின் நாகரிக மறைமொழி ‘அவளுடன் சேர்ந்தான்’ என இயல்பாகத் தரப்பட்டுள்ளது; சமூக அந்தஸ்தை மறைக்காமல் ‘அடிமைப் பெண்’ என மொழிபெயர்க்கப்பட்டு மாற்றுச் சொல் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
