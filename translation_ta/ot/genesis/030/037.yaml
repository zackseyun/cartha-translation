  source_fidelity: 'மையப் பொருள் சரியாக உள்ளது: யாக்கோபு பசுமையான/புதிதாக வெட்டப்பட்ட பாப்லர், வாதுமை, பிளேன் மரக் கம்புகளை எடுத்து, அவற்றின் பட்டையை உரித்து வெண்மையான உட்பகுதியைத் தெரியச் செய்கிறான். ஆனால் מַקַּל என்பதற்கான ‘மரக் கொம்புகள்’ என்பது இயல்பாக மரத்தில் இணைந்த கிளைகளைக் குறிக்கக்கூடும்; இங்கு வெட்டியெடுத்துப் பயன்படுத்தப்படும் கம்புகள்/தடிகள் என்பது துல்லியமானது. மேலும் இறுதிப் பகுதியை ‘கொம்புகளிலிருந்த வெண்மையான பகுதி’ எனக் கூறுவது சற்றே கனமாக உள்ளது.'
