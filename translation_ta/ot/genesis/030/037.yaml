  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் வகையிலும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. அறிமுகமற்ற தாவரவியல் பெயர்கள் ஒலிபெயர்ப்பாகத் தரப்பட்டு, அவற்றின் நிச்சயமின்மையும் பழைய மாற்றுப் பெயர்களும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
