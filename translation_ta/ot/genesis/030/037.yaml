base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/037.yaml
  text: Then Jacob took for himself fresh rods of poplar[a], almond, and plane tree, and peeled white stripes in them[c][b], exposing the white that was on the rods.
translation:
  language: ta
  text: பின்பு யாக்கோபு தனக்காகப் புதிதாக வெட்டப்பட்ட பாப்லர்[a], வாதுமை[b], பிளேன்[c] மரக் கம்புகளை எடுத்து, அவற்றில் வெள்ளைப் பட்டைகள் உண்டாகும்படி பட்டையை உரித்து, கம்புகளில் இருந்த வெண்மையை வெளிப்படுத்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘புதிதாக வெட்டப்பட்ட ஸ்டோராக்ஸ்’; לִבְנֶה எந்த மரத்தைக் குறிக்கிறது என்பது உறுதியாகத் தெரியவில்லை. ‘பாப்லர்’ என்பது பொதுவான மொழிபெயர்ப்பு.
    reason: lexical_alternative
  - marker: b
    text: பழைய மொழிபெயர்ப்புகள் சிலவற்றில் ‘ஹேசல்’ என்று உள்ளது; ஆனால் ‘வாதுமை’ என்பதே அதிக வாய்ப்புள்ளது.
    reason: lexical_alternative
  - marker: c
    text: பழைய மொழிபெயர்ப்புகள் சிலவற்றில் ‘செஸ்ட்நட் மரம்’ என்று உள்ளது; ஆனால் ‘பிளேன் மரம்’ என்பதே அதிக வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקַּל
  choice: மரக் கொம்புகள்
  rationale: இச்சூழலில் மரங்களிலிருந்து வெட்டப்பட்டு பயன்படுத்தப்பட்ட துண்டுகளைக் குறிக்கிறது. ‘குச்சிகள்’ என்பதைவிட ‘மரக் கொம்புகள்’ அவற்றின் இயல்பையும் பயன்பாட்டையும் தெளிவாகக் காட்டுகிறது.
- source_word: לִבְנֶה לַח
  choice: புதிதாக வெட்டப்பட்ட பாப்லர்
  rationale: לַח என்பது இங்கு இன்னும் பசுமையும் ஈரமும் உள்ள புதிதாக வெட்டப்பட்ட மரத்தைக் குறிக்கிறது. לִבְנֶה என்பதன் துல்லியமான தாவரவியல் அடையாளம் உறுதியற்றதாயினும், ‘பாப்லர்’ என்பது பொதுவாக ஏற்கப்படும் அடையாளம்.
- source_word: לוּז
  choice: வாதுமை
  rationale: இந்த எபிரெயச் சொல் பழைய மொழிபெயர்ப்புகளில் காணப்படும் ‘ஹேசல்’ என்பதைக் காட்டிலும் வாதுமை மரத்தையே குறிக்கும் வாய்ப்பு அதிகம்.
- source_word: עֶרְמוֹן
  choice: பிளேன்
  rationale: இந்த மரப்பெயர் செஸ்ட்நட் மரத்தைவிட பிளேன் மரத்தைக் குறிப்பதாக நவீன சொற்பொருள் ஆய்வு கருதுகிறது.
- source_word: וַיְפַצֵּל
  choice: பட்டையை உரித்து
  rationale: கொம்பின் வெண்மையான பகுதி தெரியும்படி அதன் வெளிப்பட்டையை நீக்கும் செயலை இயல்பான தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: פְּצָלוֹת לְבָנוֹת
  choice: வெள்ளைப் பட்டைகள்
  rationale: பட்டை உரிக்கப்பட்ட இடங்களில் உருவான வெண்மையான கோடு போன்ற தோற்றத்தைக் குறிக்கிறது.
- source_word: מַחְשֹׂף הַלָּבָן
  choice: வெண்மையான பகுதியை வெளிப்படுத்தினான்
  rationale: உரித்ததால் கொம்பிலிருந்த வெண்மையான பகுதி புலப்படுவதைச் செயல்–விளைவு தொடர்புடன் தெரிவிக்கிறது.
- source_word: אֲשֶׁר עַל הַמַּקְלוֹת
  choice: கொம்புகளிலிருந்த
  rationale: எபிரெய עַל என்பதன் உறவை இயல்பான தமிழில் வெளிப்படுத்தி, வெண்மையான பகுதி அந்தக் கொம்புகளுக்குரியது என்பதைத் தெரிவிக்கிறது.
