base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/009.yaml
  text: When Leah saw that she had stopped bearing children[b][a], she took Zilpah her female servant and gave her to Jacob as a wife.
translation:
  language: ta
  text: லேயாள், தான் பிள்ளை பெறுவது நின்றுவிட்டதைக்[a] கண்டபோது, தன் அடிமைப்பெண்ணான[b] சில்பாளை எடுத்து, யாக்கோபுக்கு மனைவியாகக் கொடுத்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பிள்ளை பெறுவதை நிறுத்திவிட்டாள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயத்தில் சொல்லுக்குச் சொல், ‘பிள்ளை பெறுவதிலிருந்து நின்றாள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘பணிப்பெண்ணான.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: கண்டபோது
  rationale: தொடர்ந்து வரும் செயலுடன் லேயாளின் உணர்தலைக் காலத்தால் இணைக்கும் இயல்பான தமிழ் நடை; வாவ் தொடர்ச்சியின் கதை நகர்வையும் தக்கவைக்கிறது.
- source_word: כִּי
  choice: என்பதை (தமிழில் ‘தான் … நின்றுவிட்டதைக்’)
  rationale: இங்கு כִּי காரணத்தைக் காட்டாமல், லேயாள் கண்டறிந்ததன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: עָמְדָה מִלֶּדֶת
  choice: பிள்ளை பெறுவது நின்றுவிட்டது
  rationale: עמד + מן + வினையெச்சம் என்பது ஒரு செயலை நிறுத்துதல் அல்லது அதிலிருந்து ஒழிதல் என்னும் பொருளுடைய சொற்றொடர். ילד இச்சூழலில் குழந்தைப் பேற்றைக் குறிக்கிறது.
- source_word: שִׁפְחָתָהּ
  choice: தன் பணிப்பெண்
  rationale: שִׁפְחָה ஒரு பெண் பணியாள் அல்லது அடிமைப்பெண்ணைக் குறிக்கிறது. ‘பணிப்பெண்’ இயல்பான நவீனத் தமிழில் அவளுடைய கீழ்நிலை குடும்பச் சேவை நிலையைக் காட்டுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: זִלְפָּה
  choice: சில்பாள்
  rationale: எபிரெய தனிப்பெயர் தமிழின் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபின்படி வழங்கப்பட்டுள்ளது.
- source_word: לְיַעֲקֹב
  choice: யாக்கோபுக்கு
  rationale: இந்தக் கட்டமைப்பிலுள்ள ל முன்னிடைச்சொல்லின் மறைமுகச் செயப்படுபொருள் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לְאִשָּׁה
  choice: மனைவியாக
  rationale: נתן ל... לאשה என்பது திருமண உறவுக்குக் கொடுப்பதைக் குறிக்கும் வழக்கமான சொற்றொடர். இது வெறும் பாலுறவாக அல்லாமல், உரையில் உள்ள திருமணச் சொல்லாட்சியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: சில்பாளின் வீட்டுநிலையும் திருமண நிலையும்
  choice: שִׁפְחָה என்பதை ‘பணிப்பெண்’ என்றும் לְאִשָּׁה என்பதை ‘மனைவியாக’ என்றும் மொழிபெயர்த்தல்
  alternative: ‘அடிமைப்பெண்’ என்று முதன்மை உரையில் தருதல்; அல்லது பிற்காலத் தொழில்நுட்ப வகைப்பாட்டை முன்வைத்து ‘மறுமனைவி/வைப்பாட்டி’ என்று தருதல்
  rationale: எபிரெய உரை சில்பாளை லேயாளின் שִׁפְחָה என்று அடையாளப்படுத்துவதோடு, அவள் யாக்கோபுக்கு לְאִשָּׁה கொடுக்கப்பட்டாள் என்றும் கூறுகிறது. எனவே அவளுடைய கீழ்நிலை வீட்டுநிலையையும் உரையின் முறையான திருமண மொழியையும் ஒன்றையும் மென்மைப்படுத்தாமல், உரையில் இல்லாத பிற்கால வகைப்பாட்டையும் இறக்குமதி செய்யாமல் காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பணிப்பெண்’ வாசிப்புக்கு எளிமையானது; அதன் அடிமைநிலைச் சாத்தியம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது. ‘மனைவியாக’ என்பது மூலத்தின் திருமணச் சொல்லாட்சியை நேரடியாகத் தக்கவைக்கிறது.
