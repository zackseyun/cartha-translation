base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/015.yaml
  text: But she said to her, “Was it a small thing that you took my husband, and would you also take my son’s mandrakes?” Rachel said, “Then he may lie with you tonight in exchange for your son’s mandrakes.”
translation:
  language: ta
  text: லேயா ராகேலிடம், “என் கணவனை நீ எடுத்துக்கொண்டது சிறிய காரியமா? என் மகனின் தூதாயீம் பழங்களையும்[a] எடுத்துக்கொள்ளப்போகிறாயா?” என்றாள். அதற்கு ராகேல், “அப்படியானால், உன் மகனின் தூதாயீம் பழங்களுக்குப் பதிலாக இன்றிரவு அவர் உன்னோடு படுத்துக்கொள்ளட்டும்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தூதாயீம்” என்பது நறுமணமுள்ள பழங்களைத் தரும் ஒரு தாவரம் என்று பொதுவாகக் கருதப்படுகிறது; இது பெரும்பாலும் ‘மாண்ட்ரேக்’ என அடையாளப்படுத்தப்படுகிறது. பழங்காலத்தில் இதற்கு கருத்தரிப்புடன் தொடர்பு இருப்பதாக நம்பப்பட்டது.
    reason: דּוּדָאִים என்ற தாவரப்பெயரின் அடையாளம் உறுதியற்றது. ஒலிபெயர்ப்பு அந்த உறுதியற்ற தன்மையைப் பாதுகாக்கிறது; அடிக்குறிப்பு வழக்கமான அடையாளத்தையும் பொருத்தமான பண்பாட்டுப் பின்னணியையும் அளிக்கிறது.
lexical_decisions:
- source_word: הַמְעַט
  choice: உனக்குச் சிறிய காரியமா?
  rationale: எபிரேயச் சொல்லாட்சியின் கண்டனத் தொனியை இயல்பான நவீனத் தமிழில் கேள்வியாகப் பாதுகாக்கிறது.
- source_word: דּוּדָאִים
  choice: தூதாயீம் பழங்கள்
  rationale: தாவரத்தின் துல்லிய அடையாளம் முழுமையாக உறுதியானதல்ல; எனவே பாரம்பரியமாக அறியப்படும் பெயரை ஒலிபெயர்த்து, விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: תַּחַת
  choice: பதிலாக
  rationale: ராகேல் முன்வைக்கும் பரிமாற்ற ஏற்பாட்டைத் தெளிவாகவும் மூலத்தின் பொருளுக்கு நெருக்கமாகவும் தெரிவிக்கிறது.
- source_word: יִשְׁכַּב עִמָּךְ
  choice: அவர் உன்னோடு படுத்துக்கொள்ளட்டும்
  rationale: பாலுறவைக் குறிக்கும் எபிரேய மரபுத்தொடரின் மறைமுகத்தன்மையையும், அனுமதி அல்லது ஏற்பாட்டைக் குறிக்கும் வினை நயத்தையும் காக்கிறது.
theological_decisions:
- issue: லேயாவின் ‘என் கணவனை நீ எடுத்துக்கொண்டது’ என்ற குற்றச்சாட்டின் மதிப்பீடு
  choice: குற்றச்சாட்டை பேசுபவளின் சொற்களாகவே நேரடியாக வைத்தல்
  alternative: ராகேல் உண்மையில் யாக்கோபை அபகரித்தாள் என்று உரையாளர் உறுதிப்படுத்துவது போல விளக்குதல்
  rationale: மூல உரை லேயாவின் உணர்ச்சிப்பூர்வமான கூற்றை பதிவு செய்கிறது; அதன் நியாயத்தன்மையைத் தீர்மானிக்கவில்லை.
- issue: יִשְׁכַּב என்பதின் வினை நயம்
  choice: ‘படுத்துக்கொள்ளட்டும்’ என்று அனுமதி/ஒப்பந்த நயத்துடன் மொழிபெயர்த்தல்
  alternative: ‘படுத்துக்கொள்வார்’ என்று வெறும் எதிர்கால நிகழ்வாக மொழிபெயர்த்தல்
  rationale: உரையாடல் சூழலில் ராகேல் ஒரு பரிமாற்ற ஒப்பந்தத்தை முன்வைக்கிறாள்; அதேவேளை கூற்றை கட்டளையாகக் கடுமைப்படுத்தாமல் மூலத்தின் நயத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவள்’ என்ற தொடக்கச் சுட்டுப்பெயரின் குழப்பத்தைத் தவிர்க்க, சூழலில் பெறப்படும் ராகேலின் பெயர் சேர்க்கப்பட்டுள்ளது; முதல் பேச்சாளர் லேயா என்பது முந்தைய வசனச் சூழலால் தெளிவாகிறது. பாலுறவைக் குறிக்கும் மூலத்தின் நாசூக்கான சொல்லாட்சி ‘படுத்துக்கொள்ளட்டும்’ என்பதில் பாதுகாக்கப்பட்டுள்ளது.
