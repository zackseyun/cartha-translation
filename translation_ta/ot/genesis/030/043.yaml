  yaml_path: translation/ot/genesis/030/043.yaml
  text: And the man became exceedingly prosperous[b][a], and he came to have many flocks and female servants and male servants and camels and donkeys.
translation:
  language: ta
  text: அந்த மனிதன் மிக மிகச் செழிப்படைந்தான்; அவனுக்கு ஏராளமான மந்தைகளும் பெண் அடிமைகளும் ஆண் அடிமைகளும் ஒட்டகங்களும் கழுதைகளும் உண்டாயின.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹץ
  choice: செழிப்படைந்தான்
  rationale: פרץ என்பதன் அடிப்படைப் பொருள் ‘பீறிட்டு வெளிப்படுதல்/விரிவடைதல்’; இச்சூழலில் அது செல்வத்திலும் உடைமைகளிலும் வியத்தகு வளர்ச்சியைக் குறிக்கிறது. ‘செழிப்படைந்தான்’ தமிழில் இயல்பாக அந்த விளைவுப் பொருளைத் தருகிறது.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: எபிரெயம் யாக்கோபைச் சூழலால் சுட்டினாலும் ‘அந்த மனிதன்’ என்ற பொதுப்பெயரையே பயன்படுத்துகிறது; தேவையின்றி பெயரைச் சேர்க்காமல் மூலத்தின் வடிவம் காக்கப்படுகிறது.
- source_word: מְאֹד מְאֹד
  choice: மிகமிக
  rationale: இருமுறை வரும் வலியுறுத்தலைத் தமிழின் இயல்பான இரட்டிப்பு முறையால் நேரடியாகக் காக்கிறது.
- source_word: וַיְהִי לוֹ
  choice: அவனுக்கு ... உண்டாயின
  rationale: ‘அவனுக்காக/அவனிடம் அவை ஏற்பட்டன’ என்ற விளைவாக வந்த உடைமையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צֹאן רַבּוֹת
  choice: ஏராளமான ஆட்டு மந்தைகள்
  rationale: צֹאן என்பது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய சிறுகால்நடைகளின் கூட்டுப்பெயர். பொதுத் தமிழில் ‘ஆட்டு மந்தைகள்’ இயல்பானது; רַבּוֹת என்பதன் மிகுதியை ‘ஏராளமான’ தெரிவிக்கிறது.
- source_word: שְׁפָחוֹת
  choice: பெண் அடிமைகள்
  rationale: இச்சொல் அடிமை நிலையிலிருந்த வீட்டுப் பணியாளர்களைக் குறிக்கலாம். ஆண்–பெண் வேறுபாட்டையும், உடைமைகளின் பட்டியலில் இடம்பெறும் சமூக உண்மையையும் தெளிவாகக் காக்கிறது.
- source_word: עֲבָדִים
  choice: ஆண் அடிமைகள்
  rationale: שְׁפָחוֹת என்பதற்கு இணையான ஆண்பால் சொல். பாலின வேறுபாட்டையும் கட்டுப்பட்ட அடிமை நிலையையும் வெளிப்படுத்துகிறது.
- source_word: גְמַלִּים
  choice: ஒட்டகங்கள்
  rationale: விலங்குப் பெயருக்கான வழக்கமான நவீனத் தமிழ் சொல்.
- source_word: חֲמֹרִים
  choice: கழுதைகள்
  rationale: விலங்குப் பெயருக்கான வழக்கமான நவீனத் தமிழ் சொல்.
theological_decisions:
- issue: שְׁפָחוֹת மற்றும் עֲבָדִים ஆகியவற்றை ‘வேலைக்காரர்கள்’ என்றோ ‘அடிமைகள்’ என்றோ மொழிபெயர்த்தல்
  choice: பெண் அடிமைகள், ஆண் அடிமைகள்
  alternative: பெண் வேலைக்காரர்கள், ஆண் வேலைக்காரர்கள்
  rationale: இச்சொற்கள் வீட்டுப் பணியாளர்களையும் குறிக்கக்கூடும்; ஆனால் இங்கு அவர்கள் யாக்கோபுக்கு உண்டான உடைமைகளின் பட்டியலில் வருவதால், கட்டுப்பட்ட சமூக நிலையைக் குறைக்கும் மென்மைப்படுத்தலைத் தவிர்த்து ‘அடிமைகள்’ என்று வழங்கப்படுகிறது. இது அந்த அமைப்பை அங்கீகரிப்பதல்ல; உரையின் சமூக உண்மையை மறைக்காமல் காட்டுவதாகும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயப் பட்டியலின் தொடர்ச்சியான וּ இணைப்புகள் அனைத்தும் ‘-உம்’ வடிவால் காக்கப்பட்டுள்ளன. ‘மிகமிக’ என்பது மூலத்தின் இரட்டிப்பு வலியுறுத்தலை இயல்பாகத் தக்கவைக்கிறது.
