base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/027.yaml
  text: Then Laban said to him[a], “If I have found favor in your eyes, please stay[b]. I have learned by divination that Yahweh has blessed me because of you.”
translation:
  language: ta
  text: அப்போது லாபான் அவனிடம், “உன் பார்வையில் எனக்குத் தயவு கிடைத்திருந்தால், தயவுசெய்து தங்கியிரு.[a] உன் காரணமாக யாவே என்னை ஆசீர்வதித்திருக்கிறார் என்பதைக் குறி பார்த்து அறிந்துகொண்டேன்.[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தயவுசெய்து தங்கியிரு’ என்பதில் ‘தங்கியிரு’ என்பது எபிரெய மூலத்தில் வெளிப்படையாக இல்லை; சூழலிலிருந்து நிறைவுசெய்யப்பட்டுள்ளது.
    reason: மூல உரையிலுள்ள விடுபாட்டை விளக்குதல்
  - marker: b
    text: ‘குறி பார்த்து அறிந்துகொண்டேன்’ என்பதற்கு ‘குறி பார்த்தேன்’ என்றும், சிலர் ‘அனுபவத்தால் அறிந்துகொண்டேன்’ என்றும் மொழிபெயர்க்கின்றனர். எபிரெய வினைச்சொல் குறி அல்லது சகுனம் பார்த்தலைக் குறிக்கக்கூடும்.
    reason: சொற்பொருள் மாற்றுவாய்ப்பு
lexical_decisions:
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: உன் பார்வையில் எனக்குத் தயவு கிடைத்திருந்தால், தயவுசெய்து இங்கேயே தங்கியிரு
  rationale: ‘ஒருவரின் கண்களில் தயவு காணுதல்’ என்ற எபிரெய மரபுத்தொடரின் உருவகத்தை இயல்பான தமிழில் ‘உன் பார்வையில்... தயவு கிடைத்திருந்தால்’ என்று தக்கவைக்கிறது. נָא வேண்டுகோளை மென்மையாக்குகிறது. எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘தங்கியிரு’ என்பது உடனுள்ள சூழலிலிருந்து நிறைவுசெய்யப்பட்டுள்ளது.
- source_word: נִחַשְׁתִּי
  choice: குறிபார்த்து அறிந்துகொண்டேன்
  rationale: பியேல் வடிவிலுள்ள נחשׁ பொதுவாக சகுனம் அல்லது குறி பார்த்தலைக் குறிக்கிறது. ‘குறிபார்த்து அறிந்துகொண்டேன்’ என்பது அந்த வலுவான பொருளையும் அதன் மூலம் லாபான் ஒரு முடிவை அறிந்ததாகக் கூறுவதையும் தெளிவாகத் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பதவிப்பெயர் அல்ல, எபிரெய வேதத்தில் வரும் இறைப்பெயர். ஆகவே ‘கர்த்தர்’ போன்ற மாற்றுப்பெயருக்குப் பதிலாக தமிழில் இயல்பான ஒலிபெயர்ப்பான ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיְבָרֲכֵנִי
  choice: என்னை ஆசீர்வதித்திருக்கிறார்
  rationale: கடந்த காலத்தில் நிகழ்ந்து தற்போது விளைவைக் கொண்டிருக்கும் ஆசீர்வாதத்தைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: בִּגְלָלֶךָ
  choice: உன் காரணமாக
  rationale: இந்தச் சொற்றொடரின் காரணப் பொருளை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לָבָן
  choice: லாபான்
  rationale: தனிப்பெயர் தமிழின் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப கொடுக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யாஹ்வே; யெகோவா
  rationale: மூல உரையில் நான்கு எழுத்துகளாலான இறைப்பெயர் நேரடியாக வருகிறது. அதைப் பதவிப்பெயரால் மாற்றாமல் தனிப்பெயராக ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: லாபானின் அறிவைப் பெற்ற முறை
  choice: குறிபார்த்து அறிந்துகொண்டேன்
  alternative: அனுபவத்தால் அறிந்துகொண்டேன்
  rationale: נִחַשְׁתִּי என்பதன் முதன்மையான சொற்பொருள் குறி அல்லது சகுனம் பார்ப்பதாகும். லாபானின் கூற்றை ஆதரிப்பதோ கண்டிப்பதோ இல்லாமல், அதன் சமயத் தீவிரத்தையும் தெளிவின்மையையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் மொழிநடை அமைக்கப்பட்டுள்ளது. லாபான் யாக்கோபிடம் ஒருமையில் பேசுவதால் ‘உன்’, ‘தங்கியிரு’ பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் ‘உன் கண்களில்’ என்ற உருவகம் கடினமான சொற்சொல் மொழிபெயர்ப்பாக இல்லாமல் ‘உன் பார்வையில்’ என்று தக்கவைக்கப்பட்டுள்ளது.
