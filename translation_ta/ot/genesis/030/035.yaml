  text: וַ/יָּ֣סַר בַּ/יּוֹם֩ הַ/ה֨וּא אֶת הַ/תְּיָשִׁ֜ים הָֽ/עֲקֻדִּ֣ים וְ/הַ/טְּלֻאִ֗ים וְ/אֵ֤ת כָּל הָֽ/עִזִּים֙ הַ/נְּקֻדּ֣וֹת וְ/הַ/טְּלֻאֹ֔ת כֹּ֤ל אֲשֶׁר לָבָן֙ בּ֔/וֹ וְ/כָל ח֖וּם בַּ/כְּשָׂבִ֑ים וַ/יִּתֵּ֖ן בְּ/יַד בָּנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/035.yaml
  text: That day he removed the male goats that were streaked and spotted[a], and all the female goats that were speckled and spotted—every one that had white on it—and every dark-colored one among the lambs[c][b], and he put them into the care of his sons.
translation:
  language: ta
  text: அன்றே அவன், வரிகளும் திட்டுகளும் கொண்ட ஆண் வெள்ளாடுகளையும்[a], சிறுபுள்ளிகளும் திட்டுகளும் கொண்ட பெண் வெள்ளாடுகள் அனைத்தையும்—வெள்ளை நிறம் கொண்ட ஒவ்வொன்றையும்—செம்மறியாட்டுக் குட்டிகளில் அடர் பழுப்பு நிறமுள்ள ஒவ்வொன்றையும்[b] பிரித்தெடுத்து, அவற்றைத் தன் மகன்களின் பராமரிப்பில் ஒப்படைத்தான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வரிகள்’ என்பதற்கு ‘பட்டைகள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் விலங்குகளின் உடலில் பட்டை அல்லது வளையம் போன்ற நிறக்குறிகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அடர் பழுப்பு நிறமுள்ள’ என்பதற்கு ‘பழுப்பு நிறமுள்ள’ அல்லது ‘இருண்ட நிறமுள்ள’ என்றும் மொழிபெயர்க்கலாம்; חוּם என்பது பழுப்பு, குறிப்பாக அடர் பழுப்பு நிறத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, ‘தன் மகன்களின் கையில் கொடுத்தான்’; இது அவர்களுடைய கட்டுப்பாட்டிலோ பராமரிப்பிலோ ஒப்படைத்ததைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: idiom
lexical_decisions:
- source_word: וַיָּסַר
  choice: பிரித்தெடுத்து
  rationale: ஹிபில் வடிவில் வரும் סור, மந்தையிலிருந்து விலங்குகளை அகற்றிப் பிரித்து வைப்பதைக் குறிக்கிறது; ‘பிரித்தெடுத்து’ என்பது இவ்விரு நுணுக்கங்களையும் இயல்பான தமிழில் தருகிறது.
- source_word: הַתְּיָשִׁים
  choice: ஆண் வெள்ளாடுகள்
  rationale: תיש என்பது குறிப்பாக ஆண் வெள்ளாட்டைக் குறிக்கிறது; தொடர்ந்து வரும் பொதுப்பெயரான עזים உடனான பாலின வேறுபாட்டையும் இவ்வாறு தெளிவாகப் பேண முடிகிறது.
- source_word: הָעֲקֻדִּים
  choice: வரிகளும் … கொண்ட
  rationale: இந்தச் சொல் விலங்குகளின் உடலில் காணப்படும் பட்டை அல்லது வரி போன்ற அடையாளங்களைக் குறிக்கிறது; ‘வரிகள் கொண்ட’ என்பது பொதுவாசகருக்குப் புரியும் இயல்பான வடிவம்.
- source_word: הַטְּלֻאִים / הַטְּלֻאֹת
  choice: திட்டுகளும் … கொண்ட
  rationale: טלא என்பது பரவலான திட்டுகள் அல்லது ஒழுங்கற்ற நிறப்பகுதிகளைக் குறிக்கிறது. נקוד என்பதிலுள்ள சிறிய புள்ளிகளிலிருந்து வேறுபாடு தெரிய ‘திட்டுகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הָעִזִּים
  choice: பெண் வெள்ளாடுகள்
  rationale: עזים என்பது பொதுவாக வெள்ளாடுகள் என்றாலும், முன் குறிப்பிடப்பட்ட ஆண் வெள்ளாடுகளுக்கு எதிரிணையாக இங்கு பெண் வெள்ளாடுகளைக் குறிக்கிறது.
- source_word: הַנְּקֻדּוֹת
  choice: சிறுபுள்ளிகளும் … கொண்ட
  rationale: נקוד சிறிய புள்ளி போன்ற நிறக்குறிகளைக் குறிக்கிறது; טלא என்பதிலிருந்து வேறுபாட்டைப் பேண ‘சிறுபுள்ளிகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כֹּל אֲשֶׁר לָבָן בּוֹ
  choice: அவற்றில் வெள்ளை நிறம் இருந்த ஒவ்வொன்றையும்
  rationale: לָבָן இங்கு ‘வெள்ளை’ என்ற நிறப்பெயர்; כֹּל என்பதன் ஒவ்வொன்றையும் உள்ளடக்கும் பகிர்வுப் பொருளும் தமிழில் பேணப்பட்டுள்ளது.
- source_word: וְכָל חוּם בַּכְּשָׂבִים
  choice: செம்மறியாட்டுக் குட்டிகளில் கருநிறமுள்ள ஒவ்வொன்றையும்
  rationale: חוּם அடர் பழுப்பு அல்லது இருண்ட நிறத்தைக் குறிக்கிறது; ‘கருநிறம்’ இங்கு துல்லியமான நிறவியல் கருப்பை மட்டும் அல்லாமல் இருண்ட தோற்றத்தை இயல்பாகக் குறிக்கிறது. כְּשָׂבִים இளம் செம்மறியாடுகளைக் குறிக்கக்கூடியதால் ‘செம்மறியாட்டுக் குட்டிகள்’ பயன்படுத்தப்பட்டது.
- source_word: וַיִּתֵּן בְּיַד בָּנָיו
  choice: அவற்றைத் தன் மகன்களின் பராமரிப்பில் ஒப்படைத்தான்
  rationale: ‘கையில் கொடுத்தான்’ என்ற எபிரெய மரபுத்தொடர் அவர்களுடைய கட்டுப்பாடு அல்லது பராமரிப்பில் வைத்ததைக் குறிக்கிறது; தமிழில் அதன் செயல்பாட்டுப் பொருள் இயல்பாக வழங்கப்பட்டுள்ளது.
