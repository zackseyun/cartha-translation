translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான அதேவேளையில் சாதாரண வாசகருக்குப் புரியும் நடையில் அமைக்கப்பட்டது. விலங்குகளின் நிறக்குறிகளுக்கான வேறுபட்ட எபிரெயச் சொற்கள் ‘வரிகள்’, ‘சிறுபுள்ளிகள்’, ‘திட்டுகள்’ என வேறுபடுத்தப்பட்டுள்ளன. நீண்ட பட்டியலின் உறவுகளைத் தெளிவாக்க இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன.
