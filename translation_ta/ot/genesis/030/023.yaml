  edition: WLC
  text: וַ/תַּ֖הַר וַ/תֵּ֣לֶד בֵּ֑ן וַ/תֹּ֕אמֶר אָסַ֥ף אֱלֹהִ֖ים אֶת חֶרְפָּתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/023.yaml
  text: She conceived and bore a son[a], and said, “God has taken away my reproach.”
translation:
  language: ta
  text: அவள் கருவுற்று ஒரு மகனைப் பெற்றெடுத்தாள். அவள், “கடவுள் என் அவமானத்தை[a] நீக்கிவிட்டார்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் நிந்தையை அகற்றிவிட்டார்” அல்லது “என் வெட்கக்கேட்டை நீக்கிவிட்டார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: அவள் கருவுற்று
  rationale: הרה என்பது கருவுறுதலைக் குறிக்கிறது. தமிழில் இயல்பான கதைநடையைப் பேணுவதற்காக அடுத்த வினையுடன் இணைத்து மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַתֵּלֶד בֵּן
  choice: ஒரு மகனைப் பெற்றெடுத்தாள்
  rationale: ילד மற்றும் בֵּן ஆகியவை அவள் ஒரு ஆண் குழந்தையைப் பெற்றெடுத்ததை நேரடியாகக் குறிக்கின்றன; ‘மகனைப் பெற்றெடுத்தாள்’ என்பது இயல்பான, கண்ணியமான தமிழ் நடை.
- source_word: וַתֹּאמֶר
  choice: அப்போது அவள் … என்றாள்
  rationale: எபிரெயக் கதைத் தொடர்ச்சியைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘அப்போது’ பயன்படுத்தப்பட்டுள்ளது; பேசுபவர் பெண் என்பதையும் வினை வடிவம் தெளிவாக்குகிறது.
- source_word: אָסַף
  choice: நீக்கிவிட்டார்
  rationale: இச்சூழலில் אסף என்பது அவமானத்தை அகற்றுதல் அல்லது நீக்குதல் என்ற பொருளில் வருகிறது. ‘நீக்கிவிட்டார்’ நிறைவுற்ற செயலின் தற்போதைய விளைவை இயல்பாகக் காட்டுகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும், இங்கு ஒருமை வினையுடன் வந்து ஒரே கடவுளைக் குறிக்கிறது. நவீன பொதுத் தமிழில் ‘கடவுள்’ தெளிவான இயல்பான சொல்.
- source_word: חֶרְפָּתִי
  choice: என் அவமானத்தை
  rationale: חֶרְפָּה என்பது பிறர்முன் ஏற்படும் நிந்தை, அவமானம் அல்லது வெட்கக்கேட்டை உள்ளடக்கும். ‘என் அவமானத்தை’ இச்சமூகப் பரிமாணத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: אֱלֹהִים என்பதன் ஒருமைப் பொருள்
  choice: கடவுள்
  alternative: தெய்வங்கள்
  rationale: אָסַף என்ற வினை ஒருமையில் இருப்பதாலும் சூழலாலும் இச்சொல் ஒரே கடவுளையே குறிக்கிறது; இலக்கணம் கூறுவதற்கு மேலான எந்தத் தத்துவ விரிவாக்கமும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் தொடர்ச்சியான இணைப்புகளை அப்படியே மீளாமல், இரண்டு இயல்பான தமிழ் வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
