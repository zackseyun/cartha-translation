  terminology: “கடவுள்,” “கருவுற்று,” “மகனைப் பெற்றெடுத்தாள்,” and “அவமானம்” are suitable. The footnote appropriately preserves ‘நிந்தை’ and ‘வெட்கக்கேடு’ as alternatives for חֶרְפָּה.
