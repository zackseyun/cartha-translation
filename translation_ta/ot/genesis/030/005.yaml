  yaml_path: translation/ot/genesis/030/005.yaml
  text: Bilhah conceived and bore Jacob a son[a].
translation:
  language: ta
  text: பில்காள் கர்ப்பமடைந்து, யாக்கோபுக்கு ஒரு மகனைப் பெற்றெடுத்தாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: கர்ப்பமடைந்து
  rationale: הרה என்பது கர்ப்பமடைதலைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் மூலத்தின் நிகழ்வுத் தொடரைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: בִּלְהָה
  choice: பில்காள்
  rationale: எபிரேயப் பெயரான Bilhah என்பதற்குத் தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட ஒலிபெயர்ப்பு.
- source_word: וַתֵּלֶד
  choice: பெற்றெடுத்தாள்
  rationale: ילד இங்கு குழந்தையைப் பெற்றெடுத்தலைக் குறிக்கிறது; இச்சொல் இயல்பான, தெளிவான நவீனத் தமிழ் நடை.
- source_word: לְיַעֲקֹב
  choice: யாக்கோபுக்கு
  rationale: לְ என்னும் முன்னொட்டு இங்கு குழந்தைக்கும் யாக்கோபுக்கும் உள்ள உறவைச் சுட்டுகிறது; தமிழில் ‘யாக்கோபுக்கு’ என்பது அதன் வடிவத்தையும் பொருளையும் இயல்பாகப் பேணுகிறது.
- source_word: בֵּן
  choice: ஒரு மகனை
  rationale: בֵּן என்பதன் பொருள் ‘மகன்’; வாக்கியத்தில் புதிய குறிப்பற்ற நபராக வருவதால் ‘ஒரு’ சேர்ப்பது இயல்பான தமிழ்.
