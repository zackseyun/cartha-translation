  register: சுருக்கமான எபிரேயக் கதைநடையைப் பேணும், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய நவீன நிலையான தமிழ். ‘கர்ப்பமடைந்து’ மற்றும் ‘பெற்றெடுத்தாள்’ என்ற இணைப்பு மூலத்தின் இரு தனித்த வினைகளையும் காக்கிறது.
