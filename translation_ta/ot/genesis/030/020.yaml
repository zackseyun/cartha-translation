  text: וַ/תֹּ֣אמֶר לֵאָ֗ה זְבָדַ֨/נִי אֱלֹהִ֥ים אֹתִ/י֮ זֵ֣בֶד טוֹב֒ הַ/פַּ֨עַם֙ יִזְבְּלֵ֣/נִי אִישִׁ֔/י כִּֽי יָלַ֥דְתִּי ל֖/וֹ שִׁשָּׁ֣ה בָנִ֑ים וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ זְבֻלֽוּן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/020.yaml
  text: And Leah said[a], “God has endowed me with a good endowment. This time my husband will honor me, because I have borne him six sons.” So she called his name Zebulun.
translation:
  language: ta
  text: லேயாள், “கடவுள் எனக்கு நல்லதொரு கொடையைக் கொடுத்திருக்கிறார். நான் என் கணவருக்கு ஆறு மகன்களைப் பெற்றெடுத்திருப்பதால், இந்த முறை அவர் என்னை மதிப்பார்[a]” என்றாள். அதனால் அவனுக்குச் செபுலோன் என்று பெயரிட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னுடன் குடியிருப்பார்.” இதற்கான எபிரெய வினைச்சொல் அரிதானது; அது ‘செபுலோன்’ என்ற பெயருடன் சொல்விளையாட்டாக இணைகிறது. கணவன் லேயாளை மதிப்பதோடு அவளுடன் குடியிருப்பார் அல்லது தங்கியிருப்பார் என்ற இரு கருத்துகளும் இதில் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבָדַנִי ... זֵבֶד טוֹב
  choice: எனக்கு நல்லதொரு கொடையைக் கொடுத்திருக்கிறார்
  rationale: ஒரே வேரிலிருந்து வந்த எபிரெய வினைச்சொல்–பெயர்ச்சொல் இணைப்பை, தமிழில் ‘கொடை–கொடுத்திருக்கிறார்’ என்ற இயல்பான சொல் தொடர்பால் முடிந்தவரை தக்கவைக்கிறது.
- source_word: הַפַּעַם
  choice: இந்த முறை
  rationale: சூழலுக்குப் பொருத்தமான, இயல்பான காலக் குறிப்பு.
- source_word: יִזְבְּלֵנִי
  choice: என்னை மதிப்பார்
  rationale: லேயாள் ஆறு மகன்களைப் பெற்றதால் கணவனிடமிருந்து மேம்பட்ட மதிப்பைப் பெறுவாள் என்ற சூழல்சார் பொருளைத் தெளிவாகக் காட்டுகிறது; அரிய எபிரெய வினையின் வேறு சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אִישִׁי
  choice: என் கணவர்
  rationale: திருமணச் சூழலில் இயல்பான நவீனத் தமிழ் இணைச்சொல்.
- source_word: יָלַדְתִּי לוֹ שִׁשָּׁה בָנִים
  choice: நான் என் கணவருக்கு ஆறு மகன்களைப் பெற்றெடுத்திருப்பதால்
  rationale: தாயின் செயலும் לוֹ என்பதன் மறைமுகப் பொருளும் தெளிவாகத் தக்கவைக்கப்படுகின்றன.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ זְבֻלוּן
  choice: அதனால் அவனுக்குச் செபுலோன் என்று பெயரிட்டாள்
  rationale: எபிரெய பெயரிடும் கூற்றை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: יִזְבְּלֵנִי என்ற அரிய வினைச்சொல்லின் பொருள்
  choice: என்னை மதிப்பார்
  alternative: என்னுடன் குடியிருப்பார் / என்னுடன் தங்கியிருப்பார்
  rationale: உடனடிச் சூழலில் ‘மதிப்பார்’ பொருந்தினாலும், வினைச்சொல்லின் அரிதான தன்மையும் செபுலோன் என்ற பெயருடனான சொல்விளையாட்டும் வேறு பொருளை அனுமதிக்கின்றன; ஆகவே மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்திலுள்ள கொடை–கொடுத்தல் சொல் தொடர்பு தமிழிலும் தக்கவைக்கப்பட்டுள்ளது; தெளிவில்லாத அரிய வினைச்சொல் ஒரே பொருளுக்குள் கட்டுப்படுத்தப்படாமல் அடிக்குறிப்பில் மாற்று வாசிப்புடன் வழங்கப்பட்டுள்ளது.
