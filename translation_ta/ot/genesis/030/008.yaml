  text: וַ/תֹּ֣אמֶר רָחֵ֗ל נַפְתּוּלֵ֨י אֱלֹהִ֧ים נִפְתַּ֛לְתִּי עִם אֲחֹתִ֖/י גַּם יָכֹ֑לְתִּי וַ/תִּקְרָ֥א שְׁמ֖/וֹ נַפְתָּלִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/008.yaml
  text: Then Rachel said[a], “With wrestlings of God I have wrestled with my sister, and I have also prevailed.” So she called his name Naphtali.
translation:
  language: ta
  text: அப்போது ராகேல், “தேவனுடைய போராட்டங்களை[a] என் சகோதரியுடன் நான் போராடினேன்; நானும் வெற்றி பெற்றேன்” என்றாள். ஆகவே, அவனுக்கு நப்தலி என்று பெயரிட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “தேவனுடைய போராட்டங்கள் நான் போராடினேன்.” இதை “தெய்வீகப் போராட்டங்கள்” என்றோ, வலியுறுத்தும் மரபுத்தொடராக “மாபெரும் போராட்டங்கள்” என்றோ புரிந்துகொள்ளலாம். “போராடினேன்” என்பதற்கான எபிரெயச் சொல்லுக்கும் “நப்தலி” என்ற பெயருக்கும் சொல்விளையாட்டு உள்ளது.
    reason: மூலமொழியின் பொருள் தெளிவின்மையையும் பெயருடன் உள்ள சொல்விளையாட்டையும் விளக்குதல்
lexical_decisions:
- source_word: נַפְתּוּלֵי אֱלֹהִים
  choice: தேவனுடைய போராட்டங்களால்
  rationale: எபிரெயக் கட்டமைப்பை நெருக்கமாகப் பிரதிபலித்து, இது நேரடியாகத் தேவனைக் குறிக்கிறதா அல்லது ‘மாபெரும்’ என்பதற்கான வலியுறுத்தலா என்ற மூலமொழியின் தெளிவின்மையைத் தக்கவைக்கிறது.
- source_word: נִפְתַּלְתִּי
  choice: போராடினேன்
  rationale: ராகேலுக்கும் அவளுடைய சகோதரிக்கும் இடையிலான போட்டியை இயல்பான தமிழில் தெரிவிக்கிறது; நப்தலி என்ற பெயருடன் உள்ள எபிரெயச் சொல்விளையாட்டையும் அடிக்குறிப்பு விளக்குகிறது.
- source_word: עִם אֲחֹתִי
  choice: என் சகோதரியுடன்
  rationale: עִם என்பதன் நேரடியான பொருள் ‘உடன்’; போட்டி அல்லது எதிர்ப்பு உணர்வு ‘போராடினேன்’ என்பதாலும் சூழலாலும் வெளிப்படுகிறது.
- source_word: גַּם יָכֹלְתִּי
  choice: வெற்றியும் பெற்றேன்
  rationale: இச்சூழலில் יכל என்பது வெறும் திறனை அல்ல, போட்டியில் மேலோங்கியதை அல்லது சாதித்ததைச் சுட்டுகிறது.
- source_word: וַתִּקְרָא שְׁמוֹ נַפְתָּלִי
  choice: ஆகவே, அவனுக்கு நப்தலி என்று பெயரிட்டாள்
  rationale: பெயரிடும் வழக்கை இயல்பான நவீன தமிழில் கூறி, ராகேலின் சொல்லுக்கும் பெயருக்கும் உள்ள காரணத் தொடர்பைத் தெளிவாக வைத்திருக்கிறது.
- source_word: נַפְתָּלִי
  choice: நப்தலி
  rationale: தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு; மூலமொழிச் சொல்விளையாட்டு அடிக்குறிப்பில் சுட்டப்படுகிறது.
theological_decisions:
- issue: אֱלֹהִים என்பது நேரடியாகத் தேவனைக் குறிக்கிறதா அல்லது மிகுதியைக் காட்டும் வலியுறுத்தலா
  choice: தேவனுடைய போராட்டங்களால்
  alternative: மாபெரும் போராட்டங்களால்
  rationale: மூல எபிரெயின் வெளிப்படையான சொற்றொடரையும் அதன் உண்மையான பொருள் தெளிவின்மையையும் முதன்மை உரையில் தக்கவைத்து, இயைபான மாற்றுப் பொருளை அடிக்குறிப்பில் வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தேவனுடைய போராட்டங்கள்’ என்ற சற்றே அசாதாரணமான சொற்றொடர் மூலமொழியின் திட்டமிட்ட தெளிவின்மையைப் பாதுகாக்கிறது; அதன் சாத்தியமான பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
