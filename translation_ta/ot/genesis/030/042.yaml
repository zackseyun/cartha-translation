translation_notes:
  register: நவீன பொதுத்தமிழில், மேய்ப்புத் தொழில் சூழலுக்கு ஏற்ற எளிய ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தில் விடப்பட்டுள்ள செயப்படுபொருள் முதன்மை உரையிலும் சுட்டுப்பெயராகவே வைக்கப்பட்டு, அதன் குறிப்பு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. அரிதான எதிர்ச்சொல் இணையின் பொருள் மிகையாகத் தீர்மானிக்கப்படாமல் மாற்று நுணுக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
