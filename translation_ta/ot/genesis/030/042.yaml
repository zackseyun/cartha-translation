  edition: WLC
  text: וּ/בְ/הַעֲטִ֥יף הַ/צֹּ֖אן לֹ֣א יָשִׂ֑ים וְ/הָיָ֤ה הָ/עֲטֻפִים֙ לְ/לָבָ֔ן וְ/הַ/קְּשֻׁרִ֖ים לְ/יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/042.yaml
  text: But when the flock were feeble[a], he would not put them in; so the feeble ones became Laban’s[c][b], and the strong ones Jacob’s.
translation:
  language: ta
  text: ஆனால் மந்தை விலங்குகள் வலுவற்றவையாக இருந்தபோது[a], அவன் அவற்றை வைக்காமல் இருந்தான்[b]. ஆகவே வலுவற்றவை லாபானுக்குச் சேர்ந்தன; வலிமையானவை[c] யாக்கோபுக்குச் சேர்ந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மந்தை விலங்குகள் பலவீனமாக இருந்தபோது.’ எபிரெயச் சொல் வலுவற்ற விலங்குகளைக் குறிக்கலாம்; சிலர் இதைத் தாமதமாக இனச்சேர்க்கை செய்யும் அல்லது தரம் குறைந்த விலங்குகள் என்று இன்னும் குறிப்பாகப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, முந்தைய வசனங்களில் கூறப்பட்டபடி, அவன் கோல்களை அவற்றின் முன்னால் வைக்கவில்லை.
    reason: cross_reference
  - marker: c
    text: அல்லது, ‘உறுதியானவை’ அல்லது ‘துடிப்புள்ளவை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲטִיף הַצֹּאן
  choice: மந்தையிலுள்ள விலங்குகள் வலுவற்றவையாக இருந்தபோது
  rationale: בְּ முன்னொட்டுடன் வந்த வினையெச்ச வடிவம் காலச் சூழலைக் குறிக்கிறது. עטף இங்கு எதிர்வரும் வலிமையான விலங்குகளுக்கு மாறாக வலுவற்ற விலங்குகளைக் குறிக்கிறது; அதன் துல்லியமான இனப்பெருக்க நுணுக்கத்தை உரையில் தேவையின்றி வரையறுக்காமல் இந்த மொழிபெயர்ப்பு விடுகிறது.
- source_word: הַצֹּאן
  choice: மந்தையிலுள்ள விலங்குகள்
  rationale: צֹאן என்பது பொதுவாக செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கும் சிறுகால்நடைகளைக் குறிக்கும் கூட்டுப்பெயர். தமிழில் அடுத்துவரும் பன்மை வினையோடு இயல்பாக அமைய இவ்வாறு தரப்பட்டுள்ளது.
- source_word: לֹא יָשִׂים
  choice: அவன் அவற்றை வைக்கமாட்டான்
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வை/அமை’ என்பதாகும். எபிரெய உரையில் செயப்படுபொருள் வெளிப்படையாக இல்லை; முந்தைய வசனங்களில் கூறப்பட்ட கோல்களே இங்கு சுட்டப்படுகின்றன. வழக்கமாகச் செய்த அல்லது செய்யாத செயலை ‘வைக்கமாட்டான்’ எடுத்துரைக்கிறது.
- source_word: וְהָיָה
  choice: ஆகவே ... உரியவையாயின
  rationale: இணைப்புச் சொலுடன் வந்த நிறைவுவினை விளைவாக ஏற்பட்ட உடைமை நிலையைத் தெரிவிக்கிறது. ‘ஆகவே’ அந்த விளைவுத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָעֲטֻפִים
  choice: வலுவற்றவை
  rationale: עטף வேரிலிருந்து வந்த இவ்வடிவம், எதிர்மறை இணையாக வரும் வலிமையான விலங்குகளோடு ஒப்பிடுகையில் பலவீனமானவற்றைக் குறிக்கிறது.
- source_word: לְלָבָן
  choice: லாபானுக்கு உரியவை
  rationale: לְ இங்கு உடைமை அல்லது ஒதுக்கீட்டைக் குறிக்கிறது. ‘உரியவை’ என்பது இரண்டையும் இயல்பாக உள்ளடக்குகிறது.
- source_word: וְהַקְּשֻׁרִים
  choice: வலிமையானவை
  rationale: இவ்வடிவம் அரிதானதாயிருந்தாலும், இச்சூழலில் הָעֲטֻפִים என்பதற்கு எதிராக உறுதியும் வலிமையும் கொண்ட விலங்குகளைக் குறிக்கிறது. துல்லியமான நுணுக்கத்திற்கான மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: לְיַעֲקֹב
  choice: யாக்கோபுக்கு உரியவை
  rationale: לְ இங்கும் உடைமை அல்லது ஒதுக்கீட்டைக் குறிக்கிறது; இணையான தமிழ் அமைப்பு எபிரெய வாக்கியத்தின் சமச்சீரைப் பேணுகிறது.
