  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר רָחֵל֙ דָּנַ֣/נִּי אֱלֹהִ֔ים וְ/גַם֙ שָׁמַ֣ע בְּ/קֹלִ֔/י וַ/יִּתֶּן לִ֖/י בֵּ֑ן עַל כֵּ֛ן קָרְאָ֥ה שְׁמ֖/וֹ דָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/006.yaml
  text: Then Rachel said[a], “God has judged me, and has also heard my voice and given me a son.” Therefore she called his name Dan.
translation:
  language: ta
  text: அப்போது ராகேல், “கடவுள் என் வழக்கில் தீர்ப்பளித்தார்; என் குரலையும் கேட்டு, எனக்கு ஒரு மகனைக் கொடுத்தார்” என்றாள். ஆகவே அவனுக்குத் தாண்[a] என்று பெயரிட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாண்” என்ற எபிரெயப் பெயர், “தீர்ப்பளித்தார்” என்பதற்கான எபிரெய வினைச்சொல்லுடன் ஒத்தொலிக்கிறது.
    reason: பெயருக்கும் דָּנַנִּי என்ற வினைச்சொல்லுக்கும் இடையிலான எபிரெயச் சொல் விளையாட்டைத் தமிழில் நேரடியாக மீட்டுருவாக்க முடியாததால்.
lexical_decisions:
- source_word: דָּנַנִּי
  choice: என் வழக்கில் தீர்ப்பளித்தார்
  rationale: வினைச்சொல்லின் நீதித்துறை சார்ந்த பொருளைத் தக்கவைத்து, கடவுள் ராகேலுக்கு ஆதரவாகச் செயல்பட்டார் என்று எபிரெயச் சொல் வெளிப்படையாகச் சொல்வதைவிட வலுப்படுத்தாமல் இருக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வினைச்சொல் ஒருமையில் இருப்பதாலும், கதையில் இஸ்ரவேலின் கடவுளையே குறிப்பதாலும் ஒருமையாக மொழிபெயர்க்கப்பட்டது.
- source_word: שָׁמַע בְּקֹלִי
  choice: என் குரலையும் கேட்டு
  rationale: ‘என் குரல்’ என்ற எபிரெயச் சொல்லமைப்பை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וַיִּתֶּן לִי בֵּן
  choice: எனக்கு ஒரு மகனைக் கொடுத்தார்
  rationale: בן என்பது குறிப்பாக மகனைக் குறிக்கும் என்பதால் பொதுவான ‘குழந்தை’ என்று மாற்றப்படவில்லை.
- source_word: עַל כֵּן
  choice: ஆகவே
  rationale: பெயரிடுவதற்கான காரணத்தை அறிமுகப்படுத்தும் முடிவுறு இணைப்பைச் சுருக்கமாகத் தருகிறது.
- source_word: קָרְאָה שְׁמוֹ דָּן
  choice: அவனுக்குத் தாண் என்று பெயரிட்டாள்
  rationale: சொல்லுக்குச் சொல் அமைப்பான ‘அவனுடைய பெயரை அழைத்தாள்’ என்பது தமிழில் இயல்பற்றதால், பெயரிடும் செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: דָּן
  choice: தாண்
  rationale: எபிரெயப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு; தீர்ப்பளித்தல் குறித்த சொல் விளையாட்டு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
theological_decisions:
- issue: ராகேல் கூறும் கடவுளின் நீதித்துறை சார்ந்த செயல்
  choice: கடவுள் என் வழக்கில் தீர்ப்பளித்தார்
  alternative: கடவுள் எனக்கு நீதி வழங்கினார்
  rationale: மாற்று வாசகம் ராகேலுக்கு ஆதரவான தீர்ப்பு என்ற கருத்தை அதிகமாகத் தெளிவுபடுத்தும். தேர்ந்த வாசகம் நீதித்துறை உருவகத்தையும், தீர்ப்பின் திசை குறித்து மூலத்தில் உள்ள அளவான மறைபொருளையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. நேரடி மேற்கோளில் இயல்பான தமிழ் வாக்கிய ஓட்டத்திற்காக அரைப்புள்ளி இடப்பட்டுள்ளது.
