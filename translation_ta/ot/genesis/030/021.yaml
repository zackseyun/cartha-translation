  text: Afterward she bore a daughter and called her name Dinah.
translation:
  language: ta
  text: அதற்குப் பிறகு அவள் ஒரு மகளைப் பெற்றெடுத்து, அவளுக்கு தீனா என்று பெயரிட்டாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַחַר
  choice: அதற்குப் பிறகு
  rationale: முந்தைய பிறப்புகளைத் தொடர்ந்து நிகழ்ந்த கால வரிசையை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: יָלְדָה
  choice: பெற்றெடுத்து
  rationale: ילד என்பதன் Qal இறந்தகால மூன்றாம் நபர் பெண்பால் ஒருமை வடிவம்; அடுத்த வினையுடன் தொடரும் எபிரேயக் கதை ஓட்டத்தைத் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: בַּת
  choice: ஒரு மகளை
  rationale: வினையின் நேரடிச் செயப்படுபொருளாக உள்ள ஒருமைச் சொல்லைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: וַ/תִּקְרָא אֶת שְׁמָהּ
  choice: அவளுக்கு ... என்று பெயரிட்டாள்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘அவளுடைய பெயரை ... என்று அழைத்தாள்’ என்றாலும், பெயரிடுதலைக் குறிக்கும் எபிரேய மரபுத்தொடரைத் தெளிவான இயல்பான தமிழில் அளிக்கிறது.
- source_word: דִּינָה
  choice: தீனா
  rationale: எபிரேயப் பெயரின் ஒலியை நவீனத் தமிழ் வேதாகமப் பெயரெழுத்து மரபுக்கு ஏற்றவாறு ஒலிபெயர்க்கிறது.
