  register: சாதாரண வாசகர்களுக்குப் புரியும் நவீன, கண்ணியமான கதைநடை. எபிரேய வசனத்தின் கால வரிசையும் இரு செயல்களின் தொடர்ச்சியும் காக்கப்பட்டுள்ளன; தமிழில் இயல்பற்ற ‘அவளுடைய பெயரை அழைத்தாள்’ என்பதற்குப் பதிலாக ‘பெயரிட்டாள்’ பயன்படுத்தப்பட்டுள்ளது.
