  text: וַ/יֹּ֖אמֶר מָ֣ה אֶתֶּן לָ֑/ךְ וַ/יֹּ֤אמֶר יַעֲקֹב֙ לֹא תִתֶּן לִ֣/י מְא֔וּמָה אִם תַּֽעֲשֶׂה לִּ/י֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה אָשׁ֛וּבָה אֶרְעֶ֥ה צֹֽאנְ/ךָ֖ אֶשְׁמֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/031.yaml
  text: And he said[a], “What shall I give you?” And Jacob said, “You shall not give me anything. If you will do this thing for me, I will again pasture your flock and keep it.”
translation:
  language: ta
  text: அவன், “நான் உனக்கு என்ன கொடுக்க வேண்டும்?” என்று கேட்டான். அதற்கு யாக்கோபு, “நீ எனக்கு எதுவும் கொடுக்க வேண்டாம். எனக்காக இந்தக் காரியத்தைச் செய்தால், நான் மீண்டும் உன் மந்தையை மேய்த்துக் காப்பேன்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் திரும்பி உன் மந்தையை மேய்த்துக் காப்பேன்.” எபிரெய வினைச்சொல், திரும்பி வருவதையோ அந்தப் பணியை மீண்டும் செய்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶתֶּן לָךְ
  choice: நான் உனக்கு என்ன கொடுக்க வேண்டும்?
  rationale: מָה உடன் வரும் முதல் நபர் נתן, லாபான் யாக்கோபுக்கு என்ன ஊதியம் அல்லது பலன் கொடுக்க வேண்டும் என்று கேட்பதைக் குறிக்கிறது. நவீன தமிழில் இந்தக் கேள்வியின் முன்மொழிவு நயத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא תִתֶּן לִי מְאוּמָה
  choice: நீர் எனக்கு எதுவும் கொடுக்க வேண்டாம்
  rationale: לֹא உடன் வரும் imperfect இங்கு எதிர்கால முன்னறிவிப்பு அல்ல; கொடுக்க முன்வந்த ஊதியத்தை நேரடியாக மறுப்பதாகும். மְאוּמָה என்பதன் எதிர்மறைச் சூழல் பொருள் ‘எதுவும்’ என்று தரப்பட்டுள்ளது.
- source_word: אִם תַּעֲשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: எனக்காக இந்தக் காரியத்தை மட்டும் செய்தால்
  rationale: இந்த நிபந்தனை வாக்கியம் யாக்கோபின் ஏற்பாட்டை அறிமுகப்படுத்துகிறது. ‘இந்தக் காரியம்’ என்பது הַדָּבָר הַזֶּה என்ற சுட்டுத் தொடரைப் பாதுகாக்கிறது; தமிழில் நிபந்தனையின் தனித்த கோரிக்கையை இயல்பாகக் காட்ட ‘மட்டும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: אָשׁוּבָה
  choice: நான் மீண்டும்
  rationale: שׁוב என்பது இச்சூழலில் ஓர் இடத்திற்குத் திரும்புவதை மட்டுமல்லாமல், மந்தையைப் பராமரிக்கும் பணியை மீண்டும் மேற்கொள்வதையும் குறிக்கலாம். முதன்மை உரையில் ‘மீண்டும்’ இந்தச் சூழல்பொருளைச் சுருக்கமாகத் தருகிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֶרְעֶה צֹאנְךָ
  choice: உமது மந்தையை மேய்த்து
  rationale: רעה என்பது צֹאן உடன் வரும்போது கால்நடை மந்தையை மேய்த்து பராமரிப்பதைக் குறிக்கிறது. צֹאן என்பது செம்மறியாடுகள் மற்றும் வெள்ளாடுகள் உள்ளிட்ட சிறுகால்நடைகளின் கூட்டுப்பெயர்; ‘மந்தை’ இயல்பான சுருக்கமான தமிழ் இணைச்சொல்.
- source_word: אֶשְׁמֹר
  choice: பாதுகாப்பேன்
  rationale: שׁמר இங்கு மேய்ப்பதுடன் இணைந்து மந்தையைக் கவனித்துக் காப்பதைக் குறிக்கிறது. ‘பாதுகாப்பேன்’ அதன் காப்பு மற்றும் பொறுப்பான கண்காணிப்பு நயங்களைத் தெளிவாக வெளிப்படுத்துகிறது.
