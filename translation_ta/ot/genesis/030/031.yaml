translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைக் கடைப்பிடித்துள்ளது. கதைசொல்லலில் ‘அவன்’ பயன்படுத்தப்பட்டாலும், நேரடி உரையில் சமூக இடைவெளியையும் மரியாதையையும் இயல்பாகக் காட்ட ‘நீர்/உமது’ பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்திலுள்ள ‘திரும்புதல்/மீண்டும் செய்தல்’ என்ற பொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
