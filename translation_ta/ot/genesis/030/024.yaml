base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/024.yaml
  text: And she called his name Joseph[a], saying, “May Yahweh add to me another son.”
translation:
  language: ta
  text: அவள் அவனுக்கு யோசேப்பு[a] என்று பெயரிட்டு, “யாவே எனக்கு இன்னொரு மகனைச் சேர்த்துத் தருவாராக” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யோசேப்பு” என்ற பெயர், “அவர் சேர்ப்பாராக” அல்லது “அவர் சேர்க்கிறார்” என்று பொருள்படும் எபிரெய வினைச்சொல்லைப் போல ஒலிக்கிறது.
    reason: பெயருக்கும் יֹסֵף என்ற வினைக்கும் இடையிலான எபிரெயச் சொல்விளையாட்டைத் தமிழில் நேரடியாகக் காக்க முடியாததால் விளக்குகிறது.
lexical_decisions:
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: அவள் அவனுக்கு ... என்று பெயரிட்டு
  rationale: எபிரெயப் பெயரிடும் வாய்பாட்டின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; தொடர் வினை அமைப்பையும் காக்கிறது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: தமிழ் வேதாகம மரபில் நன்கு அறியப்பட்ட பெயர் வடிவம்; அடுத்துவரும் יסף என்ற வினையுடனான சொல்விளையாட்டை அடிக்குறிப்பு விளக்குகிறது.
- source_word: לֵאמֹר
  choice: என்றாள்
  rationale: மேற்கோளை அறிமுகப்படுத்தும் எபிரெயச் சொல்லை இயல்பான தமிழ் நேர்கூற்றின் முடிவில் வெளிப்படுத்துகிறது.
- source_word: יֹסֵף
  choice: சேர்த்துத் தருவாராக
  rationale: יסף என்பதன் ‘சேர்/கூட்டு’ என்ற பொருளையும், இச்சூழலில் உள்ள வேண்டுதல் அல்லது விருப்ப நுணுக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לִי
  choice: எனக்கு
  rationale: לִי என்பதன் பயன் அல்லது தொடர்பைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: בֵּן אַחֵר
  choice: இன்னொரு மகனை
  rationale: בֵּן குறிப்பாக ‘மகன்’ என்றும் אַחֵר ‘இன்னொரு’ என்றும் பொருள்படுவதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வடிவைத் தெளிவாகப் பாதுகாக்கிறது.
- issue: יֹסֵף என்பதன் வினை நுணுக்கம்
  choice: வேண்டுதலாக ‘சேர்த்துத் தருவாராக’
  alternative: ‘சேர்த்துத் தருவார்’ அல்லது ‘சேர்த்துத் தந்தார்’
  rationale: பெயரிடும் கூற்றில் இது எதிர்கால உறுதியுரை அல்லது நிறைவேறிய செயல் என்று கட்டாயமாகத் தீர்மானிக்கப்படாமல், விருப்பம்/வேண்டுதல் எனப் புரிவது சூழலுக்கும் வடிவத்துக்கும் ஏற்றது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘யாவே’ தெய்வீகப் பெயரின் ஒலிபெயர்ப்பாகவும், ‘சேர்த்துத் தருவாராக’ வேண்டுதல் நுணுக்கத்தைத் தெளிவாக்கும் தமிழாக்கமாகவும் பயன்படுத்தப்பட்டுள்ளது.
