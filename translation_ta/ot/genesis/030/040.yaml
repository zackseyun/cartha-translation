base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/040.yaml
  text: And Jacob separated the lambs[a], and he set the faces of the flock toward the striped and all the dark-colored among Laban's flock. Then he set apart flocks for himself[c][b], and did not put them with Laban’s flock.
translation:
  language: ta
  text: யாக்கோபு செம்மறியாட்டுக் குட்டிகளை[a] தனியாகப் பிரித்தான். பிறகு, லாபானின் மந்தையிலிருந்த[b] வரியுள்ள[c] ஆடுகளையும் அடர்நிறமுள்ள[d] எல்லா ஆடுகளையும் நோக்கி மந்தையை நிறுத்தினான். தனக்கெனத் தனி மந்தைகளை வைத்தான்; அவற்றை லாபானின் மந்தையோடு சேர்க்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இளம் செம்மறியாடுகளை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘லாபானின் மந்தையிலிருந்து வந்த’ என்றும் பொருள் கொள்ளலாம்.
    reason: source_ambiguity
  - marker: c
    text: ‘பட்டைகளுள்ள’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் பட்டைகள் அல்லது வரிகள் போன்ற அடையாளங்களுள்ள விலங்குகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: d
    text: ‘பழுப்பு நிறமுள்ள’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּשָׂבִים
  choice: செம்மறியாட்டுக் குட்டிகளை
  rationale: இந்தச் சொல் பொதுவாகச் செம்மறியாட்டுக் குட்டிகள் அல்லது இளம் செம்மறியாடுகளைக் குறிக்கிறது. பரந்த பொருளுடைய ‘ஆடுகள்’ என்பதைக் காட்டிலும் இத்தேர்வு மூலச்சொல்லின் குறிப்பைத் தக்கவைக்கிறது.
- source_word: הִפְרִיד
  choice: தனியாகப் பிரித்தான்
  rationale: הפריד என்பதன் காரணவினை வடிவம் பிரித்தல் அல்லது தனியே வைத்தல் என்று பொருள்படும்; சூழலில் இரு கருத்துகளும் இயல்பாக வெளிப்படுகின்றன.
- source_word: פְּנֵי הַצֹּאן
  choice: மந்தை ... நோக்கி நிற்கும்படி
  rationale: எபிரெயத்தில் சொற்படி ‘மந்தையின் முகங்களை’ என்று இருந்தாலும், மந்தையிலுள்ள விலங்குகளை ஒரு திசை நோக்கி நிறுத்திய செயலைத் தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: עָקֹד
  choice: வரியுள்ள ஆடுகள்
  rationale: עָקֹד பட்டைகள் அல்லது வரிகள் போன்ற அடையாளங்களுள்ள விலங்குகளைக் குறிக்கிறது; ‘வரியுள்ள’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: כָל חוּם
  choice: கருநிறமுள்ள ஆடுகள் அனைத்தையும்
  rationale: חוּם கருமையான அல்லது பழுப்பு நிறத்தைக் குறிக்கலாம். ‘கருநிறமுள்ள’ என்பது நிறத்தை மிகையாகத் துல்லியப்படுத்தாமல் முதன்மைப் பொருளை வழங்குகிறது; ‘பழுப்பு நிறமுள்ள’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּצֹאן לָבָן
  choice: லாபானின் மந்தையிலிருந்த
  rationale: בְ இங்கு இயல்பாக இடப்பொருளில் ‘லாபானின் மந்தையில்/மந்தையிலிருந்த’ எனப் புரிகிறது. தொடக்க இடத்தைக் குறிக்கும் ‘லாபானின் மந்தையிலிருந்து வந்த’ என்ற குறைவான பொதுவான புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיָּשֶׁת לוֹ עֲדָרִים לְבַדּוֹ
  choice: தனக்கெனத் தனித்தனி மந்தைகளை அமைத்துக்கொண்டு
  rationale: שׁית என்பதன் ‘அமைத்தல்/வைத்தல்’ என்ற பொருளையும் לְבַדּוֹ கூறும் தனித்திருத்தலையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: וְלֹא שָׁתָם עַל צֹאן לָבָן
  choice: அவற்றை லாபானின் மந்தையோடு சேர்க்கவில்லை
  rationale: வினையிலுள்ள பன்மைச் சுட்டு முன்னர் கூறப்பட்ட தனி மந்தைகளைக் குறிக்கிறது; עַל இங்கு உடனிருத்தல் அல்லது தொடர்பைக் குறிக்கிறது.
theological_decisions:
- issue: בְּצֹאן לָבָן என்பதன் தொடர்பு
  choice: ‘லாபானின் மந்தையிலிருந்த’ என்ற இடப்பொருள் முதன்மை உரையில் வைக்கப்பட்டது.
  alternative: ‘லாபானின் மந்தையிலிருந்து வந்த’ என்று தொடக்க இடம் அல்லது தோற்றத்தைக் குறித்தல்.
  rationale: בְ என்பதன் சாதாரணமான இடப்பொருள் இலக்கண ரீதியில் நேரடியானது. முந்தைய நிகழ்வோடு ஒத்திசைக்க மாற்றுப் பொருளை அமைதியாகத் தேர்வுசெய்யாமல், உண்மையான மொழியியல் ஐயத்தை அடிக்குறிப்பில் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் ‘மந்தையின் முகங்கள்’ என்ற உருவகம் தமிழில் செயற்பொருள் தெளிவாக இருக்கும்படி ‘மந்தை ... நோக்கி நிற்கும்படி’ என இயல்பாக்கப்பட்டுள்ளது; ஆனால் திசைநோக்கி நிறுத்தும் கருத்து தக்கவைக்கப்பட்டுள்ளது.
