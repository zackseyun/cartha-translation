base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/001.yaml
  text: When Rachel saw that she had borne no children to Jacob[a], she became jealous of her sister, and she said to Jacob, “Give me children[b], or I will die!”
translation:
  language: ta
  text: ராகேல் யாக்கோபுக்குப் பிள்ளைகள் பெற்றெடுக்கவில்லை என்பதைக் கண்டபோது, தன் சகோதரியின்மேல் பொறாமைப்பட்டாள். அவள் யாக்கோபிடம், “எனக்குப் பிள்ளைகளைக்[a] கொடுங்கள்; இல்லையென்றால் நான் இறந்துவிடுவேன்!” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘மகன்கள்’; இங்கு ராகேல் பொதுவாகச் சந்ததியை விரும்பும் சூழலில் ‘பிள்ளைகள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא רָחֵל כִּי
  choice: ராகேல் ... என்பதைக் கண்டபோது
  rationale: தொடர்ந்து வரும் செயல்களுக்கான கால-காரணப் பின்னணியை இயல்பான தமிழில் காட்டுகிறது; எபிரெயக் கதைநடையின் முன்னேற்றத்தையும் காக்கிறது.
- source_word: לֹא יָלְדָה לְיַעֲקֹב
  choice: தான் யாக்கோபுக்குப் பிள்ளைகளைப் பெற்றெடுக்கவில்லை
  rationale: ஒரு பெண்ணைக் குறித்த Qal வடிவிலுள்ள ילד என்பதன் ‘பெற்றெடுத்தல்’ என்ற பொருளை நேரடியாகத் தருகிறது. வெளிப்படையாக இல்லாத செயப்படுபொருளைச் சூழலிலிருந்து ‘பிள்ளைகள்’ என நிறைவு செய்கிறது; לְ உறவை ‘யாக்கோபுக்கு’ எனக் காக்கிறது.
- source_word: וַתְּקַנֵּא רָחֵל בַּאֲחֹתָהּ
  choice: தன் சகோதரியைக் கண்டு பொறாமைப்பட்டாள்
  rationale: קנא இங்கு சகோதரியின் மகப்பேற்றைக் குறித்த பொறாமையைத் தெரிவிக்கிறது. தமிழில் ‘ஒருவரைக் கண்டு பொறாமைப்படுதல்’ இயல்பான தொடராகும். இரண்டாம் ‘ராகேல்’ என்பதற்குப் பதிலாக வினைமுற்று எழுவாயைத் தெளிவாக்குவதால் தேவையற்ற பெயர் மீளுரைத்தல் தவிர்க்கப்படுகிறது.
- source_word: הָבָה לִּי בָנִים
  choice: எனக்குப் பிள்ளைகளைக் கொடுங்கள்
  rationale: בנים வடிவில் ‘மகன்கள்’ என்றாலும், இம்மகப்பேற்றுச் சூழலில் சந்ததி அல்லது பிள்ளைகள் என்ற பொதுப்பொருள் இயல்பானது. கணவனை நோக்கிய உரையில் மரியாதைப் பன்மை நவீனத் தமிழுக்கு ஏற்றது; கட்டளையின் தீவிரம் நீங்கவில்லை.
- source_word: וְאִם אַיִן
  choice: இல்லையென்றால்
  rationale: ‘அப்படி இல்லாவிட்டால்’ என்ற மாற்று விளைவைச் சுருக்கமாகவும் வலிமையாகவும் தரும் இயல்பான தமிழ் இணைப்பு.
- source_word: מֵתָה אָנֹכִי
  choice: நான் செத்துப்போவேன்
  rationale: ராகேலின் தீவிரமான, நேரடியான கூற்றைத் தணிக்காமல் காட்டுகிறது. ‘இறந்துவிடுவேன்’ என்பதைவிட ‘செத்துப்போவேன்’ உணர்ச்சிவசப்பட்ட நேரடி பேச்சில் இயல்பாக உள்ளது.
theological_decisions:
- issue: בנים என்பதன் பாலின வரம்பு
  choice: பிள்ளைகள்
  alternative: மகன்கள்
  rationale: இங்கு ராகேலின் மலட்டுத்தன்மையும் சந்ததி வேண்டுதலும் மையமாக உள்ளன; ஆண் குழந்தைகளை மட்டும் குறிப்பதாகச் சூழல் வற்புறுத்தவில்லை. ஆகவே பொதுப்பொருளான ‘பிள்ளைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- issue: מֵתָה אָנֹכִי என்பதன் கால/நிலை நுணுக்கம்
  choice: நான் செத்துப்போவேன்
  alternative: நான் செத்துக்கொண்டிருக்கிறேன் / நான் செத்தவள்தான்
  rationale: வடிவம் தீவிரமான அல்லது நெருங்கிய மரண நிலையை வெளிப்படுத்தக்கூடும். தமிழில் எதிர்கால விளைவாகக் கூறுவது கோரிக்கையின் நிபந்தனைத் தன்மையையும் உணர்ச்சி வலிமையையும் தெளிவாகக் காக்கிறது; இது சொற்பொருள் மரணமா மிகைப்படுத்தலா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான கதைநடை. ராகேலின் நேரடிப் பேச்சில் உள்ள அவசரமும் தீவிரமும் காக்கப்பட்டுள்ளன. ‘கொடுங்கள்’ என்பது கணவனை நோக்கிய இயல்பான மரியாதை வினை; கோரிக்கையின் கட்டளைத் தன்மையை மென்மையாக்குவதில்லை.
