- from: பின்பு அவன், “உன் கூலியை என்னிடம் குறிப்பிடு; அதை நான் கொடுப்பேன்” என்றான்.[a]
  to: பின்பு அவன், “நான் தர வேண்டிய உன் கூலியை நிர்ணயித்துச் சொல்; அதை நான் கொடுப்பேன்” என்றான்.[a]
