  yaml_path: translation/ot/genesis/030/028.yaml
  text: Then he said[a], “Name your wages, and I will give it.”
translation:
  language: ta
  text: பின்பு அவன், “நான் தர வேண்டிய உன் கூலியை நிர்ணயித்துச் சொல்; அதை நான் கொடுப்பேன்” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் கூலி எவ்வளவு என்று சொல்; அதை நான் கொடுப்பேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: பின்பு அவன் … என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் இயல்பாக வருவதற்காக மேற்கோளைச் சூழ்ந்து ‘பின்பு அவன் … என்றான்’ என அமைக்கப்பட்டது.
- source_word: נָקְבָה
  choice: குறிப்பிடு
  rationale: נקב இங்கு தெளிவாக நிர்ணயித்துச் சொல்வதைக் குறிக்கிறது. ‘குறிப்பிடு’ என்பது கூலி தொடர்பான சூழலில் இயல்பாகவும் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: שְׂכָרְךָ
  choice: உன் கூலியை
  rationale: שָׂכָר உழைப்புக்குரிய ஊதியம் அல்லது கூலியைக் குறிக்கிறது; யாக்கோபின் பணிச் சூழலில் ‘கூலி’ பொருத்தமானது.
- source_word: עָלַי
  choice: என்னிடம்
  rationale: சொல்லுக்கு நேர் பொருள் ‘என்மேல்’ என்றாலும், இவ்விடத்து கூலியைப் பேச்சாளரிடம் தெளிவாகச் சொல்லுமாறு கோரும் வழக்குச் சொல்லாட்சியாக உள்ளது; ‘என்னிடம்’ அந்த உறவைப் பாதுகாக்கிறது.
- source_word: וְאֶתֵּנָה
  choice: அதை நான் கொடுப்பேன்
  rationale: נתן என்பது ‘கொடு’; வினை வடிவம் உறுதியான முன்வருகையை வெளிப்படுத்துகிறது. ‘கூலி’ தமிழில் ஒருமைத் தொகுப்புப்பெயராக இருப்பதால் ‘அதை’ இயல்பான சுட்டுப்பெயர்.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் ‘என்மேல்’ என்ற நேர் வடிவம் தமிழில் குழப்பம் தரக்கூடும் என்பதால், இச்சூழலுக்குரிய திசை/பெறுநர் பொருளை ‘என்னிடம்’ என வழங்கி, மாற்றுச் சொல்லாக்கத்தை அடிக்குறிப்பில் காட்டப்பட்டுள்ளது.
