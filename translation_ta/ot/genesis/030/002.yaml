source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יַעֲקֹ֖ב בְּ/רָחֵ֑ל וַ/יֹּ֗אמֶר הֲ/תַ֤חַת אֱלֹהִים֙ אָנֹ֔כִי אֲשֶׁר מָנַ֥ע מִמֵּ֖/ךְ פְּרִי בָֽטֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/002.yaml
  text: Then Jacob became angry with Rachel and said[a], “Am I in the place of God[b], who has withheld the fruit of the womb from you?”
translation:
  language: ta
  text: அப்போது யாக்கோபு ராகேல்மீது கோபமடைந்தார்[a]. அவர் அவளிடம், “உனக்குக் கருப்பையின் கனியை[b]த் தடுத்து வைத்திருக்கும் கடவுளின் இடத்தில் நான் இருக்கிறேனா?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சார்ந்த முறையில், “யாக்கோபின் கோபம் ராகேலுக்கு எதிராக எரிந்தது.”
    reason: lexical_alternative
  - marker: b
    text: “கருப்பையின் கனி” என்பது குழந்தைகள் அல்லது சந்ததியைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: கோபம் மூண்டது
  rationale: கோபம் ‘எரிவதை’க் குறிக்கும் எபிரெய மரபுத்தொடரின் வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּרָחֵל
  choice: ராகேல்மேல்
  rationale: கோபம் செலுத்தப்பட்ட நபரை בְ குறிக்கிறது; தமிழில் ‘ராகேல்மேல்’ என்பது இயல்பான வடிவம்.
- source_word: הֲתַחַת אֱלֹהִים אָנֹכִי
  choice: கடவுளின் இடத்தில் நான் இருக்கிறேனா?
  rationale: תַחַת இங்கு கீழிருப்பதைக் குறிக்காமல், ஒருவரின் இடத்தையோ அதிகாரத்தையோ ஏற்றிருப்பதைக் குறிக்கிறது. வினாவின் மறுப்புணர்வும் காக்கப்படுகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: சூழலும் தொடரும் ஒருமை வினையும் இங்கு ஒரே கடவுளைக் குறிக்கின்றன.
- source_word: אֲשֶׁר מָנַע מִמֵּךְ
  choice: உனக்குத் தராமல் தடுத்த
  rationale: ராசேலுக்குக் குழந்தைப்பேறு கிடைக்காதபடி கடவுள் தடுத்தார் என்ற மூலத்தின் செயற்பாட்டை மென்மைப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: פְּרִי בָטֶן
  choice: கருப்பையின் கனி
  rationale: சந்ததி அல்லது குழந்தைகளைக் குறிக்கும் மூலமொழியின் உருவகத்தைத் தக்கவைத்து, தமிழிலும் புரிந்துகொள்ளத்தக்க வகையில் வழங்குகிறது.
theological_decisions:
- issue: குழந்தைப்பேறின்மையில் கடவுளின் செயற்பாடு
  choice: ராகேலுக்குக் கருப்பையின் கனியைத் தராமல் தடுத்தவர் கடவுள் என்று யாக்கோபு கூறுவதாக மொழிபெயர்க்கப்பட்டது.
  alternative: யாக்கோபு கடவுளின் இடத்தில் இல்லை என்பதை மட்டும் வலியுறுத்தி, கடவுளின் செயற்பாட்டை மறைமுகமாக்குவது.
  rationale: אֲשֶׁר מָנַע என்ற தொடர்புச் சொற்றொடர், ராகேலுக்குக் குழந்தைப்பேற்றைத் தடுத்தவர் கடவுள் என்று நேரடியாக அடையாளப்படுத்துகிறது; அந்த இறையியல் பதற்றம் அப்படியே காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கோபம் மூண்டது’ என்பது எபிரெய உருவகத்தின் வலிமையை இயல்பாகக் காக்கிறது; ‘கருப்பையின் கனி’ என்பது மூல உருவகத்தைத் தக்கவைக்கிறது.
