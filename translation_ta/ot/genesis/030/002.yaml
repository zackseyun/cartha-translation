revisions:
- from: அப்போது ராகேல்மேல் யாக்கோபுக்குக் கோபம் மூண்டது[a]. அவர் அவளிடம், “உனக்குக் கருப்பையின் கனியை[b]த் தராமல் தடுத்த கடவுளின் இடத்தில் நான் இருக்கிறேனா?” என்றார்.
  to: அப்போது யாக்கோபு ராகேல்மீது கோபமடைந்தார்[a]. அவர் அவளிடம், “உனக்குக் கருப்பையின் கனியை[b]த் தடுத்து வைத்திருக்கும் கடவுளின் இடத்தில் நான் இருக்கிறேனா?” என்றார்.
  rationale: The revision improves idiomatic Tamil without reducing the source text's rhetorical force or its direct attribution of withheld fertility to God. The footnote anchors remain attached to the anger expression and the Hebrew idiom for offspring, respectively.
