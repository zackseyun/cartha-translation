  text: And it happened, when Rachel had borne Joseph, that Jacob said to Laban, “Send me away, that I may go to my own place and to my own land.”
translation:
  language: ta
  text: ராகேல் யோசேப்பைப் பெற்றெடுத்தபின், யாக்கோபு லாபானிடம், “என்னை அனுப்பிவிடும்; நான் என் இடத்திற்கும் என் நாட்டிற்கும் செல்லட்டும்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: என்னை அனுப்பிவிடும்
  rationale: பேச்சுச் சூழலில் அனுமதித்து வழியனுப்புமாறு கேட்கும் எபிரெயச் சொல்லின் பொருளை இயல்பாகவும் மரியாதை ஒருமை நடையிலும் தருகிறது.
- source_word: מְקוֹמִי וּלְאַרְצִי
  choice: என் இடத்திற்கும் என் நாட்டிற்கும்
  rationale: இரு தனித்த உடைமைத் தொடர்களையும் இணைப்பையும் காத்து, யாக்கோபு தன் சொந்த ஊரிடத்தையும் நாட்டையும் குறிப்பிடுவதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר יָלְדָה רָחֵל אֶת יוֹסֵף
  choice: ராகேல் யோசேப்பைப் பெற்றெடுத்தபின்
  rationale: காலத் தொடர்பை இயல்பான நவீனத் தமிழில் தருகிறது; தொடரும் நிகழ்வு பிறப்புக்குப் பின் நடந்ததைச் சூழல் காட்டுகிறது.
