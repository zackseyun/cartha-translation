revisions:
- from: ராகேல் யோசேப்பைப் பெற்றெடுத்தபின், யாக்கோபு லாபானிடம், “என்னை அனுப்பிவிடும்; நான் என் இடத்திற்கும் என் நாட்டிற்கும் போகிறேன்” என்றான்.
  to: ராகேல் யோசேப்பைப் பெற்றெடுத்தபின், யாக்கோபு லாபானிடம், “என்னை அனுப்பிவிடும்; நான் என் இடத்திற்கும் என் நாட்டிற்கும் செல்லட்டும்” என்றான்.
