  text: Leah conceived again and bore Jacob a sixth son.
translation:
  language: ta
  text: லேயாள் மீண்டும் கருவுற்று, யாக்கோபுக்கு ஆறாவது மகனைப் பெற்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: கருவுற்று
  rationale: הרה என்பதன் நேரடியான பொருள் ‘கருத்தரித்தல்/கருவுறுதல்’. பிறப்புச் செய்தியின் தொடரில் ‘கருவுற்று’ என்பது இயல்பான, சுருக்கமான நவீனத் தமிழ் நடை.
- source_word: עוֹד
  choice: மீண்டும்
  rationale: இங்கு עוֹד முந்தைய கருவுறுதலுக்குப் பின் நிகழும் மறுநிகழ்வைக் குறிக்கிறது; ‘மீண்டும்’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וַתֵּלֶד
  choice: பெற்றாள்
  rationale: ילד என்பதன் இவ்வடிவம் ‘குழந்தையைப் பெற்றெடுத்தாள்’ என்று பொருள். ‘மகனைப் பெற்றாள்’ என்பது இயல்பான தமிழ் பிறப்புச் சொல்லாட்சி.
- source_word: בֵּן
  choice: மகனை
  rationale: בֵּן என்பதன் நேரடியான பொருள் ‘மகன்’; வேற்றுமை உருபுடன் ‘மகனை’ என வழங்கப்பட்டுள்ளது.
- source_word: שִׁשִּׁי
  choice: ஆறாவது
  rationale: இந்த வரிசை எண் மகனை அடைமொழியாக விவரிக்கிறது; ‘ஆறாவது மகன்’ என்பது தமிழில் தெளிவான இயல்பான அமைப்பு.
- source_word: לְיַעֲקֹב
  choice: யாக்கோபுக்கு
  rationale: לְ முன்னொட்டு இங்கு யாக்கோபுடனான உறவை, ‘யாக்கோபுக்கு ஒரு மகனைப் பெற்றாள்’ என்ற எபிரெயப் பிறப்புச் சொல்லாட்சியில் குறிக்கிறது. அதைத் தமிழிலும் இயல்பாகப் பாதுகாக்க ‘யாக்கோபுக்கு’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், சுருக்கமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நிகழ்வு வரிசையும் ‘யாக்கோபுக்கு’ என்ற உறவுக் குறிப்பும் காக்கப்பட்டுள்ளன.
