  text: וַ/תֹּ֣אמֶר לֵאָ֔ה בְּ/אָשְׁרִ֕/י כִּ֥י אִשְּׁר֖וּ/נִי בָּנ֑וֹת וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ אָשֵֽׁר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/013.yaml
  text: Then Leah said[b][a], “Happy am I! For women will call me happy.” So she called his name Asher.
translation:
  language: ta
  text: அப்போது லேயாள், “எனக்கு எவ்வளவு மகிழ்ச்சி! பெண்கள் என்னை மகிழ்ச்சியானவள் என்று அழைப்பார்கள்” என்றாள். எனவே அவனுக்கு ஆசேர்[a] என்று பெயரிட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆசேர்” என்ற பெயர், லேயாளின் கூற்றில் உள்ள ‘மகிழ்ச்சி’ மற்றும் ‘மகிழ்ச்சியானவள் என்று அழைப்பார்கள்’ என்பவற்றுக்கான எபிரெயச் சொற்களுடன் தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָשְׁרִי
  choice: நான் எவ்வளவு மகிழ்ச்சியானவள்!
  rationale: இந்தப் பெயரிடும் சூழலில், முதல் நபர் உணர்வையும் மகிழ்ச்சி குறித்த வியப்பையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; ஆசேர் என்ற பெயருடனான சொல்லொலித் தொடர்புக்கும் அடிப்படையாகிறது.
- source_word: אִשְּׁרוּנִי
  choice: என்னை மகிழ்ச்சியானவள் என்று அழைப்பார்கள்
  rationale: Piel வடிவத்தின் ‘ஒருவரை மகிழ்ச்சியானவர் என அறிவித்தல்/அழைத்தல்’ என்ற பொருளைத் தெளிவாகத் தருகிறது; முந்தைய ‘மகிழ்ச்சியானவள்’ என்பதுடனான சொல் தொடர்பையும் காக்கிறது.
- source_word: בָּנוֹת
  choice: பெண்கள்
  rationale: சொல்லின் நேரடிப் பொருள் ‘மகள்கள்’ என்றாலும், இங்கு அது பெண்களைப் பொதுவாகக் குறிக்கும் எபிரெய மரபுத்தொடராக இயங்குகிறது; ‘பெண்கள்’ என்பது சூழலுக்கு இயல்பான தமிழ்.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ אָשֵׁר
  choice: எனவே அவனுக்கு ஆசேர் என்று பெயரிட்டாள்
  rationale: எபிரெயப் பெயரிடும் சூத்திரத்தின் கருத்தையும் கதைநடையின் விளைவுத் தொடர்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: אָשֵׁר
  choice: ஆசேர்
  rationale: தனிப்பெயர் பொருளாக்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது; அதன் ‘மகிழ்ச்சி/மகிழ்ச்சியானவர் என அழைத்தல்’ என்ற சொல்விளையாட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. בָּנוֹת என்பதன் நேரடி ‘மகள்கள்’ என்பதற்குப் பதிலாக, இச்சூழலில் அதன் பரந்த மரபுத்தொடர்ப் பொருளான ‘பெண்கள்’ தேர்ந்தெடுக்கப்பட்டது. பெயருடன் தொடர்புடைய எபிரெயச் சொல்விளையாட்டு தமிழில் முழுமையாக மீளாததால் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
