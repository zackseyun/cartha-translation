base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/038.yaml
  text: He set the rods that he had peeled in the troughs[a], in the watering channels where the flock came to drink, in front of the flock[c][b]; and they mated when they came to drink.
translation:
  language: ta
  text: அவன் பட்டை உரித்திருந்த குச்சிகளை, மந்தை தண்ணீர் குடிக்க வரும் தண்ணீர்த் தொட்டிகளாகிய நீரூட்டும் வாய்க்கால்களில், மந்தைக்கு எதிரே வைத்தான். மந்தை தண்ணீர் குடிக்க வந்தபோது, அவை சினைப்பருவம் அடைந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவை தண்ணீர் குடிக்க வந்தபோது இனச்சேர்க்கை செய்தன.’ எபிரெய வினை நேரடியாக விலங்குகள் சூடடைந்து சினைப்பருவம் அடைவதைக் குறிக்கலாம்; இச்சூழலில் இனச்சேர்க்கையும் உட்பொருளாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּג
  choice: வைத்தான்
  rationale: ஒரு பொருளை குறிப்பிட்ட இடத்தில் நிலைநிறுத்தி வைப்பதைக் குறிக்கும் வினை; இச்சூழலில் இயல்பான நவீனத் தமிழ்.
- source_word: הַמַּקְלוֹת
  choice: குச்சிகளை
  rationale: முந்தைய வசனத்தில் யாக்கோபு தயாரித்த மரக்கிளைகள் அல்லது தடிகளைக் குறிக்கிறது; ‘குச்சிகள்’ பொதுவாசகருக்கு இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אֲשֶׁר פִּצֵּל
  choice: பட்டை உரித்திருந்த
  rationale: வெண்மையான உட்பகுதி கோடுகளாகத் தெரியும்படி மரப்பட்டையை உரித்த செயலைக் குறிக்கிறது; முந்தைய செயலைக் காட்ட இறந்தகால நிறைவுவடிவம் பயன்படுத்தப்பட்டது.
- source_word: בָּרֳהָטִים בְּשִׁקֲתוֹת הַמָּיִם
  choice: வாய்க்கால்களாகிய தண்ணீர்த் தொட்டிகளில்
  rationale: இரண்டு தொடர்புடைய இடச்சொற்களையும் காக்கிறது; இரண்டாவது சொற்றொடர் முதலாவதை மேலும் விளக்கும் இணைப்பாக வாசிக்கப்படுகிறது, முற்றிலும் வேறான இரு இடங்களாக அல்ல.
- source_word: הַצֹּאן
  choice: மந்தை
  rationale: செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய சிறுகால்நடைக் கூட்டைக் குறிக்கும் எபிரெயக் கூட்டுப்பெயருக்கு ஏற்ற பொதுச் சொல்.
- source_word: לְנֹכַח הַצֹּאן
  choice: மந்தைக்கு எதிரே
  rationale: கால்நடைகளின் நேர்முன் அல்லது அவற்றை எதிர்நோக்கிய இடத்தில் வைக்கப்பட்டதைக் குறிக்கிறது; மூலத்தின் பெயர்ச்சொல் மீளுரைப்பும் காக்கப்படுகிறது.
- source_word: וַיֵּחַמְנָה
  choice: சினைப்பருவம் அடைந்தன
  rationale: வினை அடிப்படையில் பெண் விலங்குகள் சூடடைந்து இனச்சேர்க்கைக்குத் தயாராகும் நிலையைச் சுட்டுகிறது. ‘இனச்சேர்க்கை செய்தன’ என்பதைக் காட்டிலும் மூலச்சொல்லின் நேரடிப் பொருளை இது நெருக்கமாகக் காக்கிறது.
- source_word: בְּבֹאָן לִשְׁתּוֹת
  choice: தண்ணீர் குடிக்க வந்தபோது
  rationale: தண்ணீர் குடிக்க வந்த நிகழ்வுடன் தொடர்புடைய காலச் சூழலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
