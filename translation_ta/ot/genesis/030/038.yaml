translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகருக்குப் புரியும் தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. நீர்ப்பரப்பைக் குறிக்கும் தொடர்புடைய இரண்டு எபிரெயச் சொற்களும் ஒரே நீரூட்டும் அமைப்பை விரிவாக விளக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளன; இனப்பெருக்க வினையின் உடல்நிலை சார்ந்த அடிப்படைப் பொருள் முதன்மை உரையில் காக்கப்பட்டு, சூழல் சார்ந்த ‘இனச்சேர்க்கை’ வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
