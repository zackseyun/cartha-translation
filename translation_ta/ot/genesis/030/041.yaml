base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/041.yaml
  text: And whenever the stronger of the flock were breeding[a], Jacob would place the rods before the eyes of the flock in the watering troughs[b], so that they might breed among the rods.
translation:
  language: ta
  text: மந்தையிலுள்ள வலிமையான விலங்குகள் இனச்சேர்க்கைக்குத் தயாராகும் போதெல்லாம்[a], யாக்கோபு அந்தக் கோல்களை மந்தையின் கண்களுக்கு முன்பாக நீர்த் தொட்டிகளில்[b] வைப்பான்; அவை கோல்களின் அருகில் இனச்சேர்க்கை செய்யும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வலுவானவை,’ ‘உறுதியானவை’ என்றும் மொழிபெயர்க்கலாம். அடுத்த வசனத்தில் குறிப்பிடப்படும் பலவீனமான விலங்குகளுக்கு மாறாக, நல்ல உடல்வலிமையுள்ள விலங்குகளை எபிரெயச் சொல் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நீர் செல்லும் வாய்க்கால்களில்’ அல்லது ‘நீரோடைகளில்’ என்றும் மொழிபெயர்க்கலாம். விலங்குகள் நீர் குடிக்க வந்த இடங்களையே எபிரெயச் சொல் இங்கு குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: போதெல்லாம்
  rationale: היה உடன் வரும் இக்கதை அமைப்பு வழக்கமாகத் திரும்பத் திரும்ப நிகழ்ந்த செயலைக் குறிக்கிறது; தமிழில் ‘போதெல்லாம்’ அந்தத் தொடர்ச்சியான வழக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּכָל יַחֵם
  choice: இனச்சேர்க்கைக்குத் தயாராகும் போதெல்லாம்
  rationale: יחם விலங்குகள் சினைப் பருவத்தில் அல்லது இனச்சேர்க்கைக்குத் தயாரான நிலையில் இருப்பதைக் குறிக்கிறது. ‘கருவுறும்’ என்று மொழிபெயர்ப்பது விளைவைக் குறிப்பிடும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: הַצֹּאן
  choice: மந்தை / மந்தையிலுள்ள ... விலங்குகள்
  rationale: צאן என்பது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய சிறு கால்நடைகளின் கூட்டுப்பெயர்; ‘மந்தை’ இனத்தைத் தேவையின்றிக் குறுக்காமல் கூட்டுப் பொருளைக் காக்கிறது.
- source_word: הַמְקֻשָּׁרוֹת
  choice: வலிமையான விலங்குகள்
  rationale: அடுத்த வசனத்திலுள்ள பலவீனமான விலங்குகளுக்கு எதிர்மாறாக, உறுதியான அல்லது நல்ல உடல்வாகுடைய விலங்குகளை இச்சொல் குறிக்கிறது.
- source_word: וְשָׂם
  choice: வைப்பான்
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வை, அமை’; வசனம் வழக்கமாகச் செய்யப்பட்ட செயலைக் கூறுவதால் தமிழ் வழக்குச் செயல்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: הַמַּקְלוֹת
  choice: கோல்கள்
  rationale: מקלות என்பது யாக்கோபு அமைத்த குச்சிகள் அல்லது கோல்களைக் குறிக்கிறது; முந்தைய சூழலுடன் இசைவாக ‘கோல்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְעֵינֵי הַצֹּאן
  choice: மந்தையின் கண்களுக்கு முன்பாக
  rationale: ‘கண்களுக்கு முன்பாக’ என்ற எபிரெய உருவகத்தை வாசிக்கத்தக்க தமிழில் காத்து, விலங்குகள் அவற்றைப் பார்க்கும் வகையில் அமைக்கப்பட்டதை வலியுறுத்துகிறது.
- source_word: בָּרֳהָטִים
  choice: நீர்த் தொட்டிகளில்
  rationale: רהטים இங்கு விலங்குகள் நீர் குடிக்க வந்த தொட்டிகள் அல்லது நீர் செல்லும் வாய்க்கால்களைக் குறிக்கிறது; சூழலைத் தெளிவாகக் காட்ட ‘நீர்த் தொட்டிகள்’ பயன்படுத்தப்பட்டது.
- source_word: לְיַחְמֶנָּה
  choice: இனச்சேர்க்கை செய்யும்படி
  rationale: לְ நோக்கத்தைக் குறிக்கிறது; பெண்பால் பன்மை வடிவம் மந்தை விலங்குகளைச் சுட்டுகிறது. இந்த மொழிபெயர்ப்பு யாக்கோபின் நோக்கத்தைக் காட்டுகிறது; கோல்கள் அவற்றைத் தவறாமல் அவ்வாறு செய்தன என்று காரணகாரியத்தை மிகைப்படுத்தவில்லை.
- source_word: בַּמַּקְלוֹת
  choice: கோல்களுக்கிடையே
  rationale: ב இங்கு கோல்கள் முன்னால் வைக்கப்பட்டிருந்த சூழலில் இனச்சேர்க்கை நடந்ததைக் குறிக்கும் இடவியல் அல்லது சூழ்நிலைப் பயன்பாடு; ‘கோல்களுக்கிடையே’ மூலத்தின் தெளிவின்மையை ஓரளவு காக்கிறது.
