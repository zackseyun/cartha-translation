    text: எபிரெய בגד என்பதன் பொருள் உறுதியாகத் தெரியவில்லை. இதை “நற்பேறு!” என்ற வியப்புரையாகப் புரிந்துகொள்ளலாம்; மரபில் சிலர் இதை “ஒரு படை!” என்றும் மொழிபெயர்க்கின்றனர். காத் என்ற பெயர், இச்சொல்விளையாட்டில் வரும் எபிரெயச் சொல்லுடன் தொடர்புடையது.
