source:
  edition: WLC
  text: וַ/תֹּ֥אמֶר לֵאָ֖ה ב/גד וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ גָּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/011.yaml
  text: And Leah said[a], “Good fortune!” So she called his name Gad.
translation:
  language: ta
  text: லேயாள், “நற்பேறு!”[a] என்றாள். அவள் அவனுக்குக் காத் என்று பெயரிட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய בגד என்பதன் பொருள் உறுதியாகத் தெரியவில்லை. இதை “நற்பேறு!” என்ற வியப்புரையாகப் புரிந்துகொள்ளலாம்; மரபில் சிலர் இதை “ஒரு படை!” என்றும் மொழிபெயர்க்கின்றனர். காத் என்ற பெயர், இச்சொல்விளையாட்டில் வரும் எபிரெயச் சொல்லுடன் தொடர்புடையது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: என்றாள்
  rationale: אָמַר என்பதன் wayyiqtol வடிவம் அடுத்த கதை நிகழ்வை அறிமுகப்படுத்துகிறது; தமிழில் மேற்கோளுக்குப் பின் வரும் ‘என்றாள்’ இயல்பான கதைநடையைத் தருகிறது.
- source_word: לֵאָה
  choice: லேயாள்
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: בגד
  choice: நல்ல அதிர்ஷ்டம்!
  rationale: சிக்கலான எபிரெய வடிவத்தை גד (‘அதிர்ஷ்டம்/நற்பேறு’) என்பதோடு தொடர்புடைய வியப்புரையாகப் புரிந்துகொள்கிறது; குழந்தையின் காத் என்ற பெயருடனான சொல்விளையாட்டையும் ஓரளவு வெளிப்படுத்துகிறது.
- source_word: וַתִּקְרָא
  choice: எனவே ... பெயரிட்டாள்
  rationale: பெயரிடும் சூழலில் קרא என்பதையும், லேயாளின் வியப்புரையிலிருந்து பெயரிடுதலுக்குச் செல்லும் விளைவு சார்ந்த ஓட்டத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: אֶת שְׁמוֹ
  choice: அவனுக்கு ... பெயர்
  rationale: ‘அவனுடைய பெயரை அழைத்தாள்’ என்ற எபிரெய மரபுத்தொடரை, பொருளை இழக்காமல் இயல்பான நவீன தமிழில் ‘அவனுக்குப் பெயரிட்டாள்’ என வழங்குகிறது.
- source_word: גָּד
  choice: காத்
  rationale: எபிரெய பெயரின் ஒலியைத் தமிழில் நெருக்கமாகப் பெயர்த்தெழுதி, லேயாளின் வியப்புரையோடு உள்ள ஒலிச்சார்ந்த சொல்விளையாட்டை நினைவூட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. சிக்கலான எபிரெய வாசகத்தின் உறுதியின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; பெயரிடும் சூத்திரம் தமிழுக்கு இயல்பாக மாற்றப்பட்டுள்ளது.
