translation_notes:
  register: நவீன நிலையான, மரியாதையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உமது/நீர்’ என்பது பேசுபவருக்கும் கேட்பவருக்கும் உள்ள குடும்ப மற்றும் வேலை உறவுக்கு ஏற்ற மரியாதை நடையை வழங்குகிறது. மூலத்தில் பெயர்கள் இல்லாததால் ‘யாக்கோபு’ அல்லது ‘லாபான்’ என்பவை முதன்மை உரையில் சேர்க்கப்படவில்லை.
