  yaml_path: translation/ot/genesis/030/029.yaml
  text: He said to him[a], “You know how I have served you, and how your livestock has been with me.”
translation:
  language: ta
  text: அவன் அவனிடம், “நான் உமக்காக எப்படிப் பணியாற்றினேன் என்பதையும், உமது கால்நடைகள் என்னிடம் எவ்வாறு இருந்தன என்பதையும் நீரே அறிவீர்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: அவன் அவனிடம் ... என்றான்
  rationale: எபிரெய உரையின் இரு ஆண்பால் ஒருமைப் பிரதிப்பெயர்களையும் வெளிப்படையாகப் பேணுகிறது; இயல்பான தமிழ் நேர்க்கூற்று அமைப்புக்காக ‘என்றான்’ இறுதியில் வைக்கப்பட்டுள்ளது.
- source_word: אַתָּה יָדַעְתָּ
  choice: நீரே அறிவீர்
  rationale: தனித்து வரும் אַתָּה தரும் வலியுறுத்தலை ‘நீரே’ பேணுகிறது. யாக்கோபு தன் மூத்த உறவினரும் முதலாளியுமான லாபானிடம் பேசும் சூழலுக்கு ஏற்ற மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֵת אֲשֶׁר עֲבַדְתִּיךָ
  choice: நான் உமக்கு எப்படிப் பணிவிடை செய்தேன் என்பதையும்
  rationale: עבד இங்கு ஒருவருக்குக் கீழ்ப்பட்டு உழைத்தல் அல்லது சேவை செய்தல் என்ற இரு நிழற்பொருள்களையும் கொண்டது; ‘பணிவிடை செய்தேன்’ அவற்றைச் சுருக்கமாகப் பேணுகிறது.
- source_word: מִקְנְךָ
  choice: உமது கால்நடைகள்
  rationale: מִקְנֶה என்பது மந்தைகளிலும் கூட்டங்களிலும் வளர்க்கப்படும் வீட்டுவிலங்குகளைச் சுட்டும் கூட்டுப்பெயர்; ‘கால்நடைகள்’ நவீன தமிழில் பரந்தும் தெளிவாகவும் உள்ளது.
- source_word: הָיָה מִקְנְךָ אִתִּי
  choice: உமது கால்நடைகள் என்னிடம் எவ்வாறு இருந்தன
  rationale: சொற்களின் அடிப்படை வடிவை நெருக்கமாகப் பேணுவதோடு, யாக்கோபின் பொறுப்பில் அவை இருந்த விதம் அல்லது அடைந்த நிலை ஆகிய இரு சாத்தியங்களையும் முடிவு செய்யாமல் விடுகிறது.
