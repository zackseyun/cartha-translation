source:
  edition: WLC
  text: וַ/יִּזְכֹּ֥ר אֱלֹהִ֖ים אֶת רָחֵ֑ל וַ/יִּשְׁמַ֤ע אֵלֶ֨י/הָ֙ אֱלֹהִ֔ים וַ/יִּפְתַּ֖ח אֶת רַחְמָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/022.yaml
  text: Then God remembered Rachel[b][a], and God listened to her and opened her womb.
translation:
  language: ta
  text: அப்போது கடவுள் ராகேலை நினைவுகூர்ந்தார்[a]. கடவுள் அவளுக்குச் செவிகொடுத்து[b], அவளுடைய கருப்பையைத் திறந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ராகேலைக் கவனித்தார்’ / ‘ராகேல்மீது மனம் வைத்தார்.’ ‘நினைவுகூர்ந்தார்’ என்ற எபிரெய வேதாகமச் சொல்லாட்சி, கடவுள் அவளை மறந்துவிட்டார் என்பதைக் குறிக்காமல், அவள்மீது கரிசனையுடன் கவனம் செலுத்தி செயல்பட்டதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவள் சொன்னதைக் கேட்டார்’ / ‘அவளுக்குச் செவிசாய்த்தார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: நினைவுகூர்ந்தார்
  rationale: זכר என்ற எபிரெய வினையின் நேரடியான வேதாகமச் சொல்லாட்சியை இது தக்கவைக்கிறது. இச்சூழலில் இது மறந்திருந்த ஒன்றை மீண்டும் நினைத்தல் என்பதைக் காட்டிலும், ராகேல்மீது கரிசனையுடன் கவனம் செலுத்தி செயல்படுவதைக் குறிக்கிறது; அடுத்த இரண்டு வினைகளும் அதனை விளக்குகின்றன.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு ஒருமை வினைகளோடு வரும் אֱלֹהִים ஒரே கடவுளைக் குறிக்கிறது. நவீன பொதுத்தமிழில் இயல்பாகவும் தெளிவாகவும் இருப்பதால் ‘கடவுள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶת רָחֵל
  choice: ராகேலை
  rationale: אֶת நேரடிச் செயப்படுபொருளைக் குறிக்கிறது; רָחֵל என்ற பெயர் தமிழில் வழக்கமான முறையில் ‘ராகேல்’ என ஒலிபெயர்க்கப்பட்டு, வேற்றுமை உருபுடன் வழங்கப்பட்டது.
- source_word: וַיִּשְׁמַע אֵלֶיהָ
  choice: அவளுக்குச் செவிகொடுத்து
  rationale: שׁמע אֶל என்பது வெறுமனே ஒலியைக் கேட்டதை அல்லாமல் கவனித்துக் கேட்டு பதிலளிக்கும் நுண்பொருளையும் தரலாம். ‘செவிகொடுத்து’ அந்த உறவுசார் நுண்பொருளைக் காக்கிறது; ‘பதில் அளித்தார்’ என்று மூலத்தைவிட அதிகமாக விளக்குவதையும் தவிர்க்கிறது.
- source_word: וַיִּפְתַּח
  choice: திறந்தார்
  rationale: פתח என்பதன் concrete உருவகத்தை நேரடியாகக் காக்கிறது.
- source_word: רַחְמָהּ
  choice: அவளுடைய கருப்பையை
  rationale: רֶחֶם என்பதன் பொருள் ‘கருப்பை’. கருத்தரிக்க இயலச் செய்தார் என்று விளக்கிப் பரப்பாமல், ‘கருப்பையைத் திறந்தார்’ என்ற எபிரெய வேதாகமச் சொல்லாட்சி பாதுகாக்கப்படுகிறது.
- source_word: וַ
  choice: அப்போது
  rationale: தொடக்க waw-consecutive கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. ‘அப்போது’ நவீன தமிழில் இயல்பாக நிகழ்வின் தொடர்ச்சியை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கடவுள் ராகேலை ‘நினைவுகூர்ந்தார்’ என்ற மனித இயல்பை ஒத்த சொல்லாட்சி
  choice: ‘நினைவுகூர்ந்தார்’ என்ற வேதாகமச் சொல்லாட்சியை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘ராகேலைக் கவனித்தார்’ அல்லது ‘ராகேல்மீது மனம் வைத்தார்’
  rationale: எபிரெயச் சொல் கடவுள் முன்பு ராகேலை மறந்துவிட்டார் என்று கட்டாயமாக உணர்த்துவதில்லை; அவர்மீது சாதகமான கவனம் செலுத்தி செயல்பட்டதைக் குறிக்கிறது. எனினும், அதை விளக்கவுரையாக மாற்றுவது வேதாகமத்தில் திரும்பத் திரும்ப வரும் முக்கிய சொல்லாட்சியைத் தட்டையாக்கும். அடுத்ததாக வரும் செவிகொடுத்தலும் கருப்பையைத் திறத்தலும் அதன் செயற்பாட்டு பொருளைத் தெளிவாக்குகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நினைவுகூர்ந்தார்’ மற்றும் ‘கருப்பையைத் திறந்தார்’ என்ற மூலமொழியின் வேதாகமச் சொல்லாட்சிகள் தக்கவைக்கப்பட்டு, தவறான புரிதலைத் தவிர்க்க அடிக்குறிப்புகள் தரப்பட்டுள்ளன. தொடர்ச்சியான எபிரெய வாக்கிய அமைப்பு தமிழில் வாசிக்க எளிதாக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
