base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/016.yaml
  text: When Jacob came in from the field in the evening[a], Leah went out to meet him and said, “You must come in to me, for I have hired you with my son’s mandrakes.” So he lay with her that night.
translation:
  language: ta
  text: மாலையில் யாக்கோபு வயலிலிருந்து வந்தபோது, லேயாள் அவரைச் சந்திக்க வெளியே சென்று, “நீர் என்னிடம் வர வேண்டும்; ஏனெனில் என் மகனின் மாண்ட்ரேக் கனிகளைக் கொடுத்து உம்மைக் கூலிக்கு அமர்த்தியிருக்கிறேன்[a]” என்றாள். ஆகவே அவர் அன்று இரவு அவளோடு படுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் மகனின் மாண்ட்ரேக் கனிகளை விலையாகக் கொடுத்து உம்மை நிச்சயமாகக் கூலிக்கு அமர்த்தியிருக்கிறேன்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் வினையை மீண்டும் கூறி வலியுறுத்துவதோடு, அந்தக் கனிகள் ஏற்பாட்டின் விலை அல்லது வழிமுறை என்பதையும் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... מִן הַשָּׂדֶה בָּעֶרֶב
  choice: மாலையில் ... வயலிலிருந்து வந்தபோது
  rationale: காலத்தையும் இடத்திலிருந்து திரும்பிய இயக்கத்தையும் இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: וַתֵּצֵא לֵאָה לִקְרָאתוֹ
  choice: லேயாள் அவரை எதிர்கொள்ளச் சென்று
  rationale: יצא மற்றும் לקראת ஆகியவற்றின் இயக்கப் பொருளைச் சுருக்காமல் இயல்பாக வழங்குகிறது.
- source_word: אֵלַי תָּבוֹא
  choice: நீர் என்னிடம் வர வேண்டும்
  rationale: சூழலில் உள்ள பாலுறவுக்கான நேரடியான அழைப்பை, எபிரெய மொழியின் மறைமுகச் சொல்லாட்சியையும் லேயாளின் உறுதியான கோரிக்கையையும் காத்து வழங்குகிறது.
- source_word: שָׂכֹר שְׂכַרְתִּיךָ
  choice: உம்மை வாடகைக்கு எடுத்திருக்கிறேன்
  rationale: ஒரு ஏற்பாட்டின் கீழ் கணவனுடன் அந்த இரவு சேரும் உரிமையைப் பெற்றதாக லேயாள் கூறும் பரிவர்த்தனைத் தன்மையைப் பாதுகாக்கிறது; செயப்பெயர்–வினைச்சொல் மீளுருவின் வலியுறுத்தலை தமிழில் மிகைப்படுத்தவில்லை.
- source_word: בְּדוּדָאֵי בְּנִי
  choice: என் மகனின் மாண்ட்ரேக் கனிகளைக் கொடுத்து
  rationale: בְּ என்பதைக் ஏற்பாட்டின் விலை அல்லது வழிமுறையாக எடுத்துக்கொள்கிறது. דודאים என்பதற்கு தவறான உள்ளூர் தாவர அடையாளத்தை அளிக்காமல் ‘மாண்ட்ரேக்’ என ஒலிபெயர்க்கிறது.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: அவர் அவளோடு உறவுகொண்டார்
  rationale: பாலுறவைக் குறிக்கும் எபிரெய மறைமுகச் சொல்லாட்சியின் பொருளை நவீனத் தமிழில் கண்ணியமாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: בַּלַּיְלָה הוּא
  choice: அன்று இரவு
  rationale: הוּא தரும் குறிப்பை இயல்பான தமிழ்க் காலச்சொற்றொடராக வெளிப்படுத்துகிறது.
