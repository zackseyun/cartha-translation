  rationale: The revision makes Leah’s outward movement explicit and non-confrontational, uses an idiomatic Tamil expression for the Hebrew hiring metaphor, and renders the final sexual euphemism with a comparably euphemistic, contextually intelligible Tamil expression. The footnote continues to mark the intensifying verbal repetition and the disputed nuance of the preposition without overstating either.
