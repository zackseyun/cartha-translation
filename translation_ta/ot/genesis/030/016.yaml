  register: நவீன நிலையான தமிழ்; உரையாடலில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. பாலுறவைக் குறிக்கும் இடங்களில் கண்ணியமான, வெளிப்படையாகப் புரியும் சொல்லாட்சி தேர்ந்தெடுக்கப்பட்டுள்ளது. ‘மாண்ட்ரேக்’ என்பது தாவரத்தைத் தவறாகத் தமிழ்நாட்டுத் தூதுவளையுடன் ஒப்பிடுவதைத் தவிர்க்கும் ஒலிபெயர்ப்பு.
