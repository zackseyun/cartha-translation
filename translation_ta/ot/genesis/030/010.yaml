    text: அல்லது, ‘அடிமைப் பெண்.’ எபிரெய שִׁפְחָה கீழ்நிலையிலுள்ள பெண் வீட்டுப் பணியாளரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: பெற்றெடுத்தாள்
  rationale: וַתֵּלֶד என்பது தொடர்கதை நிகழ்வை முன்னெடுக்கும் வினை; தமிழில் குழந்தைப் பிறப்பை இயல்பாகவும் தெளிவாகவும் குறிக்க ‘பெற்றெடுத்தாள்’ பொருத்தமானது. வசனம் தனியாக வாசிக்கப்படும்போது தொடக்கத்தில் ‘அப்போது’ அல்லது ‘மேலும்’ சேர்க்காமல் இருப்பது இயல்பான தமிழ் நடைக்கு ஏற்றது.
- source_word: זִלְפָּה
  choice: சில்பாள்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் மரபான வடிவம்.
- source_word: שִׁפְחַת
  choice: பணிப்பெண்
  rationale: שִׁפְחָה என்பது கீழ்நிலையிலிருந்த பெண் வீட்டுப் பணியாளர் அல்லது அடிமைப் பெண்ணைக் குறிக்கலாம். ‘பணிப்பெண்’ பாலினத்தையும் பணிநிலையையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ஆனால் மூலச்சொல்லின் முழு சமூக-சட்ட நிலையைத் தீர்மானித்து மிகைப்படுத்தாது.
- source_word: לֵאָה
  choice: லேயாளின்
  rationale: எபிரெய கட்டமைப்பு உறவைத் தமிழில் இயல்பான உடைமை வேற்றுமையாக வழங்குகிறது.
- source_word: לְיַעֲקֹב
  choice: யாக்கோபுக்கு
  rationale: לְ முன்னிடைச்சொல் இங்கு குழந்தையின் தந்தை அல்லது சம்பந்தப்பட்ட நபரைச் சுட்டுகிறது; ‘யாக்கோபுக்கு’ என்பது மூல அமைப்பைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: בֵּן
  choice: ஒரு மகனை
  rationale: சூழலில் குறிப்பற்ற ஒருமை ஆண்பிள்ளையைக் குறிக்கும்; தமிழில் ‘ஒரு மகனை’ இயல்பான வடிவம்.
