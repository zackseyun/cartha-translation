  text: וְ/עָֽנְתָה בִּ֤/י צִדְקָתִ/י֙ בְּ/י֣וֹם מָחָ֔ר כִּֽי תָב֥וֹא עַל שְׂכָרִ֖/י לְ/פָנֶ֑י/ךָ כֹּ֣ל אֲשֶׁר אֵינֶ/נּוּ֩ נָקֹ֨ד וְ/טָל֜וּא בָּֽ/עִזִּ֗ים וְ/חוּם֙ בַּ/כְּשָׂבִ֔ים גָּנ֥וּב ה֖וּא אִתִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/033.yaml
  text: 'So my honesty will answer for me later[a], when you come to inspect my wages: every goat that is not speckled and spotted, and every lamb that is not dark-colored[e][d][c][b], will be considered stolen if it is found with me.'
translation:
  language: ta
  text: என் நேர்மை எனக்காகச் சான்று சொல்லும்[a]. பிற்காலத்தில்[b] நீ என் கூலியை ஆய்வு செய்ய வரும்போது, வெள்ளாடுகளில் புள்ளிகளோ திட்டுகளோ இல்லாத ஒவ்வொன்றும், செம்மறியாடுகளில் இருண்ட நிறமில்லாத ஒவ்வொன்றும்[c] என்னிடம் இருந்தால், அது திருடப்பட்டதாகக் கருதப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் நீதி எனக்காகப் பதிலளிக்கும்” அல்லது “என் நேர்மை எனக்காகச் சான்றளிக்கும்.” இங்கு எபிரெயச் சொல், இந்தக் கூலி ஏற்பாட்டில் யாக்கோபின் நேர்மை வெளிப்படையாக நிரூபிக்கப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “நாளைய நாளில்.” இது “நாளை” என்றும், லாபான் மந்தையைச் சோதிக்கும் பிற்காலம் என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: “இருண்ட நிறமில்லாத” என்பதற்கு “பழுப்பு நிறமில்லாத” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் பழுப்பு அல்லது இருண்ட நிறமுள்ள செம்மறியாட்டைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנְתָה בִּי
  choice: எனக்காகச் சான்றளிக்கும்
  rationale: ענה + ב இங்கு யாக்கோபின் சார்பாகச் சாட்சி கூறுதல் அல்லது அவன் நேர்மையை உறுதிப்படுத்துதல் என்ற பொருளைத் தருகிறது.
- source_word: צִדְקָתִי
  choice: என் நேர்மை
  rationale: கூலி ஒப்பந்தச் சூழலில், நடைமுறையில் நிரூபிக்கப்படும் நாணயத்தையும் நேர்மையையும் குறிக்கிறது; ‘நீதி’ என்ற மாற்றுப் பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּיוֹם מָחָר
  choice: பிற்காலத்தில்
  rationale: சொல்லுக்குச் சொல் ‘நாளைய நாளில்’; இங்கு அடுத்த நாளை மட்டும் கட்டாயமாகக் குறிக்காமல், பின்னர் நடைபெறும் சோதனையைச் சுட்டலாம்.
- source_word: כִּי תָבוֹא עַל שְׂכָרִי לְפָנֶיךָ
  choice: நீ என் கூலியைப் பார்வையிட வரும்போது
  rationale: லாபான் யாக்கோபின் கூலியாகிய மந்தையை நேரில் வந்து சோதிப்பதே சூழலின் நடைமுறைப் பொருள்; לְפָנֶיךָ-வின் நேரடி ஆய்வுக் கருத்து தமிழில் இயல்பாக உட்பொருளாக்கப்பட்டுள்ளது.
- source_word: נָקֹד וְטָלוּא
  choice: புள்ளிகளும் திட்டுகளும்
  rationale: 'இரு வேறுபட்ட அடையாளங்களைத் தனித்தனியாக வைத்திருக்கிறது: சிறு புள்ளிகள் மற்றும் பெரிய/ஒழுங்கற்ற நிறத்திட்டுகள்.'
- source_word: חוּם
  choice: கருநிறமாய்
  rationale: செம்மறியாடுகளின் பழுப்பு முதல் இருண்ட நிறம் வரையிலான வண்ணத்தைக் குறிக்கலாம்; ‘கருநிறம்’ பொதுவான இருண்ட நிறத்தை இயல்பாகத் தெரிவிக்கிறது, மாற்று ‘பழுப்பு நிறம்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בָּעִזִּים / בַּכְּשָׂבִים
  choice: வெள்ளாடுகளில் / செம்மறியாடுகளில்
  rationale: இரு கால்நடை வகைகளையும் தெளிவாக வேறுபடுத்துகிறது; כשבים சூழலில் குட்டிகளை மட்டும் அல்லாமல் செம்மறியாட்டு மந்தைப் பிரிவைக் குறிக்கிறது.
- source_word: גָּנוּב הוּא אִתִּי
  choice: என்னிடம் இருந்தால், அது திருடப்பட்டதாகக் கருதப்படும்
  rationale: எபிரெயச் சொற்றொடரின் சுருக்கமான நீதித்தீர்ப்பு உணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: צִדְקָתִי என்பதன் நெறியியல் பரப்பு
  choice: என் நேர்மை
  alternative: என் நீதி
  rationale: இங்கு இரட்சிப்பியல் அல்லது உடன்படிக்கை சார்ந்த தொழில்நுட்பப் பொருளைத் திணிக்காமல், கூலி ஒப்பந்தத்தில் வெளிப்படும் யாக்கோபின் நாணயத்தைக் காட்டுகிறது; மூலச்சொல்லின் விரிவான ‘நீதி’ பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. கால்நடை அடையாளங்களுக்கான ‘புள்ளிகள்’, ‘திட்டுகள்’ என்ற சொற்கள் மூலத்தின் வேறுபாட்டைப் பாதுகாக்கின்றன. வசனத்தில் உள்ள நிபந்தனை மற்றும் எதிர்காலச் சோதனையின் நீதித்தீர்ப்பு உணர்வு இயல்பான தமிழில் தெளிவாக்கப்பட்டுள்ளது.
