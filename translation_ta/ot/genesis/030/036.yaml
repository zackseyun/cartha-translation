  text: And he put a distance of three days between himself and Jacob, and Jacob was shepherding the rest of Laban’s flock.
translation:
  language: ta
  text: அவன் தனக்கும் யாக்கோபுக்கும் இடையில் மூன்று நாள் பயணத் தொலைவை வைத்தான். யாக்கோபோ லாபானின் மீதியிருந்த மந்தையை மேய்த்துக்கொண்டிருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: மூன்று நாள் பயணத் தொலைவு
  rationale: எபிரெயச் சொற்றொடர் வெறும் கால அளவை அல்ல, மூன்று நாட்களில் கடக்கக்கூடிய பயணத் தூரத்தைக் குறிக்கிறது; இயல்பான தமிழில் இதைத் தெளிவாகத் தருகிறது.
- source_word: רֹעֶה
  choice: மேய்த்துக்கொண்டிருந்தான்
  rationale: இங்கு வரும் எபிரெயப் பங்கேற்புவினை அப்போது தொடர்ந்துகொண்டிருந்த செயலைக் குறிக்கிறது.
- source_word: צֹאן ... הַנּוֹתָרֹת
  choice: மீதியிருந்த மந்தை
  rationale: צֹאן என்பது ஆடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய கூட்டுப்பெயர்; இனத்தைத் தேவையின்றிக் குறுக்காமல் ‘மந்தை’ என மொழிபெயர்க்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. முதல் ‘அவன்’ முந்தைய வசனச் சூழலில் லாபானைக் குறிக்கிறது; மூலத்தில் பெயர் மீண்டும் சொல்லப்படாததால் அதேபடி பிரதிப்பெயராக வைக்கப்பட்டது. וְיַעֲקֹב என்பதின் எதிர்மறை/மாறுபாட்டு நுணுக்கத்தை ‘யாக்கோபோ’ வெளிப்படுத்துகிறது.
