  naturalness: நவீன பொதுத்தமிழில் நடை இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘யாக்கோபோ’ என்பது வாக்கியத்தின் இரண்டாம் பகுதியிலுள்ள மாறுபட்ட கவனத்தைச் சீராக வெளிப்படுத்துகிறது.
