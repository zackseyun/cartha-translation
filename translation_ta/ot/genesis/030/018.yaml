base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/018.yaml
  text: And Leah said[a], “God has given me my reward, because I gave my female servant to my husband.” So she named him Issachar.
translation:
  language: ta
  text: லேயாள், “என் பணிப்பெண்ணை என் கணவனுக்குக் கொடுத்ததால், கடவுள் எனக்குரிய கூலியைத் தந்தார்” என்று சொல்லி, அவனுக்கு இசக்கார்[a] என்று பெயரிட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இசக்கார்” என்ற பெயர், “கூலி” அல்லது “ஊதியம்” என்று பொருள்படும் எபிரெயச் சொல்லை ஒத்தொலிக்கிறது; இது லேயாள் கூறிய விளக்கத்தைப் பிரதிபலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן אֱלֹהִים
  choice: கடவுள் ... தந்தார்
  rationale: எபிரெய வினையின் நிறைவுற்ற செயலை இயல்பான நவீனத் தமிழில் கூறுகிறது; பிறப்பைத் தெய்வத்தின் கொடையாக லேயாள் விளக்குவதை நேரடியாகப் பேணுகிறது.
- source_word: שְׂכָרִי
  choice: எனக்குரிய கூலி
  rationale: שָׂכָר என்பதன் கூலி/ஊதியம்/பலன் என்ற பொருள் வரம்பில், ‘கூலி’ என்பது இசக்கார் என்ற பெயருடனான சொல் விளையாட்டையும் பரிமாற்றத் தொனியையும் சிறப்பாகப் பேணுகிறது. ‘என் கூலி’ என்பதைவிட ‘எனக்குரிய கூலி’ தமிழில் இயல்பாக உள்ளது.
- source_word: אֲשֶׁר
  choice: '... கொடுத்ததால்'
  rationale: இங்கு தொடர்பிடைச் சொல்லுக்கு காரணப் பொருள் இருப்பதால், தமிழில் காரண வினையெச்சம் தெளிவாகவும் இயல்பாகவும் அமைகிறது.
- source_word: נָתַתִּי
  choice: கொடுத்ததால்
  rationale: லேயாள் முன்பு செய்த செயலை நிறைவுற்றதாகக் காட்டி, அதையே அவள் கூறும் காரணமாக இணைக்கிறது.
- source_word: שִׁפְחָתִי
  choice: என் பணிப்பெண்ணை
  rationale: பெண்பால் பணியாளர்/அடிமைப் பெண் என்ற பொருள் வரம்பை நவீனத் தமிழில் வாசிக்கத்தக்க வகையில் தருகிறது; வயதைத் தேவையின்றி குறிப்பதில்லை.
- source_word: לְאִישִׁי
  choice: என் கணவனுக்கு
  rationale: இச்சூழலில் אִישׁ என்பது யாக்கோபை லேயாளின் திருமண உறவில் குறிப்பிடுவதால் ‘கணவன்’ என்பதே தெளிவான பொருள்.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: அவனுக்கு ... என்று பெயரிட்டாள்
  rationale: பெயர் சூட்டும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வழங்குகிறது.
- source_word: יִשָּׂשכָר
  choice: இசக்கார்
  rationale: தனிப்பெயரை வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தருகிறது; שָׂכָר என்ற ‘கூலி’ சொல்லுடனான ஒலித்தொடர்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: கடவுளின் செயலைப் பற்றிய லேயாளின் விளக்கம்
  choice: குழந்தையின் பிறப்பைக் கடவுள் தந்த கூலியாக லேயாள் கருதுவதை நேரடியாக மொழிபெயர்த்தல்
  alternative: பரிமாற்றத் தொனியை மென்மையாக்க ‘பலன்’ அல்லது ‘வெகுமதி’ என்று மொழிபெயர்த்தல்
  rationale: இது நிகழ்வைப் பற்றிய லேயாளின் சொந்த விளக்கம். மொழிபெயர்ப்பு அவளது கருத்தை ஆதரிக்கவோ விமர்சிக்கவோ செய்யாமல், மூலத்தின் தெய்வீகப் பிரதிபலன் குறித்த மொழியையும் அதன் இறையியல் பதற்றத்தையும் பேண வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எனக்குரிய கூலி’ என்பது பெயருடனான எபிரெயச் சொல் விளையாட்டைப் பேணுவதோடு, தமிழில் ‘என் கூலி’ என்பதைக் காட்டிலும் தெளிவாக ஒலிக்கிறது.
