translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையுடனும் சாதாரண வாசகர்களுக்குப் புரியுமாறும் வடிவமைக்கப்பட்டது. லாபானை நோக்கிய ஒருமை உரையாடலுக்கு ‘உமக்கு/நீர்’ என்ற மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் காரணத் தொடர்பும், புறப்பட வேண்டும் என்ற யாக்கோபின் விருப்பமும், בָּהֵן எதைக் குறிக்கிறது என்ற உண்மையான தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
