  text: תְּנָ֞/ה אֶת נָשַׁ֣/י וְ/אֶת יְלָדַ֗/י אֲשֶׁ֨ר עָבַ֧דְתִּי אֹֽתְ/ךָ֛ בָּ/הֵ֖ן וְ/אֵלֵ֑כָה כִּ֚י אַתָּ֣ה יָדַ֔עְתָּ אֶת עֲבֹדָתִ֖/י אֲשֶׁ֥ר עֲבַדְתִּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/026.yaml
  text: Give me my wives and my children[a], for whom I have served you, so that I may go[b]; for you know the service with which I have served you.
translation:
  language: ta
  text: “என் மனைவிகளையும் என் பிள்ளைகளையும் எனக்குக் கொடுங்கள்; என் மனைவிகளுக்காக நான் உமக்குச் சேவைசெய்தேன். நான் புறப்பட்டுப் போகட்டும்; ஏனெனில், நான் உமக்குச் செய்த சேவையை நீர் அறிவீர்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּנָה
  choice: எனக்குக் கொடுத்துவிடும்
  rationale: נתן என்பதன் கட்டளை வடிவம். சூழலிலிருந்து பெறுநரான யாக்கோபைக் குறிக்கும் ‘எனக்கு’ இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது; ‘கொடுத்துவிடும்’ என்பது குடும்பத்தினரைத் தன்னுடன் அனுப்புமாறு கேட்கும் பொருளை நவீன தமிழில் தெளிவாகச் சொல்கிறது.
- source_word: נָשַׁי וְאֶת יְלָדַי
  choice: என் மனைவிகளையும் என் பிள்ளைகளையும்
  rationale: இச்சூழலில் אִשָּׁה என்பது பொதுவாகப் பெண்களை அல்ல, யாக்கோபின் மனைவிகளைக் குறிக்கிறது; יְלָדַי என்பதற்கு இயல்பான குடும்பச் சொல் ‘என் பிள்ளைகள்’ ஆகும்.
- source_word: אֲשֶׁר עָבַדְתִּי אֹתְךָ בָּהֵן
  choice: யார்களுக்காக நான் உமக்குப் பணிசெய்தேனோ
  rationale: עבד என்பதன் சேவை/வேலைப் பொருளையும், மனைவிகளைப் பெறுவதற்காக யாக்கோபு செய்த உழைப்பின் காரணத் தொடர்பையும் வெளிப்படுத்துகிறது. தொடர்புச் சொற்றொடர் முன் குறிப்பிடப்பட்ட குடும்பம் முழுவதையும் இலக்கண ரீதியாகத் தொடர அனுமதிக்கிறது; குறிப்பாக மனைவிகளைக் குறிக்கும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְאֵלֵכָה
  choice: நான் புறப்பட்டுப் போகட்டும்
  rationale: הלך என்பதன் cohortative வடிவிலுள்ள விருப்பத்தையும் புறப்படுவதற்கான வேண்டுகோளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: יָדַעְתָּ
  choice: நீர் அறிந்திருக்கிறீர்
  rationale: முன்னரே அறிந்து தற்போதும் அறிந்திருக்கும் நிலையைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: עֲבֹדָתִי אֲשֶׁר עֲבַדְתִּיךָ
  choice: நான் உமக்குச் செய்த பணி
  rationale: எபிரெய மொழியில் ஒரே עבד வேரிலிருந்து வந்த பெயர்ச்சொல் மற்றும் வினைச்சொல் இணைகின்றன. தமிழில் வேர்ச்சொல் மறுபதிப்பு செயற்கையாக ஒலிப்பதால், ‘செய்த பணி’ என்று இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது; ‘உழைப்பு/வேலை’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
