revisions:
- from: “யார்களுக்காக நான் உமக்குப் பணிசெய்தேனோ, அந்த என் மனைவிகளையும் என் பிள்ளைகளையும் எனக்குக் கொடுத்துவிடும்[a]; நான் புறப்பட்டுப் போகட்டும். ஏனெனில், நான் உமக்குச் செய்த பணி[b] என்னவென்று நீர் அறிந்திருக்கிறீர்.”
  to: “என் மனைவிகளையும் என் பிள்ளைகளையும் எனக்குக் கொடுங்கள்; என் மனைவிகளுக்காக நான் உமக்குச் சேவைசெய்தேன். நான் புறப்பட்டுப் போகட்டும்; ஏனெனில், நான் உமக்குச் செய்த சேவையை நீர் அறிவீர்.”
  rationale: The revision follows the Hebrew feminine plural reference as primarily pointing to the wives, while documenting the broader antecedent reading without presenting it as equally explicit in the main text. It also aligns the imperative with the respectful address and preserves the deliberate repetition of the Hebrew עבד root.
