base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/014.yaml
  text: In the days of the wheat harvest[a], Reuben went and found mandrakes in the field, and he brought them to Leah his mother. Then Rachel said to Leah, “Please give me some of your son’s mandrakes.”
translation:
  language: ta
  text: கோதுமை அறுவடை நாட்களில் ரூபன் சென்று, வயலில் மாண்ட்ரேக் கனிகளைக்[a] கண்டான். அவற்றைத் தன் தாய் லேயாளிடம் கொண்டுவந்தான். அப்போது ராகேல் லேயாளிடம், “தயவுசெய்து உன் மகனுடைய மாண்ட்ரேக் கனிகளில் சிலவற்றை எனக்குக் கொடு” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காதற்கனிகள்” எனலாம். எபிரெயச் சொல்லான דּוּדָאִים பாரம்பரியமாக மாண்ட்ரேக் எனப்படும் தாவரத்தைக் குறிப்பதாகக் கருதப்படுகிறது; அதைச் சுற்றியுள்ள நிகழ்வில் அது குழந்தைப்பேற்றுடன் தொடர்புபடுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: கோதுமை அறுவடை நாட்களில்
  rationale: கட்டுச் சொற்றொடரின் காலக் குறிப்பையும் எபிரெய மொழிநடையின் ‘நாட்களில்’ என்ற வடிவத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וַיֵּלֶךְ
  choice: சென்று
  rationale: கதையை முன்னெடுத்துச் செல்லும் எளிய வினை; மூலத்தில் இல்லாத ‘வெளியே’ போன்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: דּוּדָאִים
  choice: மாண்ட்ரேக் கனிகள்
  rationale: பாரம்பரியமாக ஏற்றுக்கொள்ளப்பட்ட தாவர அடையாளத்தை நவீன வாசகர்கள் புரிந்துகொள்ளும் ஒலிபெயர்ப்புடன் தருகிறது; துல்லியமான தாவர அடையாளம் உறுதியற்றிருப்பதால் மாற்றுக் கருத்து அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: בַּשָּׂדֶה
  choice: வயலில்
  rationale: சூழலில் שָׂדֶה என்பதற்கான நேரடியான, இயல்பான தமிழ் இணை.
- source_word: וַיָּבֵא אֹתָם אֶל לֵאָה אִמּוֹ
  choice: அவற்றைத் தன் தாய் லேயாளிடம் கொண்டுவந்தான்
  rationale: பன்மைப் பொருளையும் லேயாள் ரூபனின் தாய் என்பதையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: תְּנִי נָא לִי
  choice: தயவுசெய்து ... எனக்குக் கொடு
  rationale: கட்டளையையும் נָא வெளிப்படுத்தும் பணிவான வேண்டுகோளையும் இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: מִדּוּדָאֵי בְּנֵךְ
  choice: உன் மகனுடைய மாண்ட்ரேக் கனிகளில் சிலவற்றை
  rationale: מִן என்பதன் பகுதிப்பொருளை ‘சிலவற்றை’ என்று வெளிப்படுத்தி, ‘உன் மகனுடைய’ என்ற உடைமை உறவையும் தக்கவைக்கிறது.
