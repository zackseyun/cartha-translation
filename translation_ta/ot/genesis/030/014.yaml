translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. அரிதான தாவரப் பெயர் ஒலிபெயர்க்கப்பட்டு, அதன் மாற்றுப் பெயரும் கதைச்சூழல் தொடர்பும் அடிக்குறிப்பில் தரப்பட்டுள்ளன. அடிக்குறிப்பு குறி அது விளக்கும் ‘மாண்ட்ரேக் கனிகள்’ என்பதற்குப் பின்பே வைக்கப்பட்டுள்ளது.
