base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/001.yaml
  text: So Israel set out with all that belonged to him and came to Beersheba[a], and he offered sacrifices to the God of his father Isaac.
translation:
  language: ta
  text: இஸ்ரவேல் தமக்குரிய எல்லாவற்றோடும்[a] புறப்பட்டு, பெயெர்செபாவுக்கு வந்தார்; தம் தந்தை ஈசாக்கின் கடவுளுக்குப் பலிகளைச் செலுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமக்கிருந்த எல்லாவற்றோடும்.” இந்த எபிரெயச் சொற்றொடர் அவரது வீட்டாரையும் உடைமைகளையும் உள்ளடக்கி, அவருக்குரிய அனைத்தையும் விரிவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: புறப்பட்டு
  rationale: נסע என்பது இங்கு முகாமை விட்டுப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது; ‘புறப்பட்டு’ என்பது அந்தப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: மூல எபிரெய உரை ‘யாக்கோபு’ என்பதற்குப் பதிலாக உடன்படிக்கைப் பெயரான ‘இஸ்ரவேல்’ என்பதையே பயன்படுத்துவதால் அது அப்படியே தக்கவைக்கப்பட்டது.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: தமக்குரிய எல்லாவற்றோடும்
  rationale: இந்தச் சொற்றொடர் பொருட்களை மட்டும் அல்லாமல் இஸ்ரவேலின் வீட்டாரையும் அவருக்குரிய உடைமைகளையும் விரிவாகக் குறிக்கக்கூடும். எந்த ஒரு வகையையும் மட்டும் குறிப்பதாகக் கட்டுப்படுத்தாமல் அந்த விரிவை இத்தேர்வு காக்கிறது.
- source_word: וַיָּבֹא
  choice: வந்தார்
  rationale: בוא என்பதன் நேரடியான பொருளை இலக்கைச் சுட்டும் சொற்றொடருடன் இயல்பான தமிழில் தருகிறது.
- source_word: בְּאֵרָה שָּׁבַע
  choice: பெயெர்செபாவுக்கு
  rationale: இடப்பெயருடன் இணைந்துள்ள திசைநோக்குப் பின்னொட்டு தமிழில் ‘-வுக்கு’ என்பதால் வெளிப்படுத்தப்பட்டது.
- source_word: וַיִּזְבַּח זְבָחִים
  choice: பலிகளைச் செலுத்தினார்
  rationale: ஒரே வேரிலிருந்து வரும் வினை–பெயர் அமைப்பைச் சொற்சொல்லாக மீளுரைப்பதைவிட, பலி அர்ப்பணித்த செயலைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: לֵאלֹהֵי
  choice: கடவுளுக்கு
  rationale: לְ இங்கு பலி வழிபாட்டின் பெறுநரைச் சுட்டுவதால் தமிழின் நான்காம் வேற்றுமை உருபு பயன்படுத்தப்பட்டது.
- source_word: אָבִיו יִצְחָק
  choice: தம் தகப்பன் ஈசாக்கின்
  rationale: இந்தக் கட்டமைப்பு ஈசாக்கையே இஸ்ரவேலின் தகப்பனாக அடையாளப்படுத்துகிறது; கூடுதல் விளக்கமின்றி அந்த உறவு நேரடியாகத் தக்கவைக்கப்பட்டது.
theological_decisions:
- issue: கடவுளை ‘தம் தகப்பன் ஈசாக்கின் கடவுள்’ என்று குறிப்பாக அடையாளப்படுத்துதல்
  choice: தம் தகப்பன் ஈசாக்கின் கடவுள்
  alternative: தம் முன்னோர்களின் கடவுள்
  rationale: எபிரெய உரை ஈசாக்கை மட்டும் குறிப்பாகப் பெயரிடுகிறது. இது ஈசாக்குடனான தொடர்ச்சியையும் பெயெர்செபாவுக்கும் அவரது வரலாற்றுக்கும் உள்ள தொடர்பையும் காக்கிறது; ‘முன்னோர்கள்’ என்று பொதுமைப்படுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. முற்றிலும் பொருட்களை மட்டுமே உணர்த்தக்கூடிய ‘உடைமைகள்’ தவிர்க்கப்பட்டு, மூலத்தின் விரிவைத் தக்கவைக்கும் ‘தமக்குரிய எல்லாவற்றோடும்’ தேர்ந்தெடுக்கப்பட்டது. மரியாதைப் பன்மை ஒருமையாகத் தொடர்ந்து பயன்படுத்தப்பட்டுள்ளது.
