    issue: The prefixed conjunction וּ is not represented.
    rationale: The Hebrew begins “וּבְנֵי,” meaning “And the sons of.” While Tamil may sometimes imply list continuation, an explicit connective is a safe and natural way to preserve the source structure in this isolated verse.
