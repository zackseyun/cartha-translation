  terminology: “மகன்கள்” accurately renders בְנֵי in this genealogical context. The Hebrew-based Tamil name forms are suitable. The supplied footnote is misleading in calling “எத்சேர்” a tradition for יֵצֶר; it is better to state only the genuine transliteration alternatives relevant to the names.
  issues:
