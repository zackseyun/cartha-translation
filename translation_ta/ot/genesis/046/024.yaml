  text: 'And the sons of Naphtali: Jahzeel[a], Guni, Jezer, and Shillem.'
translation:
  language: ta
  text: 'மேலும், நப்தலியின் மகன்கள்: யக்செயேல்[a], கூனி, யேசேர், சில்லேம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த எபிரெயப் பெயர் தமிழில் ‘யக்சியேல்’ என்றும் ஒலிபெயர்க்கப்படலாம்; ‘யேசேர்’ என்ற பெயர் ஆங்கில மரபில் ‘ஜெசேர்’ என்றும் வழங்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי נַפְתָּלִי
  choice: நப்தலியின் மகன்கள்
  rationale: בְנֵי என்பது ‘மகன்கள்’ என்ற பொருளுடைய இணைநிலைப் பன்மை வடிவம். வம்சப்பட்டியலுக்கேற்ற இயல்பான தமிழில் உடைமைத் தொடர்பாக மொழிபெயர்க்கப்பட்டது. தொடக்க ו முந்தைய பட்டியலுடன் இணைக்கிறது; தமிழில் தொடர்ச்சியான பட்டியல் அமைப்பே அந்த இணைப்பை இயல்பாக வெளிப்படுத்துவதால் தனியாக ‘மேலும்’ சேர்க்கப்படவில்லை.
- source_word: יַחְצְאֵל
  choice: யக்செயேல்
  rationale: எபிரெயப் பெயரின் மெய்யொலிக் கட்டமைப்பைத் தமிழில் நெருக்கமாகக் காட்டும் ஒலிபெயர்ப்பு; חְצְ என்ற ஒலிக்கூட்டம் ‘க்செ’ என்றும், אֵל என்ற முடிவு ‘யேல்’ என்றும் பிரதிபலிக்கப்படுகிறது.
- source_word: וְגוּנִי
  choice: கூனி
  rationale: גּוּנִי என்ற பெயரின் நீண்ட ū உயிரொலியை ‘கூ’ எனக் காட்டும் நேரடி ஒலிபெயர்ப்பு. இணைப்பிடைச்சொல் பட்டியல் நிறுத்தக்குறிகளால் வெளிப்படுகிறது.
- source_word: וְיֵצֶר
  choice: யேசேர்
  rationale: יֵצֶר என்ற பெயரின் தொடக்க y ஒலியையும் நீண்ட உயிரொலியையும் காக்கும் ஒலிபெயர்ப்பு; צ ஒலிக்கு வாசிக்க எளிய தமிழ் ‘ச’ பயன்படுத்தப்பட்டது.
- source_word: וְשִׁלֵּם
  choice: சில்லேம்
  rationale: שִׁלֵּם என்ற பெயரை ஒலிபெயர்க்கிறது; எபிரெயத்தில் வலியுறுத்தப்பட்ட இரட்டிப்பு மெய்யை ‘ல்ல’ என வெளிப்படுத்துகிறது.
