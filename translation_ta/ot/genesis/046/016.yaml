lexical_decisions:
- source_word: וּבְנֵי גָד
  choice: காதின் மகன்கள்
  rationale: בְנֵי என்பது வம்சப் பட்டியலில் நேரடியாக ‘மகன்கள்’ என்று பொருள்படும். தொடக்க וּ முந்தைய பட்டியலுடன் தொடர்ச்சியைச் சுட்டுகிறது; தமிழில் பட்டியல் அமைப்பே அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צִפְיוֹן
  choice: சிபியோன்
  rationale: இவ்வசனத்தின் எபிரெய மசோரா வடிவமான צִפְיוֹן என்பதன் ஒலியைத் தமிழில் நெருக்கமாகப் பெயர்த்தெழுதுகிறது; எண்ணாகமம் 26:15-இல் காணப்படும் வேறுபட்ட வடிவத்தை முதன்மை உரைக்குள் கொண்டுவரவில்லை.
- source_word: וְחַגִּי
  choice: ஹக்கி
  rationale: חַגִּי என்ற பெயரின் தொடக்க மெய்யொலியையும் இரட்டித்த க் ஒலியையும் தமிழில் இயன்றவரை காட்டும் பெயரெழுத்தாக்கம்.
- source_word: שׁוּנִי
  choice: சூனி
  rationale: எபிரெயப் பெயரின் நீண்ட ū ஒலியைத் தக்கவைக்கும் இயல்பான தமிழ் பெயரெழுத்தாக்கம்.
- source_word: וְאֶצְבֹּן
  choice: எஸ்போன்
  rationale: אֶצְבֹּן என்ற பெயரின் மெய்யெழுத்து மற்றும் உயிரொலி அமைப்பை வாசிக்க எளிய தமிழில் பிரதிபலிக்கிறது.
- source_word: עֵרִי
  choice: ஏரி
  rationale: பெயரின் தொடக்க நீண்ட ē ஒலியைப் பாதுகாக்கும் நேரடியான பெயரெழுத்தாக்கம்.
- source_word: וַאֲרוֹדִי
  choice: அரோதி
  rationale: אֲרוֹדִי என்ற பெயரை அதன் உயிரொலி அமைப்புக்கு நெருக்கமாகத் தமிழில் பெயர்த்தெழுதுகிறது.
- source_word: וְאַרְאֵלִי
  choice: அரேலி
  rationale: אַרְאֵלִי என்ற பெயரின் ஒலியமைப்பைப் பின்பற்றும் நேரடியான தமிழ் பெயரெழுத்தாக்கம்.
