  register: நவீன பொதுத்தமிழில் சுருக்கமான வம்சப் பட்டியல் நடையைப் பயன்படுத்துகிறது. ‘குமாரர்கள்’ என்பதற்குப் பதிலாக இன்றைய வாசகர்களுக்கு இயல்பான, அதேவேளையில் மரியாதையான ‘மகன்கள்’ பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் இவ்வசனத்தின் WLC எபிரெய வடிவங்களை முதன்மையாகக் கொண்டு தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
