  text: 'And the sons of Gad: Ziphion[a], Haggi, Shuni, Ezbon, Eri, Arodi, and Areli.'
translation:
  language: ta
  text: 'காதின் மகன்கள்: சிபியோன்[a], ஹக்கி, சூனி, எஸ்போன், ஏரி, அரோடி, அரேலி.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு எபிரெய உரையில் צִפְיוֹן (சிபியோன்) என்று உள்ளது; எண்ணாகமம் 26:15-இல் காணப்படும் வேறொரு பாரம்பரிய வடிவத்தின் அடிப்படையில் சில மொழிபெயர்ப்புகள் இந்தப் பெயரை ‘செபோன்’ என்று வழங்குகின்றன.
