translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. எபிரெய வசனத்தின் இறுதி விளக்கப்பெயர்ச்சித் தொகுப்பை நீண்ட கோடு மூலம் காத்து, தமிழில் குழப்பமின்றி வாசிக்க ‘வந்தார்கள்’ மீண்டும் சேர்க்கப்பட்டது. அடிக்குறிப்பு குறியீடு அதற்குரிய ‘சந்ததி’ என்பதற்குப் பின்னே வைக்கப்பட்டது.
