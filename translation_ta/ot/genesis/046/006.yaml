base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/006.yaml
  text: They took their livestock and their possessions that they had acquired in the land of Canaan[a], and they came to Egypt—Jacob and all his offspring with him.
translation:
  language: ta
  text: அவர்கள் தங்கள் கால்நடைகளையும், கானான் நாட்டில் தாங்கள் சேர்த்திருந்த உடைமைகளையும் எடுத்துக்கொண்டு, யாக்கோபும் அவருடன் அவருடைய சந்ததியினர்[a] அனைவரும் எகிப்துக்கு வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் ‘விதை’ என்றும் பொருள்படும்; இங்கு அது யாக்கோபின் பிள்ளைகள் அல்லது வழிவந்தோர் அனைவரையும் ஒரு கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: அவர்கள் ... எடுத்துக்கொண்டு
  rationale: לקח என்பதன் இயல்பான பொருள் ‘எடுத்தல்’. தொடர்ந்து பயணம் செய்ததைத் தமிழில் இயல்பாகக் காட்ட ‘எடுத்துக்கொண்டு’ பயன்படுத்தப்பட்டது.
- source_word: מִקְנֵיהֶם
  choice: தங்கள் கால்நடைகளை
  rationale: מִקְנֶה என்பது மந்தைகள் உட்பட வளர்ப்பு விலங்குகளைப் பொதுவாகக் குறிக்கிறது; ‘கால்நடைகள்’ என்பது தெளிவான நவீனத் தமிழ் இணைச்சொல்.
- source_word: רְכוּשָׁם
  choice: உடைமைகளை
  rationale: רְכוּשׁ என்பது ஒருவருக்குச் சொந்தமான பொருட்களையோ செல்வத்தையோ குறிக்கிறது. முன்வரும் கால்நடைகளிலிருந்து வேறுபடுத்தியும், பரந்த பொருளைக் காத்தும் ‘உடைமைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲשֶׁר רָכְשׁוּ
  choice: தாங்கள் சேர்த்திருந்த
  rationale: רכשׁ என்பது சம்பாதித்தல் அல்லது சேர்த்துக்கொள்ளுதல். எகிப்துக்குப் புறப்படுவதற்கு முன்பே கானானில் பெற்றிருந்ததைத் தமிழின் இறந்தகால நிறைவுவடிவம் காட்டுகிறது.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: கானான் நாட்டில்
  rationale: ‘கானான் நாடு’ என்று மொழிபெயர்ப்பது אֶרֶץ என்ற புவியியல் குறிப்பை வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: וַיָּבֹאוּ מִצְרָיְמָה
  choice: எகிப்துக்கு வந்தார்கள்
  rationale: திசையைக் குறிக்கும் ־ָה முடிவுடன் வரும் מִצְרַיִם, எகிப்தை நோக்கிய இயக்கத்தைக் காட்டுகிறது. בוא என்பதற்கு இங்கு ‘வந்தார்கள்’ என்பது நேரடியான உரைநடைத் தேர்வு; ‘நுழைந்தார்கள்’ என்று எல்லை கடத்தலை மிகையாகக் குறிப்பதில்லை.
- source_word: יַעֲקֹב וְכָל זַרְעוֹ אִתּוֹ
  choice: யாக்கோபும் அவரோடு அவருடைய சந்ததி முழுவதும்
  rationale: זֶרַע என்பதன் அடிப்படைப் பொருள் ‘விதை’; மனிதர்களைக் குறிக்கும்போது ஒருவருடைய பிள்ளைகள் அல்லது வழிவந்தோரை ஒரு கூட்டாகக் குறிக்கலாம். ‘சந்ததி முழுவதும்’ அந்தக் கூட்டுப்பொருளையும் மூலத்தின் சுருக்கத்தையும் காக்கிறது.
