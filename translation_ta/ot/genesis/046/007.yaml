translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. “பேரன்கள்”, “பேத்திகள்” ஆகிய இயல்பான உறவுமுறைச் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன; அவை மூல எபிரெயத்தின் தந்தைவழிக் குறிப்பை விரிவுபடுத்தக்கூடும் என்பதால் அந்தத் துல்லியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. மூலத்தில் இருமுறை வரும் אִתּוֹ என்பதற்கிணங்க “தன்னோடு இருந்த” என்றும் “தன்னோடு ... கொண்டுவந்தான்” என்றும் இரு குறிப்புகளும் நிலைநிறுத்தப்பட்டுள்ளன.
