base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/007.yaml
  text: His sons and his grandsons with him[a], his daughters and his granddaughters[b], and all his offspring he brought with him to Egypt.
translation:
  language: ta
  text: தன் மகன்களையும் பேரன்களையும் தன்னுடன், தன் மகள்களையும் பேத்திகளையும்[a], தன் சந்ததியினர் அனைவரையும்[b] தன்னுடன் அழைத்து எகிப்துக்குக் கொண்டுவந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “அவனுடைய மகன்களின் மகன்கள்” என்றும் “அவனுடைய மகன்களின் மகள்கள்” என்றும் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “அவனுடைய வழித்தோன்றல்கள் அனைவரையும்”; சொல்லுக்குச் சொல், “அவனுடைய விதை அனைத்தையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: தன் மகன்களை
  rationale: பின்னர் மகள்கள் தனியாகக் குறிப்பிடப்படுவதால், இங்கு ஆண் பிள்ளைகளைக் குறிக்கும் “மகன்கள்” என்பதே துல்லியமானது.
- source_word: וּבְנֵי בָנָיו
  choice: பேரன்களை
  rationale: சொல்லுக்குச் சொல் “அவனுடைய மகன்களின் மகன்கள்”; இயல்பான நவீனத் தமிழில் “பேரன்கள்” என்று வழங்கி, மூலத்தின் குறிப்பிட்ட வம்ச உறவை அடிக்குறிப்பில் தருகிறது.
- source_word: אִתּוֹ
  choice: தன்னோடு
  rationale: உடனிருப்பதையும் உடன் அழைத்துச் செல்வதையும் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: בְּנֹתָיו
  choice: தன் மகள்களை
  rationale: மகன்களிலிருந்து வேறுபடுத்திக் குறிப்பிடப்படும் பெண் பிள்ளைகளை நேரடியாகக் குறிக்கிறது.
- source_word: וּבְנוֹת בָּנָיו
  choice: பேத்திகளை
  rationale: சொல்லுக்குச் சொல் “அவனுடைய மகன்களின் மகள்கள்”; வாசிக்க இயல்பான “பேத்திகள்” பயன்படுத்தப்பட்டு, மூலத்தின் துல்லியமான உறவு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְכָל זַרְעוֹ
  choice: தன் சந்ததியினர் அனைவரை
  rationale: זֶרַע என்பதன் அடிப்படைப் பொருள் “விதை”; குடும்பத்தாரின் இடம்பெயர்வு என்ற சூழலில் அதன் கூட்டுப் பொருளை “சந்ததியினர் அனைவரும்” தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הֵבִיא
  choice: கொண்டுவந்தான்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் இங்கு ஒருவரைத் தன்னுடன் ஓர் இடத்துக்குக் கொண்டுவரும் காரணவினைப் பொருளைக் கொண்டுள்ளது.
- source_word: מִצְרָיְמָה
  choice: எகிப்துக்கு
  rationale: இலக்கை நோக்கிய இயக்கத்தைக் குறிக்கும் திசை விகுதியை இயல்பான தமிழில் தெரிவிக்கிறது.
