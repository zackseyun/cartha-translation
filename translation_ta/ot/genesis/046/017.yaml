translation_notes:
  register: நவீன பொதுத்தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளன; எபிரெய இணைப்புச் சொற்கள் தமிழில் இயல்பான பட்டியல் குறியீட்டால் வழங்கப்பட்டுள்ளன.
