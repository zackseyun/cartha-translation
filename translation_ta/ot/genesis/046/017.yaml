id: GEN.46.17
reference: Genesis 46:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/בְנֵ֣י אָשֵׁ֗ר יִמְנָ֧ה וְ/יִשְׁוָ֛ה וְ/יִשְׁוִ֥י וּ/בְרִיעָ֖ה וְ/שֶׂ֣רַח אֲחֹתָ֑/ם וּ/בְנֵ֣י בְרִיעָ֔ה חֶ֖בֶר וּ/מַלְכִּיאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/017.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah; and Serah their sister[b]. And the sons of Beriah: Heber and Malchiel.'
translation:
  language: ta
  text: 'ஆசேரின் மகன்கள்: இம்னா[a], இஸ்வா, இஸ்வி, பெரீயா; அவர்களுடைய சகோதரி சேரா[b]. பெரீயாவின் மகன்கள்: ஏபேர், மல்கியேல்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இம்னா என்பதை ‘யிம்னா’ என்றும் ஒலிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சேரா என்பதை எபிரெய இறுதி மெய்யொலியை வெளிப்படுத்தும் வகையில் ‘சேராக்’ என்றும் ஒலிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אָשֵׁר
  choice: ஆசேரின் மகன்கள்
  rationale: בְנֵי என்பது ‘மகன்கள்’ எனப் பொருள்படும் இணைநிலைப் பன்மை வடிவம். வம்சப் பட்டியலுக்கு இயல்பான தலைப்புப் பாணியைத் தருவதற்காகத் தொடக்க வாவ் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: יִמְנָה
  choice: இம்னா
  rationale: எபிரெயப் பெயரின் எளிய தமிழ் ஒலிபெயர்ப்பு; தொடக்க யோத் இங்கு உயிரொலியாக வழங்கப்பட்டுள்ளது.
- source_word: וְיִשְׁוָה
  choice: இஸ்வா
  rationale: பெயர் எபிரெய ஒலிக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; பட்டியல் அமைப்பில் இணைப்பிடைச் சொல் தனியே தேவையில்லை.
- source_word: וְיִשְׁוִי
  choice: இஸ்வி
  rationale: எபிரெயப் பெயரின் நேரடியான தமிழ் ஒலிபெயர்ப்பு.
- source_word: וּבְרִיעָה
  choice: பெரீயா
  rationale: எபிரெயப் பெயர் தமிழின் இயல்பான ஒலியமைப்புக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְשֶׂרַח אֲחֹתָם
  choice: அவர்களுடைய சகோதரி சேரா
  rationale: அֲחֹתָם என்பதன் சொற்பொருள் ‘அவர்களுடைய சகோதரி.’ எபிரெய உரையின் சுருக்கமான இணைநிலை அமைப்பைத் தமிழ் இயல்புக்கு ஏற்ற வரிசையில் வைத்துள்ளது; ‘இருந்தாள்’ போன்ற வினைச்சொல் சேர்க்கப்படவில்லை.
- source_word: וּבְנֵי בְרִיעָה
  choice: பெரீயாவின் மகன்கள்
  rationale: புதிய துணை வம்சப் பட்டியலைத் தெளிவாகத் தொடங்குகிறது. தமிழில் தேவையில்லாத தொடக்க ‘மற்றும்’ விடப்பட்டுள்ளது.
- source_word: חֶבֶר
  choice: ஏபேர்
  rationale: எபிரெயப் பெயரின் பரவலாக அறியத்தக்க தமிழ் வேதாகம ஒலிபெயர்ப்பு; தொடக்க ח ஒலி தமிழில் எளிமைப்படுத்தப்பட்டுள்ளது.
- source_word: וּמַלְכִּיאֵל
  choice: மல்கியேல்
  rationale: எபிரெயப் பெயரின் கூறுகளையும் ஒலியையும் அடையாளப்படுத்தும் தமிழ் ஒலிபெயர்ப்பு; இரு பெயர்களைக் கொண்ட பட்டியலில் காற்புள்ளி இயல்பான இணைப்பை வழங்குகிறது.
