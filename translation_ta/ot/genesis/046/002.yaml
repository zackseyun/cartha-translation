base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/002.yaml
  text: And God spoke to Israel in visions of the night and said[a], “Jacob, Jacob.” And he said[b], “Here I am.”
translation:
  language: ta
  text: கடவுள் இரவின் தரிசனங்களில் இஸ்ரவேலிடம் பேசி, “யாக்கோபே, யாக்கோபே!” என்றார். அதற்கு யாக்கோபு, “இதோ, நான் இருக்கிறேன்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பேசி / என்றார்
  rationale: אמר என்பதன் அடிப்படைப் பொருள் ‘சொல்’ என்பதாகும். எபிரெய உரையில் முதலிரு நிகழ்வுகளிலும் ஒரே வினைச்சொல் வந்தாலும், ‘பேசி ... என்றார்’ என்பது அதன் தொடரமைப்பை இழக்காமல் இயல்பான தமிழை வழங்குகிறது; பதிலுரையில் ‘என்றார்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இச்சூழலில் ஒருமைப் பொருளில் இஸ்ரவேலின் கடவுளையே குறிக்கிறது. ‘கடவுள்’ என்பது நவீன பொதுத்தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְיִשְׂרָאֵל
  choice: இஸ்ரவேலிடம்
  rationale: மூல உரை கதையுரையில் ‘இஸ்ரவேல்’ என்ற பெயரையே பயன்படுத்துகிறது. அடுத்து வரும் அழைப்பில் ‘யாக்கோபு’ என்று மாறுவதைச் சீராக்காமல் அப்படியே காக்கிறது.
- source_word: בְּמַרְאֹת הַלַּיְלָה
  choice: இரவின் தரிசனங்களில்
  rationale: מַרְאוֹת என்பது பன்மையில் ‘தரிசனங்கள்’ எனப் பொருள்படும்; הַלַּיְלָה உடன் உள்ள சார்பு அமைப்பை ‘இரவின் தரிசனங்கள்’ என்று மொழிபெயர்ப்பது பன்மையையும் இரவுச் சூழலையும் காக்கிறது.
- source_word: יַעֲקֹב יַעֲקֹב
  choice: யாக்கோபே, யாக்கோபே
  rationale: பெயரின் இரட்டிப்பு அப்படியே காக்கப்பட்டுள்ளது. நேரடி அழைப்பை இயல்பான தமிழில் காட்ட ‘ஏ’ என்னும் விளிவேற்றுமை சேர்க்கப்பட்டுள்ளது.
- source_word: הִנֵּנִי
  choice: இதோ, நான் இருக்கிறேன்
  rationale: இது ஒருவர் தாம் உடனிருக்கிறதையும் பதிலளிக்கத் தயாராக இருப்பதையும் தெரிவிக்கும் மரபான மறுமொழி. ‘இதோ, நான் இருக்கிறேன்’ என்பது הִנֵּה கூறின் சுட்டுவலிமையையும் பதிலின் ஆயத்தத்தையும் காக்கிறது.
theological_decisions:
- issue: இஸ்ரவேல், யாக்கோபு என்ற பெயர்களின் மாறுபாடு
  choice: கதையுரையில் ‘இஸ்ரவேல்’ என்றும் கடவுளின் நேரடி அழைப்பில் ‘யாக்கோபே’ என்றும் காக்கப்பட்டது
  alternative: ஒற்றுமைக்காக இரு இடங்களிலும் ஒரே பெயரைப் பயன்படுத்துவது
  rationale: எபிரெய உரை இரண்டு பெயர்களையும் திட்டவட்டமாக வேறுபடுத்துகிறது. அதன் இலக்கிய மற்றும் இறையியல் பதற்றத்தை விளக்கிச் சீராக்காமல் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘பேசி ... என்றார்’ என்ற வடிவம் எபிரெய வினைச்சொல் மீளுருவை தமிழில் அளவான இயல்புடன் பிரதிபலிக்கிறது; நேரடி அழைப்பில் தமிழ் விளிவேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
