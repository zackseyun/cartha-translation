  yaml_path: translation/ot/genesis/046/027.yaml
  text: And the sons of Joseph who were born to him in Egypt were two persons[b][a]. All the persons of the house of Jacob who came to Egypt were seventy.
translation:
  language: ta
  text: எகிப்தில் யோசேப்புக்குப் பிறந்த மகன்கள் இரண்டு பேர்.[a] எகிப்துக்கு வந்த யாக்கோபின் வீட்டார் அனைவரும் எழுபது பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘உயிர், இரண்டு’ என்று உள்ளது; இங்கு அந்தச் சொல் குடும்பக் கணக்கில் தனிநபர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יוֹסֵף
  choice: யோசேப்பின் மகன்கள்
  rationale: בֵּן என்பதன் பன்மை இங்கு முன்பு பெயரிடப்பட்ட யோசேப்பின் ஆண் பிள்ளைகளைக் குறிப்பதால், பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக ‘மகன்கள்’ துல்லியமானது.
- source_word: אֲשֶׁר יֻלַּד לוֹ בְמִצְרַיִם
  choice: எகிப்தில் யோசேப்புக்குப் பிறந்த
  rationale: ילד என்பதன் செயலப்பாட்டு வடிவத்தையும் לוֹ என்பதையும் இயல்பான தமிழில் காத்து, பிறப்பு எகிப்தில் நிகழ்ந்ததையும் தெளிவாகக் காட்டுகிறது.
- source_word: נֶפֶשׁ שְׁנָיִם
  choice: இரண்டு பேர்
  rationale: குடும்பக் கணக்கெடுப்புச் சூழலில் נֶפֶשׁ தனிநபர்களைக் குறிக்கும். தமிழின் மனிதர் எண்ணும் ‘பேர்’ என்ற சொல்லே இந்தப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל הַנֶּפֶשׁ לְבֵית יַעֲקֹב
  choice: யாக்கோபின் வீட்டார் அனைவரும்
  rationale: בֵּית יַעֲקֹב என்பதன் குடும்பம்/வீட்டுக்கூட்டம் சார்ந்த கூட்டுப் பொருளை ‘யாக்கோபின் வீட்டார்’ இயல்பாகப் பாதுகாக்கிறது; כָּל הַנֶּפֶשׁ என்பதன் மொத்த நபர் எண்ணிக்கையை ‘அனைவரும்’ தெரிவிக்கிறது.
- source_word: הַבָּאָה מִצְרַיְמָה
  choice: எகிப்துக்கு வந்த
  rationale: திசையைக் குறிக்கும் ־ה முடிவை ‘எகிப்துக்கு’ என்றும், பெயரெச்சப் பங்கேற்பு வடிவத்தை இயல்பான தமிழ் பெயரெச்சமாக ‘வந்த’ என்றும் தருகிறது.
- source_word: שִׁבְעִים
  choice: எழுபது பேர்
  rationale: வினையில்லா எபிரெய எண்ணிக்கை வாக்கியத்தைத் தமிழில் மனிதர்களுக்குரிய எண்ணுப்பெயருடன் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: வம்சாவளிக் கணக்கில் נֶפֶשׁ என்பதன் பொருள்
  choice: பேர்
  alternative: ஆத்துமாக்கள் / உயிர்கள்
  rationale: இங்கு சொல் மனித இயல்பின் உடல்–ஆத்துமா அமைப்பைப் பற்றிய கோட்பாட்டை முன்வைக்காமல், குடும்ப உறுப்பினர்களை எண்ணும் வழக்குச் சொல்லாக உள்ளது. ‘பேர்’ அந்தக் கணக்குப் பொருளைத் துல்லியமாகத் தருகிறது; தேவையற்ற இறையியல் உட்பொருளைச் சேர்க்காது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘வீட்டார்’ என்பது ‘யாக்கோபின் வீடு’ என்ற எபிரெயக் குடும்பக் கூட்டுப் பொருளை இயல்பாகத் தருகிறது. முதல் வாக்கியத்தின் இணைப்புச்சொல் தமிழில் தேவையில்லாததால் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை; வாக்கியத் தொடர்ச்சி பொருளைத் தக்கவைக்கிறது.
