translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தனிப்பெயர்கள் மூல எபிரெய ஒலிகளுக்கு முன்னுரிமை அளித்து எழுத்துப்பெயர்க்கப்பட்டுள்ளன; பரவலாக அறியப்பட்ட மாற்று வடிவம் தேவையான இடத்தில் அடிக்குறிப்பாக வழங்கப்பட்டுள்ளது.
