base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/010.yaml
  text: 'And the sons of Simeon: Jemuel[a], Jamin, Ohad, Jachin, Zohar, and Shaul, the son of the Canaanite woman.'
translation:
  language: ta
  text: 'சிமியோனின் மகன்கள்: யெமுவேல், யாமீன், ஓஹாத், யாகீன், சோஹார், கானானியப் பெண்ணின் மகனான ஷாவூல்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மரபான தமிழ் வடிவம்: ‘சவுல்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: சிமியோனின் மகன்கள்
  rationale: வம்சப் பட்டியலின் அடுத்த பகுதியை அறிமுகப்படுத்தும் இணைப்பும் பன்மை உடைமைத் தொடரும் தமிழில் இயல்பாகவும் தெளிவாகவும் இவ்வாறு தரப்பட்டுள்ளன. வசனத் தொடக்கத்தில் உள்ள וּ־ என்பதைத் தனியே ‘மேலும்’ என்று மொழிபெயர்க்காமல், பட்டியலின் தொடர்ச்சியை நிறுத்தக்குறி மற்றும் அமைப்பு வெளிப்படுத்துகின்றன.
- source_word: יְמוּאֵל
  choice: யெமுவேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் நெருக்கமாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
- source_word: וְיָמִין
  choice: யாமின்
  rationale: எபிரெய தனிப்பெயரான யாமீன் என்பதற்கான இயல்பான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: וְאֹהַד
  choice: ஓகாத்
  rationale: אֹהַד என்ற பெயரின் உயிர் மற்றும் மெய் ஒலிகளைத் தமிழில் நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: וְיָכִין
  choice: யாகின்
  rationale: எபிரெய பெயரின் தொடக்க y ஒலியையும் நடுவிலுள்ள மெல்லண்ண ஒலியையும் தமிழில் இயன்றவரை காக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: וְצֹחַר
  choice: சோகார்
  rationale: צֹחַר என்ற பெயருக்கு வாசிக்க எளிதான தமிழ் எழுத்துப்பெயர்ப்பு; எபிரெய ஒலிகளைத் தமிழில் முழுமையாக வேறுபடுத்த இயலாததால் நெருங்கிய வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְשָׁאוּל
  choice: ஷாவூல்
  rationale: שָׁאוּל என்ற எபிரெய வடிவத்தின் ‘ஷா-ஊல்’ ஒலியை வெளிப்படையாகக் காக்கிறது; மரபான தமிழ் வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בֶּן הַכְּנַעֲנִית
  choice: கானானியப் பெண்ணின் மகனான
  rationale: பெண்பால் ஒருமை இனப்பெயரை ‘கானானியப் பெண்’ என்று தெளிவுபடுத்தி, ஷாவூலை விவரிக்கும் உறவை இயல்பான தமிழில் இணைக்கிறது.
