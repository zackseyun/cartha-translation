lexical_decisions:
- source_word: וּ/בְנֵי
  choice: மகன்கள்
  rationale: בְנֵי என்பது ‘மகன்’ என்பதன் பன்மை இணைப்புநிலை வடிவம்; வம்சப்பட்டியல் சூழலில் ‘மகன்கள்’ என்று மொழிபெயர்ப்பது மூலத்தின் இலக்கண வடிவத்தைப் பேணுகிறது. தொடக்க ו பட்டியலின் தொடர்ச்சியைக் குறித்தாலும், இயல்பான தமிழில் தனி வசனமாக ‘மேலும்’ சேர்ப்பது தேவையற்றதால் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
- source_word: דָן
  choice: தாண்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பைத் தமிழில் மரபான வேதாகமப் பெயர்வடிவத்துக்கு நெருக்கமாக எழுத்துப்பெயர்த்தல்.
- source_word: חֻשִׁים
  choice: ஊசீம்
  rationale: இது வடிவத்தில் பன்மைபோல் தோன்றினாலும், இச்சூழலில் ஒரு தனிப்பெயராகச் செயல்படுகிறது. மூலத்தின் சுருக்கமான, வினையற்ற நடையை விரிவாக்காமல் பெயராகவே தரப்பட்டுள்ளது.
