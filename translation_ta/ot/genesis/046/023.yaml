translation:
  language: ta
  text: 'தாணின் மகன்கள்: ஊசீம்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழிநடை மிகவும் சுருக்கமானது; சொற்சொல்லாக, “தாணின் மகன்கள்: ஊசீம்.” ‘மகன்கள்’ என்பது பன்மையில் இருந்தாலும், ஊசீம் என்பது ஒரு தனிப்பெயர்.'
