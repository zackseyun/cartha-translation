translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப்பட்டியலுக்குரிய சுருக்கமானவும் கண்ணியமானவும் உள்ள நடையைப் பேணுகிறது. எபிரெய மூலத்தில் உள்ள பன்மை ‘மகன்கள்’ என்பதற்கும் ஒரே தனிப்பெயருக்கும் இடையிலான இயல்பான பதற்றம் அடிக்குறிப்புடன் அப்படியே வைக்கப்பட்டுள்ளது.
