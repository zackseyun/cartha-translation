  source_fidelity: The temporal, future-contingency sense of וְהָיָה כִּי is retained by “...போது,” and “பார்வோன் உங்களை அழைத்து” adequately represents יִקְרָא לָכֶם. However, וְאָמַר is ‘and says/will say,’ not specifically ‘asks.’ Since the Hebrew deliberately uses the more general verb ‘say,’ the Tamil should retain that wording even though a question follows.
  naturalness: The revised wording is natural modern standard Tamil and appropriately leaves the verse open-ended with a final comma, since it introduces the condition completed in the following verse.
  terminology: “பார்வோன்” is the standard Tamil form. “தொழில்” communicates the contextual sense of מַעֲשֵׂיכֶם; a footnote supplies the viable broader alternative ‘வேலை.’
