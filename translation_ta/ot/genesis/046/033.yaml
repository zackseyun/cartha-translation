  text: וְ/הָיָ֕ה כִּֽי יִקְרָ֥א לָ/כֶ֖ם פַּרְעֹ֑ה וְ/אָמַ֖ר מַה מַּעֲשֵׂי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/033.yaml
  text: And when Pharaoh calls you and says[a], ‘What is your occupation?’
translation:
  language: ta
  text: பார்வோன் உங்களை அழைத்து, ‘உங்கள் தொழில் என்ன?’ என்று சொல்லும்போது,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: …போது
  rationale: இந்த எபிரெயச் சொற்றொடர் எதிர்காலத்தில் நிகழவிருக்கும் சூழலைக் காலப்பொருளில் அறிமுகப்படுத்துகிறது. தமிழில் இயல்பாகவும் அதன் காலப்பொருளைக் காக்கவும் ‘…போது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יִקְרָא לָכֶם
  choice: உங்களை அழைத்து
  rationale: קרא என்பதுடன் ל சேர்ந்த இவ்வமைப்பு ‘அழைத்தல்’ அல்லது ‘வரவழைத்தல்’ எனப் பொருள்படலாம். அரசவையின் சூழலை மிகைப்படுத்தாமல் ‘உங்களை அழைத்து’ என்பது இயல்பாக உள்ளது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரசருக்கான பட்டத்தின் வழக்கமான தமிழ் வடிவம்.
- source_word: וְאָמַר
  choice: என்று கேட்கும்போது
  rationale: சொல்லாட்சிப்படி ‘சொன்னால்/சொல்லும்போது’ என்றாலும், தொடர்ந்து வருவது நேரடியான கேள்வி. நவீன தமிழில் ‘என்று கேட்கும்போது’ என்பது உரையாடலின் செயல்பாட்டை இயல்பாகத் தெரிவிக்கிறது.
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: உங்கள் தொழில் என்ன?
  rationale: מַעֲשֵׂיכֶם என்பதன் அடிப்படைப் பொருள் ‘உங்கள் வேலை/செயல்’; இச்சூழலில் வாழ்வாதாரத் தொழிலைப் பற்றிய கேள்வி என்பதால் ‘உங்கள் தொழில் என்ன?’ என்பது தெளிவான, இயல்பான தமிழ்.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. இவ்வசனம் அடுத்த வசனத்தில் நிறைவடையும் நிபந்தனை/காலச் சூழலின் தொடக்கம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
