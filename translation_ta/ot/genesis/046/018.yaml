base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/018.yaml
  text: 'These are the sons of Zilpah[a], whom Laban gave to Leah his daughter, and she bore these to Jacob: sixteen persons.'
translation:
  language: ta
  text: லாபான் தன் மகள் லேயாளுக்குக் கொடுத்த சில்பாளின் மகன்கள் இவர்களே. இவர்களை அவள் யாக்கோபுக்குப் பெற்றெடுத்தாள்; மொத்தம் பதினாறு பேர்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பதினாறு உயிர்கள்.” இங்கு எபிரேய மொழியில் உள்ள நெஃபெஷ் என்ற சொல் நபர்களை எண்ணுவதற்குப் பயன்படுத்தப்படும் மரபுத்தொடராகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי זִלְפָּה
  choice: சில்பாளின் மகன்கள் இவர்களே
  rationale: எபிரேயப் பட்டியல் நடையை இயல்பான தமிழில் தக்கவைக்கிறது. בְּנֵי என்பதன் நேரடியான பாலினக் குறிப்பை ‘மகன்கள்’ பாதுகாக்கிறது; இச்சூழலில் அது அவர்களின் வழிவந்த குடும்பக் குழுவையும் உள்ளடக்குகிறது.
- source_word: אֲשֶׁר נָתַן לָבָן לְלֵאָה בִתּוֹ
  choice: லாபான் தன் மகள் லேயாளுக்குக் கொடுத்த
  rationale: தொடர்புச் சொற்றொடர் சில்பாளையே குறிப்பது தமிழிலும் தெளிவாக இருக்கும்படி பெயருக்கு முன் அமைக்கப்பட்டுள்ளது; மூலத்தின் குடும்ப உறவும் செயலும் விரிவாக்கமின்றி பாதுகாக்கப்படுகின்றன.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: இவர்களை அவள் யாக்கோபுக்குப் பெற்றெடுத்தாள்
  rationale: ילד என்பதன் வம்சவரலாற்றுப் பொருளை ‘பெற்றெடுத்தாள்’ இயல்பாகத் தருகிறது; לְיַעֲקֹב என்பதையும் ‘யாக்கோபுக்கு’ என்று நேரடியாகக் காட்டுகிறது.
- source_word: שֵׁשׁ עֶשְׂרֵה נָפֶשׁ
  choice: மொத்தம் பதினாறு பேர்
  rationale: நபர்களை எண்ணும் சூழலில் נֶפֶשׁ என்பது ‘ஆத்துமாக்கள்’ என்ற உடலற்ற கூறை வலியுறுத்தாமல் ‘பேர்’ என்று பொருள்படும். ‘மொத்தம்’ பட்டியலின் தொகையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
