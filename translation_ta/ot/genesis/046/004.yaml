source:
  edition: WLC
  text: אָנֹכִ֗י אֵרֵ֤ד עִמְּ/ךָ֙ מִצְרַ֔יְמָ/ה וְ/אָנֹכִ֖י אַֽעַלְ/ךָ֣ גַם עָלֹ֑ה וְ/יוֹסֵ֕ף יָשִׁ֥ית יָד֖/וֹ עַל עֵינֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/004.yaml
  text: I myself will go down with you to Egypt[a], and I myself will also surely bring you up; and Joseph will place his hand on your eyes.
translation:
  language: ta
  text: நானே உன்னுடன் எகிப்துக்கு இறங்கிச் செல்வேன்; மேலும், நானே உன்னை நிச்சயமாக மேலே கொண்டுவருவேன். யோசேப்பு தன் கையை உன் கண்கள்மேல் வைப்பான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை வழக்குப் பொருளில், “யோசேப்பு உன் கண்களை மூடுவான்” என்றும் சொல்லலாம்; யாக்கோபு இறக்கும்போது யோசேப்பு அருகில் இருப்பதை இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: நானே
  rationale: தனித்த சுட்டுப்பெயர் இருமுறை வெளிப்படையாக வந்து வலியுறுத்துவதால், ‘நானே’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: אֵרֵד
  choice: இறங்கிச் செல்வேன்
  rationale: ירד என்பதன் திசை சார்ந்த ‘கீழே செல்/இறங்கு’ என்ற பொருளையும், எகிப்துக்குச் செல்லும் பயணத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: עִמְּךָ
  choice: உன்னுடன்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமையைக் குறிக்கும் உடனிகழ்ச்சிப் பொருள் நேரடியாகத் தரப்பட்டுள்ளது.
- source_word: מִצְרַיְמָה
  choice: எகிப்துக்கு
  rationale: திசையைக் குறிக்கும் இறுதி ה, எகிப்தை நோக்கிய இயக்கத்தைக் காட்டுகிறது; தமிழில் ‘எகிப்துக்கு’ என்பது இயல்பான வடிவம்.
- source_word: אַעַלְךָ
  choice: உன்னை ... மேலே கொண்டுவருவேன்
  rationale: עלה என்பதன் ஹிஃபில் வடிவத்திலுள்ள காரணவினைப் பொருளையும் மேல்நோக்கிய திசையையும் காக்கிறது.
- source_word: גַם עָלֹה
  choice: மேலும் ... நிச்சயமாக
  rationale: גַם என்பதன் கூட்டுப் பொருளை ‘மேலும்’ என்றும், வினையெச்ச முழுவடிவம் தரும் வலியுறுத்தலை ‘நிச்சயமாக’ என்றும் வெளிப்படுத்துகிறது.
- source_word: וְיוֹסֵף
  choice: யோசேப்பு
  rationale: எபிரெயப் பெயரின் தமிழில் நிலைபெற்ற வேதாகம வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: יָשִׁית יָדוֹ עַל עֵינֶיךָ
  choice: தன் கையை உன் கண்கள்மேல் வைப்பான்
  rationale: மரணத்தின்போது கண்களை மூடும் செயலைக் குறிக்கும் எபிரெய உருவகத்தின் நேரடியான படிமம் முதன்மை உரையில் காக்கப்பட்டுள்ளது; அதன் வழக்குப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: எகிப்திலிருந்து ‘மேலே கொண்டுவருவேன்’ என்ற வாக்குறுதியின் குறிப்பு
  choice: இந்த வாக்குறுதி யாக்கோபை நோக்கி நேரடியாகச் சொல்லப்பட்டுள்ள பரந்த சொற்களிலேயே வைக்கப்பட்டுள்ளது.
  alternative: இது யாக்கோபு உயிரோடு திரும்புவதையோ, அவரது உடல் கானானில் அடக்கம் செய்யப்படுவதற்காகக் கொண்டுவரப்படுவதையோ, அவரது சந்ததியினர் யாத்திராகமத்தில் வெளியே கொண்டுவரப்படுவதையோ மட்டும் குறிப்பதாகத் தெளிவுபடுத்துதல்.
  rationale: எபிரெய வாசகம் சுருக்கமானது; பல அடுக்குகளிலான நிறைவேற்றத்தைத் தாங்கக்கூடும். ஆகவே ஒரு விளக்கத்தை மட்டும் திணிக்காமல் அதன் இறையியல் இழுவிசையும் உண்மையான தெளிவின்மையும் காக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘இறங்கிச் செல்வேன்/மேலே கொண்டுவருவேன்’ என்ற திசை இணைப்பு காக்கப்பட்டு, இருமுறை வரும் אָנֹכִי ‘நானே’ என வலியுறுத்தப்பட்டுள்ளது. அடிக்குறி அது விளக்கும் சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
