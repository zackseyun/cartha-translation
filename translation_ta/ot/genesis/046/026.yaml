source:
  edition: WLC
  text: כָּל הַ֠/נֶּפֶשׁ הַ/בָּאָ֨ה לְ/יַעֲקֹ֤ב מִצְרַ֨יְמָ/ה֙ יֹצְאֵ֣י יְרֵכ֔/וֹ מִ/לְּ/בַ֖ד נְשֵׁ֣י בְנֵי יַעֲקֹ֑ב כָּל נֶ֖פֶשׁ שִׁשִּׁ֥ים וָ/שֵֽׁשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/026.yaml
  text: All the persons belonging to Jacob who came to Egypt[a], who came from his loins, besides the wives of Jacob’s sons[b], were sixty-six persons in all.
translation:
  language: ta
  text: யாக்கோபைச் சேர்ந்தவர்களாக எகிப்துக்கு வந்த, யாக்கோபின் சந்ததியினரான அனைவரும்—யாக்கோபின் மகன்களின் மனைவிகளைத் தவிர—மொத்தம் அறுபத்தாறு பேர்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “அவனுடைய தொடையிலிருந்து புறப்பட்டவர்கள்”; இது அவனுடைய உயிரியல் வழித்தோன்றல்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “மொத்தம் அறுபத்தாறு உயிர்கள்.” இங்கு “உயிர்” என்பது நபர்களை எண்ணிக் குறிப்பிடும் எபிரெய வழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַנֶּפֶשׁ
  choice: அனைவரிலும்
  rationale: נֶפֶשׁ இங்கு வம்சப்பட்டியலில் மனிதர்களை எண்ணும் சொல்லாக வருகிறது. எனவே தமிழில் இயல்பான ‘அனைவர்’ என்பது பொருத்தமானது.
- source_word: הַבָּאָה לְיַעֲקֹב מִצְרַיְמָה
  choice: யாக்கோபைச் சேர்ந்தவர்களாக எகிப்துக்கு வந்த
  rationale: לְיַעֲקֹב என்பதை வெறுமனே ‘யாக்கோபோடு’ என்று மாற்றாமல், இங்கு குறிக்கப்படும் அவருக்குரிய குடும்பக் குழுவைத் தெளிவுபடுத்துகிறது; அதேவேளையில் எகிப்துக்கு வந்த செயலும் நிலைத்திருக்கிறது.
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: அவனுடைய உடல்வழி வந்தவர்கள்
  rationale: ‘அவனுடைய தொடையிலிருந்து புறப்பட்டவர்கள்’ என்ற எபிரெய உருவகம் உயிரியல் வழித்தோன்றல்களைக் குறிக்கிறது. ‘உடல்வழி வந்தவர்கள்’ என்பது அந்த உடல்சார்ந்த உறவை இயல்பான நவீன தமிழில் தருகிறது; சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִלְּבַד
  choice: தவிர
  rationale: அறுபத்தாறு என்ற எண்ணிக்கையில் சேர்க்கப்படாத குழுவைத் தெளிவாகக் குறிக்கிறது.
- source_word: נְשֵׁי בְנֵי יַעֲקֹב
  choice: யாக்கோபின் மகன்களுடைய மனைவிகள்
  rationale: உறவுமுறையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כָּל נֶפֶשׁ שִׁשִּׁים וָשֵׁשׁ
  choice: மொத்தம் அறுபத்தாறு பேர்
  rationale: எபிரெயத்தின் மொத்த எண்ணிக்கையை இயல்பான தமிழ் எண்ணிக்கை நடையில் தருகிறது; נֶפֶשׁ என்பதன் நபர்களைக் குறிக்கும் பயன்பாடு ‘பேர்’ என்பதில் வெளிப்படுகிறது.
