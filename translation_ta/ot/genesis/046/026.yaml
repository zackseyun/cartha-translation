revisions:
- from: யாக்கோபைச் சேர்ந்தவர்களாக எகிப்துக்கு வந்த அனைவரிலும், யாக்கோபின் மகன்களுடைய மனைவிகளைத் தவிர, அவனுடைய உடல்வழி வந்தவர்கள்[a] மொத்தம் அறுபத்தாறு பேர்[b].
  to: யாக்கோபைச் சேர்ந்தவர்களாக எகிப்துக்கு வந்த, யாக்கோபின் சந்ததியினரான அனைவரும்—யாக்கோபின் மகன்களின் மனைவிகளைத் தவிர—மொத்தம் அறுபத்தாறு பேர்[a][b].
  rationale: The revision replaces the misleading partitive “அனைவரிலும்” with the universal subject “அனைவரும்.” It also uses “யாக்கோபின் சந்ததியினரான” for an explicit and natural antecedent, while the footnote retains the Hebrew bodily idiom. Footnote a is anchored at the genealogical rendering; footnote b remains anchored at the numerical total.
