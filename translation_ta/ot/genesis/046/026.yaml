translation_notes:
  register: நவீன, தரமான, வாசிக்க எளிய தமிழில் அமைக்கப்பட்டுள்ளது. ‘உடல்வழி வந்தவர்கள்’ என்பது உயிரியல் வழித்தோன்றல்களைத் தெளிவுபடுத்துகிறது; மூலத்தின் ‘தொடை’ உருவகம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது. வாக்கிய அமைப்பு அறுபத்தாறு என்ற எண்ணிக்கையில் மகன்களின் மனைவிகள் சேர்க்கப்படவில்லை என்பதைத் தெளிவாகக் காட்டுகிறது.
