  yaml_path: translation/ot/genesis/046/008.yaml
  text: 'These are the names of the sons of Israel who came to Egypt: Jacob and his sons[b][a]. Jacob’s firstborn was Reuben.'
translation:
  language: ta
  text: எகிப்துக்கு வந்த இஸ்ரவேலின் மகன்களின் பெயர்கள் இவை—யாக்கோபும் அவரது மகன்களும். யாக்கோபின் முதற்பேறானவன் ரூபன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவை
  rationale: வம்சப்பட்டியலின் புதிய பகுதியை அறிமுகப்படுத்தும் எபிரெய இணைப்புச்சொல்லைத் தமிழில் தேவையற்ற ‘இப்போது’ என்பதின்றி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁמוֹת
  choice: பெயர்கள்
  rationale: பின்வரும் பெயர்ப்பட்டியலை அறிமுகப்படுத்தும் பன்மை வடிவத்தின் நேரான பொருள்.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: இங்கு பெயரிடப்படுவது ஆண் பிள்ளைகள் என்பதால், பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக பாலினத்தைக் குறிப்பாகக் காட்டும் ‘மகன்கள்’ பயன்படுத்தப்பட்டுள்ளது; ‘இஸ்ரவேல்’ என்ற பெயரும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: הַבָּאִים מִצְרַיְמָה
  choice: எகிப்துக்கு வந்த
  rationale: பெயரெச்சப் பயன்பாட்டிலுள்ள participle-ஐப் பின்னோக்கிப் பட்டியலிடும் சூழலுக்கு ஏற்ற இறந்தகாலத் தமிழில் தருகிறது; திசையைக் குறிக்கும் இறுதியை ‘எகிப்துக்கு’ வெளிப்படுத்துகிறது.
- source_word: יַעֲקֹב וּבָנָיו
  choice: யாக்கோபும் அவரது மகன்களும்
  rationale: முன்னுள்ள குழுவை விளக்கும் இணைப்புச் சொற்றொடராகத் தக்கவைக்கப்பட்டு, கோடு மற்றும் முக்காற்புள்ளியால் அடுத்த பெயர்ப்பட்டியலோடு இணைக்கப்பட்டுள்ளது.
- source_word: בְּכֹר יַעֲקֹב
  choice: யாக்கோபின் முதற்பேறானவன்
  rationale: பிறப்பு வரிசையைக் குறிக்கும் construct சொற்றொடரின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רְאוּבֵן
  choice: ரூபன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர்வடிவம்.
theological_decisions:
- issue: ‘இஸ்ரவேலின் மகன்கள்’ என்பதற்குப் பின் ‘யாக்கோபும் அவரது மகன்களும்’ வருவதால் தோன்றும் இலக்கணத் தளர்வு
  choice: எபிரெய உரையின் விளக்கச் சேர்க்கையை மறுவிளக்கம் செய்யாமல் தக்கவைத்தல்
  alternative: ‘இஸ்ரவேலின் குடும்பத்தார்’ அல்லது ‘யாக்கோபின் குடும்பம்’ என்று பொருளைச் சீராக்குதல்
  rationale: மூலத்தில் உள்ள ‘மகன்கள்’ என்ற குறிப்பையும், யாக்கோபும் அவரது மகன்களும் என்ற அடுத்த சொற்றொடரின் இயல்பான பதற்றத்தையும் அமைதியாகத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வம்சப்பட்டியலுக்குரிய கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. ‘இப்போது’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத காலக் குறியீடு சேர்க்கப்படவில்லை.
