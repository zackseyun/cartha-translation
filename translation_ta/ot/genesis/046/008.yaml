  naturalness: '‘இவை—யாக்கோபும் அவரது மகன்களும்: யாக்கோபின்...’ என்ற நிறுத்தக்குறி அமைப்பு நவீன தமிழில் இயல்பாக இல்லை. கோட்டுக்குப் பின் முழு நிறுத்தம் இடுவது விளக்கச் சேர்க்கையையும் அடுத்த வம்சப்பட்டியல் கூற்றையும் தெளிவாகப் பிரிக்கிறது.'
