  text: וַ/יֹּ֕אמֶר אָנֹכִ֥י הָ/אֵ֖ל אֱלֹהֵ֣י אָבִ֑י/ךָ אַל תִּירָא֙ מֵ/רְדָ֣ה מִצְרַ֔יְמָ/ה כִּֽי לְ/ג֥וֹי גָּד֖וֹל אֲשִֽׂימְ/ךָ֥ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/003.yaml
  text: And he said[a], “I am God, the God of your father. Do not be afraid to go down to Egypt, for there I will make you into a great nation.”
translation:
  language: ta
  text: 'அவர் சொன்னார்: “நானே கடவுள், உன் தந்தையின் கடவுள். எகிப்துக்கு இறங்கிப் போக அஞ்சாதே; ஏனெனில் அங்கே நான் உன்னை ஒரு பெரிய இனமாக ஆக்குவேன்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵל
  choice: இறைவன்
  rationale: குறிப்புச் சுட்டுடன் வரும் இச்சொல், பேசுகிறவர் தம்மையே வலியுறுத்தி இறைவனாக அடையாளப்படுத்துவதைக் காட்டுகிறது. நவீனத் தமிழில் “நானே இறைவன்” இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: உன் தந்தையின் கடவுள்
  rationale: எபிரேயக் கட்டமைப்பையும் ஒருமையிலுள்ள “உன் தந்தை” என்பதையும் நேரடியாகப் பாதுகாக்கிறது; இதை “உன் மூதாதையரின் கடவுள்” என்று விரிவாக்கவில்லை.
- source_word: אַל תִּירָא מֵרְדָה
  choice: போக அஞ்சாதே
  rationale: ירא உடன் מִן சேர்க்கப்பட்ட வினையெச்சம் ஒரு செயலைச் செய்ய அஞ்சுவதைக் குறிக்கிறது. தமிழில் “போக அஞ்சாதே” இதை இயல்பாக எடுத்துரைக்கிறது.
- source_word: מִצְרַיְמָה
  choice: எகிப்துக்கு
  rationale: திசையைக் குறிக்கும் இறுதி விகுதி எகிப்தை நோக்கிய நகர்வைக் காட்டுகிறது; தமிழின் “-க்கு” இலக்கைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: לְגוֹי גָּדוֹל אֲשִׂימְךָ
  choice: உன்னை ஒரு பெரிய இனமாக ஆக்குவேன்
  rationale: שׂים + לְ கட்டமைப்பு விளைவு அல்லது மாற்றத்தைக் குறிக்கிறது. “ஆக்குவேன்” யாக்கோபின் வழியாக ஒரு பெரிய இனம் உருவாகும் வாக்குறுதியைத் தெளிவாகக் காட்டுகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: இந்த இடவினையடை முந்தையதாகக் குறிப்பிடப்பட்ட எகிப்தையே நிறைவேற்றத்தின் இடமாகச் சுட்டுகிறது.
theological_decisions:
- issue: இறைத் தன்னடையாளத்தில் வரும் மூதாதைச் சுட்டு
  choice: உன் தந்தையின் கடவுள்
  alternative: உன் மூதாதையரின் கடவுள்
  rationale: மூலத்தில் אָבִיךָ ஒருமையில் உள்ளது. உடனடியான தந்தை/உடன்படிக்கைத் தொடர்பைப் பாதுகாக்க ஒருமை அப்படியே வைக்கப்படுகிறது; பன்மையாக விளக்கி விரிவாக்கப்படவில்லை.
- issue: “பெரிய இனம்” உருவாகும் இடம்
  choice: அங்கே நான் உன்னை ஒரு பெரிய இனமாக ஆக்குவேன்
  alternative: நான் உன்னை ஒரு பெரிய இனமாக ஆக்குவதற்காக அங்கே கொண்டு செல்வேன்
  rationale: שָׁם என்பது எகிப்தை நிறைவேற்றத்தின் இடமாகக் குறிக்கிறது. மூலத்தில் இல்லாத “கொண்டு செல்வேன்” என்ற கருத்தைச் சேர்க்காமல் வாக்குறுதியின் சுருக்கமும் வலிமையும் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; நேரடியான இறை உரைக்கு ஏற்ற கண்ணியமான, எளிதில் புரியும் நடை. “இறைவன்” மற்றும் “கடவுள்” ஆகியவை ஒரே வசனத்தில் மூலத்தின் הָאֵל / אֱלֹהֵי வேறுபாட்டை ஓரளவு பிரதிபலிக்கப் பயன்படுத்தப்பட்டுள்ளன. “இறங்கிப் போக” என்பது எபிரேயப் புவியியல் சொற்பயன்பாட்டை நெருக்கமாகப் பிரதிபலித்தாலும், இயல்பான தமிழுக்காக “போக” தேர்ந்தெடுக்கப்பட்டது. இவ்வசனத்திற்குத் தமிழில் அவசியமான அடிக்குறிப்பு இல்லை.
