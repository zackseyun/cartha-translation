revisions:
- from: 'அவர் சொன்னார்: “நானே இறைவன், உன் தந்தையின் கடவுள். எகிப்துக்குப் போக அஞ்சாதே; ஏனெனில் அங்கே நான் உன்னை ஒரு பெரிய இனமாக ஆக்குவேன்.”'
  to: 'அவர் சொன்னார்: “நானே கடவுள், உன் தந்தையின் கடவுள். எகிப்துக்கு இறங்கிப் போக அஞ்சாதே; ஏனெனில் அங்கே நான் உன்னை ஒரு பெரிய இனமாக ஆக்குவேன்.”'
  rationale: The revision restores the explicit “go down” wording of the Hebrew while retaining the destination, singular ancestral reference, and resultative promise. It also uses consistent modern Tamil terminology for the speaker’s self-identification. No footnote is necessary, since “இறங்கிப் போக” communicates the source idiom directly and naturally.
  reviewer_model: gpt-5.6-terra
