source:
  edition: WLC
  text: וַ/יִּוָּלֵ֣ד לְ/יוֹסֵף֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ אֲשֶׁ֤ר יָֽלְדָה לּ/וֹ֙ אָֽסְנַ֔ת בַּת פּ֥וֹטִי פֶ֖רַע כֹּהֵ֣ן אֹ֑ן אֶת מְנַשֶּׁ֖ה וְ/אֶת אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/020.yaml
  text: To Joseph were born in the land of Egypt Manasseh and Ephraim[a], whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: ta
  text: யோசேப்புக்கு எகிப்து நாட்டில் மனாசேயும் எப்பிராயீமும் பிறந்தார்கள். அவர்களை ஓன்[a] நகரின் பூசாரியான போத்திபெராவின் மகள் ஆஸ்நாத் அவனுக்குப் பெற்றெடுத்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஓன் என்பது பிற்காலத்தில் கிரேக்க மொழியில் ஹெலியோபொலிஸ் என்று அழைக்கப்பட்ட எகிப்திய நகரம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּוָּלֵד לְיוֹסֵף
  choice: யோசேப்புக்கு ... பிறந்தார்கள்
  rationale: יַלד என்பதன் நிஃபால் வடிவம் பிறப்பைச் செயப்பாட்டு நிலையில் குறிக்கிறது. வினை எபிரெயத்தில் ஒருமையாக இருந்தாலும், தொடர்ந்து வரும் இரண்டு மகன்களையும் குறிக்கும் என்பதால் இயல்பான தமிழில் பன்மை வினை பயன்படுத்தப்பட்டது.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டில்
  rationale: אֶרֶץ என்பதையும் வெளிப்படையாகக் காத்து, நவீன தமிழில் இயல்பாக இடத்தைக் குறிக்கிறது.
- source_word: אֲשֶׁר יָלְדָה לּוֹ
  choice: அவர்களை ... அவனுக்குப் பெற்றெடுத்தாள்
  rationale: உறவுப்பெயரெச்சத் தொடர் இரு மகன்களையும் குறிக்கிறது; தாயின் பெற்றெடுக்கும் செயலும் לּוֹ குறிக்கும் யோசேப்புடனான உறவும் காக்கப்பட்டன.
- source_word: אָסְנַת
  choice: ஆஸ்நாத்
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: போத்திபெராவின் மகள்
  rationale: ஆஸ்நாத்தின் தந்தையை அடையாளப்படுத்தும் எபிரெய இணைப்புத் தொடரை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: כֹּהֵן אֹן
  choice: ஓன் நகரின் பூசாரி
  rationale: כֹּהֵן என்பது இங்கு எகிப்திய சமயப் பணியாளரைக் குறிக்கிறது; 'பூசாரி' இயல்பான தமிழ். ஓன் இடப்பெயராகப் பாதுகாக்கப்பட்டு, தெளிவுக்காக 'நகர்' சேர்க்கப்பட்டது.
- source_word: אֶת מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: மனாசேயும் எப்பிராயீமும்
  rationale: நேரடிச் செயப்படுபொருள் குறிகள் தமிழில் தனியே மொழிபெயர்க்கப்படவில்லை; இரு பெயர்களும் வழக்கமான தமிழ் வேதாகம எழுத்துப்பெயர்ப்பில் தரப்பட்டன.
