translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையைப் பயன்படுத்துகிறது. நீண்ட எபிரெய வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; உறவுப்பெயரெச்சத்தின் தொடர்பு 'அவர்களை' என்பதால் தெளிவாகக் காக்கப்பட்டது.
