translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், கண்ணியமான வம்சப்பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரண்டு உட்பிரிவுகளும் தனித்தனி வாக்கியங்களாக வழங்கப்பட்டு தெளிவு மேம்படுத்தப்பட்டுள்ளது; ‘உயிர்’ என்ற நேரடி வடிவம் தவறாகப் புரியாதபடி முதன்மை உரையில் ‘பேர்’ என்றும், மூலச் சொல்லமைப்பு அடிக்குறிப்பிலும் தரப்பட்டுள்ளது.
