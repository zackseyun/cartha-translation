base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/025.yaml
  text: 'These are the sons of Bilhah[a], whom Laban gave to Rachel his daughter, and she bore these to Jacob: seven persons in all.'
translation:
  language: ta
  text: லாபான் தன் மகள் ராகேலுக்குக் கொடுத்த பில்காளின் மகன்கள் இவர்களே. அவள் இவர்களை யாக்கோபுக்குப் பெற்றெடுத்தாள்; மொத்தம் ஏழு பேர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “மொத்த உயிர்கள்—ஏழு” என்று உள்ளது; இது மொத்தம் ஏழு நபர்கள் என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי בִלְהָה
  choice: பில்காளின் மகன்கள் இவர்களே
  rationale: அடையாளப்படுத்தும் பன்மைச் சுட்டையும், வம்சப்பட்டியலில் ஆண் பிள்ளைகளைக் குறிக்கும் בְּנֵי என்பதையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר נָתַן לָבָן לְרָחֵל בִּתּוֹ
  choice: லாபான் தன் மகள் ராகேலுக்குக் கொடுத்த
  rationale: உறவுப்பெயரெச்சத் தொடரை பில்காளோடு தெளிவாக இணைத்து, לְ என்பதன் பெறுநர் உறவை ‘ராகேலுக்கு’ எனக் காட்டுகிறது.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: அவள் இவர்களை யாக்கோபுக்குப் பெற்றெடுத்தாள்
  rationale: தாயான பில்காளை எழுவாயாகத் தொடர்ந்து வைத்தும், பிறப்பு மரபுத்தொடரில் לְיַעֲקֹב காட்டும் தந்தை உறவை இயல்பாகவும் வழங்குகிறது.
- source_word: כָּל נֶפֶשׁ שִׁבְעָה
  choice: மொத்தம் ஏழு பேர்
  rationale: நபர்களை எண்ணும் எபிரெய மரபுத்தொடரின் பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது; அதன் சொல்லமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
