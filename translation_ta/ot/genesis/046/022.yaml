  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட மரபுப்பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆத்துமாக்கள்’ போன்ற இறையியல் சார்பைத் தூண்டக்கூடிய சொல்லுக்குப் பதிலாக, இச்சூழலின் எண்ணிக்கைப் பொருளைத் தெளிவாகக் காட்ட ‘பேர்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
