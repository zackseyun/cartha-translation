lexical_decisions:
- source_word: אֵלֶּה
  choice: இவர்களே
  rationale: சுருக்கமாகக் குறிப்பிடப்படும் மனிதர்களைச் சுட்டுகிறது; தமிழ் வாக்கியத்தில் இயல்பாகவும் வலியுறுத்தலுடனும் அமைகிறது.
- source_word: בְּנֵי רָחֵל
  choice: ராகேலின் மகன்கள்
  rationale: בְּנֵי என்பதன் பாலினம் குறிக்கப்பட்ட அடிப்படைப் பொருளான ‘மகன்கள்’ என்பதைக் காத்து, மரபுப்பட்டியல் சூழலுக்கு ஏற்றவாறு மொழிபெயர்க்கிறது.
- source_word: אֲשֶׁר יֻלַּד לְיַעֲקֹב
  choice: யாக்கோபுக்குப் பிறந்த
  rationale: ילד வினையின் செயல்பாட்டு வடிவத்தையும் לְ குறிக்கும் பெற்றோர் உறவையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: כָּל נֶפֶשׁ
  choice: மொத்தம் ... பேர்
  rationale: மரபுப்பட்டியல் கணக்கீட்டில் נֶפֶשׁ என்பது ஆட்களைக் குறிக்கும் எபிரெய மரபுத்தொடர்; ‘பேர்’ என்பது தவறான ஆன்மீகப் பொருளைத் தூண்டாமல் மனிதர்களின் எண்ணிக்கையைத் தெளிவுபடுத்துகிறது.
- source_word: אַרְבָּעָה עָשָׂר
  choice: பதினான்கு
  rationale: எண்ணை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
