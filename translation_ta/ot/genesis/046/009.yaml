  text: וּ/בְנֵ֖י רְאוּבֵ֑ן חֲנ֥וֹךְ וּ/פַלּ֖וּא וְ/חֶצְר֥וֹן וְ/כַרְמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/009.yaml
  text: 'And the sons of Reuben: Hanoch[a], Pallu, Hezron, and Carmi.'
translation:
  language: ta
  text: 'ரூபேனின் மகன்கள்: ஹனோக்[a], பல்லூ, ஹெஸ்ரோன், கர்மீ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ஹனோக்; பாரம்பரியமாக ஏனோக்கு என்றும் வழங்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: மகன்கள்
  rationale: בְנֵי என்பது ‘மகன்கள்’ என்ற சொல்லின் இணைப்புநிலைப் பன்மை. முந்தைய பட்டியலின் தொடர்ச்சியை וּ குறித்தாலும், தமிழில் வசனத் தொடக்கத்தில் அதைத் தனியே ‘மேலும்’ என்று மொழிபெயர்க்காமல் பட்டியல் அமைப்பிலேயே இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: רְאוּבֵן
  choice: ரூபேன்
  rationale: எபிரெயப் பெயரின் ஒலியையும் தமிழில் நிலைபெற்ற வேதாகமப் பெயர் வடிவத்தையும் கருத்தில் கொண்ட எழுத்துப்பெயர்ப்பு.
- source_word: חֲנוֹךְ
  choice: ஆனோக்கு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது; மூல எபிரெயப் பெயரின் நேரடி ஒலிப்பெயர்ப்பும் பாரம்பரிய மாற்றுப் பெயரும் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: וּ/פַלּוּא
  choice: பல்லூ
  rationale: פַלּוּא என்ற பெயரின் எபிரெய ஒலிக்கு நெருக்கமான, தமிழில் இயல்பான எழுத்துப்பெயர்ப்பு. முன்னொட்டான וּ பட்டியலின் காற்புள்ளி அமைப்பில் வெளிப்படுகிறது.
- source_word: וְ/חֶצְרוֹן
  choice: எஸ்ரோன்
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்ற பெயர் வடிவம்; பெயருக்கு முன் வரும் וְ பட்டியல் அமைப்பால் உணர்த்தப்படுகிறது.
- source_word: וְ/כַרְמִי
  choice: கர்மீ
  rationale: כַרְמִי என்ற பெயரின் ஒலிக்கு ஏற்ற தமிழ் எழுத்துப்பெயர்ப்பு; இறுதி וְ தமிழ்ப் பட்டியல் அமைப்பில் தனி இணைப்புச்சொல் இன்றியே இயல்பாகக் குறிக்கப்படுகிறது.
