translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘குமாரர்கள்’ என்பதற்குப் பதிலாக ordinary modern readers-க்கு இயல்பான ‘மகன்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
