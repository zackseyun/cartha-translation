  register: நவீன தரநிலைத் தமிழ்; கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. பார்வோனை நோக்கிய பணிவை ‘உமது அடியார்கள்’ என்ற வழக்கால் காக்கிறது. மேற்கோள் முந்தைய வசனத்தில் யோசேப்பு தொடங்கிய உரையின் தொடர்ச்சி என்பதால் இறுதியில் ‘என்றான்’ சேர்க்கப்பட்டுள்ளது.
