base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/034.yaml
  text: then you shall say[a], ‘Your servants have been men of livestock from our youth until now, both we and our fathers,’ so that you may live in the land of Goshen[b], for every shepherd is detestable to the Egyptians.
translation:
  language: ta
  text: அப்போது நீங்கள், ‘உமது அடியார்களான நாங்களும் எங்கள் தந்தையரும் எங்கள் இளமைமுதல் இன்றுவரை கால்நடைகளை வளர்ப்பவர்களாகவே இருந்துவருகிறோம்’ என்று சொல்லுங்கள். அதனால் நீங்கள் கோசேன் நாட்டில் குடியிருக்கலாம்; ஏனெனில் ஆட்டு மந்தையை மேய்ப்பவன் எவனும் எகிப்தியர்களுக்கு அருவருப்பானவன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அருவருப்பானவன்” என்பதற்கு “வெறுக்கத்தக்கவன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: அப்போது நீங்கள் ... என்று சொல்லுங்கள்
  rationale: முந்தைய அறிவுறுத்தலைத் தொடர்ந்து வரும் வாவ்-இணைந்த வினைச்சொல்லின் தொடர்ச்சி மற்றும் கட்டளைத் தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַנְשֵׁי מִקְנֶה
  choice: கால்நடைகளை வளர்ப்பவர்கள்
  rationale: கால்நடைப் பராமரிப்பைத் தொழிலாகக் கொண்டவர்கள் என்ற பொருளை இயல்பாகத் தருகிறது; ஒரு குறிப்பிட்ட விலங்கினமாகக் குறுக்கவில்லை.
- source_word: עֲבָדֶיךָ
  choice: உமது அடியார்களாகிய நாங்கள்
  rationale: பார்வோனிடம் பேசும் பணிவான அரசவைத் தன்னுரையைக் குறிக்கிறது; அடிமைநிலையை தேவையின்றி வலியுறுத்தவில்லை.
- source_word: מִנְּעוּרֵינוּ וְעַד עַתָּה
  choice: எங்கள் இளமைமுதல் இன்றுவரை
  rationale: இளவயதில் தொடங்கி நிகழ்காலம்வரை நீடித்த காலத்தைக் குறிக்கும் எபிரேய மரபுத்தொடரைத் தெளிவாகக் காட்டுகிறது.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבֹתֵינוּ
  choice: நாங்களும் எங்கள் தந்தையரும்
  rationale: இரு தலைமுறைகளையும் வலியுறுத்தும் மீளுருவான גַּם அமைப்பைப் பாதுகாக்கிறது.
- source_word: בַּעֲבוּר תֵּשְׁבוּ
  choice: அப்படிச் சொன்னால், நீங்கள் ... குடியிருக்கலாம்
  rationale: கூற வேண்டிய பதிலுக்கும் கோசேனில் குடியிருக்கும் விளைவுக்கும் இடையேயான நோக்கம்/விளைவு உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: கோசேன் நாட்டில்
  rationale: אֶרֶץ என்பதையும் இடப்பெயரையும் சுருக்கமாகவும் தெளிவாகவும் பாதுகாக்கிறது.
- source_word: תוֹעֲבַת מִצְרַיִם
  choice: எகிப்தியர்களுக்கு அருவருப்பானவன்
  rationale: தீவிர வெறுப்பு அல்லது ஏற்காமையைக் குறிக்கும் תוֹעֵבָה என்பதன் வலிமையை நவீன தமிழில் தருகிறது; இங்கு அது எகிப்தியர்களின் சமூக மதிப்பீடு என்பதைத் தெளிவாக்குகிறது.
- source_word: כָּל רֹעֵה צֹאן
  choice: ஆட்டு மந்தை மேய்ப்பவன் எவனும்
  rationale: צֹאן என்பது ஆடுகள்/செம்மறியாடுகள் அடங்கிய சிறுகால்நடை மந்தையைக் குறிக்கக்கூடியதால், எபிரேயத்தில் வெளிப்படையாக உள்ள மந்தைச் சுட்டை தமிழில் தக்கவைக்கிறது.
