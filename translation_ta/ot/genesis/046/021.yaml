  language: en
  yaml_path: translation/ot/genesis/046/021.yaml
  text: 'And the sons of Benjamin: Bela[a], Beker, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim[d][c][b], and Ard.'
translation:
  language: ta
  text: 'பென்யமீனின் மகன்கள்: பேலா, பெகெர்[a], அஷ்பேல், கேரா, நாமான், எஹி[b], ரோஷ், முப்பிம்[c], ஹுப்பிம், அர்த்[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயப் பெயர் בֶּכֶר (பெகெர்); சில மரபுவழி ஒலிபெயர்ப்புகளில் இது “பெக்கேர்” போன்ற வடிவில் எழுதப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எண்ணாகமம் 26:38-இல் உள்ள இணையான பென்யமீன் வம்சப்பட்டியலில், இவ்வசனத்தின் “எஹி” என்பதற்குப் பதிலாக “அகிராம்” என்ற பெயர் வருகிறது.
    reason: cross_reference
  - marker: c
    text: இணையான சில வம்சப்பட்டியல் மரபுகளில் “முப்பிம்” என்பதற்கு “ஷுப்பிம்” போன்ற வேறுபட்ட வடிவம் காணப்படுகிறது; இங்கு மசோரெட்டிக் உரை பின்பற்றப்பட்டுள்ளது.
    reason: textual_variant
  - marker: d
    text: 1 நாளாகமம் 8:3-இல் பென்யமீன் வம்சப்பட்டியலுடன் தொடர்புடைய இடத்தில் “அத்தார்” என்ற பெயர் வடிவம் வருகிறது; இவ்வசனம் “அர்த்” என்று வாசிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי בִנְיָמִן
  choice: பென்யமீனின் மகன்கள்
  rationale: בְנֵי என்பது ‘மகன்கள்’ என்ற பொருளுடைய பன்மை இணைப்பு வடிவம். வம்சப்பட்டியலின் தொடர்ச்சியை எபிரெய வாவ் காட்டினாலும், தனி வசனமாக இயல்பான நவீனத் தமிழில் தேவையற்ற ‘மற்றும்’ சேர்க்கப்படவில்லை.
- source_word: בֶּלַע
  choice: பேலா
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֶּכֶר
  choice: பெகேர்
  rationale: மசோரெட்டிக் உரையிலுள்ள பெயரின் ஒலியை நெருக்கமாகக் காட்டும் தமிழ் வடிவம்.
- source_word: אַשְׁבֵּל
  choice: அஷ்பேல்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: גֵּרָא
  choice: கேரா
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: נַעֲמָן
  choice: நாமான்
  rationale: எபிரெயப் பெயரின் இயல்பான தமிழ் ஒலிபெயர்ப்பு; நடுவிலுள்ள குரல்வளை ஒலியைத் தமிழில் தனியாகக் குறிக்கவில்லை.
- source_word: אֵחִי
  choice: ஏகி
  rationale: இவ்வசனத்தின் மசோரெட்டிக் உரையில் உள்ள பெயரையே ஒலிபெயர்க்கிறது; இணையான மற்றொரு வம்சப்பட்டியலில் காணப்படும் ‘அகிராம்’ என்பதை முதன்மை உரைக்குள் கொண்டு வரவில்லை.
- source_word: רֹאשׁ
  choice: ரோஷ்
  rationale: இங்கு பெயர்ப்பட்டியலில் வரும் தனிப்பெயர் என்பதால், ‘தலை’ அல்லது ‘தலைவன்’ என்று பொருள் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: מֻפִּים
  choice: முப்பீம்
  rationale: இவ்வசனத்தின் மசோரெட்டிக் வாசகத்தைப் பின்பற்றும் ஒலிபெயர்ப்பு; இணையான மரபுகளின் வேறுபட்ட பெயர் வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: חֻפִּים
  choice: ஹுப்பீம்
  rationale: மசோரெட்டிக் உரையிலுள்ள தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: אָרְדְּ
  choice: ஆர்த்
  rationale: இவ்வசனத்தின் மசோரெட்டிக் வாசகத்தைப் பின்பற்றும் ஒலிபெயர்ப்பு; தொடர்புடைய வேறொரு பெயர் வடிவம் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
