base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/015.yaml
  text: These are the sons of Leah[a], whom she bore to Jacob in Paddan-aram, along with Dinah his daughter[b]. The total number of his sons and his daughters was thirty-three.
translation:
  language: ta
  text: யாக்கோபுக்கு பதான் அராமில் லேயாள் பெற்ற மகன்கள் இவர்களே; அவருடைய மகள் தீனாளும் இவர்களில் அடங்குகிறாள். அவனுடைய மகன்களும் மகள்களுமாக மொத்தம் முப்பத்து மூன்று பேர்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, ‘அவனுடைய மகன்களும் மகள்களுமான எல்லா நபர்களும் முப்பத்து மூன்று’ என்று உள்ளது. இங்கு ‘நபர்’ என்பதற்கான சொல் ‘உயிர்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: லேயாளின் மகன்கள்
  rationale: בְּנֵי என்பது ஆண்பால் பன்மையில் ‘மகன்கள்’ என்று தெளிவாகக் கூறுகிறது; தீனாள் பின்னர் தனியாகச் சேர்க்கப்படுவதால், இதை பொதுவான ‘பிள்ளைகள்’ என்று மாற்றவில்லை.
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: யாக்கோபுக்கு லேயாள் பெற்ற
  rationale: பெண் எழுவாயுடன் வரும் יָלַד ‘பெற்றெடுத்தாள்’ என்ற தாய்மைப் பொருளைக் கொண்டது; தமிழில் இயல்பாகவும் சுருக்கமாகவும் ‘பெற்ற’ என வழங்கப்பட்டது.
- source_word: בְּפַדַּן אֲרָם
  choice: பதான் அராமில்
  rationale: இது ஓர் இடப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְאֵת דִּינָה בִתּוֹ
  choice: அவனுடைய மகள் தீனாளும் இவர்களுடன் இருந்தாள்
  rationale: தீனாள் முன்னர் கூறப்பட்ட மகன்களின் கணக்குடன் சேர்க்கப்படுகிறாள். தமிழில் அந்தச் சேர்க்கைப் பொருளை இயல்பாக வெளிப்படுத்த ‘இவர்களுடன்’ பயன்படுத்தப்பட்டது.
- source_word: כָּל נֶפֶשׁ
  choice: மொத்தம் ... பேர்
  rationale: மக்கள்தொகை அல்லது வம்சப்பட்டியல் சூழலில் נֶפֶשׁ என்பது உடலிலிருந்து பிரிந்த ‘ஆத்துமா’ என்பதை அல்ல, எண்ணப்படும் நபர்களைக் குறிக்கிறது.
- source_word: בָּנָיו וּבְנוֹתָיו
  choice: அவனுடைய மகன்களும் மகள்களும்
  rationale: எபிரெயம் மகன்களையும் மகள்களையும் தனித்தனியாகக் குறிப்பிடுவதால் அந்த வேறுபாடு பாதுகாக்கப்பட்டது.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ
  choice: முப்பத்து மூன்று
  rationale: எபிரெய எண்ணின் நேரான தமிழ் வடிவம்.
