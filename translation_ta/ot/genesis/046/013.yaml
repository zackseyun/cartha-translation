lexical_decisions:
- source_word: וּ/בְנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பது ‘மகன்கள்’ என்ற பொருளுடைய கட்டமைப்பு பன்மை வடிவம். தமிழில் வம்சப்பட்டியலின் தொடர்ச்சியை இயல்பாக வெளிப்படுத்த, தொடக்க וּ தனியே ‘மற்றும்’ என மொழிபெயர்க்கப்படவில்லை.
- source_word: יִשָׂשכָר
  choice: இசக்கார்
  rationale: தனிப்பட்ட பெயர்; நவீனத் தமிழில் வழக்கமான வேதாகமப் பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: תּוֹלָע
  choice: தோலா
  rationale: வம்சப்பட்டியலில் வரும் தனிப்பட்ட பெயர்; எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וּ/פֻוָּה
  choice: பூவா
  rationale: פֻוָּה என்ற எபிரெயப் பெயரின் ஒலியை இயல்பான தமிழில் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: וְ/י֥וֹב
  choice: யோபு
  rationale: இவ்வசனத்தின் மசோரா உரை יוֹב என்று வாசிக்கிறது; தமிழில் நிலைபெற்ற பெயர் வடிவமான ‘யோபு’ பயன்படுத்தப்பட்டது.
- source_word: וְ/שִׁמְרֽוֹן
  choice: சிம்ரோன்
  rationale: தனிப்பட்ட பெயர்; எபிரெயப் பெயருக்கு நெருக்கமான, தமிழில் வாசிக்க இயல்பான எழுத்துப்பெயர்ப்பு.
