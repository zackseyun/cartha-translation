- from: அவர் யூதாவைத் தனக்கு முன்னதாக யோசேப்பிடம் அனுப்பி, கோசேனுக்குச் செல்லும் வழியைத் தனக்கு முன்பாகக் காட்டச் சொன்னார்[a]. அவர்கள் கோசேன் நாட்டிற்கு வந்தார்கள்.
  to: யாக்கோபு யூதாவைத் தனக்கு முன்னதாக யோசேப்பிடம், கோசேனுக்குச் செல்வதற்குத் தனக்கு முன்பாக வழிகாட்டும்படி அனுப்பினார்[a]. அவர்கள் கோசேன் நாட்டிற்கு வந்தார்கள்.
