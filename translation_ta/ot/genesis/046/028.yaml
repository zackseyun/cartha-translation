base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/028.yaml
  text: He sent Judah ahead of him to Joseph[a], to show the way before him to Goshen[c][b]; and they came into the land of Goshen.
translation:
  language: ta
  text: யாக்கோபு யூதாவைத் தனக்கு முன்னதாக யோசேப்பிடம், கோசேனுக்குச் செல்வதற்குத் தனக்கு முன்பாக வழிகாட்டும்படி அனுப்பினார்[a]. அவர்கள் கோசேன் நாட்டிற்கு வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கோசேனுக்குச் செல்வதற்கான வழிமுறைகளை அவருக்கு முன்பாகத் தெரிவிக்கும்படி.” எபிரெயச் சொற்றொடர் சுருக்கமாக உள்ளது. பயன்படுத்தப்பட்ட வினை “வழிகாட்டு,” “திசைகாட்டு,” அல்லது “அறிவுறுத்து” என்ற பொருள்களைக் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: அனுப்பி
  rationale: கால் வினையின் இயல்பான பொருளான ‘அனுப்பு’ என்பதைத் தெளிவாகவும் கதைநடைக்கு ஏற்றவாறும் தருகிறது.
- source_word: לְפָנָיו
  choice: தனக்கு முன்னதாக
  rationale: யாக்கோபின் வருகைக்கு முன்பே யூதா அனுப்பப்பட்டான் என்ற கால-இட முன்னுரிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְהוֹרֹת
  choice: வழியைக் காட்ட
  rationale: ஹிஃபில் வடிவம் ‘வழிகாட்டு/அறிவுறுத்து/திசைகாட்டு’ எனப் பொருள்படலாம்; பயணச் சூழலில் ‘வழியைக் காட்ட’ என்பது konkrete directional sense-ஐ இயல்பாகத் தருகிறது, ஆனால் யார் யாருக்கு வழிகாட்டுவது என்பது சுருக்கமான எபிரெயச் சொற்றொடரில் ஓரளவு தெளிவற்றதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: לְפָנָיו גֹּשְׁנָה
  choice: கோசேனுக்குச் செல்லும் வழியைத் தனக்கு முன்பாக
  rationale: மூலத்தின் மீண்டும் வரும் לְפָנָיו கூறையும் கோசேனை நோக்கிய திசையையும் இயன்றவரை காக்கிறது; தமிழில் புரியும்படி ‘செல்லும் வழி’ என அமைக்கப்பட்டுள்ளது.
- source_word: גֹּשְׁנָה
  choice: கோசேனுக்கு
  rationale: இடப்பெயருடன் சேர்ந்த திசைகாட்டும் -ה முடிவு கோசேனை நோக்கிய இயக்கத்தைக் குறிக்கிறது.
- source_word: וַיָּבֹאוּ
  choice: அவர்கள் வந்தார்கள்
  rationale: בוא வினையின் வழக்கமான கதைநடைப் பொருளை நேரடியாகத் தருகிறது.
- source_word: אַרְצָה גֹּשֶׁן
  choice: கோசேன் நாட்டிற்கு
  rationale: கோசேன் எனும் பிரதேசத்தை நோக்கி வந்து சேர்ந்ததைத் தமிழில் இயல்பாகக் கூறுகிறது; ‘நாடு’ என்பது אֶרֶץ என்பதன் பிரதேசப் பொருளைக் காக்கிறது.
- source_word: יְהוּדָה / יוֹסֵף / גֹּשֶׁן
  choice: யூதா / யோசேப்பு / கோசேன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரிச்சயமான பெயரெழுத்தாக்கங்கள் பயன்படுத்தப்பட்டுள்ளன.
theological_decisions:
- issue: לְהוֹרֹת לְפָנָיו என்ற சுருக்கமான சொற்றொடரில் வழிகாட்டுபவர்/வழிகாட்டலைப் பெறுபவர் யார் என்பது
  choice: யூதா யாக்கோபுக்கு முன்பாகச் சென்று கோசேனுக்கான வழியைக் காட்ட ஏற்பாடு செய்வதாக முதன்மை உரையில் தரப்பட்டது.
  alternative: யூதா யோசேப்பிடமிருந்து கோசேனுக்குச் செல்லும் வழிமுறைகளைப் பெற அனுப்பப்பட்டான்; அல்லது யாக்கோபின் வருகைக்காக முன்னேற்பாடு செய்ய அனுப்பப்பட்டான்.
  rationale: מורה/ירה ஹிஃபில் ‘காட்டு, வழிகாட்டு, அறிவுறுத்து’ என்ற பொருட்களை ஏற்கும்; எபிரெய வாக்கியம் சுருக்கமாக இருப்பதால் உறுதியாக ஒரே செயற்பாட்டு உறவைத் திணிக்காமல் மாற்றுப் புரிதலை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, மதிப்புமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இருமுறை வரும் ‘அவனுக்கு முன்பாக’ என்ற கருத்து ‘தனக்கு முன்னதாக’ மற்றும் ‘தனக்கு முன்பாக’ எனக் காக்கப்பட்டுள்ளது. தெளிவற்ற எபிரெயத் தொடரை முதன்மை உரையில் அளவுக்கு மீறி விளக்காமல், மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளன.
