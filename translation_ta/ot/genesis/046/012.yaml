base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/012.yaml
  text: And the sons of Judah were Er[a], Onan, Shelah, Perez, and Zerah. But Er and Onan died in the land of Canaan. And the sons of Perez were Hezron and Hamul.
translation:
  language: ta
  text: யூதாவின் மகன்கள் ஏர்[a], ஓனான், சேலா, பேரேஸ், சேரா ஆகியோர். ஆனால் ஏரும் ஓனானும் கானான் நாட்டில் இறந்தார்கள். பேரேஸின் மகன்கள் எஸ்ரோனும் ஆமூலும் ஆவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஏரும் ஓனானும்’ என்ற கூட்டெழுவாயுடன் எபிரெயத்தில் ஒருமை வினை வந்துள்ளது; இது எபிரெய மொழியில் இயல்பான அமைப்பு. தமிழில் அதன் பொருள் பன்மையாக, ‘ஏரும் ஓனானும் இறந்தார்கள்’ என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יְהוּדָה
  choice: யூதாவின் மகன்கள்
  rationale: இணைப்புச் சொல்லின் தொடர்ச்சியை வசன ஓட்டம் இயல்பாக உணர்த்துகிறது; எபிரெயக் கட்டமைப்பைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: עֵר וְאוֹנָן וְשֵׁלָה וָפֶרֶץ וָזָרַח
  choice: ஏர், ஓனான், சேலா, பேரேஸ், சேரா
  rationale: தனிப்பெயர்கள் எபிரெய ஒலியமைப்பை அடிப்படையாகக் கொண்டு தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: וַיָּמָת
  choice: இறந்தார்கள்
  rationale: வினை வடிவத்தில் ஒருமை இருந்தாலும், அதற்குப் பின் வரும் ‘ஏர் மற்றும் ஓனான்’ என்ற கூட்டெழுவாய் காரணமாகப் பொருள் பன்மையாகும்; இயல்பான தமிழில் பன்மை வினை பயன்படுத்தப்பட்டது.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: கானான் நாட்டில்
  rationale: எபிரெயத்தில் வெளிப்படையாக உள்ள ‘நாடு/தேசம்’ என்ற சொல்லைத் தக்கவைத்து இயல்பான தமிழில் வழங்குகிறது.
- source_word: וַיִּהְיוּ בְנֵי פֶרֶץ
  choice: பேரேஸின் மகன்கள் ... ஆவர்
  rationale: வம்சப்பட்டியல் சூழலில் הָיָה அடையாளப்படுத்தும் இணைப்பாகச் செயல்படுகிறது; ‘ஆவர்’ என்பது தமிழில் தெளிவான சமன்பாட்டு அமைப்பு.
- source_word: חֶצְרוֹן וְחָמוּל
  choice: எஸ்ரோனும் ஆமூலும்
  rationale: தனிப்பெயர்கள் எபிரெய உச்சரிப்புக்கு அருகான தமிழாக்கமாக வழங்கப்பட்டுள்ளன; தொடக்க ח ஒலி தமிழில் இயல்பாக உயிர்முதலாக ஒலிபெயர்க்கப்பட்டுள்ளது.
