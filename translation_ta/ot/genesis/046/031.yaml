translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தகப்பன்’ வேதாகமச் சூழலுக்கேற்ற மரியாதைமிக்க சொல்லாகவும், ‘குடும்பத்தார்’ எபிரெய בית என்பதன் குடும்ப அலகு சார்ந்த பொருளைத் தெளிவுபடுத்துவதாகவும் தேர்ந்தெடுக்கப்பட்டுள்ளன. மேற்கோளுக்குள் மேற்கோள் தெளிவாகப் பேணப்பட்டுள்ளது.
