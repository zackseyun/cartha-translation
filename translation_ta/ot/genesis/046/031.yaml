base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/031.yaml
  text: Then Joseph said to his brothers and to his father’s household[a], “I will go up and report to Pharaoh, and I will say to him, ‘My brothers and my father’s household, who were in the land of Canaan, have come to me.’”
translation:
  language: ta
  text: பின்பு யோசேப்பு தன் சகோதரர்களிடமும் தன் தந்தையின் குடும்பத்தாரிடமும்[a], “நான் மேலே சென்று பார்வோனிடம் அறிவிப்பேன்; அவரிடம், ‘கானான் நாட்டில் இருந்த என் சகோதரர்களும் என் தந்தையின் குடும்பத்தாரும் என்னிடம் வந்திருக்கிறார்கள்’ என்று சொல்வேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் தந்தையின் வீட்டாரிடம்.” எபிரெயத்தில் நேரடியாக, “தன் தந்தையின் வீடு”; இங்கு அது வசிக்கும் கட்டிடத்தைவிட குடும்ப அலகைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழ் கதைநடையில் ‘பின்பு’ இயல்பாக வரிசையை வெளிப்படுத்துகிறது.
- source_word: אֶל אֶחָיו
  choice: தன் சகோதரர்களிடம்
  rationale: சூழலில் யோசேப்பின் ஆண் சகோதரர்களையே குறிக்கிறது; ‘சகோதரர்கள்’ துல்லியமானதும் கண்ணியமானதும் ஆகும்.
- source_word: וְאֶל בֵּית אָבִיו
  choice: தன் தகப்பனின் குடும்பத்தாரிடம்
  rationale: בַּיִת இங்கு கட்டிடத்தை அல்ல, தகப்பனைச் சார்ந்த குடும்ப அலகைச் சுட்டுகிறது. ‘குடும்பத்தார்’ அந்த சமூகப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֶעֱלֶה
  choice: நான் ... சென்று
  rationale: எபிரெயத்தில் நேரடியாக ‘மேலே செல்வேன்’ என்ற திசைச்சொல் இருந்தாலும், பார்வோனிடம் செல்வதைக் குறிக்கும் இச்சூழலில் ‘மேலே சென்று’ என்பது தமிழில் தேவையற்ற இடவியல் பொருளை உருவாக்கும்; ‘சென்று’ இயக்கத்தை இயல்பாகத் தருகிறது.
- source_word: וְאַגִּידָה לְפַרְעֹה
  choice: பார்வோனிடம் ... செய்தியைத் தெரிவிப்பேன்
  rationale: Hiphil வடிவிலுள்ள נגד, ஒன்றை அறியச் செய்தல் அல்லது அதிகாரபூர்வமாகத் தெரிவித்தல் என்ற பொருளுடையது; அரசவைக் சூழலுக்கு ‘செய்தியைத் தெரிவிப்பேன்’ பொருந்துகிறது.
- source_word: וְאֹמְרָה אֵלָיו
  choice: அவரிடம் ... என்று சொல்வேன்
  rationale: யோசேப்பு அடுத்து கூறவிருப்பதை முதல்நபர் நோக்குடன் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אַחַי
  choice: என் சகோதரர்கள்
  rationale: யோசேப்பின் உடன்பிறந்த ஆண் சகோதரர்களைக் குறிப்பதால் இத்தேர்வு சூழலுக்கு துல்லியமானது.
- source_word: וּבֵית אָבִי
  choice: என் தகப்பனின் குடும்பத்தார்
  rationale: கட்டிடமான ‘வீடு’ என்பதைக் காட்டிலும் குடும்ப அலகையே குறிக்கிறது; முந்தைய பயன்பாட்டுடனும் ஒத்திசைகிறது.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: கானான் நாட்டில் இருந்த
  rationale: உறவுத்தொடரில் வெளிப்படையான வினை இல்லை; அவர்கள் முன்பு இருந்த இடத்தைத் தமிழில் இயல்பாகக் காட்ட ‘இருந்த’ சேர்க்கப்படுகிறது.
- source_word: בָּאוּ אֵלַי
  choice: என்னிடம் வந்திருக்கிறார்கள்
  rationale: முடிவுற்று தற்போதைய நிலைக்கு தொடர்புடைய வருகையை ‘வந்திருக்கிறார்கள்’ இயல்பாக எடுத்துரைக்கிறது.
