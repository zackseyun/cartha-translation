  text: וּ/בְנֵ֖י זְבוּלֻ֑ן סֶ֥רֶד וְ/אֵל֖וֹן וְ/יַחְלְאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/014.yaml
  text: 'And the sons of Zebulun: Sered[a], Elon, and Jahleel.'
translation:
  language: ta
  text: 'செபுலோனின் மகன்கள்: சேரேத், ஏலோன், யக்லெயேல்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தப் பெயரை ‘யஹ்லெயேல்’ என்றும் ஒலிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பது ‘மகன்கள்’ என்பதன் இணைப்பு வடிவம். வம்சப்பட்டியலின் இயல்பான தமிழ்நடைக்காக முன்னொட்டான ו தனியாக ‘மற்றும்’ என்று மொழிபெயர்க்கப்படாமல், தொடரின் அமைப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: זְבוּלֻן
  choice: செபுலோன்
  rationale: இது ஒரு நபரின் பெயர்; தமிழில் நிலைபெற்றுள்ள ஒலிபெயர்ப்பு வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: סֶרֶד
  choice: சேரேத்
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் நெருக்கமாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: וְ/אֵלוֹן
  choice: ஏலோன்
  rationale: இங்கு אֵלוֹן ஒரு நபரின் பெயராக வருவதால், பொதுப்பெயரின் பொருளாக மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְ/יַחְלְאֵל
  choice: யக்லெயேல்
  rationale: எபிரெய யோத், ח மெய்யொலி, மற்றும் பெயரின் அசைவுகளை இயன்றவரை பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
