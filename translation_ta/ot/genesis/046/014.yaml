  register: சுருக்கமான வம்சப்பட்டியல் நடையும் மூலத்தின் பெயர்ப்பட்டியல் அமைப்பும் காக்கப்பட்டுள்ளன. பெயர்கள் மொழிபெயர்க்கப்படாமல், நவீனத் தமிழில் வாசிக்கத்தக்க வகையில் ஒலிபெயர்க்கப்பட்டுள்ளன.
