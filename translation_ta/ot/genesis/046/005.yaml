  text: וַ/יָּ֥קָם יַעֲקֹ֖ב מִ/בְּאֵ֣ר שָׁ֑בַע וַ/יִּשְׂא֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶת יַעֲקֹ֣ב אֲבִי/הֶ֗ם וְ/אֶת טַפָּ/ם֙ וְ/אֶת נְשֵׁי/הֶ֔ם בָּ/עֲגָל֕וֹת אֲשֶׁר שָׁלַ֥ח פַּרְעֹ֖ה לָ/שֵׂ֥את אֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/005.yaml
  text: Then Jacob set out from Beersheba[a], and the sons of Israel carried Jacob their father, their little ones[b], and their wives in the wagons that Pharaoh had sent to carry him.
translation:
  language: ta
  text: யாக்கோபு பெயர்செபாவிலிருந்து புறப்பட்டார். இஸ்ரவேலின் மகன்கள் தங்கள் தந்தையான யாக்கோபையும், தங்கள் சிறுபிள்ளைகளையும், தங்கள் மனைவிகளையும், யாக்கோபை ஏற்றிச் செல்வதற்காகப் பார்வோன் அனுப்பியிருந்த வண்டிகளில் ஏற்றிச் சென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: புறப்பட்டார்
  rationale: எழுந்தார் என்பது சொல்லடியான பொருள்; ஆனால் מן + இடப்பெயர் வரும் பயணச் சூழலில், ஓர் இடத்திலிருந்து புறப்படுவதை இயல்பாகக் குறிக்கிறது.
- source_word: מִבְּאֵר שָׁבַע
  choice: பெயெர்செபாவிலிருந்து
  rationale: இடப்பெயரையும், முன்ஒட்டாக உள்ள ‘இலிருந்து’ என்ற பொருளையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וַיִּשְׂאוּ
  choice: அழைத்துச் சென்றார்கள்
  rationale: נשׂא என்பதன் அடிப்படைப் பொருள் ‘சுமத்தல்/ஏற்றிச் செல்லுதல்.’ மனிதர்கள் வண்டிகளில் பயணிக்கும் இச்சூழலில் ‘அழைத்துச் சென்றார்கள்’ என்பது இயல்பாகவும் பொருளுக்குச் சமமாகவும் உள்ளது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: இங்கு இச்சொற்றொடர் பொதுவாக இஸ்ரவேல் மக்களைக் குறிக்காமல், யாக்கோபின் ஆண் பிள்ளைகளையே குறிப்பதால் ‘மகன்கள்’ துல்லியமானது.
- source_word: אֲבִיהֶם
  choice: தங்கள் தந்தையாகிய
  rationale: யாக்கோபு அவர்களுடைய தந்தை என்பதைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் உடைமைத் தொடர்.
- source_word: טַפָּם
  choice: தங்கள் சிறு பிள்ளைகள்
  rationale: טַף குறிப்பாகச் சிறு குழந்தைகள் அல்லது குடும்பத்தின் இளம் சார்பாளர்களைக் குறிக்கிறது; ‘சிறு பிள்ளைகள்’ அந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: נְשֵׁיהֶם
  choice: தங்கள் மனைவிகள்
  rationale: குடும்பப் பயணச் சூழலில் ‘மனைவிகள்’ என்பதே தெளிவான பொருள்.
- source_word: בָּעֲגָלוֹת
  choice: வண்டிகளில்
  rationale: עֲגָלוֹת என்பது மனிதர்களையும் பொருட்களையும் ஏற்றிச் செல்லும் வண்டிகளைக் குறிக்கிறது; நவீன தமிழில் ‘வண்டிகள்’ இயல்பான தேர்வு.
- source_word: אֲשֶׁר שָׁלַח פַּרְעֹה
  choice: பார்வோன் அனுப்பியிருந்த
  rationale: வண்டிகளை அனுப்பிய செயல் பயணத்திற்கு முன்பே நிகழ்ந்ததை ‘அனுப்பியிருந்த’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לָשֵׂאת אֹתוֹ
  choice: ஏற்றிச் செல்வதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் வினையெச்சத்தையும் ‘அவனை ஏற்றிச் செல்ல’ என்ற பொருளையும் வெளிப்படுத்துகிறது. ஒருமை ஆண்பால் பின்னொட்டு முதன்மையாக யாக்கோபைக் குறிக்கிறது; தமிழில் சூழலால் அது தெளிவாக இருப்பதால் பெயர்ச்சொல் மீண்டும் சேர்க்கப்படவில்லை.
