translation_notes:
  register: நவீன செந்தமிழுக்கு அண்மையான, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. ‘எழுந்தார்’ என்ற சொல்லடியான வடிவத்திற்கு மாறாகப் பயணச் சூழலுக்கேற்ற ‘புறப்பட்டார்’ பயன்படுத்தப்பட்டது. தேவையற்ற அடிக்குறிப்புகள் சேர்க்கப்படவில்லை.
