  yaml_path: translation/ot/genesis/046/019.yaml
  text: 'The sons of Rachel, Jacob’s wife: Joseph and Benjamin.'
translation:
  language: ta
  text: 'யாக்கோபின் மனைவி ராகேலின் மகன்கள்: யோசேப்பும் பென்யமீனும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இது ‘மகன்கள்’ என்பதன் எபிரெயக் கட்டுநிலைப் பன்மை வடிவம். இங்கு ராகேலின் நேரடி ஆண் பிள்ளைகள் பெயரிடப்படுவதால் ‘மகன்கள்’ என்பது துல்லியமான இயல்பான மொழிபெயர்ப்பு.
- source_word: רָחֵל
  choice: ராகேல்
  rationale: தனிப்பட்ட பெயர்; நவீனத் தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் வடிவில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֵשֶׁת
  choice: மனைவி
  rationale: யாக்கோபுடன் கட்டுநிலையில் வருவதால் இங்கு ‘பெண்’ என்ற பொதுப்பொருள் அல்ல, ‘மனைவி’ என்ற உறவுப்பொருளே தெளிவாக உள்ளது.
- source_word: יַעֲקֹב
  choice: யாக்கோபின்
  rationale: தனிப்பட்ட பெயர்; ‘யாக்கோபின் மனைவி’ என்று எபிரெயக் கட்டுநிலைத் தொடரைத் தமிழில் உரிய உடைமை வேற்றுமையுடன் வழங்குகிறது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: தனிப்பட்ட பெயர்; தமிழில் நிலைபெற்ற வேதாகமப் பெயர் வடிவம். இணைப்புச் சூழலில் ‘யோசேப்பும்’ என வருகிறது.
- source_word: וּ/בִנְיָמִן
  choice: பென்யமீனும்
  rationale: இணைப்பிடைச்சொல்லையும் தனிப்பட்ட பெயரையும் தமிழின் இயல்பான பட்டியல் அமைப்பில் ‘-உம்’ விகுதியால் வழங்குகிறது; பெயர் எபிரெய ஒலிவடிவுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: சுருக்கமான வம்சப்பட்டியல் நடையைப் பேணியுள்ளோம். எபிரெயச் சொல் வரிசையை இயன்றவரைத் தக்கவைத்தபடியே, தமிழில் இயல்பாக அமைய ‘யாக்கோபின் மனைவி ராகேலின் மகன்கள்’ என அமைக்கப்பட்டது. நடை நவீனமானதும் கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதும் ஆகும்.
