source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יִשְׂרָאֵ֛ל אֶל יוֹסֵ֖ף אָמ֣וּתָה הַ/פָּ֑עַם אַחֲרֵי֙ רְאוֹתִ֣/י אֶת פָּנֶ֔י/ךָ כִּ֥י עוֹדְ/ךָ֖ חָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/030.yaml
  text: Then Israel said to Joseph[a], “Now I can die, since I have seen your face and know that you are still alive.”
translation:
  language: ta
  text: பின்பு இஸ்ரவேல் யோசேப்பிடம், “நீ இன்னும் உயிரோடிருப்பதால் உன் முகத்தைப் பார்த்தபின், இப்போது நான் சாகலாம்” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்கு நெருக்கமாக: “இப்போது நான் சாகலாம்; உன் முகத்தைப் பார்த்தபின், நீ இன்னும் உயிரோடிருக்கிறாய் என்பதால்.” எபிரெயச் சொற்றொடர் சுருக்கமானதும் மரபுத்தொடர் தன்மையுடையதும் ஆகும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் ‘பின்பு’ இயல்பாக அந்தத் தொடர்ச்சியைக் காட்டுகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: எபிரெய மூலத்தில் ‘இஸ்ரவேல்’ என்ற பெயரே உள்ளது; அதை ‘யாக்கோபு’ என்று ஒத்திசைக்காமல் அப்படியே வைத்திருக்கிறது.
- source_word: אָמ֣וּתָה הַפָּעַם
  choice: இப்போது நான் மனநிறைவோடு சாகலாம்
  rationale: கோஹோர்டேட்டிவ் வடிவம் இங்கு அனுமதி கோருவதைவிட, யோசேப்பு உயிரோடிருப்பதைக் கண்டபின் மரணத்தை மனநிறைவுடன் எதிர்கொள்ளும் ஆயத்தத்தை உணர்ச்சிபூர்வமாக வெளிப்படுத்துகிறது. ‘மனநிறைவோடு’ என்பது சூழலிலிருந்து விளங்கும் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַחֲרֵי רְאוֹתִי אֶת־פָּנֶיךָ
  choice: உன் முகத்தைப் பார்த்து
  rationale: சொல்லுக்கு நெருக்கமாக ‘உன் முகத்தை நான் பார்த்தபின்’; தமிழில் ‘உன் முகத்தைப் பார்த்து’ என்பது காலத்தையும் அதனால் ஏற்பட்ட உறுதியையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כִּי עוֹדְךָ חָי
  choice: நீ இன்னும் உயிரோடிருப்பதை ... அறிந்துகொண்டேன்
  rationale: כִּי காரணம் அல்லது கண்டறியப்பட்ட உண்மையின் உள்ளடக்கம் எனப் புரிந்துகொள்ளலாம். முகத்தைப் பார்த்ததன் மூலம் அவர் இன்னும் உயிரோடிருப்பதை உறுதிப்படுத்தியதாக இயல்பான தமிழில் வழங்கப்படுகிறது; சேர்க்கப்பட்ட ‘அறிந்துகொண்டேன்’ வெளிப்படையாக இல்லாவிட்டாலும் வாக்கிய உறவைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: אָמ֣וּתָה என்ற கோஹோர்டேட்டிவின் உணர்வு
  choice: இப்போது நான் மனநிறைவோடு சாகலாம்
  alternative: இப்போது நான் சாகட்டும் / இப்போது நான் சாவேன்
  rationale: ‘நான் சாகட்டும்’ என்பது வேறொருவரிடம் அனுமதி கேட்பது போன்ற தொனியைத் தமிழில் ஏற்படுத்தலாம்; ‘நான் சாவேன்’ வெறும் எதிர்கால அறிவிப்பாகத் தோன்றலாம். சூழலில் இஸ்ரவேல் தனது நிறைவையும் ஆயத்தத்தையும் தெரிவிக்கிறார்.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதையாடல் இயல்பும் காக்கப்பட்டுள்ளன. ‘உயிரோடிருப்பதை’ பொதுவாக எளிதில் புரியும் நடை; ‘மனநிறைவோடு சாகலாம்’ என்பது மூலத்தின் உணர்ச்சிசார் கோஹோர்டேட்டிவை இயல்பாக வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
