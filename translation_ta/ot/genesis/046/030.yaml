revisions:
- from: பின்பு இஸ்ரவேல் யோசேப்பிடம், “நீ இன்னும் உயிரோடிருப்பதை உன் முகத்தைப் பார்த்து அறிந்துகொண்டேன்; இப்போது நான் மனநிறைவோடு சாகலாம்” என்றார்.[a]
  to: பின்பு இஸ்ரவேல் யோசேப்பிடம், “நீ இன்னும் உயிரோடிருப்பதால் உன் முகத்தைப் பார்த்தபின், இப்போது நான் சாகலாம்” என்றார்.[a]
  rationale: 'The revision removes the unsupported expansions ‘மனநிறைவோடு’ and ‘அறிந்துகொண்டேன்.’ It keeps ‘இப்போது நான் சாகலாம்’ for the cohortative, which naturally conveys Israel’s readiness without making it a request for permission or a bare future prediction. The phrasing retains the stated grounds: he has seen Joseph’s face and Joseph remains alive.'
