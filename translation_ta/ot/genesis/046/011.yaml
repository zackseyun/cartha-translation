  text: וּ/בְנֵ֖י לֵוִ֑י גֵּרְשׁ֕וֹן קְהָ֖ת וּ/מְרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/011.yaml
  text: 'And the sons of Levi: Gershon, Kohath, and Merari.'
translation:
  language: ta
  text: 'லேவியின் மகன்கள்: கெர்சோன், கோகாத், மற்றும் மெராரி.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי לֵוִי
  choice: லேவியின் மகன்கள்
  rationale: בְנֵי என்பது மரபுப்பட்டியலில் வரும் ஆண்பால் பன்மை அமைப்பான ‘மகன்கள்’; לֵוִי உடைமைத் தொடர்புடன் இயல்பான தமிழில் ‘லேவியின்’ என வழங்கப்பட்டது. தொடக்க ו முந்தைய பட்டியலின் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் பட்டியல் ஓட்டம் இயல்பாக இருப்பதால் தனியே ‘மேலும்’ எனச் சேர்க்கப்படவில்லை.
- source_word: גֵּרְשׁוֹן
  choice: கெர்சோன்
  rationale: இங்கு உள்ள எபிரெய வடிவம் Gershon-க்கு ஒத்த גֵּרְשׁוֹן; வேறுபட்ட பெயரான Gershom எனக் கலக்காமல், தமிழில் வாசிக்க இயல்பான ஒலிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- source_word: קְהָת
  choice: கோகாத்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் தெளிவாகவும் வழக்கமான வேதாகமப் பெயரமைப்புக்கு ஏற்றவாறும் வழங்குகிறது.
- source_word: וּ/מְרָרִי
  choice: மெராரி
  rationale: מְרָרִי தனிப்பெயர் ஒலிபெயர்க்கப்பட்டது. இறுதிப் பெயருக்கு முன் உள்ள ו பட்டியலின் இணைப்பைக் குறித்தாலும், தமிழில் காற்புள்ளியால் அமைந்த பெயர்ப்பட்டியலில் தனி ‘மற்றும்’ இன்றி வழங்குவது இயல்பானது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட சுருக்கமான மரபுப்பட்டியல் நடை. மூலத்தின் பெயர்ப்பட்டியல் வடிவமும் வெளிப்படையான ‘மகன்கள்’ என்ற பாலினக் குறிப்பும் பாதுகாக்கப்பட்டுள்ளன.
