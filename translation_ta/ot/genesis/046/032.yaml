translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கால்நடைகளை வளர்த்து வந்தவர்கள்’ என்பது சொற்சொல்லான ‘கால்நடை மனிதர்கள்’ என்பதற்குப் பதிலாக தொழில்சார்ந்த பொருளை இயல்பாக வழங்குகிறது. எபிரெய நிறைவுற்ற வினைவடிவங்களின் காலநிலைத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
