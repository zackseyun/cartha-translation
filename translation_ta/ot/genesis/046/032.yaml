  text: וְ/הָ/אֲנָשִׁים֙ רֹ֣עֵי צֹ֔אן כִּֽי אַנְשֵׁ֥י מִקְנֶ֖ה הָי֑וּ וְ/צֹאנָ֧/ם וּ/בְקָרָ֛/ם וְ/כָל אֲשֶׁ֥ר לָ/הֶ֖ם הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/032.yaml
  text: The men are shepherds[a], for they have been keepers of livestock, and they have brought their flocks and their herds and all that they have.
translation:
  language: ta
  text: அந்த மனிதர்கள் ஆடு மேய்ப்பவர்கள்[a]; ஏனெனில் அவர்கள் கால்நடைகளை வளர்த்து வந்தவர்கள். அவர்கள் தங்கள் சிறு கால்நடை மந்தைகளையும், மாட்டு மந்தைகளையும், தங்களுக்குச் சொந்தமான அனைத்தையும் கொண்டுவந்திருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆடு மேய்ப்பவர்களாக இருந்தார்கள்; ஏனெனில் அவர்கள் கால்நடைகளை வளர்ப்பவர்களாக இருந்தார்கள் ... கொண்டுவந்தார்கள்.’ எபிரெய மொழியில் உள்ள நிறைவுற்ற வினைவடிவங்களை எளிய இறந்தகாலத்திலும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: அந்த மனிதர்கள்
  rationale: இணைப்புச்சொல்லுடன் வந்துள்ள வரையறுக்கப்பட்ட பன்மைப் பெயர்ச்சொல். தமிழில் கூற்றின் தொடக்கத்தில் ‘அந்த மனிதர்கள்’ என்பது முன்பு குறிப்பிடப்பட்டவர்களை இயல்பாகச் சுட்டுகிறது; தொடக்க ‘וְ’ தனியாக மொழிபெயர்க்கப்படாவிட்டாலும் உரையின் தொடர்பு காக்கப்படுகிறது.
- source_word: רֹעֵי צֹאן
  choice: ஆடு மேய்ப்பவர்கள்
  rationale: சொல்லடியாக ‘சிறு கால்நடை மந்தைகளை மேய்ப்பவர்கள்.’ நவீன தமிழில் ‘ஆடு மேய்ப்பவர்கள்’ இயல்பானதும் எளிதில் புரியக்கூடியதுமான தொழிற்பெயர்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அவர்கள் ஆடு மேய்ப்பவர்கள் என்று கூறியதற்கான விளக்கத்தை இங்கு அறிமுகப்படுத்துகிறது.
- source_word: אַנְשֵׁי מִקְנֶה הָיוּ
  choice: கால்நடைகளை வளர்த்து வந்தவர்கள்
  rationale: எபிரெயச் சொற்றொடர் கால்நடை பராமரிப்பை அவர்களுடைய நிலையான தொழிலாகக் காட்டுகிறது. ‘வளர்த்து வந்தவர்கள்’ கடந்த காலத்தில் தொடங்கி இச்சூழல்வரை தொடர்ந்த தொழிலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְצֹאנָם
  choice: தங்கள் ஆட்டு மந்தைகளையும்
  rationale: צֹאן என்பது செம்மறியாடுகள், வெள்ளாடுகள் போன்ற சிறு கால்நடைகளைத் தொகுப்பாகக் குறிக்கலாம். ‘ஆட்டு மந்தைகள்’ பொதுவாசகருக்கு இயல்பாக இருந்து கூட்டுப்பொருளைக் காக்கிறது.
- source_word: וּבְקָרָם
  choice: மாட்டு மந்தைகளையும்
  rationale: בָּקָר மாடுகளைத் தொகுப்பாகக் குறிக்கிறது. ‘மாட்டு மந்தைகள்’ என்பது ஆட்டு மந்தைகளுடன் உள்ள மூலமொழியின் வகைப்பாட்டு இணையைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: தங்களுக்குள்ள எல்லாவற்றையும்
  rationale: அவர்களுக்குச் சொந்தமான உடைமைகள் அனைத்தையும் உள்ளடக்கும் எபிரெயச் சொற்றொடருக்கு நெருக்கமான, இயல்பான தமிழ்.
- source_word: הֵבִיאוּ
  choice: கொண்டுவந்திருக்கிறார்கள்
  rationale: முடிவுற்ற செயல் தற்போதைய வருகைச் சூழலில் விளைவுடன் இருப்பதை இந்தத் தமிழ் வடிவம் தெரிவிக்கிறது; எளிய இறந்தகாலமும் இலக்கணரீதியாகச் சாத்தியம்.
