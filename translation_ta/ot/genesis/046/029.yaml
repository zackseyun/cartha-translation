base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/029.yaml
  text: Then Joseph harnessed his chariot and went up to meet Israel his father in Goshen[a]. He appeared before him, fell on his neck[b], and wept on his neck for a long time.
translation:
  language: ta
  text: அப்போது யோசேப்பு தன் தேருக்குக் குதிரைகளைப் பூட்டி, கோசேனில் தன் தந்தையாகிய இஸ்ரவேலைச் சந்திக்கச் சென்றான். அவன் அவருக்கு முன்பாகத் தோன்றி[a], அவருடைய கழுத்தின்மேல் விழுந்து, அவரை அணைத்துக்கொண்டு நீண்ட நேரம் அழுதான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் தந்தைக்குத் தன்னைக் காண்பித்தான்” அல்லது “அவருக்குத் தோன்றினான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அவருடைய கழுத்தின்மேல் விழுந்து, அவருடைய கழுத்தின்மேல் இன்னும் அழுதான்” என்று உள்ளது. இது தந்தையை அணைத்துக்கொண்டு தொடர்ந்து அழுததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר ... מֶרְכַּבְתּוֹ
  choice: தன் தேருக்குக் குதிரைகளைப் பூட்டி
  rationale: אָסַר என்பதன் அடிப்படைப் பொருள் ‘கட்டு’; தேர் என்ற செயப்படுபொருளுடன், பயணத்திற்காகத் தேரில் குதிரைகளைப் பூட்டித் தயாரிப்பதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் காட்சித்தன்மையுடனும் இவ்வாறு மொழிபெயர்க்கப்படுகிறது.
- source_word: וַיַּעַל
  choice: சென்றான்
  rationale: சொல்லுக்குச் சொல் ‘மேலே சென்றான்’ எனலாம்; ஆனால் கோசேனை நோக்கிய இந்தப் பயணத்தில் உயர்நிலை இயக்கம் தெளிவாக இல்லாததால், நவீன தமிழில் இயல்பான ‘சென்றான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לִקְרַאת יִשְׂרָאֵל אָבִיו
  choice: தன் தந்தையாகிய இஸ்ரவேலைச் சந்திக்க
  rationale: לִקְרַאת நோக்கத்தைச் சுட்டி ‘சந்திக்க’ எனப் பொருள்படுகிறது. மூலத்தில் உள்ள ‘இஸ்ரவேல்’ என்ற பெயர் மாற்றமின்றிப் பாதுகாக்கப்படுகிறது.
- source_word: גֹּשְׁנָה
  choice: கோசேனில்
  rationale: திசைச் சுட்டும் ־ָה பின்னொட்டு ‘கோசேனை நோக்கி’ எனவும் கொள்ளலாம்; இங்கு சந்திப்பு நடைபெற்ற இடத்தைக் குறிக்கும் இயல்பான தமிழ் அமைப்பாக ‘கோசேனில்’ பயன்படுத்தப்பட்டது.
- source_word: וַיֵּרָא אֵלָיו
  choice: அவன் தந்தையின் முன் தோன்றி
  rationale: ראה வினையின் நிபால் வடிவம் ‘அவருக்குத் தன்னைக் காண்பித்தான்’ அல்லது ‘அவருக்குத் தோன்றினான்’ என்ற நுண்பொருளைக் கொண்டிருக்கலாம். ‘முன் தோன்றி’ என்பது சந்திப்பின் சூழலில் இயல்பாகவும், மூலத்தின் சொல்லாட்சிக்கு நெருக்கமாகவும் உள்ளது.
- source_word: וַיִּפֹּל עַל צַוָּארָיו
  choice: அவருடைய கழுத்தைக் கட்டிக்கொண்டு
  rationale: சொல்லுக்குச் சொல் ‘அவருடைய கழுத்தின்மேல் விழுந்தான்’; இது உணர்ச்சிமிக்க அணைப்பைக் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழில் தவறாகப் புரியாமல் அதன் செயற்பொருளை ‘கழுத்தைக் கட்டிக்கொண்டு’ என வெளிப்படுத்துகிறது.
- source_word: וַיֵּבְךְּ עַל צַוָּארָיו עוֹד
  choice: நீண்ட நேரம் அழுதான்
  rationale: עוֹד என்பதற்கு ‘இன்னும்’, ‘தொடர்ந்து’ என்ற பொருள்கள் உண்டு; இச்சூழலில் அழுகை நீடித்ததைச் சுட்டுவதால் ‘நீண்ட நேரம்’ என இயல்பாக வழங்கப்படுகிறது. அணைத்த நிலையிலேயே அழுதது முந்தைய தொடரால் தெளிவாகிறது.
