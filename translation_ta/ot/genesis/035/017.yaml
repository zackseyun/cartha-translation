revisions:
- from: அவளுடைய பிரசவம் கடினமாக இருந்தபோது, மருத்துவச்சி அவளிடம், “பயப்படாதே; உனக்கு இவனும் ஒரு மகன்” என்றாள்.
  to: அவளுக்குப் பிரசவம் கடினமாக இருந்தபோது, மருத்துவச்சி அவளிடம், “பயப்படாதே; உனக்கு இவனும் ஒரு மகன்” என்றாள்.
  rationale: The revision makes only a minor idiomatic adjustment to the opening clause. It retains the Hebrew's difficult-childbirth setting and preserves the additive demonstrative sense in “உனக்கு இவனும் ஒரு மகன்.” No footnote is necessary, since the rendering does not conceal a material ambiguity.
