  yaml_path: translation/ot/genesis/035/017.yaml
  text: And when her labor was hard[a], the midwife said to her, “Do not fear[b], for this also is a son for you.”
translation:
  language: ta
  text: அவளுக்குப் பிரசவம் கடினமாக இருந்தபோது, மருத்துவச்சி அவளிடம், “பயப்படாதே; உனக்கு இவனும் ஒரு மகன்” என்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְהַקְשֹׁתָהּ בְלִדְתָּהּ
  choice: அவளுடைய பிரசவம் கடினமாக இருந்தபோது
  rationale: பிள்ளைப்பேற்றின்போது அவள் எதிர்கொண்ட கடுமையான சிரமத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; எபிரெய வாக்கியத்தின் காலச் சூழலையும் காக்கிறது.
- source_word: הַמְיַלֶּדֶת
  choice: மருத்துவச்சி
  rationale: பிரசவத்திற்கு உதவும் பெண்ணைக் குறிக்கும் வழக்கமான, துல்லியமான தமிழ்ச் சொல்.
- source_word: אַל תִּירְאִי
  choice: பயப்படாதே
  rationale: பெண் ஒருவரை நோக்கிக் கூறப்படும் நேரடியான தடை மற்றும் ஆறுதலை இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: כִּי גַם זֶה לָךְ בֵּן
  choice: உனக்கு இவனும் ஒரு மகன்
  rationale: גַם זֶה என்பதிலுள்ள ‘இவனும்’ என்ற சேர்க்கைப் பொருளையும், לָךְ בֵּן என்பதிலுள்ள ‘உனக்கு ஒரு மகன்’ என்ற உறவுப் பொருளையும் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
