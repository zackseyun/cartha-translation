  text: וַ/יְהִ֗י בִּ/שְׁכֹּ֤ן יִשְׂרָאֵל֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יֵּ֣לֶךְ רְאוּבֵ֔ן וַ/יִּשְׁכַּב֙ אֶת בִּלְהָה֙ פִּילֶ֣גֶשׁ אָבִ֔י/ו וַ/יִּשְׁמַ֖ע יִשְׂרָאֵ֑ל וַ/יִּֽהְי֥וּ בְנֵֽי יַעֲקֹ֖ב שְׁנֵ֥ים עָשָֽׂר־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/022.yaml
  text: And it happened[a], while Israel was dwelling in that land, that Reuben went and lay with Bilhah, his father's concubine, and Israel heard of it[b]. Now the sons of Jacob were twelve.
translation:
  language: ta
  text: 'அக்காலத்தில், இஸ்ரவேல் அந்த நாட்டில் குடியிருந்தபோது, ரூபன் போய் தன் தந்தையின் துணைமனைவியான பில்காளுடன் உடலுறவு கொண்டான். இஸ்ரவேல் அதைக் கேள்விப்பட்டார்.[a]


    யாக்கோபுக்கு பன்னிரண்டு மகன்கள் இருந்தார்கள்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இஸ்ரவேல் கேட்டார்” என்று மட்டுமே உள்ளது; அவர் கேட்டது ரூபனின் செயலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இன்னும் சொற்சொல்லாக, “யாக்கோபின் மகன்கள் பன்னிரண்டு பேராக இருந்தார்கள்.” இந்த வாக்கியம் அடுத்த வசனங்களில் வரும் மகன்களின் பட்டியலுக்கு ஒரு முன்னுரையாக அமைகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּשְׁכֹּן יִשְׂרָאֵל בָּאָרֶץ הַהִוא
  choice: இஸ்ரவேல் அந்த நாட்டில் குடியிருந்தபோது
  rationale: ב prefixed to the infinitive construct gives the temporal background, and שכן denotes settled dwelling. The Tamil clause naturally preserves the ongoing circumstance.
- source_word: וַיֵּלֶךְ רְאוּבֵן
  choice: ரூபன் போய்
  rationale: The separate motion verb is retained rather than absorbed into the following act.
- source_word: וַיִּשְׁכַּב אֶת
  choice: உடலுறவு கொண்டான்
  rationale: In this construction שׁכב denotes sexual intercourse. This is direct and unambiguous in modern Tamil without being needlessly clinical.
- source_word: פִּילֶגֶשׁ
  choice: துணைமனைவி
  rationale: This conveys a woman recognized within the ancient household as a wife or partner of secondary status, while avoiding the derogatory overtones that some traditional Tamil terms now carry.
- source_word: וַיִּשְׁמַע יִשְׂרָאֵל
  choice: இஸ்ரவேல் அதைக் கேள்விப்பட்டார்
  rationale: The Hebrew leaves the object unstated. Tamil naturally supplies அதைக், whose referent is Reuben's preceding act.
- source_word: וַיִּהְיוּ בְנֵי יַעֲקֹב שְׁנֵים עָשָׂר
  choice: யாக்கோபுக்கு பன்னிரண்டு மகன்கள் இருந்தார்கள்
  rationale: This idiomatic Tamil rendering communicates the numerical statement and allows it to stand as the transition to the list that follows.
theological_decisions:
- issue: How explicitly to render Reuben's act
  choice: உடலுறவு கொண்டான்
  alternative: அவளோடு படுத்தான்
  rationale: The Hebrew idiom clearly refers to sexual intercourse. The chosen wording preserves the seriousness and avoids a Tamil expression that could be mistaken for merely lying down beside someone.
- issue: Whether to infer any response from Israel after he heard
  choice: State only that Israel heard about it
  alternative: Add grief, anger, judgment, or silence
  rationale: The Hebrew reports that Israel heard but gives no reaction here. No moral, judicial, or psychological response should be supplied.
- issue: Function of the statement about Jacob's twelve sons
  choice: Present it as a separate transitional statement
  alternative: Bind it closely to the report of Reuben's act
  rationale: The clause leads into the enumeration in the following verses. Separating it typographically preserves that discourse movement without adding theological significance.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பழமையான ‘மறுமனையாட்டி’ என்பதற்குப் பதிலாகத் தெளிவான ‘துணைமனைவி’ பயன்படுத்தப்பட்டது; உரையில் சொல்லப்படாத இஸ்ரவேலின் எதிர்வினை எதுவும் சேர்க்கப்படவில்லை.
