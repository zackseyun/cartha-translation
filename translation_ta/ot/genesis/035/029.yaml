base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/029.yaml
  text: Then Isaac breathed his last and died[a], and was gathered to his people, old and full of days. And Esau and Jacob, his sons, buried him.
translation:
  language: ta
  text: பின்பு ஈசாக்கு உயிர்நீத்து இறந்தார்; வயது முதிர்ந்தவராகவும் நாட்களால் நிறைந்தவராகவும், அவர் தம் மக்களோடு சேர்க்கப்பட்டார்.[a] அவருடைய மகன்களான ஏசாவும் யாக்கோபும் அவரை அடக்கம் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தம் உறவினரோடு/முன்னோருடன் சேர்க்கப்பட்டார்.’ இந்த எபிரெயச் சொற்றொடர் மரணத்தைக் குறிக்கும் மரபான சொல்லாக்கம்; இது உடல் அடக்கத்தைவிட அதிகமான பொருளைக் கொண்டிருக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: உயிர்நீத்து
  rationale: இறப்புச் செய்திகளில் גוע உயிர் பிரிதல் அல்லது இறுதி மூச்சை விடுதல் என்ற நுணுக்கத்தைக் கொண்டுள்ளது. தொடர்ந்து வரும் ‘இறந்தார்’ என்பதிலிருந்து வேறுபாட்டையும் இயல்பான தமிழையும் இச்சொல் காக்கிறது.
- source_word: וַיָּמָת
  choice: இறந்தார்
  rationale: מות என்பது ‘இறத்தல்’ என்பதற்கான பொதுவான வினைச்சொல். எபிரெய உரையின் தொடர்வரிசையை நேரடியாகக் காக்கிறது.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: தம் மக்களுடன் சேர்க்கப்பட்டார்
  rationale: இது மரணத்தைச் சுட்டும் மரபுத்தொடர். புதைக்கப்பட்டதையோ, முன்னோருடன் இணைவதையோ, மரணத்திற்குப் பிந்தைய நிலையையோ மட்டும் குறிக்கிறது என்று தீர்மானிக்காமல் மூலத்தின் உருவகத்தையும் தெளிவின்மையையும் காக்கிறது.
- source_word: זָקֵן
  choice: முதிர்ந்த வயதில்
  rationale: ‘முதியவர்’ என்ற பொருளை இச்சூழலில் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וּשְׂבַע יָמִים
  choice: வாழ்நாட்கள் நிறைந்தவராய்
  rationale: ‘நாட்களால் நிறைந்தவர்’ என்ற எபிரெய மரபுத்தொடரின் இலக்கியத் தன்மையைத் தக்கவைத்து, வெறுமனே ‘மிகுந்த வயதானவர்’ என்று சுருக்குவதைத் தவிர்க்கிறது.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: அவரை அடக்கம் செய்தார்கள்
  rationale: קבר என்பதன் பொருளைத் தெளிவாகவும் தற்காலத் தமிழில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עֵשָׂו וְיַעֲקֹב בָּנָיו
  choice: அவருடைய மகன்களான ஏசாவும் யாக்கோபும்
  rationale: பெயர்களையும் அவர்களுடைய மகன் உறவையும் தெளிவாகக் கூறி, தமிழ் வாக்கிய அமைப்பில் இயல்பாக அமைகிறது.
theological_decisions:
- issue: ‘தம் மக்களுடன் சேர்க்கப்பட்டார்’ என்ற மரண மரபுத்தொடரின் பொருள்
  choice: புதைப்பு, முன்னோருடன் ஒன்றுசேர்தல், அல்லது மரணத்திற்குப் பிந்தைய நிலை என்று குறிப்பாக வரையறுக்காமல், மூல உருவகம் அப்படியே வைக்கப்பட்டது.
  alternative: ‘தம் முன்னோருடன் சேர்க்கப்பட்டார்’ அல்லது ‘குடும்பக் கல்லறையில் அடக்கம் செய்யப்பட்டார்’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: எபிரெயத் தொடர் பலவிதமாகப் புரிந்துகொள்ளப்படலாம். அதிலுள்ள இறையியல் நுட்பத்தையும் தெளிவின்மையையும் மொழிபெயர்ப்பு தீர்த்துவிடக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உயிர்நீத்து இறந்தார்’ என்ற இணைப்பு மூலத்தின் இரு தனித்தனி வினைச்சொற்களையும் காக்கிறது; ‘வாழ்நாட்கள் நிறைந்தவராய்’ என்பது மூல மரபுத்தொடரின் இலக்கியச் சுவையைப் பாதுகாக்கிறது.
