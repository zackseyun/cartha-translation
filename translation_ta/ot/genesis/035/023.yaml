translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிமையும் கொண்ட பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘முதற்பேறு’ என்ற வேதாகமச் சொல் மூலத்தின் துல்லியத்தைத் தக்கவைக்கிறது; அடிக்குறி மாற்றுச் சொல்லமைப்பைக் காட்டுகிறது.
