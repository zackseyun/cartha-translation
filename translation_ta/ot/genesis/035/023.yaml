base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/023.yaml
  text: 'The sons of Leah: Jacob’s firstborn[a], Reuben, Simeon, Levi, Judah, Issachar, and Zebulun.'
translation:
  language: ta
  text: 'லேயாளின் மகன்கள்: யாக்கோபின் முதற்பேறான[a] ரூபன், சிமியோன், லேவி, யூதா, இசக்கார், செபுலோன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்லான வடிவில், “யாக்கோபின் முதற்பேறானவன், ரூபன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: லேயாளின் மகன்கள்
  rationale: இணைப்புநிலைப் பன்மைச் சொற்றொடர் லேயாளின் ஆண் பிள்ளைகளின் பட்டியலை அறிமுகப்படுத்துகிறது; ‘மகன்கள்’ என்பது சூழலுக்கு நேரான, இயல்பான தமிழ்.
- source_word: בְּכוֹר יַעֲקֹב
  choice: யாக்கோபின் முதற்பேறான
  rationale: எபிரெய இணைப்புநிலைச் சொற்றொடர் ரூபனை யாக்கோபின் முதற்பேறாக அடையாளப்படுத்துகிறது. ‘முதற்பேறான’ என்பது பிறப்பு வரிசையையும் மூலச்சொல்லின் தனித்துவமான பொருளையும் காக்கிறது.
- source_word: רְאוּבֵן
  choice: ரூபன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: שִׁמְעוֹן
  choice: சிமியோன்
  rationale: தமிழில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: לֵוִי
  choice: லேவி
  rationale: தமிழில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: தமிழில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: יִשָּׂשכָר
  choice: இசக்கார்
  rationale: தமிழில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: זְבוּלֻן
  choice: செபுலோன்
  rationale: தமிழ் வேதாகம மரபில் எளிதில் அடையாளம் காணப்படும் பெயர்வடிவம்.
- source_word: וְ
  choice: பட்டியலில் காற்புள்ளிகள்
  rationale: எபிரெயத்தில் ஒவ்வொரு பெயரையும் இணைக்கும் வாவ் தொடரை, இயல்பான நவீன தமிழ்ப் பட்டியல் நடைக்காக காற்புள்ளிகளால் வழங்கி, இறுதி பெயருக்கு முன்பும் தனி ‘மற்றும்’ சேர்க்காமல் சுருக்கமாக அமைக்கப்பட்டுள்ளது.
