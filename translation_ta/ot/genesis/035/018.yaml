  text: וַ/יְהִ֞י בְּ/צֵ֤את נַפְשָׁ/הּ֙ כִּ֣י מֵ֔תָה וַ/תִּקְרָ֥א שְׁמ֖/וֹ בֶּן אוֹנִ֑י וְ/אָבִ֖י/ו קָֽרָא ל֥/וֹ בִנְיָמִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/018.yaml
  text: And as her life was departing—for she was dying—she called his name Ben-oni[b][a]; but his father called him Benjamin.
translation:
  language: ta
  text: அவளுடைய உயிர் பிரியும்போது—ஏனெனில் அவள் இறந்துகொண்டிருந்தாள்—அவள் அவனுக்குப் பென்-ஓனி[a] என்று பெயரிட்டாள்; ஆனால் அவனுடைய தந்தை அவனுக்குப் பென்யமீன்[b] என்று பெயரிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பென்-ஓனி என்பதற்கு அநேகமாக ‘என் துயரத்தின் மகன்’ அல்லது ‘என் வேதனையின் மகன்’ என்று பொருள்.
    reason: lexical_alternative
  - marker: b
    text: பென்யமீன் என்பதற்கு அநேகமாக ‘வலதுகையின் மகன்’ என்று பொருள்; சிலர் இதை ‘தெற்கின் மகன்’ என்றும் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת נַפְשָׁהּ
  choice: அவளுடைய உயிர் பிரிந்துகொண்டிருந்தபோது
  rationale: נֶפֶשׁ இங்கு மரணச் சூழலில் உயிரைக் குறிக்கிறது. ‘ஆத்துமா’ என்று மொழிபெயர்த்து எபிரெய உரை கட்டாயப்படுத்தாத குறிப்பிட்ட மானிடவியல் கருத்தைச் சேர்ப்பதைத் தவிர்த்து, நிகழ்ந்துகொண்டிருக்கும் செயலைத் தமிழ் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי מֵתָה
  choice: அவள் இறந்துகொண்டிருந்ததால்
  rationale: முந்தைய சொற்றொடரை விளக்கும் உடன்நிகழ் மரணநிலையைத் தெரிவிக்கிறது; பெயரிடும் தருணத்தில் மரணம் நிகழ்ந்துகொண்டிருந்தது என்ற கதை ஓட்டத்தைப் பேணுகிறது.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: அவள் அவனுக்குப் ... என்று பெயரிட்டாள்
  rationale: எபிரெயப் பெயரிடும் மரபுத்தொடரை இயல்பான நவீன தமிழில் வழங்குகிறது; தந்தையின் பெயரிடுதலுடனான இணை அமைப்பையும் காக்கிறது.
- source_word: בֶּן אוֹנִי
  choice: பென்-ஓனி
  rationale: முதன்மை உரையில் பெயரை ஒலிபெயர்த்து, கதைக்கு முக்கியமான அதன் சாத்தியமான பொருளை அடிக்குறிப்பில் தருகிறது.
- source_word: וְאָבִיו קָרָא לוֹ
  choice: ஆனால் அவனுடைய தந்தை அவனுக்குப் ... என்று பெயரிட்டார்
  rationale: וְ இங்கு தாயின் பெயரிடுதலுக்கும் தந்தையின் மாற்றுப் பெயரிடுதலுக்கும் உள்ள முரண்பாட்டைக் குறிக்கிறது; ‘ஆனால்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בִנְיָמִין
  choice: பென்யமீன்
  rationale: முதன்மை உரையில் தனிப்பெயரை ஒலிபெயர்க்கிறது; அதன் இரண்டு முக்கிய சொற்பிறப்புப் பொருள் வாய்ப்புகளையும் அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: மரணச் சூழலில் נֶפֶשׁ என்பதன் மானிடவியல் பொருள்
  choice: முதன்மை உரையில் ‘உயிர்’
  alternative: ‘ஆத்துமா’
  rationale: எபிரெயச் சொல் உயிரையோ உயிருள்ள தன்னையோ குறிக்கலாம்; உடலிலிருந்து பொருளற்ற ஆத்துமா பிரிவது பற்றிய தொழில்நுட்பமான கருத்தை இவ்வசனம் கட்டாயம் கூறுகிறது என்று முடிவுசெய்யாமல் கதைப் பொருளைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுடன் ஒத்த ஒலிவடிவத்தில் தரப்பட்டுள்ளன; பொருள் தெளிவுகள் அடிக்குறிப்புகளில் வைக்கப்பட்டுள்ளன. இணை அமைப்பும் தாயின் பெயருக்கும் தந்தையின் பெயருக்கும் உள்ள எதிர்மறைத் தொடர்பும் பேணப்பட்டுள்ளன.
