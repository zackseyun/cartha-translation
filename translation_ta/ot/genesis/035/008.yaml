base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/008.yaml
  text: And Deborah[a], Rebekah’s nurse, died, and she was buried below Bethel, under the oak[b]. So he called its name Allon-bacuth.
translation:
  language: ta
  text: ரெபெக்காவின் செவிலித்தாயான தெபோரா இறந்தாள். அவள் பெத்தேலுக்குக் கீழே, கருவாலி மரத்தின்[b] அடியில் அடக்கம் செய்யப்பட்டாள். அவன் அதற்கு “அல்லோன் பாகூத்”[a] என்று பெயரிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அல்லோன் பாகூத்” என்பதற்கு பெரும்பாலும் “அழுகையின் கருவாலி மரம்” என்று பொருள்; אַלּוֹן என்பதை வேறொரு பெரிய மரவகையாக எடுத்தால், “அழுகையின் டெரிபிந்த் மரம்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள எபிரெய மரப்பெயரான אַלּוֹן, கருவாலி மரத்தையோ டெரிபிந்த் மரத்தையோ குறிக்கலாம்; அதன் துல்லியமான இனம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵינֶקֶת
  choice: செவிலித்தாய்
  rationale: இச்சொல் குழந்தைக்குப் பாலூட்டி வளர்க்கும் பெண்ணைக் குறிக்கிறது. தெபோராவின் நீண்டகால பராமரிப்புப் பங்கையும் இயல்பான நவீனத் தமிழில் உணர்த்துவதற்கு ‘செவிலித்தாய்’ பொருத்தமானது.
- source_word: מִתַּחַת לְבֵית אֵל
  choice: பெத்தேலுக்குக் கீழே
  rationale: பெத்தேலைவிடத் தாழ்வான இடம் அல்லது அதன் கீழ்ப்பகுதி என்ற இடஞ்சார்ந்த பொருளை இது காக்கிறது; ‘தெற்கே’ எனத் தேவையின்றித் திசையை நிர்ணயிக்கவில்லை.
- source_word: תַּחַת הָאַלּוֹן
  choice: கருவாலி மரத்தின் அடியில்
  rationale: תַּחַת என்பது ‘அடியில்’ எனப் பொருள்படும். אַלּוֹן என்பதைப் பொதுவாகக் கருவாலி மரம் என மொழிபெயர்க்கலாம்; மரவகை குறித்த நிச்சயமின்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: וַתִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டாள்
  rationale: எபிரெய வினைச்சொல்லின் செயல்பாட்டு வடிவத்தைச் சார்ந்த மறைநிலைப் பொருளைக் காத்து, அவளை அடக்கம் செய்தவர்களை உரையில் புதிதாகச் சேர்க்காமல் கூறுகிறது.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: அவன் அதற்கு … என்று பெயரிட்டான்
  rationale: மூலத்தில் வினை மூன்றாம் நபர் ஆண்பால் ஒருமை வடிவில் உள்ளது; எழுவாய் பெயரால் குறிப்பிடப்படவில்லை. ஆகவே ‘அவன்’ என்பது இலக்கண வடிவைத் தக்கவைக்கிறது; ‘அதற்கு’ என்பது அருகில் குறிப்பிடப்பட்ட மரம் அல்லது இடம் என்பதைக் கூடுதலாகத் தீர்மானிக்காமல் விடுகிறது.
- source_word: אַלּוֹן בָּכוּת
  choice: அல்லோன் பாகூத்
  rationale: இடப்பெயர் முதன்மை உரையில் ஒலிபெயர்க்கப்பட்டுள்ளது; அதன் வெளிப்படையான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַתָּמָת
  choice: இறந்தாள்
  rationale: மூலத்தின் நேரடியான சொல்லாட்சியை மென்மைப்படுத்தாமல் இயல்பான தமிழில் தருகிறது.
