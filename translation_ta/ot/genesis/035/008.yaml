translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நேரடியான இறப்பு மற்றும் அடக்கச் சொல்லாட்சி காக்கப்பட்டுள்ளது. குறிப்பிடப்படாத ஆண்பால் ஒருமை எழுவாய் ‘அவன்’ எனப் பிரதிபலிக்கப்பட்டாலும், பெயரிடப்பட்டது மரமா இடமா என்பதை ‘அதற்கு’ என்ற வடிவம் தீர்மானிக்காமல் விடுகிறது.
