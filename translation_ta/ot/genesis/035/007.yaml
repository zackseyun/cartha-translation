  yaml_path: translation/ot/genesis/035/007.yaml
  text: There he built an altar and called the place El-bethel[a], because there God had revealed himself to him when he fled from his brother.
translation:
  language: ta
  text: அங்கே அவன் ஒரு பலிபீடத்தைக் கட்டி, அந்த இடத்துக்கு ஏல்-பெத்தேல்[a] என்று பெயரிட்டான். ஏனெனில், அவன் தன் சகோதரனிடமிருந்து தப்பியோடியபோது அங்கே கடவுள் அவனுக்குத் தம்மை வெளிப்படுத்தியிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஏல்-பெத்தேல்” என்பதற்கு “பெத்தேலின் கடவுள்” என்று பொருள் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: அங்கே அவன் ஒரு பலிபீடத்தைக் கட்டி
  rationale: கதைநடை வினையான וַיִּבֶן என்பதற்கு இயல்பான ‘கட்டினான்’ என்ற பொருளையும், שָׁם மற்றும் מִזְבֵּחַ ஆகியவற்றின் இடம் மற்றும் வழிபாட்டுப் பொருளையும் தெளிவாகப் பேணுகிறது.
- source_word: וַיִּקְרָא לַמָּקוֹם
  choice: அந்த இடத்துக்கு ... என்று பெயரிட்டான்
  rationale: குறிப்பிட்ட இடத்திற்கு ஒரு பெயர் சூட்டும் சூழலில், நவீனத் தமிழில் ‘பெயரிட்டான்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אֵל בֵּית אֵל
  choice: எல்-பெத்தேல்
  rationale: இது அந்த இடத்துக்குக் கொடுக்கப்பட்ட பெயராகச் செயல்படுவதால் ஒலிபெயர்க்கப்பட்டுள்ளது; அதன் சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי שָׁם
  choice: ஏனெனில் ... அங்கே
  rationale: כִּי பெயரிட்டதற்கான காரணத்தை அறிமுகப்படுத்துகிறது; எபிரெய உரையிலுள்ள שָׁם என்பதன் மறுபயன்பாடும் பாதுகாக்கப்படுகிறது.
- source_word: נִגְלוּ אֵלָיו הָאֱלֹהִים
  choice: கடவுள் அவனுக்குத் தம்மை வெளிப்படுத்தியிருந்தார்
  rationale: இலக்கண வடிவில் பன்மைச் சுவடு இருந்தாலும், சூழலில் குறிக்கப்படுவது ஒரே கடவுள். ‘தம்மை வெளிப்படுத்தினார்’ என்பது தெய்வீக சுயவெளிப்பாட்டைத் தெரிவிக்கிறது; முந்தைய நிகழ்வைக் குறிக்கும் காரணவாக்கியத்திற்கு இறந்தகால நிறைவு வடிவம் பொருந்துகிறது.
- source_word: בְּבָרְחוֹ מִפְּנֵי אָחִיו
  choice: அவன் தன் சகோதரனிடமிருந்து தப்பியோடியபோது
  rationale: בְּ + வினையெச்சப் பெயரின் காலப்பொருளை ‘போது’ எனவும், מִפְּנֵי என்பதன் தப்பிச் செல்லும் சூழலிலான பொருளை ‘இடமிருந்து’ எனவும் இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: אֱלֹהִים என்ற பன்மை வடிவத்துடன் נִגְלוּ என்ற பன்மை வினை வருவது
  choice: ஒருமைப் பொருளில் ‘கடவுள் ... தம்மை வெளிப்படுத்தியிருந்தார்’ என்று மொழிபெயர்த்தல்
  alternative: வடிவத்தைப் பின்பற்றி ‘தெய்வங்கள் வெளிப்பட்டன’ என்று பன்மையில் மொழிபெயர்த்தல் அல்லது ‘கடவுள் தோன்றினார்’ என்று வழங்குதல்
  rationale: பெத்தேலில் யாக்கோபுக்கு வெளிப்பட்ட ஒரே கடவுளையே சூழல் குறிக்கிறது. ஆகவே பன்மை வடிவத்தைச் சொற்படியாகக் கொண்டு பலதெய்வப் பொருள் உருவாக்காமல், ஒருமைப் பொருள் பேணப்படுகிறது; அதேவேளை גלה நிஃபால் வடிவின் சுயவெளிப்பாட்டு நுணுக்கமும் காக்கப்படுகிறது.
- issue: אֵל בֵּית אֵל என்பதை மொழிபெயர்ப்பதா அல்லது ஒலிபெயர்ப்பதா
  choice: முதன்மை உரையில் இடப்பெயராக ‘எல்-பெத்தேல்’ என்று ஒலிபெயர்த்தல்
  alternative: ‘பெத்தேலின் கடவுள்’ என்று பொருளை நேரடியாக மொழிபெயர்த்தல்
  rationale: இந்தச் சொற்றொடர் யாக்கோபு அந்த இடத்திற்குச் சூட்டிய பெயராக வருகிறது. எனவே பெயர் முதன்மை உரையில் ஒலிபெயர்க்கப்பட்டு, அதன் சாத்தியமான பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கடவுள் ... தம்மை ... இருந்தார்’ என்ற மரியாதை ஒருமை தமிழ் வழக்குக்கு ஏற்ப உள்ளது; மூலத்தின் தெய்வீக ஒருமைப் பொருளையும் பேணுகிறது.
