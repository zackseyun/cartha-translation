lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי
  choice: வாழ்நாட்கள்
  rationale: இங்கு ‘நாட்கள்’ என்பது ஒருவரின் முழு வாழ்நாளைக் குறிக்கும் எபிரேய மரபுத்தொடர். தமிழில் இயல்பாகவும் மூல உருவகத்தை ஓரளவு காக்கும் வகையிலும் ‘வாழ்நாட்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יִצְחָק
  choice: ஈசாக்கு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: מְאַת שָׁנָה וּשְׁמֹנִים שָׁנָה
  choice: நூற்று எண்பது ஆண்டுகள்
  rationale: எபிரேயத்தில் எண்களுக்குப் பின் ‘ஆண்டு’ ஒருமையில் வந்தாலும், மொத்த வயதைத் தெளிவாகவும் இயல்பாகவும் கூற நவீனத் தமிழில் பன்மை வடிவம் பயன்படுத்தப்பட்டது.
