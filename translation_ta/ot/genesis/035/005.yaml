revisions:
- from: பின்பு அவர்கள் புறப்பட்டார்கள். அவர்களைச் சுற்றியிருந்த பட்டணங்கள்மேல் கடவுளிடமிருந்து வந்த பேரச்சம்[a] பரவியது. அதனால் அவர்கள் யாக்கோபின் மகன்களைப் பின்தொடரவில்லை.
  to: பிறகு அவர்கள் புறப்பட்டுச் சென்றார்கள்; அவர்களைச் சுற்றியிருந்த நகரங்கள்மேல் கடவுளிடமிருந்து வந்த பேரச்சம் ஏற்பட்டது. ஆகவே அந்நகரத்தார் யாக்கோபின் மகன்களைத் துரத்தவில்லை.[a]
  rationale: வினைத் தேர்வுகள் மூலத்தின் நிகழ்வுப்பொருளையும் துரத்துதல் என்ற குறிப்பான செயற்பொருளையும் நெருக்கமாகப் பிரதிபலிக்கும்படி திருத்தப்பட்டன. நகரங்களைச் சுட்டும் மூலப் பயன்பாட்டைத் தமிழில் இயல்பாகச் செயற்பாட்டாளர்களாகக் காட்ட «அந்நகரத்தார்» பயன்படுத்தப்பட்டுள்ளது. இறைமூல வாசிப்பு முதன்மை உரையிலும், முறையான மாற்று வாசிப்பு அடிக்குறிப்பிலும் தக்கவைக்கப்பட்டுள்ளது.
