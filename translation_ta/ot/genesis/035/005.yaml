base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/005.yaml
  text: Then they set out[a], and a terror from God fell on the cities that were around them, so that they did not pursue the sons of Jacob.
translation:
  language: ta
  text: பிறகு அவர்கள் புறப்பட்டுச் சென்றார்கள்; அவர்களைச் சுற்றியிருந்த நகரங்கள்மேல் கடவுளிடமிருந்து வந்த பேரச்சம் ஏற்பட்டது. ஆகவே அந்நகரத்தார் யாக்கோபின் மகன்களைத் துரத்தவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாக, “கடவுளின் பேரச்சம்.”
    reason: חִתַּת אֱלֹהִים என்ற எபிரெய இணைப்பின் முறையான, பொருளில் திறந்த மாற்று வாசிப்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיִּסָּעוּ
  choice: பின்பு அவர்கள் புறப்பட்டார்கள்
  rationale: נסע பயணத்திற்காக ஓரிடத்திலிருந்து கிளம்புவதைக் குறிக்கிறது. தொடர்கதை அமைப்பில் וַ narrative progression-ஐக் காட்டுவதால், நவீன தமிழில் இயல்பாக ‘பின்பு’ என வழங்கப்பட்டுள்ளது.
- source_word: וַיְהִי חִתַּת אֱלֹהִים עַל הֶעָרִים
  choice: பட்டணங்கள்மேல் கடவுளிடமிருந்து வந்த பேரச்சம் பரவியது
  rationale: חִתָּה என்பது திகில், பேரச்சம் அல்லது கலக்கம் எனப் பொருள்படும். היה + עַל இங்கு அந்த அச்சம் பட்டணங்களை ஆட்கொண்ட நிகழ்வைக் குறிக்கிறது; ‘பரவியது’ என்பது தமிழ் வழக்கில் இயல்பாக அந்த நிகழ்வுத்தன்மையை வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר סְבִיבֹתֵיהֶם
  choice: அவர்களைச் சுற்றியிருந்த
  rationale: யாக்கோபின் கூட்டத்தைச் சுற்றியிருந்த அருகிலுள்ள பட்டணங்களைத் தெளிவாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: וְלֹא רָדְפוּ אַחֲרֵי
  choice: அதனால் அவர்கள் ... பின்தொடரவில்லை
  rationale: רדף אחרי என்பது ஒருவரைத் துரத்திச் செல்லுதல் அல்லது பின்தொடர்தல். முன்னுள்ள பேரச்சத்தின் விளைவைச் சூழல் காட்டுவதால், וְ என்பதன் விளைவுசார் தொடர்பை ‘அதனால்’ தெளிவாக்குகிறது.
- source_word: בְּנֵי יַעֲקֹב
  choice: யாக்கோபின் மகன்களை
  rationale: எபிரெயச் சொற்றொடர் ஆண்பால் பன்மையாக யாக்கோபின் ஆண் பிள்ளைகளைக் குறிப்பதால், பாலினக் குறிப்பை ‘மகன்கள்’ எனப் பாதுகாக்கிறது.
theological_decisions:
- issue: חִתַּת אֱלֹהִים என்ற இணைப்பின் பொருள்
  choice: கடவுளிடமிருந்து வந்த பேரச்சம்
  alternative: கடவுளின் பேரச்சம்; மிகுந்த பேரச்சம்
  rationale: இந்த இணைப்பு கடவுளிடமிருந்து உண்டான பேரச்சத்தைக் குறிக்க வாய்ப்பு அதிகம்; இச்சூழலில் அது கடவுளின் பாதுகாப்புச் செயலுடன் பொருந்துகிறது. எனினும், எபிரெயக் construct வடிவத்தின் சுருக்கமான ‘கடவுளின் பேரச்சம்’ என்ற உண்மையான மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது. வெறும் மிகைப்படுத்தலாக ‘மிகுந்த பேரச்சம்’ என்று மொழிபெயர்ப்பது சாத்தியமானாலும், இங்கு கடவுளின் செயற்பாட்டைத் தெளிவற்றதாக்கும்.
- issue: בְּנֵי יַעֲקֹב என்பதிலுள்ள பாலினக் குறிப்பு
  choice: யாக்கோபின் மகன்கள்
  alternative: யாக்கோபின் பிள்ளைகள்
  rationale: மூலமொழி வெளிப்படையாக ஆண்பால் பன்மையைப் பயன்படுத்தி, கதைச்சூழலில் யாக்கோபின் ஆண் சந்ததியைக் குறிப்பிடுகிறது. ஆகவே பொதுப்பாலாக்காமல் ‘மகன்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மதிப்புடனும் அமைக்கப்பட்டுள்ளது. ‘பட்டணங்கள்’, ‘பேரச்சம்’, ‘பின்தொடரவில்லை’ ஆகியவை கதைச்சூழலின் தெளிவையும் மூலத்தின் தீவிரத்தையும் காக்கின்றன; தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
