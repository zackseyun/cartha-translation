  text: וְ/אֶת הָ/אָ֗רֶץ אֲשֶׁ֥ר נָתַ֛תִּי לְ/אַבְרָהָ֥ם וּ/לְ/יִצְחָ֖ק לְ/ךָ֣ אֶתְּנֶ֑/נָּה וּֽ/לְ/זַרְעֲ/ךָ֥ אַחֲרֶ֖י/ךָ אֶתֵּ֥ן אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/012.yaml
  text: And the land that I gave to Abraham and to Isaac[a], I will give to you[b]; and to your offspring after you I will give the land.
translation:
  language: ta
  text: ஆபிரகாமுக்கும் ஈசாக்குக்கும் நான் கொடுத்த[a] நாட்டை உனக்குக் கொடுப்பேன்; உனக்குப் பிறகு உன் சந்ததிக்கு[b] அந்த நாட்டைக் கொடுப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் கொடுத்திருக்கிறேன்.”
    reason: lexical_alternative
  - marker: b
    text: “சந்ததி” என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் ஒருமை வடிவில் இருந்தாலும் ஒரு கூட்டத்தைக் குறிக்கிறது; அதை “வித்து” அல்லது “வழித்தோன்றல்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: இங்கு אֶרֶץ என்பது முற்பிதாக்களுக்கு வாக்களிக்கப்பட்ட குறிப்பிட்ட நாட்டைக் குறிக்கிறது. ‘பூமி’ என்பதைவிட ‘நாடு’ சூழலுக்குப் பொருத்தமாகவும், நவீனத் தமிழில் இயல்பாகவும் உள்ளது.
- source_word: נָתַתִּי
  choice: நான் கொடுத்த
  rationale: எபிரெய நிறைவுற்ற வினைவடிவம் ஆபிரகாமுக்கும் ஈசாக்குக்கும் முன்பு அளிக்கப்பட்ட இறை வாக்குறுதியைச் சுட்டுவதால், இறந்தகாலமாக மொழிபெயர்க்கப்பட்டது. தொடர்ந்திருக்கும் விளைவை வலியுறுத்தும் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לְאַבְרָהָם וּלְיִצְחָק
  choice: ஆபிரகாமுக்கும் ஈசாக்குக்கும்
  rationale: இரு பெயர்களுடனும் மீண்டும் வரும் לְ முன்னிடைச்சொல்லின் பகிர்ந்த பெறுநர் அமைப்பைத் தமிழின் ‘-க்கும் ... -க்கும்’ வடிவம் இயல்பாகப் பாதுகாக்கிறது.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: உனக்குக் கொடுப்பேன்
  rationale: வினையுடன் சேர்ந்துள்ள பெண்பால் ஒருமை சுட்டுப்பெயர் முன் கூறப்பட்ட நாட்டைக் குறிக்கிறது. தமிழில் அதை மீண்டும் சொல்லாமல் இவ்வாறு அமைப்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: זַרְעֲךָ
  choice: உன் சந்ததி
  rationale: זֶרַע என்பது ஒருமை வடிவிலுள்ள கூட்டுப்பொருள் சொல். ‘சந்ததி’ அந்தக் கூட்டுப்பொருளைப் பாதுகாப்பதுடன், ‘வித்து’ என்பதைவிட இச்சூழலில் நவீன வாசகருக்கு இயல்பாக உள்ளது.
- source_word: אַחֲרֶיךָ
  choice: உனக்குப் பிறகு
  rationale: யாக்கோபுக்குப் பின்வரும் காலத்தையும் தலைமுறையையும் குறிக்கும் எளிய நேர்ப்பொருள் தமிழில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֶתֵּן אֶת הָאָרֶץ
  choice: அந்த நாட்டைக் கொடுப்பேன்
  rationale: எபிரெயத்தில் ‘கொடுப்பேன்’ என்பதும் ‘நாடு’ என்பதும் மீண்டும் வருவது போலவே, சந்ததிக்கான வாக்குறுதி தனியே மீண்டும் கூறப்பட்டுள்ளது. தமிழில் முன்பு குறிப்பிடப்பட்ட நாட்டை இயல்பாகச் சுட்ட ‘அந்த’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: முற்பிதாக்களுக்கான நாட்டின் வாக்குறுதியில் கடந்தகாலக் கொடையும் எதிர்காலக் கொடையும் கொண்டுள்ள தொடர்பு
  choice: נָתַתִּי என்பதை ‘நான் கொடுத்த’ என்றும், அடுத்த வினைகளை ‘கொடுப்பேன்’ என்றும் மொழிபெயர்த்து, முன்பு அளிக்கப்பட்ட கொடைக்கும் எதிர்கால நிறைவேற்றத்திற்கும் இடையிலான பதற்றத்தைப் பாதுகாத்தல்.
  alternative: נָתַתִּי என்பதை ‘நான் கொடுத்திருக்கிற’ என்று மொழிபெயர்த்து, வாக்குறுதியின் தொடரும் செல்லுபடியை முன்னிறுத்துதல்.
  rationale: எபிரெய உரை முன்பு நிகழ்ந்த இறை அருளையும் யாக்கோபுக்கும் அவனுடைய சந்ததிக்கும் இனி அளிக்கப்படும் கொடையையும் அடுத்தடுத்து வைக்கிறது. இவ்விரண்டையும் ஒரே காலநிலைக்குள் சீராக்காமல் உரையின் கால மற்றும் இறையியல் பதற்றம் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தேசம்’ என்பதற்குப் பதிலாக இயல்பான ‘நாடு’ தேர்ந்தெடுக்கப்பட்டது; வாக்குறுதியின் மீளுரையும் கடந்தகால–எதிர்கால வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
