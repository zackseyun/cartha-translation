translation:
  language: ta
  text: 'ராகேலின் மகன்கள்: யோசேப்பும் பென்யமீனும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: בֵּן என்பதன் பன்மை இணைப்புநிலை வடிவம்; இங்கு ராகேலின் ஆண் பிள்ளைகளான இருவரை அறிமுகப்படுத்துவதால், ‘மகன்கள்’ என்பது நேரடியும் துல்லியமும் ஆன மொழிபெயர்ப்பு.
- source_word: רָחֵל
  choice: ராகேல்
  rationale: எபிரெய தனிப்பெயரை நவீனத் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற வழக்கமான வடிவில் ஒலிபெயர்த்தது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் நிலைபெற்றுள்ள வழக்கமான வடிவில் ஒலிபெயர்த்தது.
- source_word: וּ/בִנְיָמִן
  choice: பென்யமீனும்
  rationale: וּ என்ற இணைப்பை தமிழ் பட்டியல் அமைப்புக்கு இயல்பான ‘-உம்’ விகுதியால் காட்டி, בִנְיָמִן என்ற பெயரை ‘பென்யமீன்’ என்று ஒலிபெயர்த்தது.
theological_decisions: []
translation_notes:
  register: 'சுருக்கமான வம்சவரலாற்றுப் பட்டியல் நடையைப் பேணும் வகையில், இயல்பானவும் கண்ணியமானவும் உள்ள நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் ‘X-இன் மகன்கள்: A மற்றும் B’ என்ற அமைப்பு, தமிழில் ‘X-இன் மகன்கள்: A-உம் B-உம்’ என இயல்பாக வழங்கப்பட்டுள்ளது.'
