base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/010.yaml
  text: And God said to him[a], “Your name is Jacob. Your name will no longer be called Jacob, but Israel will be your name.” So he called his name Israel.
translation:
  language: ta
  text: தேவன் அவனிடம், “உன் பெயர் யாக்கோபு. இனி உன் பெயர் யாக்கோபு என்று அழைக்கப்படாது; இஸ்ரவேல் என்பதே உன் பெயராக இருக்கும்” என்றார். பின்பு அவர் அவனுக்கு இஸ்ரவேல் என்று பெயரிட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு நெருக்கமாக: “அவர் அவனுடைய பெயரை இஸ்ரவேல் என்று அழைத்தார்.” இதை “அவர் அவனை இஸ்ரவேல் என்று அழைத்தார்” என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
