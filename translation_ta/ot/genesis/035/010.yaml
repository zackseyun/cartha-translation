  rationale: எபிரெயப் பெயரிடும் சூத்திரத்தின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; அதன் சொற்சொல் வடிவம் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
