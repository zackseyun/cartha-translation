theological_decisions:
- issue: பழைய பெயர் பின்னர் முற்றிலும் பயன்படுத்தப்படவே கூடாது என்று மிகைப்படுத்தாமல் தெய்வீக மறுபெயரிடும் அறிவிப்பை மொழிபெயர்த்தல்
  choice: இனி உன் பெயர் யாக்கோபு என்று அழைக்கப்படாது; இஸ்ரவேல் என்பதே உன் பெயராக இருக்கும்
  alternative: இனிமேல் நீ யாக்கோபு எனப்படாமல் இஸ்ரவேல் எனப்படுவாய்
  rationale: எபிரெய உரையின் முறையான மறுபெயரிடும் அறிவிப்பின் வலிமையை அப்படியே காக்கிறது. பின்னர் கதைப்பகுதியில் ‘யாக்கோபு’ மீண்டும் பயன்படுத்தப்படுவதைக் கொண்டு இவ்வசனத்தை மென்மைப்படுத்தவோ, அந்தத் தோற்ற முரண்பாட்டை விளக்கிச் சமரசப்படுத்தவோ இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அழைக்கப்படாது’ என்ற செயலப்பாட்டு வடிவம் மூலத்தின் பெயரிடும் மொழியைத் தக்கவைக்கிறது; ‘என்பதே’ புதிய பெயரின் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
