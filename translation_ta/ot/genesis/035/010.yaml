  choice: தேவன்
  rationale: பன்மை வடிவத் தோற்றம் இருந்தாலும், ஒருமை வினையுடன் இங்கு ஒரே தேவனையே குறிக்கிறது; நவீனத் தமிழில் மரியாதையும் இயல்பும் கொண்ட ஒருமை வடிவம்.
- source_word: שִׁמְךָ
  choice: உன் பெயர்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டுடன் உள்ள பெயர்ச்சொல்லின் நேரடியான மொழிபெயர்ப்பு; எபிரெய உரையின் வலியுறுத்தலைக் காக்க மீண்டும் கூறப்பட்டுள்ளது.
- source_word: לֹא יִקָּרֵא ... עוֹד
  choice: இனி ... என்று அழைக்கப்படாது
  rationale: பெயரால் அழைக்கப்படுவதைச் சுட்டும் செயலப்பாட்டு வடிவத்தையும், לֹא ... עוֹד தரும் ‘இனிமேல் இல்லை’ என்ற பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי אִם
