  text: So Jacob came to Luz (that is[a], Bethel), which is in the land of Canaan, he and all the people who were with him.
translation:
  language: ta
  text: யாக்கோபும் அவனோடு இருந்த மக்கள் அனைவரும் கானான் நாட்டிலுள்ள லூசுக்கு வந்தார்கள்; அதாவது பெத்தேல்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய உரை பழைய இடப்பெயரான ‘லூஸ்’ என்பதையும், அதுவே நன்கு அறியப்பட்ட ‘பெத்தேல்’ என்பதையும் சேர்த்துக் குறிப்பிடுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்தார்கள்
  rationale: בוא என்பதன் Qal wayyiqtol வடிவம் வந்து சேர்வதைக் குறிக்கிறது. யாக்கோபையும் அவனுடன் இருந்த அனைவரையும் இணைத்துத் தமிழில் இயல்பாகக் கூறுவதால் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: לוּזָה
  choice: லூசுக்கு
  rationale: לוז என்ற இடப்பெயருடன் சேர்ந்த திசைச்சுட்டு ה, அந்த இடத்தை நோக்கிய நகர்வைக் காட்டுகிறது; தமிழில் வேற்றுமை உருபான ‘-க்கு’ இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: கானான் நாட்டிலுள்ள
  rationale: லூசின் புவியியல் இருப்பிடத்தைச் சுட்டும் சார்பு வாக்கியத்தைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
- source_word: הִוא בֵּית אֵל
  choice: அதாவது, பெத்தேலுக்கு
  rationale: லூசே பெத்தேல் என்ற விளக்க அடையாளத்தைத் தெளிவாக்குகிறது; இரு இடப்பெயர்களையும் மூலத்தைப் போலவே பாதுகாக்கிறது.
- source_word: הוּא וְכָל הָעָם אֲשֶׁר עִמּוֹ
  choice: யாக்கோபும் அவனோடு இருந்த மக்கள் அனைவரும்
  rationale: மூலத்தில் யாக்கோபை மீண்டும் சுட்டி, அவருடன் இருந்த முழுக் குழுவையும் சேர்க்கும் அமைப்பு உள்ளது. தமிழில் இயல்பான கூட்டு எழுவாயாக இதை முன்வைத்துள்ளது; עָם இங்கு இனத்தைக் காட்டாமல் உடன் சென்ற மக்களைக் குறிக்கிறது.
