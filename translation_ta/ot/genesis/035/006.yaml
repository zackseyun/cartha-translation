translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயச் சொல்லமைப்பின் இறுதியில் வரும் எழுவாய் விளக்கத்தைத் தமிழின் இயல்பான கூட்டு எழுவாயாக முன்வைத்துள்ளோம்; இடப்பெயர்களின் இரட்டை அடையாளம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
