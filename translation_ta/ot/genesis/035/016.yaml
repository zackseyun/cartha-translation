translation_notes:
  register: நவீன பொதுத் தமிழில், மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. அரிய தூர அளவுச் சொற்றொடருக்கு துல்லியமற்ற ‘சிறிது தூரம்’ பயன்படுத்தப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறி ‘பெத்தேல்’ என்பதற்குப் பின் இருந்தாலும், அதன் உள்ளடக்கம் எப்ராத்/எப்ராத்தா என்ற மாற்றைப் பற்றியது என்பதால் தமிழில் உரிய இடப்பெயருக்குப் பின் குறியிடப்பட்டுள்ளது.
