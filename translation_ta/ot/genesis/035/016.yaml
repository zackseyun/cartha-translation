    issue: Redundant rendering of the travel verb
    rationale: “புறப்பட்டுப் பயணம் செய்தார்கள்” duplicates aspects of a single Hebrew verb, וַיִּסְעוּ. “புறப்பட்டார்கள்” is natural in this travel context and sufficiently conveys the narrative movement.
