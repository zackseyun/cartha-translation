source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מִ/בֵּ֣ית אֵ֔ל וַֽ/יְהִי ע֥וֹד כִּבְרַת הָ/אָ֖רֶץ לָ/ב֣וֹא אֶפְרָ֑תָה וַ/תֵּ֥לֶד רָחֵ֖ל וַ/תְּקַ֥שׁ בְּ/לִדְתָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/016.yaml
  text: Then they journeyed from Bethel[a], and when there was still some distance to go before reaching Ephrath, Rachel gave birth, and she had difficulty in childbirth.
translation:
  language: ta
  text: பின்பு அவர்கள் பெத்தேலிலிருந்து புறப்பட்டார்கள். எப்ராத்தை[a] அடைய இன்னும் சிறிது தூரம் இருந்தபோது, ராகேல் குழந்தை பெற்றாள்; அவளுக்குப் பிரசவம் கடினமாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எப்ராத்தா.’
    reason: எபிரெய இடப்பெயரின் வடிவத்திற்கான மாற்று ஒலிபெயர்ப்பு.
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டுப் பயணம் செய்தார்கள்
  rationale: נסע என்பது முகாமைவிட்டுப் புறப்பட்டு அடுத்த இடத்தை நோக்கிப் பயணம் செய்வதைக் குறிக்கிறது; இந்தத் தமிழ் சொற்றொடர் புறப்படுதல் மற்றும் பயணம் ஆகிய இரு நுணுக்கங்களையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִבֵּית אֵל
  choice: பெத்தேலிலிருந்து
  rationale: בית אל என்ற இடப்பெயர் நவீனத் தமிழில் அறியத்தக்க வகையில் ‘பெத்தேல்’ என ஒலிபெயர்க்கப்பட்டு, מִן முன்னொட்டின் பொருள் ‘-இலிருந்து’ எனக் கொடுக்கப்பட்டுள்ளது.
- source_word: וַיְהִי עוֹד כִּבְרַת הָאָרֶץ
  choice: இன்னும் சிறிது தூரம் இருந்தபோது
  rationale: כִּבְרַת הָאָרֶץ என்ற அரிய சொற்றொடர் துல்லியமான அளவைத் தெரிவிக்கவில்லை. எனவே அளவைக் கூடுதலாக நிர்ணயிக்காமல், இன்னும் கடக்க வேண்டிய ஓரளவு தூரம் இருந்தது என்ற கருத்து தரப்பட்டுள்ளது.
- source_word: לָבוֹא אֶפְרָתָה
  choice: எப்ராத்தை அடைய
  rationale: לָבוֹא இலக்கை அடைவதைக் குறிக்கிறது; அங்கு இன்னும் சென்றடையவில்லை என்ற சூழலைத் தமிழில் இயல்பாகத் தர ‘அடைய’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶפְרָתָה
  choice: எப்ராத்
  rationale: இறுதியிலுள்ள ה திசை அல்லது இலக்கு உணர்த்தும் பின்னொட்டாகப் புரிந்துகொள்ளப்படலாம்; ஆகவே இடப்பெயரின் அடிப்படை வடிவம் ‘எப்ராத்’ என முதன்மை உரையில் தரப்பட்டு, ‘எப்ராத்தா’ மாற்று ஒலிபெயர்ப்பாக அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַתֵּלֶד רָחֵל
  choice: ராகேல் குழந்தை பெற்றாள்
  rationale: ילד என்பதன் பெண் எழுவாய் கொண்ட Qal வடிவம் குழந்தை பெறுதலைக் குறிக்கிறது. ‘குழந்தை பெற்றாள்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: וַתְּקַשׁ בְּלִדְתָּהּ
  choice: அவளுக்குப் பிரசவம் கடினமாக இருந்தது
  rationale: קשה இங்கு பிரசவத்தின் கடுமையையும் சிரமத்தையும் குறிக்கிறது. மூலத்தில் இல்லாத மருத்துவ விவரங்களைச் சேர்க்காமல் அந்தக் கடினத்தன்மையை நேரடியாகத் தெரிவிக்கிறது.
