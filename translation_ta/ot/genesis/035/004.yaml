base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/004.yaml
  text: So they gave Jacob all the foreign gods that were in their hands[a], and the rings that were in their ears[b], and Jacob hid them under the terebinth that was near Shechem.
translation:
  language: ta
  text: அப்போது அவர்கள் தங்களிடம் இருந்த அந்நிய தெய்வங்கள் அனைத்தையும், தங்கள் காதுகளில் இருந்த வளையங்கள்[a]யும் யாக்கோபிடம் கொடுத்தார்கள். யாக்கோபு அவற்றைச் சீகேமுக்கு அருகிலிருந்த டெரிபிந்த் மரத்தின்[b] அடியில் மறைத்து வைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “காதணிகள்.” எபிரெயச் சொல் உடலின் வெவ்வேறு இடங்களில் அணியும் வளையங்களைக் குறிக்கலாம்; இங்கு தொடர்ந்து வரும் சொற்றொடர் அவை காதுகளில் இருந்ததாகக் குறிப்பிடுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “ஓக் மரம்.” எபிரெயச் சொல் இன்னும் குறிப்பாக டெரிபிந்த் வகை மரத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ אֶל־יַעֲקֹב
  choice: அப்போது ... யாக்கோபிடம் கொடுத்தார்கள்
  rationale: Wayyiqtol வடிவின் கதைத் தொடர்ச்சியை இயல்பான தமிழில் “அப்போது” காட்டுகிறது; אֶל மறைமுகப் பெறுநராகிய யாக்கோபைக் குறிக்கிறது.
- source_word: כָּל אֱלֹהֵי הַנֵּכָר
  choice: அந்நிய தெய்வங்கள் அனைத்தையும்
  rationale: இது பிற வழிபாட்டைச் சேர்ந்த தெய்வங்களையோ அவற்றின் உருவங்களையோ குறிக்கிறது. மூலத்தில் உள்ள பொதுவான சொல்லாட்சியைத் தக்கவைத்து, அவை எத்தகைய பொருள்கள் என்பதை மொழிபெயர்ப்பு மேலதிகமாகத் தீர்மானிக்கவில்லை.
- source_word: אֲשֶׁר בְּיָדָם
  choice: தங்களிடம் இருந்த
  rationale: எபிரெயத்தில் எழுத்துப்படி “அவர்களுடைய கையில் இருந்த” என வந்தாலும், உடைமை அல்லது வசம் இருப்பதைக் குறிக்கும் அந்த மரபுத்தொடரை இயல்பான நவீன தமிழில் “தங்களிடம் இருந்த” என்று வழங்குகிறது.
- source_word: הַנְּזָמִים אֲשֶׁר בְּאָזְנֵיהֶם
  choice: தங்கள் காதுகளில் இருந்த வளையங்கள்
  rationale: נְזָמִים என்பது பல இடங்களில் அணியும் வளையங்களைக் குறிக்கக்கூடும்; இங்கு அடுத்த சொற்றொடரே அவை காதுகளில் இருந்தன என்று தெளிவுபடுத்துவதால் “வளையங்கள்” எனப் பொதுவாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיִּטְמֹן אֹתָם
  choice: அவற்றை ... மறைத்துவைத்தான்
  rationale: טמן என்பதற்கு மறைத்தல், ஒளித்துவைத்தல் அல்லது புதைத்தல் என்ற பொருள்கள் உண்டு. பொருள்களை நிலத்தில் புதைத்தார் என்று மூலத்தைவிடக் குறிப்பாகக் கூறாமல், அதன் பரந்த பொருளை இத்தேர்வு காக்கிறது.
- source_word: תַּחַת הָאֵלָה
  choice: டெரிபிந்த் மரத்தின் அடியில்
  rationale: אֵלָה பெரும்பாலும் டெரிபிந்த் வகை மரத்தைக் குறிக்கிறது. பாரம்பரியமாகக் காணப்படும் “கர்வாலி/ஓக்” என்பதைக் காட்டிலும் தாவரவியல் அடையாளத்தை நெருக்கமாகக் காட்ட “டெரிபிந்த்” தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר עִם שְׁכֶם
  choice: சீகேமுக்கு அருகிலிருந்த
  rationale: இடப்பெயருடன் வரும் עִם இங்கு அண்மை அல்லது அருகாமையைக் குறிக்கிறது; “அருகிலிருந்த” என்பது இயல்பான தமிழ் இடவியல் நடை.
theological_decisions:
- issue: ஒப்படைக்கப்பட்ட வளையங்களுக்கும் அந்நிய வழிபாட்டுக்கும் இருந்த தொடர்பு
  choice: அந்நிய தெய்வங்களையும் காதுகளில் இருந்த வளையங்களையும் தனித்தனி பொருள்களாக மட்டும் குறிப்பிடுதல்
  alternative: வளையங்களே விக்கிரக வழிபாட்டுச் சின்னங்கள் அல்லது மந்திரக் காப்புகள் என்று வெளிப்படையாகக் கூறுதல்
  rationale: அந்நிய தெய்வங்கள் ஒப்படைக்கப்பட்டதாக வசனம் தெளிவாகக் கூறுகிறது; ஆனால் வளையங்கள் இயல்பிலேயே வழிபாட்டுப் பொருள்களா அல்லது முந்தைய நடைமுறையோடு தொடர்புடைய அணிகலன்களா என்பதை அது விளக்கவில்லை. அந்தத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரமான தமிழில் எளிதாகப் புரியும், ஆனால் வேதாகம உரைக்கு ஏற்ற கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. “டெரிபிந்த்” பொதுவழக்கில் அரிதாக இருப்பதால் மாற்றுப் பெயர் அடிக்குறிப்பில் தரப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் அவை விளக்கும் சொற்களுக்குப் பின்பே இடம்பெற்றுள்ளன.
