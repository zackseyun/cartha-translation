  text: Then Israel journeyed on and pitched his tent beyond Migdal-eder[a].
translation:
  language: ta
  text: பின்பு இஸ்ரவேல் பயணத்தைத் தொடர்ந்து, மிக்தால்-ஏதெர்[a]க்கு அப்பால் தன் கூடாரத்தை விரித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மிக்தால்-ஏதெர்” என்பதன் பொருள் “மந்தையின் கோபுரம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: அங்கிருந்து புறப்பட்டு
  rationale: נסע என்பது முகாமைக் கலைத்துவிட்டுப் பயணத்தைத் தொடர்வதைக் குறிக்கிறது. முந்தைய இடத்திலிருந்து அவர் தொடர்ந்து சென்றார் என்ற தொடர் நிகழ்வை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: எபிரெய உரை ‘யாக்கோபு’ என்பதற்குப் பதிலாக ‘இஸ்ரவேல்’ என்ற பெயரையே பயன்படுத்துவதால் அதையே மொழிபெயர்ப்பு பேணுகிறது.
- source_word: וַיֵּט
  choice: அமைத்தார்
  rationale: கூடாரத்தைச் செயப்படுபொருளாகக் கொண்டபோது נטה என்பது அதை விரித்துப் போடுதல் அல்லது நிறுவுதல், அதாவது ‘கூடாரம் அமைத்தல்’ எனப் பொருள்படும். ‘அமைத்தார்’ என்பது இயல்பான நவீனத் தமிழ் வழக்கு.
- source_word: אָהֳלֹה
  choice: தன் கூடாரத்தை
  rationale: אֹהֶל என்பது ‘கூடாரம்’; மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதி ‘அவருடைய’ என்ற பொருளைத் தருகிறது. தமிழில் எழுவாயைத் திரும்பச் சுட்ட ‘தன்’ இயல்பாக உள்ளது.
- source_word: מֵהָלְאָה
  choice: அப்பால்
  rationale: הלאה என்பது ஒரு குறிக்கப்பட்ட இடத்தைத் தாண்டி மேலும் அப்புறம் உள்ள இடத்தைக் குறிக்கிறது; இச்சூழலில் ‘அப்பால்’ அதன் இடவியல் பொருளைச் சுருக்கமாகப் பேணுகிறது.
- source_word: לְמִגְדַּל עֵדֶר
  choice: மிக்தால்-ஏதேருக்கு
  rationale: இத்தொடர் இங்கு இடப்பெயராகச் செயல்படுவதால் ஒலிபெயர்க்கப்பட்டுள்ளது. அதன் சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
