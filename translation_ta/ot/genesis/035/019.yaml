lexical_decisions:
- source_word: וַתָּמָת
  choice: இறந்தாள்
  rationale: מות என்பதன் நேரடியான பொருள் உடல்சார்ந்த மரணம்; பெண்பால் எழுவாயான ராகேலுக்கு ஏற்ப இயல்பான தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: רָחֵל
  choice: ராகேல்
  rationale: தனிப்பெயர் நவீனத் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு முறையில் வழங்கப்பட்டது.
- source_word: וַתִּקָּבֵר
  choice: அவள் அடக்கம் செய்யப்பட்டாள்
  rationale: קבר வினையின் நிஃபால் வடிவிலுள்ள செயப்பாட்டு பொருளைத் தெளிவாகப் பாதுகாக்கிறது; எபிரெயத்தில் இல்லாத ‘அங்கே’ சேர்க்கப்படவில்லை.
- source_word: בְּדֶרֶךְ
  choice: போகும் வழியில்
  rationale: ב முன்னொட்டுடன் வரும் דרך இங்கு ஒரு பாதையோர அல்லது பயணவழி இருப்பிடத்தைக் குறிக்கிறது; இலக்கைச் சேர்த்து ‘எப்ராத்துக்குப் போகும் வழியில்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: אֶפְרָתָה
  choice: எப்ராத்
  rationale: இடப்பெயரின் சுருக்கமான பாரம்பரிய வடிவம் முதன்மை உரையில் பயன்படுத்தப்பட்டது; ‘எப்ராத்தா’ என்ற மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டது.
- source_word: הִוא
  choice: என்பது
  rationale: எப்ராத்தை பெத்லகேமுடன் அடையாளப்படுத்தும் விளக்கச் சார்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בֵּית לָחֶם
  choice: பெத்லகேம்
  rationale: இடப்பெயரின் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு.
