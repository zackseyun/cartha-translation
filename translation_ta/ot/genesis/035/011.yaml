  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֱלֹהִ֜ים אֲנִ֨י אֵ֤ל שַׁדַּי֙ פְּרֵ֣ה וּ/רְבֵ֔ה גּ֛וֹי וּ/קְהַ֥ל גּוֹיִ֖ם יִהְיֶ֣ה מִמֶּ֑/ךָּ וּ/מְלָכִ֖ים מֵ/חֲלָצֶ֥י/ךָ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/011.yaml
  text: And God said to him[a], “I am God Almighty. Be fruitful and multiply. A nation and an assembly of nations shall come from you[c][b], and kings shall come from your loins.”
translation:
  language: ta
  text: கடவுள் அவனிடம், “நான் எல்லாம் வல்ல இறைவன்[a]. நீ பலுகிப் பெருகு. ஒரு தேசமும் தேசங்களின் கூட்டமும் உன்னிடமிருந்து தோன்றும்[b]; அரசர்கள் உன் சொந்த உடலிலிருந்து தோன்றுவார்கள்[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் “எல் ஷத்தாய்.” இந்த இறைப்பட்டத்தின் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை; பாரம்பரியமாக “எல்லாம் வல்ல இறைவன்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “தேசங்களின் கூட்டம்” என்பதை “தேசங்களின் சபை” அல்லது “தேசங்களின் குழு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, “உன் இடுப்புகளிலிருந்து”; இது ஒருவருடைய சொந்த உடல்வழிச் சந்ததியைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: ஒருமை வினையுடனும் உரையாடல் சூழலுடனும் வருவதால், இங்கு இஸ்ரவேலின் கடவுளைக் குறிக்கும் ஒருமைப் பட்டமாக மொழிபெயர்க்கப்பட்டது.
- source_word: אֵל שַׁדַּי
  choice: எல்லாம் வல்ல இறைவன்
  rationale: இது ஒரு இறைப்பட்டம். அதன் பொருள் முற்றிலும் உறுதியானதல்ல என்றாலும், பாரம்பரியமாகவும் இச்சூழலில் இயல்பாகவும் புரிந்துகொள்ளப்படும் பொருளை முதன்மை உரை தருகிறது; எபிரேய வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: פְּרֵה וּרְבֵה
  choice: நீ பலுகிப் பெருகு
  rationale: இரண்டும் ஆண்பால் ஒருமை ஏவல் வினைகள். படைப்பு மற்றும் முற்பிதாக்களின் ஆசீர்வாதச் சூத்திரத்தை நினைவூட்டும் சுருக்கமான, வழக்கமான தமிழ் நடை இது.
- source_word: גּוֹי
  choice: ஒரு தேசம்
  rationale: முற்பிதாக்களுக்கு அளிக்கப்படும் வாக்குறுதியின் சூழலில், ஒழுங்குபெற்ற ஒரு மக்களினத்தை இது குறிக்கிறது; ‘தேசம்’ நேரடியான இணைச்சொல்.
- source_word: קְהַל גּוֹיִם
  choice: தேசங்களின் கூட்டம்
  rationale: קהל என்பது கூடிவந்த குழு, சபை அல்லது கூட்டத்தைக் குறிக்கலாம். ‘கூட்டம்’ அந்த விரிவைத் தக்கவைத்தபடி நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: יִהְיֶה מִמֶּךָּ
  choice: உன்னிடமிருந்து தோன்றும்
  rationale: சொல்லுக்கு நெருக்கமாக ‘உன்னிடமிருந்து இருக்கும்’ என்றாலும், இங்கு வம்சத் தோற்றமே கருத்தாக இருப்பதால் ‘தோன்றும்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: מְלָכִים
  choice: அரசர்கள்
  rationale: இச்சொல் நேரடியாக அரசர்களைக் குறிக்கிறது; விரிவாக்கம் தேவையில்லை.
- source_word: מֵחֲלָצֶיךָ
  choice: உன் சொந்த உடலிலிருந்து
  rationale: எபிரேயத்தில் சொல்லர்த்தமாக ‘உன் இடுப்புகளிலிருந்து’ என்று வரும் உடல்வழி வம்ச மரபைக் குறிக்கும் மரபுத்தொடர். தமிழில் அதன் உடல்சார்ந்த, நேரடி சந்ததி என்ற பொருளை இயல்பாக வெளிப்படுத்த இவ்வாறு தரப்பட்டது.
- source_word: יֵצֵאוּ
  choice: தோன்றுவார்கள்
  rationale: இங்கு இடம்விட்டு வெளியே செல்வது அல்ல, யாக்கோபின் உடல்வழி அரசர்கள் பிறப்பதே கருத்து; ஆகவே ‘தோன்றுவார்கள்’ பொருத்தமானது.
theological_decisions:
- issue: אֵל שַׁדַּי என்ற இறைப்பட்டத்தின் மொழிபெயர்ப்பு
  choice: எல்லாம் வல்ல இறைவன்
  alternative: எல் ஷத்தாய்
  rationale: பட்டத்தின் துல்லியமான சொற்பிறப்பும் பொருளும் விவாதத்திற்குரியவை. முதன்மை உரையில் பாரம்பரியமான பொருள் மொழிபெயர்க்கப்பட்டாலும், மூல வடிவமும் நிச்சயமின்மையும் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
- issue: வாக்குறுதியில் உடல்வழி வம்சத்தின் உருவகம்
  choice: உன் சொந்த உடலிலிருந்து
  alternative: உன் இடுப்புகளிலிருந்து
  rationale: வாக்குறுதி நேரடியான உடல்வழிச் சந்ததியைப் பற்றியது. தமிழில் தேவையற்ற உடற்கூறு அசட்டுத்தன்மையைத் தவிர்த்தும் அந்த வம்சரீதியான உறுதியைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டது; சொல்லர்த்த வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: קְהַל גּוֹיִם என்பதன் கூட்டு இயல்பு
  choice: தேசங்களின் கூட்டம்
  alternative: தேசங்களின் சபை
  rationale: இச்சொல் கூடிவந்த தொகுதி, சபை அல்லது கூட்டம் என்ற பொருள் வரம்பைக் கொண்டது. ஒரு குறிப்பிட்ட சமய அமைப்பை உணர்த்தாமல் மூலத்தின் பொதுவான கூட்டுப்பொருளை ‘கூட்டம்’ பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகம வாக்குறுதியின் செறிவும் தக்கவைக்கப்பட்டுள்ளன. ‘பலுகிப் பெருகு’ ஆசீர்வாதச் சூத்திரத்தின் பரிச்சயமான ஓசையைப் பேணுகிறது. ‘தேசங்களின் கூட்டம்’ சமயப் பிரிவுசார்ந்த ‘சபை’ என்ற சொல்லைத் தவிர்த்து, மூலத்தின் கூட்டுப்பொருளை வெளிப்படுத்துகிறது.
