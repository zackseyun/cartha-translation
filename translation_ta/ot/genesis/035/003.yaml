  source_fidelity: மூல எபிரெயத்தின் இரு ஊக்கவுரை வினைகளும் (‘நாம் எழுந்து … போவோம்’) இயல்பாகத் தரப்பட்டுள்ளன. பெத்தேல் இடப்பெயராகவே உள்ளது; பலிபீடம் கடவுளுக்கு அமைக்கப்படுவது, துயர நாளில் கிடைத்த பதில், பயணவழியில் இருந்த உடனிருப்பு ஆகிய அனைத்தும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. עלה-வின் ‘மேலே’ என்ற இடவியல் நுணுக்கம் தமிழில் விடப்பட்டாலும், ‘பெத்தேலுக்குப் போவோம்’ என்பது பாதுகாப்பான, இயல்பான மொழிபெயர்ப்பு; பொருளை மாற்றுவதில்லை.
