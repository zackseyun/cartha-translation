base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/003.yaml
  text: Let us rise and go up to Bethel[a], and there I will make an altar to the God who answered me in the day of my distress and was with me on the way that I went.
translation:
  language: ta
  text: நாம் எழுந்து பெத்தேலுக்குப் போவோம். என் துயர நாளில் எனக்குப் பதிலளித்து, நான் சென்ற வழியில் என்னோடு இருந்த கடவுளுக்கு அங்கே ஒரு பலிபீடத்தை அமைப்பேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எனக்குப் பதிலளிக்கிற கடவுள்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயப் பங்கேற்புவினை கடவுளின் வழக்கமான அல்லது தொடரும் செயலைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָקוּמָה
  choice: நாம் எழுந்து
  rationale: முதல் நபர் பன்மை ஊக்கவுரையின் விருப்பத் தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְנַעֲלֶה
  choice: போவோம்
  rationale: עלה என்பதில் உயரே செல்லும் இடவியல் நுணுக்கம் இருந்தாலும், தமிழில் ‘பெத்தேலுக்குப் போவோம்’ என்பது இயல்பானது; ‘மேலே போவோம்’ இங்கு தேவையற்ற திசைத் தெளிவின்மையை உண்டாக்கலாம்.
- source_word: בֵּית אֵל
  choice: பெத்தேல்
  rationale: இது ஓர் இடப்பெயர்; பொருள் மொழிபெயர்ப்புக்கு பதிலாக தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְאֶעֱשֶׂה שָּׁם מִזְבֵּחַ
  choice: அங்கே ஒரு பலிபீடத்தை அமைப்பேன்
  rationale: עשה என்பதன் பொதுவான ‘செய்’ பொருளை, பலிபீடத்துடன் இயல்பாக வரும் தமிழ் வினையான ‘அமை’ மூலம் வழங்குகிறது.
- source_word: לָאֵל
  choice: கடவுளுக்கு
  rationale: לְ அர்ப்பணிப்பு அல்லது நோக்கைச் சுட்டுகிறது; தொடரும் உறவுச்சொற்றொடர் எந்தக் கடவுளைக் குறிக்கிறது என்பதைத் தெளிவுபடுத்துகிறது.
- source_word: הָעֹנֶה אֹתִי
  choice: எனக்குப் பதிலளித்து
  rationale: எபிரெயப் பங்கேற்புவினை குறிப்பிட்ட கடந்தகால அனுபவத்தையும், கடவுளின் பண்புசார் செயலைவும் சுமக்கலாம்; பிரதான உரை சூழலின் கடந்தகால நினைவைக் காட்டுகிறது.
- source_word: בְּיוֹם צָרָתִי
  choice: என் துயர நாளில்
  rationale: ‘என் நெருக்கடியின் நாளில்’ என்ற சொற்படியான வடிவத்தைவிட இயல்பாக இருந்து, צָרָה குறிக்கும் துன்பம் அல்லது நெருக்கடியைத் தக்கவைக்கிறது.
- source_word: וַיְהִי עִמָּדִי
  choice: என்னோடு இருந்த
  rationale: கடந்தகாலத்தில் கடவுளின் உடனிருப்பை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלָכְתִּי
  choice: நான் சென்ற வழியில்
  rationale: דרך மற்றும் הלך ஆகியவற்றின் வழி/செல்லுதல் உருவகத்தைச் சுருக்கமான இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: யாக்கோபின் உரையில் אֵל என்பதன் குறிப்பு
  choice: கடவுளுக்கு
  alternative: அந்தக் கடவுளுக்கு
  rationale: எபிரெயத்தில் வரையறுக்கும் பங்கேற்புவினைத் தொடர் குறிப்பிட்ட கடவுளை அடையாளப்படுத்துகிறது. தமிழில் ‘எனக்குப் பதிலளித்து... இருந்த கடவுளுக்கு’ என்ற அமைப்பே அந்தத் தனித்த குறிப்பை இயல்பாகத் தருகிறது; ‘அந்தக் கடவுள்’ என்பது தேவையற்ற தூரச்சுட்டாக ஒலிக்கலாம்.
- issue: הָעֹנֶה என்பதன் காலநிலை
  choice: எனக்குப் பதிலளித்து
  alternative: எனக்குப் பதிலளிக்கிற
  rationale: உடனடிச் சூழல் யாக்கோபின் முந்தைய நெருக்கடியில் நிகழ்ந்த பதிலை நினைவுகூர்கிறது. இருப்பினும் எபிரெயப் பங்கேற்புவினை வழக்கமான அல்லது தொடரும் செயலைக் குறிக்கவும் முடியும்; அந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘பெத்தேல்’ இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது. எபிரெயப் பங்கேற்புவினையின் உண்மையான காலத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
