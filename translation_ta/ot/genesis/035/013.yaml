  text: Then God went up from him in the place where he had spoken with him[a].
translation:
  language: ta
  text: கடவுள் அவனுடன் பேசிய அந்த இடத்தில், அவனைவிட்டு மேலே சென்றார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனைவிட்டு ஏறிச் சென்றார்.’ கடவுள் புறப்பட்டதை மேல்நோக்கிய இயக்கத்துடன் எபிரெய மொழி விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: மேலே சென்றார்
  rationale: קַל வடிவிலுள்ள עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்/ஏறு.’ கடவுள் சந்திப்பிலிருந்து நீங்குவதைச் சொல்லும் இவ்விடத்தில், ‘நீங்கினார்’ என்று பொதுமைப்படுத்தாமல் எபிரெய உரையின் மேல்நோக்கிய இயக்கப் படிமத்தை இது காக்கிறது.
- source_word: מֵעָלָיו
  choice: அவனைவிட்டு
  rationale: இந்தச் சொல் நேரடியாக ‘அவன்மேலிருந்து/அவனுக்கு மேலிருந்து’ என்ற நுண்பொருளைக் கொண்டிருந்தாலும், இச்சூழலில் இயல்பான தமிழில் பிரிவைக் குறிக்க ‘அவனைவிட்டு’ என்று மொழிபெயர்க்கப்பட்டது; மேல்நோக்கிய இயக்கம் வினைச்சொல்லில் தனியே பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: சொல் வடிவில் பன்மைத் தோற்றம் இருந்தாலும், ஒருமை வினையுடன் வந்து இக்கதையில் ஒரே கடவுளைக் குறிக்கிறது.
- source_word: בַּמָּקוֹם
  choice: அந்த இடத்தில்
  rationale: בְּ இங்கு நிகழ்வு நடந்த இடத்தைக் குறிக்கிறது. முன் சூழலில் அறியப்பட்ட இடம் என்பதால் தமிழில் இயல்பாக ‘அந்த இடத்தில்’ என வழங்கப்பட்டது.
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ
  choice: அவனுடன் பேசிய
  rationale: דבר என்பதுடன் אֵת வருவதால் ‘அவனுடன் பேசினார்’ என்ற பொருள் இயல்பாகிறது. தமிழ் தொடர்பெயரெச்ச அமைப்பு இடத்தை விளக்கும் எபிரெய உறவுத்தொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: கடவுள் சந்திப்பிலிருந்து நீங்குவதை இடம்சார், மேல்நோக்கிய இயக்கமாக விவரித்தல்
  choice: ‘அவனைவிட்டு மேலே சென்றார்’ என்ற இடம்சார் மொழியைத் தக்கவைத்தல்
  alternative: ‘அவனைவிட்டு நீங்கினார்’
  rationale: எபிரெய உரை சாதாரணமாக மேலே செல்வதைக் குறிக்கும் வினையைப் பயன்படுத்துகிறது. அதைத் தக்கவைப்பது தெய்வத்தோற்றக் காட்சியின் படிமத்தைப் பாதுகாக்கிறது; கடவுளின் இருப்பைப் பற்றிய தத்துவ விளக்கத்தை உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதையுடனும் அமைக்கப்பட்டது. எபிரெய உரையிலுள்ள இரு ஆண்பால் ஒருமைப் பிரதிப்பெயர்களும் ‘அவன்’ என வைக்கப்பட்டுள்ளன; சூழலில் பேசுபவர் கடவுள், அவருடன் பேசப்பட்டவர் யாக்கோபு என்பது தெளிவாகிறது. மூலத்தில் இல்லாத பெயரை வசனத்துக்குள் சேர்க்கவில்லை.
