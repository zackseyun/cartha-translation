  to: யாக்கோபு தன் தந்தையான ஈசாக்கிடம், மம்ரே, அதாவது எப்ரோன் எனப்படும் கீரியாத்-அர்பாவுக்கு வந்தான். அங்கே ஆபிரகாமும் ஈசாக்கும் அந்நியர்களாகக் குடியிருந்தார்கள்.[a]
  rationale: மூலத்தில் மம்ரே, கீரியாத்-அர்பா, எப்ரோன் ஆகிய இடப்பெயர்களுக்கு இடையிலுள்ள அடையாள உறவைத் தெளிவுபடுத்தி, நவீனத் தமிழ் நடையைப் பேணும் வகையில் உறவுச்சொல்லும் அடிக்குறிப்பின் மொழிவடிவமும் சீரமைக்கப்பட்டன. வசனத்தின் பொருளோ, גור வினைச்சொல்லின் தற்காலிக/அந்நியக் குடியிருப்பு நுணுக்கமோ மாற்றப்படவில்லை.
