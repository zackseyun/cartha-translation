  yaml_path: translation/ot/genesis/035/027.yaml
  text: And Jacob came to Isaac his father at Mamre[a], Kiriath-arba (that is, Hebron), where Abraham and Isaac had sojourned.
translation:
  language: ta
  text: யாக்கோபு தன் தந்தையான ஈசாக்கிடம், மம்ரே, அதாவது எப்ரோன் எனப்படும் கீரியாத்-அர்பாவுக்கு வந்தான். அங்கே ஆபிரகாமும் ஈசாக்கும் அந்நியர்களாகக் குடியிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய வினைச்சொல், ஓர் இடத்தில் நிரந்தர உரிமையுடன் வாழ்வதை மட்டுமல்லாமல், அந்நியர் அல்லது தற்காலிகக் குடியிருப்பாளர் நிலையில் தங்கியிருப்பதையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்தான்
  rationale: בוא என்பது வருதல், செல்லுதல் அல்லது வந்தடைதல் எனச் சூழலுக்கேற்ப பொருள்படும் பொதுவான கதைநடை வினை. ஈசாக்கு இருந்த இடத்தை நோக்கிய யாக்கோபின் வருகையை இங்கு ‘வந்தான்’ இயல்பாகக் காட்டுகிறது.
- source_word: אֶל־יִצְחָק אָבִיו
  choice: தன் தகப்பனான ஈசாக்கிடம்
  rationale: திசையைக் குறிக்கும் אֶל என்பதையும், ஈசாக்கு யாக்கோபின் தகப்பன் என்பதையும் தெளிவாகவும் இயல்பான தமிழ் சொற்றொடரிலும் தருகிறது.
- source_word: מַמְרֵא קִרְיַת הָאַרְבַּע הִוא חֶבְרוֹן
  choice: மம்ரேக்கு—அதாவது, எப்ரோன் என்னும் கீரியாத்-அர்பாவுக்கு
  rationale: இடப்பெயர்களை ஒலிபெயர்த்து, הִוא חֶבְרוֹן தரும் விளக்க அடையாளத்தை ‘அதாவது’ மூலம் வெளிப்படுத்துகிறது. எப்ரோன் என்பது கீரியாத்-அர்பாவின் அடையாளப் பெயர் என்பது தமிழில் தெளிவாகிறது.
- source_word: אֲשֶׁר ... שָׁם
  choice: அங்கே
  rationale: இடத்தைச் சுட்டும் தொடர்புச் சொல் மற்றும் இடவினையுரிச்சொல்லின் பொருளை இயல்பான தமிழ் கதைநடையில் சுருக்கமாகத் தருகிறது.
- source_word: גָּר
  choice: அந்நியர்களாகக் குடியிருந்தார்கள்
  rationale: גור என்பது ஓர் இடத்தில் நிரந்தர உரிமையுடையவர்களாக அல்லாமல் அந்நியர் அல்லது தற்காலிகக் குடியிருப்பாளர் நிலையில் வாழ்வதைக் குறிக்கும். ‘வாழ்ந்தார்கள்’ என்பதைக் காட்டிலும் இந்தத் தேர்வு அந்த நுண்பொருளைப் பாதுகாக்கிறது.
