  source_fidelity: மூல எபிரேயத்தின் இடப்பெயர் இணைப்பு மம்ரே—கீரியாத்-அர்பா—எப்ரோன் என்ற அடையாளத் தொடர்பைத் தருகிறது. வரைவில் உள்ள «எப்ரோன் என்னும் கீரியாத்-அர்பா» என்ற சொற்றொடர் எப்ரோன் கீரியாத்-அர்பாவுக்கு வெறும் மற்றொரு பெயர் என மட்டும் அமைந்து, மம்ரேயுடனான மூலத்தின் இணைப்பைத் தெளிவிழக்கச் செய்கிறது. திருத்தம் அந்த அடையாள அமைப்பை நேரடியாகப் பாதுகாக்கிறது. גור என்பதன் ‘அந்நியர்/தற்காலிகக் குடியிருப்பாளர்’ நுணுக்கமும் காக்கப்பட்டுள்ளது.
  naturalness: «தன் தந்தையான ஈசாக்கிடம்» நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. திருத்தப்பட்ட இடப்பெயர்ச் சொற்றொடர் நீளமாகாமல், விளக்க இடைச்சொல்லுடன் தெளிவாக உள்ளது.
  terminology: யாக்கோபு, ஈசாக்கு, ஆபிரகாம், மம்ரே, கீரியாத்-அர்பா, எப்ரோன் ஆகிய ஒலிபெயர்ப்புகள் தொடர்ச்சியாக வைக்கப்பட்டுள்ளன. நவீன வழக்குக்கு «தகப்பன்» என்பதற்குப் பதில் «தந்தை» பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பில் «எபிரேய» என்ற நிலையான வடிவம் பயன்படுத்தப்பட்டுள்ளது.
