translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் உள்ள கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தகப்பன்’ வேதாகமத் தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் மரியாதையான உறவுச்சொல்லாக வைக்கப்பட்டுள்ளது. இடப்பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப தரப்பட்டுள்ளன; அடிக்குறிப்பு குறியீடு அது விளக்கும் வினைத்தொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
