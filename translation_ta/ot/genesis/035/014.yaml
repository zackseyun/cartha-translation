  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּצֵּ֨ב יַעֲקֹ֜ב מַצֵּבָ֗ה בַּ/מָּק֛וֹם אֲשֶׁר דִּבֶּ֥ר אִתּ֖/וֹ מַצֶּ֣בֶת אָ֑בֶן וַ/יַּסֵּ֤ךְ עָלֶ֨י/הָ֙ נֶ֔סֶךְ וַ/יִּצֹ֥ק עָלֶ֖י/הָ שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/014.yaml
  text: And Jacob set up a pillar in the place where he had spoken with him[a], a pillar of stone; and he poured out a drink offering on it[b], and he poured oil on it.
translation:
  language: ta
  text: யாக்கோபுடன் இறைவன் பேசிய இடத்தில் யாக்கோபு ஒரு தூணை—கல் தூணை—நாட்டினான். அதன்மேல் பானபலியை[a] ஊற்றினான்; அதன்மேல் எண்ணெயையும் ஊற்றினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, ஊற்றிச் செலுத்தப்படும் பானக் காணிக்கை.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: நாட்டினான்
  rationale: நிற்கும்படி அமைத்தல் என்ற ஹிப்இல் வினையின் பொருளை, கல் தூணை நிலைநிறுத்தும் செயலுக்குப் பொருத்தமான இயல்பான தமிழில் தருகிறது.
- source_word: מַצֵּבָה / מַצֶּבֶת אָבֶן
  choice: ஒரு தூணை—கல் தூணை—
  rationale: மַצֵּבָה என்பது நாட்டப்பட்ட கல் நினைவுச்சின்னம் அல்லது தூண். வசனமே அதன் பொருளை ‘கல்’ என்று குறிப்பிடுவதால், விளக்கப் பொருளைச் சேர்க்காமல் எபிரெயச் சொற்றொடரின் மறுபெயரிடலைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ
  choice: தன்னுடன் அவர் பேசிய
  rationale: பேசியவர் முந்தைய சூழலில் கடவுள் என்பதைக் கௌரவ ஒருமையான ‘அவர்’ இயல்பாகச் சுட்டுகிறது; ‘தன்னுடன்’ யாக்கோபைச் சுட்டுகிறது. மூலத்தில் பெயர் மீண்டும் கூறப்படாத அமைப்பும் பெருமளவில் காக்கப்படுகிறது.
- source_word: וַיַּסֵּךְ ... נֶסֶךְ
  choice: பானபலியை ஊற்றினான்
  rationale: நֶסֶךְ என்பது வழிபாட்டுச் செயலாக ஊற்றப்படும் பானக் காணிக்கை. ‘பானபலி’ துல்லியமான, தமிழில் அறியப்பட்ட சமயச் சொல்; அடிக்குறிப்பு அதன் பொருளை பொதுவாசகருக்கு விளக்குகிறது.
- source_word: וַיִּצֹק ... שָׁמֶן
  choice: எண்ணெயையும் ... வார்த்தான்
  rationale: இரண்டாவது ஊற்றும் செயலை இயல்பான தமிழில் வேறுபடுத்திக் காட்டுகிறது. மூலத்தில் இல்லாத ‘ஒலிவ எண்ணெய்’ என்ற குறிப்பைச் சேர்க்கவில்லை.
theological_decisions:
- issue: தூண் மற்றும் அதன்மேல் ஊற்றப்பட்ட பொருட்களின் சமயப் பொருள்
  choice: தூணை நாட்டுதல், பானபலியை ஊற்றுதல், எண்ணெயை வார்த்தல் ஆகிய செயல்களை விளக்கமின்றி விவரித்தல்
  alternative: இது தூணைப் புனிதப்படுத்தியது அல்லது இறைச்சந்திப்பை நினைவுகூர்ந்தது என்று வெளிப்படையாக விளக்குதல்
  rationale: இச்செயல்களின் நோக்கத்தை வசனம் நேரடியாக விளக்கவில்லை. ஆகவே பிரதிஷ்டை, நினைவுகூரல் போன்ற இறையியல் விளக்கங்களை மொழிபெயர்ப்புக்குள் சேர்க்காமல் மூலத்தின் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘நாட்டினான்’ கல் தூணை நிலைநிறுத்தும் செயலைத் தெளிவாகக் கூறுகிறது; ‘பானபலி’ என்ற சற்றுத் தொழில்நுட்பமான சொல்லை அடிக்குறிப்பு எளிய தமிழில் விளக்குகிறது.
