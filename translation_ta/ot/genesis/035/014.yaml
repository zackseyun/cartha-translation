revisions:
- from: தன்னுடன் அவர் பேசிய இடத்தில் யாக்கோபு ஒரு தூணை—கல் தூணை—நாட்டினான். அதன்மேல் பானபலியை[a] ஊற்றினான்; எண்ணெயையும் அதன்மேல் வார்த்தான்.
  to: யாக்கோபுடன் இறைவன் பேசிய இடத்தில் யாக்கோபு ஒரு தூணை—கல் தூணை—நாட்டினான். அதன்மேல் பானபலியை[a] ஊற்றினான்; அதன்மேல் எண்ணெயையும் ஊற்றினான்.
  rationale: The revision explicitly identifies God as the one who spoke with Jacob, resolving a Tamil pronoun ambiguity without introducing an interpretation beyond the immediate context. It retains the Hebrew’s repeated identification of the object as a pillar, specifically a stone pillar, and preserves the separate pouring of the drink offering and oil. The footnote is narrowed to a lexical explanation.
