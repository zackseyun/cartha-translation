base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/020.yaml
  text: And Jacob set up a pillar over her grave[a]. It is the pillar of Rachel’s grave to this day.
translation:
  language: ta
  text: யாக்கோபு அவளுடைய கல்லறையின்மேல் ஒரு தூணை நாட்டினார்.[a] அதுவே இன்றுவரை ராகேலின் கல்லறைத் தூணாக உள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளுடைய கல்லறையின்மேல் ஒரு நினைவுத் தூணை நாட்டினார்”; அல்லது, “அவளுடைய கல்லறையின்மேல் ஒரு கல் தூணை நாட்டினார்.”
    reason: மַצֵּבָה என்பது நிறுத்தப்பட்ட தூண் அல்லது கல்லைக் குறிக்கலாம்; கல்லறைச் சூழலில் அது நினைவுக் குறியாகவும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: நாட்டினார்
  rationale: நிறுத்துதல் அல்லது நிறுவுதல் என்ற ஹிப்ஹீல் வினையின் செயலை இயல்பாகவும், கல் தூண் அமைக்கும் சூழலுக்கு ஏற்றவாறும் தெரிவிக்கிறது.
- source_word: מַצֵּבָה
  choice: நினைவுத் தூண்
  rationale: நிறுத்தப்பட்ட கல் அல்லது தூண் என்ற உறுதியான உருவகத்தையும், இச்சூழலில் கல்லறையை அடையாளப்படுத்தும் பணியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל
  choice: கல்லறையின்மேல்
  rationale: கல்லறையுடன் தொடர்புடைய மேல்நிலை அல்லது அதன்மேல் அமைக்கப்பட்ட நிலையை நேரடியாகக் காட்டுகிறது.
- source_word: קְבֻרָתָהּ
  choice: அவளுடைய கல்லறை
  rationale: קבורה என்பதன் கல்லறை அல்லது அடக்க இடம் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; பிரமாண்டமான கட்டமைப்பை உணர்த்தும் சொல் தவிர்க்கப்படுகிறது.
- source_word: הִוא
  choice: அதுவே
  rationale: முன்னர் குறிப்பிடப்பட்ட நினைவுத் தூணையே மீண்டும் அடையாளப்படுத்தும் எபிரெயச் சுட்டுப்பெயரின் வலிமையைத் தெளிவாகத் தருகிறது.
- source_word: מַצֶּבֶת קְבֻרַת רָחֵל
  choice: ராகேலின் கல்லறை நினைவுத் தூண்
  rationale: கல்லறையோடு தொடர்புடைய தூண் என்ற எபிரெய இணைப்பை தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: עַד הַיּוֹם
  choice: இன்றுவரை
  rationale: கதைசொல்லியின் காலம் வரை தொடர்ந்திருப்பதைச் சுட்டும் வழக்குச் சொல்லுக்கு இயல்பான தமிழ் இணை.
