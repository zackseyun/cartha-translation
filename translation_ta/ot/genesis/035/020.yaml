  source_fidelity: முதல் வாக்கியம் எபிரெய வினை, கல்லறையுடனான இடத் தொடர்பு, மற்றும் מַצֵּבָה என்பதன் தூண்/நிறுத்தப்பட்ட அடையாளம் ஆகியவற்றை மொத்தத்தில் நன்றாகக் கொண்டுவருகிறது. ஆனால் ‘நினைவுத் தூண்’ என்பது சூழலுக்கு ஏற்றாலும், மூலத்தின் பொதுவான ‘தூண்/நிறுத்தப்பட்ட கல்’ என்பதைக் காட்டிலும் சற்றே விளக்கமளிக்கும் சொல். இரண்டாம் வாக்கியத்தில் ‘ராகேலின் கல்லறை நினைவுத் தூண்’ என்ற பெயர்ச்சொல் தொடர் தெளிவாக இணைக்கப்பட வேண்டும்.
