base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/009.yaml
  text: God appeared to Jacob again when he came from Paddan-aram[a], and he blessed him.
translation:
  language: ta
  text: யாக்கோபு பதான்-அராமிலிருந்து வந்தபோது, கடவுள் மீண்டும் அவனுக்குத் தோன்றி[a], அவனை ஆசீர்வதித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் மீண்டும் யாக்கோபுக்குத் தம்மை வெளிப்படுத்தினார்.” எபிரெய வினைச்சொல் தோன்றுவதையோ, தம்மைக் காணத்தக்கவராக வெளிப்படுத்துவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: அவனுக்குத் தோன்றி
  rationale: ראה என்பதன் நிஃபால் வடிவம் இங்கு கடவுள் தம்மைக் காணத்தக்க விதத்தில் வெளிப்படுத்தியதைக் குறிக்கிறது. நிகழ்ந்த விதத்தை அளவுக்கு மீறி வரையறுக்காமல், இயல்பான தமிழில் ‘தோன்றினார்’ என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வினைச்சொல் ஒருமையிலும், கதைச் சூழல் ஒரே கடவுளைக் குறிப்பதாலும் ‘கடவுள்’ பொருத்தமான மொழிபெயர்ப்பு.
- source_word: עוֹד
  choice: மீண்டும்
  rationale: முந்தைய இறைத்தோற்றத்தின் மறுநிகழ்வை இங்கு குறிக்கிறது.
- source_word: בְּבֹאוֹ
  choice: வந்தபோது
  rationale: ב முன்னொட்டுடன் வரும் பெயரெச்ச வினை வடிவம் இங்கு காலத்தைக் குறிக்கிறது; ‘வந்தபோது’ என்பது தெளிவான இயல்பான தமிழ்.
- source_word: מִפַּדַּן אֲרָם
  choice: பதான்-அராமிலிருந்து
  rationale: இது ஓர் இடப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது; מִן முன்னொட்டின் பொருளை ‘-இலிருந்து’ தருகிறது.
- source_word: וַיְבָרֶךְ אֹתוֹ
  choice: அவனை ஆசீர்வதித்தார்
  rationale: ברך என்பதன் பிஏல் வடிவம் ‘ஆசீர்வதித்தல்’ என்று பொருள்படும். தமிழின் மரியாதை ஒருமையால் கடவுளைக் குறிக்கும் எழுவாய் தெளிவாகப் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இறைத்தோற்றத்தின் இயல்பு
  choice: ‘கடவுள் மீண்டும் அவனுக்குத் தோன்றினார்’ என்ற நேரடியான இறைத்தோற்றமாக மொழிபெயர்த்தல்.
  alternative: ‘கடவுள் மீண்டும் யாக்கோபுக்குத் தம்மை வெளிப்படுத்தினார்.’
  rationale: வசனம் உண்மையான இறை வெளிப்பாட்டை அறிவிக்கிறது; ஆனால் அது நிகழ்ந்த முறையை வரையறுப்பதில்லை. ‘தோன்றினார்’ என்பது காணத்தக்க வெளிப்பாட்டைப் பாதுகாத்து, அதை வெறும் தரிசனம் அல்லது உள்ளார்ந்த அனுபவம் என்று தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘பதான்-அராம்’ இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது; கடவுளைக் குறிக்கும் வினை மரியாதை ஒருமையில் அமைக்கப்பட்டுள்ளது.
