  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶֽל יַעֲקֹ֔ב ק֛וּם עֲלֵ֥ה בֵֽית אֵ֖ל וְ/שֶׁב שָׁ֑ם וַ/עֲשֵׂה שָׁ֣ם מִזְבֵּ֔חַ לָ/אֵל֙ הַ/נִּרְאֶ֣ה אֵלֶ֔י/ךָ בְּ/בָרְחֲ/ךָ֔ מִ/פְּנֵ֖י עֵשָׂ֥ו אָחִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/001.yaml
  text: Then God said to Jacob[a], “Arise, go up to Bethel and dwell there, and make there an altar to the God who appeared to you when you fled from the presence of Esau your brother.”
translation:
  language: ta
  text: பின்பு கடவுள் யாக்கோபிடம், “எழுந்து, பெத்தேலுக்கு ஏறிச் செல்; அங்கே குடியிரு. உன் சகோதரன் ஏசாவின் முன்னிலையிலிருந்து[a] நீ தப்பியோடியபோது உனக்குத் தோன்றிய கடவுளுக்கு அங்கே ஒரு பலிபீடத்தை அமை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இயல்பாக, “உன் சகோதரன் ஏசாவிடமிருந்து” என்றும் மொழிபெயர்க்கலாம். எபிரெயில் எழுத்துப்படி, “உன் சகோதரன் ஏசாவின் முகத்திலிருந்து” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் ‘பின்பு’ அதன் தொடர் உணர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவில் பன்மையாக இருந்தாலும், ஒருமை வினையுடனும் சூழலிலும் இங்கு ஒரே கடவுளைக் குறிக்கிறது.
- source_word: קוּם עֲלֵה
  choice: எழுந்து ... போய்
  rationale: இரு கட்டளைகளின் இயக்கத்தையும் இயல்பான தமிழில் காக்கிறது; பெத்தேலை நோக்கிய உயர்திசை எபிரெயில் வெளிப்படையாக உள்ளது, ஆனால் தமிழில் ‘மேலே போ’ என்பது இச்சூழலில் செயற்கையாக அல்லது தெளிவற்றதாக அமையலாம்.
- source_word: בֵּית אֵל
  choice: பெத்தேல்
  rationale: ‘கடவுளின் வீடு’ என்று பொருள் மொழிபெயர்க்காமல், நிறுவப்பட்ட இடப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְשֶׁב שָׁם
  choice: அங்கே குடியிரு
  rationale: ישב என்பதன் தங்குதல் அல்லது வசித்தல் என்ற பொருளை இச்சூழலில் ‘குடியிரு’ தெளிவாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: וַעֲשֵׂה שָׁם מִזְבֵּחַ
  choice: அங்கே ஒரு பலிபீடத்தை அமை
  rationale: עשה என்பது பொதுவாக ‘செய்/உருவாக்கு’; பலிபீடத்துடன் ‘அமை’ என்பது நவீன தமிழில் இயல்பானதும் மூலத்தின் பரந்த வினைப்பொருளுக்கு ஏற்றதும் ஆகும்.
- source_word: לָאֵל הַנִּרְאֶה אֵלֶיךָ
  choice: உனக்குத் தோன்றிய கடவுளுக்கு
  rationale: ל அர்ப்பணிப்பு அல்லது நோக்கத்தைச் சுட்டுகிறது; Niphal வடிவமான נִרְאָה இத்தெய்வத் தோற்றச் சூழலில் ‘தோன்றிய’ என்று நேரடியாக வழங்கப்படுகிறது.
- source_word: בְּבָרְחֲךָ
  choice: நீ தப்பியோடியபோது
  rationale: ב உடனான infinitive construct காலச் சூழலைக் குறிக்கிறது; ברח-இன் ஆபத்திலிருந்து ஓடுதல் என்ற உணர்வை ‘தப்பியோடு’ வெளிப்படுத்துகிறது.
- source_word: מִפְּנֵי
  choice: முன்னிலையிலிருந்து
  rationale: எழுத்துப்படி ‘முகத்திலிருந்து/முன்னிலையிலிருந்து’ என்ற எபிரெயச் சொல்லாட்சியை வாசிக்கத்தக்க தமிழில் காக்கிறது; இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עֵשָׂו אָחִיךָ
  choice: உன் சகோதரன் ஏசா
  rationale: தமிழின் இயல்பான பெயர்ச்சொல் வரிசையைப் பின்பற்றுகிறது; உறவையும் பெயரையும் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: אֱלֹהִים என்பதன் குறிப்பு
  choice: யாக்கோபிடம் பேசும் ஒரே கடவுள்
  alternative: தெய்வங்கள்
  rationale: ஒருமை வினையும் ஆதியாகமக் கதையின் சூழலும் ஒரே கடவுளையே தெளிவாகக் குறிக்கின்றன.
- issue: בֵּית אֵל என்பதன் மொழியாக்கம்
  choice: பெத்தேல் என இடப்பெயராக ஒலிபெயர்த்தல்
  alternative: கடவுளின் வீடு
  rationale: இங்கு அது இடப்பெயராகச் செயல்படுவதால் அதன் சொற்பொருளை முதன்மை உரையில் இடுவது கதையியல் அடையாளத்தை மாற்றிவிடும்.
- issue: לָאֵל הַנִּרְאֶה אֵלֶיךָ என்பதில் கடவுளின் அடையாளம்
  choice: உனக்குத் தோன்றிய கடவுளுக்கு
  alternative: தன்னை உனக்கு வெளிப்படுத்திய கடவுளுக்கு
  rationale: ‘தோன்றிய’ என்பது மூல வினையின் தெய்வத் தோற்றப் பொருளை நேரடியாகக் காக்கிறது; ‘தன்னை வெளிப்படுத்திய’ என்பது விளக்கத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைக் கடைப்பிடிக்கிறது. தெய்வக் கட்டளைகளுக்கு ஒருமை மரியாதையற்ற ஏவல் வடிவம் மூலத்தின் நேரடி கட்டளை வலிமையை இயல்பாகக் காக்கிறது; உரையாளர் கூறும் வினையில் ‘என்றார்’ மரியாதைநிலை பயன்படுத்தப்பட்டுள்ளது. எபிரெயின் ‘மேலே செல்’ என்ற உயர்திசைத் தகவல் தமிழில் செயற்கையாக ஒலிக்காதபடி ‘போய்’ என வழங்கப்பட்டது.
