base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/015.yaml
  text: And Jacob called the name of the place where God had spoken with him there[b][a], Bethel.
translation:
  language: ta
  text: யாக்கோபு, கடவுள் அவனோடு அங்கே பேசிய அந்த இடத்திற்குப் பெத்தேல்[a] என்று பெயரிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெத்தேல்” என்பதற்கு “கடவுளின் வீடு” என்று பொருள்.
    reason: இடப்பெயரின் எபிரேயப் பொருளை வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם
  choice: பெயரிட்டான்
  rationale: ‘பெயரை அழைத்தான்’ என்ற எபிரேய மரபுத்தொடரின் இயல்பான நவீனத் தமிழ் பொருள் ‘பெயரிட்டான்’ என்பதாகும்.
- source_word: הַמָּקוֹם
  choice: அந்த இடத்திற்கு
  rationale: குறிப்பிட்ட இடத்தைக் குறிக்கும் சுட்டுப்பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘பெயரிடு’ வினையுடன் நான்காம் வேற்றுமை இயல்பானது.
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ שָׁם אֱלֹהִים
  choice: கடவுள் தன்னோடு பேசிய அந்த இடத்திற்கு
  rationale: אִתּוֹ என்பதன் ‘அவனோடு’ என்ற உடனிகழ்வுப் பொருளைத் தக்கவைக்கிறது. שָׁם என்பதன் இடப்பொருள் தமிழில் ‘அந்த இடம்’ என்ற தொடரிலேயே இயல்பாக அடங்குவதால் தேவையற்ற இரட்டிப்பைத் தவிர்க்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு வினையும் கதையமைப்பும் ஒருமை இறைவனைக் குறிப்பதால் நிலையான ஒருமை மொழிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: בֵּית אֵל
  choice: பெத்தேல்
  rationale: இடப்பெயர் மொழிபெயர்க்கப்படாமல் தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்கப்படுகிறது; அதன் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: אֱלֹהִים என்பதன் எண்ணும் குறிக்கும் பொருளும்
  choice: கடவுள்
  alternative: தெய்வங்கள்
  rationale: எபிரேய வடிவம் பன்மைத் தோற்றமுடையதாக இருந்தாலும், இச்சூழலில் யாக்கோபோடு பேசிய ஒரே கடவுளையே இலக்கணமும் கதையும் குறிக்கின்றன.
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரேயச் சொற்றொடரின் பொருள் காக்கப்பட்டாலும், தமிழில் செயற்கையாக ஒலிக்கும் ‘இடத்தின் பெயரை அழைத்தான்’ என்பதற்குப் பதில் ‘இடத்திற்கு ... பெயரிட்டான்’ என வழங்கப்பட்டுள்ளது.
