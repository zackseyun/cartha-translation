source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל בֵּית֔/וֹ וְ/אֶ֖ל כָּל אֲשֶׁ֣ר עִמּ֑/וֹ הָסִ֜רוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ אֲשֶׁ֣ר בְּ/תֹכְ/כֶ֔ם וְ/הִֽטַּהֲר֔וּ וְ/הַחֲלִ֖יפוּ שִׂמְלֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/002.yaml
  text: Then Jacob said to his household and to all who were with him[a], “Put away the foreign gods that are among you, purify yourselves[b], and change your clothes.”
translation:
  language: ta
  text: அப்போது யாக்கோபு தன் குடும்பத்தாரிடமும் தன்னோடு இருந்த அனைவரிடமும், “உங்களிடையே இருக்கும் அந்நிய தெய்வங்களை[a] அகற்றிவிட்டு, உங்களைத் தூய்மைப்படுத்திக்கொள்ளுங்கள்[b]; உங்கள் உடைகளையும் மாற்றுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேற்று தெய்வங்கள்”; அல்லது, “வேற்றினத்தாரின் தெய்வங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “தூய்மைப்படுத்திக்கொள்ளுங்கள்” என்பது கடவுளை அணுகுவதற்கான ஆயத்தமாகச் செய்யப்படும் சடங்கு சார்ந்த தூய்மையைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: தன் குடும்பத்தாரிடம்
  rationale: எபிரெயச் சொல் நேரடியாக ‘அவனுடைய வீடு’ என்று பொருள்படலாம்; இங்கு கட்டிடத்தை அல்ல, யாக்கோபின் குடும்பம் மற்றும் வீட்டாரைக் குறிக்கிறது.
- source_word: כָּל אֲשֶׁר עִמּוֹ
  choice: தன்னோடு இருந்த அனைவரிடம்
  rationale: யாக்கோபுடன் பயணித்த அல்லது அவனுடைய குழுவில் இருந்த அனைவரையும் இயல்பான தமிழில் குறிக்கிறது.
- source_word: הָסִרוּ
  choice: அகற்றிவிட்டு
  rationale: அவற்றைத் தங்களிடமிருந்து நீக்க வேண்டும் என்ற கட்டளையின் வலிமையைத் தெளிவாகக் காட்டுகிறது; தொடரும் கட்டளைகளோடு இயல்பாக இணைகிறது.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: அந்நிய தெய்வங்கள்
  rationale: வேற்றினத்தாருக்குரிய அல்லது அந்நிய வழிபாட்டைச் சேர்ந்த தெய்வங்கள் என்ற பொருளைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: בְּתֹכְכֶם
  choice: உங்களிடையே இருக்கும்
  rationale: ‘உங்கள் நடுவில்’ என்ற இடப்பொருளையும், அவர்களின் சமூகத்திலோ உடைமையிலோ அவை இருந்ததையும் குறிப்பிட்டுவிடாமல் உள்ளடக்குகிறது.
- source_word: וְהִטַּהֲרוּ
  choice: உங்களைத் தூய்மைப்படுத்திக்கொள்ளுங்கள்
  rationale: எபிரெய வினையின் தற்சுட்டு வடிவத்தையும், கடவுளை அணுகுவதற்கான சடங்கு அல்லது உடன்படிக்கை சார்ந்த ஆயத்தத்தின் சாத்தியத்தையும் பாதுகாக்கிறது.
- source_word: וְהַחֲלִיפוּ
  choice: மாற்றுங்கள்
  rationale: உடைகளுடன் வரும் சூழலில் மாற்றுதல் அல்லது வேறு உடைகளை அணிதல் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: שִׂמְלֹתֵיכֶם
  choice: உங்கள் உடைகள்
  rationale: வெளிப்புற ஆடைகளைக் குறிக்கும் சொல்லுக்கு நவீன வாசகர்களுக்குப் புரியும் பொதுவான தமிழ்ச் சொல்.
theological_decisions:
- issue: தூய்மைப்படுத்தும் கட்டளையின் இயல்பு
  choice: ‘உங்களைத் தூய்மைப்படுத்திக்கொள்ளுங்கள்’ என்று மொழிபெயர்த்து, சடங்கு மற்றும் உடன்படிக்கை சார்ந்த தூய்மையின் சாத்தியத்தைப் பாதுகாத்தல்
  alternative: ‘உங்களைச் சுத்தப்படுத்திக்கொள்ளுங்கள்’ என்று பொதுவாக மொழிபெயர்த்தல்
  rationale: சிலைகளை அகற்றி கடவுளை அணுக ஆயத்தமாகும் சூழல் சடங்கு சார்ந்த நுணுக்கத்தை உணர்த்துகிறது. ஆனால் வசனம் குறிப்பிட்ட சடங்கைச் சொல்லாததால் மொழிபெயர்ப்பும் அதற்கு மேல் விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. கட்டளைகளின் நேரடியான வலிமையும் எபிரெய மூலத்தின் சாத்தியமான சடங்கு நுணுக்கமும் பாதுகாக்கப்பட்டுள்ளன.
