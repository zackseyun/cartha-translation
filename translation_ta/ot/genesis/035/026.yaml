  edition: WLC
  text: וּ/בְנֵ֥י זִלְפָּ֛ה שִׁפְחַ֥ת לֵאָ֖ה גָּ֣ד וְ/אָשֵׁ֑ר אֵ֚לֶּה בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁ֥ר יֻלַּד ל֖/וֹ בְּ/פַדַּ֥ן אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/026.yaml
  text: 'And the sons of Zilpah[a], Leah’s servant: Gad and Asher[b]. These are the sons of Jacob who were born to him in Paddan-aram.'
translation:
  language: ta
  text: லேயாளின் பணிப்பெண்ணான[a] சில்பாளின் மகன்கள் காத், ஆசேர். இவர்களே பதான் அராமில் யாக்கோபுக்குப் பிறந்த மகன்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பணிப்பெண்’ என்பதற்கான எபிரெயச் சொல், அக்காலச் சமூக நிலையில் இருந்த ஒரு பெண் பணியாளரையோ, இன்னும் வெளிப்படையாகச் சொன்னால் ‘பெண் அடிமை’யையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு யாக்கோபின் மகன்கள் பதான் அராமில் அவருக்குப் பிறந்தவர்கள் என்று தொகுத்துக் கூறப்படுகிறது. ஆனால் பென்யமீன் பின்னர் கானானில் பிறந்தான் (35:16–18). இந்தக் கூற்று யாக்கோபின் பதான் அராம் காலத்துடன் தொடர்புடைய குடும்பத்தைத் தொகுத்துரைப்பதாகப் புரிந்துகொள்ளலாம்; இடத்தைக் குறிக்கும் இக்கூற்றில் பென்யமீன் விதிவிலக்காக இருக்கிறான்.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי זִלְפָּה
  choice: சில்பாளின் மகன்கள்
  rationale: בְנֵי என்பது ஆண்பிள்ளைகளைக் குறிப்பதால் ‘மகன்கள்’ என நேரடியாக மொழிபெயர்க்கப்பட்டது; זִלְפָּה என்ற பெயர் தமிழில் இயல்பாக ‘சில்பாள்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: שִׁפְחַת לֵאָה
  choice: லேயாளின் பணிப்பெண்ணான
  rationale: שִׁפְחָה ஒரு பெண் பணியாளர் அல்லது அடிமை நிலையிலிருந்த பெண்ணைக் குறிக்கலாம். ‘பணிப்பெண்’ பாலினத்தையும் சேவை நிலையையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; சமூக நிலையின் கடுமையை மறைக்காமல் மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: גָּד וְאָשֵׁר
  choice: காத், ஆசேர்
  rationale: இரு தனிப்பெயர்களும் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டன; பட்டியல் அமைப்பில் இணைப்புச் சொல் இல்லாமலும் தமிழில் இயல்பாக உள்ளது.
- source_word: אֵלֶּה בְּנֵי יַעֲקֹב
  choice: இவர்களே யாக்கோபுக்குப் பிறந்த மகன்கள்
  rationale: אֵלֶּה என்பதன் சுட்டும், தொகுத்துரைக்கும் வலிமையை ‘இவர்களே’ வெளிப்படுத்துகிறது. בְּנֵי என்பதால் ‘மகன்கள்’ தக்கவைக்கப்பட்டது.
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: யாக்கோபுக்குப் பிறந்த
  rationale: எபிரெயச் செயப்பாட்டு வடிவமும் לוֹ என்பதும் தந்தையான யாக்கோபின் கண்ணோட்டத்தில் ‘அவருக்குப் பிறந்தவர்கள்’ என்று கூறுகின்றன. தமிழில் பெயரை மீண்டும் குறிப்பிட்டு ‘யாக்கோபுக்குப் பிறந்த’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது; வெளிப்படையாக இல்லாத பெண் எழுவாய் சேர்க்கப்படவில்லை.
- source_word: בְּפַדַּן אֲרָם
  choice: பதான் அராமில்
  rationale: இது இடப்பெயராகக் கருதப்பட்டு பொருள் விளக்கமாக மாற்றப்படாமல் ஒலிபெயர்க்கப்பட்டது; இடவேற்றுமை ‘-இல்’ மூலம் குறிக்கப்பட்டது.
theological_decisions:
- issue: பதான் அராமில் பிறந்தவர்கள் என்ற தொகுப்புக் கூற்றுக்கும் பென்யமீன் கானானில் பிறந்த செய்திக்கும் இடையிலான பதற்றம்
  choice: மூலத்தின் பொதுவான தொகுப்புக் கூற்றை மாற்றாமல் மொழிபெயர்த்து, சிக்கலை அடிக்குறிப்பில் சுட்டிக்காட்டுதல்
  alternative: பென்யமீனைத் தவிர மற்ற மகன்கள் பதான் அராமில் பிறந்தார்கள் என்று வசனத்துக்குள்ளேயே விளக்கமாகச் சேர்த்தல்
  rationale: ‘பென்யமீனைத் தவிர’ என்பது இவ்வசனத்தின் எபிரெய உரையில் இல்லை. ஆகவே உண்மையான உரைநடைப் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாத்து, ஆதியாகமம் 35:16–18 உடனான தொடர்பை வாசகருக்கு அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. எபிரெயப் பட்டியலின் சுருக்கம் காக்கப்பட்டாலும், தமிழில் இயல்பாக அமைய பெயர்களுக்கு இடையில் காற்புள்ளி இடப்பட்டது. ‘பணிப்பெண்’ முதன்மை உரையில் வாசிப்புக்கு இயல்பான தேர்வாகவும், அதன் சமூக-வரலாற்று கடுமை அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டது.
