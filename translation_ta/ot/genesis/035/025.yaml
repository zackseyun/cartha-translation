  text: 'And the sons of Bilhah[a], Rachel’s female servant: Dan and Naphtali.'
translation:
  language: ta
  text: 'ராகேலின் பணிப்பெண்ணான பில்காளின்[a] மகன்கள்: தாணும் நப்தலியும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ராகேலின் வேலைக்காரி.” எபிரெயச் சொல் தாழ்ந்த சமூகநிலையில் இருந்த பெண் பணியாளரைக் குறிக்கிறது; சில சூழல்களில் அது பெண் அடிமை என்ற பொருளையும் தரலாம்.
    reason: שִׁפְחָה என்பதன் சமூகநிலை சார்ந்த சொற்பொருள் வரம்பைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: மகன்கள்
  rationale: בְנֵי என்பது בֵּן என்பதன் பன்மை இணைப்புநிலை வடிவம்; இங்கு வம்சப் பட்டியலின் அடுத்த பிரிவை அறிமுகப்படுத்துவதால், பாலினத்தையும் பட்டியல் அமைப்பையும் நேரடியாகப் பிரதிபலிக்க ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது. வசனத் தொடக்கத்தில் உள்ள וּ பட்டியலின் தொடர்ச்சியைக் குறிக்கிறது; இயல்பான தமிழ் பட்டியல் நடையில் தனியே ‘மற்றும்’ சேர்க்கப்படவில்லை.
- source_word: בִלְהָה
  choice: பில்கா
  rationale: எபிரெய தனிப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: שִׁפְחַת
  choice: பணிப்பெண்
  rationale: שִׁפְחָה தாழ்ந்த சமூக நிலையில் இருந்த பெண் பணியாளர் அல்லது அடிமைப் பெண்ணைக் குறிக்கக்கூடும். ‘பணிப்பெண்’ என்பது பெண்பாலையும் சேவை நிலையையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; மூலச்சொல்லின் முழு சமூக வரம்பை விளக்க அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: רָחֵל
  choice: ராகேலின்
  rationale: தனிப்பெயர் ஒலிபெயர்க்கப்பட்டு, எபிரெய இணைப்புநிலை உறவு தமிழில் உடைமை வேற்றுமையால் இயல்பாகக் காட்டப்பட்டது.
- source_word: דָּן
  choice: தாண்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: וְ/נַפְתָּלִי
  choice: நப்தலியும்
  rationale: தனிப்பெயர் ஒலிபெயர்க்கப்பட்டு, எபிரெய וְ இணைப்புச் சொல் தமிழ் பட்டியல் நடைக்கேற்ற ‘-உம்’ விகுதியால் காட்டப்பட்டது.
