  register: நவீனத் தரத்தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சூழலில் தெளிவாகத் தெரியும் இரு ஆண் குறிப்பு நபர்களையும் தமிழில் குழப்பமின்றி வேறுபடுத்த ‘லாபான்’, ‘யாக்கோபு’ என்ற பெயர்கள் வெளிப்படுத்தப்பட்டுள்ளன. பாலுறவுக்கான மூலமொழியின் நயச்சொல் தன்மை ‘அவளுடன் சேர்ந்தான்’ என்பதில் பாதுகாக்கப்பட்டுள்ளது.
