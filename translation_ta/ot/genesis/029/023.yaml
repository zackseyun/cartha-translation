  yaml_path: translation/ot/genesis/029/023.yaml
  text: And in the evening he took Leah his daughter and brought her to him[a], and he went in to her.
translation:
  language: ta
  text: மாலையானபோது, லாபான் தன் மகள் லேயாளை யாக்கோபிடம் கொண்டுவந்தான்; யாக்கோபு அவளோடு உறவு கொண்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்கு சொல், ‘அவளிடம் உள்ளே சென்றான்’; இது பாலுறவைக் குறிக்கும் மரபான நயச்சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: மாலையானபோது
  rationale: எபிரெயக் கதைநடையின் நிகழ்வுத் தொடரையும் மாலை நேரத்தையும் இயல்பான நவீனத் தமிழில் ஒருங்கிணைக்கிறது.
- source_word: וַיִּקַּח אֶת־לֵאָה בִתּוֹ
  choice: லாபான் தன் மகள் லேயாளை
  rationale: לקח என்பதன் ‘எடுத்துக்கொண்டான்/அழைத்துச் சென்றான்’ என்ற இயக்கப் பொருள் அடுத்த வினையுடன் தமிழில் இயல்பாக இணைக்கப்பட்டுள்ளது. மூலத்தில் பெயருக்கு அடுத்து வரும் ‘தன் மகள்’ என்ற உறவும் தெளிவாகப் பாதுகாக்கப்படுகிறது; தொடர்ச்சூழலில் குறிக்கப்படும் நபர் லாபான் என்பதால் பெயர் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו
  choice: யாக்கோபிடம் அழைத்து வந்தான்
  rationale: Hiphil வடிவிலுள்ள בוא இங்கு ‘ஒருவரிடம் கொண்டுவருதல்’ என்று பொருள்படும். தமிழில் ‘அழைத்து வந்தான்’ என்பது மனிதரை வரவழைத்துக் கொண்டுவரும் செயலை இயல்பாகக் கூறுகிறது; தெளிவுக்காக சூழலில் குறிக்கப்படும் யாக்கோபின் பெயர் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: யாக்கோபு அவளுடன் சேர்ந்தான்
  rationale: இந்த எபிரெயச் சொற்றொடர் பாலுறவைக் குறிக்கும் மரபான நயச்சொல். ‘அவளுடன் சேர்ந்தான்’ என்பது அதைக் கடுமையாக வெளிப்படையாக்காமல், நவீனத் தமிழில் புரியத்தக்க நயத்துடன் தெரிவிக்கிறது.
