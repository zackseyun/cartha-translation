  text: Jacob loved Rachel[a], and he said, “I will serve you seven years for Rachel your younger daughter.”
translation:
  language: ta
  text: யாக்கோபு ராகேலை நேசித்தான்.[a] அவன், “உமது இளைய மகள் ராகேலுக்காக நான் ஏழு ஆண்டுகள் உமக்குப் பணிசெய்வேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, வடிவநெருக்கமாக: “மேலும், யாக்கோபு ராகேலை நேசித்தான்.” தொடக்க இணைப்புச்சொல் கதையைத் தொடர்ந்து செல்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: நேசித்தான்
  rationale: אָהַב என்பதன் நேரடியான பொருள் ‘நேசித்தான்’. ‘காதலித்தான்’ என்பது சூழலில் சாத்தியமானாலும், மூல வினைச்சொல்லைவிடக் காதல் உணர்வைச் சற்றுக் குறிப்பாக்குகிறது.
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: אמר நேரடியான பேச்சை அறிமுகப்படுத்தும் பொதுவான வினைச்சொல்; தமிழில் மேற்கோளுக்குப் பின் ‘என்றான்’ என்பது இயல்பான நடை.
- source_word: אֶעֱבָדְךָ
  choice: உமக்குப் பணிசெய்வேன்
  rationale: עבד இங்கு லாபானுக்காக உழைத்துச் சேவை செய்வதைக் குறிக்கிறது. ‘பணிசெய்வேன்’ என்பது உழைப்பு மற்றும் சேவை ஆகிய இரு நிழற்பொருள்களையும் தக்கவைக்கிறது.
- source_word: שֶׁבַע שָׁנִים
  choice: ஏழு ஆண்டுகள்
  rationale: எண்ணும் காலப்பெயரும் கொண்ட சொற்றொடரின் நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: בְּרָחֵל
  choice: ராகேலுக்காக
  rationale: בְּ இங்கு யாக்கோபின் பணிக்கான அடிப்படை அல்லது எதிரீட்டைக் குறிக்கிறது. ‘ராகேலுக்காக’ என்பது ஒப்பந்தச் சூழலை மிகையாக விளக்காமல் இயல்பாகத் தருகிறது.
- source_word: בִּתְּךָ
  choice: உமது மகள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை உரிமைப் பின்னொட்டுடன் உள்ள ‘மகள்’ என்பதன் நேரடி மொழிபெயர்ப்பு.
- source_word: הַקְּטַנָּה
  choice: இளைய
  rationale: எழுத்துப்படி ‘சிறிய’ என்றாலும், சகோதரிகளுக்கிடையிலான வயது ஒப்பீட்டில் ‘இளைய’ என்பதே நோக்கப்பட்ட இயல்பான பொருள்.
- source_word: וַ
  choice: தனி இணைப்புச்சொல்லாக வெளிப்படுத்தப்படவில்லை
  rationale: தொடக்க waw கதைத் தொடர்ச்சியைக் குறிக்கிறது. நவீன தமிழில் அதை கட்டாயமாக ‘மேலும்/அப்போது’ என்று சேர்ப்பது தேவையற்றதாக இருக்கும்; வாக்கியத் தொடர்ச்சியே அதன் பங்கை நிறைவேற்றுகிறது.
