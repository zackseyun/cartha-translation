translation_notes:
  register: நவீன நிலையான தமிழில், கிராமிய மேய்ப்புச் சூழலுக்கு ஏற்ற இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘எங்களால் முடியாது’ என்ற மூலத்தின் நீள்விடை அமைப்பு விளக்கச் சொற்கள் சேர்க்காமல் காக்கப்பட்டுள்ளது; அரைப்புள்ளி நிபந்தனையையும் அதன் பின்வரும் செயல் வரிசையையும் இணைக்கிறது.
