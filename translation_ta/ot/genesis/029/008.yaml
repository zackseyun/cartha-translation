  text: וַ/יֹּאמְרוּ֮ לֹ֣א נוּכַל֒ עַ֣ד אֲשֶׁ֤ר יֵאָֽסְפוּ֙ כָּל הָ֣/עֲדָרִ֔ים וְ/גָֽלֲלוּ֙ אֶת הָ/אֶ֔בֶן מֵ/עַ֖ל פִּ֣י הַ/בְּאֵ֑ר וְ/הִשְׁקִ֖ינוּ הַ/צֹּֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/008.yaml
  text: They said[a], “We cannot until all the flocks are gathered and they roll the stone away from the mouth of the well[b]; then we water the sheep.”
translation:
  language: ta
  text: அவர்கள், “எல்லா மந்தைகளும் சேர்க்கப்பட்டு, கிணற்றின் வாயின்மேல் இருக்கும் கல்லை அவர்கள் உருட்டி அகற்றும்வரை எங்களால் முடியாது; அதன்பின்தான் மந்தைக்கு[a] தண்ணீர் கொடுப்போம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆடுமந்தைக்கு”; இங்குள்ள எபிரெயச் சொல் செம்மறியாடுகள், வெள்ளாடுகள் உள்ளிட்ட சிறுகால்நடைகளைத் தொகுப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוּכַל
  choice: எங்களால் முடியாது
  rationale: முதல் நபர் பன்மையில் இயலாமையை நேரடியாக வெளிப்படுத்துகிறது; எது முடியாது என்பது முந்தைய வசனச் சூழலிலிருந்து புரிவதால், எபிரெய மூலத்தின் சுருக்கமான அமைப்பு காக்கப்படுகிறது.
- source_word: יֵאָסְפוּ
  choice: ஒன்றுகூடி
  rationale: நிபால் வடிவம் மந்தைகள் ஒரே இடத்தில் சேர்க்கப்படுவதையோ கூடுவதையோ குறிக்கிறது; தமிழில் இச்சூழலுக்கு இயல்பான தொடராக உள்ளது.
- source_word: הָעֲדָרִים
  choice: மந்தைகள்
  rationale: சிறுகால்நடைகளின் கூட்டங்களைக் குறிக்கும் பொதுவான சொல்லாக இருந்து, ஆடுகள் மட்டுமென தேவையின்றிக் குறுக்கவில்லை.
- source_word: וְגָלֲלוּ אֶת־הָאֶבֶן
  choice: கல்லை அவர்கள் புரட்டி அகற்றும்வரை
  rationale: גלל என்பதன் அடிப்படைப் பொருள் ‘புரட்டு’; கல் கிணற்றின் வாயிலிருந்து நகர்த்தப்படுவது சூழலில் தெளிவாக இருப்பதால் ‘அகற்றி’ என்பது இயக்கத்தின் நோக்கை இயல்பாக வெளிப்படுத்துகிறது. பன்மை வினையின் குறிப்பிடப்படாத செய்பவர் ‘அவர்கள்’ என்று வெளிப்படையாக வைக்கப்பட்டுள்ளார்.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: கிணற்றின் வாயிலிருந்து
  rationale: ‘கிணற்றின் வாய்’ என்ற எபிரெய உருவகத்தைத் தமிழிலும் தெளிவாகவும் நேரடியாகவும் காக்கிறது.
- source_word: וְהִשְׁקִינוּ
  choice: அதன்பின்தான் ... தண்ணீர் காட்டுவோம்
  rationale: ஹிபீல் வடிவம் கால்நடைகளுக்குத் தண்ணீர் கொடுப்பதைக் குறிக்கிறது. ‘தண்ணீர் காட்டுதல்’ என்பது கால்நடைகளுக்குத் தண்ணீர் கொடுப்பதற்கான இயல்பான தமிழ் வழக்கு; ‘அதன்பின்தான்’ நிகழ்வுகளின் வரிசையையும் முன் நிபந்தனையையும் தெளிவாக்குகிறது.
- source_word: הַצֹּאן
  choice: ஆடுமந்தை
  rationale: צאן என்பது செம்மறியாடுகள், வெள்ளாடுகள் உள்ளிட்ட சிறுகால்நடைகளைத் தொகுப்பாகக் குறிக்கலாம். வாசிப்பில் இயல்பான ‘ஆடுமந்தை’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, அதன் பரந்த பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
