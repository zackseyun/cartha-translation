source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ יַעֲקֹב֙ כֵּ֔ן וַ/יְמַלֵּ֖א שְׁבֻ֣עַ זֹ֑את וַ/יִּתֶּן ל֛/וֹ אֶת רָחֵ֥ל בִּתּ֖/וֹ ל֥/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/028.yaml
  text: And Jacob did so[a], and he completed this week; then Laban gave him Rachel his daughter as his wife.
translation:
  language: ta
  text: யாக்கோபு அப்படியே செய்து, இந்த வாரத்தை நிறைவு செய்தான்.[a] பின்பு லாபான் தன் மகள் ராகேலை அவனுக்கு மனைவியாகக் கொடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தத் திருமண விருந்து வாரத்தை”; எபிரெயச் சொல் நேரடியாக ஏழு நாள்கள் கொண்ட ஒரு காலப்பகுதியைக் குறிக்கிறது. இங்கே அது திருமண விருந்து நடைபெற்ற வாரமாக இருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ ... כֵּן
  choice: அப்படியே செய்து
  rationale: עשה உடன் வரும் כֵּן, முந்தைய வசனத்தில் லாபான் கூறியபடி யாக்கோபு செய்ததைச் சுட்டுகிறது; செயலைத் தேவையின்றி விரிவுபடுத்தாமல் இயல்பான தமிழில் தருகிறது.
- source_word: וַיְמַלֵּא
  choice: நிறைவு செய்தான்
  rationale: பியேல் வடிவம் ஒரு காலப்பகுதியை முடித்தல் அல்லது நிறைவேற்றுதல் என்ற பொருளைத் தருகிறது.
- source_word: שְׁבֻעַ זֹאת
  choice: அந்த வாரத்தை
  rationale: சொல்லின் அடிப்படைப் பொருள் ஏழு நாள்கள் கொண்ட காலப்பகுதி; சூழலில் அது திருமண விருந்து வாரத்தைக் குறிக்கலாம். தமிழில் இயல்பான சுட்டுப்பெயராக ‘அந்த’ பயன்படுத்தப்பட்டு, சூழல் விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּתֶּן לוֹ
  choice: பின்பு லாபான் ... அவனுக்கு ... கொடுத்தான்
  rationale: எபிரெயத்தில் மறைந்துள்ள எழுவாய் முந்தைய சூழலிலிருந்து லாபான் எனத் தெளிவாகிறது; தமிழில் குழப்பத்தைத் தவிர்க்கப் பெயர் வெளிப்படையாகத் தரப்படுகிறது. நிகழ்வின் தொடர்ச்சியை ‘பின்பு’ காட்டுகிறது.
- source_word: אֶת־רָחֵל בִּתּוֹ
  choice: தன் மகள் ராகேலை
  rationale: ராகேல் லாபானின் மகள் என்பதைக் குறிக்கும் உறவுச் சொல்லை இயல்பான தமிழ் வரிசையில் தருகிறது.
- source_word: לוֹ לְאִשָּׁה
  choice: அவனுக்கு மனைவியாக
  rationale: இந்தக் கட்டமைப்பு திருமணத்தில் ஒருவரை மனைவியாகக் கொடுப்பதைக் குறிக்கிறது; நவீன தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
