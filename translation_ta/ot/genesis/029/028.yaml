translation_notes:
  register: நவீன தரநிலைத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையின் கதைத் தொடர்ச்சி காக்கப்பட்டு, ‘வாரம்’ என்பதன் பண்பாட்டுச் சூழல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
