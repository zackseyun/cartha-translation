  terminology: 'Names and marital terminology are appropriate: ''யாக்கோபு,'' ''லாபான்,'' ''ராகேல்,'' and ''மனைவியாகக் கொடுத்தான்'' are clear and suitable. The note appropriately preserves the cultural sense of the Hebrew term without making it obligatory in the main text.'
