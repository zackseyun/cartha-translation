translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரெய வசனத்தில் கல்லை நகர்த்துவோருக்கான வெளிப்படையான பெயர்ச்சொல் இல்லாவிட்டாலும், சூழலிலிருந்து விளங்கும் செய்பவர்களைத் தமிழில் தெளிவாக்க ‘மேய்ப்பர்கள்’ பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான வினைகள் வழக்கமாக நடந்த செயலைக் குறிப்பதால் ‘கூடிவரும்’, ‘காட்டுவார்கள்’, ‘வைத்துவிடுவார்கள்’ என்ற வடிவங்கள் தேர்ந்தெடுக்கப்பட்டன.
