  text: וְ/נֶאֶסְפוּ שָׁ֣מָּ/ה כָל הָ/עֲדָרִ֗ים וְ/גָלֲל֤וּ אֶת הָ/אֶ֨בֶן֙ מֵ/עַל֙ פִּ֣י הַ/בְּאֵ֔ר וְ/הִשְׁק֖וּ אֶת הַ/צֹּ֑אן וְ/הֵשִׁ֧יבוּ אֶת הָ/אֶ֛בֶן עַל פִּ֥י הַ/בְּאֵ֖ר לִ/מְקֹמָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/003.yaml
  text: And all the flocks would gather there[a], and they would roll the stone away from the mouth of the well and water the flock[b], and then put the stone back in its place over the mouth of the well.
translation:
  language: ta
  text: மந்தைகளெல்லாம் அங்கே கூடிவரும். கிணற்றின் வாயிலிருந்து கல்லைப் புரட்டி அகற்றி, மந்தைக்குத் தண்ணீர் கொடுப்பார்கள். பிறகு அந்தக் கல்லை மீண்டும் கிணற்றின் வாயின்மேல் அதன் இடத்தில் வைத்துவிடுவார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנֶאֶסְפוּ
  choice: கூடிவரும்
  rationale: நிபால் வடிவிலுள்ள இந்த வினை, இச்சூழலில் வழக்கமாகத் திரும்பத் திரும்ப நடந்த செயலைக் குறிக்கிறது; ‘கூடிவரும்’ என்பது அந்தப் பழக்கச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כָל הָעֲדָרִים
  choice: மந்தைகளெல்லாம்
  rationale: עדרים இங்கு சிறு கால்நடைகளின் மந்தைகளைக் குறிக்கிறது. ‘மந்தைகள்’ என்பது ஆடுகளை மட்டும் தேவையின்றிக் கட்டுப்படுத்தாமல் கூட்டுப் பொருளைப் பாதுகாக்கிறது.
- source_word: וְגָלֲלוּ אֶת־הָאֶבֶן
  choice: கல்லைப் புரட்டி அகற்றி
  rationale: גלל என்பதன் உருட்டுதல் அல்லது புரட்டுதல் என்ற தெளிவான காட்சியைப் பாதுகாத்து, கல் கிணற்றின் வாயிலிருந்து நகர்த்தப்பட்டதையும் இயல்பாகச் சொல்கிறது.
- source_word: פִּי הַבְּאֵר
  choice: கிணற்றின் வாய்
  rationale: எபிரெய மொழியின் ‘கிணற்றின் வாய்’ என்ற உருவகச் சொல்லாட்சி தமிழிலும் கிணற்றின் திறப்பைக் குறிக்கும் இயல்பான வழக்காக உள்ளது.
- source_word: וְהִשְׁקוּ אֶת־הַצֹּאן
  choice: மந்தைகளுக்குத் தண்ணீர் காட்டுவார்கள்
  rationale: שׁקה என்பதன் ஹிஃபில் வடிவம் கால்நடைகளுக்குத் தண்ணீர் கொடுத்துக் குடிக்கச் செய்வதைக் குறிக்கிறது; ‘தண்ணீர் காட்டுதல்’ என்பது மேய்ப்புச் சூழலுக்கு ஏற்ற இயல்பான தமிழ்.
- source_word: וְהֵשִׁיבוּ אֶת־הָאֶבֶן
  choice: அந்தக் கல்லை மீண்டும் ... வைத்துவிடுவார்கள்
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் கல்லை முன்பிருந்த இடத்திற்குத் திரும்பச் செய்வதைக் குறிக்கிறது; தமிழில் ‘மீண்டும் வைத்துவிடுதல்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִמְקֹמָהּ
  choice: அதன் இடத்தில்
  rationale: பெண்பால் ஒருமை பின்னொட்டு கல்லைக் குறிக்கிறது; கல் தனக்குரிய இடத்திற்குத் திருப்பிவைக்கப்பட்டதை இந்தச் சொற்றொடர் துல்லியமாகக் காட்டுகிறது.
