id: GEN.29.31
reference: Genesis 29:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֤רְא יְהוָה֙ כִּֽי שְׂנוּאָ֣ה לֵאָ֔ה וַ/יִּפְתַּ֖ח אֶת רַחְמָ֑/הּ וְ/רָחֵ֖ל עֲקָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/031.yaml
  text: When the LORD saw that Leah was hated, he opened her womb, but Rachel was barren.
translation:
  language: ta
  text: லேயாள் வெறுக்கப்பட்டதை யெகோவா கண்டபோது, அவர் அவளுடைய கருப்பையைத் திறந்தார்; ஆனால் ராகேல் மலடியாக இருந்தாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: שְׂנוּאָה
  choice: வெறுக்கப்பட்டதை
  rationale: எபிரெயச் சொல்லின் நேரடியான ‘வெறுக்கப்பட்ட’ என்ற வலிமையைப் பாதுகாக்கிறது; ‘அன்பு குறைவாகப் பெற்றாள்’ என்று மென்மையாக்கவில்லை.
- source_word: וַיִּפְתַּח אֶת־רַחְמָהּ
  choice: அவர் அவளுடைய கருப்பையைத் திறந்தார்
  rationale: கருவுறும் திறனை அளித்தார் என்ற எபிரெய உருவகத்தை இயன்றவரை அப்படியே பாதுகாக்கிறது.
- source_word: עֲקָרָה
  choice: மலடியாக இருந்தாள்
  rationale: குழந்தை பெற இயலாத நிலையைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் சொற்றொடர்.
theological_decisions:
- issue: லேயாளின் நிலையை விவரிக்கும் שְׂנוּאָה என்பதன் வலிமை
  choice: வெறுக்கப்பட்டதை
  alternative: அன்பு செய்யப்படாததை / அன்பு குறைவாகப் பெற்றதை
  rationale: மூலச்சொல் ‘வெறுக்கப்பட்ட’ என்பதையே நேரடியாகக் கூறுகிறது. சூழலில் ஒப்பீட்டளவிலான அன்பின்மையை அது குறிக்கக்கூடும் என்றாலும், அந்த விளக்கத்தை முதன்மை உரைக்குள் கொண்டு வந்து பதற்றத்தைத் தீர்க்கவில்லை.
- issue: கருவுறுதலில் யெகோவாவின் செயற்பாடு
  choice: அவர் அவளுடைய கருப்பையைத் திறந்தார்
  alternative: அவர் அவளைக் கருவுறச் செய்தார்
  rationale: மூலத்தின் உடல்சார் உருவகத்தையும், தேவனுடைய நேரடியான செயற்பாட்டையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை. மூலத்தின் கடுமையான ‘வெறுக்கப்பட்ட’ என்ற சொல்லும் ‘கருப்பையைத் திறந்தார்’ என்ற உருவகமும் மென்மையாக்கப்படாமல் வைக்கப்பட்டுள்ளன.
