base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/032.yaml
  text: Leah conceived and bore a son[a], and she called his name Reuben, for she said, “Because Yahweh has seen my affliction, now my husband will love me.”
translation:
  language: ta
  text: லேயாள் கருவுற்று ஒரு மகனைப் பெற்றாள். அவனுக்கு ரூபன்[a] என்று பெயரிட்டாள். ஏனெனில் அவள், “யாவே என் துயரத்தைக் கண்டார்; இப்போது என் கணவர் என்னை நேசிப்பார்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ரூபன்” என்ற எபிரெயப் பெயர், “இதோ, ஒரு மகன்” என்பதற்கான எபிரெயச் சொற்களை ஒத்ததாக ஒலிக்கிறது; “யாவே என் துயரத்தைக் கண்டார்” என்ற லேயாளின் வார்த்தைகளோடும் இது தொடர்புபடுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: கருவுற்று
  rationale: הרה என்பது கருவுறுதலைக் குறிக்கிறது; ‘கருவுற்று’ என்பது சுருக்கமான, இயல்பான நவீனத் தமிழ் நடை.
- source_word: וַתֵּלֶד בֵּן
  choice: ஒரு மகனைப் பெற்றாள்
  rationale: ילד בן என்ற எபிரெயச் சொற்றொடர் மகனைப் பெற்றெடுத்தலைக் குறிக்கிறது; தமிழில் இது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַתִּקְרָא שְׁמוֹ רְאוּבֵן
  choice: அவனுக்கு ரூபன் என்று பெயரிட்டாள்
  rationale: எபிரெயப் பெயரிடும் வாய்பாட்டின் பொருளை இயல்பான தமிழில் தருகிறது; பெயருடன் தொடர்புடைய சொல்விளையாட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்தான தெய்வீகப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּעָנְיִי
  choice: என் துயரத்தை
  rationale: עֳנִי இங்கு லேயாளின் வேதனையையும் தாழ்ந்த நிலையையும் குறிக்கிறது; ‘துயரம்’ சாதாரண வாசகர்களுக்கு இயல்பாகவும் உணர்வுவலிமையுடனும் உள்ளது.
- source_word: יֶאֱהָבַנִי אִישִׁי
  choice: என் கணவர் என்னை நேசிப்பார்
  rationale: திருமணச் சூழலில் אִישִׁי என்பதற்கு ‘என் கணவர்’ பொருத்தமானது; எதிர்கால எதிர்பார்ப்பையும் אהב என்பதின் உறவுசார் வலிமையையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: லேயாளின் எதிர்பார்ப்பின் உறுதிநிலை
  choice: இப்போது என் கணவர் என்னை நேசிப்பார்
  alternative: இப்போது என் கணவர் நிச்சயமாக என்னை நேசிப்பார்
  rationale: எபிரெயத்தில் எதிர்கால நம்பிக்கை வெளிப்படுகிறது; ‘நிச்சயமாக’ போன்ற கூடுதல் வலியுறுத்தலைச் சேர்க்காமல் அதன் பதற்றத்தையும் எதிர்பார்ப்பையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயப் பெயரிடும் சொல்விளையாட்டு தமிழில் நேரடியாகப் பிரதிபலிக்காததால் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
