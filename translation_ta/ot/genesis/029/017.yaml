base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/017.yaml
  text: Leah’s eyes were soft[a], but Rachel was beautiful in form and appearance.
translation:
  language: ta
  text: லேயாளின் கண்கள் மென்மையாக இருந்தன[a], ஆனால் ராகேல் உடல்வடிவத்திலும் தோற்றத்திலும் அழகாக இருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “லேயாளின் கண்கள் நளினமாக இருந்தன” அல்லது “பலவீனமாக இருந்தன.” எபிரெயப் பெயரடை மென்மை அல்லது நளினத்தைக் குறிக்கலாம்; இங்கு அதன் துல்லியமான நுண்பொருள் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: கண்கள்
  rationale: எபிரெயச் சொல் லேயாளின் பொதுவான தோற்றத்தை அல்ல, அவரது கண்களையே நேரடியாகக் குறிக்கிறது.
- source_word: רַכּוֹת
  choice: மென்மையாக
  rationale: இந்தப் பெயரடை மென்மை அல்லது நளினத்தைக் குறிக்கலாம்; எதிர்மறையான மதிப்பீட்டைத் திணிக்காமல் அதன் அடிப்படைப் பொருளையும் தெளிவின்மையையும் காக்கும் சொல் இது.
- source_word: יְפַת תֹּאַר
  choice: உடல்வடிவத்தில் அழகாக
  rationale: இந்தச் சொற்றொடர் உடலின் வடிவம் அல்லது அமைப்பைக் குறிக்கிறது. מַרְאֶה என்பதிலிருந்து வேறுபாட்டைக் காக்க ‘உடல்வடிவம்’ பயன்படுத்தப்பட்டது.
- source_word: וִיפַת מַרְאֶה
  choice: தோற்றத்தில் அழகாக
  rationale: מַרְאֶה பார்வைக்குப் புலப்படும் தோற்றத்தைக் குறிக்கிறது; எபிரெயத்தின் இரட்டைப் பண்புவிளக்கத்தைச் சுருக்காமல் ‘தோற்றம்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: וְ
  choice: ஆனால்
  rationale: இணைப்புச்சொல்லின் அடிப்படைப் பொருள் ‘மற்றும்’ என்றாலும், இங்கு லேயாளையும் ராகேலையும் ஒப்பிட்டு வேறுபடுத்துவதால் நவீன தமிழில் ‘ஆனால்’ இயல்பாக அந்த எதிர்மறைத் தொடர்பை வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘உடல்வடிவம்’ மற்றும் ‘தோற்றம்’ என இரு தனித்த கூறுகள் வைக்கப்பட்டதால் எபிரெயத்தின் இணை விளக்கம் பாதுகாக்கப்படுகிறது; ரַכּוֹת என்பதன் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
