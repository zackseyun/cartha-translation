  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழிமரபான ‘குரலை உயர்த்தி அழுதல்’ தமிழில் சுருக்கமாகவும் அதன் தீவிரம் குன்றாமலும் ‘குரலெடுத்து அழுதார்’ என வழங்கப்பட்டுள்ளது.
