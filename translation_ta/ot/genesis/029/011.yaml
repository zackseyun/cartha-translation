  yaml_path: translation/ot/genesis/029/011.yaml
  text: Then Jacob kissed Rachel[a], and he lifted up his voice and wept.
translation:
  language: ta
  text: பின்பு யாக்கோபு ராகேலை முத்தமிட்டு[a], குரலெடுத்து அழுதார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ராகேலை முத்தமிட்டு வரவேற்றார்.” எபிரெய வினைச்சொல் பொதுவாக “முத்தமிட்டார்” என்று பொருள்படும்; இந்தச் சூழலில் அது உறவுமுறை சார்ந்த வரவேற்பையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשַּׁק
  choice: முத்தமிட்டு
  rationale: נשק என்பதன் கால் வினைவடிவம் பொதுவாக ‘முத்தமிடு’ என்று பொருள்படும். இங்கு அது உறவுமுறை சார்ந்த வரவேற்பு முத்தமாக இருக்கக்கூடும்; ஆயினும் மூலத்தின் நேரடியான உடற்செயலை மொழிபெயர்ப்பில் தக்கவைக்கிறது.
- source_word: לְרָחֵל
  choice: ராகேலை
  rationale: முத்தமிடுதல் என்ற வினையுடன் வரும் לְ தமிழில் இயல்பாகச் செயப்படுபொருள் வேற்றுமையில் வழங்கப்படுகிறது; பெயர் ‘ராகேல்’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיִּשָּׂא אֶת־קֹלוֹ
  choice: குரலெடுத்து
  rationale: சொல்லுக்கு சொல் ‘தன் குரலை உயர்த்தினார்’ என்ற எபிரெய மொழிமரபு இங்கு சத்தமாக அழுதலை அறிமுகப்படுத்துகிறது. ‘குரலெடுத்து’ என்பது அதன் வலிமையையும் தமிழ் இயல்பையும் ஒருங்கே காக்கிறது.
- source_word: וַיֵּבְךְּ
  choice: அழுதார்
  rationale: בכה என்பது ‘அழு/கண்ணீர் விட்டு அழு’ எனப் பொருள்படும். ‘அழுதார்’ நவீனத் தமிழில் இயல்பாகவும் கண்ணியமான கதைநடைப் பதிவுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: וַ
  choice: பின்பு
  rationale: தொடர்நிகழ்வைக் குறிக்கும் waw-consecutive வடிவத்தை, முந்தைய நிகழ்வைத் தொடர்ந்து நடந்த செயல் என இயல்பான தமிழில் காட்டுகிறது.
