  yaml_path: translation/ot/genesis/029/020.yaml
  text: So Jacob served seven years for Rachel[a], and they seemed like only a few days to him because of his love for her.
translation:
  language: ta
  text: யாக்கோபு ராகேலுக்காக ஏழு ஆண்டுகள் பணியாற்றினார்; அவள்மீது அவர் கொண்டிருந்த அன்பினால், அந்த ஆண்டுகள் அவருக்குச் சில நாட்களைப்போல் தோன்றின.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “அவை அவருடைய பார்வையில் சில நாட்களைப்போல் இருந்தன.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: பணியாற்றினார்
  rationale: עבד என்பது ‘பணிசெய்/ஊழியம் செய்’ என்ற பொருளுடையது. இங்கே யாக்கோபு ஒப்புக்கொண்ட மணமகள் பணிக்காலத்தைச் சுட்டுவதால், வெறும் ‘உழைத்தார்’ என்பதைவிட ‘பணியாற்றினார்’ என்பது உழைப்பையும் ஒப்பந்தச் சார்பையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: בְּרָחֵל
  choice: ராகேலுக்காக
  rationale: இந்தச் சூழலில் ב என்பது ராகேலை மணப்பதற்காகச் செய்யப்பட்ட பணியைச் சுட்டுகிறது. ‘ராகேலுக்காக’ என்பது மூலத்தின் சுருக்கத்தையும் இயல்பான தமிழையும் காக்கிறது; ‘ராகேலுக்கு ஈடாக’ என்று கூறி பரிமாற்றப் பொருளை அளவுக்கு மீறி வலியுறுத்தவில்லை.
- source_word: שֶׁבַע שָׁנִים
  choice: ஏழு ஆண்டுகள்
  rationale: எண்ணிக்கையையும் கால அளவையும் நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: וַיִּהְיוּ בְעֵינָיו
  choice: அவை அவருக்குத் … தோன்றின
  rationale: ‘அவருடைய கண்களில் இருந்தன’ என்பது எபிரெயக் கருத்துவழக்கின் சொற்சொல் வடிவம். தமிழில் தனிப்பட்ட உணர்வைத் தெளிவாகக் கூற ‘அவருக்குத் தோன்றின’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כְּיָמִים אֲחָדִים
  choice: சில நாட்களாகவே
  rationale: இந்தச் சொற்றொடர் ஏழு ஆண்டுகள் அவருக்கு மிகக் குறுகிய காலமாகத் தோன்றியதைக் குறிக்கிறது. ‘சில நாட்களாகவே’ என்பது ஒப்புமையையும் குறுகிய கால உணர்வையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּאַהֲבָתוֹ אֹתָהּ
  choice: அவள்மீது அவர் கொண்டிருந்த அன்பினால்
  rationale: ב இங்கே காரணத்தைக் குறிக்கிறது. இந்த வடிவம் அவள்மீது கொண்ட அன்பே ஆண்டுகள் குறுகியதாகத் தோன்றியதற்குக் காரணம் என்பதைத் தெளிவாகவும் மூலத்திற்கு நெருக்கமாகவும் தெரிவிக்கிறது.
