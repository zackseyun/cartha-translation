  yaml_path: translation/ot/genesis/029/015.yaml
  text: Then Laban said to Jacob[a], “Because you are my relative, should you work for me for nothing? Tell me, what your wages should be.”
translation:
  language: ta
  text: அப்போது லாபான் யாக்கோபிடம், “நீ என் உறவினன்[a] என்பதற்காக எனக்குச் சம்பளமில்லாமல் வேலை செய்ய வேண்டுமா? உனக்குச் சம்பளம் என்னவாக இருக்க வேண்டும் என்று சொல்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், ‘என் சகோதரன்’; இங்கு இச்சொல் விரிவான பொருளில் உறவினன் அல்லது குடும்பத்தைச் சேர்ந்தவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי
  choice: என்பதற்காக
  rationale: உறவுமுறையை அடிப்படையாகக் கொண்டு சம்பளமின்றி வேலை செய்வது நியாயமா எனக் கேட்கும் சொல்லாட்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָחִי
  choice: என் உறவினன்
  rationale: எபிரெயச் சொல் அடிப்படையில் ‘என் சகோதரன்’ என்று பொருள்பட்டாலும், இங்கு லாபானுக்கும் யாக்கோபுக்கும் உள்ள விரிவான உறவுமுறையைக் குறிக்கிறது; யாக்கோபு லாபானின் உடன்பிறந்த சகோதரன் அல்ல.
- source_word: וַעֲבַדְתַּנִי
  choice: எனக்கு ... வேலை செய்ய வேண்டுமா?
  rationale: עבד இங்கு லாபானுக்காகச் செய்யப்படும் உழைப்பைக் குறிக்கிறது. கேள்வித் துகளுடன் சேர்ந்த சொல்லாட்சியின் வினாவியல் தன்மையை ‘வேலை செய்ய வேண்டுமா?’ எனப் பேணுகிறது.
- source_word: חִנָּם
  choice: சம்பளமில்லாமல்
  rationale: அடுத்த வாக்கியத்தில் சம்பளம் பேசப்படுவதால், ஊதியம் பெறாத உழைப்பு என்ற சூழல்சார் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַגִּידָה לִּי
  choice: சொல்
  rationale: கட்டளை வினையின் நேரடியான, இயல்பான நவீனத் தமிழ் வடிவம்; ‘எனக்கு’ என்பது தமிழில் சூழலால் தெளிவாக இருப்பதால் மீண்டும் கூறப்படவில்லை.
- source_word: מַה מַשְׂכֻּרְתֶּךָ
  choice: உனக்குச் சம்பளம் என்னவாக இருக்க வேண்டும்
  rationale: מַשְׂכֹּרֶת என்பது கூலி அல்லது சம்பளத்தைக் குறிக்கிறது. இங்கு தொகையை நிர்ணயிக்கும்படி கேட்பதால் ‘என்னவாக இருக்க வேண்டும்’ என்பது பேச்சுவார்த்தைச் சூழலை வெளிப்படுத்துகிறது.
