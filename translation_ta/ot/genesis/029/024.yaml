translation_notes:
  register: நவீனத் தரத் தமிழில் எளிய, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் שִׁפְחָה இருமுறை வருவதால், சில்பாளின் முந்தைய நிலையையும் லேயாளிடம் அவளுக்கு அளிக்கப்பட்ட பங்கையும் வேறுபடுத்திக் காட்ட ‘பணிப்பெண்’ இரு இடங்களிலும் தக்கவைக்கப்பட்டுள்ளது.
