  source_fidelity: 'மூல எபிரெய வாக்கியத்தின் கூறுகள் அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன: லாபான் கொடுத்த செயல், சில்பாளின் லாபானுக்குரிய பணிப்பெண் நிலை, லேயாள் அவனுடைய மகள் என்பது, மற்றும் லேயாளுக்குப் பணிப்பெண்ணாக அவள் அளிக்கப்பட்ட பங்கு ஆகியவை தெளிவாக உள்ளன. לָהּ மற்றும் லְלֵאָה בִּתּוֹ ஆகிய ஒரே பெறுநரைக் குறிக்கும் இணை அமைப்பைத் தமிழில் ஒருமுறை இயல்பாகக் கூறுவது பொருளிழப்பை ஏற்படுத்தவில்லை.'
  naturalness: ‘லாபான் தன் பணிப்பெண்ணான சில்பாளைத் தன் மகள் லேயாளுக்குப் பணிப்பெண்ணாகக் கொடுத்தான்’ என்பது நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடையாக உள்ளது. ‘பணிப்பெண்’ இருமுறை வருவது மூலத்தில் שִׁפְחָה இருமுறை வருவதைப் பொருத்தமாக பிரதிபலிக்கிறது; அது தமிழில் இடர்பாடாக இல்லை.
  terminology: ‘சில்பாள்’ மற்றும் ‘லேயாள்’ வழக்கமான தமிழ்வேதாகமப் பெயர்வடிவங்களாக உள்ளன. שִׁפְחָה-க்கு ‘பணிப்பெண்’ என்பது வாசிக்க இயல்பான முதன்மைச் சொல்; அடிமை/சார்பு நிலை குறித்த முக்கிய நுணுக்கத்தை அடிக்குறிப்பு வெளிப்படையாகக் காக்கிறது. அடிக்குறிப்பு மூலச் சொல்லின் சமூகநிலையைத் தேவைக்கு மேல் உறுதிப்படுத்தாமல் ‘அநேகமாக’ எனத் தகுந்த எச்சரிக்கையுடன் கூறுகிறது.
