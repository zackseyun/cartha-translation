base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/024.yaml
  text: And Laban gave Zilpah his female servant to Leah his daughter as a female servant[a][b].
translation:
  language: ta
  text: லாபான் தன் பணிப்பெண்ணான சில்பாளைத் தன் மகள் லேயாளுக்குப் பணிப்பெண்ணாகக் கொடுத்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடிமைப்பெண்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் மற்றொருவரைச் சார்ந்து, அநேகமாக அடிமை நிலையில் இருந்த பெண் பணியாளரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: கொடுத்தான்
  rationale: נתן என்பதன் நேரடியான கதைநடைப் பொருள் ‘கொடுத்தான்’; இங்கு உள்ள ஒப்படைத்தல் சார்ந்த பொருளை மேலதிக விளக்கமின்றி இயல்பாகத் தெரிவிக்கிறது.
- source_word: לָהּ ... לְלֵאָה בִתּוֹ
  choice: தன் மகள் லேயாளுக்கு
  rationale: לָהּ என்பது சொற்படியாக ‘அவளுக்கு’ என்றாலும், தொடர்ந்து வரும் ‘தன் மகள் லேயாளுக்கு’ என்பதே அதன் சுட்டுப்பொருளைத் தெளிவுபடுத்துகிறது. தமிழில் ஒரே பெறுநரை இருமுறை கூறாமல் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: זִלְפָּה
  choice: சில்பாள்
  rationale: எபிரெய தனிப்பெயர் தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שִׁפְחָתוֹ
  choice: தன் பணிப்பெண்ணான
  rationale: שִׁפְחָה ஒரு ஆணின் அதிகாரத்திற்குட்பட்ட பெண் பணியாளர் அல்லது அடிமை நிலையைக் குறிக்கிறது. ‘பணிப்பெண்’ இயல்பான நவீனத் தமிழை வழங்குகிறது; அந்தச் சார்பு நிலை அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- source_word: שִׁפְחָה
  choice: பணிப்பெண்ணாக
  rationale: இறுதி பெயர்ச்சொல் சில்பாள் எந்தப் பங்கில் லேயாளுக்குக் கொடுக்கப்பட்டாள் என்பதைச் சொல்கிறது. ‘பணிப்பெண்ணாக’ அந்தப் பங்கு ஒதுக்கீட்டை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
