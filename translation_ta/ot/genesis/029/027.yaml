translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில் மொழிபெயர்க்கப்பட்டது. ‘இவளுடைய’ மற்றும் ‘இவளையும்’ என்பவை மூலத்தின் பெண்பால் சுட்டுதலைக் காக்கின்றன. ‘என்னோடு’ என்பது எபிரெய வடிவத்துக்கு நெருக்கமாக வைக்கப்பட்டாலும், அடிக்குறிப்பு லாபானுக்காகச் செய்யும் பணியென்ற சூழற்பொருளையும் வழங்குகிறது.
