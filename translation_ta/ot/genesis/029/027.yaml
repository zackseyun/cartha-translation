  text: מַלֵּ֖א שְׁבֻ֣עַ זֹ֑את וְ/נִתְּנָ֨ה לְ/ךָ֜ גַּם אֶת זֹ֗את בַּ/עֲבֹדָה֙ אֲשֶׁ֣ר תַּעֲבֹ֣ד עִמָּדִ֔/י ע֖וֹד שֶֽׁבַע שָׁנִ֥ים אֲחֵרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/027.yaml
  text: Complete this woman's bridal week[c][b][a], and we will give you this one also in return for the work that you will do with me for another seven years.
translation:
  language: ta
  text: இவளுடைய திருமண விழா வாரத்தை முடித்துவிடு; நீ எனக்காக இன்னும் ஏழு ஆண்டுகள் வேலை செய்வதற்குப் பதிலாக, இவளையும் உனக்குக் கொடுப்போம்.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘இவளுடைய வாரத்தை முடித்துவிடு.’ சூழலில் இது வழக்கமான திருமணக் கொண்டாட்ட வாரத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘இவளும் உனக்குக் கொடுக்கப்படுவாள்.’ எபிரெய வினை வடிவம் பெண்பால் ஒருமையில் உள்ளது; சூழலில் மற்ற மகளையும் கொடுப்பதாக லாபான் அளிக்கும் வாக்குறுதியே இதன் பொருள்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘என்னோடு வேலை செய்வதற்குப் பதிலாக.’ எபிரெய வினை சூழலுக்கேற்ப ‘வேலை செய்’ அல்லது ‘பணி செய்/சேவை செய்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: நிறைவு செய்
  rationale: מלא என்பதன் கட்டளை வடிவம் குறிப்பிட்ட காலத்தை முழுமையாக முடிக்கும்படி கூறுகிறது; ‘நிறைவு செய்’ கட்டளையின் வலிமையையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: שְׁבֻעַ זֹאת
  choice: இவளுடைய திருமண வாரம்
  rationale: שְׁבֻעַ இங்கு ஏழு நாட்களைக் கொண்ட வாரத்தைக் குறிக்கிறது; சூழலில் அது லேயாளின் திருமணக் கொண்டாட்ட வாரம். ‘இவளுடைய’ என்பது זֹאת என்ற பெண்பால் சுட்டுப்பெயரின் குறிப்பைத் தெளிவாகக் காக்கிறது.
- source_word: וְנִתְּנָה לְךָ
  choice: உனக்குக் கொடுப்போம்
  rationale: வடிவியல் அடிப்படையில் இது மூன்றாம் நபர் பெண்பால் ஒருமை வடிவமாக இருந்தாலும், சூழலில் லாபான் மற்ற மகளையும் கொடுப்பதாக அளிக்கும் வாக்குறுதியை இயல்பான தமிழில் பன்மை வினையாக வெளிப்படுத்துகிறது; மாற்று சொற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: גַּם אֶת זֹאת
  choice: இவளையும்
  rationale: இது மற்ற மகளான ராகேலைக் குறிக்கும் பெண்பால் சுட்டுச் சொல்லையும் גַּם என்பதன் ‘கூட/உம்’ பொருளையும் சுருக்கமாகக் காக்கிறது.
- source_word: בַּעֲבֹדָה
  choice: வேலை செய்வதற்குப் பதிலாக
  rationale: முன்னிடைச்சொல்லுடன் வரும் பெயர்ச்சொல், ராகேல் கொடுக்கப்படுவதற்கான நிபந்தனை அல்லது ஈடாகிய உழைப்பை இங்கு குறிக்கிறது.
- source_word: תַּעֲבֹד עִמָּדִי
  choice: என்னோடு வேலை செய்வதற்கு
  rationale: עבד என்பதற்கு ‘வேலை செய்’ அல்லது ‘பணி செய்/சேவை செய்’ என்ற பொருள்கள் இருக்கலாம். עִמָּדִי என்பதன் ‘என்னோடு’ என்ற வடிவத்தை காத்தபடி, வேலை ஏற்பாட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  choice: மேலும் ஏழு ஆண்டுகள்
  rationale: עוֹד என்பதன் கூடுதல் காலத்தையும், ஏற்கெனவே கூறப்பட்ட ஏழு ஆண்டுகளுக்கு அப்பாற்பட்ட மற்றொரு ஏழாண்டுக் காலத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
