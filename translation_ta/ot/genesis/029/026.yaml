  source_fidelity: 'மூல எபிரெயத்தின் பொருள் துல்லியமாகக் காக்கப்பட்டுள்ளது: லாபான் பேசுவது, உள்ளூர் சமூக வழக்கம், இளையவளை மூத்தவளுக்கு முன் திருமணத்தில் கொடுக்கக் கூடாது என்ற வரிசை ஆகியவை அனைத்தும் தெளிவாக உள்ளன. ‘வழக்கமில்லை’ என்பது לֹא יֵעָשֶׂה כֵן என்பதன் வழக்க/ஏற்றுக்கொள்ளப்பட்ட நடை என்ற நுணுக்கத்தை இயல்பாகத் தருகிறது.'
