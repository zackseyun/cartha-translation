reference: Genesis 29:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָבָ֔ן לֹא יֵעָשֶׂ֥ה כֵ֖ן בִּ/מְקוֹמֵ֑/נוּ לָ/תֵ֥ת הַ/צְּעִירָ֖ה לִ/פְנֵ֥י הַ/בְּכִירָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/026.yaml
  text: Laban said[a], “It is not done this way in our place[c][b], to give the younger before the older.”
translation:
  language: ta
  text: லாபான், “எங்கள் பகுதியில்[a] மூத்தவளுக்கு[c] முன் இளையவளைக் கொடுப்பது[b] வழக்கமில்லை” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “எங்கள் இடத்தில்”; இது அந்தப் பகுதியின் உள்ளூர் வழக்கத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, திருமணத்திற்குக் கொடுப்பது; “திருமணத்திற்கு” என்பது எபிரெயில் வெளிப்படையாகக் கூறப்படாமல் சூழலால் உணர்த்தப்படுகிறது.
    reason: implicit_context
  - marker: c
    text: அல்லது, “முதற்பேறானவளுக்கு”; எபிரெய்ச் சொல் பிறப்பு வரிசையில் முதலில் பிறந்த மகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָבָן
  choice: லாபான் … என்றான்
  rationale: எபிரெயக் கதைநடையில் וַיֹּאמֶר என்பது பொதுவாக ‘சொன்னான்/என்றான்’ எனப் பொருள்படும்; தமிழில் நேர்க்கூற்றுக்குப் பின் ‘என்றான்’ என்பது இயல்பான நடை.
- source_word: לֹא יֵעָשֶׂה כֵן
  choice: வழக்கமில்லை
  rationale: இந்தச் செயப்பாட்டு வடிவம் தனிப்பட்ட இயலாமையை அல்ல, சமூகத்தில் ஏற்றுக்கொள்ளப்பட்ட நடைமுறையைச் சுட்டுகிறது. ‘வழக்கமில்லை’ அந்தப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בִּמְקוֹמֵנוּ
  choice: எங்கள் பகுதியில்
  rationale: מָקוֹם என்பதன் அடிப்படைப் பொருள் ‘இடம்’; இங்கு அது உள்ளூர் வழக்கத்தைக் குறிக்கும். ‘எங்கள் பகுதியில்’ என்பது அதைப் பொருள் தெளிவுடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לָתֵת
  choice: கொடுப்பது
  rationale: எபிரெயில் வினை நேரடியாக ‘கொடுத்தல்’ என்றே உள்ளது; திருமணத்திற்குக் கொடுப்பது என்பது சூழலால் புரிகிறது. எனவே அந்த மறைபொருள் முதன்மை உரையில் விரித்துச் சேர்க்கப்படவில்லை.
- source_word: הַצְּעִירָה
  choice: இளையவளை
  rationale: பெண்பால் பெயரடையானது இங்கு பெயர்ச்சொல்லாகச் செயல்பட்டு இளைய மகளைக் குறிக்கிறது. ‘இளையவள்’ பாலையும் ஒப்பீட்டையும் காக்கிறது.
- source_word: לִפְנֵי
  choice: முன்
  rationale: இங்கு இது இடத்தைக் காட்டாமல் வரிசை அல்லது முன்னுரிமையைக் குறிக்கிறது; ‘முன்’ நேரடியான தமிழ் இணை.
- source_word: הַבְּכִירָה
  choice: மூத்தவளுக்கு
  rationale: பெண்பால் வடிவம் மூத்த அல்லது முதற்பேறான மகளைக் குறிக்கிறது. இந்தச் சூழலில் ‘மூத்தவள்’ இயல்பான தமிழாக இருந்து பிறப்பு வரிசை வேறுபாட்டையும் தெளிவாக்குகிறது.
