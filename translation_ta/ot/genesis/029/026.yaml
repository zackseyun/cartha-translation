translation_notes:
  register: நவீன நிலையான தமிழில், எளியதாயினும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. உள்ளூர் சமூக வழக்கைக் குறிக்கும் எபிரெயச் செயப்பாட்டு அமைப்பு தமிழில் இயல்பாக ‘வழக்கமில்லை’ என வழங்கப்பட்டுள்ளது; திருமணம் என்ற சூழற்பொருள் அடிக்குறிப்பில் மட்டும் விளக்கப்பட்டுள்ளது.
