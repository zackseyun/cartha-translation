  source_fidelity: மூல எபிரெயத்தின் வினா–விடை அமைப்பும் பொருளும் துல்லியமாகப் பேணப்பட்டுள்ளன. הֲשָׁלוֹם לוֹ என்பதன் நலவிசாரிப்பு அர்த்தம் “அவர் நலமாக இருக்கிறாரா?” எனச் சரியாக வழங்கப்பட்டுள்ளது; பதிலிலுள்ள שָׁלוֹם-மும் அதேபோல் பிரதிபலிக்கப்படுகிறது. וְהִנֵּה-யின் உடனடிக் கவனஈர்ப்பு “இதோ” மூலம் காக்கப்படுகிறது. ராகேல் லாபானின் மகள் என்பதும், அவள் மந்தையோடு வருகிறாள் என்பதும் முழுமையாக உள்ளது.
