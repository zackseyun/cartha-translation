base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/006.yaml
  text: He said to them[a], “Is he well?” And they said, “He is well. And look, Rachel his daughter is coming with the flock.”
translation:
  language: ta
  text: அவன் அவர்களிடம், “அவர் நலமாக இருக்கிறாரா?[a]” என்று கேட்டான். அதற்கு அவர்கள், “அவர் நலமாக இருக்கிறார். இதோ, அவருடைய மகள் ராகேல் மந்தையோடு வருகிறாள்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்கு எல்லாம் நலமாக இருக்கிறதா?” எபிரெய மொழியில் இங்கு ஷாலோம் என்பது ஒருவருடைய நலத்தையும் சுகநிலையையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲשָׁלוֹם לוֹ
  choice: அவர் நலமாக இருக்கிறாரா?
  rationale: שָׁלוֹם இங்கு சமாதானம் என்ற கருத்தைக் காட்டிலும் லாபானின் நலத்தை விசாரிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் மரியாதை ஒருமையைப் பேணியும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: שָׁלוֹם
  choice: அவர் நலமாக இருக்கிறார்
  rationale: பதிலில் கேள்வியின் שָׁלוֹם மீண்டும் வருகிறது; தமிழில் தெளிவான முழு வாக்கியமாக அதன் பொருள் வழங்கப்படுகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: உடனே கண்ணில் படும் ஒருவரை நோக்கிக் கவனத்தைத் திருப்பும் எபிரெயச் சொல்லின் சுட்டும் வலிமையை ‘இதோ’ இயல்பாகப் பேணுகிறது.
- source_word: רָחֵל
  choice: ராகேல்
  rationale: எபிரெயப் பெயரின் ஒலிப்புக்கு நெருக்கமான, தமிழில் நிலைபெற்ற வடிவம்.
- source_word: בִּתּוֹ
  choice: அவருடைய மகள்
  rationale: மூன்றாம் ஆண் ஒருமை பின்னொட்டு லாபானைக் குறிக்கிறது; மரியாதை ஒருமைக்கு ஏற்ப ‘அவருடைய’ பயன்படுத்தப்பட்டது.
- source_word: בָּאָה
  choice: வருகிறாள்
  rationale: הִנֵּה அறிமுகப்படுத்தும் உடனடி காட்சியில் நடந்துகொண்டிருக்கும் வருகையை இயல்பான தமிழ் நிகழ்கால வடிவம் வெளிப்படுத்துகிறது.
- source_word: עִם הַצֹּאן
  choice: மந்தையோடு
  rationale: צֹאן என்பது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய சிறுகால்நடைக் கூட்டைக் குறிக்கலாம்; ‘மந்தை’ அந்தக் கூட்டு அர்த்தத்தைப் பேணுகிறது.
