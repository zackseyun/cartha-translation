translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான மற்றும் கண்ணியமான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ஆண் பன்மை அழைப்பை ‘சகோதரர்களே’ என்பதால் வெளிப்படுத்தி, அதன் சூழல்சார் மரியாதைப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
