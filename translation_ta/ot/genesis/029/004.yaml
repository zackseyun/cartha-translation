source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יַעֲקֹ֔ב אַחַ֖/י מֵ/אַ֣יִן אַתֶּ֑ם וַ/יֹּ֣אמְר֔וּ מֵ/חָרָ֖ן אֲנָֽחְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/004.yaml
  text: Jacob said to them[a], “My brothers, where are you from?” They said[b], “We are from Haran.”
translation:
  language: ta
  text: யாக்கோபு அவர்களிடம், “என் சகோதரர்களே[a], நீங்கள் எந்த இடத்தைச் சேர்ந்தவர்கள்?[b]” என்றான். அதற்கு அவர்கள், “நாங்கள் ஆரானைச் சேர்ந்தவர்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் சகோதரர்களே” என்பது இங்கு சொந்த சகோதரர்கள் என்று அவசியம் பொருள்படாது; ஆண்களை நட்புடனும் மரியாதையுடனும் அழைக்கும் முறை.
    reason: cultural_note
  - marker: b
    text: இன்னும் சொற்சொல்லாக, “நீங்கள் எங்கிருந்து?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: அவர்களிடம் … என்றான்
  rationale: אמר என்பது பொதுவான பேச்சு வினை; தமிழில் நேர்கூற்றை இயல்பாக அமைக்க ‘அவர்களிடம் … என்றான்’ என மொழிபெயர்க்கப்பட்டது. கேள்வி வந்தாலும், ‘கேட்டான்’ என்று பேச்சுச் செயலின் தன்மையை மேலதிகமாக விளக்காமல் மூலத்தின் பொதுவான வினை தக்கவைக்கப்படுகிறது.
- source_word: יַעֲקֹב
  choice: யாக்கோபு
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: אַחַי
  choice: என் சகோதரர்களே
  rationale: சொல்லுக்கு நேரான பொருள் ‘என் சகோதரர்கள்.’ அறிமுகமில்லாத ஆண் மேய்ப்பர்களை நட்புடனும் மரியாதையுடனும் அழைக்கும் விளிவடிவமாக இங்கு பயன்படுத்தப்பட்டுள்ளது; மூலத்திலுள்ள முதலாம் நபர் உடைமைப் பொருளும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: מֵאַיִן אַתֶּם
  choice: நீங்கள் எங்கிருந்து வந்தவர்கள்?
  rationale: מֵאַיִן என்பது பிறப்பிடம் அல்லது வந்த இடத்தை விசாரிக்கிறது. ‘நீங்கள் எங்கிருந்து?’ என்ற சொற்சொல்லான அமைப்பைவிட இது இயல்பான நவீனத் தமிழ்; பன்மை ‘நீங்கள்’ என்பதும் வெளிப்படையாக உள்ளது.
- source_word: וַיֹּאמְרוּ
  choice: என்றார்கள்
  rationale: אמר என்பதன் பொதுவான பேச்சுப் பொருளைத் தக்கவைக்கிறது. சூழலால் இது பதிலாக இருந்தாலும், ‘பதிலளித்தார்கள்’ என்ற விளக்கத்தை வினைக்குள் சேர்க்கவில்லை.
- source_word: מֵחָרָן אֲנָחְנוּ
  choice: நாங்கள் ஆரானிலிருந்து வந்தவர்கள்
  rationale: מִן முன்னொட்டு வந்த இடத்தைக் குறிக்கிறது; אֲנָחְנוּ என்பது ‘நாங்கள்.’ தமிழில் முழுமையான, இயல்பான பதிலாக அமைய ‘வந்தவர்கள்’ சேர்க்கப்பட்டுள்ளது.
