  source_fidelity: 'மூலத்தின் முக்கியச் சொற்கள் பொதுவாகத் துல்லியமாக உள்ளன: הָבָה-க்கு “எனக்குக் கொடும்,” אִשְׁתִּי-க்கு “என் மனைவியை,” மற்றும் מָלְאוּ יָמָי-க்கு “என் நாட்கள் நிறைவடைந்துவிட்டன” பொருந்துகின்றன. ஆனால் இறுதி வாக்கியமான “நான் அவளிடம் சேர வேண்டும்” என்பது எபிரெய கூட்டுறுதியான/நோக்கக் கூறான וְאָבוֹאָה אֵלֶיהָ-வின் “நான் அவளிடம் சேரும்படி” என்ற நோக்கத்தைச் சிறிது கட்டாயமாக (“வேண்டும்”) மாற்றுகிறது. திருத்தம் அந்த நோக்கத்தையும் மறைமுகச் சொல்லாட்சியையும் காக்கிறது.'
