  yaml_path: translation/ot/genesis/029/021.yaml
  text: Then Jacob said to Laban[a], “Give me my wife, for my days are fulfilled, that I may go in to her.”
translation:
  language: ta
  text: அப்போது யாக்கோபு லாபானிடம், “என் நாட்கள் நிறைவடைந்துவிட்டதால், அவளிடம் நான் சேரும்படி என் மனைவியை எனக்குக் கொடும்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבָה
  choice: எனக்குக் கொடும்
  rationale: லாபானை நோக்கிய வேண்டுகோள் வடிவம். திருமண ஒப்பந்தச் சூழலில் மறைந்துள்ள ‘எனக்கு’ என்ற மறைமுகச் செயப்படுபொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘கொடும்’ மரியாதையுடனான கட்டளை/வேண்டுகோள் நயத்தைத் தருகிறது.
- source_word: אֶת אִשְׁתִּי
  choice: என் மனைவியை
  rationale: אִשָּׁה என்பதன் இச்சூழலுக்குரிய திருமணப் பொருளைத் துல்லியமாகத் தருகிறது; ‘பெண்’ என்பது தெளிவற்றது, ‘மணப்பெண்’ என்பது மூலத்தில் இல்லாத திருமணநிலை வேறுபாட்டைச் சேர்க்கலாம்.
- source_word: כִּי מָלְאוּ יָמָי
  choice: என் நாட்கள் நிறைவடைந்துவிட்டன
  rationale: எழுத்துப்படி உள்ள ‘என் நாட்கள் நிறைந்தன/நிறைவுற்றன’ என்ற சொல்லாட்சியைப் பாதுகாத்து, ஒப்புக்கொண்ட பணிக்காலம் முடிந்ததைக் சூழல் வழியாக உணர்த்துகிறது.
- source_word: וְאָבוֹאָה אֵלֶיהָ
  choice: நான் அவளிடம் சேர வேண்டும்
  rationale: בוא אל என்ற எபிரெய மறைமுகப் பாலுறவுச் சொல்லாட்சியின் அடக்கத்தையும் திருமணத்தை நிறைவேற்றும் நோக்கத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது. Cohortative வடிவத்தின் நோக்கம்/விருப்ப நயத்தை ‘வேண்டும்’ தக்கவைக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம உரைநடை பயன்படுத்தப்பட்டது. மூலத்தின் ‘என் நாட்கள்’ என்ற உருவகம் பாதுகாக்கப்பட்டுள்ளது; பாலுறவைக் குறிக்கும் எபிரெய மறைமுகச் சொல்லாட்சி தமிழில் இயல்பாக ‘அவளிடம் சேர’ என வழங்கப்பட்டு, எழுத்துப்படியான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
