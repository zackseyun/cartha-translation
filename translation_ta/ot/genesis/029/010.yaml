source:
  edition: WLC
  text: וַ/יְהִ֡י כַּ/אֲשֶׁר֩ רָאָ֨ה יַעֲקֹ֜ב אֶת רָחֵ֗ל בַּת לָבָן֙ אֲחִ֣י אִמּ֔/וֹ וְ/אֶת צֹ֥אן לָבָ֖ן אֲחִ֣י אִמּ֑/וֹ וַ/יִּגַּ֣שׁ יַעֲקֹ֗ב וַ/יָּ֤גֶל אֶת הָ/אֶ֨בֶן֙ מֵ/עַל֙ פִּ֣י הַ/בְּאֵ֔ר וַ/יַּ֕שְׁקְ אֶת צֹ֥אן לָבָ֖ן אֲחִ֥י אִמּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/010.yaml
  text: And when Jacob saw Rachel[a], the daughter of Laban, his mother’s brother, and the flock of Laban, his mother’s brother, Jacob came near and rolled the stone from the mouth of the well, and watered the flock of Laban, his mother’s brother.
translation:
  language: ta
  text: யாக்கோபு தன் தாயின் சகோதரனான லாபானின் மகள் ராகேலையும்[a], தன் தாயின் சகோதரனான லாபானின் மந்தையையும் கண்டபோது, அவன் அருகே சென்று, கிணற்றின் வாயிலிருந்து கல்லை உருட்டிவிட்டு, தன் தாயின் சகோதரனான லாபானின் மந்தைக்குத் தண்ணீர் கொடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனத்தில் “தன் தாயின் சகோதரனான லாபான்” என்ற உறவுமுறை மூன்று முறை வருகிறது; லாபானுடன் யாக்கோபுக்கு இருந்த குடும்ப உறவை இது வலியுறுத்துகிறது.
    reason: மூலத்தின் நோக்கமுள்ள மறுபடியும் கூறுதலை வாசகர் கவனிக்க உதவுகிறது.
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: கண்டபோது
  rationale: எபிரெயக் கதைத் தொடரின் காலத் தொடர்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; தனியாக ‘அப்போது நிகழ்ந்தது’ என்று மொழிபெயர்ப்பது தமிழில் தேவையற்ற சுமையை ஏற்படுத்தும்.
- source_word: אֲחִי אִמּוֹ
  choice: தன் தாயின் சகோதரனான
  rationale: ‘தாய்மாமன்’ என்ற சுருக்கமான உறவுமுறைச் சொல்லுக்குப் பதிலாக, மூலத்தில் மூன்று முறை வரும் வெளிப்படையான உறவுமுறைச் சொற்றொடரைப் பாதுகாக்கிறது.
- source_word: צֹאן
  choice: மந்தை
  rationale: இந்த எபிரெயச் சொல் ஆடுகள் அல்லது செம்மறியாடுகள் உள்ளிட்ட சிறிய கால்நடைகளின் கூட்டத்தைக் குறிக்கலாம்; ‘மந்தை’ இனத்தைத் தேவையின்றிக் குறிப்பாக்காமல் கூட்டுப் பொருளைத் தருகிறது.
- source_word: וַיִּגַּשׁ
  choice: அருகே சென்று
  rationale: செயல் நடைபெறும் இடத்தை நோக்கி யாக்கோபு அணுகிய உடல் இயக்கத்தைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: וַיָּגֶל
  choice: உருட்டிவிட்டு
  rationale: גלל வினையின் உருட்டுதல் என்ற தெளிவான படிமத்தைப் பாதுகாக்கிறது; கல்லை வெறுமனே ‘அகற்றினான்’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: கிணற்றின் வாயிலிருந்து
  rationale: ‘கிணற்றின் வாய்’ என்ற மூல உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் தக்கவைத்து, கல் அங்கிருந்து நகர்த்தப்பட்டதை இயல்பாகக் கூறுகிறது.
- source_word: וַיַּשְׁקְ
  choice: தண்ணீர் கொடுத்தான்
  rationale: שׁקה என்பதன் காரணவினைப் பொருளான கால்நடைகளுக்குத் தண்ணீர் அளித்தலை எளிய, தெளிவான தமிழில் வெளிப்படுத்துகிறது.
