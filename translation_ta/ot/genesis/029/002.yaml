base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/002.yaml
  text: He looked[a], and behold, there was a well in the field, and behold, three flocks of sheep were lying there beside it, because from that well they watered the flocks[e][d][c][b]. And the stone on the mouth of the well was large.
translation:
  language: ta
  text: அவன் பார்த்தான்[a]; இதோ, வயல்வெளியில் ஒரு கிணறு இருந்தது. இதோ, அதன் அருகில்[b] மூன்று ஆட்டு மந்தைகள் படுத்திருந்தன; ஏனெனில், அந்தக் கிணற்றிலிருந்து மந்தைகளுக்குத் தண்ணீர் கொடுப்பார்கள். கிணற்றின் வாயின்மேல்[c] இருந்த கல் பெரியதாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவன் கண்டான்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லளவில், ‘அதன்மேல்’; இங்கு ‘அதன் அருகில்’ என்பது பொருள்.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, கிணற்றின் திறப்பின்மேல்.
    reason: clarification
lexical_decisions:
- source_word: וַיַּרְא
  choice: அவன் பார்த்தான்
  rationale: ראה என்பதன் தொடர்கதை வடிவம் நிகழ்வை முன்னெடுக்கிறது; ‘பார்த்தான்’ என்பது காட்சியை இயல்பாக அறிமுகப்படுத்துகிறது. ‘கண்டான்’ என்பதும் சாத்தியம்.
- source_word: וְהִנֵּה ... וְהִנֵּה
  choice: இதோ ... இதோ
  rationale: கவனத்தை ஈர்த்து காட்சிக்கு உயிரோட்டம் தரும் הִנֵּה என்ற சொல்லின் இருமுறை பயன்பாட்டைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: בְאֵר בַּשָּׂדֶה
  choice: வயல்வெளியில் ஒரு கிணறு
  rationale: בְאֵר என்பதற்கு ‘கிணறு’ என்றும் שָׂדֶה என்பதற்கு இச்சூழலில் திறந்த வயல்வெளி என்றும் நேரடியாகவும் இயல்பாகவும் பொருள் தருகிறது.
- source_word: שְׁלֹשָׁה עֶדְרֵי צֹאן
  choice: மூன்று ஆட்டு மந்தைகள்
  rationale: עֵדֶר என்பது மந்தையையும் צֹאן என்பது பொதுவாகச் செம்மறியாடுகள் மற்றும் வெள்ளாடுகள் போன்ற சிறிய கால்நடைகளையும் குறிக்கலாம்; ‘ஆட்டு மந்தைகள்’ தமிழில் சுருக்கமாக அந்தப் பொதுப் பொருளைத் தருகிறது.
- source_word: רֹבְצִים
  choice: படுத்திருந்தன
  rationale: רבץ விலங்குகள் படுத்திருப்பதை அல்லது ஓய்வெடுப்பதைக் குறிக்கிறது; ‘படுத்திருந்தன’ அதன் காட்சிசார் பொருளை நேரடியாகத் தருகிறது.
- source_word: עָלֶיהָ
  choice: அதன் அருகில்
  rationale: சொல்லளவில் ‘அதன்மேல்’ என்றாலும், கிணற்றைச் சார்ந்த இவ்விடத்தில் மந்தைகள் அதன் பக்கத்தில் இருந்தன என்ற இடப்பொருளே இயல்பானது.
- source_word: יַשְׁקוּ
  choice: தண்ணீர் காட்டுவார்கள்
  rationale: שׁקה என்பதன் causative வடிவம் விலங்குகளுக்குக் குடிக்கத் தண்ணீர் கொடுப்பதைக் குறிக்கிறது. நிறைவுறாத வினைவடிவத்தின் வழக்கமான அல்லது பொதுவான செயல் நுணுக்கத்தை ‘காட்டுவார்கள்’ தக்கவைக்கிறது.
- source_word: עַל פִּי הַבְּאֵר
  choice: கிணற்றின் வாயின்மேல்
  rationale: ‘கிணற்றின் வாய்மேல்’ என்ற எபிரெய உருவகத்தைத் தமிழிலும் இயல்பாகத் தக்கவைத்து, கல் அதன் திறப்பை மூடியிருந்த இடத்தைக் காட்டுகிறது.
- source_word: וְהָאֶבֶן גְּדֹלָה
  choice: இருந்த கல் பெரியதாக இருந்தது
  rationale: எபிரெய மொழியில் இது முழுமையான விளக்க வாக்கியக்கூறு; கல்லின் பெருமையை அடுத்த நிகழ்வுக்கான பின்னணியாக வெளிப்படுத்துகிறது.
