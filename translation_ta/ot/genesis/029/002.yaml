translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் உயிரோட்டத்தைத் தரும் இரு ‘இதோ’களும் தக்கவைக்கப்பட்டுள்ளன. மேய்ப்புச் சூழலில் கால்நடைகளுக்குக் குடிநீர் கொடுப்பதைச் சுட்டும் இயல்பான தமிழ்ச் சொற்றொடராக ‘தண்ணீர் காட்டுவார்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
