  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ לָבָ֜ן אֶת שֵׁ֣מַע יַעֲקֹ֣ב בֶּן אֲחֹת֗/וֹ וַ/יָּ֤רָץ לִ/קְרָאת/וֹ֙ וַ/יְחַבֶּק ל/וֹ֙ וַ/יְנַשֶּׁק ל֔/וֹ וַ/יְבִיאֵ֖/הוּ אֶל בֵּית֑/וֹ וַ/יְסַפֵּ֣ר לְ/לָבָ֔ן אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/013.yaml
  text: And when Laban heard the news about Jacob[a], his sister’s son, he ran to meet him and embraced him and kissed him and brought him to his house[c][b]. Then Jacob told Laban all these things.
translation:
  language: ta
  text: தன் சகோதரியின் மகனான யாக்கோபைப் பற்றிய செய்தியை லாபான் கேட்டபோது, அவனைச் சந்திக்க ஓடினான். அவனைத் தழுவி முத்தமிட்டு, தன் வீட்டுக்கு அழைத்துச் சென்றான். பின்பு யாக்கோபு[a] இவை அனைத்தையும் லாபானிடம் சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் எழுவாய் பெயரால் குறிப்பிடப்படாமல், ‘அவன் சொன்னான்’ என்றே உள்ளது. சூழலின்படி அது யாக்கோபைக் குறிக்கிறது.
    reason: subject_ambiguity
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: கேட்டபோது
  rationale: כ + வினையெச்சக் கட்டமைப்பு காலத்தைச் சுட்டுகிறது. உடனடித் தன்மையை மிகைப்படுத்தாமல் இயல்பான தமிழில் நிகழ்வின் வரிசையைத் தருகிறது.
- source_word: שֵׁמַע יַעֲקֹב
  choice: யாக்கோபைப் பற்றிய செய்தி
  rationale: שֵׁמַע இங்கு கேட்கும் செயலை அல்ல, ஒருவரைப் பற்றிய செய்தி அல்லது தகவலைக் குறிக்கிறது.
- source_word: בֶּן אֲחֹתוֹ
  choice: தன் சகோதரியின் மகன்
  rationale: ‘மருமகன்’ போன்ற உறவுப்பெயரைக் காட்டிலும் எபிரெய மூலத்தின் துல்லியமான உறவுமுறையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיָּרָץ לִקְרָאתוֹ
  choice: அவனைச் சந்திக்க ஓடினான்
  rationale: לִקְרָאתוֹ என்பதன் ‘எதிர்கொண்டு சந்திக்க’ என்ற பொருளைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: וַיְחַבֶּק לוֹ
  choice: அவனைத் தழுவி
  rationale: חבק என்பதன் பொருளை கண்ணியமான நவீன நடையில் வெளிப்படுத்துகிறது.
- source_word: וַיְנַשֶּׁק לוֹ
  choice: முத்தமிட்டு
  rationale: குடும்ப வரவேற்பின் சூழலில் נשׁק என்ற வினையின் நேரடியான பொருளைப் பாதுகாக்கிறது.
- source_word: וַיְבִיאֵהוּ אֶל־בֵּיתוֹ
  choice: தன் வீட்டுக்கு அழைத்துச் சென்றான்
  rationale: காரணவினை வடிவிலுள்ள בוא ஒருவரை ஓர் இடத்துக்குக் கொண்டுசெல்லுதலைக் குறிக்கிறது; தமிழில் ‘அழைத்துச் சென்றான்’ இச்சூழலில் இயல்பாக உள்ளது.
- source_word: וַיְסַפֵּר
  choice: சொன்னான்
  rationale: Piel வடிவிலுள்ள ספר விவரித்தல் அல்லது எடுத்துச் சொல்லுதலைக் குறிக்கிறது; எளிய நவீன தமிழில் ‘சொன்னான்’ பொருத்தமானது.
- source_word: אֵת כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: இவை அனைத்தையும்
  rationale: דברים இங்கு சொற்களை மட்டும் அல்லாமல் முன்னர் நிகழ்ந்த அல்லது தொடர்புடைய காரியங்களை விரிவாகக் குறிக்கிறது.
