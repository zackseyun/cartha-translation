  text: וַ/יַּגֵּ֨ד יַעֲקֹ֜ב לְ/רָחֵ֗ל כִּ֣י אֲחִ֤י אָבִ֨י/הָ֙ ה֔וּא וְ/כִ֥י בֶן רִבְקָ֖ה ה֑וּא וַ/תָּ֖רָץ וַ/תַּגֵּ֥ד לְ/אָבִֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/012.yaml
  text: Jacob told Rachel that he was her father's relative and that he was Rebekah's son[a]. Then she ran and told her father.
translation:
  language: ta
  text: யாக்கோபு ராகேலிடம், தான் அவளுடைய தந்தையின் உறவினன் என்றும் ரெபெக்காளின் மகன் என்றும் சொன்னான். அவள் ஓடிப்போய் தன் தந்தையிடம் இதைச் சொன்னாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: சொன்னான்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் இங்கு ஒரு செய்தியைத் தெரிவித்தல் அல்லது தெரியப்படுத்துதல் என்ற பொருளில் வருகிறது; இயல்பான தமிழ் கதைநடைக்கு ‘சொன்னான்’ பொருந்துகிறது.
- source_word: כִּי
  choice: என்றும்
  rationale: ‘சொன்னான்’ என்பதற்குப் பின் வரும் தெரிவிக்கப்பட்ட செய்தியின் இரண்டு உட்பிரிவுகளையும் தமிழில் இயல்பாக இணைக்க ‘என்றும் … என்றும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲחִי אָבִיהָ
  choice: அவளுடைய தந்தையின் உறவினர்
  rationale: אָח என்பதன் அடிப்படைப் பொருள் ‘சகோதரன்’; ஆனால் இங்கு அது நெருங்கிய ஆண் உறவினரைக் குறிக்கும் குடும்ப உறவுமுறைச் சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது. யாக்கோபு லாபானின் மருமகன் அல்ல, சகோதரியின் மகன்; எனவே தவறான நேரடிப் பொருளைத் தவிர்த்து உறவின் பொதுப் பொருள் தரப்பட்டுள்ளது.
- source_word: בֶן רִבְקָה
  choice: ரெபெக்காளின் மகன்
  rationale: எளிய தாய்–மகன் உறவை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: וַתָּרָץ
  choice: ஓடிப்போய்
  rationale: רוץ என்பது உண்மையாக ஓடுதலைக் குறிக்கிறது; காட்சியின் வேகத்தையும் தொடர்ச்சியான செயலையும் தமிழில் காக்கிறது.
- source_word: וַתַּגֵּד לְאָבִיהָ
  choice: தன் தந்தையிடம் இதைச் சொன்னாள்
  rationale: செய்தியைத் தந்தையிடம் தெரிவித்தாள் என்ற பொருளை இயல்பான தமிழில் தருகிறது; ‘இதை’ என்பது முன் கூறப்பட்ட செய்தியையே சுட்டுகிறது.
