translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உறவினர்’ என்பது மூலத்தின் உறவுமுறை மரபுத்தொடரைத் தவறாகச் சொந்தச் சகோதரன் எனப் புரிந்துகொள்ளாமல் காக்கிறது; நேரடிப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
