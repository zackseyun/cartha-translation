  text: Laban had two daughters; the name of the older was Leah[a], and the name of the younger was Rachel.
translation:
  language: ta
  text: லாபானுக்கு இரண்டு மகள்கள் இருந்தனர்[a]. மூத்தவளின் பெயர் லேயாள்; இளையவளின் பெயர் ராகேல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்கு சொல், ‘லாபானுக்கு இரண்டு மகள்கள் [இருந்தனர்]’; இது ‘லாபானுக்கு இரண்டு மகள்கள் இருந்தனர்’ என்று பொருள்படும் உடைமைச் சொல்லமைப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְלָבָן
  choice: லாபானுக்கு ... இருந்தார்கள்
  rationale: எபிரெய மொழியின் ‘லாபானுக்கு இரண்டு மகள்கள் [இருந்தனர்]’ என்ற உடைமைக்கான இயல்பான சொல்லமைப்பைத் தமிழில் தெளிவாகவும், அதன் வடிவத்தை ஓரளவு பாதுகாத்தும் தருகிறது. தொடக்க வாவுக்கு தனியே ‘இப்போது’ என்று சேர்க்கப்படவில்லை.
- source_word: שְׁתֵּי בָנוֹת
  choice: இரண்டு மகள்கள்
  rationale: எண்ணும் பெயர்ச்சொல்லும் கொண்ட மூலத்தொடரின் நேரான, இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: שֵׁם
  choice: பெயர்
  rationale: இரு இணையான அடையாளக் கூறுகளிலும் மூலத்தில் வரும் ‘பெயர்’ என்ற சொல்லைத் தக்கவைக்கிறது.
- source_word: הַגְּדֹלָה
  choice: மூத்தவள்
  rationale: இரு சகோதரிகளின் வயது உறவை இச்சூழலில் இயல்பாகக் குறிக்கிறது; அளவில் பெரியவள் என்ற தவறான பொருளைத் தவிர்க்கிறது.
- source_word: לֵאָה
  choice: லேயாள்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் மரபாக அறியப்பட்ட வடிவில் எழுத்துப்பெயர்க்கிறது.
- source_word: וְשֵׁם
  choice: இளையவளின் பெயர்
  rationale: மூலத்தின் இணை அமைப்பையும் ‘பெயர்’ என்ற சொல்லின் மீள்வருகையையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: הַקְּטַנָּה
  choice: இளையவள்
  rationale: சகோதரிகளுக்கிடையேயான ஒப்பீட்டில் வயதில் இளையவள் என்பதே சூழல்சார் பொருள்.
- source_word: רָחֵל
  choice: ராகேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் மரபாக அறியப்பட்ட வடிவில் எழுத்துப்பெயர்க்கிறது.
