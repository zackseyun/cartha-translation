  text: וַ/תַּ֨הַר ע֜וֹד וַ/תֵּ֣לֶד בֵּ֗ן וַ/תֹּ֨אמֶר֙ הַ/פַּ֨עַם֙ אוֹדֶ֣ה אֶת יְהוָ֔ה עַל כֵּ֛ן קָרְאָ֥ה שְׁמ֖/וֹ יְהוּדָ֑ה וַֽ/תַּעֲמֹ֖ד מִ/לֶּֽדֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/035.yaml
  text: And she conceived again and bore a son[a], and she said, “This time I will praise Yahweh.” Therefore she named him Judah. Then she stopped bearing children.
translation:
  language: ta
  text: அவள் மீண்டும் கருவுற்று ஒரு மகனைப் பெற்றாள். அப்போது அவள், “இந்த முறை நான் யாவேவைத் துதிப்பேன்” என்றாள். ஆகவே அவனுக்கு யூதா[a] என்று பெயரிட்டாள். அதன்பின் அவளுக்குப் பிள்ளை பிறப்பது நின்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூதா” என்ற எபிரேயப் பெயர், “துதிப்பேன்” அல்லது “நன்றி செலுத்துவேன்” என்பதற்கான எபிரேய வினைச்சொல்லை ஒத்தொலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: அவள் மீண்டும் கருவுற்று
  rationale: הרה என்பது கருவுறுதலைக் குறிக்கிறது; עוֹד இப்பிறப்புத் தொடரில் மீண்டும் நிகழ்வதைக் குறிக்கிறது.
- source_word: וַתֵּלֶד בֵּן
  choice: ஒரு மகனைப் பெற்றாள்
  rationale: தமிழில் குழந்தைப் பிறப்பை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கும் நடை.
- source_word: הַפַּעַם
  choice: இந்த முறை
  rationale: முந்தைய பிறப்புகளுடன் இந்நிகழ்வை வேறுபடுத்தும் சுட்டுப் பொருளை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: אוֹדֶה
  choice: நான் ... துதிப்பேன்
  rationale: ידה என்பதன் ஹிஃபில் வடிவம் துதித்தல் அல்லது நன்றி செலுத்துதலைக் குறிக்கலாம்; யூதா என்ற பெயருடனான சொல் விளையாட்டைத் தெளிவாகக் காட்ட ‘துதிப்பேன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டமாக மாற்றாமல் எபிரேய இறைப்பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: עַל כֵּן קָרְאָה שְׁמוֹ
  choice: ஆகவே அவனுக்கு ... என்று பெயரிட்டாள்
  rationale: காரணத் தொடர்பையும், ‘அவனுடைய பெயரை அழைத்தாள்’ என்ற எபிரேய மரபுத்தொடரின் பொருளையும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: தமிழில் நிலைபெற்ற தனிப்பெயர் வடிவம்; மூலத்தில் உள்ள ידה வேருடனான ஒலித்தொடர்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וַתַּעֲמֹד מִלֶּדֶת
  choice: அதன்பின் அவளுக்குப் பிள்ளை பிறப்பது நின்றது
  rationale: பிள்ளைப்பேறு அப்போது நின்றதைத் தெரிவிக்கிறது; அவள் வேண்டுமென்றே அதை நிறுத்தினாள் என்ற நோக்கப்பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல வசனம் இறைப்பட்டத்தை அல்ல, தனிப்பட்ட இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது; ஆகவே பெயர் ஒலிபெயர்க்கப்படுகிறது.
- issue: אוֹדֶה என்பதிலுள்ள துதி/நன்றி பொருள்
  choice: துதிப்பேன்
  alternative: நன்றி செலுத்துவேன்
  rationale: இரு பொருள்களும் சாத்தியம்; யூதா என்ற பெயருக்கான சொல்லிசைத் தொடர்பைத் தமிழில் விளக்குவதற்கு ‘துதிப்பேன்’ ஏற்றது. மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையானதும் கண்ணியமானதுமான வேதாகமக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத உணர்ச்சிவிளக்கம் சேர்க்கப்படவில்லை; இறுதிக் கூற்றில் திட்டமிட்ட செயல் என்ற எண்ணம் வராதவாறு இயல்பான நிகழ்வாக மொழிபெயர்க்கப்பட்டுள்ளது.
