lexical_decisions:
- source_word: וַיִּשָּׂא יַעֲקֹב רַגְלָיו
  choice: யாக்கோபு புறப்பட்டு
  rationale: எழுத்துப்படி ‘யாக்கோபு தன் கால்களைத் தூக்கினான்’ என்ற எபிரெயச் சொற்றொடர், பயணத்தைத் தொடங்கியதை இயல்பாகக் குறிக்கிறது; நவீன தமிழில் ‘புறப்பட்டு’ அதன் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אַרְצָה בְנֵי קֶדֶם
  choice: கிழக்கத்திய மக்களின் நாட்டிற்கு
  rationale: בְּנֵי־קֶדֶם என்பதன் சொற்பொருள் ‘கிழக்கின் மகன்கள்’; இங்கு அது கிழக்குப் பகுதி மக்களைக் குறிக்கும் வழக்குச் சொற்றொடர். ‘கிழக்கத்திய மக்கள்’ பாலின வரம்பைத் தவிர்த்து இயல்பான தமிழில் பொருளைப் பாதுகாக்கிறது.
