source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הֵ֥ן עוֹד֙ הַ/יּ֣וֹם גָּד֔וֹל לֹא עֵ֖ת הֵאָסֵ֣ף הַ/מִּקְנֶ֑ה הַשְׁק֥וּ הַ/צֹּ֖אן וּ/לְכ֥וּ רְעֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/007.yaml
  text: Then he said[a], “Look, the day is still long; it is not time for the livestock to be gathered. Water the flock[b], then go and pasture them.”
translation:
  language: ta
  text: அப்போது அவன், “பாருங்கள், பகல் முடிய இன்னும் வெகுநேரம் இருக்கிறது[a]. கால்நடைகள் ஒன்றுசேர்க்கப்பட வேண்டிய நேரம் இதுவல்ல. மந்தைக்குத்[b] தண்ணீர் கொடுங்கள்; பிறகு போய் அவற்றை மேயுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இன்னும் நன்றாகப் பகலாக இருக்கிறது.” எபிரெயச் சொற்றொடர் சொல்லர்த்தமாக “பகல் இன்னும் பெரியது/நீண்டது” என்று கூறுகிறது; பகற்பொழுதில் இன்னும் வெகுநேரம் மீந்துள்ளது என்பதே அதன் கருத்து.
    reason: lexical_alternative
  - marker: b
    text: “கால்நடைகள்” என்பது வளர்க்கப்படும் விலங்குகளைப் பரந்த அளவில் குறிக்கும் ஒரு கூட்டுப்பெயரின் மொழிபெயர்ப்பு; “மந்தை” என்பது செம்மறியாடுகள், வெள்ளாடுகள் போன்ற சிறு கால்நடைகளைச் சிறப்பாகக் குறிக்கும் வேறொரு சொல்லின் மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: பாருங்கள்
  rationale: கவனத்தை ஈர்க்கும் இடைச்சொல். பன்மையில் நிற்கும் மேய்ப்பர்களை நோக்கிய உரையாதலால், நவீனத் தமிழில் இயல்பாகவும் மரியாதையாகவும் உள்ளது.
- source_word: עוֹד הַיּוֹם גָּדוֹל
  choice: பகல் முடிய இன்னும் வெகுநேரம் இருக்கிறது
  rationale: எபிரெயச் சொற்றொடர் சொல்லர்த்தமாக ‘பகல் இன்னும் பெரியது/நீண்டது’ என்று இருந்தாலும், பகற்பொழுதில் இன்னும் பெரும்பகுதி மீந்துள்ளது என்பதே அதன் பொருள். அதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא עֵת הֵאָסֵף הַמִּקְנֶה
  choice: கால்நடைகள் ஒன்றுசேர்க்கப்பட வேண்டிய நேரம் இதுவல்ல
  rationale: הֵאָסֵף என்பதன் செயப்பாட்டு வடிவத்தையும், מִקְנֶה என்பதன் பரந்த கூட்டுப்பொருளையும் காக்கிறது.
- source_word: הַשְׁקוּ
  choice: தண்ணீர் கொடுங்கள்
  rationale: שׁקה என்பதன் ஹிஃபில் கட்டளை வடிவம் ‘குடிக்கச் செய்/தண்ணீர் கொடு’ என்பதைக் குறிக்கிறது. தமிழில் நேரடியும் இயல்பானதுமான பன்மைக் கட்டளை.
- source_word: הַצֹּאן
  choice: மந்தை
  rationale: செம்மறியாடுகள், வெள்ளாடுகள் போன்ற சிறு கால்நடைகளின் கூட்டைக் குறிக்கும் பொதுப்பெயராக இச்சூழலில் இயல்பாக உள்ளது.
- source_word: וּלְכוּ
  choice: பிறகு போய்
  rationale: இணைப்புடன் வரும் கட்டளை, முதலில் தண்ணீர் கொடுத்து அதன்பின் மேய்க்கச் செல்லும் செயல்முறையைச் சுட்டுகிறது.
- source_word: רְעוּ
  choice: அவற்றை மேயுங்கள்
  rationale: רעה இங்கு கால்நடைகளை மேய்த்தல் அல்லது மேய்ச்சலுக்கு நடத்துதல் என்ற பொருளில் வருகிறது; சூழலுக்கு ஏற்ற தெளிவான தமிழாக்கம்.
