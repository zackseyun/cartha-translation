translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கட்டளைகளின் பன்மைத் தன்மையும், கால்நடைகள் ஒன்றுசேர்க்கப்படுதல் என்ற செயப்பாட்டு நுட்பமும் காக்கப்பட்டுள்ளன.
