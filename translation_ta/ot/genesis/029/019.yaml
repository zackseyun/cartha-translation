source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָבָ֗ן ט֚וֹב תִּתִּ֣/י אֹתָ֣/הּ לָ֔/ךְ מִ/תִּתִּ֥/י אֹתָ֖/הּ לְ/אִ֣ישׁ אַחֵ֑ר שְׁבָ֖/ה עִמָּדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/019.yaml
  text: Laban said[a], “It is better that I give her to you than that I give her to another man. Stay with me.”
translation:
  language: ta
  text: லாபான், “நான் அவளை மற்றொருவனுக்குக் கொடுப்பதைவிட, உனக்குக் கொடுப்பதே நல்லது. என்னோடு தங்கியிரு” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: நேரடி உரையை அறிமுகப்படுத்தும் எபிரெய வழக்கமான கதைநடை வினை; தமிழில் பேச்சுக்குப் பின் வரும் ‘என்றான்’ இயல்பான கதைநடை வடிவம்.
- source_word: טוֹב
  choice: நல்லது
  rationale: מִן உடனான ஒப்பீட்டுக் கட்டமைப்பில் ‘...விட ... நல்லது’ என்பது மூலத்தின் ‘good/better’ பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: תִּתִּי אֹתָהּ לָךְ
  choice: அவளை உனக்குக் கொடுப்பது
  rationale: முதல் நபர் ஒருமை பின்னொட்டைக் கொண்ட வினையெச்சப் பெயர்ச்சொல் அமைப்பை, பேசுபவர் செய்பவராகச் சூழலில் தெளிவாக இருக்கும் இயல்பான தமிழ் தொழிற்பெயர் அமைப்பாக மொழிபெயர்க்கிறது.
- source_word: מִתִּתִּי אֹתָהּ לְאִישׁ אַחֵר
  choice: அவளை வேறொரு மனிதனுக்குக் கொடுப்பதைவிட
  rationale: ஒப்பீட்டைக் குறிக்கும் מִן மற்றும் வினையெச்ச அமைப்பை ‘...கொடுப்பதைவிட’ என்று துல்லியமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: אִישׁ אַחֵר
  choice: வேறொரு மனிதன்
  rationale: ‘வேறொருவன்’ என்பதும் சாத்தியம்; ஆனால் ‘மனிதன்’ என்பது אִישׁ என்பதன் வெளிப்படையான சொல்லாட்சியைப் பாதுகாக்கிறது. ‘கணவன்’ என்று மொழிபெயர்ப்பது மூலத்தில் வெளிப்படையாக இல்லாத விளக்கத்தைச் சேர்க்கும்.
- source_word: שְׁבָה
  choice: தங்கியிரு
  rationale: இச்சூழலில் ישׁב என்பதன் கட்டளை வடிவம் தொடர்ந்து உடன் இருப்பதையோ வசிப்பதையோ குறிக்கிறது; ‘தங்கியிரு’ நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: עִמָּדִי
  choice: என்னோடு
  rationale: லாபானுடன் தொடர்ந்து இருப்பதைக் குறிக்கும் நேரடியான இயல்பான தமிழ் இணைச்சொல்.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உனக்குக் கொடுப்பது நல்லது’ என்ற சொல்லாக்கம் லாபானின் கூற்றை திருமண ஒப்புதலாகத் தெளிவுபடுத்தாமல், எபிரெய மூலத்தின் ஒப்பீட்டு வடிவத்தையும் அதன் மறைமுகத் தன்மையையும் பாதுகாக்கிறது.
