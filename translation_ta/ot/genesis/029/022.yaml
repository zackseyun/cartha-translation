  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர்ச்சியை ‘அதனால்’ என்பதும், நிகழ்வின் இரண்டு தொடர்ச்சியான செயல்களை ‘ஒன்றுகூட்டி… வைத்தான்’ என்ற இயல்பான தமிழ் அமைப்பும் வெளிப்படுத்துகின்றன. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
