  yaml_path: translation/ot/genesis/029/022.yaml
  text: So Laban gathered all the men of the place and made a feast[a][b].
translation:
  language: ta
  text: அப்போது லாபான் அந்த இடத்தைச் சேர்ந்த ஆண்கள் அனைவரையும் கூட்டி, ஒரு விருந்து வைத்தான்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்த இடத்தைச் சேர்ந்த மக்கள் அனைவரையும்.’ எபிரெயச் சொற்றொடர் இன்னும் நேரடியாக ‘அந்த இடத்தின் ஆண்கள் அனைவரையும்’ என்கிறது; திருமண விருந்துக்கு அழைக்கப்பட்ட அந்த இடத்தின் ஆண்களை இது குறிக்கக்கூடும் என்பதால், முதன்மை உரையில் ஆண்களைக் குறிக்கும் வடிவம் தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘விருந்து’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் கொண்டாட்ட விருந்தை அடிக்கடி குறிக்கிறது; அந்நிகழ்வில் மதுபானம் அருந்தப்பட்டதையும் அது உணர்த்தக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: ஒன்றுகூட்டி
  rationale: אסף இச்சூழலில் மக்களை ஒரே இடத்தில் கூட்டுவதைக் குறிக்கிறது. ‘ஒன்றுகூட்டி’ என்பது இயல்பான நவீனத் தமிழில் அந்தச் செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לָבָן
  choice: லாபான்
  rationale: எபிரெய தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶת כָּל אַנְשֵׁי הַמָּקוֹם
  choice: அந்த இடத்திலிருந்த ஆண்கள் அனைவரையும்
  rationale: אַנְשֵׁי என்பது אִישׁ என்பதன் ஆண்பால் பன்மை இணைநிலை வடிவம்; சொல்லுக்கு நெருக்கமாக ‘ஆண்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது. הַמָּקוֹם என்பதைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் ‘அந்த இடம்’ என்று வழங்குகிறது; ‘ஊர்’ என்று மூலத்தைவிடக் குறிப்பாக்கவில்லை.
- source_word: וַיַּעַשׂ
  choice: வைத்தான்
  rationale: עשה என்பது ‘செய்/உண்டாக்கு’ என்ற பரந்த பொருளுடைய வினை. விருந்துடன் தமிழில் ‘விருந்து வைத்தான்’ என்பது இயல்பான இணைப்பாகவும், நிகழ்வை ஏற்பாடு செய்த பொருளைத் துல்லியமாகவும் தருகிறது.
- source_word: מִשְׁתֶּה
  choice: ஒரு விருந்து
  rationale: מִשְׁתֶּה கொண்டாட்ட விருந்தைக் குறிக்கிறது; அதில் மதுபானம் அருந்துதலும் உட்படலாம். ‘விருந்து’ என்பது திருமணச் சூழலுக்கேற்ற, சுருக்கமான, இயல்பான தேர்வு.
