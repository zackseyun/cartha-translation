revisions:
- from: அதனால் லாபான் அந்த இடத்திலிருந்த ஆண்கள் அனைவரையும் ஒன்றுகூட்டி, ஒரு விருந்து வைத்தான்.[a][b]
  to: அப்போது லாபான் அந்த இடத்தைச் சேர்ந்த ஆண்கள் அனைவரையும் கூட்டி, ஒரு விருந்து வைத்தான்.[a][b]
  rationale: The revision removes an unwarranted causal implication and clarifies that the men are associated with the place, not merely present there. It retains the source’s explicit masculine plural, the ordinary narrative style, and both correctly anchored footnotes.
