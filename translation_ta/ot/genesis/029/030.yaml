id: GEN.29.30
reference: Genesis 29:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּבֹא֙ גַּ֣ם אֶל רָחֵ֔ל וַ/יֶּאֱהַ֥ב גַּֽם אֶת רָחֵ֖ל מִ/לֵּאָ֑ה וַ/יַּעֲבֹ֣ד עִמּ֔/וֹ ע֖וֹד שֶֽׁבַע שָׁנִ֥ים אֲחֵרֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/030.yaml
  text: So he went in to Rachel also[a], and he loved Rachel more than Leah; and he served with him for another seven years.
translation:
  language: ta
  text: அவன் ராகேலிடமும் சேர்ந்தான். அவன் லேயாளைவிட ராகேலை அதிகமாக நேசித்தான்[a]. மேலும், அவன் லாபானிடம் இன்னும் ஏழு ஆண்டுகள் வேலை செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் லேயாளுக்குப் பதிலாக ராகேலை நேசித்தான்.” எபிரெய முன்னிடைச்சொல் ஒப்பீட்டைக் குறிக்கலாம்; இங்கு “லேயாளைவிட அதிகமாக” என்பதே மிகவும் இயல்பான பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... אֶל רָחֵל
  choice: அவன் ராகேலிடமும் சேர்ந்தான்
  rationale: בוא אֶל என்பது இந்தத் திருமணச் சூழலில் தாம்பத்திய உறவை உட்குறிக்கும் மரபுத்தொடர். ‘சேர்ந்தான்’ என்பது அந்தப் பொருளை இயல்பாகவும் கண்ணியமாகவும் தெரிவிக்கிறது; גַּם என்பதற்கு ‘-உம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיֶּאֱהַב ... אֶת רָחֵל
  choice: அவன் ... ராகேலை ... நேசித்தான்
  rationale: אָהַב என்பதன் இயல்பான பொருள் ‘நேசித்தான்’. வினைச்சொல்லில் தனியான தீவிரப்படுத்தல் இல்லாததால் எளிய வடிவம் காக்கப்பட்டுள்ளது.
- source_word: מִלֵּאָה
  choice: லேயாளைவிட ... அதிகமாக
  rationale: அன்பைக் குறிக்கும் வினைக்குப் பின் வரும் מִן இங்கு இயல்பாக ஒப்பீட்டைக் குறிக்கிறது. நவீனத் தமிழில் ‘லேயாளைவிட ... அதிகமாக’ என்பது தெளிவான ஒப்பீட்டு வடிவம்.
- source_word: וַיַּעֲבֹד עִמּוֹ
  choice: அவன் லாபானிடம் ... வேலை செய்தான்
  rationale: עבד என்பது ‘வேலை செய்/பணிசெய்’ என்று பொருள்படும். עִמּוֹ இலக்கணப்படி ‘அவனுடன்’ என்றாலும், சூழலில் லாபானின் கீழ் தொடர்ந்த உழைப்பைக் குறிக்கிறது; இயல்பான தமிழுக்காக ‘லாபானிடம் வேலை செய்தான்’ என வழங்கப்பட்டுள்ளது. பெயரை வெளிப்படுத்துவது தமிழில் சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்கிறது.
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  choice: இன்னும் ஏழு ஆண்டுகள்
  rationale: עוֹד மற்றும் אֲחֵרוֹת ஆகியவை ஏற்கெனவே செய்த காலத்திற்கு மேலான கூடுதல் ஏழாண்டுக் காலத்தைக் குறிக்கின்றன; ‘இன்னும் ஏழு ஆண்டுகள்’ என்பது இயல்பான நவீனத் தமிழ்.
theological_decisions:
- issue: மִן குறிக்கும் உறவின் தன்மை
  choice: லேயாளைவிட ராகேலை அதிகமாக நேசித்தான்
  alternative: லேயாளுக்குப் பதிலாக ராகேலை நேசித்தான்
  rationale: முதன்மை வாசிப்பு ஒப்பீட்டைக் குறிக்கிறது; எனினும் எபிரெய முன்னிடைச்சொல் மாற்று/எதிர்மறைத் தேர்வு போன்ற நிழற்பொருளையும் ஏற்கக்கூடியதால் அந்தச் சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. தாம்பத்திய மரபுத்தொடர் மிக வெளிப்படையாகாமல் ‘சேர்ந்தான்’ என மொழிபெயர்க்கப்பட்டுள்ளது; தொடர்ந்த உழைப்பு இயல்பான தமிழில் ‘வேலை செய்தான்’ என வழங்கப்பட்டுள்ளது.
