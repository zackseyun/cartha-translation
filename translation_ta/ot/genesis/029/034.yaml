base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/034.yaml
  text: And she conceived again and bore a son[a], and said, “Now this time my husband will be attached to me, because I have borne him three sons.” Therefore his name was called Levi.
translation:
  language: ta
  text: அவள் மீண்டும் கருவுற்று ஒரு மகனைப் பெற்றாள்; அவள், “இந்த முறையாவது என் கணவர் என்னோடு இணைவார்[a]; ஏனெனில், நான் அவருக்கு மூன்று மகன்களைப் பெற்றிருக்கிறேன்” என்றாள். அதனால் அவனுக்கு லேவி என்று பெயரிடப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் கணவர் என்னோடு சேர்ந்துகொள்வார்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரேய வினைச்சொல் ஒலியிலும் பொருளிலும் “லேவி” என்ற பெயருடன் தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: அவள் மீண்டும் கருவுற்று
  rationale: הרה என்பது கருவுறுதலைக் குறிக்கிறது; עוֹד என்பதன் ‘மீண்டும்’ என்ற பொருளும் இயல்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: וַתֵּלֶד בֵּן
  choice: ஒரு மகனைப் பெற்றாள்
  rationale: தமிழில் குழந்தையைப் பெற்றெடுப்பதைக் குறிக்கும் இயல்பான பிறப்பு-விவரிப்பு; בֵּן என்பதையும் தெளிவாகக் காட்டுகிறது.
- source_word: עַתָּה הַפַּעַם
  choice: இப்போதாவது
  rationale: இரு எபிரேய காலச் சொற்களின் வலியுறுத்தலையும், லேயாளின் எதிர்பார்ப்பையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: יִלָּוֶה אִישִׁי אֵלַי
  choice: என் கணவர் என்னோடு இணைந்திருப்பார்
  rationale: Niphal வடிவம் சேர்ந்திருத்தல் அல்லது இணைந்திருத்தல் என்ற உறவுசார் கருத்தைக் கொண்டது. ‘இணைந்திருப்பார்’ என்பது தமிழில் இயல்பாகவும் லேவி என்ற பெயருடனான சொல்விளையாட்டை ஓரளவு பிரதிபலிப்பதாகவும் உள்ளது.
- source_word: כִּי יָלַדְתִּי לוֹ שְׁלֹשָׁה בָנִים
  choice: ஏனெனில், நான் அவருக்கு மூன்று மகன்களைப் பெற்றிருக்கிறேன்
  rationale: כִּי காரணத்தை அறிமுகப்படுத்துகிறது; לוֹ மற்றும் שְׁלֹשָׁה בָנִים ஆகியவை முறையே ‘அவருக்கு’, ‘மூன்று மகன்கள்’ எனப் பாதுகாக்கப்படுகின்றன. நிறைவுற்ற செயலின் தற்போதைய பொருத்தத்தை ‘பெற்றிருக்கிறேன்’ காட்டுகிறது.
- source_word: עַל כֵּן קָרָא שְׁמוֹ לֵוִי
  choice: அதனால் அவனுக்கு லேவி என்று பெயரிடப்பட்டது
  rationale: עַל כֵּן பெயர்க்காரணத்தை அறிமுகப்படுத்துகிறது. קָרָא என்பதற்கு வெளிப்படையான எழுவாய் இல்லாததால், யார் பெயரிட்டார் என்று ஊகிக்காமல் செயப்பாட்டு வடிவம் பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: יִלָּוֶה என்பதற்கும் לֵוִי என்ற பெயருக்கும் இடையிலான சொல்விளையாட்டு
  choice: முதன்மை உரையில் ‘இணைந்திருப்பார்’ என்று மொழிபெயர்த்து, மாற்றாக ‘சேர்ந்திருப்பார்’ என்பதை அடிக்குறிப்பில் தருதல்
  alternative: என் கணவர் என்னோடு சேர்ந்திருப்பார்
  rationale: எபிரேயத்தில் ஒலி மற்றும் பொருள் வழியாக உள்ள பெயர்க்காரணத் தொடர்பை முற்றிலும் மறைக்காமல், இயல்பான நவீனத் தமிழில் லேயாளின் நம்பிக்கையைத் தெரிவிக்கிறது.
- issue: קָרָא என்ற வினையின் மறைந்த எழுவாய்
  choice: ‘பெயரிடப்பட்டது’ என்ற செயப்பாட்டு வடிவத்தைப் பயன்படுத்துதல்
  alternative: அவன் அவனுக்கு லேவி என்று பெயரிட்டான்
  rationale: வினை ஆண்பால் ஒருமையில் இருந்தாலும், பெயரிடுபவர் உரையில் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. ஆகவே யாக்கோபையே எழுவாயாகத் திட்டவட்டமாகச் சேர்க்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், வேதாகமக் கதையுரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இப்போதாவது’ என்பது லேயாளின் ஏக்கத்தையும் இம்முறை நிறைவேறும் என்ற எதிர்பார்ப்பையும் வெளிப்படுத்துகிறது; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் சேர்க்கப்படவில்லை.
