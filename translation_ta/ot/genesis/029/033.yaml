base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/033.yaml
  text: Then she conceived again and bore a son[a], and said, “Because Yahweh has heard that I am hated[b], he has given me this one also.” So she called his name Simeon.
translation:
  language: ta
  text: அவள் மீண்டும் கருவுற்று ஒரு மகனைப் பெற்றெடுத்தாள். அப்போது அவள், “நான் வெறுக்கப்படுகிறேன்[a] என்பதை யாவே கேட்டதால், இவனையும் எனக்குத் தந்தார்” என்றாள். அவள் அவனுக்குச் சிமியோன்[b] என்று பெயரிட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் நேசிக்கப்படவில்லை,” அல்லது “நான் குறைவாக நேசிக்கப்படுகிறேன்.” எபிரெயச் சொல் நேரடியாக “வெறுக்கப்படுகிறேன்” என்று பொருள்படும்; ஆனால் இச்சூழலில் அது புறக்கணிக்கப்படுவதையோ ஒப்பீட்டளவில் குறைவாக நேசிக்கப்படுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “சிமியோன்” என்ற பெயர், “கேட்டார்” என்பதற்கான எபிரெயச் சொல்லைப் போல ஒலிக்கிறது.
    reason: wordplay
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: அவள் மீண்டும் கருவுற்று
  rationale: עוֹד என்பதன் ‘மீண்டும்’ என்ற பொருளையும், தொடர்ச்சியான கதைநடையையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וַתֵּלֶד בֵּן
  choice: ஒரு மகனைப் பெற்றெடுத்தாள்
  rationale: ילד + בן என்ற பிறப்புக் குறிப்பைத் தெளிவாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: כִּי שָׁמַע יְהוָה
  choice: யாவே கேட்டதால்
  rationale: כִּי இங்கு காரணத்தை அறிமுகப்படுத்துகிறது; שָׁמַע நிறைவுற்ற கேட்டலைக் குறிக்கிறது. יְהוָה தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּי שְׂנוּאָה אָנֹכִי
  choice: நான் வெறுக்கப்படுகிறேன் என்பதை
  rationale: שְׂנוּאָה என்பதன் நேரடியான வலுவான பொருளைத் தக்கவைக்கிறது; சூழலில் ஒப்பீட்டளவில் குறைவாக நேசிக்கப்படுதல் என்ற நுணுக்கம் இருக்கலாம் என்பதைக் குறிப்பில் தருகிறது.
- source_word: וַיִּתֶּן לִי גַּם אֶת זֶה
  choice: இவனையும் எனக்குத் தந்தார்
  rationale: זֶה புதிதாகப் பிறந்த மகனைக் குறிக்கிறது; גַּם என்பதன் கூடுதல் பொருளை ‘-யும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַתִּקְרָא שְׁמוֹ שִׁמְעוֹן
  choice: அவனுக்குச் சிமியோன் என்று பெயரிட்டாள்
  rationale: எபிரெயப் பெயரிடும் மரபுத்தொடரை இயல்பான தமிழில் தருவதுடன், שִׁמְעוֹן என்பதை நிலையான தமிழ் வடிவில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: லேயாள் தன் நிலையை விவரிக்கும் שְׂנוּאָה என்ற சொல்லின் வலிமை
  choice: நான் வெறுக்கப்படுகிறேன்
  alternative: நான் நேசிக்கப்படவில்லை / நான் குறைவாக நேசிக்கப்படுகிறேன்
  rationale: மூல எபிரெயச் சொல் நேரடியாக ‘வெறுக்கப்பட்டவள்’ எனும் வலுவான பொருளுடையது. சூழல் ஒப்பீட்டளவிலான புறக்கணிப்பைக் குறிக்கக்கூடும் என்றாலும், முதன்மை உரையில் அந்தக் கதைசார் மற்றும் இறையியல் பதற்றம் மென்மையாக்கப்படவில்லை.
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் நான்கெழுத்து இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தனிப்பெயராக ஒலிபெயர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வெறுக்கப்படுகிறேன்’ என்ற மூலத்தின் வலிமை முதன்மை உரையில் பாதுகாக்கப்பட்டு, சூழல்சார் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளன. பெயர்ச் சொல் விளையாட்டு தமிழ் வாசகருக்காக அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
