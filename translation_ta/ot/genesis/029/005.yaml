base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/005.yaml
  text: He said to them[a], “Do you know Laban son of Nahor?” They said, “We know him.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “நாகோரின் மகன் லாபானை உங்களுக்குத் தெரியுமா?” என்றார். அதற்கு அவர்கள், “எங்களுக்குத் தெரியும்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “நாங்கள் அறிவோம்”; “அவரை” என்பது சூழலால் விளங்குகிறது.
    reason: மூலமொழியில் பதிலுக்குரிய செயப்படுபொருள் வெளிப்படையாக இல்லை என்பதைச் சுட்டுகிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: அவர் அவர்களிடம் … என்றார்
  rationale: தொடர்கதை வரிசையைக் குறிக்கும் வாவ் இணைப்பைத் தமிழில் தனியாக மொழிபெயர்க்காமல், இயல்பான உரைநடை வரிசையில் கூறுகிறது; לָהֶם என்பதைக் ‘அவர்களிடம்’ என வெளிப்படுத்துகிறது.
- source_word: הֲיְדַעְתֶּם
  choice: உங்களுக்குத் தெரியுமா?
  rationale: יָדַע இங்கு ஒருவருடன் அறிமுகம் அல்லது அவரைப் பற்றிய நேரடி அறிவைக் கேட்கிறது. நவீனத் தமிழில் ‘உங்களுக்குத் தெரியுமா?’ என்பது இதற்கான இயல்பான கேள்வி.
- source_word: לָבָן בֶּן נָחוֹר
  choice: நாகோரின் மகன் லாபான்
  rationale: בֶּן என்பதன் நேரடிப் பொருளான ‘மகன்’ என்பதைக் காக்கிறது; பெயர்கள் தமிழில் ஒலிபெயர்க்கப்படுகின்றன.
- source_word: וַיֹּאמְרוּ יָדָעְנוּ
  choice: அதற்கு அவர்கள், ‘எங்களுக்குத் தெரியும்’ என்றார்கள்
  rationale: பதிலின் உரையாடல் தொடர்பை ‘அதற்கு’ தெளிவாக்குகிறது. கேள்வியிலும் பதிலிலும் வரும் ஒரே ידע வேரின் மறுபயன்பாட்டை ‘தெரியுமா / தெரியும்’ என இயல்பாகப் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதாகவும் மரியாதையான வேதாகம உரைநடையுடனும் வடிவமைக்கப்பட்டது. ஒருவரை அறிந்திருப்பதைக் குறிக்க ‘அறிவீர்களா’ என்பதைக் காட்டிலும் இயல்பான ‘உங்களுக்குத் தெரியுமா’ பயன்படுத்தப்பட்டுள்ளது.
