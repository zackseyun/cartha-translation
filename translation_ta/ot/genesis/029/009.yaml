  yaml_path: translation/ot/genesis/029/009.yaml
  text: While he was still speaking with them[a], Rachel came with her father’s flock, for she was a shepherdess.
translation:
  language: ta
  text: அவன் அவர்களோடு இன்னும் பேசிக்கொண்டிருக்கையில், ராகேல் தன் தந்தையின் மந்தையோடு வந்தாள்; ஏனெனில் அவள் ஒரு மேய்ப்பவள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவள் ஒரு மேய்ப்பவளாக இருந்தாள்.” எபிரேய மொழியில், மந்தையை மேய்ப்பவராக ராகேலின் பங்கைச் சுட்டும் பெண்பால் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר עִמָּם
  choice: அவன் அவர்களோடு இன்னும் பேசிக்கொண்டிருக்கையில்
  rationale: தொடர்ந்து நடந்துகொண்டிருந்த பேச்சின் நேரத்திலேயே அடுத்த நிகழ்வு நடந்ததை எபிரேயத் தொடர் காட்டுகிறது. ‘பேசிக்கொண்டிருக்கையில்’ என்பது அந்தக் கால ஒட்டுமொத்தத்தை இயல்பான தமிழில் தருகிறது.
- source_word: וְרָחֵל בָּאָה
  choice: ராகேல் ... வந்தாள்
  rationale: בוא என்ற வினையின் கதைநடைப் பயன்பாட்டை ‘வந்தாள்’ இயல்பாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: עִם הַצֹּאן אֲשֶׁר לְאָבִיהָ
  choice: தன் தந்தையின் மந்தையோடு
  rationale: צֹאן என்பது கூட்டாக மேய்க்கப்படும் செம்மறியாடுகள் அல்லது வெள்ளாடுகள் அடங்கிய மந்தையைக் குறிக்கலாம்; ‘மந்தை’ அந்த விரிவைச் சுருக்காமல் காக்கிறது. அடுத்த உறவுச்சொற்றொடரில் உள்ள உரிமையைத் தமிழில் இயல்பாக ‘தன் தந்தையின்’ என்று முன்வைக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: ராகேல் மந்தையோடு வந்ததற்கான விளக்கத்தை அறிமுகப்படுத்தும் காரண இணைப்பாக இங்கு செயல்படுகிறது.
- source_word: רֹעָה הִוא
  choice: அவள் ஒரு மேய்ப்பவள்
  rationale: பெண்பால் வடிவிலுள்ள மேய்க்கும் தொழில்/பங்கை அடையாளப்படுத்தும் சொல்லை ‘மேய்ப்பவள்’ துல்லியமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; அதை வெறும் அந்த நேரச் செயலாக மட்டும் மாற்றவில்லை.
