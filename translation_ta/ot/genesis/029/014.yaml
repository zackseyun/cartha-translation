translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உறவுமுறைப் படிமம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. கடைசி வாக்கியத்தில் தெளிவுக்காக மறைமுக எழுவாய் ‘யாக்கோபு’ என வெளிப்படுத்தப்பட்டுள்ளது.
