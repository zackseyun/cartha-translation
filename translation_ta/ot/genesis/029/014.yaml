base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/014.yaml
  text: Then Laban said to him[b][a], “Surely you are my bone and my flesh.” And he stayed with him for a month.
translation:
  language: ta
  text: அப்போது லாபான் அவனிடம், “நீ உண்மையிலேயே என் எலும்பும் என் சதையும்தான்”[a] என்றான். பின்பு யாக்கோபு அவனுடன் ஒரு மாதம் தங்கினான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் எலும்பும் என் சதையும்” என்பது நெருங்கிய இரத்த உறவினரைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “நாட்களின் ஒரு மாதம்”; அதாவது, ஒரு முழு மாதம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர் வடிவம் கதை நிகழ்வை முன்னெடுத்துச் செல்கிறது; நவீன தமிழில் ‘அப்போது’ இயல்பாக அந்த வரிசையை வெளிப்படுத்துகிறது.
- source_word: אַךְ
  choice: உண்மையிலேயே
  rationale: இங்கு இது வரம்புப்படுத்தும் ‘மட்டும்’ என்ற பொருளில் அல்லாமல், உறவுமுறையை வலியுறுத்தி உறுதிப்படுத்தும் சொல்லாக வருகிறது.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: என் எலும்பும் என் சதையுமாய்
  rationale: இரத்த உறவைக் குறிக்கும் எபிரெய மரபுத்தொடரின் உருவகத்தையும் வேதாகம இடையிணைப்பையும் காக்கும் வகையில் நேரடியான படிமம் தக்கவைக்கப்படுகிறது.
- source_word: אָתָּה
  choice: நீ ... இருக்கிறாய்
  rationale: எபிரெய மொழியின் பெயர்ப்பயனிலை வாக்கியத்தைத் தமிழில் இயல்பாக வெளிப்படுத்த இணைப்புவினை பயன்படுத்தப்படுகிறது.
- source_word: וַיֵּשֶׁב
  choice: தங்கியிருந்தான்
  rationale: குறிப்பிட்ட காலத்திற்கு லாபானுடன் தங்கி வாழ்ந்ததை இது குறிக்கிறது; ‘தங்கியிருந்தான்’ தற்காலிக காலவரம்பை இயல்பாகத் தெரிவிக்கிறது.
- source_word: עִמּוֹ
  choice: அவனுடன்
  rationale: லாபானுடன் யாக்கோபு தங்கியிருந்ததைக் குறிக்கும் நேரடியான முன்னிடைச்சொல் தொடர்.
- source_word: חֹדֶשׁ יָמִים
  choice: ஒரு மாதம்
  rationale: சொல்லுக்கு சொல் ‘நாட்களின் ஒரு மாதம்’ என்றாலும், முழுமையான ஒரு மாத காலத்தைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கு ‘ஒரு மாதம்’ என்பது இயல்பான நவீனத் தமிழ்.
