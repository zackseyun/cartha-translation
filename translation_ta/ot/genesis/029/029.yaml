  text: And Laban gave Bilhah[a], his female servant, to Rachel his daughter as her female servant.
translation:
  language: ta
  text: லாபான் தன் மகள் ராகேலுக்குத் தன் பணிப்பெண்ணான பில்காளை அவளுடைய பணிப்பெண்ணாகக் கொடுத்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: கொடுத்தான்
  rationale: נתן என்பதன் தொடர்கதை இறந்தகால வடிவம் கடந்த நிகழ்வை நேரடியாகக் குறிக்கிறது; தமிழில் இயல்பாகக் ‘கொடுத்தான்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: לָבָן
  choice: லாபான்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு.
- source_word: לְרָחֵל בִּתּוֹ
  choice: தன் மகள் ராகேலுக்கு
  rationale: לְ பெறுபவரைக் குறிக்கிறது; בִּתּוֹ லாபானின் மகள் என்பதைத் தெளிவாக்குகிறது. இந்தச் சொல் வரிசை இயல்பான நவீன தமிழுக்கு ஏற்றது.
- source_word: בִּלְהָה
  choice: பில்காள்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு.
- source_word: שִׁפְחָתוֹ
  choice: தன் பணிப்பெண்ணான
  rationale: שִׁפְחָה ஒரு பெண் பணியாளர் அல்லது அடிமைப் பெண்ணைக் குறிக்கலாம். ‘பணிப்பெண்’ பாலினத்தையும் குடும்பச் சேவைச் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது; மூலச்சொல்லின் முழுச் சமூக நிலையை அளவுக்கு மீறி வரையறுக்கவில்லை.
- source_word: לָהּ לְשִׁפְחָה
  choice: அவளுடைய பணிப்பெண்ணாக
  rationale: இச்சொற்றொடர் பில்காள் ராகேலுக்குச் செய்ய வேண்டிய பங்கைச் சுட்டுகிறது. தமிழில் ‘அவளுடைய பணிப்பெண்ணாக’ என்பது பொருளையும் இலக்கண உறவையும் தெளிவாகத் தருகிறது.
