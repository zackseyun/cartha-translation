  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וְ/הִנֵּה הִ֖וא לֵאָ֑ה וַ/יֹּ֣אמֶר אֶל לָבָ֗ן מַה זֹּאת֙ עָשִׂ֣יתָ לִּ֔/י הֲ/לֹ֤א בְ/רָחֵל֙ עָבַ֣דְתִּי עִמָּ֔/ךְ וְ/לָ֖/מָּה רִמִּיתָֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/025.yaml
  text: In the morning, behold, it was Leah. And he said to Laban, “What is this you have done to me? Was it not for Rachel that I worked with you? So why have you deceived me?”
translation:
  language: ta
  text: காலையில் பார்த்தபோது, இதோ, அவள் லேயாள்! அப்போது யாக்கோபு லாபானிடம், “நீர் எனக்கு இப்படிச் செய்தது என்ன? ராகேலுக்காக அல்லவா நான் உம்மிடம் வேலை செய்தேன்? அப்படியிருக்க, ஏன் என்னை ஏமாற்றினீர்?” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீர் உணர்வையும் அதிர்ச்சியையும் வெளிப்படுத்தும் எபிரேயச் சொல்லின் உரையாடல் வலிமையைப் பாதுகாக்கிறது.
- source_word: עָבַדְתִּי עִמָּךְ
  choice: நான் உம்மிடம் வேலை செய்தேன்
  rationale: லாபானுக்குச் செய்த உழைப்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; עִם என்பதன் சொற்பொருளான ‘உம்மோடு’ இங்கு பணியுறவைச் சுட்டுவதால் ‘உம்மிடம்’ பொருத்தமானது.
- source_word: רִמִּיתָנִי
  choice: என்னை ஏமாற்றினீர்
  rationale: திட்டமிட்ட வஞ்சனையைச் சுட்டும் வினையின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: וְלָמָּה
  choice: அப்படியிருக்க, ஏன்
  rationale: முந்தைய எதிர்பார்ப்புக்கும் நிகழ்ந்த செயலுக்கும் இடையிலான முரண்பாட்டைத் தமிழில் தெளிவாக இணைக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. லாபானை நோக்கிய நேரடி உரையில் மரியாதைப் பன்மை ஒருமையாக ‘நீர்/உம்மிடம்/ஏமாற்றினீர்’ பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பது காட்சியை அறிமுகப்படுத்துவதற்கல்ல, யாக்கோபின் திடீர் அதிர்ச்சியைப் பாதுகாப்பதற்காக வைக்கப்பட்டுள்ளது.
