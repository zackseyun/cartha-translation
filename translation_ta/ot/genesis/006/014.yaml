  text: עֲשֵׂ֤ה לְ/ךָ֙ תֵּבַ֣ת עֲצֵי גֹ֔פֶר קִנִּ֖ים תַּֽעֲשֶׂ֣ה אֶת הַ/תֵּבָ֑ה וְ/כָֽפַרְתָּ֥ אֹתָ֛/הּ מִ/בַּ֥יִת וּ/מִ/ח֖וּץ בַּ/כֹּֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/014.yaml
  text: Make yourself an ark of gopher wood[a]; make rooms in the ark[c][b], and cover it inside and outside with pitch.
translation:
  language: ta
  text: உனக்காகக் கோபேர் மரத்தால்[a] ஒரு பேழையைச் செய். பேழைக்குள் அறைகளை[b] அமை; அதன் உட்புறத்திலும் வெளிப்புறத்திலும் கீல் பூசு[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சைப்ரஸ் மரம்’ என்றும் இருக்கலாம். ‘கோபேர்’ என்ற எபிரேயச் சொல் இங்கு மட்டுமே வருவதால், அது எந்த வகை மரம் என்பது உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘தனித்தனிப் பகுதிகள்’ என்றும் மொழிபெயர்க்கலாம்; சொல்லுக்கு நேர்ப்பொருள் ‘கூடுகள்.’
    reason: lexical_alternative
  - marker: c
    text: ‘பூசி மூடு’ அல்லது ‘நீர் புகாதபடி அடைத்திடு’ என்றும் மொழிபெயர்க்கலாம். ‘கீல்’ என்பதற்கு ‘பிற்றுமின்’ அல்லது ‘தார்’ என்றும் இருக்கலாம். பூசும் செயலுக்கும் பூசப்படும் பொருளுக்கும் எபிரேயத்தில் தொடர்புடைய சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: உனக்காக ... செய்
  rationale: கட்டளையோடு வரும் לְךָ என்பதன் ‘உனக்காக’ என்ற பயனை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘கட்டு’ என்பதைக் காட்டிலும் ‘செய்’ எபிரேய வினையின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: תֵּבַת
  choice: பேழை
  rationale: תֵּבָה என்பது சாதாரணக் கப்பலுக்கான எபிரேயச் சொல் அல்ல; பெட்டி போன்ற மூடிய கலத்தைக் குறிக்கலாம். ஆதியாகமம் 6–9 மற்றும் யாத்திராகமம் 2 ஆகிய இடங்களுடனான சொல் தொடர்பையும் தமிழில் வழக்கமான வேதாகமப் பயன்பாட்டையும் ‘பேழை’ காக்கிறது.
- source_word: עֲצֵי גֹפֶר
  choice: கோபேர் மரம்
  rationale: גֹפֶר இங்கு மட்டுமே வரும், துல்லியமாக அடையாளம் காணப்படாத மரப்பெயர். ஊகமாக ஒரு மரவகையைத் தேர்ந்தெடுக்காமல் எபிரேயப் பெயரை ஒலிபெயர்ப்பது மூலத்தின் நிச்சயமின்மையைப் பாதுகாக்கிறது.
- source_word: קִנִּים
  choice: அறைகள்
  rationale: சொல்லின் நேர்ப்பொருள் ‘கூடுகள்’; இச்சூழலில் பேழைக்குள் பிரிக்கப்பட்ட இடங்களைக் குறிக்கிறது. ‘அறைகள்’ என்பது சாதாரண வாசகருக்குத் தெளிவான இயல்பான தமிழ்.
- source_word: וְכָפַרְתָּ ... בַּכֹּפֶר
  choice: கீல் பூசு
  rationale: இங்கு வினை வழிபாட்டுச் சூழலிலான பொருளில் அல்ல, ஒரு பொருளால் மேற்பரப்பைப் பூசுவதைக் குறிக்கிறது; כֹּפֶר நீர் புகாதபடி பூசப்படும் கீல் போன்ற பொருள். ‘கீல் பூசு’ செயலும் பொருளும் இரண்டையும் சுருக்கமாகத் தருகிறது.
- source_word: מִבַּיִת וּמִחוּץ
  choice: உட்புறத்திலும் வெளிப்புறத்திலும்
  rationale: பேழையின் இரண்டு பக்க மேற்பரப்புகளிலும் பூச வேண்டும் என்ற இணையான எபிரேயச் சொற்றொடரைத் தெளிவாகக் காட்டுகிறது.
