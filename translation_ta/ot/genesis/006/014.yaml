translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் கட்டளையின் சுருக்கமான, கண்ணியமான நடையைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டுள்ளது. அறியப்படாத மரவகை ஊகமின்றி ஒலிபெயர்க்கப்பட்டுள்ளது; ‘பேழை’ என்ற நிலைபெற்ற சொல், சாதாரண ‘கப்பல்’ என்ற சொல்லிலிருந்து மூலத்தின் வேறுபாட்டைக் காக்கிறது.
