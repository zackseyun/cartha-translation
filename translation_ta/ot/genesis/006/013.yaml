source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים לְ/נֹ֗חַ קֵ֤ץ כָּל בָּשָׂר֙ בָּ֣א לְ/פָנַ֔/י כִּֽי מָלְאָ֥ה הָ/אָ֛רֶץ חָמָ֖ס מִ/פְּנֵי/הֶ֑ם וְ/הִנְ/נִ֥י מַשְׁחִיתָ֖/ם אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/013.yaml
  text: Then God said to Noah[a], “The end of all flesh has come before me, for the earth is filled with violence because of them. And behold[d][c][b], I am about to destroy them with the earth.”
translation:
  language: ta
  text: அப்போது கடவுள் நோவாவிடம், “அனைத்து உயிரினங்களின் முடிவும் என் முன்னே வந்துவிட்டது[a]. அவர்களாலேயே பூமி[b] வன்முறையால் நிறைந்துள்ளது. இதோ, நான் அவர்களைப் பூமியோடு சேர்த்து அழிக்கப்போகிறேன்[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “எல்லா மாம்சத்தின் முடிவு”; “எல்லா மாம்சத்தின் ஒரு முடிவு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பூமி” என்பதற்குப் பதிலாக “நிலம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் சொற்படியாக, “நான் அவர்களைப் பூமியுடன் அழிக்கிறேன்.” இதை “அவர்களையும் பூமியையும் அழிக்கிறேன்” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: קֵץ כָּל־בָּשָׂר
  choice: உயிருள்ள அனைத்தின் முடிவு
  rationale: קֵץ என்பது முடிவு அல்லது ஒழிவு; כָּל־בָּשָׂר என்பதன் சொற்பொருள் ‘எல்லா மாம்சமும்’ என்றாலும், வெள்ளக் கதையின் சூழலில் அது மனிதர்களை மட்டும் அல்லாமல் உயிரினங்களையும் உள்ளடக்கும் பரந்த வகையைச் சுட்டுகிறது. இயல்பான நவீனத் தமிழில் அந்தப் பரப்பைத் தெளிவாக வைத்திருக்க ‘உயிருள்ள அனைத்தும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בָּא לְפָנַי
  choice: என் முன்னே வந்துவிட்டது
  rationale: இந்த எபிரெயச் சொற்றொடர் தீர்ப்புக்குரிய காரியம் கடவுளின் முன்னிலையில் வந்திருப்பதைச் சுட்டுகிறது. அதன் உருவகத்தையும் நீதித்துறை நுணுக்கத்தையும் காக்கும் நேரடியான தமிழ் இது.
- source_word: מָלְאָה הָאָרֶץ חָמָס
  choice: பூமி வன்முறையால் நிறைந்திருக்கிறது
  rationale: חָמָס என்பது வன்முறை, கொடுமை, அநீதி ஆகிய பொருள்களைத் தரலாம்; முன் வரும் வெள்ளக் கதையின் ஊழல் நிறைந்த சூழலில் ‘வன்முறை’ நேரடியும் பொருத்தமானதும் ஆகும். הָאָרֶץ என்பதற்கு இங்கு கதையின் விரிந்த பரப்பைக் கருத்தில் கொண்டு ‘பூமி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִפְּנֵיהֶם
  choice: அவர்களால்
  rationale: 'இங்கு முன்னிடைச்சொல் காரணப்பொருளில் வருகிறது: அவர்களுடைய செயல்களாலேயே பூமி வன்முறையால் நிறைந்தது. ‘அவர்களால்’ என்பது சுருக்கமான, இயல்பான தமிழ்.'
- source_word: וְהִנְנִי
  choice: இதோ, நான்
  rationale: הִנְנִי கடவுளுடைய அறிவிப்பை வலியுறுத்தும் சுட்டுச் சொல்லாகும். ‘இதோ’ அந்தத் திடமான கவன ஈர்ப்பைத் தக்கவைக்கிறது.
- source_word: מַשְׁחִיתָם
  choice: அவர்களை ... அழிக்கப்போகிறேன்
  rationale: שׁחת என்பதன் ஹிஃபீல் வடிவம் இத்தீர்ப்புச் சூழலில் ‘அழித்தல்’ என்று பொருள்படும். நிகழ்காலப் பங்கேற்பு உடனடியாக நிகழவிருக்கும் செயலைக் குறிக்கிறதால் ‘அழிக்கப்போகிறேன்’ என வழங்கப்பட்டது.
- source_word: אֶת־הָאָרֶץ
  choice: பூமியோடு சேர்த்து
  rationale: ‘அவர்களை அழிக்கிறேன்’ என்பதற்குப் பின் வரும் אֶת־הָאָרֶץ இலக்கண ரீதியாகக் கடினமானது. அதை இரண்டாம் நேரடிச் செயப்படுபொருளாகவோ, உடன்சேர்க்கைப் பொருளாகவோ புரிந்துகொள்ளலாம். கருவிப்பொருள் என்ற தவறான எண்ணத்தைத் தவிர்த்து, இருவரும் அழிவுக்குட்படுவதைக் காட்ட ‘பூமியோடு சேர்த்து’ என வழங்கப்பட்டது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: כָּל־בָּשָׂר என்பதன் பரப்பு
  choice: மனிதர்களோடு பிற உயிரினங்களையும் உள்ளடக்கக்கூடிய பரந்த வகை
  alternative: மனிதகுலம் மட்டும்; அல்லது சொற்படியான ‘எல்லா மாம்சமும்’
  rationale: வெள்ளக் கதையில் இச்சொற்றொடர் பொதுவாக மனிதர்களைவிட விரிந்த உயிரினப் பரப்பைக் குறிக்கிறது. மொழிபெயர்ப்பு அந்தப் பரப்பை தேவையின்றிக் குறுக்கவில்லை; சொற்படியான உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: הָאָרֶץ என்பதன் பொருள்
  choice: பூமி
  alternative: நிலம் / நாடு
  rationale: வெள்ளக் கதையின் விரிந்த கட்டமைப்பில் ‘பூமி’ பொருத்தமானது. இருப்பினும் எபிரெயச் சொல்லுக்கு ‘நிலம்’ என்ற பொருளும் இருக்க முடியும் என்பதால் அது அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: אֶת־הָאָרֶץ என்பதன் தொடரியல் உறவு
  choice: அவர்களையும் பூமியையும் ஒன்றாக அழித்தல்
  alternative: ‘அவர்களையும் பூமியையும் அழிக்கிறேன்’ என்ற இரட்டை நேரடிச் செயப்படுபொருள் அமைப்பு; அல்லது சொற்கட்டுக்கு நெருக்கமாக ‘பூமியுடன்’
  rationale: எபிரெயத் தொடரின் உண்மையான இலக்கணச் சிக்கலைத் தீர்மானமாக ஒற்றைப் பொருளுக்குள் அடைக்காமல், முதன்மை உரையில் இயல்பான உடன்சேர்க்கைப் பொருளையும் அடிக்குறிப்பில் மாற்று தொடரியல் வாசிப்பையும் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘இதோ’ போன்ற மூலத்தின் வலியுறுத்தல் காக்கப்பட்டது; அரிதான சொற்படியான ‘மாம்சம்’ முதன்மை உரையில் இயல்பாக்கப்பட்டு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
