revisions:
- from: யெகோவா, பூமியில் மனிதகுலத்தின்[a] தீமை பெருகியிருந்ததையும், அவர்களுடைய இதயச் சிந்தனைகளின் ஒவ்வொரு நாட்டமும் நாளெல்லாம் தீமையாக மட்டுமே இருந்ததையும் கண்டார்.[b]
