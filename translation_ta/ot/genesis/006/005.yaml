source:
  edition: WLC
  text: וַ/יַּ֣רְא יְהוָ֔ה כִּ֥י רַבָּ֛ה רָעַ֥ת הָ/אָדָ֖ם בָּ/אָ֑רֶץ וְ/כָל יֵ֨צֶר֙ מַחְשְׁבֹ֣ת לִבּ֔/וֹ רַ֥ק רַ֖ע כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/005.yaml
  text: And Yahweh saw that the wickedness of man was great on the earth[b][a], and that every inclination of the thoughts of his heart was only evil all the day.
translation:
  language: ta
  text: யெகோவா, பூமியில் மனிதகுலத்தின்[a] தீமை மிகுந்திருந்ததையும், அவர்களுடைய இதயச் சிந்தனைகளின் ஒவ்வொரு நாட்டமும் நாளெல்லாம் தீமையாக மட்டுமே இருந்ததையும் கண்டார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘மனிதன்’; இங்கு அந்தச் சொல் மனிதகுலம் முழுவதையும் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில் சொல்லுக்கு நெருக்கமாக: ‘நாளெல்லாம் தீமையாக மட்டுமே இருந்தது’; இதை ‘எப்போதும் தீமையாகவே இருந்தது’ என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டார்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை இயல்பான தமிழில் முன்னெடுக்கிறது; தனியே ‘அப்போது’ என்று சேர்த்து காலநுட்பத்தை மிகையாக விளக்கவில்லை.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் நீண்டகாலமாக அறியப்படும் பெயர்வடிவில் வழங்குகிறது.
- source_word: רַבָּה רָעַת הָאָדָם
  choice: மனிதகுலத்தின் தீமை பெருகியிருந்தது
  rationale: רַבָּה என்பது தீமையின் அளவு மிகுந்திருந்ததைச் சுட்டுகிறது. கூட்டு அர்த்தமுள்ள אָדָם என்பதை இங்கு இயல்பான, உள்ளடக்கமான ‘மனிதகுலம்’ எனத் தருகிறது.
- source_word: בָּאָרֶץ
  choice: பூமியில்
  rationale: ஆதியாகமத்தின் முதற்கால உலகளாவிய சூழலில் אֶרֶץ ஒரு குறிப்பிட்ட நாட்டைவிட பூமியைக் குறிக்கிறது.
- source_word: יֵצֶר
  choice: நாட்டம்
  rationale: உள்ளத்தில் உருவாகும் உந்துதல், மனச்சாய்வு அல்லது நோக்குநிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מַחְשְׁבֹת לִבּוֹ
  choice: அவர்களுடைய இதயச் சிந்தனைகள்
  rationale: எபிரெய மொழியின் ‘இதயம்’ என்ற மனித உள்ளார்ந்த சிந்தனை-விருப்ப மையத்தைத் தக்கவைக்கிறது; கூட்டு אָדָם காரணமாக தமிழில் பன்மைச் சுட்டு இயல்பாகப் பயன்படுத்தப்படுகிறது.
- source_word: רַק רַע כָּל הַיּוֹם
  choice: நாளெல்லாம் தீமையாக மட்டுமே
  rationale: ரַק என்பதன் விலக்கும் வலிமையையும் כָּל הַיּוֹם என்பதன் தொடர்ச்சியான கால விரிவையும் நெருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் உள்ள தனிப்பட்ட பெயரை ஒரு பட்டத்தால் மாற்றாமல் பெயராகவே தருகிறது. தமிழ் வாசகர்களிடையே பரவலாக அறியப்படும் ஒலிபெயர்ப்பு ‘யெகோவா’; ‘யாவே’ என்பது மூல உச்சரிப்பை மீட்டமைக்க முயலும் மாற்று வடிவம்.
- issue: אָדָם என்பதன் கூட்டு அர்த்தம்
  choice: மனிதகுலம்
  alternative: மனிதன்
  rationale: இங்கு ஒரே ஆணை அல்ல, மனித இனத்தை மொத்தமாகக் குறிக்கிறது. ஆகவே நவீனத் தமிழில் ‘மனிதகுலம்’ பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; நேரடி ஒருமை வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: இதயச் சிந்தனைகளின் ஒவ்வொரு நாட்டமும் தீமை என்ற முழுமையான கூற்று
  choice: மூலத்தின் முழுமையான வலிமையைத் தக்கவைத்தல்
  alternative: பொதுவாகத் தீமையை நோக்கியிருந்தது
  rationale: כָּל, רַק, כָּל־הַיּוֹם ஆகியவற்றின் சேர்க்கை மிக வலுவான முழுமையைக் கூறுகிறது. அதை மென்மைப்படுத்துவது உரையின் இறையியல் பதற்றத்தைத் தீர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, எளிதில் புரியும் நடையைப் பயன்படுத்துகிறது. ‘இதயம்’ என்ற வேதாகம மனிதவியல் உருவகத்தைத் தக்கவைத்து, கூட்டு மனிதகுலத்தைக் குறிக்க பன்மைப் பெயர்ச்சுட்டைப் பயன்படுத்துகிறது. இரு அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
