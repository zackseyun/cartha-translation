source:
  edition: WLC
  text: צֹ֣הַר תַּֽעֲשֶׂ֣ה לַ/תֵּבָ֗ה וְ/אֶל אַמָּה֙ תְּכַלֶ֣/נָּה מִ/לְ/מַ֔עְלָ/ה וּ/פֶ֥תַח הַ/תֵּבָ֖ה בְּ/צִדָּ֣/הּ תָּשִׂ֑ים תַּחְתִּיִּ֛ם שְׁנִיִּ֥ם וּ/שְׁלִשִׁ֖ים תַּֽעֲשֶֽׂ/הָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/016.yaml
  text: You shall make a roof for the ark[a], and finish it to within a cubit from above. And you shall set the ark’s door in its side. You shall make it with lower, second[d][c][b], and third levels.
translation:
  language: ta
  text: பேழைக்கு ஒரு கூரையை[a] அமைக்க வேண்டும்; மேல்புறத்தில் ஒரு முழம் அளவாக அதை முடிக்க வேண்டும்[b]. பேழையின் கதவை அதன் பக்கவாட்டில் அமைக்க வேண்டும். அதைக் கீழ்த்தளம், இரண்டாம் தளம், மூன்றாம் தளம்[c] கொண்டதாக அமைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சாளரம்’ அல்லது ‘மேல்வெளிச்சத் திறப்பு’ என்றும் மொழிபெயர்க்கலாம். இதற்கான எபிரெயச் சொல் அரிதானது; அது முழுக் கூரையைக் குறிக்காமல், வெளிச்சம் வருவதற்கான ஒரு திறப்பைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: மேற்புறமும் ஒரு முழம் என்ற அளவும் எவ்வாறு தொடர்புபடுகின்றன என்பது எபிரெய வாசகத்தில் தெளிவாக இல்லை. பேழையின் மேற்பகுதியை ஒரு முழம் அளவுக்கு ஒடுக்கி அல்லது குறுகச் செய்து முடிப்பதை இது குறிக்கக்கூடும்.
    reason: textual_or_syntactic_ambiguity
  - marker: c
    text: ‘தட்டுகள்’ அல்லது ‘அடுக்குகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹהַר
  choice: கூரை
  rationale: இச்சொல் அரிதானது; அதன் துல்லியமான பொருள் உறுதியில்லை. அடுத்துள்ள மேற்புறக் கட்டமைப்பு பற்றிய வாசகத்துடன் ‘கூரை’ நன்றாகப் பொருந்துகிறது; ‘சாளரம்’ அல்லது ‘மேல்வெளிச்சத் திறப்பு’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תַּעֲשֶׂה לַתֵּבָה
  choice: பேழைக்கு ... அமைக்க வேண்டும்
  rationale: עשה வினையுடன் வரும் ל, பேழைக்காக ஒரு கட்டமைப்பைச் செய்யும்படி கூறுகிறது. நவீன தமிழில் ‘அமைக்க வேண்டும்’ இயல்பாகவும் கட்டுமானச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: וְאֶל אַמָּה תְּכַלֶנָּה מִלְמַעְלָה
  choice: அதன் மேற்புறத்தை ஒரு முழம் அளவில் முடிக்க வேண்டும்
  rationale: כלה என்பதன் பியேல் வடிவம் ‘முடித்தல்/நிறைவுசெய்தல்’ எனப் பொருள்படும். எபிரெயத் தொடர் இலக்கண ரீதியாகக் கடினமானது; மேற்புறக் கட்டமைப்பும் ஒரு முழம் என்ற அளவும் தொடர்புடையவை என்பதைச் சொல்லி, அதன் துல்லியமான வடிவத்தை மொழிபெயர்ப்பு தீர்மானிக்காமல் விடுகிறது.
- source_word: פֶּתַח
  choice: கதவு
  rationale: பேழைக்குள் நுழைவதற்கான செயல்பாட்டு வழியை இக்கட்டுமானச் சூழலில் ‘கதவு’ இயல்பாகக் குறிக்கிறது; ‘திறப்பு’ என்பதும் சொற்பொருள் வாய்ப்பு.
- source_word: בְּצִדָּהּ
  choice: அதன் பக்கத்தில்
  rationale: ב + צד என்பது பேழையின் பக்கவாட்டிலுள்ள இடத்தைக் குறிக்கிறது. ‘அதன் பக்கத்தில்’ என்பது தமிழில் தெளிவான இடக்குறிப்பு.
- source_word: תַּחְתִּיִּם שְׁנִיִּם וּשְׁלִשִׁים
  choice: கீழ்த்தளம், இரண்டாம் தளம், மூன்றாம் தளம்
  rationale: இந்தப் பன்மை/வரிசை வடிவங்கள் பேழையின் மூன்று அடுக்குகளைக் குறிக்கின்றன. ‘தளம்’ என்பது கப்பலுக்குரிய ‘மேல்தட்டு’ என்ற பொருளைத் தேவையின்றி திணிக்காத, நடுநிலையான கட்டடச் சொல்.
- source_word: תַּעֲשֶׂהָ
  choice: அதை ... அமைக்க வேண்டும்
  rationale: பெண்பால் ஒருமை பின்னொட்டு பேழையைக் குறிக்கிறது; தமிழில் செயப்படுபொருளை ‘அதை’ என்று வெளிப்படையாகக் கூறுவது இயல்பு.
