base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/018.yaml
  text: But I will establish my covenant with you[a], and you shall enter the ark—you, your sons, your wife, and your sons’ wives with you.
translation:
  language: ta
  text: ஆனால் நான் உன்னுடன் என் உடன்படிக்கையை நிலைநாட்டுவேன்[a]. நீயும் உன் மகன்களும் உன் மனைவியும் உன் மகன்களின் மனைவிகளும் உன்னுடன் பேழைக்குள் செல்வீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நான் உன்னுடன் என் உடன்படிக்கையை உறுதிப்படுத்துவேன்.’ உடன்படிக்கைச் சூழலில் எபிரெய வினை ‘நிலைநாட்டுதல்,’ ‘உறுதிப்படுத்துதல்’ ஆகிய இரு நுணுக்கங்களையும் கொள்ளக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: ஆனால் நான் ... நிலைநாட்டுவேன்
  rationale: முந்தைய அழிவுத் தீர்ப்புக்கு மாறான திருப்பத்தை ‘ஆனால்’ இயல்பாகக் காட்டுகிறது. ஹிஃபில் வடிவிலுள்ள קום, உடன்படிக்கைச் சூழலில் ‘ஏற்படுத்துதல்’ அல்லது ‘உறுதிப்படுத்துதல்’ என்ற இரு நுணுக்கங்களையும் கொள்ளக்கூடும்; ‘நிலைநாட்டுவேன்’ அவற்றை அளவுக்கு மீறித் தீர்மானிக்காமல் வெளிப்படுத்துகிறது.
- source_word: בְּרִיתִי
  choice: என் உடன்படிக்கையை
  rationale: בְּרִית என்பதற்கான இயல்பான, மரியாதையான தமிழ் இணை ‘உடன்படிக்கை’; அதன் வேதாகம மற்றும் இறையியல் முக்கியத்துவத்தையும் இது காக்கிறது.
- source_word: אִתָּךְ
  choice: உன்னுடன்
  rationale: உடன்படிக்கையின் உறவையும், வசனத்தின் இறுதியில் வரும்போது உடனிருப்பதையும் இயல்பாகக் குறிக்கிறது.
- source_word: וּבָאתָ אֶל הַתֵּבָה
  choice: நீ பேழைக்குள் செல்வாய்
  rationale: בוא என்பது வருதல், செல்லுதல், நுழைதல் ஆகிய பொருள்களைக் கொள்ளலாம். இலக்காகப் பேழை வருவதால் ‘பேழைக்குள் செல்வாய்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַתֵּבָה
  choice: பேழை
  rationale: நோவாவின் கப்பல் போன்ற பெட்டகத்தைக் குறிக்கும் תֵּבָה என்பதற்கான நிலைபெற்ற தமிழ் வேதாகமச் சொல்.
- source_word: אַתָּה וּבָנֶיךָ וְאִשְׁתְּךָ וּנְשֵׁי בָנֶיךָ
  choice: நீயும், உன் மகன்களும், உன் மனைவியும், உன்னுடன் உன் மகன்களின் மனைவிகளும்
  rationale: மூலத்தின் வலியுறுத்தப்பட்ட ‘நீ’ என்பதையும் குடும்ப உறுப்பினர்களின் குறிப்பிட்ட வரிசையையும் உறவுமுறைகளையும் பாதுகாக்கிறது. בָּנִים என்பதால் பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதில் ‘மகன்கள்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: உடன்படிக்கையைச் சார்ந்த வினைச்சொல்லின் இயல்பு
  choice: நான் உன்னுடன் என் உடன்படிக்கையை நிலைநாட்டுவேன்
  alternative: நான் உன்னுடன் என் உடன்படிக்கையை உறுதிப்படுத்துவேன்
  rationale: எபிரெய வினை, புதிய உடன்படிக்கையை ஏற்படுத்துவதையோ ஏற்கெனவே உள்ள அர்ப்பணிப்பை உறுதிப்படுத்துவதையோ குறிக்கக்கூடும். இந்த வசனம் மட்டும் அந்த இறையியல் கேள்வியைத் தீர்க்காததால், முதன்மை உரை பரந்த பொருளுடைய ‘நிலைநாட்டுவேன்’ என்பதைப் பயன்படுத்தி, மாற்று நுணுக்கத்தை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘பேழை,’ ‘உடன்படிக்கை’ ஆகியவை வாசகர்களுக்கு பரிச்சயமான வேதாகமச் சொற்களாகத் தக்கவைக்கப்பட்டுள்ளன. பட்டியலின் இறுதியில் ‘செல்ல வேண்டும்’ சேர்க்கப்பட்டிருப்பது தமிழில் நீண்ட எழுவாய்ப் பட்டியலைத் தெளிவாக முடிக்கிறது; அதேவேளையில் மூலத்தின் கட்டளை/நிச்சய எதிர்காலத் தொனியை வெளிப்படுத்துகிறது.
