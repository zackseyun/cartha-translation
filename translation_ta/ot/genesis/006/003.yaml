  text: וַ/יֹּ֣אמֶר יְהוָ֗ה לֹֽא יָד֨וֹן רוּחִ֤/י בָֽ/אָדָם֙ לְ/עֹלָ֔ם בְּ/שַׁ/גַּ֖ם ה֣וּא בָשָׂ֑ר וְ/הָי֣וּ יָמָ֔י/ו מֵאָ֥ה וְ/עֶשְׂרִ֖ים שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/003.yaml
  text: Then Yahweh said[a], “My Spirit will not contend with man forever, for he is flesh[c][b]; therefore his days will be one hundred and twenty years.”
translation:
  language: ta
  text: அப்போது யாவே, “என் ஆவி மனிதனோடு என்றென்றும் போராடாது[a]; ஏனெனில் அவனும் மாம்சமே. ஆகவே, அவனுடைய நாட்கள் நூற்றிருபது ஆண்டுகளாக இருக்கும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் ஆவி மனிதனில் என்றென்றும் தங்கியிருக்காது.” இங்குள்ள எபிரெய வினைச்சொல்லின் பொருள் விவாதத்திற்குரியது; அது ‘போராடுதல்’ என்பதற்குப் பதிலாக ‘தங்கியிருத்தல்’ அல்லது ‘நிலைத்திருத்தல்’ என்ற பொருளையும் தரலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: יָדוֹן
  choice: போராடிக்கொண்டிருக்காது
  rationale: பொருள் விவாதத்திற்குரிய வினைச்சொல்லை ‘எதிர்த்துப் போராடுதல்/மன்றாடுதல்’ என்ற சாத்தியமான பொருளில் மொழிபெயர்க்கிறது; ‘தங்கியிருத்தல்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: רוּחִי
  choice: என் ஆவி
  rationale: தெய்வீகப் பேச்சாளருடன் வரும் முதலாம் நபர் உடைமை வடிவம், இங்கு யாவேயின் ஆவியைக் குறிப்பதாக இயல்பாகப் புரிகிறது; பின்னாளைய கோட்பாட்டு விவரங்களை வசனத்திற்குள் திணிக்கவில்லை.
- source_word: בָאָדָם
  choice: மனிதனோடு
  rationale: אָדָם என்பது இங்கு மனிதகுலத்தைப் பிரதிநிதித்துவப்படுத்தும் ஒருமைச் சொல். தேர்ந்தெடுத்த ‘போராடுதல்’ என்ற வினையுடன் בְ இயல்பாக ‘-ஓடு’ என அமைகிறது.
- source_word: לְעֹלָם
  choice: என்றென்றும்
  rationale: இந்தச் சூழலில் தொடர்ச்சியான, முடிவற்ற காலத்தைக் குறிக்கும் தெளிவான நவீனத் தமிழ் வடிவம்.
- source_word: בְּשַׁגַּם הוּא בָשָׂר
  choice: அவனும் மாம்சமே
  rationale: அரிய בְּשַׁגַּם வடிவிலுள்ள காரணத் தொடர்பையும் גַּם கூறின் ‘உம்’ வலியுறுத்தலையும் சுருக்கமாகப் பிரதிபலிக்கிறது; בָשָׂר என்பதன் உருவக மற்றும் இறையியல் அடர்த்தியை ‘மாம்சம்’ காக்கிறது.
- source_word: וְהָיוּ יָמָיו
  choice: ஆகவே, அவனுடைய நாட்கள் ... இருக்கும்
  rationale: வாவ் இணைப்பை முந்தைய கூற்றின் விளைவாகப் புரிந்து, தமிழில் காரண–விளைவு உறவைத் தெளிவாக்குகிறது; ‘நாட்கள்’ என்ற மூல உருவகத்தையும் காக்கிறது.
- source_word: מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: நூற்றிருபது ஆண்டுகள்
  rationale: எண்ணை இலக்கிய வாசிப்பிற்கு ஏற்ற முழுச் சொல் வடிவில் வழங்குகிறது.
theological_decisions:
- issue: மனிதனோடு தொடர்புடைய கடவுளின் רוּחַ
  choice: என் ஆவி
  alternative: என் மூச்சு / என் உயிர்மூச்சு
  rationale: רוּחַ என்பதற்கு ஆவி, காற்று, மூச்சு ஆகிய பொருள்கள் உண்டு. ஆனால் தெய்வீகப் பேச்சாளரின் ‘என்’ என்ற உடைமை வடிவம் இங்கு கடவுளின் ஆவியைச் சுட்டுவது அதிக இயல்பு; அதே நேரத்தில் பின்னாளைய திரித்துவ விளக்கத்தை வெளிப்படையாகச் சேர்க்கவில்லை.
- issue: יָדוֹן என்ற வினையின் பொருள்
  choice: போராடிக்கொண்டிருக்காது
  alternative: மனிதனில் என்றென்றும் தங்கியிருக்காது
  rationale: எபிரெய வினையின் பொருள் உறுதியற்றது. பிரதான உரை ‘போராடுதல்’ என்ற வாசிப்பை ஏற்கிறது; உண்மையான ‘தங்குதல்/நிலைத்திருத்தல்’ மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: אָדָם என்பதன் வரம்பு
  choice: மனிதன் என்ற பொதுமை ஒருமை
  alternative: மனிதகுலம்
  rationale: மூலத்தில் இலக்கணரீதியாக ஒருமை ஆண்பால் வடிவம் மனிதகுலத்தைப் பிரதிநிதித்துவப்படுத்துகிறது. தமிழ் ‘மனிதன்’ இந்த ஒருமைத் தொடர்ச்சியைத் தக்கவைக்கிறது.
- issue: நூற்றிருபது ஆண்டுகளின் குறிப்பு
  choice: விளக்கம் சேர்க்காமல் ‘அவனுடைய நாட்கள்’ எனப் பாதுகாத்தல்
  alternative: மனித ஆயுட்கால வரம்பு / வெள்ளம் வரையிலான அவகாசம்
  rationale: இந்த எண்ணிக்கை தனிநபர் ஆயுட்காலத்தையா அல்லது தீர்ப்புக்கு முந்தைய காலத்தையா குறிக்கிறது என்பது வசனத்தில் வெளிப்படையாகத் தீர்மானிக்கப்படவில்லை. எனவே மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைத் தீர்க்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பானதும் மரியாதைமிக்கதுமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘யாவே’, ‘ஆவி’, ‘மாம்சம்’, ‘நாட்கள்’ ஆகிய சொற்கள் மூலத்தின் பெயர், உருவகம், இறையியல் நிறை ஆகியவற்றைக் காக்கின்றன. பிரதான உரை வாசிக்க எளிதாக இருக்கும்போதும், יָדוֹן மற்றும் בְּשַׁגַּם ஆகியவற்றின் உண்மையான பொருள் சிக்கல்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
