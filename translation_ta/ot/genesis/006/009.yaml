  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் வேதாகமத்துக்குரிய கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. ‘தலைமுறை வரலாறு’ மற்றும் ‘நடந்து வந்தார்’ என்பவை ஆதியாகமத்தின் கட்டமைப்பு மற்றும் உருவகத் தொடர்புகளைத் தக்கவைக்கின்றன.
