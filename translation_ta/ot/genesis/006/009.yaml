  yaml_path: translation/ot/genesis/006/009.yaml
  text: These are the generations of Noah. Noah was a righteous man[a], blameless in his generation. Noah walked with God.
translation:
  language: ta
  text: நோவாவின் வரலாறு இதுவே. நோவா நீதிமான்; தம் தலைமுறையில்[a] குற்றமற்றவராக இருந்தார். நோவா தேவனோடு நடந்து வந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தம் காலத்து மக்களிடையே” அல்லது “தம் காலத்தில்.”
    reason: בְּדֹרֹתָיו என்ற சொல்லின் காலம் அல்லது சமகாலத்தார் என்னும் மாற்றுப் பொருள்களைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת נֹחַ
  choice: நோவாவின் தலைமுறை வரலாறு இதுவே
  rationale: தּוֹלְדֹת என்பது ஆதியாகமத்தின் பகுதிகளை அமைக்கும் முக்கியச் சொல். ‘தலைமுறை வரலாறு’ என்பது அதன் வம்சம்/வரலாறு ஆகிய இரு தொடர்புகளையும் இயன்றவரை தக்கவைத்து, தமிழில் தலைப்புத் தன்மையுடன் இயல்பாக அமைகிறது.
- source_word: אִישׁ צַדִּיק
  choice: நீதிமான்
  rationale: இது நோவாவை ஒழுக்கரீதியாக நீதியுள்ள ஆணாக விவரிக்கிறது. தமிழில் ‘நீதிமான்’ என்பதே சுருக்கமான, இயல்பான, இறையியல் நிறை கொண்ட சொல்; பெயரால் நபர் குறிப்பு தெளிவாக இருப்பதால் אִישׁ என்பதற்காக ‘ஒரு மனிதர்’ என்று தனியே சேர்ப்பது செயற்கையாக இருக்கும்.
- source_word: תָּמִים
  choice: குற்றமற்றவர்
  rationale: இங்கு முழுமையான பாவமின்மையை அவசியம் குறிக்காமல், நேர்மையும் பழிசுமத்த முடியாத நடத்தையும் குறிக்கிறது. ‘குற்றமற்றவர்’ அந்தப் பொருளைத் தக்கவைக்கிறது.
- source_word: בְּדֹרֹתָיו
  choice: தம் தலைமுறைகளில்
  rationale: எபிரெயச் சொல் பன்மையில் உள்ளது. சற்றே முறையான இம்மொழிபெயர்ப்பு, ‘அவரது காலத்தில்’ அல்லது ‘அவருடன் வாழ்ந்தவர்களிடையே’ என்ற இரு சாத்தியங்களுக்குள் ஒன்றை மட்டும் தீர்மானிக்காமல் மூலத்தின் திறந்த பொருளைத் தக்கவைக்கிறது.
- source_word: אֶת הָאֱלֹהִים הִתְהַלֶּךְ
  choice: தேவனோடு நடந்து வந்தார்
  rationale: வாழ்க்கை முறையையும் தேவனுடனான உறவையும் குறிக்கும் எபிரெய உருவகத்தை ‘நடந்து வந்தார்’ இயல்பாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: நோவாவைக் குறிக்கும் תָּמִים என்பதன் வலிமை
  choice: நேர்மையையும் பழியற்ற நடத்தையையும் குறிக்கும் ‘குற்றமற்றவர்’
  alternative: பரிபூரணமானவர்; மாசற்றவர்
  rationale: மூலச்சொல் நோவாவின் முழுமையான பாவமின்மையை கட்டாயப்படுத்தவில்லை. கெட்டுப்போன சமுதாயத்துக்கு எதிர்மாறாக அவரது நேர்மையைப் பாராட்டுகிறது; எனவே உரை கூறாத கோட்பாட்டைச் சேர்க்கவில்லை.
- issue: בְּדֹרֹתָיו என்பதன் பொருள்
  choice: பன்மையையும் தெளிவின்மையையும் தக்கவைக்கும் ‘தம் தலைமுறைகளில்’
  alternative: தம் காலத்து மக்களிடையே; தம் காலத்தில்
  rationale: இது நோவா வாழ்ந்த காலப்பகுதிகளையோ, அவருடன் வாழ்ந்த மக்களையோ குறிக்கலாம். முதன்மை உரை எந்த ஒரு விளக்கத்தையும் கட்டாயப்படுத்தாமல், இயல்பான மாற்றுப் பொருள்களை அடிக்குறிப்பில் தருகிறது.
