source:
  edition: WLC
  text: וַ/יַּ֧רְא אֱלֹהִ֛ים אֶת הָ/אָ֖רֶץ וְ/הִנֵּ֣ה נִשְׁחָ֑תָה כִּֽי הִשְׁחִ֧ית כָּל בָּשָׂ֛ר אֶת דַּרְכּ֖/וֹ עַל הָ/אָֽרֶץ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/012.yaml
  text: And God saw the earth[a], and behold, it was corrupted[b], because all flesh had corrupted its way on the earth.
translation:
  language: ta
  text: கடவுள் பூமியைப் பார்த்தார்; இதோ, அது சீர்கெட்டிருந்தது[a]. ஏனெனில் மாம்சமுள்ள அனைத்தும்[b] பூமியில் தங்கள் வழியைச் சீர்கெடுத்திருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாழடைந்திருந்தது’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல் ஒழுக்கச் சீரழிவையும் பாழாதல் அல்லது அழிவையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: 'நேரடிப் பொருள்: ‘எல்லா மாம்சமும்’; இத்தொடர் மனிதகுலத்தையோ, இன்னும் விரிவாக மாம்சமுள்ள உயிர்களையோ குறிக்கக்கூடும்.'
    reason: scope_ambiguity
lexical_decisions:
- source_word: וַיַּרְא
  choice: பார்த்தார்
  rationale: ראה என்பதன் எளிய கதைநடைப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; கூடுதல் மதிப்பீட்டு நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இச்சூழலில் ஒரே கடவுளைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: வெள்ளக் கதையின் விரிந்த சூழலுக்கு ‘நாடு’ என்பதைவிட ‘பூமி’ பொருத்தமானது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: காணப்பட்ட நிலைமையின்மீது திடீர், வலுவான கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் உரையாடல் வலிமையைப் பேணுகிறது.
- source_word: נִשְׁחָתָה
  choice: சீர்கெட்டிருந்தது
  rationale: שׁחת என்பதில் உள்ள ஒழுக்கச் சீரழிவையும் பாழடைந்த நிலையையும் ஒரே பொருளுக்குள் வைத்திருக்கிறது; அவற்றில் ஒன்றாக மட்டும் குறுக்கவில்லை.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: הִשְׁחִית
  choice: சீர்கெடுத்திருந்தன
  rationale: முன்னுள்ள அதே שׁחת வேருடன் தமிழிலும் சொல் தொடர்பைப் பேணி, ஹிஃபீல் வடிவின் காரணவினைப் பொருளை வெளிப்படுத்துகிறது.
- source_word: כָּל בָּשָׂר
  choice: மாம்சமான அனைத்தும்
  rationale: ‘எல்லா மாம்சமும்’ என்ற எபிரெய மரபுத்தொடரின் பரப்பை ‘மனிதர்கள் அனைவரும்’ என்றோ ‘உயிரினங்கள் அனைத்தும்’ என்றோ தீர்மானித்துவிடாமல் பேணுகிறது.
- source_word: דַּרְכּוֹ
  choice: தமது வழியை
  rationale: דֶּרֶךְ என்பதன் உருவகமான ‘வழி/நடத்தை’ பொருளைப் பேணுகிறது; கூட்டுத் தொடருக்கு இயல்பான தமிழ் இணக்கத்தை அளிக்கிறது.
- source_word: עַל הָאָרֶץ
  choice: பூமியில்
  rationale: இச்சூழலில் இயல்பான தமிழில் இடப்பொருளைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: שׁחת என்ற ஒரே வேரின் இரு வடிவங்களுடைய பொருள்
  choice: ‘சீர்கெட்டிருந்தது … சீர்கெடுத்திருந்தன’ என்று ஒரே சொல்லிணைப்பைப் பயன்படுத்துதல்
  alternative: ‘பாழடைந்திருந்தது … கெடுத்திருந்தன’ அல்லது ‘ஒழுக்கங்கெட்டிருந்தது … ஒழுக்கங்கெடுத்திருந்தன’
  rationale: எபிரெயச் சொல் ஒழுக்கச் சீரழிவையும் அதன் விளைவான பாழ்நிலையையும் உள்ளடக்கக்கூடும். ‘சீர்கெடு’ இரண்டுக்கும் இடமளித்து, பூமியின் நிலைக்கும் மாம்சமான அனைத்தின் செயலுக்கும் உள்ள வேர்ச்சொல் தொடர்பைப் பேணுகிறது.
- issue: כָּל בָּשָׂר என்பதன் பரப்பு
  choice: ‘மாம்சமான அனைத்தும்’ என்ற மரபுத்தொடரைப் பேணுதல்
  alternative: ‘மனிதர்கள் அனைவரும்’ அல்லது ‘உயிரினங்கள் அனைத்தும்’
  rationale: உடனடிச் சூழலில் மனிதகுலம் முன்னிலையில் இருந்தாலும், எபிரெயத் தொடர் விரிந்த பொருளையும் கொண்டிருக்கக்கூடும்; மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைத் தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ மூலத்தின் வலியுறுத்தலைப் பேணுகிறது. ‘மாம்சமான அனைத்தும்’ சற்றே செறிவான வேதாகம மொழியாக இருந்தாலும், மூலத்தின் உண்மையான பொருள் விரிவை விளக்கமாகக் குறுக்காமல் காக்கிறது.
