  to: கடவுள் பூமியைப் பார்த்தார்; இதோ, அது சீர்கெட்டிருந்தது[a]. ஏனெனில் மாம்சமுள்ள அனைத்தும்[b] பூமியில் தங்கள் வழியைச் சீர்கெடுத்திருந்தன.
