source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּֽי הֵחֵ֣ל הָֽ/אָדָ֔ם לָ/רֹ֖ב עַל פְּנֵ֣י הָֽ/אֲדָמָ֑ה וּ/בָנ֖וֹת יֻלְּד֥וּ לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/001.yaml
  text: And it happened[a], when man began to multiply on the face of the ground, and daughters were born to them,
translation:
  language: ta
  text: மனிதகுலம்[a] நிலத்தின் மேற்பரப்பில் பெருகத் தொடங்கி, அவர்களுக்குப் பெண் பிள்ளைகள் பிறந்தபோது,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இங்கு “மனிதன்” என்பது ஒருமை வடிவில் இருந்தாலும், மனிதகுலம் முழுவதையும் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: …போது
  rationale: இந்த எபிரெயக் கதைத் தொடர் அடுத்த வசனத்தில் வரும் முதன்மை நிகழ்வுக்கான காலச் சூழலை அறிமுகப்படுத்துகிறது. தமிழில் தனியாக ‘அது நிகழ்ந்தது’ என்று சேர்ப்பதைவிட, ‘…போது’ என்ற தொடரமைப்பு அதன் உரையாடல் செயல்பாட்டை இயல்பாகக் கடத்துகிறது.
- source_word: הֵחֵל
  choice: தொடங்கி
  rationale: இங்கு வினை ஒரு செயல் ஆரம்பமாவதைக் குறிக்கிறது; ‘தொடங்கி’ என்பது தொடரும் வாக்கிய அமைப்புடன் இயல்பாகப் பொருந்துகிறது.
- source_word: הָאָדָם
  choice: மனிதகுலம்
  rationale: எபிரெயச் சொல் இலக்கணத்தில் ஒருமையாக இருந்தாலும் இங்கு தனிப்பட்ட ஆதாமை அல்ல, மனித இனத்தைத் தொகுப்பாகக் குறிக்கிறது. ‘மனிதகுலம்’ இதை நவீனத் தமிழில் பாலினத் தவறுபுரிதலின்றித் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לָרֹב
  choice: பெருக
  rationale: எண்ணிக்கையில் அதிகரிப்பதைக் குறிக்கும் வினை; மக்கள் தொகை வளர்ச்சியை ‘பெருக’ சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: நிலத்தின் மேற்பரப்பில்
  rationale: עַל־פְּנֵי என்பதன் மேற்பரப்பு உருவகத்தையும், אֲדָמָה என்பதன் ‘நிலம்/மண்’ என்ற குறிப்பான பொருளையும் தக்கவைக்கிறது.
- source_word: וּבָנוֹת
  choice: பெண் பிள்ளைகள்
  rationale: ‘மகள்கள்’ என்பதும் சாத்தியம்; பிறப்புச் சூழலில் ‘பெண் பிள்ளைகள்’ என்பது சாதாரண வாசகருக்கு இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יֻלְּדוּ לָהֶם
  choice: அவர்களுக்குப் … பிறந்த
  rationale: יָלַד வினையின் செயப்பாட்டு வடிவத்தையும் לָהֶם குறிக்கும் உறவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: הָאָדָם என்ற ஒருமை வடிவத்தின் கூட்டுப்பொருள்
  choice: மனிதகுலம்
  alternative: மனிதன்
  rationale: சூழலும் பின்னரும் வரும் பன்மைச் சுட்டான לָהֶם என்பதும், இங்கு ஒரு தனி ஆணை அல்ல மனிதர்கள் அனைவரையும் குறிக்கும் கூட்டுப்பொருள் இருப்பதைக் காட்டுகின்றன. மூலத்தின் ஒருமை வடிவத்தை விளக்க அடிக்குறிப்பு வழங்கப்படுகிறது; எந்தக் குறிப்பிட்ட கோட்பாட்டு வாசிப்பும் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய வாசிப்புத்தன்மையும் கொண்ட நடையைப் பயன்படுத்துகிறது. வசனம் அடுத்த வசனத்தில் நிறைவுபெறும் காலத் துணைவாக்கியமாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
