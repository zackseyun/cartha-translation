  source_fidelity: மூல எபிரெயத்தின் கூட்டுப்பொருளுடைய הָאָדָם, எண்ணிக்கையில் பெருகுதல், நிலத்தின் மேற்பரப்பு, மற்றும் அவர்களுக்குப் பெண் சந்ததியர் பிறத்தல் ஆகிய கூறுகள் துல்லியமாகக் கடத்தப்பட்டுள்ளன. வசனம் அடுத்த வசனத்துடன் தொடரும் காலத் துணைவாக்கியமாக இருப்பதால் இறுதிக் காற்புள்ளி பொருத்தமானது. வַיְהִי כִּי என்பதன் கதைமுன்னுரை தமிழில் இயல்பாகக் காலத் தொடரமைப்பில் உட்பொதிக்கப்பட்டுள்ளது.
  naturalness: “மனிதகுலம் நிலத்தின் மேற்பரப்பில் பெருகத் தொடங்கி, அவர்களுக்குப் பெண் பிள்ளைகள் பிறந்தபோது,” என்பது நவீன நிலையான தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. “பெண் பிள்ளைகள்” என்பது இச்சூழலில் புரிந்துகொள்ளத்தக்க, நடுநிலையான நடை.
  terminology: “மனிதகுலம்” இங்கு தனிப்பட்ட ஆதாமை அல்லாமல் மனித இனத்தைச் சுட்டும் எபிரெயக் கூட்டுப்பொருளைச் சரியாகத் தெரிவிக்கிறது. அடிக்குறிப்பு எபிரெய ஒருமை வடிவத்தையும் அதன் கூட்டுக் குறிப்பையும் துல்லியமாக விளக்குகிறது. “நிலத்தின் மேற்பரப்பு” אֲדָמָה மற்றும் עַל־פְּנֵי ஆகியவற்றின் குறிப்பான உருவகத்தைப் பாதுகாக்கிறது.
