  source_fidelity: ‘நோவாவுக்கு … கிடைத்தது’ கருத்தளவில் ஏற்றதாயினும், எபிரேயத்தில் நோவாவே வினையின் வெளிப்படையான எழுவாய் (‘நோவா கண்டடைந்தான்’) ஆக இருக்கிறார். அதைத் தமிழிலும் செயல்வடிவில் காப்பது மூலத்துக்கு நெருக்கமானது. ‘ஆனால்’ சூழலிலுள்ள முரண்பாட்டைச் சரியாகக் காட்டுகிறது; ‘யாவே’ என்பது யְהוָה-வின் பொருத்தமான ஒலிபெயர்ப்பு.
  naturalness: ‘யாவேயின் பார்வையில் தயவைப் பெற்றான்’ நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. இது ‘பார்வையில்’ என்ற மொழிப்பாங்கையும் ‘தயவு’ என்ற பொருளையும் தெளிவாகக் கொண்டுவருகிறது.
