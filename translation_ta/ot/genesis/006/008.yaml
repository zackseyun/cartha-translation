  text: וְ/נֹ֕חַ מָ֥צָא חֵ֖ן בְּ/עֵינֵ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/008.yaml
  text: But Noah found favor in the eyes of Yahweh[a].
translation:
  language: ta
  text: ஆனால், நோவா யாவேயின் பார்வையில் தயவைப் பெற்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நோவா யாவேயின் பார்வையில் அருளைப் பெற்றான்.”
    reason: חֵן என்பதற்கு ‘தயவு’ என்றும் ‘அருள்’ என்றும் பொருள் கொள்ளலாம்.
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: ஆனால் நோவா
  rationale: וְ பொதுவாக ‘மற்றும்’ என்று பொருள்படும்; இங்கு சுற்றியுள்ள மனிதச் சீர்கேடும் வரவிருக்கும் தீர்ப்பும் நோவாவுடன் முரண்படுத்தப்படுவதால், ‘ஆனால்’ என்பது உரையோட்டத்தின் எதிர்மறைத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מָצָא
  choice: கிடைத்தது
  rationale: מצא என்பதன் அடிப்படைப் பொருள் ‘கண்டடைதல்’. ஆனால் தமிழில் ஒருவருக்கு மற்றொருவரின் பார்வையில் தயவு ‘கிடைத்தது’ என்பது இந்த எபிரெய மொழிப்பாங்கின் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: חֵן
  choice: தயவு
  rationale: חֵן என்பது ‘தயவு’, ‘அருள்’, ‘ஏற்பு’ ஆகிய பொருட்களைக் கொள்ளலாம். இச்சூழலில் ‘தயவு’ எபிரெய மொழிப்பாங்கைப் பாதுகாப்பதோடு, பிற்கால இறையியல் பொருளைத் தேவையின்றி முன்வைப்பதையும் தவிர்க்கிறது.
- source_word: בְּ/עֵינֵי
  choice: பார்வையில்
  rationale: சொல்லுக்குச் சொல் ‘கண்களில்’ என்றாலும், இந்த எபிரெய மொழிப்பாங்கு ‘ஒருவரின் மதிப்பீட்டில் அல்லது முன்னிலையில்’ என்று பொருள்படும். ‘பார்வையில்’ என்பது உருவகத்தை ஓரளவு காத்து, நவீனத் தமிழிலும் இயல்பாக உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயர். பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: நோவாவைப் பற்றிய தேவனுடைய மனப்பாங்கைக் குறிக்கும் חֵן என்பதன் மொழிபெயர்ப்பு
  choice: தயவு
  alternative: அருள்
  rationale: ‘தயவு’ என்பது இவ்வசனத்தின் எபிரெய மொழிப்பாங்கையும் தேவனுடைய சாதகமான மனப்பாங்கையும் தெரிவிக்கிறது; அதேவேளையில், சொல்லை ஒரு பிற்காலக் கோட்பாட்டு வரையறைக்குள் தேவையின்றி சுருக்குவதில்லை.
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூல உரையில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூல ஆதாரத்துக்கு நெருக்கமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதும் கண்ணியமானதுமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மொழிப்பாங்கின் பொருளை இயல்பாகக் கூற ‘கண்களில்’ என்பதற்குப் பதிலாக ‘பார்வையில்’ பயன்படுத்தப்பட்டது; வாக்கியத்தின் சூழல் முரண்பாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது.
