  text: וַ/יֹּ֣אמֶר יְהוָ֗ה אֶמְחֶ֨ה אֶת הָ/אָדָ֤ם אֲשֶׁר בָּרָ֨אתִי֙ מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה מֵֽ/אָדָם֙ עַד בְּהֵמָ֔ה עַד רֶ֖מֶשׂ וְ/עַד ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י נִחַ֖מְתִּי כִּ֥י עֲשִׂיתִֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/007.yaml
  text: So Yahweh said[a], “I will blot out man, whom I have created[c], from the face of the ground—from man to livestock to creeping things and to the birds of the heavens—for I regret that I have made them[b].”
translation:
  language: ta
  text: அப்போது யாவே, “நான் படைத்த மனிதனை[a] நிலத்தின் மேற்பரப்பிலிருந்து துடைத்தழிப்பேன்—மனிதன் முதல் கால்நடைகள், ஊர்ந்து செல்லும் உயிரினங்கள், வானத்துப் பறவைகள்[c] வரை அனைத்தையும் அழிப்பேன்—ஏனெனில் அவர்களைப் படைத்ததற்காக நான் வருந்துகிறேன்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மனிதகுலத்தை’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் אָדָם (ஆதாம்) என்பது மனிதகுலத்தைத் தொகுப்பாகக் குறிக்கக்கூடும்; இங்கு ‘மனிதனை’ என்பது பிரதிநிதித்துவ ஒருமையையும் அடுத்து வரும் அதே சொல்லின் மீளுருவாக்கத்தையும் காக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர்களைப் படைத்ததை எண்ணி நான் துயரப்படுகிறேன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய נחם என்பதன் Niphal வடிவம் முன்பு செய்த செயலைப் பற்றிய வருத்தத்தையோ துயரத்தையோ தெரிவிக்கிறது; கடவுள் வியப்படைந்தார், முன்கூட்டியே அறியவில்லை, அல்லது ஒழுக்கத் தவறு செய்தார் என்று அந்தச் சொல் தன்னளவில் கூறுவதில்லை.
    reason: alternative_reading
  - marker: c
    text: சொல்லுக்குச் சொல், ‘வானங்களின் பறவைகள்’; தமிழில் ‘வானத்துப் பறவைகள்’ என்று இயல்பாக வழங்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரை ‘யாவே’ என்று ஒலிபெயர்த்து, பொதுப்பட்டப் பெயரால் மாற்றாமல் பாதுகாக்கிறது.
- source_word: אֶמְחֶה
  choice: துடைத்தழிப்பேன்
  rationale: מחה என்பதிலுள்ள ஒரு பரப்பிலிருந்து துடைத்து நீக்கும் வலுவான உருவகத்தையும், இச்சூழலில் அதன் முழுமையான அழிவு என்னும் பொருளையும் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: הָאָדָם
  choice: மனிதனை
  rationale: இங்கு אָדָם மனிதகுலத்தைத் தொகுப்பாகக் குறிக்கிறது. ஒருமை வடிவம் எபிரெய மூலத்தின் பிரதிநிதித்துவத் தன்மையையும், அடுத்து வரும் ‘மனிதன் முதல்’ என்ற சொல் மீளுருவாக்கத்தையும் காக்கிறது.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: நிலப்பரப்பிலிருந்து
  rationale: ‘நிலத்தின் முகத்திலிருந்து’ என்ற எபிரெய மரபுத்தொடரின் காட்சியை இயல்பான நவீனத் தமிழில் வழங்குகிறது; אֲדָמָה என்பதன் ‘நிலம்/தரை’ சார்ந்த பொருளையும் காக்கிறது.
- source_word: בְּהֵמָה
  choice: கால்நடைகள்
  rationale: இந்தப் படைப்புப் பட்டியலில் בְּהֵמָה குறிக்கும் நிலவாழ் பெரிய அல்லது வளர்ப்பு விலங்குகளுக்கு இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: רֶמֶשׂ
  choice: ஊர்ந்து செல்லும் உயிரினங்கள்
  rationale: רֶמֶשׂ என்பதன் பரந்த வகைப்பாட்டுப் பொருளை வெறும் ‘பூச்சிகள்’ என்று குறுக்காமல் தெரிவிக்கிறது.
- source_word: עוֹף הַשָּׁמַיִם
  choice: வானத்துப் பறவைகள்
  rationale: ‘வானங்களின் பறவை’ என்ற எபிரெய இணைப்பை இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: נִחַמְתִּי
  choice: நான் வருந்துகிறேன்
  rationale: முன்பு செய்த செயலை நோக்கிய ஆழ்ந்த வருத்தம் அல்லது துயரத்தைத் தெரிவிக்கும் Niphal வடிவத்தின் பதற்றத்தைத் தணிக்காமல் வழங்குகிறது.
- source_word: כִּי עֲשִׂיתִם
  choice: அவர்களைப் படைத்ததற்காக
  rationale: பின்னொட்டின் பன்மையை முன்பு குறிப்பிடப்பட்ட படைக்கப்பட்ட உயிர்களோடு இணைக்கிறது; இச்சூழலில் עשה என்பதைக் ‘படைத்தல்’ என்று இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: נִחַמְתִּי என்பதில் கடவுளுக்குக் கூறப்படும் வருத்தம்
  choice: ஏனெனில் அவர்களைப் படைத்ததற்காக நான் வருந்துகிறேன்
  alternative: ஏனெனில் அவர்களைப் படைத்ததை எண்ணி நான் துயரப்படுகிறேன்
  rationale: மூலம் கடவுளின் முந்தைய செயலை நோக்கிய வருத்தத்தை நேரடியாகக் கூறுகிறது. இந்த இறையியல் பதற்றத்தை மொழிபெயர்ப்பு அகற்றவில்லை; அதேவேளையில், கடவுள் வியப்படைந்தார், முன்கூட்டியே அறியவில்லை, அல்லது ஒழுக்கத் தவறு செய்தார் என்ற கூடுதல் கருத்துகளையும் வினைச்சொல்லுக்குள் புகுத்தவில்லை.
- issue: הָאָדָם என்பதன் தொகுப்புப் பொருள்
  choice: மனிதனை
  alternative: மனிதகுலத்தை
  rationale: இங்கு ஒரே தனிமனிதன் அல்ல, மனிதகுலம் தொகுப்பாகக் குறிக்கப்படுகிறது. இருப்பினும், எபிரெய ஒருமை வடிவத்தையும் அடுத்த சொற்றொடரில் அதே சொல்லின் மீளுருவாக்கத்தையும் காக்க ‘மனிதனை’ பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘துடைத்தழிப்பேன்’ மூலம் மூலத்தின் தெளிவான துடைத்துநீக்கும் உருவகம் பாதுகாக்கப்படுகிறது; பட்டியலின் படிநிலை அமைப்பைத் தமிழில் தெளிவாக்க ‘அனைத்தையும் அழிப்பேன்’ சேர்க்கப்பட்டுள்ளது.
