translation:
  language: ta
  text: 'நோவா மூன்று மகன்களைப் பெற்றான்: சேம், காம், யாப்பேத்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: ילד என்பதன் ஹிஃபில் தொடர்-கதை வடிவம், ஆண் பெற்றோராகப் பிள்ளைகளைப் பெறுவதைக் குறிக்கிறது. தமிழில் ‘மகன்களைப் பெற்றான்’ என்பது இயல்பாகவும் தந்தை என்ற பொருளைச் சூழலுடன் தெளிவாகவும் தருகிறது; ‘பெறச் செய்தான்’ என்பது அளவுக்கு மீறிய சொற்படியானதும் இயல்பற்றதும் ஆகும்.
- source_word: שְׁלֹשָׁה בָנִים
  choice: மூன்று மகன்களை
  rationale: בָנִים என்பது இங்கு பொதுவான ‘பிள்ளைகள்’ என்பதல்ல, குறிப்பாக ‘மகன்கள்’ என்பதாகும்; பின்னர் மூன்று ஆண் சந்ததியினரின் பெயர்களும் தரப்படுகின்றன.
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: சேம், காம், யாப்பேத்
  rationale: אֶת என்பது நேரடி செயப்படுபொருள் குறியீடு; தமிழில் பெயர்ப்பட்டியலுக்கு முன் வரும் ‘மகன்களை’ என்பதிலுள்ள வேற்றுமை உருபே உறவைத் தெளிவாக்குவதால், ஒவ்வொரு பெயரிலும் அதை மீண்டும் கூறத் தேவையில்லை. பெயர்கள் தமிழில் வழக்கமான வேதாகம வடிவங்களில் ஒலிபெயர்க்கப்பட்டன.
- source_word: נֹחַ
  choice: நோவா
  rationale: நֹחַ என்ற ஆள்பெயரின் தமிழில் நிலைபெற்ற, பரவலாக அறியப்பட்ட வடிவம்.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, சுருக்கமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பெற்றான்’ என்பது தமிழில் ஆண் எழுவாயுடனும் ‘மகன்கள்’ என்ற செயப்படுபொருளுடனும் தந்தையான உறவை இயல்பாக வெளிப்படுத்துகிறது. எபிரெய மூலத்தில் தனிப் பொருள் வேறுபாட்டைத் தேவைப்படுத்தும் தெளிவின்மை இல்லாததால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
