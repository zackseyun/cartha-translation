revisions:
- from: மாம்சமான அனைத்திலும்[b] உயிருள்ள ஒவ்வொன்றிலிருந்தும்[a], ஒவ்வொரு வகையில் இரண்டை நீ பேழைக்குள் கொண்டுவர வேண்டும்; அவை உன்னோடு உயிருடன் இருக்கும்படி கொண்டுவா. அவை ஆணும் பெண்ணுமாக இருக்க வேண்டும்.
  to: எல்லா மாம்சத்திலுமுள்ள[b] ஒவ்வொரு உயிரினத்திலிருந்தும்[a] இரண்டை, அவற்றை உன்னுடன் உயிரோடு காக்கும்படி, நீ பேழைக்குள் கொண்டுவர வேண்டும்; அவை ஆணும் பெண்ணுமாக இருக்க வேண்டும்.
  rationale: The revision preserves the Hebrew distributive construction (‘from every living thing of all flesh’), the single directive to bring two of each into the ark, and the explicit purpose of preserving them alive with Noah. It removes duplicated wording and improves modern Tamil flow without adding interpretive categories such as species or kinds.
