base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/019.yaml
  text: And from every living thing of all flesh[a], you shall bring two of each into the ark to keep them alive with you[b]; they shall be male and female.
translation:
  language: ta
  text: எல்லா மாம்சத்திலுமுள்ள[b] ஒவ்வொரு உயிரினத்திலிருந்தும்[a] இரண்டை, அவற்றை உன்னுடன் உயிரோடு காக்கும்படி, நீ பேழைக்குள் கொண்டுவர வேண்டும்; அவை ஆணும் பெண்ணுமாக இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உயிரினம்’ என்பதை ‘உயிருள்ள ஒன்று’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘எல்லா மாம்சமும்’; இது உடலுடைய உயிரினங்கள் அனைத்தையும் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִכָּל הַחַי מִכָּל בָּשָׂר
  choice: மாம்சமான அனைத்திலும் உயிருள்ள ஒவ்வொன்றிலிருந்தும்
  rationale: எபிரெயச் சொற்றொடரின் பரந்த பொருளையும் ‘எல்லா மாம்சமும்’ என்ற அதன் தனித்துவமான மொழிநடையையும் காக்கிறது; அதேவேளையில் தமிழில் பகிர்ந்தெடுக்கும் பொருள் தெளிவாகிறது.
- source_word: שְׁנַיִם מִכֹּל
  choice: ஒவ்வொரு வகையில் இரண்டை
  rationale: ஒவ்வொரு பிரிவிலிருந்தும் ஒரு ஜோடி என்ற பகிர்ந்தெடுக்கும் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தில் இல்லாத ‘வகை’ என்பது தமிழில் பொருளைத் தெளிவாக்கும் குறைந்தபட்ச நிரப்புச்சொல்.
- source_word: תָּבִיא אֶל הַתֵּבָה
  choice: நீ பேழைக்குள் கொண்டுவர வேண்டும்
  rationale: அறிவுறுத்தலின் கட்டாயத் தொனியையும் பேழையின் உள்ளே கொண்டுசெல்லும் இயக்கத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: לְהַחֲיֹת אִתָּךְ
  choice: அவை உன்னோடு உயிருடன் இருக்கும்படி கொண்டுவா
  rationale: ஹிஃபில் வினைவடிவின் ‘உயிரோடு காத்தல்’ என்ற காரணப்பொருளையும் நோக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: זָכָר וּנְקֵבָה יִהְיוּ
  choice: அவை ஆணும் பெண்ணுமாக இருக்க வேண்டும்
  rationale: உயிரினங்களின் பாலைக் குறிக்கும் மூலச்சொற்களையும் அறிவுறுத்தலின் வலிமையையும் நேரடியாகக் காக்கிறது.
