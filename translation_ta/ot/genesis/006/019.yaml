translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘பேழை’ என்ற நிலைபெற்ற வேதாகமச் சொல் தக்கவைக்கப்பட்டுள்ளது; ‘மாம்சமான அனைத்தும்’ என்ற மூலத்தின் பரந்த மொழிநடை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
