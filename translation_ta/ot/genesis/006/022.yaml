  text: וַ/יַּ֖עַשׂ נֹ֑חַ כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֥ה אֹת֛/וֹ אֱלֹהִ֖ים כֵּ֥ן עָשָֽׂה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/022.yaml
  text: Thus Noah did[a]; according to all that God commanded him[b], so he did.
translation:
  language: ta
  text: நோவா இவ்வாறு செய்தார்[a]; கடவுள் அவருக்குக் கட்டளையிட்ட எல்லாவற்றின்படியும் அவர் அப்படியே செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் ‘செய்தார்’ என்ற வினை வலியுறுத்தலுக்காக இருமுறை வருகிறது: ‘நோவா செய்தார் ... அப்படியே செய்தார்.’ முதல் கூறை ‘நோவா இதைச் செய்தார்’ என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தார்
  rationale: עשה என்பது ‘செய்/உருவாக்கு’ என்ற பரந்த பொருளுடைய வினை. முந்தைய கட்டளைகளுக்கு நோவா கீழ்ப்படிந்து செயல்பட்டதை இங்கு சுருக்குவதால் ‘செய்தார்’ என்பது பொருத்தமானது.
- source_word: נֹחַ
  choice: நோவா
  rationale: எபிரெயத் தனிப்பெயரான נֹחַ என்பதற்குத் தமிழில் வழக்கிலுள்ள வடிவம்.
- source_word: כְּכֹל אֲשֶׁר
  choice: அனைத்தின்படியும்
  rationale: கட்டளையிடப்பட்ட அனைத்திற்கும் முழுமையாக ஒத்தபடி செய்தார் என்ற ஒப்புமையையும் முழுமையையும் சுருக்கமாகக் காட்டுகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: צוה அதிகாரபூர்வமான கட்டளையைக் குறிக்கிறது; ஆகவே ‘அறிவுறுத்திய’ என்பதைவிட ‘கட்டளையிட்ட’ மூலத்தின் வலிமையைத் தக்கவைக்கிறது.
- source_word: אֹתוֹ
  choice: அவருக்கு
  rationale: நோவாவை நேரடி செயப்படுபொருளாகக் குறிக்கும் எபிரெய அமைப்பு தமிழில் ‘அவருக்குக் கட்டளையிட்ட’ என்று இயல்பாக வெளிப்படுகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும் இங்கு ஒருமை வினையுடன் வந்து ஒரே கடவுளைக் குறிக்கிறது.
- source_word: כֵּן
  choice: அப்படியே
  rationale: முன்னர் கூறப்பட்ட கட்டளைகளோடு நோவாவின் செயல் சரியாக ஒத்திருந்ததை வலியுறுத்துகிறது.
- source_word: עָשָׂה
  choice: செய்தார்
  rationale: வசனத்தின் இறுதியில் עשה மீண்டும் வருவதைத் தக்கவைத்து நோவாவின் கீழ்ப்படிதலுக்கு மூலவாசகம் தரும் அழுத்தத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: கீழ்ப்படிதலை வலியுறுத்தும் עשה வினையின் இருமுறை பயன்பாடு
  choice: ‘செய்தார் ... அப்படியே செய்தார்’ என இரண்டு கூறுகளையும் தக்கவைத்தல்
  alternative: ‘கடவுள் கட்டளையிட்ட அனைத்தையும் நோவா செய்தார்’ என ஒரே கூறாகச் சுருக்குதல்
  rationale: ஒரே கூறாகச் சுருக்குவது கருத்தை வழங்கினாலும், எபிரெய மூலத்தில் திட்டமிட்டு இடம்பெறும் வினை மறுபயன்பாட்டையும் அதன் வலியுறுத்தலையும் நீக்கிவிடும். இரு கூறுகளையும் வைத்திருப்பது கூடுதல் இறையியல் விளக்கத்தைச் சேர்க்காமல் மூலத்தின் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘இவ்வாறு ... அப்படியே’ என்ற அமைப்பு தமிழில் சற்றே வலியுறுத்தலாக ஒலித்தாலும், மூல எபிரெயத்தின் திட்டமிட்ட மறுபயன்பாட்டைத் தக்கவைக்கிறது; நோவாவைக் குறிக்க மரியாதைப் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
