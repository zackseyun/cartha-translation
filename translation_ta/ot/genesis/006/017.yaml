  source_fidelity: 'வரைவின் ஒட்டுமொத்தப் பொருள் எபிரெய மூலத்துக்கு உண்மையாக உள்ளது: வலியுறுத்தப்பட்ட முதல் நபர், வெள்ளநீர், அழிவின் நோக்கம், வானத்தின் கீழுள்ள உயிர்மூச்சுடைய உயிர்கள், மற்றும் பூமியிலுள்ளவற்றின் மரணம் ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் “மாம்சமான அனைத்தும்” தமிழில் இயல்பாக உயிருள்ள படைப்புகளைக் குறிக்கவில்லை; அது உடற்பொருள் அல்லது மாம்சப் பொருள் என்ற தவறான புரிதலைத் தரலாம்.'
  naturalness: “மாம்சமான அனைத்தையும்” என்ற தொடர் நவீனத் தரத் தமிழில் செயற்கையானது. “உயிர்மூச்சுள்ள எல்லா உயிரினங்களையும்” என்பது வாக்கியத்தை இயல்பாக்கி, இச்சூழலில் כָּל־בָּשָׂר குறிக்கும் உயிருள்ள படைப்புகளின் பரப்பைத் தெளிவாகத் தருகிறது. “பெருவெள்ள நீரைக்” என்பது “பெருவெள்ளத்தின் நீரைக்” என்பதைக் காட்டிலும் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
