base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/017.yaml
  text: And I—behold[a], I am bringing the flood of waters upon the earth to destroy all flesh in which is the breath of life from under heaven. Everything that is on the earth will perish.
translation:
  language: ta
  text: நானோ, இதோ, வானத்தின் கீழே உயிர்மூச்சுள்ள எல்லா உயிரினங்களையும் அழிப்பதற்காகப் பூமியின்மேல் பெருவெள்ள நீரைக் கொண்டுவருகிறேன். பூமியில் உள்ள அனைத்தும் மாண்டுபோகும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי הִנְנִי
  choice: நானோ, இதோ
  rationale: தனிப்பட்ட சுட்டுப்பெயரின் வலியுறுத்தலையும், הִנְנִי தரும் கவன ஈர்ப்பு மற்றும் உடனடித் தன்மையையும் இயல்பான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: מֵבִיא
  choice: கொண்டுவருகிறேன்
  rationale: எபிரெயப் பங்கேற்புவினை காட்டும் நெருங்கிய அல்லது நிகழவிருக்கும் செயலை, கூடுதல் விளக்கம் சேர்க்காமல் பிரதிபலிக்கிறது.
- source_word: הַמַּבּוּל מַיִם
  choice: பெருவெள்ளத்தின் நீர்
  rationale: מַבּוּל குறிக்கும் தனிச்சிறப்பான பெருவெள்ளத்தையும், מַיִם எனும் ‘நீர்’ என்ற சொல்லையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: עַל הָאָרֶץ
  choice: பூமியின்மேல்
  rationale: இப்பகுதியின் விரிவான அழிவு நோக்குக்கு ஏற்றவாறு הָאָרֶץ என்பதை ‘பூமி’ என மொழிபெயர்க்கிறது.
- source_word: לְשַׁחֵת
  choice: அழிப்பதற்காக
  rationale: לְ முன்னொட்டுடன் வரும் வினையெச்சத்தின் நோக்கப் பொருளை நேரடியாகத் தெரிவிக்கிறது.
- source_word: כָּל בָּשָׂר
  choice: மாம்சமான அனைத்தையும்
  rationale: ‘எல்லா மாம்சமும்’ என்ற முக்கிய எபிரெயச் சொல்லாட்சியின் பரந்த குறிப்பைத் தக்கவைத்து, அதை உயிரினங்கள் என்ற ஒரே விளக்கத்துக்குள் குறுக்காமல் விடுகிறது.
- source_word: אֲשֶׁר בּוֹ רוּחַ חַיִּים
  choice: உயிர்மூச்சு உள்ள
  rationale: வெள்ளச் சூழலில் רוּחַ என்பது உயிரூட்டும் மூச்சை இயல்பாகக் குறிக்கிறது; அதன் ‘ஆவி’ என்ற சாத்தியத்தைக் குறிப்பில் பாதுகாக்கிறது.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: வானத்தின் கீழே
  rationale: வானின் கீழுள்ள முழு உலகப் பரப்பைக் குறிக்கும் எபிரெய மரபுத்தொடரைத் தெளிவாக வழங்குகிறது.
- source_word: כֹּל אֲשֶׁר בָּאָרֶץ
  choice: பூமியில் உள்ள அனைத்தும்
  rationale: தீர்ப்பின் முழுமையான பரப்பை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יִגְוָע
  choice: மாண்டுபோகும்
  rationale: மூச்சடங்கி இறப்பதைக் குறிக்கும் வினையின் கடுமையையும் தீர்ப்பறிவிப்பின் கண்ணியமான தொனியையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: רוּחַ חַיִּים என்பதிலுள்ள רוּחַ சொல்லின் பொருள்
  choice: உயிர்மூச்சு
  alternative: உயிரின் ஆவி
  rationale: வெள்ளச் சூழலிலும் ஆதியாகமத்தின் படைப்புச் சொல்லாட்சியிலும் இது உயிரினங்களை உயிரோடு வைத்திருக்கும் மூச்சைக் குறிப்பது இயல்பானது. இருப்பினும் ‘ஆவி’ என்ற உண்மையான சொற்பொருள் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: כָּל בָּשָׂר என்பதன் பரப்பு
  choice: மாம்சமான அனைத்தும்
  alternative: எல்லா உயிரினங்களும்
  rationale: மனிதர் மற்றும் விலங்குகள் உள்ளிட்ட உடலுள்ள உயிர்களைக் குறிக்கும் பரந்த வேதாகமச் சொல்லாட்சியைத் தக்கவைத்து, மொழிபெயர்ப்பிலேயே அதன் குறிப்பை தேவையின்றி குறுக்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான தீர்ப்பறிவிப்புத் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘இதோ,’ ‘மாம்சமான அனைத்தும்,’ ‘மாண்டுபோகும்’ ஆகியவை மூலத்தின் வலியுறுத்தலையும் வேதாகமச் சொல்லாட்சியையும் காக்கின்றன; வாக்கிய அமைப்பு சாதாரண வாசகருக்கும் புரியுமாறு வைக்கப்பட்டுள்ளது.
