- from: நானோ, இதோ, வானத்தின் கீழே உயிர்மூச்சு[a] உள்ள மாம்சமான அனைத்தையும் அழிப்பதற்காகப் பூமியின்மேல் பெருவெள்ளத்தின் நீரைக் கொண்டுவருகிறேன். பூமியில் உள்ள அனைத்தும் மாண்டுபோகும்.
  to: நானோ, இதோ, வானத்தின் கீழே உயிர்மூச்சுள்ள எல்லா உயிரினங்களையும் அழிப்பதற்காகப் பூமியின்மேல் பெருவெள்ள நீரைக் கொண்டுவருகிறேன். பூமியில் உள்ள அனைத்தும் மாண்டுபோகும்.
  rationale: திருத்தம் தமிழில் தவறாகப் புரியக்கூடிய “மாம்சமான அனைத்தும்” என்பதை, இவ்வசனத்தின் உயிர்மூச்சு என்ற வரையறையுடன் பொருந்தும் “உயிர்மூச்சுள்ள எல்லா உயிரினங்களும்” என மாற்றுகிறது. இதனால் மனிதர், விலங்குகள் உள்ளிட்ட “எல்லா மாம்சம்” என்ற மூலத்தின் சூழல்சார் பரப்பு பாதுகாக்கப்படுகிறது; எந்தக் கோட்பாட்டுச் சேர்க்கையும் இல்லை. அடிக்குறிப்பு a அதே சொல்லிலேயே நிலைநிறுத்தப்பட்டுள்ளது.
