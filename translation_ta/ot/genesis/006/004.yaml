    rationale: וְיָלְדוּ என்பது இலக்கணத்திலும் பொருளிலும் மனிதரின் மகள்களைக் குறிக்கிறது. தமிழில் உள்ள ‘அவர்கள்’ தேவனின் மகன்களையும் சுட்டக்கூடியதால், பொருள் மாறும் வாய்ப்பு உண்டு.
  revised_text: அந்நாட்களிலும், அதற்குப் பின்னரும், தேவனின் மகன்கள்[b] மனிதரின் மகள்களுடன்[c] உறவுகொண்டபோது நெபிலிம்கள்[a] பூமியில் இருந்தார்கள். அந்த மகள்கள் அவர்களுக்குப் பிள்ளைகளைப் பெற்றார்கள். அவர்களே பண்டைக்காலத்தின் வல்லவர்கள், புகழ்பெற்ற மனிதர்கள்.
