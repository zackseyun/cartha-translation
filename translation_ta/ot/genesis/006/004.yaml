  text: הַ/נְּפִלִ֞ים הָי֣וּ בָ/אָרֶץ֮ בַּ/יָּמִ֣ים הָ/הֵם֒ וְ/גַ֣ם אַֽחֲרֵי כֵ֗ן אֲשֶׁ֨ר יָבֹ֜אוּ בְּנֵ֤י הָֽ/אֱלֹהִים֙ אֶל בְּנ֣וֹת הָֽ/אָדָ֔ם וְ/יָלְד֖וּ לָ/הֶ֑ם הֵ֧מָּה הַ/גִּבֹּרִ֛ים אֲשֶׁ֥ר מֵ/עוֹלָ֖ם אַנְשֵׁ֥י הַ/שֵּֽׁם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/004.yaml
  text: The Nephilim were on the earth in those days—and also afterward—when the sons of God came in to the daughters of man[a], and they bore children to them. Those were the mighty men who were of old[c][b], men of renown.
translation:
  language: ta
  text: அந்நாட்களிலும், அதற்குப் பின்னரும், தேவனின் மகன்கள்[b] மனிதரின் மகள்களுடன்[c] உறவுகொண்டபோது நெபிலிம்கள்[a] பூமியில் இருந்தார்கள். அந்த மகள்கள் அவர்களுக்குப் பிள்ளைகளைப் பெற்றார்கள். அவர்களே பண்டைக்காலத்தின் வல்லவர்கள், புகழ்பெற்ற மனிதர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நெபிலிம்கள்’ என்பது அரிதாக வரும் எபிரெயச் சொல்; அதன் துல்லியமான பொருள் உறுதியற்றது. பாரம்பரியமாக ‘ராட்சதர்கள்’ என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: ‘தேவனின் மகன்கள்’ என்பதை ‘தெய்வீக உயிர்கள்’ என்றும் புரிந்துகொள்ளலாம்; வேறு விளக்கங்களில் இது மனித ஆட்சியாளர்களையோ சேத்தின் வழிவந்த பக்தியுள்ளவர்களையோ குறிக்கிறது.
    reason: alternative_reading
  - marker: c
    text: ‘மனிதரின் மகள்கள்’ என்பதில் ‘மனிதர்’ என்பது மனிதகுலத்தைக் கூட்டாகக் குறிக்கிறது; அதாவது மனிதப் பெண்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִלִים
  choice: நெபிலிம்கள்
  rationale: இந்த அரிய எபிரெயச் சொல்லின் துல்லியமான பொருள் உறுதியற்றது. ‘ராட்சதர்கள்’ அல்லது ‘விழுந்தவர்கள்’ என்று மொழிபெயர்ப்பது விவாதத்துக்குரிய ஒரு விளக்கத்தை மூலவசனத்திற்குள் கொண்டுவரும் என்பதால் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: בָאָרֶץ
  choice: பூமியில்
  rationale: ஆதியாகமத்தின் ஆதிக்கால வரலாற்றுச் சூழலில் பரந்த பொருளுடைய ‘பூமி’ இயல்பானது; ‘நாட்டில்’ என்பதும் சொல்லளவில் சாத்தியம்.
- source_word: וְגַם אַחֲרֵי כֵן
  choice: அதற்குப் பின்னரும்
  rationale: וְגַם என்பதன் சேர்க்கைப் பொருளையும் אַחֲרֵי כֵן என்பதன் காலப் பொருளையும் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: אֲשֶׁר יָבֹאוּ
  choice: எப்போதெல்லாம் உறவுகொண்டார்களோ
  rationale: இங்கு வரும் வினை வடிவம் மீண்டும் மீண்டும் நிகழ்ந்த சூழலைக் குறிக்கக்கூடும். ‘உள்ளே சென்றார்கள்’ என்ற எபிரெய மரபுத்தொடரின் பாலுறவுப் பொருளை நவீன தமிழில் கண்ணியமாகத் தெரிவிக்க ‘உறவுகொண்டார்கள்’ பயன்படுத்தப்பட்டது.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: தேவனின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடருக்கு நெருக்கமாக இருந்து, அது விண்ணுலக உயிர்களையா, ஆட்சியாளர்களையா, அல்லது பக்தியுள்ள மனித மரபினரையா குறிக்கிறது என்ற விவாதத்தைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: בְּנוֹת הָאָדָם
  choice: மனிதரின் மகள்கள்
  rationale: אָדָם இங்கு மனிதகுலத்தைக் கூட்டாகக் குறிக்கிறது. தமிழில் இயல்பாகவும் மூலத்தின் ஒருமைக் கூட்டுப்பொருளை நெருக்கமாகவும் தரும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: וְיָלְדוּ לָהֶם
  choice: அவர்கள் இவர்களுக்குப் பிள்ளைகளைப் பெற்றார்கள்
  rationale: எபிரெயத்தில் உட்குறிப்பாக உள்ள ‘பிள்ளைகள்’ என்பதை தமிழின் தெளிவுக்காக வெளிப்படுத்தி, ‘அவர்களுக்குப் பெற்றார்கள்’ என்ற தொடர்பையும் காக்கிறது.
- source_word: הַגִּבֹּרִים
  choice: வல்லவர்கள்
  rationale: இச்சொல் உடல் வலிமை, ஆற்றல் அல்லது வீரச் சிறப்பு ஆகிய பரந்த பொருட்களைக் கொண்டிருக்கலாம். ‘போர்வீரர்கள்’ அல்லது ‘வீரநாயகர்கள்’ என்று குறுக்காமல் ‘வல்லவர்கள்’ பயன்படுத்தப்பட்டது.
- source_word: מֵעוֹלָם
  choice: பழங்காலத்து
  rationale: இச்சூழலில் தொன்மையான காலத்தைச் சுட்டும் சொல்லுக்கு இயல்பான தமிழாக்கம்.
- source_word: אַנְשֵׁי הַשֵּׁם
  choice: பெயர்பெற்ற மனிதர்கள்
  rationale: சொற்படியாக ‘பெயருடைய மனிதர்கள்’ என்றாலும், புகழும் நற்பெயரும் பெற்றவர்களைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: ‘தேவனின் மகன்கள்’ என்பவர்களின் அடையாளம்
  choice: ‘தேவனின் மகன்கள்’ என்ற மூலத்திற்கு நெருக்கமான சொற்றொடரைத் தக்கவைத்தல்
  alternative: தெய்வீக உயிர்கள்; மனித ஆட்சியாளர்கள்; சேத்தின் பக்தியுள்ள வழிமரபினர்
  rationale: இச்சூழலில் அந்த அடையாளம் விவாதத்திற்குரியது. மொழிபெயர்ப்பு எந்த ஒரு இறையியல் விளக்கத்தையும் வசனத்திற்குள் கட்டாயமாகச் சேர்க்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: הַנְּפִלִים என்பதன் பொருள்
  choice: ‘நெபிலிம்கள்’ என்று ஒலிபெயர்த்தல்
  alternative: ராட்சதர்கள்; விழுந்தவர்கள்
  rationale: சொல்லின் துல்லியமான பொருளும் சொற்பிறப்பும் உறுதியற்றவை. ஒலிபெயர்ப்பு பாரம்பரிய விளக்கங்களில் ஒன்றைத் தீர்மானமாக ஏற்காமல் விடுகிறது.
- issue: אָדם என்பதன் கூட்டுப்பொருள்
  choice: ‘மனிதரின் மகள்கள்’ என்று வழங்குதல்
  alternative: மனிதகுலத்தின் பெண்கள்; மனிதர்களின் மகள்கள்
  rationale: இங்கு אָדָם தனி ஆணை அல்ல, மனிதகுலத்தைக் கூட்டாகக் குறிக்கிறது. முதன்மை உரை எபிரெய வடிவத்துக்கு நெருக்கமாக இருக்க, அடிக்குறிப்பு அதன் உள்ளடக்கிய பொருளை விளக்குகிறது.
- issue: நெபிலிம்களுக்கும் பிறந்த பிள்ளைகளுக்கும் உள்ள தொடர்பு
  choice: வசனத்தின் இலக்கணத் தொடர்பை அப்படியே திறந்த நிலையில் வைத்தல்
  alternative: நெபிலிம்களே அந்தப் பிள்ளைகள் என்று வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: எபிரெய வசனம் நெபிலிம்கள் இருந்ததாக முதலில் கூறி, பின்னர் பிறந்தவர்களை வல்லவர்கள் என அடையாளப்படுத்துகிறது; இரு குழுக்களும் முற்றிலும் ஒன்றே என்று மொழிபெயர்ப்பில் கூடுதலாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வேதாகம நடையுடன் எழுதப்பட்டது. அரிதான பெயர் ஒலிபெயர்க்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. பாலுறவைக் குறிக்கும் எபிரெய மரபுத்தொடர் வெளிப்படையான அசட்டுத்தன்மையின்றி ‘உறவுகொண்டார்கள்’ எனத் தெளிவாக வழங்கப்பட்டது; விவாதத்திற்குரிய அடையாளங்களும் தொடர்புகளும் தீர்மானிக்கப்படாமல் பாதுகாக்கப்பட்டன.
