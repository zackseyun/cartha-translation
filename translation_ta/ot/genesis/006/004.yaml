  source_fidelity: திருத்தம் தேவை. אֲשֶׁר יָבֹאוּ என்பதன் சூழல்-காலத் தொடர்பை ‘எப்போதெல்லாம்’ என்று மீள்நிகழ்வாகக் குறிப்பது மூலத்தில் அவசியமில்லை. மேலும், וְיָלְדוּ לָהֶם என்பதில் பிள்ளைகளைப் பெற்றவர்கள் மனிதரின் மகள்களே என்பதைத் தமிழில் வெளிப்படையாக்க வேண்டும்; நடப்பு ‘அவர்கள் இவர்களுக்குப்’ என்ற தொடர் தெளிவற்றது.
  naturalness: நடப்பு உரை பெரும்பாலும் இயல்பானது; ஆனால் ‘அவர்கள் இவர்களுக்குப் பிள்ளைகளைப் பெற்றார்கள்’ என்றது முன்னிலைச் சுட்டுப்பெயர்களால் குழப்பமாகிறது. திருத்தப்பட்ட வடிவம் நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
  terminology: ‘நெபிலிம்கள்’ என்ற ஒலிபெயர்ப்பு, ‘தேவனின் மகன்கள்’ என்ற திறந்த சொற்றொடர், ‘மனிதரின் மகள்கள்’ என்ற கூட்டுப்பொருள், ‘வல்லவர்கள்’, ‘புகழ்பெற்ற மனிதர்கள்’ ஆகியவை மூலத்தின் விவாதத்திற்குரிய மற்றும் உயர்நடைச் சொற்களைச் சரியாகப் பாதுகாக்கின்றன.
