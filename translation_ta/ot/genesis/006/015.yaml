base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/015.yaml
  text: 'And this is how you shall make it: the length of the ark shall be three hundred cubits[a], its width fifty cubits, and its height thirty cubits.'
translation:
  language: ta
  text: 'நீ அதைக் கட்ட வேண்டிய விதம் இதுவே: பேழையின் நீளம் முந்நூறு முழம்[a], அதன் அகலம் ஐம்பது முழம், அதன் உயரம் முப்பது முழம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: முழம் என்பது முழங்கையிலிருந்து விரல் நுனிவரையுள்ள தூரத்தை அடிப்படையாகக் கொண்ட பண்டைய நீள அலகு.
    reason: cultural_note
lexical_decisions:
- source_word: וְזֶה אֲשֶׁר תַּעֲשֶׂה אֹתָהּ
  choice: நீ அதைக் கட்டவேண்டிய விதம் இதுவே
  rationale: சொல்லாட்சிப்படி ‘அதைச் செய்யவேண்டியது இதுவே’ என இருந்தாலும், பேழையின் கட்டுமானச் சூழலில் עשה என்பதன் இயல்பான தமிழ் இணை ‘கட்டு’. எபிரெய வாக்கியத்தின் வழிமுறை கூறும் தன்மையும் கட்டளையின் வலிமையும் இவ்வாறு தெளிவாகின்றன.
- source_word: הַתֵּבָה
  choice: பேழை
  rationale: תֵּבָה என்பது நோவா கட்டும் பெரிய மிதக்கும் கலத்தைக் குறிக்கிறது. தமிழில் வேதாகமச் சூழலில் நிலைபெற்றுள்ள ‘பேழை’ இங்கு பொருத்தமானதும் சுருக்கமானதும் ஆகும்.
- source_word: שְׁלֹשׁ מֵאוֹת אַמָּה
  choice: முந்நூறு முழம்
  rationale: பண்டைய அளவான אַמָּה-வை நவீன அலகாக மாற்றாமல் ‘முழம்’ என்று தக்கவைத்துள்ளது; இதனால் மூல உரையின் வரலாற்றுச் சிறப்புத் தொடர்கிறது.
- source_word: אֹרֶךְ הַתֵּבָה
  choice: பேழையின் நீளம்
  rationale: கட்டுமான அளவைக் குறிக்கும் אֹרֶךְ என்பதற்கு இயல்பான நவீனத் தமிழ் ‘நீளம்’.
- source_word: חֲמִשִּׁים אַמָּה רָחְבָּהּ
  choice: அதன் அகலம் ஐம்பது முழம்
  rationale: רָחְבָּהּ என்பதன் கட்டிடவியல் பொருளை ‘அதன் அகலம்’ இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתָהּ
  choice: அதன் உயரம் முப்பது முழம்
  rationale: קוֹמָה என்பதற்கு இக்கட்டுமானச் சூழலில் ‘உயரம்’ என்பதே பொருத்தமான இணை.
