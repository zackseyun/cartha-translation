source:
  edition: WLC
  text: וְ/אַתָּ֣ה קַח לְ/ךָ֗ מִ/כָּל מַֽאֲכָל֙ אֲשֶׁ֣ר יֵֽאָכֵ֔ל וְ/אָסַפְתָּ֖ אֵלֶ֑י/ךָ וְ/הָיָ֥ה לְ/ךָ֛ וְ/לָ/הֶ֖ם לְ/אָכְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/021.yaml
  text: And you[a], take for yourself some of every kind of food that is edible, and gather it to yourself[b]; and it shall be food for you and for them.
translation:
  language: ta
  text: நீயோ, ஒவ்வொரு வகையான உண்ணத்தக்க[a] உணவிலிருந்தும் கொஞ்சம் உனக்காக எடுத்துக்கொண்டு, அதை உன்னிடம் சேகரித்து வை; அது உனக்கும் அவற்றுக்கும் உணவாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்ணப்படும்” அல்லது “உண்ணக்கூடிய.” எபிரெய உறவுநிலைச் சொற்றொடர் வழக்கமாக உண்ணப்படும் உணவையோ, உண்பதற்கு ஏற்ற உணவையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: நீயோ
  rationale: வாவ் இணைப்பும் வலியுறுத்தப்பட்ட தனிப்பெயரும் நோவாவை முன்னிலைப்படுத்துகின்றன; ‘நீயோ’ அந்த வலியுறுத்தலையும் முந்தைய கட்டளைகளுடனான தொடர்பையும் இயல்பாகக் காட்டுகிறது.
- source_word: קַח לְךָ
  choice: உனக்காக எடுத்துக்கொண்டு
  rationale: לקח என்பதன் நேரடியான கட்டளைப் பொருள் ‘எடு’; לְךָ இங்கு தன்நல/பயன்சார் நுட்பத்தைத் தருவதால் ‘உனக்காக’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִכָּל מַאֲכָל
  choice: எல்லா வகை உணவிலிருந்தும் தேவையானதை
  rationale: מִן + כֹּל முழு உணவையும் எடுத்துக்கொள்ளுமாறு அல்லாமல், உணவுகளின் முழு வரம்பிலிருந்து சேகரிக்குமாறு குறிக்கிறது. தமிழில் அந்தத் தேர்வுப் பொருளை இயல்பாகத் தெரிவிக்க ‘தேவையானதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: உண்ணத்தக்க
  rationale: אכל வினையின் நிஃபால் வடிவம் இங்கு உணவாகப் பயன்படத் தகுந்ததை வகைப்படுத்துகிறது. ‘உண்ணத்தக்க’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது; ‘உண்ணப்படுகிற’ என்ற நேரடியான வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְאָסַפְתָּ אֵלֶיךָ
  choice: அதை உன்னிடம் சேகரித்து வை
  rationale: אָסַף என்பதன் ‘சேகரி’ என்ற பொருளையும் אֵלֶיךָ என்பதன் ‘உன்னிடம்’ என்ற திசை/இடப் பொருளையும் காக்கிறது; ‘வை’ சேமித்து வைத்திருக்கும் நோக்கத்தை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: וְהָיָה לְךָ וְלָהֶם לְאָכְלָה
  choice: அது உனக்கும் அவற்றுக்கும் உணவாக இருக்கும்
  rationale: தொடர்விளைவைக் குறிக்கும் וְהָיָה எதிர்காலமாக மொழிபெயர்க்கப்பட்டுள்ளது. לְךָ וְלָהֶם என்பதில் நோவாவையும் உயிரினங்களையும் வேறுபடுத்த ‘உனக்கும் அவற்றுக்கும்’ பயன்படுத்தப்பட்டுள்ளது; לְאָכְלָה இயல்பாக ‘உணவாக’ எனத் தரப்பட்டுள்ளது.
