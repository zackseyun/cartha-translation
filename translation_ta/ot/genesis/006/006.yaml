source:
  edition: WLC
  text: וַ/יִּנָּ֣חֶם יְהוָ֔ה כִּֽי עָשָׂ֥ה אֶת הָֽ/אָדָ֖ם בָּ/אָ֑רֶץ וַ/יִּתְעַצֵּ֖ב אֶל לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/006.yaml
  text: And Yahweh regretted having made man on the earth[c][b][a], and he was pained in his heart.
translation:
  language: ta
  text: பூமியில் மனிதனை[a] உண்டாக்கியதற்காக யாவே வருந்தினார்[b]; அவர் தம் உள்ளத்தில் வேதனையடைந்தார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘மனிதகுலத்தை’, ‘மனித இனத்தை’. இங்குள்ள எபிரெயச் சொல் ‘ஆதாம்’ (אָדָם), மனித இனத்தைத் தொகுப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘உண்டாக்கியதை எண்ணித் துயரப்பட்டார்’, ‘உண்டாக்கியதற்காக மனம் வருந்தினார்’. எபிரெயத்தில் נחם என்பதன் நிப்ஹால் வடிவம், முன்பு செய்த செயலைக் குறித்த வருத்தத்தை அல்லது துயரத்தை வெளிப்படுத்துகிறது. கடவுள் எதிர்பாராத ஒன்றை அறிந்தார், அவருக்கு முன்னறிவு இல்லை, அல்லது அவர் ஒழுக்கத் தவறு செய்தார் என்று அந்தச் சொல் தன்னிலேயே கூறுவதில்லை.
    reason: lexical_alternative
  - marker: c
    text: சொல்லெழுத்தாக, ‘தமது உள்ளத்திற்கு’.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: வருந்தினார்
  rationale: நிப்ஹால் வடிவிலுள்ள נחם, முன்பு செய்த செயலைக் குறிக்கும் כִּי உட்பொருள் வாக்கியத்துடன் வந்து, அந்தச் செயலைக் குறித்த பின்னோக்கிய வருத்தத்தை அல்லது துயரத்தை வெளிப்படுத்துகிறது. அடுத்து வரும் וַיִּתְעַצֵּב தனியே உள்ளார்ந்த வேதனையைச் சொல்வதால், இரு வினைகளின் வேறுபாட்டைக் காக்க இங்கு ‘வருந்தினார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான יהוה-ஐ அதன் பெயர்த்தன்மையைத் தக்கவைக்கும் வகையில் நவீன தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: כִּי עָשָׂה
  choice: உண்டாக்கியதற்காக
  rationale: כִּי இங்கு வருத்தத்தின் உட்பொருளையும் காரணத்தையும் அறிமுகப்படுத்துகிறது; עָשָׂה மனிதரை முன்பு உண்டாக்கிய செயலைக் குறிக்கிறது. தமிழ் வினைப்பெயர் அமைப்பு இந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָאָדָם
  choice: மனிதனை
  rationale: இங்கு אָדָם தனிநபரான ஆதாமை மட்டும் அல்லாமல் மனித இனத்தைத் தொகுப்பாகக் குறிக்கிறது. ‘மனிதனை’ என்பது மூலத்தின் ஒருமை வடிவத்தையும் பிரதிநிதித்துவப் பொருளையும் காக்கிறது; அதன் தொகுப்புப் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: בָּאָרֶץ
  choice: பூமியில்
  rationale: இந்தச் சூழலில் אֶרֶץ ஒரு குறிப்பிட்ட நாட்டை அல்ல, பூமி அல்லது உலகைக் குறிக்கிறது.
- source_word: וַיִּתְעַצֵּב
  choice: வேதனையடைந்தார்
  rationale: עצב என்பதன் ஹித்பயேல் வடிவம் வெறும் சோகத்தைவிட ஆழமான உள்ளார்ந்த வலியை வெளிப்படுத்துகிறது. ‘வேதனையடைந்தார்’ அந்த வலிமையைத் தக்கவைத்து, முந்தைய ‘வருந்தினார்’ என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: אֶל־לִבּוֹ
  choice: தம் உள்ளத்தில்
  rationale: சொல்லெழுத்தாக ‘தமது உள்ளத்திற்கு’ என இருந்தாலும், இந்த எபிரெயச் சொற்றொடர் ஆழ்ந்த அகநிலை உணர்வைக் குறிக்கிறது. ‘தம் உள்ளத்தில்’ என்பது தமிழில் இயல்பாகவும் மரியாதையாகவும் அதே படிமத்தை எடுத்துரைக்கிறது.
theological_decisions:
- issue: 'கடவுளைப் பற்றிய மனித உணர்வுசார் மொழி: ‘வருந்தினார்’ மற்றும் ‘வேதனையடைந்தார்’'
  choice: யாவே மனிதரை உண்டாக்கியதற்காக வருந்தி, தம் உள்ளத்தில் வேதனையடைந்தார் என்று உரையின் நேரடியான கூற்றைத் தக்கவைத்தல்.
  alternative: ‘யாவே துயரப்பட்டார்’ என்று மட்டும் கூறி பின்னோக்கிய வருத்தத்தின் பொருளை மென்மைப்படுத்துதல்.
  rationale: எபிரெய உரை இரண்டு தனித்த வினைகளால் பின்னோக்கிய வருத்தத்தையும் உள்ளார்ந்த வேதனையையும் கூறுகிறது. இது தெய்வீக முன்னறிவுடன் எவ்வாறு தொடர்புடையது என்பதை வசனம் விளக்கவில்லை; ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் அழுத்தத்தைத் தீர்த்துவிடாமல் காக்கிறது. அதேவேளை, ஆச்சரியம், முன்னறிவின்மை, அல்லது ஒழுக்கத் தவறு ஆகியவற்றை உரையில் சேர்க்கவில்லை.
- issue: הָאָדָם என்பதன் தொகுப்புப் பொருள்
  choice: மூலத்தின் ஒருமை வடிவத்தைப் பின்பற்றி ‘மனிதனை’ என்று கொடுத்து, அது மனித இனத்தைத் தொகுப்பாகக் குறிக்கிறது என்பதை அடிக்குறிப்பில் விளக்குதல்.
  alternative: முதன்மை உரையிலேயே ‘மனிதகுலத்தை’ அல்லது ‘மனித இனத்தை’ என்று மொழிபெயர்த்தல்.
  rationale: சூழல் முழு மனித இனத்தைக் குறித்தாலும், எபிரெயச் சொல்லின் ஒருமை மற்றும் பிரதிநிதித்துவ வடிவம் தமிழில் ‘மனிதனை’ என்பதால் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘யாவே’ தெய்வீகப் பெயரைப் பெயராகவே வழங்குகிறது. ‘வருந்தினார்’ மற்றும் ‘வேதனையடைந்தார்’ என்ற இரு வேறு வினைகள் மூல எபிரெயத்தின் வருத்தம் → உள்ளார்ந்த வலி என்ற இரு அசை அமைப்பைப் பாதுகாக்கின்றன. ‘தம்’ என்பது மரியாதையையும் இயல்பான தமிழ்நடையையும் காக்கிறது.
