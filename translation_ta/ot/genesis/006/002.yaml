revisions:
- from: தேவனுடைய மகன்கள்[a] மனிதனுடைய மகள்கள் அழகாக இருப்பதைக் கண்டு, தாங்கள் தேர்ந்துகொண்டவர்களில் யாரை வேண்டுமானாலும் தங்களுக்கு மனைவிகளாக எடுத்துக்கொண்டார்கள்.
  to: தேவனுடைய மகன்கள்[a] மனிதர்களின் மகள்கள் அழகாக இருந்ததைக் கண்டு, தாங்கள் தேர்ந்துகொண்ட எவரையும் தங்களுக்கு மனைவிகளாக எடுத்துக்கொண்டார்கள்.
  rationale: The revision removes a potentially individualizing Tamil expression for the Hebrew collective/generic “man/humankind,” while retaining the literary contrast and avoiding an interpretive identification of the “sons of God.” It also makes the narrative tense and final selection clause more idiomatic, without changing the verse’s scope or ambiguity.
