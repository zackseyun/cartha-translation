  text: וַ/יִּרְא֤וּ בְנֵי הָֽ/אֱלֹהִים֙ אֶת בְּנ֣וֹת הָֽ/אָדָ֔ם כִּ֥י טֹבֹ֖ת הֵ֑נָּה וַ/יִּקְח֤וּ לָ/הֶם֙ נָשִׁ֔ים מִ/כֹּ֖ל אֲשֶׁ֥ר בָּחָֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/002.yaml
  text: the sons of God saw that the daughters of man were beautiful[b][a], and they took wives for themselves from any they chose.
translation:
  language: ta
  text: தேவனுடைய மகன்கள்[a] மனிதர்களின் மகள்கள் அழகாக இருந்ததைக் கண்டு, தாங்கள் தேர்ந்துகொண்ட எவரையும் தங்களுக்கு மனைவிகளாக எடுத்துக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தெய்வீக உயிர்கள்.’ ‘தேவனுடைய மகன்கள்’ யார் என்பது விவாதத்திற்குரியது. வானுலக உயிர்கள், மனித ஆட்சியாளர்கள் அல்லது உயர்குடியினர், சேத்தின் வழிமரபினர் என்பவை முக்கிய விளக்கங்களில் அடங்கும்.
    reason: alternative_reading
lexical_decisions:
- source_word: בְנֵי הָאֱלֹהִים
  choice: தேவனுடைய மகன்கள்
  rationale: எபிரெயச் சொற்றொடருக்கு வடிவரீதியாக நெருக்கமான இம்மொழிபெயர்ப்பு, குறிப்பிடப்படுபவர்கள் யார் என்ற விவாதத்தைத் தீர்மானிக்காமல் அப்படியே வைத்திருக்கிறது.
- source_word: בְּנוֹת הָאָדָם
  choice: மனிதனுடைய மகள்கள்
  rationale: ‘தேவனுடைய மகன்கள்’ என்பதற்கு இணையான இலக்கிய எதிரமைப்பைப் பேணுவதற்காக, אָדָם என்ற ஒருமைத் தொகுப்புப்பெயர் ‘மனிதன்’ என வழங்கப்படுகிறது.
- source_word: כִּי טֹבֹת הֵנָּה
  choice: அழகாக இருப்பதை
  rationale: இச்சூழலில் טוֹב என்பது அவர்களை மனைவிகளாக எடுத்துக்கொள்வதற்குத் தூண்டிய உடலழகைக் குறிக்கிறது; ‘அழகாக’ என்பது இயல்பான நவீனத் தமிழில் அந்தப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: וַיִּקְחוּ לָהֶם נָשִׁים
  choice: தங்களுக்கு மனைவிகளாக எடுத்துக்கொண்டார்கள்
  rationale: נָשִׁים என்பதன் ‘மனைவிகள்’ என்ற சூழல்சார் பொருளையும், לָהֶם என்பதன் ‘தங்களுக்கு’ என்ற பொருளையும் இவ்வாசகம் பேணுகிறது.
- source_word: מִכֹּל אֲשֶׁר בָּחָרוּ
  choice: தாங்கள் தேர்ந்துகொண்டவர்களில் யாரை வேண்டுமானாலும்
  rationale: מִכֹּל என்பதிலுள்ள கட்டுப்பாடற்ற தெரிவின் பகிர்வுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘தேவனுடைய மகன்கள்’ என்பவர்களின் அடையாளம்
  choice: அவர்கள் யார் என்று வரையறுக்காமல் ‘தேவனுடைய மகன்கள்’ என்ற நேரடியான சொற்றொடரைப் பேணுதல்
  alternative: வானுலக உயிர்கள்; மனித ஆட்சியாளர்கள் அல்லது உயர்குடியினர்; சேத்தின் வழிமரபினர்
  rationale: எபிரெயச் சொற்றொடரின் குறிப்பு விவாதத்திற்குரியது; வசனமே அதைத் தீர்மானிக்கவில்லை. ஆகவே இறையியல் பதற்றத்தையும் உண்மையான தெளிவின்மையையும் மொழிபெயர்ப்பு தீர்த்துவிடாமல் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. மூலத்திலுள்ள இலக்கிய எதிரமைப்பையும் விவாதத்திற்குரிய அடையாளத்தையும் பேணுகிறது; தேவையற்ற சமயப் பிரிவு சார்ந்த விளக்கத்தைச் சேர்க்கவில்லை.
