base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/020.yaml
  text: From the birds according to their kinds[a], and from the livestock according to their kinds, from every creeping thing of the ground according to its kind, two of each will come to you to keep them alive.
translation:
  language: ta
  text: பறவைகளில் தத்தம் இனத்தைச் சேர்ந்தவையும், கால்நடைகளில் தத்தம் இனத்தைச் சேர்ந்தவையும், நிலத்தில் ஊர்ந்து செல்லும் எல்லா உயிரினங்களிலும் தத்தம் இனத்தைச் சேர்ந்தவையும்—ஒவ்வொன்றிலிருந்தும் இரண்டு—அவற்றை உயிரோடு காப்பதற்காக உன்னிடம் வரும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றின் இனங்களின்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעוֹף
  choice: பறவைகள்
  rationale: עוֹף என்பது பறக்கும் உயிரினங்களைக் குறிக்கும்; இங்கு பட்டியலிடப்படும் உயிரின வகைகளின் சூழலில் ‘பறவைகள்’ என்பது இயல்பான நவீனத் தமிழ் சொல்.
- source_word: לְמִינֵהוּ / לְמִינָהּ
  choice: அவற்றின் இனங்களின்படி
  rationale: מִין என்பது உயிரினங்களின் வகை அல்லது இனப் பிரிவைக் குறிக்கிறது. ‘இனங்களின்படி’ என்பது வகைப்படுத்தும் பொருளைக் காக்கிறது; நவீன உயிரியல் வகைப்பாட்டைத் தேவையின்றி உட்புகுத்துவதில்லை.
- source_word: הַבְּהֵמָה
  choice: கால்நடைகள்
  rationale: בְּהֵמָה இங்கு பறவைகளுக்கும் ஊர்ந்து செல்லும் உயிரினங்களுக்கும் மாறாக, மனிதருடன் தொடர்புடைய தரைவாழ் விலங்குகளின் பிரிவைக் குறிக்கிறது; ‘கால்நடைகள்’ என்பது தெளிவான இயல்பான தமிழ்.
- source_word: רֶמֶשׂ הָאֲדָמָה
  choice: நிலத்தில் ஊர்ந்து செல்லும் எல்லா உயிரினங்கள்
  rationale: רֶמֶשׂ சிறியதாக நகரும் அல்லது ஊர்ந்து செல்லும் உயிரினங்களைக் குறிக்கிறது; הָאֲדָמָה என்பதன் ‘நிலம்’ என்ற குறிப்பையும் மொழிபெயர்ப்பு வெளிப்படுத்துகிறது.
- source_word: שְׁנַיִם מִכֹּל
  choice: ஒவ்வொன்றிலிருந்தும் இரண்டு
  rationale: குறிப்பிடப்பட்ட ஒவ்வொரு வகையிலிருந்தும் இரண்டு என்ற பகிர்ந்தளிக்கும் பொருளை இந்தச் சொற்றொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יָבֹאוּ אֵלֶיךָ
  choice: உன்னிடம் வரும்
  rationale: בוא உடன் אֶל என்பது நோவாவை நோக்கிய வருகையைக் குறிக்கிறது. பெட்டிக்குள் நுழைவது சூழலில் உள்ளபோதும், இவ்வாக்கியப் பகுதியில் நேரடியாகச் சொல்லப்படாததால் அது சேர்க்கப்படவில்லை.
- source_word: לְהַחֲיוֹת
  choice: அவற்றை உயிரோடு காப்பதற்காக
  rationale: חיה வினையின் ஹிஃபில் வடிவம் உயிருடன் வைத்திருத்தல் அல்லது உயிரைப் பாதுகாத்தல் என்ற பொருள் தருகிறது; நோக்கத்தைக் குறிக்கும் לְ முன்னொட்டும் ‘காப்பதற்காக’ என்பதில் வெளிப்படுகிறது.
