source:
  edition: WLC
  text: וַ/תִּשָּׁחֵ֥ת הָ/אָ֖רֶץ לִ/פְנֵ֣י הָֽ/אֱלֹהִ֑ים וַ/תִּמָּלֵ֥א הָ/אָ֖רֶץ חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/011.yaml
  text: The earth was corrupt before God[a], and the earth was filled with violence.
translation:
  language: ta
  text: பூமி கடவுளின் முன்னிலையில் சீர்கெட்டிருந்தது[a]; பூமி வன்முறையால் நிறைந்திருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பூமி கடவுளின் பார்வையில் சீர்கெட்டிருந்தது.’
    reason: לִפְנֵי הָאֱלֹהִים என்பதற்கான இயல்பான மாற்று மொழிபெயர்ப்பை வழங்குகிறது.
lexical_decisions:
- source_word: וַתִּשָּׁחֵת
  choice: சீர்கெட்டிருந்தது
  rationale: שׁחת என்பதன் நிஃபால் வடிவம் இங்கு பூமி கெட்டுப்போன நிலையைக் குறிக்கிறது. உடல் சார்ந்த அழிவை மட்டும் சுட்டும் ‘அழிந்திருந்தது’ என்பதற்குப் பதிலாக, உடனடியான சூழலில் காணப்படும் ஒழுக்கச் சீர்கேட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: אֶרֶץ என்பதற்கு ‘பூமி’ அல்லது ‘நிலம்’ என்று பொருள் கொள்ளலாம். பெருவெள்ளக் கதையின் பரந்த சூழலில் ‘பூமி’ ஏற்றது; எபிரெய உரையிலுள்ள சொல்லின் மறுபயன்பாடும் வலியுறுத்தலுக்காகத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: கடவுளுக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் ‘முன்பாக/சந்நிதியில்’ என்ற அடிப்படைப் பொருளை நேரடியாகப் பாதுகாக்கிறது. இது கடவுளின் அறிதலுக்கும் மதிப்பீட்டுக்கும் உட்பட்ட நிலையைச் சுட்டுகிறது; ‘கடவுளின் பார்வையில்’ என்பது இயல்பான மாற்று.
- source_word: הָאֱלֹהִים
  choice: கடவுள்
  rationale: சூழலும் இலக்கணமும் ஒரே கடவுளைக் குறிப்பதால் ஒருமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַתִּמָּלֵא
  choice: நிறைந்திருந்தது
  rationale: מלא என்பதன் நிஃபால் வடிவம் பூமி நிறைந்த நிலையைச் சுட்டுகிறது. ‘நிறைந்திருந்தது’ என்பது தமிழில் இயல்பாகவும் நிலையின் விளைவைக் காட்டுவதாகவும் உள்ளது.
- source_word: חָמָס
  choice: வன்முறை
  rationale: חָמָס என்பது வன்முறை, கொடுமை, அநீதியான பலாத்காரம் ஆகிய பொருள் வளையத்தைக் கொண்டது. இங்கு ‘வன்முறை’ அதன் தீவிரத்தையும் சுருக்கத்தையும் காக்கிறது.
- source_word: וַ
  choice: ;
  rationale: எபிரெய வாவ் தொடர்ச்சியை இணைக்கிறது. தமிழில் தேவையற்ற தொடக்க இணைப்புச் சொல்லைச் சேர்க்காமல், இரண்டு இணையான கூற்றுகளின் தொடர்பை அரைப்புள்ளி இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: சீர்கேட்டின் தன்மை
  choice: மனித சமுதாயத்தோடு தொடர்புடைய ஒழுக்கச் சீர்கேடு
  alternative: பூமியின் உடல்சார்ந்த அழிவு
  rationale: உடனடியான சூழல் மனிதர்களின் தீமையையும் வன்முறையையும் வலியுறுத்துகிறது. ஆகவே ‘சீர்கெட்டிருந்தது’ ஒழுக்கச் சூழலை வெளிப்படுத்துகிறது; அதேவேளையில் பூமி முழுவதையும் எழுவாயாக வைத்துள்ள மூலவுரையின் பரந்த கூறைச் சுருக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பூமி’ என்ற மறுபயன்பாடு எபிரெய உரையின் வலியுறுத்தலைக் காக்கிறது; ‘கடவுளுக்கு முன்பாக’ என்ற சற்றே முறையான சொற்றொடருக்கு வாசகர் நட்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
