  text: לְ/כֻלָּ֥/ם נָתַ֛ן לָ/אִ֖ישׁ חֲלִפ֣וֹת שְׂמָלֹ֑ת וּ/לְ/בִנְיָמִ֤ן נָתַן֙ שְׁלֹ֣שׁ מֵא֣וֹת כֶּ֔סֶף וְ/חָמֵ֖שׁ חֲלִפֹ֥ת שְׂמָלֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/022.yaml
  text: To each of them he gave a change of clothes[b][a], but to Benjamin he gave three hundred pieces of silver and five changes of clothes.
translation:
  language: ta
  text: அவர்கள் ஒவ்வொருவருக்கும் மாற்று உடை ஒன்றைக் கொடுத்தான்.[a] ஆனால் பென்யமீனுக்கு முந்நூறு வெள்ளித் துண்டுகளையும்[b] ஐந்து மாற்று உடைகளையும் கொடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், சொல்லர்த்தமாக, ‘அவர்கள் அனைவருக்கும், ஒவ்வொருவனுக்கும்’ என்று இரண்டு விநியோகச் சொற்றொடர்கள் வருகின்றன.
    reason: previous_rendering
  - marker: b
    text: எபிரெய மொழியில், சொல்லர்த்தமாக, ‘முந்நூறு வெள்ளி’; குறிப்பிட்ட பண அலகு எதுவும் கூறப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכֻלָּם ... לָאִישׁ
  choice: அவர்கள் ஒவ்வொருவருக்கும்
  rationale: ‘அவர்கள் அனைவருக்கும்’ என்பதையும் ‘ஒவ்வொருவனுக்கும்’ என்பதையும் இணைக்கும் எபிரெய விநியோக வலியுறுத்தலை, இயல்பான நவீனத் தமிழில் ஒருங்கிணைத்துக் கூறுகிறது.
- source_word: נָתַן
  choice: கொடுத்தான்
  rationale: பரிசளிக்கும் இக்கதைச் சூழலில் נתן என்பதன் நேரடியான, இயல்பான பொருள்.
- source_word: חֲלִפוֹת שְׂמָלֹת
  choice: மாற்று உடை / மாற்று உடைகள்
  rationale: மாற்றிக்கொள்ள வழங்கப்பட்ட உடைகளைக் குறிக்கும் சொற்றொடர். முதல் பகுதியில் ஒவ்வொருவருக்கும் தலா ஒன்று என்ற விநியோகப் பொருளுக்கேற்ப ஒருமையும், பென்யமீனுக்குக் கொடுக்கப்பட்ட ஐந்தைக் குறிப்பிடும் இடத்தில் பன்மையும் பயன்படுத்தப்பட்டுள்ளன.
- source_word: וּלְבִנְיָמִן
  choice: ஆனால் பென்யமீனுக்கு
  rationale: וְ பொதுவாக ‘மற்றும்’ என்றாலும், மற்ற சகோதரர்கள் பெற்றதற்கும் பென்யமீன் அதிகமாகப் பெற்றதற்கும் இடையிலான எதிர்மறை ஒப்பீட்டை இங்கு ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁלֹשׁ מֵאוֹת כֶּסֶף
  choice: முந்நூறு வெள்ளித் துண்டுகள்
  rationale: மூலத்தில் குறிப்பிட்ட நாணய அலகு இல்லாமல், சொல்லர்த்தமாக ‘முந்நூறு வெள்ளி’ என்றே உள்ளது. ஆகவே ‘சேக்கல்’ அல்லது ‘காசு’ எனச் சேர்க்காமல், பண மதிப்புடைய வெள்ளியை இயல்பாகக் குறிக்க ‘வெள்ளித் துண்டுகள்’ பயன்படுத்தப்பட்டுள்ளது.
