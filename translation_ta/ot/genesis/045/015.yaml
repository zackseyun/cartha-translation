  text: And he kissed all his brothers and wept over them. After that[a], his brothers spoke with him.
translation:
  language: ta
  text: அவன் தன் சகோதரர்கள் அனைவரையும் முத்தமிட்டு, அவர்கள்மேல் அழுதான். அதற்குப் பிறகு, அவனுடைய சகோதரர்கள் அவனோடு[a] பேசினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனிடம் பேசினார்கள்.” எபிரெயத் தொடர் ‘அவனோடு’ அல்லது ‘அவனிடம்’ என்று மொழிபெயர்க்கப்படலாம்; இங்கு உரையாடல் என்ற பொருளில் ‘அவனோடு’ பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַשֵּׁק
  choice: முத்தமிட்டு
  rationale: נשׁק என்பதன் பியேல் வடிவம் அன்பையும் சமரசத்தையும் வெளிப்படுத்தும் முத்தமிடுதலைக் குறிக்கிறது. தமிழில் இயல்பாகவும் அளவுக்கு மீறிய தொடர்ச்சிப் பொருளைச் சேர்க்காமலும் இருப்பதால் இச்சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְכָל אֶחָיו
  choice: தன் சகோதரர்கள் எல்லாரையும்
  rationale: כָּל என்பது யோசேப்பின் சகோதரர்கள் அனைவரையும் உள்ளடக்குகிறது; ‘எல்லாரையும்’ என்பது அந்த முழுமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיֵּבְךְּ
  choice: அழுதான்
  rationale: בכה என்பது அழுதல் அல்லது கண்ணீர் விடுதலைக் குறிக்கிறது. சமரசக் காட்சியின் ஆழ்ந்த உணர்வை இயல்பான நவீன தமிழில் ‘அழுதான்’ தெரிவிக்கிறது.
- source_word: עֲלֵיהֶם
  choice: அவர்கள்மேல் சாய்ந்து
  rationale: עַל இங்கு முத்தமிடுதலோடும் அழுகையோடும் இணைந்த உடல்நெருக்கத்தைக் குறிக்கலாம். தனியாக ‘அவர்கள்மேல் அழுதான்’ என்பது தமிழில் இயல்பற்றதால், காட்சியின் உடல்நெருக்கத்தை அளவாக வெளிப்படுத்த ‘சாய்ந்து’ சேர்க்கப்பட்டது.
- source_word: וְאַחֲרֵי כֵן
  choice: அதற்குப் பிறகு
  rationale: இது நிகழ்வுகளின் காலவரிசையைச் சுட்டுகிறது; இத்தொடர் தெளிவான, இயல்பான நவீன தமிழாகும்.
- source_word: דִּבְּרוּ אֶחָיו אִתּוֹ
  choice: அவனுடைய சகோதரர்கள் அவனோடு பேசினார்கள்
  rationale: דבר உடன் אֵת வருவது ஒருவரோடு உரையாடுவதைக் குறிக்கக்கூடும். சமரசத்துக்குப் பின் நடந்த பரஸ்பர உரையாடல் என்ற நுணுக்கத்தை ‘அவனோடு பேசினார்கள்’ இயல்பாகக் காட்டுகிறது.
