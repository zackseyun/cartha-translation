  text: וְ/יָשַׁבְתָּ֣ בְ/אֶֽרֶץ גֹּ֗שֶׁן וְ/הָיִ֤יתָ קָרוֹב֙ אֵלַ֔/י אַתָּ֕ה וּ/בָנֶ֖י/ךָ וּ/בְנֵ֣י בָנֶ֑י/ךָ וְ/צֹאנְ/ךָ֥ וּ/בְקָרְ/ךָ֖ וְ/כָל אֲשֶׁר לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/010.yaml
  text: You shall live in the land of Goshen, and you shall be near me—you and your sons and your grandsons, and your flocks and your herds and all that you have.
translation:
  language: ta
  text: நீ கோசேன் நாட்டில் குடியிருப்பாய்; எனக்கு அருகில் இருப்பாய்—நீயும் உன் மகன்களும் உன் பேரன்களும், உன் ஆட்டு மந்தைகளும் மாட்டு மந்தைகளும், உனக்குச் சொந்தமான அனைத்தும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: குடியிருப்பாய்
  rationale: ישׁב இச்சூழலில் ஓர் இடத்தில் நிலையாக வாழ்வதைக் குறிக்கிறது; ‘குடியிருப்பாய்’ என்பது வெறும் தங்குதலைவிட நிலையான வசிப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְאֶרֶץ גֹּשֶׁן
  choice: கோசேன் நாட்டில்
  rationale: אֶרֶץ என்பது இங்கு ஒரு குறிப்பிட்ட நிலப்பகுதியைக் குறிக்கிறது; இடப்பெயர் ‘கோசேன்’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְהָיִיתָ קָרוֹב אֵלַי
  choice: எனக்கு அருகில் இருப்பீர்கள்
  rationale: היה + קָרוֹב என்பது அருகாமையில் இருப்பதைக் குறிக்கிறது. எபிரெய உரையில் ஒருமை வினை யாக்கோபை நோக்கி இருந்தாலும், தொடர்ந்து வரும் பட்டியல் அவரையும் அவரோடு இருப்பவர்களையும் உள்ளடக்குகிறது; தமிழில் பட்டியலுக்குப் பின் பன்மை இயல்பானது.
- source_word: אַתָּה
  choice: நீயும்
  rationale: தனி இடப்பெயர் யாக்கோபை வலியுறுத்துகிறது; ‘நீயும்’ என்ற வடிவம் தொடர்ந்து வரும் பட்டியலோடு அந்த வலியுறுத்தலை இணைக்கிறது.
- source_word: וּבָנֶיךָ
  choice: உன் மகன்களும்
  rationale: בנים இங்கு ஆண்பால் பன்மையாக இருப்பதால் ‘மகன்கள்’ எனத் துல்லியமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּבְנֵי בָנֶיךָ
  choice: உன் பேரன்களும்
  rationale: சொல்லுக்கு சொல் ‘உன் மகன்களின் மகன்கள்’; இயல்பான நவீன தமிழில் ‘பேரன்கள்’ அதே ஆண்பால் குறிப்பைப் பாதுகாக்கிறது.
- source_word: וְצֹאנְךָ
  choice: உன் ஆட்டு மந்தைகளும்
  rationale: צֹאן என்பது செம்மறியாடுகள் மற்றும் வெள்ளாடுகள் போன்ற சிறு கால்நடைகளின் கூட்டுப் பெயர்; தமிழில் சுருக்கமாகவும் இயல்பாகவும் ‘ஆட்டு மந்தைகள்’ என வழங்கப்பட்டுள்ளது.
- source_word: וּבְקָרְךָ
  choice: மாட்டு மந்தைகளும்
  rationale: בקר என்பது மாடுகள் போன்ற பெரிய கால்நடைகளைக் குறிக்கிறது; ‘மாட்டு மந்தைகள்’ என்பது צֹאן உடனான வேறுபாட்டைத் தெளிவாக வைத்திருக்கிறது.
- source_word: וְכָל אֲשֶׁר לָךְ
  choice: உனக்குள்ள அனைத்தும்
  rationale: இந்த விரிவான சொற்றொடர் யாக்கோபுக்குச் சொந்தமான மற்ற எல்லாவற்றையும் உள்ளடக்குகிறது; ‘உனக்குள்ள அனைத்தும்’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
