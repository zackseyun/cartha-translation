review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders residence in Goshen, the named family generations, the distinction between small and large livestock, and the comprehensive final possession phrase. However, the Hebrew predicate 'you shall be near me' is singular and directly addresses Jacob; the draft's plural predicate makes the entire following coordination its grammatical subject and weakens the source's appositional emphasis on Jacob.
  naturalness: The wording is generally modern and understandable. Recasting the second clause so that 'நீ' remains the direct singular addressee produces a clearer Tamil sentence and avoids treating 'அனைத்தும்' as part of a plural personal subject.
  terminology: ‘கோசேன்,’ ‘மகன்கள்,’ and ‘பேரன்கள்’ are appropriate. ‘ஆட்டு மந்தைகள்’ and ‘மாட்டு மந்தைகள்’ adequately retain the small-livestock/large-livestock contrast in concise modern Tamil.
  issues:
  - severity: medium
    issue: The predicate ‘எனக்கு அருகில் இருப்பீர்கள்’ is plural although the Hebrew verb וְהָיִיתָ is singular and addresses Jacob.
    rationale: The subsequent ‘you, your sons, your grandsons ...’ is an appositional elaboration of the promise, not a change in the Hebrew verb's person or number. Keeping a singular Tamil predicate better reflects the source while retaining the inclusive list.
  revised_text: நீ கோசேன் நாட்டில் குடியிருப்பாய்; எனக்கு அருகில் இருப்பாய்—நீயும் உன் மகன்களும் உன் பேரன்களும், உன் ஆட்டு மந்தைகளும் மாட்டு மந்தைகளும், உனக்குச் சொந்தமான அனைத்தும்.
  revised_footnotes: []
  revision_rationale: The revision retains all stated referents and the livestock distinction, but restores the singular direct address in the second clause. The dash introduces the Hebrew-style appositional list, which specifies the full household and possessions included in Jacob's proximity to Joseph.
