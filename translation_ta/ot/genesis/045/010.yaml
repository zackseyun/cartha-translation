revisions:
- from: நீ கோசேன் நாட்டில் குடியிருப்பாய்; நீயும் உன் மகன்களும் உன் பேரன்களும், உன் ஆட்டு மந்தைகளும் மாட்டு மந்தைகளும், உனக்குள்ள அனைத்தும் எனக்கு அருகில் இருப்பீர்கள்.
  to: நீ கோசேன் நாட்டில் குடியிருப்பாய்; எனக்கு அருகில் இருப்பாய்—நீயும் உன் மகன்களும் உன் பேரன்களும், உன் ஆட்டு மந்தைகளும் மாட்டு மந்தைகளும், உனக்குச் சொந்தமான அனைத்தும்.
  rationale: The revision retains all stated referents and the livestock distinction, but restores the singular direct address in the second clause. The dash introduces the Hebrew-style appositional list, which specifies the full household and possessions included in Jacob's proximity to Joseph.
