translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதை காரணமாக எபிரெய ஒருமையைப் பன்மையாக்காமல், யோசேப்பு தன் தந்தையிடம் பேசும் நெருக்கத்தை ‘நீ’ வடிவில் பாதுகாக்கப்பட்டுள்ளது. கால்நடை வகைகளின் வேறுபாடும் குடும்பத் தலைமுறைகளின் ஆண்பால் குறிப்பும் தெளிவாக வைக்கப்பட்டுள்ளன.
