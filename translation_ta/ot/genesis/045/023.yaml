  text: וּ/לְ/אָבִ֞י/ו שָׁלַ֤ח כְּ/זֹאת֙ עֲשָׂרָ֣ה חֲמֹרִ֔ים נֹשְׂאִ֖ים מִ/טּ֣וּב מִצְרָ֑יִם וְ/עֶ֣שֶׂר אֲתֹנֹ֡ת נֹֽ֠שְׂאֹת בָּ֣ר וָ/לֶ֧חֶם וּ/מָז֛וֹן לְ/אָבִ֖י/ו לַ/דָּֽרֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/023.yaml
  text: 'And to his father he sent this: ten donkeys carrying some of the best things of Egypt[a], and ten female donkeys carrying grain and bread and provisions for his father for the journey.'
translation:
  language: ta
  text: 'தன் தந்தைக்கு அவன் இவ்வாறு அனுப்பினான்: எகிப்தின் சிறந்த பொருட்களில் சிலவற்றைச் சுமந்த பத்துக் கழுதைகளையும், தன் தந்தையின் பயணத்திற்காகத் தானியமும் அப்பமும் உணவுப் பொருட்களும் சுமந்த பத்துப் பெண் கழுதைகளையும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּזֹאת
  choice: இவற்றை
  rationale: அனுப்பப்பட்டவற்றின் பட்டியலை அறிமுகப்படுத்தும் எபிரெய மொழிநடையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: חֲמֹרִים
  choice: கழுதைகள்
  rationale: பொதுவான ஆண்பால் வடிவைத் தமிழின் இயல்பான பொதுப்பெயராக வழங்குகிறது; பின்னர் வரும் பெண் கழுதைகளுடனான வேறுபாடு வெளிப்படையாகத் தக்கவைக்கப்படுகிறது.
- source_word: נֹשְׂאִים / נֹשְׂאֹת
  choice: சுமந்த
  rationale: விலங்குகள் பொருட்களை ஏற்றிச் சென்றதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מִטּוּב מִצְרָיִם
  choice: எகிப்தின் சிறந்த பொருட்களில் சிலவற்றை
  rationale: טוּב என்பதன் சிறப்பு அல்லது வளம் என்ற பொருளையும், מִן என்பதன் பகுதிப்பொருளையும் மிகையாகக் குறிப்பாக்காமல் காக்கிறது.
- source_word: אֲתֹנֹת
  choice: பெண் கழுதைகள்
  rationale: மூலத்தில் குறிப்பாகக் காணப்படும் பெண்பால் வேறுபாட்டைத் தெளிவாகக் காக்கிறது.
- source_word: בָּר
  choice: தானியம்
  rationale: ஒரு குறிப்பிட்ட தானிய வகையை ஆதாரமின்றி நிர்ணயிக்காமல் பொதுப்பொருளை வழங்குகிறது.
- source_word: לֶחֶם
  choice: அப்பம்
  rationale: இங்கு வழக்கமான குறிப்பிட்ட பொருளான அப்பத்தையே காக்கிறது; பொதுவாக உணவு என்று மாற்றவில்லை.
- source_word: מָזוֹן
  choice: உணவுப் பொருட்கள்
  rationale: பயணத்திற்குத் தேவையான உணவுச் சேமிப்புகள் என்ற பொருளை நவீன தமிழில் தெளிவாகத் தெரிவித்து, அப்பத்திலிருந்து வேறுபடுத்துகிறது.
- source_word: לַדָּרֶךְ
  choice: பயணத்திற்காக
  rationale: வழியில் பயன்படுத்துவதற்கான ஏற்பாடு என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
