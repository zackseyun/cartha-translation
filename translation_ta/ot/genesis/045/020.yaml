  yaml_path: translation/ot/genesis/045/020.yaml
  text: And do not let your eye spare your belongings[b][a], for all the best of the land of Egypt is yours.
translation:
  language: ta
  text: உங்கள் உடைமைகளைப் பற்றிக் கவலைப்பட வேண்டாம்[a]; ஏனெனில் எகிப்து நாட்டின் சிறந்தவையெல்லாம் உங்களுக்கே உரியவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “உங்கள் உடைமைகளின்மேல் உங்கள் கண்கள் இரங்க வேண்டாம்.” இதற்கு, “உங்கள் உடைமைகளைக் குறித்து வருந்த வேண்டாம்” என்றும் பொருள் கொள்ளலாம்.'
    reason: எபிரெய மரபுத்தொடரின் உருவகத்தையும் அதன் பொருள் நுட்பத்தையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וְעֵינְכֶם אַל תָּחֹס עַל
  choice: பற்றிக் கவலைப்பட வேண்டாம்
  rationale: ‘உங்கள் கண் இரங்க வேண்டாம்’ என்ற எபிரெய மரபுத்தொடர், உடைமைகளை விட்டுச் செல்வதைக் குறித்து வருந்தவோ அக்கறைப்படவோ வேண்டாம் என்பதைக் குறிக்கிறது. அதன் பொருளை இயல்பான நவீன தமிழில் தருகிறது; மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כְּלֵיכֶם
  choice: உங்கள் உடைமைகளை
  rationale: כְּלִי என்பது பாத்திரங்கள், பொருட்கள், கருவிகள் அல்லது சொந்தச் சாமான்கள் எனப் பரந்த பொருள் தரலாம். பயணச் சூழலில் ‘உடைமைகள்’ இயல்பானதும் தேவையான பரப்பைத் தக்கவைத்துக்கொள்வதுமான சொல்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்.
- source_word: טוּב כָּל אֶרֶץ מִצְרַיִם
  choice: எகிப்து நாடு முழுவதிலுமுள்ள சிறந்தவை
  rationale: טוּב இங்கு கருத்தியல் ‘நன்மை’ என்பதைவிட நாட்டின் மிகச் சிறந்த வளங்களையும் பொருட்களையும் குறிக்கிறது. כָּל אֶרֶץ מִצְרַיִם என்பதன் முழுமையும் இவ்வமைப்பில் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: לָכֶם הוּא
  choice: உங்களுக்கே உரியவை
  rationale: லாமேத் முன்னொட்டும் வலியுறுத்தும் சுட்டுப்பெயரும் சேர்ந்து உரிமையையும் உறுதியையும் தெரிவிக்கின்றன; ‘உங்களுக்கே’ அந்த வலியுறுத்தலை இயல்பாகக் காட்டுகிறது.
