base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/009.yaml
  text: 'Hurry and go up to my father[a], and say to him, ‘Thus says your son Joseph: God has made me lord over all Egypt. Come down to me; do not delay.’'
translation:
  language: ta
  text: 'விரைந்து மேலே சென்று என் தந்தையிடம், ‘உங்கள் மகன் யோசேப்பு கூறுவது இதுவே: கடவுள் என்னை எகிப்து முழுவதற்கும் தலைவனாக ஆக்கியிருக்கிறார். என்னிடம் இறங்கி வாருங்கள்; தாமதிக்காதீர்கள்.[a]’ என்று சொல்லுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காலந்தாழ்த்தாதீர்கள்”; இன்னும் சொல்லுக்குச்சொல், “நிற்காதீர்கள்.”
    reason: עָמַד என்பதன் சொற்பொருளான ‘நிற்றல்’ மற்றும் இச்சூழலில் உள்ள ‘தாமதித்தல்/தங்குதல்’ என்ற பொருளைச் சுட்டுகிறது.
lexical_decisions:
- source_word: מַהֲרוּ
  choice: விரைந்து
  rationale: பன்மை ஏவல் வடிவத்தின் அவசரத்தையும் கட்டளைத் தன்மையையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וַעֲלוּ אֶל אָבִי
  choice: என் தந்தையிடம் போய்
  rationale: כנען நோக்கிய பயணத்தை ‘மேலே போதல்’ என்று கூறும் எபிரேய நிலவியல் வழக்கு தமிழில் சொற்சொல்லாக இயல்பாகாது; இலக்கைத் தெளிவாகக் கூறும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: தூதுச் செய்தியை அறிமுகப்படுத்தும் நிலையான சூத்திரத்தின் முறையான தொனியை இயல்பான தமிழில் காக்கிறது.
- source_word: בִּנְךָ יוֹסֵף
  choice: உங்கள் மகன் யோசேப்பு
  rationale: மகன் என்ற உறவையும் யோசேப்பின் அடையாளத்தையும் மூல வரிசைக்கு நெருக்கமாகத் தெரிவிக்கிறது.
- source_word: שָׂמַנִי אֱלֹהִים
  choice: கடவுள் என்னை ... ஆக்கியிருக்கிறார்
  rationale: שׂים இங்கு ஒருவரை அதிகாரப் பொறுப்பில் வைப்பதைக் குறிக்கிறது; ‘ஆக்கியிருக்கிறார்’ முடிவுற்ற செயலின் தொடரும் நிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְאָדוֹן לְכָל מִצְרָיִם
  choice: எகிப்து முழுவதற்கும் தலைவனாக
  rationale: אָדוֹן அதிகாரமுள்ள ஒருவரைக் குறிக்கிறது. ‘தலைவன்’ தெய்வீக பட்டத்துடன் குழப்பமின்றி அதிகார உறவைத் தெரிவிக்கிறது; ‘முழுவதற்கும்’ ஆட்சிப் பரப்பை வெளிப்படுத்துகிறது.
- source_word: רְדָה אֵלַי
  choice: என்னிடம் இறங்கி வாருங்கள்
  rationale: எகிப்துக்குச் செல்லும் நிலவியல் இறக்கத்தையும், பேசுபவரே இலக்காக இருப்பதால் தமிழில் இயல்பான ‘வாருங்கள்’ என்பதையும் காக்கிறது.
- source_word: אַל תַּעֲמֹד
  choice: தாமதிக்காமல்
  rationale: עמד என்பதன் சொற்பொருள் ‘நில்’; இத்தடைச் சூழலில் அது தங்குதல் அல்லது காலந்தாழ்த்துதலைக் குறிக்கிறது. இங்கு முன் வரும் வருகைக் கட்டளையுடன் இணைக்க இயல்பான தமிழ்ச் சொல்லாக்கம் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: אֱלֹהִים என்பதன் குறிப்பு
  choice: கடவுள்
  alternative: ஒரு தெய்வம்
  rationale: வினைச்சொல் ஒருமை உணர்விலும், யோசேப்பு தன் உயர்வைத் தாம் வழிபடும் ஒரே கடவுளுக்குச் சார்த்தும் சூழலிலும் ‘கடவுள்’ என்பதே எபிரேயத்தின் இயல்பான பொருள்.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; யாக்கோபை நோக்கிய மகனின் செய்திக்கேற்ற கண்ணியமான, நேரடியான தொனி காக்கப்பட்டுள்ளது. எபிரேய நிலவியல் இயக்கச் சொற்களில், ‘இறங்கி’ வெளிப்படையாகக் காக்கப்பட்டு, ‘மேலே போங்கள்’ தமிழில் இயல்பற்றதால் ‘போய்’ என வழங்கப்பட்டுள்ளது.
