translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கடந்த இரண்டு ஆண்டுகளுக்கும் வரவிருக்கும் ஐந்து ஆண்டுகளுக்கும் உள்ள கால வேறுபாடு தெளிவாக்கப்பட்டுள்ளது; எபிரேய மூலத்தின் விவசாயச் சொற்கள் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளன.
