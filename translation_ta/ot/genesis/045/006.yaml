  text: כִּי זֶ֛ה שְׁנָתַ֥יִם הָ/רָעָ֖ב בְּ/קֶ֣רֶב הָ/אָ֑רֶץ וְ/עוֹד֙ חָמֵ֣שׁ שָׁנִ֔ים אֲשֶׁ֥ר אֵין חָרִ֖ישׁ וְ/קָצִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/006.yaml
  text: For these two years the famine has been in the midst of the land[b][a], and there are still five years in which there will be neither plowing nor harvest.
translation:
  language: ta
  text: ஏனெனில், நாட்டில் பஞ்சம் நிலவி இப்போது இரண்டு ஆண்டுகள் ஆகிவிட்டன[a]. இன்னும் ஐந்து ஆண்டுகளுக்கு உழவும் அறுவடையும் இருக்காது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில் சொல்லர்த்தமாக, “நாட்டின் நடுவில் பஞ்சம் நிலவி இரண்டு ஆண்டுகள் ஆகிவிட்டன.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உழுதலும் அறுத்தலும் இருக்காது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் யோசேப்பு கூறியதற்கான விளக்கத்தை அறிமுகப்படுத்தும் காரண இணைப்பாக வருகிறது.
- source_word: זֶה שְׁנָתַיִם
  choice: இப்போது இரண்டு ஆண்டுகள் ஆகிவிட்டன
  rationale: தற்போது வரை கடந்துள்ள இரண்டு ஆண்டுகளைச் சுட்டும் எபிரேய வழக்கை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָרָעָב
  choice: பஞ்சம்
  rationale: கதையில் ஏற்கெனவே குறிப்பிடப்பட்ட குறிப்பிட்ட பஞ்சத்தைக் குறிக்கிறது; தமிழில் இங்கு பெயர்ச்சொல்லுக்கு தனியான definite article தேவையில்லை.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: நாட்டில்
  rationale: சொல்லர்த்தமாக ‘நாட்டின் நடுவில்’; இச்சூழலில் பஞ்சம் நாட்டிற்குள் நிலவுவதை இயல்பாகத் தெரிவிக்க ‘நாட்டில்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְעוֹד חָמֵשׁ שָׁנִים
  choice: இன்னும் ஐந்து ஆண்டுகளுக்கு
  rationale: தற்போதிலிருந்து மேலும் ஐந்து ஆண்டுகள் மீதமுள்ளன என்ற தொடர்ச்சிப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר אֵין
  choice: இருக்காது
  rationale: வரவிருக்கும் ஐந்து ஆண்டுகளைச் சார்ந்த உறவுநிலை வாக்கியத்தைத் தமிழில் இயல்பான எதிர்கால மறுப்பாக வழங்குகிறது.
- source_word: חָרִישׁ
  choice: உழவு
  rationale: நிலத்தை உழுதல் அல்லது பயிரிடுவதற்கான உழவுச் செயலைக் குறிக்கும் தெளிவான, பொதுவான தமிழ்ச்சொல்.
- source_word: קָצִיר
  choice: அறுவடை
  rationale: உழவுடன் இணைக்கப்பட்ட அறுத்துச் சேகரிக்கும் செயல் அல்லது அறுவடைக் காலத்தை இயல்பாகக் குறிக்கிறது.
