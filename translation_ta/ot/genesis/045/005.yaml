base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/005.yaml
  text: And now[a], do not be distressed or angry with yourselves because you sold me here[c][b], for God sent me ahead of you to preserve life.
translation:
  language: ta
  text: இப்போது, நீங்கள் என்னை இங்கே விற்றுவிட்டதை நினைத்து மனம் வருந்தாதீர்கள்; உங்கள்மீதே கோபம்கொள்ளாதீர்கள்.[a] ஏனெனில், உயிர்களைக் காப்பதற்காக[b] கடவுள் என்னை உங்களுக்கு முன்னதாக அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: ‘அது உங்கள் கண்களில் எரியாதிருக்கட்டும்’; இது கோபம் அல்லது அதிருப்தியைக் குறிக்கும் மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உயிரைப் பாதுகாப்பதற்காக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: யோசேப்பு தன் சகோதரர்களிடம் முன்வைக்கும் தற்போதைய வேண்டுகோளை அறிமுகப்படுத்தும் உரையாடல் குறியீடாக இயல்பான தமிழில் வழங்குகிறது; தொடர்ச்சியின் உணர்வு சூழலிலேயே தெளிவாகிறது.
- source_word: אַל תֵּעָצְבוּ
  choice: மனம் வருந்தாதீர்கள்
  rationale: עצב குறிக்கும் மனவேதனை அல்லது துயரத்தை நவீனத் தமிழில் இயல்பாகவும் அளவுக்கு மீறாமலும் வெளிப்படுத்துகிறது.
- source_word: וְאַל יִחַר בְּעֵינֵיכֶם
  choice: உங்கள்மீதே கோபம்கொள்ளாதீர்கள்
  rationale: சொல்லுக்கு சொல் பொருளான ‘உங்கள் கண்களில் எரியாதிருக்கட்டும்’ என்பது கோபம் அல்லது அதிருப்தியைக் குறிக்கும் எபிரெய மரபுத்தொடர். இச்சூழலில் சகோதரர்கள் தங்களையே குற்றஞ்சாட்டிக் கொள்வதை இது சுட்டுவதால், தமிழில் இயல்பான இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: כִּי מְכַרְתֶּם אֹתִי הֵנָּה
  choice: நீங்கள் என்னை இங்கே விற்றுவிட்டதை நினைத்து
  rationale: சகோதரர்களின் செயலை ‘விற்றீர்கள்’ என்று நேரடியாகத் தக்கவைக்கிறது. காரணத்தைக் காட்டும் כִּי, தமிழில் வருத்தத்தின் காரணத்தை இயல்பாக இணைக்கும் ‘நினைத்து’ என்ற அமைப்பில் வெளிப்படுகிறது.
- source_word: לְמִחְיָה
  choice: உயிர்களைக் காப்பதற்காக
  rationale: מחיה என்பதன் உயிரைப் பாதுகாத்தல் அல்லது உயிர்வாழச் செய்தல் என்ற நோக்கப்பொருளைத் தெளிவாகக் காட்டுகிறது; இங்கு பலருடைய உயிர் குறிக்கப்படுவதால் ‘உயிர்களைக்’ என வழங்கப்பட்டுள்ளது.
- source_word: שְׁלָחַנִי אֱלֹהִים
  choice: கடவுள் என்னை அனுப்பினார்
  rationale: எபிரெய நிறைவுவினையை கதைச்சூழலுக்கேற்ற எளிய இறந்தகாலமாக வழங்கி, கடவுளின் செயற்பாட்டை நேரடியாகத் தக்கவைக்கிறது.
- source_word: לִפְנֵיכֶם
  choice: உங்களுக்கு முன்னதாக
  rationale: சகோதரர்கள் வருவதற்கு முன்பே யோசேப்பு அனுப்பப்பட்டார் என்ற கால மற்றும் நிலை முன்னுரிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: இறை பராமரிப்பும் மனிதப் பொறுப்பும்
  choice: ‘நீங்கள் என்னை... விற்றுவிட்டதை’ என்றும் ‘கடவுள் என்னை... அனுப்பினார்’ என்றும் இரண்டையும் முழு வலிமையுடன் தக்கவைத்தல்
  alternative: சகோதரர்களின் செயலை மென்மைப்படுத்துதல் அல்லது கடவுளின் செயலை வெறும் அனுமதியாக மாற்றுதல்
  rationale: எபிரெய உரை மனிதர்களின் குற்றமுள்ள செயலையும் கடவுளின் உயிர்காக்கும் நோக்கத்தையும் அருகருகே வைக்கிறது. அந்த இறையியல் இழுவிசையைத் தீர்த்துவிடாமல் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டது. நேரடி மனிதச் செயலும் இறைச் செயலும் மென்மைப்படுத்தப்படவில்லை; எபிரெய மரபுத்தொடர் வாசிக்க இயல்பாக முதன்மை உரையில் பொருளாக்கப்பட்டு, அதன் சொற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
