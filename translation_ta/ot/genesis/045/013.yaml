revisions:
- from: நீங்கள் எகிப்தில் எனக்குள்ள எல்லா மதிப்பையும், நீங்கள் கண்ட அனைத்தையும் என் தந்தைக்குத் தெரிவியுங்கள்.[a] விரைந்து என் தந்தையை இங்கே அழைத்து வாருங்கள்.
  to: எகிப்தில் எனக்குள்ள எல்லாக் கௌரவத்தையும் நீங்கள் கண்ட அனைத்தையும் என் தந்தைக்குத் தெரிவியுங்கள்.[a] விரைந்து என் தந்தையை இங்கே அழைத்து வாருங்கள்.[b]
  rationale: This revision retains the draft’s meaning and modern standard Tamil register while using ‘கௌரவம்’ for Joseph’s status and separating the lexical and directional alternatives into properly placed notes. It does not require a doctrinal or interpretive decision.
