translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான உரையின் அவசரத்தையும் கண்ணியத்தையும் காக்கும் நடை. இரு இணை நேர்செயப்படுபொருள்களும் ‘தெரிவியுங்கள்’ என்ற ஒரே வினையால் ஆளப்படுகின்றன. ‘கீழே’ என்பதை முதன்மை உரையில் இயல்புக்காக விடுத்தாலும், எபிரெயத்தின் திசைநுணுக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
