  text: וְ/הִגַּדְתֶּ֣ם לְ/אָבִ֗/י אֶת כָּל כְּבוֹדִ/י֙ בְּ/מִצְרַ֔יִם וְ/אֵ֖ת כָּל אֲשֶׁ֣ר רְאִיתֶ֑ם וּ/מִֽהַרְתֶּ֛ם וְ/הוֹרַדְתֶּ֥ם אֶת אָבִ֖/י הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/013.yaml
  text: And tell my father about all my honor in Egypt and everything you have seen[b][a]. Hurry and bring my father down here.
translation:
  language: ta
  text: எகிப்தில் எனக்குள்ள எல்லாக் கௌரவத்தையும் நீங்கள் கண்ட அனைத்தையும் என் தந்தைக்குத் தெரிவியுங்கள்.[a] விரைந்து என் தந்தையை இங்கே அழைத்து வாருங்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எகிப்தில் எனக்குள்ள எல்லா மகிமையையும்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் כָּבוֹד கௌரவம், மகிமை அல்லது சிறப்பைக் குறிக்கலாம்; இங்கு அது எகிப்தில் யோசேப்புக்கிருந்த உயர்ந்த நிலையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “என் தந்தையை இங்கே கீழே கொண்டு வாருங்கள்.” எபிரெய வினை எகிப்துக்கு வருவதை ‘கீழே’ வருவதாகக் குறிப்பிடுகிறது.
    reason: directional_alternative
lexical_decisions:
- source_word: הִגַּדְתֶּם
  choice: தெரிவியுங்கள்
  rationale: הִגִּיד என்பதன் ஹிஃபில் வடிவம் ‘அறிவித்தல், தெரிவித்தல்’ என்று பொருள்படும். தந்தையிடம் கண்டவற்றை எடுத்துரைக்கச் சொல்லும் இச்சூழலில் ‘தெரிவியுங்கள்’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: כָּל כְּבוֹדִי
  choice: எனக்குள்ள எல்லா மதிப்பையும்
  rationale: כָּבוֹד என்பது மதிப்பு, கௌரவம், மகிமை ஆகிய பொருள்களைத் தரலாம். இங்கு எகிப்தில் யோசேப்புக்கு வழங்கப்பட்ட உயர்ந்த நிலையும் கௌரவமும் குறிக்கப்படுவதால் ‘மதிப்பு’ பொருத்தமானது; ‘மகிமை’ என்பதும் சாத்தியமான மாற்று.
- source_word: בְּמִצְרַיִם
  choice: எகிப்தில்
  rationale: இடத்தைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: כָּל אֲשֶׁר רְאִיתֶם
  choice: நீங்கள் கண்ட அனைத்தையும்
  rationale: சகோதரர்கள் நேரில் கண்ட சான்றுகள் அனைத்தையும் உள்ளடக்கும் வகையில் எபிரெயக் கூறமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: מִהַרְתֶּם
  choice: விரைந்து
  rationale: செயலின் அவசரத்தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: הוֹרַדְתֶּם
  choice: அழைத்து வாருங்கள்
  rationale: יָרַד என்பதன் ஹிஃபில் வடிவம் சொல்லுக்கு சொல் ‘கீழே கொண்டுவருதல்’ எனினும், தமிழில் ஒருவரை பேசுபவரின் இடத்துக்கு வரச் செய்வதை ‘அழைத்து வாருங்கள்’ என்று இயல்பாகக் கூறலாம். எகிப்துக்குச் செல்லும் திசைநுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הֵנָּה
  choice: இங்கே
  rationale: பேசுபவர் இருக்கும் இடத்தை நோக்கிய இலக்கைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
