base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/012.yaml
  text: And look[a], your eyes see—and the eyes of my brother Benjamin—that it is my mouth that is speaking to you.
translation:
  language: ta
  text: இதோ[a], உங்கள் கண்களும் என் சகோதரன் பென்யமீனின் கண்களும், உங்களிடம் பேசுவது என் வாய்தான் என்பதைப் பார்க்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொல்லுக்குச் சொல்லாக: “இதோ, உங்கள் கண்கள் காண்கின்றன; என் சகோதரன் பென்யமீனின் கண்களும் காண்கின்றன; உங்களிடம் பேசுவது என் வாய்தான்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கவனத்தை வலியுறுத்தி உடனடியாகத் திருப்பும் எபிரெயச் சொல்லின் உரையாடல் வலிமையை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֵינֵיכֶם רֹאוֹת
  choice: உங்கள் கண்களும் ... காண்கிறபடி
  rationale: நேரடியான காட்சி உறுதிப்பாட்டை வலியுறுத்தும் ‘உங்கள் கண்கள்’ என்ற உருவகத்தைத் தக்கவைக்கிறது; நிகழ்காலப் பங்கேற்புவினையின் தொடரும் உணர்வையும் ‘காண்கிறபடி’ இயல்பாகக் காட்டுகிறது.
- source_word: וְעֵינֵי אָחִי בִנְיָמִין
  choice: என் சகோதரன் பென்யமீனின் கண்களும்
  rationale: ‘உங்கள் கண்கள்’ என்பதுடனான இணையான அமைப்பையும், பென்யமீனை யோசேப்பு தன் சகோதரன் என அடையாளப்படுத்துவதையும் தக்கவைக்கிறது.
- source_word: כִּי
  choice: காண்கிறபடி
  rationale: அவர்கள் கண்கள் உறுதிப்படுத்தும் உள்ளடக்கத்தைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது; இங்கு காரணப் பொருளைவிட உள்ளடக்க/உறுதிப்பாட்டு தொடர்பே பொருத்தமானது.
- source_word: פִי
  choice: என் வாய்
  rationale: யோசேப்பு மொழிபெயர்ப்பாளர் வழியாக அல்லாமல் தானே நேரடியாகப் பேசுவதை வலியுறுத்தும் எபிரெயின் உடற்பாகக் குறிப்பைத் தக்கவைக்கிறது.
- source_word: הַמְדַבֵּר אֲלֵיכֶם
  choice: உங்களோடு பேசுவது
  rationale: பெயர்ச்சொல் தன்மையுடன் வரும் பங்கேற்புவினையை இயல்பான தமிழில் வெளிப்படுத்தி, இப்போது நேரடியாக நடைபெறும் பேச்சைத் தெளிவாக்குகிறது.
