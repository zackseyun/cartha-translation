translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘என் வாய்தான்’ என்பது தமிழில் சற்றே வலியுறுத்தலானதாக இருந்தாலும், மூலத்தின் நேரடியான உடற்பாகக் குறிப்பையும் தனிப்பட்ட பேச்சின் வலியுறுத்தலையும் பாதுகாக்கிறது. முதன்மை உரையில் இயல்புக்காக வாக்கிய அமைப்பு மாற்றப்பட்டு, சொல்லுக்குச் சொல்லான அமைப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
