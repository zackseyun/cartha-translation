  text: וְ/כִלְכַּלְתִּ֤י אֹֽתְ/ךָ֙ שָׁ֔ם כִּי ע֛וֹד חָמֵ֥שׁ שָׁנִ֖ים רָעָ֑ב פֶּן תִּוָּרֵ֛שׁ אַתָּ֥ה וּ/בֵֽיתְ/ךָ֖ וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/011.yaml
  text: There I will provide for you, because there are still five years of famine, lest you and your household and all that belongs to you become destitute.
translation:
  language: ta
  text: அங்கே நான் உன்னைப் பராமரிப்பேன்; ஏனெனில் பஞ்சம் இன்னும் ஐந்து ஆண்டுகள் நீடிக்கும். நீயும் உன் வீட்டாரும் உனக்குள்ள எல்லாமும் வறியவர்களாகிவிடாதபடி அப்படிச் செய்வேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִלְכַּלְתִּי
  choice: நான் உன்னைப் பராமரிப்பேன்
  rationale: כלכל என்பதன் பீயேல் வடிவம் தேவையான உணவு மற்றும் வாழ்வாதாரத்தை அளித்துப் பேணுதல் என்ற பொருளைத் தருகிறது; இயல்பான நவீனத் தமிழில் ‘பராமரிப்பேன்’ இதைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: யோசேப்பு அங்கே பராமரிப்பதற்கான காரணத்தை அறிமுகப்படுத்தும் காரணவியல் இணைப்பாக உள்ளது.
- source_word: פֶּן
  choice: இல்லையெனில்
  rationale: தடுக்கப்பட வேண்டிய எதிர்மறை விளைவை அறிமுகப்படுத்துகிறது; ‘இல்லையெனில்’ தமிழில் காரணத்துக்கும் எச்சரிக்கப்பட்ட விளைவுக்கும் இயல்பான தொடர்பை ஏற்படுத்துகிறது.
- source_word: תִּוָּרֵשׁ
  choice: வறுமைக்குள்ளாகிவிடுவீர்கள்
  rationale: ירשׁ என்ற வடிவம் இங்கு ஏழ்மையடைதல் அல்லது சொத்திழந்து வறிய நிலைக்கு வருதல் எனப் பொருள்படும். ஒருமை வினை எபிரெயத்தில் யாக்கோபை நோக்கினாலும், தொடரில் வீடும் உடைமைகளும் சேர்வதால் தமிழில் கூட்டு விளைவு பன்மையாக இயல்பாக்கப்பட்டுள்ளது.
- source_word: בֵיתְךָ
  choice: உன் வீட்டாரும்
  rationale: בַּיִת இங்கு கட்டடத்தைவிட குடும்பம்/வீட்டார் என்ற குடும்ப அலகைக் குறிக்கிறது.
- source_word: וְכָל־אֲשֶׁר־לָךְ
  choice: உனக்குள்ள அனைத்தும்
  rationale: ஒருவருக்குச் சொந்தமான உடைமைகள் அனைத்தையும் உள்ளடக்கும் பரந்த சொற்றொடரைப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: பஞ்சத்தின் மீதமுள்ள காலமும் யோசேப்பின் பராமரிப்பும் இடையிலான தொடர்பு
  choice: ‘ஏனெனில்’ என்று காரணவியல் தொடர்பைப் பேணுதல்
  alternative: ‘பஞ்சம் இன்னும் ஐந்து ஆண்டுகள் நீடிக்கும் காலத்தில்’ எனக் காலவியல் தொடர்பாக மட்டும் மொழிபெயர்த்தல்
  rationale: כִּי பொதுவாக இங்கு காரணத்தைக் குறிக்கிறது; பஞ்சம் தொடர்வதே யோசேப்பு பராமரிக்க வேண்டிய காரணம். உரையில் இல்லாத இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், குடும்ப வாசிப்புக்கும் பொதுவழிபாட்டு வாசிப்புக்கும் ஏற்ற கண்ணியமான நடை. எபிரெய வாக்கியத்தின் காரணம்–எச்சரிக்கை அமைப்பு தெளிவாகப் பேணப்பட்டுள்ளது; தேவையற்ற தொழில்நுட்பச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
