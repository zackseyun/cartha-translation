  text: וַ/יְדַבְּר֣וּ אֵלָ֗י/ו אֵ֣ת כָּל דִּבְרֵ֤י יוֹסֵף֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֲלֵ/הֶ֔ם וַ/יַּרְא֙ אֶת הָ֣/עֲגָל֔וֹת אֲשֶׁר שָׁלַ֥ח יוֹסֵ֖ף לָ/שֵׂ֣את אֹת֑/וֹ וַ/תְּחִ֕י ר֖וּחַ יַעֲקֹ֥ב אֲבִי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/027.yaml
  text: And they told him all the words of Yosef that he had spoken to them[a], and he saw the wagons that Yosef had sent to carry him[b], and the spirit of their father Yaakov revived.
translation:
  language: ta
  text: அவர்கள் யோசேப்பு அவர்களிடம் சொன்ன எல்லா வார்த்தைகளையும் அவரிடம் சொன்னார்கள். யோசேப்பு அவரை ஏற்றிச் செல்வதற்காக அனுப்பியிருந்த வண்டிகளை[a] அவர் பார்த்தார். அப்போது அவர்களுடைய தந்தையான யாக்கோபுவின் ஆவி புத்துயிர் பெற்றது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகடங்களை.’ எபிரேயச் சொல் போக்குவரத்துக்குப் பயன்படுத்தப்பட்ட வண்டிகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘ஆவி உயிர்பெற்றது.’ இது மீண்டும் உயிராற்றல் அல்லது ஊக்கம் பெற்றதைக் குறிக்கும் மரபுத்தொடர்.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: அவர்கள் அவருக்குச் சொன்னார்கள்
  rationale: דבר אֶל என்பதன் அடிப்படைப் பொருளான பேசுதல்/சொல்லுதல் இங்கே சகோதரர்கள் யாக்கோபிடம் செய்தியை அறிவிப்பதைக் குறிக்கிறது; இயல்பான தமிழ் நடையில் ‘சொன்னார்கள்’ பொருத்தமானது.
- source_word: אֵת כָּל דִּבְרֵי יוֹסֵף אֲשֶׁר דִּבֶּר אֲלֵהֶם
  choice: யோசேப்பு தங்களிடம் சொன்ன எல்லா வார்த்தைகளையும்
  rationale: דִּבְרֵי என்ற தெளிவான ‘வார்த்தைகள்’ என்னும் பெயர்ச்சொல்லைப் பாதுகாப்பதோடு, யோசேப்பு முன்பு அவர்களிடம் பேசியதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הָעֲגָלוֹת
  choice: வண்டிகளை
  rationale: இச்சொல் மனிதர்களையும் பொருட்களையும் ஏற்றிச் செல்லும் போக்குவரத்து வண்டிகளைக் குறிக்கிறது; ‘வண்டிகள்’ நவீன வாசகருக்குப் புரியக்கூடிய பரந்த, இயல்பான சொல்.
- source_word: אֲשֶׁר שָׁלַח יוֹסֵף לָשֵׂאת אֹתוֹ
  choice: யோசேப்பு அவரை ஏற்றிச் செல்வதற்காக அனுப்பியிருந்த
  rationale: נשא என்பதில் உள்ள சுமத்தல்/ஏற்றிச் செல்லுதல் என்ற கருத்தை வண்டிகளின் சூழலில் இயல்பாக வெளிப்படுத்துகிறது; ‘அனுப்பியிருந்த’ முந்தைய செயலைத் தெளிவாக்குகிறது.
- source_word: וַתְּחִי רוּחַ
  choice: ஆவி புத்துயிர் பெற்றது
  rationale: חיה என்பதிலுள்ள உயிரடைதல் என்ற உருவகத்தைப் பாதுகாத்து, யாக்கோபின் தளர்ந்த உள்ளம் மீண்டும் வலுப்பெற்றதைக் குறிக்கும் எபிரேய மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: அவர்களுடைய தந்தை யாக்கோபின்
  rationale: உறவுமுறையையும் பெயரையும் தெளிவாகப் பாதுகாக்கிறது; יַעֲקֹב என்ற எபிரேயப் பெயர் தமிழில் ‘யாக்கோபு’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: רוּחַ என்பதன் பொருள்
  choice: ஆவி
  alternative: மனவுறுதி / உள்ளம்
  rationale: இங்கு רוּחַ மனிதனின் உயிராற்றல் அல்லது உள்ளார்ந்த மனநிலையைக் குறிக்கலாம். ‘ஆவி’ மூலச்சொல்லின் பரப்பையும் உருவகத் தெளிவின்மையையும் பாதுகாக்கிறது; அடிக்குறிப்பு மரபுத்தொடரின் சூழற்பொருளை விளக்குகிறது.
- issue: יַעֲקֹב என்ற முற்பிதாவின் பெயர்
  choice: யாக்கோபு
  alternative: யாக்கோவு
  rationale: எபிரேயப் பெயரைத் தமிழில் நேரடியாக ஒலிபெயர்த்து, பாரம்பரியத் தமிழ் பயன்பாட்டோடும் வாசிப்புத் தெளிவோடும் ஒத்த வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய வாக்கியத்தின் தொடர்ச்சியைத் தக்கவைத்தபடியே, மிக நீண்ட இணைப்பு வாக்கியத்தைத் தவிர்க்க மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. பெயர்கள் எபிரேய ஒலியமைப்பை அடிப்படையாகக் கொண்டு ஒலிபெயர்க்கப்பட்டுள்ளன; அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
