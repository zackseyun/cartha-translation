  source_fidelity: மூல எபிரேயத்தின் நிகழ்வுவரிசை, யோசேப்பு சொன்ன வார்த்தைகள், யாக்கோபை ஏற்றிச் செல்ல அனுப்பப்பட்ட வண்டிகள், மற்றும் யாக்கோபின் רוּחַ உயிர்ப்படைதல் ஆகியவை வரைவில் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன. ஆனால் ‘தங்களிடம்’ என்பது மூன்றாம் நபர் சகோதரர்களைக் குறிக்கும் இடத்தில் பிரதிபலிப்புச் சாயலைத் தரக்கூடும்; ‘அவர்களிடம்’ தெளிவானது. பெயரின் தெரிவும் உரையில் ஒரே வடிவில் இருக்க வேண்டும்.
  naturalness: மூன்று வாக்கியங்களாகப் பிரித்திருப்பது வாசிக்க இயல்பானது. இருப்பினும் ‘அவர்களுடைய தந்தை யாக்கோபின்’ என்பதற்குப் பதில் ‘அவர்களுடைய தந்தையான யாக்கோபின்’ என்பது உறவுமுறையையும் உடைமைத் தொடர்பையும் நவீன தமிழ் நடையில் தெளிவாக இணைக்கிறது.
