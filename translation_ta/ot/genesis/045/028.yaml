source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יִשְׂרָאֵ֔ל רַ֛ב עוֹד יוֹסֵ֥ף בְּנִ֖/י חָ֑י אֵֽלְכָ֥ה וְ/אֶרְאֶ֖/נּוּ בְּ/טֶ֥רֶם אָמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/028.yaml
  text: And Israel said[a], “Enough! Joseph my son is still alive. I will go and see him before I die.”
translation:
  language: ta
  text: இஸ்ரவேல், “போதும்![a] என் மகன் யோசேப்பு இன்னும் உயிரோடிருக்கிறான். நான் இறப்பதற்கு முன் போய் அவனைப் பார்ப்பேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இது போதும்.” இங்குள்ள எபிரெயச் சொல் நிறைவு அல்லது போதுமானதைக் காட்டும் முழக்கமாக வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: எபிரெய வழக்கில் வரும் தொடர்கதை வினையைத் தமிழின் இயல்பான மேற்கோள் அமைப்பில் வாக்கிய முடிவில் வைத்துள்ளது; தேவையற்ற காலத் தொடர்பைச் சேர்க்கவில்லை.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: மூல உரை ‘யாக்கோபு’ என்பதற்குப் பதிலாக வெளிப்படையாக ‘இஸ்ரவேல்’ என்ற பெயரையே பயன்படுத்துவதால் அதைப் பாதுகாக்கிறது.
- source_word: רַב
  choice: போதும்!
  rationale: இங்கு இச்சொல் நிறைவு அல்லது போதுமானதைக் காட்டும் உணர்ச்சிமிக்க தனி முழக்கமாக வருகிறது; ‘போதும்!’ அதன் சுருக்கத்தையும் வலிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: עוֹד
  choice: இன்னும்
  rationale: யோசேப்பு தொடர்ந்து உயிருடன் இருப்பதைச் சுட்டும் தொடர்நிலைப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּנִי
  choice: என் மகன்
  rationale: முதலாம் நபர் உடைமைத் தொடர்பையும் இஸ்ரவேலின் குடும்பப் பாசத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: חָי
  choice: உயிரோடிருக்கிறான்
  rationale: ‘உயிருடன் இருக்கிறான்’ என்பதற்கான இயல்பான நவீனத் தமிழ் வடிவம்; இங்கு வரும் ஆண்பால் ஒருமையையும் தெளிவாக்குகிறது.
- source_word: אֵלְכָה
  choice: போய்
  rationale: கோஹோர்டேட்டிவ் வடிவம் இஸ்ரவேலின் உறுதியான நோக்கத்தை வெளிப்படுத்துகிறது; அடுத்த வினையுடன் இணைந்த ‘போய் … பார்ப்பேன்’ என்பது தமிழில் இயல்பாக அந்தத் தீர்மானத்தைத் தருகிறது.
- source_word: וְאֶרְאֶנּוּ
  choice: அவனைப் பார்ப்பேன்
  rationale: மூன்றாம் நபர் ஆண்பால் சுட்டையும் காண வேண்டும் என்ற உறுதியையும் தெளிவான, தற்போதைய தமிழில் தருகிறது.
- source_word: בְּטֶרֶם
  choice: முன்
  rationale: இன்னும் நிகழாத இறப்புக்கு முந்திய காலத்தைக் குறிக்கும் எளிய, துல்லியமான தமிழ்ச் சொல்.
- source_word: אָמֽוּת
  choice: நான் இறப்பதற்கு
  rationale: முதலாம் நபர் பொருளை வெளிப்படையாக வைத்துக் கொண்டு, ‘முன்’ என்பதோடு இயல்பான தமிழ்க் காலத் துணைவாக்கியத்தை உருவாக்குகிறது.
