translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு உடனடியாகப் புரியும் வகையிலும் வேதாகமக் கதையுரைக்கு ஏற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தின் திடீர் உணர்ச்சிமிக்க ‘போதும்!’ என்ற முழக்கம் பாதுகாக்கப்பட்டுள்ளது.
