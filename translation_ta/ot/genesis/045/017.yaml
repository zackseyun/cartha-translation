base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/017.yaml
  text: 'Then Pharaoh said to Joseph[a], “Tell your brothers, ‘Do this: load your beasts and go[b]; return to the land of Canaan.’”'
translation:
  language: ta
  text: 'அப்போது பார்வோன் யோசேப்பிடம், “உன் சகோதரர்களிடம், ‘நீங்கள் இப்படிச் செய்யுங்கள்: உங்கள் சுமை விலங்குகள்மேல் சுமைகளை ஏற்றிக்கொண்டு புறப்பட்டு, கானான் நாட்டுக்குத் திரும்பிச் செல்லுங்கள்[a]’ என்று சொல்” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “போங்கள்; கானான் நாட்டுக்கு வாருங்கள்.”'
    reason: மூல எபிரெயத்தில் וּלְכוּ, בֹאוּ என்ற இரண்டு தொடர்ச்சியான கட்டளைகள் உள்ளன; முதன்மை உரை அவற்றை இயல்பான தமிழில் ஒரே பயணமாகக் கூறுகிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் ‘அப்போது’ இயல்பாக அந்த வரிசையைக் காட்டுகிறது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: ஆதியாகமத்தில் எகிப்திய அரசருக்குப் பயன்படுத்தப்படும் பட்டத்தின் வழக்கமான தமிழ் வடிவம்.
- source_word: אֱמֹר אֶל אַחֶיךָ
  choice: உன் சகோதரர்களிடம் ... என்று சொல்
  rationale: எபிரெய கட்டளையையும் அதற்குள் வரும் நேரடிக் கூற்றையும் இயல்பான தமிழில் தெளிவாகத் தக்கவைக்கிறது.
- source_word: זֹאת עֲשׂוּ
  choice: நீங்கள் இப்படிச் செய்யுங்கள்
  rationale: சுட்டுப்பெயரும் பன்மைக் கட்டளையும் மரியாதைமிக்க, இயல்பான நவீன தமிழில் வெளிப்படுகின்றன.
- source_word: טַעֲנוּ אֶת־בְּעִירְכֶם
  choice: உங்கள் சுமை விலங்குகள்மேல் சுமைகளை ஏற்றிக்கொண்டு
  rationale: בְּעִיר இச்சூழலில் பயணப் பொருட்களைச் சுமக்கும் வீட்டு விலங்குகளைக் குறிக்கிறது. ‘சுமை விலங்குகள்’ என்பது பொதுவான ‘விலங்குகள்’ என்பதைவிட சூழலைத் தெளிவாக்குகிறது; வினைச்சொல்லின் செயற்பொருள் தமிழில் இயல்பாக இருக்க ‘சுமைகளை’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: וּלְכוּ בֹאוּ
  choice: புறப்பட்டு ... திரும்பிச் செல்லுங்கள்
  rationale: தொடர்ந்து வரும் ‘போங்கள், வாருங்கள்’ என்ற இரு கட்டளைகளின் புறப்படுதலும் இலக்கை நோக்கிய வருகையும் தமிழில் இயல்பாக ஒரே பயணமாக வெளிப்படுகின்றன; சகோதரர்கள் கானானுக்குத் திரும்பிச் செல்வதால் ‘திரும்பிச் செல்லுங்கள்’ பொருத்தமானது. சொல் வடிவிலான இரட்டை அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אַרְצָה כְּנָעַן
  choice: கானான் நாட்டுக்கு
  rationale: திசையைக் குறிக்கும் இறுதியொட்டையும் ‘நாடு’ என்ற பெயர்ச்சொல்லையும் தெளிவாகப் பிரதிபலிக்கிறது.
