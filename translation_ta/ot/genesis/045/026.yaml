base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/026.yaml
  text: They told him[a], saying, “Joseph is still alive, and he is ruler over all the land of Egypt.” But his heart went numb, for he did not believe them.
translation:
  language: ta
  text: அவர்கள் அவரிடம், “யோசேப்பு இன்னும் உயிரோடிருக்கிறான்; அவன் எகிப்து நாடு முழுவதையும் ஆளுகிறான்” என்று சொன்னார்கள். ஆனால் அவருடைய உள்ளம் மரத்துப்போனது[a]; ஏனெனில் அவர் அவர்களை நம்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய உள்ளம் தளர்ந்துபோனது” அல்லது “அவருடைய உள்ளம் உணர்விழந்தது.” இந்த எபிரெயச் சொற்றொடர், அந்தச் செய்தியைக் கேட்டபோது யாக்கோபுக்கு ஏற்பட்ட அதிர்ச்சியையும் உள்ளார்ந்த தளர்ச்சியையும் விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לוֹ לֵאמֹר
  choice: அவர்கள் அவரிடம் ... என்று சொன்னார்கள்
  rationale: நגד என்பதன் ஹிஃபில் வடிவம் ‘தெரிவித்தல்/சொல்லுதல்’ எனப் பொருள்படும்; לֵאמֹר என்ற எபிரெய உரை அறிமுகச் சூத்திரத்தை இயல்பான தமிழ் நேர்கூற்றாக ‘என்று சொன்னார்கள்’ என வழங்குகிறது.
- source_word: עוֹד יוֹסֵף חַי
  choice: யோசேப்பு இன்னும் உயிரோடிருக்கிறான்
  rationale: עוֹד தொடரும் நிலையைக் குறிக்கிறது; חַי இங்கு ‘உயிருடன்’ என்ற பயனிலைப் பொருளில் வருகிறது. நவீன தமிழில் இவ்வமைப்பு இயல்பானது.
- source_word: וְכִי הוּא מֹשֵׁל
  choice: அவன்தான் ஆளுகிறான்
  rationale: מֹשֵׁל ஆட்சி அதிகாரத்தைச் செலுத்துகிறவனைக் குறிக்கும் நிகழ்காலப் பெயரெச்சம். ‘ஆளுகிறான்’ அதன் செயற்பாட்டு நுணுக்கத்தைப் பாதுகாக்கிறது; הוּא-வின் வலியுறுத்தலை ‘அவன்தான்’ வெளிப்படுத்துகிறது.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: எகிப்து நாடு முழுவதையும்
  rationale: משל உடன் வரும் בְ ஆட்சிக்குட்பட்ட பரப்பைக் குறிக்கிறது; தமிழில் ‘நாடு முழுவதையும் ஆளுகிறான்’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַיָּפָג לִבּוֹ
  choice: அவருடைய உள்ளம் உணர்வற்றுப் போனது
  rationale: פוג பலவீனமாதல், மரத்துப்போதல், உணர்விழத்தல் போன்ற பொருள் வரம்பைக் கொண்டது. לֵב உள்ளார்ந்த மனநிலையையும் குறிக்கலாம்; ஆகவே எபிரெய உருவகத்தை இயல்பான தமிழில் பாதுகாக்கும் வகையில் இவ்வாறு மொழிபெயர்க்கப்படுகிறது.
- source_word: כִּי לֹא הֶאֱמִין לָהֶם
  choice: ஏனெனில் அவர் அவர்களை நம்பவில்லை
  rationale: כִּי இங்கு முந்தைய எதிர்வினைக்கான காரணத்தைத் தருகிறது; לָהֶם அவர்கள் சொன்ன செய்தியை ஏற்காததை, இயல்பான தமிழில் ‘அவர்களை நம்பவில்லை’ என்று வெளிப்படுத்துகிறது.
