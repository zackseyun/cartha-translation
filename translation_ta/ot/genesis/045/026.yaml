translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. யாக்கோபைக் குறிக்கும் இடங்களில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; மகன்களின் நேர்கூற்றில் யோசேப்பைப் பற்றிய இயல்பான ஒருமை தொடர்கிறது. மூலத்தின் ‘இதயம்’ உருவகம் தமிழில் மனம்/உள்ளார்ந்த நிலையைச் சுட்டும் ‘உள்ளம்’ என வழங்கப்பட்டுள்ளது.
