  text: וַ/יְשַׁלַּ֥ח אֶת אֶחָ֖י/ו וַ/יֵּלֵ֑כוּ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אַֽל תִּרְגְּז֖וּ בַּ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/024.yaml
  text: Then he sent his brothers away[a], and they departed; and he said to them, “Do not quarrel on the way.”
translation:
  language: ta
  text: பின்பு யோசேப்பு தன் சகோதரர்களை அனுப்பிவைத்தான்; அவர்கள் புறப்பட்டுச் சென்றார்கள். அப்போது அவன் அவர்களிடம், “வழியில் சண்டையிட்டுக்கொள்ளாதீர்கள்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வழியில் கலக்கமடையாதீர்கள்,” “கோபப்படாதீர்கள்,” அல்லது “அஞ்சாதீர்கள்.” இதற்கான எபிரெய வினைச்சொல் பலவகையான உணர்ச்சிக் கலக்கத்தைக் குறிக்கலாம். யோசேப்பு தன்னை வெளிப்படுத்திய பின்பு சகோதரர்கள் ஒன்றாகப் பயணம் செய்யும் உடனடிச் சூழலுக்கு “சண்டையிட்டுக்கொள்ளாதீர்கள்” என்பது பொருத்தமாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: அனுப்பிவைத்தான்
  rationale: שׁלח என்பதன் பியெல் வடிவம் இங்கு அவர்களைத் தன்னிடமிருந்து புறப்படச் செய்ததைச் சுட்டுகிறது. ‘அனுப்பிவைத்தான்’ என்பது அந்த விடைபெறச் செய்து அனுப்பும் கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: אֶת־אֶחָיו
  choice: தன் சகோதரர்களை
  rationale: எபிரெயச் சொல் நேரடியாக ஆண் உடன்பிறந்தவர்களைக் குறிக்கிறது; இக்கதையிலும் யோசேப்பின் சகோதரர்களே குறிப்பிடப்படுகின்றனர்.
- source_word: וַיֵּלֵכוּ
  choice: அவர்கள் புறப்பட்டுச் சென்றார்கள்
  rationale: הלך பொதுவாக ‘செல்’ என்று பொருள்படும். அனுப்பிவைத்ததைத் தொடர்ந்து அவர்கள் அங்கிருந்து கிளம்பியதை ‘புறப்பட்டுச் சென்றார்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: அப்போது அவன் அவர்களிடம் ... என்றான்
  rationale: இது வழக்கமான உரையாடல் அறிமுகச் சொற்றொடர். தமிழ் கதைநடையின் இயல்புக்காக ‘அப்போது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אַל
  choice: '...ஆதீர்கள்'
  rationale: இது தடை விதிக்கும் எதிர்மறைத் துகள்; தமிழில் மரியாதைப் பன்மைத் தடை வினைமுற்று அதன் வலிமையை இயல்பாகக் காட்டுகிறது.
- source_word: תִּרְגְּזוּ
  choice: சண்டையிட்டுக்கொள்ளாதீர்கள்
  rationale: רגז என்பது கலக்கம், நடுக்கம், கோபம் அல்லது உணர்ச்சிக் கொந்தளிப்பைக் குறிக்கக்கூடும். யோசேப்பின் வெளிப்பாட்டுக்குப் பின் சகோதரர்கள் ஒன்றாகப் பயணிக்கும் உடனடிச் சூழலில், ஒருவரோடு ஒருவர் வாக்குவாதம் அல்லது சண்டை செய்ய வேண்டாம் என்ற கருத்து பொருத்தமாகிறது; சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בַּדָּרֶךְ
  choice: வழியில்
  rationale: דרך இங்கு கானானுக்குத் திரும்பும் பாதையையோ பயணத்தையோ குறிக்கிறது. ‘வழியில்’ என்பது சுருக்கமான, இயல்பான, மூலத்திற்கு நெருக்கமான தமிழ்.
