translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சண்டையிட்டுக்கொள்ளாதீர்கள்’ என்பது உரையாடல் தமிழில் இயல்பாகவும், சகோதரர்களுக்கிடையேயான பரஸ்பர மோதலைத் தெளிவாகவும் காட்டுகிறது; மூல வினைச்சொல்லின் உண்மையான பொருள் விரிவு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
