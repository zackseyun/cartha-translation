lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: புறப்பட்டு மேலே சென்று
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்/ஏறு’. எகிப்திலிருந்து கானானை நோக்கிய புவியியல் பயணத் திசையை ‘மேலே சென்று’ காக்கிறது; இயல்பான தமிழுக்காகப் புறப்படுதலும் வெளிப்படுத்தப்படுகிறது.
- source_word: מִמִּצְרָיִם
  choice: எகிப்திலிருந்து
  rationale: מִן பிறப்பிடம் அல்லது புறப்படும் இடத்தைக் குறிக்கிறது; ‘எகிப்திலிருந்து’ அதனைத் தெளிவாகத் தருகிறது.
- source_word: וַיָּבֹאוּ
  choice: வந்தார்கள்
  rationale: בוא பொதுவாக ‘வரு/சென்று சேர்’ என்று பொருள்படும். தொடரும் இலக்கான யாக்கோபிடம் வந்து சேர்ந்ததை மிகைப்படுத்தாமல் ‘வந்தார்கள்’ தெரிவிக்கிறது.
- source_word: אֶרֶץ כְּנַעַן
  choice: கானான் நாட்டில்
  rationale: எபிரெயச் சொற்றொடரில் אֶרֶץ ‘நாடு/நிலம்’ வெளிப்படையாக உள்ளது. தமிழில் இலக்கை நோக்கிய இயக்கத்தையும் அங்கு யாக்கோபிடம் வந்ததையும் இயல்பாக இணைக்க ‘கானான் நாட்டில்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶל יַעֲקֹב
  choice: யாக்கோபிடம்
  rationale: אֶל ஒருவரை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் நபரைச் சென்றடைவதற்கு ‘-ிடம்’ இயல்பான இணை.
- source_word: אֲבִיהֶם
  choice: தங்கள் தகப்பனாகிய
  rationale: இது அவர்களுடைய நேரடியான தந்தையைக் குறிக்கிறது. எழுவாயையே சுட்டும் இயல்பான தமிழ் வடிவமாக ‘தங்கள்’ தேர்ந்தெடுக்கப்பட்டது; ‘தகப்பன்’ dignified biblical register-ஐத் தக்கவைக்கிறது.
