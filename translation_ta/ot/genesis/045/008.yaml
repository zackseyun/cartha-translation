source:
  edition: WLC
  text: וְ/עַתָּ֗ה לֹֽא אַתֶּ֞ם שְׁלַחְתֶּ֤ם אֹתִ/י֙ הֵ֔נָּה כִּ֖י הָ/אֱלֹהִ֑ים וַ/יְשִׂימֵ֨/נִֽי לְ/אָ֜ב לְ/פַרְעֹ֗ה וּ/לְ/אָדוֹן֙ לְ/כָל בֵּית֔/וֹ וּ/מֹשֵׁ֖ל בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/008.yaml
  text: So now[a], it was not you who sent me here, but God; and he has made me a father to Pharaoh, and lord over all his house, and ruler over all the land of Egypt.
translation:
  language: ta
  text: ஆகவே இப்போது, என்னை இங்கே அனுப்பியது நீங்கள் அல்ல; கடவுள்தான். அவர் என்னைப் பார்வோனுக்குத் தந்தையாகவும்[a], பார்வோனின் வீடு முழுவதற்கும் அதிபதியாகவும், எகிப்து நாடு முழுவதற்கும் ஆட்சியாளனாகவும் ஆக்கியிருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பார்வோனுக்குத் தந்தையைப் போன்றவராக”; அதாவது, முதன்மை ஆதரவாளராகவோ, ஆலோசகராகவோ, நன்மை செய்பவராகவோ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: வְ என்பதன் இணைப்பையும் עַתָּה என்பதன் கால/உரையாடல் முடிவுரைத் தன்மையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא אַתֶּם שְׁלַחְתֶּם אֹתִי הֵנָּה כִּי הָאֱלֹהִים
  choice: என்னை இங்கே அனுப்பியது நீங்கள் அல்ல, கடவுளே
  rationale: אַתֶּם என்பதிலுள்ள வலியுறுத்தலையும், மறுப்புக்குப் பின் כִּי தரும் ‘அல்ல, மாறாக’ என்ற எதிர்மறை ஒப்புமையையும் காக்கிறது. எபிரெயத்தில் இரண்டாம் பகுதியில் ‘அனுப்பினார்’ என்பது விடுபட்டிருந்தாலும் தமிழில் இந்த அமைப்பு முழுப் பொருளையும் தெளிவாகத் தருகிறது.
- source_word: וַיְשִׂימֵנִי
  choice: என்னை ... ஆக்கியிருக்கிறார்
  rationale: கடவுள் ஏற்படுத்திய நிலை தற்போது தொடர்வதைத் தமிழின் நிகழ்கால விளைவுடைய வினைவடிவம் இயல்பாகக் காட்டுகிறது.
- source_word: לְאָב לְפַרְעֹה
  choice: பார்வோனுக்குத் தந்தையாக
  rationale: אָב என்ற ‘தந்தை’ உருவகத்தை விளக்கமாகக் குறுக்காமல் அப்படியே காக்கிறது; இங்கு அது ஆதரவாளர், ஆலோசகர் அல்லது நன்மை செய்பவர் போன்ற உயரிய பொறுப்பைக் குறிக்கலாம்.
- source_word: וּלְאָדוֹן לְכָל בֵּיתוֹ
  choice: அவனுடைய வீடு முழுவதற்கும் அதிபதியாக
  rationale: אָדוֹן குறிக்கும் அதிகாரத்தை ‘அதிபதி’ வெளிப்படுத்துகிறது. בֵּיתוֹ என்பதன் பரந்த ‘வீடு/வீட்டமைப்பு’ பொருளைக் குறுக்காமல் ‘வீடு’ என வைத்திருக்கிறது.
- source_word: וּמֹשֵׁל בְּכָל אֶרֶץ מִצְרָיִם
  choice: எகிப்து நாடு முழுவதற்கும் ஆட்சியாளனாக
  rationale: מֹשֵׁל என்பதன் ஆட்சி செலுத்துபவர் என்ற பரந்த பொருளையும், אֶרֶץ என்பதன் நாட்டுப்பரப்பையும் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யோசேப்பின் கூற்றில் கடவுளின் ஆளுகையும் மனிதச் செயல்பாடும்
  choice: ‘நீங்கள் அல்ல, கடவுளே’ என்ற வலுவான எதிர்நிலையை அப்படியே காத்தல்
  alternative: சகோதரர்களின் செயல்பாட்டைக் குறைக்கும் மென்மையான உரை அல்லது கடவுளின் பராமரிப்பை ஒரு குறிப்பிட்ட இறையியல் முறையால் விளக்கும் பொழிப்புரை
  rationale: எபிரெய உரை கடவுளின் தீர்மானமான நோக்கத்தை வலியுறுத்துகிறது; அதே வேளையில் சகோதரர்கள் உண்மையில் செய்த செயலைச் சுற்றியுள்ள கதையின் பதற்றத்தை நீக்குவதில்லை. மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தை விளக்கித் தீர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘தந்தை’ என்ற மூல உருவகமும், ‘வீடு’ என்ற பரந்த சொல்லும் குறுகிய நிர்வாகப் பதவிகளாக மாற்றப்படாமல் காக்கப்பட்டுள்ளன.
