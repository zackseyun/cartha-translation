base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/019.yaml
  text: 'And you are commanded[a], ‘Do this: take for yourselves wagons from the land of Egypt for your little ones and for your wives[c][b], and carry your father and come.’'
translation:
  language: ta
  text: 'மேலும், உனக்குக் கட்டளையிடப்பட்டுள்ளது: “நீங்கள் இதைச் செய்யுங்கள்: உங்கள் சிறு பிள்ளைகளுக்காகவும்[b] உங்கள் மனைவிகளுக்காகவும் எகிப்து நாட்டிலிருந்து வண்டிகளை[a] எடுத்துக்கொள்ளுங்கள்; உங்கள் தந்தையை ஏற்றிக்கொண்டு வாருங்கள்[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கூண்டு வண்டிகளை.” இவை எகிப்திலிருந்து குடும்பத்தினரையும் உடைமைகளையும் ஏற்றிவர அனுப்பப்பட்ட போக்குவரத்து வாகனங்கள்.
    reason: lexical_alternative
  - marker: b
    text: “சிறு பிள்ளைகள்” என்பது குறிப்பாக இளம் குழந்தைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: சூழலின்படி, “திரும்பி வாருங்கள்” என்றும் பொருள் கொள்ளலாம்; ஆனால் எபிரெய உரை நேரடியாக “வாருங்கள்” என்றே கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: צֻוֵּיתָה
  choice: உனக்குக் கட்டளையிடப்பட்டுள்ளது
  rationale: எபிரெயச் சொல் இரண்டாம் நபர் ஆண்பால் ஒருமையில் உள்ள செயப்பாட்டு வடிவம். பார்வோன் யோசேப்பிடம் பேசும் சூழலைக் காத்து, கட்டளை யோசேப்புக்குக் கொடுக்கப்பட்டிருப்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: זֹאת עֲשׂוּ
  choice: நீங்கள் இதைச் செய்யுங்கள்
  rationale: இங்கு வினைச்சொல் பன்மை; யோசேப்பின் சகோதரர்களை நோக்கிய கட்டளையின் வலிமையை நவீனத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: קְחוּ לָכֶם
  choice: எடுத்துக்கொள்ளுங்கள்
  rationale: לָכֶם தரும் ‘உங்களுக்காக/உங்கள் பயன்பாட்டிற்காக’ என்ற நுணுக்கம் ‘எடுத்துக்கொள்ளுங்கள்’ என்ற இயல்பான தமிழ்ச் சொல்லில் அடங்குகிறது.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: אֶרֶץ என்பதை விடாமல் மொழிபெயர்த்து, தமிழில் இயல்பான இடவழக்கை அளிக்கிறது.
- source_word: עֲגָלוֹת
  choice: வண்டிகள்
  rationale: மக்களையும் பொருட்களையும் ஏற்றிச் செல்லும் சக்கர வாகனங்களைக் குறிக்கிறது. குறிப்பிட்ட வடிவத்தை ஆதாரம் தீர்மானிக்காததால் பொதுவான ‘வண்டிகள்’ பொருத்தமானது.
- source_word: לְטַפְּכֶם
  choice: உங்கள் சிறு பிள்ளைகளுக்காக
  rationale: טַף பொதுவாகச் சிறு குழந்தைகளைக் குறிக்கிறது; பொதுவான ‘பிள்ளைகள்’ என்பதைவிட இதன் குறிப்பான பொருளைத் தக்கவைக்கிறது.
- source_word: וְלִנְשֵׁיכֶם
  choice: உங்கள் மனைவிகளுக்காகவும்
  rationale: குடும்பப் பயணச் சூழலில் נָשִׁים என்பதன் உறவுமுறைப் பொருள் ‘மனைவிகள்’ என்பதே.
- source_word: וּנְשָׂאתֶם אֶת אֲבִיכֶם
  choice: உங்கள் தந்தையை ஏற்றிக்கொண்டு
  rationale: נשא என்பதன் ‘சுமத்தல்/சுமந்து செல்லுதல்’ பொருளை, வண்டிப் பயணச் சூழலில் இயல்பாக ‘ஏற்றிக்கொண்டு’ என்று வெளிப்படுத்துகிறது; வெறுமனே ‘அழைத்துக்கொண்டு’ என்று மெலிதாக்கவில்லை.
- source_word: וּבָאתֶם
  choice: இங்கே வாருங்கள்
  rationale: எபிரெய வினை அடிப்படையில் ‘வாருங்கள்’ என்றே கூறுகிறது. தமிழில் பேச்சாளரை நோக்கிய இயக்கத்தை இயல்பாக்க ‘இங்கே’ சேர்க்கப்பட்டுள்ளது; ‘திரும்பி’ என்ற கருத்து முதன்மை உரையில் சேர்க்கப்படாமல் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
