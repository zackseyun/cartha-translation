  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் உள்ள கட்டளை நடையைப் பயன்படுத்துகிறது. தொடக்கத்தில் யோசேப்பைக் குறிக்கும் ஒருமை ‘உனக்கு’ என்பதையும், தொடர்ந்து சகோதரர்களைக் குறிக்கும் பன்மை ‘நீங்கள்’ என்பதையும் வேறுபடுத்திக் காக்கிறது. தேவையற்ற சமயமரபுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
