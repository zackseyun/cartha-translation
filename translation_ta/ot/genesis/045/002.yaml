translation_notes:
  register: நவீன, தெளிவான, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய தொடர் வாக்கிய அமைப்பு இயல்பான தமிழுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது. ‘அதைக்’ என்பது அவர்கள் கேட்டது யோசேப்பின் அழுகைச் சத்தமே என்பதைத் தெளிவாக்குகிறது; மூலத்தில் அது வெளிப்படையாகச் சொல்லப்படவில்லை என்றாலும் சூழலிலிருந்து நேரடியாகப் பெறப்படுகிறது. அனைத்து அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
