base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/002.yaml
  text: And he wept aloud[a], and the Egyptians heard[c][b], and Pharaoh’s household heard.
translation:
  language: ta
  text: அவன் உரக்க அழுதான்.[a] எகிப்தியர்கள் கேட்டார்கள்;[b] பார்வோனின் வீட்டாரும்[c] கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், ‘அழுகையில் தன் குரலைக் கொடுத்தான்’; இது அவன் உரக்க அழுதான் என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: ‘எகிப்து கேட்டது’ என்றும் மொழிபெயர்க்கலாம்; ஆனால் எபிரெயத்தில் பன்மை வினைச்சொல் இருப்பதால், இங்கு நாட்டின் மக்களைக் கூட்டாகக் குறிக்கும் ‘எகிப்தியர்கள்’ என்பது பொருத்தமானது.
    reason: lexical_alternative
  - marker: c
    text: ‘பார்வோனின் வீடு’ என்றும், விரிவான பொருளில் ‘பார்வோனின் அரசவை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֶת־קֹלוֹ בִּבְכִי
  choice: அவன் சத்தமாக அழுதான்
  rationale: எபிரெய மொழிமரபின் சொற்பொருள் ‘அழுகையில் தன் குரலைக் கொடுத்தான்’ என்பதாக இருந்தாலும், சூழலில் அது கேட்கும்படி உரக்க அழுததைச் சுட்டுகிறது. ‘சத்தமாக அழுதான்’ என்பது இதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וַיִּשְׁמְעוּ
  choice: கேட்டார்கள்
  rationale: இங்கு שׁמע என்பது கீழ்ப்படிதலையோ கூர்ந்து கவனித்தலையோ அல்ல, ஒலியைக் காதால் கேட்டதைக் குறிக்கிறது.
- source_word: מִצְרַיִם
  choice: எகிப்தியர்கள்
  rationale: இந்த வடிவம் ‘எகிப்து’ என்ற நாட்டையும் குறிக்கலாம்; ஆனால் அதனுடன் வரும் பன்மை வினைச்சொல் மக்களைக் கூட்டாகக் குறிக்கும் ‘எகிப்தியர்கள்’ என்ற வாசிப்பை ஆதரிக்கிறது.
- source_word: וַיִּשְׁמַע
  choice: கேட்டார்கள்
  rationale: எபிரெயத்தில் வினை ஒருமையில் இருந்தாலும், ‘பார்வோனின் வீடு’ என்ற கூட்டு அமைப்பைத் தமிழில் ‘வீட்டார்’ என்று வழங்குவதால் மரியாதைப் பன்மையான ‘கேட்டார்கள்’ இயல்பாகிறது.
- source_word: בֵּית פַּרְעֹה
  choice: பார்வோனின் வீட்டார்
  rationale: ‘வீடு’ என்பது இங்கு கட்டடத்தை மட்டும் அல்லாமல் அரச குடும்பத்தாரையோ அரண்மனைச் சுற்றத்தாரையோ குறிக்கலாம். ‘வீட்டார்’ என்பது அந்த மனிதக் கூட்டத்தைக் குறிக்கும் இயல்பான தமிழ் சொல்; ‘அரண்மனை’ என்று மொழிபெயர்ப்பது இடத்தையே முன்னிறுத்திவிடும்.
