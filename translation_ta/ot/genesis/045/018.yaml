base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/018.yaml
  text: Take your father and your households[a], and come to me, and I will give you the best of the land of Egypt, and you shall eat the fat of the land.
translation:
  language: ta
  text: உங்கள் தகப்பனையும் உங்கள் வீட்டாரையும் கூட்டிக்கொண்டு என்னிடம் வாருங்கள். எகிப்து நாட்டின் மிகச் சிறந்தவற்றை நான் உங்களுக்குக் கொடுப்பேன்; நாட்டின் செழுமையான வளத்தை[a] நீங்கள் உண்பீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘நாட்டின் கொழுப்பு.’ இந்த எபிரெய மரபுத்தொடர் நாட்டின் மிகச் சிறந்த, செழுமையான வளத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ
  choice: அழைத்துக்கொண்டு
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்ளுங்கள்’ என்றாலும், மனிதர்களை உடன் கூட்டிவரும்படி கூறும் இச்சூழலில் ‘அழைத்துக்கொண்டு’ என்பது இயல்பான தமிழாகவும் கட்டளையின் பொருளைத் துல்லியமாகவும் தருகிறது.
- source_word: אֲבִיכֶם
  choice: உங்கள் தகப்பனை
  rationale: இரண்டாம் நபர் பன்மை உடைமை விகுதியுடன் வரும் ஒருமைச் சொல்; யாக்கோபைக் குறிக்கிறது.
- source_word: בָּתֵּיכֶם
  choice: உங்கள் வீட்டாரை
  rationale: சொல்லுக்குச் சொல் ‘உங்கள் வீடுகள்’ என்றாலும், இங்கு בַּיִת குடும்ப உறுப்பினர்களையும் சார்ந்திருப்போரையும் உள்ளடக்கிய வீட்டுக் குழுவைக் குறிக்கிறது. ‘வீட்டார்’ இந்த சமூகப் பொருளை இயல்பாகத் தருகிறது.
- source_word: וּבֹאוּ אֵלַי
  choice: என்னிடம் வாருங்கள்
  rationale: בוא என்ற பன்மைக் கட்டளை வடிவத்தையும் אֶל முன்னிடைச்சொல்லையும் நேரடியாகத் தருகிறது; எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘திரும்பி’ என்ற கருத்து சேர்க்கப்படவில்லை.
- source_word: וְאֶתְּנָה לָכֶם
  choice: நான் உங்களுக்குக் கொடுப்பேன்
  rationale: கட்டளைகளைத் தொடர்ந்து வரும் נתן என்பதன் இவ்வடிவம் வாக்குறுதி அல்லது உறுதியளிப்பாகச் செயல்படுகிறது; தமிழ் எதிர்கால வடிவம் அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: טוּב אֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலுள்ள மிகச் சிறந்தவை
  rationale: טוּב இங்கு நாட்டின் நன்மை, வளம் அல்லது மிகத் தேர்ந்த பகுதியைக் குறிக்கிறது. ‘மிகச் சிறந்தவை’ அதன் பரந்த பொருளைக் காக்கிறது.
- source_word: וְאִכְלוּ
  choice: நீங்கள் உண்பீர்கள்
  rationale: வடிவில் கட்டளைத் தொடராக இருந்தாலும், முந்தைய வாக்குறுதியின் விளைவை இங்கு குறிக்கிறது; எதிர்கால வடிவம் தமிழில் அந்த உறுதியைத் தெளிவாகத் தருகிறது.
- source_word: חֵלֶב הָאָרֶץ
  choice: நாட்டின் செழுமைமிக்க விளைச்சல்
  rationale: חֵלֶב என்பதன் நேரடிப் பொருள் ‘கொழுப்பு’; இச்சொற்றொடரில் அது நாட்டின் மிகச் செழுமையான, தேர்ந்த வளத்தை உருவகமாகக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘செழுமைமிக்க விளைச்சல்’ பயன்படுத்தப்பட்டு, மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
