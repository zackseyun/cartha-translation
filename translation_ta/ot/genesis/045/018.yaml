translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தகப்பன்’ வேதாகம உரைக்கு ஏற்ற மரியாதைத் தொனியைத் தருகிறது; ‘வீட்டார்’ என்பது கட்டிடங்களைக் காட்டிலும் குடும்பத்தினரையும் சார்ந்தோரையும் குறிக்கிறது. எபிரெய உருவகத்தின் பொருள் முதன்மை உரையில் இயல்பாகத் தரப்பட்டு, அதன் சொற்படிமம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
