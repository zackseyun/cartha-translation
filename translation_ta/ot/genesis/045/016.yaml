translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், கண்ணியமான உரை. எபிரெயச் செயப்பாட்டு அமைப்பு முதல் வாக்கியத்தில் பாதுகாக்கப்பட்டாலும், ‘கண்களில் நல்லதாக இருந்தது’ என்ற அந்நியமாக ஒலிக்கும் மரபுத்தொடர் பொருள் சார்ந்த இயல்பான தமிழாக வழங்கப்பட்டுள்ளது.
