source:
  edition: WLC
  text: וְ/הַ/קֹּ֣ל נִשְׁמַ֗ע בֵּ֤ית פַּרְעֹה֙ לֵ/אמֹ֔ר בָּ֖אוּ אֲחֵ֣י יוֹסֵ֑ף וַ/יִּיטַב֙ בְּ/עֵינֵ֣י פַרְעֹ֔ה וּ/בְ/עֵינֵ֖י עֲבָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/016.yaml
  text: The report was heard in Pharaoh’s house[a], saying[b], “Joseph’s brothers have come,” and it was pleasing in the eyes of Pharaoh and in the eyes of his servants.
translation:
  language: ta
  text: “யோசேப்பின் சகோதரர்கள் வந்திருக்கிறார்கள்” என்ற செய்தி பார்வோனின் வீட்டில் கேட்கப்பட்டது. அது பார்வோனுக்கும் அவருடைய ஊழியர்களுக்கும் விருப்பமாக இருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַקֹּל נִשְׁמַע
  choice: என்ற செய்தி ... கேட்கப்பட்டது
  rationale: קול என்பதன் அடிப்படைப் பொருள் ‘ஒலி/குரல்’ என்றாலும், தொடர்ந்து வரும் செய்தியின் உள்ளடக்கத்தோடு இங்கு ‘செய்தி’ என்று பொருள்படுகிறது. נִשְׁמַע என்பதன் இறப்பில்லா செயப்பாட்டு வடிவத்தை ‘கேட்கப்பட்டது’ பாதுகாக்கிறது.
- source_word: בֵּית פַּרְעֹה
  choice: பார்வோனின் அரண்மனையில்
  rationale: சொல்லுக்குச் சொல் ‘பார்வோனின் வீட்டில்’; அரசச் சூழலில் இயல்பான தமிழுக்காக ‘அரண்மனை’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: לֵאמֹר
  choice: “...” என்ற
  rationale: எபிரெய மொழியின் ‘சொல்லி/என்று சொல்ல’ என்னும் அறிமுகச் சொல்லை, செய்தியின் உள்ளடக்கத்தை இயல்பாக அறிமுகப்படுத்தும் தமிழ் மேற்கோள் அமைப்பால் வெளிப்படுத்துகிறது.
- source_word: בָּאוּ
  choice: வந்திருக்கிறார்கள்
  rationale: நிறைவுற்ற வருகையின் தற்போதைய விளைவை—அவர்கள் இப்போது அங்கு இருப்பதை—தமிழின் நிறைவு வடிவம் இயல்பாகக் காட்டுகிறது.
- source_word: אֲחֵי יוֹסֵף
  choice: யோசேப்பின் சகோதரர்கள்
  rationale: எபிரெய இணைப்புநிலையை இயல்பான தமிழ் உடைமைத் தொடராகத் தருகிறது.
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: மகிழ்ச்சி அளித்தது
  rationale: சொல்லுக்குச் சொல் ‘கண்களில் நல்லதாக இருந்தது’ என்ற எபிரெய மரபுத்தொடர் இங்கு அந்தச் செய்தி அவர்களுக்கு விருப்பமானதாகவும் மகிழ்ச்சிக்குரியதாகவும் இருந்ததைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகப் பொருளைத் தருகிறது.
- source_word: עֲבָדָיו
  choice: அவனுடைய ஊழியர்கள்
  rationale: עֶבֶד என்பது பணியாளர்கள், அரச ஊழியர்கள் அல்லது அதிகாரிகளை உள்ளடக்கலாம். பதவியை மிகையாகக் குறிப்பாக்காமல் பரந்த பொருளை ‘ஊழியர்கள்’ பாதுகாக்கிறது.
