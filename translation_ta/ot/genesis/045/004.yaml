  to: அப்போது யோசேப்பு தன் சகோதரர்களிடம், “தயவுசெய்து என்னருகே வாருங்கள்” என்றான். அவர்கள் அவனருகே வந்தார்கள். அப்போது அவன், “நான் யோசேப்பு, நீங்கள் எகிப்துக்கு விற்ற உங்கள் சகோதரன்” என்றான்.
