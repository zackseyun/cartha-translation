  text: וַ/יֹּ֨אמֶר יוֹסֵ֧ף אֶל אֶחָ֛י/ו גְּשׁוּ נָ֥א אֵלַ֖/י וַ/יִּגָּ֑שׁוּ וַ/יֹּ֗אמֶר אֲנִי֙ יוֹסֵ֣ף אֲחִי/כֶ֔ם אֲשֶׁר מְכַרְתֶּ֥ם אֹתִ֖/י מִצְרָֽיְמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/004.yaml
  text: Then Joseph said to his brothers, “Please come near to me.” And they came near. Then he said, “I am Joseph, your brother, whom you sold into Egypt.”
translation:
  language: ta
  text: அப்போது யோசேப்பு தன் சகோதரர்களிடம், “தயவுசெய்து என்னருகே வாருங்கள்” என்றான். அவர்கள் அவனருகே வந்தார்கள். அப்போது அவன், “நான் யோசேப்பு, நீங்கள் எகிப்துக்கு விற்ற உங்கள் சகோதரன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. நவீன தமிழில் இயல்பான தொடர்ச்சியை ‘அப்போது’ வெளிப்படுத்துகிறது.
- source_word: אֶל־אֶחָיו
  choice: தன் சகோதரர்களிடம்
  rationale: אָח என்பதன் பன்மையும் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டும் ‘அவனுடைய சகோதரர்கள்’ என்பதைக் குறிக்கின்றன; தமிழில் ‘தன் சகோதரர்களிடம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: גְּשׁוּ נָא אֵלַי
  choice: தயவுசெய்து என்னருகே வாருங்கள்
  rationale: נגשׁ என்பது அருகே வருதல்; נָא வேண்டுகோளின் பணிவைத் தெரிவிக்கிறது. ஒப்பீட்டு நுணுக்கத்தைச் சேர்க்கும் ‘இன்னும் அருகே’ என்பதைக் தவிர்த்து, மூலத்தின் பொருள் நேரடியாகக் காக்கப்படுகிறது.
- source_word: וַיִּגָּשׁוּ
  choice: அவர்கள் அவனருகே வந்தார்கள்
  rationale: முந்தைய கட்டளையில் உள்ள נגשׁ என்ற அதே வேர்ச்சொல்லின் மறுபயன்பாட்டையும், அதற்கான உடனடி மறுமொழியையும் ‘அருகே வந்தார்கள்’ காக்கிறது.
- source_word: אֲנִי יוֹסֵף
  choice: நான்தான் ... யோசேப்பு
  rationale: எபிரெய மொழியின் வினையற்ற அடையாள வாக்கியம் தமிழில் இயல்பாக ‘நான்தான் ... யோசேப்பு’ என்று வருகிறது; ‘தான்’ வெளிப்பாட்டின் அடையாள வலியுறுத்தலை இயல்பாக உணர்த்துகிறது.
- source_word: אֲחִיכֶם
  choice: உங்கள் சகோதரன்
  rationale: ஒருமை பெயருடன் இரண்டாம் நபர் ஆண்பால் பன்மை உடைமைப் பின்னொட்டு உள்ளது; ஆகவே யோசேப்பு அவர்களுடைய சகோதரன் என்று நேரடியாகக் கூறப்படுகிறது.
- source_word: אֲשֶׁר מְכַרְתֶּם אֹתִי
  choice: நீங்கள் ... விற்றுப்போட்ட
  rationale: சார்பு வாக்கியம் நேரடியான குற்றச்சாட்டைத் தக்கவைக்கிறது. ‘விற்றுப்போட்ட’ என்பது ஒருவரை வேறிடத்துக்கு விற்றுவிட்ட செயலை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִצְרָיְמָה
  choice: எகிப்துக்கு
  rationale: திசைச்சுட்டு ה எகிப்தை நோக்கிய சென்றடையும் திசையை உணர்த்துகிறது. தமிழில் இலக்கு இடத்தை ‘எகிப்துக்கு’ என்று இயல்பாகக் குறிப்பிடலாம்.
