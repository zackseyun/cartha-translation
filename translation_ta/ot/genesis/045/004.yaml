translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் உணர்ச்சித் தீவிரமும் கொண்ட எளிய உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தில் மீண்டும் வரும் ‘அருகே வருதல்’ என்ற கருத்தும், யோசேப்பின் நேரடியான அடையாள வெளிப்பாடும் குற்றச்சாட்டும் பாதுகாக்கப்பட்டுள்ளன.
