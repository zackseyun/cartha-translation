base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/007.yaml
  text: And God sent me ahead of you to preserve for you a remnant in the land[b][a], and to keep you alive by a great deliverance.
translation:
  language: ta
  text: கடவுள், நாட்டில் உங்களுக்காக எஞ்சியோரைப் பாதுகாக்கவும்[a], பெரும் மீட்புக்காக உங்களை உயிரோடு காக்கவும்[b] என்னை உங்களுக்கு முன்னதாக அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாட்டில் உங்களுக்காக உயிர்தப்பியோரைப் பாதுகாக்கவும்’ அல்லது ‘உங்களுக்காகச் சந்ததியினரை நிலைத்திருக்கச் செய்யவும்.’ எபிரேயச் சொல் எஞ்சியோர், உயிர்தப்பியோர், அல்லது சந்ததியினர் எனப் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்களைப் பெருமளவில் உயிர்தப்பச் செய்யவும்’ அல்லது ‘பெரும் தப்புதலுக்காக உங்களை உயிரோடு காக்கவும்.’ எபிரேயச் சொற்றொடர் மீட்பு நிகழ்வையோ அதன் விளைவாக உயிர்தப்பியோரையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵנִי
  choice: என்னை அனுப்பினார்
  rationale: שׁלח என்பதன் wayyiqtol வடிவம் கடந்தகாலக் கதையை முன்னெடுத்துச் செல்கிறது; ஆகவே தமிழில் இயல்பான இறந்தகால வினை பயன்படுத்தப்பட்டது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு யோசேப்பு நிகழ்வுகளை விளக்கும்போது ஒரே கடவுளைக் குறிப்பிடுகிறார்; ஒருமைப் பொருள் தெளிவாக உள்ளது.
- source_word: לִפְנֵיכֶם
  choice: உங்களுக்கு முன்னதாக
  rationale: சொல்லடக்கமாக ‘உங்களுக்கு முன்பாக’ என்றாலும், யோசேப்பு அவர்களைவிட முன்னரே எகிப்துக்கு அனுப்பப்பட்ட கால முன்னுரிமையை ‘முன்னதாக’ தெளிவாகக் காட்டுகிறது.
- source_word: לָשׂוּם לָכֶם שְׁאֵרִית
  choice: உங்களுக்காக எஞ்சியோரைப் பாதுகாக்க
  rationale: שׂוּם என்பதன் அடிப்படைப் பொருள் ‘வைக்க/ஏற்படுத்த’; שְׁאֵרִית உடன் இச்சூழலில் உயிர்தப்பி எஞ்சுவோரை நிலைத்திருக்கச் செய்வதைக் குறிக்கிறது. இயல்பான தமிழுக்காக ‘பாதுகாக்க’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: שְׁאֵרִית
  choice: எஞ்சியோர்
  rationale: இந்தப் பெயர்ச்சொல் எஞ்சியிருப்பதையோ உயிர்தப்பியோரையோ குறிக்கலாம். ‘எஞ்சியோர்’ அதன் மூலப் படிமத்தையும் நபர்களைக் குறிக்கும் சூழலையும் காக்கிறது.
- source_word: בָּאָרֶץ
  choice: நாட்டில்
  rationale: אֶרֶץ என்பது ‘பூமி’ அல்லது ‘நாடு’ எனப் பொருள்படும்; பஞ்சமும் குடும்பத்தின் உயிர்பிழைப்பும் பற்றிய உள்ளூர் சூழலில் ‘நாட்டில்’ பொருத்தமானது.
- source_word: וּלְהַחֲיוֹת לָכֶם
  choice: உங்களை உயிரோடு காக்கவும்
  rationale: חיה என்பதன் Hiphil வடிவம் உயிரோடு வைத்தல் அல்லது உயிரைக் காத்தல் எனப் பொருள்படும்; இந்தத் தமிழ் வடிவம் பஞ்சச் சூழலில் இயல்பாக உள்ளது.
- source_word: לִפְלֵיטָה גְּדֹלָה
  choice: பெரும் மீட்பின் மூலம்
  rationale: פְּלֵיטָה என்பது தப்புதல், மீட்பு, அல்லது உயிர்தப்பியோர் எனக் குறிக்கலாம். ‘பெரும் மீட்பு’ காப்பாற்றப்பட்ட விளைவை வெளிப்படுத்துகிறது; לִ־ இங்குப் பயன்/விளைவு அல்லது வழிமுறையாகப் புரிந்துகொள்ளப்படக்கூடியதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டது.
theological_decisions:
- issue: שְׁאֵרִית என்பதை வேதாகமத் தொடர்புள்ள ‘மீதியானோர்’ என்ற சொல்லாலா, உடனடிச் சூழலுக்கேற்ற ‘எஞ்சியோர்/உயிர்தப்பியோர்’ என்ற சொல்லாலா மொழிபெயர்ப்பது
  choice: எஞ்சியோர்
  alternative: உயிர்தப்பியோர்; சந்ததியினர்
  rationale: ‘எஞ்சியோர்’ எபிரேயச் சொல்லின் எஞ்சியிருத்தல் என்ற அடிப்படைப் பொருளைக் காத்து, பஞ்சத்திலிருந்து உயிர்பிழைத்த குடும்பத்தினரை இயல்பாகக் குறிக்கிறது; பிற்கால இறையியல் கருத்தை இவ்வசனத்தில் திணிக்கவில்லை.
- issue: לִפְלֵיטָה גְּדֹלָה என்பது மீட்பு நிகழ்வையா அல்லது பல உயிர்தப்பியோரையா குறிக்கிறது
  choice: பெரும் மீட்பின் மூலம்
  alternative: பெருமளவில் உயிர்தப்பச் செய்ய; பெரும் தப்புதலுக்காக
  rationale: இச்சொற்றொடர் நோக்கம், விளைவு, அல்லது காப்பாற்றும் வழிமுறை எனப் புரிந்துகொள்ளப்படலாம். முதன்மை உரை மீட்பின் விளைவைத் தருகிறது; நபர்களைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘எஞ்சியோர்’ மூலமொழியின் முக்கியப் படிமத்தைத் தக்கவைக்கிறது; தெளிவிற்காக மாற்று அர்த்தங்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன. இரு அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்றொடர்களுக்கு உடனடியாகப் பின்வைக்கப்பட்டுள்ளன.
