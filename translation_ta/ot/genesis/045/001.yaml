translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் கதையின் உணர்ச்சித் தீவிரமும் காக்கப்பட்டுள்ளன. தேவையற்ற மதப்பிரிவுச் சொற்களோ விளக்கச் சேர்க்கைகளோ இல்லை. மூலத்தில் உள்ள செயற்பாட்டாளர்கள் மற்றும் நிகழ்வுகளின் வரிசை தெளிவாக வைக்கப்பட்டுள்ளது.
