  text: וְ/לֹֽא יָכֹ֨ל יוֹסֵ֜ף לְ/הִתְאַפֵּ֗ק לְ/כֹ֤ל הַ/נִּצָּבִים֙ עָלָ֔י/ו וַ/יִּקְרָ֕א הוֹצִ֥יאוּ כָל אִ֖ישׁ מֵ/עָלָ֑/י וְ/לֹא עָ֤מַד אִישׁ֙ אִתּ֔/וֹ בְּ/הִתְוַדַּ֥ע יוֹסֵ֖ף אֶל אֶחָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/001.yaml
  text: Then Joseph could no longer restrain himself before all those standing by him[a], and he cried out[c][b], “Have everyone go out from me!” And no one remained with him when Joseph made himself known to his brothers.
translation:
  language: ta
  text: அப்போது, தன்னைச் சுற்றி நின்றுகொண்டிருந்த அனைவரின் முன்னிலையிலும் யோசேப்பால் தன்னைக் கட்டுப்படுத்திக்கொள்ள முடியவில்லை. எனவே அவர், “என் முன்னிலையிலிருந்து எல்லாரையும் வெளியே அனுப்புங்கள்!” என்று உரக்கக் கூப்பிட்டார். யோசேப்பு தன் சகோதரர்களுக்குத் தன்னை வெளிப்படுத்தியபோது, அவருடன் வேறு யாரும் இருக்கவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָכֹל ... לְהִתְאַפֵּק
  choice: தன்னைக் கட்டுப்படுத்திக்கொள்ள முடியவில்லை
  rationale: எதிர்மறையுடன் வரும் திறன் வினையையும், ஹித்பயேல் வடிவத்தின் தனக்குத்தானான கட்டுப்பாட்டு உணர்வையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לְכֹל הַנִּצָּבִים עָלָיו
  choice: தன்னருகில் நின்றுகொண்டிருந்த அனைவருக்கும் முன்பாக
  rationale: நின்று அல்லது பணியில் அமர்த்தப்பட்டு அருகிலிருந்தவர்களைக் குறிக்கும் பங்கேற்பு வடிவத்தையும், அவர்கள் முன்னிலையில் என்ற உறவுப் பொருளையும் காக்கிறது; அவர்களை ‘பணியாளர்கள்’ என்று தேவையின்றி விளக்கவில்லை.
- source_word: וַיִּקְרָא
  choice: உரக்கக் கூப்பிட்டார்
  rationale: சாதாரணமாக ‘சொன்னார்’ என்பதைக் காட்டிலும், சத்தமாக அழைத்துக் கூறும் மூல வினையின் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: הוֹצִיאוּ כָל אִישׁ מֵעָלָי
  choice: எல்லாரையும் என்னிடமிருந்து வெளியே அனுப்புங்கள்
  rationale: பன்மை ஏவல் வடிவத்தின் காரணவினைப் பொருளையும், כָל אִישׁ என்பதன் சூழலுக்கேற்ற ‘எல்லாரும்’ என்ற பகிர்வுப் பொருளையும் இயல்பாக வழங்குகிறது.
- source_word: וְלֹא עָמַד אִישׁ אִתּוֹ
  choice: வேறு யாரும் அவருடன் இருக்கவில்லை
  rationale: ‘ஒருவனும் அவருடன் நிற்கவில்லை’ என்ற எபிரெயச் சொல்லாட்சியின் சூழல்சார் பொருளான, வேறு யாரும் அங்கே எஞ்சியிருக்கவில்லை என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּהִתְוַדַּע יוֹסֵף אֶל אֶחָיו
  choice: யோசேப்பு தன் சகோதரர்களுக்குத் தன்னை வெளிப்படுத்தியபோது
  rationale: ידע என்பதன் ஹித்பயேல் வடிவம் இங்கு தன்னை அறியச்செய்தல் அல்லது வெளிப்படுத்துதல் என்பதைக் குறிக்கிறது; காலச்சார்பு בְּ முன்னொட்டையும் ‘போது’ எனக் காக்கிறது.
