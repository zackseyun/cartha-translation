  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּתֵּ֨ן לָ/הֶ֥ם יוֹסֵ֛ף עֲגָל֖וֹת עַל פִּ֣י פַרְעֹ֑ה וַ/יִּתֵּ֥ן לָ/הֶ֛ם צֵדָ֖ה לַ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/021.yaml
  text: And the sons of Israel did so[a], and Joseph gave them wagons according to Pharaoh’s command, and he gave them provisions for the journey.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள் அப்படியே செய்தார்கள். பார்வோனின் கட்டளைப்படி[a] யோசேப்பு அவர்களுக்கு வண்டிகளைக் கொடுத்தான்; பயணத்திற்குத் தேவையான பொருட்களையும் கொடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, ‘பார்வோனின் வாயின்படி’; இது ‘பார்வோனின் கட்டளைப்படி’ என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: அப்படியே செய்தார்கள்
  rationale: முன்பு கூறப்பட்ட அறிவுறுத்தலின்படியே அவர்கள் நடந்துகொண்டார்கள் என்பதைக் காட்டும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: இங்கு யாக்கோபாகிய இஸ்ரவேலின் ஆண் பிள்ளைகளையே நேரடியாகக் குறிப்பிடுவதால், எபிரெயச் சொல்லின் பாலினக் குறிப்பைத் தக்கவைக்கிறது.
- source_word: עֲגָלוֹת
  choice: வண்டிகள்
  rationale: மனிதர்களையும் பொருட்களையும் ஏற்றிச் செல்லும் சக்கர வாகனங்களைக் குறிக்கும் பொருத்தமான பொதுத்தமிழ்ச் சொல்.
- source_word: עַל פִּי פַרְעֹה
  choice: பார்வோனின் கட்டளைப்படி
  rationale: சொல்லர்த்தமாக ‘பார்வோனின் வாயின்படி’ என்றாலும், இது அவரது ஆணை அல்லது கட்டளைக்கு இணங்க என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
- source_word: צֵדָה
  choice: தேவையான பொருட்கள்
  rationale: பயணத்திற்கான உணவு மட்டுமன்றி பிற அத்தியாவசியப் பொருட்களையும் உள்ளடக்கக்கூடிய சொல்லின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: לַדָּרֶךְ
  choice: பயணத்திற்கு
  rationale: இச்சூழலில் சாலையையே அல்லாமல் மேற்கொள்ளவிருக்கும் பயணத்தைக் குறிக்கிறது.
