translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பானதும் கண்ணியமானதுமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இஸ்ரவேலின் மகன்கள்’ என்பது உடனடிச் சூழலின் குடும்ப உறவையும் மூலமொழியின் பாலினக் குறிப்பையும் தெளிவாகப் பாதுகாக்கிறது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘பார்வோனின் கட்டளைப்படி’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
