base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/014.yaml
  text: Then he fell on the neck of Benjamin his brother and wept[a], and Benjamin wept on his neck.
translation:
  language: ta
  text: பின்பு யோசேப்பு தன் சகோதரன் பென்யமீனின் கழுத்தில் விழுந்து அழுதான்[a]; பென்யமீனும் அவனுடைய கழுத்தில் விழுந்து அழுதான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “தன் சகோதரன் பென்யமீனின் கழுத்துகளின்மேல் விழுந்து அழுதான் … பென்யமீன் அவனுடைய கழுத்தின்மேல் அழுதான்.” இங்குள்ள பன்மை வடிவமான “கழுத்துகள்” என்பது கழுத்தில் விழுந்து அணைத்துக்கொள்வதைக் குறிக்கும் எபிரெய மரபுவழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל עַל צַוְּארֵי
  choice: கழுத்தைக் கட்டிக்கொண்டு
  rationale: எபிரெயச் சொற்கள் நேரடியாக ‘கழுத்தின்மேல் விழுந்தான்’ என்று பொருள்பட்டாலும், இச்சூழலில் கழுத்தை அணைத்துக்கொள்வதைக் குறிக்கும் மரபுத்தொடர். இயல்பான நவீன தமிழில் அதன் செயற்பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בִנְיָמִן אָחִיו
  choice: தன் சகோதரன் பென்யமீனின்
  rationale: பென்யமீன் யோசேப்பின் சகோதரன் என்பதைச் சொல்லும் மூலமொழியின் உறவுமுறை வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: וַיֵּבְךְּ / בָּכָה
  choice: அழுதான்
  rationale: בכה என்பதன் இயல்பான தமிழ் இணை; இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்தி மூலத்தின் மீளுரையைப் பேணுகிறது.
- source_word: וּבִנְיָמִן
  choice: பென்யமீனும்
  rationale: וּ இணைப்பைத் தமிழில் இயல்பாகக் காட்டி, பென்யமீனும் பதிலுக்கு அதேபோல் அழுததை வெளிப்படுத்துகிறது.
- source_word: צַוָּארָיו
  choice: அவனுடைய கழுத்தைக் கட்டிக்கொண்டு
  rationale: மூலத்தின் சுட்டுப்பெயரைப் பாதுகாத்து, அணைத்துக்கொள்ளும் அதே எபிரெய மரபுத்தொடரை இயல்பான தமிழில் அளிக்கிறது.
