translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கழுத்தின்மேல் விழுந்தான்’ என்ற சொல்லுக்குச் சொல் அமைப்பு தமிழில் தவறாகப் புரியக்கூடும் என்பதால், மரபுத்தொடரின் பொருள் ‘கழுத்தைக் கட்டிக்கொண்டு’ என வழங்கப்பட்டு, மூல வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
