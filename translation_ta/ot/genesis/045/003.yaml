base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/003.yaml
  text: Then Joseph said to his brothers[a], “I am Joseph. Is my father still alive?” But his brothers could not answer him[b], because they were dismayed at his presence.
translation:
  language: ta
  text: அப்போது யோசேப்பு தன் சகோதரர்களிடம், “நான்தான் யோசேப்பு. என் தந்தை இன்னும் உயிரோடு இருக்கிறாரா?” என்றான். ஆனால் அவனுடைய சகோதரர்கள் அவன் முன்னிலையில்[b] திகைத்துப்போனதால்[a], அவர்களால் அவனுக்குப் பதில் சொல்ல முடியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “திகிலடைந்ததால்,” “கலங்கிப்போனதால்.”
    reason: בהל என்ற எபிரெய வினை அதிர்ச்சி, கலக்கம், அச்சம் ஆகிய தொடர்புடைய பொருட்களைத் தரக்கூடும்.
  - marker: b
    text: சொல்லுக்குச் சொல், “அவன் முகத்தின் முன்னிலையிலிருந்து”; ஒருவரின் முன்னிலையில் இருப்பதால் உண்டாகும் தாக்கத்தைக் குறிக்கும் எபிரெய மொழிவழக்கு.
    reason: מִפָּנָיו என்பதன் சொற்பொருளையும் அதன் காரணவிளைவுச் சாயலையும் விளக்குகிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: தொடர்கதை நிகழ்வை முன்னெடுக்கும் waw-consecutive-ஐ இயல்பான நவீனத் தமிழ் நடையில் காட்டுகிறது.
- source_word: אֶל אֶחָיו
  choice: தன் சகோதரர்களிடம்
  rationale: யோசேப்பின் ஆண் உடன்பிறந்தவர்களைக் குறிக்கிறது; உரையாடல் நோக்கை ‘-இடம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲנִי יוֹסֵף
  choice: நான்தான் யோசேப்பு
  rationale: வெளிப்படையான சுயஅடையாளத்தைத் தமிழில் வலியுறுத்தலுடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַעוֹד אָבִי חָי
  choice: என் தந்தை இன்னும் உயிரோடு இருக்கிறாரா?
  rationale: ஒரு நிலை தொடர்ந்து நீடிக்கிறதா என்ற கேள்வியை ‘இன்னும்’ துல்லியமாகக் காட்டுகிறது.
- source_word: וְלֹא יָכְלוּ ... לַעֲנוֹת אֹתוֹ
  choice: அவர்களால் அவனுக்குப் பதில் சொல்ல முடியவில்லை
  rationale: יכולת குறிக்கும் இயலாமையையும், ענה குறிக்கும் வாய்மொழிப் பதிலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: נִבְהֲלוּ
  choice: திகைத்துப்போனதால்
  rationale: בהל என்ற வினையின் கலக்கம், அதிர்ச்சி, அச்சம் ஆகிய பொருள் வரம்பைச் சூழலுக்கு ஏற்றவாறு காட்டுகிறது; ‘திகிலடைந்ததால்’ என்பது சாத்தியமான அதிகத் தீவிர மாற்று.
- source_word: מִפָּנָיו
  choice: அவன் முன்னிலையில்
  rationale: சொல்லுக்குச் சொல் ‘அவன் முகத்திற்கு/அவன் முன்னிலையிலிருந்து’ எனும் எபிரெய மொழிவழக்கை இயல்பான தமிழில் நபரின் முன்னிலை ஏற்படுத்திய தாக்கமாக வெளிப்படுத்துகிறது.
