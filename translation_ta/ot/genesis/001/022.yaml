  text: וַ/יְבָ֧רֶךְ אֹתָ֛/ם אֱלֹהִ֖ים לֵ/אמֹ֑ר פְּר֣וּ וּ/רְב֗וּ וּ/מִלְא֤וּ אֶת הַ/מַּ֨יִם֙ בַּ/יַּמִּ֔ים וְ/הָ/ע֖וֹף יִ֥רֶב בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/022.yaml
  text: And God blessed them[a], saying, “Be fruitful and multiply, and fill the waters in the seas, and let the birds multiply on the earth.”
translation:
  language: ta
  text: கடவுள் அவற்றை ஆசீர்வதித்து, “பலுகிப் பெருகி, கடல்களின் நீர்ப்பரப்புகளை நிரப்புங்கள்; பூமியில் பறவைகள்[a] பெருகட்டும்” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பறவைகள்’ என்பதற்குப் பதிலாக ‘பறக்கும் உயிரினங்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய עוֹף என்ற சொல் பறக்கும் உயிரினங்களைப் பரந்த வகையில் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: ஆசீர்வதித்து
  rationale: பரக்கின் பியேல் வடிவம் இங்கு ஆசீர்வாதத்தை அருளுவதைக் குறிக்கிறது. ‘ஆசீர்வதித்து’ என்பது இறைச் செயலையும் ஆசீர்வாதத்தின் தன்மையையும் இயல்பாகப் பேணுகிறது.
- source_word: אֹתָם
  choice: அவற்றை
  rationale: முந்தைய வசனத்தில் படைக்கப்பட்ட கடல்வாழ் உயிரினங்களையும் பறவைகளையும் குறிக்கும் உயிரற்ற பன்மைச் சுட்டுப்பெயராகத் தமிழில் இயல்பாக உள்ளது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: தொடக்கநூல் 1-இல் ஒருமை வினையுடன் வரும் ஒரே படைப்பாளரைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் மொழிபெயர்ப்பு.
- source_word: לֵאמֹר
  choice: என்று கூறினார்
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெயக் கட்டமைப்பை இயல்பான தமிழ் வாக்கிய முடிவாகத் தருகிறது.
- source_word: פְּרוּ
  choice: பலுகி
  rationale: இனப்பெருக்கத்தின் மூலம் கனிதருதல் அல்லது செழித்துப் பெருகுதல் என்ற உருவகத்தை ‘பலுகி’ சுருக்கமாகப் பேணுகிறது; வெறும் எண்ணிக்கை அதிகரிப்பாக மட்டும் மாற்றவில்லை.
- source_word: וּרְבוּ
  choice: பெருகி
  rationale: எண்ணிக்கையில் அதிகரிப்பதைக் குறிக்கும் கட்டளை வடிவம். ‘பலுகிப் பெருகி’ என்பது இணைந்த எபிரெயச் சொற்றொடரின் ஓட்டத்தைத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: וּמִלְאוּ
  choice: நிரப்புங்கள்
  rationale: מלא என்பதன் ‘நிரப்புதல்’ என்ற நேரடிப் பொருளையும் பன்மைக் கட்டளை வடிவத்தையும் பேணுகிறது.
- source_word: אֶת־הַמַּיִם בַּיַּמִּים
  choice: கடல்களிலுள்ள நீரை
  rationale: ‘கடல்கள்’ என்ற எபிரெயப் பன்மையைப் பேணுகிறது. தமிழில் ‘நீர்’ இயல்பாகக் கூட்டுப்பெயராக வருவதால், செயற்கையான பன்மையைத் தவிர்த்துள்ளது.
- source_word: וְהָעוֹף
  choice: பறவைகள்
  rationale: உடனடிச் சூழலில் இயல்பான பொருள் ‘பறவைகள்’; எனினும் עוֹף என்பதன் பரந்த பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יִרֶב
  choice: பெருகட்டும்
  rationale: எபிரெய விருப்பவினை வடிவத்தின் ஆசீர்வாதத்தோடு கலந்த கட்டளைத் தொனியைப் பேணுகிறது; அதை வெறும் எதிர்கால முன்னறிவிப்பாக மாற்றவில்லை.
- source_word: בָּאָרֶץ
  choice: பூமியில்
  rationale: பறவைகள் பெருகும் நிலவுலகத் தளத்தைக் குறிக்கும் நேரடியான, இயல்பான மொழிபெயர்ப்பு.
theological_decisions:
- issue: ஆசீர்வாத உரையின் கட்டளை–விருப்பவினைத் தன்மை
  choice: முதல் மூன்று வினைகளைப் பன்மைக் கட்டளையாகவும் இறுதி வினையை ‘பெருகட்டும்’ என்ற விருப்பவினையாகவும் மொழிபெயர்த்தல்
  alternative: எல்லா வினைகளையும் நேரடிக் கட்டளைகளாகவோ, இறுதி வினையை ‘பெருகும்’ என்ற சாதாரண எதிர்காலமாகவோ தருதல்
  rationale: எபிரெய உரையில் கடவுளின் ஆசீர்வாதம் கட்டளை மற்றும் விருப்பவினை வடிவங்களில் வெளிப்படுகிறது. தேர்ந்த மொழிபெயர்ப்பு அதை வெறும் கட்டளையாகவோ வெறும் முன்னறிவிப்பாகவோ தட்டையாக்காமல் அந்த இறையியல் இழுவிசையைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பலுகிப் பெருகி’ என்ற இணைப்பு படைப்புக் குறிப்பின் உயர்ந்த நடையையும் இரண்டு தனித்த எபிரெய வினைகளையும் பேணுகிறது. அடிக்குறிப்பு குறி அது விளக்கும் ‘பறவைகள்’ என்பதன் பின்னே வைக்கப்பட்டுள்ளது.
