source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תּוֹצֵ֨א הָ/אָ֜רֶץ נֶ֤פֶשׁ חַיָּה֙ לְ/מִינָ֔/הּ בְּהֵמָ֥ה וָ/רֶ֛מֶשׂ וְ/חַֽיְתוֹ אֶ֖רֶץ לְ/מִינָ֑/הּ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/024.yaml
  text: 'And God said[a], “Let the earth bring forth living creatures according to their kinds: livestock, creeping things, and wild animals of the earth according to their kinds.” And it was so.'
translation:
  language: ta
  text: 'கடவுள், “பூமி உயிருள்ள உயிரினங்களை அவற்றின் வகைகளின்படி தோன்றச் செய்யட்டும்: கால்நடைகள், தரையில் ஊர்ந்து செல்லும் உயிரினங்கள், பூமியின் காட்டு விலங்குகள், அவற்றின் வகைகளின்படி” என்றார். அப்படியே ஆனது.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹצֵא
  choice: தோன்றச் செய்யட்டும்
  rationale: יצא என்பதன் ஹிஃபில் விருப்பக் கட்டளை வடிவம், பூமி உயிரினங்களை வெளிப்படச் செய்ய வேண்டும் என்ற இறைக் கட்டளையைத் தெரிவிக்கிறது. ‘தோன்றச் செய்யட்டும்’ என்பது காரணவினை நுட்பத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: படைப்புச் சூழலில் אֶרֶץ நிலப்பரப்பை விரிவாகக் குறிக்கிறது; இங்கு ‘பூமி’ அந்தப் பரந்த பொருளைத் தருகிறது.
- source_word: נֶפֶשׁ חַיָּה
  choice: உயிருள்ள உயிரினங்கள்
  rationale: இச்சொற்றொடர் உயிரோடு இயங்கும் படைப்புகளைக் குறிக்கிறது. தொடரும் விலங்கு வகைகளுக்கு ஏற்ற கூட்டுப் பொருளை இது இயல்பாக வெளிப்படுத்துகிறது; ‘ஆத்துமா’ போன்ற பிற்கால இறையியல் பொருளைத் திணிப்பதில்லை.
- source_word: לְמִינָהּ
  choice: அவற்றின் வகைவகையாக
  rationale: எபிரெயத்தில் ஒருமை வடிவம் இருந்தாலும், பெயரிடப்படும் விலங்குக் குழுக்களிடையே பகிர்ந்தளிக்கும் பொருள் உள்ளது. ‘அவற்றின் வகைவகையாக’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בְּהֵמָה
  choice: கால்நடைகள்
  rationale: இங்கு பெரும்பாலும் மனிதருடன் வாழும் அல்லது பழக்கப்பட்ட பெரிய நில விலங்குகளின் வகுப்பைக் குறிக்கிறது. நவீன தமிழில் ‘கால்நடைகள்’ தெளிவான தேர்வு.
- source_word: רֶמֶשׂ
  choice: தரையில் ஊர்ந்து செல்லும் உயிரினங்கள்
  rationale: தரைக்கு அருகே நகரும் சிறிய உயிரினங்களை உள்ளடக்கும் பரந்த சொல். ‘ஊர்வன’ என்று உயிரியல் வகைப்பாட்டுக்குள் குறுக்காமல், எபிரெயச் சொல்லின் பரப்பை இது காக்கிறது.
- source_word: חַיְתוֹ אֶרֶץ
  choice: பூமியின் காட்டு விலங்குகள்
  rationale: பழக்கப்பட்ட கால்நடைகளிலிருந்து வேறுபடும், மனிதரால் பழக்கப்படாத நில விலங்குகளை இச்சொற்றொடர் குறிக்கிறது.
- source_word: וַיְהִי כֵן
  choice: அப்படியே ஆனது
  rationale: ஆதியாகமம் 1-இல் மீண்டும் வரும் நிறைவேற்றச் சூத்திரத்தின் சுருக்கத்தையும் கம்பீரமான ஓசையையும் காக்கிறது.
theological_decisions:
- issue: נֶפֶשׁ என்பதற்கு இறையியல் சுமை கொண்ட சொல்லைப் பயன்படுத்த வேண்டுமா
  choice: உயிருள்ள உயிரினங்கள்
  alternative: உயிருள்ள ஆத்துமாக்கள் / உயிருள்ளவர்கள்
  rationale: இந்தச் சூழலில் நֶפֶשׁ חַיָּה என்பது பொதுவாக உயிருள்ள படைப்புகளைக் குறிக்கிறது; விலங்குகளின் மறைபொருள் அமைப்பைப் பற்றிய தனிப்பட்ட கோட்பாட்டை முன்வைக்கவில்லை. எனவே பிற்கால ‘ஆத்துமா’ விவாதங்களை உரைக்குள் கொண்டு வராமல், மூலத்தின் பொருளைத் திறந்தவாறே வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயத்தின் காரணவினைக் கட்டளையும் விலங்கு வகைகளுக்கிடையிலான வேறுபாடும் காக்கப்பட்டுள்ளன; தொழில்நுட்ப உயிரியல் வகைப்பாடும் தேவையற்ற இறையியல் சுமையும் தவிர்க்கப்பட்டுள்ளன.
