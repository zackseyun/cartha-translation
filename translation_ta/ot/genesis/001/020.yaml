source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יִשְׁרְצ֣וּ הַ/מַּ֔יִם שֶׁ֖רֶץ נֶ֣פֶשׁ חַיָּ֑ה וְ/עוֹף֙ יְעוֹפֵ֣ף עַל הָ/אָ֔רֶץ עַל פְּנֵ֖י רְקִ֥יעַ הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/020.yaml
  text: And God said[a], “Let the waters swarm with swarms of living creatures[c][b], and let birds fly above the earth across the face of the expanse of the heavens.”
translation:
  language: ta
  text: கடவுள், “நீர்களில் உயிருள்ள உயிரினங்கள் திரளாகப் பெருகட்டும்[a]; பறக்கும் உயிரினங்கள்[b] பூமிக்கு மேலே, வானவிரிவின்[c] முகப்பெங்கும் பறக்கட்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘திரள்வது’ என்ற வினையும் அதே வேரிலிருந்து வந்த பெயர்ச்சொல்லும் இணைந்து வருகின்றன; நீர்களில் உயிரினங்கள் மிகுதியாகத் திரண்டு பெருகுவதை இது வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் பறவைகளை மட்டுமல்லாமல் பறக்கும் உயிரினங்களை விரிவாகவும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “வானவிரிவு” என்பதை “வானமண்டலம்” அல்லது “வானக் கவிகை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: தொடர்ச்சியான எபிரெயக் கதைநடையை இயல்பான நவீனத் தமிழில் காட்டுகிறது; இணைப்பை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: ஒருமை வினையுடன் வரும் படைப்பாளரைக் குறிக்கும் இயல்பான, சமயப்பிரிவு சாராத தமிழ்ச் சொல்.
- source_word: יִשְׁרְצוּ ... שֶׁרֶץ
  choice: கூட்டங்கூட்டமாகப் பெருகட்டும்
  rationale: வினைச்சொல்–அதே வேர்ச்சொல் அமைப்பிலுள்ள மிகுதியையும் அசைவுள்ள பெருக்கத்தையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמַּיִם
  choice: தண்ணீர்களில்
  rationale: ஆதியாகமம் 1-இன் பன்மை நீர்ப்பரப்புகளைக் காக்கிறது; தமிழில் உயிரினங்கள் தோன்றும் இடத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: נֶפֶשׁ חַיָּה
  choice: உயிருள்ள உயிரினங்கள்
  rationale: இங்கு உயிர் பெற்ற படைப்புகளைக் குறிக்கிறது; ‘ஆத்துமாக்கள்’ போன்ற பிற்கால மானிடவியல் அல்லது கோட்பாட்டுச் சுமையைத் தவிர்க்கிறது.
- source_word: עוֹף
  choice: பறக்கும் உயிரினங்கள்
  rationale: பறவைகள் என்பதைக் காட்டிலும் எபிரெயச் சொல்லின் சாத்தியமான விரிந்த பொருளைத் தக்கவைக்கிறது.
- source_word: יְעוֹפֵף
  choice: பறக்கட்டும்
  rationale: வானில் பறக்கும் இயக்கத்தையும் கட்டளை/விருப்ப வினை உணர்வையும் நேரடியாகக் காட்டுகிறது.
- source_word: עַל הָאָרֶץ
  choice: பூமிக்கு மேலே
  rationale: தரையைத் தொடுவதாக அல்லாமல் அதற்கு மேலாகப் பறக்கும் இடவுறவைத் தெளிவாக்குகிறது.
- source_word: עַל פְּנֵי
  choice: முகப்பெங்கும்
  rationale: ‘முகத்தின் மேல்’ என்ற எபிரெய உருவகத்தையும் பரப்பெங்கும் பறப்பதையும் சுருக்கமாகக் காக்கிறது.
- source_word: רְקִיעַ הַשָּׁמָיִם
  choice: வானவிரிவு
  rationale: விரித்து அமைக்கப்பட்ட பரப்பு என்ற உருவகத்தைத் தருகிறது; குறிப்பிட்ட பழங்கால அல்லது நவீன அண்டவியல் மாதிரியை மொழிபெயர்ப்பில் திணிக்கவில்லை.
theological_decisions:
- issue: נֶפֶשׁ חַיָּה என்பதன் படைப்புச் சூழல் பொருள்
  choice: உயிருள்ள உயிரினங்கள்
  alternative: உயிருள்ள ஆத்துமாக்கள்
  rationale: இவ்விடத்தில் சொற்றொடர் உயிர் பெற்ற விலங்கினங்களைக் குறிக்கிறது; ‘ஆத்துமா’ என்று மொழிபெயர்ப்பது வசனம் முன்வைக்காத தனிப்பட்ட மானிடவியல் கருத்தைச் சேர்க்கக்கூடும்.
- issue: רְקִיעַ என்பதன் அண்டவியல் உருவகம்
  choice: வானவிரிவு
  alternative: வானமண்டலம் / வானக் கவிகை
  rationale: மூலத்தின் பரந்த விரிவைத் தக்கவைத்தபடி, அது உறுதியான கவிகையா அல்லது வெறும் ஆகாயப்பரப்பா என்ற விவாதத்தை மொழிபெயர்ப்பு தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மிகுதி உணர்வு ‘கூட்டங்கூட்டமாகப் பெருகட்டும்’ என்பதில் இயல்பாகப் பிரதிபலிக்கப்படுகிறது; அண்டவியல் மற்றும் உயிர்/ஆத்துமா குறித்த விவாதங்கள் உரையில் ஒருதலைப்பட்சமாகத் தீர்க்கப்படவில்லை.
