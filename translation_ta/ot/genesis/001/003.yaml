  text: וַ/יֹּ֥אמֶר אֱלֹהִ֖ים יְהִ֣י א֑וֹר וַֽ/יְהִי אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/003.yaml
  text: And God said[a], “Let there be light,” and there was light.
translation:
  language: ta
  text: கடவுள், “ஒளி உண்டாகட்டும்”[a] என்றார்; ஒளி உண்டானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒளி உண்டாவதாக.” எபிரெய மொழியில் இங்கு விருப்பத்தையோ கட்டளையையோ வெளிப்படுத்தும் வினைவடிவம் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: וַ־ இணைந்த wayyiqtol கதை நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது. நவீனத் தமிழில் ‘அப்போது’ இயல்பான தொடர்ச்சியைத் தெரிவிக்கிறது; אמר என்பதற்கு நேரடி உரையுடன் ‘என்றார்’ இயல்பானது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: பன்மை வடிவமுள்ள பெயர்ச்சொல் இங்கு ஒருமை வினையுடன் வந்து ஒரே படைப்பாளரைக் குறிக்கிறது; தமிழில் இதற்கான இயல்பான பொதுப் பெயர் ‘கடவுள்’.
- source_word: יְהִי
  choice: உண்டாகட்டும்
  rationale: היה வினையின் jussive வடிவம் விருப்பத்தையோ கட்டளையையோ வெளிப்படுத்துகிறது. படைப்புக் கட்டளையின் வலிமையையும், இதுவரை இல்லாதது இருப்புக்கு வருவதையும் ‘உண்டாகட்டும்’ இயல்பாகத் தருகிறது.
- source_word: אוֹר
  choice: ஒளி
  rationale: இச்சூழலில் சொல்லின் அடிப்படைப் பொருள் ‘ஒளி’; ஒரு குறிப்பிட்ட ஒளிமூலமாகவோ உருவகமாகவோ குறுக்கப்படவில்லை.
- source_word: וַיְהִי
  choice: உண்டானது
  rationale: היה வினையின் wayyiqtol வடிவம் கடவுளின் உரைக்கு உடனான விளைவை அறிவிக்கிறது. ‘உண்டானது’ கட்டளைக்கும் நிறைவேற்றத்திற்கும் உள்ள சொல் ஒற்றுமையைத் தக்கவைக்கிறது.
- source_word: אוֹר
  choice: ஒளி
  rationale: எபிரெய உரையின் மறுபடியும் கூறுதலைத் தக்கவைத்து, கட்டளை அப்படியே நிறைவேறியதை வலியுறுத்துகிறது.
theological_decisions:
- issue: படைப்பை நிகழ்த்தும் இறைக் கட்டளையின் மொழிபெயர்ப்பு
  choice: ஒளி உண்டாகட்டும்
  alternative: ஒளி உண்டாவதாக
  rationale: எபிரெய jussive இறை விருப்பத்தையும் செயல்திறனுள்ள கட்டளையையும் வெளிப்படுத்துகிறது. ‘உண்டாகட்டும்’ இதைத் தெளிவான, கண்ணியமான நவீனத் தமிழில் தருகிறது; ‘உண்டாவதாக’ என்ற மாற்றும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் இணைந்த நடை. எபிரெய உரையின் கட்டளை–நிறைவேற்றம் அமைப்பும் ‘ஒளி’ என்ற சொல்லின் மறுபடியும் வருதலும் பாதுகாக்கப்பட்டுள்ளன.
