- from: பகலை ஆளவும் இரவை ஆளவும், ஒளியையும் இருளையும் பிரித்துவைக்கவும்[a] அவற்றை ஏற்படுத்தினார். அது நல்லது என்று தேவன் கண்டார்.
  to: பகலை ஆளவும் இரவை ஆளவும், ஒளிக்கும் இருளுக்கும் இடையே பிரிவை ஏற்படுத்தவும். இது நல்லது என்று தேவன் கண்டார்.
  rationale: மூலத்தில் இல்லாத ‘அவற்றை ஏற்படுத்தினார்’ நீக்கப்பட்டுள்ளது. இரண்டு நோக்கத் தொடர்களும் முந்தைய வசனத்திலிருந்து தொடர்வதைத் தமிழில் வாசகர் உணரும்வகையில் துண்டுவாக்கியமாகவே வைக்கப்பட்டுள்ளது. ஒளி-இருள் தொடர்பான எபிரெய இடைநிலை அமைப்பு ‘இடையே பிரிவை ஏற்படுத்தவும்’ எனத் தெளிவாகக் கொடுக்கப்பட்டு, நல்லது என்ற மதிப்பீடு தேவனுடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
