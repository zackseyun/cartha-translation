  yaml_path: translation/ot/genesis/001/018.yaml
  text: and to rule over the day and over the night[a], and to separate the light from the darkness. And God saw that it was good.
translation:
  language: ta
  text: பகலை ஆளவும் இரவை ஆளவும், ஒளிக்கும் இருளுக்கும் இடையே பிரிவை ஏற்படுத்தவும். இது நல்லது என்று தேவன் கண்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/מְשֹׁל
  choice: ஆளவும்
  rationale: מָשַׁל இங்கு முந்தைய வசனத்தில் கூறப்பட்ட ஒளிச்சுடர்களின் நோக்கத்தையும் செயலையும் குறிக்கிறது. ‘ஆளவும்’ என்பது அவற்றின் நிர்வாகப் பணியை இயல்பான தமிழில் தருகிறது; தெய்வீக அல்லது சுயாதீன அதிகாரத்தைச் சேர்த்துக் கூறுவதில்லை.
- source_word: בַּ/יּוֹם וּ/בַ/לַּיְלָה
  choice: பகலை ஆளவும் இரவை ஆளவும்
  rationale: எபிரெயத்தில் பகலும் இரவும் தனித்தனியாக முன்னிடைச்சொல்லுடன் இணைக்கப்பட்டுள்ளன. தமிழில் வினையை மீண்டும் கூறுவது அந்த இணை அமைப்பையும் தெளிவையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: וּֽ/לֲ/הַבְדִּיל
  choice: பிரித்துவைக்கவும்
  rationale: הבדיל என்பது ஒன்றிலிருந்து மற்றொன்றைப் பிரித்து ஒழுங்குபடுத்தும் செயலைக் குறிக்கிறது. ‘பிரித்துவைக்கவும்’ என்பது ஆதியாகமம் 1-இன் படைப்புச் செயலுக்குரிய தெளிவான, இயல்பான தமிழ்; ‘வேறுபடுத்தவும்’ என்ற பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בֵּין הָ/אוֹר וּ/בֵין הַ/חֹשֶׁךְ
  choice: ஒளியையும் இருளையும்
  rationale: ‘பிரித்துவைக்க’ என்ற தமிழ் வினையுடன் இரு பொருட்களையும் ‘-ஐ’ வேற்றுமையில் இணைப்பது இயல்பானது; எபிரெயத்தின் ‘இடையில் ... இடையில்’ என்ற கட்டமைப்பின் பொருளை முழுமையாகத் தருகிறது.
- source_word: וַ/יַּרְא אֱלֹהִים
  choice: தேவன் கண்டார்
  rationale: வாவ் தொடர்ச்சியால் முன்னேறும் எபிரெயக் கதைநடையை தமிழில் இயல்பான வாக்கியத் தொடராகக் காக்கிறது.
- source_word: כִּי טוֹב
  choice: அது நல்லது என்று
  rationale: טוֹב என்பதன் நன்மை, பொருத்தம், படைப்பொழுங்கிற்கு ஏற்ற தன்மை ஆகிய பரப்பை ‘நல்லது’ காக்கிறது. எபிரெயத்தில் வெளிப்படையாக இல்லாத எழுவாயைத் தமிழின் இயல்புக்காக ‘அது’ எனக் குறிப்பிடுகிறது.
theological_decisions:
- issue: படைப்பில் வானத்து ஒளிச்சுடர்களின் பணி
  choice: அவை பகலையும் இரவையும் ஆளவும் ஒளியையும் இருளையும் பிரித்துவைக்கவும் ஏற்படுத்தப்பட்டன என்று மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ஒளிச்சுடர்களைத் தனித்த தெய்வீக ஆட்சியாளர்களாகப் பொருள்படுத்தும் மனிதரூப அல்லது புராண வாசிப்பு.
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் நோக்க வினையெச்சங்கள், ஒளிச்சுடர்களுக்கு தேவன் படைப்பொழுங்குக்குள் அளித்த பணிகளைக் கூறுகின்றன. ‘ஆளவும்’ என்ற மூலத்தின் வலிமை காக்கப்படுகிறது; ஆனால் மூலத்தில் இல்லாத தெய்வீகத்தன்மையோ சுயாதீன ஆற்றலோ சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் படைப்புக் கதைநடையின் சுருக்கமான ஓசையும் காக்கப்பட்டுள்ளன. முந்தைய வசனத்திலிருந்து தொடரும் நோக்கத்தைத் தமிழில் முழுமையான வாக்கியமாக்க ‘அவற்றை ஏற்படுத்தினார்’ சேர்க்கப்பட்டுள்ளது; இது 1:17-இல் உள்ள தேவனின் செயலை மீண்டும் வெளிப்படுத்தும் சூழல்சார் நிறைவு.
