  text: וַ/יַּ֣עַשׂ אֱלֹהִים֮ אֶת הָ/רָקִיעַ֒ וַ/יַּבְדֵּ֗ל בֵּ֤ין הַ/מַּ֨יִם֙ אֲשֶׁר֙ מִ/תַּ֣חַת לָ/רָקִ֔יעַ וּ/בֵ֣ין הַ/מַּ֔יִם אֲשֶׁ֖ר מֵ/עַ֣ל לָ/רָקִ֑יעַ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/007.yaml
  text: So God made the expanse and separated the waters that were under the expanse from the waters that were above the expanse[a]. And it was so.
translation:
  language: ta
  text: கடவுள் விரிந்த பரப்பை[a] உண்டாக்கி, அந்தப் பரப்புக்குக் கீழே இருந்த நீரை அந்தப் பரப்புக்கு மேலே இருந்த நீரிலிருந்து பிரித்தார். அவ்வாறே ஆனது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆகாயமண்டலம்’ (மரபுவழக்கு) என்றும் மொழிபெயர்க்கலாம்; ‘விதானம்’ என்பதும் சாத்தியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: உண்டாக்கி
  rationale: עָשָׂה என்பதன் பொதுவான ‘செய்/உண்டாக்கு’ பொருளை படைப்புச் சூழலில் இயல்பாகத் தருகிறது; ‘வடிவமைத்தார்’ போன்ற கூடுதல் நுட்பத்தைப் புகுத்தவில்லை.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: ஒருமை வினையுடன் வரும் ஒரே படைப்பாளரைக் குறிக்கும் சொல்லுக்கு, நவீன பொதுத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ள இணைச்சொல்.
- source_word: הָרָקִיעַ
  choice: விரிந்த பரப்பு
  rationale: רָקִיעַ என்பதில் உள்ள விரிக்கப்பட்ட அல்லது பரப்பப்பட்ட ஒன்றின் கருத்தைத் தக்கவைக்கிறது; அதன் துல்லியமான வடிவத்தையோ பொருளமைப்பையோ தேவையின்றி நிர்ணயிக்கவில்லை.
- source_word: וַיַּבְדֵּל
  choice: பிரித்தார்
  rationale: בָּדַל என்பதன் பிரித்தல் அல்லது வேறுபடுத்தல் என்ற அடிப்படைப் பொருளையும் ஆதியாகமம் 1-இன் ஒழுங்கமைக்கும் தொடரையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: בֵּין ... וּבֵין
  choice: நீரை ... நீரிலிருந்து
  rationale: எபிரெயத்தில் இரு பகுதிகளுக்கிடையிலான பிரிவைக் குறிக்கும் அமைப்பை, ‘பிரி’ என்ற தமிழ் வினையுடன் இயல்பான வேற்றுமை அமைப்பில் தருகிறது.
- source_word: הַמַּיִם
  choice: நீர்
  rationale: מַיִם வடிவத்தில் பன்மையாக இருந்தாலும் தொகுதிப்பொருள் கொண்டது; தமிழில் ‘நீர்’ என்பதே இயல்பான தொகுதிப்பெயர். இரு நீர்த்தொகுதிகளின் வேறுபாடு வாக்கிய அமைப்பால் தெளிவாகிறது.
- source_word: אֲשֶׁר מִתַּחַת לָרָקִיעַ
  choice: அந்தப் பரப்புக்குக் கீழே இருந்த
  rationale: செங்குத்தான இடவுறவைத் தெளிவாகக் காட்டி, ‘மேலே’ என்பதற்கான இயல்பான எதிரிணையை உருவாக்குகிறது.
- source_word: אֲשֶׁר מֵעַל לָרָקִיעַ
  choice: அதற்கு மேலே இருந்த
  rationale: மூலத்தின் மேலே/கீழே என்ற இடவியல் எதிர்மறையை எளிய நவீன தமிழில் பாதுகாக்கிறது.
- source_word: וַיְהִי כֵן
  choice: அவ்வாறே ஆனது
  rationale: கடவுளின் கட்டளை நிறைவேறியதைக் குறிக்கும் ஆதியாகமம் 1-இன் திரும்பிவரும் சூத்திரத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: படைப்புச் சூழலில் רָקִיעַ என்பதன் அண்டவியல் உட்பொருள்
  choice: விரிந்த பரப்பு
  alternative: ஆகாயமண்டலம்; கவிகை
  rationale: ‘விரிந்த பரப்பு’ என்பது சொல்லின் பரப்பப்பட்ட தன்மையை வெளிப்படுத்துகிறது. அதேவேளையில், அது ஒரு திடமான கட்டமைப்பு என்றோ குறிப்பிட்ட வடிவமுள்ள கவிகை என்றோ உரை கூறுவதைக் காட்டிலும் அதிகமாகத் தீர்மானிப்பதில்லை; ஆகவே மூலத்தில் நிலவும் விளக்கத் திறப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் எளிதில் புரியும், ஆனால் படைப்புக் கதை உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வானம்’ என்று மட்டும் மொழிபெயர்த்து மூலச்சொல்லின் படிமத்தைச் சுருக்குவதும், திடமான அண்டவியல் அமைப்பை வெளிப்படையாகப் புகுத்துவதும் தவிர்க்கப்பட்டுள்ளது.
