source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יְהִ֥י רָקִ֖יעַ בְּ/ת֣וֹךְ הַ/מָּ֑יִם וִ/יהִ֣י מַבְדִּ֔יל בֵּ֥ין מַ֖יִם לָ/מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/006.yaml
  text: And God said[a], “Let there be an expanse in the midst of the waters[b], and let it separate water from water.”
translation:
  language: ta
  text: அப்போது தேவன், “நீர்த்திரள்களின் நடுவே ஒரு விரிந்த பரப்பு[a] உண்டாகட்டும்; அது ஒரு நீர்த்திரளை மற்றொரு நீர்த்திரளிலிருந்து பிரிக்கட்டும்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விரிவு,’ ‘வானவளைவு’ அல்லது ‘கவிகை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் רָקִיעַ, விரிக்கப்பட்ட அல்லது பரப்பப்பட்ட ஒன்றைக் குறிக்கிறது; அது பண்டைய அண்டவியல் படிமத்தை எவ்வளவு வெளிப்படையாகக் காட்ட வேண்டும் என்பதற்கேற்ப மொழிபெயர்ப்புகள் வேறுபடுகின்றன.
    reason: lexical_alternative
  - marker: b
    text: சொற்படியாக, ‘நீருக்கும் நீருக்கும் இடையே பிரிப்பதாக.’ அதாவது, ஒரு நீர்த்திரளை மற்றொன்றிலிருந்து வேறுபடுத்துவது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது … என்றார்
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுத்துச் செல்கிறது. தமிழில் இயல்பான வாக்கிய அமைப்புக்காகச் சொல்லும் வினை மேற்கோளின் முடிவில் வைக்கப்பட்டு, தொடர்ச்சியை ‘அப்போது’ காட்டுகிறது.
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: இங்கு பன்மை வடிவமுள்ள பெயர்ச்சொல் ஒருமை வினையுடன் வந்து ஒரே படைப்பாளரைக் குறிக்கிறது; ‘தேவன்’ என்பது நவீனத் தமிழில் நிலைபெற்ற, கண்ணியமான மொழிபெயர்ப்பு.
- source_word: יְהִי
  choice: உண்டாகட்டும்
  rationale: היה என்பதன் விருப்பவினை வடிவம் தெய்வீகக் கட்டளையின் நிகழ்த்தும் வலிமையை வெளிப்படுத்துகிறது; ‘உண்டாகட்டும்’ அதை இயல்பாகத் தருகிறது.
- source_word: רָקִיעַ
  choice: விரிந்த பரப்பு
  rationale: இந்தச் சொல் விரிக்கப்பட்ட அல்லது பரப்பப்பட்ட ஒன்றைக் குறிக்கிறது. ‘விரிந்த பரப்பு’ அந்த அடிப்படைப் படிமத்தைத் தக்கவைத்தாலும், ஒரு குறிப்பிட்ட பண்டைய அண்டவியல் வடிவத்தைத் தீர்மானமாகத் திணிப்பதில்லை.
- source_word: בְּתוֹךְ הַמָּיִם
  choice: நீர்த்திரள்களின் நடுவே
  rationale: בְּתוֹךְ நடுவிலான இடத்தையும், מַיִם இங்கு ஆதிகால நீரைப் பன்மை/கூட்டுப் படிமமாகவும் குறிக்கின்றன. ‘நீர்த்திரள்கள்’ தமிழில் இரண்டு நீர்ப் பகுதிகள் என்ற சூழலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וִיהִי מַבְדִּיל
  choice: அது … பிரிக்கட்டும்
  rationale: இரண்டாவது விருப்பவினை முன் குறிப்பிடப்பட்ட விரிந்த பரப்பின் பணியைத் தொடர்கிறது. எபிரெயப் பங்கேற்புவினையின் பிரிப்புச் செயலை ‘பிரிக்கட்டும்’ தெளிவாகத் தருகிறது.
- source_word: בֵּין מַיִם לָמָיִם
  choice: ஒரு நீர்த்திரளை மற்றொரு நீர்த்திரளிலிருந்து
  rationale: எபிரெயத்தில் சொற்படியாக ‘நீருக்கும் நீருக்கும் இடையே’ உள்ளது. தமிழில் ‘பிரி’ வினையுடன் இந்த வடிவம் இயல்பாக இருந்து, இரு நீர்த்திரள்கள் வேறுபடுத்தப்படுவதைத் தெரிவிக்கிறது.
theological_decisions:
- issue: רָקִיעַ என்ற சொல்லுக்கும் பண்டைய அண்டவியல் படிமத்திற்கும் உள்ள தொடர்பு
  choice: விரிந்த பரப்பு
  alternative: விரிவு; வானவளைவு; கவிகை போன்ற உறுதியான மூடமைப்பு
  rationale: வசனம் நீர்த்திரள்களின் நடுவில் பிரிக்கும் ஒன்றை தேவன் உண்டாக்குவதாகக் கூறுகிறது. ‘விரிந்த பரப்பு’ என்பது விரிக்கப்பட்ட ஒன்றென்ற எபிரெயப் படிமத்தைப் பேணுகிறது; அதேவேளை அது திடமான வானக்கூரையா அல்லது வெறும் பரப்பா என்ற விவாதத்தை முதன்மை உரையில் தீர்த்துவிடுவதில்லை. மாற்று வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. தமிழின் இயல்பான மேற்கோள் அமைப்புக்காக ‘என்றார்’ முடிவில் வைக்கப்பட்டுள்ளது. ‘தண்ணீர்கள்’ என்ற அசட்டான நேரடி பன்மைக்குப் பதிலாக ‘நீர்த்திரள்கள்’ பயன்படுத்தப்பட்டு, மூலத்தின் கூட்டுப் பன்மைப் படிமம் காக்கப்பட்டுள்ளது.
