id: GEN.1.15
reference: Genesis 1:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הָי֤וּ לִ/מְאוֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הָאִ֖יר עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/015.yaml
  text: And let them be for lights in the expanse of the heavens to give light on the earth[b][a]. And it was so.
translation:
  language: ta
  text: அவை வானவிரிவில்[b] ஒளி தரும் வான்பொருட்களாக[a] இருந்து, பூமியின்மேல் ஒளி கொடுக்கட்டும். அப்படியே ஆனது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒளியூட்டும் பொருட்களாக.” இபிரேயச் சொல் வெறும் ஒளியைக் குறிக்காமல், ஒளி தரும் பொருட்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வானமண்டலத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: அவை ... இருக்கட்டும்
  rationale: முந்தைய வசனத்தில் தொடங்கும் படைப்புக் கட்டளையின் விருப்பவினைத் தொடர்ச்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இதை வெறும் எதிர்காலக் கூற்றாக மாற்றவில்லை.
- source_word: לִמְאוֹרֹת
  choice: ஒளிச்சுடர்களாக
  rationale: இச்சொல் வெறும் கருத்துருவான ‘ஒளி’யை அல்ல, ஒளி தரும் வான்பொருட்களைக் குறிக்கிறது. ‘ஒளிச்சுடர்கள்’ என்பது அந்தப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בִּרְקִיעַ הַשָּׁמַיִם
  choice: வானவிரிவில்
  rationale: רָקִיעַ என்பதன் விரிக்கப்பட்ட பரப்பு என்ற படிமத்தையும், הַשָּׁמַיִם என்பதன் வானம் சார்ந்த பொருளையும் தெளிவான நவீன தமிழில் இணைக்கிறது.
- source_word: לְהָאִיר
  choice: ஒளி கொடுப்பதற்காக
  rationale: இபிரேய வினையின் காரணவினைப் பொருளான ‘ஒளி உண்டாக்குதல்/ஒளி கொடுத்தல்’ என்பதைத் துல்லியமாகப் பிரதிபலிக்கிறது.
- source_word: עַל הָאָרֶץ
  choice: பூமியின்மேல்
  rationale: ஒளி செலுத்தப்படும் திசையையும் பரப்பையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיְהִי כֵן
  choice: அப்படியே ஆனது
  rationale: ஆதியாகமம் 1-இல் மீண்டும் வரும் கட்டளை நிறைவேற்றச் சூத்திரத்தைச் சுருக்கமாகவும் கண்ணியமாகவும் காக்கிறது.
theological_decisions:
- issue: படைப்புக் கூற்றில் וְהָיוּ என்பதன் விருப்பவினை வலிமை
  choice: ‘இருக்கட்டும்’ என்று கட்டளையின் தொடர்ச்சியாக மொழிபெயர்த்தல்
  alternative: ‘இருக்கும்’ என்று எளிய எதிர்காலமாக மொழிபெயர்த்தல்
  rationale: உடனடி இலக்கணச் சூழல் இதை வானொளிகளுக்கான இறை நியமனக் கட்டளையின் தொடர்ச்சியாகக் காட்டுகிறது. ‘இருக்கட்டும்’ என்பது கட்டளையையும் அதைத் தொடர்ந்து வரும் நிறைவேற்றத்தையும் பாதுகாக்கிறது; கூடுதல் கோட்பாட்டுப் பொருளைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வானவிரிவு’ இபிரேயப் படிமத்தைத் தக்கவைக்கிறது; ‘ஒளிச்சுடர்கள்’ சூழலில் குறிப்பிடப்படும் ஒளி தரும் வான்பொருட்களை இயல்பாகக் குறிக்கிறது.
