- from: அவை பூமியின்மேல் ஒளி கொடுப்பதற்காக வானவிரிவில்[b] ஒளிச்சுடர்களாக[a] இருக்கட்டும். அப்படியே ஆனது.
  to: அவை வானவிரிவில்[b] ஒளி தரும் வான்பொருட்களாக[a] இருந்து, பூமியின்மேல் ஒளி கொடுக்கட்டும். அப்படியே ஆனது.
  rationale: The revision retains the Hebrew volitive force, the expanse-of-the-heavens setting, the purpose of illuminating the earth, and the standard fulfillment formula. It replaces an expression that can denote light rays with wording that explicitly denotes light-giving celestial bodies, without importing a doctrinal interpretation.
