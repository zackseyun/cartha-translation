  text: וַ/יְבָ֣רֶךְ אֹתָ/ם֮ אֱלֹהִים֒ וַ/יֹּ֨אמֶר לָ/הֶ֜ם אֱלֹהִ֗ים פְּר֥וּ וּ/רְב֛וּ וּ/מִלְא֥וּ אֶת הָ/אָ֖רֶץ וְ/כִבְשֻׁ֑/הָ וּ/רְד֞וּ בִּ/דְגַ֤ת הַ/יָּם֙ וּ/בְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/בְ/כָל חַיָּ֖ה הָֽ/רֹמֶ֥שֶׂת עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/028.yaml
  text: And God blessed them[a], and God said to them, “Be fruitful, and multiply, and fill the earth, and subdue it, and rule over the fish of the sea, and over the birds of the heavens[b], and over every living thing that moves on the earth.”
translation:
  language: ta
  text: கடவுள் அவர்களை ஆசீர்வதித்தார். கடவுள் அவர்களிடம், “பலுகிப் பெருகுங்கள்; பூமியை நிரப்பி, அதைக் கீழ்ப்படுத்துங்கள்; கடலின் மீன்களையும், வானத்தின் பறவைகளையும், பூமியின்மேல் நகரும்[b] எல்லா உயிரினங்களையும் ஆளுங்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதிகாரம் செலுத்துங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “நகரும்” என்பதற்கு, “ஊர்ந்து செல்லும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: ஆசீர்வதித்தார்
  rationale: பரך என்பதன் பியேல் வடிவம் இங்கு வெறுமனே நல்வார்த்தை கூறுவதை அல்ல, ஆசீர்வாதத்தை வழங்குவதைக் குறிக்கிறது; ‘ஆசீர்வதித்தார்’ என்பது இயல்பான, துல்லியமான தமிழ்.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: பன்மை வடிவமாக இருந்தாலும் ஒருமை வினைச்சொல்லுடன் இங்கு இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கிறது.
- source_word: פְּרוּ וּרְבוּ
  choice: பலுகிப் பெருகுங்கள்
  rationale: இரண்டு கட்டளைகளும் இனப்பெருக்கத்தையும் எண்ணிக்கையில் அதிகரிப்பதையும் குறிக்கின்றன; நிலைபெற்ற தமிழ் சொற்றொடர் இரண்டின் இணைந்த வலிமையையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וּמִלְאוּ אֶת־הָאָרֶץ
  choice: பூமியை நிரப்பி
  rationale: בראשית 1-ன் உலகளாவிய படைப்புச் சூழலில் אֶרֶץ ஒரு குறிப்பிட்ட நாட்டை அல்ல, பூமியைக் குறிக்கிறது; מלא-வின் நேரடியான பொருள் ‘நிரப்பு’.
- source_word: וְכִבְשֻׁהָ
  choice: அதைக் கீழ்ப்படுத்துங்கள்
  rationale: כבש என்பது கட்டுப்பாட்டுக்குள் கொண்டுவருதல் அல்லது கீழ்ப்படுத்துதல் என்ற வலுவான பொருளுடையது; பராமரித்தல் என்று மென்மையாக்காமல் அதன் வலிமையைப் பாதுகாக்கிறது.
- source_word: וּרְדוּ
  choice: ஆளுங்கள்
  rationale: רדה என்பது அதிகாரத்துடன் ஆட்சி அல்லது ஆளுகை செய்வதைக் குறிக்கிறது; ‘ஆளுங்கள்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: בִּדְגַת הַיָּם
  choice: கடலின் மீன்களை
  rationale: இந்த எபிரெயச் சொற்றொடர் பொதுவான கடல்வாழ் உயிர்களையல்ல, குறிப்பாக மீன்களைக் குறிப்பிடுகிறது.
- source_word: בְעוֹף הַשָּׁמַיִם
  choice: வானத்தின் பறவைகளை
  rationale: עוֹף விரிவாகப் பறக்கும் உயிர்களைக் குறிக்கக்கூடியதாயினும், இச்சூழலில் ‘பறவைகள்’ இயல்பான பொருத்தம்; שָׁמַיִם இங்கு ‘வானம்’ என வழங்கப்படுகிறது.
- source_word: בְכָל־חַיָּה הָרֹמֶשֶׂת
  choice: நகரும் எல்லா உயிரினங்களையும்
  rationale: חַיָּה என்பது பரந்த பொருளில் உயிரினம் அல்லது விலங்கைக் குறிக்கிறது; רמש தரையில் நகர்வதைக் குறிக்கிறது. ‘நகரும்’ என்பது தேவையற்ற அளவு பொருளைக் குறுக்காமல் அதன் பரப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: כבש மற்றும் רדה ஆகியவற்றில் மனிதருக்கு வழங்கப்படும் அதிகாரத்தின் வலிமை
  choice: ‘கீழ்ப்படுத்துங்கள்’ மற்றும் ‘ஆளுங்கள்’ என்ற வலுவான ஆளுகை மொழியைத் தக்கவைத்தல்
  alternative: ‘பராமரியுங்கள்’ அல்லது ‘பொறுப்பாளர்களாக இருங்கள்’
  rationale: எபிரெய வினைச்சொற்கள் வெறும் பராமரிப்பைவிட வலுவானவை. சுரண்டலை ஆதரிக்கும் விளக்கத்தையும், உரையை மென்மையாக்கும் சூழலியல் விரிவுரையையும் சேர்க்காமல் மூலத்தின் வலிமை பாதுகாக்கப்படுகிறது.
- issue: הָאָרֶץ என்பதன் பரப்பு
  choice: ‘பூமி’
  alternative: ‘நாடு’ அல்லது ‘நிலம்’
  rationale: ஆதியாகமம் 1-ன் பிரபஞ்சப் படைப்புச் சூழலில் இது ஒரு குறிப்பிட்ட நிலப்பகுதியைக் காட்டிலும் முழுப் பூமியையே குறிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. மூலத்தில் ‘கடவுள்’ இருமுறை வருவது பாதுகாக்கப்பட்டுள்ளது. தொடர்ச்சியான கட்டளைகள் அரைப்புள்ளிகளால் தெளிவுபடுத்தப்பட்டுள்ளன; ‘பலுகிப் பெருகுங்கள்’ என்ற நிலைபெற்ற சொற்றொடர் சாதாரண வாசகருக்கும் புரியும் வகையில் தக்கவைக்கப்பட்டுள்ளது.
