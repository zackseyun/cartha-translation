source:
  edition: WLC
  text: וַ/יַּ֧רְא אֱלֹהִ֛ים אֶת הָ/א֖וֹר כִּי ט֑וֹב וַ/יַּבְדֵּ֣ל אֱלֹהִ֔ים בֵּ֥ין הָ/א֖וֹר וּ/בֵ֥ין הַ/חֹֽשֶׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/004.yaml
  text: And God saw that the light was good[a], and God separated the light from the darkness.
translation:
  language: ta
  text: ஒளி நல்லது என்று கடவுள் கண்டார்; கடவுள் ஒளியை இருளிலிருந்து பிரித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒளிக்கும் இருளுக்கும் இடையே வேறுபாடு ஏற்படுத்தினார்.” எபிரெய வினைச்சொல் இரண்டு பொருட்களுக்கு இடையே வேறுபாட்டை ஏற்படுத்துவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டார்
  rationale: ראה என்பதன் இயல்பான கதைநடைப் பொருள் ‘கண்டார்’. இச்சூழலில் மதிப்பிட்டு உணரும் நுண்பொருளும் இருந்தாலும், ‘கண்டார்’ என்பது அதைக் குறுக்காமல் மூலத்தின் நேரடிப் பொருளைப் பாதுகாக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும், இங்கு ஒருமை வினைச்சொல்லோடு வந்து ஒரே படைப்பாளரைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பான ஒருமை மொழிபெயர்ப்பு ‘கடவுள்’.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேர்செயப்படுபொருளைக் குறிக்கும் எபிரெய இலக்கண அடையாளம்; தமிழின் வேற்றுமை உருபுகளால் அதன் பணி வெளிப்படுகிறது.
- source_word: הָאוֹר
  choice: ஒளி / ஒளியை
  rationale: முந்தைய வசனத்தில் தோன்றிய குறிப்பிட்ட ஒளியைச் சுட்டும் சொல்லாக இருப்பதால், தமிழில் சூழலும் செயப்படுபொருள் உருபும் அதன் குறிப்புத்தன்மையை வெளிப்படுத்துகின்றன.
- source_word: כִּי
  choice: என்று
  rationale: கடவுள் கண்டறிந்ததன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் ‘என்று’ இயல்பான நிறைவு இணைப்பாகும்.
- source_word: טוֹב
  choice: நல்லது
  rationale: טוֹב என்பதன் பரந்த மதிப்பீட்டுப் பொருளை ‘நல்லது’ பாதுகாக்கிறது; ‘இனியது’ அல்லது ‘பயனுள்ளது’ போன்ற சொற்கள் பொருளை தேவையின்றிக் குறுக்கும்.
- source_word: וַיַּבְדֵּל
  choice: பிரித்தார்
  rationale: בדל என்பது பிரித்தல் அல்லது வேறுபடுத்துதல் எனப் பொருள்படும். ‘பிரித்தார்’ படைப்பின் ஒழுங்கமைப்புச் சூழலுக்கு ஏற்ற, தெளிவான நவீனத் தமிழ் வடிவம்; வேறுபடுத்துதல் என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בֵּין ... וּבֵין
  choice: ஒளியை இருளிலிருந்து
  rationale: எபிரெயத்தில் சொற்சொல்லாக ‘ஒளிக்கும் இருளுக்கும் இடையில்’ என்ற அமைப்பு உள்ளது. ‘பிரித்தார்’ என்பதோடு தமிழில் ‘ஒளியை இருளிலிருந்து’ என்பது இயல்பாக இருந்து அதே உறவைத் தெரிவிக்கிறது.
- source_word: הַחֹשֶׁךְ
  choice: இருள் / இருளிலிருந்து
  rationale: ஏற்கெனவே குறிப்பிடப்பட்ட இருளைக் குறிக்கிறது; தமிழில் சூழலும் ‘இருளிலிருந்து’ என்ற வேற்றுமை வடிவமும் மூலத்தின் பொருளை இயல்பாக வெளிப்படுத்துகின்றன.
theological_decisions:
- issue: இரு வாக்கியங்களிலும் אֱלֹהִים என்ற எழுவாயைத் திரும்பக் கூறுதல்
  choice: இரண்டாம் வாக்கியத்திலும் ‘கடவுள்’ என்று மீண்டும் கூறப்பட்டுள்ளது.
  alternative: இரண்டாம் வாக்கியத்தில் எழுவாயை விடுதல் அல்லது ‘அவர்’ என்று கூறுதல்.
  rationale: எபிரெய மூலம் தெய்வீக எழுவாயை வெளிப்படையாகத் திரும்பக் கூறுகிறது. அதைத் தக்கவைப்பது மூலத்தின் ஓசையையும் வலியுறுத்தலையும் பாதுகாக்கிறது.
- issue: ஒளிக்கும் இருளுக்கும் இடையிலான பிரிவின் இயல்பு
  choice: அது இடம் சார்ந்ததா, காலம் சார்ந்ததா, கருத்து சார்ந்ததா என்று வரையறுக்காமல் ‘பிரித்தார்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘வேறுபடுத்தினார்’ அல்லது பிரிவின் முறையை விளக்கும் விரிவான மொழிபெயர்ப்பு.
  rationale: கடவுள் ஒளியை இருளிலிருந்து பிரித்தார் என்று மட்டுமே உரை கூறுகிறது; அதன் முறையை விளக்கவில்லை. ஆகவே மூலத்தில் உள்ள இறையியல் மற்றும் அண்டவியல் திறந்தநிலை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தில் ‘கடவுள்’ இருமுறை வருவதால் அந்த மீளுரையும் தக்கவைக்கப்பட்டுள்ளது; தமிழ் வாசிப்பின் இயல்புக்காக இணைப்புச் சொல் இல்லாமல் இரண்டு சுருக்கமான வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
