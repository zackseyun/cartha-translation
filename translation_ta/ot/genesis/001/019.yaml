    text: எபிரெயச் சொல்லமைப்பிற்கு நெருக்கமாக, “மாலை ஆனது; காலை ஆனது—நான்காம் நாள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: வந்தது
  rationale: இங்கு היה வினையின் தொடர்கதை வடிவம் ஒவ்வொரு படைப்பு நாளின் நிறைவையும் குறிக்கும் திரும்பவரும் வாய்பாட்டில் உள்ளது. தமிழில் மாலையும் காலையும் அடுத்தடுத்து நிகழ்வதை இயல்பாகச் சொல்ல ‘வந்தது’ பயன்படுத்தப்பட்டுள்ளது; இதை ‘உருவானது’ என்று மிகையாகப் பொருள்கொள்ளவில்லை.
- source_word: עֶרֶב
  choice: மாலை
  rationale: இந்தப் பெயர்ச்சொல்லின் நேரடியான, இன்றைய பொதுத் தமிழுக்கு இயல்பான இணை ‘மாலை’; திரும்பவரும் படைப்பு நாள் வாய்பாட்டுக்கும் இது பொருந்துகிறது.
- source_word: וַיְהִי
  choice: வந்தது
  rationale: எபிரெய மொழியின் ஓசையையும் இணை அமைப்பையும் காக்க, மீண்டும் வரும் வினைச்சொல் முதலாவது இடத்தைப் போலவே மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֹּקֶר
  choice: காலை
  rationale: இந்தப் பெயர்ச்சொல்லின் நேரடியான, இயல்பான தமிழ் இணை ‘காலை’. ‘விடியல்’ என்பது பொருளை நாளின் தொடக்கக் கணத்திற்குச் சற்றுக் குறுக்கிவிடக்கூடும்.
- source_word: יוֹם רְבִיעִי
  choice: நான்காம் நாள்
  rationale: எபிரெயத் தொடர் நாளை வரிசை எண்ணால் அடையாளப்படுத்துகிறது. தனியான சுட்டிடைச்சொல் இல்லாத அமைப்பைத் தமிழில் இயல்பாக ‘நான்காம் நாள்’ எனக் கொடுக்க முடிகிறது.
theological_decisions:
- issue: படைப்பு நாளின் தன்மை அல்லது காலநீளம் குறித்த ஒரு குறிப்பிட்ட விளக்கத்தை மொழிபெயர்ப்பில் புகுத்தாமல் இருத்தல்
  choice: மாலை வந்தது; காலை வந்தது—நான்காம் நாள்.
  alternative: மாலை ஆனது; காலை ஆனது—ஒரு நான்காம் நாள்.
  rationale: எபிரெய மொழியின் திரும்பவரும் வாய்பாடு நேரடியாகப் பாதுகாக்கப்படுகிறது. ‘நாள்’ என்பதன் தன்மை அல்லது நீளம் பற்றிய பரந்த விளக்க விவாதங்களை இந்த மொழிபெயர்ப்பு தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் இருக்க ‘மாலை வந்தது; காலை வந்தது’ என அமைக்கப்பட்டுள்ளது. அரைப்புள்ளியும் நீள்கோடும் எபிரெய வாய்பாட்டின் இணை அமைப்பையும் நாள் அடையாளத்தின் நிறைவுத் தன்மையையும் தெளிவாக்குகின்றன.
