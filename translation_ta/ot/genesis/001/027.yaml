id: GEN.1.27
reference: Genesis 1:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּבְרָ֨א אֱלֹהִ֤ים אֶת הָֽ/אָדָם֙ בְּ/צַלְמ֔/וֹ בְּ/צֶ֥לֶם אֱלֹהִ֖ים בָּרָ֣א אֹת֑/וֹ זָכָ֥ר וּ/נְקֵבָ֖ה בָּרָ֥א אֹתָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/027.yaml
  text: So God created man in his image[a]; in the image of God he created him; male and female he created them.
translation:
  language: ta
  text: இவ்வாறு கடவுள் மனிதனை[a] தம் சாயலில் படைத்தார்; கடவுளின் சாயலில் அவனைப் படைத்தார்; ஆணும் பெண்ணுமாக அவர்களைப் படைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மனிதகுலத்தை.’ இங்குள்ள எபிரெயச் சொல் ‘ஆதாம்’ இலக்கணத்தில் ஒருமையாக இருந்தாலும், மனிதகுலம் முழுவதையும் பிரதிநிதித்துவமாகக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרָא / בָּרָא
  choice: படைத்தார்
  rationale: தெய்வீகப் படைப்பைக் குறிக்கும் வினையாகவும், மூன்று முறை வரும் எபிரெயச் சொல்லின் மீளுரைப்பைப் பாதுகாக்கவும் ‘படைத்தார்’ பயன்படுத்தப்பட்டது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு ஒருமை வினையுடன் வரும் இச்சொல் ஒரே கடவுளைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பான பொதுப் பெயர் ‘கடவுள்’.
- source_word: הָאָדָם
  choice: மனிதன் (வேற்றுமை வடிவில் ‘மனிதனை’)
  rationale: இது இலக்கண ஒருமையில் இருந்தாலும், தொடர்ந்து வரும் ‘ஆணும் பெண்ணுமாக அவர்களை’ என்பதால் மனிதகுலம் முழுவதையும் பிரதிநிதித்துவ ஒருமையில் குறிக்கிறது. ‘மனிதனை’ அந்த ஒருமை–பன்மை நகர்வைப் பாதுகாக்கிறது.
- source_word: בְּצַלְמוֹ
  choice: தம் சாயலில்
  rationale: ‘தம்’ என்பது கடவுளையே திரும்பச் சுட்டும் மரியாதைமிக்க தமிழ்ச் சொல்; ‘சாயல்’ צֶלֶם என்பதன் உருவம்/பிரதிபலிப்பு சார்ந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: கடவுளின் சாயலில்
  rationale: முந்தைய சொற்றொடரை மீண்டும் வலியுறுத்தும் எபிரெய இணைநடையைப் பாதுகாக்க ‘சாயல்’ மீண்டும் கூறப்பட்டுள்ளது.
- source_word: אֹתוֹ
  choice: அவனை
  rationale: הָאָדָם என்பதைக் குறிக்கும் ஆண்பால் ஒருமைப் பதிலிடுபெயரைப் பாதுகாத்து, பின்னர் வரும் பன்மைக்கு நகர்வைத் தெளிவாக்குகிறது.
- source_word: זָכָר וּנְקֵבָה
  choice: ஆணும் பெண்ணுமாக
  rationale: இவை ஆண்–பெண் பாலினத்தைக் குறிக்கும் சொற்கள்; தமிழில் இயல்பாகவும் துல்லியமாகவும் இந்த இணை அவற்றை வெளிப்படுத்துகிறது.
- source_word: אֹתָם
  choice: அவர்களை
  rationale: பிரதிநிதித்துவ ஒருமையிலிருந்து மனிதர்களின் பன்மைக்கு மாறும் மூலவாக்கிய அமைப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: אָדָם என்பதன் பிரதிநிதித்துவ மனிதகுலப் பொருள்
  choice: மனிதன் / மனிதனை
  alternative: மனிதகுலம் / மனிதகுலத்தை
  rationale: மூலத்தில் אָדָם ஒருமையாகவும் அதனைச் சுட்டும் பதிலிடுபெயர் ஒருமையாகவும் உள்ளது; பின்னர் ‘ஆணும் பெண்ணுமாக அவர்களை’ என்று பன்மைக்கு மாறுகிறது. ‘மனிதனை’ இந்த இலக்கிய மற்றும் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது; உள்ளடங்கிய மனிதகுலப் பொருள் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- issue: கடவுளின் ‘சாயல்’ என்ற உறவு
  choice: தம் சாயலில் / கடவுளின் சாயலில்
  alternative: தமது உருவமாக / கடவுளின் உருவமாக
  rationale: בְּ என்ற முன்னிடைச்சொல்லின் ‘இல்’ உறவை நேரடியாக வைத்திருப்பதால், மனிதன் கடவுளின் சாயலாகவே இருக்கிறானா அல்லது அந்தச் சாயலுக்கேற்ப படைக்கப்பட்டானா என்ற விவாதத்தை மொழிபெயர்ப்பு தேவையின்றித் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் மாண்பும் இணைந்த நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளைக் குறிக்கும் வினைகளில் மரியாதைப் பன்மை வந்தாலும், ‘தம்’ கடவுளையே சுட்டும் வகையில் அமைந்துள்ளது. மூலத்தின் மூன்று முறை ‘படைத்தார்’ என்ற மீளுரைப்பும், ‘அவனை’ என்ற ஒருமையிலிருந்து ‘அவர்களை’ என்ற பன்மைக்கு நகர்வும் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன.
