  terminology: ‘கடவுள்,’ ‘படைத்தார்,’ and ‘சாயல்’ are suitable, consistent theological terms. ‘மனிதனை’ retains the grammatically singular representative expression, and the footnote responsibly supplies ‘மனிதகுலத்தை’ as the inclusive contextual alternative. The footnote anchor is correctly placed after the initial occurrence of the contested term.
