id: GEN.1.10
reference: Genesis 1:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֱלֹהִ֤ים לַ/יַּבָּשָׁה֙ אֶ֔רֶץ וּ/לְ/מִקְוֵ֥ה הַ/מַּ֖יִם קָרָ֣א יַמִּ֑ים וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/010.yaml
  text: And God called the dry land Earth[a], and the gathering of the waters he called Seas. And God saw that it was good.
translation:
  language: ta
  text: கடவுள் உலர்ந்த தரைக்கு “நிலம்”[a] என்றும், ஒன்றாகத் திரண்ட தண்ணீருக்கு “கடல்கள்” என்றும் பெயரிட்டார். அது நல்லது என்று கடவுள் கண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நிலம்” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரேயச் சொல் “நிலம்” அல்லது “பூமி” என்றும் பொருள்படும். இப்பெயரிடும் சூழலில் இதை உலர்ந்த தரைக்கு வழங்கப்பட்ட பெயராகவோ, பொதுப்பெயராகவோ புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא / קָרָא
  choice: பெயரிட்டார்
  rationale: இங்கு வினைச்சொல் பெயரிடுவதையோ ஒரு பெயரால் குறிப்பிடுவதையோ குறிக்கிறது. தமிழில் பெயரிடும் சூழலில் “பெயரிட்டார்” இயல்பாகவும் தெளிவாகவும் உள்ளது; இரு பயன்பாடுகளையும் ஒரே வினையால் இணைத்து எபிரேய இணை அமைப்பு பேணப்படுகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: ஆதியாகமம் 1-இல் பன்மை வடிவமுள்ள இச்சொல் ஒருமை வினையுடன் வந்து ஒரே படைப்பாளரைக் குறிக்கிறது; நவீன பொதுத் தமிழில் “கடவுள்” நேரடியான, சமயப் பிரிவு சாராத இணைச்சொல்.
- source_word: לַיַּבָּשָׁה
  choice: உலர்ந்த தரைக்கு
  rationale: திரண்ட தண்ணீரிலிருந்து வேறுபடுத்தப்பட்ட உலர்ந்த நிலப்பரப்பை இச்சொல் குறிக்கிறது. அடுத்துவரும் “நிலம்” என்ற பெயருடன் தேவையற்ற சொல் மறுபடியும் வராமல், இயல்பான தமிழில் “உலர்ந்த தரை” என வழங்கப்படுகிறது.
- source_word: אֶרֶץ
  choice: “நிலம்”
  rationale: இச்சொல் நிலம் அல்லது பூமி எனப் பொருள்படலாம். இங்கு உலர்ந்த தரைக்கு வழங்கப்படும் பெயராக வருவதால் மேற்கோள் குறிகள் பெயரிடும் பண்பை வெளிப்படுத்துகின்றன; தமிழில் பெரிய எழுத்து வேறுபாடு இல்லாததால் பெயர்/பொதுப்பெயர் இருமை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִקְוֵה הַמַּיִם
  choice: ஒன்றாகத் திரண்ட தண்ணீருக்கு
  rationale: מִקְוֵה என்பது திரட்சி அல்லது ஒன்றுகூடல் என்ற கூட்டுப் பொருளைக் கொண்டது. சொல்லுக்கு சொல் அமைப்பான “தண்ணீரின் திரட்சி” என்பதைக் காட்டிலும் இவ்வடிவம் இயல்பான தமிழில் அதே கருத்தைத் தருகிறது.
- source_word: יַמִּים
  choice: “கடல்கள்”
  rationale: எபிரேய பன்மை வடிவம் பேணப்படுகிறது; மேற்கோள் குறிகள் இது வழங்கப்பட்ட பெயர் என்பதைத் தெளிவாக்குகின்றன.
- source_word: וַיַּרְא
  choice: கண்டார்
  rationale: ஆதியாகமம் 1 முழுவதும் மீளும் மதிப்பீட்டு வாய்பாட்டின் எளிமையையும் நேரடித்தன்மையையும் “கண்டார்” பேணுகிறது.
- source_word: כִּי טוֹב
  choice: அது நல்லது என்று
  rationale: “நல்லது” என்பது טוֹב என்பதன் பரந்த பொருளை அழகு, பயன்பாடு அல்லது ஒழுக்க நன்மை என ஒன்றுக்குள் மட்டும் சுருக்காமல் வைத்திருக்கிறது.
theological_decisions:
- issue: אֶרֶץ என்பதை பொதுப்பெயராகவா, பெயரிடும் வாய்பாட்டில் தனிப்பெயராகவா வழங்குவது
  choice: “நிலம்” என்பதை மேற்கோள் குறிகளுடன் வழங்கி, பெயராகச் செயல்படுவதைச் சுட்டுதல்
  alternative: மேற்கோள் குறிகள் இல்லாமல் பொதுப்பெயராக “நிலம்” அல்லது “பூமி” என வழங்குதல்
  rationale: கடவுள் உலர்ந்த தரைக்குப் பெயரிடுகிறார் என்பது உரையில் வெளிப்படையாக உள்ளது. ஆனால் எபிரேயச் சொல் பொதுப்பெயராகவும் இயங்கக்கூடும்; தமிழில் capitalization இல்லாததால் மேற்கோள் குறிகளும் அடிக்குறிப்பும் இரு சாத்தியங்களையும் உரியவாறு காக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. பெயரிடும் இணை அமைப்பை இயல்பான ஒரே வாக்கியமாக வைத்துள்ளது; “தண்ணீரின் திரட்சி” போன்ற செயற்கையான சொல்லாட்சியைத் தவிர்த்து, மூலத்தின் கூட்டுப் பொருளை “ஒன்றாகத் திரண்ட தண்ணீர்” எனத் தெளிவுபடுத்துகிறது.
