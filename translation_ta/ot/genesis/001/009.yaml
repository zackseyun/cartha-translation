  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יִקָּו֨וּ הַ/מַּ֜יִם מִ/תַּ֤חַת הַ/שָּׁמַ֨יִם֙ אֶל מָק֣וֹם אֶחָ֔ד וְ/תֵרָאֶ֖ה הַ/יַּבָּשָׁ֑ה וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/009.yaml
  text: And God said[a], “Let the waters under the heavens be gathered into one place, and let the dry land appear.” And it was so.
translation:
  language: ta
  text: 'கடவுள் கூறினார்: “வானத்தின்[a] கீழுள்ள நீர் ஒரே இடத்திற்குக் கூடட்டும்; உலர்ந்த நிலம் தோன்றட்டும்.” அப்படியே ஆனது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வானவெளியின் கீழுள்ள.” எபிரெயச் சொல் שָׁמַיִם சூழலுக்கேற்ப வானத்தையோ வானவெளியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: வாவ் தொடர் கதைநடையை முன்னெடுக்கிறது. தமிழில் இயல்பான நேர்கூற்று அமைப்பில் ‘என்றார்’ என்று முடிப்பது அந்தக் கதைநடையைத் தெளிவாகக் காக்கிறது; தனியாக ‘பின்பு’ என்று சேர்த்து காலவரிசையை மிகையாக விளக்கவில்லை.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு ஒருமை வினையுடன் வரும் இச்சொல் ஒரே படைப்பாளரைக் குறிக்கிறது; நவீன பொதுத் தமிழில் ‘கடவுள்’ இயல்பான, சமயப் பிரிவுசார்பற்ற இணைச்சொல்.
- source_word: יִקָּווּ
  choice: ஒன்றுகூடட்டும்
  rationale: இறைக் கட்டளையைக் குறிக்கும் வேண்டுகோள் வினைநிலையை ‘-ட்டும்’ காக்கிறது. ‘ஒன்றுகூடு’ நீர் ஒரே இடத்தில் திரள்வதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמַּיִם
  choice: நீர்
  rationale: எபிரெயச் சொல் வடிவில் பன்மையாக இருந்தாலும், தமிழில் ‘நீர்’ இயல்பாகத் திரள்பொருளைக் குறிக்கிறது. ‘நீர்கள்’ என்பது இச்சூழலில் செயற்கையாக ஒலிக்கும்.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: வானத்தின் கீழுள்ள
  rationale: நீர் வானம் அல்லது வானவெளிக்குக் கீழே இருப்பதைக் குறிக்கிறது. தமிழில் ஒருமை ‘வானம்’ இயல்பானது; மூலச்சொல்லின் பொருள் பரப்பிலுள்ள ‘வானவெளி’ என்ற மாற்றை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: אֶל מָקוֹם אֶחָד
  choice: ஒரே இடத்தில்
  rationale: நீர் பல பகுதிகளிலிருந்து ஒரு இடத்திற்குத் திரண்டு அங்கே இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது; אֶחָד என்பதன் ஒருமைப்பாட்டை ‘ஒரே’ வலியுறுத்துகிறது.
- source_word: וְתֵרָאֶה
  choice: தோன்றட்டும்
  rationale: நிபால் வேண்டுகோள் வடிவின் கட்டளைத் தொடர்ச்சியை ‘-ட்டும்’ காக்கிறது; நீரால் மறைக்கப்பட்டிருந்த உலர் நிலம் கண்களுக்குப் புலப்படுவதை ‘தோன்று’ இயல்பாகச் சொல்கிறது.
- source_word: הַיַּבָּשָׁה
  choice: உலர்ந்த நிலம்
  rationale: திரண்ட நீருக்கு மாறாக வெளிப்படும் உலர் தரைப்பகுதியைக் குறிக்கிறது; அடுத்த வசனத்தில் அதற்கு ‘நிலம்’ என்று பெயரிடப்படுவதற்கும் பொருந்துகிறது.
- source_word: וַיְהִי כֵן
  choice: அப்படியே ஆனது
  rationale: கடவுளின் கட்டளை நிறைவேறியதைக் குறிக்கும் ஆதியாகமம் 1-ன் திரும்பவரும் வாய்பாட்டைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: படைப்புக் குறிப்பில் שָׁמַיִם என்பதன் பொருள்
  choice: வானம்
  alternative: வானவெளி
  rationale: எபிரெயச் சொல் சூழலுக்கேற்ப வானம், வானவெளி ஆகியவற்றைக் குறிக்கலாம். முதன்மை உரையில் dignified மற்றும் இயல்பான ‘வானம்’ பயன்படுத்தப்படுகிறது; குறிப்பிட்ட ஒரு அண்டவியல் கோட்பாட்டை உரைக்குள் திணிக்காமல் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட படைப்புக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. நேர்கூற்றின் தமிழ் சொல்வரிசை இயல்பாக அமைக்கப்பட்டு, இரு இறைக் கட்டளைகளிலும் ‘-ட்டும்’ வடிவம் ஒரேபோலக் காக்கப்பட்டுள்ளது.
