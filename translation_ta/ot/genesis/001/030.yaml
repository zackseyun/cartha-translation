base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/030.yaml
  text: And to every beast of the earth[a], and to every bird of the heavens, and to everything that creeps on the earth in which there is a living creature, every green plant is for food[c][b]. And it was so.
translation:
  language: ta
  text: பூமியின் எல்லா விலங்குகளுக்கும், வானத்தின் எல்லாப் பறவைகளுக்கும், பூமியில் ஊர்ந்து செல்லும், உயிருள்ள ஒவ்வோர் உயிரினத்துக்கும், பசுமையான எல்லாச் செடிகளையும் உணவாகக் கொடுத்தேன்[b]. அப்படியே ஆனது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “கொடுத்தேன்” என்னும் வினை இவ்வசனத்தின் எபிரெய உரையில் வெளிப்படையாக இல்லை; அது முந்தைய வசனத்திலிருந்து தொடர்வதாகப் புரிந்துகொள்ளப்படுகிறது. வேறுவிதமாக, “பசுமையான எல்லாச் செடிகளும் உணவாகும்.”
    reason: ellipsis_and_translation_alternative
lexical_decisions:
- source_word: חַיַּת הָאָרֶץ
  choice: பூமியிலுள்ள எல்லா விலங்குகள்
  rationale: இச்சொற்றொடர் நிலத்தில் வாழும் விலங்குகளைக் குறிக்கிறது. ‘காட்டு விலங்குகள்’ என்று மொழிபெயர்த்தால் எபிரெயச் சொல் கூறாத வரம்பைச் சேர்க்கக்கூடும்; ஆகவே விரிவான ‘விலங்குகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עוֹף הַשָּׁמַיִם
  choice: வானத்துப் பறவைகள்
  rationale: עוֹף என்பது பறக்கும் உயிரினங்களை விரிவாகக் குறிக்கக்கூடியதாயினும், படைப்புக் கதையின் இச்சூழலில் ‘பறவைகள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது. שָׁמַיִם என்பதற்கு நவீனத் தமிழில் ‘வானம்’ பொருத்தமானது.
- source_word: כֹל רוֹמֵשׂ עַל הָאָרֶץ
  choice: பூமியில் ஊர்ந்து செல்லும் ... அனைத்தும்
  rationale: רוֹמֵשׂ என்பதன் நகரும் அல்லது ஊரும் காட்சியை ‘ஊர்ந்து செல்லும்’ தக்கவைக்கிறது; ‘எல்லாம்’ என்பது כֹל என்பதன் முழுமையைக் காட்டுகிறது.
- source_word: אֲשֶׁר בּוֹ נֶפֶשׁ חַיָּה
  choice: உயிருள்ள
  rationale: נֶפֶשׁ חַיָּה என்பது இங்கு ‘உயிருள்ள உயிரி/பிராணி’ என்ற பொருளுடையது; ‘உயிர்மூச்சு’ என்பதற்கான வேறு எபிரெயச் சொற்றொடருடன் இதைக் கலக்காமல், தமிழில் இயல்பான அடைமொழியாக மொழிபெயர்க்கப்பட்டது.
- source_word: כָּל יֶרֶק עֵשֶׂב
  choice: பசுமையான செடிகள் அனைத்தும்
  rationale: יֶרֶק עֵשֶׂב பசுமையான தாவர வளர்ச்சியை உணவாகக் குறிப்பிடுகிறது. ‘செடிகள்’ பொதுவாசகருக்கு இயல்பானது; ‘மூலிகைகள்’ என்பது தேவையற்ற குறுகிய பொருளைத் தரும்.
- source_word: לְאָכְלָה
  choice: உணவாக
  rationale: לְ என்னும் முன்னொட்டு இங்கு உண்ணும் நோக்கத்தையோ பயன்பாட்டையோ குறிக்கிறது; ‘உணவாக’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַיְהִי כֵן
  choice: அப்படியே ஆனது
  rationale: படைப்புக் கதையில் திரும்பத் திரும்ப வரும் நிறைவேற்றச் சூத்திரத்தின் பொருளையும் கண்ணியமான எளிமையையும் இது தக்கவைக்கிறது.
theological_decisions:
- issue: விலங்குகளைப் பற்றிய נֶפֶשׁ חַיָּה என்பதன் மொழிபெயர்ப்பு
  choice: முதன்மை உரையில் ‘உயிருள்ள’
  alternative: ‘உயிருள்ள ஓர் உயிரி இருக்கிற’ அல்லது சொற்சார்பாக ‘உயிருள்ள ஓர் ஆத்துமா இருக்கிற’
  rationale: இந்தச் சொற்றொடர் விலங்குகளிடம் உயிர் இருப்பதைக் குறிக்கிறது. ‘உயிர்மூச்சு’ என்பது ஆதியாகமம் 2:7-இல் வரும் வேறு எபிரெயச் சொற்றொடருக்குரியது. அதேவேளை ‘ஆத்துமா’ என்று முதன்மை உரையில் இடுவது பிற்கால மெய்யியல் கருத்தை தேவையின்றி முன்னிறுத்தலாம்; எனவே இயல்பான பொருள் முதன்மை உரையிலும், சொற்சார்ந்த வடிவம் அடிக்குறிப்பிலும் வைக்கப்பட்டது.
- issue: இவ்வசனத்தில் வெளிப்படையாக இல்லாத கொடுத்தல் வினைச்சொல்
  choice: முந்தைய வசனத்திலிருந்து தொடரும் ‘கொடுத்தேன்’ என்பதைக் கொண்டு வாக்கியத்தை நிறைவு செய்தல்
  alternative: ‘பசுமையான செடிகள் அனைத்தும் உணவாகும்’ என்று வினையை மறைமுகமாக்குதல்
  rationale: אֶת என்னும் நேர்ச்செயப்படுபொருள் குறியீடு ‘பசுமையான செடிகள் அனைத்தையும்’ முந்தைய வசனத்தின் נָתַתִּי (‘கொடுத்தேன்’) என்பதோடு இலக்கணரீதியாக இணைக்கிறது. தமிழில் முழுமையான, இயல்பான வாக்கியத்திற்காக அந்த மறைந்த வினை மீட்டெடுக்கப்பட்டது; அது இவ்வசனத்தில் வெளிப்படையாக இல்லை என்பது அடிக்குறிப்பில் தெரிவிக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பட்டியலின் இணை அமைப்பு காக்கப்பட்டது. ‘ஆத்துமா,’ ‘மூலிகை’ போன்ற இச்சூழலில் தேவையற்ற சமய அல்லது பழமையான நிழற்பொருள் தரக்கூடிய சொற்கள் முதன்மை உரையில் தவிர்க்கப்பட்டன.
