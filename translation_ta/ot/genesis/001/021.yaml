base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/021.yaml
  text: So God created the great sea creatures[a], and every living creature that moves, with which the waters swarmed, according to their kinds, and every winged bird according to its kind. And God saw that it was good.
translation:
  language: ta
  text: அப்போது கடவுள் பெரிய கடல் உயிரினங்களையும்[a], நீர்கள் திரளாக நிரம்பிய அசையும் எல்லா உயிரினங்களையும் அவற்றின் இனங்களின்படி, சிறகுள்ள எல்லாப் பறவைகளையும் அதன் இனத்தின்படி படைத்தார். இது நல்லது என்று கடவுள் கண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெரிய கடல் அரக்கர்கள்” அல்லது “பெரிய வலுசர்ப்பங்கள்.” எபிரெயச் சொல் பெரிய பாம்புபோன்ற அல்லது பேருருவமிக்க உயிரினங்களைக் குறிக்கலாம்; இங்குள்ள நீர்சார் சூழல் “கடல் உயிரினங்கள்” என்ற மொழிபெயர்ப்பை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרָא
  choice: படைத்தார்
  rationale: ברא என்ற தனித்த படைப்புச் செயலைக் குறிக்கும் வினையின் உயர்ந்த நடையையும், ஆதியாகமம் 1-இல் அதன் தொடர்ச்சியான பயன்பாட்டையும் காக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: பன்மை வடிவமாயிருந்தாலும் இங்கு ஒருமை வினையுடன் வந்து இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கிறது; நவீன பொதுத் தமிழில் இயல்பான சொல்.
- source_word: הַתַּנִּינִם הַגְּדֹלִים
  choice: பெரிய கடல்வாழ் உயிரினங்கள்
  rationale: תנינים என்பது பெரிய பாம்பு போன்ற அல்லது அச்சமூட்டும் உயிரினங்களைக் குறிக்கலாம்; நீர்சார் சூழலில் தேவையற்ற புராணச் சாயலைச் சேர்க்காமல் பரந்த பொருளை வழங்குகிறது.
- source_word: כָּל נֶפֶשׁ הַחַיָּה
  choice: எல்லா உயிரினங்கள்
  rationale: נפש חיה இங்கு இறையியல் சார்ந்த ‘ஆத்துமா’ அல்ல, உயிருள்ள படைப்புகளைக் குறிக்கிறது.
- source_word: הָרֹמֶשֶׂת
  choice: அசைகிற
  rationale: רמש என்பது ஊர்தலை மட்டும் அல்லாமல் பொதுவாக அசைந்து செல்லுதலையும் குறிக்கக்கூடும்; பரந்த மூலப்பொருளைக் காக்கிறது.
- source_word: אֲשֶׁר שָׁרְצוּ הַמַּיִם
  choice: நீரில் திரளாகப் பெருகிய
  rationale: שרץ குறிப்பிடும் திரளான தோற்றம் அல்லது பெருக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְמִינֵהֶם / לְמִינֵהוּ
  choice: தத்தம் இனங்களின்படி
  rationale: படைப்புகளில் காணப்படும் வகைப்பாட்டைச் சுட்டும் מין என்பதையும், கூட்டுத் தொகுதிகளுக்குரிய பகிர்ந்தமைவையும் இயல்பாகக் கூறுகிறது.
- source_word: כָּל עוֹף כָּנָף
  choice: சிறகுள்ள எல்லாப் பறவைகள்
  rationale: עוף என்ற பறக்கும் உயிரின வகையையும் כנף என்ற சிறகு குறிப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: அது நல்லது என்று கடவுள் கண்டார்
  rationale: ஆதியாகமம் 1-இல் மீண்டும் வரும் மதிப்பீட்டு வாய்பாட்டைத் தெளிவான, கண்ணியமான தமிழில் தருகிறது.
theological_decisions:
- issue: படைப்புச் சூழலில் புராணத் தொடர்பு கொள்ளக்கூடிய תַּנִּינִם என்பதன் மொழிபெயர்ப்பு
  choice: பெரிய கடல்வாழ் உயிரினங்கள்
  alternative: பெரிய கடல் அரக்கர்கள்; பெரிய வலுசர்ப்பங்கள்
  rationale: உடனடியான சூழல் நீர்வாழ் உயிர்களின் படைப்பைப் பேசுகிறது. முதன்மை உரையில் புராணச் சாயலை மிகைப்படுத்தாமல், எபிரெயச் சொல்லின் அச்சமூட்டும் அல்லது பாம்பு போன்ற உயிர்களைக் குறிக்கும் சாத்தியத்தை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் கண்ணியமான படைப்புக் கதை நடை. ‘படைத்தார்’ மற்றும் மீண்டும் வரும் மதிப்பீட்டு வாய்பாடு உயர்ந்த நடையைப் பேணுகின்றன; அரிதான சமயத் தொழிற்சொற்கள் தவிர்க்கப்பட்டுள்ளன.
