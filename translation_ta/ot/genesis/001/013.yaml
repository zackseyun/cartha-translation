base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/013.yaml
  text: And there was evening[a], and there was morning—the third day.
translation:
  language: ta
  text: மாலையும் உண்டாயிற்று; காலையும் உண்டாயிற்று—மூன்றாம் நாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மேலும் சொற்சொல்லாக: ‘மாலையும் உண்டாயிற்று; காலையும் உண்டாயிற்று—நாள் மூன்றாம்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: உண்டாயிற்று
  rationale: இங்கு היה என்பதன் தொடர்வினை வடிவம் படைப்புக் கதையின் காலப்பகுதி நிறைவைச் சுட்டும் தொடர் வாய்பாட்டில் வருகிறது. ‘உண்டாயிற்று’ என்பது நிகழ்வை இயல்பான தமிழில் தெரிவிப்பதோடு, இருமுறை வரும் எபிரெய அமைப்பையும் காக்கிறது.
- source_word: עֶרֶב
  choice: மாலை
  rationale: இச்சொல் மாலை அல்லது அந்தி நேரத்தைக் குறிக்கிறது. படைப்புக் கதையின் திரும்பத் திரும்ப வரும் வாய்பாட்டில் ‘மாலை’ நேரடியான, தெளிவான தெரிவாகும்.
- source_word: בֹּקֶר
  choice: காலை
  rationale: இச்சொல் காலை நேரத்தைக் குறிக்கிறது. ‘காலை’ என்பது இயல்பான தமிழாகவும் ‘மாலை’ என்பதற்கு இணையான வாய்பாட்டு சொல்லாகவும் உள்ளது.
- source_word: יוֹם
  choice: நாள்
  rationale: இங்கு இச்சொல் படைப்பு வரிசையில் எண்ணிடப்பட்ட நாளைக் குறிக்கிறது; ‘நாள்’ அதன் நேரடியான பொருளைத் தருகிறது.
- source_word: שְׁלִישִׁי
  choice: மூன்றாம்
  rationale: இது ‘மூன்றாவது’ என்று பொருள்படும் வரிசை எண்ணுப்பெயர்; ‘நாள்’ என்பதுடன் ‘மூன்றாம் நாள்’ என்பது இயல்பான தமிழ் அமைப்பு.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: மாலையும் உண்டாயிற்று; காலையும் உண்டாயிற்று
  rationale: ஒவ்வொரு உட்பிரிவிலும் வரும் וַיְהִי என்பதைக் ‘உண்டாயிற்று’ என்று இருமுறையும் மொழிபெயர்ப்பது எபிரெய மூலத்தின் திரும்புவரும் ஓசையையும் இணை அமைப்பையும் காக்கிறது.
theological_decisions:
- issue: படைப்பு நாளின் காலஅளவு அல்லது இலக்கியச் செயல்பாடு குறித்த ஒரு குறிப்பிட்ட விளக்கத்தை மொழிபெயர்ப்பில் புகுத்தாமல் இருப்பது
  choice: மூன்றாம் நாள்
  alternative: மூன்றாவது நாள் / நாள் மூன்று
  rationale: יום שְׁלִישִׁי படைப்புக் கதையின் வரிசையில் மூன்றாம் நாளைக் குறிக்கிறது. ‘மூன்றாம் நாள்’ என்பது இயல்பான நேரடி மொழிபெயர்ப்பு; அந்த ‘நாள்’ எவ்வளவு நீளமானது அல்லது அதன் இலக்கியப் பங்கு என்ன என்பது குறித்த பிற்கால விவாதங்களை இது தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. எபிரெய மூலத்தின் இருமுறை வரும் வாய்பாட்டு நடை தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது; அரைப்புள்ளி இரண்டு இணையான உட்பிரிவுகளை வாசிக்க உதவுகிறது.
