  text: וַ/יַּ֣עַשׂ אֱלֹהִים֩ אֶת חַיַּ֨ת הָ/אָ֜רֶץ לְ/מִינָ֗/הּ וְ/אֶת הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ וְ/אֵ֛ת כָּל רֶ֥מֶשׂ הָֽ/אֲדָמָ֖ה לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/025.yaml
  text: And God made the beasts of the earth according to their kinds[a], and the livestock according to their kinds, and every creeping thing of the ground according to its kind[c][b]. And God saw that it was good.
translation:
  language: ta
  text: கடவுள் பூமியின் காட்டு விலங்குகளை அவற்றின் வகைகளின்படியும்[a], கால்நடைகளை அவற்றின் வகைகளின்படியும், தரையில் ஊர்ந்து செல்லும் எல்லா உயிரினங்களையும் அவற்றின் வகைகளின்படியும்[c][b] உண்டாக்கினார். அது நல்லது என்று கடவுள் கண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பூமியின் மிருகங்களை.’ எபிரெயத் தொடர், கால்நடைகளிலிருந்து வேறுபட்ட காட்டு விலங்குகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அதன் வகையின்படி’ / ‘அவற்றின் வகைகளின்படி.’ இங்குள்ள ‘வகை’ என்பது உயிரினப் பிரிவுகளைக் குறிக்கிறது; அதை நவீன அறிவியல் வகைப்பாட்டின் தொழில்நுட்பச் சொல்லாகக் கொள்ளக்கூடாது.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘பூமியில் ஊர்ந்து செல்லும் எல்லா உயிரினங்களையும்.’ இவ்வசனத்தின் முற்பகுதியில் ‘பூமி’ என்பதற்குப் பயன்படுத்தப்பட்ட சொல்லிலிருந்து, இங்கு ‘தரை’ என்பதற்கான எபிரெயச் சொல் வேறுபடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: உண்டாக்கினார்
  rationale: עָשָׂה என்பதன் இயல்பான பொருள் ‘செய்/உண்டாக்கு.’ படைப்புச் சூழலில் ‘உண்டாக்கினார்’ என்பது இயல்பாகவும் நேரடியாகவும் உள்ளது; ברא என்பதற்குரிய தனி சொல்லை இங்கே இறக்குமதி செய்யாது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு பன்மை வடிவிலுள்ள பெயர்ச்சொல் ஒருமை வினையுடன் வந்து ஒரே படைப்பாளரைக் குறிக்கிறது. நவீன பொதுத் தமிழில் ‘கடவுள்’ தெளிவான, சமயப்பிரிவு சாராத மொழிபெயர்ப்பு.
- source_word: חַיַּת הָאָרֶץ
  choice: பூமியின் காட்டு விலங்குகள்
  rationale: இந்தத் தொடர் கால்நடைகளிலிருந்தும் தரையில் ஊர்ந்து செல்லும் உயிரினங்களிலிருந்தும் வேறுபட்ட, நிலத்தில் வாழும் காட்டு விலங்குகளைக் குறிக்கிறது. ‘காட்டு விலங்குகள்’ அந்த வகை வேறுபாட்டை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: அவற்றின் வகைகளின்படி
  rationale: מִין என்பது ஓர் உயிரின வகை அல்லது பிரிவைக் குறிக்கிறது. ‘வகை’ என்பது மூலத்தின் பொதுவான வகைப்பாட்டைப் பேணுகிறது; நவீன அறிவியல் வகைப்பாட்டை உணர்த்தக்கூடிய ‘இனம்/species’ என்ற தொழில்நுட்பப் பொருளைத் திணிக்காது.
- source_word: הַבְּהֵמָה
  choice: கால்நடைகள்
  rationale: இங்கு בהמה என்பது காட்டு விலங்குகளிலிருந்து வேறுபட்ட, குறிப்பாக மனிதரால் வளர்க்கப்படும் பெரிய நிலவாழ் விலங்குகளைக் குறிக்கிறது. ‘கால்நடைகள்’ என்பது தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: כָּל רֶמֶשׂ הָאֲדָמָה
  choice: தரையில் ஊர்ந்து செல்லும் எல்லா உயிரினங்களும்
  rationale: רֶמֶשׂ என்பது தரைக்கு அருகில் நகரும் சிறு உயிரினங்களைக் குறிக்கிறது. ‘ஊர்ந்து செல்லும் உயிரினங்கள்’ வகை வேறுபாட்டைப் பேணுகிறது; אֲדָמָה என்பதற்கு ‘தரை’ என மொழிபெயர்ப்பது, வசனத்தின் முற்பகுதியிலுள்ள אֶרֶץ (‘பூமி’) என்பதுடனான சொல் வேறுபாட்டையும் காக்கிறது.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: அது நல்லது என்று கடவுள் கண்டார்
  rationale: இது ஆதியாகமம் 1-இல் மீண்டும் வரும் மதிப்பீட்டு வாக்கியம். ‘அது நல்லது’ என்பது எபிரெயச் சொல்லின் ஒருமைத் தன்மையையும் முழுச் செயலை நோக்கும் பொருளையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: படைப்பின் வகைகளை நவீன அறிவியல் வகைப்பாடாக மாற்றாமல் மொழிபெயர்த்தல்
  choice: வகைகள்
  alternative: உயிரியல் இனங்கள்
  rationale: מִין என்பது உரையின் சொந்த வகைப்பாட்டைக் குறிக்கிறது. ‘வகைகள்’ என்று மொழிபெயர்ப்பது, அதை நவீன உயிரியல் ‘species’ கருத்துடன் காலத்துக்கு ஒவ்வாத வகையில் ஒப்பிடுவதைத் தவிர்க்கிறது.
- issue: הָאָרֶץ மற்றும் הָאֲדָמָה ஆகியவற்றுக்கிடையிலான சொல் வேறுபாடு
  choice: பூமி … தரை
  alternative: பூமி … பூமி
  rationale: இரண்டு தொடர்புடையதாயினும் வேறுபட்ட எபிரெயச் சொற்களையும் ஒரே தமிழ்ச் சொல்லாகச் சமப்படுத்தாமல், மூலத்திலுள்ள வேறுபாட்டைப் பேணுகிறது.
- issue: עָשָׂה என்பதையும் בָּרָא என்பதையும் ஒரே சொல்லால் சமப்படுத்தாமல் இருத்தல்
  choice: உண்டாக்கினார்
  alternative: படைத்தார்
  rationale: இவ்வசனத்தில் உள்ள வினை עָשָׂה (‘செய்/உண்டாக்கு’) ஆகும். ‘உண்டாக்கினார்’ என்பது தேவையற்ற சொற்பொருள் அல்லது கோட்பாட்டுச் சிறப்பைச் சேர்க்காமல் அந்த வினையை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில், எளிதில் புரியக்கூடியதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. பட்டியலின் ஒத்திசைவு ‘அவற்றின் வகைகளின்படியும்’ என்ற மறுமொழியால் காக்கப்பட்டுள்ளது. பாரம்பரியமாக இருந்தாலும் இன்றைய வாசகருக்கு கடினமாக இருக்கக்கூடிய ‘ஊரும் பிராணிகள்’ என்பதற்குப் பதிலாக ‘ஊர்ந்து செல்லும் உயிரினங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
