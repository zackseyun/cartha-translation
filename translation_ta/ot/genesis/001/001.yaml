source:
  edition: WLC
  text: בְּ/רֵאשִׁ֖ית בָּרָ֣א אֱלֹהִ֑ים אֵ֥ת הַ/שָּׁמַ֖יִם וְ/אֵ֥ת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: ta
  text: ஆரம்பத்தில் கடவுள் வானங்களையும் பூமியையும் படைத்தபோது[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'பாரம்பரியமாக இது, “ஆரம்பத்தில் கடவுள் வானங்களையும் பூமியையும் படைத்தார்” என்ற முழுமையான வாக்கியமாக மொழிபெயர்க்கப்படுகிறது. ஆனால் எபிரெயத்தில் உறுப்பில்லாத בְּרֵאשִׁית என்பதற்குப் பின் முற்றுவினை வடிவமான בָּרָא வருவதால், ஆதியாகமம் 2:4b-க்கு இணையாக, இது காலத்தைச் சுட்டும் சார்புநிலைத் தொடராக இயல்பாகப் படிக்கிறது. முதன்மை வாக்கியம் 3ஆம் வசனத்தில் வருகிறது: “ஒளி உண்டாகட்டும்” என்று கடவுள் சொன்னார்.'
    reason: Corrects the grammatical explanation of the Hebrew anarthrous form while retaining the alternative reading and its anchor.
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: ஆரம்பத்தில், … படைத்தபோது
  rationale: குறிப்புச் சுட்டில்லாத בְּרֵאשִׁית என்பதற்குப் பின் முற்றுவினையான בָּרָא வருவதால், இது காலத்தைச் சுட்டும் சார்புநிலைத் தொடராக இயல்பாகப் படிக்கிறது. ‘ஆரம்பத்தில்’ என்பது רֵאשִׁית என்பதன் சொற்பொருளையும் நூலின் எபிரெயப் பெயருடனான தொடர்பையும் காக்கிறது.
- source_word: בָּרָא
  choice: படைத்த
  rationale: தெய்வீகப் படைப்பைக் குறிக்கும் எபிரெய வழக்குச் சொல். ‘படைத்த’ என்பது செய்முறையை மேலதிகமாக விளக்காமல் அதன் நேரடியான பொருளைத் தருகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும் இங்கு ஒருமை வினையுடன் வருவதால் ஒருமைச் சுட்டான ‘கடவுள்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: אֵת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை; நேரடிச் செயப்படுபொருள் குறியீடு]'
  rationale: אֵת என்பது வரையறுக்கப்பட்ட நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கணச் சொல்; தமிழில் ‘ஐ’ வேற்றுமை உருபால் அதன் பணி வெளிப்படுகிறது.
- source_word: הַשָּׁמַיִם
  choice: வானங்களை
  rationale: எபிரெயச் சொல்லின் பன்மை வடிவத்தைப் பாதுகாக்க ‘வானங்கள்’ பயன்படுத்தப்படுகிறது. ‘வானங்களும் பூமியும்’ என்பது படைக்கப்பட்ட அனைத்தையும் உள்ளடக்கும் இணைச்சொற்றொடர்.
- source_word: הָאָרֶץ
  choice: பூமியை
  rationale: אָרֶץ என்பதற்கு ‘நிலம்’ என்றும் பொருள் வரலாம்; ஆனால் ‘வானங்கள்’ என்பதோடு வரும் அண்டமுழுதையும் குறிக்கும் இச்சூழலில் ‘பூமி’ பொருத்தமானது.
theological_decisions:
- issue: தொடக்கத் தொடரின் வாக்கிய அமைப்பு
  choice: 'காலத்தைச் சுட்டும் சார்புநிலைத் தொடர்: ‘ஆரம்பத்தில், கடவுள் வானங்களையும் பூமியையும் படைத்தபோது—’'
  alternative: 'தனி முதன்மை வாக்கியம்: ‘ஆரம்பத்தில் கடவுள் வானங்களையும் பூமியையும் படைத்தார்.’'
  rationale: குறிப்புச் சுட்டில்லாத בְּרֵאשִׁית, அதை உடனடியாகத் தொடரும் முற்றுவினை בָּרָא, மேலும் ஆதியாகமம் 2:4b மற்றும் ஓசியா 1:2 ஆகியவற்றின் ஒத்த காலத் தொடக்கங்கள் ஆகியவை சார்புநிலை வாசிப்பை ஆதரிக்கின்றன. பாரம்பரிய தனிவாக்கிய வாசிப்பும் பழமையானதும் முக்கியமானதும் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; இவ்வசனத்தின் இலக்கணத்தைக் கொண்டு மட்டும் படைப்பைப் பற்றிய கோட்பாட்டைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘வானங்கள்’ மூலத்தின் பன்மையைப் பேணுகிறது; ‘படைத்தபோது’ சார்புநிலை அமைப்பைத் தெளிவாக்குகிறது. இறுதியில் உள்ள நீண்ட கோடு, இத்தொடர் அடுத்த வசனங்களுக்குச் செல்கிறது என்பதை உணர்த்துகிறது.
