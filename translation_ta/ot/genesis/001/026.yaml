  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים נַֽעֲשֶׂ֥ה אָדָ֛ם בְּ/צַלְמֵ֖/נוּ כִּ/דְמוּתֵ֑/נוּ וְ/יִרְדּוּ֩ בִ/דְגַ֨ת הַ/יָּ֜ם וּ/בְ/ע֣וֹף הַ/שָּׁמַ֗יִם וּ/בַ/בְּהֵמָה֙ וּ/בְ/כָל הָ/אָ֔רֶץ וּ/בְ/כָל הָ/רֶ֖מֶשׂ הָֽ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/026.yaml
  text: Then God said[a], “Let us make man in our image, according to our likeness[d][c][b], and let them rule over the fish of the sea and over the birds of the heavens and over the livestock and over all the earth and over every creeping thing that creeps on the earth.”
translation:
  language: ta
  text: பின்பு கடவுள், “நமது சாயலிலும், நமது ஒப்புமையின்படியும் மனிதனை[a] உருவாக்குவோம்[b]. அவர்கள் கடலின் மீன்களையும், வானத்துப் பறவைகளையும்[d], கால்நடைகளையும், பூமி முழுவதையும், பூமியின்மேல் ஊர்ந்து செல்லும் எல்லா உயிரினங்களையும் ஆளட்டும்[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதகுலத்தை.” எபிரேயத்தில் אָדָם (ஆதாம்) இங்கு மனித இனத்தை ஒரே வகையாகக் குறிக்கும் கூட்டொருமைச் சொல்; அதனால் அடுத்த வாக்கியம் “அவர்கள் ... ஆளட்டும்” என்று பன்மையில் தொடர்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “உருவாக்குவோம்,” “நமது சாயலிலும்,” “நமது ஒப்புமையின்படியும்” என்ற பன்மை வடிவங்கள் எபிரேயத்தில் உள்ளபடியே காக்கப்பட்டுள்ளன. இவற்றைத் தெய்வீக உளஆலோசனை என்றும், பரலோக மன்றத்திடம் கூறியது என்றும், அல்லது—கிறிஸ்தவ வேதாகம முழுமையின் வாசிப்பில்—பின்னர் வெளிப்படும் திரித்துவ உண்மைக்கு இசைவான முன்னறிகுறி என்றும் பலவாறு புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “அதிகாரம் செலுத்தட்டும்.”
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “ஆகாயத்துப் பறவைகளையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘பின்பு’ இயல்பான தமிழ் கதைநடையில் அந்த வரிசையை வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு வினைச்சொல் ஒருமையில் அமைந்து ஒரே கடவுளைக் குறிக்கிறது; நவீன பொதுத்தமிழில் ‘கடவுள்’ இயல்பான தேர்வு.
- source_word: נַעֲשֶׂה
  choice: உருவாக்குவோம்
  rationale: முதல் நபர் பன்மை வடிவத்தைத் தமிழிலும் பன்மையாகவே காக்கிறது; அது யாரை உள்ளடக்குகிறது என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: אָדָם
  choice: மனிதனை
  rationale: இங்கு אָדָם மனித இனத்தை ஒருமையான கூட்டுப்பெயராகக் குறிக்கிறது. ‘மனிதனை’ அந்த ஒருமை–பன்மை இயக்கத்தை இயல்பான தமிழில் காக்கிறது; தொடர்ந்து வரும் ‘அவர்கள்’ அதன் கூட்டுப்பொருளை வெளிப்படுத்துகிறது.
- source_word: בְּצַלְמֵנוּ
  choice: நமது சாயலில்
  rationale: צֶלֶם என்பது சாயல், உருவம் அல்லது பிரதிநிதித்துவத்தைக் குறிக்கலாம். ‘சாயல்’ மூலத்தின் உருவகத் திறப்பைத் தக்கவைக்கிறது.
- source_word: כִּדְמוּתֵנוּ
  choice: நமது உருவொப்பின்படி
  rationale: דְּמוּת என்பது ஒப்பு அல்லது ஒத்த உருவைக் குறிக்கிறது. ‘உருவொப்பு’ சாயல் என்பதிலிருந்து சொல்லை வேறுபடுத்தி, כ முன்னிடைச்சொல்லின் ஒப்புமை/மாதிரி சார்ந்த பொருளையும் வெளிப்படுத்துகிறது.
- source_word: וְיִרְדּוּ
  choice: அவர்கள் ... ஆளட்டும்
  rationale: மூன்றாம் நபர் பன்மை விருப்பவினை வடிவத்தை ‘ஆளட்டும்’ நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בִדְגַת הַיָּם
  choice: கடலின் மீன்களையும்
  rationale: எபிரேய இணைப்புச் சொல்லமைப்பைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: וּבְעוֹף הַשָּׁמַיִם
  choice: வானத்துப் பறவைகளையும்
  rationale: עוֹף இங்கு பறக்கும் உயிரினங்களை, இயல்பாகப் பறவைகளை, குறிக்கிறது; שָׁמַיִם என்பதற்கு இச்சூழலில் ‘வானம்’ இயல்பான தமிழ்.
- source_word: וּבַבְּהֵמָה
  choice: கால்நடைகளையும்
  rationale: בְּהֵמָה இங்கு பழக்கப்பட்ட/வீட்டு நில விலங்குகளின் வகையைக் குறிக்கிறது; ‘கால்நடைகள்’ துல்லியமான பொதுத்தமிழ்.
- source_word: וּבְכָל הָאָרֶץ
  choice: பூமி முழுவதையும்
  rationale: ஆதியாகமம் 1-இன் படைப்புச் சூழலில் אֶרֶץ உள்ளூர் நிலப்பகுதியை அல்ல, முழுப் பூமியைக் குறிக்கிறது.
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: பூமியின்மேல் ஊர்ந்து செல்லும் எல்லா உயிரினங்களையும்
  rationale: רֶמֶשׂ மற்றும் அதனோடு வரும் பங்கேற்புவினை நிலத்திற்கு அருகே நகரும் சிறிய உயிரினங்களைக் குறிக்கின்றன. தமிழில் இயற்கையற்ற சொல் மறுபடியைத் தவிர்த்து இரண்டின் பொருளையும் இந்தச் சொற்றொடர் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘உருவாக்குவோம் ... நமது சாயலில் ... நமது உருவொப்பின்படி’ என்ற பன்மைப் பேச்சு
  choice: மூலத்திலுள்ள முதல் நபர் பன்மையை அப்படியே காத்து, யாரிடம் பேசப்படுகிறது என்பதை முதன்மை உரையில் குறிப்பிடவில்லை.
  alternative: தெய்வீக உளஆலோசனை; பரலோக மன்றத்திடம் உரையாடல்; கிறிஸ்தவ வேதாகம முழுமையின் வெளிச்சத்தில் திரித்துவத்துக்கு இசைவான முன்னறிகுறி.
  rationale: எபிரேய உரை தெளிவாகப் பன்மை வடிவங்களைப் பயன்படுத்தினாலும், அவற்றின் விளக்கத்தை இந்த வசனத்திலேயே நிர்ணயிப்பதில்லை. ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் காக்கிறது.
- issue: אָדָם என்ற சொல்லின் ஒருமை வடிவமும் கூட்டுப்பொருளும்
  choice: ‘மனிதனை’ என்று ஒருமையில் மொழிபெயர்த்து, தொடரும் பன்மை வினையின் எழுவாயாக ‘அவர்கள்’ என்பதைக் காத்தது.
  alternative: ‘மனிதகுலத்தை’ அல்லது ‘மனுக்குலத்தை’ என்று வெளிப்படையான கூட்டுப்பெயரைப் பயன்படுத்துதல்.
  rationale: மூலத்தில் மனித இனம் ஒரே வகையாக ஒருமையில் முன்வைக்கப்பட்டு, பின்னர் பன்மையாகக் குறிப்பிடப்படுகிறது. தமிழ் உரையும் அந்த ஒருமை–பன்மை மாறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘சாயல்/உருவொப்பு’ என்ற வேறுபாடு மூலத்தின் צֶלֶם/דְּמוּת வேறுபாட்டைக் காக்கிறது. ஆண்பால் சார்ந்த சொல்லைத் தேவையின்றி இறக்குமதி செய்யாமல், אָדָם என்பதன் மனித இனம் சார்ந்த கூட்டுப்பொருள் ‘மனிதன்/அவர்கள்’ என்ற ஒருமை–பன்மை அமைப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
