source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יְהִ֤י מְאֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הַבְדִּ֕יל בֵּ֥ין הַ/יּ֖וֹם וּ/בֵ֣ין הַ/לָּ֑יְלָה וְ/הָי֤וּ לְ/אֹתֹת֙ וּ/לְ/מ֣וֹעֲדִ֔ים וּ/לְ/יָמִ֖ים וְ/שָׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/014.yaml
  text: And God said[a], “Let there be lights in the expanse of the heavens to separate the day from the night, and let them be for signs and for appointed times[d][c][b], and for days and years.”
translation:
  language: ta
  text: 'கடவுள் கூறினார்: “பகலையும் இரவையும் பிரிப்பதற்காக வானவிரிவில் ஒளிச்சுடர்கள் உண்டாகட்டும். அவை அடையாளங்களுக்காகவும், குறித்த காலங்களுக்காகவும்[a], நாட்களுக்காகவும் ஆண்டுகளுக்காகவும் இருக்கட்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “பருவகாலங்களுக்காக.” எபிரெயச் சொல் நிர்ணயிக்கப்பட்ட காலங்களைக் குறிக்கிறது; வேறு சூழல்களில் அது விழாக்காலங்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאֹרֹת
  choice: ஒளிச்சுடர்கள்
  rationale: இச்சொல் ஒளியைத் தரும் விண்ணுலகப் பொருள்களைக் குறிக்கிறது. ‘ஒளிச்சுடர்கள்’ என்பது அவற்றைச் சூரியன், சந்திரன் என்று உரையில் இல்லாதவாறு முன்கூட்டியே பெயரிடாமல், இயல்பான தமிழில் பொருளைத் தெரிவிக்கிறது.
- source_word: רָקִיעַ הַשָּׁמַיִם
  choice: வானவிரிவு
  rationale: רָקִיעַ என்பதன் பரந்து விரிந்த வெளி என்ற கருத்தையும் הַשָּׁמַיִם என்பதன் வானுலகச் சூழலையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; குறிப்பிட்ட ஓர் உறுதியான குவிமாடக் கோட்பாட்டைத் திணிக்கவில்லை.
- source_word: לְהַבְדִּיל בֵּין הַיּוֹם וּבֵין הַלָּיְלָה
  choice: பகலையும் இரவையும் பிரிப்பதற்காக
  rationale: எபிரெய வினையெச்சத்தின் நோக்கப் பொருளைத் தெளிவாகக் காட்டி, படைப்புக் கதையில் மீண்டும் வரும் பிரித்தல் என்னும் கருத்தைத் தக்கவைக்கிறது.
- source_word: לְאֹתֹת
  choice: அடையாளங்களுக்காக
  rationale: אוֹת என்பதன் பரந்த பொருளைத் தக்கவைத்து, விண்ணுலகக் குறியீடுகள் எத்தகையவை என்று உரையைவிடக் குறுகலாக வரையறுக்கவில்லை.
- source_word: לְמוֹעֲדִים
  choice: குறித்த காலங்களுக்காக
  rationale: מוֹעֲדִים என்பது நிர்ணயிக்கப்பட்ட அல்லது குறிக்கப்பட்ட காலங்களைக் குறிக்கலாம். காலப்பருவங்கள் அல்லது சமய விழாக்கள் என்று மட்டும் சுருக்காமல் அதன் பரந்த காலப் பொருளை இந்த மொழிபெயர்ப்பு காக்கிறது.
- source_word: לְיָמִים וְשָׁנִים
  choice: நாட்களுக்காகவும் ஆண்டுகளுக்காகவும்
  rationale: மூலத்தில் குறிப்பிடப்பட்டுள்ள கால அலகுகளை நேரடியாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: יְהִי ... וְהָיוּ
  choice: உண்டாகட்டும் ... இருக்கட்டும்
  rationale: படைப்புக் கட்டளையின் விருப்பக் கட்டளை நடையைத் தமிழில் இயல்பாகத் தக்கவைக்கிறது; இதை வெறும் எதிர்கால முன்னறிவிப்பாக மாற்றவில்லை.
theological_decisions:
- issue: படைப்புச் சூழலில் מוֹעֲדִים என்பதன் பொருள்
  choice: பரந்த பொருளுடைய ‘குறித்த காலங்கள்’
  alternative: ‘பருவகாலங்கள்’ அல்லது ‘விழாக்காலங்கள்’
  rationale: பிற்கால வேதாகமப் பயன்பாட்டில் இச்சொல் நியமிக்கப்பட்ட விழாக்களைக் குறிக்கலாம்; ஆனால் இங்கு காலத்தை அண்ட அளவில் ஒழுங்குபடுத்துவது சூழல். ஆகவே, பிற்காலத் தொடர்புக்கான வாய்ப்பை மறுக்காமலும் வழிபாட்டு விழாக்கள் என்ற குறுகிய பொருளைத் திணிக்காமலும் பரந்த சொல் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் படைப்புக் கட்டளைக்குரிய கண்ணியமான இலக்கிய நடையில் மொழிபெயர்க்கப்பட்டது. ‘வானவிரிவு’ மற்றும் ‘ஒளிச்சுடர்கள்’ ஆகியவை எளிதில் புரியும்படியும், மூலத்தின் பண்டைய அண்டவியல் சொல்லாட்சியை அளவுக்கு மீறி விளக்காமலும் தேர்ந்தெடுக்கப்பட்டன.
