source:
  edition: WLC
  text: וַ/יִּתֵּ֥ן אֹתָ֛/ם אֱלֹהִ֖ים בִּ/רְקִ֣יעַ הַ/שָּׁמָ֑יִם לְ/הָאִ֖יר עַל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/017.yaml
  text: And God set them in the expanse of the heavens to give light on the earth[a].
translation:
  language: ta
  text: பூமிக்கு ஒளி கொடுப்பதற்காகக் கடவுள் அவற்றை வானவிரிவில் வைத்தார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வானங்களின் விரிப்பில்.”
    reason: רָקִיעַ הַשָּׁמַיִם என்ற எபிரேயத் தொடரின் சொற்சார்ந்த மாற்றை வெளிப்படுத்தும் சொல்லியல் மாற்று.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: வைத்தார்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடுத்தார்/வைத்தார்’ என்பதாகும். இங்கு வானொளிகளை அவற்றுக்குரிய இடத்தில் அமைத்த செயலை இயல்பான நவீனத் தமிழில் ‘வைத்தார்’ தெளிவாகத் தெரிவிக்கிறது.
- source_word: אֹתָם
  choice: அவற்றை
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பெரிய ஒளி, சிறிய ஒளி, நட்சத்திரங்கள் ஆகியவற்றைச் சுட்டும் உயிரற்ற பன்மைச் சுட்டுப்பெயராக ‘அவற்றை’ பொருந்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இவ்விடத்தில் אֱלֹהִים ஒருமை வினைச்சொல்லோடு வந்து ஒரே படைப்பாளரைக் குறிக்கிறது; நவீன நிலையான தமிழில் ‘கடவுள்’ இயல்பான பொதுப் பெயர்.
- source_word: בִּרְקִיעַ הַשָּׁמַיִם
  choice: வானவிரிவில்
  rationale: רָקִיעַ என்பது விரிந்த பரப்பைக் குறிக்கிறது. ‘வானவிரிவு’ அதன் இடவியல் கருத்தைச் சுருக்கமாகவும் புரியும்படியாகவும் தருகிறது; ‘வானங்களின் விரிப்பு’ என்ற சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְהָאִיר
  choice: ஒளி கொடுப்பதற்காக
  rationale: இது אור வேர்ச்சொல்லின் காரணவினை வடிவம்; வெறுமனே ‘ஒளிர’ என்பதைக் காட்டிலும், பூமிக்கு ஒளி அளிக்கும் நோக்கத்தையும் செயலையும் ‘ஒளி கொடுப்பதற்காக’ துல்லியமாகத் தெரிவிக்கிறது.
- source_word: עַל הָאָרֶץ
  choice: பூமிக்கு
  rationale: இங்கு עַל என்பது ஒளி சென்றடையும் இலக்கைச் சுட்டுகிறது. தமிழில் ‘பூமிக்கு ஒளி கொடுக்க’ என்பது இயல்பான அமைப்பு; எபிரேயத்தின் ‘பூமியின் மேல்’ என்ற கருத்தையும் செயற்பாட்டு முறையில் தருகிறது.
theological_decisions:
- issue: படைப்புக் குறிப்பில் வரும் רָקִיעַ என்ற அண்டவியல் சொல்
  choice: வானவிரிவு
  alternative: வானங்களின் விரிப்பு; வானமண்டலம்
  rationale: ‘வானவிரிவு’ மூலச்சொல்லின் விரிந்த பரப்பு என்ற பொதுவான கருத்தைப் பாதுகாக்கிறது. திடமான கூரை போன்ற ஒரு குறிப்பிட்ட பழங்கால அண்டவியலையோ, நவீன அறிவியல் விளக்கத்தையோ மொழிபெயர்ப்புக்குள் சேர்க்காமல் தவிர்க்கிறது; எபிரேயக் கட்டமைப்பின் சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய வாக்கியத்தின் நோக்கக் கூறு இயல்பான தமிழுக்காக முன்னிலைப்படுத்தப்பட்டுள்ளது; தேவையற்ற சமயப் பிரிவுசார் அல்லது நவீன அறிவியல் விளக்கங்கள் சேர்க்கப்படவில்லை.
