base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/005.yaml
  text: And God called the light Day[a], and the darkness he called Night. And there was evening, and there was morning—the first day.
translation:
  language: ta
  text: தேவன் ஒளிக்குப் “பகல்” என்று பெயரிட்டார்; இருளுக்கு “இரவு” என்று பெயரிட்டார். மாலை ஆனது, காலை ஆனது—முதல் நாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்கு சொல்: “நாள் ஒன்று.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: பெயரிட்டார்
  rationale: קרא என்பது இங்குள்ள பெயரிடும் அமைப்பில் ‘அழைத்தார்’ என்பதைக் காட்டிலும் இயல்பாக ‘பெயரிட்டார்’ என்று பொருள்படும்.
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: இங்கு பன்மை வடிவமுள்ள பெயர்ச்சொல் ஒருமை வினையுடன் வந்து ஒரே படைப்பாளரைக் குறிக்கிறது; நவீனத் தமிழ் வேதாகம நடைக்கு ‘தேவன்’ ஏற்றது.
- source_word: לָאוֹר ... יוֹם
  choice: ஒளிக்குப் “பகல்”
  rationale: எபிரெயப் பெயரிடும் அமைப்பையும் ஒளிக்கு வழங்கப்பட்ட பெயரையும் தெளிவாகக் காட்டுகிறது.
- source_word: וְלַחֹשֶׁךְ ... לָיְלָה
  choice: இருளுக்கு “இரவு”
  rationale: முந்தைய இணையான பெயரிடும் அமைப்பைப் பேணி, இருளுக்கு வழங்கப்பட்ட பெயரைத் தெளிவாக்குகிறது.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: மாலை ஆனது, காலை ஆனது
  rationale: இருமுறை வரும் וַיְהִי என்பதன் மறுமொழியையும் எபிரெயச் சொற்றொடரின் ஓசையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יוֹם אֶחָד
  choice: முதல் நாள்
  rationale: சொல்லுக்கு சொல் ‘நாள் ஒன்று’ என்றாலும், தொடர்ச்சியாக எண்ணப்படும் படைப்புநாட்களில் இதன் செயல்பாட்டை ‘முதல் நாள்’ இயல்பாகத் தெரிவிக்கிறது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יוֹם אֶחָד என்பதன் மொழிபெயர்ப்பு
  choice: முதல் நாள்
  alternative: நாள் ஒன்று
  rationale: எபிரெயம் வரிசை எண்ணான ‘முதலாம்’ என்பதற்குப் பதிலாக எண்ணிக்கையைக் குறிக்கும் אֶחָד (‘ஒன்று’) என்பதைக் கொண்டுள்ளது. தமிழ் கதைத் தொடரில் ‘முதல் நாள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது; மூலத்தின் குறிப்பிடத்தக்க நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. பெயரிடும் செயலைத் தெளிவாக்க மேற்கோள் குறிகள் பயன்படுத்தப்பட்டுள்ளன; எபிரெய இணை அமைப்பும் மறுமொழியும் இயன்றவரை காக்கப்பட்டுள்ளன.
