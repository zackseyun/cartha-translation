  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תַּֽדְשֵׁ֤א הָ/אָ֨רֶץ֙ דֶּ֔שֶׁא עֵ֚שֶׂב מַזְרִ֣יעַ זֶ֔רַע עֵ֣ץ פְּרִ֞י עֹ֤שֶׂה פְּרִי֙ לְ/מִינ֔/וֹ אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/011.yaml
  text: 'And God said[a], “Let the earth sprout vegetation: plants yielding seed, and fruit trees bearing fruit according to their kinds, with their seed in them[c][b], on the earth.” And it was so.'
translation:
  language: ta
  text: 'கடவுள், “பூமி பசுந்தாவரங்களை முளைப்பிக்கட்டும்[a]: விதை தரும் செடிகளையும், தத்தம் இனத்தின்படி[b] கனி தரும், தங்களுக்குள் விதையுள்ள[c] கனிமரங்களையும் பூமியின்மேல் முளைப்பிக்கட்டும்” என்றார். அப்படியே ஆனது.


    [a] அல்லது “பூமி பசுந்தாவரங்களைத் தோற்றுவிக்கட்டும்.”

    [b] எபிரெயத்தில் “தன் இனத்தின்படி”; இங்குள்ள ஒருமை, பல்வேறு வகைகள் ஒவ்வொன்றுக்கும் பொருந்தும் பகிர்நிலைப் பொருளில் வருகிறது.

    [c] அல்லது “அதன் விதை அதற்குள் உள்ளது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “பூமி பசுந்தாவரங்களைத் தோற்றுவிக்கட்டும்.”
    reason: תַּדְשֵׁא என்பதன் காரணவினை, தோன்றச் செய்தல் அல்லது வெளிக்கொணர்தல் என்ற பரந்த நுட்பத்தையும் கொண்டிருக்கலாம்.
  - marker: b
    text: எபிரெயத்தில் “தன் இனத்தின்படி”; இங்குள்ள ஒருமை, பல்வேறு வகைகள் ஒவ்வொன்றுக்கும் பொருந்தும் பகிர்நிலைப் பொருளில் வருகிறது.
    reason: மூலத்தின் இலக்கண ஒருமையையும் அதன் பகிர்நிலைச் செயல்பாட்டையும் பதிவு செய்கிறது.
  - marker: c
    text: அல்லது “அதன் விதை அதற்குள் உள்ளது.”
    reason: எபிரெய உறவுநிலைத் தொடரின் சொற்படியான ஒருமை அமைப்பைப் பாதுகாக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: תַּדְשֵׁא
  choice: முளைப்பிக்கட்டும்
  rationale: ஹிஃபில் விருப்ப/கட்டளை வடிவத்தின் காரணவினைப் பொருளையும், பூமியிலிருந்து தாவரங்கள் முளைத்து வெளிவரும் படிமத்தையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: דֶּשֶׁא
  choice: பசுந்தாவரங்கள்
  rationale: புல் என்று குறுக்காமல், புதிதாக வளரும் பசுமையான தாவர வளர்ச்சியைத் தொகுப்பாகக் குறிக்கிறது.
- source_word: עֵשֶׂב
  choice: செடிகள்
  rationale: மரமல்லாத தாவர வகையை பொதுவாகவும் தெளிவாகவும் குறிக்கிறது; சமையல் மூலிகைகள் என்ற குறுகிய பொருளைத் தவிர்க்கிறது.
- source_word: מַזְרִיעַ זֶרַע
  choice: விதை தரும்
  rationale: விதையை உற்பத்தி செய்வது அந்தச் செடிகளின் தொடர்ந்த இயல்பு என்பதைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: עֵץ פְּרִי
  choice: கனிமரங்கள்
  rationale: கனி தருவதால் வகைப்படுத்தப்படும் மரங்களைத் தமிழில் இயல்பான கூட்டுப்பன்மையாகக் குறிப்பிடுகிறது.
- source_word: עֹשֶׂה פְּרִי
  choice: கனி தரும்
  rationale: எபிரெயப் பங்கேற்புவினை குறிப்பிடும் வழக்கமான, பண்புசார் செயலை இயல்பான வேளாண்மைச் சொல்லாட்சியில் தருகிறது.
- source_word: לְמִינוֹ
  choice: தத்தம் இனத்தின்படி
  rationale: மூலத்தின் ஒருமை வடிவத்துக்குள்ள பகிர்நிலைப் பொருளைத் தமிழில் தெளிவாகக் காத்து, ஒவ்வொரு வகையும் அதற்குரிய இனத்தின்படி கனி தருவதை உணர்த்துகிறது.
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: தங்களுக்குள் விதையுள்ள
  rationale: ஒவ்வொரு கனிவகையிலும் அதன் விதை உள்ளடங்கியிருப்பதை இயல்பான தமிழில் கூறுகிறது; மூலத்தின் ஒருமை வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עַל הָאָרֶץ
  choice: பூமியின்மேல்
  rationale: படைப்புச் சூழலிலுள்ள நேரடியான இடப்பொருளைச் செம்மையான தமிழில் தருகிறது.
- source_word: וַיְהִי כֵן
  choice: அப்படியே ஆனது
  rationale: ஆணை நிறைவேறியதைச் சொல்லும் ஆதியாகமம் 1-ன் நிலையான நிறைவேற்றுச் சூத்திரத்தையும் அதன் கம்பீரமான ஓசையையும் காக்கிறது.
theological_decisions:
- issue: படைக்கப்பட்ட தாவர வகைகளின் வரம்பும் நுட்பமும்
  choice: பசுந்தாவரங்கள், விதை தரும் செடிகள், கனிமரங்கள் என்ற மூல உரையின் பரந்த வகைப்பாடுகளைப் பாதுகாத்தல்
  alternative: அனைத்து வகையான செடிகளும் மரங்களும் என்று பொதுமைப்படுத்துதல், அல்லது இவற்றை நவீன அறிவியல் தாவரவியல் வகைகளாகத் துல்லியப்படுத்துதல்
  rationale: வசனம் காணக்கூடிய இயற்கைத் தன்மைகளின் அடிப்படையில் தாவர வாழ்வை ஒழுங்குபடுத்திக் கூறுகிறது. மூலத்தின் வேறுபாடுகளைத் தட்டையாக்காமலும், பிற்கால அறிவியல் வகைப்பாட்டை அதில் புகுத்தாமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
- issue: לְמִינוֹ மற்றும் ஒருமைச் சுட்டுப்பெயர்களின் எண்
  choice: முதன்மை உரையில் இயல்பான தமிழுக்காகப் பகிர்நிலைப் பன்மையைப் பயன்படுத்தி, மூலத்தின் ஒருமையை அடிக்குறிப்பில் காட்டுதல்
  alternative: “தன் இனத்தின்படி; அதன் விதை அதற்குள் உள்ளது” என்று முழுவதும் இலக்கண ஒருமையில் மொழிபெயர்த்தல்
  rationale: எபிரெய ஒருமை கூட்டுவகைகளில் ஒவ்வொன்றுக்கும் பகிர்ந்து பொருந்துகிறது. தமிழ் பன்மை வாசிப்பை இயல்பாக்குகிறது; அடிக்குறிப்பு மூல வடிவத்தின் உண்மையான இலக்கண நுட்பத்தை வெளிப்படையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் செம்மையான நடையில் வடிவமைக்கப்பட்டது. “முளைப்பிக்கட்டும்” படிமத்தையும் காரணவினையையும் காக்கிறது; “பசுந்தாவரங்கள்” என்பது “புல்” என்ற அளவுக்கு பொருளைக் குறுக்காது. வாக்கியத்தின் பட்டியல் அமைப்பும் இறுதியிலுள்ள நிறைவேற்றுச் சூத்திரத்தின் கம்பீரமும் பேணப்பட்டுள்ளன.
