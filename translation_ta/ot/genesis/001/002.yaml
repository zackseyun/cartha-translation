source:
  edition: WLC
  text: וְ/הָ/אָ֗רֶץ הָיְתָ֥ה תֹ֨הוּ֙ וָ/בֹ֔הוּ וְ/חֹ֖שֶׁךְ עַל פְּנֵ֣י תְה֑וֹם וְ/ר֣וּחַ אֱלֹהִ֔ים מְרַחֶ֖פֶת עַל פְּנֵ֥י הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/002.yaml
  text: And the earth was formless and empty[a], and darkness was over the surface of the deep, and the Spirit of God was hovering over the surface of the waters.
translation:
  language: ta
  text: பூமி வடிவமில்லாமலும் வெறுமையாகவும் இருந்தது; ஆழத்தின் பரப்பின்மேல் இருள் இருந்தது; தேவனுடைய ஆவி[a] நீர்ப்பரப்பின்மேல் அசைந்துகொண்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவனிடமிருந்து வந்த ஒரு காற்று நீர்ப்பரப்பின்மேல் அசைந்துகொண்டிருந்தது” அல்லது “தேவனுடைய காற்று நீர்ப்பரப்பின்மேல் அசைந்துகொண்டிருந்தது.”
    reason: וְרוּחַ אֱלֹהִים என்பதில் ‘தேவனுடைய ஆவி’ என்றும் ‘தேவனிடமிருந்து வந்த ஒரு காற்று/தேவனுடைய காற்று’ என்றும் பொருள் கொள்ளக்கூடிய உண்மையான சொற்பொருள் ambiguity உள்ளது.
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: பூமியோ
  rationale: הָאָרֶץ என்பது ‘பூமி’; முன்னொட்டு ו தொடர் இணைப்பையும் புதிய காட்சியின் தலைப்பையும் குறிக்கிறது. தமிழில் இயல்பான தலைப்பாக்க வடிவமான ‘பூமியோ’ இதை வெளிப்படுத்துகிறது; தேவையற்ற ‘அப்போது’ என்ற காலக் குறிப்பைச் சேர்ப்பதில்லை.
- source_word: הָיְתָה
  choice: இருந்தது
  rationale: இங்கு היה என்பதன் இயல்பான பொருள் ஒரு நிலையை விவரிக்கும் ‘இருந்தது’ என்பதே. ‘ஆனது’ என்று மொழிபெயர்த்து நிலைமாற்றத்தை உரையில் சேர்க்கவில்லை.
- source_word: תֹהוּ וָבֹהוּ
  choice: உருவமின்றி வெறுமையாக
  rationale: இந்த இணைச்சொல் ஒழுங்குபடுத்தப்படாத வடிவின்மையையும் வெறுமையையும் குறிக்கிறது. நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் இருப்பதற்காக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וְחֹשֶׁךְ
  choice: இருள்
  rationale: எபிரெயச் சொல்லின் நேரடியான, இயல்பான தமிழ்ப் பொருள்.
- source_word: עַל־פְּנֵי
  choice: பரப்பின்மேல்
  rationale: சொல்லடியாக ‘முகத்தின்மேல்’ என்றாலும், நீர்சார்ந்த சூழலில் இடவியல் படிமத்தை இயல்பான தமிழில் ‘பரப்பின்மேல்’ வெளிப்படுத்துகிறது.
- source_word: תְהוֹם
  choice: ஆழம்
  rationale: இது ஆழமான முதன்மை நீர்ப்பரப்பைக் குறிக்கிறது. ‘பாதாளம்’ போன்ற வேறு இறையியல் கருத்துகளைச் சேர்க்காமல் ‘ஆழம்’ மூலத்தின் விரிவைத் தக்கவைக்கிறது.
- source_word: וְרוּחַ אֱלֹהִים
  choice: தேவனுடைய ஆவி
  rationale: רוּחַ என்பதற்கு ‘ஆவி’, ‘காற்று’, ‘மூச்சு’ ஆகிய பொருள்கள் உண்டு. பிரதான உரையில் வலுவான மரபுவழி வாசிப்பான ‘தேவனுடைய ஆவி’ பயன்படுத்தப்பட்டு, உண்மையான காற்று சார்ந்த மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מְרַחֶפֶת
  choice: அசைந்துகொண்டிருந்தது
  rationale: எபிரெயப் பெயரெச்ச வினை தொடர்ந்த செயலைக் காட்டுகிறது. ‘அசைந்துகொண்டிருந்தது’ என்பது நீர்ப்பரப்பின் மேல் தொடர்ந்து நகர்ந்த அல்லது மிதந்த இயக்கத்தை இயல்பாகக் கூறுகிறது; ஆவி/காற்று என்ற இரு வாசிப்புகளுக்கும் இடமளிக்கிறது.
- source_word: הַמָּיִם
  choice: நீர்ப்பரப்பு
  rationale: எபிரெயப் பன்மைச் சொல்லின் விரிந்த நீர்த்தொகுதி என்ற படிமத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; அதனுடன் வரும் ‘பரப்பின்மேல்’ என்ற மீளுரையைத் தவிர்க்க ஒருங்கிணைந்த வடிவம் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: הָיְתָה என்பது நிலையைச் சுட்டுகிறதா அல்லது நிலைமாற்றத்தைச் சுட்டுகிறதா?
  choice: இருந்தது
  alternative: ஆனது
  rationale: இவ்வசனம் அந்தக் கட்டத்தில் பூமி இருந்த நிலையை விவரிக்கிறது. எபிரெயம் நிலைமாற்றத்தை அவசியப்படுத்தாததால், பிந்தைய இறையியல் மறுகட்டமைப்பை உரைக்குள் கொண்டுவராமல் நிலைசார் வாசிப்பு தேர்ந்தெடுக்கப்பட்டது.
- issue: וְרוּחַ אֱלֹהִים என்பது தேவனுடைய ஆவியைக் குறிக்கிறதா அல்லது தேவனிடமிருந்து வந்த காற்றைக் குறிக்கிறதா?
  choice: தேவனுடைய ஆவி
  alternative: தேவனிடமிருந்து வந்த ஒரு காற்று / தேவனுடைய காற்று
  rationale: எபிரெயத் தொடர் உண்மையிலேயே இருபொருள் வாய்ந்தது. பிரதான உரை ஆவி என்ற வலுவான வாசிப்பை ஏற்கிறது; ஆனால் காற்று என்ற வாசிப்பை அடிக்குறிப்பில் வைத்திருப்பதன் மூலம் மூல உரையின் இறையியல் பதற்றம் தீர்த்துவிடப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய மரியாதைமிக்க நடையைக் கடைப்பிடிக்கிறது. செயற்கையான சொல்-சொல் அமைப்பையும் பழமையான ‘சூனியம்’ அல்லது ‘வெறுமையும் ஒழுங்கின்மையும்’ போன்ற கனமான வடிவங்களையும் தவிர்க்கிறது. ‘அசைந்துகொண்டிருந்தது’ என்ற பாலினமற்ற வினைவடிவு, ஆவி/காற்று என்ற மூலமொழியின் ambiguity-ஐ இலக்கண மட்டத்திலும் தேவையின்றித் தீர்க்காமல் வைக்கிறது.
