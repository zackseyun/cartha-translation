base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/008.yaml
  text: And God called the expanse Heaven[a]. And there was evening[b], and there was morning—the second day.
translation:
  language: ta
  text: கடவுள் அந்த விரிவிற்கு[b] “வானம்”[a] என்று பெயரிட்டார். மாலை வந்தது, காலை வந்தது—இரண்டாம் நாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “ஆகாயம்” அல்லது “வானங்கள்.” எபிரேயச் சொல்லான שָׁמַיִם காணக்கூடிய வானத்தையோ வானங்களையோ குறிக்கலாம்; இங்கு விரிவுக்குக் கடவுள் இடும் பெயர் இது.
    reason: lexical_alternative
  - marker: b
    text: மரபுவழியாக “திடவானம்”; அல்லது “வான்கூம்பு.” எபிரெய רָקִיעַ விரிக்கப்பட்ட அல்லது பரப்பப்பட்ட ஒன்றைக் குறிக்கிறது; அதன் அடிப்படைப் படிமத்தைத் தக்கவைக்க இங்கு “விரிவு” பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: பெயரிட்டார்
  rationale: קרא என்பதுடன் לְ வருவது இங்கு பெயரிடுதல் அல்லது ஒரு பெயரால் அழைத்தல் என்ற பொருளைத் தருகிறது; நவீன தமிழில் ‘பெயரிட்டார்’ என்பது இதை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு பன்மை வடிவமான பெயர்ச்சொல்லுடன் ஒருமை வினைச்சொல் வந்து ஒரே படைப்பாளரைக் குறிக்கிறது; ‘கடவுள்’ என்பது நவீன பொதுத் தமிழில் நேரடியான மொழிபெயர்ப்பு.
- source_word: לָרָקִיעַ
  choice: அந்த விரிவுக்கு
  rationale: רָקִיעַ என்பது விரிக்கப்பட்ட அல்லது பரப்பப்பட்ட ஒன்றைக் குறிக்கிறது. ‘விரிவு’ அதன் அடிப்படைப் படிமத்தைப் பாதுகாக்கிறது; ‘அந்த’ என்பது முந்தைய வசனத்தில் அறிமுகமானதைக் குறிக்கும் தமிழ் உரையாடல் இயல்பைத் தருகிறது.
- source_word: שָׁמָיִם
  choice: வானம்
  rationale: இச்சொல் காணக்கூடிய வானத்தையும் வானுலகையும் குறிக்கக்கூடும். தமிழ் ‘வானம்’ அதே பொருள் அகலத்தை இயல்பாகத் தக்கவைத்து, இங்கு கடவுள் கொடுக்கும் பெயராகவும் பொருந்துகிறது.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: மாலை வந்தது, காலை வந்தது
  rationale: எபிரெய உரையின் மீளும் இருபகுதி அமைப்பையும் நிகழ்வுகளின் தொடர்ச்சியையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: יוֹם שֵׁנִי
  choice: இரண்டாம் நாள்
  rationale: படைப்புநாட்களின் வரிசையில் இது வழக்கமான வரிசை எண்ணுப் பெயராகச் செயல்படுகிறது; ‘இரண்டாம் நாள்’ இயல்பான தமிழ் வடிவம்.
