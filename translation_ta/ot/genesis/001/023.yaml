  text: וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם חֲמִישִֽׁי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/023.yaml
  text: And there was evening[a], and there was morning—the fifth day.
translation:
  language: ta
  text: மாலையும் இருந்தது; காலையும் இருந்தது—ஐந்தாம் நாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொற்சொல்லாக: “மாலையாக இருந்தது; காலையாக இருந்தது—ஐந்தாம் நாள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: வந்தது
  rationale: היה என்பதன் தொடர்கதை வடிவம் இங்கு படைப்புக் குறிப்பில் மீண்டும் வரும் சூத்திரமாக உள்ளது. இயல்பான நவீனத் தமிழில் ‘வந்தது’ என்பது மாலையும் காலையும் ஏற்பட்டன என்ற பொருளைத் தெளிவாகத் தந்து, மறுபடியும் வரும் ஓசைநயத்தையும் காக்கிறது.
- source_word: עֶרֶב
  choice: மாலை
  rationale: இந்தப் பெயர்ச்சொல் மாலையைக் குறிக்கிறது; தொடரில் வரும் ‘காலை’ என்பதற்கு இயல்பான இணையாகவும் உள்ளது.
- source_word: בֹּקֶר
  choice: காலை
  rationale: இந்தப் பெயர்ச்சொல் காலையைக் குறிக்கிறது; ‘மாலை’ என்பதுடனான இணை அமைப்பைத் தக்கவைக்கிறது.
- source_word: יוֹם
  choice: நாள்
  rationale: இங்கு எண்ணிட்டு அழைக்கப்படும் படைப்பு நாளைக் குறிக்கிறது. அதன் கால அளவை விளக்கமாக நிர்ணயிக்காமல் நேரடியான பொருளைத் தருகிறது.
- source_word: חֲמִישִׁי
  choice: ஐந்தாம்
  rationale: ‘நாள்’ என்பதைக் குறிக்கும் சரியான வரிசை எண்ணாகும்.
theological_decisions:
- issue: படைப்பு நாளுக்குரிய மாலை–காலைச் சூத்திரத்தின் இயல்பு
  choice: ‘மாலையும் வந்தது; காலையும் வந்தது—ஐந்தாம் நாள்’ என்ற காலச்சூத்திரத்தை விளக்கவுரை சேர்க்காமல் தக்கவைத்தல்
  alternative: இதை 24 மணி நேர நாளாகவோ, நீண்ட காலப்பகுதியாகவோ வெளிப்படையாகப் பொருள்படுத்துதல்
  rationale: எபிரெய உரை மாலை, காலை, வரிசை எண்ணுள்ள நாள் ஆகியவற்றை மட்டுமே கூறுகிறது. நாளின் கால அளவு அல்லது இலக்கிய இயல்பு குறித்த பிற்கால விவாதத்தை மொழிபெயர்ப்பு தானாகத் தீர்மானிக்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘வந்தது’ என்ற ஒரே வினை இருமுறை பயன்படுத்தப்பட்டு எபிரெயச் சூத்திரத்தின் மீளுரையும் ஓசைநயமும் காக்கப்பட்டுள்ளன; சொற்சொல்லான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
