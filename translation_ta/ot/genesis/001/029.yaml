  to: 'கடவுள் சொன்னார்: “இதோ, முழுப் பூமியின் மேற்பரப்பில் உள்ள விதை தரும் எல்லாத் தாவரங்களையும், விதைகளுள்ள கனிகளைக் கொண்ட எல்லா மரங்களையும் உங்களுக்குக் கொடுத்திருக்கிறேன். அவை உங்களுக்கு உணவாக இருக்கும்.”'
