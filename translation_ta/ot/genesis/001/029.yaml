id: GEN.1.29
reference: Genesis 1:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים הִנֵּה֩ נָתַ֨תִּי לָ/כֶ֜ם אֶת כָּל עֵ֣שֶׂב זֹרֵ֣עַ זֶ֗רַע אֲשֶׁר֙ עַל פְּנֵ֣י כָל הָ/אָ֔רֶץ וְ/אֶת כָּל הָ/עֵ֛ץ אֲשֶׁר בּ֥/וֹ פְרִי עֵ֖ץ זֹרֵ֣עַ זָ֑רַע לָ/כֶ֥ם יִֽהְיֶ֖ה לְ/אָכְלָֽה־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/029.yaml
  text: And God said[a], “Behold, I have given you every seed-bearing plant that is on the face of all the earth, and every tree in which is the fruit of a tree bearing seed[c][b]. It will be for you as food.”
translation:
  language: ta
  text: 'கடவுள் சொன்னார்: “இதோ, முழுப் பூமியின் மேற்பரப்பில் உள்ள விதை தரும் எல்லாத் தாவரங்களையும், விதைகளுள்ள கனிகளைக் கொண்ட எல்லா மரங்களையும் உங்களுக்குக் கொடுத்திருக்கிறேன். அவை உங்களுக்கு உணவாக இருக்கும்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தைத் தொடர்ந்து வரும் அறிவிப்பின்மேல் திருப்பும் எபிரேயச் சொல்லின் வலிமையை, இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: נָתַתִּי
  choice: கொடுத்திருக்கிறேன்
  rationale: முடிவுற்ற செயலும் அதன் தற்போதைய விளைவும் சேர்ந்த எபிரேய நிறைநிலை வினையின் பொருளை வெளிப்படுத்துகிறது.
- source_word: כָּל עֵשֶׂב זֹרֵעַ זֶרַע
  choice: விதை தரும் எல்லாச் செடிகளையும்
  rationale: עֵשֶׂב என்பது தாவர வளர்ச்சியைப் பொதுவாகக் குறிக்கலாம்; ‘செடி’ என்பது இங்கு சாதாரண தமிழில் தெளிவாகவும், זֹרֵעַ זֶרַע என்பதற்கு ‘விதை தரும்’ என்பது இயல்பாகவும் உள்ளது.
- source_word: אֲשֶׁר עַל־פְּנֵי כָל־הָאָרֶץ
  choice: பூமி முழுவதின் மேற்பரப்பிலும் உள்ள
  rationale: ‘பூமியின் முகத்தின்மேல்’ என்ற எபிரேய இடவியல் உருவகத்தை வாசிக்க இயல்பான தமிழில் ‘மேற்பரப்பில்’ எனக் காக்கிறது.
- source_word: כָּל הָעֵץ
  choice: எல்லா மரங்களையும்
  rationale: כָּל உடன் வரும் ஒருமை பெயர்ச்சொல்லின் பகிர்வுப் பொருளை இயல்பான தமிழ் பன்மையால் தெரிவிக்கிறது.
- source_word: אֲשֶׁר בּוֹ פְרִי־עֵץ זֹרֵעַ זָרַע
  choice: விதையுள்ள கனிகளைத் தரும்
  rationale: மரத்தோடு தொடர்புடைய கனியில் விதை இருப்பதைத் தெளிவாகக் காட்டி, மூலத்தின் சற்று செறிவான அமைப்பை இயல்பான தமிழில் வழங்குகிறது.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: அவை உங்களுக்கு உணவாக இருக்கும்
  rationale: முன்னுள்ள செடிகளும் மரங்களும் கூட்டாக உணவாக அளிக்கப்படுவதைத் தமிழில் இயல்பான பன்மைச் சுட்டுப்பெயரால் கூறுகிறது; எபிரேய வினை வடிவம் ஒருமையாக இருந்தாலும் அதன் பொருள் கூட்டானது.
theological_decisions:
- issue: உணவாக அளிக்கப்பட்டவற்றைக் குறிக்கும் வினை மற்றும் சுட்டுப்பெயரின் எண்
  choice: அவை உங்களுக்கு உணவாக இருக்கும்
  alternative: அது உங்களுக்கு உணவாக இருக்கும்
  rationale: எபிரேயத்தில் கூட்டுப் பொருளைத் தொடர்ந்து ஒருமை வினை உள்ளது. தமிழில் ‘அவை’ என்பது முன்னுள்ள செடிகளையும் மரங்களையும் தெளிவாகச் சுட்டுகிறது; இதனால் வசனத்தின் இறையியல் வரம்பு விரிவாக்கப்படவோ குறுக்கப்படவோ இல்லை.
translation_notes:
  register: நவீனத் தரமான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், படைப்புக் கட்டளையின் கண்ணியமான தொனியைத் தக்கவைத்தும் அமைக்கப்பட்டது. தேவையற்ற சமய மரபுச் சொற்களும் பழமையான நடையும் தவிர்க்கப்பட்டுள்ளன.
