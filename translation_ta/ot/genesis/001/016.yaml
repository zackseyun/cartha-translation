source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִ֔ים אֶת שְׁנֵ֥י הַ/מְּאֹרֹ֖ת הַ/גְּדֹלִ֑ים אֶת הַ/מָּא֤וֹר הַ/גָּדֹל֙ לְ/מֶמְשֶׁ֣לֶת הַ/יּ֔וֹם וְ/אֶת הַ/מָּא֤וֹר הַ/קָּטֹן֙ לְ/מֶמְשֶׁ֣לֶת הַ/לַּ֔יְלָה וְ/אֵ֖ת הַ/כּוֹכָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/016.yaml
  text: 'And God made the two great lights: the greater light to rule the day[a], and the lesser light to rule the night, and the stars.'
translation:
  language: ta
  text: 'கடவுள் இரண்டு பெரிய வானொளிகளை உண்டாக்கினார்: பகலை ஆளுவதற்காகப் பெரிய வானொளியையும், இரவை ஆளுவதற்காகச் சிறிய வானொளியையும், மேலும் நட்சத்திரங்களையும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: உண்டாக்கினார்
  rationale: עשה என்பதன் பொதுவான பொருள் ‘செய்/உண்டாக்கு’. இங்கு வானொளிகளைப் படைத்த செயலை இயல்பாகவும் நேரடியாகவும் தெரிவிக்க ‘உண்டாக்கினார்’ பொருத்தமானது; ‘நியமித்தார்’ என்பது சூழலிலுள்ள பணியை வினைக்குள் அளவுக்கு மீறிச் சேர்க்கும்.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: ஆதியாகமம் 1-இல் ஒருமை வினையோடு வரும் אֱלֹהִים ஒரே கடவுளைக் குறிக்கிறது; நவீன பொதுத்தமிழில் ‘கடவுள்’ தெளிவான, மரியாதையான மொழிபெயர்ப்பு.
- source_word: שְׁנֵי הַמְּאֹרֹת הַגְּדֹלִים
  choice: இரண்டு பெரிய ஒளிச்சுடர்கள்
  rationale: מָאוֹר என்பது ஒளி தரும் பொருள் அல்லது ஒளிப்பிழம்பைக் குறிக்கிறது. ‘ஒளிச்சுடர்கள்’ என்பது சூரியன், சந்திரன் என்ற பெயர்களைச் சேர்க்காமல் மூலத்தின் சொல்லாட்சியைப் பேணுகிறது; גְּדֹלִים என்பதற்கு ‘பெரிய’ நேரான இணை.
- source_word: הַמָּאוֹר הַגָּדֹל
  choice: பெரிய ஒளிச்சுடர்
  rationale: எபிரெயில் சொற்பட ‘பெரிய ஒளிச்சுடர்’ என்றே உள்ளது. தமிழில் அடுத்து வரும் ‘சிறிய ஒளிச்சுடர்’ என்பதோடு இயல்பான ஒப்பீட்டு எதிரிணையை இது உருவாக்குகிறது.
- source_word: לְמֶמְשֶׁלֶת הַיּוֹם
  choice: பகலை ஆளுவதற்காக
  rationale: מֶמְשֶׁלֶת ஆட்சி அல்லது ஆளுகையைக் குறிக்கிறது. לְ கட்டமைப்பின் நோக்கம்/பணி சார்ந்த பொருளை ‘ஆளுவதற்காக’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמָּאוֹר הַקָּטֹן
  choice: சிறிய ஒளிச்சுடர்
  rationale: קָטֹן என்பதன் அடிப்படைப் பொருள் ‘சிறிய’. ‘பெரிய ஒளிச்சுடர்’ என்பதற்கான சமநிலையான எதிரிணையாக இது தமிழில் தெளிவாக உள்ளது.
- source_word: לְמֶמְשֶׁלֶת הַלַּיְלָה
  choice: இரவை ஆளுவதற்காக
  rationale: முந்தைய இணை அமைப்பைப் போலவே מֶמְשֶׁלֶת என்பதன் ஆளுகைப் பொருளையும் לְ என்பதன் நோக்கப் பொருளையும் பேணுகிறது.
- source_word: וְאֵת הַכּוֹכָבִים
  choice: நட்சத்திரங்களையும்
  rationale: וְ உடன் வரும் நேரடி வினைப்பொருள் குறியீடு மேலும் ஒரு படைக்கப்பட்ட பொருளைச் சேர்க்கிறது. ‘நட்சத்திரங்களையும்’ என்பது ‘and also the stars’ என்ற இயல்பான தமிழ் சேர்க்கைப் பொருளைத் தருவதோடு எபிரெயின் சுருக்கமான இறுதிச் சேர்ப்பையும் பேணுகிறது.
theological_decisions:
- issue: சூரியன், சந்திரன் என்று பெயரிடாமல் வானொளிகளை மொழிபெயர்த்தல்
  choice: ‘பெரிய ஒளிச்சுடர்’, ‘சிறிய ஒளிச்சுடர்’ என்று மூலத்தின் சொல்லாட்சியைப் பேணுதல்
  alternative: ‘சூரியன்’, ‘சந்திரன்’ என்று வெளிப்படையாகப் பெயரிடுதல்
  rationale: எபிரெய் உரை வழக்கமான சூரியன், சந்திரன் என்ற பெயர்களுக்குப் பதிலாக מָאוֹר (‘ஒளி தரும் பொருள்/ஒளிச்சுடர்’) என்பதையே திட்டமிட்டு பயன்படுத்துகிறது. எனவே உரையில் இல்லாத பெயர்களைச் சேர்க்காமல் அதன் இலக்கிய மற்றும் இறையியல் நுணுக்கத்தைப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பான, கண்ணியமான நடை. ‘ஒளிச்சுடர்’ என்ற சொல் மூலத்தின் luminary கருத்தைத் தக்கவைத்து, சூரியன் மற்றும் சந்திரன் என உரையில் இல்லாத பெயர்களைத் தவிர்க்கிறது. இணை அமைப்பைத் தெளிவுபடுத்த இறுதியில் ‘உண்டாக்கினார்’ மீண்டும் இடப்பட்டுள்ளது; இது தமிழில் வாக்கியத்தை இயல்பாக்கும் இலக்கண நிரப்பு, புதிய கருத்துச் சேர்ப்பு அல்ல.
