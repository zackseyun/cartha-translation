source:
  edition: WLC
  text: וַ/תּוֹצֵ֨א הָ/אָ֜רֶץ דֶּ֠שֶׁא עֵ֣שֶׂב מַזְרִ֤יעַ זֶ֨רַע֙ לְ/מִינֵ֔/הוּ וְ/עֵ֧ץ עֹֽשֶׂה פְּרִ֛י אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/012.yaml
  text: And the earth brought forth vegetation[a], plants yielding seed according to their kinds, and trees bearing fruit in which is their seed, according to their kinds[b]. And God saw that it was good.
translation:
  language: ta
  text: 'பூமி பசுந்தாவரங்களை விளைவித்தது: தத்தம் வகையின்படி[a] விதை தரும் செடிகளையும், தத்தம் வகையின்படி விதையுள்ள கனிகளைத் தரும் மரங்களையும் விளைவித்தது. கடவுள் அது நல்லது என்று கண்டார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வகை” என்பது எபிரெயத்தில் படைக்கப்பட்ட வகை அல்லது பிரிவைக் குறிக்கிறது; நவீன உயிரியல் அறிவியலின் தொழில்நுட்பச் சொல்லான “species” என்பதையே அவசியம் குறிக்காது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹצֵא
  choice: முளைப்பித்தது
  rationale: יצא என்பதன் ஹிஃபில் வடிவம், பூமி தாவரங்களை வெளிவரச் செய்ததைச் சுட்டுகிறது. தாவரச் சூழலில் ‘முளைப்பித்தது’ இயல்பாகவும் காரணவினை நுணுக்கத்துடனும் உள்ளது.
- source_word: דֶּשֶׁא
  choice: பசுந்தாவரங்கள்
  rationale: இச்சொல் வெறும் புல்லை மட்டும் அல்லாமல் புதிதாக முளைக்கும் பசுமையான தாவர வளர்ச்சியைத் தொகுப்பாகக் குறிக்கிறது.
- source_word: עֵשֶׂב מַזְרִיעַ זֶרַע
  choice: விதை தரும் செடிகள்
  rationale: தொடர்ந்து விதை உண்டாக்கும் இனப்பெருக்கத் திறனைச் சுருக்கமாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: לְמִינֵהוּ
  choice: தத்தம் வகையின்படி
  rationale: מין என்பது நவீன உயிரியல் தொழில்நுட்பச் சொல்லான ‘இனம்/species’ என்பதை அவசியம் குறிக்காமல், படைக்கப்பட்ட வகை அல்லது பிரிவைக் குறிக்கிறது; ‘தத்தம்’ எபிரெய ஒருமை சார்ந்த பகிர்வு உணர்வையும் காக்கிறது.
- source_word: וְעֵץ עֹשֶׂה פְּרִי
  choice: கனிகளைத் தரும் மரங்கள்
  rationale: எபிரெய ஒருமை இங்கு தொகுப்புப் பொருளில் வருவதால் தமிழில் பன்மை இயல்பானது; ‘கனி தரும்’ என்பது செயப்பெயரெச்சத்தின் தொடர்ச்சியான விளைச்சல் உணர்வைக் காட்டுகிறது.
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: விதை தன்னில் உள்ள கனிகள்
  rationale: சொற்றொடரின் அண்மைச் சார்பையும் எபிரெய மொழியின் ஒருமை உடன்பாட்டையும் காத்து, விதை கனிக்குள் இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: அது நல்லது என்று கடவுள் கண்டார்
  rationale: படைப்புக் குறிப்பில் திரும்பத் திரும்ப வரும் மதிப்பீட்டு வாசகத்தை நேரடியாகவும் கண்ணியமான நவீன தமிழிலும் தருகிறது.
theological_decisions:
- issue: படைப்பின் வகைகளை நவீன உயிரியல் வகைப்பாடாக மாற்றாமல் மொழிபெயர்த்தல்
  choice: தத்தம் வகையின்படி
  alternative: தத்தம் இனத்தின்படி
  rationale: מין என்பது பழங்கால உரையின் வகை அல்லது பிரிவு மொழி; அதை நவீன அறிவியல் ‘species’ என்ற துல்லியமான கருத்தோடு அடையாளப்படுத்தாமல் இருப்பது உரையின் சொந்த வரம்பையும் தெளிவின்மையையும் காக்கிறது.
- issue: விதை எதில் உள்ளது என்ற சார்பு
  choice: விதை தன்னில் உள்ள கனிகள்
  alternative: அவற்றின் விதை அவற்றில் உள்ளது
  rationale: எபிரெய உரையில் மரமும் கனியும் ஒருமைத் தொகுப்புச் சொல்லாக்கத்தில் நெருக்கமாக இருப்பதால், விதை கனிக்குள் இருப்பதை இயல்பாக வெளிப்படுத்தியபோதும் தேவையற்ற தாவரவியல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘பசுந்தாவரங்கள்’, ‘செடிகள்’, ‘மரங்கள்’ என்ற சொற்கள் எபிரெய உரையின் பரந்ததிலிருந்து குறிப்பானதுக்குச் செல்லும் தாவர வகைப்பாட்டை வாசிக்க எளிதாகக் காட்டுகின்றன; ‘தத்தம் வகையின்படி’ என்ற மறுபதிப்பு மூலத்தின் இருமுறை அமைப்பைப் பாதுகாக்கிறது.
