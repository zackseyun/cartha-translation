  naturalness: '‘பூமி பசுந்தாவரங்களை முளைப்பித்தது: ... மரங்களையும் முளைப்பித்தது’ என்பது நவீன தமிழில் கனமாகவும் மீளுரைப்பாகவும் உள்ளது. ஒரு முதன்மை வினைச்சொல்லுக்குக் கீழ் இரு வகைத் தாவரங்களையும் பட்டியலிடுவது இயல்பானது. ‘விதையுள்ள கனிகளைத் தரும்’ என்பது விதை கனிக்குள் உள்ளது என்ற கருத்தைத் தெளிவாகவும் சுருக்கமாகவும் கூறுகிறது.'
