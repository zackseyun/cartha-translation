  text: וַ/יַּ֤רְא אֱלֹהִים֙ אֶת כָּל אֲשֶׁ֣ר עָשָׂ֔ה וְ/הִנֵּה ט֖וֹב מְאֹ֑ד וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם הַ/שִּׁשִּֽׁי־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/031.yaml
  text: And God saw all that he had made, and behold, it was very good. And there was evening and there was morning, the sixth day.
translation:
  language: ta
  text: கடவுள் தாம் உண்டாக்கிய அனைத்தையும் பார்த்தார்; இதோ, அது மிகவும் நன்றாக இருந்தது. மாலையும் வந்தது, காலையும் வந்தது—ஆறாம் நாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: பார்த்தார்
  rationale: ראה என்பதன் வழக்கமான கதைநடைப் பொருளான ‘பார்த்தார்’ என்பதைப் பேணுகிறது; இச்சூழலில் மதிப்பீட்டுப் பார்வையும் உட்பொதிந்திருந்தாலும் அதை விளக்கமாகச் சேர்க்கவில்லை.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: பன்மை வடிவமுடைய இப்பெயர்ச்சொல் இங்கு ஒருமை வினையுடன் வந்து ஒரே படைப்பாளரைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பான பொதுவான மொழிபெயர்ப்பு ‘கடவுள்’.
- source_word: כָּל אֲשֶׁר עָשָׂה
  choice: தாம் உண்டாக்கிய அனைத்தையும்
  rationale: படைப்பின் முழுத் தொகுதியையும் குறிக்கிறது. ‘தாம்’ என்பது தமிழில் கடவுளைக் குறிக்கும் மரியாதையான தற்சுட்டுப் பயன்பாடு; ‘உண்டாக்கிய அனைத்தையும்’ நிறைவுற்ற செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து வலியுறுத்தும் הִנֵּה என்பதன் உரைநடைச் செயல்பாட்டை இயல்பான, கண்ணியமான தமிழில் பேணுகிறது.
- source_word: טוֹב מְאֹד
  choice: மிகவும் நன்றாக
  rationale: טוֹב என்பதன் பரந்த ‘நன்று’ என்ற மதிப்பீட்டையும் מְאֹד என்பதன் வலியுறுத்தலையும் பேணுகிறது; நன்மையை அறநெறி, அழகு அல்லது பயன்பாடு என்ற ஒரே துறைக்குள் குறுக்கவில்லை.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: மாலையும் வந்தது, காலையும் வந்தது
  rationale: எபிரெயச் சூத்திரத்தில் இருமுறை வரும் היה-வின் நிகழ்வையும் மாலை–காலை வரிசையையும் தமிழில் இயல்பாகவும் மீளுருவாக்கத்துடனும் தருகிறது.
- source_word: יוֹם הַשִּׁשִּׁי
  choice: ஆறாம் நாள்
  rationale: பெயர்ச்சொல்லுடன் வரும் வரிசை எண்ணை நேரடியாகவும் இயல்பாகவும் தருகிறது; குறிப்பிட்ட நாளைக் குறிக்கும் எபிரெய வடிவத்தைச் சூழல் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: טוֹב מְאֹד என்பதில் படைப்பின் நன்மையின் இயல்பு
  choice: மிகவும் நன்றாக
  alternative: மிக மிக நன்றாக / முற்றிலும் நன்றாக
  rationale: படைப்பைப் பற்றிய பரந்த நேர்மறை மதிப்பீட்டை வைத்திருக்கிறது; அதை அறநெறி சார்ந்ததாகவோ, அழகியல் சார்ந்ததாகவோ, செயல்பாடு சார்ந்ததாகவோ மட்டும் வரையறுக்கவில்லை.
- issue: படைப்பு நாட்கள் குறித்த விவாதங்களை முன்கூட்டியே தீர்மானிக்காத நாள் நிறைவுச் சூத்திரம்
  choice: மாலையும் வந்தது, காலையும் வந்தது—ஆறாம் நாள்
  alternative: மாலையானது, காலையானது; ஆறாவது நாள்
  rationale: எபிரெய மூலத்தின் மாலை–காலை வரிசையையும் ‘ஆறாம் நாள்’ என்ற சொல்லாட்சியையும் நெருக்கமாகப் பேணுகிறது; நாளின் நீளம் அல்லது இலக்கியப் பங்கு குறித்து கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம உரைநடை. ‘இதோ’ மூலத்தின் கவனஈர்ப்பு வலிமையைப் பேணுகிறது. தொடக்கநூல் 1-இன் மீளும் நாள் நிறைவுச் சூத்திரத்தைக் காக்க ‘மாலையும் வந்தது, காலையும் வந்தது’ பயன்படுத்தப்பட்டுள்ளது.
