  yaml_path: translation/ot/genesis/043/012.yaml
  text: Take double money in your hand[a], and take back in your hand the money that was returned in the mouth of your sacks[b]; perhaps it was a mistake.
translation:
  language: ta
  text: இருமடங்கு பணத்தை உங்களுடன் எடுத்துக்கொள்ளுங்கள். உங்கள் சாக்குகளின் வாயில் திருப்பி வைக்கப்பட்ட பணத்தையும் உங்களுடன் திரும்பக் கொண்டுபோங்கள்[a]. ஒருவேளை அது ஒரு தவறாக இருக்கலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “உங்கள் கையில் திரும்பக் கொண்டுபோங்கள்.”
    reason: source_idiom
lexical_decisions:
- source_word: כֶסֶף מִשְׁנֶה
  choice: இருமடங்கு பணம்
  rationale: מִשְׁנֶה என்பது இங்கு பணத்தின் இருமடங்கு அளவைக் குறிக்கிறது. முந்தைய தொகையோடு அதற்குச் சமமான கூடுதல் தொகையையும் எடுத்துச் செல்ல வேண்டும் என்ற கருத்தைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: קְחוּ בְיֶדְכֶם
  choice: உங்களுடன் எடுத்துக்கொள்ளுங்கள்
  rationale: ‘உங்கள் கையில் எடுத்துக்கொள்ளுங்கள்’ என்பது எபிரெயச் சொற்றொடரின் நேரடி வடிவம்; தமிழில் உடன் எடுத்துச் செல்வதைக் குறிக்கும் இயல்பான மரபுத்தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: הַכֶּסֶף הַמּוּשָׁב
  choice: திருப்பி வைக்கப்பட்டிருந்த பணம்
  rationale: שוב என்பதன் Hophal வடிவம் செயப்பாட்டு பொருளைக் கொண்டது. சகோதரர்கள் பணத்தைத் திருப்பியதாகக் கூறாமல், அது அவர்களுடைய சாக்குகளில் மீண்டும் வைக்கப்பட்டிருந்ததை இத்தேர்வு வெளிப்படுத்துகிறது.
- source_word: בְּפִי אַמְתְּחֹתֵיכֶם
  choice: உங்கள் சாக்குகளின் வாயில்
  rationale: பையின் திறப்பை ‘வாய்’ எனக் குறிப்பிடும் எபிரெய உருவகத்தைத் தமிழிலும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: תָּשִׁיבוּ בְיֶדְכֶם
  choice: உங்களுடன் திரும்பக் கொண்டுபோங்கள்
  rationale: Hiphil வடிவத்தின் ‘திரும்பக் கொண்டுபோதல்’ என்ற காரணவினைப் பொருளையும், בְיֶדְכֶם என்பதன் ‘உங்களுடன்’ என்ற நடைமுறைப் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: אוּלַי מִשְׁגֶּה הוּא
  choice: ஒருவேளை அது தவறுதலாக நடந்திருக்கலாம்
  rationale: אוּלַי என்பதன் ஐயப்பாட்டையும் מִשְׁגֶּה என்பதன் தவறு அல்லது கவனப்பிசகு என்ற குற்றஞ்சாட்டாத பொருளையும் பாதுகாக்கிறது.
