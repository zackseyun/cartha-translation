  yaml_path: translation/ot/genesis/043/030.yaml
  text: Then Joseph hurried[a], because his compassion for his brother was stirred, and he sought a place to weep[b]. He entered the room and wept there.
translation:
  language: ta
  text: அப்போது யோசேப்பு விரைந்தார்; ஏனெனில், தம் சகோதரனுக்காக அவருடைய இரக்கம் பொங்கியது. அவர் அழுவதற்கு ஓர் இடத்தைத் தேடி[a], அறைக்குள் சென்று அங்கே அழுதார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னொரு மொழிபெயர்ப்பு: “அழுவதற்குத் தேடினார்.” எபிரெயத்தில் சொல்லுக்கு சொல் இவ்வாறே உள்ளது; சூழல், அவர் அழுவதற்குத் தனியான இடத்தைத் தேடினார் என்பதைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: விரைந்தார்
  rationale: வினைச்சொல்லின் ‘விரைதல்’ என்ற பொருளை நேரடியாகத் தருகிறது; மூலத்தில் இல்லாத ‘வெளியே’ என்பதைச் சேர்க்கவில்லை.
- source_word: נִכְמְרוּ רַחֲמָיו
  choice: அவருடைய உள்ளம் உருகியது
  rationale: இரக்கங்கள் கிளர்ந்தன/சூடாயின என்னும் எபிரெய உணர்ச்சி மரபுத்தொடரை, அதன் ஆழ்ந்த பாசத்தையும் உணர்ச்சிப் பெருக்கையும் காத்து இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: אֶל אָחִיו
  choice: தன் சகோதரனுக்காக
  rationale: யோசேப்பின் உணர்ச்சியின் நோக்கைத் தெளிவாகக் காட்டுகிறது; மூலத்தில் இவ்வசனத்தில் இல்லாத பென்யமீன் என்ற பெயரைச் சேர்க்கவில்லை.
- source_word: וַיְבַקֵּשׁ לִבְכּוֹת
  choice: அழுவதற்கு ஓர் இடத்தைத் தேடி
  rationale: சொல்லுக்கு சொல் ‘அழுவதற்குத் தேடினார்’ என்றாலும், சூழலில் தனியாக அழுவதற்கான இடத்தைத் தேடுதல் உட்பொருளாக உள்ளது; இதை அடிக்குறிப்புடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַחַדְרָה
  choice: அறைக்குள்
  rationale: இலக்கு நோக்கிய இயக்கத்தைக் காட்டும் எபிரெய வடிவத்தையும், தனியறை/உள்ளறை என்ற பொதுப் பொருளையும் சுருக்கமாகத் தருகிறது.
- source_word: וַיֵּבְךְּ שָׁמָּה
  choice: அங்கே அழுதார்
  rationale: அழுதல் என்ற வினையையும் שָׁמָּה என்பதன் இட வலியுறுத்தலையும் நேரடியாகப் பாதுகாக்கிறது.
