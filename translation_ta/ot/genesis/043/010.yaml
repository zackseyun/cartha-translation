source:
  edition: WLC
  text: כִּ֖י לוּלֵ֣א הִתְמַהְמָ֑הְנוּ כִּֽי עַתָּ֥ה שַׁ֖בְנוּ זֶ֥ה פַעֲמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/010.yaml
  text: For if we had not delayed[b][a], by now we would have returned twice.
translation:
  language: ta
  text: ஏனெனில், நாம் தாமதித்திருக்காவிட்டால்[a], இந்நேரத்திற்குள் இருமுறை திரும்பி வந்திருப்போம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நேரம் கடத்தியிருக்காவிட்டால்’ அல்லது ‘தயங்கியிருக்காவிட்டால்.’ எபிரெய வினை தாமதித்தல், நேரம் கடத்துதல், தயங்குதல் ஆகிய பொருள்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘இந்த இரண்டு முறைகள் திரும்பியிருப்போம்.’ இது ‘இருமுறை திரும்பியிருப்போம்’ என்று பொருள்படும் எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: யூதா தன் தந்தையிடம் கூறும் காரண விளக்கத்தை அறிமுகப்படுத்துவதால், இந்த இணைப்புச் சொல் தமிழில் இயல்பாக ‘ஏனெனில்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: לוּלֵא
  choice: …இருக்காவிட்டால்
  rationale: நிகழாத கடந்தகால நிலையை முன்வைக்கும் எதிர்நிலை நிபந்தனையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הִתְמַהְמָהְנוּ
  choice: நாம் தாமதித்திருக்காவிட்டால்
  rationale: இந்த வினை தாமதித்தல், நேரம் கடத்துதல் அல்லது தயங்குதல் ஆகிய நுணுக்கங்களைத் தரலாம்; புறப்படுவது தள்ளிப்போன இச்சூழலில் ‘தாமதித்தல்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: כִּי עַתָּה
  choice: இந்நேரத்திற்குள்
  rationale: நிகழாத நிபந்தனையின் விளைவு தற்போதைய நேரத்துக்கு முன்பே நிறைவேறியிருக்கும் என்ற பொருளைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: שַׁבְנוּ
  choice: திரும்பி வந்திருப்போம்
  rationale: எபிரெயத்தில் நிறைவுற்ற வினைவடிவமாக இருந்தாலும், எதிர்நிலை நிபந்தனையின் விளைவைக் குறிப்பதால் தமிழில் ‘வந்திருப்போம்’ என்ற வடிவம் பொருத்தமானது.
- source_word: זֶה פַעֲמָיִם
  choice: இருமுறை
  rationale: சொல்லுக்குச் சொல் வடிவத்தை விட, இரண்டு முறை திரும்பிவர முடிந்திருக்கும் என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் இயல்பான தமிழாக்கம் இது.
