  text: וַ/יִּֽירְא֣וּ הָֽ/אֲנָשִׁ֗ים כִּ֣י הֽוּבְאוּ֮ בֵּ֣ית יוֹסֵף֒ וַ/יֹּאמְר֗וּ עַל דְּבַ֤ר הַ/כֶּ֨סֶף֙ הַ/שָּׁ֤ב בְּ/אַמְתְּחֹתֵ֨י/נוּ֙ בַּ/תְּחִלָּ֔ה אֲנַ֖חְנוּ מֽוּבָאִ֑ים לְ/הִתְגֹּלֵ֤ל עָלֵ֨י/נוּ֙ וּ/לְ/הִתְנַפֵּ֣ל עָלֵ֔י/נוּ וְ/לָ/קַ֧חַת אֹתָ֛/נוּ לַ/עֲבָדִ֖ים וְ/אֶת חֲמֹרֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/018.yaml
  text: The men were afraid because they had been brought into Joseph’s house[a], and they said, “It is because of the money that was returned in our sacks the first time that we are being brought in, so that he may make a pretext against us and fall upon us and take us as servants, along with our donkeys.”
translation:
  language: ta
  text: அந்த மனிதர்கள் தாங்கள் யோசேப்பின் வீட்டுக்குள் கொண்டுவரப்பட்டதைக் கண்டு பயந்தார்கள். அவர்கள், “முதல்முறை நம் சாக்குகளில் திருப்பி வைக்கப்பட்டிருந்த பணத்தினால்தான் நாம் இங்கே கொண்டுவரப்படுகிறோம். நமக்கு எதிராகச் சாக்குப்போக்கை ஏற்படுத்திக்கொண்டு, நம்மேல் பாய்ந்து, நம்மை அடிமைகளாகவும் நம் கழுதைகளையும் எடுத்துக்கொள்ளவும் அவன் இப்படிச் செய்கிறான்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: பயந்தார்கள்
  rationale: ירא என்பதன் தொடர்கதை வடிவம்; சூழலில் அவர்கள் அடைந்த அச்சத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: הוּבְאוּ בֵּית יוֹסֵף
  choice: யோசேப்பின் வீட்டுக்குள் கொண்டுவரப்பட்டதை
  rationale: בוא வினையின் ஹொஃபால் வடிவம் பிறவினைச் செயலின் செயப்பாட்டு பொருளைக் கொண்டது; வீட்டினுள் அழைத்துவரப்பட்ட நிலையை ‘வீட்டுக்குள் கொண்டுவரப்பட்டதை’ தெளிவாகக் காட்டுகிறது.
- source_word: עַל דְּבַר הַכֶּסֶף
  choice: பணத்தினால்தான்
  rationale: עַל דְּבַר இங்கு பேச்சுப்பொருளை அல்ல, காரணத்தைச் சுட்டுகிறது; வலியுறுத்தலுடன் கூறப்படும் சகோதரர்களின் அச்சமான முடிவை ‘-னால்தான்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַשָּׁב בְּאַמְתְּחֹתֵינוּ
  choice: நம் சாக்குகளில் திருப்பி வைக்கப்பட்டிருந்த
  rationale: שוב வடிவம் திரும்பிய அல்லது திருப்பப்பட்ட பணத்தைச் சுட்டுகிறது. முந்தைய நிகழ்வில் பணம் சாக்குகளில் வைக்கப்பட்டதால், சூழலுக்கேற்ற செயப்பாட்டு விளக்கம் பயன்படுத்தப்பட்டது; אַמְתַּחַת தானிய அல்லது பயணச் சாக்கைக் குறிக்கிறது.
- source_word: בַּתְּחִלָּה
  choice: முதல்முறை
  rationale: இங்கு பொதுவான ‘தொடக்கத்தில்’ என்பதைவிட, சகோதரர்களின் முந்தைய எகிப்துப் பயணத்தைக் குறிக்கும் காலச்சுட்டு.
- source_word: לְהִתְגֹּלֵל עָלֵינוּ
  choice: நமக்கு எதிராக ஒரு காரணத்தை உண்டாக்கி
  rationale: גלל என்பதன் ஹித்பயேல் வடிவமும் עַל என்பதும் சேர்ந்த இச்சொற்றொடர் கடினமான மரபுத்தொடர்; பகைமையான நடவடிக்கைக்கான சாக்கு அல்லது குற்றச்சாட்டுக்கான காரணத்தை உருவாக்குதல் என்ற சாத்தியமான பொருளைத் தருகிறது. உறுதியற்ற தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וּלְהִתְנַפֵּל עָלֵינוּ
  choice: நம்மேல் பாய்ந்து
  rationale: נפל என்பதன் ஹித்பயேல் வடிவம் עַל உடன் பகைமையுடன் தாக்குவதைக் குறிக்கிறது; ‘பாய்ந்து’ உருவக வலிமையையும் தாக்குதல் உணர்வையும் காக்கிறது.
- source_word: וְלָקַחַת אֹתָנוּ לַעֲבָדִים
  choice: நம்மைக் கைப்பற்றி, நம்மை அடிமைகளாக்க
  rationale: לקח இங்கு வலுக்கட்டாயமாகக் கைப்பற்றுதலையும், לַעֲבָדִים அடிமை நிலைக்குக் கொண்டுசெல்லுதலையும் குறிக்கிறது; வெறும் பணியாளர்களாக எடுத்தல் என்ற மெல்லிய பொருளைத் தவிர்க்கிறது.
- source_word: וְאֶת חֲמֹרֵינוּ
  choice: நம் கழுதைகளையும் கைப்பற்றி
  rationale: אֵת குறியீடு கழுதைகளையும் ‘எடுத்துக்கொள்வது’ என்ற அதே வினையின் பொருளாக இணைக்கிறது; தமிழில் வினையை முன்கூட்டியே பகிர்ந்து அமைத்தல் இயல்பான வாக்கிய ஓட்டத்தைத் தருகிறது.
theological_decisions:
- issue: சகோதரர்கள் கூறும் நோக்கத்தின் கர்த்தா
  choice: “இப்படிச் செய்கிறார்கள்” என்று குறிப்பிட்ட நபரைத் தெளிவுபடுத்தாமல் பன்மை வழக்கில் வழங்கப்பட்டது
  alternative: “அவன் இப்படிச் செய்கிறான்” அல்லது “யோசேப்பு இப்படிச் செய்கிறார்”
  rationale: எபிரெயத்தில் நோக்கவினைகள் கர்த்தாவை வெளிப்படையாகக் குறிப்பிடவில்லை. யோசேப்பை நேரடியாகக் கர்த்தாவாகச் சேர்ப்பது உரையிலுள்ள தெளிவின்மையைத் தேவையின்றித் தீர்த்துவிடும்; தமிழின் மரியாதை/பன்மை வழக்கு மறைமுக அதிகாரிகளையும் குறிக்க இயலும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘சாக்கு’ என்பது தானியப் பயணச் சாக்கைத் தெளிவாகக் குறிக்கிறது; ‘அடிமைகள்’ என்பது עֲבָדִים என்பதன் கட்டுப்பட்ட நிலையைக் ‘வேலையாட்கள்’ என்பதைவிடத் துல்லியமாக வழங்குகிறது. நீண்ட நேரடி உரை வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது.
