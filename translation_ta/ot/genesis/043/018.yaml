  source_fidelity: 'மொத்தத்தில் பொருள் நன்றாகப் பாதுகாக்கப்பட்டுள்ளது: பயம், யோசேப்பின் வீட்டிற்குள் அழைத்துவரப்படுதல், முன்பு சாக்குகளில் திருப்பிவைக்கப்பட்ட பணம், தாக்குதல், அடிமைப்படுத்தல், கழுதைகளை எடுத்துக்கொள்ளல் ஆகியவை இடம்பெறுகின்றன. ஆனால் மூலத்தின் நோக்கத் தொடரில் உள்ள ஒருமை மறைமுகக் கர்த்தாவை “செய்கிறார்கள்” எனப் பன்மையாக்குவது தேவையற்ற மாற்றம். மேலும் ‘கைப்பற்றி’ என்பது לקח-இன் ‘எடுத்துக்கொள்ளுதல்’ என்பதைக் காட்டிலும் வலுவான கைதுசெய்தல் நுணுக்கத்தைச் சேர்க்கிறது.'
