base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/021.yaml
  text: And when we came to the lodging place and opened our sacks[a], behold[b], each man's silver was in the mouth of his sack—our silver in its full weight—and we brought it back in our hand.
translation:
  language: ta
  text: நாங்கள் இரவு தங்கும் இடத்துக்கு வந்து, எங்கள் சாக்குகளைத் திறந்தபோது, இதோ, ஒவ்வொருவனுடைய வெள்ளியும் அவனவன் சாக்கின் வாயிலே[a] இருந்தது; எங்கள் வெள்ளி முழு எடையுடன்[b] இருந்தது. அதை எங்கள் கையிலே திரும்பக் கொண்டுவந்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, ‘அவனவன் சாக்கின் திறப்பில்.’ எபிரேய மொழியில் சொற்சொல்லாக ‘அவனவன் சாக்கின் வாயில்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எங்கள் வெள்ளி அதன் எடையின்படியே.’ திருப்பிவைக்கப்பட்ட வெள்ளி சரியான முழு எடை அளவிலும் இருந்ததை எபிரேய சொற்றொடர் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּלוֹן
  choice: இரவு தங்கும் இடம்
  rationale: பயணத்தின்போது இரவைக் கழிக்கும் இடத்தைக் குறிக்கிறது; நவீன வணிக விடுதி என்று தேவையின்றிக் குறிப்பதில்லை.
- source_word: וַנִּפְתְּחָה
  choice: திறந்தபோது
  rationale: முதல் நபர் பன்மைச் செயலை இயல்பான தமிழ் காலத் தொடரில் தருகிறது.
- source_word: אַמְתְּחֹתֵינוּ / אַמְתַּחְתּוֹ
  choice: சாக்குகள் / சாக்கு
  rationale: தானியம் அல்லது பயணப் பொருள்களை ஏந்தும் சாக்கை இச்சொல் குறிக்கிறது; யோசேப்பு கதையின் சூழலுக்கும் பொருந்துகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: எதிர்பாராத கண்டுபிடிப்பையும் கதையின் உயிரோட்டத்தையும் காக்கிறது.
- source_word: כֶסֶף אִישׁ
  choice: ஒவ்வொருவனுடைய வெள்ளி
  rationale: אִישׁ என்பதன் பகிர்வுப் பொருளையும் כֶּסֶף என்பதன் ‘வெள்ளி’ என்ற குறிப்பான பொருளையும் காக்கிறது.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: அவனவன் சாக்கின் வாயிலே
  rationale: கொள்கலனின் திறப்பை ‘வாய்’ என்று கூறும் எபிரேய உருவகத்தைத் தமிழிலும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: כַּסְפֵּנוּ בְּמִשְׁקָלוֹ
  choice: எங்கள் வெள்ளி அதனதன் நிறையின்படியே
  rationale: திருப்பிவைக்கப்பட்ட வெள்ளி ஒவ்வொருவருடைய சரியான எடை அளவிலும் இருந்ததை உணர்த்துகிறது; மூலத்தின் எடை சார்ந்த சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: וַנָּשֶׁב אֹתוֹ
  choice: அதைத் திரும்பக் கொண்டுவந்தோம்
  rationale: வழக்கமான wayyiqtol தொடரை இறந்தகாலச் செயலாக மொழிபெயர்த்து, அவர்கள் அந்த வெள்ளியை மீண்டும் கொண்டுவந்ததைக் காட்டுகிறது.
- source_word: בְּיָדֵנוּ
  choice: எங்கள் கையிலே
  rationale: பன்மை உரிமைப்பெயருடன் வரும் ஒருமை ‘கை’ என்ற எபிரேய மரபுத்தொடரை, தமிழிலும் புரியத்தக்க வகையில் காக்கிறது.
