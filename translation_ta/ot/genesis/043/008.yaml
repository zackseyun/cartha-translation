base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/008.yaml
  text: And Judah said to Israel his father[a], “Send the boy with me, and let us arise and go, so that we may live and not die—both we and you and our little ones.”
translation:
  language: ta
  text: அப்போது யூதா தன் தந்தையான இஸ்ரவேலிடம், “அந்த இளைஞனை[a] என்னுடன் அனுப்புங்கள். நாம் எழுந்து புறப்பட்டுப் போவோம்; அதனால் நாமும் நீங்களும் நம் சிறு பிள்ளைகளும் சாகாமல் உயிர்வாழ முடியும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அந்தப் பையனை” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் சிறுவனை மட்டுமல்ல, ஓர் இளைஞனையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர் வடிவம் கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது. நவீனத் தமிழில் ‘அப்போது’ இயல்பாக அந்தத் தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: יִשְׂרָאֵל אָבִיו
  choice: தன் தந்தையான இஸ்ரவேலிடம்
  rationale: எபிரெய உரையில் உள்ள ‘இஸ்ரவேல்’ என்ற பெயரை ‘யாக்கோபு’ என்று மாற்றாமல் வைத்ததுடன், அவர் யூதாவின் தந்தை என்பதையும் தெளிவாகக் காட்டுகிறது.
- source_word: שִׁלְחָה
  choice: அனுப்புங்கள்
  rationale: இது நேரடியான வேண்டுகோள் அல்லது கட்டளையைக் குறிக்கும் வினைமுற்று. தந்தையிடம் பேசும் இயல்பான தமிழ் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַנַּעַר
  choice: அந்த இளைஞனை
  rationale: נַעַר என்பது சிறுவனை மட்டும் அல்லாமல் இளைஞனையும் குறிக்கலாம். பென்யமீனின் வயதைத் தேவையின்றி சிறுவயதாகக் காட்டாமல், குடும்பச் சூழலில் அவரைச் சுட்டும் சொல்லாக ‘இளைஞன்’ தேர்ந்தெடுக்கப்பட்டது; மாற்று நிழற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אִתִּי
  choice: என்னுடன்
  rationale: யூதா பென்யமீனைத் தானே உடன் அழைத்துச் செல்வதையும் அதனால் வரும் தனிப்பட்ட பொறுப்பையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וְנָקוּמָה וְנֵלֵכָה
  choice: நாம் எழுந்து புறப்பட்டுப் போவோம்
  rationale: இரண்டு cohortative வினைகளும் இணைந்து உடனடியாகப் பயணம் தொடங்கும்படி ஊக்குவிக்கின்றன. ‘எழுந்து புறப்பட்டுப் போவோம்’ என்பது இரு வினைகளின் இயக்கத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וְנִחְיֶה וְלֹא נָמוּת
  choice: சாகாமல் உயிர்வாழலாம்
  rationale: பயணம் செய்வதன் நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவை இயல்பான தமிழில் காட்டுகிறது; ‘வாழ்வது’ மற்றும் ‘சாகாதிருப்பது’ என்ற எதிர்மறை இணைப்பும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: גַּם אֲנַחְנוּ גַם אַתָּה גַּם טַפֵּנוּ
  choice: நாமும் நீங்களும் நம் சிறு பிள்ளைகளும்
  rationale: மூன்று தரப்புகளையும் உள்ளடக்கி வலியுறுத்தும் மீண்டுவரும் גַּם என்பதற்கு ஒவ்வொரு கூறிலும் ‘-உம்’ சேர்த்து தமிழில் அதே உள்ளடக்க வலியுறுத்தல் பாதுகாக்கப்பட்டுள்ளது.
- source_word: טַפֵּנוּ
  choice: நம் சிறு பிள்ளைகள்
  rationale: טַף என்பது வீட்டாரில் குறிப்பாகச் சிறு குழந்தைகள் அல்லது பாதுகாப்பைச் சார்ந்தவர்களைக் குறிக்கிறது. ‘சிறு பிள்ளைகள்’ அவர்களுடைய பாதிப்புக்குட்படும் நிலையைக் காட்டுகிறது.
