source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר אֵלָ֛י/ו יְהוּדָ֖ה לֵ/אמֹ֑ר הָעֵ֣ד הֵעִד֩ בָּ֨/נוּ הָ/אִ֤ישׁ לֵ/אמֹר֙ לֹֽא תִרְא֣וּ פָנַ֔/י בִּלְתִּ֖י אֲחִי/כֶ֥ם אִתְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/003.yaml
  text: Then Judah said to him[a], “The man solemnly warned us, saying[b], ‘You shall not see my face unless your brother is with you.’”
translation:
  language: ta
  text: அப்போது யூதா அவரிடம், “அந்த மனிதர் எங்களை மிகக் கண்டிப்பாக எச்சரித்து, ‘உங்கள் சகோதரன் உங்களுடன் இல்லாவிட்டால், நீங்கள் என் முகத்தைக் காணமாட்டீர்கள்[a]’ என்று சொன்னார்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் என் முன்னிலையில் வரக்கூடாது.” “என் முகத்தைக் காண்பது” என்ற எபிரெயச் சொற்றொடர் ஒருவரின் முன்னிலையில் ஆஜராவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו יְהוּדָה
  choice: அப்போது யூதா அவரிடம் ... என்றான்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுப்பதால் ‘அப்போது’ இயல்பான தொடர்ச்சியைத் தருகிறது; אֵלָיו சூழலில் யாக்கோபைக் குறிக்கிறது.
- source_word: הָעֵד הֵעִד בָּנוּ
  choice: எங்களை மிகக் கண்டிப்பாக எச்சரித்து
  rationale: ஒரே வேரின் infinitive absolute மற்றும் finite verb இணைவு வலியுறுத்தலைக் காட்டுகிறது. இச்சூழலில் நீதிமன்றச் ‘சாட்சி கூறுதல்’ அல்ல, தீவிரமான எச்சரிப்பே பொருள்.
- source_word: הָאִישׁ
  choice: அந்த மனிதர்
  rationale: முன்னர் சந்தித்த எகிப்திய அதிகாரியைக் குறிக்கும் எளிய அடையாளப் பெயரைத் தக்கவைக்கிறது; தமிழ் வழக்கில் மரியாதைப் பன்மை இயல்பாக உள்ளது.
- source_word: לֹא תִרְאוּ פָנַי
  choice: நீங்கள் என் முகத்தைக் காணமாட்டீர்கள்
  rationale: எபிரெய மொழியின் உயிரோட்டமான நேரடிச் சொல்லாட்சியைத் தக்கவைக்கிறது; இது ‘என் முன்னிலையில் வரமாட்டீர்கள்’ என்ற இடியப் பொருளையும் கொண்டிருக்கலாம்.
- source_word: בִּלְתִּי אֲחִיכֶם אִתְּכֶם
  choice: உங்கள் சகோதரன் உங்களுடன் இல்லாவிட்டால்
  rationale: בִּלְתִּי காட்டும் நிபந்தனையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ஒருமை பெயர்ச்சொல் பென்யமீனைச் சுட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. வலியுறுத்தும் எபிரெய இலக்கண அமைப்பு ‘மிகக் கண்டிப்பாக’ என வெளிப்படுத்தப்பட்டுள்ளது; முகத்தைக் காணுதல் என்ற மூல உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் இடியப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
