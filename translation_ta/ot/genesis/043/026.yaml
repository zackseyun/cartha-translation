  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּבֹ֤א יוֹסֵף֙ הַ/בַּ֔יְתָ/ה וַ/יָּבִ֥יאּוּ ל֛/וֹ אֶת הַ/מִּנְחָ֥ה אֲשֶׁר בְּ/יָדָ֖/ם הַ/בָּ֑יְתָ/ה וַ/יִּשְׁתַּחֲווּ ל֖/וֹ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/026.yaml
  text: When Joseph came into the house[a], they brought to him the gift that was in their hands into the house[c][b], and they bowed down to the ground before him.
translation:
  language: ta
  text: யோசேப்பு வீட்டுக்குள் வந்தபோது, அவர்கள் தங்கள் கைகளில் இருந்த பரிசை[a] வீட்டுக்குள் கொண்டுவந்து அவரிடம் சமர்ப்பித்து, அவருக்கு முன்பாகத் தரையில் விழுந்து வணங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அன்பளிப்பு’ அல்லது, சூழலைப் பொறுத்து, ‘கப்பம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... הַבַּיְתָה
  choice: வீட்டுக்குள் வந்தபோது
  rationale: בוא என்பதன் இயல்பான பொருள் ‘வந்தான்/நுழைந்தான்’; திசைச் சுட்டும் ה உடைய הַבַּיְתָה வீட்டின் உள்ளே சென்ற இயக்கத்தைக் குறிக்கிறது. தொடர் நிகழ்வை இயல்பான தமிழில் காட்ட ‘வந்தபோது’ பயன்படுத்தப்பட்டது.
- source_word: וַיָּבִיאוּ לוֹ
  choice: அவரிடம் கொண்டுவந்து
  rationale: Hiphil வடிவிலுள்ள בוא ‘கொண்டுவருதல்’ என்று பொருள்படும்; לוֹ பரிசு யோசேப்பிடம் கொண்டுவரப்பட்டதைக் குறிக்கிறது.
- source_word: הַמִּנְחָה
  choice: பரிசு
  rationale: מִנְחָה சூழலுக்கு ஏற்ப பரிசு, கப்பம் அல்லது காணிக்கை எனப் பொருள்படலாம். இங்கு சகோதரர்கள் ஆளுநரிடம் கொண்டுவந்த அன்பளிப்பைக் குறிப்பதால், வழிபாட்டுச் சார்பைத் தவிர்க்கும் இயல்பான ‘பரிசு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲשֶׁר בְּיָדָם
  choice: தங்கள் கைகளில் இருந்த
  rationale: எபிரெய மொழியின் ‘அவர்களுடைய கைகளில் இருந்த’ என்ற concrete expression தமிழிலும் தெளிவாக இருப்பதால் தக்கவைக்கப்பட்டது.
- source_word: הַבָּיְתָה
  choice: வீட்டுக்குள்
  rationale: வசனத்தில் இச்சொல் இரண்டாவது முறையாக வருவதையும், பரிசு வீட்டுக்குள் கொண்டுவரப்பட்ட இயக்கத்தையும் மொழிபெயர்ப்பு வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אָרְצָה
  choice: அவருக்கு முன்பாகத் தரைமட்டும் குனிந்து வணங்கினார்கள்
  rationale: שׁחה பணிவுடனான ஆழ்ந்த வணக்கத்தையும், אָרְצָה தரையை நோக்கிய இயக்கத்தையும் குறிக்கின்றன. ‘தரைமட்டும் குனிந்து வணங்கினார்கள்’ இரண்டையும் இயல்பான நவீன தமிழில் எடுத்துரைக்கிறது.
theological_decisions:
- issue: வணக்கச் செயல் தெய்வ வழிபாடா அல்லது அதிகாரியிடம் செலுத்திய மரியாதையா
  choice: வணங்கினார்கள்
  alternative: சாஷ்டாங்கமாக விழுந்து வழிபட்டார்கள்
  rationale: சூழலில் இது யோசேப்பின் அதிகாரத்துக்கு முன் செலுத்தப்பட்ட பணிவான மரியாதை. மூலச்சொல்லின் உடல் செயலைத் தக்கவைத்தபடியே, அதைத் தெய்வ வழிபாடாக முன்கூட்டியே தீர்மானிக்காத சொல் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியும், ஆனால் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டது. எபிரெயத்தில் இருமுறை வரும் ‘வீட்டுக்குள்’ மொழிபெயர்ப்பிலும் இருமுறை தக்கவைக்கப்பட்டுள்ளது; சொற்றொடரின் இயல்புக்காக இரண்டாவது இடத்தில் ‘அவரிடம்’ பின்னர் அமைக்கப்பட்டுள்ளது.
