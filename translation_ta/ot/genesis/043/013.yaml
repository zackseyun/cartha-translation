source:
  edition: WLC
  text: וְ/אֶת אֲחִי/כֶ֖ם קָ֑חוּ וְ/ק֖וּמוּ שׁ֥וּבוּ אֶל הָ/אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/013.yaml
  text: Take your brother also[a], and arise[b], return to the man.
translation:
  language: ta
  text: உங்கள் சகோதரனையும்[a] அழைத்துக்கொண்டு, எழுந்து அந்த மனிதனிடம் திரும்பிப் போங்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘உங்கள் சகோதரன்’; சூழலில் இது பென்யமீனைக் குறிக்கிறது.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘எழுங்கள், அந்த மனிதனிடம் திரும்பிப் போங்கள்.’
    reason: previous_rendering
lexical_decisions:
- source_word: וְ/אֶת אֲחִי/כֶם קָחוּ
  choice: உங்கள் சகோதரனையும் அழைத்துக்கொண்டு
  rationale: וְ உடைய சேர்க்கைப் பொருளை ‘-யும்’ இயல்பாக வெளிப்படுத்துகிறது. לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்ளுதல்’; ஒருவரை உடன் கூட்டிச் செல்லும் இச்சூழலில் ‘அழைத்துக்கொண்டு’ என்பது நவீன தமிழில் இயல்பானது. எபிரெய உரையில் பெயர் சேர்க்கப்படாததால் ‘பென்யமீன்’ முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: וְ/ק֖וּמוּ
  choice: எழுந்து
  rationale: קום வினையின் பன்மை ஏவலைப் பாதுகாக்கிறது; தமிழில் தொடர்வினையாக அமைப்பது இயல்பான கட்டளைத் தொடரை உருவாக்குகிறது.
- source_word: שׁ֥וּבוּ
  choice: திரும்பிப் போங்கள்
  rationale: שוב இங்கு முன்பு சென்ற மனிதனிடம் மீண்டும் செல்லுதலைக் குறிக்கிறது. ‘திரும்பிப் போங்கள்’ என்பது இலக்கையும் பயணப் பொருளையும் இயல்பாகக் காட்டுகிறது.
- source_word: אֶל הָ/אִישׁ
  choice: அந்த மனிதனிடம்
  rationale: குறிப்பிட்ட, ஏற்கெனவே அறிமுகமான மனிதனைக் குறிக்கும் הָאִישׁ என்பதற்கு தமிழில் ‘அந்த மனிதன்’ இயல்பானது; אֶל என்பதன் இலக்குப் பொருளை ‘-ிடம்’ வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் கட்டளையின் அவசரத் தொனியும் காக்கப்பட்டுள்ளன. எபிரெயத்தின் தொடர்ச்சியான பன்மை ஏவல்கள் தமிழில் இயல்பான தொடர்வினை அமைப்பால் வழங்கப்பட்டுள்ளன.
