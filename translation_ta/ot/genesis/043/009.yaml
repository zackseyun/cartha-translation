  text: אָֽנֹכִי֙ אֶֽעֶרְבֶ֔/נּוּ מִ/יָּדִ֖/י תְּבַקְשֶׁ֑/נּוּ אִם לֹ֨א הֲבִיאֹתִ֤י/ו אֵלֶ֨י/ךָ֙ וְ/הִצַּגְתִּ֣י/ו לְ/פָנֶ֔י/ךָ וְ/חָטָ֥אתִֽי לְ/ךָ֖ כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/009.yaml
  text: I myself will guarantee him. From my hand you may require him. If I do not bring him to you and set him before you[a], then I will bear the blame to you all my days.
translation:
  language: ta
  text: அவனுக்காக நானே பொறுப்பேற்கிறேன். அவனை நீர் என்னிடமே கேட்கலாம். நான் அவனை உம்மிடம் கொண்டுவந்து உமக்கு முன்பாக நிறுத்தாவிட்டால், என் வாழ்நாளெல்லாம் உமக்குப் பழியைச் சுமப்பேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொல்லுக்குச் சொல்: “என் வாழ்நாளெல்லாம் உமக்கு எதிராகப் பாவம் செய்திருப்பேன்.”'
    reason: The Hebrew verb ordinarily means ‘sin,’ but in this pledge it can express enduring culpability or blame toward the father.
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: நானே
  rationale: தனித்துப் பயன்படுத்தப்பட்ட வலியுறுத்தல் சுட்டுப்பெயர், யூதா தனிப்பட்ட முறையில் பொறுப்பேற்பதைத் தெளிவாக்குகிறது.
- source_word: אֶעֶרְבֶנּוּ
  choice: அவனுக்கு ... பொறுப்பேற்கிறேன்
  rationale: ערב என்பதன் பிணை அல்லது உத்தரவாதப் பொறுப்பை ஏற்கும் பொருளை, நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִיָּדִי תְּבַקְשֶׁנּוּ
  choice: அவனை நீர் என் கையிலிருந்து கேட்கலாம்
  rationale: எபிரெய மொழியின் கணக்குக் கேட்கும் பொறுப்புணர்வையும் அதன் கைகுறித்த உருவகத்தையும் தக்கவைக்கிறது.
- source_word: הֲבִיאֹתִיו אֵלֶיךָ
  choice: அவனை உம்மிடம் கொண்டுவந்து
  rationale: ‘திரும்ப’ என்பது சூழலில் உட்பொருளாக இருந்தாலும் மூலத்தில் வெளிப்படையாக இல்லாததால் சேர்க்கப்படவில்லை.
- source_word: וְהִצַּגְתִּיו לְפָנֶיךָ
  choice: உமக்கு முன்பாக நிறுத்தாவிட்டால்
  rationale: יצג என்பதன் ஒருவரை நேரில் கொண்டுவந்து நிறுத்துதல் அல்லது முன்னிலைப்படுத்துதல் என்ற காட்சிப்பூர்வமான பொருளைப் பாதுகாக்கிறது.
- source_word: וְחָטָאתִי לְךָ
  choice: உமக்கு எதிராகப் பாவம் செய்தவனாக இருப்பேன்
  rationale: חטא என்பதன் வழக்கமான ‘பாவம் செய்’ என்ற ஒழுக்கக் குற்றப்பொருளையும், தந்தையிடம் வாழ்நாள் முழுவதும் குற்றவாளியாக நிற்கும் உறவுசார் பொறுப்பையும் நேரடியாகத் தருகிறது.
- source_word: כָּל הַיָּמִים
  choice: என் வாழ்நாளெல்லாம்
  rationale: வாழ்நாள் முழுவதுமான நீடித்த பொறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வழிபாட்டுச் சூழல் அல்லாத தனிப்பட்ட உறவில் וְחָטָאתִי לְךָ என்பதன் மொழிபெயர்ப்பு
  choice: உமக்கு எதிராகப் பாவம் செய்தவனாக இருப்பேன்
  alternative: உம்மிடம் பழியைச் சுமப்பேன்
  rationale: இச்சூழலில் யூதா தனிப்பட்ட பொறுப்பை ஏற்றாலும், மூலச்சொல் சாதாரணமாக ‘பாவம் செய்’ என்பதே. அதனை ‘பழி’ என்று மட்டும் மாற்றாமல், மூலத்தின் ஒழுக்கத் தீவிரத்தையும் உறவுசார் குற்றத்தையும் பாதுகாக்க நேரடி மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: மரியாதையுடனும் கண்ணியத்துடனும் பேசும் நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘நீர்/உம்மிடம்/உமக்கு’ என்பவை மகன் தந்தையிடம் உரையாடும் மரியாதை நிலையைத் தக்கவைக்கின்றன; தேவையற்ற சட்டத் தொழில்நுட்பச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
