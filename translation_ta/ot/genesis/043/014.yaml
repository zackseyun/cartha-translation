  text: וְ/אֵ֣ל שַׁדַּ֗י יִתֵּ֨ן לָ/כֶ֤ם רַחֲמִים֙ לִ/פְנֵ֣י הָ/אִ֔ישׁ וְ/שִׁלַּ֥ח לָ/כֶ֛ם אֶת אֲחִי/כֶ֥ם אַחֵ֖ר וְ/אֶת בִּנְיָמִ֑ין וַ/אֲנִ֕י כַּ/אֲשֶׁ֥ר שָׁכֹ֖לְתִּי שָׁכָֽלְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/014.yaml
  text: May God Almighty grant you mercy before the man[a], so that he may send back your other brother and Benjamin. And as for me, if I am bereaved[c][b], I am bereaved.
translation:
  language: ta
  text: எல்லாம் வல்ல இறைவன் அந்த மனிதனின் பார்வையில் உங்களுக்குக் கருணை கிடைக்கச் செய்வாராக[a]. அந்த மனிதன் உங்கள் மற்ற சகோதரனையும்[b] பென்யமீனையும் உங்களுடன் அனுப்பிவிடுவானாக. நானோ, பிள்ளையிழந்தவனானால், பிள்ளையிழந்தவன்தான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த மனிதனின் முன்னிலையில் உங்களுக்குக் கருணை அருள்வாராக.” எபிரெயச் சொல் இரக்கம், கருணை, கனிவான பரிவு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மற்ற சகோதரன்” என்பது எகிப்தில் தடுத்து வைக்கப்பட்டிருந்த சிமியோனைக் குறிக்கிறது.
    reason: cross_reference
  - marker: c
    text: அல்லது, “நான் பிள்ளைகளை இழந்தால், இழந்தவன்தான்.” எபிரெய உரை ஒரே வினையை இருமுறை கூறி யாக்கோபின் வேதனைமிக்க ஒப்புக்கொடுத்தலை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: எல்லாம் வல்ல இறைவன்
  rationale: தெய்வீகப் பட்டத்தை ஒலிபெயர்க்காமல் பொருளுடன் வழங்குகிறது; இயல்பான, கண்ணியமான நவீனத் தமிழ்.
- source_word: יִתֵּן לָכֶם רַחֲמִים לִפְנֵי הָאִישׁ
  choice: அந்த மனிதனிடத்தில் உங்களுக்கு இரக்கம் கிடைக்கச் செய்வாராக
  rationale: רַחֲמִים என்பதன் ‘இரக்கம்/கருணை’ பொருளையும், வேண்டுதல் நிலையையும் வெளிப்படுத்துகிறது. לִפְנֵי என்பதைக் தமிழில் இயல்பான உறவுநிலையாக ‘மனிதனிடத்தில்’ என வழங்குகிறது.
- source_word: וְשִׁלַּח לָכֶם
  choice: உங்களிடம் திருப்பி அனுப்புவானாக
  rationale: முந்தைய வேண்டுதலின் தொடர்ச்சியாக உள்ளது; சூழலில் பிடித்துவைக்கப்பட்ட சகோதரன் மீண்டும் இவர்களிடம் அனுப்பப்படுவது குறிக்கப்படுகிறது.
- source_word: אֶת אֲחִיכֶם אַחֵר
  choice: உங்கள் மற்ற சகோதரனையும்
  rationale: אַחֵר என்பதன் ‘மற்ற’ என்ற வேறுபடுத்தும் பொருளைப் பாதுகாக்கிறது; சூழலில் அது சிமியோனைக் குறிக்கிறது.
- source_word: וַאֲנִי
  choice: நானோ
  rationale: எபிரெய உரையில் முன்னிலைப்படுத்தப்பட்ட தனிப்பட்ட சுட்டைச் சுருக்கமாகவும் இயல்பாகவும் வலியுறுத்துகிறது.
- source_word: כַּאֲשֶׁר שָׁכֹלְתִּי שָׁכָלְתִּי
  choice: பிள்ளைகளை இழக்க வேண்டியிருந்தால், இழக்க வேண்டியதுதான்
  rationale: שׁכל வினையின் பிள்ளையிழப்புப் பொருளையும், இருமுறை கூறுவதிலுள்ள யாக்கோபின் மனத்தளர்ந்த ஒப்புக்கொடுத்தலையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: אֵל שַׁדַּי என்ற இறைப்பட்டத்தின் மொழிபெயர்ப்பு
  choice: எல்லாம் வல்ல இறைவன்
  alternative: எல் ஷத்தாய்
  rationale: இது பெயரைவிட இறைப்பட்டமாகச் செயல்படுவதால் பொருளுடன் மொழிபெயர்க்கப்பட்டது. ‘எல்லாம் வல்ல’ என்பது மரபான புரிதலைத் தருகிறது; மூலச்சொல்லின் சொற்பிறப்புக் குறித்த நிச்சயமின்மையைத் தனிப்பட்ட கோட்பாட்டால் நிரப்பவில்லை.
- issue: כַּאֲשֶׁר என்பதன் நிபந்தனை/ஒப்பீட்டு நுணுக்கம்
  choice: இழக்க வேண்டியிருந்தால்
  alternative: நான் பிள்ளைகளை இழந்தபடியே இழந்தேன்
  rationale: இச்சூழலில் எதிர்கால இழப்பை ஏற்றுக்கொள்ளும் நிபந்தனைத் தொனி பொருத்தமானது. இருப்பினும் எபிரெய வடிவம் சொல்லுக்கு சொல் ‘எவ்வாறு/எப்போது’ என்ற நுணுக்கத்தையும் அனுமதிப்பதால் மாற்று அடிக்குறிப்பில் சுட்டப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. வேண்டுதலுக்கு ‘செய்வாராக/அனுப்புவானாக’ வடிவங்களும், இறுதியில் யாக்கோபின் உணர்ச்சிமிக்க ஒப்புக்கொடுத்தலுக்கு இயல்பான தமிழ் மறுமொழியும் பயன்படுத்தப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
