base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/032.yaml
  text: So they served him by himself[a], and them by themselves, and the Egyptians who ate with him by themselves, because the Egyptians could not eat bread with the Hebrews, for that is an abomination to the Egyptians.
translation:
  language: ta
  text: அவர்கள் அவனுக்குத் தனியாகவும், அவனுடைய சகோதரர்களுக்குத் தனியாகவும், அவனோடு சாப்பிட்ட எகிப்தியர்களுக்குத் தனியாகவும் உணவு பரிமாறினார்கள். ஏனெனில், எகிப்தியர்களால் எபிரெயர்களோடு அப்பம் உண்ண[a] முடியவில்லை; அது எகிப்தியர்களுக்கு அருவருப்பானதாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், சொற்சொல்லாக, “எபிரெயர்களோடு அப்பம் உண்ண.” இது ஒன்றாக உணவருந்துவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: உணவு பரிமாறினார்கள்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘வைத்தார்கள்’ என்பதாக இருந்தாலும், விருந்துண்ணும் சூழலில் ஒவ்வொரு தரப்புக்கும் உணவை எடுத்துவைத்துச் சேவித்ததைக் குறிக்கும் இயல்பான தமிழ் வடிவம் இது.
- source_word: לְבַדּוֹ / לְבַדָּם
  choice: தனியாக
  rationale: எபிரெய உரையில் மீண்டும் மீண்டும் வலியுறுத்தப்படும் சமூகப் பிரிவினையை ஒரே சொல்லைத் திரும்பப் பயன்படுத்திப் பாதுகாக்கிறது.
- source_word: הָאֹכְלִים אִתּוֹ
  choice: அவனோடு சாப்பிட்ட
  rationale: பங்கேற்பு வினை வடிவத்தை இயல்பான தமிழ் சார்புத்தொடராக வழங்குகிறது; நிகழ்வின் கதைநடையையும் காக்கிறது.
- source_word: לֹא יוּכְלוּן
  choice: முடியாது
  rationale: உடல் இயலாமையை மட்டும் அல்லாமல் சமூக அல்லது மரபுசார் இயலாமையையும் குறிக்கக்கூடிய மூலத்தின் விரிவைத் தீர்மானிக்காமல் வைத்திருக்கிறது.
- source_word: לֶאֱכֹל אֶת הָעִבְרִים לֶחֶם
  choice: எபிரெயர்களோடு அப்பம் உண்ண
  rationale: ‘அப்பம் உண்ணுதல்’ என்ற மூல மொழியின் சொற்றொடரைப் பாதுகாக்கிறது; அது ஒன்றாக உணவருந்துவதைக் குறிக்கும் மரபுத்தொடர் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: תּוֹעֵבָה
  choice: அருவருப்பானதாக
  rationale: சடங்கு, பண்பாடு அல்லது சமூகத் தடையால் வெறுக்கத்தக்கதாகக் கருதப்படுவதைக் குறிக்கும் சொல்லின் வலிமையைப் பாதுகாக்கிறது; காரணத்தை உரையில் சேர்த்து விளக்கவில்லை.
- source_word: מִצְרִים / הָעִבְרִים
  choice: எகிப்தியர்கள் / எபிரெயர்கள்
  rationale: இரு இனக்குழுக்களுக்கிடையிலான வேறுபாட்டையும் வசனத்தின் சமூக எல்லையையும் தெளிவாகக் காட்டும் வழக்கமான தமிழ்ப் பெயர்கள்.
theological_decisions:
- issue: எகிப்தியர்கள் எபிரெயர்களோடு உணவருந்தாததற்கான காரணம்
  choice: மூல உரை கூறும் ‘அருவருப்பு’ என்ற மதிப்பீட்டை மட்டும் வழங்கி, அதன் சரியான சடங்கு அல்லது பண்பாட்டுக் காரணத்தை விளக்காமல் விடுதல்
  alternative: ஒரு குறிப்பிட்ட மத, சாதி, தொழில் அல்லது தூய்மைத் தடையாக விளக்குதல்
  rationale: இவ்வசனம் காரணத்தின் தன்மையைச் சரியாக வரையறுக்கவில்லை. ஆகவே மூலத்தில் உள்ள வரலாற்று மற்றும் பண்பாட்டு தெளிவின்மையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தனியாக’ என்ற சொல்லின் மும்முறை அமைப்பு மூல உரையின் வலியுறுத்தலைக் காக்கிறது. முன்சூழலில் குறிப்பிடப்பட்டவர்கள் யோசேப்பின் சகோதரர்கள் என்பதால், தமிழில் குழப்பம் தவிர்க்க ‘அவனுடைய சகோதரர்கள்’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
