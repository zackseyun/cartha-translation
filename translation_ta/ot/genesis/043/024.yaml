  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆண்கள்’ என்பது மூலத்தின் பாலினத்தைக் குறிப்பாகப் பாதுகாக்கிறது; ‘மனிதர்கள்’ எனப் பொதுமைப்படுத்தப்படவில்லை. நீண்ட எபிரெய தொடர் வாக்கியம் தமிழின் இயல்பான ஓட்டத்திற்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
