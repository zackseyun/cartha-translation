base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/024.yaml
  text: The man brought the men into Joseph’s house and gave them water[a], and they washed their feet[c][b]; then he gave fodder to their donkeys.
translation:
  language: ta
  text: அந்த மனிதன் அந்த ஆண்களை யோசேப்பின் வீட்டுக்குள் அழைத்து வந்து, அவர்களுக்குத் தண்ணீர் கொடுத்தான்; அவர்கள் தங்கள் கால்களைக் கழுவினார்கள். பின்பு அவன் அவர்களுடைய கழுதைகளுக்குத் தீவனம் கொடுத்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் இவ்வசனம் ‘அந்த மனிதன்’ என்றும் ‘அந்த ஆண்கள்’ என்றும் மட்டுமே கூறுகிறது. சூழலின்படி அந்த மனிதன் யோசேப்பின் வீட்டு நிர்வாகி என்பதும், அந்த ஆண்கள் யோசேப்பின் சகோதரர்கள் என்பதும் தெளிவாகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֵא
  choice: அழைத்துவந்து
  rationale: בוא என்பதன் ஹிஃபில் வடிவம், அவர்களை வீட்டுக்குள் வரச்செய்த இயக்கத்தைக் குறிக்கிறது. ‘அழைத்துவந்து’ என்பது தமிழில் இயல்பாகவும் காரணவினை நுணுக்கத்துடனும் உள்ளது.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: எபிரெய உரை அவரை இங்கு ‘மனிதன்’ என்று மட்டுமே குறிப்பிடுகிறது; சூழலிலிருந்து அவரது பொறுப்பு தெளிவானாலும் ‘மேற்பார்வையாளன்’ போன்ற பதவிப் பெயரைச் சேர்க்கவில்லை.
- source_word: הָאֲנָשִׁים
  choice: அந்த ஆண்களை
  rationale: எபிரெயச் சொல் பொதுவாக ‘ஆண்கள்’ என்பதே. சூழலில் அவர்கள் யோசேப்பின் சகோதரர்கள் என்றாலும், இவ்வசனத்தின் சொல் தேர்வு பாதுகாக்கப்படுகிறது.
- source_word: בֵּיתָה יוֹסֵף
  choice: யோசேப்பின் வீட்டுக்குள்
  rationale: בֵּיתָה என்பதிலுள்ள திசைச்சுட்டு முடிவு வீட்டினுள் செல்லும் இயக்கத்தைக் காட்டுவதால் ‘வீட்டுக்குள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיִּתֶּן מַיִם
  choice: அவர்களுக்குத் தண்ணீர் கொடுத்தான்
  rationale: எபிரெயில் மறைமுகப் பெறுநர் வெளிப்படையாக இல்லாவிட்டாலும் சூழல் அதைக் காட்டுகிறது; தமிழில் இயல்புக்காக ‘அவர்களுக்கு’ சேர்க்கப்பட்டது.
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: அவர்கள் தங்கள் கால்களைக் கழுவிக்கொண்டார்கள்
  rationale: வினை செயப்பாட்டு பன்மையில் உள்ளது; அவர்கள் தாமே கால்களைக் கழுவினார்கள் என்ற இலக்கணப் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מִסְפּוֹא
  choice: தீவனம்
  rationale: விலங்குகளுக்கான உணவைக் குறிக்கும் சொல்லுக்கு இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: לַחֲמֹרֵיהֶם
  choice: அவர்களுடைய கழுதைகளுக்கு
  rationale: לְ முன்னொட்டு மறைமுகப் பொருள் அல்லது பயனாளியைக் குறிக்கிறது; தீவனம் கழுதைகளுக்குக் கொடுக்கப்பட்டது என்பதை நேரடியாகத் தெரிவிக்கிறது.
