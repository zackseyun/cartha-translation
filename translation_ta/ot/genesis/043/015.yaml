translation_notes:
  register: நவீன தரநிலைத் தமிழில், எளிதில் புரியும் கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரண்டு முறை வரும் ‘எடுத்தல்’ வினை, தமிழில் பொருள்களுக்கும் பென்யமீனுக்கும் ஏற்ற தனித்தனி வினைகளால் வெளிப்படுத்தப்பட்டுள்ளது. எபிரெய மரபுத்தொடர்களை சொற்சொல்லாகத் திணிக்காமல் அவற்றின் சூழற்பொருள் தெளிவாக வழங்கப்பட்டுள்ளது.
