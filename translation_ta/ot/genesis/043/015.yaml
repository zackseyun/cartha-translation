  source_fidelity: திருத்தம் தேவை. வரைவில் וַיֵּרְדוּ என்ற ‘இறங்கிச் சென்றார்கள்’ என்ற புவியியல் இயக்கம் வெறுமனே ‘சென்று’ எனக் குறைக்கப்பட்டுள்ளது. மேலும், மூலத்தில் இருமுறை வரும் ‘எடுத்தார்கள்’ வினை மற்றும் பென்யமீன் தனியாக இணைக்கப்படுவது தமிழில் தெளிவாகப் பிரிக்கப்படலாம்.
