translation:
  language: ta
  text: அந்த மனிதர்கள் இந்த அன்பளிப்பையும் இருமடங்கு பணத்தையும் தங்களுடன் எடுத்துக்கொண்டார்கள்; பென்யமீனையும் அழைத்துக்கொண்டார்கள். பின்பு அவர்கள் புறப்பட்டு எகிப்துக்கு இறங்கிச் சென்று, யோசேப்பின் முன்னிலையில் நின்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמִּנְחָה הַזֹּאת
  choice: இந்த அன்பளிப்பு
  rationale: இச்சூழலில் மִנְחָה வழிபாட்டுப் பலியைக் குறிக்காமல், மேலதிகாரியின் நல்லெண்ணத்தைப் பெறக் கொண்டுசெல்லும் பரிசைக் குறிக்கிறது; ‘அன்பளிப்பு’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: מִשְׁנֶה כֶּסֶף
  choice: இருமடங்கு பணம்
  rationale: முன்பு எடுத்துச் சென்ற தொகையை ஒப்பிடுகையில் இரட்டிப்பு அளவு என்பதைக் தெளிவாகக் காட்டுகிறது.
- source_word: כֶּסֶף
  choice: பணம்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘வெள்ளி’ என்றாலும், இங்கு வாணிகப் பரிவர்த்தனைக்கான பணம் என்பதே சூழற்பொருள்.
- source_word: בְיָדָם
  choice: தங்களுடன்
  rationale: ‘அவர்களுடைய கையில்’ என்ற எபிரெய மரபுத்தொடர் இங்கு உடன் எடுத்துச் செல்லுதல் அல்லது உடைமையில் வைத்திருத்தலைக் குறிக்கிறது; நவீன தமிழில் ‘தங்களுடன்’ இயல்பானது.
- source_word: וְאֶת בִּנְיָמִן
  choice: பென்யமீனையும் அழைத்துக்கொண்டார்கள்
  rationale: பென்யமீன் பொருள்களைப் போல ‘எடுத்தார்கள்’ என்று தமிழில் சொல்லாமல், அதே நேரத்தில் இரண்டாவது לָקְחוּ வினையின் ஆளுகையைப் பாதுகாக்க ‘அழைத்துக்கொண்டார்கள்’ என இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: וַיָּקֻמוּ
  choice: புறப்பட்டு
  rationale: பயணக் கதையாடலில் ‘எழுந்தார்கள்’ என்பது பயணத்தைத் தொடங்கியதைக் குறிக்கிறது; ‘புறப்பட்டு’ அந்தச் செயல்பாட்டுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיֵּרְדוּ מִצְרַיִם
  choice: எகிப்துக்குச் சென்று
  rationale: எபிரெயத்தில் கானானிலிருந்து எகிப்துக்குப் பயணிப்பதை ‘இறங்கிச் செல்லுதல்’ எனக் கூறும் புவியியல் மரபுத்தொடர் உள்ளது; தமிழில் பொருள் தெளிவாக இருக்க ‘சென்று’ என வழங்கப்பட்டுள்ளது.
- source_word: וַיַּעַמְדוּ לִפְנֵי יוֹסֵף
  choice: யோசேப்பின் முன்னிலையில் நின்றார்கள்
  rationale: ஒரு அதிகாரமுள்ளவரின் சமூகத்தில் வந்து நிற்பதையும் நேரில் ஆஜராவதையும் குறிக்கும் மூலமொழித் தொடரை நேரடியாகவும் தெளிவாகவும் தருகிறது.
- source_word: הָאֲנָשִׁים
  choice: அந்த மனிதர்கள்
  rationale: சூழலில் அவர்கள் யோசேப்பின் சகோதரர்கள் என்றாலும், மூலவசனம் பயன்படுத்தும் ‘மனிதர்கள்’ என்ற குறிப்பையே பாதுகாக்கிறது.
