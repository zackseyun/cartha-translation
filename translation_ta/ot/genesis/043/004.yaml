translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரை. தந்தையிடம் பேசுவதால் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. பிரதான உரையில் செயல் சார்ந்த நிபந்தனை வைக்கப்பட்டு, மூல எபிரெயத்தின் விருப்பம் சார்ந்த சாத்தியப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
