base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/004.yaml
  text: If you will send our brother with us[a], we will go down and buy food for you.
translation:
  language: ta
  text: எங்கள் சகோதரனை எங்களுடன் அனுப்புவீர்களானால்[a], நாங்கள் இறங்கிச் சென்று உங்களுக்காக உணவு வாங்குவோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்கள் சகோதரனை எங்களுடன் அனுப்ப நீங்கள் விரும்பினால்.” יֵשׁ என்பதுடன் வினையெச்சம் வரும் இந்த எபிரெயச் சொல்லமைப்பு, செயலை மட்டுமல்லாமல் அதைச் செய்யும் விருப்பத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: -ஆனால்
  rationale: எபிரெய நிபந்தனைச் சொல்லை இயல்பான தமிழ் நிபந்தனை விகுதியாகக் கொடுக்கிறது; மூலத்தில் இல்லாத அழுத்தத்தைச் சேர்ப்பதில்லை.
- source_word: יֶשְׁךָ + מְשַׁלֵּחַ
  choice: அனுப்புவீர்களானால்
  rationale: யாக்கோபின் செயல்/மனவிருப்பத்தை நிபந்தனையாக இயல்பாக வெளிப்படுத்துகிறது; விருப்பத்தைக் குறிக்கும் சாத்தியமான நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶת אָחִינוּ
  choice: நம் சகோதரனை
  rationale: முதல் நபர் பன்மை உடைமையையும் குடும்ப உறவின் வலியுறுத்தலையும் நேரடியாகப் பேணுகிறது.
- source_word: אִתָּנוּ
  choice: எங்களுடன்
  rationale: பென்யமீன் அவர்களோடு சேர்ந்து செல்ல வேண்டும் என்ற உடன்செல்லும் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: נֵרְדָה
  choice: நாங்கள் அங்கே போய்
  rationale: இது நிபந்தனையின் விளைவாகச் செய்யவிருக்கும் செயலை இயல்பான தமிழில் தெரிவிக்கிறது. கானானிலிருந்து எகிப்துக்குச் செல்லும் எபிரெய வழக்கிலுள்ள ‘இறங்குதல்’ என்பதை சொற்சொல்லாகத் திணிக்காமல் இலக்கு மொழியில் இயல்பாக வழங்குகிறது.
- source_word: וְנִשְׁבְּרָה
  choice: வாங்கி வருவோம்
  rationale: இந்த உணவுப் பொருள் வாங்கும் சூழலில் שבר என்பதன் பொருளைத் தருகிறது; தமிழில் பயணத்தின் நோக்கத்தையும் திரும்பக் கொண்டுவருதலையும் இயல்பாகச் சொல்கிறது.
- source_word: לְךָ
  choice: உங்களுக்காக
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டின் பயனாளிப் பொருளை மரியாதையான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֹכֶל
  choice: உணவு
  rationale: குறிப்பாகத் தானியம் என்று மிகைப்படுத்தாமல், மூலச் சொல்லின் பரந்த பொருளைப் பேணுகிறது.
