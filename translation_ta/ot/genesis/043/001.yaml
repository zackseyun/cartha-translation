lexical_decisions:
- source_word: וְהָרָעָב
  choice: பஞ்சம்
  rationale: רָעָב என்பது இச்சூழலில் பொதுவான பசியை அல்ல, பரவலான உணவுப் பற்றாக்குறையான ‘பஞ்சத்தை’ குறிக்கிறது. தொடக்க וְ தொடர்ச்சியைச் சுட்டினாலும், இயல்பான நவீனத் தமிழ் நடையில் தனியாக ‘மேலும்’ அல்லது ‘அப்போது’ சேர்க்காமல் விடப்பட்டுள்ளது.
- source_word: כָּבֵד
  choice: கடுமையாக இருந்தது
  rationale: כָּבֵד என்பதன் அடிப்படைப் பொருள் ‘கனமானது’; பஞ்சத்துடன் வரும்போது அதன் தீவிரத்தைச் சுட்டுவதால், தமிழில் இயல்பாக ‘கடுமையாக இருந்தது’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בָּאָרֶץ
  choice: நாட்டில்
  rationale: אֶרֶץ இங்கு முழு பூமியையும் அல்ல, கதையில் குறிப்பிடப்படும் நிலப்பரப்பு அல்லது நாட்டைக் குறிக்கிறது; ‘நாட்டில்’ என்பது சூழலுக்கேற்ற இயல்பான தமிழ்.
