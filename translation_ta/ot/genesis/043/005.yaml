translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. யோசேப்பைப் பற்றிய பேச்சில் ‘மனிதர்/கூறினார்’ என்ற மரியாதை ஒருமை தமிழ் உரையாடல் இயல்புக்காகத் தேர்ந்தெடுக்கப்பட்டது. மூலத்தின் ‘முகத்தைப் பார்க்க’ என்ற உருவகம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
