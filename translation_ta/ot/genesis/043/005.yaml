base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/005.yaml
  text: But if you will not send him[a], we will not go down, because the man said to us, ‘You will not see my face unless your brother is with you.’
translation:
  language: ta
  text: ஆனால், நீங்கள் அவரை அனுப்பாவிட்டால், நாங்கள் கீழே போகமாட்டோம்; ஏனெனில் அந்த மனிதன் எங்களிடம், “உங்கள் சகோதரன் உங்களோடு இருந்தாலன்றி, நீங்கள் என் முகத்தைப் பார்க்கமாட்டீர்கள்[a]” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் முகத்தைப் பார்க்கமாட்டீர்கள்” என்பது எபிரெய மொழியின் நேரடிச் சொல்லாக்கம்; இது ஒருவரின் முன்னிலையில் வருவதையோ அவருடைய சந்நிதியில் நிற்பதையோ குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால், ... அனுப்பாவிட்டால்
  rationale: முந்தைய வசனத்திலுள்ள நிபந்தனைக்கு மாறான நிலையை அறிமுகப்படுத்துவதால், எதிர்மறைத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵינְךָ מְשַׁלֵּחַ
  choice: நீ அவனை அனுப்பாவிட்டால்
  rationale: தந்தையின் தீர்மானத்தைச் சார்ந்த நிபந்தனைத் தன்மையை வெளிப்படுத்துகிறது; எபிரெயத்தில் விடப்பட்டுள்ள செயப்படுபொருள் சூழலின்படி பென்யமீனைக் குறிக்கும் வகையில் ‘அவனை’ என நிரப்பப்பட்டுள்ளது.
- source_word: לֹא נֵרֵד
  choice: நாங்கள் அங்கே போகமாட்டோம்
  rationale: கானானிலிருந்து எகிப்துக்குச் செல்வதைக் குறிக்கும் ירד என்பதன் திசை உணர்வைத் தமிழில் இயல்பாக வழங்க ‘அங்கே போகமாட்டோம்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அவர்கள் போக மறுப்பதற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: הָאִישׁ
  choice: அந்த மனிதர்
  rationale: பேசுபவர்களுக்கு யோசேப்பின் அடையாளம் இன்னும் தெரியாததால், மூலத்தின் பார்வைநிலையைப் பாதுகாக்கிறது; உரையாடல் சூழலுக்கேற்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אָמַר אֵלֵינוּ
  choice: எங்களிடம் ... என்று கூறினார்
  rationale: நேரடிக் கூற்றை இயல்பான நவீனத் தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: לֹא תִרְאוּ פָנַי
  choice: நீங்கள் என் முகத்தைப் பார்க்கமாட்டீர்கள்
  rationale: ‘ஒருவரின் முன்னிலையில் வருதல்’ என்ற எபிரெய மரபுத்தொடரின் நேரடி உருவகத்தைப் பாதுகாக்கிறது; பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: בִּלְתִּי
  choice: இருந்தாலன்றி
  rationale: சகோதரன் உடன் இருப்பது கட்டாய நிபந்தனை என்பதைத் துல்லியமாகக் காட்டுகிறது.
- source_word: אֲחִיכֶם
  choice: உங்கள் சகோதரன்
  rationale: மூலத்தில் பென்யமீன் பெயரிடப்படாததால், சூழல் அடையாளம் காட்ட அனுமதித்து மூலச் சொல்லாக்கத்தைப் பாதுகாக்கிறது.
- source_word: אִתְּכֶם
  choice: உங்களோடு
  rationale: உடனிருப்பதைக் குறிக்கும் எபிரெயச் சொல்லை இயல்பான தமிழில் வழங்குகிறது; ‘இருந்தால்’ என்பதுடன் சேர்ந்து முழுமையான நிபந்தனைத் தொடராகிறது.
