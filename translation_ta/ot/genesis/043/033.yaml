translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. எபிரெயத்தின் சற்றே கடினமான இணை அமைப்பு முதன்மை உரையில் இயல்பான ‘பிறப்பு வரிசைப்படி’ எனத் தரப்பட்டு, அதன் நேர்ச்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
