base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/033.yaml
  text: And they sat before him[a], the firstborn according to his birthright and the youngest according to his youth[b], and the men looked at one another in astonishment.
translation:
  language: ta
  text: அவர்கள் அவனுக்கு முன்பாக, மூத்தவன் முதல் இளையவன் வரை அவரவர் பிறப்பு வரிசைப்படி அமர்ந்தார்கள்[a]. அந்த மனிதர்கள் ஒருவரையொருவர் பார்த்து வியப்படைந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல் வடிவில், “முதற்பேறானவன் தன் முதற்பேற்று நிலையின்படியும், இளையவன் தன் இளைய நிலையின்படியும்.” முதற்பேற்று நிலையையும் இளைய நிலையையும் இணைத்து, அவர்கள் பிறப்பு வரிசைப்படி அமர்ந்திருந்ததை எபிரெயம் விவரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அந்த மனிதர்கள் ஒருவரையொருவர் கண்டு திகைத்தார்கள்.” எபிரெய வினை வியப்பையோ திகைப்பையோ குறிக்கலாம்; “ஒவ்வொருவனும் தன் தோழனை நோக்கி” என்ற சொற்றொடர் அவர்களுடைய பரஸ்பர எதிர்வினையைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: அமர்ந்தார்கள்
  rationale: ישׁב என்பதன் செயப்பாட்டு வடிவத்தைப் பேணுகிறது. சூழல் அவர்களுக்கான இடங்கள் ஒழுங்குபடுத்தப்பட்டிருந்ததைக் காட்டினாலும், எபிரெய வினை செயல்வினையாகவே உள்ளது.
- source_word: לְפָנָיו
  choice: அவனுக்கு முன்பாக
  rationale: யோசேப்புடனான இடம்சார் உறவை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: הַבְּכֹר כִּבְכֹרָתוֹ וְהַצָּעִיר כִּצְעִרָתוֹ
  choice: முதற்பேறானவன் முதல் இளையவன் வரை பிறப்பு வரிசைப்படி
  rationale: முதற்பேற்று நிலையையும் இளைய நிலையையும் இணைக்கும் எபிரெய அமைப்பின் நடைமுறைப் பொருள், அவர்கள் வயது அல்லது பிறப்பு வரிசைப்படி அமர்ந்திருந்தார்கள் என்பதாகும். தமிழில் தெளிவாகவும் இயல்பாகவும் இதை வெளிப்படுத்துகிறது.
- source_word: וַיִּתְמְהוּ
  choice: வியப்படைந்தார்கள்
  rationale: תמה வியப்பு அல்லது திகைப்பைக் குறிக்கிறது; இங்கு இயல்பான தமிழ் வினைச்சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: הָאֲנָשִׁים
  choice: அந்த மனிதர்கள்
  rationale: குறிப்பிடப்படுபவர்கள் யோசேப்பின் சகோதரர்கள் என்றாலும், மூலத்தின் ‘மனிதர்கள்’ என்ற சொல்லாட்சியைப் பேணுகிறது.
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: ஒருவரையொருவர் பார்த்து
  rationale: ‘ஒவ்வொருவனும் தன் தோழனை நோக்கி’ என்ற பரஸ்பரக் கருத்தை இயல்பான தமிழில் தருகிறது; வியப்பு அவர்களிடையே பரஸ்பரமாக வெளிப்பட்டதைத் தெளிவாக்குகிறது.
