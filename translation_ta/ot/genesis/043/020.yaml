  text: וַ/יֹּאמְר֖וּ בִּ֣י אֲדֹנִ֑/י יָרֹ֥ד יָרַ֛דְנוּ בַּ/תְּחִלָּ֖ה לִ/שְׁבָּר אֹֽכֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/020.yaml
  text: And they said[a], “Please, my lord[b], we came down the first time to buy food.”
translation:
  language: ta
  text: அவர்கள், “ஐயா[a], தயவுசெய்து, நாங்கள் முதல் முறை உணவு வாங்குவதற்காக உண்மையாகவே[b] கீழே வந்தோம்” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஐயா” என்பது இங்கு மனித மேலதிகாரியை மரியாதையுடன் அழைக்கும் சொல்; இறைவனைக் குறிக்கும் பட்டம் அல்ல.
    reason: cultural_note
  - marker: b
    text: “உண்மையாகவே கீழே வந்தோம்” என்று மொழிபெயர்க்கப்பட்ட இடத்தில், எபிரெய மொழி ஒரே வினையை இரு வடிவங்களில் பயன்படுத்தி வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அவர்கள் ... சொன்னார்கள்
  rationale: வாவ் தொடர்வினையுடன் வரும் வழக்கமான எபிரெயக் கதைநடை வடிவம்; தமிழில் இயல்பான நேரடிப் பேச்சு அறிமுகமாக வழங்கப்பட்டுள்ளது.
- source_word: בִּי
  choice: ஐயா
  rationale: இது சொல்லுக்குச் சொல் பொருளில் ‘என்னில்’ என்பதல்ல; மேலதிகாரியிடம் பணிவுடன் வேண்டிக்கொள்ளும் இடைச்சொல். அடுத்த மரியாதை அழைப்புடன் இணைத்து இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: אֲדֹנִי
  choice: ஐயா
  rationale: மனித மேலதிகாரியை மரியாதையுடன் அழைக்கும் சொல். இங்கு இறைப்பட்டம் என்ற தவறான எண்ணம் எழாமல், சமூக மரியாதைத் தொனியை ‘ஐயா’ இயல்பாகக் காட்டுகிறது.
- source_word: יָרֹד יָרַדְנוּ
  choice: வந்தோம் ... தான்
  rationale: இறங்குதல் என்ற எபிரெய வழக்கை இலக்கு இடத்தை நோக்கி ‘வந்தோம்’ எனத் தமிழாக்கி, infinitive absolute தரும் வலியுறுத்தலை ‘தான்’ மூலம் காத்துள்ளது.
- source_word: בַּתְּחִלָּה
  choice: முன்பு
  rationale: இச்சூழலில் அவர்களின் முந்தைய பயணத்தைக் குறிக்கிறது; நவீன தமிழில் ‘முன்பு’ தெளிவும் இயல்பும் உடையது.
- source_word: לִשְׁבָּר
  choice: வாங்குவதற்காக
  rationale: உணவு அல்லது தானியத்தைப் பணம் கொடுத்துப் பெறுவதை இவ்வினை குறிக்கிறது.
- source_word: אֹכֶל
  choice: உணவு
  rationale: சூழலில் தானியம் இடம்பெற்றாலும், மூலச்சொல் பொதுவாக ‘உணவு’ என்பதால் அதன் பரந்த பொருள் காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: אֲדֹנִי என்பது இறைப்பட்டமா அல்லது மனிதருக்கான மரியாதை அழைப்பா
  choice: மனித மேலதிகாரிக்கான ‘ஐயா’
  alternative: ‘என் ஆண்டவரே’
  rationale: இச்சூழலில் அவர்கள் யோசேப்பின் வீட்டுப் பொறுப்பாளரிடம் பேசுகிறார்கள்; ஆகவே தெய்வீகக் குறிப்பு இல்லாத மனித மரியாதை அழைப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பணிவான நேரடிப் பேச்சாகவும் சாதாரண வாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. எபிரெய வலியுறுத்தல் ‘தான்’ மூலம் வெளிப்படுத்தப்பட்டுள்ளது.
