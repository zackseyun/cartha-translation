translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. முதல் பகுதியில் குறிப்பான ‘தானியம்’ என்றும், யாக்கோபின் கட்டளையில் மூலத்திலுள்ள பொதுவான சொல்லுக்கேற்ப ‘உணவு’ என்றும் வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
