revisions:
- from: அவர்கள் எகிப்திலிருந்து கொண்டுவந்திருந்த தானியத்தைச் சாப்பிட்டுத் தீர்த்தபோது, அவர்களுடைய தந்தை அவர்களிடம், “திரும்பிப் போய் நமக்குக் கொஞ்சம் உணவு வாங்கி வாருங்கள்” என்றார்.
  to: அவர்கள் எகிப்திலிருந்து கொண்டுவந்திருந்த தானியத்தைச் சாப்பிட்டுத் தீர்த்தபோது, அவர்களுடைய தந்தை அவர்களிடம், “திரும்பிப் போய், நமக்குக் கொஞ்சம் உணவு வாங்குங்கள்” என்றார்.
  rationale: The revision removes the added directional sense in “வாருங்கள்,” while retaining the source’s two commands in natural Tamil. The lexical contrast between the previously obtained “தானியம்” and the requested “உணவு” remains intact. No footnote is required, since the rendering itself follows the broader meaning of אֹכֶל and does not conceal a textual ambiguity.
