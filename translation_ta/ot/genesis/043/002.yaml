  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר כִּלּוּ֙ לֶ/אֱכֹ֣ל אֶת הַ/שֶּׁ֔בֶר אֲשֶׁ֥ר הֵבִ֖יאוּ מִ/מִּצְרָ֑יִם וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ אֲבִי/הֶ֔ם שֻׁ֖בוּ שִׁבְרוּ לָ֥/נוּ מְעַט אֹֽכֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/002.yaml
  text: And when they had finished eating the grain that they had brought from Egypt[a], their father said to them, “Go back; buy us a little food.”
translation:
  language: ta
  text: அவர்கள் எகிப்திலிருந்து கொண்டுவந்திருந்த தானியத்தைச் சாப்பிட்டுத் தீர்த்தபோது, அவர்களுடைய தந்தை அவர்களிடம், “திரும்பிப் போய், நமக்குக் கொஞ்சம் உணவு வாங்குங்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: அப்போது
  rationale: எபிரேயக் கதைத் தொடரை இயல்பான நவீன தமிழில் அடுத்த நிகழ்வுடன் இணைக்கிறது; தனியே ‘நிகழ்ந்தது’ என்று மொழிபெயர்ப்பது தமிழில் விறைப்பாக இருக்கும்.
- source_word: כִּלּוּ לֶאֱכֹל
  choice: சாப்பிட்டுத் தீர்த்தபோது
  rationale: כלה + வினையெச்சத்தின் நிறைவு உணர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַשֶּׁבֶר
  choice: தானியத்தை
  rationale: யோசேப்புக் கதையின் பஞ்சச் சூழலில் שֶׁבֶר வாங்கப்பட்ட தானியத்தைக் குறிப்பதாகும்; பொதுவான ‘உணவு’ என்பதைக் காட்டிலும் இது துல்லியமானது.
- source_word: הֵבִיאוּ מִמִּצְרָיִם
  choice: எகிப்திலிருந்து கொண்டுவந்திருந்த
  rationale: தானியத்தைக் கொண்டுவந்த செயல் அதைச் சாப்பிட்டுத் தீர்ப்பதற்கு முன்பு நடந்ததை ‘இருந்த’ வடிவம் தெளிவாக்குகிறது.
- source_word: אֲבִיהֶם
  choice: அவர்களுடைய தந்தை
  rationale: மூலத்தின் உறவுமுறைச் சொல்லை நேரடியாகப் பாதுகாக்கிறது; ‘யாக்கோபு’ எனப் பெயரைச் சேர்க்கவில்லை.
- source_word: שֻׁבוּ
  choice: திரும்பிப் போய்
  rationale: மீண்டும் எகிப்துக்குச் செல்லும்படியான கட்டளையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שִׁבְרוּ
  choice: வாங்கி வாருங்கள்
  rationale: இந்தச் சூழலில் வினைச்சொல் தானியம் அல்லது உணவுப் பொருள் வாங்குவதைக் குறிக்கிறது; ‘வாருங்கள்’ இலக்கில் வாங்கிவிட்டுத் திரும்ப வேண்டும் என்ற இயல்பான தமிழ் உணர்வை வெளிப்படுத்துகிறது.
- source_word: לָנוּ
  choice: நமக்கு
  rationale: பேசுகிற தந்தையையும் கேட்பவர்களையும் உள்ளடக்கும் முதல் நபர் பன்மை என்பதால் ‘நமக்கு’ பொருத்தமானது.
- source_word: מְעַט אֹכֶל
  choice: கொஞ்சம் உணவு
  rationale: אֹכֶל என்பது இங்கு பொதுவான ‘உணவு’; מְעַט குறிக்கும் சிறிய அளவை ‘கொஞ்சம்’ இயல்பாகத் தருகிறது.
