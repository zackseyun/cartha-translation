  yaml_path: translation/ot/genesis/043/025.yaml
  text: And they prepared the gift until Yosef came at noon[a], because they had heard that they would eat bread there.
translation:
  language: ta
  text: 'அவர்கள் நண்பகலில் யோசேப்பு வரும்வரை அந்த அன்பளிப்பை ஆயத்தப்படுத்தினார்கள். ஏனெனில், அங்கே அவர்கள் அப்பம் சாப்பிடப்போகிறார்கள் என்று கேள்விப்பட்டிருந்தார்கள்.[a]


    [a] “அப்பம் சாப்பிடுவது” என்பது உணவு அருந்துவதைக் குறிக்கும் எபிரெய வழக்குச்சொல்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அப்பம் சாப்பிடுவது” என்பது உணவு அருந்துவதைக் குறிக்கும் எபிரெய வழக்குச்சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: ஆயத்தப்படுத்தி வைத்தார்கள்
  rationale: כון என்பதன் ஹிஃபில் வடிவம் இங்கு ஒரு பொருளைத் தயாராக வைத்தலைக் குறிக்கிறது; இந்தத் தமிழ் நடை செயலையும் அதன் விளைவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמִּנְחָה
  choice: அந்த அன்பளிப்பு
  rationale: இந்தக் கதைத்தொடரில் מִנְחָה வழிபாட்டுக் காணிக்கையை அல்ல, யோசேப்புக்குக் கொண்டுவந்த பரிசைக் குறிக்கிறது; ‘அன்பளிப்பு’ அந்த வேறுபாட்டைத் தெளிவாகக் காக்கிறது.
- source_word: עַד בּוֹא יוֹסֵף
  choice: யோசேப்பு வரும்வரை
  rationale: עַד உடன் வரும் בּוֹא, யோசேப்பின் வருகை வரையிலான கால எல்லையைச் சுட்டுகிறது.
- source_word: בַּצָּהֳרָיִם
  choice: நண்பகலில்
  rationale: இந்தச் சொல் பகலின் நடுப்பகுதியான நண்பகலைக் குறிக்கிறது.
- source_word: כִּי שָׁמְעוּ
  choice: ஏனெனில் ... கேள்விப்பட்டிருந்தார்கள்
  rationale: முதல் כִּי காரணத்தைக் காட்டுகிறது; முன்னரே கிடைத்த செய்தியே அவர்களுடைய ஆயத்தத்திற்குக் காரணம் என்பதை இறந்தகால நிறைவு நடை வெளிப்படுத்துகிறது.
- source_word: כִּי שָׁם
  choice: அங்கே ... என்று
  rationale: இரண்டாவது כִּי அவர்கள் கேள்விப்பட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; שָׁם இடத்தைக் குறிக்கிறது.
- source_word: יֹאכְלוּ לָחֶם
  choice: அப்பம் சாப்பிடப்போவதாக
  rationale: மூலத்தின் ‘அப்பம் சாப்பிடுதல்’ என்ற உருவகத்தைத் தக்கவைத்து, அது முழு உணவைப் பகிர்வதைக் குறிக்கும் வழக்குச்சொல் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: எபிரெயப் பெயரான יוֹסֵף என்பதற்கான தமிழில் இயல்பாக உச்சரிக்கக்கூடிய ஒலிபெயர்ப்பு.
