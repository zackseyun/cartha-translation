  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יִשְׂרָאֵ֣ל אֲבִי/הֶ֗ם אִם כֵּ֣ן אֵפוֹא֮ זֹ֣את עֲשׂוּ֒ קְח֞וּ מִ/זִּמְרַ֤ת הָ/אָ֨רֶץ֙ בִּ/כְלֵי/כֶ֔ם וְ/הוֹרִ֥ידוּ לָ/אִ֖ישׁ מִנְחָ֑ה מְעַ֤ט צֳרִי֙ וּ/מְעַ֣ט דְּבַ֔שׁ נְכֹ֣את וָ/לֹ֔ט בָּטְנִ֖ים וּ/שְׁקֵדִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/011.yaml
  text: 'Then Israel their father said to them[a], “If it must be so, then do this: take some of the choice products of the land in your containers, and carry down to the man a gift—a little balm and a little honey, gum and myrrh[c][b], pistachio nuts and almonds.”'
translation:
  language: ta
  text: 'அப்போது அவர்களுடைய தந்தை இஸ்ரவேல் அவர்களிடம், “அப்படித்தான் ஆக வேண்டுமென்றால், இதைச் செய்யுங்கள்: இந்த நாட்டின் சிறந்த விளைபொருள்களில் சிலவற்றை[a] உங்கள் பாத்திரங்களில் எடுத்துக்கொண்டு, அந்த மனிதனுக்கு அன்பளிப்பாகக் கொண்டு செல்லுங்கள்—கொஞ்சம் நறுமணத் தைலம், கொஞ்சம் தேன்[b], நறுமணப் பிசின், வெள்ளைப்போளம்[c], பிஸ்தா பருப்புகள், பாதாம் பருப்புகள்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதற்கான எபிரெயச் சொற்றொடரை “இந்த நாட்டின் மிகச் சிறந்த விளைச்சலில் சில” என்றும் மொழிபெயர்க்கலாம். இது பழங்களை மட்டும் அல்லாமல், நாட்டின் தேர்ந்த விளைபொருள்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “தேன்” என்ற சொல் சில சூழல்களில் தேனீத் தேனை அல்லாமல், இனிப்பான பழப்பாகையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “நறுமணப் பிசின்”, “வெள்ளைப்போளம்” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயப் பொருட்களின் துல்லியமான அடையாளம் உறுதியில்லை; அவை தாவரங்களிலிருந்து பெறப்பட்ட பல்வேறு நறுமணப் பிசின் வகைகளைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל אֲבִיהֶם
  choice: அவர்களுடைய தந்தை இஸ்ரவேல்
  rationale: எபிரெயச் சொல்லமைப்பையும், இச்சூழலில் யாக்கோபுக்கு பயன்படுத்தப்படும் ‘இஸ்ரவேல்’ என்ற பெயரையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אִם כֵּן אֵפוֹא
  choice: அப்படித்தான் ஆக வேண்டுமென்றால்
  rationale: வெறும் நிபந்தனையை அல்லாமல், சூழ்நிலையை விருப்பமின்றி ஏற்றுக்கொள்ளும் தந்தையின் மனநிலையையும் வெளிப்படுத்துகிறது.
- source_word: זֹאת עֲשׂוּ
  choice: இதைச் செய்யுங்கள்
  rationale: கட்டளையின் நேரடியான, சுருக்கமான இயல்பைத் தக்கவைக்கிறது.
- source_word: מִזִּמְרַת הָאָרֶץ
  choice: இந்த நாட்டின் சிறந்த விளைபொருள்களில் சிலவற்றை
  rationale: கனிகளை மட்டும் சுட்டாமல், நாட்டின் தேர்ந்த விளைபொருள்களைப் பொதுவாகக் குறிக்கும் எபிரெயச் சொல்லின் பரந்த பொருளைக் காக்கிறது.
- source_word: בִּכְלֵיכֶם
  choice: உங்கள் பாத்திரங்களில்
  rationale: குறிப்பிட்ட வகைப் பை அல்லது பெட்டியை ஊகிக்காமல், பொருட்களை வைக்கும் பொதுவான கொள்கலன்களைக் குறிக்கிறது.
- source_word: וְהוֹרִידוּ
  choice: கொண்டுபோங்கள்
  rationale: எகிப்தை நோக்கிப் பொருட்களை எடுத்துச் செல்லும் செயலை இயல்பான தமிழில் தெரிவிக்கிறது; ‘கீழே’ என்பதைச் சொற்சொல்லாகச் சேர்ப்பது இங்கு செயற்கையாக இருக்கும்.
- source_word: לָאִישׁ
  choice: அந்த மனிதனுக்கு
  rationale: முன்னரே குறிப்பிடப்பட்ட எகிப்திய அதிகாரியைச் சுட்டுகிறது.
- source_word: מִנְחָה
  choice: அன்பளிப்பாக
  rationale: இது வழிபாட்டுப் பலியல்ல; நல்லெண்ணத்துடன் வழங்கப்படும் பரிசு என்பதைக் சூழலுக்கேற்றவாறு காட்டுகிறது.
- source_word: צֳרִי
  choice: நறுமணத் தைலம்
  rationale: மருத்துவத்திற்கோ நறுமணத்திற்கோ பயன்பட்ட தைலப்பிசின் வகையை வாசகர்களுக்குப் புரியும் தமிழில் குறிக்கிறது.
- source_word: דְּבַשׁ
  choice: தேன்
  rationale: இச்சொல்லின் வழக்கமான பொருளை முதன்மை உரையில் தருகிறது; பழப்பாகு என்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: נְכֹאת
  choice: நறுமணப் பிசின்
  rationale: தாவரவியல் அடையாளம் உறுதியில்லாததால், குறிப்பிட்ட பிசின் வகையை ஊகிக்காமல் பொதுவான பொருளை வழங்குகிறது.
- source_word: לֹט
  choice: வெள்ளைப்போளம்
  rationale: பழக்கமான தமிழ் வேதாகமச் சொல்லை பயன்படுத்துகிறது; துல்லியமான நறுமணப் பிசின் வகை உறுதியில்லை என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: בָּטְנִים
  choice: பிஸ்தா பருப்புகள்
  rationale: இச்சொல் குறிக்கும் கொட்டையைத் துல்லியமாகவும் நவீன வாசகர்களுக்குப் புரியுமாறும் தருகிறது.
- source_word: שְׁקֵדִים
  choice: பாதாம் பருப்புகள்
  rationale: பொதுவாக அறியப்பட்ட நவீன தமிழ்ப் பெயரைப் பயன்படுத்துகிறது.
