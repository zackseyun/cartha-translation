base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/029.yaml
  text: He lifted up his eyes and saw Benjamin[a], his brother, his mother's son, and said, “Is this your youngest brother, of whom you spoke to me?” Then he said, “May God be gracious to you, my son.”
translation:
  language: ta
  text: அவர் கண்களை உயர்த்தி, தன் சகோதரனும் தன் தாய்க்குப் பிறந்த மகனுமான பென்யமீனைக்[a] கண்டு, “நீங்கள் என்னிடம் கூறிய உங்கள் இளைய சகோதரன் இவர்தானா?” என்று கேட்டார். பின்பு அவர், “மகனே, கடவுள் உனக்கு அருள்புரிவாராக” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் சகோதரனும் தன் தாய்க்குப் பிறந்த மகனுமான” என்பது பென்யமீன் யோசேப்பின் சகோதரன் மட்டுமல்ல, ஒரே தாய்க்குப் பிறந்த சகோதரனும் என்பதைக் வலியுறுத்துகிறது.
    reason: உறவுமுறையை வலியுறுத்தும் மூலமொழி அமைப்பை விளக்குதல்
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: அவர் கண்களை உயர்த்தி
  rationale: ‘தன் கண்களை உயர்த்தினார்’ என்ற எபிரெய மொழிவடிவத்தின் காட்சித்தன்மையைப் பேணுகிறது; அதேவேளை நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: וַיַּרְא
  choice: பார்த்து
  rationale: ரָאָה என்ற வினையின் நேரடியான பொருளை, முந்தைய செயல்வரிசையுடன் இயல்பாக இணைக்கிறது.
- source_word: אֶת בִּנְיָמִין
  choice: பென்யமீனை
  rationale: தனிப்பெயர் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப தரப்பட்டுள்ளது.
- source_word: אָחִיו בֶּן אִמּוֹ
  choice: தன் தாயின் மகனான தன் சகோதரன்
  rationale: பென்யமீன் யோசேப்புக்கு ஒரே தாயின் வழியாகவும் சகோதரன் என்பதை வலியுறுத்தும் எபிரெய இணைப்பைச் சுருக்காமல் பேணுகிறது.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: உங்கள் இளைய சகோதரன்
  rationale: הַקָּטֹן இங்கு உடல் அளவைக் குறிக்காமல் சகோதரர்களில் வயதில் இளையவனைக் குறிக்கிறது. ‘கடைசித் தம்பி’ என்பதைவிட ‘இளைய சகோதரன்’ மூலத்தின் இயல்பான விரிவை நன்கு பேணுகிறது.
- source_word: אֲשֶׁר אֲמַרְתֶּם אֵלָי
  choice: நீங்கள் என்னிடம் சொன்ன
  rationale: எபிரெய சொற்றொடருக்கு நெருக்கமாகவும், தமிழில் இயல்பாகவும் உள்ளது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: பொதுவான எபிரெய இறைப்பெயரை நவீன பொதுத்தமிழில் இயல்பாகக் குறிக்கிறது; உடன்படிக்கைப் பெயராக மாற்றவில்லை.
- source_word: יָחְנְךָ
  choice: உனக்கு அருள்புரிவாராக
  rationale: חנן என்பதன் அருளும் தயவும் காட்டுதல் என்ற பொருளையும், வாழ்த்துரையின் விருப்பவினைத் தன்மையையும் வெளிப்படுத்துகிறது.
- source_word: בְּנִי
  choice: மகனே
  rationale: ஆண்பால் ஒருமை அன்பழைப்பைத் துல்லியமாகவும் இயல்பாகவும் பேணுகிறது.
theological_decisions:
- issue: אֱלֹהִים יָחְנְךָ என்ற வாழ்த்துரையின் வடிவம்
  choice: கடவுள் உனக்கு அருள்புரிவாராக
  alternative: கடவுள் உனக்குத் தயவு காட்டுவாராக
  rationale: எபிரெய வினையின் அருள்நிறைந்த தயவு என்ற பொருளையும் வேண்டுதல்/வாழ்த்து வலிமையையும் பேணுகிறது; மூலத்தில் இல்லாத கூடுதல் இறையியல் கருத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதையோட்டமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் உறவுமுறை வலியுறுத்தல் பிரதான உரையிலேயே பேணப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது. நேரடி உரையில் ஒருமை ‘உனக்கு’ மற்றும் ‘மகனே’ என்பவை எபிரெய இலக்கணத்துக்கு ஏற்ப வைக்கப்பட்டுள்ளன.
