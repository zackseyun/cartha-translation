  text: וַ/יֹּאמְר֗וּ שָׁל֛וֹם לְ/עַבְדְּ/ךָ֥ לְ/אָבִ֖י/נוּ עוֹדֶ֣/נּוּ חָ֑י וַֽ/יִּקְּד֖וּ ו/ישתחו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/028.yaml
  text: They said[a], “Your servant our father is well; he is still alive.” Then they bowed down and prostrated themselves.
translation:
  language: ta
  text: அவர்கள், “உமது அடியானான எங்கள் தந்தை நலமாக[a] இருக்கிறார்; அவர் இன்னும் உயிரோடிருக்கிறார்” என்றார்கள். பின்பு அவர்கள் தலைவணங்கி, தரைமட்டும் பணிந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் “சமாதானம்” (ஷாலோம்); இங்கு நலம் அல்லது நல்வாழ்வைக் குறிக்கும் மரபுத்தொடராகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: நலமாக இருக்கிறார்
  rationale: இங்கு שָׁלוֹם என்பது தந்தையின் நலநிலையைப் பற்றிய விசாரணைக்கான மரபுத்தொடர் பதில்; ‘சமாதானம்’ என்ற சொற்சொல் மொழிபெயர்ப்பைவிட ‘நலமாக இருக்கிறார்’ என்பது தமிழில் இயல்பாகப் பொருளைத் தருகிறது.
- source_word: לְעַבְדְּךָ
  choice: உமது அடியானாகிய
  rationale: யோசேப்பிடம் மரியாதையுடனும் தாழ்மையுடனும் பேசும் அரசவைச் சூழலை ‘அடியான்’ வெளிப்படுத்துகிறது; இங்கு உடைமையாக்கப்பட்ட அடிமை என்ற பொருளை வலியுறுத்த வேண்டியதில்லை.
- source_word: לְאָבִינוּ
  choice: எங்கள் தந்தை
  rationale: முதலாம் நபர் பன்மை உடைமைத் தொடர்பை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עוֹדֶנּוּ חָי
  choice: அவர் இன்னும் உயிரோடிருக்கிறார்
  rationale: עוֹד என்பதன் தொடர்நிலை வலிமையை ‘இன்னும்’ காக்கிறது; நவீனத் தமிழில் இயல்பான நடை.
- source_word: וַיִּקְּדוּ
  choice: தலைவணங்கி
  rationale: קדד குறிக்கும் உடலைத் தாழ்த்தி வணங்கும் முதல் அசைவைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: וישתחו
  choice: தரைமட்டும் பணிந்தார்கள்
  rationale: மேலதிகாரியின் முன் உடலை மிகவும் தாழ்த்திப் பணியும் செயலைக் காட்டுகிறது; மதவழிபாடு என்ற தேவையற்ற பொருளை இறக்குமதி செய்யவில்லை.
theological_decisions:
- issue: וישתחו என்ற மரியாதைச் செயலை மொழிபெயர்த்தல்
  choice: தரைமட்டும் பணிந்தார்கள்
  alternative: வழிபட்டார்கள்; விழுந்து வணங்கினார்கள்
  rationale: சூழல் யோசேப்புக்கு முன் செலுத்தப்படும் சமூக மரியாதையைச் சுட்டுகிறது, இறை வழிபாட்டை அல்ல. தேர்ந்த மொழியாக்கம் உடல் செயலை வெளிப்படுத்தி, உரை கூறாத இறையியல் கருத்தைச் சேர்க்காமல் இருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை. யோசேப்பிடம் பேசும் மரியாதைத் தொனிக்காக ‘உமது அடியான்’ பயன்படுத்தப்பட்டுள்ளது. இரு தொடர்ச்சியான வணக்க வினைகளின் வேறுபாடு ‘தலைவணங்கி, தரைமட்டும் பணிந்தார்கள்’ என்று பாதுகாக்கப்பட்டுள்ளது.
