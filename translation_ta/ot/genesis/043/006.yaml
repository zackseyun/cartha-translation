translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான விவிலிய உரைநடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. மகன்கள் பலரிடம் உரையாடுவதால் பன்மை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது; இஸ்ரவேலைக் குறிக்க மரியாதை ஒருமை நடை பின்பற்றப்பட்டுள்ளது.
