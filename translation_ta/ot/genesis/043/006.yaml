  text: Then Israel said[a], “Why did you do me harm by telling the man that you still had another brother?”
translation:
  language: ta
  text: அப்போது இஸ்ரவேல், “உங்களுக்கு இன்னொரு சகோதரன் இருக்கிறான்[a] என்று அந்த மனிதனிடம் சொல்லி, ஏன் எனக்குத் தீங்கு செய்தீர்கள்?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “உங்களுக்கு இன்னும் ஒரு சகோதரன் இருக்கிறான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர் வடிவம் நிகழ்ச்சியை முன்னெடுத்துச் செல்கிறது; ‘அப்போது’ என்பது அதன் தொடர் வலிமையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: மூல எபிரெய உரை ‘யாக்கோபு’ என்பதற்குப் பதிலாக ‘இஸ்ரவேல்’ என்ற பெயரைப் பயன்படுத்துவதால், அதுவே தக்கவைக்கப்படுகிறது.
- source_word: לָמָה
  choice: ஏன்
  rationale: நேரடியான காரண வினாவுக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: הֲרֵעֹתֶם לִי
  choice: ஏன் எனக்குத் தீங்கு செய்தீர்கள்
  rationale: רעע என்பதன் ஹிஃபில் வடிவம் தீங்கு விளைவித்தல் அல்லது கேடு செய்தல் என்ற காரணவினைப் பொருளைக் கொண்டது; இங்கு இஸ்ரவேல் தமக்கு ஏற்பட்ட பாதிப்பைக் குற்றச்சாட்டாகக் கூறுகிறார்.
- source_word: לְהַגִּיד
  choice: சொல்லி
  rationale: தீங்கு எவ்வாறு ஏற்பட்டது என்பதைச் சுட்டும் வழிமுறை அல்லது சூழ்நிலையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לָאִישׁ
  choice: அந்த மனிதனிடம்
  rationale: முன்னரே அறிமுகமான எகிப்திய அதிகாரியைக் குறிக்கும் குறிப்பிட்ட பெயர்ச்சொல் தொடரைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் வழங்குகிறது.
- source_word: הַעוֹד לָכֶם אָח
  choice: உங்களுக்கு இன்னொரு சகோதரன் இருக்கிறான்
  rationale: עוד இங்கு தொடர்ந்து அல்லது கூடுதலாக ஒருவர் இருப்பதைக் குறிக்கிறது. சூழலில் ஏற்கெனவே உள்ள சகோதரர்களுக்கு மேலாக இன்னொரு சகோதரன் இருப்பதையே கேள்வி தொடுகிறது; அதனால் ‘இன்னொரு’ இயல்பான தமிழாகும், நேரடியான அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
