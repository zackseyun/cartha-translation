  naturalness: ‘உங்களுக்கு நலம் உண்டாகட்டும்’ மற்றும் ‘பயப்படாதீர்கள்’ இயல்பான, கண்ணியமான நவீனத் தமிழ். ‘சிமியோனை அவர்களிடம் வெளியே அழைத்து வந்தான்’ என்பதிலுள்ள சொல் வரிசை சற்றே தடைபடுகிறது; ‘சிமியோனை வெளியே கொண்டு வந்து அவர்களிடம் அழைத்து வந்தான்’ என்பதற்கு பதிலாக ஒரே செயலைத் தெளிவாகச் சொல்லும் வடிவம் தேவை. திருத்தத்தில் ‘வெளியே கொண்டு வந்தான்’ என இயல்பாக்கப்பட்டுள்ளது.
