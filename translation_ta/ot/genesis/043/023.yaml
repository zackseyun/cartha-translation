base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/023.yaml
  text: He said[a], “Peace to you. Do not be afraid. Your God and the God of your father has given you treasure in your sacks[b]. Your silver came to me.” Then he brought Simeon out to them.
translation:
  language: ta
  text: அவன் அவர்களிடம், “உங்களுக்கு நலம் உண்டாகட்டும்; பயப்படாதீர்கள். உங்கள் கடவுளும் உங்கள் தந்தையின் கடவுளுமானவர் உங்கள் சாக்குகளில் உங்களுக்குப் புதையலை[a] தந்திருக்கிறார். உங்கள் வெள்ளி[b] என்னிடம் வந்து சேர்ந்தது” என்றான். பின்பு அவன் சிமியோனை வெளியே கொண்டு வந்து அவர்களிடம் அழைத்து வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மறைத்து வைக்கப்பட்ட செல்வத்தை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்கள் பணம்.” எபிரெயத்தில் “வெள்ளி” என்பது அடிக்கடி பணத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם לָכֶם
  choice: உங்களுக்கு நலம் உண்டாகட்டும்
  rationale: இச்சூழலில் שָׁלוֹם அச்சத்தைத் தணிக்கும் நல்வாழ்த்தாகவும் உறுதியளிப்பாகவும் வருகிறது. தமிழில் இயல்பான இந்தச் சொற்றொடர் அதன் அமைதி, நலன் ஆகிய கருத்துகளைச் சூழலுக்கேற்றவாறு வெளிப்படுத்துகிறது.
- source_word: אַל תִּירָאוּ
  choice: பயப்படாதீர்கள்
  rationale: எதிர்மறைக் கட்டளையின் நேரடியான, இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: אֱלֹהֵיכֶם וֵאלֹהֵי אֲבִיכֶם
  choice: உங்கள் கடவுளும் உங்கள் தந்தையின் கடவுளும்
  rationale: இரு குறிப்புகளும் ஒரே கடவுளைச் சுட்டுகின்றன; தந்தை என்பதும் எபிரெயத்தில் ஒருமையாகவே உள்ளது. அதை மூதாதையர் எனப் பொதுமைப்படுத்தவில்லை.
- source_word: נָתַן לָכֶם
  choice: தந்திருக்கிறார்
  rationale: எபிரெய நிறைவுற்ற வினையின் உடனடி விளைவு தற்போதும் பொருந்துவதைக் காட்டும் இயல்பான தமிழ் வடிவம்; ஒரே கடவுளைக் குறிக்கும் ஒருமையும் காக்கப்படுகிறது.
- source_word: מַטְמוֹן
  choice: புதையல்
  rationale: மறைத்து அல்லது சேமித்து வைக்கப்பட்ட மதிப்புள்ள பொருள் என்ற சொல்லின் கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; மறைவுப் பொருளை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: בְּאַמְתְּחֹתֵיכֶם
  choice: உங்கள் சாக்குகளில்
  rationale: தானியத்தை எடுத்துச் செல்லும் பைகளைக் குறிக்கும் பண்டைய பயணச் சூழலுக்கு ‘சாக்குகள்’ பொருத்தமானது.
- source_word: כַּסְפְּכֶם בָּא אֵלָי
  choice: உங்கள் வெள்ளி என்னிடம் வந்து சேர்ந்தது
  rationale: כֶּסֶף என்பதன் நேரடிப் பொருளான ‘வெள்ளி’யையும், בָּא אֵלָי என்பதன் ‘என்னிடம் வந்தது’ என்ற உருவகத்தையும் காக்கிறது; தமிழில் நிறைவைக் காட்ட ‘வந்து சேர்ந்தது’ என இயல்பாக்கப்பட்டுள்ளது.
- source_word: וַיּוֹצֵא אֲלֵהֶם אֶת שִׁמְעוֹן
  choice: பின்பு சிமியோனை அவர்களிடம் வெளியே அழைத்து வந்தான்
  rationale: יצא என்பதன் காரணவினை வடிவிலுள்ள ‘வெளியே கொண்டுவருதல்’ என்ற திசைநுணுக்கத்தைப் பாதுகாக்கிறது; தொடர் நிகழ்வை ‘பின்பு’ இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: மேற்பார்வையாளனின் பேச்சில் கடவுளைப் பற்றிய குறிப்பு
  choice: அவனுடைய சொற்களை, சகோதரர்களின் கடவுளும் அவர்களுடைய தந்தையின் கடவுளும் ஒருவரே என்பதைக் குறிக்கும் விதத்தில் நேரடியாக மொழிபெயர்த்தல்
  alternative: இது வெறும் மரியாதைக்குரிய சமரசப் பேச்சு எனவோ, அவனுடைய முழுமையான தனிப்பட்ட விசுவாச அறிக்கை எனவோ விளக்குதல்
  rationale: பேசியவனின் உள்ளார்ந்த நம்பிக்கையை எபிரெய உரை விளக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அவனுடைய சொற்களை மட்டும் தருகிறது; கூடுதல் இறையியல் முடிவைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நலம் உண்டாகட்டும்’ என்பது ஆறுதலளிக்கும் שָׁלוֹם என்ற வாழ்த்தை இயல்பாகத் தருகிறது; ‘வெள்ளி’ மற்றும் ‘வெளியே’ போன்ற மூலமொழி நுணுக்கங்கள் காக்கப்பட்டுள்ளன.
