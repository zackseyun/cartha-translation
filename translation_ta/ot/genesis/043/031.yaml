translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர்ச்சியான செயல்கள் இயல்பான தமிழ் வினையெச்சத் தொடராக வழங்கப்பட்டுள்ளன. அடிக்குறிப்பு குறி அது விளக்கும் ‘உணவு’ என்பதோடு இணைக்கப்பட்டுள்ளது.
