base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/031.yaml
  text: Then he washed his face[a], came out, controlled himself, and said, “Serve the food.”
translation:
  language: ta
  text: பின்பு அவன் தன் முகத்தைக் கழுவி, வெளியே வந்து, தன்னைக் கட்டுப்படுத்திக்கொண்டு, “உணவைப் பரிமாறுங்கள்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “அப்பம்”; இங்கு அது பரிமாறப்படும் உணவை அல்லது விருந்து முழுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְחַץ
  choice: கழுவி
  rationale: רחץ என்பதன் இயல்பான பொருள் ‘கழுவுதல்.’ தனியாக அழுதபின் யோசேப்பு தன் முகத்தைச் சுத்தம் செய்துகொண்டு திரும்பி வருவதை இச்சொல் இயல்பாகத் தெரிவிக்கிறது.
- source_word: פָּנָיו
  choice: தன் முகத்தை
  rationale: எபிரெயத்தில் பன்மை வடிவில் இருந்தாலும், ஒருவருடைய முகத்தைக் குறிக்கும்போது தமிழில் ஒருமையாக ‘முகம்’ என வழங்குவது இயல்பானது. எழுவாயான யோசேப்பையே சுட்டுவதால் ‘தன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיֵּצֵא
  choice: வெளியே வந்து
  rationale: יצא என்பது வெளியே செல்லுதல் அல்லது வருதல் எனச் சூழலுக்கேற்ப மொழிபெயர்க்கப்படலாம். யோசேப்பு தனியறையிலிருந்து விருந்திடம் திரும்புவதை ‘வெளியே வந்து’ இயல்பாகக் காட்டுகிறது.
- source_word: וַיִּתְאַפַּק
  choice: தன்னைக் கட்டுப்படுத்திக்கொண்டு
  rationale: התאפק இங்கு தீவிரமான உணர்ச்சியை அடக்கித் தன்னை நிலைப்படுத்திக்கொள்வதைக் குறிக்கிறது. ‘தன்னைக் கட்டுப்படுத்திக்கொண்டு’ என்பது அதன் தற்சுட்டு வலிமையையும் சூழலையும் தெளிவாகக் காக்கிறது.
- source_word: שִׂימוּ
  choice: பரிமாறுங்கள்
  rationale: இதன் அடிப்படைப் பொருள் ‘வையுங்கள்’ என்றாலும், உணவு பரிமாறப்படும் சூழலில் ‘பரிமாறுங்கள்’ என்பதே கட்டளையின் இயல்பான பொருளைத் தருகிறது. வினை பன்மைக் கட்டளை என்பதும் தமிழில் காக்கப்பட்டுள்ளது.
- source_word: לָחֶם
  choice: உணவை
  rationale: לֶחֶם என்பதன் நேரடிப் பொருள் ‘அப்பம்’; ஆனால் அது உணவையோ முழு விருந்தையோ ஆகுபெயராகக் குறிக்கலாம். இவ்விருந்து சூழலில் ‘உணவு’ என்பது பொருத்தமான இயல்பான தமிழ்; நேரடிப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
