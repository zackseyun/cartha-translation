  edition: WLC
  text: וַ/יִּשָּׂ֨א מַשְׂאֹ֜ת מֵ/אֵ֣ת פָּנָי/ו֮ אֲלֵ/הֶם֒ וַ/תֵּ֜רֶב מַשְׂאַ֧ת בִּנְיָמִ֛ן מִ/מַּשְׂאֹ֥ת כֻּלָּ֖/ם חָמֵ֣שׁ יָד֑וֹת וַ/יִּשְׁתּ֥וּ וַֽ/יִּשְׁכְּר֖וּ עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/034.yaml
  text: He sent portions to them from before him[a], but Benjamin’s portion was five times as much as all of theirs[c][b]. So they drank and became drunk with him.
translation:
  language: ta
  text: அவன் தன் முன்னிருந்த உணவுப் பங்குகளை அவர்களுக்கு அனுப்பினான்[a]. ஆனால் பென்யமீனின் பங்கு அவர்கள் ஒவ்வொருவருடைய பங்கையும்விட ஐந்து மடங்கு அதிகமாக இருந்தது[b]. அவர்கள் அவனோடு குடித்து மதுபோதையடைந்தார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “அவனுடைய முகத்தின் முன்னிலிருந்து”; இது யோசேப்பு அமர்ந்திருந்த இடத்திலிருந்து அல்லது அவனுடைய மேசையிலிருந்து என்பதைக் குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: சொல்லுக்கு சொல், “ஐந்து கைகள்”; இது “ஐந்து மடங்கு” என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: இதை மென்மையாக “மகிழ்ந்தார்கள்” என்றும் மொழிபெயர்க்கலாம்; ஆனால் எபிரெய வினை நேரடியாக மதுபோதையடைவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מַשְׂאֹת
  choice: உணவுப் பங்குகளை ... அனுப்பினான்
  rationale: வினைச்சொல் அடிப்படையில் ‘தூக்கினான்/கொண்டுசென்றான்’ எனப் பொருள்படலாம்; ஆனால் விருந்து சூழலில் மַשְׂאֹת என்பதோடு சேர்ந்து, உணவுப் பங்குகளை விருந்தினர்களுக்கு அனுப்பி வைப்பதைக் குறிக்கிறது.
- source_word: מֵאֵת פָּנָיו
  choice: தன் முன்னிருந்த
  rationale: ‘அவனுடைய முகத்தின் முன்னிலிருந்து’ என்ற எபிரெய உருவகத்தை இயல்பான தமிழில் காத்து, யோசேப்பின் இடத்திலிருந்து பங்குகள் அனுப்பப்பட்டன என்ற பொருளைத் தருகிறது.
- source_word: מַשְׂאַת בִּנְיָמִן
  choice: பென்யமீனின் பங்கு
  rationale: உணவுச் சூழலில் மַשְׂאַת என்பது பரிமாறப்பட்ட உணவுப் பங்கைக் குறிக்கிறது.
- source_word: מִמַּשְׂאֹת כֻּלָּם
  choice: அவர்கள் ஒவ்வொருவருடைய பங்கையும்விட
  rationale: பென்யமீனின் ஒரு பங்கை மற்ற சகோதரர்கள் ஒவ்வொருவருக்கும் கொடுக்கப்பட்ட பங்குடன் ஒப்பிடும் பகிர்ந்தளிப்பு சார்ந்த பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: חָמֵשׁ יָדוֹת
  choice: ஐந்து மடங்கு
  rationale: சொல்லுக்கு சொல் ‘ஐந்து கைகள்’; அளவை ஒப்பிடும் இந்த எபிரெய மரபுத்தொடரின் பொருள் தமிழில் ‘ஐந்து மடங்கு’ என்று இயல்பாக வழங்கப்படுகிறது.
- source_word: וַיִּשְׁתּוּ
  choice: குடித்து
  rationale: விருந்தில் பானம் அருந்தியதை நேரடியாகக் குறிக்கும் எளிய கதை வினைச்சொல்.
- source_word: וַיִּשְׁכְּרוּ
  choice: மதுபோதையடைந்தார்கள்
  rationale: இந்த எபிரெய வினை பொதுவாக மதுவினால் போதையடைவதை நேரடியாகக் குறிக்கிறது; ‘மகிழ்ந்தார்கள்’ என்று மென்மையாக்காமல் மூலத்தின் வலிமையைப் பாதுகாக்கிறது.
- source_word: עִמּוֹ
  choice: அவனோடு
  rationale: சுட்டுப்பெயர் யோசேப்பைக் குறிக்கிறது; மூலத்தின் சுட்டுப்பெயர் வடிவம் தமிழிலும் காக்கப்படுகிறது.
