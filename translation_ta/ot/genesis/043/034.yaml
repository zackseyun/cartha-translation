translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘உணவுப் பங்கு’ விருந்து சூழலைத் தெளிவாக்குகிறது; ‘மதுபோதையடைந்தார்கள்’ என்பது மூல எபிரெயின் நேரடியான பொருளை மென்மையாக்காமல் வழங்குகிறது. அடிக்குறிப்பு குறிகள் அனைத்தும் உரையில் தொடர்புடைய இடங்களில் இடப்பட்டுள்ளன.
