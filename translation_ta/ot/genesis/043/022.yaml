base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/022.yaml
  text: And we have brought down other silver in our hands to buy food[c][b][a]. We do not know who put our silver in our sacks.
translation:
  language: ta
  text: உணவு வாங்குவதற்காக[b], கூடுதல் வெள்ளியை[a] எடுத்துக்கொண்டு கீழே வந்திருக்கிறோம்[c]. எங்கள் வெள்ளியை எங்கள் சாக்குகளில் வைத்தது யார் என்று எங்களுக்குத் தெரியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரண்டு இடங்களிலும் ‘வெள்ளி’ என்பதற்குப் பதிலாக ‘பணம்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய כֶּסֶף என்பது வெள்ளி உலோகத்தையோ பணத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தானியம் வாங்குவதற்காக’; இங்குள்ள வினைச்சொல் தொடர் குறிப்பாகத் தானியம் வாங்குவதைக் குறிக்கலாம். எனினும், பயன்படுத்தப்பட்டுள்ள பெயர்ச்சொல் பொதுவாக ‘உணவு’ என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, ‘எங்கள் கையில்’.
    reason: source_idiom
lexical_decisions:
- source_word: וְ/כֶסֶף אַחֵר
  choice: மேலும் வெள்ளியை
  rationale: כֶּסֶף என்பதன் அடிப்படைப் பொருள் ‘வெள்ளி’; இச்சூழலில் அது பணமாகப் பயன்படுகிறது. אַחֵר இங்கு முன்பு கொண்டுவந்த தொகைக்கு மேலான கூடுதல் தொகையைக் குறிக்கிறது.
- source_word: הוֹרַדְנוּ
  choice: எடுத்துக்கொண்டு கீழே வந்திருக்கிறோம்
  rationale: ירד என்பதன் ஹிஃபில் வடிவம் ‘கீழே கொண்டுவருதல்’ என்று பொருள்படும். கானானிலிருந்து எகிப்துக்குச் செல்வதை ‘கீழே வருதல்’ என்று ஆதியாகமம் கூறும் புவியியல் நோக்கை இயல்பான தமிழில் இவ்வாறு காக்கிறது.
- source_word: בְ/יָדֵ/נוּ
  choice: எடுத்துக்கொண்டு
  rationale: ‘எங்கள் கையில்’ என்ற எபிரெய மரபுத்தொடர் உடைமையில் அல்லது தம்மோடு கொண்டிருப்பதைக் குறிக்கிறது; தமிழில் ‘எடுத்துக்கொண்டு’ என்பது செயலை இயல்பாக வெளிப்படுத்துகிறது. நேரடியான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לִ/שְׁבָּר אֹכֶל
  choice: உணவு வாங்குவதற்காக
  rationale: שׁבר இச்சூழலில் பொருட்களை, குறிப்பாகத் தானியத்தை, வாங்குவதைக் குறிக்கிறது; אֹכֶל என்பது பொதுவாக ‘உணவு’ என்பதால் அகன்ற பொருள் காக்கப்பட்டுள்ளது.
- source_word: לֹא יָדַעְנוּ
  choice: எங்களுக்குத் தெரியாது
  rationale: எபிரெய நிறைவுவினை கடந்த அறியாமையிலிருந்து தொடரும் தற்போதைய நிலையைச் சுட்டலாம்; நேரடியான பேச்சில் தற்போதைய ‘தெரியாது’ இயல்பானது.
- source_word: מִי שָׂם
  choice: வைத்தது யார்
  rationale: מִי மறைமுகக் கேள்வியில் ‘யார்’ என்றும் שׂים இயல்பாக ‘வை’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளன.
- source_word: כַּסְפֵּ/נוּ
  choice: எங்கள் வெள்ளியை
  rationale: வசனத்தில் மீண்டும் வரும் כֶּסֶף என்ற ஒரே சொல்லைத் தெளிவாகக் காட்ட, முதல் நிகழ்வைப் போலவே ‘வெள்ளி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּ/אַמְתְּחֹתֵי/נוּ
  choice: எங்கள் சாக்குகளில்
  rationale: אַמְתַּחַת தானியம் அல்லது உணவுப் பொருட்களை எடுத்துச் செல்லும் சாக்கு அல்லது பையைக் குறிக்கிறது; இக்கதைச்சூழலில் ‘சாக்கு’ துல்லியமும் இயல்பும் உடையது.
