  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதையான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கீழே வந்திருக்கிறோம்’ என்பது கானானிலிருந்து எகிப்துக்கான பயணத்தை எபிரெய உரை வருணிக்கும் திசைநோக்கைக் காக்கிறது; ‘எடுத்துக்கொண்டு’ என்பது தமிழில் இயல்பாக உடைமையையும் கொண்டுவருதலையும் தெரிவிக்கிறது.
