lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: அவரிடம் சென்று
  rationale: נגשׁ என்பது ஒருவரை அணுகுவதைக் குறிக்கிறது. சூழலில் இயல்பான நவீனத் தமிழுக்காக ‘அவரிடம் சென்று’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הָאִישׁ
  choice: அந்த மனிதர்
  rationale: எபிரெய உரை பதவிப் பெயரைப் பயன்படுத்தாமல் ‘அந்த மனிதர்’ என்றே கூறுகிறது; எனவே ‘மேற்பார்வையாளர்’ அல்லது ‘வேலைக்காரர்’ என மாற்றாமல் அதன் பொதுவான சொல்லாட்சி காக்கப்பட்டது.
- source_word: אֲשֶׁר עַל בֵּית יוֹסֵף
  choice: யோசேப்பின் வீட்டுப் பொறுப்பாளராக இருந்த
  rationale: עַל இங்கு அதிகாரத்தையும் நிர்வாகப் பொறுப்பையும் குறிக்கிறது. ‘வீட்டுப் பொறுப்பாளர்’ என்பது கட்டடத்தை மட்டும் அல்லாமல் யோசேப்பின் குடும்ப நிர்வாக அமைப்பையும் கவனித்த பொறுப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: அவரோடு பேசினார்கள்
  rationale: דבר אֶל என்பது ஒருவரிடம் பேசுவதைக் குறிக்கிறது. அடுத்த வசனத்தில் பேச்சின் உள்ளடக்கம் வருவதால், இங்கு ‘பேசினார்கள்’ என்பது பொருத்தமான கதை இணைப்பாக உள்ளது.
- source_word: פֶּתַח הַבָּיִת
  choice: வீட்டின் நுழைவாயிலில்
  rationale: פֶּתַח என்பது திறப்பு, நுழைவிடம் அல்லது வாசலைக் குறிக்கலாம். ‘நுழைவாயில்’ காட்சியின் இடத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; ‘வாசலில்’ என்பது மாற்று வாய்ப்பு.
