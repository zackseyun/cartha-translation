translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடையில் அமைக்கப்பட்டது. ‘அந்த மனிதர்’ என்ற மூல உரையின் பொதுவான அடையாளம் காக்கப்பட்டதுடன், தொடர்புச் சொற்றொடரில் அவரது நிர்வாகப் பொறுப்பு தெளிவாக்கப்பட்டது.
