  text: וַ/יִּשְׁאַ֤ל לָ/הֶם֙ לְ/שָׁל֔וֹם וַ/יֹּ֗אמֶר הֲ/שָׁל֛וֹם אֲבִי/כֶ֥ם הַ/זָּקֵ֖ן אֲשֶׁ֣ר אֲמַרְתֶּ֑ם הַ/עוֹדֶ֖/נּוּ חָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/027.yaml
  text: He asked them about their well-being and said[a], “Is your elderly father, whom you spoke of[b], well? Is he still alive?”
translation:
  language: ta
  text: அவர் அவர்களுடைய நலனை விசாரித்து, “நீங்கள் குறிப்பிட்ட உங்கள் வயதான தந்தை நலமாக இருக்கிறாரா? அவர் இன்னும் உயிரோடு இருக்கிறாரா?” என்று கேட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: அவர் அவர்களுடைய நலனை விசாரித்து
  rationale: שׁאל ... לְשָׁלוֹם என்பது ஒருவருடைய நலத்தைப் பற்றி விசாரிக்கும் எபிரெய வழக்குச் சொற்றொடர். ‘நலனை விசாரித்து’ என்பது அதன் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: הֲשָׁלוֹם
  choice: நலமாக இருக்கிறாரா?
  rationale: שָׁלוֹם இங்கு வெறும் மோதலின்மையை அல்ல, ஒருவரின் பொதுவான நலநிலையைக் குறிக்கிறது. ‘நலமாக’ என்பது உடல்நலத்துக்கு மட்டும் பொருளைச் சுருக்காமல் இந்த விரிவைத் தக்கவைக்கிறது.
- source_word: אֲבִיכֶם הַזָּקֵן
  choice: உங்கள் வயதான தந்தை
  rationale: הַזָּקֵן தந்தையின் முதிர்ந்த வயதைக் குறிக்கிறது. ‘வயதான’ என்பது தெளிவான, மரியாதையான, தற்போதைய தமிழ்நடை.
- source_word: אֲשֶׁר אֲמַרְתֶּם
  choice: நீங்கள் குறிப்பிட்ட
  rationale: சகோதரர்கள் முன்பு தங்கள் தந்தையைப் பற்றிச் சொன்னதைக் குறிக்கும் உறவுநிலைத் தொடர். ‘நீங்கள் குறிப்பிட்ட’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַעוֹדֶנּוּ חָי
  choice: அவர் இன்னும் உயிரோடு இருக்கிறாரா?
  rationale: עוֹד தொடர்நிலையையும் חָי உயிருடன் இருப்பதையும் குறிக்கின்றன. இக்கேள்வியை ‘இன்னும் உயிரோடு இருக்கிறாரா?’ என்பது துல்லியமாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் இருமுறை வரும் שָׁלוֹם என்பதன் நலநிலை சார்ந்த பொருள் ‘நலனை’ மற்றும் ‘நலமாக’ எனத் தக்கவைக்கப்பட்டுள்ளது.
