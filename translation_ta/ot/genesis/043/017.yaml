  text: So the man did as Joseph said[a], and the man brought the men into Joseph’s house.
translation:
  language: ta
  text: அந்த மனிதன் யோசேப்பு சொன்னபடியே செய்தான்; அந்த மனிதர்களை யோசேப்பின் வீட்டிற்குள் அழைத்துச் சென்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עשה என்பது இங்கு கொடுக்கப்பட்ட அறிவுறுத்தலுக்கு இணங்கச் செயல்படுவதைக் குறிக்கிறது; ‘சொன்னபடியே செய்தான்’ என்பது இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: எபிரெய உரை அவரது பணியை ‘மேற்பார்வையாளர்’ அல்லது ‘வேலைக்காரன்’ என்று இவ்வசனத்தில் குறிப்பிடாமல், ‘அந்த மனிதன்’ என்றே கூறுகிறது; ஆகவே மூலத்தின் பொதுவான குறிப்பைத் தக்கவைக்கிறது.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: யோசேப்பு சொன்னபடியே
  rationale: யோசேப்பு கூறிய அறிவுறுத்தலுக்கு முழுமையாக இணங்கியதை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: וַיָּבֵא
  choice: அழைத்துச் சென்றான்
  rationale: בוא என்பதன் ஹிஃபீல் வடிவம் ஒருவரை ஓர் இடத்திற்குக் கொண்டுவருதல் அல்லது அழைத்துச் செல்லுதல் என்ற காரணவினைப் பொருளைக் கொண்டது. தமிழில், செய்பவரின் பார்வையிலிருந்து வீட்டிற்குள் வழிநடத்திச் சென்றதை ‘அழைத்துச் சென்றான்’ இயல்பாகக் காட்டுகிறது.
- source_word: הָאֲנָשִׁים
  choice: அந்த மனிதர்களை
  rationale: மூலம் இவர்களை யோசேப்பின் சகோதரர்கள் என்று இங்கு வெளிப்படையாக அழைக்காமல், பொதுவாக ‘அந்த மனிதர்கள்’ என்று குறிப்பிடுகிறது.
- source_word: בֵּיתָה יוֹסֵף
  choice: யோசேப்பின் வீட்டிற்குள்
  rationale: בֵּיתָה என்பதிலுள்ள திசைகாட்டும் -ָה, வீட்டை நோக்கிய நகர்வைக் குறிக்கிறது; சூழலில் வீட்டினுள் நுழைவது நோக்கமாக இருப்பதால் ‘வீட்டிற்குள்’ பொருத்தமானது.
