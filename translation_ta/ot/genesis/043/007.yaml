  text: וַ/יֹּאמְר֡וּ שָׁא֣וֹל שָֽׁאַל הָ֠/אִישׁ לָ֣/נוּ וּ/לְ/מֽוֹלַדְתֵּ֜/נוּ לֵ/אמֹ֗ר הַ/ע֨וֹד אֲבִי/כֶ֥ם חַי֙ הֲ/יֵ֣שׁ לָ/כֶ֣ם אָ֔ח וַ/נַ֨גֶּד ל֔/וֹ עַל פִּ֖י הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה הֲ/יָד֣וֹעַ נֵדַ֔ע כִּ֣י יֹאמַ֔ר הוֹרִ֖ידוּ אֶת אֲחִי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/007.yaml
  text: They said, “The man questioned us closely about us and about our family, saying, ‘Is your father still alive? Do you have another brother?’ So we told him according to these words. How could we possibly know that he would say, ‘Bring your brother down’?”
translation:
  language: ta
  text: அவர்கள், “அந்த மனிதர் எங்களைப் பற்றியும் எங்கள் குடும்பத்தைப் பற்றியும் தீர விசாரித்து, ‘உங்கள் தந்தை இன்னும் உயிரோடு இருக்கிறாரா? உங்களுக்கு வேறொரு சகோதரன் இருக்கிறானா?’ என்று கேட்டார். அவர் கேட்ட இவற்றுக்கு ஏற்ப நாங்கள் அவரிடம் சொன்னோம். ‘உங்கள் சகோதரனை கீழே அழைத்து வாருங்கள்’ என்று அவர் சொல்வார் என்று எங்களுக்கு எப்படித் தெரிந்திருக்க முடியும்?” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁאוֹל שָׁאַל
  choice: தீர விசாரித்து
  rationale: ஒரே வேர்ச்சொல் மீண்டும் வரும் எபிரெய வலியுறுத்தலை, அந்த மனிதர் விரிவாகவும் கூர்ந்தும் கேட்டார் என்ற இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מוֹלַדְתֵּנוּ
  choice: எங்கள் குடும்பத்தைப் பற்றியும்
  rationale: இங்கு பிறப்பு, வம்சம் அல்லது உறவினர் வட்டத்தைக் குறிக்கும் சொல்லைச் சூழலுக்கேற்ற பொதுவான ‘குடும்பம்’ என வழங்குகிறது; தேவையற்ற வம்சவியல் நுட்பத்தைச் சேர்ப்பதில்லை.
- source_word: עַל־פִּי הַדְּבָרִים הָאֵלֶּה
  choice: அவர் கேட்டவற்றுக்கு ஏற்ப
  rationale: சொல்லுக்குச் சொல் ‘இந்த வார்த்தைகளின்படி’ என்பதன் சூழல்சார் பொருளை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: הֲיָדוֹעַ נֵדַע
  choice: எங்களுக்கு எப்படித் தெரிந்திருக்க முடியும்?
  rationale: முற்றுவினையுடன் அதே வேர்ச்சொல் சேர்ந்து உருவாக்கும் வலியுறுத்தப்பட்ட எதிர்மறை வினாவை இயல்பான தமிழில் காக்கிறது.
- source_word: הוֹרִידוּ
  choice: கீழே கூட்டிக்கொண்டு வாருங்கள்
  rationale: எகிப்தை நோக்கிய புவியியல் இறக்கத்தைக் குறிக்கும் ‘கீழே கொண்டுவருதல்’ என்ற இயக்கத்தைப் பாதுகாக்கிறது.
