translation_notes:
  register: நவீன பொதுத்தமிழில், குடும்ப உரையாடலுக்கேற்ற இயல்பும் வேதாகமக் கதைநடைக்கேற்ற கண்ணியமும் பேணப்பட்டுள்ளன. ‘தகப்பன்’ என்பது நேரடியும் புரிந்துகொள்ள எளிதுமான உறவுமுறைச் சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது; எபிரெயத்தில் இல்லாத ‘இன்னொரு’ என்பது ‘சகோதரன்’ என்பதற்கு முன் சேர்க்கப்படவில்லை.
