translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் அமைக்கப்பட்டுள்ளது. உரையாடலில் ஒருமை கட்டளை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெய மூலத்தின் சுருக்கத்தையும் செயல்வரிசையையும் காத்தபடி, தமிழில் இயல்பாகப் புரிவதற்குத் தேவையான அளவில் மட்டும் வெளிப்படைத்தன்மை சேர்க்கப்பட்டுள்ளது.
