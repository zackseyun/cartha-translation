base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/016.yaml
  text: When Joseph saw Benjamin with them[a], he said to the one over his household, “Bring the men into the house, slaughter an animal, and prepare it[c][b], because the men will eat with me at noon.”
translation:
  language: ta
  text: யோசேப்பு பென்யமீன் அவர்களோடு இருப்பதைக் கண்டபோது, தன் வீட்டுப் பொறுப்பாளரிடம்[a], “இந்த ஆட்களை வீட்டுக்குள் கொண்டுபோ; ஓர் மிருகத்தை அறுத்து[b], உணவைத் தயாரி. ஏனெனில் இவர்கள் நண்பகலில்[c] என்னோடு உண்பார்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அவனுடைய வீட்டின்மேல் இருந்தவரிடம்”; அதாவது, அவனுடைய வீட்டைப் பொறுப்பேற்று நிர்வகித்தவரிடம்.'
    reason: lexical_alternative
  - marker: b
    text: “அறுத்தலை அறு” என்பது எபிரெய மரபுத்தொடர்; உணவுக்காக ஒரு மிருகத்தை அறுத்து ஆயத்தப்படுத்துவதைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது “மதியத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא ... אִתָּם אֶת־בִּנְיָמִין
  choice: அவர்களோடு பென்யமீன் இருப்பதைக் கண்டபோது
  rationale: ראה என்பது இங்கு நேரடியான பார்வையையும் கவனித்தறிதலையும் குறிக்கிறது; אִתָּם பென்யமீன் சகோதரர்களுடன் இருந்ததைத் தெளிவுபடுத்துகிறது.
- source_word: לַאֲשֶׁר עַל־בֵּיתוֹ
  choice: தன் வீட்டுப் பொறுப்பாளரிடம்
  rationale: சொல்லுக்குச் சொல் அமைப்பான ‘தன் வீட்டின்மேல் இருந்தவர்’ என்பதை இயல்பான நவீன தமிழில், பதவியை மிகையாக வரையறுக்காமல் தெரிவிக்கிறது.
- source_word: הָבֵא אֶת־הָאֲנָשִׁים הַבָּיְתָה
  choice: இந்த மனிதர்களை வீட்டுக்குள் அழைத்துச் செல்
  rationale: திசை குறிக்கும் הָ- இறுதி வீட்டின் உட்புறத்தை நோக்கிய நகர்வைக் காட்டுகிறது. சூழலில் சுட்டப்படும் ஆட்களைத் தமிழில் இயல்பாகக் குறிக்க ‘இந்த மனிதர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וּטְבֹחַ טֶבַח
  choice: ஓர் மிருகத்தை அறுத்து
  rationale: வினை-பெயர் இணைப்பான எபிரெய மரபுத்தொடர் உணவுக்காக ஒரு மிருகத்தை அறுப்பதைக் குறிக்கிறது; மிருகத்தின் இனத்தை மூலவசனம் குறிப்பிடாததால் அது பொதுவாகவே வைக்கப்பட்டுள்ளது.
- source_word: וְהָכֵן
  choice: உணவை ஆயத்தப்படுத்து
  rationale: כון என்பதன் ஹிஃபில் கட்டளை வடிவம் ‘ஆயத்தப்படுத்து’ எனப் பொருள்படும். முந்தைய அறுத்தல் கட்டளையின் உணவு நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்த ‘உணவை’ சேர்க்கப்பட்டுள்ளது.
- source_word: כִּי אִתִּי יֹאכְלוּ הָאֲנָשִׁים
  choice: ஏனெனில் இவர்கள் ... என்னோடு உண்பார்கள்
  rationale: כִּי முந்தைய கட்டளைகளுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; ‘என்னோடு உண்பார்கள்’ என்பது எளிய, நேரடியான தமிழாக்கம்.
- source_word: בַּצָּהֳרָיִם
  choice: நண்பகலில்
  rationale: இந்தச் சொல் மதிய நேரத்தை, குறிப்பாக நண்பகலைக் குறிக்கிறது; ‘நண்பகலில்’ துல்லியமும் இயல்பும் கொண்டது.
