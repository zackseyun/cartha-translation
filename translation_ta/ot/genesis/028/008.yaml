  text: וַ/יַּ֣רְא עֵשָׂ֔ו כִּ֥י רָע֖וֹת בְּנ֣וֹת כְּנָ֑עַן בְּ/עֵינֵ֖י יִצְחָ֥ק אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/008.yaml
  text: And Esau saw that the daughters of Canaan were evil in the eyes of Isaac his father[a].
translation:
  language: ta
  text: கானானின் மகள்கள் தன் தந்தையான ஈசாக்கின் பார்வையில் விரும்பத்தகாதவர்களாக இருந்ததை ஏசா கண்டான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் தந்தையான ஈசாக்கின் பார்வையில் கெட்டவர்களாக இருந்தார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயப் பெயரடை “கெட்ட” அல்லது “தீய” என்றும் பொருள்படும்; ஆனால் இச்சூழலில் கானானியப் பெண்களைத் திருமணத் துணைகளாக ஈசாக்கு விரும்பாததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டான்
  rationale: ראה என்பதன் வழக்கமான பொருளான ‘கண்டான்’ என்பதைக் காக்கிறது; இச்சூழலில் பார்த்து உணர்ந்தான் என்ற உட்பொருளை வாசகர் அறிந்துகொள்ள முடியும்.
- source_word: עֵשָׂו
  choice: ஏசா
  rationale: தமிழ் வேதாகம மரபில் நன்கு அறியப்பட்ட பெயர் வடிவம்.
- source_word: כִּי
  choice: …இருந்ததை
  rationale: ஏசா கண்டறிந்த செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் உருபாக இங்கு வருகிறது; காரணத்தைக் குறிக்கவில்லை.
- source_word: רָעוֹת
  choice: தீயவர்களாக
  rationale: ‘தீய/கெட்ட’ எனப் பொருள்படும் எபிரெயப் பெயரடையை நேரடியாகப் பிரதிபலிக்கிறது; இங்கு அது திருமணத் துணைகளாக அவர்களை ஈசாக்கு ஏற்றுக்கொள்ளவில்லை என்பதைக் சூழலில் குறிக்கலாம்.
- source_word: בְּנוֹת כְּנָעַן
  choice: கானானின் மகள்கள்
  rationale: எபிரெய மொழியின் குடும்ப-இன அடையாளமுள்ள சொல்லமைப்பை இயல்பான தமிழில் நெருக்கமாகக் காக்கிறது.
- source_word: בְּעֵינֵי
  choice: பார்வையில்
  rationale: ஒருவரின் மதிப்பீட்டில் அல்லது கருத்தில் என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கு இயல்பான தமிழ் இணை.
- source_word: יִצְחָק אָבִיו
  choice: தன் தந்தை ஈசாக்கு
  rationale: ‘அவனுடைய தந்தை ஈசாக்கு’ என்ற உறவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; ‘தன்’ என்பது ஏசாவையே சுட்டுகிறது.
