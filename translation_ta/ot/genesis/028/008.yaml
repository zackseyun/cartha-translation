translation_notes:
  register: நவீனத் தரத் தமிழில், மூலத்தின் ‘பார்வையில்’ என்ற மதிப்பீட்டு மரபுத்தொடரையும் ‘கானானின் மகள்கள்’ என்ற இன-குடும்பச் சொல்லமைப்பையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
