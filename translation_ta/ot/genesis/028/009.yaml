revisions:
- from: ஆகவே ஏசா இஸ்மவேலிடம் சென்று, ஆபிரகாமின் மகனான இஸ்மவேலின் மகளும் நெபாயோத்தின் சகோதரியுமான மகலாத்தைத் தன் மனைவிகளோடு கூடுதலாகத்[a] தனக்கு மனைவியாக எடுத்துக்கொண்டான்.
  to: ஏசா இஸ்மவேலிடம் சென்று, ஆபிரகாமின் மகனான இஸ்மவேலின் மகளும் நெபாயோத்தின் சகோதரியுமான மகலாத்தைத் தன் மனைவிகளுக்கு மேலும்[a], தனக்கு மனைவியாக எடுத்துக்கொண்டான்.
  rationale: The revision removes an unnecessarily causal connective, improves the placement and naturalness of the additive phrase, and clarifies the footnote’s alternative without altering the verse’s meaning or its non-evaluative description of plural marriage.
  reviewer_model: gpt-5.6-terra
