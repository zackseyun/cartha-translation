  text: וַ/יֵּ֥לֶךְ עֵשָׂ֖ו אֶל יִשְׁמָעֵ֑אל וַ/יִּקַּ֡ח אֶֽת מָחֲלַ֣ת בַּת יִשְׁמָעֵ֨אל בֶּן אַבְרָהָ֜ם אֲח֧וֹת נְבָי֛וֹת עַל נָשָׁ֖י/ו ל֥/וֹ לְ/אִשָּֽׁה־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/009.yaml
  text: So Esau went to Ishmael and took Mahalath[a], the daughter of Ishmael son of Abraham, the sister of Nebaioth, as a wife for himself in addition to his wives.
translation:
  language: ta
  text: ஏசா இஸ்மவேலிடம் சென்று, ஆபிரகாமின் மகனான இஸ்மவேலின் மகளும் நெபாயோத்தின் சகோதரியுமான மகலாத்தைத் தன் மனைவிகளுக்கு மேலும்[a], தனக்கு மனைவியாக எடுத்துக்கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் மனைவிகளுக்கு மேலாக.” எபிரெயச் சொற்றொடர், மகலாத் ஏசாவுக்கு ஏற்கெனவே இருந்த மனைவிகளுக்குப் பதிலாக அல்லாமல், அவர்களுக்கு மேலும் ஒரு மனைவியாக எடுத்துக்கொள்ளப்பட்டாள் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: சென்று
  rationale: הלך என்பதன் தொடர்கதை வடிவம் அடுத்த செயலைக் குறிக்கிறது; தமிழ் வாக்கியத்தில் அடுத்த வினையுடன் இயல்பாக இணைக்க வினையெச்சம் பயன்படுத்தப்பட்டது.
- source_word: אֶל יִשְׁמָעֵאל
  choice: இஸ்மவேலிடம்
  rationale: ஒரு நபரை நோக்கிய செல்வதைக் குறிக்கும் אֶל என்பதற்கு ‘-இடம்’ இயல்பான தமிழ் இணை.
- source_word: וַיִּקַּח
  choice: எடுத்துக்கொண்டான்
  rationale: לקח என்பதன் அடிப்படைப் பொருளான ‘எடுத்தல்’ காக்கப்படுகிறது; தொடர்ந்து வரும் ‘மனைவியாக’ என்ற சொற்றொடர் திருமணப் பொருளைத் தெளிவாக்குகிறது.
- source_word: מָחֲלַת
  choice: மகலாத்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: בַּת יִשְׁמָעֵאל בֶּן אַבְרָהָם
  choice: ஆபிரகாமின் மகனான இஸ்மவேலின் மகள்
  rationale: மகலாத்தின் வம்ச உறவை எபிரெய கட்டமைப்பின்படி தெளிவாகக் காட்டுகிறது.
- source_word: אֲחוֹת נְבָיוֹת
  choice: நெபாயோத்தின் சகோதரி
  rationale: மகலாத்தை மேலும் அடையாளப்படுத்தும் இணைப்புச் சொற்றொடரின் நேரடியான மொழிபெயர்ப்பு.
- source_word: עַל נָשָׁיו
  choice: தன் மனைவிகளோடு கூடுதலாக
  rationale: இங்கு עַל இடநிலையை அல்ல, ஏற்கெனவே இருந்த மனைவிகளுடன் இன்னொரு மனைவி சேர்க்கப்பட்டதைக் குறிக்கிறது.
- source_word: לוֹ לְאִשָּׁה
  choice: தனக்கு மனைவியாக
  rationale: திருமணத்தின் நோக்கத்தையும் לוֹ என்பதிலுள்ள தனக்குரிய உறவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
