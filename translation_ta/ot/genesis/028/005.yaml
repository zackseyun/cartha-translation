translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மூலத்தின் உறவுமுறைத் தகவல்கள் அனைத்தும் தக்கவைக்கப்பட்டுள்ளன; நீண்ட அடுக்குத் தொடரை இயல்பான தமிழுக்காக இரண்டு வாக்கியங்களாகப் பிரித்துள்ளோம்.
