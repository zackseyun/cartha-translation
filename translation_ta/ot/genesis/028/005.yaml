source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יִצְחָק֙ אֶֽת יַעֲקֹ֔ב וַ/יֵּ֖לֶךְ פַּדֶּ֣נָֽ/ה אֲרָ֑ם אֶל לָבָ֤ן בֶּן בְּתוּאֵל֙ הָֽ/אֲרַמִּ֔י אֲחִ֣י רִבְקָ֔ה אֵ֥ם יַעֲקֹ֖ב וְ/עֵשָֽׂו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/005.yaml
  text: So Isaac sent Jacob away[a], and he went to Paddan-aram, to Laban son of Bethuel the Aramean, the brother of Rebekah, the mother of Jacob and Esau.
translation:
  language: ta
  text: அப்போது ஈசாக்கு யாக்கோபை அனுப்பிவைத்தார்; அவன் பதான்-அராமுக்கு, அரமேயனான பெத்துவேலின் மகனும் ரெபெக்காளின் சகோதரனுமான லாபானிடம் சென்றான். ரெபெக்காள் யாக்கோபுக்கும் ஏசாவுக்கும் தாய்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பிவைத்தார்
  rationale: இச்சூழலில் שׁלח என்பது ஒருவரை ஒரு பயணத்திற்காக அனுப்புவதைக் குறிக்கிறது. இயல்பான தமிழில் ‘அனுப்பிவைத்தார்’ என்பது அனுப்பிய செயலையும் அவர் புறப்பட்டுச் சென்றதையும் பொருத்தமாக உணர்த்துகிறது.
- source_word: וַיֵּלֶךְ
  choice: போனான்
  rationale: הלך என்பதன் அடிப்படைப் பொருள் ‘போ’. எபிரெய மொழியின் தொடர்நிகழ்வைத் தமிழில் இயல்பான இறந்தகால வினையால் வெளிப்படுத்துகிறது.
- source_word: פַּדֶּנָה אֲרָם
  choice: பதான்-அராமிலிருந்த
  rationale: இது மொழிபெயர்க்கப்பட வேண்டிய பொதுப்பெயர் அல்ல, இடப்பெயர். திசையைக் குறிக்கும் இறுதிவிகுதி, லாபான் அங்கே இருந்தார் என்ற தமிழ் வாக்கிய அமைப்பில் ‘-இலிருந்த’ என இயல்பாக வெளிப்படுகிறது.
- source_word: בֶּן בְּתוּאֵל
  choice: பெத்துவேலின் மகன்
  rationale: தந்தை–மகன் உறவைக் குறிக்கும் எபிரெய இணைப்பின் நேரடியும் இயல்புமான தமிழ் வடிவம்.
- source_word: הָאֲרַמִּי
  choice: அரமேயன்
  rationale: אֲרַמִּי என்பது வரலாற்று-இன அடையாளமாக ‘அரமேயன்’ என்பதையே குறிப்பாகக் குறிக்கிறது; பழைய மரபிலுள்ள ‘சீரியன்’ என்பதைவிட இது மூலத்திற்குத் துல்லியமானது.
- source_word: אֲחִי רִבְקָה
  choice: ரெபெக்காளின் சகோதரன்
  rationale: எபிரெய உறவுமுறைச் சொல்லை நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: אֵם יַעֲקֹב וְעֵשָׂו
  choice: ரெபெக்காள் யாக்கோபுக்கும் ஏசாவுக்கும் தாய்
  rationale: ரெபெக்காளை மீண்டும் வெளிப்படையாக அடையாளப்படுத்தும் மூலத்தின் விளக்கத் தன்மையைத் தக்கவைக்கிறது; தனி வாக்கியமாக்குவது நீண்ட தமிழ் வாக்கியத்தைத் தவிர்த்து தெளிவை மேம்படுத்துகிறது.
