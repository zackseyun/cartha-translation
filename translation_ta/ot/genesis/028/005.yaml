revisions:
- from: எனவே ஈசாக்கு யாக்கோபை அனுப்பிவைத்தார்; அவன் பதான்-அராமிலிருந்த, அரமேயனான[a] பெத்துவேலின் மகனும் ரெபெக்காளின் சகோதரனுமான லாபானிடம் போனான். ரெபெக்காள் யாக்கோபுக்கும் ஏசாவுக்கும் தாய்.
  to: அப்போது ஈசாக்கு யாக்கோபை அனுப்பிவைத்தார்; அவன் பதான்-அராமுக்கு, அரமேயனான பெத்துவேலின் மகனும் ரெபெக்காளின் சகோதரனுமான லாபானிடம் சென்றான். ரெபெக்காள் யாக்கோபுக்கும் ஏசாவுக்கும் தாய்.
  rationale: 'The revision restores Paddan-aram as the destination of Jacob’s journey and preserves all source relationships: Laban is Bethuel’s son and Rebekah’s brother; Rebekah is Jacob and Esau’s mother. The footnote is retained because it accurately documents the historical lexical alternative for ‘Aramean.’'
