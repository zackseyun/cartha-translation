base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/020.yaml
  text: Then Jacob made a vow[a], saying, “If God will be with me and will keep me on this way that I am going[d][c][b], and will give me bread to eat and clothing to wear,”
translation:
  language: ta
  text: அப்போது யாக்கோபு ஒரு நேர்த்திக்கடன் செய்து, “கடவுள் என்னோடு இருந்து, நான் போகிற இந்தப் பயணத்தில் என்னைக் காத்து, உண்பதற்கு அப்பமும் உடுத்துவதற்கு உடையும் எனக்குத் தந்தால்,” என்று சொன்னான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּדַּר יַעֲקֹב נֶדֶר
  choice: யாக்கோபு ஒரு நேர்த்திக்கடன் செய்து
  rationale: נדר என்ற வினையும் அதன் தொடர்புடைய பெயர்ச்சொல்லும் சேர்ந்து ஒரு முறையான உறுதிமொழியைச் சுட்டுகின்றன. நவீனத் தமிழில் ‘ஒரு நேர்த்திக்கடன் செய்து’ என்பது அந்தச் solemn vow-ஐ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֵאמֹר
  choice: என்று சொன்னான்
  rationale: நேர்த்திக்கடனின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரேயக் கூறை இயல்பான தமிழ் நேர்கூற்றுத் தொடராக வழங்குகிறது.
- source_word: אִם
  choice: தந்தால்
  rationale: எபிரேய நிபந்தனை முழுத் தொடரையும் தமிழின் ‘-ஆல்’ நிபந்தனை வடிவில் வைத்துள்ளது; இதனால் யாக்கோபின் சொல்லில் உள்ள நிபந்தனையும் இறையியல் பதற்றமும் தீர்க்கப்படாமல் நீடிக்கின்றன.
- source_word: אֱלֹהִים עִמָּדִי
  choice: கடவுள் என்னோடு இருந்து
  rationale: முந்தைய சூழலில் யாக்கோபுக்குத் தோன்றிய ஒரே கடவுளைக் குறிக்கிறது; உடனிருப்பை நேரடியாகக் கூறுகிறது.
- source_word: וּשְׁמָרַנִי
  choice: என்னைக் காத்து
  rationale: שׁמר என்பதன் காக்குதல், பாதுகாத்தல், கண்காணித்தல் ஆகிய பொருள் வட்டத்தை இயல்பான தமிழில் ‘காத்து’ சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: בַּדֶּרֶךְ הַזֶּה אֲשֶׁר אָנֹכִי הוֹלֵךְ
  choice: நான் போகிற இந்தப் பயணத்தில்
  rationale: דרך என்பதன் நேரடி ‘வழி’ உணர்வையும் சூழலிலுள்ள பயணக் கருத்தையும் இணைத்து, தொடர்புச் சொல்லை இயல்பான தமிழில் காக்கிறது.
- source_word: וְנָתַן לִי לֶחֶם לֶאֱכֹל
  choice: உண்பதற்கு உணவும் எனக்குத் தந்தால்
  rationale: לֶחֶם நேரடியாக ‘அப்பம்’ என்றாலும் இங்கு வாழ்வாதார உணவை விரிவாகக் குறிக்க இயலும். தமிழில் ‘உண்பதற்கு அப்பம்’ என்பதைக் காட்டிலும் ‘உண்பதற்கு உணவு’ இயல்பாகவும் பொருளுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: וּבֶגֶד לִלְבֹּשׁ
  choice: உடுத்துவதற்கு உடையும்
  rationale: உடை மற்றும் அதை அணியும் நோக்கம் ஆகிய இரண்டையும் எளிய, நேரடி தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: யாக்கோபின் நேர்த்திக்கடனிலுள்ள நிபந்தனையின் தன்மை
  choice: தமிழின் ‘-ஆல்’ நிபந்தனை வடிவில் நேரடியாக வழங்கப்பட்டது.
  alternative: ‘கடவுள் என்னோடு இருப்பதால்’ அல்லது ‘கடவுள் என்னோடு இருக்கும்போது’ என்று உறுதியாக்குதல்
  rationale: אִם இயல்பாக நிபந்தனையை அறிமுகப்படுத்துகிறது. யாக்கோபு ஐயத்தோடா நம்பிக்கையோடா பேசுகிறான் என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல், மூலத்தின் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகருக்குப் புரியும் வகையில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டது. வசனம் அடுத்த வசனத்தில் நிறைவடையும் நிபந்தனை வாக்கியத்தின் முதல் பகுதி என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
