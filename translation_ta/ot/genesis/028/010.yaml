  text: וַ/יֵּצֵ֥א יַעֲקֹ֖ב מִ/בְּאֵ֣ר שָׁ֑בַע וַ/יֵּ֖לֶךְ חָרָֽנָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/010.yaml
  text: Jacob departed from Beersheba and went to Haran[a].
translation:
  language: ta
  text: யாக்கோபு பெயர்செபாவிலிருந்து புறப்பட்டு, ஆரானை நோக்கிச் சென்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஆரானை நோக்கி”; “ஆரான்” என்ற பெயருடன் திசையைக் குறிக்கும் பின்னொட்டு உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: புறப்பட்டு
  rationale: יצא என்பது ஓர் இடத்திலிருந்து வெளியேறுவதையோ புறப்படுவதையோ குறிக்கிறது. இங்கு பயணச் சூழலில் ‘புறப்பட்டு’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יַעֲקֹב
  choice: யாக்கோபு
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் இப்பெயரின் நிலையான வடிவம்.
- source_word: מִבְּאֵר שָׁבַע
  choice: பெயர்செபாவிலிருந்து
  rationale: מִן மூல இடத்தைக் குறிக்கிறது; בְּאֵר שֶׁבַע என்ற இடப்பெயருக்கு தமிழில் வழக்கமான வடிவம் ‘பெயர்செபா’.
- source_word: וַיֵּלֶךְ
  choice: சென்றார்
  rationale: הלך என்பதன் பொதுவான பொருள் ‘செல்’. ‘சென்றார்’ என்பது கூடுதல் பயண நுணுக்கத்தைச் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கிறது.
- source_word: חָרָנָה
  choice: ஆரானை நோக்கி
  rationale: இடப்பெயருடன் சேர்ந்துள்ள திசைகாட்டும் ־ָה பின்னொட்டு ஆரானை நோக்கிய இயக்கத்தைக் காட்டுகிறது. சென்றடைந்ததைத் தெளிவாகக் கூறாமல் அந்தத் திசை நுணுக்கத்தை இவ்வடிவம் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மரியாதைப் பன்மை வினைமுற்று தமிழ் வேதாகம நடைக்கு இயல்பாக அமைந்துள்ளது; எபிரெய உரையின் திசை நுணுக்கம் முதன்மை உரையிலும் அடிக்குறிப்பிலும் காக்கப்பட்டுள்ளது.
