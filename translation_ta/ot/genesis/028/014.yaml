  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הָיָ֤ה זַרְעֲ/ךָ֙ כַּ/עֲפַ֣ר הָ/אָ֔רֶץ וּ/פָרַצְתָּ֛ יָ֥מָּ/ה וָ/קֵ֖דְמָ/ה וְ/צָפֹ֣נָ/ה וָ/נֶ֑גְבָּ/ה וְ/נִבְרֲכ֥וּ בְ/ךָ֛ כָּל מִשְׁפְּחֹ֥ת הָ/אֲדָמָ֖ה וּ/בְ/זַרְעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/014.yaml
  text: Your offspring will be like the dust of the earth[a], and you will spread out to the west and to the east and to the north and to the south; and in you and in your offspring all the families of the earth will be blessed.
translation:
  language: ta
  text: உன் சந்ததி பூமியின் புழுதியைப் போல இருக்கும். நீ மேற்கேயும் கிழக்கேயும் வடக்கேயும் தெற்கேயும் பரவுவாய். உன்னிலும் உன் சந்ததியிலும் பூமியிலுள்ள எல்லாக் குடும்பங்களும் ஆசீர்வதிக்கப்படும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன்னிலும் உன் சந்ததியிலும் பூமியிலுள்ள எல்லாக் குடும்பங்களும் தங்களை ஆசீர்வதித்துக்கொள்வார்கள்.’ எபிரெய வினைச்சொல்லைத் தற்சுட்டு அல்லது இடைநிலைப் பொருளிலும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: இருக்கும்
  rationale: வாக்குறுதியின் சூழலில் இந்த வினை வடிவம் எதிர்காலப் பொருள் தருகிறது; ‘இருக்கும்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: זַרְעֲךָ
  choice: உன் சந்ததி
  rationale: זֶרַע என்பது ஒருமை வடிவிலுள்ள கூட்டுப்பெயராக வழித்தோன்றல்களைக் குறிக்கிறது. ‘சந்ததி’ அந்தக் கூட்டொருமையைக் காத்து, ‘விதை’ என்ற சொற்பொருள் மொழிபெயர்ப்பால் ஏற்படும் தெளிவின்மையைத் தவிர்க்கிறது.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: பூமியின் புழுதியைப் போல
  rationale: எண்ணிலடங்காத பெருக்கைக் குறிக்கும் உவமையை இயல்பாகவும், மூலத்தின் பூமி/புழுதி உருவகத்தை நெருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: וּפָרַצְתָּ
  choice: பரவுவாய்
  rationale: פרץ என்பதன் அடிப்படை உருவகம் எல்லைகளை உடைத்துக்கொண்டு விரிவதைச் சுட்டுகிறது. நான்கு திசைகள் குறிப்பிடப்படும் இச்சூழலில் ‘பரவுவாய்’ புவியியல் விரிவைத் தெளிவாகக் கூறுகிறது.
- source_word: יָמָּה וָקֵדְמָה וְצָפֹנָה וָנֶגְבָּה
  choice: மேற்கேயும் கிழக்கேயும் வடக்கேயும் தெற்கேயும்
  rationale: திசைநோக்கிய நகர்வைக் காட்டும் எபிரெய வடிவங்களைத் தமிழின் ‘-ஏயும்’ அமைப்பு இயல்பாக எடுத்துரைக்கிறது; இத்தொடரில் נֶגֶב தெற்கைக் குறிக்கிறது.
- source_word: וְנִבְרֲכוּ
  choice: ஆசீர்வதிக்கப்படும்
  rationale: Niphal வடிவத்தை வினைப்பாட்டு அல்லாத செயப்பாட்டு அர்த்தத்தில் எடுத்துக்கொண்டு, முற்பிதாக்களுக்கான வாக்குறுதி சூழலில் ‘will be blessed’ என்ற பொருளை வழங்குகிறது. உண்மையான தற்சுட்டு/இடைநிலை வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בְךָ
  choice: உன்னிலும்
  rationale: בְּ என்ற முன்னிடைச்சொல்லின் ‘in’ உறவை நெருக்கமாகக் காக்கிறது; ‘உன் மூலமாக’ என்று காரணவழிப் பொருளை மட்டும் தீர்மானித்துவிடவில்லை.
- source_word: כָּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: பூமியிலுள்ள எல்லாக் குடும்பங்களும்
  rationale: מִשְׁפָּחוֹת குறிக்கும் குடும்ப/குலக் குழுக்களை ‘குடும்பங்கள்’ பொதுவாசகருக்கு இயல்பாகத் தருகிறது; இவ்வுலகளாவிய வாக்குறுதியில் הָאֲדָמָה-வை ‘பூமி’ என வழங்குகிறது.
- source_word: וּבְזַרְעֶךָ
  choice: உன் சந்ததியிலும்
  rationale: மீண்டும் வரும் בְּ முன்னிடைச்சொல்லையும் זֶרַע என்பதன் கூட்டொருமையையும் காக்கிறது; சந்ததி ஒருவரா பலரா என்பதை மொழிபெயர்ப்பில் தேவையின்றித் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: முற்பிதாக்களுக்கான ஆசீர்வாத வாக்குறுதியில் Niphal வடிவிலுள்ள ברך என்பதன் பொருள்
  choice: 'செயப்பாட்டு: ‘பூமியிலுள்ள எல்லாக் குடும்பங்களும் ஆசீர்வதிக்கப்படும்’'
  alternative: 'தற்சுட்டு/இடைநிலை: ‘பூமியிலுள்ள எல்லாக் குடும்பங்களும் தங்களை ஆசீர்வதித்துக்கொள்வார்கள்’'
  rationale: உடன்படிக்கை வாக்குறுதியின் சூழலில் செயப்பாட்டுப் பொருள் நேரடியானதும் நன்கு பொருந்துவதுமாக உள்ளது. எனினும் எபிரெய வடிவுக்கு தற்சுட்டு அல்லது இடைநிலைப் பொருளும் சாத்தியமாதலால், ஆசீர்வாதம் எவ்வாறு நிகழ்கிறது என்ற இறையியல் அழுத்தத்தை ஒருதலைப்பட்சமாக முடிவுசெய்யாமல் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘சந்ததி’ கூட்டொருமையைப் பேணுகிறது; ‘பரவுவாய்’ புவியியல் விரிவைத் தெளிவாக்குகிறது. உண்மையான எபிரெய இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
