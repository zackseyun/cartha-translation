base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/021.yaml
  text: and I return in peace to my father's house[a], and Yahweh will be my God.
translation:
  language: ta
  text: நான் நலமுடன் என் தந்தையின் வீட்டுக்குத் திரும்பி வந்தால்[a], யாவே எனக்குத் தேவனாயிருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நலமுடன்’ என்பதை ‘பாதுகாப்பாக’ அல்லது ‘சமாதானத்துடன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பாதுகாப்பு, நல்வாழ்வு, முழுநலம் ஆகிய கருத்துகளையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: நான் ... திரும்பி வந்தால்
  rationale: שׁוב என்பதன் பொருள் ‘திரும்புதல்.’ முந்தைய வசனத்தில் தொடங்கும் யாக்கோபின் நிபந்தனை வாக்கியத்தைத் தமிழில் இயல்பாகத் தொடர, நிபந்தனை விகுதி பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְשָׁלוֹם
  choice: நலமுடன்
  rationale: שָׁלוֹם என்பது சமாதானம் மட்டுமல்லாமல் பாதுகாப்பு, நல்வாழ்வு, முழுநலம் ஆகியவற்றையும் உள்ளடக்குகிறது. இச்சூழலில் ‘நலமுடன்’ என்பது பாதுகாப்பான திரும்புதலையும் பரந்த நலநிலையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶל בֵּית אָבִי
  choice: என் தந்தையின் வீட்டுக்கு
  rationale: குடும்பத்தையும் தந்தையின் இல்லத்தையும் குறிக்கும் எளிய, இயல்பான நவீனத் தமிழ் மொழிபெயர்ப்பு.
- source_word: וְהָיָה
  choice: '... ஆயிருப்பார்'
  rationale: இங்கு היה, முன் கூறப்பட்ட நிபந்தனையின் விளைவாக யாவே யாக்கோபுக்குத் தேவனாக இருப்பதைக் குறிக்கிறது. தமிழ் வாக்கிய அமைப்பில் இந்த உறவு இயல்பாக வெளிப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலுக்கு வெளிப்படுத்தப்பட்ட இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לִי לֵאלֹהִים
  choice: எனக்குத் தேவனாயிருப்பார்
  rationale: எபிரெய மொழியின் ‘எனக்கு தேவனாக இருப்பார்’ என்ற உடன்படிக்கை சார்ந்த உறவையும் பற்றுறுதியையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: யாக்கோபின் சொல் யாவேயை நிபந்தனையுடன் ஏற்றுக்கொள்வதைக் குறிக்கிறதா, அல்லது அவரை ஏற்றுக்கொள்ளும் நேரடியான பொருத்தனையா?
  choice: முந்தைய வசனங்களில் தொடங்கிய நிபந்தனை–விளைவு அமைப்பைத் தக்கவைத்து, ‘திரும்பி வந்தால் ... தேவனாயிருப்பார்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘திரும்பி வருவேன்; யாவே எனக்குத் தேவனாயிருப்பார்’ என்று நிபந்தனைத் தொடர்பை மங்கச் செய்தல்.
  rationale: எபிரெய வாக்கியத் தொடர் யாக்கோபின் பொருத்தனையில் உள்ள நிபந்தனை அமைப்பின் தொடர்ச்சியாக இயல்பாக வாசிக்கப்படுகிறது. அதன் இறையியல் பதற்றத்தை விளக்கித் தீர்க்காமல் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘யாவே’ என்பது יהוה என்ற இறைத் திருப்பெயரின் ஒலிபெயர்ப்பு. அடிக்குறிப்பு குறியீடு மூலவாக்கியத்தில் சேர்க்கப்பட்டுள்ளது.
