translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. இடத்தைக் குறிக்கும் சொல்லின் மீளுரையும் மூலத்தின் கதைக் கவனமும் பேணப்பட்டுள்ளன; எபிரெயத்தில் உள்ள கற்களின் எண்ணிக்கை மற்றும் கல் வைக்கப்பட்ட இடம் குறித்த நுண்ணிய தெளிவின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
