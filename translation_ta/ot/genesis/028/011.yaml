  source_fidelity: 'மூல எபிரெயத்தின் நிகழ்வுவரிசையும் பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: இடத்தை அடைதல், சூரிய மறைவினால் இரவு தங்குதல், அங்குள்ள கற்களில் ஒன்றை எடுத்தல், அதைத் தலைக்கு அடியில் வைத்தல், அந்த இடத்தில் படுத்துக்கொள்ளல் ஆகியவை அனைத்தும் முறையாக வெளிப்படுகின்றன. מִן உடனான பன்மை ‘கற்கள்’ மற்றும் מְרַאֲשֹׁתָיו தொடர்பான நுண்ணிய தெளிவின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.'
