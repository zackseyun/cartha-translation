source:
  edition: WLC
  text: וַ/יִּפְגַּ֨ע בַּ/מָּק֜וֹם וַ/יָּ֤לֶן שָׁם֙ כִּי בָ֣א הַ/שֶּׁ֔מֶשׁ וַ/יִּקַּח֙ מֵ/אַבְנֵ֣י הַ/מָּק֔וֹם וַ/יָּ֖שֶׂם מְרַֽאֲשֹׁתָ֑י/ו וַ/יִּשְׁכַּ֖ב בַּ/מָּק֥וֹם הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/011.yaml
  text: He came to a certain place and spent the night there[a], because the sun had set. He took one of the stones of the place, put it under his head[c][b], and lay down in that place.
translation:
  language: ta
  text: அவர் ஓர் இடத்தை அடைந்து[a], சூரியன் மறைந்துவிட்டதால் அங்கே இரவைக் கழித்தார். அந்த இடத்திலிருந்த கற்களில் ஒன்றை[b] எடுத்து, தன் தலைக்கு அடியில்[c] வைத்தார்; அந்த இடத்திலேயே படுத்துக்கொண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் முதல் குறிப்பிலேயே ‘அந்த இடம்’ என்று உள்ளது. தமிழில் இயல்பாக இருக்கவும், பின்னர் அந்த இடம் முக்கியத்துவம் பெறுவதை மறைக்காமல் இருக்கவும் ‘ஓர் இடம்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அந்த இடத்திலிருந்த சில கற்களை.’ எபிரெயத் தொடர் பன்மையான ‘கற்கள்’ என்பதிலிருந்து எடுத்ததைக் குறிக்கிறது; அது ஒரு கல்லையோ சில கற்களையோ குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, ‘தன் தலைப்பக்கத்தில்.’ எபிரெயச் சொல் தலை இருக்கும் பகுதியையோ தலைத்தாங்கியையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגַּע בַּמָּקוֹם
  choice: ஓர் இடத்தை அடைந்து
  rationale: פגע என்பதற்கு ‘சந்தி, அடை’ என்ற பொருள்கள் உண்டு. பயணச் சூழலில் இது ஓர் இடத்தை வந்தடைவதைக் குறிக்கிறது; தற்செயலாகக் கண்டடைந்தார் என்ற கூடுதல் பொருளை ஏற்றவில்லை.
- source_word: וַיָּלֶן שָׁם
  choice: அங்கே இரவைக் கழித்தார்
  rationale: לון என்பது ஓரிடத்தில் இரவு தங்குவதைக் குறிக்கிறது. இத்தமிழாக்கம் இயல்பான நவீன நடையில் அந்தப் பொருளைத் தருகிறது.
- source_word: כִּי בָא הַשֶּׁמֶשׁ
  choice: சூரியன் மறைந்துவிட்டதால்
  rationale: சூரியனுடன் வரும் בוא இச்சூழலில் சூரிய மறைவைக் குறிக்கும் மரபுத்தொடர். כִּי தங்கியதற்கான காரணத்தைக் காட்டுவதால் ‘-தால்’ பயன்படுத்தப்பட்டது.
- source_word: וַיִּקַּח מֵאַבְנֵי הַמָּקוֹם
  choice: அந்த இடத்திலிருந்த கற்களில் ஒன்றை எடுத்து
  rationale: பன்மையான ‘கற்கள்’ என்பதோடு வரும் מִן பகுதிப்பொருளில் ‘கற்களில் ஒன்று’ என இயல்பாகப் புரிந்துகொள்ளலாம். இருப்பினும் ‘சில கற்கள்’ என்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: מְרַאֲשֹׁתָיו
  choice: தன் தலைக்கு அடியில்
  rationale: இச்சொல் தலை இருக்கும் பகுதியையோ தலைத்தாங்கியையோ குறிக்கலாம். இச்சூழலில் கல்லின் பயன்பாட்டை இயல்பாக வெளிப்படுத்த ‘தலைக்கு அடியில்’ என மொழிபெயர்க்கப்பட்டது; ‘தலைப்பக்கத்தில்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּשְׁכַּב בַּמָּקוֹם הַהוּא
  choice: அந்த இடத்திலேயே படுத்துக்கொண்டார்
  rationale: שכב படுத்துக்கொள்ளும் செயலைக் குறிக்கிறது; ‘தூங்கினார்’ என்று கூறுவது மூலத்தைவிட மேலதிகமாகும். இடத்தின் கதைக் முக்கியத்துவத்தைப் பேண ‘அந்த இடத்திலேயே’ என மீளுரைக்கப்பட்டது.
