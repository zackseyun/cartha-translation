translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரேய மொழியின் ‘பெயரை அழைத்தான்’ என்ற அமைப்பு, தமிழில் இயல்பான ‘பெயரிட்டான்’ என வழங்கப்பட்டுள்ளது; இடப்பெயர்கள் ஒலிபெயர்க்கப்பட்டு, பெத்தேலின் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
