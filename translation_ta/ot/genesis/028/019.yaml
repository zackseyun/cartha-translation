base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/019.yaml
  text: And he called the name of that place Bethel[a], but formerly the name of the city was Luz.
translation:
  language: ta
  text: அவன் அந்த இடத்திற்குப் பெத்தேல்[a] என்று பெயரிட்டான்; ஆனால் அந்த நகரத்தின் பெயர் முன்பு லூஸ் என்பதாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெத்தேல்” என்பதற்கு “இறைவனின் வீடு” என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שֵׁם
  choice: பெயரிட்டான்
  rationale: ‘பெயரைக் கூப்பிட்டான்’ என்ற எபிரேய மரபுத்தொடரைச் சொற்சொல்லாக வழங்காமல், பெயர் சூட்டும் செயலை இயல்பான நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: הַמָּקוֹם הַהוּא
  choice: அந்த இடத்திற்கு
  rationale: מקום என்பதன் இயல்பான பொருள் ‘இடம்’; சுட்டுப்பெயரடை הַהוּא ‘அந்த’ எனப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בֵּית אֵל
  choice: பெத்தேல்
  rationale: இடப்பெயரை முதன்மை உரையில் மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்த்துள்ளோம்; அதன் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְאוּלָם
  choice: ஆனால்
  rationale: முந்தைய பெயரை விளக்கும் முரண்பாட்டு இணைப்பைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לוּז
  choice: லூஸ்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שֵׁם הָעִיר
  choice: அந்த நகரத்தின் பெயர்
  rationale: எபிரேயச் சார்புநிலை அமைப்பைத் தெளிவான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: לָרִאשֹׁנָה
  choice: முன்பு
  rationale: அந்த நகரத்தின் முந்தைய பெயரைக் குறிக்கும் காலப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
