base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/004.yaml
  text: May he give you the blessing of Abraham[a], to you and to your offspring with you, so that you may possess the land of your sojournings[b], which God gave to Abraham.
translation:
  language: ta
  text: தேவன் ஆபிரகாமுக்குக் கொடுத்த, நீ அந்நியனாகத் தங்கிவரும் நாட்டை நீ உரிமையாக்கிக்கொள்ளும்படி, அவர் ஆபிரகாமின் ஆசீர்வாதத்தை உனக்கும் உன்னோடு இருக்கும் உன் சந்ததிக்கும்[a] தருவாராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னோடுள்ள உன் வித்துக்கும்.” எபிரெயச் சொல் வடிவில் ஒருமையாக இருந்தாலும், இங்கு கூட்டுப்பொருளில் சந்ததியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: அவர் தருவாராக
  rationale: ஆசீர்வாதச் சூழலில் வரும் வேண்டுதல் பொருளுள்ள வினைவடிவை, இயல்பான தமிழ் வாழ்த்துமொழியாகத் தருகிறது.
- source_word: בִּרְכַּת אַבְרָהָם
  choice: ஆபிரகாமின் ஆசீர்வாதம்
  rationale: எபிரெயக் கட்டிணைப்பை நேரடியாகப் பாதுகாத்து, ஆபிரகாமிய வாக்குறுதியுடனான தொடர்பையும் நிலைநிறுத்துகிறது.
- source_word: לְךָ וּלְזַרְעֲךָ אִתָּךְ
  choice: உனக்கும் உன்னோடு இருக்கும் உன் சந்ததிக்கும்
  rationale: ‘உன்னோடு’ என்பதை நீக்காமல் வைத்திருக்கிறது; זֶרַע ஒருமை வடிவில் இருந்தாலும் கூட்டுப்பொருளில் வருவதால் ‘சந்ததி’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: לְרִשְׁתְּךָ
  choice: நீ உரிமையாக்கிக்கொள்ளும்படி
  rationale: לְ உடன் வரும் வினையெச்சம் நோக்கம் அல்லது விளைவைச் சுட்டுகிறது; நிலத்தைத் தமதாக்கி உடைமையில் கொள்வது என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: நீ அந்நியனாகத் தங்கிவரும் நாடு
  rationale: மூதாதையர் வாக்குத்தத்த நாட்டில் நிரந்தர உரிமையாளர்களாக அல்லாமல் அந்நியக் குடியிருப்பாளர்களாக வாழ்ந்த கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים לְאַבְרָהָם
  choice: தேவன் ஆபிரகாமுக்குக் கொடுத்த
  rationale: எபிரெய உறவுப்பெயர் தொடரைத் தெளிவாகவும் சுருக்கமாகவும் வழங்குகிறது.
theological_decisions:
- issue: ஆபிரகாமிய உடன்படிக்கை வாக்குறுதியின் நுண்பொருள்
  choice: ‘ஆபிரகாமின் ஆசீர்வாதம்’ என்பதையும் நாட்டை உரிமையாக்கிக்கொள்ளும் மொழியையும் வெளிப்படையாகப் பாதுகாத்தல்
  alternative: ‘ஆபிரகாமுக்கு வாக்களிக்கப்பட்ட ஆசீர்வாதம்’ என்று விளக்கமாக மொழிபெயர்த்தல் அல்லது ‘சுதந்தரித்துக்கொள்ளும்படி’ என்று வழங்குதல்
  rationale: வசனம் ஆபிரகாமிய வாக்குறுதியை நேரடியாக நினைவூட்டுகிறது. மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்காமல் அந்த உடன்படிக்கைத் தொடர்பைப் பாதுகாக்கிறது; அதேவேளை ירש என்பதிலுள்ள சுதந்தரிப்பு நுண்பொருளை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், மரியாதையும் வேதாகமச் செறிவும் காக்கப்பட்டுள்ளன. ‘அந்நியனாகத் தங்கிவரும்’ என்பது சொற்சொல் மொழிபெயர்ப்பின் செயற்கைத்தன்மையைத் தவிர்த்து מְגֻרִים என்பதின் குடியிருப்பு-அந்நியர் கருத்தைப் பாதுகாக்கிறது. அரைப்புள்ளி நீண்ட வாக்கியத்தின் ஆசீர்வாதத்தையும் அதன் நோக்கத்தையும் தெளிவுபடுத்துகிறது.
