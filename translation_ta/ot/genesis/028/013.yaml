base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/013.yaml
  text: And behold[a], Yahweh was standing above it, and he said, “I am Yahweh, the God of Abraham your father and the God of Isaac[b]. The land on which you are lying I will give to you and to your offspring.”
translation:
  language: ta
  text: 'இதோ, யாவே அதற்கு மேலே நின்றிருந்தார்[a]. அவர், “நான் யாவே; உன் தந்தையான ஆபிரகாமின் கடவுளும் ஈசாக்கின் கடவுளும் நானே. நீ படுத்திருக்கும் நிலத்தை உனக்கும் உன் சந்ததிக்கும்[b] கொடுப்பேன்” என்றார்.


    [a] அல்லது, “அவனருகில்” / “அவனுக்கு மேலே”; இங்குள்ள பதிலிப்பெயர் ஏணியைக் குறிக்காமல் யாக்கோபைக் குறித்தால்.


    [b] எபிரெயத்தில், “உன் விதைக்கு”; இயல்பான தமிழில் அதன் கூட்டுப் பொருளைப் பாதுகாக்க “உன் சந்ததிக்கு” என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனருகில்” / “அவனுக்கு மேலே”; இங்குள்ள பதிலிப்பெயர் ஏணியைக் குறிக்காமல் யாக்கோபைக் குறித்தால்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில், “உன் விதைக்கு”; இயல்பான தமிழில் அதன் கூட்டுப் பொருளைப் பாதுகாக்க “உன் சந்ததிக்கு” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: எபிரெய உரையின் கவனத்தை ஈர்க்கும் உரையாடல் அடையாளத்தையும் தரிசனத்தின் உயிரோட்டத்தையும் இயல்பான, உயர்வான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: נִצָּב
  choice: நின்றுகொண்டிருந்தார்
  rationale: எபிரெய வினையெச்சத்தின் நீடித்த நிலைப்பொருளை வெளிப்படுத்துகிறது; கடவுளைக் குறிக்கும் இடத்தில் மரியாதைப் பன்மை பயன்படுத்தப்படுகிறது.
- source_word: עָלָיו
  choice: அதற்கு மேலே
  rationale: உடனடி முன்னிடைப் பொருளான ஏணியைச் சுட்டுவதாக முதன்மையாக எடுத்துக்கொள்கிறது; யாக்கோபைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: உன் தந்தை ஆபிரகாமின் கடவுள்
  rationale: ஆபிரகாமை விரிந்த மூதாதைப் பொருளில் ‘தந்தை’ என்று குறிப்பிடும் எபிரெயத் தொடரைத் தேவையின்றி மறுவிளக்கம் செய்யாமல் இயல்பான தமிழில் தருகிறது.
- source_word: הָאָרֶץ
  choice: இந்த நிலம்
  rationale: மூதாதையருக்கான வாக்குறுதியின் சூழலில் வெறும் தரையைக் காட்டிலும் வாக்குத்தத்த நாட்டுப் பகுதியைக் குறிக்கும் ‘நிலம்’ பொருத்தமானது; தமிழில் சுட்டுப்பொருளை இயல்பாக்க ‘இந்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: שֹׁכֵב עָלֶיהָ
  choice: நீ படுத்திருக்கும்
  rationale: நிகழ்காலத்தில் தொடரும் செயலைக் குறிக்கும் எபிரெய வினையெச்சத்தையும் இடத்துடனான உறவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: உனக்குக் கொடுப்பேன்
  rationale: வாக்குறுதியின் சூழலில் எபிரெய நிறைவுறா வினையின் எதிர்காலப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: וּלְזַרְעֶךָ
  choice: உன் சந்ததிக்கும்
  rationale: זֶרַע என்பதன் கூட்டொருமைப் பொருளைக் காத்தபடி, ‘விதை’ என்பதைக் காட்டிலும் மனித வழித்தோன்றல்களைக் குறிக்க இயல்பான நவீனத் தமிழைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூல உரை கடவுளின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: தரிசனத்தில் עָלָיו என்பதன் சுட்டுப்பொருள்
  choice: அதற்கு மேலே
  alternative: அவனருகில் / அவனுக்கு மேலே
  rationale: உடனடி சூழலில் ஏணி முன்னிடைப் பொருளாக இருப்பதால் அதைக் குறிக்கும் வாசிப்பு முதன்மை உரையில் தரப்படுகிறது. எனினும், அது யாக்கோபைக் குறிக்கலாம் என்ற உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் தரிசன உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. கடவுளைக் குறிக்கும் வினைகளில் வழக்கமான மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. மூல உரையின் சுட்டுப்பெயர் தெளிவின்மையும் זֶרַע என்பதன் கூட்டொருமைப் பொருளும் அடிக்குறிப்புகளால் பாதுகாக்கப்பட்டுள்ளன.
