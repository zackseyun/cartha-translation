  yaml_path: translation/ot/genesis/028/016.yaml
  text: Then Jacob awoke from his sleep and said[a], “Surely Yahweh is in this place, and I did not know it.”
translation:
  language: ta
  text: அப்போது யாக்கோபு தூக்கத்திலிருந்து விழித்தெழுந்து, “மெய்யாகவே யாவே இந்த இடத்தில் இருக்கிறார்; நானோ இதை அறியாதிருந்தேன்”[a] என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மெய்யாகவே” என்பது யாவே அங்கே இருப்பதை யாக்கோபு திடீரென உணர்ந்து உறுதிப்படுத்தியதைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיקַץ
  choice: விழித்தெழுந்து
  rationale: தூக்கத்திலிருந்து விழிப்பதைக் குறிக்கும் வினை; தொடரும் உரையாடலுடன் இயல்பாக இணையும் தமிழ் வினையெச்ச வடிவம்.
- source_word: מִשְּׁנָתוֹ
  choice: தூக்கத்திலிருந்து
  rationale: எபிரெயச் சொல்லின் நேரடியான பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: אָכֵן
  choice: மெய்யாகவே
  rationale: யாக்கோபுக்கு திடீரென ஏற்பட்ட உறுதியான உணர்தலை வலியுறுத்துகிறது; ‘நிச்சயமாகவே’ என்பதும் சாத்தியம்.
- source_word: יֵשׁ
  choice: இருக்கிறார்
  rationale: இங்கு இருப்பு அல்லது பிரசன்னத்தைக் குறிக்கிறது; யாவே அந்த இடத்தில் இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: இந்த இடத்தில்
  rationale: யாக்கோபு தூங்கி, கனவு கண்ட குறிப்பிட்ட இடத்தைக் குறிக்கும் நேரடியும் இயல்புமான மொழிபெயர்ப்பு.
- source_word: וְאָנֹכִי
  choice: நானோ
  rationale: தனிப்பட்ட சுட்டுப்பெயரின் வலியுறுத்தலையும், யாவேயின் இருப்புக்கும் யாக்கோபின் முந்தைய அறியாமைக்கும் உள்ள வேறுபாட்டையும் வெளிப்படுத்துகிறது.
- source_word: לֹא יָדָעְתִּי
  choice: இதை அறியாதிருந்தேன்
  rationale: யாவே அந்த இடத்தில் இருந்ததை முன்பு அறியாமல் இருந்த நிலையைக் குறிக்கிறது; ‘இதை’ என்பது முன் கூறிய உண்மையைத் தெளிவாகச் சுட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் பட்டமல்ல, இறைத் திருப்பெயரே இடம்பெறுகிறது. எனவே அந்தப் பெயரை மறைக்காமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- issue: யாவே ‘இந்த இடத்தில் இருக்கிறார்’ என்பதன் பொருள்
  choice: இருப்பு அல்லது பிரசன்னம் என்ற மூல உரையின் திறந்த பொருளை அப்படியே வைத்தல்
  alternative: இந்த இடத்தில் மட்டும் வாசமாயிருக்கிறார் என்று விளக்குதல்
  rationale: יֵשׁ ... בַּמָּקוֹם הַזֶּה என்பது யாக்கோபின் திடீர் உணர்தலைக் கூறுகிறது; கடவுளின் இருப்பை ஓர் இடத்திற்குள் கட்டுப்படுத்தும் மேலதிக கருத்தை உரையில் சேர்க்கவில்லை.
