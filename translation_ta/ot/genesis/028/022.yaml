  yaml_path: translation/ot/genesis/028/022.yaml
  text: And this stone[a], which I have set up as a pillar, will be God’s house[b], and of all that you give me I will surely give a tenth to you.
translation:
  language: ta
  text: மேலும், நான் தூணாக நிறுத்திய இந்தக் கல் தேவனுடைய வீடாக இருக்கும்; நீர் எனக்குத் தரும் எல்லாவற்றிலிருந்தும் பத்தில் ஒரு பங்கை நிச்சயமாக உமக்குத் தருவேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַצֵּבָה
  choice: தூண்
  rationale: நிறுத்தப்பட்ட கல் நினைவுச்சின்னம் அல்லது வழிபாட்டிடக் குறியைக் குறிக்கிறது. ‘தூண்’ என்பது அதன் concrete உருவத்தைச் சுருக்கமாகப் பாதுகாக்கிறது; ‘நினைவுக்கல்’ என்று மொழிபெயர்த்தால் நோக்கம் தேவைக்கு அதிகமாக விளக்கப்பட்டுவிடும்.
- source_word: יִהְיֶה בֵּית אֱלֹהִים
  choice: தேவனுடைய வீடாக இருக்கும்
  rationale: எபிரேய இணைப்புத்தொடரின் இயல்பான பொருள் ‘தேவனுடைய வீடு.’ ‘இருக்கும்’ என்பது எதிர்காலக் கூற்றைத் தக்கவைக்கிறது; கல் ஆலயமாக உருமாறும் என்று கூடுதலாக விளக்கவில்லை.
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: முந்தைய சூழலில் யாக்கோபைச் சந்தித்த ஒரே தேவனே இங்கு குறிப்பிடப்படுகிறார்; ஆகவே பொதுவான ஒரு தெய்வத்தைக் குறிக்கும் சொல் பயன்படுத்தப்படவில்லை.
- source_word: תִּתֶּן לִי
  choice: நீர் எனக்குத் தரும்
  rationale: நேரடியான வினைப்பொருளைத் தக்கவைத்து, யாக்கோபின் நேரடி உரையில் மரியாதையான இரண்டாம் நபர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַשֵּׂר אֲעַשְּׂרֶנּוּ
  choice: பத்தில் ஒரு பங்கை நிச்சயமாக உமக்குத் தருவேன்
  rationale: வினையின் infinitive absolute வடிவமும் finite verb வடிவமும் சேர்ந்துள்ள வலியுறுத்தலை ‘நிச்சயமாக’ வெளிப்படுத்துகிறது. ‘தசமபாகம் செலுத்துவேன்’ என்ற நிறுவன அல்லது சமயச் சிறப்புச்சொல்லைத் தவிர்த்து, சாதாரண வாசகருக்குப் பொருளைத் தெளிவாக்குகிறது.
- source_word: הָאֶבֶן הַזֹּאת אֲשֶׁר שַׂמְתִּי
  choice: நான் தூணாக நிறுத்திய இந்தக் கல்
  rationale: கல்லை வெறுமனே வைத்ததல்ல, நிமிர்த்தி நிறுவிய செயலை ‘நிறுத்திய’ என்பதும், அதன் பயன்பாட்டை ‘தூணாக’ என்பதும் இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
theological_decisions:
- issue: கல்லை ‘தேவனுடைய வீடு’ என்று கூறுவதன் தன்மை
  choice: மூலத்தின் ‘தேவனுடைய வீடு’ என்ற சொல்லாட்சி அப்படியே பாதுகாக்கப்பட்டு, அது தேவசந்திப்புடன் தொடர்புடைய புனித இடம் அல்லது குறி என்பதைக் கடந்த விளக்கம் உரையில் சேர்க்கப்படவில்லை.
  alternative: கல் தானே ஒரு கோவிலாக மாறுகிறது; அல்லது இது பிற்கால ஆலயத்தை நேரடியாக முன்னறிவிக்கிறது.
  rationale: இந்தக் கல் தேவனுடைய வீடாக இருக்கும் என்றே எபிரேயம் கூறுகிறது. உடனடிச் சூழலைத் தாண்டிய பிற்கால ஆலய இறையியலை மொழிபெயர்ப்பில் புகுத்தாமல் அதன் இறையியல் அழுத்தம் பாதுகாக்கப்படுகிறது.
- issue: பத்தில் ஒரு பங்கு கொடுக்கும் நேர்த்திக்கடன்
  choice: தேவன் தரும் எல்லாவற்றிலிருந்தும் பத்தில் ஒரு பங்கை அவருக்குத் தருவதாகிய வலியுறுத்தப்பட்ட வாக்குறுதியாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: பிற்கால மோசேயின் சட்டம் அல்லது திருச்சபை நடைமுறையின்படியான நிறுவனமயமான ‘தசமபாகம்’ செலுத்துதல்.
  rationale: இங்கு யாக்கோபின் தனிப்பட்ட நேர்த்திக்கடனே வெளிப்படையாக உள்ளது. பிற்காலச் சட்ட அல்லது திருச்சபை அமைப்புகளை ஆதியாகமச் சூழலுக்குள் கொண்டு வராமல், அளவும் பெறுநரும் தெளிவாக வைக்கப்படுகின்றனர்.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்கும் புரியும் வகையில் நேரடியானவும் கண்ணியமானவும் உள்ள நடை. தேவனை நோக்கிய நேரடி உரையில் ‘நீர்/உமக்கு’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. வசனத்தின் இரண்டு இணை வாக்குறுதிகளும் தமிழில் தெளிவாக வாசிக்க முற்றுப்புள்ளியால் பிரிக்கப்பட்டுள்ளன; பொருள் தொடர்பு மாறவில்லை.
