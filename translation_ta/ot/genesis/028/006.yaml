base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/006.yaml
  text: Esau saw that Isaac had blessed Jacob and sent him to Paddan-aram to take a wife for himself from there[a], and that when he blessed him, he commanded him, saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: ta
  text: ஈசாக்கு யாக்கோபை ஆசீர்வதித்து, பதான் அராமிலிருந்து தனக்காக ஒரு மனைவியை எடுத்துக்கொள்ளும்படி அவனை அனுப்பியதையும், அவனை ஆசீர்வதித்தபோது, “கானானின் மகள்களில்[a] ஒருத்தியை நீ மனைவியாகக் கொள்ளக் கூடாது” என்று அவனுக்குக் கட்டளையிட்டதையும் ஏசா கண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கானானின் மகள்களில்” என்பது எபிரெய மொழியின் சொற்சொல்லான வடிவம்; இதை “கானானியப் பெண்களில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא עֵשָׂו
  choice: ஏசா கண்டான்
  rationale: ראה என்பதன் தொடர்கதை வடிவம் நிகழ்வை முன்னெடுக்கிறது. எபிரெயத்தில் வெளிப்படையான ‘இப்போது’ இல்லாததால் தமிழிலும் அத்தகைய சொல்லைச் சேர்க்கவில்லை.
- source_word: כִּי בֵרַךְ יִצְחָק אֶת יַעֲקֹב
  choice: ஈசாக்கு யாக்கோபை ஆசீர்வதித்து
  rationale: ஏசா கண்டறிந்த முன்நிகழ்வைத் தமிழின் வினையெச்சத் தொடரால் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְשִׁלַּח אֹתוֹ פַּדֶּנָה אֲרָם
  choice: அவனைப் பதான் அராமுக்கு அனுப்பியதையும்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, ஏசா கண்ட இரண்டு தொடர்புடைய செயல்களில் இதுவும் ஒன்று என்பதை ‘-தையும்’ அமைப்பு காட்டுகிறது.
- source_word: לָקַחַת לוֹ מִשָּׁם אִשָּׁה
  choice: அங்கிருந்து ஒரு பெண்ணைத் தனக்கு மனைவியாகக் கொள்ளும்படி
  rationale: לוֹ என்பதிலுள்ள ‘தனக்காக’ என்ற நுணுக்கத்தையும், திருமண நோக்கில் אִשָּׁה என்பதன் பெண்/மனைவி பொருளையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: בְּבָרֲכוֹ אֹתוֹ
  choice: அவனை ஆசீர்வதித்தபோது
  rationale: בְּ முன்னொட்டு இங்கு குறிக்கும் காலச்சூழலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיְצַו עָלָיו לֵאמֹר
  choice: என்று அவனுக்குக் கட்டளையிட்டதையும்
  rationale: צוה என்பதன் கட்டளை வலிமையைக் காக்கிறது; நேரடி மேற்கோளைத் தொடர்ந்து வரும் ‘என்று’ எபிரெய மேற்கோள் அமைப்பை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: לֹא תִקַּח אִשָּׁה
  choice: ஒருத்தியை நீ மனைவியாகக் கொள்ளக் கூடாது
  rationale: இரண்டாம் நபர் ஒருமைக்குரிய தடையைத் தெளிவாகத் தருகிறது; ‘மனைவியாகக் கொள்ளுதல்’ திருமணச் சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: கானான் மகள்களில்
  rationale: ‘கானானின் மகள்கள்’ என்ற எபிரெய மொழியின் உருவகமிக்க சொற்றொடரை நெருக்கமாகக் காக்கிறது; அது கானானியப் பெண்களைக் குறிக்கிறது.
