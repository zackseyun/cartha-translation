  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதையாடலுக்கேற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் நீண்ட வாக்கிய அமைப்பு தமிழில் தெளிவாக இருக்க இணையான ‘-தையும் … -தையும்’ தொடரால் ஒழுங்குபடுத்தப்பட்டுள்ளது.
