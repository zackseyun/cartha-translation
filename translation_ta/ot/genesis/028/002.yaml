translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய புரிதலும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய உறவுமுறைச் சொற்றொடர்கள் ‘தாயின் தகப்பன்’, ‘தாயின் சகோதரன்’ என வெளிப்படையாக வைக்கப்பட்டுள்ளன; தமிழில் அவை இயல்பாகத் தோன்ற பெயர்களுடன் ‘-ஆன’ வடிவில் இணைக்கப்பட்டுள்ளன.
