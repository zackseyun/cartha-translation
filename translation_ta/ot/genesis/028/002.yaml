  text: ק֥וּם לֵךְ֙ פַּדֶּ֣נָֽ/ה אֲרָ֔ם בֵּ֥יתָ/ה בְתוּאֵ֖ל אֲבִ֣י אִמֶּ֑/ךָ וְ/קַח לְ/ךָ֤ מִ/שָּׁם֙ אִשָּׁ֔ה מִ/בְּנ֥וֹת לָבָ֖ן אֲחִ֥י אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/002.yaml
  text: Arise[a], go to Paddan-aram, to the house of Bethuel, your mother's father, and take for yourself from there a wife from the daughters of Laban, your mother's brother.
translation:
  language: ta
  text: எழுந்து, பதான்-அராமுக்குப் போ; உன் தாயின் தகப்பனான பெத்துவேலின் வீட்டுக்குச் சென்று, அங்கிருந்து உன் தாயின் சகோதரனான லாபானின் மகள்களில் ஒருத்தியை உனக்கு மனைவியாக எடுத்துக்கொள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֥וּם
  choice: எழுந்து
  rationale: קום என்பதன் கட்டளைப் பொருள் ‘எழு/எழுந்திரு’. அடுத்து வரும் ‘போ’ என்பதுடன் இயல்பாக இணைவதற்காக ‘எழுந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לֵךְ֙
  choice: போ
  rationale: הלך என்பதன் பொதுவான கட்டளை வடிவத்தை நவீனத் தமிழில் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: פַּדֶּנָֽה אֲרָם
  choice: பதான்-அராமுக்கு
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, திசையைக் குறிக்கும் ה தமிழின் ‘-க்கு’ வேற்றுமையால் வெளிப்படுத்தப்பட்டது.
- source_word: בֵּיתָה בְתוּאֵל
  choice: பெத்துவேலின் வீட்டுக்குச் சென்று
  rationale: பெத்துவேலின் வீடு அல்லது குடும்பத்தாரிடம் செல்லும் இலக்கைத் தெளிவாக்குகிறது. எபிரெய வாக்கியத்தில் உள்ள இயக்கக் கருத்தைத் தமிழில் இயல்பாகத் தொடர ‘சென்று’ சேர்க்கப்பட்டது.
- source_word: אֲבִי אִמֶּךָ
  choice: உன் தாயின் தகப்பனான
  rationale: சொல்லடக்கமாக ‘உன் தாயின் தகப்பன்’. ‘தாய்வழித் தாத்தா’ என்று சுருக்காமல், மூலத்தின் உறவுமுறைச் சொல்லை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: וְקַח לְךָ
  choice: உனக்கு ... எடுத்துக்கொள்
  rationale: לקח என்பதன் ‘எடு’ என்ற பொருளையும், לְךָ தரும் தனக்கான பயன்/நோக்க நுணுக்கத்தையும் ‘உனக்கு ... எடுத்துக்கொள்’ காக்கிறது.
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: மூலத்தில் வெளிப்படையாக உள்ள מִן என்ற ‘இருந்து’ பொருளைத் தக்கவைக்கிறது.
- source_word: אִשָּׁה
  choice: மனைவியாக
  rationale: திருமணத்திற்காகப் பெண்ணைத் தேர்ந்தெடுக்கும் சூழலில் אִשָּׁה என்பதற்கான பொருத்தமான பொருள் ‘மனைவி’.
- source_word: מִבְּנוֹת לָבָן
  choice: லாபானின் மகள்களில் ஒருத்தியை
  rationale: מִן இங்கு ஒரு குழுவிலிருந்து தேர்வு செய்வதைக் குறிக்கிறது. ஒருமை אִשָּׁה உடன் இயல்பான தமிழுக்காக ‘மகள்களில் ஒருத்தியை’ எனத் தரப்பட்டது.
- source_word: אֲחִי אִמֶּךָ
  choice: உன் தாயின் சகோதரனான
  rationale: சொல்லடக்கமாக ‘உன் தாயின் சகோதரன்’. ‘மாமன்’ என்று சுருக்காமல் மூலத்தின் வெளிப்படையான உறவுமுறை அமைப்பைப் பாதுகாக்கிறது.
