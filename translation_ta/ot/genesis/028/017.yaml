base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/017.yaml
  text: And he was afraid and said[a], “How awesome this place is! This is none other than the house of God[b], and this is the gate of heaven.”
translation:
  language: ta
  text: 'அவன் அஞ்சி, “இந்த இடம் எவ்வளவு அச்சத்திற்குரியது![a] இது கடவுளின் வீடே; வேறொன்றுமல்ல. இது வானத்தின் வாசல்[b]” என்றான்.


    [a] அல்லது, “இந்த இடம் எவ்வளவு அச்சமூட்டுகிறது!” எபிரெயச் சொல் அச்சம், திகில், அல்லது பயபக்தி கலந்த வியப்பு ஆகிய உணர்வுகளைக் குறிக்கலாம்.


    [b] சொல்லுக்குச் சொல்: “வானங்களின் வாசல்.” இங்கு ‘வானம்’ என்பது தெய்வீக உலகைக் குறிக்கப் பயன்படுகிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த இடம் எவ்வளவு அச்சமூட்டுகிறது!” எபிரெயச் சொல் அச்சம், திகில், அல்லது பயபக்தி கலந்த வியப்பு ஆகிய உணர்வுகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “வானங்களின் வாசல்.” இங்கு ‘வானம்’ என்பது தெய்வீக உலகைக் குறிக்கப் பயன்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: அவன் அஞ்சி
  rationale: ירא என்பதன் தொடர்கதை வடிவம் யாக்கோபின் உடனடி எதிர்வினையைச் சுட்டுகிறது. ‘அஞ்சி’ என்பது இயல்பான தமிழில் பயத்தைத் தெளிவாகக் காட்டுகிறது; அதை பயபக்தி என்று மட்டும் விளக்கிவிடவில்லை.
- source_word: מַה נּוֹרָא
  choice: எவ்வளவு அச்சத்திற்குரியது
  rationale: נוֹרָא என்பது அச்சம், திகில், பயபக்தி கலந்த வியப்பு ஆகியவற்றைத் தூண்டுவதைச் சுட்டலாம். ‘அச்சத்திற்குரியது’ அந்தப் பொருள் விரிவையும் புனிதமான தீவிரத்தையும் தக்கவைக்கிறது; מַה-வின் வியப்புக் கூறு ‘எவ்வளவு’ என்பதால் வெளிப்படுகிறது.
- source_word: הַמָּקוֹם הַזֶּה
  choice: இந்த இடம்
  rationale: சுட்டுப்பெயருடன் கூடிய எபிரெயத் தொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: אֵין זֶה כִּי אִם
  choice: இது ... தவிர வேறொன்றுமல்ல
  rationale: வலியுறுத்திய அடையாளப்படுத்தலையும் வரையறையையும் இந்தத் தமிழ் மரபுத்தொடர் இயல்பாகக் காக்கிறது.
- source_word: בֵּית אֱלֹהִים
  choice: கடவுளின் வீடு
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவாக வழங்குகிறது. பின்னாளைய ஆலய அமைப்பு ஏற்கெனவே இங்கு இருப்பதாகக் கூறாமல், புனித இருப்பிடத்தின் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: שַׁעַר הַשָּׁמָיִם
  choice: வானத்தின் வாசல்
  rationale: தெய்வீக மேலுலகைக் குறிக்கும் போது இயல்பான நவீனத் தமிழ் ஒருமை வடிவம் பொருத்தமானது. எபிரெயின் வடிவமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ஒருமைச் சுட்டுப்பொருள் கொண்ட சூழலில் אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: தெய்வங்கள்
  rationale: சொல் வடிவத்தில் பன்மையாகத் தோன்றினாலும், இந்தத் தரிசனமும் உடன்படிக்கைச் சூழலும் யாக்கோபின் ஒரே கடவுளையே தெளிவாகச் சுட்டுகின்றன. எனவே ஒருமை மொழிபெயர்ப்பு தேவை.
- issue: புனிதச் சூழலில் נוֹרָא என்பதன் நுண்பொருள்
  choice: அச்சத்திற்குரியது
  alternative: பயபக்திக்குரியது / அச்சமூட்டுவது
  rationale: இவ்வசனம் வெறும் திகிலையோ சாதாரண வியப்பையோ அல்லாமல், கடவுளின் பிரசன்னத்துக்கு முன் ஏற்படும் அச்சமும் பயபக்தி கலந்த வியப்பும் உள்ள பதற்றத்தை வெளிப்படுத்துகிறது. முதன்மை உரை அந்த இருபொருள் வாய்ப்பையும் முழுமையாக ஒரு பக்கமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் புனித உரைக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. மேற்கோள் அமைப்பு தமிழின் இயல்பான வாக்கிய வரிசைப்படி அமைக்கப்பட்டது; மூலத்தின் அச்சம்–பயபக்தி நுண்பொருள் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டது.
