  source_fidelity: 'மூலத்தின் அடிப்படைப் பொருள் நன்றாகக் காக்கப்பட்டுள்ளது: யாக்கோபின் அச்சம், இடத்தின் நுமினஸ்/அச்சமூட்டும் தன்மை, ‘கடவுளின் வீடு,’ ‘வானத்தின் வாசல்’ ஆகியவை சரியாக உள்ளன. ஆனால் ‘இதுவே’ என்பது எபிரெய ‘וְזֶה’யின் எளிய சுட்டுதலை விடச் சற்றே கூடுதல் வலியுறுத்தலைத் தரக்கூடும்; அதைத் தவிர்ப்பது பாதுகாப்பானது.'
