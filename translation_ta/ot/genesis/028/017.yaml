  terminology: ‘கடவுள்,’ ‘வீடு,’ ‘வானத்தின் வாசல்’ ஆகிய தேர்வுகள் பொருத்தமானவை. அடிக்குறிப்பு [b]-இல் ‘கடவுள் உறையும் மேலுலகம்’ என்பது மூலச் சொல்லின் இலக்கண விளக்கத்தைவிட விளக்கவுரையாக விரிகிறது; ‘தெய்வீக உலகு’ என்பது நடுநிலையானதும் ஆங்கில ஆய்வுக் குறிப்போடும் நெருக்கமானதும் ஆகும்.
