source:
  edition: WLC
  text: וַֽ/יַּחֲלֹ֗ם וְ/הִנֵּ֤ה סֻלָּם֙ מֻצָּ֣ב אַ֔רְצָ/ה וְ/רֹאשׁ֖/וֹ מַגִּ֣יעַ הַ/שָּׁמָ֑יְמָ/ה וְ/הִנֵּה֙ מַלְאֲכֵ֣י אֱלֹהִ֔ים עֹלִ֥ים וְ/יֹרְדִ֖ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/012.yaml
  text: And he dreamed[a], and behold, a ladder was set up on the earth, and its top reached to heaven; and behold[b], the angels of God were ascending and descending on it.
translation:
  language: ta
  text: அவர் கனவு கண்டார். இதோ, பூமியில் ஒரு படிக்கட்டு நிலைநிறுத்தப்பட்டிருந்தது; அதன் உச்சி வானத்தை எட்டியது. இதோ, கடவுளின் தூதர்கள் அதில்[a] ஏறிக்கொண்டும் இறங்கிக்கொண்டும் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்மேல்.” எனினும், இச்சூழலில் இதற்கு மிக இயல்பான சுட்டுப்பொருள் படிக்கட்டே.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּחֲלֹם
  choice: அவர் கனவு கண்டார்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை இயல்பான நவீனத் தமிழில் முன்னெடுக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கனவுக் காட்சியின் திடீர், உயிரோட்டமான அறிமுகத்தைத் தக்கவைக்கிறது.
- source_word: סֻלָּם
  choice: படிக்கட்டு
  rationale: ஏறி இறங்குவதற்கான அமைப்பைக் குறிக்கும் எபிரெயச் சொல்லை, படிகள் கொண்ட கட்டமைப்பு அல்லது ஏணி என்று மிகக் குறிப்பாக வரையறுக்காமல் இயல்பாகக் காட்டுகிறது.
- source_word: מֻצָּב אַרְצָה
  choice: பூமியில் ... நிலைநிறுத்தப்பட்டிருந்தது
  rationale: அமைப்பு பூமியில் உறுதியாக வைக்கப்பட்டிருந்த நிலையைத் தெரிவிக்கிறது; வானத்துடனான அண்டவெளி எதிரிணையையும் காக்கிறது.
- source_word: וְרֹאשׁוֹ מַגִּיעַ הַשָּׁמָיְמָה
  choice: அதன் உச்சி வானத்தை எட்டியது
  rationale: பொருளின் 'தலை' என்பதைத் தமிழில் இயல்பான 'உச்சி' எனவும், வானை நோக்கிய நீட்சியை 'எட்டியது' எனவும் வழங்குகிறது.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: கடவுளின் தூதர்கள்
  rationale: தெய்வீகக் காட்சியில் உள்ள வானுலகத் தூதர்களைக் குறிக்கிறது; מַלְאָךְ என்பதன் அடிப்படைத் 'தூதர்' பொருளையும் காக்கிறது.
- source_word: עֹלִים וְיֹרְדִים
  choice: ஏறிக்கொண்டும் இறங்கிக்கொண்டும் இருந்தார்கள்
  rationale: எபிரெயப் பங்கேற்பு வடிவங்கள் காட்டும் தொடர்ச்சியான இயக்கத்தை உயிரோட்டமாக வெளிப்படுத்துகிறது.
- source_word: בּוֹ
  choice: அதில்
  rationale: அருகிலுள்ள இயல்பான முன்னிலையான படிக்கட்டையே சுட்டுகிறது; அதேவேளை இலக்கண ரீதியில் சாத்தியமான வேறு சுட்டுதலை அடிக்குறிப்பில் பதிவு செய்கிறது.
theological_decisions:
- issue: סֻלָּם என்பதன் காட்சி வடிவம்
  choice: படிக்கட்டு
  alternative: ஏணி
  rationale: இந்த அரிய எபிரெயச் சொல் ஏறுவதற்கான ஓர் அமைப்பைக் குறிக்கிறது; படிக்கட்டா, படிகளுள்ள சாய்வுப்பாதையா, ஏணியா என்பதைத் துல்லியமாக நிர்ணயிக்காது. பல தூதர்கள் ஏறி இறங்கும் காட்சிக்கு 'படிக்கட்டு' இயல்பாக உள்ளது; பாரம்பரிய 'ஏணி' வாசிப்பைத் தேவையின்றி நீக்கவில்லை.
- issue: בּוֹ என்பதன் சுட்டுப்பொருள்
  choice: அதில்
  alternative: அவர்மேல்
  rationale: அருகிலுள்ள இயல்பான முன்னிலை படிக்கட்டு என்பதால் முதன்மை உரையில் 'அதில்' பயன்படுத்தப்படுகிறது. இருப்பினும் ஆண்பால் ஒருமை பின்னொட்டு வேறு முன்னிலையைச் சுட்டக்கூடிய இலக்கண வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. וְהִנֵּה என்பதன் இருமுறை வலியுறுத்தலும் 'இதோ' எனத் தக்கவைக்கப்பட்டது. முதன்மை உரையில் 'படிக்கட்டு' தேர்ந்தெடுக்கப்பட்டாலும், எபிரெயச் சொல்லை ஒரு குறிப்பிட்ட நவீன கட்டமைப்பாக மிகையாக வரையறுக்கவில்லை.
