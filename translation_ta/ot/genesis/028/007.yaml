  text: וַ/יִּשְׁמַ֣ע יַעֲקֹ֔ב אֶל אָבִ֖י/ו וְ/אֶל אִמּ֑/וֹ וַ/יֵּ֖לֶךְ פַּדֶּ֥נָֽ/ה אֲרָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/007.yaml
  text: and that Jacob listened to his father and his mother[a], and went to Paddan-aram.
translation:
  language: ta
  text: யாக்கோபு தன் தந்தைக்கும் தன் தாய்க்கும் செவிகொடுத்து பதான்-அராமுக்குப் போனதையும்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: செவிகொடுத்து
  rationale: שׁמע என்பதுடன் אֶל வரும்போது, ஒருவரின் சொல்லைக் கேட்டு அதன்படி நடப்பது என்ற பொருள் ஏற்படலாம். ‘செவிகொடுத்து’ என்பது கேட்டல், ஏற்றுக்கொள்ளுதல் ஆகிய இரு நுணுக்கங்களையும் இயல்பாகப் பேணுகிறது.
- source_word: אֶל אָבִיו וְאֶל אִמּוֹ
  choice: தன் தகப்பனுக்கும் தன் தாய்க்கும்
  rationale: எபிரெயத்தில் தகப்பன், தாய் இருவருக்கும் முன் אֶל மீண்டும் வருவதையும், இரு சொற்களிலும் உள்ள உடைமைப் பின்னொட்டுகளையும் தமிழில் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: וַיֵּלֶךְ
  choice: போனதையும்
  rationale: הלך என்பதன் நேரடியான பொருள் ‘போ’ என்பதாகும். இவ்வசனம் முந்தைய வசனத்தின் வாக்கிய அமைப்பைத் தொடருவதால், தொடர்ச்சியை உணர்த்த பெயரெச்சத் தொடர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: פַּדֶּנָה אֲרָם
  choice: பதான்-அராமுக்கு
  rationale: இது இடப்பெயர் என்பதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது; எபிரெய திசைகாட்டும் முடிவு தமிழின் ‘-க்கு’ வேற்றுமையால் காட்டப்படுகிறது.
- source_word: וַ
  choice: -உம் / மற்றும் தொடரமைப்பு
  rationale: தொடக்க வாவ் முந்தைய கூற்றோடு இணைக்கும் தொடர்ச்சியைக் குறிக்கிறது. தனிவசனமாகச் செயற்கையாக முழுமைப்படுத்தாமல், தமிழில் ‘-தையும்’ எனும் இணைத் தொடரால் அந்தச் சார்பு பேணப்பட்டுள்ளது.
