revisions:
- from: யாக்கோபு தன் தகப்பனுக்கும் தன் தாய்க்கும் செவிகொடுத்து[a], பதான்-அராமுக்குப் போனதையும்,
  to: யாக்கோபு தன் தந்தைக்கும் தன் தாய்க்கும் செவிகொடுத்து பதான்-அராமுக்குப் போனதையும்,
  rationale: 'The revision makes only safe stylistic and register-level corrections: it removes an unnecessary comma and substitutes the modern-standard தந்தை for the more traditional தகப்பன். The final -தையும் is retained because the Hebrew verse continues the syntax of Genesis 28:6. The footnote remains anchored to செவிகொடுத்து and preserves the contextual ‘obeyed’ alternative without making it the sole meaning.'
