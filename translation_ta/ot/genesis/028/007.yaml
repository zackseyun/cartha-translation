translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் எபிரெயத்திலும் முந்தைய வாக்கியத்தைச் சார்ந்திருப்பதால் இறுதியில் வரும் ‘-தையும்’ மூலம் அதன் தொடரமைப்பு பேணப்பட்டுள்ளது. ‘தகப்பன்’ என்பது வேதாகமச் சூழலுக்கேற்ற பரவலாகப் புரியும் சொலாகத் தேர்ந்தெடுக்கப்பட்டது.
