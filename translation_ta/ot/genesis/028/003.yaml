source:
  edition: WLC
  text: וְ/אֵ֤ל שַׁדַּי֙ יְבָרֵ֣ךְ אֹֽתְ/ךָ֔ וְ/יַפְרְ/ךָ֖ וְ/יַרְבֶּ֑/ךָ וְ/הָיִ֖יתָ לִ/קְהַ֥ל עַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/003.yaml
  text: And may God Almighty bless you[a], and make you fruitful, and multiply you[b], so that you may become an assembly of peoples.
translation:
  language: ta
  text: சர்வவல்லமையுள்ள கடவுள்[a] உன்னை ஆசீர்வதித்து, உன்னைப் பலுகவும் பெருகவும் செய்வாராக; நீ பல மக்களினங்களின் கூட்டமாக ஆவாயாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: “எல் ஷத்தாய்.” மரபாக, “சர்வவல்லமையுள்ள கடவுள்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: சர்வவல்லமையுள்ள கடவுள்
  rationale: தெய்வீகப் பட்டத்தை ஒலிபெயர்க்காமல் பொருளுடன் மொழிபெயர்க்கிறது; தமிழில் தெளிவாகவும் மரியாதைக்குரிய நடையிலும் உள்ளது. எபிரேய வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְבָרֵךְ
  choice: ஆசீர்வதித்து ... செய்வாராக
  rationale: ஆசீர்வாதச் சூழலில் உள்ள விருப்பவினைத் தன்மையை ‘செய்வாராக’ என்ற அமைப்பு இயல்பாக வெளிப்படுத்துகிறது; இது வெறும் எதிர்காலக் கூற்றாக மாற்றப்படவில்லை.
- source_word: וְיַפְרְךָ
  choice: உன்னைப் பலுகவும்
  rationale: ஹிஃபில் வடிவத்தின் காரணவினைப் பொருளைத் தக்கவைத்து, சந்ததிப் பெருக்கைக் குறிக்கும் ‘பலுகுதல்’ என்ற சொல்லைப் பயன்படுத்துகிறது.
- source_word: וְיַרְבֶּךָ
  choice: பெருகவும்
  rationale: எண்ணிக்கையிலும் சந்ததியிலும் மிகுதியாக்குதல் என்ற காரணவினைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְהָיִיתָ
  choice: ஆவாயாக
  rationale: ஆசீர்வாதத் தொடரின் விருப்பம் அல்லது எதிர்நோக்கிய விளைவு என்ற தொனியைப் பாதுகாக்கிறது; நோக்கம் மட்டுமே எனக் கட்டுப்படுத்தவில்லை.
- source_word: לִקְהַל עַמִּים
  choice: பல மக்களினங்களின் கூட்டமாக
  rationale: קהל என்பதன் கூடிய சமூகம் என்ற பொருளையும், עמים என்பதன் பன்மையையும் வெளிப்படுத்துகிறது; ‘பல’ என்பது தமிழில் அந்தப் பன்மையைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: אֵל שַׁדַּי என்ற தெய்வீகப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: சர்வவல்லமையுள்ள கடவுள்
  alternative: எல் ஷத்தாய்
  rationale: இது தனிப்பெயராக அல்லாமல் தெய்வீகப் பட்டமாகச் செயல்படுவதால், பிரதான உரையில் பொருள் மொழிபெயர்க்கப்படுகிறது. மூல எபிரேயப் பட்டத்தின் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: וְהָיִיתָ என்பதன் ஆசீர்வாதத் தொடர்பு
  choice: நீ ... ஆவாயாக
  alternative: அதனால் நீ ... ஆகும்படி
  rationale: எபிரேய வடிவம் விளைவு அல்லது விருப்பம் என இருவகை நிழலையும் தாங்கக்கூடும். ‘ஆவாயாக’ என்பது ஆசீர்வாதத் தொனியைப் பேணுவதோடு, அதை நோக்கப் பொருளாக மட்டும் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் வேதாகம ஆசீர்வாதத்திற்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘பலுகவும் பெருகவும்’ என்ற இணைப்பு மூலத்தின் இரு காரணவினைகளையும் சுருக்காமல் காக்கிறது; ‘மக்களினங்கள்’ என்பது பல தனித்த மக்கள் அல்லது இனக்குழுக்களைக் குறிக்கும் பன்மையைப் பாதுகாக்கிறது.
