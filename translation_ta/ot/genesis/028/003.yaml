  source_fidelity: மூல எபிரேயத்தின் ஆசீர்வாத/விருப்பத் தொனி தமிழில் நன்றாகப் பாதுகாக்கப்பட்டுள்ளது. אֵל שַׁדַּי, ஆசீர்வதித்தல், பலுகச் செய்தல், பெருகச் செய்தல், மற்றும் பல மக்களினங்களைக் கொண்ட கூட்டமாக ஆகுதல் ஆகிய எல்லா முக்கிய கூறுகளும் இடம்பெறுகின்றன. “ஆவாயாக” என்பது וְהָיִיתָ-வின் ஆசீர்வாத விளைவு/விருப்ப நிழலைக் காக்கிறது; அதை ஒரே நோக்கப் பொருளாகக் குறுக்கவில்லை.
  naturalness: உரை நவீன பொதுத்தமிழில் இயல்பாகவும், ஆசீர்வாத உரைக்கேற்ற கண்ணியமான நடையிலும் உள்ளது. “உன்னைப் பலுகவும் பெருகவும் செய்வாராக” என்ற இணை அமைப்பு இரு காரணவினைச் செயல்களையும் தெளிவாகத் தருகிறது. “பல மக்களினங்களின் கூட்டமாக” என்பது இலக்கணமாகவும் பொருளாகவும் ஏற்றது.
