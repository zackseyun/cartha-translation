base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/018.yaml
  text: Jacob rose early in the morning[a], took the stone that he had placed at his head, set it up as a pillar[c][b], and poured oil on its top.
translation:
  language: ta
  text: யாக்கோபு அதிகாலையில் எழுந்து, தன் தலைமாட்டில் வைத்திருந்த கல்லை எடுத்து, அதை ஒரு கல் தூணாக நிறுத்தி[a], அதன் உச்சியில்[b] எண்ணெய் ஊற்றினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதை ஒரு செங்குத்துக் கல்லாக நிறுத்தி.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “அதன் தலையில்.”
    reason: literal_rendering
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: அதிகாலையில் எழுந்து
  rationale: எபிரெயச் சொற்றொடர் சீக்கிரமாக எழுவதை வலியுறுத்துகிறது. ‘அதிகாலையில் எழுந்து’ என்பது இயல்பான நவீனத் தமிழ்; ‘காலையில் சீக்கிரமாக’ என்ற தேவையற்ற இரட்டிப்பைத் தவிர்க்கிறது.
- source_word: הָאֶבֶן
  choice: கல்லை
  rationale: குறிப்பிட்ட ஒரே கல்லைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: אֲשֶׁר שָׂם מְרַאֲשֹׁתָיו
  choice: தன் தலைமாட்டில் வைத்திருந்த
  rationale: מְרַאֲשֹׁתָיו என்பது தலை இருந்த பக்கம் அல்லது தலைமாட்டைக் குறிக்கிறது. மூலத்தில் தெளிவாக இல்லாத ‘தலைக்கு அடியில்’ என்ற பொருளைச் சேர்க்காமல் ‘தலைமாட்டில்’ என வழங்குகிறது.
- source_word: וַיָּשֶׂם אֹתָהּ מַצֵּבָה
  choice: அதை ஒரு கல் தூணாக நிறுத்தி
  rationale: מַצֵּבָה என்பது செங்குத்தாக நிறுத்தப்பட்ட கல் அல்லது தூண். ‘கல் தூண்’ பொருளின் தன்மையைத் தெளிவாக்குகிறது; ‘நினைவுச் சின்னம்’ போன்ற நோக்கவிளக்கத்தை மூலத்துக்கு அப்பால் சேர்ப்பதில்லை.
- source_word: וַיִּצֹק שֶׁמֶן
  choice: எண்ணெய் ஊற்றினான்
  rationale: வினைச்சொல் நேரடியாக ‘ஊற்றுதல்’ என்பதைக் குறிக்கிறது. ‘அபிஷேகம் செய்தான்’ என்பது இங்கே வெளிப்படையாகச் சொல்லப்படாத சடங்கியல் விளக்கத்தைச் சேர்க்கக்கூடும்.
- source_word: עַל רֹאשָׁהּ
  choice: அதன் உச்சியில்
  rationale: சொல்லுக்குச் சொல் ‘அதன் தலையில்’; உயிரற்ற கல் தூணைக் குறிக்கும் தமிழில் ‘உச்சியில்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
theological_decisions:
- issue: מַצֵּבָה என்பதற்கும் எண்ணெய் ஊற்றிய செயலுக்கும் இருக்கக்கூடிய வழிபாட்டுச் சார்ந்த முக்கியத்துவம்
  choice: செயலை மதிப்பிடாமல், கல் தூணாக நிறுத்தி எண்ணெய் ஊற்றியதாக விளக்கவுரையின்றி மொழிபெயர்த்தல்
  alternative: ‘நினைவுத் தூண்’ அல்லது ‘அபிஷேகம் செய்தான்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இவ்வசனம் யாக்கோபின் செயலை விவரிக்கிறது; அதை நேர்மறையாகவோ எதிர்மறையாகவோ இறையியல் அடிப்படையில் முன்கூட்டியே மதிப்பிடவில்லை. பின்னாளைய வேதாகமப் பகுதிகளில் இத்தகைய தூண்கள் வேறு சூழல்களில் மதிப்பிடப்படுவதால், இங்கு மூலத்தின் விளக்கமற்ற பதற்றத்தைப் பாதுகாப்பது பொருத்தம்.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட உரை. எபிரெயக் கதையோட்டத்தின் தொடர்ச்சியை இயல்பான தமிழ் வினையெச்சத் தொடரால் வெளிப்படுத்துகிறது. ‘தலைமாட்டில்’ என்பது ‘தலைக்கு அடியில்’ என மிகையாகத் தீர்மானிக்காமல் இடத்தைக் குறிக்கிறது; ‘கல் தூண்’ என்பது பொருளைத் தெளிவாகச் சொல்லும் நடுநிலையான தேர்வு.
