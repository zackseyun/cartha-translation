  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கதைத் தொடரின் ஓட்டம் இயல்பான தமிழில் தரப்பட்டதுடன், ‘கானானின் மகள்கள்’ என்ற மூலமொழிச் சொற்றொடர் அடிக்குறிப்பு விளக்கத்தோடு பாதுகாக்கப்பட்டுள்ளது.
