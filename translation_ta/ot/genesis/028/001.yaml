id: GEN.28.1
reference: Genesis 28:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּקְרָ֥א יִצְחָ֛ק אֶֽל יַעֲקֹ֖ב וַ/יְבָ֣רֶךְ אֹת֑/וֹ וַ/יְצַוֵּ֨/הוּ֙ וַ/יֹּ֣אמֶר ל֔/וֹ לֹֽא תִקַּ֥ח אִשָּׁ֖ה מִ/בְּנ֥וֹת כְּנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/001.yaml
  text: Then Isaac called Jacob and blessed him and commanded him[a], saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: ta
  text: 'பின்பு ஈசாக்கு யாக்கோபை அழைத்து, அவனை ஆசீர்வதித்து, அவனுக்குக் கட்டளையிட்டுச் சொன்னார்: “கானானின் மகள்களில் ஒருத்தியை[a] நீ மனைவியாக எடுத்துக்கொள்ளக் கூடாது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “கானானின் மகள்கள்”; இது கானானியப் பெண்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்து
  rationale: קרא என்பதற்கு ஒருவரை அழைத்தல் என்ற இயல்பான பொருள் இச்சூழலில் பொருந்துகிறது; மிகையான அதிகாரப்பூர்வத் தன்மையைச் சேர்க்கவில்லை.
- source_word: וַיְבָרֶךְ
  choice: ஆசீர்வதித்து
  rationale: ברך என்பதன் வழக்கமான மற்றும் துல்லியமான தமிழ் இணைச்சொல் ‘ஆசீர்வதித்தல்’ ஆகும்.
- source_word: וַיְצַוֵּהוּ
  choice: அவனுக்குக் கட்டளையிட்டு
  rationale: צוה அதிகாரத்துடன் கட்டளையிடுவதைக் குறிக்கிறது; தந்தையின் அறிவுறுத்தலிலுள்ள கட்டளை வலிமையை இது காக்கிறது.
- source_word: וַיֹּאמֶר לוֹ
  choice: சொன்னார்
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் எபிரெயச் சொல்லை இயல்பான தமிழில் தருகிறது.
- source_word: לֹא תִקַּח
  choice: நீ மனைவியாக எடுத்துக்கொள்ளக் கூடாது
  rationale: எதிர்மறை வினை வடிவத்தின் தடைப்பொருளைத் தெளிவான, நவீன தமிழில் காக்கிறது.
- source_word: אִשָּׁה
  choice: மனைவியாக
  rationale: திருமணச் சூழலில் אִשָּׁה என்பது பொதுவாக ‘மனைவி’ எனப் பொருள்படுகிறது.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: கானானின் மகள்களில் ஒருத்தியை
  rationale: ‘கானானின் மகள்கள்’ என்ற மூலமொழி உருவகத்தைத் தக்கவைத்து, ஒரு பெண்ணை மனைவியாகத் தேர்ந்தெடுப்பது என்பதையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַ
  choice: பின்பு
  rationale: கதைத் தொடர்ச்சியைக் குறிக்கும் தொடக்க வாவை நவீன தமிழில் இயல்பான காலவரிசை இணைப்பாகத் தருகிறது.
