  yaml_path: translation/ot/genesis/028/015.yaml
  text: And behold[a], I am with you, and I will keep you wherever you go, and I will bring you back to this land[c][b]. For I will not leave you until I have done what I have spoken to you.
translation:
  language: ta
  text: இதோ, நான் உன்னோடு இருக்கிறேன். நீ எங்கு சென்றாலும் உன்னைப் பாதுகாப்பேன்[a]; உன்னை இந்த நிலத்திற்குத் திரும்பக் கொண்டுவருவேன். ஏனெனில், நான் உனக்குச் சொல்லியிருப்பதைச் செய்து முடிக்கும்வரை உன்னைக் கைவிடமாட்டேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: ‘உன்னைக் கண்காணித்துப் பாதுகாப்பேன்.’'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: ‘உன்னை விட்டு நீங்கமாட்டேன்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: எபிரெய உரையின் கவனத்தை ஈர்க்கும், காட்சியை உயிர்ப்பிக்கும் உரையாடல் குறியை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: אָנֹכִי עִמָּךְ
  choice: நான் உன்னோடு இருக்கிறேன்
  rationale: தனிப்பட்ட இறைப் பிரசன்னத்தை நேரடியாக வெளிப்படுத்துகிறது; אָנֹכִי தரும் இயல்பான வலியுறுத்தலைச் சூழலும் ‘இதோ’ என்பதும் போதுமான அளவு சுமக்கின்றன.
- source_word: וּשְׁמַרְתִּיךָ
  choice: உன்னைக் காத்துக்கொள்வேன்
  rationale: שׁמר என்பதிலுள்ள பாதுகாத்தல், கண்காணித்தல் ஆகிய பொருள் நிழல்களை இயல்பான தமிழில் அளிக்கிறது.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: நீ எங்கெல்லாம் போகிறாயோ அங்கெல்லாம்
  rationale: யாக்கோபு செல்லும் எல்லா இடங்களையும் குறிக்கும் எபிரெயச் சொல்லமைப்பைத் தெளிவான தமிழ் மரபில் வழங்குகிறது.
- source_word: וַהֲשִׁבֹתִיךָ
  choice: உன்னைத் திரும்பக் கொண்டுவருவேன்
  rationale: שׁוב வினையின் காரணவினை வடிவத்தைத் தெளிவாகக் காட்டுகிறது; யாக்கோபு தானாகத் திரும்புவது மட்டுமல்ல, கடவுள் அவரைக் கொண்டுவருவதாக உரை கூறுகிறது.
- source_word: אֶל הָאֲדָמָה הַזֹּאת
  choice: இந்த நிலத்திற்கு
  rationale: אֲדָמָה என்பதற்கு ‘மண்/தரை’ என்ற பொருளும் இருந்தாலும், இங்கு யாக்கோபு திரும்பக் கொண்டுவரப்படும் புவியியல் இடத்தைக் குறிப்பதால் ‘நிலம்’ பொருத்தமானது.
- source_word: לֹא אֶעֱזָבְךָ
  choice: உன்னைக் கைவிடமாட்டேன்
  rationale: עזב என்பதின் ‘விட்டு நீங்குதல்/கைவிடுதல்’ பொருளையும், உறவு மற்றும் பாதுகாப்பின் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַד אֲשֶׁר אִם עָשִׂיתִי
  choice: செய்து முடிக்கும்வரை
  rationale: எதிர்கால நிறைவை நோக்கிய எபிரெயச் சொல்லமைப்பை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אֵת אֲשֶׁר דִּבַּרְתִּי לָךְ
  choice: நான் உன்னிடம் சொன்னதை
  rationale: דבר என்பது நேரடியாக ‘பேசுதல்/சொல்லுதல்’; சூழலில் அது வாக்குறுதியைக் குறித்தாலும், மொழிபெயர்ப்பில் ‘வாக்குறுதி அளித்ததை’ என்று விளக்கமாக மாற்றாமல் மூலத்தின் சொல் தேர்வைத் தக்கவைக்கிறது.
theological_decisions:
- issue: உடனிருப்பு, பாதுகாப்பு, மீள்வருதல், சொன்னதை நிறைவேற்றுதல் ஆகிய இறை உறுதிமொழிகள்
  choice: உரையில் உள்ள நான்கு உறுதிகளையும் நேரடியாகவும் ஒன்றுக்கொன்று இணைந்தவையாகவும் மொழிபெயர்த்தல்
  alternative: பிற்கால வேதாகமச் சொற்பயன்பாட்டுடன் ஒத்திசைக்க மேலும் மரபார்ந்த சமயச் சொற்களைப் பயன்படுத்துதல்
  rationale: இவ்வசனம் யாக்கோபுக்குக் கடவுள் அளிக்கும் தனிப்பட்ட உறுதியை முன்வைக்கிறது. பிற்கால இறையியல் வடிவங்களை இங்கு சேர்க்காமல் உரையின் உடன்படிக்கை சார்ந்த ஒலிப்பைத் தக்கவைக்கிறது.
- issue: ‘செய்து முடிக்கும்வரை’ என்பதன் கால எல்லை
  choice: עַד என்பதின் ‘வரை’ அமைப்பைத் தக்கவைத்தல்
  alternative: அதன்பின் கடவுள் கைவிடுவார் என்ற தவறான உட்பொருளைத் தவிர்க்க ‘நிறைவேற்றாமல் கைவிடமாட்டேன்’ என மாற்றியமைத்தல்
  rationale: மூலத்தின் காலவியல் அமைப்பை மறைக்காமல் வைத்திருக்கிறது. இங்கு ‘வரை’ என்பது வாக்குறுதி நிறைவேறும் உறுதியை வலியுறுத்துகிறது; நிறைவேற்றிய பின் உடனிருப்பு முடியும் என்று உரை வெளிப்படையாகக் கூறவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் நேர்த்தியும் கொண்ட நேரடி இறை உரையாக வடிவமைக்கப்பட்டுள்ளது. ‘இதோ’ என்ற வேதாகமச் சொல் இன்றும் தெளிவாக இருப்பதாலும் மூலத்தின் உரையாடல் வலிமையைத் தக்கவைப்பதாலும் பயன்படுத்தப்பட்டுள்ளது. அளவுக்கு மீறிய மரபுச் சமயச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
