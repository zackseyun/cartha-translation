base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/015.yaml
  text: And as dawn was rising[a], the angels urged Lot, saying, “Get up, take your wife and your two daughters who are here, lest you be swept away in the punishment of the city.”
translation:
  language: ta
  text: விடியல் எழுந்துகொண்டிருந்தபோது, தூதர்கள் லோத்தை அவசரப்படுத்தி, “எழுந்திரு; உன் மனைவியையும் இங்கே இருக்கும் உன் இரண்டு மகள்களையும் அழைத்துக்கொள். இல்லையென்றால், நகரத்தின் தண்டனையில் நீயும் அழிந்துபோவாய்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நகரத்தின் அக்கிரமத்தில்”; அல்லது, “நகரத்தின் குற்றப்பொறுப்பினால்.” இதற்கான எபிரேயச் சொல் அக்கிரமம், குற்றப்பொறுப்பு, அல்லது குற்றத்தினால் வரும் தண்டனை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְמוֹ הַשַּׁחַר עָלָה
  choice: விடியல் எழுந்துகொண்டிருந்தபோது
  rationale: כְמוֹ இங்கு காலப்பொருளைத் தருகிறது; עָלָה என்பதன் ‘எழுதல்’ உருவகத்தையும் இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: וַיָּאִיצוּ
  choice: அவசரப்படுத்தி
  rationale: உடனடியாகச் செயல்படும்படி நெருக்கி வற்புறுத்தும் பொருளைச் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַמַּלְאָכִים
  choice: தூதர்கள்
  rationale: מַלְאָךְ என்பதன் அடிப்படைப் பொருள் ‘தூதர்’; இச்சூழலில் இவர்கள் இறைத்தூதர்கள் என்பது முந்தைய நிகழ்விலிருந்து தெளிவாகிறது. ‘தூதர்கள்’ என்பது சொற்பொருளையும் சூழலையும் தாங்குகிறது.
- source_word: קוּם קַח
  choice: எழுந்திரு; … அழைத்துக்கொள்
  rationale: இரு கட்டளைகளும் தனித்தனியாகத் தக்கவைக்கப்படுகின்றன. குடும்பத்தினரை உடன் கூட்டிச் செல்வதைத் தமிழில் இயல்பாகக் கூற ‘அழைத்துக்கொள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶת אִשְׁתְּךָ וְאֶת שְׁתֵּי בְנֹתֶיךָ
  choice: உன் மனைவியையும் உன் இரண்டு மகள்களையும்
  rationale: உறவுமுறைகளையும் குறிப்பிடப்பட்ட எண்ணிக்கையையும் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: הַנִּמְצָאֹת
  choice: இங்கே இருக்கும்
  rationale: சொல்லின் ‘காணப்படுகிற/உடனிருக்கிற’ பொருளை இச்சூழலில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: פֶּן תִּסָּפֶה
  choice: இல்லையென்றால், … நீயும் அழிந்துபோவாய்
  rationale: פֶּן தரும் எச்சரிக்கையையும், நகரத்தோடு சேர்ந்து அழிவுக்குள்ளாகும் அபாயத்தைச் சுட்டும் ספָה வினையின் நிபால் வடிவத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: בַּעֲוֺן הָעִיר
  choice: நகரத்துக்கான தண்டனையில்
  rationale: עָוֹן என்பது அக்கிரமம், அதனால் உண்டான குற்றப்பொறுப்பு, அல்லது அதன் தண்டனை ஆகியவற்றைக் குறிக்கலாம். உடனடி சூழலில் வரவிருக்கும் தீர்ப்பின் விளைவு முன்னிலையிலிருப்பதால் ‘தண்டனை’ முதன்மை உரையில் தரப்பட்டு, பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: தீர்ப்புச் சூழலில் עָוֹן என்பதன் பொருள்
  choice: நகரத்துக்கான தண்டனை
  alternative: நகரத்தின் அக்கிரமம்; நகரத்தின் குற்றத்தினால்
  rationale: லோத்து நகரத்தின் பாவத்தில் பங்கெடுப்பார் என்று உரை கூறாமல், அதன்மீது வரும் அழிவில் அவரும் சிக்கிக்கொள்ளும் அபாயத்தை எச்சரிக்கிறது. எனினும் எபிரேயச் சொல்லின் பாவம்–குற்றப்பொறுப்பு–தண்டனை என்ற உண்மையான பொருள் விரிவை அடிக்குறிப்பு வெளிப்படையாகத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. கட்டளையின் அவசரத்தன்மை நேரடியான உரையால் வெளிப்படுத்தப்பட்டு, மூலத்தின் பொருள் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
