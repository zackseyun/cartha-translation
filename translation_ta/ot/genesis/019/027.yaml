base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/027.yaml
  text: Abraham rose early in the morning to the place where he had stood before Yahweh[a].
translation:
  language: ta
  text: ஆபிரகாம் அதிகாலையில் எழுந்து, யாவேயின் முன்னிலையில் அவன் நின்றிருந்த இடத்துக்குச் சென்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘யாவேயின் முகத்துக்கு முன்பாக.’ இது ‘யாவேக்கு முன்பாக’ அல்லது ‘யாவேயின் முன்னிலையில்’ என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: அதிகாலையில் எழுந்து
  rationale: שׁכם என்பதன் ஹிஃபில் வடிவம் அதிகாலையில் எழுவதைக் குறிக்கிறது. அடுத்துள்ள בַּבֹּקֶר உடன் சேர்த்து, காலத்தின் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּבֹּקֶר
  choice: அதிகாலையில்
  rationale: இந்தச் சொல் ‘காலையில்’ எனப் பொருள்படும்; וַיַּשְׁכֵּם உடன் இணைவதால் செயல் வெகு காலையிலேயே நடந்தது என்பதைக் ‘அதிகாலையில்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֶל הַמָּקוֹם
  choice: இடத்திற்குச் சென்றான்
  rationale: אֶל திசையையும் מָקוֹם இடத்தையும் குறிக்கின்றன. எபிரெய வாக்கியத்தில் இயக்கம் திசைச் சொற்றொடரால் உணர்த்தப்படுவதால், தமிழில் முழுமையான இயல்பான வாக்கியமாக ‘இடத்திற்குச் சென்றான்’ என வழங்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר עָמַד שָׁם
  choice: தான் ... நின்றிருந்த இடம்
  rationale: இந்த உறவுநிலைத் தொடர் முன்பு நிகழ்ந்த சம்பவத்தைச் சுட்டுகிறது. שָׁם என்பதன் ‘அங்கே’ என்ற கருத்து தமிழில் ‘இடம்’ என்ற அமைப்புக்குள் இயல்பாக அடங்குகிறது.
- source_word: אֶת פְּנֵי
  choice: முன்பாக
  rationale: עמד את־פני என்பது ஒருவருக்கு முன்பாக அல்லது அவரது முன்னிலையில் நிற்பதைக் குறிக்கும் மரபுத்தொடர். ‘முகத்திற்கு முன்பாக’ என்ற சொற்சொல் மொழிபெயர்ப்பைவிட ‘முன்பாக’ இயல்பானதும் பொருளைத் துல்லியமாகக் காப்பதும் ஆகும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல எபிரெய உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே பட்டப்பெயரான ‘கர்த்தர்’ என்பதற்குப் பதிலாக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது; ‘யெகோவா’ என்பது பிற்கால கலப்பு உச்சரிப்பைச் சார்ந்தது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூலத்தின் அதிகாலை நேர வலியுறுத்தலும், ஆபிரகாம் முன்பு நின்றிருந்த இடத்திற்குத் திரும்பிச் சென்ற கதைத் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
