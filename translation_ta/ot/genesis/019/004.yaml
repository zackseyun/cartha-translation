base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/004.yaml
  text: Before they lay down[a], the men of the city, the men of Sodom, surrounded the house—from young to old[c][b], all the people from every quarter.
translation:
  language: ta
  text: அவர்கள் படுத்துக்கொள்வதற்கு முன், நகரத்தின் ஆண்கள்—சோதோமின் ஆண்கள்—அந்த வீட்டைச் சூழ்ந்துகொண்டார்கள்[a]; இளைஞர் முதல் முதியவர் வரை, நகரின் எல்லாப் பகுதிகளிலிருந்தும் வந்த மக்கள் அனைவரும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சூழ்ந்துகொண்டார்கள்” என்பதற்கு “வீட்டைச் சுற்றி நின்றார்கள்” அல்லது “வீட்டைச் சுற்றிக் கூடினார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை சுற்றிவளைத்தலையோ சுற்றிக் கூடுதலையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நகரின் எல்லாப் பகுதிகளிலிருந்தும்” என்பது சொல்லளவில் “எல்லையிலிருந்து” அல்லது “முனையிலிருந்து”; இங்கு நகரின் எல்லாத் திசைகளிலிருந்தும் வந்ததைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם יִשְׁכָּבוּ
  choice: அவர்கள் படுத்துக்கொள்வதற்கு முன்
  rationale: இரவில் படுக்கச் செல்வதைக் குறிக்கும் காலத் தொடரை இயல்பான தமிழில் தருகிறது; மூலத்தின் நேரடியான ‘படுத்துக்கொள்’ என்ற வினை உணர்வையும் காக்கிறது.
- source_word: אַנְשֵׁי הָעִיר אַנְשֵׁי סְדֹם
  choice: நகரத்து ஆண்களாகிய சோதோமின் ஆண்கள்
  rationale: இரண்டு இணைநிலை அடையாளங்களையும் ஆண்பால் குறிப்பையும் காக்கிறது; முதல் தொடர் அடுத்த தொடரால் விளக்கப்படுவதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: נָסַבּוּ עַל הַבַּיִת
  choice: அந்த வீட்டைச் சூழ்ந்துகொண்டார்கள்
  rationale: נסב என்பதன் சுற்றிவளைத்தல் அல்லது சுற்றிக் கூடுதல் என்ற பொருள்களில், சூழலுக்குரிய அடைத்துநிற்கும் கூட்டத்தின் உணர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: இளைஞன் முதல் முதியவர் வரை
  rationale: முழு வயது வரம்பையும் குறிக்கும் இருமுனைச் சொல்லாட்சியை நேரடியாகவும் வாசிக்க எளிதாகவும் தருகிறது.
- source_word: כָּל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: עָם என்ற கூட்டுப்பெயரின் விரிவான பொருளைக் காக்கிறது; முன்னுள்ள ஆண்பால் குறிப்பை இங்கே தேவையின்றி மீண்டும் குறுக்குவதில்லை.
- source_word: מִקָּצֶה
  choice: நகரின் எல்லாப் பகுதிகளிலிருந்தும்
  rationale: சொல்லளவில் ‘முனை/எல்லை’ என்றாலும், இச்சூழலில் நகரின் எல்லாத் திசைகள் அல்லது பகுதிகளிலிருந்தும் என்பதே இயல்பான கருத்து.
theological_decisions:
- issue: கூட்டத்தை விவரிக்கும் பாலினக் குறிப்பு
  choice: אַנְשֵׁי என்பதற்கு ‘ஆண்கள்’ என்றும், כָּל הָעָם என்பதற்கு ‘மக்கள் அனைவரும்’ என்றும் வேறுபடுத்தப்பட்டுள்ளது.
  alternative: எல்லா இடங்களிலும் பொதுவாக ‘மக்கள்’ என்று மொழிபெயர்த்தல்.
  rationale: எபிரெய மூலத்தில் முதலில் திட்டவட்டமான ஆண்பால் சொல் வந்து, பின்னர் விரிவான கூட்டுப்பெயர் வருகிறது. இந்த வேறுபாட்டைத் தக்கவைப்பது மூலத்தைத் துல்லியமாகப் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான வேதாகம நடையுடன் வடிவமைக்கப்பட்டது. ‘நகரத்து ஆண்களாகிய சோதோமின் ஆண்கள்’ என்ற சிறிது முறையான அமைப்பு, மூலத்திலுள்ள இணைநிலை மீளுரையைப் பாதுகாக்கிறது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
