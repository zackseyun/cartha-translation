  naturalness: “நகரத்து ஆண்களாகிய சோதோமின் ஆண்கள்” is grammatically understandable but stylistically heavy in modern standard Tamil. “நகரத்தின் ஆண்கள்—சோதோமின் ஆண்கள்—” is natural while preserving the emphatic apposition. The footnote markers should be placed at the words to which their notes refer.
