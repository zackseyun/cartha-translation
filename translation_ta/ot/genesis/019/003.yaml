base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/003.yaml
  text: But he urged them strongly[a], so they turned aside to him and entered his house. He prepared a feast for them, baked unleavened bread[b], and they ate.
translation:
  language: ta
  text: ஆனால் அவர் அவர்களை மிகவும் வற்புறுத்தினார்[a]; அவர்கள் அவர் பக்கம் திரும்பி, அவருடைய வீட்டுக்குள் சென்றார்கள். அவர் அவர்களுக்கு ஒரு விருந்து ஆயத்தம் செய்து, புளிப்பில்லாத அப்பங்களைச் சுட்டார்[b]; அவர்கள் சாப்பிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை மிகுந்த வலியுறுத்தலுடன் வற்புறுத்தினார்.”
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில் பன்மை: “புளிப்பில்லாத அப்பங்கள்” அல்லது “புளிப்பில்லாத அடைகள்”; புளிப்பூட்டாமல் செய்யப்பட்ட அப்பத்தைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצַר בָּם מְאֹד
  choice: அவர் அவர்களை மிகவும் வற்புறுத்தியதால்
  rationale: פצר என்பது ஒருவரை இணங்கச் செய்ய வலுவாக வற்புறுத்துவதைக் குறிக்கிறது; מְאֹד அதன் தீவிரத்தை ‘மிகவும்’ என்று வெளிப்படுத்துகிறது. தமிழில் காரணத் தொடர்புடன் அமைப்பது அடுத்த செயலின் இயல்பான தொடர்ச்சியைத் தெளிவாக்குகிறது.
- source_word: וַיָּסֻרוּ אֵלָיו
  choice: அவர்கள் அவரிடம் திரும்பி
  rationale: סור என்பதன் அடிப்படை ‘விலகித் திரும்புதல்’ என்ற இயக்கப் படிமத்தையும் אֵלָיו என்பதன் ‘அவரிடம்’ என்ற நோக்கையும் காக்கிறது.
- source_word: וַיָּבֹאוּ אֶל־בֵּיתוֹ
  choice: அவருடைய வீட்டுக்குள் சென்றார்கள்
  rationale: இலக்கை நோக்கிய இயக்கத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; சூழலில் வீட்டிற்குள் நுழைந்தது தெளிவாகிறது.
- source_word: מִשְׁתֶּה
  choice: ஒரு விருந்து
  rationale: இந்தச் சொல் விருந்து அல்லது விருந்துணவைச் சுட்டுகிறது; குடிப்பதை தேவையின்றி முன்னிலைப்படுத்தாமல் அதன் பரந்த பொருளைக் காக்கிறது.
- source_word: מַצּוֹת אָפָה
  choice: புளிப்பில்லாத அப்பங்களைச் சுட்டார்
  rationale: מַצּוֹת என்பது பன்மை வடிவில் புளிப்பூட்டப்படாத அப்பங்கள் அல்லது அடைகளைக் குறிக்கிறது; אָפָה என்ற வெளிப்படையான ‘சுடுதல்’ வினையும் காக்கப்பட்டுள்ளது.
- source_word: וַיֹּאכֵלוּ
  choice: அவர்கள் சாப்பிட்டார்கள்
  rationale: எளிய கதைநடை முடிவை இயல்பான நவீன தமிழில் நேரடியாக வழங்குகிறது.
