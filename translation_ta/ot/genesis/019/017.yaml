base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/017.yaml
  text: And as they brought them outside[a], he said, “Escape for your life. Do not look behind you, and do not stop anywhere in the plain. Escape to the hills[c][b], lest you be swept away.”
translation:
  language: ta
  text: அவர்கள் அவர்களை வெளியே கொண்டுவந்தபோது, அவர், “உன் உயிரைக் காத்துக்கொள்ளத் தப்பிச் செல்! உனக்குப் பின்னே பார்க்காதே[a]. சமவெளியின் எந்த இடத்திலும் நின்றுவிடாதே. மலைப்பகுதிக்குத் தப்பிச் செல்[b]; இல்லையெனில் நீ அழிந்துபோவாய்[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திரும்பிப் பார்க்காதே.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மலைக்கு’ அல்லது ‘மலைநாட்டுக்கு.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘நீ அழிக்கப்படாதபடி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוּצָה
  choice: வெளியே
  rationale: இது நகரம் அல்லது உள்ளிடத்திலிருந்து வெளிப்புறத்தை நோக்கிய நகர்வைக் குறிக்கும் திசை வினையடை; ‘வெளியே’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: הִמָּלֵט
  choice: தப்பிச் செல்
  rationale: מלט என்பதன் நிபால் கட்டளை வடிவம் அவசரமாகத் தப்பிப் பிழைப்பதைக் குறிக்கிறது. இரு இடங்களிலும் ஒரே சொற்றொடரைப் பயன்படுத்தி மூலத்தின் மீளுரையைப் பேணுகிறது.
- source_word: עַל נַפְשֶׁךָ
  choice: உன் உயிரைக் காத்துக்கொள்ள
  rationale: ஒருவரின் உயிரைப் பாதுகாத்துக்கொள்வதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் இயல்பான தமிழாக்கம்; கட்டளையின் அவசரத்தையும் வெளிப்படுத்துகிறது.
- source_word: אַל תַּבִּיט אַחֲרֶיךָ
  choice: உனக்குப் பின்னால் பார்க்காதே
  rationale: தனக்குப் பின்னால் நோக்கிப் பார்ப்பதை நேரடியாகக் குறிக்கும் மூலத்தின் இடவியல் படிமத்தைப் பேணுகிறது; ‘திரும்பிப் பார்க்காதே’ என்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְאַל תַּעֲמֹד
  choice: நின்றுவிடாதே
  rationale: இச்சூழலில் עמד என்பது வெறுமனே நிற்பதைவிடத் தப்பிச் செல்லும் வழியில் நின்றுவிடுதல் அல்லது தங்கிவிடுதலைக் குறிக்கிறது.
- source_word: בְּכָל הַכִּכָּר
  choice: சமவெளியின் எந்த இடத்திலும்
  rationale: כִּכָּר இங்கு யோர்தான் சமவெளிப் பகுதியைக் குறிக்கிறது; בְּכָל என்பதன் விரவிய மறுப்புப் பொருளை ‘எந்த இடத்திலும்’ இயல்பாக எடுத்துரைக்கிறது.
- source_word: הָהָרָה
  choice: மலைப்பகுதிக்கு
  rationale: திசையைக் குறிக்கும் இவ்வடிவம் ஒரு மலை, மலைநாடு அல்லது மேட்டுநிலப் பகுதியைக் குறிக்கலாம். ‘மலைப்பகுதி’ சமவெளியுடனான நிலவியல் முரணைப் பேணுவதோடு எண்ணிக்கை பற்றிய குழப்பத்தை மிகையாகத் தீர்மானிப்பதில்லை.
- source_word: פֶּן תִּסָּפֶה
  choice: இல்லையெனில் நீயும் சேர்ந்து அழிந்துபோவாய்
  rationale: נספה என்பதன் நிபால் வடிவம் வரவிருக்கும் அழிவில் மற்றவர்களோடு சேர்ந்து அழிந்துபோதலைக் குறிக்கக்கூடும். ‘நீயும் சேர்ந்து’ என்பது அந்தச் சேர்த்தழிக்கப்படும் நிழற்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பேசுபவர் யார் என்பது
  choice: ‘அவர் ... என்றார்’ என்று ஒருமையில் வழங்கப்பட்டது.
  alternative: தூதர்கள் கூட்டாகப் பேசுவதாகக் கொண்டு ‘அவர்கள் கூறினார்கள்’ என வழங்குதல்; அல்லது ‘தேவதூதர் கூறினார்’ என்று வெளிப்படையாக அடையாளப்படுத்துதல்.
  rationale: எபிரெய வினைச்சொல் ஒருமையில் உள்ளது. பேசுபவர் எந்தத் தூதர் என்பதை உரை தெளிவுபடுத்தாததால், அந்த விவரத்தை மொழிபெயர்ப்பு ஊகித்து நிரப்பாமல் இலக்கண ஒருமையைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் அவசரமான கட்டளைத் தொனி பேணப்பட்டுள்ளது. ‘தப்பிச் செல்’ என்ற மீளுரை மூல எபிரெயத்தின் அமைப்பைத் தக்கவைக்கிறது; பேசுபவரின் அடையாளமும் הָהָרָה என்பதன் நிலவியல் பரப்பும் தேவையற்ற வகையில் குறுக்கித் தீர்மானிக்கப்படவில்லை.
