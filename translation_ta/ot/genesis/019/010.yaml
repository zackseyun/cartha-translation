  yaml_path: translation/ot/genesis/019/010.yaml
  text: But the men reached out their hands and brought Lot into the house with them[c][b][a], and shut the door.
translation:
  language: ta
  text: ஆனால் அந்த ஆண்கள்[a] தங்கள் கைகளை நீட்டி[b], லோத்தைத் தங்களோடு வீட்டுக்குள் கொண்டுவந்து கதவை மூடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவர்கள் தேவதூதர்கள் என்பது பரந்த கதைச்சூழலில் தெளிவாகிறது; எபிரெயத்தில் இங்கு ‘அந்த ஆண்கள்’ என்றே உள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘தங்கள் கைகளை விரித்தனர்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: அந்த ஆண்கள்
  rationale: எபிரெயச் சொல் நேரடியாக ‘அந்த ஆண்கள்’ எனப் பொருள்படும். விரிந்த சூழலில் அவர்கள் தேவதூதர்கள் என்பது தெரிந்தாலும், இவ்வசனத்தின் சொல்வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּשְׁלְחוּ אֶת יָדָם
  choice: தங்கள் கைகளை நீட்டி
  rationale: ‘கையை அனுப்புதல்’ என்ற எபிரெய மரபுத்தொடர், உடலால் கையை நீட்டுவதைக் குறிக்கிறது. பன்மை எழுவாய்க்கேற்ற இயல்பான தமிழில் ‘கைகளை’ என வழங்கப்பட்டுள்ளது.
- source_word: וַיָּבִיאוּ
  choice: கொண்டுவந்து
  rationale: בוא என்பதன் ஹிஃபீல் வடிவம் ‘வரச்செய்/கொண்டுவா’ என்று பொருள்படும். சூழலில் அவசரம் இருந்தாலும், ‘இழுத்தனர்’ என்ற கூடுதல் கருத்தைச் சேர்க்காமல் அடிப்படைப் பொருள் தரப்படுகிறது.
- source_word: אֲלֵיהֶם הַבָּיְתָה
  choice: தங்களோடு வீட்டுக்குள்
  rationale: லோத்து அவர்கள் இருந்த இடத்தை நோக்கி, வீட்டுக்குள் கொண்டுவரப்பட்டார் என்ற இரு கூறுகளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַדֶּלֶת
  choice: கதவை
  rationale: דֶּלֶת என்பதற்கான நேரடியான, இயல்பான தமிழ்ச் சொல் ‘கதவு’.
- source_word: סָגָרוּ
  choice: மூடினார்கள்
  rationale: வினையின் சாதாரண பொருளான ‘மூடுதல்’ என்பதைத் தெளிவாகவும் கதைநடைக்கு ஏற்றவாறும் தருகிறது.
- source_word: וַ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூட்டம் கதவை உடைக்க முனைந்த செயலுக்கு எதிராக இங்கு நிகழும் தலையீட்டை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: הָאֲנָשִׁים என்பவர்களை மொழிபெயர்ப்பிலேயே தேவதூதர்கள் என்று அடையாளப்படுத்துவதா
  choice: முதன்மை உரையில் ‘அந்த ஆண்கள்’ என்று வைத்தல்
  alternative: ‘அந்த தேவதூதர்கள்’ அல்லது ‘அந்த வருகையாளர்கள்’
  rationale: கதைச்சூழல் அவர்கள் தேவதூதர்கள் என்பதை உணர்த்தினாலும், இவ்வசனம் பயன்படுத்தும் சாதாரண மனிதக் குறிப்பு பாதுகாக்கப்படுகிறது; விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் விரைவான தொடர்ச்சிச் செயல்கள் ஒரே வாக்கியத்தில் இயல்பாகப் பாதுகாக்கப்பட்டுள்ளன.
