  to: 'தேவன் சமவெளியிலிருந்த பட்டணங்களை அழித்தபோது, இவ்வாறு நிகழ்ந்தது: தேவன் ஆபிரகாமை நினைவுகூர்ந்தார்[a]; லோத்து குடியிருந்த பட்டணங்களைக் கவிழ்த்தபோது, அந்தப் பேரழிவின்[b] நடுவிலிருந்து லோத்தை வெளியே அனுப்பினார்.'
