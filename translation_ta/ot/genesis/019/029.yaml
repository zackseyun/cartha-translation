base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/029.yaml
  text: So it happened[a], when God destroyed the cities of the plain, that God remembered Abraham and sent Lot out of the midst of the overthrow[d][c][b], when he overthrew the cities in which Lot had lived.
translation:
  language: ta
  text: 'தேவன் சமவெளியிலிருந்த பட்டணங்களை அழித்தபோது, இவ்வாறு நிகழ்ந்தது: தேவன் ஆபிரகாமை நினைவுகூர்ந்தார்[a]; லோத்து குடியிருந்த பட்டணங்களைக் கவிழ்த்தபோது, அந்தப் பேரழிவின்[b] நடுவிலிருந்து லோத்தை வெளியே அனுப்பினார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தேவன் ஆபிரகாமை நினைவுகூர்ந்தார்’ என்பது, அவர் ஆபிரகாமை மறந்திருந்தார் என்று பொருளல்ல; ஆபிரகாம்மீது உண்மையுள்ள அக்கறை கொண்டு அதற்கேற்ப செயல்பட்டார் என்பதைக் குறிக்கும் எபிரெயச் சொல்வழக்கு.
    reason: cultural_note
  - marker: b
    text: இங்கே ‘பேரழிவு’ என்பதற்கான எபிரெயப் பெயர்ச்சொல், அடுத்து வரும் ‘கவிழ்த்தபோது’ என்ற வினையுடன் தொடர்புடையது; இரண்டிலும் கவிழ்த்தல் அல்லது தலைகீழாக்குதல் என்னும் கருத்து உள்ளது. இதை ‘அழிவு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: இவ்வாறு நிகழ்ந்தது
  rationale: எபிரெயக் கதைநடையின் நிகழ்வறிமுக அமைப்பைப் பாதுகாத்து, நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: בְּשַׁחֵת
  choice: அழித்தபோது
  rationale: ב முன்னொட்டுடன் வரும் வினையெச்சப் பெயரின் காலச்சூழல் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: עָרֵי הַכִּכָּר
  choice: சமவெளிப் பட்டணங்கள்
  rationale: இங்கு כִּכָּר என்பது யோர்தான் சமவெளிப் பகுதியைக் குறிக்கிறது; ‘சமவெளி’ சூழலுக்கேற்ற இயல்பான தமிழ்.
- source_word: וַיִּזְכֹּר אֱלֹהִים אֶת אַבְרָהָם
  choice: தேவன் ஆபிரகாமை நினைவுகூர்ந்து
  rationale: தெய்வீக ‘நினைவுகூருதல்’ என்னும் வேதாகமச் சொல்வழக்கை விளக்கவுரையாக மாற்றாமல் பாதுகாக்கிறது; தமிழில் வாக்கியத் தொடர்பிற்காக வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיְשַׁלַּח אֶת לוֹט
  choice: லோத்தை வெளியே அனுப்பினார்
  rationale: שׁלח என்பதன் அடிப்படை ‘அனுப்பு’ பொருளையும், அழிவிலிருந்து வெளியே செல்லச் செய்த சூழலையும் காக்கிறது; ‘மீட்டார்’ என்ற விளக்கப் பொருளை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: מִתּוֹךְ הַהֲפֵכָה
  choice: அந்தப் பேரழிவின் நடுவிலிருந்து
  rationale: תּוֹךְ என்பதன் ‘நடுவிலிருந்து’ பொருளைத் தக்கவைக்கிறது. הֲפֵכָה-வின் கவிழ்த்தல் சார்ந்த நுணுக்கம் இயல்பான தமிழுக்காக ‘பேரழிவு’ என வழங்கப்பட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: בַּהֲפֹךְ
  choice: கவிழ்த்தபோது
  rationale: הפך என்பதன் கவிழ்த்தல்/தலைகீழாக்குதல் நுணுக்கத்தையும் காலச்சூழலைக் குறிக்கும் ב முன்னொட்டின் பொருளையும் காக்கிறது.
- source_word: אֲשֶׁר יָשַׁב בָּהֵן לוֹט
  choice: லோத்து குடியிருந்த பட்டணங்கள்
  rationale: ישׁב இங்கு லோத்தின் வசிப்பிடத்தைக் குறிக்கிறது; ‘குடியிருந்த’ என்பது இயல்பான, மரியாதையான நவீன தமிழ்.
theological_decisions:
- issue: ‘தேவன் ஆபிரகாமை நினைவுகூர்ந்தார்’ என்பதன் பொருள்
  choice: ‘நினைவுகூர்ந்து’ என்ற எபிரெயச் சொல்வழக்கை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘ஆபிரகாமை முன்னிட்டு தேவன் செயல்பட்டார்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: தெய்வீக நினைவுகூருதல் செயலில் வெளிப்படும் உண்மையுள்ள அக்கறையைக் குறிக்கலாம்; ஆனால் முதன்மை உரையிலேயே அந்த விளக்கத்தைச் சேர்ப்பது மூலத்தின் இறையியல் நிறைவையும் திறந்த தன்மையையும் குறைக்கும்.
- issue: லோத்தை வெளியே அனுப்பிய செயலை விவரித்தல்
  choice: ‘வெளியே அனுப்பினார்’
  alternative: ‘மீட்டார்’
  rationale: சூழலில் இது மீட்புச் செயல் என்றாலும், மூலத்தில் שׁלח (‘அனுப்பு’) உள்ளது. ஆகவே விளக்கமான ‘மீட்டார்’ என்பதற்குப் பதிலாக மூல வினையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பட்டணம்’, ‘நினைவுகூர்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; அரிதான நேரடி சொல் உருவாக்கங்களைத் தவிர்த்து, மூலத்தின் சொல் தொடர்பு அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
