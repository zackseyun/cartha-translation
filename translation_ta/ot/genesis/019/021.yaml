source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֔י/ו הִנֵּה֙ נָשָׂ֣אתִי פָנֶ֔י/ךָ גַּ֖ם לַ/דָּבָ֣ר הַ/זֶּ֑ה לְ/בִלְתִּ֛י הָפְכִּ֥/י אֶת הָ/עִ֖יר אֲשֶׁ֥ר דִּבַּֽרְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/021.yaml
  text: 'And he said to him[a], “Look, I grant you this request also: I will not overthrow the city of which you have spoken.”'
translation:
  language: ta
  text: அவன் அவனிடம், “இதோ, இந்த வேண்டுகோளையும் ஏற்றுக்கொள்கிறேன்[a]; நீ குறிப்பிட்ட அந்த நகரத்தை நான் கவிழ்த்துப்போட மாட்டேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மரபுத்தொடர்: “உன் முகத்தை உயர்த்தினேன்”; இதன் பொருள், “உனக்குத் தயவு காட்டினேன்” அல்லது “உன் வேண்டுகோளை ஏற்றுக்கொள்கிறேன்” என்பதாகும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: பேச்சாளரின் பதிலுக்கு கவனம் ஈர்க்கும் எபிரெயச் சொல்லின் உரையாடல் செயல்பாட்டை இயல்பாகத் தக்கவைக்கிறது.
- source_word: נָשָׂאתִי פָנֶיךָ
  choice: உன் வேண்டுகோளை ஏற்றுக்கொள்கிறேன்
  rationale: சொல்லுக்கு சொல் ‘உன் முகத்தை உயர்த்தினேன்’ என்றாலும், இச்சூழலில் லோத்துக்கு ஆதரவு காட்டி அவன் வேண்டுகோளை ஏற்றுக்கொள்வதைக் குறிக்கும் மரபுத்தொடர்.
- source_word: גַּם לַדָּבָר הַזֶּה
  choice: இந்த வேண்டுகோளையும்
  rationale: דָּבָר என்பது லோத் இப்போது முன்வைத்த காரியத்தைக் குறிக்கிறது; ‘-யும்’ என்பது גַּם என்பதன் சேர்க்கைப் பொருளைத் தக்கவைக்கிறது.
- source_word: לְבִלְתִּי הָפְכִּי
  choice: நான் கவிழ்த்துப்போட மாட்டேன்
  rationale: הפך என்ற வேரின் ‘கவிழ்த்தல்/தலைகீழாக்குதல்’ நுணுக்கத்தையும், நகரத்துக்கு நேரவிருக்கும் பேரழிவையும் பொதுவான ‘அழித்தல்’ என்பதைக் காட்டிலும் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: הָעִיר
  choice: அந்த நகரத்தை
  rationale: குறிப்பிட்ட ஒருமை நகரைக் குறிக்கும் definite பெயர்ச்சொல்லை தமிழில் சூழலுக்கேற்ற சுட்டுடன் வழங்குகிறது.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: நீ குறிப்பிட்ட
  rationale: லோத் பெயரிட்ட நகரைச் சுட்டும் தொடர்புத் தொடரை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
