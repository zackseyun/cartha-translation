  text: וַ/יַּעַל֩ ל֨וֹט מִ/צּ֜וֹעַר וַ/יֵּ֣שֶׁב בָּ/הָ֗ר וּ/שְׁתֵּ֤י בְנֹתָי/ו֙ עִמּ֔/וֹ כִּ֥י יָרֵ֖א לָ/שֶׁ֣בֶת בְּ/צ֑וֹעַר וַ/יֵּ֨שֶׁב֙ בַּ/מְּעָרָ֔ה ה֖וּא וּ/שְׁתֵּ֥י בְנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/030.yaml
  text: Then Lot went up from Zoar and lived in the mountains[a], and his two daughters were with him, because he was afraid to live in Zoar. So he lived in a cave, he and his two daughters.
translation:
  language: ta
  text: பின்பு லோத்து சோவாரிலிருந்து மேலேறி மலைப்பகுதியில் குடியிருந்தான்; அவனுடைய இரண்டு மகள்களும் அவனுடன் இருந்தனர்; ஏனெனில் சோவாரில் குடியிருக்க அவன் பயந்தான். அவன் தன் இரண்டு மகள்களுடன் ஒரு குகையில்[a] குடியிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “அந்தக் குகையில்.” இங்கு “குகை” என்பதற்கு குறிப்பிட்ட உருபு உள்ளது; அது அவன் குடியிருந்த குறிப்பிட்ட குகையைக் குறிக்கலாம். ஆனால் குகை இங்கு முதன்முறையாகக் குறிப்பிடப்படுவதால், தமிழில் “ஒரு குகையில்” என்பது இயல்பாக உள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל ... מִצּוֹעַר
  choice: சோவாரிலிருந்து மலைப்பகுதிக்குச் சென்று
  rationale: עלה என்பதில் மேல்நோக்கிய நிலவியல் இயக்கம் உள்ளது. தமிழில் இலக்கைச் சேர்த்த ‘மலைப்பகுதிக்குச் சென்று’ என்பது அந்த இயக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּהָר
  choice: மலைப்பகுதியில்
  rationale: எபிரெய ஒற்றைச் சொல் הַר இங்கு ஒரு தனி மலையை மட்டும் அல்லாமல் மலைசார்ந்த நிலப்பரப்பையும் குறிக்கலாம். ‘மலைப்பகுதி’ இந்த நிலவியல் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיֵּשֶׁב
  choice: குடியிருந்தான் / குடியிருந்தார்கள்
  rationale: ישב இச்சூழலில் அமர்வதை அல்ல, ஓரிடத்தில் வசிப்பதைக் குறிக்கிறது. ‘குடியிரு’ நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: וּשְׁתֵּי בְנֹתָיו עִמּוֹ
  choice: தன் இரண்டு மகள்களுடன்
  rationale: எபிரெயரின் வினையற்ற இணைப்பை இயல்பான தமிழ் உடனிகழ்ச்சித் தொடராக மாற்றுகிறது; இரு மகள்களும் லோத்துடன் இருந்தனர் என்ற தகவல் காக்கப்படுகிறது.
- source_word: כִּי יָרֵא לָשֶׁבֶת בְּצֹעַר
  choice: சோவாரில் குடியிருக்க அவன் பயந்ததால்
  rationale: כִּי இங்கு காரணத்தைக் குறிக்கிறது; יָרֵא என்பது அவனுடைய அச்சநிலையை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: בַּמְּעָרָה
  choice: ஒரு குகையில்
  rationale: எபிரெயத்தில் திட்டவட்டச் சுட்டு இருந்தாலும், இந்தக் குகை உரையில் முதன்முறையாக அறிமுகமாகிறது. தமிழில் ‘ஒரு குகையில்’ என்பது இயல்பானது; சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הוּא וּשְׁתֵּי בְנֹתָיו
  choice: அவனும் அவனுடைய இரண்டு மகள்களும்
  rationale: குகையில் குடியிருந்த அனைவரையும் மீண்டும் வலியுறுத்தும் எபிரெய அமைப்பைத் தெளிவாகக் காக்கிறது.
