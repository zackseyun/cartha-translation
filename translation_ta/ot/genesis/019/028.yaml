base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/028.yaml
  text: And he looked out over Sodom and Gomorrah and over all the land of the plain[a], and he saw, and behold, smoke was rising from the land like the smoke of a furnace.
translation:
  language: ta
  text: அவன் சோதோமையும் கொமோராவையும் சமவெளியின் நிலப்பரப்பு முழுவதையும் நோக்கிப் பார்த்தான். அவன் பார்த்தான்; இதோ, உலையின்[a] புகையைப்போல அந்த நிலத்திலிருந்து புகை மேலெழும்பிக்கொண்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சூளையின் புகையைப்போல.”
    reason: כִּבְשָׁן என்பதற்கு ‘உலை’ அல்லது ‘சூளை’ என்ற இரு பொருள்களும் இருக்கலாம்.
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: நோக்கிப் பார்த்தான்
  rationale: உயரமான இடத்திலிருந்து ஒரு பகுதியை நோக்கிப் பார்ப்பதைக் குறிக்கும் வினையின் கருத்தை, செங்குத்தான திசையை அளவுக்கு மீறி வலியுறுத்தாமல் இயல்பான தமிழில் தருகிறது.
- source_word: עַל פְּנֵי
  choice: …முழுவதையும் நோக்கி
  rationale: ஒரு பகுதியின் பரப்பை நோட்டமிடும் இடவியல் கருத்தை, சொல்லுக்குச் சொல் இறுக்கமின்றி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: סְדֹם וַעֲמֹרָה
  choice: சோதோம், கொமோரா
  rationale: இந்த இடப்பெயர்களுக்கான வழக்கமான தமிழ் ஒலிபெயர்ப்புகள்.
- source_word: כָּל פְּנֵי אֶרֶץ הַכִּכָּר
  choice: சமவெளியின் நிலப்பரப்பு முழுவதையும்
  rationale: כִּכָּר இங்கு வட்டாரமான சமவெளிப் பகுதியைக் குறிக்கிறது; 'நிலப்பரப்பு முழுவதையும்' என்பது פני என்பதன் பரப்பு உணர்வையும் כָּל என்பதன் முழுமையையும் தெளிவாகக் காட்டுகிறது.
- source_word: וַיַּרְא
  choice: அவன் பார்த்தபோது
  rationale: ראה என்பதன் அடிப்படைப் பார்வைச் செயலைக் காக்கிறது; அடுத்துவரும் காட்சியுடன் இயல்பான தமிழ் தொடர்ச்சியை உருவாக்குகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீரெனக் கண்ணில் பட்ட காட்சியின் உயிரோட்டத்தையும் கவன ஈர்ப்பையும் காக்கிறது.
- source_word: עָלָה
  choice: மேலெழும்பிக்கொண்டிருந்தது
  rationale: கண்ணுக்குத் தெரிந்த தொடர்ச்சியான மேல்நோக்கிய அசைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: קִיטֹר
  choice: புகை
  rationale: அடர்த்தி போன்ற கூடுதல் விவரங்களைச் சேர்க்காமல் சொல்லின் அடிப்படைப் பொருளைத் தருகிறது.
- source_word: הָאָרֶץ
  choice: அந்த நிலம்
  rationale: உலகம் முழுவதையும் அல்லாமல், ஆபிரகாம் பார்த்துக்கொண்டிருந்த குறிப்பிட்ட அழிவுற்ற பகுதியையே சூழல் குறிக்கிறது.
- source_word: כְּקִיטֹר הַכִּבְשָׁן
  choice: உலையின் புகையைப்போல
  rationale: כִּבְשָׁן என்பது உலை அல்லது சூளை எனப் பொருள்படலாம். 'உலை' புகை மேலெழும் ஒப்புமையைத் தெளிவாகத் தருகிறது; 'சூளை' என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
