  text: וַ/יִּקְרְא֤וּ אֶל לוֹט֙ וַ/יֹּ֣אמְרוּ ל֔/וֹ אַיֵּ֧ה הָ/אֲנָשִׁ֛ים אֲשֶׁר בָּ֥אוּ אֵלֶ֖י/ךָ הַ/לָּ֑יְלָה הוֹצִיאֵ֣/ם אֵלֵ֔י/נוּ וְ/נֵדְעָ֖ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/005.yaml
  text: And they called to Lot and said to him[a], “Where are the men who came to you tonight? Bring them out to us so that we may know them.”
translation:
  language: ta
  text: அவர்கள் லோத்தைக் கூப்பிட்டு, அவரிடம், “இன்றிரவு உன்னிடம் வந்த அந்த ஆண்கள் எங்கே? நாங்கள் அவர்களை அறிந்துகொள்ளும்படி, அவர்களை வெளியே எங்களிடம் கொண்டுவா” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל־לוֹט
  choice: அவர்கள் லோத்தைக் கூப்பிட்டு
  rationale: קרא இங்கு ஒருவரை நோக்கிக் கூப்பிடுவதைக் குறிக்கிறது. மூலத்தில் வெளிப்படையாக இல்லாத ‘கத்தினர்’ என்ற தீவிரத்தைச் சேர்க்காமல் இயல்பான தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אַיֵּה הָאֲנָשִׁים
  choice: அந்த ஆண்கள் எங்கே?
  rationale: אֲנָשִׁים இச்சூழலில் லோத்திடம் வந்த ஆண் வருகையாளர்களைக் குறிப்பதால் ‘ஆண்கள்’ எனத் துல்லியமாக மொழிபெயர்க்கப்பட்டுள்ளது. அடையாளப்படுத்தும் தொடருக்கு ஏற்றவாறு ‘அந்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: בָּאוּ אֵלֶיךָ הַלָּיְלָה
  choice: இன்றிரவு உன்னிடம் வந்த
  rationale: הַלַּיְלָה இங்கு நடப்பு இரவைக் குறிக்கிறது; ‘இன்றிரவு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: הוֹצִיאֵם אֵלֵינוּ
  choice: அவர்களை எங்களிடம் வெளியே கொண்டுவா
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே வரச் செய்’ என்ற காரணவினைப் பொருளுடையது. ‘வெளியே கொண்டுவா’ கட்டளையின் நேரடியான வலிமையைக் காக்கிறது.
- source_word: וְנֵדְעָה אֹתָם
  choice: நாங்கள் அவர்களை அறிந்துகொள்ள வேண்டும்
  rationale: ידע என்பதன் அடிப்படைப் பொருள் ‘அறிதல்’. சூழலில் பாலுறவு நோக்கம் வலுவாகக் குறிப்புணர்த்தப்பட்டாலும், மூலத்தின் சொல்வடிவத்தையும் இலக்கிய மறைபொருளையும் முதன்மை உரையில் காத்து, விளக்கத்தை அடிக்குறிப்பில் கொடுக்கிறது.
theological_decisions:
- issue: וְנֵדְעָה אֹתָם என்பதில் உள்ள பாலியல் நோக்கத்தை முதன்மை உரையிலேயே வெளிப்படையாக்க வேண்டுமா?
  choice: ‘அவர்களை அறிந்துகொள்ள வேண்டும்’ என்ற மூலச்சொல்லுக்கு நெருக்கமான வடிவத்தை முதன்மை உரையில் வைத்து, சூழல்சார்ந்த பாலியல் பொருளை அடிக்குறிப்பில் விளக்குதல்.
  alternative: ‘அவர்களோடு பாலுறவுகொள்ள வேண்டும்’ அல்லது ‘அவர்களைப் பாலியல் வன்முறைக்கு உட்படுத்த வேண்டும்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: ידע பொதுவாக ‘அறிதல்’ என்று பொருள்படும். இச்சூழல் பகைமையான பாலியல் நோக்கத்தை வலுவாக உணர்த்துகிறது; எனினும் அதனை முதன்மை உரையில் முழுமையாக வெளிப்படுத்துவது மூலத்தின் மொழியமைப்பிலுள்ள மறைமுகத்தன்மையைத் தீர்த்துவிடும். அடிக்குறிப்பு சாத்தியமான சூழற்பொருளைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபருக்கான ‘உன்னிடம்’ என்பது கூட்டம் லோத்தை நேரடியாக அழைப்பதைப் பிரதிபலிக்கிறது. பாலியல் வன்முறை நோக்கம் முதன்மை உரையில் மிகைப்படுத்தப்படாமலும் மறைக்கப்படாமலும் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
