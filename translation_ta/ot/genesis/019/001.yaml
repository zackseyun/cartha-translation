base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/001.yaml
  text: The two angels came to Sodom in the evening[a], and Lot was sitting in the gate of Sodom. When Lot saw them[c][b], he rose to meet them and bowed with his face to the ground.
translation:
  language: ta
  text: மாலையில் அந்த இரண்டு தேவதூதர்களும் சோதோமுக்கு வந்தார்கள். அப்போது லோத்து சோதோமின் நகரவாசலில்[a] அமர்ந்திருந்தான். அவர்களைக் கண்டதும், லோத்து எழுந்து அவர்களை எதிர்கொண்டான்; முகம் தரையைத் தொடுமாறு பணிந்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நகரவாசல்’ என்பது நகருக்குள் நுழையும் கதவை மட்டும் குறிக்காமல், பொதுமக்கள் கூடுவதும் நகர நிர்வாகச் செயல்கள் நடைபெறுவதுமான வாசல் பகுதியையும் குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: எபிரெயச் சொற்றொடர் முகம் தரையை நோக்குமளவு ஆழமாகப் பணிவதைக் குறிக்கிறது. இதற்குப் பயன்படுத்தப்பட்ட வினை, சூழலுக்கேற்ப மரியாதை செலுத்துவதையோ வழிபடுவதையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי הַמַּלְאָכִים
  choice: அந்த இரண்டு தேவதூதர்களும்
  rationale: מַלְאָךְ என்பதற்கு ‘தூதர்’ என்றும் ‘தேவதூதர்’ என்றும் பொருள் உண்டு. முந்தைய நிகழ்வில் வந்த விண்ணுலகத் தூதர்களே இங்கு குறிப்பிடப்படுவதால் ‘தேவதூதர்கள்’ என்பது தெளிவான தேர்வு; எபிரெய மொழியின் குறிப்புச் சுட்டை ‘அந்த’ வெளிப்படுத்துகிறது.
- source_word: סְדֹמָה
  choice: சோதோமுக்கு
  rationale: இடப்பெயருடன் சேர்ந்துள்ள திசைகாட்டும் ה, அந்த இடத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது. ‘சோதோமுக்கு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: בָּעֶרֶב
  choice: மாலையில்
  rationale: வருகையின் நேரத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: יֹשֵׁב
  choice: அமர்ந்திருந்தான்
  rationale: எபிரெயப் பங்கேற்புவினை பின்னணியில் தொடர்ந்துகொண்டிருந்த நிலையைக் காட்டுவதால், ‘அமர்ந்தான்’ என்பதைவிட ‘அமர்ந்திருந்தான்’ பொருத்தமானது.
- source_word: בְּשַׁעַר סְדֹם
  choice: சோதோமின் நகரவாசலில்
  rationale: שַׁעַר என்பது வெறும் கதவை மட்டுமல்ல, நகரவாசலைச் சுற்றிய பொதுப் பகுதியையும் குறிக்கலாம். ‘நகரவாசல்’ அந்தப் பண்டைய நகரச் சூழலைத் தெளிவாக்குகிறது.
- source_word: וַיָּקָם לִקְרָאתָם
  choice: எழுந்து அவர்களை எதிர்கொண்டு போய்
  rationale: קום மற்றும் לקראת ஆகியவற்றின் சேர்க்கை, எழுந்து வருபவர்களைச் சந்திக்கச் செல்வதைக் குறிக்கிறது. தமிழில் செயல் வரிசையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: முகம் தரையில் படும்படி பணிந்தான்
  rationale: இந்தச் சொற்றொடர் ஆழமாகத் தரைமட்டும் குனிந்து மரியாதை செலுத்தும் முழுச் செயலைக் குறிக்கிறது. ‘பணிந்தான்’ என்பது இங்கு ‘வழிபட்டான்’ என்ற வலுவான இறையியல் முடிவைத் திணிக்காமல் செயலை எடுத்துரைக்கிறது.
theological_decisions:
- issue: וַיִּשְׁתַּחוּ என்பது வழிபாட்டையா அல்லது மரியாதையுடன் தரைமட்டும் பணிவதையா குறிக்கிறது?
  choice: முகம் தரையில் படும்படி பணிந்தான்
  alternative: முகம் தரையில் படும்படி வழிபட்டான்
  rationale: שׁחה என்ற வினை சூழலுக்கேற்ப கடவுளை வழிபடுவதையோ மனிதர்கள் அல்லது உயர்ந்த தூதர்கள் முன் ஆழமாகப் பணிவதையோ குறிக்கலாம். இவ்வசனம் செயலைத் தெளிவாக விவரித்தாலும் அதை வழிபாடு என்று கட்டாயமாக வரையறுக்கவில்லை. ஆகவே மொழிபெயர்ப்பு மரியாதையான பணிவை முன்னிறுத்தி, சொல்லின் விரிவான சாத்தியத்தை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தேவதூதர்கள்’, ‘நகரவாசல்’, ‘பணிந்தான்’ ஆகிய சொற்கள் பொதுவாசகர்களுக்குத் தெளிவாகவும் மூலத்தின் பண்பாட்டு மற்றும் இறையியல் நுணுக்கங்களை மிகைப்படுத்தாமலும் உள்ளன.
