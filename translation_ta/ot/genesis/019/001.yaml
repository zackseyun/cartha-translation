  source_fidelity: 'மொழிபெயர்ப்பு வசனத்தின் செயல்வரிசையையும் முக்கிய கூறுகளையும் பெரும்பாலும் துல்லியமாகக் கொண்டுள்ளது: மாலையிலான வருகை, லோத்து நகரவாசலில் அமர்ந்திருந்த பின்னணி, அவர்களைக் கண்டு எழுதல், மற்றும் முகம் தரையை நோக்கிய ஆழ்ந்த பணிவு. ஆனால் ‘எதிர்கொண்டு போய்’ என்பதில் மூலத்தில் வெளிப்படையாக இல்லாத ‘போய்’ என்ற இயக்கம் சேர்கிறது; לִקְרָאתָם என்பதன் ‘அவர்களைச் சந்திக்க/எதிர்கொள்ள’ என்ற பொருளே போதுமானது.'
