id: GEN.19.18
reference: Genesis 19:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר ל֖וֹט אֲלֵ/הֶ֑ם אַל נָ֖א אֲדֹנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/018.yaml
  text: But Lot said to them[a], “No, please, my lords.”
translation:
  language: ta
  text: ஆனால் லோத்து அவர்களிடம், “தயவுசெய்து வேண்டாம், என் ஆண்டவர்களே[a]!” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் ஆண்டவரே.” எபிரெய வடிவமான אֲדֹנָי சில வாசிப்புகளில் மரியாதைக்குரிய ஒருமை விளியாகப் புரிந்துகொள்ளப்படலாம்; ஆனால் “அவர்களிடம்” என்ற பன்மைச் சூழல் இங்கு “என் ஆண்டவர்களே” என்பதை ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் ... என்றான்
  rationale: வாவ் தொடர்நிலை கதையை முன்னெடுத்தாலும், முந்தைய அறிவுறுத்தலுக்கு லோத்து தெரிவிக்கும் மறுப்பை இங்கு இயல்பாக வெளிப்படுத்த ‘ஆனால்’ பொருத்தமானது.
- source_word: לוֹט
  choice: லோத்து
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு நிலைபெற்ற பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אֲלֵהֶם
  choice: அவர்களிடம்
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டுடன் வரும் אֶל என்பதன் நேரடியான பொருள் ‘அவர்களிடம்’; அது இரு வருகையாளர்களைக் குறித்தாலும், மூலத்தின் பிரதிப்பெயர் அப்படியே பாதுகாக்கப்படுகிறது.
- source_word: אַל
  choice: வேண்டாம்
  rationale: வினைச்சொல் இல்லாத இந்த வேண்டுகோளில், முந்தைய முன்மொழிவை வலுவாக மறுக்கும் பொருளை இயல்பான நவீன தமிழில் ‘வேண்டாம்’ தெரிவிக்கிறது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: வேண்டுதல் அல்லது பணிவைக் குறிக்கும் இத்துகளின் பொருளை நவீன, எளிதில் புரியும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲדֹנָי
  choice: என் ஆண்டவர்களே
  rationale: ‘அவர்களிடம்’ என்ற பன்மைச் சூழலும் இரு வருகையாளர்களும் இங்கு பன்மை விளிப்பை ஆதரிக்கின்றனர். ‘ஆண்டவர்களே’ என்பது אֲדוֹן என்பதன் மரியாதை மற்றும் சொற்பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: אֲדֹנָי என்பதை தெய்வீகப் பட்டமாகிய ஒருமை ‘என் ஆண்டவரே’ என்று வாசிப்பதா, அல்லது இரு வருகையாளர்களை நோக்கிய பன்மை மரியாதை விளியாக வாசிப்பதா
  choice: 'இரு வருகையாளர்களை நோக்கிய பன்மை விளி: ‘என் ஆண்டவர்களே’'
  alternative: ‘என் ஆண்டவரே’
  rationale: ‘அவர்களிடம்’ என்ற தெளிவான பன்மைச் சுட்டும் உடனடிச் சூழலில் உள்ள இரு வருகையாளர்களும் பன்மை வாசிப்பை வலுப்படுத்துகின்றனர். எனினும், எபிரெய வடிவம் ஒருமை மரியாதை விளியாகவும் புரிந்துகொள்ளப்படக்கூடும் என்பதால் அந்த வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வேண்டாம், தயவுசெய்து’ என்பது மூலத்திலுள்ள மறுப்பையும் பணிவான வேண்டுதலையும் தனித்தனியாகத் தக்கவைக்கிறது.
