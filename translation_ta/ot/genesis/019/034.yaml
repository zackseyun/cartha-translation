base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/034.yaml
  text: And it happened on the next day that the firstborn said to the younger[a], “Look, I lay with my father last night. Let us make him drink wine tonight also. Then come, lie with him, so that we may preserve offspring from our father.”
translation:
  language: ta
  text: மறுநாள், மூத்தவள் இளையவளிடம், “இதோ, நேற்றிரவு நான் என் தந்தையுடன் படுத்தேன். இன்றிரவும் அவரைத் திராட்சரசம் குடிக்கச் செய்வோம். நீ அவருடன் படு; அப்படிச் செய்து நம் தந்தையிடமிருந்து சந்ததி நிலைத்திருக்கச் செய்வோம்[a]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “நம் தந்தையிடமிருந்து விதையை உயிரோடு காப்போம்.” இங்கு “விதை” என்பது சந்ததியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: மறுநாள்
  rationale: எபிரெயக் கதைத் தொடரின் இயல்பான முன்னேற்றத்தை நவீன தமிழில் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הַבְּכִירָה ... הַצְּעִירָה
  choice: மூத்தவள் ... இளையவள்
  rationale: இரு மகள்களின் பிறப்பு வரிசை வேறுபாட்டை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: הֵן
  choice: இதோ
  rationale: தொடர்ந்து சொல்லப்படுவதற்குக் கவனத்தைத் திருப்பும் எபிரெயச் சொல்லின் வலிமையை dignified modern Tamil-இல் காக்கிறது.
- source_word: שָׁכַבְתִּי אֶת אָבִי / שִׁכְבִי עִמּוֹ
  choice: என் தந்தையுடன் படுத்தேன் / அவருடன் படு
  rationale: பாலுறவைக் குறிக்கும் மூலமொழியின் மறைமுகமான, ஆனால் சூழலில் தெளிவான சொல்லாட்சியை அப்படியே காக்கிறது.
- source_word: נַשְׁקֶנּוּ יַיִן
  choice: அவரைத் திராட்சரசம் குடிக்கச் செய்வோம்
  rationale: ஹிஃபில் வடிவின் காரணவினைப் பொருளைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: וּנְחַיֶּה מֵאָבִינוּ זָרַע
  choice: நம் தந்தையின் வழியாக நமக்குச் சந்ததி உண்டாகச் செய்வோம்
  rationale: חיה என்ற வினையின் ‘உயிருடன் நிலைக்கச் செய்தல்/தொடரச் செய்தல்’ என்ற கருத்தையும், זרע என்பதன் இச்சூழலிலான ‘சந்ததி’ பொருளையும் இயல்பான தமிழில் இணைக்கிறது.
theological_decisions:
- issue: מֵאָבִינוּ என்பதன் உறவுமுறை/மூலப்பொருள்
  choice: நம் தந்தையின் வழியாக
  alternative: நம் தந்தையிடமிருந்து
  rationale: מן என்னும் முன்னிடைச்சொல்லின் மூலத்தைக் குறிக்கும் பொருளை வைத்துக்கொண்டே, இங்கு கருவுறுதலுக்கான தந்தை வழியைத் தெளிவாகக் காட்டுகிறது; உரை கூறாத கூடுதல் நெறித் தீர்ப்பைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. பாலுறவைக் குறிக்கும் மூலத்தின் மறைமுகச் சொல்லாட்சி “படுத்தல்” எனக் காக்கப்பட்டுள்ளது. “அப்பா” என்பதற்குப் பதில் “தந்தை” என்பது உரையின் தீவிரமான கதைநடைக்கு ஏற்ற பதிவாகத் தேர்ந்தெடுக்கப்பட்டது.
