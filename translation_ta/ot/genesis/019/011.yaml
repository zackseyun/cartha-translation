  text: וְֽ/אֶת הָ/אֲנָשִׁ֞ים אֲשֶׁר פֶּ֣תַח הַ/בַּ֗יִת הִכּוּ֙ בַּ/סַּנְוֵרִ֔ים מִ/קָּטֹ֖ן וְ/עַד גָּד֑וֹל וַ/יִּלְא֖וּ לִ/מְצֹ֥א הַ/פָּֽתַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/011.yaml
  text: And they struck the men who were at the entrance of the house with blindness[a], from the least to the greatest, so that they wore themselves out trying to find the doorway.
translation:
  language: ta
  text: வீட்டின் நுழைவாயிலில் இருந்த ஆண்களை, சிறியோர் முதல் பெரியோர் வரை, அவர்கள் குருடாக்கினார்கள்[a]. அதனால், வாசலைக் கண்டுபிடிக்க முயன்று அந்த ஆண்கள் களைத்துப்போனார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பார்வையை மயக்கும் நிலையால் தாக்கினார்கள்” அல்லது “பார்வைக் குழப்பத்துக்கு உள்ளாக்கினார்கள்.” அரிதாகப் பயன்படுத்தப்படும் எபிரேயச் சொல் சாதாரண குருட்டுத்தன்மையைவிட வேறுபட்ட ஒரு நிலையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּ
  choice: குருடாக்கினார்கள்
  rationale: נכה என்பதன் ஹிஃபில் வடிவம் பொதுவாக ‘தாக்குதல்’ எனப் பொருள்படும்; இங்கு அடுத்து வரும் கருவியைக் குறிக்கும் சொல்லுடன் சேர்ந்து, ஆண்களைப் பார்வையற்றவர்களாக்கிய செயலைக் குறிக்கிறது. தமிழில் ‘குருடாக்கினார்கள்’ என்பது அந்தக் காரணவினைப் பொருளை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: הָאֲנָשִׁים
  choice: ஆண்களை
  rationale: இச்சூழலில் אֲנָשִׁים என்பது லோத்தின் வீட்டுக்கு வெளியே கூடியிருந்த ஆண்களையே குறிப்பதால், பாலினத்தையும் சூழலையும் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר פֶּתַח הַבַּיִת
  choice: வீட்டின் நுழைவாயிலில் இருந்த
  rationale: இந்தத் தொடர் அந்த ஆண்கள் இருந்த இடத்தை அடையாளப்படுத்துகிறது. ‘நுழைவாயில்’ என்பது פֶּתַח குறிக்கும் திறப்பு அல்லது உட்புகும் இடத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בַּסַּנְוֵרִים
  choice: குருடாக்கினார்கள்
  rationale: סַנְוֵרִים என்பது அரிதான சொல்; சரியாகப் பார்க்க முடியாதபடி இறையியல்பாக ஏற்படுத்தப்பட்ட நிலையைக் குறிக்கிறது. முதன்மை உரையில் ‘குருடாக்கினார்கள்’ தெளிவான பொருளைத் தருகிறது; பார்வை மயக்கம் அல்லது குழப்பம் என்ற நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: சிறியோர் முதல் பெரியோர் வரை
  rationale: குழுவிலுள்ள அனைவரையும் உள்ளடக்கும் எபிரேய இருமுனைச் சொற்றொடரைப் பாதுகாக்கிறது; இது வயது அல்லது சமூக முக்கியத்துவம் என ஒரே விதமாகக் கட்டுப்படுத்தப்படவில்லை.
- source_word: וַיִּלְאוּ
  choice: களைத்துப்போனார்கள்
  rationale: לָאָה குறிக்கும் சோர்வு அல்லது அயர்ச்சியை நவீன, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִמְצֹא
  choice: கண்டுபிடிக்க முயன்று
  rationale: அவர்கள் அயர்ந்ததற்குக் காரணமான பயனற்ற முயற்சியைத் தமிழில் தெளிவாக இணைக்கிறது.
- source_word: הַפָּתַח
  choice: வாசலை
  rationale: இங்கு அவர்கள் கண்டுபிடிக்க முடியாமல் தேடிய குறிப்பிட்ட வீட்டுத் திறப்பைக் குறிக்க ‘வாசல்’ இயல்பான தமிழ்ச் சொல்லாகும்; முன்னர் வந்த ‘நுழைவாயில்’ என்பதன் தேவையற்ற மறுபடியுரைத்தலையும் தவிர்க்கிறது.
theological_decisions:
- issue: סַנְוֵרִים குறிக்கும் பாதிப்பின் தன்மை
  choice: இறையியல்பாக ஏற்படுத்தப்பட்ட குருடாக்குதல்
  alternative: கண்பார்வையை மயக்கும் நிலை அல்லது பார்வைக் குழப்பம்
  rationale: இந்த அரிதான எபிரேயச் சொல் சாதாரண குருட்டுத்தன்மையைவிட விரிவான பார்வைச் சீர்குலைவைக் குறிக்கக்கூடும். எனினும், வீட்டின் வாசலைக் கண்டுபிடிக்க முடியாதபடி அவர்களது பார்வை பாதிக்கப்பட்டது கதையில் தெளிவாக உள்ளது. ஆகவே முதன்மை உரையில் தெளிவான சொல்லும், அடிக்குறிப்பில் உண்மையான சொற்பொருள் ஐயமும் வைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சிறியோர் முதல் பெரியோர் வரை’ என்ற சொற்றொடர் வயதா சமூக நிலையா என்பதைத் தீர்மானிக்காமல் மூலத்தின் உள்ளடக்கத் தெளிவின்மையைப் பாதுகாக்கிறது. ‘அந்த ஆண்கள்’ என்று இரண்டாம் வாக்கியத்தில் மீண்டும் குறிப்பிடுவது தமிழில் கருப்பொருள் குழப்பத்தைத் தவிர்க்கிறது.
