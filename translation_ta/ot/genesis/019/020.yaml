  yaml_path: translation/ot/genesis/019/020.yaml
  text: Look[a], please, this city is near enough to flee there, and it is small[b]. Please let me escape there—is it not small? Then my life will live.
translation:
  language: ta
  text: இதோ, தயவுசெய்து, இந்த நகரம் அங்கே தப்பியோடிச் செல்லும் அளவுக்கு அருகில் இருக்கிறது; அது சிறியது. தயவுசெய்து, நான் அங்கே தப்பியோடட்டும்; அது சிறியதுதானே? அப்படிச் செய்தால் நான் உயிர்வாழ்வேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: இதோ
  rationale: הִנֵּה கவனத்தை ஈர்க்கிறது; அதனுடன் வரும் வேண்டுகோள் துகளான נָא-வின் மென்மையான அவசரத் தொனி தொடரும் வாக்கியத்திலுள்ள ‘தயவுசெய்து’ என்பதால் இயல்பாக வெளிப்படுகிறது.
- source_word: הָעִיר הַזֹּאת
  choice: அந்த நகரம்
  rationale: பேசுபவரிடமிருந்து சற்றுத் தொலைவில், அவர் சுட்டிக்காட்டும் இடத்தைத் தமிழ் பேச்சுவழக்கில் ‘அந்த நகரம்’ இயல்பாகக் குறிக்கிறது.
- source_word: קְרֹבָה לָנוּס שָׁמָּה
  choice: நான் தப்பியோடிச் செல்வதற்கு அருகில் இருக்கிறது
  rationale: לָנוּס என்பதின் தப்பியோடும் பொருளையும் שָׁמָּה என்பதின் அங்கே செல்லும் திசையையும் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִצְעָר
  choice: சிறியதுதானே
  rationale: நகரின் சிறுமையை லோத்து தன் வேண்டுகோளுக்கான காரணமாக வலியுறுத்துகிறான்; ஒரே எபிரெயச் சொல் இருமுறை வருவதால் தமிழ் மொழிபெயர்ப்பிலும் அதே சொல் மீண்டும் வருகிறது.
- source_word: אִמָּלְטָה נָּא שָׁמָּה
  choice: தயவுசெய்து நான் அங்கே தப்பியோட அனுமதியும்
  rationale: முதல் நபர் cohortative வடிவத்தின் வேண்டுகோள்/விருப்பத் தொனியையும் נָא-வின் பணிவான அவசரத்தையும் இயல்பாகக் காட்டுகிறது.
- source_word: וּתְחִי נַפְשִׁי
  choice: அப்போது நான் உயிர்வாழ்வேன்
  rationale: נֶפֶשׁ இங்கு நபரையே சுற்றுவழியாகக் குறிக்கும் எபிரெய மரபுத்தொடர்; சொற்சொறான ‘என் உயிர் உயிர்வாழும்’ என்பதற்குப் பதிலாக அதன் பொருளைத் தெளிவாகத் தருகிறது. waw முந்தைய வேண்டுகோளின் விளைவை அறிமுகப்படுத்துவதாக எடுத்துக்கொள்ளப்படுகிறது.
theological_decisions:
- issue: וּתְחִי נַפְשִׁי என்பதில் נֶפֶשׁ-ஐ தனியான அழிவற்ற ‘ஆத்துமா’ எனப் புரிந்துகொள்ளலாமா?
  choice: நபரையே குறிக்கும் மரபுத்தொடராக ‘நான் உயிர்வாழ்வேன்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘என் ஆத்துமா உயிர்வாழும்’ அல்லது ‘என் உயிர் உயிர்வாழும்.’
  rationale: இந்தச் சூழலில் லோத்து உடல் மரணத்திலிருந்து தப்பிப் பிழைப்பதை வேண்டுகிறான்; தனியான மனித அங்கத்தைப் பற்றிய கோட்பாட்டை உரைக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; வேண்டுகோளின் அவசரமும் பணிவும் காக்கப்பட்டுள்ளன. ‘சிறியதுதானே’ என்ற மறுபதிப்பு மூலத்தின் சொல் மீளலைப் பாதுகாக்கிறது. வாசிப்பைத் தடைசெய்யும் தேவையற்ற சொற்சொறான எபிரெய நடையைத் தவிர்த்து, பொருளுக்கு நெருக்கமான கண்ணியமான உரை பயன்படுத்தப்பட்டுள்ளது.
