  text: כִּֽי מַשְׁחִתִ֣ים אֲנַ֔חְנוּ אֶת הַ/מָּק֖וֹם הַ/זֶּ֑ה כִּֽי גָֽדְלָ֤ה צַעֲקָתָ/ם֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/יְשַׁלְּחֵ֥/נוּ יְהוָ֖ה לְ/שַׁחֲתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/013.yaml
  text: For we are about to destroy this place[a], because their outcry has become great before Yahweh, and Yahweh has sent us to destroy it.
translation:
  language: ta
  text: நாங்கள் இந்த இடத்தை அழிக்கப்போகிறோம்; ஏனெனில், அவர்களுடைய கூக்குரல்[a] யாவேயின் முன்னிலையில் மிகப் பெரிதாகிவிட்டது. இதை அழிக்க யாவே எங்களை அனுப்பியிருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்கு எதிரான கூக்குரல் யாவேயின் முன்னிலையில் மிகப் பெரிதாகிவிட்டது.” எபிரெய வடிவத்தை நேரடியாக “அவர்களுடைய கூக்குரல்” என்று கொள்ளலாம்; ஆனால் சூழலில், இந்த இடத்து மக்களுக்கு எதிராக எழுந்த கூக்குரலை இது குறிப்பதாகப் பலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׁחִתִים
  choice: அழிக்கப்போகிறோம்
  rationale: ஹிஃபில் பன்மைப் பங்கேற்புவினை இங்கு நெருங்கிவரும் செயலை அறிவிக்கிறது; தமிழில் ‘அழிக்கப்போகிறோம்’ அந்த உடனடி எதிர்காலப் பொருளை இயல்பாகத் தருகிறது.
- source_word: הַמָּקוֹם הַזֶּה
  choice: இந்த இடம்
  rationale: மָקוֹם என்பதன் நேரான பொருள் ‘இடம்’; சுட்டுப்பொருளையும் இயல்பான தமிழையும் இது காக்கிறது.
- source_word: גָדְלָה
  choice: மிகப் பெரிதாகிவிட்டது
  rationale: கால் நிறைவுவினை அளவு அதிகரித்து தற்போதைய பெருநிலையை அடைந்ததைக் குறிக்கிறது; ‘பெரிதாகிவிட்டது’ அதன் முடிவுநிலைப் பொருளைத் தக்கவைக்கிறது.
- source_word: צַעֲקָתָם
  choice: அவர்களுடைய கூக்குரல்
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை உடைமைப் பின்னொட்டை நேரடியாகத் தக்கவைக்கிறது. கூக்குரல் யாரால் எழுப்பப்பட்டது அல்லது யாருக்கு எதிராக எழுப்பப்பட்டது என்பதை முதன்மை உரையில் தீர்மானிக்கவில்லை.
- source_word: אֶת־פְּנֵי יְהוָה
  choice: யாவேயின் முன்னிலையில்
  rationale: ‘முகத்திற்கு முன்’ என்ற எபிரெய மரபுத்தொடரின் உறவு மற்றும் நீதித்தீர்ப்பு சார்ந்த பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיְשַׁלְּחֵנוּ
  choice: எங்களை அனுப்பியிருக்கிறார்
  rationale: முன்பு நிறைவேற்றப்பட்ட அனுப்புதல் தற்போதைய பணியோடு தொடர்வதைத் தமிழின் நிறைவுநிலை வடிவம் இயல்பாகக் காட்டுகிறது.
- source_word: לְשַׁחֲתָהּ
  choice: இதை அழிக்க
  rationale: பெண்பால் ஒருமை பின்னொட்டு முன்னுள்ள நகரம் அல்லது இடத்தைக் குறிக்கிறது; தமிழில் அஃறிணைச் சுட்டான ‘இதை’ இயல்பானது. முன்பு வந்த அதே வேர்ச்சொல்லுடன் ‘அழிக்க’ என்ற சொல்லை ஒருமைப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை தெய்வீகத் தனிப்பெயரையே பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: צַעֲקָתָם என்பதிலுள்ள உடைமைப் பின்னொட்டின் பொருள்
  choice: அவர்களுடைய கூக்குரல்
  alternative: அவர்களுக்கு எதிரான கூக்குரல்
  rationale: எபிரெய வடிவத்தின் நேரடிப் பொருளை முதன்மை உரையில் காத்து, சூழலால் சாத்தியமான மாற்றுப் புரிதலை அடிக்குறிப்பில் தருகிறது; இவ்வாறு உண்மையான விளக்கத் தெளிவின்மை தீர்த்துவைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டது. நெருங்கிவரும் அழிவை ‘அழிக்கப்போகிறோம்’ என்றும், தெய்வீகப் பெயரை ‘யாவே’ என்றும் வழங்குகிறது; மூலத்திலுள்ள சுட்டுப்பெயர் சார்ந்த தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
