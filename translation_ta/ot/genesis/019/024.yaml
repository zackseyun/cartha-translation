base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/024.yaml
  text: Then Yahweh rained sulfur and fire on Sodom and Gomorrah from Yahweh out of the heavens[a][b].
translation:
  language: ta
  text: அப்போது யாவே, வானங்களிலுள்ள யாவேயிடமிருந்து, சோதோம் மீதும் கொமோரா மீதும் கந்தகத்தையும் நெருப்பையும் மழையாகப் பொழியச் செய்தார்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் גָּפְרִית (கோஃப்ரீத்) துல்லியமாக ‘கந்தகம்’ என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘யாவேயிடமிருந்து, வானங்களிலிருந்து’ என்று உள்ளது. மூலத்தில் தேவனுடைய பெயர் மீண்டும் வருவதால், அதை எளிமைப்படுத்தாமல் இங்கே தக்கவைத்துள்ளோம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாகக் கொடுக்கிறது.
- source_word: הִמְטִיר
  choice: மழையாகப் பொழியச் செய்தார்
  rationale: இது ‘மழை பெய்யச் செய்/மழையாகப் பொழியச் செய்’ என்னும் ஹிஃபில் வினை வடிவின் பொருளையும் மேலிருந்து விழும் நியாயத்தீர்ப்பின் காட்சியையும் தக்கவைக்கிறது.
- source_word: גָּפְרִית
  choice: கந்தகம்
  rationale: இச்சொல் குறிக்கும் பொருளுக்கான துல்லியமான, தற்போதைய தமிழ்ச் சொல் இதுவே.
- source_word: אֵשׁ
  choice: நெருப்பு
  rationale: எபிரெயச் சொல்லின் நேரான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: עַל
  choice: மீதும்
  rationale: நியாயத்தீர்ப்பு விழுந்த இலக்கைச் சுட்டும் முன்னிடைச்சொல்லை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: סְדֹם וְעֲמֹרָה
  choice: சோதோம் மீதும் கொமோரா மீதும்
  rationale: இடப்பெயர்களின் பரவலாக அறியப்பட்ட தமிழ் ஒலிபெயர்ப்புகளைப் பயன்படுத்தி, இரு நகரங்களும் தீர்ப்பின் இலக்குகள் என்பதைத் தெளிவாக்குகிறது.
- source_word: מֵאֵת יְהוָה
  choice: யாவேயிடமிருந்து
  rationale: மூலத்தில் இரண்டாவது முறையாக வரும் தேவனுடைய பெயரையும், அது சுட்டும் தோற்றுவாயையும் நீக்காமல் தக்கவைக்கிறது.
- source_word: מִן הַשָּׁמַיִם
  choice: வானங்களிலிருந்து
  rationale: எபிரெய மூலத்திலுள்ள பன்மை வடிவைத் தக்கவைத்து, மேலிருந்து வந்ததை வெளிப்படுத்துகிறது.
- source_word: וַ
  choice: அப்போது
  rationale: கதை நிகழ்வுகளின் தொடர்ச்சியை இயல்பான நவீன தமிழில் காட்டுகிறது.
theological_decisions:
- issue: ‘யாவே ... யாவேயிடமிருந்து’ என்று தேவனுடைய பெயர் மீண்டும் வருதல்
  choice: மூலத்தில் உள்ளபடியே இரு இடங்களிலும் ‘யாவே’ என்ற பெயரைத் தக்கவைத்தல்
  alternative: ‘யாவே ... வானத்திலிருந்து’ என்று இரண்டாவது பெயரை நீக்குதல்; அல்லது ‘தம்மிடமிருந்து’ என்று விளக்கிப் பொருளுரைத்தல்
  rationale: எபிரெய உரை தேவனுடைய பெயரை வெளிப்படையாக இருமுறை கூறுகிறது. அதை எளிமைப்படுத்துவதோ, முகமை குறித்த இறையியல் கேள்வியை மொழிபெயர்ப்பிலேயே தீர்ப்பதோ இல்லாமல், மூலத்தின் அசாதாரணமான சொல்லமைப்பையும் அதன் இறையியல் பதற்றத்தையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மீதும்’ என்ற இணைப்பு இரு நகரங்களுக்கும் தெளிவாகத் திரும்பக் கொடுக்கப்பட்டுள்ளது. மூலத்தின் அசாதாரணமான இரட்டைத் தோற்றுவாய் அமைப்பை மறைக்காமல் இருப்பதற்காக ‘யாவேயிடமிருந்து, வானங்களிலிருந்து’ என்ற வரிசை பயன்படுத்தப்பட்டுள்ளது; காற்புள்ளி வாசிப்புக்கு உதவுகிறது, ஆனால் இரண்டிற்கிடையிலான உறவை விளக்கித் தீர்ப்பதில்லை.
