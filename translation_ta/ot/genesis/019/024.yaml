revisions:
- from: அப்போது யாவே சோதோம் மீதும் கொமோரா மீதும் கந்தகத்தையும் நெருப்பையும் யாவேயிடமிருந்து, வானங்களிலிருந்து மழையாகப் பொழியச் செய்தார்[a][b].
  to: அப்போது யாவே, வானங்களிலுள்ள யாவேயிடமிருந்து, சோதோம் மீதும் கொமோரா மீதும் கந்தகத்தையும் நெருப்பையும் மழையாகப் பொழியச் செய்தார்[a][b].
