  yaml_path: translation/ot/genesis/019/023.yaml
  text: The sun had risen over the land[b][a], and Lot had come to Zoar.
translation:
  language: ta
  text: சூரியன் நிலத்தின்மேல்[a] உதித்திருந்தது; லோத்து சோவாரை அடைந்திருந்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘நிலம்’ என்பதற்குப் பதிலாக ‘பூமி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘சூரியன் நிலத்தின்மேல் உதித்தது; லோத்து சோவாரை அடைந்தான்.’ எபிரெய மொழியிலுள்ள நிறைவுற்ற வினைச்சொற்களைத் தமிழில் எளிய இறந்தகாலத்திலும் மொழிபெயர்க்கலாம்.
    reason: grammatical_alternative
lexical_decisions:
- source_word: הַשֶּׁמֶשׁ
  choice: சூரியன்
  rationale: குறிப்பிட்ட சூரியனைக் குறிக்கும் எபிரெயப் பெயர்ச்சொல்லின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: יָצָא
  choice: உதித்திருந்தது
  rationale: יצא என்பதன் அடிப்படைப் பொருள் ‘வெளியே சென்றது/வெளிப்பட்டது’; சூரியனை எழுவாயாகக் கொண்ட இச்சூழலில் அது சூரிய உதயத்தை இயல்பாகக் குறிக்கிறது. நிறைவுற்ற பின்னணிச் செயலைத் தமிழில் ‘உதித்திருந்தது’ வெளிப்படுத்துகிறது.
- source_word: עַל הָאָרֶץ
  choice: நிலத்தின்மேல்
  rationale: עַל என்பது ‘மேல்’; אֶרֶץ என்பது ‘நிலம்’ அல்லது ‘பூமி’ எனப் பொருள்படலாம். இங்குள்ள உள்ளூர் கதைச்சூழலுக்கு ‘நிலம்’ பொருத்தமானது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְלוֹט
  choice: லோத்து
  rationale: இணைப்பிடைச்சொல்லுக்குப் பின் வரும் நபரின் பெயர்; தமிழில் வழக்கமான பெயர்வடிவம் பயன்படுத்தப்பட்டது. அரைப்புள்ளி மூலம் எபிரெய இணைப்பின் தொடர்ச்சி காக்கப்படுகிறது.
- source_word: בָּא
  choice: வந்து சேர்ந்திருந்தான்
  rationale: בוא என்பது ‘வருதல்/உட்புகுதல்/சென்றடைதல்’ எனப் பொருள்படும். இலக்கை அடைந்ததைக் குறிக்கும் இச்சூழலில் ‘வந்து சேர்ந்திருந்தான்’ இயல்பாக உள்ளது; நிறைவுற்ற பின்னணிச் செயலும் வெளிப்படுகிறது.
- source_word: צֹעֲרָה
  choice: சோவாருக்கு
  rationale: இடப்பெயருடன் சேர்ந்துள்ள directional he, சோவாரை நோக்கிய இயக்கத்தைக் காட்டுகிறது; தமிழில் நான்காம் வேற்றுமை உருபான ‘-க்கு’ இதை இயல்பாகத் தெரிவிக்கிறது.
