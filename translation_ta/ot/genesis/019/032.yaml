  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לְכָ֨/ה נַשְׁקֶ֧ה אֶת אָבִ֛י/נוּ יַ֖יִן וְ/נִשְׁכְּבָ֣ה עִמּ֑/וֹ וּ/נְחַיֶּ֥ה מֵ/אָבִ֖י/נוּ זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/032.yaml
  text: Come[a], let us make our father drink wine, and let us lie with him[b], so that we may preserve offspring through our father.
translation:
  language: ta
  text: “வா, நம் தந்தைக்குத் திராட்சரசத்தைக் குடிக்கக் கொடுப்போம்; அவரோடு படுத்துக்கொள்வோம். அதனால் நம் தந்தையின் வழியாகச் சந்ததியைப் பாதுகாப்போம்[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சந்ததி’ என்பதற்கு ‘விதை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה
  choice: வா
  rationale: இது செயலில் ஈடுபடத் தூண்டும் மரபுவழி அழைப்புச் சொல். சூழலில் மூத்த மகள் இளையவளிடம் ஒருமையில் பேசுவதால், இயல்பான நவீனத் தமிழில் ‘வா’ பொருத்தமாக உள்ளது.
- source_word: נַשְׁקֶה אֶת־אָבִינוּ יַיִן
  choice: நம் தந்தைக்குத் திராட்சரசத்தைக் குடிக்கக் கொடுப்போம்
  rationale: הִפעיל வடிவத்தின் காரணவினைப் பொருளைத் தெளிவாகக் காட்டுகிறது. ‘நாம் குடிப்போம்’ என்று பொருள் மாறுவதைத் தவிர்க்கிறது.
- source_word: וְנִשְׁכְּבָה עִמּוֹ
  choice: அவரோடு படுத்துக்கொள்வோம்
  rationale: எபிரெயச் சொற்றொடரின் பாலுறவைக் குறிக்கும் நாசூக்கான சொல்லாட்சியையும் அதன் கனத்த தன்மையையும் தேவையற்ற வெளிப்படைத்தன்மையின்றிப் பாதுகாக்கிறது.
- source_word: וּנְחַיֶּה
  choice: நிலைநிறுத்துவோம்
  rationale: ‘உயிரோடு வைத்திருப்போம்/தொடரச் செய்வோம்’ என்ற காரணவினைப் பொருளை, இங்கு வம்சத் தொடர்ச்சியைக் குறிக்கும் வகையில் இயல்பான தமிழில் தருகிறது.
- source_word: מֵאָבִינוּ זָרַע
  choice: நம் தந்தையிடமிருந்து சந்ததி
  rationale: מִן குறிக்கும் மூலத்தையும் זֶרַע என்பதன் சூழல்சார் ‘சந்ததி/வம்சம்’ என்ற பொருளையும் பாதுகாக்கிறது.
theological_decisions:
- issue: זָרַע என்பதன் நேர்ப்பொருளும் சூழல்சார் பொருளும்
  choice: முதன்மை உரையில் ‘சந்ததி’
  alternative: ‘விதை’
  rationale: இங்கு நோக்கம் பிள்ளைப்பேறு மற்றும் வம்சத் தொடர்ச்சி என்பதால் ‘சந்ததி’ தெளிவானது; அதேவேளை எபிரெயத்தின் உருவக நேர்ப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மூத்த சகோதரி இளைய சகோதரியிடம் பேசும் ஒருமை அழைப்பைத் தக்கவைத்து, கண்ணியமான ஆனால் மறைத்துப் பொருள் மாற்றாத நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தில் தனியாக வரும் இரண்டு செயல் அழைப்புகளும் தமிழில் இரண்டு ‘-ப்போம்’ வடிவங்களால் தெளிவாகத் தக்கவைக்கப்பட்டுள்ளன.
