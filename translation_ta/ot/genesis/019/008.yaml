  text: הִנֵּה נָ֨א לִ֜/י שְׁתֵּ֣י בָנ֗וֹת אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ אִ֔ישׁ אוֹצִֽיאָה נָּ֤א אֶתְ/הֶן֙ אֲלֵי/כֶ֔ם וַ/עֲשׂ֣וּ לָ/הֶ֔ן כַּ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם רַ֠ק לָֽ/אֲנָשִׁ֤ים הָ/אֵל֙ אַל תַּעֲשׂ֣וּ דָבָ֔ר כִּֽי עַל כֵּ֥ן בָּ֖אוּ בְּ/צֵ֥ל קֹרָתִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/008.yaml
  text: Look[a], please, I have two daughters who have not known a man. Please let me bring them out to you, and do to them as is good in your eyes. Only to these men do nothing[c][b], for they have come under the shadow of my roof.
translation:
  language: ta
  text: இதோ, ஆணுடன் உறவு கொள்ளாத இரண்டு மகள்கள் எனக்கு இருக்கிறார்கள்.[a] தயவுசெய்து, நான் அவர்களை உங்களிடம் வெளியே அழைத்து வரட்டும்; உங்கள் பார்வையில் நல்லது எனத் தோன்றுவதை அவர்களுக்குச் செய்யுங்கள். ஆனால், இந்த மனிதர்களுக்கு மட்டும் எதுவும் செய்யாதீர்கள்; ஏனெனில் அவர்கள் என் கூரையின் நிழலின் கீழ் வந்திருக்கிறார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “ஒரு ஆணை அறியாத”; இது ஆணுடன் பாலுறவு கொள்ளாததைக் குறிக்கும் எபிரெய மொழிவழக்கு. மரபான மொழிபெயர்ப்பில், “கன்னியர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “என் கூரையின் நிழலின் கீழ்” என்பது ஒருவரின் வீட்டுக்கு வந்த விருந்தினருக்குக் கொடுக்க வேண்டிய அடைக்கலத்தையும் பாதுகாப்பையும் குறிக்கும் படிமம்.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: இதோ
  rationale: הִנֵּה அவசரமாகக் கவனத்தை ஈர்க்கிறது; நָא வேண்டுகோள் தொனியைச் சேர்க்கிறது. தமிழில் இயல்பாகத் தொடங்க ‘இதோ’ பயன்படுத்தப்பட்டு, அடுத்த வேண்டுகோளில் ‘தயவுசெய்து’ மூலம் கெஞ்சும் தொனி வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר לֹא יָדְעוּ אִישׁ
  choice: ஆணுடன் உறவுகொள்ளாத
  rationale: ‘ஒரு ஆணை அறியாத’ என்ற எபிரெய மொழிவழக்கின் பாலுறவுப் பொருளை நவீன தமிழில் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது; ‘கன்னியர்’ என நிலையை மட்டும் பெயரிடுவதைவிட வினைச்சொல் அமைப்பைத் தக்கவைக்கிறது.
- source_word: אוֹצִיאָה נָּא אֶתְהֶן אֲלֵיכֶם
  choice: தயவுசெய்து அவர்களை உங்களிடம் வெளியே அழைத்து வருகிறேன்
  rationale: கோஹோர்டேட்டிவ் வடிவிலுள்ள முன்வருதல்/உறுதியையும் נָא-வின் மன்றாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַעֲשׂוּ לָהֶן כַּטּוֹב בְּעֵינֵיכֶם
  choice: உங்கள் பார்வைக்கு நல்லது என்று தோன்றுவதை அவர்களுக்குச் செய்யுங்கள்
  rationale: ‘உங்கள் கண்களில் நல்லது’ என்ற மூல மொழிப்படிமத்தை வாசிக்கத்தக்க தமிழில் நெருக்கமாகப் பேணுகிறது; அதிர்ச்சியூட்டும் கூற்றை மென்மையாக்கவில்லை.
- source_word: רַק לָאֲנָשִׁים הָאֵל אַל תַּעֲשׂוּ דָבָר
  choice: ஆனால் இந்த மனிதர்களுக்கு மட்டும் எதுவும் செய்யாதீர்கள்
  rationale: רַק குறிக்கும் வலுவான விதிவிலக்கை ‘மட்டும்’ தெளிவாக்குகிறது; தமிழின் இயல்பான எதிர்மறை மாறுபாட்டிற்காக ‘ஆனால்’ சேர்க்கப்பட்டுள்ளது.
- source_word: כִּי עַל כֵּן בָּאוּ
  choice: ஏனெனில் அவர்கள் ... தஞ்சம் புகுந்திருக்கிறார்கள்
  rationale: விருந்தினர்கள் லோத்தின் பாதுகாப்பை நாடி வந்ததே தடைக்கான காரணம் என்பதை காரணத் தொடர்புடன் தெரிவிக்கிறது; עַל כֵּן-ஐ இயந்திரத்தனமாக மொழிபெயர்க்கவில்லை.
- source_word: בְּצֵל קֹרָתִי
  choice: என் கூரையின் நிழலில் தஞ்சம் புகுந்திருக்கிறார்கள்
  rationale: ‘என் கூரையின் நிழலில்’ என்ற மூலப் படிமத்தையும், விருந்தோம்பலால் கிடைக்கும் அடைக்கலம்/பாதுகாப்பு என்ற சூழற்பொருளையும் இணைத்துப் பேணுகிறது.
theological_decisions:
- issue: லோத்தின் அதிர்ச்சியூட்டும் முன்மொழிவை ஒழுக்கரீதியாக மென்மையாக்கலாமா
  choice: எபிரெய உரையின் நேரடியான, கடுமையான பொருளைத் தக்கவைத்தல்
  alternative: ‘அவர்களை உங்கள் விருப்பப்படி நடத்துங்கள்’ போன்ற மென்மையான பொதுமொழியைப் பயன்படுத்துதல்
  rationale: உரை லோத்தின் செயலை நியாயப்படுத்தவில்லை; அதேபோல் மொழிபெயர்ப்பும் அதற்கு ஒழுக்க அங்கீகாரம் அளிக்கவோ அதன் கொடுமையை மறைக்கவோ கூடாது.
- issue: ‘கூரையின் நிழல்’ என்பதைக் கூறுமொழியாக மட்டுமே தரலாமா
  choice: மூலப் படிமத்தை உரையில் வைத்துக் கொண்டு ‘தஞ்சம்’ மூலம் அதன் பாதுகாப்புப் பொருளை வெளிப்படுத்துதல்
  alternative: ‘என் வீட்டின் பாதுகாப்புக்குள் வந்திருக்கிறார்கள்’ என்று படிமத்தை முழுவதும் விளக்கமாக மாற்றுதல்
  rationale: விருந்தினரைப் பாதுகாக்கும் கடமை என்ற பண்பாட்டுப் பொருளை வாசகர் புரிந்துகொள்ள உதவியபடியே எபிரெய உருவகத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மூலத்தின் மன்றாட்டுத் தொனி, கடுமையான முன்மொழிவு, விருந்தினர் பாதுகாப்பு ஆகியவை மென்மையாக்கப்படாமல் இயல்பான தமிழ் வாக்கிய அமைப்பில் தரப்பட்டுள்ளன.
