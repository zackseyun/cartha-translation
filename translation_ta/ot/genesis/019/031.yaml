base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/031.yaml
  text: And the firstborn said to the younger[a], “Our father is old[b], and there is not a man in the land to come in to us according to the way of all the earth.”
translation:
  language: ta
  text: முதற்பிறந்தவள் இளையவளிடம், “நம் தந்தை வயதானவர்; பூமியெங்கும் உள்ள வழக்கின்படி[b] நம்மிடம் வர[a] இந்த நிலத்தில் ஓர் ஆணும் இல்லை” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நம்மிடம் வர’ என்பது இங்கு ‘நம்மோடு பாலுறவுகொள்வதற்கு’ என்று பொருள்படும் மறைமுகச் சொல்லாட்சி.
    reason: lexical_alternative
  - marker: b
    text: ‘பூமியெங்கும் உள்ள வழக்கின்படி’ என்பது பொதுவான மனித நடைமுறையைக் குறிக்கிறது; இச்சூழலில் இது ஆண்-பெண் சேர்க்கை மற்றும் சந்ததி தொடர்வதையும் உள்ளடக்குகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: הַבְּכִירָה
  choice: மூத்தவள்
  rationale: இச்சொல் முதற்பேறான அல்லது வயதில் மூத்த பெண்ணைக் குறிக்கிறது. தமிழில் இணையாக வரும் ‘இளையவள்’ என்பதுடன் ‘மூத்தவள்’ இயல்பான பிறப்பு-வரிசை வேறுபாட்டைக் காட்டுகிறது.
- source_word: הַצְּעִירָה
  choice: இளையவள்
  rationale: ஒப்பீட்டு நிலையில் இளைய அல்லது சிறியவளைக் குறிக்கும் சொல்; இங்கு சகோதரிகளின் வயது/பிறப்பு வரிசையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אָבִינוּ זָקֵן
  choice: நம் தந்தை வயதானவர்
  rationale: வினைச்சொல் இல்லாத எபிரெயப் பெயரெச்ச வாக்கியத்தை நேரான, மரியாதையான நவீனத் தமிழில் அளிக்கிறது.
- source_word: וְאִישׁ אֵין בָּאָרֶץ
  choice: இந்த நாட்டில் ஓர் ஆணும் இல்லை
  rationale: אִישׁ என்பதன் ஆண்பால் குறிப்பைத் தக்கவைக்கிறது. சூழலால் குறிப்பிட்ட நிலப்பகுதியைச் சுட்டும் பொருட்டு ‘இந்த நாடு’ என இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது; ‘உலகமே’ எனக் கட்டாயமாக விரிவுபடுத்தப்படவில்லை.
- source_word: לָבוֹא עָלֵינוּ
  choice: நம்மிடம் வருவதற்கு
  rationale: பாலுறவைக் குறிக்கும் எபிரெய மறைமுகச் சொல்லாட்சியை வெளிப்படையான விளக்கமாக மாற்றாமல், தமிழிலும் இயங்கக்கூடிய மறைமுக வடிவில் தக்கவைக்கிறது.
- source_word: כְּדֶרֶךְ כָּל הָאָרֶץ
  choice: உலகமெங்கும் உள்ள வழக்கின்படி
  rationale: சொல்லுக்குச் சொல் ‘பூமியனைத்தின் வழியின்படி’ என்பதைக் காட்டிலும் இயல்பாக இருந்து, பொதுவான மனித வழக்கம் அல்லது நடைமுறை என்ற பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘நம்மிடம் வருதல்’ என்பதன் பாலுறவு சார்ந்த மறைபொருள்
  choice: முதன்மை உரையில் மறைமுகச் சொல்லாட்சியைத் தக்கவைத்து அடிக்குறிப்பில் பொருளை விளக்குதல்
  alternative: ‘நம்மோடு பாலுறவுகொள்ள’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: மூல எபிரெயத்தின் நயமான மறைமுகத் தன்மையையும் அதன் சூழல்சார் பொருளையும் ஒருசேர பாதுகாக்கிறது; உரையில் இல்லாத ஒழுக்கவியல் அல்லது சமய விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன, dignified பொதுத் தமிழில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் பாலுறவு சார்ந்த மறைமுகச் சொல்லாட்சி முதன்மை உரையில் பாதுகாக்கப்பட்டு, தவறான புரிதலைத் தவிர்க்க அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்றொடர்களுக்குப் பின் வைக்கப்பட்டுள்ளன.
