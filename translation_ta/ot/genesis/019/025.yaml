source:
  edition: WLC
  text: וַֽ/יַּהֲפֹךְ֙ אֶת הֶ/עָרִ֣ים הָ/אֵ֔ל וְ/אֵ֖ת כָּל הַ/כִּכָּ֑ר וְ/אֵת֙ כָּל יֹשְׁבֵ֣י הֶ/עָרִ֔ים וְ/צֶ֖מַח הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/025.yaml
  text: And he overthrew those cities[a], and all the plain, and all the inhabitants of the cities[b], and the vegetation of the ground.
translation:
  language: ta
  text: அவர் அந்த நகரங்களையும், சமவெளிப் பகுதி முழுவதையும்[b], அந்த நகரங்களில் வாழ்ந்த அனைவரையும், நிலத்தில் முளைத்து வளர்ந்த அனைத்தையும் கவிழ்த்தார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கவிழ்த்தார்’ என்பதற்கு ‘தலைகீழாக்கினார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை பேரழிவான கவிழ்ப்பை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘சமவெளிப் பகுதி’ என்பது யோர்தான் சமவெளி மாவட்டத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: கவிழ்த்துப்போட்டார்
  rationale: הפך என்ற வினை பேரழிவை உண்டாக்கும் விதத்தில் கவிழ்த்தல் அல்லது தலைகீழாக்குதல் என்ற தெளிவான படிமத்தைக் கொண்டுள்ளது. பொதுவான ‘அழித்தார்’ என்பதைவிட ‘கவிழ்த்துப்போட்டார்’ அந்த படிமத்தையும் இச்சூழலின் பேரழிவுத் தன்மையையும் காக்கிறது.
- source_word: הֶעָרִים הָאֵל
  choice: அந்த நகரங்கள்
  rationale: אֵל என்பது முன்பு குறிப்பிடப்பட்ட குறிப்பிட்ட நகரங்களைச் சுட்டுகிறது; நவீன தமிழில் ‘அந்த நகரங்கள்’ இயல்பான பின்னோக்குச் சுட்டாக உள்ளது.
- source_word: כָּל הַכִּכָּר
  choice: சமவெளிப் பகுதி முழுவதும்
  rationale: இச்சூழலில் כִּכָּר என்பது யோர்தான் சமவெளி மாவட்டத்தை அல்லது நிலப்பகுதியைக் குறிக்கிறது. ‘சமவெளிப் பகுதி’ என்பது வெறும் நிலவடிவத்தை மட்டுமல்லாமல் பரந்த பிரதேசத்தையும் இயல்பாக உணர்த்துகிறது.
- source_word: כָּל יֹשְׁבֵי הֶעָרִים
  choice: அந்த நகரங்களில் குடியிருந்த அனைவரும்
  rationale: ישב என்பதன் பங்கேற்பு வடிவம் அந்நகரங்களில் வாழ்ந்தவர்களைக் குறிக்கிறது. ‘குடியிருந்த அனைவரும்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: צֶמַח הָאֲדָמָה
  choice: நிலத்தில் முளைத்து வளர்ந்த அனைத்தும்
  rationale: צֶמַח என்பது முளைத்த தாவர வளர்ச்சியையும் אֲדָמָה நிலம் அல்லது மண்ணையும் குறிக்கிறது. ‘முளைத்து வளர்ந்த அனைத்தும்’ மூலத்தின் வளர்ச்சி சார்ந்த பொருளைக் காத்து, தமிழில் ‘நிலத்தின் தாவரங்கள்’ என்பதைக் காட்டிலும் இயல்பாக உள்ளது.
theological_decisions:
- issue: ஒருமை வினையின் மறைமுக எழுவாய்
  choice: ‘அவர்’ என்று மட்டும் மொழிபெயர்த்து, இவ்வசனத்துக்குள் எழுவாயின் பெயரைச் சேர்க்கவில்லை.
  alternative: ‘ஆண்டவர்’ அல்லது ‘தேவன்’ என்று எழுவாயை வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: எபிரெய வசனத்தில் ஒருமை வினை வந்தாலும் இக்கூற்றில் எழுவாய் பெயரால் கூறப்படவில்லை; முந்தைய சூழல் செய்பவரை அடையாளப்படுத்துகிறது. வசனம் வெளிப்படையாகச் சொல்லாத பெயரைச் சேர்க்காமல், சூழலோடு தொடர்ச்சியைப் பேண ‘அவர்’ பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில், வாசிக்க எளிதானதாயும் கண்ணியமானதாயும் வடிவமைக்கப்பட்டது. ‘கவிழ்த்துப்போட்டார்’ மூலத்தின் வலுவான உடற் படிமத்தைப் பேணுகிறது; ‘நிலத்தில் முளைத்து வளர்ந்த அனைத்தும்’ தாவர வளர்ச்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
