base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/016.yaml
  text: But he lingered[a], so the men seized his hand, his wife’s hand, and the hands of his two daughters, because of Yahweh’s compassion for him[b]; and they brought him out and set him outside the city.
translation:
  language: ta
  text: ஆனால் அவன் தாமதித்தான். அப்போது அந்த மனிதர்கள்[a] யாவே அவன்மீது இரக்கம் கொண்டிருந்ததால், அவனுடைய கையையும், அவன் மனைவியின் கையையும், அவனுடைய இரண்டு மகள்களின் கைகளையும் உறுதியாகப் பிடித்தார்கள்; அவர்கள் அவனை வெளியே கொண்டுவந்து, நகரத்துக்கு வெளியே வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சூழலில் இவர்கள் தேவதூதர்கள்; இவ்வசனத்தின் எபிரெய உரை இவர்களை ‘மனிதர்கள்’ என்று அழைக்கிறது.
    reason: contextual_identification
lexical_decisions:
- source_word: וַיִּתְמַהְמָהּ
  choice: தாமதித்துக்கொண்டிருந்தான்
  rationale: இந்த வினை அவன் உடனே புறப்படாமல் காலந்தாழ்த்தியதைச் சுட்டுகிறது; வெறும் மனத் தயக்கம் என்று பொருளைச் சுருக்கவில்லை.
- source_word: הָאֲנָשִׁים
  choice: அந்த மனிதர்கள்
  rationale: இவ்வசனத்தின் எபிரெய உரை அவர்களை நேரடியாக ‘மனிதர்கள்’ என்றே குறிப்பிடுகிறது; சூழலில் அவர்கள் தேவதூதர்கள் என்ற அடையாளத்தை முதன்மை உரைக்குள் இறக்குமதி செய்யவில்லை.
- source_word: וַיַּחֲזִקוּ
  choice: கெட்டியாகப் பிடித்தார்கள்
  rationale: חזק என்பதன் உறுதியான, அவசரமான பிடிப்பை இயல்பான தமிழில் தெரிவிக்கிறது; ‘பற்றிக்கொண்டார்கள்’ என்பதைக் காட்டிலும் மீட்புச் செயலின் வலிமையைத் தெளிவுபடுத்துகிறது.
- source_word: בְּיָדוֹ ... וּבְיַד אִשְׁתּוֹ ... וּבְיַד שְׁתֵּי בְנֹתָיו
  choice: அவனுடைய கையையும், அவன் மனைவியின் கையையும், அவனுடைய இரண்டு மகள்களின் கைகளையும்
  rationale: எபிரெயத்தில் ‘கை’ மீண்டும் மீண்டும் வருவதைத் தமிழிலும் பெருமளவு காத்து, இரண்டு மகள்களைக் குறிக்கும் இறுதிப் பகுதியில் இயல்பாகப் பன்மையைப் பயன்படுத்துகிறது.
- source_word: בְּחֶמְלַת יְהוָה עָלָיו
  choice: யாவே அவன்மீது இரக்கம் கொண்டதால்
  rationale: בְּ இங்கு காரணத்தைக் காட்டுகிறது; חמלה என்பது இரக்கம் அல்லது பரிவைக் குறிக்கிறது. தமிழ் வாக்கிய அமைப்பில் இறைவனுடைய மீட்பு நோக்கத்தைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரைப் பட்டப்பெயராக மாற்றாமல், பொதுவாக ஏற்றுக்கொள்ளப்படும் தமிழ் ஒலிபெயர்ப்பில் வழங்குகிறது.
- source_word: וַיֹּצִאֻהוּ
  choice: அவனை ... வெளியே கொண்டுபோய்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ஒருவரை வெளியே செல்லச் செய்வதைக் குறிக்கிறது; ‘வெளியே கொண்டுபோய்’ என்பது இயல்பான தமிழ்.
- source_word: וַיַּנִּחֻהוּ
  choice: அங்கே நிறுத்தினார்கள்
  rationale: נוח என்பதன் ஹிஃபில் வடிவம் இங்கு ஒருவரை ஓர் இடத்தில் வைத்து நிறுத்துவதைக் குறிக்கிறது; ‘விட்டுவிட்டார்கள்’ என்று மொழிபெயர்த்தால் கைவிட்டுச் சென்றனர் என்ற தேவையற்ற நிழற்பொருள் ஏற்படலாம்.
- source_word: מִחוּץ לָעִיר
  choice: நகரத்துக்கு வெளியே
  rationale: நகர எல்லைக்கு வெளியிலுள்ள இடத்தைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: மீட்பவர்களின் கதையியல் அடையாளம்
  choice: அந்த மனிதர்கள்
  alternative: அந்த தேவதூதர்கள்
  rationale: பரந்த சூழல் இவர்களைத் தேவதூதர்களாக அடையாளப்படுத்தினாலும், இவ்வசனம் பயன்படுத்தும் ‘மனிதர்கள்’ என்ற சொல்லை முதன்மை உரை காக்கிறது.
- issue: வெளியே கொண்டுபோகப்பட்டவரைக் குறிக்கும் ஒருமைச் சுட்டுப்பெயர்
  choice: அவனை
  alternative: அவர்களை
  rationale: குடும்பத்தினர் அனைவரும் கைகளால் பிடிக்கப்பட்டதாகச் சூழல் காட்டினாலும், இவ்வசனத்தின் இரு வினைகளோடும் எபிரெய உரை ஆண்பால் ஒருமைச் சுட்டுப்பெயரையே பயன்படுத்துகிறது; அந்த உரைத்தன்மை காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான அதேவேளையில் சாதாரண வாசகருக்கு உடனடியாகப் புரியும் நடையில் வடிவமைக்கப்பட்டது. எபிரெய வாக்கியத்தின் நீண்ட தொடரைத் தமிழின் இயல்புக்கேற்ப மூன்று வாக்கியங்களாகப் பிரித்தாலும், காரணத் தொடர்பும் நிகழ்வுகளின் வரிசையும் காக்கப்பட்டுள்ளன.
