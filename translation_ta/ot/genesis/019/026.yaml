  text: וַ/תַּבֵּ֥ט אִשְׁתּ֖/וֹ מֵ/אַחֲרָ֑י/ו וַ/תְּהִ֖י נְצִ֥יב מֶֽלַח׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/026.yaml
  text: But his wife looked back from behind him[b][a], and she became a pillar of salt.
translation:
  language: ta
  text: அவனுடைய மனைவியோ, அவனுக்குப் பின்னாலிருந்து திரும்பிப் பார்த்தாள்[a]; அவள் உப்புத் தூணானாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரை இன்னும் நேரடியாக, “அவனுக்குப் பின்னாலிருந்து பார்த்தாள்” என்று மொழிபெயர்க்கலாம்; அல்லது “அவனுக்குப் பின்னால் பார்த்தாள்” என்றும் புரிந்துகொள்ளலாம்.
    reason: מֵאַחֲרָיו என்ற சொற்றொடர் அவள் இருந்த இடத்தைக் குறிக்கிறதா அல்லது அவள் பார்த்த திசையைச் சுட்டுகிறதா என்ற இலக்கண நுட்பத்தைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַתַּבֵּט
  choice: திரும்பிப் பார்த்தாள்
  rationale: נבט என்பதன் அடிப்படைப் பொருள் ‘பார்/நோக்கு.’ இச்சூழலில் தொடர்ந்து வரும் מֵאַחֲרָיו என்ற சொற்றொடருடன் சேர்ந்து, பின்னோக்கிப் பார்த்த செயலை இயல்பான தமிழில் ‘திரும்பிப் பார்த்தாள்’ என்று தெரிவிக்கிறது; அவளுடைய நோக்கத்தைப் பற்றி உரை கூறாத எதையும் இது சேர்ப்பதில்லை.
- source_word: אִשְׁתּוֹ
  choice: அவனுடைய மனைவி
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள பெயர்ச்சொல் நேரடியாக ‘அவனுடைய மனைவி’ என்று பொருள்படுகிறது; சூழலில் ‘அவன்’ லோத்தைக் குறிக்கிறது.
- source_word: מֵאַחֲרָיו
  choice: அவனுக்குப் பின்னால் இருந்து
  rationale: מִן + אַחַר மற்றும் ஆண்பால் ஒருமைப் பின்னொட்டு ஆகியவை சொல்லுக்குச் சொல் ‘அவனுக்குப் பின்னாலிருந்து’ எனப் பொருள்படும். இந்த மொழிபெயர்ப்பு அவள் லோத்துக்குப் பின்னால் இருந்த இடநிலையைப் பாதுகாக்கிறது; அதேவேளையில் இதை ‘அவனுக்குப் பின்னால் நோக்கினாள்’ எனப் புரிந்துகொள்ளும் இலக்கண வாய்ப்பை அடிக்குறிப்பு குறிப்பிடுகிறது.
- source_word: וַתְּהִי
  choice: ஆனாள்
  rationale: கதைத் தொடரில் היה இங்கு வெறும் இருப்பைக் காட்டுவதற்குப் பதிலாக ஏற்பட்ட மாற்றம் அல்லது விளைவு நிலையைக் குறிக்கிறது; ஆகவே ‘ஆனாள்’ என்பது சுருக்கமான, இயல்பான தமிழ்.
- source_word: נְצִיב מֶלַח
  choice: உப்புத் தூண்
  rationale: נְצִיב என்பது நிறுவப்பட்டு நிற்கும் தூண் அல்லது நெடுநிலை வடிவைக் குறிக்கலாம்; מֶלַח உடனான இணைப்பு தமிழில் இயல்பாக ‘உப்புத் தூண்’ என அமைகிறது.
theological_decisions:
- issue: லோத்தின் மனைவிக்கு ஏற்பட்ட மாற்றத்தின் தன்மை
  choice: ‘அவள் உப்புத் தூணானாள்’ என்று நிகழ்வை நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘அவள் உப்புத் தூண்போல் ஆனாள்’ அல்லது ‘அவள் உப்புத் தூணாக அங்கே நின்றாள்’
  rationale: எபிரெய உரையில் உவமைக்கான குறியீடு எதுவும் இல்லை; היה என்ற வினையும் பெயர்ச்சொற்றொடரும் நிகழ்வை நேரடியாகக் கூறுகின்றன. எனவே உவமையாக்காமலும் கூடுதல் விளக்கம் சேர்க்காமலும் கதையின் கூற்றை அப்படியே வைத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘மனைவியோ’ என்பது முந்தைய நிகழ்வுடன் உள்ள எதிர்மறை மாறுபாட்டை இயல்பாக உணர்த்துகிறது. ‘உப்புத் தூணானாள்’ என்பது தேவையற்ற துணைவினைச் சுமையில்லாத, தெளிவான கதைநடை.
