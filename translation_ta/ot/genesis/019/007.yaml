source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר אַל נָ֥א אַחַ֖/י תָּרֵֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/007.yaml
  text: And he said, “Please, my brothers, do not do evil.”
translation:
  language: ta
  text: அவன், “என் சகோதரர்களே, தயவுசெய்து தீமை செய்யாதீர்கள்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַי
  choice: என் சகோதரர்களே
  rationale: நேரடியாக ‘என் சகோதரர்கள்’ என்று பொருள்படும் அழைப்புச் சொல்; இங்கு நெருக்கத்தையும் சமாதானப்படுத்தும் வேண்டுகோளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַל נָא
  choice: தயவுசெய்து ... செய்யாதீர்கள்
  rationale: אַל என்ற தடைச்சொல்லோடு வரும் נָא வேண்டுகோளின் பணிவையும் அவசரத்தையும் காட்டுகிறது.
- source_word: תָּרֵעוּ
  choice: இந்தத் தீமையைச் செய்யாதீர்கள்
  rationale: רעע வேரின் ஹிஃபில் வடிவம் இங்கு ‘தீமை செய்யுதல்/பொல்லாப்பாக நடப்பது’ என்ற பொருளைத் தருகிறது. சூழலில் குறிக்கப்படும் செயலைச் சுட்ட ‘இந்தத்’ என்பது தமிழில் இயல்பான தெளிவை வழங்குகிறது.
theological_decisions:
- issue: லோத்து நகரத்து ஆண்களை ‘சகோதரர்கள்’ என்று அழைப்பது
  choice: என் சகோதரர்களே
  alternative: நண்பர்களே
  rationale: மூலத்தின் உறவுமுறை அழைப்பை அப்படியே பாதுகாக்கிறது; அது உயிரியல் உறவையா, சமூக மரியாதையா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- issue: தடைசெய்யப்படும் தீமையின் வெளிப்படைத்தன்மை
  choice: இந்தத் தீமையைச் செய்யாதீர்கள்
  alternative: பொல்லாப்பாக நடந்துகொள்ளாதீர்கள்
  rationale: மூலத்தில் செயல் பொதுவாக ‘தீமை செய்தல்’ என்று சொல்லப்படுகிறது; அடுத்தடுத்த சூழல் அதன் தன்மையை விளக்க அனுமதிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, நேரடியான உரை. ‘தயவுசெய்து’ வேண்டுகோளின் தொனியையும், மரியாதைப் பன்மை வினைமுற்று கூட்டத்திடம் உரையாடுவதையும் வெளிப்படுத்துகின்றன.
