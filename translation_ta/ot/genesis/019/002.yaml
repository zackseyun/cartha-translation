  text: וַ/יֹּ֜אמֶר הִנֶּ֣ה נָּא אֲדֹנַ֗/י ס֣וּרוּ נָ֠א אֶל בֵּ֨ית עַבְדְּ/כֶ֤ם וְ/לִ֨ינוּ֙ וְ/רַחֲצ֣וּ רַגְלֵי/כֶ֔ם וְ/הִשְׁכַּמְתֶּ֖ם וַ/הֲלַכְתֶּ֣ם לְ/דַרְכְּ/כֶ֑ם וַ/יֹּאמְר֣וּ לֹּ֔א כִּ֥י בָ/רְח֖וֹב נָלִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/002.yaml
  text: And he said[a], “Please, my lords, turn aside to your servant’s house, and spend the night, and wash your feet. Then you may rise early and go on your way.” But they said, “No[d][c][b], but we will spend the night in the square.”
translation:
  language: ta
  text: அவர், “தயவுசெய்து, என் ஆண்டவர்களே[a], வழியிலிருந்து விலகி உங்கள் அடியானின் வீட்டுக்கு வாருங்கள். அங்கே இரவு தங்கி, உங்கள் கால்களைக் கழுவிக்கொள்ளுங்கள். பிறகு அதிகாலையில் எழுந்து உங்கள் பயணத்தைத் தொடரலாம்” என்றார். அதற்கு அவர்கள், “இல்லை; நகரச் சதுக்கத்தில்தான்[b] இரவு தங்குவோம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் ஆண்டவரே’ என்றும் மொழிபெயர்க்கலாம்; ஆனால் லோத்து இரண்டு வருகையாளர்களிடம் பேசுவதால், இங்கு பன்மைப் பொருள் சூழலுக்கு நன்றாகப் பொருந்துகிறது.
    reason: alternative_reading
  - marker: b
    text: இதற்கான எபிரெயச் சொல் நகரிலுள்ள சதுக்கம் அல்லது பொதுமக்கள் கூடும் திறந்த வெளி போன்ற இடத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֶּה נָּא
  choice: தயவுசெய்து
  rationale: இச்சொற்றொடர் இங்கு பார்வைக்கான நேரடிக் கட்டளையாக அல்லாமல், மரியாதையும் வற்புறுத்தலும் கலந்த வேண்டுகோளின் தொடக்கமாகச் செயல்படுகிறது.
- source_word: אֲדֹנַי
  choice: என் ஆண்டவர்களே
  rationale: லோத்து இரு விருந்தினர்களையும் மரியாதையுடன் அழைக்கிறார்; பன்மை வினைகளும் பதிலிடுபெயர்களும் இங்கு பன்மைப் பொருளை ஆதரிக்கின்றன.
- source_word: סוּרוּ נָא אֶל־בֵּית עַבְדְּכֶם
  choice: தயவுசெய்து வழியிலிருந்து விலகி உங்கள் அடியானின் வீட்டுக்கு வாருங்கள்
  rationale: סור என்பதன் திசைசார் பொருளான வழியிலிருந்து விலகுதலைக் காத்து, தமிழில் இயல்பான விருந்தோம்பல் அழைப்பாக அமைக்கப்பட்டுள்ளது.
- source_word: בֵּית עַבְדְּכֶם
  choice: உங்கள் அடியானின் வீடு
  rationale: லோத்து தம்மைத் தாழ்மையுடன் ‘உங்கள் அடியான்’ என்று குறிப்பிடும் எபிரெய மரியாதை முறையைப் பாதுகாக்கிறது.
- source_word: וְלִינוּ / נָלִין
  choice: இரவு தங்கி / இரவு தங்குவோம்
  rationale: இரண்டு இடங்களிலும் ஒரே לין வேரின் இரவுத் தங்குதல் என்ற பொருள் தெளிவாகவும் ஒத்திசைவாகவும் தரப்பட்டுள்ளது.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: உங்கள் கால்களைக் கழுவிக்கொள்ளுங்கள்
  rationale: பண்டைய விருந்தோம்பல் வழக்கை நேரடியாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: וְהִשְׁכַּמְתֶּם וַהֲלַכְתֶּם לְדַרְכְּכֶם
  choice: அதிகாலையில் எழுந்து உங்கள் வழியே செல்லலாம்
  rationale: அடுத்த நாள் அதிகாலையில் புறப்பட்டுத் தங்கள் பயணத்தைத் தொடரும் பொருளை, அழைப்பின் சூழலுக்கேற்ற அனுமதி நயத்துடன் வழங்குகிறது.
- source_word: כִּי
  choice: வேண்டாம்; … தங்குவோம்
  rationale: மறுப்புக்குப் பின் வரும் כִּי இங்கு எதிர்மாற்று அல்லது திருத்தும் வலியுறுத்தலைக் குறிக்கிறது; தமிழில் அரைப்புள்ளிக்குப் பிந்தைய மாற்றுக் கூற்று அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָרְחוֹב
  choice: நகரத்தின் திறந்த வெளியில்
  rationale: רְחוֹב என்பது சாதாரணச் சாலையை மட்டும் அல்லாமல் நகரின் திறந்த பொதுவெளி அல்லது சதுக்கத்தையும் குறிக்கலாம்; சூழலுக்கு ஏற்ற பரந்த பொருள் தேர்ந்தெடுக்கப்பட்டுள்ளது.
theological_decisions:
- issue: אֲדֹנַי என்பதை தெய்வீகப் பட்டமாகவா, மனிதர்களுக்கான மரியாதை அழைப்பாகவா மொழிபெயர்ப்பது
  choice: மனிதர்களுக்கான பன்மை மரியாதை அழைப்பான ‘என் ஆண்டவர்களே’
  alternative: ஒருமை மரியாதை வடிவமாக ‘என் ஆண்டவரே’
  rationale: கதைச்சூழலில் லோத்து இரண்டு வருகையாளர்களிடம் பேசுகிறார்; வசனத்தின் பன்மை வினை மற்றும் பதிலிடுபெயர் வடிவங்களும் பன்மை வாசிப்பை ஆதரிக்கின்றன. ஆகவே தேவனை நேரடியாக அழைப்பதாக முதன்மை உரையில் முன்கூட்டியே தீர்மானிக்காமல், மனித விருந்தினர்களுக்கான மரியாதை அழைப்பு தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. ‘உங்கள் அடியான்’ என்ற பணிவுச் சொல்லாட்சி மூலத்தின் சமூக மரியாதை நயத்தைப் பாதுகாக்கிறது; ‘வழியிலிருந்து விலகி … வாருங்கள்’ என்பது மூல வினையின் திசை உணர்வையும் இயல்பான தமிழ் அழைப்பையும் இணைக்கிறது.
