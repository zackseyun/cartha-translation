  source_fidelity: 'மூல எபிரெயத்தின் முக்கிய கூறுகள் துல்லியமாக உள்ளன: லோத்து வெளியே செல்வது, மகள்களை மணந்துகொள்ளவிருந்த மருமகன்களிடம் பேசுவது, அவசரக் கட்டளை, யாவே நகரத்தை அழிக்கப்போகிறார் என்ற உடன்நிகழ் எச்சரிக்கை, மற்றும் மருமகன்கள் அதை வேடிக்கையாகக் கருதியது ஆகியவை அனைத்தும் பாதுகாக்கப்பட்டுள்ளன. לֹקְחֵי בְנֹתָיו என்பதன் திருமண-நிலைத் தெளிவின்மை அடிக்குறிப்பில் முறையாகக் காக்கப்பட்டுள்ளது.'
