base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/014.yaml
  text: So Lot went out and spoke to his sons-in-law[a], who were to marry his daughters, and said, “Get up, get out of this place[b], because Yahweh is about to destroy the city.” But he seemed to his sons-in-law to be joking.
translation:
  language: ta
  text: லோத்து வெளியே போய், தன் மகள்களை மணந்துகொள்ளவிருந்த மருமகன்களிடம்[a], “எழுந்திருங்கள்! இந்த இடத்தைவிட்டு வெளியேறுங்கள்; ஏனெனில் யாவே இந்த நகரத்தை அழிக்கப்போகிறார்” என்றார். ஆனால் அவர் வேடிக்கையாகப் பேசுவதாக அவருடைய மருமகன்களுக்குத் தோன்றியது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் மகள்களை மணந்திருந்த மருமகன்களிடம்.” எபிரெயச் சொற்றொடர், அவருடைய மகள்களை ஏற்கெனவே மணந்தவர்களையோ அவர்களை மணந்துகொள்ளவிருந்தவர்களையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “அவர் தன் மருமகன்களின் கண்களில் வேடிக்கை பேசுகிறவரைப் போல இருந்தார்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲתָנָיו
  choice: மருமகன்கள்
  rationale: חָתָן என்பது மணமகனையோ மருமகனையோ குறிக்கலாம். இங்கு அடுத்துவரும் ‘அவருடைய மகள்களை எடுத்துக்கொள்கிறவர்கள்’ என்ற தொடருடன் சேர்ந்து, திருமண உறவிலுள்ள அல்லது திருமணம் செய்யவிருந்த ஆண்களைக் குறிக்கிறது.
- source_word: לֹקְחֵי בְנֹתָיו
  choice: தன் மகள்களை மணந்துகொள்ளவிருந்த
  rationale: ‘மகள்களை எடுத்துக்கொள்கிறவர்கள்’ என்ற எபிரெயப் பங்கேற்புவினை திருமணம் செய்துகொள்வதைக் குறிக்கிறது. மகள்கள் இன்னும் லோத்துவின் வீட்டில் இருப்பதாக அடுத்த வசனம் காட்டுவதால், எதிர்நோக்கிய திருமணத்தை முதன்மை உரை இயல்பாக வெளிப்படுத்துகிறது; எனினும் முடிந்த திருமணத்தையும் எபிரெயம் அனுமதிப்பதால் அடிக்குறிப்பில் ambiguity பாதுகாக்கப்படுகிறது.
- source_word: קוּמוּ צְּאוּ
  choice: எழுந்திருங்கள்! … வெளியேறுங்கள்
  rationale: இரண்டு கட்டளை வினைகளின் அவசரத்தையும் திடீர்த்தன்மையையும் இயல்பான நவீனத் தமிழில் பாதுகாக்கிறது.
- source_word: מִן־הַמָּקוֹם הַזֶּה
  choice: இந்த இடத்தைவிட்டு
  rationale: சுட்டுப்பொருளான ‘இந்த இடம்’ என்பதையும் வெளியேற வேண்டிய திசையையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: מַשְׁחִית
  choice: அழிக்கப்போகிறார்
  rationale: ஹிஃபில் பங்கேற்புவினை இச்சூழலில் உடனடியாக நிகழவிருக்கும் அழிவைச் சுட்டுகிறது; அழிவு இன்னும் தொடங்கவில்லை என்பதையும் தமிழ் வடிவம் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைபெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: כִּמְצַחֵק
  choice: வேடிக்கையாகப் பேசுவதாக
  rationale: அவர் சொன்னதை மருமகன்கள் தீவிரமாக எடுத்துக்கொள்ளாமல் நகைச்சுவைப் பேச்சாகக் கருதிய பொருளைத் தருகிறது; ‘கேலி செய்தார்’ என்று மிகையாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: בְּעֵינֵי חֲתָנָיו
  choice: அவருடைய மருமகன்களுக்குத் தோன்றியது
  rationale: ‘அவருடைய மருமகன்களின் கண்களில்’ என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை தனிப்பட்ட இறைபெயரையே பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, உரையின் தன்மையைப் பாதுகாக்கிறது.
- issue: லோத்தின் மகள்களுடன் மருமகன்களுக்கு இருந்த திருமண நிலை
  choice: மணந்துகொள்ளவிருந்தவர்கள்
  alternative: ஏற்கெனவே மணந்தவர்கள்
  rationale: לֹקְחֵי என்ற பங்கேற்புவினை இரு புரிதல்களையும் அனுமதிக்கிறது. அடுத்த வசனத்தில் மகள்கள் லோத்துடன் இருப்பதால் நிச்சயிக்கப்பட்ட திருமணம் முதன்மை உரையில் ஏற்கப்பட்டது; மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கட்டளைகளின் அவசரத் தன்மை குறுகிய வாக்கியங்களாலும் வியப்புக்குறியாலும் வெளிப்படுத்தப்பட்டுள்ளது. திருமண நிலை குறித்த மூலத்தின் ambiguity அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
