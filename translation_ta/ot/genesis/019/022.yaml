  source_fidelity: மூல எபிரெயத்தின் அவசரக் கட்டளை (மַהֵר), தப்பிப் பாதுகாப்பாகச் செல்லும் நிபால் கட்டளை (הִמָּלֵט), இலக்கிடத் திசை, மற்றும் ‘நீ அங்கே சேரும்வரை என்னால் எதுவும் செய்ய முடியாது’ என்ற வெளிப்படையான இயலாமைக் கூற்று ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. பெயரிடல் வாக்கியம் எபிரெயத்தின் குறிப்பிடப்படாத மூன்றாம் ஆண் ஒருமையைத் தமிழில் தேவையின்றிக் குறிப்பாக்காமல் இயல்பான செயலற்ற வடிவில் தருகிறது.
  naturalness: “விரைந்து அங்கே தப்பிச் செல்” மற்றும் “நீ அங்கே போய்ச் சேரும்வரை” நவீனத் தரத் தமிழில் தெளிவாகவும் கதைநடைக்கு ஏற்றவாறும் உள்ளன. நிறுத்தக்குறிகளும் மேற்கோள் அமைப்பும் இயல்பானவை.
