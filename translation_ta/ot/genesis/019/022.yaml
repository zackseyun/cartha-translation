source:
  edition: WLC
  text: מַהֵר֙ הִמָּלֵ֣ט שָׁ֔מָּ/ה כִּ֣י לֹ֤א אוּכַל֙ לַ/עֲשׂ֣וֹת דָּבָ֔ר עַד בֹּאֲ/ךָ֖ שָׁ֑מָּ/ה עַל כֵּ֛ן קָרָ֥א שֵׁם הָ/עִ֖יר צֽוֹעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/022.yaml
  text: Hurry[a], escape there[b], for I cannot do anything until you arrive there.” Therefore the city was called Zoar.
translation:
  language: ta
  text: “விரைந்து அங்கே தப்பிச் செல்; நீ அங்கே போய்ச் சேரும்வரை என்னால் எதுவும் செய்ய முடியாது.” ஆகவே, அந்த நகரத்துக்குச் சோவார்[a] என்று பெயரிடப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சோவார்” என்ற பெயர், எபிரெயத்தில் “சிறியது” அல்லது “அற்பமானது” என்பதற்கான சொல்லை ஒத்துள்ளது; ஆதியாகமம் 19:20-ஐப் பார்க்கவும்.
    reason: cross_reference
lexical_decisions:
- source_word: מַהֵר
  choice: விரைந்து
  rationale: அவசரத்தை உணர்த்தும் கட்டளை வினையின் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הִמָּלֵט שָׁמָּה
  choice: அங்கே தப்பிச் செல்
  rationale: நிபால் கட்டளையின் ‘தப்புதல்/தன்னைக் காத்துக்கொள்ளுதல்’ என்ற பொருளையும் திசையைக் குறிக்கும் שָׁמָּה என்பதையும் இயல்பாக இணைக்கிறது.
- source_word: כִּי לֹא אוּכַל לַעֲשׂוֹת דָּבָר
  choice: என்னால் எதுவும் செய்ய முடியாது
  rationale: மூலத்தில் வெளிப்படையாகக் கூறப்படும் இயலாமையையும் דָּבָר என்பதன் பொதுவான பரப்பையும் குறுக்காமல் காக்கிறது.
- source_word: עַד בֹּאֲךָ שָׁמָּה
  choice: நீ அங்கே போய்ச் சேரும்வரை
  rationale: ‘நீ அங்கே வரும்வரை’ என்பதன் சூழல்சார் பொருளை இலக்கு நகரத்தை அடைவதாகத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: עַל כֵּן
  choice: ஆகவே
  rationale: இடப்பெயருக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய முடிவுரைத் தொடர்பைச் சுருக்கமாகக் காக்கிறது.
- source_word: קָרָא שֵׁם הָעִיר
  choice: அந்த நகரத்துக்கு … என்று பெயரிடப்பட்டது
  rationale: எபிரெய மொழியின் சொற்படியான ‘அவன் நகரத்தின் பெயரை அழைத்தான்’ என்ற அமைப்பை தமிழில் இயல்பான பெயரிடல் வாக்கியமாக மாற்றுகிறது; குறிப்பிடப்படாத 3ஆம் ஆண்பால் ஒருமை எழுவாயைத் தேவையின்றி அடையாளப்படுத்தவில்லை.
- source_word: צֹעַר
  choice: சோவார்
  rationale: இடப்பெயரை மொழிபெயர்க்காமல் தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
theological_decisions:
- issue: நியாயத்தீர்ப்புச் சூழலில் கூறப்படும் இயலாமை
  choice: “என்னால் எதுவும் செய்ய முடியாது” என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: “நான் எதுவும் செய்யக்கூடாது” அல்லது “இதைச் செய்ய முடியாது”
  rationale: לֹא אוּכַל இயலாமையை வெளிப்படையாகக் கூறுகிறது. பேசுபவர் யார் என்பதையோ அந்த இயலாமையின் இறையியல் காரணத்தையோ மொழிபெயர்ப்பு தீர்மானிக்காமல், மூலத்தின் பதற்றத்தை அப்படியே காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை. அவசரக் கட்டளையும் மூலத்தின் இறையியல் பதற்றமும் காக்கப்பட்டுள்ளன. அடிக்குறி குறியீடு தொடர்புடைய ‘சோவார்’ பெயருக்குப் பின் வைக்கப்பட்டுள்ளது.
