  source_fidelity: மூல எபிரெயத்தின் சாதாரணப் பெயர்ச்சொல்லான הָאֲנָשִׁים-ஐ ‘அந்த மனிதர்கள்’ எனத் தருவது சரியானது; சூழலிலுள்ள வானதூதர் அடையாளத்தை உரைக்குள் சேர்க்கவில்லை. கேள்வி, குடும்பத்தினரின் பட்டியல், நகரத்திலுள்ள லோத்துக்குரியோர், மற்றும் லோத்துக்கான ஒருமை கட்டளை ஆகியவை பொருளோடு காக்கப்பட்டுள்ளன. ‘இந்த இடத்திலிருந்து’ என்பது הַמָּקוֹם என்பதன் சூழல்-சுட்டும் இயல்பான தமிழ் வெளிப்பாடு; பொருளை மாற்றுவதில்லை.
  naturalness: நவீன பொதுத்தமிழில் வாசகம் இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘மருமகன், உன் மகன்கள், உன் மகள்கள்’ என்ற பட்டியல் மூலத்தின் சுருக்கமான பட்டியல் அமைப்பைச் சரியாகத் தக்கவைக்கிறது. ‘வெளியே அழைத்துக்கொண்டு போ’ கட்டளையின் அவசரமான வெளியேற்றப் பொருளைத் தெளிவாகத் தருகிறது.
  terminology: ‘மனிதர்கள்,’ ‘மருமகன்,’ ‘மகன்கள்,’ ‘மகள்கள்,’ ‘உனக்குரிய அனைவரும்’ ஆகிய சொற்கள் சூழலுக்கும் நவீன நிலையான தமிழுக்கும் ஏற்றவை. ‘மருமகன்’ என்பதற்கான மாற்றுப் பொருளான ‘மணமகன்’ அடிக்குறிப்பில் முறையாகக் குறிப்பிடப்பட்டுள்ளது. இரண்டாம் அடிக்குறிப்பு மூலத்தின் பரந்த ‘அனைத்தும்’ என்ற சொல்லையும் சூழல்சார் மனிதர் குறிக்கும் விளக்கத்தையும் சமநிலையுடன் தருகிறது.
