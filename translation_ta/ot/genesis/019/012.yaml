base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/012.yaml
  text: Then the men said to Lot[a], “Who else do you have here? A son-in-law, your sons, your daughters[c][b], and everyone who belongs to you in the city—bring them out of the place.”
translation:
  language: ta
  text: பின்பு அந்த மனிதர்கள் லோத்திடம், “இங்கே உனக்கு இன்னும் யார் இருக்கிறார்கள்? மருமகன்[a], உன் மகன்கள், உன் மகள்கள், நகரத்தில் உனக்குரிய அனைவரும்[b]—அவர்களை இந்த இடத்திலிருந்து வெளியே அழைத்துக்கொண்டு போ” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மணமகன்’ என்றும் மொழிபெயர்க்கலாம். இங்கே லோத்தின் மகள்களை மணந்த அல்லது மணக்கவிருந்த மருமகனைக் குறிக்கும் பொருளே அதிக வாய்ப்புள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “நகரத்தில் உனக்குரிய அனைத்தும்.” இச்சூழலில் இது லோத்தின் குடும்பம் அல்லது வீட்டாரைச் சேர்ந்த நகரத்திலுள்ள அனைவரையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: அந்த மனிதர்கள்
  rationale: எபிரெயச் சொல் பொதுவாக ‘மனிதர்கள்’ என்றே பொருள்படும். விரிந்த கதைச்சூழல் இவர்களைத் தூதர்களாக அடையாளப்படுத்தினாலும், இவ்வசனத்தின் சொல்வடிவமே முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
- source_word: עֹד מִי לְךָ פֹה
  choice: இங்கே உனக்கு இன்னும் யார் இருக்கிறார்கள்?
  rationale: லோத்துடன் தொடர்புடைய வேறு யார் அங்கே இருக்கிறார்கள் என்று கேட்கும் எபிரெய மொழிவழக்கை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: חָתָן
  choice: மருமகன்
  rationale: இச்சூழலில் லோத்தின் மகள்களை மணந்த அல்லது மணக்கவிருந்த ஆணைக் குறிக்கும் ‘மருமகன்’ என்பதே மிகப் பொருத்தமானது; எபிரெயச் சொல்லின் ஒருமை வடிவமும் காக்கப்படுகிறது.
- source_word: וּבָנֶיךָ וּבְנֹתֶיךָ
  choice: உன் மகன்கள், உன் மகள்கள்
  rationale: மூலத்தின் உடைமைத் தொடர்பையும் பன்மையையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְכֹל אֲשֶׁר לְךָ בָּעִיר
  choice: நகரத்தில் உனக்குரிய அனைவரும்
  rationale: சொல்லுக்கு சொல் பார்த்தால் ‘நகரத்தில் உனக்குரிய அனைத்தும்’ எனப் பொருள்படலாம்; ஆனால் வெளியேற்றப்பட வேண்டிய நபர்களின் பட்டியலாக இருப்பதால் மனிதர்களைக் குறிக்கும் இயல்பான வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: הוֹצֵא מִן הַמָּקוֹם
  choice: அவர்களை இந்த இடத்திலிருந்து வெளியே அழைத்துக்கொண்டு போ
  rationale: ஆண்பால் ஒருமை கட்டளை லோத்திடம் கூறப்படுகிறது. தமிழில் தேவையான செயப்படுபொருள் முந்தைய பட்டியலிலிருந்து வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது; கட்டளையின் அவசரமும் இயக்கமும் காக்கப்படுகின்றன.
theological_decisions:
- issue: הָאֲנָשִׁים என்பவர்களை முதன்மை உரையிலேயே வானதூதர்கள் என்று அடையாளப்படுத்த வேண்டுமா?
  choice: ‘அந்த மனிதர்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘அந்த வானதூதர்கள்’ அல்லது ‘அந்த தூதர்கள்’
  rationale: கதைச்சூழலில் அவர்கள் வானதூதர்கள் என்பது தெளிவாகினும், இவ்வசனம் சாதாரண ‘மனிதர்கள்’ என்ற சொல்லையே பயன்படுத்துகிறது. ஆகவே வசனத்தில் வெளிப்படையாக இல்லாத இறையியல் அடையாளத்தை முதன்மை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மதிப்புடனும் அமைக்கப்பட்டுள்ளது. ‘மனிதர்கள்’ எனும் மூலச்சொல் பாதுகாக்கப்பட்டு, குடும்பத் தொடர்பைக் குறிக்கும் சொற்றொடர்கள் சாதாரண வாசகர்களுக்குத் தெளிவாக வழங்கப்பட்டுள்ளன.
