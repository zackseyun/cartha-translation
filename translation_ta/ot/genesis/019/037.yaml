base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/037.yaml
  text: The firstborn bore a son and called his name Moab[a]; he is the father of Moab to this day.
translation:
  language: ta
  text: மூத்தவள் ஒரு மகனைப் பெற்றெடுத்து, அவனுக்கு மோவாப் என்று பெயரிட்டாள். அவனே இந்நாள்வரை மோவாபியரின் மூதாதை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லுக்குச் சொல், “இந்நாள்வரை மோவாபின் தந்தை.” இங்கு மூதாதையின் பெயரான “மோவாப்,” அவரிடமிருந்து தோன்றிய மோவாபிய மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: பெற்றெடுத்து
  rationale: Qal வடிவிலுள்ள ילד இங்கு ‘பெற்றெடுத்தாள்’ என்று பொருள்படும்; தமிழில் பிறப்பை இயல்பாகக் குறிக்கிறது.
- source_word: הַבְּכִירָה
  choice: மூத்தவள்
  rationale: பெண்பால் ஒருமைச் சொல் இச்சூழலில் லோத்தின் மூத்த மகளைக் குறிக்கிறது; முன்சூழலில் அவள் யார் என்பது தெளிவாக இருப்பதால் ‘மூத்தவள்’ இயல்பானது.
- source_word: בֵּן
  choice: ஒரு மகனை
  rationale: பிறந்த குழந்தை ஆண் என்பதைத் தெளிவாகவும் இயல்பான தமிழ் வாக்கிய அமைப்பிலும் தருகிறது.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: அவனுக்கு ... என்று பெயரிட்டாள்
  rationale: எபிரெய ‘அவன் பெயரை அழைத்தாள்’ என்ற மரபுத்தொடருக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: מוֹאָב
  choice: மோவாப்
  rationale: எபிரெயப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: הוּא
  choice: அவனே
  rationale: தனிப்பட்ட சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழில் தெளிவாகத் தக்கவைக்கிறது.
- source_word: אֲבִי מוֹאָב
  choice: மோவாபியரின் மூதாதை
  rationale: சொல்லுக்குச் சொல் ‘மோவாபின் தந்தை’; ஆனால் இங்கு மோவாபிய மக்களின் முன்னோன் என்ற இனவழிப் பொருளே நோக்கமாக இருப்பதால் ‘மூதாதை’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: עַד הַיּוֹם
  choice: இந்நாள்வரை
  rationale: கதைசொல்லியின் காலம்வரை தொடர்வதைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கான சுருக்கமான, கண்ணியமான தமிழ் வடிவம்.
