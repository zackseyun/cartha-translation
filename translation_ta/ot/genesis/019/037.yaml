translation_notes:
  register: நவீன செந்தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. ‘மூத்தவள்’ முன்சூழலைச் சார்ந்து லோத்தின் மூத்த மகளைக் குறிக்கிறது. மூலத்தின் ‘மோவாபின் தந்தை’ என்ற வடிவம் தமிழில் தவறாகப் புரியக்கூடும் என்பதால் பொருள் முதன்மை உரையில் தரப்பட்டு, சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
