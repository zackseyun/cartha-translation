  source_fidelity: மூல எபிரேயத்தின் வַתַּהֲרֶיןָ (‘கர்ப்பமடைந்தார்கள்/கருவுற்றார்கள்’), שְׁתֵּי בְנוֹת־לוֹט (‘லோத்தின் மகள்கள் இருவரும்’), மற்றும் מֵאֲבִיהֶן (‘தங்கள் தந்தையால்/தந்தையிடமிருந்து’) ஆகிய கூறுகள் அனைத்தும் துல்லியமாகக் கொடுக்கப்பட்டுள்ளன. ‘தங்கள் தந்தையால்’ என்பது இச்சூழலில் தந்தைவழி கர்ப்பத்தின் மூலத்தைக் கண்ணியமாகவும் வெளிப்படையாகவும் தெரிவிக்கிறது.
  naturalness: “இவ்வாறு, லோத்தின் மகள்கள் இருவரும் தங்கள் தந்தையால் கருவுற்றார்கள்” என்பது நவீன நிலையான தமிழில் இயல்பான, சுருக்கமான, கண்ணியமான நடை. வரலாற்று உரையின் சங்கடமான ஆனால் வெளிப்படையான பொருள் மென்மையாக்கப்படவோ மிகைப்படுத்தப்படவோ இல்லை.
  terminology: ‘கருவுற்றார்கள்’ பொருத்தமான நவீனத் தமிழ் சொல். மாற்றுச் சொல்லாக ‘கர்ப்பமடைந்தார்கள்’ என்பதைக் குறிக்கும் அடிக்குறிப்பு சரியானது. லோத் என்ற பெயரின் தமிழாக்கமும் நிலையானது; தேவையற்ற இறையியல் விளக்கங்கள் சேர்க்கப்படவில்லை.
