  yaml_path: translation/ot/genesis/019/036.yaml
  text: So both of Lot’s daughters became pregnant by their father[a][b].
translation:
  language: ta
  text: இவ்வாறு, லோத்தின் மகள்கள் இருவரும் தங்கள் தந்தையால் கருவுற்றார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கர்ப்பமடைந்தார்கள்”; எபிரேய வினை அவர்கள் குழந்தையைச் சுமக்கும் நிலைக்கு வந்ததைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “தங்கள் தந்தையிடமிருந்து.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהֲרֶיןָ
  choice: கருவுற்றார்கள்
  rationale: הרה என்ற வினை இங்கு இரு பெண்களும் கர்ப்பமடைந்ததைக் குறிக்கிறது. ‘கருவுற்றார்கள்’ என்பது தெளிவான, இயல்பான, கண்ணியமான நவீனத் தமிழ்.
- source_word: שְׁתֵּי
  choice: இருவரும்
  rationale: லோத்தின் இரண்டு மகள்களுமே இதில் அடங்குவர் என்பதைத் தமிழில் இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: בְנוֹת לוֹט
  choice: லோத்தின் மகள்கள்
  rationale: எபிரேய இணைப்புத் தொடரின் உடைமை உறவை இயல்பான தமிழ் வடிவில் வெளிப்படுத்துகிறது.
- source_word: מֵאֲבִיהֶן
  choice: தங்கள் தந்தையால்
  rationale: מִן இங்கு மூலத்தையும் தந்தைவழி காரணத்தையும் குறிக்கிறது. ‘தங்கள் தந்தையால்’ என்பது அந்தப் பொருளைத் தமிழில் நேரடியாகத் தெரிவிக்கிறது; ‘தங்கள்’ இரு மகள்களையும் திரும்பச் சுட்டுகிறது.
theological_decisions: []
