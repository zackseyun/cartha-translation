base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/009.yaml
  text: And they said[a], “Get back!” Then they said, “This one came to live as a foreigner, and now he keeps acting as judge! Now we will treat you worse than them.” And they pressed very hard against the man, against Lot[d][c][b], and came near to break down the door.
translation:
  language: ta
  text: அவர்கள், “பின்னால் போ!”[a] என்றார்கள். பின்பு அவர்கள், “இந்த ஒருவன் அந்நியனாகக் குடியிருக்க வந்தான்; இப்போதோ நீதிபதியாகவே நடந்துகொள்கிறான்![b] அவர்களுக்குச் செய்வதைவிட உனக்கு இன்னும் மோசமாகச் செய்வோம்”[c] என்றார்கள். அவர்கள் லோத்து என்னும் அந்த மனிதன் மீது மிகவும் பலமாக அழுத்தம் கொடுத்து,[d] கதவை உடைக்க நெருங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விலகி நில்!”
    reason: lexical_alternative
  - marker: b
    text: “நீதிபதியாகவே நடந்துகொள்கிறான்” என்பது மூலத்தில் வலியுறுத்தப்பட்ட சொற்றொடர்; “நீதிபதி போல நடக்கிறான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: நேர்ச்சொல்லாக, “அவர்களைவிட உனக்குத் தீங்கு செய்வோம்”; அதாவது, மற்றவர்களுக்குச் செய்வதைவிட லோத்துக்குக் கூடுதலான தீங்கு செய்வதாக அவர்கள் மிரட்டினர்.
    reason: idiom_explanation
  - marker: d
    text: அல்லது, “அந்த மனிதனாகிய லோத்தின் மீது மிகவும் பலமாக நெருக்கினர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּשׁ הָלְאָה
  choice: பின்னால் போ!
  rationale: விலகி அல்லது பின்னால் செல்லுமாறு பகைமையுடன் இடப்படும் கட்டளையின் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הָאֶחָד
  choice: இந்த ஒருவன்
  rationale: எபிரெயச் சொல்லிலுள்ள இகழ்ச்சியான, தள்ளுபடியான தொனியை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: בָּא לָגוּר
  choice: அந்நியனாகக் குடியிருக்க வந்தான்
  rationale: גור குறிக்கும், சொந்த ஊரினனல்லாத குடியிருப்பாளரின் சமூக நிலையையும் தற்காலிகம் என்று அவசியம் தீர்மானிக்காத பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּשְׁפֹּט שָׁפוֹט
  choice: நீதிபதியாகவே நடந்துகொள்கிறான்
  rationale: வினையுடன் வரும் infinitive absolute தரும் வலியுறுத்தலையும், லோத்து தங்களை நியாயந்தீர்க்கத் துணிகிறான் என்ற குற்றச்சாட்டையும் காக்கிறது.
- source_word: נָרַע לְךָ מֵהֶם
  choice: அவர்களுக்குச் செய்வதைவிட உனக்கு இன்னும் மோசமாகச் செய்வோம்
  rationale: தீங்கு செய்வதைக் குறிக்கும் மொழிவழக்கையும் ஒப்பீட்டுத் धमுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּפְצְרוּ בָאִישׁ בְּלוֹט מְאֹד
  choice: லோத்து என்னும் அந்த மனிதனை மிகக் கடுமையாக நெருக்கித் தள்ளி
  rationale: இங்கு פצר உடல் சார்ந்த பலவந்த நெருக்குதலைக் குறிக்கிறது; מְאֹד அதன் தீவிரத்தை வலியுறுத்துகிறது. இருமுறை வரும் முன்னிடைச்சொல்லை தமிழில் இயல்பான apposition ஆக வழங்குகிறது.
- source_word: וַיִּגְּשׁוּ לִשְׁבֹּר הַדָּלֶת
  choice: கதவை உடைக்க நெருங்கினார்கள்
  rationale: கதவை உடைக்கும் நோக்குடன் அவர்கள் முன்னேறியதை மூலத்தின் அமைப்புக்கு நெருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: வַיִּשְׁפֹּט שָׁפוֹט என்பதன் வலியுறுத்தல்
  choice: நீதிபதியாகவே நடந்துகொள்கிறான்
  alternative: எங்களைத் தொடர்ந்து நியாயந்தீர்க்கிறான்
  rationale: மூலம் தொடர்ச்சியான செயலைத் தெளிவாகக் குறிப்பிடாமல் வலியுறுத்துகிறது; ஆகவே தொடர்ச்சியை இறையியல் அல்லது கதைவிளக்கமாகச் சேர்க்காமல் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: அச்சுறுத்தப்பட்ட தீங்கின் தன்மை
  choice: இன்னும் மோசமாகச் செய்வோம்
  alternative: உனக்குப் பாலியல் வன்முறை செய்வோம்
  rationale: சூழல் கடுமையான வன்முறையைச் சுட்டினாலும், இந்த வசனம் தீங்கின் வகையை வெளிப்படையாகக் குறிப்பிடவில்லை; எனவே மூலத்தின் மறைமுகத்தன்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையைப் பேணிய மொழிபெயர்ப்பு. கூட்டத்தின் இகழ்ச்சி மற்றும் வன்முறைத் தொனி காக்கப்பட்டுள்ளது; அரிதான அல்லது பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன. மூலத்தில் உள்ள வலியுறுத்தல்கள் தமிழில் ‘வே’, ‘மிகக் கடுமையாக’ என்பவற்றால் வெளிப்படுத்தப்பட்டுள்ளன.
