base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/038.yaml
  text: The younger also bore a son and called his name Ben-ammi[b][a]; he is the father of the Ammonites to this day.
translation:
  language: ta
  text: இளையவளும் ஒரு மகனைப் பெற்றாள்; அவனுக்கு பென்-அம்மி[a] என்று பெயரிட்டாள். அவனே இன்றுவரை அம்மோனியரின் தந்தை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பென்-அம்மி” என்பதற்கு “என் மக்களின் மகன்” அல்லது “என் உறவினனின் மகன்” என்று பொருள் இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “அம்மோனின் மகன்கள்”; அதாவது, அம்மோனியர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצְּעִירָה
  choice: இளையவளும்
  rationale: குறிப்பிட்ட பெயரடை சூழலில் லோத்தின் இளைய மகளைக் குறிக்கிறது. தமிழில் ‘இளையவள்’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது; וְ மற்றும் גַם ஆகியவற்றின் கூட்டுப் பொருளை ‘-உம்’ வெளிப்படுத்துகிறது.
- source_word: גַם הִוא
  choice: -உம்
  rationale: மூத்தவளைப் போல இளையவளும் செய்தாள் என்ற இணைநிலையைத் தமிழின் சேர்க்கை உருபு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יָלְדָה בֵּן
  choice: ஒரு மகனைப் பெற்றாள்
  rationale: கதைநடையில் ילד + בן என்பதற்கான இயல்பான நவீனத் தமிழ் மொழிபெயர்ப்பு.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: அவனுக்கு … என்று பெயரிட்டாள்
  rationale: எபிரெயப் பெயரிடும் வாய்பாட்டின் பொருளை இயல்பான தமிழில் துல்லியமாகத் தருகிறது.
- source_word: בֶּן עַמִּי
  choice: பென்-அம்மி
  rationale: தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; கதைக்கு முக்கியமான அதன் பொருளிலுள்ள இரு சாத்தியங்களும் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: הוּא אֲבִי
  choice: அவனே … தந்தை
  rationale: வினைச்சொல் இல்லாத எபிரெய அடையாள வாக்கியத்தையும் הוּא தரும் வலியுறுத்தலையும் நேரடியாகப் பாதுகாக்கிறது. இங்கு ‘தந்தை’ என்பது ஒரு மக்களினத்தின் மூதாதையைக் குறிக்கிறது.
- source_word: בְנֵי עַמּוֹן
  choice: அம்மோன் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘அம்மோனின் மகன்கள்’ என்ற மரபுவழிப் படிமத்தை, தமிழில் மக்களினத்தைக் குறிக்கும் இயல்பான வடிவில் பாதுகாக்கிறது.
- source_word: עַד הַיּוֹם
  choice: இன்றுவரை
  rationale: கதைசொல்லியின் காலம்வரை தொடரும் நிலையைத் தெரிவிக்கும் எபிரெயக் காலத் தொடருக்கான வழக்கமான தமிழ் இணை.
