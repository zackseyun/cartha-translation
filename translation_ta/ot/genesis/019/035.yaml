  text: וַ/תַּשְׁקֶ֜יןָ גַּ֣ם בַּ/לַּ֧יְלָה הַ/ה֛וּא אֶת אֲבִי/הֶ֖ן יָ֑יִן וַ/תָּ֤קָם הַ/צְּעִירָה֙ וַ/תִּשְׁכַּ֣ב עִמּ֔/וֹ וְ/לֹֽא יָדַ֥ע בְּ/שִׁכְבָ֖/הּ וּ/בְ/קֻמָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/035.yaml
  text: So they also gave their father wine to drink that night[a], and the younger arose and lay with him, and he did not know when she lay down or when she arose.
translation:
  language: ta
  text: அந்த இரவிலும் அவர்கள் தங்கள் தந்தைக்குத் திராட்சை மதுவைக் குடிக்கக் கொடுத்தார்கள். இளையவள் எழுந்து, அவனோடு படுத்தாள். அவள் எப்போது படுத்தாள், எப்போது எழுந்தாள் என்பது அவனுக்குத் தெரியவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மேலும் சொற்சொல்லான மொழிபெயர்ப்பு: “அவள் படுத்ததையோ அவள் எழுந்ததையோ அவன் அறியவில்லை.”'
    reason: மூல எபிரெயச் சொற்றொடரின் வினைப்பெயர் அமைப்பைக் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: குடிக்கக் கொடுத்தார்கள்
  rationale: שׁקה என்பதன் ஹிஃபில் வடிவம் ‘குடிக்கக் கொடு’ அல்லது ‘குடிக்கச் செய்’ எனும் காரணவினைப் பொருளைத் தருகிறது. ‘போதையாக்கினார்கள்’ என்று மொழிபெயர்ப்பது வினையில் நேரடியாக இல்லாத வலுவான விளக்கத்தைச் சேர்க்கும்.
- source_word: גַּם בַּלַּיְלָה הַהוּא
  choice: அந்த இரவிலும்
  rationale: גַּם முந்தைய இரவில் நடந்ததன் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் ‘அந்த இரவிலும்’ என்பது காலத்தையும் தொடர்ச்சியையும் இயல்பாக இணைக்கிறது.
- source_word: אֲבִיהֶן יָיִן
  choice: தங்கள் தந்தைக்குத் திராட்சை மது
  rationale: יָיִן என்பது திராட்சையிலிருந்து தயாரிக்கப்படும் மதுவைக் குறிக்கிறது. ‘திராட்சை மது’ நவீனத் தமிழில் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַתָּקָם הַצְּעִירָה
  choice: இளையவள் எழுந்து
  rationale: הַצְּעִירָה என்பது பெண்பாலில் ‘இளையவள்’ எனப் பொருள்படும். சூழலில் அவள் இளைய மகள் என்பது தெளிவாக இருப்பதால் இதுவே சுருக்கமான இயல்பான வடிவம்.
- source_word: וַתִּשְׁכַּב עִמּוֹ
  choice: அவனோடு படுத்தாள்
  rationale: இந்த எபிரெயச் சொற்றொடர் பாலுறவைக் குறிக்கும் வழக்குச்சொல். ‘அவனோடு படுத்தாள்’ மூலத்தின் உருவகத்தைத் தக்கவைத்து தமிழிலும் அதன் மறைபொருளை உணர்த்துகிறது.
- source_word: וְלֹא יָדַע
  choice: அவனுக்குத் தெரியவில்லை
  rationale: ידע இங்கு அறிவின்மையை அல்லது உணராதிருத்தலைக் குறிக்கிறது. நவீனத் தமிழில் ‘தெரியவில்லை’ இயல்பாக இருந்து, அந்த அறிவின்மையின் காரணத்தை விளக்கிச் சேர்ப்பதில்லை.
- source_word: בְּשִׁכְבָהּ וּבְקֻמָהּ
  choice: அவள் எப்போது படுத்தாள், எப்போது எழுந்தாள்
  rationale: בְּ முன்னொட்டுடன் வரும் இரு வினைப்பெயர்களும் இங்கு காலப் பொருளில் இணையாக அமைந்துள்ளன. ‘எப்போது … எப்போது …’ என்பது அந்த இணை அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: லோத்தின் அறிவின்மையின் தன்மை
  choice: ‘அவனுக்குத் தெரியவில்லை’ என்று மட்டும் கூறி காரணத்தை விளக்காமல் விடப்பட்டது
  alternative: அவன் மதுபோதையால் முற்றிலும் உணர்விழந்திருந்தான்
  rationale: மூல வசனம் அவன் அறியவில்லை என்று கூறுகிறது; ஆனால் அவனுடைய உடல் அல்லது மனநிலையை விரிவாக வரையறுப்பதில்லை. ஆகவே மூலத்தில் உள்ள பதற்றமும் விளக்கத் திறப்பும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத்தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அவனோடு படுத்தாள்’ என்ற சொற்றொடர் மூலத்தின் பாலுறவைக் குறிக்கும் மறைமுக வழக்கைத் தக்கவைக்கிறது; தேவையற்ற வெளிப்படையான விளக்கம் சேர்க்கப்படவில்லை.
