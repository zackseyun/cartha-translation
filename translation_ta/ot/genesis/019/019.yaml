base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/019.yaml
  text: Look[a], please, your servant has found favor in your eyes, and you have made great your steadfast love that you have shown me by preserving my life. But I cannot escape to the mountain[b], lest the disaster overtake me and I die.
translation:
  language: ta
  text: “இதோ, தயவுசெய்து பாருங்கள்! உங்கள் அடியவனான எனக்கு உங்கள் பார்வையில் தயவு கிடைத்திருக்கிறது. என் உயிரைக் காப்பதன் மூலம் நீங்கள் எனக்குக் காட்டிய உங்கள் மாறாத பேரன்பை[a] மிகப் பெரிதாக்கியிருக்கிறீர்கள். ஆனால் என்னால் மலைக்குத் தப்பிச் செல்ல முடியாது; அந்தப் பேரழிவு[b] என்னை வந்தடைந்து நான் இறந்துவிடுவேனோ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாறாத பேரன்பு’ என்பதற்கு ‘தயவு’ அல்லது ‘இரக்கம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘தீமை’ அல்லது ‘தீங்கு’; இங்கு லோத்தைத் தாக்கக்கூடிய பேரழிவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: இதோ, தயவுசெய்து பாரும்
  rationale: הִנֵּה கவனத்தை ஈர்க்கிறது; נָא பணிவும் அவசரமும் கலந்த வேண்டுகோளைச் சேர்க்கிறது. இவ்விரண்டின் உரையாடல் செயல்பாட்டையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: מָצָא ... חֵן בְּעֵינֶיךָ
  choice: உமது பார்வையில் தயவு கிடைத்திருக்கிறது
  rationale: ஒருவரின் சாதகமான ஏற்பைப் பெற்றிருப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘பார்வையில்’ என்பது மூலத்தின் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியவன்
  rationale: இங்கு அடிமைநிலை முன்னிலைப்படுத்தப்படாமல், உயர்ந்தவரிடம் பணிவுடன் தன்னைக் குறிப்பிடும் வழக்காக உள்ளது.
- source_word: וַתַּגְדֵּל
  choice: மிகுதியாக்கியிருக்கிறீர்
  rationale: Hiphil வடிவின் ‘பெரிதாக்குதல்/மிகுதியாக்குதல்’ என்ற தீவிரப்படுத்தும் பொருளைப் பாதுகாக்கிறது; தமிழிலும் இயல்பாக உள்ளது.
- source_word: חַסְדְּךָ
  choice: உமது மாறாத பேரன்பு
  rationale: חסד என்பதிலுள்ள உறுதியான, கிருபையுள்ள, நம்பிக்கைக்குரிய அன்பின் பரப்பை ‘மாறாத பேரன்பு’ இயல்பாக எடுத்துரைக்கிறது.
- source_word: עָשִׂיתָ עִמָּדִי
  choice: நீர் எனக்குக் காட்டிய
  rationale: சொல்லுக்குச் சொல் ‘என்னுடன் செய்த’ என்பதற்குப் பதிலாக, அன்புடன் இயல்பாக இணையும் தமிழ்ச் சொற்றொடர்; செயலால் வெளிப்பட்ட இரக்கத்தைக் குறிக்கிறது.
- source_word: לְהַחֲיוֹת אֶת נַפְשִׁי
  choice: என் உயிரைக் காப்பதற்காக
  rationale: உயிரைத் தொடர்ந்து வாழச்செய்வது என்ற நோக்கம் அல்லது விளைவைத் தெரிவிக்கிறது; இங்கு தேவையற்ற கோட்பாட்டுச் சுமையைச் சேர்க்கவில்லை.
- source_word: וְאָנֹכִי לֹא אוּכַל
  choice: ஆனால் என்னால் ... முடியாது
  rationale: וְ இங்கு முந்தைய அருளுக்கும் லோத்தின் இயலாமைக்கும் இடையிலான முரண்பாட்டைத் தருகிறது; אָנֹכִי-யின் வலியுறுத்தல் ‘என்னால்’ என்பதில் வெளிப்படுகிறது.
- source_word: לְהִמָּלֵט הָהָרָה
  choice: மலைக்குத் தப்பிச் செல்ல
  rationale: திசைச்சுட்டும் הָ இறுதியானது மலையை நோக்கிய இயக்கத்தைக் காட்டுகிறது; ஒருமை வடிவமும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: פֶּן תִּדְבָּקַנִי
  choice: என்னை வந்தடைந்து ... இறந்துவிடக்கூடும்
  rationale: פֶּן அஞ்சப்படும் விளைவை அறிமுகப்படுத்துகிறது; דבק-ன் அடிப்படைப் பொருள் ‘ஒட்டிக்கொள்’ என்றாலும், இச்சூழலில் அழிவு ஒருவரைப் பிடித்துக்கொள்வது அல்லது வந்தடைவது என்பதே பொருள்.
- source_word: הָרָעָה
  choice: அந்தப் பேரழிவு
  rationale: சொல்லின் அடிப்படைப் பரப்பு ‘தீமை/தீங்கு’ என்றாலும், இங்கு ஒழுக்கத் தீமையல்ல; லோத்தை வந்தடையக்கூடிய அழிவுப் பேரிடரே சூழல்சார் பொருள்.
theological_decisions:
- issue: தெய்வீக அதிகாரத்தின்கீழ் செயல்படும் தூதர்களிடம் முன்வைக்கப்படும் வேண்டுகோளில் חֶסֶד என்பதன் மொழிபெயர்ப்பு
  choice: மாறாத பேரன்பு
  alternative: தயவு; இரக்கம்; உறுதியான அன்பு
  rationale: லோத்தின் உயிரைக் காப்பதில் வெளிப்பட்ட கிருபையுள்ள, நம்பிக்கைக்குரிய நன்மையை இது எடுத்துரைக்கிறது. உடனடிச் சூழலில் ஒரு தொழில்நுட்ப உடன்படிக்கைச் சூத்திரத்தைத் திணிக்காமல், சொல்லின் இறையியல் ஆழத்தையும் காக்கிறது.
- issue: הָרָעָה என்பது ஒழுக்கத் தீமையா அல்லது நிகழவிருக்கும் அழிவா
  choice: பேரழிவு
  alternative: தீமை; தீங்கு; கேடு
  rationale: சோதோம் மீது வரவிருக்கும் தீர்ப்பினால் லோத்தின் உயிருக்கு ஏற்படும் ஆபத்தையே சூழல் சுட்டுகிறது. ஆகவே ஒழுக்கத் தீமை என்று பொருளை மாற்றாமல் நிகழ்ச்சிசார் அழிவாக மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பணிவான நேரடி வேண்டுகோளின் தொனியுடன் மொழிபெயர்க்கப்பட்டது. தெய்வீகத் தூதரிடம் பேசுவதால் ‘உமது/நீர்’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மரபுத்தொடரின் உருவகம் இயன்றவரை காக்கப்பட்டாலும், சாதாரண வாசகர்களுக்குத் தெளிவாக இருக்க இயல்பான தமிழ்ச் சொற்றொடர்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
