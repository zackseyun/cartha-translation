  source_fidelity: 'The draft conveys the Hebrew sense well: Lot respectfully acknowledges favor, the great hesed shown in preserving his life, and fears that the impending calamity will overtake him before he reaches the mountain. The feared-result clause is better rendered with Tamil''s apprehensive form than with a mere possibility (''க்கூடும்'').'
