  text: וַ/תַּשְׁקֶ֧יןָ אֶת אֲבִי/הֶ֛ן יַ֖יִן בַּ/לַּ֣יְלָה ה֑וּא וַ/תָּבֹ֤א הַ/בְּכִירָה֙ וַ/תִּשְׁכַּ֣ב אֶת אָבִ֔י/הָ וְ/לֹֽא יָדַ֥ע בְּ/שִׁכְבָ֖/הּ וּ/בְ/קׄוּמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/033.yaml
  text: So they gave their father wine to drink that night[a], and the firstborn went in and lay with her father. He did not know when she lay down or when she arose.
translation:
  language: ta
  text: அன்று இரவு அவர்கள் தங்கள் தகப்பனுக்குத் திராட்சரசம் குடிக்கக் கொடுத்தார்கள். மூத்தவள் உள்ளே சென்று தன் தகப்பனுடன் படுத்தாள். அவள் படுத்தபோதும் எழுந்தபோதும் அவர் அறியவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: குடிக்கக் கொடுத்தார்கள்
  rationale: שׁקה என்பதன் ஹிபீல் வடிவம் ‘குடிக்கச் செய்தல்’ அல்லது ‘குடிக்கக் கொடுத்தல்’ என்று பொருள்படும். இங்கு ‘குடிக்கக் கொடுத்தார்கள்’ என்பது காரணவினைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יַיִן
  choice: திராட்சரசம்
  rationale: יין என்பதற்கான வழக்கமான, தெளிவான தமிழ் வேதாகமச் சொல்; இச்சூழலில் மதுபானத்தைக் குறிக்கிறது.
- source_word: בַּלַּיְלָה הוּא
  choice: அன்று இரவு
  rationale: குறிப்பிட்ட அந்த இரவைக் குறிக்கும் எபிரெய காலச் சொற்றொடரை இயல்பான தமிழில் வழங்குகிறது.
- source_word: הַבְּכִירָה
  choice: மூத்தவள்
  rationale: பெண்பால் ‘முதற்பேறானவள்’ என்பதே நேர்ப்பொருள். இரண்டு மகள்களின் பிறப்பு வரிசையை இயல்பாகக் காட்ட ‘மூத்தவள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַתָּבֹא
  choice: உள்ளே சென்று
  rationale: அவள் தகப்பன் இருந்த இடத்திற்குள் சென்றதைச் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַתִּשְׁכַּב אֶת
  choice: உடன் படுத்தாள்
  rationale: இக்கட்டமைப்பு பாலுறவைக் குறிக்கும் எபிரெய மறைமுகச் சொல்லாட்சி. அதே அளவிலான அடக்கமான சொல்லாட்சியைத் தமிழிலும் காக்கிறது.
- source_word: וְלֹא יָדַע
  choice: அவர் அறியவில்லை
  rationale: ידע இங்கு அறிவுணர்வு அல்லது விழிப்புணர்வைக் குறிக்கிறது. ‘அறியவில்லை’ என்பது எபிரெயச் சொல்லுக்கு நெருக்கமாகவும் தமிழில் தெளிவாகவும் உள்ளது.
- source_word: בְּשִׁכְבָהּ וּבְקוּמָהּ
  choice: அவள் படுத்ததையும் எழுந்ததையும்
  rationale: இணையான இரு எபிரெயத் தொழிற்பெயர் அமைப்புகளையும் சுருக்கமான இயல்பான தமிழில் காக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘அவருடன்’ என்பதை இறுதி வாக்கியத்தில் சேர்க்கவில்லை.
