revisions:
- from: அன்று இரவு அவர்கள் தங்கள் தகப்பனுக்குத் திராட்சரசம் குடிக்கக் கொடுத்தார்கள். மூத்தவள் உள்ளே சென்று தன் தகப்பனுடன் படுத்தாள். அவள் படுத்ததையும் எழுந்ததையும் அவர் அறியவில்லை.[a]
  to: அன்று இரவு அவர்கள் தங்கள் தகப்பனுக்குத் திராட்சரசம் குடிக்கக் கொடுத்தார்கள். மூத்தவள் உள்ளே சென்று தன் தகப்பனுடன் படுத்தாள். அவள் படுத்தபோதும் எழுந்தபோதும் அவர் அறியவில்லை.
  rationale: The revision is limited to the final clause, where paired temporal expressions more directly represent the Hebrew בְּ + infinitive construction and retain its deliberate lack of further explicit detail. The redundant footnote is removed because the main text now adequately conveys the relevant nuance.
