translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தகப்பன்’ என்பது ஆதியாகமக் கதைநடைக்கு ஏற்ற மரியாதைமிக்க உறவுச்சொல்லாக வைக்கப்பட்டுள்ளது. பாலுறவைக் குறிக்கும் மூலத்தின் மறைமுகச் சொல்லாட்சி ‘உடன் படுத்தாள்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
