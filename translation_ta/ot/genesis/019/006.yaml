revisions:
- from: லோத்து நுழைவாயிலுக்கு வெளியே அவர்களிடம் சென்று, தனக்குப் பின்னால் கதவை மூடினார்[a].
  to: லோத்து அவர்களிடம் வெளியே வந்து, நுழைவாயிலை நோக்கிச் சென்று, தனக்குப் பின்னால் கதவை மூடினார்[a].
  rationale: The revision replaces the locative ‘நுழைவாயிலுக்கு வெளியே’ with ‘நுழைவாயிலை நோக்கிச் சென்று,’ which represents the Hebrew directional form. It also retains an explicit ‘வெளியே வந்து’ for Lot's exit and preserves the entrance/door distinction in both text and footnote.
