base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/006.yaml
  text: Lot went out to them at the entrance and shut the door behind him[a].
translation:
  language: ta
  text: லோத்து அவர்களிடம் வெளியே வந்து, நுழைவாயிலை நோக்கிச் சென்று, தனக்குப் பின்னால் கதவை மூடினார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நுழைவாயிலுக்கு.” எபிரெய மொழியில் ‘நுழைவாயில்/திறப்பு’ (פֶּתַח) என்பதும் ‘கதவு’ (דֶּלֶת) என்பதும் வெவ்வேறு சொற்களால் குறிக்கப்படுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: வெளியே … சென்று
  rationale: יצא என்பதன் தொடர்கதை வடிவம் நிகழ்வை முன்னெடுத்துச் செல்லும் எளிய இறந்தகாலச் செயலைக் குறிக்கிறது; ‘வெளியே சென்று’ என்பது திசையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲלֵהֶם
  choice: அவர்களிடம்
  rationale: אֶל என்பதும் மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டும் சேர்ந்து, வெளியே இருந்த ஆட்களை நோக்கிய இயக்கத்தைக் குறிக்கின்றன.
- source_word: לוֹט
  choice: லோத்து
  rationale: தமிழ் வேதாகமப் பெயர்வழக்கில் பரவலாக அறியப்படும் பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַפֶּתְחָה
  choice: நுழைவாயிலுக்கு
  rationale: פֶּתַח என்பது கதவுப் பலகையை அல்ல, திறப்பு அல்லது நுழைவிடத்தைக் குறிக்கிறது; திசைகாட்டும் ־ָה பின்னொட்டு அதை நோக்கிய இயக்கத்தைக் காட்டுகிறது. இயல்பான தமிழ் வாக்கிய அமைப்பிற்காகச் சூழலின் வெளிப்புற இடமும் தெளிவாக்கப்பட்டுள்ளது.
- source_word: וְהַדֶּלֶת
  choice: கதவை
  rationale: דֶּלֶת என்பது நுழைவாயிலின் திறப்பிலிருந்து வேறுபட்ட, மூடப்படும் கதவையே குறிக்கிறது; ‘கதவு’ அந்த வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: סָגַר
  choice: மூடினார்
  rationale: סגר என்பதற்கான இயல்பான, நேரடியான தமிழ் வினைச்சொல்; மரியாதை ஒருமை வினைமுற்று கண்ணியமான நவீன உரைநடைக்கு ஏற்றது.
- source_word: אַחֲרָיו
  choice: தனக்குப் பின்னால்
  rationale: இங்கு אַחַר இடம்சார்ந்த பொருளில் உள்ளது; லோத்து வெளியே சென்றபின் கதவு அவருக்குப் பின்னால் இருந்ததை இது தெளிவாகச் சொல்கிறது.
