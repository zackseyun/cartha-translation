translation:
  language: ta
  text: தேராகுவின் வாழ்நாள் இருநூற்று ஐந்து ஆண்டுகள் இருந்தது; தேராகு ஆரானில் இறந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי תֶרַח
  choice: தேராகுவின் வாழ்நாட்கள்
  rationale: எபிரெய மொழியின் ‘தேராகுவின் நாட்கள்’ என்ற மரபுத்தொடர் அவரது முழு வாழ்நாளைக் குறிக்கிறது. ‘வாழ்நாட்கள்’ என்பது அதன் வடிவத்தையும் பொருளையும் இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: חָמֵשׁ שָׁנִים וּמָאתַיִם שָׁנָה
  choice: இருநூற்று ஐந்து ஆண்டுகள்
  rationale: எபிரெய எண்ணமைப்பைத் தமிழின் இயல்பான எண் வரிசையில் வழங்குகிறது.
- source_word: וַיָּמָת
  choice: இறந்தார்
  rationale: மூலத்தின் நேரடியான ‘இறத்தல்’ என்ற பொருளை மென்மைப்படுத்தும் மறைமுகச் சொல்லின்றி வழங்குகிறது; நபரைக் குறிக்கும் மரியாதைப் பன்மை நவீன தரத் தமிழுக்கு இயல்பானது.
- source_word: בְּחָרָן
  choice: ஆரானில்
  rationale: בְּ இடத்தைக் குறிக்கிறது; חָרָן என்ற பெயர் தமிழ் வேதாகம மரபில் அறியப்படும் ‘ஆரான்’ என ஒலிபெயர்க்கப்பட்டு, இடவேற்றுமை உருபுடன் வழங்கப்படுகிறது.
