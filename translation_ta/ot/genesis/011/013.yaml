revisions:
- from: அர்பக்சாத் சேலாவுக்குத் தந்தையான பின்பு 403 ஆண்டுகள் வாழ்ந்து, மகன்களையும் மகள்களையும் பெற்றான்.
  to: அர்பக்சாத் சேலாவைப் பெற்ற பிறகு 403 ஆண்டுகள் வாழ்ந்தான்; மேலும் மகன்களையும் மகள்களையும் பெற்றான்.
  rationale: The revision uses finite coordinated clauses to preserve the Hebrew syntax and sense without suggesting that the additional children were fathered only after the 403 years had elapsed. It also replaces the less direct ‘became father to Shelah’ phrasing with the natural Tamil genealogical expression ‘fathered Shelah.’
