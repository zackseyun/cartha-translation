base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/013.yaml
  text: Arpachshad lived 403 years after he fathered Shelah[a], and he fathered sons and daughters.
translation:
  language: ta
  text: அர்பக்சாத் சேலாவைப் பெற்ற பிறகு 403 ஆண்டுகள் வாழ்ந்தான்; மேலும் மகன்களையும் மகள்களையும் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்து
  rationale: வம்சவரலாற்றுச் சூத்திரத்தில் தொடர்ந்து உயிர்வாழ்ந்த காலத்தைக் குறிக்கிறது; தமிழில் கால அளவோடு இயல்பாக இணைகிறது.
- source_word: אַרְפַּכְשַׁד
  choice: அர்பக்சாத்
  rationale: எபிரெயப் பெயரின் ஒலியை நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: தந்தையான பின்பு
  rationale: பெயரிடப்பட்ட மகனை ஆண் பெற்றெடுத்ததற்குப் பிந்தைய காலத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שֶׁלַח
  choice: சேலா
  rationale: எபிரெயப் பெயருக்கான தெளிவான தமிழ் எழுத்துப்பெயர்ப்பு; אֶת என்னும் நேரடி செயப்படுபொருள் குறி தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 403 ஆண்டுகள்
  rationale: எபிரெயில் ‘மூன்று ஆண்டுகளும் நானூறு ஆண்டுகளும்’ என்ற வரிசையில் உள்ள துல்லியமான மொத்த எண்ணை நவீன தமிழின் இயல்பான எண்ணமைப்பில் தருகிறது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: ஆண் எழுவாயின் வழியாகப் பிள்ளைகள் பிறந்ததைத் தமிழில் இயல்பாகக் குறிக்கிறது; ‘தந்தையானான்’ என்ற தேவையற்ற மறுபடியுரைப்பைத் தவிர்க்கிறது.
- source_word: בָּנִים וּבָנוֹת
  choice: மகன்களையும் மகள்களையும்
  rationale: எபிரெயில் இரு பாலினப் பிள்ளைகளும் தனித்தனியாகக் குறிப்பிடப்பட்டுள்ளதைப் பொதுவான ‘பிள்ளைகள்’ என்று சுருக்காமல் காக்கிறது.
