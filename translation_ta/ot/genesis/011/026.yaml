  yaml_path: translation/ot/genesis/011/026.yaml
  text: Terah lived seventy years and fathered Abram[a], Nahor, and Haran.
translation:
  language: ta
  text: தேராகு எழுபது வயதானபோது, ஆபிராம், நாகோர், ஆரான் ஆகியோருக்குத் தந்தையானான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்பட, “ஆபிராம், நாகோர், ஆரான் ஆகியோரைப் பெற்றான்.” வம்சவரலாற்றில் பயன்படுத்தப்படும் இந்த எபிரெய வினைச்சொல், மகன்கள் இங்கே பட்டியலிடப்பட்டுள்ள அதே வரிசையில் பிறந்தார்கள் என்று கட்டாயமாகப் பொருள்படாது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: வயதானபோது
  rationale: חיה என்பதன் இந்த வம்சவரலாற்றுப் பயன்பாடு, தேராகு குறிப்பிடப்பட்ட வயதை அடைந்ததைத் தெரிவிக்கிறது. தமிழில் ‘எழுபது வயதானபோது’ என்பது காலத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שִׁבְעִים שָׁנָה
  choice: எழுபது வயது
  rationale: எபிரெயத்தில் சொற்பட ‘எழுபது ஆண்டுகள்’ என்றாலும், ஒருவரின் வயதைக் குறிப்பிடும் இயல்பான நவீனத் தமிழ் நடை ‘எழுபது வயது’ என்பதாகும்.
- source_word: וַיּוֹלֶד
  choice: மகன்களாகப் பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் ילד என்பது பெற்றெடுக்கும் செயலை அல்ல, தந்தையான உறவைச் சுட்டுகிறது. ‘மகன்களாகப் பெற்றான்’ என்பது இயல்பான தமிழில் இதைத் தெளிவாகக் கூறுகிறது; ‘தந்தையானான்’ என்ற சொற்படியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶת ... אֶת ... וְאֶת
  choice: ஆபிராம், நாகோர், ஆரான் ஆகியோரை
  rationale: ஒவ்வொரு பெயருக்கும் முன் வரும் எபிரெய நேரடிச் செயப்படுபொருள் குறியீட்டை, தமிழின் இயல்பான பட்டியல் அமைப்பில் ‘ஆகியோரை’ என்று வழங்குவது பொருளை இழக்காது.
- source_word: אַבְרָם
  choice: ஆபிராம்
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயரெழுத்தாக்கம்.
- source_word: נָחוֹר
  choice: நாகோர்
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயரெழுத்தாக்கம்.
- source_word: הָרָן
  choice: ஆரான்
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயரெழுத்தாக்கம்; தொடக்க ה இங்கே தனி சுட்டிடைச்சொல்லாக மொழிபெயர்க்கப்படவில்லை.
theological_decisions:
- issue: வம்சவரலாற்றுப் பட்டியலின் வரிசையும் எழுபது வயதின் காலக் குறிப்பும்
  choice: தேராகு எழுபது வயதை அடைந்ததையும், ஆபிராம், நாகோர், ஆரான் ஆகியோரின் தந்தையானதையும் வசனம் கூறுகிறது; பெயர்ப்பட்டியல் கட்டாயமான பிறப்பு வரிசையைக் குறிக்கிறது என்று மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
  alternative: மூவரும் சரியாக எழுபதாவது வயதில் ஒரே சமயத்தில் பிறந்தார்கள் அல்லது பட்டியலின் வரிசையே பிறப்பு வரிசை என்று வெளிப்படையாகக் கூறுதல்.
  rationale: எபிரெய வசனத்தின் வம்சவரலாற்று வடிவம் பெயர்களையும் வயதையும் இணைக்கிறது; ஆனால் பிற்கால வசனங்களுடன் எழும் காலவரிசைக் கேள்விகளை இது தனியாகத் தீர்ப்பதில்லை. எனவே அந்தத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதாகவும் வேதாகம வம்சவரலாற்றுக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. பழமையான ‘ஜனிப்பித்தான்’ போன்ற சொல்லாட்சி தவிர்க்கப்பட்டது.
