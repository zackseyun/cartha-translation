  yaml_path: translation/ot/genesis/011/016.yaml
  text: Eber lived thirty-four years and fathered Peleg.
translation:
  language: ta
  text: ஏபேர் முப்பத்து நான்கு ஆண்டுகள் வாழ்ந்தபோது, பேலேகைப் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்தபோது
  rationale: வம்சவரலாற்றுச் சூத்திரத்தில் חיה வாழ்ந்த காலத்தைச் சுட்டுகிறது; அடுத்த நிகழ்வு அந்த வயதில் நடந்தது என்பதை இயல்பான தமிழில் ‘வாழ்ந்தபோது’ வெளிப்படுத்துகிறது.
- source_word: עֵבֶר
  choice: ஏபேர்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் தெளிவாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
- source_word: אַרְבַּע וּשְׁלֹשִׁים שָׁנָה
  choice: முப்பத்து நான்கு ஆண்டுகள்
  rationale: எபிரெயில் ‘நான்கும் முப்பதும்’ என்ற வரிசையில் உள்ள துல்லியமான எண்ணை இயல்பான தமிழ் எண் வரிசையில் வழங்குகிறது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: ஆண் எழுவாயுடன் வரும் வம்சவரலாற்றுப் பயன்பாட்டில் ילד குழந்தையைப் பெற்றெடுக்கச் செய்தல் அல்லது தந்தையானதைக் குறிக்கிறது; ‘பெற்றான்’ என்பது தமிழில் வழக்கமான, சுருக்கமான வம்சவரலாற்றுச் சொல்.
- source_word: אֶת
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது எபிரெய நேரடிச் செயப்படுபொருள் குறியீடு; அதன் பணி தமிழ் வாக்கிய அமைப்பில் வெளிப்படுகிறது.
- source_word: פָּלֶג
  choice: பேலேகு
  rationale: எபிரெய தனிப்பெயரை அதன் ஒலிக்கு அண்மையாகத் தமிழில் எழுத்துப்பெயர்க்கிறது; வாக்கியத்தில் இரண்டாம் வேற்றுமை ஏற்று ‘பேலேகைப்’ என வருகிறது.
