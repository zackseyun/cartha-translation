translation_notes:
  register: நவீன நிலையான தமிழில், வம்சவரலாற்றுக்குரிய சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் இயல்பான நடை. மூலத்தின் சொற்பொருளையும் தமிழ் வாசிப்பின் தெளிவையும் இணைக்கும் உகந்த-ஒப்புமை அணுகுமுறை.
