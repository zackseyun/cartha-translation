  yaml_path: translation/ot/genesis/011/010.yaml
  text: These are the generations of Shem. Shem was one hundred years old[a], and he fathered Arpachshad two years after the flood.
translation:
  language: ta
  text: 'சேமின் வம்ச வரலாறு இதுதான்: சேமுக்கு நூறு வயதானபோது, பெருவெள்ளத்துக்கு இரண்டு ஆண்டுகளுக்குப் பிறகு அர்பக்ஷாத்துக்குத் தந்தையானான்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில மொழிபெயர்ப்புகளில் கிரேக்க வடிவத்தைப் பின்பற்றி இப்பெயர் ‘அர்பக்சாத்’ என வழங்கப்படுகிறது; இங்கு எபிரெய வடிவமான ‘அர்பக்ஷாத்’ பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת
  choice: வம்ச வரலாறு இதுதான்
  rationale: ஆதியாகமத்தில் அடுத்து வரும் வம்சத்தாரையும் அவர்களைக் குறித்த செய்தியையும் அறிமுகப்படுத்தும் நிலையான தலைப்புச் சூத்திரம். எபிரெயச் சொற்றொடரின் செயல்பாட்டை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: שֵׁם
  choice: சேம்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: בֶּן מְאַת שָׁנָה
  choice: நூறு வயதானபோது
  rationale: சொல்லுக்குச் சொல் ‘நூறு ஆண்டுகளின் மகன்’ எனும் எபிரெய வயதுக் கூறலை இயல்பான தமிழில் தருகிறது; அடுத்த வினையோடு காலநிலையாக இணைக்கிறது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: இலக்கிய மரபுவழிப் பட்டியலில் ஆண் ஒருவன் பிள்ளைக்குத் தந்தையானதைக் குறிக்கும் ஹிப்இல் வடிவம். ‘பெற்றான்’ என்பது தமிழில் வம்சப் பட்டியல்களுக்கு இயல்பானதும் சுருக்கமானதும் ஆகும்.
- source_word: אַרְפַּכְשָׁד
  choice: அர்பக்சாத்
  rationale: கிரேக்க வடிவத்தை அல்லாமல் எபிரெயப் பெயரின் ஒலியமைப்பை நேரடியாகப் பின்பற்றும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: שְׁנָתַיִם
  choice: இரண்டு ஆண்டுகள்
  rationale: ‘ஆண்டு’ என்பதன் இருமை வடிவத்தைத் தெளிவாக மொழிபெயர்க்கிறது.
- source_word: אַחַר הַמַּבּוּל
  choice: பெருவெள்ளத்துக்கு ... பிறகு
  rationale: நோவாவின் காலத்தில் நிகழ்ந்த குறிப்பிட்ட வெள்ளத்தைக் குறிக்கும் வரையறுக்கப்பட்ட காலச் சொற்றொடர்; ஆதியாகமச் சூழலில் ‘பெருவெள்ளம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
