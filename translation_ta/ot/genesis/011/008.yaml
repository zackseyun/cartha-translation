    text: அல்லது, ‘பூமி முழுவதிலும்’ அல்லது ‘முழுப் பூமியெங்கும்’; எபிரெயத்தில் சொல்லுக்குச் சொல், ‘முழுப் பூமியின் முகத்தின்மேல்.’
    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s faithful, natural rendering while correcting the literal footnote and avoiding an unnecessary demonstrative. The footnote remains anchored to ‘பூமியெங்கும்’ and preserves both the broad-scope alternatives and the Hebrew idiom.
