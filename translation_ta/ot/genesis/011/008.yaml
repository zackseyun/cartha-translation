id: GEN.11.8
reference: Genesis 11:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּ֨פֶץ יְהוָ֥ה אֹתָ֛/ם מִ/שָּׁ֖ם עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַֽ/יַּחְדְּל֖וּ לִ/בְנֹ֥ת הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/008.yaml
  text: So Yahweh scattered them from there over the face of all the earth[a], and they stopped building the city.
translation:
  language: ta
  text: ஆகவே யாவே அவர்களை அங்கிருந்து பூமியெங்கும்[a] சிதறடித்தார்; அவர்கள் நகரத்தைக் கட்டுவதை நிறுத்திவிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பூமி முழுவதிலும்’ அல்லது ‘முழுப் பூமியெங்கும்’; எபிரெயத்தில் சொல்லுக்குச் சொல், ‘முழுப் பூமியின் முகத்தின்மேல்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: சிதறடித்தார்
  rationale: פוץ என்ற வினை இங்கு மக்களைப் பல இடங்களுக்குப் பிரித்தனுப்பும் செயலைக் குறிக்கிறது. ‘சிதறடித்தார்’ என்பது தீர்ப்பின் சூழலை உணர்த்துவதோடு, நவீன தமிழிலும் இயல்பாக உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் தேவனுடைய தனிப்பெயரான יהוה என்பதை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குகிறது.
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட பாபேல் என்னும் இடத்தைக் காட்டும் இயல்பான இடவினையடை.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: பூமியெங்கும்
  rationale: ‘பூமி முழுவதின் முகப்பின்மேல்’ என்ற எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவான, இயல்பான நவீன தமிழில் தருகிறது; மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיַּחְדְּלוּ
  choice: நிறுத்திவிட்டார்கள்
  rationale: חדל என்பது ஒரு செயலை நிறுத்துதல் அல்லது கைவிடுதல் என்று பொருள்படும். இங்கு கட்டுமானச் செயல் முடிவுக்கு வந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לִבְנֹת
  choice: கட்டுவதை
  rationale: ‘நிறுத்திவிட்டார்கள்’ என்பதுடன் இணையும் இயல்பான தமிழ் வினைப்பெயர் வடிவம்.
- source_word: הָעִיר
  choice: அந்த நகரத்தை
  rationale: உடனடி முன்சூழலில் அவர்கள் கட்டிக்கொண்டிருந்த குறிப்பிட்ட நகரத்தையே சுட்டுகிறது; தமிழில் ‘அந்த’ என்பது அந்தச் சூழல் சுட்டுதலைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் தேவனுடைய தனிப்பெயரையே நேரடியாகப் பயன்படுத்துகிறது. ஆகவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பாக வழங்குவது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘பூமியெங்கும்’ என்பது எபிரெய மரபுத்தொடரின் இயல்பான தமிழ் பொருள்; அதன் சொற்சார்ந்த உருவகம் அடிக்குறிப்பில் தரப்பட்டுள்ளது. தொடர்ச்சியான எபிரெய நிகழ்வுரைத் தொடக்கத்தை ‘ஆகவே’ என வழங்கி முந்தைய நிகழ்வின் விளைவைக் காட்டுகிறது.
