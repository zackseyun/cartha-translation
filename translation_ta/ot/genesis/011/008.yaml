revisions:
- from: ஆகவே யாவே அவர்களை அங்கிருந்து பூமியெங்கும்[a] சிதறடித்தார்; அவர்கள் அந்த நகரத்தைக் கட்டுவதை நிறுத்திவிட்டார்கள்.
  to: ஆகவே யாவே அவர்களை அங்கிருந்து பூமியெங்கும்[a] சிதறடித்தார்; அவர்கள் நகரத்தைக் கட்டுவதை நிறுத்திவிட்டார்கள்.
  rationale: The revision retains the draft’s faithful, natural rendering while correcting the literal footnote and avoiding an unnecessary demonstrative. The footnote remains anchored to ‘பூமியெங்கும்’ and preserves both the broad-scope alternatives and the Hebrew idiom.
