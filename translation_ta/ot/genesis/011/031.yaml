  source_fidelity: மூல எபிரெயத்தின் குடும்ப உறவுகள், பயண நோக்கம், ஆரான் வரை வந்தமை, அங்கே குடியேறியமை ஆகியவை பெரும்பாலும் துல்லியமாகத் தரப்பட்டுள்ளன. וַיֵּצְאוּ אִתָּם என்பதிலுள்ள சுட்டுப்பெயர்த் தெளிவின்மையும் உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது. ஆனால் אוּר כַּשְׂדִּים என்பது இடப்பெயரான “கல்தேயரின் ஊர்”; “ஊர் என்ற இடம்” என்பது மூலத்தில் இல்லாத விளக்கத்தைச் சேர்த்து, இடப்பெயரின் நிலையைத் தேவையின்றி மாற்றுகிறது.
