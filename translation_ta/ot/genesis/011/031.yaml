  text: וַ/יִּקַּ֨ח תֶּ֜רַח אֶת אַבְרָ֣ם בְּנ֗/וֹ וְ/אֶת ל֤וֹט בֶּן הָרָן֙ בֶּן בְּנ֔/וֹ וְ/אֵת֙ שָׂרַ֣י כַּלָּת֔/וֹ אֵ֖שֶׁת אַבְרָ֣ם בְּנ֑/וֹ וַ/יֵּצְא֨וּ אִתָּ֜/ם מֵ/א֣וּר כַּשְׂדִּ֗ים לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֥אוּ עַד חָרָ֖ן וַ/יֵּ֥שְׁבוּ שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/031.yaml
  text: Terah took Abram his son[a], Lot the son of Haran, his grandson, and Sarai his daughter-in-law, the wife of Abram his son, and they set out together from Ur of the Chaldeans to go to the land of Canaan[c][b]. But when they came as far as Haran, they settled there.
translation:
  language: ta
  text: தேராகு தன் மகன் ஆபிராமையும், தன் மகனான ஆரானின் மகனும் தன் பேரனுமான லோத்தையும்[a], தன் மருமகளும் தன் மகன் ஆபிராமின் மனைவியுமான சாராயையும் கூட்டிக்கொண்டான். அவர்கள் அவர்களோடு[b] கல்தேயரின் ஊரிலிருந்து கானான் நாட்டுக்குச் செல்வதற்காகப் புறப்பட்டார்கள். அவர்கள் ஆரான் வரை வந்து, அங்கே குடியேறினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “ஆரானின் மகன், அவன் மகனின் மகன்”; அதாவது, லோத்து தேராகுவின் பேரன்.'
    reason: lexical_alternative
  - marker: b
    text: எபிரெய உரை சொல்லுக்குச் சொல் “அவர்கள் அவர்களோடு புறப்பட்டார்கள்” என்கிறது. யார் யாரோடு சென்றார்கள் என்பது அதன் இலக்கண அமைப்பில் முழுமையாகத் தெளிவாக இல்லை. சிலர் பொருளை “அவர்கள் அனைவரும் ஒன்றாகப் புறப்பட்டார்கள்” என வழங்குகின்றனர்.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  choice: கூட்டிக்கொண்டான்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’; குடும்பத்தினரைப் பயணத்திற்கு உடன் அழைத்துச் செல்லும் இச்சூழலில் ‘கூட்டிக்கொண்டான்’ என்பது இயல்பான தமிழாகவும் மூலத்தின் எளிய கதைநடைக்கு ஏற்றதாகவும் உள்ளது.
- source_word: לוֹט בֶּן־הָרָן בֶּן־בְּנוֹ
  choice: தன் மகனான ஆரானின் மகனாகிய தன் பேரன் லோத்து
  rationale: எபிரெய அமைப்பு சொல்லுக்குச் சொல் ‘ஆரானின் மகன், அவன் மகனின் மகன்’ என வருகிறது. உறவைத் தெளிவாக்க ‘பேரன்’ பயன்படுத்தப்பட்டாலும், ஆரான் வழியிலான உறவு உரையிலேயே தக்கவைக்கப்பட்டுள்ளது.
- source_word: כַּלָּתוֹ
  choice: தன் மருமகள்
  rationale: இங்கு כַּלָּה என்பது தேராகுவின் மகனுடைய மனைவியை, அதாவது அவரது மருமகளை, குறிக்கிறது.
- source_word: אֵשֶׁת אַבְרָם בְּנוֹ
  choice: தன் மகன் ஆபிராமின் மனைவி
  rationale: சாராயின் குடும்ப உறவை விளக்கும் மூலத்தின் இணைப்புச் சொற்றொடர் தெளிவான நவீன தமிழில் தக்கவைக்கப்பட்டுள்ளது.
- source_word: וַיֵּצְאוּ אִתָּם
  choice: அவர்கள் அவர்களோடு புறப்பட்டார்கள்
  rationale: மசோரா உரையில் வினை பன்மையிலும், உடனிகழ்ச்சிச் சுட்டுப்பெயரும் மூன்றாம் நபர் பன்மையிலும் உள்ளது. தமிழில் சற்றுக் கடினமாகத் தோன்றினாலும், மூலத்தின் உண்மையான சுட்டுப்பெயர் தெளிவின்மையை மாற்றாமல் தக்கவைக்கிறது.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: கல்தேயரின் ஊர் என்ற இடத்திலிருந்து
  rationale: אוּר என்பது இடப்பெயர் என்பதைத் தமிழில் சாதாரண ‘ஊர்’ என்ற பெயர்ச்சொல்லோடு குழப்பாமல் காட்ட ‘என்ற இடம்’ சேர்க்கப்பட்டுள்ளது; כַּשְׂדִּים ‘கல்தேயர்’ என வழங்கப்பட்டுள்ளது.
- source_word: לָלֶכֶת אַרְצָה כְּנַעַן
  choice: கானான் நாட்டுக்குச் செல்வதற்காக
  rationale: நோக்கத்தையும் இலக்கையும் குறிக்கும் infinitive மற்றும் directional ending ஆகியவற்றை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיָּבֹאוּ עַד־חָרָן
  choice: அவர்கள் ஆரான் வரை வந்து
  rationale: עַד என்பதன் ‘வரை’ என்ற எல்லைப் பொருள் நேரடியாகத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: அங்கே குடியேறினார்கள்
  rationale: ישב இக்குடிபெயர்ச்சி சூழலில் தற்காலிகமாகத் தங்குவதைவிட ஓரிடத்தில் வசிக்கத் தொடங்குவதைச் சுட்டுவதால் ‘குடியேறினார்கள்’ பொருத்தமானது.
theological_decisions:
- issue: பயணக் குழுவைக் குறிக்கும் பன்மைச் சுட்டுப்பெயர்களின் தெளிவின்மை
  choice: ‘அவர்கள் அவர்களோடு’ என்ற மூலத்துக்கு நெருக்கமான வடிவை உரையில் தக்கவைத்தல்
  alternative: ‘அவர்கள் அனைவரும் ஒன்றாகப் புறப்பட்டார்கள்’
  rationale: மாற்று வடிவம் பொதுப் பொருளை எளிதாக்கினாலும், மசோரா உரையிலுள்ள பன்மை எழுவாய் மற்றும் ‘அவர்களோடு’ என்ற பன்மைச் சுட்டின் இடையிலான பதற்றத்தைத் தீர்த்துவிடும். எந்தக் குழுக்கள் துல்லியமாகக் குறிக்கப்படுகின்றன என்பதை மொழிபெயர்ப்பு முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. உறவுமுறைகள் வெளிப்படையாகச் சொல்லப்பட்டுள்ளன; மரபுவழி பெயர்களான தேராகு, ஆபிராம், ஆரான், லோத்து, சாராய், கானான், கல்தேயர் ஆகியவை பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் இல்லாத எதிர்மறைத் திருப்பத்தைச் சேர்க்காமல் இறுதி நிகழ்வுகள் நேரடியான தொடராக வழங்கப்பட்டுள்ளன.
