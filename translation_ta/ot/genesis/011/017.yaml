  text: And Eber lived after he fathered Peleg four hundred and thirty years[a], and he fathered sons and daughters.
translation:
  language: ta
  text: ஏபேர் பேலேகுக்குத் தந்தையான பிறகு நானூற்று முப்பது ஆண்டுகள் வாழ்ந்தான்; அவன் மகன்களையும் மகள்களையும் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்து
  rationale: வம்சவரலாற்றுச் சூத்திரத்தில் חיה என்பது வாழ்ந்த காலத்தைக் குறிக்கிறது; தொடரும் வாக்கியத்துடன் இயல்பாக இணைய வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: עֵבֶר
  choice: ஏபேர்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தெளிவாகப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־פֶּלֶג
  choice: பேலேகைப் பெற்ற பிறகு
  rationale: הוליד இங்கு ஆண் பெற்றோராகப் பிள்ளையைப் பெறுதலைக் குறிக்கிறது. ‘பெற்ற பிறகு’ என்பது நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: நானூற்று முப்பது ஆண்டுகள்
  rationale: எபிரெயத்தில் ‘முப்பதும் நானூறும்’ என்ற வரிசையில் வரும் மொத்த எண்ணை இயல்பான தமிழ் எண் வரிசையில் வழங்குகிறது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் ילד என்பதன் காரணவினைப் பொருளை, தந்தையாகப் பிள்ளைகளைப் பெற்றான் என்று இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בָּנִים וּבָנוֹת
  choice: மகன்களையும் மகள்களையும்
  rationale: மூலத்தில் ஆண், பெண் பிள்ளைகள் இருவரும் தனித்தனியாகக் குறிப்பிடப்படுவதைக் காக்கிறது.
