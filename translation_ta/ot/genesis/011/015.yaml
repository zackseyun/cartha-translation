  text: וַֽ/יְחִי שֶׁ֗לַח אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת עֵ֔בֶר שָׁלֹ֣שׁ שָׁנִ֔ים וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/015.yaml
  text: And Shelah lived 403 years after he fathered Eber[a], and he fathered sons and daughters.
translation:
  language: ta
  text: ஏபேருக்குத் தந்தையான பின், சேலா 403 ஆண்டுகள் வாழ்ந்தான்; அவன் மகன்களையும் மகள்களையும் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்தான்
  rationale: வம்சவரலாற்றுச் சூத்திரத்தில் חיה என்பது ஒருவரின் வாழ்நாள் காலத்தைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் ‘வாழ்ந்தான்’ தெளிவாக உள்ளது.
- source_word: שֶׁלַח
  choice: சேலா
  rationale: எபிரேயப் பெயரான שֶׁלַח என்பதன் ஒலியைத் தமிழில் இயல்பாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת עֵבֶר
  choice: ஏபேருக்குத் தந்தையான பிறகு
  rationale: הוליד என்பதன் ஆண் வம்சவரலாற்றுப் பொருளைத் துல்லியமாகக் காட்டுகிறது; ‘பெற்றெடுத்தான்’ என்று உடல்சார்ந்த பொருள் தோன்றுவதைத் தவிர்த்து, நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 403 ஆண்டுகள்
  rationale: எபிரேயத்தில் சொற்களால் ‘மூன்று ஆண்டுகளும் நானூறு ஆண்டுகளும்’ என அமைந்த எண்ணின் பொருள் 403; தமிழில் வழக்கமான எண் வரிசையில் தரப்பட்டுள்ளது.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: அவன் மகன்களுக்கும் மகள்களுக்கும் தந்தையானான்
  rationale: ஆண் எழுவாயுடன் வரும் ילד என்பதன் வம்சவரலாற்றுப் பொருளையும், மூலத்தில் தனித்தனியாகக் குறிப்பிடப்பட்ட மகன்கள் மற்றும் மகள்கள் இருவரையும் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரேய வம்சவரலாற்றுச் சொல்லாக்கம் தெளிவாக இருக்க ‘தந்தையானான்’ தேர்ந்தெடுக்கப்பட்டது; தேவையற்ற பழமையான நடையும் விளக்கச் சேர்க்கைகளும் தவிர்க்கப்பட்டுள்ளன.
