  text: וַֽ/יְחִי שֵׁ֗ם אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת אַרְפַּכְשָׁ֔ד חֲמֵ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/011.yaml
  text: And Shem lived five hundred years after he fathered Arpachshad, and he fathered sons and daughters.
translation:
  language: ta
  text: அர்பக்சாத்தைப் பெற்ற பிறகு சேம் ஐந்நூறு ஆண்டுகள் வாழ்ந்தான்; அவன் மகன்களையும் மகள்களையும் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்து
  rationale: வம்சவரலாற்றுச் சூழலில் חיה என்ற வினை, குறிப்பிடப்பட்ட காலம் தொடர்ந்து வாழ்ந்ததைக் குறிக்கிறது; தமிழில் அடுத்த வினையுடன் இயல்பாக இணைய வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: שֵׁם
  choice: சேம்
  rationale: எபிரெயத் தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பின்படி தரப்பட்டது.
- source_word: אַחֲרֵי
  choice: பிறகு
  rationale: அர்பக்சாத்தின் பிறப்புக்குப் பிந்திய காலத்தைத் தெளிவாகக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்லாட்சி.
- source_word: הוֹלִידוֹ
  choice: பெற்ற பிறகு
  rationale: Hiphil வடிவமான ילד இங்கு ஆண் முன்னோரின் வழியாகப் பிள்ளை பிறந்ததைக் குறிக்கிறது. 'பெற்றான்' என்பது தமிழில் தந்தைக்கும் இயல்பாகப் பயன்படுவதுடன், பழமையான 'ஜனிப்பித்தான்' என்பதைக் காட்டிலும் தெளிவானது.
- source_word: אַרְפַּכְשָׁד
  choice: அர்பக்சாத்
  rationale: எபிரெயத் தனிப்பெயருக்கு நெருக்கமான, தமிழில் வாசிக்க இயலும் ஒலிபெயர்ப்பு.
- source_word: חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: ஐந்நூறு ஆண்டுகள்
  rationale: காலநீளத்தைக் குறிக்கும் எண்ணியல் தொடரின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றில் ילד என்பதன் பிறப்பித்தல்/தந்தையானல் பொருளைப் பாதுகாக்கிறது; 'பிள்ளைகள் இருந்தனர்' என்பதைவிட உருவாக்கப் பொருளுக்கு நெருக்கமானது.
- source_word: בָּנִים וּבָנוֹת
  choice: மகன்களையும் மகள்களையும்
  rationale: மூல எபிரெயம் ஆண், பெண் பிள்ளைகள் இருவரையும் தனித்தனியாகக் குறிப்பிடுவதால் பொதுவான 'பிள்ளைகள்' என்று சுருக்கப்படவில்லை.
