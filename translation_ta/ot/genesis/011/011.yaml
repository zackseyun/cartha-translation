  register: நவீன நிலையான தமிழில், வம்சவரலாற்றின் சுருக்கமான நடையைப் பேணும் கண்ணியமான மற்றும் எளிதில் புரியும் மொழிநடை. எபிரெய வாக்கியத்தின் தொடர் வினை அமைப்பு தமிழில் வினையெச்சத்தால் இயல்பாக்கப்பட்டுள்ளது.
