  text: And Arpachshad lived thirty-five years and fathered Shelah[a][b][c].
translation:
  language: ta
  text: அர்பக்சாத் முப்பத்தைந்து ஆண்டுகள் வாழ்ந்து, சேலாவின் தந்தையானான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இப்பெயர் சில மரபுகளில் ‘சாலா’ என்று வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: அர்பக்சாத்
  rationale: வம்சவரலாற்றுத் தொடர்ச்சி தமிழில் வாக்கிய வரிசையால் தெளிவாக இருப்பதால் וְ தனியாக மொழிபெயர்க்கப்படவில்லை; எபிரெயப் பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: חַי
  choice: வாழ்ந்து
  rationale: வம்சவரலாற்றின் வயதைக் குறிக்கும் வழக்கில் חיה என்பது குறிப்பிட்ட காலம் வாழ்ந்ததைக் குறிக்கிறது; தமிழில் அடுத்த நிகழ்வோடு இயல்பாக இணைக்க வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: חָמֵשׁ וּ/שְׁלֹשִׁים שָׁנָה
  choice: முப்பத்தைந்து ஆண்டுகள்
  rationale: எபிரெயில் சொற்சொல்லாக ‘ஐந்தும் முப்பதும் ஆண்டுகள்’ என்ற வரிசை இருந்தாலும், அதே எண்ணை நவீன தமிழின் இயல்பான முறையில் ‘முப்பத்தைந்து ஆண்டுகள்’ என்று கூறுகிறது.
- source_word: וַ/יּוֹלֶד
  choice: பெற்றான்
  rationale: இந்த வம்சவரலாற்றுச் சூழலில் ילד ஆண் முன்னோரை எழுவாயாகக் கொண்டு ‘ஒரு மகனுக்குத் தந்தையானான்/அவனைப் பெற்றான்’ என்று பொருள்படுகிறது. ‘பெற்றான்’ என்பது தமிழில் இயல்பாகவும் சுருக்கமாகவும் அந்த உறவை வெளிப்படுத்துகிறது.
- source_word: אֶת
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது எபிரெயின் நேரடிச் செயப்படுபொருள் குறியீடு; அதன் பணி தமிழில் ‘சேலாவைப்’ என்ற வேற்றுமை உருபால் வெளிப்படுகிறது.
- source_word: שָׁלַח
  choice: சேலா
  rationale: மசோரா எபிரெய் வடிவத்தை அடிப்படையாகக் கொண்டு பெயர் ‘சேலா’ என ஒலிபெயர்க்கப்பட்டது; வேறு மரபில் காணப்படும் ‘சாலா’ அடிக்குறிப்பில் தரப்பட்டது.
