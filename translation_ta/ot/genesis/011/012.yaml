revisions:
- from: அர்பக்சாத் முப்பத்தைந்து ஆண்டுகள் வாழ்ந்து, சேலாவைப்[a] பெற்றான்.
  to: அர்பக்சாத் முப்பத்தைந்து ஆண்டுகள் வாழ்ந்து, சேலாவின் தந்தையானான்.[a]
  rationale: The revision makes the male genealogical sense of וַיּוֹלֶד explicit without adding interpretive content. The Hebrew age expression, sequence, and personal names are otherwise retained in idiomatic modern Tamil.
