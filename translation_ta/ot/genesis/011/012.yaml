translation_notes:
  register: நவீன பொதுத்தமிழில், வம்சவரலாற்றுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பெற்றான்’ என்பது ஆண் எழுவாயுடன் இங்கு ‘தந்தையானான்’ என்ற பொருளில் வருகிறது.
