translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வம்சவரலாற்று நடை. மூலத்தின் ஒரே வேர்ச்சொல் இருமுறை வருவதைத் தமிழில் கட்டாயமாக ஒரே சொல்லால் தருவது இயல்பற்றதாக இருப்பதால், இரு இடங்களிலும் சூழலுக்கேற்ற ‘பெறு’ வடிவமே பயன்படுத்தப்பட்டு கருத்துத் தொடர்ச்சி காக்கப்பட்டுள்ளது.
