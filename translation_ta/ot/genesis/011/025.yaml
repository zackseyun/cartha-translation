source:
  edition: WLC
  text: וַ/יְחִ֣י נָח֗וֹר אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת תֶּ֔רַח תְּשַֽׁע עֶשְׂרֵ֥ה שָׁנָ֖ה וּ/מְאַ֣ת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/025.yaml
  text: Nahor lived one hundred nineteen years after he fathered Terah, and he fathered sons and daughters.
translation:
  language: ta
  text: தேராகுவுக்குத் தந்தையான பின் நாகோர் நூற்றுப் பத்தொன்பது ஆண்டுகள் வாழ்ந்து, மகன்களையும் மகள்களையும் பெற்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்து
  rationale: வம்சவரலாற்றுச் சூத்திரத்தில் இது தொடர்ந்து வாழ்ந்த காலத்தைக் குறிக்கிறது; தமிழில் அடுத்த வினையுடன் இயல்பாக இணைக்க வினையெச்சம் பயன்படுத்தப்பட்டது.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת תֶּרַח
  choice: தேராகைப் பெற்றபின்
  rationale: குறிப்பிடப்பட்ட மகன் பிறந்த பின்புள்ள காலத்தை இந்த அமைப்பு குறிக்கிறது. ‘பெற்றபின்’ என்பது நவீன தமிழில் இயல்பாகவும், தந்தையை எழுவாயாகக் கொண்ட இடத்திலும் ஏற்றதாகவும் உள்ளது.
- source_word: תֶּרַח
  choice: தேராகு
  rationale: எபிரெயப் பெயரின் ஒலிப்பை நவீன நிலையான தமிழ் வேதாகமப் பெயரிடும் மரபுக்கு ஏற்றவாறு எழுத்துப்பெயர்த்தது; வேற்றுமை உருபுடன் ‘தேராகை’ என வருகிறது.
- source_word: תְּשַׁע עֶשְׂרֵה שָׁנָה וּמְאַת שָׁנָה
  choice: நூற்றுப் பத்தொன்பது ஆண்டுகள்
  rationale: எபிரெயத்தில் 19 + 100 என்ற வரிசை இருந்தாலும், இயல்பான தமிழில் பெரிய எண்ணை முதலில் வைத்து 119 என வழங்கப்படுகிறது.
- source_word: וַיּוֹלֶד
  choice: பெற்றார்
  rationale: தந்தையை எழுவாயாகக் கொண்ட வம்சவரலாற்றுச் சூழலில் ‘பெற்றார்’ என்பது பழமையான ‘பெற்றெடுத்தார்/ஜனிப்பித்தார்’ போன்ற சொல்லாட்சிகளைத் தவிர்த்து இயல்பாகப் பொருளைத் தருகிறது.
- source_word: בָּנִים וּבָנוֹת
  choice: மகன்களையும் மகள்களையும்
  rationale: மூலமொழி ஆண், பெண் பிள்ளைகளைத் தனித்தனியாகக் குறிப்பிடுவதால் பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக அந்தத் துல்லியம் காக்கப்பட்டது.
