translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வம்சப் பதிவுக்குரிய கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ஆதியாகமத்தின் தொடர் கட்டமைப்புச் சொல்லைத் தக்கவைக்க ‘வம்ச வரலாறு’ பயன்படுத்தப்பட்டுள்ளது.
