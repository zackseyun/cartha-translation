source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת תֶּ֔רַח תֶּ֚רַח הוֹלִ֣יד אֶת אַבְרָ֔ם אֶת נָח֖וֹר וְ/אֶת הָרָ֑ן וְ/הָרָ֖ן הוֹלִ֥יד אֶת לֽוֹט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/027.yaml
  text: 'These are the generations of Terah: Terah fathered Abram, Nahor, and Haran; and Haran fathered Lot.'
translation:
  language: ta
  text: 'தேராகுவின் வம்ச வரலாறு இதுவே: தேராகு ஆபிராம், நாகோர், ஆரான் ஆகியோரைப் பெற்றான்; ஆரான் லோத்தைப் பெற்றான்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה תּוֹלְדֹת תֶּרַח
  choice: தேராகுவின் வம்ச வரலாறு இதுவே
  rationale: தּוֹלְדֹת என்பது ஆதியாகமத்தில் ஒரு புதிய வம்சப் பகுதியை அறிமுகப்படுத்தும் கட்டமைப்புச் சொல். அதன் பரந்த பொருளையும் தொடர்ச்சியான சூத்திர வடிவத்தையும் இயல்பான தமிழில் வெளிப்படுத்த ‘வம்ச வரலாறு’ என மொழிபெயர்க்கப்பட்டது. தொடக்க וְ தனியாக ‘மேலும்’ என்று வழங்கப்படாமல், பகுதி மாறுதலை இயல்பான தமிழ் வாக்கிய அமைப்பு உணர்த்துகிறது.
- source_word: תֶּרַח
  choice: தேராகு
  rationale: எபிரெய தனிப்பெயர் நவீனத் தமிழில் நிலைபெற்ற வேதாகமப் பெயர் வடிவில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הוֹלִיד
  choice: பெற்றான்
  rationale: வம்சப் பட்டியல் சூழலில் ‘தந்தையானான்/பிறப்பித்தான்’ என்ற பொருளைக் குறிக்கும் வினை. ‘பெற்றான்’ என்பது சுருக்கமான, இயல்பான தமிழ் மரபுவழக்காக இருப்பதுடன், இரண்டு இடங்களிலும் ஒரேவிதமாக வழங்கப்பட்டுள்ளது.
- source_word: אַבְרָם נָחוֹר הָרָן לוֹט
  choice: ஆபிராம், நாகோர், ஆரான், லோத்து
  rationale: தனிப்பெயர்கள் புரிந்துகொள்ளத்தக்க, நிலைபெற்ற தமிழ் ஒலிபெயர்ப்பு வடிவங்களில் வழங்கப்பட்டுள்ளன.
- source_word: אֶת אַבְרָם אֶת נָחוֹר וְאֶת הָרָן
  choice: ஆபிராம், நாகோர், ஆரான் ஆகியோரை
  rationale: எபிரெய நேரடிச் செயப்படுபொருள் குறியீடுகள் தனியே மொழிபெயர்க்கப்படவில்லை; மூவரையும் இணைக்கும் பட்டியல் தமிழில் தெளிவாகவும் இயல்பாகவும் அமைக்கப்பட்டது.
- source_word: וְהָרָן הוֹלִיד אֶת לוֹט
  choice: ஆரான் லோத்தைப் பெற்றான்
  rationale: இணைப்புச் சொல் புதிய தகவலை முந்தைய வம்சக் கூற்றுடன் தொடர்ச்சியாக இணைக்கிறது. அரைப்புள்ளியே அந்தத் தொடர்பை தமிழில் இயல்பாகக் காட்டுவதால் கூடுதல் இணைப்புச் சொல் சேர்க்கப்படவில்லை.
