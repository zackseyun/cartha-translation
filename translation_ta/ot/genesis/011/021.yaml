  text: And Reu lived after he fathered Serug two hundred and seven years[a], and he fathered sons and daughters.
translation:
  language: ta
  text: ரேயு செரூக்கைப் பெற்ற பிறகு இருநூற்று ஏழு ஆண்டுகள் வாழ்ந்து, மகன்களையும் மகள்களையும் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்து
  rationale: வம்சவரலாற்றுச் சூத்திரத்தில் חיה என்பதன் இயல்பான பொருள் ‘வாழ்ந்தான்’; தொடரும் ஒரே வாக்கிய அமைப்புக்காகத் தமிழில் வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: רְעוּ
  choice: ரெகூ
  rationale: எபிரெய ஒலிப்பை நவீனத் தமிழில் தெளிவாகக் குறிக்கும் பெயரெழுத்தாக்கம்.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: பெற்ற பிறகு
  rationale: ஆண் வம்சத்தாரைக் குறிக்கும் Hiphil வடிவத்தின் பொருளை இயல்பான தமிழில் தருகிறது; ‘பிறப்பித்த பிறகு’ என்பதைவிட இது பொதுவானதும் மரியாதையானதும் ஆகும்.
- source_word: אֶת שְׂרוּג
  choice: செரூகை
  rationale: אֶת தனியாக மொழிபெயர்க்கப்படவில்லை; தமிழில் நேரடி செயப்படுபொருளைக் காட்ட பெயருடன் ‘ஐ’ உருபு சேர்க்கப்பட்டது.
- source_word: שֶׁבַע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: இருநூற்று ஏழு ஆண்டுகள்
  rationale: எபிரெயத்தில் ‘ஏழு ஆண்டுகளும் இருநூறு ஆண்டுகளும்’ என்ற வரிசை இருந்தாலும், தமிழின் இயல்பான எண் வரிசையில் மொத்தம் தரப்பட்டது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் ஆண் ஒருவன் பிள்ளைகளுக்குத் தந்தையானதைக் குறிக்கிறது; நவீனத் தமிழில் ‘பெற்றான்’ இயல்பான மரபுவழிப் பயன்பாடு.
- source_word: בָּנִים וּבָנוֹת
  choice: மகன்களையும் மகள்களையும்
  rationale: மூலத்தில் இருபாலரும் தனித்தனியாகச் சொல்லப்பட்டுள்ளதால் பொதுவான ‘பிள்ளைகள்’ என்று சுருக்காமல் வெளிப்படையாக மொழிபெயர்க்கப்பட்டது.
