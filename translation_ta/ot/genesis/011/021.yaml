  rationale: பெயரெழுத்தாக்கங்களில் மட்டும் பாதுகாப்பான திருத்தம் செய்யப்பட்டுள்ளது. வாக்கியத்தின் பொருள், எண், ஆண் தந்தைத்தன்மை, மற்றும் மகன்கள்/மகள்கள் என்ற வெளிப்படையான குறிப்பு அனைத்தும் மாற்றமின்றித் தக்கவைக்கப்பட்டுள்ளன. ஆங்கிலத் தடக்குறிப்பு வெறும் ஆங்கில நிறுத்தற்குறி மாற்றைச் சுட்டுவதால் தமிழில் அடிக்குறிப்பு தேவையில்லை.
