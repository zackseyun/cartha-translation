    rationale: எபிரெய பெயரில் க/க் ஒலிக்கு உரிய எழுத்து இல்லை; «ரெகூ» மூலப் பெயரை மாற்றுகிறது. «ரேயு» என்பது மூல ஒலிக்கும் தமிழ் வேதாகமப் பெயர்மரபுக்கும் ஏற்றது.
