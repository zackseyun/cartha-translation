    rationale: மூலப் பெயரில் ‘க’ மெய்யொலி இல்லை. ‘ரேயு’ என்ற வடிவம் பெயரின் எபிரெய ஒலியமைப்பையும் வழக்கமான தமிழ் வேதாகமப் பெயர்வழக்கையும் சிறப்பாகப் பிரதிபலிக்கிறது.
