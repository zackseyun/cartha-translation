translation:
  language: ta
  text: பேலேகு முப்பது வயதானபோது ரேயுவைப் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்து
  rationale: வம்சவரலாற்றுச் சூத்திரத்தில் חיה என்பது அடுத்த நிகழ்வு வரையிலான வாழ்நாள் காலத்தைக் குறிக்கிறது. தொடர்வினை அமைப்பில் ‘வாழ்ந்து’ என்பது இயல்பான தமிழாகவும் எபிரெய வரிசையைத் தக்கவைப்பதாகவும் உள்ளது.
- source_word: פֶלֶג
  choice: பேலேகு
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பை நவீனத் தமிழில் தெளிவாகக் காட்டும் வழக்கமான எழுத்துப்பெயர்ப்பு.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: முப்பது ஆண்டுகள்
  rationale: எபிரெயில் இது சொற்படியாக ‘முப்பது ஆண்டு’ என்று இருந்து வயதைக் கால அளவாகக் குறிக்கிறது; ‘முப்பது ஆண்டுகள்’ என்பது தேவையற்ற சொல்லைச் சேர்க்காமல் அந்த வடிவத்தை இயல்பான தமிழில் தருகிறது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: ஆண் வம்சவரலாற்றுச் சூழலில் ילד என்பது ஒருவன் மகனுக்குத் தந்தையானதைக் குறிக்கிறது. ‘பெற்றான்’ என்பது தமிழில் நிலைபெற்ற, இயல்பான வம்சவரலாற்றுச் சொல்லாக்கம்.
- source_word: אֶת
  choice: '[நேரடிச் செயப்படுபொருள் குறியீடு; தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இந்த எபிரெயத் துகள் வரையறுக்கப்பட்ட நேரடிச் செயப்படுபொருளைக் குறிக்கிறது; தமிழில் அதற்கான பணி ‘ரெகூவை’ என்ற வேற்றுமை உருபால் வெளிப்படுகிறது.
- source_word: רְעוּ
  choice: ரெகூ
  rationale: எபிரெய தனிப்பெயரின் மெய் மற்றும் உயிரொலிகளைத் தமிழில் நெருக்கமாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
