translation:
  language: ta
  text: ரேயூ முப்பத்திரண்டு ஆண்டுகள் வாழ்ந்து, செரூகுக்குத் தந்தையானான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்து
  rationale: வம்சவரலாற்றுச் சூத்திரத்தில் חיה ஒருவன் குறிப்பிட்ட வயதுவரை வாழ்ந்ததைக் குறிக்கிறது; தொடரும் வினையுடன் இயல்பாக இணைக்க வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: רְעוּ
  choice: ரெகூ
  rationale: எபிரேயப் பெயரின் மெய்யொலிகளையும் நடுவிலுள்ள தொண்டையொலியையும் நவீனத் தமிழில் வாசிக்கத்தக்க வகையில் நெருக்கமாகக் குறிக்கிறது.
- source_word: שְׁתַּיִם וּשְׁלֹשִׁים שָׁנָה
  choice: முப்பத்திரண்டு ஆண்டுகள்
  rationale: எபிரேயத்தில் ‘இரண்டும் முப்பதும்’ என்ற வரிசையில் உள்ள துல்லியமான எண்ணை இயல்பான நவீனத் தமிழ் வரிசையில் தருகிறது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் ילד ஆண் கர்த்தாவாக வரும்போது ‘பிள்ளையைப் பெற்றான்/தந்தையானான்’ என்ற பொருள் தருகிறது; ‘பெற்றான்’ சுருக்கமாகவும் தமிழில் வழக்காகவும் உள்ளது.
- source_word: אֶת
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது எபிரேயத்தின் நேரடி செயப்படுபொருள் குறியீடு; தமிழில் தனிச் சொல்லாகத் தேவைப்படாது.
- source_word: שְׂרוּג
  choice: செரூகு
  rationale: எபிரேயப் பெயரின் ஒலிவடிவத்தை நவீனத் தமிழில் தெளிவாகப் பிரதிபலிக்கிறது; வேற்றுமை உருபு சேரும்போது ‘செரூகை’ என அமைகிறது.
