lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்து
  rationale: வம்சவரலாற்றுச் சூத்திரத்தில் חיה ஒருவரின் வாழ்நாள் காலத்தைச் சுட்டுகிறது; தொடரும் வாக்கிய அமைப்புக்கு இயல்பாக வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת רְעוּ
  choice: ரெகூவைப் பெற்ற பிறகு
  rationale: אַחֲרֵי என்பதன் காலப்பொருளையும், Hiphil வடிவிலுள்ள ילד என்பதன் தந்தையாகப் பெறுதல் என்ற பொருளையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: רְעוּ
  choice: ரெகூ
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் அண்மையாக எழுத்துப்பெயர்க்கிறது.
- source_word: תֵּשַׁע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: இருநூற்று ஒன்பது ஆண்டுகள்
  rationale: எபிரெய மூலத்தில் ஒன்பதும் இருநூறும் என்ற வரிசை இருந்தாலும், தமிழின் இயல்பான எண் வரிசையில் மொத்தம் 209 ஆண்டுகள் என வழங்கப்பட்டுள்ளது.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: மகன்களையும் மகள்களையும் பெற்றான்
  rationale: மூலம் ஆண், பெண் பிள்ளைகளைத் தனித்தனியாகக் குறிப்பிடுவதைக் காக்கிறது; ילד என்பதற்கு இச்சூழலில் இயல்பான ‘பெற்றான்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions: []
