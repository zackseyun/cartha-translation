  register: நவீன நிலையான தமிழில், வம்சவரலாற்றுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. ‘பெற்றான்’ என்பது தந்தையாகப் பெற்றான் என்ற பொருளில் பயன்படுத்தப்பட்டுள்ளது; பழமையான ‘ஜனிப்பித்தான்’ தவிர்க்கப்பட்டுள்ளது.
