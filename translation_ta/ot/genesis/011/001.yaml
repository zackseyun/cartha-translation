source:
  edition: WLC
  text: וַֽ/יְהִ֥י כָל הָ/אָ֖רֶץ שָׂפָ֣ה אֶחָ֑ת וּ/דְבָרִ֖ים אֲחָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/001.yaml
  text: The whole earth had one language and the same words[a].
translation:
  language: ta
  text: பூமி முழுவதும் ஒரே மொழியையும் ஒரே சொற்களையும்[a] கொண்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரே சொல் தொகுப்பையும்” / “ஒரே விதமான பேச்சையும்.” எபிரெய மொழியில் நேரடியாக, “சொற்கள், ஒரேவிதமானவை” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: கொண்டிருந்தது
  rationale: היה என்னும் வினையின் தொடர்கதை வடிவம் இங்கு பின்னணிச் சூழலை அறிமுகப்படுத்துகிறது. தமிழில் தனியாக ‘அப்போது நிகழ்ந்தது’ என்று மொழிபெயர்ப்பதைவிட, வாக்கியத்தின் இறுதியில் ‘கொண்டிருந்தது’ என இறந்தகால நிலையாகச் சொல்வது இயல்பானது.
- source_word: כָל הָאָרֶץ
  choice: பூமி முழுவதும்
  rationale: אָרֶץ என்பதற்கு ‘பூமி’ அல்லது ‘நாடு’ என்று பொருள் வரலாம். பாபேல் நிகழ்வின் பரந்த மனிதகுலச் சூழலில் ‘பூமி முழுவதும்’ என்பதே பொருத்தமானது.
- source_word: שָׂפָה אֶחָת
  choice: ஒரே மொழி
  rationale: שָׂפָה என்பதன் நேரடிப் பொருள் ‘உதடு’; ஆனால் இங்கு அது மொழி அல்லது பேச்சைக் குறிக்கும் மரபுத்தொடர். אֶחָת குறிக்கும் ஒன்றுபட்ட தன்மையை ‘ஒரே’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וּדְבָרִים אֲחָדִים
  choice: ஒரே சொற்கள்
  rationale: דְּבָרִים என்பதன் அடிப்படைப் பொருளான ‘சொற்கள்’ என்பதையும் אֲחָדִים குறிக்கும் பொதுமை அல்லது ஒரே தன்மையையும் இம்மொழிபெயர்ப்பு காக்கிறது. எபிரெயச் சொற்றொடரின் பொருள் ஓரளவு தெளிவற்றிருப்பதால் மாற்று விளக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ஒரே மொழியையும் ஒரே சொற்களையும்’ என்ற இணை அமைப்பு மூலத்தின் மீளுரைத்தலையும் அதன் பொருள் நுட்பத்தையும் காக்கிறது; அடிக்குறிப்பு உண்மையான சொற்பொருள் ஐயத்தை வெளிப்படுத்துகிறது.
