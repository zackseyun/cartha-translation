  source_fidelity: 'The core sense is accurately conveyed: mutual exhortation, making and thoroughly firing bricks, and the functional substitution of brick for stone and bitumen for mortar. However, “ஒருவரையொருவர் நோக்கி” can suggest physically facing one another rather than the Hebrew idiom “each one to his neighbor/one another.” The final coordinated wording is clearer when each material is paired directly with its corresponding substitute.'
