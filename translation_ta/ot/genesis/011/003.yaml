translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. செங்கல் தயாரிப்பின் சூழலில் ‘எரிப்போம்’ என்பதற்குப் பதிலாக இயல்பான ‘சுடுவோம்’ தேர்ந்தெடுக்கப்பட்டது; பொருட்களின் செயல்பாட்டு மாற்றீட்டை ‘பதிலாக ... பயன்பட்டன’ என்ற அமைப்பு தெளிவாக்குகிறது.
