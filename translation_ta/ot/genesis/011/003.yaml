source:
  edition: WLC
  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל רֵעֵ֗/הוּ הָ֚בָ/ה נִלְבְּנָ֣ה לְבֵנִ֔ים וְ/נִשְׂרְפָ֖ה לִ/שְׂרֵפָ֑ה וַ/תְּהִ֨י לָ/הֶ֤ם הַ/לְּבֵנָה֙ לְ/אָ֔בֶן וְ/הַ֣/חֵמָ֔ר הָיָ֥ה לָ/הֶ֖ם לַ/חֹֽמֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/003.yaml
  text: And each man said to his neighbor[a], “Come, let us make bricks and burn them thoroughly.” And the brick served them for stone[b], and the bitumen served them for mortar.
translation:
  language: ta
  text: அவர்கள் ஒருவருக்கொருவர், “வாருங்கள், நாம் செங்கற்களைச் செய்து, அவற்றை நன்றாகச் சுடுவோம்” என்றார்கள். செங்கல் கல்லுக்குப் பதிலாகவும், நிலக்கீல்[a] சாந்துக்குப் பதிலாகவும் அவர்களுக்குப் பயன்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘நிலக்கீல்’ என்பது கட்டுமானத்தில் பயன்படுத்தப்பட்ட இயற்கைத் தார் அல்லது பிட்டுமன் போன்ற பொருளைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: அவர்கள் ஒருவரையொருவர் நோக்கி
  rationale: எபிரெய மொழியின் பகிர்வுப் பொருளான ‘ஒருவர் மற்றவரிடம்’ என்பதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; தனித்தனியாக ஒவ்வொருவரும் மற்றவர்களிடம் பேசிய உணர்வையும் காக்கிறது.
- source_word: הָבָה
  choice: வாருங்கள்
  rationale: கூட்டுச் செயலுக்கு அழைக்கும் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נִלְבְּנָה לְבֵנִים
  choice: நாம் செங்கற்களைச் செய்வோம்
  rationale: செங்கல் உண்டாக்குவதைக் குறிக்கும் மூலச்சொல் சார்ந்த வினையின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְנִשְׂרְפָה לִשְׂרֵפָה
  choice: அவற்றை நன்றாகச் சுடுவோம்
  rationale: வினையோடு அதே வேர்ச்சொல்லைக் கொண்ட பெயர்ச்சொல் சேர்ந்து தரும் தீவிரத்தை ‘நன்றாக’ என்பதால் வெளிப்படுத்துகிறது; செங்கல் தயாரிப்பில் ‘சுடுதல்’ இயல்பான சொல்.
- source_word: וַתְּהִי לָהֶם הַלְּבֵנָה לְאָבֶן
  choice: அவர்களுக்குக் கல்லுக்குப் பதிலாகச் செங்கல் பயன்பட்டது
  rationale: היה + ל அமைப்பு இங்கு பொருள் மாற்றமல்ல, கட்டுமானப் பயன்பாட்டில் ஒன்றுக்குப் பதிலாக மற்றொன்று இருந்ததைக் குறிக்கிறது.
- source_word: הַחֵמָר
  choice: நிலக்கீல்
  rationale: கட்டுமானத்தில் பயன்படுத்தப்பட்ட இயற்கைத் தார் அல்லது பிட்டுமன் போன்ற பொருளைக் குறிக்கும் துல்லியமான தமிழ்ச் சொல்.
- source_word: לַחֹמֶר
  choice: சாந்து
  rationale: செங்கற்களை இணைக்கும் கட்டுமானக் கலவையின் செயல்பாட்டை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
