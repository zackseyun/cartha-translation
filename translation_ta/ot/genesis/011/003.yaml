revisions:
- from: அவர்கள் ஒருவரையொருவர் நோக்கி, “வாருங்கள், நாம் செங்கற்களைச் செய்து, அவற்றை நன்றாகச் சுடுவோம்” என்றார்கள். அவர்களுக்குக் கல்லுக்குப் பதிலாகச் செங்கல்லும், சாந்துக்குப் பதிலாக நிலக்கீலும்[a] பயன்பட்டன.
  to: அவர்கள் ஒருவருக்கொருவர், “வாருங்கள், நாம் செங்கற்களைச் செய்து, அவற்றை நன்றாகச் சுடுவோம்” என்றார்கள். செங்கல் கல்லுக்குப் பதிலாகவும், நிலக்கீல்[a] சாந்துக்குப் பதிலாகவும் அவர்களுக்குப் பயன்பட்டன.
