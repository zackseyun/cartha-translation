id: GEN.11.7
reference: Genesis 11:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הָ֚בָ/ה נֵֽרְדָ֔ה וְ/נָבְלָ֥ה שָׁ֖ם שְׂפָתָ֑/ם אֲשֶׁר֙ לֹ֣א יִשְׁמְע֔וּ אִ֖ישׁ שְׂפַ֥ת רֵעֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/007.yaml
  text: Come, let us go down there and confuse their language, so that one man will not understand the language of his neighbor.
translation:
  language: ta
  text: “வாருங்கள், நாம் கீழே இறங்கிப் போய், ஒருவர் மற்றவருடைய மொழியைப் புரிந்துகொள்ளாதபடி, அங்கே அவர்களுடைய மொழியைக் குழப்புவோம்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבָה
  choice: வாருங்கள்
  rationale: இது சொற்படியாக ஒருமை வடிவில் இருந்தாலும், இங்கு ஆலோசனை அல்லது அழைப்பு விடுக்கும் மரபுத்தொடராகப் பயன்படுகிறது; தொடர்ந்து வரும் முதலாம் நபர் பன்மையுடன் இயல்பாகப் பொருந்தும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: נֵרְדָה
  choice: நாம் கீழே இறங்கிப் போய்
  rationale: முதலாம் நபர் பன்மை விருப்ப/தூண்டல் வடிவமான ‘நாம் இறங்குவோம்’ என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וְנָבְלָה
  choice: குழப்புவோம்
  rationale: மொழியை ஒருவருக்கொருவர் புரியாதபடி ஆக்குதல் என்ற சூழல்சார் பொருளை நேரடியாகத் தருகிறது.
- source_word: שְׂפָתָם / שְׂפַת
  choice: அவர்களுடைய மொழி / மொழியை
  rationale: எபிரெயச் சொல்லின் அடிப்படைப் பொருள் ‘உதடு’; இச்சூழலில் அது பேச்சு அல்லது மொழியைக் குறிக்கும் வழக்கான ஆகுபெயர் என்பதால் ‘மொழி’ என வழங்கப்பட்டது.
- source_word: לֹא יִשְׁמְעוּ
  choice: புரிந்துகொள்ளாதபடி
  rationale: ‘கேட்காதபடி’ என்பது சொற்பொருள்; ஆனால் மற்றவரின் பேச்சை உணர முடியாமையே இங்கு நோக்கம் என்பதால் சூழலுக்கேற்ற ‘புரிந்துகொள்ளாதபடி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אִישׁ ... רֵעֵהוּ
  choice: ஒருவர் மற்றவருடைய
  rationale: சொற்படியாக ‘ஒரு மனிதன் தன் தோழனுடைய’ என இருந்தாலும், இங்கு பொதுவாக ஒவ்வொருவரும் பிறருடைய பேச்சைப் புரிந்துகொள்ளாத நிலை குறிக்கப்படுகிறது; பாலினப் பிரத்தியேகமில்லாத இயல்பான தமிழில் வழங்கப்பட்டது.
theological_decisions:
- issue: ‘நாம்’ என்ற தெய்வீகப் பன்மை
  choice: மூலத்தில் உள்ள முதலாம் நபர் பன்மையை ‘நாம்’ என்று அப்படியே வைத்தல்
  alternative: அதை ஒருமையாக மாற்றுதல் அல்லது அதன் குறிப்பு யாரென்று உரையிலேயே விளக்குதல்
  rationale: பன்மையின் குறிப்பு குறித்து மூலவசனம் விளக்கம் தரவில்லை; ஆகவே அதன் உண்மையான தெளிவின்மையைத் தீர்மானித்து விடாமல் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் விதத்திலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. எபிரெயச் சொற்றொடரின் வரிசையை இயந்திரமாகப் பின்பற்றாமல், நோக்கவாக்கியம் முதன்மை வாக்கியத்துடன் தெளிவாக இணைக்கப்பட்டது.
