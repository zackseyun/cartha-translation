  source_fidelity: 'எபிரெய வம்சவரலாற்றுச் சூத்திரத்தைத் துல்லியமாகக் காட்டுகிறது: நாகோர் இருபத்தொன்பது ஆண்டுகள் வாழ்ந்த பின்பு தேராகுவின் தந்தையானான் என்ற தொடர்ச்சியான நிகழ்வைச் சுருக்கமாகத் தருகிறது. ‘வாழ்ந்து’ மற்றும் ‘பெற்றான்’ ஆகியவை וַיְחִי, וַיּוֹלֶד என்பவற்றுக்கு பொருத்தமானவை.'
  naturalness: ‘நாகோர் இருபத்தொன்பது ஆண்டுகள் வாழ்ந்து, தேராகைப் பெற்றான்’ என்பது நவீனத் தரத் தமிழில் இயல்பானதும், வம்சவரலாற்று நடைக்கு ஏற்ற சுருக்கமானதுமாக உள்ளது. ‘தேராகைப்’ என்பது தேராகு என்ற பெயருக்கு உரிய செயப்படுபொருள் வடிவம்.
