translation:
  language: ta
  text: நாகோர் இருபத்தொன்பது ஆண்டுகள் வாழ்ந்து, தேராகைப் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்து
  rationale: வம்சவரலாற்றுச் சூத்திரத்தில் חיה என்பது அடுத்த நிகழ்வு வரையிலான வாழ்நாளைக் குறிக்கிறது; தொடர்வாக்கியத்துக்கு இயல்பாக அமைய வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: נָחוֹר
  choice: நாகோர்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
- source_word: תֵּשַׁע וְעֶשְׂרִים שָׁנָה
  choice: இருபத்தொன்பது ஆண்டுகள்
  rationale: எபிரெயத்தில் சொல்லப்பட்ட எண்ணை நவீன தமிழின் இயல்பான எண் வரிசையிலும் பன்மை வழக்கிலும் தருகிறது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றில் Hiphil ילד தந்தையாகப் பிள்ளையைப் பெறுதலைக் குறிக்கிறது; தமிழில் 'பெற்றான்' என்பது சுருக்கமான, இயல்பான மரபுவழக்கு.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: நேரடிச் செயப்படுபொருள் குறியீட்டுக்கு தமிழில் தனியான சொல் தேவையில்லை; வாக்கிய அமைப்பிலேயே அதன் பணி வெளிப்படுகிறது.
- source_word: תָּרַח
  choice: தேராகு
  rationale: எபிரெயத் தனிப்பெயரைத் தமிழில் எழுத்துப்பெயர்த்து, வேற்றுமை உருபு சேரும் முன் 'தேராக்-' என அமையும் வடிவம் பயன்படுத்தப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சவரலாற்றின் சுருக்கத்தையும் கண்ணியமான நடையையும் பேணும் மொழிபெயர்ப்பு. பழமையான 'ஜனிப்பித்தான்' போன்ற சொல்லுக்கு மாற்றாக பொதுவாகப் புரியும் 'பெற்றான்' தேர்ந்தெடுக்கப்பட்டது.
