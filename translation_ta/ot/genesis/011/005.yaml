revisions:
- from: அப்போது யாவே, மனிதரின் மகன்கள் கட்டியிருந்த நகரத்தையும் கோபுரத்தையும் பார்க்க இறங்கி வந்தார்.[a]
  to: அப்போது, யாவே மனிதர்கள் கட்டிய நகரத்தையும் கோபுரத்தையும் பார்க்க இறங்கி வந்தார்.[a]
  rationale: The revision preserves the Hebrew narrative sequence and anthropomorphic ‘came down’ while replacing an unnatural literalism with the collective sense intended by בְּנֵי הָאָדָם. The footnote transparently records the literal Hebrew form. The verb in the relative clause is made temporally neutral, matching the source without over-specifying aspect.
