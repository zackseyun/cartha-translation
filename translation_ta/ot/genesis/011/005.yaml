base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/005.yaml
  text: Then Yahweh came down to see the city and the tower that the sons of man had built[a].
translation:
  language: ta
  text: அப்போது, யாவே மனிதர்கள் கட்டிய நகரத்தையும் கோபுரத்தையும் பார்க்க இறங்கி வந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “மனிதனின் மகன்கள்”; இந்த எபிரெயச் சொற்றொடர் மனிதர்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: இறங்கி வந்தார்
  rationale: ירד என்பதன் நேரடியான இயக்கப் பொருளை இயல்பான தமிழில் தருகிறது; இறைவனை மனித இயல்பில் வர்ணிக்கும் மூல உரையின் காட்சியையும் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பதவிப்பெயரால் மாற்றாமல், எபிரெய இறைப்பெயரான יהוה-ஐ தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לִרְאֹת
  choice: பார்க்க
  rationale: ראה என்பதன் எளிய பொருளைப் பாதுகாக்கிறது; ‘ஆய்வுசெய்ய’ என நோக்கத்தை மிகையாக விளக்கவில்லை.
- source_word: הָעִיר
  choice: நகரத்தை
  rationale: עִיר என்பதற்கான நேரடியான, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: הַמִּגְדָּל
  choice: கோபுரத்தை
  rationale: מִגְדָּל என்பதற்கான இயல்பான தமிழ் இணைச்சொல்; இங்கு பாபேல் கட்டுமானத்தின் கோபுரத்தைக் குறிக்கிறது.
- source_word: בָּנוּ
  choice: கட்டியிருந்த
  rationale: யாவே இறங்கி வந்த நிகழ்வுக்கு முன்பே கட்டுமானம் நடைபெற்றிருந்தது என்பதைத் தமிழில் இயல்பாகக் காட்டுகிறது; மூலத்தின் நிறைவுநிலையை மிகைப்படுத்தாமல் உறவுத்தொடரில் இணைக்கிறது.
- source_word: בְּנֵי הָאָדָם
  choice: மனிதரின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் ஆண்பால் வடிவத்தைத் தக்கவைத்து, அது மனிதர்களைக் கூட்டாகக் குறிக்கும் பரந்த பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: யாவே இறங்கி வருவதாக மனித இயல்பில் வர்ணிக்கப்படுதல்
  choice: ‘இறங்கி வந்தார்’ என்ற நேரடியான இயக்கச் சொல்லைத் தக்கவைத்தல்
  alternative: ‘கீழே பார்த்தார்’ அல்லது ‘தமது கவனத்தைத் திருப்பினார்’
  rationale: மூல எபிரெய உரை இறைவனை மனித இயல்பில் வர்ணிக்கும் கதைநடையைப் பயன்படுத்துகிறது. அதை அரூபமான கருத்தாக மாற்றாமல், உரையின் இலக்கிய மற்றும் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
- issue: בְּנֵי הָאָדָם என்பதன் வடிவமும் கூட்டுப் பொருளும்
  choice: முதன்மை உரையில் ‘மனிதரின் மகன்கள்’
  alternative: ‘மனிதர்கள்’ அல்லது ‘மனுக்குலம்’
  rationale: மூலத்தின் ‘மகன்கள்’ என்ற வடிவத்தையும் யாவே–மனிதகுலம் வேறுபாட்டையும் தக்கவைக்கிறது; இச்சொற்றொடரின் கூட்டான மனிதகுலப் பொருளை அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை. ‘நகரத்தையும் கோபுரத்தையும்’ என்ற இணை அமைப்பு எபிரெய உரையின் இரு நேரடி பொருட்களையும் தெளிவாகப் பிரதிபலிக்கிறது; ‘அப்போது’ தொடர்ச்சியான கதைநடையை வெளிப்படுத்துகிறது.
