source:
  edition: WLC
  text: וַ/יֹּאמְר֞וּ הָ֣בָ/ה נִבְנֶה לָּ֣/נוּ עִ֗יר וּ/מִגְדָּל֙ וְ/רֹאשׁ֣/וֹ בַ/שָּׁמַ֔יִם וְ/נַֽעֲשֶׂה לָּ֖/נוּ שֵׁ֑ם פֶּן נָפ֖וּץ עַל פְּנֵ֥י כָל הָ/אָֽרֶץ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/004.yaml
  text: And they said[a], “Come, let us build for ourselves a city and a tower with its top in the heavens, and let us make a name for ourselves[b], lest we be scattered over the face of the whole earth.”
translation:
  language: ta
  text: அவர்கள், “வாருங்கள், நமக்காக ஒரு நகரத்தையும், உச்சி வானங்களில் இருக்கும் ஒரு கோபுரத்தையும் கட்டுவோம்; நமக்கென்று ஒரு பெயரை ஏற்படுத்திக்கொள்வோம்; இல்லையெனில் முழுப் பூமியின் பரப்பிலும் சிதறிப்போவோம்” என்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உச்சி வானங்களை எட்டும் ஒரு கோபுரம்” என்றும் மொழிபெயர்க்கலாம். எபிரெய மூலத்தில் நேரடியாக, “அதன் உச்சி வானங்களில்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: வாருங்கள்
  rationale: கூட்டாகச் செயல்பட அழைக்கும் எபிரெய இடைச்சொல்லின் ஊக்குவிக்கும் வலிமையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: נִבְנֶה לָּנוּ
  choice: நமக்காகக் கட்டுவோம்
  rationale: முதலாம் நபர் பன்மை ஊக்கவுரை/தீர்மானத்தையும், לָנוּ என்பதன் பயனாளிப் பொருளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עִיר וּמִגְדָּל
  choice: ஒரு நகரத்தையும் ... ஒரு கோபுரத்தையும்
  rationale: இரு பெயர்ச்சொற்களின் அடிப்படைப் பொருளை கூடுதல் இராணுவ அல்லது கட்டடவியல் விளக்கமின்றி தருகிறது.
- source_word: וְרֹאשׁוֹ בַשָּׁמַיִם
  choice: அதன் உச்சி வானங்களில் இருக்கும்படியான
  rationale: רֹאשׁ என்பதற்கு ‘உச்சி’ என்றும், בַשָּׁמַיִם என்பதற்கு சொல்லில் உள்ள இடநிலையைப் பேணும் வகையில் ‘வானங்களில்’ என்றும் மொழிபெயர்க்கிறது; ‘எட்டும்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: וְנַעֲשֶׂה לָּנוּ שֵׁם
  choice: நமக்கென்று ஒரு பெயரை ஏற்படுத்திக்கொள்வோம்
  rationale: புகழ் அல்லது நிலைத்த அடையாளம் பெறுதல் என்ற எபிரெய மரபுத்தொடரின் பொருளைத் தருவதோடு ‘பெயர்’ என்ற இலக்கியச் சொல்லையும் பேணுகிறது.
- source_word: פֶּן נָפוּץ
  choice: இல்லையெனில் ... சிதறிப்போவோம்
  rationale: פֶּן குறிக்கும் அஞ்சப்படும் எதிர்மறை விளைவையும், נפוץ குறிக்கும் பரவிச் சிதறுதலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; செயப்பாட்டு வடிவத்தை வற்புறுத்தாமல் எபிரெயத்தின் பொருளைத் தருகிறது.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: பூமி முழுவதின் பரப்பிலும்
  rationale: עַל־פְּנֵי என்ற பரப்பளவு மரபுத்தொடரையும், ஆதியாகமத்தின் தொடக்ககாலச் சூழலில் הָאָרֶץ குறிக்கும் உலகளாவிய எல்லையையும் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: בַשָּׁמַיִם என்பதன் உருவகமும் இடநிலையும்
  choice: வானங்களில் இருக்கும்படியான
  alternative: வானங்களை எட்டும்
  rationale: எபிரெயம் நேரடியாக ‘வானங்களில்’ என்று கூறுகிறது; ‘எட்டும்’ என்பது சாத்தியமான விளக்கவுரை என்றாலும் மூலத்தில் வெளிப்படையாக உள்ள வினை அல்ல. ஆகவே நேரடியான உருவகம் முதன்மை உரையில் பேணப்படுகிறது.
- issue: பாபேல் நிகழ்வில் הָאָרֶץ என்பதன் பரப்பு
  choice: பூமி
  alternative: நிலம் / நாடு
  rationale: ஆதியாகமம் 11-ன் ஆதிக்கால மனிதகுலச் சூழலும், மனிதர்கள் உலகெங்கும் பரவுவது குறித்த கருப்பொருளும் ‘பூமி’ என்ற உலகளாவிய வாசிப்பை ஆதரிக்கின்றன.
- issue: שֵׁם என்ற மரபுத்தொடரின் பொருள்
  choice: பெயர்
  alternative: புகழ்
  rationale: ‘புகழ்’ கருத்தைத் தெளிவாக்கினாலும், ‘பெயர்’ என்பது மூலச்சொல்லையும் அதன் இலக்கிய மற்றும் இறையியல் ஒலியையும் பேணுகிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை. ‘வானங்களில்’ மற்றும் ‘பெயர்’ போன்ற மூலத்தின் இலக்கிய உருவகங்கள் பேணப்பட்டுள்ளன; மிகப் பழமையான ‘அன்றேல்’, ‘சிதறடிக்கப்படுவோம்’ போன்ற நடை தவிர்க்கப்பட்டுள்ளது. அடிக்குறிப்புக் குறி [a] பிரதான உரையில் இடம்பெற்றுள்ளது.
