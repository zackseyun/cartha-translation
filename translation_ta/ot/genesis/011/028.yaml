  text: וַ/יָּ֣מָת הָרָ֔ן עַל פְּנֵ֖י תֶּ֣רַח אָבִ֑י/ו בְּ/אֶ֥רֶץ מוֹלַדְתּ֖/וֹ בְּ/א֥וּר כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/028.yaml
  text: And Haran died in the presence of Terah his father[a], in the land of his birth, in Ur of the Chaldeans.
translation:
  language: ta
  text: ஆரான் தன் தந்தையான தேராகின் முன்னிலையில்[a], தான் பிறந்த நாட்டில், கல்தேயரின் ஊர் என்னும் இடத்தில் இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் தந்தை தேராகு உயிரோடிருந்தபோதே.’ எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல், ‘முகத்தின் மேல்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தான்
  rationale: מות என்பதன் wayyiqtol வடிவம் கடந்தகால நிகழ்வை நேரடியாக விவரிக்கிறது; தமிழில் இயல்பான கதைநடை இணை ‘இறந்தான்’.
- source_word: עַל־פְּנֵי
  choice: முன்னிலையில்
  rationale: இந்த எபிரெயச் சொற்றொடர் நேரடியாக ‘முகத்தின்மேல்/முகத்திற்கு முன்’ என்ற படிமத்தைக் கொண்டது. இச்சூழலில் தந்தையின் கண்முன் அல்லது அவர் உயிரோடிருக்கும்போதே இறந்தான் என்ற இரு நுண்பொருள்களுக்கும் இடமளிக்க ‘முன்னிலையில்’ பயன்படுத்தப்பட்டது.
- source_word: תֶּרַח אָבִיו
  choice: தன் தந்தை தேராகின்
  rationale: ஆரானுடைய தந்தை தேராகு என்பதைத் தெளிவாகவும் இயல்பான தமிழ் சொல் வரிசையிலும் தெரிவிக்கிறது.
- source_word: בְּאֶרֶץ מוֹלַדְתּוֹ
  choice: தான் பிறந்த நாடாகிய
  rationale: מוֹלֶדֶת பிறந்த இடம் அல்லது பூர்வீக நாட்டைக் குறிக்கிறது. இங்கு ‘தான் பிறந்த நாடாகிய’ என்பது பிறப்பிடப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּאוּר כַּשְׂדִּים
  choice: கல்தேயரின் ஊரில்
  rationale: אוּר என்பது ‘ஊர்’ என்ற இடப்பெயர்; כַּשְׂדִּים என்பது கல்தேயர் என்னும் இனப்பெயர். தமிழ் வேற்றுமை அமைப்பில் ‘கல்தேயரின் ஊரில்’ என்பது இடப்பெயர்த் தொடரை இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: עַל־פְּנֵי என்பதன் இடவியல் அல்லது காலவியல் நுண்பொருள்
  choice: தந்தை தேராகின் முன்னிலையில்
  alternative: தந்தை தேராகு உயிரோடிருந்தபோதே / தந்தை தேராகுக்கு முன்பாக
  rationale: மூலமொழி தந்தையின் கண்முன் நிகழ்ந்ததா அல்லது தந்தை உயிரோடிருக்கும்போதே நிகழ்ந்ததா என்பதைத் தீர்மானமாகப் பிரித்துரைக்கவில்லை. முதன்மை உரை அதன் concrete idiom-ஐப் பாதுகாக்கிறது; அடிக்குறிப்பு காலவியல் வாசிப்பையும் அளிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘முன்னிலையில்’ என்ற சொல் மூல எபிரெய மொழியின் தெளிவாகத் தீராத இடவியல்–காலவியல் நுண்பொருளைப் பாதுகாக்கிறது; [a] குறிப்பு மாற்றுப் பொருளை விளக்குகிறது.
