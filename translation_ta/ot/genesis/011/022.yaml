translation:
  language: ta
  text: செரூகு முப்பது வயதானபோது நாகோரைப் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வயதானபோது
  rationale: இங்கு חיה என்பதன் தொடர்கதை வடிவம் வம்சவரலாற்றின் வயதுக் குறிப்பை அறிமுகப்படுத்துகிறது. தமிழில் அடுத்த வினையுடன் இணைத்து ‘முப்பது வயதானபோது’ என்பது இயல்பாகவும் துல்லியமாகவும் அமைகிறது.
- source_word: שְׂרוּג
  choice: செரூகு
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: முப்பது வயது
  rationale: சொல்லுக்கு சொல் ‘முப்பது ஆண்டு’ என்றாலும், இது வயதைக் குறிக்கும் எபிரெய மரபுத்தொடர்; நவீன தமிழில் ‘முப்பது வயது’ இயல்பானது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: ילד என்பதன் ஹிஃபில் வடிவம் ஆண் வழி வம்சவரலாற்றில் ஒருவருக்குப் பிள்ளை பிறந்ததைக் குறிக்கிறது. ‘பெற்றான்’ என்பது தமிழில் சுருக்கமான, இயல்பான வம்சவரலாற்றுச் சொல்; சூழலில் தந்தையானான் என்ற பொருள் தெளிவாகிறது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண உருபு; தமிழ்ச் சொற்றொடரமைப்பில் தனிச் சொல்லாகத் தேவையில்லை.
- source_word: נָחוֹר
  choice: நாகோர்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்த வடிவம்.
