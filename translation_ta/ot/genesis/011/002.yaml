translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் திசை சார்ந்த உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் தக்கவைக்கப்பட்டுள்ளது.
