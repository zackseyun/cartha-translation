source:
  edition: WLC
  text: וַֽ/יְהִ֖י בְּ/נָסְעָ֣/ם מִ/קֶּ֑דֶם וַֽ/יִּמְצְא֥וּ בִקְעָ֛ה בְּ/אֶ֥רֶץ שִׁנְעָ֖ר וַ/יֵּ֥שְׁבוּ שָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/002.yaml
  text: And as they journeyed from the east[a], they found a plain in the land of Shinar and settled there.
translation:
  language: ta
  text: அவர்கள் கிழக்கிலிருந்து[a] பயணம் செய்தபோது, சிநெயார் நாட்டில் ஒரு சமவெளியைக் கண்டு, அங்கே குடியேறினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிழக்கு நோக்கிப் பயணம் செய்தபோது.” מִקֶּדֶם என்ற எபிரெயச் சொற்றொடர் புறப்பட்ட இடத்தை (“கிழக்கிலிருந்து”) அல்லது சென்ற திசையை (“கிழக்கு நோக்கி”) குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בְּנָסְעָם
  choice: அவர்கள் பயணம் செய்தபோது
  rationale: וַיְהִי அறிமுகப்படுத்தும் காலச் சூழலைத் தமிழில் இயல்பாகக் காலத் துணைவாக்கியமாக வழங்குகிறது; נסע முகாமைப் பெயர்த்துப் பயணிப்பதைக் குறிக்கிறது.
- source_word: מִקֶּדֶם
  choice: கிழக்கிலிருந்து
  rationale: מן முன்னொட்டு பொதுவாகப் புறப்பட்ட இடத்தைக் குறிப்பதால் இதை முதன்மைப் பொருளாகக் கொண்டோம்; ‘கிழக்கு நோக்கி’ என்ற திசைப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּמְצְאוּ
  choice: கண்டு
  rationale: מצא என்பதன் நேரடியான பொருளை இயல்பான தமிழ் தொடர் வினையாக வழங்குகிறது.
- source_word: בִקְעָה
  choice: ஒரு சமவெளி
  rationale: இச்சொல் அகன்ற பள்ளத்தாக்கு அல்லது சமவெளியைக் குறிக்கலாம்; சினேயார் நிலப்பரப்புக்கும் சூழலுக்கும் ‘சமவெளி’ பொருத்தமானது.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: சினேயார் நாட்டில்
  rationale: אֶרֶץ என்பதன் புவியியல் பொருளை ‘நாடு’ எனத் தக்கவைத்து, שִׁנְעָר என்ற இடப்பெயரை ஒலிபெயர்த்துள்ளது.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: அங்கே குடியேறினார்கள்
  rationale: ישב இச்சூழலில் வெறுமனே வாழ்வதைவிடப் பயணத்தை நிறுத்தி ஓரிடத்தில் குடியேறியதைக் குறிக்கிறது.
