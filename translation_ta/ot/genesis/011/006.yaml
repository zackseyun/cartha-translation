  text: וַ/יֹּ֣אמֶר יְהוָ֗ה הֵ֣ן עַ֤ם אֶחָד֙ וְ/שָׂפָ֤ה אַחַת֙ לְ/כֻלָּ֔/ם וְ/זֶ֖ה הַחִלָּ֣/ם לַ/עֲשׂ֑וֹת וְ/עַתָּה֙ לֹֽא יִבָּצֵ֣ר מֵ/הֶ֔ם כֹּ֛ל אֲשֶׁ֥ר יָזְמ֖וּ לַֽ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/006.yaml
  text: And Yahweh said[a], "Behold, they are one people, and they all have one language, and this is what they have begun to do. And now nothing that they plan to do will be withheld from them."
translation:
  language: ta
  text: 'யாவே கூறினார்: “இதோ, இவர்கள் ஒரே மக்கள்; இவர்கள் அனைவருக்கும் ஒரே மொழி இருக்கிறது. இதைத்தான் இவர்கள் செய்யத் தொடங்கியிருக்கிறார்கள். இப்போது இவர்கள் செய்யத் திட்டமிடும் எதுவும் இவர்களுக்கு இயலாததாக இருக்காது[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவர்கள் செய்யத் திட்டமிடும் எதுவும் இவர்களிடமிருந்து தடுக்கப்படாது.”
    reason: בצר என்ற வினை இச்சூழலில் ‘இயலாததாக இருத்தல்’ அல்லது ‘தடுக்கப்படுதல்’ ஆகிய பொருட்களைத் தரக்கூடிய சொற்பொருள் தெளிவின்மையைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரைப் பொதுப்பட்டப் பெயராக மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லின் சுட்டிக்காட்டும் வலிமையையும், வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையையும் காக்கிறது.
- source_word: עַם אֶחָד
  choice: ஒரே மக்கள்
  rationale: இது அரசியல் பொருளிலான ‘ஒரே நாடு’ என்பதைக் காட்டிலும், ஒன்றுபட்ட ஒரு மக்கள் கூட்டத்தைக் குறிக்கிறது.
- source_word: וְשָׂפָה אַחַת לְכֻלָּם
  choice: இவர்கள் அனைவருக்கும் ஒரே மொழி இருக்கிறது
  rationale: שָׂפָה என்பதன் நேர்ப்பொருள் ‘உதடு’; இச்சூழலில் அது மொழியைக் குறிக்கும் மரபுத்தொடர். לְכֻלָּם என்பதன் அனைவரையும் உள்ளடக்கும் வலியுறுத்தலும் காக்கப்படுகிறது.
- source_word: וְזֶה הַחִלָּם לַעֲשׂוֹת
  choice: இதைத்தான் இவர்கள் செய்யத் தொடங்கியிருக்கிறார்கள்
  rationale: הַחִלָּם என்பது அவர்கள் ஏற்கெனவே ஆரம்பித்த செயலைக் குறிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘இது தொடக்கம் மட்டுமே’ என்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: לֹא יִבָּצֵר מֵהֶם
  choice: எதுவும் இவர்களுக்கு இயலாததாக இருக்காது
  rationale: בצר என்ற வினையின் நிஃபால் வடிவம் இங்கு ‘எட்டாதது/இயலாதது’ என்ற பொருளைத் தரக்கூடும். இயல்பான தமிழில் அதன் சூழல்சார் வலிமையை இது தெரிவிக்கிறது; ‘தடுக்கப்படாது’ என்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: כֹּל אֲשֶׁר יָזְמוּ לַעֲשׂוֹת
  choice: இவர்கள் செய்யத் திட்டமிடும் எதுவும்
  rationale: יָזְמוּ என்பது திட்டமிடுதல் அல்லது எண்ணித் துணிதலைக் குறிக்கிறது. எதிர்மறை வாக்கிய அமைப்புக்கு இயல்பாக ‘எதுவும்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ஒன்றுபட்ட மனிதர்களின் செயல்திறனைப் பற்றிய கூற்றின் எல்லை
  choice: இந்தக் கதைச் சூழலில் அவர்கள் திட்டமிடும் செயல்கள் அவர்களுக்கு இயலாதவையாக இருக்காது என்ற வலுவான கூற்றாக மொழிபெயர்க்கப்பட்டது.
  alternative: அவர்கள் திட்டமிடுவது அவர்களிடமிருந்து தடுக்கப்படாது என்று மொழிபெயர்த்தல்.
  rationale: மூலமொழியின் பதற்றத்தைத் தணித்து, இது மனிதர்களின் முழுமையான சர்வவல்லமையைக் குறிக்கிறது என்றோ தேவன் அவர்களைக் கட்டுப்படுத்த முடியாது என்றோ விளக்கவில்லை; அதேவேளை அவர்களின் ஒருமித்த மொழியும் நோக்கமும் தரும் திறனைப் பற்றிய கூற்றின் வலிமையைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘இதோ’ என்ற சொல் மூலத்தின் உரைநடை வலிமையைப் பாதுகாக்கிறது; மற்ற பகுதிகளில் தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
