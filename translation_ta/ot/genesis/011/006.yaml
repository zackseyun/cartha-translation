  source_fidelity: 'மூல எபிரெயத்தின் முக்கிய கூறுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: יְהוָה ‘யாவே’ எனவும், הֵן ‘இதோ’ எனவும், עַם אֶחָד ‘ஒரே மக்கள்’ எனவும், அனைவருக்கும் ஒரே மொழி என்ற கருத்தும் சரியாகவும் வழங்கப்பட்டுள்ளன. וְזֶה הַחִלָּם לַעֲשׂוֹת என்பதற்கு ‘இதைத்தான் இவர்கள் செய்யத் தொடங்கியிருக்கிறார்கள்’ என்பது ஏற்கெனவே தொடங்கப்பட்ட செயலையே சுட்டுகிறது; மூலத்தில் இல்லாத விரிவாக்கத்தைச் சேர்ப்பதில்லை. לֹא יִבָּצֵר מֵהֶם என்பதற்கான ‘இயலாததாக இருக்காது’ என்பது சூழலுக்கு ஏற்ற முதன்மை வாசிப்பு; மாற்று ‘தடுக்கப்படாது’ அடிக்குறிப்பில் முறையாகப் பாதுகாக்கப்பட்டுள்ளது.'
