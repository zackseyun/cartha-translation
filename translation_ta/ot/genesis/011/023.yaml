base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/023.yaml
  text: And Serug lived two hundred years after he fathered Nahor, and he fathered sons and daughters.
translation:
  language: ta
  text: நாகோரைப் பெற்ற பிறகு செரூகு இருநூறு ஆண்டுகள் வாழ்ந்து, மகன்களையும் மகள்களையும் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்து
  rationale: வம்சவரலாற்றுச் சூத்திரத்தில் חיה என்பது வாழ்ந்த காலத்தைக் குறிக்கிறது; தொடர்ந்துவரும் வாக்கிய அமைப்புடன் இயல்பாக இணைவதற்காக வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: שְׂרוּג
  choice: செரூகு
  rationale: எபிரேயப் பெயரின் ஒலிப்பை நவீனத் தமிழ் எழுத்துமுறையில் அண்மையாகப் பெயர்த்தெழுதுகிறது.
- source_word: אַחֲרֵי
  choice: பிறகு
  rationale: ஒரு நிகழ்வுக்குப் பிந்தைய காலத்தைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: הוֹלִידוֹ
  choice: பெற்ற
  rationale: Hiphil வடிவிலுள்ள ילד வம்சவரலாற்றில் தந்தையாகப் பிள்ளையைப் பெறுதலைக் குறிக்கிறது; தமிழில் ஆண் எழுவாயுடன் ‘பெற்றான்/பெற்ற’ என்பது இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: אֶת
  choice: '[நேரடி செயப்படுபொருள் குறியீடு; தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: נָחוֹר என்பதைக் குறிப்பிட்ட நேரடி செயப்படுபொருளாகக் குறிக்கும் இலக்கணத் துகள்; தமிழில் தனி இணைச்சொல் தேவையில்லை.
- source_word: נָחוֹר
  choice: நாகோர்
  rationale: எபிரேயப் பெயரின் ஒலிப்பை நவீனத் தமிழில் அண்மையாகப் பெயர்த்தெழுதுகிறது.
- source_word: מָאתַיִם שָׁנָה
  choice: இருநூறு ஆண்டுகள்
  rationale: காலநீட்டத்தைக் குறிக்கும் எபிரேய எண்-பெயர்ச்சொல் தொடரை இயல்பான தமிழ்ப் பன்மையில் வழங்குகிறது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் தந்தையாகப் பிள்ளைகளைப் பெற்றதைத் துல்லியமாகவும் நவீனத் தமிழில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בָּנִים וּבָנוֹת
  choice: மகன்களையும் மகள்களையும்
  rationale: எபிரேயம் ஆண், பெண் பிள்ளைகள் இருவரையும் தனித்தனியாகக் குறிப்பிடுவதால், பொதுவான ‘பிள்ளைகள்’ என்பதற்குப் பதிலாக அந்த விவரம் பாதுகாக்கப்படுகிறது.
