  register: நவீன பொதுத்தமிழில் dignified narrative register பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொல்விளையாட்டு முதன்மை உரையில் இயல்பாக மீளுருவாக்க முடியாததால் [a] அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; வசனத்தின் காரணவிளைவு அமைப்பும் ‘பூமியெங்கும்’ என்ற கருத்தின் மீளுரையும் காக்கப்பட்டுள்ளன.
