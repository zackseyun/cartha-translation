base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/009.yaml
  text: Therefore its name was called Babel[a], because there Yahweh confused the language of all the earth, and from there Yahweh scattered them over the face of all the earth.
translation:
  language: ta
  text: ஆகவே, அதற்குப் பாபேல்[a] என்று பெயரிடப்பட்டது; ஏனெனில் அங்கே யாவே பூமியெங்கும் பேசப்பட்ட மொழியைக் குழப்பினார். அங்கிருந்து யாவே அவர்களைப் பூமியெங்கும் சிதறிப்போகச் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பாபேல்” என்ற பெயர், “குழப்பினார்” அல்லது “கலந்தார்” என்று பொருள்படும் எபிரெயச் சொல்லான பாலல் (balal) என்பதுடன் ஒத்த ஒலியைக் கொண்டுள்ளது; இவ்வசனம் அந்தச் சொல் தொடர்பால் பெயரை விளக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: ஆகவே
  rationale: பெயரிடப்பட்டதற்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய காரணவிளைவு இணைப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: קָרָא שְׁמָהּ
  choice: அதற்குப் ... என்று பெயரிடப்பட்டது
  rationale: எபிரெய மொழியின் பெயரிடும் மரபுத்தொடரை, குறிப்பிடப்படாத எழுவாயைச் சேர்க்காமல் இயல்பான தமிழ் செயப்பாட்டு வடிவில் தருகிறது.
- source_word: בָּבֶל
  choice: பாபேல்
  rationale: இடப்பெயரை ஒலிபெயர்ப்பாகத் தருகிறது; בָּלַל உடனான எபிரெயச் சொல்விளையாட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: כִּי שָׁם
  choice: ஏனெனில் அங்கே
  rationale: பெயருக்கான விளக்கக் காரணத்தையும் இடத்தையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בָּלַל
  choice: குழப்பினார்
  rationale: இந்தச் சூழலில் மனிதர்களின் பேச்சு ஒருவருக்கொருவர் புரியாதபடி செய்யப்பட்டதைக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: שְׂפַת כָּל הָאָרֶץ
  choice: பூமியெங்கும் பேசப்பட்ட மொழி
  rationale: சொல்லுக்குச் சொல் 'பூமியனைத்தின் உதடு' என்ற எபிரெய மரபுத்தொடரின் பொருள் 'மொழி'; அதை இயல்பான தமிழில் தருவதோடு, உலகளாவிய பரப்பையும் காக்கிறது.
- source_word: וּמִשָּׁם
  choice: அங்கிருந்து
  rationale: முன்பு குறிப்பிடப்பட்ட இடத்திலிருந்தே சிதறடித்த நிகழ்வு தொடங்கியது என்பதைப் பாதுகாக்கிறது.
- source_word: הֱפִיצָם
  choice: அவர்களைப் ... சிதறிப்போகச் செய்தார்
  rationale: பிறவினை வடிவின் காரணவினைப் பொருளை வெளிப்படையாகக் காத்து, மக்கள் புவியியல் ரீதியாகப் பரவச் செய்யப்பட்டதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַל פְּנֵי כָּל הָאָרֶץ
  choice: பூமியெங்கும்
  rationale: சொல்லுக்குச் சொல் 'பூமி முழுவதின் முகத்தின்மேல்' என்ற உருவகத்தை இயல்பான நவீன தமிழில் அதன் முழுப் பரப்புப் பொருளுடன் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் தனிப்பட்ட தெய்வீகப் பெயரான יהוה என்பதையே பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் தமிழ் ஒலிபெயர்ப்பில் தருவது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
