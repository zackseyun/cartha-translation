lexical_decisions:
- source_word: וְ/שֶׁלַח
  choice: ஷேலாக்
  rationale: שֶׁלַח என்ற எபிரெயப் பெயரின் ஒலிவடிவத்தைத் தமிழில் இயன்றவரை நேரடியாகப் பிரதிபலிக்கும் பெயர்ப்பு; தொடக்க וְ இணைப்பு இயல்பான தமிழ் வாக்கிய அமைப்பில் தனியே வெளிப்படுத்தப்படவில்லை.
- source_word: חַי
  choice: வாழ்ந்து
  rationale: வம்சவரலாற்றுச் சூத்திரத்தில் חיה என்பதன் பொருள் ஒருவர் குறிப்பிட்ட வயதுவரை வாழ்ந்ததைச் சுட்டுகிறது; அடுத்து நிகழ்ந்த தந்தையாதலுடன் இயல்பாக இணைக்க வினையெச்சம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: முப்பது ஆண்டுகள்
  rationale: எபிரெய உரையின் காலஅளவு வடிவத்தைப் பேணும் தெளிவான நவீனத் தமிழ்; இங்கு ஏபேரைப் பெற்றபோதைய வயதைக் குறிக்கிறது.
- source_word: וַ/יּוֹלֶד
  choice: பெற்றான்
  rationale: ילד என்பதன் ஹிஃபில் வடிவம் வம்சவரலாற்றில் ஆண் ஒருவன் ஒருவருக்குத் தந்தையானதைக் குறிக்கிறது. ‘பெற்றான்’ என்பது தமிழில் சுருக்கமான, வழக்கமான வம்சவரலாற்றுச் சொல்.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கணச் சுட்டி; தமிழில் ‘ஐ’ வேற்றுமை உருபால் அதன் பணி வெளிப்படுகிறது.
- source_word: עֵבֶר
  choice: ஏபேர்
  rationale: עֵבֶר என்ற எபிரெயப் பெயரின் உயிரொலிகளையும் மெய்யொலிகளையும் மரபுவழி ‘ஹேபேர்’ என்பதைக் காட்டிலும் நேரடியாகப் பிரதிபலிக்கிறது.
