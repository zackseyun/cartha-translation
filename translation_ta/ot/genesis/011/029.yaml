translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. முதல் வாக்கியத்தில் எபிரெய மொழியின் திருமணச் சொல்லாட்சி வெளிப்படையாகத் தக்கவைக்கப்பட்டு, இயல்பான தமிழ் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது. கடைசிப் பகுதியில் மில்காளின் பெயர் மீண்டும் வருவது மூலத்தின் வம்சவழி அமைப்பைப் பாதுகாக்கிறது.
