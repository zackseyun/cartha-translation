  text: וַ/יִּקַּ֨ח אַבְרָ֧ם וְ/נָח֛וֹר לָ/הֶ֖ם נָשִׁ֑ים שֵׁ֤ם אֵֽשֶׁת אַבְרָם֙ שָׂרָ֔י וְ/שֵׁ֤ם אֵֽשֶׁת נָחוֹר֙ מִלְכָּ֔ה בַּת הָרָ֥ן אֲבִֽי מִלְכָּ֖ה וַֽ/אֲבִ֥י יִסְכָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/029.yaml
  text: Abram and Nahor took wives for themselves. The name of Abram’s wife was Sarai[a], and the name of Nahor’s wife was Milcah, the daughter of Haran, the father of Milcah and of Iscah.
translation:
  language: ta
  text: ஆபிராமும் நாகோரும் தங்களுக்கு மனைவிகளை எடுத்துக்கொண்டார்கள்[a]. ஆபிராமின் மனைவியின் பெயர் சாராய்; நாகோரின் மனைவியின் பெயர் மில்காள். மில்காள், மில்காளுக்கும் இஸ்காளுக்கும் தந்தையான ஆரானின் மகள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் இயல்பான தமிழில், “ஆபிராமும் நாகோரும் மனைவிகளை மணந்துகொண்டார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் சொல்லர்த்தமாக, “தங்களுக்கு மனைவிகளை எடுத்துக்கொண்டார்கள்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்துக்கொண்டார்கள்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்.’ திருமணச் சூழலில் இது மனைவியாக ஏற்றுக்கொள்வதைக் குறிக்கிறது; எபிரெய மொழியின் சொல்லாட்சியைத் தக்கவைக்க ‘எடுத்துக்கொண்டார்கள்’ பயன்படுத்தப்பட்டது.
- source_word: לָהֶם
  choice: தங்களுக்கு
  rationale: இந்தச் சொற்றொடரில் முன்னிடைச்சொல்லும் பன்மைப் பிரதிப்பெயரும் தன்நோக்கு அல்லது தனிப்பட்ட பயன் என்னும் பொருளைத் தருகின்றன.
- source_word: נָשִׁים
  choice: மனைவிகளை
  rationale: இந்தப் பெயர்ச்சொல் ‘பெண்கள்’ அல்லது ‘மனைவிகள்’ என்று பொருள்படலாம்; இங்கு திருமணச் சூழல் இருப்பதால் ‘மனைவிகள்’ என்பதே பொருத்தம்.
- source_word: שֵׁם
  choice: பெயர்
  rationale: மூலத்தில் இருமுறை வரும் ‘பெயர்’ என்ற அமைப்பைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: אֵשֶׁת
  choice: மனைவி
  rationale: கணவனின் பெயரோடு இணைந்துள்ளதால் இங்கு தெளிவாக ‘மனைவி’ என்று பொருள்.
- source_word: שָׂרָי
  choice: சாராய்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: מִלְכָּה
  choice: மில்காள்
  rationale: எபிரெய தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: בַּת
  choice: மகள்
  rationale: நேரடியான உறவுமுறைச் சொல்.
- source_word: הָרָן
  choice: ஆரான்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: אֲבִי
  choice: தந்தையான
  rationale: אב என்பதன் இயல்பான பொருள் ‘தந்தை’; உடனடிக் குடும்ப வம்சவரிசைச் சூழலும் அதையே ஆதரிக்கிறது.
- source_word: יִסְכָּה
  choice: இஸ்காள்
  rationale: எபிரெய தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
