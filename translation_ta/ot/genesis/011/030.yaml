- source_word: עֲקָרָה
  choice: மலடியாக
  rationale: பெண் குழந்தை பெற இயலாத நிலையைக் குறிக்கும் சொல். அடுத்துள்ள ‘பிள்ளை இல்லை’ என்ற விளக்கத்திலிருந்து வேறுபாட்டையும் மூலத்தின் நேரடியான பொருளையும் காக்கிறது.
- source_word: אֵין לָהּ
