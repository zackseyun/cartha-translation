lexical_decisions:
- source_word: וַתְּהִי
  choice: இருந்தாள்
  rationale: היה என்பதன் தொடர்கதை வடிவம் இங்கு சாராயின் நிலையைச் சொல்கிறது. தனியான காலச்சுட்டுச் சொல் இல்லாததால், தமிழில் இயல்பான இறந்தகால நிலைவினையாக மொழிபெயர்க்கப்பட்டது.
- source_word: שָׂרַי
