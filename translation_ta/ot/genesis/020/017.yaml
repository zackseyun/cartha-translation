  text: וַ/יִּתְפַּלֵּ֥ל אַבְרָהָ֖ם אֶל הָ/אֱלֹהִ֑ים וַ/יִּרְפָּ֨א אֱלֹהִ֜ים אֶת אֲבִימֶ֧לֶךְ וְ/אֶת אִשְׁתּ֛/וֹ וְ/אַמְהֹתָ֖י/ו וַ/יֵּלֵֽדוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/017.yaml
  text: Then Abraham prayed to God[a], and God healed Abimelech, his wife, and his female servants[b], and they gave birth.
translation:
  language: ta
  text: பின்பு ஆபிரகாம் கடவுளிடம் ஜெபித்தார். கடவுள் அபிமெலேக்கையும், அவனுடைய மனைவியையும், அவனுடைய பணிப்பெண்களையும்[a] குணமாக்கினார்; அந்தப் பெண்கள் பிள்ளைகளைப் பெற்றார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுடைய அடிமைப் பெண்களையும்’; எபிரெயச் சொல் பெண் பணியாளர்களையோ அடிமைப் பெண்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘அவர்கள் பெற்றெடுத்தார்கள்.’ இங்குள்ள எபிரெய வினை பெண்பால் பன்மையில் உள்ளது.
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: மன்றாடினார்
  rationale: פלל என்பதன் Hitpael வடிவம் இங்கு கடவுளிடம் வேண்டுதல் செய்வதைக் குறிக்கிறது. சூழலில் பிறருக்காக வேண்டுதல் அடங்கினாலும், அதை வெளிப்படையாகச் சேர்க்காமல் இயல்பான தமிழில் ‘மன்றாடினார்’ என வழங்கப்பட்டுள்ளது.
- source_word: אֶל הָאֱלֹהִים / אֱלֹהִים
  choice: கடவுளிடம் / கடவுள்
  rationale: இரு இடங்களிலும் இச்சொல் ஒரே உண்மையான கடவுளைக் குறிக்கிறது. நவீன பொதுத்தமிழில் இயல்பாகவும் தெளிவாகவும் இருப்பதால் ‘கடவுள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּרְפָּא
  choice: குணமாக்கினார்
  rationale: רפא என்பதன் நேரடிப் பொருள் ‘குணமாக்குதல்’. எந்தக் குறிப்பிட்ட நோய் அல்லது உடல்நிலையையும் ஊகித்துச் சேர்க்காமல் கடவுள் அந்தப் பாதிப்பை நீக்கியதை இது தெரிவிக்கிறது.
- source_word: אֶת אֲבִימֶלֶךְ
  choice: அபிமெலேக்கை
  rationale: எபிரெயப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: אִשְׁתּוֹ
  choice: அவனுடைய மனைவியை
  rationale: அபிமெலேக்கின் மனைவியைக் குறிக்கும் எளிய உடைமைத் தொடர்.
- source_word: אַמְהֹתָיו
  choice: அவனுடைய பணிப்பெண்களை
  rationale: אָמָה என்பது பெண் பணியாளர் அல்லது அடிமைப் பெண்ணைக் குறிக்கலாம். ‘பணிப்பெண்கள்’ நவீன தமிழில் இயல்பாக இருந்து பாலினத்தைக் காட்டுகிறது; அடிமை நிலையைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיֵּלֵדוּ
  choice: அந்தப் பெண்கள் பிள்ளைகளைப் பெற்றார்கள்
  rationale: ילד என்பதன் பொருள் ‘பெற்றெடுத்தல்’. பெண்பால் பன்மை வடிவமும் அடுத்த வசனத்தின் சூழலும் மனைவியும் பணிப்பெண்களுமே பிள்ளைகளைப் பெற்றார்கள் என்பதைத் தெளிவாக்குகின்றன. தமிழில் இயல்புக்காக ‘பிள்ளைகளை’ வெளிப்படையாகச் சேர்த்துள்ளோம்.
theological_decisions:
- issue: குணமாக்குதலுக்கும் இறுதி வினைக்கும் இடையிலான உறவு
  choice: எபிரெய இணைப்பை மதித்து ‘...குணமாக்கினார்; ... பிள்ளைகளைப் பெற்றார்கள்’ என்று தொடர்ச்சியாக மொழிபெயர்த்தல்.
  alternative: விளைவை வெளிப்படையாக்கி ‘அதனால் அவர்கள் பிள்ளைகளைப் பெற்றார்கள்’ என்று மொழிபெயர்த்தல்.
  rationale: சூழலில் பிள்ளைப்பேறு குணமாக்குதலின் விளைவு என்பது தெளிவாக இருந்தாலும், எபிரெய உரை விளைவைக் குறிக்கும் தனிச்சொல்லைப் பயன்படுத்தவில்லை. எனவே அந்த உறவை மொழிபெயர்ப்பில் அளவுக்கு மீறி நிர்ணயிக்காமல் தொடர்ச்சி பாதுகாக்கப்படுகிறது.
- issue: אָמָה என்பதிலுள்ள சமூக நிலை நுணுக்கம்
  choice: முதன்மை உரையில் ‘பணிப்பெண்கள்’ என்பதைக் கொண்டு, ‘அடிமைப் பெண்கள்’ என்ற சாத்தியத்தை அடிக்குறிப்பில் தருதல்.
  alternative: முதன்மை உரையிலேயே ‘அடிமைப் பெண்கள்’ என்று வழங்குதல்.
  rationale: எபிரெயச் சொல் பணியாளர் மற்றும் அடிமை ஆகிய இரு நுணுக்கங்களையும் கொள்ளக்கூடும். உடனடிச் சூழல் அவர்களுடைய சட்ட அல்லது சமூக நிலையைக் குறிப்பாக வலியுறுத்தாததால், பொதுவான சொல்லை உரையில் வைத்து வலுவான மாற்றுப் பொருளை அடிக்குறிப்பில் பதிவு செய்கிறது.
- issue: וַיֵּלֵדוּ என்ற பெண்பால் பன்மையின் குறிப்பு
  choice: ‘அந்தப் பெண்கள்’ என்று மனைவியையும் பணிப்பெண்களையும் தெளிவாகக் குறித்தல்.
  alternative: முறையாக ‘அவர்கள் பெற்றெடுத்தார்கள்’ என்று மட்டும் வழங்குதல்.
  rationale: எபிரெய வினை பெண்பால் பன்மையில் இருப்பதால் அபிமெலேக்கு அதற்குரிய எழுவாய் அல்ல. தமிழ் வாசகர்கள் தவறாக அனைவரையும் எழுவாயாகப் புரிந்துகொள்ளாதபடி, எபிரெய இலக்கணத்தில் உள்ள தகவல் இயல்பாக வெளிப்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மன்றாடினார்’, ‘குணமாக்கினார்’, ‘பணிப்பெண்கள்’ போன்ற சொற்கள் வேதாகமச் சூழலுக்கு ஏற்ற மரியாதையையும் இன்றைய வாசிப்பின் இயல்பையும் இணைக்கின்றன. தேவையற்ற பழமையான சொற்களும் விளைவுறவை மிகையாக வெளிப்படுத்தும் இணைப்புகளும் தவிர்க்கப்பட்டுள்ளன.
