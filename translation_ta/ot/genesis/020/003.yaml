base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/003.yaml
  text: But God came to Abimelech in a dream by night and said to him[a], “Behold, you are a dead man because of the woman whom you have taken[c][b], for she is married.”
translation:
  language: ta
  text: ஆனால் தேவன் இரவில் அபிமெலேக்கிடம் கனவில் வந்து, அவனிடம், “இதோ, நீ எடுத்துக்கொண்ட பெண்ணின் காரணமாக நீ சாகப்போகிறாய்[a]; ஏனெனில் அவளுக்குக் கணவன் இருக்கிறான்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “இதோ, நீ இறந்தவன்.” இது நிச்சயமான, நெருங்கிய மரணத்தை அறிவிக்கும் எச்சரிக்கையாகவும் புரிந்துகொள்ளப்படலாம்.'
    reason: lexical_alternative
  - marker: b
    text: 'எபிரேயத்தில் சொல்லுக்குச் சொல்: “அவள் ஒரு கணவனுக்கு உரியவள்”; அதாவது, அவள் ஏற்கெனவே திருமணமானவள்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்து
  rationale: בוא என்பதன் இயல்பான கதைநடைப் பொருளைத் தருகிறது; கனவுக்குள் உடல்ரீதியாக ‘நுழைந்தார்’ என்ற தேவையற்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: ஒருமை வினை வடிவங்களும் ஆபிரகாம் கதையின் சூழலும் இங்கே ஒரே தேவனைக் குறிக்கின்றன.
- source_word: בַּחֲלוֹם הַלָּיְלָה
  choice: இரவில் ... கனவில்
  rationale: இரவு நேரத்தில் நிகழ்ந்த கனவின் வழியான சந்திப்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: הִנְּךָ מֵת
  choice: இதோ, நீ சாகப்போகிறாய்
  rationale: הִנֵּה-யின் எச்சரிக்கை வலிமையையும் מֵת குறிக்கும் நிச்சயமான, நெருங்கிய மரணத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; காலநிலைத் தெளிவின்மையை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: עַל
  choice: காரணமாக
  rationale: இங்கே மரண எச்சரிக்கைக்கான காரணத்தைச் சுட்டுகிறது.
- source_word: לָקַחְתָּ
  choice: நீ எடுத்துக்கொண்ட
  rationale: வினையின் அடிப்படைப் பொருளைப் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத வன்முறையையோ திருமணச் செயலையையோ சேர்க்கவில்லை.
- source_word: בְּעֻלַת בָּעַל
  choice: அவளுக்குக் கணவன் இருக்கிறான்
  rationale: அவள் ஏற்கெனவே திருமண உறவில் இருப்பதைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது; எபிரேயத்தின் உடைமைச் சாயலை நேரடியாகத் தமிழில் திணிக்காமல், அதை அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: הִנְּךָ מֵת என்ற தெய்வீக எச்சரிக்கையின் காலமும் வலிமையும்
  choice: இதோ, நீ சாகப்போகிறாய்
  alternative: இதோ, நீ இறந்தவன்
  rationale: எபிரேய வடிவம் நிகழ்கால நிலை அல்லது எதிர்கால தீர்ப்பு என்று மட்டும் கட்டுப்படுத்தாமல், நிச்சயமான நெருங்கிய மரணத்தை அறிவிக்கிறது. முதன்மை உரை இயல்பான தமிழில் அதன் எச்சரிக்கை வலிமையைத் தருகிறது; சொற்சார்ந்த மாற்று அடிக்குறிப்பில் உள்ளது.
- issue: בְּעֻלַת בָּעַל என்பதன் திருமண உறவு
  choice: அவளுக்குக் கணவன் இருக்கிறான்
  alternative: அவள் கணவனுக்கு உரியவள்
  rationale: அவளுடைய நிலவும் திருமணப் பிணைப்பைத் தெளிவாகக் காட்டுகிறது; பெண்ணை வெறும் சொத்தாகக் குறிப்பிடும் கருத்தை மொழிபெயர்ப்பே கூடுதலாக வலுப்படுத்தாமல், மூலத்தின் சொற்சாயலை அடிக்குறிப்பில் தெரிவிக்கிறது.
