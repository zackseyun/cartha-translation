  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘தேவன்’, ‘இதோ’ ஆகியவை வேதாகமச் சூழலுக்கேற்ற உயர்நடையைத் தக்கவைக்கின்றன; அரிதான அல்லது பழமையான இலக்கண வடிவங்கள் தவிர்க்கப்பட்டுள்ளன.
