language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/גַם אָמְנָ֗ה אֲחֹתִ֤/י בַת אָבִ/י֙ הִ֔וא אַ֖ךְ לֹ֣א בַת אִמִּ֑/י וַ/תְּהִי לִ֖/י לְ/אִשָּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/012.yaml
  text: Besides[a], she really is my sister—the daughter of my father, though not the daughter of my mother—and she became my wife.
translation:
  language: ta
  text: மேலும்[a], அவள் உண்மையிலேயே என் சகோதரிதான்—அவள் என் தந்தையின் மகள், ஆனால் என் தாயின் மகள் அல்ல—அவள் எனக்கு மனைவியானாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொற்சார்பாக: “அத்துடன், அவள் உண்மையிலேயே என் சகோதரி; அவள் என் தந்தையின் மகள், ஆனால் என் தாயின் மகள் அல்ல.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: மேலும்
  rationale: இணைப்புச் சொல்லும் சேர்க்கைப் பொருளுடைய இடைச்சொல்லும் ஆபிரகாம் தன் விளக்கத்தில் இன்னொரு காரணத்தை முன்வைப்பதைக் காட்டுகின்றன; ‘மேலும்’ என்பது இதை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אָמְנָה
  choice: உண்மையிலேயே
  rationale: இந்த வினையடை, கூறப்பட்ட உறவு உண்மையானது என்பதை வலியுறுத்துகிறது.
- source_word: אֲחֹתִי
  choice: என் சகோதரி
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியுடன் வரும் நேரடியான உறவுமுறைச் சொல்.
- source_word: בַת אָבִי
  choice: என் தந்தையின் மகள்
  rationale: அவள் எந்த வகையில் சகோதரி என்பதை விளக்கும் உடனிலைத் தொடர்; அடுத்த தாய் குறித்த தொடருடன் உள்ள இணை அமைப்பையும் காக்கிறது.
- source_word: הִוא
  choice: அவள் ... தான்
  rationale: எபிரெய மொழியின் வினையில்லா பெயர்ச் சொற்றொடரில் தனித்த சுட்டுப்பெயர் வலியுறுத்தலைக் கொண்டுள்ளது; தமிழில் ‘தான்’ அந்த வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַךְ לֹא
  choice: ஆனால் ... அல்ல
  rationale: இங்கு אַךְ முன்னைய கூற்றை வரம்பிடும் அல்லது தகுதிப்படுத்தும் வேலையைச் செய்கிறது; ‘ஆனால் ... அல்ல’ அந்த எதிர்மறைத் தகுதிப்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: בַת אִמִּי
  choice: என் தாயின் மகள்
  rationale: தந்தை குறித்த தொடருக்கு இணையாக உறவின் தாய்வழி எல்லையைத் துல்லியமாகத் தருகிறது.
- source_word: וַתְּהִי לִי לְאִשָּׁה
  choice: அவள் எனக்கு மனைவியானாள்
  rationale: היה என்பதுடன் வரும் ל அமைப்பு திருமண நிலைக்குள் நுழைந்த நிகழ்வைக் குறிக்கிறது; ‘மனைவியானாள்’ அதன் நிகழ்வுத் தன்மையைப் பாதுகாக்கிறது.
