translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘சகோதரி’ என்பது துல்லியமான உறவுமுறைச் சொல்லாகவும், ‘மனைவியானாள்’ என்பது மூலத்தின் நிகழ்வுத் தன்மையைப் பாதுகாக்கவும் பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
