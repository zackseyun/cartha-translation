base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/009.yaml
  text: Then Abimelech called Abraham and said to him[a], “What have you done to us? And how have I sinned against you[b], that you have brought a great sin on me and on my kingdom? You have done to me things that should not be done.”
translation:
  language: ta
  text: பின்பு அபிமெலேக்கு ஆபிரகாமை அழைத்து, அவரிடம், “நீர் எங்களுக்கு என்ன செய்துவிட்டீர்? நான் உமக்கு எதிராக என்ன பாவம் செய்தேன்[a]? என்மீதும் என் ராஜ்யத்தின்மீதும் பெரும் பாவத்தை வரவழைத்துவிட்டீரே! செய்யக்கூடாத செயல்களை[b] எனக்குச் செய்துவிட்டீர்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உமக்கு என்ன குற்றம் இழைத்தேன்?”
    reason: חטא இங்கு ‘பாவம் செய்’ என்றும் ‘குற்றம் இழை’ என்றும் பொருள்படலாம்.
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “செய்யப்படாத செயல்களை.”
    reason: எபிரெயச் சொற்றொடர் இலக்கணரீதியாக வழக்கமாகச் செய்யப்படாதவற்றையோ நெறிப்படி செய்யக்கூடாதவற்றையோ குறிக்கலாம்; முதன்மை உரை அதன் நெறிசார் பொருளை இயல்பான தமிழில் தருகிறது.
lexical_decisions:
- source_word: וַיִּקְרָא ... לְאַבְרָהָם
  choice: ஆபிரகாமை அழைத்து
  rationale: קרא + לְ ஒரு நபரை அழைப்பதையோ வரவழைப்பதையோ குறிக்கலாம். இங்கு அதிகாரபூர்வமாகக் கட்டளையிட்டு வரவழைத்தார் என்று தேவையின்றி வலுப்படுத்தாமல், இயல்பான தமிழில் ‘அழைத்து’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מֶה עָשִׂיתָ לָּנוּ
  choice: நீர் எங்களுக்கு என்ன செய்துவிட்டீர்?
  rationale: מֶה என்ற நேரடி வினாவையும், ஆபிரகாமின் செயலால் ஏற்பட்டுள்ள தற்போதைய விளைவையும் ‘செய்துவிட்டீர்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּמֶה חָטָאתִי לָךְ
  choice: நான் உமக்கு எதிராக என்ன பாவம் செய்தேன்?
  rationale: חטא இங்கு ஒருவருக்கு எதிராகப் பாவம் செய்வதையோ குற்றமிழைப்பதையோ குறிக்கிறது. ‘பாவம் செய்தேன்’ என்பது அதன் அறநெறி மற்றும் சமயச் செறிவைப் பாதுகாக்கிறது.
- source_word: הֵבֵאתָ עָלַי וְעַל מַמְלַכְתִּי
  choice: என்மீதும் என் அரசின்மீதும் ... வரவழைத்துவிட்டீரே
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ஒன்றை ஒருவர் அல்லது ஓர் ஆட்சியின்மீது வரச் செய்வதைக் குறிக்கிறது. ‘வரவழைத்துவிட்டீர்’ காரணப்படுத்தும் பொருளையும் அபிமெலேக்கின் கடும் குற்றச்சாட்டையும் இயல்பாகத் தருகிறது.
- source_word: מַמְלַכְתִּי
  choice: என் அரசு
  rationale: ממלכה அரசனுடைய ஆட்சிக்குட்பட்ட அரசு அல்லது ராஜ்யத்தைக் குறிக்கிறது. ‘அரசு’ என்பது இன்றைய வாசகருக்கு இயல்பாகவும் தெளிவாகவும் உள்ளது; அதை வெறும் நிலப்பகுதியான ‘நாடு’ என்று சுருக்கவில்லை.
- source_word: חֲטָאָה גְדֹלָה
  choice: பெரும் பாவம்
  rationale: חטאה பாவம், குற்றம், குற்றப்பழி ஆகிய பொருள்களை ஏற்கலாம். இச்சூழலில் கடுமையான அறமீறலைக் குறிக்கும் ‘பெரும் பாவம்’ மூலத்தின் எடையைப் பாதுகாக்கிறது.
- source_word: מַעֲשִׂים אֲשֶׁר לֹא יֵעָשׂוּ
  choice: செய்யக்கூடாத செயல்கள்
  rationale: சொல்லுக்கு நெருக்கமாக ‘செய்யப்படாத செயல்கள்’ என இருக்கலாம்; ஆனால் இங்கு வழக்கமின்மையைவிடத் தகாத செயல் என்ற நெறிசார் பொருள் முன்னிலையில் உள்ளது. ‘செய்யக்கூடாத’ என்பது அதனை இயல்பான தமிழில் தருகிறது.
- source_word: עָשִׂיתָ עִמָּדִי
  choice: எனக்குச் செய்துவிட்டீர்
  rationale: עשה עם/עמד என்பது ஒருவருடன் நடந்துகொள்வதையோ அவருக்குச் செய்வதையோ குறிக்கும். இங்கு முன்னுள்ள ‘செயல்கள்’ என்பதோடு இணைந்து ‘எனக்குச் செய்துவிட்டீர்’ என இயல்பாக அமைகிறது.
theological_decisions:
- issue: חטא / חטאה என்பவற்றின் அறநெறி மற்றும் சமய வலிமை
  choice: ‘பாவம்’ என்ற சொல்லை இரு இடங்களிலும் தக்கவைத்தல்
  alternative: ‘குற்றம்’ அல்லது ‘தீங்கு’
  rationale: அபிமெலேக்கு ஆபிரகாமால் தனக்கு ஏற்பட்ட தனிப்பட்ட தீங்கை மட்டும் அல்லாமல், தன்ன்மீதும் தனது அரசின்மீதும் வரக்கூடிய கடுமையான அறமீறலைக் குற்றஞ்சாட்டுகிறான். ‘பாவம்’ மூலச்சொல்லின் முழு வலிமையைத் தக்கவைக்கிறது; குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கடுமையான குற்றச்சாட்டின் தொனியும் ஒன்றாகத் தங்குமாறு ‘நீர்/உமக்கு’ பயன்படுத்தப்பட்டுள்ளது. தேவையற்ற பழமையான நடையும் சமயப் பிரிவு சார்ந்த சொற்களும் தவிர்க்கப்பட்டுள்ளன.
