review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the narrative sequence, addressee, interrogative force, and the idiomatic use of רָאָה ('see'). However, 'எதைக் கண்டதால்' makes the causal relation more explicit than the Hebrew's compact 'what did you see, that...' formulation, and 'இப்படிச்' does not explicitly represent 'this matter/thing.'
  naturalness: The respectful modern Tamil register is good. 'எதைக் கண்டு' is both natural Tamil and closer to the Hebrew idiom than 'எதைக் கண்டதால்.' 'இந்தக் காரியத்தைச் செய்தீர்' is clear and suitably formal without being archaic.
  terminology: The established Tamil transliterations 'அபிமெலேக்கு' and 'ஆபிரகாம்' are retained. No theological terminology is involved. The footnote accurately presents the literal wording and its idiomatic sense.
  issues:
  - severity: medium
    issue: The connective wording 'எதைக் கண்டதால்' over-specifies causation.
    rationale: The Hebrew asks, literally, 'What did you see that you did this thing?' It implies Abraham's perception or consideration, but does not require the more direct Tamil causal assertion 'because you saw.' 'எதைக் கண்டு' preserves the idiom and the syntactic ambiguity.
  - severity: low
    issue: The phrase 'இப்படிச் செய்தீர்' leaves 'this thing/matter' implicit.
    rationale: Although understandable in context, the Hebrew explicitly includes אֶת־הַדָּבָר הַזֶּה, 'this matter/thing.' 'இந்தக் காரியத்தைச் செய்தீர்' represents it directly and remains natural.
  revised_text: பின்பு அபிமெலேக்கு ஆபிரகாமிடம், “நீர் எதைக் கண்டு இந்தக் காரியத்தைச் செய்தீர்?” என்று கேட்டான்.[a]
