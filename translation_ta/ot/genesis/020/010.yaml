revisions:
- from: பின்பு அபிமெலேக்கு ஆபிரகாமிடம், “நீர் எதைக் கண்டதால் இப்படிச் செய்தீர்?” என்று கேட்டான்.[a]
  to: பின்பு அபிமெலேக்கு ஆபிரகாமிடம், “நீர் எதைக் கண்டு இந்தக் காரியத்தைச் செய்தீர்?” என்று கேட்டான்.[a]
  rationale: The revision retains the question form and respectful register while rendering the Hebrew idiom more closely. It avoids turning the idiomatic question into an unambiguously causal statement and explicitly translates 'this matter/thing.'
