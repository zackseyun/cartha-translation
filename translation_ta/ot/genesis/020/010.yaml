source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲבִימֶ֖לֶךְ אֶל אַבְרָהָ֑ם מָ֣ה רָאִ֔יתָ כִּ֥י עָשִׂ֖יתָ אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/010.yaml
  text: Then Abimelech said to Abraham[a], “What did you see, that you did this thing?”
translation:
  language: ta
  text: பின்பு அபிமெலேக்கு ஆபிரகாமிடம், “நீர் எதைக் கண்டு இந்தக் காரியத்தைச் செய்தீர்?” என்று கேட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எதை மனதில் கொண்டு இந்தக் காரியத்தைச் செய்தீர்?” எபிரெயத்தில் சொல்லுக்குச் சொல், “எதைக் கண்டீர்...?” என்று உள்ளது. இங்கு ‘காண்’ என்பது ஒருவர் உணர்ந்ததை அல்லது மனதில் கொண்டிருந்ததைச் சுட்டும் மரபுத்தொடராகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... கேட்டான்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுக்கிறது; கேள்வி உரையாதலால் தமிழில் ‘கேட்டான்’ என்பது இயல்பாகவும் பொருளுக்கு உண்மையாகவும் உள்ளது.
- source_word: אֲבִימֶלֶךְ
  choice: அபிமெலேக்கு
  rationale: தனிப்பெயர் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பு வடிவில் தரப்பட்டுள்ளது.
- source_word: אֶל־אַבְרָהָם
  choice: ஆபிரகாமிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: מָה רָאִיתָ
  choice: நீர் எதைக் கண்டதால்
  rationale: ‘எதைக் கண்டீர்?’ என்ற எபிரெய உருவகத்தைப் பாதுகாக்கிறது; சூழலில் இது அவர் எதை உணர்ந்தார் அல்லது மனதில் கொண்டார் என்ற நோக்கக் கேள்வியையும் சுமக்கிறது.
- source_word: כִּי עָשִׂיתָ
  choice: இப்படிச் செய்தீர்
  rationale: כִּי இணைக்கும் காரண/விளைவு உறவைத் தமிழில் ‘-தால்’ அமைப்பு இயல்பாக வெளிப்படுத்துகிறது; עָשִׂיתָ என்பதன் எளிய ‘செய்தீர்’ பொருள் காக்கப்படுகிறது.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: இப்படி
  rationale: சொல்லுக்கு நெருக்கமாக ‘இந்தக் காரியத்தை’ எனலாம்; ஆனால் செயலைச் சுட்டும் இச்சூழலில் ‘இப்படிச்’ என்பது இயல்பான தமிழாக இருந்து பொருளைச் சுருக்கமின்றி தெரிவிக்கிறது.
