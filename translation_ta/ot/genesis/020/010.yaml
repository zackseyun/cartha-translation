translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஆபிரகாமை நோக்கிய நேரடி உரையில் மரியாதைப் பன்மையான ‘நீர்/செய்தீர்’ வடிவம் அமைந்துள்ளது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் சேர்க்கப்பட்டுள்ளது.
