revisions:
- from: ஏனெனில், ஆபிரகாமின் மனைவியாகிய சாராளின் காரணமாக, யாவே அபிமெலேக்கின் வீட்டாரிலுள்ள எல்லாக் கருப்பைகளையும் முற்றிலுமாக அடைத்திருந்தார்.[a]
  to: ஏனெனில், ஆபிரகாமின் மனைவி சாராளின் காரணமாக, யாவே அபிமெலேக்கின் வீட்டாரின் ஒவ்வொரு கருப்பையையும் முற்றிலுமாக மூடியிருந்தார்.[a]
