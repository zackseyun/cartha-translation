base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/018.yaml
  text: For Yahweh had completely closed every womb in Abimelech’s household because of Sarah[a], Abraham’s wife.
translation:
  language: ta
  text: ஏனெனில், ஆபிரகாமின் மனைவி சாராளின் காரணமாக, யாவே அபிமெலேக்கின் வீட்டாரின் ஒவ்வொரு கருப்பையையும் முற்றிலுமாக மூடியிருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நிச்சயமாக மூடியிருந்தார்” அல்லது “முழுவதுமாகத் தடுத்து வைத்திருந்தார்” என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் வினையெச்சப் பெயருருவும் வினைமுற்றும் இணைந்து வலியுறுத்தலைக் காட்டுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நிகழ்வுக்கான விளக்கக் காரணத்தை இது அறிமுகப்படுத்துகிறது.
- source_word: עָצֹר עָצַר
  choice: முற்றிலுமாக அடைத்திருந்தார்
  rationale: வினையெச்சப் பெயருருவும் வினைமுற்றும் இணையும் எபிரெய வலியுறுத்தலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; சூழல் கருப்பைகள் திறக்கப்படாமல் செய்யப்பட்டதைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: בְּעַד כָּל רֶחֶם לְבֵית אֲבִימֶלֶךְ
  choice: அபிமெலேக்கின் வீட்டாரிலுள்ள எல்லாக் கருப்பைகளையும்
  rationale: ‘வீடு’ என்பதை கட்டடமாக அல்லாமல் வீட்டார் அல்லது குடும்ப வட்டம் எனத் தருகிறது; ‘ஒவ்வொரு/எல்லாக் கருப்பை’ என்ற மூலமொழியின் உடல்சார் உருவகத்தையும் காக்கிறது.
- source_word: עַל דְּבַר שָׂרָה
  choice: சாராளின் காரணமாக
  rationale: இங்கு இச்சொற்றொடர் தீர்ப்பிற்கான காரணத்தைச் சுட்டுகிறது.
- source_word: אֵשֶׁת אַבְרָהָם
  choice: ஆபிரகாமின் மனைவியாகிய
  rationale: சாராளை அடையாளப்படுத்தும் உறவை இயல்பான தமிழில் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரையே நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: கருப்பைகள் அடைக்கப்பட்ட செயலில் உள்ள வலியுறுத்தல்
  choice: முற்றிலுமாக அடைத்திருந்தார்
  alternative: நிச்சயமாக அடைத்திருந்தார்
  rationale: எபிரெய மொழியின் வினையெச்சப் பெயருரு + வினைமுற்று அமைப்பு செயலை வலியுறுத்துகிறது. சூழலில் அதன் முழுமையான விளைவை முதன்மைப் பாடம் வெளிப்படுத்துகிறது; வலியுறுத்தலின் வேறு சாத்தியமான நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் தரப்பட்டுள்ளது. ‘கருப்பைகள்’ என்ற மூலத்தின் நேரடியான உடல்சார் சொல்லாட்சி பாதுகாக்கப்பட்டுள்ளது; ‘வீட்டார்’ என்பது அபிமெலேக்கின் குடும்பம் மற்றும் இல்ல வட்டத்தைச் சுட்டுகிறது.
