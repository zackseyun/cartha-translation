base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/001.yaml
  text: From there Abraham journeyed toward the Negev and settled between Kadesh and Shur[a]; he sojourned in Gerar.
translation:
  language: ta
  text: அங்கிருந்து ஆபிரகாம் நெகேபை[a] நோக்கிப் பயணம் செய்து, காதேசுக்கும் சூருக்கும் இடையில் குடியேறினார்; கெராரில் அந்நியராகத் தங்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தெற்கே.” எபிரெயச் சொல் ‘நெகேப்’ எனப்படும் தென்பகுதியையோ, பொதுவாகத் தென்திசை நோக்கிய நகர்வையோ குறிக்கலாம்; முதன்மை உரை, புவியியல் குறிப்பாக இருப்பதற்கான அதிக வாய்ப்புள்ள பொருளைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: பயணம் செய்து
  rationale: נסע என்பதன் கால் தொடர் வடிவம் ஓர் இடத்திலிருந்து புறப்பட்டுச் செல்வதைக் குறிக்கிறது; இயல்பான தமிழில் கதைநகர்வைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: முன்னர் குறிப்பிடப்பட்ட இடத்தைச் சுட்டும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: אַרְצָה הַנֶּגֶב
  choice: நெகேபை நோக்கி
  rationale: אַרְצָה-இலுள்ள திசைச்சுட்டு முடிவு ஓர் இடத்தை நோக்கிய நகர்வைக் காட்டுகிறது; הַנֶּגֶב குறிப்பிட்ட தென்பகுதியின் புவியியல் பெயராக இருக்கலாம் என்பதைக் முதன்மை உரை பாதுகாக்கிறது.
- source_word: וַיֵּשֶׁב
  choice: குடியேறினார்
  rationale: ישב இங்கு வசித்தல் அல்லது தங்கியிருத்தலைக் குறிக்கிறது; பெயரிடப்பட்ட இரண்டு இடங்களுக்கு இடையிலான பகுதியில் வாழத் தொடங்கிய கருத்தை இயல்பாகத் தருகிறது.
- source_word: בֵּין קָדֵשׁ וּבֵין שׁוּר
  choice: காதேசுக்கும் சூருக்கும் இடையில்
  rationale: இரு புவியியல் இடங்களுக்கு நடுவிலான பகுதியை நேரடியாகக் குறிக்கிறது; இடப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: וַיָּגָר
  choice: அந்நியராகத் தங்கினார்
  rationale: גור வெறுமனே வசிப்பதை அல்ல, அந்நியர் அல்லது நிரந்தர உரிமையில்லாத குடியிருப்பாளர் என்ற நிலையில் தங்குவதைச் சுட்டுகிறது; இந்த நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בִּגְרָר
  choice: கெராரில்
  rationale: இடத்தைக் குறிக்கும் முன்னொட்டுடன் வந்த இடப்பெயரின் இயல்பான தமிழ் வடிவம்.
