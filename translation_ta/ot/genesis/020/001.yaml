translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘அந்நியராகத் தங்கினார்’ என்பது מעט உயர்ந்த ‘பரதேசியாய் சஞ்சரித்தார்’ போன்ற வழக்கைத் தவிர்த்து, גור என்பதன் சமூக-குடியிருப்பு நுணுக்கத்தைத் தெளிவாகப் பாதுகாக்கிறது. அடிக்குறி குறியீடு தெளிவுக்காக ‘குடியேறினார்’ என்பதற்குப் பின் வைக்கப்பட்டாலும், அது ‘நெகேப்’ என்ற சொல்லின் மாற்றுப் பொருளைக் குறிக்கிறது.
