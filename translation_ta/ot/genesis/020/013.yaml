base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/013.yaml
  text: 'And when God caused me to wander from my father’s house[a], I said to her, ‘This is the kindness you must show me: at every place we come to, say of me[b], “He is my brother.”’'
translation:
  language: ta
  text: 'தேவன் என் தந்தையின் வீட்டிலிருந்து என்னை அலைந்து திரியச் செய்தபோது[a], நான் அவளிடம், “நீ எனக்குச் செய்ய வேண்டிய தயவு[b] இதுதான்: நாம் வரும் ஒவ்வோர் இடத்திலும், ‘அவர் என் சகோதரர்’ என்று என்னைப் பற்றிச் சொல்” என்றேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என்னை வழிதவறச் செய்தபோது’ அல்லது ‘என்னை அலையச் செய்தபோது’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை காரணவினை வடிவில் உள்ளது; இச்சூழலில் அது ஒழுக்கத் தவறை அவசியம் குறிக்காமல், வீட்டைவிட்டுப் புறப்பட்டு இடம்விட்டு இடம் சென்றதைக் குறிக்கலாம். எபிரெய மூலத்தில் வினை பன்மை வடிவில் இருப்பதால், ‘தெய்வங்கள் என்னை அலைந்து திரியச் செய்தபோது’ என்பதும் இலக்கணரீதியாகச் சாத்தியமான வாசிப்பு; ஆனால் கதையின் சூழல் ஒரே தேவனையே குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_and_grammatical_ambiguity
  - marker: b
    text: ‘தயவு’ என்பதற்கான எபிரெயச் சொல் சூழலுக்கேற்ப பற்றுறுதியான அன்பு அல்லது விசுவாசமான தயவு என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעוּ
  choice: அலைந்து திரியச் செய்தபோது
  rationale: எபிரெய வினையின் காரணவினைப் பொருளைத் தக்கவைக்கிறது. ‘வழிதவறச் செய்தார்’ என்பது ஒழுக்கத் தவறு என்ற தேவையற்ற கருத்தை ஏற்படுத்தக்கூடும்; ‘அலைந்து திரியச் செய்தார்’ புறப்பட்டுச் சென்று நிலையான இடமின்றி நகர்ந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: ஆபிரகாமின் தேவனையே சூழல் முதன்மையாகக் குறிக்கிறது. எனினும், இங்கு வினைச்சொல் பன்மை வடிவில் இருப்பதால் உள்ள இலக்கணப் பதற்றம் அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்படுகிறது.
- source_word: מִבֵּית אָבִי
  choice: என் தந்தையின் வீட்டைவிட்டு
  rationale: குடும்ப வீடு அல்லது வீட்டார் என்ற சமூகப் பொருளை உள்ளடக்கிய எபிரெய மரபுத்தொடரை நெருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: חַסְדֵּךְ
  choice: நீ எனக்குச் செய்ய வேண்டிய தயவு
  rationale: இந்தத் தனிப்பட்ட வேண்டுகோளில் חסד என்பதற்கு ‘தயவு’ இயல்பானது; அதன் பற்றுறுதியான அன்பு அல்லது விசுவாசமான இரக்கம் என்ற விரிவான பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: תַּעֲשִׂי עִמָּדִי
  choice: நீ எனக்குச் செய்ய வேண்டிய
  rationale: ‘என்னுடன் செய்’ என்ற சொற்சொல் அமைப்பை, ‘தயவு’ என்பதோடு பொருந்தும் இயல்பான தமிழ் தொடராக மாற்றுகிறது; வேண்டுகோளின் வலிமையும் காக்கப்படுகிறது.
- source_word: אֶל כָּל הַמָּקוֹם אֲשֶׁר נָבוֹא שָׁמָּה
  choice: நாம் செல்லும் ஒவ்வொரு இடத்திலும்
  rationale: அவர்கள் வந்து சேரும் ஒவ்வொரு இடத்தையும் குறிக்கும் பகிர்நிலைப் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: אִמְרִי לִי
  choice: என்னைப் பற்றிச் சொல்
  rationale: சொற்சொல்லாக ‘எனக்காக/என்னிடம் சொல்’ என இருந்தாலும், சூழலில் பிறரிடம் ஆபிரகாமைப் பற்றிச் சொல்ல வேண்டும் என்பதே கருத்து.
- source_word: אָחִי הוּא
  choice: அவர் என் சகோதரர்
  rationale: கதையின் மையமாக உள்ள உறவுமுறைக் கூற்றை பொதுவான ‘உறவினர்’ என்று மாற்றாமல் நேரடியாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: ஆபிரகாம் அலைந்து திரிந்ததற்கான செய்பவர்
  choice: தேவன் ஆபிரகாமைத் தந்தையின் வீட்டைவிட்டு அலைந்து திரியச் செய்தார்
  alternative: தெய்வங்கள் ஆபிரகாமை அலைந்து திரியச் செய்தன; அல்லது தேவன் அதை அனுமதித்தார்
  rationale: மூலவாக்கியம் தெய்வீகச் செய்பவரை காரணவினையோடு நேரடியாக இணைக்கிறது; ஆகவே ‘அனுமதித்தார்’ என்று மென்மைப்படுத்தப்படவில்லை. אֱלֹהִים என்பதோடு பன்மை வினை வந்திருப்பதால் ‘தெய்வங்கள்’ என்ற இலக்கண வாய்ப்பையும் முற்றாக மறைக்காமல் அடிக்குறிப்பில் பதிவு செய்கிறது; கதையின் சூழல் ஒருமை ‘தேவன்’ என்பதையே முதன்மைப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டது. காரணவினையின் தெய்வீகச் செயற்பாடு மென்மைப்படுத்தப்படவில்லை; அதேவேளையில் ‘வழிதவறுதல்’ தரக்கூடிய தேவையற்ற ஒழுக்கப் பொருள் முதன்மை உரையில் தவிர்க்கப்பட்டது. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் உரிய இடங்களில் சேர்க்கப்பட்டுள்ளன.
