source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַבְרָהָ֔ם כִּ֣י אָמַ֗רְתִּי רַ֚ק אֵין יִרְאַ֣ת אֱלֹהִ֔ים בַּ/מָּק֖וֹם הַ/זֶּ֑ה וַ/הֲרָג֖וּ/נִי עַל דְּבַ֥ר אִשְׁתִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/011.yaml
  text: And Abraham said[a], “Because I said, ‘Surely there is no fear of God in this place, and they will kill me because of my wife.’”
translation:
  language: ta
  text: ஆபிரகாம், “ஏனெனில், ‘இந்த இடத்தில் கடவுளுக்குப் பயம் அறவே இல்லை; என் மனைவியின் காரணமாக அவர்கள் என்னைக் கொன்றுவிடுவார்கள்’ என்று நான் சொன்னேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: என்று நான் நினைத்தேன்
  rationale: இங்கு ஆபிரகாம் தன் முந்தைய செயலுக்கான காரணத்தை விளக்குகிறான். தமிழில் காரணவாக்கியத்தை மேற்கோளுக்குப் பின் வைத்து ‘என்று நான் நினைத்தேன்’ என முடிப்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אָמַרְתִּי
  choice: நான் நினைத்தேன்
  rationale: எபிரெய வினைச்சொல்லின் அடிப்படைப் பொருள் ‘சொன்னேன்’ என்றாலும், இச்சூழலில் அது தனக்குள் கூறிக்கொண்ட எண்ணத்தைக் குறிக்கிறது; ஆகவே இயல்பான தமிழில் ‘நினைத்தேன்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: רַק
  choice: அறவே
  rationale: ஆபிரகாமின் உறுதியான ஊகத்தை வலியுறுத்தும் சொல்லாக இங்கு வருகிறது. ‘அறவே இல்லை’ என்பது அதன் வலியுறுத்தலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵין יִרְאַת אֱלֹהִים
  choice: கடவுளுக்குப் பயப்படுதல் இல்லை
  rationale: மூலத்தின் ‘கடவுளுக்குப் பயம்’ என்ற வேதாகம மொழிநடையையும், கடவுளுக்கு முன்பான ஒழுக்கப் பொறுப்புணர்வு என்ற அதன் நிறையையும் பாதுகாக்கிறது.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: இந்த இடத்தில்
  rationale: இடத்தைக் குறிக்கும் எபிரெய சொற்றொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: וַהֲרָגוּנִי
  choice: என்னைக் கொன்றுவிடுவார்கள்
  rationale: தனக்கு நேரும் என்று ஆபிரகாம் எதிர்பார்த்த விளைவைத் தெளிவாகக் காட்டுகிறது; ‘கொன்றுவிடுவார்கள்’ என்பது அச்சுறுத்தலின் முடிவுத்தன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל דְּבַר אִשְׁתִּי
  choice: என் மனைவியின் காரணமாக
  rationale: ‘என் மனைவியை முன்னிட்டு / அவளினிமித்தம்’ என்ற காரணப் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: יִרְאַת אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுளுக்குப் பயப்படுதல்
  alternative: கடவுளிடம் பயபக்தி
  rationale: எபிரெயத்தில் ‘பயம்’ என்ற சொல் வெளிப்படையாக இருப்பதால் அந்த வேதாகமச் சொல்லாட்சியைப் பாதுகாக்கிறது. இங்கு அது வெறும் அச்சத்தை மட்டுமல்ல, கடவுளுக்கு முன்பான பயபக்தியையும் ஒழுக்கப் பொறுப்புணர்வையும் உள்ளடக்கலாம்.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; மரியாதையும் வேதாகமச் செறிவும் கொண்ட, சாதாரண வாசகர்களுக்கு எளிதில் புரியும் நடை. நேரடி ‘நான் சொன்னேன்’ என்பதற்குப் பதில் சூழல்சார் உள்சிந்தனையை இயல்பாகக் காட்ட ‘நான் நினைத்தேன்’ பயன்படுத்தப்பட்டது.
