translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள ஆண்–பெண் வேறுபாடு வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது. அடிமைத்தனத்தின் சமூக உண்மையை மென்மைப்படுத்தாமல், சொல்லின் சூழல்சார் மாற்றுப் பொருள் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
