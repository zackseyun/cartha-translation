base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/014.yaml
  text: Then Abimelech took sheep and cattle[a], and male servants and female servants, and gave them to Abraham[c][b]; and he returned Sarah his wife to him.
translation:
  language: ta
  text: அப்போது அபிமெலேக்கு ஆடுகளையும்[a] மாடுகளையும், ஆண் அடிமைகளையும் பெண் அடிமைகளையும்[b] எடுத்து ஆபிரகாமுக்குக் கொடுத்தான். மேலும், ஆபிரகாமின் மனைவி சாராவை அவனிடம் திருப்பிக் கொடுத்தான்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மந்தைகளையும்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் צֹאן செம்மறியாடுகள், வெள்ளாடுகள் ஆகிய சிறிய கால்நடைகளை விரிவாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆண் பணியாளர்களையும் பெண் பணியாளர்களையும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்கள் பணியாளர்களையோ அடிமைகளையோ குறிக்கலாம்; இங்கு அவர்கள் கால்நடைகளோடு கொடுக்கப்படுவதால் ‘அடிமைகள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: ‘சாராவை அவனிடம் மீட்டளித்தான்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்து
  rationale: לקח என்பதன் வழக்கமான பொருள் ‘எடுத்தல்.’ இது எபிரெயக் கதைத் தொடரை கூடுதல் நுணுக்கம் சேர்க்காமல் இயல்பாகக் கொண்டுவருகிறது.
- source_word: צֹאן
  choice: ஆடுகள்
  rationale: צֹאן என்பது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கிய சிறிய கால்நடைகளைத் தொகுப்பாகக் குறிக்கலாம். தமிழில் ‘ஆடுகள்’ என்பது இயல்பான சுருக்கமான இணைச்சொல்; அதன் விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בָקָר
  choice: மாடுகள்
  rationale: בָקָר பொதுவாக மாட்டினக் கால்நடைகளைக் குறிக்கிறது; இச்சூழலில் ‘மாடுகள்’ இயல்பான தமிழ்ச் சமமான சொல்.
- source_word: עֲבָדִים
  choice: ஆண் அடிமைகள்
  rationale: עֶבֶד ‘பணியாள்’ அல்லது ‘அடிமை’ எனச் சூழலுக்கேற்ப பொருள்படலாம். கால்நடைகளோடு மனிதர்களும் உடைமைபோல் மாற்றிக் கொடுக்கப்படும் இச்சூழலில் ‘அடிமைகள்’ சமூக நிலையை வெளிப்படையாகக் காட்டுகிறது; ஆண்பால் வேறுபாடும் பாதுகாக்கப்படுகிறது.
- source_word: שְׁפָחוֹת
  choice: பெண் அடிமைகள்
  rationale: שִׁפְחָה வீட்டைச் சார்ந்த பெண் அடிமை அல்லது பணிப்பெண்ணைக் குறிக்கலாம். பரிசாக மாற்றிக் கொடுக்கப்படும் இச்சூழலில் ‘பெண் அடிமைகள்’ பொருத்தமானது; முந்தைய ஆண்பால் சொல்லோடு உள்ள இணையும் காக்கப்படுகிறது.
- source_word: וַיִּתֵּן
  choice: கொடுத்தான்
  rationale: נתן என்பதன் நேரடியான பொருள் ‘கொடுத்தல்’; முன்னர் பட்டியலிடப்பட்ட அனைத்தும் இதன் பொருள்களாகத் தெளிவாக உள்ளன.
- source_word: וַיָּשֶׁב
  choice: திருப்பிக் கொடுத்தான்
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் ‘திரும்பச் செய்தல்’ அல்லது ‘மீட்டளித்தல்’ என்று பொருள்படும். சாராவை ஆபிரகாமிடம் மீண்டும் ஒப்படைத்த செயலை ‘திருப்பிக் கொடுத்தான்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִשְׁתּוֹ
  choice: ஆபிரகாமின் மனைவி
  rationale: பின்னொட்டு ஆபிரகாமையே குறிக்கிறது. எபிரெயத்தில் ‘அவனுடைய மனைவி’ என இருந்தாலும், தமிழில் பெயரை மீண்டும் கூறுவது சாரா அபிமெலேக்கின் மனைவி என்ற தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: לּוֹ
  choice: அவனிடம்
  rationale: இந்தப் பதிற்பெயர் ஆபிரகாமைக் குறிக்கிறது; உடனே முன் ‘ஆபிரகாமின்’ என்று வந்திருப்பதால் ‘அவனிடம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
