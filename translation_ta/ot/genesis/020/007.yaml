base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/007.yaml
  text: Now then[a], return the man's wife, for he is a prophet, and he will pray for you, and you will live. But if you do not return her, know that you will surely die—you and all who are yours.
translation:
  language: ta
  text: இப்போது, அந்த மனிதனின் மனைவியைத் திருப்பிக் கொடு; ஏனெனில் அவன் ஓர் இறைவாக்கினர். அவன் உனக்காக வேண்டிக்கொள்வான்; நீ உயிர்வாழ்வாய். ஆனால், நீ அவளைத் திருப்பிக் கொடுக்காவிட்டால், நீ நிச்சயமாகச் சாவாய் என்பதை அறிந்துகொள்—நீயும் உன்னைச் சேர்ந்த அனைவரும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீயும் உனக்குரிய அனைத்தும்” / “நீயும் உனக்கு உள்ளவையெல்லாம்.” எபிரெயச் சொற்றொடர் பரந்த பொருளுடையது; அது அபிமெலேக்கின் வீட்டாரையும் அவனுக்குச் சொந்தமான அனைத்தையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: காலத்தையும் முன் கூறப்பட்டதிலிருந்து வரும் அவசரமான முடிவையும் உணர்த்தும் உரையாடல் மாற்றத்தை இயல்பான தமிழில் தருகிறது.
- source_word: הָשֵׁב
  choice: திருப்பி அனுப்பு
  rationale: ஹிஃபில் கட்டளை வடிவம், ஒருவரை அவருடைய உரிய முந்தைய உறவுநிலைக்குத் திருப்பி அனுப்புவதைக் குறிக்கிறது.
- source_word: אֵשֶׁת הָאִישׁ
  choice: அந்த மனிதனுடைய மனைவி
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவாகப் பேணி, உரையில் இல்லாத பெயரையோ முன்னதாகவே மாற்றப்பட்ட பிரதிப்பெயரையோ புகுத்தவில்லை.
- source_word: כִּי נָבִיא הוּא
  choice: ஏனெனில் அவன் ஓர் இறைவாக்கினன்
  rationale: כִּי கட்டளைக்கான காரணத்தைத் தருகிறது; נָבִיא என்பதற்கு நவீனத் தமிழில் புரியக்கூடிய, கண்ணியமான சமயம் சார்ந்த சொல் பயன்படுத்தப்பட்டது.
- source_word: וְיִתְפַּלֵּל בַּעַדְךָ
  choice: அவன் உனக்காக வேண்டுதல் செய்வான்
  rationale: எதிர்கால அல்லது விளைவுசார் வினை வலிமையையும், בְּעַד என்பதிலுள்ள மற்றொருவரின் சார்பான வேண்டுதலையும் வெளிப்படுத்துகிறது.
- source_word: וֶחְיֵה
  choice: நீ உயிர்வாழ்வாய்
  rationale: வடிவத்தில் கட்டளை அல்லது விருப்பநிலை நிழல் இருந்தாலும், சூழலில் ஆபிரகாமின் வேண்டுதலால் ஏற்படும் விளைவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְאִם אֵינְךָ מֵשִׁיב
  choice: ஆனால் நீ அவளைத் திருப்பி அனுப்பாவிட்டால்
  rationale: எதிர்மறை பங்கேற்பு வடிவத்தை இயல்பான நிபந்தனை வாக்கியமாக்குகிறது; விடுபட்ட செயப்படுபொருள் சூழலிலிருந்து ‘அவளை’ என வெளிப்படுத்தப்பட்டது.
- source_word: דַּע
  choice: அறிந்துகொள்
  rationale: வரவிருக்கும் கடுமையான எச்சரிக்கையை அறிமுகப்படுத்தும் நேரடிக் கட்டளையின் வலிமையைப் பேணுகிறது.
- source_word: מוֹת תָּמוּת
  choice: நீ நிச்சயமாகச் சாவாய்
  rationale: முற்றுப்பெறா பெயரெச்சமும் வினையும் சேர்ந்த எபிரெயத் தீவிரப்படுத்தலை ‘நிச்சயமாக’ எனத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אַתָּה וְכָל אֲשֶׁר לָךְ
  choice: நீயும் உனக்குரிய அனைவரும்
  rationale: அபிமெலேக்கையும் அவனுடைய வீட்டாரையும் உள்ளடக்கும் அச்சுறுத்தலை முன்னிறுத்துகிறது; எபிரெயச் சொற்றொடரின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ‘நீயும் உனக்குரிய அனைத்தும்/அனைவரும்’ என்ற அச்சுறுத்தலின் வரம்பு
  choice: நீயும் உனக்குரிய அனைவரும்
  alternative: நீயும் உனக்குரிய அனைத்தும் / நீயும் உனக்கு உள்ளவையெல்லாம்
  rationale: உடனடிச் சூழலில் அபிமெலேக்கின் வீட்டார் முழுவதையும் பாதித்த தண்டனை பேசப்படுவதால், ஆட்களை உள்ளடக்கும் வாசகம் முதன்மைப்படுத்தப்பட்டது. ஆயினும், אֲשֶׁר לָךְ உடைமைகளையும் உள்ளடக்கக்கூடிய பரந்த சொற்றொடர் என்பதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் வைக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் சாதாரண வாசகருக்கும் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வசனத்தின் கட்டளை, காரணம், வேண்டுதல், உயிர்வாழ்வு, கடுமையான எச்சரிக்கை என்ற தொடரமைப்பு பேணப்பட்டது.
