  language: ta
  text: அபிமெலேக்கு, “இதோ, என் நாடு உன் முன்னால் இருக்கிறது; உன் பார்வைக்கு நல்லதாகத் தோன்றும் இடத்தில் குடியிரு” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரேயச் சொல்லின் இயல்பான, கண்ணியமான தமிழ் இணை.
- source_word: אַרְצִי
  choice: என் நாடு
  rationale: אֶרֶץ இங்கு அபிமெலேக்கின் ஆட்சிக்குட்பட்ட நிலப்பரப்பைக் குறிக்கிறது; ‘நாடு’ சூழலுக்கு ஏற்றது.
- source_word: לְפָנֶיךָ
  choice: உன் முன்னால் இருக்கிறது
  rationale: கிடைக்கும் நிலம் ஆபிரகாமின் தேர்வுக்கு திறந்துள்ளது என்ற உருவகத்தைத் தக்கவைக்கிறது.
- source_word: בַּטּוֹב בְּעֵינֶיךָ
  choice: உன் பார்வைக்கு நல்லதாகத் தோன்றும் இடத்தில்
  rationale: ‘உன் கண்களில் நல்லது’ என்ற எபிரேய மொழிநடையின் கருத்தையும் அதன் பார்வை சார்ந்த தன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: שֵׁב
  choice: குடியிரு
  rationale: יָשַׁב என்பதன் இச்சூழலிலான பொருள் தற்காலிகமாக அமர்வது அல்ல, ஓர் இடத்தில் தங்கி வாழ்வது.
