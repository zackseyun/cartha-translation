  text: וַ/יֹּ֧אמֶר אַבְרָהָ֛ם אֶל שָׂרָ֥ה אִשְׁתּ֖/וֹ אֲחֹ֣תִ/י הִ֑וא וַ/יִּשְׁלַ֗ח אֲבִימֶ֨לֶךְ֙ מֶ֣לֶךְ גְּרָ֔ר וַ/יִּקַּ֖ח אֶת שָׂרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/002.yaml
  text: And Abraham said of Sarah his wife[b][a], “She is my sister.” So Abimelech king of Gerar sent and took Sarah.
translation:
  language: ta
  text: ஆபிரகாம் தன் மனைவி சாராளைக் குறித்து[a], “இவள் என் சகோதரி” என்று சொன்னான். அப்போது கேராரின் அரசன் அபிமெலேக்கு அனுப்பி, சாராளை எடுத்துக்கொண்டான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் மனைவி சாராளிடம்.” எபிரெய முன்னிடைச்சொல்லை இன்னும் நேரடியாக இவ்வாறும் மொழிபெயர்க்கலாம். ஆனால் “இவள் என் சகோதரி” என்ற கூற்று, ஆபிரகாம் சாராளைக் குறித்துப் பேசியதாக இச்சூழலில் உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அபிமெலேக்கு சாராளைத் தன்னிடம் கொண்டுவர ஆட்களை அனுப்பினான் என்பதே சூழலிலிருந்து தெரிகிறது. எபிரெய மூலம் சுருக்கமாக, “அனுப்பி, சாராளை எடுத்துக்கொண்டான்” என்று கூறுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: சொன்னான்
  rationale: אמר என்பதன் வழக்கமான கதைநடைப் பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: אֶל שָׂרָה אִשְׁתּוֹ
  choice: தன் மனைவி சாராளைக் குறித்து
  rationale: אֶל பொதுவாக ‘இடம்/நோக்கி’ எனப் பொருள்படலாம்; ஆனால் தொடர்ந்து வரும் ‘இவள் என் சகோதரி’ என்ற கூற்று, சாராளிடம் நேரடியாகப் பேசியதைவிட அவளைக் குறித்துச் சொன்னதாக இச்சூழலில் உணர்த்துகிறது. மூலத்தின் மாற்றுவாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲחֹתִי הִוא
  choice: இவள் என் சகோதரி
  rationale: வினைச்சொல் இல்லாத எபிரெயக் கூற்றையும் ‘சகோதரி’ என்பதிலுள்ள முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டையும் நேராகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיִּשְׁלַח
  choice: ஆள் அனுப்பி
  rationale: שלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்பு.’ அனுப்பப்பட்டவர் மூலத்தில் வெளிப்படையாகக் குறிப்பிடப்படவில்லை; தமிழில் செயலை இயல்பாக இணைக்க ‘ஆள் அனுப்பி’ என வழங்கப்பட்டுள்ளது.
- source_word: מֶלֶךְ גְּרָר
  choice: கேரார் அரசன்
  rationale: அபிமெலேக்கின் அரசப் பொறுப்பையும் ஆட்சிப் பகுதியையும் குறிக்கும் எபிரெயக் கட்டிணைப்பைச் சுருக்கமாகத் தருகிறது.
- source_word: וַיִּקַּח אֶת שָׂרָה
  choice: சாராளை அழைத்துக்கொண்டான்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்.’ இச்சூழலில் சாராளை அபிமெலேக்கு தன்னிடம் கொண்டுவரச் செய்ததைக் குறிக்கிறது. ‘மனைவியாக எடுத்துக்கொண்டான்’ என்று மூலத்தைவிட அதிகமாக விளக்காமல் தமிழில் இயல்பாகத் தர ‘அழைத்துக்கொண்டான்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: அபிமெலேக்கு சாராளை எடுத்துக்கொண்ட செயலின் நோக்கம்
  choice: சாராளை அழைத்துக்கொண்டான்
  alternative: சாராளை மனைவியாக எடுத்துக்கொண்டான்
  rationale: பின்வரும் கதைச்சூழல் அபிமெலேக்கின் நோக்கத்தை விளக்கினாலும், இவ்வசனம் ‘மனைவியாக’ என்று வெளிப்படையாகச் சொல்லவில்லை. ஆகவே மூலத்தில் உள்ள கட்டுப்பாடும் கதைநடைத் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆபிரகாம்,’ ‘சாராள்,’ ‘அபிமெலேக்கு,’ ‘கேரார்’ ஆகிய பரவலாக அறியப்பட்ட தமிழ் வேதாகமப் பெயர்வடிவங்கள் காக்கப்பட்டுள்ளன. ‘குறித்து/இடம்’ என்ற மூலமொழி இருபொருள் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
