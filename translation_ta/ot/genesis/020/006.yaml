  text: וַ/יֹּאמֶר֩ אֵלָ֨י/ו הָֽ/אֱלֹהִ֜ים בַּ/חֲלֹ֗ם גַּ֣ם אָנֹכִ֤י יָדַ֨עְתִּי֙ כִּ֤י בְ/תָם לְבָבְ/ךָ֙ עָשִׂ֣יתָ זֹּ֔את וָ/אֶחְשֹׂ֧ךְ גַּם אָנֹכִ֛י אֽוֹתְ/ךָ֖ מֵ/חֲטוֹ לִ֑/י עַל כֵּ֥ן לֹא נְתַתִּ֖י/ךָ לִ/נְגֹּ֥עַ אֵלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/006.yaml
  text: Then God said to him in the dream[a], “Yes, I know that you did this in the integrity of your heart, and I also kept you from sinning against me[b]. Therefore I did not let you touch her.”
translation:
  language: ta
  text: அப்போது கடவுள் அந்தக் கனவில்[a] அவனிடம், “ஆம், உன் உள்ளத்தின் நேர்மையோடு நீ இதைச் செய்தாய் என்று நானும் அறிவேன். எனக்கு விரோதமாக நீ பாவம் செய்யாதபடி நானும் உன்னைத் தடுத்து வைத்தேன். அதனால்தான் அவளைத் தொட[b] நான் உன்னை அனுமதிக்கவில்லை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு கனவில்.” எபிரெயச் சொற்றொடரை வரையறையற்றதாகவும் புரிந்துகொள்ளலாம்; எனினும் இச்சூழலில் உள்ள வரையறைச் சுட்டு, குறிப்பிட்ட அந்தக் கனவைக் குறிக்கும் வாசிப்பை ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “அவளைத் தொட” என்பது பாலுறவைக் குறிக்கும் அடக்கமான மூடுமொழி.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלֹם
  choice: அந்தக் கனவில்
  rationale: எபிரெய முன்னொட்டிலுள்ள வரையறைச் சுட்டு, ஏற்கெனவே நடந்துகொண்டிருக்கும் குறிப்பிட்ட கனவைக் குறிக்கிறது. தமிழில் ‘அந்தக் கனவில்’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: גַּם אָנֹכִי
  choice: ஆம் ... நானும் / நானும்
  rationale: இருமுறை வரும் இந்தச் சொற்றொடரின் வலியுறுத்தலை, முதல் இடத்தில் இயல்பான ஒப்புதலாகவும் இரண்டாம் இடத்தில் மீளும் ‘நானும்’ என்பதாலும் காக்கிறது.
- source_word: בְתָם לְבָבְךָ
  choice: உன் உள்ளத்தின் நேர்மையோடு
  rationale: תֹּם என்பதன் முழுமை, நேர்மை, உத்தமம் ஆகிய பொருள் வட்டத்தில் ‘நேர்மை’ இங்கு பொருந்துகிறது; சட்டரீதியான முழுக் குற்றமின்மையை மிகைப்படுத்துவதில்லை.
- source_word: וָאֶחְשֹׂךְ ... אוֹתְךָ
  choice: உன்னைத் தடுத்து வைத்தேன்
  rationale: חָשַׂךְ இங்கு ஒருவரை ஒரு செயலில் ஈடுபடாமல் தடுத்தல் என்ற பொருளைத் தருகிறது.
- source_word: מֵחֲטוֹא לִי
  choice: எனக்கு விரோதமாக நீ பாவம் செய்யாதபடி
  rationale: מן உடனான வினையெச்ச அமைப்பு செயலைத் தடுப்பதைக் குறிக்கிறது; לִי அந்தப் பாவம் கடவுளுக்கு விரோதமானது என்பதை வெளிப்படுத்துகிறது.
- source_word: עַל כֵּן
  choice: அதனால்தான்
  rationale: முந்தைய இறைத் தடுப்பின் விளைவாக அடுத்த கூற்று வருவதைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: לֹא נְתַתִּיךָ
  choice: நான் உன்னை அனுமதிக்கவில்லை
  rationale: נָתַן உடன் வரும் வினையெச்சம் இங்கு ‘செய்ய விடுதல்/அனுமதித்தல்’ என்ற மரபுத்தொடர்ப் பொருளில் உள்ளது.
- source_word: לִנְגֹּעַ אֵלֶיהָ
  choice: அவளைத் தொட
  rationale: நேரடியான ‘தொடுதல்’ என்ற சொல்லைத் தக்கவைத்து, பாலுறவைக் குறிக்கும் மூடுமொழியின் கட்டுப்பாட்டையும் கண்ணியத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘எனக்கு விரோதமாகப் பாவம் செய்தல்’ என்ற இறை உரையின் பொருள்
  choice: நிகழவிருந்த செயல் கடவுளுக்கு விரோதமான பாவம் என்று உரை கூறுவதை நேரடியாகத் தக்கவைத்தல்
  alternative: அது பொதுவாகக் கடவுளை வருத்துதல் அல்லது அவர்முன் குற்றவாளியாகுதல் என்று விரித்துரைத்தல்
  rationale: לִי கடவுளையே பாவத்துக்கு எதிரானவராகச் சுட்டுகிறது. சாராள் அல்லது ஆபிரகாமுக்கு எதிரான மனிதத் தவறை உரை மறுப்பதில்லை; ஆனால் இவ்வசனம் வெளிப்படையாகக் கூறும் இறையியல் பரிமாணத்தைச் சுருக்காமலும் மேலதிகக் கோட்பாட்டைச் சேர்க்காமலும் மொழிபெயர்க்கிறது.
- issue: அபிமெலேக்கின் உள்ள நேர்மையும் கடவுளின் தடுப்பும் இடையிலான உறவு
  choice: அவன் நேர்மையான நோக்கத்தோடு செயல்பட்டதையும் கடவுள் அவனைப் பாவத்திலிருந்து தடுத்ததையும் இரண்டையும் இணையாகத் தக்கவைத்தல்
  alternative: அவனுடைய நேர்மை மட்டுமே அவனைப் பாவத்திலிருந்து காத்தது அல்லது இறைத் தடுப்பு அவனுடைய பொறுப்பை முற்றிலும் நீக்கியது என்று விளக்குதல்
  rationale: எபிரெய உரை மனித நோக்கத்தையும் இறைத் தலையீட்டையும் அருகருகே வைக்கிறது; அவற்றுக்கிடையிலான இறையியல் நெருக்கடியைத் தீர்த்து வைக்காமல் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நேரடி உரை பயன்படுத்தப்பட்டுள்ளது. ‘உள்ளம்,’ ‘நேர்மை,’ ‘பாவம்,’ ‘விரோதமாக’ போன்ற பொதுவாகப் புரியும் சொற்கள் மூலத்தின் ஒழுக்க மற்றும் இறையியல் எடையைத் தக்கவைக்கின்றன; பாலுறவுக் குறிப்பில் மூலத்தின் அடக்கமான மொழிநடை பாதுகாக்கப்பட்டுள்ளது.
