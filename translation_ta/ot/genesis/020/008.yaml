  text: וַ/יַּשְׁכֵּ֨ם אֲבִימֶ֜לֶךְ בַּ/בֹּ֗קֶר וַ/יִּקְרָא֙ לְ/כָל עֲבָדָ֔י/ו וַ/יְדַבֵּ֛ר אֶת כָּל הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בְּ/אָזְנֵי/הֶ֑ם וַ/יִּֽירְא֥וּ הָ/אֲנָשִׁ֖ים מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/008.yaml
  text: So Abimelech rose early in the morning and called all his servants and spoke all these things in their hearing[b][a], and the men were very afraid.
translation:
  language: ta
  text: அபிமெலேக்கு அதிகாலையில் எழுந்து, தன் பணியாளர்கள் அனைவரையும் அழைத்து, இவை அனைத்தையும் அவர்கள் கேட்கும்படி சொன்னான். அந்த மனிதர்கள் மிகவும் பயந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: அதிகாலையில் எழுந்து
  rationale: שׁכם என்பதன் ஹிப்ஃபில் வடிவம் அதிகாலையில் எழுவதைக் குறிக்கிறது; בַּבֹּקֶר உடன் சேர்ந்துள்ள காலக் குறிப்பை இயல்பான நவீன தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: וַיִּקְרָא לְכָל עֲבָדָיו
  choice: தன் பணியாளர்கள் அனைவரையும் அழைத்து
  rationale: קרא ל־ இங்கு அழைத்தல் அல்லது வரவழைத்தல் என்ற பொருளுடையது. עֲבָדָיו அரசவையையோ வீட்டையையோ சேர்ந்த சேவகர்களைக் குறிப்பதால், அடிமைத்தன்மையைத் தேவையின்றி வலியுறுத்தாத ‘பணியாளர்கள்’ சூழலுக்கு ஏற்றது.
- source_word: וַיְדַבֵּר אֶת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: இவை அனைத்தையும் ... சொன்னான்
  rationale: இங்கு דְּבָרִים என்பது கூறப்பட்ட விஷயங்களைக் குறிக்கிறது. தமிழில் ‘இவை அனைத்தையும் சொன்னான்’ என்பது மூலத்தின் உள்ளடக்கத்தையும் இயல்பான நடையையும் காக்கிறது.
- source_word: בְּאָזְנֵיהֶם
  choice: அவர்கள் கேட்கும்படி
  rationale: சொல்லுக்குச் சொல் ‘அவர்களுடைய காதுகளில்’ என்ற எபிரெய மொழிப்பயன்பாடு, அவர்கள் நேரடியாகக் கேட்குமாறு கூறியதை உணர்த்துகிறது; தமிழில் ‘அவர்கள் கேட்கும்படி’ இயல்பான இணை.
- source_word: וַיִּירְאוּ ... מְאֹד
  choice: மிகவும் பயந்தார்கள்
  rationale: இந்தச் சூழலில் ירא பயபக்தியை அல்ல, அச்சத்தைச் சுட்டுகிறது; מְאֹד அதன் தீவிரத்தை வலுப்படுத்துகிறது.
- source_word: הָאֲנָשִׁים
  choice: அந்த மனிதர்கள்
  rationale: மூலம் ஆண்பால் பன்மையை வெளிப்படையாகக் குறிப்பிடுகிறது. முன்னர் கூறப்பட்ட அபிமெலேக்கின் ஆண் பணியாளர்களைச் சுட்டும் வகையில் ‘அந்த மனிதர்கள்’ பாலினத் தகவலைத் தக்கவைக்கிறது.
