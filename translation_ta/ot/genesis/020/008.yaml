  source_fidelity: 'எபிரெய மூலத்தின் நிகழ்வுவரிசை முழுமையாகத் தக்கவைக்கப்பட்டுள்ளது: அபிமெலேக்கு அதிகாலையில் எழுந்தான்; தன் பணியாளர்கள் அனைவரையும் அழைத்தான்; எல்லாக் காரியங்களையும் அவர்கள் கேட்கும்படி கூறினான்; அந்த மனிதர்கள் மிகவும் பயந்தார்கள். וַיַּשְׁכֵּם ... בַּבֹּקֶר என்பதன் கால வலியுறுத்தலை ‘அதிகாலையில் எழுந்து’ இயல்பாக வெளிப்படுத்துகிறது. בְּאָזְנֵיהֶם என்பதற்கான ‘அவர்கள் கேட்கும்படி’ பொருளுக்கு உண்மையான, தமிழில் இயல்பான இணையாக உள்ளது.'
