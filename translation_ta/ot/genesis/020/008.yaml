translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைப்புச் சொற்களின் தொடரை தமிழுக்கேற்ற வினையெச்சத் தொடராக மாற்றியுள்ளோம்; இறுதி வாக்கியம் அச்சத்தின் விளைவைக் கவனப்படுத்த தனியே வைக்கப்பட்டுள்ளது.
