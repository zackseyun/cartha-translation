  text: וּ/לְ/שָׂרָ֣ה אָמַ֗ר הִנֵּ֨ה נָתַ֜תִּי אֶ֤לֶף כֶּ֨סֶף֙ לְ/אָחִ֔י/ךְ הִנֵּ֤ה הוּא לָ/ךְ֙ כְּס֣וּת עֵינַ֔יִם לְ/כֹ֖ל אֲשֶׁ֣ר אִתָּ֑/ךְ וְ/אֵ֥ת כֹּ֖ל וְ/נֹכָֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/016.yaml
  text: And to Sarah he said[a], “Look, I have given a thousand pieces of silver to your brother. Look, it is for you a covering of the eyes to all who are with you[b], and before everyone you are vindicated.”
translation:
  language: ta
  text: சாராளிடம் அவன், “இதோ, உன் சகோதரனுக்கு ஆயிரம் வெள்ளித் துண்டுகளைக் கொடுத்திருக்கிறேன். இதோ, உன்னுடன் இருப்போர் அனைவருக்கும் அது உனக்குக் கண்களுக்கு ஒரு மறைப்பாக இருக்கிறது[a]; எல்லாருக்கும் முன்பாக நீ குற்றமற்றவள் என்று நிலைநாட்டப்பட்டாய்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கண்களை மூடும் மறைப்பாக.’ இது நிகழ்ந்த அவமதிப்பை மூடி, சாராளின் கண்ணியத்தைப் பொதுவெளியில் மீட்டுத் தரும் இழப்பீட்டைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நீ குற்றமற்றவள் எனத் தெளிவாக்கப்பட்டாய்,’ ‘நீ கண்டிக்கப்பட்டாய்,’ அல்லது ‘எல்லாருக்கும் முன்பாக விவகாரம் தீர்க்கப்பட்டது.’ இறுதி எபிரெயக் கூறு பொருள் காண்பதற்குக் கடினமானது.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶלֶף כֶּסֶף
  choice: ஆயிரம் வெள்ளித் துண்டுகள்
  rationale: எபிரெய உரை சொல்லுக்கு சொல் ‘ஆயிரம் வெள்ளி’ என்கிறது; அளவையோ நாணய வகையையோ குறிப்பிடவில்லை. ஆகவே ‘சேக்கல்’ அல்லது குறிப்பிட்ட நாணயம் என்பதைச் சேர்க்காமல், வெள்ளியால் செய்யப்பட்ட பணத் துண்டுகள் என்ற இயல்பான பொதுவான சொல்லாக்கம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְאָחִיךְ
  choice: உன் சகோதரனிடம்
  rationale: ஆபிரகாமைச் சாராள் தன் சகோதரன் என்று கூறிய கதைத்தொடர்பையும் அபிமெலேக்கின் சொல்லிலுள்ள மறைமுகக் குத்தலையும் காக்க, ‘உறவினன்’ என்று பொதுமைப்படுத்தாமல் ‘சகோதரன்’ தக்கவைக்கப்பட்டது.
- source_word: כְּסוּת עֵינַיִם
  choice: கண்களை மறைக்கும் ஒன்று
  rationale: இந்த அரிதான சொற்றொடரின் உருவகத்தைத் தக்கவைத்து, அதை ஒரே விளக்கமாகச் சுருக்காமல் மொழிபெயர்க்கிறது. சூழலில் இது அவமதிப்பை மூடி சாராளின் மதிப்பை வெளிப்படையாக மீட்டுத் தரும் இழப்பீட்டைக் குறிக்கலாம்.
- source_word: לְכֹל אֲשֶׁר אִתָּךְ
  choice: உன்னுடன் இருக்கும் அனைவருக்கும் முன்பாக
  rationale: לְ என்ற முன்னிடைச்சொல்லின் தொடர்பையும், இச்செயல் சாராளுடன் இருந்தவர்களின் பார்வையில் செய்யப்பட்ட பொது நிவர்த்தி என்ற சமூகப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְאֵת כֹּל
  choice: எல்லாருக்கும் முன்பாக
  rationale: சுருக்கமானதும் இலக்கண ரீதியாகக் கடினமானதுமான இத்தொடர், சாராளுடன் இருப்பவர்களிலிருந்து அனைவருக்கும் எனப் பொது வெளிக்கான எல்லையை விரிவாக்குவதாக எடுத்துக்கொள்ளப்பட்டது.
- source_word: וְנֹכָחַת
  choice: நீ குற்றமற்றவள் என்று நிலைநாட்டப்பட்டாய்
  rationale: יכח வேரின் நிபால் வடிவம் இங்கு பொதுவெளியில் நியாயம் பெற்றல் அல்லது குற்றமற்றவர் எனக் காட்டப்படுதல் என்ற பொருளில் எடுத்துக்கொள்ளப்பட்டது. எனினும் ‘கண்டிக்கப்பட்டாய்’ அல்லது ‘விவகாரம் தீர்க்கப்பட்டது’ என்ற புரிதல்களும் சாத்தியமாதலால் அவை அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: இறுதிக் கூறு சாராளை நியாயப்படுத்துகிறதா அல்லது கண்டிக்கிறதா என்பது
  choice: சாராள் குற்றமற்றவள் என்று பொதுவெளியில் நிலைநாட்டப்பட்டாள்
  alternative: சாராள் கண்டிக்கப்பட்டாள்; அல்லது விவகாரம் எல்லாருக்கும் முன்பாகத் தீர்க்கப்பட்டது
  rationale: அபிமெலேக்கு இழப்பீடு வழங்கி சாராளின் கண்ணியத்தைப் பொதுவாக மீட்டுக் கொடுக்கும் உடனடிச் சூழல் ‘நிலைநாட்டப்பட்டாய்’ என்பதற்கு ஆதரவளிக்கிறது. ஆனால் எபிரெய இறுதிக் கூறின் உண்மையான மொழியியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற இருமுறை வரும் சுட்டுச்சொல், ‘சகோதரன்’ என்ற கதைத்தொடர்பு, மற்றும் ‘கண்களை மறைக்கும்’ என்ற தெளிவற்ற உருவகம் ஆகியவை மூலத்தின் சொல்லாட்சிக்கும் பதற்றத்திற்கும் ஏற்பத் தக்கவைக்கப்பட்டுள்ளன.
