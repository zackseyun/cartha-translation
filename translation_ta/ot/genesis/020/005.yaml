base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/005.yaml
  text: Did he not himself say to me[a], ‘She is my sister’? And she herself also said, ‘He is my brother.’ In the integrity of my heart and the innocence of my hands I have done this.
translation:
  language: ta
  text: “அவரே என்னிடம், ‘அவள் என் சகோதரி’ என்று சொல்லவில்லையா? அவளும்கூட, ‘அவர் என் சகோதரர்’ என்று சொன்னாள். என் உள்ளத்தின் நேர்மையோடும் என் கைகளின் குற்றமின்மையோடும்[a] இதைச் செய்தேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குற்றமற்ற உள்ளத்தோடும் சுத்தமான கைகளோடும்.” எபிரெய மொழியில் இவை நேர்மையையும் குற்றமின்மையையும் குறிக்கும் அறநெறி-சட்ட மொழிவழக்குகள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הוּא אָמַר לִי
  choice: அவரே என்னிடம் ... என்று சொல்லவில்லையா?
  rationale: הֲלֹא என்பது ஒப்புதலை எதிர்பார்க்கும் மறுப்பு வினா; தனியாக வரும் הוּא அளிக்கும் வலியுறுத்தலை ‘அவரே’ காட்டுகிறது.
- source_word: אֲחֹתִי הִוא
  choice: அவள் என் சகோதரி
  rationale: எபிரெய உறவுமுறை வாக்கியத்தை இயல்பான நவீனத் தமிழில் நேரடியாக வழங்குகிறது.
- source_word: וְהִיא גַם הִוא אָמְרָה
  choice: அவளும் ... என்று சொன்னாளே
  rationale: גם மற்றும் தனிப்பட்ட சுட்டுப்பெயர் தரும் சேர்த்தல் மற்றும் வலியுறுத்தலை ‘அவளும்’ என்பதும், முன் கூற்றை உறுதிப்படுத்தும் ‘-ஆளே’ என்பதும் இயல்பாகத் தாங்குகின்றன.
- source_word: אָחִי הוּא
  choice: அவர் என் சகோதரர்
  rationale: உறவுக் கூற்றை நேரடியாக மொழிபெயர்க்கிறது; மரியாதையான மூன்றாம் நபர் வடிவம் தமிழ் உரைநடைக்கு ஏற்றது.
- source_word: בְּתָם לְבָבִי
  choice: என் உள்ளத்தின் நேர்மையோடும்
  rationale: תָם இங்கு முழுமையான பாவமின்மையை அல்ல, இந்தச் செயலுக்குரிய உள்நோக்கத்தின் நேர்மையைச் சுட்டும் அறநெறி-சட்ட மொழிவழக்கு.
- source_word: וּבְנִקְיֹן כַּפַּי
  choice: என் கைகளின் குற்றமின்மையோடும்
  rationale: கைகள் செயல்களையும் பொறுப்பையும் குறிக்கும் எபிரெய உருவகத்தைப் பாதுகாத்து, נִקְיֹן என்பதன் குற்றமின்மை உணர்வைத் தெளிவாக்குகிறது.
- source_word: עָשִׂיתִי זֹאת
  choice: இதைச் செய்தேன்
  rationale: எபிரெய நிறைவேற்றப்பட்ட வினையை இயல்பான தமிழ் இறந்தகாலத்தில் வழங்குகிறது.
theological_decisions:
- issue: அபிமெலேக்கின் அறநெறி-சட்டத் தற்காப்புக் கூற்று
  choice: ‘என் உள்ளத்தின் நேர்மையோடும் என் கைகளின் குற்றமின்மையோடும்’ என்று மொழிபெயர்த்து, கூற்றை இந்தச் சம்பவத்துடன் தொடர்புடையதாக வைத்தல்
  alternative: ‘குற்றமற்ற உள்ளத்தோடும் சுத்தமான கைகளோடும்’ என்று சொற்சார்பாக மொழிபெயர்த்தல்
  rationale: இந்த வசனம் அபிமெலேக்கின் முழுமையான பாவமின்மையைப் போதிப்பதில்லை; இச்செயலில் தனது நேர்மையான உள்நோக்கத்தையும் அறியாமையால் ஏற்பட்ட குற்றமின்மையையும் அவர் வாதிடுகிறார். மூலத்தின் உருவகத்தையும் இறையியல் பதற்றத்தையும் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நேரடி உரை. ‘அவரே/அவளும்’ மூலத்தின் வலியுறுத்தலைக் காக்கின்றன; ‘உள்ளம்’ மற்றும் ‘கைகள்’ என்ற எபிரெய உருவகங்களும் பாதுகாக்கப்பட்டுள்ளன.
