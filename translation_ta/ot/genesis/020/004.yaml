  text: וַ/אֲבִימֶ֕לֶךְ לֹ֥א קָרַ֖ב אֵלֶ֑י/הָ וַ/יֹּאמַ֕ר אֲדֹנָ֕/י הֲ/ג֥וֹי גַּם צַדִּ֖יק תַּהֲרֹֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/004.yaml
  text: Abimelech had not come near her[a], so he said, “Lord[b], will you kill even a righteous nation?”
translation:
  language: ta
  text: அபிமெலேக்கு அவளை நெருங்கியிருக்கவில்லை[a]. ஆகவே அவன், “ஆண்டவரே, நீதியுள்ள ஒரு மக்களினத்தைக்கூட நீர் கொன்றுவிடுவீரா?[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவளை நெருங்குதல்’ என்பது இங்கு அபிமெலேக்கு சாராளுடன் பாலுறவு கொள்ளவில்லை என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: ‘மக்களினம்’ என்பதற்கான எபிரெயச் சொல் ஒரு மக்கள் கூட்டத்தையோ நாட்டினத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַב אֵלֶיהָ
  choice: அவளை நெருங்கியிருக்கவில்லை
  rationale: எபிரெயச் சொற்றொடரின் ‘அவளை நெருங்குதல்’ என்ற உருவகத்தைத் தக்கவைக்கிறது; இச்சூழலில் அது சாராளுடன் பாலுறவு கொள்ளாததைக் குறிக்கிறது. அதன் குறிப்பான பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: கனவில் கடவுளை நேரடியாக அழைக்கும் மரியாதைக்குரிய இயல்பான தமிழ் வடிவம்; மூலத்தில் இல்லாத ‘தேவன்’ போன்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: גּוֹי
  choice: மக்களினம்
  rationale: ஒரு மக்கள் கூட்டத்தையோ நாட்டினத்தையோ குறிக்கும் ஒருமைக் கூட்டுப்பெயரின் பொருளைத் தக்கவைக்கிறது. ‘நாடு’ என்பது நிலப்பரப்பு அல்லது அரசைக் குறிப்பதாகத் தவறாகப் புரியக்கூடும் என்பதால் ‘மக்களினம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: גַּם
  choice: கூட
  rationale: 'வினாவிலுள்ள வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது: ‘நீதியுள்ள ஒரு மக்களினத்தைக்கூட’.'
- source_word: צַדִּיק
  choice: நீதியுள்ள
  rationale: நீதிமை அல்லது இவ்விவகாரத்தில் குற்றமின்மை ஆகிய இரு பொருள் நிழல்களையும் முற்றிலும் ஒன்றாகச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: תַּהֲרֹג
  choice: நீர் கொன்றுவிடுவீரா?
  rationale: நேரடியான வினாவையும் அதன் தீவிரத்தையும் நவீன மரியாதைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַאֲבִימֶלֶךְ ... וַיֹּאמַר
  choice: அபிமெலேக்கு ... ஆகவே அவன் ... என்றான்
  rationale: நிகழ்வுகளின் தொடரையும், அவன் அவளை நெருங்காதிருந்ததற்கும் அவனுடைய முறையீட்டிற்கும் இடையிலான சூழல்சார் தொடர்பையும் வாசிக்க எளிதான தமிழில் அளிக்கிறது; மூலத்தில் இல்லாத ‘இப்போது’ என்பதைச் சேர்க்கவில்லை.
theological_decisions:
- issue: அபிமெலேக்கின் முறையீட்டில் גּוֹי என்பதன் கூட்டுச் சார்ந்த வரம்பு
  choice: ‘மக்களினம்’ என்று மொழிபெயர்த்து, அபிமெலேக்கை மட்டும் அல்லாமல் ஒரு மக்கள் கூட்டத்தைக் குறிக்கும் பொருளைப் பாதுகாத்தல்
  alternative: ‘நாடு’ அல்லது ‘மக்கள்’
  rationale: எபிரெயச் சொல் ஒருமை வடிவிலுள்ள கூட்டுப்பெயர். அது துல்லியமாக எந்த அரசியல் அல்லது குடும்ப எல்லையைக் குறிக்கிறது என்பதை வசனம் நிர்ணயிக்காததால், அதை ‘வீட்டார்’ எனக் குறுக்காமல் கூட்டுப் பொருளைத் தக்கவைக்கிறது.
- issue: צַדִּיק என்பதில் நீதிமை மற்றும் குற்றமின்மை இடையிலான பொருள் நெருக்கம்
  choice: ‘நீதியுள்ள’
  alternative: ‘குற்றமற்ற’
  rationale: ‘குற்றமற்ற’ என்பது உடனடிச் சூழலுக்குப் பொருந்தினாலும், மூலச்சொல்லின் விரிவான நீதிமைப் பொருளைச் சுருக்கும். ‘நீதியுள்ள’ என்பது அபிமெலேக்கின் கூற்றிலுள்ள இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய உரையில் மரியாதைப் பன்மை (‘நீர்’) கையாளப்பட்டுள்ளது. மூலத்தின் மரபுத்தொடர் முதன்மை உரையில் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது; எல்லா அடிக்குறி குறியீடுகளும் உரையில் பொருத்தமான இடங்களில் இடம்பெற்றுள்ளன.
