  text: וַ/יָּשָׁב֩ בַּ/יּ֨וֹם הַ/ה֥וּא עֵשָׂ֛ו לְ/דַרְכּ֖/וֹ שֵׂעִֽירָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/016.yaml
  text: So Esau returned that day on his way to Seir[a].
translation:
  language: ta
  text: அன்றே ஏசா சேயீரை நோக்கித் தன் வழியில் திரும்பிச் சென்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பிச் சென்றான்
  rationale: שׁוב என்பது முந்தைய பயணப் பாதைக்குத் திரும்பிச் செல்வதைக் குறிக்கிறது. தமிழில் ‘திரும்பிச் சென்றான்’ என்பது நிறைவுற்ற நிகழ்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்றே
  rationale: சொல்லடிப்படையில் ‘அந்த நாளில்’ என்று பொருள். இச்சூழலில் ‘அன்றே’ என்பது காலக் குறிப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; ஏசா அதே நாளில் புறப்பட்டான் என்ற தொடர்ச்சியையும் உணர்த்துகிறது.
- source_word: עֵשָׂו
  choice: ஏசா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: לְדַרְכּוֹ
  choice: தன் வழியில்
  rationale: சொல்லடிப்படையில் ‘அவனுடைய வழிக்குத்’ என்று வரும். பயணத்தை மீண்டும் தொடரும் சூழலில் ‘தன் வழியில்’ என்பது இயல்பான தமிழ் நடையாகும்.
- source_word: שֵׂעִירָה
  choice: சேயீரை நோக்கி
  rationale: இடப்பெயருடன் இணைந்துள்ள திசைகாட்டும் ־ה, சேயீரை நோக்கிய இயக்கத்தைக் குறிக்கிறது. ‘சேயீரை நோக்கி’ என்பது இலக்கைத் தெளிவாகவும் மூல வடிவத்தின் திசைநுட்பத்தையும் காத்தும் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட வரலாற்று உரைநடை. மூல எபிரெய வாக்கியத்தின் காலக் குறிப்பு, பயணத் தொடர்ச்சி, இலக்கை நோக்கிய இயக்கம் ஆகியவை இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளன.
