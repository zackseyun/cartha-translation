base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/010.yaml
  text: Jacob said[a], “No, please. If I have found favor in your eyes, then take my gift from my hand, because seeing your face is like seeing the face of God[c][b], and you have received me favorably.”
translation:
  language: ta
  text: யாக்கோபு, “வேண்டாம், தயவுசெய்து. உமது பார்வையில் எனக்குத் தயவு கிடைத்திருக்குமானால், என் கையிலிருந்து என் அன்பளிப்பை[a] ஏற்றுக்கொள்ளுங்கள். ஏனெனில், கடவுளின் முகத்தைக் காண்பதுபோல் உமது முகத்தைக் கண்டேன்[b]; நீர் என்னை மனமுவந்து ஏற்றுக்கொண்டீர்[c]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் பரிசை’ அல்லது ‘என் காணிக்கையை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அன்பளிப்பு, திறை அல்லது காணிக்கை ஆகியவற்றைக் குறிக்கலாம்; இங்கு ஏசாவுடன் சமரசம் செய்துகொள்ள யாக்கோபு அளித்த அன்பளிப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஒரு தெய்வத்தின் முகத்தைக் காண்பதுபோல்’ என்றும் பொருள்கொள்ள வாய்ப்புண்டு. ஆனால் பெனியேலில் யாக்கோபு அண்மையில் கடவுளைச் சந்தித்த கதைச் சூழலால் (ஆதி 32:30), ‘கடவுள்’ என்பதே இங்கு பொருத்தமானது.
    reason: alternative_reading
  - marker: c
    text: ‘நீர் என்னை ஏற்றுக்கொண்டீர்’ அல்லது ‘என்மீது மகிழ்ச்சியாயிருந்தீர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை சாதகமான ஏற்றுக்கொள்ளுதலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵן
  choice: தயவு
  rationale: இச்சூழலில் இது யாக்கோபு ஏசாவின் நல்லெண்ணத்தையும் ஏற்றுக்கொள்ளுதலையும் பெற்றிருப்பதைக் குறிக்கிறது; இறையியல் சார்ந்த சிறப்புப் பொருளைத் தேவையின்றி ஏற்றாமல், உறவுசார் பொருளை இயல்பாகத் தருகிறது.
- source_word: בְּעֵינֶיךָ
  choice: உமது பார்வையில்
  rationale: எபிரெய மொழிவழக்கின் ‘உமது கண்களில்’ என்ற கருத்தை, நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் ‘உமது பார்வையில்’ என வழங்குகிறது.
- source_word: מִנְחָתִי
  choice: என் அன்பளிப்பை
  rationale: இங்கு யாக்கோபு சமரச நோக்குடன் ஏசாவுக்குக் கொடுக்க முனைந்த பொருளையே குறிக்கிறது. ‘காணிக்கை’ வழிபாட்டுச் சாயலை ஏற்படுத்தக்கூடும்; ‘அன்பளிப்பு’ இச்சூழலுக்கு ஏற்றது.
- source_word: מִיָּדִי
  choice: என் கையிலிருந்து
  rationale: நேரடியான கையளிப்பைக் காட்டும் மூலமொழிப் படிமத்தைத் தமிழிலும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: כִּי עַל־כֵּן
  choice: ஏனெனில்
  rationale: அன்பளிப்பை ஏற்றுக்கொள்ளுமாறு யாக்கோபு கூறுவதற்கான காரணத்தை அறிமுகப்படுத்தும் உரையாடல் செயல்பாட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: רָאִיתִי פָנֶיךָ כִּרְאֹת פְּנֵי אֱלֹהִים
  choice: கடவுளின் முகத்தைக் காண்பதுபோல் உமது முகத்தைக் கண்டேன்
  rationale: ‘முகத்தைக் காணுதல்’ என்ற மூலப் படிமத்தையும் இரண்டு கூறுகளுக்கிடையேயான ஒப்புமையையும் பாதுகாக்கிறது.
- source_word: וַתִּרְצֵנִי
  choice: நீர் என்னை மனமுவந்து ஏற்றுக்கொண்டீர்
  rationale: வெறும் ஏற்றுக்கொள்ளுதலைவிட, சாதகமான மனநிலையோடு வரவேற்று ஏற்றுக்கொண்டார் என்ற வினையின் உறவுசார் நுணுக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: אַל נָא אִם נָא
  choice: வேண்டாம், தயவுசெய்து. … இருக்குமானால்
  rationale: முந்தைய கூற்றை மரியாதையோடு மறுத்து, அதன்பின் தீவிரமான வேண்டுகோளை முன்வைக்கும் தொனியை நவீனத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: כִּרְאֹת פְּנֵי אֱלֹהִים என்பதில் אֱלֹהִים குறிக்கும் நபர்
  choice: கடவுள்
  alternative: ஒரு தெய்வம்
  rationale: אֱלֹהִים என்பதற்கு சில சூழல்களில் பரந்த பொருள் இருக்கலாம். எனினும், பெனியேலில் யாக்கோபு கடவுளை முகமுகமாகக் கண்டதாகக் கூறிய உடனடியான கதைச் சூழல் (ஆதி 32:30) இங்கு ‘கடவுள்’ என்பதையே வலுவாக ஆதரிக்கிறது. ஒப்புமையின் கூர்மையான இறையியல் பதற்றம் மென்மைப்படுத்தப்படவில்லை.
translation_notes:
  register: நவீன, தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஏசாவிடம் யாக்கோபு பேசுவதால் மரியாதை ஒருமை வடிவங்களான ‘உமது’, ‘நீர்’ பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் ‘முகம்’, ‘கை’ ஆகிய படிமங்கள் பாதுகாக்கப்பட்டுள்ளன; தமிழில் இயல்பில்லாத இடத்தில் ‘கண்களில்’ என்பதற்குப் பதிலாக வழக்கமான ‘பார்வையில்’ பயன்படுத்தப்பட்டுள்ளது.
