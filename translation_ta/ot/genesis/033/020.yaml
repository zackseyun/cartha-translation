base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/020.yaml
  text: There he set up an altar and called it El-Elohe-Israel[a][b].
translation:
  language: ta
  text: அங்கே அவர் ஒரு பலிபீடத்தை எழுப்பி, அதற்கு “ஏல்-எலோஹே-இஸ்ரவேல்”[a][b] என்று பெயரிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அங்கே அவர் ஒரு பலிபீடத்தை எழுப்பி, கடவுளை நோக்கி, ‘ஏல், இஸ்ரவேலின் தேவனே’ என்று அழைத்தார்”; அல்லது, “அதைப் பற்றி, ‘தேவன், இஸ்ரவேலின் தேவன்’ என்று அறிவித்தார்.” எபிரெயச் சொற்றொடரைப் பலிபீடத்திற்குப் பெயரிட்டதாகவும், கடவுளை அழைத்ததாகவும், அல்லது கடவுளைப் பற்றிய அறிவிப்பாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: “ஏல்-எலோஹே-இஸ்ரவேல்” என்பதன் பொருள் “தேவன், இஸ்ரவேலின் தேவன்” அல்லது “ஏல், இஸ்ரவேலின் தேவன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֶּב
  choice: எழுப்பி
  rationale: நצב என்பதன் ஹிபீல் வடிவம் இங்கு ஒன்றை நிறுவுதல் அல்லது எழுப்புதல் என்று பொருள்படுகிறது. பலிபீடத்தைக் குறிக்கும் சூழலில் ‘எழுப்பி’ என்பது இயல்பான, துல்லியமான தமிழ் வழக்கு.
- source_word: שָׁם
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் இந்த வினையடை நவீனத் தமிழில் நேரடியாக ‘அங்கே’ என்று வழங்கப்படுகிறது.
- source_word: מִזְבֵּחַ
  choice: பலிபீடம்
  rationale: பலியிடுவதற்கான அமைப்பைக் குறிக்கும் מִזְבֵּחַ என்பதற்கான வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: וַיִּקְרָא לוֹ
  choice: அதற்கு … என்று பெயரிட்டார்
  rationale: קרא + ל என்ற அமைப்பு பெயரிடுதல் அல்லது அழைத்தல் எனப் பொருள்படலாம். உடனடி சூழலில் பலிபீடத்தை நிறுவியதைத் தொடர்ந்து ஒரு பெயர் வருவதால், பெயரிடுதல் முதன்மை வாசிப்பாகத் தேர்ந்தெடுக்கப்பட்டது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: אֵל אֱלֹהֵי יִשְׂרָאֵל
  choice: ஏல்-எலோகே-இஸ்ரவேல்
  rationale: இது பலிபீடத்தின் பெயராகச் செயல்படும் முதன்மை வாசிப்பை வெளிப்படுத்த, எபிரெய ஒலிப்பைத் தமிழில் பெயராகப் பாதுகாக்கிறது. அதன் சொற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: இறுதிச் சொற்றொடர் பலிபீடத்தின் பெயரா, கடவுளை நோக்கிய அழைப்பா, அல்லது அவரைப் பற்றிய அறிவிப்பா?
  choice: யாக்கோபு பலிபீடத்திற்குக் கொடுத்த பெயராக எடுத்துக்கொள்ளப்பட்டது.
  alternative: அவர் ‘இஸ்ரவேலின் கடவுளாகிய இறைவன்’ என்று கடவுளை அழைத்தார்; அல்லது பலிபீடத்தின்மேல் ‘இறைவன் இஸ்ரவேலின் கடவுள்’ என்று அறிவித்தார்.
  rationale: ‘ஒரு பலிபீடத்தை எழுப்பினார்’ என்பதற்குப் பின் வரும் இலக்கண அமைப்பும் ஆதியாகமத்தில் காணப்படும் ஒத்த பெயரிடும் முறைகளும் பலிபீடத்திற்குப் பெயரிடும் வாசிப்பை ஆதரிக்கின்றன. எனினும் எபிரெயச் சொற்றொடர் மற்ற வாசிப்புகளையும் அனுமதிப்பதால் அவை அடிக்குறிப்பில் விடப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பலிபீடம்’ பொதுவாக அறியப்பட்ட வேதாகமச் சொல்லாக வைக்கப்பட்டுள்ளது. எபிரெயப் பெயர் தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டு, அதன் பொருளும் உள்ளார்ந்த இலக்கணத் தெளிவின்மையும் அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளன.
