translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஏராளமாக’ என்பது רָב-இன் மிகுதிப் பொருளை முதன்மைப்படுத்துகிறது; சூழலில் சாத்தியமான ‘போதுமான அளவு’ என்ற வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு வசனத்தின் முடிவில் வைக்கப்பட்டுள்ளது.
