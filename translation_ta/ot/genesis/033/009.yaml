  text: וַ/יֹּ֥אמֶר עֵשָׂ֖ו יֶשׁ לִ֣/י רָ֑ב אָחִ֕/י יְהִ֥י לְ/ךָ֖ אֲשֶׁר לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/009.yaml
  text: But Esau said[a], “I have plenty, my brother; let what is yours be yours.”
translation:
  language: ta
  text: ஆனால் ஏசா, “என்னிடம் ஏராளமாக இருக்கிறது, என் சகோதரனே; உன்னுடையது உன்னிடமே இருக்கட்டும்” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னிடம் போதுமான அளவு இருக்கிறது, என் சகோதரனே; உனக்குச் சொந்தமானது உன்னிடமே இருக்கட்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் ... என்றான்
  rationale: வாவ் தொடர் கதையை முன்னெடுத்தாலும், யாக்கோபின் கொடையை ஏசா மென்மையாக மறுக்கும் சூழலில் மிதமான எதிர்மறைத் தொடர்பை ‘ஆனால்’ இயல்பாகக் காட்டுகிறது; אמר என்பதற்கு ‘என்றான்’ நேரடியான மொழிபெயர்ப்பு.
- source_word: עֵשָׂו
  choice: ஏசா
  rationale: தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்ப தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: יֶשׁ לִי רָב
  choice: என்னிடம் ஏராளமாக இருக்கிறது
  rationale: יֵשׁ לִי என்பது உடைமையைக் குறிக்கும்; רָב வெறும் போதுமை என்பதைவிட மிகுதி அல்லது வளமையை நேரடியாகக் குறிக்கிறது. இத்தொடர் நவீனத் தமிழில் இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: אָחִי
  choice: என் சகோதரனே
  rationale: முதல் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் வரும் அழைப்புமுறை; ஏசா யாக்கோபிடம் காட்டும் உறவுசார் கனிவைத் தக்கவைக்கிறது.
- source_word: יְהִי לְךָ
  choice: உன்னிடமே இருக்கட்டும்
  rationale: היה என்பதன் வேண்டுகோள் வடிவம் இங்கு மரியாதையான அனுமதி அல்லது மறுப்பாகச் செயல்பட்டு, யாக்கோபின் பொருட்களை அவனே வைத்துக்கொள்ளட்டும் என்ற சூழற்பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲשֶׁר לָךְ
  choice: உன்னுடையது
  rationale: யாக்கோபுக்குச் சொந்தமானவற்றைக் குறிக்கும் சார்புத் தொடர்; ‘உன்னுடையது’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது. இறுதிப் பின்னொட்டின் எழுத்துரு வடிவம் பெண்பால்போல் தோன்றினாலும், சூழலும் மரபான வாசிப்பும் யாக்கோபைக் குறிக்கும் இரண்டாம் நபர் ஆண்பால் ஒருமையாகவே எடுத்துக்கொள்கின்றன.
