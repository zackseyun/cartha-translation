  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר נִסְעָ֣ה וְ/נֵלֵ֑כָה וְ/אֵלְכָ֖ה לְ/נֶגְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/012.yaml
  text: Then he said[a], “Let us set out and go, and I will go before you.”
translation:
  language: ta
  text: பின்பு அவன், “நாம் புறப்பட்டுப் போவோம்; நான் உனக்கு முன்னால் செல்வேன்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னுடன் செல்வேன்.”
    reason: לְנֶגְדֶּךָ என்பது இச்சூழலில் ஒருவருக்கு முன்னால் செல்வதையோ அவருடன் இணையாகச் செல்வதையோ குறிக்கக்கூடும்.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு அவன் … என்றான்
  rationale: வாவ் தொடர்வினை கதை நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; நவீனத் தமிழில் இயல்பான கதைத் தொடரை ‘பின்பு’ வெளிப்படுத்துகிறது.
- source_word: נִסְעָה וְנֵלֵכָה
  choice: நாம் புறப்பட்டுப் போவோம்
  rationale: இரண்டு முதலாம் நபர் பன்மை விருப்ப/தூண்டல் வடிவங்களும் சேர்ந்து பயணத்தைத் தொடங்குவதற்கான அழைப்பைத் தெரிவிக்கின்றன. தமிழில் இவ்விரு வினைகளின் ஒருங்கிணைந்த இயக்கத்தை இயல்பாகக் காக்கிறது.
- source_word: וְאֵלְכָה
  choice: நான் … செல்வேன்
  rationale: முதலாம் நபர் ஒருமை வடிவம், முந்தைய அழைப்பைத் தொடர்ந்து பேசுகிறவர் தாமும் செல்ல முன்வருவதைத் தெரிவிக்கிறது.
- source_word: לְנֶגְדֶּךָ
  choice: உனக்கு முன்னால்
  rationale: נגד என்ற சொல்லின் இடஞ்சார்ந்த அடிப்படை உணர்வான ‘முன்னே/எதிரே’ என்பதைப் பயணச் சூழலில் இயல்பாகத் தருகிறது; உடன் செல்வதைக் குறிக்கும் சூழல்சார் புரிதல் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெய மொழியிலுள்ள இணை வினைகள் தமிழில் மிகை ஏற்படாதவாறு ‘புறப்பட்டுப் போவோம்’ என வழங்கப்பட்டுள்ளன; இடஞ்சார்ந்த தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
