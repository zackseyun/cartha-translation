translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மூலத்தின் காலத் தொடர்பும் நிகழ்வுகளின் வரிசையும் காக்கப்பட்டுள்ளன; שָׁלֵם என்பதிலுள்ள உண்மையான இரட்டைப் பொருள் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
