revisions:
- from: யாக்கோபு பதான் அராமிலிருந்து வந்தபோது, கானான் நாட்டிலுள்ள சீகேம் நகரத்திற்குப் பாதுகாப்பாக[a] வந்து சேர்ந்தான்; நகரத்திற்கு எதிரே முகாமிட்டான்.
  to: யாக்கோபு பதான்-அராமிலிருந்து வந்தபோது, கானான் நாட்டிலுள்ள சீகேம் நகரத்திற்குப் பாதுகாப்பாக வந்து சேர்ந்தான்; நகரத்தின் முன்பாக முகாமிட்டான்.
  rationale: The revision makes only a safe spatial clarification and standardizes the compound place-name form. It retains the source's temporal relation, the adverbial reading ‘safely,’ and the alternative Salem reading in the footnote.
