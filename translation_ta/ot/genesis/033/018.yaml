reference: Genesis 33:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּבֹא֩ יַעֲקֹ֨ב שָׁלֵ֜ם עִ֣יר שְׁכֶ֗ם אֲשֶׁר֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן בְּ/בֹא֖/וֹ מִ/פַּדַּ֣ן אֲרָ֑ם וַ/יִּ֖חַן אֶת פְּנֵ֥י הָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/018.yaml
  text: Jacob came safely to the city of Shechem[a], which is in the land of Canaan, when he came from Paddan-aram[b], and he camped before the city.
translation:
  language: ta
  text: யாக்கோபு பதான்-அராமிலிருந்து வந்தபோது, கானான் நாட்டிலுள்ள சீகேம் நகரத்திற்குப் பாதுகாப்பாக வந்து சேர்ந்தான்; நகரத்தின் முன்பாக முகாமிட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்து சேர்ந்தான்
  rationale: בוא என்பதன் தொடர் நிகழ்வைக் குறிக்கும் வடிவம் யாக்கோபின் வருகையைச் சொல்கிறது. தமிழில் வருகை நிறைவடைந்ததை இயல்பாகக் காட்ட “வந்து சேர்ந்தான்” என மொழிபெயர்க்கப்பட்டது.
- source_word: שָׁלֵם
  choice: பாதுகாப்பாக
  rationale: இங்கு இந்தச் சொல் யாக்கோபு ஆபத்தின்றி, நலமாக வந்து சேர்ந்த நிலையைக் குறிக்கும் வினையடையாகப் புரிந்துகொள்ளப்படுகிறது. இதனை இடப்பெயரான “சாலேம்” என்றும் வாசிக்க முடிவதால் அந்த வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: עִיר שְׁכֶם
  choice: சீகேம் நகரம்
  rationale: “நகரம்” என்பதையும் “சீகேம்” என்ற பெயரையும் இணைக்கும் எபிரெயக் கட்டமைப்பு தமிழில் இயல்பாக “சீகேம் நகரம்” என வழங்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: கானான் நாட்டிலுள்ள
  rationale: சீகேமின் புவியியல் இருப்பிடத்தை அடையாளப்படுத்தும் தொடர்புத் தொடரைச் சுருக்கமான, இயல்பான தமிழில் வழங்குகிறது.
- source_word: בְּבֹאוֹ מִפַּדַּן אֲרָם
  choice: பதான் அராமிலிருந்து வந்தபோது
  rationale: ב முன்னொட்டுடன் வரும் வினைபெயர் வடிவம் காலத்தைக் குறிக்கிறது; “வந்தபோது” என்பது அந்தத் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: פַּדַּן אֲרָם
  choice: பதான் அராம்
  rationale: இடப்பெயர் நவீனத் தமிழுக்கு ஏற்ற ஒலிபெயர்ப்பில் வழங்கப்பட்டுள்ளது.
- source_word: וַיִּחַן
  choice: முகாமிட்டான்
  rationale: חן என்பதன் இங்குள்ள பொருள் தங்குவதற்காக முகாம் அமைத்தல்; “முகாமிட்டான்” என்பது தெளிவான நவீனத் தமிழ்.
- source_word: אֶת־פְּנֵי הָעִיר
  choice: நகரத்திற்கு எதிரே
  rationale: சொல்லடியாக “நகரத்தின் முகப்பில்” என்று இருந்தாலும், இத்தொடர் நகரத்தின் முன்புறம் அல்லது எதிர்ப்புறம் என்பதைக் குறிக்கிறது; “எதிரே” இடவியல் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
