  yaml_path: translation/ot/genesis/033/003.yaml
  text: And he himself went on ahead of them and bowed down to the ground seven times[a], until he came near to his brother.
translation:
  language: ta
  text: அவரோ அவர்களுக்கு முன்னே சென்று, தம் சகோதரனை அணுகும்வரை ஏழு முறை தரைவரை குனிந்து வணங்கினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தரையில் விழுந்து பணிந்தார்”; எபிரெய வினைச்சொல் முழுமையாகத் தரையில் விழுந்து பணியும் செயலையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: அவரோ
  rationale: தனி எழுவாய்ப் பிரதிப்பெயர் யாக்கோபின் சொந்தச் செயலை வலியுறுத்துகிறது; தமிழில் ‘அவரோ’ அந்த முன்னிலைப்படுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עָבַר לִפְנֵיהֶם
  choice: அவர்களுக்கு முன்னால் சென்று
  rationale: இச்சூழலில் குடும்பத்தாருக்கு முன்பாகச் சென்று தலைமை ஏற்றுச் செல்வதைக் குறிக்கிறது; வெறுமனே குறுக்கே கடப்பதைக் குறிக்கவில்லை.
- source_word: וַיִּשְׁתַּחוּ ... אַרְצָה
  choice: தரைமட்டும் குனிந்து வணங்கினார்
  rationale: வினைச்சொல் ஆழமாகக் குனிதல் அல்லது நெடுஞ்சாண்கிடையாகப் பணிதலைக் குறிக்கக்கூடும். ‘தரைமட்டும் குனிந்து வணங்கினார்’ உடல் செய்கையையும் மரியாதையையும் தெரிவிக்கிறது; வழிபாடு என்று மிகையாகத் தீர்மானிப்பதில்லை.
- source_word: שֶׁבַע פְּעָמִים
  choice: ஏழு முறை
  rationale: எண்ணிக்கையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: עַד גִּשְׁתּוֹ עַד אָחִיו
  choice: தன் சகோதரனிடம் நெருங்கிச் சேரும்வரை
  rationale: மீண்டும் மீண்டும் வணங்கிய செயலின் எல்லை, சகோதரனை அணுகிச் சேரும் வரையெனக் காட்டப்படுகிறது. இரண்டாவது עַד தனியே இன்னொரு ‘வரை’ என மொழிபெயர்க்கப்படாமல், சகோதரனை நோக்கிய அணுகுதலின் கட்டமைப்பாகப் புரிந்துகொள்ளப்படுகிறது.
theological_decisions:
- issue: וַיִּשְׁתַּחוּ என்பதன் பொருள் வழிபாடா அல்லது மரியாதை செலுத்துதலா
  choice: வணங்கினார்
  alternative: நெடுஞ்சாண்கிடையாக விழுந்து பணிந்தார்
  rationale: ஏசாவைச் சந்திக்கும் மனித உறவுச் சூழலில் மரியாதை அல்லது பணிவைச் சுட்டும் பொதுவான சொல்லைத் தேர்ந்தெடுக்கிறது; தெய்வ வழிபாடு என்ற பொருளை உரையில் புகுத்தவில்லை. உடல் நிலையின் தீவிரத்திற்கான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘அவரோ’ மூலத்தின் வலியுறுத்தலைத் தக்கவைக்கிறது; ‘தரைமட்டும் குனிந்து வணங்கினார்’ உடல் செயலைத் தெளிவாக்கினாலும், அது வழிபாடா அல்லது மனிதருக்குச் செலுத்திய ஆழ்ந்த மரியாதையா என்பதை மிகையாகத் தீர்மானிக்கவில்லை.
