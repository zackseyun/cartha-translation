source:
  edition: WLC
  text: וַ/תִּגַּ֧שׁ גַּם לֵאָ֛ה וִ/ילָדֶ֖י/הָ וַ/יִּֽשְׁתַּחֲו֑וּ וְ/אַחַ֗ר נִגַּ֥שׁ יוֹסֵ֛ף וְ/רָחֵ֖ל וַ/יִּֽשְׁתַּחֲוֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/007.yaml
  text: Leah also came near[a], and her children, and they bowed down. Afterward Joseph and Rachel came near[b], and they bowed down.
translation:
  language: ta
  text: லேயாளும் அவளுடைய பிள்ளைகளும் அருகே வந்து[a] பணிந்து வணங்கினார்கள்[b]. அதன்பின் யோசேப்பும் ராகேலும் அருகே வந்து பணிந்து வணங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அணுகி’. இரு இடங்களிலும் இவ்வாறு மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘முகங்குப்புற விழுந்து வணங்கினார்கள்’; எபிரெய வினைச்சொல் ஆழ்ந்த மரியாதையுடன் உடலைத் தாழ்த்தும் செயலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשׁ / נִגַּשׁ
  choice: அருகே வந்து
  rationale: נגשׁ என்பது அணுகுதல் அல்லது அருகே வருதல் என்பதைக் குறிக்கிறது. சூழலில் ஏசாவை நோக்கி வந்த இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: גַּם
  choice: -உம்
  rationale: கூடுதல் மற்றும் தொடர்ச்சியைக் குறிக்கும் גַּם, ‘லேயாளும்’ என்ற இணைப்பும்மையால் இயல்பாக வெளிப்படுகிறது.
- source_word: וִילָדֶיהָ
  choice: அவளுடைய பிள்ளைகளும்
  rationale: יְלָדִים பாலினத்தை வரையறுக்காமல் பிள்ளைகளைக் குறிக்க முடியும்; எனவே ‘பிள்ளைகள்’ துல்லியமும் இயல்பும் உடையது.
- source_word: וַיִּשְׁתַּחֲוּ
  choice: பணிந்து வணங்கினார்கள்
  rationale: שׁחה இங்கு மரியாதையுடன் உடலைத் தாழ்த்தி வணங்கும் செயலைக் குறிக்கிறது. ‘பணிந்து வணங்கினார்கள்’ மரியாதைச் செயலைத் தெளிவாக்குகிறது; முழுமையாகத் தரையில் விழுந்தனர் என்று அளவுக்கு மீறிக் குறிப்பதில்லை.
- source_word: וְאַחַר
  choice: அதன்பின்
  rationale: ஊர்வலத்தின் அடுத்த வரிசையைக் குறிக்கும் காலத் தொடர்ச்சியைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: יוֹסֵף וְרָחֵל
  choice: யோசேப்பும் ராகேலும்
  rationale: எபிரெய மூலத்தின் யோசேப்பு–ராகேல் என்ற பெயர் வரிசை அப்படியே பாதுகாக்கப்படுகிறது.
