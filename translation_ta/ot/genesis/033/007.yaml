translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள பெயர் வரிசையும் நிகழ்வுகளின் தொடர்ச்சியும் பாதுகாக்கப்பட்டுள்ளன. முதல் நிகழ்வுக்குப் பின் மட்டுமே [b] குறிப்பு இடப்பட்டாலும், அதே எபிரெய வினை இரு இடங்களிலும் வருவதால் அதன் மாற்று இரண்டிற்கும் பொருந்தும்.
