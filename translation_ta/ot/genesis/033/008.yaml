translation_notes:
  register: நவீன பொதுத் தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. திரும்பத் திரும்ப வரும் ‘அவன்’ என்ற மூலமொழி வடிவத்தால் பேச்சாளர் குழப்பம் ஏற்படாதபடி இரண்டாவது பேச்சாளரை ‘யாக்கோபு’ என்று வெளிப்படுத்தப்பட்டுள்ளது. ‘கண்களில் தயவு பெறுதல்’ என்ற எபிரெய உருவகம் உரையில் பாதுகாக்கப்பட்டு, அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
