source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר מִ֥י לְ/ךָ֛ כָּל הַ/מַּחֲנֶ֥ה הַ/זֶּ֖ה אֲשֶׁ֣ר פָּגָ֑שְׁתִּי וַ/יֹּ֕אמֶר לִ/מְצֹא חֵ֖ן בְּ/עֵינֵ֥י אֲדֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/008.yaml
  text: And he said[a], “What do you mean by all this camp that I met?” And he said[c][b], “To find favor in the eyes of my lord.”
translation:
  language: ta
  text: அவன், “நான் எதிர்கொண்ட இந்தக் கூட்டமெல்லாம் எதற்காக?” என்று கேட்டான். அதற்கு யாக்கோபு, “என் ஆண்டவரின் கண்களில் தயவு பெறுவதற்காக”[a] என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் ஆண்டவரின் கண்களில் தயவு பெற” என்பது, அவரது சாதகமான பார்வையையும் நல்லெண்ணத்தையும் பெறுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: מִי לְךָ
  choice: எதற்காக?
  rationale: இந்தச் சூழலில் இந்த எபிரெயச் சொற்றொடர் அடையாளத்தை அல்ல, யாக்கோபு அனுப்பிய கூட்டத்தின் நோக்கத்தைப் பற்றி கேட்கிறது. ‘எதற்காக?’ என்பது தமிழில் இயல்பாக அந்த நோக்கவினாவை வெளிப்படுத்துகிறது.
- source_word: כָּל הַמַּחֲנֶה הַזֶּה
  choice: இந்தக் கூட்டமெல்லாம்
  rationale: מַחֲנֶה என்பதன் அடிப்படைப் பொருள் ‘முகாம்’; ஆனால் இங்கு ஏசா வழியில் சந்தித்த, முன்னதாக அனுப்பப்பட்ட மந்தைகளும் அவற்றை நடத்திச் சென்றவர்களும் அடங்கிய முழுக் குழுவைக் குறிக்கிறது. ‘கூட்டம்’ சூழலுக்கேற்ற இயல்பான பொதுப்பெயர்.
- source_word: אֲשֶׁר פָּגָשְׁתִּי
  choice: நான் எதிர்கொண்ட
  rationale: פָּגַשׁ என்பது சந்தித்தல் அல்லது எதிர்கொள்ளுதல் எனப் பொருள்படும். வழியில் அந்தக் கூட்டத்தை ஏசா கண்ட சூழலை ‘எதிர்கொண்ட’ தெளிவாகக் காட்டுகிறது.
- source_word: לִמְצֹא חֵן
  choice: தயவு பெறுவதற்காக
  rationale: இறந்தகாலமல்லாத வினையெச்ச அமைப்பு நோக்கத்தைக் குறிக்கிறது; חֵן என்பது இங்கு ஒருவரின் சாதகமான மனப்பான்மை அல்லது தயவு. தமிழில் ‘தயவு பெறுதல்’ சமூகச் சூழலையும் நோக்கத்தையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: בְּעֵינֵי
  choice: கண்களில்
  rationale: ‘ஒருவரின் கண்களில் தயவு பெறுதல்’ என்ற மூலமொழியின் உருவகச் சொல்லாட்சியைத் தக்கவைக்கிறது; இதன் பொருள் ஒருவரின் பார்வையில் அல்லது மதிப்பீட்டில் சாதகமான இடம் பெறுதல்.
- source_word: אֲדֹנִי
  choice: என் ஆண்டவர்
  rationale: இது இறைவனுக்கான பட்டம் அல்ல; யாக்கோபு ஏசாவைத் தாழ்மையுடனும் மரியாதையுடனும் அழைக்கும் சொல். ‘என் ஆண்டவர்’ அந்த சமூக மரியாதையையும் படிநிலையையும் தக்கவைக்கிறது.
