  yaml_path: translation/ot/genesis/033/002.yaml
  text: And he put the female servants and their children first[a], and Leah and her children behind them, and Rachel and Joseph last.
translation:
  language: ta
  text: அவன் பணிப்பெண்களையும்[a] அவர்களுடைய பிள்ளைகளையும் முன்னால் நிறுத்தினான்; லேயாளையும் அவளுடைய பிள்ளைகளையும் அவர்களுக்குப் பின்னால் நிறுத்தினான்; ராகேலையும் யோசேப்பையும் கடைசியில் நிறுத்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெண் அடிமைகளையும்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் தாழ்ந்த நிலையிலிருந்த பெண் வீட்டுப் பணியாளர்களைக் குறிக்கிறது; சில சூழல்களில் அது அடிமைப் பெண்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: நிறுத்தினான்
  rationale: שׂוּם என்பது ‘வை, அமை, நிறுத்து’ எனப் பொருள்படும். இங்கு மனிதர்களை வரிசைப்படுத்துவதால் ‘நிறுத்தினான்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַשְּׁפָחוֹת
  choice: பணிப்பெண்கள்
  rationale: שִׁפְחָה பெண் வீட்டுப் பணியாளர் அல்லது அடிமை நிலையிலுள்ள பெண்ணைக் குறிக்கலாம். ‘பணிப்பெண்கள்’ உடனடியான சூழலில் சமூக நிலையை மிகையாகத் தீர்மானிக்காமல் இயல்பாக உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יַלְדֵיהֶן
  choice: அவர்களுடைய பிள்ளைகள்
  rationale: יֶלֶד இங்கு பாலினத்தைக் குறிப்பாக வரையறுக்காமல் குழந்தைகளைக் குறிக்கிறது; ஆகவே ‘பிள்ளைகள்’ பொருத்தமானது.
- source_word: רִאשֹׁנָה
  choice: முன்னால்
  rationale: இது வரிசையின் முதல் இடத்தைக் குறிக்கும் வினையடைப் பயன்பாடு. காட்சி சார்ந்த அமைப்பில் ‘முன்னால்’ இட ஒழுங்கைத் தெளிவாகக் காட்டுகிறது.
- source_word: לֵאָה
  choice: லேயாள்
  rationale: தமிழ் வேதாகமப் பெயர் மரபோடு ஒத்த இயல்பான எழுத்துப்பெயர்ப்பு.
- source_word: אַחֲרֹנִים (middle group)
  choice: அவர்களுக்குப் பின்னால்
  rationale: மூன்று குழுக்களில் நடுவிலுள்ள குழுவைப் பற்றுவதால் ‘கடைசியில்’ என்பதற்குப் பதிலாக முதல் குழுவுக்குப் பின்னுள்ள இடத்தை வெளிப்படுத்துகிறது.
- source_word: רָחֵל
  choice: ராகேல்
  rationale: தமிழில் பரவலாக அறியப்படும் எழுத்துப்பெயர்ப்பு.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: தமிழில் பரவலாக அறியப்படும் எழுத்துப்பெயர்ப்பு.
- source_word: אַחֲרֹנִים (final group)
  choice: கடைசியில்
  rationale: வரிசையின் இறுதிக் குழுவை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
