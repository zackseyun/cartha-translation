base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/014.yaml
  text: Please let my lord pass on ahead of his servant[a], and I will proceed slowly, at the pace of the livestock that is before me and at the pace of the children[c][b], until I come to my lord at Seir.
translation:
  language: ta
  text: என் ஆண்டவர் தம் அடியவனுக்கு முன்னால் தயவுசெய்து செல்லட்டும். நானோ, எனக்கு முன்னால் இருக்கிற கால்நடைகளின்[a] நடைக்கு ஏற்பவும் பிள்ளைகளின் நடைக்கு ஏற்பவும் மெதுவாகப் பயணிப்பேன்[b]—சேயீருக்கு என் ஆண்டவரிடம் வந்து சேரும்வரை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கால்நடைகள்’ என மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் பொதுவாக ‘வேலை,’ ‘உடைமை,’ அல்லது ‘சொத்து’ என்றும் பொருள்படும்; இங்கு ஓட்டிச் செல்லப்படும் விலங்குகளைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மெதுவாக வழிநடத்திக்கொண்டு செல்வேன்.’ எபிரெய வினை கவனமாக நகர்வதையோ, உடன் வருவோரை வழிநடத்திச் செல்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: மாற்றாக, ‘சேயீரில் இருக்கும் என் ஆண்டவரிடம் வந்து சேரும்வரை.’ எபிரெயத்தில் ‘சேயீருக்கு’ என்பது ‘என் ஆண்டவர்’ உடனோ ‘வந்து சேருவேன்’ உடனோ இணைக்கப்படலாம்.
    reason: source_ambiguity
lexical_decisions:
- source_word: יַעֲבָר נָא
  choice: முன்னால் தயவுசெய்து செல்லட்டும்
  rationale: עבר என்பதன் வேண்டுகோள் வடிவத்தோடு נָא சேர்ந்து பணிவான கோரிக்கையை வெளிப்படுத்துகிறது; முன்னால் செல்வது என்ற சூழல்சார்ந்த திசையும் தெளிவாக்கப்பட்டுள்ளது.
- source_word: אֲדֹנִי ... עַבְדּוֹ
  choice: என் ஆண்டவர் ... தம் அடியவன்
  rationale: யாக்கோபு ஏசாவை மரியாதையுடன் ‘என் ஆண்டவர்’ என்று அழைத்து, தன்னை மூன்றாம் நபரில் ‘தம் அடியவன்’ எனக் குறிப்பிடும் பணிவான பேச்சுமுறையைத் தமிழ் இயல்புக்கு ஏற்றவாறு காக்கிறது.
- source_word: אֶתְנָהֲלָה לְאִטִּי
  choice: மெதுவாகப் பயணிப்பேன்
  rationale: נהל என்பதன் ஹித்பயேல் வடிவம் கவனமாக அல்லது வழிநடத்திக்கொண்டு நகர்வதைக் குறிக்கலாம்; לְאִטִּי அதன் மெதுவான, அவசரமற்ற தன்மையைச் சுட்டுகிறது.
- source_word: לְרֶגֶל
  choice: நடைக்கு ஏற்ப
  rationale: ‘காலுக்கு ஏற்ப’ என்ற எபிரெய மரபுத்தொடர், உடன் வருவோரின் நகரும் வேகத்துக்கு ஏற்றபடி செல்லுதல் என்பதைக் குறிக்கிறது.
- source_word: הַמְּלָאכָה
  choice: கால்நடைகள்
  rationale: இச்சொல் பொதுவாக ‘வேலை,’ ‘உடைமை,’ அல்லது ‘சொத்து’ என்று பொருள்படலாம்; மேய்ப்புச் சூழலில் யாக்கோபுக்கு முன்னால் ஓட்டிச் செல்லப்படும் விலங்குகளையே குறிப்பதாகத் தெரிகிறது.
- source_word: הַיְלָדִים
  choice: பிள்ளைகள்
  rationale: பயணக் குழுவிலுள்ள யாக்கோபின் பிள்ளைகளை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: עַד אֲשֶׁר אָבֹא אֶל אֲדֹנִי שֵׂעִירָה
  choice: சேயீரில் என் ஆண்டவரிடம் வந்து சேரும்வரை
  rationale: ‘வரும்வரை’ என்ற கால எல்லையையும், சேயீரை நோக்கிய இலக்கையும், ஆண்டவரிடம் வந்து சேர்வதையும் இயல்பான தமிழ்ச் சொல் வரிசையில் தருகிறது.
theological_decisions:
- issue: ‘ஆண்டவர்’ என்ற மரியாதைச் சொல்லின் குறிப்பு
  choice: ஏசாவுக்கான சமூக மரியாதைச் சொல்லாக ‘என் ஆண்டவர்’
  alternative: ‘ஐயா’ அல்லது ‘என் எஜமான்’
  rationale: இங்கு אֲדֹנִי தெய்வீகப் பட்டமல்ல; யாக்கோபு ஏசாவிடம் காட்டும் பணிவையும், வசனத்தில் திரும்ப வரும் அழைப்பையும் ‘என் ஆண்டவர்’ காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. யாக்கோபின் பணிவான மூன்றாம் நபர் சுயக்குறிப்பு காக்கப்பட்டுள்ளது; ‘மெதுவாகப் பயணிப்பேன்’ என்பது பொதுவாசகருக்குத் தெளிவாகவும், மூல வினையின் வழிநடத்தும் நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுமாறும் அமைக்கப்பட்டுள்ளது.
