  text: וַ/יִּשָּׂ֨א יַעֲקֹ֜ב עֵינָ֗י/ו וַ/יַּרְא֙ וְ/הִנֵּ֣ה עֵשָׂ֣ו בָּ֔א וְ/עִמּ֕/וֹ אַרְבַּ֥ע מֵא֖וֹת אִ֑ישׁ וַ/יַּ֣חַץ אֶת הַ/יְלָדִ֗ים עַל לֵאָה֙ וְ/עַל רָחֵ֔ל וְ/עַ֖ל שְׁתֵּ֥י הַ/שְּׁפָחֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/001.yaml
  text: Then Jacob lifted up his eyes and looked[a], and behold, Esau was coming, and with him were four hundred men. So he divided the children among Leah, Rachel[c][b], and the two female servants.
translation:
  language: ta
  text: யாக்கோபு தன் கண்களை உயர்த்திப் பார்த்தான்[a]; இதோ,[b] ஏசா நானூறு ஆட்களுடன் வந்துகொண்டிருந்தான். அவன் பிள்ளைகளை லேயாள், ராகேல், மற்றும் இரண்டு பணிப்பெண்களிடையே பிரித்தான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிமிர்ந்து பார்த்தான்.”
    reason: lexical_alternative
  - marker: b
    text: “இதோ” என்பது ஏசா அணுகிவருவதை உயிரோட்டமாகச் சுட்டிக்காட்டும் எபிரெயக் கவன ஈர்ப்புச் சொல்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அடிமைப் பெண்கள் இருவர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו וַיַּרְא
  choice: நிமிர்ந்து பார்த்தபோது
  rationale: ‘கண்களை உயர்த்திப் பார்த்தான்’ என்ற எபிரெயச் சொற்றொடரின் இயல்பான நவீனத் தமிழ் வடிவம்; பார்வையை உயர்த்திப் பார்த்த செயலைத் தெளிவாகக் கூறுகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: ஏசாவின் அணுகுதலை வாசகரின் கவனத்துக்கு உயிரோட்டமாகக் கொண்டுவரும் உரையாடல் குறியைப் பாதுகாக்கிறது.
- source_word: בָּא
  choice: வந்துகொண்டிருந்தான்
  rationale: எபிரெயப் பங்கேற்புவினையின் தொடர்நிலைப் பொருளை வெளிப்படுத்தி, ஏசா அப்போது அணுகிக்கொண்டிருந்ததைச் சொல்கிறது.
- source_word: וְעִמּוֹ אַרְבַּע מֵאוֹת אִישׁ
  choice: நானூறு ஆட்களுடன்
  rationale: ஏசாவுடன் வந்த பெரிய ஆட்குழுவை இயல்பான தமிழில் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: וַיַּחַץ אֶת הַיְלָדִים
  choice: பிள்ளைகளை ... தனித்தனிக் குழுக்களாகப் பிரித்தான்
  rationale: வெறுமனே பிரித்தல் அல்லாமல், அவரவர் தாயுடன் குழுவாக்கிய சூழற்பொருளைத் தெளிவாக்குகிறது.
- source_word: עַל לֵאָה וְעַל רָחֵל וְעַל שְׁתֵּי הַשְּׁפָחוֹת
  choice: லேயாள், ராகேல், பணிப்பெண்கள் இருவர் ஆகியோருடன்
  rationale: மீண்டும் வரும் עַל இங்கு பிள்ளைகளை அந்தப் பெண்களுடன் சேர்த்துக் குழுவாக்குவதைக் குறிக்கிறது. שְׁפָחוֹת என்பதற்கு சட்டநிலையை அளவுக்கு மீறி வரையறுக்காமல் ‘பணிப்பெண்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
