translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற உயர்நடைச் சொல் மூலத்தின் உயிரோட்டமான கவன ஈர்ப்பைப் பாதுகாக்கிறது; மற்ற இடங்களில் தேவையற்ற சொல்-சொல் எபிரெய நடை தவிர்க்கப்பட்டுள்ளது.
