revisions:
- from: யாக்கோபு நிமிர்ந்து பார்த்தபோது,[a] இதோ, ஏசா நானூறு ஆட்களுடன் வந்துகொண்டிருந்தான்.[b] எனவே, யாக்கோபு பிள்ளைகளை லேயாள், ராகேல், பணிப்பெண்கள் இருவர்[c] ஆகியோருடன் தனித்தனிக் குழுக்களாகப் பிரித்தான்.
  to: யாக்கோபு தன் கண்களை உயர்த்திப் பார்த்தான்[a]; இதோ,[b] ஏசா நானூறு ஆட்களுடன் வந்துகொண்டிருந்தான். அவன் பிள்ளைகளை லேயாள், ராகேல், மற்றும் இரண்டு பணிப்பெண்களிடையே பிரித்தான்[c].
  rationale: The revision restores the Hebrew narrative sequence, anchors the vivid-presentation note to its Tamil equivalent, and renders the final distribution with less explanatory expansion while retaining clear modern Tamil.
