base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/017.yaml
  text: And Jacob traveled to Succoth[a], and he built a house for himself and made shelters for his livestock. Therefore he called the name of the place Succoth.
translation:
  language: ta
  text: யாக்கோபு சுக்கோத்துக்குச் சென்றான்; தனக்காக ஒரு வீட்டைக் கட்டி, தன் கால்நடைகளுக்குக் குடில்களை அமைத்தான். அதனால் அந்த இடத்திற்குச் சுக்கோத்[a] என்று பெயரிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சுக்கோத்” என்ற இடப்பெயர், எபிரெயத்தில் “குடில்கள்” அல்லது “தற்காலிகக் கூடாரங்கள்” என்பதைக் குறிக்கும் சொல்லுடன் சொல்விளையாட்டை உருவாக்குகிறது.
    reason: இடப்பெயருக்கும் கால்நடைகளுக்காக அமைக்கப்பட்ட குடில்களுக்கும் இடையிலான எபிரெயச் சொல்விளையாட்டை விளக்குகிறது.
lexical_decisions:
- source_word: נָסַע
  choice: புறப்பட்டுச் சென்றான்
  rationale: இந்த வினை ஓர் இடத்திலிருந்து புறப்பட்டு வேறோர் இடத்துக்குச் செல்வதைக் குறிக்கிறது. தமிழ் கதைநடையில் இயல்பாகவும் மூலத்தின் இயக்க உணர்வைத் தெளிவாகவும் தருகிறது.
- source_word: סֻכֹּתָה
  choice: சுக்கோத்துக்கு
  rationale: இடப்பெயருடன் இணைந்த திசைச் சுட்டு, சுக்கோத்தை நோக்கிய பயணத்தைக் குறிக்கிறது; சூழலில் இலக்கை அடைந்தது தொடர்ந்து வரும் செயல்களால் தெளிவாகிறது.
- source_word: וַיִּבֶן לוֹ בָּיִת
  choice: தனக்காக ஒரு வீட்டைக் கட்டி
  rationale: לוֹ என்பதிலுள்ள தனக்கான பயனை வெளிப்படையாகக் காட்டி, தொடரும் வாக்கியத்துடன் இயல்பாக இணைக்கிறது.
- source_word: מִקְנֵהוּ
  choice: தன் கால்நடைகள்
  rationale: இச்சொல் ஒரே வகை மாடுகளை மட்டும் அல்லாமல், ஒருவருக்குச் சொந்தமான மந்தை விலங்குகளைப் பொதுவாகக் குறிக்கிறது; எனவே ‘கால்நடைகள்’ பொருத்தமான பரந்த சொல்.
- source_word: עָשָׂה סֻכֹּת
  choice: குடில்களை அமைத்தான்
  rationale: סֻכּוֹת என்பது தற்காலிகமான மூடிடங்கள் அல்லது குடில்களைக் குறிக்கிறது. கால்நடைகளுக்கான சூழலில் ‘குடில்கள்’ இயல்பாக இருந்து, இடப்பெயருடனான சொல்விளையாட்டையும் அடிக்குறிப்பில் விளக்க இடமளிக்கிறது.
- source_word: עַל כֵּן
  choice: அதனால்
  rationale: இடப்பெயர் ஏற்பட்டதற்கான காரணத்தைச் சுருக்கமாகவும் இயல்பாகவும் அறிமுகப்படுத்துகிறது.
- source_word: קָרָא שֵׁם הַמָּקוֹם
  choice: அந்த இடத்துக்குச் … என்று பெயரிட்டான்
  rationale: எபிரெயப் பெயரிடும் மரபுத்தொடரின் பொருளை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: סֻכּוֹת
  choice: சுக்கோத்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது. பொதுப்பெயரான ‘குடில்கள்’ என்பதுடனான தொடர்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
