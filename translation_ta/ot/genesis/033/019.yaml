  text: וַ/יִּ֜קֶן אֶת חֶלְקַ֣ת הַ/שָּׂדֶ֗ה אֲשֶׁ֤ר נָֽטָה שָׁם֙ אָהֳל֔/וֹ מִ/יַּ֥ד בְּנֵֽי חֲמ֖וֹר אֲבִ֣י שְׁכֶ֑ם בְּ/מֵאָ֖ה קְשִׂיטָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/019.yaml
  text: And he bought the portion of the field where he had pitched his tent[a], from the hand of the sons of Hamor, the father of Shechem, for a hundred qesitahs.
translation:
  language: ta
  text: அவன் தன் கூடாரத்தை அமைத்திருந்த வயல் நிலத்தின் ஒரு பகுதியை, சீகேமின் தந்தையான ஹமோரின் மகன்களிடமிருந்து நூறு கெசித்தாக்களுக்கு[a] வாங்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘கெசித்தா’; துல்லியமான மதிப்பு தெரியாத பண்டைய பண அலகு அல்லது பணமாகப் பயன்படுத்தப்பட்ட பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: வாங்கினான்
  rationale: கנה என்ற வினைச்சொல் இந்நிலப் பரிவர்த்தனைச் சூழலில் விலைகொடுத்து வாங்குவதைக் குறிக்கிறது.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: வயல் நிலத்தின் ஒரு பகுதியை
  rationale: חֶלְקָה என்பது வரையறுக்கப்பட்ட பகுதி அல்லது நிலத்துண்டைக் குறிக்கிறது; ‘வயல் நிலத்தின் ஒரு பகுதி’ என்பது மூலத்தின் அமைப்பையும் இயல்பான தமிழையும் பேணுகிறது.
- source_word: אֲשֶׁר נָטָה שָׁם אָהֳלוֹ
  choice: தன் கூடாரத்தை அமைத்திருந்த
  rationale: נטה ஓர் கூடாரத்துடன் வரும்போது அதைக் கூடாரம் அமைத்தல் என இயல்பாகப் பொருள்படும்; வாங்குவதற்கு முன்பே அங்கே கூடாரம் அமைக்கப்பட்டிருந்த காலத் தொடர்பும் தமிழில் வெளிப்படுகிறது.
- source_word: מִיַּד בְּנֵי חֲמוֹר
  choice: ஹமோரின் மகன்களிடமிருந்து
  rationale: מִיַּד என்பதன் சொற்பொருள் ‘கையிலிருந்து’ என்றாலும், இங்கே உரிமையாளர்களிடமிருந்து வாங்கியதைக் குறிக்கிறது; ‘மகன்களிடமிருந்து’ என்பது பொருளைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲבִי שְׁכֶם
  choice: சீகேமின் தந்தையான
  rationale: இது ஹமோரை சீகேம் என்பவனின் தந்தை என்று அடையாளப்படுத்தும் இடைநிலை விளக்கம்.
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: நூறு கெசித்தாக்களுக்கு[a]
  rationale: קְשִׂיטָה என்பதன் துல்லியமான மதிப்பும் வடிவமும் தெரியாததால், தவறான நாணய மதிப்பைச் சுமத்தாமல் மூலச் சொல்லை ஒலிபெயர்த்துள்ளோம்; ‘-க்கு’ வாங்கிய விலையை இயல்பாகக் காட்டுகிறது.
