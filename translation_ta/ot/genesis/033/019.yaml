translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘கையிலிருந்து’ என்ற எபிரெயச் சொற்றொடர் தமிழில் செயற்கையாக இருப்பதால் ‘மகன்களிடமிருந்து’ எனப் பொருள்வழியில் மொழிபெயர்க்கப்பட்டது. அறியப்படாத பண்டைய பண மதிப்புக்கு நவீன நாணயச் சமமொன்று ஊகிக்கப்படவில்லை.
