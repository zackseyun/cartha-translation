- from: அப்போது ஏசா, “என்னுடன் இருக்கிறவர்களில் சிலரை உன்னிடம் விட்டுச் செல்ல அனுமதி கொடு” என்றான். அதற்கு அவன், “இது எதற்கு? என் ஆண்டவரின் கண்களில் எனக்குத் தயவு கிடைத்தால் போதும்” என்றான்.
  to: அப்போது ஏசா, “என்னுடன் இருக்கிறவர்களில் சிலரை உன்னோடு விட்டுச் செல்ல அனுமதி கொடு” என்றான். ஆனால் அவன், “இது எதற்கு? என் ஆண்டவரின் கண்களில் எனக்குத் தயவு கிடைக்கட்டும்” என்றான்.
  rationale: The revision retains the draft’s clear modern Tamil and its respectful rendering of אַדֹנִי, while restoring the Hebrew cohortative in the final sentence and removing the added conditional and conclusion. “உன்னோடு” more precisely reflects עִמְּךָ.
