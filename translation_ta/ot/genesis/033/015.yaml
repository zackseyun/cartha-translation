source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר עֵשָׂ֔ו אַצִּֽיגָה נָּ֣א עִמְּ/ךָ֔ מִן הָ/עָ֖ם אֲשֶׁ֣ר אִתִּ֑/י וַ/יֹּ֨אמֶר֙ לָ֣/מָּה זֶּ֔ה אֶמְצָא חֵ֖ן בְּ/עֵינֵ֥י אֲדֹנִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/015.yaml
  text: Then Esau said, “Please let me leave with you some of the people who are with me.” But he said, “Why is this? Let me find favor in the eyes of my lord.”
translation:
  language: ta
  text: அப்போது ஏசா, “என்னுடன் இருக்கிறவர்களில் சிலரை உன்னோடு விட்டுச் செல்ல அனுமதி கொடு” என்றான். ஆனால் அவன், “இது எதற்கு? என் ஆண்டவரின் கண்களில் எனக்குத் தயவு கிடைக்கட்டும்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַצִּיגָה נָּא
  choice: விட்டுச் செல்ல அனுமதி கொடு
  rationale: הציג என்ற வினை இங்கு ஏசா தன்னுடன் வந்தவர்களில் சிலரை யாக்கோபுடன் நிறுத்திவிட்டுச் செல்வதைக் குறிக்கிறது; נָּא-வின் பணிவான வேண்டுகோள் இயல்பான தமிழில் ‘அனுமதி கொடு’ என வெளிப்படுத்தப்பட்டது.
- source_word: מִן הָעָם אֲשֶׁר אִתִּי
  choice: என்னுடன் இருக்கிறவர்களில் சிலரை
  rationale: מִן பகுதியைக் குறிக்கும் பொருளில் உள்ளது; ‘மக்கள்’ என்ற சொல்லைவிட இச்சூழலில் உடன் வந்த மனிதர்களைக் குறிக்கும் ‘இருக்கிறவர்கள்’ இயல்பானது.
- source_word: לָמָּה זֶּה
  choice: இது எதற்கு?
  rationale: சொற்றொடரின் சுருக்கமான, சூழல்சார்ந்த கேள்வித் தன்மையைத் தக்கவைக்கிறது; ஏசாவின் ஏற்பாட்டை யாக்கோபு மரியாதையுடன் தேவையற்றதாகக் கேட்கிறான்.
- source_word: אֶמְצָא חֵן בְּעֵינֵי אֲדֹנִי
  choice: என் ஆண்டவரின் கண்களில் எனக்குத் தயவு கிடைத்தால் போதும்
  rationale: ‘கண்களில் தயவு கிடைத்தல்’ என்ற எபிரேய உருவகத்தைத் தக்கவைத்து, இங்கு மறைமுகமாக வெளிப்படும் ‘அதுவே போதும்’ என்ற மறுப்பின் நடைமுறைப் பொருளையும் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: אֲדֹנִי என்பதன் குறிப்பு
  choice: என் ஆண்டவர்
  alternative: என் எஜமான்
  rationale: இங்கு சொல் கடவுளைக் குறிக்காமல் ஏசாவை நோக்கிய யாக்கோபின் மரியாதைமிக்க அழைப்பாகும். ‘ஆண்டவர்’ அந்த மரியாதையையும் உரையின் மீளும் அழைப்புமுறையையும் தக்கவைக்கிறது; கடவுளைக் குறிக்கும் சிறப்பு எழுத்தமைப்பு பயன்படுத்தப்படவில்லை.
- issue: இறுதி வேண்டுகோளின் மறைமுகப் பொருள்
  choice: ‘எனக்குத் தயவு கிடைத்தால் போதும்’ என மொழிபெயர்த்தல்
  alternative: ‘என் ஆண்டவரின் கண்களில் எனக்குத் தயவு கிடைக்கட்டும்’
  rationale: மூலத்தில் ‘போதும்’ என்பதற்கான தனிச் சொல் இல்லை; எனினும் முந்தைய கேள்விக்குப் பின் வரும் வேண்டுகோள், ஆட்களை விட்டுச் செல்ல வேண்டாம் என்பதைக் கூறும் மரியாதையான மறுப்பாகச் செயல்படுகிறது. தமிழில் அந்த உரையாடல் நோக்கை இயல்பாக உணர்த்த இவ்வாறு அமைக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; குடும்ப உறவுக்குரிய ஒருமை முன்னிலையைத் தக்கவைத்து, மரியாதையான ஆனால் இயல்பான உரையாடல் நடையில் வடிவமைக்கப்பட்டது. எபிரேயத்தின் ‘கண்களில் தயவு’ என்ற உருவகம் பாதுகாக்கப்பட்டுள்ளது.
