source:
  edition: WLC
  text: קַח נָ֤א אֶת בִּרְכָתִ/י֙ אֲשֶׁ֣ר הֻבָ֣את לָ֔/ךְ כִּֽי חַנַּ֥/נִי אֱלֹהִ֖ים וְ/כִ֣י יֶשׁ לִ/י כֹ֑ל וַ/יִּפְצַר בּ֖/וֹ וַ/יִּקָּֽח־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/011.yaml
  text: Please take my gift that has been brought to you, because God has dealt graciously with me, and because I have everything. And he urged him, and he took it.
translation:
  language: ta
  text: “தயவுசெய்து, உங்களுக்குக் கொண்டுவரப்பட்ட என் பரிசை[a] ஏற்றுக்கொள்ளுங்கள். ஏனெனில் கடவுள் எனக்கு அருள் புரிந்திருக்கிறார்; என்னிடம் எல்லாம் இருக்கிறது” என்றான். யாக்கோபு அவனை வற்புறுத்தினான்; அப்போது ஏசா அதை ஏற்றுக்கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “என் ஆசீர்வாதத்தை.” இச்சூழலில் நல்லெண்ணத்தின் அடையாளமாக வழங்கப்படும் பரிசைக் குறிக்கிறது.
    reason: בִּרְכָתִי என்பதன் நேரடிப் பொருளான ‘ஆசீர்வாதம்’ என்பதையும், இச்சூழலில் உள்ள ‘பரிசு’ என்ற பொருளையும் தக்கவைக்கிறது.
lexical_decisions:
- source_word: בִּרְכָתִי
  choice: என் ஆசிப் பரிசை
  rationale: இதன் நேரடிப் பொருள் ‘என் ஆசீர்வாதம்’. ஆனால் இச்சூழலில் ஏசாவுக்குக் கொண்டுவரப்பட்ட அன்பளிப்பைக் குறிக்கிறது. ‘ஆசிப் பரிசு’ என்பது மூலச்சொல்லின் ஆசீர்வாதக் கருத்தையும் சூழலிலுள்ள பரிசின் பொருளையும் இணைத்துப் பாதுகாக்கிறது.
- source_word: חַנַּנִי
  choice: எனக்கு அருள் செய்திருக்கிறார்
  rationale: חנן என்பது இரக்கம் அல்லது அருள் காட்டி நன்மை செய்வதைக் குறிக்கிறது; கடவுளின் அருளால் யாக்கோபு பெற்ற செழிப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יֶשׁ לִי כֹל
  choice: எனக்குத் தேவையானதெல்லாம் இருக்கிறது
  rationale: சொல்லுக்குச் சொல் ‘என்னிடம் எல்லாம் இருக்கிறது’. தமிழில் இது உலகிலுள்ள அனைத்தையும் உடையவன் என்ற மிகைப்படுத்தலாகத் தோன்றாமல், தன்னிடம் நிறைவாக உள்ளது என்ற சூழல்சார் பொருளைத் தருகிறது.
- source_word: וַיִּקָּח
  choice: அதை ஏற்றுக்கொண்டான்
  rationale: ‘எடுத்தான்’ என்பதே அடிப்படைப் பொருள்; பரிசை ஒப்புக்கொண்டு பெற்றுக்கொண்டதை இச்சூழலில் ‘ஏற்றுக்கொண்டான்’ இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: בְּרָכָה என்ற சொல்லில் உள்ள ‘ஆசீர்வாதம்’ மற்றும் ‘பரிசு’ ஆகிய பொருள் அடுக்குகள்
  choice: முதன்மை உரையில் ‘ஆசிப் பரிசு’ என்றும், அடிக்குறிப்பில் நேரடிப் பொருளையும் குறிப்பிட்டல்
  alternative: ‘என் பரிசை’ அல்லது ‘என் ஆசீர்வாதத்தை’ மட்டும் பயன்படுத்துதல்
  rationale: ‘பரிசு’ மட்டும் மூலத்தின் ஆசீர்வாத மொழியை மறைக்கும்; ‘ஆசீர்வாதம்’ மட்டும் நவீன வாசகருக்கு பொருளை அனுப்பிவைப்பதாகத் தவறாகப் புரியக்கூடும். இரண்டையும் தக்கவைத்தல் இப்பகுதியின் நல்லுறவு மற்றும் சமரச நுணுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையுடனும் எளிதில் புரியும் நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. இறுதி வாக்கியத்தில் மூலத்தின் சுட்டுப்பெயர்களுக்குப் பதிலாக யாக்கோபு, ஏசா என்ற பெயர்கள் பயன்படுத்தப்பட்டுள்ளன; இது பொருளை மாற்றாமல் தமிழில் யார் யாரை வற்புறுத்தினார் என்பதைக் தெளிவாக்குகிறது.
