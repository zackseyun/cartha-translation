translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘என் ஆண்டவர்’ என்பது ஏசாவுக்கான பணிவான அழைப்பு; தெய்வீகப் பட்டமாகப் புரியாதபடி உரையாடல் சூழல் தெளிவாக உள்ளது. மூலத்தின் கடினமான עָלוֹת עָלָי சொற்றொடரிலுள்ள இரு கருத்துகளும் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளன.
