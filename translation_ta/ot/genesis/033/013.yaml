base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/013.yaml
  text: But he said to him[a], “My lord knows that the children are frail, and the flocks and herds nursing their young are under my care. If they are driven hard for one day, all the flock will die.”
translation:
  language: ta
  text: ஆனால் அவன் அவனிடம், “என் ஆண்டவருக்குத் தெரியும், பிள்ளைகள் பலவீனமாக இருக்கிறார்கள்; குட்டிகளுக்குப் பாலூட்டும் ஆடுமாடுகள் என் பொறுப்பில் உள்ளன.[a] அவற்றை ஒரே ஒரு நாள் கடுமையாக ஓட்டினாலும், மந்தை முழுவதும் இறந்துபோகும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குட்டிகளுக்குப் பாலூட்டும் ஆடுமாடுகளின் பொறுப்பு என் மீது உள்ளது.” எபிரெயச் சொற்றொடர், விலங்குகள் குட்டிகளுக்குப் பாலூட்டுகின்றன என்பதையும் அவற்றைப் பராமரிக்கும் பொறுப்பு யாக்கோபின்மீது உள்ளது என்பதையும் இணைத்துக் கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: என் ஆண்டவர்
  rationale: ஏசாவை நோக்கி மரியாதையுடனும் பணிவுடனும் பயன்படுத்தப்படும் மனிதப் பட்டம். தெய்வப் பெயராக அல்லாமல் சமூக மரியாதையைப் பாதுகாக்கிறது.
- source_word: הַיְלָדִים רַכִּים
  choice: பிள்ளைகள் மென்மையானவர்கள்
  rationale: ரַכִּים என்பது மென்மை, இளமை, பயணத்தின் சிரமத்தைத் தாங்க இயலாத பாதிப்புக்குட்படும் நிலை ஆகியவற்றைக் குறிக்கிறது. இயல்பான தமிழில் மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: ஆடுமாடுகள்
  rationale: சிறிய கால்நடைகளையும் மாடுகளையும் இணைத்துக் குறிக்கும் இயல்பான தமிழ் கூட்டுச்சொல்.
- source_word: עָלוֹת עָלָי
  choice: குட்டிகளுக்குப் பாலூட்டும் ஆடுமாடுகளின் பராமரிப்பும் என் பொறுப்பில் இருக்கிறது
  rationale: עָלוֹת என்பதிலுள்ள பாலூட்டும் விலங்குகள் என்ற கருத்தையும் עָלָי என்பதிலுள்ள யாக்கோபின்மீது தங்கிய பராமரிப்புப் பொறுப்பையும் வெளிப்படுத்துகிறது; கடினமான எபிரெய மொழிநடையைத் தெளிவான தமிழில் தருகிறது.
- source_word: וּדְפָקוּם
  choice: அவற்றை ... கடுமையாக ஓட்டினாலும்
  rationale: கால்நடைகளை அளவுக்கு மீறி வேகமாக அல்லது கடுமையாக ஓட்டும் பொருளைத் தருகிறது. எபிரெயத்தில் செய்பவர் குறிப்பிடப்படாதிருப்பதைத் தமிழிலும் பொதுநிலையாக வைத்திருக்கிறது.
- source_word: יוֹם אֶחָד
  choice: ஒரே ஒரு நாள்
  rationale: ஒரு நாள் முழுவதும் என்ற காலநீட்சியையும் அதன் குறுகிய தன்மைக்கான வலியுறுத்தலையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וָמֵתוּ כָּל הַצֹּאן
  choice: மந்தை முழுவதும் இறந்துபோகும்
  rationale: கூட்டுப்பொருளில் வரும் הַצֹּאן என்பதை ‘மந்தை முழுவதும்’ எனத் தருவதால் விளைவின் தீவிரம் பாதுகாக்கப்படுகிறது.
