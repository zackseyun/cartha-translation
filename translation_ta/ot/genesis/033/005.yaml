base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/005.yaml
  text: He lifted up his eyes and saw the women and the children[a], and he said, “Who are these with you?” And he said[b], “The children whom God has graciously given to your servant.”
translation:
  language: ta
  text: அவன் கண்களை ஏறெடுத்துப் பார்த்தபோது, பெண்களையும் பிள்ளைகளையும் கண்டான். “உனக்கு இவர்கள் யார்?”[a] என்று கேட்டான். அதற்கு அவன், “கடவுள் உமது அடியேனுக்கு அருளிய பிள்ளைகள்”[b] என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னோடு இருக்கும் இவர்கள் யார்?” எபிரெயச் சொற்றொடர் யாக்கோபுடன் வந்தவர்களின் அடையாளம் அல்லது அவர்களுக்கும் அவனுக்கும் உள்ள உறவைப் பற்றிக் கேட்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கடவுள் உமது அடியேனுக்குக் கொடுத்த பிள்ளைகள்.” எபிரெய வினை தயவு அல்லது அருள் காட்டி வழங்குதல் என்ற நயத்தையும் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא אֶת־עֵינָיו
  choice: கண்களை ஏறெடுத்துப் பார்த்தபோது
  rationale: ‘கண்களை உயர்த்துதல்’ என்ற எபிரெய மொழிநடையின் பொருள் பார்வையை உயர்த்திப் பார்ப்பதாகும். தமிழில் இயல்பாகவும் மூலத்தின் கதைநடையைத் தக்கவைக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וַיַּרְא
  choice: கண்டான்
  rationale: ראה என்பதன் வழக்கமான பொருளைத் தருகிறது; முந்தைய பார்வைச் சொல்லாடலுக்குப் பின் தேவையற்ற மறுபதிப்பைத் தவிர்க்கிறது.
- source_word: הַנָּשִׁים
  choice: பெண்கள்
  rationale: மூலம் உறவைச் சுருக்கிக் ‘மனைவிகள்’ என்று கூறாமல் பொதுவான ‘பெண்கள்’ என்ற சொல்லையே பயன்படுத்துவதால் அதே பொதுத்தன்மை காக்கப்பட்டது.
- source_word: הַיְלָדִים
  choice: பிள்ளைகள்
  rationale: இச்சூழலில் இயல்பான நவீனத் தமிழ் சொல்; வசனத்தின் இரு இடங்களிலும் ஒரே சொல்லாக வைக்கப்பட்டது.
- source_word: מִי אֵלֶּה לָּךְ
  choice: உனக்கு இவர்கள் யார்?
  rationale: எபிரெய தத்திவ் அமைப்பை தமிழில் இயல்பாகத் தக்கவைத்து, உடனிருப்பவர்களின் அடையாளம் அல்லது யாக்கோபுடனான உறவைப் பற்றிய கேள்வியாகத் திறந்துவைக்கிறது.
- source_word: חָנַן
  choice: அருளிய
  rationale: வெறுமனே ‘கொடுத்த’ என்பதைக் கடந்தும், தயவு காட்டி வழங்குதல் என்ற வினையின் நயத்தைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு ஒருமைச் சுட்டுடைய தெய்வீகப் பெயருக்கான இயல்பான நவீனத் தமிழ் மொழிபெயர்ப்பு.
- source_word: עַבְדֶּךָ
  choice: உமது அடியேன்
  rationale: ஏசாவிடம் யாக்கோபு தன்னைத் தாழ்த்திக் குறிப்பிடும் மரியாதைமிக்க பேச்சை வெளிப்படுத்துகிறது; இச்சூழலில் ‘அடிமை’ என்று மிகக் கடுமையாகப் பொருள்கொள்ளாமல் சமூகப் பணிவைத் தருகிறது.
theological_decisions:
- issue: பிள்ளைகள் கடவுளுடைய தயவான கொடையாகக் கூறப்படுதல்
  choice: கடவுள் அருளிய பிள்ளைகள்
  alternative: கடவுள் கொடுத்த பிள்ளைகள்
  rationale: חנן என்ற வினையில் உள்ள தயவு அல்லது அருள் காட்டுதல் என்ற நயத்தைத் தக்கவைக்கிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டுப் பொருள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ஏசாவின் நேரடி ஒருமை அழைப்பு ‘உனக்கு’ என்றும், யாக்கோபின் பணிவான சுயக்குறிப்பு ‘உமது அடியேன்’ என்றும் வேறுபடுத்தப்பட்டுள்ளது. மூலத்தில் இரு பேச்சாளர்களும் பெயரிடப்படாமல் ஒரே ஆண்பால் சுட்டுப்பெயரால் தொடர்வதால், அந்தக் கதைநடைத் தன்மை ‘அவன்’ என்பதன் மூலம் காக்கப்பட்டுள்ளது; உரையாடல் மாறுதல் ‘அதற்கு’ என்பதால் தெளிவாக்கப்பட்டுள்ளது.
