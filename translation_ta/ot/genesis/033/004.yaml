base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/004.yaml
  text: Esau ran to meet him[a], embraced him, fell on his neck, kissed him, and they wept.
translation:
  language: ta
  text: ஏசா அவனைச் சந்திக்க ஓடிவந்து, அவனை அணைத்து, யாக்கோபின் கழுத்தின்மேல் விழுந்து, அவனை முத்தமிட்டான்[a]. இருவரும் அழுதார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முத்தமிட்டான்” என்று மொழிபெயர்க்கப்பட்டுள்ள வினைச்சொல்லின் மீது மசோரெட்டிக் எபிரேய உரையில் வழக்கத்திற்கு மாறாகப் புள்ளிகள் இடப்பட்டுள்ளன. இதைச் சிலர் சந்தேகத்தையோ வலியுறுத்தலையோ குறிப்பதாகக் கருதுகின்றனர்; எனினும் இங்குள்ள எபிரேயத்தின் நேரான பொருள் “முத்தமிட்டான்” என்பதே.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּרָץ
  choice: ஓடிவந்து
  rationale: רוץ என்பதன் நேரான பொருள் ‘ஓடு’. அடுத்துவரும் சந்திப்பை இயல்பான தமிழ் நடையில் இணைக்க ‘ஓடிவந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עֵשָׂו
  choice: ஏசா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: לִקְרָאתוֹ
  choice: அவனைச் சந்திக்க
  rationale: לקראת என்ற எபிரெயச் சொற்றொடர் ஒருவரை எதிர்கொண்டு சந்திக்கச் செல்வதைக் குறிக்கிறது; ‘அவனைச் சந்திக்க’ என்பது இயல்பாகவும் உறவுசார் இயக்கத்தைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: וַיְחַבְּקֵהוּ
  choice: அவனை அணைத்துக்கொண்டு
  rationale: חבק என்பது அணைத்தலைக் குறிக்கிறது. தொடர்ச்சியான செயல்களைத் தமிழ் நடையில் இயல்பாக இணைக்க ‘அணைத்துக்கொண்டு’ பயன்படுத்தப்பட்டது.
- source_word: וַיִּפֹּל עַל צַוָּארוֹ
  choice: அவன் கழுத்தின்மேல் விழுந்து
  rationale: மூலத்தின் உணர்ச்சிமிக்க, உயிரோட்டமான உருவகத்தை விளக்கவுரையால் மாற்றாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיִּשָּׁקֵהוּ
  choice: அவனை முத்தமிட்டான்
  rationale: נשק என்பதன் இங்குள்ள நேரான பொருள் ‘முத்தமிடுதல்’. மசோரா உரையின் அசாதாரண புள்ளிக்குறிப்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது; முதன்மை உரையின் இயல்பான பொருள் மாற்றப்படவில்லை.
- source_word: וַיִּבְכּוּ
  choice: இருவரும் அழுதார்கள்
  rationale: பன்மை வினைச்சொல் ஏசாவும் யாக்கோபும் அழுததைக் காட்டுகிறது. தமிழில் எழுவாயைத் தெளிவாக்க ‘இருவரும்’ சேர்க்கப்பட்டது; இது மூலத்தில் உள்ள பன்மையை மட்டுமே வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யாக்கோபிடம் ஏசா நடந்துகொண்ட விதத்தின் பொருளாக்கம்
  choice: செயல்களின் தொடரை உண்மையான பாசத்தையும் சமரசத்தையும் வெளிப்படுத்தும் அதன் நேரான பொருளிலேயே வழங்குதல்
  alternative: பிற்கால விளக்க மரபுகளின் அடிப்படையில் முத்தத்தை சந்தேகத்திற்குரியதாகவோ வஞ்சகமானதாகவோ காட்டுதல்
  rationale: எபிரெயக் கதை ஓடுதல், அணைத்தல், கழுத்தின்மேல் விழுதல், முத்தமிடுதல், அழுதல் ஆகிய பாசமிக்க செயல்களை விரைவான தொடராக வழங்குகிறது. பின்னைய சந்தேக விளக்கத்தை முதன்மை உரைக்குள் புகுத்தாமல், உரையின் வெளிப்படையான பொருள் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் செயல்தொடரின் வேகமும் உணர்ச்சியும் பாதுகாக்கப்பட்டுள்ளன; ‘கழுத்தின்மேல் விழுந்து’ என்ற மூலப்படிமம் சுருக்கிப் பொருளுரைக்கப்படவில்லை.
