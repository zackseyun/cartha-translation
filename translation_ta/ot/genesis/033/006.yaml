  yaml_path: translation/ot/genesis/033/006.yaml
  text: Then the female servants and their children came near and bowed down[a][b][c][d].
translation:
  language: ta
  text: பின்பு பணிப்பெண்களும் அவர்களுடைய பிள்ளைகளும் அருகே வந்து தாழ்ந்து வணங்கினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּגַּשְׁןָ
  choice: அருகே வந்து
  rationale: נגשׁ என்பதன் தொடர்நிகழ்வு வடிவம் ஏசாவை நோக்கி அவர்கள் நெருங்கிய அடுத்தடுத்த நிகழ்வைக் குறிக்கிறது. ‘அருகே வந்து’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: הַשְּׁפָחוֹת
  choice: பணிப்பெண்கள்
  rationale: שִׁפְחָה என்பது பெண் பணியாளர் அல்லது அடிமைப் பெண்ணைக் குறிக்கலாம். இச்சூழலில் பாலினத்தையும் பணிநிலையையும் தெளிவாகக் காட்டும், தேவையற்ற கடுமையைச் சேர்க்காத இயல்பான சொல் ‘பணிப்பெண்கள்’.
- source_word: הֵנָּה וְיַלְדֵיהֶן
  choice: அவர்களுடைய பிள்ளைகளும்
  rationale: தனிப்பட்ட பெண்பால் பன்மைப் பெயர்ச்சொல் வலியுறுத்தல் அல்லது சொல் இணைப்பாக வந்து, பணிப்பெண்களும் அவர்களுடைய பிள்ளைகளும் ஒன்றாகச் செயல்பட்டதைக் காட்டுகிறது. தமிழில் இந்த ஒருங்கிணைந்த எழுவாய் இயல்பாக உள்ளது.
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: பணிந்து வணங்கினார்கள்
  rationale: השתחוה உடலைத் தாழ்த்தி மரியாதை செலுத்தும் செயலைக் குறிக்கிறது. ‘பணிந்து வணங்கினார்கள்’ உடல் தாழ்த்தலையும் மரியாதையையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், அதேவேளை கண்ணியமான கதைநடை. எபிரேய வாக்கியத்தின் நிகழ்வுவரிசையும் பெண் பணியாளர்கள் என்ற குறிப்பும் பாதுகாக்கப்பட்டுள்ளன.
