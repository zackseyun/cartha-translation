source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לֹ֤א יַעֲקֹב֙ יֵאָמֵ֥ר עוֹד֙ שִׁמְ/ךָ֔ כִּ֖י אִם יִשְׂרָאֵ֑ל כִּֽי שָׂרִ֧יתָ עִם אֱלֹהִ֛ים וְ/עִם אֲנָשִׁ֖ים וַ/תּוּכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/029.yaml
  text: And he said[a], “Your name shall no longer be called Jacob, but Israel, because you have striven with God and with men[b], and have prevailed.”
translation:
  language: ta
  text: அவர், “உன் பெயர் இனி யாக்கோபு எனப்படாது; இஸ்ரவேல் எனப்படும். ஏனெனில், நீ கடவுளோடும்[a] மனிதர்களோடும்[b] போராடி வெற்றிபெற்றாய்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தெய்வீக உயிர்களோடு.’ எபிரெயத்தில் אֱלֹהִים என்பது சூழலுக்கேற்ப கடவுள், தெய்வங்கள் அல்லது விண்ணுலக உயிர்கள் என்பவற்றைக் குறிக்கலாம். இங்கு கதையின் சூழலைக் கருத்தில் கொண்டு முதன்மை உரையில் ‘கடவுள்’ என்று தரப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘ஆண்களோடு.’ எபிரெயச் சொல் ஆண்பால் பன்மையில் உள்ளது; இங்கு அது பொதுவாக மனிதர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָמֵר
  choice: எனப்படாது / எனப்படும்
  rationale: பெயரிடும் கூற்றில் வரும் אמר என்பதன் செயப்பாட்டு வடிவத்தைத் தமிழில் இயல்பான ‘எனப்படும்’ என்ற சொல்லால் வெளிப்படுத்துகிறது.
- source_word: עוֹד
  choice: இனி ... படாது
  rationale: பழைய பெயரின் பயன்பாடு முடிவுக்கு வருவதைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: כִּי אִם
  choice: '... எனப்படாது; ... எனப்படும்'
  rationale: ‘அல்ல, மாறாக’ என்ற எதிர்மறை–நேர்மறை வேறுபாட்டைத் தமிழ்ப் பெயரிடும் நடைக்கு ஏற்றவாறு நேரடியாகக் காட்டுகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: பெயரை ஒலிபெயர்த்து, அதனுடன் தொடர்புடைய சொல்விளையாட்டை அடுத்த காரணவாக்கியம் எடுத்துரைக்க அனுமதிக்கிறது.
- source_word: שָׂרִיתָ
  choice: போராடி
  rationale: שרה வினையின் போராடுதல்/மல்லுக்கட்டுதல் என்ற மையப் பொருளையும் ‘இஸ்ரவேல்’ என்ற பெயருடனான சொல்விளையாட்டையும் வாசிக்கத்தக்க தமிழில் தக்கவைக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இக்கதையின் உடனடிச் சூழலில் ஒருமை இறைச் சுட்டே முதன்மையானது; உருவத்தின் அடையாளத்தைச் சுற்றியுள்ள மர்மத்தை அடிக்குறிப்பு தக்கவைக்கிறது.
- source_word: אֲנָשִׁים
  choice: மனிதர்கள்
  rationale: இங்கு கடவுளுக்கு எதிரிணையாக மனிதகுலத்தைச் சுட்டும் பன்மையாக இயல்பாகப் புரிகிறது; எபிரெயச் சொல்லின் ஆண்பால் வடிவை மாற்று வாசிப்பாகக் குறிப்பிடுகிறது.
- source_word: וַתּוּכָל
  choice: வெற்றிபெற்றாய்
  rationale: יכל இச்சூழலில் போராட்டத்தின் வெற்றிகரமான முடிவைக் குறிக்கிறது. இது கடவுளை முற்றிலும் தோற்கடித்ததாக மிகைப்படுத்தாமல், மேலோங்கியதன் பொருளைத் தருகிறது.
theological_decisions:
- issue: אֱלֹהִים என்பதன் சுட்டுப்பொருள்
  choice: கடவுள்
  alternative: தெய்வீக உயிர்கள் / தெய்வீக ஒருவர்
  rationale: உடனடிக் கதையமைப்பு யாக்கோபின் மர்மமான மல்லுக்கட்டலைக் கடவுளுடனான சந்திப்பாக விளக்குகிறது. அதேவேளை, எதிராளி மனித உருவில் தோன்றுவதால் நிலவும் அடையாளத் தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: אֲנָשִׁים என்பதன் பொருள்
  choice: மனிதர்கள்
  alternative: ஆண்கள்
  rationale: ‘கடவுளோடும் மனிதர்களோடும்’ என்ற பொதுவான எதிரிணை தமிழில் இயல்பாக உள்ளது. மூலச்சொல் ஆண்பால் பன்மையாக இருப்பதை அடிக்குறிப்பு மறைக்காமல் தெரிவிக்கிறது.
- issue: וַתּוּכָל குறிக்கும் வெற்றியின் தன்மை
  choice: வெற்றிபெற்றாய்
  alternative: மேலோங்கினாய் / நிலைத்துநின்றாய்
  rationale: போராட்டத்தில் வெற்றிகரமாக நிலைபெற்றதைச் சொல்கிறது; கடவுளை முழுமையாக வென்றுவிட்டதாக வலியுறுத்தும் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘எனப்படாது; எனப்படும்’ என்ற இணை அமைப்பு பெயர்மாற்ற அறிவிப்பின் செறிவைத் தக்கவைக்கிறது. ‘அவர்’ என்பது கதாபாத்திரத்தின் மர்மத்தையும் உரையின் கண்ணியத்தையும் காக்கிறது.
