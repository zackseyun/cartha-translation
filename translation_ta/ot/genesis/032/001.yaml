  text: וַ/יַּשְׁכֵּ֨ם לָבָ֜ן בַּ/בֹּ֗קֶר וַ/יְנַשֵּׁ֧ק לְ/בָנָ֛י/ו וְ/לִ/בְנוֹתָ֖י/ו וַ/יְבָ֣רֶךְ אֶתְ/הֶ֑ם וַ/יֵּ֛לֶךְ וַ/יָּ֥שָׁב לָבָ֖ן לִ/מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/001.yaml
  text: Laban rose early in the morning[a], kissed his sons and his daughters, and blessed them. Then Laban departed and returned to his place.
translation:
  language: ta
  text: லாபான் அதிகாலையில் எழுந்து, தன் மகன்களையும் மகள்களையும்[a] முத்தமிட்டு, அவர்களை ஆசீர்வதித்தான். பின்பு லாபான் புறப்பட்டு, தன் இடத்திற்குத் திரும்பினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தன் மகன்களையும் மகள்களையும்.” இவர்கள் லாபானின் வழித்தோன்றல்களை, அதாவது அவனுடைய பேரப்பிள்ளைகளைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: அதிகாலையில் எழுந்து
  rationale: שׁכם என்பதன் ஹிபில் வடிவம் அதிகாலையில் எழுவதைக் குறிக்கிறது; בַּבֹּקֶר உடன் சேர்ந்த இச்சொற்றொடரை இயல்பான நவீனத் தமிழில் இவ்வாறு வழங்கலாம்.
- source_word: וַיְנַשֵּׁק
  choice: முத்தமிட்டு
  rationale: இங்கு குடும்பத்தினருக்குக் கொடுக்கப்படும் பிரியாவிடை முத்தத்தைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: לְבָנָיו וְלִבְנוֹתָיו
  choice: தன் மகன்களையும் மகள்களையும்
  rationale: எபிரெய மூலத்தில் ஆண்பால், பெண்பால் உறவுச் சொற்கள் தனித்தனியாக உள்ளதால் அவற்றை அப்படியே தக்கவைக்கிறது; சூழலில் இவை வழித்தோன்றல்களையும் குறிக்கக்கூடும்.
- source_word: וַיְבָרֶךְ אֶתְהֶם
  choice: அவர்களை ஆசீர்வதித்தான்
  rationale: ברך என்பதன் அடிப்படைப் பொருளான ‘ஆசீர்வதி’ என்பதைப் பாதுகாக்கிறது; வெறும் பிரியாவிடை கூறுதல் என்று சுருக்கவில்லை.
- source_word: וַיֵּלֶךְ וַיָּשָׁב
  choice: புறப்பட்டு, ... திரும்பினான்
  rationale: 'தொடர்ச்சியான இரு இயக்க வினைகளையும் இயல்பான தமிழில் வேறுபடுத்திக் காட்டுகிறது: முதலில் புறப்படுதல், பின்னர் திரும்புதல்.'
- source_word: לִמְקֹמוֹ
  choice: தன் இடத்திற்கு
  rationale: מָקוֹם என்பதன் நேரடிப் பொருளான ‘இடம்’ என்பதைக் காக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘வீடு’ என்பதைச் சேர்க்கவில்லை.
theological_decisions:
- issue: பாலினத்தைக் குறிப்பாகக் காட்டும் உறவுமுறைச் சொற்கள்
  choice: தன் மகன்களையும் மகள்களையும்
  alternative: தன் பிள்ளைகளையும் / தன் பேரப்பிள்ளைகளையும்
  rationale: மூல எபிரெயம் ‘மகன்கள்’, ‘மகள்கள்’ என்று தனித்தனியாகக் கூறுகிறது. அவை இச்சூழலில் பேரப்பிள்ளைகள் உள்ளிட்ட வழித்தோன்றல்களைக் குறிக்க வாய்ப்பிருந்தாலும், முதன்மை உரை மூலத்தின் சொல் வடிவத்தைப் பாதுகாக்கிறது; சூழல்சார் விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயக் கதைநடையின் நிகழ்வுவரிசை காக்கப்பட்டு, தமிழில் இயல்பாக அமைய வினையெச்சத் தொடர் பயன்படுத்தப்பட்டுள்ளது.
