base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/006.yaml
  text: I have oxen and donkeys[a], flocks, male servants and female servants, and I have sent to tell my lord, so that I may find favor in your eyes.
translation:
  language: ta
  text: என்னிடம் மாடுகளும் கழுதைகளும், மந்தைகளும், வேலைக்காரர்களும் வேலைக்காரிகளும்[a] இருக்கின்றன. என் ஆண்டவருக்குத் தெரிவிக்க அனுப்பியிருக்கிறேன்; உமது கண்களில் எனக்குத் தயவு கிடைக்கும்படியாகவே அனுப்பியிருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண் அடிமைகளும் பெண் அடிமைகளும்.” எபிரெயச் சொற்கள் வீட்டுப் பணியாளர்களையோ அடிமைகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִי
  choice: என்னிடம் ... இருக்கிறார்கள்
  rationale: היה + ל possession-ஐக் குறிக்கும் எபிரெய மொழிமரபு. தமிழில் ‘என்னிடம் ... இருக்கிறார்கள்’ என்பது தற்போதைய உடைமையை இயல்பாகத் தெரிவிக்கிறது; உயிருள்ளவையும் உயிரற்றவையும் சேர்ந்த பட்டியல் என்பதால் வாக்கிய அமைப்பு தமிழுக்கேற்ப வடிவமைக்கப்பட்டது.
- source_word: שׁוֹר
  choice: மாடுகள்
  rationale: இச்சொல் பொதுவாக மாட்டினத்தைக் குறிக்கிறது; இங்கு உடைமைகளின் வகைப்பட்டியலில் கூட்டுப்பொருளாக வருவதால், நவீன தமிழில் இயல்பான ‘மாடுகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: חֲמוֹר
  choice: கழுதைகள்
  rationale: விலங்கு வகையைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது; பட்டியலின் கூட்டுப்பொருளுக்கேற்ப பன்மை பயன்படுத்தப்பட்டது.
- source_word: צֹאן
  choice: ஆடுமந்தைகள்
  rationale: צֹאן என்பது செம்மறியாடுகள், வெள்ளாடுகள் போன்ற சிறுகால்நடைகளைக் குறிக்கும் கூட்டுப்பெயர். ‘ஆடுமந்தைகள்’ அதன் மந்தைத் தன்மையைத் தக்கவைத்து, தேவையின்றி ஓர் இனமாகக் குறுக்காது.
- source_word: עֶבֶד וְשִׁפְחָה
  choice: வேலைக்காரர்களும் வேலைக்காரிகளும்
  rationale: ஆண், பெண் வேறுபாட்டைத் தக்கவைக்கும் இயல்பான நவீனத் தமிழ். இச்சொற்கள் அடிமை அல்லது கட்டுப்பட்ட வீட்டுப் பணியாளர் நிலையையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וָאֶשְׁלְחָה
  choice: ஆட்களை அனுப்பியிருக்கிறேன்
  rationale: யாக்கோபு இப்போதுதான் செய்த அனுப்புதலைத் தன் செய்தியில் விளக்குவதால் தமிழ் நிகழ்கால நிறைவுவினை இயல்பாகப் பொருந்துகிறது. செயப்படுபொருள் சூழலில் தூதுவர்களாக இருப்பதால் ‘ஆட்களை’ என வெளிப்படுத்தப்பட்டது.
- source_word: לְהַגִּיד לַאדֹנִי
  choice: இதை என் ஆண்டவருக்குத் தெரிவித்து
  rationale: עשׂாவின் முன் யாக்கோபு காட்டும் மரியாதையையும் தாழ்மையையும் ‘என் ஆண்டவர்’ காக்கிறது; இது இறைப்பட்டம் அல்ல. ‘தெரிவித்து’ என்பது செய்தியை அறிவித்தல் என்ற பொருளை இயல்பாக வழங்குகிறது.
- source_word: לִמְצֹא חֵן בְּעֵינֶיךָ
  choice: உமது கண்களில் எனக்குத் தயவு கிடைக்கும்படி
  rationale: ‘உமது கண்களில்’ என்ற எபிரெய உருவகத்தையும், சாதகமான பார்வை அல்லது அருள் பெறுதல் என்ற பொருளையும் தக்கவைக்கிறது.
theological_decisions:
- issue: עֶבֶד / שִׁפְחָה என்பவற்றை வீட்டுச் சொத்துப் பட்டியலில் மொழிபெயர்த்தல்
  choice: வேலைக்காரர்களும் வேலைக்காரிகளும்
  alternative: ஆண் அடிமைகளும் பெண் அடிமைகளும்
  rationale: மூலச்சொற்கள் கட்டுப்பட்ட பணியாளர் அல்லது அடிமை நிலையைக் குறிக்கக்கூடும்; ஆனால் இந்தச் செய்தியின் முதன்மை நோக்கம் யாக்கோபின் வீட்டாரையும் உடைமைகளையும் வகைப்படுத்துவதாகும். பிரதான உரை வாசிக்க இயல்பாக இருக்க, பாலின வேறுபாட்டைத் தக்கவைக்கும் சொற்கள் பயன்படுத்தப்பட்டு, கடுமையான மாற்றுப் பொருள் அடிக்குறிப்பில் வெளிப்படையாகக் கொடுக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வேதாகமச் செவ்வியும் கொண்ட நடை. ஏசாவை நோக்கிய பணிவை ‘என் ஆண்டவர்’, ‘உமது’ என்பவை வெளிப்படுத்துகின்றன. மூலத்தின் உடைமைப் பட்டியல் மற்றும் ‘கண்களில் தயவு’ என்ற உருவகம் காக்கப்பட்டுள்ளன.
