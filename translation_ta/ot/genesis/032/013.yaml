translation_notes:
  register: நவீன பொதுத்தமிழில், ஜெபத்தில் தேவனை மரியாதையுடன் நேரடியாக அழைக்கும் ‘நீர்/சொன்னீர்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. தேவன் யாக்கோபிடம் கூறிய மேற்கோளில் இயல்பான ஒருமை ‘உனக்கு/உன்’ தக்கவைக்கப்பட்டுள்ளது. மொழிநடை கண்ணியமானதாகவும் சாதாரண வாசகர்களுக்கு எளிதில் புரியக்கூடியதாகவும் உள்ளது.
