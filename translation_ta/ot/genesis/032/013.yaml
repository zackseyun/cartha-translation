base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/013.yaml
  text: But you said[a], ‘I will surely do you good, and I will make your offspring like the sand of the sea[c][b], which cannot be counted because of its abundance.’
translation:
  language: ta
  text: ஆனால் நீரோ, “நான் உனக்கு நிச்சயமாக நன்மை செய்வேன்[a]; உன் சந்ததியை[b]க் கடல் மணலைப்போல் ஆக்குவேன்; கடல் மணலின் மிகுதியால் அதை எண்ண முடியாது[c]” என்று சொன்னீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நான் உனக்கு உறுதியாக நன்மை செய்வேன்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் ஒரே வேரைச் சேர்ந்த முடிவுறா வினை வடிவமும் முற்றுவினையும் இணைந்து உறுதியை வலியுறுத்துகின்றன.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “உன் வழிவந்தவர்கள்.” எபிரெயச் சொல் ஒருமை வடிவிலுள்ள கூட்டுப்பெயராக, வழிவந்தவர்களை ஒரு குழுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது “அதை எண்ணிக் கணக்கிட முடியாது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה אָמַרְתָּ
  choice: ஆனால் நீரோ, … என்று சொன்னீர்
  rationale: இணைப்புச்சொல்லுடன் வரும் தனிப்பட்ட சுட்டுப்பெயர், தற்போதைய ஆபத்துக்கு எதிராக தேவனுடைய வாக்குறுதியை யாக்கோபு வலியுறுத்துவதை காட்டுகிறது. ‘ஆனால் நீரோ’ என்பது அந்த எதிர்மறை வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: הֵיטֵב אֵיטִיב עִמָּךְ
  choice: நான் உனக்கு நிச்சயமாக நன்மை செய்வேன்
  rationale: முற்றுவினையுடன் ஒரே வேரின் வினையெச்சப் பெயர் சேர்ந்து வலியுறுத்துகிறது; ‘நிச்சயமாக’ அந்த வலிமையைத் தக்கவைக்கிறது. עִם இங்கு ஒருவருக்குப் பயனளிக்கும் செயலைக் குறிக்கிறது.
- source_word: וְשַׂמְתִּי
  choice: ஆக்குவேன்
  rationale: சந்ததியை கடல் மணலுக்கு ஒப்பாக்கும் சூழலில் שׂים என்பதன் இயல்பான பொருள் ‘ஆக்குதல்’; ‘வைப்பேன்’ என்பது தமிழில் தேவையற்ற சொல்லுக்குச் சொல் தன்மையைத் தரும்.
- source_word: זַרְעֲךָ
  choice: உன் சந்ததி
  rationale: זֶרַע என்பது ஒருமை வடிவில் இருந்தாலும் ஒரு வம்சக் குழுவை மொத்தமாகக் குறிக்கும் கூட்டுப்பெயர். ‘சந்ததி’ அந்த வடிவத்தையும் பொருளையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: כְּחוֹל הַיָּם
  choice: கடல் மணலைப்போல்
  rationale: எண்ண முடியாத பெருந்தொகையைக் குறிக்கும் எபிரெய உருவகத்தைச் சுருக்கமோ விரிவாக்கமோ இன்றி இயல்பான தமிழில் தருகிறது.
- source_word: אֲשֶׁר לֹא יִסָּפֵר מֵרֹב
  choice: அது மிகுதியாக இருப்பதால் அதை எண்ண முடியாது
  rationale: Niphal வினை நடைமுறையில் எண்ண இயலாமையைக் காட்டுகிறது; מֵרֹב அந்த இயலாமைக்கான காரணம் மிகுதி என்பதைத் தெரிவிக்கிறது.
