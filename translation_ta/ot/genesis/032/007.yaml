  text: וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים אֶֽל יַעֲקֹ֖ב לֵ/אמֹ֑ר בָּ֤אנוּ אֶל אָחִ֨י/ךָ֙ אֶל עֵשָׂ֔ו וְ/גַם֙ הֹלֵ֣ךְ לִ/קְרָֽאתְ/ךָ֔ וְ/אַרְבַּע מֵא֥וֹת אִ֖ישׁ עִמּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/007.yaml
  text: The messengers returned to Jacob[a], saying, “We came to your brother, to Esau, and he is also coming to meet you, and four hundred men are with him.”
translation:
  language: ta
  text: அந்தத் தூதர்கள் யாக்கோபிடம் திரும்பிவந்து[a], “நாங்கள் உங்கள் சகோதரனாகிய ஏசாவிடம் சென்றோம். அவனும் உங்களைச் சந்திக்க வந்துகொண்டிருக்கிறான்; அவனோடு நானூறு ஆண்கள் இருக்கிறார்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இச்சூழலில் பொருந்துவதற்கான வாய்ப்பு குறைவாக, “அந்தத் தேவதூதர்கள் யாக்கோபிடம் திரும்பிவந்தார்கள்.” எபிரெயச் சொல்லான מַלְאָכִים என்பதற்கு “தூதர்கள்” அல்லது “தேவதூதர்கள்” என்று பொருள் கொள்ளலாம்; ஆனால் இங்கு அது யாக்கோபு ஏசாவிடம் அனுப்பிய ஆட்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: திரும்பிவந்து
  rationale: שוב என்பதன் தொடர்கதை இறந்தகால வடிவம்; அனுப்பப்பட்டவர்கள் யாக்கோபிடம் திரும்பியதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַמַּלְאָכִים
  choice: அந்தத் தூதர்கள்
  rationale: מַלְאָך என்பது ‘தூதர்’ அல்லது ‘தேவதூதர்’ எனப் பொருள்படலாம். உடனடி சூழலில் யாக்கோபு ஏசாவிடம் அனுப்பிய மனிதத் தூதர்களையே குறிக்கிறது.
- source_word: לֵאמֹר
  choice: என்றார்கள்
  rationale: நேர்க் கூற்றை அறிமுகப்படுத்தும் எபிரெய அமைப்பை இயல்பான தமிழ் உரையாடல் முடிவாக வழங்குகிறது.
- source_word: בָּאנוּ
  choice: நாங்கள் ... சென்றோம்
  rationale: בוא அடிப்படையில் ‘வந்தோம்’ எனினும், யாக்கோபின் இடத்திலிருந்து ஏசாவிடம் அனுப்பப்பட்டவர்கள் அறிக்கையிடும் தமிழ்ச் சூழலில் ‘சென்றோம்’ இயல்பாகவும் திசைப்பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: אָחִיךָ אֶל־עֵשָׂו
  choice: உங்கள் சகோதரனாகிய ஏசாவிடம்
  rationale: இரண்டாவது אֶל, ‘உங்கள் சகோதரன்’ என்பவர் ஏசா என்று அடையாளப்படுத்துகிறது; தமிழில் appositional உறவை ‘ஆகிய’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְגַם הֹלֵךְ לִקְרָאתְךָ
  choice: அவனும் உங்களைச் சந்திக்க வந்துகொண்டிருக்கிறான்
  rationale: גם என்பதன் சேர்க்கைப் பொருளையும், הֹלֵךְ பங்கேற்பு வடிவத்தின் தொடர்நிலை உணர்வையும், לִקְרָאתְךָ என்பதன் எதிர்கொண்டு சந்திக்க வரும் இயக்கத்தையும் காக்கிறது.
- source_word: וְאַרְבַּע מֵאוֹת אִישׁ עִמּוֹ
  choice: அவனோடு நானூறு ஆண்கள் இருக்கிறார்கள்
  rationale: אִישׁ இங்கு ஏசாவுடன் வரும் ஆண் குழுவைக் குறிக்கிறது. எபிரெயில் வெளிப்படாத இணைப்புவினையை தமிழில் ‘இருக்கிறார்கள்’ என்று நிரப்புவது இயல்பானது.
