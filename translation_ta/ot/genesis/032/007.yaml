translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. யாக்கோபை நோக்கிய பன்மை மரியாதை ‘உங்கள்/உங்களை’ பயன்படுத்தப்பட்டுள்ளது. ‘வந்துகொண்டிருக்கிறான்’ என்பது எபிரெயப் பங்கேற்பு வடிவத்தின் நடைபெற்று வரும் இயக்கத்தைத் தக்கவைக்கிறது.
