translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரேய மொழிநடையான ‘தன் கைக்கு வந்தவற்றிலிருந்து’ முதன்மை உரையில் வைக்கப்பட்டு, அதன் இயல்பான தமிழ் மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன. அடுத்த வசனங்களில் பரிசுப் பொருட்களின் பட்டியல் தொடர்வதால் இறுதியில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது.
