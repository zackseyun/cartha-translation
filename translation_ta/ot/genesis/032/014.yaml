  text: וַ/יָּ֥לֶן שָׁ֖ם בַּ/לַּ֣יְלָה הַ/ה֑וּא וַ/יִּקַּ֞ח מִן הַ/בָּ֧א בְ/יָד֛/וֹ מִנְחָ֖ה לְ/עֵשָׂ֥ו אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/014.yaml
  text: 'So he spent that night there[a], and he took from what came to his hand a gift for Esau his brother:'
translation:
  language: ta
  text: 'அவன் அந்த இரவு அங்கே தங்கினான்; தன் கைக்கு வந்தவற்றிலிருந்து[a] தன் சகோதரன் ஏசாவுக்காக ஒரு பரிசை எடுத்தான்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் இயல்பாக, “தன்னிடம் இருந்தவற்றிலிருந்து” அல்லது “தன் கைவசம் இருந்தவற்றிலிருந்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּלֶן
  choice: தங்கினான்
  rationale: לון என்பது இரவைக் கழிப்பதற்காகத் தங்குவதைக் குறிக்கிறது. ‘அந்த இரவு’ என்பதுடன் சேர்ந்து ‘தங்கினான்’ என்பது இயல்பாகவும் தெளிவாகவும் இப்பொருளைத் தருகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் எளிய வினையடை; எபிரேயச் சொல்லின் நேரான பொருளைத் தருகிறது.
- source_word: בַּלַּיְלָה הַהוּא
  choice: அந்த இரவு
  rationale: சொல்லுக்குச் சொல் ‘அந்த இரவில்’ என்று பொருள்; நவீன தமிழில் ‘அந்த இரவு’ என்பது இயல்பான காலக் குறிப்பு.
- source_word: וַיִּקַּח
  choice: எடுத்தான்
  rationale: לקח என்பதன் வழக்கமான பொருள் ‘எடு’. அடுத்துவரும் பட்டியலுக்காக யாக்கோபு சிலவற்றைத் தனியே எடுத்த செயலை இது விரிவுபடுத்தாமல் தெரிவிக்கிறது.
- source_word: מִן הַבָּא בְיָדוֹ
  choice: தன் கைக்கு வந்தவற்றிலிருந்து
  rationale: எபிரேய மொழிநடையின் உருவகத்தைத் தக்கவைத்து, அவனிடம் அப்போது கிடைத்த அல்லது அவன் கைவசம் இருந்தவற்றைக் குறிக்கிறது. இயல்பான மாற்று மொழிபெயர்ப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: מִנְחָה
  choice: ஒரு பரிசை
  rationale: இங்கு מִנְחָה வழிபாட்டுப் பலியைக் காட்டிலும் ஒருவரை மதிக்க அல்லது சமாதானப்படுத்த வழங்கப்படும் பரிசைக் குறிக்கிறது. ‘காணிக்கை’ என்பது தேவையற்ற வழிபாட்டுச் சாயலை ஏற்படுத்தலாம்.
- source_word: לְעֵשָׂו אָחִיו
  choice: தன் சகோதரன் ஏசாவுக்காக
  rationale: לְ பெறுபவரைக் குறிக்கிறது; உறவுமுறையையும் ஏசாவின் பெயரையும் வெளிப்படையாகப் பாதுகாக்கிறது.
