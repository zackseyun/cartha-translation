base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/019.yaml
  text: Then you shall say[a], ‘Your servant Jacob's gift is sent to my lord, to Esau; and look[b], he also is behind us.’
translation:
  language: ta
  text: அப்போது நீ, ‘உமது அடியான் யாக்கோபின் பரிசு[a] என் ஆண்டவராகிய ஏசாவுக்கு அனுப்பப்பட்டுள்ளது; இதோ, அவனும் எங்களுக்குப் பின்னால் இருக்கிறான்[b]’ என்று சொல்ல வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பரிசு’ என்பதற்கான எபிரெயச் சொல் மின்ஹா; இங்கு அது ஏசாவைச் சமாதானப்படுத்த அனுப்பப்பட்ட ‘அன்பளிப்பு’ அல்லது ‘மரியாதைப் பரிசு’ என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவனும் எங்களுக்குப் பின்னால் வந்துகொண்டிருக்கிறான்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָֽמַרְתָּ
  choice: அப்போது நீ ... என்று சொல்ல வேண்டும்
  rationale: வாவ் இணைப்புடன் வந்த நிறைவுவினை, யாக்கோபு தொடர்ந்து கொடுக்கும் கட்டளையைக் குறிக்கிறது. ‘அப்போது’ நிகழ்வின் தொடர்ச்சியையும், ‘சொல்ல வேண்டும்’ கட்டளையின் வலிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: לְעַבְדְּךָ לְיַעֲקֹב
  choice: உமது அடியான் யாக்கோபின்
  rationale: ஏசாவுக்கு முன்பாக யாக்கோபு தன்னைத் தாழ்மையுடன் குறிப்பிடும் மரியாதைச் சூத்திரத்தை இது காக்கிறது; பரிசு யாக்கோபுடையது என்பதையும் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: מִנְחָה
  choice: பரிசு
  rationale: இங்கு இது வழிபாட்டுச் சடங்குக்குரிய பலியைக் குறிக்காமல், ஏசாவைச் சமாதானப்படுத்த அனுப்பப்பட்ட பொருளைக் குறிக்கிறது. ‘பரிசு’ என்பது பொதுவாகப் புரியும் இயல்பான சொல்.
- source_word: שְׁלוּחָה
  choice: அனுப்பப்பட்டுள்ளது
  rationale: பெண்பால் செயல்பாட்டு எச்சவடிவம், பரிசு அனுப்பப்பட்ட நிலையில் இருப்பதைக் காட்டுகிறது. தமிழ் வடிவம் அதன் செயப்பாட்டு பொருளைக் காக்கிறது.
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: என் ஆண்டவராகிய ஏசாவுக்கு
  rationale: ஆதோன் இங்கு சமூக மரியாதையையும் யாக்கோபின் பணிவையும் காட்டும் பட்டம். ‘ஆண்டவராகிய’ என்பது ஏசாவை அந்த மரியாதைப் பட்டத்துடன் அடையாளப்படுத்துகிறது; தெய்வீகப் பட்டமாக இதை மாற்றவில்லை.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: அடுத்து சொல்லப்படுவதற்கு கவனத்தை ஈர்க்கும் உரையாடல் இடைச்சொல்லை, கண்ணியமும் இயல்பும் கொண்ட தமிழில் தருகிறது.
- source_word: גַם הוּא
  choice: அவனும்
  rationale: பரிசுகளைத் தொடர்ந்து யாக்கோபும் வருகிறான் என்ற சேர்க்கை வலியுறுத்தலை ‘-உம்’ தெளிவாகக் காக்கிறது.
- source_word: אַחֲרֵינוּ
  choice: எங்களுக்குப் பின்னால் இருக்கிறான்
  rationale: யாக்கோபு மந்தைகளையும் பணியாளர்களையும் தொடர்ந்து பின்னால் உள்ள நிலையை நேரடியாகத் தருகிறது; இயக்கத்தை வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் இடவியல் अस्पष्टத்தன்மையை காக்கிறது.
