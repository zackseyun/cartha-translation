  yaml_path: translation/ot/genesis/032/018.yaml
  text: And he commanded the first one, saying, “When Esau my brother meets you and asks you, ‘Whose are you, and where are you going, and whose are these before you?’...”
translation:
  language: ta
  text: 'அவன் முதலாமவனுக்குக் கட்டளையிட்டான்: “என் சகோதரன் ஏசா உன்னைச் சந்தித்து, ‘நீ யாருடையவன்? எங்கே போகிறாய்? உனக்கு முன்னால் உள்ள இவை யாருடையவை?’ என்று கேட்டால்—”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִאשׁוֹן
  choice: முதலில் சென்றவன்
  rationale: சூழலில் மந்தைகளுடன் முன்னால் அனுப்பப்பட்ட ஊழியர்களில் முதலாமவனைக் குறிக்கிறது; தமிழில் இயல்பாகத் தெளிவுபடுத்துகிறது.
- source_word: לְמִי אַתָּה
  choice: நீ யாருடையவன்?
  rationale: எபிரேய மொழியின் உடைமை/சார்பு வினாவை அப்படியே காக்கிறது; ‘நீ யாரைச் சேர்ந்தவன்?’ என்பதையும் பொருளாகக் கொள்ளலாம்.
- source_word: וְאָנָה תֵלֵךְ
  choice: எங்கே போகிறாய்?
  rationale: இலக்கை வினவும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: וּלְמִי אֵלֶּה לְפָנֶיךָ
  choice: உனக்கு முன்னால் செல்பவை யாருடையவை?
  rationale: אֵלֶּה என்பதன் பன்மையையும், לְפָנֶיךָ என்பதன் இடத்தொடர்பையும் காக்கிறது; சூழலிலுள்ள மந்தைகளைக் குறித்தாலும் பெயரை உரையில் சேர்க்கவில்லை.
