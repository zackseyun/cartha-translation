translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனை வாக்கியமாக இருப்பதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது; மூலத்தில் இருமுறை வரும் ‘சொல்லி/என்று’ என்ற அறிமுகத்தைத் தமிழில் தேவையற்ற மீளுரையாக்கம் தவிர்க்க ஒருமுறை மட்டுமே இயல்பாக்கியுள்ளது.
