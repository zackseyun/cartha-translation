base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/025.yaml
  text: And Jacob was left alone[b][a], and a man wrestled with him until the dawn came up.
translation:
  language: ta
  text: யாக்கோபு தனியே விடப்பட்டான்; ஒரு மனிதன்[b] விடியல் எழும்வரை[a] அவனோடு மல்யுத்தம் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பொழுது விடியும்வரை’; சொல்லர்த்தமாக, ‘விடியல் எழும்வரை.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெய உரை ‘ஒரு மனிதன்’ என்று கூறுகிறது; பின்னரும் வரும் சூழலும் ஓசியா 12:4-உம் அவர் யார் என்பதை இன்னும் முழுமையாக அறிந்துகொள்ள உதவுகின்றன.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּוָּתֵר
  choice: விடப்பட்டான்
  rationale: יתר என்பதன் நிஃபால் வடிவிலுள்ள செயப்பாட்டு நுணுக்கத்தைப் பாதுகாக்கிறது. சூழலில் மற்றவர்கள் கடந்துசென்றபின் யாக்கோபு தனியே விடப்பட்டதாகக் கதை சொல்கிறது.
- source_word: לְבַדּוֹ
  choice: தனியே
  rationale: யாக்கோபின் தனிமையை இயல்பான, சுருக்கமான தமிழில் வலியுறுத்துகிறது.
- source_word: וַיֵּאָבֵק
  choice: மல்யுத்தம் செய்தான்
  rationale: அரிதாக வரும் אבק என்ற வினை பொதுவான போராட்டத்தை மட்டுமல்லாமல் உடலோடு உடல் பற்றிப் போராடுவதைக் குறிக்கிறது; தமிழில் ‘மல்யுத்தம் செய்தான்’ என்பது அதற்குத் துல்லியமான இயல்பான இணை.
- source_word: אִישׁ
  choice: ஒரு மனிதன்
  rationale: எபிரெய உரை இங்கு அந்த மர்ம நபரை வெளிப்படையாக ‘ஒரு மனிதன்’ என்றே அறிமுகப்படுத்துகிறது; பின்னர் கிடைக்கும் அடையாள விளக்கத்தை இவ்வசனத்திற்குள் முன்கூட்டியே கொண்டுவரவில்லை.
- source_word: עִמּוֹ
  choice: அவனோடு
  rationale: அந்த மனிதன் யாக்கோபோடு மல்யுத்தம் செய்தான் என்பதைக் குறிக்கும் நேரடியான முன்னிடைச்சொல் தொடர்.
- source_word: עַד עֲלוֹת הַשָּׁחַר
  choice: விடியல் எழும்வரை
  rationale: ‘விடியல் எழுதல்’ என்ற மூல உருவகத்தைத் தக்கவைத்தபடியே நவீனத் தமிழில் இயல்பாக ஒலிக்கிறது; ‘பொழுது விடியும்வரை’ என்பதும் பொருள்சார் மாற்றாகும்.
theological_decisions:
- issue: மல்யுத்தம் செய்த אִישׁ என்பவரின் அடையாளம்
  choice: முதன்மை உரையில் ‘ஒரு மனிதன்’ என்று மட்டும் மொழிபெயர்த்து, அவரைத் தேவதூதர் அல்லது கடவுள் என்று இங்கேயே அடையாளப்படுத்தாமல் விடுதல்.
  alternative: ‘ஒரு தேவதூதர்’ அல்லது ‘மனித உருவில் வந்த கடவுள்/கர்த்தர்’ என்று மொழிபெயர்த்தல்.
  rationale: இந்த வசனம் அவரை ‘ஒரு மனிதன்’ என்று மட்டுமே கூறுகிறது. ஓசியா 12:4 மற்றும் தொடரும் கதை அவரது அடையாளத்தை மேலும் விளக்கினாலும், மொழிபெயர்ப்பு இவ்வசனத்தின் உடனடி கதைநிலை மர்மத்தையும் இறையியல் பதற்றத்தையும் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘விடப்பட்டான்’ என்பது எபிரெயச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; ‘ஒரு மனிதன்’ என்பது கதையின் மர்மத்தை முன்கூட்டியே தீர்க்காமல் தக்கவைக்கிறது. மூலத்தின் தொடர்ச்சியான இணைப்பை தமிழில் இயல்பான அரைப்புள்ளி வழியாகக் காட்டியுள்ளோம்.
