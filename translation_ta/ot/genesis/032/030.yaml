source:
  edition: WLC
  text: וַ/יִּשְׁאַ֣ל יַעֲקֹ֗ב וַ/יֹּ֨אמֶר֙ הַגִּֽידָ/ה נָּ֣א שְׁמֶ֔/ךָ וַ/יֹּ֕אמֶר לָ֥/מָּה זֶּ֖ה תִּשְׁאַ֣ל לִ/שְׁמִ֑/י וַ/יְבָ֥רֶךְ אֹת֖/וֹ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/030.yaml
  text: Then Jacob asked[a], “Please tell me your name.” But he said[c][b], “Why is it that you ask my name?” And he blessed him there.
translation:
  language: ta
  text: அப்போது யாக்கோபு, “தயவுசெய்து உங்கள் பெயரை எனக்குச் சொல்லுங்கள்” என்று கேட்டான். அதற்கு அவர், “என் பெயரை ஏன் கேட்கிறாய்?” என்றார். அங்கே அவர் யாக்கோபை ஆசீர்வதித்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... וַיֹּאמֶר
  choice: என்று கேட்டான்
  rationale: எபிரெயக் கதையாடலில் வரும் ‘கேட்டு, சொன்னான்’ என்ற இரட்டைச் சொல்லாக்கத்தை, பொருள் இழப்பின்றி இயல்பான நவீனத் தமிழில் ‘என்று கேட்டான்’ என வழங்குகிறது.
- source_word: הַגִּידָה נָּא
  choice: தயவுசெய்து ... சொல்லுங்கள்
  rationale: נגד என்பதன் Hiphil கட்டளை வடிவம் ‘சொல்/தெரிவி’ என்றும், נָא வேண்டுகோளை மென்மையாக்குவதாகவும் இருப்பதால், பணிவான கோரிக்கையாக மொழிபெயர்க்கப்பட்டது.
- source_word: שְׁמֶךָ
  choice: உங்கள் பெயரை
  rationale: ‘உமது பெயர்’ என்ற நேரடியான பொருளை, சாதாரண வாசகருக்கு இயல்பான மரியாதைத் தமிழில் தருகிறது; பெயரின் அடையாள முக்கியத்துவத்தை விளக்கமாகச் சேர்க்கவில்லை.
- source_word: לָמָּה זֶּה תִּשְׁאַל לִשְׁמִי
  choice: என் பெயரை ஏன் கேட்கிறாய்?
  rationale: לָמָּה זֶּה என்ற எபிரெய வினாவைச் செயற்கையான சொற்படி நடையின்றி இயல்பான தமிழில் தருகிறது; கேள்வியின் நேரடியான வலிமை நீடிக்கிறது.
- source_word: וַיְבָרֶךְ אֹתוֹ שָׁם
  choice: அங்கே அவர் யாக்கோபை ஆசீர்வதித்தார்
  rationale: ‘அங்கே அவனை ஆசீர்வதித்தார்’ என்ற பொருளைத் தெளிவாக வழங்குகிறது. தமிழில் இரு ஆண்பால் சுட்டுப்பெயர்கள் குழப்பம் தரக்கூடும் என்பதால், ஆசீர்வாதம் பெற்றவரை ‘யாக்கோபு’ என்று மீண்டும் குறிப்பிட்டுள்ளது.
theological_decisions:
- issue: தமது பெயரைச் சொல்ல மறுக்கும் பேச்சாளரின் அடையாளம்
  choice: ‘அவர்’ என்ற சுட்டுப்பெயரால் அடையாளத்தைத் திறந்தே வைத்தல்
  alternative: ‘அந்த மனிதர்’, ‘தேவன்’ அல்லது ‘தூதன்’ என்று வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: இந்த வசனத்தின் எபிரெய உரையில் வினைச்சொற்களின் எழுவாய் வெளிப்படையாகப் பெயரிடப்படவில்லை. சுற்றியுள்ள நிகழ்ச்சி பல்வேறு இறையியல் அடையாளப்படுத்தல்களுக்கு வழிவகுத்தாலும், வசனம் தானாகச் சொல்லாத அடையாளத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. யாக்கோபின் வேண்டுகோளில் மரியாதைப் பன்மை இடம்பெறுகிறது; மறுமொழியில் உள்ள ஒருமைத் தொடர்பு ‘கேட்கிறாய்’ எனப் பாதுகாக்கப்பட்டுள்ளது. மூலத்தில் மறைந்திருக்கும் பேச்சாளரின் அடையாளம் ‘அவர்’ என்பதன் மூலம் தீர்மானிக்கப்படாமல் வைக்கப்பட்டுள்ளது.
