base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/012.yaml
  text: Please deliver me from the hand of my brother[a], from the hand of Esau, for I am afraid of him, lest he come and strike me[b], the mother with the children.
translation:
  language: ta
  text: என் சகோதரனின் கையிலிருந்தும், ஏசாவின் கையிலிருந்தும் என்னைத் தயவுசெய்து காப்பாற்றும். ஏனெனில், நான் அவனைப் பற்றி பயப்படுகிறேன்; அவன் வந்து என்னையும் தாயையும் பிள்ளைகளையும் தாக்கிவிடுவானோ என்று அஞ்சுகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், சொல்லுக்கு சொல், “தாய் பிள்ளைகள்மேல்” என்று உள்ளது. இது தாயையும் அவளுடைய பிள்ளைகளையும் ஒன்றாகத் தாக்குவதைக் குறிக்கும் மொழிமரபு.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי נָא
  choice: என்னைத் தயவுசெய்து காப்பாற்றும்
  rationale: נצל என்பதன் ஹிஃபில் கட்டளை வடிவம் விடுவித்தல் அல்லது அபாயத்திலிருந்து காப்பாற்றுதல் எனப் பொருள்படும்; נָא வேண்டுதலின் பணிவை வெளிப்படுத்துகிறது. தமிழில் இறைவேண்டுதலுக்கேற்ற மரியாதை ஒருமையுடன் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: מִיַּד אָחִי מִיַּד עֵשָׂו
  choice: என் சகோதரனாகிய ஏசாவின் கையிலிருந்து
  rationale: ‘கையிலிருந்து’ என்பது ஒருவரின் அதிகாரம் அல்லது தாக்குதலிலிருந்து விடுவித்தல் என்ற எபிரேய உருவகத்தைத் தக்கவைக்கிறது. இரு தொடர்களும் ஒரே நபரை விளக்குவதால் தமிழில் இயல்பான இணைப்பாக வழங்கப்பட்டுள்ளன.
- source_word: כִּי יָרֵא אָנֹכִי אֹתוֹ
  choice: ஏனெனில் ... நான் அவனுக்குப் பயப்படுகிறேன்
  rationale: யாக்கோபின் தற்போதைய அச்சத்தையும் வேண்டுதலுக்கான காரணத்தையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: פֶּן יָבוֹא וְהִכַּנִי
  choice: அவன் வந்து என்னையும் ... தாக்கிவிடுவானோ என்று
  rationale: פֶּן அச்சத்திற்குரிய சாத்தியத்தைச் சுட்டுகிறது; נכה என்பதன் பரந்த ‘அடி/தாக்கு’ பொருளை ‘தாக்கு’ காக்கிறது, ‘கொல்’ என்று மிகையாகத் தீர்மானிக்கவில்லை.
- source_word: אֵם עַל בָּנִים
  choice: தாய்மார்களையும் பிள்ளைகளையும்
  rationale: சொல்லுக்கு சொல் ‘பிள்ளைகள்மேல் தாய்’ என்பது தமிழில் பொருள் மங்கச் செய்யும். சூழலில் யாக்கோபின் குடும்பத்திலுள்ள தாய்மார்களும் அவர்களின் பிள்ளைகளும் சேர்ந்து தாக்கப்படுவார்கள் என்ற அச்சத்தை இயல்பாகத் தெரிவிக்கிறது; எபிரேய ஒருமையின் மொழிமரபுச் சுருக்கம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: אֵם עַל בָּנִים என்ற வன்முறை மொழிமரபின் பொருள்
  choice: தாய்மார்களையும் பிள்ளைகளையும்
  alternative: பிள்ளைகளோடு தாயையும் / பிள்ளைகள்மேல் தாயையும்
  rationale: இந்தச் சொற்றொடர் தாயும் பிள்ளைகளும் ஒன்றாகத் தாக்கப்படும் குடும்ப அழிவைக் குறிக்கிறது. தமிழில் யாக்கோபின் பல மனைவியரையும் அவர்களின் பிள்ளைகளையும் தெளிவாகக் குறிக்கப் பன்மை பயன்படுத்தப்பட்டுள்ளது; ‘கொன்றுவிடு’ என வன்முறையின் முடிவை உரை கூறுவதைவிடத் திட்டவட்டமாக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; இறைவனை நோக்கிய பணிவான வேண்டுதலுக்காக மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. எபிரேய உருவகமான ‘கையிலிருந்து’ தக்கவைக்கப்பட்டு, தெளிவற்ற குடும்ப-அழிவு மொழிமரபு முதன்மை உரையில் இயல்பாகவும் அடிக்குறிப்பில் நேரடியாகவும் வழங்கப்பட்டுள்ளது.
