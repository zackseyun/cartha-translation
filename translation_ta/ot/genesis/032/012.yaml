revisions:
- from: என் சகோதரனாகிய ஏசாவின் கையிலிருந்து என்னைத் தயவுசெய்து காப்பாற்றும். ஏனெனில், அவன் வந்து என்னையும், தாய்மார்களையும் பிள்ளைகளையும் தாக்கிவிடுவானோ என்று நான் அவனுக்குப் பயப்படுகிறேன்.[a]
  to: என் சகோதரனின் கையிலிருந்தும், ஏசாவின் கையிலிருந்தும் என்னைத் தயவுசெய்து காப்பாற்றும். ஏனெனில், நான் அவனைப் பற்றி பயப்படுகிறேன்; அவன் வந்து என்னையும் தாயையும் பிள்ளைகளையும் தாக்கிவிடுவானோ என்று அஞ்சுகிறேன்.[a]
  rationale: The revision restores the repeated “from the hand of,” retains the singular “mother” of the Hebrew idiom, and uses natural Tamil syntax to express the feared attack without overstating it as killing. The footnote preserves the difficult Hebrew image and explains its idiomatic force.
  reviewer_model: gpt-5.6-terra
