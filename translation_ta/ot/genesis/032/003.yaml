  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ כַּ/אֲשֶׁ֣ר רָאָ֔/ם מַחֲנֵ֥ה אֱלֹהִ֖ים זֶ֑ה וַ/יִּקְרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא מַֽחֲנָֽיִם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/003.yaml
  text: When Jacob saw them[a], he said, “This is God’s camp.” So he called the name of that place Mahanaim.
translation:
  language: ta
  text: யாக்கோபு அவர்களைக் கண்டபோது, “இது கடவுளின் முகாம்” என்றான். எனவே, அந்த இடத்திற்கு மகனாயீம்[a] என்று பெயரிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மகனாயீம்” என்ற பெயர் “இரண்டு முகாம்கள்” அல்லது “இரட்டை முகாம்” என்ற பொருளை உணர்த்துகிறது; “இது கடவுளின் முகாம்” என்ற யாக்கோபின் வார்த்தைகளை அது எதிரொலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: אמר என்ற வினை யாக்கோபின் நேரடிக் கூற்றை அறிமுகப்படுத்துகிறது. தமிழில் மேற்கோளுக்குப் பின் வரும் “என்றான்” இயல்பான கதைநடை வடிவம்; மூலத்தில் இல்லாத “தனக்குள்” அல்லது “வியந்து” போன்ற கருத்துகளைச் சேர்க்கவில்லை.
- source_word: כַּאֲשֶׁר רָאָם
  choice: அவர்களைக் கண்டபோது
  rationale: כַּאֲשֶׁר இங்கு காலச் சூழலைக் குறிக்கிறது; רָאָם என்பதிலுள்ள மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டு முந்தைய வசனத்தின் கடவுளுடைய தூதர்களைக் குறிக்கிறது. நபர்களுக்குரிய இயல்பான தமிழாக “அவர்களை” பயன்படுத்தப்பட்டுள்ளது.
- source_word: מַחֲנֵה אֱלֹהִים זֶה
  choice: இது கடவுளின் முகாம்
  rationale: מַחֲנֵה אֱלֹהִים என்பது “கடவுளின் முகாம்” என்ற உடைமைத் தொடர்பைத் தருகிறது; זֶה பயனிலைச் சுட்டாக இருப்பதால் தமிழில் “இது” என்று இயல்பாக அமைக்கப்பட்டுள்ளது. “முகாம்” என்பது இடப்பெயருடனான சொல்விளையாட்டையும் காக்கிறது.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: எனவே, அந்த இடத்திற்கு … என்று பெயரிட்டான்
  rationale: எபிரேய மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் வழங்குகிறது. தொடர்ச்சியான விளைவைக் காட்ட וַ־ என்பதற்கு இங்கு “எனவே” பொருத்தமாக உள்ளது.
- source_word: מַחֲנָיִם
  choice: மகனாயீம்
  rationale: இது ஓர் இடப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது. அதன் இருமை வடிவமும் “முகாம்” என்பதுடனான தொடர்பும் அடிக்குறிப்பில் விளக்கப்படுகின்றன.
