  text: וַ/יֹּ֕אמֶר אִם יָב֥וֹא עֵשָׂ֛ו אֶל הַ/מַּחֲנֶ֥ה הָ/אַחַ֖ת וְ/הִכָּ֑/הוּ וְ/הָיָ֛ה הַ/מַּחֲנֶ֥ה הַ/נִּשְׁאָ֖ר לִ/פְלֵיטָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/009.yaml
  text: He said[a], “If Esau comes to the one camp and strikes it, then the camp that remains will escape.”
translation:
  language: ta
  text: அவன், “ஏசா அந்த ஒரு முகாமுக்கு வந்து அதைத் தாக்கினால், மீதியிருக்கும் முகாம் தப்பித்துக்கொள்ளும்[a]” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீதியிருக்கும் முகாம் தப்பிப் பிழைக்கும் ஒன்றாக இருக்கும்”; அதாவது, அது அழிவிலிருந்து தப்பும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவன் … என்று சொன்னான்
  rationale: வழக்கமான எபிரெயக் கதைநடை வினைமுற்றை இயல்பான தமிழில் இறந்தகாலமாகத் தருகிறது; தொடக்க இணைப்பைத் தனியாக மொழிபெயர்க்காமல் தமிழின் மேற்கோள் அமைப்பைப் பயன்படுத்துகிறது.
- source_word: אִם
  choice: …னால்
  rationale: யாக்கோபின் எண்ணத்தில் உள்ள நிபந்தனையையும் உறுதியின்மையையும் காக்கும் இயல்பான தமிழ் நிபந்தனை வடிவம்.
- source_word: יָבֹא
  choice: வந்து
  rationale: בוא என்பதன் அடிப்படைப் பொருளான ‘வருதல்’ என்பதையே தருகிறது; பகைமைச் செயல் அடுத்த வினையால் வெளிப்படுவதால் இதை ‘தாக்க வருதல்’ என விரிவாக்கவில்லை.
- source_word: עֵשָׂו
  choice: ஏசா
  rationale: தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: אֶל־הַמַּחֲנֶה הָאַחַת
  choice: ஒரு முகாமுக்கு
  rationale: முன்பு பிரிக்கப்பட்ட இரண்டு முகாம்களில் ஒன்றைக் குறிக்கிறது. אֶל என்பதன் திசைப் பொருளையும் தமிழின் இயல்பான வேற்றுமை வடிவத்தையும் காக்கிறது.
- source_word: וְהִכָּהוּ
  choice: அதைத் தாக்கினால்
  rationale: נכה என்பதன் ‘அடித்தல்/தாக்குதல்’ பொருளை இச்சூழலில் இயல்பாகத் தருகிறது; ஆண்பால் ஒருமை பின்னொட்டு கூட்டுத்தொகையாகக் கருதப்படும் ‘முகாமை’ச் சுட்டுவதாக எடுத்துக்கொள்ளப்படுகிறது.
- source_word: הַמַּחֲנֶה הַנִּשְׁאָר
  choice: மீதியிருக்கும் முகாம்
  rationale: נשאר என்பதிலுள்ள எஞ்சியிருத்தல் என்ற பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: וְהָיָה … לִפְלֵיטָה
  choice: தப்பித்துக்கொள்ளும்
  rationale: ‘தப்புதல்/தப்பிப்பிழைத்தல்’ நிலையைக் குறிக்கும் எபிரெயப் பெயர்ச்சொல் மரபுத்தொடரை இயல்பான தமிழ் வினை வடிவில் தருகிறது.
