  text: And he said to him, “What is your name?” And he said, “Jacob.”
translation:
  language: ta
  text: அவன் அவனிடம், “உன் பெயர் என்ன?” என்றான். அதற்கு அவன், “யாக்கோபு” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு வழங்கப்பட்ட எபிரேய உரை, பொதுவாகப் பயன்படுத்தப்படும் எபிரேய மற்றும் பல நவீன வேதாகம வசனப் பிரிப்புகளில் ஆதியாகமம் 32:27 ஆகும்; ஆதியாகமம் 32:28 அல்ல.
    reason: வழங்கப்பட்ட வசன அடையாளத்திற்கும் WLC மூல உரைக்கும் இடையிலுள்ள வேறுபாட்டை வாசகருக்கு வெளிப்படையாகத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: அவர் அவனிடம் … என்றார்
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுக்கிறது; אֶל + ஆண்பால் ஒருமை பின்னொட்டு உரையின் திசையைச் சுட்டுகிறது. ‘அவர் அவனிடம் … என்றார்’ என்பது எபிரெயச் சொல்லமைப்பை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: מַה שְּׁמֶךָ
  choice: உன் பெயர் என்ன?
  rationale: מַה என்பது நேரடியான வினாப்பெயர்; שְׁמֶךָ என்பதன் பொருள் ‘உன் பெயர்’. தமிழில் ‘உன் பெயர் என்ன?’ என்பது முழுமையான, இயல்பான கேள்வி.
- source_word: וַיֹּאמֶר
  choice: அதற்கு அவன் … என்றான்
  rationale: אמר என்ற பொதுவான ‘சொல்’ வினையை ‘என்றான்’ என்று மொழிபெயர்த்து, பதிலுரையின் தொடர்பை இயல்பாக்க ‘அதற்கு’ சேர்க்கப்பட்டுள்ளது; இது புதிய பொருளைச் சேர்க்காமல் சூழலிலுள்ள தொடர்பை வெளிப்படுத்துகிறது.
- source_word: יַעֲקֹב
  choice: யாக்கோபு
  rationale: தனிப்பெயர் தமிழில் வழக்கமாக நிலைபெற்ற ‘யாக்கோபு’ என்ற ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது; பெயரின் சொற்பிறப்புப் பொருள் இங்கு மொழிபெயர்க்கப்படவில்லை.
theological_decisions: []
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. அடையாளம் தெரியாத பேச்சாளருக்கு ‘அவர்’, யாக்கோபுக்கு ‘அவன்’ எனச் சூழலுக்கேற்ற சுட்டுப்பெயர்கள் வைக்கப்பட்டுள்ளன. எபிரெய אמר இரு இடங்களிலும் ‘என்றார்/என்றான்’ என்று அடிப்படை ‘சொல்’ பொருள் காக்கப்பட்டுள்ளது.
