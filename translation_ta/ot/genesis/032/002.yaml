  yaml_path: translation/ot/genesis/032/002.yaml
  text: And Jacob went on his way[b][a], and the angels of God met him.
translation:
  language: ta
  text: யாக்கோபு தன் வழியில் சென்றான்; கடவுளின் தேவதூதர்கள்[a] அவனைச் சந்தித்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “கடவுளின் தூதர்கள்.” எபிரெயச் சொற்றொடர் சொற்சொல்லாக “கடவுளின் தூதர்கள்” என உள்ளது; இச்சூழல் விண்ணுலகத் தூதர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “அவனை எதிர்ப்பட்டார்கள்” அல்லது “அவனை எதிர்கொண்டார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַעֲקֹב
  choice: யாக்கோபு
  rationale: வְ என்னும் இணைப்புச் சொல் தமிழ் கதைநடையின் இயல்புக்கேற்ப தனியே மொழிபெயர்க்கப்படாமல், அடுத்த வாக்கியப் பகுதியில் ‘அப்போது’ என்பதன் மூலம் நிகழ்வுத் தொடர்ச்சி வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: הָלַךְ לְ/דַרְכּוֹ
  choice: தன் வழியே சென்றான்
  rationale: ‘தன் வழிக்குச் சென்றான்’ என்ற சொற்சொல்லான வடிவத்தைவிட, பயணத்தைத் தொடர்ந்தான் என்ற பொருளை இயல்பான நவீன தமிழில் இது தருகிறது.
- source_word: וַ/יִּפְגְּעוּ בּוֹ
  choice: அவனைச் சந்தித்தார்கள்
  rationale: פגע + ב என்பது சந்தித்தல், எதிர்ப்படுதல், எதிர்கொள்ளுதல் ஆகிய பொருள்களைத் தரலாம். பகைமை அல்லது தற்செயல் என்ற நிழற்பொருளைத் தேவையின்றிச் சேர்க்காமல் ‘சந்தித்தார்கள்’ என்பது இங்கு இயல்பாக உள்ளது.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: கடவுளின் தூதர்கள்
  rationale: எபிரெயக் கூட்டுச்சொற்றொடரின் வடிவத்தையும் ‘தூதர்கள்/தேவதூதர்கள்’ என்ற மַלְאָךְ சொல்லின் உண்மையான சொல்லியல் பரப்பையும் இது காக்கிறது; அடுத்த வசனத்தின் சூழல் இவர்களை விண்ணுலகத் தூதர்களாகப் புரிந்துகொள்ள வலுவாக வழிகாட்டுகிறது.
theological_decisions:
- issue: מַלְאֲכֵי אֱלֹהִים என்பதன் குறிப்பு
  choice: கடவுளுக்குரிய விண்ணுலகத் தூதர்களைக் குறிக்கும் வகையில் ‘கடவுளின் தூதர்கள்’
  alternative: மனிதத் தூதர்கள்
  rationale: מַלְאָךְ என்பது மனிதத் தூதரையும் விண்ணுலகத் தூதரையும் குறிக்கலாம். ஆனால் அடுத்த வசனத்தில் யாக்கோபு அந்த இடத்தை ‘கடவுளின் முகாம்’ என்று அழைப்பதால், இங்கு இயற்கைக்கு அப்பாற்பட்ட தூதர்களே குறிக்கப்படுகின்றனர். இருந்தாலும் மூலச்சொல்லின் சொல்லியல் நெகிழ்வை முற்றிலும் மறைக்காத வடிவம் தேர்ந்தெடுக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தன் வழியே சென்றான்’ பயணம் தொடர்வதை இயல்பாகத் தெரிவிக்கிறது; ‘சந்தித்தார்கள்’ மூலவினையின் தேவையற்ற பகைமை நிழற்பொருளைத் தவிர்க்கிறது.
