translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதே நேரத்தில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தில் மக்கள், மந்தைகள், ஒட்டகங்கள் ஆகியவை தனித்தனியாக இணைக்கப்படும் இணை அமைப்பு, தமிழில் தொடர்ச்சியான ‘-ஐயும்’ வடிவங்களால் பாதுகாக்கப்பட்டுள்ளது.
