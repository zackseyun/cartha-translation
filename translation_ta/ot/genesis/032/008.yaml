  text: וַ/יִּירָ֧א יַעֲקֹ֛ב מְאֹ֖ד וַ/יֵּ֣צֶר ל֑/וֹ וַ/יַּ֜חַץ אֶת הָ/עָ֣ם אֲשֶׁר אִתּ֗/וֹ וְ/אֶת הַ/צֹּ֧אן וְ/אֶת הַ/בָּקָ֛ר וְ/הַ/גְּמַלִּ֖ים לִ/שְׁנֵ֥י מַחֲנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/008.yaml
  text: Then Jacob was very afraid and distressed[a], and he divided the people who were with him, and the flocks, and the herds, and the camels, into two camps.
translation:
  language: ta
  text: அப்போது யாக்கோபு மிகவும் பயந்தான்; மனக்கலக்கமடைந்தான். தன்னுடன் இருந்த மக்களையும், ஆட்டு மந்தைகளையும், மாட்டு மந்தைகளையும், ஒட்டகங்களையும் இரண்டு முகாம்களாக[a]ப் பிரித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இரண்டு குழுக்களாக.’ எபிரெயச் சொல் ஒரு முகாம் அல்லது ஒழுங்கமைக்கப்பட்ட குழுவைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא מְאֹד
  choice: மிகவும் பயந்து
  rationale: יִרָא என்பது பயத்தைக் குறிக்கிறது; מְאֹד அதன் தீவிரத்தை வலியுறுத்துவதால், இயல்பான நவீன தமிழில் இரண்டையும் இணைத்து மொழிபெயர்க்கப்பட்டது.
- source_word: וַיֵּצֶר לוֹ
  choice: கலக்கமடைந்தான்
  rationale: இந்த எபிரெயச் சொற்றொடர் உள்ளார்ந்த நெருக்கடியையும் மனவேதனையையும் குறிக்கிறது. ‘கலக்கமடைந்தான்’ என்பது சூழலுக்கு ஏற்ற தெளிவான தமிழ் வழக்கு.
- source_word: וַיַּחַץ
  choice: பிரித்தான்
  rationale: חצה என்பது இரண்டாகப் பிரித்தல் அல்லது பங்கிடுதலைக் குறிக்கிறது; இங்கு யாக்கோபின் திட்டமிட்ட நடவடிக்கையை ‘பிரித்தான்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: தன்னுடன் இருந்த மக்களை
  rationale: עָם இங்கு ஒரு தேசத்தை அல்ல, யாக்கோபுடன் பயணம் செய்த மக்களைக் குறிக்கிறது.
- source_word: הַצֹּאן
  choice: ஆட்டு மந்தைகள்
  rationale: צֹאן என்பது பொதுவாகச் செம்மறியாடுகளும் வெள்ளாடுகளும் அடங்கிய சிறு கால்நடை மந்தைகளைக் குறிக்கும் கூட்டுப்பெயர்; ‘ஆட்டு மந்தைகள்’ இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: הַבָּקָר
  choice: மாட்டு மந்தைகள்
  rationale: בָּקָר என்பது மாடுகளைக் குறிக்கும் கூட்டுப்பெயர்; மந்தைகள் என்ற இணை அமைப்பையும் இது காக்கிறது.
- source_word: הַגְּמַלִּים
  choice: ஒட்டகங்கள்
  rationale: மூலச்சொல்லின் நேரடியான, தெளிவான தமிழாக்கம்.
- source_word: לִשְׁנֵי מַחֲנוֹת
  choice: இரண்டு முகாம்களாக
  rationale: מַחֲנֶה என்பது முகாம் அல்லது ஒழுங்கமைக்கப்பட்ட பயணக் குழு எனப் பொருள்படலாம். அடுத்த வசனத்திலும் தொடரும் முகாம் சார்ந்த சொல்லாட்சியைப் பாதுகாக்க ‘முகாம்கள்’ முதன்மை மொழிபெயர்ப்பாகத் தேர்ந்தெடுக்கப்பட்டது.
