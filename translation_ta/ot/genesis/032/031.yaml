source:
  edition: WLC
  text: וַ/יִּקְרָ֧א יַעֲקֹ֛ב שֵׁ֥ם הַ/מָּק֖וֹם פְּנִיאֵ֑ל כִּֽי רָאִ֤יתִי אֱלֹהִים֙ פָּנִ֣ים אֶל פָּנִ֔ים וַ/תִּנָּצֵ֖ל נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/031.yaml
  text: And Jacob called the name of the place Peniel[a], for I have seen God face to face[c][b], and my life has been delivered.
translation:
  language: ta
  text: யாக்கோபு அந்த இடத்திற்குப் பெனியேல்[a] என்று பெயரிட்டான்; ஏனெனில், “நான் கடவுளை[c] முகமுகமாகக் கண்டேன்; என் உயிர் காப்பாற்றப்பட்டது[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெனியேல்” என்பது “கடவுளின் முகம்” என்பதுபோல் ஒலிக்கிறது; “கடவுளை முகமுகமாகக் கண்டேன்” என்ற யாக்கோபின் விளக்கத்துடன் இது தொடர்புடையது.
    reason: cultural_note
  - marker: b
    text: “என் உயிர்” என்பதை “நான்” அல்லது “தன்னையே” என்றும் பொருள்படுத்தலாம்; இங்குள்ள எபிரேயச் சொல் உயிரையோ தன்மையையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “கடவுள்” என்பதற்கான எபிரேயச் சொல் சில சூழல்களில் “ஒரு தெய்வீக உயிர்” என்றும் பொருள்படலாம்; இச்சூழல் “கடவுள்” என்ற வாசிப்பை ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם הַמָּקוֹם
  choice: அந்த இடத்திற்குப் ... என்று பெயரிட்டான்
  rationale: எபிரேயப் பெயரிடும் மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் தருகிறது; ‘அந்த இடத்தின் பெயரை ... என்று அழைத்தான்’ என்பது தமிழில் செயற்கையாக ஒலிக்கும்.
- source_word: פְּנִיאֵל
  choice: பெனியேல்
  rationale: இவ்வசனத்திலுள்ள எபிரேய எழுத்துவடிவத்தை ஒலிபெயர்த்து, ‘கடவுளின் முகம்’ என்ற பெயர்ச்சொல் விளையாட்டை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இடத்திற்குப் பெயரிட்டதற்கான யாக்கோபின் காரணவிளக்கத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: רָאִיתִי אֱלֹהִים
  choice: நான் கடவுளைக் கண்டேன்
  rationale: சூழலில் אֱלֹהִים என்பது கடவுளைக் குறிப்பதே இயல்பான வாசிப்பு; சொல்லின் பரந்த சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: פָּנִים אֶל־פָּנִים
  choice: முகமுகமாக
  rationale: நேரடியான தனிப்பட்ட சந்திப்பைக் குறிக்கும் எபிரேய மரபுத்தொடரையும் பெனியேல் என்ற பெயருடனான சொல் தொடர்பையும் சுருக்கமாகப் பேணுகிறது.
- source_word: וַתִּנָּצֵל נַפְשִׁי
  choice: இருந்தும் என் உயிர் காப்பாற்றப்பட்டது
  rationale: נֶפֶשׁ இங்கு உடலற்ற ‘ஆன்மா’ என்பதைவிட உயிர் அல்லது தன்னையே குறிக்கிறது. சந்தித்த பின்னரும் உயிருடன் இருந்த வியப்பை ‘இருந்தும்’ இயல்பாக வெளிப்படுத்துகிறது; இது எபிரேய வாவ் இணைப்பின் சூழல்சார் எதிர்மறைத் தொடர்பாகும்.
theological_decisions:
- issue: אֱלֹהִים என்பதன் குறிப்பு
  choice: கடவுள்
  alternative: ஒரு தெய்வீக உயிர்
  rationale: யாக்கோபின் பெயரிடும் விளக்கமும் முந்தைய போராட்ட நிகழ்வின் சூழலும் கடவுளையே குறிப்பதாக வலுவாகச் சுட்டுகின்றன; இருப்பினும் எபிரேயச் சொல்லின் பரந்த பொருள் சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: וַתִּנָּצֵל נַפְשִׁי என்பதன் இறையியல் நுட்பம்
  choice: என் உயிர் காப்பாற்றப்பட்டது
  alternative: என் ஆத்துமா விடுவிக்கப்பட்டது
  rationale: இங்கு கருத்து, கடவுளை நேரடியாகக் கண்டும் யாக்கோபு உயிர் பிழைத்தது என்பதே; உடலற்ற ஆத்துமாவைப் பற்றிய பிற்காலக் கருத்தை உரைக்குள் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. எபிரேயத்தில் மேற்கோள் அறிகுறிகளோ ‘என்றான்’ என்பதற்கான தனிச் சொல்லோ இல்லை; எனினும் முதல் நபர் கூற்றிலிருந்து தமிழ் உரைநடைக்கு இயல்பாக மாறுவதற்காக ‘என்றான்’ பயன்படுத்தப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
