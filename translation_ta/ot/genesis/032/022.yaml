reference: Genesis 32:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/תַּעֲבֹ֥ר הַ/מִּנְחָ֖ה עַל פָּנָ֑י/ו וְ/ה֛וּא לָ֥ן בַּ/לַּֽיְלָה הַ/ה֖וּא בַּֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/022.yaml
  text: So the gift passed on ahead of him[a], but he himself stayed that night in the camp.
translation:
  language: ta
  text: ஆகவே, பரிசு அவனுக்கு முன்னதாகச் சென்றது[a]; ஆனால் அவனோ அந்த இரவில் முகாமில் தங்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பரிசு’ என்பதற்குப் பதிலாக ‘அன்பளிப்பு’ என்றும் மொழிபெயர்க்கலாம். எபிரேய מִנְחָה என்ற சொல் பரிசு, திறை அல்லது காணிக்கை ஆகியவற்றைக் குறிக்கக்கூடும்; இங்கு அது யாக்கோபு ஏசாவுக்கு முன்னதாக அனுப்பிய பரிசைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲבֹר
  choice: சென்றது
  rationale: இங்கு עבר என்பதன் தொடர்கதை வடிவம், அன்பளிப்பு யாக்கோபுக்கு முன்னதாகத் தொடர்ந்து சென்றதைக் குறிக்கிறது. ஓர் எல்லையையோ நீரோடையையோ கடந்ததாகத் தவறாக உணர்த்தக்கூடிய ‘கடந்தது’ என்பதைக் காட்டிலும் ‘சென்றது’ சூழலுக்கு இயல்பானது.
- source_word: הַמִּנְחָה
  choice: அன்பளிப்பு
  rationale: இந்தச் சூழலில் מִנְחָה என்பது யாக்கோபு ஏசாவுக்கு அனுப்பிய பரிசைக் குறிக்கிறது; வழிபாட்டுப் பலியைக் குறிக்கவில்லை. ‘அன்பளிப்பு’ மரியாதையுடனும் தெளிவாகவும் இங்கு பொருந்துகிறது.
- source_word: עַל־פָּנָיו
  choice: அவனுக்கு முன்னால்
  rationale: ‘அவனுடைய முகத்திற்கு முன்பாக’ என்ற எபிரேய மரபுத்தொடர், இங்கு யாக்கோபுக்கு முன்னதாகச் செல்வதைக் குறிக்கிறது. தமிழில் ‘அவனுக்கு முன்னால்’ அந்த இடவியல் மற்றும் முன்னோடிச் செல்லும் பொருளை இயல்பாகத் தருகிறது.
- source_word: וְהוּא
  choice: ஆனால் அவனோ
  rationale: வெளிப்படையாக வந்துள்ள தனிப்பெயர் சுட்டுப்பெயர், முன்னால் சென்ற அன்பளிப்புக்கும் பின்னால் தங்கிய யாக்கோபுக்கும் இடையிலான முரண்பாட்டை வலியுறுத்துகிறது. ‘ஆனால் அவனோ’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לָן
  choice: தங்கினான்
  rationale: לון/לין என்பது இரவில் தங்குதல் அல்லது இரவைக் கழித்தல். ‘அந்த இரவில்’ என்ற காலச்சொற்றொடருடன் ‘தங்கினான்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: בַּלַּיְלָה הַהוּא
  choice: அந்த இரவில்
  rationale: எபிரேய காலச்சொற்றொடரின் நேரடியான, இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: בַּמַּחֲנֶה
  choice: முகாமில்
  rationale: מַחֲנֶה என்பது முகாம் அல்லது பாளயத்தைக் குறிக்கிறது. ‘முகாம்’ இன்றைய பொதுத் தமிழில் தெளிவான சொல்.
