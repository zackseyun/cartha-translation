translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அவனோ’ என்பதன் மூலம் எபிரேய உரையிலுள்ள முரண்பாட்டு வலியுறுத்தல் பாதுகாக்கப்பட்டுள்ளது; சமயச் சூழலைத் தவறாக உணர்த்தக்கூடிய ‘காணிக்கை’ முதன்மை உரையில் தவிர்க்கப்பட்டுள்ளது.
