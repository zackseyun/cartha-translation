base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/023.yaml
  text: That night he arose and took his two wives[a], his two female servants, and his eleven children, and crossed the ford of the Jabbok.
translation:
  language: ta
  text: அந்த இரவில் அவன் எழுந்து, தன் இரண்டு மனைவிகளையும், தன் இரண்டு அடிமைப் பெண்களையும்[a], தன் பதினொரு பிள்ளைகளையும் தன்னுடன் கூட்டிக்கொண்டு, யாப்போக்கு ஆற்றின் கடவையைக் கடந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெண் பணியாளர்களையும்.” எபிரெயச் சொல் குடும்பத்தில் கீழ்ப்பட்ட நிலையிலிருந்த பெண்களைக் குறிக்கிறது; அது பெண் பணியாளர்களையோ அடிமைப் பெண்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்பதன் Qal wayyiqtol வடிவம் எழுதல் அல்லது எழுந்திருத்தலைக் குறிக்கிறது; தொடர்கதை நடைக்கு இயல்பாக வினையெச்சம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: בַּלַּיְלָה הוּא
  choice: அந்த இரவில்
  rationale: சொற்றொடரின் காலச் சூழலையும் הוּא தரும் சுட்டு வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּקַּח
  choice: அழைத்துக்கொண்டு
  rationale: לקח அடிப்படையில் ‘எடுத்துக்கொள்’ எனினும், இங்கு குடும்பத்தினரைத் தன்னுடன் கூட்டிச் செல்வதே பொருள்; ‘அழைத்துக்கொண்டு’ என்பது தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: שְׁתֵּי נָשָׁיו
  choice: தன் இரண்டு மனைவிகளையும்
  rationale: இந்தச் சூழலில் נָשִׁים என்பது பொதுவாகப் பெண்களை அல்ல, யாக்கோபின் மனைவிகளையே தெளிவாகக் குறிக்கிறது.
- source_word: שְׁתֵּי שִׁפְחֹתָיו
  choice: தன் இரண்டு அடிமைப் பெண்களையும்
  rationale: שִׁפְחָה கீழ்நிலைக் குடும்ப அந்தஸ்திலிருந்த பெண் பணியாளர் அல்லது அடிமைப் பெண்ணைக் குறிக்கலாம். பண்டைய சமூகத்தின் அதிகார உறவை மறைக்காமல் ‘அடிமைப் பெண்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது; மென்மையான மாற்றுச் சொல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אַחַד עָשָׂר יְלָדָיו
  choice: தன் பதினொரு பிள்ளைகளையும்
  rationale: יְלָדִים என்பதன் நேரடிப் பொருள் பிள்ளைகள் அல்லது சந்ததியினர்; சூழலை ஒத்திசைக்க ‘மகன்கள்’ என்று மாற்றாமல் எபிரெயச் சொல்லின் பரப்பைத் தக்கவைக்கிறது.
- source_word: וַיַּעֲבֹר
  choice: கடந்தான்
  rationale: பயணச் சூழலில் עבר ஓர் இடத்தைக் கடந்து செல்வதைக் குறிக்கிறது; ‘கடந்தான்’ சுருக்கமான இயல்பான தமிழ்.
- source_word: אֵת מַעֲבַר יַבֹּק
  choice: யாப்போக்கு ஆற்றின் கடவையை
  rationale: מַעֲבָר என்பது ஆற்றைக் கடக்க ஏற்ற கடக்கும் இடம் அல்லது துறையைக் குறிக்கிறது. ‘ஆற்றின் கடவை’ நவீன வாசகருக்குத் தெளிவாக அந்த நில அமைப்பைத் தெரிவிக்கிறது.
- source_word: יַבֹּק
  choice: யாப்போக்கு
  rationale: எபிரெய இடப்பெயரின் ஒலியைத் தமிழில் அடையாளம் காணத்தக்க வகையில் எழுத்துப்பெயர்க்கிறது.
theological_decisions:
- issue: שִׁפְחָה குறிக்கும் சமூக அந்தஸ்து
  choice: அடிமைப் பெண்கள்
  alternative: பெண் பணியாளர்கள்
  rationale: இந்தச் சொல் சாதாரண வேலைக்காரரைக் காட்டிலும் உரிமை மற்றும் கீழ்ப்படிதல் சார்ந்த பண்டைய குடும்ப அந்தஸ்தைக் குறிக்கக்கூடும். அந்தக் கடினமான சமூக உண்மையை மறைக்காமல் முதன்மை உரையில் வெளிப்படுத்தி, சொல்லின் பரப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான தொடர்கதை நடை பயன்படுத்தப்பட்டுள்ளது. ‘அழைத்துக்கொண்டு’ என்பது לקח என்பதன் சூழல்சார் இயக்கத்தைத் தெளிவாக்குகிறது; ‘கடவை’ ஆற்றின் கடக்கும் இடத்தைக் குறிக்கிறது. மூலத்தில் இல்லாத ‘மகன்கள்’ என்ற ஒத்திசைவு தவிர்க்கப்பட்டு ‘பிள்ளைகள்’ தக்கவைக்கப்பட்டுள்ளது.
