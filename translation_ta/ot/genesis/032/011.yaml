revisions:
- from: நீர் உமது அடியேனுக்குக் காட்டிய மாறாத அன்பு அனைத்திற்கும், உண்மைத்தன்மை அனைத்திற்கும் நான் தகுதியற்றவன்[a]. ஏனெனில், என் கோலுடன் இந்த யோர்தானைக் கடந்தேன்; இப்போதோ இரண்டு முகாம்களாக ஆகியிருக்கிறேன்.
  to: நீர் உமது அடியேனுக்குக் காட்டிய எல்லா மாறாத அன்பிற்கும் எல்லா நம்பகத்தன்மைக்கும் நான் தகுதியற்றவன்[a]. ஏனெனில், என் கோலுடன் இந்த யோர்தானைக் கடந்தேன்; இப்போதோ இரண்டு முகாம்களாக ஆகியிருக்கிறேன்.
  rationale: ‘உண்மைத்தன்மை’ என்பதற்குப் பதிலாக ‘நம்பகத்தன்மை’ பயன்படுத்தப்பட்டுள்ளது; இது אמת என்பதன் இச்சூழலிலான உறவுசார் நம்பகத்தன்மை/விசுவாசத்தன்மை என்ற பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. மூலத்தின் இரட்டை ‘அனைத்து’ வலியுறுத்தலைத் தெளிவுபடுத்த ‘எல்லா’ இருமுறையும் சேர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு நேரடியான எபிரேயத் தொடரின் இணைப்பையும் தமிழ்ச் சொற்றொடர் ஒழுங்கையும் சரிசெய்கிறது.
