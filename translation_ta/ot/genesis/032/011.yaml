base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/011.yaml
  text: I am unworthy of all the steadfast love and all the faithfulness that you have shown to your servant[a], for with my staff I crossed this Jordan[c][b], and now I have become two camps.
translation:
  language: ta
  text: நீர் உமது அடியேனுக்குக் காட்டிய எல்லா மாறாத அன்பிற்கும் எல்லா நம்பகத்தன்மைக்கும் நான் தகுதியற்றவன்[a]. ஏனெனில், என் கோலுடன் இந்த யோர்தானைக் கடந்தேன்; இப்போதோ இரண்டு முகாம்களாக ஆகியிருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “எல்லா மாறாத அன்பிற்கும் எல்லா நம்பகத்தன்மைக்கும் நான் சிறியவன்.” இது கடவுளின் பெருந்தயவுக்கு முன் தன்னைத் தாழ்த்திக் கூறும் எபிரேய வழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָטֹנְתִּי
  choice: நான் தகுதியற்றவன்
  rationale: இதன் நேர்ப்பொருள் ‘நான் சிறியவனாக இருக்கிறேன்/ஆகிவிட்டேன்’ என்பதாகும்; இங்கு கடவுளின் பெருங்கொடைகளுக்கு முன் யாக்கோபு தன்னைத் தாழ்த்திப் பேசுவதை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: הַחֲסָדִים
  choice: மாறாத அன்பு அனைத்தும்
  rationale: חסד என்பது உறுதியான, பற்றுமாறாத அன்பைக் குறிக்கிறது. எபிரேயப் பன்மை, அந்த அன்பின் பல வெளிப்பாடுகளைச் சுட்டுகிறது; ‘அனைத்தும்’ அதைத் தக்கவைக்கிறது.
- source_word: הָאֱמֶת
  choice: உண்மைத்தன்மை அனைத்தும்
  rationale: חסד என்பதுடன் இணைந்து வருவதால், இங்கு אמת என்பது வெறும் மெய்யான கூற்றை அல்ல, நம்பகமான உண்மைத்தன்மையைக் குறிக்கிறது.
- source_word: עָשִׂיתָ אֶת עַבְדֶּךָ
  choice: நீர் உமது அடியேனுக்குக் காட்டிய
  rationale: நேரடியாக ‘உமது அடியேனுக்குச் செய்த’ என்றாலும், அன்பையும் உண்மைத்தன்மையையும் பொருள்களாகக் கொண்ட இத்தொடருக்கு ‘காட்டிய’ என்பது இயல்பான தமிழ்.
- source_word: בְמַקְלִי
  choice: என் கோலுடன்
  rationale: ‘என் கோலோடு’ என்ற எபிரேயச் சொல்லை நேரடியாகப் பிரதிபலிக்கிறது; சூழல் உணர்த்தும் ‘அது மட்டுமே உடைமையாக’ என்ற கருத்து உரையில் சேர்க்கப்படவில்லை.
- source_word: עָבַרְתִּי אֶת הַיַּרְדֵּן הַזֶּה
  choice: இந்த யோர்தானைக் கடந்தேன்
  rationale: הַזֶּה என்பதன் சுட்டுப்பொருளையும், யாக்கோபின் உடனடி இடச்சூழலையும் தக்கவைக்கிறது.
- source_word: הָיִיתִי לִשְׁנֵי מַחֲנוֹת
  choice: இரண்டு முகாம்களாக ஆகியிருக்கிறேன்
  rationale: யாக்கோபின் மக்கள் மற்றும் உடைமைகள் இப்போது இரண்டு முகாம்களாகப் பிரிந்துள்ளதை எபிரேய உருவகத்தோடு தக்கவைக்கிறது.
theological_decisions:
- issue: கடவுளின் செயல்களைக் குறிக்கும் חסד மற்றும் אמת இணைச்சொற்களின் மொழிபெயர்ப்பு
  choice: மாறாத அன்பு / உண்மைத்தன்மை
  alternative: பேரன்பு / உண்மை
  rationale: இரு எபிரேயச் சொற்களின் வேறுபாட்டையும் உறவுசார் நம்பகத்தன்மையையும் காக்கிறது; ‘உண்மை’ என்பதை வெறும் கருத்தியல் மெய்மையாகக் குறுக்கிவிடாமல் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய மரியாதைப் பேச்சாக ‘நீர்’, யாக்கோபின் தாழ்மையான தன்னிலைச் சொல்லாக ‘அடியேன்’ பயன்படுத்தப்பட்டுள்ளன; ‘முகாம்கள்’ சுற்றியுள்ள கதையின் காட்சிப்படிமத்தைத் தக்கவைக்கிறது.
