  yaml_path: translation/ot/genesis/032/004.yaml
  text: Jacob sent messengers ahead of him to Esau his brother[a], to the land of Seir, the country of Edom.
translation:
  language: ta
  text: யாக்கோபு தனக்கு முன்னே, சேயீர் நாட்டிலுள்ள ஏதோம் பிரதேசத்தில் இருந்த தன் சகோதரன் ஏசாவிடம் தூதுவர்களை அனுப்பினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லாட்சிப்படி, ‘ஏதோமின் வயல்வெளி’; இங்கு அது ஏதோம் நாடு அல்லது அதன் பிரதேசத்தைக் குறிக்கும் புவியியல் பெயராக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினான்
  rationale: שלח என்ற வினையின் தொடர்கதை இறந்தகாலச் செயலை இயல்பான நவீனத் தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: מַלְאָכִים
  choice: தூதுவர்களை
  rationale: இச்சூழலில் யாக்கோபு ஏசாவிடம் அனுப்பிய மனிதப் பிரதிநிதிகளையே குறிக்கிறது; தேவதூதர்களை அல்ல.
- source_word: לְפָנָיו
  choice: தனக்கு முன்னதாக
  rationale: சொல்லாட்சிப்படி ‘அவனுக்கு முன்பாக’ என்றாலும், யாக்கோபு அங்கு செல்வதற்கு முன்னரே அவர்களை அனுப்பினான் என்ற இயக்கப் பொருளை இது இயல்பாகத் தருகிறது.
- source_word: עֵשָׂו אָחִיו
  choice: தன் சகோதரனாகிய ஏசாவிடம்
  rationale: பெயரையும் உறவுமுறையையும் தெளிவாக வைத்துக்கொண்டு, தமிழில் இயல்பான இணைப்பை வழங்குகிறது.
- source_word: אַרְצָה שֵׂעִיר
  choice: சேயீர் நாட்டுக்கு
  rationale: אַרְצָה என்பதிலுள்ள திசைகாட்டும் இறுதி, அந்த நாட்டை நோக்கிய இயக்கத்தைச் சுட்டுகிறது; ‘நாடு’ என்ற பெயர்ச்சொல்லும் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
- source_word: שְׂדֵה אֱדֹם
  choice: ஏதோம் பிரதேசத்துக்கு
  rationale: சொல்லாட்சிப்படி ‘ஏதோமின் வயல்வெளி’ என்றாலும், இங்கு שָׂדֶה ஒரு நிலப்பகுதி அல்லது பிரதேசத்தைக் குறிக்கும் புவியியல் பயன்பாட்டில் உள்ளது. ‘பிரதேசம்’ என்பது தமிழில் இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
