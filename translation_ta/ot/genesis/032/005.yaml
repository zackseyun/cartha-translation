  text: וַ/יְצַ֤ו אֹתָ/ם֙ לֵ/אמֹ֔ר כֹּ֣ה תֹאמְר֔וּ/ן לַֽ/אדֹנִ֖/י לְ/עֵשָׂ֑ו כֹּ֤ה אָמַר֙ עַבְדְּ/ךָ֣ יַעֲקֹ֔ב עִם לָבָ֣ן גַּ֔רְתִּי וָ/אֵחַ֖ר עַד עָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/005.yaml
  text: 'And he commanded them[a], saying[c][b], “Thus you shall say to my lord Esau: ‘Thus says your servant Jacob: I have sojourned with Laban and have stayed until now.’”'
translation:
  language: ta
  text: 'அவன் அவர்களுக்குக் கட்டளையிட்டு, “நீங்கள் என் ஆண்டவரான ஏசாவிடம் இவ்வாறு சொல்ல வேண்டும்: ‘உங்கள் பணியாளனான[b] யாக்கோபு இவ்வாறு கூறுகிறான்: நான் லாபானுடன் அந்நியனாகக் குடியிருந்து[a], இன்றுவரை தங்கியிருக்கிறேன்.’” என்று சொன்னான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “லாபானுடன் அந்நியனாக வாழ்ந்து, இன்றுவரை அங்கேயே இருந்திருக்கிறேன்” என்றும் மொழிபெயர்க்கலாம். “அந்நியனாகக் குடியிருந்தேன்” என்பதற்கான எபிரெய வினை, ஒருவர் அந்நியராக வசிப்பதை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “உங்கள் பணியாளன்” என்பது ஏசாவிடம் யாக்கோபு தாழ்மையுடனும் மரியாதையுடனும் தன்னைக் குறிப்பிடும் முறை; அவர் உண்மையில் ஏசாவின் அடிமை என்பதைக் கட்டாயமாகக் குறிக்காது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டான்
  rationale: צוה என்பதன் கட்டளைத் தன்மையைத் தெளிவாகப் பேணுகிறது; ‘அறிவுறுத்தினான்’ என்பதைவிட மூலத்தின் வலிமைக்கு நெருக்கமானது.
- source_word: כֹּה תֹאמְרוּן
  choice: இவ்வாறு சொல்ல வேண்டும்
  rationale: அனுப்பப்பட வேண்டிய செய்தியை அறிமுகப்படுத்தும் כֹּה என்பதையும் கட்டளையான வினை வடிவத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: என் ஆண்டவனாகிய ஏசாவிடம்
  rationale: ஏசாவை நோக்கிய யாக்கோபின் மரியாதைமிக்க சமூக அழைப்பைப் பேணுகிறது; இங்கு ‘ஆண்டவன்’ தெய்வப் பெயர் அல்ல.
- source_word: עַבְדְּךָ
  choice: உங்கள் பணியாளன்
  rationale: இச்சூழலில் இது நேரடியான அடிமைத்தனத்தைக் குறிப்பதற்குப் பதிலாக மரியாதை மற்றும் தாழ்மையை வெளிப்படுத்தும் சுயக்குறிப்பு.
- source_word: גַּרְתִּי
  choice: அந்நியனாகக் குடியிருந்தேன்
  rationale: גור என்பதில் உள்ள, சொந்த நாட்டுக்கு வெளியே அந்நியராக வசிக்கும் நுணுக்கத்தைத் தெளிவாகப் பேணுகிறது.
- source_word: וָאֵחַר עַד עָתָּה
  choice: இன்றுவரை அங்கே தங்கியிருந்தேன்
  rationale: தற்போதுவரை அங்கே தொடர்ந்து இருந்த காலநீட்சியை இயல்பான தமிழில் தெரிவிக்கிறது; ‘தாமதித்தேன்’ என்ற சாத்தியமான பொருள் இச்சூழலுக்குப் பொருந்தாது.
theological_decisions:
- issue: ‘என் ஆண்டவன்’ மற்றும் ‘உங்கள் பணியாளன்’ என்ற சொற்களின் நிலை
  choice: சமூக மரியாதை மற்றும் தாழ்மையைக் காட்டும் சொற்களாக மொழிபெயர்க்கப்பட்டது
  alternative: தெய்வீக ஆண்டவர் அல்லது சொற்பொருளிலான அடிமை உறவாகப் புரிந்துகொள்வது
  rationale: சூழலில் யாக்கோபு ஏசாவைச் சமாதானப்படுத்தத் தூதர்கள்மூலம் மரியாதையுடன் பேசுகிறார்; தெய்வீக பட்டமோ சட்டபூர்வ அடிமைத்தனமோ இங்கு முன்னிலைப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் தூதுச் செய்தியின் மரியாதைமிக்க, சற்றே முறையான நடையையும் பேணியும் வடிவமைக்கப்பட்டது. எபிரெய உரையின் அடுக்குச் சொற்பொழிவு இரட்டை மேற்கோள்களால் தெளிவாக்கப்பட்டது.
