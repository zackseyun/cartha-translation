  text: וַ/יִּֽזְרַֽח ל֣/וֹ הַ/שֶּׁ֔מֶשׁ כַּ/אֲשֶׁ֥ר עָבַ֖ר אֶת פְּנוּאֵ֑ל וְ/ה֥וּא צֹלֵ֖עַ עַל יְרֵכֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/032.yaml
  text: The sun rose upon him as he passed Penuel[c][b][a], and he was limping on his thigh.
translation:
  language: ta
  text: அவன் பெனூவேலைக்[a] கடந்தபோது, அவன்மேல் சூரியன் உதித்தது; அவனோ தனது தொடையின் காரணமாக நொண்டி நடந்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு எபிரெயத்தில் இடத்தின் பெயர் “பெனூவேல்” என்று உள்ளது; வேறு இடங்களில் “பெனியேல்” என்ற வடிவமும் காணப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தை இன்னும் நேரடியாக, “தனது தொடையின்மேல் நொண்டி நடந்தான்” என்றும் மொழிபெயர்க்கலாம். முந்தைய சூழல் இடுப்பு மூட்டைப் பற்றிக் கூறினாலும், இவ்வசனம் “தொடை” என்ற சொல்லையே பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַח לוֹ הַשֶּׁמֶשׁ
  choice: அவன்மேல் சூரியன் உதித்தது
  rationale: זרח என்பதன் இயல்பான பொருள் சூரியன் உதிப்பது அல்லது ஒளிவீசுவது. לוֹ இங்கு அந்த உதயம் அவன்மேல் நிகழ்ந்ததைச் சுட்டுகிறது; எபிரெய நோக்கை இயல்பான தமிழில் காக்கிறது.
- source_word: כַּאֲשֶׁר עָבַר
  choice: கடந்தபோது
  rationale: כַּאֲשֶׁר காலச் சூழலைக் குறிக்கிறது; עבר இங்கு ஓர் இடத்தைக் கடந்து செல்வதைக் குறிக்கிறது. இரண்டையும் இணைத்த இந்த வடிவம் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: פְּנוּאֵל
  choice: பெனூவேல்
  rationale: இவ்வசனத்தின் மசோரா உரையில் உள்ள Penuel என்ற வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது; வேறு இடங்களில் காணப்படும் Peniel வடிவத்துடன் ஒற்றுமைப்படுத்தவில்லை.
- source_word: וְהוּא צֹלֵעַ
  choice: அவனோ ... நொண்டி நடந்தான்
  rationale: பங்கெச்ச வடிவம் தொடர்ந்த உடல் நிலையையும் நடையின் தன்மையையும் காட்டுகிறது. 'நொண்டி நடந்தான்' என்பது இன்றைய தமிழில் தெளிவான, இயல்பான வெளிப்பாடு.
- source_word: עַל יְרֵכוֹ
  choice: தனது தொடையின் காரணமாக
  rationale: יָרֵךְ என்பதன் நேரடிப் பொருள் தொடை அல்லது மேல்கால் பகுதி. עַל இச்சூழலில் காரணத்தைக் குறிக்கக்கூடும்; 'தொடையின்மேல் நொண்டினான்' என்ற இயல்பற்ற தமிழைத் தவிர்த்து, மூலத்தின் உடற்பகுதி சொல்லைத் தக்கவைக்கிறது.
