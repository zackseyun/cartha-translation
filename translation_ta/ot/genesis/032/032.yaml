translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. பெயரின் இவ்வசனத்துக்குரிய எபிரெய எழுத்துவடிவம் காக்கப்பட்டுள்ளது. עַל என்பதிலுள்ள இடவியல்/காரணவியல் நுட்பம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
