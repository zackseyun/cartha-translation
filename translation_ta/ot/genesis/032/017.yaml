base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/017.yaml
  text: He put each herd by itself into the hand of his servants[a], and said to his servants, “Pass on ahead of me[d][c][b], and put a space between herd and herd.”
translation:
  language: ta
  text: அவன் ஒவ்வொரு மந்தையையும் தனித்தனியாகத் தன் பணியாளர்களின் பொறுப்பில் வைத்தான்[a][b]. பின்பு அவர்களிடம், “எனக்கு முன்னால் செல்லுங்கள்[c]; மந்தைக்கும் மந்தைக்கும் இடையில் இடைவெளி வையுங்கள்[d]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தன் பணியாளர்களின் கையில் கொடுத்தான்.” இது அவர்களுடைய கட்டுப்பாட்டிலும் பராமரிப்பிலும் ஒப்படைத்ததைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: “ஒவ்வொரு கால்நடைக் கூட்டத்தையும் தனித்தனியாக” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் ‘மந்தை’ என்ற சொல் இருமுறை வருவது, குழுக்கள் ஒவ்வொன்றாகப் பிரிக்கப்பட்டிருந்ததை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: “எனக்கு முன்பாகக் கடந்து செல்லுங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “ஒரு மந்தைக்கும் மற்றொரு மந்தைக்கும் இடையில் இடைவெளி வையுங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן בְּיַד
  choice: பொறுப்பில் வைத்தான்
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘கையில் வைத்தான்’ என்று இருந்தாலும், இச்சூழலில் ஒருவரின் கட்டுப்பாட்டிலும் பராமரிப்பிலும் ஒப்படைப்பதைக் குறிக்கும் மரபுத்தொடர். ‘பொறுப்பில் வைத்தான்’ என்பது அதன் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עֲבָדָיו
  choice: தன் பணியாளர்கள்
  rationale: עֶבֶד என்பதற்கு ‘அடிமை’ அல்லது ‘பணியாளர்’ என்று பொருள் வரலாம். இங்கு யாக்கோபின் அறிவுரையை நிறைவேற்றும் வீட்டுப் பணியாளர்கள் என்பதே முன்னிலையாக இருப்பதால் ‘பணியாளர்கள்’ பொருத்தமானது.
- source_word: עֵדֶר עֵדֶר לְבַדּוֹ
  choice: ஒவ்வொரு மந்தையையும் தனித்தனியாக
  rationale: עֵדֶר என்ற சொல்லின் இரட்டிப்பு பகிர்வுப் பொருளை—ஒவ்வொரு மந்தையும் மற்றவற்றிலிருந்து பிரிக்கப்பட்டிருப்பதை—வலியுறுத்துகிறது. ‘ஒவ்வொரு... தனித்தனியாக’ என்பது அந்த வலியுறுத்தலை இயல்பாகக் கடத்துகிறது.
- source_word: עִבְרוּ לְפָנַי
  choice: எனக்கு முன்னால் செல்லுங்கள்
  rationale: עָבַר என்பதன் அடிப்படைப் பொருள் ‘கடந்து செல்/செல்.’ இப்பயணச் சூழலில் பணியாளர்கள் யாக்கோபுக்கு முன்னே செல்ல வேண்டும் என்பதே கருத்து; குறிப்பிட்ட ஓர் ஆற்றையோ எல்லையையோ கடப்பதாக உரை சொல்லவில்லை.
- source_word: וְרֶוַח תָּשִׂימוּ
  choice: இடைவெளி வையுங்கள்
  rationale: רֶוַח இங்கு கால்நடைக் குழுக்களுக்கு இடையிலான வெளி அல்லது இடைவெளியைக் குறிக்கிறது. שׂים என்பதன் பொதுவான ‘வை/அமை’ என்ற பொருளுடன் ‘இடைவெளி வையுங்கள்’ இயல்பாக அமைகிறது.
- source_word: בֵּין עֵדֶר וּבֵין עֵדֶר
  choice: மந்தைக்கும் மந்தைக்கும் இடையில்
  rationale: மூலத்தின் மீளுருவாக்கம் ஒவ்வொரு மந்தையும் அடுத்த மந்தையிலிருந்து பிரிக்கப்பட்டிருக்க வேண்டும் என்பதை வலியுறுத்துகிறது. தமிழ் வடிவம் அந்த மீளுருவாக்கத்தின் சுவையைத் தக்கவைக்கிறது.
