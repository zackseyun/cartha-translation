  source_fidelity: 'மூல எபிரெயத்தின் வினைவரிசையும் பொருளும் துல்லியமாகக் கடத்தப்படுகின்றன: யாக்கோபு மந்தைகளைப் பணியாளர்களிடம் ஒப்படைக்கிறார்; ஒவ்வொன்றும் தனித்தனியாக இருக்குமாறு அமைக்கிறார்; அவர்கள் தமக்கு முன்னால் செல்லவும் மந்தைகளுக்கு இடையில் இடைவெளி வைக்கவும் கட்டளையிடுகிறார். עֵדֶר עֵדֶר לְבַדּוֹ என்பதன் பகிர்வுத் தன்மையும், בֵּין עֵדֶר וּבֵין עֵדֶר என்பதன் மீளுருவாக்க வலியுறுத்தலும் காக்கப்பட்டுள்ளன.'
