translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மந்தை’ என்ற வழக்கமான சொல் மூலத்தின் பொதுவான கால்நடைக் குழுப் பொருளைத் தக்கவைக்கிறது; அது இங்கு ஆடுகளுக்கு மட்டும் வரையறுக்கப்படாதது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது. எபிரெய மரபுத்தொடரின் சொற்படியான வடிவம் முதன்மை உரையில் கடினமாகத் தோன்றாதபடி அதன் பொருள் வழங்கப்பட்டு, நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
