base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/016.yaml
  text: thirty nursing camels and their young[a], forty cows and ten bulls, twenty female donkeys and ten foals.
translation:
  language: ta
  text: பாலூட்டும் ஒட்டகங்களும் அவற்றின் குட்டிகளும் முப்பது, பசுக்கள் நாற்பதும் காளைகள் பத்தும், பெண் கழுதைகள் இருபதும் கழுதைக் குட்டிகள் பத்தும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘ஆண் கழுதைகள்.’ எபிரெயச் சொல் இளம் கழுதையையோ கழுதைக் குட்டியையோ குறிக்கலாம்; இந்தக் கால்நடைப் பட்டியலில் பெண் கழுதைகளுடன் இணைத்துக் கூறப்படுவதால் ஆண் கழுதைகளைக் குறிக்கும் வாய்ப்பும் உண்டு.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּמַלִּים מֵינִיקוֹת
  choice: பாலூட்டும் ஒட்டகங்கள்
  rationale: מֵינִיקוֹת என்பது தம் குட்டிகளுக்குப் பால் கொடுக்கும் பெண் ஒட்டகங்களைக் குறிக்கிறது. ‘பாலூட்டும்’ என்பது இக்கருத்தை இயல்பான நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: וּבְנֵיהֶם
  choice: அவற்றின் குட்டிகளும்
  rationale: நேரடியாக ‘அவற்றின் பிள்ளைகள்’ என்றாலும், விலங்குகளைப் பற்றிய சூழலில் ‘குட்டிகள்’ என்பதே இயல்பான தமிழ்ச் சொல்.
- source_word: פָּרוֹת
  choice: பசுக்கள்
  rationale: இச்சொல் பெண் மாடுகளைக் குறிக்கிறது; ‘பசுக்கள்’ என்பது வழக்கமானதும் பாலின வேறுபாட்டைத் தக்கவைப்பதும் ஆகும்.
- source_word: וּפָרִים
  choice: காளைகள்
  rationale: ஆண் மாடுகளைக் குறிக்கும் சொல்லாக இருப்பதால், பசுக்களுடன் உள்ள பாலின வேறுபாட்டை ‘காளைகள்’ தெளிவாகக் காட்டுகிறது.
- source_word: אֲתֹנֹת
  choice: பெண் கழுதைகள்
  rationale: எபிரெயச் சொல் குறிப்பாகப் பெண் கழுதைகளைக் குறிக்கிறது; தமிழில் குழப்பமின்றி புரிய ‘பெண் கழுதைகள்’ எனத் தரப்பட்டுள்ளது.
- source_word: וַעְיָרִם
  choice: கழுதைக் குட்டிகள்
  rationale: עַיִר பொதுவாக இளம் கழுதையை அல்லது கழுதைக் குட்டியைக் குறிக்கலாம். பட்டியலின் சூழலில் ‘கழுதைக் குட்டிகள்’ என்பது இயல்பான தேர்வு; ஆண் கழுதைகள் என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
