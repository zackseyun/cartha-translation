  source_fidelity: The main rendering accurately conveys Jacob's address to the God of Abraham and Isaac, preserves the divine name as «யாவே», renders שוב as a return command, and communicates the beneficent sense of ואיטיבה עמך. «உறவினரிடமும்» is a defensible contextual rendering of מולדתך, while the footnote responsibly preserves the native-place/origin sense.
