source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ יַעֲקֹב֒ אֱלֹהֵי֙ אָבִ֣/י אַבְרָהָ֔ם וֵ/אלֹהֵ֖י אָבִ֣/י יִצְחָ֑ק יְהוָ֞ה הָ/אֹמֵ֣ר אֵלַ֗/י שׁ֧וּב לְ/אַרְצְ/ךָ֛ וּ/לְ/מוֹלַדְתְּ/ךָ֖ וְ/אֵיטִ֥יבָה עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/010.yaml
  text: And Jacob said[a], “O God of my father Abraham and God of my father Isaac, O Yahweh, who said to me, ‘Return to your land and to your kindred[b], and I will do you good,’”
translation:
  language: ta
  text: 'யாக்கோபு சொன்னான்: “என் தந்தை ஆபிரகாமின் கடவுளே, என் தந்தை ஈசாக்கின் கடவுளே, யாவே, என்னிடம், ‘உன் நாட்டிற்கும் உன் உறவினரிடமும்[a] திரும்பிப் போ; நான் உனக்கு நன்மை செய்வேன்[b]’ என்று சொன்னவரே,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் பூர்வீக இடத்திற்கும்.” எபிரெயச் சொல் உறவினரையோ ஒருவரது பூர்வீகச் சூழலையோ குறிக்கலாம்.
    reason: lexical_ambiguity
  - marker: b
    text: சொல்லுக்கு நெருக்கமான வடிவில், “நான் உன்னோடு நன்மையாக நடந்துகொள்வேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב
  choice: யாக்கோபு சொன்னான்
  rationale: வாவ் தொடர்கதை ஓட்டத்தை முன்னெடுக்கிறது. தமிழில் தனியே ‘மற்றும்’ சேர்ப்பது இயல்பற்றதாக இருப்பதால், தொடர்ச்சியை எளிய இறந்தகால வினை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהֵי אָבִי אַבְרָהָם וֵאלֹהֵי אָבִי יִצְחָק
  choice: என் தந்தை ஆபிரகாமின் கடவுளே, என் தந்தை ஈசாக்கின் கடவுளே
  rationale: எபிரெயக் கட்டமைப்பையும் நேரடி வேண்டுதலின் விளிவேற்றுமையையும் தெளிவாகப் பாதுகாக்கிறது. ‘தந்தை’ என்பது இங்கு மூதாதையையும் குறிக்கக்கூடிய வேதாகமப் பயன்பாடு.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பொதுவாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הָאֹמֵר אֵלַי
  choice: என்று என்னிடம் சொன்னவரே
  rationale: பெயரெச்சமாக வரும் எபிரெய வடிவத்தின் விவரிப்பு மற்றும் நேரடி அழைப்பின் தன்மையை இயல்பான தமிழில் இணைக்கிறது.
- source_word: שׁוּב לְאַרְצְךָ
  choice: உன் நாட்டிற்கு ... திரும்பிப் போ
  rationale: שׁוּב என்பதன் புவியியல் பொருளான ‘திரும்புதல்’ என்பதையும் אֶרֶץ என்பதன் ‘நாடு/நிலம்’ பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּלְמוֹלַדְתְּךָ
  choice: உன் உறவினரிடமும்
  rationale: מוֹלֶדֶת என்பது பிறப்பிடம், பூர்வீகச் சூழல் அல்லது இனத்தார்/உறவினர் குழுவைக் குறிக்கலாம். யாக்கோபு கானானில் பிறந்தவன் என்பதால் ‘பிறந்த இடம்’ என்பது இச்சூழலில் தவறாக வழிநடத்தும்; குடும்பத்தாரைக் குறிக்கும் ‘உறவினர்’ சூழலுக்கு ஏற்றது.
- source_word: וְאֵיטִיבָה עִמָּךְ
  choice: நான் உனக்கு நன்மை செய்வேன்
  rationale: யטב என்பதன் ஹிஃபில் வடிவமும் עִם முன்னிடைச்சொல்லும் சேர்ந்து நன்மையாக நடத்துதல் அல்லது நன்மை அளித்தல் என்ற பொருளைத் தருகின்றன. தமிழில் இது இயல்பாகவும் தெளிவாகவும் உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரை ஒரு பொதுப்பட்டத்தை அல்ல, உடன்படிக்கையின் தனிப்பெயரைப் பயன்படுத்துகிறது. ஆகவே பெயரின் தன்மையைப் பாதுகாக்க ஒலிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- issue: מוֹלֶדֶת என்பதன் உறவினர்/பிறப்பிடம் தெளிவின்மை
  choice: உறவினர்
  alternative: பூர்வீக இடம்; பிறந்த இடம்
  rationale: சொல்லின் பொருள் பரப்பை அடிக்குறிப்பில் பாதுகாக்கும் போதும், யாக்கோபு கானானில் பிறந்தவன் என்ற கதைக்களச் சூழல் காரணமாக முதன்மை உரையில் ‘உறவினர்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபத்திற்குரிய கண்ணியமான நேரடி அழைப்பு நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் வேண்டுதலின் தொடக்கம் என்பதால் இறுதியில் தொடர்ச்சியைக் காட்டும் நிறுத்தற்குறி வைக்கப்பட்டுள்ளது.
