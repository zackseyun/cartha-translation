revisions:
- from: ஆகவே, இன்றுவரை இஸ்ரவேலின் மக்கள் தொடையின் மூட்டுக்கிண்ணத்தின்மேல் இருக்கும் இடுப்புநரம்பை[a] உண்பதில்லை. ஏனெனில், அவர் யாக்கோபின் தொடை மூட்டுக்கிண்ணத்தில், அந்த இடுப்புநரம்புள்ள இடத்தில் தொட்டார்.
  to: ஆகவே, இன்றுவரை இஸ்ரவேல் மக்கள் தொடை மூட்டுக்குழியில் இருக்கும் இடுப்புத் தசைநாரை[a] உண்பதில்லை. ஏனெனில், அவர் யாக்கோபின் தொடை மூட்டுக்குழியில், அந்தத் தசைநார் இருக்கும் இடத்தில் தொட்டார்.
