base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/033.yaml
  text: Therefore[a], to this day the sons of Israel do not eat the sinew of the hip, which is on the socket of the thigh[d][c][b], because he touched the socket of Jacob’s thigh at the sinew of the hip.
translation:
  language: ta
  text: ஆகவே, இன்றுவரை இஸ்ரவேல் மக்கள் தொடை மூட்டுக்குழியில் இருக்கும் இடுப்புத் தசைநாரை[a] உண்பதில்லை. ஏனெனில், அவர் யாக்கோபின் தொடை மூட்டுக்குழியில், அந்தத் தசைநார் இருக்கும் இடத்தில் தொட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு வரும் எபிரெயச் சொல்லின் துல்லியமான உடற்கூற்று அடையாளம் உறுதியல்ல; இது ‘தசைநார்’ என்றும், குறிப்பாக ‘சியாட்டிக் நரம்பு’ அல்லது அதனுடன் தொடர்புடைய நார் என்றும் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: ஆகவே
  rationale: தொடர்ந்து நிலவும் வழக்கத்திற்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய காரண-விளைவு தொடரை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לֹא יֹאכְלוּ
  choice: உண்பதில்லை
  rationale: எதிர்மறை imperfect இங்கு தொடரும் வழக்கத்தைக் குறிக்கிறது; தமிழ் நிகழ்கால வழக்குச் சொற்றொடர் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்குச் சொல் 'இஸ்ரவேலின் மகன்கள்' எனுவது தமிழில் ஆண்களை மட்டும் குறிக்கக்கூடும்; இங்கு மக்களினத்தைக் குறிக்கும் குடும்பவழி எபிரெய மரபை 'மக்கள்' இயல்பாகத் தருகிறது.
- source_word: גִּיד הַנָּשֶׁה
  choice: இடுப்புநரம்பு
  rationale: குறிப்பிட்ட தசைநார்/நரம்பமைப்பின் துல்லிய அடையாளம் உறுதியல்ல. சூழலில் இடுப்புப் பகுதியைச் சார்ந்த நாண்போன்ற உடற்கூற்றை எளிய தமிழில் குறிக்கிறது; மாற்று அடையாளங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: אֲשֶׁר עַל כַּף הַיָּרֵךְ
  choice: தொடையின் மூட்டுக்கிண்ணத்தின்மேல் இருக்கும்
  rationale: כף என்பதன் குழிவு/மூட்டுக்கிண்ணப் பொருளையும் ירך என்பதன் தொடை-இடுப்புப் பகுதியையும் தெளிவாக வைத்திருக்கிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை
  rationale: வழக்கம் தொடர்ந்து நிலவுவதைச் சொல்லும் எபிரெய காலத் தொடருக்கான இயல்பான நவீனத் தமிழ்.
- source_word: כִּי נָגַע
  choice: ஏனெனில், அவர் ... தொட்டார்
  rationale: נגע என்பதன் அடிப்படைப் பொருளான 'தொடு' என்பதையே காக்கிறது; முந்தைய சூழலில் தொடுதலின் வலிமை தெரிந்தாலும் இங்கு 'அடித்தார்' என மிகைப்படுத்தவில்லை.
- source_word: בְּכַף יֶרֶךְ יַעֲקֹב בְּגִיד הַנָּשֶׁה
  choice: யாக்கோபின் தொடை மூட்டுக்கிண்ணத்தில், அந்த இடுப்புநரம்புள்ள இடத்தில்
  rationale: בְ என்பதன் இடவியல் நுணுக்கத்தை வெளிப்படுத்தி, தொடப்பட்ட இடத்தையும் நரம்புடன் அதன் தொடர்பையும் இயல்பான தமிழில் தருகிறது.
