  language: ta
  text: பெண் வெள்ளாடுகள் இருநூறும் ஆண் வெள்ளாடுகள் இருபதும், பெண் செம்மறியாடுகள் இருநூறும் ஆண் செம்மறியாடுகள் இருபதும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִזִּים
  choice: பெண் வெள்ளாடுகள்
  rationale: இச்சொல் வெள்ளாடுகளைக் குறிக்கிறது; ஆண் வெள்ளாடுகளுடன் இணைத்துக் கணக்கிடப்படும் இப்பட்டியலில் பாலின வேறுபாட்டைத் தெளிவாகக் காட்டுவது பொருத்தமானது.
- source_word: מָאתַיִם
  choice: இருநூறு
  rationale: எண்ணைக் குறிக்கும் நேரடியான தமிழ் இணை.
- source_word: תְיָשִׁים
  choice: ஆண் வெள்ளாடுகள்
  rationale: இச்சொல் ஆண் வெள்ளாடுகளைக் குறிக்கிறது. நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் பாலினத்தை வெளிப்படுத்துகிறது.
- source_word: עֶשְׂרִים
  choice: இருபது
  rationale: எண்ணைக் குறிக்கும் நேரடியான தமிழ் இணை.
- source_word: רְחֵלִים
  choice: பெண் செம்மறியாடுகள்
  rationale: இச்சொல் பெண் செம்மறியாடுகளைக் குறிக்கிறது; அடுத்துவரும் ஆண் செம்மறியாடுகளுடனான பாலின இணையைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֵילִים
  choice: ஆண் செம்மறியாடுகள்
  rationale: இச்சொல் ஆண் செம்மறியாடுகளைக் குறிக்கிறது. பொதுவாசகர்களுக்கு விளங்கும் இயல்பான சொல்லாக்கம் இது.
