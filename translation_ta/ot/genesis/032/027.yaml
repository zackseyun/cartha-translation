source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שַׁלְּחֵ֔/נִי כִּ֥י עָלָ֖ה הַ/שָּׁ֑חַר וַ/יֹּ֨אמֶר֙ לֹ֣א אֲשַֽׁלֵּחֲ/ךָ֔ כִּ֖י אִם בֵּרַכְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/027.yaml
  text: And he said[a], “Let me go, for the dawn has risen.” But he said[c][b], “I will not let you go unless you bless me.”
translation:
  language: ta
  text: அப்போது, “என்னைப் போகவிடு[a]; ஏனெனில் விடியல் உதித்துவிட்டது[b]” என்றார்.[c] அதற்கு, “நீ என்னை ஆசீர்வதித்தாலொழிய உன்னைப் போகவிடமாட்டேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னை விடுவி” அல்லது “என்னை அனுப்பிவிடு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பொழுது புலர்கிறது.”
    reason: lexical_alternative
  - marker: c
    text: இந்த வசனத்தின் எபிரெய உரை பேசுகிறவர்கள் யார் என்பதை வெளிப்படையாகக் குறிப்பிடவில்லை; அவர்களின் அடையாளங்கள் சுற்றியுள்ள கதையிலிருந்து ஊகிக்கப்படுகின்றன.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: என்னைப் போகவிடு
  rationale: שׁלח என்பதன் கட்டளை வடிவம் இச்சூழலில் ‘விடுவி/அனுப்பிவிடு’ என்று பொருள்படுகிறது. மல்யுத்தச் சூழலில் ‘என்னைப் போகவிடு’ என்பது இயல்பான தமிழாகவும் வேண்டுகோளின் வலிமையைத் தக்கவைத்ததாகவும் உள்ளது.
- source_word: כִּי עָלָה הַשָּׁחַר
  choice: ஏனெனில் விடியல் உதித்துவிட்டது
  rationale: כִּי என்பதன் காரணப் பொருளை ‘ஏனெனில்’ காக்கிறது; עָלָה என்ற ‘எழுதல்/மேலெழுதல்’ படிமத்தை ‘உதித்துவிட்டது’ ஓரளவு தக்கவைக்கிறது. הַשָּׁחַר என்பதற்கு ‘விடியல்’ இயல்பான நவீனத் தமிழ்.
- source_word: לֹא אֲשַׁלֵּחֲךָ
  choice: உன்னைப் போகவிடமாட்டேன்
  rationale: மறுப்புடன் வரும் நிறைவுறாத வினை உறுதியான மறுப்பைக் காட்டுகிறது. முந்தைய שׁלח வினையுடன் உள்ள சொல் எதிரொலியைத் தக்கவைக்க ‘போகவிடு/போகவிடமாட்டேன்’ என ஒரே சொல்லாக்கம் பயன்படுத்தப்பட்டது.
- source_word: כִּי אִם
  choice: ஆலொழிய
  rationale: இந்தச் சொற்றொடர் விதிவிலக்கு அல்லது நிபந்தனையை அறிமுகப்படுத்துகிறது. ‘ஆலொழிய’ என்பது ‘unless’ என்ற பொருளைச் சுருக்கமாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: בֵּרַכְתָּנִי
  choice: நீ என்னை ஆசீர்வதித்தால்
  rationale: எபிரெய நிறைவு வினை இங்கு விடுவிப்பதற்கு முன் நிறைவேற்றப்பட வேண்டிய நிபந்தனையைக் குறிக்கிறது. தமிழில் ‘ஆசீர்வதித்தால்’ அந்த நிபந்தனைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: என்றார் ... அதற்கு ... என்றார்
  rationale: எபிரெயம் இரு பேச்சுகளையும் ஒரே ‘அவர் சொன்னார்’ வடிவில் தருகிறது. தமிழில் எழுவாயைக் கூட்டாமல் ‘என்றார்’ என்று மொழிபெயர்ப்பது மூலத்தின் அடையாளத் தெளிவின்மையைக் காக்கிறது; ‘அதற்கு’ உரையாடலின் எதிர்வினையை இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: பேசுகிறவர்களின் அடையாளம்
  choice: ‘யாக்கோபு,’ ‘அந்த மனிதர்,’ ‘தூதன்,’ அல்லது ‘தேவன்’ என்று பெயரிட்டு அடையாளப்படுத்தாமல், எழுவாய் விடுபட்ட ‘என்றார் ... என்றார்’ என்ற அமைப்பைப் பயன்படுத்துதல்
  alternative: சூழலை அடிப்படையாகக் கொண்டு முதல் பேச்சாளரை அந்த மனிதர்/தூதன் என்றும் இரண்டாம் பேச்சாளரை யாக்கோபு என்றும் வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: இவ்வசனத்தின் எபிரெய உரையில் இரு வினைகளுக்கும் வெளிப்படையான பெயர்ச்சொல் எழுவாய் இல்லை; மூன்றாம் ஆண்பால் ஒருமை வினை வடிவுகள் மட்டுமே உள்ளன. பெயரிட்டு மொழிபெயர்ப்பது சுற்றியுள்ள கதையிலிருந்து விளக்கத்தை இவ்வசனத்துக்குள் சேர்த்துவிடும். எழுவாயை விடுவது மூல உரையின் கதைசார் மற்றும் இறையியல் அழுத்தத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் சாதாரண வாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘விடியல் உதித்துவிட்டது’ மூலத்தின் எழுதல் படிமத்தைத் தக்கவைக்கிறது; ‘பொழுது புலர்கிறது’ இயல்பான மாற்றாக அடிக்குறிப்பில் தரப்பட்டுள்ளது. இரு பேச்சாளர்களையும் பெயரிடாமல் தமிழில் எழுவாயை விடுவதன் மூலம் எபிரெயத்தின் உண்மையான தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
