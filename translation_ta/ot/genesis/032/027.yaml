  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாகவும் உரையாடலுக்கேற்ற சுருக்கத்துடனும் உள்ளது. ‘அதற்கு’ இரண்டாவது பேச்சை இயல்பாக எதிர்வினையாக இணைக்கிறது; அது மூலத்தின் உரையாடல் ஓட்டத்திற்கு முரணல்ல.
  terminology: ‘ஆசீர்வதித்தல்’ வேதாகமத் தமிழில் நிலையானதும் நவீன வாசகர்களுக்குப் புரியக்கூடியதுமான சொல்லாகும். பெயர், தூதன், அல்லது தேவன் என்று எந்தப் பேச்சாளரையும் வெளிப்படையாக அடையாளப்படுத்தாதது மூலத்தின் திட்டமிட்ட தெளிவின்மையைப் பாதுகாக்கிறது. அடிக்குறிப்புகள் முறையாகத் தொடர்புடைய இடங்களில் இணைக்கப்பட்டுள்ளன.
