  text: וַ/אֲמַרְתֶּ֕ם גַּ֗ם הִנֵּ֛ה עַבְדְּ/ךָ֥ יַעֲקֹ֖ב אַחֲרֵ֑י/נוּ כִּֽי אָמַ֞ר אֲכַפְּרָ֣ה פָנָ֗י/ו בַּ/מִּנְחָה֙ הַ/הֹלֶ֣כֶת לְ/פָנָ֔/י וְ/אַחֲרֵי כֵן֙ אֶרְאֶ֣ה פָנָ֔י/ו אוּלַ֖י יִשָּׂ֥א פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/021.yaml
  text: And you shall also say[a], ‘Look, your servant Jacob is behind us,’ for he said, ‘I will appease him with the gift that is going ahead of me, and afterward I will see his face[b]; perhaps he will accept me.’
translation:
  language: ta
  text: மேலும், ‘இதோ, உங்கள் பணியாளன் யாக்கோபு எங்களுக்குப் பின்னால் வருகிறார்’ என்றும் சொல்லுங்கள்; ஏனெனில் அவன், ‘எனக்கு முன்னால் செல்லும் அன்பளிப்பினால் அவரைச் சாந்தப்படுத்துவேன்[a]. அதன்பின் அவரை நேரில் காண்பேன்; ஒருவேளை அவர் என்னை ஏற்றுக்கொள்வார்[b]’ என்று சொல்லியிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “அவருடைய முகத்தைச் சாந்தப்படுத்துவேன்.” இங்கு பயன்படுத்தப்பட்ட வினைச்சொல் பாவநிவர்த்தி தொடர்பான மொழியோடும் தொடர்புடையது; ஆனால் இவ்விடத்தில், அன்பளிப்பின் மூலம் ஏசாவை இணங்கச் செய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “அவர் என் முகத்தை உயர்த்துவார்.” இது “அவர் என்னை ஏற்றுக்கொள்வார்” அல்லது “எனக்குத் தயவு காட்டுவார்” என்று பொருள்படும் மரபுத்தொடர். இந்த வசனத்தின் எபிரெய மூலத்தில் “முகம்” என்ற சொல் மூன்று முறை வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  choice: உங்கள் பணியாளன்
  rationale: ஏசாவிடம் தன்னைத் தாழ்த்திப் பேசும் யாக்கோபின் மரியாதைமிக்க தூதரகப் பேச்சை இது வெளிப்படுத்துகிறது; இச்சூழலில் ‘அடிமை’ என்பதைக் காட்டிலும் ‘பணியாளன்’ இயல்பானது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் இடைச்சொல்லின் உடனடித் தன்மையை இயல்பான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: אַחֲרֵינוּ
  choice: எங்களுக்குப் பின்னால் வருகிறார்
  rationale: யாக்கோபு தூதர்களுக்குப் பின்னால் இருப்பதையும் அவர்களைத் தொடர்ந்து வருவதையும் தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: אֲכַפְּרָה
  choice: சாந்தப்படுத்துவேன்
  rationale: כפר என்ற வேர்ச்சொல் இங்கு பலியாராதனை சார்ந்த பாவநிவர்த்தியை அல்ல, அன்பளிப்பினால் ஏசாவின் சீற்றத்தைத் தணித்து அவரை இணங்கச் செய்வதைக் குறிக்கிறது.
- source_word: מִנְחָה
  choice: அன்பளிப்பு
  rationale: இக்கதைச் சூழலில் யாக்கோபு ஏசாவுக்கு அனுப்பிய சமரச நோக்கமுள்ள பரிசைக் குறிக்கிறது; ‘காணிக்கை’ உருவாக்கக்கூடிய வழிபாட்டுச் சார்பைத் தவிர்க்கிறது.
- source_word: הַהֹלֶכֶת לְפָנַי
  choice: எனக்கு முன்னால் செல்லும்
  rationale: அன்பளிப்பு யாக்கோபுக்கு முன்பாகப் பயணித்துக்கொண்டிருப்பதை இயல்பாகவும் மூலத்தின் நிகழ்காலப் பங்கேற்பு வடிவுக்கு ஏற்றவாறும் தெரிவிக்கிறது.
- source_word: אֶרְאֶה פָנָיו
  choice: அவரை நேரில் காண்பேன்
  rationale: சொல்லுக்குச் சொல் ‘அவருடைய முகத்தைக் காண்பேன்’ என்றாலும், நேருக்கு நேர் சந்திப்பதைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; முகம் பற்றிய எபிரெயச் சொல்விளையாட்டு அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: יִשָּׂא פָנַי
  choice: அவர் என்னை ஏற்றுக்கொள்வார்
  rationale: சொல்லுக்குச் சொல் ‘என் முகத்தை உயர்த்துவார்’ என்ற எபிரெய மரபுத்தொடரின் பொருளான சாதகமான வரவேற்பைத் தெளிவான நவீன தமிழில் அளிக்கிறது.
- source_word: אוּלַי
  choice: ஒருவேளை
  rationale: யாக்கோபின் நம்பிக்கையுடன் கலந்த உறுதியின்மையை இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: כפר என்ற சொல்லை மனிதர்களுக்கிடையேயான சூழலில் மொழிபெயர்த்தல்
  choice: அவரைச் சாந்தப்படுத்துவேன்
  alternative: அவருக்காகப் பாவநிவர்த்தி செய்வேன்
  rationale: இதன் பொருள் ஏசாவின் ‘முகத்தை’ அன்பளிப்பின் மூலம் இணங்கச் செய்வதாகும்; சடங்கு அல்லது பலியாராதனை சார்ந்த பாவநிவர்த்தியை உரைக்குள் கொண்டுவராமல், வேர்ச்சொல்லின் பரந்த தொடர்பை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: יִשָּׂא פָנַי என்ற மரபுத்தொடரின் பொருள்
  choice: அவர் என்னை ஏற்றுக்கொள்வார்
  alternative: அவர் என் முகத்தை உயர்த்துவார்
  rationale: மூலத்தின் உருவகம் சாதகமாக ஏற்றுக்கொள்ளுதல் அல்லது தயவு காட்டுதல் என்பதைக் குறிக்கிறது. இயல்பான தமிழ்ப் பொருள் முதன்மை உரையில் தரப்பட்டு, மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பணியாளன்’ யாக்கோபின் பணிவான சுயதாழ்த்தலைக் காக்கிறது. மூலத்தில் மீண்டும் வரும் ‘முகம்’ என்ற சொல்லின் சொல்விளையாட்டைத் தமிழில் முழுமையாகச் சொல்லுக்குச் சொல் வைத்தால் செயற்கையாக இருப்பதால், பொருள் முதன்மை உரையிலும் மூல உருவகம் அடிக்குறிப்புகளிலும் பாதுகாக்கப்பட்டுள்ளது.
