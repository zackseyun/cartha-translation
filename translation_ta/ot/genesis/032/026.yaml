  yaml_path: translation/ot/genesis/032/026.yaml
  text: When he saw that he could not prevail against him[a], he touched the socket of his thigh[c][b], and the socket of Jacob’s thigh was dislocated as he wrestled with him.
translation:
  language: ta
  text: அவனை வெல்ல முடியவில்லை[a] என்று அவன் கண்டபோது, அவனுடைய தொடை மூட்டின் குழியை[b][c]த் தொட்டான். அவனோடு மல்லுக்கட்டிக்கொண்டிருந்தபோது யாக்கோபின் தொடை மூட்டின் குழி இடம் விலகியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனை அடக்க முடியவில்லை.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அவனுடைய தொடையின் குழிவான பகுதி’; மரபாக, ‘அவனுடைய தொடையின் குழி.’
    reason: lexical_alternative
  - marker: c
    text: எபிரெயச் சுட்டுப்பெயர்கள் யாரைக் குறிக்கின்றன என்பது தெளிவாகக் கூறப்படவில்லை; யாக்கோபின் எதிராளி யார் என்பதை இந்த வசனம் மீண்டும் பெயரிட்டுச் சொல்லவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: என்று அவன் கண்டபோது
  rationale: தொடர்கதை நிகழ்வையும் காலத் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; எழுவாயை பெயரிட்டு விளக்காமல் எபிரெய மொழியின் சுட்டுப்பெயர் அமைப்பைத் தக்கவைக்கிறது.
- source_word: לֹא יָכֹל לוֹ
  choice: தன்னால் அவனை வெல்ல முடியவில்லை
  rationale: יכל + ל என்பதன் எதிராளிக்கு எதிரான இயலாமையை மல்லுக்கட்டும் சூழலில் தெளிவாகக் காட்டுகிறது; முழுமையான வலிமையின்மையை மிகைப்படுத்தவில்லை.
- source_word: וַיִּגַּע
  choice: தொட்டான்
  rationale: נגע என்பதன் இயல்பான பொருள் ‘தொடு’. அதன் விளைவு கடுமையானதாக இருந்தாலும், மூலத்தில் இல்லாத ‘அடித்தான்’ என்ற வலுவான கருத்தைச் சேர்க்கவில்லை.
- source_word: בְּכַף יְרֵכוֹ
  choice: அவனுடைய தொடை மூட்டுக்குழியை
  rationale: כף ירך குறிக்கும் தொடை அல்லது இடுப்பு மூட்டின் குழிவான பகுதியை புரியக்கூடிய நவீன தமிழில் கூறுகிறது; சுட்டுப்பெயரின் தெளிவின்மையையும் தக்கவைக்கிறது.
- source_word: וַתֵּקַע
  choice: இடம் விலகியது
  rationale: மூட்டு தன் இடத்திலிருந்து விலகிய விளைவைத் தெளிவாகக் கூறுகிறது; தமிழில் இயல்பாகவும் மருத்துவத் தன்மை மிகாமலும் உள்ளது.
- source_word: כַּף יֶרֶךְ יַעֲקֹב
  choice: யாக்கோபின் தொடை மூட்டுக்குழி
  rationale: முந்தைய சொற்றொடருடன் சொல் ஒருமைப்பாட்டைக் காத்து, இங்கு எபிரெயத்தில் யாக்கோபின் பெயர் வெளிப்படையாக வருவதைப் பிரதிபலிக்கிறது.
- source_word: בְּהֵאָבְקוֹ עִמּוֹ
  choice: அவனோடு மல்லுக்கட்டிக்கொண்டிருந்தபோது
  rationale: ஒரே நேரத்தில் நடந்த செயலை இயல்பான தமிழில் தருகிறது; இரு சுட்டுப்பெயர்களும் யாரைக் குறிக்கின்றன என்பதை மொழிபெயர்ப்பு கூடுதலாக நிர்ணயிக்கவில்லை.
theological_decisions:
- issue: மல்லுக்கட்டும் நிகழ்விலுள்ள ‘அவன்’, ‘அவனை’, ‘அவனுடைய’ ஆகிய சுட்டுப்பெயர்களின் குறிப்பு
  choice: எதிராளியை மனிதன், தூதன் அல்லது இறைவன் என்று இந்த வசனத்திலேயே பெயரிட்டு அடையாளப்படுத்தாமல், எபிரெயத்தின் சுட்டுப்பெயர் தெளிவின்மையைத் தக்கவைத்தல்.
  alternative: தொட்டவர் யாக்கோபின் எதிராளி என்றும், அவரைத் தெய்வீக நபர் என்றும் வெளிப்படையாக அடையாளப்படுத்துதல்.
  rationale: உடனடி எபிரெய உரை எழுவாயின் அடையாளத்தை மீண்டும் பெயரிட்டுக் கூறவில்லை. அந்த நபரின் முக்கியத்துவத்தை விரிந்த பகுதி படிப்படியாக வெளிப்படுத்துவதால், மொழிபெயர்ப்பு இந்த வசனம் கூறுவதைவிட அதிகமாகத் தீர்மானிக்கக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு விளங்கும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘மல்லுக்கட்டுதல்’ என்பது האבק என்பதற்கான இயல்பான நடப்புத் தமிழ்; ‘தொடை மூட்டுக்குழி’ உடற்பகுதியைத் தெளிவாக்கினாலும், மூலத்தின் ‘தொடை’ கூறை நீக்கவில்லை. சுட்டுப்பெயர்கள் திட்டமிட்டு பெயர்ச்சொற்களால் மாற்றப்படவில்லை.
