  edition: WLC
  text: וַ/יִּקָּחֵ֔/ם וַ/יַּֽעֲבִרֵ֖/ם אֶת הַ/נָּ֑חַל וַֽ/יַּעֲבֵ֖ר אֶת אֲשֶׁר ל/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/024.yaml
  text: He took them and brought them across the stream[b][a], and he brought across what belonged to him.
translation:
  language: ta
  text: அவன் அவர்களை அழைத்துச் சென்று, ஓடையைக்[a] கடக்கச் செய்தான்; தனக்குச் சொந்தமானவற்றையும்[b] அக்கரைக்குக் கொண்டுசென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பள்ளத்தாக்கு’ அல்லது ‘பருவகால நீரோடை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் נחל ஓடையையோ, பள்ளத்தாக்கையையோ, பருவகாலத்தில் மட்டும் நீர் ஓடும் நீர்வழியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘அவனுக்கு இருந்தவற்றை’; அதாவது, அவனுக்குச் சொந்தமானவற்றை அல்லது அவனுடைய உடைமைகளை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵם
  choice: அவன் அவர்களை அழைத்துச் சென்று
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்/அழைத்துச் செல்.’ இங்கு முன்பு குறிப்பிடப்பட்டவர்களை யாக்கோபு தன்னுடன் அழைத்துச் சென்றதை இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தில் இல்லாத கூடுதல் கருத்தைச் சேர்ப்பதில்லை.
- source_word: וַיַּעֲבִרֵם
  choice: கடக்கச் செய்தான்
  rationale: 'עבר வினையின் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளை நேரடியாகப் பாதுகாக்கிறது: அவன் அவர்களைக் கடக்கச் செய்தான்.'
- source_word: הַנָּחַל
  choice: ஓடை
  rationale: נחל என்பது ஓடை, பள்ளத்தாக்கு அல்லது பருவகால நீரோடை ஆகியவற்றைக் குறிக்கலாம். இந்தக் கடக்கும் நிகழ்வில் ‘ஓடை’ தெளிவாகவும் இயல்பாகவும் உள்ளது; நிலவியல் சார்ந்த பரந்த பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: וַיַּעֲבֵר
  choice: அக்கரைக்குக் கொண்டுசென்றான்
  rationale: עבר என்பதன் ஹிஃபில் காரணவினை இங்கு உடைமைகளை மறுபுறம் கொண்டுசெல்வதைக் குறிக்கிறது. பொருட்களைப் பற்றிய தமிழில் ‘கடக்கச் செய்தான்’ என்பதைவிட இச்சொற்றொடர் இயல்பானது; கடந்துசெல்லச் செய்த பொருளையும் தக்கவைக்கிறது.
- source_word: אֲשֶׁר לוֹ
  choice: தனக்குச் சொந்தமானவற்றையும்
  rationale: இச்சார்பு சொற்றொடரின் நேரடிப் பொருள் ‘அவனுக்கு இருந்தவை/அவனுடையவை.’ சூழலில் அது அவனுடைய உடைமைகளைக் குறிக்கிறது; ஒரே வகைச் சொத்தாகக் குறுக்காமல் மூலத்தின் பொதுத்தன்மையைப் பாதுகாக்கிறது.
