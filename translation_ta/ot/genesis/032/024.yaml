translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. முதல் עבר வடிவின் காரணவினை ‘கடக்கச் செய்தான்’ என்று வெளிப்படையாக வைக்கப்பட்டுள்ளது; பொருட்களைச் சுட்டும் இரண்டாவது இடத்தில் இயல்பான தமிழுக்காக ‘அக்கரைக்குக் கொண்டுசென்றான்’ பயன்படுத்தப்பட்டுள்ளது. இரு அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்றொடர்களின் உடனடிப் பின்னால் வைக்கப்பட்டுள்ளன.
