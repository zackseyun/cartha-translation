translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதாகப் புரியும், ஆனால் வேதாகம உரைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இந்த வார்த்தையின்படியே’ என்பது சற்றே வடிவநெருக்கமான சொற்றொடராக இருந்தாலும், முன் வசனத்தில் வகுத்துக் கொடுக்கப்பட்ட செய்தியுடனான தொடர்பையும் மூலத்தின் சொல்லமைப்பையும் காக்கிறது.
