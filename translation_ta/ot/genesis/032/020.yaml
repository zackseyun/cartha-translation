base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/020.yaml
  text: And he commanded the second also[a], and the third also, and all those going behind the droves, saying, “According to this word you shall speak to Esau when you find him.”
translation:
  language: ta
  text: அவன் இரண்டாமவனுக்கும், மூன்றாமவனுக்கும், மந்தைகளுக்குப் பின்னால் சென்றுகொண்டிருந்த அனைவருக்கும் கட்டளையிட்டு, “நீங்கள் ஏசாவைக் காணும்போது, இந்த வார்த்தையின்படியே[a] ஏசாவிடம் பேசுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் ஏசாவைச் சந்திக்கும்போது, இவ்வாறே ஏசாவிடம் சொல்லுங்கள்.” எபிரெயச் சொற்றொடர் முன்கூறப்பட்ட வார்த்தைகளின்படி பேசுவதையோ, இன்னும் இயல்பாக ‘இவ்வாறே சொல்லுங்கள்’ என்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டு
  rationale: צוה என்பதன் பியேல் வடிவம் அதிகாரத்துடன் கொடுக்கப்படும் கட்டளையைக் குறிக்கிறது; ‘அறிவுறுத்தி’ என்பதைவிட மூலத்தின் வலிமையை இது நன்றாகக் காக்கிறது.
- source_word: הַשֵּׁנִי / הַשְּׁלִישִׁי
  choice: இரண்டாமவனுக்கும், மூன்றாமவனுக்கும்
  rationale: எபிரெயத்தில் பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட வரிசை எண்கள் ஆண்பால் ஒருமையில் உள்ளன. சூழலில் இவர்கள் அடுத்தடுத்த மந்தைகளை நடத்திச் சென்றவர்கள்; ‘வேலைக்காரன்’ போன்ற வெளிப்படையாக இல்லாத பெயர்ச்சொல்லைச் சேர்க்காமல் தமிழ் வடிவம் குறிப்பைத் தக்கவைக்கிறது.
- source_word: כָּל הַהֹלְכִים אַחֲרֵי הָעֲדָרִים
  choice: மந்தைகளுக்குப் பின்னால் சென்ற அனைவருக்கும்
  rationale: הֹלְכִים என்ற பங்கேற்பு வடிவம் அந்தக் குழுவினர் சென்றுகொண்டிருந்ததைக் குறிக்கிறது. עֲדָרִים இங்கு அடுத்தடுத்து ஓட்டிச் செல்லப்பட்ட கால்நடைக் கூட்டங்களைக் குறிக்கும்; ‘மந்தைகள்’ இயல்பான தமிழ்ச் சொல்.
- source_word: כַּדָּבָר הַזֶּה
  choice: இந்த வார்த்தையின்படியே
  rationale: சொல்லுக்குச் சொல் பொருள் ‘இந்த வார்த்தை/செய்தியின்படி’. யாக்கோபு முன்பே வகுத்துக் கொடுத்த சொல்லாக்கத்தைக் குறிப்பதை முதன்மை உரை வெளிப்படையாகப் பாதுகாக்கிறது; இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תְּדַבְּרוּן
  choice: பேசுங்கள்
  rationale: דבר என்பதன் அடிப்படைப் பொருள் ‘பேசு’. இங்கு யாக்கோபின் கட்டளைக்குள் வரும் இரண்டாம் நபர் பன்மை வினை என்பதால் தமிழ் ஏவல் வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: בְּמֹצַאֲכֶם אֹתוֹ
  choice: நீங்கள் ஏசாவைக் காணும்போது
  rationale: מצא என்பதன் காலச்சூழல் பயன்பாட்டை ‘காணும்போது’ நேரடியாகக் காட்டுகிறது. சூழலில் ‘சந்திக்கும்போது’ என்பதும் சாத்தியமான இயல்பான பொருள்.
