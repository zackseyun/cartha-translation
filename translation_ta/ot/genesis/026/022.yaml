source:
  edition: WLC
  text: וַ/יַּעְתֵּ֣ק מִ/שָּׁ֗ם וַ/יַּחְפֹּר֙ בְּאֵ֣ר אַחֶ֔רֶת וְ/לֹ֥א רָב֖וּ עָלֶ֑י/הָ וַ/יִּקְרָ֤א שְׁמָ/הּ֙ רְחֹב֔וֹת וַ/יֹּ֗אמֶר כִּֽי עַתָּ֞ה הִרְחִ֧יב יְהוָ֛ה לָ֖/נוּ וּ/פָרִ֥ינוּ בָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/022.yaml
  text: He moved from there and dug another well[a], and they did not quarrel over it. So he called its name Rehoboth, and said, “For now Yahweh has made room for us, and we will be fruitful in the land.”
translation:
  language: ta
  text: அவன் அங்கிருந்து இடம்பெயர்ந்து வேறொரு கிணற்றைத் தோண்டினான். அதற்காக அவர்கள் சண்டையிடவில்லை. ஆகவே, அவன் அதற்கு “ரெகொபோத்”[a] என்று பெயரிட்டு, “இப்போது யாவே நமக்கு இடமளித்திருக்கிறார்; நாம் நாட்டில் பலுகுவோம்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ரெகொபோத்” என்ற பெயர் எபிரெயத்தில் “விசாலமான இடங்கள்” என்று பொருள்படும் சொல்லை ஒத்திருக்கிறது. “யாவே நமக்கு இடமளித்திருக்கிறார்” என்ற ஈசாக்கின் விளக்கம் அந்தப் பொருளுடன் சொல் விளையாட்டை உருவாக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעְתֵּק
  choice: அங்கிருந்து இடம்பெயர்ந்து
  rationale: இந்தச் சூழலில் עתק என்பது ஈசாக்கு ஓர் இடத்திலிருந்து வேறோர் இடத்திற்குச் சென்றதைக் குறிக்கிறது. ‘இடம்பெயர்ந்து’ என்பது செயலை இயல்பாகவும் மிகைப்படுத்தாமலும் தெரிவிக்கிறது.
- source_word: בְּאֵר אַחֶרֶת
  choice: வேறொரு கிணறு
  rationale: பெயர்ச்சொற்றொடரின் நேரான, இயல்பான தமிழாக்கம்.
- source_word: וְלֹא רָבוּ עָלֶיהָ
  choice: அதற்காக அவர்கள் சண்டையிடவில்லை
  rationale: ריב இங்கு கிணற்றின் உரிமையை முன்னிட்டு ஏற்பட்ட வாக்குவாதம் அல்லது மோதலைக் குறிக்கிறது; ‘சண்டையிடவில்லை’ என்பது சூழலுக்கேற்ற பொதுநடைத் தமிழ்.
- source_word: וַיִּקְרָא שְׁמָהּ רְחֹבוֹת
  choice: அவன் அதற்கு ‘ரெகோபோத்’ என்று பெயரிட்டு
  rationale: எபிரெயப் பெயரிடும் கூற்றை இயல்பான தமிழில் தருகிறது; பெண்பால் பின்னொட்டு கிணற்றைக் குறிப்பதால் ‘அதற்கு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: רְחֹבוֹת
  choice: ரெகோபோத்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது. அதன் பொருளும் அடுத்த கூற்றுடனான சொல் விளையாட்டும் அடிக்குறிப்பில் விளக்கப்படுகின்றன.
- source_word: כִּי עַתָּה הִרְחִיב יְהוָה לָנוּ
  choice: இப்போது யாவே நமக்கு இடமளித்திருக்கிறார்
  rationale: רחב என்பதன் காரணவினை வடிவம் இங்கு இடவசதி ஏற்படுத்திக் கொடுத்தலைக் குறிக்கிறது. ‘இடமளித்திருக்கிறார்’ என்பது இயல்பாகவும் ரெகோபோத் என்ற பெயருடனான தொடர்பைத் தக்கவைத்தும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: וּפָרִינוּ בָאָרֶץ
  choice: நாம் இந்த நாட்டில் பலுகுவோம்
  rationale: פרה என்பதன் ‘பலுகுதல், கனிதருதல்’ என்ற அடிப்படைப் பொருளையும் உடன்படிக்கை ஆசீர்வாதத்தின் எதிரொலியையும் ‘பலுகுவோம்’ தக்கவைக்கிறது. இச்சூழலில் אָרֶץ ஈசாக்கு வாழ்ந்த நாட்டைக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல வசனம் நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதைப் பொதுவான பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று தருவது மூலத்தின் தனித்த இறைப் பெயரைப் பாதுகாக்கிறது.
- issue: וּפָרִינוּ என்பதிலுள்ள ஆசீர்வாத மொழி
  choice: பலுகுவோம்
  alternative: பெருகுவோம்
  rationale: ‘பலுகுவோம்’ என்பது פרה என்பதன் கனிதருதல் அல்லது பலனுள்ளவர்களாதல் என்ற உருவகத்தையும் ஆதியாகமத்தின் ஆசீர்வாத மொழியுடனான தொடர்பையும் பாதுகாக்கிறது; ‘பெருகுவோம்’ எண்ணிக்கை அதிகரிப்பை மட்டும் முன்னிறுத்தக்கூடும்.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. ‘பலுகுவோம்’ என்பது இன்றைய பொதுப்பேச்சில் அரிதானதாயினும், மூலச்சொல்லின் கனிதருதல் சார்ந்த பொருளையும் ஆதியாகம ஆசீர்வாத மொழியையும் தக்கவைக்கும் தெளிவான இலக்கியச் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது.
