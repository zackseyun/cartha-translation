source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲבִימֶ֖לֶךְ אֶל יִצְחָ֑ק לֵ֚ךְ מֵֽ/עִמָּ֔/נוּ כִּֽי עָצַֽמְתָּ מִמֶּ֖/נּוּ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/016.yaml
  text: Then Abimelech said to Isaac[a], “Go away from us, because you have become much stronger than we are.”
translation:
  language: ta
  text: அப்போது அபிமெலேக்கு ஈசாக்கிடம், “எங்களைவிட்டுப் போய்விடு; ஏனெனில் நீ எங்களைவிட மிகவும் வலிமைமிக்கவனாகிவிட்டாய்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களுடன் ஒப்பிடுகையில் நீ மிகவும் ஆற்றல்மிக்கவனாக வளர்ந்துவிட்டாய்.”
    reason: עצם என்பது ‘வலிமைமிக்கவனாகுதல்’, ‘ஆற்றலில் பெருகுதல்’ ஆகிய நெருங்கிய பொருள்களைத் தரக்கூடும்; ஒப்பீட்டின் மாற்று இயல்பான வடிவம் இங்கே வழங்கப்படுகிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; நவீன தமிழில் “அப்போது” அதன் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲבִימֶלֶךְ
  choice: அபிமெலேக்கு
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு.
- source_word: אֶל יִצְחָק
  choice: ஈசாக்கிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לֵךְ מֵעִמָּנוּ
  choice: எங்களைவிட்டுப் போய்விடு
  rationale: “எங்களிடமிருந்து/எங்களோடு இருப்பதிலிருந்து போ” என்ற பிரிவுக் கட்டளையை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்துகிறது; மூலத்தில் இல்லாத காரணவிளக்கத்தைச் சேர்க்கவில்லை.
- source_word: עָצַמְתָּ
  choice: வலிமைமிக்கவனாகிவிட்டாய்
  rationale: עצם என்பதன் வலிமை அல்லது ஆற்றலில் பெருகிய நிலையை, அரசியல் ஆதிக்கம் என்று மிகையாகக் குறுக்காமல் வெளிப்படுத்துகிறது.
- source_word: מִמֶּנּוּ מְאֹד
  choice: எங்களைவிட மிகவும்
  rationale: מן என்பதன் ஒப்பீட்டுப் பொருளையும் מְאֹד என்பதன் தீவிரப்படுத்தும் பொருளையும் தமிழில் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. “போய்விடு” கட்டளையின் பிரிவுணர்வை இயல்பாகத் தருகிறது; “மிகவும் வலிமைமிக்கவனாகிவிட்டாய்” என்பது எபிரெய ஒப்பீட்டையும் தீவிரத்தையும் பாதுகாக்கிறது.
