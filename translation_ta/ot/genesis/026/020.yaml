base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/020.yaml
  text: Then the shepherds of Gerar quarreled with Isaac’s shepherds[a], saying, “The water is ours.” So he named the well Esek, because they had quarreled with him.
translation:
  language: ta
  text: அப்போது கேராரின் மேய்ப்பர்கள் ஈசாக்கின் மேய்ப்பர்களோடு சச்சரவு செய்து, “தண்ணீர் எங்களுடையது” என்றார்கள். அவர்கள் அவனோடு சச்சரவு செய்ததால், அவன் அந்தக் கிணற்றுக்கு ஏசேக்[a] என்று பெயரிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஏசேக்” என்ற பெயர், எபிரெய மொழியில் “சச்சரவு” அல்லது “தகராறு” எனப் பொருள்படும் சொல்லுடன் தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרִיבוּ
  choice: வாக்குவாதம் செய்து
  rationale: ריב என்பது உரிமைகோரும் சச்சரவு அல்லது தகராறைக் குறிக்கிறது. கிணற்றுத் தண்ணீரைப் பற்றிய நேரடியான வாய்மொழி மோதலுக்கு இயல்பான நவீனத் தமிழ்.
- source_word: רֹעֵי גְרָר ... רֹעֵי יִצְחָק
  choice: கேராரின் மேய்ப்பர்கள் ... ஈசாக்கின் மேய்ப்பர்கள்
  rationale: רֹעִים என்பதன் அடிப்படைப் பொருளைத் தக்கவைத்து, இரு குழுக்களுக்கிடையிலான இணை அமைப்பையும் பாதுகாக்கிறது.
- source_word: לָנוּ הַמָּיִם
  choice: இந்தத் தண்ணீர் எங்களுடையது
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘எங்களுக்கே தண்ணீர்’ என இருந்தாலும், இங்கு உரிமைகோருதலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது. சூழலுக்கேற்ப ‘இந்தத்’ சேர்க்கப்பட்டுள்ளது.
- source_word: וַיִּקְרָא שֵׁם הַבְּאֵר
  choice: அவன் அந்தக் கிணற்றுக்கு ... என்று பெயரிட்டான்
  rationale: ‘கிணற்றின் பெயரை அழைத்தான்’ என்ற எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வழங்குகிறது.
- source_word: עֵשֶׂק
  choice: ஏசேக்கு
  rationale: கிணற்றின் பெயரை ஒலிபெயர்ப்பாகத் தக்கவைக்கிறது; அதனுடன் தொடர்புடைய ‘சச்சரவு/வாக்குவாதம்’ என்ற பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: כִּי הִתְעַשְּׂקוּ עִמּוֹ
  choice: அவர்கள் அவனோடு வாக்குவாதம் செய்ததால்
  rationale: பெயரான עֵשֶׂק உடனான மூலமொழிச் சொல்விளையாட்டை தமிழில் முழுமையாக மீட்டெடுக்க முடியாவிட்டாலும், மோதல் என்ற கருத்தை மீண்டும் பயன்படுத்துகிறது. ‘அவர்கள்’ கேராரின் மேய்ப்பர்களையும், ‘அவன்’ ஈசாக்கையும் குறிக்கிறது.
