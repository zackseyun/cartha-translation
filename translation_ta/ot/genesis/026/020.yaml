revisions:
- from: அப்போது கேராரின் மேய்ப்பர்கள் ஈசாக்கின் மேய்ப்பர்களோடு வாக்குவாதம் செய்து, “இந்தத் தண்ணீர் எங்களுடையது” என்றார்கள். அதனால், அவர்கள் அவனோடு வாக்குவாதம் செய்ததால், அவன் அந்தக் கிணற்றுக்கு ஏசேக்கு[a] என்று பெயரிட்டான்.
  to: அப்போது கேராரின் மேய்ப்பர்கள் ஈசாக்கின் மேய்ப்பர்களோடு சச்சரவு செய்து, “தண்ணீர் எங்களுடையது” என்றார்கள். அவர்கள் அவனோடு சச்சரவு செய்ததால், அவன் அந்தக் கிணற்றுக்கு ஏசேக்[a] என்று பெயரிட்டான்.
  rationale: The revision removes the added demonstrative, uses broader and natural Tamil for the underlying contention, streamlines the causal syntax, and clarifies the lexical connection behind the well name without overstating a mere phonetic resemblance.
