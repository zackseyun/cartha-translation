  text: that you will do us no harm[a], just as we have not touched you and just as we have done to you only good and sent you away in peace[c][b]. You are now blessed by Yahweh.”
translation:
  language: ta
  text: “நாங்கள் உன்னைத் தொடாததுபோலும், உனக்கு நன்மை மட்டுமே செய்து உன்னைச் சமாதானத்தோடு அனுப்பிவைத்ததுபோலும், நீ எங்களுக்குத் தீங்கு செய்யமாட்டாய்[a]. இப்போது நீ யாவேயால் ஆசீர்வதிக்கப்பட்டவன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் வாக்கியம் “நீ எங்களுக்குத் தீங்கு செய்தால்” என்று இன்னும் நேரடியாக வாசிக்கப்படலாம். முந்தைய வசனத்தில் உள்ள உடன்படிக்கை அல்லது சத்தியக் கோரிக்கையின் சூழலில், இது அவர்கள் எதிர்பார்க்கும் உறுதியின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: என்று சத்தியம் செய்
  rationale: முந்தைய வசனத்தில் தொடங்கிய உடன்படிக்கைச் சத்தியத்தின் உள்ளடக்கத்தை இங்கு אִם அறிமுகப்படுத்துகிறது. தனித்த நிபந்தனையாக மட்டும் மொழிபெயர்ப்பதைவிட, தமிழில் சூழலை இயல்பாகத் தொடர இவ்வாறு வெளிப்படுத்தப்பட்டது; நேரடியான ‘எங்களுக்கு தீங்கு செய்தால்’ என்ற வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: תַּעֲשֵׂה עִמָּנוּ רָעָה
  choice: நீ எங்களுக்குத் தீங்கு செய்யமாட்டாய்
  rationale: רָעָה இச்சூழலில் பொதுவான ஒழுக்கத் ‘தீமை’ என்பதைக் காட்டிலும் பகைமையான தீங்கைக் குறிக்கிறது. தாக்காமை உடன்படிக்கைக்கு இயல்பான நவீனத் தமிழ் இது.
- source_word: נְגַעֲנוּךָ
  choice: நாங்கள் உன்னைத் தொடாததுபோல
  rationale: נגע என்பதன் நேரடியான பொருளான ‘தொடு’ காக்கப்படுகிறது; சூழலில் அது ‘தீங்கு செய்’ என்ற நிழற்பொருளையும் கொண்டிருக்கலாம் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- source_word: עָשִׂינוּ עִמְּךָ רַק טוֹב
  choice: உனக்கு நன்மை மட்டுமே செய்து
  rationale: רַק என்பதன் வலியுறுத்தலை ‘மட்டுமே’ காக்கிறது; குற்றமற்ற நடத்தை பற்றிய பேச்சாளர்களின் வாதமும் தெளிவாகிறது.
- source_word: וַנְּשַׁלֵּחֲךָ בְּשָׁלוֹם
  choice: உன்னைச் சமாதானத்தோடு அனுப்பிவைத்ததுபோல
  rationale: ‘அனுப்பிவைத்தல்’ அவர்கள் ஈசாக்கைத் தங்கள் இடத்திலிருந்து அனுப்பியதைக் காட்டுகிறது; בְּשָׁלוֹם என்பதன் பாதுகாப்பு மற்றும் நல்லுறவு சார்ந்த விரிவை ‘சமாதானத்தோடு’ காக்கிறது.
- source_word: בְּרוּךְ יְהוָה
  choice: யாவேவினால் ஆசீர்வதிக்கப்பட்டவன்
  rationale: בְּרוּךְ என்ற செயப்பாட்டு எச்சத்தின் பொருளையும் ஆசீர்வாதத்தின் மூலத்தையும் தெளிவாக்குகிறது; יְהוָה தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. பொதுப்பட்டப்பெயராக மாற்றாமல், அதன் தனிப்பெயர் தன்மையைத் தமிழில் காக்க ‘யாவே’ பயன்படுத்தப்பட்டது.
- issue: அபிமெலேக்கின் கடந்தகால நடத்தையை விவரிக்கும் கூற்றின் மதிப்பீடு
  choice: அவரது கூற்றாகவே நேரடியாக வழங்குதல்
  alternative: அந்தக் கூற்றை மொழிபெயர்ப்பிலேயே மென்மைப்படுத்துதல் அல்லது மறுத்தல்
  rationale: ‘நன்மை மட்டுமே செய்தோம்’ என்பது பேச்சாளர்களின் வாதம். அதன் வரலாற்று அல்லது ஒழுக்க மதிப்பீட்டை மொழிபெயர்ப்பு சேர்க்காமல், மூலத்தின் பதற்றம் அப்படியே விடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. வசனம் முந்தைய வசனத்தில் தொடங்கிய சத்தியக் கோரிக்கையைத் தொடர்வதால், தமிழில் முழுமையான வாக்கியமாக அமைய ‘என்று சத்தியம் செய்’ வெளிப்படையாகச் சேர்க்கப்பட்டது. பேச்சாளர்களின் சுயநியாயப்படுத்தும் தொனி மாற்றப்படவில்லை.
