base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/017.yaml
  text: So Isaac went away from there and camped in the Valley of Gerar[a], and settled there.
translation:
  language: ta
  text: எனவே ஈசாக்கு அங்கிருந்து புறப்பட்டு, கேரார் பள்ளத்தாக்கில்[a] முகாமிட்டு, அங்கே குடியேறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேரார் வாடியில்.” இங்கே வரும் எபிரெயச் சொல் பருவகால நீரோடைப் படுகை, குறுகிய பள்ளம் அல்லது பள்ளத்தாக்கைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: அங்கிருந்து புறப்பட்டு
  rationale: முந்தைய இடத்தைவிட்டு அவர் சென்றதை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּחַן
  choice: முகாமிட்டு
  rationale: חנה என்பது முகாம் அமைத்துத் தங்குவதைக் குறிக்கிறது; வாக்கியத் தொடருக்கு ஏற்றவாறு வினையெச்சமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּנַחַל גְּרָר
  choice: கேரார் பள்ளத்தாக்கில்
  rationale: נחל என்பது பருவகால நீரோடைப் படுகை, பள்ளத்தாக்கு அல்லது குறுகிய பள்ளம் ஆகியவற்றைக் குறிக்கலாம். பொதுவாசகர்களுக்கு இயல்பாகப் புரியும் ‘பள்ளத்தாக்கு’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது; பொருளின் பரப்பை அடிக்குறிப்பு காக்கிறது.
- source_word: וַיֵּשֶׁב שָׁם
  choice: அங்கே குடியேறினார்
  rationale: ישב இச்சூழலில் தங்கி வாழ்வதை அல்லது குடியேறுவதைக் குறிக்கிறது. முன்னர் வரும் ‘முகாமிட்டு’ என்பதற்குப் பின் நிலையான வசிப்பை ‘குடியேறினார்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘வாடி’ என்ற தொழில்நுட்ப நிலவியல் சொல் முதன்மை உரையில் தவிர்க்கப்பட்டு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
