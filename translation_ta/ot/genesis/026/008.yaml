translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதான ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதோ’ என்பதன் மூலம் எபிரெயக் கதைநடையின் திடீர் காட்சிப்படுத்தல் காக்கப்பட்டுள்ளது. מְצַחֵק என்பதிலுள்ள உண்மையான பொருள் விரிவை முதன்மை உரையில் அளவுக்கு மீறித் தீர்மானிக்காமல், அடிக்குறிப்பில் மாற்று அர்த்தங்கள் வழங்கப்பட்டுள்ளன.
