  text: And it happened[a], when he had been there a long time, that Abimelech king of the Philistines looked out through the window and saw, and behold, Isaac was laughing with Rebekah his wife.
translation:
  language: ta
  text: அவன் அங்கே தங்கியிருந்த காலம் நீண்டபோது, பெலிஸ்தியரின் அரசனான அபிமெலேக்கு சன்னல் வழியாக வெளியே பார்த்தான். இதோ, ஈசாக்கு தன் மனைவி ரெபெக்காளுடன் கொஞ்சி விளையாடிக்கொண்டிருப்பதை[a] அவன் கண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சிரித்து விளையாடிக்கொண்டிருப்பதை,’ ‘விளையாட்டாக நடந்துகொண்டிருப்பதை,’ அல்லது ‘அன்புடன் அணைத்துக் கொஞ்சிக்கொண்டிருப்பதை’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினைச்சொல் ‘ஈசாக்கு’ என்ற பெயருடன் தொடர்புடையது; அது விளையாட்டான அல்லது நெருக்கமான நடத்தையைக் குறிக்கக்கூடும். ரெபெக்காள் ஈசாக்கின் மனைவி என்பதை வெளிப்படுத்திய நடத்தை இங்கு குறிக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי אָרְכוּ לוֹ שָׁם הַיָּמִים
  choice: அவன் அங்கே தங்கியிருந்த காலம் நீண்டபோது
  rationale: எபிரெய மொழியின் காலம் நீடித்தது என்ற இடியத்தை இயல்பான நவீனத் தமிழில் temporal circumstance ஆக வழங்குகிறது; தனியான ‘அப்போது நிகழ்ந்தது’ என்ற சொல்லாக்கம் தமிழில் தேவையற்ற கனத்தை ஏற்படுத்தும்.
- source_word: וַיַּשְׁקֵף
  choice: வெளியே பார்த்தான்
  rationale: ஒரு உயர்ந்த அல்லது உட்புற நோக்கிடத்திலிருந்து வெளியே நோக்கிப் பார்ப்பதைச் சூழலுக்கு ஏற்றவாறு தெரிவிக்கிறது.
- source_word: בְּעַד הַחַלּוֹן
  choice: சன்னல் வழியாக
  rationale: சன்னலின் ஊடாக அல்லது அதற்கு வெளியே பார்த்த செயலை இயல்பான தமிழில் தருகிறது; இங்கு ‘சாளரத் தட்டி’ அல்லது ‘பின்னல்’ என்ற குறிப்பான பொருள் கட்டாயமில்லை.
- source_word: וַיַּרְא וְהִנֵּה
  choice: இதோ, … அவன் கண்டான்
  rationale: הִנֵּה தரும் திடீர் கவனிப்பையும் காட்சியின் உயிரோட்டத்தையும் ‘இதோ’ காக்கிறது; தமிழ் வாக்கிய அமைப்புக்காக ‘கண்டான்’ இறுதியில் வைக்கப்பட்டுள்ளது.
- source_word: מְצַחֵק
  choice: கொஞ்சி விளையாடிக்கொண்டிருப்பதை
  rationale: צחק வேர்ச்சொல் சிரிப்பு, விளையாட்டு, அல்லது நெருக்கமான அன்புச் செயலைக் குறிக்கக்கூடும். இந்தச் சூழலில் ரெபெக்காள் மனைவி என்பதை வெளிப்படுத்தும் அளவிலான அன்பான விளையாட்டை இச்சொற்றொடர் உணர்த்துகிறது; ஆனால் ஒரு குறிப்பிட்ட பாலியல் செயலை உரையில் சேர்ப்பதில்லை.
- source_word: אֵת רִבְקָה אִשְׁתּוֹ
  choice: தன் மனைவி ரெபெக்காளுடன்
  rationale: ரெபெக்காள் ஈசாக்கின் மனைவி என்ற apposition-ஐ தமிழில் இயல்பாகவும் உறவின் குறிப்பு தெளிவாகவும் தருகிறது.
