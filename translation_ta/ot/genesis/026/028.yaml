  text: וַ/יֹּאמְר֗וּ רָא֣וֹ רָאִינוּ֮ כִּֽי הָיָ֣ה יְהוָ֣ה עִמָּ/ךְ֒ וַ/נֹּ֗אמֶר תְּהִ֨י נָ֥א אָלָ֛ה בֵּינוֹתֵ֖י/נוּ בֵּינֵ֣י/נוּ וּ/בֵינֶ֑/ךָ וְ/נִכְרְתָ֥ה בְרִ֖ית עִמָּֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/028.yaml
  text: And they said[a], “We have clearly seen that Yahweh has been with you. So we said, ‘Please let there be an oath between us, between you and us[b], and let us make a covenant with you.’”
translation:
  language: ta
  text: அவர்கள், “யாவே உம்மோடு இருந்தார் என்பதை நாங்கள் தெளிவாகக் கண்டோம். எனவே, ‘எங்களிடையே—எங்களுக்கும் உமக்கும் இடையே[b]—ஒரு ஆணை[a] இருக்கட்டும்; உம்மோடு ஒரு உடன்படிக்கை செய்வோம்’ என்று நாங்கள் சொன்னோம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாப ஆணை.” இங்கு வரும் எபிரெயச் சொல், அதை மீறினால் சாபம் நேரட்டும் என்று வேண்டிக்கொண்டு செய்யப்படும் ஆணையையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “எங்களிடையே, எங்களுக்கும் உமக்கும் இடையே.” இந்த மீளுரை இருதரப்பு உடன்பாட்டை வலியுறுத்துகிறது.
    reason: source_texture
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அவர்கள் … என்றார்கள்
  rationale: வாவ் தொடர்கதை அமைப்பை இயல்பான தமிழ் கதைநடையில் வெளிப்படுத்துகிறது; தேவையற்ற காலவிளக்கத்தைச் சேர்க்கவில்லை.
- source_word: רָאוֹ רָאִינוּ
  choice: நாங்கள் தெளிவாகக் கண்டோம்
  rationale: முற்றுவினைக்கு முன் வரும் வினையெச்சப் பெயரின் வலியுறுத்தலை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: כִּי הָיָה יְהוָה עִמָּךְ
  choice: யாவே உம்மோடு இருந்திருக்கிறார் என்பதை
  rationale: הָיָה குறிக்கும் கடந்தகால நிலையும் அதன் தற்போதைய தொடர்பும் ‘இருந்திருக்கிறார்’ என்பதில் பாதுகாக்கப்படுகின்றன.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַנֹּאמֶר
  choice: ஆகவே நாங்கள் … என்று சொன்னோம்
  rationale: முந்தைய கவனிப்பிலிருந்து வரும் முன்மொழிவின் விளைவுத் தொடர்பை ‘ஆகவே’ இயல்பாகக் காட்டுகிறது; ‘சொன்னோம்’ மூலவினையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: תְּהִי נָא
  choice: இருக்கட்டும்
  rationale: வேண்டுகோள் சார்ந்த jussive பொருளை மரியாதையான தமிழ் ஏவல் வடிவில் தருகிறது; சூழலிலேயே பணிவான முன்மொழிவு தெளிவாக உள்ளது.
- source_word: אָלָה
  choice: சத்திய உறுதிமொழி
  rationale: உடன்படிக்கைச் சூழலில் உள்ள ஆணை அல்லது மீறினால் சாபத்தை வரவழைக்கும் உறுதிப்பாட்டை வாசிக்கத் தெளிவான முறையில் தருகிறது; தீவிரமான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בֵּינוֹתֵינוּ בֵּינֵינוּ וּבֵינֶךָ
  choice: எங்களுக்கிடையே—எங்களுக்கும் உமக்கும் இடையே
  rationale: எபிரெயத்தின் முறையான, சற்றே மீளுரையுடைய அமைப்பை அழிக்காமல் தமிழில் தெளிவாக்குகிறது.
- source_word: וְנִכְרְתָה בְרִית
  choice: ஓர் உடன்படிக்கை செய்துகொள்வோம்
  rationale: ‘உடன்படிக்கையை வெட்டுதல்’ என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עִמָּךְ
  choice: உம்மோடு
  rationale: ஈசாக்கை நோக்கிய ஒருமை முன்னிலையை மரியாதையான தமிழ் வடிவில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயரான ‘கர்த்தர்’ என்பதற்குப் பதில் அந்தப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- issue: אָלָה என்பதிலுள்ள சாபத்துடன் கூடிய ஆணையின் சாத்தியம்
  choice: முதன்மை உரையில் ‘சத்திய உறுதிமொழி’; அடிக்குறிப்பில் ‘சாப ஆணை’
  alternative: முதன்மை உரையிலேயே ‘சாப ஆணை’
  rationale: இந்தச் சூழலில் பொதுவான பொருள் ஓர் ஆணைமொழி; எனினும் அதை மீறுவோர்மேல் சாபத்தை வேண்டிக்கொள்ளும் வலிமையான பொருளை மறைக்காமல் அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ஈசாக்கை நோக்கிய ஒருமை முன்னிலை மரியாதை வடிவமான ‘உம்’ மூலம் வெளிப்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் வலியுறுத்தலும் முறையான உடன்படிக்கை மொழியும் பாதுகாக்கப்பட்டுள்ளன; தமிழில் செயற்கையாகத் தோன்றும் சொற்சொல் மொழிபெயர்ப்பு தவிர்க்கப்பட்டுள்ளது.
