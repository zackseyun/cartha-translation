translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டது. ‘பணியாளர்கள்’ பொதுவாசகருக்கு இயல்பானது; ‘ஓடைப்படுகை’ நிலவியல் பொருளைத் தெளிவாக்குகிறது. ‘உயிருள்ள நீர்’ என்ற மூல உருவகம் விளக்கமாக மாற்றப்படாமல் அடிக்குறிப்புடன் தக்கவைக்கப்பட்டது.
