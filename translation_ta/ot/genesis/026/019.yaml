source:
  edition: WLC
  text: וַ/יַּחְפְּר֥וּ עַבְדֵֽי יִצְחָ֖ק בַּ/נָּ֑חַל וַ/יִּ֨מְצְאוּ שָׁ֔ם בְּאֵ֖ר מַ֥יִם חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/019.yaml
  text: Then Isaac’s servants dug in the wadi and found there a well of living water[a][b].
translation:
  language: ta
  text: பின்பு ஈசாக்கின் பணியாளர்கள் ஓடைப்படுகையில்[a] தோண்டி, அங்கே உயிருள்ள நீரைக் கொண்ட ஒரு கிணற்றைக் கண்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “பள்ளத்தாக்கில்” அல்லது “ஓடைப்பாதையில்”; எபிரெயச் சொல் பருவகாலத்தில் நீர் ஓடும் ஓடையையோ அதன் படுகையையோ அடிக்கடி குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “உயிருள்ள நீர்”; அதாவது, தேங்கி நிற்கும் நீரல்ல, ஊற்றிலிருந்து கிடைக்கும் புதிய அல்லது ஓடும் நீர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: தோண்டி
  rationale: חפר என்பதன் இயல்பான, நேரடியான பொருள் ‘தோண்டு’; தொடர்ச்சியான எபிரெயக் கதைநடையைத் தமிழில் இயல்பாக இணைக்க வினையெச்சம் பயன்படுத்தப்பட்டது.
- source_word: עַבְדֵי יִצְחָק
  choice: ஈசாக்கின் பணியாளர்கள்
  rationale: עבד என்பது அடிமையையோ பணியாளரையோ குறிக்கலாம். இச்சூழலில் அவர்களுடைய சட்டப்பூர்வ நிலை வலியுறுத்தப்படாததால், பொதுவான சேவை உறவைக் காட்டும் ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בַּנָּחַל
  choice: ஓடைப்படுகையில்
  rationale: נחל என்பது பொதுவான பள்ளத்தாக்கை மட்டும் அல்லாமல், பெரும்பாலும் பருவகாலத்தில் நீர் ஓடும் ஓடை அல்லது அதன் படுகையைக் குறிக்கிறது. ‘ஓடைப்படுகை’ இந்த நிலவியல் பொருளை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּמְצְאוּ שָׁם
  choice: அங்கே ... கண்டார்கள்
  rationale: שָׁם தரும் இட வலியுறுத்தலை ‘அங்கே’ தக்கவைக்கிறது; வினை தமிழ்க் கதைநடைக்கு ஏற்றவாறு இறுதியில் வைக்கப்பட்டது.
- source_word: בְּאֵר
  choice: ஒரு கிணறு
  rationale: בְּאֵר என்பதன் நேரடிப் பொருள் ‘கிணறு’. அடுத்த சொற்றொடர் அதிலுள்ள நீரின் தன்மையை விளக்குவதால், ‘கிணறு’ தலைப்பெயராகத் தக்கவைக்கப்பட்டது.
- source_word: מַיִם חַיִּים
  choice: உயிருள்ள நீர்
  rationale: சொல்லுக்குச் சொல் ‘உயிருள்ள நீர்’; தேங்கி நிற்கும் நீருக்கு மாறாகப் புதிய அல்லது ஊற்றிலிருந்து ஓடும் நீரைக் குறிக்கும் எபிரெய மரபுத்தொடர். அடிக்குறிப்பு இயல்புப் பொருளை விளக்க, மூல உருவகமும் பிற வேதாகம எதிரொலிகளும் முதன்மை உரையில் பாதுகாக்கப்பட்டன.
