translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘உயர்வடைந்தான் / உயர்ந்த’ என்ற சொல் மீளுரை, மூலத்தில் גדל மூன்று முறை வருவதன் ஓசையையும் கருத்து முன்னேற்றத்தையும் இயன்றவரை காக்கிறது; ‘உயர்ந்துகொண்டே போய்’ என்பது எபிரெயத் தொடர்ச்சிச் சொற்றொடரின் தமிழுக்கு ஏற்ற இணையாகும்.
