base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/013.yaml
  text: And the man became great[a], and he continued to grow greater until he became very great.
translation:
  language: ta
  text: அந்த மனிதன் உயர்வடைந்தான்; அவன் மிகவும் உயர்ந்தவனாகும்வரை மேன்மேலும் உயர்ந்துகொண்டே போனான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தொடர்ந்து மேலும் மேலும் வளர்ந்துகொண்டே போனான்.” தொடர்ச்சியாக அதிகரித்ததை வலியுறுத்த எபிரெய மொழி இங்கு பல வினை வடிவங்களை ஒன்றன் பின் ஒன்றாக அடுக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: உயர்வடைந்தான்
  rationale: גדל என்பது வளர்வதையும் பெருமை, செல்வாக்கு அல்லது நிலையிலும் உயர்வதையும் குறிக்கலாம். இச்சூழலில் பொருளாதார வளம் உட்பட்டிருந்தாலும், ‘செல்வந்தனானான்’ என்று பொருளைச் சுருக்காமல் மூலத்தின் பரந்த கருத்தை ‘உயர்வடைந்தான்’ காக்கிறது.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: איש இங்கு முன்பு குறிப்பிடப்பட்ட ஈசாக்கைக் குறிக்கும் ஆண்பால் ஒருமைச் சொல். பெயரை நேரடியாகச் சேர்க்காமல், மூலத்தின் குறிப்புமுறையைப் பாதுகாக்கிறது.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדֵל
  choice: மேன்மேலும் உயர்ந்துகொண்டே போய்
  rationale: வினைமுற்று, வினையெச்சப் பொருளுள்ள infinitive absolute, மற்றும் தொடர்ச்சிச் செயலைக் காட்டும் வடிவம் ஆகியவற்றின் அடுக்கு இடைவிடாத முன்னேற்றத்தைச் சுட்டுகிறது. தமிழின் ‘கொண்டே போய்’ அமைப்பு அந்தத் தொடர்ச்சியையும் எபிரெயச் சொல்லோட்டத்தின் இயக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַד כִּי
  choice: … அடைந்தான்
  rationale: இந்தத் தொடர் வளர்ச்சியின் உச்சநிலையை அறிமுகப்படுத்துகிறது. தமிழில் இறுதி விளைவை ‘மிகவும் உயர்ந்த நிலையை அடைந்தான்’ என்று கூறுவது இயல்பாக உள்ளது.
- source_word: גָדַל מְאֹד
  choice: மிகவும் உயர்ந்த நிலையை அடைந்தான்
  rationale: מאד தீவிரத்தைச் சேர்க்கிறது; גדל என்ற சொல்லின் மீளுரையை ‘உயர்ந்த’ என்பதன் மூலம் தொடர்ந்து பிரதிபலிக்கிறது. செல்வத்தை மட்டும் குறிக்கும் விளக்கத்தைத் தவிர்த்து, நிலை மற்றும் செல்வாக்கு உள்ளிட்ட பரந்த பொருளைத் தக்கவைக்கிறது.
