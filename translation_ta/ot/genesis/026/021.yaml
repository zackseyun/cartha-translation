translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய மதிப்புமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயப் பெயரிடும் மரபுத்தொடர் தமிழில் இயல்பாக ‘பெயரிட்டான்’ என வழங்கப்பட்டுள்ளது; பெயரின் சொல்விளையாட்டு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
