  text: וַֽ/יַּחְפְּרוּ֙ בְּאֵ֣ר אַחֶ֔רֶת וַ/יָּרִ֖יבוּ גַּם עָלֶ֑י/הָ וַ/יִּקְרָ֥א שְׁמָ֖/הּ שִׂטְנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/021.yaml
  text: Then they dug another well[a], and they also quarreled over it, so he called its name Sitnah.
translation:
  language: ta
  text: பின்பு அவர்கள் வேறொரு கிணற்றைத் தோண்டினார்கள். அதைக் குறித்தும் அவர்கள் சண்டையிட்டார்கள். ஆகவே அவன் அதற்குச் சித்னா[a] என்று பெயரிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சித்னா” என்ற பெயர் பகைமை அல்லது எதிர்ப்பைக் குறிக்கும் ஓர் எபிரெயச் சொல்லுடன் தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: அவர்கள் தோண்டினார்கள்
  rationale: חפר என்பதன் கால் வினைவடிவம் தோண்டுவதைக் குறிக்கிறது. தொடர்ச்சியான எபிரெயக் கதைநடையை இயல்பான நவீனத் தமிழில் கடந்தகால வினையாக அளிக்கிறது.
- source_word: בְּאֵר אַחֶרֶת
  choice: வேறொரு கிணறு
  rationale: בְּאֵר என்பது ‘கிணறு’; אַחֶרֶת என்பது முன்பு கூறப்பட்ட கிணற்றிலிருந்து வேறான இன்னொரு கிணற்றைக் குறிக்கிறது.
- source_word: וַיָּרִיבוּ גַּם עָלֶיהָ
  choice: அதைக் குறித்தும் அவர்கள் சண்டையிட்டார்கள்
  rationale: ריב இங்கு உரிமை தொடர்பான மோதல் அல்லது சண்டையைக் குறிக்கிறது. גַּם என்பதைக் ‘-உம்’ வெளிப்படுத்துகிறது; עָלֶיהָ என்பது இந்தக் கிணற்றைக் குறித்த மோதலைச் சுட்டுகிறது.
- source_word: וַיִּקְרָא שְׁמָהּ
  choice: அதற்கு … என்று பெயரிட்டான்
  rationale: எபிரெய மொழியில் சொற்பொருளாக ‘அதன் பெயரை அழைத்தான்’ என்ற பெயரிடும் மரபுத்தொடர் வருகிறது. ‘பெயரிட்டான்’ என்பது அதே பொருளை இயல்பான தமிழில் தெளிவாக வழங்குகிறது.
- source_word: שִׂטְנָה
  choice: சித்னா
  rationale: இது கிணற்றுக்கு வழங்கப்பட்ட பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது. அதன் பகைமை அல்லது எதிர்ப்பு சார்ந்த சொற்பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
