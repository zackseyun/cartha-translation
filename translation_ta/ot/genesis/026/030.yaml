  yaml_path: translation/ot/genesis/026/030.yaml
  text: And he prepared a feast for them[a], and they ate and drank.
translation:
  language: ta
  text: அவன் அவர்களுக்கு ஒரு விருந்து ஏற்பாடு செய்தான்[a]; அவர்கள் உண்டு குடித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விருந்துபசாரம்’; எபிரெயச் சொல் பானம் அருந்துதல் குறிப்பிடத்தக்க கூறாக இருந்த விருந்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ஏற்பாடு செய்தான்
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்தான்’ என்றாலும், מִשְׁתֶּה என்பதுடன் வரும்போது விருந்தை ஆயத்தப்படுத்தி வழங்கியதைக் குறிக்க இயல்பான தமிழில் ‘ஏற்பாடு செய்தான்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: לָהֶם
  choice: அவர்களுக்கு
  rationale: ל இங்கு செயலின் பயனாளிகளைக் குறிக்கிறது; அதனால் இயல்பான தமிழ் வடிவமான ‘அவர்களுக்கு’ பயன்படுத்தப்பட்டது.
- source_word: מִשְׁתֶּה
  choice: விருந்து
  rationale: இந்தச் சொல் உணவும், குறிப்பிடத்தக்க வகையில் பானமும் இடம்பெறும் விருந்தைக் குறிக்கலாம். தொடர்ந்து ‘உண்டு குடித்தார்கள்’ என்று வருவதால், ‘விருந்து’ என்பது தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: וַיֹּאכְלוּ
  choice: அவர்கள் உண்டு
  rationale: אכל வினையின் நேரடியான பொருளைத் தக்கவைக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: וַיִּשְׁתּוּ
  choice: குடித்தார்கள்
  rationale: שתה வினையின் நேரடியான பொருள்; முந்தைய வினையுடன் இணைத்து ‘உண்டு குடித்தார்கள்’ என இயல்பாக வழங்கப்பட்டது.
