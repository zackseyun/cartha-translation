  text: He had flocks[a], herds, and a large household[b], and the Philistines envied him.
translation:
  language: ta
  text: அவனுக்கு ஆட்டு மந்தைகளும் மாட்டு மந்தைகளும் ஏராளமான பணியாளர்களும்[a] இருந்தன; பெலிஸ்தியர்கள் அவன்மேல் பொறாமை கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “மிகுந்த சேவை அல்லது உழைப்பு”; இது ஏராளமான பணியாளர்களைக் குறிக்கக்கூடும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: அவனுக்கு … இருந்தார்கள்
  rationale: היה + ל possession construction is expressed naturally in Tamil with the dative possessor and ‘இரு’; the plural human predicate agrees idiomatically with the final coordinated subject.
- source_word: מִקְנֵה צֹאן
  choice: ஆட்டு மந்தைகள்
  rationale: צֹאן denotes small livestock, especially sheep and goats; ‘ஆட்டு மந்தைகள்’ is concise, natural Tamil and retains the collective sense.
- source_word: וּמִקְנֵה בָקָר
  choice: மாட்டு மந்தைகள்
  rationale: בָקָר refers to cattle, while מִקְנֵה presents them collectively as livestock holdings; ‘மாட்டு மந்தைகள்’ conveys both ideas naturally.
- source_word: וַעֲבֻדָּה רַבָּה
  choice: ஏராளமான பணியாளர்கள்
  rationale: In this inventory of Isaac’s wealth, the phrase most likely points to a substantial workforce. The main rendering is concrete and readily understood, while the footnote preserves the Hebrew phrase’s possible abstract sense of abundant labor or service.
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: அவன்மேல் பொறாமை கொண்டார்கள்
  rationale: קנא here describes the Philistines’ envy in response to Isaac’s prosperity. This is the natural modern Tamil expression without adding a motive beyond the context.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: This is the established modern Tamil designation for the Philistine people.
