source:
  edition: WLC
  text: וְ/כָל הַ/בְּאֵרֹ֗ת אֲשֶׁ֤ר חָֽפְרוּ֙ עַבְדֵ֣י אָבִ֔י/ו בִּ/ימֵ֖י אַבְרָהָ֣ם אָבִ֑י/ו סִתְּמ֣וּ/ם פְּלִשְׁתִּ֔ים וַ/יְמַלְא֖וּ/ם עָפָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/015.yaml
  text: All the wells that his father's servants had dug in the days of Abraham his father[c][b][a], the Philistines stopped up and filled them with earth.
translation:
  language: ta
  text: அவனுடைய தந்தையான ஆபிரகாமின் காலத்தில், அவனுடைய தந்தையின் பணியாளர்கள்[a] தோண்டியிருந்த கிணறுகள் அனைத்தையும் பெலிஸ்தியர்கள் அடைத்து, அவற்றை மண்ணால்[b] நிரப்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அடிமைகள்.’ எபிரெயச் சொல் பணியாளர்களையோ அடிமைகளையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘புழுதியால்.’ எபிரெயச் சொல் சூழலுக்கேற்ப மண், புழுதி, அல்லது தூசியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַבְּאֵרֹת
  choice: கிணறுகள் அனைத்தையும்
  rationale: כָל என்பதன் முழுமையைக் ‘அனைத்தையும்’ தக்கவைக்கிறது; בְּאֵרֹת இயல்பாக ‘கிணறுகள்’ என மொழிபெயர்க்கப்படுகிறது. தொடக்க וְ என்பது தொடரும் கதை இணைப்பாக இருப்பதால், தமிழில் தனியாக ‘மேலும்’ சேர்க்காமல் வாக்கிய ஓட்டத்தில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר חָפְרוּ
  choice: தோண்டியிருந்த
  rationale: கிணறுகளைத் தோண்டியது பெலிஸ்தியர்கள் அவற்றை அடைப்பதற்கு முன்பு நிகழ்ந்ததைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: עַבְדֵי אָבִיו
  choice: அவனுடைய தகப்பனின் பணியாளர்கள்
  rationale: עֶבֶד என்பது பணியாளர் அல்லது அடிமை எனப் பொருள்படலாம். இச்சூழல் கட்டுப்பட்ட அடிமை நிலையைக் குறிப்பாக வலியுறுத்தாததால், ‘பணியாளர்கள்’ முதன்மை உரையில் பயன்படுத்தப்பட்டுள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בִּימֵי אַבְרָהָם אָבִיו
  choice: அவனுடைய தகப்பனாகிய ஆபிரகாமின் காலத்தில்
  rationale: ‘ஆபிரகாம் அவனுடைய தகப்பன்’ என்ற மூலத்தின் உறவுக் குறிப்பையும் காலச்சூழலையும் இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: סִתְּמוּם
  choice: அடைத்து
  rationale: கிணறுகளைத் தடுத்து மூடும் செயலைத் தெளிவாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இம்மக்கள் குழுவுக்கான வழக்கமான தமிழ் வேதாகமப் பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיְמַלְאוּם עָפָר
  choice: மண்ணால் நிரப்பினார்கள்
  rationale: வினையிலுள்ள பன்மைச் சுட்டுப்பொருள் கிணறுகளையே குறிக்கிறது. עָפָר இச்சூழலில் மண் அல்லது புழுதி எனப் பொருள்படக்கூடும்; கிணறுகளை நிரப்பும் பொருளாக ‘மண்’ இயல்பான தேர்வு.
