translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் வரும் தகப்பன் குறிப்பு மீளவும் இடம்பெறுவது தவிர்க்கப்படாமல் தக்கவைக்கப்பட்டுள்ளது.
