lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: தங்கியிருந்தார்
  rationale: ישׁב என்பதன் தொடர் இறந்தகாலக் கதைவடிவம். முந்தைய வசனத்தில் கடவுள் கூறிய அறிவுறுத்தலுக்கிணங்க ஈசாக்கு அங்கேயே வசித்தார் அல்லது தங்கினார் என்பதே இச்சூழலின் பொருள். ‘தங்கியிருந்தார்’ என்பது இயல்பான நவீனத் தமிழில் இதை வெளிப்படுத்துகிறது; நிரந்தரமாகக் குடியேறினார் என்ற தேவையற்ற பொருளைத் தவிர்க்கிறது.
- source_word: יִצְחָק
  choice: ஈசாக்கு
  rationale: எபிரெயத் தனிப்பெயருக்கான தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு.
- source_word: בִּגְרָר
  choice: கேராரில்
  rationale: בְּ என்னும் முன்னொட்டு இடத்தைக் குறிக்கிறது; ஆகவே இடப்பெயருடன் ‘-இல்’ வேற்றுமை உருபு இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַ
  choice: எனவே
  rationale: முன்னொட்டான waw கதையை முன்னெடுத்துச் செல்கிறது; முந்தைய வசனத்தில் வழங்கப்பட்ட கட்டளைக்கு ஈசாக்கு அளித்த உடனடியான பதிலை இங்கு ‘எனவே’ தெளிவாகக் காட்டுகிறது.
