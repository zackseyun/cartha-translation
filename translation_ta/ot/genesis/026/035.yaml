lexical_decisions:
- source_word: וַתִּהְיֶיןָ
  choice: அவர்கள் ... இருந்தார்கள்
  rationale: היה என்பதன் பெண்பால் பன்மை வடிவம் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட ஏசாவின் மனைவிகளைக் குறிக்கிறது. தொடர்ந்திருந்த நிலையைக் குறிக்க இயல்பான தமிழில் ‘இருந்தார்கள்’ என்று மொழிபெயர்க்கப்பட்டது; ‘ஆனார்கள்’ என்பதும் சாத்தியம்.
- source_word: מֹרַת רוּחַ
  choice: மனக்கசப்பாக
  rationale: ‘ஆவியின் கசப்பு’ என்ற எபிரெய மொழிவழக்கு ஆழ்ந்த மனவருத்தத்தையும் வேதனையையும் குறிக்கிறது. தமிழில் அதன் ‘கசப்பு’ உருவகத்தையும் உள்ளார்ந்த பாதிப்பு என்ற பொருளையும் இயல்பாகத் தக்கவைக்க ‘மனக்கசப்பு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְיִצְחָק וּלְרִבְקָה
  choice: ஈசாக்குக்கும் ரெபெக்காளுக்கும்
  rationale: இருவரும் பாதிக்கப்பட்டவர்கள் என்பதை לְ என்ற முன்னொட்டு இருமுறையும் காட்டுகிறது. தமிழின் இணைப்பும்மை அமைப்பு அந்த இணையான உறவை இயல்பாகவும் துல்லியமாகவும் வெளிப்படுத்துகிறது.
