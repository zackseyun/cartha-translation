lexical_decisions:
- source_word: וַיַּעַל
  choice: ஏறிச் சென்றான்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே போதல்/ஏறிச் செல்லுதல்.’ பயணச் சூழலில் உயரமான இடத்தை நோக்கிய நகர்வையோ பொதுவான பயணத்தையோ குறிக்கலாம்; ‘ஏறிச் சென்றான்’ திசைநுட்பத்தைத் தக்கவைக்கிறது.
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: முந்தைய இடத்திலிருந்து புறப்பட்டதை இயல்பான நவீனத் தமிழில் நேரடியாகக் குறிக்கிறது.
- source_word: בְּאֵר שָׁבַע
  choice: பெயெர்செபா
  rationale: இது இடப்பெயர் என்பதால் பொருள் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
