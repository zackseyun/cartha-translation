  yaml_path: translation/ot/genesis/026/027.yaml
  text: Isaac said to them[a], “Why have you come to me, since you hated me and sent me away from among you?”
translation:
  language: ta
  text: ஈசாக்கு அவர்களிடம், “நீங்கள் ஏன் என்னிடம் வந்தீர்கள்? நீங்கள் என்னை வெறுத்து, என்னை உங்களிடமிருந்து அனுப்பிவிட்டீர்களே!” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יִצְחָק
  choice: ஈசாக்கு அவர்களிடம் … என்றான்
  rationale: எபிரெயக் கதைநடையின் வழக்கமான பேச்சு அறிமுகத்தை இயல்பான நவீனத் தமிழில் தருகிறது; கேள்வி தொடர்ந்தாலும் אמר என்பதன் அடிப்படைப் பொருளான ‘சொன்னான்’ என்பதே பாதுகாக்கப்படுகிறது.
- source_word: מַדּוּעַ בָּאתֶם אֵלָי
  choice: நீங்கள் ஏன் என்னிடம் வந்தீர்கள்?
  rationale: מַדּוּעַ என்பதன் காரணவினாவையும், அவர்கள் வந்து சேர்ந்த நிகழ்வைக் குறிக்கும் எபிரெய நிறைவுவினையையும் தெளிவான இயல்பான தமிழில் தருகிறது.
- source_word: וְאַתֶּם
  choice: நீங்களோ
  rationale: וְ என்ற இணைப்பின் இச்சூழலிலுள்ள முரண்பாட்டு அல்லது சூழ்நிலைத் தொடர்பை ‘-ஓ’ இயல்பாக வெளிப்படுத்துகிறது; அதன் நேரடியான ‘நீங்கள் மேலும்/நீங்கள்’ என்ற வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שְׂנֵאתֶם אֹתִי
  choice: என்னை வெறுத்து
  rationale: שנא என்பதன் வலுவான ‘வெறுத்தல்’ பொருளை ‘பகைமையாக நடந்துகொண்டீர்கள்’ என்று மென்மையாக்காமல் காக்கிறது.
- source_word: וַתְּשַׁלְּחוּנִי
  choice: என்னை அனுப்பிவிட்டீர்களே
  rationale: שלח என்பதன் ‘அனுப்பிவிடுதல்’ பொருளைத் தருகிறது. ‘துரத்திவிட்டீர்கள்’ என்பது மூல வினை கட்டாயப்படுத்தாத கூடுதல் வன்மையைச் சேர்க்கும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: מֵאִתְּכֶם
  choice: உங்களிடமிருந்து
  rationale: அவர்களுடைய உடனிருப்பு அல்லது சமூகத்திலிருந்து பிரித்து அனுப்பியதைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
