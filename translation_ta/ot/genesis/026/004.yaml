base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/004.yaml
  text: And I will multiply your offspring like the stars of the heavens[a], and I will give to your offspring all these lands, and in your offspring all the nations of the earth will be blessed.
translation:
  language: ta
  text: உன் சந்ததியை வானத்தின் நட்சத்திரங்களைப்போல் பெருகச் செய்வேன்; இந்த நிலங்கள் அனைத்தையும் உன் சந்ததிக்குக் கொடுப்பேன். உன் சந்ததியில் பூமியின் எல்லா தேசங்களும் ஆசீர்வதிக்கப்படும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் சந்ததியினால் பூமியின் எல்லா தேசங்களும் தங்களை ஆசீர்வதித்துக்கொள்ளும்.” எபிரெய வினைச்சொல்லைத் தற்சுட்டுப் பொருளில் புரிந்துகொள்ளலாம்; எனினும், உடன்படிக்கை வாக்குறுதியின் சூழலுக்கு “ஆசீர்வதிக்கப்படும்” என்ற செயப்பாட்டுப் பொருள் நன்கு பொருந்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: பெருகச் செய்வேன்
  rationale: ரבה என்பதன் ஹிஃபில் வடிவம் எண்ணிக்கையை அதிகரிக்கச் செய்யும் இறைச் செயலைக் குறிக்கிறது. ‘பெருகச் செய்வேன்’ என்பது காரணவினைப் பொருளையும் வாக்குறுதியின் நேரடித்தன்மையையும் காக்கிறது.
- source_word: זַרְעֲךָ
  choice: உன் சந்ததி
  rationale: זֶרַע என்பது ஒருமை வடிவிலுள்ள கூட்டுப்பொருள் சொல்; ‘சந்ததி’ என்பது விதை என்ற நேர்ப்பொருளில் சுருக்கிவிடாமலும் பன்மையாக மட்டும் வரையறுக்காமலும் அந்தக் கூட்டுப்பொருளைக் காக்கிறது.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: வானத்தின் நட்சத்திரங்களைப்போல்
  rationale: כְּ குறிக்கும் வெளிப்படையான உவமையை ‘போல்’ காக்கிறது; ‘வானத்தின் நட்சத்திரங்கள்’ உயர்ந்த வாக்குறுதி நடைக்கும் இயல்பான நவீன தமிழுக்கும் ஏற்றது.
- source_word: וְנָתַתִּי
  choice: கொடுப்பேன்
  rationale: נתן என்பதன் எளிய, நேரடியான ‘கொடு’ என்ற பொருளைத் தக்கவைக்கிறது.
- source_word: לְזַרְעֲךָ
  choice: உன் சந்ததிக்கு
  rationale: வசனத்தில் மீண்டும் வரும் זֶרַע என்பதைக் கருத்து மாறாமல் ஒரே சொல்லால் மொழிபெயர்க்கிறது.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: இந்த நிலங்கள் அனைத்தையும்
  rationale: אֲרָצוֹת இங்கு வாக்குறுதி அளிக்கப்படும் பிரதேசங்களைக் குறிக்கிறது; ‘நிலங்கள்’ என்பது ‘நாடுகள்’ என்று அரசியல் பொருள் ஏற்றாமல் நிலவியல் கருத்தைக் காக்கிறது. הָאֵל என்பதன் சுட்டுப்பொருளை ‘இந்த’ வெளிப்படுத்துகிறது.
- source_word: וְהִתְבָּרֲכוּ
  choice: ஆசீர்வதிக்கப்படும்
  rationale: மூதாதையர் உடன்படிக்கை வாக்குறுதியின் சூழலில் செயல்பாட்டைப் பெறும் பொருளை இயல்பாக வெளிப்படுத்துகிறது; எபிரெய வடிவின் தற்சுட்டுப் பொருள் சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בְזַרְעֲךָ
  choice: உன் சந்ததியில்
  rationale: בְּ என்பதன் அடிப்படை ‘இல்’ பொருளைத் தக்கவைத்து, ‘மூலம்’ என்று கருவிப்பொருளை மட்டும் தீர்மானமாக்காமல் மூலத்தின் இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: பூமியின் எல்லா தேசங்களும்
  rationale: גּוֹיִם என்பதன் இன-மக்கள் மற்றும் அரசியல் கூட்டுப் பொருளுக்கு ‘தேசங்கள்’ பொருத்தமானது; ‘பூமியின் எல்லா’ என்பது முழுமையைக் காக்கிறது.
theological_decisions:
- issue: וְהִתְבָּרֲכוּ בְזַרְעֲךָ என்ற ஆசீர்வாதச் சூத்திரத்தின் பொருள்
  choice: உன் சந்ததியில் பூமியின் எல்லா தேசங்களும் ஆசீர்வதிக்கப்படும்
  alternative: உன் சந்ததியை முன்னிட்டு பூமியின் எல்லா தேசங்களும் தங்களை ஆசீர்வதித்துக்கொள்ளும்
  rationale: உடன்படிக்கை வாக்குறுதியின் சூழல் செயப்பாட்டு வாசிப்பை ஆதரிக்கிறது. எனினும், எபிரெய வினைவடிவைத் தற்சுட்டாகவும் புரிந்துகொள்ள முடிவதால் அந்தச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; ‘சந்ததியில்’ என்பது ஆசீர்வாதம் எவ்வாறு இடைநிலைப்படுகிறது என்பதை மொழிபெயர்ப்பிலேயே தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified உடன்படிக்கை நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சந்ததி’ மூன்று இடங்களிலும் ஒரேபடியாகப் பயன்படுத்தப்பட்டு அதன் கூட்டுப்பொருள் காக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ஆசீர்வாதச் சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
