translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மொழியின் பொதுப்படையான வினையெச்சம் தமிழில் இயல்பான நிபந்தனை வாக்கியமாகத் தரப்பட்டுள்ளது; மரணதண்டனையைக் குறிக்கும் செயப்பாட்டு வலிமை காக்கப்பட்டுள்ளது.
