source:
  edition: WLC
  text: וַ/יְצַ֣ו אֲבִימֶ֔לֶךְ אֶת כָּל הָ/עָ֖ם לֵ/אמֹ֑ר הַ/נֹּגֵ֜עַ בָּ/אִ֥ישׁ הַ/זֶּ֛ה וּ/בְ/אִשְׁתּ֖/וֹ מ֥וֹת יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/011.yaml
  text: Then Abimelech commanded all the people[a], saying, “Whoever touches this man or his wife shall surely be put to death.”
translation:
  language: ta
  text: அப்போது அபிமெலேக்கு மக்கள் அனைவருக்கும் கட்டளையிட்டு, “இந்த மனிதனையோ அவன் மனைவியையோ யாராவது தொட்டால்[a], அந்த நபர் நிச்சயமாகக் கொல்லப்படுவான்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: “இந்த மனிதனையோ அவன் மனைவியையோ தொடுகிறவன்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டு
  rationale: צוה என்பதன் பியேல் வடிவம் அதிகாரபூர்வமான கட்டளையை வழங்குவதைக் குறிக்கிறது; ‘கட்டளையிட்டு’ அதன் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: כָּל הָעָם
  choice: மக்கள் அனைவருக்கும்
  rationale: இங்கு עם என்பது அபிமெலேக்கின் ஆட்சிக்குட்பட்ட மக்களைப் பொதுவாகக் குறிக்கிறது; ஒரு குறிப்பிட்ட இனத்தையோ நாட்டையோ அவசியமாகக் குறிக்கவில்லை.
- source_word: לֵאמֹר
  choice: … என்றான்
  rationale: மேற்கோளை அறிமுகப்படுத்தும் எபிரெயச் சொல்லமைப்பு தமிழில் இயல்பாக இருக்கும்படி நேரடி உரையின் முடிவில் ‘என்றான்’ எனத் தரப்பட்டுள்ளது.
- source_word: הַנֹּגֵעַ
  choice: யாராவது தொட்டால்
  rationale: உறுப்புடன் வரும் நிகழ்கால வினையெச்சம் பொதுப்படையான ‘தொடுகிறவன்/யார் தொட்டாலும்’ என்ற பொருளை அளிக்கிறது. நிபந்தனை வடிவம் நவீன தமிழில் இயல்பானது; ‘தொடு’ என்பது நגע என்பதன் நேரடியான பொருளைத் தக்கவைக்கிறது.
- source_word: בָּאִישׁ הַזֶּה וּבְאִשְׁתּוֹ
  choice: இந்த மனிதனையோ அவன் மனைவியையோ
  rationale: נגע உடன் வரும் ב தொடப்படுகிற நபர்களைக் குறிக்கிறது. இரண்டு பாதுகாக்கப்பட்ட நபர்களையும் இணைக்கும் அமைப்பு தமிழில் ‘…யையோ …யையோ’ என்று தெளிவாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: מוֹת יוּמָת
  choice: நிச்சயமாகக் கொல்லப்படுவான்
  rationale: வினைமுற்றுடன் வரும் வினையெச்ச மூலவடிவம் தண்டனையின் உறுதியை வலியுறுத்துகிறது; יוּמָת செயப்பாட்டு வடிவில் இருப்பதால் வெறுமனே ‘சாவான்’ என்பதற்குப் பதிலாக ‘கொல்லப்படுவான்’ என்பது நீதித்தீர்ப்பின்படியான மரணதண்டனையைத் துல்லியமாகக் காட்டுகிறது.
