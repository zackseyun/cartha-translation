base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/018.yaml
  text: Then Isaac dug again the wells of water that had been dug in the days of Abraham his father[a], which the Philistines had stopped up after Abraham's death, and he called them by the names that his father had given them.
translation:
  language: ta
  text: பின்பு ஈசாக்கு, தன் தந்தை ஆபிரகாமின் காலத்தில் தோண்டப்பட்டிருந்த நீர்க்கிணறுகளை மீண்டும் தோண்டினான்[a]. ஆபிரகாம் இறந்தபின் பெலிஸ்தியர்கள் அவற்றை அடைத்துப்போட்டிருந்தார்கள். தன் தந்தை அவற்றுக்கு வைத்திருந்த பெயர்களையே அவனும் அவற்றுக்கு வைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல் மொழிபெயர்த்தால், “ஈசாக்கு திரும்பி தோண்டினான்.” இங்குள்ள எபிரெய வினை ‘திரும்புதல்’ என்று பொருள்படலாம்; ஆனால் இந்த வாக்கிய அமைப்பில், முன்பு செய்யப்பட்ட செயலை மீண்டும் மேற்கொள்வதையே பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב ... וַיַּחְפֹּר
  choice: மீண்டும் தோண்டினான்
  rationale: שוב என்பதன் அடிப்படைப் பொருள் ‘திரும்புதல்’ என்றாலும், மற்றொரு வினைக்கு முன் வரும் இக்கட்டமைப்பு செயலை மறுபடியும் மேற்கொள்வதைக் குறிக்கிறது. ஏற்கெனவே இருந்த கிணறுகளைப் புதிதாகத் தோண்டிச் சீராக்கிய சூழலில் ‘மீண்டும் தோண்டினான்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בְּאֵרֹת הַמַּיִם
  choice: நீர்க்கிணறுகள்
  rationale: இது தண்ணீர் தரும் கிணறுகள் என்பதைத் தெளிவாகக் காட்டுவதோடு, எபிரெயச் சொல்லிணையின் வலியுறுத்தலையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו
  choice: தன் தந்தை ஆபிரகாமின் காலத்தில் தோண்டப்பட்டிருந்த
  rationale: எபிரெயத்தில் தோண்டியவர்கள் குறிப்பிடப்படாமல் பன்மை வினை வந்துள்ளதால், தமிழில் செயப்பாட்டு வடிவம் இயல்பானது; ‘காலத்தில்’ என்பது בימי என்ற காலக் குறிப்பைச் சரியாகத் தருகிறது.
- source_word: וַיְסַתְּמוּם
  choice: அவற்றை அடைத்துப்போட்டிருந்தார்கள்
  rationale: סתם என்பது கிணற்றை அடைத்தல் அல்லது மூடுதல். எந்தப் பொருளால் அடைத்தார்கள் என்று மூலத்தில் இல்லாத விவரத்தைச் சேர்க்காமல், தமிழில் வழக்கமான சொல்லாக்கம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இந்த மக்கள் இனத்திற்கான பரவலாக அறியப்பட்ட தமிழ்ப் பெயர்.
- source_word: אַחֲרֵי מוֹת אַבְרָהָם
  choice: ஆபிரகாம் இறந்தபின்
  rationale: காலத் தொடர்பைத் தெளிவாகவும் சுருக்கமாகவும் தரும் இயல்பான நவீனத் தமிழ்.
- source_word: וַיִּקְרָא לָהֶן שֵׁמוֹת כַּשֵּׁמוֹת אֲשֶׁר קָרָא לָהֶן אָבִיו
  choice: தன் தந்தை அவற்றுக்கு வைத்திருந்த பெயர்களையே அவனும் அவற்றுக்கு வைத்தான்
  rationale: קרא ... שׁמות என்பது பெயரிடுதலைக் குறிக்கிறது; כַּשֵּׁמוֹת இங்கு முந்தைய பெயர்களோடு பொருந்திய அதே பெயர்களைக் குறிக்கிறது. ‘பெயர்களையே’ என்பது அந்த ஒற்றுமையைத் தெளிவாக வெளிப்படுத்துகிறது.
