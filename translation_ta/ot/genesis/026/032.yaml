base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/032.yaml
  text: And it happened on that day that Isaac’s servants came and told him about the well that they had dug[a], and they said to him[b], “We have found water.”
translation:
  language: ta
  text: அதே நாளில்[a] ஈசாக்கின் வேலைக்காரர்கள்[b] வந்து, தாங்கள் தோண்டிய கிணற்றைப் பற்றி அவரிடம் தெரிவித்தார்கள். அவர்கள் அவரிடம், “தண்ணீர் கிடைத்துவிட்டது” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அந்த நாளில்” என்றும் மொழிபெயர்க்கலாம். இங்கு முந்தைய உடன்படிக்கை நிகழ்ச்சிகள் நடந்த அதே நாளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “வேலைக்காரர்கள்” என்பதற்கான எபிரெயச் சொல் “அடிமைகள்” என்றும் பொருள்படலாம்; இச்சூழலில் அவர்களுடைய சமூக நிலையைவிட அவர்கள் செய்த பணியே முன்னிலைப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַהוּא
  choice: அதே நாளில்
  rationale: எபிரெயக் கதைத் தொடரில் நிகழ்வு முந்தைய நிகழ்ச்சிகள் நடந்த குறிப்பிட்ட நாளிலேயே நிகழ்ந்ததைக் காட்டுகிறது. தமிழில் தனியே ‘நிகழ்ந்தது’ எனச் சேர்ப்பதைவிட ‘அதே நாளில்’ என்பது இயல்பாகவும் தொடர்ச்சியைத் தெளிவாகவும் தருகிறது.
- source_word: עַבְדֵי יִצְחָק
  choice: ஈசாக்கின் வேலைக்காரர்கள்
  rationale: עבד என்பது வேலைக்காரர் அல்லது அடிமை எனப் பொருள்படலாம். இச்சூழலில் கிணறு தோண்டும் வீட்டுப் பணியாளர்கள் முன்னிலைப்படுவதால் ‘வேலைக்காரர்கள்’ இயல்பான தேர்வு; சமூக நிலை குறித்த மூலத்தின் சாத்தியமான நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיַּגִּדוּ לוֹ
  choice: அவரிடம் தெரிவித்தார்கள்
  rationale: Hiphil வடிவிலுள்ள נגד இங்கு செய்தியை அறிவித்தல் அல்லது அறிக்கை செய்தல் என்று பொருள். ‘தெரிவித்தார்கள்’ என்பது நவீனத் தமிழில் தெளிவானதும் கண்ணியமானதும் ஆகும்.
- source_word: עַל אֹדוֹת הַבְּאֵר אֲשֶׁר חָפָרוּ
  choice: தாங்கள் தோண்டிய கிணற்றைப் பற்றி
  rationale: עַל אֹדוֹת என்பதற்கு ‘பற்றி’ என்பது நேரான இயல்பான இணை. חָפָרוּ-வின் கருப்பொருள் வேலைக்காரர்களே என்பதைத் தமிழின் ‘தாங்கள்’ தெளிவாகக் காட்டுகிறது.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: அவர்கள் அவரிடம் … என்றார்கள்
  rationale: மூலத்தில் உள்ள தனியான நேரடி உரை அறிமுகத்தைப் பாதுகாக்கிறது; முந்தைய ‘தெரிவித்தார்கள்’ என்பதோடு ஒன்றிணைத்து விடவில்லை.
- source_word: מָצָאנוּ מָיִם
  choice: தண்ணீர் கிடைத்துவிட்டது
  rationale: சொல்லுக்குச் சொல் ‘நாங்கள் தண்ணீரைக் கண்டோம்’ எனலாம்; ஆனால் கிணறு தோண்டும் சூழலில் வெற்றிகரமாக நீர் கிடைத்ததை நவீனத் தமிழில் ‘தண்ணீர் கிடைத்துவிட்டது’ இயல்பாகவும் விளைவு இன்னும் பொருந்துவதை உணர்த்துமாறும் சொல்கிறது.
