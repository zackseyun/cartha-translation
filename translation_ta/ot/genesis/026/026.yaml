  text: וַ/אֲבִימֶ֕לֶךְ הָלַ֥ךְ אֵלָ֖י/ו מִ/גְּרָ֑ר וַ/אֲחֻזַּת֙ מֵֽרֵעֵ֔/הוּ וּ/פִיכֹ֖ל שַׂר צְבָאֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/026.yaml
  text: Then Abimelech went to him from Gerar[a], with Ahuzzath his friend and Phicol the commander of his army.
translation:
  language: ta
  text: அப்போது அபிமெலேக்கு, தன் நண்பனான[a] அகுசாத்துடனும் தன் படைத்தளபதியான பிக்கோலுடனும் கேராரிலிருந்து அவனிடம் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “துணைவர்” அல்லது “ஆலோசகர்.” எபிரெயச் சொல் தனிப்பட்ட நண்பரையும், உடன் இருப்பவரையும், அரசவைத் துணைவர் அல்லது ஆலோசகரையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲבִימֶלֶךְ
  choice: அப்போது அபிமெலேக்கு
  rationale: கதைத் தொடரைக் குறிக்கும் வாவ் முன்னொட்டு, இயல்பான நவீன தமிழில் ‘அப்போது’ என மொழிபெயர்க்கப்பட்டது; பெயர் வழக்கமான தமிழாக்கத்தில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הָלַךְ אֵלָי/ו
  choice: அவனிடம் சென்றான்
  rationale: הלך என்பதன் அடிப்படைப் பொருளான ‘செல்’ பாதுகாக்கப்படுகிறது; אֵלָיו உள்ள சுட்டுப்பெயர் சூழலில் ஈசாக்கைக் குறித்தாலும், எபிரெய உரையைப் போலவே பெயரைச் சேர்க்காமல் சுட்டுப்பெயராக வைக்கப்பட்டுள்ளது.
- source_word: מִ/גְּרָר
  choice: கேராரிலிருந்து
  rationale: מן முன்னிடைச்சொல்லின் மூலத்தைக் குறிக்கும் பொருள் ‘-இலிருந்து’ என்பதால் தெளிவாகக் கொடுக்கப்பட்டுள்ளது; இடப்பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: וַ/אֲחֻזַּת
  choice: அகுசாத்துடனும்
  rationale: வாவ் மூலம் இணைக்கப்பட்ட அகுசாத், அபிமெலேக்குடன் சென்ற துணைநபராக இருப்பதால் தமிழில் இயல்பான உடனிகழ்ச்சிப் பொருளுடன் தரப்பட்டுள்ளது.
- source_word: מֵֽרֵעֵ/הוּ
  choice: தன் நண்பனான[a]
  rationale: רֵעַ என்பதன் நேரடியான பொதுப் பொருள் ‘நண்பன்’; அரசவையோ தனிப்பட்ட துணையோ ஆலோசகரோ என்ற நுண்பொருள் சாத்தியமுள்ளதால் மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: וּ/פִיכֹל
  choice: பிக்கோலுடனும்
  rationale: பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, அகுசாத்துடன் இணையான உடனிகழ்ச்சி அமைப்பில் தரப்பட்டுள்ளது.
- source_word: שַׂר צְבָא/וֹ
  choice: தன் படைத்தளபதியான
  rationale: שַׂר என்பது இங்கு படையின் தலைமை அதிகாரியையும் צָבָא இராணுவப் படையையும் குறிக்கின்றன; ‘படைத்தளபதி’ நவீன தமிழில் சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
