translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொல்லின் தெளிவின்மையைத் தீர்மானமாகக் குறுக்காமல், முதன்மை உரையில் பொதுவான ‘நண்பன்’ என்பதும் அடிக்குறிப்பில் அரசவைச் சூழலுக்குரிய மாற்றுப் பொருள்களும் தரப்பட்டுள்ளன.
