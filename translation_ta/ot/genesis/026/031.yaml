translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் சொற்சொல் வடிவம் தமிழில் உடன்பிறந்த சகோதரர்களைக் குறிக்கும் தவறான எண்ணத்தை ஏற்படுத்தக்கூடும் என்பதால், அதன் பரஸ்பரப் பொருள் பிரதான உரையிலும் சொற்சொல் வடிவம் அடிக்குறிப்பிலும் தரப்பட்டுள்ளன.
