  to: அவர்கள் அதிகாலையில் எழுந்து, ஒருவருக்கொருவர் சத்தியம் செய்துகொண்டார்கள்[a]. பின்பு ஈசாக்கு அவர்களை அனுப்பிவைத்தான்; அவர்கள் அவனிடமிருந்து சமாதானமாகப் புறப்பட்டுச் சென்றார்கள்.
