base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/031.yaml
  text: And they rose early in the morning and swore an oath, each man to his brother; then Isaac sent them away[a], and they departed from him in peace.
translation:
  language: ta
  text: அவர்கள் அதிகாலையில் எழுந்து, ஒருவருக்கொருவர் சத்தியம் செய்துகொண்டார்கள்[a]. பின்பு ஈசாக்கு அவர்களை அனுப்பிவைத்தான்; அவர்கள் அவனிடமிருந்து சமாதானமாகப் புறப்பட்டுச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொற்சொல்லாக, “ஒவ்வொருவனும் தன் சகோதரனிடம்”; இங்கு இது அவர்கள் பரஸ்பரம் சத்தியம் செய்துகொண்டதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: அதிகாலையில் எழுந்து
  rationale: שׁכם என்பதன் இவ்வடிவம் அதிகாலையில் எழுவதைக் குறிக்கிறது; בַבֹּקֶר உடன் சேர்ந்து வரும் கருத்தை இயல்பான நவீனத் தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: וַיִּשָּׁבְעוּ
  choice: ஆணையிட்டார்கள்
  rationale: நிபால் வடிவிலுள்ள שׁבע முறையான உறுதிமொழி அல்லது ஆணையைக் குறிக்கிறது. ‘ஆணையிட்டார்கள்’ என்பது அந்தச் செயலின் தீவிரத்தையும் உடன்படிக்கைச் சூழலையும் இயல்பாகக் காட்டுகிறது.
- source_word: אִישׁ לְאָחִיו
  choice: ஒவ்வொருவரும் மற்றவரிடம்
  rationale: எபிரெய மொழிமரபின் பரஸ்பரச் செயற்பாட்டைத் தெளிவான தமிழில் தருகிறது; ‘சகோதரன்’ என்ற சொல் இங்கு உடன்பிறந்த உறவைக் குறிக்கவில்லை என்பதால் அதைப் பிரதான உரையில் சொற்சொல்லாக இடாமல், அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: וַיְשַׁלְּחֵם
  choice: அவர்களை அனுப்பிவைத்தான்
  rationale: Piel வடிவிலுள்ள שׁלח ஒருவரைப் புறப்பட அனுப்புவதைக் குறிக்கிறது; ‘அனுப்பிவைத்தான்’ இச்சூழலில் இயல்பான தமிழ்.
- source_word: וַיֵּלְכוּ מֵאִתּוֹ
  choice: அவர்கள் அவனிடமிருந்து ... புறப்பட்டுச் சென்றார்கள்
  rationale: הלך உடன் מֵאֵת வருவது ஒருவரிடமிருந்து விலகிச் செல்வதைக் குறிக்கிறது; தமிழ் நடையில் இயக்கத்தையும் பிரிவையும் தெளிவாகத் தருகிறது.
- source_word: בְּשָׁלוֹם
  choice: சமாதானத்துடன்
  rationale: שָׁלוֹם இங்கு சண்டையற்ற உறவையும் பாதுகாப்பான புறப்பாட்டையும் உள்ளடக்குகிறது; ‘சமாதானத்துடன்’ இரு பரிமாணங்களையும் தக்கவைக்கிறது.
