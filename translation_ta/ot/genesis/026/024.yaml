  text: וַ/יֵּרָ֨א אֵלָ֤י/ו יְהוָה֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֕אמֶר אָנֹכִ֕י אֱלֹהֵ֖י אַבְרָהָ֣ם אָבִ֑י/ךָ אַל תִּירָא֙ כִּֽי אִתְּ/ךָ֣ אָנֹ֔כִי וּ/בֵֽרַכְתִּ֨י/ךָ֙ וְ/הִרְבֵּיתִ֣י אֶֽת זַרְעֲ/ךָ֔ בַּ/עֲב֖וּר אַבְרָהָ֥ם עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/024.yaml
  text: And Yahweh appeared to him that night and said[a], “I am the God of Abraham your father. Do not fear, for I am with you[b], and I will bless you and multiply your offspring for the sake of Abraham my servant.”
translation:
  language: ta
  text: அந்த இரவில் யாவே அவனுக்குத் தோன்றி, “நான் உன் தந்தையான ஆபிரகாமின் கடவுள். அஞ்சாதே; ஏனெனில் நான் உன்னோடு இருக்கிறேன். நான் உன்னை ஆசீர்வதித்து, என் ஊழியனான ஆபிரகாமின் பொருட்டு உன் சந்ததி[a]யைப் பெருகச் செய்வேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியான மொழிபெயர்ப்பு, “உன் வித்து”; இங்கு அது கூட்டாக வழித்தோன்றல்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டமாக மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் பரவலான ஒலிபெயர்ப்பைத் தமிழில் வழங்குகிறது.
- source_word: וַיֵּרָא אֵלָיו
  choice: அவனுக்குத் தோன்றி
  rationale: ראה என்பதன் நிஃபால் வடிவம் இங்கு நேரடியான இறை வெளிப்பாட்டைக் குறிக்கிறது; இந்தத் தமிழ் நடை அதன் நேர்மையையும் இயல்பையும் காக்கிறது.
- source_word: בַּלַּיְלָה הַהוּא
  choice: அந்த இரவில்
  rationale: காலத்தையும் சுட்டுப்பொருளையும் இயல்பான நவீனத் தமிழில் துல்லியமாகக் காட்டுகிறது.
- source_word: אָנֹכִי אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: நான் உன் தந்தை ஆபிரகாமின் கடவுள்
  rationale: எபிரெயத் தொடரின் உறவுப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; ‘தந்தை’ இங்கு மூதாதை உறவையும் தாங்குகிறது.
- source_word: אַל תִּירָא
  choice: அஞ்சாதே
  rationale: தடை கட்டளையின் சுருக்கத்தையும் இறை ஆறுதலின் கண்ணியமான நடையையும் காக்கும் இயல்பான தமிழ்.
- source_word: כִּי אִתְּךָ אָנֹכִי
  choice: ஏனெனில் நான் உன்னோடு இருக்கிறேன்
  rationale: כִּי என்பது அஞ்ச வேண்டாமென்ற கட்டளைக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: וּבֵרַכְתִּיךָ
  choice: நான் உன்னை ஆசீர்வதித்து
  rationale: வாக்குறுதி சூழலில் எதிர்காலச் செயலைக் குறிக்கிறது; அடுத்த வினையுடன் இணைந்த இயல்பான தமிழ்த் தொடர்.
- source_word: וְהִרְבֵּיתִי אֶת זַרְעֲךָ
  choice: உன் சந்ததியைப் பெருகச் செய்வேன்
  rationale: ஹிஃபில் வடிவத்தின் ‘பலுகச் செய்தல்’ என்ற காரணவினைப் பொருளையும் זֶרַע என்பதன் கூட்டொருமை வழித்தோன்றல் பொருளையும் காக்கிறது.
- source_word: בַּעֲבוּר
  choice: பொருட்டு
  rationale: ஆபிரகாமை முன்னிட்டு வழங்கப்படும் ஆசீர்வாதத்தின் அடிப்படையை, உரையைத் தாண்டி விளக்காமல் வெளிப்படுத்துகிறது.
- source_word: עַבְדִּי
  choice: என் ஊழியனாகிய
  rationale: இந்த உடன்படிக்கைச் சூழலில் அடிமைச் சமூகநிலையை விட இறைவனுக்குச் சேவை செய்யும் உறவுநிலையே முன்னிலையில் இருப்பதால் ‘ஊழியன்’ பொருத்தமானது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டம் அல்ல, நான்கு மெய்யெழுத்துகளைக் கொண்ட தனிப்பெயர் உள்ளது. ஆகவே அதைப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: בַּעֲבוּר אַבְרָהָם עַבְדִּי என்பதில் வாக்குறுதியின் அடிப்படை
  choice: என் ஊழியனாகிய ஆபிரகாமின் பொருட்டு
  alternative: என் ஊழியனாகிய ஆபிரகாமின் காரணமாக
  rationale: ஈசாக்குக்கான ஆசீர்வாதத்தை ஆபிரகாமோடு தொடர்புபடுத்தும் மூலத்தின் காரண அல்லது பொருட்டுப் பொருளைத் தக்கவைக்கிறது; அதன் இறையியல் இயங்குமுறையை மேலதிகமாகத் தீர்மானிக்கவில்லை.
- issue: זֶרַע என்பதன் கூட்டொருமைப் பொருள்
  choice: சந்ததி
  alternative: வித்து; வழித்தோன்றல்கள்
  rationale: மூலச் சொல் இலக்கணத்தில் ஒருமையாக இருந்தாலும் கூட்டாக வழித்தோன்றல்களைக் குறிக்கிறது. ‘சந்ததி’ அந்த வடிவத்தையும் பொருளையும் தமிழில் இயல்பாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவே’ என்ற தனிப்பெயர் பாதுகாக்கப்பட்டுள்ளது; ‘அஞ்சாதே’, ‘சந்ததி’, ‘ஊழியன்’ ஆகியவை சுருக்கம், மூலப்பொருள், இயல்பான தமிழ் ஆகியவற்றைச் சமநிலைப்படுத்துகின்றன.
