  text: עֵ֕קֶב אֲשֶׁר שָׁמַ֥ע אַבְרָהָ֖ם בְּ/קֹלִ֑/י וַ/יִּשְׁמֹר֙ מִשְׁמַרְתִּ֔/י מִצְוֺתַ֖/י חֻקּוֹתַ֥/י וְ/תוֹרֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/005.yaml
  text: because Abraham obeyed my voice and kept my charge[a], my commandments, my statutes[b], and my laws.
translation:
  language: ta
  text: ஏனெனில் ஆபிரகாம் என் குரலுக்குச் செவிகொடுத்து[a], என் பொறுப்பாக ஒப்படைத்ததையும், என் கட்டளைகளையும், என் நியமங்களையும், என் போதனைகளையும்[b] கடைப்பிடித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “என் குரலுக்குச் செவிகொடுத்தான்.” இந்த எபிரெய மொழித்தொடர் பொதுவாகக் கீழ்ப்படிந்து கேட்பதைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: “என் சட்டங்களையும்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் தோரா என்பது சூழலுக்கேற்ப சட்டம், அறிவுறுத்தல் அல்லது போதனை எனப் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵקֶב
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள வாக்கியத்தில் கூறப்படும் ஆசீர்வாதத்திற்கான காரணத்தை அறிமுகப்படுத்துவதால், இயல்பான காரண இணைப்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: שָׁמַע ... בְּקֹלִי
  choice: என் குரலுக்குச் செவிகொடுத்து
  rationale: எபிரெய மொழித்தொடரின் கேட்பது சார்ந்த உருவகத்தையும், அதிலுள்ள கீழ்ப்படிதல் சார்ந்த பொருளையும் தக்கவைக்கிறது.
- source_word: וַיִּשְׁמֹר
  choice: காத்து … கடைப்பிடித்தான்
  rationale: שׁמר என்பதன் ‘காத்தல்/கடைப்பிடித்தல்’ என்ற பரப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; பட்டியலிலுள்ள அனைத்துக்கும் வினைச்சொல் பொருந்துகிறது.
- source_word: מִשְׁמַרְתִּי
  choice: நான் காக்கும்படி ஒப்படைத்ததை
  rationale: காக்கும்படி ஒப்படைக்கப்பட்ட பொறுப்பு அல்லது கடமை என்ற தனித்துவமான பொருளை, அடுத்துவரும் சட்டச் சொற்களோடு ஒன்றாக்காமல் தெளிவாகக் காட்டுகிறது.
- source_word: מִצְוֺתַי
  choice: என் கட்டளைகள்
  rationale: உடன்படிக்கை மற்றும் சட்டச் சூழலில் מִצְוָה என்பதற்கான நேரடியான, பொதுவாகப் புரியும் இணைச்சொல்.
- source_word: חֻקּוֹתַי
  choice: என் நியமங்கள்
  rationale: கட்டளைகள் மற்றும் போதனைகளிலிருந்து சொல் வேறுபாட்டைக் காத்துக்கொண்டே, நிலைநிறுத்தப்பட்ட விதிமுறைகள் என்ற சட்டப் பொருளைத் தருகிறது.
- source_word: וְתוֹרֹתָי
  choice: என் போதனைகள்
  rationale: תוֹרָה என்பதன் அடிப்படைப் பொருளான ‘அறிவுறுத்தல்/போதனை’ என்பதைப் பாதுகாக்கிறது; பன்மையையும் அப்படியே தக்கவைக்கிறது. சட்டச் சூழலில் ‘சட்டங்கள்’ என்பதும் சாத்தியம்.
theological_decisions:
- issue: சீனாய்க்கு முந்தைய சூழலில் உடன்படிக்கை/சட்டச் சொற்களின் தொகுப்பு
  choice: பொறுப்பு, கட்டளைகள், நியமங்கள், போதனைகள் ஆகிய தனித்தனி கருத்துகளைத் தக்கவைத்தல்
  alternative: பட்டியலை ‘என் விதிமுறைகள் அனைத்தும்’ என்று சுருக்குதல் அல்லது תורותי என்பதை மட்டும் ‘சட்டங்கள்’ என்று மொழிபெயர்த்தல்
  rationale: மூலவசனம் ஆபிரகாமின் முழுமையான கீழ்ப்படிதலை வலியுறுத்த நெருங்கிய பொருளுடைய பல சொற்களை அடுக்குகிறது. சீனாய்க்கு முந்தைய ‘தோரா’ பற்றிய இறையியல் பதற்றத்தை விளக்கி அகற்றாமல் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. சட்டப் பட்டியலின் சொல் வேறுபாடும் மூலத்தின் கீழ்ப்படிதல் உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
