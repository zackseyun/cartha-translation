  text: When Esau was forty years old[a], he took as wives Judith daughter of Beeri the Hittite, and Basemath daughter of Elon the Hittite.
translation:
  language: ta
  text: ஏசாவுக்கு நாற்பது வயதானபோது, அவன் ஏத்தியனான பெயேரியின் மகள் யூதித்தையும், ஏத்தியனான ஏலோனின் மகள் பஸ்மாத்தையும் மனைவிகளாக ஏற்றுக்கொண்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்கு சொல் மொழிபெயர்த்தால், “ஒரு மனைவியை ஏற்றுக்கொண்டான்: யூதித்தையும் ... பஸ்மாத்தையும் ...” எனலாம். இரண்டு பெண்கள் பெயரிடப்பட்டிருந்தாலும், எபிரேயத்தில் “மனைவி/பெண்” என்ற சொல் ஒருமையில் உள்ளது.'
