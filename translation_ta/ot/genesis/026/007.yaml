translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயத்தில் காரணவாக்கியத்துக்குள் வரும் முதல் நபர் ‘என்னைக்’ என்பது ஈசாக்கின் உள்ளெண்ணமாக நேர்க்கூற்றில் வைக்கப்பட்டு பாதுகாக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையிலுள்ள அடிக்குறிப்பு மூலவாக்கியத்திற்கு உண்மையான தனிப் பொருள் மாற்றத்தை வழங்காததால் சேர்க்கப்படவில்லை.
