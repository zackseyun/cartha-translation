source:
  edition: WLC
  text: וַֽ/יִּשְׁאֲל֞וּ אַנְשֵׁ֤י הַ/מָּקוֹם֙ לְ/אִשְׁתּ֔/וֹ וַ/יֹּ֖אמֶר אֲחֹ֣תִ/י הִ֑וא כִּ֤י יָרֵא֙ לֵ/אמֹ֣ר אִשְׁתִּ֔/י פֶּן יַֽהַרְגֻ֜/נִי אַנְשֵׁ֤י הַ/מָּקוֹם֙ עַל רִבְקָ֔ה כִּֽי טוֹבַ֥ת מַרְאֶ֖ה הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/007.yaml
  text: When the men of the place asked about his wife[a], he said, “She is my sister,” because he was afraid to say, “She is my wife,” lest the men of the place kill me because of Rebekah, because she was beautiful in appearance.
translation:
  language: ta
  text: அந்த இடத்து ஆண்கள் அவனுடைய மனைவியைப் பற்றி விசாரித்தபோது, “இவள் என் சகோதரி” என்றான். ஏனெனில், “இவள் என் மனைவி” என்று சொல்ல அவன் பயந்தான்; ரெபெக்கா அழகிய தோற்றமுடையவளாக இருந்ததால், அந்த இடத்து ஆண்கள் ரெபெக்காவின் காரணமாக என்னைக் கொன்றுவிடக்கூடும் என்று அவன் அஞ்சினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ
  choice: விசாரித்தபோது
  rationale: שׁאל என்பது இங்கு நேரடியான விசாரணையைக் குறிக்கிறது; காலவரிசையை இயல்பான தமிழில் காட்ட ‘விசாரித்தபோது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: அந்த இடத்து ஆண்கள்
  rationale: אַנְשֵׁי என்பது பொதுவாக ‘மக்கள்’ என்பதல்ல, ஆண்களைக் குறிப்பாகச் சுட்டுகிறது; ‘அந்த இடத்து’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: לְאִשְׁתּוֹ
  choice: அவனுடைய மனைவியைப் பற்றி
  rationale: שׁאל உடன் வரும் לְ இங்கு விசாரணையின் பொருளைக் குறிக்கிறது.
- source_word: אֲחֹתִי הִוא
  choice: இவள் என் சகோதரி
  rationale: எபிரெயப் பயனிலை அடையாள வாக்கியத்தை இயல்பான தமிழ் நேர்க்கூற்றாக வழங்குகிறது.
- source_word: כִּי יָרֵא
  choice: ஏனெனில் ... அவன் பயந்தான்
  rationale: כִּי ஈசாக்கு கூறியதற்கான காரணத்தை அறிமுகப்படுத்துகிறது; יָרֵא என்பதற்கு தெளிவான பொதுநடைச் சொல் ‘பயந்தான்’.
- source_word: אִשְׁתִּי
  choice: இவள் என் மனைவி
  rationale: மூலத்தில் ‘என் மனைவி’ என்று மட்டும் இருந்தாலும், தமிழ் நேர்க்கூற்றின் இயல்புக்காகச் சுட்டுப்பெயரும் வினையற்ற பயனிலை அமைப்பும் வெளிப்படுத்தப்பட்டுள்ளன.
- source_word: פֶּן יַהַרְגֻנִי
  choice: என்னைக் கொன்றுவிடக்கூடும்
  rationale: פֶּן அஞ்சப்படும் விளைவை அறிமுகப்படுத்துகிறது; ‘கொன்றுவிடக்கூடும்’ என்பது அந்த அச்சத்தை இயல்பாக வெளிப்படுத்துகிறது, சட்டரீதியான ‘கொலை’ என்ற கூடுதல் நுணுக்கத்தைச் சேர்ப்பதில்லை.
- source_word: עַל רִבְקָה
  choice: ரெபெக்காவை முன்னிட்டு
  rationale: עַל இங்கு ரெபெக்காவை காரணமாக அல்லது சந்தர்ப்பமாகக் கொண்டு நிகழக்கூடிய செயலைக் குறிக்கிறது; ‘அவளுக்காக’ என்பது அவளைப் பெறும் நோக்கத்தை மிகத் திட்டவட்டமாக்கக்கூடும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: טוֹבַת מַרְאֶה
  choice: அழகிய தோற்றமுடையவள்
  rationale: சொற்றொடர் பார்வைக்கு இனிய அல்லது அழகிய தோற்றத்தைக் குறிக்கிறது; தொன்மையான நடையைத் தவிர்த்து பொருளை நேரடியாகத் தருகிறது.
- source_word: רִבְקָה
  choice: ரெபெக்கா
  rationale: எபிரெயப் பெயரின் ஒலிவடிவத்தை நவீனத் தமிழ் வேதாகமப் பெயர்ப்பயன்பாட்டுக்கு ஏற்றவாறு தருகிறது.
