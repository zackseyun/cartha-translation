source:
  edition: WLC
  text: וַ/יְהִ֤י רָעָב֙ בָּ/אָ֔רֶץ מִ/לְּ/בַד֙ הָ/רָעָ֣ב הָ/רִאשׁ֔וֹן אֲשֶׁ֥ר הָיָ֖ה בִּ/ימֵ֣י אַבְרָהָ֑ם וַ/יֵּ֧לֶךְ יִצְחָ֛ק אֶל אֲבִימֶּ֥לֶךְ מֶֽלֶךְ פְּלִשְׁתִּ֖ים גְּרָֽרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/001.yaml
  text: There was a famine in the land[a], besides the first famine that had been in the days of Abraham. So Isaac went to Abimelech king of the Philistines at Gerar.
translation:
  language: ta
  text: ஆபிரகாமின் நாட்களில் ஏற்பட்ட முதல் பஞ்சத்தைத் தவிர மேலும் நாட்டில் வேறொரு பஞ்சம் ஏற்பட்டது. அதனால் ஈசாக்கு, கேராரில்[a] இருந்த பெலிஸ்தியரின் அரசன் அபிமெலேக்கிடம் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேராருக்கு.” எபிரெய மொழியில் ‘கேரார்’ என்ற பெயருடன் சேர்ந்துள்ள திசைசுட்டும் இறுதி, கேராரை நோக்கிய பயணத்தை வெளிப்படையாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רָעָב בָּאָרֶץ
  choice: அந்த நாட்டில் வேறொரு பஞ்சமும் ஏற்பட்டது
  rationale: היה என்பதன் நிகழ்வை இயல்பான தமிழ் நடையில் ‘ஏற்பட்டது’ எனத் தருகிறது; אֶרֶץ இங்கு உலகம் முழுவதையும் அல்ல, குறிப்பிட்ட நாட்டுப் பகுதியைக் குறிக்கிறது. முந்தைய பஞ்சத்துடன் ஒப்பிடப்படுவதால் ‘வேறொரு’ என்பது தமிழில் தெளிவாக இணைக்கப்பட்டுள்ளது.
- source_word: מִלְּבַד הָרָעָב הָרִאשׁוֹן
  choice: முதல் பஞ்சத்தைத் தவிர
  rationale: מִלְּבַד என்பதன் ‘தவிர/அதற்கு மேலாக’ என்ற உறவையும், רִאשׁוֹן என்பதன் வரிசைச் சுட்டான ‘முதல்’ என்பதையும் காக்கிறது.
- source_word: אֲשֶׁר הָיָה בִּימֵי אַבְרָהָם
  choice: ஆபிரகாமின் நாட்களில் ஏற்பட்ட
  rationale: முந்தைய பஞ்சம் ஆபிரகாமின் வாழ்நாளில் நிகழ்ந்தது என்பதைச் சுருக்கமான, இயல்பான தமிழில் அடையாளப்படுத்துகிறது.
- source_word: וַיֵּלֶךְ יִצְחָק
  choice: அதனால் ஈசாக்கு ... சென்றார்
  rationale: Wayyiqtol கதையை முன்னேற்றுகிறது. பஞ்சத்தைத் தொடர்ந்து ஈசாக்கு சென்றதை ‘அதனால்’ இயல்பாகக் காட்டுகிறது; காரணத் தொடர்பை அளவுக்கு மீறி விரிவுபடுத்தவில்லை.
- source_word: אֶל אֲבִימֶּלֶךְ מֶלֶךְ פְּלִשְׁתִּים
  choice: பெலிஸ்தியரின் அரசன் அபிமெலேக்கிடம்
  rationale: אֶל என்பதன் இலக்குத் தொடர்பை ‘-இடம்’ வழியாகவும், எபிரெயக் கட்டமைப்பை ‘பெலிஸ்தியரின் அரசன்’ என்றும் தெளிவாகத் தருகிறது.
- source_word: גְּרָרָה
  choice: கேராரில்
  rationale: முதன்மை இலக்கு அபிமெலேக்கு என்பதால், அவர் இருந்த இடத்தைத் தமிழில் இயல்பாகக் குறிப்பிடுகிறது. சொல்லின் திசைசுட்டும் வடிவால் ‘கேராருக்கு’ என்பதும் சாத்தியம்; அது அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: פְּלִשְׁתִּים என்ற வரலாற்று இன-அரசியல் பெயர்
  choice: பெலிஸ்தியர்
  alternative: பெலிஸ்திய மக்கள்
  rationale: இது இறையியல் பட்டம் அல்ல; வழக்கமான வரலாற்று இனப்பெயராக நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ஆபிரகாம், ஈசாக்கு, அபிமெலேக்கு, பெலிஸ்தியர், கேரார் ஆகியவை பரவலாக அறியப்பட்ட தமிழ் வேதாகமப் பெயர்வடிவங்களில் தரப்பட்டுள்ளன.
