source:
  edition: WLC
  text: וַ/יִּ֧בֶן שָׁ֣ם מִזְבֵּ֗חַ וַ/יִּקְרָא֙ בְּ/שֵׁ֣ם יְהוָ֔ה וַ/יֶּט שָׁ֖ם אָהֳל֑/וֹ וַ/יִּכְרוּ שָׁ֥ם עַבְדֵי יִצְחָ֖ק בְּאֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/025.yaml
  text: So he built an altar there and called on the name of Yahweh[a], and he pitched his tent there[b]. And Isaac’s servants dug a well there.
translation:
  language: ta
  text: அவன் அங்கே ஒரு பலிபீடத்தைக் கட்டி, யாவேயின் பெயரைச் சொல்லி அவரை வேண்டினான்[a]. அங்கே தன் கூடாரத்தை அமைத்தான். ஈசாக்கின் பணியாளர்கள் அங்கே ஒரு கிணற்றைத் தோண்டினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் பெயரை அறிவித்தான்.” இந்த எபிரேய மரபுத்தொடர் யாவேயின் பெயரைச் சொல்லி அவரை வேண்டுவதையோ அவரது பெயரை அறிவிப்பதையோ குறிக்கலாம்; இங்கே பலிபீடத்தின் சூழல் வேண்டுதல் என்ற பொருளை ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: அங்கே ஒரு பலிபீடத்தைக் கட்டி
  rationale: בנה என்பதற்கான இயல்பான கதைநடைச் சொல் ‘கட்டு’; מִזְבֵּחַ என்பதற்கு வழிபாடு மற்றும் பலியிடும் அமைப்பைக் குறிக்கும் நிலையான தமிழ்ச் சொல் ‘பலிபீடம்’.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: யெகோவாவின் பெயரைச் சொல்லி அழைத்தான்
  rationale: קרא בשם என்ற எபிரேய மரபுத்தொடர் அழைத்தல்/வேண்டுதல் அல்லது அறிவித்தல் எனப் பொருள்படலாம். பலிபீடச் சூழலில் வழிபாட்டுடன் கூடிய அழைத்தல் முதன்மையானது; ‘பெயரைச் சொல்லி அழைத்தான்’ என்பது அந்த நோக்கைப் பாதுகாப்பதோடு தமிழில் இயல்பாக உள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: וַיֶּט שָׁם אָהֳלוֹ
  choice: அங்கே தன் கூடாரத்தை அமைத்தான்
  rationale: נטה + אהל என்பதன் சூழல்சார் பொருள் கூடாரத்தை விரித்து நிறுவுதல்; நவீனத் தமிழில் ‘கூடாரத்தை அமைத்தான்’ இயல்பும் தெளிவும் உடையது. உடைமைப் பின்னொட்டு ‘தன்’ என வழங்கப்பட்டுள்ளது.
- source_word: עַבְדֵי יִצְחָק
  choice: ஈசாக்கின் பணியாளர்கள்
  rationale: עבד அடிமையையோ பணியாளரையையோ குறிக்கலாம். இங்கு கிணறு தோண்டும் வீட்டார் சார்ந்த வேலையாட்களைக் குறிப்பதால், சட்டநிலையைத் தேவையின்றி நிர்ணயிக்காத ‘பணியாளர்கள்’ பொருத்தமானது.
- source_word: וַיִּכְרוּ שָׁם בְּאֵר
  choice: அங்கே ஒரு கிணற்றைத் தோண்டினார்கள்
  rationale: כרה என்பதற்கு கிணறு சூழலில் ‘தோண்டு’ என்றும் באר என்பதற்கு ‘கிணறு’ என்றும் நேராகவும் இயல்பாகவும் மொழிபெயர்க்கப்பட்டுள்ளது; שָׁם மீண்டும் வருவது இடத்திற்கான மூல உரையின் வலியுறுத்தலைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: ஆண்டவர்; யாவே
  rationale: மூல உரையிலுள்ள தனிப்பெயரைப் பட்டமாக மாற்றாமல் பாதுகாக்கிறது. தமிழில் நன்கு அறியப்பட்ட ஒலிபெயர்ப்பு ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது; இது எந்தக் குறிப்பிட்ட விளக்கவுரைக் கோட்பாட்டையும் வசனத்தில் சேர்க்காது.
- issue: קרא בשם יהוה என்பதன் பொருள்
  choice: யெகோவாவின் பெயரைச் சொல்லி அழைத்தான்
  alternative: யெகோவாவின் பெயரை அறிவித்தான்
  rationale: இந்த மரபுத்தொடரில் அழைத்தல்/வேண்டுதல் மற்றும் அறிவித்தல் ஆகிய பொருள் வாய்ப்புகள் உள்ளன. பலிபீடம் கட்டிய சூழல் வழிபாட்டுடன் கூடிய அழைத்தலை ஆதரிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையான ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூல உரில் שָׁם மூன்று முறை வருவதால் ‘அங்கே’ என்பதும் மூன்று செயல்களோடும் தக்கவைக்கப்பட்டுள்ளது. தொடர்ச்சியான எபிரேய வினை அமைப்பைத் தமிழின் இயல்புக்கேற்ப தனித்த வாக்கியங்களாக வழங்கி, செய்பவரின் தெளிவைப் பாதுகாத்துள்ளோம்.
