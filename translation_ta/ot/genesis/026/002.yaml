  edition: WLC
  text: וַ/יֵּרָ֤א אֵלָי/ו֙ יְהוָ֔ה וַ/יֹּ֖אמֶר אַל תֵּרֵ֣ד מִצְרָ֑יְמָ/ה שְׁכֹ֣ן בָּ/אָ֔רֶץ אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/002.yaml
  text: Then Yahweh appeared to him and said[a], “Do not go down to Egypt. Dwell in the land that I will tell you.”
translation:
  language: ta
  text: அப்போது யாவே அவனுக்குத் தோன்றி, “எகிப்துக்குப் போகாதே. நான் உனக்குச் சொல்லும் நாட்டில் குடியிரு[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உன்னிடம் சொல்லும் நாட்டில் தங்கியிரு.” இது எபிரெயச் சொற்றொடரை இன்னும் நேரடியாகப் பிரதிபலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: தோன்றி
  rationale: ראה என்பதன் நிஃபால் வடிவம் இங்கு வெளிப்படுதலைக் குறிக்கிறது. அது நிகழ்ந்த விதத்தை தேவையின்றி விளக்காமல், தமிழில் இயல்பாக ‘தோன்றி’ என வழங்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயர். அதன் ஒலிபெயர்ப்பைத் தமிழில் ‘யாவே’ என்று வழங்குவது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- source_word: אַל תֵּרֵד מִצְרָיְמָה
  choice: எகிப்துக்குப் போகாதே
  rationale: אַל உடன் வரும் வினை வடிவம் தடைக் கட்டளையைத் தருகிறது. எபிரெயத்தில் ‘கீழே இறங்குதல்’ என்ற பயண மரபுத்தொடர் இருந்தாலும், தமிழில் எகிப்துக்குச் செல்வதை இயல்பாக ‘போகாதே’ என்று சொல்வது பொருளைத் தெளிவாகத் தருகிறது.
- source_word: שְׁכֹן
  choice: குடியிரு
  rationale: שׁכן என்பதன் கட்டளை வடிவம் ஓர் இடத்தில் வசிப்பதையோ தங்கியிருப்பதையோ குறிக்கிறது. ‘குடியிரு’ என்பது வெறும் தற்காலிகத் தங்குதலை விட வசிப்பதன் கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּאָרֶץ
  choice: நாட்டில்
  rationale: אֶרֶץ இங்கு முழு பூமியைக் குறிக்காமல், ஈசாக்கு வசிக்க வேண்டிய நிலப்பகுதி அல்லது நாட்டைக் குறிக்கிறது.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: நான் உனக்குச் சொல்லும்
  rationale: אֹמַר வடிவம் சூழலில் தேவன் வழங்கும் வழிகாட்டுதலைக் குறிக்கிறது. தமிழ் நிகழ்கால உறவெச்சமான ‘சொல்லும்’ வரவிருக்கும் அறிவுறுத்தலையும் இயல்பாகக் குறிக்க முடிவதோடு, எபிரெயத்தின் காலநிலைத் திறப்பையும் அளவுக்கு மீறித் தீர்மானிக்காமல் வைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையில் பட்டப்பெயர் அல்லாமல் நான்கு எழுத்துகளைக் கொண்ட தேவனுடைய தனிப்பெயரே உள்ளது. ஆகவே பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: தேவன் குறிப்பிடும் நாட்டைப் பற்றிய வினையின் காலநிலை
  choice: நான் உனக்குச் சொல்லும் நாடு
  alternative: நான் உனக்குச் சொல்லப்போகும் நாடு
  rationale: எபிரெய அசம்பூர்ண வினை வரவிருக்கும் அறிவுறுத்தலைக் குறிக்கலாம்; ஆயினும் அதைத் தெளிவான எதிர்காலமாக மட்டும் கட்டுப்படுத்த வேண்டியதில்லை. ‘சொல்லும்’ என்பது தமிழில் இயல்பாகவும் மூலத்தின் திறந்த காலநிலையைப் பாதுகாக்கும் வகையிலும் உள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்கு ஏற்ற கண்ணியமும் காக்கப்பட்டுள்ளன. ‘குடியிரு’ என்பது புரியக்கூடிய இயல்பான கட்டளைச் சொல்; ‘யாவே’ தனிப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
