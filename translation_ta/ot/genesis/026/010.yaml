  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ מַה זֹּ֖את עָשִׂ֣יתָ לָּ֑/נוּ כִּ֠/מְעַט שָׁכַ֞ב אַחַ֤ד הָ/עָם֙ אֶת אִשְׁתֶּ֔/ךָ וְ/הֵבֵאתָ֥ עָלֵ֖י/נוּ אָשָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/010.yaml
  text: And Abimelech said[a], “What is this you have done to us? One of the people might easily have lain with your wife, and you would have brought guilt upon us.”
translation:
  language: ta
  text: அபிமெலேக்கு, “நீ எங்களுக்கு இப்படிச் செய்தது என்ன? எங்கள் மக்களில் ஒருவன் உன் மனைவியுடன் ஏறக்குறைய உடலுறவு கொண்டிருப்பான்; நீ எங்கள்மேல் குற்றப்பொறுப்பை வரவழைத்திருப்பாய்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: நீ எங்களுக்கு இப்படிச் செய்தது என்ன?
  rationale: מַה זֹּאת என்பதன் வியப்பும் கண்டனமும் கலந்த கேள்வி வடிவத்தையும், לָּנוּ என்பதன் கூட்டுச் சுட்டையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: כִּמְעַט
  choice: எளிதாகவே ... கொண்டிருக்கக்கூடும்
  rationale: நடக்காமல் மிக அருகில் தவிர்க்கப்பட்ட ஆபத்தையும், அது எளிதில் நிகழ்ந்திருக்கக்கூடிய சாத்தியத்தையும் சூழலுக்கேற்ற தமிழில் வெளிப்படுத்துகிறது; ‘கிட்டத்தட்ட’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: שָׁכַב ... אֶת אִשְׁתֶּךָ
  choice: உன் மனைவியுடன் ... உடலுறவு கொண்டிருக்க
  rationale: இது பாலுறவைக் குறிக்கும் எபிரேய மரபுத்தொடர். ‘படுத்திருக்க’ என்பது தமிழில் வெறும் உறக்கமாகப் புரியக்கூடும் என்பதால், தெளிவானதும் கண்ணியமானதுமான ‘உடலுறவு கொள்ள’ பயன்படுத்தப்படுகிறது.
- source_word: אַחַד הָעָם
  choice: மக்களில் ஒருவன்
  rationale: ‘மக்களில் ஒருவர்’ என்ற மூலத்தின் வரையறுக்கப்படாத ஒருமையையும் கூட்டுப்பெயரையும் காக்கிறது; சூழல் ஆண் ஒருவரைக் குறிப்பதால் இயல்பான தமிழில் ‘ஒருவன்’ என வழங்கப்படுகிறது.
- source_word: וְהֵבֵאתָ עָלֵינוּ אָשָׁם
  choice: நீ எங்கள்மேல் குற்றம் வரச் செய்திருப்பாய்
  rationale: சமூகப் பழியை மட்டும் அல்லாமல், தவறான செயலால் சமூகத்தின்மேல் வந்திருக்கும் உண்மையான அறநெறிக் குற்றப்பொறுப்பை வெளிப்படுத்துகிறது; ‘குற்றத்தைச் சுமத்துதல்’ எனும் தவறான குற்றச்சாட்டு உணர்வைத் தவிர்க்கிறது.
- source_word: וַיֹּאמֶר אֲבִימֶלֶךְ
  choice: அபிமெலேக்கு ... என்றான்
  rationale: எபிரேயக் கதைநடையின் வழக்கமான வினை வடிவத்தை இயல்பான தமிழ் நேர்கூற்று அமைப்பில் தருகிறது.
theological_decisions:
- issue: இந்தச் சூழலில் אָשָׁם என்பதன் இயல்பு
  choice: குற்றம்
  alternative: பழி / குற்றச்சாட்டு
  rationale: அறியாமையில் நிகழ்ந்திருக்கக்கூடிய பாலியல் தவறால் மக்கள்மீது வந்திருக்கும் உண்மையான அறநெறிக் குற்றப்பொறுப்பையே இங்கு குறிக்கிறது; வெறும் நற்பெயர்ச் சேதத்தையோ பிற்காலப் பலியியல் தொழில்நுட்பச் சொல்லையோ உரையில் புகுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குத் தெளிவான, கண்ணியமான கதைநடை. பாலுறவைக் குறிக்கும் இடத்தில் மறைபொருள் குழப்பத்தைத் தவிர்த்து நேர்மையான மருத்துவமல்லாத பொதுச் சொல் பயன்படுத்தப்பட்டுள்ளது. மூலத்திலுள்ள כִּמְעַט என்பதன் சாத்தியம்/கிட்டத்தட்ட நிகழ்தல் என்ற இரு நுணுக்கங்களும் முதன்மை உரை மற்றும் அடிக்குறிப்பு மூலம் காக்கப்பட்டுள்ளன.
