  to: அபிமெலேக்கு, “நீ எங்களுக்கு இப்படிச் செய்தது என்ன? எங்கள் மக்களில் ஒருவன் உன் மனைவியுடன் ஏறக்குறைய உடலுறவு கொண்டிருப்பான்; நீ எங்கள்மேல் குற்றப்பொறுப்பை வரவழைத்திருப்பாய்” என்றான்.
  rationale: முதன்மை உரையில் כִּמְעַט என்பதன் நேரடியான ‘ஏறக்குறைய’ பொருள் மீட்டெடுக்கப்பட்டது; ஆங்கில audit trail-இல் தேர்ந்தெடுக்கப்பட்ட ‘might easily have’ நுணுக்கம் அடிக்குறிப்பில் மாற்றுவழியாகக் காக்கப்பட்டது. நடந்துவிட்ட செயல் எனத் தவறாகத் தோன்றிய அடிக்குறிப்பு எதிர்நிகழ்வு/நெருங்கிய வாய்ப்பு எனத் திருத்தப்பட்டது. אָשָׁם-இன் அறநெறிக் culpability ‘குற்றப்பொறுப்பு’ எனத் தெளிவாக்கப்பட்டது. அடிக்குறிப்பு குறியீடு [a] திருத்திய முழு உரையில் இடம்பெற வேண்டும்.
