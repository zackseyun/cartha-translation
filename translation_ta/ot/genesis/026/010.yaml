    rationale: ‘எளிதாகவே ... கொண்டிருக்கக்கூடும்’ சாத்தியத்தையும் எளிமையையும் காட்டுகிறது; ஆனால் ‘almost/nearly’ என்ற அண்மையில் தவிர்க்கப்பட்ட நிகழ்வை வெளிப்படையாகச் சொல்லவில்லை. மூலத்தின் தெளிவான கால-அண்மை நுணுக்கத்தை முதன்மை உரையில் காக்க வேண்டும்.
