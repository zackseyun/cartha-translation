source:
  edition: WLC
  text: וַ/יִּזְרַ֤ע יִצְחָק֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יִּמְצָ֛א בַּ/שָּׁנָ֥ה הַ/הִ֖וא מֵאָ֣ה שְׁעָרִ֑ים וַֽ/יְבָרֲכֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/012.yaml
  text: Isaac sowed in that land[a], and in that year he found a hundredfold, and Yahweh blessed him.
translation:
  language: ta
  text: ஈசாக்கு அந்த நாட்டில் விதைத்தான். அந்த ஆண்டிலேயே அவனுக்கு நூறு மடங்கு விளைச்சல் கிடைத்தது[a]. யாவே அவனை ஆசீர்வதித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு வகையில், ‘அவன் நூறு அளவுகள் பெற்றான்.’ எபிரெயத்தில் சொற்சார்ந்து ‘அவன் நூறு שְׁעָרִים கண்டான்’ என்று உள்ளது; இது மிகுதியான விளைச்சலைக் குறிக்கும் ஒரு மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַע
  choice: விதைத்தான்
  rationale: விவசாயச் சூழலில் זרע என்பது விதை விதைப்பதைக் குறிக்கிறது; தமிழில் நேரடியும் இயல்புமான இணைச்சொல் இது.
- source_word: בָּאָרֶץ הַהִוא
  choice: அந்த நாட்டில்
  rationale: אֶרֶץ என்பதற்கு நிலம் அல்லது நாடு என்று பொருள் வரலாம். இங்கு ஈசாக்கு தங்கியிருந்த பிரதேசத்தை இயல்பாகக் குறிக்க ‘அந்த நாட்டில்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיִּמְצָא
  choice: அவனுக்குக் கிடைத்தது
  rationale: מצא என்பதன் அடிப்படைப் பொருள் ‘கண்டடைதல்’. இங்கு அறுவடைப் பலன் பெறப்பட்டதைக் குறிக்கும் விவசாயப் பயன்பாடு என்பதால், அடிப்படை உருவகத்திலிருந்து மிகத் தொலைவுபோகாமல் இயல்பான தமிழில் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: בַּשָּׁנָה הַהִוא
  choice: அந்த ஆண்டிலேயே
  rationale: முந்தைய ‘அந்த நாட்டில்’ என்ற சுட்டுடன் எபிரெயம் ‘அந்த ஆண்டு’ என்பதையும் மீண்டும் வலியுறுத்துகிறது; ‘-இலேயே’ என்பது அந்தத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵאָה שְׁעָרִים
  choice: நூறு மடங்கு விளைச்சல்
  rationale: இது விதைக்கப்பட்டதற்கு ஒப்பான மிகுதியான மகசூலைக் குறிக்கும் விவசாய மரபுத்தொடர். குறிப்பிட்ட ஓர் அளவலகைத் திணிக்காமல் பொருளைத் தெளிவாகத் தருகிறது; சொற்சார்ந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיְבָרֲכֵהוּ
  choice: அவனை ஆசீர்வதித்தார்
  rationale: ברך என்பதன் வழக்கமான இறையியல் பொருளான ‘ஆசீர்வதித்தல்’ பாதுகாக்கப்படுகிறது; வெறும் பொருளாதார வளமாகச் சுருக்கப்படவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைநாமம் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: ஈசாக்கின் விவசாயப் பலனை வெளிப்படுத்துதல்
  choice: அவனுக்கு நூறு மடங்கு விளைச்சல் கிடைத்தது
  alternative: அவன் நூறு அளவுகள் கண்டான்
  rationale: מצא என்ற வினையின் சொற்பொருளையும் מֵאָה שְׁעָרִים என்ற தெளிவற்ற மரபுத்தொடரையும் கருத்தில் கொண்டு, பிரதான உரையில் இயல்பான விவசாயப் பொருள் தரப்படுகிறது; சொற்சார்ந்த சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது. வளத்தின் காரணம் அடுத்த வாக்கியத்தில் யாவேயின் ஆசீர்வாதமாகத் தனியே நிலைநிறுத்தப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘விளைச்சல் கிடைத்தது’ என்பது விவசாயச் சூழலில் இயல்பாக உள்ளது; ‘ஆசீர்வதித்தார்’ என்ற மரியாதை ஒருமை இறைவனைக் குறிக்கிறது. அடிக்குறிப்பு குறி சம்பந்தப்பட்ட மகசூல் சொற்றொடருக்குப் பின்னே வைக்கப்பட்டுள்ளது.
