base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/009.yaml
  text: So Abimelech called Isaac and said[a], “Surely, she is your wife! So how could you say, ‘She is my sister’?” And Isaac said to him, “Because I said[c][b], ‘Lest I die because of her.’”
translation:
  language: ta
  text: அபிமெலேக்கு ஈசாக்கை அழைத்து, “நிச்சயமாக, இவள் உன் மனைவி! அப்படியிருக்க, ‘இவள் என் சகோதரி’ என்று எப்படிச் சொன்னாய்?” என்றான். ஈசாக்கு அவனிடம், “ஏனெனில், இவளால் நான் இறந்துவிடுவேனோ என்று சொன்னேன்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இவளை முன்னிட்டு நான் இறந்துவிடுவேனோ என்று.” சூழலில், ரெபெக்காவைக் காரணமாகக் கொண்டு மற்றவர்கள் ஈசாக்கைக் கொன்றுவிடுவார்களோ என்ற அச்சம் குறிக்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... לְיִצְחָק
  choice: ஈசாக்கை அழைத்து
  rationale: קרא + לְ ஒருவரை அழைப்பதை அல்லது வரவழைப்பதை இங்கு குறிக்கிறது; ‘அழைத்து’ என்பது இயல்பான கதைநடை.
- source_word: אַךְ הִנֵּה
  choice: நிச்சயமாக ... தானே!
  rationale: אַךְ தரும் உறுதியான வலியுறுத்தலையும் הִנֵּה கவனத்தை ஈர்க்கும் வியப்பு உணர்வையும் இயல்பான நவீன தமிழில் ஒருங்கிணைக்கிறது; இதை வினாவாக மாற்றவில்லை.
- source_word: אִשְׁתְּךָ הִוא
  choice: இவள் உன் மனைவி
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְאֵיךְ אָמַרְתָּ
  choice: அப்படியிருக்க ... என்று எப்படிச் சொன்னாய்?
  rationale: וְאֵיךְ அறிமுகப்படுத்தும் தொடர்பையும் கண்டனமும் நம்பமுடியாமையும் கலந்த கேள்வியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲחֹתִי הִוא
  choice: இவள் என் சகோதரி
  rationale: אחות என்பதன் அடிப்படைப் பொருள் ‘சகோதரி’; இதை விரிவான உறவுப்பெயராக மாற்றத் தேவையில்லை.
- source_word: כִּי אָמַרְתִּי
  choice: என்று நினைத்தேன்
  rationale: சொல்லுக்குச் சொல் ‘ஏனெனில் நான் சொன்னேன்’ என்றாலும், உள்ளார்ந்த எண்ணத்தை அறிமுகப்படுத்தும் இந்த எபிரெய வழக்கை நவீன தமிழில் ‘என்று நினைத்தேன்’ என்பது இயல்பாகக் கடத்துகிறது.
- source_word: פֶּן אָמוּת עָלֶיהָ
  choice: இவளால் நான் கொல்லப்படக்கூடும்
  rationale: פֶּן அஞ்சப்படும் சாத்திய விளைவைக் குறிக்கிறது. சொற்றொடர் நேரடியாக ‘நான் இறந்துவிடாதபடிக்கு/இறந்துவிடுவேனோ’ எனினும், சூழலில் மற்றவர்கள் அவளை அடைய ஈசாக்கைக் கொல்வார்கள் என்பதே கருத்து; ‘கொல்லப்படக்கூடும்’ அதை இயல்பாகத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: ஈசாக்கின் அச்சத்தின் காரணத்தையும் செயலாற்றுபவரையும் வெளிப்படுத்துதல்
  choice: ‘இவளால் நான் கொல்லப்படக்கூடும்’ என்று முதன்மை உரையில் அமைத்து, ‘அவளை முன்னிட்டு நான் இறந்துவிடுவேனோ’ என்ற நெருக்கமான வடிவத்தை அடிக்குறிப்பில் வழங்குதல்
  alternative: ‘இவளை முன்னிட்டு நான் இறந்துவிடுவேனோ’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: எபிரெய עָלֶיהָ காரணம் அல்லது சந்தர்ப்பத்தைக் குறித்தாலும் கொலையாளிகளை வெளிப்படையாகச் சொல்லவில்லை. சூழல் மரண அச்சம் கொலை செய்யப்படுவதைக் குறிக்கிறது; அடிக்குறிப்பு மூலத்தின் குறைவாக வெளிப்படுத்தப்பட்ட வடிவத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் இயல்பான கதைநடையும் பேணப்பட்டுள்ளன. அபிமெலேக்கின் வியப்பும் கண்டனமும் ‘நிச்சயமாக ... தானே’ மற்றும் ‘அப்படியிருக்க’ மூலம் வெளிப்படுகின்றன. அடிக்குறிப்பு குறியீடு [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
