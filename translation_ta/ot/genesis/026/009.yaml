revisions:
- from: அபிமெலேக்கு ஈசாக்கை அழைத்து, “இவள் நிச்சயமாக உன் மனைவிதானே! அப்படியிருக்க, ‘இவள் என் சகோதரி’ என்று எப்படிச் சொன்னாய்?” என்றான். அதற்கு ஈசாக்கு, “இவளால் நான் கொல்லப்படக்கூடும் என்று நினைத்தேன்[a]” என்றான்.
  to: அபிமெலேக்கு ஈசாக்கை அழைத்து, “நிச்சயமாக, இவள் உன் மனைவி! அப்படியிருக்க, ‘இவள் என் சகோதரி’ என்று எப்படிச் சொன்னாய்?” என்றான். ஈசாக்கு அவனிடம், “ஏனெனில், இவளால் நான் இறந்துவிடுவேனோ என்று சொன்னேன்[a]” என்றான்.
  rationale: The revision keeps Abimelech’s first statement as an emphatic declaration, restores Isaac’s explicit “I said,” and renders the feared death without making the implied assailants explicit in the main text. The footnote supplies the contextual implication as an interpretation rather than as the only sense of the source.
