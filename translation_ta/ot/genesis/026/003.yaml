base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/003.yaml
  text: Stay in this land[a], and I will be with you and bless you, for to you and to your offspring I will give all these lands[c][b], and I will establish the oath that I swore to Abraham your father.
translation:
  language: ta
  text: இந்த நாட்டில் தங்கியிரு[a]. நான் உன்னோடு இருப்பேன்; உன்னை ஆசீர்வதிப்பேன். ஏனெனில், இந்த நாடுகள் அனைத்தையும் உனக்கும் உன் சந்ததிக்கும்[b] கொடுப்பேன்; நான் உன் தந்தை ஆபிரகாமுக்குச் செய்த சத்தியத்தை நிலைநாட்டுவேன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்த நாட்டில் அந்நியனாக வசித்திரு’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் தற்காலிகக் குடியிருப்பாளராக அல்லது அந்நியனாக வசிப்பதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘விதை’; இங்கு அது கூட்டுப் பொருளில் ‘சந்ததி’ என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘உறுதிப்படுத்துவேன்’ அல்லது ‘நிறைவேற்றுவேன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּר
  choice: தங்கியிரு
  rationale: இந்த வினைச்சொல் பொதுவாக ஓர் இடத்தில் அந்நியனாக அல்லது தற்காலிகக் குடியிருப்பாளனாக வசிப்பதைக் குறிக்கிறது. இச்சூழலில் எகிப்துக்குச் செல்லாமல் இந்த நாட்டிலேயே இருக்கும்படி ஈசாக்குக்குக் கூறப்படுவதால், இயல்பான நவீனத் தமிழில் ‘தங்கியிரு’ என மொழிபெயர்க்கப்பட்டு, அந்நியக் குடியிருப்பு என்ற நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: இந்த நாட்டில்
  rationale: אֶרֶץ என்பது நிலம், நாடு அல்லது பூமி எனப் பொருள்படலாம். இங்கு குறிப்பிட்ட புவியியல் பகுதியையும் வாக்குறுதியின் சூழலையும் ‘நாடு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְאֶהְיֶה עִמְּךָ
  choice: நான் உன்னோடு இருந்து
  rationale: இறைவனின் உடனிருப்பை நேரடியாகவும் உறவுசார் வலிமையுடனும் காட்டுகிறது; மூலத்தில் இல்லாத விளக்கம் சேர்க்கப்படவில்லை.
- source_word: וַאֲבָרְכֶךָ
  choice: உன்னை ஆசீர்வதிப்பேன்
  rationale: தொடர்ந்து வரும் இறை வாக்குறுதியை நவீனத் தமிழில் தெளிவான எதிர்கால வினையாக அளிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கும் வாக்குறுதிக்கும் அடிப்படையான காரணத்தை அறிமுகப்படுத்தும் விளக்கப் பொருளை வெளிப்படுத்துகிறது.
- source_word: לְךָ וּלְזַרְעֲךָ
  choice: உனக்கும் உன் சந்ததிக்கும்
  rationale: זֶרַע என்பதன் அடிப்படைப் பொருள் ‘விதை’; இங்கு அது ஈசாக்கின் வழிவருவோரை ஒரு கூட்டுத் தொகையாகக் குறிக்கிறது. ‘சந்ததி’ அந்தக் கூட்டுப் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: אֶתֵּן
  choice: கொடுப்பேன்
  rationale: எளிய எதிர்கால இறை வாக்குறுதியை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: இந்த நாடுகள் அனைத்தையும்
  rationale: אֲרָצוֹת என்ற பன்மை வடிவம் பார்வையில் உள்ள பல நிலப்பகுதிகளைக் குறிக்கிறது. ‘நாடுகள்’ என்பது ஒருமையில் வந்த ‘நாடு’ என்பதுடனான சொற்பிணைப்பையும் காக்கிறது.
- source_word: וַהֲקִמֹתִי
  choice: நிலைநாட்டுவேன்
  rationale: קום என்பதன் ஹிஃபில் வடிவம் இங்கு முன்பு ஆணையிட்டு அளிக்கப்பட்டதை உறுதியாக நிறைவேற்றும் வகையில் நிலைபெறச் செய்வதைக் குறிக்கிறது. ‘நிலைநாட்டுவேன்’ அதன் முறையான, உடன்படிக்கை சார்ந்த கனத்தைப் பாதுகாக்கிறது.
- source_word: הַשְּׁבֻעָה אֲשֶׁר נִשְׁבַּעְתִּי
  choice: நான் ஆணையிட்டுக் கொடுத்த உறுதிமொழி
  rationale: எபிரெயத்தில் ‘ஆணை’ என்ற பெயர்ச்சொல்லும் ‘ஆணையிட்டேன்’ என்ற தொடர்புடைய வினையும் உள்ளன. தமிழில் தேவையற்ற மறுகூறலைத் தவிர்த்து, ஆணையின் solemn force-ஐ ‘ஆணையிட்டுக் கொடுத்த உறுதிமொழி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְאַבְרָהָם אָבִיךָ
  choice: உன் தந்தை ஆபிரகாமுக்கு
  rationale: ஆபிரகாமை ஈசாக்கின் தந்தையாக அடையாளப்படுத்தி, வாக்குறுதியின் தொடர்ச்சியை மூலத்திற்கேற்ப நேரடியாகக் காட்டுகிறது.
theological_decisions:
- issue: ஆபிரகாமுக்குச் செய்யப்பட்ட ஆணை எவ்வாறு தொடர்கிறது என்பதைக் கூடுதலாக விளக்காமல் மொழிபெயர்த்தல்
  choice: உறுதிமொழியை நிலைநாட்டுவேன்
  alternative: உறுதிமொழியை உறுதிப்படுத்துவேன் / நிறைவேற்றுவேன்
  rationale: மூல வினை ஆணையை ‘நிலைநாட்டுதல்’ அல்லது ‘உறுதிப்படுத்துதல்’ எனக் குறிக்க முடியும்; அது தொழில்நுட்பமான உடன்படிக்கைப் புதுப்பித்தலை வெளிப்படையாகச் சொல்லவில்லை. தேர்ந்த சொல் இறையியல் விரிவாக்கமின்றி மூலத்தின் கனத்தையும் திறந்த பொருளையும் காக்கிறது.
- issue: זֶרַע என்பதன் கூட்டுப் பொருள்
  choice: சந்ததி
  alternative: விதை / வழிவருவோர்
  rationale: இவ்வசனத்தின் உடனடிச் சூழலில் ஈசாக்கின் வழிவரும் மக்களே முதன்மையாகக் குறிக்கப்படுகின்றனர். ‘சந்ததி’ ஒருமை வடிவிலேயே கூட்டுப் பொருளைத் தாங்குவதால், தேவையின்றி பொருளைத் தனிநபருக்கோ பல தனிநபர்களுக்கோ மட்டுப்படுத்துவதில்லை.
