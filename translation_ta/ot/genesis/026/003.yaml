- from: இந்த நாட்டில் தங்கியிரு[a]. நான் உன்னோடு இருந்து உன்னை ஆசீர்வதிப்பேன். ஏனெனில், இந்த நாடுகள் அனைத்தையும் உனக்கும் உன் சந்ததிக்கும்[b] கொடுப்பேன்; உன் தந்தை ஆபிரகாமுக்கு நான் ஆணையிட்டுக் கொடுத்த உறுதிமொழியை நிலைநாட்டுவேன்[c].
  to: இந்த நாட்டில் தங்கியிரு[a]. நான் உன்னோடு இருப்பேன்; உன்னை ஆசீர்வதிப்பேன். ஏனெனில், இந்த நாடுகள் அனைத்தையும் உனக்கும் உன் சந்ததிக்கும்[b] கொடுப்பேன்; நான் உன் தந்தை ஆபிரகாமுக்குச் செய்த சத்தியத்தை நிலைநாட்டுவேன்[c].
