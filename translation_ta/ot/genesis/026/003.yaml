  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தங்கியிரு’ என்பது பொதுவாசகர்களுக்குத் தெளிவாக இருப்பதுடன், அந்நியக் குடியிருப்பின் நுண்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. ‘ஆணையிட்டுக் கொடுத்த உறுதிமொழி’ என்பது எபிரெயத்தின் ஆணை மொழியைத் துல்லியமாகவும் தமிழில் இயல்பாகவும் எடுத்துரைக்கிறது.
