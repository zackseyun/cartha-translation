base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/033.yaml
  text: And he called it Shibah[a]; therefore the name of the city is Beersheba to this day.
translation:
  language: ta
  text: அவன் அதற்கு ஷிபா[a] என்று பெயரிட்டான். ஆகவே, அந்த நகரத்தின் பெயர் இன்றுவரை பெயேர்ஷெபா என்று உள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஷிபா” என்பது “ஏழு” என்பதற்கான எபிரெயச் சொல்லைப் போல் ஒலிக்கிறது; “பெயேர்ஷெபா” என்ற பெயரிலுள்ள சொல்விளையாட்டுடனும் தொடர்புடையது. “பெயேர்ஷெபா” என்பதற்கு “ஏழின் கிணறு” அல்லது “சத்தியத்தின் கிணறு” என்று பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֹתָהּ
  choice: அவன் அதற்கு … என்று பெயரிட்டான்
  rationale: கிணற்றை ஒரு பெயரால் அழைக்கும் சூழலில் קרא என்பதற்கு இயல்பான நவீனத் தமிழ் ‘பெயரிட்டான்’; பெண்பால் ஒருமைச் சுட்டுப்பெயர் தமிழில் உயிரற்ற கிணற்றைக் குறிக்கும் ‘அதற்கு’ என வழங்கப்படுகிறது.
- source_word: שִׁבְעָה
  choice: சிபா
  rationale: இது கிணற்றுக்கு இடப்பட்ட பெயராக இருப்பதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது; ‘ஏழு’ மற்றும் ‘ஆணை’ தொடர்பான எபிரெயச் சொல்விளையாட்டு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עַל כֵּן
  choice: ஆகவே
  rationale: பெயரிடுதலுக்கும் நகரத்தின் பெயருக்கும் இடையிலான காரணத் தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: שֵׁם הָעִיר
  choice: அந்த நகரத்தின் பெயர்
  rationale: எபிரெயக் கட்டமைப்பின் பொருளைப் பாதுகாத்து, முன் அறியப்பட்ட நகரைக் குறிக்கத் தமிழில் இயல்பான சுட்டுச் சொல்லைப் பயன்படுத்துகிறது.
- source_word: בְּאֵר שֶׁבַע
  choice: பெயெர்செபா
  rationale: நிலையான வேதாகம இடப்பெயராக ஒலிபெயர்க்கப்பட்டது; பெயரின் இருபொருள் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை
  rationale: எபிரெய காலக் குறிப்பின் சுருக்கமான, இயல்பான நவீனத் தமிழ் வடிவம்.
theological_decisions:
- issue: שִׁבְעָה மற்றும் בְּאֵר שֶׁבַע ஆகிய பெயர்களிலுள்ள சொல்விளையாட்டு
  choice: முதன்மை உரையில் பெயர்களை ஒலிபெயர்த்து, ‘ஏழு/ஆணை’ என்ற பொருள் தொடர்பை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: சிபாவை ‘ஏழு’ அல்லது ‘ஆணை’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: ஒரே பொருளைத் தேர்ந்தெடுப்பது எபிரெய மூலத்தின் திட்டமிட்ட பன்முகச் சொல்லுறவைச் சுருக்கிவிடும்; ஒலிபெயர்ப்பும் அடிக்குறிப்பும் உண்மையான தெளிவின்மையைப் பாதுகாக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்களின் ஒலிவடிவம் பிரதான உரையில் வைக்கப்பட்டு, மூலமொழியின் சொல்விளையாட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
