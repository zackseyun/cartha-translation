  text: וַ/יִּקְרַ֤ע יַעֲקֹב֙ שִׂמְלֹתָ֔י/ו וַ/יָּ֥שֶׂם שַׂ֖ק בְּ/מָתְנָ֑י/ו וַ/יִּתְאַבֵּ֥ל עַל בְּנ֖/וֹ יָמִ֥ים רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/034.yaml
  text: Then Jacob tore his clothes[a], put sackcloth around his waist, and mourned for his son many days.
translation:
  language: ta
  text: அப்போது யாக்கோபு தன் உடைகளைக் கிழித்து, தன் இடுப்பைச் சுற்றிச் சாக்குத்துணியைக் கட்டிக்கொண்டு[a], தன் மகனுக்காகப் பல நாட்கள் துக்கம் அனுசரித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் இடுப்பு அல்லது அரைப் பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַע
  choice: கிழித்து
  rationale: קרע என்பது துக்கத்தின் அடையாளமாக உடைகளைக் கிழிக்கும் செயலைக் குறிக்கிறது; ‘கிழித்து’ என்பது நேரடியான, இயல்பான நவீனத் தமிழ்.
- source_word: שִׂמְלֹתָיו
  choice: தன் உடைகளை
  rationale: שִׂמְלָה பொதுவாக உடை அல்லது ஆடையைக் குறிக்கிறது. ‘உடைகள்’ என்பது குறிப்பிட்ட ஓர் ஆடை வகையைத் தேவையின்றி ஊகிக்காமல் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: שַׂק
  choice: சாக்குத்துணி
  rationale: שַׂק என்பது துக்கத்தின்போது அணியப்பட்ட முரட்டுத் துணியைக் குறிக்கிறது. ‘சாக்குத்துணி’ அதன் பண்பாட்டு அடையாளத்தையும் வேதாகம இலக்கியத் தொனியையும் காக்கிறது.
- source_word: בְּמָתְנָיו
  choice: தன் இடுப்பைச் சுற்றி
  rationale: מָתְנַיִם இடுப்பு அல்லது அரைப் பகுதியைக் குறிக்கிறது. ‘இடுப்பைச் சுற்றி’ என்பது நவீனத் தமிழில் இயல்பாகவும் உடலமைப்பிடத்தைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: וַיִּתְאַבֵּל
  choice: துக்கம் அனுசரித்தான்
  rationale: אבל என்பதன் இந்த வடிவம் வெறும் மனவருத்தத்தை மட்டுமல்ல, மரணத்துக்குரிய துக்கநிலையையும் அதனுடன் தொடர்புடைய வழக்கங்களையும் குறிக்கிறது; ‘துக்கம் அனுசரித்தான்’ அந்த முறையான துக்க உணர்வைப் பாதுகாக்கிறது.
- source_word: עַל־בְּנוֹ
  choice: தன் மகனுக்காக
  rationale: துக்கம் குறிக்கும் வினையுடன் עַל இங்கு ‘ஒருவருக்காக’ அல்லது ‘ஒருவரைக் குறித்து’ என்ற பொருளைத் தருகிறது; ‘தன் மகனுக்காக’ இயல்பான தமிழாகும்.
- source_word: יָמִים רַבִּים
  choice: பல நாட்கள்
  rationale: இந்தச் சொற்றொடரின் நேரடிப் பொருள் ‘பல நாட்கள்’; தமிழிலும் அது காலநீட்சியை இயல்பாக வெளிப்படுத்துகிறது.
