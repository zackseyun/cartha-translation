id: GEN.37.15
reference: Genesis 37:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּמְצָאֵ֣/הוּ אִ֔ישׁ וְ/הִנֵּ֥ה תֹעֶ֖ה בַּ/שָּׂדֶ֑ה וַ/יִּשְׁאָלֵ֧/הוּ הָ/אִ֛ישׁ לֵ/אמֹ֖ר מַה תְּבַקֵּֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/015.yaml
  text: A man found him[a], and behold, he was wandering in the field. The man asked him, saying, “What are you seeking?”
translation:
  language: ta
  text: ஒரு மனிதன் அவனைக் கண்டான்; இதோ, அவன் வயல்வெளியில் அலைந்து கொண்டிருந்தான். அந்த மனிதன் அவனிடம், “நீ எதைத் தேடுகிறாய்?” என்று கேட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצָאֵהוּ
  choice: அவனைக் கண்டான்
  rationale: מצא என்பதன் கால் வடிவம் இங்கு ‘கண்டுபிடித்தல்/காணுதல்’ என்று பொருள்படுகிறது; ‘அவனைக் கண்டான்’ என்பது நேரடியும் இயல்புமான தமிழாக்கம்.
- source_word: אִישׁ
  choice: ஒரு மனிதன்
  rationale: אישׁ இங்கு குறிப்பிட்ட ஓர் ஆண் நபரைக் குறிக்கிறது; ‘ஒரு மனிதன்’ அதன் ஒருமையையும் மனித நபர் என்ற பொருளையும் காக்கிறது.
- source_word: וְהִנֵּה
  choice: தனி வார்த்தையாக மொழிபெயர்க்காமல் காட்சியின் திடீர் நிலையை வாக்கிய அமைப்பில் வெளிப்படுத்துதல்
  rationale: הנה கவனத்தை ஈர்க்கும் கதைசொல்லல் இடைச்சொல். தமிழில் ‘இதோ’ எனச் சேர்ப்பது இவ்விடத்தில் செயற்கையாக ஒலிக்கக்கூடும்; அடுத்த நிலைவர்ணனையை நேரடியாகத் தருவது அதன் உரையாடல் விளைவை இயல்பாகக் கொண்டுவருகிறது.
- source_word: תֹעֶה
  choice: வழிதவறி அலைந்துகொண்டிருந்தான்
  rationale: תעה என்பது வழிதவறுதல் அல்லது அலைதலைக் குறிக்கிறது. இரு நுண்பொருள்களையும் சேர்த்த இந்தத் தொடர், யோசேப்பு நகர்ந்துகொண்டிருந்ததையும் திசை தெரியாமல் இருந்ததையும் அளவுக்கு மீறாமல் தெரிவிக்கிறது.
- source_word: בַּשָּׂדֶה
  choice: வயல்வெளியில்
  rationale: שדה என்பது வயல் அல்லது திறந்த வெளிநிலத்தைக் குறிக்கும்; சூழலில் ‘வயல்வெளியில்’ இயல்பாகவும் போதிய பரப்புடையதாகவும் உள்ளது.
- source_word: וַיִּשְׁאָלֵהוּ
  choice: அவனிடம் ... கேட்டான்
  rationale: שאל என்பதன் எளிய பொருள் ‘கேட்பது’; தமிழில் கேள்வி கேட்கப்படும் நபரை ‘அவனிடம்’ என்று குறித்தல் இயல்பு.
- source_word: לֵאמֹר
  choice: என்று
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் לאמר சூத்திரத்திற்கு, நவீன தமிழில் ‘என்று கேட்டான்’ என்பது இயல்பான இணை.
- source_word: מַה תְּבַקֵּשׁ
  choice: நீ எதைத் தேடுகிறாய்?
  rationale: בקש என்பதன் ‘தேடு’ என்ற செயற்பொருளையும் தொடரும் நிகழ்காலச் செயலையும் நேரடியாகக் காக்கிறது.
