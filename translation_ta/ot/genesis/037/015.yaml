translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய மொழியின் தொடர்ச்சியான வாக்கிய அமைப்பு தமிழின் இயல்புக்கேற்ப பிரிக்கப்பட்டுள்ளது; எந்த சமயப்பிரிவு சார்ந்த விளக்கமும் சேர்க்கப்படவில்லை.
