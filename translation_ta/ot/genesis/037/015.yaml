revisions:
- from: ஒரு மனிதன் அவனைக் கண்டான்; அவன் வயல்வெளியில் வழிதவறி அலைந்துகொண்டிருந்தான். அந்த மனிதன் அவனிடம், “நீ எதைத் தேடுகிறாய்?” என்று கேட்டான்.
  to: ஒரு மனிதன் அவனைக் கண்டான்; இதோ, அவன் வயல்வெளியில் அலைந்து கொண்டிருந்தான். அந்த மனிதன் அவனிடம், “நீ எதைத் தேடுகிறாய்?” என்று கேட்டான்.
