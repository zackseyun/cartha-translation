translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்கள் கையிலிருந்து’ என்ற எபிரெய உருவகம் இயல்பாகப் பேணப்பட்டுள்ளது; இறுதிக் கூற்றின் மரபுத்தொடருக்கான மாற்று மொழிபெயர்ப்பும் சொற்பொருளும் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளன.
