base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/021.yaml
  text: But when Reuben heard it[a], he rescued him from their hand and said, “Let us not take his life.”
translation:
  language: ta
  text: ஆனால் ரூபன் இதைக் கேட்டபோது, அவனை அவர்கள் கையிலிருந்து காப்பாற்றி, “நாம் அவன் உயிரைப் பறிக்க வேண்டாம்”[a] என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாம் அவனைக் கொல்ல வேண்டாம்.” எபிரெயத்தில் சொல்லுக்குச் சொல், “உயிரைப் பொறுத்தவரை அவனை அடிக்க வேண்டாம்”; இது உயிரைப் போக்கும் அடி கொடுப்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: இதைக் கேட்டபோது
  rationale: שׁמע என்பதன் அடிப்படைப் பொருள் ‘கேள்’. முந்தைய வசனத்தில் சகோதரர்கள் கூறியதை இது சுட்டுவதால், தமிழில் இயல்பாக அமைய ‘இதை’ சேர்க்கப்பட்டது; தொடர்ச்சியான கதைநிகழ்வின் கால உறவை ‘கேட்டபோது’ வெளிப்படுத்துகிறது.
- source_word: רְאוּבֵן
  choice: ரூபன்
  rationale: தனிப்பெயர் நவீனத் தமிழில் நிலைபெற்ற வடிவில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיַּצִּלֵהוּ
  choice: அவனை ... காப்பாற்றி
  rationale: Hiphil வடிவிலுள்ள נצל ஆபத்திலிருந்து மீட்பதை அல்லது காப்பாற்றுவதைக் குறிக்கிறது. ‘காப்பாற்றி’ என்பது சூழலுக்கு ஏற்ற இயல்பான தமிழ்ச் சொல்.
- source_word: מִיָּדָם
  choice: அவர்கள் கையிலிருந்து
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் தெளிவாகப் பேணுகிறது.
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: நேர்க்கூற்றை அறிமுகப்படுத்தும் இயல்பான தமிழ் கதைநடை வடிவம்.
- source_word: לֹא נַכֶּנּוּ נָפֶשׁ
  choice: நாம் அவன் உயிரைப் பறிக்க வேண்டாம்
  rationale: נכה ‘அடி/தாக்கு’ என்றும் נֶפֶשׁ ‘உயிர்’ என்றும் பொருள்படும்; இரண்டும் சேர்ந்த இம்மரபுத்தொடர் உயிரைப் போக்கும் தாக்குதலைக் குறிக்கிறது. தமிழ் மொழிபெயர்ப்பு அதன் நோக்கத்தை இயல்பாகச் சொல்கிறது; சொற்படிமம் அடிக்குறிப்பில் தரப்படுகிறது.
