  text: וַֽ/יְשַׁלְּח֞וּ אֶת כְּתֹ֣נֶת הַ/פַּסִּ֗ים וַ/יָּבִ֨יאוּ֙ אֶל אֲבִי/הֶ֔ם וַ/יֹּאמְר֖וּ זֹ֣את מָצָ֑אנוּ הַכֶּר נָ֗א הַ/כְּתֹ֧נֶת בִּנְ/ךָ֛ הִ֖וא אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/032.yaml
  text: Then they sent the robe with long sleeves and brought it to their father[a], and said, “We found this[b]. Please identify whether it is your son's robe or not.”
translation:
  language: ta
  text: பின்பு அவர்கள் நீண்ட கையுடைய அந்த அங்கியை[a] அனுப்பினார்கள்; அதைத் தங்கள் தந்தையிடம் கொண்டுவந்து, “இதை நாங்கள் கண்டெடுத்தோம். இது உங்கள் மகனுடைய அங்கியா இல்லையா என்று தயவுசெய்து அடையாளம் காணுங்கள்[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அலங்காரமான அங்கி,” “செழுமையாக அலங்கரிக்கப்பட்ட அங்கி”; பாரம்பரியமாக, “பல வண்ண அங்கி.” இதற்கான எபிரெயச் சொற்றொடரின் பொருள் உறுதியற்றது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “அறிந்துகொள்ளுங்கள்.” அடையாளம் காண்பதும் தவறாக அடையாளம் காண்பதும் இந்த விரிவான கதையில் மீண்டும் மீண்டும் வருவதால், இங்குள்ள சொல் குறிப்பிடத்தக்கது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: அனுப்பி
  rationale: שׁלח என்பதன் இயல்பான பொருளான ‘அனுப்பு’ என்பதையும், தொடர் நிகழ்வைக் காட்டும் எபிரெயக் கதைநடையையும் சுருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: நீண்ட கைகளுள்ள அந்த அங்கி
  rationale: כְּתֹנֶת என்பது அங்கி போன்ற உடை. פַּסִּים என்பதன் பொருள் உறுதியற்றது; அது உள்ளங்கை அல்லது உள்ளங்கால் வரை நீளும் உடையைக் குறிக்கலாம். பாரம்பரியமான ‘பல வண்ண அங்கி’ என்பதை ஆதாரமின்றி முதன்மை உரையில் புகுத்தாமல், சாத்தியமான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיָּבִיאוּ אֶל אֲבִיהֶם
  choice: அதைத் தங்கள் தந்தையிடம் கொண்டுவந்து
  rationale: முந்தைய அங்கியே மறைமுகச் செயப்படுபொருள் என்பதால் தமிழில் ‘அதை’ சேர்க்கப்பட்டுள்ளது. ‘தங்கள் தந்தை’ என்பது எபிரெய உரையிலுள்ள உறவுமுறையை அப்படியே காக்கிறது.
- source_word: זֹאת מָצָאנוּ
  choice: இதை நாங்கள் கண்டெடுத்தோம்
  rationale: சகோதரர்களின் திட்டமிட்ட, எளிமையாகத் தோன்றும் கூற்றைப் பாதுகாக்கிறது. ‘கண்டெடுத்தோம்’ என்பது கிடந்த பொருளைக் கண்டதாக அவர்கள் கூறுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַכֶּר נָא
  choice: தயவுசெய்து அடையாளம் காணுங்கள்
  rationale: נכר என்பதன் ஹிஃபில் வடிவம் ‘அடையாளம் காணுதல்/இன்னதென்று அறிதல்’ எனப் பொருள்படும். נָא-வின் பணிவான வேண்டுகோளை ‘தயவுசெய்து’ வெளிப்படுத்துகிறது; மேலும் கதையில் மீண்டும் வரும் அறிதல்–தவறாக அறிதல் என்ற சொல்லொலியையும் ஓரளவு காக்கிறது.
- source_word: הַכְּתֹנֶת בִּנְךָ הִוא אִם לֹא
  choice: இது உங்கள் மகனுடைய அங்கியா இல்லையா என்று
  rationale: אם לא அமைப்பிலுள்ள ‘...ஆ இல்லையா’ என்ற மறைமுகக் கேள்வியை இயல்பான தமிழில் தருகிறது. சகோதரர்கள் யோசேப்பை ‘உங்கள் மகன்’ என்று விலக்கிப் பேசுவதை மாற்றாமல் காக்கிறது.
