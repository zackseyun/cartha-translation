translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் தொடர்ச்சியான ‘அனுப்பி—கொண்டுவந்து—என்றார்கள்’ அமைப்பு இயன்றவரை காக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
