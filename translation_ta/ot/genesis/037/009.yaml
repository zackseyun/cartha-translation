base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/009.yaml
  text: 'Then he dreamed another dream and told it to his brothers[a], and said, “Look, I have dreamed another dream: the sun, the moon, and eleven stars were bowing down to me.”'
translation:
  language: ta
  text: பின்பு அவன் வேறொரு கனவு கண்டான்; அதைத் தன் சகோதரர்களிடம் சொன்னான். அவன், “இதோ, நான் இன்னொரு கனவு கண்டேன். அதில் சூரியனும் சந்திரனும் பதினொரு நட்சத்திரங்களும் எனக்குப் பணிந்துகொண்டிருந்தன[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்கு முன்பாகத் தரையில் விழுந்து வணங்கிக்கொண்டிருந்தன.” எபிரேய வினை ஆழமாகப் பணிந்து மரியாதை செலுத்துவதைக் குறிக்கலாம்; இங்கு அது தெய்வ வழிபாட்டை அல்ல, மரியாதையுடனான பணிவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹם עוֹד חֲלוֹם אַחֵר
  choice: பின்பு அவன் வேறொரு கனவு கண்டு
  rationale: Wayyiqtol தொடரும் கதைநிகழ்வை முன்னேற்றுவதால் ‘பின்பு’ இயல்பான தமிழில் வரிசையை உணர்த்துகிறது. עוֹד மற்றும் אַחֵר இணைந்து மீண்டும் வேறொரு கனவு என்பதைக் காட்டுகின்றன.
- source_word: וַיְסַפֵּר אֹתוֹ לְאֶחָיו
  choice: அதைத் தன் சகோதரர்களிடம் சொன்னான்
  rationale: סִפֵּר என்பதன் ‘சொல்/விவரி’ என்ற பொதுப் பொருளை எளிய, நவீன தமிழில் தருகிறது; לְ இங்கு செய்தி பெறுபவர்களைச் சுட்டுகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரேய உரையாடல் இடைச்சொல்லின் சுட்டும் வலிமையை, பழமையாக்காமல் dignified modern Tamil-இல் காக்கிறது.
- source_word: חָלַמְתִּי חֲלוֹם עוֹד
  choice: நான் இன்னொரு கனவு கண்டேன்
  rationale: எபிரேய cognate construction-ஐ தமிழின் இயல்பான ‘கனவு கண்டேன்’ என்ற சொற்றொடரில் வழங்கி, עוֹד-இன் மீள்நிகழ்வை ‘இன்னொரு’ எனக் காக்கிறது.
- source_word: וְהִנֵּה הַשֶּׁמֶשׁ וְהַיָּרֵחַ וְאַחַד עָשָׂר כּוֹכָבִים
  choice: அதில் சூரியனும் சந்திரனும் பதினொரு நட்சத்திரங்களும்
  rationale: இரண்டாவது הִנֵּה கனவுக் காட்சியை அறிமுகப்படுத்துகிறது; தமிழில் ‘அதில்’ என்று வழங்குவது காட்சித் தொடர்பை இயல்பாகத் தெளிவாக்குகிறது. இணைப்புச் சொற்களின் தொடர்ச்சி ‘-உம்’ மூலம் பிரதிபலிக்கப்படுகிறது.
- source_word: מִשְׁתַּחֲוִים לִי
  choice: என்னை வணங்கிக்கொண்டிருந்தன
  rationale: Hitpael participle கனவுக்காட்சிக்குள் நடந்துகொண்டிருந்த செயலைக் காட்டுவதால் தொடர்நிலை வினை பயன்படுத்தப்படுகிறது. ‘வணங்கு’ இங்கு பணிந்து மரியாதை செலுத்துதல் என்ற சூழல்சார் பொருளைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
theological_decisions:
- issue: מִשְׁתַּחֲוִים என்பதன் பொருள்
  choice: என்னை வணங்கிக்கொண்டிருந்தன—குடும்ப அதிகாரத்திற்கு முன் பணிந்து மரியாதை செலுத்துதல்
  alternative: எனக்கு முன்பாகத் தரையில் விழுந்து பணிந்துகொண்டிருந்தன; என்னை வழிபட்டுக்கொண்டிருந்தன
  rationale: உடனடி கதைச்சூழலும் பின்னர் சகோதரர்கள் யோசேப்புக்கு முன் பணிவதும் தெய்வ வழிபாட்டை அல்ல, மரியாதையுடனான கீழ்ப்படிதலைக் குறிக்கின்றன. ‘வழிபடு’ என்று மொழிபெயர்ப்பது இங்கு இல்லாத தெய்வீகக் கூற்றை இறக்குமதி செய்யக்கூடும்; ‘வணங்கு’ மூலச்சொல்லின் பரந்த பொருள் வாய்ப்பை வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் இணைந்த கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சகோதரர்கள்’, ‘சந்திரன்’ ஆகியவை பொதுவாகப் புரியும் உயர்நடைச் சொற்கள். நேரடி உரையில் ‘இதோ’ மூலத்தின் கவன ஈர்ப்பைத் தக்கவைக்கிறது; எபிரேயத்தில் மீண்டும் வரும் இரண்டாவது הִנֵּה தமிழின் இயல்புக்காக ‘அதில்’ எனக் காட்சியோடு இணைக்கப்பட்டுள்ளது.
