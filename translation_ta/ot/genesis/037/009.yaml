  source_fidelity: மூல எபிரேயத்தின் கதைத் தொடர்ச்சி, ‘மற்றொரு கனவு’ என்ற மீள்நிகழ்வு, சகோதரர்களிடம் சொல்லுதல், சூரியன்–சந்திரன்–பதினொரு நட்சத்திரங்கள் என்ற காட்சிக்கூறுகள் ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ஆனால் ‘என்னை வணங்கிக்கொண்டிருந்தன’ என்பது நவீன தமிழில் தெய்வ வழிபாட்டை முதன்மையாக உணர்த்தக்கூடியதால், מִשְׁתַּחֲוִים לִי என்பதன் இச்சூழலிலுள்ள பணிவு/மரியாதை பொருளைத் தெளிவாகத் தர ‘எனக்குப் பணிந்துகொண்டிருந்தன’ என மாற்றுதல் பாதுகாப்பானது.
