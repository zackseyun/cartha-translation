base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/027.yaml
  text: Come[a], let us sell him to the Ishmaelites, and let not our hand be upon him, for he is our brother[c][b], our own flesh.” And his brothers listened.
translation:
  language: ta
  text: “வாருங்கள், அவனை இஸ்மவேலரிடம் விற்றுவிடுவோம். நம் கை அவன்மேல் பட வேண்டாம்[a]. ஏனெனில், அவன் நம் சகோதரன்; நம் சொந்தச் சதையானவன்[b].” அவனுடைய சகோதரர்கள் செவிகொடுத்தார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில், “நம் கை அவன்மேல் இருக்க வேண்டாம்”; அவனை நாமே நேரடியாகத் தாக்கவோ கொல்லவோ வேண்டாம் என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நம் சொந்த உறவினன்.”
    reason: lexical_alternative
  - marker: c
    text: “செவிகொடுத்தார்கள்” என்பதை இச்சூழலில் “ஒப்புக்கொண்டார்கள்” அல்லது “அவன் சொன்னபடி நடந்தார்கள்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: வாருங்கள்
  rationale: הלך என்பதன் பன்மை ஏவல் வடிவம் இங்கு ஒரு செயலை முன்மொழிந்து மற்றவர்களைத் தூண்டும் சொல்லாக வருகிறது; நவீனத் தமிழில் ‘வாருங்கள்’ இயல்பாக அந்த வலியுறுத்தலைத் தருகிறது.
- source_word: וְנִמְכְּרֶנּוּ
  choice: அவனை ... விற்றுவிடுவோம்
  rationale: முதல் நபர் பன்மை விருப்ப/தூண்டுதல் பொருளைத் தருவதால், ‘விற்றுவிடுவோம்’ என்பது யூதா முன்வைக்கும் திட்டத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַיִּשְׁמְעֵאלִים
  choice: இஸ்மவேலரிடம்
  rationale: மக்கள் இனப்பெயரையும் அவர்களிடம் விற்பதையும் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: וְיָדֵנוּ אַל תְּהִי בוֹ
  choice: நம் கை அவன்மேல் பட வேண்டாம்
  rationale: ‘நம் கை அவன்மேல் இருக்க வேண்டாம்’ என்ற எபிரேய உருவகத்தைத் தக்கவைத்தபடியே, அவனை நேரடியாகத் தாக்காமலிருப்பது என்ற பொருளைத் தமிழில் இயல்பாக உணர்த்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: யூதாவின் முன்மொழிவுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: אָחִינוּ
  choice: நம் சகோதரன்
  rationale: மூலத்தின் நேரடியான உறவுமுறைச் சொல்லைத் தக்கவைக்கிறது.
- source_word: בְשָׂרֵנוּ
  choice: நம் சொந்தச் சதை
  rationale: இரத்த உறவைக் குறிக்கும் concrete Hebrew expression-ஐ ‘உறவினன்’ என்று பொதுமைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: וַיִּשְׁמְעוּ אֶחָיו
  choice: அவன் சகோதரர்கள் அவன் பேச்சுக்குச் செவிகொடுத்தார்கள்
  rationale: שמע என்பதிலுள்ள கேட்டல், கவனித்தல், ஏற்றுக்கொள்ளுதல் ஆகிய பொருள் வாய்ப்புகளை ‘செவிகொடுத்தார்கள்’ இயன்றவரை திறந்தே வைக்கிறது; தமிழில் தெளிவுக்காக ‘அவன் பேச்சுக்கு’ சேர்க்கப்பட்டுள்ளது.
