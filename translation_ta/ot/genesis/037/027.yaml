translation_notes:
  register: நவீன நிலையான தமிழில், உரையாடலுக்கேற்ற இயல்பும் வேதாகமக் கதைநடைக்கேற்ற கண்ணியமும் பேணப்பட்டுள்ளன. எபிரேய மொழியின் ‘கை’ மற்றும் ‘சதை’ உருவகங்கள் வாசிப்புக்கு இடையூறு இல்லாத அளவில் தக்கவைக்கப்பட்டுள்ளன. மூலத்தில் நேரடி உரைக்குப் பின் பேச்சாளரைச் சுட்டும் வினை இல்லாவிட்டாலும், தமிழ் மேற்கோள் அமைப்பை நிறைவு செய்யவும் முந்தைய சூழலில் பேசுபவர் யூதா என்பதை இயல்பாகக் காட்டவும் ‘என்றான்’ பயன்படுத்தப்பட்டுள்ளது.
