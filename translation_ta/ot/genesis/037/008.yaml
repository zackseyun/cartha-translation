base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/008.yaml
  text: His brothers said to him, “Will you really reign over us? Will you really rule over us?” So they hated him even more because of his dreams and because of his words.
translation:
  language: ta
  text: அவனுடைய சகோதரர்கள் அவனிடம், “நீ உண்மையாகவே எங்கள்மேல் அரசாளப் போகிறாயா? நீ உண்மையாகவே எங்களை ஆளப் போகிறாயா?” என்று சொன்னார்கள். அவனுடைய கனவுகளாலும் அவனுடைய வார்த்தைகளாலும் அவர்கள் அவனை இன்னும் அதிகமாக வெறுத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲמָלֹךְ תִּמְלֹךְ
  choice: நீ உண்மையாகவே எங்கள்மேல் அரசாளப் போகிறாயா?
  rationale: ஒரே வேர்ச்சொல்லின் infinitive absolute + finite verb அமைப்பு தரும் வலியுறுத்தலை ‘உண்மையாகவே’ என்று இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘அரசாளுதல்’ அரச பதவிசார் நுணுக்கத்தைக் காக்கிறது.
- source_word: מָשׁוֹל תִּמְשֹׁל
  choice: நீ உண்மையாகவே எங்களை ஆளப் போகிறாயா?
  rationale: மீண்டும் வரும் வலியுறுத்தலைக் காக்கிறது; משׁל என்பதன் பரந்த ஆட்சிசெய்தல்/அதிகாரம் செலுத்துதல் பொருளை ‘ஆளுதல்’ எனத் தருகிறது.
- source_word: עַל חֲלֹמֹתָיו וְעַל דְּבָרָיו
  choice: அவனுடைய கனவுகளாலும் அவனுடைய வார்த்தைகளாலும்
  rationale: עַל இங்கு காரணத்தைக் குறிக்கிறது. இரண்டு காரணங்களையும் தனித்தனியாகக் குறிப்பிடும் எபிரெய இணைப்பைத் தமிழில் இணையான வடிவில் காக்கிறது.
theological_decisions:
- issue: யோசேப்பின் எதிர்கால ஆட்சியை சகோதரர்கள் கேள்வியாக முன்வைப்பதன் தொனி
  choice: இரண்டு வலியுறுத்தப்பட்ட கேள்விகளாகவே வைத்தல்
  alternative: உறுதியான மறுப்பாக அல்லது தீர்க்கதரிசன நிறைவேற்றத்தின் நேரடி அறிவிப்பாக மொழிபெயர்த்தல்
  rationale: எபிரெய உரை கேள்வி வடிவத்தையும் கேலி/எதிர்ப்புத் தொனியையும் தருகிறது; பின்னர் நிகழப்போவதை இவ்வசனத்திலேயே வெளிப்படையாகத் தீர்மானிக்காமல் அதன் இலக்கிய இறுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியக்கூடிய, கண்ணியமான நடை. ‘அரசாளுதல்’ மற்றும் ‘ஆளுதல்’ ஆகிய வேறுபட்ட சொற்கள் எபிரெய மூலத்திலுள்ள מלך / משׁל வேறுபாட்டை இயன்ற அளவு காக்கின்றன.
