base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/035.yaml
  text: Then all his sons and all his daughters rose up to comfort him[a], but he refused to be comforted and said, “For I will go down to Sheol to my son[b], mourning.” So his father wept for him.
translation:
  language: ta
  text: அவனுடைய எல்லா மகன்களும் எல்லா மகள்களும் அவனுக்கு ஆறுதல் சொல்ல எழுந்தார்கள். ஆனால் அவன் ஆறுதல் அடைய மறுத்து, “நான் துக்கத்தோடு ஷியோலுக்கு, என் மகனிடம், இறங்கிச் செல்வேன்[a]” என்றான். இவ்வாறு அவனுடைய தந்தை அவனுக்காக அழுதான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஷியோல்” என்பது எபிரெயச் சொல்; இது இறந்தோரின் உலகம் அல்லது “கல்லறை” என்றும் மொழிபெயர்க்கப்படலாம். எபிரெயத்தில் “என் மகனிடம்,” “துக்கத்தோடு,” “ஷியோலுக்கு” என்பவற்றின் தொடர்பு சுருக்கமாகவும் ஓரளவு திறந்ததாகவும் உள்ளது.
    reason: lexical_alternative_and_structural_ambiguity
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: எழுந்தார்கள்
  rationale: קום என்பதன் வழக்கமான கதைநடைப் பொருளான ‘எழுதல்’ என்பதை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: כָל בָּנָיו וְכָל בְּנֹתָיו
  choice: அவனுடைய மகன்கள் அனைவரும் மகள்கள் அனைவரும்
  rationale: எபிரெயம் மகன்களையும் மகள்களையும் தனித்தனியாகக் குறிப்பிடுவதால் அந்த வேறுபாடு பாதுகாக்கப்படுகிறது.
- source_word: לְנַחֲמוֹ
  choice: அவனுக்கு ஆறுதல் சொல்ல
  rationale: துக்கத்தில் இருப்பவரைத் தேற்ற முயல்வதைக் குறிக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: וַיְמָאֵן לְהִתְנַחֵם
  choice: அவன் ஆறுதல் அடைய மறுத்து
  rationale: மறுப்பையும், נחם என்பதன் இங்கு வரும் பெறுநிலை/தற்சுட்டுப் பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: אֵרֵד
  choice: நான் ... போவேன்
  rationale: தமிழில் இலக்கை நோக்கிச் செல்லுதல் இயல்பாக ‘போவேன்’ என அமைகிறது; கீழிறங்கும் எபிரெய உருவகம் ‘பாதாளம்’ என்ற இலக்குச் சொல்லிலும் பிரதிபலிக்கிறது.
- source_word: אֶל־בְּנִי
  choice: என் மகனிடம்
  rationale: ‘என் மகனை நோக்கி/என் மகனிடம்’ என்ற எபிரெய முன்னிடைச்சொல்லின் நேரடியான உறவை கூடுதல் விளக்கமின்றிப் பாதுகாக்கிறது.
- source_word: אָבֵל
  choice: துக்கத்தோடு
  rationale: துக்கமுற்ற நிலையில் செல்வதைக் குறிக்கும் இயல்பான வினையடைத் தொடர்.
- source_word: שְׁאֹלָה
  choice: பாதாளத்திற்கு
  rationale: שְׁאוֹל என்பதைக் கல்லறை என்று மட்டும் சுருக்காமல், இறந்தோரின் உலகைக் குறிக்கும் பாரம்பரியமான, புரிந்துகொள்ளத்தக்க தமிழ்ச் சொல்லால் தருகிறது.
- source_word: וַיֵּבְךְּ אֹתוֹ אָבִיו
  choice: அவனுடைய தந்தை அவனுக்காக அழுதான்
  rationale: எபிரெய வாக்கியத்தின் எழுவாய் மற்றும் செயப்படுபொருள் உறவைச் சரியாகப் பாதுகாக்கிறது; இங்கு ‘அவனுடைய தந்தை’ என்பது யோசேப்பின் தந்தையாகிய யாக்கோபைக் குறிக்கிறது.
theological_decisions:
- issue: שְׁאוֹל என்பதன் மொழிபெயர்ப்பு
  choice: பாதாளம்
  alternative: இறந்தோரின் உலகம்; கல்லறை
  rationale: இந்தச் சொல் ஒரு தனிப்பட்ட கல்லறையை மட்டும் குறிக்க வேண்டியதில்லை. ‘பாதாளம்’ இறந்தோரின் கீழுலகம் என்ற பழைய ஏற்பாட்டுக் கருத்தைத் தக்கவைத்து, பிற்கால நரகக் கோட்பாட்டை இவ்வசனத்தில் திணிக்காமல் விடுகிறது.
- issue: אֶל־בְּנִי אָבֵל שְׁאֹלָה தொடரின் தொடர்பு
  choice: “துக்கத்தோடு என் மகனிடம் பாதாளத்திற்குப் போவேன்”
  alternative: “என் மகனிடம், துக்கமுற்றவனாய், பாதாளத்திற்குப் போவேன்”
  rationale: ‘என் மகனிடம்’ என்பதையும் ‘பாதாளத்திற்கு’ என்பதையும் ஒரே இறங்குதலின் தொடர்புடைய இலக்குகளாக வைத்தபடியே, אָבֵל யாக்கோபின் துக்கநிலையைச் சுட்டுவதைத் தெளிவாக்குகிறது. எபிரெயத்தின் செறிவும் சிறிய கட்டமைப்புத் தெளிவின்மையும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையான எளிய கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆறுதல் சொல்ல/ஆறுதல் அடைய’ என்ற இணைச்சொல் மூலம் எபிரெய மூலத்தில் ஒரே வேர் மீண்டும் வருவது இயன்றவரை பிரதிபலிக்கப்படுகிறது. ‘பாதாளம்’ இங்கு தண்டனைக்குரிய நரகம் என்று விளக்கப்படாமல், ஷியோலின் பரந்த பொருளில் பயன்படுத்தப்படுகிறது.
