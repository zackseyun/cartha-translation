  yaml_path: translation/ot/genesis/037/026.yaml
  text: Then Judah said to his brothers[a], “What profit is there if we kill our brother and cover up his blood?”
translation:
  language: ta
  text: அப்போது யூதா தன் சகோதரர்களிடம், “நாம் நம் சகோதரனைக் கொன்று, அவனுடைய இரத்தத்தை மூடிமறைத்தால் நமக்கு என்ன ஆதாயம்?” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாம் நம் சகோதரனைக் கொன்று, அவனுடைய இரத்தத்தை மறைத்தால் நமக்கு என்ன இலாபம்?” எபிரெய மொழியில் “அவனுடைய இரத்தத்தை மூடுதல்” என்பது இரத்தம் சிந்தப்பட்டதை அல்லது அதற்கான பொறுப்பை மறைப்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்நிலையின் கதை நகர்த்தும் வலிமையை இயல்பான நவீனத் தமிழில் ‘அப்போது’ வெளிப்படுத்துகிறது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: אֶל אֶחָיו
  choice: தன் சகோதரர்களிடம்
  rationale: இச்சூழலில் யோசேப்பின் ஆண் உடன்பிறந்தவர்களையே எபிரெய ஆண்பால் பன்மை குறிக்கிறது.
- source_word: מַה בֶּצַע
  choice: நமக்கு என்ன ஆதாயம்?
  rationale: בֶּצַע என்பது இலாபம், ஆதாயம் அல்லது சுயநலப் பயன் என்னும் நுண்ணுணர்வைக் கொண்டது; ‘ஆதாயம்’ யூதாவின் நடைமுறைக் கணக்கீட்டைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: כִּי נַהֲרֹג
  choice: நாம் ... கொன்று
  rationale: இங்கு כִּי வினாவுக்குரிய செயலை அறிமுகப்படுத்துகிறது; தமிழில் வினையெச்சக் கட்டமைப்பு நிபந்தனை/செயலின் விளைவை இயல்பாக இணைக்கிறது.
- source_word: אָחִינוּ
  choice: நம் சகோதரனை
  rationale: குடும்ப உறவை நேரடியாக வைத்திருப்பது வசனத்தின் அறநெறி அழுத்தத்தைப் பாதுகாக்கிறது.
- source_word: וְכִסִּינוּ אֶת דָּמוֹ
  choice: அவனுடைய இரத்தத்தை மூடிமறைப்பதால்
  rationale: ‘அவனுடைய இரத்தத்தை மூடுதல்’ என்ற எபிரெய உருவகத்தை ‘மூடிமறைத்தல்’ என இயல்பாக்கி, இரத்தச்செயலையும் அதற்கான பொறுப்பையும் மறைக்கும் பொருளைப் பாதுகாக்கிறது.
