base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/006.yaml
  text: And he said to them[a], “Please listen to this dream that I dreamed.”
translation:
  language: ta
  text: அவன் அவர்களிடம், “தயவுசெய்து, நான் கண்ட இந்தக் கனவைக் கேளுங்கள்,” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் ‘கனவு’ என்ற பெயர்ச்சொல்லும் அதே வேர் சார்ந்த ‘கனவு கண்டேன்’ என்ற வினையும் இடம்பெறுகின்றன: ‘நான் கண்ட இந்தக் கனவு.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: அவன் அவர்களிடம் … என்றான்
  rationale: வாவ் தொடர்கதை ஓட்டத்தை முன்னெடுக்கிறது; தமிழின் இயல்பான நேரடி உரை அமைப்பில் பேச்சாளரும் கேட்போரும் தெளிவாகத் தரப்படுகின்றனர்.
- source_word: שִׁמְעוּ נָא
  choice: கேளுங்கள்
  rationale: பன்மை ஏவலை மரியாதைப் பன்மை வடிவில் தருவது நவீன தமிழில் இயல்பானது. נָא அளிக்கும் மென்மையான வேண்டுகோள் நயம் ‘கேளுங்கள்’ என்ற மரியாதை வடிவிலும் சூழலிலும் வெளிப்படுகிறது; தனியாக ‘தயவுசெய்து’ சேர்ப்பது இங்கு சற்று மிகையாக ஒலிக்கலாம்.
- source_word: הַחֲלוֹם הַזֶּה
  choice: இந்தக் கனவை
  rationale: உறுப்புடன் வரும் சுட்டுப்பெயர் அமைப்பை இயல்பான தமிழில் ‘இந்தக் கனவு’ என நேரடியாகக் கொடுக்கிறது.
- source_word: אֲשֶׁר חָלָמְתִּי
  choice: நான் கண்ட
  rationale: தமிழில் ‘கனவு கண்டேன்’ என்பதே இயல்பான சொற்சேர்க்கை. எபிரெயத்தில் கனவு என்ற பெயர்ச்சொல்லும் கனவு காணுதல் என்ற வினையும் ஒரே வேர் சார்ந்தவை; தமிழில் அந்த இயல்பான இணைப்பு ‘கண்ட … கனவு’ என்பதில் தக்கவைக்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நேரடி உரை. ‘அவர்களிடம்’ என்பது யோசேப்பு தன் சகோதரர்களிடம் பேசுவதைச் சூழலின்படி குறிக்கிறது. அடிக்குறி குறியீடு முழு வாக்கியத்திற்குப் பின் வைக்கப்பட்டுள்ளது.
