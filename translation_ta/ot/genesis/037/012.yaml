translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘அவனுடைய’ என்பது முந்தைய சூழலில் யோசேப்பைக் குறிக்கிறது; மூலத்தில் பெயர் மீண்டும் சொல்லப்படாததால் மொழிபெயர்ப்பிலும் சேர்க்கப்படவில்லை. ‘மேய்க்கச் சென்றார்கள்’ என்ற சொற்றொடர் நோக்கத்தையும் நிகழ்வின் தொடர்ச்சியையும் இயல்பாகத் தருகிறது.
