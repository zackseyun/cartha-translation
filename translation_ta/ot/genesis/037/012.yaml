base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/012.yaml
  text: His brothers went to pasture their father's flock at Shechem[a].
translation:
  language: ta
  text: அவனுடைய சகோதரர்கள் தங்கள் தந்தையின் மந்தையைச் சீகேமில்[a] மேய்க்கச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீகேமுக்கு அருகில்.” இங்குள்ள எபிரெய முன்னிடைச்சொல் அந்த இடத்திற்குள் இருப்பதையோ அந்த இடத்தில் அல்லது அதன் சுற்றுவட்டாரத்தில் இருப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: சென்றார்கள்
  rationale: הלך என்பதன் wayyiqtol வடிவம் கதையின் அடுத்த நிகழ்வைத் தொடர்கிறது. வெளிப்படையான ‘இப்போது’ என்ற காலச்சொல்லைச் சேர்க்காமல், இயல்பான தமிழ் இறந்தகால வினையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶחָיו
  choice: அவனுடைய சகோதரர்கள்
  rationale: சூழலில் இது யோசேப்பின் ஆண் உடன்பிறந்தவர்களைக் குறிக்கிறது; ‘சகோதரர்கள்’ மூலத்தின் பாலினத்தையும் உறவையும் துல்லியமாகக் காட்டுகிறது.
- source_word: לִרְעוֹת
  choice: மேய்க்க
  rationale: רעה இங்கு மந்தையைப் பராமரித்து மேய விடுவதைக் குறிக்கிறது. நோக்கத்தைக் காட்டும் எபிரெய infinitive வடிவம் தமிழில் ‘மேய்க்கச் சென்றார்கள்’ என்று இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: אֶת
  choice: '[நேரடிச் செயப்படுபொருள் குறியீடு; தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: אֵת definite direct object-ஐக் குறிக்கும் இலக்கணச் சொல்; தமிழில் அதற்கென தனிச் சொல் தேவையில்லை.
- source_word: צֹאן
  choice: மந்தை
  rationale: צֹאן என்பது குறிப்பாக ஆடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய சிறு கால்நடைகளின் கூட்டுப்பெயர். ‘மந்தை’ இனத்தைத் தேவையின்றிக் குறுக்காமல் இயல்பாகப் பொருளைக் கொடுக்கிறது.
- source_word: אֲבִיהֶם
  choice: தங்கள் தந்தையின்
  rationale: உடைமையைக் காட்டும் பன்மைச் சுட்டுப்பெயர் பின்னொட்டைத் தமிழ் தற்சுட்டு வடிவமான ‘தங்கள்’ தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בִּשְׁכֶם
  choice: சீகேமில்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது. בְּ என்னும் முன்னிடைச்சொல் ஓர் இடத்திற்குள் இருப்பதையோ அந்த இடத்தில் அல்லது அதன் சுற்றுவட்டாரத்தில் இருப்பதையோ குறிக்கலாம்; முதன்மை உரையில் இயல்பான ‘சீகேமில்’ பயன்படுத்தப்பட்டுள்ளது.
