  source_fidelity: 'The Tamil accurately represents the Hebrew narrative: the men have departed from the present place, the speaker reports overhearing their intention to go to Dothan, and Joseph subsequently goes after his brothers and finds them there. The cohortative ‘போவோம்’ appropriately reflects נֵלְכָה. No unwarranted interpretive detail has been added.'
