id: GEN.37.17
reference: Genesis 37:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ נָסְע֣וּ מִ/זֶּ֔ה כִּ֤י שָׁמַ֨עְתִּי֙ אֹֽמְרִ֔ים נֵלְכָ֖ה דֹּתָ֑יְנָ/ה וַ/יֵּ֤לֶךְ יוֹסֵף֙ אַחַ֣ר אֶחָ֔י/ו וַ/יִּמְצָאֵ֖/ם בְּ/דֹתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/017.yaml
  text: The man said[a], “They have moved on from here, because I heard them saying[b], ‘Let us go to Dothan.’” So Joseph went after his brothers and found them at Dothan.
translation:
  language: ta
  text: அந்த மனிதன், “அவர்கள் இங்கிருந்து புறப்பட்டுச் சென்றுவிட்டார்கள்; ஏனெனில், ‘தோத்தானுக்கு[a] போவோம்’ என்று அவர்கள் சொல்லிக்கொண்டிருந்ததை நான் கேட்டேன்[b]” என்றான். எனவே யோசேப்பு தன் சகோதரர்களைப் பின்தொடர்ந்து சென்று, தோத்தானில் அவர்களைக் கண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘தோத்தானுக்கு’ என்ற இடப்பெயர் திசையைச் சுட்டும் ஓர் இறுதியைப் பெற்றுள்ளது; சொல்லுக்கு சொல், ‘தோத்தானை நோக்கி’ எனப் பொருள்படும்.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘அவர்கள் சொன்னதை நான் கேட்டேன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסְעוּ מִזֶּה
  choice: இங்கிருந்து புறப்பட்டுச் சென்றுவிட்டார்கள்
  rationale: נסע என்பது ஓர் இடத்திலிருந்து புறப்பட்டு அடுத்த இடத்திற்குச் செல்வதைக் குறிக்கிறது. முகாமைக் கலைத்தல் என்ற சாத்தியமான பின்னணியை மிகைப்படுத்தாமல், நிறைவுற்ற நகர்வை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: மனிதன் கூறிய தகவலுக்கான காரணத்தை அறிமுகப்படுத்தும் சொல்லாக இங்கு வருகிறது.
- source_word: שָׁמַעְתִּי אֹמְרִים
  choice: அவர்கள் சொல்லிக்கொண்டிருந்ததை நான் கேட்டேன்
  rationale: ‘கேட்டேன்’ என்பதோடு வரும் எபிரெயப் பங்கேற்புவினையின் தொடர்நிலை நுட்பத்தைப் பாதுகாக்கிறது; சூழலில் மறைமுகமாகக் குறிக்கப்படுவோர் யோசேப்பின் சகோதரர்கள்.
- source_word: נֵלְכָה
  choice: போவோம்
  rationale: முதல் நபர் பன்மைக் கோஹோர்டேட்டிவின் கூட்டு முன்மொழிவு அல்லது தன்னூக்க நுட்பத்தை இயல்பான தமிழில் தருகிறது.
- source_word: דֹּתָיְנָה
  choice: தோத்தானுக்கு
  rationale: இடப்பெயருடன் சேர்ந்துள்ள திசைநோக்கி விகுதி, தோத்தானை நோக்கிய நகர்வைக் குறிக்கிறது; தமிழில் இலக்கு வேற்றுமை உருபால் இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: אַחַר אֶחָיו
  choice: தன் சகோதரர்களைப் பின்தொடர்ந்து
  rationale: அவர்களுக்குப் பின்னால் தொடர்ந்து செல்வதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; வேட்டையாடுதல் போன்ற தேவையற்ற தீவிரத்தைச் சேர்ப்பதில்லை.
- source_word: וַיִּמְצָאֵם
  choice: அவர்களைக் கண்டான்
  rationale: מצא என்பதன் நேரடியான கதைநடைப் பொருளை எளிய நவீன தமிழில் தருகிறது.
- source_word: בְּדֹתָן
  choice: தோத்தானில்
  rationale: சகோதரர்கள் கண்டுபிடிக்கப்பட்ட இடத்தைத் தமிழின் இடவேற்றுமை வடிவில் இயல்பாகக் குறிக்கிறது.
