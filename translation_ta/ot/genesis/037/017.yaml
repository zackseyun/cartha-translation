translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கதைநடையின் காரணத் தொடர்பும் தொடர்ச்சியும் காக்கப்பட்டுள்ளன; அதேவேளை வாக்கிய அமைப்பு சாதாரண வாசகர்களுக்குத் தெளிவாக உள்ளது. ‘தோத்தான்’ என்பது எபிரெய உச்சரிப்பை நெருங்கிய தமிழாக்கம்.
