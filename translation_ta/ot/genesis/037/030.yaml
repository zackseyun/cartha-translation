base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/030.yaml
  text: He returned to his brothers and said[a], “The boy is gone, and I—where shall I go?”
translation:
  language: ta
  text: அவன் தன் சகோதரர்களிடம் திரும்பி வந்து, “அந்தப் பையன் அங்கே இல்லை[a]; நானோ—நான் எங்கே போவேன்?” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அந்தப் பையன் இல்லை; நானோ—நான் எங்கே வருவேன்?” ‘நான் எங்கே வருவேன்?’ என்பது எபிரெய மரபுத்தொடர்; இச்சூழலில் “நான் எங்கே போவேன்?” அல்லது “நான் என்ன செய்வேன்?” என்ற பொருளைத் தருகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பி வந்து
  rationale: שׁוב என்பதன் தொடர்நிகழ்வு வடிவம் அவன் மீண்டும் சகோதரர்களிடம் சென்றதைச் சுட்டுகிறது; ‘திரும்பி வந்து’ என்பது கதையோட்டத்துக்கு இயல்பான தமிழாக்கம்.
- source_word: אֶל אֶחָיו
  choice: தன் சகோதரர்களிடம்
  rationale: אֶל திசையையும் אֶחָיו அவனுடைய சகோதரர்களையும் குறிக்கின்றன; தமிழில் தற்சுட்டுப் பொருளை இயல்பாக வெளிப்படுத்த ‘தன்’ பயன்படுத்தப்பட்டது.
- source_word: הַיֶּלֶד
  choice: அந்தப் பையன்
  rationale: יֶלֶד இங்கு யோசேப்பைக் குறிக்கும் ‘பையன்’; எபிரெய நிர்ணயச் சுட்டை உரையாடலில் இயல்பாகக் காட்ட ‘அந்தப்’ பயன்படுத்தப்பட்டது.
- source_word: אֵינֶנּוּ
  choice: அங்கே இல்லை
  rationale: இது ஒருவரின் இல்லாமையைச் சொல்லும் எபிரெய மரபுத்தொடர். மரணத்தைத் தேவையின்றி உணர்த்தாமல், உடனடியான சூழலில் அவன் காணப்படவில்லை என்ற பொருளைத் தக்கவைக்கிறது.
- source_word: וַאֲנִי
  choice: நானோ
  rationale: தன்னைப் பற்றிய ரூபனின் திடீர், வலியுறுத்தப்பட்ட கவலைக்குத் தமிழில் ‘நானோ’ இயல்பாகப் பொருந்துகிறது.
- source_word: אָנָה אֲנִי בָא
  choice: நான் எங்கே போவேன்?
  rationale: சொல்லுக்குச் சொல் ‘நான் எங்கே வருகிறேன்?’ என்ற அமைப்பு இருந்தாலும், இலக்கை வினவும் இந்த எபிரெய மரபுத்தொடர் சூழலில் ‘நான் எங்கே போவேன்?’ அல்லது ‘நான் என்ன செய்வேன்?’ என்ற துயரக் கேள்வியை வெளிப்படுத்துகிறது.
