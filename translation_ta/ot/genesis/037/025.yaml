  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் தொடர்ச்சியான நிகழ்வுரையை இயல்பான தமிழ்ச் சொற்றொடர்களாக மாற்றியபோதும், ‘இதோ’ என்ற கவன ஈர்ப்புச் சொல்லும் மூன்று தனித்தனி சரக்குப் பெயர்களும் பாதுகாக்கப்பட்டுள்ளன.
