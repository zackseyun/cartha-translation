  source_fidelity: மூல எபிரெயத்தின் நிகழ்வுத் தொடர், இஸ்மவேலரின் பயணக் குழு, கிலேயாத்திலிருந்து வருதல், ஒட்டகங்கள் சுமக்கும் மூன்று பொருட்கள், எகிப்துக்குச் செல்லுதல் ஆகியவை சரியாகப் பிரதிபலிக்கப்படுகின்றன. לֶחֶם இங்கு விருந்துணவு/உணவு என்ற பொருளில் வருவதால் ‘உணவருந்த’ என்பது இயல்பானதும் போதுமானதும். לֹט என்பதன் அடையாளம் உறுதியற்றது; ‘லேடனம்’ என்ற தேர்வு சாத்தியமானது, ஆனால் குறிப்பு அந்த நிச்சயமின்மையைத் தெளிவாகத் தக்கவைக்க வேண்டும். ஆங்கில audit trail-இல் ‘myrrh’ உள்ளது; அது ஒரு பாரம்பரிய அடையாளமாகக் குறிப்பில் மட்டும் தெரிவிக்கப்படுவது, மூலச் சொல்லின் விவாதத்தன்மையை மறைக்காது.
  naturalness: ‘உணவு உண்பதற்காக உட்கார்ந்தார்கள்’ என்பது தேவையற்ற மீளுரைப்பாக உள்ளது. ‘உணவருந்த உட்கார்ந்தார்கள்’ நவீன நிலையான தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது. கடைசிப் பகுதியில் ஒட்டகங்களே சரக்குகளைச் சுமந்து பயணித்தன என்ற எபிரெயத் தொடரைத் தெளிவாக்கும் வகையில் சொற்றொடர் சிறிது சீரமைக்கப்பட்டுள்ளது.
  terminology: ‘நறுமணப் பிசின்’ மற்றும் ‘தைலப்பிசின்’ ஆகியவை நְכֹאת, צְרִי ஆகியவற்றுக்கான எச்சரிக்கையான பொதுப்பொருள் மொழிபெயர்ப்புகள். ‘லேடனம்’ என்பது கடன்பெற்ற தொழில்நுட்பப் பெயராக இருந்தாலும், குறிப்புடன் பயன்படுத்தப்படலாம். ‘இஸ்மவேலர்’, ‘கிலேயாத்’, ‘எகிப்து’ ஆகிய பெயர்வடிவங்கள் ஏற்கத்தக்கவை.
