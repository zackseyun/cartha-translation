base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/025.yaml
  text: Then they sat down to eat bread, and they lifted up their eyes and looked, and behold, a caravan of Ishmaelites was coming from Gilead, with their camels carrying gum, balm, and myrrh, on their way to take it down to Egypt.
translation:
  language: ta
  text: பின்பு அவர்கள் உணவருந்த உட்கார்ந்தார்கள். அவர்கள் ஏறிட்டுப் பார்த்தபோது, இதோ, கிலேயாத்திலிருந்து இஸ்மவேலரின் வணிகக் குழு ஒன்று வந்துகொண்டிருந்தது. அவர்களுடைய ஒட்டகங்கள் நறுமணப் பிசின், தைலப்பிசின், லேடனம்[a] ஆகியவற்றைச் சுமந்துகொண்டு, அவற்றை எகிப்துக்குக் கொண்டுபோகப் பயணித்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “லேடனம்” என்பது ஒரு வகைச் செடியிலிருந்து கிடைக்கும் நறுமணப் பிசின். இதற்கான எபிரெயச் சொல்லின் துல்லியமான அடையாளம் குறித்து கருத்து வேறுபாடு உள்ளது; சில பாரம்பரிய மொழிபெயர்ப்புகள் இதை வெள்ளைப்போளம் (myrrh) என்று தருகின்றன.
    reason: לֹט என்ற அரிய பொருட்பெயரின் அடையாளம் உறுதியற்றது. பிரதான உரையில் ஒரு சாத்தியமான அடையாளம் தரப்பட்டாலும், பாரம்பரிய மாற்று அடையாளம் குறிப்பில் வெளிப்படையாகக் கொடுக்கப்படுகிறது.
lexical_decisions:
- source_word: לֶחֶם
  choice: உணவு
  rationale: அடிப்படைப் பொருள் ‘அப்பம்’ என்றாலும், ‘உணவு உண்பது’ என்ற எபிரெய வழக்கில் இங்கு பொதுவாக உணவைக் குறிக்கிறது.
- source_word: אֹרְחַת יִשְׁמְעֵאלִים
  choice: இஸ்மவேலரின் வணிகக் குழு
  rationale: אֹרְחָה என்பது ஒன்றாகப் பயணிக்கும் கூட்டத்தை, இச்சூழலில் சரக்குகளுடன் செல்லும் வணிகப் பயணக் குழுவைக் குறிக்கிறது.
- source_word: נְכֹאת
  choice: நறுமணப் பிசின்
  rationale: இச்சொல் ஒரு நறுமணமுள்ள தாவரப் பிசினையோ நறுமணப் பொருளையோ குறிக்கிறது; அதன் துல்லியமான அடையாளம் உறுதியல்ல.
- source_word: צְרִי
  choice: தைலப்பிசின்
  rationale: மருத்துவத்திற்கோ நறுமணத்திற்கோ பயன்படுத்தப்பட்ட ஒரு வகை balm அல்லது மரப்பிசினைக் குறிக்கும்; தமிழில் பொருளை உணர்த்தும் பொதுப்பெயர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לֹט
  choice: லேடனம்
  rationale: பொதுவாக rockrose செடியிலிருந்து கிடைக்கும் labdanum என்ற நறுமணப் பிசினாக அடையாளப்படுத்தப்படுகிறது; ‘வெள்ளைப்போளம்’ என்று மொழிபெயர்ப்பது மூலச் சொல்லின் வேறுபாட்டை மறைக்கும்.
- source_word: לְהוֹרִיד מִצְרָיְמָה
  choice: எகிப்துக்குக் கொண்டுபோவதற்காக
  rationale: சொல்லளவில் ‘எகிப்துக்கு இறக்கிக்கொண்டு போதல்’; தமிழில் இயல்பாக இலக்கை நோக்கிய போக்குவரத்தைக் குறிப்பிடுகிறது.
