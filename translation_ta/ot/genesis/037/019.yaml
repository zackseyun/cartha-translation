base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/019.yaml
  text: And they said to one another[a], “Look, this dreamer is coming.”
translation:
  language: ta
  text: அவர்கள் ஒருவருக்கொருவர், “இதோ, அந்தக் கனவுக்காரன்[a] வருகிறான்” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “கனவுகளின் எஜமான்” அல்லது “கனவுகளின் உரிமையாளர்.” சகோதரர்களின் ஏளனத் தொனியை வெளிப்படுத்துவதற்காக எபிரெய மரபுத்தொடர் “கனவுக்காரன்” என்று பொருள்வழியில் மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: சொன்னார்கள்
  rationale: אמר என்பதன் wayyiqtol வடிவம் கதையின் அடுத்த செயலைத் தொடர்கிறது; தமிழில் வாக்கிய முடிவிலுள்ள “என்று சொன்னார்கள்” இயல்பான கதைநடையை அளிக்கிறது.
- source_word: אִישׁ אֶל אָחִיו
  choice: ஒருவருக்கொருவர்
  rationale: சொல்லுக்கு சொல் “ஒருவன் தன் சகோதரனிடம்” என்றாலும், இச்சூழலில் இது பரஸ்பரமாகப் பேசிக்கொண்டதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லை நவீன, இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: בַּעַל הַחֲלֹמוֹת
  choice: கனவுக்காரன்
  rationale: சொல்லுக்கு சொல் “கனவுகளின் எஜமான்/உரிமையாளர்”; இங்கு בַּעַל என்பது கனவுகளால் அடையாளப்படுத்தப்படுகிற ஒருவனைக் குறிக்கிறது. சகோதரர்களின் ஏளனத் தொனியை “கனவுக்காரன்” இயல்பாகக் கொண்டுவருகிறது.
- source_word: הַלָּזֶה
  choice: அந்த
  rationale: யோசேப்பைச் சுட்டிக்காட்டும் இச்சுட்டுப்பெயர் சூழலில் இகழ்ச்சித் தொனியைக் கொண்டுள்ளது; தமிழில் “அந்த” அந்தத் தொனியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּא
  choice: வருகிறான்
  rationale: בוא என்பதன் பங்கேற்பு வடிவம் நடந்துகொண்டிருக்கும் அணுகுதலைக் குறிக்கிறது; “வருகிறான்” அதன் காலநிலையை இயல்பாகப் பிரதிபலிக்கிறது.
