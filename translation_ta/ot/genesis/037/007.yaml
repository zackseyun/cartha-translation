base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/007.yaml
  text: And behold[a], we were binding sheaves in the midst of the field, and behold, my sheaf rose and also stood upright; and behold[c][b], your sheaves gathered around and bowed down to my sheaf.
translation:
  language: ta
  text: இதோ, நாங்கள் வயலின் நடுவில் கதிர்க்கட்டுகளைக் கட்டிக்கொண்டிருந்தோம்; இதோ, என் கதிர்க்கட்டு எழுந்து, மேலும் நிமிர்ந்து நின்றது; இதோ, உங்கள் கதிர்க்கட்டுகள் அதைச் சுற்றி வந்து[a], என் கதிர்க்கட்டுக்கு முன்பாகக் குனிந்து வணங்கின[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதைச் சூழ்ந்தன”; எபிரெய வினைச்சொல் திரும்புதல் அல்லது சுற்றிச் செல்லுதல் என்ற பொருளைக் கொண்டது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் கதிர்க்கட்டுக்கு முன்பாகத் தரைமட்டும் பணிந்தன.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கனவு விவரிப்பில் உடனடித்தன்மையையும் கவன ஈர்ப்பையும் தரும் இந்த உரையாடல் இடைச்சொல் மூன்று முறையும் மீண்டும் வருவதைத் தமிழிலும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: מְאַלְּמִים אֲלֻמִּים
  choice: கதிர்க்கட்டுகளைக் கட்டிக்கொண்டிருந்தோம்
  rationale: வெட்டப்பட்ட தானியக் கதிர்களைச் சேர்த்துக் கட்டும் வேளாண் செயலைத் தெளிவாகக் காட்டுகிறது; எபிரெய வினைச்சொல்–பெயர்ச்சொல் இணைப்பின் ஒலிப்பொருள் தொடர்பையும் ஓரளவு தக்கவைக்கிறது.
- source_word: בְּתוֹךְ הַשָּׂדֶה
  choice: வயலின் நடுவில்
  rationale: வெறுமனே ‘வயலில்’ என்பதைக் காட்டிலும் בְּתוֹךְ என்பதன் இடஞ்சார்ந்த நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: קָמָה
  choice: எழுந்து
  rationale: கதிர்க்கட்டு மேலெழும் இயக்கத்தைக் குறிக்கிறது; தொடர்ந்து வரும் நிலைநிற்றலைத் தனியே வெளிப்படுத்த இடமளிக்கிறது.
- source_word: וְגַם נִצָּבָה
  choice: நிமிர்ந்து நின்றது
  rationale: எழுந்தது மட்டுமல்லாமல் செங்குத்தாக உறுதியாக நின்றது என்ற கூடுதல் கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: תְסֻבֶּינָה
  choice: அதைச் சுற்றி வந்து
  rationale: திரும்புதல் அல்லது சுற்றிச் செல்லுதல் என்ற வினையின் அடிப்படைப் பொருளையும், கனவில் மற்ற கதிர்க்கட்டுகள் அதைச் சூழும் இயக்கத்தையும் காக்கிறது.
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: குனிந்து வணங்கின
  rationale: தன்னைத் தாழ்த்திக் குனிதல் அல்லது பணிதல் என்ற செயலைத் தெளிவாகச் சொல்கிறது; தேவையற்ற அரசியல் அல்லது வழிபாட்டுச் சிறப்புப் பொருளைத் திணிக்கவில்லை.
- source_word: אֲלֻמָּתִי / אֲלֻמֹּתֵיכֶם
  choice: என் கதிர்க்கட்டு / உங்கள் கதிர்க்கட்டுகள்
  rationale: வேளாண் பின்னணியையும் கனவின் குறியீட்டு ஒப்புமையையும் தெளிவாகவும் ஒரே சொல்லாட்சியுடனும் காக்கிறது.
theological_decisions:
- issue: וַתִּשְׁתַּחֲוֶיןָ என்பதன் பணிதல் அல்லது வழிபடுதல் சார்ந்த பொருள்
  choice: குனிந்து வணங்கின
  alternative: முழுவதுமாகத் தரையில் விழுந்து பணிந்தன
  rationale: இங்கு கதிர்க்கட்டுகளின் கனவுக் காட்சி விவரிக்கப்படுவதால், உடல் குனிதலைத் தெளிவாகக் காட்டி, மத வழிபாடு என்ற குறிப்பிட்ட பொருளை முன்கூட்டியே தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கனவு விவரிப்பின் எளிமையையும் மரியாதையான வேதாகம நடையையும் இணைக்கும் பதிவு பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தில் மீண்டும் வரும் וְהִנֵּה அனைத்தும் ‘இதோ’ எனப் பாதுகாக்கப்பட்டுள்ளன; தமிழில் ஓட்டம் இயல்பாக இருக்க குறுகிய வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
