  yaml_path: translation/ot/genesis/037/001.yaml
  text: Jacob lived in the land of his father's sojournings[a], in the land of Canaan.
translation:
  language: ta
  text: யாக்கோபு தன் தந்தை அந்நியராகத் தங்கியிருந்த நாட்டில், அதாவது கானான் நாட்டில், குடியிருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: குடியிருந்தான்
  rationale: ישׁב என்பதன் இவ்வடிவம் கதைநிகழ்வை முன்னெடுக்கிறது; இங்கு அது நிரந்தர உரிமையை வலியுறுத்தாமல் ஓர் இடத்தில் வசித்ததைக் குறிக்கிறது. ‘குடியிருந்தான்’ என்பது நவீனத் தமிழில் இயல்பாகவும் மூலத்தின் ‘வசித்தல்/தங்கியிருத்தல்’ பொருளுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: בְּאֶרֶץ
  choice: நாட்டில்
  rationale: אֶרֶץ இங்கு புவியியல் நிலப்பரப்பைக் குறிக்கிறது. ‘நாடு’ என்பது ‘பகுதி’ என்பதைவிட மூலத்தின் நிலப்பரப்பு சார்ந்த பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: מְגוּרֵי
  choice: அந்நியராகத் தங்கியிருந்த
  rationale: מגור என்பது சொந்த நாட்டவராக அல்லாமல் அந்நியராக அல்லது தற்காலிகக் குடியிருப்பாளராக வாழ்வதைக் குறிக்கிறது. எபிரெயக் கட்டமைப்பைச் சொற்சொல்லாகப் பின்பற்றும் கடினமான தமிழுக்குப் பதிலாக, அதன் முக்கியமான அந்நியக் குடியிருப்பு நுணுக்கத்தை இயல்பான தமிழில் இவ்வாறு வெளிப்படுத்துகிறது.
- source_word: אָבִיו
  choice: தன் தந்தை
  rationale: இது யாக்கோபின் தந்தையாகிய ஈசாக்கைக் குறிக்கிறது. எழுவாய் யாக்கோபு என்பதால், தமிழில் ‘தன் தந்தை’ என்பது உடைமைத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: கானான் நாட்டில்
  rationale: மூலத்தில் בְּאֶרֶץ மீண்டும் வருவதால், ‘நாட்டில்’ என்பதும் மீண்டும் தரப்பட்டுள்ளது. இவ்வாறு கானான் அந்த நிலப்பரப்பு என்பதைத் தெளிவுபடுத்தும் மூலத்தின் ஓசையும் வலியுறுத்தலும் காக்கப்படுகின்றன.
