    issue: முதன்மை உரையில் இணைப்பற்ற இரட்டை இடத்தொடர் உள்ளது.
    rationale: ‘... நாட்டில், கானான் நாட்டில், ...’ என்பது எபிரெய மீளுரையைப் பின்பற்றினாலும் நவீனத் தமிழில் சற்றே தடுமாற்றமாக ஒலிக்கிறது. கானான் அதே நிலத்தின் விளக்கமாக இருப்பதை மென்மையாகக் குறிக்கலாம்.
