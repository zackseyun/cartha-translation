  text: Joseph dreamed a dream[a], and he told it to his brothers, and they hated him even more.
translation:
  language: ta
  text: யோசேப்பு ஒரு கனவு கண்டான். அதைத் தன் சகோதரர்களிடம் சொன்னான். அவர்கள் அவனை இன்னும் அதிகமாக வெறுத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחֲלֹם יוֹסֵף חֲלוֹם
  choice: யோசேப்பு ஒரு கனவு கண்டான்
  rationale: எபிரெய மொழியின் ஒரே வேரிலிருந்து வரும் வினை–பெயர் அமைப்பு (‘கனவு கண்டான்’) தமிழிலும் இயல்பாகவே வெளிப்படுகிறது; ஆகவே தனியான விளக்கக்குறிப்பு தேவையில்லை.
- source_word: וַיַּגֵּד
  choice: சொன்னான்
  rationale: נגד என்பதன் இச்சூழலுக்குரிய பொருள் ‘தெரிவித்தல்/சொல்லுதல்’. கனவே முந்தைய தொடரின் குறிப்பு என்பதால் ‘அதை’ சேர்க்கப்பட்டது.
- source_word: לְאֶחָיו
  choice: தன் சகோதரர்களிடம்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள ‘அவனுடைய சகோதரர்களுக்கு/இடம்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיּוֹסִפוּ עוֹד
  choice: இன்னும் அதிகமாக
  rationale: יסף மற்றும் עוד இணைந்து வெறுப்பு மேலும் அதிகரித்ததை வலியுறுத்துகின்றன.
- source_word: שְׂנֹא אֹתוֹ
  choice: அவனை வெறுத்தார்கள்
  rationale: יסף-ஐத் தொடர்ந்து வரும் வினையெச்ச அமைப்பு தமிழில் இயல்பான இறந்தகால வினையாக மொழிபெயர்க்கப்பட்டது.
