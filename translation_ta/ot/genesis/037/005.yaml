translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. தொடக்க வாவுக்கு ஆதாரத்தில் இல்லாத ‘இப்போது’ போன்ற காலக் குறிப்பு சேர்க்கப்படவில்லை. மூன்று குறுகிய வாக்கியங்கள் எபிரெயக் கதைநடையின் தொடர்ச்சியைத் தெளிவாகக் காட்டுகின்றன.
