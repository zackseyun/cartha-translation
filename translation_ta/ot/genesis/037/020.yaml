source:
  edition: WLC
  text: וְ/עַתָּ֣ה לְכ֣וּ וְ/נַֽהַרְגֵ֗/הוּ וְ/נַשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הַ/בֹּר֔וֹת וְ/אָמַ֕רְנוּ חַיָּ֥ה רָעָ֖ה אֲכָלָ֑תְ/הוּ וְ/נִרְאֶ֕ה מַה יִּהְי֖וּ חֲלֹמֹתָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/020.yaml
  text: So now[a], come, let us kill him and throw him into one of the pits, and we will say[b], ‘A wild animal has devoured him.’ Then we will see what becomes of his dreams.’
translation:
  language: ta
  text: “இப்போது வாருங்கள்; அவனைக் கொன்று, குழிகளில் ஒன்றில்[a] எறிந்துவிடுவோம். ‘ஒரு கொடிய காட்டு விலங்கு[b] அவனைத் தின்றுவிட்டது’ என்று சொல்லுவோம். பிறகு அவனுடைய கனவுகள் என்ன ஆகும் என்று பார்ப்போம்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தண்ணீர்த் தொட்டிகளில் ஒன்றில்.” எபிரெயச் சொல் בּוֹר சூழலுக்கு ஏற்ப குழி, தண்ணீர்த் தொட்டி அல்லது கிணறு போன்ற சேமிப்பிடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரு கொடிய காட்டு மிருகம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: இணைப்புத் தன்மையையும் உடனடியான திட்ட முன்மொழிவையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְכוּ
  choice: வாருங்கள்
  rationale: இங்கு புறப்பட்டுச் செல்லும்படி கூறும் நேரடி கட்டளையாக அல்லாமல், கூட்டுச் செயலுக்கு அழைக்கும் பன்மைத் தூண்டுதலாக வருகிறது.
- source_word: וְנַהַרְגֵהוּ
  choice: அவனைக் கொன்று
  rationale: முதல் நபர் பன்மைக் cohortative வடிவத்தின் கூட்டுச் செயல் முன்மொழிவை, தொடரும் ‘எறிந்துவிடுவோம்’ என்பதோடு இயல்பாக இணைக்கிறது.
- source_word: וְנַשְׁלִכֵהוּ
  choice: எறிந்துவிடுவோம்
  rationale: ‘எறிதல்/வீசுதல்’ என்ற அடிப்படைப் பொருளையும், திட்டமிட்ட செயலின் முடிவுறும் தன்மையையும் தெளிவாகக் காட்டுகிறது.
- source_word: בְּאַחַד הַבֹּרוֹת
  choice: குழிகளில் ஒன்றில்
  rationale: בּוֹר என்பது சூழலுக்கு ஏற்ப குழி அல்லது தண்ணீர்த் தொட்டி போன்ற அமைப்பைக் குறிக்கலாம்; பொதுவானதும் இச்சூழலில் தெளிவானதும் ‘குழி’ ஆகும்.
- source_word: וְאָמַרְנוּ
  choice: என்று சொல்லுவோம்
  rationale: அவர்கள் வகுக்கும் திட்டத்தின் அடுத்த செயலை இயல்பான தமிழ் எதிர்கால வினையால் தெரிவிக்கிறது.
- source_word: חַיָּה רָעָה
  choice: ஒரு கொடிய காட்டு விலங்கு
  rationale: חַיָּה-வின் விலங்கு சார்ந்த பொருளையும் רָעָה-வின் ஆபத்தான/கொடிய பண்பையும் நவீனத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֲכָלָתְהוּ
  choice: அவனைத் தின்றுவிட்டது
  rationale: ‘தின்றது’ என்ற நேரடிப் பொருளையும், கற்பிக்கப்பட்ட அறிக்கையில் செயல் முடிந்துவிட்டதையும் இயல்பாக வெளிப்படுத்துகிறது; ‘விழுங்கிவிட்டது’ என்பது சாத்தியமான ஆனால் வலுப்படுத்தப்பட்ட மாற்று.
- source_word: וְנִרְאֶה
  choice: பிறகு ... பார்ப்போம்
  rationale: வடிவத்தில் உள்ள ‘நாம் பார்ப்போம்/பார்க்கலாம்’ என்ற நுண்ணிய இருமையைத் தீர்மானமாக ஒதுக்காமல், சூழலின் ஏளனமான விளைவு நோக்கைத் தமிழில் தருகிறது.
- source_word: מַה יִּהְיוּ חֲלֹמֹתָיו
  choice: அவனுடைய கனவுகள் என்ன ஆகும்
  rationale: சொல்லுக்கு நெருக்கமான எதிர்கால நோக்கைத் தக்கவைத்தபடி, கனவுகளின் முடிவை ஏளனமாகச் சவால் செய்யும் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: யோசேப்பின் கனவுகளின் நிறைவேற்றத்தைப் பற்றிய சகோதரர்களின் ஏளனம்
  choice: “அவனுடைய கனவுகள் என்ன ஆகும் என்று பார்ப்போம்”
  alternative: “அவனுடைய கனவுகள் எப்படி நிறைவேறும் என்று பார்ப்போம்”
  rationale: ‘நிறைவேறும்’ என்று மொழிபெயர்ப்பது கனவுகள் தீர்க்கதரிசனமாக நிறைவேறுவதைக் குறிப்பாக முன்கூட்டியே விளக்கும். எபிரெய உரையின் திறந்த, ஏளனமான கேள்வியை அப்படியே வைத்திருக்க ‘என்ன ஆகும்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியும் கண்ணியமுமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. சகோதரர்களின் வன்முறையான திட்டமும் கனவுகளைப் பற்றிய ஏளனமும் மென்மைப்படுத்தப்படவில்லை. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
