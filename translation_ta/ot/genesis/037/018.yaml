base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/018.yaml
  text: They saw him from a distance[a], and before he came near to them, they conspired against him to kill him.
translation:
  language: ta
  text: அவர்கள் அவனைத் தொலைவிலிருந்தே கண்டார்கள். அவன் அவர்களிடம் நெருங்கி வருவதற்கு முன்பே, அவனைக் கொல்வதற்காக அவனுக்கு எதிராகச் சதித்திட்டம் தீட்டினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்கு எதிராகச் சூழ்ச்சி செய்தார்கள்.” எபிரெய வினைச்சொல் சூழ்ச்சி செய்வதையோ வஞ்சகமாகச் செயல்படுவதையோ குறிக்கலாம்; இங்கு அவனைக் கொல்வதே அந்தத் திட்டத்தின் நோக்கம் என்று சூழல் தெளிவுபடுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ אֹתוֹ מֵרָחֹק
  choice: அவர்கள் அவனைத் தொலைவிலிருந்தே கண்டார்கள்
  rationale: ראה என்பதன் எளிய கதைநடைப் பொருளையும், מֵרָחֹק குறிக்கும் தொலைவையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது. ‘-இருந்தே’ என்பது அவன் இன்னும் தொலைவில் இருந்தபோதே அவர்கள் கண்டனர் என்ற நுணுக்கத்தைத் தருகிறது.
- source_word: וּבְטֶרֶם יִקְרַב אֲלֵיהֶם
  choice: அவன் அவர்களிடம் நெருங்கி வருவதற்கு முன்பே
  rationale: בְטֶרֶם குறிக்கும் ‘முன்பு/இன்னும் நிகழாத நிலையில்’ என்ற கால உறவையும், קרב குறிக்கும் அணுகிவருதலையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַיִּתְנַכְּלוּ אֹתוֹ
  choice: அவனுக்கு எதிராகச் சதித்திட்டம் தீட்டினார்கள்
  rationale: נכל என்பதன் Hitpael வடிவம் இச்சூழலில் பகைமையான சூழ்ச்சி அல்லது திட்டமிடுதலைக் குறிக்கிறது. ‘சதித்திட்டம் தீட்டினார்கள்’ என்பது கூட்டாக மேற்கொண்ட தீய திட்டத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לַהֲמִיתוֹ
  choice: அவனைக் கொல்வதற்காக
  rationale: מות என்பதன் Hiphil infinitive construct இங்கு அவர்களுடைய திட்டத்தின் நோக்கத்தை வெளிப்படுத்துகிறது; ‘கொல்வதற்காக’ என்பது அந்த நோக்கத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
