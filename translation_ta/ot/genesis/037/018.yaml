translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனத்தின் நிகழ்வுவரிசையும் கொலைநோக்கமும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன; [a] குறிப்பு பொருந்தும் வினைத்தொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
