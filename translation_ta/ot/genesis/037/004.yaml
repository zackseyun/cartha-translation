  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நேசித்தார்’ மற்றும் ‘சமாதானமாக’ என்பவை மூலத்தின் சொற்பொருளையும் அதன் உறவுசார் நுணுக்கத்தையும் காக்கின்றன.
