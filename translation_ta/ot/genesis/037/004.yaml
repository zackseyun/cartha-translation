revisions:
- from: தங்கள் தந்தை தன் சகோதரர்கள் எல்லாரையும்விட அவனை அதிகமாக நேசித்ததை அவனுடைய சகோதரர்கள் கண்டபோது, அவர்கள் அவனை வெறுத்தார்கள்; அவனோடு சமாதானமாகப் பேச அவர்களால் முடியவில்லை.[a]
  to: அவனுடைய சகோதரர்கள், தங்கள் தந்தை அவனுடைய சகோதரர்கள் எல்லாரையும்விட அவனை அதிகமாக நேசித்ததைக் கண்டபோது, அவர்கள் அவனை வெறுத்தார்கள்; அவனோடு சமாதானமாகப் பேச அவர்களால் முடியவில்லை.[a]
  rationale: The revision solely clarifies that the comparison concerns Joseph’s brothers, not the father’s brothers. It preserves the Hebrew’s wording without adding ‘other,’ retains the temporal connection introduced by ‘கண்டபோது,’ and keeps the peaceful/friendly sense of לְשָׁלוֹם along with its explanatory footnote.
