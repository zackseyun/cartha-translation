  yaml_path: translation/ot/genesis/037/004.yaml
  text: When his brothers saw that their father loved him more than all his brothers[a], they hated him and could not speak peaceably to him.
translation:
  language: ta
  text: அவனுடைய சகோதரர்கள், தங்கள் தந்தை அவனுடைய சகோதரர்கள் எல்லாரையும்விட அவனை அதிகமாக நேசித்ததைக் கண்டபோது, அவர்கள் அவனை வெறுத்தார்கள்; அவனோடு சமாதானமாகப் பேச அவர்களால் முடியவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனோடு சமாதானத்துடன் பேச”; அதாவது, அவர்களால் அவனோடு நட்புறவுடன் பேச முடியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: கண்டபோது
  rationale: தொடர்கதை வடிவம் இங்கு சகோதரர்கள் கண்டதையும் அதனால் விளைந்த வெறுப்பையும் காலத் தொடர்புடன் இணைக்கிறது.
- source_word: אֶחָיו
  choice: அவனுடைய சகோதரர்கள்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு யோசேப்பின் சகோதரர்களைக் குறிக்கிறது.
- source_word: כִּי
  choice: …நேசித்ததை
  rationale: அவர்கள் கண்டவற்றின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெய அமைப்பைத் தமிழில் இயல்பான செயப்படுபொருள் வடிவில் தருகிறது; காரணப்பொருளாக மாற்றவில்லை.
- source_word: אָהַב
  choice: நேசித்ததை
  rationale: மூல வினை பொதுவாக ‘நேசி’ என்று பொருள்படும். பாரபட்சமான அன்பு சூழலில் தென்பட்டாலும், ‘ஆதரித்தார்’ என்று மாற்றாமல் ஒப்பீட்டுத் தொடரே அந்த நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: אֲבִיהֶם
  choice: தங்கள் தந்தை
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டு சகோதரர்களைக் கூட்டாகச் சுட்டுகிறது; தமிழில் ‘தங்கள்’ இயல்பாக அந்த உறவைத் தெரிவிக்கிறது.
- source_word: מִכָּל אֶחָיו
  choice: தன் சகோதரர்கள் எல்லாரையும்விட
  rationale: ஒப்பீட்டைக் குறிக்கும் מִן மற்றும் כָּל ஆகியவற்றின் வலிமையைப் பாதுகாக்கிறது; மூலத்தில் இல்லாத ‘மற்ற’ என்பதைச் சேர்க்கவில்லை.
- source_word: וַיִּשְׂנְאוּ
  choice: அவர்கள் அவனை வெறுத்தார்கள்
  rationale: שׂנא என்பதன் நேரடியான பொருள் ‘வெறு’; தொடர்கதை இறந்தகாலம் எளிமையாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְלֹא יָכְלוּ
  choice: அவர்களால் முடியவில்லை
  rationale: அவர்களின் இயலாமையைத் தமிழில் இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: דַּבְּרוֹ
  choice: அவனோடு … பேச
  rationale: பின்னொட்டு யோசேப்பைச் சுட்டுகிறது; தமிழில் ‘அவனோடு பேச’ என்பது இயல்பான உறவாடல் பொருளைத் தருகிறது.
- source_word: לְשָׁלֹם
  choice: சமாதானமாக
  rationale: שָׁלוֹם இங்கு அமைதியான அல்லது நட்பான உறவுடன் பேசுவதைக் குறிக்கிறது. ‘சமாதானமாக’ என்ற சொல் அடிப்படைச் சொல்லையும் சூழல்சார் பொருளையும் காக்கிறது.
