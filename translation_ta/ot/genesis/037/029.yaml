translation_notes:
  register: நவீனத் தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பதன் மூலம் மூலத்தின் திடீர் கவன ஈர்ப்பு தக்கவைக்கப்பட்டுள்ளது. בּוֹר என்பதற்கான ‘தண்ணீர்த் தொட்டி’ என்ற சாத்தியம் சூழலில் இருந்தாலும், தமிழில் ‘குழி’ இயல்பாகவும் பரந்த பொருத்தமுடையதாகவும் இருப்பதால் முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது.
