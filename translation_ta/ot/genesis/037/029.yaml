source:
  edition: WLC
  text: וַ/יָּ֤שָׁב רְאוּבֵן֙ אֶל הַ/בּ֔וֹר וְ/הִנֵּ֥ה אֵין יוֹסֵ֖ף בַּ/בּ֑וֹר וַ/יִּקְרַ֖ע אֶת בְּגָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/029.yaml
  text: When Reuben returned to the pit[a], behold, Joseph was not in the pit[b], and he tore his clothes.
translation:
  language: ta
  text: ரூபன் அந்தக் குழிக்குத் திரும்பி வந்தபோது, இதோ, யோசேப்பு குழியில் இல்லை; அவன் தன் உடைகளைக் கிழித்துக்கொண்டான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: உடைகளைக் கிழித்துக்கொள்வது துயரம், அதிர்ச்சி அல்லது கடும் மனவேதனையை வெளிப்படுத்தும் அக்கால வழக்கம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பி வந்தபோது
  rationale: שׁוב என்பதன் கதைநடை வடிவம் ரூபன் முன்பு இருந்த இடத்திற்குத் திரும்பியதைச் சுட்டுகிறது. தமிழில் தொடர்ந்த நிகழ்வோட்டத்தை இயல்பாகக் காட்ட ‘திரும்பி வந்தபோது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַבּוֹר / בַּבּוֹר
  choice: அந்தக் குழி / குழியில்
  rationale: בּוֹר என்பது குழியையோ தண்ணீர்த் தொட்டியையோ குறிக்கலாம். இச்சூழலில் யோசேப்பு எறியப்பட்ட இடத்தைக் குறிக்கும் பொதுவாகப் புரியக்கூடிய இயல்பான சொல் ‘குழி’; முந்தைய சூழலைச் சுட்ட ‘அந்தக்’ சேர்க்கப்பட்டது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה அடுத்து வெளிப்படும் எதிர்பாராத நிலையைக் கவனத்திற்குக் கொண்டுவரும் கதைநடைச் சுட்டுச்சொல். அதன் திடுக்கிடும் வலிமையை ‘இதோ’ தக்கவைக்கிறது.
- source_word: אֵין יוֹסֵף בַּבּוֹר
  choice: யோசேப்பு குழியில் இல்லை
  rationale: אֵין இங்கு இல்லாமை அல்லது காணப்படாமையைத் தெரிவிக்கிறது. ‘யோசேப்பு போய்விட்டான்’ போன்ற மேலதிக விளக்கத்தைச் சேர்க்காமல் எபிரெய உரையின் கருத்தை நேரடியாகத் தருகிறது.
- source_word: וַיִּקְרַע אֶת בְּגָדָיו
  choice: அவன் தன் உடைகளைக் கிழித்துக்கொண்டான்
  rationale: קרע בגדיו என்பது துயரம், அதிர்ச்சி அல்லது மனவேதனையை வெளிப்படுத்தும் வழக்கமான செயலைக் குறிக்கிறது. ‘தன் உடைகளைக் கிழித்துக்கொண்டான்’ என்பது நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
