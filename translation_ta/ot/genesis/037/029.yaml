- from: ரூபன் அந்தக் குழியிடம் திரும்பி வந்தபோது, இதோ, யோசேப்பு குழியில் இல்லை; அதனால் அவன் தன் உடைகளைக் கிழித்துக்கொண்டான்.[a]
  to: ரூபன் அந்தக் குழிக்குத் திரும்பி வந்தபோது, இதோ, யோசேப்பு குழியில் இல்லை; அவன் தன் உடைகளைக் கிழித்துக்கொண்டான்.[b]
