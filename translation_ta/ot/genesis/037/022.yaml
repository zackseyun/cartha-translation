base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/022.yaml
  text: And Reuben said to them[a], “Do not shed blood. Throw him into this pit that is in the wilderness, but do not lay a hand on him”—that he might rescue him from their hand[b], to return him to his father.
translation:
  language: ta
  text: ரூபன் அவர்களிடம், “இரத்தம் சிந்தாதீர்கள். வனாந்தரத்தில் இருக்கும் இந்தக் குழியில்[a] அவனைத் தூக்கிப் போடுங்கள்; ஆனால் அவன்மேல் கை வைக்காதீர்கள்” என்றான். அவர்களுடைய கையிலிருந்து அவனை மீட்டு, அவனுடைய தந்தையிடம் அவனைத் திரும்பக் கொண்டுபோவதற்காகவே[b] அவன் அவ்வாறு சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “குழி” என்பதற்கான எபிரெயச் சொல், தண்ணீரைச் சேமிக்கும் நிலத்தடித் தொட்டியையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மூலத்தில் நவீன மேற்கோள் குறிகள் இல்லை. இங்குள்ள நோக்கக் கூற்று ரூபனின் மறைநோக்கத்தை விளக்கும் உரையாசிரியரின் குறிப்பாக மொழிபெயர்க்கப்பட்டுள்ளது; இலக்கணரீதியாக அதை முந்திய பேச்சுடன் இன்னும் நெருக்கமாக இணைத்தும் வாசிக்கலாம்.
    reason: discourse_boundary
lexical_decisions:
- source_word: אַל תִּשְׁפְּכוּ דָם
  choice: இரத்தம் சிந்தாதீர்கள்
  rationale: ‘இரத்தம் சிந்துதல்’ என்ற எபிரெய மரபுத்தொடரின் வடிவத்தையும், கொலை அல்லது உயிர்க்கேடு விளைவிக்கும் வன்முறையைத் தடுக்கிற அதன் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הַשְׁלִיכוּ אֹתוֹ
  choice: அவனைத் தூக்கிப் போடுங்கள்
  rationale: இங்கு வினைச்சொல் உடல்ரீதியாக ஒருவரைக் குழிக்குள் எறிந்து போடுவதைக் குறிக்கிறது; இந்தத் தமிழ் வடிவம் செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַבּוֹר
  choice: குழி
  rationale: இந்த எபிரெயச் சொல் குழி அல்லது நீர்த்தொட்டி இரண்டையும் குறிக்கலாம். முதன்மை உரையில் பரந்த பொருளுடைய ‘குழி’ பயன்படுத்தப்பட்டு, குறிப்பான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר בַּמִּדְבָּר
  choice: வனாந்தரத்தில் இருக்கும்
  rationale: מִדְבָּר என்பது மணற்பாலைவனத்தை மட்டும் அல்லாமல் குடியிருப்பற்ற வறண்ட வெளியையும் குறிக்கலாம். ‘வனாந்தரம்’ அந்தப் பரந்த பொருளைக் காக்கும் நிலையான, புரிந்துகொள்ளத்தக்க தமிழ் சொல்.
- source_word: וְיָד אַל תִּשְׁלְחוּ בוֹ
  choice: ஆனால் அவன்மேல் கை வைக்காதீர்கள்
  rationale: சொல்லுக்குச் சொல் மொழிபெயர்த்தால் தமிழில் தெளிவில்லாமல் போகும். ‘கை வைக்காதீர்கள்’ என்பது அவர்களே அவனுக்கு உடல்ரீதியான தீங்கு செய்யக்கூடாது என்ற எபிரெய மரபுத்தொடரின் வலிமையை இயல்பாகத் தருகிறது.
- source_word: הַצִּיל אֹתוֹ מִיָּדָם
  choice: அவர்களுடைய கையிலிருந்து அவனை மீட்டு
  rationale: נצל என்பதற்கு ‘மீட்பது’ என்பது பொருத்தமானது. ‘அவர்களுடைய கையிலிருந்து’ என்பது அவர்களின் அதிகாரம் அல்லது பிடியிலிருந்து என்ற எபிரெய உருவகத்தைத் தக்கவைக்கிறது.
- source_word: לַהֲשִׁיבוֹ אֶל אָבִיו
  choice: அவனுடைய தந்தையிடம் அவனைத் திரும்பக் கொண்டுபோவதற்காக
  rationale: காரணவினை வடிவம் யோசேப்பைத் தந்தையிடம் மீண்டும் கொண்டுபோவதைக் குறிக்கிறது; தமிழ் வடிவம் அந்தச் செயப்படுபொருளையும் நோக்கத்தையும் வெளிப்படையாகக் காட்டுகிறது.
- source_word: רְאוּבֵן
  choice: ரூபன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம்.
theological_decisions:
- issue: לְמַעַן தொடங்கும் நோக்கக் கூற்று ரூபனின் நேரடிப் பேச்சா அல்லது உரையாசிரியரின் விளக்கமா
  choice: ரூபன் பேசியதற்கான உரையாசிரியரின் விளக்கமாக அமைக்கப்பட்டது
  alternative: அந்த நோக்கக் கூற்றையும் ரூபனுடைய நேரடிப் பேச்சுக்குள் தொடர்வது
  rationale: எபிரெயத்தில் நவீன மேற்கோள் குறிகள் இல்லாவிட்டாலும், மறைவாக யோசேப்பை மீட்டு தந்தையிடம் திருப்பிக் கொண்டுபோகும் ரூபனின் நோக்கத்தை உரையாசிரியர் விளக்குவதாகச் சூழல் காட்டுகிறது. இருப்பினும் மூலத்தின் மேற்கோள் எல்லை வெளிப்படையாகக் குறிக்கப்படாததால் மாற்று அமைப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘இரத்தம் சிந்துதல்,’ ‘கை வைக்காதிருத்தல்,’ ‘கையிலிருந்து மீட்டல்’ ஆகிய மூல உருவகங்கள் தமிழில் புரியுமளவு தக்கவைக்கப்பட்டுள்ளன. நேரடிப் பேச்சிலிருந்து உரையாசிரியரின் நோக்கவிளக்கத்துக்கான மாறுதல் தனி வாக்கியமாகத் தெளிவுபடுத்தப்பட்டுள்ளது.
