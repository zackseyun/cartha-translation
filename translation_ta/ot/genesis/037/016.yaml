translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சகோதரர்கள்’ ஆண் உடன்பிறந்தவர்களைக் குறிப்பதில் மூலத்தின் பாலினத் துல்லியத்தைப் பேணுகிறது. மூலத்தில் வெளிப்படையாக இல்லாத ‘மந்தை’ தமிழில் தவறான பொருள் வராமல் இருக்கச் சூழலின் அடிப்படையில் குறைந்த அளவில் வெளிப்படுத்தப்பட்டுள்ளது.
