  text: וַ/יֹּ֕אמֶר אֶת אַחַ֖/י אָנֹכִ֣י מְבַקֵּ֑שׁ הַגִּֽידָ/ה נָּ֣א לִ֔/י אֵיפֹ֖ה הֵ֥ם רֹעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/016.yaml
  text: He said[a], “I am looking for my brothers. Please tell me where they are pasturing.”
translation:
  language: ta
  text: அவன், “நான் என் சகோதரர்களைத் தேடிக்கொண்டிருக்கிறேன். அவர்கள் எங்கே மந்தை மேய்த்துக்கொண்டிருக்கிறார்கள்[a] என்று தயவுசெய்து எனக்குச் சொல்லுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “எங்கே மந்தையைக் கவனித்துக்கொண்டிருக்கிறார்கள்.” எபிரெயப் பங்கேற்புவினை, மேய்ச்சலிடத்தில் விலங்குகளைப் பராமரிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவன் … என்றான்
  rationale: וַיֹּאמֶר என்பது எபிரெயக் கதைநடையில் வழக்கமான தொடர்வினை. இயல்பான தமிழ் நேர்கூற்றில் கூறுபவன் மேற்கோளுக்கு முன் சுட்டப்பட்டு, ‘என்றான்’ இறுதியில் வைக்கப்பட்டுள்ளது; தொடக்க இணைப்புச்சொல் தனியே சேர்க்கப்படவில்லை.
- source_word: אֶת אַחַי
  choice: என் சகோதரர்களை
  rationale: אֶת நேரடி செயப்படுபொருளைக் குறிக்கிறது; אַחַי என்பது ‘என் சகோதரர்கள்.’ சூழலில் யோசேப்பின் ஆண் உடன்பிறந்தவர்களைக் குறிக்கும்.
- source_word: אָנֹכִי מְבַקֵּשׁ
  choice: நான் … தேடிக்கொண்டிருக்கிறேன்
  rationale: தனிப்பட்ட சுட்டுப்பெயருடன் வரும் நிகழ்காலப் பங்கேற்புவினை, அப்போது தொடர்ந்துகொண்டிருக்கும் தேடலைக் காட்டுகிறது. ‘தேடிக்கொண்டிருக்கிறேன்’ அந்தத் தொடர்ச்சியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַגִּידָה נָּא לִי
  choice: தயவுசெய்து எனக்குச் சொல்லுங்கள்
  rationale: נגד என்பதன் ஹிஃபில் கட்டளை வடிவமும் נָא துகளும் மரியாதையான வேண்டுகோளை வெளிப்படுத்துகின்றன. தமிழ் மரியாதைப் பன்மை கட்டளை மற்றும் ‘தயவுசெய்து’ இதைப் பாதுகாக்கின்றன.
- source_word: אֵיפֹה הֵם
  choice: அவர்கள் எங்கே
  rationale: இடத்தை வினவும் אֵיפֹה என்பதும் வெளிப்படையான பன்மைச் சுட்டுப்பெயரான הֵם என்பதும் நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கப்பட்டுள்ளன.
- source_word: רֹעִים
  choice: மந்தை மேய்த்துக்கொண்டிருக்கிறார்கள்
  rationale: רעה என்பதன் கால் பங்கேற்புவினை, இச்சூழலில் மேய்ச்சலில் விலங்குகளைப் பராமரிப்பதைக் குறிக்கிறது. தமிழில் தனியாக ‘மேய்கிறார்கள்’ என்பது சகோதரர்களே புல் மேய்வதாகத் தவறாகப் புரியக்கூடும்; ஆகவே சூழலில் தெளிவாக உள்ள ‘மந்தை’ சேர்க்கப்பட்டுள்ளது.
