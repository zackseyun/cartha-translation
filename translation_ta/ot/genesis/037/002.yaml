base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/002.yaml
  text: 'These are the generations of Jacob: Joseph[a], being seventeen years old, was shepherding the flock with his brothers. He was a youth with the sons of Bilhah and the sons of Zilpah, his father''s wives[c][b], and Joseph brought a bad report about them to their father.'
translation:
  language: ta
  text: யாக்கோபின் வம்ச வரலாறு இதுவே:[a] யோசேப்புக்குப் பதினேழு வயதாயிருந்தபோது, அவன் தன் சகோதரர்களுடன் மந்தையை மேய்த்துக்கொண்டிருந்தான். இளைஞனான அவன், தன் தந்தையின் மனைவிகளான பில்காளின் மகன்களோடும் சில்பாளின் மகன்களோடும் இருந்தான்.[b] யோசேப்பு அவர்களைப் பற்றிய பாதகமான அறிக்கையை அவர்களுடைய தந்தையிடம் தெரிவித்தான்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாக்கோபின் சந்ததியினரைப் பற்றிய வரலாறு இதுவே’ அல்லது ‘யாக்கோபின் குடும்ப வரலாறு இதுவே’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஆதியாகமத்தில் புதிய பகுதியை அறிமுகப்படுத்துவதோடு, ஒருவரிடமிருந்து தொடரும் சந்ததியையும் வரலாற்றையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இந்த எபிரெயத் தொடரின் இலக்கண அமைப்பு சற்றுக் கடினமானது. பில்காள் மற்றும் சில்பாளின் மகன்களே யோசேப்புடன் மந்தையை மேய்த்த சகோதரர்கள் என்று இது விளக்குவதாகவும் புரிந்துகொள்ளலாம்.
    reason: source_ambiguity
  - marker: c
    text: ‘பாதகமான அறிக்கை’ என்பதற்கான எபிரெயச் சொல் குற்றஞ்சாட்டும் அறிக்கையையோ அவதூறையோ குறிக்கலாம். அந்த அறிக்கை உண்மையா பொய்யா என்பதை இவ்வசனம் கூறவில்லை. எபிரெயத்தில் ‘அவர்களுடைய தந்தையிடம்’ என்ற பன்மை வடிவமே உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּלְדוֹת
  choice: தலைமுறை வரலாறு
  rationale: ஆதியாகமத்தில் இது ஒரு புதிய பகுதியை அறிமுகப்படுத்தும் கட்டமைப்புச் சொல்லாகவும், ஒருவரிடமிருந்து தொடரும் சந்ததி மற்றும் வரலாற்றைக் குறிப்பதாகவும் உள்ளது. ‘தலைமுறை வரலாறு’ இந்த இரு கூறுகளையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: הָיָה רֹעֶה
  choice: மேய்த்துக்கொண்டிருந்தான்
  rationale: எபிரெயப் பங்கேற்புவினை தொடர்ந்து நடைபெற்ற செயலைக் காட்டுகிறது; இந்தத் தமிழாக்கம் அந்த நீடித்த செயற்பாட்டை வெளிப்படுத்துகிறது.
- source_word: אֶת אֶחָיו בַּצֹּאן
  choice: தன் சகோதரர்களுடன் மந்தையை
  rationale: யோசேப்பு தன் சகோதரர்களை மேய்த்தான் என்ற பொருள் வராமல், அவர்களுடன் சேர்ந்து மந்தையை மேய்த்தான் என்ற இயல்பான சூழற்பொருளைத் தருகிறது.
- source_word: נַעַר
  choice: இளைஞன்
  rationale: யோசேப்பின் வயது பதினேழு என்று தெளிவாகக் கூறப்படுவதால், ‘சிறுவன்’ என்பதைக் காட்டிலும் ‘இளைஞன்’ பொருத்தமானது; இங்கு ‘வேலைக்காரன்’ என்ற சாத்தியப் பொருள் சூழலால் கட்டாயப்படுத்தப்படவில்லை.
- source_word: אֶת בְּנֵי בִלְהָה וְאֶת בְּנֵי זִלְפָּה
  choice: பில்காளின் மகன்களோடும் சில்பாளின் மகன்களோடும்
  rationale: கடினமான எபிரெயத் தொடரை மிகையாக விளக்காமல், யோசேப்பு இந்தச் சகோதரர்களுடன் இருந்த தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: נְשֵׁי אָבִיו
  choice: தன் தந்தையின் மனைவிகளான
  rationale: பில்காளையும் சில்பாளையும் யாக்கோபின் மனைவிகளாக அடையாளப்படுத்தும் நேரடியான உடைமைத் தொடரைத் தெளிவாகக் காக்கிறது.
- source_word: דִּבָּתָם רָעָה
  choice: அவர்களைப் பற்றிய மோசமான செய்தி
  rationale: அவர்களைப் பற்றிய பாதகமான அல்லது குற்றஞ்சாட்டும் தகவல் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது; அது உண்மையா பொய்யா என்பதை உரை தீர்மானிப்பதில்லை.
- source_word: אֶל אֲבִיהֶם
  choice: அவர்களுடைய தந்தையிடம்
  rationale: எபிரெயத்தில் உள்ள பன்மை உடைமை விகுதியைத் தக்கவைத்து, யாக்கோபு யோசேப்புக்கும் அவன் சகோதரர்களுக்கும் பொதுவான தந்தை என்பதை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யோசேப்பு கொண்டுவந்த செய்தியின் உண்மைத்தன்மை
  choice: ‘மோசமான செய்தி’ என்று நடுநிலையாக மொழிபெயர்க்கப்பட்டது
  alternative: ‘அவதூறு’ அல்லது ‘அவர்களுடைய தீச்செயல்கள்’
  rationale: דִּבָּה என்ற சொல் பாதகமான அறிக்கை அல்லது அவதூறு என்ற நிழற்பொருளைக் கொள்ளலாம்; ஆனால் இங்கு அதன் உண்மைத்தன்மையையோ யோசேப்பின் நோக்கத்தையோ உரை வெளிப்படையாகத் தீர்மானிக்காததால், மொழிபெயர்ப்பும் அதைத் தீர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தலைமுறை வரலாறு’ என்ற சொற்றொடர் ஆதியாகமத்தின் கட்டமைப்புச் சூத்திரத்தைத் தக்கவைக்கிறது; மிகப் பழமையான அல்லது சமயப் பிரிவுக்கே உரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
