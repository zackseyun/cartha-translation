  to: யாக்கோபின் வம்ச வரலாறு இதுவே:[a] யோசேப்புக்குப் பதினேழு வயதாயிருந்தபோது, அவன் தன் சகோதரர்களுடன் மந்தையை மேய்த்துக்கொண்டிருந்தான். இளைஞனான அவன், தன் தந்தையின் மனைவிகளான பில்காளின் மகன்களோடும் சில்பாளின் மகன்களோடும் இருந்தான்.[b] யோசேப்பு அவர்களைப் பற்றிய பாதகமான அறிக்கையை அவர்களுடைய தந்தையிடம் தெரிவித்தான்.[c]
  rationale: 'The revision makes two low-risk stylistic and lexical improvements: it replaces the somewhat awkward heading with idiomatic “வம்ச வரலாறு,” and it uses “பாதகமான அறிக்கை” and “தெரிவித்தான்” to represent an unfavorable report clearly and naturally. The difficult Hebrew syntax, ambiguity, names, and plural possessive are retained, and all footnote anchors remain aligned with the text.'
