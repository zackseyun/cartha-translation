translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையான ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் ‘நலம்’ இருமுறை வருவதைக் காட்ட தமிழிலும் இணையான இரட்டை வாக்கிய அமைப்பு வைக்கப்பட்டுள்ளது; தேவையற்ற இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
