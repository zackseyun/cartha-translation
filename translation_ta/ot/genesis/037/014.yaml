  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ לֶךְ נָ֨א רְאֵ֜ה אֶת שְׁל֤וֹם אַחֶ֨י/ךָ֙ וְ/אֶת שְׁל֣וֹם הַ/צֹּ֔אן וַ/הֲשִׁבֵ֖/נִי דָּבָ֑ר וַ/יִּשְׁלָחֵ֨/הוּ֙ מֵ/עֵ֣מֶק חֶבְר֔וֹן וַ/יָּבֹ֖א שְׁכֶֽמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/014.yaml
  text: He said to him[a], “Go now, see about the well-being of your brothers and the well-being of the flock, and bring me word.” So he sent him from the Valley of Hebron, and he came to Shechem.
translation:
  language: ta
  text: அவர் அவனிடம், “நீ போய், உன் சகோதரர்கள் நலமாக இருக்கிறார்களா என்றும் மந்தை நலமாக இருக்கிறதா என்றும்[a] பார்த்து, எனக்குச் செய்தி கொண்டுவா” என்றார். பின்பு அவர் அவனை எப்ரோன் பள்ளத்தாக்கிலிருந்து அனுப்பினார்; அவன் சீகேமுக்கு வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நலன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் இரு இடங்களிலும் ஷாலோம் என்ற ஒரே சொல் பயன்படுத்தப்பட்டுள்ளது; அது ‘அமைதி, நலம், பாதுகாப்பான நிலை’ ஆகிய பொருள்களைக் கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶךְ נָא
  choice: நீ போய்
  rationale: לֶךְ என்பது ‘போ’ என்ற கட்டளை; נָא கட்டளையை மென்மையாக்கும் துகள். தமிழில் இயல்பான தந்தை–மகன் உரையாடலாக ‘நீ போய்’ என்பது கட்டளையின் வலிமையையும் மென்மையையும் அளவுக்கு மீறாமல் வெளிப்படுத்துகிறது.
- source_word: רְאֵה
  choice: பார்த்து
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘பார்’; இங்கு அவர்கள் எந்த நிலையில் இருக்கிறார்கள் என்று அறிந்துவருவதைக் குறிக்கிறது. ‘பார்த்து’ என்பது concrete verb-ஐயும் சூழல்சார் விசாரிப்பு உணர்வையும் தக்கவைக்கிறது.
- source_word: שְׁלוֹם
  choice: நலமாக இருக்கிறார்களா / நலமாக இருக்கிறதா
  rationale: இங்கு שׁלום என்பது மோதலின்மை மட்டுமல்ல, நலம் அல்லது பாதுகாப்பான நிலை என்பதைக் குறிக்கிறது. மனிதர்களுக்கும் மந்தைக்கும் ஏற்ற இயல்பான தமிழ் வாக்கிய அமைப்பில் இரு முறை வந்த சொல்லையும் இணையாக மொழிபெயர்க்கிறது.
- source_word: אַחֶיךָ
  choice: உன் சகோதரர்கள்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மை; சூழலில் யோசேப்பின் ஆண் சகோதரர்களையே குறிக்கிறது.
- source_word: הַצֹּאן
  choice: மந்தை
  rationale: צאן என்பது பொதுவாக ஆடுகள், வெள்ளாடுகள் அடங்கிய சிறு கால்நடை மந்தையைக் குறிக்கலாம். ‘மந்தை’ இனத்தை தேவையின்றி வரையறுக்காமல் கூட்டுப் பொருளைத் தருகிறது.
- source_word: וַהֲשִׁבֵנִי דָּבָר
  choice: எனக்குச் செய்தி கொண்டுவா
  rationale: இந்த எபிரெய மரபுத்தொடர் நிலவரத்தை அறிந்து திரும்பிவந்து தெரிவிப்பதைக் குறிக்கிறது. ‘செய்தி கொண்டுவா’ சுருக்கமாகவும் இயல்பாகவும் அந்தப் பொருளை வழங்குகிறது.
- source_word: מֵעֵמֶק חֶבְרוֹן
  choice: எப்ரோன் பள்ளத்தாக்கிலிருந்து
  rationale: עֵמֶק என்பதைக் ‘பள்ளத்தாக்கு’ என்று நேரடியாக வழங்கி, எப்ரோனுடனான construct தொடர்பைத் தக்கவைக்கிறது.
- source_word: שְׁכֶמָה
  choice: சீகேமுக்கு
  rationale: இடப்பெயருடன் சேர்ந்த directional ה சீகேமை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் ‘சீகேமுக்கு’ அதனை இயல்பாக வெளிப்படுத்துகிறது.
