  yaml_path: translation/ot/genesis/037/013.yaml
  text: Then Israel said to Joseph[a], “Are not your brothers shepherding at Shechem? Come, and I will send you to them.” And he said to him, “Here I am.”
translation:
  language: ta
  text: அப்போது இஸ்ரவேல் யோசேப்பிடம், “உன் சகோதரர்கள் சீகேமில் மந்தையை மேய்த்துக்கொண்டிருக்கிறார்கள் அல்லவா?[a] வா, நான் உன்னை அவர்களிடம் அனுப்புவேன்” என்றார். அதற்கு அவன், “இதோ, இருக்கிறேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மந்தையைப் பராமரித்துக்கொண்டிருக்கிறார்கள்” அல்லது “மந்தை மேய்க்கிறார்கள்.”
    reason: ரֹעִים என்பதன் சொற்பொருள் மாற்றுகளைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: எபிரெய மூலத்தில் இவ்வசனத்தில் ‘யாக்கோபு’ அல்ல, ‘இஸ்ரவேல்’ என்ற பெயரே உள்ளது; ஆகவே அதையே ஒலிபெயர்த்துள்ளது.
- source_word: הֲלוֹא
  choice: அல்லவா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் வினாவை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: אַחֶיךָ
  choice: உன் சகோதரர்கள்
  rationale: இரண்டாம் நபர் ஒருமை உடைமை விகுதியுடன் உள்ள ஆண்பால் பன்மைப் பெயர்ச்சொல்லின் நேரான பொருள்.
- source_word: רֹעִים
  choice: மந்தையை மேய்த்துக்கொண்டிருக்கிறார்கள்
  rationale: רעה என்பதன் நிகழ்காலச் செயற்பொருளைத் தெரிவிக்கிறது. எபிரெயத்தில் ‘மந்தை’ வெளிப்படையாக இல்லாவிட்டாலும், சூழலில் கால்நடைகளை மேய்த்துப் பராமரிக்கும் செயல் குறிக்கப்படுவதால் தமிழில் இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: בִּשְׁכֶם
  choice: சீகேமில்
  rationale: בְּ என்ற இடப்பொருள் முன்னொட்டை ‘-இல்’ எனவும், இடப்பெயரை வழக்கமான தமிழ் ஒலிபெயர்ப்பிலும் வழங்குகிறது.
- source_word: לְכָה
  choice: வா
  rationale: அழைப்பு அல்லது கட்டளைத் தன்மையுள்ள எபிரெய வினையின் நேரான, இயல்பான தமிழ் இணை.
- source_word: וְאֶשְׁלָחֲךָ
  choice: நான் உன்னை அவர்களிடம் அனுப்புகிறேன்
  rationale: கட்டளையைத் தொடர்ந்து வரும் அனுப்பும் நோக்கத்தையும் உடனடியான தீர்மானத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲלֵיהֶם
  choice: அவர்களிடம்
  rationale: முன்பு குறிப்பிடப்பட்ட சகோதரர்களைச் சுட்டும் பன்மைப் பிரதிப்பெயரை நேராகப் பிரதிபலிக்கிறது.
- source_word: הִנֵּנִי
  choice: இதோ, நான் இருக்கிறேன்
  rationale: தன்னை முன்வைத்து ஆயத்தத்தைத் தெரிவிக்கும் எபிரெயக் கூறின் இலக்கிய வடிவத்தையும் அடிப்படை உருவகத்தையும் பாதுகாக்கிறது.
