base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/010.yaml
  text: And he told it to his father and to his brothers[a], and his father rebuked him and said to him, “What is this dream that you have dreamed? Shall I and your mother and your brothers indeed come to bow down to the ground before you?”
translation:
  language: ta
  text: அவன் அந்தக் கனவைத் தன் தந்தையிடமும் தன் சகோதரர்களிடமும் சொன்னான். அவனுடைய தந்தை அவனைக் கடிந்துகொண்டு, “நீ கண்ட இந்தக் கனவு என்ன? நானும் உன் தாயும் உன் சகோதரர்களும் உண்மையிலேயே வந்து, உனக்கு முன்பாகத் தரையில் விழுந்து வணங்குவோமா?[a]” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்கு முன்பாகத் தரைவரை தாழ்ந்து வணங்குவோமா?” எபிரெய வினை ஆழ்ந்த பணிவுடன் தாழ்ந்து வணங்குவதைக் குறிக்கலாம்; இங்கு அது வழிபாட்டை அவசியமாகக் குறிப்பதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: அந்தக் கனவை ... சொன்னான்
  rationale: פיעל வடிவிலுள்ள ספר என்பது ‘சொல், விவரி’ எனப் பொருள்படும். எபிரெயத்தில் செயப்படுபொருள் சூழலால் விளங்குகிறது; தமிழில் இயல்பாக இருக்க ‘அந்தக் கனவை’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אָבִיו ... אֶחָיו
  choice: தன் தந்தை ... தன் சகோதரர்கள்
  rationale: உறவுமுறைச் சொற்களின் நேரான, நவீனத் தமிழ் வடிவம்; எபிரெய மூலத்தின் ஆண்பால் பன்மையை ‘சகோதரர்கள்’ காக்கிறது.
- source_word: וַיִּגְעַר בּוֹ
  choice: அவனைக் கடிந்துகொண்டு
  rationale: גער கடுமையான வாய்மொழிக் கண்டிப்பைக் குறிக்கிறது. ‘கடிந்துகொண்டு’ என்பது அதன் வலிமையைக் காக்கும் இயல்பான தமிழ்.
- source_word: מָה הַחֲלוֹם הַזֶּה אֲשֶׁר חָלָמְתָּ
  choice: நீ கண்ட இந்தக் கனவு என்ன?
  rationale: எபிரெய வினாவினுடைய கண்டிக்கும் தொனியையும் ‘கனவு’ என்ற சொல்லின் கருத்துத் திருப்பத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הֲבוֹא נָבוֹא
  choice: உண்மையிலேயே வந்து ... வணங்குவோமா?
  rationale: முற்றுவினைக்கு முன் வரும் infinitive absolute செயலை வலியுறுத்துகிறது. ‘உண்மையிலேயே’ அந்த வலியுறுத்தலையும் நம்பமுடியாத வினாத் தொனியையும் வெளிப்படுத்துகிறது.
- source_word: אֲנִי וְאִמְּךָ וְאַחֶיךָ
  choice: நானும் உன் தாயும் உன் சகோதரர்களும்
  rationale: மூலத்தில் பட்டியலிடப்பட்ட மூன்று எழுவாய்களையும் அதே வரிசையில் தெளிவாகக் காக்கிறது.
- source_word: לְהִשְׁתַּחֲוֺת לְךָ
  choice: உனக்கு முன்பாக ... குனிந்து வணங்குவோமா
  rationale: השׁתחוה இச்சூழலில் வழிபாட்டைக் கட்டாயமாகக் குறிக்காமல் ஆழ்ந்த பணிவைக் குறிக்கிறது. ‘குனிந்து வணங்கு’ குடும்ப அதிகாரத்துக்கு அடங்கும் உடல்செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: אָרְצָה
  choice: தரைவரை
  rationale: திசைச்சுட்டு முடிவுடன் வரும் ‘நிலம்’ என்ற சொல், வணங்கும்போது தரையை நோக்கித் தாழ்வதைக் குறிக்கிறது; ‘தரைவரை’ இதைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: தெய்வவழிபாடு அல்லாத சூழலில் השתחוה என்பதன் பொருள்
  choice: தரைவரை குனிந்து வணங்குவோமா
  alternative: உன்னை வழிபடுவோமா
  rationale: இந்த வினை தெய்வத்தைச் சார்ந்த சூழல்களில் வழிபாட்டைக் குறிக்கலாம். ஆனால் இங்கு யோசேப்பின் கனவுக்குப் பதிலாக குடும்பத்தினர் அவனுக்கு அடங்கி மரியாதை செலுத்துவதை யாக்கோபு குறிப்பிடுகிறார். ஆகவே வழிபாடு என்ற இறையியல் பொருளைத் தேவையின்றி புகுத்தாமல் சமூகப் பணிவை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் அதேவேளை கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. யாக்கோபின் கண்டிப்பும் நம்பமுடியாத வினாத் தொனியும் காக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு அதன் உண்மையான சொற்பொருள் சார்ந்த இடமான ‘குனிந்து வணங்குவோமா’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
