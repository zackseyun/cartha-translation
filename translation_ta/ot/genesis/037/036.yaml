translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘அதிகாரி’ மற்றும் ‘காவற்படைத் தலைவர்’ ஆகியவை வாசிப்புத் தெளிவை அளிக்கின்றன; மூலச்சொற்களின் உண்மையான பொருள் விரிவும் மாற்று வாய்ப்புகளும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் தொடர்புடைய சொற்களின் உடனே வைக்கப்பட்டுள்ளன.
