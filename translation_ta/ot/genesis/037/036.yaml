  yaml_path: translation/ot/genesis/037/036.yaml
  text: Meanwhile[a], the Medanites sold him into Egypt to Potiphar, an officer of Pharaoh[c][b], the captain of the guard.
translation:
  language: ta
  text: இதற்கிடையில், மேதானியர்கள்[a] அவனை எகிப்துக்கு, பார்வோனின் அதிகாரியும்[b] காவற்படைத் தலைவனுமான[c] போத்திபாரிடம் விற்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில் ‘மேதானியர்கள்.’ சுற்றியுள்ள கதையையும் பழங்கால மொழிபெயர்ப்புகளையும் கருத்தில் கொண்டு, இங்கு ‘மீதியானியர்கள்’ என்றே பாரம்பரியமாகப் புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: ‘பார்வோனின் விதையறுக்கப்பட்டவர்’ அல்லது ‘பார்வோனின் அரசவை அதிகாரி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் உடல்ரீதியாக விதையறுக்கப்பட்ட ஒருவரையோ ஓர் அரச அதிகாரியையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லெழுத்தாக, ‘கொல்பவர்களின் தலைவர்.’ அரசவைக் சூழலில் இது காவற்படை அல்லது மெய்க்காவற்படையின் தலைவரைக் குறித்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּדָנִים
  choice: இதற்கிடையில், மேதானியர்கள்
  rationale: וְ என்ற இணைப்பை நிகழ்விட மாற்றத்தை இயல்பாகக் காட்டும் ‘இதற்கிடையில்’ என்று மொழிபெயர்த்தோம். WLC உரையிலுள்ள மְדָנִים என்பதற்கு நேரான இனப்பெயர் ‘மேதானியர்கள்’; சுற்றியுள்ள கதையில் வரும் மீதியானியர்களோடு இவர்களை அடையாளப்படுத்தும் பாரம்பரியப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מָכְרוּ אֹתוֹ אֶל מִצְרָיִם
  choice: அவனை எகிப்துக்குக் கொண்டுபோய் … விற்றார்கள்
  rationale: מָכְרוּ אֹתוֹ என்பது ‘அவனை விற்றார்கள்.’ אֶל מִצְרָיִם திசையைக் குறிப்பதால், நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க ‘எகிப்துக்குக் கொண்டுபோய்’ என அமைக்கப்பட்டது; விற்பனை எகிப்தை இலக்காகக் கொண்டிருந்தது என்பதும் இதனால் நிலைக்கிறது.
- source_word: לְפוֹטִיפַר
  choice: போத்திபாரிடம்
  rationale: לְ வாங்கியவரைக் குறிக்கிறது; தமிழில் விற்பனையின் பெறுநரை ‘-இடம்’ வேற்றுமையால் இயல்பாகக் குறித்தோம்.
- source_word: סְרִיס פַּרְעֹה
  choice: பார்வோனின் அதிகாரி
  rationale: סָרִיס என்பது சொற்பொருளில் ‘அலி’ என்றும் அரசவையின் ஓர் அதிகாரி என்றும் வரலாம். பாலியல் நிலையைத் தீர்மானிக்காமல், இச்சூழலுக்கு ஏற்ற பரந்த பொருளான ‘அதிகாரி’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שַׂר הַטַּבָּחִים
  choice: காவற்படைத் தலைவர்
  rationale: சொல்லெழுத்தாக இது ‘கொல்பவர்களின் தலைவர்.’ அரசவைக் சூழலில் மெய்க்காவல், காவல் அல்லது தண்டனை நிறைவேற்றும் படையின் தலைமைப் பதவியைக் குறிக்கலாம்; தமிழில் ‘காவற்படைத் தலைவர்’ தெளிவானதும் அளவுக்கு மீறித் தீர்மானிக்காததுமாகும்.
