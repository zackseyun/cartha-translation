  yaml_path: translation/ot/genesis/037/011.yaml
  text: So his brothers were jealous of him[a], but his father kept the matter in mind.
translation:
  language: ta
  text: அவனுடைய சகோதரர்கள் அவன்மீது பொறாமைப்பட்டார்கள்; ஆனால் அவனுடைய தந்தையோ அந்தக் காரியத்தை மனத்தில் வைத்திருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தச் சொல்லை மனத்தில் வைத்திருந்தார்”; அதாவது, யோசேப்பு கூறியதை அவர் நினைவில் வைத்துத் தொடர்ந்து சிந்தித்தார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנְאוּ
  choice: பொறாமைப்பட்டார்கள்
  rationale: קנא இச்சூழலில் யோசேப்பைக் குறித்து அவனுடைய சகோதரர்கள் கொண்ட பொறாமையைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் மூலத்தின் உணர்வுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: בּוֹ
  choice: அவன்மீது
  rationale: קנא என்பதுடன் வரும் ב, பொறாமையின் இலக்கைச் சுட்டுகிறது; தமிழில் ‘அவன்மீது பொறாமைப்பட்டார்கள்’ என்பது இயல்பான இணைவு.
- source_word: אֶחָיו
  choice: அவனுடைய சகோதரர்கள்
  rationale: இங்கு ஆண்பால் பன்மை வடிவம் கதையில் யோசேப்பின் சகோதரர்களையே குறிக்கிறது.
- source_word: וְאָבִיו
  choice: ஆனால் அவனுடைய தந்தையோ
  rationale: וְ என்பதன் அடிப்படைப் பொருள் ‘மற்றும்’ என்றாலும், சகோதரர்களின் பொறாமைக்கும் தந்தையின் சிந்தனைமிக்க எதிர்வினைக்கும் இடையிலுள்ள முரணை ‘ஆனால்…தந்தையோ’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׁמַר
  choice: மனத்தில் வைத்திருந்தார்
  rationale: שׁמר என்பதன் அடிப்படை உணர்வு ‘காத்தல்/வைத்திருத்தல்’; இங்கு கூறப்பட்டதை மறக்காமல் கவனத்தில் வைத்திருப்பதைக் குறிக்கும் எபிரேய வழக்கை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶת־הַדָּבָר
  choice: அந்தக் காரியத்தை
  rationale: דָּבָר என்பதற்கு ‘சொல்,’ ‘செய்தி,’ ‘காரியம்’ ஆகிய பொருள்கள் உண்டு. இங்கு யோசேப்பின் கனவுக் கூற்றையும் அதன் முக்கியத்துவத்தையும் உள்ளடக்க ‘அந்தக் காரியம்’ போதிய அகலத்துடன் உள்ளது.
