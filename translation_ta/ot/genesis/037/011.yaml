translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தந்தையோ’ என்ற வடிவம் இரு எதிர்வினைகளுக்கிடையிலான முரணைத் தெளிவுபடுத்துகிறது; அடிப்படை எபிரேயச் சொற்றொடரின் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
