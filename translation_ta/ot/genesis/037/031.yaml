  text: וַ/יִּקְח֖וּ אֶת כְּתֹ֣נֶת יוֹסֵ֑ף וַֽ/יִּשְׁחֲטוּ֙ שְׂעִ֣יר עִזִּ֔ים וַ/יִּטְבְּל֥וּ אֶת הַ/כֻּתֹּ֖נֶת בַּ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/031.yaml
  text: Then they took Joseph’s tunic[a], slaughtered a male goat, and dipped the tunic in the blood.
translation:
  language: ta
  text: பின்பு அவர்கள் யோசேப்பின் அங்கியை[a] எடுத்து, ஒரு வெள்ளாட்டுக்கடாவை அறுத்து, அந்த அங்கியை இரத்தத்தில் தோய்த்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மேலங்கி’ அல்லது ‘ஆடை’; எபிரெயச் சொல் அங்கி-வகை ஆடையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: பின்பு அவர்கள் எடுத்துக்கொண்டு
  rationale: வய்யிக்தோல் வடிவம் கதையின் அடுத்தடுத்த நிகழ்வை முன்னெடுக்கிறது. நவீன தமிழில் ‘பின்பு’ அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது; ‘எடுத்துக்கொண்டு’ அடுத்த செயலோடு இதை இணைக்கிறது.
- source_word: כְּתֹנֶת יוֹסֵף
  choice: யோசேப்பின் அங்கி
  rationale: כְּתֹנֶת என்பது உடலை மூடும் நீளமான அங்கி போன்ற ஆடையைக் குறிக்கிறது. ‘அங்கி’ என்பது ‘சட்டை’ அல்லது நவீன மேலாடையை நினைவூட்டும் சொற்களைவிட மூலத்துக்கு நெருக்கமான, இயல்பான தமிழ்ச் சொல்.
- source_word: וַיִּשְׁחֲטוּ
  choice: அறுத்து
  rationale: இந்த வினை விலங்கைக் கழுத்தறுத்துக் கொல்வதைக் குறிப்பாகக் குறிக்கிறது. தமிழில் விலங்கைப் பற்றிய சூழலில் ‘அறுத்து’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: שְׂעִיר עִזִּים
  choice: ஒரு ஆண் வெள்ளாடு
  rationale: இச்சொற்றொடர் ஆண் வெள்ளாட்டைக் குறிப்பிடுகிறது. பாலின வேறுபாட்டை விடாமல் தெளிவாகத் தெரிவிக்க ‘ஆண் வெள்ளாடு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיִּטְבְּלוּ
  choice: தோய்த்தார்கள்
  rationale: இந்த வினை ஒரு பொருளைத் திரவத்தில் அமிழ்த்துதல் அல்லது தோய்த்தல் என்று பொருள்படும். ஆடையை இரத்தத்தில் இடும் இச்சூழலில் ‘தோய்த்தார்கள்’ இயல்பான தமிழ்.
- source_word: הַכֻּתֹּנֶת
  choice: அந்த அங்கி
  rationale: முன்னர் குறிப்பிடப்பட்ட யோசேப்பின் அங்கியையே சுட்டுவதால், தமிழில் தெளிவுக்காக ‘அந்த அங்கி’ என்று வழங்கப்பட்டுள்ளது.
- source_word: בַּדָּם
  choice: அதன் இரத்தத்தில்
  rationale: எபிரெய உரையில் உள்ள குறிப்பிட்ட இரத்தம், உடனே முன்பு அறுக்கப்பட்ட ஆண் வெள்ளாட்டின் இரத்தத்தைக் குறிக்கிறது. தமிழில் அந்தத் தொடர்பை இயல்பாகத் தெளிவுபடுத்த ‘அதன் இரத்தத்தில்’ என வழங்கப்பட்டுள்ளது.
