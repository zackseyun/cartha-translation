  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்திலுள்ள ‘அங்கி’ என்ற மறுகூற்றை இடைக்கோடுகளுடன் தக்கவைத்து, அதன் வலியுறுத்தலும் அடையாளப்படுத்தும் செயல்பாடும் பாதுகாக்கப்பட்டுள்ளன.
