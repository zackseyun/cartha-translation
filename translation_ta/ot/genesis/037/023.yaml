  text: וַֽ/יְהִ֕י כַּֽ/אֲשֶׁר בָּ֥א יוֹסֵ֖ף אֶל אֶחָ֑י/ו וַ/יַּפְשִׁ֤יטוּ אֶת יוֹסֵף֙ אֶת כֻּתָּנְתּ֔/וֹ אֶת כְּתֹ֥נֶת הַ/פַּסִּ֖ים אֲשֶׁ֥ר עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/023.yaml
  text: And when Joseph came to his brothers[a], they stripped Joseph of his tunic, the tunic of many colors that was on him.
translation:
  language: ta
  text: யோசேப்பு தன் சகோதரர்களிடம் வந்தபோது, அவர்கள் யோசேப்பின் அங்கியை—அவன் அணிந்திருந்த அந்தச் சிறப்பான அங்கியை[a]—யோசேப்பிடமிருந்து கழற்றினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீண்ட கைப்பகுதிகளுள்ள அங்கி’ அல்லது ‘செழுமையாக அலங்கரிக்கப்பட்ட அங்கி’ என்றும் மொழிபெயர்க்கலாம். כְּתֹנֶת הַפַּסִּים என்ற எபிரெயச் சொற்றொடரின் பொருள் உறுதியில்லை; பாரம்பரியமான ‘பல வண்ண அங்கி’ என்பதும் சாத்தியம், ஆனால் அதற்கான வாய்ப்பு குறைவு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: வந்தபோது
  rationale: எபிரெயக் கதைநடைத் தொடர் சூத்திரத்தைத் தமிழில் சொற்சொல்லாகக் கடினப்படுத்தாமல், நிகழ்வின் காலத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּא ... אֶל אֶחָיו
  choice: தன் சகோதரர்களிடம் வந்தபோது
  rationale: இச்சூழலில் אֶחָיו யோசேப்பின் ஆண் உடன்பிறந்தவர்களைக் குறிக்கிறது; ‘சகோதரர்கள்’ மூலத்தின் பாலினத்தையும் உறவையும் துல்லியமாகத் தருகிறது.
- source_word: וַיַּפְשִׁיטוּ
  choice: உருவிக் கழற்றினார்கள்
  rationale: ஒருவரிடமிருந்து உடையை அகற்றும் செயலைக் குறிக்கும் வினையின் வலிமையை, வெறும் ‘கழற்றினார்கள்’ என்பதைக் காட்டிலும் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כֻּתָּנְתּוֹ
  choice: யோசேப்பின் அங்கி
  rationale: כֻּתֹּנֶת என்பது உடலில் அணியும் அங்கி போன்ற ஆடையைக் குறிக்கிறது; தமிழில் ‘அங்கி’ சுருக்கமாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: அந்தச் சிறப்பான அங்கி
  rationale: פַּסִּים என்பதன் துல்லியமான பொருள் உறுதியில்லை. ‘சிறப்பான’ என்பது பல வண்ணம், நீளமான கைப்பகுதி, அலங்கார வேலைப்பாடு ஆகியவற்றில் ஒன்றைத் தீர்மானமாகத் திணிக்காமல், அந்த ஆடையின் தனித்தன்மையை வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר עָלָיו
  choice: அவன் அணிந்திருந்த
  rationale: ‘அவன்மேல் இருந்த’ என்ற சொற்சொல் வடிவத்தைவிட, அந்த நேரத்தில் யோசேப்பு அந்த ஆடையை அணிந்திருந்தான் என்பதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
