  yaml_path: translation/ot/genesis/037/024.yaml
  text: Then they took him and threw him into the pit[a]. Now the pit was empty; there was no water in it.
translation:
  language: ta
  text: அவர்கள் அவனை எடுத்துக்கொண்டு, அந்தக் குழிக்குள்[a] எறிந்தார்கள். அந்தக் குழி காலியாக இருந்தது; அதில் தண்ணீர் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குழி’ என்பதற்குப் பதிலாக ‘நீர்த்தொட்டி’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல்லான בּוֹר (போர்) தண்ணீர் சேமிக்கும் குழியைக் குறிக்கக்கூடும். அதில் தண்ணீர் இல்லை என்ற அடுத்த கூற்றுக்கு இது பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֻהוּ
  choice: பின்பு அவர்கள் அவனைப் பிடித்து
  rationale: வாவ்-தொடர்வினை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது. לָקַח என்பதன் அடிப்படைப் பொருளைத் தக்கவைத்தபடி, இச்சூழலில் ஒருவரைப் பிடித்துச் செல்வதைக் குறிக்கும் இயல்பான நவீனத் தமிழாக அமைக்கப்பட்டுள்ளது; ‘கைப்பற்றினர்’ என்பது தேவையற்ற தீவிரத்தைச் சேர்க்கலாம்.
- source_word: וַיַּשְׁלִכוּ אֹתוֹ
  choice: அவனை ... எறிந்தார்கள்
  rationale: השליך என்பது ‘எறிதல்/வீசுதல்’ என்று பொருள்படும். ‘எறிந்தார்கள்’ வன்மையான செயலைத் தெளிவாகவும் மிகைப்படுத்தாமலும் தெரிவிக்கிறது.
- source_word: הַבֹּרָה
  choice: அந்தக் குழிக்குள்
  rationale: בּוֹר என்பது குழி, நீர்த்தொட்டி, அல்லது ஆழமான பள்ளம் ஆகியவற்றைக் குறிக்கலாம். தண்ணீர் இல்லை என்ற அடுத்த கூற்று நீர் சேமிப்புக் குழியைக் குறிப்பதாக இருக்கக்கூடும்; எனினும் ‘குழி’ மூலச்சொல்லின் பரந்த பொருளையும் தெளிவின்மையையும் காக்கிறது.
- source_word: וְהַבּוֹר רֵק
  choice: அந்தக் குழி காலியாக இருந்தது
  rationale: இக்கூற்று பின்னணி விளக்கத்தை அளிக்கிறது. ‘காலியாக இருந்தது’ רֵק என்பதன் நேரடியான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֵין בּוֹ מָיִם
  choice: அதில் தண்ணீர் இல்லை
  rationale: குழி எந்த விதத்தில் காலியாக இருந்தது என்பதை இக்கூற்று விளக்குகிறது. மூலத்தில் வெளிப்படையாக உள்ள ‘தண்ணீர்’ என்பதையும் சுருக்கமான இயல்பான தமிழையும் தக்கவைக்கிறது.
