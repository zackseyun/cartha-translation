translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை ஆண் நபருக்கான மரியாதை வினைமுற்று இஸ்ரவேலுக்கு பயன்படுத்தப்பட்டு, யோசேப்பைக் குறிக்க ‘அவன்’ பயன்படுத்தப்பட்டுள்ளது. எபிரேய ஆடைச் சொல்லின் உண்மையான தெளிவின்மை பிரதான உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
