base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/003.yaml
  text: Israel loved Joseph more than all his sons[a], because he was the son of his old age; and he made for him a richly ornamented robe.
translation:
  language: ta
  text: இஸ்ரவேல் தன் மகன்கள் எல்லாரையும்விட யோசேப்பை அதிகமாக நேசித்தார்; ஏனெனில், அவன் அவருடைய முதிர்வயதின் மகன். அவர் அவனுக்குச் சிறப்பாக அலங்கரிக்கப்பட்ட ஓர் அங்கியை[a] செய்துகொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபுவழியாக, “பல நிறங்களுள்ள ஓர் அங்கி.” இதற்கான எபிரேயச் சொற்றொடரின் பொருள் உறுதியற்றது; அது சிறப்பாக அலங்கரிக்கப்பட்ட ஓர் ஆடையையோ, குறிப்பாக அதன் நிறங்களைக் குறிக்காமல் மணிக்கட்டுகள் வரையும் கணுக்கால்கள் வரையும் நீண்ட ஓர் ஆடையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: எபிரேய உரையில் பயன்படுத்தப்பட்ட தனிப்பெயர் ‘இஸ்ரவேல்’ அப்படியே வைக்கப்படுகிறது. தொடக்க וְ என்பது கதைத் தொடரை இணைக்கிறது; தமிழில் தனியாக ‘மேலும்’ என்று மொழிபெயர்ப்பது இயல்பற்றதாக இருப்பதால் வெளிப்படையாகக் காட்டப்படவில்லை.
- source_word: אָהַב
  choice: அதிகமாக நேசித்தார்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘நேசித்தார்.’ மִכָּל என்ற ஒப்பீட்டுத் தொடருடன் சேர்ந்து வரும் அதிகப்படியான நேசத்தைத் தெளிவாகக் காட்ட ‘அதிகமாக’ சேர்க்கப்பட்டுள்ளது; ‘பாரபட்சம் காட்டினார்’ என்று விளக்கமாக மாற்றப்படவில்லை.
- source_word: מִכָּל בָּנָיו
  choice: தன் மகன்கள் எல்லாரையும்விட
  rationale: מִן + כֹּל தரும் ஒப்பீட்டுப் பொருளையும், בָּנִים என்பதன் ஆண்பால் பன்மையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: כִּי בֶן זְקֻנִים הוּא לוֹ
  choice: ஏனெனில், அவன் அவருக்கு முதிர்வயதில் பிறந்த மகன்
  rationale: כִּי காரணத்தை அறிமுகப்படுத்துகிறது. ‘முதிர்வயதின் மகன்’ என்ற எபிரேய மரபுத்தொடரின் இயல்பான தமிழ் பொருள் இவ்வாறு தரப்படுகிறது; ‘பிறந்த’ என்பது தமிழில் உறவைத் தெளிவுபடுத்தும் மொழியியல் விரிவாக்கம்.
- source_word: וְעָשָׂה לוֹ
  choice: அவர் அவனுக்குச் … செய்துகொடுத்தார்
  rationale: לוֹ என்பதிலுள்ள பயனாளிப் பொருளை இயல்பான தமிழில் ‘அவனுக்குச் செய்துகொடுத்தார்’ என்று வெளிப்படுத்துகிறது.
- source_word: כְּתֹנֶת
  choice: அங்கி
  rationale: உடலில் அணியும் நீளமான ஆடையைக் குறிக்கும் சொல்லுக்கு, நவீனத் தமிழில் கண்ணியமானதும் புரிந்துகொள்ளத்தக்கதுமான ‘அங்கி’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: פַּסִּים
  choice: சிறப்பாக அலங்கரிக்கப்பட்ட
  rationale: இந்தச் சொல்லின் துல்லியமான பொருள் உறுதியற்றது. நிறங்கள் மட்டுமே என்று முடிவுசெய்யாமலும், நீண்ட கை அல்லது முழுநீள ஆடை என்ற ஓர் ஆய்வுக் கருத்தை மட்டும் பிரதான உரையில் உறுதிப்படுத்தாமலும், பொதுவான விளக்கமாக இது தரப்படுகிறது; மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் வைக்கப்படுகின்றன.
