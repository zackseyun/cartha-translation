base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/028.yaml
  text: Then Midianite men[a], traders, passed by; and they pulled Joseph up and lifted him out of the pit, and sold Joseph to the Ishmaelites for twenty pieces of silver[c][b]. Then they brought Joseph to Egypt.
translation:
  language: ta
  text: அப்போது மீதியானிய வணிகர்கள் கடந்து சென்றார்கள். அவர்கள் யோசேப்பைக் குழியிலிருந்து இழுத்து மேலே தூக்கி, அவனை இஸ்மவேலரிடம் இருபது வெள்ளிக்கு[a] விற்றார்கள்.[b] பின்பு அவர்கள் யோசேப்பை எகிப்துக்குக் கொண்டுசென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இருபது வெள்ளிக்கு”; அளவின் அலகு வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: மீதியானிய வணிகர்களும் இஸ்மவேலரும் குறிப்பிடப்பட்டுள்ள நிலையில், “இழுத்தார்கள்,” “மேலே தூக்கினார்கள்,” “விற்றார்கள்,” “கொண்டுசென்றார்கள்” என்பவை அனைத்தும் எபிரெயத்தில் பன்மை வினைகளாக உள்ளன. ஒவ்வொரு கட்டத்திலும் எந்தக் குழு செயல்பட்டது என்பது ஓரளவு தெளிவற்றதாகவே உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: அங்கே கடந்து சென்றார்கள்
  rationale: עבר என்பதன் இடத்தைக் கடந்து செல்லும் கதையோட்டப் பொருளை இயல்பான நவீன தமிழில் தருகிறது; வெறுமனே ‘வந்தார்கள்’ என்று மாற்றவில்லை.
- source_word: אֲנָשִׁים מִדְיָנִים סֹחֲרִים
  choice: வியாபாரிகளான மீதியானிய ஆண்கள்
  rationale: ‘ஆண்கள்’, ‘மீதியானியர்’, ‘வியாபாரிகள்’ என்ற மூன்று மூலக் கூறுகளையும் இயல்பான தமிழ் தொடரில் காக்கிறது.
- source_word: וַיִּמְשְׁכוּ וַיַּעֲלוּ ... מִן הַבּוֹר
  choice: பிடித்து இழுத்து, குழியிலிருந்து மேலே தூக்கி
  rationale: משך மற்றும் עלה என்னும் இரு வினைகளையும் தனித்தனியாக வெளிப்படுத்தி, குழியிலிருந்து மேல்நோக்கிய இயக்கத்தையும் தெளிவாக்குகிறது.
- source_word: לַיִּשְׁמְעֵאלִים
  choice: இஸ்மவேலரிடம்
  rationale: விற்பனையின் பெறுநராக மூலத்தில் குறிப்பிடப்பட்ட இனக்குழுவை அப்படியே காக்கிறது.
- source_word: בְּעֶשְׂרִים כָּסֶף
  choice: இருபது வெள்ளிக்காசுகளுக்கு
  rationale: எபிரெயத்தில் அளவின் அலகு வெளிப்படையாக இல்லாததால் ‘சேக்கல்’ என்று சேர்க்காமல், தமிழில் புரியக்கூடிய பொதுவான சொல்லை பயன்படுத்துகிறது; இதன் விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִצְרָיְמָה
  choice: எகிப்துக்குக்
  rationale: திசையைக் குறிக்கும் இறுதியை, இலக்கை நோக்கிய இயக்கமாக இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: மீதியானிய வியாபாரிகளும் இஸ்மவேலரும் குறிப்பிடப்பட்ட பின் வரும் பன்மை வினைகளின் எழுவாய்
  choice: ‘அவர்கள்’ என்று பொதுவான பன்மையைப் பயன்படுத்தி எழுவாயைத் தீர்மானிக்காமல் விடுதல்
  alternative: அனைத்துச் செயல்களையும் மீதியானியருக்கோ, விற்பனை மற்றும் கொண்டுசெல்லுதலை இஸ்மவேலருக்கோ வெளிப்படையாக உரியதாக்குதல்
  rationale: எபிரெய உரையில் தொடர்ச்சியாகப் பன்மை வினைகள் மட்டுமே உள்ளதால், ஒவ்வொரு செயலும் எந்தக் குழுவுக்குரியது என்பதில் நிலவும் உண்மையான தெளிவின்மையை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், கண்ணியமான கதையாடல் நடை. ‘குழி’ என்பது בור என்பதற்கான இயல்பான சூழல்சார் தெரிவு; ‘நீர்த்தொட்டி’ என்ற சாத்தியத்தை தேவையின்றி முன்னிறுத்தவில்லை. மூலத்தின் இரு இயக்க வினைகளும் காக்கப்பட்டுள்ளன; இனக்குழுக்களுக்கிடையேயான எழுவாய் தெளிவின்மை தீர்க்கப்படவில்லை.
