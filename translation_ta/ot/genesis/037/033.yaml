  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதும் கண்ணியமானதுமான நடையுடன் மொழிபெயர்க்கப்பட்டது. மூலத்தின் சுருக்கமான தீர்மானத் தொனியும் இறுதி வினையின் வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
