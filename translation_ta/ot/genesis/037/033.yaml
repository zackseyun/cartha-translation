base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/033.yaml
  text: He recognized it and said[a], “It is my son’s tunic. A wild animal has devoured him[c][b]. Yosef has surely been torn to pieces.”
translation:
  language: ta
  text: அவர் அதை அடையாளம் கண்டு, “இது என் மகனுடைய அங்கி. ஒரு கொடிய விலங்கு அவனை விழுங்கிவிட்டது. யோசேப்பு நிச்சயமாகத் துண்டு துண்டாகக் கிழிக்கப்பட்டான்.”[a] என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயில் வினை வலியுறுத்தலாக மீண்டும் கூறப்பட்டுள்ளது: “கிழித்து, நிச்சயமாகக் கிழிக்கப்பட்டான்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכִּירָהּ
  choice: அவர் அதை அடையாளம் கண்டு
  rationale: נכר என்பதன் ஹிஃபில் வடிவம் ‘அடையாளம் காணுதல்’ என்று பொருள்படும். பெண்பால் ஒருமை பின்னொட்டு, பெண்பாலான அங்கியைக் குறிக்கிறது; தமிழில் இயல்பாக ‘அதை’ என வழங்கப்பட்டது.
- source_word: כְּתֹנֶת בְּנִי
  choice: என் மகனுடைய அங்கி
  rationale: כְּתֹנֶת என்பது உடலில் அணியும் நீளமான ஆடையைக் குறிக்கிறது. நவீனத் தமிழில் dignifiedவும் தெளிவாகவும் உள்ள ‘அங்கி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: חַיָּה רָעָה
  choice: ஒரு கொடிய விலங்கு
  rationale: חַיָּה என்பது இச்சூழலில் விலங்கைக் குறிக்கிறது; רָעָה அதன் தீங்கு விளைவிக்கும் அல்லது கொடூரமான தன்மையைச் சுட்டுகிறது. ‘கொடிய விலங்கு’ மூலத்தின் இரு கூறுகளையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: אֲכָלָתְהוּ
  choice: அவனை விழுங்கிவிட்டது
  rationale: விலங்கு தாக்கும் சூழலில் ‘விழுங்கிவிட்டது’ என்பது வெறும் ‘தின்றது’ என்பதைக் காட்டிலும் predatory force-ஐ இயல்பாக வெளிப்படுத்துகிறது; முடிவுற்ற செயலும் அதன் விளைவும் ‘விட்டது’ மூலம் தெரிவிக்கப்படுகின்றன.
- source_word: טָרֹף טֹרַף
  choice: நிச்சயமாகக் கிழித்துப்போடப்பட்டான்
  rationale: வினையெச்ச முழுவடிவத்துடன் வரும் செயப்பாட்டு வினை எபிரெயில் வலியுறுத்தலைக் காட்டுகிறது. ‘நிச்சயமாக’ அந்த வலியுறுத்தலைத் தருகிறது; ‘கிழித்துப்போடப்பட்டான்’ விலங்கால் துண்டாடப்பட்ட வன்முறையான பொருளை இயல்பாகக் கொடுக்கிறது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழின் நிலையான வேதாகமப் பெயர்வடிவத்திலும் இயல்பான தமிழ் ஒலியமைப்பிலும் வழங்குகிறது.
