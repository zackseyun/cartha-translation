- from: அவர் அதை அடையாளம் கண்டு, “இது என் மகனுடைய அங்கி. ஒரு கொடிய விலங்கு அவனை விழுங்கிவிட்டது. யோசேப்பு நிச்சயமாகக் கிழித்துப்போடப்பட்டான்” என்றார்.[a]
  to: அவர் அதை அடையாளம் கண்டு, “இது என் மகனுடைய அங்கி. ஒரு கொடிய விலங்கு அவனை விழுங்கிவிட்டது. யோசேப்பு நிச்சயமாகத் துண்டு துண்டாகக் கிழிக்கப்பட்டான்.”[a] என்றார்.
