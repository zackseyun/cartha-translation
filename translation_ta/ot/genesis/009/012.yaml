- from: 'கடவுள் சொன்னார்: “இதுவே எனக்கும் உங்களுக்கும், உங்களோடு இருக்கும் எல்லா உயிரினங்களுக்கும் இடையே, என்றென்றும் வரும் தலைமுறைகளுக்காக நான் கொடுக்கிற[a] உடன்படிக்கையின் அடையாளம்[b]:”'
