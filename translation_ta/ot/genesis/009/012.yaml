source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים זֹ֤את אֽוֹת הַ/בְּרִית֙ אֲשֶׁר אֲנִ֣י נֹתֵ֗ן בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֛ין כָּל נֶ֥פֶשׁ חַיָּ֖ה אֲשֶׁ֣ר אִתְּ/כֶ֑ם לְ/דֹרֹ֖ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/012.yaml
  text: And God said[a], “This is the sign of the covenant that I am giving between me and you and every living creature that is with you[b], for perpetual generations:”
translation:
  language: ta
  text: 'கடவுள் சொன்னார்: “எனக்கும் உங்களுக்கும், உங்களோடு இருக்கும் எல்லா உயிரினங்களுக்கும் இடையே நான் கொடுக்கிற உடன்படிக்கையின் அடையாளம் இதுவே: தலைமுறைதோறும் என்றென்றும்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது, “எல்லாத் தலைமுறைகளுக்கும்” அல்லது “நிரந்தரமான தலைமுறைகளுக்காக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: சொன்னார்
  rationale: வாவ் தொடர்கதை வரிசையை முன்னெடுக்கிறது; தமிழில் தனியாக ‘அப்போது’ அல்லது ‘மேலும்’ சேர்க்காமலேயே வினைமுற்று இயல்பாக அந்தத் தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: நோவாவிடம் பேசும் ஒரே கடவுளைக் குறிக்கும் இச்சூழலில், நவீன பொதுத் தமிழுக்குரிய வழக்கமான பதம்.
- source_word: אוֹת
  choice: அடையாளம்
  rationale: காணக்கூடிய குறியையோ சான்றையோ குறிக்கும் சொல்லாகவும், அடுத்த வசனங்களின் வானவில் சூழலுக்கும் ஏற்றதாகவும் உள்ளது.
- source_word: הַבְּרִית
  choice: உடன்படிக்கை
  rationale: ஆதியாகமம் முழுவதிலும் வரும் முக்கியமான בְּרִית என்ற சொல்லுக்கு தெளிவான, நிலையான தமிழ் இணைச்சொல்.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: நான் கொடுக்கிற
  rationale: נֹתֵן என்பதன் ‘கொடுக்கிற’ என்ற நேரடிப் பொருளையும் அதன் நிகழ்கால/தொடர்நிலைத் தன்மையையும் காக்கிறது; ‘ஏற்படுத்துகிற’ என விளக்கி மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין
  choice: எனக்கும் உங்களுக்கும் ... இடையே
  rationale: உடன்படிக்கையில் சம்பந்தப்பட்ட தரப்புகளின் உறவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; மூலத்தில் மீண்டும் வரும் ‘இடையே’ என்ற அமைப்பு தமிழில் ஒரே சொல்லால் இணைக்கப்பட்டுள்ளது.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: எல்லா உயிரினங்களுக்கும்
  rationale: மனிதரல்லாத விலங்குகளையும் உள்ளடக்கும் பரந்த உயிர்வாழ் படைப்புகளைக் குறிக்கிறது; ‘ஆத்துமா’ என்று மொழிபெயர்த்து தேவையற்ற மானிடவியல் கருத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: אֲשֶׁר אִתְּכֶם
  choice: உங்களோடு இருக்கும்
  rationale: நோவாவுடனும் அவரது குடும்பத்துடனும் இருந்த உயிரினங்களை அடையாளப்படுத்தும் உறவுச் சொற்றொடரை நேராகவும் இயல்பாகவும் தருகிறது.
- source_word: לְדֹרֹת עוֹלָם
  choice: என்றென்றும் வரும் தலைமுறைகளுக்காக
  rationale: דֹרֹת என்பதன் தலைமுறை சார்ந்த பொருளையும் עוֹלָם என்பதன் நீடித்த கால வலிமையையும் காக்கும் இயல்பான தமிழ் நடை.
theological_decisions:
- issue: נֹתֵן உடன் வரும் உடன்படிக்கைச் செயல்
  choice: நான் கொடுக்கிற
  alternative: நான் ஏற்படுத்துகிற
  rationale: எபிரெயப் பங்கேற்புவினை முறையாக ‘கொடுக்கிற’ என்று பொருள்படும். தமிழில் ‘உடன்படிக்கையைக் கொடுக்கிற’ என்பது சற்றே நேரடியான நடையாக இருந்தாலும் புரியக்கூடியது; மூலத்தின் உருவகத்தையும் தெளிவின்மையையும் காக்கிறது.
- issue: נֶפֶשׁ חַיָּה என்பதன் வரம்பு
  choice: எல்லா உயிரினங்களும்
  alternative: உயிருள்ள ஒவ்வொரு ஆத்துமாவும்
  rationale: நோவா சம்பவத்தின் சூழலில் விலங்குகளும் இதில் அடங்குகின்றன. ‘ஆத்துமா’ என்பது இங்கு மூலத்தில் இல்லாத தனிப்பட்ட மானிடவியல் அல்லது மறுமை சார்ந்த கருத்தைத் தூண்டக்கூடும்.
- issue: עוֹלָם என்பதன் கால அளவு
  choice: என்றென்றும் வரும்
  alternative: எல்லாத் தலைமுறைகளிலும்
  rationale: நீடித்த, முடிவுறாத தொடர்ச்சியை வலுவாக வெளிப்படுத்துகிறது; இச்சொல்லின் துல்லியமான கால வரம்பைப் பற்றி கூடுதல் கோட்பாட்டுத் தீர்மானம் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில் மரியாதையும் வேதாகம உரைக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியத்தின் தரப்புகள் தமிழில் புரியும்படி வரிசைப்படுத்தப்பட்டாலும், உடன்படிக்கையின் அடையாளம், சம்பந்தப்பட்ட அனைவரும், அதன் தலைமுறைதோறும் நீடிக்கும் தன்மை ஆகியவை அப்படியே பாதுகாக்கப்பட்டுள்ளன.
