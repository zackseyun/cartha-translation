base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/023.yaml
  text: Then Shem and Japheth took the garment and laid it on both their shoulders[a], and they walked backward and covered their father's nakedness. Their faces were turned backward, so they did not see their father's nakedness.
translation:
  language: ta
  text: அப்போது சேமும் யாப்பேத்தும் அந்த மேலாடையை எடுத்து, தங்கள் இருவருடைய தோள்களின்மேல் வைத்துக்கொண்டு, பின்னோக்கி நடந்து தங்கள் தந்தையின் நிர்வாணத்தை மூடினார்கள். அவர்களுடைய முகங்கள் பின்னோக்கி இருந்தன; அவர்கள் தங்கள் தந்தையின் நிர்வாணத்தைக் காணவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்து
  rationale: לקח என்ற எபிரெய வினை இங்குள்ள தொடர்நிகழ்வில் எளிய ‘எடுத்தல்’ பொருளைத் தருகிறது; தமிழில் இணைந்த எழுவாயோடு இயல்பாகப் பன்மை வினை பயன்படுத்தப்பட்டது.
- source_word: שֵׁם וָיֶפֶת
  choice: சேமும் யாப்பேத்தும்
  rationale: எபிரெயப் பெயர்களின் ஒலியமைப்பைத் தமிழில் தெளிவாகக் காட்டும் மரபான வடிவங்கள்.
- source_word: הַשִּׂמְלָה
  choice: அந்த மேலாடையை
  rationale: שׂמלה என்பது பொதுவாக உடலுக்கு வெளியே அணியும் ஆடை அல்லது போர்வையாகப் பயன்படும் மேலாடையைக் குறிக்கிறது. குறிப்பிட்ட ஆடையைக் குறிக்கும் எபிரெயச் சுட்டை ‘அந்த’ என வெளிப்படுத்துகிறது.
- source_word: וַיָּשִׂימוּ עַל שְׁכֶם שְׁנֵיהֶם
  choice: தங்கள் இருவருடைய தோள்களின்மேல் வைத்துக்கொண்டு
  rationale: சொல்லுக்கு நெருக்கமாக ‘அவர்கள் இருவரின் தோளின்மேல் வைத்தார்கள்’ என்பதே அமைப்பு. இருவரும் சேர்ந்து ஆடையைத் தோள்களில் தாங்கிச் சென்ற செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲחֹרַנִּית
  choice: பின்னோக்கி
  rationale: நடந்த திசையையும் முகங்களின் திசையையும் குறிக்கும் எபிரெயச் சொல்லின் மீளுரைப்பைத் தமிழிலும் காக்கிறது.
- source_word: וַיְכַסּוּ
  choice: மூடினார்கள்
  rationale: כסה என்பதன் இச்சூழலுக்குரிய நேரடியான பொருள்.
- source_word: עֶרְוַת אֲבִיהֶם
  choice: தங்கள் தந்தையின் நிர்வாணத்தை
  rationale: எபிரெயத் தொடரை நேரடியாகவும் கண்ணியமாகவும் வழங்குகிறது; நோவாவின் வெளிப்பட்ட உடலை இங்கு குறிக்கிறது, ஆனால் மூலத்தின் சொற்றொடரைக் குறுக்கவோ விரிவுபடுத்தவோ இல்லை.
- source_word: וּפְנֵיהֶם אֲחֹרַנִּית
  choice: அவர்களுடைய முகங்கள் பின்னோக்கித் திரும்பியிருந்ததால்
  rationale: எபிரெயத்தில் வினையற்ற கூறாக இருந்தாலும், முகங்கள் எதிர்த்திசையில் இருந்த நிலையையும் அடுத்த விளைவையும் தமிழில் இயல்பாகத் தெளிவாக்குகிறது.
- source_word: לֹא רָאוּ
  choice: காணவில்லை
  rationale: ראה என்ற வினையின் எளிய எதிர்மறைப் பொருளைச் சேர்க்கை இல்லாமல் தருகிறது.
theological_decisions:
- issue: ‘தங்கள் தந்தையின் நிர்வாணம்’ என்பதன் பொருள்
  choice: நோவாவின் வெளிப்பட்ட உடலைச் சேமும் யாப்பேத்தும் மரியாதையுடன் மூடுதல்
  alternative: லேவியராகமத்தின் சில இடங்களைப் போல பாலியல் பொருளுடைய மறைமொழியாகப் புரிந்துகொள்ளுதல்
  rationale: இவ்வசனத்தின் உடனடிச் சூழலில் மேலாடையை எடுத்தல், பின்னோக்கி நடத்தல், உடலை மூடுதல், காணாமல் தவிர்த்தல் ஆகியவை வெளிப்பட்ட உடலை நேரடியாகச் சுட்டுகின்றன. அதேவேளை, விளக்கத்தை மொழிபெயர்ப்புக்குள் திணிக்காமல் ‘நிர்வாணம்’ என்ற மூலச் சொல்லாட்சி காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நிர்வாணம்’ என்ற சொல் மூலத்தின் உடல் வெளிப்பாடு மற்றும் மானக்கேடு சார்ந்த நுணுக்கத்தைப் பாதுகாக்கிறது. ‘பின்னோக்கி’ என்ற மீளுரை எபிரெய உரையின் வலியுறுத்தலைத் தக்கவைக்கிறது.
