  text: כָּל רֶ֨מֶשׂ֙ אֲשֶׁ֣ר הוּא חַ֔י לָ/כֶ֥ם יִהְיֶ֖ה לְ/אָכְלָ֑ה כְּ/יֶ֣רֶק עֵ֔שֶׂב נָתַ֥תִּי לָ/כֶ֖ם אֶת כֹּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/003.yaml
  text: Every moving thing that is alive shall be food for you. As I gave you the green plants[a], I have given you everything.
translation:
  language: ta
  text: உயிருள்ள ஒவ்வொரு நடமாடும் உயிரினமும்[a] உங்களுக்கு உணவாக இருக்கும். பசுமையான தாவரங்களைத் தந்ததுபோல, அனைத்தையும் உங்களுக்குத் தந்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயிருள்ள ஒவ்வோர் ஊர்வனவும்.” எபிரெயப் பெயர்ச்சொல் רֶמֶשׂ பொதுவாக ஊர்ந்து செல்லும் அல்லது திரளாக நகரும் உயிரினங்களைக் குறிக்கும்; ஆனால் இச்சூழலில் அது விரிவான பொருளில் பயன்படுத்தப்பட்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: ஒவ்வோர்
  rationale: ஒருமையில் உள்ள רֶמֶשׂ என்பதுடன் பகிர்ந்தளிக்கும் பொருளில் வருவதால், முழுமையான பரப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: רֶמֶשׂ
  choice: நடமாடுகிற ... உயிரினம்
  rationale: இச்சொல் ஊர்ந்து செல்லும் அல்லது திரளாக நகரும் உயிரினங்களைக் குறிக்கக்கூடும்; ஆனால் இச்சூழலில் உணவுக்கான கொடையின் விரிவான பரப்பை வெளிப்படுத்துவதால், குறுகலாக்காத இயல்பான சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲשֶׁר הוּא חַי
  choice: உயிரோடு
  rationale: இது உயிரினம் உயிருடன் இருப்பதைத் தெளிவாகக் குறிப்பதோடு, இறந்த உடலிலிருந்து வேறுபடுத்தும் எபிரெயத் தொடரின் வலியுறுத்தலைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: உங்களுக்கு உணவாக இருக்கும்
  rationale: தெய்வீக அனுமதி மற்றும் வழங்குதலை, எபிரெய வாக்கிய அமைப்பின் பொருளைத் தக்கவைத்து இயல்பான தமிழில் தருகிறது.
- source_word: כְּיֶרֶק עֵשֶׂב
  choice: பசுமையான தாவரங்களைத் தந்ததுபோல
  rationale: முன்பு உணவாக அளிக்கப்பட்ட பசுமையான தாவர வளர்ச்சியைச் சுட்டுகிறது; பழமையான அல்லது மிகக் குறுகிய ‘பச்சைக் கீரை’ போன்ற சொல்லாட்சியைத் தவிர்க்கிறது.
- source_word: נָתַתִּי
  choice: தந்திருக்கிறேன்
  rationale: முடிந்த செயலில் இருந்து தொடரும் தற்போதைய கொடையை எபிரெய நிறைவுவினை உணர்த்த முடிவதால், இப்போது நடைமுறையில் உள்ள வழங்குதலைத் தெளிவாக்குகிறது.
- source_word: אֶת כֹּל
  choice: அனைத்தையும்
  rationale: கொடையின் முழுமையான, கூட்டுத்தொகையான பரப்பை இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: வெள்ளத்திற்குப் பிந்தைய உணவுக்கான கொடையின் பரப்பு
  choice: இந்த வசனம் உயிருள்ள விலங்கினங்களை மனிதருக்கான உணவாக விரிவாக வழங்குவதாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: רֶמֶשׂ என்பதைக் குறுகிய பொருளில் கொண்டு, ஊர்ந்து செல்லும் அல்லது சிறிய உயிரினங்களுக்கு மட்டும் இக்கொடையை வரையறுப்பது.
  rationale: רֶמֶשׂ சில சூழல்களில் ஊர்வன அல்லது திரளாக நகரும் உயிரினங்களைக் குறித்தாலும், இங்கு ‘ஒவ்வோர்’, ‘உயிரோடு’, ‘அனைத்தையும்’ ஆகிய சொற்கள் விரிவான பரப்பை ஆதரிக்கின்றன. அதே நேரத்தில், சொல்லின் குறுகிய சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதானதாயும் மரியாதைமிக்கதாயும் வடிவமைக்கப்பட்டது. மூலத்தின் விரிவான உணவுக் கொடையைப் பாதுகாத்து, רֶמֶשׂ என்பதிலுள்ள உண்மையான சொற்பொருள் மாற்றுவாய்ப்பை அடிக்குறிப்பில் வைத்துள்ளது.
