  to: உங்களைக் கண்டு உண்டாகும் அச்சமும் திகிலும்[a] பூமியிலுள்ள எல்லா விலங்குகள்மேலும், வானத்துப் பறவைகள் அனைத்தின்மேலும், தரையில் ஊர்ந்து செல்லும் அனைத்தின்மேலும், கடலின் மீன்கள் அனைத்தின்மேலும் இருக்கும். அவை உங்கள் கையில் கொடுக்கப்பட்டுள்ளன[b].
