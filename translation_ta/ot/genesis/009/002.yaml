base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/002.yaml
  text: And the fear of you and the dread of you shall be upon every beast of the earth and upon every bird of the heavens[a], on everything that creeps on the ground, and on all the fish of the sea[c][b]; into your hand they are given.
translation:
  language: ta
  text: உங்களைக் கண்டு உண்டாகும் அச்சமும் திகிலும்[a] பூமியிலுள்ள எல்லா விலங்குகள்மேலும், வானத்துப் பறவைகள் அனைத்தின்மேலும், தரையில் ஊர்ந்து செல்லும் அனைத்தின்மேலும், கடலின் மீன்கள் அனைத்தின்மேலும் இருக்கும். அவை உங்கள் கையில் கொடுக்கப்பட்டுள்ளன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்களுடைய அச்சமும் உங்களுடைய திகிலும்’ என்றும் மொழிபெயர்க்கலாம்; இங்கு உயிரினங்களுக்கு உங்களால் உண்டாகும் அச்சமும் திகிலும் குறிக்கப்படுகின்றன.
    reason: lexical_alternative
  - marker: b
    text: ‘உங்கள் கையில் கொடுக்கப்பட்டுள்ளன’ என்பது உங்கள் அதிகாரம் அல்லது கட்டுப்பாட்டின்கீழ் வைக்கப்பட்டுள்ளன என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹרַאֲכֶם
  choice: உங்களைப் பற்றிய அச்சம்
  rationale: இந்தப் பெயர்ச்சொல் மனிதர்களால் உயிரினங்களுக்கு உண்டாகும் அச்சத்தைக் குறிக்கிறது. ‘உங்களைப் பற்றிய’ என்பது எபிரெய genitive அமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: חִתְּכֶם
  choice: உங்களைக் குறித்த திகில்
  rationale: חִתָּה குறிக்கும் தீவிரமான அச்சத்தை ‘திகில்’ வெளிப்படுத்துகிறது; முந்தைய מוֹרָא என்பதற்கான ‘அச்சம்’ என்பதிலிருந்தும் வேறுபடுத்துகிறது.
- source_word: יִהְיֶה
  choice: இருக்கும்
  rationale: வெள்ளத்திற்குப் பிந்தைய இறை அறிவிப்பில் உருவாகும் நிலையைத் தமிழ் எதிர்கால வடிவில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: חַיַּת הָאָרֶץ
  choice: பூமியின் எல்லா விலங்குகள்
  rationale: இச்சூழலில் חַיָּה நிலத்தில் வாழும் விலங்குகளைக் கூட்டாகக் குறிக்கிறது. ‘விலங்குகள்’ என்பது ‘காட்டு விலங்குகள்’ என்று தேவையின்றிக் குறுக்காமல் பொதுவான பொருளைக் காக்கிறது.
- source_word: עוֹף הַשָּׁמַיִם
  choice: வானத்துப் பறவைகள் அனைத்தும்
  rationale: עוֹף என்பதற்கு இங்கு ‘பறவைகள்’ இயல்பான பொருள்; שָׁמַיִם என்பதைக் ‘வானம்’ என்று தற்போதைய தமிழில் தெளிவாக வழங்குகிறது.
- source_word: בְּכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: தரையில் ஊர்ந்து செல்லும் அனைத்தும்
  rationale: רמשׂ என்பதன் ஊர்ந்து அல்லது தரையோடு நகரும் உயிரினங்களைக் குறிக்கும் உருவகத்தைப் பேணுகிறது; אֲדָמָה என்பதை முந்தைய אֶרֶץ என்பதிலிருந்து வேறுபடுத்த ‘தரை’ என வழங்குகிறது.
- source_word: דְּגֵי הַיָּם
  choice: கடலின் மீன்கள் அனைத்தும்
  rationale: கடலில் உள்ள மீன்களை முழுமையாக உள்ளடக்கும் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: בְּיֶדְכֶם נִתָּנוּ
  choice: அவை உங்கள் கையில் கொடுக்கப்பட்டுள்ளன
  rationale: ‘கையில் கொடுத்தல்’ என்ற எபிரெய உருவகத்தைப் பேணி, உயிரினங்கள் மனித அதிகாரத்திற்குள் வைக்கப்பட்டதைக் குறிக்கிறது; passive perfect-இன் முடிவுற்ற தற்போதைய நிலையை ‘கொடுக்கப்பட்டுள்ளன’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வெள்ளத்திற்குப் பிந்தைய சூழலில் விலங்குகள்மீதான மனித அதிகாரம்
  choice: விலங்குகள் மனிதர்களைக் கண்டு அஞ்சுவதையும் அவை மனிதரின் ‘கையில்’ கொடுக்கப்பட்டிருப்பதையும் மூல உருவகத்தோடு கூறுதல்
  alternative: ‘அவை உங்களுக்குக் கீழ்ப்படுத்தப்பட்டுள்ளன’ என்று அதிகாரத்தின் பொருளை நேரடியாக விரித்துரைத்தல்
  rationale: ‘கையில் கொடுக்கப்பட்டுள்ளன’ என்பது உண்மையான அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறித்தாலும், மூலத்தின் உருவகத்தைப் பேணுவது வசனம் கூறுவதைத் தாண்டிய சமயவியல் அல்லது நெறியியல் முடிவுகளைச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியக்கூடிய, ஆனால் இறை அறிவிப்புக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் திரும்பத் திரும்ப வரும் ‘அனைத்தின்மேலும்’ அமைப்பு பட்டியலின் விரிவையும் வலியுறுத்தலையும் காக்கிறது.
