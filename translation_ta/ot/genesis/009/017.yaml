  text: וַ/יֹּ֥אמֶר אֱלֹהִ֖ים אֶל נֹ֑חַ זֹ֤את אֽוֹת הַ/בְּרִית֙ אֲשֶׁ֣ר הֲקִמֹ֔תִי בֵּינִ֕/י וּ/בֵ֥ין כָּל בָּשָׂ֖ר אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/017.yaml
  text: And God said to Noah[a], “This is the sign of the covenant that I have established between me and all flesh that is on the earth.”
translation:
  language: ta
  text: கடவுள் நோவாவிடம், “எனக்கும் பூமியிலுள்ள எல்லா உயிரினங்களுக்கும்[a] இடையே நான் நிலைநாட்டிய உடன்படிக்கையின் அடையாளம் இதுவே” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “எல்லா மாம்சத்துக்கும்.” இச்சூழலில் இது மனிதர்களை மட்டும் அல்லாமல் பூமியிலுள்ள எல்லா உயிருள்ள படைப்புகளையும் விரிவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֱלֹהִים אֶל נֹחַ
  choice: கடவுள் நோவாவிடம் ... என்றார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியைத் தமிழில் இயல்பான சொல்லொழுங்குடன் தருகிறது; אֶל addressee-ஐக் குறிக்கிறது.
- source_word: זֹאת אוֹת הַבְּרִית
  choice: உடன்படிக்கையின் அடையாளம் இதுவே
  rationale: זֹאת அடையாளப்படுத்தும் வாக்கியத்தை அறிமுகப்படுத்துகிறது; אוֹת என்பதற்கு இச்சூழலில் காணக்கூடிய ‘அடையாளம்’ இயல்பானது; בְּרִית என்பதன் வேதாகமச் சாரத்தை ‘உடன்படிக்கை’ காக்கிறது.
- source_word: הֲקִמֹתִי
  choice: நான் நிலைநாட்டிய
  rationale: קום என்பதன் Hiphil வடிவம் உடன்படிக்கையுடன் வரும்போது அதை ஏற்படுத்தி உறுதியாகச் செல்லுபடியாக்குவதைச் சுட்டுகிறது; பெயரெச்சத் தொடர் தமிழில் இயல்பாக உள்ளது.
- source_word: בֵּינִי וּבֵין
  choice: எனக்கும் ... இடையே
  rationale: உடன்படிக்கையின் இரு தரப்புகளுக்கிடையேயான உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל בָּשָׂר
  choice: எல்லா மாம்ச உயிர்களுக்கும்
  rationale: ‘எல்லா மாம்சமும்’ என்ற சொற்சொல் மொழிபெயர்ப்பு தமிழில் உயிரற்ற பொருளாகத் தவறாகப் புரியக்கூடும். ‘மாம்ச உயிர்கள்’ மூலத்தின் உருவகத்தை ஓரளவு காத்து, இச்சூழலில் மனிதர்களை மட்டுமல்லாது உயிருள்ள படைப்புகளையும் உள்ளடக்கும் அகலத்தைத் தருகிறது.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: பூமியில் உள்ள
  rationale: தொடர்புச் சொற்றொடர் ‘எல்லா மாம்ச உயிர்களையும்’ வரையறுக்கிறது; உலகளாவிய சூழலில் הָאָרֶץ என்பதற்கு ‘பூமி’ பொருத்தமானது.
theological_decisions:
- issue: நோவாவுடனான உடன்படிக்கையில் כָּל בָּשָׂר என்பதன் பரப்பு
  choice: எல்லா மாம்ச உயிர்களும்
  alternative: எல்லா உயிரினங்களும்; மனிதர்கள் அனைவரும்
  rationale: இச்சூழலில் இச்சொற்றொடர் மனிதர்களுக்கு மட்டும் கட்டுப்படாமல் பூமியிலுள்ள உயிருள்ள படைப்புகளை விரிவாக உள்ளடக்குகிறது. ‘மாம்ச உயிர்கள்’ அந்த அகலத்தையும் எபிரெயச் சொல்லுருவையும் காக்கிறது; அடிக்குறிப்பு இயல்பான மாற்றுச் சொல்லை வழங்குகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘நிலைநாட்டிய உடன்படிக்கை’, ‘அடையாளம்’ ஆகியவை மூலத்தின் உடன்படிக்கைச் சொல்லாட்சியைத் தெளிவாகக் காக்கின்றன; ‘மாம்ச உயிர்கள்’ என்ற முதன்மை வாசகத்துடன் விளக்க அடிக்குறிப்பு இணைக்கப்பட்டுள்ளது.
