translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நேரடியான வரலாற்று நடை. மூலத்தின் பொருளமைப்பு காக்கப்பட்டு, தமிழுக்கு இயல்பான சொல்வரிசை பயன்படுத்தப்பட்டுள்ளது.
