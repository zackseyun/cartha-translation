base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/028.yaml
  text: After the flood, Noah lived three hundred and fifty years.
translation:
  language: ta
  text: வெள்ளத்திற்குப் பிறகு நோவா முந்நூற்று ஐம்பது ஆண்டுகள் வாழ்ந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: வாழ்ந்தார்
  rationale: חיה என்ற வினையின் தொடர்கதை வடிவம், வெள்ளத்திற்குப் பிந்தைய நோவாவின் வாழ்நாள் காலத்தைச் சொல்கிறது. விடுவிக்கப்பட்டதை வலியுறுத்தும் ‘உயிர்தப்பினார்’ என்பதற்குப் பதிலாக, காலநீட்சியை இயல்பாகக் குறிக்கும் ‘வாழ்ந்தார்’ பொருத்தமானது.
- source_word: נֹחַ
  choice: நோவா
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: אַחַר
  choice: பிறகு
  rationale: அடுத்துவரும் காலத்தைச் சுட்டும் முன்னிடைச்சொல்; நவீன தமிழில் இயல்பான காலத் தொடர்பைத் தருகிறது.
- source_word: הַמַּבּוּל
  choice: வெள்ளம்
  rationale: அறியப்பட்ட பெருவெள்ள நிகழ்வைக் குறிக்கும் குறிப்பிட்ட பெயர்ச்சொல். ‘வெள்ளம்’ தெளிவானதும் தமிழில் வழக்கமானதும் ஆகும்; ‘வெள்ளத்திற்குப் பிறகு’ என்ற வேற்றுமை அமைப்பில் அதன் குறிப்பிட்ட தன்மை சூழலால் தெளிவாகிறது.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: முந்நூற்று ஐம்பது ஆண்டுகள்
  rationale: எபிரெயில் ‘முந்நூறு ஆண்டுகள் மற்றும் ஐம்பது ஆண்டுகள்’ என அமைந்த மொத்த எண்ணிக்கையை, தமிழில் இயல்பாக ஒருங்கிணைத்து 350 ஆண்டுகள் எனத் தருகிறது.
