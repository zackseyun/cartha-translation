  yaml_path: translation/ot/genesis/009/005.yaml
  text: And surely I will require your blood for your lives[a]. From the hand of every beast I will require it[e][d][c][b], and from the hand of man—from the hand of each man's brother—I will require the life of the man.
translation:
  language: ta
  text: உங்கள் உயிர்களுக்கான உங்கள் இரத்தத்துக்கு நான் நிச்சயமாகக் கணக்குக் கேட்பேன்.[a] ஒவ்வொரு விலங்கிடமிருந்தும் அந்த இரத்தத்துக்காகக் கணக்குக் கேட்பேன்; மனிதனிடமிருந்தும்—ஒவ்வொரு மனிதனின் சகோதரனிடமிருந்தும்—மனிதனின் உயிருக்கு நான் கணக்குக் கேட்பேன்.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “உங்கள் உயிர்களுக்கான உங்கள் இரத்தம்.” இரத்தத்துக்கும் உயிருக்கும் உள்ள உறவை இச்சொற்றொடர் எடுத்துரைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “கணக்குக் கேட்பேன்” என்பதற்கு, “பொறுப்புக் கோருவேன்” என்றும் மொழிபெயர்க்கலாம். மீண்டும் மீண்டும் வரும் வினைச்சொல் இரத்தப்பழிக்கான நீதிசார் கணக்கைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “இடமிருந்து” என்பதற்கு எபிரெயத்தில் நேரடியாக, “கையிலிருந்து.” இது செயலைச் செய்தவரிடமிருந்து பொறுப்புக் கோருவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: source_idiom
lexical_decisions:
- source_word: וְאַךְ
  choice: நிச்சயமாக
  rationale: אַךְ என்பதன் உறுதியான வலியுறுத்தலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; வாக்கியத் தொடர்ச்சி தமிழ்ச் சொல்லமைப்பில் இயல்பாகப் பேணப்பட்டுள்ளது.
- source_word: דִּמְכֶם לְנַפְשֹׁתֵיכֶם
  choice: உங்கள் உயிர்களுக்காகச் சிந்தப்பட்ட உங்கள் இரத்தம்
  rationale: ‘இரத்தம்’ மற்றும் ‘உயிர்கள்’ என்ற இரு தனித்த எபிரெயச் சொற்களையும் பேணுகிறது; நீதித்தீர்ப்புக்குரிய இரத்தச்சிந்துதலே சூழலில் குறிக்கப்படுவதால் ‘சிந்தப்பட்ட’ என்பது உறவை இயல்பாகத் தெளிவாக்குகிறது.
- source_word: אֶדְרֹשׁ
  choice: கணக்குக் கேட்பேன்
  rationale: דרשׁ இங்கு இரத்தப்பழிக்கான நீதிசார் பொறுப்புக் கோருதலைக் குறிக்கிறது; ‘கணக்குக் கேட்பேன்’ என்பது நவீன தமிழில் அந்தச் சட்டநீதித் தொனியைத் தெளிவாக அளிக்கிறது.
- source_word: מִיַּד
  choice: இடமிருந்து
  rationale: சொல்லுக்கு சொல் ‘கையிலிருந்து’ என்றாலும், இங்கு செயற்பாட்டாளரிடமிருந்து பொறுப்புக் கோருவதைத் தமிழில் இயல்பாக ‘இடமிருந்து’ தெரிவிக்கிறது; அடிக்குறிப்பில் நேரடி மொழிபெயர்ப்பு தரப்படுகிறது.
- source_word: כָּל חַיָּה
  choice: ஒவ்வொரு விலங்கு
  rationale: மனிதனுக்கு மாறாகக் குறிப்பிடப்படும் விலங்கினத்தைக் குறிக்கிறது; ‘உயிரினம்’ என்பதைவிட மனிதர்–விலங்கு வேறுபாட்டைத் தெளிவாகப் பேணுகிறது.
- source_word: אֶדְרְשֶׁנּוּ
  choice: அதற்குக் கணக்குக் கேட்பேன்
  rationale: ஆண்பால் ஒருமை பின்னொட்டு முன் குறிப்பிடப்பட்ட இரத்தத்தையே இயல்பாகச் சுட்டுகிறது; தமிழில் ‘அதற்கு’ என்பது குறைந்த விளக்கச் சேர்க்கையுள்ள வடிவம்.
- source_word: הָאָדָם
  choice: மனிதன்
  rationale: விலங்குக்கு எதிரான மனித இனப் பிரதிநிதி ஒருமையைப் பேணுகிறது; நவீன தமிழில் இயல்பானதும் பாலினச் சுருக்கம் ஏற்படுத்தாததும் ஆகும்.
- source_word: אִישׁ אָחִיו
  choice: ஒவ்வொருவனுடைய சகோதரன்
  rationale: சொற்றொடரின் பகிர்வுப் பொருளையும் ‘சகோதரன்’ என்ற உறவுமுறை மொழியையும் பேணுகிறது; மனிதர்கள் ஒருவருடைய உயிருக்கு ஒருவர் பொறுப்புடையவர்கள் என்ற வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: נֶפֶשׁ הָאָדָם
  choice: மனிதனின் உயிர்
  rationale: இரத்தச்சிந்துதல் பற்றிய சூழலில் נֶפֶשׁ என்பது உடலற்ற ‘ஆத்துமா’ என்பதைக் காட்டிலும் உயிரையே குறிக்கிறது.
theological_decisions:
- issue: இரத்தச்சிந்துதல் சூழலில் נֶפֶשׁ என்பதன் பொருள்
  choice: உயிர்
  alternative: ஆத்துமா
  rationale: இரத்தத்துக்கும் உயிருக்கும் உள்ள நேரடித் தொடர்பும், மனித உயிரைப் பறித்ததற்கான கணக்குக் கேட்பும் இங்கு மையமாக உள்ளன; ‘ஆத்துமா’ என்று மொழிபெயர்ப்பது மூலத்தில் முன்னிறுத்தப்படாத உடல்–ஆத்துமா கருத்தைச் சேர்க்கக்கூடும்.
- issue: אָדָם என்பதன் பிரதிநிதி ஒருமை
  choice: மனிதன்
  alternative: மனிதகுலம்
  rationale: முதல் இடத்தில் விலங்குக்கு எதிரான மனிதனைவும், இறுதியில் பிரதிநிதி ஒருமையில் மனித உயிரையும் உரை குறிப்பிடுகிறது; ‘மனிதன்’ ஒருமையையும் இனப்பொதுப் பொருளையும் பேணுகிறது.
- issue: מִיַּד אִישׁ אָחִיו என்ற தொடரின் உறவு
  choice: ‘மனிதனிடமிருந்து’ என்பதைக் குறிப்பாக்கும் இடைச்செருகலாகக் கோடுகளுக்குள் அமைத்தல்
  alternative: இரண்டு தனி வாக்கியங்களாகப் பிரித்தல்
  rationale: எபிரெய வாக்கியமைப்பில் இரண்டாவது தொடர் முதல் தொடரை விரிவாகக் குறிப்பாக்குகிறது; ஒரே வாக்கியத்தில் வைத்தல் மனிதப் பொறுப்பின் தொடர்ச்சியைப் பேணுகிறது.
