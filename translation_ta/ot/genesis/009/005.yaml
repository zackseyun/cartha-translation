  register: நவீன நிலையான தமிழில் கண்ணியமான நீதிசார் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘கணக்குக் கேட்பேன்’ என்ற மறுமொழி மூலத்தின் வினைச்சொல் மீளுரையைப் பேணுகிறது. நீண்ட இறுதிக் கூறின் உட்பொருத்த உறவை நீள்கோடுகள் தெளிவாக்குகின்றன.
