source:
  edition: WLC
  text: אַךְ בָּשָׂ֕ר בְּ/נַפְשׁ֥/וֹ דָמ֖/וֹ לֹ֥א תֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/004.yaml
  text: But you shall not eat flesh with its life[a], that is[b], its blood.
translation:
  language: ta
  text: ஆனால், இறைச்சியை அதன் உயிரோடு[a], அதாவது அதன் இரத்தத்தோடு[b], நீங்கள் உண்ணக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆனால், அதன் உயிராகிய இரத்தத்தோடு இருக்கும் இறைச்சியை நீங்கள் உண்ணக் கூடாது.”
    reason: נַפְשׁוֹ דָמוֹ என்ற சுருக்கமான எபிரெய அமைப்பை ஒரே தொடர்புடைய சொற்றொடராகவும் எடுத்துக்கொள்ளலாம்.
  - marker: b
    text: மூலத்தில் ‘அதாவது’ என்பதற்கான தனிச்சொல் இல்லை; சொற்கள் நேரடியாக அடுத்தடுத்து வருவதால், “அதன் உயிரோடு—அதன் இரத்தத்தோடு” என்றும் மொழிபெயர்க்கலாம்.
    reason: எபிரெய இணைநிலையின் சுருக்கத்தையும் அதன் உண்மையான இலக்கணத் தெளிவின்மையையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: אַךְ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் விலங்குகளை உணவாக உண்ணக் கொடுக்கப்பட்ட அனுமதிக்கு இங்கு ஒரு கட்டுப்பாடு விதிக்கப்படுகிறது. அந்த எதிர்மறைத் திருப்பத்தை இயல்பான நவீனத் தமிழில் ‘ஆனால்’ தெளிவாகக் காட்டுகிறது.
- source_word: בָּשָׂר
  choice: இறைச்சி
  rationale: எபிரெயச் சொல் அடிப்படையில் ‘சதை’ எனப் பொருள்பட்டாலும், உண்ணுதல் பற்றிய இச்சூழலில் ‘இறைச்சி’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בְּנַפְשׁוֹ
  choice: அதன் உயிரோடு
  rationale: இங்கு נֶפֶשׁ என்பது ‘ஆத்துமா’ என்ற பிற்கால இறையியல் பொருளைவிட உயிரூட்டும் வாழ்வைக் குறிக்கிறது. בְּ முன்னொட்டு உடனிருப்பைச் சுட்டுவதால் ‘உயிரோடு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: דָמוֹ
  choice: அதன் இரத்தத்தோடு
  rationale: דָם என்பதன் நேரடியான பொருள் ‘இரத்தம்’. ‘உயிரிரத்தம்’ என்று ஒன்றாக்காமல் வைத்ததால், உயிருக்கும் இரத்தத்துக்கும் இடையே மூலவாக்கியம் அமைக்கும் தொடர்பு தெளிவாகத் தங்குகிறது.
- source_word: בְּנַפְשׁוֹ דָמוֹ
  choice: அதன் உயிரோடு, அதாவது அதன் இரத்தத்தோடு
  rationale: எபிரெயத்தில் ‘அதன் உயிர், அதன் இரத்தம்’ என்ற சுருக்கமான அடுத்தடுத்த அமைப்பு உள்ளது. தமிழில் அதன் விளக்க இணைப்பைத் தெளிவாக்க ‘அதாவது’ சேர்க்கப்பட்டது; அடிக்குறிப்பு நேரடியான இணைநிலை வாசிப்பையும் பாதுகாக்கிறது.
- source_word: לֹא תֹאכֵלוּ
  choice: நீங்கள் உண்ணக் கூடாது
  rationale: எதிர்மறை வினை இங்கு சட்டரீதியான தடையைத் தெரிவிக்கிறது. ‘உண்ணக் கூடாது’ என்பது நவீனத் தமிழில் தெளிவான, கண்ணியமான தடைமொழி.
theological_decisions:
- issue: נֶפֶשׁ என்பதற்கும் இரத்தத்திற்கும் உள்ள தொடர்பு
  choice: נֶפֶשׁ என்பது ‘உயிர்’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘ஆத்துமா’ அல்லது ‘உயிரிரத்தம்’ என்று மொழிபெயர்த்தல்
  rationale: இச்சூழலில் சொல் உயிருள்ள பிராணியின் வாழ்வைக் குறிக்கிறது; உடலிலிருந்து தனித்த ஓர் ஆத்துமாவைப் பற்றிய கோட்பாட்டை வாக்கியம் வெளிப்படையாக முன்வைப்பதில்லை. ‘உயிர்’ என்பது பிற்காலக் கோட்பாட்டை இறக்குமதி செய்யாமல் மூலத்தின் பொருளையும் இரத்தத்துடனான தொடர்பையும் காக்கிறது.
- issue: ‘உயிர்—இரத்தம்’ என்ற எபிரெய இணைநிலையின் விளக்கம்
  choice: முதன்மை உரையில் ‘அதாவது’ கொண்டு விளக்க உறவு வெளிப்படுத்தப்பட்டது
  alternative: ‘அதன் உயிரோடு—அதன் இரத்தத்தோடு’ என்று நேரடி இணைநிலையாக வாசித்தல்
  rationale: மூலத்தின் சுருக்கமான சொற்றொடர் இரத்தத்தை உயிரின் விளக்க இணையாக வாசிக்க இடமளிக்கிறது. வாசிப்புத் தெளிவுக்காக முதன்மை உரை இதை வெளிப்படுத்துகிறது; ஆனால் வேறு சாத்தியமான நேரடி அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான தடைமொழி பயன்படுத்தப்பட்டுள்ளது. ‘புசிக்க’, ‘ஆத்துமா’, ‘மாம்சம்’ போன்ற பழமையான அல்லது இச்சூழலில் தவறாக வழிநடத்தக்கூடிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
