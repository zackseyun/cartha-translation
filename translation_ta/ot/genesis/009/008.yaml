  yaml_path: translation/ot/genesis/009/008.yaml
  text: Then God said to Noah and to his sons with him, saying,
translation:
  language: ta
  text: 'பின்பு கடவுள் நோவாவிடமும் அவனுடன் இருந்த அவன் மகன்களிடமும் இவ்வாறு கூறினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... கூறினார்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை அடுத்த கட்டத்திற்கு நகர்த்துகிறது. நவீன தமிழில் அதன் தொடர்ச்சிப் பொருளை இயல்பாக வெளிப்படுத்த ‘பின்பு’ பயன்படுத்தப்பட்டது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இச்சூழலில் இச்சொல் நோவாவிடம் பேசும் ஒரே கடவுளைக் குறிக்கிறது; நவீன பொதுத் தமிழில் ‘கடவுள்’ இயல்பான, தெளிவான மொழிபெயர்ப்பு.
- source_word: נֹחַ
  choice: நோவா
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וְאֶל בָּנָיו
  choice: அவன் மகன்களிடமும்
  rationale: எபிரெயச் சொல் ஆண் பிள்ளைகளைத் தெளிவாகக் குறிக்கிறது. இணைப்பும் இரண்டாம் பெறுநரைக் குறிக்கும் முன்னிடைச்சொல்லும் ‘-இடமும்’ என்பதால் இயல்பாகத் தரப்பட்டன.
- source_word: אִתּוֹ
  choice: அவனுடன் இருந்த
  rationale: மகன்கள் நோவாவுடன் இருந்தார்கள் என்பதை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
- source_word: לֵאמֹר
  choice: இவ்வாறு கூறினார்
  rationale: அடுத்து வரும் நேரடிப் பேச்சை அறிமுகப்படுத்தும் எபிரெயக் கூறைத் தமிழில் இயல்பாகத் தக்கவைக்கிறது; முடிவிலுள்ள முக்காற்புள்ளி தொடரும் உரையைக் காட்டுகிறது.
