  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. பழமையான ‘குமாரர்கள்’, ‘நோக்கி உரைத்தார்’ போன்ற வடிவங்கள் தவிர்க்கப்பட்டன.
