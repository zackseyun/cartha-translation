source:
  edition: WLC
  text: וַ/יָּ֥חֶל נֹ֖חַ אִ֣ישׁ הָֽ/אֲדָמָ֑ה וַ/יִּטַּ֖ע כָּֽרֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/020.yaml
  text: Noah[a], a man of the soil[b], began to plant a vineyard.
translation:
  language: ta
  text: மண்ணைப் பயிரிடும் மனிதனான நோவா[a], ஒரு திராட்சைத்தோட்டத்தை நடத் தொடங்கினான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மண்ணைப் பயிரிடும் மனிதனான நோவாவே முதன்முதலில் ஒரு திராட்சைத்தோட்டத்தை நட்டான்.” எபிரெயச் சொற்றொடர் சுருக்கமாக உள்ளது; ‘தொடங்கினான்’ என்பதைச் சிலர் ‘முதன்முதலில் செய்தான்’ என்ற பொருளில் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: சொல்லமைப்புக்கு நெருக்கமாக, “ஒரு திராட்சைத்தோட்டத்தை நடத் தொடங்கி, நட்டான்.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיָּחֶל
  choice: தொடங்கினான்
  rationale: ஹிஃபில் வடிவில் இங்கு இயல்பான பொருள் ‘தொடங்கினான்’ என்பதாகும். அடுத்துவரும் ‘நட்டான்’ என்ற வினையுடன் இணைத்து, தமிழில் இயல்பாக ‘நடத் தொடங்கினான்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: נֹחַ
  choice: நோவா
  rationale: இப்பெயரின் தமிழில் நிலைபெற்றுள்ள ஒலிபெயர்ப்பு.
- source_word: אִישׁ הָאֲדָמָה
  choice: மண்ணைப் பயிரிடும் மனிதன்
  rationale: சொல்லுக்கு சொல் ‘மண்ணின் மனிதன்’ என்ற எபிரெயச் சொற்றொடர் தமிழில் இயல்பாக இருக்காது. அதன் வேளாண்மை சார்ந்த பொருளையும் ‘மனிதன்’ என்ற கூறையும் காக்கும் வகையில் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: וַיִּטַּע
  choice: நட்டான்
  rationale: נטע என்பது செடிகள் அல்லது தோட்டம் நடுவதற்கான வழக்கமான வினைச்சொல்.
- source_word: כָּרֶם
  choice: ஒரு திராட்சைத்தோட்டம்
  rationale: திராட்சைக் கொடிகள் பயிரிடப்படும் தோட்டத்தைக் குறிக்கும் துல்லியமான, இயல்பான தமிழ்ச் சொல்.
theological_decisions:
- issue: וַיָּחֶל ... וַיִּטַּע என்ற சுருக்கமான வினைத்தொடரை எவ்வாறு புரிந்துகொள்வது
  choice: ஒரு திராட்சைத்தோட்டத்தை நடத் தொடங்கினான்
  alternative: ஒரு திராட்சைத்தோட்டத்தை முதன்முதலில் நட்டான்
  rationale: எபிரெய வாக்கிய அமைப்பு சுருக்கமாக உள்ளது. וַיָּחֶל என்பதற்கு ‘தொடங்கினான்’ என்று பொருள்கொண்டு, அதன் பொருளை அடுத்த வினையோடு இணைப்பது கதையின் இயல்பான ஓட்டத்தைக் காக்கிறது. ‘முதன்முதலில் நட்டான்’ என்பது சாத்தியமான விளக்கவுரை என்றாலும், ‘முதன்முதலில்’ என்பது மூலத்தில் வெளிப்படையாக இல்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மண்ணின் மனிதன்’ என்ற சொற்சொல் வடிவத்தின் அசௌகரியத்தைத் தவிர்த்து, அதன் வேளாண்மை சார்ந்த பொருள் ‘மண்ணைப் பயிரிடும் மனிதன்’ எனக் காக்கப்பட்டுள்ளது.
