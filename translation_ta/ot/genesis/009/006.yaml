source:
  edition: WLC
  text: שֹׁפֵךְ֙ דַּ֣ם הָֽ/אָדָ֔ם בָּֽ/אָדָ֖ם דָּמ֣/וֹ יִשָּׁפֵ֑ךְ כִּ֚י בְּ/צֶ֣לֶם אֱלֹהִ֔ים עָשָׂ֖ה אֶת הָ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/006.yaml
  text: Whoever sheds the blood of man[a], by man shall his blood be shed[b], for God made man in his image.
translation:
  language: ta
  text: மனிதரின் இரத்தத்தைச் சிந்துகிறவரின் இரத்தம் மனிதரால் சிந்தப்படும்; ஏனெனில் கடவுள் தமது சாயலில் மனிதரை உருவாக்கினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁפֵךְ
  choice: சிந்துகிறவர்
  rationale: எபிரெய வினையெச்சம் பொதுவான நியதியாகச் செயல்படுகிறது. தமிழில் ‘சிந்துகிறவர்’ என்பது இரத்தம் சிந்துதல் என்ற வழக்கான சொற்றொடரையும் பொதுப்பொருளையும் இயல்பாகக் காக்கிறது.
- source_word: דַּם הָאָדָם
  choice: மனிதரின் இரத்தத்தை
  rationale: இங்கு דָּם உயிர் இரத்தத்தையும் வன்முறைக் கொலையையும் குறிக்கிறது; הָאָדָם பாலினத்தை மட்டும் சுட்டாமல் ஒரு மனிதரைப் பொதுவாகக் குறிக்கிறது.
- source_word: בָּאָדָם
  choice: மனிதரால்
  rationale: בְּ முன்னிடைச்சொல் இங்கு செயற்படுத்தும் கருவி அல்லது முகவரைக் குறிக்கும் வகையில் எடுத்துக்கொள்ளப்படுகிறது. ‘மனிதரால்’ என்பது சுருக்கமான நீதிமொழித் தன்மையையும் אדם என்ற சொல்லின் மறுபயன்பாட்டையும் காக்கிறது.
- source_word: דָּמוֹ יִשָּׁפֵךְ
  choice: அவரின் இரத்தம் … சிந்தப்படும்
  rationale: மூன்றாம் நபர் உரிமைச் சுட்டையும் நிஃபால் செயப்பாட்டு வடிவத்தையும் நேரடியாகப் பிரதிபலிக்கிறது; நிகழும் அல்லது விதிக்கப்படும் முடிவை அதற்கும் மேலாக விளக்காமல் விடுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: கடவுள் தமது சாயலில்
  rationale: ‘கடவுளின் சாயலில்’ என்ற எபிரெய அமைப்பின் பொருளை இயல்பான தமிழில் வழங்குகிறது. ‘தமது’ என்பது கடவுளையே தெளிவாகச் சுட்டுகிறது.
- source_word: עָשָׂה
  choice: உருவாக்கினார்
  rationale: עָשָׂה என்பதன் ‘செய்தார்/உருவாக்கினார்’ என்ற பொதுப்பொருளைத் தருகிறது; ברא என்பதற்குரிய தனிப்பட்ட ‘படைத்தார்’ மொழியைத் தேவையின்றி இறக்குமதி செய்யவில்லை.
- source_word: הָאָדָם
  choice: மனிதரை
  rationale: இறுதி אדם மனிதகுலத்தைக் கூட்டாகவும் மனிதனைப் பொதுவாகவும் குறிக்கிறது. ‘மனிதரை’ என்பது நவீனத் தமிழில் பாலின வரம்பின்றி அந்தப் பொதுப்பொருளைத் தருகிறது.
theological_decisions:
- issue: אָדָם என்ற சொல்லின் பொதுப்பொருள்
  choice: மனிதர் / மனிதரை
  alternative: மனிதன் / மனிதகுலம்
  rationale: இந்த வசனத்தில் אדם ஆண்களை மட்டும் குறிக்காமல் மனித உயிரையும் மனிதகுலத்தையும் பொதுவாகக் குறிக்கிறது. தமிழில் ‘மனிதர்’ மரியாதையான ஒருமைப் பொதுப்பொருளையும் மனிதர்களைக் குறிக்கும் விரிவையும் இயல்பாகத் தாங்குகிறது.
- issue: בָּאָדָם மனித நீதிச் செயல்பாட்டைக் குறிக்கிறதா அல்லது வெறும் எதிர்விளைவைக் குறிக்கிறதா
  choice: மனிதரால் சிந்தப்படும்
  alternative: மனிதர்களிடையே சிந்தப்படும் / சிந்தப்பட வேண்டும்
  rationale: கருவி அல்லது செயற்படுத்தும் முகவர் என்ற வாசிப்பு தொடரமைப்புக்கு மிகவும் இயல்பானது. ‘சிந்தப்படும்’ என்பது எபிரெய செயப்பாட்டு எதிர்கால/முறைக் கூறின் திறந்த தன்மையை வைத்திருந்து, ‘வேண்டும்’ எனக் கட்டாயப் பொருளை அதிகப்படுத்தவில்லை.
- issue: கடவுளின் சாயல் பற்றிய காரணவாக்கியம்
  choice: கடவுள் தமது சாயலில் மனிதரை உருவாக்கினார்
  alternative: கடவுளின் சாயலில் அவர் மனிதரை உருவாக்கினார்
  rationale: மூலத்தில் ‘கடவுளின் சாயலில்’ என்பது முன்னிலைப்படுத்தப்பட்டுள்ளது. தேர்ந்த தமிழ் வடிவம் அதே இறையியல் கருத்தை இயல்பாகவும் தெளிவாகவும் வழங்குகிறது; மனித உயிரின் மதிப்பிற்கான காரணத்தை விரிவுரை இன்றி காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் மரியாதையும் சட்டநீதிமொழித் தொனியும் காக்கப்பட்டுள்ளன. אדם என்ற சொல்லின் மும்முறைத் தொடர்பை ‘மனிதர்/மனிதரை’ மூலம் இயன்றவரைத் தொடர்ந்து வைத்துள்ளோம். மூலத்தில் விளக்கக் குறிப்பை கட்டாயப்படுத்தும் முக்கிய உரைவேறுபாடு இல்லாததால் அடிக்குறிப்புகள் சேர்க்கப்படவில்லை.
