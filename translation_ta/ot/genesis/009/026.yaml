  yaml_path: translation/ot/genesis/009/026.yaml
  text: And he said, “Blessed be the LORD, the God of Shem, and let Canaan be their servant.”
translation:
  language: ta
  text: 'அவன் சொன்னான்: “சேமின் தேவனாகிய யெகோவா போற்றப்படுவாராக! கானான் அவர்களுக்கு அடிமையாக இருப்பானாக.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: போற்றப்படுவாராக
  rationale: இறைவனை நோக்கிய ஆசீர்வாத மொழியை, அவர் ஆசீர்வாதம் பெறுகிறார் என்ற தவறான எண்ணத்தைத் தவிர்த்து, இயல்பான தமிழில் புகழப்படுதல் என்ற பொருளுடன் வழங்குகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: மூலத்தில் உள்ள இறைநாமத்தை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் பெயராகவே ஒலிபெயர்க்கிறது.
- source_word: עֶבֶד
  choice: பணியாளன்
  rationale: அடிமை அல்லது ஊழியன் எனப் பொருள்படக்கூடிய சொல்லை இச்சூழலில் இயல்பாக வழங்குகிறது; கீழ்ப்படுத்தப்பட்ட சேவை என்ற கருத்தைத் தக்கவைக்கிறது.
- source_word: לָמוֹ
  choice: அவர்களுக்கு
  rationale: இது கவிதைநடையிலான பன்மை வடிவம்; அதன் உண்மையான பன்மைத் தெளிவின்மையைத் தனிமையாக மாற்றாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: யார் போற்றப்படுகிறார்?
  choice: சேம் அல்ல, சேமின் இறைவனாகிய யெகோவா போற்றப்படுகிறார்
  alternative: ‘சேம் ஆசீர்வதிக்கப்படுவானாக’ என்று பொருள்படுத்துதல்
  rationale: எபிரெய உரையில் בָּרוּךְ என்பதற்குப் பின் நேரடியாக யெகோவா என்ற இறைநாமம் வருகிறது.
- issue: לָמוֹ என்பதன் எண்ணிக்கை மற்றும் சுட்டுப்பொருள்
  choice: ‘அவர்களுக்கு’ என்ற பன்மையைத் தக்கவைத்தல்
  alternative: ‘அவனுக்கு’ அல்லது ‘அவருக்கு’ என்று சேமைக் குறிக்கும் ஒருமை
  rationale: மசோரா உரையின் לָמוֹ வடிவம் பன்மையாக இருப்பதால், அது யாரைக் குறிக்கிறது என்பதை உரை வெளிப்படையாகத் தீர்மானிக்கவில்லை; ஆகவே அந்தத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் கவிதைநடையும் கொண்ட, பொதுவாசகர்களுக்குப் புரியும் மொழி. வசனத்தின் இணை அமைப்பையும் ஆசிவாக்கியத் தொனியையும் தக்கவைக்கிறது.
