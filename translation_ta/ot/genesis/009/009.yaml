base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/009.yaml
  text: And as for me[a], behold, I am establishing my covenant with you and with your offspring after you.
translation:
  language: ta
  text: நானோ, இதோ, உங்களோடும் உங்களுக்குப் பின் வரும் சந்ததியோடும்[a] என் உடன்படிக்கையை ஏற்படுத்துகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் நேரடியாக ‘உங்கள் வித்து’ என்பதாகும். இச்சொல் கூட்டுப்பெயராகச் சந்ததியையோ வழித்தோன்றல்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: நானோ
  rationale: இணைப்புச் சொல்லுடன் வரும் தனிப்பட்ட பதிலிப்பெயரின் வலியுறுத்தலையும் உரையாடலில் ஏற்படும் கவனமாற்றத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הִנְנִי
  choice: இதோ
  rationale: கடவுளின் அடுத்த அறிவிப்புக்குச் சிறப்பான கவனத்தையும் solemn வலியுறுத்தலையும் அளிக்கிறது; ‘நான் இங்கே இருக்கிறேன்’ என்ற வேறுபட்ட பொருளைத் தவிர்க்கிறது.
- source_word: מֵקִים
  choice: ஏற்படுத்துகிறேன்
  rationale: קום என்பதன் ஹிஃபில் வடிவம் இங்கு உடன்படிக்கையை நிறுவுதல் அல்லது அமலுக்கு கொண்டுவருதல் என்பதைக் குறிக்கிறது. ‘உறுதிப்படுத்துகிறேன்’ என்பது ஏற்கெனவே உள்ள ஒன்றை மீண்டும் உறுதிசெய்வதாகத் தேவையின்றி உணர்த்தக்கூடும்.
- source_word: בְּרִיתִי
  choice: என் உடன்படிக்கை
  rationale: தெய்வீக–மனித உறவின் முறையான பிணைப்பைக் குறிக்கும் בְּרִית என்பதற்கான நிலையான, தெளிவான தமிழ் சொல்.
- source_word: אִתְּכֶם
  choice: உங்களோடும்
  rationale: நோவாவையும் அவருடன் இருப்பவர்களையும் உடன்படிக்கையின் தொடர்புடையவர்களாக நேரடியாகக் குறிக்கிறது.
- source_word: וְאֶת זַרְעֲכֶם
  choice: உங்கள் சந்ததியோடும்
  rationale: זֶרַע என்பது ஒருமை வடிவிலுள்ள கூட்டுப்பெயராகப் பின்வரும் வழித்தோன்றல்களைக் குறிக்க முடியும். ‘சந்ததி’ அந்தக் கூட்டுப்பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: אַחֲרֵיכֶם
  choice: உங்களுக்குப் பின்வரும்
  rationale: அடுத்தடுத்த தலைமுறைகளைத் தெளிவாகவும் சுருக்கமாகவும் குறிக்கிறது.
theological_decisions:
- issue: தெய்வீக–மனித உறவில் உடன்படிக்கைச் சொற்பயன்பாடு
  choice: என் உடன்படிக்கை
  alternative: என் ஒப்பந்தம்
  rationale: ‘உடன்படிக்கை’ என்பது இவ்வசனத்தின் வேதாகமச் சார்ந்த உறவுப் பிரிவைத் தக்கவைக்கிறது; ‘ஒப்பந்தம்’ மிகச் சட்ட அல்லது வாணிகத் தொனியைக் கொடுக்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. ‘நானோ, இதோ’ என்பது எபிரெய உரையின் இரட்டை வலியுறுத்தலைச் சுருக்காமல் காக்கிறது; வாக்கிய அமைப்பு தமிழில் தெளிவாக இருக்கும்படி உறவுச் சொற்றொடர்கள் முன்னிலைப்படுத்தப்பட்டுள்ளன.
