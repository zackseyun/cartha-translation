id: GEN.9.27
reference: Genesis 9:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יַ֤פְתְּ אֱלֹהִים֙ לְ/יֶ֔פֶת וְ/יִשְׁכֹּ֖ן בְּ/אָֽהֳלֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/027.yaml
  text: May God enlarge Japheth[a], and may he dwell in the tents of Shem, and let Canaan be a servant to them.
translation:
  language: ta
  text: தேவன் யாப்பேத்துக்கு விரிவளிப்பாராக; சேமின் கூடாரங்களில் குடியிருக்கட்டும்[a]; கானான் அவர்களுக்கு அடிமையாகட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, “தேவன் சேமின் கூடாரங்களில் குடியிருக்கட்டும்”; அல்லது, “யாப்பேத் சேமின் கூடாரங்களில் குடியிருக்கட்டும்.” ‘குடியிருக்கட்டும்’ என்பதன் எழுவாயை எபிரெயம் வெளிப்படையாகக் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: יַפְתְּ
  choice: இடத்தை விசாலமாக்குவாராக
  rationale: இந்த வினை யாப்பேத்துக்கு விசாலமான இடத்தை ஏற்படுத்துதல் என்ற பொருளைத் தருகிறது. எபிரெயத்தில் இது ‘யாப்பேத்’ என்ற பெயருடன் ஒலிநயம் கொண்டுள்ளது; அந்த ஒலிநயத்தைத் தமிழில் இயல்பாக மீட்டுருவாக்க முடியாவிட்டாலும், இடவிரிவின் அடிப்படைப் பொருள் பாதுகாக்கப்படுகிறது.
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: வடிவத்தில் பன்மையாகத் தோன்றினாலும், இங்கு ஒருமை வினைச்சூழலில் ஒரே தேவனைக் குறிக்கிறது.
- source_word: לְיֶפֶת
  choice: யாப்பேத்துக்கு
  rationale: לְ முன்னொட்டு பயனாளி அல்லது சார்புப் பொருளைச் சுட்டுவதால், தமிழில் இயல்பாக நான்காம் வேற்றுமையில் வழங்கப்பட்டுள்ளது.
- source_word: וְיִשְׁכֹּן
  choice: குடியிருப்பாராக
  rationale: வாழ்த்துரைத் தன்மையுள்ள ஒருமை வினை வடிவம் பாதுகாக்கப்பட்டுள்ளது. எழுவாய் வெளிப்படையாகச் சேர்க்கப்படாததால், அது தேவனையோ யாப்பேத்தையோ குறிக்கக்கூடிய மூலமொழியின் தெளிவின்மை நிலைக்கிறது.
- source_word: בְּאָהֳלֵי שֵׁם
  choice: சேமின் கூடாரங்களில்
  rationale: இடத்தைக் குறிக்கும் சொற்றொடரும் ‘கூடாரங்கள்’ என்ற உருவகப் படிமமும் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளன.
- source_word: וִיהִי
  choice: இருப்பானாக
  rationale: முந்தைய வாழ்த்துரை/தீர்ப்புரை நடையைத் தொடரும் விருப்பவினைத் தன்மையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כְנַעַן
  choice: கானான்
  rationale: ஆளையும் அவரது வம்சவரிசையையும் குறிக்கும் பெயர், வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது.
- source_word: עֶבֶד
  choice: அடிமை
  rationale: இங்கு கீழ்ப்படுத்தப்பட்ட பிணைப்பட்ட நிலையே தீர்ப்புரையின் மையமாக இருப்பதால், மென்மைப்படுத்திய ‘பணியாள்’ என்பதற்குப் பதிலாக ‘அடிமை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לָמוֹ
  choice: அவர்களுக்கு
  rationale: இவ்வடிவம் இங்கு பன்மையாகப் புரிந்துகொள்ளப்பட்டு, உரையின் ஓட்டத்தில் சேம் மற்றும் யாப்பேத் இருவரையும் சுட்டுகிறது.
theological_decisions:
- issue: ‘சேமின் கூடாரங்களில் குடியிருப்பார்’ என்பதன் எழுவாய் யார்?
  choice: எழுவாயைக் குறிப்பிடாமல் ‘குடியிருப்பாராக’ என்று மூலத்தின் தெளிவின்மையைப் பாதுகாத்தல்
  alternative: ‘தேவன் சேமின் கூடாரங்களில் குடியிருப்பாராக’ அல்லது ‘யாப்பேத் சேமின் கூடாரங்களில் குடியிருப்பாராக’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: எபிரெய ஒருமை வினைக்கு வெளிப்படையான எழுவாய் இல்லை; சூழலில் தேவனும் யாப்பேத்தும் சாத்தியமான எழுவாய்களாக உள்ளனர். ஆகவே ஒரு விளக்கத்தைத் தேர்ந்து மற்றொன்றை நீக்காமல், அடிக்குறிப்பில் இரு வாசிப்புகளும் தெரிவிக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் தீர்ப்புரைச் செறிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘கூடாரங்கள்’ என்ற மூலப் படிமமும், வாழ்த்துரை/சாபவுரை வினைநடையும், எழுவாய் குறித்த உண்மையான தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
