base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/001.yaml
  text: And God blessed Noah and his sons[a], and said to them, “Be fruitful and multiply and fill the earth.”
translation:
  language: ta
  text: கடவுள் நோவாவையும் அவனுடைய மகன்களையும் ஆசீர்வதித்து, அவர்களிடம், “பலுகிப் பெருகி, பூமியை நிரப்புங்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பூமி’ என்பதற்குப் பதிலாக ‘நாடு’ என்றும் மொழிபெயர்க்கலாம்; ஆனால் வெள்ளத்திற்குப் பிந்தைய சூழலும் ஆதியாகமம் 1:28-இன் எதிரொலியும் இங்கு ‘பூமி’ என்பதையே சிறப்பாகப் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: ஆசீர்வதித்து
  rationale: பியேல் வினை இங்கு வெறுமனே நல்வார்த்தை கூறுவதை அல்ல, ஆசீர்வாதத்தை வழங்குவதைக் குறிக்கிறது. தமிழில் இயல்பான வேதாகம நடையில் ‘ஆசீர்வதித்து’ இதைத் துல்லியமாகக் காட்டுகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இந்தக் கதைச் சூழலில் இச்சொல் ஒரே கடவுளைக் குறிக்கிறது; நவீன பொதுத்தமிழில் ‘கடவுள்’ இயல்பான தெரிவாகும்.
- source_word: נֹחַ
  choice: நோவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்கள்
  rationale: எபிரெயச் சொல் பொதுவாகப் பிள்ளைகளைக் குறிக்காமல் குறிப்பாக மகன்களைக் குறிக்கிறது; ஆகவே பாலினத் துல்லியம் காக்கப்பட்டுள்ளது.
- source_word: וַיֹּאמֶר לָהֶם
  choice: அவர்களிடம் … என்றார்
  rationale: இது நேரடியான கதைநடைப் பேச்சு அறிமுகம். தமிழில் மரியாதையும் இயல்பும் காக்கும் வகையில் கடவுளுக்கு ‘என்றார்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: פְּרוּ
  choice: பலுகி
  rationale: இவ்வினை சந்ததி உண்டாக்கி எண்ணிக்கையில் வளர்வதைக் குறிக்கிறது. ‘பலுகிப் பெருகி’ என்ற இணைமொழி ஆதியாகமம் 1:28 உடனான சொல் எதிரொலியைக் காக்கிறது.
- source_word: וּרְבוּ
  choice: பெருகி
  rationale: எண்ணிக்கையில் மிகுதியாகுமாறு கொடுக்கப்பட்ட பன்மை ஏவலை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: וּמִלְאוּ
  choice: நிரப்புங்கள்
  rationale: எபிரெய வினையின் அடிப்படைப் பொருள் ‘நிரப்பு’; வெள்ளத்திற்குப் பின் ‘மீண்டும் நிரப்பு’ என்ற கூடுதல் பொருளை மொழிபெயர்ப்பு புகுத்தவில்லை.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: வெள்ளத்திற்குப் பிந்தைய உலகளாவிய சூழலும் ஆதியாகமம் 1:28 உடனான எதிரொலியும் இங்கு ‘நாடு’ என்பதைக் காட்டிலும் ‘பூமி’ என்பதற்கு ஆதரவளிக்கின்றன.
theological_decisions:
- issue: ஆதியாகமம் 1:28-இன் படைப்புக் கட்டளையுடனான தொடர்பு
  choice: ‘பலுகிப் பெருகி, பூமியை நிரப்புங்கள்’ என்ற சுருக்கமான மரபுசார் சொற்றொடர் காக்கப்பட்டது.
  alternative: ‘நிறையப் பிள்ளைகளைப் பெற்று பூமியெங்கும் குடியேறுங்கள்’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: எபிரெய உரை படைப்பின் தொடக்கத்தில் வழங்கப்பட்ட ஆசீர்வாத மொழியைத் திட்டமிட்டு மீண்டும் பயன்படுத்துகிறது. விளக்க விரிவாக்கமின்றி அந்தச் சொல் எதிரொலியையும், வெள்ளத்திற்குப் பிந்தைய மனிதகுலம் படைப்புக் கட்டளையோடு தொடர்வதையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் dignified கதைநடை பயன்படுத்தப்பட்டுள்ளது. ஒரே வாக்கியத்தின் இயல்பான ஓட்டத்திற்காக எபிரெய இணைப்புகள் தமிழில் வினையெச்சங்களாக அமைக்கப்பட்டுள்ளன. கடவுளைக் குறிக்கும் வினைக்கு மரியாதைப் பன்மை பயன்படுத்தப்பட்டாலும், நோவாவைச் சுட்டும் உடைமைத் தொடர் மூலத்தின் ஒருமையைத் தெளிவாகக் காக்கிறது.
