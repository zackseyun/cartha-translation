  text: וְ/אַתֶּ֖ם פְּר֣וּ וּ/רְב֑וּ שִׁרְצ֥וּ בָ/אָ֖רֶץ וּ/רְבוּ בָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/007.yaml
  text: And as for you[a], be fruitful and multiply; swarm in the earth and multiply in it.
translation:
  language: ta
  text: நீங்களோ, பலுகிப் பெருகுங்கள்; பூமியில் திரளாய்ப் பரவுங்கள்[a]; அதில் பெருகுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமியில் திரளாய்ப் பெருகுங்கள்.” எபிரெய வினைச்சொல் உயிரினங்கள் திரளாகப் பல்கிப் பரவுவதைப் போன்ற மிகுதியான பெருக்கைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: நீங்களோ
  rationale: இணைப்புச் சொல்லுடன் வரும் தனிப்பட்ட பதிலிப்பெயர் வலியுறுத்தலையும் முந்தைய சூழலிலிருந்து தொடரும் எதிர்முகத் திருப்பத்தையும் காட்டுகிறது; ‘நீங்களோ’ என்பது இதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פְּרוּ
  choice: பலுகி
  rationale: פרה என்பது இங்கு சந்ததியைப் பெற்று வளரும் பொருளுடைய ஆசீர்வாத-கட்டளைச் சொல்; רבה என்பதிலிருந்து அதன் நுண்ணிய வேறுபாட்டைப் பேண ‘பலுகி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וּרְבוּ
  choice: பெருகுங்கள்
  rationale: רבה எண்ணிக்கையில் மிகுதியாகுதலைக் குறிக்கிறது. தமிழில் இயல்பாகவும் படைப்பு-ஆசீர்வாத மொழிநடைக்கு ஏற்றதாகவும் ‘பெருகுங்கள்’ உள்ளது.
- source_word: שִׁרְצוּ
  choice: திரளாய்ப் பெருகுங்கள்
  rationale: שׁרץ பெருந்திரளாகப் பல்கிப் பரவும் வலுவான படிமத்தைக் கொண்டது. மனிதர்களைக் குறிக்கும் இவ்விடத்தில் ‘திரளாய்ப் பெருகுங்கள்’ அந்தப் படிமத்தையும் இயல்பான தமிழ் நடையையும் இணைக்கிறது.
- source_word: בָאָרֶץ
  choice: பூமியில்
  rationale: אֶרֶץ இங்கு வெள்ளத்திற்குப் பிந்தைய மனிதப் பெருக்கத்தின் களமாக முழுப் பூமியைக் குறிக்கிறது; בְּ முன்னிடைச்சொல்லை ‘பூமியில்’ நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: וּרְבוּ בָהּ
  choice: அதில் பெருகுங்கள்
  rationale: רבה மீண்டும் வருவது மூலத்தின் வலியுறுத்தலையும் இணை அமைப்பையும் தருவதால் மீளுரைத்தல் தக்கவைக்கப்படுகிறது; பெண்பால் பின்னொட்டு אֶרֶץ என்பதைக் குறிப்பதால் ‘அதில்’ என மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: படைப்புக் கட்டளைக்கும் வெள்ளத்திற்குப் பிந்தைய ஆசீர்வாதத்திற்கும் இவ்வசனம் கொண்டுள்ள தொடர்பு
  choice: நோவாவுக்கும் அவன் மகன்களுக்கும் வழங்கப்படும் புதுப்பிக்கப்பட்ட தெய்வீக ஆசீர்வாத-கட்டளையாக, கூடுதல் இறையியல் விளக்கமின்றி மொழிபெயர்த்தல்
  alternative: இதை ஆதியாகமம் 1:28-ன் வெறும் மறுபதிப்பாக மட்டும் கருதுதல் அல்லது விரிவாக்கப்பட்ட உடன்படிக்கைச் சூத்திரமாக விளக்கச் சொற்களைச் சேர்த்தல்
  rationale: எபிரெய உரை ஆதியாகமம் 1:28-ஐ எதிரொலிக்கும் கட்டளை வடிவைக் கொண்டுள்ளது. அந்த எதிரொலியைச் சொற்களிலேயே பேணி, உரைக்கு அப்பாற்பட்ட கோட்பாட்டு முடிவுகளை மொழிபெயர்ப்பில் சேர்க்காமல் விடுவது பொருத்தமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. ‘பலுகிப் பெருகுங்கள்’ என்ற பழக்கமான இணைமொழி படைப்பு-ஆசீர்வாத எதிரொலியைப் பேணுகிறது; அரிதாகத் தோன்றக்கூடிய שׁרץ படிமம் முதன்மை உரையிலும் அடிக்குறிப்பிலும் தெளிவாக்கப்பட்டுள்ளது.
