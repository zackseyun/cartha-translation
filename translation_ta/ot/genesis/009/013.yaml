source:
  edition: WLC
  text: אֶת קַשְׁתִּ֕/י נָתַ֖תִּי בֶּֽ/עָנָ֑ן וְ/הָֽיְתָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵ֥ין הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/013.yaml
  text: I have set my bow in the cloud[a], and it will be a sign of the covenant between me and the earth.
translation:
  language: ta
  text: என் வில்லை மேகத்தில் வைத்திருக்கிறேன்[a]; அது எனக்கும் பூமிக்கும் இடையிலான உடன்படிக்கையின் அடையாளமாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் வானவில்லை.’ எபிரெயத்தில் நேரடியாக ‘என் வில்’ என்று உள்ளது; அது பொதுவாக வில்லைக் குறிக்கும் சொல். இங்கு மேகத்தில் தோன்றும் வானவில்லைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַשְׁתִּי
  choice: என் வில்லை
  rationale: קֶשֶׁת என்பதன் நேரடிப் பொருள் ‘வில்’. மேகத்தின் சூழலில் அது வானவில்லைச் சுட்டினாலும், எபிரெய மூலத்தின் வில் உருவகத்தை முதன்மை உரை தக்கவைக்கிறது; சூழல்சார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: נָתַתִּי
  choice: வைத்திருக்கிறேன்
  rationale: נתן இங்கு ‘வை/நிறுத்து’ என்ற பொருளில் வருகிறது. நிறைவேற்றப்பட்ட செயலின் தற்போதைய தொடர்பை இயல்பான நவீன தமிழில் ‘வைத்திருக்கிறேன்’ வெளிப்படுத்துகிறது.
- source_word: בֶּעָנָן
  choice: மேகத்தில்
  rationale: மூலத்தில் பெயர்ச்சொல் ஒருமையில் இருப்பதால் ‘மேகத்தில்’ என்று நேரடியாக மொழிபெயர்க்கப்படுகிறது.
- source_word: וְהָיְתָה
  choice: அது ... இருக்கும்
  rationale: இச்சூழலில் இணைப்புடன் வரும் வினை வடிவம் எதிர்கால அல்லது விளைவு சார்ந்த பொருளைக் கொண்டுள்ளது.
- source_word: לְאוֹת בְּרִית
  choice: உடன்படிக்கையின் அடையாளமாக
  rationale: אוֹת என்பது ‘அடையாளம்’; בְּרִית என்பது உடன்படிக்கை. தமிழில் இயல்பாகவும் மூலத்தின் உறவையும் தெளிவாகவும் காட்ட இவ்வாறு அமைக்கப்பட்டுள்ளது.
- source_word: בֵּינִי וּבֵין הָאָרֶץ
  choice: எனக்கும் பூமிக்கும் இடையிலான
  rationale: אֶרֶץ என்பதற்கு ‘நிலம்’ அல்லது ‘பூமி’ என்று பொருள் வரலாம்; பெருவெள்ளக் கதையின் உலகளாவிய சூழலால் ‘பூமி’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் קַשְׁתִּי என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘என் வில்’ என்ற நேரடிப் படிமத்தைத் தக்கவைத்து, சூழலில் வானவில் எனப் புரிந்துகொள்ளுதல்
  alternative: என் வானவில்லை
  rationale: எபிரெயம் சாதாரணமாக ஆயுத வில்லைக் குறிக்கும் சொல்லையே பயன்படுத்துகிறது. அந்தப் படிமத்தை மொழிபெயர்ப்பு மறைக்காமல் காக்கிறது; நவீன வாசகருக்கான சூழல்சார் குறிப்பு அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு விளங்கும் கண்ணியமான நடை. எபிரெய மூலத்தின் ‘வில்’ படிமம் பாதுகாக்கப்பட்டு, ‘வானவில்’ என்ற சூழல்சார் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
