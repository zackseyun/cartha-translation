  text: and I will remember my covenant that is between me and you and every living creature among all flesh[b][a], and the waters will never again become a flood to destroy all flesh.
translation:
  language: ta
  text: எனக்கும் உங்களுக்கும் எல்லா உடலுள்ள உயிரினங்களுக்கும் இடையே உள்ள என் உடன்படிக்கையை நான் நினைவுகூருவேன்; எல்லா உடலுள்ள உயிரினங்களையும் அழிப்பதற்காகத் தண்ணீர் இனி ஒருபோதும் பெருவெள்ளமாக மாறாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: நான் நினைவுகூருவேன்
  rationale: Qal perfect 1cs இச்சூழலில் எதிர்காலப் பொருள் தருகிறது. உடன்படிக்கையைச் சார்ந்த முக்கியமான நினைவுகூருதல் மொழியை விளக்கவுரையாக மாற்றாமல் நேரடியாகப் பேணுகிறது.
- source_word: בְּרִיתִי
  choice: என் உடன்படிக்கையை
  rationale: בְּרִית என்பதன் உறவுசார், வாக்குறுதிசார் பொருளைப் பேணும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: כָּל נֶפֶשׁ חַיָּה בְּכָל בָּשָׂר
  choice: எல்லா உயிருள்ள உடல்களுக்கும்
  rationale: נֶפֶשׁ חַיָּה என்பது உயிருள்ள பிராணியைக் குறிக்கிறது; בָּשָׂר மனிதர்களை மட்டும் அல்லாமல் உடலுள்ள உயிரினங்கள் அனைத்தையும் உள்ளடக்குகிறது. தமிழ் வாக்கியத்தில் உடன்படிக்கையின் தரப்புகளாக இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: וְלֹא יִהְיֶה עוֹד הַמַּיִם לְמַבּוּל
  choice: தண்ணீர் இனி ஒருபோதும் பெருவெள்ளமாக மாறாது
  rationale: עוֹד உடன் வரும் மறுப்பு மீண்டும் நிகழாததை வலியுறுத்துகிறது; לְמַבּוּל இங்கு விளைவு அல்லது செயல்பாட்டைக் குறிக்கிறது.
- source_word: לְשַׁחֵת כָּל בָּשָׂר
  choice: எல்லா உயிர்களையும் அழிப்பதற்காக
  rationale: לְשַׁחֵת நோக்கம் அல்லது விளைவைக் குறிக்கிறது. இறுதிப் பயன்பாட்டில் 'சதை' என்ற சொற்படி மொழிபெயர்ப்பு தமிழ் வாசகருக்குத் தவறான உடற்கூறு உணர்வைத் தரக்கூடும் என்பதால், சூழலுக்கேற்ற உள்ளடக்கிய வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: கடவுள் நினைவுகூருகிறார் என்ற மனிதரூப மொழி
  choice: நான் நினைவுகூருவேன்
  alternative: என் உடன்படிக்கையை மனதில் வைத்திருப்பேன் / அதன்படி செயல்படுவேன்
  rationale: எபிரெய மூலத்தின் நினைவுகூருதல் மொழியையும் அதன் உடன்படிக்கை சார்ந்த இறையியல் இழுப்பையும் விளக்கிப் போக்காமல் பேணுகிறது.
- issue: உடன்படிக்கையின் உயிரினங்களை உள்ளடக்கும் பரப்பு
  choice: மனிதரை மட்டும் அல்லாமல் உடலுள்ள உயிரினங்கள் அனைத்தையும் உள்ளடக்குதல்
  alternative: எல்லா மனிதர்களும்
  rationale: כָּל נֶפֶשׁ חַיָּה மற்றும் כָּל בָּשָׂר ஆகியவை இச்சூழலில் விலங்குகளையும் உள்ளடக்குகின்றன; மனிதர்களுக்கு மட்டும் வரம்பிடுவது மூலத்தின் பரப்பைக் குறைக்கும்.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ். 'உடன்படிக்கை', 'நினைவுகூருவேன்', 'பெருவெள்ளம்' ஆகியவை வேதாகமச் செறிவைப் பேணுகின்றன; கடினமான எபிரெயத் தொடரின் பொருள் அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
