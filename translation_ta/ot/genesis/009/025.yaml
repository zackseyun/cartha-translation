source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אָר֣וּר כְּנָ֑עַן עֶ֥בֶד עֲבָדִ֖ים יִֽהְיֶ֥ה לְ/אֶחָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/025.yaml
  text: And he said[a], “Canaan is cursed[c][b]; he shall be a servant of servants to his brothers.”
translation:
  language: ta
  text: 'அவன் சொன்னான்: “கானான் சபிக்கப்பட்டவன்! அவன் தன் சகோதரர்களுக்கு அடிமைகளின் அடிமையாக[a] இருப்பான்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அடிமைகளின் அடிமை” என்பது மிகக் கடுமையான அடிமை நிலையை வலியுறுத்தும் எபிரெயச் சொற்றொடர்; “அடிமைகளிலேயே மிகவும் தாழ்ந்தவன்” என்பது அதன் பொருள்.
    reason: எபிரெயத் தீவிரப்படுத்தும் சொற்றொடரின் பொருளை விளக்குதல்.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவன் சொன்னான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தருகிறது; சூழலில் பேசுபவர் நோவா என்பது தெளிவாக உள்ளது.
- source_word: אָרוּר
  choice: சபிக்கப்பட்டவன்
  rationale: வினையில்லா எபிரெயப் பயனிலைத் தொடரின் அறிவிப்புத் தன்மையையும் சாபவாக்கின் வலிமையையும் காக்கிறது.
- source_word: כְּנָעַן
  choice: கானான்
  rationale: மூலத்தில் சபிக்கப்படுபவராகக் குறிப்பிடப்பட்டுள்ள பெயரையே ஒலிபெயர்க்கிறது.
- source_word: עֶבֶד עֲבָדִים
  choice: அடிமைகளின் அடிமை
  rationale: கட்டுப்பட்ட பணிவிடை நிலையையும், தீவிரத்தை வலியுறுத்தும் எபிரெயத் திரும்புரையையும் மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: יִהְיֶה
  choice: இருப்பான்
  rationale: சாபவாக்கில் கூறப்படும் எதிர்கால நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְאֶחָיו
  choice: தன் சகோதரர்களுக்கு
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டையும் ‘சகோதரர்கள்’ என்ற நேரடிப் பொருளையும் காக்கிறது.
theological_decisions:
- issue: நோவாவின் சாபம் யார்மீது கூறப்படுகிறது?
  choice: கானானே சபிக்கப்பட்டவன் என்று மொழிபெயர்க்கப்பட்டது.
  alternative: சாபம் நேரடியாக காம்மீது கூறப்பட்டதாக விளக்குதல்.
  rationale: எபிரெய மூலத்தில் כְּנָעַן (‘கானான்’) என்றே வெளிப்படையாக உள்ளது; விளக்க மரபின் அடிப்படையில் அதை காம் என மாற்றவில்லை.
- issue: அடிமைத்தனத்தைக் குறிக்கும் சொல்லின் தீவிரம்
  choice: ‘அடிமைகளின் அடிமை’ என்று தரப்பட்டது.
  alternative: ‘ஊழியர்களின் ஊழியன்’ அல்லது ‘மிகத் தாழ்ந்த அடிமை’ என்று தருதல்.
  rationale: முதல் மாற்று மூலத்தின் கடுமையைத் தணிக்கும்; இரண்டாவது அதன் பொருளை முன்கூட்டியே விளக்கிவிடும். மூலத்தின் சொல்லாட்சியையும் அதன் வலியுறுத்தலையும் முதன்மை உரையில் காத்து, பொருளை அடிக்குறிப்பில் விளக்கியுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாபவாக்கிற்குரிய கண்ணியமும் தீவிரமும் காக்கப்பட்டுள்ளன. ‘அடிமை’ என்ற சொல் மூலத்தின் கடுமையை மறைக்காமல் தருகிறது; ‘அடிமைகளின் அடிமை’ என்ற வடிவம் எபிரெயச் சொல்லாட்சியைத் தெளிவாகப் பாதுகாக்கிறது.
