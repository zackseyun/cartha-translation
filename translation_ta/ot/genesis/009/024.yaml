  yaml_path: translation/ot/genesis/009/024.yaml
  text: When Noah awoke from his wine[a], he knew what his youngest son had done to him.
translation:
  language: ta
  text: நோவா திராட்சரசத்தின் மயக்கத்திலிருந்து விழித்தபோது, தன் இளைய மகன் தனக்குச் செய்ததை அறிந்துகொண்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் மிக இளைய மகன்.” எபிரெயச் சொல் சூழலைப் பொறுத்து “சிறியவன்,” “இளையவன்,” அல்லது “மிக இளையவன்” எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיקֶץ
  choice: விழித்தபோது
  rationale: יקץ என்பது தூக்கத்திலிருந்து விழிப்பதைக் குறிக்கிறது. இங்கு திராட்சரசத்தால் ஏற்பட்ட மயக்கத் தூக்கத்திலிருந்து நோவா விழிப்பதே சூழலுக்கேற்ற நேரடிப் பொருள்; ‘தெளிந்தபோது’ என்பது கூடுதல் விளக்கம்.
- source_word: מִיֵּינוֹ
  choice: திராட்சரசத்தின் மயக்கத்திலிருந்து
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘தன் திராட்சரசத்திலிருந்து’ என இருந்தாலும், தமிழில் அது இயல்பற்றதும் பொருள் தெளிவற்றதும் ஆகும். திராட்சரசத்தால் ஏற்பட்ட மயக்கநிலையிலிருந்து விழித்ததை இவ்வாறு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֵּדַע
  choice: அறிந்துகொண்டான்
  rationale: ידע என்பதன் அடிப்படைப் பொருள் ‘அறிதல்.’ நிகழ்வுகளின் வரிசையில், முன்பு நடந்ததை நோவா பின்னர் தெரிந்துகொண்டான் என்பதால் ‘அறிந்துகொண்டான்’ இயல்பான தமிழாக்கம்.
- source_word: אֵת אֲשֶׁר עָשָׂה לוֹ
  choice: தனக்குச் செய்ததை
  rationale: செயலின் தன்மையை விளக்காமல், நோவாவுக்கு என்ன செய்யப்பட்டதோ அதை மட்டும் எபிரெய உரையைப் போல பொதுவாகக் குறிப்பிடுகிறது.
- source_word: בְּנוֹ הַקָּטָן
  choice: தன் இளைய மகன்
  rationale: קָטָן என்பதற்கு ‘சிறிய,’ ‘இளைய,’ அல்லது சூழலைப் பொறுத்து ‘கடைசி/மிக இளைய’ என்ற பொருள் வரலாம். குடும்ப உறவுச் சூழலில் ‘இளைய மகன்’ இயல்பானது; தரவரிசையைத் திட்டவட்டமாக்காமல் மூலத்தின் நெகிழ்வையும் காக்கிறது.
theological_decisions:
- issue: நோவாவுக்குச் செய்யப்பட்ட செயலின் தன்மை
  choice: ‘தனக்குச் செய்ததை’ என்று பொதுவாகவே மொழிபெயர்த்து, செயல் என்ன என்பதை வரையறுக்கவில்லை.
  alternative: காமின் பார்ப்பதும் வெளியே சென்று சொல்வதும் என்று விளக்குதல்; அல்லது பாலியல் வன்முறை என்று விளக்குதல்.
  rationale: இவ்வசனம் அந்தச் செயலைத் தனிப்பட வரையறுக்கவில்லை. குறிப்பிட்ட விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல், மூல உரையின் தெளிவின்மையையும் இறையியல் பதற்றத்தையும் காக்கிறது.
- issue: בְּנוֹ הַקָּטָן என்பதன் வயது உறவுப் பொருள்
  choice: முதன்மை உரையில் ‘தன் இளைய மகன்’ என்று வழங்கி, ‘மிக இளைய மகன்’ என்ற சாத்தியத்தை அடிக்குறிப்பில் குறிப்பிடுகிறது.
  alternative: ‘தன் மிக இளைய மகன்’ என்று திட்டவட்டமாக மொழிபெயர்த்தல்.
  rationale: קָטָן ஒப்பீட்டு வகையில் ‘இளைய’ என்றும் உச்சநிலை வகையில் ‘மிக இளைய’ என்றும் பொருள்படலாம். இந்தச் சூழலில் இரண்டுக்கும் வாய்ப்புள்ளதால் தமிழில் உண்மையான சொற்பொருள் நெகிழ்வைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘திராட்சரசத்தின் மயக்கத்திலிருந்து’ என்பது எபிரெய மொழிவழக்கின் நோக்கத்தை இயல்பான தமிழில் தருகிறது. ‘இளைய மகன்’ என்ற வாசகம் மூலச் சொல்லின் ஒப்பீட்டு/உச்சநிலைத் தெளிவின்மையைப் பாதுகாக்கிறது; அடிக்குறிப்பு மாற்றுப் பொருளைக் காட்டுகிறது.
