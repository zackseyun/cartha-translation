  text: וַ/הֲקִמֹתִ֤י אֶת בְּרִיתִ/י֙ אִתְּ/כֶ֔ם וְ/לֹֽא יִכָּרֵ֧ת כָּל בָּשָׂ֛ר ע֖וֹד מִ/מֵּ֣י הַ/מַּבּ֑וּל וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד מַבּ֖וּל לְ/שַׁחֵ֥ת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/011.yaml
  text: 'And I will establish my covenant with you: never again will all flesh be cut off by the waters of the flood[b][a], and never again will there be a flood to destroy the earth.'
translation:
  language: ta
  text: 'நான் உங்களோடு என் உடன்படிக்கையை நிலைநிறுத்துவேன்: இனி ஒருபோதும் வெள்ளத்தின் நீரால் உயிரினங்கள் அனைத்தும்[a] அடியோடு அழிக்கப்படாது[b]; பூமியை அழிப்பதற்கு இனி ஒருபோதும் வெள்ளம் வராது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, ‘எல்லா மாம்சமும்’; இங்கு மனிதர்களை மட்டுமல்ல, உயிரினங்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘துண்டிக்கப்படாது’; எபிரெய வினைச்சொல்லின் சொல்லர்த்தம் ‘துண்டிக்கப்படுதல்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: நிலைநிறுத்துவேன்
  rationale: קום என்பதன் ஹிஃபில் வடிவம் உடன்படிக்கைச் சூழலில் அதை நிறுவுதல் அல்லது உறுதிப்படுத்துதல் என்ற பொருளைக் கொள்ளலாம். ‘நிலைநிறுத்துவேன்’ என்பது வாக்குறுதியின் எதிர்காலத் தன்மையையும் அந்த இரு நுணுக்கங்களையும் இயன்றவரை காக்கிறது.
- source_word: בְּרִיתִי
  choice: என் உடன்படிக்கை
  rationale: בְּרִית என்பதற்கான இயல்பான, மரியாதையான தமிழ் இணை; ஆதியாகமத்தில் அதன் இலக்கிய மற்றும் இறையியல் முக்கியத்துவத்தையும் காக்கிறது.
- source_word: אִתְּכֶם
  choice: உங்களோடு
  rationale: பன்மை முகவரியை இயல்பான தமிழில் நேரடியாகக் குறிக்கிறது.
- source_word: יִכָּרֵת
  choice: அடியோடு அழிக்கப்படாது
  rationale: כרת என்பதன் நிஃபால் வடிவம் சொல்லர்த்தமாக ‘துண்டிக்கப்படுதல்’ எனினும், வெள்ளத் தீர்ப்பின் சூழலில் முற்றிலும் அழிவதைக் குறிக்கிறது. தற்போதைய தமிழ் வாசகருக்கு இயல்பாக இருக்க ‘அடியோடு அழிக்கப்படாது’ என மொழிபெயர்த்து, சொல்லர்த்தத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: כָּל בָּשָׂר
  choice: உயிருள்ள அனைத்தும்
  rationale: சொல்லர்த்தமாக ‘எல்லா மாம்சமும்’; இச்சூழலில் மனிதர்களை மட்டும் அல்லாமல் உயிரினங்களை விரிவாகக் குறிக்கிறது. ‘உயிருள்ள அனைத்தும்’ அந்த விரிவை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: עוֹד
  choice: இனி ஒருபோதும்
  rationale: மறுப்புடன் இருமுறை வரும் עוֹד, இந்த வாக்குறுதிச் சூழலில் ‘மீண்டும் ஒருபோதும் இல்லை’ என்ற வலுவான பொருளைத் தருகிறது.
- source_word: מִמֵּי הַמַּבּוּל
  choice: வெள்ளத்தின் நீரால்
  rationale: מן இங்கு அழிவுக்குக் காரணமான கருவி அல்லது மூலத்தைக் குறிக்கிறது; தமிழ் வேற்றுமை உருபு அதனைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מַבּוּל
  choice: வெள்ளம்
  rationale: நோவாவின் நிகழ்வில் மַבּוּל என்பதற்கான நிலையான, பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: לְשַׁחֵת
  choice: அழிப்பதற்கு
  rationale: שׁחת இங்கு அழிவை ஏற்படுத்துவதைக் குறிக்கிறது; நோக்கத்தைக் காட்டும் לְ வடிவமும் தமிழில் காக்கப்பட்டுள்ளது.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: வெள்ளம் மற்றும் உலகளாவிய உடன்படிக்கைச் சூழலில் ‘நிலம்’ என்பதைவிட ‘பூமி’ பொருத்தமானது; அதேவேளை எபிரெயச் சொல்லின் அடிப்படை விரிவையும் சுருக்கவில்லை.
theological_decisions:
- issue: ‘எல்லா மாம்சமும்’ என்பதன் வரம்பு
  choice: மனிதர்களுக்கு மட்டும் கட்டுப்படுத்தாமல் ‘உயிருள்ள அனைத்தும்’ என விரிவாக மொழிபெயர்க்கப்பட்டது.
  alternative: மனிதர்கள் அனைவரும்; மாம்சமான யாவும்
  rationale: வெள்ளத்துக்குப் பிந்தைய உடன்படிக்கையில் மனிதர்களும் விலங்குகளும் அடங்குகின்றனர். இந்த மொழிபெயர்ப்பு எபிரெயச் சொற்றொடரின் பரந்த வரம்பைக் காக்கிறது.
- issue: קום உடன் வரும் உடன்படிக்கைச் சொற்றொடர்
  choice: ‘என் உடன்படிக்கையை நிலைநிறுத்துவேன்’
  alternative: என் உடன்படிக்கையை ஏற்படுத்துவேன்; என் உடன்படிக்கையை உறுதிப்படுத்துவேன்
  rationale: உடன்படிக்கை புதிதாக நிறுவப்படுகிறதா அல்லது ஏற்கெனவே அறிவிக்கப்பட்டது உறுதிப்படுத்தப்படுகிறதா என்பதைத் தேவையின்றி முடிவுசெய்யாமல், மூலத்தின் நுணுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்கும் தெளிவாகவும் உடன்படிக்கை வாக்குறுதிக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. இருமுறை வரும் ‘இனி ஒருபோதும்’ காக்கப்பட்டுள்ளது; அரைப்புள்ளி மூலவாக்கியத்தின் இணையான இரு வாக்குறுதிகளைத் தெளிவாகப் பிரிக்கிறது.
