  terminology: ‘உடன்படிக்கை,’ ‘நிலைநிறுத்துவேன்,’ ‘வெள்ளம்,’ and ‘பூமி’ are suitable and consistent. The lexical footnotes are correctly anchored and preserve the literal alternatives.
