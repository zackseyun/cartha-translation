  yaml_path: translation/ot/genesis/009/019.yaml
  text: These three were the sons of Noah[a], and from these the whole earth was populated.
translation:
  language: ta
  text: இவர்கள் மூவரும் நோவாவின் மகன்கள்; இவர்களிடமிருந்தே பூமியெங்கும் மக்கள் பரவினர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சார்ந்து, “இவர்களிடமிருந்து முழுப் பூமியும் சிதறிப் பரவியது.” இங்கு “பூமி” என்பது அதன் மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשָׁה אֵלֶּה
  choice: இவர்கள் மூவரும்
  rationale: முன்னிலைப்படுத்தப்பட்ட எபிரெய எண்ணும் சுட்டுப்பெயரும் தரும் வலியுறுத்தலை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: בְּנֵי נֹחַ
  choice: நோவாவின் மகன்கள்
  rationale: எபிரெய மொழியில் வினைச்சொல் இல்லாத பெயர்த் தொடரைத் தமிழில் இயல்பாகத் தருகிறது; முன்சூழலின் ஆண்மக்களைக் குறிக்கும் பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: וּמֵאֵלֶּה
  choice: இவர்களிடமிருந்தே
  rationale: מִן என்பதன் ‘இவர்களிடமிருந்து’ என்ற தோற்றுவாய் பொருளைத் தருவதோடு, வாக்கியத்தின் சுருக்கக் கருத்துக்கேற்ற வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נָפְצָה
  choice: மக்கள் பரவினர்
  rationale: வேர்ச்சொல்லின் ‘சிதறுதல்/பரவுதல்’ என்ற அடிப்படைப் பொருளையும், வெள்ளத்துக்குப் பிந்தைய மனிதப் பரவல் என்ற சூழலையும் இணைத்துக் காட்டுகிறது; ‘குடியேற்றப்பட்டது’ என்ற விளக்க மொழிபெயர்ப்பைவிட மூல உருவகத்துக்கு நெருக்கமானது.
- source_word: כָל הָאָרֶץ
  choice: பூமியெங்கும்
  rationale: ‘முழுப் பூமி’ என்ற உலகளாவிய பரப்பை இயல்பான தமிழில் தெரிவிக்கிறது; இங்கு אֶרֶץ என்பதற்கு சாத்தியமான ‘நிலம்/நாடு’ என்ற குறுகிய பொருளைச் சூழல் ஆதரிப்பதில்லை.
theological_decisions:
- issue: வெள்ளத்துக்குப் பிந்தைய நாடுகளின் பட்டியல் சூழலில் הָאָרֶץ என்பதன் பரப்பு
  choice: பூமியெங்கும்
  alternative: நிலமெங்கும்
  rationale: இந்த வசனம் நோவாவின் மக்களிடமிருந்து மனிதர்கள் பரவியதைச் சுருக்கமாகக் கூறுவதால், ஒரு குறிப்பிட்ட நிலப்பகுதியைவிட உலகளாவிய பொருள் பொருத்தமானது.
- issue: נָפְצָה என்பதன் இலக்கண எழுவாய் மற்றும் கருத்து
  choice: மக்கள் பரவினர்
  alternative: முழுப் பூமியும் பரவியது / குடியேற்றப்பட்டது
  rationale: எபிரெயத்தில் ‘முழுப் பூமி’ ஒருமை எழுவாயாக இருந்து ‘சிதறியது’ என்று சொல்லப்படுகிறது; அது பூமியின் மக்களைக் குறிக்கும் ஆகுபெயராகப் புரிந்துகொள்ளப்படுகிறது. தமிழ் முதன்மை உரை அந்தச் சூழற்பொருளை இயல்பாகத் தருகிறது; சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பூமியெங்கும் மக்கள் பரவினர்’ என்பது வழக்கமான தமிழாக இருப்பதுடன், மூல வினையின் பரவல்/சிதறல் நிழற்பொருளையும் காக்கிறது.
