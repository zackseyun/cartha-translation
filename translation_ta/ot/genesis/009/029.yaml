  text: So all the days of Noah were nine hundred and fifty years, and he died.
translation:
  language: ta
  text: நோவாவின் வாழ்நாட்கள் மொத்தம் தொள்ளாயிரத்து ஐம்பது ஆண்டுகள்; பின்னர் அவர் இறந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי נֹחַ
  choice: நோவாவின் வாழ்நாட்கள் மொத்தம்
  rationale: எபிரெய மொழியின் வாழ்நாள்-சுருக்கச் சூத்திரத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; כָּל என்பதன் முழுமையையும் ‘மொத்தம்’ காக்கிறது.
- source_word: תְּשַׁע מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: தொள்ளாயிரத்து ஐம்பது ஆண்டுகள்
  rationale: எபிரெய எண்ணிக்கையின் இரு இணைக்கப்பட்ட பகுதிகளையும் தமிழின் இயல்பான கூட்டு எண்ணாகத் துல்லியமாக வழங்குகிறது.
- source_word: וַיָּמֹת
  choice: பின்னர் அவர் இறந்தார்
  rationale: தொடர்கதை வடிவிலுள்ள வினைச்சொல்லை இயல்பான தமிழில் நிறைவு நிகழ்வாகக் காட்டுகிறது; எழுவாய் நோவா என்பதை ‘அவர்’ தெளிவுபடுத்துகிறது.
