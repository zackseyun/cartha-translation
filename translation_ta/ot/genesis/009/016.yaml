  rationale: The revision preserves the literal “வில்,” the singular “மேகத்தில்,” the future sequence, and God’s stated remembrance. It recasts the final covenant-partner phrase so that “எல்லா மாம்ச” specifies the living creatures appositionally, as in the Hebrew, while yielding natural modern Tamil. No theological explanation has been added.
