revisions:
- from: அந்த வில் மேகத்தில் இருக்கும்[a]; நான் அதைப் பார்த்து, கடவுளுக்கும் பூமியிலுள்ள எல்லா மாம்சத்தினிடையேயும் இருக்கும் ஒவ்வோர் உயிருள்ள உயிரினத்துக்கும் இடையிலான என்றென்றும் நிலைக்கும் உடன்படிக்கையை நினைவுகூருவேன்.
