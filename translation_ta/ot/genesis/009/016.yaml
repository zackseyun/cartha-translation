base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/016.yaml
  text: The bow will be in the cloud[b][a], and I will see it and remember the everlasting covenant between God and every living creature among all flesh that is on the earth.
translation:
  language: ta
  text: அந்த வில் மேகத்தில் இருக்கும்[a]; நான் அதைப் பார்த்து, கடவுளுக்கும் பூமியிலுள்ள எல்லா மாம்ச உயிரினங்களான ஒவ்வோர் உயிரினத்துக்கும் இடையிலான என்றென்றும் நிலைக்கும் உடன்படிக்கையை நினைவுகூருவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வானவில்.’ எபிரேயச் சொல் நேரடியாக ‘வில்’ என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: இருக்கும்
  rationale: இணைப்புடன் வந்த நிறைவுவினை இங்கு எதிர்காலத்தை நோக்கிய இறை உரையைத் தொடர்வதால், தமிழில் எதிர்கால வடிவம் பொருத்தமானது.
- source_word: הַקֶּשֶׁת
  choice: அந்த வில்
  rationale: எபிரேயச் சொல் நேரடியாக ‘வில்’ எனப் பொருள்படும்; சூழலில் அது வானவில் என்பதைக் குறித்தாலும் மூல உருவகத்தை முதன்மை உரையில் காக்கிறது.
- source_word: בֶּעָנָן
  choice: மேகத்தில்
  rationale: மூலத்தில் ஒருமையும் குறிப்புச் சுட்டும் உள்ளன; தமிழில் ‘மேகத்தில்’ இயல்பாகவும் வடிவத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: וּרְאִיתִיהָ
  choice: நான் அதைப் பார்த்து
  rationale: மூன்றாம் பெண்பால் ஒருமை பின்னொட்டு வில்லைக் குறிக்கிறது; தொடர்வினை அமைப்பு எபிரேய வாக்கியத் தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִזְכֹּר
  choice: நினைவுகூருவேன்
  rationale: לְ உடனான வினையெச்சம் நோக்கம் அல்லது விளைவைத் தெரிவிக்கிறது; தமிழில் முன் வினையுடன் இணைந்து வரும் எதிர்கால முற்றுவினை கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: בְּרִית עוֹלָם
  choice: என்றென்றும் நிலைக்கும் உடன்படிக்கை
  rationale: עוֹלָם காலந்தோறும் நீடிப்பதை உணர்த்துகிறது; இந்தத் தேர்வு அதன் நீடித்த தன்மையை நவீன தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: ஒவ்வோர் உயிருள்ள உயிரினம்
  rationale: இந்தச் சொற்றொடர் மனித ஆன்மாவை மட்டும் அல்லாமல் உயிருள்ள படைப்புகள் அனைத்தையும் குறிக்கிறது.
- source_word: בְּכָל בָּשָׂר
  choice: எல்லா மாம்சத்தினிடையேயும் இருக்கும்
  rationale: בְ இங்கு முன்னுள்ள ‘ஒவ்வோர் உயிருள்ள உயிரினம்’ என்பதன் பரப்பை அல்லது வகையை விளக்குகிறது; மூலத்தின் ‘மாம்சம்’ என்ற உடல்சார் சொல்லையும் உறவின் சிறிய தெளிவின்மையையும் காக்கிறது.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: பூமியிலுள்ள
  rationale: உயிரினங்களின் உலகளாவிய பரப்பைச் சுட்டும் சார்பு வாக்கியத்தைச் சுருக்கமான இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: கடவுள் நினைவுகூருதல் என்ற மனிதப் பண்புருவ மொழி
  choice: ‘நான் அதைப் பார்த்து ... நினைவுகூருவேன்’ என்று நேரடியாக வைத்தல்
  alternative: ‘என் உடன்படிக்கையின்படி செயல்படுவேன்’ என்று விளக்கிப் பொருளுரைத்தல்
  rationale: மூலம் கடவுளைப் பற்றிய உடன்படிக்கை நினைவுகூரும் மொழியைப் பயன்படுத்துகிறது. அதன் இறையியல் பதற்றத்தை விளக்கத்தின் மூலம் அகற்றாமல் அப்படியே காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. ‘மாம்சம்’ என்பது மூலத்தின் உடல்சார் கூட்டுப்பெயரைப் பாதுகாப்பதற்காக வைக்கப்பட்டுள்ளது.
