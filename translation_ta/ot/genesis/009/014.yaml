  text: וְ/הָיָ֕ה בְּ/עַֽנְנִ֥/י עָנָ֖ן עַל הָ/אָ֑רֶץ וְ/נִרְאֲתָ֥ה הַ/קֶּ֖שֶׁת בֶּ/עָנָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/014.yaml
  text: And when I bring clouds over the earth[a], the bow will be seen in the cloud,
translation:
  language: ta
  text: நான் பூமியின் மேல் மேகங்களைக் கொண்டுவரும்போது, மேகத்தில் வில்[a] காணப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வானவில்.’ எபிரேயத்தில் இங்கு ‘வில்’ என்பதற்கான சாதாரண சொல் பயன்படுத்தப்பட்டுள்ளது; இந்தச் சூழலில் அது உடன்படிக்கையின் அடையாளமான வானவில்லைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: செய்யும்போது
  rationale: இந்த அமைப்பு எதிர்காலத்தில் நிகழும் சூழலை அறிமுகப்படுத்துகிறது. தமிழில் ‘செய்யும்போது’ என்பது அதன் காலச்சார்ந்த பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּעַנְנִי עָנָן
  choice: நான் ... மேகங்களைத் திரளச் செய்யும்போது
  rationale: ענן என்பதன் வினைச்சொல் பயன்பாடு மேகமூட்டுதல் அல்லது மேகங்களை வரச்செய்தல் என்ற காரணவினைப் பொருளைக் கொண்டுள்ளது; பின்னுள்ள ஒருமை பெயர்ச்சொல் கூட்டுப்பொருளில் கொள்ளப்படலாம். ‘மேகங்களைத் திரளச் செய்யும்போது’ என்பது இதைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: עַל הָאָרֶץ
  choice: பூமியின்மேல்
  rationale: வெள்ளத்திற்குப் பிந்தைய உடன்படிக்கையின் விரிந்த சூழலில் הָאָרֶץ என்பதை ‘நாடு’ என்பதற்குப் பதில் ‘பூமி’ என்று மொழிபெயர்ப்பது பொருத்தமானது.
- source_word: וְנִרְאֲתָה
  choice: காணப்படும்
  rationale: ראה வினையின் நிஃபால் வடிவத்திலுள்ள செயப்பாட்டு நுணுக்கத்தையும் எதிர்காலத் தன்மையையும் ‘காணப்படும்’ காக்கிறது.
- source_word: הַקֶּשֶׁת
  choice: வில்
  rationale: קשת என்பதன் நேரடிப் பொருள் ‘வில்.’ இங்கு அது உடன்படிக்கையின் அடையாளமான வானவில்லைக் குறித்தாலும், எபிரெயச் சொல்லின் உருவகத் தொடர்பை முதன்மை உரையில் காக்க ‘வில்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בֶּעָנָן
  choice: மேகத்தில்
  rationale: மூலத்தில் திட்டவட்ட ஒருமை இருப்பதால் ‘மேகத்தில்’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: நோவாவுடனான உடன்படிக்கைச் சூழலில் קשת என்பதன் மொழிபெயர்ப்பு
  choice: வில்
  alternative: வானவில்
  rationale: மூலம் சாதாரண வில்லைக் குறிக்கும் சொல்லையே பயன்படுத்துகிறது; அதனால் உடன்படிக்கை அடையாளத்தின் உருவகத்தை ‘வில்’ காக்கிறது. சூழலில் அது வானவில்லைக் குறிக்கும் என்பது அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மேகங்களைத் திரளச் செய்யும்போது’ காரணவினைப் பொருளைத் தெளிவாக்குகிறது; ‘வில்’ என்ற தேர்வு மூலமொழியின் உருவகத்தைப் பாதுகாக்கிறது.
