base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/021.yaml
  text: He drank some of the wine[a], became drunk[b], and uncovered himself inside his tent.
translation:
  language: ta
  text: அவன் திராட்சரசத்தில் சிறிதளவு குடித்து[a], போதையடைந்து, தன் கூடாரத்திற்குள் தன்னை வெளிப்படுத்திக்கொண்டான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘திராட்சரசத்திலிருந்து குடித்து.’ இங்கு எபிரெயச் சொற்றொடர், அந்தத் திராட்சரசத்தில் ஒரு பகுதியைக் குடித்தான் என்ற பொருளில் இருக்கலாம்.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வெளிப்பட்ட நிலையில் இருந்தான்’ அல்லது ‘மூடப்படாமல் இருந்தான்.’ எபிரெய வினை தன்னிலைச் செயலாகவோ வெளிப்பட்ட நிலையைக் குறிப்பதாகவோ புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁתְּ מִן הַיַּיִן
  choice: அவன் திராட்சரசத்தில் சிறிது குடித்து
  rationale: מִן הַיַּיִן இங்கு பகுதியைக் குறிக்கும் இயல்பில் உள்ளது; ‘திராட்சரசத்தில் சிறிது’ என்பது அதைப் புரியத்தக்க நவீன தமிழில் வெளிப்படுத்துகிறது. தொடக்க וַ தொடர்ச்சியான நிகழ்வாக வினையெச்ச அமைப்பில் தரப்படுகிறது.
- source_word: וַיִּשְׁכָּר
  choice: போதையடைந்து
  rationale: שׁכר என்பதன் Qal வடிவம் போதைநிலைக்குள் சென்றதைச் சுட்டுகிறது; ‘போதையடைந்து’ என்பது கண்ணியமான, இயல்பான தமிழில் அந்த நிகழ்நிலை மாற்றத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּתְגַּל
  choice: தன்னை மூடாமல் கிடந்தான்
  rationale: גלה என்பதன் Hitpael வடிவம் தன்னிலைப் பொருளையோ விளைவாக ஏற்பட்ட வெளிப்பட்ட நிலையையோ அனுமதிக்கிறது. தமிழில் ‘தன்னை மூடாமல் கிடந்தான்’ என்பது நிர்வாணத்தை மிகைப்படுத்தாமல், கூடாரத்தில் அவன் வெளிப்பட்ட நிலையில் இருந்ததை இயல்பாகச் சொல்கிறது; மாற்று மொழிபெயர்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: בְּתוֹךְ אָהֳלֹה
  choice: தன் கூடாரத்திற்குள்
  rationale: בְּתוֹךְ என்பது ஓர் இடத்தின் உட்புறத்தைக் குறிக்கிறது; ‘கூடாரத்திற்குள்’ என்பது தெளிவான நவீனத் தமிழ்.
theological_decisions:
- issue: நோவாவின் போதையையும் உடல் வெளிப்பாட்டையும் பற்றிய அறநெறி அல்லது பாலியல் விளக்கம்
  choice: எபிரெய உரை கூறும் குடித்தல், போதையடைதல், மூடப்படாத நிலை ஆகியவற்றை மட்டும் விளக்கக் குறிப்பின்றி விவரித்தல்
  alternative: ‘நிர்வாணமாகக் கிடந்தான்’ அல்லது ‘தன்னை வெளிப்படுத்திக்கொண்டான்’ என்று ஒரே பொருளைத் தீர்மானித்தல்
  rationale: இவ்வசனம் வெளிப்படையான அறத்தீர்ப்பையோ பாலியல் நோக்கத்தையோ சேர்ப்பதில்லை. וַיִּתְגַּל வடிவத்தின் தன்னிலை/நிலை சார்ந்த நுணுக்கத்தையும் அடுத்துவரும் நிகழ்ச்சிக்கான இறையியல் பதற்றத்தையும் அடிக்குறிப்பு மூலம் பாதுகாப்பது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான தொடர்கதை நடையும் கண்ணியமான சொல்லாட்சியும் பயன்படுத்தப்பட்டுள்ளன. ‘திராட்சரசம்,’ ‘போதையடைந்து,’ ‘கூடாரம்’ ஆகியவை பொதுவாகப் புரியும் வேதாகமப் பதிவுக்கேற்ற சொற்கள். மூலத்தின் உண்மையான இலக்கணத் தெளிவின்மை [b] அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
