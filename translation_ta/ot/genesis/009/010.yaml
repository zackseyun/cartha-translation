  text: וְ/אֵ֨ת כָּל נֶ֤פֶשׁ הַֽ/חַיָּה֙ אֲשֶׁ֣ר אִתְּ/כֶ֔ם בָּ/ע֧וֹף בַּ/בְּהֵמָ֛ה וּֽ/בְ/כָל חַיַּ֥ת הָ/אָ֖רֶץ אִתְּ/כֶ֑ם מִ/כֹּל֙ יֹצְאֵ֣י הַ/תֵּבָ֔ה לְ/כֹ֖ל חַיַּ֥ת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/010.yaml
  text: 'and with every living creature that is with you: the birds[a], the livestock, and every beast of the earth with you, from all that came out of the ark[d][c][b], every beast of the earth.'
translation:
  language: ta
  text: உங்களோடு இருக்கிற ஒவ்வோர் உயிரினத்தோடும்[a]—பறவைகள், கால்நடைகள், உங்களோடு இருக்கிற பூமியின் எல்லாக் காட்டு விலங்குகள் ஆகியவற்றோடும்—பேழையிலிருந்து வெளியே வந்த அனைத்தையும் உட்பட, பூமியின் எல்லாக் காட்டு விலங்குகளோடும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இன்னும் சொற்படியாக, “ஒவ்வோர் உயிருள்ள உயிர்/உயிரினம்.” இச்சூழலில் இது விலங்குகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இறுதித் தொடர் எபிரெயத்தில் இலக்கண ரீதியாகக் கடினமானது. இன்னும் முறையாக, “பேழையிலிருந்து வெளியே வந்த அனைத்திலிருந்தும், பூமியின் எல்லாக் காட்டு விலங்குகளுக்காகவும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ הַחַיָּה
  choice: ஒவ்வோர் உயிரினம்
  rationale: இச்சூழலில் இச்சொற்றொடர் உயிருள்ள விலங்குகளை விரிவாகக் குறிக்கிறது. ‘உயிரினம்’ என்பது இயல்பான நவீனத் தமிழாகவும், ‘உயிருள்ள ஆத்துமா’ என்ற அளவுக்கு மீறிய சொற்படித் தோற்றத்தைத் தவிர்ப்பதாகவும் உள்ளது.
- source_word: אֲשֶׁר אִתְּכֶם
  choice: உங்களோடு இருக்கிற
  rationale: எபிரெய உறவுநிலைத் தொடரை நேராகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בָּעוֹף
  choice: பறவைகள்
  rationale: עוֹף பறக்கும் உயிரினங்களைப் பொதுவாகக் குறிக்கக்கூடும்; இப்பட்டியலில் ‘பறவைகள்’ தெளிவான, இயல்பான தமிழ்ச் சொல்.
- source_word: בַּבְּהֵמָה
  choice: கால்நடைகள்
  rationale: வீட்டில் வளர்க்கப்படும் நில விலங்குகளைக் குறிக்கும் பிரிவைச் சுட்டுகிறது; அடுத்துவரும் காட்டு விலங்குகளிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: חַיַּת הָאָרֶץ
  choice: பூமியின் எல்லாக் காட்டு விலங்குகள்
  rationale: பறவைகளுக்கும் கால்நடைகளுக்கும் அடுத்த தனிப் பிரிவாக வரும் காட்டு நிலவிலங்குகளைத் தெளிவாகக் குறிக்கிறது.
- source_word: מִכֹּל יֹצְאֵי הַתֵּבָה
  choice: பேழையிலிருந்து வெளியே வந்த அனைத்தோடும்
  rationale: பேழையிலிருந்து வெளியே வந்த உயிரினங்களையே குறிப்பிடும் எபிரெயத் தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: לְכֹל חַיַּת הָאָרֶץ
  choice: பூமியின் எல்லாக் காட்டு விலங்குகளோடும்
  rationale: இறுதித் தொடர் இலக்கண ரீதியாகக் கடினமானது. அதை முன் கூறியவற்றை மீண்டும் வலியுறுத்தும் தொடராக எடுத்துக்கொண்டு, தேவையற்ற நோக்கப் பொருளைச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: உடன்படிக்கையில் சேர்க்கப்படும் விலங்குகளின் வரம்பும் இறுதித் தொடரின் தொடர்பும்
  choice: பறவைகள், கால்நடைகள், காட்டு விலங்குகள் உட்பட நோவாவோடு இருந்த உயிரினங்கள் அனைத்தும் சேர்க்கப்படுகின்றன; இறுதித் தொடர் மீளுரைப்பாக வைக்கப்பட்டுள்ளது.
  alternative: இறுதித் தொடரை ‘பூமியின் எல்லாக் காட்டு விலங்குகளுக்காகவும்’ என்று לְ முன்னிடைச்சொல்லை வெளிப்படையாகக் காட்டலாம்.
  rationale: எபிரெய வசனம் சுருக்கமாகவும் மீளுரைப்புடனும் அமைந்துள்ளது. தேர்ந்த வடிவம் அதன் விரிவான வரம்பையும் இலக்கணத் தெளிவின்மையையும் காக்கிறது; தனிப்பட்ட இறையியல் விளக்கத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. முந்தைய வசனத்திலிருந்து தொடரும் இணைப்பைக் காக்க ‘-ஓடும்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘கால்நடைகள்’ மற்றும் ‘காட்டு விலங்குகள்’ என்ற வேறுபாடு மூலப் பட்டியலின் வகைப்பாட்டைக் காக்கிறது.
