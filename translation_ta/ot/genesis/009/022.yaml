  yaml_path: translation/ot/genesis/009/022.yaml
  text: And Ham[a], the father of Canaan, saw his father's nakedness and told his two brothers outside.
translation:
  language: ta
  text: கானானின் தந்தையாகிய காம், தன் தந்தையின் நிர்வாணத்தைக்[a] கண்டு, வெளியில் இருந்த தன் சகோதரர்கள் இருவரிடமும் அதைச் சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் தந்தையின் நிர்வாணம்” என்பது எபிரெயச் சொற்றொடரின் நேரடி மொழிபெயர்ப்பு. பழைய ஏற்பாட்டின் சில இடங்களில் இது பாலியல் பொருள் கொண்ட மறைமொழியாகவும் அமையலாம்; இங்கு அந்த விளக்கக் கேள்வி திறந்தே வைக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டு
  rationale: ראה என்ற வினை இங்கு எளிய கதைநடைப் பொருளில் ‘கண்டான்’ என வருகிறது; ‘உற்றுப் பார்த்தான்’ போன்ற வலுவான விளக்கத்தை மூலச்சொல் மட்டும் ஆதரிக்கவில்லை.
- source_word: חָם
  choice: காம்
  rationale: எபிரெயத் தனிப்பெயர், நவீனத் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபுக்கேற்ப தரப்பட்டுள்ளது.
- source_word: אֲבִי כְנַעַן
  choice: கானானின் தந்தையாகிய
  rationale: காமை அடையாளப்படுத்தும் எபிரெயக் கட்டிணைப்பை இயல்பான தமிழில் அடைமொழித் தொடராகத் தக்கவைக்கிறது.
- source_word: עֶרְוַת אָבִיו
  choice: தன் தந்தையின் நிர்வாணத்தை
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருளைத் தக்கவைத்து, இவ்வசனத்தில் குறிப்பிடப்படாத குறிப்பிட்ட பாலியல் செயலை மொழிபெயர்ப்பில் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: וַיַּגֵּד
  choice: சொன்னான்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ‘சொல், தெரிவி, அறிவி’ என்ற பொருள் தருகிறது; இக்கதைநடையில் ‘சொன்னான்’ இயல்பாக உள்ளது.
- source_word: לִשְׁנֵי אֶחָיו
  choice: தன் சகோதரர்கள் இருவரிடமும்
  rationale: மூலத்தில் எண்ணிக்கை வெளிப்படையாக ‘இரண்டு’ என்று இருப்பதைத் தமிழில் தெளிவாகத் தக்கவைக்கிறது.
- source_word: בַּחוּץ
  choice: வெளியில் இருந்த
  rationale: நோவா கூடாரத்திற்குள் இருந்ததற்கு மாறாக, சகோதரர்கள் வெளியே இருந்தனர் என்ற சூழல்சார் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இக்கதையில் ‘தன் தந்தையின் நிர்வாணம்’ என்பதன் பொருள்
  choice: நோவா ஆடையின்றி இருந்ததைக் காம் கண்டான் என்பதற்கு மேல் குறிப்பிட்ட பாலியல் செயல் எதையும் சேர்க்காமல், சொற்றொடர் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: பிற்காலச் சட்டப் பயன்பாடுகளின் அடிப்படையில், இதை இன்னும் கடுமையான பாலியல் குற்றத்தையோ தாயுடன் தகாத உறவையோ குறிக்கும் மறைமொழியாகப் புரிந்துகொள்ளுதல்.
  rationale: சில பழைய ஏற்பாட்டுச் சூழல்களில் இச்சொற்றொடர் விரிவான பாலியல் உட்பொருளைக் கொண்டிருக்கலாம். ஆனால் இவ்வசனம் காம் ‘கண்டு’, பின்னர் சகோதரர்களிடம் ‘சொன்னான்’ என்றே கூறுகிறது; உடனடிச் சூழலும் நோவாவின் வெளிப்பட்ட நிலையையே மையப்படுத்துகிறது. ஆகவே விளக்கத் தெளிவின்மையும் இறையியல் சார்ந்த பதற்றமும் தீர்த்துவைக்கப்படாமல் தக்கவைக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நிர்வாணம்’ என்ற நேரடிச் சொல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது; தேவையற்ற விளக்கச் சேர்க்கை தவிர்க்கப்பட்டுள்ளது.
