id: GEN.9.18
reference: Genesis 9:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּֽהְי֣וּ בְנֵי נֹ֗חַ הַ/יֹּֽצְאִים֙ מִן הַ/תֵּבָ֔ה שֵׁ֖ם וְ/חָ֣ם וָ/יָ֑פֶת וְ/חָ֕ם ה֖וּא אֲבִ֥י כְנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/018.yaml
  text: The sons of Noah who came out of the ark were Shem, Ham, and Japheth; and Ham was the father of Canaan.
translation:
  language: ta
  text: பேழையிலிருந்து வெளியே வந்த நோவாவின் மகன்கள் சேம், காம், யாப்பேத் என்பவர்கள். காம் கானானின் தந்தை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: என்பவர்கள்
  rationale: இங்கு היה வடிவம் கடந்தகால அடையாளப்படுத்தும் இணைப்பாகச் செயல்படுகிறது. தமிழில் பெயர்ப்பட்டியலுடன் ‘என்பவர்கள்’ என்பது இயல்பாக அந்தப் பொருளை வெளிப்படுத்துகிறது; மாற்றமடைந்தனர் என்ற நுணுக்கத்தைச் சேர்ப்பதில்லை.
- source_word: בְנֵי נֹחַ
  choice: நோவாவின் மகன்கள்
  rationale: எபிரேய கட்டமைப்பின் குடும்ப உறவை நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: הַיֹּצְאִים מִן הַתֵּבָה
  choice: பேழையிலிருந்து வெளியே வந்த
  rationale: குறிப்பிட்ட பெயரெச்ச வடிவமும் מן முன்னிடைச்சொல்லும் சேர்ந்து, பேழையை விட்டு வெளியேறியவர்களை அடையாளப்படுத்துகின்றன. ‘வெளியே வந்த’ என்பது தமிழில் இயல்பான உரையாக்கம்.
- source_word: שֵׁם וְחָם וָיָפֶת
  choice: சேம், காம், யாப்பேத்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; எபிரேயப் பெயர்களின் ஒலியையும் போதிய அளவு பிரதிபலிக்கின்றன.
- source_word: וְחָם הוּא אֲבִי כְנָעַן
  choice: காம் கானானின் தந்தை
  rationale: பெயர்ச்சொல் வாக்கியத்தைத் தமிழில் சுருக்கமாகவும் நேரடியாகவும் தருகிறது. காம்–கானான் உறவை அடுத்த நிகழ்வுக்கான பின்னணித் தகவலாகத் தெளிவாக வைத்திருக்கிறது.
theological_decisions:
- issue: காம் மற்றும் கானான் பற்றிய வம்ச உறவுக் குறிப்பு
  choice: ‘காம் கானானின் தந்தை’ என்ற அடையாளக் குறிப்பை முதன்மை உரையிலேயே வைத்தல்
  alternative: அதை வெறும் இடைச்செருகலாகக் கருதி நடையளவில் பின்னுக்குத் தள்ளுதல்
  rationale: எபிரேய உரை காமை கானானின் தந்தையாக வெளிப்படையாக அடையாளப்படுத்தி, தொடர்ந்து வரும் நிகழ்வுக்கு முன்னேற்பாடு செய்கிறது. இதற்கு அப்பாற்பட்ட பிற்கால இனவியல் அல்லது கோட்பாட்டுப் பொருளை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதுமான நடை. ‘பேழை’ மற்றும் பெயர்களுக்கு நிலைபெற்ற தமிழ் வேதாகமச் சொல்வழக்கு பேணப்பட்டுள்ளது.
