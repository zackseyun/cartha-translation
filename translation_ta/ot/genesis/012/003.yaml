source:
  edition: WLC
  text: וַ/אֲבָֽרֲכָה֙ מְבָ֣רְכֶ֔י/ךָ וּ/מְקַלֶּלְ/ךָ֖ אָאֹ֑ר וְ/נִבְרְכ֣וּ בְ/ךָ֔ כֹּ֖ל מִשְׁפְּחֹ֥ת הָ/אֲדָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/003.yaml
  text: And I will bless those who bless you[a], and the one who curses you I will curse[c][b]; and in you all the families of the earth will be blessed.
translation:
  language: ta
  text: உன்னை ஆசீர்வதிக்கிறவர்களை நான் ஆசீர்வதிப்பேன்; உன்னை இகழ்கிறவனை நான் சபிப்பேன்; உன்னில் பூமியிலுள்ள எல்லாக் குடும்பங்களும் ஆசீர்வதிக்கப்படும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னைக் கொண்டு பூமியிலுள்ள எல்லாக் குடும்பங்களும் தங்களை ஆசீர்வதித்துக்கொள்வார்கள்”; அல்லது, “உன் மூலமாகப் பூமியிலுள்ள எல்லாக் குடும்பங்களும் ஆசீர்வதிக்கப்படும்.” எபிரெய வடிவம் செயப்பாட்டு, தற்சுட்டு அல்லது இடைநிலைப் பொருளை அனுமதிக்கிறது; בְּ என்பது கருவிப் பொருளிலும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲבָרֲכָה
  choice: நான் ஆசீர்வதிப்பேன்
  rationale: ברך என்பதன் Qal முதல் நபர் ஒருமை வடிவம்; கடவுளின் வாக்குறுதியை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: מְבָרְכֶיךָ
  choice: உன்னை ஆசீர்வதிக்கிறவர்களை
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டுடன் வரும் பன்மைப் பெயரெச்சம்; ஒரு மக்கள் வகுப்பைக் குறிக்கும் பன்மையைத் தக்கவைக்கிறது.
- source_word: וּמְקַלֶּלְךָ
  choice: உன்னை இகழ்கிறவனை
  rationale: קלל என்பது ஒருவரை அற்பமாகக் கருதுதல், அவமதித்தல் அல்லது சபித்தல் எனப் பொருள்படலாம். இங்கே ஒருமையைத் தக்கவைத்து, அடுத்து வரும் வலிமையான ארר உடனான சொல் வேறுபாட்டை வெளிப்படுத்த ‘இகழ்கிறவனை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אָאֹר
  choice: நான் சபிப்பேன்
  rationale: ארר என்பதன் Qal முதல் நபர் ஒருமை வடிவம்; வலிமையான சாபச் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְנִבְרְכוּ
  choice: ஆசீர்வதிக்கப்படும்
  rationale: ברך என்பதன் Niphal மூன்றாம் நபர் பன்மை வடிவத்தை முதன்மையாகச் செயப்பாட்டு வினையாக எடுத்துள்ளது; தற்சுட்டு அல்லது இடைநிலைப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּךָ
  choice: உன்னில்
  rationale: בְּ என்பதன் நேரடியான ‘இல்’ பொருளைத் தக்கவைக்கிறது; ‘உன் மூலமாக’ என்ற கருவிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כֹּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: பூமியிலுள்ள எல்லாக் குடும்பங்களும்
  rationale: מִשְׁפָּחוֹת குறிக்கும் குடும்பக் குழுக்களை எளிய தமிழில் ‘குடும்பங்கள்’ என்றும், உலகளாவிய சூழலில் הָאֲדָמָה என்பதை ‘பூமி’ என்றும் வழங்குகிறது.
theological_decisions:
- issue: וְנִבְרְכוּ בְךָ என்ற ஆபிரகாமிய ஆசீர்வாத வாய்பாட்டின் பொருள்
  choice: 'செயப்பாட்டு வாசிப்பு: ‘உன்னில் ... ஆசீர்வதிக்கப்படும்’'
  alternative: 'தற்சுட்டு/இடைநிலை வாசிப்பு: ‘உன்னைக் கொண்டு தங்களை ஆசீர்வதித்துக்கொள்வார்கள்’; கருவிப் பொருள்: ‘உன் மூலமாக ... ஆசீர்வதிக்கப்படும்’'
  rationale: Niphal வடிவமும் בְּ முன்னிடைச்சொல்லும் ஒன்றுக்கு மேற்பட்ட பொருள்களை அனுமதிக்கின்றன. முதன்மை உரையில் நேரடியான செயப்பாட்டு வாசிப்பு வைக்கப்பட்டு, உண்மையான இலக்கண மற்றும் இறையியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; எளிமையானாலும் கண்ணியமான வேதாகம நடை. மனிதரின் קלל செயலுக்கும் கடவுளின் வலிமையான ארר பதிலுக்கும் இடையிலான சொல் வேறுபாட்டை ‘இகழ்’ / ‘சபி’ மூலம் தக்கவைக்கிறது. எபிரெயத்தில் உள்ள பன்மை–ஒருமை வேறுபாடும் பாதுகாக்கப்பட்டுள்ளது.
