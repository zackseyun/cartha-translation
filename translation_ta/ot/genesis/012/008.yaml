base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/008.yaml
  text: From there he moved to the hill country east of Bethel and pitched his tent[a], with Bethel on the west and Ai on the east[b]. There he built an altar to Yahweh and called on the name of Yahweh.
translation:
  language: ta
  text: அங்கிருந்து அவன் பெத்தேலுக்குக் கிழக்கே உள்ள மலைப்பகுதிக்குச் சென்று, பெத்தேல் மேற்கிலும் ஆயி கிழக்கிலும் இருக்க, தன் கூடாரத்தை அமைத்தான். அங்கே அவன் யாவேக்கு[a] ஒரு பலிபீடத்தைக் கட்டி, யாவேயின் பெயரைக் கூப்பிட்டான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘YHWH’; மரபாக ‘கர்த்தர்’ என்றும் வழங்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘யாவேயின் பெயரை அறிவித்தான்.’ எபிரெயத் தொடர் வழிபாட்டில் யாவேயை நோக்கி வேண்டுவதையோ, அவரது பெயரைப் பொதுவாக அறிவிப்பதையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְתֵּק
  choice: சென்றான்
  rationale: இவ்வினைச்சொல் ஓரிடத்திலிருந்து வேறிடத்திற்குப் பெயர்ந்து செல்வதைக் குறிக்கிறது. சூழலில் இயல்பான தமிழாக ‘சென்றான்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָהָרָה
  choice: மலைநாட்டிற்கு
  rationale: திசைநோக்கிய நகர்வைக் காட்டும் வடிவம் மலைப்பாங்கான நிலப்பகுதியை நோக்கிச் சென்றதைக் குறிக்கிறது; இப்புவியியல் சூழலில் ‘மலைநாடு’ இயல்பானது.
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: பெத்தேலுக்குக் கிழக்கே
  rationale: קֶדֶם இங்கு பெத்தேலை ஒப்புநிலையாகக் கொண்ட கிழக்குத் திசையைக் குறிக்கிறது.
- source_word: וַיֵּט אָהֳלֹה
  choice: தன் கூடாரத்தை அமைத்தான்
  rationale: கூடாரத்தை விரித்து நிலைநிறுத்துவதைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கு இது இயல்பான நவீனத் தமிழ் இணை.
- source_word: מִיָּם
  choice: மேற்கே
  rationale: יָם என்பதன் நேர்ப்பொருள் ‘கடல்’ என்றாலும், புவியியல் திசைக் குறிப்பில் இது மேற்கைக் குறிக்கிறது.
- source_word: וְהָעַי מִקֶּדֶם
  choice: கிழக்கே ஆயியும்
  rationale: கூடாரம் பெத்தேலுக்கும் ஆயிக்கும் இடையில் இருந்ததைச் சமச்சீராகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: מִזְבֵּחַ
  choice: பலிபீடம்
  rationale: பலியிடுதல் அல்லது வழிபாட்டிற்காக அமைக்கப்படும் பீடத்தைக் குறிக்கும் நிலையான தமிழ் சொல்.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יְהוָה என்ற தனிப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்த்துள்ளது.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: யாவேயின் பெயரைச் சொல்லி வேண்டினான்
  rationale: இம்மரபுத்தொடரின் முதன்மையான வழிபாட்டு உணர்வை இயல்பான தமிழில் தருகிறது; அதே நேரத்தில் ‘அறிவித்தான்’ என்ற சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் வரும் நான்கு மெய்யெழுத்துகளாலான இறைப் பெயரை ஒரு பட்டமாக மாற்றாமல், வழக்கமான அறிஞர் ஒலிப்புக்கு ஏற்ப தனிப்பெயராக வழங்குகிறது.
- issue: וַיִּקְרָא בְּשֵׁם יְהוָה என்பதன் பொருள்
  choice: யாவேயின் பெயரைச் சொல்லி வேண்டினான்
  alternative: யாவேயின் பெயரை அறிவித்தான்
  rationale: முற்பிதாவின் பலிபீட வழிபாட்டுச் சூழலில் இறைவனை நோக்கி வேண்டுதல் உடனடியான பொருளாகத் தெரிகிறது. எனினும், எபிரெயத் தொடர் பொதுவாக அவரது பெயரை அறிவித்தல் என்ற பொருளையும் தாங்கக்கூடும்; அந்தத் தெளிவின்மை அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இருக்கும்படி’ என்ற அமைப்பு கூடாரம் பெத்தேலுக்கும் ஆயிக்கும் இடையில் இருந்த புவியியல் உறவை இயல்பாக வெளிப்படுத்துகிறது.
