  to: அங்கிருந்து அவன் பெத்தேலுக்குக் கிழக்கே உள்ள மலைப்பகுதிக்குச் சென்று, பெத்தேல் மேற்கிலும் ஆயி கிழக்கிலும் இருக்க, தன் கூடாரத்தை அமைத்தான். அங்கே அவன் யாவேக்கு[a] ஒரு பலிபீடத்தைக் கட்டி, யாவேயின் பெயரைக் கூப்பிட்டான்[b].
