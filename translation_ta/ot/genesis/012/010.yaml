base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/010.yaml
  text: There was a famine in the land[a], and Abram went down to Egypt to sojourn there, because the famine was severe in the land.
translation:
  language: ta
  text: நாட்டில் பஞ்சம் ஏற்பட்டது. ஆபிராம் எகிப்துக்கு, அங்கே சிறிது காலம் தங்குவதற்காக[a], இறங்கிச் சென்றார்; ஏனெனில் நாட்டில் பஞ்சம் கடுமையாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, அங்கே ஓர் அந்நியராகத் தற்காலிகமாக வசிப்பதற்காக.
    reason: לָגוּר என்ற சொல்லில் உள்ள தற்காலிக வசிப்பு மற்றும் அந்நியர் நிலை ஆகிய நுணுக்கங்களைத் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: וַיְהִי
  choice: ஏற்பட்டது
  rationale: இந்த வடிவம் கதையில் ஒரு புதிய நிகழ்வை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பாகவும் நிகழ்வின் தொடக்கத்தைக் காட்டும் வகையிலும் ‘ஏற்பட்டது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: רָעָב
  choice: பஞ்சம்
  rationale: இது தனிப்பட்ட பசியை அல்ல, நாட்டளவிலான உணவுப் பற்றாக்குறையைச் சுட்டுகிறது; அதற்கான துல்லியமான பொதுத்தமிழ்ச் சொல் ‘பஞ்சம்’.
- source_word: בָּאָרֶץ
  choice: நாட்டில்
  rationale: இங்கு אֶרֶץ என்பது முழு பூமியை அல்ல, ஆபிராம் தங்கியிருந்த நிலப்பகுதி அல்லது நாட்டைக் குறிக்கிறது. வசனத்தின் இரு இடங்களிலும் எபிரெய மறுபடியும் கூறப்படுவது பாதுகாக்கப்பட்டது.
- source_word: וַיֵּרֶד
  choice: இறங்கிச் சென்றார்
  rationale: ירד என்பதன் ‘கீழே செல்/இறங்கிச் செல்’ என்ற இயக்கப் பொருளையும், எகிப்துக்குச் செல்வதைப் பற்றிய எபிரெய வழக்கையும் இது பாதுகாக்கிறது.
- source_word: מִצְרַיְמָה
  choice: எகிப்துக்கு
  rationale: திசையைக் குறிக்கும் இறுதி உருபு எகிப்தை நோக்கிய இயக்கத்தைக் காட்டுகிறது; தமிழில் ‘எகிப்துக்கு’ என்பது இயல்பான வடிவம்.
- source_word: לָגוּר
  choice: சிறிது காலம் தங்குவதற்காக
  rationale: גור என்பது பொதுவாக ஒருவர் அந்நியராகத் தற்காலிகமாக வசிப்பதைக் குறிக்கிறது. வாசிக்க எளிதான முதன்மை உரையில் தற்காலிகத்தன்மை வெளிப்படுத்தப்பட்டு, அந்நியர் என்ற நுணுக்கம் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: שָׁם
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் எளிய வினையடை தமிழில் நேரடியாக ‘அங்கே’ என வழங்கப்பட்டது.
- source_word: כִּי
  choice: இருந்ததால்
  rationale: ஆபிராம் எகிப்துக்குச் சென்றதற்கான காரணத்தை அறிமுகப்படுத்துவதால், தமிழில் இயல்பான காரணவியல் தொடராக ‘இருந்ததால்’ பயன்படுத்தப்பட்டது.
- source_word: כָבֵד
  choice: கடுமையாக
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘கனமானது’ என்றாலும், பஞ்சத்தின் தீவிரத்தைக் குறிக்கும் இச்சூழலில் ‘கடுமையாக’ என்பது இயல்பான தமிழ் இணை.
