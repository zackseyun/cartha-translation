base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/009.yaml
  text: And Abram journeyed on[b][a], going toward the Negev.
translation:
  language: ta
  text: பின்பு ஆபிராம் புறப்பட்டு, நெகேபை[a] நோக்கித் தொடர்ந்து பயணம் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தெற்கு நோக்கி.” எபிரெயச் சொல் நெகேப் எனப்படும் தெற்குப் பகுதியையோ தெற்குத் திசையையோ குறிக்கலாம்; இங்கு அந்தப் பகுதியைக் குறிப்பதே அதிக சாத்தியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: பின்பு ... புறப்பட்டு ... பயணம் செய்தான்
  rationale: נסע என்பதன் இவ்வடிவம் முகாமை விட்டுப் புறப்பட்டு அடுத்த இடத்தை நோக்கிப் பயணிப்பதைக் குறிக்கிறது. தமிழில் இயல்பாக இருக்கும்படி ‘புறப்பட்டு ... பயணம் செய்தான்’ என வழங்கப்பட்டுள்ளது; வ־ என்பதன் கதைத் தொடர்ச்சி ‘பின்பு’ என்பதால் வெளிப்படுகிறது.
- source_word: אַבְרָם
  choice: ஆபிராம்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: הָלוֹךְ וְנָסוֹעַ
  choice: தொடர்ந்து பயணம் செய்தான்
  rationale: இவ்வினையெச்சத் தொடர் பயணம் நீடித்ததையும் முன்னோக்கித் தொடர்ந்ததையும் காட்டுகிறது. ‘தொடர்ந்து’ என்பது ‘கட்டங்கட்டமாக’ என்ற ஆதாரத்தில் வெளிப்படையாக இல்லாத நுண்பொருளைச் சேர்க்காமல் அந்த நீடித்த தன்மையை இயல்பான தமிழில் தருகிறது.
- source_word: הַנֶּגְבָּה
  choice: நெகேபை நோக்கி
  rationale: திசையைக் குறிக்கும் ־ה இறுதியை ‘நோக்கி’ வெளிப்படுத்துகிறது. definite article உடன் வரும் נֶגֶב இங்கு தெற்கிலுள்ள நெகேப் பகுதியைக் குறிக்கும் வாய்ப்பு மிகுந்தது; இருப்பினும் ‘தெற்கு நோக்கி’ என்ற பொருளும் சாத்தியம்.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. மூலத்தின் தொடர்ச்சியான பயண நுண்பொருள் இயல்பான வாக்கிய அமைப்பில் தரப்பட்டுள்ளது; இடப்பெயர் ஒலிபெயர்க்கப்பட்டு அதன் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
