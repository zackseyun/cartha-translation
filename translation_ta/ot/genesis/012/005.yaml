source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אַבְרָם֩ אֶת שָׂרַ֨י אִשְׁתּ֜/וֹ וְ/אֶת ל֣וֹט בֶּן אָחִ֗י/ו וְ/אֶת כָּל רְכוּשָׁ/ם֙ אֲשֶׁ֣ר רָכָ֔שׁוּ וְ/אֶת הַ/נֶּ֖פֶשׁ אֲשֶׁר עָשׂ֣וּ בְ/חָרָ֑ן וַ/יֵּצְא֗וּ לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֖אוּ אַ֥רְצָ/ה כְּנָֽעַן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/005.yaml
  text: Abram took Sarai his wife[a], and Lot his brother’s son, and all their possessions that they had acquired, and the people whom they had acquired in Haran; and they set out to go to the land of Canaan[b], and they came to the land of Canaan.
translation:
  language: ta
  text: ஆபிராம் தன் மனைவி சாராயையும், தன் சகோதரனின் மகன் லோத்தையும், அவர்கள் சேர்த்திருந்த உடைமைகள் அனைத்தையும், ஆரானில் அவர்கள் பெற்றுக்கொண்ட நபர்களையும்[a] உடன் கொண்டான். அவர்கள் கானான் நாட்டுக்குச் செல்லப் புறப்பட்டார்கள்; அவர்கள் கானான் நாட்டை வந்தடைந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவர்கள் பெற்றுக்கொண்ட நபர்கள்” என்றும், சொற்படியாக, “அவர்கள் உருவாக்கிய உயிர்கள்” என்றும் வாசிக்கலாம். ஆரானில் அவர்களுடைய குடும்பக்குழுவோடு சேர்ந்த அல்லது சேர்க்கப்பட்டவர்களைக் குறிக்கும் மரபுத்தொடராக இது இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: அழைத்துக்கொண்டு
  rationale: இங்கு பல நபர்களையும் உடைமைகளையும் உடன் கொண்டு புறப்படுவதைக் குறிக்கும் தொடர் சூழலில், வெறும் ‘எடுத்தான்’ என்பதைவிட இயல்பான தமிழாகவும் மூலத்தின் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: אִשְׁתּוֹ
  choice: தன் மனைவி
  rationale: திருமண உறவைக் குறிக்கும் இச்சூழலில் אִשָּׁה என்பதன் தெளிவான பொருள் ‘மனைவி’.
- source_word: בֶּן אָחִיו
  choice: தன் சகோதரனின் மகன்
  rationale: ‘அவனுடைய சகோதரனின் மகன்’ என்ற எபிரெய உறவுமுறைச் சொல்லை ‘மருமகன்’ எனத் தெளிவற்றதாக்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: כָּל רְכוּשָׁם אֲשֶׁר רָכָשׁוּ
  choice: அவர்கள் சேர்த்திருந்த உடைமைகள் அனைத்தையும்
  rationale: רְכוּשׁ என்பது உடைமைகளையும், רכש என்பது அவற்றைச் சேர்த்தல் அல்லது பெற்றுக்கொள்ளுதலையும் குறிக்கிறது; தமிழில் தேவையற்ற சொல் மறுமொழியைத் தவிர்த்து இரண்டின் கருத்தையும் தருகிறது.
- source_word: הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ
  choice: அவர்கள் தங்களோடு இணைத்துக்கொண்ட ஆட்களையும்
  rationale: נֶפֶשׁ இங்கு மனிதர்களைக் குறிக்கிறது. עָשׂוּ என்ற கடினமான மரபுத்தொடரை சொற்படியாக ‘உண்டாக்கிய உயிர்கள்’ என மொழிபெயர்க்காமல், குடும்பக்குழுவோடு சேர்த்துக்கொண்டவர்களைக் குறிக்கும் சாத்தியமான பொருளைத் தருகிறது; உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיֵּצְאוּ לָלֶכֶת
  choice: செல்லப் புறப்பட்டார்கள்
  rationale: ‘செல்வதற்காகப் புறப்பட்டார்கள்’ என்ற நோக்கமுடைய இயக்கத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַרְצָה כְּנַעַן
  choice: கானான் நாட்டுக்கு
  rationale: திசைச்சுட்டும் வடிவத்தையும் ‘கானான் நாடு’ என்ற மூலச் சொல்லமைப்பையும் காக்கிறது.
- source_word: וַיָּבֹאוּ אַרְצָה כְּנָעַן
  choice: அவர்கள் கானான் நாட்டை வந்தடைந்தார்கள்
  rationale: இலக்கை மீண்டும் குறிப்பிடும் எபிரெய மூலத்தின் வலியுறுத்தலைத் தக்கவைத்து, வருகை நிறைவடைந்ததையும் இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ என்ற மரபுத்தொடரின் பொருள்
  choice: அவர்கள் தங்களோடு இணைத்துக்கொண்ட ஆட்கள்
  alternative: அவர்கள் பெற்றுக்கொண்ட நபர்கள்; சொற்படியாக, அவர்கள் உருவாக்கிய உயிர்கள்
  rationale: இது வேலைக்காரர்கள், அடிமைகள், குடும்பத்துடன் சேர்ந்தவர்கள் அல்லது வேறு வகையில் பெற்ற நபர்கள் எனத் துல்லியமாகச் சொல்லவில்லை. ஆகவே ஒரு குறிப்பிட்ட சமூக அல்லது சமய விளக்கத்தைத் திணிக்காமல், பொதுவான மொழிபெயர்ப்பும் மாற்று வாசிப்புகளைக் காட்டும் அடிக்குறிப்பும் பயன்படுத்தப்பட்டன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெய மூலத்தில் கானான் நாடு இருமுறை வருவது தக்கவைக்கப்பட்டது. ‘ஆபிராம்,’ ‘சாராய்,’ ‘லோத்து,’ ‘ஆரான்,’ ‘கானான்’ ஆகியவை வழக்கிலுள்ள தமிழ் வேதாகமப் பெயர்வடிவங்களாகப் பயன்படுத்தப்பட்டன.
