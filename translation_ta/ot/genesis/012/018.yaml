review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the sequence, Pharaoh''s calling Abram, the rebuke, and the undisclosed fact that the woman is Abram''s wife. However, the first question is grammatically malformed in Tamil: “நீர் எனக்கு இப்படிச் செய்தது என்ன?” uses the finite subject form “நீர்” with the nominalized/neuter verb “செய்தது.”'
  naturalness: The second question is natural and appropriately formal. Revising the first question to “நீர் எனக்கு இப்படிச் செய்தது என்ன?” is not sufficient because of the agreement error; “நீர் எனக்கு என்ன இப்படிச் செய்தீர்?” is grammatical but less idiomatic. “நீர் எனக்கு என்ன செய்தீர்?” is idiomatic but loses the demonstrative nuance. “நீர் எனக்கு இப்படிச் செய்தது என்ன?” can be made natural by recasting as “நீர் எனக்கு இப்படிச் செய்தது ஏன்?” but this changes the interrogative from “what?” to “why?” A natural, source-faithful rendering is “நீர் எனக்கு என்ன இப்படிச் செய்தீர்?”
  terminology: “பார்வோன்” and “ஆபிராம்” are established Tamil biblical forms. The respectful singular forms “நீர்/உமது” fit the royal speaker's formal address and preserve the rebuking register without doctrinal implications.
  issues:
  - severity: medium
    issue: Subject–verb agreement error in the first direct question
    rationale: “நீர்” requires a corresponding second-person honorific verb such as “செய்தீர்”; “செய்தது” is neuter/nominal and makes the sentence ungrammatical. The correction retains מַה זֹּאת and עָשִׂיתָ לִּי as a direct rebuke.
  revised_text: அப்போது பார்வோன் ஆபிராமை அழைத்து, “நீர் எனக்கு என்ன இப்படிச் செய்தீர்? அவள் உமது மனைவி என்று ஏன் என்னிடம் சொல்லவில்லை?” என்றான்.
