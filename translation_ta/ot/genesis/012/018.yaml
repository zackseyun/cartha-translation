translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ். பார்வோன் ஆபிராமிடம் பேசுவதால் மரியாதை/தொலைவு காட்டும் ‘நீர், உமது’ வடிவங்கள் பயன்படுத்தப்பட்டன; வசனத்தின் கண்டனத் தொனி பாதுகாக்கப்பட்டது.
