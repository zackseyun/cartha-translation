source:
  edition: WLC
  text: וַ/יִּקְרָ֤א פַרְעֹה֙ לְ/אַבְרָ֔ם וַ/יֹּ֕אמֶר מַה זֹּ֖את עָשִׂ֣יתָ לִּ֑/י לָ֚/מָּה לֹא הִגַּ֣דְתָּ לִּ֔/י כִּ֥י אִשְׁתְּ/ךָ֖ הִֽוא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/018.yaml
  text: Then Pharaoh called Abram and said, “What is this you have done to me? Why did you not tell me that she is your wife?”
translation:
  language: ta
  text: அப்போது பார்வோன் ஆபிராமை அழைத்து, “நீர் எனக்கு என்ன இப்படிச் செய்தீர்? அவள் உமது மனைவி என்று ஏன் என்னிடம் சொல்லவில்லை?” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்து
  rationale: קרא + לְ ஒருவரை அழைப்பதைக் குறிக்கிறது. சூழல் கட்டாயமாக ‘வரவழைத்தான்’ என்ற வலிமையை வேண்டாததால், இயல்பான ‘அழைத்து’ பயன்படுத்தப்பட்டது.
- source_word: פַרְעֹה
  choice: பார்வோன்
  rationale: எபிரெய அரசுப் பட்டமான פַרְעֹה என்பதற்குத் தமிழில் பரவலாக அறியப்பட்ட வேதாகமப் பெயர்ப்பு.
- source_word: לְאַבְרָם
  choice: ஆபிராம்
  rationale: தனிப்பெயர் தமிழ் வேதாகம மரபுக்கு ஏற்ற வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: אמר என்பது பொதுவான உரை வினை; நேரடிக் கூற்றின் முடிவில் இயல்பான தமிழில் ‘என்றான்’ என அமைக்கப்பட்டது.
- source_word: מַה זֹּאת עָשִׂיתָ לִּי
  choice: நீர் எனக்கு இப்படிச் செய்தது என்ன?
  rationale: מַה זֹּאת என்பதன் சுட்டுப்பொருளையும் עָשִׂיתָ לִּי என்பதிலுள்ள பார்வோனின் தனிப்பட்ட குற்றச்சாட்டையும் காக்கும் இயல்பான தமிழ் வினா.
- source_word: לָמָּה לֹא הִגַּדְתָּ לִּי
  choice: ஏன் என்னிடம் சொல்லவில்லை?
  rationale: נגד என்பதன் ஹிப்இல் வடிவம் ‘தெரிவி/சொல்’ எனப் பொருள்படும்; நவீன தமிழில் ‘என்னிடம் சொல்லவில்லை’ இயல்பாக உள்ளது.
- source_word: כִּי אִשְׁתְּךָ הִוא
  choice: அவள் உமது மனைவி என்று
  rationale: כִּי இங்கு சொல்லப்படாத தகவலின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; எபிரெய பெயர்ச்சொல் வாக்கியத்தின் நிகழ்காலப் பொருள் தமிழில் இயல்பாக வெளிப்படுகிறது.
- source_word: וַ
  choice: அப்போது
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ நிகழ்வின் தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது.
