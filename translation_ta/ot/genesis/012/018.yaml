revisions:
- from: அப்போது பார்வோன் ஆபிராமை அழைத்து, “நீர் எனக்கு இப்படிச் செய்தது என்ன? அவள் உமது மனைவி என்று ஏன் என்னிடம் சொல்லவில்லை?” என்றான்.
  to: அப்போது பார்வோன் ஆபிராமை அழைத்து, “நீர் எனக்கு என்ன இப்படிச் செய்தீர்? அவள் உமது மனைவி என்று ஏன் என்னிடம் சொல்லவில்லை?” என்றான்.
  rationale: The first question has been recast solely to correct Tamil agreement and restore a natural interrogative construction. “என்ன” renders מַה, while “இப்படிச்” retains the demonstrative force of זֹּאת. All narrative, referential, and relational content remains unchanged.
