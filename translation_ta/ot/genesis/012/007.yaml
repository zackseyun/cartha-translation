base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/007.yaml
  text: Then Yahweh appeared to Abram and said[a], “To your offspring I will give this land.” So there he built an altar to Yahweh, who had appeared to him.
translation:
  language: ta
  text: பின்பு யாவே ஆபிராமுக்குத் தோன்றி, “இந்த நிலத்தை உன் சந்ததிக்கு[a] கொடுப்பேன்” என்றார். எனவே, அவனுக்குத் தோன்றிய யாவேக்கு அங்கே அவன் ஒரு பலிபீடத்தைக் கட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வித்துக்கு’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் வடிவில் ஒருமையாக இருந்தாலும், வழிவருவோரின் ஒரு குழுவைக் கூட்டாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைப்பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: וַיֵּרָא
  choice: தோன்றி
  rationale: ראה என்பதன் நிஃபால் வடிவம் இங்கு ஆபிராமுக்குக் காணத்தக்க விதத்தில் வெளிப்பட்டதைக் குறிக்கிறது; ‘தோன்றி’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: אֶל־אַבְרָם
  choice: ஆபிராமுக்கு
  rationale: திசை அல்லது தொடர்பைக் குறிக்கும் אֶל முன்னிடைச்சொல்லை இயல்பான தமிழ் வேற்றுமையுருபால் வழங்குகிறது.
- source_word: לְזַרְעֲךָ
  choice: உன் சந்ததிக்கு
  rationale: זֶרַע வடிவில் ஒருமையாக இருந்தாலும் கூட்டுப் பொருளில் வழிவருவோரைக் குறிக்கக்கூடும். ‘சந்ததி’ அந்தத் திறந்த பொருளை இயல்பாகப் பேணுகிறது.
- source_word: אֶתֵּן
  choice: கொடுப்பேன்
  rationale: முற்றுப்பெறாத வினைவடிவம் இங்கு எதிர்கால வாக்குறுதியை வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ הַזֹּאת
  choice: இந்த நிலத்தை
  rationale: אֶרֶץ இச்சூழலில் வாக்குறுதியளிக்கப்படும் நிலப்பகுதியைக் குறிக்கிறது; ‘நிலம்’ என்பது ‘நாடு’ என்பதிலுள்ள அரசியல் நிழற்பொருளைத் தவிர்க்கிறது.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: அங்கே அவன் ஒரு பலிபீடத்தைக் கட்டினான்
  rationale: தொடர்ச்சியான கதைநிகழ்வையும் இடத்தையும் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: ל முன்னொட்டு பலிபீடம் யாவேக்கென அர்ப்பணிக்கப்பட்டதை அல்லது அவரை நோக்கிக் கட்டப்பட்டதைச் சுட்டுகிறது.
- source_word: הַנִּרְאֶה אֵלָיו
  choice: தனக்குத் தோன்றிய
  rationale: உருபுடன் வரும் பங்கெச்சம், பலிபீடம் கட்டப்படுவதற்கு முன்பு ஆபிராமுக்குத் தோன்றியவர் யாவே என்பதை அடையாளப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயரே உள்ளது; அதைப் ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பேணுகிறது.
- issue: זֶרַע என்பதன் ஒருமை வடிவமும் கூட்டுப் பொருளும்
  choice: சந்ததி
  alternative: வித்து; சந்ததியினர்
  rationale: ‘சந்ததி’ என்பது ஒருமை வடிவில் இருந்து ஒருவரையோ வழிவருவோரின் கூட்டத்தையோ குறிக்கக்கூடியதால், மூலத்திலுள்ள பொருள் நெருக்கடியை முன்கூட்டியே தீர்த்துவிடாமல் பேணுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பலிபீடம்’ என்பது பரவலாக அறியப்பட்ட வேதாகமச் சொல்லாக இருப்பதால் தக்கவைக்கப்பட்டுள்ளது; வாக்கிய அமைப்பு தேவையற்ற தொன்மை நடையைத் தவிர்க்கிறது.
