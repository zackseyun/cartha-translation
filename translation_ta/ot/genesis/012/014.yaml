source:
  edition: WLC
  text: וַ/יְהִ֕י כְּ/ב֥וֹא אַבְרָ֖ם מִצְרָ֑יְמָ/ה וַ/יִּרְא֤וּ הַ/מִּצְרִים֙ אֶת הָ֣/אִשָּׁ֔ה כִּֽי יָפָ֥ה הִ֖וא מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/014.yaml
  text: And when Abram entered Egypt[a], the Egyptians saw that the woman was very beautiful.
translation:
  language: ta
  text: ஆபிராம் எகிப்துக்குள் வந்தபோது, அந்தப் பெண் மிகவும் அழகானவள் என்பதை எகிப்தியர்கள் கண்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, ‘அந்த மனைவி.’ எபிரேயச் சொல்லான אִשָּׁה என்பதற்கு ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள் வரலாம்; இங்கு வாக்கியத்தின் பொதுவான சொல்லாட்சி முதன்மை உரையில் தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבֹא
  choice: வந்தபோது
  rationale: היה உடன் வரும் כ־ முன்னொட்டுடைய infinitive construct அடுத்த நிகழ்வின் காலச் சூழலை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பாகவும் தொடர்ச்சியைத் தெளிவாகவும் காட்டும் வடிவம் ‘வந்தபோது’.
- source_word: מִצְרָיְמָה
  choice: எகிப்துக்குள்
  rationale: இறுதியில் உள்ள directional ה எகிப்தை நோக்கிய, அதற்குள் செல்லும் இயக்கத்தைக் குறிக்கிறது; ‘எகிப்துக்குள் வந்தபோது’ இதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּרְאוּ
  choice: கண்டார்கள்
  rationale: ראה இங்கு நேரடியாக ‘காணுதல்’ என்று பொருள்படுகிறது. ‘கவனித்தார்கள்’ என்பதைவிட ‘கண்டார்கள்’ மூலத்திற்கு நெருக்கமானது.
- source_word: הַמִּצְרִים
  choice: எகிப்தியர்கள்
  rationale: இது definite plural gentilic; தமிழில் சூழலால் குறித்த மக்கள் தெளிவாக இருப்பதால் ‘எகிப்தியர்கள்’ இயல்பான சமமான வடிவம்.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: אִשָּׁה என்பதற்கு ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள் வரலாம். இவ்வாக்கியத்தின் பொதுவான சொல்லாட்சியைப் பாதுகாக்க ‘அந்தப் பெண்’ தேர்ந்தெடுக்கப்பட்டது; definite article-இன் anaphoric force-ஐ ‘அந்த’ காட்டுகிறது.
- source_word: כִּי יָפָה הִוא מְאֹד
  choice: மிகவும் அழகாக இருப்பதை
  rationale: כִּי அவர்கள் கண்டறிந்த உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; יָפָה மற்றும் מְאֹד ஆகியவை ‘மிகவும் அழகாக’ என்று இயல்பாக அமைகின்றன. எபிரேய பெயர்ச்சொல் வாக்கியத்தின் காலத்தைத் தமிழில் ‘இருப்பதை’ பொருத்தமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: הָאִשָּׁה என்பதில் திருமண உறவை வெளிப்படையாகக் குறிப்பிட வேண்டுமா?
  choice: முதன்மை உரையில் ‘அந்தப் பெண்’ என்று வைத்து, மாற்றுப் பொருளை அடிக்குறிப்பில் தருதல்
  alternative: ‘அந்த மனைவி’
  rationale: சூழலில் சாராய் ஆபிராமின் மனைவியாக இருந்தாலும், இக்கூற்றில் பயன்படுத்தப்பட்ட אִשָּׁה என்ற சொல்லின் பொதுவான பொருளைத் தக்கவைத்தல் மூலத்தின் உண்மையான சொற்பொருள் நெகிழ்வை பாதுகாக்கிறது; திருமண உறவை இவ்வாக்கியத்துக்குள் விளக்கமாகச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எகிப்துக்குள் வந்தபோது’ இயக்கத்தையும் காலத் தொடர்பையும் இயல்பாக இணைக்கிறது. ‘அந்தப் பெண்’ முன் குறிப்பிடப்பட்ட சாராயைச் சுட்டுவதோடு, மூலத்தின் பெண்/மனைவி என்ற பொருள் நெகிழ்வையும் பாதுகாக்கிறது.
