id: GEN.12.19
reference: Genesis 12:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לָ/מָ֤ה אָמַ֨רְתָּ֙ אֲחֹ֣תִ/י הִ֔וא וָ/אֶקַּ֥ח אֹתָ֛/הּ לִ֖/י לְ/אִשָּׁ֑ה וְ/עַתָּ֕ה הִנֵּ֥ה אִשְׁתְּ/ךָ֖ קַ֥ח וָ/לֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/019.yaml
  text: Why did you say[a], ‘She is my sister,’ and I took her to be my wife? And now, here is your wife[c][b]. Take her and go.”
translation:
  language: ta
  text: “அவள் என் சகோதரி” என்று நீ ஏன் சொன்னாய்? நான் அவளை எனக்கு மனைவியாக எடுத்துக்கொள்ளும்படி ஏன் அப்படிச் சொன்னாய்? இப்போது, இதோ உன் மனைவி. அவளை அழைத்துக்கொண்டு போ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָה
  choice: ஏன்
  rationale: காரணத்தை நேரடியாகக் கேட்கும் வினாவை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: אֲחֹתִי הִוא
  choice: அவள் என் சகோதரி
  rationale: எபிரேய மொழியின் வினைச்சொல் இல்லாத மேற்கோள் வாக்கியத்தை இயல்பான நேரடிக் கூற்றாகப் பாதுகாக்கிறது.
- source_word: וָאֶקַּח אֹתָהּ לִי לְאִשָּׁה
  choice: அதனால் நான் அவளை எனக்கு மனைவியாக எடுத்துக்கொண்டேனே
  rationale: וָאֶקַּח என்பதன் தொடர்ச்சியையும், ஆபிராமின் கூற்றினால் ஏற்பட்ட விளைவையும் தமிழில் தெளிவாக்குகிறது; לִי என்பதையும் ‘எனக்கு’ என்று வெளிப்படையாக வைத்துள்ளது.
- source_word: וְעַתָּה הִנֵּה אִשְׁתְּךָ
  choice: இப்போது, இதோ உன் மனைவி
  rationale: வசனத்தின் கண்டனத்திலிருந்து கட்டளைக்கான மாற்றத்தையும் הִנֵּה என்பதன் சுட்டிக்காட்டும் வலியுறுத்தலையும் இயல்பாகத் தருகிறது.
- source_word: קַח וָלֵךְ
  choice: அவளை அழைத்துக்கொண்டு போ
  rationale: அடுத்தடுத்து வரும் இரு கட்டளைகளையும் தமிழின் இயல்பான ஒருங்கிணைந்த சொல்லாக்கத்தில் தருகிறது; சூழலிலுள்ள பெண்பால் செயப்படுபொருள் வெளிப்படையாக உள்ளது.
theological_decisions:
- issue: பார்வோன் சாராயை உண்மையில் திருமணம் செய்துகொண்ட நிலையை இச்சொல் உறுதிப்படுத்துகிறதா என்பது
  choice: மனைவியாக எடுத்துக்கொண்டேன்
  alternative: திருமணம் செய்துகொண்டேன்
  rationale: எபிரேய לְאִשָּׁה கட்டமைப்பை நெருக்கமாகப் பாதுகாத்து, சம்பவத்தின் நிறைவேற்ற நிலை குறித்த உரையின் இயல்பான பதற்றத்தைத் தீர்மானமாக மாற்றாமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்டனத்தின் தீவிரத்தை ‘எடுத்துக்கொண்டேனே’ வெளிப்படுத்துகிறது. மொழிநடை கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதும் ஆகும்.
