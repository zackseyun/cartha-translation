source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר הִקְרִ֖יב לָ/ב֣וֹא מִצְרָ֑יְמָ/ה וַ/יֹּ֨אמֶר֙ אֶל שָׂרַ֣י אִשְׁתּ֔/וֹ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִשָּׁ֥ה יְפַת מַרְאֶ֖ה אָֽתְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/011.yaml
  text: And it happened[a], as he was about to enter Egypt, that he said to Sarai his wife, “Look now[b], I know that you are a woman beautiful in appearance.”
translation:
  language: ta
  text: அவன் எகிப்துக்குள் நுழைய நெருங்கியபோது, தன் மனைவி சாராயிடம், “இதோ, நீ பார்ப்பதற்கு அழகான பெண் என்று எனக்குத் தெரியும்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: …போது
  rationale: எபிரெயக் கதைநடையின் நிகழ்வு அறிமுகச் சூத்திரத்தையும் காலத் தொடர்பையும் தமிழில் இயல்பான சார்பு வாக்கியமாகக் காட்டுகிறது; தனியே ‘அது நிகழ்ந்தது’ என்று மொழிபெயர்ப்பது இங்கு செயற்கையாக இருக்கும்.
- source_word: הִקְרִיב לָבוֹא
  choice: நுழைய நெருங்கிய
  rationale: קרב என்பதன் ஹிஃபில் வடிவமும் בוא வினையெச்சமும், உள்ளே செல்வதற்காக நெருங்கி வந்ததையும் அச்செயல் உடனடியாக நிகழவிருந்ததையும் குறிக்கின்றன.
- source_word: מִצְרָיְמָה
  choice: எகிப்துக்குள்
  rationale: இடப்பெயரின் திசைச்சுட்டு இறுதியை, ‘நுழை’ என்ற வினையுடன் இயல்பான தமிழ் இலக்கணத்தில் இலக்கைச் சுட்டும் வடிவமாக வழங்குகிறது.
- source_word: שָׂרַי אִשְׁתּוֹ
  choice: தன் மனைவி சாராயிடம்
  rationale: சாராயை ஆபிராமின் மனைவியாக அடையாளப்படுத்தும் மூலமொழியின் இணைப்பை இயல்பான தமிழ்ச் சொல்வரிசையில் காக்கிறது.
- source_word: הִנֵּה נָא
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் הִנֵּה மற்றும் உரையை மென்மைப்படுத்தும் அல்லது வலியுறுத்தும் נָא ஆகியவற்றின் உரையாடல் வலிமையைச் சுருக்கமாகவும் மரியாதையான நவீன தமிழிலும் தருகிறது.
- source_word: יָדַעְתִּי
  choice: எனக்குத் தெரியும்
  rationale: முற்றுவினை வடிவம் இங்கு தற்போதைய அறிவுநிலையைக் குறிக்கிறது; இவ்வடிவம் இயல்பான தமிழில் அதைப் பிரதிபலிக்கிறது.
- source_word: אִשָּׁה יְפַת מַרְאֶה אָתְּ
  choice: நீ பார்ப்பதற்கு அழகான பெண்
  rationale: אִשָּׁה என்பதை ‘பெண்’ என்றும் יְפַת מַרְאֶה என்பதை காணத்தக்க தோற்ற அழகைக் குறிக்கும் ‘பார்ப்பதற்கு அழகான’ என்றும் வழங்கி, வாக்கியத்தின் வெளிப்படையான ‘நீ’ என்பதைப் பேணுகிறது.
