translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, பொதுவாசகருக்கு எளிதான கதைநடை. மூலத்தின் காலச் சார்பை இயல்பாகக் காத்து, தேவையற்ற பழமையான ‘சம்பவித்தது’ போன்ற மொழிநடையைத் தவிர்க்கிறது.
