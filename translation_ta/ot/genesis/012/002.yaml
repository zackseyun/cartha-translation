revisions:
- from: நான் உன்னை ஒரு பெரிய மக்களினமாக ஆக்குவேன்; உன்னை ஆசீர்வதிப்பேன்; உன் பெயரை மேன்மைப்படுத்துவேன்; நீ ஆசீர்வாதமாக இரு.[a]
  to: நான் உன்னை ஒரு பெரிய மக்களினமாக ஆக்குவேன்; உன்னை ஆசீர்வதிப்பேன்; உன் பெயரைப் பெரியதாக்குவேன்; ஆசீர்வாதமாக இரு.[a]
  rationale: The revision is limited to a more source-transparent rendering of ‘make your name great’ and a minor naturalization of the footnote. It preserves the Hebrew imperative in the final clause and retains the alternative resultative reading in the footnote.
