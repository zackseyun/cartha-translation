id: GEN.12.2
reference: Genesis 12:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אֶֽעֶשְׂ/ךָ֙ לְ/ג֣וֹי גָּד֔וֹל וַ/אֲבָ֣רֶכְ/ךָ֔ וַ/אֲגַדְּלָ֖ה שְׁמֶ֑/ךָ וֶ/הְיֵ֖ה בְּרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/002.yaml
  text: And I will make you into a great nation[a], and I will bless you, and I will make your name great[b], and be a blessing.
translation:
  language: ta
  text: நான் உன்னை ஒரு பெரிய மக்களினமாக ஆக்குவேன்; உன்னை ஆசீர்வதிப்பேன்; உன் பெயரைப் பெரியதாக்குவேன்; ஆசீர்வாதமாக இரு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ ஆசீர்வாதமாக இருப்பாய்.” எபிரேயத்தில் “இரு” என்பது கட்டளை வடிவம்; ஆனால் கடவுளின் வாக்குறுதிகளின் விளைவைக் குறிப்பதாகவும் இச்சொற்றொடரைப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל
  choice: நான் உன்னை ஒரு பெரிய மக்களினமாக ஆக்குவேன்
  rationale: ‘உன்னை ... ஆக்குவேன்’ என்பது எபிரெய வாக்கிய அமைப்பைத் தெளிவாகப் பிரதிபலிக்கிறது. גּוֹי என்பது ஒரு மக்கள்கூட்டத்தையோ இனத்தையோ குறிக்கக்கூடும்; நவீனத் தமிழில் சாதிப் பொருள் எழாமல் இருக்க ‘மக்களினம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַאֲבָרֶכְךָ
  choice: உன்னை ஆசீர்வதிப்பேன்
  rationale: בּרך என்பதன் நேரடியான ‘ஆசீர்வதி’ என்ற பொருளையும், ஆபிராமை நேரடியாகக் குறிக்கும் இரண்டாம் நபர் ஒருமையையும் காக்கிறது.
- source_word: וַאֲגַדְּלָה שְׁמֶךָ
  choice: உன் பெயரை மேன்மைப்படுத்துவேன்
  rationale: ‘பெயர்’ என்பதை அப்படியே வைத்திருப்பதால் மூலத்தின் உருவகமும் வேதாகம ஒலிப்பும் காக்கப்படுகின்றன; ‘மேன்மைப்படுத்துவேன்’ என்பது பெயரைப் பெரியதாக்குதல் என்ற கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: וֶהְיֵה בְּרָכָה
  choice: நீ ஆசீர்வாதமாக இரு
  rationale: וֶהְיֵה என்பது இரண்டாம் நபர் ஆண்பால் ஒருமை கட்டளை வடிவம். ஆகவே இதை வெறும் எதிர்கால வாக்குறுதியாக மாற்றாமல், ‘இரு’ என்ற கட்டளை வடிவில் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: וֶהְיֵה בְּרָכָה என்பதன் இலக்கண வலிமை
  choice: 'கட்டளை: ‘நீ ஆசீர்வாதமாக இரு’'
  alternative: 'விளைவு அல்லது முன்னறிவிப்பு: ‘நீ ஆசீர்வாதமாக இருப்பாய்’'
  rationale: எபிரெயச் சொல் இலக்கணப்படி கட்டளை வடிவில் உள்ளது. எனினும் அது இறைவனின் தொடர்ச்சியான வாக்குறுதிகளுக்குள் வருவதால், விளைவைக் குறிக்கும் எதிர்காலக் கூற்றாகவும் புரிந்துகொள்ளப்படுகிறது; அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘ஜாதி’ என்பதன் இன்றைய சாதிசார் ஒலிப்பைத் தவிர்க்க ‘மக்களினம்’ பயன்படுத்தப்பட்டது. இறுதிக் கட்டளையின் திடீர் இலக்கண மாற்றம் மூலத்தில் இருப்பதுபோலவே பாதுகாக்கப்பட்டுள்ளது.
