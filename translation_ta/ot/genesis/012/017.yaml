source:
  edition: WLC
  text: וַ/יְנַגַּ֨ע יְהוָ֧ה אֶת פַּרְעֹ֛ה נְגָעִ֥ים גְּדֹלִ֖ים וְ/אֶת בֵּית֑/וֹ עַל דְּבַ֥ר שָׂרַ֖י אֵ֥שֶׁת אַבְרָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/017.yaml
  text: But Yahweh afflicted Pharaoh and his household with severe plagues because of Sarai[a], Abram’s wife.
translation:
  language: ta
  text: ஆனால் யாவே பார்வோனையும் அவனுடைய வீட்டாரையும் ஆபிராமின் மனைவியான சாராயைப் பற்றிய காரியத்தினால் பெரும் வாதைகளால் பீடித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பார்வோனையும் அவனுடைய வீட்டாரையும் பெரும் பீடிப்புகளால் தாக்கினார்.” எபிரெயத்தில் வினைச்சொல்லும் பெயர்ச்சொல்லும் தொடர்புடைய வேர்ச்சொற்களிலிருந்து வருகின்றன; அவை ‘தாக்குதல்/பீடித்தல்’ மற்றும் ‘பீடிப்புகள்/வாதைகள்’ என்ற பொருள்களைத் தருகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַגַּע
  choice: வாதித்தார்
  rationale: נגע என்ற வினை இங்கு נְגָעִים என்பதுடன் சொல்விளையாட்டைப் போன்ற ஒரே வேர்ச்சொல் அமைப்பில் வந்து, தீங்கு விளைவிக்கும் வாதைகளை ஏற்படுத்தியதைக் குறிக்கிறது. ‘வாதித்தார்’ என்பது இதை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என்ற ஒலிபெயர்ப்பால் தருகிறது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரசருக்குரிய பட்டத்தின் வழக்கமான தமிழ் வடிவம்.
- source_word: נְגָעִים גְּדֹלִים
  choice: கொடிய வாதைகளால்
  rationale: נְגָעִים என்பது வாதைகள், தாக்கங்கள் அல்லது பீடிப்புகள் எனப் பொருள்படலாம்; גְּדֹלִים இங்கு அளவைவிடத் தீவிரத்தை வலியுறுத்துவதால் ‘கொடிய வாதைகள்’ இயல்பாகப் பொருந்துகிறது.
- source_word: וְאֶת בֵּיתוֹ
  choice: அவனுடைய வீட்டாரையும்
  rationale: בֵּיתוֹ இச்சூழலில் கட்டடத்தை மட்டும் அல்லாமல் பார்வோனின் குடும்பத்தையும் வீட்டைச் சேர்ந்தவர்களையும் குறிக்கிறது; ‘வீட்டார்’ அந்தக் கூட்டுப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: עַל דְּבַר
  choice: நிமித்தம்
  rationale: இந்தச் சொற்றொடர் வாதைகளுக்கான காரணத்தைச் சுட்டுகிறது. ‘நிமித்தம்’ காரணத் தொடர்பைப் பாதுகாக்கும் கண்ணியமான நடப்புத் தமிழ் பயன்பாடு.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: ஆபிராமின் மனைவியான சாராய்
  rationale: சாராயை ஆபிராமின் மனைவி என்று அடையாளப்படுத்தும் appositional உறவை இயல்பான தமிழ்ச் சொல்வரிசையில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள தனிப்பெயரை ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது. தமிழ் வாசகர்களிடையே பரவலாக அறியப்படும் வடிவமாக ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பது மாற்று ஒலிபெயர்ப்பு.
- issue: சாராயின் நிமித்தம் என்பதன் காரணத் தொடர்பு
  choice: சாராயின் நிமித்தம்
  alternative: சாராயைப் பற்றிய காரியத்தினால்
  rationale: עַל דְּבַר இங்கு வாதைகளின் காரணத்தைச் சுட்டுகிறது; அந்தக் காரணம் சாராயின் குற்றம் என்று உரை சொல்லாததால், மொழிபெயர்ப்பு அவள்மீது குற்றம் சுமத்தாமல் மூலத்தின் சுருக்கத்தையும் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘வாதைகளால் வாதித்தார்’ என்ற சிறிய மீளுரைத்தன்மை எபிரெய மூலத்தின் ஒரே வேர்ச்சொல் அமைப்பை ஓரளவு பிரதிபலிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
