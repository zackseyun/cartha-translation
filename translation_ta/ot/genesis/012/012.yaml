id: GEN.12.12
reference: Genesis 12:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יִרְא֤וּ אֹתָ/ךְ֙ הַ/מִּצְרִ֔ים וְ/אָמְר֖וּ אִשְׁתּ֣/וֹ זֹ֑את וְ/הָרְג֥וּ אֹתִ֖/י וְ/אֹתָ֥/ךְ יְחַיּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/012.yaml
  text: And it will be that when the Egyptians see you[a], they will say, ‘This is his wife,’ and they will kill me[b], but they will let you live.
translation:
  language: ta
  text: எகிப்தியர்கள் உன்னைப் பார்க்கும்போது, ‘இவள் அவனுடைய மனைவி’ என்று சொல்லி, என்னைக் கொன்றுவிடுவார்கள்; ஆனால் உன்னை உயிரோடு விட்டுவிடுவார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னை வாழ விடுவார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: …பார்க்கும்போது
  rationale: எதிர்பார்க்கப்படும் நிகழ்வை அறிமுகப்படுத்தும் எபிரேயத் தொடரைத் தமிழில் இயல்பான காலத் துணைவாக்கியமாகத் தருகிறது; தனியே ‘அது நடக்கும்’ என்று சேர்த்து நடையைச் சுமையாக்கவில்லை.
- source_word: יִרְאוּ אֹתָךְ
  choice: உன்னைப் பார்க்கும்போது
  rationale: ראה என்பதன் சாதாரணமான ‘பார்/காண்’ பொருளையும், இங்கு வரும் எதிர்காலச் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמִּצְרִים
  choice: எகிப்தியர்கள்
  rationale: குறிப்பிட்ட இன/நாட்டு மக்களைக் குறிக்கும் வழக்கமான நவீனத் தமிழ்ச் சொல்.
- source_word: אִשְׁתּוֹ זֹאת
  choice: இவள் அவனுடைய மனைவி
  rationale: சுட்டுப்பெயரின் வலிமையை ‘இவள்’ என்பதன் மூலம் காத்து, எபிரேயப் பெயர்வாக்கியத்தை இயல்பான தமிழில் வழங்குகிறது.
- source_word: וְהָרְגוּ אֹתִי
  choice: என்னைக் கொன்றுவிடுவார்கள்
  rationale: הרג என்பதன் நேரடியான ‘கொல்’ பொருளைத் தருகிறது; ‘-விடு’ நிகழ்வின் முடிவுறும் தன்மையை இயல்பாக உணர்த்துகிறது.
- source_word: וְאֹתָךְ יְחַיּוּ
  choice: ஆனால் உன்னை உயிரோடு விட்டுவிடுவார்கள்
  rationale: חיה என்பதன் ஹிஃபில் வடிவுக்குரிய ‘உயிரோடு வைத்திரு/வாழ விடு’ பொருளைத் தருகிறது; முந்தைய ‘என்னைக் கொல்வார்கள்’ என்பதுடனான எதிர்மறை ஒப்புமையை ‘ஆனால்’ வெளிப்படுத்துகிறது.
