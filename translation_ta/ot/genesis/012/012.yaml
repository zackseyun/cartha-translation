translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் நேரடியும் கண்ணியமுமான நடை. எபிரேய வாக்கியத்தின் எதிர்கால அச்சமும், ‘என்னைக் கொல்வார்கள் / உன்னை உயிரோடு விடுவார்கள்’ என்ற மாறுபாடும் காக்கப்பட்டுள்ளன.
