translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டது. ‘ஆட்கள்’ என்பது மூலத்தின் பொதுத்தன்மையைப் பேணுகிறது; ‘அனுப்பிவிட்டார்கள்’ என்பது வெளியேற்றம் அல்லது புறப்படச் செய்தல் என்ற பொருளைத் தருகிறது, ஆனால் ‘பாதுகாப்பாக வழியனுப்பினர்’ என்ற உரையில் இல்லாத விவரத்தைச் சேர்ப்பதில்லை. அனைத்து அடிக்குறிப்பு குறியீடுகளும் தொடர்புடைய முதன்மை உரைப்பகுதிகளில் இடப்பட்டுள்ளன.
