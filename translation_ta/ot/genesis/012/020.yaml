base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/020.yaml
  text: Then Pharaoh gave men orders concerning him[c][b][a], and they sent him away with his wife and all that belonged to him.
translation:
  language: ta
  text: அப்போது பார்வோன் அவனைப் பற்றி ஆட்களுக்குக் கட்டளையிட்டான்[a][b]. அவர்கள் அவனையும், அவன் மனைவியையும், அவனுக்குச் சொந்தமான அனைத்தையும் அனுப்பிவிட்டார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்போது பார்வோன் ஆட்களுக்குக் கட்டளையிட்டான்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெய உரை “ஆட்கள்” என்று மட்டுமே கூறுகிறது. அவர்கள் பார்வோனின் பணியாளர்கள் அல்லது அதிகாரிகளாக இருக்கலாம்; ஆனால் அவர்களுடைய சரியான பணி குறிப்பிடப்படவில்லை.
    reason: cultural_note
  - marker: c
    text: அல்லது, “அவனுக்கு இருந்த அனைத்தையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டான்
  rationale: צוה என்பதன் இயல்பான பொருள் ‘கட்டளையிடுதல்’; பார்வோன் பிறருக்கு உத்தரவு அளித்ததைத் தெளிவாகவும் சுருக்கமாகவும் காட்டுகிறது.
- source_word: עָלָיו
  choice: ஆபிராமைக் குறித்து
  rationale: צוה உடன் வரும் עַל இங்கு ஆபிராமைப் பற்றிய அல்லது அவரைக் குறித்த உத்தரவைக் குறிக்கிறது. சுட்டுப்பெயரின் குறிப்பு தெளிவாக இருக்க ‘ஆபிராம்’ எனப் பெயர் பயன்படுத்தப்பட்டது.
- source_word: אֲנָשִׁים
  choice: ஆட்களுக்கு
  rationale: எபிரெயச் சொல் பொதுவாக ‘ஆண்கள்/ஆட்கள்’ எனப் பொருள்படும். அவர்கள் பணியாளர்களா காவலர்களா என்பதை உரை குறிப்பிடாததால், இயல்பானதும் குறிப்பிட்ட பங்கைத் திணிக்காததுமான ‘ஆட்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיְשַׁלְּחוּ
  choice: அனுப்பிவிட்டார்கள்
  rationale: שלח இச்சூழலில் ஒருவரை அனுப்பிவிடுதல் அல்லது புறப்படச் செய்தல் என்ற பொருளைக் கொண்டுள்ளது; பாதுகாப்பாக அழைத்துச் சென்றார்கள் என்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: אֹתוֹ
  choice: அவனை
  rationale: ஆபிராமைக் குறிக்கும் நேரடி செயப்படுபொருள் சுட்டுப்பெயர்.
- source_word: אִשְׁתּוֹ
  choice: அவன் மனைவியை
  rationale: திருமணச் சூழலில் אשה + உரிமை விகுதி இயல்பாக ‘அவன் மனைவி’ என்று பொருள்படும்.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: அவனுக்குச் சொந்தமான அனைத்தையும்
  rationale: ஆபிராமிடம் இருந்த அல்லது அவருக்குரிய உடைமைகள் அனைத்தையும் குறிக்கும் எபிரெயச் சொற்றொடரை நேர்த்தியாகப் பிரதிபலிக்கிறது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற எகிப்திய அரசப் பட்டத்தின் வடிவம்.
