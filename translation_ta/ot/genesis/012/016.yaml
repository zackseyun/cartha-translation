translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ஆண்/பெண் கழுதைகள் மற்றும் ஆண்/பெண் அடிமைகள் என்ற மூலத்தின் பாலின வேறுபாடுகள் வெளிப்படையாகக் காக்கப்பட்டுள்ளன; அடிமை நிலையை மென்மைப்படுத்தி ‘வேலைக்காரர்கள்’ என்று மாற்றவில்லை.
