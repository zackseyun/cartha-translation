  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/לְ/אַבְרָ֥ם הֵיטִ֖יב בַּ/עֲבוּרָ֑/הּ וַֽ/יְהִי ל֤/וֹ צֹאן וּ/בָקָר֙ וַ/חֲמֹרִ֔ים וַ/עֲבָדִים֙ וּ/שְׁפָחֹ֔ת וַ/אֲתֹנֹ֖ת וּ/גְמַלִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/016.yaml
  text: And he treated Abram well because of her[a], and he came to have sheep and cattle and male donkeys and male servants and female servants and female donkeys and camels.
translation:
  language: ta
  text: அவளின் காரணமாக அவன் ஆபிராமை நன்றாக நடத்தினான்[a]. ஆபிராமுக்கு ஆடுகளும் மாடுகளும் ஆண் கழுதைகளும் ஆண் அடிமைகளும் பெண் அடிமைகளும் பெண் கழுதைகளும் ஒட்டகங்களும் கிடைத்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவளுக்காக.’ எபிரேயச் சொற்றொடரை இவ்விரு விதங்களிலும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיב
  choice: நன்மை செய்தான்
  rationale: ஹிப்இல் வடிவம் ஒருவருக்கு நன்மை செய்வதையோ அவரை ஆதரவாக நடத்துவதையோ குறிக்கிறது. ‘நன்மை செய்தான்’ என்பது மூலத்தின் தனிநபர் தொடர்பையும் எளிய கதைநடையையும் காக்கிறது.
- source_word: בַּעֲבוּרָהּ
  choice: அவள் காரணமாக
  rationale: இந்தச் சொற்றொடர் காரணம் அல்லது நிகழ்வுக்கான சூழலைக் குறிக்கிறது. தமிழில் ‘அவள் காரணமாக’ என்பது காரணப்பொருளை இயல்பாகத் தெரிவிக்கிறது; பயன்நோக்குப் பொருளான ‘அவளுக்காக’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיְהִי לוֹ
  choice: ஆபிராமுக்கு ... கிடைத்தன
  rationale: ‘அவனுக்கு உண்டாயின’ என்ற எபிரெய மரபுத்தொடர், விளைவாக உடைமைகள் வந்துசேர்ந்ததைக் குறிக்கிறது. ‘கிடைத்தன’ என்பது அந்தக் கதைநடை மாற்றத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; தெளிவுக்காக ஆபிராமின் பெயர் மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
- source_word: צֹאן
  choice: ஆடுகள்
  rationale: இது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய சிறுகால்நடைக் கூட்டுப்பெயர். தமிழில் இருவகையையும் பொதுவாகக் குறிக்கக்கூடிய ‘ஆடுகள்’ இயல்பான இணைச்சொல்.
- source_word: בָקָר
  choice: மாடுகள்
  rationale: மாட்டினத்தைக் கூட்டாகக் குறிக்கும் சொல்லுக்கு இயல்பான நவீனத் தமிழ் இணைச்சொல்.
- source_word: חֲמֹרִים
  choice: ஆண் கழுதைகள்
  rationale: ஆண்பால் பன்மை வடிவம்; பின்னர் வரும் பெண் கழுதைகளிலிருந்து வேறுபாட்டைக் காக்கிறது.
- source_word: עֲבָדִים
  choice: ஆண் அடிமைகள்
  rationale: உடைமைகளின் பட்டியலில் இச்சொல் சுதந்திரமற்ற அடிமை நிலையைக் குறிக்கிறது. அடுத்த பெண்பால் சொல்லுடனான வேறுபாட்டையும் ‘ஆண்’ காக்கிறது.
- source_word: שְׁפָחֹת
  choice: பெண் அடிமைகள்
  rationale: பெண்பால் அடிமைகளைத் தெளிவாகவும் சமூக நிலையை மறைக்காமலும் குறிக்கிறது.
- source_word: אֲתֹנֹת
  choice: பெண் கழுதைகள்
  rationale: பெண் கழுதைகளைச் சுட்டும் குறிப்பிட்ட பன்மைச் சொல்லின் பாலின வேறுபாட்டைக் காக்கிறது.
- source_word: גְמַלִּים
  choice: ஒட்டகங்கள்
  rationale: மூலப் பன்மைச் சொல்லுக்கான வழக்கமான நேரடி தமிழ் இணைச்சொல்.
