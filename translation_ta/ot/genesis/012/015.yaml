source:
  edition: WLC
  text: וַ/יִּרְא֤וּ אֹתָ/הּ֙ שָׂרֵ֣י פַרְעֹ֔ה וַ/יְהַֽלְל֥וּ אֹתָ֖/הּ אֶל פַּרְעֹ֑ה וַ/תֻּקַּ֥ח הָ/אִשָּׁ֖ה בֵּ֥ית פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/015.yaml
  text: When Pharaoh’s officials saw her[a], they praised her to Pharaoh[b], and the woman was taken into Pharaoh’s house.
translation:
  language: ta
  text: பார்வோனின் அதிகாரிகள் அவளைப் பார்த்தபோது, அவளைப் பற்றிப் பார்வோனிடம் புகழ்ந்து பேசினார்கள்[a]. அந்தப் பெண் பார்வோனின் வீட்டுக்குக்[b] கொண்டு செல்லப்பட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவளைப் பார்வோனுக்குப் பரிந்துரைத்தார்கள்’ / ‘அவளைப் பற்றிப் பார்வோனிடம் நல்லவிதமாகப் பேசினார்கள்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘வீடு.’ இது வெறும் கட்டடத்தை மட்டுமல்லாமல், பார்வோனின் அரச குடும்பத்தாரையும் அரண்மனைச் சூழலையும் குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי פַרְעֹה
  choice: பார்வோனின் அதிகாரிகள்
  rationale: שָׂרִים என்பது ஆட்சியாளர்கள், உயரதிகாரிகள் அல்லது பிரபுக்களைக் குறிக்கலாம். அரசவையின் இச்சூழலில் ‘அதிகாரிகள்’ என்பது அரசகுமாரர்கள் என்ற தேவையற்ற பொருளை உண்டாக்காமல் அவர்களுடைய உயர்நிலையை இயல்பாகக் காட்டுகிறது.
- source_word: וַיְהַלְלוּ אֹתָהּ אֶל־פַּרְעֹה
  choice: அவளைப் பற்றிப் பார்வோனிடம் புகழ்ந்து பேசினார்கள்
  rationale: הלל என்பதன் பியேல் வடிவம் இங்கே புகழ்தல் அல்லது ஒருவரைக் குறித்து நன்றாக எடுத்துரைத்தல் எனப் பொருள்படும். ‘புகழ்ந்து பேசினார்கள்’ என்பது அந்தச் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘அவளைப் பற்றி’ மற்றும் ‘பார்வோனிடம்’ என்பவை பொருளையும் கேட்பவரையும் தெளிவாக்குகின்றன.
- source_word: וַתֻּקַּח
  choice: கொண்டு செல்லப்பட்டாள்
  rationale: எபிரெய வினைச்சொல் செயப்படுபொருள் வடிவில் இருப்பதால், செய்பவர் யார் என்று வெளிப்படையாகக் கூறாமல் அந்தப் பெண்ணின் செயலற்ற நிலையை இத்தேர்வு காக்கிறது.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: எபிரெய உரை நேரடியாக ‘அந்தப் பெண்’ என்றே கூறுகிறது. இங்கே ‘மனைவி’ என்று மொழிபெயர்ப்பது சூழலிலிருந்து கிடைக்கும் தகவலைச் சொற்பொருளுக்குள் சேர்த்துவிடும்.
- source_word: בֵּית פַּרְעֹה
  choice: பார்வோனின் வீட்டுக்கு
  rationale: בַּיִת என்பது வீடு அல்லது வீட்டார்/அரச குடும்ப அமைப்பு ஆகிய இரண்டையும் குறிக்கக்கூடும். ‘வீடு’ மூலத்தின் சொல்லாட்சியைப் பாதுகாக்கிறது; ‘அரண்மனை’ என்பது அதிக விளக்கமளிக்கும் மொழிபெயர்ப்பாகிவிடும்.
- source_word: וַיִּרְאוּ אֹתָהּ
  choice: அவளைப் பார்த்தபோது
  rationale: ראה என்பது வழக்கமான ‘பார்/காண்’ என்ற வினைச்சொல். தொடர்ச்சியான எபிரெயக் கதையாடலை இயல்பான தமிழில் காலத் துணைவாக்கியமாக வழங்கப்பட்டுள்ளது.
