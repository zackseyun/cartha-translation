translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் செயப்படுபொருள் அமைப்பும் ‘அந்தப் பெண்’ என்ற குறிப்பிடலும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களின் அருகே வைக்கப்பட்டுள்ளன.
