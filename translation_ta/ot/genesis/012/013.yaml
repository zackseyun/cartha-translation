  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வேண்டுகோளின் மென்மை, நோக்கம்/விளைவு உறவு, நெருங்கிய பொருளுடைய இரு காரணச் சொற்றொடர்களின் மறுவலியுறுத்தல் ஆகியவை பேணப்பட்டுள்ளன.
