  to: “நீ என் சகோதரி என்று தயவுசெய்து சொல்; உன்னால் எனக்கு நன்மை உண்டாகவும், உன் காரணமாக என் உயிர் பிழைக்கவும்.”
  rationale: The revision replaces the result connective with a Tamil purpose construction, preserving the force of לְמַעַן while retaining the source's two related causal expressions and its nontechnical sense of נֶפֶשׁ as Abram's life/self. Footnote markers and content are retained unchanged.
