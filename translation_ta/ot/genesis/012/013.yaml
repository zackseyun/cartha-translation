  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אִמְרִי נָ֖א אֲחֹ֣תִ/י אָ֑תְּ לְמַ֨עַן֙ יִֽיטַב לִ֣/י בַ/עֲבוּרֵ֔/ךְ וְ/חָיְתָ֥ה נַפְשִׁ֖/י בִּ/גְלָלֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/013.yaml
  text: Please say that you are my sister[a], so that it may go well with me because of you[b], and my life may be spared on your account.
translation:
  language: ta
  text: “நீ என் சகோதரி என்று தயவுசெய்து சொல்; உன்னால் எனக்கு நன்மை உண்டாகவும், உன் காரணமாக என் உயிர் பிழைக்கவும்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: தயவுசெய்து சொல்
  rationale: பெண்பால் ஒருமை கட்டளையுடன் வரும் נָא வேண்டுகோளின் மென்மையையும் அவசரத்தையும் உணர்த்துகிறது. நவீனத் தமிழில் ‘தயவுசெய்து சொல்’ இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: אֲחֹתִי אָתְּ
  choice: நீ என் சகோதரி
  rationale: சாராயை ஆபிராமின் சகோதரியாக அடையாளப்படுத்தும் நேரடியான பயனிலைத் தொடர். ‘என்று’ என்பது ‘சொல்’ என்பதோடு இணைக்கத் தமிழில் இயல்பாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: לְמַעַן
  choice: அதனால்
  rationale: இங்கு நோக்கத்தையும் எதிர்பார்க்கப்படும் விளைவையும் அறிமுகப்படுத்துகிறது. முன் கூறிய வேண்டுகோளுக்கும் அதன் இரு எதிர்பார்க்கப்பட்ட விளைவுகளுக்கும் உள்ள தொடர்பை ‘அதனால்’ தெளிவாகக் காட்டுகிறது.
- source_word: יִיטַב לִי
  choice: எனக்கு நன்மை ஏற்படும்
  rationale: ‘எனக்கு நன்றாக இருக்கும்/நன்மை உண்டாகும்’ என்ற எபிரெய மரபுத்தொடரின் பரந்த பொருளைப் பேணுகிறது; ஆபிராம் எவ்விதமாக நன்மை பெறுவார் என்பதை அளவுக்கு மீறிக் குறிப்பதில்லை.
- source_word: בַּעֲבוּרֵךְ
  choice: உன்னால்
  rationale: சாராயின் காரணமாக அல்லது அவள் வழியாக ஆபிராமுக்கு நன்மை ஏற்படும் என்பதைக் குறிக்கும் இயல்பான தமிழாக்கம்.
- source_word: וְחָיְתָה נַפְשִׁי
  choice: என் உயிரும் பிழைக்கும்
  rationale: נֶפֶשׁ இங்கு உடலிலிருந்து வேறான ‘ஆத்துமா’வை மட்டும் குறிக்காமல் ஆபிராமின் உயிரை அல்லது அவரையே குறிக்கிறது. ‘உயிர் பிழைக்கும்’ என்பது உயிரோடு காக்கப்படுதல் என்ற சூழ்நிலைப் பொருளை இயல்பாகத் தருகிறது.
- source_word: בִּגְלָלֵךְ
  choice: உன் காரணமாக
  rationale: முந்தைய בַּעֲבוּרֵךְ என்பதற்கு நெருங்கிய காரணப் பொருளுடைய இரண்டாவது சொற்றொடர். வேறுபட்ட இயல்பான சொல்லாட்சியால் எபிரெயத்தின் மறுபடியும் வலியுறுத்துதலைப் பேணுகிறது.
