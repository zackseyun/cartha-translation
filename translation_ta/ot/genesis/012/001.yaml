  source_fidelity: மூல எபிரெயத்தின் யாவே என்ற தனிப்பட்ட இறைப்பெயர், ஆபிராமிடம் கூறப்பட்ட கட்டளை, மற்றும் ‘நாடு—உறவினர்—தந்தையின் வீடு’ என்ற மூவகைப் பிரிவு அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘விட்டுப் புறப்பட்டு … போ’ என்பது לֶךְ־לְךָ என்ற வலியுறுத்தலுள்ள புறப்பாட்டுக் கட்டளையை இயல்பாக வெளிப்படுத்துகிறது. מִמּוֹלַדְתְּךָ என்பதற்கான ‘உறவினர்’ தேர்வு ஆங்கில POB-இன் ‘kindred’ உடனும் சூழலுடனும் பொருந்துகிறது.
