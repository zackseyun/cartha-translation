  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל אַבְרָ֔ם לֶךְ לְ/ךָ֛ מֵ/אַרְצְ/ךָ֥ וּ/מִ/מּֽוֹלַדְתְּ/ךָ֖ וּ/מִ/בֵּ֣ית אָבִ֑י/ךָ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר אַרְאֶֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/001.yaml
  text: Yahweh said to Abram, “Go out from your land, from your kindred, and from your father’s house to the land that I will show you.”
translation:
  language: ta
  text: யாவே ஆபிராமிடம், “உன் நாட்டையும் உன் உறவினரையும் உன் தந்தையின் வீட்டையும் விட்டுப் புறப்பட்டு, நான் உனக்குக் காட்டும் நாட்டுக்குப் போ” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைப்பெயரை ‘ஆண்டவர்’ என்ற பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: לֶךְ־לְךָ
  choice: விட்டுப் புறப்பட்டு … போ
  rationale: இந்த எபிரெய கட்டளைச் சொற்றொடர் உறுதியான தனிப்பட்ட புறப்பாட்டைக் குறிக்கிறது; இயல்பான தமிழில் அதன் இயக்கமும் கட்டளையின் வலிமையும் காக்கப்பட்டுள்ளன.
- source_word: מִמּוֹלַדְתְּךָ
  choice: உன் உறவினரையும்
  rationale: இச்சூழலில் இந்தச் சொல் பிறந்த இடத்தை மட்டுமல்ல, ஒருவரின் இனக்குழு அல்லது உறவினர் வட்டத்தையும் குறிக்கலாம்; நிலம்–உறவினர்–தந்தையின் வீடு என்ற படிப்படியான பிரிவுக்கு ‘உறவினர்’ பொருந்துகிறது.
- source_word: בֵּית אָבִיךָ
  choice: உன் தந்தையின் வீட்டையும்
  rationale: குடும்பக் குழுவையும் குடும்ப இல்லத்தையும் உள்ளடக்கக்கூடிய மூல உருவகத்தை அப்படியே காக்கிறது.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: אֶרֶץ என்பதற்கு இச்சூழலில் இலக்காகக் காட்டப்படும் நிலப்பரப்பைக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: אַרְאֶךָּ
  choice: நான் உனக்குக் காட்டும்
  rationale: மூலத்தின் முதலாம் நபர் வாக்குறுதியையும் இன்னும் அடையாளம் காட்டப்படாத இலக்கையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: நான்கெழுத்து இறைப்பெயர் (Tetragrammaton)
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் வெளிப்படையாக இருப்பதால் அதை பொதுப் பட்டமாக மறைக்காமல் வழங்குகிறது.
- issue: ஆபிராமுக்குக் கொடுக்கப்பட்ட அழைப்பின் கட்டளைத் தன்மை
  choice: ‘விட்டுப் புறப்பட்டு … போ’ என்ற நேரடி கட்டளை
  alternative: ‘நீ செல்ல வேண்டும்’ என்ற மறைமுக வடிவம்
  rationale: எபிரெய வினை கட்டளை வடிவில் இருப்பதைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் மூன்று பிரிவுகள்—நாடு, உறவினர், தந்தையின் வீடு—வரிசையாகப் பாதுகாக்கப்பட்டுள்ளன.
