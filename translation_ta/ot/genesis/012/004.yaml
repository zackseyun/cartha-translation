  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ אַבְרָ֗ם כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר אֵלָי/ו֙ יְהוָ֔ה וַ/יֵּ֥לֶךְ אִתּ֖/וֹ ל֑וֹט וְ/אַבְרָ֗ם בֶּן חָמֵ֤שׁ שָׁנִים֙ וְ/שִׁבְעִ֣ים שָׁנָ֔ה בְּ/צֵאת֖/וֹ מֵ/חָרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/004.yaml
  text: So Abram went, just as Yahweh had spoken to him, and Lot went with him. Abram was seventy-five years old when he departed from Haran.
translation:
  language: ta
  text: யாவே ஆபிராமிடம் கூறியபடியே ஆபிராம் சென்றார்; லோத்தும் அவருடன் சென்றார். ஆபிராம் ஆரானிலிருந்து புறப்பட்டபோது எழுபத்தைந்து வயதுடையவராக இருந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: புறப்பட்டுச் சென்றார்
  rationale: הלך என்பதன் தொடர்கதை வடிவம் கடந்தகால நகர்வைக் குறிக்கிறது. சூழலில் பயணத்தைத் தொடங்கியதை இயல்பாகத் தெரிவிக்க ‘புறப்பட்டுச் சென்றார்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: כַּאֲשֶׁר
  choice: கூறியபடியே
  rationale: ஆபிராமின் செயல் யெகோவா முன்பு கூறியதற்கு இணங்க இருந்ததை இந்தச் சொல் காட்டுகிறது; தமிழில் ‘கூறியபடியே’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: דִּבֶּר אֵלָיו
  choice: தன்னிடம் கூறிய
  rationale: யெகோவா ஆபிராமிடம் முன்பு உரைத்ததைத் தமிழ் சார்புவாக்கிய அமைப்பில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான יהוה என்பதை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான ‘யெகோவா’ என்று தருகிறது.
- source_word: אִתּוֹ
  choice: அவருடன்
  rationale: உடன்சென்ற உறவைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בֶּן חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה
  choice: அவருக்கு எழுபத்தைந்து வயது
  rationale: ‘ஐந்தும் எழுபதும் ஆண்டுகளின் மகன்’ என்ற எபிரெய வயது மரபுத்தொடரின் பொருளை நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: בְּצֵאתוֹ
  choice: புறப்பட்டபோது
  rationale: בְ + יצא இறந்தெச்ச அமைப்பு புறப்பட்ட நேரத்தைக் குறிக்கிறது; ‘புறப்பட்டபோது’ அதனைத் தெளிவாகக் காட்டுகிறது.
- source_word: מֵחָרָן
  choice: ஆரானிலிருந்து
  rationale: מִן முன்னொட்டு ‘இலிருந்து’ என மொழிபெயர்க்கப்பட்டு, חָרָן என்ற இடப்பெயர் தமிழில் வழக்கமான ‘ஆரான்’ என ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் பட்டமல்லாமல் நான்கு எழுத்துகளாலான தனிப்பெயர் நேரடியாக உள்ளது. அதன் தனிப்பெயர் தன்மையைப் பாதுகாக்கத் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ பயன்படுத்தப்பட்டது; ‘யாவே’ என்பது மூல உச்சரிப்பை மீட்டமைக்கும் மற்றொரு ஏற்ற ஒலிபெயர்ப்பு.
translation_notes:
  register: நவீன செந்தமிழ் நடை; சாதாரண வாசகருக்குப் புரியும் வகையில் மரியாதை விகுதிகளுடன் அமைக்கப்பட்டுள்ளது. தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன.
