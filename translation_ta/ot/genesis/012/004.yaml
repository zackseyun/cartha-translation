revisions:
- from: யெகோவா தன்னிடம் கூறியபடியே ஆபிராம் புறப்பட்டுச் சென்றார்; லோத்தும் அவருடன் சென்றார். ஆபிராம் ஆரானிலிருந்து புறப்பட்டபோது அவருக்கு எழுபத்தைந்து வயது.
  to: யாவே ஆபிராமிடம் கூறியபடியே ஆபிராம் சென்றார்; லோத்தும் அவருடன் சென்றார். ஆபிராம் ஆரானிலிருந்து புறப்பட்டபோது எழுபத்தைந்து வயதுடையவராக இருந்தார்.
  rationale: The revision changes only the divine-name transliteration to align with the POB audit trail, makes the recipient of Yahweh's speech explicit, and uses an idiomatic Tamil age expression. It retains the Hebrew narrative sequence, Lot's accompaniment, and the temporal connection of Abram's age with his departure from Haran.
