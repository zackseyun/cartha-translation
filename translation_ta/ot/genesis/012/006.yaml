source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר אַבְרָם֙ בָּ/אָ֔רֶץ עַ֚ד מְק֣וֹם שְׁכֶ֔ם עַ֖ד אֵל֣וֹן מוֹרֶ֑ה וְ/הַֽ/כְּנַעֲנִ֖י אָ֥ז בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/006.yaml
  text: Abram passed through the land as far as the place of Shechem[a], as far as the oak of Moreh[b]. Now the Canaanite was then in the land.
translation:
  language: ta
  text: ஆபிராம் அந்த நாட்டைக் கடந்து, சீகேம் என்னும் இடம்வரை, மோரேயின் பெருமரம்வரை[a] சென்றார். அப்போது கானானியர் அந்த நாட்டில் இருந்தனர்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெருமரம்’ என்பதற்கான எபிரெயச் சொல் ஒரு பெரிய மரத்தைக் குறிக்கிறது; அது கருவாலி மரமா, டெரிபிந்த் மரமா என்பது உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘கானானியன் அப்போது அந்த நாட்டில் இருந்தான்’ என்று ஒருமை வடிவம் உள்ளது; அது கானானிய மக்களை ஒட்டுமொத்தமாகக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: வழியாகச் சென்று
  rationale: עבר என்பதன் தொடர்கதை வடிவம், ஆபிராம் நாட்டினூடே பயணித்ததைச் சொல்கிறது; பயண முறையையோ பாதையையோ தேவையின்றி குறிப்பாக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: בָּאָרֶץ
  choice: அந்த நாட்டின் வழியாக / அந்த நாட்டில்
  rationale: குறிப்புச் சுட்டியுடன் வரும் இச்சொல் சூழலில் கானான் நாட்டைக் குறிக்கிறது. இரண்டாம் இடத்திலும் மீளுரையை இயன்றவரை பேணுகிறது.
- source_word: עַד מְקוֹם שְׁכֶם
  choice: சீகேம் என்னும் இடம்வரைக்கும்
  rationale: מקום என்ற பொதுப்பெயரையும் சீகேம் என்ற இடப்பெயரையும் பேணி, பின்னாளைய முழுவளர்ச்சி பெற்ற நகரைத் தேவையின்றி முன்கூட்டியே கருதாத இயல்பான தமிழ் வடிவம்.
- source_word: אֵלוֹן מוֹרֶה
  choice: மோரேயின் பெருமரம்
  rationale: אֵלוֹן ஒரு பெரிய மரத்தைக் குறிக்கிறது; அதன் துல்லியமான மரவகை உறுதியற்றதால் ‘கருவாலி’ அல்லது ‘டெரிபிந்த்’ என முதன்மை உரையில் குறிப்பாக்காமல் ‘பெருமரம்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: מוֹרֶה
  choice: மோரே
  rationale: இங்கு மரத்துடன் தொடர்புடைய தனிப்பெயராக எடுத்துக்கொண்டு ஒலிபெயர்க்கப்படுகிறது; ‘போதகர்’ அல்லது ‘குறிசொல்பவர்’ போன்ற உறுதியற்ற பொருளை உரைக்குள் புகுத்தவில்லை.
- source_word: וְהַכְּנַעֲנִי
  choice: கானானியர்
  rationale: எபிரெயத்தில் ஒருமை இனப்பெயர் கூட்டுப்பொருளில் வருகிறது. தமிழில் மரியாதை/பொதுப்பன்மை வடிவமான ‘கானானியர்’ அந்த மக்களினத்தின் இருப்பை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אָז
  choice: அப்போது
  rationale: கதையில் அந்தக் காலநிலையைச் சுட்டும் காலவினையடை; நவீன தமிழில் தெளிவான இணை.
theological_decisions:
- issue: וְהַכְּנַעֲנִי என்பதிலுள்ள இனப்பெயரின் எண்
  choice: கூட்டுப்பொருளில் ‘கானானியர் ... இருந்தனர்’
  alternative: வடிவரீதியான ஒருமையாக ‘கானானியன் ... இருந்தான்’
  rationale: எபிரெய ஒருமை இனப்பெயர் ஒரு மக்களினத்தை கூட்டாகக் குறிக்க முடியும். தமிழில் ஒருமையை அப்படியே வைத்தால் ஒரே நபரைக் குறிக்கும் தவறான எண்ணம் உருவாகலாம்; ஆகவே கூட்டுப்பொருள் முதன்மை உரையில் தரப்பட்டு, மூலத்தின் ஒருமை அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வரைக்கும்’ என்ற இரட்டிப்பு மூலத்தின் இருமுறை வரும் עַד அமைப்பைப் பேணுகிறது. மரவகையின் உறுதியின்மையும் இனப்பெயரின் ஒருமை-கூட்டுப்பொருள் பதற்றமும் அடிக்குறிப்புகளில் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
