revisions:
- from: ஆபிராம் அந்த நாட்டின் வழியாகச் சென்று, சீகேம் என்னும் இடம்வரைக்கும், மோரேயின் பெருமரம்வரைக்கும் சென்றார்.[a] அப்போது கானானியர் அந்த நாட்டில் இருந்தனர்.[b]
