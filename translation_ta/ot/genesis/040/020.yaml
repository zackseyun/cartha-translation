  yaml_path: translation/ot/genesis/040/020.yaml
  text: And on the third day[a], Pharaoh’s birthday, he made a feast for all his servants, and he lifted up the head of the chief cupbearer and the head of the chief baker among his servants.
translation:
  language: ta
  text: மூன்றாம் நாளில், பார்வோனின் பிறந்தநாளன்று, பார்வோன் தன் பணியாளர்கள் அனைவருக்கும் விருந்து வைத்தான். தன் பணியாளர்களின் நடுவில், பானம் பரிமாறுவோரின் தலைவனின் தலையையும் அப்பம் சுடுவோரின் தலைவனின் தலையையும் அவன் உயர்த்தினான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பொருளை விளக்கிக் கூறினால், “அவர்களுக்குத் தனிப்பட்ட கவனம் செலுத்தினான்” அல்லது “அவர்களைக் கணக்கில் எடுத்துக்கொண்டான்.” எபிரெயத்தில் சொல்லுக்குச் சொல், “...தலையை உயர்த்தினான்” என்று உள்ளது. இந்த இரு அதிகாரிகளுக்கும் வெவ்வேறு முடிவுகள் நேர்வதைச் சுற்றியுள்ள நிகழ்ச்சி இதே சொல்லாட்சியைப் பயன்படுத்துவதால், அது இங்கே பாதுகாக்கப்பட்டுள்ளது.
