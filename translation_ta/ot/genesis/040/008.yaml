  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֔י/ו חֲל֣וֹם חָלַ֔מְנוּ וּ/פֹתֵ֖ר אֵ֣ין אֹת֑/וֹ וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יוֹסֵ֗ף הֲ/ל֤וֹא לֵֽ/אלֹהִים֙ פִּתְרֹנִ֔ים סַפְּרוּ נָ֖א לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/008.yaml
  text: They said to him[a], “We have dreamed a dream, and there is no one to interpret it.” Joseph said to them[b], “Do not interpretations belong to God? Please tell them to me.”
translation:
  language: ta
  text: அவர்கள் அவனிடம், “நாங்கள் கனவு கண்டோம்[a]; ஆனால் அதற்கு விளக்கம் அளிக்க யாரும் இல்லை” என்றார்கள். யோசேப்பு அவர்களிடம், “விளக்கங்கள் கடவுளுக்குரியவை அல்லவா? தயவுசெய்து என்னிடம் சொல்லுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லமைப்பு, “ஒரு கனவைக் கனவு கண்டோம்” என்று நேரடியாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲלוֹם חָלַמְנוּ
  choice: நாங்கள் கனவு கண்டோம்
  rationale: எபிரேயத்தில் ஒரே வேர்ச்சொல்லைக் கொண்ட பெயரும் வினையும் சேர்ந்து வரும் வலியுறுத்தல் அமைப்பு உள்ளது. தமிழில் இயல்பான ‘கனவு கண்டோம்’ என்ற சொற்றொடர் அதைத் தெளிவாகத் தருகிறது; ஒரே கனவை இருவரும் பகிர்ந்து கண்டார்கள் என்று தேவையின்றி உணர்த்துவதையும் தவிர்க்கிறது.
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: ஆனால் அதற்கு விளக்கம் அளிக்க யாரும் இல்லை
  rationale: פֹתֵר என்பது ‘விளக்குபவர்’ என்ற செய்பெயர் வடிவம். தமிழில் ‘விளக்கம் அளிக்க யாரும் இல்லை’ என்பது விளக்குபவர் கிடைக்கவில்லை என்ற பொருளை இயல்பாகப் பாதுகாக்கிறது. இணைப்பின் சூழ்நிலைச் சார்ந்த எதிர்மறைத் தொடர்பை ‘ஆனால்’ வெளிப்படுத்துகிறது.
- source_word: הֲלוֹא
  choice: அல்லவா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் எபிரேய வினாத்துகளின் சொல்லாற்றலைத் தமிழின் இயல்பான ‘அல்லவா?’ காக்கிறது.
- source_word: לֵאלֹהִים פִּתְרֹנִים
  choice: விளக்கங்கள் கடவுளுக்குரியவை
  rationale: לְ குறிக்கும் உடைமை அல்லது மூலச்சார்பை ‘கடவுளுக்குரியவை’ எனத் தருகிறது. פִּתְרֹנִים பன்மையில் இருப்பதால் ‘விளக்கங்கள்’ என்ற பன்மை பாதுகாக்கப்படுகிறது.
- source_word: סַפְּרוּ נָא לִי
  choice: தயவுசெய்து என்னிடம் சொல்லுங்கள்
  rationale: סַפְּרוּ என்பது பன்மை ஏவல்; נָא வேண்டுகோளின் மென்மையைச் சேர்க்கிறது. எபிரேயத்தில் சொல்லப்பட வேண்டிய பொருள் வெளிப்படையாக இல்லாததால், தமிழிலும் ‘அதை/அவற்றை’ என்று எண்ணைத் தீர்மானிக்காமல் விடப்பட்டுள்ளது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்.
theological_decisions:
- issue: אֱלֹהִים என்பதன் குறிப்பு
  choice: கடவுள்
  alternative: ஒரு தெய்வம் / தெய்வங்கள்
  rationale: யோசேப்புக் கதையின் சூழலில் கனவுகளுக்கு விளக்கம் தரும் அதிகாரமும் திறனும் உண்மையான கடவுளுக்குரியது என யோசேப்பு கூறுகிறான். இங்கு பன்மதத் தெய்வங்களைப் பற்றிய பொதுவான கூற்று நோக்கமல்ல.
- issue: கனவு விளக்கங்களுக்கும் கடவுளுக்கும் உள்ள தொடர்பு
  choice: விளக்கங்கள் கடவுளுக்குரியவை
  alternative: கடவுள் விளக்கங்களைத் தருகிறார்
  rationale: மூலத்தின் לְ அமைப்பு உடைமை, உரிமை அல்லது மூலச்சார்பு ஆகிய நுணுக்கங்களைத் தாங்கக்கூடும். ‘கடவுளுக்குரியவை’ என்பது இந்தத் திறந்த நுணுக்கத்தைப் பாதுகாக்கிறது; கடவுள் அவற்றை எவ்வாறு அளிக்கிறார் என்பதை மேலதிகமாகத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. உரையாடலின் எளிமை காக்கப்பட்டு, எபிரேயத்தின் வினாவடிவமும் ‘விளக்கங்கள்’ என்ற பன்மையும் பாதுகாக்கப்பட்டுள்ளன.
