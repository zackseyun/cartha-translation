  source_fidelity: 'The Tamil accurately conveys the Hebrew: the cognate expression for dreaming is naturally rendered as “கனவு கண்டோம்”; the absence of an available interpreter is preserved; Joseph’s rhetorical question retains the plural “விளக்கங்கள்” and the possessive/source nuance “கடவுளுக்குரியவை”; and the polite plural imperative is appropriately rendered. The unexpressed object of “சொல்லுங்கள்” rightly remains unforced, as in the Hebrew.'
