  terminology: “யோசேப்பு” follows established Tamil biblical name usage. “கடவுள்” is contextually warranted for אֱלֹהִים in Joseph’s speech, and “விளக்கங்கள்” preserves the Hebrew plural without importing a doctrinal interpretation.
