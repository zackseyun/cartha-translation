translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு விளங்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘குழி’ என்ற எபிரெய உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, சூழல்சார் சிறைப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
