base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/015.yaml
  text: For I was indeed kidnapped from the land of the Hebrews[b][a], and even here I have done nothing that they should put me in the pit.
translation:
  language: ta
  text: ஏனெனில், நான் நிச்சயமாக எபிரெயர்களின் நாட்டிலிருந்து கடத்தப்பட்டேன்[a]. இங்கேயும்கூட, என்னை இந்தக் குழியில்[b] போடுவதற்கான எந்தச் செயலையும் நான் செய்யவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நான் நிச்சயமாகத் திருடப்பட்டேன்’ அல்லது ‘நான் திருடிச் செல்லப்பட்டேன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் வினையின் முழுவடிவம் வினைமுற்றுடன் சேர்ந்து இச்செயலை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: இச்சூழலில் ‘குழி’ என்பது நிலவறைச் சிறையையோ சிறைக்கூண்டையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: யோசேப்பு தன் வேண்டுகோளுக்கான காரணத்தை விளக்குவதால், இங்கு இச்சொல்லின் காரணவிளக்கப் பொருள் இயல்பாக வெளிப்படுகிறது.
- source_word: גֻנֹּב גֻּנַּבְתִּי
  choice: நான் நிச்சயமாகக் கடத்திக்கொண்டு வரப்பட்டேன்
  rationale: வினையெச்ச முழுவடிவமும் வினைமுற்றும் இணைந்து செயப்பாட்டு வினையை வலியுறுத்துகின்றன. ஒருவரை வலுக்கட்டாயமாக எடுத்துச் சென்றதைக் ‘கடத்திக்கொண்டு வரப்பட்டேன்’ தெளிவாகக் கூறுகிறது; ‘நிச்சயமாக’ எபிரெய வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: מֵאֶרֶץ הָעִבְרִים
  choice: எபிரெயர்களின் நாட்டிலிருந்து
  rationale: இனக்குழுப் பெயரையும் ‘நாடு’ என்ற பொதுவான இடக்குறிப்பையும் தக்கவைத்து, இதைத் துல்லியமான அரசியல் எல்லையுள்ள நாடாக மிகையாக விளக்கவில்லை.
- source_word: וְגַם פֹּה
  choice: இங்கேயும்கூட
  rationale: தான் கடத்தப்பட்டதோடு, எகிப்திலும் குற்றமற்றவன் என்ற சேர்க்கை வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא עָשִׂיתִי מְאוּמָה
  choice: நான் எதுவும் செய்யவில்லை
  rationale: முற்றிலுமான மறுப்பை எளிய, இயல்பான நவீன தமிழில் தருகிறது.
- source_word: כִּי שָׂמוּ אֹתִי
  choice: என்னை … போடுவதற்கு உரியதாக
  rationale: சிறையில் அடைக்கத் தகுந்த காரணமான செயல் எதையும் யோசேப்பு செய்யவில்லை என்பதைக் காட்டுகிறது; எபிரெய இணைப்பின் காரண/விளைவு நெகிழ்வை தேவையின்றி மிகத் துல்லியப்படுத்தவில்லை.
- source_word: בַּבּוֹר
  choice: இந்தக் குழியில்
  rationale: בּוֹר என்பதன் நேரடியான ‘குழி’ என்ற உருவகத்தைப் பாதுகாக்கிறது; சூழலில் அது நிலவறைச் சிறையையோ சிறைக்கூண்டையோ குறிக்கலாம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
