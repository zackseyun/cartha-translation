  yaml_path: translation/ot/genesis/040/003.yaml
  text: And he put them in custody in the house of the captain of the guard[a], in the prison house[c][b], the place where Joseph was confined.
translation:
  language: ta
  text: அவர் அவர்களை மெய்க்காவலர் தலைவனின்[a] வீட்டிலுள்ள சிறைச்சாலையில்[b] காவலில் வைத்தார்; அது யோசேப்பு அடைக்கப்பட்டிருந்த இடம்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மெய்க்காவலர் தலைவன்’ என்பதற்கான எபிரெயச் சொற்றொடரை இன்னும் சொற்பொருளோடு ‘தண்டனை நிறைவேற்றுபவர்களின் தலைவர்’ அல்லது ‘வெட்டுபவர்களின் தலைவர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘சிறைக்கூடத்தின் வீடு’ எனும் சொற்றொடர் உள்ளது; இயல்பாக, ‘சிறைச்சாலை’ என்று மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெய இடவியல் தொடரை, ‘அவர் அவர்களை மெய்க்காவலர் தலைவனின் வீட்டில் காவலில் வைத்து, சிறைச்சாலைக்குள் வைத்தார்; அது யோசேப்பு அடைக்கப்பட்டிருந்த இடம்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וַיִּתֵּן אֹתָם בְּמִשְׁמַר
  choice: அவர் அவர்களைக் காவலில் வைத்து
  rationale: נתן என்பது இங்கு ‘கொடுத்தார்’ என்ற நேரடிப் பொருளில் அல்லாமல், ஒருவரைக் காவலில் வைப்பதைக் குறிக்கிறது. מִשְׁמָר என்பதன் காவல்/தடுப்புக்காவல் பொருளை ‘காவலில்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: மெய்க்காவலர் தலைவனின் வீடு
  rationale: שַׂר הַטַּבָּחִים என்பதன் சொற்பிறப்பில் கொலை செய்பவர்கள் அல்லது தண்டனை நிறைவேற்றுபவர்களின் தலைவர் என்ற நிழற்பொருள் இருந்தாலும், எகிப்திய அரசவையின் அதிகாரப் பதவியாக இச்சூழலில் ‘மெய்க்காவலர் தலைவன்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֶל בֵּית הַסֹּהַר
  choice: சிறைச்சாலைக்குள் அனுப்பினார்
  rationale: אֶל என்பதன் இலக்கு அல்லது உள்நோக்கிய இயக்கத்தை ‘-க்குள்’ காட்டுகிறது; בֵּית הַסֹּהַר என்பது சிறையைச் சுட்டும் நிலையான எபிரெயச் சொற்றொடர். தமிழில் செயல்வாக்கியம் இயல்பாக அமைய ‘அனுப்பினார்’ சேர்க்கப்பட்டுள்ளது; இது அவர்களை அந்தச் சிறைக்குள் கொண்டுசென்று வைத்த செயலை வெளிப்படுத்துகிறது.
- source_word: מְקוֹם אֲשֶׁר יוֹסֵף אָסוּר שָׁם
  choice: யோசேப்பு அடைக்கப்பட்டிருந்த இடம் அதுவே
  rationale: אָסוּר என்பதற்கு ‘கட்டப்பட்ட’ என்றும் ‘சிறையில் அடைக்கப்பட்ட’ என்றும் பொருள் உண்டு. சிறைச் சூழலில் ‘அடைக்கப்பட்டிருந்த’ என்பது இயல்பானது; שָׁם என்ற ‘அங்கே’ என்னும் கருத்து ‘இடம் அதுவே’ என்பதில் அடங்கியுள்ளது.
theological_decisions:
- issue: சிறைச்சாலைக்கும் மெய்க்காவலர் தலைவனின் வீட்டுக்கும் உள்ள தொடரியல் உறவு
  choice: வீட்டில் காவலில் வைத்து, சிறைச்சாலைக்குள் அனுப்பினார்
  alternative: மெய்க்காவலர் தலைவனின் வீட்டிலுள்ள சிறைச்சாலையில் காவலில் வைத்தார்
  rationale: எபிரெயத்தில் בְּ (‘இல்’) என்பதற்குப் பின் אֶל (‘நோக்கி/உள்ளே’) வருகிறது. சிறை அந்த வீட்டின் ஓர் அங்கம் என்று முற்றிலும் தீர்மானித்துவிடாமல், இரு இடவியல் கூறுகளையும் முதன்மை உரை தனித்தனியாக வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. முந்தைய வசனத்தில் வரும் பார்வோனைச் சுட்டும் ஒருமை ஆண்பால் வினையெச்சம் மரியாதை ஒருமையான ‘அவர்/அனுப்பினார்’ என்று வழங்கப்பட்டுள்ளது. எபிரெய இடவியல் தொடரின் சிறிய தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
