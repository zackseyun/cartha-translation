translation:
  language: ta
  text: திராட்சைக்கொடியில் மூன்று கிளைகள் இருந்தன.[a] அது துளிர்க்கும்போதே, அதன் பூக்கள் வெளிவந்தன.[b] அதன் குலைகள் பழுத்துத் திராட்சைப்பழங்களாயின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மூன்று இளங்கிளைகள்’ அல்லது ‘மூன்று தளிர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அது துளிர்க்கையில், அதன் பூ வெளிவந்தது” என்று உள்ளது; கொடி துளிர்விட்டு மலர்ந்து கனியும்வரை வேகமாக முன்னேறும் தொடர்ச்சி விவரிக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַגֶּפֶן
  choice: அந்தத் திராட்சைக்கொடியில்
  rationale: இணைப்புச் சொல்லையும் இடப்பொருளையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; குறிப்பிட்ட கொடியைச் சுட்டும் எபிரெயக் கட்டுரையையும் காக்கிறது.
- source_word: שָׂרִיגִם
  choice: கிளைகள்
  rationale: திராட்சைக்கொடியின் கிளைகள் அல்லது இளந்தளிர்களைக் குறிக்கலாம்; பொதுவாசகருக்கு இயல்பாகவும் பரந்த பொருளுடனும் இருப்பதால் ‘கிளைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כְפֹרַחַת
  choice: அது துளிர்க்கும்போதே
  rationale: பங்கேற்புவினையின் நிகழ்நிலை வளர்ச்சியையும் வேகமான தொடர்ச்சியையும் இயல்பான தமிழில் தருகிறது.
- source_word: עָלְתָה נִצָּהּ
  choice: அதன் பூக்கள் வெளிவந்தன
  rationale: சொல்லுக்குச் சொல் ‘அதன் பூ மேலே வந்தது’ என்ற உருவகத்தை வாசிக்கத்தக்க தமிழில் வழங்குகிறது; எபிரெய ஒருமை இங்கு தொகுப்புப் பொருளாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: הִבְשִׁילוּ אַשְׁכְּלֹתֶיהָ עֲנָבִים
  choice: அதன் குலைகள் திராட்சைப்பழங்களாகப் பழுத்தன
  rationale: குலைகள் பழுத்துத் திராட்சைப்பழங்களாயின என்ற எபிரெயப் பயனிலை அமைப்பையும் வளர்ச்சியின் இறுதிக்கட்டத்தையும் தெளிவாகக் காக்கிறது.
