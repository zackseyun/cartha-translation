  text: כִּ֧י אִם זְכַרְתַּ֣/נִי אִתְּ/ךָ֗ כַּ/אֲשֶׁר֙ יִ֣יטַב לָ֔/ךְ וְ/עָשִֽׂיתָ נָּ֥א עִמָּדִ֖/י חָ֑סֶד וְ/הִזְכַּרְתַּ֨/נִי֙ אֶל פַּרְעֹ֔ה וְ/הוֹצֵאתַ֖/נִי מִן הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/014.yaml
  text: But if you remember me when it goes well for you[a], please show kindness to me, and mention me to Pharaoh[b], and bring me out of this house.
translation:
  language: ta
  text: ஆனால், உமக்கு நன்மை உண்டாகும்போது என்னை நினைத்துக்கொள்ளும். தயவுசெய்து எனக்குத் தயவு காட்டி, பார்வோனிடம் என்னைப் பற்றிச் சொல்லி, இந்த வீட்டிலிருந்து[a] என்னை வெளியே கொண்டுவரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘வீடு’ என்பது யோசேப்பு அடைத்துவைக்கப்பட்டிருந்த சிறை இடத்தைக் குறிக்கிறது.
    reason: lexical_clarification
lexical_decisions:
- source_word: כִּי אִם
  choice: ஆனால்
  rationale: இச்சொற்றொடர் முந்தைய உரையுடன் மாறுபாட்டை உணர்த்தி யோசேப்பின் வேண்டுகோளை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பாக ‘ஆனால்’ என வழங்கப்பட்டுள்ளது; நிபந்தனை/காலப் பொருள் அடுத்த கூறில் வெளிப்படுகிறது.
- source_word: זְכַרְתַּנִי אִתְּךָ
  choice: என்னை நினைத்துக்கொள்ளும்
  rationale: ‘உம்முடன் என்னை நினைவுகூரும்’ என்ற சொற்சொல் மொழிபெயர்ப்பு தமிழில் இயல்பற்றது. אִתְּךָ தரும் தனிப்பட்ட நினைவில் வைத்திருக்கும் நுணுக்கம் ‘நினைத்துக்கொள்ளும்’ என்பதில் இயல்பாக அடங்குகிறது.
- source_word: כַּאֲשֶׁר יִיטַב לָךְ
  choice: உமக்கு நன்மை உண்டாகும்போது
  rationale: பானபாத்திரக்காரனின் நிலை சீரடைந்து அவனுக்கு நன்மை ஏற்படும் காலத்தை இந்தக் கூறு குறிக்கிறது. காலப் பொருளையும் நலநிலையையும் மொழிபெயர்ப்பு காக்கிறது.
- source_word: וְעָשִׂיתָ נָּא עִמָּדִי חָסֶד
  choice: தயவுசெய்து எனக்குத் தயவு காட்டி
  rationale: נָא வேண்டுகோளின் பணிவை ‘தயவுசெய்து’ எனவும், חֶסֶד இச்சூழலில் கோரப்படும் நடைமுறை நற்கருணையை ‘தயவு’ எனவும் வழங்குகிறது.
- source_word: וְהִזְכַּרְתַּנִי אֶל פַּרְעֹה
  choice: பார்வோனிடம் என்னைப் பற்றிச் சொல்லி
  rationale: இங்குள்ள Hiphil வடிவம் யோசேப்பை பார்வோனின் கவனத்துக்குக் கொண்டுவருவதைக் குறிக்கிறது. ‘என்னை நினைவூட்டி’ என்பதைக் காட்டிலும் இத்தமிழ் சூழலுக்கு தெளிவானது.
- source_word: וְהוֹצֵאתַנִי
  choice: என்னை வெளியே கொண்டுவரும்
  rationale: יצא என்பதன் Hiphil வடிவத்திலுள்ள காரணவினைப் பொருளை இவ்வாக்கியம் காக்கிறது.
- source_word: מִן הַבַּיִת הַזֶּה
  choice: இந்த வீட்டிலிருந்து
  rationale: எபிரெய மூலத்தில் ‘வீடு’ என்றே உள்ளது. சூழலில் அது அடைத்துவைக்கப்பட்ட இடத்தைக் குறித்தாலும், முதன்மை உரையில் அந்த உருவகம் பாதுகாக்கப்படுகிறது.
