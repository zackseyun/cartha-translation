translation_notes:
  register: நவீன தரத் தமிழில், பணிவான வேண்டுகோளுக்கேற்ற மரியாதை ஒருமை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன. சொற்சொல் இறுக்கத்தைத் தவிர்த்தும், ‘வீடு’ என்ற மூல உருவகத்தையும் வேண்டுகோளின் தொடர்ச்சியையும் காத்தும் மொழிபெயர்க்கப்பட்டுள்ளது.
