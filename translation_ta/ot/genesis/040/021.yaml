revisions:
- from: அவன் தலைமைப் பானபாத்திரக்காரனை அவனுடைய முந்தைய பணியில் மீண்டும் அமர்த்தினான்[a]; அவன் பார்வோனின் கையில் கோப்பையை வைத்தான்[b].
  to: அவன் தலைமைப் பானம் பரிமாறுபவனை அவனுடைய பதவியில் மீண்டும் அமர்த்தினான்[a]; அந்தத் தலைமைப் பானம் பரிமாறுபவன் பார்வோனின் கையில் கோப்பையை வைத்தான்.
  rationale: The revision explicitly identifies the chief cupbearer as the actor in the second clause, preventing the misleading Tamil reading that Pharaoh handled his own cup. It also uses a more natural designation for the court official and retains the concrete sense of his drink-serving role in a lexical footnote.
