  text: וַ/יָּ֛שֶׁב אֶת שַׂ֥ר הַ/מַּשְׁקִ֖ים עַל מַשְׁקֵ֑/הוּ וַ/יִּתֵּ֥ן הַ/כּ֖וֹס עַל כַּ֥ף פַּרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/021.yaml
  text: He restored the chief cupbearer to his office[b][a], and he put the cup into Pharaoh’s hand.
translation:
  language: ta
  text: அவன் தலைமைப் பானம் பரிமாறுபவனை அவனுடைய பதவியில் மீண்டும் அமர்த்தினான்[a]; அந்தத் தலைமைப் பானம் பரிமாறுபவன் பார்வோனின் கையில் கோப்பையை வைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, “அவனுடைய பானம் பரிமாறும் பணியில் மீண்டும் அமர்த்தினான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: மீண்டும் அமர்த்தினான்
  rationale: שׁוב என்பதன் ஹிஃபீல் வடிவம் ஒருவரை அவரது முந்தைய நிலைக்கோ பொறுப்புக்கோ திரும்பச் செய்வதைக் குறிக்கிறது; நீதிமன்றப் பணிச்சூழலில் ‘மீண்டும் அமர்த்தினான்’ என்பது இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: שַׂר הַמַּשְׁקִים
  choice: தலைமைப் பானபாத்திரக்காரன்
  rationale: שַׂר என்பது தலைமை அதிகாரியையும், מַשְׁקִים என்பது பானம் பரிமாறுவோரையும் குறிக்கிறது. அரண்மனைப் பதவியைக் குறிக்கும் தெளிவான, வழக்கிலுள்ள தமிழ்ச் சொற்றொடர் இது.
- source_word: עַל מַשְׁקֵהוּ
  choice: அவனுடைய முந்தைய பணியில்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக அவனுடைய பானம் பரிமாறும் பணிக்குத் திரும்பச் செய்ததைச் சொல்கிறது. தமிழில் இயல்புக்காக ‘முந்தைய பணி’ என முதன்மை உரையில் கூறி, அதன் குறிப்பான பொருளை அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיִּתֵּן
  choice: வைத்தான்
  rationale: נתן பொதுவாக ‘கொடுத்தான்’ எனப் பொருள்பட்டாலும், கோப்பையை ஒருவரின் கையில் இடும் இச்சூழலில் ‘வைத்தான்’ என்பது இயல்பான தமிழ்.
- source_word: הַכּוֹס
  choice: கோப்பை
  rationale: குறிப்பிட்ட பானக் கோப்பையைக் குறிக்கும் நேரடியான, நவீன தமிழ்ச் சொல்.
- source_word: עַל כַּף פַּרְעֹה
  choice: பார்வோனின் கையில்
  rationale: כַּף என்பதன் சொற்பொருள் ‘உள்ளங்கை’; இச்சூழலில் தமிழில் ‘கையில்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
theological_decisions:
- issue: இரண்டாம் வினைச்சொல்லின் மறைமுக எழுவாய்
  choice: ‘அவன்’ என வைத்து எபிரெயிலுள்ள எழுவாய் தெளிவின்மையைப் பாதுகாத்தல்
  alternative: ‘பானபாத்திரக்காரன் கோப்பையை வைத்தான்’ என்று எழுவாயை வெளிப்படையாகச் சேர்த்தல்
  rationale: וַיִּתֵּן என்ற வினையில் எழுவாய் தனியாகக் குறிப்பிடப்படவில்லை. இலக்கணத் தொடர்ச்சி பார்வோனைச் சுட்டக்கூடும்; பணிச்சூழல் தலைமைப் பானபாத்திரக்காரனை இயல்பான செய்பவனாக உணர்த்துகிறது. மூலத்தில் இல்லாத தீர்மானத்தை முதன்மை உரையில் திணிக்காமல், அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified உரைநடை பயன்படுத்தப்பட்டுள்ளது. அரண்மனைப் பதவிக்காக வழக்கிலுள்ள ‘தலைமைப் பானபாத்திரக்காரன்’ வைக்கப்பட்டுள்ளது; மூல எபிரெயிலுள்ள எழுவாய் தெளிவின்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
