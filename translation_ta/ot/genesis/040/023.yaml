  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. அரசவைப் பதவிக்கான சொற்றொடர் வாசகருக்குப் புரியும் வகையில் வெளிப்படையாக உள்ளது; இரண்டாம் கூறின் வலியுறுத்தும் மறுகூற்று அரைப்புள்ளியால் பாதுகாக்கப்பட்டுள்ளது.
