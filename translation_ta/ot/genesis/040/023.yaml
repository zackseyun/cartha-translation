source:
  edition: WLC
  text: וְ/לֹֽא זָכַ֧ר שַֽׂר הַ/מַּשְׁקִ֛ים אֶת יוֹסֵ֖ף וַ/יִּשְׁכָּחֵֽ/הוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/023.yaml
  text: But the chief cupbearer did not remember Joseph[a], but forgot him.
translation:
  language: ta
  text: ஆனால் பானம் பரிமாறுவோரின் தலைவன் யோசேப்பை நினைவில் கொள்ளவில்லை[a]; அவனை மறந்துவிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும் பானம் பரிமாறுவோரின் தலைவன் யோசேப்பை நினைவில் கொள்ளவில்லை; அவனை மறந்துவிட்டான்.”
    reason: וְ என்ற இணைப்புச்சொல் சூழலில் முரண்பாட்டைக் காட்டும் ‘ஆனால்’ என்றும், எளிய தொடர்ச்சியைக் காட்டும் ‘மேலும்’ என்றும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: וְ/לֹא
  choice: ஆனால் ... இல்லை
  rationale: முந்தைய நிகழ்வுடன் வசனத்தை இணைக்கும் அதே வேளையில், யோசேப்பின் வேண்டுகோள் நிறைவேறாத முரண்பாட்டுத் திருப்பத்தையும் எபிரெய இணைப்புச்சொல் காட்டுகிறது. நவீன தமிழில் ‘ஆனால்’ அதை இயல்பாக வெளிப்படுத்துகிறது; ‘மேலும்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: זָכַר
  choice: நினைவில் கொள்ளவில்லை
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘நினைவுகூருதல்/நினைவில் கொள்ளுதல்.’ யோசேப்புக்காகச் செயல்படத் தவறியதையும் சூழல் உணர்த்தினாலும், அந்தக் கருத்தை வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் சொற்பொருள் பாதுகாக்கப்படுகிறது.
- source_word: שַׂר הַמַּשְׁקִים
  choice: பானபாத்திரக்காரர்களின் தலைவன்
  rationale: பார்வோனுக்குப் பானம் பரிமாறும் அரசவை அதிகாரிகளின் தலைமைப் பதவியை இது குறிக்கிறது. ‘பானபாத்திரக்காரர்களின் தலைவன்’ என்பது பதவியின் கூட்டுப் பொருளையும் தலைமையையும் தெளிவாகக் காட்டுகிறது.
- source_word: אֶת יוֹסֵף
  choice: யோசேப்பை
  rationale: אֶת குறிக்கும் நேரடி செயப்படுபொருள் தமிழில் ‘-ஐ’ வேற்றுமை உருபால் இயல்பாக வெளிப்படுகிறது; பெயர் ‘யோசேப்பு’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיִּשְׁכָּחֵהוּ
  choice: அவனை மறந்துவிட்டான்
  rationale: வினைச்சொல் ‘மறத்தல்’ என்று பொருள்படும்; ஆண்பால் ஒருமை பின்னொட்டு யோசேப்பைக் குறிக்கிறது. ‘மறந்துவிட்டான்’ என்பது முன் கூறிய ‘நினைவில் கொள்ளவில்லை’ என்பதை வலியுறுத்தும் எபிரெய மறுகூற்றை இயல்பான தமிழில் காக்கிறது.
