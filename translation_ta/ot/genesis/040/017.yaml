revisions:
- from: மேலேயிருந்த கூடையில், அப்பம் சுடுபவரின் கைவேலையான[a] பார்வோனுக்குரிய எல்லா வகை உணவுகளும் இருந்தன; பறவைகள் என் தலைக்கு மேலிருந்த அந்தக் கூடையிலிருந்து அவற்றைத் தின்றுகொண்டிருந்தன.
  to: மேலிருந்த கூடையில், அப்பம் சுடுபவனால் தயாரிக்கப்பட்ட பார்வோனுக்கான எல்லா வகை உணவுகளும் இருந்தன; என் தலைக்கு மேலிருந்த அந்தக் கூடையிலிருந்து பறவைகள் அவற்றைத் தின்றுகொண்டிருந்தன.
