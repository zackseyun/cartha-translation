source:
  edition: WLC
  text: וּ/בַ/סַּ֣ל הָֽ/עֶלְי֔וֹן מִ/כֹּ֛ל מַאֲכַ֥ל פַּרְעֹ֖ה מַעֲשֵׂ֣ה אֹפֶ֑ה וְ/הָ/ע֗וֹף אֹכֵ֥ל אֹתָ֛/ם מִן הַ/סַּ֖ל מֵ/עַ֥ל רֹאשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/017.yaml
  text: and in the top basket were all kinds of food for Pharaoh[a], the work of a baker, and the birds were eating them from the basket above my head.
translation:
  language: ta
  text: மேலிருந்த கூடையில், அப்பம் சுடுபவனால் தயாரிக்கப்பட்ட பார்வோனுக்கான எல்லா வகை உணவுகளும் இருந்தன; என் தலைக்கு மேலிருந்த அந்தக் கூடையிலிருந்து பறவைகள் அவற்றைத் தின்றுகொண்டிருந்தன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַסַּל הָעֶלְיוֹן
  choice: மேலேயிருந்த கூடையில்
  rationale: עֶלְיוֹן என்பது கூடைகளில் மேலே இருந்ததைக் குறிக்கிறது. கனவுக் காட்சியின் இடவமைப்பை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: מִכֹּל מַאֲכַל פַּרְעֹה
  choice: பார்வோனுக்குரிய எல்லா வகை உணவுகளும்
  rationale: מִכֹּל என்பதும் கூட்டுப்பொருளில் வரும் מַאֲכַל என்பதும் உணவின் பலவகைத் தன்மையைச் சுட்டுகின்றன. எபிரெய வினையற்ற வாக்கியத்திற்கு தமிழில் இயல்பாக ‘இருந்தன’ சேர்க்கப்பட்டுள்ளது.
- source_word: מַעֲשֵׂה אֹפֶה
  choice: அப்பம் சுடுபவரின் கைவேலையான
  rationale: சொல்லடிப்படையில் ‘சுடுபவரின் வேலை’ என்று பொருள். இங்கு அவர் தயாரித்த சுட்ட உணவுப் பொருள்களைக் குறிக்கும் வாய்ப்பு இருந்தாலும், மூலத்தின் வெளிப்பாட்டை முதன்மை உரை பாதுகாக்கிறது.
- source_word: וְהָעוֹף
  choice: பறவைகள்
  rationale: עוֹף என்பது பறக்கும் உயிரினங்களை அல்லது பறவைகளைத் தொகுப்பாகக் குறிக்கலாம்; சூழலில் தமிழ்ப் பன்மை இயல்பாக உள்ளது.
- source_word: אֹכֵל
  choice: தின்றுகொண்டிருந்தன
  rationale: எபிரெயப் பெயரெச்ச வினை கனவுக் காட்சியில் தொடர்ந்து நடந்த செயலைக் காட்டுகிறது; தமிழின் தொடர்நிலை இறந்தகாலம் இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֹתָם
  choice: அவற்றை
  rationale: ஆண்பால் பன்மை பின்னொட்டு கூடையிலிருந்த பல உணவுப் பொருள்களைச் சுட்டுகிறது; தமிழிலும் பன்மைச் சுட்டு காக்கப்பட்டுள்ளது.
- source_word: מִן הַסַּל
  choice: அந்தக் கூடையிலிருந்து
  rationale: מִן மூலத்தையோ வெளியேறும் இடத்தையோ குறிக்கிறது. ஏற்கெனவே குறிப்பிடப்பட்ட மேல்கூடையைத் தமிழில் இயல்பாக ‘அந்தக் கூடை’ என்று சுட்டுகிறது.
- source_word: מֵעַל רֹאשִׁי
  choice: என் தலைக்கு மேலிருந்த
  rationale: מֵעַל என்பது தலைக்கு மேலான இடநிலையைக் குறிக்கிறது; தலைமேல் நேரடியாகத் தொட்டிருந்ததாகத் தேவையின்றி நிர்ணயிக்கவில்லை.
