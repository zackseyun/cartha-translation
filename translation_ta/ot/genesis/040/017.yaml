  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மதிப்புமிக்க நடையிலும் வடிவமைக்கப்பட்டுள்ளது. ‘கைவேலை’ என்பது מַעֲשֵׂה אֹפֶה என்பதன் சொல்லடிப்படை உருவகத்தைத் தக்கவைக்கிறது; அடிக்குறிப்பு அதன் பொருள்சார் மாற்றை விளக்குகிறது.
