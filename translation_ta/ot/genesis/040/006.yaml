  yaml_path: translation/ot/genesis/040/006.yaml
  text: Joseph came to them in the morning and saw them[a], and behold, they were troubled.
translation:
  language: ta
  text: காலையில் யோசேப்பு அவர்களிடம் வந்து அவர்களைப் பார்த்தான்; இதோ, அவர்கள் கலக்கமடைந்திருந்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனம் தளர்ந்திருந்தார்கள்,” “முகம் வாடியிருந்தார்கள்,” அல்லது “சோகமாக இருந்தார்கள்.” எபிரேயச் சொல் வெளிப்படையாகத் தெரிந்த கலக்கமான அல்லது துயரமான நிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: அவர்களிடம் வந்து
  rationale: בוא மற்றும் אֲלֵיהֶם இணைந்து அவர்களை நோக்கிய வருகையைக் குறிக்கின்றன; இயல்பான நவீனத் தமிழில் இதை நேரடியாகத் தருகிறது.
- source_word: בַּבֹּקֶר
  choice: காலையில்
  rationale: குறிப்பிட்ட காலை நேரத்தைக் குறிக்கும் எபிரேயச் சொற்றொடருக்கான இயல்பான தமிழாக்கம்.
- source_word: וַיַּרְא אֹתָם
  choice: அவர்களைப் பார்த்தான்
  rationale: ראה நேரடியான காணுதலைக் குறிக்கிறது; சூழல் காட்டும் கவனிப்பை மிகைப்படுத்தாமல் அடிப்படைப் பொருளைப் பாதுகாக்கிறது.
- source_word: וְהִנָּם
  choice: இதோ
  rationale: யோசேப்பு கண்ட நிலைக்கு வாசகரின் கவனத்தை ஈர்க்கும் எபிரேயச் சுட்டிக்காட்டும் இடைச்சொல்லின் உரையாடல் வலிமையைப் பாதுகாக்கிறது.
- source_word: זֹעֲפִים
  choice: கலக்கமடைந்திருந்தார்கள்
  rationale: அவர்களுடைய முகம் அல்லது மனநிலையில் வெளிப்பட்ட தொந்தரவு, துயரம், சோர்வு ஆகியவற்றை ஒரே குறுகிய உணர்வாகச் சுருக்காமல் பரந்த பொருளில் தருகிறது.
