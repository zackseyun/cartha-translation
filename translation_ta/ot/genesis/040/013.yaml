  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים יִשָּׂ֤א פַרְעֹה֙ אֶת רֹאשֶׁ֔/ךָ וַ/הֲשִֽׁיבְ/ךָ֖ עַל כַּנֶּ֑/ךָ וְ/נָתַתָּ֤ כוֹס פַּרְעֹה֙ בְּ/יָד֔/וֹ כַּ/מִּשְׁפָּט֙ הָֽ/רִאשׁ֔וֹן אֲשֶׁ֥ר הָיִ֖יתָ מַשְׁקֵֽ/הוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/013.yaml
  text: In three more days Pharaoh will lift up your head and restore you to your position[a], and you will place Pharaoh’s cup into his hand, according to the former custom when you were his cupbearer.
translation:
  language: ta
  text: இன்னும் மூன்று நாட்களில் பார்வோன் உன் தலையை உயர்த்தி[a], உன்னை உன் பதவியில் மீண்டும் அமர்த்துவான். நீ அவனுக்குப் பானம் பரிமாறும் அதிகாரியாக இருந்தபோது செய்த முந்தைய வழக்கத்தின்படி, பார்வோனின் கோப்பையை அவன் கையில் கொடுப்பாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “உன் தலையை உயர்த்தி.” இங்கு இந்த மரபுத்தொடர் பார்வோன் அவனுக்கு மீண்டும் தயவு காட்டி, அவனைப் பதவியில் அமர்த்துவதைக் குறிக்கிறது; இதே சொற்றொடர் வசனம் 19-இல் மாறுபட்ட, கொடூரமான முடிவுடன் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: இன்னும் மூன்று நாட்களில்
  rationale: மீதமுள்ள கால இடைவெளிக்குப் பின் நிகழவிருப்பதைச் சுட்டும் எபிரெயச் சொற்றொடரின் முன்னோக்கிய காலப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: יִשָּׂא ... אֶת רֹאשֶׁךָ
  choice: உன் தலையை உயர்த்தி
  rationale: ‘தலையை உயர்த்துதல்’ என்ற மூலமொழி உருவகத்தைத் தக்கவைக்கிறது; அடுத்த சொற்றொடர் இங்கு அது சாதகமான மீள்நியமனத்தைக் குறிக்கிறது என்பதைத் தெளிவாக்குகிறது. மேலும், வசனம் 19-இல் வரும் மாறுபட்ட பயன்பாட்டுடனான இலக்கியத் தொடர்பையும் பாதுகாக்கிறது.
- source_word: וַהֲשִׁיבְךָ עַל כַּנֶּךָ
  choice: உன்னை உன் பதவியில் மீண்டும் அமர்த்துவான்
  rationale: כֵּן இச்சூழலில் அரண்மனைப் பணி அல்லது நிலையான பதவியைக் குறிக்கிறது; ‘பதவியில் மீண்டும் அமர்த்துதல்’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: וְנָתַתָּ כוֹס פַּרְעֹה בְּיָדוֹ
  choice: பார்வோனின் கோப்பையை அவன் கையில் கொடுப்பாய்
  rationale: נתן என்பதன் ‘கொடு/வை’ என்ற பரந்த பொருளையும், கோப்பையை நேரடியாக அரசனின் கையில் அளிக்கும் செயல் உருவகத்தையும் காக்கிறது.
- source_word: כַּמִּשְׁפָּט הָרִאשׁוֹן
  choice: முந்தைய வழக்கத்தின்படி
  rationale: מִשְׁפָּט இங்கு சட்டத் தீர்ப்பை அல்ல, முன்பு பின்பற்றப்பட்ட நிலையான பணிமுறையைக் குறிக்கிறது.
- source_word: אֲשֶׁר הָיִיתָ מַשְׁקֵהוּ
  choice: நீ அவனுக்குப் பானம் பரிமாறும் அதிகாரியாக இருந்தபோது
  rationale: מַשְׁקֶה என்பது சாதாரணமாகப் பானம் கொடுக்கும் செயலை மட்டுமல்ல, அரசவையின் அதிகாரப்பூர்வப் பணியையும் குறிக்கிறது. ‘பானம் பரிமாறும் அதிகாரி’ என்பது அந்தப் பொறுப்பை இன்றைய வாசகருக்குத் தெளிவாக்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. மூலத்தின் ‘தலையை உயர்த்துதல்’ என்ற திட்டமிட்ட இருபொருள் வாய்ந்த இலக்கிய உருவகம் அடிக்குறிப்புடன் தக்கவைக்கப்பட்டுள்ளது; அரசவைப் பொறுப்பை சாதாரண வாசகர் புரிந்துகொள்ள ‘பானம் பரிமாறும் அதிகாரி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
