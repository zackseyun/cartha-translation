- from: இன்னும் மூன்று நாட்களில் பார்வோன் உன் தலையை உன்னிடமிருந்து தூக்கி எடுத்து[a], உன்னை ஒரு மரத்தின்மேல் தொங்கவிடுவான்[b]; பறவைகள் உன் சதையை உன்மேலிருந்து தின்னும்.
