  text: בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים יִשָּׂ֨א פַרְעֹ֤ה אֶת רֹֽאשְׁ/ךָ֙ מֵֽ/עָלֶ֔י/ךָ וְ/תָלָ֥ה אוֹתְ/ךָ֖ עַל עֵ֑ץ וְ/אָכַ֥ל הָ/ע֛וֹף אֶת בְּשָׂרְ/ךָ֖ מֵ/עָלֶֽי/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/019.yaml
  text: In three more days Pharaoh will lift up your head from upon you and hang you on a tree[b][a], and the birds will eat your flesh from upon you.
translation:
  language: ta
  text: இன்னும் மூன்று நாட்களில் பார்வோன் உன் தலையை உன்மேலிருந்து உயர்த்துவான்[a]; உன்னை ஒரு மரத்தில் தொங்கவிடுவான்[b]. பறவைகள் உன் சதையை உன்மேலிருந்து தின்னும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “உன் தலையை உன்மேலிருந்து உயர்த்துவான்.” பானபாத்திரக்காரனின் கனவுக்கு விளக்கம் சொல்லும்போது சாதகமான பொருளில் பயன்படுத்தப்பட்ட அதே சொற்றொடரின் இருண்ட சொல்விளையாட்டு இது; இங்கே தலை உடலிலிருந்து அகற்றப்படுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன்னை மரத்தில்/மரக்கம்பத்தில் தொங்கவிடுவான்”; அல்லது, “உன்னை ஒரு கம்பத்தில் குத்தி ஏற்றுவான்.” எபிரேயத்தில், “ஒரு மரத்தில்.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: இன்னும் மூன்று நாட்களில்
  rationale: மீதமுள்ள கால இடைவெளியைக் குறிக்கும் எபிரேயச் சொற்றொடரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: יִשָּׂא ... אֶת רֹאשְׁךָ מֵעָלֶיךָ
  choice: உன் தலையை உன்னிடமிருந்து தூக்கி எடுத்து
  rationale: נשׂא என்பதன் ‘தூக்கு’ என்ற உருவகத்தையும், முந்தைய சாதகமான பயன்பாட்டுடனான கொடூரச் சொல்விளையாட்டையும் காக்கிறது; ‘உன்னிடமிருந்து’ என்பது இங்கு தலையை அகற்றும் எதிர்மறைப் பொருளைச் சுட்டுகிறது.
- source_word: וְתָלָה אֹתְךָ עַל עֵץ
  choice: உன்னை ஒரு மரத்தின்மேல் தொங்கவிடுவான்
  rationale: תלה என்பதற்கு ‘தொங்கவிடு’ என்றும் עֵץ என்பதற்கு அடிப்படையாக ‘மரம்’ என்றும் மொழிபெயர்த்து, துல்லியமான கொலைமுறை எது என்ற மூலத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
- source_word: וְאָכַל הָעוֹף
  choice: பறவைகள் ... தின்னும்
  rationale: ஒருமைத் தொகுப்புப்பெயரான עוֹף என்பதை தமிழில் இயல்பான பன்மையாகவும், אכל என்பதை மிகைப்படுத்தாமல் ‘தின்னும்’ என்றும் தருகிறது.
- source_word: אֶת בְּשָׂרְךָ מֵעָלֶיךָ
  choice: உன் சதையை உன்மேலிருந்து
  rationale: בשר என்பதன் நேரடியான, கடுமையான ‘சதை’ என்ற பொருளையும், வசனத்தில் மீண்டும் வரும் מֵעָלֶיךָ என்ற உருவகத்தையும் மென்மையாக்காமல் காக்கிறது.
theological_decisions:
- issue: தீர்ப்புரையின் கொடூரமான மரணத் தண்டனைப் படிமத்தையும் சொல்விளையாட்டையும் எவ்வாறு மொழிபெயர்ப்பது
  choice: ‘உன் தலையை உன்னிடமிருந்து தூக்கி எடுத்து’ என்று எபிரேய உருவகத்தையும் அதன் இருண்ட சொல்விளையாட்டையும் தக்கவைத்தல்
  alternative: ‘உன் தலையை வெட்டி, உன் உடலை ஒரு கம்பத்தில் தொங்கவிடுவான்’ என்று பொருளை வெளிப்படையாகத் தீர்மானித்தல்
  rationale: வெளிப்படையான மாற்று வாசிப்பு நிகழ்வைத் தெளிவாக்கினாலும், முந்தைய வசனத்தில் சாதகமாக வரும் ‘தலையை உயர்த்துதல்’ என்ற சொற்றொடருடனான இலக்கிய எதிரொலியை இழக்கச் செய்யும். தேர்ந்தெடுத்த வாசிப்பு மூலத்தின் பதற்றத்தையும் கொடூரத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. மரணத் தண்டனையின் கடுமையை மென்மையாக்காமல், மூலத்தின் சொல்விளையாட்டையும் கொலைமுறை குறித்த மெய்யான தெளிவின்மையையும் அடிக்குறிப்புகளில் பாதுகாக்கிறது.
