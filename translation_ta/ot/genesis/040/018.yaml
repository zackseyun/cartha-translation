  yaml_path: translation/ot/genesis/040/018.yaml
  text: 'Joseph answered and said, “This is its interpretation: the three baskets are three days.”'
translation:
  language: ta
  text: 'யோசேப்பு பதிலளித்துச் சொன்னார்: “இதன் விளக்கம் இதுதான்: அந்த மூன்று கூடைகள் மூன்று நாட்கள்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: மறுமொழியாக ... என்றார்
  rationale: எபிரெய இரட்டை உரையாடல் சூத்திரத்தின் பதிலளிக்கும் தன்மையையும் சொல்லும் வினையையும் இயல்பான நவீனத் தமிழில் ஒருங்கிணைக்கிறது; ‘பதிலளித்துச் சொன்னார்’ என்ற சொற்சொல்லான வடிவத்தின் செயற்கைத்தன்மையைத் தவிர்க்கிறது.
- source_word: פִּתְרֹנוֹ
  choice: இதன் விளக்கம்
  rationale: கனவின் பொருளை விளக்குவதைக் குறிக்கும் פִּתְרוֹן என்பதற்கு இச்சூழலில் ‘விளக்கம்’ துல்லியமானதும் இயல்பானதும் ஆகும்; உடைமைப் பின்னொட்டை ‘இதன்’ பிரதிபலிக்கிறது.
- source_word: שְׁלֹשֶׁת הַסַּלִּים
  choice: அந்த மூன்று கூடைகளும்
  rationale: סַל என்பதைக் பொதுவான ‘கூடை’ என்று மொழிபெயர்க்கிறது. எபிரெய definite article-ஐ ‘அந்த’ என்றும், அடையாளப்படுத்தும் வாக்கியத்துக்கு ஏற்ற எழுவாய் உருபை ‘-உம்’ என்றும் வெளிப்படுத்துகிறது.
- source_word: שְׁלֹשֶׁת יָמִים הֵם
  choice: மூன்று நாட்கள்
  rationale: எபிரெய மொழியின் வினையற்ற அடையாள வாக்கியத்தைத் தமிழிலும் இயல்பாக வினையின்றி வைத்திருக்கிறது; ‘குறிக்கின்றன’ என்று விளக்கப் பொருளைச் சேர்க்காமல், கூடைகளையும் நாட்களையும் நேரடியாக ஒப்பிடும் மூல வடிவத்தைப் பாதுகாக்கிறது.
