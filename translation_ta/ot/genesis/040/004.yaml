source:
  edition: WLC
  text: וַ֠/יִּפְקֹד שַׂ֣ר הַ/טַּבָּחִ֧ים אֶת יוֹסֵ֛ף אִתָּ֖/ם וַ/יְשָׁ֣רֶת אֹתָ֑/ם וַ/יִּהְי֥וּ יָמִ֖ים בְּ/מִשְׁמָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/004.yaml
  text: So the captain of the guard assigned Joseph to them[a], and he attended them[b]; and they were in custody for some time.
translation:
  language: ta
  text: அதனால், காவற்படைத் தலைவர் யோசேப்பை அவர்களுடன் இருக்கும்படி நியமித்தார்[a]; அவன் அவர்களுக்குப் பணிவிடை செய்தான்; அவர்கள் சில காலம் காவலில் இருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யோசேப்பை அவர்கள்மேல் நியமித்தார்,’ ‘யோசேப்பை அவர்களுக்குப் பொறுப்பாளனாக வைத்தார்.’ எபிரெய வினைச்சொல் ஒரு பொறுப்புக்கு நியமிப்பதைக் குறிக்கலாம்; யோசேப்பு அவர்களுக்குப் பணிவிடை செய்ய நியமிக்கப்பட்டாரா அல்லது அவர்களை மேற்பார்வை செய்ய நியமிக்கப்பட்டாரா என்பது இத்தொடரில் முழுமையாகத் தெளிவில்லை.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘அவர்கள் காவலில் நாட்களாக இருந்தார்கள்.’ இது அவர்கள் அங்கே ஒரு காலப்பகுதி இருந்தார்கள் என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: நியமித்தார்
  rationale: פקד இங்கு ஒரு பொறுப்புக்காக ஒருவரை நியமிப்பதைக் குறிக்கிறது. ‘நியமித்தார்’ என்பது யோசேப்பின் பணி உறவை இயல்பாகச் சொல்கிறது; அவன் அவர்கள்மேல் அதிகாரியாக இருந்தானா அல்லது அவர்களுக்குப் பணிசெய்ய நியமிக்கப்பட்டானா என்ற நுண்ணிய தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: שַׂר הַטַּבָּחִים
  choice: காவலர் தலைவர்
  rationale: சொல்லுக்குச் சொல் பொருள் கொலைசெய்பவர்கள் அல்லது வெட்டுபவர்களின் தலைவர் என்றாலும், ஆதியாகமச் சூழலில் இது அரச பாதுகாப்பு மற்றும் சிறைக் காவலுடன் தொடர்புடைய எகிப்திய அதிகாரியின் பட்டம். ‘காவலர் தலைவர்’ நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֶת יוֹסֵף אִתָּם
  choice: யோசேப்பை அவர்களிடம்
  rationale: யோசேப்பு அந்தக் கைதிகளுடன் தொடர்புடைய பொறுப்புக்கு நியமிக்கப்பட்டதை இத்தொடர் காட்டுகிறது. ‘அவர்களிடம்’ என்பது பணிவிடையையும் மேற்பார்வையையும் முன்கூட்டியே தீர்மானிக்காமல் உறவைத் தெரிவிக்கிறது.
- source_word: וַיְשָׁרֶת אֹתָם
  choice: அவன் அவர்களுக்குப் பணிவிடை செய்தான்
  rationale: שרת என்பதன் அடிப்படை உணர்வு பணிசெய்தல் அல்லது தேவைகளைக் கவனித்தல். ‘பணிவிடை செய்தான்’ என்பது சிறைச் சூழலில் யோசேப்பின் சேவையை நேரடியாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: וַיִּהְיוּ יָמִים
  choice: அவர்கள் சில காலம் ... இருந்தார்கள்
  rationale: ‘அவர்கள் நாட்கள் இருந்தார்கள்’ என்ற எபிரெய மரபுத்தொடர், ஒரு குறிப்பில்லாத காலப்பகுதி கடந்ததைக் குறிக்கிறது. ‘சில காலம்’ அதன் இயல்பான தமிழ் பொருள்.
- source_word: בְּמִשְׁמָר
  choice: காவலில்
  rationale: מִשְׁמָר சிறைச்சாலை என்ற இடத்தை மட்டும் அல்லாமல் காவலின் கீழுள்ள தடுப்புநிலையைக் குறிக்கிறது. ஆகவே ‘காவலில்’ என்பது பரந்ததும் துல்லியமானதும் ஆகும்.
