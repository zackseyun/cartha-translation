translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெய மூலத்தின் தொடரிணைப்பு நடை குறுகிய வாக்கியங்களாலும் அரைப்புள்ளியாலும் பாதுகாக்கப்பட்டுள்ளது. ‘பணிவிடை’ என்பது இங்கு சமயச் சிறப்புப் பொருளில் அல்ல, கைதிகளின் தேவைகளைக் கவனித்துச் செய்த பணியைக் குறிக்கிறது.
