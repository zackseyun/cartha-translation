translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘இதோ’ என்ற வேதாகமக் கதைநடைச் சொல் மூலத்தின் கவன ஈர்ப்பைத் தக்கவைக்கிறது; அடிக்குறிப்பு மாற்று இயல்பான வாசிப்பையும் வழங்குகிறது.
