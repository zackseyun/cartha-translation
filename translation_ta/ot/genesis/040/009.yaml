base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/009.yaml
  text: So the chief cupbearer told his dream to Joseph and said to him[a], “In my dream, behold, a vine was before me.”
translation:
  language: ta
  text: 'அப்போது தலைமைப் பானபரிமாறுபவன் தன் கனவை யோசேப்பிடம் விவரித்து, அவனிடம் சொன்னான்: “என் கனவில், இதோ, என் முன்னால் ஒரு திராட்சைக்கொடி இருந்தது.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் கனவில் என் முன்னால் ஒரு திராட்சைக்கொடி இருந்தது.” எபிரெயத்தில் ‘இதோ’ (וְהִנֵּה) என்ற கவன ஈர்ப்புச் சொல் கனவுக் காட்சியை உயிரோட்டமாக அறிமுகப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: விவரித்து
  rationale: פִּעֵל வடிவிலுள்ள ספר என்பது ஒரு நிகழ்வையோ கனவையோ எடுத்துரைத்தல், விவரித்தல் என்று பொருள்படும்; கனவை முழுமையாகச் சொல்வதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שַׂר הַמַּשְׁקִים
  choice: பானபாத்திரக்காரர்களின் தலைவன்
  rationale: அரசனுக்குப் பானம் பரிமாறும் அலுவலர்களுக்குத் தலைமை வகித்த அதிகாரியைக் குறிக்கிறது; நவீன தமிழில் பதவியின் செயல்பாட்டையும் தலைமை நிலையையும் தெளிவாகக் காட்டுகிறது.
- source_word: אֶת חֲלֹמוֹ
  choice: தன் கனவை
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உரிமைப் பின்னொட்டு தலைவனையே சுட்டுகிறது; தமிழின் இயல்பான தற்சுட்டு வடிவமாக ‘தன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְיוֹסֵף
  choice: யோசேப்பிடம்
  rationale: לְ இங்கு உரையின் பெறுநரைக் குறிக்கிறது; ‘யோசேப்பிடம் விவரித்து’ என்பது இயல்பான தமிழ்.
- source_word: וַיֹּאמֶר לוֹ
  choice: அவனிடம் சொன்னான்
  rationale: எபிரெயத்தில் வெளிப்படையாக உள்ள ‘அவனிடம்’ என்ற மறைமுகச் செயப்படுபொருள் தக்கவைக்கப்பட்டுள்ளது.
- source_word: בַּחֲלוֹמִי
  choice: என் கனவில்
  rationale: கனவுக் காட்சியை அறிமுகப்படுத்தும் இயல்பான, நேரடியான தமிழ் வடிவம்.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கனவில் திடீரெனத் தோன்றும் காட்சியின்மீது கவனத்தை ஈர்க்கும் הִנֵּה என்பதன் உயிரோட்டத்தை ‘இதோ’ பாதுகாக்கிறது.
- source_word: גֶפֶן
  choice: ஒரு திராட்சைக்கொடி
  rationale: גֶּפֶן சூழலில் திராட்சைக் கொடியைக் குறிக்கிறது; வெறும் ‘கொடி’ என்பதைவிட நவீன தமிழ் வாசகருக்குத் தெளிவானது.
- source_word: לְפָנַי
  choice: என் முன்னால்
  rationale: ‘எனக்கு முன்பாக/என் முன்னிலையில்’ என்ற இடநிலையை இயல்பான தமிழில் தெரிவிக்கிறது; வாக்கிய நிறைவுக்காக ‘இருந்தது’ சேர்க்கப்பட்டுள்ளது.
