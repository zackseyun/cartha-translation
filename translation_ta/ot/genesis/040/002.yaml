revisions:
- from: பார்வோன் தன் அதிகாரிகள்[a] இருவர்மீதும், அதாவது பானம் பரிமாறுவோரின் தலைவன்மீதும் அப்பம் சுடுவோரின் தலைவன்மீதும், கோபமடைந்தான்.
  to: பார்வோன் தன் இரு அதிகாரிகள்மீது—பானம் வழங்குவோரின் தலைவன்மீதும் அப்பம் சுடுவோரின் தலைவன்மீதும்—கோபமடைந்தான்.
  rationale: The revision preserves the Hebrew's general designation (“his two officials”) followed by identification of the chief cupbearer and chief baker, while avoiding an added explanatory connective. It retains the repeated Tamil “மீதும்” to reflect the repeated Hebrew preposition and uses smoother modern Tamil word order.
