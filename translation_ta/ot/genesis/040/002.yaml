  text: וַ/יִּקְצֹ֣ף פַּרְעֹ֔ה עַ֖ל שְׁנֵ֣י סָרִיסָ֑י/ו עַ֚ל שַׂ֣ר הַ/מַּשְׁקִ֔ים וְ/עַ֖ל שַׂ֥ר הָ/אוֹפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/002.yaml
  text: And Pharaoh was angry with his two officials[b][a], with the chief cupbearer and with the chief baker.
translation:
  language: ta
  text: பார்வோன் தன் இரு அதிகாரிகள்மீது—பானம் வழங்குவோரின் தலைவன்மீதும் அப்பம் சுடுவோரின் தலைவன்மீதும்—கோபமடைந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: கோபமடைந்தான்
  rationale: קצף என்பது கோபம் அல்லது சினத்தைக் குறிக்கிறது. கதைநடையின் தொடர் நிகழ்வையும் இயல்பான நவீனத் தமிழையும் கருத்தில் கொண்டு, தீவிரத்தை மிகைப்படுத்தாமல் ‘கோபமடைந்தான்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரசருக்கான பட்டத்தின் தமிழில் பரவலாக அறியப்பட்ட வடிவம்.
- source_word: שְׁנֵי סָרִיסָיו
  choice: தன் அதிகாரிகள் இருவர்
  rationale: סָרִיס் என்பது அரசவை அதிகாரியையோ, சில சூழல்களில் அண்ணகரையோ குறிக்கலாம். இங்கு அடுத்ததாகக் குறிப்பிடப்படும் பணிகள் அரசரின் அலுவலர்களுடையவை என்பதால், உடல்நிலையை ஊகிக்காமல் ‘அதிகாரிகள்’ எனத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: שַׂר הַמַּשְׁקִים
  choice: பானம் பரிமாறுவோரின் தலைவன்
  rationale: שַׂר என்பது தலைவரையும் הַמַּשְׁקִים என்பது பானம் வழங்குவோரையும் குறிக்கின்றன. மூலத்தின் குழுத் தலைவர் அமைப்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: שַׂר הָאֹפִים
  choice: அப்பம் சுடுவோரின் தலைவன்
  rationale: שַׂר என்பது தலைவரையும் הָאֹפִים என்பது சுடுபவர்களையோ அப்பம் சுடுபவர்களையோ குறிக்கின்றன. சூழலுக்கேற்ற தொழிற்பெயராக இந்த வடிவம் தெளிவாக உள்ளது.
- source_word: עַל ... עַל ... וְעַל
  choice: இருவர்மீதும் ... தலைவன்மீதும் ... தலைவன்மீதும்
  rationale: கோபத்தின் இலக்குகளை அறிமுகப்படுத்தும் עַל என்பதன் மீளுருவாக்கம் ‘மீதும்’ என்பதை மீண்டும் பயன்படுத்துவதால் காக்கப்படுகிறது. ‘அதாவது’ என்பது பின்னர் வரும் இரு பதவிகளும் அந்த இரு அதிகாரிகளையே விளக்குகின்றன என்பதைத் தெளிவாக்குகிறது.
