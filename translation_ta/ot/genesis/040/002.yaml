translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள பொதுக் குறிப்பு–விரிவாக்க அமைப்பைத் தெளிவாக்க ‘அதாவது’ சேர்க்கப்பட்டுள்ளது; மீளும் עַל அமைப்பு ‘மீதும்’ என்பதன் மீளுருவாக்கத்தால் பாதுகாக்கப்பட்டுள்ளது.
