translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கனவு விளக்கச் சூழலில் இயல்புக்காக ‘குறிக்கின்றன’ தேர்ந்தெடுக்கப்பட்டு, எபிரெயத்தின் சொற்படியான சமன்பாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
