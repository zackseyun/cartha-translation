base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/012.yaml
  text: 'Then Joseph said to him[a], “This is its interpretation: the three branches are three days.”'
translation:
  language: ta
  text: 'அப்போது யோசேப்பு அவனிடம் கூறினான்: “இதன் விளக்கம் இதுதான்: அந்த மூன்று கிளைகள் மூன்று நாட்களே.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீனத் தமிழில் ‘அப்போது’ அதன் தொடர் உணர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לוֹ
  choice: அவனிடம்
  rationale: எபிரெயத்தில் ஆண்பால் ஒருமைப் பதிலிப்பெயர் வெளிப்படையாக உள்ளது; அதன் குறிப்பிட்ட நபரை முதன்மை உரையில் நிரப்பாமல் பதிலிப்பெயராகவே வைக்கப்பட்டுள்ளது.
- source_word: פִּתְרֹנוֹ
  choice: இதன் விளக்கம்
  rationale: கனவுக் காட்சியின் பொருள் விளக்கப்படுவதைச் சுட்டுகிறது; ஆண்பால் ஒருமை உடைமைப் பின்னொட்டு தமிழில் ‘இதன்’ என இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: שְׁלֹשֶׁת
  choice: மூன்று
  rationale: விளக்கத்தின் இணைப்பு அமைப்பைப் பேணுவதற்காக இரு இடங்களிலும் எண்ணிக்கை மீண்டும் தரப்பட்டுள்ளது.
- source_word: הַשָּׂרִגִים
  choice: கிளைகள்
  rationale: திராட்சைக்கொடியின் கிளைகள் அல்லது தளிர்க்கொடிகளைக் குறிக்கும் இச்சொல்லுக்கு ‘கிளைகள்’ என்பது தெளிவான, இயல்பான, அளவுக்கு மீறிக் குறிப்பாக்காத தமிழ் சொல்.
- source_word: יָמִים
  choice: நாட்கள்
  rationale: கனவின் குறியீட்டை ஒரு கால அளவுடன் இணைக்கும் நேரடியான காலப்பெயர்.
- source_word: הֵם
  choice: குறிக்கின்றன
  rationale: எபிரெயத்தில் உள்ள அடையாளச் சமன்பாட்டை, கனவு விளக்கச் சூழலில் நவீனத் தமிழுக்கு இயல்பாக ‘குறிக்கின்றன’ என வழங்குகிறது; கிளைகளே நேரடியாக நாட்கள் என்ற பொருளாக்கத்தைத் தவிர்க்காமல் அவை அவற்றைக் குறிக்கும் என்பதைக் கூறுகிறது.
