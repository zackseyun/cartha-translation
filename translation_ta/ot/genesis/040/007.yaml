base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/007.yaml
  text: So he asked Pharaoh’s officials who were with him in custody in his master’s house[a], saying[b], “Why are your faces downcast today?”
translation:
  language: ta
  text: அப்போது அவன், தன் எஜமானின் வீட்டில் தன்னுடன் காவலில் வைக்கப்பட்டிருந்த பார்வோனின் அதிகாரிகளிடம்[a], “இன்று உங்கள் முகங்கள் ஏன் வாடியிருக்கின்றன?” என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பார்வோனின் அண்ணகர்கள்”; எபிரெயச் சொல் உடல்ரீதியாக அண்ணகர்களானவர்களையோ, பொதுவாக அரசவை அதிகாரிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: அப்போது அவன் ... கேட்டான்
  rationale: Wayyiqtol கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; ‘அப்போது’ இயல்பான தமிழ் தொடர்ச்சியைத் தருகிறது.
- source_word: סְרִיסֵי פַרְעֹה
  choice: பார்வோனின் அதிகாரிகள்
  rationale: סָרִיס் என்பது உடல்ரீதியான அண்ணகரையோ அரசவையின் உயரதிகாரிகளையோ குறிக்கலாம். இச்சூழலில் அவர்களுடைய அரசுப் பதவியே முன்னிலையில் இருப்பதால் ‘அதிகாரிகள்’ முதன்மை உரையில் பொருத்தமானது; மற்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר אִתּוֹ בְמִשְׁמַר
  choice: தன்னுடன் காவலில் இருந்த
  rationale: அவர்கள் யோசேப்புடன் ஒரே காவல் சூழலில் இருந்ததைக் காட்டுகிறது; எபிரெய பிரதிப்பெயரின் தொடர்பைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: בֵּית אֲדֹנָיו
  choice: தன் எஜமானுடைய வீட்டில்
  rationale: ‘எஜமான்’ என்பது இங்கு யோசேப்பின் எஜமானைக் குறிக்கிறது; ‘வீடு’ என்பது அவரது வீட்டுத் தொகுதிக்குள் இருந்த காவலிடத்தையும் உள்ளடக்கக்கூடும்.
- source_word: לֵאמֹר
  choice: என்று கேட்டான்
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய வடிவம் தமிழில் இயல்பாக வினைக்குப் பின் வரும் ‘என்று’ கட்டமைப்பில் வழங்கப்படுகிறது.
- source_word: פְּנֵיכֶם רָעִים
  choice: உங்கள் முகங்கள் ... வாடியிருக்கின்றன
  rationale: சொல்லளவில் ‘உங்கள் முகங்கள் தீய/மோசமான நிலையில் உள்ளன’ என்றாலும், இது சோகம் அல்லது கலக்கத்தைக் காட்டும் முகத்தோற்றத்திற்கான மரபுத்தொடர். ‘முகங்கள் வாடியிருக்கின்றன’ அதைப் புரியக்கூடிய தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: காலக் குறிப்பின் நேரடியும் இயல்புமான தமிழ் இணை.
