  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה חָֽטְא֛וּ מַשְׁקֵ֥ה מֶֽלֶךְ מִצְרַ֖יִם וְ/הָ/אֹפֶ֑ה לַ/אֲדֹנֵי/הֶ֖ם לְ/מֶ֥לֶךְ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/001.yaml
  text: After these things[a], the cupbearer of the king of Egypt and the baker sinned against their master, the king of Egypt.
translation:
  language: ta
  text: இவற்றுக்குப் பிறகு[a], எகிப்து அரசனின் பானம் பரிமாறுபவனும் அப்பம் சுடுபவனும் தங்கள் எஜமானாகிய எகிப்து அரசனுக்கு எதிராகப் பாவம் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்த நிகழ்வுகளுக்குப் பிறகு.’ எபிரெயக் கதைநடைத் தொடரை இன்னும் சொற்சொல்லாக, ‘இவற்றுக்குப் பிறகு நடந்ததாவது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: இவற்றுக்குப் பிறகு
  rationale: எபிரெயக் கதைநடையின் வழக்கமான நிகழ்வு மாற்றத் தொடரை, இயல்பான நவீன தமிழில் சுருக்கமாகத் தருகிறது. ‘இவை நிகழ்ந்த பிறகு’ என்பதும் சாத்தியம்; ‘அப்போது நடந்ததாவது’ போன்ற விரிவாக்கம் தேவையில்லை.
- source_word: חָטְאוּ
  choice: எதிராகப் பாவம் செய்தார்கள்
  rationale: ל முன்னிடைச்சொல் குறிக்கும் பாதிக்கப்பட்ட தரப்பையும், חטא வினையின் அறநெறி மற்றும் உறவுசார் வலிமையையும் காக்கிறது; ‘குற்றம் செய்தார்கள்’ அல்லது ‘மனவருத்தம் உண்டாக்கினார்கள்’ என்பவை பொருளை வேறுவிதமாகச் சாய்க்கலாம்.
- source_word: מַשְׁקֵה
  choice: பானம் பரிமாறுபவன்
  rationale: அரசனுக்குப் பானம் வழங்கும் அரண்மனை அலுவலரைத் தெளிவாகக் குறிக்கிறது. இவ்வசனத்தில் வெளிப்படையாக இல்லாத ‘தலைமை’ என்ற பதவிநிலையைச் சேர்க்கவில்லை.
- source_word: הָאֹפֶה
  choice: அப்பம் சுடுபவன்
  rationale: பெயர்ச்சொல் தன்மையுடைய எபிரெயப் பங்கேற்புவினை வடிவை நேரடியாகவும் பொதுவாசகர்களுக்குத் தெளிவாகவும் தருகிறது; மூலத்தில் இல்லாத உடைமைச் சொல்லைச் சேர்க்கவில்லை.
- source_word: לַאֲדֹנֵיהֶם
  choice: தங்கள் எஜமானாகிய
  rationale: இங்கு אדון தெய்வீகப் பட்டத்தை அல்ல, இருவருக்கும் மேலான மனித அதிகாரியைச் சுட்டுகிறது. ‘எஜமான்’ அரண்மனைப் பணியாளர் சூழலுக்கு ஏற்றது.
- source_word: לְמֶלֶךְ מִצְרָיִם
  choice: எகிப்து அரசனுக்கு
  rationale: ‘தங்கள் எஜமான்’ யார் என்பதை விளக்கும் இடைநிலைச் சொற்றொடராக மொழிபெயர்த்து, எபிரெயத்தில் வரும் அரச அடையாளத்தின் மறுபடியான வலியுறுத்தலைக் காக்கிறது.
theological_decisions:
- issue: חָטְאוּ என்பதன் அறநெறிசார் வலிமை
  choice: பாவம் செய்தார்கள்
  alternative: குற்றம் செய்தார்கள்
  rationale: அரசனுக்கு எதிரான அவர்களின் குறிப்பிட்ட செயல் கூறப்படாததால், எபிரெய வினையின் இயல்பான அறநெறி மற்றும் உறவுசார் பொருளைத் தணிக்காமலும் குற்றத்தின் தன்மையை ஊகிக்காமலும் வைத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ராஜா’ என்பதற்குப் பதில் நிலையான ‘அரசன்’ பயன்படுத்தப்பட்டது. அரண்மனைப் பணியை விளக்க ‘பானம் பரிமாறுபவன்’ எனத் தெளிவுபடுத்தப்பட்டுள்ளது; மூலத்தில் இல்லாத ‘தலைமை’ அல்லது உடைமைச் சுட்டு சேர்க்கப்படவில்லை.
