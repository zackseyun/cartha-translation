source:
  edition: WLC
  text: וְ/כ֥וֹס פַּרְעֹ֖ה בְּ/יָדִ֑/י וָ/אֶקַּ֣ח אֶת הָֽ/עֲנָבִ֗ים וָֽ/אֶשְׂחַ֤ט אֹתָ/ם֙ אֶל כּ֣וֹס פַּרְעֹ֔ה וָ/אֶתֵּ֥ן אֶת הַ/כּ֖וֹס עַל כַּ֥ף פַּרְעֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/011.yaml
  text: Pharaoh’s cup was in my hand[a], and I took the grapes and squeezed them into Pharaoh’s cup[c][b], and I placed the cup into Pharaoh’s hand.
translation:
  language: ta
  text: பார்வோனின் கோப்பை என் கையில் இருந்தது; நான் திராட்சைப் பழங்களை எடுத்து, அவற்றைப் பார்வோனின் கோப்பைக்குள் பிழிந்து, அந்தக் கோப்பையைப் பார்வோனின் உள்ளங்கையில் வைத்தேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כּוֹס
  choice: கோப்பை
  rationale: குடிப்பதற்கான பாத்திரத்தைக் குறிக்கும் பொதுவான சொல்லுக்கு இயல்பான நவீனத் தமிழ் இணை; அரண்மனைச் சூழலுக்கும் பொருந்துகிறது.
- source_word: בְּיָדִי
  choice: என் கையில்
  rationale: கனவுக் காட்சியின் தெளிவைத் தக்கவைக்கும் நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: וָאֶקַּח
  choice: நான் ... எடுத்து
  rationale: தொடர்ச்சியான கதைச் செயலை எளிமையாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: הָעֲנָבִים
  choice: திராட்சைப் பழங்களை
  rationale: குறிப்பிட்ட திராட்சைப் பழங்களைக் குறிக்கும் தெளிவான தமிழ் இணை.
- source_word: וָאֶשְׂחַט אֹתָם אֶל כּוֹס פַּרְעֹה
  choice: அவற்றைப் பார்வோனின் கோப்பைக்குள் பிழிந்து
  rationale: שׂחט இங்கு திராட்சையிலிருந்து சாற்றைப் பிழியும் செயலைக் குறிக்கிறது; ‘கோப்பைக்குள்’ என்பது אֶל என்பதன் இச்சூழலிலான திசையையும் விளைவையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וָאֶתֵּן
  choice: வைத்தேன்
  rationale: נתן என்பதற்கு பொதுவாக ‘கொடுத்தேன்’ எனப் பொருள் வரலாம்; ஆனால் அடுத்து வரும் இடச்சொற்றொடர் கோப்பையைப் பார்வோனின் கையில் வைக்கும் உடல்சார்ந்த செயலைக் குறிப்பதால் ‘வைத்தேன்’ பொருத்தமானது.
- source_word: עַל כַּף פַּרְעֹה
  choice: பார்வோனின் உள்ளங்கையில்
  rationale: כַּף என்பதன் குறிப்பான பொருள் ‘உள்ளங்கை’; தமிழில் ‘உள்ளங்கையில் வைத்தேன்’ என்பது மூலத்தின் காட்சியைத் தக்கவைத்தபடியே இயல்பாக உள்ளது.
