translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் தனியான காலக் குறிப்பு இல்லாததால் தொடக்கத்தில் ‘அப்போது’ அல்லது ‘இப்போது’ சேர்க்கப்படவில்லை. எபிரெய வாக்கியத்தின் தொடர்ச்சியான செயல்கள் தமிழில் அரைப்புள்ளி மற்றும் காற்புள்ளிகளால் தெளிவாக இணைக்கப்பட்டுள்ளன.
