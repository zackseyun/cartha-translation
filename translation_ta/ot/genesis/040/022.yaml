  yaml_path: translation/ot/genesis/040/022.yaml
  text: But he hanged the chief baker[a], just as Joseph had interpreted to them.
translation:
  language: ta
  text: ஆனால், அப்பம் சுடுபவர்களின் தலைவனைத் தொங்கவிட்டான்[a]; யோசேப்பு அவர்களுக்கு விளக்கிக் கூறியபடியே நடந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூக்கிலிட்டான்.” எபிரேய வினைச்சொல் பொதுவாகத் தொங்கவிடுதலைக் குறிக்கிறது; சில சூழல்களில் அது கழுவில் ஏற்றுதலையோ, மரணத்திற்குப்பின் உடலைத் தொங்கவைத்துக் காட்சிப்படுத்துதலையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: ஆனால் ...-ஐ
  rationale: வாவ் இணைப்புச்சொல் முந்தைய வசனத்துடன் மாறுபாட்டை உருவாக்குகிறது; எபிரேய நேரடி செயப்படுபொருள் குறியீட்டைத் தமிழின் ‘-ஐ’ வேற்றுமை உருபு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שַׂר הָאֹפִים
  choice: தலைமை அப்பக்காரன்
  rationale: שַׂר என்பது இங்கு அரசவையில் பொறுப்புள்ள தலைமை அதிகாரியைக் குறிக்கிறது; ‘தலைமை அப்பக்காரன்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: תָּלָה
  choice: தூக்கிலிட்டான்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘தொங்கவிடுதல்’; இச்சூழலில் மரணதண்டனையைத் தமிழில் இயல்பாகக் குறிக்க ‘தூக்கிலிட்டான்’ தேர்ந்தெடுக்கப்பட்டது. துல்லியமான தண்டனை முறை உறுதியாக இல்லாததால் அடிக்குறிப்பு ambiguity-ஐ காக்கிறது.
- source_word: כַּאֲשֶׁר
  choice: சொன்னபடியே
  rationale: யோசேப்பின் முந்தைய விளக்கத்துக்கும் நிகழ்ந்ததற்கும் உள்ள சரியான ஒத்திசைவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: פָּתַר
  choice: விளக்கம் சொன்ன
  rationale: கனவின் பொருளை விளக்குதல் என்ற פתר வினையின் சூழல்சார் பொருளை எளிய, இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: לָהֶם
  choice: அவர்களுக்கு
  rationale: பன்மை வடிவை அப்படியே காக்கிறது; இது இரு அதிகாரிகளையும் குறிக்கிறது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர்வடிவம்.
