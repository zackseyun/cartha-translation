base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/005.yaml
  text: And the two of them dreamed a dream[a], each man his own dream, in one night, each according to the interpretation of his dream—the cupbearer and the baker who belonged to the king of Egypt[d][c][b], who were confined in the prison house.
translation:
  language: ta
  text: அவர்கள் இருவரும் ஒரே இரவில் கனவு கண்டார்கள்[a]; ஒவ்வொருவரும் தம் கனவுக்குரிய விளக்கத்தின்படி கனவு கண்டார்கள்[b]. எகிப்தின் அரசனுக்குப் பணியாற்றிய[c] பானம் பரிமாறுபவனும் அப்பம் சுடுபவனும் சிறைச்சாலையில் அடைக்கப்பட்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, ‘ஒரு கனவைக் கனவு கண்டார்கள்’; எபிரெயத்தில் ஒரே வேரிலிருந்து வந்த வினைச்சொல்லும் பெயர்ச்சொல்லும் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஒவ்வொருவனும் தன் கனவின் விளக்கத்திற்கேற்ப கனவு கண்டான்.’ எபிரெய வாசகம் ஒவ்வொரு கனவுக்கும் அதனோடு பொருந்திய தனித்தனி விளக்கம் இருந்ததை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘எகிப்தின் அரசனுக்குரிய.’ இச்சொற்றொடர் அவர்கள் அரசரின் பணியோடு அதிகாரபூர்வமாக இணைக்கப்பட்டிருந்ததைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַלְמוּ חֲלוֹם
  choice: கனவு கண்டார்கள்
  rationale: எபிரெய மொழியின் ஒரே வேர்ச்சொல்லைக் கொண்ட வினை–பெயர்ச்சொல் அமைப்பைத் தமிழில் சொற்சொல்லாக மீட்டால் இயல்பற்றதாகும்; ‘கனவு கண்டார்கள்’ அதன் முழுப் பொருளையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: שְׁנֵיהֶם
  choice: அவர்கள் இருவரும்
  rationale: குறிப்பிடப்பட்ட இரு ஆண் அதிகாரிகளையும் தெளிவாகச் சுட்டி, இருமையின் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: אִישׁ חֲלֹמוֹ
  choice: ஒவ்வொருவனும் தனக்குரிய கனவைக் கண்டான்
  rationale: אִישׁ என்பதன் பகிர்ந்தளிக்கும் பொருளையும், இருவருக்கும் தனித்தனிக் கனவு இருந்ததையும் தெளிவாகக் காட்டுகிறது.
- source_word: בְּלַיְלָה אֶחָד
  choice: ஒரே இரவில்
  rationale: ‘ஒரு இரவில்’ என்ற சொற்சொல் வடிவத்தைவிட, இருவரும் அதே இரவில் கனவு கண்டார்கள் என்னும் சூழற்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִישׁ כְּפִתְרוֹן חֲלֹמוֹ
  choice: ஒவ்வொருவனுடைய கனவும் அதற்கே உரிய பொருளைக் கொண்டிருந்தது
  rationale: כְּ குறிக்கும் பொருத்தத்தையும், ஒவ்வொரு கனவுக்கும் தனக்கேற்ற விளக்கம் இருந்ததையும் தெரிவிக்கிறது; கனவின் விளக்கத்தை இங்கேயே வெளிப்படுத்தாமல் அதன் உட்பொருளை மட்டும் சுட்டுகிறது.
- source_word: הַמַּשְׁקֶה
  choice: பானம் பரிமாறுபவன்
  rationale: அரசருக்குப் பானம் பரிமாறும் அதிகாரியை, இன்றைய வாசகர்களுக்கு புரியும் இயல்பான தமிழில் குறிக்கிறது; இவ்வசனத்தில் இல்லாத ‘தலைமை’ என்ற கூறு சேர்க்கப்படவில்லை.
- source_word: הָאֹפֶה
  choice: அப்பம் சுடுபவன்
  rationale: தொழிலை நேரடியாகவும் தெளிவாகவும் குறிக்கிறது; இவ்வசனத்தில் வெளிப்படையாக இல்லாத ‘தலைமை’ என்ற பதவி சேர்க்கப்படவில்லை.
- source_word: אֲשֶׁר לְמֶלֶךְ מִצְרַיִם
  choice: எகிப்தின் அரசனுக்குப் பணியாற்றிய
  rationale: לְ குறிக்கும் அரசருடனான அதிகாரபூர்வத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; உடைமை எனத் தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
- source_word: אֲסוּרִים בְּבֵית הַסֹּהַר
  choice: சிறைச்சாலையில் அடைக்கப்பட்டிருந்தார்கள்
  rationale: אסר என்பதன் கட்டப்பட்டிருத்தல்/சிறைப்படுத்தப்படுதல் என்ற பொருளைச் சிறைச் சூழலில் துல்லியமாகத் தருகிறது.
theological_decisions:
- issue: ஒவ்வொரு கனவுக்கும் இருந்த ‘பொருள்/விளக்கம்’
  choice: அதற்கே உரிய பொருளைக் கொண்டிருந்தது
  alternative: தன் கனவின் விளக்கத்திற்கேற்ப
  rationale: எபிரெய உரையின் சுருக்கமான, ஓரளவு தெளிவின்மை கொண்ட தொடர்பை முழுமையாகத் தீர்மானிக்காமல் பாதுகாக்கிறது; ஒவ்வொரு கனவுக்கும் அதனோடு பொருந்தும் தனி விளக்கம் இருப்பதை மட்டும் தெரிவிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் தெளிவும் காக்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது. ‘பானம் பரிமாறுபவன்’, ‘அப்பம் சுடுபவன்’ ஆகியவை பழமையான அல்லது சமயமரபுச் சொற்களைத் தவிர்த்து அலுவல்களின் பொருளை நேரடியாகத் தருகின்றன.
