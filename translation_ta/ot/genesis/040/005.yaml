- from: அவர்கள் இருவரும் ஒரே இரவில் கனவு கண்டார்கள்[a]. ஒவ்வொருவனும் தனக்குரிய கனவைக் கண்டான்; ஒவ்வொருவனுடைய கனவும் அதற்கே உரிய பொருளைக் கொண்டிருந்தது[b]. எகிப்தின் அரசனுக்குப் பணியாற்றிய[c] பானம் பரிமாறுபவனும் அப்பம் சுடுபவனுமாகிய அவர்கள் சிறைச்சாலையில் அடைக்கப்பட்டிருந்தார்கள்.
  to: அவர்கள் இருவரும் ஒரே இரவில் கனவு கண்டார்கள்[a]; ஒவ்வொருவரும் தம் கனவுக்குரிய விளக்கத்தின்படி கனவு கண்டார்கள்[b]. எகிப்தின் அரசனுக்குப் பணியாற்றிய[c] பானம் பரிமாறுபவனும் அப்பம் சுடுபவனும் சிறைச்சாலையில் அடைக்கப்பட்டிருந்தார்கள்.
  rationale: கனவுக்கு ‘பொருள் இருந்தது’ என்று கூறும் விளக்கத்தை, மூலத்தின் פִתְרוֹן (‘விளக்கம்’) மற்றும் כְּ (‘ஏற்ப/படி’) ஆகியவற்றைப் பாதுகாக்கும் வடிவமாக மாற்றியுள்ளேன். வாக்கியப் பிரிப்பும் அலுவல் பெயர்களும் தக்கவைக்கப்பட்டுள்ளன.
