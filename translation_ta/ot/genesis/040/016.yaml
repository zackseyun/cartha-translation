base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/016.yaml
  text: When the chief baker saw that he had interpreted well[a], he said to Yoseph, “I also had a dream, and behold, three baskets of white bread were on my head.”
translation:
  language: ta
  text: அப்பம் சுடுபவர்களின் தலைவன், யோசேப் நன்றாக விளக்கம் கூறியதைக் கண்டபோது, அவரிடம், “நானும் ஒரு கனவு கண்டேன். இதோ, என் தலையின்மேல் வெள்ளை அப்பங்கள் உள்ள மூன்று கூடைகள்[a] இருந்தன” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சுட்ட உணவுப் பொருட்கள் உள்ள மூன்று கூடைகள்.” חֹרִי என்ற எபிரெயச் சொல்லின் பொருள் உறுதியற்றது; அது வெள்ளை அப்பங்களையோ பலகாரங்களையோ குறிக்கலாம், அல்லது பின்னப்பட்ட அல்லது துளைகளுள்ள கூடைகளை விவரிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר הָאֹפִים
  choice: அப்பம் சுடுபவர்களின் தலைவன்
  rationale: שַׂר என்பது தலைமை அதிகாரியையும் הָאֹפִים என்பது அப்பம் அல்லது சுட்ட உணவுப் பொருட்களைத் தயாரிப்பவர்களையும் குறிக்கிறது. நவீனத் தமிழில் பணியின் தன்மையையும் தலைமை நிலையையும் தெளிவாகக் காட்டும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: כִּי טוֹב פָּתָר
  choice: நன்றாக விளக்கம் கூறியதைக்
  rationale: טוֹב இங்கு விளக்கத்தின் தரம் அல்லது ஏற்றத்தன்மையைக் குறிக்கலாம். ‘நன்றாக’ என்பது அந்த மதிப்பீட்டைத் தக்கவைத்தாலும், கோப்பைக்காரனுக்குச் சாதகமான விளக்கம் என்பதாக மட்டும் பொருளைக் குறுக்காது.
- source_word: אַף אֲנִי בַּחֲלוֹמִי
  choice: நானும் ஒரு கனவு கண்டேன்
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமான, வினைச்சொல் விடுபட்ட கனவு அறிக்கை. தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்கத் தேவையான வினைச்சொல் சேர்க்கப்பட்டு, אַף אֲנִי என்பதன் ‘நானும்’ என்ற கூட்டுப்பொருள் பாதுகாக்கப்பட்டது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கனவுக் காட்சியை உயிரோட்டமாக அறிமுகப்படுத்தும் הִנֵּה என்பதன் சுட்டும் தன்மையை ‘இதோ’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: שְׁלֹשָׁה סַלֵּי חֹרִי
  choice: வெள்ளை அப்பங்கள் உள்ள மூன்று கூடைகள்
  rationale: חֹרִי அரிதானதும் பொருள் உறுதியற்றதுமான சொல். முதன்மை உரையில் பாரம்பரியமாக ஏற்கப்பட்ட ‘வெள்ளை அப்பங்கள்’ என்ற பொருள் கொள்ளப்பட்டது; சுட்ட உணவுப் பொருட்கள் அல்லது பின்னப்பட்ட/துளைகளுள்ள கூடைகள் என்ற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டன.
- source_word: עַל רֹאשִׁי
  choice: என் தலையின்மேல்
  rationale: எளிய இடத்தொடரைத் துல்லியமாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: יוֹסֵף
  choice: யோசேப்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பைத் தமிழில் நேரடியாகவும் வாசிக்க எளிதாகவும் ஒலிபெயர்க்கிறது.
