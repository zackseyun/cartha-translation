id: GEN.41.25
reference: Genesis 41:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל פַּרְעֹ֔ה חֲל֥וֹם פַּרְעֹ֖ה אֶחָ֣ד ה֑וּא אֵ֣ת אֲשֶׁ֧ר הָ/אֱלֹהִ֛ים עֹשֶׂ֖ה הִגִּ֥יד לְ/פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/025.yaml
  text: Then Joseph said to Pharaoh[a], “Pharaoh’s dreams are one[b]; what God is doing he has declared to Pharaoh.”
translation:
  language: ta
  text: அப்போது யோசேப்பு பார்வோனிடம், “பார்வோனின் கனவு ஒன்றே[a]; தேவன் செய்வதை[b] அவர் பார்வோனுக்கு அறிவித்திருக்கிறார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘கனவு’ என்பது ஒருமையில் உள்ளது; சூழலில் பார்வோனின் இரண்டு கனவுகளும் ஒரே செய்தியைத் தருவதாக யோசேப்பு கூறுகிறார். எனவே, ‘பார்வோனின் கனவுகள் ஒன்றே’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘செய்துகொண்டிருப்பதை’ அல்லது, இச்சூழலில், ‘செய்யப்போவதை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயப் பங்கேற்புச் சொல் காலத்தைத் துல்லியமாக வரையறுக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ இயல்பான நவீனத் தமிழில் அந்தத் தொடர்ச்சியைத் தெரிவிக்கிறது.
- source_word: יוֹסֵף אֶל־פַּרְעֹה
  choice: யோசேப்பு பார்வோனிடம்
  rationale: தனிப்பெயருக்கும் எகிப்திய அரசரின் பட்டத்திற்கும் வழக்கமான தமிழ் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; பேசப்படுபவரைக் குறிக்க ‘இடம்’ உருபு இயல்பாக உள்ளது.
- source_word: חֲלוֹם פַּרְעֹה אֶחָד הוּא
  choice: பார்வோனின் கனவு ஒன்றே
  rationale: எபிரெயத்தில் ‘கனவு’ ஒருமையில் உள்ளது. சூழலில் இரண்டு கனவுகள் ஒரே செய்தியாக இருப்பதைக் குறித்தாலும், மூலத்தின் ஒருமையையும் ‘ஒன்று’ என்ற வலியுறுத்தலையும் இவ்வடிவம் காக்கிறது.
- source_word: אֵת אֲשֶׁר הָאֱלֹהִים עֹשֶׂה
  choice: தேவன் செய்வதை
  rationale: ‘எதை/எதைச் செய்கிறாரோ அதை’ என்ற பொருளுடைய பொருட்கிளவியை இயல்பான தமிழில் தருகிறது. நிகழ்காலப் பங்கேற்புச் சொல்லின் தொடரும் அல்லது வரவிருக்கும் செயல் சார்ந்த காலத் திறப்பை ‘செய்வதை’ தேவையின்றி குறுக்கவில்லை.
- source_word: הִגִּיד לְפַרְעֹה
  choice: அவர் பார்வோனுக்கு அறிவித்திருக்கிறார்
  rationale: נגד என்பதன் ஹிபீல் வடிவம் ‘தெரிவித்தல்/அறிவித்தல்’ எனப் பொருள்படும். நிறைவுற்ற வெளிப்படுத்துதலை ‘அறிவித்திருக்கிறார்’ தெளிவாகவும் மரியாதையான நடையிலும் தருகிறது.
theological_decisions:
- issue: הָאֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: தேவன்
  alternative: கடவுள்
  rationale: இங்கு குறிப்பிட்ட ஒரே தேவனைச் சுட்டுவதால், தமிழ் வேதாகம நடையில் இயல்பான ‘தேவன்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் இல்லாத மேலதிகக் கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
- issue: עֹשֶׂה என்பதன் கால நுணுக்கம்
  choice: செய்வதை
  alternative: செய்யப்போவதை / செய்துகொண்டிருப்பதை
  rationale: எபிரெயப் பங்கேற்புச் சொல் இச்சூழலில் தேவன் நிகழ்த்தவிருப்பதைக் குறிக்கக்கூடும்; இருப்பினும் எதிர்காலத்தையோ நடந்துகொண்டிருக்கும் செயலையோ மட்டும் கட்டாயப்படுத்தாமல் மூலத்தின் நெகிழ்வை ‘செய்வதை’ காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூல எபிரெயத்தின் ஒருமை வடிவமும், தேவனுடைய செயலைக் குறிக்கும் பங்கேற்புச் சொல்லின் காலத் தெளிவின்மையும் முதன்மை உரையிலும் அடிக்குறிப்புகளிலும் பாதுகாக்கப்பட்டுள்ளன.
