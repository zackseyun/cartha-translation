- from: அப்போது பார்வோன் யோசேப்பிடம், “கடவுள் இவை அனைத்தையும் உனக்கு அறிவித்திருப்பதால்[a], உன்னைப்போல் விவேகமும் ஞானமும் உள்ளவன் எவனும் இல்லை” என்றான்.
