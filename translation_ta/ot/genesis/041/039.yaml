source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף אַחֲרֵ֨י הוֹדִ֧יעַ אֱלֹהִ֛ים אוֹתְ/ךָ֖ אֶת כָּל זֹ֑את אֵין נָב֥וֹן וְ/חָכָ֖ם כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/039.yaml
  text: Then Pharaoh said to Joseph[a], “Since God has made all this known to you, there is no one as discerning and wise as you.”
translation:
  language: ta
  text: அப்போது பார்வோன் யோசேப்பிடம், “கடவுள் இவை அனைத்தையும் உனக்குத் தெரியப்படுத்தியிருப்பதால்[a], உன்னைப்போல் விவேகமும் ஞானமும் உள்ளவர் எவரும் இல்லை” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் இவை அனைத்தையும் உனக்குத் தெரியப்படுத்திய பின்பு.” எபிரெயச் சொல் நேரடியாக ‘பின்பு’ என்று மொழிபெயர்க்கப்படலாம்; இங்கு அது பார்வோனின் முடிவுக்கான அடிப்படையையும் உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: தொடர்ச்சியான வாவ் கதைநிகழ்வை முன்னெடுத்துச் செல்கிறது; நவீன தமிழில் நிகழ்வின் வரிசையை இயல்பாகக் காட்ட ‘அப்போது’ பயன்படுத்தப்பட்டது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரசருக்கான பட்டத்தின் தமிழில் வழக்கமான வேதாகம வடிவம்.
- source_word: אַחֲרֵי
  choice: '... அறிவித்திருப்பதால்'
  rationale: அடிப்படைப் பொருள் ‘பின்பு’ என்றாலும், இங்கு பார்வோனின் முடிவுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; ‘-தால்’ அந்த காரணவியல் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הוֹדִיעַ
  choice: அறிவித்திருப்பதால்
  rationale: ידע என்பதன் ஹிஃபீல் வடிவம் ‘அறியச் செய், அறிவி’ என்று பொருள்படும்; ‘அறிவித்திருப்பது’ அதன் காரணவினைப் பொருளைக் காக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வினை அமைப்பும் சூழலும் ஒருமைத் தெய்வத்தையே குறிப்பதால், இயல்பான ஒருமை வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶת כָּל זֹאת
  choice: இவை அனைத்தையும்
  rationale: யோசேப்பு விளக்கிக் கூறிய முழு காரியத்தையும் குறிக்கும் சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: אֵין
  choice: எவனும் இல்லை
  rationale: எவரும் இருப்பதில்லை என்ற எபிரெய இருப்புமறுப்பை ஒப்பீட்டு வாக்கியத்தில் இயல்பான தமிழில் தருகிறது.
- source_word: נָבוֹן
  choice: விவேகம் உள்ளவன்
  rationale: சூழலை உணர்ந்து பகுத்தறியும் திறனைச் சுட்டுகிறது; யோசேப்பு வெளிப்படுத்திய நுண்ணுணர்வுக்கு ‘விவேகம்’ பொருத்தமானது.
- source_word: וְחָכָם
  choice: ஞானம் உள்ளவன்
  rationale: חכם என்பதன் வழக்கமான பொருளான ஞானத்தைத் தக்கவைத்து, נבון உடன் இணைந்த இரட்டைக் கருத்தையும் காக்கிறது.
- source_word: כָּמוֹךָ
  choice: உன்னைப்போல்
  rationale: எதிர்மறை இருப்புக் கூற்றுடன் வரும் ஒப்பீட்டை இயல்பாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பார்வோனின் பேச்சில் אֱלֹהִים என்பதன் குறிப்பு
  choice: கடவுள்
  alternative: தெய்வங்கள்
  rationale: אֱלֹהִים சில சூழல்களில் பன்மைப் பொருள் கொள்ளக்கூடியது. ஆனால் இங்குள்ள வினை அமைப்பும், யோசேப்புக்கு விளக்கத்தை வெளிப்படுத்திய தெய்வத்தைப் பார்வோன் குறிப்பிடும் உடனடிச் சூழலும் ஒருமைப் பொருளை ஆதரிக்கின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘விவேகமும் ஞானமும்’ என்ற இணைச்சொற்கள் எபிரெய மூலத்தின் இரு தனித்த பண்புகளையும் காக்கின்றன; வாக்கியம் பொதுவாசகர்களுக்கு இயல்பாக இருக்கும்படி அமைக்கப்பட்டுள்ளது.
