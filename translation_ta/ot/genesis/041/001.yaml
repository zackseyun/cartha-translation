base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/001.yaml
  text: At the end of two full years[a], Pharaoh dreamed, and behold[b], he was standing by the Nile.
translation:
  language: ta
  text: இரண்டு முழு ஆண்டுகள் முடிந்தபோது[a], பார்வோன் கனவு கண்டான்; இதோ, அவன் நைல் நதியருகே[b] நின்றுகொண்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘இரண்டு ஆண்டுகள் நாட்கள்’; முழுமையான இரண்டு ஆண்டு காலத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘நதி’; எகிப்தியச் சூழலில் இது நைல் நதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ
  choice: முடிந்தபோது
  rationale: வַיְהִי என்ற கதைத் தொடர் வடிவத்தையும் מִקֵּץ குறிக்கும் காலப்பகுதியின் முடிவையும், இயல்பான தமிழில் ஒரே காலத் தொடராகத் தருகிறது.
- source_word: שְׁנָתַיִם יָמִים
  choice: இரண்டு முழு ஆண்டுகள்
  rationale: சொல்லுக்குச் சொல் ‘இரண்டு ஆண்டுகள் நாட்கள்’ எனும் எபிரெய மரபுத்தொடர், இரண்டு ஆண்டுகள் முழுமையாக நிறைவடைந்ததை வலியுறுத்துகிறது.
- source_word: פַרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரச பட்டத்திற்கான தமிழில் நிலைபெற்ற வேதாகமப் பெயர்ப்பு.
- source_word: חֹלֵם
  choice: கனவு கண்டான்
  rationale: எபிரெயப் பங்கேற்புவினை கனவுக் காட்சியை அறிமுகப்படுத்துகிறது; ‘கனவு கண்டான்’ என்பது தமிழில் இயல்பான கதைநடை.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கனவில் தோன்றும் காட்சியின் மீது திடீரெனவும் உயிரோட்டமாகவும் கவனத்தை ஈர்க்கும் மூலமொழிக் குறியீட்டைத் தக்கவைக்கிறது.
- source_word: עֹמֵד
  choice: நின்றுகொண்டிருந்தான்
  rationale: பங்கேற்புவினை சித்தரிக்கும் தொடர்நிலைக் காட்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל
  choice: அருகே
  rationale: ஆற்றங்கரையைச் சார்ந்த இச்சூழலில் עַל என்பது ‘மேல்’ என்பதைக் காட்டிலும் ‘அருகே/பக்கத்தில்’ என்ற இட உறவைக் குறிக்கிறது.
- source_word: הַיְאֹר
  choice: நைல் நதி
  rationale: சொல் பொதுவாக ‘நதி’ என்று பொருள்படக்கூடியதாயினும், இங்கு எகிப்தியச் சூழலில் குறிப்பாக நைல் நதியையே குறிக்கிறது.
