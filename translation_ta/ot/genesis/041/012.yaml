base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/012.yaml
  text: And there with us was a young Hebrew man[a], a servant of the captain of the guard, and we told him, and he interpreted our dreams for us[c][b]; he interpreted each man's dream according to his dream.
translation:
  language: ta
  text: அங்கே எங்களோடு எபிரெய இளைஞன் ஒருவன் இருந்தான்; அவன் காவலர் தலைவனுடைய அடிமை. நாங்கள் அவனிடம் எங்கள் கனவுகளைச் சொன்னோம்; அவன் அவற்றை எங்களுக்காக விளக்கினான். ஒவ்வொருவனுக்கும் அவனவன் கனவின்படியே விளக்கம் சொன்னான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஒவ்வொருவனுக்கும் அவனுடைய கனவின்படி விளக்கினான்”; அதாவது, ஒவ்வொருவருடைய கனவுக்கும் பொருத்தமான விளக்கத்தை அவன் அளித்தான்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר עִבְרִי
  choice: எபிரெய இளைஞன்
  rationale: נַעַר என்பது இங்கு சிறுவன் என்பதைவிட இளைஞனைக் குறிக்கிறது; עִבְרִי என்ற இன அடையாளம் இயல்பான தமிழில் ‘எபிரெய’ என வழங்கப்படுகிறது.
- source_word: עֶבֶד
  choice: அடிமை
  rationale: யோசேப்பு காவலர் தலைவனுக்குச் சொந்தமான பிணைப்புநிலையில் இருந்ததை எபிரெயச் சொல் தெளிவாகக் காட்டுவதால் ‘வேலைக்காரன்’ என்பதைவிட ‘அடிமை’ பொருத்தமானது.
- source_word: שַׂר הַטַּבָּחִים
  choice: காவலர் தலைவன்
  rationale: சொல்லின் நேரடிப் பின்னணி கொலையாளிகள் அல்லது தண்டனை நிறைவேற்றுவோர் குழுவின் தலைவனைக் குறிக்கலாம்; ஆனால் ஆதியாகமத்தின் எகிப்திய அரசவைக் சூழலில் இது காவல் அதிகாரியின் பதவிப்பெயராக இயல்பாகப் புரிகிறது.
- source_word: וַנְּסַפֶּר לוֹ
  choice: நாங்கள் அவனிடம் எங்கள் கனவுகளைச் சொன்னோம்
  rationale: ספר இங்கு கனவுகளை விவரித்துச் சொல்வதைக் குறிக்கிறது; தமிழில் பொருளைத் தெளிவாக்க ‘எங்கள் கனவுகளை’ இவ்வாக்கியத்துடன் இயல்பாக இணைத்துள்ளோம்.
- source_word: וַיִּפְתָּר לָנוּ אֶת חֲלֹמֹתֵינוּ
  choice: அவன் அவற்றை எங்களுக்காக விளக்கினான்
  rationale: פתר கனவுச் சூழலில் அதன் பொருளை விளக்குதல் அல்லது உரைத்தல் ஆகும். முன்னரே ‘கனவுகள்’ வந்ததால் ‘அவற்றை’ என்பது இயல்பான தமிழ்; ‘எங்களுக்காக’ மூலம் לָנוּ பாதுகாக்கப்படுகிறது.
- source_word: אִישׁ כַּחֲלֹמוֹ פָּתָר
  choice: ஒவ்வொருவனுக்கும் அவனவன் கனவின்படியே விளக்கம் சொன்னான்
  rationale: எபிரெய வாக்கியம் ஒவ்வொரு நபரின் கனவிற்கும் தனித்தனி விளக்கம் அளிக்கப்பட்டதை வலியுறுத்துகிறது. ‘அவனவன்’ அதன் பகிர்வுநிலையையும், ‘கனவின்படியே’ כַּ முன்னொட்டின் பொருத்தத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
