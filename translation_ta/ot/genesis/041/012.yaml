translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. மூலத்தின் தொடர்ச்சியான வாவ் அமைப்பை அப்படியே சுமக்காமல், தமிழில் வாசிக்க இயலுமாறு மூன்று வாக்கியங்களாகப் பிரித்துள்ளோம். ‘அடிமை’ மூலத்தில் உள்ள சமூகப் பிணைப்பை மறைக்காமல் பாதுகாக்கிறது.
