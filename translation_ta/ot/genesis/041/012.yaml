  source_fidelity: 'மூல எபிரெயத்தின் எல்லா முக்கியக் கூறுகளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: யோசேப்பு இளைஞனாகவும் எபிரெயனாகவும், காவலர் தலைவனின் அடிமையாகவும் அடையாளப்படுத்தப்படுகிறார்; கனவுகள் அவரிடம் சொல்லப்பட்டதும், அவர் அவற்றை விளக்கியதும், ஒவ்வொருவருக்கும் அவரவர் கனவுக்கு ஏற்ப விளக்கம் அளித்ததும் தெளிவாக உள்ளது. לָנוּ என்பதன் பயனும் ‘எங்களுக்காக’ எனப் பாதுகாக்கப்பட்டுள்ளது.'
  naturalness: உரை நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. மூலத்தின் இணைப்புச் சங்கிலியைத் தமிழுக்கு ஏற்ற மூன்று வாக்கியங்களாகப் பிரித்திருப்பது வாசிப்பை மேம்படுத்துகிறது. ‘ஒவ்வொருவனுக்கும் அவனவன் கனவின்படியே’ என்பது பகிர்வான வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
