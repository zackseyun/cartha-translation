  text: וְ/יִקְבְּצ֗וּ אֶת כָּל אֹ֨כֶל֙ הַ/שָּׁנִ֣ים הַ/טֹּבֹ֔ת הַ/בָּאֹ֖ת הָ/אֵ֑לֶּה וְ/יִצְבְּרוּ בָ֞ר תַּ֧חַת יַד פַּרְעֹ֛ה אֹ֥כֶל בֶּ/עָרִ֖ים וְ/שָׁמָֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/035.yaml
  text: Let them gather all the food of these coming good years[a], and let them store up grain under Pharaoh’s authority as food in the cities[b], and let them keep it.
translation:
  language: ta
  text: இந்த வரவிருக்கும் நல்ல ஆண்டுகளின் உணவுப்பொருட்களையெல்லாம் அவர்கள் சேகரிக்கட்டும். பார்வோனின் அதிகாரத்தின் கீழ்[a] தானியத்தை நகரங்களில் உணவுக்காகச் சேமித்து, அதைப் பாதுகாத்து வைக்கட்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘பார்வோனின் கையின் கீழ்’; இது அவரது அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அதை வைத்திருக்கட்டும்’ அல்லது ‘அதைக் காக்கட்டும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִקְבְּצוּ
  choice: அவர்கள் சேகரிக்கட்டும்
  rationale: யோசேப்பின் ஆலோசனைச் சூழலில் இது வெறும் எதிர்காலக் கூற்றாக அல்லாமல், செய்யப்பட வேண்டியதை முன்மொழியும் கட்டளைநயத்துடன் உள்ளது.
- source_word: כָּל אֹכֶל
  choice: உணவையெல்லாம்
  rationale: אֹכֶל என்பது உணவு அல்லது உணவுப்பொருட்களைப் பொதுவாகக் குறிக்கிறது; செழிப்பான ஆண்டுகளின் விளைபொருட்களை உள்ளடக்கும் இயல்பான தமிழ்ச் சொல் இது.
- source_word: הַשָּׁנִים הַטֹּבוֹת הַבָּאֹת הָאֵלֶּה
  choice: வரவிருக்கிற இந்த நல்ல ஆண்டுகளில் கிடைக்கும்
  rationale: ‘இந்த’ என்பது எபிரெய மொழியின் சுட்டுப்பொருளையும், ‘வரவிருக்கிற’ என்பது பங்கேற்புவினையின் எதிர்வரும் கால நயத்தையும் காக்கிறது. ‘கிடைக்கும்’ என்பது உணவு அந்த ஆண்டுகளின் விளைவு என்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: וְיִצְבְּרוּ
  choice: சேமித்து
  rationale: இந்த வினை பெருமளவில் குவித்துவைத்தல் அல்லது சேமித்தல் என்பதைக் குறிக்கிறது; நிர்வாகச் சூழலுக்கு ‘சேமித்து’ இயல்பாகப் பொருந்துகிறது.
- source_word: בָר
  choice: தானியம்
  rationale: בָר பொதுவாகக் கதிரடிக்கப்பட்ட தானியத்தைக் குறிக்கிறது; குறிப்பிட்ட ஒரு தானிய வகையாகக் குறுக்காமல் தமிழில் சரியாக வெளிப்படுத்துகிறது.
- source_word: תַּחַת יַד פַּרְעֹה
  choice: பார்வோனின் அதிகாரத்தின்கீழ்
  rationale: சொல்லுக்குச் சொல் ‘பார்வோனின் கையின் கீழ்’ என்ற எபிரெய மரபுத்தொடர் இங்கு அவரது அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கிறது.
- source_word: אֹכֶל בֶּעָרִים
  choice: நகரங்களில் உணவாக
  rationale: சேமிக்கப்படும் தானியம் நகரங்களில் உணவுப்பொருளாக இருக்க வேண்டும் என்ற செயல்பாட்டு நயத்தைப் பாதுகாக்கிறது.
- source_word: וְשָׁמָרוּ
  choice: அதைப் பாதுகாத்து வைக்கட்டும்
  rationale: שׁמר என்பதற்கு வைத்திருத்தல், காத்தல், பாதுகாத்தல் ஆகிய பொருள்கள் உண்டு; வருங்காலப் பயன்பாட்டிற்காகத் தானியத்தைப் பாதுகாப்பாக வைத்திருக்கும் கருத்தை இச்சொற்றொடர் இயல்பாகத் தருகிறது.
