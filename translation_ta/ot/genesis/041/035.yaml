translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான ஆலோசனை/கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய தொடரமைப்பை இயந்திரமாகப் பின்பற்றாமல், அதன் சுட்டுப்பொருள், அதிகார மரபுத்தொடர், மற்றும் שׁמר என்பதன் பொருள் விரிவைத் தக்கவைத்துள்ளோம். வழங்கப்பட்ட ஆங்கில உரையில் அடிக்குறிப்பு குறியீடுகளின் இடமும் அடிக்குறிப்பு உள்ளடக்கமும் பொருந்தாததால், மூல எபிரெயச் சொற்றொடர்களுக்கேற்ற இடங்களில் [a], [b] அமைக்கப்பட்டுள்ளன.
