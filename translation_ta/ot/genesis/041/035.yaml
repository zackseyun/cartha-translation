revisions:
- from: வரவிருக்கிற இந்த நல்ல ஆண்டுகளில் கிடைக்கும் உணவையெல்லாம் அவர்கள் சேகரிக்கட்டும். பார்வோனின் அதிகாரத்தின்கீழ்[a] தானியத்தை நகரங்களில் உணவாகச் சேமித்து, அதைப் பாதுகாத்து வைக்கட்டும்[b].
  to: இந்த வரவிருக்கும் நல்ல ஆண்டுகளின் உணவுப்பொருட்களையெல்லாம் அவர்கள் சேகரிக்கட்டும். பார்வோனின் அதிகாரத்தின் கீழ்[a] தானியத்தை நகரங்களில் உணவுக்காகச் சேமித்து, அதைப் பாதுகாத்து வைக்கட்டும்[b].
  rationale: The revision removes a small explanatory addition, uses more standard modern Tamil spacing for the postposition, and clarifies that the city-stored grain is intended as food. Footnote anchors are retained at the Hebrew idiom ‘under Pharaoh’s hand’ and at the preservation verb respectively.
