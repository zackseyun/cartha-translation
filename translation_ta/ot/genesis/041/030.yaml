translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. முதல் வாக்கியத்தில் இயல்பான தமிழ் சொல்வரிசை தேர்ந்தெடுக்கப்பட்டுள்ளது. ‘விழுங்கிவிடும்’ என்ற உயிருள்ள உருவகம் மூலத்தின் தீவிரத்தைத் தக்கவைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. ஆலோசனை ஆங்கில உரையில் அடிக்குறி இடங்கள் அவற்றின் உள்ளடக்கத்துடன் பொருந்தாததால், [a] செழிப்புக்குப் பின்னும் [b] பஞ்சம் நாட்டை விழுங்கும் கூற்றுக்குப் பின்னும் பொருத்தமாக வைக்கப்பட்டுள்ளன.
