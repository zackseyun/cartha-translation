source:
  edition: WLC
  text: וְ֠/קָמוּ שֶׁ֜בַע שְׁנֵ֤י רָעָב֙ אַחֲרֵי/הֶ֔ן וְ/נִשְׁכַּ֥ח כָּל הַ/שָּׂבָ֖ע בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/כִלָּ֥ה הָ/רָעָ֖ב אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/030.yaml
  text: Then seven years of famine will arise after them[a], and all the abundance in the land of Egypt will be forgotten[b], and the famine will consume the land.
translation:
  language: ta
  text: அவற்றுக்குப் பிறகு ஏழு ஆண்டுகள் பஞ்சம் நிலவும். எகிப்து நாட்டின் செழிப்பு அனைத்தும் மறக்கப்படும்[a]; அந்தப் பஞ்சம் நாட்டை விழுங்கிவிடும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மிகுதி அனைத்தும்.’ எபிரேயச் சொல் நிறைவு அல்லது மிகுதியைக் குறிக்கிறது; இங்கு அது பஞ்சத்துக்கு மாறான வளமான நிலையைச் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பஞ்சம் நாட்டை அழித்துவிடும்.’ எபிரேய வினைச்சொல் முற்றாகத் தீர்த்துவிடுதல் அல்லது அழிவுக்குக் கொண்டுவருதல் என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמוּ
  choice: ஏற்படும்
  rationale: வரப்போகும் நிகழ்வை முன்னறிவிக்கும் சூழலில் உள்ள வினைச்சொல்லின் எதிர்காலப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; எபிரேயத்தின் ‘எழுதல்/தோன்றுதல்’ என்ற உருவகத்தைச் சொற்சொல்லாகத் திணிக்காமல் நிகழ்வின் தொடக்கத்தை வெளிப்படுத்துகிறது.
- source_word: שֶׁבַע שְׁנֵי רָעָב
  choice: ஏழு ஆண்டுகள் பஞ்சம்
  rationale: எபிரேய இணைப்புத் தொடரைத் தெளிவான தமிழில் வழங்குகிறது. רָעָב இச்சூழலில் தனிப்பட்ட பசியை அல்ல, நாடளாவிய உணவுப் பற்றாக்குறையான பஞ்சத்தைக் குறிக்கிறது.
- source_word: אַחֲרֵיהֶן
  choice: அவற்றுக்குப் பிறகு
  rationale: பெண்பால் பன்மை விகுதி முந்தைய வசனத்தில் கூறப்பட்ட செழிப்பான ஏழு ஆண்டுகளைக் குறிக்கிறது; தமிழில் இயல்பாக அந்தப் பின்னோக்குச் சுட்டைத் தக்கவைக்கிறது.
- source_word: וְנִשְׁכַּח
  choice: மறக்கப்பட்டுப்போகும்
  rationale: שׁכח என்பதன் நிஃபால் வடிவிலுள்ள செயப்பாட்டு உணர்வையும், கடும் பஞ்சத்தால் முந்தைய செழிப்பு நினைவிலிருந்து மறைந்துபோகும் கருத்தையும் காக்கிறது.
- source_word: כָּל הַשָּׂבָע
  choice: செழிப்பு முழுவதும்
  rationale: שָׂבָע என்பது நிறைவு, மிகுதி, வளமை ஆகியவற்றைக் குறிக்கிறது. உணவுக் கையிருப்பாக மட்டும் பொருளைக் குறுக்காமல், பஞ்சத்துக்கு எதிரான பரந்த வளநிலையை ‘செழிப்பு’ தெரிவிக்கிறது.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டின்
  rationale: மொழிபெயர்ப்பில் தமிழ் உடைமைத் தொடராக அமைந்து, மறக்கப்படுவது எகிப்து நாட்டுக்குரிய செழிப்பு என்பதை இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: וְכִלָּה
  choice: விழுங்கிவிடும்
  rationale: כלה இங்கு முற்றாகத் தீர்த்துவிடுதல் அல்லது அழிவுக்குக் கொண்டுவருதல் என்ற தீவிரத்தை உடையது. ‘விழுங்கிவிடும்’ என்பது பஞ்சம் நாட்டின் வளத்தை முழுமையாக நுகரும் உருவகத்தையும் நிறைவு உணர்வையும் காக்கிறது.
- source_word: הָרָעָב
  choice: பஞ்சம்
  rationale: முன்னரே குறிப்பிடப்பட்ட அதே பஞ்சத்தைக் குறிக்கிறது; தமிழில் எழுவாயாக வரும் இவ்விடத்தில் தனி சுட்டுச் சொல் இல்லாமலேயே தொடர்பு தெளிவாக உள்ளது.
- source_word: אֶת הָאָרֶץ
  choice: அந்த நாட்டையே
  rationale: אָרֶץ இங்கு எகிப்து நாட்டைக் குறிக்கிறது. ‘அந்த’ என்பது முந்தைய குறிப்புடன் இணைக்கிறது; ‘-ஏ’ முழு நாட்டையும் தாக்கும் தீவிரத்தை இயல்பாக வெளிப்படுத்துகிறது.
