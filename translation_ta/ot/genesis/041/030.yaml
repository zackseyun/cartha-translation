  to: அவற்றுக்குப் பிறகு ஏழு ஆண்டுகள் பஞ்சம் நிலவும். எகிப்து நாட்டின் செழிப்பு அனைத்தும் மறக்கப்படும்[a]; அந்தப் பஞ்சம் நாட்டை விழுங்கிவிடும்[b].
  rationale: மூலத்தின் எதிர்காலத் தொடர்ச்சி, முந்தைய செழிப்பு ஆண்டுகளுக்கான பின்னோக்குச் சுட்டு, செழிப்பு மறக்கப்படுதல், பஞ்சத்தின் அழிவூட்டும் விளைவு ஆகியவை தக்கவைக்கப்பட்டுள்ளன. தமிழில் தேவையற்ற இரட்டைச் செயப்பாட்டையும் மூலத்துக்கு மீறிய வலியுறுத்தலையும் நீக்கி, அடிக்குறிப்பு a-வை இயல்பான நவீனத் தமிழில் திருத்தியுள்ளேன். அடிக்குறி இடங்கள் அந்தந்த சொற்றொடர்களோடு சரியாக இணைந்துள்ளன.
