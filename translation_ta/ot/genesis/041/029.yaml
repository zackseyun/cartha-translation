  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הִנֵּ֛ה שֶׁ֥בַע שָׁנִ֖ים בָּא֑וֹת שָׂבָ֥ע גָּד֖וֹל בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/029.yaml
  text: Look[b][a], seven years of great abundance are coming throughout all the land of Egypt.
translation:
  language: ta
  text: இதோ, எகிப்து நாடு முழுவதிலும் பெரும் வளம் நிறைந்த ஏழு ஆண்டுகள் வரவிருக்கின்றன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, வரவிருப்பதைத் தெளிவாகச் சுட்டிக்காட்டும் எபிரெயச் சொல்லின் உடனடித் தன்மையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: שֶׁבַע שָׁנִים
  choice: ஏழு ஆண்டுகள்
  rationale: எண்ணிக்கையையும் கால அளவையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: בָּאוֹת
  choice: வரவிருக்கின்றன
  rationale: ‘ஆண்டுகள்’ என்பதோடு பொருந்தும் பன்மை வடிவில், எபிரெயப் பங்கேற்பு வடிவம் உணர்த்தும் வருங்கால அண்மையையும் நிகழ்வின் உயிரோட்டத்தையும் வெளிப்படுத்துகிறது.
- source_word: שָׂבָע גָּדוֹל
  choice: பெரும் வளம் நிறைந்த
  rationale: இந்தக் கதைக் சூழலில் שָׂבָע என்பது வெறும் மனநிறைவை அல்ல, உணவு மற்றும் விளைச்சலின் மிகுதியைக் குறிக்கிறது; ‘பெரும் வளம் நிறைந்த’ என்பது அதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: எகிப்து நாடு முழுவதிலும்
  rationale: எகிப்தின் எல்லாப் பகுதிகளையும் உள்ளடக்கும் பரப்பளவைக் குறிக்கும் எபிரெயத் தொடரின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், அதே நேரத்தில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் பெயர்ச்சொல் சார்ந்த அமைப்பு தமிழில் இயல்பாக இருக்க ‘பெரும் வளம் நிறைந்த ஏழு ஆண்டுகள்’ என வழங்கப்பட்டுள்ளது; உணவு/விளைச்சல் மிகுதியைக் குறிக்கும் கதைக் சூழல் காக்கப்பட்டுள்ளது.
