translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொற்றொடரின் ‘வரத் தொடங்கின’ என்ற இயக்க உருவகம் காக்கப்பட்டுள்ளது; இறுதி இரண்டு கூறுகளுக்கிடையேயான முரண்பாடு தமிழில் இயல்பாகத் தெளிவுபடுத்தப்பட்டுள்ளது.
