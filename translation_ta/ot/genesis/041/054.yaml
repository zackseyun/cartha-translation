base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/054.yaml
  text: And the seven years of famine began to come[a], just as Joseph had said. And there was famine in all the lands, but in all the land of Egypt there was bread.
translation:
  language: ta
  text: யோசேப்பு சொன்னபடியே, ஏழு பஞ்ச ஆண்டுகள் வரத் தொடங்கின. எல்லா தேசங்களிலும் பஞ்சம் நிலவியது; ஆனால் எகிப்து தேசம் முழுவதிலும் அப்பம்[a] இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உணவு இருந்தது.’ எபிரெய மொழியில் ‘அப்பம்’ என்ற சொல் பொதுவாக உணவையோ உணவுப் பொருட்களையோ குறிக்கவும் பயன்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּחִלֶּינָה ... לָבוֹא
  choice: வரத் தொடங்கின
  rationale: வருதல் தொடங்கியது என்ற எபிரெய inceptive அமைப்பை இயல்பான நவீனத் தமிழில் நேரடியாகக் காக்கிறது.
- source_word: שֶׁבַע שְׁנֵי הָרָעָב
  choice: ஏழு பஞ்ச ஆண்டுகள்
  rationale: பஞ்சத்தால் குறிக்கப்படும் ஏழு ஆண்டுகள் என்ற construct தொடர்பைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: யோசேப்பு சொன்னபடியே
  rationale: குறிப்பிட்டபடியே நிகழ்ந்தது என்ற כַּאֲשֶׁר-இன் ஒப்புமைத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיְהִי רָעָב
  choice: பஞ்சம் நிலவியது
  rationale: பஞ்சம் இருந்தது என்ற existential பொருளைத் தமிழில் இயல்பாகவும் மிகைப்படுத்தாமலும் கூறுகிறது.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: எல்லா நிலப்பகுதிகளிலும்
  rationale: אֲרָצוֹת என்பதன் பன்மையையும், நவீன அரசியல் நாடுகள் என்ற குறுகிய கருத்தைத் தவிர்த்த அதன் பரந்த புவியியல் பொருளையும் காக்கிறது.
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: ஆனால் எகிப்து நாடு முழுவதிலும்
  rationale: வாவ் முறையாக ‘மற்றும்’ என்றாலும், மற்ற நிலப்பகுதிகளின் பஞ்சத்துக்கும் எகிப்தின் உணவிருப்புக்கும் இடையேயான வெளிப்படையான முரண்பாட்டை ‘ஆனால்’ தெளிவாக்குகிறது.
- source_word: הָיָה לָחֶם
  choice: அப்பம் இருந்தது
  rationale: לֶחֶם என்பதன் நேரடியான concrete பொருளை முதன்மை உரையில் காக்கிறது; அதன் விரிவான ‘உணவு’ பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
