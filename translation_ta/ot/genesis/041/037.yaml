  yaml_path: translation/ot/genesis/041/037.yaml
  text: The matter seemed good in the eyes of Pharaoh and in the eyes of all his servants[a][b].
translation:
  language: ta
  text: அந்தக் காரியம்[a] பார்வோனுக்கும் அவருடைய எல்லாப் பணியாளர்களுக்கும் நல்லதாகத் தோன்றியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்த ஆலோசனை’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב
  choice: நல்லதாக இருந்தது
  rationale: בְּעֵינֵי என்பதுடன் சேர்ந்த இந்த வினைச்சொல், ஒரு காரியம் ஒருவருக்கு நல்லதாகவோ ஏற்றதாகவோ இருந்தது என்ற மதிப்பீட்டை வெளிப்படுத்துகிறது. ‘நல்லதாக இருந்தது’ என்பது அதனை இயல்பான தமிழில் தெரிவிப்பதோடு, ‘மகிழ்வித்தது’ என்று வினையின் பொருளை மாற்றுவதையும் தவிர்க்கிறது.
- source_word: הַדָּבָר
  choice: அந்தக் காரியம்
  rationale: דָּבָר என்பதற்கு ‘காரியம்’, ‘சொல்’, ‘ஆலோசனை’ போன்ற பரந்த பொருள்கள் உண்டு. முந்தைய வசனங்களில் யோசேப்பு கூறிய திட்டமே இங்கு சுட்டப்பட்டாலும், எபிரெயச் சொல்லின் பரந்த தன்மையைப் பேண ‘அந்தக் காரியம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּעֵינֵי
  choice: பார்வையில்
  rationale: ‘கண்களில்’ என்ற எபிரெய மரபுத்தொடரின் மதிப்பீட்டுப் பொருளையும் மூலத்தின் இணை அமைப்பையும் இயல்பான தமிழில் ‘பார்வையில்’ என்பது காக்கிறது.
- source_word: פַרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரசருக்கான பட்டத்தின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: כָּל עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள் அனைவரும்
  rationale: עֲבָדִים என்பது அடிமைகள், பணியாளர்கள் அல்லது அரசவை அதிகாரிகளைக் குறிக்கலாம். இங்கு அரசவையைச் சேர்ந்தவர்களின் பணி உறவைத் தெரிவித்து, அவர்களின் துல்லியமான பதவியை தேவையின்றிக் குறுக்காமல் இருக்க ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
