  text: And behold[a], seven cows were coming up from the Nile, healthy in flesh and beautiful in form[c][b], and they grazed in the reeds.
translation:
  language: ta
  text: இதோ, நைல் ஆற்றிலிருந்து[a] உடல்வளம் மிக்க[b], தோற்றத்தில் அழகான ஏழு பசுக்கள் ஏறி வந்து, சதுப்புநிலப் புற்களில்[c] மேய்ந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆற்றிலிருந்து’; இந்த எகிப்தியச் சூழலில் எபிரேயச் சொல் நைல் ஆற்றைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், ‘உடலில் சதைநிறைவு உள்ள’; ‘கொழுத்த’ அல்லது ‘நன்கு ஊட்டம்பெற்ற’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
