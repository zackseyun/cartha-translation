source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶל עֲבָדָ֑י/ו הֲ/נִמְצָ֣א כָ/זֶ֔ה אִ֕ישׁ אֲשֶׁ֛ר ר֥וּחַ אֱלֹהִ֖ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/038.yaml
  text: Then Pharaoh said to his servants[a], “Can we find a man like this[b], in whom is the spirit of God?”
translation:
  language: ta
  text: அப்போது பார்வோன் தன் பணியாளர்களிடம், “இவரைப் போன்ற, கடவுளின் ஆவி உள்ள ஒரு மனிதனை நம்மால் கண்டுபிடிக்க முடியுமா?” என்று கேட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... கேட்டான்
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுத்துச் செல்கிறது; உரை கேள்வியாக இருப்பதால் தமிழில் ‘கேட்டான்’ இயல்பானது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்ற அரசப் பட்டப்பெயர்.
- source_word: עֲבָדָיו
  choice: தன் பணியாளர்களிடம்
  rationale: அரசவையில் பணியாற்றுவோரைக் குறிக்கும் עֶבֶד என்பதன் நேரடியான பொருளைத் தக்கவைக்கிறது; ‘அதிகாரிகள்’ என்று பதவிநிலையை மிகையாகக் குறிப்பிடவில்லை.
- source_word: הֲנִמְצָא
  choice: நம்மால் கண்டுபிடிக்க முடியுமா?
  rationale: வினாவிடைத் துகளுடன் வரும் முதலாம் பன்மை வடிவம் சொல்லாட்சிசார் வினாவைக் காட்டுகிறது; தமிழில் திறனையும் ஆலோசனைத் தன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָזֶה אִישׁ
  choice: இவரைப் போன்ற ஒரு மனிதனை
  rationale: சுட்டுப்பொருளையும் ஆண்பால் ஒருமையையும் தக்கவைத்து, சூழலில் யோசேப்பைக் குறிப்பதைத் தெளிவாக்குகிறது.
- source_word: אֲשֶׁר ... בּוֹ
  choice: அதாவது, தனக்குள் ... இருப்பவரை
  rationale: எபிரேயத்தின் ‘அவனுக்குள்/அவருக்குள்’ என்ற இடவுறவைத் தக்கவைத்தபடி, தமிழ் வாக்கியத்தில் தொடர்பு வாக்கியத்தை இயல்பாக இணைக்கிறது.
- source_word: רוּחַ אֱלֹהִים
  choice: கடவுளின் ஆவி
  rationale: இணைப்புத் தொடரின் நேரடியான மொழிபெயர்ப்பு. எபிரேயத்தில் உள்ள வரையறைத் தெளிவின்மையை தமிழ் முதன்மை உரையில் மிகையாகத் தீர்மானிக்காமல் விடுகிறது; மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: רוּחַ אֱלֹהִים என்பது குறிப்பிட்ட ‘கடவுளின் ஆவி’யையா, ‘கடவுளிடமிருந்து வந்த ஓர் ஆவி’யையா, அல்லது ‘தெய்வீக ஆவி’யையா குறிக்கிறது?
  choice: கடவுளின் ஆவி
  alternative: கடவுளிடமிருந்து வந்த ஓர் ஆவி; தெய்வீக ஆவி
  rationale: எபிரேய இணைப்புத் தொடர் இலக்கண ரீதியாக ஒன்றுக்கு மேற்பட்ட புரிதல்களுக்கு இடமளிக்கிறது. கதையின் சூழலில் யோசேப்பின் ஞானம் கடவுளோடு தொடர்புபடுத்தப்படுவதால் ‘கடவுளின் ஆவி’ இயல்பான முதன்மை வாசிப்பு; இருப்பினும் பார்வோனின் நோக்குநிலையையும் மூலத்தின் தெளிவின்மையையும் அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் சாதாரண வாசகர்களுக்கு எளிதில் புரியும் நடையில் அமைக்கப்பட்டது. சொல்லாட்சிசார் வினாவின் இயல்பைத் தக்கவைக்க ‘நம்மால் ... முடியுமா?’ பயன்படுத்தப்பட்டது. முதன்மை உரையிலுள்ள [a] குறியீடு அடிக்குறிப்புடன் பொருந்துகிறது.
