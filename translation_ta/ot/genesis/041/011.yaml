source:
  edition: WLC
  text: וַ/נַּֽחַלְמָ֥/ה חֲל֛וֹם בְּ/לַ֥יְלָה אֶחָ֖ד אֲנִ֣י וָ/ה֑וּא אִ֛ישׁ כְּ/פִתְר֥וֹן חֲלֹמ֖/וֹ חָלָֽמְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/011.yaml
  text: And we dreamed a dream in one night[a], I and he; each man dreamed according to the interpretation of his dream.
translation:
  language: ta
  text: நானும் அவனும் ஒரே இரவில்[a] கனவு கண்டோம்; நாங்கள் ஒவ்வொருவரும் தத்தம் கனவின் விளக்கத்துக்கு ஏற்றபடியே கனவு கண்டோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “ஒரு இரவில்.”
    reason: மூலத்தின் சொற்சார்ந்த மாற்றுவடிவத்தைப் பதிவு செய்து, ‘ஒரே இரவில்’ என்ற சூழல்சார் மொழிபெயர்ப்பை விளக்குகிறது.
lexical_decisions:
- source_word: וַנַּחַלְמָה חֲלוֹם
  choice: கனவு கண்டோம்
  rationale: எபிரெய மொழியில் ஒரே வேர்ச்சொல்லைக் கொண்ட வினையும் பெயரும் இணைந்து வருகின்றன. அதைச் சொற்சொல்லாக மீளுரைப்பது தமிழில் இயல்பாக இல்லாததால், வழக்கமான ‘கனவு கண்டோம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּלַיְלָה אֶחָד
  choice: ஒரே இரவில்
  rationale: சொல்லர்த்தம் ‘ஒரு இரவில்’ என்றாலும், இருவரும் அதே இரவில் கனவு கண்டனர் என்ற சூழல்சார் கருத்தை ‘ஒரே இரவில்’ தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֲנִי וָהוּא
  choice: நானும் அவனும்
  rationale: மூலத்தின் நபர் வரிசையைப் பாதுகாத்து, தமிழில் இயல்பான இணைப்புத் தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: אִישׁ
  choice: நாங்கள் ஒவ்வொருவரும்
  rationale: இங்கு இச்சொல் பகிர்நிலைப் பொருளில் வந்து, இருவருக்கும் தனித்தனியாக உரிய கனவைக் குறிக்கிறது.
- source_word: כְּפִתְרוֹן חֲלֹמוֹ
  choice: தத்தம் கனவின் விளக்கத்துக்கு ஏற்றபடி
  rationale: כְּ குறிக்கும் ஒத்திசைவு அல்லது பொருத்தத்தை ‘ஏற்றபடி’ வெளிப்படுத்துகிறது; ஒருமை ஆண்பால் பின்னொட்டு பகிர்நிலையில் இருப்பதால் ‘தத்தம்’ பயன்படுத்தப்பட்டது.
- source_word: חָלָמְנוּ
  choice: கனவு கண்டோம்
  rationale: இறுதி பன்மை வினைச்சொல் பகிர்நிலைக் கூற்றை நிறைவு செய்கிறது; மூலத்தில் உள்ள மீளுரைப்பும் தமிழில் பாதுகாக்கப்பட்டுள்ளது.
