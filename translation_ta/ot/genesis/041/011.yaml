  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் பகிர்நிலை அமைப்பையும், கனவுக்கும் அதன் விளக்கத்துக்கும் இடையிலான பொருத்தம் குறித்த சற்றே அசாதாரணமான கூற்றையும் விளக்கிச் சீராக்காமல் பாதுகாக்கிறது.
