source:
  edition: WLC
  text: וַ/יְדַבֵּר֙ שַׂ֣ר הַ/מַּשְׁקִ֔ים אֶת פַּרְעֹ֖ה לֵ/אמֹ֑ר אֶת חֲטָאַ֕/י אֲנִ֖י מַזְכִּ֥יר הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/009.yaml
  text: Then the chief cupbearer spoke to Pharaoh[a], saying, “Today I remember my offenses.”
translation:
  language: ta
  text: அப்போது பானம் பரிமாறுவோரின் தலைவர் பார்வோனிடம், “இன்று என் குற்றங்களை[a] நினைவுகூருகிறேன்” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “பாவங்களை” அல்லது “தவறுகளை.” எபிரெயச் சொல் அறநெறி சார்ந்த அல்லது அலுவல் சார்ந்த தவறு உட்பட, பொதுவாகக் குற்றம் செய்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: அப்போது ... சொன்னான்
  rationale: வாவ் தொடர் வடிவம் கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது. நவீன தமிழில் ‘அப்போது’ அந்த முன்னேற்றத்தை இயல்பாகக் காட்டுகிறது; דּבר இங்கு பேச்சை அறிமுகப்படுத்துகிறது.
- source_word: שַׂר הַמַּשְׁקִים
  choice: பானம் பரிமாறுவோரின் தலைவர்
  rationale: இது பார்வோனுக்குப் பானம் வழங்கும் அரசவைப் பணியாளர்களுக்குத் தலைமை வகித்த அதிகாரியைக் குறிக்கும். பழமையான அல்லது தெளிவற்ற பதவிப்பெயரை விட இந்தச் சொற்றொடர் நவீன வாசகருக்கு பணியைத் தெளிவாக உணர்த்துகிறது.
- source_word: אֶת־פַּרְעֹה
  choice: பார்வோனிடம்
  rationale: எபிரெயத்தில் நேரடி செயப்படுபொருள் குறியீடு இருந்தாலும், தமிழில் ஒருவரிடம் பேசுவதை ‘பார்வோனிடம்’ என்று இயல்பாகச் சொல்வது பொருத்தமானது.
- source_word: לֵאמֹר
  choice: என்று சொன்னான்
  rationale: பேச்சை அறிமுகப்படுத்தும் எபிரெய முடிவிலா வினை வடிவத்தைத் தமிழின் இயல்பான நேரடி உரை அமைப்பில் ‘என்று சொன்னான்’ என வழங்குகிறது.
- source_word: אֶת חֲטָאַי
  choice: என் குற்றங்களை
  rationale: חטא என்பது பாவங்கள், குற்றங்கள், தவறுகள் எனப் பரந்த பொருள் தரக்கூடும். இங்கு பார்வோனுக்கு எதிராக முன்பு செய்த தவறை அரசவைச் சூழலில் நினைவுகூருவதால் ‘குற்றங்கள்’ என்பது அறநெறி மற்றும் அலுவல் சார்ந்த இரு பரிமாணங்களையும் மிகைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: אֲנִי מַזְכִּיר
  choice: நினைவுகூருகிறேன்
  rationale: זכר என்பதன் ஹிஃபில் வடிவம் நினைவுக்குக் கொண்டுவருதல் அல்லது குறிப்பிடுதல் எனப் பொருள்படலாம். இங்கு பேச்சாளர் தன் முந்தைய குற்றங்களை நினைவுக்குக் கொண்டுவருவதை ‘நினைவுகூருகிறேன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: எபிரெயச் சொல்லின் கால வலியுறுத்தலை நவீன தமிழில் நேரடியாகவும் இயல்பாகவும் தக்கவைக்கிறது.
