base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/008.yaml
  text: In the morning[a], his spirit was troubled, so he sent and called all the magicians of Egypt and all its wise men. Pharaoh told them his dreams, but there was no one who could interpret them for Pharaoh.
translation:
  language: ta
  text: காலையில், அவனுடைய ஆவி கலக்கமடைந்தது. ஆகவே, அவன் ஆளனுப்பி எகிப்தின் மந்திரவாதிகள் அனைவரையும் அதன் ஞானிகள் அனைவரையும் வரவழைத்தான். பார்வோன் அவர்களிடம் தன் கனவைச் சொன்னான்; ஆனால் அவற்றை[a] பார்வோனுக்கு விளக்கிக்கூற ஒருவரும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில், முந்தைய பெயர்ச்சொல் ‘அவனுடைய கனவு’ என்று ஒருமையில் இருந்தாலும், இங்கு ‘அவற்றை’ என்று பன்மை வருகிறது. இது கனவின் பல கூறுகளைக் குறிக்கலாம் அல்லது கனவு அனுபவத்தைப் பகுத்துக் குறிப்பிடலாம். சில மொழிபெயர்ப்புகள் இதை ‘அதை’ என்று ஒருமையாக்குகின்றன.
    reason: மூலத்தில் உள்ள ஒருமை–பன்மை மாறுபாட்டைப் பாதுகாத்து விளக்குதல்.
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: காலையில்
  rationale: எபிரெயக் கதையோட்டத்தின் காலக் குறிப்பை இயல்பான நவீனத் தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: וַתִּפָּעֶם רוּחוֹ
  choice: அவனுடைய ஆவி கலக்கமடைந்தது
  rationale: רוּחַ என்பதன் ‘ஆவி’ என்ற பொருளைத் தக்கவைத்து, פעמ குறிக்கும் உள்ளார்ந்த கலக்கத்தை இயல்பாக வெளிப்படுத்துகிறது; ‘மனம்’ என்று மாற்றுவது விளக்கவுரையாகிவிடும்.
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: அவன் ஆளனுப்பி … அழைத்தான்
  rationale: இரண்டு தொடர்வினைகளையும் தமிழில் இயல்பாக இணைத்து, தூதரை அனுப்பி வரவழைத்த செயலைத் தெளிவாக்குகிறது.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: எகிப்தின் மந்திரவாதிகள்
  rationale: எகிப்திய மறைசடங்குகளிலும் கனவு விளக்கத்திலும் ஈடுபட்ட சிறப்புப் பணியாளர்களைக் குறிக்கும் சூழல்சார், பொதுவாகப் புரியும் சொல்.
- source_word: כָּל חֲכָמֶיהָ
  choice: அதன் ஞானிகள் அனைவரும்
  rationale: பெண்பால் ஒருமை பின்னொட்டு எகிப்தைக் குறிப்பதை ‘அதன்’ எனத் தக்கவைத்து, சிறப்பு மந்திரவாதிகளிலிருந்து விரிந்த அரசவை ஞானிகளை வேறுபடுத்துகிறது.
- source_word: וַיְסַפֵּר פַּרְעֹה לָהֶם אֶת חֲלֹמוֹ
  choice: பார்வோன் அவர்களிடம் தன் கனவை விவரித்தான்
  rationale: மசோரா உரையிலுள்ள ‘கனவு’ என்ற ஒருமையைப் பாதுகாத்து, סיפר என்பதன் விவரித்துச் சொல்லும் பொருளை இயல்பாகத் தருகிறது.
- source_word: וְאֵין פֹּתֵר אֹתָם לְפַרְעֹה
  choice: ஆனால் அவற்றை பார்வோனுக்கு விளக்கிக்கூற ஒருவரும் இல்லை
  rationale: פתר என்பதன் கனவைப் பொருள்விளக்கும் செயலைத் தெளிவாகக் கூறி, முந்தைய ஒருமை ‘கனவு’க்குப் பின் வரும் எபிரெயப் பன்மை சுட்டுப்பெயரை ‘அவற்றை’ எனப் பாதுகாக்கிறது.
theological_decisions:
- issue: רוּחַ என்பதைக் ‘ஆவி’ அல்லது ‘மனம்/உள்ளம்’ என மொழிபெயர்த்தல்
  choice: ஆவி
  alternative: மனம் / உள்ளம்
  rationale: மூலச்சொல்லின் மனிதனுடைய உள் ஆவி என்ற உருவகத்தையும் அதன் சாத்தியமான பொருள் அகலத்தையும் தக்கவைக்கிறது; உளவியல் பொருளாக மட்டும் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆவி’, ‘மந்திரவாதிகள்’, ‘ஞானிகள்’ ஆகியவை மூலத்தின் வேறுபாடுகளையும் பொருள் அகலத்தையும் காக்கின்றன; ஒருமை ‘கனவு’ மற்றும் பன்மை ‘அவற்றை’ இடையிலான உண்மையான உரைத் திணறல் அடிக்குறிப்புடன் தக்கவைக்கப்பட்டுள்ளது.
