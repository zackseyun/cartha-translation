source:
  edition: WLC
  text: וְ/לֹֽא יִוָּדַ֤ע הַ/שָּׂבָע֙ בָּ/אָ֔רֶץ מִ/פְּנֵ֛י הָ/רָעָ֥ב הַ/ה֖וּא אַחֲרֵי כֵ֑ן כִּֽי כָבֵ֥ד ה֖וּא מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/031.yaml
  text: And the abundance in the land will not be known because of that famine afterward[b][a], for it will be very severe.
translation:
  language: ta
  text: அதன்பின் வரும் அந்தப் பஞ்சத்தின் காரணமாக, நாட்டிலிருந்த பெருவளம் அறியப்படாமல் போகும்[a]; ஏனெனில் அந்தப் பஞ்சம் மிகவும் கடுமையானதாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உணரப்படாமல் போகும்”; எபிரெய வினைச்சொல் அறியப்படுதல், உணரப்படுதல், அல்லது கவனிக்கப்படுதல் ஆகிய பொருள்களைத் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּדַע
  choice: அறியப்படாமல் போகும்
  rationale: ידע என்பதன் நிஃபால் வடிவம் இங்கு ‘அறியப்படுதல், உணரப்படுதல்’ என்ற பொருள் தருகிறது. பின்வரும் பஞ்சத்தால் முந்தைய நிறைவு நினைவிற்கோ உணர்விற்கோ வராத நிலையை இச்சொற்றொடர் இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַשָּׂבָע
  choice: நிறைவு
  rationale: இந்தச் சூழலில் இது மிகுந்த விளைச்சலும் உணவுப் பெருக்கமும் உள்ள நிலையைச் சுட்டுகிறது. ‘நிறைவு’ என்பது மூலச்சொல்லின் பரந்த பொருளைப் பேணுகிறது.
- source_word: בָּאָרֶץ
  choice: நாட்டில்
  rationale: இங்கு குறிப்பாகப் பஞ்சத்தால் பாதிக்கப்படும் பிரதேசத்தைக் குறிக்கும்; ஆகவே ‘பூமியில்’ என்பதைக் காட்டிலும் ‘நாட்டில்’ பொருத்தமானது.
- source_word: מִפְּנֵי
  choice: பஞ்சத்தினால்
  rationale: இவ்விடத்தில் காரணத்தைச் சுட்டுவதால், ‘காரணமாக’ என்ற பொருளை இயல்பான தமிழில் ‘-இனால்’ வடிவம் தெளிவாகத் தருகிறது.
- source_word: הָרָעָב הַהוּא אַחֲרֵי כֵן
  choice: அதன்பின் வரும் அந்தப் பஞ்சம்
  rationale: אַחֲרֵי כֵן என்ற காலத்தொடரையும் הַהוּא என்ற சுட்டுப்பொருளையும் இரண்டையும் பேணி, தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: כִּי כָבֵד הוּא מְאֹד
  choice: ஏனெனில் அந்தப் பஞ்சம் மிகவும் கடுமையாக இருக்கும்
  rationale: כָבֵד என்பதன் நேரடிப் பொருள் ‘கனமானது’; பஞ்சத்தைப் பொறுத்தவரை அது ‘கடுமையானது’ என இயல்பாகப் பொருள்படும். கனவின் எதிர்காலக் குறிப்புக்கு ஏற்ப ‘இருக்கும்’ பயன்படுத்தப்பட்டுள்ளது.
