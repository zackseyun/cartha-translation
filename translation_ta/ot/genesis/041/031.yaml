revisions:
- from: அதன்பின் வரும் அந்தப் பஞ்சத்தினால், நாட்டில் முன்பு இருந்த நிறைவு அறியப்படாமல் போகும்[a]; ஏனெனில் அந்தப் பஞ்சம் மிகவும் கடுமையாக இருக்கும்.
  to: அதன்பின் வரும் அந்தப் பஞ்சத்தின் காரணமாக, நாட்டிலிருந்த பெருவளம் அறியப்படாமல் போகும்[a]; ஏனெனில் அந்தப் பஞ்சம் மிகவும் கடுமையானதாக இருக்கும்.
  rationale: The revision replaces the semantically broad and contextually awkward ‘நிறைவு’ with ‘பெருவளம்,’ which naturally communicates the preceding abundance. It also makes the causal construction smoother and retains the source’s passive ambiguity in ‘அறியப்படாமல் போகும்.’ No additional temporal or theological interpretation has been introduced.
