base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/052.yaml
  text: And he named the second Ephraim[a], for God has made me fruitful in the land of my affliction.
translation:
  language: ta
  text: இரண்டாவது மகனுக்கு எப்பிராயீம்[a] என்று பெயரிட்டான்; ஏனெனில், “என் துன்பத்தின் நாட்டில் கடவுள் என்னைப் பலுகச் செய்தார்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எப்பிராயீம்” என்ற பெயர், “என்னைப் பலுகச் செய்தார்” என்பதற்கான எபிரேயச் சொல்லுடன் ஒலித்தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת שֵׁם הַשֵּׁנִי קָרָא
  choice: இரண்டாவது மகனுக்கு … என்று பெயரிட்டான்
  rationale: எபிரேய மொழியில் உள்ள ‘இரண்டாவதின் பெயரை அழைத்தான்’ என்ற பெயரிடும் மரபுத்தொடரை இயல்பான தமிழில் தருகிறது. சூழலிலிருந்து குறிக்கப்படுவது மகன் என்பதால் தெளிவுக்காக ‘மகனுக்கு’ சேர்க்கப்பட்டுள்ளது.
- source_word: אֶפְרָיִם
  choice: எபிராயீம்
  rationale: எபிரேயப் பெயரின் ஒலியைத் தமிழில் மரபான வடிவில் எழுத்துப்பெயர்க்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: பெயருக்கான யோசேப்பின் விளக்கத்தை அறிமுகப்படுத்தும் காரண இணைப்பாக வருகிறது.
- source_word: הִפְרַנִי
  choice: என்னைப் பலுகிப் பெருகச் செய்தார்
  rationale: פרה என்பதன் ஹிஃபில் வடிவிலுள்ள ‘பலன் தரும்படி செய்தல்/பலுகச் செய்தல்’ என்ற காரணப்பொருளை வெளிப்படுத்தி, எபிராயீம் என்ற பெயருடனான சொல்விளையாட்டையும் இயன்றவரை காக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவில் பன்மையாக இருந்தாலும் வினைச்சொல் ஒருமையில் இருப்பதாலும் சூழலில் இஸ்ரவேலின் கடவுளைக் குறிப்பதாலும் ஒருமையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּאֶרֶץ עָנְיִי
  choice: என் துன்பத்தின் நாட்டில்
  rationale: ‘என் துன்பத்தின் நாடு’ என்ற எபிரேயத் தொடர்பை நெருக்கமாகக் காத்து, யோசேப்பு எகிப்தில் பெற்ற வளத்தையும் அந்நாட்டுடன் தொடர்புடைய துன்ப நினைவையும் ஒரே நேரத்தில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யோசேப்பின் பெயரிடும் விளக்கத்தின் பொருள்
  choice: யோசேப்பு தனது பெருக்கத்தைக் கடவுளின் செயலாகக் கூறிக்கொண்டே எகிப்தை ‘என் துன்பத்தின் நாடு’ என விவரிக்கிறான்.
  alternative: இது எகிப்துக்கு வருவதற்கு முந்தைய துன்பங்களை மட்டுமே குறிக்கிறது; அல்லது குடும்பத்திலிருந்து பிரிந்திருந்த நிலை உட்பட விரிந்த துன்பத்தைக் குறிக்கிறது.
  rationale: வசனம் துன்பம் எதைக் குறிப்பதாகும் என்பதைச் சுருக்கி நிர்ணயிக்கவில்லை. ஆகவே கடவுள் தந்த பெருக்கத்துக்கும் தொடரும் துன்ப நினைவுக்கும் இடையிலான பதற்றம் அப்படியே பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பலுகிப் பெருகச் செய்தார்’ என்பது பெயருடனான எபிரேயச் சொல்விளையாட்டைத் தக்கவைத்துக்கொண்டே பொதுவாசகர்களுக்குப் புரியும் வகையில் அமைந்துள்ளது.
