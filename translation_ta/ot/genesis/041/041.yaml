id: GEN.41.41
reference: Genesis 41:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶל יוֹסֵ֑ף רְאֵה֙ נָתַ֣תִּי אֹֽתְ/ךָ֔ עַ֖ל כָּל אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/041.yaml
  text: And Pharaoh said to Joseph, “See, I have set you over all the land of Egypt.”
translation:
  language: ta
  text: பார்வோன் யோசேப்பிடம், “இதோ, எகிப்து நாடு முழுவதற்கும் உன்னை அதிகாரியாக நியமித்திருக்கிறேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுக்கிறது. தமிழில் நேரடி உரைக்குப் பின் வரும் ‘என்றான்’ இயல்பாக அதே கதைநடையைத் தருகிறது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: ஆதியாகமத் தமிழ் மரபிலும் பொதுப் பயன்பாட்டிலும் எகிப்திய அரசருக்கான நிலையான பட்டப்பெயர்.
- source_word: אֶל יוֹסֵף
  choice: யோசேப்பிடம்
  rationale: பேச்சின் முகவரியை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: רְאֵה
  choice: இதோ
  rationale: இங்கு உடலால் காணும்படி கட்டளையிடுவதைக் காட்டிலும், அடுத்து வரும் அதிகாரபூர்வ அறிவிப்பின் மீது கவனம் ஈர்க்கும் உரையாடல் கூறாக உள்ளது; ‘இதோ’ அதன் வலிமையை இயல்பாகத் தருகிறது.
- source_word: נָתַתִּי אֹתְךָ עַל
  choice: உன்னை அதிகாரியாக நியமித்திருக்கிறேன்
  rationale: நேரடியாக ‘உன்னை ... மேல் வைத்திருக்கிறேன்’ எனலாம்; ஆனால் நிர்வாகச் சூழலில் נתן உடன் עַל என்பது ஒருவருக்கு ஆளும் அதிகாரம் வழங்கி அமர்த்துவதைக் குறிக்கிறது. தேர்ந்த மொழிபெயர்ப்பு அந்தப் பொருளைத் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: כָּל אֶרֶץ מִצְרָיִם
  choice: எகிப்து நாடு முழுவதற்கும்
  rationale: כָּל என்பதன் முழுமையான பரப்பையும் אֶרֶץ என்பதன் நாடு/நிலப்பரப்பு கருத்தையும் தக்கவைத்து, யோசேப்பின் அதிகார எல்லையை இயல்பாகக் காட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் அரச அறிவிப்புக்கேற்ற கண்ணியமான நடை. ‘இதோ’ என்ற கவன ஈர்ப்புச் சொல்லும் ‘அதிகாரியாக நியமித்திருக்கிறேன்’ என்ற நிர்வாகப் பொருளும் மூலத்தின் உரையாடல் வலிமையையும் சூழலையும் சமநிலைப்படுத்துகின்றன.
