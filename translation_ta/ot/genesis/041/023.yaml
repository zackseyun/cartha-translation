  text: וְ/הִנֵּה֙ שֶׁ֣בַע שִׁבֳּלִ֔ים צְנֻמ֥וֹת דַּקּ֖וֹת שְׁדֻפ֣וֹת קָדִ֑ים צֹמְח֖וֹת אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/023.yaml
  text: And behold[a], seven ears, thin and scorched by the east wind[b], were sprouting after them.
translation:
  language: ta
  text: இதோ, அவற்றுக்குப் பிறகு வாடிச் சுருங்கியவையும் மெலிந்தவையும் கிழக்குக் காற்றால் கருகிப்போனவையுமான ஏழு தானியக் கதிர்கள்[a] முளைத்துக்கொண்டிருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏழு தானியத் தலைகள்.”
    reason: שִׁבֳּלִים என்பது தானியச் செடியின் கதிரை அல்லது தானியத் தலையைச் சுட்டலாம்.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கனவின் காட்சியில் புதிதாகத் தோன்றும் ஒன்றை உயிரோட்டத்துடன் சுட்டிக்காட்டும் எபிரெய இடைச்சொல்லின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: ஏழு தானியக் கதிர்கள்
  rationale: שִׁבֳּלִים என்பது இச்சூழலில் தானியத்தின் கதிர்ப்பகுதியைக் குறிக்கிறது; ‘தானியக் கதிர்கள்’ என்பது ‘தண்டுகள்’ என்பதைக் காட்டிலும் துல்லியமானதும் பொதுவாகப் புரியக்கூடியதும் ஆகும்.
- source_word: צְנֻמוֹת
  choice: வாடிச் சுருங்கியவைகள்
  rationale: அரிதாக வரும் இச்சொல் மெலிந்து சுருங்கிய அல்லது வாடிய நிலையைக் குறிக்கிறது. அடுத்துள்ள דַּקּוֹת என்பதையும் தனியாக மொழிபெயர்க்க வேண்டியதால், இதை வெறும் ‘மெலிந்த’ என்று ஒன்றாக்கவில்லை.
- source_word: דַּקּוֹת
  choice: மெலிந்தவைகள்
  rationale: கதிர்களின் மெலிந்த, போதிய வளர்ச்சியில்லாத தோற்றத்தை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: שְׁדֻפוֹת קָדִים
  choice: கிழக்குக் காற்றால் கருகிப்போனவைகள்
  rationale: வெப்பமும் வறட்சியும் கொண்ட கிழக்குக் காற்றால் தானியக் கதிர்கள் சேதமடைந்ததைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: צֹמְחוֹת
  choice: முளைத்துக்கொண்டிருந்தன
  rationale: பங்கேற்புவினை வடிவில் உள்ள தொடர்ச்சியான காட்சியம்சத்தைத் தமிழின் தொடர்நிலை வினை காக்கிறது.
- source_word: אַחֲרֵיהֶם
  choice: அவற்றுக்குப் பிறகு
  rationale: முன்னர் தோன்றிய நல்ல ஏழு கதிர்களைத் தொடர்ந்து இவை தோன்றிய வரிசையை இயல்பாகக் குறிக்கிறது.
