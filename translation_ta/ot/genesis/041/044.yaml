  text: וַ/יֹּ֧אמֶר פַּרְעֹ֛ה אֶל יוֹסֵ֖ף אֲנִ֣י פַרְעֹ֑ה וּ/בִלְעָדֶ֗י/ךָ לֹֽא יָרִ֨ים אִ֧ישׁ אֶת יָד֛/וֹ וְ/אֶת רַגְל֖/וֹ בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/044.yaml
  text: Then Pharaoh said to Joseph[a], “I am Pharaoh[b], and without you no man will lift up his hand or his foot in all the land of Egypt.”
translation:
  language: ta
  text: பின்பு பார்வோன் யோசேப்பிடம், “நான் பார்வோன். உன்னையல்லாமல்[a] எகிப்து தேசம் முழுவதிலும் யாரும் தன் கையையோ காலையையோ[b] உயர்த்த மாட்டான்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னைத் தவிர.” எகிப்தில் யாரும் யோசேப்பின் அதிகாரத்திலிருந்து சுயமாகச் செயல்பட முடியாது என்பதை இது வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “தன் கையையோ காலையையோ உயர்த்துதல்” என்பது எந்தச் செயலையும் மேற்கொள்வதையோ எந்த நகர்வையும் செய்வதையோ குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘பின்பு’ இயல்பான தமிழ் கதைநடையைத் தருகிறது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: யோசேப்பின் வரலாற்றில் எகிப்திய அரசருக்குப் பயன்படுத்தப்படும் வழக்கமான தமிழ் பட்டப்பெயர்.
- source_word: אֲנִי פַרְעֹה
  choice: நான் பார்வோன்
  rationale: வினைச்சொல் இல்லாத எபிரெய வாக்கியத்தின் நேரடியான, வலியுறுத்தலுள்ள அரச அறிவிப்பை மேலதிக விளக்கமின்றிப் பாதுகாக்கிறது.
- source_word: וּבִלְעָדֶיךָ
  choice: உன்னையல்லாமல்
  rationale: யோசேப்பைத் தவிர்த்து அல்லது அவரது அதிகாரத்துக்கு அப்பாற்பட்டு யாரும் செயல்பட முடியாது என்ற பொருளைச் சுருக்கமாகத் தருகிறது; உள்ள நுட்பம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: לֹא יָרִים אִישׁ
  choice: எவனும் ... உயர்த்த மாட்டான்
  rationale: தடை அல்லது அதிகாரப்பூர்வ அறிவிப்பின் எதிர்காலத் தன்மையையும், אִישׁ என்பதன் பொதுமையான ஒருமை ஆண்பால் வடிவத்தையும் காக்கிறது.
- source_word: אֶת יָדוֹ וְאֶת רַגְלוֹ
  choice: தன் கையையோ காலையையோ
  rationale: எதிர்மறை வாக்கியத்தில் தமிழுக்கு இயல்பாக ‘யோ...யோ’ அமைப்பைப் பயன்படுத்தி, எந்தச் செயலையும் மேற்கொள்வதைக் குறிக்கும் மூலமொழி உருவகத்தை அப்படியே வைத்திருக்கிறது.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: எகிப்து தேசம் முழுவதிலும்
  rationale: முழு எகிப்திய நிலப்பரப்பையும் குறிக்கும் இயல்பான, மூலத்துக்கு நெருக்கமான தமிழ் சொற்றொடர்.
theological_decisions:
- issue: யோசேப்புக்கு வழங்கப்பட்ட அதிகாரத்தின் வரம்பு
  choice: ‘உன்னையல்லாமல்’ என்று மூலத்தின் சுருக்கத்தையும் இருபொருள் நுட்பத்தையும் வைத்தல்
  alternative: ‘உன் அனுமதியில்லாமல்’ என்று வெளிப்படையாக விளக்குதல்
  rationale: மூலச்சொல் யோசேப்பின் இல்லாமையையும் அவருடைய அதிகாரத்திலிருந்து சுயமாகச் செயல்பட முடியாமையையும் சுட்டலாம்; மொழிபெயர்ப்பு இவற்றில் ஒன்றை மட்டும் இறுதியாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நான் பார்வோன்’ என்ற அரச அறிவிப்பும் ‘கையையோ காலையையோ உயர்த்த’ என்ற மூல உருவகமும் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன; மரபுத்தொடரின் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
