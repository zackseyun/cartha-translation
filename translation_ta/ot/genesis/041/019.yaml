base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/019.yaml
  text: And behold[a], seven other cows came up after them, poor and very ugly in appearance and thin in flesh[b]. I had not seen any like them in all the land of Egypt for ugliness.
translation:
  language: ta
  text: அப்போது, இதோ, அவற்றுக்குப் பின்னால் வேறு ஏழு பசுக்கள் ஏறிவந்தன. அவை நலிந்து, தோற்றத்தில் மிகவும் அவலட்சணமாக, உடல் சதை வற்றிப்போய் இருந்தன. அவற்றைப் போன்று இவ்வளவு மோசமான பசுக்களை எகிப்து நாடு முழுவதிலும் நான் பார்த்ததே இல்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவ்வளவு அவலமான பசுக்களை.” எபிரேயச் சொற்றொடர் அவற்றின் மோசமான தோற்றத்தையும் பரிதாபமான உடல்நிலையையும் ஒட்டுமொத்தமாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: அப்போது, இதோ
  rationale: கனவின் அடுத்த காட்சியைத் தெளிவாகவும் உயிரோட்டமாகவும் அறிமுகப்படுத்தும் எபிரேய உரையாடல் குறியீட்டைப் பேணுகிறது.
- source_word: שֶׁבַע פָּרוֹת אֲחֵרוֹת
  choice: வேறு ஏழு பசுக்கள்
  rationale: பெண்பால் மாடுகளையும் முந்தைய ஏழிலிருந்து வேறான அடுத்த தொகுதியையும் துல்லியமாகக் குறிக்கிறது.
- source_word: עֹלֹת אַחֲרֵיהֶן
  choice: அவற்றுக்குப் பின்னால் ... ஏறிவந்தன
  rationale: நைல் நதியிலிருந்து மேலே வந்த இயக்கத்தைச் சூழலுக்கேற்ற இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: דַּלּוֹת
  choice: நலிந்து
  rationale: வெறும் மெலிவை மட்டுமல்லாமல் பலவீனமான, பரிதாபமான உடல்நிலையையும் உணர்த்துகிறது; பின்னர் வரும் சதை வற்றிய நிலையை மீண்டும் கூறுவதைத் தவிர்க்கிறது.
- source_word: וְרָעוֹת תֹּאַר מְאֹד
  choice: தோற்றத்தில் மிகவும் அவலட்சணமாக
  rationale: இங்கு רָעוֹת அறநெறி சார்ந்த தீமையை அல்ல, காண்பதற்கு மிகவும் மோசமான உருவத்தைச் சுட்டுகிறது.
- source_word: וְרַקּוֹת בָּשָׂר
  choice: உடல் சதை வற்றிப்போய்
  rationale: சதைப்பற்றற்ற கடும் மெலிவை இயல்பான நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: לֹא רָאִיתִי כָהֵנָּה בְּכָל אֶרֶץ מִצְרַיִם
  choice: அவற்றைப் போன்று ... எகிப்து நாடு முழுவதிலும் நான் பார்த்ததே இல்லை
  rationale: ஒப்பீட்டையும் எகிப்து முழுவதையும் உள்ளடக்கும் வலியுறுத்தலையும் பேணுகிறது.
- source_word: לָרֹעַ
  choice: இவ்வளவு மோசமான
  rationale: அவற்றின் தோற்றம் மட்டுமன்றி ஒட்டுமொத்த அவல நிலையையும் சுட்டக்கூடிய எபிரேயச் சொல்லின் பரந்த மதிப்பீட்டுப் பொருளைப் பேணுகிறது.
