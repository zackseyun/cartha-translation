  source_fidelity: மூல எபிரேயத்தின் தொடர்ச்சியான காட்சி அறிமுகம், ஏழு வேறு பெண்பசுக்கள், முன் பசுக்களுக்குப் பின் மேலே வருதல், நலிந்த நிலை, மிகவும் அருவருப்பான தோற்றம், சதை வற்றிய மெலிவு, எகிப்து முழுவதிலும் இணையற்ற மோசநிலை ஆகிய அனைத்தும் பொருத்தமாகக் காக்கப்பட்டுள்ளன. இறுதியான לָרֹעַ-வின் பரந்த மதிப்பீட்டு நுணுக்கத்தை “இவ்வளவு மோசமான” என்பதும் பேணுகிறது.
  naturalness: நடை நவீனத் தரத் தமிழில் இயல்பாக உள்ளது. “நலிந்து,” “தோற்றத்தில் மிகவும் அவலட்சணமாக,” “உடல் சதை வற்றிப்போய்” என்பவை மூலத்தில் வரும் மூன்று உடல் வருணனைகளையும் தெளிவாகவும் மீளுரையில்லாமலும் வெளிப்படுத்துகின்றன.
  terminology: “பசுக்கள்” என்பது பெண்பால் மாடுகளுக்குத் துல்லியமான சொல். “அவலட்சணமாக” என்பது இச்சூழலில் அறநெறித் தீமையல்லாமல் அருவருப்பான தோற்றத்தைக் குறிக்கிறது. இறுதி வாக்கியத்தின் “மோசமான” என்பது தோற்றத்தையும் பரிதாபமான நிலையையும் உள்ளடக்கக்கூடிய வகையில், மூலத்தின் நோக்கமுள்ள பரப்பைத் தக்கவைக்கிறது.
