  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘இதோ’ என்பது கனவுக் காட்சியின் திடீர் கவன ஈர்ப்பைத் தக்கவைக்கிறது; வருணனைகள் மிகைப்படுத்தப்படாமல் மூலத்துக்கு நெருக்கமாக வைக்கப்பட்டுள்ளன.
