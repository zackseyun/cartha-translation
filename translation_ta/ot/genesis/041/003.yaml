source:
  edition: WLC
  text: וְ/הִנֵּ֞ה שֶׁ֧בַע פָּר֣וֹת אֲחֵר֗וֹת עֹל֤וֹת אַחֲרֵי/הֶן֙ מִן הַ/יְאֹ֔ר רָע֥וֹת מַרְאֶ֖ה וְ/דַקּ֣וֹת בָּשָׂ֑ר וַֽ/תַּעֲמֹ֛דְנָה אֵ֥צֶל הַ/פָּר֖וֹת עַל שְׂפַ֥ת הַ/יְאֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/003.yaml
  text: And behold[a], seven other cows came up after them from the Nile, ugly in appearance and thin in flesh[b], and they stood beside the cows on the bank of the Nile.
translation:
  language: ta
  text: இதோ, தோற்றத்தில் மோசமானவையாகவும் உடல் மெலிந்தவையாகவும் இருந்த வேறு ஏழு பசுக்கள் அவற்றுக்குப் பிறகு நைல் ஆற்றிலிருந்து ஏறிவந்து, ஆற்றங்கரையில் அந்தப் பசுக்களின் அருகே நின்றன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: அப்போது இதோ
  rationale: கனவுக் காட்சியில் திடீரென கவனத்தை ஈர்க்கும் எபிரெயச் சொற்றொடரின் உரையாடல் விசையையும், முந்தைய நிகழ்வோடு அதன் தொடர்ச்சியையும் காக்கிறது.
- source_word: פָּרוֹת
  choice: பசுக்கள்
  rationale: பெண்பால் பன்மையைத் துல்லியமாகக் காட்டுகிறது; வயது குறிப்பிடப்படாததால் ‘கிடாரிகள்’ என்று குறுக்கவில்லை.
- source_word: אֲחֵרוֹת
  choice: வேறு
  rationale: முதல் ஏழு பசுக்களிலிருந்து வேறுபட்ட இரண்டாவது கூட்டத்தைக் குறிக்கிறது.
- source_word: עֹלוֹת
  choice: ஏறிவந்து
  rationale: ஆற்றிலிருந்து மேலே வெளிவரும் அசைவைக் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אַחֲרֵיהֶן
  choice: அவற்றுக்குப் பின்னால்
  rationale: இது கால வரிசையையோ இட வரிசையையோ குறிக்கக்கூடிய மூலத்தின் இயல்பான தெளிவின்மையை ஓரளவு காக்கிறது.
- source_word: הַיְאֹר
  choice: நைல் ஆறு
  rationale: எகிப்தியச் சூழலில் இச்சொல் நைல் ஆற்றைக் குறிப்பதால் வாசகருக்கு இடத்தைத் தெளிவாக்குகிறது; சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: רָעוֹת מַרְאֶה
  choice: தோற்றத்தில் மோசமானவையாக
  rationale: இங்கு ‘தீய’ என்ற ஒழுக்கப் பொருள் அல்ல, பார்ப்பதற்கு மோசமான நிலையே குறிக்கப்படுகிறது; மூலத்தின் பொதுவான வருணனையை ‘அசிங்கமான’ என்று மிகைப்படுத்தாமல் காக்கிறது.
- source_word: דַקּוֹת בָּשָׂר
  choice: உடல் மெலிந்தவையாக
  rationale: சதை குறைவாக இருந்த உடலமைப்பை இயல்பான நவீன தமிழில் கூறுகிறது; மூலத்தின் ‘சதை’ உருவகம் அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: וַתַּעֲמֹדְנָה
  choice: நின்றன
  rationale: எளிய தொடர் நிகழ்வை நேரடியாகத் தெரிவிக்கிறது.
- source_word: אֵצֶל
  choice: அருகே
  rationale: பசுக்களுக்குப் பக்கத்தில் இருந்த அண்மையை இயல்பாகக் குறிக்கிறது.
- source_word: שְׂפַת הַיְאֹר
  choice: ஆற்றங்கரையில்
  rationale: ‘ஆற்றின் விளிம்பு/உதடு’ என்ற மூல உருவகத்துக்கான இயல்பான தமிழ்ச் சமமான சொல்.
