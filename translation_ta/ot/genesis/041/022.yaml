translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குத் தெளிவாகவும் கனவுக் காட்சியின் கண்ணுக்கு முன் நிற்கும் தன்மையைப் பேணும் வகையிலும் மொழிபெயர்க்கப்பட்டது. ‘இதோ’ என்ற சொல் மூலத்தின் வலியுறுத்தலைக் காக்கிறது; சொற்றொடர் தமிழில் இயல்பாக அமைய பெயரெச்சங்கள் பெயருக்கு முன் வைக்கப்பட்டுள்ளன.
