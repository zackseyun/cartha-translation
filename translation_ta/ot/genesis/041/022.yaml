  text: וָ/אֵ֖רֶא בַּ/חֲלֹמִ֑/י וְ/הִנֵּ֣ה שֶׁ֣בַע שִׁבֳּלִ֗ים עֹלֹ֛ת בְּ/קָנֶ֥ה אֶחָ֖ד מְלֵאֹ֥ת וְ/טֹבֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/022.yaml
  text: And I saw in my dream[a], and behold, seven ears of grain were coming up on one stalk, full and good.
translation:
  language: ta
  text: '“என் கனவில் நான் பார்த்தேன்: இதோ, நிறைந்த, நல்ல ஏழு தானியக் கதிர்கள்[a] ஒரே தண்டில் வளர்ந்து வந்தன.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தானியத் தலைகள்.’ எபிரெயச் சொல் தானியத்தின் கதிரையோ தலையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: நான் … பார்த்தபோது
  rationale: רָאָה என்பதன் Qal wayyiqtol வடிவம் பார்வோனின் முதல் நபர் கனவு விவரிப்பைத் தொடர்கிறது. தமிழில் தொடர்ச்சியையும் அடுத்த காட்சியின் அறிமுகத்தையும் இயல்பாக வெளிப்படுத்த ‘பார்த்தபோது’ பயன்படுத்தப்பட்டது.
- source_word: בַּחֲלֹמִי
  choice: என் கனவில்
  rationale: முன்னிடைச்சொல்லும் முதல் நபர் ஒருமை உடைமை விகுதியும் சேர்ந்த வடிவத்தின் நேரான, இயல்பான பொருள்.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה கனவுக் காட்சியை உயிரோட்டமாகவும் உடனடியாகவும் முன்வைக்கிறது; ‘இதோ’ அதன் உரையாடல் வலிமையைப் பேணுகிறது.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: ஏழு தானியக் கதிர்கள்
  rationale: שִׁבֹּלֶת இச்சூழலில் தானியச் செடியின் கதிரைக் குறிக்கிறது. ‘தானியக் கதிர்கள்’ என்பது நவீன தமிழில் தெளிவான வேளாண் சொல்லாக்கம்.
- source_word: עֹלֹת
  choice: வளர்ந்து வந்தன
  rationale: பெண்பால் பன்மை வினையெச்ச வடிவம் கனவில் நிகழ்ந்துகொண்டிருந்த மேலெழும் வளர்ச்சியை உயிரோட்டமாகச் சித்தரிக்கிறது.
- source_word: בְּקָנֶה אֶחָד
  choice: ஒரே தண்டில்
  rationale: קָנֶה இங்கு தானியச் செடியின் தண்டைக் குறிக்கிறது; בְּ முன்னிடைச்சொல்லின் இடப்பொருளை ‘தண்டில்’ இயல்பாகக் காட்டுகிறது.
- source_word: מְלֵאֹת
  choice: நிறைந்தவையும்
  rationale: ‘நிறைந்த’ என்பது எபிரெயச் சொல்லின் அடிப்படைப் பொருளைப் பேணுகிறது; ‘திரட்சியான’ அல்லது ‘முற்றிய’ என்று சூழலை மிகுதியாக விளக்கவில்லை.
- source_word: וְטֹבוֹת
  choice: நல்லவையுமான
  rationale: טוֹב என்பதன் பரந்த ‘நல்ல’ என்ற பொருளைப் பாதுகாத்து, கதிர்களின் சாதகமான தரத்தைக் குறிக்கிறது.
