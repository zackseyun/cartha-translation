base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/010.yaml
  text: Pharaoh was angry with his servants[a], and he put me in custody in the house of the captain of the guard[b], me and the chief baker.
translation:
  language: ta
  text: பார்வோன் தன் பணியாளர்கள்மீது கோபமடைந்து, என்னையும் தலைமை ரொட்டி சுடுபவனையும் காவல்படைத் தலைவரின்[a] வீட்டில் காவலில்[b] வைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காவல்படைத் தலைவர்’ என்பது அரசவைப் பதவிப்பெயர். இதற்கான எபிரெயத் தொடர் இன்னும் நேரடியாக, ‘அறுப்போர் அல்லது மரணதண்டனை நிறைவேற்றுவோரின் தலைவர்’ எனப் பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘காவலின் கீழ்’. எபிரெயச் சொல் காவலுடன் கூடிய தடுப்பைக் குறிக்கிறது; தனியான சிறைச்சாலைக் கட்டடத்தைக் கட்டாயமாகக் குறிப்பதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָצַף
  choice: கோபமடைந்து
  rationale: இந்த வினை கோபம் அல்லது சினத்தைக் குறிக்கிறது. தீவிரத்தை மிகைப்படுத்தாமல், இயல்பான நவீனத் தமிழில் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: עֲבָדָיו
  choice: தன் பணியாளர்கள்
  rationale: இச்சூழலில் குறிப்பிடப்படுபவர்கள் பார்வோனின் அரசவைப் பணிகளைச் செய்த பானபாத்திரக்காரரும் அப்பக்காரரும் ஆவர். ‘பணியாளர்கள்’ என்பது எபிரெயச் சொல்லின் பணிவிடை உறவைப் பாதுகாக்கிறது; ‘அடிமைகள்’ என்று கூறி தேவையில்லாமல் அடிமைநிலையை முன்னிறுத்துவதில்லை.
- source_word: בְּמִשְׁמַר
  choice: காவலில்
  rationale: இச்சொல் காவலின் கீழ் வைக்கப்பட்டிருப்பதையோ தடுப்புக் காவலையோ குறிக்கிறது. தனிப்பட்ட சிறைச்சாலைக் கட்டடம் ஒன்றை தேவையின்றிக் குறிப்பதில்லை.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: காவல்படைத் தலைவரின் வீட்டில்
  rationale: யோசேப்பு வரலாற்றில் இது பார்வோனின் காவல்படைக்குப் பொறுப்பான அதிகாரியின் பதவிப்பெயராகச் செயல்படுகிறது. மூலச்சொல்லின் நேரடிப் பொருளில் கொலைசெய்பவர்கள் அல்லது மரணதண்டனை நிறைவேற்றுவோர் என்ற நிழற்பொருள் இருப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שַׂר הָאֹפִים
  choice: தலைமை அப்பக்காரன்
  rationale: இந்தச் சொற்றொடர் அப்பம் சுடுவோரின் தலைவரைக் குறிக்கிறது. ‘தலைமை அப்பக்காரன்’ சுருக்கமாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: אֹתִי ... וְאֵת שַׂר הָאֹפִים
  choice: என்னையும் தலைமை அப்பக்காரனையும்
  rationale: இருவரும் காவலில் வைக்கப்பட்டனர் என்பதைத் தமிழின் இயல்பான இணைப்பு அமைப்பில் தெளிவாகக் காட்டுகிறது.
