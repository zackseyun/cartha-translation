  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நிகழ்வுவரிசையும் இரு கைதிகளின் குறிப்பிடுதலும் பாதுகாக்கப்பட்டுள்ளன.
