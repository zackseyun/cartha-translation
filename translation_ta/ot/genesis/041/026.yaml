base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/026.yaml
  text: The seven good cows are seven years[a], and the seven good ears of grain are seven years; it is one dream.
translation:
  language: ta
  text: அந்த ஏழு நல்ல பசுக்கள் ஏழு ஆண்டுகள்; அந்த ஏழு நல்ல தானியக் கதிர்கள்[a] ஏழு ஆண்டுகள். அது ஒரே கனவு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தானியத் தலைகள்.’ எபிரெயச் சொல் தண்டின் தானிய மணிகள் நிறைந்த மேற்பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹת
  choice: பசுக்கள்
  rationale: எபிரெயச் சொல் பார்வோனின் கனவில் வந்த பெண்பால் மாடுகளைக் குறிப்பதால், பொதுவான ‘மாடுகள்’ என்பதைவிட ‘பசுக்கள்’ துல்லியமானது.
- source_word: הַטֹּבֹת
  choice: நல்ல
  rationale: ‘நல்ல’ என்ற பரந்த அடிப்படைப் பொருளைத் தக்கவைத்து, அவற்றின் தோற்றம் அல்லது உடல்நிலை மட்டுமே குறிக்கப்படுகிறது என்று தேவையின்றி விளக்கவில்லை.
- source_word: שָׁנִים
  choice: ஆண்டுகள்
  rationale: கனவின் அடையாளங்கள் ஆண்டுகளைக் குறிப்பதாக வசனம் நேரடியாக விளக்குகிறது.
- source_word: שִׁבֳּלִים
  choice: தானியக் கதிர்கள்
  rationale: தண்டின் தானியம் தாங்கும் மேற்பகுதியைக் குறிக்கும் எபிரெயச் சொல்லை, நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: חֲלוֹם אֶחָד הוּא
  choice: அது ஒரே கனவு
  rationale: இரு அடையாளத் தொடர்களும் ஒன்றுபட்ட ஒரே கனவுச் செய்தி என்பதை வலியுறுத்தும் எபிரெய ஒருமையை இயல்பான தமிழில் காக்கிறது.
- source_word: הֵנָּה
  choice: ஆண்டுகள்
  rationale: எபிரெயப் பெண்பால் பன்மைப் பதிலிப்பெயர் இங்கு இணைப்புச் சொல்லாகச் செயல்படுகிறது; தமிழில் தனியே ‘அவை’ என்று இருமுறை கூறாமல் பெயர்ப்பயனிலையால் இயல்பாக வெளிப்படுத்தப்படுகிறது.
