translation_notes:
  register: மக்கள் எளிதில் புரிந்துகொள்ளக்கூடிய நவீன செந்தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. அரச நிர்வாகச் சூழலைத் தெளிவாக்கும் வகையில் ‘அதிகாரியாக’, ‘கட்டளை’, ‘அரியணை’ ஆகிய சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன; அதேவேளை எபிரெய மூலத்தின் ‘வாய்/முத்தமிடு’ என்ற உண்மையான சொற்படிமம் அடிக்குறிப்பில் தக்கவைக்கப்பட்டுள்ளது.
