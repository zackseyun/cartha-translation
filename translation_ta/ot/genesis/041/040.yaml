source:
  edition: WLC
  text: אַתָּה֙ תִּהְיֶ֣ה עַל בֵּיתִ֔/י וְ/עַל פִּ֖י/ךָ יִשַּׁ֣ק כָּל עַמִּ֑/י רַ֥ק הַ/כִּסֵּ֖א אֶגְדַּ֥ל מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/040.yaml
  text: You shall be over my house[a], and all my people shall obey your command. Only with respect to the throne will I be greater than you.
translation:
  language: ta
  text: “நீ என் இல்லத்திற்குப் பொறுப்பாக இருப்பாய்; உன் கட்டளைக்கு என் மக்கள் அனைவரும் கீழ்ப்படிவார்கள்.[a] அரியணையைப் பொறுத்தவரை மட்டுமே நான் உன்னைவிட உயர்ந்தவனாக இருப்பேன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “உன் வாயின்படி என் மக்கள் அனைவரும் முத்தமிடுவார்கள்.” இங்கு இச்சொற்றொடர் பொதுவாக, யோசேப்பின் கட்டளைக்குக் கீழ்ப்படிவது அல்லது அவருக்கு மரியாதை செலுத்துவது என்று புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל בֵּיתִי
  choice: என் வீட்டின் மேல் அதிகாரியாக
  rationale: עַל இங்கு மேற்பார்வையையும் அதிகாரத்தையும் குறிக்கிறது. ‘வீடு’ என்ற சொல்லைத் தக்கவைத்து, தமிழில் அதன் நிர்வாகப் பொருள் தெளிவாக இருக்க ‘அதிகாரியாக’ சேர்க்கப்பட்டது.
- source_word: וְעַל־פִּיךָ יִשַּׁק
  choice: உன் கட்டளைக்கு ... கீழ்ப்படிவார்கள்
  rationale: פֶּה என்பதன் நேரடிப் பொருள் ‘வாய்’; נָשַׁק என்பதன் வழக்கமான பொருள் ‘முத்தமிடு’. ஆனால் இச்சூழலில் யோசேப்பின் வாயிலிருந்து வரும் ஆணைக்கு மக்கள் பணிவதையோ மரியாதை செலுத்துவதையோ இச்சொற்றொடர் குறிக்கிறது. இயல்பான நவீன தமிழில் நிர்வாகச் சூழலைத் தெளிவாக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது; நேரடிப் படிமம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: כָּל עַמִּי
  choice: என் மக்கள் அனைவரும்
  rationale: עַם என்பது கூட்டாகிய மக்களைக் குறிக்கிறது; இந்தத் தமிழாக்கம் நேரடியும் இயல்பானதும் ஆகும்.
- source_word: רַק
  choice: மட்டுமே
  rationale: ரַק குறிக்கும் வரம்பையோ விதிவிலக்கையோ சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַכִּסֵּא
  choice: அரியணை
  rationale: כִּסֵּא என்பதன் நேரடிப் பொருள் அரச அரியணை; இங்கு பார்வோனின் அரச பதவியையும் இறுதி மேலாதிக்கத்தையும் குறிக்கிறது.
- source_word: אֶגְדַּל מִמֶּךָּ
  choice: நான் உன்னைவிட உயர்ந்தவனாக இருப்பேன்
  rationale: גדל + מן என்பது ஒப்பீட்டில் மேலான நிலையைச் சுட்டுகிறது. ‘அரியணையைப் பொறுத்தவரை’ என்ற வரம்பு இது பதவிசார் மேலாதிக்கம் என்பதைத் தெளிவாக்குகிறது.
