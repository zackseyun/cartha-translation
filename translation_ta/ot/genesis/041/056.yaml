language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הָ/רָעָ֣ב הָיָ֔ה עַ֖ל כָּל פְּנֵ֣י הָ/אָ֑רֶץ וַ/יִּפְתַּ֨ח יוֹסֵ֜ף אֶֽת כָּל אֲשֶׁ֤ר בָּ/הֶם֙ וַ/יִּשְׁבֹּ֣ר לְ/מִצְרַ֔יִם וַ/יֶּחֱזַ֥ק הָֽ/רָעָ֖ב בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/056.yaml
  text: And the famine was over all the face of the earth[a], and Joseph opened all that was in them and sold grain to Egypt[b], and the famine grew severe in the land of Egypt.
translation:
  language: ta
  text: பஞ்சம் பூமி முழுவதிலும் நிலவியது. யோசேப்பு தானியம் இருந்த களஞ்சியங்கள் அனைத்தையும் திறந்து[a] எகிப்தியருக்குத் தானியத்தை விற்றார். எகிப்து நாட்டில் பஞ்சம் மேலும் கடுமையானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொற்பட, “அவற்றில் இருந்த அனைத்தையும் திறந்தார்.” ‘அவை’ என்பது எதைக் குறிக்கிறது என்று உரையில் வெளிப்படையாகச் சொல்லப்படவில்லை; சூழலில் தானியம் சேமிக்கப்பட்ட களஞ்சியங்கள் குறிக்கப்படுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָעָב
  choice: பஞ்சம்
  rationale: רָעָב இச்சூழலில் தனிப்பட்ட பசியை அல்ல, பரந்த உணவுப் பற்றாக்குறையைக் குறிக்கிறது; நவீன தமிழில் ‘பஞ்சம்’ இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: עַל כָּל פְּנֵי הָאָרֶץ
  choice: பூமி முழுவதிலும்
  rationale: எபிரேய மரபுத்தொடரின் பொருள் ‘பூமி/நிலத்தின் பரப்பு முழுவதிலும்’ என்பதாகும். ‘பூமி’ என்ற சொல்லை வைத்திருப்பது உரையின் பரந்த கூற்றையும், அது ‘நாடு’ என்றும் பொருள்படக்கூடிய நெகிழ்வையும் ஓரளவு காக்கிறது.
- source_word: וַיִּפְתַּח יוֹסֵף אֶת כָּל אֲשֶׁר בָּהֶם
  choice: யோசேப்பு தானியம் இருந்த களஞ்சியங்கள் அனைத்தையும் திறந்து
  rationale: எபிரேய வாசகம் சொற்பட ‘அவற்றில் இருந்த அனைத்தையும் திறந்தார்’ என நீள்வட்டமாக உள்ளது; ‘அவை’ என்பதற்கான முன்னிலைப் பெயர் வெளிப்படையாக இல்லை. சூழலில் தானியக் களஞ்சியங்களே குறிக்கப்படுவதால், தமிழில் அடிப்படைச் செயல் தெளிவாக இருக்க அவற்றை உரையில் வெளிப்படுத்தி, சொற்படியான வடிவத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: וַיִּשְׁבֹּר לְמִצְרַיִם
  choice: எகிப்தியருக்குத் தானியத்தை விற்றார்
  rationale: שׁבר இங்கு தானியத்தை விற்பதைக் குறிக்கும் சூழல்சார் மரபுத்தொடர். לְמִצְרַיִם என்பதை நாட்டின் மக்களைக் குறிக்கும் கூட்டுப்பெயராகப் புரிந்து ‘எகிப்தியருக்கு’ என இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיֶּחֱזַק הָרָעָב
  choice: பஞ்சம் மேலும் கடுமையானது
  rationale: חזק என்பதன் அடிப்படைப் பொருள் ‘வலுவடைதல்’; பஞ்சத்தை எழுவாயாகக் கொண்டபோது அது தீவிரமடைந்ததைக் குறிக்கிறது. ‘மேலும் கடுமையானது’ இந்த வளர்ச்சியை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டில்
  rationale: ‘எகிப்து நாட்டில்’ என்பது אֶרֶץ מִצְרָיִם என்ற முழுச் சொற்றொடரையும் இயல்பான தமிழில் பிரதிபலிக்கிறது.
