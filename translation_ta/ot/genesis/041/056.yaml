translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. எபிரேய இணைப்புச் சொற்கள் ஒவ்வொன்றையும் ‘மற்றும்’ என்று இயந்திரமாகத் தொடராமல், தமிழின் இயல்பான கதைநடைக்கேற்ப மூன்று வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. ‘பூமி’ என்ற பரந்த சொல்லும் ‘எகிப்து நாடு’ என்ற குறிப்பிட்ட இடமும் தனித்தனியாகக் காக்கப்பட்டுள்ளன.
