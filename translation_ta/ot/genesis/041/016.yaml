id: GEN.41.16
reference: Genesis 41:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֨עַן יוֹסֵ֧ף אֶת פַּרְעֹ֛ה לֵ/אמֹ֖ר בִּלְעָדָ֑/י אֱלֹהִ֕ים יַעֲנֶ֖ה אֶת שְׁל֥וֹם פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/016.yaml
  text: Joseph answered Pharaoh[a], saying, “It is not in me[b]; God will answer for Pharaoh’s well-being.”
translation:
  language: ta
  text: யோசேப்பு பார்வோனுக்குப் பதிலளித்து, “அது என் திறனுக்கு அப்பாற்பட்டது; பார்வோனின் நலனைக்குறித்து கடவுள் பதிலளிப்பார்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: பதிலளித்து
  rationale: நேரடி உரையை அறிமுகப்படுத்தும் எபிரெயக் கதைநடை வினை; தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: אֶת־פַּרְעֹה
  choice: பார்வோனுக்குப்
  rationale: எபிரெயத்தில் நேரடி செயப்படுபொருளாக இருந்தாலும், ‘பதிலளி’ என்ற தமிழ் வினையுடன் நான்காம் வேற்றுமை இயல்பானது.
- source_word: לֵאמֹר
  choice: … என்றான்
  rationale: எபிரெயப் பேச்சு அறிமுகச் சூத்திரத்தைச் சொற்சொல்லாக ‘சொல்லி’ என இரட்டிப்பாக்காமல், இயல்பான தமிழ் நேரடி உரை அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: בִּלְעָדָי
  choice: அது என்னால் அல்ல
  rationale: கனவுக்கு விடையளிக்கும் திறன் தன்னிடமிருந்து வருவதல்ல என்று யோசேப்பு மறுப்பதைத் தெளிவாகக் காட்டுகிறது; ‘நான் அல்ல’ என்பதைவிட சூழலில் இயல்பானது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: ஒருமை வினையுடன் வரும் இச்சொல் இங்கு ஒரே கடவுளைக் குறிக்கிறது; நவீன பொதுத் தமிழில் தெளிவான சொல்.
- source_word: יַעֲנֶה
  choice: பதிலை … அளிப்பார்
  rationale: தமிழில் ‘நலனைப் பதிலளிப்பார்’ என்பது இயல்பற்றதால், வினை–செயப்படுபொருள் இணைப்பைச் சிறிது விரித்து இயல்பாக்குகிறது.
- source_word: שְׁלוֹם פַּרְעֹה
  choice: பார்வோனின் நலனுக்கான பதிலை
  rationale: שָׁלוֹם என்பதன் நலம், நல்விளைவு, சாதகமான முடிவு ஆகிய பரந்த நுணுக்கங்களைப் பாதுகாக்கிறது; பதில் நிச்சயமாகச் சாதகமானதே என்று மிகையாகத் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: கனவுக்கான பதிலின் மூலம்
  choice: யோசேப்பு அந்தத் திறன் தன்னால் அல்ல என்று மறுத்து, பதிலை கடவுளிடமே சார்த்துகிறான்.
  alternative: “நான் அல்ல; கடவுள் பார்வோனுக்கு நலமான பதிலை அளிப்பார்.”
  rationale: בִּלְעָדָי மற்றும் אֱלֹהִים יַעֲנֶה ஆகியவற்றின் எதிர்மறை–நேர்மறை மாறுபாட்டைத் தக்கவைக்கிறது; உரைக்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- issue: שְׁלוֹם என்பதன் பொருள்
  choice: ‘நலம்’ என்று கொண்டு, கடவுளின் பதில் பார்வோனின் நலனைச் சார்ந்தது என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘சமாதானமான பதில்’ அல்லது ‘நல்ல பதில்’
  rationale: ‘சமாதானம்’ இச்சூழலில் குறுகலாக அமையும்; ‘நல்ல பதில்’ என்பது பதில் சாதகமானதாகவே இருக்கும் எனப் பொருளைத் தீர்மானிக்கக்கூடும். ‘நலனுக்கான’ என்பது மூலத்தின் இயல்பான தெளிவின்மையை ஓரளவு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடையில் அமைக்கப்பட்டது. ‘பார்வோன்’, ‘யோசேப்பு’ ஆகியவை நிலைபெற்ற தமிழ் வேதாகமப் பெயர்வடிவங்கள். மூலத்தின் சுருக்கமான ஒப்புதலும், யோசேப்பு–கடவுள் மாறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
