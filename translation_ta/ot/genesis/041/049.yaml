  text: וַ/יִּצְבֹּ֨ר יוֹסֵ֥ף בָּ֛ר כְּ/ח֥וֹל הַ/יָּ֖ם הַרְבֵּ֣ה מְאֹ֑ד עַ֛ד כִּי חָדַ֥ל לִ/סְפֹּ֖ר כִּי אֵ֥ין מִסְפָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/049.yaml
  text: And Yoseph stored up grain[a], like the sand of the sea, in very great abundance, until he stopped counting[c][b], because there was no number.
translation:
  language: ta
  text: யோசேப்பு கடற்கரை மணலைப் போல மிகுந்த அளவு தானியத்தைச் சேமித்து வைத்தான்; எண்ணிக்கையே இல்லாததால், அவன் எண்ணுவதை நிறுத்திவிட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְבֹּר
  choice: சேமித்து வைத்தான்
  rationale: צבר என்பது குவித்துச் சேமிப்பதைக் குறிக்கிறது; நிர்வாக முறையில் விளைச்சலைச் சேகரித்த இந்தச் சூழலில் ‘சேமித்து வைத்தான்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: தமிழ் வேதாகம வழக்கில் பரவலாக அறியப்படும், எபிரெயப் பெயருக்கும் நெருக்கமான வடிவம்.
- source_word: בָּר
  choice: தானியம்
  rationale: இங்கு குறிப்பிட்ட ஓர் பயிரை அல்லாமல் பொதுவான தானிய விளைச்சலைக் குறிக்கிறது.
- source_word: כְּחוֹל הַיָּם
  choice: கடற்கரை மணலைப் போல
  rationale: ‘கடலின் மணல்’ என்ற எபிரெய உருவகத்தின் இயல்பான தமிழாக்கம்; அளவிட முடியாத பெருக்கைத் தெரிவிக்கிறது.
- source_word: הַרְבֵּה מְאֹד
  choice: மிக மிக ஏராளமான
  rationale: הַרְבֵּה மற்றும் מְאֹד ஆகிய இரட்டை வலியுறுத்தலையும் தெளிவான நவீன தமிழில் காக்கிறது.
- source_word: עַד כִּי
  choice: …அளவுக்கு
  rationale: இச்சூழலில் குவிப்பின் விளைவாக எட்டப்பட்ட நிலையைக் காட்டும் இயல்பான தமிழ்க் கட்டமைப்பு.
- source_word: חָדַל לִסְפֹּר
  choice: அவன் அதை எண்ணுவதையே நிறுத்திவிட்டான்
  rationale: ஒருமை வினையின் எழுவாயை யோசேப்பாகக் கொண்டு, செயலை நிறுத்திய வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי אֵין מִסְפָּר
  choice: எண்ண முடியாத அளவுக்கு இருந்ததால்
  rationale: சொல்லுக்குச் சொல் ‘எண் இல்லை’ என்பதன் பொருளான கணக்கிட இயலாத பெருக்கை நவீன தமிழில் தெளிவாக்குகிறது.
