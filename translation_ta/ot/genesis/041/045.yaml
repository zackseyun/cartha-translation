  to: பார்வோன் யோசேப்புக்கு “சாப்நாத்-பானேயா”[a] என்று பெயரிட்டான்; ஓன்[b] நகரத்தின் ஆசாரியரான போத்திபேராவின் மகள் ஆசேனாத்தை அவனுக்கு மனைவியாகக் கொடுத்தான். பின்னர் யோசேப்பு எகிப்து நாடு முழுவதும்[c] புறப்பட்டுச் சென்றான்.
