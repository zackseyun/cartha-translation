  text: וַ/יִּקְרָ֨א פַרְעֹ֣ה שֵׁם יוֹסֵף֮ צָֽפְנַ֣ת פַּעְנֵחַ֒ וַ/יִּתֶּן ל֣/וֹ אֶת אָֽסְנַ֗ת בַּת פּ֥וֹטִי פֶ֛רַע כֹּהֵ֥ן אֹ֖ן לְ/אִשָּׁ֑ה וַ/יֵּצֵ֥א יוֹסֵ֖ף עַל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/045.yaml
  text: And Pharaoh called Joseph’s name Zaphenath-paneah[a], and he gave him Asenath, the daughter of Potiphera, the priest of On, as a wife[d][c][b]. And Joseph went out over the land of Egypt.
translation:
  language: ta
  text: பார்வோன் யோசேப்புக்கு “சாப்நாத்-பானேயா”[a] என்று பெயரிட்டான்; ஓன்[b] நகரத்தின் ஆசாரியரான போத்திபேராவின் மகள் ஆசேனாத்தை அவனுக்கு மனைவியாகக் கொடுத்தான். பின்னர் யோசேப்பு எகிப்து நாடு முழுவதும்[c] புறப்பட்டுச் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த எகிப்தியப் பெயரின் பொருள் உறுதியாகத் தெரியவில்லை; இதன் ஒலிபெயர்ப்பும் பொருள் விளக்கங்களும் வேறுபடுகின்றன.
    reason: lexical_alternative
  - marker: b
    text: ஓன் என்பது பிற்காலத்தில் கிரேக்க மொழியில் ‘ஹெலியோபொலிஸ்’ என்று அழைக்கப்பட்ட எகிப்திய நகரம்.
    reason: cultural_note
  - marker: c
    text: எபிரெயத்தில், ‘எகிப்து தேசத்தின்மேல்’ என்று உள்ளது; இது நாடு முழுவதும் சென்றதையும் அவனுடைய அதிகாரத்தின் சூழலையும் சுட்டலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם יוֹסֵף
  choice: பார்வோன் யோசேப்புக்கு ... என்று பெயரிட்டான்
  rationale: ‘பெயரை அழைத்தான்’ என்ற எபிரெய மொழிமரபை சொற்சொல்லாகப் பின்பற்றாமல், பெயரிடும் அதிகாரப்பூர்வ செயலை இயல்பான நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: צָפְנַת פַּעְנֵחַ
  choice: சாப்நாத்-பனேகா
  rationale: பொருள் உறுதியாகத் தெரியாத எகிப்தியப் பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய வடிவைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: אָסְנַת
  choice: ஆசிநாத்
  rationale: தனிப்பெயரை எபிரெய உச்சரிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: בַּת פּוֹטִי פֶרַע כֹּהֵן אֹן
  choice: ஓன் நகரத்தின் அர்ச்சகரான போத்திபெராவின் மகள்
  rationale: ‘போத்திபெரா’ என்பவரை ‘ஓனின் அர்ச்சகர்’ என்று பின்னிணைப்பாக விவரிக்கும் எபிரெய தொடரைத் தெளிவான தமிழ் உறவுத் தொடராக அளிக்கிறது.
- source_word: לְאִשָּׁה
  choice: மனைவியாக
  rationale: திருமண ஏற்பாட்டைக் குறிக்கும் எபிரெய வழக்கைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיֵּצֵא יוֹסֵף עַל אֶרֶץ מִצְרָיִם
  choice: யோசேப்பு எகிப்து நாடெங்கும் புறப்பட்டுச் சென்றான்
  rationale: יצא என்பதன் ‘புறப்பட்டுச் செல்’ என்ற இயக்கத்தையும், עַל אֶרֶץ என்பதன் இச்சூழலிலுள்ள நாடு முழுவதும் பயணித்தல் என்ற பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; மாற்றுச் சொற்சார்ந்த வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: עַל אֶרֶץ מִצְרָיִם என்பது பயணத்தையா அதிகார மேற்பார்வையையா வலியுறுத்துகிறது?
  choice: எகிப்து நாடெங்கும்
  alternative: எகிப்து நாட்டின்மேல்
  rationale: முந்தைய வசனங்களில் கொடுக்கப்பட்ட அதிகாரம் பின்னணியில் இருந்தாலும், וַיֵּצֵא உடன் வரும் இத்தொடர் முதன்மையாக நாட்டில் புறப்பட்டுச் செல்வதைச் சுட்டுவதாக எடுத்துக்கொள்ளப்பட்டது. எபிரெயச் சொற்கட்டமைப்புக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. ‘அர்ச்சகர்’ என்பது எகிப்திய சமயப் பணியாளரைக் குறிக்கத் தேர்ந்தெடுக்கப்பட்டது. அடிக்குறிப்பு குறிகள் உரையில் தொடர்புடைய சொல் அல்லது தொடருக்கு உடனடியாக இணைக்கப்பட்டுள்ளன.
