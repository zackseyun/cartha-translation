base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/005.yaml
  text: Then he slept and dreamed a second time[a], and behold, seven ears of grain were coming up on one stalk[b], plump and good.
translation:
  language: ta
  text: பின்பு அவன் தூங்கினான்; இரண்டாம் முறையாகக் கனவு கண்டான். இதோ, ஒரே தண்டில் ஏழு தானியக் கதிர்கள்[a] நன்கு நிரம்பியவையாகவும்[b] நல்லவையாகவும் வளர்ந்து வந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏழு தானியத் தலைகள்.’ எபிரெயச் சொல் தானியம் விளையும் கதிரையோ அதன் தலையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நலமானவையாகவும்’ அல்லது ‘பருத்தவையாகவும்.’ இங்குள்ள பெயரடை, கதிர்கள் தானியத்தால் நன்கு நிரம்பியிருந்ததை விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּישָׁן
  choice: பின்பு அவன் தூங்கி
  rationale: தொடர்ச்சியான கதைநிகழ்வை இயல்பான நவீனத் தமிழில் காட்டுகிறது; வினையின் எளிய ‘தூங்குதல்’ என்ற பொருளையும் காக்கிறது.
- source_word: וַיַּחֲלֹם שֵׁנִית
  choice: இரண்டாம் முறையாகக் கனவு கண்டான்
  rationale: שֵׁנִית என்பதன் ‘இரண்டாம் முறை’ என்ற வினையடைப் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கனவுக் காட்சியைத் திடீரெனவும் உயிரோட்டமாகவும் முன்வைக்கும் எபிரெயச் சொல்லின் உரையாடல் வலிமையைப் பாதுகாக்கிறது.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: ஏழு தானியக் கதிர்கள்
  rationale: שִׁבֳּלִים என்பது தானியம் விளையும் கதிர்களைக் குறிக்கிறது; ‘தானியக் கதிர்கள்’ என்பது இன்றைய வாசகருக்குத் தெளிவான வேளாண்மைச் சொற்றொடர்.
- source_word: עֹלֹת
  choice: வளர்ந்து வந்தன
  rationale: நிகழ்ந்துகொண்டிருக்கும் காட்சியைச் சுட்டும் எபிரெயப் பங்கேற்பு வடிவத்தின் தொடர்ச்சியான உணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּקָנֶה אֶחָד
  choice: ஒரே தண்டில்
  rationale: பல கதிர்கள் ஒரு தனித் தண்டில் தோன்றுவதைச் சுருக்கமாகவும் இயல்பாகவும் கூறுகிறது; בְּ என்ற முன்னிடைச்சொல்லின் இடப்பொருளைத் தக்கவைக்கிறது.
- source_word: בְּרִיאוֹת
  choice: செழுமையானவையாக
  rationale: தானியக் கதிர்கள் நன்கு நிரம்பி, வளமாக இருந்த நிலையைக் குறிக்கிறது; தமிழில் பொருந்தாத ‘கொழுத்த’ என்ற நேரடிச் சொல்லைத் தவிர்க்கிறது.
- source_word: וְטֹבוֹת
  choice: நல்லவையாகவும்
  rationale: טוֹב என்பதன் விரிவான மதிப்பீட்டுப் பொருளைத் தீர்மானித்துக் குறுக்காமல் நேரடியாகப் பாதுகாக்கிறது.
