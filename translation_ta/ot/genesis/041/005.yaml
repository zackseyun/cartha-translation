- from: பின்பு அவன் தூங்கி, இரண்டாம் முறையாகக் கனவு கண்டான். இதோ, ஒரே தண்டில் ஏழு தானியக் கதிர்கள்[a] செழுமையானவையாகவும்[b] நல்லவையாகவும் வளர்ந்து வந்தன.
  to: பின்பு அவன் தூங்கினான்; இரண்டாம் முறையாகக் கனவு கண்டான். இதோ, ஒரே தண்டில் ஏழு தானியக் கதிர்கள்[a] நன்கு நிரம்பியவையாகவும்[b] நல்லவையாகவும் வளர்ந்து வந்தன.
