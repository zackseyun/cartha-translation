translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ மூலம் கனவுக் காட்சியின் உயிரோட்டம் காக்கப்படுகிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன; ஆலோசனை ஆங்கில உரையில் காணப்பட்ட குறியிட அமைப்பு பொருளோடு ஒத்திசைக்கப்பட்டது.
