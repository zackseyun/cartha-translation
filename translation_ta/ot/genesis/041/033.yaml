base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/033.yaml
  text: Now let Pharaoh look for a discerning and wise man[a], and appoint him over the land of Egypt.
translation:
  language: ta
  text: இப்போது பார்வோன் பகுத்தறிவும் ஞானமும் உள்ள ஒரு மனிதனைத் தேடிப் பார்க்கட்டும்[a]; அவனை எகிப்து நாட்டின்மேல் நியமிக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பகுத்தறிவும் ஞானமும் உள்ள ஒரு மனிதனைப் பார்வோன் கண்டறியட்டும்/தேர்ந்தெடுக்கட்டும்.” இங்குள்ள எபிரெய வினைச்சொல் சூழலுக்கேற்ப பார்த்தல், கண்டறிதல், அல்லது தேர்ந்தெடுத்தல் என்ற பொருள்களைக் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: யோசேப்பு கனவின் விளக்கத்திலிருந்து நடைமுறை ஆலோசனைக்குத் திரும்புவதை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: יֵרֶא
  choice: தேடித் தேர்ந்தெடுத்து
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘பார்’ என்றாலும், இச்சூழலில் தகுதியான ஒருவரைக் கண்டறிந்து தேர்வு செய்யும் கட்டளைநயத்தை வெளிப்படுத்துகிறது; அடிக்குறிப்பு மூலச் சொல்லின் பொருள் வீச்சைப் பாதுகாக்கிறது.
- source_word: פַרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரசருக்கான பட்டத்தின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: אִישׁ
  choice: ஒரு மனிதனை
  rationale: எபிரெயச் சொல் ஆண்பால் ஒருமையில் இருப்பதையும், சூழலில் ஓர் ஆண் அதிகாரியைக் குறிப்பதையும் காக்கிறது.
- source_word: נָבוֹן
  choice: பகுத்தறிவும்
  rationale: நிர்வாகச் சூழலுக்கேற்ற தெளிந்த புரிதல், விவேகம், நிதானமான தீர்மானத்திறன் ஆகியவற்றை உணர்த்துகிறது.
- source_word: וְחָכָם
  choice: ஞானமும் உள்ள
  rationale: நல்ல தீர்ப்பையும் நடைமுறைத் திறனையும் குறிக்கும் חכם என்பதற்கு இயல்பான, மரியாதைமிக்க தமிழ் இணை.
- source_word: וִישִׁיתֵהוּ
  choice: அவனை ... அதிகாரியாக நியமிக்கட்டும்
  rationale: ‘வை/நிறுத்து’ என்ற சொல்லை அரசாட்சி மற்றும் நிர்வாகச் சூழலில் அதிகாரப் பொறுப்பில் நியமித்தல் எனத் தெளிவாக மொழிபெயர்க்கிறது.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டின்மேல்
  rationale: עַל குறிக்கும் மேலாதிக்கத்தையும், אֶרֶץ מִצְרַיִם என்பதிலுள்ள ‘எகிப்து நாடு’ என்ற பரப்பையும் காக்கிறது.
