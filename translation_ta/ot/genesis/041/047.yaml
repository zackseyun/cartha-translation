base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/047.yaml
  text: During the seven years of abundance[a], the land produced by handfuls.
translation:
  language: ta
  text: செழிப்பான அந்த ஏழு ஆண்டுகளில், நிலம் கைப்பிடி கைப்பிடியாக[a] விளைச்சலைத் தந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏராளமாக.’ இங்குள்ள எபிரெயச் சொல் நேரடியாக ‘கைப்பிடிகளாக’ அல்லது ‘முஷ்டியளவுகளாக’ என்று பொருள்பட்டு, நிலம் தந்த விளைச்சலின் மிகுதியை விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַשׂ
  choice: விளைச்சலைத் தந்தது
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்தது/உண்டாக்கியது’ என்பதாக இருந்தாலும், இங்கு நிலம் எழுவாயாக வரும் வேளாண்மைச் சூழலில் ‘விளைச்சலைத் தந்தது’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הָאָרֶץ
  choice: நிலம்
  rationale: இது முழு பூமியைக் குறிக்காமல், எகிப்தின் விளைநிலத்தைக் குறிக்கிறது; எனவே ‘நிலம்’ என்பது சூழலுக்கு ஏற்றது.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: செழிப்பான அந்த ஏழு ஆண்டுகளில்
  rationale: שׂבע குறிக்கும் நிறைவும் மிகுதியும் ‘செழிப்பான’ என்பதில் இயல்பாக வெளிப்படுகின்றன; ‘அந்த’ என்பது முன்பே அறிவிக்கப்பட்ட ஏழு ஆண்டுகளைச் சுட்டுகிறது.
- source_word: לִקְמָצִים
  choice: கைப்பிடி கைப்பிடியாக
  rationale: קְמָץ என்பது ‘ஒரு கைப்பிடி அளவு’ அல்லது ‘முஷ்டியளவு’ என்பதைக் குறிக்கிறது. இரட்டிப்புச் சொற்றொடர் எபிரெய உருவகத்தைத் தக்கவைத்து, விளைச்சலின் மிகுதியைத் தமிழில் இயல்பாக உணர்த்துகிறது.
