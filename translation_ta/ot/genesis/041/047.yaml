translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரெய மொழியின் தெளிவற்றதாயினும் உயிரோட்டமுள்ள ‘கைப்பிடிகள்’ என்ற உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
