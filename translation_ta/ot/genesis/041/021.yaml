  text: And they went into their bellies[a], but it was not known that they had gone into their bellies, and their appearance was bad, just as at the beginning[b]. Then I awoke.
translation:
  language: ta
  text: நல்ல பசுக்கள் மெலிந்த பசுக்களின் வயிற்றுக்குள் சென்ற பிறகும்[a], அவை அவற்றின் வயிற்றுக்குள் சென்றது தெரியவில்லை; மெலிந்த பசுக்களின் தோற்றம் தொடக்கத்தில் இருந்ததைப் போலவே மோசமாக இருந்தது[b]. பிறகு நான் விழித்துக்கொண்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “அவற்றின் உட்பகுதிக்குள்.” இங்கு விழுங்கப்பட்ட நல்ல பசுக்கள் மெலிந்த பசுக்களின் வயிற்றுக்குள் சென்றதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, மெலிந்த பசுக்கள் உண்ணுவதற்கு முன்பு இருந்ததைப் போலவே அவற்றின் தோற்றம் மோசமாக இருந்தது.
    reason: contextual_clarification
lexical_decisions:
- source_word: וַתָּבֹאנָה אֶל קִרְבֶּנָה
  choice: அவை இவற்றின் வயிற்றுக்குள் சென்றன
  rationale: בוא என்பதன் தொடர்நிகழ்வு வடிவை ‘சென்றன’ என இயல்பாக வழங்குகிறது. קֶרֶב என்பது உள்ளகம்/நடுப்பகுதி எனப் பொருள்படலாம்; பசுக்கள் விழுங்கப்பட்ட கனவுக் காட்சியில் ‘வயிற்றுக்குள்’ என்பது உடலின் உட்பகுதியைத் தெளிவாகக் காட்டுகிறது. ‘அவை—இவை’ என்ற வேறுபாடு, முந்தைய வசனத்தில் விழுங்கப்பட்ட பசுக்களையும் அவற்றை விழுங்கிய பசுக்களையும் குழப்பாமல் சுட்டுகிறது.
- source_word: וְלֹא נוֹדַע כִּי בָאוּ אֶל קִרְבֶּנָה
  choice: ஆனால் அவை இவற்றின் வயிற்றுக்குள் சென்றன என்பதே தெரியவில்லை
  rationale: Niphal வடிவின் உணரப்படாத/தெரியாத நிலையை ‘தெரியவில்லை’ எனக் காக்கிறது; כִּי அறியப்படாத செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதால் ‘என்பதே’ பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்திலுள்ள மீளுரையும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: וּמַרְאֵיהֶן רַע
  choice: இவற்றின் தோற்றமும் ... மோசமாக இருந்தது
  rationale: מַרְאֶה வெளிப்படையான தோற்றத்தைக் குறிக்கிறது; רַע என்பதைக் குறிப்பாக ‘அருவருப்பான’ அல்லது ‘மெலிந்த’ என்று சுருக்காமல், அதன் பரந்த மதிப்பீட்டு நுணுக்கத்தை ‘மோசமாக’ காக்கிறது.
- source_word: כַּאֲשֶׁר בַּתְּחִלָּה
  choice: தொடக்கத்தில் இருந்ததைப் போலவே
  rationale: உண்ட பின்பும் அவற்றின் தோற்றம் கனவின் தொடக்கத்தில் இருந்த நிலையைப் போலவே இருந்தது என்ற கால ஒப்பீட்டை இயல்பான தமிழில் தருகிறது.
- source_word: וָאִיקָץ
  choice: பிறகு நான் விழித்துக்கொண்டேன்
  rationale: கனவு விவரிப்பின் இறுதி தொடர்நிகழ்வை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
