  naturalness: ‘அவை இவற்றின் வயிற்றுக்குள் சென்றன’ என்பது இலக்கணப்படி சாத்தியமானது, ஆனால் நவீனத் தமிழில் தொடர்ச்சியான சுட்டுப்பெயர்கள் வாசகருக்குக் குழப்பத்தை உண்டாக்கும். ‘நல்ல பசுக்கள்’ மற்றும் ‘மெலிந்த பசுக்கள்’ என்று மீண்டும் குறிப்பிடுவதும், முதல் நிகழ்வை ‘சென்ற பிறகும்’ என அமைப்பதும் தெளிவான இயல்பான நடையைத் தருகிறது.
  terminology: ‘வயிற்றுக்குள்’ கனவுச் சூழலில் קֶרֶב என்பதன் உட்பகுதி என்னும் பொருளை இயல்பாகக் காட்டுகிறது. מַרְאֶה / רַע என்பதற்கு ‘தோற்றம் ... மோசமாக இருந்தது’ என்பது தேவையற்ற குறிப்பாக்கமின்றி பொருந்துகிறது. ‘நல்ல’ மற்றும் ‘மெலிந்த’ என்பவை இவ்வசனத்தின் உடனடி முந்தைய சூழலில் உள்ள பசுக்களை அடையாளம் காட்டுவதற்காக மட்டுமே பயன்படுத்தப்படுகின்றன.
