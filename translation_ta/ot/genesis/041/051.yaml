base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/051.yaml
  text: Joseph called the name of the firstborn Manasseh[a], for he said[c][b], “God has made me forget all my hardship and all my father’s house.”
translation:
  language: ta
  text: யோசேப்பு தன் முதற்பேறான மகனுக்கு மனாசே[a] என்று பெயரிட்டான். ஏனெனில், “என் துன்பம் அனைத்தையும் மற்றும் என் தந்தையின் குடும்பத்தையும் கடவுள் என்னை மறக்கச் செய்தார்” என்று அவன் சொன்னான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனாசே” என்ற பெயர், “மறக்கச் செய்தல்” என்று பொருள்படும் எபிரெயச் சொல்லுடன் ஒத்தொலிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “தந்தையின் குடும்பம்” என்பது ஒருவரின் தந்தைவழிக் குடும்பம் அல்லது குடும்பத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרָא יוֹסֵף אֶת שֵׁם הַבְּכוֹר
  choice: யோசேப்பு தன் முதற்பேறானவனுக்கு … என்று பெயரிட்டான்
  rationale: எபிரெய ‘பெயரை அழைத்தான்’ என்ற அமைப்பை இயல்பான நவீன தமிழில் ‘பெயரிட்டான்’ என வழங்குகிறது; ‘முதற்பேறானவன்’ என்ற வெளிப்படையான குறிப்பையும் காக்கிறது.
- source_word: מְנַשֶּׁה
  choice: மனாசே
  rationale: வழக்கிலுள்ள தமிழ் ஒலிபெயர்ப்பு; தொடர்ந்து வரும் ‘மறக்கச் செய்தார்’ என்ற சொல்லோசையை அடிக்குறிப்பு விளக்குகிறது.
- source_word: כִּי
  choice: ஏனெனில் … என்று அவன் சொன்னான்
  rationale: பெயருக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் பணியைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; ‘அவன் சொன்னான்’ என்பது சூழலில் மறைந்துள்ள உரை அறிமுகத்தை வெளிப்படுத்துகிறது.
- source_word: נַשַּׁנִי
  choice: என்னை மறக்கச் செய்தார்
  rationale: נשׁה வேரின் காரணவினைப் பொருளைக் காக்கிறது; மனாசே என்ற பெயருடனான சொல் தொடர்பையும் தமிழில் விளக்கத்தக்கதாக வைத்திருக்கிறது.
- source_word: כָּל עֲמָלִי
  choice: என் துன்பங்கள் அனைத்தையும்
  rationale: עָמָל என்பதன் துன்பம், தொல்லை, கடின உழைப்பு ஆகிய பொருள் எல்லையைச் சூழலுக்கேற்ற பொதுவான சொல்லால் வெளிப்படுத்துகிறது.
- source_word: כָּל בֵּית אָבִי
  choice: என் தந்தையின் குடும்பத்தார் அனைவரையும்
  rationale: ‘தந்தையின் வீடு’ என்பது தந்தைவழிக் குடும்பம் அல்லது குடும்பத்தாரைக் குறிக்கும் எபிரெய மரபுத்தொடர்; தமிழில் தவறாகக் கட்டிடத்தை மட்டும் குறிக்காமல் அதன் உறவுமுறைப் பொருளை இயல்பாக அளிக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு ஒருமைப் பொருளும் ஒருமை வினைச் சூழலும் தெளிவாக இருப்பதால் நவீன நிலையான தமிழின் பொதுவான இறைப்பெயர் பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: யோசேப்பு தன் தந்தையின் குடும்பத்தாரை ‘மறந்தார்’ என்பதன் சாத்தியமான பொருள்
  choice: கடவுள் தன்னைத் துன்பங்களையும் தந்தையின் குடும்பத்தாரையும் மறக்கச் செய்தார் என்ற யோசேப்பின் விளக்கத்தை நேரடியாக வழங்குதல்
  alternative: குடும்பத்துடன் தொடர்புடைய வேதனையை மட்டும் மறக்கச் செய்தார் என மென்மைப்படுத்துதல்
  rationale: எபிரெய உரை கூறும் இறையியல் மற்றும் உணர்வுசார் பதற்றத்தைத் தீர்த்துவிடாமல் காக்கிறது; இதை மிகைப்படுத்தல் அல்லது வேதனை நீங்குதல் என்று மொழிபெயர்ப்பிலேயே விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை. மூலத்தின் பெயரிடும் சொல்விளையாட்டும் ‘மறத்தல்’ குறித்த தீர்க்கப்படாத பதற்றமும் பாதுகாக்கப்பட்டுள்ளன; ‘தந்தையின் வீடு’ என்ற சொற்றொடர் தமிழில் கட்டிடமாகப் புரிந்துகொள்ளப்படாமல் அதன் உறவுமுறைப் பொருளில் வழங்கப்பட்டுள்ளது.
