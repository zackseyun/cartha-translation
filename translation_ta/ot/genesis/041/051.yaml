- from: யோசேப்பு தன் முதற்பேறானவனுக்கு மனாசே[a] என்று பெயரிட்டான். ஏனெனில், “என் துன்பங்கள் அனைத்தையும் என் தந்தையின் குடும்பத்தார் அனைவரையும் கடவுள் என்னை மறக்கச் செய்தார்” என்று அவன் சொன்னான்.[b]
