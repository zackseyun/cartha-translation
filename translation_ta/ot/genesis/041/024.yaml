base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/024.yaml
  text: And the thin ears swallowed up the seven good ears[a]. Then I told the magicians[c][b], but there was no one who could explain it to me.
translation:
  language: ta
  text: மெலிந்த கதிர்கள் நல்ல ஏழு கதிர்களையும் விழுங்கிவிட்டன[a]. நான் மந்திரவாதிகளிடம் இதைச் சொன்னேன்[b]; ஆனால் எனக்கு இதன் பொருளை விளக்க யாராலும் முடியவில்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தானியத் தலைகள்.’
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘மந்திரவாதிகள்’ என்பது எகிப்தியச் சடங்கு நிபுணர்களையும் கனவுகளுக்கு விளக்கம் கூறுவோரையும் குறிக்கும் சொல்.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘அதை எனக்கு விளக்கிச் சொல்லக்கூடியவர் யாரும் இல்லை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְןָ
  choice: விழுங்கிவிட்டன
  rationale: בלע என்ற வினை கனவின் உயிரோட்டமான காட்சியைச் சுட்டுகிறது; ‘விழுங்கிவிட்டன’ என்பது அந்த முழுமையான உட்கொள்ளுதலை இயல்பான தமிழில் தருகிறது.
- source_word: שִׁבֳּלִים
  choice: கதிர்கள்
  rationale: வேளாண்மைச் சூழலில் இது தானியக் கதிர்களைக் குறிக்கிறது; ‘கதிர்கள்’ என்பது சுருக்கமான, இயல்பான நவீனத் தமிழ்.
- source_word: הַדַּקֹּת
  choice: மெலிந்த
  rationale: דק என்பதன் ‘மெல்லிய/மெலிந்த’ பொருளை, நல்ல கதிர்களுடனான எதிர்மறை ஒப்பீட்டில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַטֹּבוֹת
  choice: நல்ல
  rationale: טוב என்பதன் பரந்த ‘நல்ல’ பொருளை நேரடியாகப் பாதுகாக்கிறது; ‘செழுமையான’ போன்ற விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
- source_word: וָאֹמַר אֶל
  choice: நான் ... சொன்னேன்
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘நான் அவர்களிடம் சொன்னேன்’ என்கிறது; தமிழில் பொருள் தெளிவதற்காகச் சூழலில் மறைந்துள்ள கனவை ‘இதை’ என வெளிப்படுத்துவது இயல்பானது.
- source_word: הַחַרְטֻמִּים
  choice: மந்திரவாதிகள்
  rationale: எகிப்திய அரசவையின் சடங்கு நிபுணர்களையும் கனவு விளக்குவோரையும் குறிக்கும் மரபான சொல்லாக ‘மந்திரவாதிகள்’ பயன்படுத்தப்படுகிறது; அதன் பண்பாட்டு விரிவு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְאֵין מַגִּיד לִי
  choice: எனக்கு இதன் பொருளை விளக்க யாராலும் முடியவில்லை
  rationale: מגיד இங்கு வெறுமனே சொல்வதைவிட கனவின் பொருளைத் தெரியப்படுத்துவதைக் குறிக்கிறது. இயலாமையைச் சூழல் உணர்த்துவதால் இவ்வாக்கியம் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
