  yaml_path: translation/ot/genesis/041/014.yaml
  text: Then Pharaoh sent and called for Joseph[a], and they quickly brought him out of the pit. He shaved, changed his clothes[c][b], and came to Pharaoh.
translation:
  language: ta
  text: அப்போது பார்வோன் ஆள் அனுப்பி யோசேப்பை அழைத்தான். அவர்கள் அவனைக் குழியிலிருந்து[a] விரைவாக வெளியே கொண்டுவந்தார்கள். அவன் சவரம் செய்து, தன் உடைகளை மாற்றி, பார்வோனிடம் வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயச் சொல் நேரடியாக ‘குழி’ என்று பொருள்படும்; இச்சூழலில் அது சிறை அடைப்பிடத்தையோ நீர்த்தொட்டி போன்ற குழியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא אֶת יוֹסֵף
  choice: ஆள் அனுப்பி யோசேப்பை அழைத்தான்
  rationale: இரு எபிரேய வினைகளையும் வெளிப்படுத்துவதோடு, பார்வோன் யோசேப்பை வரவழைத்தான் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיְרִיצֻהוּ
  choice: அவனை ... விரைவாகக் கொண்டுவந்தார்கள்
  rationale: காரணவினை வடிவம் யோசேப்பை அவசரமாக வெளியே கொண்டுவரச் செய்ததை உணர்த்துகிறது; மறைந்துள்ள பணியாளர்களைப் பன்மை எழுவாயாகத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִן הַבּוֹר
  choice: சிறைக்குழியிலிருந்து
  rationale: בּוֹר என்பதன் அடிப்படைப் பொருளான ‘குழி’யையும், இங்கு அது சிறை அடைப்பிடமாக இருப்பதையும் ஒருங்கே தெரிவிக்கிறது.
- source_word: וַיְגַלַּח
  choice: சவரம் செய்துகொண்டு
  rationale: செய்வினை வடிவத்தையும் பார்வோனைச் சந்திப்பதற்கான உடல் பராமரிப்பையும் இயல்பான நவீன தமிழில் குறிக்கிறது; எதைச் சவரம் செய்தான் என்பதை மூல உரை குறிப்பிடாததால் அதைச் சேர்க்கவில்லை.
- source_word: וַיְחַלֵּף שִׂמְלֹתָיו
  choice: தன் உடைகளை மாற்றி
  rationale: தனக்குரிய ஆடைகளை மாற்றிக்கொண்டான் என்ற மூலப்பொருளைத் தெளிவான பொதுநடைத் தமிழில் வழங்குகிறது.
- source_word: וַיָּבֹא אֶל פַּרְעֹה
  choice: பார்வோனிடம் வந்தான்
  rationale: בוא אל என்பதன் நேரான இயக்கப் பொருளைத் தக்கவைக்கிறது; அரசவைக்குள் நுழைந்தான் போன்ற மூலத்தில் வெளிப்படாத விவரத்தைச் சேர்க்கவில்லை.
