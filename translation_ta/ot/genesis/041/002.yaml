base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/002.yaml
  text: And behold[a], seven cows were coming up from the Nile, beautiful in appearance and fat in flesh[c][b], and they were grazing in the reed grass.
translation:
  language: ta
  text: இதோ, நைல் நதியிலிருந்து[a] தோற்றத்தில் அழகான[b], உடல் பருத்த ஏழு பசுக்கள் மேலேறி வந்து, நாணற்புல்லில்[c] மேய்ந்துகொண்டிருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆற்றிலிருந்து”; எகிப்தியச் சூழலில் எபிரெயச் சொல் பொதுவாக நைல் நதியையே குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பார்ப்பதற்கு அழகாக.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “நாணல்களுக்கு நடுவில்” அல்லது “சதுப்புநிலப் புல்வெளியில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கனவுக் காட்சியை வாசகரின் கவனத்துக்குக் கொண்டுவரும் உயிரோட்டமான சுட்டுச்சொல்லை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: הַיְאֹר
  choice: நைல் நதி
  rationale: எகிப்தியச் சூழலில் இச்சொல் பொதுவான ஓர் ஆற்றைக் காட்டிலும் குறிப்பாக நைல் நதியையே குறிக்கிறது.
- source_word: עֹלֹת
  choice: மேலேறி வந்து
  rationale: நதியிலிருந்து பசுக்கள் மேலே வந்து கொண்டிருக்கும் காட்சியையும் எபிரெயப் பங்கேற்பு வினையின் தொடர்நிலைத் தன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פָּרוֹת
  choice: பசுக்கள்
  rationale: பெண்பால் மாடுகளைக் குறிக்கும் மூலச்சொல்லுக்கு நேரடியான, பொதுவாகப் புரியும் தமிழ்ச் சொல்.
- source_word: יְפוֹת מַרְאֶה
  choice: பார்ப்பதற்கு அழகாக
  rationale: வெளித்தோற்றம் கண்ணுக்கு இனிமையாக இருந்ததைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וּבְרִיאֹת בָּשָׂר
  choice: உடல் பருத்தவையாக
  rationale: பொதுவான உடல்நலத்தை மட்டும் அல்லாமல் சதைப்பிடித்த உடல் நிறைவை வலியுறுத்தும் மூலப்படிமத்தைப் பாதுகாக்கிறது.
- source_word: וַתִּרְעֶינָה
  choice: மேய்ந்துகொண்டிருந்தன
  rationale: கனவில் காணப்படும் தொடரும் காட்சியாக மேயும் செயலை நவீனத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: בָּאָחוּ
  choice: கோரைப்புல் வெளியில்
  rationale: நைல் நதிக்கரையோர சதுப்புநிலத் தாவரங்கள் நிறைந்த இடத்தைக் குறிக்கும் சொல்லின் சூழல்சார்ந்த பொருளைத் தெரிவிக்கிறது.
