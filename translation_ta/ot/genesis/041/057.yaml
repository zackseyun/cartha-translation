revisions:
- from: பஞ்சம் பூமியெங்கும் கடுமையாக இருந்ததால், எல்லா நாடுகளிலிருந்தும் மக்கள் தானியம் வாங்குவதற்காக எகிப்திலிருந்த யோசேப்பிடம் வந்தார்கள்.[a]
  to: பூமி முழுவதிலிருந்தும் மக்கள் தானியம் வாங்குவதற்காக எகிப்துக்குச் சென்று, அங்கிருந்த யோசேப்பிடம் வந்தார்கள்; ஏனெனில் பஞ்சம் பூமி முழுவதும் கடுமையாக இருந்தது.[a]
  rationale: The revision explicitly renders the movement toward Egypt, preserves the repeated broad Hebrew expression הָאָרֶץ, and keeps the contextual clarification that those who came were people. No theological or denominational interpretation has been added.
