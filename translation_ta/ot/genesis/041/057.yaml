translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. முதல் וְ இணைப்பு தமிழில் தனியாக ‘மேலும்’ எனத் தொடங்காமல், காரணவியல் வாக்கிய அமைப்பில் இயல்பாக உட்பொதிக்கப்பட்டுள்ளது. மூலத்தின் இரு הָאָרֶץ பயன்பாடுகளின் சொல் மீளுருவாக்கத்தை அப்படியே வைத்தால் தமிழில் குழப்பம் ஏற்படும் என்பதால், முதல் இடத்தில் மக்களையும் நாடுகளையும் வெளிப்படையாக்கி, இரண்டாம் இடத்தில் ‘பூமியெங்கும்’ எனப் பரந்த சொல்லாட்சி பாதுகாக்கப்பட்டுள்ளது.
