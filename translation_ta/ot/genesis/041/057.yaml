source:
  edition: WLC
  text: וְ/כָל הָ/אָ֨רֶץ֙ בָּ֣אוּ מִצְרַ֔יְמָ/ה לִ/שְׁבֹּ֖ר אֶל יוֹסֵ֑ף כִּֽי חָזַ֥ק הָ/רָעָ֖ב בְּ/כָל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/057.yaml
  text: And all the earth came to Egypt to Joseph to buy grain[a], because the famine was severe in all the earth.
translation:
  language: ta
  text: பூமி முழுவதிலிருந்தும் மக்கள் தானியம் வாங்குவதற்காக எகிப்துக்குச் சென்று, அங்கிருந்த யோசேப்பிடம் வந்தார்கள்; ஏனெனில் பஞ்சம் பூமி முழுவதும் கடுமையாக இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பூமி முழுவதிலிருந்தும்” மற்றும் “பூமி முழுவதும்” என்பதற்கான எபிரேயச் சொல் אֶרֶץ (எரெட்ஸ்); இதற்கு “பூமி,” “நிலம்,” அல்லது “நாடு” என்று பொருள் கொள்ளலாம். இங்கே பஞ்சத்தால் பாதிக்கப்பட்ட பரந்த பகுதிகளையும் அங்குள்ள மக்களையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: எல்லா நாடுகளிலிருந்தும் மக்கள்
  rationale: எபிரேயச் சொற்றொடர் சொல்லுக்கு சொல் ‘பூமி முழுவதும்’ என இருந்தாலும், வருதல் என்ற செயலைச் செய்வோர் மக்களே. இச்சூழலில் பஞ்சத்தால் பாதிக்கப்பட்ட சுற்றுப்புற நாடுகளை விரிவாகக் குறிக்கும் இயல்பான தமிழாக்கம் இது; அதன் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בָּאוּ מִצְרַיְמָה
  choice: எகிப்திலிருந்த ... வந்தார்கள்
  rationale: திசையைக் குறிக்கும் מִצְרַיְמָה எகிப்தை நோக்கிய இயக்கத்தைத் தெரிவிக்கிறது. யோசேப்பு எகிப்தில் இருந்தார் என்பதைத் தமிழில் இயல்பாகத் தெளிவாக்க இவ்வாறு அமைக்கப்பட்டுள்ளது.
- source_word: לִשְׁבֹּר
  choice: தானியம் வாங்குவதற்காக
  rationale: பஞ்சச் சூழலில் שׁבר என்பது பொதுவாக ஏதாவது வாங்குவதை அல்ல, தானியம் வாங்குவதைச் சுட்டும் மரபுத்தொடர்.
- source_word: אֶל יוֹסֵף
  choice: யோசேப்பிடம்
  rationale: மூலத்தில் சொல்லர்த்தமாக ‘யோசேப்பை நோக்கி/யோசேப்பிடம்’ என்று உள்ளது. தானிய விநியோகத்தின் நிர்வாகியான அவரிடம் மக்கள் வந்தனர் என்ற பொருளை, ‘யோசேப்பிடமிருந்து’ என்று மிகையாக விளக்காமல் பாதுகாக்கிறது.
- source_word: כִּי
  choice: '...தால்'
  rationale: மக்கள் எகிப்துக்கு வந்ததற்கான காரணத்தை அறிமுகப்படுத்தும் காரணவியல் இணைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חָזַק הָרָעָב
  choice: பஞ்சம் ... கடுமையாக இருந்ததால்
  rationale: חָזַק என்பதன் அடிப்படைப் பொருள் ‘வலுவாக இருந்தது’; பஞ்சத்தைப் பற்றிய தமிழில் ‘கடுமையாக இருந்தது’ என்பதே இயல்பும் துல்லியமும் உடையது.
- source_word: בְּכָל הָאָרֶץ
  choice: பூமியெங்கும்
  rationale: மூலத்தின் இரண்டாவது பரந்த הָאָרֶץ சொற்றொடரைச் சுருக்காமல் வைத்திருக்கிறது; ‘நாடு/நிலம்/பூமி’ என்ற சொல்லின் பொருள் நெகிழ்வு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
