base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/032.yaml
  text: And as for the dream being repeated to Pharaoh twice[a], it is because the matter is fixed by God[b], and God is hastening to do it.
translation:
  language: ta
  text: பார்வோனுக்கு அந்தக் கனவு இருமுறை வந்ததைப் பொறுத்தவரை, அந்தக் காரியம் கடவுளால் உறுதிசெய்யப்பட்டுள்ளது[a]; அதைச் செய்யக் கடவுள் விரைகிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “அந்தக் காரியம் கடவுளிடமிருந்து உறுதிப்படுத்தப்பட்டுள்ளது.”'
    reason: lexical_alternative
  - marker: b
    text: 'வேறு வகையில்: “கடவுள் அதை விரைவில் செய்வார்” அல்லது “கடவுள் அதைச் செய்யவிருக்கிறார்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: அதைப் பொறுத்தவரை
