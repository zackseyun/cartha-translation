- source_word: הִשָּׁנוֹת הַחֲלוֹם
  choice: அந்தக் கனவு ... வந்தது
  rationale: கனவு மீண்டும் நிகழ்ந்ததைக் குறிக்கும் செயலற்ற பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘இருமுறை’ என்பதால் மறுநிகழ்வு தெளிவாகிறது.
- source_word: אֶל־פַּרְעֹה פַּעֲמָיִם
  choice: பார்வோனுக்கு ... இருமுறை
  rationale: கனவு பார்வோனுக்கு இரண்டு முறை வந்தது என்ற திசை/அனுபவப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: כִּי נָכוֹן הַדָּבָר
  choice: அந்தக் காரியம் ... உறுதிசெய்யப்பட்டுள்ளது
  rationale: அறிவிக்கப்பட்ட நிகழ்வு உறுதியானதும் தீர்மானிக்கப்பட்டதுமாக இருப்பதைத் தெரிவிக்கிறது; ‘காரியம்’ என்பது דָּבָר என்பதன் சூழல்சார் பரந்த பொருளைப் பேணுகிறது.
- source_word: מֵעִם הָאֱלֹהִים
  choice: கடவுளால்
  rationale: அந்தக் காரியத்தின் உறுதியும் தீர்மானமும் கடவுளிடமிருந்து வருவதைத் தெளிவான தமிழில் குறிக்கிறது.
- source_word: וּמְמַהֵר הָאֱלֹהִים
  choice: கடவுள் ... விரைகிறார்
  rationale: எபிரெயப் பெயரெச்சத்தின் நிகழ்காலத் தீவிரத்தையும் உடனடிச் செயல்பாட்டையும் காக்கிறது.
- source_word: לַעֲשֹׂתוֹ
  choice: அதைச் செய்ய
  rationale: அறிவிக்கப்பட்ட காரியத்தை கடவுள் செயல்படுத்துவார் என்பதைக் கூடுதல் விளக்கமின்றி நேரடியாகக் கூறுகிறது.
theological_decisions:
- issue: הָאֱלֹהִים என்பதன் எண் மற்றும் குறிப்பு
  choice: கடவுள்
  alternative: தெய்வங்கள்
  rationale: சொல் வடிவத்தில் பன்மைத் தோற்றம் இருந்தாலும், ஒருமை வினை அமைப்பும் யோசேப்பின் உரைச் சூழலும் ஒரே கடவுளையே தெளிவாகக் குறிக்கின்றன.
- issue: נָכוֹן מֵעִם הָאֱלֹהִים என்பதில் தெய்வீகச் செயலின் தன்மை
  choice: கடவுளால் உறுதிசெய்யப்பட்டுள்ளது
  alternative: கடவுளிடமிருந்து உறுதிப்படுத்தப்பட்டுள்ளது
  rationale: முதன்மை வாசகம் தெய்வீகத் தீர்மானத்தை இயல்பான தமிழில் தருகிறது; மாற்று வாசகம் מֵעִם என்பதன் மூலாதார நுணுக்கத்தை மேலும் வெளிப்படையாக வைத்திருக்கிறது.
- issue: מְמַהֵר என்பதன் கால/அண்மை நுணுக்கம்
  choice: விரைகிறார்
  alternative: விரைவில் செய்வார் / செய்யவிருக்கிறார்
  rationale: பெயரெச்ச வடிவத்தின் தொடரும், அண்மையான செயற்பாட்டை முதன்மை வாசகம் காக்கிறது; எதிர்கால அல்லது உடனடி நிறைவேற்றம் என்ற வாசிப்புகளும் சாத்தியம்.
translation_notes:
  register: நவீன பொதுத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘உறுதிசெய்யப்பட்டுள்ளது’ தெய்வீகத் தீர்மானத்தின் உறுதியைத் தருகிறது; ‘விரைகிறார்’ எபிரெய மூலத்தின் உடனடித் தன்மையையும் நிகழ்நிலைச் சாயலையும் காக்கிறது. அடிக்குறிகள் மூலமொழியில் சாத்தியமான மாற்று நுணுக்கங்களைத் தீர்த்துவிடாமல் பதிவு செய்கின்றன.
