  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தெளிவற்ற ‘அப்ரேக்’ மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டு, சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
