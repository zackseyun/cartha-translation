base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/043.yaml
  text: He had him ride in the second chariot that he had[a], and they cried out before him, “Abrek!” And he set him over all the land of Egypt.
translation:
  language: ta
  text: தனக்கிருந்த இரண்டாவது தேரில் அவனை ஏறிச் செல்லச் செய்தான். அவனுக்கு முன்பாக, “அப்ரேக்!”[a] என்று முழக்கமிட்டார்கள். இவ்வாறு எகிப்து நாடு முழுவதற்கும் அவனை அதிகாரியாக வைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அப்ரேக்” என்பது பொருள் உறுதியாகத் தெரியாத கடினமான சொல். இது எகிப்திய அல்லது எபிரெய மரியாதை முழக்கமாக இருக்கலாம். பலர் இதை “மண்டியிடுங்கள்!” என்பது போன்ற பொருளில் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכֵּב
  choice: அவனை ஏறிச் செல்லச் செய்தான்
  rationale: רכב என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளைக் கொண்டது; யோசேப்பு தேரில் பயணிக்கும்படி பார்வோன் செய்தான் என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּמִרְכֶּבֶת הַמִּשְׁנֶה אֲשֶׁר לוֹ
  choice: தனக்கிருந்த இரண்டாம் தரத் தேரில்
  rationale: מִשְׁנֶה என்பது இரண்டாம் இடம் அல்லது தரத்தைக் குறிக்கிறது. இது பார்வோனுடைய தேருக்கு அடுத்த தரத்திலிருந்த தேரைக் குறிக்கலாம்; ‘தனக்கிருந்த’ என்பது எபிரெய உறவுத்தொடரை வெளிப்படையாக வைத்திருக்கிறது.
- source_word: וַיִּקְרְאוּ לְפָנָיו
  choice: அவனுக்கு முன்னால் … என்று மக்கள் முழக்கமிட்டார்கள்
  rationale: קרא இங்கு ஊர்வலத்துக்கு முன்னால் செய்யப்படும் பொதுமக்கள் அறிவிப்பு அல்லது உரத்த முழக்கத்தைக் குறிக்கிறது. எபிரெய வினையின் பன்மை எழுவாய் தமிழில் தெளிவாக இருக்க ‘மக்கள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: אַבְרֵךְ
  choice: அப்ரேக்
  rationale: இந்தச் சொல்லின் பொருள் உறுதியாகத் தெரியவில்லை; இது எகிப்தியச் சொல்லாகவோ எபிரெய மரியாதை முழக்கமாகவோ இருக்கலாம். ஆகவே பொருளைத் தீர்மானிக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְנָתוֹן אֹתוֹ
  choice: இவ்வாறு … அவனை அதிகாரியாக வைத்தான்
  rationale: முழுமை வினையெச்ச வடிவமும் தொடரின் நியமனச் சூழலும் விளைவைக் காட்டுகின்றன. ‘அதிகாரியாக வைத்தான்’ என்பது ஆட்சியதிகாரம் வழங்கப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: எகிப்து நாடு முழுவதற்கும்
  rationale: עַל இங்கு ஒரு நிலப்பரப்பு முழுவதின்மேலும் செலுத்தும் அதிகாரத்தைக் குறிக்கிறது; ‘நாடு முழுவதற்கும்’ என்பது அந்த ஆட்சிப் பரப்பைத் தெளிவாகத் தெரிவிக்கிறது.
