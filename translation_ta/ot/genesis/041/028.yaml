source:
  edition: WLC
  text: ה֣וּא הַ/דָּבָ֔ר אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל פַּרְעֹ֑ה אֲשֶׁ֧ר הָ/אֱלֹהִ֛ים עֹשֶׂ֖ה הֶרְאָ֥ה אֶת פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/028.yaml
  text: 'This is the matter that I spoke to Pharaoh: what God is doing he has shown to Pharaoh[a].'
translation:
  language: ta
  text: 'நான் பார்வோனிடம் சொன்ன காரியம் இதுதான்: கடவுள் தாம் செய்யவிருப்பதைப் பார்வோனுக்குக் காண்பித்திருக்கிறார்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் தாம் செய்வதை.” எபிரெய வினையெச்சம் தற்போது நடைபெறும் செயலையோ நெருங்கி வரும் செயலையோ குறிக்கலாம். இங்கு கனவு வரவிருக்கும் நிகழ்வுகளை அறிவிப்பதால், “செய்யவிருப்பதை” என்பது சூழலுக்கு ஏற்றதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא הַדָּבָר
  choice: காரியம் இதுதான்
  rationale: அடையாளப்படுத்தும் எபிரெயச் சொற்றொடரை இயல்பான நவீனத் தமிழில் வழங்குகிறது; இங்கு דָּבָר என்பது கனவின் பொருள் சார்ந்த ‘காரியம்’ எனப் பொருள்படுகிறது.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל פַּרְעֹה
  choice: நான் பார்வோனிடம் சொன்ன
  rationale: דבר என்ற வினையின் பேச்சுச் செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הָאֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு குறிப்பிட்ட ஒரே தெய்வீகச் செயற்பாட்டாளரைக் குறிக்கும் வழக்கமான தமிழ் வடிவம்; எபிரெயக் கட்டுரையைத் தனியே மொழிபெயர்க்க வேண்டியதில்லை.
- source_word: עֹשֶׂה
  choice: செய்யவிருப்பதை
  rationale: எபிரெய நிகழ்கால வினையெச்சம் நிகழும் அல்லது நெருங்கிய செயலைக் குறிக்கலாம்; வரவிருக்கும் நிகழ்வுகளை விளக்கும் இச்சூழலில் எதிர்நோக்கிய அர்த்தம் இயல்பாகிறது, ஆனால் மாற்று சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: הֶרְאָה אֶת פַּרְעֹה
  choice: பார்வோனுக்குக் காண்பித்திருக்கிறார்
  rationale: ראה என்பதன் ஹிப்இல் வடிவமான ‘காண்பி’ என்ற காரணவினைப் பொருளையும், முன்பே அளிக்கப்பட்ட வெளிப்பாட்டின் தற்போதைய தொடர்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: הָאֱלֹהִים என்பதைக் யோசேப்பின் உரையில் மொழிபெயர்த்தல்
  choice: கடவுள்
  alternative: அந்தக் கடவுள்
  rationale: எபிரெயத்தில் உள்ள הָאֱלֹהִים இங்கு இயல்பாக ஒரே கடவுளைக் குறிக்கிறது; ‘கடவுள்’ என்பது கூடுதல் சமயப் பிரிவுச் சார்பைச் சேர்க்காமல் நவீனத் தமிழில் பொருளைத் தருகிறது.
- issue: עֹשֶׂה என்பதின் காலநிலை
  choice: செய்யவிருக்கிறார் / செய்யவிருப்பதை
  alternative: செய்கிறார் / செய்வதை
  rationale: பஞ்சமும் வளமையும் பற்றிய கனவின் எதிர்கால விளக்கச் சூழல் நெருங்கிய செயலை ஆதரிக்கிறது; இருப்பினும் எபிரெய வினையெச்சத்தின் நிகழ்காலச் சாத்தியம் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் எளிமையும் கொண்ட உரைநடை. கடவுளைக் குறிக்கும் இடத்தில் இயல்பான மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. முதன்மை உரையில் உள்ள [a] குறி அடிக்குறிப்புடன் பொருந்துகிறது.
