  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்கு எளிதில் புரியும் கண்ணியமான நடையில் வழங்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் மீளுரைப்பை முழுமையாகச் சுமத்தாமல் இயல்பான தமிழ் அமைப்பு பயன்படுத்தப்பட்டு, அதன் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
