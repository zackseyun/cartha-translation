base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/048.yaml
  text: And he gathered all the food of the seven years that were in the land of Egypt[a], and he put the food in the cities. In each city he put the food from the fields around it.
translation:
  language: ta
  text: அவன் எகிப்து நாட்டில் அந்த ஏழு ஆண்டுகளில் கிடைத்த உணவையெல்லாம் சேகரித்து, நகரங்களில் வைத்தான். ஒவ்வொரு நகரத்தைச் சுற்றியிருந்த வயல்களின் உணவை அந்தந்த நகரத்திற்குள் வைத்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: “அந்த நகரத்தைச் சுற்றியிருந்த வயலின் உணவை அதற்குள் வைத்தான்.” எபிரெய மொழியில் “உணவு” மீண்டும் சொல்லப்பட்டு, முன்பு கூறியதை மீண்டும் எடுத்துரைக்கும் வாக்கிய அமைப்பு வலியுறுத்தலுக்காகப் பயன்படுத்தப்பட்டுள்ளது.'
    reason: மூல எபிரெய மொழியின் சொல் மீளுரைப்பையும் வாக்கிய அமைப்பையும் தெரிவிக்கும் சொற்சார் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: சேகரித்து
  rationale: קבץ என்பது பல இடங்களிலுள்ளவற்றை ஒன்றாகச் சேர்த்தல் அல்லது சேகரித்தலைக் குறிக்கிறது; இச்சூழலில் ‘சேகரித்து’ என்பது இயல்பான, துல்லியமான தமிழ்.
- source_word: כָּל אֹכֶל
  choice: உணவையெல்லாம்
  rationale: אֹכֶל என்பதன் பொருள் பொதுவாக ‘உணவு.’ சூழலில் தானியம் முக்கியமாக இருந்திருக்கலாம் என்றாலும், ‘தானியம்’ என்று குறுக்காமல் எபிரெயச் சொல்லின் பரந்த பொருள் பாதுகாக்கப்படுகிறது.
- source_word: שֶׁבַע שָׁנִים אֲשֶׁר הָיוּ בְּאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டில் அந்த ஏழு ஆண்டுகளில் கிடைத்த
  rationale: எபிரெய மொழியில் சொற்சொல்லாக ‘எகிப்து நாட்டில் இருந்த ஏழு ஆண்டுகளின்’ என உள்ளது. தமிழில் காலப்பகுதியையும் அதில் கிடைத்த உணவையும் இயல்பாகத் தொடர்புபடுத்த இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது; ‘அந்த’ என்பது முன்பு கூறப்பட்ட ஏழு செழிப்பான ஆண்டுகளைச் சுட்டுகிறது.
- source_word: וַיִּתֶּן אֹכֶל בֶּעָרִים
  choice: உணவை நகரங்களில் வைத்தான்
  rationale: נתן என்பதற்கு இங்கு ‘வைத்தான்’ என்பது நேரான பொருள். சேமித்தல் சூழலால் விளங்கினாலும், மூலச்சொல்லைவிட கூடுதலாக விளக்காதவாறு ‘வைத்தான்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֹכֶל שְׂדֵה הָעִיר אֲשֶׁר סְבִיבֹתֶיהָ
  choice: ஒவ்வொரு நகரத்தைச் சுற்றியிருந்த வயல்களின் உணவு
  rationale: ஒரு நகரத்துடன் தொடர்புடைய, அதைச் சுற்றியுள்ள வயல்களில் கிடைத்த உணவை இச்சொற்றொடர் குறிக்கிறது. எபிரெய ஒருமை கூட்டுப்பொருளைத் தமிழில் இயல்பாக ‘வயல்களின்’ என்று வழங்கப்பட்டுள்ளது.
- source_word: נָתַן בְּתוֹכָהּ
  choice: அந்தந்த நகரத்திற்குள் வைத்தான்
  rationale: ‘அதன் நடுவில் வைத்தான்’ என்ற மூலவடிவம் ஒவ்வொரு நகருக்கும் அதனைச் சுற்றிய வயல்களின் உணவு கொண்டு செல்லப்பட்டதைக் குறிக்கிறது. ‘அந்தந்த’ என்பது இந்தப் பகிர்ந்தளிக்கும் தொடர்பைத் தமிழில் தெளிவாகக் காட்டுகிறது.
