  source_fidelity: வினைச்சொல்லின் நிறைவான செயலைக் காட்டும் «தின்றுவிட்டன», பெண்பால் மாடுகளுக்கான «பசுக்கள்», எண்ணிக்கை, மற்றும் கனவில் முன்னதாக வந்த வரிசை ஆகியவை மூலத்துடன் பொருந்துகின்றன. ஆனால் הָרָעוֹת என்பது முதன்மையாகக் காண்பதற்கான மோசமான தோற்றத்தைக் குறிக்கிறது; «அருவருப்பான» என்பது மூலத்தில் இல்லாத வெறுப்புணர்வைச் சற்றே அதிகப்படுத்துகிறது. הַבְּרִיאֹת என்பதற்கு இச்சூழலில் நன்கு ஊட்டமடைந்த/பருத்த நிலை பொருந்தும்.
