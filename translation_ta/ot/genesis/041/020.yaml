translation:
  language: ta
  text: அந்த மெலிந்த, மோசமான தோற்றமுள்ள பசுக்கள், முதலில் வந்த ஏழு நன்கு ஊட்டமடைந்த பசுக்களையும் தின்றுவிட்டன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: தின்றுவிட்டன
  rationale: אכל என்பதன் அடிப்படைப் பொருள் ‘தின்னுதல்’. கனவின் சூழலில் பசுக்கள் முழுவதுமாக உண்டதை இயல்பாக உணர்த்த ‘தின்றுவிட்டன’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַפָּרוֹת
  choice: பசுக்கள்
  rationale: பெண்பால் பன்மை வடிவம் பெண் மாடுகளைக் குறிப்பதால், பொதுவான ‘மாடுகள்’ என்பதற்குப் பதிலாகத் துல்லியமான ‘பசுக்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הָרַקּוֹת
  choice: மெலிந்த
  rationale: உடல் மெலிவைச் சுட்டும் சொல்லாகியதால், நவீன தமிழில் இயல்பான ‘மெலிந்த’ பயன்படுத்தப்பட்டது.
- source_word: וְהָרָעוֹת
  choice: அருவருப்பான தோற்றமுள்ள
  rationale: இங்கு רעות என்பது ஒழுக்கத் தீமையை அல்ல, காண்பதற்கு மோசமான தோற்றத்தைக் குறிக்கிறது. முந்தைய சூழலின் ‘தோற்றம்’ என்ற கருத்தைத் தெளிவாகத் தக்கவைக்க இவ்வாறு வழங்கப்பட்டது.
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: ஏழு பசுக்களையும்
  rationale: நேரடி செயப்படுபொருளையும் ஏழு என்ற எண்ணிக்கையையும் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: הָרִאשֹׁנוֹת
  choice: முதலில் வந்த
  rationale: கனவில் முன்னதாகத் தோன்றிய பசுக்களைச் சுட்டுவதால், வரிசையைத் தெளிவுபடுத்தும் இயல்பான தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַבְּרִיאֹת
  choice: கொழுத்த
  rationale: இந்தச் சூழலில் בְּרִיאֹת என்பது நன்கு ஊட்டமடைந்த, பருத்த உடலமைப்பைக் குறிக்கிறது. 41:18-இன் விவரிப்புடனும் மெலிந்த பசுக்களுக்கு எதிரான நேரடி வேறுபாட்டுடனும் ‘கொழுத்த’ நன்றாகப் பொருந்துகிறது.
