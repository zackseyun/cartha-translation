base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/036.yaml
  text: That food shall be a reserve for the land for the seven years of famine that will be in the land of Egypt[c][b][a], so that the land may not be cut off by the famine.
translation:
  language: ta
  text: எகிப்து நாட்டில் வரவிருக்கும் ஏழு பஞ்ச ஆண்டுகளுக்காக, அந்த உணவு நாட்டிற்கான கையிருப்பாக[a] இருக்கும்; இதனால் பஞ்சத்தால் நாடு அழிந்துபோகாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சேமிப்பாக” அல்லது “பாதுகாத்து வைக்கப்பட்ட இருப்பாக.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “நாடு அறுக்கப்படாது” அல்லது “துண்டிக்கப்படாது”; இங்கு பஞ்சத்தால் நாடு பாழாகி ஒழிந்துபோகாமல் இருப்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: இருக்கும்
  rationale: அறிவுறுத்தலும் எதிர்கால விளைவும் அடங்கிய இச்சூழலில், இணைப்புடன் வந்த நிறைவுவினை எதிர்காலப் பொருளைத் தருகிறது.
- source_word: הָאֹכֶל
  choice: அந்த உணவு
  rationale: முந்தைய வசனத்தில் சேகரிக்கப்படும் விளைச்சலைச் சுட்டுகிறது; எபிரெயச் சொல் தானியத்தை மட்டும் அல்லாமல் உணவைப் பொதுவாகக் குறிக்கிறது.
- source_word: לְפִקָּדוֹן
  choice: கையிருப்பாக
  rationale: பிற்காலத் தேவைக்காகப் பாதுகாத்து வைக்கப்படும் சேமிப்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: לָאָרֶץ
  choice: நாட்டின்
  rationale: இங்கு אֶרֶץ என்பது எகிப்து நாடு அல்லது அதன் நிலப்பரப்பைக் குறிக்கிறது; தமிழில் ‘நாட்டின் கையிருப்பு’ என்பது இயல்பாக நோக்கப் பொருளை வெளிப்படுத்துகிறது.
- source_word: לְשֶׁבַע שְׁנֵי הָרָעָב
  choice: ஏழு பஞ்ச ஆண்டுகளுக்காக
  rationale: முன்னரே குறிப்பிடப்பட்ட குறிப்பிட்ட ஏழு ஆண்டுகளையும், அவற்றை எதிர்கொள்ளச் செய்யப்படும் சேமிப்பின் நோக்கத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר תִּהְיֶיןָ בְּאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டில் வரவிருக்கும்
  rationale: எதிர்காலத்தில் எகிப்தில் நிகழவிருக்கும் பஞ்ச ஆண்டுகளை இயல்பான தமிழில் அடைமொழித் தொடராக வழங்குகிறது.
- source_word: וְלֹא תִכָּרֵת הָאָרֶץ
  choice: அப்போது ... நாடு அழிந்துபோகாது
  rationale: כרת என்பதன் அடிப்படை உருவகம் ‘துண்டிக்கப்படுதல்/அறுக்கப்படுதல்’ என்றாலும், நாட்டைப் பற்றிய இச்சூழலில் பஞ்சத்தால் அது பாழாகி ஒழிவதைக் குறிக்கிறது. ‘அழிந்துபோகாது’ தமிழில் பொருளைத் தெளிவாக வழங்குகிறது; ‘அப்போது’ திட்டத்தின் விளைவுத் தொடர்பைக் காட்டுகிறது.
- source_word: בָּרָעָב
  choice: பஞ்சத்தால்
  rationale: பஞ்சம் நாட்டின் அழிவுக்கான காரணம் அல்லது கருவி என்பதைச் சுருக்கமாகக் காட்டுகிறது.
