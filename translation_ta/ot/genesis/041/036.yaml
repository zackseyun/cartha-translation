- from: அந்த உணவு, எகிப்து நாட்டில் வரவிருக்கும் ஏழு பஞ்ச ஆண்டுகளுக்காக நாட்டின் கையிருப்பாக[a] இருக்கும்; அப்போது பஞ்சத்தால் நாடு அழிந்துபோகாது[b].
  to: எகிப்து நாட்டில் வரவிருக்கும் ஏழு பஞ்ச ஆண்டுகளுக்காக, அந்த உணவு நாட்டிற்கான கையிருப்பாக[a] இருக்கும்; இதனால் பஞ்சத்தால் நாடு அழிந்துபோகாது[b].
