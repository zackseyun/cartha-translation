translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. எபிரெயச் சொற்றொடரின் மீளுரையைத் தமிழில் இயல்பாக்கியபோதும், ‘நாடு’ என்ற கருத்தும் எதிர்காலப் பஞ்சத்துக்கான சேமிப்பின் நோக்கமும் தக்கவைக்கப்பட்டுள்ளன.
