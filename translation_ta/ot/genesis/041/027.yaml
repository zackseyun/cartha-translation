  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/שֶׁ֣בַע הַ֠/פָּרוֹת הָֽ/רַקּ֨וֹת וְ/הָ/רָעֹ֜ת הָ/עֹלֹ֣ת אַחֲרֵי/הֶ֗ן שֶׁ֤בַע שָׁנִים֙ הֵ֔נָּה וְ/שֶׁ֤בַע הַֽ/שִׁבֳּלִים֙ הָ/רֵק֔וֹת שְׁדֻפ֖וֹת הַ/קָּדִ֑ים יִהְי֕וּ שֶׁ֖בַע שְׁנֵ֥י רָעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/027.yaml
  text: And the seven thin and bad cows that came up after them are seven years[a], and the seven empty heads of grain, scorched by the east wind[b], will be seven years of famine.
translation:
  language: ta
  text: அவற்றுக்குப் பின் மேலே வந்த மெலிந்த, மோசமான ஏழு பசுக்களும் ஏழு ஆண்டுகளைக் குறிக்கின்றன. கிழக்குக் காற்றால் கருகிப்போன வெறுமையான ஏழு தானியக் கதிர்களும் பஞ்சத்தின் ஏழு ஆண்டுகளாக இருக்கும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרַקּוֹת
  choice: மெலிந்த
  rationale: பசுக்களின் உடல் மெலிவைக் குறிக்கும் இயல்பான, தெளிவான நவீனத் தமிழ் சொல்.
- source_word: וְהָרָעֹת
  choice: மோசமான
  rationale: இங்கு அறநெறித் தீமையை அல்ல, பசுக்களின் விரும்பத்தகாத மோசமான நிலையைக் குறிக்கிறது.
- source_word: הָעֹלֹת אַחֲרֵיהֶן
  choice: அவற்றுக்குப் பின் மேலே வந்த
  rationale: கனவில் பசுக்கள் பின்னர் தோன்றிய வரிசையையும், அவை ஆற்றிலிருந்து மேலே வந்த இயக்கத்தையும் காக்கிறது.
- source_word: שֶׁבַע שָׁנִים הֵנָּה
  choice: ஏழு ஆண்டுகளைக் குறிக்கின்றன
  rationale: கனவின் உருவங்கள் ஆண்டுகளை அடையாளப்படுத்துகின்றன என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַשִׁבֳּלִים
  choice: தானியக் கதிர்கள்
  rationale: தானியச் செடியின் விதை நிறைந்த கதிர்ப்பகுதியைக் குறிக்கும் பொதுவாகப் புரியக்கூடிய தமிழ் வழக்கு.
- source_word: הָרֵקוֹת
  choice: வெறுமையான
  rationale: தானிய மணிகள் நிரம்பாமல் காலியாக இருப்பதைக் குறிக்கிறது.
- source_word: שְׁדֻפוֹת הַקָּדִים
  choice: கீழ்க்காற்றால் கருகிப்போன
  rationale: கָדִים என்பது கிழக்கிலிருந்து வீசும் வெப்பமான காற்று; தமிழில் வழக்கமான திசைக்காற்றுப் பெயரான ‘கீழ்க்காற்று’ பயன்படுத்தப்பட்டு, அதன் சேதப்படுத்தும் விளைவு ‘கருகிப்போன’ எனத் தரப்படுகிறது.
- source_word: יִהְיוּ
  choice: குறிக்கும்
  rationale: முற்றுப்பெறாத வினை வடிவத்தின் எதிர்நோக்கிய தன்மையையும் கனவு விளக்கத்தின் அடையாள உறவையும் இயல்பான தமிழில் தருகிறது.
- source_word: שְׁנֵי רָעָב
  choice: பஞ்சத்தின் ஏழு ஆண்டுகள்
  rationale: ரָעָב இச்சூழலில் பரவலான உணவுப் பற்றாக்குறையாகிய பஞ்சத்தைக் குறிக்கிறது.
