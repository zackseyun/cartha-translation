translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதாகப் புரியும், ஆனால் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை. மூலத்தின் இரு இணையான கூறுகளும் தனித்தனி வாக்கியங்களாகத் தெளிவுபடுத்தப்பட்டுள்ளன. அடையாளப்படுத்தும் ‘அவை ஏழு ஆண்டுகள்’ என்ற எபிரெய அமைப்பு, தமிழில் தவறாகப் பொருள்படாமல் ‘ஏழு ஆண்டுகளைக் குறிக்கின்றன’ என வழங்கப்பட்டுள்ளது.
