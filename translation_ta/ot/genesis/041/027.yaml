  to: அவற்றுக்குப் பின் மேலே வந்த மெலிந்த, மோசமான ஏழு பசுக்களும் ஏழு ஆண்டுகளைக் குறிக்கின்றன. கிழக்குக் காற்றால் கருகிப்போன வெறுமையான ஏழு தானியக் கதிர்களும் பஞ்சத்தின் ஏழு ஆண்டுகளாக இருக்கும்.
