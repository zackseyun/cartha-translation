  text: וַ/תֹּאכַ֣לְנָה הַ/פָּר֗וֹת רָע֤וֹת הַ/מַּרְאֶה֙ וְ/דַקֹּ֣ת הַ/בָּשָׂ֔ר אֵ֚ת שֶׁ֣בַע הַ/פָּר֔וֹת יְפֹ֥ת הַ/מַּרְאֶ֖ה וְ/הַ/בְּרִיאֹ֑ת וַ/יִּיקַ֖ץ פַּרְעֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/004.yaml
  text: Then the cows ugly in appearance and thin in flesh ate the seven cows beautiful in appearance and fat[a], and Pharaoh awoke.
translation:
  language: ta
  text: அப்போது, தோற்றத்தில் அழகற்றவையாகவும் உடலில் மெலிந்தவையாகவும் இருந்த பசுக்கள், தோற்றத்தில் அழகாகவும் கொழுத்தவையாகவும் இருந்த அந்த ஏழு பசுக்களைத் தின்றன.[a] பார்வோன் விழித்துக்கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தோற்றத்தில் கெட்டவையாகவும் ... ஆரோக்கியமானவையாகவும்.” எபிரெயச் சொற்களை இன்னும் நேரடியாக இவ்வாறு மொழிபெயர்க்கலாம்; ஆனால் இச்சூழலில் அழகின்மை/மெலிவு, அழகு/கொழுமை என்ற உடல் மாறுபாடே முதன்மையாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: அப்போது ... தின்றுவிட்டன
  rationale: பெண்பால் பன்மை wayyiqtol வடிவம் கனவின் அடுத்த நிகழ்வைத் தொடர்கிறது. אכל என்பதன் இயல்பான பொருள் ‘தின்னுதல்’; ‘விழுங்கின’ என்பது மூல வினையைவிட வலிமையானது. தமிழ் கதைநடையில் நிகழ்வுத் தொடரை ‘அப்போது’ இயல்பாகக் காட்டுகிறது.
- source_word: הַפָּרוֹת
  choice: பசுக்கள்
  rationale: פָּרוֹת என்பது ‘பசு’ என்பதன் பெண்பால் பன்மை; பொதுவான ‘கால்நடைகள்’ என்பதைக் காட்டிலும் துல்லியமானது.
- source_word: רָעוֹת הַמַּרְאֶה
  choice: தோற்றத்தில் அருவருப்பாக
  rationale: רָעוֹת என்பதன் அடிப்படைப் பொருள் ‘கெட்ட’; ஆனால் הַמַּרְאֶה உடன் சேரும்போது காண்பதற்கு அழகற்ற தன்மையைக் குறிக்கிறது. எதிர்வரும் ‘தோற்றத்தில் அழகாக’ என்ற சொல்லோடு உள்ள மாறுபாட்டையும் இது காக்கிறது.
- source_word: וְדַקֹּת הַבָּשָׂר
  choice: உடல் மெலிந்தவையாகவும்
  rationale: דַקֹּת என்பது ‘மெல்லிய/மெலிந்த’ என்றும் בָּשָׂר இங்கு உடல் சதையையும் குறிக்கிறது. சொற்சொல்லான ‘சதையில் மெலிந்த’ என்பதைவிட இது இயல்பான நவீனத் தமிழ்; உடல் நிலை என்ற கருத்தைத் தக்கவைக்கிறது.
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: அந்த ஏழு பசுக்களை
  rationale: நேரடி செயப்படுபொருள் குறியீட்டோடு வரும் எண்ணும் பெயர்ச்சொல்லும் ‘ஏழு பசுக்களை’ என நேரடியாக அமைகின்றன. முன்பு காணப்பட்ட பசுக்களைக் குறிப்பதால் ‘அந்த’ இயல்பாக உள்ளது.
- source_word: יְפֹת הַמַּרְאֶה
  choice: தோற்றத்தில் அழகாக
  rationale: இது ‘தோற்றத்தில் அருவருப்பாக’ என்பதற்கு நேரான எதிரிணை; எபிரெய இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: וְהַבְּרִיאֹת
  choice: கொழுத்தவையாகவும்
  rationale: בָּרִיא என்பது ‘கொழுத்த/பருத்த/ஆரோக்கியமான’ என்று பொருள்படலாம். இங்கு ‘உடல் மெலிந்த’ பசுக்களுக்கு எதிரான உடல் மாறுபாடு ‘கொழுத்த’ என்பதை ஆதரிக்கிறது; இருப்பினும் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּיקַץ פַּרְעֹה
  choice: உடனே பார்வோன் விழித்துக்கொண்டான்
  rationale: יקץ என்பது உறக்கத்திலிருந்து விழித்தலைக் குறிக்கிறது. wayyiqtol நிகழ்வுத் தொடரைத் தமிழ் நடையில் ‘உடனே’ இயல்பாக வெளிப்படுத்துகிறது.
