  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனத்தின் இரு இணையான உடல் வருணனைகளும் நிகழ்வின் வரிசையும் காக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு தொடர்புடைய வாக்கியத்தின் முடிவில் இடப்பட்டுள்ளது.
