base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/034.yaml
  text: 'Let Pharaoh do this: let him appoint overseers over the land and take a fifth of the produce of the land of Egypt during the seven years of abundance[a].'
translation:
  language: ta
  text: 'பார்வோன் இதைச் செய்யட்டும்: நாட்டின் பொறுப்பில் அதிகாரிகளை நியமித்து, மிகுந்த விளைச்சல் கிடைக்கும் ஏழு ஆண்டுகளில் எகிப்து நாட்டின் விளைச்சலில் ஐந்தில் ஒரு பங்கை வசூலிக்கட்டும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எகிப்து நாட்டிலிருந்து ஐந்தில் ஒரு பங்கைச் சேகரிக்கட்டும்.” செழிப்பு மிகுந்த ஆண்டுகளில் ஐந்தில் ஒரு பங்கை விதித்துப் பெறுதல் அல்லது எடுத்துக்கொள்ளுதல் என்ற பொருளில் இந்த எபிரெய வினை புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲשֶׂה
  choice: பார்வோன் இப்படிச் செய்யட்டும்
  rationale: עשה என்பது பொதுவாக ‘செய்’ என்று பொருள்படும். சூழலில் யோசேப்பு ஆலோசனை கூறுவதால், தமிழில் வேண்டுகோள்/அறிவுரை நயத்தைத் தரும் ‘செய்யட்டும்’ இயல்பாக உள்ளது; ‘இப்படி’ என்பது சூழலில் உள்ள மறைபொருளான செயலைச் சுட்டுகிறது.
- source_word: וְיַפְקֵד
  choice: நியமித்து … வசூலிக்கட்டும்
  rationale: פקד என்பதன் ஹிப்ஃபில் வடிவம் இங்கு பொறுப்புடையவர்களை நியமிப்பதைக் குறிக்கிறது. தொடர்ச்சியான எபிரெய வாக்கிய அமைப்பை இயல்பான தமிழில் ஒரே அறிவுரையாக இணைக்க ‘நியமித்து’ பயன்படுத்தப்பட்டது.
- source_word: פְּקִדִים
  choice: மேற்பார்வையாளர்கள்
  rationale: நிர்வாகப் பொறுப்புடன் நியமிக்கப்படும் அதிகாரிகளை இது குறிக்கிறது. ‘மேற்பார்வையாளர்கள்’ என்பது அவர்களுடைய பொறுப்பை நவீன தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: עַל הָאָרֶץ
  choice: நாட்டின்மேல்
  rationale: இங்கு אָרֶץ உலகத்தைக் குறிக்காமல் பார்வோனின் ஆட்சிக்குட்பட்ட நாட்டைக் குறிக்கிறது; עַל என்பதிலுள்ள நிர்வாக அதிகாரத்தின் நயம் ‘நாட்டின்மேல்’ என்பதில் காக்கப்படுகிறது.
- source_word: וְחִמֵּשׁ
  choice: ஐந்தில் ஒரு பங்கை வசூலிக்கட்டும்
  rationale: חמשׁ என்பதன் பியேல் வடிவம் இச்சூழலில் ஐந்தில் ஒரு பங்கை விதித்துப் பெறுதல் அல்லது சேகரித்தல் என்று புரிந்துகொள்ளப்படுகிறது. ‘வசூலிக்கட்டும்’ என்பது நிர்வாக நடவடிக்கையை இயல்பாக வெளிப்படுத்துகிறது; வினையின் அரிதான தன்மையால் மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶת אֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டின் விளைச்சலில்
  rationale: எபிரெயத்தில் நேரடியாக ‘எகிப்து நாட்டை’ என்று இருந்தாலும், சூழல் நிலத்தையே பிரிப்பதை அல்ல, அதன் விளைச்சலிலிருந்து ஒரு பங்கைப் பெறுவதைக் குறிக்கிறது. ஆகவே பொருளைத் தெளிவுபடுத்த ‘விளைச்சலில்’ சேர்க்கப்பட்டது.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: செழிப்பான ஏழு ஆண்டுகளில்
  rationale: שָׂבָע என்பது நிறைவு அல்லது மிகுதியைக் குறிக்கிறது; இக்கதையில் அது மிகுந்த விளைச்சல் கிடைக்கும் காலத்தைக் குறிக்கும். ‘செழிப்பான’ என்பது இயல்பான, சுருக்கமான தமிழ் வடிவம்.
