base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/042.yaml
  text: Then Pharaoh removed his signet ring from his hand and put it on Joseph’s hand[c][b][a], and he clothed him in garments of fine linen and put a gold chain around his neck.
translation:
  language: ta
  text: பின்பு பார்வோன் தன் கையிலிருந்த முத்திரை மோதிரத்தைக்[a] கழற்றி, அதை யோசேப்பின் கையில் அணிவித்தான். யோசேப்புக்கு நுண்ணிய லினன் ஆடைகளை[b] உடுத்தி, அவன் கழுத்தில் ஒரு பொன் சங்கிலியை[c] அணிவித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மோதிரம்.’ எபிரேயச் சொல் பொதுவாக ஒரு மோதிரத்தைக் குறிக்கலாம். ஆனால் இந்த அரசச் சூழலில், ஒப்படைக்கப்பட்ட அதிகாரத்தை அடையாளப்படுத்தும் பார்வோனின் முத்திரை மோதிரமே பெரும்பாலும் குறிக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நுண்ணிய லினன்’ என்பது எபிரேய שֵׁשׁ (ஷேஷ்) என்பதன் மொழிபெயர்ப்பு. அது செல்வத்துடனும் மரியாதையுடனும் தொடர்புடைய உயர்தர லினன் துணியைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘பொன் கழுத்தணி’ அல்லது ‘பொன் கழுத்துப்பட்டை.’ எபிரேயச் சொல் குறிக்கும் கழுத்து ஆபரணத்தின் துல்லியமான வடிவம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: கழற்றி
  rationale: கையில் அணிந்திருந்த மோதிரத்தை நீக்கும் செயலை இயல்பான தமிழில் துல்லியமாகக் குறிக்கிறது.
- source_word: טַבַּעְתּוֹ
  choice: தன் முத்திரை மோதிரத்தை
  rationale: טַבַּעַת பொதுவாக ‘மோதிரம்’ எனப் பொருள்படலாம்; அரச நிர்வாகச் சூழலில் இது அதிகாரத்தை ஒப்படைக்கப் பயன்படும் பார்வோனின் முத்திரை மோதிரமாக இருப்பது மிகச் சாத்தியம்.
- source_word: מֵעַל יָדוֹ
  choice: தன் கையிலிருந்த
  rationale: எபிரேய இடவுறவை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּתֵּן אֹתָהּ עַל יַד יוֹסֵף
  choice: அதை யோசேப்பின் கையில் அணிவித்தான்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடுத்தான்’ என்றாலும், மோதிரத்தைக் கையின்மேல் வைக்கும் இச்சூழலில் ‘அணிவித்தான்’ என்பது செயலைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: וַיַּלְבֵּשׁ אֹתוֹ
  choice: அவனுக்கு … உடுத்தி
  rationale: பார்வோன் யோசேப்புக்கு மரியாதைக்குரிய ஆடைகளை அணிவித்த முதலீட்டு நிகழ்வை இயல்பான தமிழில் காக்கிறது.
- source_word: בִּגְדֵי שֵׁשׁ
  choice: மெல்லிய நார்ப்பட்டு ஆடைகள்
  rationale: שֵׁשׁ என்பது செல்வத்துடனும் உயர்நிலையுடனும் தொடர்புடைய உயர்தர மெல்லிய லினன் துணியைக் குறிக்கிறது; ‘நார்ப்பட்டு’ என்பது பட்டுத் துணி எனத் தவறாகக் கொள்ளப்படாதவாறு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: רְבִד הַזָּהָב
  choice: ஒரு பொன் சங்கிலி
  rationale: கழுத்தில் அணியும் பொன் ஆபரணத்தை இயல்பான தமிழில் குறிக்கிறது; அதன் துல்லியமான வடிவம் உறுதியற்றதால் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: עַל צַוָּארוֹ
  choice: அவன் கழுத்தில்
  rationale: நகை அணிவிக்கும் செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
