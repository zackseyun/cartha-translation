translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் அரச மரியாதைச் சடங்கின் கண்ணியத்தைத் தக்கவைக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. தொடர் எபிரேய வினைச்செயல்கள் தமிழில் இரண்டு இயல்பான வாக்கியங்களாக அமைக்கப்பட்டுள்ளன; மூலத்தின் பொருள்வரிசை காக்கப்பட்டுள்ளது.
