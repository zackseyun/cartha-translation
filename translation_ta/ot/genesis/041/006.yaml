base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/006.yaml
  text: And behold[a], seven thin ears of grain, scorched by the east wind, were sprouting up after them.
translation:
  language: ta
  text: இதோ, கிழக்குக் காற்றால் கருகிப்போன[a] மெலிந்த ஏழு தானியக் கதிர்கள் அவற்றின் பின்னால் முளைத்து வந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிழக்குக் காற்றால் வாட்டப்பட்ட.’
    reason: שְׁדוּפוֹת என்பதற்கு ‘கருகிப்போன’ என்பதோடு ‘வாட்டப்பட்ட’ என்ற பொருளும் அமையலாம்.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: அப்போது இதோ
  rationale: கனவில் ஒரு புதிய காட்சி திடீரெனத் தோன்றுவதை உணர்த்தும் எபிரெயக் கதைநடைச் சுட்டியை இயல்பான, உயிரோட்டமுள்ள தமிழில் தக்கவைக்கிறது.
- source_word: שֶׁבַע
  choice: ஏழு
  rationale: மூலத்தின் எண்ணிக்கையை நேரடியாகத் தருகிறது.
- source_word: שִׁבֳּלִים
  choice: தானியக் கதிர்கள்
  rationale: முழுத் தண்டுகளை அல்ல, தானியம் விளையும் கதிர்ப்பகுதிகளைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: דַּקּוֹת
  choice: மெலிந்த
  rationale: நிறைவற்ற, ஒல்லியான கதிர்களின் தோற்றத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּשְׁדוּפֹת קָדִים
  choice: கிழக்குக் காற்றால் கருகிப்போன
  rationale: חום மிகுந்த அழிவுண்டாக்கும் கிழக்குக் காற்றால் கதிர்கள் பாதிக்கப்பட்ட நிலையைத் தெளிவாகக் காட்டுகிறது; வினைச்சொல்லின் ‘வாட்டப்பட்ட/கருகிய’ பொருள் வரம்பையும் தக்கவைக்கிறது.
- source_word: צֹמְחוֹת
  choice: முளைத்து வந்தன
  rationale: கனவுக் காட்சியில் நடந்துகொண்டிருக்கும் வளர்ச்சியைத் தமிழில் இயல்பான தொடர்நிலை வடிவில் தருகிறது.
- source_word: אַחֲרֵיהֶן
  choice: அவற்றுக்குப் பின்னால்
  rationale: முந்தைய வசனத்தின் ஏழு நல்ல கதிர்களைக் குறிக்கும் பன்மைப் பெண்பால் சுட்டைத் தக்கவைத்து, இடம் அல்லது தொடர்ச்சி என்ற இரு சாத்தியங்களையும் திறந்துவைக்கிறது.
