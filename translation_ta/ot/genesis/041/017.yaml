  text: וַ/יְדַבֵּ֥ר פַּרְעֹ֖ה אֶל יוֹסֵ֑ף בַּ/חֲלֹמִ֕/י הִנְ/נִ֥י עֹמֵ֖ד עַל שְׂפַ֥ת הַ/יְאֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/017.yaml
  text: Then Pharaoh said to Joseph[a], “In my dream, behold, I was standing on the bank of the Nile.”
translation:
  language: ta
  text: அப்போது பார்வோன் யோசேப்பிடம், “என் கனவில், இதோ, நான் நைல் நதியின்[a] கரையில் நின்றுகொண்டிருந்தேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “ஆறு.” ஆதியாகமத்தின் எகிப்தியச் சூழலில் இச்சொல் பொதுவாக நைல் நதியைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: என்றான்
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய வினையைத் தமிழ் கதைநடையில் இயல்பாகப் பின்னிறுத்தி மொழிபெயர்க்கிறது; ‘பேசினான்’ என்பதைக் காட்டிலும் இங்கு ‘என்றான்’ இயல்பானது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரசருக்கான பட்டத்தின் தமிழ்ச் வேதாகம மரபில் பரவலாக அறியப்பட்ட வடிவம்.
- source_word: אֶל יוֹסֵף
  choice: யோசேப்பிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: בַּחֲלֹמִי
  choice: என் கனவில்
  rationale: முன்னொட்டும் முதலாம் நபர் ஒருமை உரிமை விகுதியும் தரும் பொருளை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: הִנְנִי
  choice: இதோ, நான்
  rationale: கனவுக் காட்சியை உயிரோட்டத்துடன் முன்வைக்கும் எபிரெயச் சுட்டிடைச்சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: עֹמֵד
  choice: நின்றுகொண்டிருந்தேன்
  rationale: நின்ற நிலையில் தொடர்ந்திருப்பதைக் குறிக்கும் பங்கேற்புச் சொல்லை, கடந்த கனவை விவரிக்கும் தமிழ் சூழலுக்கேற்ற இறந்தகாலத் தொடர்நிலையாக வழங்குகிறது.
- source_word: עַל שְׂפַת
  choice: கரையில்
  rationale: சொல்லளவில் ‘விளிம்பு/உதடு’ என்ற படிமம் இருந்தாலும், ஆற்றுச் சூழலில் அதன் இயல்பான பொருள் ‘கரை’; இடத்தொடர்பையும் தமிழ் வேற்றுமை உருபு தெளிவாகக் காட்டுகிறது.
- source_word: הַיְאֹר
  choice: நைல் நதி
  rationale: சொல் நேரடியாக ‘ஆறு’ என இருந்தாலும், ஆதியாகமத்தின் எகிப்தியச் சூழலில் இது பொதுவாக நைல் நதியையே குறிக்கிறது; அடிக்குறிப்பு சொல்லளவிலான மாற்றைத் தக்கவைக்கிறது.
