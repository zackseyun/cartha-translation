  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் ‘இதோ’ என்ற காட்சியூட்டும் தன்மை பாதுகாக்கப்பட்டுள்ளது; தமிழ் நேரடிக் கூற்று அமைப்புக்கேற்ப பேச்சு வினை வாக்கிய முடிவில் வைக்கப்பட்டுள்ளது.
