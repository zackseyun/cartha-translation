  yaml_path: translation/ot/genesis/041/053.yaml
  text: Then the seven years of abundance that had been in the land of Egypt came to an end.
translation:
  language: ta
  text: எகிப்து நாட்டில் இருந்த ஏழு செழிப்பு ஆண்டுகள் முடிவடைந்தன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכְלֶינָה
  choice: முடிவடைந்தன
  rationale: כלה என்ற வினைச்சொல்லின் நிறைவுறுதல் என்ற பொருளையும், ‘ஆண்டுகள்’ என்பதுடன் பொருந்தும் பன்மையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: שֶׁבַע שְׁנֵי
  choice: ஏழு ... ஆண்டுகள்
  rationale: எண்ணையும் שְׁנֵי என்பதன் பன்மை கட்டமைப்பையும் தமிழின் இயல்பான சொல் வரிசையில் தருகிறது.
- source_word: הַשָּׂבָע
  choice: செழிப்பு
  rationale: இங்கு நிறைவான விளைச்சலும் உணவுவளமும் இருந்த காலத்தைக் குறிக்கிறது; ‘செழிப்பு’ என்பது சூழலுக்கேற்ற, கண்ணியமான பொதுத் தமிழ்.
- source_word: אֲשֶׁר הָיָה
  choice: இருந்த
  rationale: முடிவடைந்த ஆண்டுகளை விவரிக்கும் எபிரெய உறவுத்தொடரைச் சுருக்கமாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டில்
  rationale: אֶרֶץ என்பதை ‘நாடு’ என்று வெளிப்படையாகத் தக்கவைத்து, தமிழில் இயல்பான இடவெற்றுமையுடன் மொழிபெயர்க்கிறது.
