  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீளமான எபிரெய வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; உறவுப்பெயர்ச்சொல்லின் தொடர்பை ‘அவர்களை’ என்பதன் மூலம் காக்கிறது. எல்லா அடிக்குறிப்பு சுட்டிகளும் முதன்மை உரையில் இடம்பெறுகின்றன.
