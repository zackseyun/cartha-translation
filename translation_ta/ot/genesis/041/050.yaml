  source_fidelity: 'கருத்து பெரும்பாலும் மூல எபிரெயத்துக்கு ஏற்ப உள்ளது: பஞ்ச ஆண்டுக்கு முன்பாக யோசேப்புக்கு இரு மகன்கள் பிறந்ததும், ஆசெனாத் அவர்களைப் பெற்றதும், அவளுடைய தந்தை ஓனின் பூசாரி என்பதும் காக்கப்பட்டுள்ளன. ஆனால் “பஞ்சத்தின் ஆண்டு” மற்றும் “அவருக்குப் பெற்றெடுத்தாள்” ஆகிய சொற்றொடர்கள் இயல்பான தமிழாக இல்லை.'
