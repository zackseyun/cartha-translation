base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/050.yaml
  text: Before the year of famine came[a], two sons were born to Joseph, whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: ta
  text: பஞ்ச ஆண்டு வருவதற்கு முன்[a], யோசேப்புக்கு இரண்டு மகன்கள் பிறந்தார்கள். ஓனின் பூசாரியான போத்திபேராவின் மகள் ஆசெனாத் அவர்களைப் பெற்றாள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பஞ்சத்தின் ஆண்டு வருவதற்கு முன்.’ எபிரெய உரையில் ‘ஆண்டு’ என்பது ஒருமையில் உள்ளது; இது பஞ்சக் காலம் தொடங்கிய ஆண்டைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ஓன் என்பது எகிப்திய நகரம்; பிற்காலத்தில் கிரேக்க மொழியில் அது ஹெலியோபொலிஸ் என்று அழைக்கப்பட்டது.
    reason: cultural_note
lexical_decisions:
- source_word: יֻלַּד ... שְׁנֵי בָנִים
  choice: இரண்டு மகன்கள் பிறந்தார்கள்
  rationale: பலவினைப் பொருளுடன் வரும் பிறப்பைக் குறிக்கும் செயப்பாட்டு வடிவத்தை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: וּ/לְ/יוֹסֵף
  choice: யோசேப்புக்கு
  rationale: பிறப்பு தொடர்பான எபிரெய லாமேத் முன்னொட்டின் உறவுப் பொருளை இயல்பான தமிழில் காட்டுகிறது.
- source_word: בְּ/טֶרֶם תָּבוֹא שְׁנַת הָרָעָב
  choice: பஞ்சத்தின் ஆண்டு வருவதற்கு முன்
  rationale: எபிரெய உரையிலுள்ள ஒருமை ‘ஆண்டு’ என்பதையும் ‘வருதல்’ என்ற வினை உருவகத்தையும் காக்கிறது.
- source_word: יָלְדָה לּוֹ
  choice: அவருக்குப் பெற்றெடுத்தாள்
  rationale: ஆசெனாத் பெற்றெடுத்ததையும் அந்த மகன்கள் யோசேப்புக்குப் பிறந்தவர்கள் என்பதையும் தெளிவாகவும் இயல்பாகவும் சொல்கிறது.
- source_word: אָֽסְנַת
  choice: ஆசெனாத்
  rationale: தனிப்பெயரை எபிரெய ஒலிப்புக்கு நெருக்கமான வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: போத்திபெராவின் மகள்
  rationale: ஆசெனாத்தின் தந்தைவழி அடையாளத்தைக் கட்டமைப்புக்கேற்ப தருகிறது.
- source_word: כֹּהֵן אֽוֹן
  choice: ஓன் நகரத்தின் பூசாரி
  rationale: כֹּהֵן என்பதற்கு மதச் சேவகரைக் குறிக்கும் ‘பூசாரி’ இயல்பான பொருத்தம்; ஓன் என்பது இடப்பெயர் என்பதை ‘நகரம்’ தெளிவாக்குகிறது.
