  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֛י כַּ/אֲשֶׁ֥ר פָּֽתַר לָ֖/נוּ כֵּ֣ן הָיָ֑ה אֹתִ֛/י הֵשִׁ֥יב עַל כַּנִּ֖/י וְ/אֹת֥/וֹ תָלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/013.yaml
  text: 'And it happened just as he interpreted for us[a], so it was: me he restored to my office[b], but him he hanged.'
translation:
  language: ta
  text: 'அவன் எங்களுக்கு விளக்கம் சொன்னபடியே நடந்தது: என்னை அவர் என் பதவியில் மீண்டும் அமர்த்தினார்; அவனையோ தூக்கிலிட்டார்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר ... כֵּן הָיָה
  choice: சொன்னபடியே நடந்தது
  rationale: விளக்கத்திற்கும் நிகழ்ந்த முடிவிற்கும் இடையிலான துல்லியமான ஒற்றுமையை, எபிரெயச் சொல்லமைப்பின் தேவையற்ற மறுபடிதலைத் தவிர்த்து இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: פָּתַר לָנוּ
  choice: எங்களுக்கு விளக்கம் சொன்ன
  rationale: கனவின் பொருளை விளக்குதல் என்பதே இச்சூழலில் פתר என்பதன் பொருள்; சாதாரண வாசகருக்கு இயல்பாகப் புரியும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: אֹתִי הֵשִׁיב עַל כַּנִּי
  choice: என்னை அவர் என் பதவியில் மீண்டும் அமர்த்தினார்
  rationale: כֵּן இங்கு முன்னிருந்த அலுவல் நிலை அல்லது பதவியைக் குறிக்கிறது. ‘என்னை’ என்பதை முன்னிறுத்துவது அடுத்த நபருடனான எபிரெய மூலத்தின் வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: וְאֹתוֹ תָלָה
  choice: அவனையோ தூக்கிலிட்டார்
  rationale: ‘அவனையோ’ என்பது முந்தைய ‘என்னை’ என்பதுடன் உள்ள கூர்மையான முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது; תלה இச்சூழலில் மரணதண்டனையாகத் தூக்கிலிடுதலைக் குறிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் அமைக்கப்பட்டது. பார்வோனைப் பற்றிப் பேசுவதால் மரியாதைப் பன்மை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது; யோசேப்பையும் அப்பக்காரனையும் குறிப்பதற்கு சூழலுக்கேற்ற ஒருமை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
