translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கதிர்கள்’ என்பது முழுத் தண்டை அல்ல, தானியம் தாங்கும் தலைப்பகுதியைக் குறிக்கிறது. மூலத்தில் உள்ள கனவுக் காட்சியின் இயற்கைக்கு மாறான வன்மையும், ‘இதோ’ என்ற திடீர் உணர்வும் பாதுகாக்கப்பட்டுள்ளன.
