  to: மெலிந்த கதிர்கள் நன்கு வளர்ந்தும் தானியங்களால் நிறைந்தும் இருந்த அந்த ஏழு கதிர்களை விழுங்கிவிட்டன. அப்போது பார்வோன் விழித்துக்கொண்டான்; இதோ, அது ஒரு கனவு!
