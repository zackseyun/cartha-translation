base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/007.yaml
  text: And the thin ears swallowed up the seven healthy and full ears[a]. Then Pharaoh awoke, and behold[b], it was a dream.
translation:
  language: ta
  text: மெலிந்த கதிர்கள் நன்கு வளர்ந்தும் தானியங்களால் நிறைந்தும் இருந்த அந்த ஏழு கதிர்களை விழுங்கிவிட்டன. அப்போது பார்வோன் விழித்துக்கொண்டான்; இதோ, அது ஒரு கனவு!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּבְלַעְנָה
  choice: விழுங்கிவிட்டன
  rationale: בלע என்பதன் நேர்ப்பொருள் ‘விழுங்கு.’ கனவின் இயற்கைக்கு மாறான, உயிரோட்டமான காட்சியைத் தக்கவைக்க ‘விழுங்கிவிட்டன’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: הַשִּׁבֳּלִים
  choice: கதிர்கள்
  rationale: இந்தச் சூழலில் שִׁבֹּלֶת முழுத் தண்டைக் குறிக்காமல், தானியம் நிறைந்த தலைப்பகுதியைக் குறிக்கிறது. நவீன தமிழில் ‘கதிர்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַדַּקּוֹת
  choice: மெல்லிய
  rationale: இந்தப் பெயரடை மெலிந்த அல்லது நுண்ணிய நிலையைக் குறிக்கிறது. கதிர்களை விவரிக்க ‘மெல்லிய’ என்பது நேரான, இயல்பான தேர்வு.
- source_word: שֶׁבַע
  choice: ஏழு
  rationale: எண்ணைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: הַבְּרִיאוֹת
  choice: செழுமையான
  rationale: בְּרִיאוֹת நலமான, கொழுத்த அல்லது நன்கு வளர்ந்த நிலையைக் குறிக்கலாம். தானியக் கதிர்களுக்குப் பொருத்தமாக ‘செழுமையான’ என்பது அவற்றின் வலுவான, நன்கு வளர்ந்த நிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהַמְּלֵאוֹת
  choice: நிறைந்த
  rationale: מלא என்பதன் அடிப்படைப் பொருள் ‘நிறைந்த.’ கதிர்கள் தானியத்தால் நிறைந்திருப்பதை விளக்கமின்றியே இயல்பாக உணர்த்துகிறது.
- source_word: וַיִּיקַץ
  choice: விழித்துக்கொண்டான்
  rationale: தூக்கத்திலிருந்து விழிப்பதைக் குறிக்கும் வழக்கமான கதைநடைச் சொல்; நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה கவனத்தைத் திடீரென ஈர்க்கும் உரையாடல் குறியீடு. ‘இதோ’ அதன் இலக்கிய வலிமையையும் திடீர் உணர்வையும் தக்கவைக்கிறது.
- source_word: חֲלוֹם
  choice: அது ஒரு கனவு
  rationale: எபிரெயில் சுருக்கமாக ‘இதோ, ஒரு கனவு’ என்று உள்ளது. தமிழில் பொருள் தெளிவாக இருக்க இணைப்புவினை உணர்த்தப்பட்டு, மூலத்தின் திடீர் உணர்வு காக்கப்பட்டுள்ளது.
