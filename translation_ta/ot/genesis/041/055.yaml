translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடைத் தெளிவும் கொண்ட பதிவு. பார்வோனின் நேரடி உரையில் பன்மை மரியாதை/கூட்டுக் கட்டளை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. தேவையற்ற சமய மரபுச் சொற்களோ விளக்கச் சேர்க்கைகளோ தவிர்க்கப்பட்டுள்ளன.
