review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the hunger across all Egypt, the people's urgent appeal to Pharaoh, and Pharaoh's instruction to go to Joseph and obey him. However, לַלָּחֶם is explicitly “for bread”; “உணவுக்காக” is a permissible contextual expansion but is less textually transparent than “அப்பத்திற்காக.” Recasting the opening as two successive clauses also represents the Hebrew wayyiqtol narrative sequence more directly than the temporal “...போது.”
  naturalness: The revised wording is natural modern standard Tamil and retains a clear, dignified narrative register. “நாடெங்கும் பசி ஏற்பட்டது” is idiomatic without treating the land itself unnaturally as personally hungry.
  terminology: “பார்வோன்,” “யோசேப்பு,” and “அப்பம்” are appropriate established biblical terms in Tamil. The collective Hebrew “all Egypt” is naturally and faithfully expressed as “எகிப்தியர் அனைவரிடமும்” in Pharaoh's direct address.
  issues:
  - severity: low
    issue: “உணவுக்காக” broadens the explicit reference to bread.
    rationale: לֶחֶם literally denotes bread. While it can be metonymic for provisions in this famine context, “அப்பத்திற்காக” better preserves the source wording without becoming unnatural in Tamil.
  - severity: low
    issue: The temporal construction “பசி உண்டானபோது” slightly weakens the narrative succession.
    rationale: 'The Hebrew presents two sequential actions: hunger came upon all Egypt, and the people cried out. Separate finite clauses retain this progression more closely.'
