source:
  edition: WLC
  text: וַ/תִּרְעַב֙ כָּל אֶ֣רֶץ מִצְרַ֔יִם וַ/יִּצְעַ֥ק הָ/עָ֛ם אֶל פַּרְעֹ֖ה לַ/לָּ֑חֶם וַ/יֹּ֨אמֶר פַּרְעֹ֤ה לְ/כָל מִצְרַ֨יִם֙ לְכ֣וּ אֶל יוֹסֵ֔ף אֲשֶׁר יֹאמַ֥ר לָ/כֶ֖ם תַּעֲשֽׂוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/055.yaml
  text: And all the land of Egypt became hungry[a], and the people cried out to Pharaoh for bread. Pharaoh said to all Egypt, “Go to Joseph. What he says to you, do.”
translation:
  language: ta
  text: எகிப்து நாடெங்கும் பசி ஏற்பட்டது; மக்கள் அப்பத்திற்காகப் பார்வோனிடம் கூக்குரலிட்டார்கள். பார்வோன் எகிப்தியர் அனைவரிடமும், “யோசேப்பிடம் செல்லுங்கள்; அவர் உங்களுக்குச் சொல்வதைச் செய்யுங்கள்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַב
  choice: பசி உண்டானபோது
  rationale: רעב என்ற வினை பசி ஏற்படுவதையோ அனுபவிக்கப்படுவதையோ குறிக்கிறது. தமிழில் நாட்டையே எழுவாயாகக் கொண்டு ‘பசித்தது’ என்பதைக் காட்டிலும் ‘பசி உண்டானது’ இயல்பாகவும், வினையின் கருத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: כָּל אֶרֶץ מִצְרַיִם
  choice: எகிப்து நாடெங்கும்
  rationale: ‘எகிப்தின் முழு நிலம்’ என்ற சொற்சொல் அமைப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்தி, כָּל மற்றும் אֶרֶץ ஆகிய இரண்டின் கருத்தையும் தக்கவைக்கிறது.
- source_word: וַיִּצְעַק הָעָם
  choice: மக்கள் ... கூக்குரலிட்டார்கள்
  rationale: צעק துயரத்திலும் அவசரத் தேவையிலும் உதவி கேட்டு எழுப்பும் வலுவான கூக்குரலைக் குறிக்கிறது; ‘அழைத்தார்கள்’ என்பதைவிட ‘கூக்குரலிட்டார்கள்’ அந்தத் தீவிரத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: לַלָּחֶם
  choice: உணவுக்காக
  rationale: לֶחֶם என்பதன் அடிப்படைப் பொருள் ‘அப்பம்’; இச்சூழலில் அது உணவுப் பொருட்களைப் பொதுவாகக் குறிக்கும் ஆகுபெயராக உள்ளது. பஞ்சச் சூழலில் மக்கள் பார்வோனிடம் கேட்ட தேவையை நவீன தமிழில் ‘உணவு’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְכָל מִצְרַיִם
  choice: எகிப்தியர் அனைவரிடமும்
  rationale: எபிரெயத்தில் இடப்பெயர் மக்களைக் கூட்டாகக் குறிக்கிறது. தமிழில் ‘எகிப்து முழுவதிடமும்’ என்பது இயல்பற்றதால், உள்ளார்ந்த கூட்டுப் பொருள் தெளிவாகப் பெயர்க்கப்படுகிறது.
- source_word: לְכוּ אֶל יוֹסֵף
  choice: யோசேப்பிடம் செல்லுங்கள்
  rationale: கட்டளை வினையையும் אֶל என்பதன் திசை/அணுகல் கருத்தையும் நேரடியாகவும் இயல்பாகவும் தருகிறது; ‘யோசேப்பு’ என்பது தமிழில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: אֲשֶׁר יֹאמַר לָכֶם תַּעֲשׂוּ
  choice: அவர் உங்களுக்குச் சொல்வதைச் செய்யுங்கள்
  rationale: எபிரெய முன்னிறுத்தப்பட்ட உறவுத்தொடரின் பொருளையும் கட்டளையின் வலிமையையும் காத்து, தமிழில் இயல்பான சொல்வரிசையில் வழங்குகிறது.
