translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. ‘பார்வோன்’ என்ற வழக்கமான தமிழ் வேதாகமப் பெயராக்கம் பயன்படுத்தப்பட்டுள்ளது. தேவையற்ற விளக்கவுரை அல்லது நிர்வாகச் செயல்பாடு போன்ற சூழல் ஊகங்கள் உரைக்குள் சேர்க்கப்படவில்லை.
