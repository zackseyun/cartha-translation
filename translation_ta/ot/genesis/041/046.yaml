source:
  edition: WLC
  text: וְ/יוֹסֵף֙ בֶּן שְׁלֹשִׁ֣ים שָׁנָ֔ה בְּ/עָמְד֕/וֹ לִ/פְנֵ֖י פַּרְעֹ֣ה מֶֽלֶךְ מִצְרָ֑יִם וַ/יֵּצֵ֤א יוֹסֵף֙ מִ/לִּ/פְנֵ֣י פַרְעֹ֔ה וַֽ/יַּעְבֹ֖ר בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/046.yaml
  text: Joseph was thirty years old when he stood before Pharaoh king of Egypt. And Joseph went out from before Pharaoh and traveled through all the land of Egypt.
translation:
  language: ta
  text: யோசேப்பு எகிப்தின் அரசனாகிய பார்வோனுக்கு முன்பாக நின்றபோது முப்பது வயதுடையவராக இருந்தார். பின்னர் யோசேப்பு பார்வோனின் முன்னிலையிலிருந்து புறப்பட்டு, எகிப்து நாடு முழுவதும் பயணம் செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: முப்பது வயதுடையவராக இருந்தார்
  rationale: எபிரேய வயதுக் குறிப்பைச் சொற்சொல்லாக அல்லாமல், இயல்பான நவீன தமிழில் துல்லியமாக வழங்குகிறது.
- source_word: בְּעָמְדוֹ לִפְנֵי פַּרְעֹה
  choice: பார்வோனுக்கு முன்பாக நின்றபோது
  rationale: முன்னிடைச்சொல்லுடன் கூடிய வினையெச்ச அமைப்பின் காலப்பொருளையும், அரசவையில் பார்வோனின் முன்னிலையில் நிற்பதையும் காக்கிறது.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: எகிப்தின் அரசனாகிய பார்வோன்
  rationale: இணைவிளக்கத் தொடரை இயல்பான தமிழில் வழங்கி, பார்வோனை எகிப்தின் அரசன் என அடையாளப்படுத்துகிறது.
- source_word: וַיֵּצֵא ... מִלִּפְנֵי פַרְעֹה
  choice: பார்வோனின் முன்னிலையிலிருந்து புறப்பட்டு
  rationale: יצא என்பதன் வெளியேறுதல் பொருளையும், מִלִּפְנֵי என்பதன் முன்னிலையிலிருந்து என்ற அரண்மனைச் சூழலையும் தெளிவாகக் காட்டுகிறது.
- source_word: וַיַּעְבֹר בְּכָל אֶרֶץ מִצְרָיִם
  choice: எகிப்து நாடு முழுவதும் பயணம் செய்தார்
  rationale: עבר என்பதன் நகர்ந்து கடந்து செல்லும் பொருளையும், כָל என்பதன் முழுமையையும் இயல்பான தமிழில் தெரிவிக்கிறது; நிர்வாக நோக்கத்தை மூலத்தில் வெளிப்படையாக இல்லாததால் சேர்க்கவில்லை.
- source_word: וְ / וַ
  choice: பின்னர்
  rationale: எபிரேயக் கதைத் தொடர்ச்சியை இயல்பான தமிழில் உணர்த்துகிறது; மூலத்தில் இல்லாத ‘இப்போது’ போன்ற காலச் சொல்லைச் சேர்க்கவில்லை.
