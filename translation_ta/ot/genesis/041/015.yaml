base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/015.yaml
  text: And Pharaoh said to Joseph, “I have dreamed a dream, and there is no one to interpret it. But I have heard it said about you that when you hear a dream, you can interpret it.”
translation:
  language: ta
  text: பார்வோன் யோசேப்பிடம், “நான் ஒரு கனவு கண்டேன்; அதை விளக்க யாரும் இல்லை. ஆனால், உன்னைப் பற்றி, ‘நீ ஒரு கனவைக் கேட்டவுடன் அதை விளக்குவாய்’ என்று கேள்விப்பட்டேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲלוֹם חָלַמְתִּי
  choice: நான் ஒரு கனவு கண்டேன்
  rationale: எபிரேயத்தில் ஒரே வேர்ச்சொல் பெயர்ச்சொல்லாகவும் வினைச்சொல்லாகவும் வந்து வலியுறுத்துகிறது; தமிழில் இயல்பான ‘கனவு கண்டேன்’ இதன் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: அதை விளக்க யாரும் இல்லை
  rationale: பֹתֵר என்பது கனவின் பொருளை விளக்குபவரைக் குறிக்கிறது. தமிழில் சுருக்கமாகவும் இயல்பாகவும் மூலத்தின் பற்றாக்குறை வாக்கிய அமைப்பை அளிக்கிறது.
- source_word: שָׁמַעְתִּי עָלֶיךָ לֵאמֹר
  choice: என்று உன்னைப்பற்றிக் கேள்விப்பட்டேன்
  rationale: ‘உன்னைப்பற்றிக் கேட்டேன், சொல்லப்படுவதாவது’ என்ற எபிரேய அமைப்பை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது; தகவல் பிறரிடமிருந்து வந்தது என்பதும் காக்கப்படுகிறது.
- source_word: תִּשְׁמַע חֲלוֹם לִפְתֹּר אֹתוֹ
  choice: நீ ஒரு கனவைக் கேட்டால் அதை விளக்க முடியும்
  rationale: சொல்லெழுத்தாக ‘விளக்குவதற்காக ஒரு கனவைக் கேட்பாய்’ என இருந்தாலும், சூழலில் இது யோசேப்பின் திறனைப் பற்றிய புகழுரையாக உள்ளது. ‘முடியும்’ என்பது அந்த நடைமுறைப் பொருளை இயல்பாகத் தருகிறது; ‘கேட்டால்’ என்ற நிபந்தனைத் தோற்றத்தையும் காக்கிறது.
theological_decisions:
- issue: கனவுகளை விளக்கும் திறனின் ஆதாரம்
  choice: பார்வோன் யோசேப்பைப் பற்றிக் கேள்விப்பட்டதாக மட்டுமே வசனம் கூறுகிறது; திறனின் தெய்வீக ஆதாரத்தை இவ்வசனத்தில் சேர்க்கவில்லை.
  alternative: ‘தேவனால் கனவை விளக்க முடியும்’ என்று வெளிப்படையாகச் சேர்த்தல்.
  rationale: அடுத்த வசனத்தில் யோசேப்பு தேவனைச் சுட்டிக்காட்டினாலும், இவ்வசனத்தில் பார்வோன் கேட்ட செய்தி மட்டுமே பதிவு செய்யப்படுகிறது. ஆகவே இங்கே இல்லாத இறையியல் விளக்கத்தை முன்கூட்டியே சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; அரசவைக் காட்சிக்கு ஏற்ற கண்ணியமான, ஆனால் சாதாரண வாசகர்களுக்கு எளிதில் புரியும் நடை. ‘பார்வோன்’ மற்றும் ‘யோசேப்பு’ என்ற பரவலாக அறியப்பட்ட வேதாகமப் பெயர்வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
