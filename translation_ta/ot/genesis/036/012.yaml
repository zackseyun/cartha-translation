  text: וְ/תִמְנַ֣ע הָיְתָ֣ה פִילֶ֗גֶשׁ לֶֽ/אֱלִיפַז֙ בֶּן עֵשָׂ֔ו וַ/תֵּ֥לֶד לֶ/אֱלִיפַ֖ז אֶת עֲמָלֵ֑ק אֵ֕לֶּה בְּנֵ֥י עָדָ֖ה אֵ֥שֶׁת עֵשָֽׂו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/012.yaml
  text: Timna was a concubine of Eliphaz[a], Esau’s son, and she bore Amalek to Eliphaz. These are the sons of Adah[b], Esau’s wife.
translation:
  language: ta
  text: திம்னா, ஏசாவின் மகனான எலிப்பாசின் துணைமனைவியாக[a] இருந்தாள்; அவள் எலிப்பாசுக்கு அமலேக்கைப் பெற்றாள். இவர்களே ஏசாவின் மனைவி ஆதாவின் மகன்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “துணைமனைவி” என்பதற்கான எபிரெயச் சொல், ஒரு ஆணுடன் அங்கீகரிக்கப்பட்ட ஆனால் முதன்மை மனைவியின் நிலைக்கு இல்லாத உறவில் இருந்த பெண்ணைக் குறிக்கிறது.
    reason: lexical_clarification
  - marker: b
    text: “மகன்கள்” என்பதற்கான எபிரெயச் சொல் பேரன்கள் அல்லது பிற வழித்தோன்றல்களையும் குறிக்கலாம்; இங்கு சூழலின்படி ஆதாவின் பேரன்கள் குறிக்கப்படுகின்றனர்.
    reason: genealogical_ambiguity
lexical_decisions:
- source_word: וְתִמְנַע
  choice: திம்னா
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது; தொடக்க இணைப்புச்சொல் தமிழில் இயல்பான வாக்கிய ஓட்டத்திற்காகத் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: פִילֶגֶשׁ
  choice: துணைமனைவி
  rationale: அங்கீகரிக்கப்பட்டிருந்தாலும் முதன்மை மனைவியைவிடக் கீழ்நிலையிலிருந்த திருமண உறவைக் குறிக்கும் எபிரெயச் சொல்லை, இழிவான அல்லது மிகப் பழமையான சொல்லைப் பயன்படுத்தாமல் தெளிவாகக் காட்டுகிறது.
- source_word: לֶאֱלִיפַז בֶּן עֵשָׂו
  choice: ஏசாவின் மகனான எலிப்பாசின்
  rationale: முதல் לְ உறவையோ சார்பையோ குறிக்கிறது; எபிரெயக் கட்டமைப்பு இயல்பான தமிழ்ச் சொந்தத் தொடராக வழங்கப்பட்டது.
- source_word: וַתֵּלֶד לֶאֱלִיפַז אֶת־עֲמָלֵק
  choice: அவள் எலிப்பாசுக்கு அமலேக்கைப் பெற்றெடுத்தாள்
  rationale: ילד என்பதன் பிறப்பித்தல் பொருளையும், தந்தையைக் குறிக்கும் לְ அமைப்பையும் தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֵלֶּה בְּנֵי עָדָה
  choice: இவர்களே ஆதாவின் மகன்கள்
  rationale: மூலத்தின் வம்சவரலாற்றுச் சூத்திரத்தையும் בְּנֵי என்ற சொல்லின் நேரடியான வடிவத்தையும் காக்கிறது; சூழலில் அது பேரன்கள் அல்லது வழித்தோன்றல்களைக் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: אֵשֶׁת עֵשָׂו
  choice: ஏசாவின் மனைவி
  rationale: எபிரெயச் சேர்ந்துநிலைத் தொடரை இயல்பான தமிழ்ச் சொந்தத் தொடராக வழங்குகிறது.
theological_decisions:
- issue: בְּנֵי என்பதை ‘மகன்கள்’ அல்லது ‘பேரன்கள்’ என்று மொழிபெயர்த்தல்
  choice: மகன்கள்
  alternative: பேரன்கள் / வழித்தோன்றல்கள்
  rationale: மூல எபிரெயச் சொல்லின் நேரடியான வம்சவரலாற்றுச் சொல் ‘மகன்கள்’ என்பதே. முந்தைய வசனங்களின் சூழலில் பட்டியலிடப்பட்டவர்கள் ஆதாவின் பேரன்கள்; இருப்பினும் அதை முதன்மை உரையிலேயே தீர்மானித்து விரிவாக்காமல், எபிரெயச் சொல்லின் பரந்த பயன்பாட்டை அடிக்குறிப்பில் விளக்குவது மூலத்தின் வடிவத்தையும் சூழலையும் இரண்டையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வம்சவரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. ‘வைப்பாட்டி’ போன்ற இன்றைக்கு இழிவாகவோ பழமையாகவோ ஒலிக்கக்கூடிய சொல்லுக்குப் பதிலாக ‘துணைமனைவி’ தேர்ந்தெடுக்கப்பட்டது; ‘மகன்கள்’ என்ற மூலச்சொல்லின் பரந்த வம்சப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
