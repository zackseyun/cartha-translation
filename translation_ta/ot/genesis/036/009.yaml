  yaml_path: translation/ot/genesis/036/009.yaml
  text: And these are the generations of Esau[a], the father of Edom, in the hill country of Seir.
translation:
  language: ta
  text: சேயீர் மலைப்பகுதியில் இருந்த[a] ஏதோமின் தந்தையான ஏசாவின் தலைமுறைகள் இவையே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சேயீர் மலையில்”; அல்லது, “சேயீர் மலைகளில்.”
    reason: בְּהַר שֵׂעִיר என்ற சொற்றொடர் ஒரே மலையையோ மலைகள் நிறைந்த பிரதேசத்தையோ குறிக்கலாம்.
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: இவையே
  rationale: தொடக்க வாவ் முந்தைய பகுதியுடனான தொடர்பைக் காட்டுகிறது; தமிழில் இயல்பான தொடர் அமைப்பில் தனியே ‘மேலும்’ என்று சேர்க்காமல் ‘இவையே’ எனும் சூத்திரத் தொடர் அந்த இணைப்பைத் தாங்குகிறது.
- source_word: תֹּלְדוֹת
  choice: தலைமுறைகள்
  rationale: ஆதியாகமத்தில் பகுதிகளை அமைக்கும் மீளும் வம்சவரலாற்றுச் சொல்லை முறையாகப் பாதுகாக்கிறது; ‘சந்ததியினர்’ அல்லது ‘வரலாறு’ என்பதைக் காட்டிலும் மூலச்சொல்லின் பரப்பைத் திறந்த நிலையில் வைக்கிறது.
- source_word: עֵשָׂו
  choice: ஏசா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: אֲבִי
  choice: தந்தையான
  rationale: ஏதோமின் மூதாதை மற்றும் பிறப்பிடத் தலைவன் என்ற நேரடியான உறவை மூலத்தின் ‘தந்தை’ உருவகத்தோடு காக்கிறது.
- source_word: אֱדוֹם
  choice: ஏதோம்
  rationale: இங்கு ஏசாவிலிருந்து தோன்றிய மக்களையும் நாட்டையும் குறிக்கும் இயற்பெயரின் நிலைபெற்ற தமிழ் ஒலிபெயர்ப்பு.
- source_word: בְּ/הַר
  choice: மலைப்பகுதியில்
  rationale: הַר என்பது ஒரே சிகரத்தையோ மலைநாட்டையோ குறிக்கக்கூடும்; சேயீர் ஒரு பிரதேசமாக இருப்பதால் ‘மலைப்பகுதி’ இயல்பான புவியியல் பொருளைத் தருகிறது.
- source_word: שֵׂעִיר
  choice: சேயீர்
  rationale: இடப்பெயரின் நிலைபெற்ற தமிழ் ஒலிபெயர்ப்பு.
