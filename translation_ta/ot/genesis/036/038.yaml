  yaml_path: translation/ot/genesis/036/038.yaml
  text: And Shaul died[a], and Baal-hanan son of Akbor reigned in his place.
translation:
  language: ta
  text: சாவூல் இறந்தான்[a]; அவனுக்குப் பதிலாக அக்போரின் மகன் பாகால்-ஹானான் அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பாரம்பரிய ஆங்கில மொழிபெயர்ப்புகள் இப்பெயர்களை பொதுவாக “Saul,” “Baal-hanan,” மற்றும் “Achbor” என்று எழுதுகின்றன. இம்மொழிபெயர்ப்பு எபிரெய ஒலிவடிவத்துக்கு நெருக்கமான «சாவூல்» மற்றும் «அக்போர்» வடிவங்களைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தான்
  rationale: מות என்பதன் Qal wayyiqtol வடிவம்; இறப்பைக் குறிக்கும் நேரடியான வழக்கமான கதைநடைச் சொல். இடக்கரடக்கலைத் தவிர்க்கிறது.
- source_word: שָׁאוּל
  choice: சாவூல்
  rationale: எபிரெயப் பெயரின் ஒலிவடிவத்தை நெருக்கமாகத் தரும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: מלך என்பதன் Qal wayyiqtol வடிவம்; அரச வாரிசுரிமைச் சூத்திரத்தில் சுருக்கமாகவும் இயல்பாகவும் ஆட்சியேற்றலைத் தெரிவிக்கிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: ஒருவரின் இடத்தை மற்றொருவர் ஏற்று அரசாளுவதைத் தெளிவாகக் குறிக்கும் இயல்பான தமிழ் தொடர்.
- source_word: בַּעַל חָנָן
  choice: பாகால்-ஆனான்
  rationale: இரு கூறுகளைக் கொண்ட எபிரெயப் பெயரின் அமைப்பை இணைப்புக்குறியுடன் பாதுகாக்கும் தமிழ் எழுத்துப்பெயர்ப்பு; ח ஒலி தமிழில் இயல்பாக ‘ஆ’ என அணுகப்பட்டுள்ளது.
- source_word: בֶּן
  choice: மகன்
  rationale: உடனடி தந்தை–மகன் உறவைக் குறிக்கும் எபிரெய construct பயன்பாட்டின் வழக்கமான தமிழ் இணை.
- source_word: עַכְבּוֹר
  choice: அக்போர்
  rationale: எபிரெய மெய்யொலி அமைப்பை வாசிக்கத்தக்க தமிழில் நெருக்கமாகத் தரும் எழுத்துப்பெயர்ப்பு.
