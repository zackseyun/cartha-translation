translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான வம்சப் பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. தனிப்பெயர்கள் மூல எபிரெய வடிவங்களிலிருந்து ஒலிபெயர்க்கப்பட்டுள்ளன; இணை உரையின் மாறுபாடுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
