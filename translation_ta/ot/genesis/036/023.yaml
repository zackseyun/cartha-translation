source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ בְּנֵ֣י שׁוֹבָ֔ל עַלְוָ֥ן וּ/מָנַ֖חַת וְ/עֵיבָ֑ל שְׁפ֖וֹ וְ/אוֹנָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/023.yaml
  text: 'These are the sons of Shobal: Alvan[a], Manahath, Ebal, Shepho[b], and Onam.'
translation:
  language: ta
  text: 'சோபாலின் மகன்கள் இவர்கள்: அல்வான்[a], மனகாத், ஏபால், செபோ[b], ஓனாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய உரையில் “அல்வான்” என்று உள்ளது; 1 நாளாகமம் 1:40-இல் உள்ள இணை வம்சப் பட்டியல் “அலியான்” என்று வாசிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: எபிரேய உரையில் “செபோ” என்று உள்ளது; 1 நாளாகமம் 1:40-இல் உள்ள இணை வம்சப் பட்டியல் “செபி” என்று வாசிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: இவர்களே
  rationale: வம்சப் பட்டியலின் அடுத்த பகுதியை அறிமுகப்படுத்தும் இணைப்புச்சொல் மற்றும் சுட்டுப்பெயரின் பொருளை இயல்பான நவீன தமிழில் தருகிறது; எபிரெய முன்னொட்டைத் தனியாக ‘மேலும்’ என்று மொழிபெயர்க்கத் தேவையில்லை.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இங்கு நேரடியான ஆண் பிள்ளைகளின் பட்டியல் வருவதால், பொதுவான ‘பிள்ளைகள்’ அல்லது ‘வழித்தோன்றல்கள்’ என்பதைக் காட்டிலும் ‘மகன்கள்’ துல்லியமானது.
- source_word: שׁוֹבָל
  choice: சோபால்
  rationale: எபிரெய தனிப்பெயரின் ஒலிவடிவத்தைத் தமிழில் இயன்றவரை பாதுகாக்கும் ஒலிபெயர்ப்பு.
- source_word: עַלְוָן
  choice: அல்வான்
  rationale: WLC எபிரெய உரையில் உள்ள பெயர்வடிவத்தை ஒலிபெயர்க்கிறது; 1 நாளாகமம் 1:40-இன் மாறுபட்ட வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּ/מָנַחַת
  choice: மனாகாத்
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு; இணைப்பிடைச்சொல் தமிழ் பட்டியல் அமைப்பில் தனியே வெளிப்படுத்தப்படவில்லை.
- source_word: וְ/עֵיבָל
  choice: ஏபால்
  rationale: எபிரெய பெயரின் நீண்ட தொடக்க உயிரையும் மெய்யொலிகளையும் நெருக்கமாகப் பாதுகாக்கும் ஒலிபெயர்ப்பு.
- source_word: שְׁפוֹ
  choice: செப்போ
  rationale: இவ்வசனத்தின் மசோரெட்டிக் உரையில் உள்ள பெயர்வடிவத்தை ஒலிபெயர்க்கிறது; இணை வம்சப் பட்டியலிலுள்ள வேறுபாடு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: וְ/אוֹנָם
  choice: ஓனாம்
  rationale: எபிரெய தனிப்பெயரை நேரடியாக ஒலிபெயர்க்கிறது; பட்டியலின் இறுதி இணைப்பு தமிழில் காற்புள்ளிகளால் இயல்பாக உணர்த்தப்படுகிறது.
