  text: 'These are the chiefs of the Horites: chief Lotan[a], chief Shobal, chief Zibeon, chief Anah.'
translation:
  language: ta
  text: 'ஹோரியர்களின் தலைவர்கள் இவர்களே: தலைவன் லோத்தான்[a], தலைவன் சோபால், தலைவன் சிபியோன், தலைவன் ஆனா.'
