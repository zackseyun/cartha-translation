  text: וְ/אֵ֣לֶּה הָי֗וּ בְּנֵ֨י אָהֳלִיבָמָ֧ה בַת עֲנָ֛ה בַּת צִבְע֖וֹן אֵ֣שֶׁת עֵשָׂ֑ו וַ/תֵּ֣לֶד לְ/עֵשָׂ֔ו אֶת יעיש וְ/אֶת יַעְלָ֖ם וְ/אֶת קֹֽרַח־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/014.yaml
  text: 'And these were the sons of Oholibamah daughter of Anah, daughter of Zibeon, Esau''s wife: she bore to Esau Jeush, Jalam, and Korah.'
translation:
  language: ta
  text: 'அனாவின் மகளும் சிபியோனின் மகளுமான ஏசாவின் மனைவி ஒகொலிபாமாவின் மகன்கள் இவர்களே: அவள் ஏசாவுக்கு எயூஷ், யாலாம், கோரா ஆகியோரைப் பெற்றாள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה הָיוּ בְּנֵי
  choice: மகன்கள் இவர்களே
  rationale: வம்சப்பட்டியல் அறிமுகச் சூத்திரத்தை இயல்பான நவீனத் தமிழில் தருகிறது; בְּנֵי என்பது இங்கு பெயரிடப்பட்ட ஆண் பிள்ளைகளைக் குறிப்பதால் ‘மகன்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אָהֳלִיבָמָה
  choice: அகோலிபாமா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: בַת עֲנָה בַּת צִבְעוֹן
  choice: அனாவின் மகளும் சிபியோனின் மகளுமான
  rationale: மூலத்தில் בַת இருமுறை வருவதைக் காத்து, ‘பேத்தி’ என்று விளக்கி மாற்றாமல் வம்ச உறவின் சொற்பிரயோகத் தெளிவின்மையையும் அமைப்பையும் பாதுகாக்கிறது.
- source_word: אֵשֶׁת עֵשָׂו
  choice: ஏசாவின் மனைவி
  rationale: எபிரெயக் கட்டமைப்பு உறவை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: וַ/תֵּלֶד לְ/עֵשָׂו
  choice: அவள் ஏசாவுக்கு ... பெற்றாள்
  rationale: לְ குறிக்கும் உறவுநிலையை ‘ஏசாவுக்கு’ என்று காத்து, ילד என்பதைக் குடும்ப வம்சச் சூழலுக்கு ஏற்ற ‘பெற்றாள்’ என வழங்குகிறது.
- source_word: יעיש
  choice: எயூஷ்
  rationale: எபிரெயத் தனிப்பெயரை மூல உச்சரிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கிறது.
- source_word: יַעְלָם
  choice: யாலாம்
  rationale: எபிரெயத் தனிப்பெயரை மூல உச்சரிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கிறது.
- source_word: קֹרַח
  choice: கோராகு
  rationale: இறுதி ח ஒலியைத் தமிழில் தோராயமாகக் காட்டும் வகையில் தனிப்பெயர் எழுத்துப்பெயர்க்கப்பட்டது.
