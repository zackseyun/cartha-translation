  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதாகப் புரியக்கூடியதுமான வம்சப்பட்டியல் நடை பயன்படுத்தப்பட்டது. மூலத்தின் ‘அனாவின் மகள், சிபியோனின் மகள்’ என்ற இரட்டை உறவுக் குறிப்பை ‘பேத்தி’ எனச் சீராக்காமல் காத்திருக்கிறது.
