  yaml_path: translation/ot/genesis/036/037.yaml
  text: Then Samlah died[c][b][a], and Shaul from Rehoboth on the River reigned in his place.
translation:
  language: ta
  text: பின்பு சம்லா இறந்தான்; அவனுக்குப் பதிலாக, ஆற்றோர ரெகொபோத்தைச் சேர்ந்த சவுல்[a][b] அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயப் பெயரை இன்னும் நேரடியாக ஒலிபெயர்த்தால் ‘ஷாவூல்’.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘ஆற்றின் ரெகொபோத்’; ஒரு குறிப்பிடத்தக்க ஆற்றருகே இருந்த ரெகொபோத்தை இது குறிக்கலாம்.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: பின்பு ... இறந்தான்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை முன்னெடுக்கும் wayyiqtol வடிவத்தை இயல்பான தமிழில் காலவரிசையாகக் காட்டுகிறது.
- source_word: שַׂמְלָה
  choice: சம்லா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிவடிவத்தைத் தமிழில் நெருக்கமாகப் பெயர்த்தெழுதுகிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: மன்னராட்சி வாரிசுரிமைச் சூத்திரத்தில் מלך என்பது ஆட்சி செய்தலைக் குறிக்கிறது; தமிழில் ‘அரசாண்டான்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: முந்தைய அரசனின் இடத்தை அடுத்தவன் ஏற்றுக்கொண்டான் என்ற வாரிசுரிமைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: שָׁאוּל
  choice: சவுல்
  rationale: தமிழ் வாசகர்களிடையே அறியப்பட்ட பெயர்வடிவமாக இருப்பதுடன், எபிரெயப் பெயரின் ஒலியையும் போதுமான அளவு பிரதிபலிக்கிறது.
- source_word: מֵרְחֹבוֹת הַנָּהָר
  choice: ஆற்றோர ரெகொபோத்தைச் சேர்ந்த
  rationale: מֵ־ என்பது பிறப்பிடம் அல்லது தொடர்பைக் குறிக்கிறது. הַנָּהָר என்பது குறிப்பிட்ட ஓர் ஆற்றைச் சுட்டுகிறது; தமிழில் குடியிருப்பின் புவியியல் அடையாளத்தை இயல்பாகத் தெரிவிக்க ‘ஆற்றோர’ என வழங்கப்பட்டுள்ளது.
