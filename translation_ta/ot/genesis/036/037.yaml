translation_notes:
  register: நவீனத் தரமான தமிழில், எளிய ஆனால் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் அரசர்-வாரிசுரிமைச் சூத்திரம் பாதுகாக்கப்பட்டுள்ளது; ‘ரெகொபோத்—ஆறு’ என்ற புவியியல் தொடர்பின் சிறிய தெளிவின்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
