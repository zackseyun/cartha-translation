base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/020.yaml
  text: 'These are the sons of Seir the Horite[a], the inhabitants of the land: Lotan, Shobal, Zibeon, and Anah.'
translation:
  language: ta
  text: 'அந்நாட்டில் குடியிருந்த ஓரியனாகிய சேயீரின் மகன்கள் இவர்களே: லோத்தான், சோபால், சிபியோன், ஆனா.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவர்களே
  rationale: வம்சப் பட்டியலை அறிமுகப்படுத்தும் எபிரெயச் சுட்டுப்பெயரின் வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: בְנֵי
  choice: மகன்கள்
  rationale: இங்கு பெயரிடப்பட்ட ஆண் வழித்தலைவர்களை நேரடியாகக் குறிக்கும் வம்சவரலாற்றுச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: שֵׂעִיר
  choice: சேயீர்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் மரபுக்கு ஏற்றவாறு எழுத்துப்பெயர்த்துள்ளது.
- source_word: הַחֹרִי
  choice: ஓரியனாகிய
  rationale: சேயீரின் இன அடையாளத்தைக் குறிக்கும் சொல்லைத் தமிழில் இயல்பான அடைமொழித் தொடராக வழங்குகிறது.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: அந்நாட்டில் குடியிருந்த
  rationale: பட்டியலிடப்படும் மகன்களையே ‘நாட்டில் குடியிருந்தவர்கள்’ என்று விளக்கும் பன்மைச் செயப்பெயரெச்சத் தொடரின் தொடர்பைப் பாதுகாக்கிறது.
- source_word: לוֹטָן
  choice: லோத்தான்
  rationale: தனிப்பெயரை எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: שׁוֹבָל
  choice: சோபால்
  rationale: தனிப்பெயரை எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: צִבְעוֹן
  choice: சிபியோன்
  rationale: தனிப்பெயரை எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: עֲנָה
  choice: ஆனா
  rationale: தனிப்பெயரை எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
