reference: Genesis 36:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ בְּנֵ֣י רְעוּאֵ֔ל נַ֥חַת וָ/זֶ֖רַח שַׁמָּ֣ה וּ/מִזָּ֑ה אֵ֣לֶּ֣ה הָי֔וּ בְּנֵ֥י בָשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/013.yaml
  text: 'And these were the sons of Reuel: Nahath[a], Zerah, Shammah, and Mizzah. These were the sons of Basemath, Esau’s wife.'
translation:
  language: ta
  text: 'ரெகுவேலின் மகன்கள் இவர்கள்: நகாத், சேராக், சம்மா, மிஸ்ஸா. இவர்கள் ஏசாவின் மனைவியான பஸ்மத்தின் மகன்கள்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே ‘மகன்கள்’ என்பது ‘வழித்தோன்றல்கள்’ என்ற விரிவான பொருளில் வருகிறது; 36:10-ன்படி இவர்கள் பஸ்மத்தின் பேரன்கள்.
    reason: எபிரெயில் ‘மகன்கள்’ என்றே உள்ளது; முந்தைய வம்சத் தகவலின் அடிப்படையில் இவர்கள் பஸ்மத்தின் பேரன்கள் என்பதை விளக்குகிறது.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ஆகியோர்
  rationale: எபிரெய உரை முந்தைய வம்சப் பட்டியலுடன் தொடர்ச்சியைச் சுட்டுகிறது. தமிழில் பெயர்ப்பட்டியலை இயல்பாக முடிக்கும் ‘ஆகியோர்’ அந்த அறிமுகச் செயல்பாட்டைச் செய்கிறது; வசனத் தொடக்கத்தில் மரப்பான ‘மேலும் இவர்கள்’ என்பதைக் தவிர்க்கிறது.
- source_word: בְּנֵי רְעוּאֵל
  choice: ரெகுவேலின் மகன்கள்
  rationale: இங்கு பெயரிடப்பட்டவர்கள் ரெகுவேலின் நேரடி ஆண் பிள்ளைகள் என்பதால் ‘மகன்கள்’ துல்லியமானது. ரְעוּאֵל என்பது தமிழில் பரவலாக அறியப்படும் வடிவில் ‘ரெகுவேல்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: נַחַת וָזֶרַח שַׁמָּה וּמִזָּה
  choice: நகாத், சேரா, சம்மா, மிசா
  rationale: தனிப்பெயர்கள் எபிரெய ஒலிகளை நெருங்கிய, வாசிக்க எளிய நவீனத் தமிழ் வடிவங்களில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: אֵלֶּה הָיוּ
  choice: இவர்கள்
  rationale: தமிழில் பெயர்ச்சொல் பயனிலையுடன் இறந்தகால இணைப்புவினை வெளிப்படையாகத் தேவையில்லை. சூழல் கடந்தகால வம்சப் பதிவாக இருப்பதால் பொருள் இயல்பாகத் தெளிவாகிறது.
- source_word: בְּנֵי בָשְׂמַת
  choice: பஸ்மத்தின் மகன்கள்
  rationale: மூலத்தில் மீண்டும் בְּנֵי (‘மகன்கள்’) என்றே உள்ளது. சூழலில் இவர்கள் பஸ்மத்தின் பேரன்கள் என்றாலும், மொழிபெயர்ப்பில் அந்த உறவைத் தானாகக் குறுக்காமல் மூலத்தின் பரந்த வம்சவழிப் பயன்பாடு பாதுகாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: אֵשֶׁת עֵשָׂו
  choice: ஏசாவின் மனைவியான
  rationale: எபிரெய கட்டமைப்பை இயல்பான நவீனத் தமிழில் உறவைக் குறிப்பிடும் பெயரெச்சத் தொடராக வழங்குகிறது.
theological_decisions:
- issue: பஸ்மத்துடனான வம்ச உறவு
  choice: மூலத்தின் ‘மகன்கள்’ என்ற சொல்லை முதன்மை உரையில் வைத்தல்
  alternative: ‘பேரன்கள்’ அல்லது ‘வழித்தோன்றல்கள்’ என்று சூழலுக்கேற்ப வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: ஆதியாகமம் 36:10-ன் படி ரெகுவேல் பஸ்மத்தின் மகன்; ஆகவே இங்கு பட்டியலிடப்பட்டவர்கள் அவளுடைய பேரன்கள். எனினும் எபிரெய בְּנֵי உறவின் விரிவான வம்சவழிப் பொருளிலும் வரக்கூடும். மூலத்தின் சொல் தேர்வையும் அதன் பதற்றத்தையும் காக்க ‘மகன்கள்’ வைக்கப்பட்டு, துல்லியமான வம்ச உறவு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான வம்சப் பட்டியல் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தனிப்பெயர்கள் வாசிக்க எளிய மரபறிந்த தமிழ் வடிவங்களில் தரப்பட்டுள்ளன; மூலத்தின் ‘மகன்கள்’ என்ற மறுபயன்பாடு அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
