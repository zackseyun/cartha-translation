base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/030.yaml
  text: Chief Dishon[a], chief Ezer[b], chief Dishan—these were the chiefs of the Horites according to their chiefs in the land of Seir.
translation:
  language: ta
  text: தலைவர் திஷோன், தலைவர் ஏசேர், தலைவர் தீஷான்—இவர்கள் சேயீர் நாட்டிலிருந்த ஹோரியரின் தலைவர்கள், அவரவர் தலைமைப் பிரிவுகளின்படி.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவரவர் தலைவர்களின்படி” என்றும் மொழிபெயர்க்கலாம். எபிரேயத் தொடர் தலைவர்களைக் குறிக்கிறதா, அவர்களுடைய தலைமைப் பிரிவுகளைக் குறிக்கிறதா என்பது தெளிவாக இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: தலைவர்
  rationale: ஏதோம்–ஓரியர் சூழலில் இச்சொல் ஒரு குலம் அல்லது இனப்பிரிவின் தலைவரைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இருப்பதோடு, எபிரேயப் பட்டியலின் திரும்பக்கூறும் அமைப்பையும் இது காக்கிறது.
- source_word: דִּשֹׁן / אֵצֶר / דִּישָׁן
  choice: திஷோன் / ஏசேர் / தீஷான்
  rationale: பெயர்கள் மொழிபெயர்க்கப்படாமல் எபிரேய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன; திஷோன், தீஷான் என்ற இரு வேறுபட்ட பெயர்களும் தனித்தனியாகக் காக்கப்பட்டுள்ளன.
- source_word: אַלּוּפֵי הַחֹרִי
  choice: ஓரியர்களின் தலைவர்கள்
  rationale: הַחֹרִי இங்கு ஓரியர் மக்களினத்தைக் குறிக்கிறது; தமிழில் பன்மை மக்களினப் பெயராக மொழிபெயர்ப்பது இயல்பானது.
- source_word: לְאַלֻּפֵיהֶם
  choice: அவரவர் தலைமைப் பிரிவின்படி
  rationale: לְ முன்னொட்டு வகைப்படுத்தலைக் குறிக்கலாம்; אַלּוּף இங்கு தலைவரை மட்டுமல்ல, அவருடைய தலைமைக்குட்பட்ட பிரிவையும் குறிக்கக்கூடும். ‘தலைவர்களின்படி’ என்ற செயற்கையான மீளுரையைத் தவிர்த்து, மூலத்தின் வகைப்பாட்டு பொருளை இது வெளிப்படுத்துகிறது.
- source_word: בְּאֶרֶץ שֵׂעִיר
  choice: சேயீர் நாட்டிலிருந்த
  rationale: புவியியல் தொடரின் ‘சேயீர் நாட்டில்’ என்ற பொருளைக் காத்து, இவர்கள் அந்நாட்டைச் சேர்ந்த தலைவர்கள் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
