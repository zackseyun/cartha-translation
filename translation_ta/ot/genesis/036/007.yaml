base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/007.yaml
  text: For their possessions were too great for them to dwell together[b][a], and the land of their sojourning could not support them because of their livestock.
translation:
  language: ta
  text: ஏனெனில், அவர்களுடைய உடைமைகள் மிகுதியாக இருந்ததால், அவர்கள் ஒன்றாகக் குடியிருக்க முடியவில்லை; அவர்களுடைய கால்நடைகள் காரணமாக, அவர்கள் அந்நியர்களாகத் தங்கியிருந்த நாடு[a] அவர்களைத் தாங்க முடியவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் தங்கியிருந்த நாடு.” எபிரேயச் சொற்றொடர், அவர்கள் அங்கே அந்நியக் குடியிருப்பாளர்களாகத் தற்காலிகமாக வாழ்ந்ததைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேய மொழியில் நேரடியாக, “அவர்களைச் சுமக்க முடியவில்லை.” இங்கே இது அவர்களை ஆதரிக்க அல்லது அவர்களுக்குப் போதுமான வளம் அளிக்க முடியாததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: (தனி சொல்லாக மொழிபெயர்க்கப்படாமல் காரண விளக்கமாக வெளிப்படுத்தப்பட்டது)
  rationale: முந்தைய வசனத்தில் ஏசா பிரிந்து சென்றதற்கான காரணத்தை இவ்வசனம் விளக்குகிறது. தமிழில் தனி வசனமாக வாசிக்கும்போது இயல்பாக இருக்க, காரணத் தொடர்பு முழு வாக்கியத்தின் விளக்கத் தன்மையில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: רְכוּשָׁם
  choice: அவர்களுடைய உடைமைகள்
  rationale: அசையும் சொத்துகள், பொருட்கள், செல்வம் ஆகியவற்றை உள்ளடக்கக்கூடிய பரந்த பொருளை இது இயல்பாகத் தருகிறது.
- source_word: רָב מִשֶּׁבֶת יַחְדָּו
  choice: அவர்கள் ஒன்றாகக் குடியிருக்க முடியாத அளவுக்கு ... மிகுதியாக இருந்தன
  rationale: மִן உடன் வரும் வினையெச்ச அமைப்பு, ஒன்றாகக் குடியிருப்பதற்கு இயலாத அளவிலான மிகுதியைக் குறிக்கிறது. தமிழ் அமைப்பு இந்த விளைவுத் தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: אֶרֶץ מְגוּרֵיהֶם
  choice: அவர்கள் அந்நியர்களாகத் தங்கியிருந்த நாடு
  rationale: מְגוּרִים என்பது சொந்த நாட்டில் நிரந்தரமாக வாழ்வதை அல்ல, அந்நியக் குடியிருப்பாளர்களாகத் தங்கியிருப்பதைச் சுட்டுகிறது. இந்த முறையில் முற்பிதாக்களின் அந்நியத் தங்கல் என்ற கருத்து காக்கப்படுகிறது.
- source_word: לָשֵׂאת אֹתָם
  choice: அவர்களைத் தாங்க முடியவில்லை
  rationale: נשא என்பதன் அடிப்படைப் பொருள் ‘சுமத்தல்/தாங்குதல்.’ நிலம் கருப்பொருளாக வரும் இச்சூழலில், வளங்களால் அவர்களையும் அவர்களுடைய உடைமைகளையும் ஆதரிக்க இயலாத நிலையை ‘தாங்க முடியவில்லை’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִפְּנֵי
  choice: காரணமாக
  rationale: கால்நடைகளின் பெருக்கே அந்த நாடு அவர்களைத் தாங்க முடியாததற்கான காரணம் என்பதைச் சுட்டுகிறது.
- source_word: מִקְנֵיהֶם
  choice: அவர்களுடைய கால்நடைகள்
  rationale: מִקְנֶה என்பது மாடுகளை மட்டும் அல்லாமல் பலவகை வளர்ப்பு விலங்குகளையும் குறிக்கக்கூடியதால் ‘கால்நடைகள்’ பொருத்தமான பரந்த சொல்.
