translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. ‘குடியிருக்க’ என்பது ישב என்பதன் வசிப்பிடக் கருத்தையும், ‘அந்நியர்களாகத் தங்கியிருந்த’ என்பது מְגוּרִים என்பதிலுள்ள தற்காலிக அந்நியக் குடியிருப்புக் கருத்தையும் காக்கிறது. நீண்ட எபிரேய வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
