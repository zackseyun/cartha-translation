base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/010.yaml
  text: 'These are the names of Esau’s sons: Eliphaz son of Adah[a], Esau’s wife; Reuel son of Basemath[b], Esau’s wife.'
translation:
  language: ta
  text: 'ஏசாவின் மகன்களின் பெயர்கள் இவை: ஏசாவின் மனைவியான ஆதாளின் மகன் எலிப்பாஸ்; ஏசாவின் மனைவியான பஸ்மத்தின் மகன் ரெயுவேல்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת בְּנֵי עֵשָׂו
  choice: ஏசாவின் மகன்களின் பெயர்கள் இவை
  rationale: எபிரெய மொழியின் பட்டியல் அறிமுக அமைப்பையும், בְּנֵי என்பதன் ஆண்பால் பன்மையான ‘மகன்கள்’ என்ற குறிப்பையும் இயல்பான தமிழ் தொடரில் காக்கிறது.
- source_word: אֱלִיפַז
  choice: எலிப்பாஸ்
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் மரபுக்கு ஏற்றவாறு ஒலிபெயர்க்கிறது.
- source_word: בֶּן עָדָה
  choice: ஆதாளின் மகன்
  rationale: בֶּן குறிக்கும் நேரடியான மகன் உறவைத் தெளிவாகக் காட்டுகிறது; עָדָה ‘ஆதாள்’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֵשֶׁת עֵשָׂו
  choice: ஏசாவின் மனைவி
  rationale: எபிரெய இணைப்புத் தொடரை இயல்பான தமிழ் உடைமைத் தொடராக மொழிபெயர்க்கிறது; மூலத்தில் இருமுறை வருவதால் இரு இடங்களிலும் காக்கப்படுகிறது.
- source_word: רְעוּאֵל
  choice: ரெகுவேல்
  rationale: எபிரெய பெயரின் கூறுகளைக் காட்டும் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பு.
- source_word: בֶּן בָּשְׂמַת
  choice: பஸ்மத்தின் மகன்
  rationale: முந்தைய மகன் உறவுடன் ஒரே விதமாக மொழிபெயர்க்கிறது; בָּשְׂמַת ‘பஸ்மத்’ என ஒலிபெயர்க்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. வம்சவரலாற்றுப் பட்டியலின் சுருக்கமான நடையும், ‘ஏசாவின் மனைவி’ என்ற மூலத்தின் திட்டமிட்ட மறுமொழியும் காக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையிலுள்ள [a] குறிப்பு எபிரெய உரையில் ஆதாளுடன் தொடர்புடைய மாற்றுவாசிப்பைச் சுட்டாததால் சேர்க்கப்படவில்லை; [b] கூறும் மறுமொழி நேரடியாக முதன்மை உரையிலேயே பாதுகாக்கப்பட்டுள்ளது.
