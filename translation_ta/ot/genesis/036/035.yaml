revisions:
- from: ஊசாம் இறந்தான். அவனுக்குப் பதிலாகப் பேதாதின் மகன் ஆதாத் அரசாண்டான். அவன் மோவாபின் நாட்டுப்புறத்தில்[a] மீதியானைத் தாக்கியவன்[b]. அவனுடைய நகரத்தின் பெயர் ஆவீத்.
  to: ஹூஷாம் இறந்தான்; அவனுக்குப் பதிலாகப் பேதாதின் மகன் ஆதாத் அரசாண்டான். மோவாபின் நாட்டுப்புறத்தில்[a] மீதியானைத் தாக்கிய[b] ஆதாதின் நகரத்தின் பெயர் ஆவீத்.
  rationale: The revision corrects Husham’s transliteration, integrates the Hebrew participial description directly with Hadad, and refines the participle explanation in the footnote. It retains the source’s ambiguity about whether “Midian” denotes the place/name or its people and retains the broad geographic sense of שְׂדֵה.
