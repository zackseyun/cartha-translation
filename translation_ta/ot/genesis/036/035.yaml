base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/035.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab[b]; and the name of his city was Avith.
translation:
  language: ta
  text: ஹூஷாம் இறந்தான்; அவனுக்குப் பதிலாகப் பேதாதின் மகன் ஆதாத் அரசாண்டான். மோவாபின் நாட்டுப்புறத்தில்[a] மீதியானைத் தாக்கிய[b] ஆதாதின் நகரத்தின் பெயர் ஆவீத்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மோவாபின் வயல்வெளியில்” அல்லது “மோவாபின் பிரதேசத்தில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மீதியானைத் தோற்கடித்த” என்றும் பொருள்கொள்ளலாம். எபிரெய மொழியில் சொல்லுக்குச் சொல், “மீதியானைத் தாக்குபவன்.” “மீதியான்” என்பது இங்கு மீதியானிய மக்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת חֻשָׁם
  choice: ஊசாம் இறந்தான்
  rationale: מות என்பதன் நேரடியான பொருளை மறைமொழியின்றி இயல்பான தமிழில் தருகிறது; חֻשָׁם என்பது ஊசாம் என ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக ... அரசாண்டான்
  rationale: מלך அரசாளுதலையும் תחתיו அரச வாரிசாக அவனுடைய இடத்தை ஏற்றதையும் ஒன்றாகத் தெளிவாகக் காட்டுகிறது.
- source_word: הֲדַד בֶּן בְּדַד
  choice: பேதாதின் மகன் ஆதாத்
  rationale: בן என்பதைக் இயல்பான தமிழ் உறவுமுறையில் தருகிறது; எபிரெய தனிப்பெயர்கள் ஆதாத், பேதாத் என ஒலிபெயர்க்கப்படுகின்றன.
- source_word: הַמַּכֶּה
  choice: தாக்கியவன்
  rationale: נכה வினையின் ஹிஃபில் வினையெச்சம் ஆதாத்தை அவனுடைய குறிப்பிடத்தக்க செயலால் அடையாளப்படுத்துகிறது. ‘தோற்கடித்தவன்’ என்று முடிவைச் சேர்க்காமல், மூலத்தின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: אֶת מִדְיָן
  choice: மீதியானை
  rationale: மூலத்தில் உள்ள மִדְיָן என்ற தனிப்பெயரை நேரடியாகத் தருகிறது; ‘மீதியானியரை’ என்று மக்களினமாக விளக்குவது சாத்தியமான மாற்று என்பதால் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: மோவாபின் நாட்டுப்புறத்தில்
  rationale: שׂדה என்பதற்கு ‘வயல்’ என்ற அடிப்படைப் பொருள் இருந்தாலும், இப்புவியியல் தொடரில் திறந்த வெளி, நாட்டுப்புறம் அல்லது பிரதேசம் எனப் பொருள்படலாம். ‘நாட்டுப்புறம்’ இயல்பான தமிழில் அதன் இடவியல் பரப்பைத் தக்கவைக்கிறது.
- source_word: וְשֵׁם עִירוֹ
  choice: அவனுடைய நகரத்தின் பெயர்
  rationale: எபிரெயப் பெயரறிவிப்பு முறையை தெளிவான, இயல்பான தமிழில் தருகிறது.
- source_word: עֲוִית
  choice: ஆவீத்
  rationale: இடப்பெயரின் எபிரெய ஒலியமைப்பைத் தமிழில் அண்மையாக ஒலிபெயர்க்கிறது.
