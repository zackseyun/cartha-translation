  text: וַ/יִּקַּ֣ח עֵשָׂ֡ו אֶת נָ֠שָׁי/ו וְ/אֶת בָּנָ֣י/ו וְ/אֶת בְּנֹתָי/ו֮ וְ/אֶת כָּל נַפְשׁ֣וֹת בֵּית/וֹ֒ וְ/אֶת מִקְנֵ֣/הוּ וְ/אֶת כָּל בְּהֶמְתּ֗/וֹ וְ/אֵת֙ כָּל קִנְיָנ֔/וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יֵּ֣לֶךְ אֶל אֶ֔רֶץ מִ/פְּנֵ֖י יַעֲקֹ֥ב אָחִֽי/ו־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/006.yaml
  text: And Esau took his wives[a], his sons, his daughters, and all the persons of his household, along with his livestock, all his animals, and all his possessions that he had acquired in the land of Canaan, and went to a land because of his brother Jacob.
translation:
  language: ta
  text: ஏசா தன் மனைவிகளையும் மகன்களையும் மகள்களையும், தன் வீட்டைச் சேர்ந்த அனைவரையும், தன் கால்நடைகளையும் எல்லா விலங்குகளையும், கானான் நாட்டில் தான் சேர்த்திருந்த உடைமைகள் அனைத்தையும் தன்னுடன் எடுத்துக்கொண்டு, தன் சகோதரன் யாக்கோபின் காரணமாக ஒரு நாட்டுக்குச் சென்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஒரு நாட்டுக்கு.” சில கையெழுத்துப் பிரதிகளும் பண்டைய மொழிபெயர்ப்புகளும், “சேயீர் நாட்டுக்கு” என்ற வாசகத்தை ஆதரிக்கின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: தன்னுடன் எடுத்துக்கொண்டு
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’. இடம்பெயரும் இந்தச் சூழலில், குடும்பத்தினரையும் விலங்குகளையும் உடைமைகளையும் தன்னுடன் கொண்டு சென்றதை இயல்பான தமிழில் இது தெரிவிக்கிறது.
- source_word: נָשָׁיו
  choice: தன் மனைவிகள்
  rationale: இங்குள்ள אִשָּׁה என்பதன் பன்மை ஏசாவின் மனைவிகளைக் குறிக்கிறது.
- source_word: בָּנָיו / בְּנֹתָיו
  choice: மகன்கள், மகள்கள்
  rationale: எபிரெய உரை மகன்களையும் மகள்களையும் தனித்தனியாகக் குறிப்பிடுவதால் அந்த வேறுபாடு காக்கப்பட்டுள்ளது.
- source_word: כָּל נַפְשׁוֹת בֵּיתוֹ
  choice: தன் வீட்டைச் சேர்ந்த அனைவரும்
  rationale: נֶפֶשׁ இங்கு ‘ஆத்துமாக்கள்’ என்ற இறையியல் பொருளில் அல்லாமல், வீட்டாராகிய நபர்களைக் குறிக்கும் வழக்குச்சொல்; இயல்பான தமிழில் ‘அனைவரும்’ என வழங்கப்பட்டுள்ளது.
- source_word: מִקְנֵהוּ
  choice: தன் கால்நடைகள்
  rationale: מִקְנֶה பொதுவாக வளர்ப்பு மிருகங்களைக் குறிக்கும்; ‘கால்நடைகள்’ என்பது தெளிவான நவீனத் தமிழ் இணைச்சொல்.
- source_word: כָּל בְּהֶמְתּוֹ
  choice: மற்ற எல்லா விலங்குகள்
  rationale: בְּהֵמָה என்பது பரந்த பொருளில் விலங்குகளைக் குறிக்கிறது. முந்தைய מִקְנֶה என்பதிலிருந்து வேறுபாட்டைத் தெளிவாக்க ‘மற்ற’ சேர்க்கப்பட்டுள்ளது.
- source_word: כָּל קִנְיָנוֹ אֲשֶׁר רָכַשׁ
  choice: தான் சேர்த்திருந்த உடைமைகள் அனைத்தும்
  rationale: קִנְיָן உடைமைகளையும் רכשׁ அவற்றைப் பெற்றுச் சேர்த்ததையும் குறிக்கின்றன; தமிழ் வாக்கியத்தில் இயல்பாக இரண்டும் ஒருங்கிணைக்கப்பட்டுள்ளன.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: கானான் நாட்டில்
  rationale: எபிரெயத்தில் உள்ள புவியியல் வடிவமான ‘கானான் நாடு’ பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֶל אֶרֶץ
  choice: ஒரு நாட்டுக்கு
  rationale: மசோரா உரை குறிப்பிட்ட நாட்டின் பெயரையோ ‘வேறொரு’ என்ற அடைமொழியையோ தராமல் ‘ஒரு நாட்டுக்கு’ என்றே கூறுகிறது; அந்தத் தெளிவின்மை காக்கப்பட்டுள்ளது.
- source_word: מִפְּנֵי יַעֲקֹב אָחִיו
  choice: தன் சகோதரன் யாக்கோபின் காரணமாக
  rationale: מִפְּנֵי இடவியல் பொருளில் ‘முன்னிலையிலிருந்து/விலகி’ என்றும் காரணப் பொருளில் ‘காரணமாக’ என்றும் வரலாம். அடுத்த வசனம் பிரிவிற்கான காரணத்தை விளக்குவதால், காரணப் பொருள் முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டுள்ளது.
theological_decisions:
- issue: מִפְּנֵי என்பதன் இடவியல் அல்லது காரணப் பொருள்
  choice: தன் சகோதரன் யாக்கோபின் காரணமாக
  alternative: தன் சகோதரன் யாக்கோபைவிட்டு விலகி
  rationale: இரு பொருள்களும் மொழியியல் ரீதியில் சாத்தியம். ஆதியாகமம் 36:7 உடனிருந்து வாழ முடியாத சூழலைக் காரணமாகக் கூறுவதால் காரணப் பொருள் இங்கு சூழலுக்கு நன்கு பொருந்துகிறது; இருப்பினும் யாக்கோபிடமிருந்து விலகிச் சென்ற இயக்கமும் உட்பொருளாக உள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதானதாயும் மரியாதைமிக்கதாயும் வடிவமைக்கப்பட்டுள்ளது. பட்டியலின் எபிரெய அமைப்பு பெருமளவு காக்கப்பட்டாலும், தமிழில் இயல்பான தொடருக்காக வினைச்சொல் இறுதியில் வைக்கப்பட்டுள்ளது. உரையில் இல்லாத ‘வேறொரு’ என்ற சொல்லைச் சேர்க்காமல் மூலத்தின் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
