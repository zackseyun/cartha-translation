translation_notes:
  register: சுருக்கமான வம்சப் பட்டியல் நடையைப் பேணியுள்ளோம். தனிப்பெயர்கள் மூல எபிரெய ஒலிவடிவத்திற்கு நெருக்கமாகவும், சாதாரண நவீனத் தமிழ் வாசகருக்கு இயல்பாகவும் எழுத்துப்பெயர்க்கப்பட்டுள்ளன. ஆங்கில எழுத்துமுறை வேறுபாடு தமிழாக்கத்திற்கு பொருத்தமில்லாததால் ‘Timnah’ குறித்த ஆங்கிலக் காலடிக்குறிப்பு சேர்க்கப்படவில்லை.
