base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/022.yaml
  text: The sons of Lotan were Hori and Hemam[b][a], and Lotan’s sister was Timna.
translation:
  language: ta
  text: லோத்தானின் மகன்கள் ஹோரியும் ஹேமாமும் ஆவர்; லோத்தானின் சகோதரி திம்னா.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: இருந்தார்கள் (தமிழில் பெயர்ப்பட்டியல் அமைப்பில் வெளிப்படையாக மொழிபெயர்க்காமல் இயல்பான வாக்கியமாக அமைக்கப்பட்டது)
  rationale: இங்கு היה வினைச்சொல் வம்சப் பட்டியலில் எளிய இணைப்புச் சொல்லாகச் செயல்படுகிறது. தமிழில் ‘மகன்கள் ...’ என்ற பெயர்ப்பட்டியல் வாக்கியம் இயல்பாக இருப்பதால் தனி வினைச்சொல் தேவையில்லை.
- source_word: בְנֵי
  choice: மகன்கள்
  rationale: அடுத்து இரண்டு ஆண் பெயர்கள் வருவதால், பொதுவான ‘பிள்ளைகள்’ என்பதைக் காட்டிலும் ஆண் சந்ததியைக் குறிக்கும் ‘மகன்கள்’ துல்லியமானது.
- source_word: לוֹטָן
  choice: லோத்தான்
  rationale: எபிரெய தனிப்பெயரின் ஒலிவடிவத்தை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: חֹרִי
  choice: ஓரி
  rationale: இது தனிப்பெயர்; எபிரெய ஒலிப்பில் தொடக்க மெய்யான ח தமிழில் துல்லியமாக ஈடுகொடுக்க இயலாததால், வாசிக்க இயல்பான ‘ஓரி’ பயன்படுத்தப்பட்டது.
- source_word: הֵימָם
  choice: ஏமாம்
  rationale: இவ்வசனத்தின் WLC உயிர்க்குறியீட்டுடன் கூடிய வடிவத்தைப் பின்பற்றுகிறது; 1 நாளாகமம் 1:39-இன் இணைப் பட்டியலில் வேறு உயிரொலி வடிவம் உள்ளது என்பதைக் காலடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: וַאֲחוֹת
  choice: சகோதரி
  rationale: பெண் உடன்பிறப்பைக் குறிக்கும் சொல்லை நடுநிலையான, கண்ணியமான நவீனத் தமிழில் ‘சகோதரி’ என வழங்குகிறது.
- source_word: תִּמְנָע
  choice: திம்னா
  rationale: இங்குள்ள எபிரெய தனிப்பெயரின் ஒலிவடிவத்தை நெருக்கமாகப் பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
