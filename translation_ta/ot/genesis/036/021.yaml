base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/021.yaml
  text: and Dishon[a], and Ezer, and Dishan. These are the chiefs of the Horites, the sons of Seir, in the land of Edom.
translation:
  language: ta
  text: திஷோன், ஏசேர், திஷான். இவர்கள் ஏதோம் நாட்டில் இருந்த சேயீரின் மகன்களான ஹோரியரின் தலைவர்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குலத் தலைவர்கள்.”
    reason: எபிரெயச் சொல் சமூக அல்லது குலக் குழுக்களின் தலைவர்களைக் குறிப்பாக உணர்த்தலாம்.
lexical_decisions:
- source_word: דִשׁוֹן
  choice: திஷோன்
  rationale: தனிப்பட்ட பெயரை எபிரெய ஒலிக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: אֵצֶר
  choice: ஏசேர்
  rationale: தனிப்பட்ட பெயரை மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: דִישָׁן
  choice: திஷான்
  rationale: திஷோன் என்ற முந்தைய பெயரிலிருந்து வேறுபாடு தெளிவாக இருக்குமாறு எபிரெய உயிரொலியைப் பேணிய ஒலிபெயர்ப்பு.
- source_word: אַלּוּפֵי
  choice: தலைவர்கள்
  rationale: இச்சூழலில் குலம் அல்லது சமூகக் குழுக்களுக்குத் தலைமை வகிப்பவர்களைக் குறிக்கிறது; பழமையான பட்டப்பெயரைப் பயன்படுத்தாமல் இயல்பான நவீன தமிழில் தரப்பட்டுள்ளது.
- source_word: הַחֹרִי
  choice: ஓரியர்கள்
  rationale: எபிரெயில் ஒருமை வடிவில் இருந்தாலும் இங்கு ஓர் இனக்குழுவைக் கூட்டாகக் குறிப்பதால் தமிழில் பன்மையாக வழங்கப்பட்டுள்ளது.
- source_word: בְּנֵי שֵׂעִיר
  choice: சேயீரின் மக்கள்
  rationale: வம்ச உறவைக் குறிக்கும் எபிரெய மரபுத்தொடர்; தமிழில் ‘மக்கள்’ என்பது நேரடியான உறவையும் வழிவந்தோரையும் உள்ளடக்கும் இயல்பான வடிவம்.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: ஏதோம் நாட்டில்
  rationale: ‘நாடு’ என்ற புவியியல் குறிப்பைப் பேணி, இயல்பான தமிழ் இடவேற்றுமையில் வழங்கப்பட்டுள்ளது.
