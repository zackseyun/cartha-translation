  yaml_path: translation/ot/genesis/036/034.yaml
  text: And Jobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: ta
  text: யோபாப் இறந்தான். அவனுக்குப் பதிலாக, தேமானியரின் நாட்டைச் சேர்ந்த ஊஷாம்[a] அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேமான் நாட்டைச் சேர்ந்த ஊஷாம்” அல்லது “தேமானியனின் நாட்டைச் சேர்ந்த ஊஷாம்.” எபிரெய இனப்பெயர் வடிவம் தேமானோடு தொடர்புடைய நிலப்பகுதியையோ மக்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தான்
  rationale: מות என்பதன் wayyiqtol வடிவம் தொடர்ச்சியாக நிகழ்ந்த எளிய இறந்தகாலச் சம்பவத்தைக் குறிக்கிறது; அரசர் வரிசைப் பதிவில் ‘இறந்தான்’ இயல்பான தமிழ் நடை.
- source_word: יוֹבָב
  choice: யோபாப்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: מלך இங்கு அரசப் பதவியேற்று ஆட்சி செய்ததைக் குறிக்கிறது; ‘அரசாண்டான்’ சுருக்கமாகவும் வரிசைப் பதிவுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: תחת + மூன்றாம் நபர் ஒருமை பின்னொட்டு, முந்தைய அரசரின் இடத்தில் அடுத்தவர் ஆட்சிக்கு வந்ததைச் சுட்டுகிறது.
- source_word: חֻשָׁם
  choice: ஊசாம்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பெயர்ப்பு; தொடக்க ח ஒலி தமிழில் இயல்பாக விடப்பட்டு, நீண்ட u உயிரொலி ‘ஊ’ எனக் குறிக்கப்படுகிறது.
- source_word: מֵאֶרֶץ
  choice: நாட்டைச் சேர்ந்த
  rationale: מן + אֶרֶץ புவியியல் தோற்றம் அல்லது தொடர்பைக் குறிக்கிறது; தமிழில் ஒருவரின் ஊற்றிடத்தை இயல்பாகச் சொல்லும் வடிவம்.
- source_word: הַתֵּימָנִי
  choice: தேமானியரின்
  rationale: இது தேமானோடு தொடர்புடைய இனப்பெயர் வடிவம். ‘நாடு’ என்பதுடன் தமிழில் இயல்பாக இணைவதற்காகப் பன்மை மக்களைக் குறிக்கும் ‘தேமானியரின்’ பயன்படுத்தப்பட்டது; எபிரெய வடிவத்தின் மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
