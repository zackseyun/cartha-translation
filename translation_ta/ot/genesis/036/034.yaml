translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான அரசர் வரிசைப் பதிவு நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர்ச்சியைத் தமிழில் இயல்பாக்க இரண்டு வாக்கியங்களாகப் பிரித்தாலும், நிகழ்வுகளின் வரிசையும் அரசுரிமை மாற்றமும் முழுமையாகப் பாதுகாக்கப்பட்டுள்ளன.
