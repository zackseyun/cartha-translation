  yaml_path: translation/ot/genesis/036/011.yaml
  text: And the sons of Eliphaz were Teman[a], Omar, Zepho, Gatam, and Kenaz.
translation:
  language: ta
  text: எலிப்பாசின் மகன்கள் தேமான், ஓமார், செப்போ[a], கத்தாம், கேனாஸ் ஆகியோர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில மொழிபெயர்ப்புகள் இப்பெயரை ‘செப்பி’ என்று வாசிக்கின்றன (1 நாளாகமம் 1:36-ஐ ஒப்பிடுக). இங்கே மசோரா எபிரெய உரை ‘செப்போ’ என்று உயிர்க்குறியிடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ஆகியோர்
  rationale: வம்சப்பட்டியலில் இந்த வினைச்சொல் மகன்களின் பெயர்களை அறிமுகப்படுத்தும் இணைப்புச் செயல்பாட்டில் வருகிறது. தமிழில் இயல்பான பெயர்ப்பட்டியல் வாக்கியமாக ‘ஆகியோர்’ பயன்படுத்தப்பட்டுள்ளது; ‘ஆனார்கள்’ என்பது நிலைமாற்றம் ஏற்பட்டதாகத் தவறாக உணர்த்தலாம்.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையில் குறிப்பாக ‘மகன்கள்’ என்று பொருள்படுவதால், வம்சப்பட்டியல் சூழலில் அதே பாலினக் குறிப்புடன் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֱלִיפָז
  choice: எலிப்பாசு
  rationale: தனிப்பெயர் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; வேற்றுமை உருபு சேரும்போது ‘எலிப்பாசின்’ என வருகிறது.
- source_word: תֵּימָן
  choice: தேமான்
  rationale: வம்சப்பட்டியலில் தனிப்பெயராக இருப்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אוֹמָר
  choice: ஓமார்
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: צְפוֹ
  choice: செப்போ
  rationale: மசோரா உயிர்க்குறிப்புகளுடன் உள்ள எபிரெய வடிவம் ṣəp̄ô என்பதற்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு. மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: גַעְתָּם
  choice: கத்தாம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை இயல்பாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: קְנַז
  choice: கேனாஸ்
  rationale: எபிரெய தனிப்பெயர் தமிழில் வாசிக்க இயலுமாறு ஒலிபெயர்க்கப்பட்டுள்ளது.
