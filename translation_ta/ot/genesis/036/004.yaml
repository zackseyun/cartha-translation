  text: Adah bore Eliphaz to Esau, and Basemath bore Reuel.
translation:
  language: ta
  text: ஆதாள் ஏசாவுக்கு எலிப்பாஸைப் பெற்றெடுத்தாள்; மற்றும் பஸ்மத் ரெகுவேலைப் பெற்றெடுத்தாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד / יָלְדָה
  choice: பெற்றெடுத்தாள்
  rationale: ילד என்பதன் ‘பெறு/பிள்ளையைப் பெற்றெடு’ என்ற பொருளைத் தாயை எழுவாயாகத் தெளிவாக வைத்தும், வம்சவரலாற்று நடைக்கு ஏற்ற இயல்பான தமிழிலும் தருகிறது.
- source_word: לְעֵשָׂו
  choice: ஏசாவுக்கு
  rationale: ילד உடன் வரும் ל இங்கு தந்தையுடனான உறவைக் குறிக்கிறது; ‘ஏசாவுக்கு’ என்பது கூடுதல் விளக்கமின்றி அந்த உறவை இயல்பாகக் காட்டுகிறது.
- source_word: אֶת
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண அடையாளம்; தமிழில் ‘-ஐ’ வேற்றுமை உருபினால் அதன் பணி வெளிப்படுகிறது.
- source_word: עָדָה
  choice: ஆதாள்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: אֱלִיפָז
  choice: எலிப்பாஸ்
  rationale: மசோரா உரையிலுள்ள எபிரெய தனிப்பெயரைத் தமிழில் வாசிக்க ஏற்றவாறு எழுத்துப்பெயர்க்கிறது.
- source_word: בָשְׂמַת
  choice: பஸ்மத்
  rationale: எபிரெய பெயரின் மெய்யொலி அமைப்பையும் இறுதி ‘த்’ ஒலியையும் நெருக்கமாகப் பேணும் எழுத்துப்பெயர்ப்பு.
- source_word: רְעוּאֵל
  choice: ரெகுவேல்
  rationale: எபிரெய பெயரில் உள்ள ע ஒலியை அளவுக்கு மீறாமல் வெளிப்படுத்தி, உயிரொலி வரிசையையும் பேணும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: וּ
  choice: ;
  rationale: இணைப்புச் சொல் குறிக்கும் இரு இணையான பிறப்பு அறிவிப்புகளின் தொடர்பைத் தமிழில் அரைப்புள்ளி இயல்பாக வெளிப்படுத்துகிறது; இரண்டாவது கூறு தொடர்ச்சியாக வருகிறது.
