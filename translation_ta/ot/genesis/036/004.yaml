translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ்; வம்சவரலாற்றின் சுருக்கமான இணை அமைப்பு பேணப்பட்டுள்ளது. முதல் கூறில் உள்ள ‘ஏசாவுக்கு’ அசல் உரைப்படி வைக்கப்பட்டுள்ளது; இரண்டாவது கூறில் தந்தை மீண்டும் குறிப்பிடப்படாததும் அப்படியே பேணப்பட்டுள்ளது.
