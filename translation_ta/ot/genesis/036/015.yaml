base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/015.yaml
  text: 'These are the chiefs of the sons of Esau: the sons of Eliphaz[a], Esau’s firstborn: Chief Teman, Chief Omar, Chief Zepho[b], Chief Kenaz.'
translation:
  language: ta
  text: 'ஏசாவின் மகன்களின் குலத்தலைவர்கள்[a] இவர்கள்: ஏசாவின் முதற்பேறான எலிப்பாஸின் மகன்களில் குலத்தலைவர் தேமான், குலத்தலைவர் ஓமார், குலத்தலைவர் செப்போ, குலத்தலைவர் கேனாஸ்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குலத்தலைவர்கள்’ என்பதற்கான எபிரெயச் சொல் ஒரு குலத்தின் அல்லது இனக்குழுவின் தலைவர்களைக் குறிக்கலாம்; இதை ‘தலைவர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּפֵי / אַלּוּף
  choice: குலத்தலைவர்கள் / குலத்தலைவர்
  rationale: ஏதோமிய வம்சப் பட்டியலில் இச்சொல் ஒரு குலத்தின் அல்லது இனக்குழுவின் தலைவரைக் குறிக்கிறது. ‘குலத்தலைவர்’ என்பது பட்டப்பெயரின் தன்மையையும் சமூகப் பொறுப்பையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְנֵי
  choice: மக்கள் / மக்களுள்
  rationale: இச்சொல்லின் அடிப்படைப் பொருள் ‘மகன்கள்.’ ஆனால் இங்குள்ள வம்ச மற்றும் குலப் பட்டியல் சூழலில் வழித்தோன்றல்களையும் உள்ளடக்கக்கூடும் என்பதால், இயல்பான தமிழில் அந்த விரிவைத் தாங்கக்கூடிய ‘மக்கள்’ பயன்படுத்தப்பட்டது.
- source_word: בְּכוֹר
  choice: முதற்பேறான
  rationale: பிறப்பு வரிசையையும் அதனோடு தொடர்புடைய சிறப்பு நிலையையும் மேலதிக விளக்கமின்றித் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: אֵלֶּה
  choice: இவர்களே
  rationale: ஆட்களின் பட்டியலை அறிமுகப்படுத்தும் எபிரெயச் சொற்றொடருக்கு இயல்பான தமிழ் வடிவம்.
- source_word: עֵשָׂו
  choice: ஏசா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: אֱלִיפַז
  choice: எலிப்பாஸ்
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் தெளிவாகக் காட்டும் மரபான வடிவம்.
- source_word: תֵּימָן
  choice: தேமான்
  rationale: எபிரெயப் பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: אוֹמָר
  choice: ஓமார்
  rationale: எபிரெயப் பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: צְפוֹ
  choice: செப்போ
  rationale: மசோரா உயிர்க்குறிகளுடன் உள்ள எபிரெயப் பெயரின் ஒலியை அண்மையாகக் காட்டும் தமிழ் வடிவம்.
- source_word: קְנַז
  choice: கேனாஸ்
  rationale: எபிரெயப் பெயரின் தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: பட்டியலின் தொடக்கச் சொற்றொடருக்கும் எலிப்பாசின் மக்களைப் பற்றிய துணைப் பட்டியலுக்கும் இடையிலான தொடர்பு
  choice: முதன்மை அறிமுகத்திற்குப் பின் முக்காற்புள்ளி வைத்து ஒரே வாக்கியத்தில் துணைப் பட்டியலை இணைத்தல்
  alternative: ‘ஏசாவின் மக்களுடைய குலத்தலைவர்கள் இவர்களே.’ என்று தனி வாக்கியமாக முடித்து, அடுத்த பகுதியை பட்டியல் தலைப்பாக அமைத்தல்
  rationale: எபிரெய உரையில் ‘ஏசாவின் மக்கள்’ என்பதற்குப் பின் முக்கிய இடைநிறுத்தம் இருந்தாலும், தொடரும் சொற்றொடர் அதற்கான முதல் துணைப் பட்டியலாக உள்ளது. முக்காற்புள்ளி இரண்டிற்குமான தொடர்பையும் உரையின் பட்டியல் அமைப்பையும் காக்கிறது; தனி விளக்கக் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வம்சப் பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டது. பட்டப்பெயர் ஒவ்வொரு பெயருக்கும் முன் திரும்பக் கூறப்பட்டு, மூல எபிரெய உரையின் மீள்வடிவம் பாதுகாக்கப்பட்டது.
