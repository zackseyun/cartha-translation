base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/039.yaml
  text: Baal-hanan son of Achbor died[a], and Hadar reigned in his place. The name of his city was Pau, and the name of his wife was Mehetabel daughter of Matred[c][b], daughter of Me-zahab.
translation:
  language: ta
  text: அக்போரின் மகன் பாகால்-ஹானான் இறந்தான்; அவனுக்குப் பதிலாக ஹதார்[a] அரசாண்டான். அவனுடைய நகரத்தின் பெயர் பாவு[b]; அவனுடைய மனைவியின் பெயர் மெஹேத்தாபேல். அவள் மத்ரேத்தின் மகள்; மத்ரேத் மே-சஹாபின் மகள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில எபிரெயப் பாடமரபுகளிலும் 1 நாளாகமம் 1:50-லும் இப்பெயர் ‘ஹதாத்’ என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: 1 நாளாகமம் 1:50-ல் இப்பெயர் ‘பாயீ’ என்று உள்ளது.
    reason: textual_variant
  - marker: c
    text: சொல்லுக்குச் சொல், “மத்ரேத்தின் மகள், மே-சஹாபின் மகள்.” எபிரெயில் இரண்டாவது ‘மகள்’ மத்ரேத்தைத் தொடர்கிறது.
    reason: genealogical_ambiguity
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தான்
  rationale: מות என்ற வினையின் நேரடியான பொருளை இயல்பான தமிழில் தருகிறது; தேவையற்ற மங்கலவழக்கைத் தவிர்க்கிறது.
- source_word: בַּעַל חָנָן בֶּן עַכְבּוֹר
  choice: அக்போரின் மகன் பாகால்-ஆனான்
  rationale: தமிழின் இயல்பான உறவுமுறைச் சொல்லமைப்பைப் பின்பற்றி, இரு தனிப்பெயர்களும் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக ... அரசாண்டான்
  rationale: מלך என்பதன் அரசாளுதல் என்ற பொருளையும் תחתיו என்பதன் வாரிசாக இடத்தை ஏற்ற பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: הֲדַר
  choice: ஆதார்
  rationale: கொடுக்கப்பட்ட மசோரா எபிரெய உரையின் Hadar வடிவம் ஒலிபெயர்க்கப்படுகிறது; Hadad என்ற பாடவேறுபாடு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: פָּעוּ
  choice: பாவூ
  rationale: மசோரா உரையின் Pau என்ற இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்படுகிறது; இணைப்பகுதியிலுள்ள Pai வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מְהֵיטַבְאֵל בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: மெகேத்தபேல்; அவள் மத்ரேத்தின் மகள், மே-சாகாபின் மகள்
  rationale: பெயர்களை ஒலிபெயர்த்து, எபிரெய உரையில் இருமுறை வரும் בַּת (‘மகள்’) என்பதையும் காக்கிறது; இரண்டாவது உறவுத்தொடரின் சாத்தியமான இணைப்பை அடிக்குறிப்பு விளக்குகிறது.
