  register: நவீன நிலையான தமிழில், அரசர் பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய முன்னொட்டின் இடப்பொருள் முதன்மை உரையில் பேணப்பட்டு, ஆட்சிப் பரப்பு என்ற சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
