  yaml_path: translation/ot/genesis/036/032.yaml
  text: Bela son of Beor reigned in Edom[a], and the name of his city was Dinhabah.
translation:
  language: ta
  text: பேயோரின் மகன் பேலா ஏதோமில்[a] அரசாண்டான்; அவனுடைய நகரத்தின் பெயர் தின்ஹாபா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏதோமை அரசாண்டான்.’ எபிரெயத்தில் சொல்லுக்குச் சொல், ‘ஏதோமில் அரசாண்டான்’ என்று உள்ளது; இச்சூழலில் அது அவன் ஆட்சி செய்த நாட்டையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: מלך என்ற வினை, அரசர் பட்டியலின் இச்சூழலில் அரசனாக ஆட்சி செய்ததைக் குறிக்கிறது; ‘அரசாண்டான்’ என்பது இயல்பான, சுருக்கமான தமிழ் நடை.
- source_word: בֶּאֱדוֹם
  choice: ஏதோமில்
  rationale: ב என்ற முன்னொட்டு முதன்மையாக இடத்தைக் குறிக்கிறது; எனவே எபிரெய வடிவை நேரடியாகப் பேண ‘ஏதோமில்’ என மொழிபெயர்க்கப்பட்டது. ஆட்சிக்குட்பட்ட பகுதியைக் குறிப்பதாக ‘ஏதோமை’ என்றும் பொருள் கொள்ளலாம்.
- source_word: בֶּלַע
  choice: பேலா
  rationale: தனிநபரின் பெயர்; எபிரெய உச்சரிப்புக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டது.
- source_word: בֶּן בְּעוֹר
  choice: பெயோரின் மகன்
  rationale: எபிரெய மரபுவழி உறவைக் குறிக்கும் கட்டமைப்பு இயல்பான தமிழில் தெளிவாக வழங்கப்பட்டது.
- source_word: וְשֵׁם עִירוֹ
  choice: அவனுடைய நகரத்தின் பெயர்
  rationale: עִירוֹ என்பதில் உள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டு வெளிப்படையாகப் பேணப்பட்டது.
- source_word: דִּנְהָבָה
  choice: தின்காபா
  rationale: இடப்பெயர்; எபிரெய எழுத்தொலியை நெருக்கமாகப் பிரதிபலிக்கும் வகையில் ஒலிபெயர்க்கப்பட்டது.
