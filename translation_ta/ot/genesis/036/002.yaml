reference: Genesis 36:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: עֵשָׂ֛ו לָקַ֥ח אֶת נָשָׁ֖י/ו מִ/בְּנ֣וֹת כְּנָ֑עַן אֶת עָדָ֗ה בַּת אֵילוֹן֙ הַֽ/חִתִּ֔י וְ/אֶת אָהֳלִֽיבָמָה֙ בַּת עֲנָ֔ה בַּת צִבְע֖וֹן הַֽ/חִוִּֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/002.yaml
  text: 'Esau took his wives from the daughters of Canaan: Adah daughter of Elon the Hittite[a], and Oholibamah daughter of Anah, daughter of Zibeon the Hivite.'
translation:
  language: ta
  text: 'ஏசா கானானின் மகள்களிலிருந்து தன் மனைவிகளை எடுத்துக்கொண்டான்: ஏத்தியனான எலோனின் மகள் ஆதாவையும், ஏவியனான சிபெயோனின் மகளான ஆனாவின் மகள் ஒகோலிபாமாவையும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில் ‘ஏவியன்’ என்று உள்ளது. தொடர்புடைய வம்சப்பட்டியல்களுடன் ஒத்திசைக்க முயலும் சிலர், ஆதியாகமம் 36:20 போன்ற பகுதிகளின் அடிப்படையில் வம்ச உறவை வேறுவிதமாகப் புரிந்துகொள்கிறார்கள்; அதில் ‘ஓரியன்’ என்ற அடையாளமும் அடங்கும்.
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח
  choice: எடுத்துக்கொண்டான்
  rationale: எபிரெய வினைச்சொல்லின் அடிப்படைப் பொருளான ‘எடுத்தான்’ என்பதைக் காக்கிறது; இச்சூழலில் ‘மனைவிகளாக எடுத்துக்கொண்டான்’ என்பது இயல்பான தமிழில் திருமண உறவைக் காட்டுகிறது, ஆனால் ‘திருமணம் செய்தான்’ என்று விரிவாகப் பொருள் சேர்ப்பதில்லை.
- source_word: נָשָׁיו
  choice: தன் மனைவிகளாக
  rationale: இங்கு אִשָּׁה என்பதன் பன்மை வடிவம் பொதுவாகப் ‘பெண்கள்’ என்பதல்ல, ஏசாவின் மனைவிகளையே குறிக்கிறது. தமிழில் வாக்கியத்தை இயல்பாக்க வேற்றுமை அமைப்பு மாற்றப்பட்டுள்ளது.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: கானானியப் பெண்களான
  rationale: ‘கானானின் மகள்கள்’ என்ற எபிரெய மரபுத்தொடரின் பொருளை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது; அவர்கள் கானான் மக்களினத்தைச் சேர்ந்த பெண்கள் என்பதைக் குறிக்கிறது.
- source_word: בַּת
  choice: மகள்
  rationale: வம்ச உறவைக் குறிக்கும் எபிரெய இணைப்பை நேரடியாகத் தருகிறது; ஆனா–சிபெயோன் உறவையும் உரையில் உள்ளபடியே பாதுகாக்கிறது.
- source_word: הַחִתִּי
  choice: ஏத்தியன்
  rationale: חִתִּי என்ற இனப்பெயருக்குப் பரவலாகப் பயன்படும் தமிழ் வேதாகமச் சொல்லாக்கம்.
- source_word: אָהֳלִיבָמָה
  choice: ஒகோலிபாமா
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பை நவீனத் தமிழ் எழுத்துப்பெயர்ப்பில் நெருக்கமாக வழங்குகிறது.
- source_word: הַחִוִּי
  choice: ஏவியன்
  rationale: மசோரா எபிரெய உரை חִוִּי, ‘ஏவியன்’ என்றே வாசிக்கிறது. தொடர்புடைய வம்சப்பட்டியல்களால் எழும் பதற்றம் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
theological_decisions:
- issue: இறுதிக் கூறிலுள்ள வம்ச/இன அடையாளம்
  choice: மசோரா உரையைப் பின்பற்றி ‘ஏவியன்’ என்று மொழிபெயர்த்தல்
  alternative: ஆதியாகமம் 36:20 போன்ற தொடர்புடைய வம்சப்பட்டியல்களின் அடிப்படையில் சிலர் ‘ஓரியன்’ என்று வாசிக்கிறார்கள் அல்லது வம்ச உறவை வேறுவிதமாகப் புரிந்துகொள்கிறார்கள்.
  rationale: முதன்மை உரை கிடைக்கப்பெற்ற எபிரெய வாசகத்தைப் பாதுகாக்கிறது; வம்சப்பட்டியல்களிடையேயுள்ள உண்மையான பதற்றத்தை அமைதியாக ஒத்திசைக்காமல் அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய ‘கானானின் மகள்கள்’ என்ற மரபுத்தொடர் இயல்பான தமிழுக்காக ‘கானானியப் பெண்கள்’ என வழங்கப்பட்டுள்ளது. பெயர்கள் மூல எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
