base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/040.yaml
  text: 'And these are the names of the chiefs of Esau[a], according to their clans, according to their places, by their names: Chief Timna, Chief Alvah[b], Chief Jetheth.'
translation:
  language: ta
  text: 'மேலும், ஏசாவின் குலத்தலைவர்களின் பெயர்கள், அவரவர் குலங்களின்படியும் இடங்களின்படியும் பெயர்வாரியாகவும், இவையே: குலத்தலைவர் திம்னா[a], குலத்தலைவர் அல்வா[b], குலத்தலைவர் யெதேத்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: திம்னா என்ற பெயரை ‘திம்னாஹ்’ என்றும் ஒலிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் ‘அல்வா’; 1 நாளாகமம் 1:51-இல் வரும் தொடர்புடைய ‘அலியா’ என்ற வடிவத்துடன் ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவையே
  rationale: וְ என்பது முந்தைய பட்டியலுடன் தொடர்ச்சியைச் சுட்டுகிறது; தமிழில் பட்டியலை இயல்பாக அறிமுகப்படுத்தும் இறுதிப்பகுதி அமைப்பில் ‘இவையே’ அந்தத் தொடர்பையும் வலியுறுத்தலையும் தருகிறது.
- source_word: שְׁמוֹת אַלּוּפֵי עֵשָׂו
  choice: ஏசாவின் குலத்தலைவர்களுடைய பெயர்கள்
  rationale: அடுக்குத்தொடரின் உறவுகளைத் தெளிவான தமிழில் காட்டுகிறது. Genesis 36 சூழலில் אַלּוּף என்பது ஏதோமிய குல அல்லது இனக்குழுத் தலைவரைக் குறிப்பதால் ‘குலத்தலைவர்’ பொருத்தமானது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவரவர் குலங்களின்படியும்
  rationale: מִשְׁפָּחָה இங்கு வீட்டுக் குடும்பத்தைவிட விரிந்த குலப் பிரிவைக் குறிக்கிறது. பன்மையில் உள்ள உடைமைப் பின்னொட்டைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘அவரவர்’ பயன்படுத்தப்பட்டது.
- source_word: לִמְקֹמֹתָם
  choice: இடங்களின்படியும்
  rationale: மָקוֹם என்பதன் நேரடிப் பொருளான ‘இடம்’ பாதுகாக்கப்படுகிறது; ‘குடியிருப்புகள்’ அல்லது ‘பிரதேசங்கள்’ என்று விளக்கி மொழிபெயர்த்து உறுதியற்ற நுட்பத்தைத் தீர்மானிக்கவில்லை.
- source_word: בִּשְׁמֹתָם
  choice: பெயர்களின்படியும்
  rationale: தலைவர்கள் பெயர்வாரியாகப் பட்டியலிடப்படுகிறார்கள் என்ற வகைப்படுத்தும் பொருளை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: אַלּוּף
  choice: குலத்தலைவர்
  rationale: ஒவ்வொரு பெயருக்கும் முன் மீண்டும் வரும் பதவிப்பெயராக ஒரே சீராக மொழிபெயர்க்கப்பட்டது; ‘பிரபு’ போன்ற பிற்கால அரசகுலப் பொருளைத் தவிர்க்கிறது.
- source_word: תִּמְנָע
  choice: திம்னா
  rationale: எபிரெய வடிவின் நவீனத் தமிழ் ஒலிபெயர்ப்பு.
- source_word: עַלְוָה
  choice: அல்வா
  rationale: மசோரா உரையின் עַלְוָה வடிவை நேரடியாக ஒலிபெயர்க்கிறது; 1 நாளாகமம் 1:51-இன் தொடர்புடைய வேறு வடிவத்துடன் ஒத்திசைக்கப்படவில்லை.
- source_word: יְתֵת
  choice: எதேத்
  rationale: எபிரெய יְתֵת என்ற பெயரின் ஒலியைத் தமிழில் இயன்றவரை பிரதிபலிக்கிறது; ஒத்த வேறு பெயர்களோடு கலக்கப்படவில்லை.
