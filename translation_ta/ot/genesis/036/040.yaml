- from: 'ஏசாவின் குலத்தலைவர்களுடைய பெயர்கள், அவரவர் குலங்களின்படியும் இடங்களின்படியும் பெயர்களின்படியும் இவையே: குலத்தலைவர் திம்னா[a], குலத்தலைவர் அல்வா[b], குலத்தலைவர் எதேத்.'
  to: 'மேலும், ஏசாவின் குலத்தலைவர்களின் பெயர்கள், அவரவர் குலங்களின்படியும் இடங்களின்படியும் பெயர்வாரியாகவும், இவையே: குலத்தலைவர் திம்னா[a], குலத்தலைவர் அல்வா[b], குலத்தலைவர் யெதேத்.'
