translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பட்டியல் அமைப்பும் ‘குலங்கள்—இடங்கள்—பெயர்கள்’ என்ற மும்மைத் தொடரும் பாதுகாக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் திம்னாவுக்குரிய [a] குறியீடு தவறாக ‘Esau’ என்பதற்குப் பின் இருந்ததால், குறிப்பின் உண்மையான தொடர்புப்படி தமிழில் ‘திம்னா’ என்பதற்குப் பின் வைக்கப்பட்டது.
