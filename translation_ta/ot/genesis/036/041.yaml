lexical_decisions:
- source_word: אַלּוּף
  choice: குலத்தலைவன்
  rationale: ஆதியாகமம் 36-இன் ஏதோமியச் சூழலில், இந்தச் சொல் ஒரு குலம் அல்லது இனக்குழுவின் தலைவரைக் குறிக்கிறது. ‘குலத்தலைவன்’ என்பது நவீன தமிழில் அந்தப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אָהֳלִיבָמָה
  choice: ஒகோலிபாமா
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பைத் தமிழில் இயன்றவரை நெருக்கமாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: אֵלָה
  choice: ஏலா
  rationale: இங்கு விளக்கச் சொல்லாக அல்லாமல் பெயராக வருவதால், எபிரெயத்திலிருந்து நேரடியாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: פִּינֹן
  choice: பீனோன்
  rationale: எபிரெய மெய்யெழுத்து மற்றும் உயிரொலி அமைப்பைப் பின்பற்றி எழுத்துப்பெயர்க்கப்பட்ட தனிப்பெயர்.
