base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/017.yaml
  text: 'And these are the sons of Reuel[a], the son of Esau: chief Nahath, chief Zerah, chief Shammah, chief Mizzah. These are the chiefs of Reuel in the land of Edom. These are the sons of Basemath, Esau’s wife.'
translation:
  language: ta
  text: 'மேலும், ஏசாவின் மகனான ரெகுவேலின் மகன்கள் இவர்களே: தலைவர்[a] நகாத், தலைவர் சேராக், தலைவர் சம்மா, தலைவர் மிஸ்ஸா. ஏதோம் நாட்டிலுள்ள ரெகுவேலின் தலைவர்கள் இவர்களே. இவர்கள் ஏசாவின் மனைவி பாஸ்மத்தின் மகன்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குலத்தலைவர்’; இங்கு மீண்டும் மீண்டும் வரும் எபிரெயச் சொல் ஏதோமியக் குலம் அல்லது இனக்குழுவின் தலைவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவர்களே
  rationale: அடுத்த வம்சப்பட்டியல் பகுதியை அறிமுகப்படுத்தும் எபிரெயச் சூத்திரத்தை இயல்பான நவீன தமிழில் தருகிறது; முந்தைய உரையோட்டத்துடனான தொடர்பும் தொடர்கிறது.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: பெயரிடப்பட்ட ஆண் சந்ததியினரைக் கூறும் இவ்வம்சப்பட்டியலில் எபிரெயச் சொல்லின் நேரடிப் பொருளைப் பாதுகாக்கிறது.
- source_word: רְעוּאֵל בֶּן עֵשָׂו
  choice: ஏசாவின் மகனான ரெகுவேல்
  rationale: எபிரெய மூலத்திலுள்ள வம்ச உறவைத் தெளிவாகவும் இயல்பான தமிழ் சொல் வரிசையிலும் தருகிறது.
- source_word: אַלּוּף
  choice: தலைவர்
  rationale: ஏதோமியக் குல அல்லது இனக்குழுத் தலைவரைக் குறிக்கும் சொல்லை, தேவையற்ற அரசியல் அல்லது பிரபுத்துவப் பட்டத்தைச் சேர்க்காமல் பொதுவாகவும் கண்ணியமாகவும் மொழிபெயர்க்கிறது.
- source_word: נַחַת
  choice: நகாத்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: זֶרַח
  choice: சேராக்
  rationale: எபிரெயத் தனிப்பெயரின் மெய் மற்றும் உயிரொலிகளைத் தமிழில் நெருக்கமாகக் காட்டுகிறது.
- source_word: שַׁמָּה
  choice: சம்மா
  rationale: எபிரெயத் தனிப்பெயரில் வலியுறும் மெய்யொலியை இரட்டித்துத் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
- source_word: מִזָּה
  choice: மிசா
  rationale: எபிரெயத் தனிப்பெயரைத் தமிழின் ஒலியியல் வரம்புகளுக்குள் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: אֵלֶּה אַלּוּפֵי רְעוּאֵל
  choice: ரெகுவேலின் தலைவர்கள் இவர்களே
  rationale: முந்தைய பட்டியலைச் சுருக்கிக் கூறும் எபிரெய அமைப்பையும் அதன் வலியுறுத்தலையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: ஏதோம் நாட்டிலிருந்த
  rationale: மூலத்தில் வெளிப்படையாக உள்ள ‘நாடு/நிலம்’ என்ற கூறைப் பாதுகாத்து, தலைவர்கள் ஏதோம் நாட்டைச் சேர்ந்தவர்கள் என்ற உறவைத் தெளிவாக்குகிறது.
- source_word: בָשְׂמַת אֵשֶׁת עֵשָׂו
  choice: ஏசாவின் மனைவி பாசெமத்
  rationale: தாய்வழி அடையாளத்தைச் சொல்லும் இணைப்புச் சொற்றொடரைத் தெளிவான தமிழ் வடிவில் தருகிறது.
theological_decisions:
- issue: בְּנֵי என்ற உறவுச்சொல் கடைசி வாக்கியத்தில் நேரடி மகன்களையா விரிந்த சந்ததியையா குறிக்கிறது
  choice: மகன்கள்
  alternative: சந்ததியினர்
  rationale: மூல எபிரெயம் ஒரே சொல்லைப் பயன்படுத்துவதால், வம்சப்பட்டியலின் சாத்தியமான விரிந்த பயன்பாட்டை விளக்கமாகத் தீர்மானிக்காமல் அதன் நேரடி வடிவத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான வம்சப்பட்டியல் நடையைப் பயன்படுத்துகிறது. பெயர்கள் எபிரெய மூலத்திலிருந்து எழுத்துப்பெயர்க்கப்பட்டுள்ளன; ‘தலைவர்’ என்ற சொல்லின் வரலாற்று-குலப் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
