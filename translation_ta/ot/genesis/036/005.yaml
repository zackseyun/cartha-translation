  yaml_path: translation/ot/genesis/036/005.yaml
  text: And Oholibamah bore Jeush, Jalam, and Korah. These are the sons of Esau who were born to him in the land of Canaan.
translation:
  language: ta
  text: ஒகொலிபாமாள் எயூஷையும் யாலாமையும் கோராகையும் பெற்றெடுத்தாள். கானான் நாட்டில் ஏசாவுக்குப் பிறந்த மகன்கள் இவர்களே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָהֳלִיבָמָה
  choice: ஒகொலிபாமாள்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை அணுக்கமாகப் பெயர்த்தெழுதி, பெண்பால் பெயருக்குத் தமிழ் வேற்றுமை வடிவம் இயல்பாக அமைய ‘ள்’ முடிவு பயன்படுத்தப்பட்டது.
- source_word: יָלְדָה
  choice: பெற்றெடுத்தாள்
  rationale: பெண் எழுவாயையும் மகப்பேற்றையும் தெளிவாகக் காட்டும் இயல்பான நவீனத் தமிழ் வினைச்சொல்; வம்சப்பட்டியல் நடைக்கும் ஏற்றது.
- source_word: יעיש
  choice: எயூஷ்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பை அடிப்படையாகக் கொண்ட தமிழ் பெயர்த்தெழுத்து.
- source_word: יַעְלָם
  choice: யாலாம்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பை அணுகும் தமிழ் பெயர்த்தெழுத்து.
- source_word: קֹרַח
  choice: கோராகு
  rationale: எபிரெயத் தனிப்பெயரின் இறுதி மெய்யொலியையும் உயிரொலியையும் இயன்றவரை பிரதிபலிக்கும் தமிழ் பெயர்த்தெழுத்து; வேற்றுமை உருபுடன் ‘கோராகையும்’ என இயல்பாக அமைகிறது.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இங்கு பட்டியலிடப்படுபவர்கள் ஆண் பிள்ளைகள் என்பதால், பாலினத் துல்லியத்துடன் மொழிபெயர்க்கப்பட்டது.
- source_word: עֵשָׂו
  choice: ஏசா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்; உருபேற்கும்போது ‘ஏசாவுக்கு’ என இயல்பாக அமைகிறது.
- source_word: אֲשֶׁר יֻלְּדוּ לוֹ
  choice: ஏசாவுக்குப் பிறந்த
  rationale: எபிரெயச் செயலப்பாட்டு அமைப்பையும் לוֹ என்பதன் உறவையும் சுருக்கமான, இயல்பான தமிழில் காக்கிறது; இக்கூற்றில் தாயை வெளிப்படையாக மீண்டும் சேர்க்கவில்லை.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: கானான் நாட்டில்
  rationale: אֶרֶץ என்ற ‘நாடு/நிலம்’ கூறை வெளிப்படையாகக் காத்து, தமிழில் இயல்பாக வழங்குகிறது.
