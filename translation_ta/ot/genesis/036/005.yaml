  source_fidelity: 'எபிரெய மூலத்தின் இரு வாக்கிய அமைப்பும் துல்லியமாகக் காக்கப்பட்டுள்ளது: ஒகொலிபாமாள் மூன்று மகன்களைப் பெற்றெடுத்தாள்; அவர்கள் கானான் நாட்டில் ஏசாவுக்குப் பிறந்த மகன்கள் எனச் சுருக்கமாகக் கூறப்படுகிறது. יֻלְּדוּ לוֹ என்பதன் செயலப்பாட்டு/உறவியல் நுணுக்கம் ‘ஏசாவுக்குப் பிறந்த’ என்பதில் இயல்பாக வெளிப்படுகிறது; தாயை இரண்டாம் கூற்றில் தேவையின்றி மீண்டும் சேர்க்கவில்லை.'
  naturalness: நவீனத் தமிழில் வம்சப்பட்டியல் நடைக்கு உரிய சுருக்கமும் தெளிவும் உள்ளது. பெயர்ப் பட்டியலிலும் ‘இவர்களே’ என்ற முடிவிலும் நடை இயல்பாக உள்ளது. ‘பெற்றெடுத்தாள்’ இச்சூழலில் தாய்மையைத் தெளிவாகவும் மரியாதையாகவும் தெரிவிக்கிறது.
  terminology: ‘மகன்கள்,’ ‘கானான் நாடு,’ ‘ஏசா’ ஆகியவை பொருளுக்கும் தமிழ் வேதாகமப் பயன்பாட்டுக்கும் ஏற்றவை. ஒகொலிபாமாள், எயூஷ், யாலாம், கோராகு ஆகிய பெயர்த்தெழுத்துகள் ஒரே நடைமுறையில் உள்ளன; கோராகு என்பதன் உருபுடைய வடிவமான ‘கோராகையும்’ பொருத்தமானது.
