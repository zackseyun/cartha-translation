  text: So Esau settled in the hill country of Seir[a]; Esau is Edom.
translation:
  language: ta
  text: அவ்வாறு ஏசா சேயீரின் மலைப்பகுதியில் குடியேறினான்[a]; ஏசாவே ஏதோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சேயீரின் மலைகளில் வாழ்ந்தான்’ அல்லது ‘சேயீர் மலையில் குடியிருந்தான்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: குடியேறினான்
  rationale: ישׁב என்ற வினைச்சொல் இங்கு தொடர்கதை வடிவில் வந்து, ஒரு பகுதியில் நிலையாக வசிக்கத் தொடங்கியதைக் குறிக்கிறது. நவீன தமிழில் ‘குடியேறினான்’ என்பது சூழலுக்கு இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בְּהַר
  choice: மலைப்பகுதியில்
  rationale: הַר என்பது ஒரு தனி மலையையோ மலைநிலப் பிரதேசத்தையோ குறிக்கலாம். சேயீர் இங்கு ஒரு பிரதேசமாகக் கருதப்படுவதால் ‘மலைப்பகுதியில்’ என்பது புவியியல் பொருளை இயல்பாக வெளிப்படுத்துகிறது; மூலத்திலுள்ள மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שֵׂעִיר
  choice: சேயீர்
  rationale: இடப்பெயர்; தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: עֵשָׂו
  choice: ஏசா
  rationale: நபர்பெயர்; தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: הוּא אֱדוֹם
  choice: ஏசாவே ஏதோம்
  rationale: வினைச்சொல் இல்லாத எபிரெய அடையாளப்படுத்தும் வாக்கியத்தை நேரடியாகப் பாதுகாக்கிறது. ‘-வே’ என்பது הוּא தரும் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; விளக்கவுரையாக மாற்றாமல் ஏசாவையும் ஏதோமையும் அடையாளப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் மதிப்புமிக்க நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மலைப்பகுதி’ என்ற இயல்பான புவியியல் சொல் முதன்மை உரையில் பயன்படுத்தப்பட்டு, הַר என்பதன் ஒருமை மற்றும் பிரதேசப் பொருள் சார்ந்த தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
