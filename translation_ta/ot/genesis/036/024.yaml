base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/024.yaml
  text: 'These are the sons of Zibeon: Aiah and Anah[a]. This is the Anah who found the yemim in the wilderness while he was pasturing the donkeys for Zibeon his father.'
translation:
  language: ta
  text: 'சிபியோனின் மகன்கள் இவர்களே: அய்யாவும் அனாவும். இந்த அனாதான் தன் தந்தையாகிய சிபியோனுக்காகக் கழுதைகளை மேய்த்தபோது, வனாந்தரத்தில் யேமீமைக்[a] கண்டான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யேமீம்” என்ற எபிரெயச் சொல்லின் பொருள் உறுதியாகத் தெரியவில்லை. அது “வெந்நீர் ஊற்றுகள்” என்று புரிந்துகொள்ளப்பட்டுள்ளது; சில பழங்கால மற்றும் பிற்கால விளக்கங்களில் “கோவேறு கழுதைகள்” என்றும் கொள்ளப்பட்டுள்ளது. சொற்பொருள் ஆதாரம் முடிவானதாக இல்லாததால், முதன்மை உரையில் எபிரெயச் சொல் அப்படியே எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי צִבְעוֹן
  choice: சிபியோனின் மகன்கள்
  rationale: வம்சப்பட்டியல் சூழலில் ஆண் பிள்ளைகளைக் குறிக்கும் எபிரெயக் கட்டமைப்பை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: אַיָּה
  choice: அய்யா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயன்றவரை பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: עֲנָה
  choice: ஆனா
  rationale: வம்சப்பட்டியல் முழுவதிலும் ஒரேவிதமாகப் பயன்படுத்தத்தக்க எபிரெயத் தனிப்பெயர் எழுத்துப்பெயர்ப்பு.
- source_word: הוּא עֲנָה
  choice: இந்த ஆனாதான்
  rationale: இங்கு குறிப்பிடப்படுகிற குறிப்பிட்ட ஆனாவை அடையாளப்படுத்தும் எபிரெயச் சொற்றொடரின் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מָצָא
  choice: கண்டுபிடித்தான்
  rationale: அறியப்படாத ஒன்றைக் கண்டடைந்த நிகழ்வைக் குறிக்கும் இச்சூழலில் எபிரெய வினையின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הַיֵּמִם
  choice: யேமீம்
  rationale: மிக அரிதான இச்சொல்லின் பொருள் உறுதியாகத் தெரியாததால், சர்ச்சைக்குரிய பொருளை முதன்மை உரையில் திணிக்காமல் எபிரெய வடிவம் எழுத்துப்பெயர்க்கப்படுகிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: குடியிருப்புகளுக்கு வெளியேயுள்ள பாழ்நிலம் அல்லது மேய்ச்சல் நிலத்தைக் குறிக்கும் מִדְבָּר என்பதற்கான தெளிவான, மரியாதைமிக்க தமிழ் இணை.
- source_word: בִּרְעֹתוֹ אֶת הַחֲמֹרִים
  choice: கழுதைகளை மேய்த்துக்கொண்டிருந்தபோது
  rationale: ஒரே நேரத்தில் நடைபெற்ற செயலைக் குறிக்கும் எபிரெய இலக்கணத்தையும், கழுதைகளைப் பராமரித்து மேய்த்த செயற்பாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְצִבְעוֹן אָבִיו
  choice: தன் தகப்பனாகிய சிபியோனுக்காக
  rationale: கழுதைகள் அவன் தகப்பன் சிபியோனுடன் தொடர்புடையவை என்பதையும், ஆனா அவருக்காக அவற்றை மேய்த்தான் என்பதையும் இயல்பாகப் பாதுகாக்கிறது.
