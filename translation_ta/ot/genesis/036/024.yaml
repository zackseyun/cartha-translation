translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்குரிய சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. அரிதான הַיֵּמִם என்பதன் உண்மையான பொருள் தீர்மானிக்கப்படாமல், “யேமீம்” என முதன்மை உரையில் பாதுகாக்கப்பட்டு அடிக்குறிப்பில் முக்கிய மாற்றுப் பொருள்கள் தரப்பட்டுள்ளன.
