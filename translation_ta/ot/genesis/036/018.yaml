  yaml_path: translation/ot/genesis/036/018.yaml
  text: 'And these were the sons of Oholibamah[a], Esau’s wife: chief Jeush, chief Jalam, chief Korah. These were the chiefs of Oholibamah daughter of Anah, Esau’s wife.'
translation:
  language: ta
  text: 'ஏசாவின் மனைவியான ஒகோலிபாமாவின் மகன்கள் இவர்களே: குலத்தலைவன்[a] எயூஷ், குலத்தலைவன் யாலாம், குலத்தலைவன் கோராகு. ஆனாவின் மகளும் ஏசாவின் மனைவியுமான ஒகோலிபாமாவின் குலத்தலைவர்கள் இவர்களே.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தலைவன்.” இங்கு வரும் எபிரெயச் சொல் ஏதோமியக் குழுக்கள் அல்லது குலங்களின் தலைவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இங்கு பெயரிடப்பட்டுள்ள ஆண் பிள்ளைகளைக் குறிக்கும் எபிரெய ஆண்பால் பன்மையை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: אֵשֶׁת עֵשָׂו
  choice: ஏசாவின் மனைவி
  rationale: எபிரெய இணைப்புச் சொற்றொடரை இயல்பான தமிழ் உடைமைத் தொடராக மொழிபெயர்க்கிறது; இரு இடங்களிலும் பொருள் சீராகப் பேணப்படுகிறது.
- source_word: אַלּוּף
  choice: குலத்தலைவன்
  rationale: ஆதியாகமம் 36-இன் ஏதோமியச் சூழலில் ஒரு குழு அல்லது குலத்தின் தலைவரைக் குறிக்கிறது. வெறும் ‘தலைவன்’ என்பதைவிடச் சூழலைத் தெளிவாக்குகிறது; அரச மரபுப்பட்டத்தைத் தவிர்க்கிறது.
- source_word: יְעוּשׁ
  choice: எயூஷ்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீன தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: יַעְלָם
  choice: யாலாம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: קֹרַח
  choice: கோராகு
  rationale: இறுதி எபிரெய மெய்யொலியையும் உள்ளடக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: אֵלֶּה אַלּוּפֵי אָהֳלִיבָמָה
  choice: ஒகோலிபாமாவைச் சேர்ந்த குலத்தலைவர்கள் இவர்களே
  rationale: ‘வழிவந்தவர்கள்’ என்று மூலத்தில் இல்லாத கருத்தைச் சேர்க்காமல், எபிரெய இணைப்புத் தொடரின் உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּת עֲנָה
  choice: ஆனாவின் மகள்
  rationale: எபிரெய இணைப்புத் தொடரின் நேரான, இயல்பான தமிழ் வடிவம்.
