  register: நவீன நிலையான தமிழில், சுருக்கமான வம்சவரலாற்று நடையைப் பேணும் கண்ணியமான மற்றும் எளிதில் புரியும் மொழிநடை. பெயர்களில் எபிரெய மூலத்தின் ஒலியை இயன்றவரை அணுகியுள்ளது.
