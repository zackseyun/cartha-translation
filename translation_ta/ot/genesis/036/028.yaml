  yaml_path: translation/ot/genesis/036/028.yaml
  text: 'These are the sons of Dishan: Uz and Aran.'
translation:
  language: ta
  text: 'தீஷானின் மகன்கள் இவர்களே: ஊஸும் அரானும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவர்களே
  rationale: வம்சவரலாற்றுப் பட்டியலை அறிமுகப்படுத்தும் பன்மைச் சுட்டுப்பெயர். எபிரெய மொழியின் வினையற்ற அறிமுக அமைப்பை இயல்பான தமிழில் வலியுறுத்தலுடன் தருகிறது.
- source_word: בְנֵי
  choice: மகன்கள்
  rationale: இங்கு உடனடியாக இரண்டு ஆண் பெயர்கள் வருவதால், நேரடியான ஆண் பிள்ளைகளைக் குறிக்கும் குறிப்பான சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: דִישָׁן
  choice: தீஷான்
  rationale: தனிப்பட்ட பெயர்; எபிரெய ஒலிப்பை அணுகும் வகையில் எழுத்துப்பெயர்ப்பு செய்யப்பட்டது.
- source_word: עוּץ
  choice: ஊசு
  rationale: தனிப்பட்ட பெயர்; எபிரெய עוּץ என்பதன் நீண்ட உயிரொலியையும் இறுதி மெய்யொலியையும் தமிழில் இயல்பாக அணுகும் வடிவம்.
- source_word: וַאֲרָן
  choice: அரானும்
  rationale: ו என்ற இணைப்பை தமிழ் பட்டியல் அமைப்புக்கு இயல்பான இணைப்பு விகுதியான ‘-உம்’ மூலம் வெளிப்படுத்தி, אֲרָן என்ற பெயரை ‘அரான்’ என எழுத்துப்பெயர்த்தது.
