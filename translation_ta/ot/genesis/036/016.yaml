base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/016.yaml
  text: Chief Korah, chief Gaatham, chief Amalek—these are the chiefs of Eliphaz in the land of Edom; these are the sons of Adah.
translation:
  language: ta
  text: கோரா குலத்தலைவன், காதாம் குலத்தலைவன், அமலேக்கு குலத்தலைவன்—இவர்களே ஏதோம் நாட்டில் எலிப்பாசின் குலத்தலைவர்கள்; இவர்களே ஆதாளின் சந்ததியினர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּף
  choice: குலத்தலைவன்
  rationale: ஏதோமிய வம்சப்பட்டியலில் இச்சொல் ஒரு குலம் அல்லது இனக்குழுவின் தலைவரைக் குறிக்கிறது; நவீனத் தமிழில் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: גַּעְתָּם
  choice: காதாம்
  rationale: எபிரெய மெய்யெழுத்துகளுக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: בְּנֵי עָדָה
  choice: ஆதாளின் வழிவந்தவர்கள்
  rationale: இங்கு பட்டியலிடப்பட்டோர் ஆதாளின் நேரடி மகன்கள் அல்லாமல் அவளுடைய வம்சத்தார் என்பதால், வம்சத் தொடர்பை இயல்பாகவும் துல்லியமாகவும் வெளிப்படுத்துகிறது.
- source_word: אֶרֶץ אֱדוֹם
  choice: ஏதோம் நாடு
  rationale: நிலப்பகுதியைக் குறிக்கும் எபிரெயச் சொற்றொடருக்கு இயல்பான நவீனத் தமிழ் வடிவம்.
