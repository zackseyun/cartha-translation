- from: கோரகு குலத்தலைவன், காதாம் குலத்தலைவன், அமலேக்கு குலத்தலைவன்—இவர்களே ஏதோம் நாட்டில் எலிப்பாசின் குலத்தலைவர்கள்; இவர்களே ஆதாளின் வழிவந்தவர்கள்.
