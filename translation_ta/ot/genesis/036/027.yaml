- source_word: זַעֲוָן
  choice: சாவான்
  rationale: எபிரெயப் பெயரின் வழக்கமான ஒலியமைப்பை இயல்பான தமிழில் தருகிறது; ע தனியே வலியுறுத்தப்படவில்லை.
- source_word: עֲקָן
  choice: அகான்
  rationale: எபிரெயப் பெயரை வாசிக்க இயல்பான தமிழ் வடிவில் ஒலிபெயர்க்கிறது.
