  text: וְ/אֵ֥לֶּה בְנֵֽי עֲנָ֖ה דִּשֹׁ֑ן וְ/אָהֳלִיבָמָ֖ה בַּת עֲנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/025.yaml
  text: 'And these were the sons of Anah: Dishon and Oholibamah daughter of Anah.'
translation:
  language: ta
  text: 'ஆனாவின் மகன்கள் இவர்களே: திஷோனும் ஆனாவின் மகளான ஒகொலிபாமாவும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי
  choice: மகன்கள்
  rationale: எபிரெயச் சொல் வழக்கமாக ‘மகன்கள்’ என்று பொருள்படும்; பட்டியலில் ஒரு பெண் இடம்பெற்றாலும், மூலத்தின் வடிவத்தையும் அதன் உள்ளார்ந்த பதற்றத்தையும் பாதுகாக்கிறது.
- source_word: דִּשֹׁן
  choice: தீசோன்
  rationale: எபிரெயப் பெயரின் ஒலிப்பை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்தது.
- source_word: אָהֳלִיבָמָה
  choice: அகோலிபாமா
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் வழக்கமான வேதாகம எழுத்துப்பெயர்ப்பு முறைக்கு ஏற்ப வழங்குகிறது.
- source_word: בַּת עֲנָה
  choice: ஆனாவின் மகளான
  rationale: உறவைக் குறிக்கும் எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘ஆனாவின் மகன்கள்’ என்ற அறிமுகத்தில் அகோலிபாமா என்னும் மகள் சேர்க்கப்படுதல்
  choice: மூலத்தில் உள்ள ‘மகன்கள்’ என்பதையும் பின்னர் வரும் ‘மகள்’ என்பதையும் அப்படியே பாதுகாத்தல்
  alternative: ‘ஆனாவின் பிள்ளைகள்’ என்று பாலினப் பொதுமைப்படுத்துதல்
  rationale: மூல எபிரெய உரையின் வெளிப்படையான சொல் தேர்வையும் அதிலுள்ள வம்சப்பட்டியல் பதற்றத்தையும் மொழிபெயர்ப்பு மறைக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான வம்சப்பட்டியல் நடையையும் கண்ணியமான வேதாகம மொழிநடையையும் பேணுகிறது.
