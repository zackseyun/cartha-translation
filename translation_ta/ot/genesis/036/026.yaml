lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: இவர்களே
  rationale: இணைப்பிடைச்சொல்லுடன் வரும் சுட்டுப்பெயர் வம்சப்பட்டியலை அறிமுகப்படுத்துகிறது. தமிழில் முந்தைய பட்டியலுடன் தொடர்ச்சியை இயல்பாக உணர்த்த தனியே ‘மற்றும்’ சேர்க்காமல் ‘இவர்களே’ என வழங்கப்பட்டது; எபிரேயத்தின் வினையற்ற வாக்கிய அமைப்பையும் இது இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இது நேரடியாக ‘மகன்கள்’ என்று பொருள்படும் கட்டுநிலை வடிவம்; இங்கு உடனடி ஆண் பிள்ளைகளின் பெயர்கள் பட்டியலிடப்படுவதால் ‘வழித்தோன்றல்கள்’ என்பதைக் காட்டிலும் இதுவே துல்லியம்.
- source_word: דִישָׁן
  choice: தீசான்
  rationale: தனிப்பெயர் மொழிபெயர்க்கப்படாமல், எபிரேய ஒலியமைப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: חֶמְדָּן
  choice: எம்தான்
  rationale: எபிரேய தனிப்பெயரின் ஒலிவடிவத்தைத் தமிழில் இயல்பாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: וְ/אֶשְׁבָּן
  choice: எஷ்பான்
  rationale: தனிப்பெயர் நேரடியாக ஒலிபெயர்க்கப்பட்டது; பெயர்ப் பட்டியலிலுள்ள இணைப்புகள் தமிழின் நிறுத்தக்குறிகள் மூலம் வெளிப்படுத்தப்பட்டுள்ளன.
- source_word: וְ/יִתְרָן
  choice: இத்ரான்
  rationale: எபிரேய יִתְרָן என்பதன் ஒலிக்கு நெருக்கமான தமிழ் வடிவம்.
- source_word: וּ/כְרָן
  choice: கேரான்
  rationale: இறுதிப் பெயர் எபிரேய כְרָן என்பதன் தொடக்க மெய்யை ‘க’ எனத் தெளிவாகப் பிரதிபலிக்கும் வகையில் ஒலிபெயர்க்கப்பட்டது; பட்டியலின் இறுதி இணைப்பு தமிழில் காற்புள்ளி வரிசையால் இயல்பாக வெளிப்படுகிறது.
