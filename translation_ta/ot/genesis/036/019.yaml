source:
  edition: WLC
  text: אֵ֧לֶּה בְנֵי עֵשָׂ֛ו וְ/אֵ֥לֶּה אַלּוּפֵי/הֶ֖ם ה֥וּא אֱדֽוֹם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/019.yaml
  text: These are the sons of Esau[a], and these are their chiefs. He is Edom.
translation:
  language: ta
  text: இவர்களே ஏசாவின் மகன்கள்; இவர்களே அவர்களுடைய குலத்தலைவர்கள்.[a] அவனே ஏதோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களுடைய தலைவர்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் אַלּוּפִים, ஏதோமில் இருந்த குல அல்லது பழங்குடித் தலைவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: இவர்களே
  rationale: வினைச்சொல் இல்லாத எபிரெய மரபுவழிப் பட்டியல் சுருக்கத்தைத் தமிழில் இயல்பாகவும் சுட்டிக்காட்டும் வலியுறுத்தலுடனும் தருகிறது.
- source_word: בְנֵי
  choice: மகன்கள்
  rationale: இங்கு ஆண் வழியினரைப் பட்டியலிடும் சூழல் என்பதால் பொதுவான ‘பிள்ளைகள்’ அல்லது விரிவான ‘வழித்தோன்றல்கள்’ என்பவற்றைவிட ‘மகன்கள்’ துல்லியமானது.
- source_word: עֵשָׂו
  choice: ஏசா
  rationale: தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְאֵלֶּה
  choice: இவர்களே
  rationale: முந்தைய கூறின் இணை அமைப்பை மீண்டும் வழங்குகிறது; தமிழ் நிறுத்தக்குறி அதன் இணைப்பைத் தெளிவாக்குவதால் ‘மற்றும்’ வெளிப்படையாகச் சேர்க்கப்படவில்லை.
- source_word: אַלּוּפֵיהֶם
  choice: அவர்களுடைய குலத்தலைவர்கள்
  rationale: ஆதியாகமம் 36-இல் אַלּוּף என்பது ஏதோமின் குல அல்லது பழங்குடிப் பிரிவுகளுக்குத் தலைமை வகித்தவர்களைக் குறிக்கிறது; ‘குலத்தலைவர்கள்’ அந்தச் சமூக-அரசியல் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הוּא
  choice: அவனே
  rationale: ஒருமை ஆண்பால் சுட்டுப்பெயரைப் பாதுகாத்து, ஏசாவையே மீண்டும் சுட்டும் அடையாளப்படுத்தலை வலியுறுத்துகிறது.
- source_word: אֱדוֹם
  choice: ஏதோம்
  rationale: பெயர் மற்றும் நிலப்பெயர் சார்ந்த designation-இன் வழக்கமான தமிழ் ஒலிபெயர்ப்பு; இங்கு ஏசாவை ஏதோமுடன் அடையாளப்படுத்துகிறது.
theological_decisions:
- issue: ‘அவனே ஏதோம்’ என்ற அடையாளப்படுத்தலின் பொருள்
  choice: எபிரெய உரையின் நேரடியான தனிப்பட்ட அடையாளப்படுத்தலைப் பாதுகாத்தல்
  alternative: ‘அதாவது, ஏதோம்’ அல்லது ‘அவனே ஏதோமியரின் மூதாதை’ என்று விளக்கமாக்குதல்
  rationale: הוּא אֱדוֹם என்பது சுருக்கமானதும் பொருள் செறிந்ததுமான கூற்று. அதை வம்ச அல்லது நிலப்பெயர் விளக்கமாக மட்டும் மாற்றாமல், மூலத்தின் இறையியல் மற்றும் இனவரலாற்றுத் தொடர்பைத் திறந்தவாறே வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான மரபுவழிப் பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘இவர்களே … இவர்களே’ என்பது எபிரெய இணை அமைப்பைப் பாதுகாக்கிறது; ‘அவனே’ என்பது ஏசாவைக் குறிக்கும் ஒருமைச் சுட்டைத் தெளிவாக வைத்திருக்கிறது.
