base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/043.yaml
  text: Chief Magdiel[a], chief Iram. These are the chiefs of Edom according to their settlements in the land of their possession. This is Esau[d][c][b], the father of Edom.
translation:
  language: ta
  text: தலைவர் மக்தியேல்[a], தலைவர் ஈராம். தங்களுக்குச் சொந்தமான நாட்டில் அவர்களுடைய குடியிருப்புகளின்படி, இவர்களே ஏதோமின் தலைவர்கள்.[b] இவரே ஏதோமின் தந்தையான ஏசா.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “குலத் தலைவர்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒரு குலத்தின் அல்லது பழங்குடியின் தலைவரைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவர்கள் உரிமையாகக் கொண்ட நாட்டில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, ஏசா ஏதோமியர்களின் மூதாதை.
    reason: cultural_note
lexical_decisions:
- source_word: אַלּוּף
  choice: தலைவர்
  rationale: ஆதியாகமம் 36-இன் சூழலில் இச்சொல் ஏதோமிய குல அல்லது பழங்குடித் தலைவரைக் குறிக்கிறது. ‘தலைவர்’ என்பது பழமையான அரசப் பட்டத்தைப் புகுத்தாமல், இயல்பாகவும் சுருக்கமாகவும் தலைமைப் பொறுப்பைத் தெரிவிக்கிறது.
- source_word: מַגְדִּיאֵל
  choice: மக்தியேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் அண்மையாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: עִירָם
  choice: ஈராம்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் அண்மையாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: אֵלֶּה אַלּוּפֵי אֱדוֹם
  choice: இவர்களே ஏதோமின் தலைவர்கள்
  rationale: முந்தைய பட்டியலைத் தொகுத்துக் கூறும் சுட்டுப்பெயரையும், אַלּוּף என்பதற்கான ஒரே மாதிரியான மொழிபெயர்ப்பையும் காக்கிறது. ‘-ஏ’ அடையாளப்படுத்தும் வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: לְמֹשְׁבֹתָם
  choice: அவர்களுடைய குடியிருப்புகளின்படி
  rationale: לְ முன்னொட்டு இங்கு செல்லும் திசையை அல்ல, குடியிருப்புகளின் அடிப்படையிலான வகைப்பாட்டைக் குறிக்கிறது.
- source_word: בְּאֶרֶץ אֲחֻזָּתָם
  choice: தங்களுக்குச் சொந்தமான நாட்டில்
  rationale: אֲחֻזָּה என்பது உரிமையாகக் கொண்ட நிலப்பகுதி அல்லது உடைமையைக் குறிக்கிறது. தமிழ் நடையில் இயல்பாக இருக்கும்படி உடைமை உறவு வினையடைத் தொடராக வழங்கப்பட்டுள்ளது.
- source_word: הוּא עֵשָׂו
  choice: ஏசாவே
  rationale: הוּא தரும் முடிவுரையான அடையாளப்படுத்துதலும் வலியுறுத்தலும் ‘ஏசாவே’ என்பதில் காக்கப்படுகின்றன; கடைசியாகக் குறிப்பிடப்பட்ட ஈராமைக் குறிக்கும் சுட்டுப்பெயராகத் தவறாகப் புரிந்துகொள்ளப்படுவதும் தவிர்க்கப்படுகிறது.
- source_word: אֲבִי אֱדוֹם
  choice: ஏதோமின் தந்தை
  rationale: אָב இங்கு இனவழி முன்னோரைக் குறிக்கிறது. ‘தந்தை’ என்ற எபிரெய மரபுத்தொடரைத் தக்கவைத்து, அதன் இனவழிப் பொருளை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: ஏசாவை ஏதோமின் இனமுன்னோராகக் குறிப்பிடும் மரபுவழிப் பட்டம்
  choice: ஏதோமின் தந்தை
  alternative: ஏதோமியர்களின் மூதாதை
  rationale: ‘தந்தை’ என்பது மூலத்தின் אָב என்ற சொல்லையும் அதன் வம்சாவளி மரபுத்தொடரையும் காக்கிறது. இங்கு நேரடித் தந்தை அல்ல, ஏதோமிய மக்களின் இனமுன்னோர் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது; கூடுதல் இறையியல் கருத்து புகுத்தப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் மற்றும் வம்சாவளிக்கேற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தலைவர்’ பொதுவாசகர்களுக்கு இயல்பானதாகவும், மூலச் சொல்லின் குலத் தலைமைப் பொருளை அடிக்குறிப்பில் திறந்தவையாகவும் வைத்திருக்கிறது. இறுதி வாக்கியம் தமிழ் இயல்புக்காக ‘ஏசாவே’ என அமைக்கப்பட்டு, எபிரெயத்தின் அடையாளப்படுத்தும் வலியுறுத்தல் காக்கப்பட்டுள்ளது.
