source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תֹּלְד֥וֹת עֵשָׂ֖ו ה֥וּא אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/001.yaml
  text: These are the generations of Esau (that is[a], Edom).
translation:
  language: ta
  text: இவை ஏசாவின் தலைமுறைகள்; ஏசா என்பவன் ஏதோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவையே
  rationale: வாவ் இணைப்புச்சொல் புதிய பகுதியை அறிமுகப்படுத்துகிறது; தமிழில் தனியாக ‘இப்போது’ அல்லது கட்டாயமான ‘மேலும்’ சேர்க்காமல், இயல்பான தலைப்புத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: תֹּלְדוֹת
  choice: தலைமுறைகள்
  rationale: ஆதியாகமத்தில் மீண்டும் வரும் இலக்கியக் கட்டமைப்புச் சொல்லின் தொடர்ச்சியைப் பேணுகிறது; ‘வரலாறு’ அல்லது ‘சந்ததியினர்’ என்று பொருளை ஒருபுறமாகக் குறுக்கவில்லை.
- source_word: עֵשָׂו
  choice: ஏசா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற தனிப்பெயர் வடிவம்.
- source_word: הוּא
  choice: அவனே
  rationale: எபிரெய உரையின் நேரடியான ‘அவனே/அவன்தான்’ என்ற அடையாளப்படுத்தலைப் பேணி, இதை வெறும் விளக்கக் குறியீடாக மட்டும் மாற்றவில்லை.
- source_word: אֱדוֹם
  choice: ஏதோம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயரெழுத்தாக்கம்; ஏசாவை ஏதோம் என்ற பெயருடன் அடையாளப்படுத்துகிறது.
theological_decisions:
- issue: תֹּלְדוֹת என்ற ஆதியாகமத் தலைப்புச் சொல்லின் மொழிபெயர்ப்பு
  choice: தலைமுறைகள்
  alternative: வரலாறு / சந்ததியினர்
  rationale: இந்தச் சொல் ஒரு வம்சத்தையும் அதனுடன் தொடர்புடைய பதிவையும் குறிக்கக்கூடியது. ‘தலைமுறைகள்’ என்பது அதன் இலக்கியத் தொடரையும் இயல்பான பொருள் விரிவையும் பாதுகாக்கிறது.
- issue: הוּא אֱדוֹם என்பதிலுள்ள அடையாளப்படுத்தல்
  choice: அவனே ஏதோம்
  alternative: அதாவது, ஏதோம்
  rationale: மூலத்தின் சுட்டுப்பெயர் அமைப்பையும் ‘ஏசா = ஏதோம்’ என்ற நேரடியான அடையாளப்படுத்தலையும் பாதுகாக்கிறது; தமிழில் இது ஏதோம் என்ற மக்கள்/நிலப்பெயருடனான தொடர்பையும் திறந்தவாறு வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான வம்சவரலாற்றுத் தலைப்பு. ஆதியாகமம் முழுவதும் வரும் תֹּלְדוֹת சொல்லுக்கு ஒரே மாதிரியான ‘தலைமுறைகள்’ என்ற வடிவத்தைப் பயன்படுத்தும் நோக்கம் கொண்டது; அடிக்குறிப்பு குறியீடு பிரதான உரையில் இடம்பெற்றுள்ளது.
