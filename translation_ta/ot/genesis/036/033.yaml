  yaml_path: translation/ot/genesis/036/033.yaml
  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
translation:
  language: ta
  text: பேலா இறந்தான்; அவனுக்குப் பதிலாகப் போஸ்ராவிலிருந்து வந்த[a] சேராகின் மகன் யோபாப் அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘போஸ்ராவைச் சேர்ந்த.’ எபிரேய முன்னொட்டு அந்த நகரத்திலிருந்து வந்தவர் என்பதையோ அந்த நகரத்தோடு தொடர்புடையவர் என்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת בָּלַע
  choice: பேலா இறந்தான்
  rationale: וַיָּמָת என்பது தொடர் நிகழ்வைக் குறிக்கும் wayyiqtol வடிவம்; வெளிப்படையான எழுவாய் בָּלַע என்பதால் தமிழில் இயல்பாகப் பெயருடன் மொழிபெயர்க்கப்பட்டது.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: இந்த அரசுரிமைத் தொடர்ச்சி சூழலில் מלך என்பது ஒருவன் அரசனாகப் பதவியேற்று ஆட்சி செய்ததைக் குறிக்கிறது; ‘அரசாண்டான்’ இயல்பான, சுருக்கமான தமிழ் வடிவம்.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: முந்தைய அரசனின் இடத்தில் அடுத்தவன் ஆட்சிக்கு வந்த அரசுரிமைத் தொடர்ச்சியைத் தெளிவாகக் காட்டுகிறது.
- source_word: יוֹבָב בֶּן זֶרַח
  choice: சேராகின் மகன் யோபாப்
  rationale: எபிரெயக் கட்டமைப்பு தந்தைவழி அடையாளத்தைக் கொடுக்கிறது; தமிழின் இயல்பான சொல் வரிசையில் வழங்கப்பட்டது.
- source_word: מִבָּצְרָה
  choice: போஸ்ராவைச் சேர்ந்த
  rationale: முன்னொட்டு מִן இங்கு ஊரிலிருந்து வந்தவர் அல்லது அந்த ஊரோடு தொடர்புடையவர் என்ற பொருளைக் கொள்ளலாம்; ‘சேர்ந்த’ என்பது இந்த இரு நெருங்கிய நுட்பங்களையும் இயல்பாக உள்ளடக்குகிறது.
