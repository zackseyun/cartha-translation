  yaml_path: translation/ot/genesis/036/003.yaml
  text: and Basemath[a], the daughter of Ishmael, the sister of Nebaioth.
translation:
  language: ta
  text: இஸ்மவேலின் மகளும் நெபாயோத்தின் சகோதரியுமான பாஸ்மத்தையும்[a] மணந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'பாஸ்மத்: இஸ்மவேலின் மகளும் நெபாயோத்தின் சகோதரியுமாக இங்கே குறிப்பிடப்படுகிறவர் ஆதியாகமம் 28:9-ல் “மகலாத்” என்று அழைக்கப்படுகிறார். ஆதியாகமம் 26:34-ல் ஏசாவின் வேறொரு மனைவியும் “பாஸ்மத்” என்று அழைக்கப்படுகிறார்.'
    reason: இணை வசனங்களில் வரும் பெயர் வேறுபாட்டையும், ஆதியாகமம் 26:34-ல் வரும் வேறொரு பாஸ்மத்தையும் துல்லியமான மேற்கோள்களுடன் விளக்குதல்
lexical_decisions:
- source_word: וְ/אֶת
  choice: -ஐயும்
  rationale: முந்தைய பட்டியலுடன் இந்தப் பெயரை இணைக்கும் וְ என்பதன் சேர்க்கைப் பொருளையும், אֵת என்பதன் நேரடி செயப்படுபொருள் குறியீட்டையும் தமிழின் ‘-ஐயும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּשְׂמַת
  choice: பாஸ்மத்
  rationale: எபிரெய தனிப்பெயரான Basemath என்பதன் ஒலிபெயர்ப்பு.
- source_word: בַּת
  choice: மகள்
  rationale: பெற்றோர் உறவைக் குறிக்கும் எபிரெய இணைநிலைப் பெயர்ச்சொல்; ‘இஸ்மவேலின் மகள்’ என்று இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: יִשְׁמָעֵאל
  choice: இஸ்மவேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவத்தில் தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲחוֹת
  choice: சகோதரி
  rationale: உடன்பிறப்பு உறவைக் குறிக்கும் இணைநிலைப் பெயர்ச்சொல்; பாலினத்தையும் உறவையும் தெளிவாகக் காக்கிறது.
- source_word: נְבָיוֹת
  choice: நெபாயோத்
  rationale: எபிரெய மெய்யெழுத்து மற்றும் உயிரொலிகளை நெருக்கமாகப் பின்பற்றும் ஒலிபெயர்ப்பு.
