translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சவரலாற்றுப் பட்டியலின் சுருக்கத்தையும் கண்ணியமான நடையையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. இந்த வசனம் முந்தைய வினையின் தொடர்ச்சியான செயப்படுபொருள் என்பதால், தமிழில் முழுமையான வாக்கியமாக இயல்புற ‘மணந்தான்’ சேர்க்கப்பட்டுள்ளது; இது சூழலிலிருந்து நிரப்பப்பட்ட வினை.
