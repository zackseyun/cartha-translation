    reason: לִבְנֵי יִשְׂרָאֵל என்பதில் உள்ள לְ முன்னிடைச்சொல் ‘க்கு/காக’ அல்லது அரசாட்சிச் சூழலில் ‘மேல்’ எனப் புரிந்துகொள்ளப்படலாம்; בְּנֵי יִשְׂרָאֵל என்பதன் சொற்சொல் வடிவமும் பதிவு செய்யப்படுகிறது.
