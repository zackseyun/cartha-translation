  text: இஸ்ரவேல் மக்கள்மேல் ஓர் அரசன் அரசாளும் முன்பு, ஏதோம் நாட்டில் அரசாண்ட அரசர்கள் இவர்களே.[a]
  philosophy: optimal-equivalence
