theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் வடிவம்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய சொற்றொடர் சொற்சொல்லாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது ஆண்களை மட்டும் அல்லாமல் இஸ்ரவேல் இனமக்கள் முழுவதையும் குறிக்கும் நிலையான இனப்பெயர்; ஆகவே இயல்பான, பொருள் துல்லியமான வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: לִבְנֵי יִשְׂרָאֵל இல் לְ என்ற முன்னிடைச்சொல்
  choice: இஸ்ரவேல் மக்கள்மேல்
  alternative: இஸ்ரவேல் மக்களுக்காக
  rationale: அரசாளுதல் என்ற சூழலில் ஆட்சிக்குட்பட்ட மக்களைக் குறிப்பது முதன்மையான வாசிப்பு. எனினும் எபிரெய முன்னிடைச்சொல்லின் ‘க்கு/மேல்’ என்ற வடிவத் தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
