lexical_decisions:
- source_word: אַלּוּף
  choice: தலைவன்
  rationale: ஆதியாகமம் 36-இன் ஏதோமியக் குலப்பட்டியல் சூழலில், אַלּוּף என்பது ஒரு குலம் அல்லது பழங்குடிக் குழுவின் தலைவரைக் குறிக்கிறது. ‘தலைவன்’ என்பது சுருக்கமான, இயல்பான நவீனத் தமிழ் சொல்; மூலத்தின் மீளுரைப்பையும் காக்கிறது.
- source_word: קְנַז
  choice: கேனாஸ்
  rationale: இது ஒருவரை அல்லது குலத்தைச் சுட்டும் இயற்பெயர்; பொருள் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிப்புக்கு ஏற்ப எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: תֵּימָן
  choice: தேமான்
  rationale: இங்கு ஏதோமியத் தலைவரின் அல்லது குலத்தின் பெயராக வருகிறது; சொல்லின் ‘தெற்கு’ சார்ந்த வேர்ப்பொருள் மொழிபெயர்க்கப்படாமல் பெயராக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: מִבְצָר
  choice: மிப்சார்
  rationale: இது இயற்பெயர். எபிரெய மெய்யெழுத்தும் உயிர்க்குறிப்பும் பிரதிபலிக்குமாறு ‘மிப்சார்’ என எழுத்துப்பெயர்க்கப்பட்டது; அதன் பொதுப்பொருள் இங்கு மொழிபெயர்க்கப்படவில்லை.
