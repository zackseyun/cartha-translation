  yaml_path: translation/ot/genesis/036/036.yaml
  text: And Hadad died[a], and Samlah from Masrekah reigned in his place.
translation:
  language: ta
  text: ஹதாத் இறந்தான். அவனுக்குப் பதிலாக மஸ்ரேக்காவிலிருந்து வந்த சம்லா[a] அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மஸ்ரேக்காவைச் சேர்ந்த சம்லா.” எபிரெய முன்னொட்டு ஒருவர் ஓர் இடத்திலிருந்து வந்தவர் என்பதையோ அந்த இடத்துடன் தொடர்புடையவர் என்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தான்
  rationale: מות என்பதன் தொடர்நிகழ்வைக் குறிக்கும் வடிவம்; அரசர்களின் வாரிசுரிமைப் பட்டியலில் அடுத்த நிகழ்வை இயல்பாகக் கூறுகிறது.
- source_word: הֲדָד
  choice: அதாத்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயன்றவரை அண்மையாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: מלך இங்கு அரசனாக ஆட்சி செய்வதைக் குறிக்கிறது; தொடரும் அரசுரிமைச் சூத்திரத்திற்கு இயல்பான, சுருக்கமான தமிழாக்கம்.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: תחתיו இங்கு ஒருவரின் இடத்தை மற்றொருவர் ஏற்று ஆட்சி செய்வதைக் குறிக்கிறது; வெறும் கால வரிசையைவிட மாற்றீடு மற்றும் வாரிசுரிமை உணர்வைப் பாதுகாக்கிறது.
- source_word: שַׂמְלָה
  choice: சம்லா
  rationale: எபிரெயத் தனிப்பெயரின் எழுத்துப்பெயர்ப்பு.
- source_word: מִמַּשְׂרֵקָה
  choice: மஸ்ரேக்காவிலிருந்து வந்த
  rationale: முன்னொட்டு מִן பொதுவாக ஓர் இடத்திலிருந்து வந்ததையோ அந்த இடத்துடனான தொடர்பையோ குறிக்கலாம்; முதன்மை உரை தோற்றிடப் பொருளை இயல்பான தமிழில் தருகிறது.
