source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר שָׂרָ֔ה צְחֹ֕ק עָ֥שָׂה לִ֖/י אֱלֹהִ֑ים כָּל הַ/שֹּׁמֵ֖עַ יִֽצְחַק לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/006.yaml
  text: And Sarah said[a], “God has made laughter for me; everyone who hears will laugh with me.”
translation:
  language: ta
  text: 'சாரா சொன்னாள்: “கடவுள் எனக்குச் சிரிப்பை உண்டாக்கியிருக்கிறார்; இதைக் கேட்கிற ஒவ்வொருவரும் என்னுடன் சேர்ந்து சிரிப்பார்கள்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைப் பார்த்துச் சிரிப்பார்கள்”; அல்லது, “எனக்காகச் சிரிப்பார்கள்.” எபிரெயத் தொடர் இவ்வாறு பல நுண்பொருள்களை அனுமதிக்கிறது; இச்சூழலில் சாராவுடன் மகிழ்ச்சியைப் பகிர்ந்துகொள்வதே பெரும்பாலும் கருதப்படும் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: சொன்னாள்
  rationale: வாவ் தொடர்கதை அமைப்பைத் தமிழில் தனியாக ‘அப்போது’ அல்லது ‘மேலும்’ என்று வெளிப்படுத்தாமல், இயல்பான கதைநடையில் வினையால் எடுத்துரைக்கிறது.
- source_word: שָׂרָה
  choice: சாரா
  rationale: எபிரெயத் தனிப்பெயரின் நவீனத் தமிழ் ஒலிபெயர்ப்பு.
- source_word: צְחֹק
  choice: சிரிப்பு
  rationale: பெயர்ச்சொல் வடிவத்தைப் பாதுகாப்பதுடன், பின்னரும் வரும் அதே வேர் சார்ந்த יִצְחַק என்பதோடும் உள்ள சொல்விளையாட்டைத் தமிழிலும் இயன்றவரை காக்கிறது.
- source_word: עָשָׂה לִי
  choice: எனக்குச் ... உண்டாக்கியிருக்கிறார்
  rationale: ‘எனக்காகச் செய்தார்’ என்ற எபிரெயக் கட்டமைப்பின் பொருளை இயல்பான தமிழில் தருகிறது; நிகழ்ந்த செயலின் தற்போதைய விளைவை நிறைவுவினை உணர்த்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு சாராவுக்காகச் செயல்படும் ஒரே கடவுளைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: כָּל הַשֹּׁמֵעַ
  choice: இதைக் கேட்கிற ஒவ்வொருவரும்
  rationale: எபிரெயத்தில் ஒருமை வடிவிலுள்ள பொதுப்பொருளைத் தமிழில் பகிர்மானமாகத் தருகிறது; கேட்கப்படுவது குழந்தைப் பிறப்புச் செய்தி என்பது சூழலில் தெளிவாக இருப்பதால் ‘இதை’ இயல்பாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: יִצְחַק
  choice: சிரிப்பார்கள்
  rationale: צְחֹק என்பதோடு உள்ள ஒரே வேர் சார்ந்த சொல்விளையாட்டைத் தக்கவைக்க ‘மகிழ்வார்கள்’ என்பதற்குப் பதிலாக ‘சிரிப்பார்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לִי
  choice: என்னுடன் சேர்ந்து
  rationale: சூழலின் மகிழ்ச்சியில் சாராவோடு பங்குகொள்ளும் சிரிப்பே பெரும்பாலும் கருதப்பட்டாலும், பிற சாத்தியங்களை அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: יִצְחַק לִי என்ற இறுதித் தொடரின் பொருள்
  choice: 'பகிர்ந்துகொள்ளும் மகிழ்ச்சிச் சிரிப்பு: ‘என்னுடன் சேர்ந்து சிரிப்பார்கள்’'
  alternative: ‘என்னைப் பார்த்துச் சிரிப்பார்கள்’ அல்லது ‘எனக்காகச் சிரிப்பார்கள்’
  rationale: ஈசாக்கின் பிறப்பைக் குறித்து சாரா மகிழும் சூழலும், கடவுள் தனக்குச் சிரிப்பை உண்டாக்கினார் என்ற முந்தைய கூற்றும், உடன் மகிழ்ந்து சிரிக்கும் பொருளை ஆதரிக்கின்றன. ஆயினும் לִי என்பதன் உறவு பல நுண்பொருள்களுக்கு இடமளிப்பதால் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன, தெளிவான, மரியாதைமிக்க உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சிரிப்பு—சிரிப்பார்கள்’ என்ற மீளுரை எபிரெய மூலத்தின் சொல்விளையாட்டைப் பாதுகாக்கிறது; இறுதித் தொடரின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
