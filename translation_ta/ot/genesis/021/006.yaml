  source_fidelity: 'மூல எபிரெயத்தின் முக்கிய கூறுகள் துல்லியமாகத் தரப்பட்டுள்ளன: சாராவின் கூற்று, ‘சிரிப்பு’ என்ற பெயர்ச்சொல், கடவுள் செய்த செயல், அனைவரையும் குறிக்கும் கேட்போர், மற்றும் இறுதியிலுள்ள சிரிப்பு-சொல்விளையாட்டு. ‘என்னுடன் சேர்ந்து சிரிப்பார்கள்’ என்பது சூழலுக்கேற்ற முதன்மைப் பொருளைத் தருகிறது; לִי என்பதன் மற்ற சாத்தியங்களும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.'
  naturalness: உரை நவீனத் தமிழில் தெளிவாகவும் மரியாதைமிக்கதாகவும் உள்ளது. ‘சிரிப்பை உண்டாக்கியிருக்கிறார்’ சற்றே நேரடியான அமைப்பாக இருந்தாலும் இயல்பாகப் புரிகிறது; மூலத்தின் ‘செய்தார்’ என்னும் வெளிப்பாட்டையும் நன்றாகப் பிரதிபலிக்கிறது. ‘இதைக் கேட்கிற ஒவ்வொருவரும்’ சூழலால் குறிக்கப்படும் செய்தியைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
