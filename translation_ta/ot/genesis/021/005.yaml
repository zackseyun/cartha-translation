translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குத் தெளிவானதும் கண்ணியமானதும் ஆன நடை. எபிரெயச் சொற்றொடரின் தகவல் வரிசை பெரும்பாலும் காக்கப்பட்டாலும், இயல்பான தமிழுக்காக வாக்கிய அமைப்பு மாற்றப்பட்டுள்ளது.
