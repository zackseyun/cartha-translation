  yaml_path: translation/ot/genesis/021/005.yaml
  text: And Abraham was a hundred years old when Isaac his son was born to him[a].
translation:
  language: ta
  text: ஆபிரகாமுக்கு நூறு வயதாயிருந்தபோது, அவருடைய மகன் ஈசாக்கு பிறந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: ஆபிரகாமுக்கு
  rationale: வசனம் முந்தைய நிகழ்வுடன் தொடர்வதைத் தமிழில் இயல்பான வாக்கிய அமைப்பின் மூலம் உணர்த்துகிறது; וְ என்பதற்குத் தனியாக ‘மற்றும்’ என்று மொழிபெயர்ப்பது இங்கு இயல்பற்றதாக இருக்கும்.
- source_word: בֶּן מְאַת שָׁנָה
  choice: நூறு வயது
  rationale: ‘நூறு ஆண்டுகளின் மகன்’ என்ற எபிரெய வயதுக் குறிப்பு மரபுத்தொடருக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: בְּ/הִוָּלֶד
  choice: பிறந்தபோது
  rationale: בְ உடன் வரும் ילד வினையின் நிஃபால் வினையெச்ச வடிவம் காலச் சூழலையும் செயப்பாட்டு உணர்வையும் குறிக்கிறது; ‘பிறந்தபோது’ இரண்டையும் இயல்பாகத் தருகிறது.
- source_word: ל֔/וֹ
  choice: ஆபிரகாமுக்கு
  rationale: மகன் யாருக்குப் பிறந்தார் என்பதைத் தெளிவாகக் காட்டுகிறது; தமிழில் ‘அவருக்கு’ என்பதால் ஏற்படக்கூடிய அருகிலுள்ள பெயர்ச்சொல் சார்ந்த குழப்பத்தைத் தவிர்க்கிறது.
- source_word: אֵת יִצְחָק
  choice: ஈசாக்கு
  rationale: אֵת என்பது நேரடி செயப்படுபொருள் குறியீடு என்பதால் தனியே மொழிபெயர்க்கப்படவில்லை; יִצְחָק என்ற பெயர் தமிழில் வழக்கமான வடிவில் தரப்படுகிறது.
- source_word: בְּנֽ/וֹ
  choice: அவருடைய மகன்
  rationale: ஈசாக்கு ஆபிரகாமின் மகன் என்பதைச் சுட்டும் உடைமைத் தொடர்பை, எபிரெய மூலத்தின் உடனிலை அமைப்புக்கு இணையாகப் பாதுகாக்கிறது.
