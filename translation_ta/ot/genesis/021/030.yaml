language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר כִּ֚י אֶת שֶׁ֣בַע כְּבָשֹׂ֔ת תִּקַּ֖ח מִ/יָּדִ֑/י בַּ/עֲבוּר֙ תִּֽהְיֶה לִּ֣/י לְ/עֵדָ֔ה כִּ֥י חָפַ֖רְתִּי אֶת הַ/בְּאֵ֥ר הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/030.yaml
  text: And he said[a], “You are to take these seven ewe lambs from my hand, so that it may serve as a witness for me that I dug this well.”
translation:
  language: ta
  text: அவர், “இந்த ஏழு பெண் ஆட்டுக்குட்டிகளையும் என் கையிலிருந்து நீ பெற்றுக்கொள்ள வேண்டும்; இந்தக் கிணற்றை நான் தோண்டினேன் என்பதற்கு அது எனக்குச் சாட்சியாக இருக்கும்படி” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவர் … என்றார்
  rationale: வழக்கமான எபிரெயக் கதைநடைத் தொடர்ச்சியை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: כִּי אֶת שֶׁבַע כְּבָשֹׂת תִּקַּח
  choice: இந்த ஏழு பெண் ஆட்டுக்குட்டிகளையும் … நீ பெற்றுக்கொள்ள வேண்டும்
  rationale: כְּבָשֹׂת பெண்பால் ஆட்டுக்குட்டிகளைக் குறிக்கிறது; תִּקַּח இங்கு எதிர்பார்க்கப்படும் அல்லது அறிவுறுத்தப்படும் ஏற்றுக்கொள்ளுதலைக் குறிக்கிறது. சூழலில் அவை முன்னிலையில் இருப்பதால் ‘இந்த’ இயல்பாக உள்ளது.
- source_word: מִיָּדִי
  choice: என் கையிலிருந்து
  rationale: உரிமை மாற்றத்தின் நேரடியான உருவகத்தைத் தக்கவைக்க எபிரெய மொழிமரபைச் சொற்சார்பாகப் பாதுகாக்கிறது.
- source_word: בַּעֲבוּר תִּהְיֶה לִּי לְעֵדָה
  choice: அது எனக்குச் சாட்சியாக இருக்கும்
  rationale: நோக்கத்தைக் குறிக்கும் בַּעֲבוּר என்பதையும், பெண்பால் ஒருமை வினையான תִּהְיֶה என்பதையும் தக்கவைக்கிறது. ‘அது’ என்பது ஆட்டுக்குட்டிகளை ஏற்றுக்கொள்ளும் ஏற்பாட்டை ஒருமையாகச் சுட்டுகிறது.
- source_word: כִּי חָפַרְתִּי
  choice: நான்தான் தோண்டினேன் என்பதற்கு
  rationale: இரண்டாவது כִּי சாட்சியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; ‘நான்தான்’ என்பது உரிமைக் கோரிக்கையில் உள்ள செய்பவரின் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַבְּאֵר הַזֹּאת
  choice: இந்தக் கிணற்றை
  rationale: சுட்டுப்பெயருடன் கூடிய பெயர்ச்சொல்லைத் தெளிவாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: சாட்சியாக இருப்பதன் ஒருமை அல்லது பன்மை
  choice: ‘அது’—ஆட்டுக்குட்டிகளை ஏற்றுக்கொள்ளும் செயல் அல்லது மொத்த ஏற்பாட்டை ஒருமையாகக் கருதுதல்
  alternative: ‘அவை’—ஏழு பெண் ஆட்டுக்குட்டிகளையே பன்மைச் சாட்சியாகக் கருதுதல்
  rationale: எபிரெய வினை பெண்பால் ஒருமையில் உள்ளது; இருப்பினும் உடனடி குறிப்பிடுபொருள் பன்மையான ஏழு பெண் ஆட்டுக்குட்டிகள். முதன்மை உரை இலக்கண ஒருமையைப் பேணுகிறது; உண்மையான பொருள் ambiguity அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; மரியாதையும் கதைநடை இயல்பும் பேணப்பட்டுள்ளன. ‘பெண் ஆட்டுக்குட்டிகள்’ மூலத்தின் பாலினத் துல்லியத்தைத் தருகிறது; ‘என் கையிலிருந்து’ உடன்படிக்கைச் சூழலிலுள்ள நேரடி ஒப்படைப்பு உருவகத்தைப் பாதுகாக்கிறது.
