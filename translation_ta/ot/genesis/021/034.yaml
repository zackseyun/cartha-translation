lexical_decisions:
- source_word: וַיָּגָר
  choice: அந்நியராகக் குடியிருந்தார்
  rationale: גור என்பது வெறுமனே தங்குவதைக் காட்டிலும், ஒருவருக்குச் சொந்தமல்லாத இடத்தில் அந்நியராக வசிப்பதை வலியுறுத்தக்கூடும். இச்சூழலில் அந்த நுண்பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּאֶרֶץ
  choice: நாட்டில்
  rationale: אֶרֶץ இங்கு ஒரு மக்கள் குழுவின் நிலப்பகுதியைக் குறிக்கிறது; ‘நாடு’ என்பது தெளிவான, இயல்பான தமிழாக்கம்.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்
  rationale: மக்கள் குழுவின் பெயருக்கான வழக்கமான தமிழ் வடிவம்; உடைமைத் தொடர்பில் ‘பெலிஸ்தியரின் நாடு’ என இயல்பாக அமைகிறது.
- source_word: יָמִים רַבִּים
  choice: பல நாட்கள்
  rationale: எபிரெயச் சொற்றொடரின் வடிவத்தையும் கால நீட்சியையும் நேரடியாகவும் இயல்பாகவும் பாதுகாக்கிறது.
- source_word: וַ
  choice: மேலும் தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: தொடர்ச்சியான எபிரெயக் கதைநடையின் waw-ஐ இத்தனி வசனத்தில் ‘அப்போது’ என்று காலப்பொருள் சேர்க்காமல், தமிழ் வாக்கியத் தொடரில் இயல்பாக உட்பொருளாக்குவது சிறந்தது.
