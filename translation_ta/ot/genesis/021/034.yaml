  register: நவீனத் தரத் தமிழில் கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘அந்நியராகக் குடியிருந்தார்’ என்பது மூல வினைச்சொல்லின் சமூக-சட்ட நுண்பொருளைப் பாதுகாக்கிறது; எளிய மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
