translation:
  language: ta
  text: அதனால் அவர் அந்த இடத்திற்குப் “பெயர்செபா” என்று பெயரிட்டார்; ஏனெனில் அங்கே அவர்கள் இருவரும் ஆணையிட்டுக்கொண்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: அதனால்
  rationale: பெயரிடப்பட்டதற்கான காரணவிளைவை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: קָרָא לַמָּקוֹם הַהוּא
  choice: அவர் அந்த இடத்துக்கு ... என்று பெயரிட்டார்
  rationale: எபிரெய வினை ‘அழைத்தார்/பெயரிட்டார்’ எனப் பொருள்படும்; இடப்பெயர் சூட்டும் சூழலில் ‘பெயரிட்டார்’ தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. ‘அந்த’ என்பது הַהוּא என்பதன் சுட்டுப்பொருளைப் பேணுகிறது.
- source_word: בְּאֵר שָׁבַע
  choice: பெயர்செபா
  rationale: இடப்பெயரைத் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவில் தருகிறது; அதன் ‘கிணறு/ஏழு/ஆணை’ சொல்லாட்டம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: כִּי שָׁם
  choice: ஏனெனில் அங்கே
  rationale: பெயருக்கான காரணத்தையும் இடத்தையும் நேரடியாகப் பேணுகிறது.
- source_word: נִשְׁבְּעוּ
  choice: ஆணையிட்டுக்கொண்டார்கள்
  rationale: நிபால் வடிவின் பரஸ்பரச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இரு தரப்பினரும் ஒருவருக்கொருவர் ஆணையிட்ட உடன்பாட்டு நிகழ்வைச் சுட்டுகிறது.
- source_word: שְׁנֵיהֶם
  choice: அவர்கள் இருவரும்
  rationale: எபிரெயிலுள்ள இருவர் என்ற வலியுறுத்தலைத் தெளிவாகப் பேணுகிறது.
