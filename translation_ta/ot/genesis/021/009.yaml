id: GEN.21.9
reference: Genesis 21:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/תֵּ֨רֶא שָׂרָ֜ה אֶֽת בֶּן הָגָ֧ר הַ/מִּצְרִ֛ית אֲשֶׁר יָלְדָ֥ה לְ/אַבְרָהָ֖ם מְצַחֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/009.yaml
  text: And Sarah saw the son of Hagar the Egyptian[a], whom she had borne to Abraham, mocking.
translation:
  language: ta
  text: எகிப்தியப் பெண்ணான ஆகார் ஆபிரகாமுக்குப் பெற்றெடுத்த மகன் சிரித்துக்கொண்டிருப்பதைச்[a] சாராள் கண்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேலி செய்துகொண்டிருப்பதை,” அல்லது “விளையாடிக்கொண்டிருப்பதை.” எபிரெயச் சொல் சிரித்தல், விளையாட்டாக நடந்துகொள்ளுதல், அல்லது சூழலின்படி கேலி செய்தல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: சாராள் கண்டாள்
  rationale: ראה என்பதன் தொடர்கதை வடிவம் அடுத்த நிகழ்வை எளிமையாக எடுத்துரைக்கிறது. தமிழின் இயல்பான வாக்கிய அமைப்புக்காக எழுவாயும் வினையும் வாக்கிய இறுதியில் வைக்கப்பட்டுள்ளன.
- source_word: בֶּן הָגָר הַמִּצְרִית
  choice: எகிப்தியப் பெண்ணான ஆகார் ... பெற்றெடுத்த மகன்
  rationale: எபிரெயக் கட்டமைப்பு மகனை அவனுடைய தாயாகிய ஆகார் வழியாக அடையாளப்படுத்துகிறது; הַמִּצְרִית என்ற பெண்பால் இனப்பெயரைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲשֶׁר יָלְדָה לְאַבְרָהָם
  choice: ஆகார் ஆபிரகாமுக்குப் பெற்றெடுத்த
  rationale: பெண்பால் வினை வடிவம் பெற்றெடுத்தவர் ஆகார் என்பதைத் தெளிவாக்குகிறது. לְ இங்கு தந்தையான ஆபிரகாமுடனான உறவை இயல்பான தமிழில் ‘ஆபிரகாமுக்குப்’ எனக் காட்டுகிறது.
- source_word: מְצַחֵק
  choice: சிரித்துக்கொண்டிருப்பதை
  rationale: צחק என்பதன் பங்கேற்பு வடிவம் அடிப்படையில் சிரித்தல், விளையாடுதல், அல்லது சூழலின்படி கேலிசெய்தல் ஆகிய நுணுக்கங்களைக் கொள்ளலாம். நேரடி பொருளை முதன்மை உரையில் வைத்துப் பகைமையான நுணுக்கத்தைத் திணிக்காமல், மாற்றுப் பொருள்களை அடிக்குறிப்பில் தருகிறது.
theological_decisions:
- issue: מְצַחֵק என்பதில் இஸ்மவேலின் செயலுக்குரிய நுணுக்கம்
  choice: முதன்மை உரையில் நடுநிலையாக ‘சிரித்துக்கொண்டிருப்பதை’
  alternative: ‘கேலிசெய்துகொண்டிருப்பதை’ அல்லது ‘விளையாடிக்கொண்டிருப்பதை’
  rationale: இந்த எபிரெயப் பங்கேற்புக்கு வெளிப்படையான செயப்படுபொருள் இல்லை; செயல் பகைமையானது என்று சொல் வடிவமே கட்டாயப்படுத்துவதில்லை. ஆகவே உண்மையான பொருள் மயக்கத்தை முதன்மை உரை தீர்த்துவிடாமல் பாதுகாக்கிறது; சூழலுக்குரிய மாற்று வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தகவல் வரிசை தமிழுக்கேற்ற உறவெச்ச அமைப்பாக மாற்றப்பட்டாலும், ஆகார் எகிப்தியப் பெண் என்பதும், அவர் ஆபிரகாமுக்குப் பெற்றெடுத்த மகன் என்பதும் முழுமையாகப் பாதுகாக்கப்பட்டுள்ளன.
