    rationale: In formal modern Tamil, when “சிரித்துக்கொண்டிருப்பதை” is immediately followed by the subject “சாராள்,” the linker -ச் yields the natural form “சிரித்துக்கொண்டிருப்பதைச் சாராள் கண்டாள்.”
