  text: וַ/יֵּ֧רַע הַ/דָּבָ֛ר מְאֹ֖ד בְּ/עֵינֵ֣י אַבְרָהָ֑ם עַ֖ל אוֹדֹ֥ת בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/011.yaml
  text: The matter was very displeasing in Abraham’s eyes on account of his son[a].
translation:
  language: ta
  text: தன் மகனைப் பற்றிய இந்தக் காரியம் ஆபிரகாமுக்கு மிகவும் வருத்தமளித்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “தன் மகனைப் பற்றிய இந்தக் காரியம் ஆபிரகாமின் பார்வையில் மிகவும் மோசமாக இருந்தது.”
    reason: எபிரெய மொழியிலுள்ள ‘அவன் கண்களில் மோசமாக இருந்தது’ என்ற மரபுத்தொடரின் நேரடி உருவகத்தையும் அதன் மதிப்பீட்டுப் பொருளையும் காட்டுகிறது.
lexical_decisions:
- source_word: וַיֵּרַע
  choice: மிகவும் வேதனையளித்தது
  rationale: רעע என்பதன் Qal வடிவம் בְּעֵינֵי என்ற மரபுத்தொடருடன் சேர்ந்து, ஒரு காரியம் ஒருவருக்கு மிகவும் மோசமாகத் தோன்றியதையும் அவருக்கு மனவேதனை அளித்ததையும் குறிக்கிறது. சூழலில் ஆபிரகாமின் ஆழ்ந்த மனவருத்தத்தை இயல்பான நவீனத் தமிழில் இது தெரிவிக்கிறது.
- source_word: הַדָּבָר
  choice: இந்தக் காரியம்
  rationale: דבר என்பதற்கு ‘சொல், காரியம், விஷயம்’ என்ற பரந்த பொருள் உண்டு. இங்கே முந்தைய வசனத்தில் சாராள் கூறிய கோரிக்கையைக் குறிப்பதால், ‘இந்தக் காரியம்’ என்பது தெளிவாகவும் அளவுக்கு மீறி விளக்காமலும் உள்ளது.
- source_word: מְאֹד
  choice: மிகவும்
  rationale: மூலத்தின் வலியுறுத்தலை இயல்பான நவீனத் தமிழில் நேரடியாகப் பாதுகாக்கும் பொதுவான தீவிரப்படுத்தும் சொல்.
- source_word: בְּעֵינֵי אַבְרָהָם
  choice: ஆபிரகாமுக்கு
  rationale: ‘ஆபிரகாமின் கண்களில்’ என்பது எபிரெய மரபுத்தொடரின் நேரடி வடிவம். பிரதான உரையில் அதன் மதிப்பீட்டு மற்றும் உணர்வுசார் பொருளை இயல்பான தமிழில் ‘ஆபிரகாமுக்கு’ எனக் கொடுத்து, நேரடி உருவகத்தை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עַל אֹדוֹת
  choice: பற்றிய
  rationale: இந்தச் சூழலில் இந்தச் சொற்றொடர் ஆபிரகாமின் வேதனைக்குக் காரணமான, அவன் மகனைச் சார்ந்த விவகாரத்தை அறிமுகப்படுத்துகிறது. ‘பற்றிய’ என்பது காரணம் மற்றும் தொடர்பு ஆகிய இரு நுணுக்கங்களையும் தேவையின்றி ஒன்றாகத் தீர்மானிக்காமல் வைத்திருக்கிறது.
- source_word: בְּנוֹ
  choice: தன் மகன்
  rationale: בן என்பது பாலினத்தையும் உறவையும் தெளிவாகக் குறிக்கும் ‘மகன்.’ எழுவாய் ஆபிரகாம் என்பதால், தமிழில் இயல்பான தற்சுட்டுப் பெயரடையான ‘தன்’ பயன்படுத்தப்படுகிறது.
