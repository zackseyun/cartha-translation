  yaml_path: translation/ot/genesis/021/007.yaml
  text: And she said[b][a], “Who would have said to Abraham that Sarah would nurse children? For I have borne a son in his old age.”
translation:
  language: ta
  text: அவள், “சாராள் பிள்ளைகளுக்குப் பாலூட்டுவாள் என்று ஆபிரகாமிடம் யார் சொல்லியிருப்பார்?[a] அவருடைய முதிர்வயதில் நான் ஒரு மகனைப் பெற்றெடுத்தேனே!” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, “சாராள் மகன்களுக்குப் பாலூட்டுவாள் என்று ஆபிரகாமிடம் யார் சொல்லியிருப்பார்?” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: அவள் ... என்றாள்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; பேசுபவர் சாராள் என்பது சூழலில் தெளிவு.
- source_word: מִי מִלֵּל לְאַבְרָהָם
  choice: ஆபிரகாமிடம் யார் சொல்லியிருப்பார்?
  rationale: எதிர்பாராத நிகழ்வைக் குறித்த வியப்பை வெளிப்படுத்தும் சொல்லாட்சியைத் தமிழில் இயல்பான வினாவாகப் பாதுகாக்கிறது.
- source_word: הֵינִיקָה
  choice: பாலூட்டுவாள்
  rationale: ינק என்பதன் ஹிஃபில் வடிவம் குழந்தைக்குப் பால் கொடுத்தல் என்பதைக் குறிக்கிறது; ‘பாலூட்டுதல்’ தெளிவான, இன்றைய வழக்கிலுள்ள தமிழ்.
- source_word: בָנִים
  choice: பிள்ளைகளுக்கு
  rationale: எபிரெயச் சொல் சொற்படியாக ‘மகன்கள்’ என்ற பன்மை; பாலூட்டும் சூழலில் தமிழில் ‘பிள்ளைகள்’ இயல்பாக இருப்பதால் இதை முதன்மை உரையில் கொண்டு, சொற்பொருளை அடிக்குறிப்பில் தருகிறது.
- source_word: שָׂרָה
  choice: சாராள்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: כִּי
  choice: -ஏனே
  rationale: முந்தைய வியப்புக்கான விளக்கத்தையும் வலியுறுத்தலையும் இயல்பான தமிழ் வாக்கிய இறுதியால் வெளிப்படுத்துகிறது; இதை முரண்பாட்டுச் சொல்லாக மாற்றவில்லை.
- source_word: יָלַדְתִּי
  choice: நான் ... பெற்றெடுத்தேன்
  rationale: முதல் நபர் நிறைவு வினையின் பொருளை இயல்பாகவும் துல்லியமாகவும் தருகிறது.
- source_word: בֵן
  choice: ஒரு மகனை
  rationale: בן என்பதற்கான நேரடியான உறவுமுறைச் சொல்.
- source_word: לִזְקֻנָיו
  choice: அவருடைய முதிர்வயதில்
  rationale: ஆபிரகாமின் மேம்பட்ட வயதைக் குறிக்கும் எபிரெயத் தொடரை மரியாதையான, இயல்பான தமிழில் தருகிறது.
