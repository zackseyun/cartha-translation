base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/032.yaml
  text: So they made a covenant at Beer-sheba[a], and Abimelech rose up with Phicol, the commander of his army, and they returned to the land of the Philistines.
translation:
  language: ta
  text: அவர்கள் பெயேர்செபாவில் உடன்படிக்கை செய்துகொண்டார்கள்.[a] பின்பு அபிமெலேக்கும் அவனுடைய படைத்தளபதியான பீகோலும் எழுந்து, பெலிஸ்தியர்களின் நாட்டிற்குத் திரும்பிச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக, “உடன்படிக்கையை வெட்டினார்கள்”; இது உடன்படிக்கை செய்வதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ בְרִית
  choice: ஓர் உடன்படிக்கை செய்துகொண்டார்கள்
  rationale: எபிரெய மொழிமரபின் நேரடிப் பொருள் ‘உடன்படிக்கையை வெட்டினார்கள்’ என்பதாக இருந்தாலும், நவீன தமிழில் அதன் பொருளை இயல்பாகவும் தெளிவாகவும் தெரிவிக்க ‘உடன்படிக்கை செய்துகொண்டார்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בִּבְאֵר שָׁבַע
  choice: பெயெர்-செபாவில்
  rationale: ב முன்னொட்டு இங்கு இடத்தைக் குறிக்கிறது. பெயரின் எபிரெய ஒலியமைப்பையும் அதன் கூட்டுப்பெயர் தன்மையையும் காட்ட ‘பெயெர்-செபா’ என எழுத்துப்பெயர்ப்பு செய்யப்பட்டது.
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்பது ‘எழுதல்/எழுந்து புறப்படுதல்’ எனப் பொருள்படும். அடுத்ததாக அவர்கள் திரும்பிச் சென்றதை இணைக்கும் இயல்பான தமிழ் வினையெச்சமாக ‘எழுந்து’ பயன்படுத்தப்பட்டது.
- source_word: שַׂר צְבָאוֹ
  choice: அவனுடைய படைத்தளபதி
  rationale: שַׂר என்பது தலைவர் அல்லது தளபதி என்றும், צָבָא இச்சூழலில் படை என்றும் பொருள்படுவதால், தெளிவான நவீன தமிழில் ‘படைத்தளபதி’ என வழங்கப்பட்டது.
- source_word: וַיָּשֻׁבוּ
  choice: திரும்பிச் சென்றார்கள்
  rationale: שׁוּב இங்கு முந்தைய இடத்திற்குத் திரும்புவதைக் குறிக்கிறது. இலக்கையும் பயணத்தையும் தமிழில் இயல்பாக வெளிப்படுத்த ‘திரும்பிச் சென்றார்கள்’ எனப்பட்டது.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களின் நாட்டிற்கு
  rationale: எபிரெயச் சொற்றொடரின் இன-புவியியல் அமைப்பான ‘பெலிஸ்தியர்களின் நாடு’ என்பது நேரடியாகப் பாதுகாக்கப்பட்டது.
- source_word: וּפִיכֹל
  choice: அபிமெலேக்கும் ... பிகோலும்
  rationale: எபிரெய וְ இணைப்பைத் தமிழின் இணை எழுவாய் அமைப்பான ‘-உம் ... -உம்’ மூலம் வெளிப்படுத்தி, பின்னருள்ள பன்மை வினையின் இரு எழுவாய்களையும் தெளிவாக்குகிறது.
