translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் கண்ணியமான வேதாகமக் கதைநடை கொண்டதாயும் வடிவமைக்கப்பட்டது. எபிரெய இணை எழுவாய் தமிழில் இயல்பாகத் தெளிவுபடுத்தப்பட்டுள்ளது; மரபுத்தொடரின் நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
