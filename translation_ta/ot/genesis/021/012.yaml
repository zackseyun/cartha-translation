source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֶל אַבְרָהָ֗ם אַל יֵרַ֤ע בְּ/עֵינֶ֨י/ךָ֙ עַל הַ/נַּ֣עַר וְ/עַל אֲמָתֶ֔/ךָ כֹּל֩ אֲשֶׁ֨ר תֹּאמַ֥ר אֵלֶ֛י/ךָ שָׂרָ֖ה שְׁמַ֣ע בְּ/קֹלָ֑/הּ כִּ֣י בְ/יִצְחָ֔ק יִקָּרֵ֥א לְ/ךָ֖ זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/012.yaml
  text: But God said to Abraham[a], “Do not let it be grievous in your sight because of the boy and because of your servant woman. Whatever Sarah says to you, listen to her voice[d][c][b], for through Isaac your offspring will be called.”
translation:
  language: ta
  text: ஆனால் கடவுள் ஆபிரகாமிடம், “பையனையும் உன் அடிமைப் பெண்ணையும் குறித்து உன் மனம் வருந்த வேண்டாம். சாராள் உன்னிடம் சொல்வதையெல்லாம் கேட்டு நட; ஏனெனில் ஈசாக்கின் வழியாக உன் சந்ததி அழைக்கப்படும்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஈசாக்கில்தான் உனக்குச் சந்ததி அழைக்கப்படும்”; அதாவது, ஆபிரகாமின் வாக்குத்தத்த வம்சம் ஈசாக்கின் வழியாக அடையாளப்படுத்தப்படும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֱלֹהִים
  choice: ஆனால் கடவுள் ... என்றார்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுத்தாலும், முந்தைய வசனத்தில் ஆபிரகாமின் துயரத்துக்கு எதிராக வரும் கடவுளின் பதிலைத் தமிழில் இயல்பாகக் காட்ட ‘ஆனால்’ பொருத்தமானது.
- source_word: יֵרַע בְּעֵינֶיךָ
  choice: துயரப்படாதே
  rationale: ‘உன் கண்களில் தீயதாக இருக்க வேண்டாம்’ என்ற எபிரெய மொழிமரபு, இச்சூழலில் மனவேதனை அல்லது வருத்தத்தைக் குறிக்கிறது. நவீனத் தமிழில் ‘துயரப்படாதே’ அதன் பொருளை இயல்பாகத் தருகிறது.
- source_word: הַנַּעַר
  choice: பையன்
  rationale: இஸ்மவேலைக் குறிக்கும் נַעַר என்பதற்கு வயதை மிகத் துல்லியமாக நிர்ணயிக்காமல், வழக்கிலுள்ள இயல்பான தமிழ்ச் சொல்.
- source_word: אֲמָתֶךָ
  choice: உன் அடிமைப் பெண்
  rationale: אָמָה என்பதில் உள்ள கட்டுப்பட்ட சமூக நிலையைக் ‘வேலைக்காரி’ என்று மென்மையாக்காமல் வெளிப்படுத்துகிறது.
- source_word: שְׁמַע בְּקֹלָהּ
  choice: அவள் சொல்வதைக் கேட்டு நட
  rationale: சொல்லுக்குச் சொல் ‘அவளுடைய குரலைக் கேள்’ என்றாலும், இங்கு அவள் சொல்வதை ஏற்று அதன்படி செயல்படுதல் என்ற எபிரெய மொழிமரபுப் பொருள் உள்ளது. ‘கீழ்ப்படி’ என்பதைவிட ‘கேட்டு நட’ தேவையற்ற வலிமையைச் சேர்க்காது.
- source_word: בְּיִצְחָק
  choice: ஈசாக்கின் வழியாகவே
  rationale: בְּ இங்கு ஆபிரகாமின் வாக்குத்தத்த சந்ததி அடையாளப்படுத்தப்படும் வழி அல்லது வம்சவரிசையைச் சுட்டுகிறது; ‘வழியாக’ இதைத் தெளிவாகச் சொல்கிறது. ‘வே’ சூழலிலுள்ள வேறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: יִקָּרֵא לְךָ זָרַע
  choice: உன் சந்ததி அழைக்கப்படும்
  rationale: קרא என்பதன் ‘அழைக்கப்படுதல்/பெயரிடப்படுதல்’ என்ற வடிவத்தைப் பாதுகாத்து, לְךָ என்பதை இயல்பான தமிழில் உடைமைத் தொடர்பாகத் தருகிறது. இது உடன்படிக்கை வம்சம் ஈசாக்கின் வழி அடையாளப்படுத்தப்படுவதை விளக்கிப் பரப்பாமல் வைத்திருக்கிறது.
- source_word: זָרַע
  choice: சந்ததி
  rationale: זֶרַע என்பது கூட்டுப்பொருளுள்ள ஒருமை. ‘சந்ததி’ தமிழில் அந்தத் தன்மையையும் வம்சத் தொடர்பையும் இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: ஆகாரின் சமூக நிலைக்கான சொல்
  choice: உன் அடிமைப் பெண்
  alternative: உன் பணிப்பெண்
  rationale: மூலச்சொல் குறிக்கும் சுதந்திரமற்ற, கீழ்நிலைச் சமூக உறவை மென்மையாக்காமல் காட்டுகிறது; அதேவேளை உரைக்கு வெளியான மதிப்பீட்டைச் சேர்ப்பதில்லை.
- issue: வாக்குத்தத்த வாக்கியத்தின் பொருள்
  choice: ஈசாக்கின் வழியாகவே உன் சந்ததி அழைக்கப்படும்
  alternative: ஈசாக்கின் வழியாகவே உனக்குச் சந்ததி கணக்கிடப்படும்
  rationale: ‘அழைக்கப்படும்’ என்பது மூலத்தின் அழைத்தல்/பெயரிடுதல் மொழியைப் பாதுகாக்கிறது. ‘கணக்கிடப்படும்’ என்பது பொருளை விளக்கும் சாத்தியமான வாசிப்பு என்றாலும், மூலத்தில் உள்ள இறையியல் நெருக்கடியையும் ஓரளவு தெளிவின்மையையும் அதிகமாகத் தீர்த்துவிடும்.
translation_notes:
  register: நவீனச் செந்தமிழ் சார்ந்த, பொதுமக்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை. எபிரெய மொழிமரபுகளைச் சொல்லுக்குச் சொல் அசௌகரியமாகப் பதியாமல், அவற்றின் பொருளையும் முக்கியமான அழைத்தல் மொழியையும் காக்கும் உகந்த-இணைவு அணுகுமுறை பயன்படுத்தப்பட்டது.
