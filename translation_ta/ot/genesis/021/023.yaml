source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּׁ֨בְעָ/ה לִּ֤/י בֵֽ/אלֹהִים֙ הֵ֔נָּה אִם תִּשְׁקֹ֣ר לִ֔/י וּ/לְ/נִינִ֖/י וּ/לְ/נֶכְדִּ֑/י כַּ/חֶ֜סֶד אֲשֶׁר עָשִׂ֤יתִי עִמְּ/ךָ֙ תַּעֲשֶׂ֣ה עִמָּדִ֔/י וְ/עִם הָ/אָ֖רֶץ אֲשֶׁר גַּ֥רְתָּה בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/023.yaml
  text: Swear to me here by God that you will not deal falsely with me, or with my children, or with my descendants. According to the kindness that I have shown to you, you shall show to me and to the land where you have lived as a foreigner.
translation:
  language: ta
  text: 'இப்போது, கடவுளின் பெயரில் எனக்கு ஆணையிட்டுச் சொல்: நீ என்னிடமோ, என் பிள்ளைகளிடமோ, என் வழித்தோன்றல்களிடமோ வஞ்சகமாக நடந்துகொள்ள மாட்டாய். நான் உனக்குக் காட்டிய தயவைப் போலவே, நீ எனக்கும் நீ அந்நியனாகத் தங்கியிருந்த நாட்டுக்கும் தயவு காட்ட வேண்டும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: எபிரெயச் சொல்லில் வெளிப்படையாக உள்ள கால/உரையாடல் மாற்றத்தைக் காக்கிறது; தமிழில் இயல்பாக வாக்குறுதி கோரிக்கையை அறிமுகப்படுத்துகிறது.
- source_word: הִשָּׁבְעָה לִּי בֵאלֹהִים
  choice: கடவுள்மேல் ஆணையிட்டு எனக்கு வாக்குக் கொடு
  rationale: இது கடவுளைச் சாட்சியாகக் கொண்டு செய்யப்படும் உறுதிமொழி என்பதை இயல்பான நவீன தமிழில் தெளிவுபடுத்துகிறது.
- source_word: נִינִי וּלְנֶכְדִּי
  choice: என் பிள்ளைகளிடமோ, என் வழித்தோன்றல்களிடமோ
  rationale: இரண்டு தலைமுறை/சந்ததி சார்ந்த சொற்களின் வேறுபாட்டை பொதுவான பிள்ளைகள் மற்றும் விரிந்த பின்வரும் வழித்தோன்றல்கள் எனக் காக்கிறது.
- source_word: תִּשְׁקֹר
  choice: வஞ்சகமாக நடந்துகொள்ள மாட்டாய்
  rationale: பொய் பேசுதல் மட்டுமல்லாமல் நம்பிக்கைத் துரோகம் அல்லது மோசடியையும் குறிக்கக்கூடிய வினையின் உறவுசார் பொருளை வெளிப்படுத்துகிறது.
- source_word: חֶסֶד
  choice: அன்பு
  rationale: இச்சூழலில் காட்டப்பட்ட தயவு, பற்றுறுதி, நல்லெண்ணம் ஆகியவற்றை உள்ளடக்கும் இயல்பான தமிழ் சொல்; வெறும் உணர்ச்சியாகத் தோன்றாமல் செயலில் காட்டுதல் என்ற வினையுடன் இணைக்கப்பட்டுள்ளது.
- source_word: גַּרְתָּה בָּהּ
  choice: நீ அந்நியனாகத் தங்கியிருக்கும்
  rationale: גּוּר என்பதன் நிரந்தர குடியுரிமையற்ற அந்நியத் தங்குதல் என்ற கருத்தைத் துல்லியமாகக் காக்கிறது.
theological_decisions:
- issue: אִם துகளுடன் வரும் எபிரெய உறுதிமொழி வடிவம்
  choice: “வஞ்சகமாக நடந்துகொள்ள மாட்டாய்” என்ற எதிர்மறை வாக்குறுதியாக மொழிபெயர்த்தல்
  alternative: சொல்லுக்கு சொல் “நீ வஞ்சித்தால்…” என்று முழுமையற்ற நிபந்தனையாக விடுதல்
  rationale: אִם இங்கு உறுதிமொழியில் மறைமுக சாபத்தை உள்ளடக்கிய வழக்குச் சூத்திரமாக வருகிறது. தமிழில் அதன் தொடர்பாடல் பொருள் எதிர்மறை வாக்குறுதியாக இயல்பாக வெளிப்படுகிறது; குறிப்பிடப்படாத சாபத்தை உரையில் புதிதாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமான ஆனால் சாதாரண வாசகருக்கு எளிதில் புரியும் நடை. எபிரெய மூலத்தில் உள்ள “இப்போது” காக்கப்பட்டது. “நாடு” என்பது மனிதர்களையும் நிலப்பரப்பையும் உள்ளடக்கக்கூடிய אֶרֶץ என்பதற்கான இயல்பான சூழல் மொழிபெயர்ப்பு.
