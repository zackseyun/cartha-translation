  text: וַ/יִּשְׁמַ֣ע אֱלֹהִים֮ אֶת ק֣וֹל הַ/נַּעַר֒ וַ/יִּקְרָא֩ מַלְאַ֨ךְ אֱלֹהִ֤ים אֶל הָגָר֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֥אמֶר לָ֖/הּ מַה לָּ֣/ךְ הָגָ֑ר אַל תִּ֣ירְאִ֔י כִּֽי שָׁמַ֧ע אֱלֹהִ֛ים אֶל ק֥וֹל הַ/נַּ֖עַר בַּ/אֲשֶׁ֥ר הוּא שָֽׁם־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/017.yaml
  text: And God heard the boy’s voice[a], and the angel of God called to Hagar from heaven and said to her, “What is the matter with you, Hagar? Do not fear, for God has heard the boy’s voice where he is.”
translation:
  language: ta
  text: கடவுள் சிறுவனின் குரலைக் கேட்டார்[a]. அப்போது கடவுளின் தூதர் வானத்திலிருந்து ஆகாரை அழைத்து அவளிடம், “ஆகாரே, உனக்கு என்ன நேர்ந்தது? அஞ்சாதே; சிறுவன் இருக்கும் இடத்திலேயே அவனுடைய குரலைக் கடவுள் கேட்டார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிறுவனின் அழுகுரலை.” எபிரெய மொழியிலுள்ள קוֹל என்ற சொல் துயரத்தில் எழும் கேட்கத்தக்க அழுகுரலையும் குறிக்கலாம். இவ்வசனத்தில் இச்சொல் இருமுறை வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֱלֹהִים
  choice: கடவுள் ... கேட்டார்
  rationale: שׁמע என்பதன் அடிப்படைப் பொருளான ‘கேள்’ என்பதைக் காத்து, கடவுள் பதிலளித்தார் என்ற கருத்தை மொழிபெயர்ப்பிலேயே கூடுதலாகச் சேர்க்காமல் உள்ளது.
- source_word: אֶת קוֹל הַנַּעַר / אֶל קוֹל הַנַּעַר
  choice: சிறுவனின் குரலை / அவனுடைய குரலை
  rationale: קוֹל என்பதன் நேரடிப் பொருள் ‘குரல்/ஒலி’. சூழலில் இது துயரக்குரலாக இருக்கலாம்; எனினும் மூலத்தின் இரு இடங்களிலும் உள்ள சொல் மீளுருவை இயன்றவரை காக்க ‘குரல்’ பயன்படுத்தப்பட்டது.
- source_word: הַנַּעַר
  choice: சிறுவன்
  rationale: இங்கு இஸ்மவேலைக் குறிக்கும் נַעַר என்பதற்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: מַלְאַךְ אֱלֹהִים
  choice: கடவுளின் தூதர்
  rationale: எபிரெயக் கூட்டுச்சொல்லை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது; தூதரின் அடையாளம் குறித்த மேலதிக இறையியல் முடிவைச் சேர்க்கவில்லை.
- source_word: מִן הַשָּׁמַיִם
  choice: வானத்திலிருந்து
  rationale: שׁמים வடிவில் பன்மையாக இருந்தாலும், இடத்தைக் குறிக்கும் இச்சூழலில் தமிழில் ‘வானத்திலிருந்து’ என்பது இயல்பான நடை.
- source_word: מַה לָּךְ
  choice: உனக்கு என்ன நேர்ந்தது?
  rationale: இந்த எபிரெய மொழிவழக்கு ஒருவருக்கு என்ன பிரச்சினை அல்லது துயரம் ஏற்பட்டது என்று கேட்கிறது. தேர்ந்தெடுத்த தமிழ் இயல்பாகவும் பரிவான தொனியுடனும் உள்ளது.
- source_word: אַל תִּירְאִי
  choice: அஞ்சாதே
  rationale: பெண்பால் ஒருமைத் தடையாணையின் நேரடியான, சுருக்கமான, கண்ணியமான தமிழ் வடிவம்.
- source_word: כִּי שָׁמַע אֱלֹהִים
  choice: கடவுள் கேட்டார்
  rationale: כִּי இங்கு அளிக்கும் காரணத்தை தமிழ் வாக்கியத் தொடரே தெளிவாக்குகிறது; שׁמע மீண்டும் அதே ‘கேட்டார்’ என மொழிபெயர்க்கப்பட்டு சொல் மீளுரை காக்கப்படுகிறது.
- source_word: בַּאֲשֶׁר הוּא שָׁם
  choice: சிறுவன் இருக்கும் இடத்திலிருந்து எழும்
  rationale: சொற்றொடரின் இடப்பொருளைத் தெளிவாக இணைத்து, குரல் அவன் இருக்கும் நிலையிலேயே கடவுளால் கேட்கப்பட்டது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: மַלְאַךְ אֱלֹהִים என்பவர் கடவுளோடு நெருக்கமாக அடையாளப்படுத்தப்படும் தெய்வீகத் தூதரா என்ற கேள்வி
  choice: கடவுளின் தூதர்
  alternative: கடவுளாகிய தூதர் / ஒரு தெய்வீகத் தூதர்
  rationale: மூலத்தின் ‘கடவுளின் தூதர்’ என்ற உறவைக் காத்து, அந்தத் தூதரின் துல்லியமான அடையாளம் பற்றிய இறையியல் விவாதத்தை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான உரைநடை. ‘ஆகாரே’, ‘அஞ்சாதே’ ஆகியவை நேரடி அழைப்பின் செறிவைத் தக்கவைக்கின்றன. மூலத்தின் ‘குரல்’ மற்றும் ‘கேட்டார்’ என்ற மீளுரைகள் பாதுகாக்கப்பட்டுள்ளன.
