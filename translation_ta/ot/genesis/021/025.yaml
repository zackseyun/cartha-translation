  language: ta
  text: அபிமெலேக்கின் பணியாளர்கள் கைப்பற்றிக்கொண்ட ஒரு தண்ணீர்க் கிணற்றைக் குறித்து ஆபிரகாம் அபிமெலேக்கைக் கண்டித்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹכִחַ
  choice: கண்டித்தார்
  rationale: הוכיח என்பதன் இச்சூழலிலான பொருள் குற்றத்தை நேரடியாகச் சுட்டிக்காட்டிக் கடிந்துகொள்வது; நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் ‘கண்டித்தார்’ இதைத் தருகிறது.
- source_word: עַל אֹדוֹת
  choice: குறித்து
  rationale: விவகாரத்தின் பொருளைச் சுட்டும் எபிரெயச் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
- source_word: בְּאֵר הַמַּיִם
  choice: ஒரு தண்ணீர்க் கிணற்றை
  rationale: சொற்பொருளைத் தெளிவாகக் காக்கிறது; எபிரெயத்தில் நிர்ணயச் சுட்டு இருந்தாலும், தமிழ்க் கதையோட்டத்தில் முதன்முறையாக முன்வைக்கப்படும் கிணற்றுக்கு ‘ஒரு’ இயல்பானது.
- source_word: גָּזְלוּ
  choice: கைப்பற்றிக்கொண்ட
  rationale: வலுக்கட்டாயமாக அல்லது அநியாயமாகப் பறித்துக்கொண்ட பொருளைக் கொண்ட வினை; ‘கைப்பற்றிக்கொண்ட’ குற்றச்சாட்டின் வலிமையைக் காக்கிறது.
- source_word: עַבְדֵי אֲבִימֶלֶךְ
  choice: அபிமெலேக்கின் பணியாளர்கள்
  rationale: עֶבֶד என்பது இங்கு அரசனுக்குக் கீழ் செயல்படுவோரைக் குறிக்கலாம்; ‘பணியாளர்கள்’ தேவையற்ற சமூகநிலைத் துல்லியப்படுத்தலைத் தவிர்க்கிறது.
