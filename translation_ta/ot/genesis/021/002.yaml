source:
  edition: WLC
  text: וַ/תַּהַר֩ וַ/תֵּ֨לֶד שָׂרָ֧ה לְ/אַבְרָהָ֛ם בֵּ֖ן לִ/זְקֻנָ֑י/ו לַ/מּוֹעֵ֕ד אֲשֶׁר דִּבֶּ֥ר אֹת֖/וֹ אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/002.yaml
  text: So Sarah conceived and bore a son to Abraham in his old age[b][a], at the appointed time that God had spoken to him.
translation:
  language: ta
  text: கடவுள் அவரிடம் கூறியிருந்த குறித்த காலத்தில், சாராள் கருவுற்று, ஆபிரகாம் முதிர்ந்த வயதில் இருந்தபோது அவருக்கு ஒரு மகனைப் பெற்றெடுத்தாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: கருவுற்று
  rationale: הרה என்பது கருவுறுதலைக் குறிக்கிறது; நிகழ்வுகளின் தொடரை இயல்பான தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: וַתֵּלֶד
  choice: பெற்றெடுத்தாள்
  rationale: ילד இங்கு குழந்தையைப் பெற்றெடுத்த நிகழ்வைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בֵּן
  choice: ஒரு மகனை
  rationale: எபிரெயச் சொல்லின் ஆண்பால் ஒருமையைத் தெளிவாகக் காக்கிறது.
- source_word: לִזְקֻנָיו
  choice: ஆபிரகாமின் முதிர்வயதில்
  rationale: இது நோக்கத்தைக் குறிக்காமல், ஆபிரகாம் முதிர்ந்த வயதில் இருந்த காலச்சூழலைக் குறிக்கிறது.
- source_word: לַמּוֹעֵד
  choice: குறித்த காலத்திலேயே
  rationale: מוֹעֵד முன்குறிக்கப்பட்ட அல்லது நிர்ணயிக்கப்பட்ட காலத்தைக் குறிக்கிறது; ‘-லேயே’ என்பது வாக்குறுதி நிறைவேறிய துல்லியமான நேரத்தை இயல்பாக வலியுறுத்துகிறது.
- source_word: אֲשֶׁר דִּבֶּר אֹתוֹ אֱלֹהִים
  choice: கடவுள் அவரிடம் சொல்லியிருந்த
  rationale: உறவுப்பெயர் தொடர் ‘குறித்த காலம்’ என்பதையே விளக்குகிறது; கடவுள் முன்பு ஆபிரகாமிடம் அந்தக் காலத்தைப் பற்றிச் சொல்லியிருந்தார் என்பதைத் தெளிவாக்குகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இவ்விடத்தில் பொதுவான இறைச் சுட்டுப்பெயருக்கான நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: וַ
  choice: அவ்வாறே
  rationale: முந்தைய இறைச்சொல்லின் நிறைவேற்றமாக நிகழ்ச்சி தொடர்வதை இயல்பாகக் காட்டுகிறது; வெறும் காலத்தொடரைக் காட்டிலும் இச்சூழலுக்குப் பொருத்தமானது.
theological_decisions:
- issue: இறைவாக்குறுதி குறிப்பிட்ட காலத்தில் நிறைவேறியதைக் கூடுதல் விளக்கமின்றி வெளிப்படுத்துதல்
  choice: கடவுள் அவரிடம் சொல்லியிருந்த குறித்த காலத்திலேயே
  alternative: கடவுள் அவரிடம் பேசியிருந்த காலத்தில்
  rationale: உறவுப்பெயர் தொடர் கடவுள் அந்த நேரத்தில் பேசியதாக அல்ல, அந்தக் குறிப்பிட்ட காலத்தைப் பற்றி முன்பே பேசியதாகக் குறிக்கிறது. தேர்ந்தெடுத்த வடிவம் அந்தத் தொடர்பைத் தெளிவாகக் காத்து, கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஆபிரகாமைக் குறிக்கும் ‘அவர்/அவருக்கு’ மரியாதை ஒருமை தமிழ் வழக்குக்கு ஏற்ப பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் பொருள் மாற்றப்படவில்லை.
