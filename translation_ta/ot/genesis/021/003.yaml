  to: ஆபிரகாம், தனக்குப் பிறந்தவனும் சாராள் ஆபிரகாமுக்குப் பெற்றெடுத்தவனுமான தன் மகனுக்கு ஈசாக்கு என்று பெயரிட்டான்.
