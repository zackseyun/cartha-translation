  text: וַ/יִּקְרָ֨א אַבְרָהָ֜ם אֶֽת שֶׁם בְּנ֧/וֹ הַ/נּֽוֹלַד ל֛/וֹ אֲשֶׁר יָלְדָה לּ֥/וֹ שָׂרָ֖ה יִצְחָֽק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/003.yaml
  text: And Abraham called the name of his son who was born to him[a], whom Sarah bore to him[b], Isaac.
translation:
  language: ta
  text: ஆபிரகாம், தனக்குப் பிறந்தவனும் சாராள் ஆபிரகாமுக்குப் பெற்றெடுத்தவனுமான தன் மகனுக்கு ஈசாக்கு என்று பெயரிட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֶׁם
  choice: பெயரிட்டான்
  rationale: קרא coupled with שֵׁם means ‘to name.’ Tamil naturally expresses this construction with ‘பெயரிட்டான்’; a word-for-word rendering such as ‘பெயரை அழைத்தான்’ would be unnatural and potentially misleading.
- source_word: בְּנוֹ
  choice: தன் மகனுக்கு
  rationale: The pronominal suffix identifies the child as Abraham’s son. The reflexive ‘தன்’ clearly refers back to the subject, Abraham.
- source_word: הַנּוֹלַד לוֹ
  choice: தனக்குப் பிறந்தவனும்
  rationale: This preserves both the participial description ‘the one born’ and the relational dative לוֹ, while fitting natural Tamil syntax.
- source_word: אֲשֶׁר יָלְדָה לּוֹ שָׂרָה
  choice: சாராள் தனக்குப் பெற்றெடுத்தவனுமான
  rationale: The clause retains Sarah as the mother and preserves the repeated לוֹ (‘to/for him’) with ‘தனக்கு.’ The paired relative construction connects this clause naturally to the preceding description.
- source_word: יִצְחָק
  choice: ஈசாக்கு
  rationale: This is the established modern Tamil biblical form of the personal name Isaac.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயச் சொல் வரிசையை அப்படியே பின்பற்றாமல், இரு தொடர்புச் சொற்றொடர்களும் ‘மகன்’ என்பதையே விளக்குகின்றன என்பதைத் தெளிவாக வைத்திருக்கிறது; அதேவேளையில் இருமுறை வரும் לוֹ என்பதன் உறவுசார் வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளது.
