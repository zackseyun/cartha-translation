id: GEN.21.27
reference: Genesis 21:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּקַּ֤ח אַבְרָהָם֙ צֹ֣אן וּ/בָקָ֔ר וַ/יִּתֵּ֖ן לַ/אֲבִימֶ֑לֶךְ וַ/יִּכְרְת֥וּ שְׁנֵי/הֶ֖ם בְּרִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/027.yaml
  text: So Abraham took sheep and cattle and gave them to Abimelech[a], and the two of them made a covenant.
translation:
  language: ta
  text: ஆபிரகாம் ஆடுகளையும் மாடுகளையும் எடுத்து அபிமெலேக்குக்குக் கொடுத்தார். அவர்கள் இருவரும் ஓர் உடன்படிக்கை செய்துகொண்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “உடன்படிக்கையை வெட்டினார்கள்.” இது ஓர் உடன்படிக்கையை முறைப்படி ஏற்படுத்துவதைக் குறிக்கும் வழக்கமான எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்து
  rationale: לקח என்பதன் எளிய தொடர் நிகழ்வுப் பொருளான ‘எடுத்தார்’ என்பதைத் தமிழின் வாக்கிய ஓட்டத்திற்கேற்ப ‘எடுத்து’ என வழங்குகிறது.
- source_word: צֹאן
  choice: ஆடுகள்
  rationale: צֹאן சிறிய கால்நடைகளை, குறிப்பாக செம்மறியாடுகளையும் வெள்ளாடுகளையும் குறிக்கும். அடுத்து வரும் பெரிய கால்நடை வகையிலிருந்து வேறுபடுத்த இயல்பான பொதுச் சொல்லாக ‘ஆடுகள்’ பயன்படுத்தப்படுகிறது.
- source_word: וּבָקָר
  choice: மாடுகள்
  rationale: בָּקָר பெரிய கால்நடைகளை, முக்கியமாக மாடுகளைச் சுட்டுகிறது; நவீன தமிழில் ‘மாடுகள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַיִּתֵּן לַאֲבִימֶלֶךְ
  choice: அபிமெலேக்குக்குக் கொடுத்தார்
  rationale: נתן என்பதன் நேரடியான ‘கொடு’ என்ற பொருளையும் ל முன்னொட்டின் பெறுநர் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: שְׁנֵיהֶם
  choice: அவர்கள் இருவரும்
  rationale: உடன்படிக்கையில் ஈடுபட்ட இரு தரப்பினரையும் எபிரெய உரை வெளிப்படையாகக் குறிப்பிடுவதைத் தக்கவைக்கிறது.
- source_word: וַיִּכְרְתוּ ... בְּרִית
  choice: ஓர் உடன்படிக்கை செய்துகொண்டார்கள்
  rationale: சொல்லுக்குச் சொல் ‘உடன்படிக்கையை வெட்டினார்கள்’ என்ற எபிரெய மரபுத்தொடரின் பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது; அதன் நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּרִית
  choice: உடன்படிக்கை
  rationale: வேதாகமம் முழுவதும் முக்கியத்துவம் வாய்ந்த בְּרִית என்ற சொல்லின் உடன்படிக்கை சார்ந்த பொருளையும் தொடர்ச்சியையும் காக்கிறது.
theological_decisions:
- issue: כרת ברית என்ற உடன்படிக்கை மரபுத்தொடரின் மொழிபெயர்ப்பு
  choice: உடன்படிக்கை செய்துகொண்டார்கள்
  alternative: உடன்படிக்கையை வெட்டினார்கள்
  rationale: முதன்மை உரை மரபுத்தொடரின் உண்மைப் பொருளை இயல்பான நவீன தமிழில் தருகிறது. அதேவேளை, எபிரெய மொழியின் உருவகத்தையும் உடன்படிக்கை ஏற்படுத்தும் பின்னணியையும் மறைக்காமல் நேரடி வடிவத்தை அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. צֹאן மற்றும் בָּקָר ஆகிய தனித்த கால்நடை வகைகள் ‘ஆடுகள்’, ‘மாடுகள்’ எனத் தெளிவாக வேறுபடுத்தப்பட்டுள்ளன. எபிரெய வாக்கியத்தின் தொடர்ச்சியைத் தமிழில் இயல்பாக்க இரண்டு வாக்கியங்களாக வழங்கப்பட்டுள்ளது.
