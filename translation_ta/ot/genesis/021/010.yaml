id: GEN.21.10
reference: Genesis 21:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ לְ/אַבְרָהָ֔ם גָּרֵ֛שׁ הָ/אָמָ֥ה הַ/זֹּ֖את וְ/אֶת בְּנָ֑/הּ כִּ֣י לֹ֤א יִירַשׁ֙ בֶּן הָ/אָמָ֣ה הַ/זֹּ֔את עִם בְּנִ֖/י עִם יִצְחָֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/010.yaml
  text: So she said to Abraham[a], “Drive out this servant woman and her son, for the son of this servant woman will not inherit with my son Isaac.”
translation:
  language: ta
  text: அப்போது அவள் ஆபிரகாமிடம், “இந்த அடிமைப் பெண்ணையும்[a] அவளுடைய மகனையும் விரட்டிவிடுங்கள்; ஏனெனில் இந்த அடிமைப் பெண்ணின் மகன் என் மகனோடு—ஈசாக்கோடு—சேர்ந்து வாரிசுரிமை பெறமாட்டான்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பணிப்பெண்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּרֵשׁ
  choice: விரட்டிவிடுங்கள்
  rationale: இந்தக் கட்டளைச்சொல் வெறுமனே அனுப்பிவைப்பதைவிட வலுக்கட்டாயமாக வெளியேற்றுவதைக் குறிக்கிறது. ‘விரட்டிவிடுங்கள்’ அதன் கடுமையையும் நவீன தமிழின் இயல்பையும் காக்கிறது.
- source_word: הָאָמָה
  choice: அடிமைப் பெண்
  rationale: ஆமா (אָמָה) என்பது கீழ்நிலையிலுள்ள பெண் அடிமை அல்லது பிணைக்கப்பட்ட பணிப்பெண்ணைக் குறிக்கிறது. இச்சூழலில் அவளுடைய சமூக மற்றும் சட்ட நிலை முக்கியமானதால் ‘அடிமைப் பெண்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּנָהּ
  choice: அவளுடைய மகன்
  rationale: எபிரெயப் பெயர்ச்சொல்லுடன் இணைந்துள்ள மூன்றாம் நபர் பெண்பால் ஒருமை உடைமை விகுதியை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: כִּי לֹא יִירַשׁ
  choice: ஏனெனில் ... வாரிசுரிமை பெறமாட்டான்
  rationale: כִּי சாராளின் கோரிக்கைக்கான காரணத்தை அறிமுகப்படுத்துகிறது; ירשׁ இங்கு உடைமையைச் சுதந்தரிப்பது அல்லது வாரிசாகப் பங்குபெறுவதைக் குறிக்கிறது. எதிர்கால மறுப்பின் வலிமை காக்கப்பட்டுள்ளது.
- source_word: בֶּן הָאָמָה הַזֹּאת
  choice: இந்த அடிமைப் பெண்ணின் மகன்
  rationale: ‘இந்த’ என்ற சுட்டுச்சொல்லோடு பெயர்த்தொடர் மீண்டும் வருவது சாராளின் விலக்கிவைக்கும், இகழ்ச்சியான வலியுறுத்தலை வெளிப்படுத்துகிறது; அது தமிழிலும் காக்கப்பட்டுள்ளது.
- source_word: עִם בְּנִי עִם יִצְחָק
  choice: என் மகனோடு—ஈசாக்கோடு—சேர்ந்து
  rationale: எபிரெயத்தில் עִם (‘உடன்’) இருமுறை வருவது ‘ஈசாக்கு’ என்பதை வலியுறுத்தும் விளக்க இணைப்பாக அமைந்துள்ளது. இடைக்கோடுகள் அந்த மீளுரையின் வலியுறுத்தலை இயல்பான தமிழில் காக்கின்றன.
- source_word: וַתֹּאמֶר לְאַבְרָהָם
  choice: அப்போது அவள் ஆபிரகாமிடம் ... என்றாள்
  rationale: தொடர்கதை வாவ் நிகழ்வின் தொடர்ச்சியைச் சுட்டுவதால் ‘அப்போது’ எனத் தரப்பட்டுள்ளது; தமிழின் இயல்பான நேரடி உரை அமைப்புக்காக ‘என்றாள்’ இறுதியில் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יִירַשׁ என்பதன் பொருள்
  choice: வாரிசுரிமை பெறமாட்டான்
  alternative: சொத்தில் பங்குபெறமாட்டான்
  rationale: வசனம் குறிப்பிட்ட சொத்தை மட்டும் தெளிவாகச் சொல்லாமல், வாரிசாகும் நிலை அல்லது சுதந்தரிப்பைச் சுட்டுகிறது. ஆகவே பரந்த பொருளைத் திறந்தவாறே வைத்திருக்க ‘வாரிசுரிமை’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. சாராளின் கடுமையான கட்டளையும் ‘இந்த அடிமைப் பெண்’ என்ற விலக்கிவைக்கும் மீளுரையும் மென்மையாக்கப்படவில்லை. ஆபிரகாமை நோக்கிய கட்டளை மரியாதைப் பன்மையில் தரப்பட்டாலும், அதன் வலிமை காக்கப்பட்டுள்ளது.
