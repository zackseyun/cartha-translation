base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/021.yaml
  text: He lived in the wilderness of Paran[b][a], and his mother took a wife for him from the land of Egypt.
translation:
  language: ta
  text: அவன் பாரான் வனாந்தரத்தில் வாழ்ந்தான்[a]. அவனுடைய தாய் எகிப்து நாட்டிலிருந்து அவனுக்காக ஒரு மனைவியைப் பெற்றாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் பாரான் வனாந்தரத்தில் குடியிருந்தான்.”
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்படி, “அவனுடைய தாய் எகிப்து நாட்டிலிருந்து அவனுக்காக ஒரு பெண்ணை எடுத்தாள்.” இச்சூழல் திருமண ஏற்பாட்டைக் குறிப்பதால் முதன்மை உரையில் “மனைவி” என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: வாழ்ந்தான்
  rationale: ישׁב என்பதற்கு ‘அமர்தல், தங்குதல், குடியிருத்தல், வாழ்தல்’ என்ற பொருள்கள் உண்டு. இங்கு நிரந்தரமாகக் குடியேறியதாக அளவுக்கு மீறிக் குறிப்பிடாமல், தொடர்ந்த வசிப்பை இயல்பான நவீன தமிழில் ‘வாழ்ந்தான்’ தெரிவிக்கிறது.
- source_word: בְּמִדְבַּר פָּארָן
  choice: பாரான் வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது மக்கள் குடியிருப்பு குறைந்த வறண்ட வனப்பகுதியைக் குறிக்கலாம். வேதாகமத் தமிழ் வழக்கிலும் பரந்த மூலப் பொருளிலும் பொருந்துவதால் ‘வனாந்தரம்’ பயன்படுத்தப்பட்டது; פָּארָן என்பது ‘பாரான்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וַתִּקַּח
  choice: தேர்ந்தெடுத்தாள்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்’; இச்சூழலில் தாய் மகனுக்குத் திருமணத் துணையைப் பெற்றுத் தரும் அல்லது தேர்ந்தெடுக்கும் செயலைக் குறிக்கிறது. தமிழில் ‘ஒரு மனைவியை எடுத்தாள்’ என்பது தவறாகப் புரியக்கூடும் என்பதால் சூழலுக்கேற்ற ‘தேர்ந்தெடுத்தாள்’ பயன்படுத்தப்பட்டது.
- source_word: לוֹ
  choice: அவனுக்கு
  rationale: לְ suffix இங்கு அவனுக்காக அல்லது அவனுடன் உறவுபடுத்தி ஏற்பாடு செய்ததைச் சுட்டுகிறது; ‘அவனுக்கு’ இதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אִמּוֹ
  choice: அவனுடைய தாய்
  rationale: மூலத்தின் வெளிப்படையான உடைமைத் தொடர்பு தமிழிலும் தெளிவாகத் தக்கவைக்கப்பட்டது.
- source_word: אִשָּׁה
  choice: ஒரு பெண்ணை … மனைவியாக
  rationale: אִשָּׁה என்பதற்கு ‘பெண்’ என்றும் ‘மனைவி’ என்றும் பொருள் உண்டு. மூலத்தின் சொல்லியல் பரப்பை வெளிப்படுத்த ‘ஒரு பெண்ணை’ என்றும், திருமணச் சூழலைத் தெளிவுபடுத்த ‘மனைவியாக’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: אֶרֶץ என்ற ‘நாடு/நிலம்’ மூலத்தில் வெளிப்படையாக இருப்பதால், இயல்பான தமிழில் ‘எகிப்து நாட்டிலிருந்து’ என்று முழுமையாகத் தரப்பட்டது.
