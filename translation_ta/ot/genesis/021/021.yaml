translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பானதாயும் கண்ணியமானதாயும் உரை அமைக்கப்பட்டுள்ளது. ‘வனாந்தரம்’ வேதாகமச் சூழலுக்கு அறிமுகமான சொல்லாக இருந்தாலும் பொதுவாசகரும் புரிந்துகொள்ளக்கூடியது. எபிரெய வினையின் சொல்லடிப் பொருளையும் சூழல்சார் திருமணப் பொருளையும் அடிக்குறிப்பு பாதுகாக்கிறது.
