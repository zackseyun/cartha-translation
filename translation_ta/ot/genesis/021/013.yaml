  text: וְ/גַ֥ם אֶת בֶּן הָ/אָמָ֖ה לְ/ג֣וֹי אֲשִׂימֶ֑/נּוּ כִּ֥י זַרְעֲ/ךָ֖ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/013.yaml
  text: And I will also make the son of the servant woman into a nation[a], because he is your offspring.
translation:
  language: ta
  text: அடிமைப் பெண்ணின் மகனையும்[a] ஒரு மக்களினமாக ஆக்குவேன்; ஏனெனில், அவனும் உன் சந்ததிதான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெண் அடிமையின் மகனையும்”; அல்லது, “பணிப்பெண்ணின் மகனையும்.”
    reason: אָמָה என்பதற்கான இயல்பான தமிழ் மாற்றுச் சொற்களையும் அதன் சமூகநிலை சார்ந்த பொருள் வேறுபாட்டையும் காட்டுகிறது.
lexical_decisions:
- source_word: וְגַם
  choice: …மகனையும்
  rationale: וְגַם என்பதன் தொடர்ச்சி மற்றும் சேர்க்கைப் பொருளைத் தமிழில் இயல்பாகத் தெரிவிக்க ‘-உம்’ இணைப்பு பயன்படுத்தப்பட்டது.
- source_word: אֶת בֶּן הָאָמָה
  choice: அடிமைப் பெண்ணின் மகனை
  rationale: אָמָה என்பது தாழ்ந்த சமூக நிலையிலுள்ள பெண் அடிமை அல்லது பணிப்பெண்ணைக் குறிக்கிறது. ஆகாரின் கட்டுப்பட்ட சமூக நிலையை மென்மைப்படுத்தாமல் ‘அடிமைப் பெண்’ தெளிவாகக் காட்டுகிறது.
- source_word: לְגוֹי
  choice: ஒரு இனமாக
  rationale: שׂים உடன் வரும் לְ முடிவுநிலையைக் குறிக்கிறது. இங்கு גּוֹי என்பது அரசியல் அரசை மட்டும் அல்லாமல், அவரிடமிருந்து உருவாகும் தனித்த மக்களினத்தைக் குறிக்கிறது.
- source_word: אֲשִׂימֶנּוּ
  choice: ஆக்குவேன்
  rationale: שׂים என்பதன் ‘அமைத்தல்/ஆக்குதல்’ என்ற பொருள்களில், ஒருவரை ஓர் இனமாக உருவாகச் செய்வதை ‘ஆக்குவேன்’ இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இஸ்மவேலைக் குறித்த வாக்குறுதிக்கான காரணத்தை அறிமுகப்படுத்தும் காரணவியல் இணைப்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: זַרְעֲךָ
  choice: உன் சந்ததி
  rationale: זֶרַע இங்கு ஆபிரகாமின் வழித்தோன்றலை ஒருமைச் சுட்டுடன் குறிக்கிறது. ‘சந்ததி’ கூட்டுப் பொருளையும் குறிப்பிட்ட மகனைச் சுட்டும் சூழலையும் தக்கவைக்கிறது.
- source_word: הוּא
  choice: அவனும் … தான்
  rationale: எபிரெயத்தில் வெளிப்படையாக வரும் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழில் ‘அவனும்’ மற்றும் ‘தான்’ இயல்பாக வெளிப்படுத்துகின்றன; அவனும் ஆபிரகாமின் சந்ததியே என்பதே காரணம்.
theological_decisions:
- issue: אָמָה குறிக்கும் சமூக நிலை
  choice: அடிமைப் பெண்
  alternative: பணிப்பெண் / வேலைக்காரப் பெண்
  rationale: இந்தச் சூழலில் ஆகாரின் அடிமை நிலை கதைப்போக்கில் முக்கியமானது. ‘பணிப்பெண்’ என்பது அந்தக் கட்டுப்பட்ட நிலையைக் குறைவாகக் காட்டக்கூடும்; ஆகவே மூலத்தின் சமூக நிதர்சனம் மறைக்கப்படவில்லை.
- issue: இஸ்மவேல் ஆபிரகாமின் சந்ததி என்பதிலுள்ள வலியுறுத்தல்
  choice: அவனும் உன் சந்ததிதான்
  alternative: அவன் உன் சந்ததி
  rationale: וְגַם மற்றும் வெளிப்படையான הוּא இணைந்து, இஸ்மவேலும் ஆபிரகாமின் சந்ததி என்பதைக் காரணமாக வலியுறுத்துகின்றன. தமிழ் மொழியில் ‘அவனும் … தான்’ இதை இயல்பாகத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘தேசம்’ என்பதற்குப் பதில் மக்களினப் பொருளைத் தெளிவாக்க ‘இனம்’ பயன்படுத்தப்பட்டது; மூலத்தில் இல்லாத ‘பெரிய’ என்ற அடைமொழி சேர்க்கப்படவில்லை.
