source:
  edition: WLC
  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔וא וַ/יֹּ֣אמֶר אֲבִימֶ֗לֶךְ וּ/פִיכֹל֙ שַׂר צְבָא֔/וֹ אֶל אַבְרָהָ֖ם לֵ/אמֹ֑ר אֱלֹהִ֣ים עִמְּ/ךָ֔ בְּ/כֹ֥ל אֲשֶׁר אַתָּ֖ה עֹשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/022.yaml
  text: And it happened at that time that Abimelech and Phicol[a], the commander of his army, said to Abraham[b], “God is with you in all that you do.”
translation:
  language: ta
  text: 'அந்தக் காலத்தில், அபிமெலேக்கும் அவனுடைய படைத்தளபதியான பிகோலும் ஆபிரகாமிடம் கூறினார்கள்[b]: “நீ செய்கிற எல்லாவற்றிலும் கடவுள்[a] உன்னோடு இருக்கிறார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சூழலில் குறைவான சாத்தியமுள்ள மற்றொரு மொழிபெயர்ப்பு: “ஒரு தெய்வம் உன்னோடு இருக்கிறது.” எபிரெய אֱלֹהִים சில சூழல்களில் வேறு விதமாகப் புரிந்துகொள்ளப்படலாம்; ஆனால் இங்கு அது ஆபிரகாமை ஆசீர்வதிக்கும் கடவுளையே மிக இயல்பாகக் குறிக்கிறது.'
    reason: alternative_reading
  - marker: b
    text: எபிரெய மொழிநடையைச் சொற்சொல்லாகப் பின்பற்றினால், “ஆபிரகாமிடம் கூறி, சொல்லியதாவது” என அமையும். நேரடிப் பேச்சை அறிமுகப்படுத்தும் இந்த மறுபடிக் கூறல் இயல்பான தமிழில் விடப்பட்டுள்ளது.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: அந்தக் காலத்தில்
  rationale: புதிய நிகழ்வை அறிமுகப்படுத்தும் எபிரெயக் கதைநடையை இயல்பான நவீனத் தமிழில் காலக் குறிப்பாக வழங்குகிறது; பொருளற்ற கூடுதல் வினைச்சொல்லைத் தவிர்க்கிறது.
- source_word: אֲבִימֶלֶךְ וּפִיכֹל
  choice: அபிமெலேக்கும் ... பிகோலும்
  rationale: இரு பெயர்களையும் தமிழ் ஒலிபெயர்ப்பு மரபுக்கு ஏற்றவாறு வழங்கி, கூட்டெழுவாயை இயல்பான ‘-உம் ... -உம்’ அமைப்பில் காட்டுகிறது.
- source_word: שַׂר צְבָאוֹ
  choice: அவனுடைய படைத்தளபதியான
  rationale: שַׂר என்பது அதிகாரி அல்லது தளபதியையும், צָבָא இங்கு படையையும் குறிக்கிறது; ‘படைத்தளபதி’ தெளிவான நவீனத் தமிழ்.
- source_word: וַיֹּאמֶר ... אֶל־אַבְרָהָם לֵאמֹר
  choice: ஆபிரகாமிடம் கூறினார்கள்
  rationale: நேரடிப் பேச்சை அறிமுகப்படுத்தும் எபிரெய ‘கூறி/சொல்லும்படி’ சூத்திரத்தை தமிழில் தேவையற்ற மறுபடியாக்கமின்றி இயல்பாக வழங்குகிறது. வெளிப்படையான கூட்டெழுவாய்க்கு ஏற்ப பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இந்தச் சூழலில் ஆபிரகாமோடு இருந்து அவனை ஆசீர்வதிக்கும் ஒரே கடவுளையே இயல்பாகக் குறிக்கிறது; சொல்லின் பிற சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: עִמְּךָ
  choice: உன்னோடு இருக்கிறார்
  rationale: உடனிருத்தலையும் ஆதரவையும் வெளிப்படுத்தும் இயல்பான தமிழ் வடிவம்; கடவுளைக் குறிக்கும் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּכֹל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: நீ செய்கிற எல்லாவற்றிலும்
  rationale: முழுமையான பரப்பைக் குறிக்கும் எபிரெய அமைப்பையும், தொடர்ச்சியான பொதுச் செயலைக் குறிக்கும் பங்கேற்பு வடிவத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அபிமெலேக்கின் பேச்சில் אֱלֹהִים யாரைக் குறிக்கிறது
  choice: கடவுள்
  alternative: ஒரு தெய்வம்; தெய்வங்கள்
  rationale: אֱלֹהִים வடிவில் பன்மையாக இருந்தாலும், ஆபிரகாம்மீது இருக்கும் தெய்வீக ஆதரவை அபிமெலேக்கு உணர்வதே உடனடிச் சூழல். ஆகவே ‘கடவுள்’ மிகவும் இயல்பான வாசிப்பு; சாத்தியமான வேறு வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வந்தது’, ‘சேனாதிபதி’, ‘இதோ’ போன்ற பழமையான அல்லது தேவையற்ற வடிவங்கள் தவிர்க்கப்பட்டுள்ளன. பெயர்கள் பரவலான தமிழ் வேதாகம ஒலிபெயர்ப்பு மரபுக்கு நெருக்கமாக உள்ளன.
