base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/014.yaml
  text: So Abraham rose early in the morning and took bread and a skin of water and gave them to Hagar[a], putting them on her shoulder, along with the boy, and sent her away. And she went and wandered in the wilderness of Beersheba.
translation:
  language: ta
  text: ஆபிரகாம் அதிகாலையில் எழுந்து, அப்பத்தையும் தண்ணீர் நிறைந்த ஒரு தோற்பையையும் எடுத்து ஆகாருக்குக் கொடுத்தார்; அவற்றை அவளுடைய தோளின்மேல் வைத்தார். சிறுவனுடன் அவளை அனுப்பிவிட்டார். அவள் புறப்பட்டுப்போய், பெயெர்செபாவின் வனாந்தரத்தில் அலைந்தாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר
  choice: ஆபிரகாம் அதிகாலையில் எழுந்து
  rationale: שׁכם என்பதன் ஹிபில் வடிவம் அதிகாலையில் எழுவதைச் சுட்டுகிறது; தமிழில் இயல்பாகவும் கால வலியுறுத்தலைக் காத்தும் இவ்வாறு மொழிபெயர்க்கப்படுகிறது.
- source_word: לֶחֶם
  choice: அப்பம்
  rationale: இங்கு சொல்லின் நேரடிப் பொருளான ‘அப்பம்’ போதுமானது; பொதுவாக ‘உணவு’ என்று விரிவுபடுத்தத் தேவையில்லை.
- source_word: חֵמַת מַיִם
  choice: தண்ணீர் நிறைந்த ஒரு தோற்பை
  rationale: חֵמֶת என்பது திரவம் வைக்கப் பயன்படும் தோலால் செய்யப்பட்ட பை; ‘தோற்பை’ பொருளையும் பண்டைய சூழலையும் தெளிவாகத் தருகிறது.
- source_word: שָׂם עַל שִׁכְמָהּ
  choice: அவற்றை அவளுடைய தோளின்மேல் வைத்தார்
  rationale: சுருக்கமான எபிரெய தொடரில் தோளின்மேல் வைக்கப்பட்டவை முன்சொல்லப்பட்ட அப்பமும் தோற்பையும் என இயல்பாகப் புரிகிறது.
- source_word: וְאֶת הַיֶּלֶד
  choice: சிறுவனையும் அவளிடம் ஒப்படைத்து
  rationale: எபிரெயம் ‘சிறுவனையும்’ என்று மட்டும் சேர்க்கிறது. தமிழில் வாக்கிய உறவைத் தெளிவாக்க ‘அவளிடம் ஒப்படைத்து’ என வழங்குவது, அவனையும் தோளில் வைத்ததாகத் தவறாகப் புரிந்துகொள்வதைத் தவிர்க்கிறது; மூலத்தின் சுருக்கம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: וַיְשַׁלְּחֶהָ
  choice: அவளை அனுப்பிவிட்டார்
  rationale: שלח என்பதன் சூழலுக்குரிய பொருளான அனுப்பிவிடுதல் இயல்பாகவும் கண்ணியமாகவும் வெளிப்படுகிறது.
- source_word: וַתֵּתַע
  choice: வழிதவறி அலைந்தாள்
  rationale: תעה என்பது வழிதவறுதல் அல்லது அலைதல் என்ற இரு நெருங்கிய நுணுக்கங்களையும் கொண்டது; இணைந்த தமிழ் சொற்றொடர் சூழலில் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּמִדְבַּר בְּאֵר שָׁבַע
  choice: பெயெர்செபாவின் வனாந்தரத்தில்
  rationale: מִדְבָּר என்பதற்கு ‘வனாந்தரம்’ என்பது மணற்பாலை என்ற குறுகிய எண்ணத்தைத் தவிர்க்கும் வழக்கமான வேதாகமத் தமிழ்; பெயெர்செபா இடப்பெயரின் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: ‘சிறுவன்’ என்ற சொற்றொடருக்கும் ‘தோளின்மேல் வைத்தார்’ என்பதற்கும் இடையிலான தொடரியல் உறவு
  choice: உணவுப் பொருட்கள் ஆகாரின் தோளின்மேல் வைக்கப்பட்டன; சிறுவன் அவளிடம் ஒப்படைக்கப்பட்டு அவளோடு அனுப்பப்பட்டான்.
  alternative: ஆபிரகாம் உணவுப் பொருட்களோடு சிறுவனையும் ஆகாரின் தோளின்மேல் வைத்தார்; அல்லது உணவுப் பொருட்களையும் சிறுவனையும் அவளுக்குக் கொடுத்தார்.
  rationale: எபிரெயத் தொடர் சுருக்கமாக இருப்பதால் இலக்கண உறவு முழுமையாக வெளிப்படவில்லை. பரந்த கதைச்சூழலில் சிறுவனின் வயதைக் கருத்தில் கொண்டால், அவனை உடலளவில் தோளின்மேல் வைத்ததாக மொழிபெயர்ப்பது வாசகரைத் தவறாக வழிநடத்தலாம். ஆகவே முதன்மை உரை இயல்பான பொருளைத் தருகிறது; உண்மையான தொடரியல் தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்பம்’, ‘தோற்பை’, ‘வனாந்தரம்’ ஆகியவை மூலச் சூழலைக் காக்கின்றன; சுருக்கமான எபிரெய தொடரின் தெளிவின்மை [a] அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
