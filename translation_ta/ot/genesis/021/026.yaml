  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ לֹ֣א יָדַ֔עְתִּי מִ֥י עָשָׂ֖ה אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/גַם אַתָּ֞ה לֹא הִגַּ֣דְתָּ לִּ֗/י וְ/גַ֧ם אָנֹכִ֛י לֹ֥א שָׁמַ֖עְתִּי בִּלְתִּ֥י הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/026.yaml
  text: And Abimelech said[a], “I did not know who had done this thing. You also did not tell me, and I myself had not heard of it until today.”
translation:
  language: ta
  text: அபிமெலேக்கு, “இந்தக் காரியத்தை[a] யார் செய்தார் என்று எனக்குத் தெரியவில்லை. நீயும் என்னிடம் சொல்லவில்லை; நானும்கூட இன்றைக்கு முன்பு இதைப் பற்றிக் கேள்விப்பட்டதில்லை” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்த விஷயத்தை’ அல்லது ‘இந்தச் செயலை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல்லான דָּבָר (தாவார்) ஒரு காரியம், விஷயம் அல்லது நிகழ்வைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: வாவ் தொடர்கதை வடிவம் நிகழ்வை முன்னெடுத்துச் செல்கிறது. தமிழில் பேச்சுக்குப் பின் வரும் ‘என்றான்’ இயல்பான கதைநடை வடிவமாகும்.
- source_word: אֲבִימֶלֶךְ
  choice: அபிமெலேக்கு
  rationale: தனிப்பெயர் தமிழின் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப வழங்கப்பட்டுள்ளது.
- source_word: לֹא יָדַעְתִּי
  choice: எனக்குத் தெரியவில்லை
  rationale: அபிமெலேக்கின் அதுவரையிலான அறியாமையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: מִי עָשָׂה
  choice: யார் செய்தார்
  rationale: செயலைச் செய்தவர் யார் என்ற கேள்வியை நேரடியாகவும் மரியாதை ஒருமையுடனும் வெளிப்படுத்துகிறது.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: இந்தக் காரியத்தை
  rationale: דָּבָר இங்கு விவாதிக்கப்படும் சம்பவம் அல்லது செயலைக் குறிக்கிறது; ‘காரியம்’ அதன் பொருள் பரப்பைத் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: וְגַם אַתָּה
  choice: நீயும்
  rationale: גַּם தரும் சேர்த்தல் மற்றும் வலியுறுத்தலை ‘-உம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא הִגַּדְתָּ לִּי
  choice: என்னிடம் சொல்லவில்லை
  rationale: הגיד என்பதன் ‘தெரிவித்தல்/சொல்லுதல்’ பொருளை உரையாடலுக்கேற்ற எளிய தமிழில் தருகிறது.
- source_word: וְגַם אָנֹכִי
  choice: நானும்கூட
  rationale: גַּם மற்றும் முழுவடிவமான אָנֹכִי ஆகியவற்றின் சேர்த்தல், சுயவலியுறுத்தல் ஆகிய இரண்டையும் தக்கவைக்கிறது.
- source_word: לֹא שָׁמַעְתִּי
  choice: இதைப் பற்றிக் கேள்விப்பட்டதில்லை
  rationale: இங்கு ‘கேட்டல்’ என்பது சம்பவத்தைப் பற்றிய செய்தி அறிதலைக் குறிக்கிறது; தமிழில் ‘கேள்விப்படுதல்’ அதற்கான இயல்பான இணை.
- source_word: בִּלְתִּי הַיּוֹם
  choice: இன்றைக்கு முன்பு
  rationale: இன்றுதான் முதன்முறையாக அறிந்ததாகிய கால எல்லையைத் தெளிவாகக் காட்டுகிறது; ‘இன்றுவரை’ என்பதில் இன்று சேருமா என்ற தமிழ் மயக்கத்தைத் தவிர்க்கிறது.
