  yaml_path: translation/ot/genesis/021/029.yaml
  text: And Abimelech said to Abraham[a], “What are these seven ewe lambs that you have set apart by themselves?”
translation:
  language: ta
  text: அபிமெலேக்கு ஆபிரகாமிடம், “நீ தனியே வைத்திருக்கும் இந்த ஏழு பெண் ஆட்டுக்குட்டிகள் என்ன?” என்று கேட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ தனியே நிறுத்திவைத்திருக்கும் இந்த ஏழு பெண் ஆட்டுக்குட்டிகள் என்ன?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்று கேட்டான்
  rationale: எபிரெயச் சொல் பொதுவாக ‘சொன்னான்’ எனப் பொருள்படும்; ஆனால் கேள்வி வாக்கியத்தை அறிமுகப்படுத்துவதால், இயல்பான தமிழில் ‘என்று கேட்டான்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֲבִימֶלֶךְ אֶל־אַבְרָהָם
  choice: அபிமெலேக்கு ஆபிரகாமிடம்
  rationale: பெயர்கள் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பில் தரப்பட்டு, உரையாடலின் முகவரியை ‘-ிடம்’ தெளிவாகக் காட்டுகிறது.
- source_word: מָה הֵנָּה
  choice: எதற்காக?
  rationale: சொல்லாட்சிப்படி ‘இவை என்ன?’ எனலாம். இங்கு விலங்குகள் என்ன என்பதல்ல, அவை தனியே வைக்கப்பட்டதன் பொருள் அல்லது நோக்கம் என்ன என்பதே கேள்வி; அதனால் இயல்பான தமிழில் ‘எதற்காக?’ எனத் தரப்பட்டது, அடிப்படை வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שֶׁבַע כְּבָשֹׂת הָאֵלֶּה
  choice: இந்த ஏழு பெண் ஆட்டுக்குட்டிகள்
  rationale: כְּבָשֹׂת என்பது பெண்பால் பன்மை; ‘பெண் ஆட்டுக்குட்டிகள்’ பாலினத் தனித்தன்மையையும் இளவயதையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר הִצַּבְתָּ לְבַדָּנָה
  choice: நீ தனியாக நிறுத்திவைத்திருக்கும்
  rationale: הִצַּבְתָּ என்பது ‘நிறுத்து/வை’ என்றும், לְבַדָּנָה என்பது ‘தனியாக’ என்றும் பொருள்படும். இரண்டையும் தனித்தனியாக வெளிப்படுத்துவது, ‘தனியே பிரித்துவைத்தல்’ என்ற சூழல்சார் கருத்தை மிகைப்படுத்தாமல் தருகிறது.
