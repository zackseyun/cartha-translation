id: GEN.21.1
reference: Genesis 21:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַֽ/יהוָ֛ה פָּקַ֥ד אֶת שָׂרָ֖ה כַּ/אֲשֶׁ֣ר אָמָ֑ר וַ/יַּ֧עַשׂ יְהוָ֛ה לְ/שָׂרָ֖ה כַּ/אֲשֶׁ֥ר דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/001.yaml
  text: Yahweh visited Sarah as he had said[a], and Yahweh did for Sarah as he had spoken.
translation:
  language: ta
  text: யாவே தாம் சொன்னபடியே சாராவைச் சந்தித்தார்[a], தாம் உரைத்தபடியே சாராவுக்காகச் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சாராவைக் கனிவுடன் கவனித்தார்” என்றும் மொழிபெயர்க்கலாம். இந்த எபிரெய வினை, ஒருவரின் நன்மைக்காகச் செயல்படும்படி கடவுள் அவர்மீது தமது கவனத்தைத் திருப்புவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறை திருப்பெயரான நான்கெழுத்துப் பெயரைப் பொதுவாக அறியப்படும் தமிழ் ஒலிபெயர்ப்பில் தருகிறது; ‘கர்த்தர்’ என்ற பட்டப்பெயராக மாற்றவில்லை.
- source_word: פָּקַד
  choice: கனிவுடன் கவனித்தார்
  rationale: இங்கு வெறுமனே பார்த்தல் அல்ல, சாராவின் நன்மைக்காக அவர்மீது கவனம் செலுத்திச் செயல்பட்ட இறை அருளைச் சூழல் உணர்த்துகிறது. வினையின் விளைவை அடுத்த வசனத்திற்கு முன்கூட்டியே மிகத் தெளிவுபடுத்தாமல் வைத்திருக்கிறது.
- source_word: כַּאֲשֶׁר אָמָר
  choice: தாம் சொன்னபடியே
  rationale: முன்பு வழங்கப்பட்ட இறைவாக்கைக் குறிப்பதோடு, தமிழில் இயல்பான நிறைவேற்றச் சொல்லாட்சியாக அமைகிறது.
- source_word: וַיַּעַשׂ ... לְשָׂרָה
  choice: சாராவுக்காகச் செயல்பட்டார்
  rationale: עָשָׂה என்பதன் பொதுவான பொருளையும், לְ என்பதன் சாராவுக்கு நன்மை பயக்கும் நோக்கையும் காக்கிறது.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: தாம் உரைத்தபடியே
  rationale: முதல் அரையடியில் உள்ள אָמַר என்பதற்கான ‘சொன்னார்’ என்பதிலிருந்து மென்மையாக வேறுபடுத்தி, எபிரெய இணைநிலையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறை திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட இறை திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது. நவீன ஆய்வில் ‘யாவே’ என்ற ஒலிப்பும் பயன்பட்டாலும், தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: פקד என்பதில் உள்ள இறைச் செயலின் இயல்பு
  choice: கனிவுடன் கவனித்தார்
  alternative: சந்தித்தார்; நினைவுகூர்ந்தார்; அக்கறை கொண்டார்
  rationale: இது வெறும் வருகையையோ மனநினைவையோ அல்லாமல், வாக்குறுதியை நிறைவேற்றும் பயனுள்ள இறைக் கவனத்தை இச்சூழலில் குறிக்கிறது; அதேவேளையில் அடுத்த வசனத்தின் நிகழ்வை இவ்வசனத்திற்குள் வெளிப்படையாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ். ‘தாம்’ என்பது இறைவனைச் சுட்டும் இயல்பான மரியாதை ஒருமை; மூலத்தின் இரு இணையான கூறுகளும், ‘சொன்னார்/உரைத்தார்’ என்ற நுண்ணிய சொல் வேறுபாடும் காக்கப்பட்டுள்ளன.
