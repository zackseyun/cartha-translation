- from: யெகோவா தாம் சொன்னபடியே சாராவைக் கனிவுடன் கவனித்து[a], தாம் உரைத்தபடியே சாராவுக்காகச் செயல்பட்டார்.
  to: யாவே தாம் சொன்னபடியே சாராவைச் சந்தித்தார்[a], தாம் உரைத்தபடியே சாராவுக்காகச் செய்தார்.
  rationale: The revision aligns the divine name with the project’s Yahweh policy, removes an unstated emotional intensifier, and retains the Hebrew’s broad wording and parallelism. The footnote preserves the contextual interpretation of פָּקַד without making it an over-specified assertion in the text.
