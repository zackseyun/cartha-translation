base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/020.yaml
  text: God was with the boy[a], and he grew. He lived in the wilderness and became an archer.
translation:
  language: ta
  text: கடவுள் அந்தப் பையனோடு இருந்தார்; அவன் வளர்ந்தான். அவன் வனாந்தரத்தில் வாழ்ந்து, வில்லாளியானான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வில் எய்பவனானான்.” எபிரெயச் சொற்றொடர் சொல்லர்த்தமாக வில்லால் எய்பவனைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אֱלֹהִים אֶת הַנַּעַר
  choice: கடவுள் அந்தப் பையனோடு இருந்தார்
  rationale: היה את என்ற எபிரெய மரபுத்தொடர் உடனிருத்தலையும் ஆதரவையும் குறிக்கிறது. தமிழில் இயல்பாகவும், இஸ்மவேலுக்கான கடவுளின் உடனிருப்பை மேலதிகமாக விளக்காமலும் இவ்வாறு மொழிபெயர்க்கப்படுகிறது.
- source_word: הַנַּעַר
  choice: அந்தப் பையன்
  rationale: נַעַר என்பது பையன் அல்லது இளைஞனைக் குறிக்கலாம். உடனடி சூழலில் முன்பே குறிப்பிடப்பட்ட இஸ்மவேலைச் சுட்டுவதால், நவீனத் தமிழில் ‘அந்தப் பையன்’ தெளிவானது.
- source_word: וַיִּגְדָּל
  choice: அவன் வளர்ந்தான்
  rationale: גדל இச்சூழலில் உடல் வளர்ச்சியையும் முதிர்ச்சியையும் குறிக்கிறது. ‘வளர்ந்தான்’ என்பது சுருக்கமானதும் மூலத்தின் பொருள் வரம்பை மீறாததும் ஆகும்.
- source_word: וַיֵּשֶׁב בַּמִּדְבָּר
  choice: அவன் வனாந்தரத்தில் வாழ்ந்து
  rationale: ישב என்பது இங்கு தொடர்ந்து வசித்தலைக் குறிக்கிறது; מִדְבָּר என்பது வெறும் மணற்பாலைவனத்தை மட்டும் அல்லாமல் மக்கள் குடியிருப்பு குறைந்த காட்டுப்புறப் பகுதியையும் குறிக்கலாம். ‘வனாந்தரம்’ அந்த விரிவைத் தக்கவைக்கிறது.
- source_word: וַיְהִי רֹבֶה קַשָּׁת
  choice: வில்லாளியானான்
  rationale: இச்சொற்றொடர் வில்லால் எய்பவனாக ஆனதை அல்லது அத்திறமையால் அறியப்பட்டவனானதைச் சொல்கிறது. ‘வில்லாளி’ என்பது இயல்பான, சுருக்கமான நவீனத் தமிழ் இணைச்சொல்.
theological_decisions:
- issue: இஸ்மவேலுடன் கடவுள் இருந்தார் என்ற கூற்று
  choice: கடவுள் அந்தப் பையனோடு இருந்தார்
  alternative: கடவுள் அந்தப் பையனுக்கு உதவினார் / அவனுக்கு ஆதரவாக இருந்தார்
  rationale: மூலம் கடவுளின் உடனிருப்பையும் அதில் உள்ள ஆதரவையும் உறுதிப்படுத்துகிறது; ஆனால் அதன் விரிவான இறையியல் விளைவுகளை விவரிப்பதில்லை. ஆகவே உடனிருப்பு மொழி அப்படியே காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘வனாந்தரம்’ என்ற சொல் வேதாகமச் சூழலின் பரந்த நிலப்பரப்புப் பொருளைக் காக்கிறது; ‘வில்லாளி’ தற்போதைய தமிழில் தெளிவானது.
