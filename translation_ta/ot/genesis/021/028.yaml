  text: וַ/יַּצֵּ֣ב אַבְרָהָ֗ם אֶת שֶׁ֛בַע כִּבְשֹׂ֥ת הַ/צֹּ֖אן לְ/בַדְּ/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/028.yaml
  text: And Abraham set seven ewe lambs of the flock by themselves[a].
translation:
  language: ta
  text: ஆபிரகாம் மந்தையின் ஏழு பெண் ஆட்டுக்குட்டிகளைத் தனியாக வைத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மந்தையின் ஏழு பெண் ஆட்டுக்குட்டிகளைத் தனியே பிரித்து வைத்தார்.” எபிரெய வினைச்சொல் அவற்றைத் தனி இடத்தில் வைப்பதைக் குறிக்கலாம்; உடன்படிக்கைக்குச் சாட்சியாக அவை பயன்படும் இச்சூழலில் இது முக்கியத்துவம் பெறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: நிறுத்தினார்
  rationale: נצב என்பதன் ஹிபீல் வடிவம் ஒன்றை நிற்கச் செய்தல் அல்லது குறிப்பிட்ட இடத்தில் வைத்தல் என்ற பொருளைத் தருகிறது. ‘நிறுத்தினார்’ என்பது இங்குள்ள தெளிவான உடல் செயல்பாட்டை இயல்பாகத் தெரிவிக்கிறது; நோக்கத்தை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: אַבְרָהָם
  choice: ஆபிரகாம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: אֶת
  choice: '[நேரடி செயப்படுபொருள் குறியீடு; தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: எபிரெய நேரடி செயப்படுபொருள் குறியீட்டுக்குத் தமிழில் தனிச் சொல் தேவையில்லை; வேற்றுமை உருபும் வாக்கிய அமைப்பும் அதன் பணியை நிறைவேற்றுகின்றன.
- source_word: שֶׁבַע
  choice: ஏழு
  rationale: பின்வரும் பெயர்ச்சொல்லைக் குறிக்கும் நேரடியான எண்ணுப்பெயர்.
- source_word: כִּבְשֹׂת
  choice: பெண் ஆட்டுக்குட்டிகள்
  rationale: இந்தச் சொல் குறிப்பாகப் பெண்பாலான இளம் ஆடுகளைக் குறிக்கிறது. இத்தேர்வு பாலையும் இளமையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הַצֹּאן
  choice: மந்தையிலிருந்த
  rationale: צֹאן என்பது ஆடுகள் மற்றும் வெள்ளாடுகள் அடங்கக்கூடிய சிறு கால்நடை மந்தையைக் குறிக்கும் கூட்டுப்பெயர். ‘மந்தை’ அதன் பரப்பைத் தேவையின்றிக் குறுக்காமல், இங்கு இயல்பாக அமைகிறது.
- source_word: לְבַדְּהֶן
  choice: தனியே
  rationale: அந்த ஏழு குட்டிகளும் மற்ற மந்தையிலிருந்து பிரிக்கப்பட்ட நிலையில் வைக்கப்பட்டதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
