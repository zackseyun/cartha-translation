translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘பெண் ஆட்டுக்குட்டிகள்’ என்பது மூலத்தின் பாலின மற்றும் வயது நுணுக்கத்தைப் பாதுகாக்கிறது; ‘தனியே நிறுத்தினார்’ என்பது உடல் செயலை முன்னிறுத்தி, உடன்படிக்கை நோக்கத்தை முதன்மை உரையிலேயே முன்கூட்டித் தீர்மானிப்பதைத் தவிர்க்கிறது.
