id: GEN.21.33
reference: Genesis 21:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּטַּ֥ע אֶ֖שֶׁל בִּ/בְאֵ֣ר שָׁ֑בַע וַ/יִּ֨קְרָא שָׁ֔ם בְּ/שֵׁ֥ם יְהוָ֖ה אֵ֥ל עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/033.yaml
  text: And he planted a tamarisk tree in Beersheba[a], and there he called on the name of Yahweh[b], the Everlasting God.
translation:
  language: ta
  text: அவர் பேர்செபாவில் ஒரு தாமரிஸ்கு மரத்தை நட்டார். அங்கே அவர் யாவே, என்றுமுள்ள கடவுள் என்பவரின்[b] பெயரைக் கூப்பிட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யாவேயின் பெயரை அறிவித்தார்,’ அல்லது ‘யாவேயின் பெயரைச் சொல்லி வேண்டினார்.’ எபிரெய வழக்குச் சொற்றொடர், வழிபாட்டுச் சூழலில் அறிவித்தல் மற்றும் வேண்டுதல் ஆகிய இரு பொருள்களையும் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நித்திய கடவுள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: நட்டார்
  rationale: נטע என்பதன் இயல்பான பொருள் ‘நடுதல்’; மரத்தை நிலத்தில் நட்டு வளர்ப்பதை இங்கு தெளிவாகக் குறிக்கிறது.
- source_word: אֶשֶׁל
  choice: தாமரிஸ்கு மரம்
  rationale: ஒருமையில் உள்ள אֶשֶׁל ஒரு குறிப்பிட்ட மரவகையை, பெரும்பாலும் tamarisk-ஐ, குறிக்கிறது. பொதுவான ‘மரம்’ அல்லது பழைய மரபிலுள்ள ‘தோப்பு’ என்பவற்றைவிட இத்தேர்வு மூலத்தின் குறிப்புத்தன்மையைப் பேணுகிறது.
- source_word: בִּבְאֵר שָׁבַע
  choice: பேர்செபாவில்
  rationale: இடப்பெயருடன் வரும் בְּ இங்கு இருப்பிடத்தைக் குறிக்கிறது; ‘பேர்செபா’ தமிழில் நிலைபெற்ற வேதாகம இடப்பெயர் வடிவம்.
- source_word: וַיִּקְרָא שָׁם בְּשֵׁם
  choice: அங்கே ... பெயரைச் சொல்லி அழைத்தார்
  rationale: קרא בשם என்ற எபிரெய வழக்குச் சொற்றொடரின் வடிவத்தை இயன்றவரைத் தக்கவைத்தபடி, வழிபாட்டுச் சூழலில் வேண்டுதல், கூப்பிடுதல், அல்லது அறிவித்தல் ஆகிய நுண்பொருள்களுக்கு இடமளிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, எபிரெயத்தின் தனிப்பட்ட இறைப் பெயர்; ஆகவே ‘ஆண்டவர்’ என மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֵל עוֹלָם
  choice: என்றுமுள்ள கடவுள்
  rationale: אֵל என்பது ‘கடவுள்’; עוֹלָם இங்கு முடிவற்ற நிலைத்திருப்பைக் குறிக்கிறது. ‘என்றுமுள்ள கடவுள்’ என்பது இயல்பான நவீனத் தமிழில் அந்தப் பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலவசனம் நான்கு எழுத்து இறைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயரால் மாற்றாமல் தனிப்பட்ட பெயராக ஒலிபெயர்க்கப்பட்டது.
- issue: קרא בשם יהוה என்ற வழிபாட்டு மொழிநடையின் பொருள்
  choice: யாவேயின் பெயரைச் சொல்லி அழைத்தார்
  alternative: யாவேயின் பெயரை அறிவித்தார் / யாவேயின் பெயரைச் சொல்லி வேண்டினார்
  rationale: இச்சொற்றொடர் வழிபாட்டுச் சூழலில் வேண்டுதலையும் அறிவித்தலையும் உள்ளடக்கக்கூடும். ஒன்றை மட்டும் தேர்ந்து பொருளைச் சுருக்காமல், மூல மொழிநடையின் திறந்த தன்மை பேணப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட உரைநடை பயன்படுத்தப்பட்டது. ‘தாமரிஸ்கு’ என்பது தாவரவகையின் குறிப்புத்தன்மையைப் பேணும் ஒலிபெயர்ப்பு. இறைப் பெயர் ‘யாவே’ எனத் தரப்பட்டது; வழிபாட்டு மொழிநடையின் உண்மையான பொருள் விரிவை அடிக்குறிப்பு விளக்குகிறது.
