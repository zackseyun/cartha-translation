revisions:
- from: அவர் பேர்செபாவில் ஒரு தாமரிஸ்கு மரத்தை நட்டார். அங்கே, என்றுமுள்ள கடவுளாகிய[b] யாவேயின் பெயரைச் சொல்லி அழைத்தார்.[a]
  to: அவர் பேர்செபாவில் ஒரு தாமரிஸ்கு மரத்தை நட்டார். அங்கே அவர் யாவே, என்றுமுள்ள கடவுள் என்பவரின்[b] பெயரைக் கூப்பிட்டார்.[a]
  rationale: The revision improves the naturalness of the Tamil worship expression without narrowing the Hebrew idiom’s possible senses; those senses remain documented in footnote a. It also presents ‘Yahweh, the Everlasting God’ as a clear apposition and repairs the incomplete alternative in footnote b.
