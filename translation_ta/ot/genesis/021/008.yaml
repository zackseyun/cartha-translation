  yaml_path: translation/ot/genesis/021/008.yaml
  text: The boy grew and was weaned[b][a], and Abraham made a great feast on the day Isaac was weaned.
translation:
  language: ta
  text: குழந்தை வளர்ந்து பால்மறந்தது. ஈசாக்கு பால்மறந்த நாளில் ஆபிரகாம் ஒரு பெரிய விருந்து வைத்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: வளர்ந்து
  rationale: גדל என்பது இங்கு குழந்தையின் உடல் வளர்ச்சியையும் முதிர்ச்சியையும் குறிக்கிறது; ‘வளர்ந்து’ என்பது இயல்பான, சுருக்கமான தமிழ் இணை.
- source_word: הַיֶּלֶד
  choice: குழந்தை
  rationale: יֶלֶד என்பது ஆண் குழந்தையையோ பொதுவாகக் குழந்தையையோ குறிக்கலாம். பால்மறக்கும் பருவத்தைச் சுட்டும் இச்சூழலில் ‘குழந்தை’ இயல்பாகவும் பாலினத்தைத் தேவையின்றி வலியுறுத்தாமலும் உள்ளது.
- source_word: וַיִּגָּמַל
  choice: பால்மறந்தது
  rationale: גמל என்பதன் நிஃபால் வடிவம் இங்கு தாய்ப்பால் அருந்துவது நிறுத்தப்பட்டதைக் குறிக்கிறது. ‘பால்மறந்தது’ என்பது நிலையான தமிழ் வேதாகம மற்றும் பொதுப் பயன்பாட்டுச் சொல்.
- source_word: וַיַּעַשׂ
  choice: வைத்தார்
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்தார்’ என்றாலும், விருந்துடன் சேரும்போது தமிழில் ‘விருந்து வைத்தார்’ என்பதே இயல்பான சொல்லிணைவு.
- source_word: מִשְׁתֶּה גָדוֹל
  choice: ஒரு பெரிய விருந்து
  rationale: מִשְׁתֶּה கொண்டாட்ட உணவு அல்லது விருந்தைக் குறிக்கிறது; גָדוֹל அதன் சிறப்பையும் பெருமளவையும் தெரிவிக்கிறது. ‘பெரிய விருந்து’ இரண்டையும் இயல்பாகத் தருகிறது.
- source_word: בְּיוֹם
  choice: நாளில்
  rationale: בְּיוֹם என்ற காலக் கட்டமைப்பை ‘நாளில்’ நேரடியாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: הִגָּמֵל אֶת יִצְחָק
  choice: ஈசாக்கு பால்மறந்த
  rationale: இந்த எபிரெயக் கட்டமைப்பு ஈசாக்கின் பால்மறப்பு நிகழ்வைக் குறிக்கிறது. தமிழில் செயப்பாட்டு வடிவத்தை வற்புறுத்தாமல் ‘ஈசாக்கு பால்மறந்த நாள்’ என இயல்பாகத் தெரிவிக்கலாம்.
