  text: וַ/יִּפְקַ֤ח אֱלֹהִים֙ אֶת עֵינֶ֔י/הָ וַ/תֵּ֖רֶא בְּאֵ֣ר מָ֑יִם וַ/תֵּ֜לֶךְ וַ/תְּמַלֵּ֤א אֶת הַ/חֵ֨מֶת֙ מַ֔יִם וַ/תַּ֖שְׁקְ אֶת הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/019.yaml
  text: Then God opened her eyes[a], and she saw a well of water. She went and filled the skin with water and gave the boy a drink.
translation:
  language: ta
  text: 'அப்போது கடவுள் அவளுடைய கண்களைத் திறந்தார். அவள் ஒரு தண்ணீர்க் கிணற்றைக் கண்டாள். அவள் போய், அந்தத் தோற்பையில்[a] தண்ணீர் நிரப்பி, சிறுவனுக்குக் குடிக்கக் கொடுத்தாள்.


    [a] அதாவது, திரவத்தை எடுத்துச் செல்ல விலங்குத் தோலால் செய்யப்பட்ட பை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, திரவத்தை எடுத்துச் செல்ல விலங்குத் தோலால் செய்யப்பட்ட பை.
    reason: חֵמֶת என்ற எபிரெயச் சொல் சாதாரண தோலை அல்ல, திரவம் எடுத்துச் செல்லப் பயன்படுத்திய தோல் கொள்கலனைக் குறிக்கிறது என்பதை விளக்குகிறது. ஆங்கில ஆலோசனை உரையில் குறிப்பு குறியீடு ‘கண்கள்’ என்பதற்குப் பின் இருப்பது அதன் குறிப்பு உள்ளடக்கத்துடன் பொருந்தாததால், பொருத்தமான ‘தோற்பை’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
lexical_decisions:
- source_word: וַיִּפְקַח
  choice: திறந்தார்
  rationale: פקח என்பது, குறிப்பாகக் கண்களைப் பற்றிப் பேசும்போது, ‘திறத்தல்’ என்று பொருள்படும். ‘கண்களைத் திறந்தார்’ என்பது எபிரெய உருவகத்தை இயல்பான தமிழில் காத்து, அவள் காணும்படி கடவுள் செய்தார் என்ற விளைவை விளக்கிச் சுருக்காமல் விடுகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு ஒருமை வினையுடன் வரும் אֱלֹהִים, கதையில் ஒரே கடவுளைக் குறிக்கிறது.
- source_word: עֵינֶיהָ
  choice: அவளுடைய கண்களை
  rationale: எபிரெய நேரடி செயப்படுபொருளையும் பன்மையான ‘கண்கள்’ என்ற சொல்லாட்சியையும் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: וַתֵּרֶא
  choice: அவள் ... கண்டாள்
  rationale: ראה என்பதன் நேரடியான கதைநடைப் பொருள் ‘காணுதல்’; முந்தைய ‘கண்களைத் திறந்தார்’ என்ற செயலுக்குப் பின்வரும் நிகழ்வை இது தெளிவாகக் காட்டுகிறது.
- source_word: בְּאֵר מָיִם
  choice: ஒரு தண்ணீர்க் கிணறு
  rationale: இந்தச் சொற்றொடர் நேரடியாக ‘தண்ணீரின் கிணறு’ எனப் பொருள்படும். நவீன தமிழில் ‘தண்ணீர்க் கிணறு’ இயல்பாக இருப்பதுடன், உயிர்காக்கும் தண்ணீரைக் கண்டதை வலியுறுத்துகிறது.
- source_word: וַתֵּלֶךְ
  choice: அவள் போய்
  rationale: தொடர்ச்சியான கதைநடைச் செயலை இயல்பான தமிழில் இணைக்கிறது.
- source_word: וַתְּמַלֵּא
  choice: நிரப்பி
  rationale: מלא என்பதற்கான வழக்கமான பொருள் ‘நிரப்புதல்’; அடுத்த செயலைத் தமிழில் இயல்பாக இணைக்க வினையெச்சம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַחֵמֶת
  choice: அந்தத் தோற்பையில்
  rationale: חֵמֶת என்பது திரவத்தை எடுத்துச் செல்லப் பயன்பட்ட தோலால் செய்யப்பட்ட கொள்கலனைக் குறிக்கிறது. முந்தைய சூழலில் குறிப்பிடப்பட்ட அதே பை என்பதால் எபிரெய சுட்டுத்தன்மையை ‘அந்த’ காக்கிறது; ‘தோற்பை’ பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: מַיִם
  choice: தண்ணீர்
  rationale: நிரப்பப்பட்ட பொருளை நேரடியாகக் குறிக்கிறது; ‘தோற்பையில் தண்ணீர் நிரப்பி’ என்பது இயல்பான தமிழ் அமைப்பு.
- source_word: וַתַּשְׁקְ
  choice: குடிக்கக் கொடுத்தாள்
  rationale: שׁקה என்பதன் ஹிஃபில் வடிவம் ‘குடிக்கக் கொடுத்தல்’ அல்லது ‘குடிக்கச் செய்தல்’ என்று பொருள்படும். தேர்ந்த வடிவம் காரணவினைப் பொருளை இயல்பாகத் தருகிறது.
- source_word: הַנַּעַר
  choice: சிறுவனுக்கு
  rationale: இங்கு נַעַר ஆகாரின் மகன் இஸ்மவேலைக் குறிக்கிறது. சூழலுக்கு ஏற்ற, இன்றைய தமிழில் எளிதில் புரியும் சொல் ‘சிறுவன்’.
theological_decisions:
- issue: ‘கடவுள் அவளுடைய கண்களைத் திறந்தார்’ என்பதை நேரடியான தெய்வச் செயலாக மொழிபெயர்ப்பதா, அல்லது ஏற்கெனவே இருந்த கிணற்றை அவள் கவனித்ததாக மட்டும் விளக்குவதா
  choice: கடவுள் அவளுடைய கண்களைத் திறந்தார்
  alternative: கடவுள் அவள் கிணற்றைக் கவனிக்கும்படி செய்தார் / அவள் காணும்படி கடவுள் செய்தார்
  rationale: எபிரெய உரை கண்களைத் திறந்த செயலைக் கடவுளுக்கே நேரடியாக உரித்தாக்குகிறது. அதன் செயல்முறை என்ன என்பதை விளக்காமல், தெய்வச் செயலையும் உரையின் திட்டமிட்ட தெளிவின்மையையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிய, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான எபிரெய வாவ்-வடிவங்கள் குறுகிய வாக்கியங்களாகவும் வினையெச்சத் தொடராகவும் இயல்பாக்கப்பட்டுள்ளன. ‘கண்களைத் திறந்தார்’ என்ற எபிரெய உருவகம் விளக்கமாக மாற்றப்படாமல் காக்கப்பட்டுள்ளது.
