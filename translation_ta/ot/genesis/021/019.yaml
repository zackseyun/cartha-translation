  source_fidelity: 'எபிரெய உரையின் நிகழ்வுவரிசையும் முக்கிய கூறுகளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: கடவுள் அவளுடைய கண்களைத் திறந்தார்; அவள் தண்ணீர்க் கிணற்றைக் கண்டாள்; பின்னர் தோற்பையைத் தண்ணீரால் நிரப்பி, சிறுவனுக்குக் குடிக்கக் கொடுத்தாள். וַתַּשְׁקְ என்ற காரணவினைப் பொருளை ‘குடிக்கக் கொடுத்தாள்’ இயல்பாகத் தருகிறது.'
