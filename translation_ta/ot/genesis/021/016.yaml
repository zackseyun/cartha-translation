  yaml_path: translation/ot/genesis/021/016.yaml
  text: Then she went and sat down opposite him[a], at a distance, about a bowshot away, for she said, “Let me not look on the death of the boy.” So she sat opposite him and lifted up her voice and wept.
translation:
  language: ta
  text: பின்பு அவள் போய், அவனுக்கு எதிரே சுமார் ஒரு அம்பு எய்யும் தொலைவில் உட்கார்ந்தாள். ஏனெனில், “பையன் இறப்பதை நான் பார்க்க நேரிட வேண்டாம்” என்று அவள் சொன்னாள்.[a] அவள் அவனுக்கு எதிரே உட்கார்ந்து, குரலெடுத்து அழுதாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பையனின் மரணத்தை நான் பார்க்க நேரிட வேண்டாம்.”
    reason: בְּמוֹת הַיֶּלֶד என்ற பெயர்ச்சொல் அமைப்பைச் சொற்சார்பாகவும், ‘பையன் இறப்பதை’ என்று நிகழ்வுசார்பாகவும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: அவனுக்கு எதிரே
  rationale: இந்தச் சொல் எதிரே அல்லது சற்றுத் தொலைவில் எதிர்நோக்கியிருப்பதைக் குறிக்கிறது. இரு இடங்களிலும் ஒரே தமிழ்ச் சொல்லாட்சியைப் பயன்படுத்துவது எபிரெய உரையின் மீளுரையைப் பாதுகாக்கிறது; தொலைவு அடுத்த சொற்றொடரால் தெளிவாகிறது.
- source_word: הַרְחֵק כִּמְטַחֲוֵי קֶשֶׁת
  choice: சுமார் ஓர் அம்பு பாயும் தொலைவில்
  rationale: தொலைவையும் வில் எய்யும் அளவை அடிப்படையாகக் கொண்ட தோராயமான மதிப்பீட்டையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הַיָּלֶד
  choice: பையன்
  rationale: יֶלֶד இங்கு சிறுவன் அல்லது இளைஞனைக் குறிக்கலாம். இஸ்மவேலின் வயதையும் காட்சியின் உணர்ச்சியையும் கருத்தில் கொண்டு ‘பையன்’ இயல்பான தேர்வாகும்.
- source_word: אַל אֶרְאֶה בְּמוֹת הַיָּלֶד
  choice: பையன் இறப்பதை நான் பார்க்க வேண்டாம்
  rationale: எபிரெயத்தின் முதலாம் நபர் எதிர்மறை விருப்பத்தையும், மரணத்தை நேரில் காண விரும்பாத வேதனையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַתִּשָּׂא אֶת־קֹלָהּ וַתֵּבְךְּ
  choice: குரலெடுத்து அழுதாள்
  rationale: ‘தன் குரலை உயர்த்தினாள்’ என்ற எபிரெய மரபுத்தொடரையும் அதைத் தொடர்ந்து வரும் அழுகையையும் சுருக்கமான, வழக்கமான தமிழில் இணைக்கிறது.
- source_word: לָהּ
  choice: தமிழில் தனியாக வெளிப்படுத்தப்படவில்லை
  rationale: இது நலப்பொருள் அல்லது தன்னிலை சார்ந்த தத்துவெச்சமாக இருக்கலாம்; ‘தனியாக’ என்று மொழிபெயர்த்தால் מִנֶּגֶד என்பதன் தெளிவான இடவியல் பொருளை மறைக்கும் அபாயம் உண்டு.
