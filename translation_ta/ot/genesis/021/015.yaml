base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/015.yaml
  text: When the water in the skin was gone[b][a], she cast the boy under one of the bushes.
translation:
  language: ta
  text: தோற்பையில்[a] இருந்த தண்ணீர் தீர்ந்துபோனதும், அவள் சிறுவனைப் புதர்களில் ஒன்றின் கீழ் எறிந்தாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, விலங்குத் தோலால் செய்யப்பட்ட தண்ணீர்ப் பை.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய வினை சாதாரணமாக ‘வைத்தாள்’ என்பதைவிட வலிமையானது; ‘வீசினாள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְלוּ
  choice: தீர்ந்துபோனதும்
  rationale: כלה இங்கு முழுவதும் செலவாகி முடிவுக்கு வருவதைக் குறிக்கிறது. தண்ணீரைப் பற்றிய இயல்பான நவீனத் தமிழில் ‘தீர்ந்துபோனதும்’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הַמַּיִם
  choice: தண்ணீர்
  rationale: מַיִם வடிவில் பன்மையாக இருந்தாலும், இங்கு எண்ணிக்கையற்ற பொருட்பெயராகப் பயன்படுகிறது; தமிழில் ஒருமைப் பொருளுடைய ‘தண்ணீர்’ இயல்பானது.
- source_word: מִן הַחֵמֶת
  choice: தோற்பையில் இருந்த
  rationale: חֵמֶת என்பது விலங்குத் தோலால் செய்யப்பட்ட திரவக் கொள்கலன். מן இங்கு அந்தக் கொள்கலனிலிருந்த தண்ணீர் தீர்ந்ததைச் சுட்டுகிறது. ‘தோற்பை’ சுருக்கமாகவும் புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது.
- source_word: וַתַּשְׁלֵךְ
  choice: எறிந்தாள்
  rationale: שלך என்பதன் அடிப்படை வலிமை ‘எறி/வீசு’ என்பதாகும். துயரநிலை காரணமாக அதை மென்மையாக்கி ‘கிடத்தினாள்’ என்று மட்டும் மொழிபெயர்ப்பது எபிரெய வினையின் வலிமையை இழக்கும்; ‘எறிந்தாள்’ அதன் திடீர், கடுமையான செயல்தன்மையைப் பாதுகாக்கிறது.
- source_word: אֶת הַיֶּלֶד
  choice: சிறுவனை
  rationale: יֶלֶד என்பது ஆண்பால் குழந்தை அல்லது சிறுவனைக் குறிக்கிறது. ‘சிறுவன்’ நவீனத் தமிழில் இயல்பாகவும் வயதைத் தேவையின்றி மிகத் துல்லியமாக நிர்ணயிக்காமலும் உள்ளது.
- source_word: תַּחַת
  choice: கீழ்
  rationale: תַּחַת என்பதன் நேரான இடப்பொருள் ‘கீழ்’; தமிழிலும் இதுவே தெளிவான இயல்பான இணை.
- source_word: אַחַד הַשִּׂיחִם
  choice: புதர்களில் ஒன்றின்
  rationale: இந்தக் கட்டமைப்பு ‘புதர்களில் ஒன்று’ என்று பொருள்படும். שִׂיחַ என்பதற்கு ‘புதர்’ என்பது பொதுவாசகர்களுக்கு எளிதான, சூழலுக்கேற்ற தமிழ்.
