  to: எழுந்திரு; சிறுவனைத் தூக்கி, உன் கையால் அவனை உறுதியாகத் தாங்கிக்கொள்[a]. ஏனெனில் நான் அவனை ஒரு பெரிய மக்களினமாக ஆக்குவேன்.
  rationale: ‘பையனை’ என்பதற்குப் பதிலாக ‘சிறுவனை’ பயன்படுத்தப்பட்டுள்ளது; இது நவீன தரத் தமிழில் அதிகக் கண்ணியமான நடையை வழங்குகிறது. பிற சொற்களும் சொற்றொடர்களும் மூல எபிரெயத்தின் கட்டளை, உறுதியான ஆதரவு, மற்றும் எதிர்கால வாக்குறுதி ஆகியவற்றைத் துல்லியமாக வெளிப்படுத்துவதால் மாற்றப்படவில்லை. அடிக்குறிப்பில் மேற்கோள் குறியீட்டு நடை மட்டும் ஒருமைப்படுத்தப்பட்டுள்ளது.
