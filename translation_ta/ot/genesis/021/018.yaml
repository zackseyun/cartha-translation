source:
  edition: WLC
  text: ק֚וּמִי שְׂאִ֣י אֶת הַ/נַּ֔עַר וְ/הַחֲזִ֥יקִי אֶת יָדֵ֖/ךְ בּ֑/וֹ כִּֽי לְ/ג֥וֹי גָּד֖וֹל אֲשִׂימֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/018.yaml
  text: Get up[a], lift up the boy, and hold him fast with your hand[b], for I will make him into a great nation.
translation:
  language: ta
  text: எழுந்திரு; சிறுவனைத் தூக்கி, உன் கையால் அவனை உறுதியாகத் தாங்கிக்கொள்[a]. ஏனெனில் நான் அவனை ஒரு பெரிய மக்களினமாக ஆக்குவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன் கையால் அவனை இறுகப் பிடித்துக்கொள்.’ எபிரெயச் சொற்றொடர் உறுதியான பிடியையும் ஆதரவையும் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וּמִי
  choice: எழுந்திரு
  rationale: காகாரை நோக்கிக் கூறப்படும் பெண்பால் ஒருமை கட்டளை. நவீன தமிழில் கட்டளையின் நேரடியான வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׂאִ֣י
  choice: தூக்கி
  rationale: நשׂא என்பதன் இச்சூழலுக்குரிய ‘மேலே தூக்கு’ என்ற உருவகத்தைப் பாதுகாக்கிறது; தொடர்ந்து சுமந்துசெல்ல வேண்டும் என்று தேவையின்றி பொருள் கூட்டவில்லை.
- source_word: הַנַּעַר
  choice: பையனை
  rationale: נַעַר இங்கு சிறுவன் அல்லது இளைஞனைக் குறிக்கிறது. கதைச்சூழலில் ‘பையன்’ என்பது இயல்பான, வயதை மிகத் துல்லியமாக நிர்ணயிக்காத சொல்.
- source_word: וְהַחֲזִיקִי אֶת יָדֵךְ בּוֹ
  choice: உன் கையால் அவனை உறுதியாகத் தாங்கிக்கொள்
  rationale: எபிரெயச் சொற்றொடர் கையால் வலுவாகப் பற்றுவதையும் ஆதரவளிப்பதையும் உணர்த்துகிறது. விழுந்து கிடக்கும் பையனுக்கான உறுதியான உடல் ஆதரவைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைகளுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் விளக்க வலிமையைப் பாதுகாக்கிறது.
- source_word: לְגוֹי גָּדוֹל
  choice: ஒரு பெரிய மக்களினமாக
  rationale: גּוֹי என்பது இங்கு நிலப்பரப்பைவிட ஒரு மக்கள் கூட்டத்தையோ தேசத்தாரையோ குறிக்கிறது. ‘மக்களினம்’ எதிர்காலச் சந்ததியால் உருவாகும் பெரிய மக்கள் கூட்டத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֲשִׂימֶנּוּ
  choice: அவனை ... ஆக்குவேன்
  rationale: שׂים என்பதன் ‘ஆக்கு/ஏற்படுத்து’ என்ற விளைவுப்பொருளையும் ஆண்பால் ஒருமைப் பின்னொட்டையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: இஸ்மவேலின் எதிர்காலத்தைக் குறித்த இறை வாக்குறுதி
  choice: அவனை ஒரு பெரிய மக்களினமாக ஆக்குவேன்
  alternative: அவனிடமிருந்து ஒரு பெரிய மக்களினத்தை உருவாக்குவேன்
  rationale: மூலத்தில் உள்ள ‘அவனை ... ஆக்குவேன்’ என்ற துணிச்சலான சுருக்கத்தையும், பையனும் அவன் வழிவரும் மக்களும் ஒரே சொல்லாக்கத்தில் இணைக்கப்படும் பொருள் நெருக்கத்தையும் பாதுகாக்கிறது. வாக்குறுதியின் உடன்படிக்கைசார் நிலையை மொழிபெயர்ப்பு கூடுதலாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் நேரடியான, கண்ணியமான கட்டளை நடையும் வாக்குறுதி நடையும் பயன்படுத்தப்பட்டுள்ளன. பழமையான ‘ஜாதி’ என்பதற்குப் பதிலாக, இச்சூழலில் மக்கள் கூட்டத்தைக் குறிக்கும் ‘மக்களினம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
