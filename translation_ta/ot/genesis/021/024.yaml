  language: en
  yaml_path: translation/ot/genesis/021/024.yaml
  text: And Abraham said[a], “I swear it.”
translation:
  language: ta
  text: அதற்கு ஆபிரகாம், “நான் சத்தியம் செய்கிறேன்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் சத்தியம் செய்வேன்”; அல்லது, “நான் ஆணையிட்டு உறுதியளிக்கிறேன்.”
    reason: எபிரெய வினைச்சொல் இச்சூழலில் உடனடியான சத்திய உறுதிமொழியாகவோ எதிர்நோக்கிய வாக்குறுதியாகவோ வெளிப்படலாம்.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அதற்கு ... என்றார்
  rationale: வாவ்-தொடர்வினை கதைநிகழ்வை முன்னெடுத்தாலும், இங்கு ஆபிரகாமின் சொல் அபிமெலேக்கின் வேண்டுகோளுக்கான நேரடி பதில். எனவே நவீன தமிழில் இயல்பாகத் தொடர்பைக் காட்டும் ‘அதற்கு ... என்றார்’ பயன்படுத்தப்பட்டது.
- source_word: אַבְרָהָם
  choice: ஆபிரகாம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: אָנֹכִי
  choice: நான்
  rationale: தனித்த சுட்டுப்பெயர் எழுவாயை வெளிப்படையாகவும் ஓரளவு வலியுறுத்தியும் காட்டுகிறது; தமிழில் ‘நான்’ இதை இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: אִשָּׁבֵעַ
  choice: ஆணையிடுகிறேன்
  rationale: שבע என்பதன் நிஃபால் வடிவம் ‘ஆணையிடுதல், சத்தியம் செய்தல்’ என்று பொருள்படும். வேண்டுகோளுக்கான உடனடியான உறுதிமொழியாக இருப்பதால் நிகழ்கால வடிவம் தமிழில் இயல்பாக உள்ளது; எபிரெய வடிவின் எதிர்கால/விருப்ப நிழலை அடிக்குறிப்பில் பாதுகாக்கிறோம்.
