base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/004.yaml
  text: And Abraham circumcised Isaac his son when he was eight days old[a], just as God had commanded him.
translation:
  language: ta
  text: ஆபிரகாம் தன் மகன் ஈசாக்கு எட்டு நாட்கள் வயதானபோது[a], கடவுள் ஆபிரகாமுக்குக் கட்டளையிட்டபடியே அவனுக்கு விருத்தசேதனம் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “எட்டு நாட்களுடைய மகன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָל
  choice: விருத்தசேதனம் செய்தார்
  rationale: מול என்ற வினை விருத்தசேதனம் செய்வதைக் குறிப்பாகக் குறிக்கிறது. நவீனத் தமிழில் துல்லியமும் கண்ணியமும் கொண்ட வழக்கமான சமமான சொற்றொடர் இது.
- source_word: אֶת יִצְחָק
  choice: ஈசாக்குக்கு
  rationale: எபிரெய நேரடிச் செயப்படுபொருளைத் தமிழில் ‘விருத்தசேதனம் செய்தார்’ என்பதுடன் இயல்பாக இணைக்க நான்காம் வேற்றுமை பயன்படுத்தப்பட்டது; பெயர் வழக்கமான தமிழாக்கத்தில் தரப்பட்டது.
- source_word: בְּנוֹ
  choice: தன் மகன்
  rationale: ஈசாக்கு ஆபிரகாமின் மகன் என்பதிலுள்ள குடும்ப உறவு வலியுறுத்தலைக் காக்கிறது; ஒரே எழுவாயைக் குறிப்பதால் ‘தன்’ இயல்பானது.
- source_word: בֶּן שְׁמֹנַת יָמִים
  choice: எட்டு நாட்கள் ஆனபோது
  rationale: சொல்லுக்கு சொல் ‘எட்டு நாட்களின் மகன்’ என்ற எபிரெய வயது மரபுத்தொடரின் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: כַּאֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: ஆபிரகாமின் செயல் கடவுளின் கட்டளைக்கு ஒத்தபடியே இருந்ததைத் தெளிவாகக் காட்டுகிறது.
- source_word: צִוָּה אֹתוֹ
  choice: தனக்குக் கட்டளையிட்ட
  rationale: கட்டளை ஆபிரகாமுக்குக் கொடுக்கப்பட்டதைக் காட்டுகிறது. தமிழ் சார்பு வினையெச்ச அமைப்பில் முன்னதாக நிகழ்ந்த செயல் சூழலிலேயே தெளிவாகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு ஒருமை வினையுடன் இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கிறது; ‘கடவுள்’ இயல்பான பொதுத் தமிழ் இணைச்சொல்.
theological_decisions:
- issue: முந்திய தெய்வீகக் கட்டளையின் கால உறவு
  choice: கடவுள் தனக்குக் கட்டளையிட்டபடியே
  alternative: கடவுள் தனக்குக் கட்டளையிட்டிருந்தபடியே
  rationale: எபிரெய உரை கட்டளை முன்னதாக வழங்கப்பட்டதைச் சூழலில் உணர்த்துகிறது. தமிழில் ‘கட்டளையிட்டபடியே’ என்பது அந்த உறவை இயல்பாகத் தெரிவிக்கிறது; ‘கட்டளையிட்டிருந்தபடியே’ தேவையற்ற கனமான நடையாகும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரெய வயது மரபுத்தொடர் இயல்பாக்கப்பட்டு, அதன் நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
