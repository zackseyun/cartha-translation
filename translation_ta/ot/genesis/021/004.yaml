- from: ஆபிரகாம் தன் மகன் ஈசாக்குக்கு எட்டு நாட்கள் ஆனபோது[a], கடவுள் தனக்குக் கட்டளையிட்டபடியே அவனுக்கு விருத்தசேதனம் செய்தார்.
  to: ஆபிரகாம் தன் மகன் ஈசாக்கு எட்டு நாட்கள் வயதானபோது[a], கடவுள் ஆபிரகாமுக்குக் கட்டளையிட்டபடியே அவனுக்கு விருத்தசேதனம் செய்தார்.
