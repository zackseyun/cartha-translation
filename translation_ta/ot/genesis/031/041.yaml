translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியும் கண்ணியமுமான நடையைக் கடைப்பிடிக்கிறது. எபிரெய ஒருமை இரண்டாம் நபரை மறைக்காமல் ‘உன்/நீ’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. யாக்கோபின் குற்றச்சாட்டின் வலிமை ‘நீயோ’ என்பதன் மூலம் இயல்பாகத் தக்கவைக்கப்பட்டுள்ளது.
