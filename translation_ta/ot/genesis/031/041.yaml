  revision_rationale: The revision gives the Hebrew fronted duration phrase a natural Tamil form and explicitly links Jacob’s residence in Laban’s house with his service. It preserves the concrete “வீட்டில்” in the main text, retains the possible household sense in a tightly anchored footnote, and leaves all quantities and the complaint about wages unchanged.
