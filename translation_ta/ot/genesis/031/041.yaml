  edition: WLC
  text: זֶה לִּ֞/י עֶשְׂרִ֣ים שָׁנָה֮ בְּ/בֵיתֶ/ךָ֒ עֲבַדְתִּ֜י/ךָ אַרְבַּֽע עֶשְׂרֵ֤ה שָׁנָה֙ בִּ/שְׁתֵּ֣י בְנֹתֶ֔י/ךָ וְ/שֵׁ֥שׁ שָׁנִ֖ים בְּ/צֹאנֶ֑/ךָ וַ/תַּחֲלֵ֥ף אֶת מַשְׂכֻּרְתִּ֖/י עֲשֶׂ֥רֶת מֹנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/041.yaml
  text: 'These twenty years I have been in your house: I served you fourteen years for your two daughters[a], and six years for your flock, and you changed my wages ten times.'
translation:
  language: ta
  text: 'இந்த இருபது ஆண்டுகளாக உன் வீட்டில்[a] இருந்து உனக்குப் பணிசெய்தேன்: உன் இரு மகள்களுக்காகப் பதினான்கு ஆண்டுகளும், உன் மந்தைக்காக ஆறு ஆண்டுகளும் பணிசெய்தேன். நீயோ என் கூலியைப் பத்து முறை மாற்றினாய்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் வீட்டாரிடம்.”
    reason: בַּיִת (“வீடு”) இச்சூழலில் வீட்டார் அல்லது குடும்பம் என்ற விரிந்த பொருளையும் கொள்ளலாம்.
lexical_decisions:
- source_word: זֶה לִּי עֶשְׂרִים שָׁנָה
  choice: இதோ, எனக்கு இருபது ஆண்டுகள் ஆகிவிட்டன
  rationale: வினைச்சொல் இல்லாத எபிரெய காலக் கூற்றையும் זֶה என்பதன் சுட்டும் வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; לִּי என்பதையும் ‘எனக்கு’ என்று தக்கவைக்கிறது.
- source_word: בְּבֵיתֶךָ
  choice: உன் வீட்டில்
  rationale: בַּיִת என்பதன் நேரடியான ‘வீடு’ என்ற பொருளைத் தக்கவைக்கிறது; சூழலில் அது குடும்பம் அல்லது வீட்டாரையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עֲבַדְתִּיךָ
  choice: உனக்குப் பணிசெய்தேன்
  rationale: עבד என்பதில் உள்ள உழைப்பு மற்றும் ஒருவருக்குச் செய்யும் சேவை ஆகிய இரு நுணுக்கங்களையும் ‘பணிசெய்தேன்’ இயல்பாகக் கொண்டுவருகிறது.
- source_word: אַרְבַּע עֶשְׂרֵה שָׁנָה בִּשְׁתֵּי בְנֹתֶיךָ
  choice: உன் இரண்டு மகள்களுக்காகப் பதினான்கு ஆண்டுகள்
  rationale: இங்குள்ள בְּ மணமகள் ஒப்பந்தத்தின் பொருட்டுச் செய்யப்பட்ட பணியைக் குறிக்கிறது; கூடுதல் விளக்கம் சேர்க்காமல் ‘மகள்களுக்காக’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: וְשֵׁשׁ שָׁנִים בְּצֹאנֶךָ
  choice: உன் மந்தைக்காக ஆறு ஆண்டுகள்
  rationale: צֹאן என்பது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய சிறுகால்நடைத் தொகுதி; ஆகவே ‘மந்தை’ என்பது விரிவைத் தக்கவைக்கிறது.
- source_word: וַתַּחֲלֵף
  choice: நீயோ ... மாற்றினாய்
  rationale: Hiphil வடிவின் ‘மாற்று/பதிலீடு செய்’ என்ற பொருளை நேரடியாகத் தருகிறது; וַ என்பதிலுள்ள எதிர்மறைத் திருப்பத்தைத் தமிழில் ‘நீயோ’ காட்டுகிறது.
- source_word: מַשְׂכֻּרְתִּי
  choice: என் கூலி
  rationale: வேலைக்குக் கிடைக்கும் ஊதியத்தை இச்சூழலில் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: பத்து முறை
  rationale: சொல்லுக்கு சொல் ‘பத்து கணக்குகள்’ என்று தருவது தமிழில் தெளிவற்றதாகும்; மீண்டும் மீண்டும் நிகழ்ந்த மாற்றத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரின் இயல்பான இணை ‘பத்து முறை’.
