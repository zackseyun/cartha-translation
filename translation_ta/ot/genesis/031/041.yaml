revisions:
- from: இதோ, உன் வீட்டில் எனக்கு இருபது ஆண்டுகள் ஆகிவிட்டன[a]. உன் இரண்டு மகள்களுக்காகப் பதினான்கு ஆண்டுகளும், உன் மந்தைக்காக ஆறு ஆண்டுகளும் உனக்குப் பணிசெய்தேன். நீயோ என் கூலியைப் பத்து முறை மாற்றினாய்.
  to: 'இந்த இருபது ஆண்டுகளாக உன் வீட்டில்[a] இருந்து உனக்குப் பணிசெய்தேன்: உன் இரு மகள்களுக்காகப் பதினான்கு ஆண்டுகளும், உன் மந்தைக்காக ஆறு ஆண்டுகளும் பணிசெய்தேன். நீயோ என் கூலியைப் பத்து முறை மாற்றினாய்.'
  rationale: The revision gives the Hebrew fronted duration phrase a natural Tamil form and explicitly links Jacob’s residence in Laban’s house with his service. It preserves the concrete “வீட்டில்” in the main text, retains the possible household sense in a tightly anchored footnote, and leaves all quantities and the complaint about wages unchanged.
  reviewer_model: gpt-5.6-terra
