base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/036.yaml
  text: Then Jacob became angry and contended with Laban. Jacob answered and said to Laban[a], “What is my transgression? What is my sin, that you have pursued me?”
translation:
  language: ta
  text: 'அப்போது யாக்கோபுக்குக் கோபம் மூண்டது; அவன் லாபானோடு வாதாடினான். யாக்கோபு லாபானுக்குப் பதிலளித்துச் சொன்னான்: “நான் செய்த மீறுதல் என்ன? நான் செய்த பாவம் என்ன? என்னைத் துரத்திவந்தீர்?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைத் தீவிரமாகத் துரத்திவந்தீர்?” எபிரெய வினைச்சொல் ‘எரிதல்’ என்ற உருவகத்துடன் தொடர்புடையது; அது ஆர்வமாக அல்லது தீவிரமாகப் பின்தொடர்தலையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְיַעֲקֹב
  choice: யாக்கோபுக்குக் கோபம் மூண்டது
  rationale: חרה + ל என்னும் எபிரெய மரபுத்தொடர் ஒருவருக்குள் கோபம் மூள்வதைக் குறிக்கிறது; ‘கோபம் மூண்டது’ அதன் உருவக வலிமையையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: וַיָּרֶב בְּלָבָן
  choice: அவன் லாபானோடு வாதாடினான்
  rationale: ריב இங்கு எதிர்த்து விவாதிப்பதை அல்லது சச்சரவிடுவதைச் சுட்டுகிறது; ‘வாதாடினான்’ எதிர்ப்பின் வலிமையைத் தருகிறது, ஆனால் தொனியை அளவுக்கு அதிகமாகக் குறிப்பதில்லை.
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: மறுமொழியாக ... என்றான்
  rationale: எபிரெயக் கதையாடலின் ‘பதிலளித்து, சொன்னான்’ என்ற இரட்டை வடிவத்தைச் சொற்சுமையின்றி இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מַה פִּשְׁעִי
  choice: நான் செய்த மீறுதல் என்ன?
  rationale: פשע என்பது திட்டமிட்ட எல்லைமீறல் அல்லது குற்றச்செயல் என்ற அற-சட்ட நுண்பொருளைக் கொண்டது; ‘மீறுதல்’ அதைத் தெளிவாகக் காக்கிறது.
- source_word: מַה חַטָּאתִי
  choice: நான் செய்த பாவம் என்ன?
  rationale: חטאת என்பதன் நேரடியான பொருளான ‘பாவம்’ பயன்படுத்தப்பட்டு, முந்தைய ‘மீறுதல்’ என்பதுடனான சொல்லிணைப் பொருத்தமும் காக்கப்படுகிறது.
- source_word: כִּי
  choice: எதற்காக
  rationale: இரு வினாக்களைத் தொடர்ந்து வரும் காரண வினாவாக இங்கு כִּי செயல்படுகிறது; தமிழில் ‘எதற்காக’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: דָלַקְתָּ אַחֲרָי
  choice: என்னை இவ்வளவு தீவிரமாகத் துரத்திவந்தீர்
  rationale: דלק என்பது அடிப்படையில் எரிதலையும், விரிவாகத் தீவிரமான பின்தொடர்தலையும் குறிக்கலாம். ‘தீவிரமாகத் துரத்திவந்தீர்’ அந்த வலிமையை இயல்பான தமிழில் தருகிறது; அடிக்குறிப்பு எளிய மாற்றையும் பதிவு செய்கிறது.
