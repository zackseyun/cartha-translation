  text: וַ/יִּבְרַ֥ח הוּא֙ וְ/כָל אֲשֶׁר ל֔/וֹ וַ/יָּ֖קָם וַ/יַּעֲבֹ֣ר אֶת הַ/נָּהָ֑ר וַ/יָּ֥שֶׂם אֶת פָּנָ֖י/ו הַ֥ר הַ/גִּלְעָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/021.yaml
  text: So he fled with all that was his[a], and he arose and crossed the River, and set his face toward the hill country of Gilead.
translation:
  language: ta
  text: அவன் தனக்கிருந்த அனைத்தோடும் தப்பியோடினான்; அவன் எழுந்து, அந்த ஆற்றைக்[a] கடந்து, கீலேயாத் மலைநாட்டை நோக்கித் தன் முகத்தைத் திருப்பினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யூப்ரடீஸ் ஆற்றைக் கடந்து.’ எபிரேயத்தில் ‘அந்த ஆறு’ என்று மட்டுமே உள்ளது; இது பெரும்பாலும் யூப்ரடீஸ் ஆற்றைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: தப்பியோடினான்
  rationale: ברח என்பது ‘தப்பியோடு’ அல்லது ‘ஓடிப்போ’ என்ற பொருளைத் தருகிறது. சூழலில் மறைவாகவும் அழுத்தத்தின் கீழும் புறப்பட்டுச் சென்றதைக் கூடுதல் விளக்கமின்றி இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: தனக்கிருந்த அனைத்தோடும்
  rationale: இந்தச் சொற்றொடர் யாக்கோபுக்குச் சொந்தமான குடும்பத்தார், பணியாளர்கள், மந்தைகள், உடைமைகள் ஆகிய அனைத்தையும் உள்ளடக்கக்கூடியது. ‘அனைத்தோடும்’ என்பது அதன் பரந்த குறிப்பைச் சுருக்காமல் காக்கிறது.
- source_word: וַיָּקָם
  choice: அவன் எழுந்து
  rationale: קום இங்கு அடுத்த செயலைத் தொடங்கும் கதைநடை வினையாக வருகிறது. ‘எழுந்து’ என்பது அதன் வடிவத்தையும் செயல் தொடரையும் பாதுகாக்கிறது.
- source_word: וַיַּעֲבֹר אֶת־הַנָּהָר
  choice: அந்த ஆற்றைக் கடந்து
  rationale: עבר என்பதற்கு ‘கட’ என்பது நேரான இணை. குறிப்பிட்ட ஆற்றைச் சுட்டும் எபிரேய இடைச்சொல்லை ‘அந்த ஆறு’ எனக் காத்து, அதன் பெயரை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: הַנָּהָר
  choice: அந்த ஆறு
  rationale: மூலத்தில் ஆற்றின் இயற்பெயர் இல்லாமல் ‘அந்த ஆறு’ என்றே உள்ளது. சூழலில் அது யூப்ரடீஸ் ஆறாக இருக்க வாய்ப்புள்ளதால், அந்த அடையாளம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיָּשֶׂם אֶת־פָּנָיו
  choice: தன் முகத்தைத் திருப்பினான்
  rationale: சொல்லுக்கு சொல் ‘தன் முகத்தை வைத்தான்’ என்பது நவீன தமிழில் இயல்பற்றது. ‘முகத்தைத் திருப்பினான்’ என்பது குறித்த திசையை நோக்கிய திட்டமிட்ட பயண நோக்கத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַר הַגִּלְעָד
  choice: கீலேயாத் மலைநாடு
  rationale: הַר என்பது தனியொரு மலைச்சிகரத்தை மட்டுமல்லாமல் மலைப்பாங்கான பகுதியையும் குறிக்கலாம். இங்குள்ள புவியியல் சூழலுக்கு ‘மலைநாடு’ பொருத்தமானது.
