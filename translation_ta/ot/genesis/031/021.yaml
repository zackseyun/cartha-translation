    issue: The opening word ‘இவ்வாறு’ is not represented in the Hebrew source.
    rationale: וַ/יִּבְרַח begins the narrative clause with ‘and/he fled’; ‘இவ்வாறு’ can imply ‘in this manner’ or a stronger inferential connection. Omitting it is closer to the source and remains fully natural Tamil.
