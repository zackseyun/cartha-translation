    issue: பெண்களுக்குரிய வழக்கம் எனக்கு ஏற்பட்டிருக்கிறது
    rationale: 'This is an unnatural Tamil collocation: a “custom/practice” does not normally “occur” to a person. It risks obscuring the source euphemism for menstruation. “பெண்களுக்குரிய நாட்கள் எனக்கு வந்திருக்கின்றன” is a natural, indirect Tamil equivalent.'
  - severity: low
    issue: எழுந்திருக்க முடியாததற்காக
    rationale: Though understandable, “எழுந்து நிற்க முடியாததற்காக” more directly expresses the physical action of rising/standing before the addressee and reads more naturally in this context.
