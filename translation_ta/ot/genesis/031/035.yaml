base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/035.yaml
  text: And she said to her father[a], “Let not my lord be angry in my sight that I cannot rise before you, for the way of women is upon me.” So he searched[b], but did not find the household idols.
translation:
  language: ta
  text: அவள் தன் தந்தையிடம், “என் ஆண்டவரே, நான் உங்களுக்கு முன்பாக எழுந்து நிற்க முடியாததற்காக என்மேல் கோபப்பட வேண்டாம்; பெண்களுக்குரிய நாட்கள் எனக்கு வந்திருக்கின்றன” என்றாள். அவன் தேடிப்பார்த்தும் வீட்டுத் தெய்வச் சிலைகளை[a] கண்டுபிடிக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் “தெராபீம்”; வீட்டு வழிபாட்டுக்குரிய தெய்வ உருவங்கள் அல்லது சிலைகள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יִחַר בְּעֵינֵי אֲדֹנִי
  choice: என் ஆண்டவரே, ... என்மேல் கோபப்பட வேண்டாம்
  rationale: חרה குறிக்கும் கோபத்தை இயல்பான நவீனத் தமிழில் தருகிறது; בְּעֵינֵי என்ற எபிரேய மரபுத்தொடரை சொல்லுக்குச் சொல் மொழிபெயர்த்து இயல்பற்ற தொடரை உருவாக்காமல் அதன் கருத்தைப் பாதுகாக்கிறது. ‘ஆண்டவரே’ என்பது தந்தையிடம் மரியாதையாகப் பேசுவது; தெய்வப் பட்டம் அல்ல.
- source_word: לֹא אוּכַל לָקוּם מִפָּנֶיךָ
  choice: நான் உங்களுக்கு முன்பாக எழுந்திருக்க முடியாததற்காக
  rationale: קום என்பதன் உடல்சார்ந்த ‘எழுதல்’ பொருளையும் מִפָּנֶיךָ என்பதன் மரியாதை/முன்னிலை நுணுக்கத்தையும் காக்கிறது.
- source_word: דֶּרֶךְ נָשִׁים לִי
  choice: பெண்களுக்குரிய வழக்கம் எனக்கு ஏற்பட்டிருக்கிறது
  rationale: மாதவிடாயைக் குறிக்கும் மூலத்தின் நாசூக்கான மறைமுகச் சொல்லாட்சியை நவீனத் தமிழில் புரியத்தக்க வகையில் பாதுகாக்கிறது.
- source_word: וַיְחַפֵּשׂ וְלֹא מָצָא
  choice: அவன் தேடிப்பார்த்தும் ... கண்டுபிடிக்கவில்லை
  rationale: தேடலுக்கும் தோல்வியான முடிவுக்கும் இடையிலான முரண்பாட்டை இயல்பான தமிழ் வினையெச்ச அமைப்பில் தருகிறது.
- source_word: הַתְּרָפִים
  choice: வீட்டுத் தெய்வச் சிலைகள்
  rationale: குடும்ப அல்லது வீட்டு வழிபாட்டோடு தொடர்புடைய உருவங்களை வாசகருக்குப் புரியும் வகையில் தருகிறது; குறிப்பிட்ட எபிரேயச் சொல் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
theological_decisions:
- issue: תְּרָפִים என்பதன் மொழிபெயர்ப்பு
  choice: வீட்டுத் தெய்வச் சிலைகள்
  alternative: தெராபீம்; வீட்டுச் சிலைகள்; வீட்டுத் தெய்வங்கள்
  rationale: இச்சொல் வீட்டு வழிபாட்டில் பயன்படுத்தப்பட்ட சமய உருவங்களைக் குறிக்கிறது. ‘தெய்வச் சிலைகள்’ என்பது அவற்றின் சமயத் தன்மையையும் உருவப் பொருள் தன்மையையும் தெரிவிக்கிறது; அவை உண்மையான தெய்வங்கள் என்று உரை தீர்மானிப்பதாகக் காட்டாது.
- issue: דֶּרֶךְ נָשִׁים என்ற நாசூக்கான சொல்லாட்சி
  choice: பெண்களுக்குரிய வழக்கம்
  alternative: எனக்கு மாதவிடாய் ஏற்பட்டிருக்கிறது
  rationale: மூலத்தின் மறைமுகமான, நாசூக்கான நடை பாதுகாக்கப்படுகிறது; மருத்துவ விளக்கமாக மாற்றி உரையின் தொனியைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; தந்தையிடம் ராகேல் காட்டும் மரியாதைக்காக ‘என் ஆண்டவரே’ பயன்படுத்தப்பட்டுள்ளது. மாதவிடாயைக் குறிக்கும் மூலத்தின் நாசூக்கான மொழி காக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
