translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. உரையாடலின் அழைப்புத் தொனியும், உடன்படிக்கையின் முறையான தன்மையும், அது சாட்சியாக இருக்க வேண்டும் என்ற விருப்ப நுணுக்கமும் காக்கப்பட்டுள்ளன.
