reference: Genesis 31:44
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עַתָּ֗ה לְכָ֛/ה נִכְרְתָ֥ה בְרִ֖ית אֲנִ֣י וָ/אָ֑תָּה וְ/הָיָ֥ה לְ/עֵ֖ד בֵּינִ֥/י וּ/בֵינֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/044.yaml
  text: So now[a], come, let us make a covenant, you and I, and let it be a witness between me and you.
translation:
  language: ta
  text: ஆகவே இப்போது வா; நீயும் நானும் ஓர் உடன்படிக்கை செய்வோம்[a]. அது எனக்கும் உனக்கும் இடையே சாட்சியாக இருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படி, “ஓர் உடன்படிக்கையை வெட்டுவோம்.” இது உடன்படிக்கை செய்வதை அல்லது ஏற்படுத்துவதைச் சுட்டும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: உரையாடலில் அடுத்த நடவடிக்கையை அறிமுகப்படுத்தும் இணைப்பையும் காலச் சுட்டையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: לְכָה
  choice: வா
  rationale: הלך என்பதிலிருந்து வந்தாலும், இச்சூழலில் அழைப்பு அல்லது தூண்டுதலாகப் பயன்படுவதால் ‘வா’ என்பது இயல்பான பொருத்தம்.
- source_word: נִכְרְתָה בְרִית
  choice: ஓர் உடன்படிக்கை செய்வோம்
  rationale: எபிரெய மொழியின் சொற்படி வடிவம் ‘உடன்படிக்கையை வெட்டுவோம்’; ஆனால் அதன் வழக்குப் பொருள் உடன்படிக்கையை ஏற்படுத்துவது. தெளிவுக்காக வழக்குப் பொருள் முதன்மை உரையில் தரப்பட்டு, சொற்படி வடிவம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בְרִית
  choice: உடன்படிக்கை
  rationale: முறையான, பரஸ்பரப் பிணைப்புள்ள உறுதிப்பாட்டைக் குறிக்கும் சொல்லின் வேதாகமச் செறிவைத் தக்கவைக்கிறது.
- source_word: אֲנִי וָאָתָּה
  choice: நீயும் நானும்
  rationale: இரு தரப்பினரையும் வெளிப்படையாகக் குறிப்பதைத் தக்கவைத்தபடி தமிழில் இயல்பான வரிசையைப் பயன்படுத்துகிறது.
- source_word: וְהָיָה לְעֵד
  choice: அது ... சாட்சியாக இருக்கட்டும்
  rationale: தொடர்ந்து வரும் விருப்ப/தூண்டுதல் நுணுக்கத்தை ‘இருக்கட்டும்’ காக்கிறது; உடன்படிக்கையே சாட்சியாகச் செயல்படுவதை ‘அது’ தெளிவாகச் சுட்டுகிறது.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: எனக்கும் உனக்கும் இடையே
  rationale: எபிரெயத்தில் இரு நபர்களும் தனித்தனியாகக் குறிப்பிடப்படுவதைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
