  source_fidelity: திருத்தம் தேவை. வரைவு எபிரேய மரபுத்தொடரான וַתִּגְנֹב אֹתִי-யைச் சூழலுக்கேற்றவாறு நன்றாகத் தருகிறது; ஆயினும் மூலத்தில் ஒரே வினாவாகத் தொடரும் குற்றச்சாட்டு தமிழில் இரண்டு தனி வினாக்களாகப் பிரிக்கப்பட்டுள்ளது. மேலும் תֹף என்பது தம்புரு (tanpura) அல்ல; அதனைத் தம்புரின் எனத் துல்லியமாக்க வேண்டும்.
  naturalness: பெரும்பகுதி நவீனத் தமிழில் இயல்பாக உள்ளது. “உன்னை மறைத்துக்கொண்டு” என்பதற்குப் பதில் “ஒளிந்துகொண்டு” இச்சூழலில் நேரடியும் இயல்பும். கருவிகளுடன் “இசையோடும்” சேர்ப்பது தேவையற்ற விரிவாக்கம்.
  terminology: כִּנּוֹר-க்கு “யாழ்” பொருத்தமானது. תֹף-க்கு “தம்புரின்” என்பது நவீனமான, கருவி வகையைத் தவறாகக் குறிக்காத தேர்வு. “தம்புரு” என்பது வேறுவகை நரம்பிசைக் கருவியைக் குறிக்கக்கூடும்; பயன்படுத்தக் கூடாது.
  issues:
  - severity: medium
    issue: மூலத்தின் தொடர்ச்சியான ஒரே வினா இரண்டு வினாக்களாகப் பிரிக்கப்பட்டுள்ளது.
    rationale: לָמָּה ... וְלֹא ... וָאֲשַׁלֵּחֲךָ என்ற அமைப்பு, “ஏன் ... சொல்லாமல் போனாய்? [சொல்லியிருந்தால்] நான் அனுப்பியிருப்பேனே” என்ற ஒரே குற்றஞ்சாட்டும் வினாவாக அமைகிறது. தமிழிலும் இந்தத் தொடர்பைத் தக்கவைத்தல் சிறந்தது.
  - severity: medium
    issue: תֹף-க்கான “தப்பு” மற்றும் அடிக்குறிப்பிலுள்ள “தம்புரு” துல்லியமற்றவை.
