  to: தப்பியோடுவதற்காக நீ ஏன் ஒளிந்துகொண்டு, எனக்குத் தெரியாமல் நழுவிச் சென்றாய்[a]? ஏன் என்னிடம் சொல்லவில்லை? நீ சொல்லியிருந்தால், மகிழ்ச்சியோடும் பாடல்களோடும், தம்புரினோடும்[b] யாழோடும்[c] உன்னை வழியனுப்பியிருப்பேனே!
