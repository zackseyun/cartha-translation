translation_notes:
  register: நவீன நிலையான தமிழில், லாபானின் குற்றஞ்சாட்டும் தொனியும் நிகழாமல் போன பிரியாவிடை வாய்ப்பும் தெளிவாகத் தரப்பட்டுள்ளன. மூலத்தின் எபிரேய மரபுத்தொடர் முதன்மை உரையில் இயல்பாக மொழிபெயர்க்கப்பட்டு, அதன் சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
