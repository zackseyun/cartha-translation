base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/027.yaml
  text: Why did you hide yourself to flee and steal away from me[a], and not tell me, so that I might have sent you away with joy and with songs[d][c][b], with tambourine and lyre?
translation:
  language: ta
  text: தப்பியோடுவதற்காக நீ ஏன் ஒளிந்துகொண்டு, எனக்குத் தெரியாமல் நழுவிச் சென்றாய்[a]? ஏன் என்னிடம் சொல்லவில்லை? நீ சொல்லியிருந்தால், மகிழ்ச்சியோடும் பாடல்களோடும், தம்புரினோடும்[b] யாழோடும்[c] உன்னை வழியனுப்பியிருப்பேனே!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘என்னைத் திருடினாய்.’ இங்கு, ஒருவருக்குத் தெரியாமல் இரகசியமாக நழுவிச் செல்வது என்று பொருள்.'
    reason: lexical_alternative
  - marker: b
    text: கையால் அடித்து இசைக்கப்படும் தாளக் கருவி; மரபாக ‘திம்பிரல்’ என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரேயச் சொல் யாழ் வகையைச் சேர்ந்த ஒரு நரம்பிசைக் கருவியைக் குறிக்கிறது; சில மொழிபெயர்ப்புகளில் ‘வீணை’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: ஏன்
  rationale: காரணம் கேட்கும் வழக்கமான வினாவை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: נַחְבֵּאתָ לִבְרֹחַ
  choice: தப்பியோடுவதற்காக ... உன்னை மறைத்துக்கொண்டு
  rationale: חבא என்பதன் தன்னிலைப் பொருளையும் ברח என்பதன் தப்பியோடும் வினைவலிமையையும் காக்கிறது.
- source_word: וַתִּגְנֹב אֹתִי
  choice: எனக்குத் தெரியாமல் நழுவிச் சென்றாய்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘என்னைத் திருடினாய்’; இச்சூழலில் ஒருவருக்குத் தெரியாமல் இரகசியமாகப் போய்விடுதல் என்ற எபிரேய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וְלֹא הִגַּדְתָּ לִּי
  choice: ஏன் என்னிடம் சொல்லவில்லை?
  rationale: தெரிவிக்கவில்லை என்ற அடிப்படைப் பொருளை லாபானின் குற்றஞ்சாட்டும் வினாத்தொனியில் இயல்பாகத் தருகிறது.
- source_word: וָאֲשַׁלֵּחֲךָ
  choice: சொல்லியிருந்தால் ... உன்னை வழியனுப்பியிருப்பேனே
  rationale: நிகழாமல் போன வாய்ப்பையும் பிரியாவிடை கொடுத்து அனுப்புதல் என்ற சூழல்சார் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: בְּשִׂמְחָה וּבְשִׁרִים
  choice: மகிழ்ச்சியோடும் பாடல்களோடும்
  rationale: பெயர்ச்சொற்களின் இணை அமைப்பையும் பிரியாவிடை விழாவின் மகிழ்ச்சித் தொனியையும் காக்கிறது.
- source_word: בְּתֹף
  choice: தப்பு
  rationale: கையால் அடித்து இசைக்கப்படும் தோல் இசைக்கருவியைக் குறிக்கும், வாசகர்களுக்குப் புரியக்கூடிய தற்போதைய தமிழ்ச்சொல்.
- source_word: וּבְכִנּוֹר
  choice: யாழின் இசையோடும்
  rationale: כִּנּוֹר என்பது யாழ் வகையைச் சேர்ந்த நரம்பிசைக் கருவி; பொதுவான ‘வீணை’ அல்லது தெளிவற்ற ‘இசைக்கருவி’ என்பதைவிட இது மூலத்துக்கு நெருக்கமானது.
