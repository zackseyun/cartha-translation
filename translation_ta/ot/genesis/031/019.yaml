  text: וְ/לָבָ֣ן הָלַ֔ךְ לִ/גְזֹ֖ז אֶת צֹאנ֑/וֹ וַ/תִּגְנֹ֣ב רָחֵ֔ל אֶת הַ/תְּרָפִ֖ים אֲשֶׁ֥ר לְ/אָבִֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/019.yaml
  text: Laban had gone to shear his flock[a], and Rachel stole the household idols that belonged to her father.
translation:
  language: ta
  text: லாபான் தன் மந்தையின் மயிரைக் கத்தரிக்கச் சென்றிருந்தபோது, ராகேல் தன் தந்தைக்குச் சொந்தமான வீட்டுத் தெய்வச் சிலைகளை[a] திருடினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘தெராபீம்’; ‘வீட்டுத் தெய்வங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלַךְ
  choice: சென்றிருந்தான்
  rationale: முதன்மை நிகழ்வான ராகேலின் திருட்டுக்கு முன்பே லாபான் சென்றுவிட்டிருந்ததைப் பின்னணித் தகவலாகக் காட்டும் எபிரெய இறந்தகால வடிவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִגְזֹז אֶת צֹאנוֹ
  choice: தன் மந்தைக்கு மயிர் கத்தரிக்க
  rationale: גזז என்பது ஆடு முதலான மந்தை விலங்குகளின் மயிரைக் கத்தரிப்பதைக் குறிக்கிறது; צֹאן செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய கூட்டுப்பெயர் என்பதால் ‘மந்தை’ என வழங்கப்பட்டது.
- source_word: וַתִּגְנֹב
  choice: திருடினாள்
  rationale: גנב என்பதன் நேரடியான திருடுதல் என்ற ஒழுக்க-சட்ட வலிமையை மென்மைப்படுத்தாமல் பாதுகாக்கிறது.
- source_word: הַתְּרָפִים
  choice: குலதெய்வச் சிலைகள்
  rationale: தெராபீம் என்பது குடும்பம் அல்லது இல்லத்துடன் தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கிறது. ‘குலதெய்வச் சிலைகள்’ அவற்றின் குடும்பச் சார்பையும் உருவவழிபாட்டுத் தன்மையையும் சாதாரண வாசகருக்குப் புரியுமாறு தெரிவிக்கிறது; மூலச்சொல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר לְאָבִיהָ
  choice: தன் தந்தைக்குச் சொந்தமான
  rationale: לְ இங்கு உடைமையைச் சுட்டுகிறது; இந்தத் தமிழ் வடிவம் அந்த உறவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְ
  choice: அப்போது
  rationale: முதல் பின்னணிக் கூற்றையும் தொடர்ந்து நிகழும் முதன்மைச் செயலையும் இயல்பான தமிழ் உரைநடையில் இணைக்கிறது; தனியாக ‘இப்போது’ என்ற காலப்பொருளை இறக்குமதி செய்யவில்லை.
theological_decisions:
- issue: תְּרָפִים என்ற குடும்ப வழிபாட்டுப் பொருட்களைக் குறிக்கும் சொல்லின் மொழிபெயர்ப்பு
  choice: குலதெய்வச் சிலைகள்
  alternative: தெராபீம்; வீட்டுத் தெய்வங்கள்
  rationale: இது வீட்டார் அல்லது குலத்தாருடன் தொடர்புடைய வழிபாட்டு உருவங்களைக் குறிக்கிறது. ‘குலதெய்வச் சிலைகள்’ அவற்றின் சமயச் செயல்பாட்டை மறைக்காமல் இயல்பான தமிழில் தருகிறது; குறிப்பிட்ட சமய மரபின் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. பின்னணிச் செயலைக் காட்ட ‘சென்றிருந்தான்’ பயன்படுத்தப்பட்டது; எபிரெய இணைப்பின் உரைநடைச் செயல்பாடு ‘அப்போது’ மூலம் இயல்பாக்கப்பட்டது.
