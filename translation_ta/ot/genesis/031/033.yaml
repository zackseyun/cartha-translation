base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/033.yaml
  text: So Laban went into Jacob’s tent[a], and into Leah’s tent, and into the tent of the two female servants, but he did not find them. Then he came out of Leah’s tent and went into Rachel’s tent.
translation:
  language: ta
  text: லாபான் யாக்கோபின் கூடாரத்திற்குள்ளும், லேயாளின் கூடாரத்திற்குள்ளும், அந்த இரண்டு பணிப்பெண்களின் கூடாரத்திற்குள்ளும் சென்றான்; ஆனால் அவன் தேடியவற்றைக் காணவில்லை.[a] பின்பு அவன் லேயாளின் கூடாரத்திலிருந்து வெளியே வந்து, ராகேலின் கூடாரத்திற்குள் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘காணவில்லை’ என்று மட்டுமே உள்ளது; எதைக் காணவில்லை என்பது இவ்வசனத்தில் கூறப்படவில்லை. சூழலின்படி, லாபான் தேடிய வீட்டுத் தெய்வச் சிலைகளையே இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... בְּאֹהֶל
  choice: கூடாரத்திற்குள் சென்றான்
  rationale: בוא என்பதுடன் בְּ வருவது ஓர் இடத்திற்குள் செல்வதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் தேடுதல் நடந்த இடவரிசையைத் தெளிவாகவும் காட்டுகிறது.
- source_word: אֹהֶל
  choice: கூடாரம்
  rationale: பிதாப்பிதாக்களின் காலப் பின்னணியில் இது பொதுவாகக் குறிக்கும் தற்காலிகத் தங்குமிடமான ‘கூடாரம்’ என்ற நேரடியான பொருள் பாதுகாக்கப்படுகிறது.
- source_word: שְׁתֵּי הָאֲמָהֹת
  choice: அந்த இரண்டு பணிப்பெண்கள்
  rationale: אָמָה ஒரு வீட்டில் பணிபுரியும் அடிமை நிலைக்குட்பட்ட பெண்ணைக் குறிக்கலாம். ‘பணிப்பெண்கள்’ என்பது நவீன தமிழில் இயல்பானது; மூலச்சொல்லின் பாலினத்தையும் இல்லச் சூழலையும் வெளிப்படுத்துகிறது, ஆனால் இவ்வசனத்தின் நோக்கத்திற்கு அப்பாற்பட்டு கடுமையை அதிகரிக்காது.
- source_word: וְלֹא מָצָא
  choice: ஆனால் அவன் தேடியவற்றைக் காணவில்லை
  rationale: எபிரெயத்தில் செயப்படுபொருள் கூறப்படவில்லை. தமிழில் வெறும் ‘காணவில்லை’ என்பது தெளிவுக்குறைவாக இருப்பதால், சூழலில் லாபான் தேடிய பொருட்களைச் சுட்டும் ‘தேடியவற்றை’ சேர்க்கப்பட்டது; அடிக்குறிப்பு மூலத்தின் மறைநிலையைத் தெரிவிக்கிறது.
- source_word: וַיֵּצֵא מֵאֹהֶל לֵאָה
  choice: பின்பு அவன் லேயாளின் கூடாரத்திலிருந்து வெளியே வந்து
  rationale: יצא என்பதன் வெளியேறும் இயக்கம் நேரடியாகக் காக்கப்படுகிறது; தொடர் நிகழ்வைக் காட்ட வாவ் ‘பின்பு’ என இயல்பாக்கப்பட்டுள்ளது.
- source_word: וַיָּבֹא בְּאֹהֶל רָחֵל
  choice: ராகேலின் கூடாரத்திற்குள் சென்றான்
  rationale: முன்னர் வந்த அதே இயக்கவினைச்சொல்லுடன் ஒத்த மொழிபெயர்ப்பு தேடுதல் வரிசையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: וְלֹא מָצָא என்பதில் கூறப்படாத செயப்படுபொருள்
  choice: முதன்மை உரையில் ‘அவன் தேடியவற்றை’ என்று சூழல்சார் பொதுவான செயப்படுபொருளை வழங்கி, அடிக்குறிப்பில் அது எபிரெயத்தில் கூறப்படவில்லை என்றும் வீட்டுத் தெய்வச் சிலைகளைச் சுட்டுகிறது என்றும் விளக்குதல்
  alternative: ‘அவற்றைக் காணவில்லை’ அல்லது ‘எதையும் காணவில்லை’ என்று மொழிபெயர்த்தல்
  rationale: சுற்றியுள்ள உரை வீட்டுத் தெய்வச் சிலைகளையே தேடலின் இலக்காகக் காட்டுகிறது. ஆயினும் இவ்வசனம் அவற்றைப் பெயரிட்டு மறுபடியும் கூறாததால், மூலத்தின் மறைநிலையை அடிக்குறிப்பு பாதுகாக்கிறது; எந்தக் கோட்பாட்டு விளக்கமும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையில் மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் மீண்டும் வரும் ‘கூடாரத்திற்குள்’ என்ற அமைப்பு தேடுதலின் படிப்படியான வரிசையைத் தக்கவைக்கப் பாதுகாக்கப்பட்டுள்ளது.
