base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/004.yaml
  text: So Jacob sent and called Rachel and Leah to the field[a], to his flock[b],
translation:
  language: ta
  text: அப்போது யாக்கோபு ஆளனுப்பி, ராகேலையும் லேயாளையும் தன் மந்தை இருந்த வயலுக்கு[a] அழைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “வயலுக்கு, தன் மந்தையிடம்” என்று உள்ளது. இறுதித் தொடர், அவர்கள் சந்திக்க வேண்டிய இடத்தை இன்னும் துல்லியமாகக் குறிப்பிடலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ஆளனுப்பி
  rationale: இங்கு שׁלח என்பது யாக்கோபு அவர்களை அழைத்து வர ஒருவரை அனுப்பியதைக் குறிக்கிறது. அடுத்துள்ள ‘அழைத்தான்’ என்பதுடன் சேர்த்து ‘ஆளனுப்பி’ என்பது இயல்பான தமிழில் அந்தச் செயலைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וַיִּקְרָא
  choice: அழைத்தான்
  rationale: קרא என்பதற்கு இச்சூழலில் ஒருவரை வரும்படி அழைப்பது என்ற பொருள். ‘அழைத்தான்’ என்பது எளிமையான, இயல்பான கதைநடைச் சொல்.
- source_word: לְרָחֵל וּלְלֵאָה
  choice: ராகேலையும் லேயாளையும்
  rationale: பெயர்கள் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவங்களில் தரப்பட்டுள்ளன; வினையின் நேர்ச்செயப்படுபொருள்களாக இருப்பதால் ‘ஐயும்’ உருபு சேர்க்கப்பட்டுள்ளது.
- source_word: הַשָּׂדֶה
  choice: வயலுக்கு
  rationale: שׂדה என்பது வயல் அல்லது திறந்த வெளிப்பகுதியைக் குறிக்கிறது. இங்கு செல்ல வேண்டிய இடத்தைச் சுட்டுவதால் ‘வயலுக்கு’ இயல்பான தேர்வு.
- source_word: אֶל צֹאנוֹ
  choice: தன் மந்தை இருந்த
  rationale: சொல்லுக்கு நெருக்கமாக ‘தன் மந்தையிடம்’ எனலாம். ஆனால் இந்த இறுதித் தொடர் வயலில் சந்திக்க வேண்டிய இடத்தை இன்னும் துல்லியமாகக் குறிப்பிடுவதாகத் தோன்றுவதால், தமிழில் இயல்பாக ‘தன் மந்தை இருந்த வயலுக்கு’ என்று அமைக்கப்பட்டுள்ளது; மூலத்தின் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆளனுப்பி ... அழைத்தான்’ என்பது இரண்டு எபிரெய வினைகளையும் இயல்பான தமிழில் பாதுகாக்கிறது. இரு இடத்தொடர்களுக்கிடையிலான மூலமொழி ambiguity அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
