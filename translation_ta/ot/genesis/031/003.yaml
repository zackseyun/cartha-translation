id: GEN.31.3
reference: Genesis 31:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל יַעֲקֹ֔ב שׁ֛וּב אֶל אֶ֥רֶץ אֲבוֹתֶ֖י/ךָ וּ/לְ/מוֹלַדְתֶּ֑/ךָ וְ/אֶֽהְיֶ֖ה עִמָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/003.yaml
  text: Then Yahweh said to Jacob[a], “Return to the land of your fathers and to your kindred, and I will be with you.”
translation:
  language: ta
  text: அப்போது யாவே யாக்கோபிடம், “உன் தந்தையருடைய நாட்டிற்கும் உன் உறவினர்களிடமும்[a] திரும்பிப் போ. நான் உன்னோடு இருப்பேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் பிறப்பிடத்திற்கு” அல்லது “உன் பூர்வீக நாட்டிற்கு.” எபிரெயச் சொல் சூழலைப் பொறுத்து உறவினர்களையோ ஒருவரின் பிறப்பிடம் அல்லது பூர்வீக நாட்டையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ்-தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. ‘அப்போது’ என்பது அதன் தொடர்ச்சிப் பொருளை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் இறைவனின் தனிப்பெயரான நான்கு எழுத்துப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: שׁוּב
  choice: திரும்பிப் போ
  rationale: இது திரும்பிச் செல்லுமாறு கூறும் கட்டளை. ‘திரும்பிப் போ’ என்பது திசை சார்ந்த பொருளையும் நேரடியான கட்டளையையும் இயல்பாகத் தருகிறது.
- source_word: אֶל אֶרֶץ אֲבוֹתֶיךָ
  choice: உன் தந்தையருடைய நாட்டிற்கு
  rationale: ‘உன் தந்தையரின் நிலம்/நாடு’ என்ற எபிரெய அமைப்பை நெருக்கமாகப் பாதுகாக்கிறது; ‘முன்னோர்கள்’ எனப் பொதுமைப்படுத்தாமல் மூலத்தின் ஆண்பால் குடும்பச் சொல்லையும் தக்கவைக்கிறது.
- source_word: וּלְמוֹלַדְתֶּךָ
  choice: உன் உறவினரிடமும்[a]
  rationale: מוֹלֶדֶת என்பது உறவினர் குழுவையோ ஒருவரின் பிறப்பிடம் அல்லது பூர்வீக நாட்டையோ குறிக்கலாம். இங்கு ‘தந்தையருடைய நாடு’ என்பதோடு வருவதால் உறவுமுறை சார்ந்த பொருள் பொருத்தமாக உள்ளது; அடிப்படைத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְאֶהְיֶה עִמָּךְ
  choice: நான் உன்னோடு இருப்பேன்
  rationale: இது இறைவனின் உடனிருப்பைக் குறித்த நேரடியான வாக்குறுதி; நவீன தமிழில் இயல்பாகவும் கண்ணியமாகவும் மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல வசனம் இறைவனின் தனிப்பெயரைப் பயன்படுத்துகிறது. ‘யாவே’ அதை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெயப் பெயரின் பரவலாக ஏற்கப்பட்ட ஒலிப்புக்கு நெருக்கமாகத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இறைவனின் உரைக்கு ஏற்ற கண்ணியமும் சாதாரண வாசகர்களுக்குப் புரியும் இயல்பும் பேணப்பட்டுள்ளன. ‘தந்தையர்’ மூலத்தின் குடும்பச் சொல்லைத் தக்கவைக்கிறது; மוֹלֶדֶת என்பதிலுள்ள உண்மையான பொருள் இருமை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
