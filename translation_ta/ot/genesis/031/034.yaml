base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/034.yaml
  text: Rachel had taken the household idols[a], put them in the camel’s saddle cushion, and sat on them. Laban felt through the whole tent[c][b], but did not find them.
translation:
  language: ta
  text: ராகேல் வீட்டுத் தெய்வச் சிலைகளை[a] எடுத்து, ஒட்டகச் சேண மெத்தைக்குள்[b] வைத்து, அவற்றின்மேல் உட்கார்ந்தாள். லாபான் கூடாரம் முழுவதையும் கைகளால் தடவித் தேடினார்; ஆனால் அவற்றைக் கண்டுபிடிக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தெராபீம்கள்” அல்லது “வீட்டுத் தெய்வங்கள்.” எபிரெயச் சொல் வீட்டில் பயன்படுத்தப்பட்ட வழிபாட்டு உருவங்களையோ பொருட்களையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒட்டகச் சேணத்துக்குள்.” எபிரெயச் சொல் ஒட்டகச் சவாரி உபகரணத்தின் மெத்தையிட்ட பகுதியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: வீட்டுத் தெய்வச் சிலைகள்
  rationale: תְּרָפִים என்பது வீட்டில் வழிபாட்டுக்காக வைக்கப்பட்ட உருவங்களையோ வழிபாட்டுப் பொருட்களையோ குறிக்கிறது. ஒலிபெயர்ப்பை விட, நவீனத் தமிழ் வாசகருக்கு பொருளைத் தெளிவாகக் கூறும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בְּכַר הַגָּמָל
  choice: ஒட்டகச் சேண மெத்தைக்குள்
  rationale: כַּר என்பது மெத்தை அல்லது மெத்தையிட்ட பகுதியைக் குறிக்கும். ஒட்டகத்தின் சவாரி உபகரணத்தில் இருந்த மெத்தையிட்ட பகுதியே இங்கு நோக்கமாக இருக்கலாம்; בְ முன்னொட்டின் உள்ளிடப் பொருளையும் ‘மெத்தைக்குள்’ வெளிப்படுத்துகிறது.
- source_word: וַתֵּשֶׁב עֲלֵיהֶם
  choice: அவற்றின்மேல் உட்கார்ந்திருந்தாள்
  rationale: ராகேல் பொருட்களை மறைத்து அவற்றின்மேல் அமர்ந்த நிலையை இயல்பான தமிழில் காட்டுகிறது. முந்திய செயல்களின் பின்னணித் தொடரோடு இது பொருந்துகிறது.
- source_word: וַיְמַשֵּׁשׁ
  choice: கைகளால் தடவித் தேடினார்
  rationale: מששׁ வெறுமனே தேடுவதை அல்ல, தொட்டுத் தடவித் தேடுவதை வலியுறுத்துகிறது. அந்தத் தொட்டுணரும் நுணுக்கம் தமிழில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: כָּל הָאֹהֶל
  choice: கூடாரம் முழுவதையும்
  rationale: எபிரெயச் சொற்றொடரின் முழுமைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וְלֹא מָצָא
  choice: ஆனால் அவற்றைக் கண்டுபிடிக்கவில்லை
  rationale: எபிரெயத்தில் செயப்படுபொருள் மறைமுகமாக இருந்தாலும், தமிழில் முந்திய தெய்வச் சிலைகளைக் குறிக்கும் ‘அவற்றை’ சேர்ப்பது தெளிவை அளிக்கிறது. ‘ஆனால்’ தேடலுக்கும் தோல்விக்கும் இடையிலான எதிர்மறைத் தொடர்பை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: תְּרָפִים என்பதன் தன்மை
  choice: வீட்டுத் தெய்வச் சிலைகள்
  alternative: தெராபீம்கள் / வீட்டுத் தெய்வங்கள்
  rationale: இவை தெய்வங்களா, அவற்றைக் குறிக்கும் வழிபாட்டு உருவங்களா என்ற சொற்பொருள் பரப்பை முற்றிலும் தீர்மானிக்காமல், கதைச் சூழலில் எடுத்துச் சென்று மறைக்கக்கூடிய வழிபாட்டுப் பொருட்கள் என்பதை ‘சிலைகள்’ தெளிவாக்குகிறது; மாற்று வாய்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. முதல் வாக்கியத்தின் இறந்தகாலப் பின்னணித் தன்மையை ‘உட்கார்ந்திருந்தாள்’ இயல்பாக உணர்த்துகிறது. ‘கைகளால் தடவித் தேடினார்’ என்பது மூல வினையின் தொட்டுத் தேடும் நுணுக்கத்தைப் பாதுகாக்கிறது.
