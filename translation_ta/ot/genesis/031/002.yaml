source:
  edition: WLC
  text: וַ/יַּ֥רְא יַעֲקֹ֖ב אֶת פְּנֵ֣י לָבָ֑ן וְ/הִנֵּ֥ה אֵינֶ֛/נּוּ עִמּ֖/וֹ כִּ/תְמ֥וֹל שִׁלְשֽׁוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/002.yaml
  text: And Jacob saw Laban’s face[a], and behold[b], it was not toward him as before.
translation:
  language: ta
  text: யாக்கோபு லாபானின் முகத்தைப் பார்த்தான்; இதோ, லாபான் முன்புபோல் யாக்கோபோடு இல்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “அவன் அவனோடு நேற்றும் அதற்கு முந்தின நாளும் இருந்ததுபோல் இல்லை.” அதாவது, யாக்கோபின்மீதான லாபானின் அணுகுமுறை முன்பிருந்ததுபோல் இல்லை.
    reason: மூலமொழியின் உறவுநிலை மற்றும் காலமரபுச் சொற்றொடர்களை விளக்குதல்
lexical_decisions:
- source_word: וַיַּרְא
  choice: பார்த்தான்
  rationale: ראה என்பதன் வழக்கமான கதைநடைப் பொருளான ‘பார்த்தான்’ என்பதை நேரடியாகத் தருகிறது; வெறும் பார்வையைத் தாண்டிய விளக்கத்தைத் தேவையின்றிச் சேர்ப்பதில்லை.
- source_word: פְּנֵי לָבָן
  choice: லாபானின் முகத்தை
  rationale: ‘முகம்’ என்பது வெளிப்படும் மனநிலையையோ அணுகுமுறையையோ குறிக்கக்கூடிய எபிரெய உருவகத்தைத் தமிழிலும் காக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: அடுத்து வரும் கவனிப்பை முன்னிறுத்தும் הִנֵּה என்பதன் கதைநடை வலிமையையும் உயிரோட்டத்தையும் காக்கிறது.
- source_word: אֵינֶנּוּ עִמּוֹ
  choice: லாபான் தன்னோடு இல்லை
  rationale: சொல்லாட்சிக்கு நெருக்கமாக ‘அவன் அவனோடு இல்லை’ என்ற உறவுநிலைச் சொற்றொடரைப் பேணுகிறது; தமிழில் சுட்டுப்பெயர் குழப்பம் வராதபடி லாபானின் பெயரும் யாக்கோபைக் குறிக்கும் ‘தன்னோடு’ என்பதும் பயன்படுத்தப்பட்டுள்ளன.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: முன்புபோல்
  rationale: சொல்லுக்கு சொல் ‘நேற்றும் முந்தின நாளும் இருந்ததுபோல்’ என்ற காலமரபுச் சொற்றொடரின் இயல்பான தமிழ்ப் பொருள் ‘முன்புபோல்’ என்பதாகும்.
theological_decisions:
- issue: אֵינֶנּוּ עִמּוֹ என்பதில் மாறியது லாபானின் உடனிருப்பா அல்லது யாக்கோபின்மீதான மனநிலையா?
  choice: லாபான் முன்புபோல் தன்னோடு இல்லை
  alternative: லாபானின் மனநிலை முன்புபோல் தன்மீது இல்லை
  rationale: சூழல் லாபானின் மாறிய அணுகுமுறையைக் காட்டினாலும், மூலத்தின் ‘அவனோடு இல்லை’ என்ற உறவுநிலை உருவகத்தை முதன்மை உரை வெளிப்படையான மனநிலை விளக்கமாக மாற்றாமல் காக்கிறது; அடிக்குறிப்பு சூழற்பொருளைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: இயல்பான நவீனத் தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘முகம்’ என்ற எபிரெய உருவகம் காக்கப்பட்டு, சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்க லாபானின் பெயர் மீண்டும் குறிப்பிடப்பட்டுள்ளது. முதன்மை உரையில் மூலத்தின் உறவுநிலைத் தெளிவின்மை அளவோடு பேணப்பட்டு, அதன் சூழற்பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
