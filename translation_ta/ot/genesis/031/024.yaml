base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/024.yaml
  text: But God came to Laban the Aramean in a dream at night and said to him[c][b][a], “Be careful not to speak to Jacob either good or bad.”
translation:
  language: ta
  text: ஆனால் இரவில் கனவில் தேவன் அரமேயனான லாபானிடம் வந்து, அவனிடம், “நீ யாக்கோபிடம் நல்லதோ கெட்டதோ எதுவும் பேசாதபடி எச்சரிக்கையாக இரு[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “நல்லதிலிருந்து கெட்டதுவரை.” இது சாதகமாகவோ பாதகமாகவோ எதையும் பேசுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்து
  rationale: בוא என்பதன் இயல்பான இயக்கப் பொருளான ‘வருதல்’ என்பதைக் காக்கிறது; வெளிப்பட்டார் என்று மொழிபெயர்ப்பது மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கும்.
- source_word: לָבָן הָאֲרַמִּי
  choice: அரமேயனான லாபான்
  rationale: אֲרַמִּי என்பது பிற்காலப் புவியியல் சொல்லான ‘சீரியன்’ என்பதைவிட துல்லியமாக ‘அரமேயன்’ என்ற இனப்பெயரைக் குறிக்கிறது.
- source_word: בַּחֲלֹם הַלָּיְלָה
  choice: இரவில் கனவில்
  rationale: கனவு மற்றும் இரவு ஆகிய இரு கூறுகளையும் இயல்பான நவீனத் தமிழில் சுருக்கமாகக் காக்கிறது.
- source_word: הִשָּׁמֶר לְךָ
  choice: எச்சரிக்கையாக இரு
  rationale: இது தன்னைக் காத்துக்கொள்ளும்படி கூறும் எச்சரிக்கைச் சூத்திரம்; தமிழில் அதன் எச்சரிப்பு வலிமையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: פֶּן תְּדַבֵּר עִם יַעֲקֹב
  choice: நீ யாக்கோபிடம் ... பேசாதபடி
  rationale: פֶּן தடை கலந்த எச்சரிக்கையைத் தருகிறது; דבר עם என்பது இச்சூழலில் ‘யாக்கோபிடம் பேசுதல்’ என்று இயல்பாக அமைகிறது.
- source_word: מִטּוֹב עַד רָע
  choice: நல்லதோ கெட்டதோ எதுவும்
  rationale: சொல்லுக்கு நெருக்கமான ‘நல்லதிலிருந்து கெட்டதுவரை’ என்ற வடிவத்தின் முழு வரம்பைக் குறிக்கும் மரபுத்தொடர் பொருளைத் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֱלֹהִים என்பவரின் அடையாளம்
  choice: தேவன்
  alternative: தெய்வம் / தேவர்கள்
  rationale: ஒருமை வினை வடிவமும் கதைச் சூழலும் ஒரே தேவனைக் குறிக்கின்றன; பன்மையையோ தெளிவற்ற தெய்வீக ஆளையோ காட்டவில்லை.
- issue: மִטּוֹב עַד רָע என்ற எச்சரிக்கையின் பரப்பு
  choice: நல்லதோ கெட்டதோ எதுவும் பேசக்கூடாது
  alternative: நல்லதிலிருந்து கெட்டதுவரை பேசக்கூடாது
  rationale: எபிரெய மரபுத்தொடர் எல்லா வகையான பேச்சையும் தடைசெய்கிறது; நல்ல அல்லது தீய ஆலோசனையின் இறையியல் மதிப்பீடாக அதைச் சுருக்காமல், அதன் பரப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைக் கொண்டுள்ளது. ‘அரமேயன்’ மூல இனப்பெயரைப் பாதுகாக்கிறது. எச்சரிக்கையின் எபிரெய மரபுத்தொடர் முதன்மை உரையில் பொருளுடன் தரப்பட்டு, நேர்ச்சொல் வடிவம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
