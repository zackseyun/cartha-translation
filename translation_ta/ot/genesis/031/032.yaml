  text: עִ֠ם אֲשֶׁ֨ר תִּמְצָ֣א אֶת אֱלֹהֶי/ךָ֮ לֹ֣א יִֽחְיֶה֒ נֶ֣גֶד אַחֵ֧י/נוּ הַֽכֶּר לְ/ךָ֛ מָ֥ה עִמָּדִ֖/י וְ/קַֽח לָ֑/ךְ וְ/לֹֽא יָדַ֣ע יַעֲקֹ֔ב כִּ֥י רָחֵ֖ל גְּנָבָֽתַ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/032.yaml
  text: Whoever is found with your gods shall not live[a]. In the presence of our brothers, identify what of yours is with me[c][b], and take it for yourself.” Jacob did not know that Rachel had stolen them.
translation:
  language: ta
  text: “உம்முடைய தெய்வங்களை யாரிடமாவது நீர் கண்டால், அவர் உயிரோடு இருக்கக்கூடாது.[a] நம் சகோதரர்கள் முன்னிலையில், என்னிடம் உம்முடையது என்ன இருக்கிறது என்பதை அடையாளம் கண்டு, அதை எடுத்துக்கொள்ளுங்கள்.[b] ராகேல் அவற்றைத் திருடியிருந்தாள் என்பது யாக்கோபுக்குத் தெரியவில்லை.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்கு நெருக்கமாக: “உம்முடைய தெய்வங்களை யாரிடம் நீர் காண்கிறீரோ, அவர் உயிரோடு இருக்கக்கூடாது.”'
    reason: lexical_alternative
  - marker: b
    text: “சகோதரர்கள்” என்பது உடன்பிறந்த சகோதரர்களை மட்டும் அல்லாமல், அங்கிருந்த ஆண் உறவினர்களையோ உறவுக் குழுவினரையோ குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: עִם אֲשֶׁר תִּמְצָא
  choice: யாரிடம் காணப்படுகின்றனவோ
  rationale: எபிரெய மொழியின் நேரடியான அமைப்பு ‘யாரிடம் நீர் காண்கிறீரோ’ என்பதாக இருந்தாலும், தமிழில் இயல்பான வரையறையற்ற தொடர்புச் சொற்றொடராகவும் உடைமைப் பொருளைத் தெளிவாகவும் காட்டுகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உம்முடைய தெய்வங்கள்
  rationale: மூலத்தில் உள்ள பன்மையை நேரடியாகப் பாதுகாக்கிறது; சூழலில் வீட்டுத் தெய்வச் சிலைகள் குறிக்கப்பட்டாலும், இச்சொல்லிலேயே ‘தெராபீம்’ என்று இல்லை.
- source_word: לֹא יִחְיֶה
  choice: அவர் உயிரோடு இருக்கக்கூடாது
  rationale: இது மரணத் தீர்ப்பு அல்லது சாப உரையாக இருக்கக்கூடிய வலிமையைப் பாதுகாக்கிறது; வெறும் எதிர்கால முன்னறிவிப்பாக மாற்றவில்லை.
- source_word: נֶגֶד אַחֵינוּ
  choice: நம் சகோதரர்கள் முன்னிலையில்
  rationale: ‘முன்னிலையில்’ என்பது נֶגֶד என்பதன் பொருளை இயல்பாகத் தருகிறது; ‘சகோதரர்கள்’ என்ற மூலச்சொல், விரிந்த உறவினர் குழுவைக் குறிக்கக்கூடிய தெளிவின்மையுடன் பாதுகாக்கப்படுகிறது.
- source_word: הַכֶּר לְךָ מָה עִמָּדִי
  choice: என்னிடம் இருப்பவற்றில் உம்முடையது எது என்று கண்டறிந்து
  rationale: சொந்தப் பொருளை ஆராய்ந்து அடையாளம் காணும்படி விடுக்கப்படும் சவாலை, எபிரெயத்தின் சுருக்கமான தொடரை மிகைப்படுத்தாமல் தெளிவாக்குகிறது.
- source_word: וְקַח לָךְ
  choice: அதை எடுத்துக்கொள்ளும்
  rationale: லாபானை நேரடியாகச் சுட்டும் ஒருமை மரியாதை ஏவலை இயல்பான தமிழில் தருகிறது.
- source_word: וְלֹא יָדַע יַעֲקֹב
  choice: ஆனால் ... யாக்கோபுக்குத் தெரியாது
  rationale: முன்னைய துணிவான கூற்றுக்கும் யாக்கோபின் அறியாமைக்கும் இடையிலுள்ள கதைமாந்த முரண்பாட்டைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: גְּנָבָתַם
  choice: அவற்றை ... திருடியிருந்தது
  rationale: பன்மை பின்னொட்டை ‘அவற்றை’ என்று பாதுகாத்து, யாக்கோபின் கூற்றுக்கு முன்பே நிகழ்ந்த செயலை இறந்தகால முன்னிலை வடிவில் காட்டுகிறது.
theological_decisions:
- issue: லֹא יִחְיֶה என்பதன் உரை வலிமை
  choice: உயிரோடு இருக்கக்கூடாது
  alternative: உயிரோடு இருக்கமாட்டார்
  rationale: இந்த வடிவம் மரணத் தீர்ப்பு அல்லது சாபம் என்ற வலிமையைத் தக்கவைக்கிறது; இதை உறுதியான தீர்க்கதரிசனமாக மட்டும் வாசிக்கும்படி கட்டுப்படுத்தவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகருக்கு புரியும் கண்ணியமான நடை. யாக்கோபும் லாபானும் இடையிலான உரையாடலில் ஒருமை மரியாதை வடிவமான ‘உம்/உம்முடைய’ பயன்படுத்தப்பட்டது. மூலத்தில் இவ்வசனத்தில் இல்லாத ‘வீட்டுத் தெய்வங்கள்’ என்ற விளக்கத்தை முதன்மை உரையில் சேர்க்காமல், ‘தெய்வங்கள்’ என்ற நேரடி சொல்லே வைக்கப்பட்டது.
