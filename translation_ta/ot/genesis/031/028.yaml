  yaml_path: translation/ot/genesis/031/028.yaml
  text: And you did not let me kiss my sons and my daughters[a]. Now you have acted foolishly.
translation:
  language: ta
  text: என் மகன்களையும் என் மகள்களையும் முத்தமிட நீ என்னை அனுமதிக்கவில்லை.[a] இப்போது நீ முட்டாள்தனமாக நடந்துகொண்டாய்.
