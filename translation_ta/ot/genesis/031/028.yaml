lexical_decisions:
- source_word: נְטַשְׁתַּנִי
  choice: நீ எனக்கு வாய்ப்பளிக்கவில்லை
  rationale: נטשׁ என்பதன் அடிப்படைப் பொருள் ‘விட்டுவிடுதல்’; ஆனால் ‘முத்தமிட’ என்ற வினையெச்சத்துடன் இங்கு வருவதால், ஒரு செயலைச் செய்ய வாய்ப்பளித்தல் என்ற பொருள் இயல்பாக வெளிப்படுகிறது. ‘வாய்ப்பளிக்கவில்லை’ என்பது லாபானின் குற்றச்சாட்டைத் தெளிவாகவும் நவீன தமிழில் இயல்பாகவும் தருகிறது.
- source_word: לְנַשֵּׁק
  choice: முத்தமிட
  rationale: எபிரெயச் சொல் நேரடியாக ‘முத்தமிட’ எனப் பொருள்படும். பிரிவுபசார முத்தம் என்பது சூழலால் உணரப்பட்டாலும், மூலத்தில் வெளிப்படையாக இல்லாத ‘விடைபெற’ என்ற கருத்து உரையில் சேர்க்கப்படவில்லை.
- source_word: לְבָנַי וְלִבְנֹתָי
  choice: என் மகன்களையும் என் மகள்களையும்
  rationale: மூலம் ஆண் பிள்ளைகளையும் பெண் பிள்ளைகளையும் தனித்தனியே குறிப்பிடுவதால், பொதுவான ‘என் பிள்ளைகளை’ என்பதற்குப் பதிலாக இரண்டும் பாதுகாக்கப்பட்டுள்ளன.
- source_word: עַתָּה
  choice: இப்போது
  rationale: லாபான் யாக்கோபின் செயலை மதிப்பிடத் தொடங்கும் நேர/உரையாடல் குறியீடாக நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הִסְכַּלְתָּ עֲשׂוֹ
  choice: நீ முட்டாள்தனமாக நடந்துகொண்டாய்
  rationale: இந்த எபிரெயச் சொற்றொடர் ‘முட்டாள்தனமாகச் செய்தாய்/நடந்தாய்’ என்ற கருத்தைத் தருகிறது. தேர்ந்தெடுத்த வடிவம் இயல்பான நவீனத் தமிழில் செயலைக் குற்றஞ்சாட்டுகிறது; நபரையே ‘முட்டாள்’ என்று பெயரிடுவதில்லை.
