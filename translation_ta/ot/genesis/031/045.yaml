  source_fidelity: 'முதன்மை உரை எபிரெய வினைவரிசையையும் பொருளையும் துல்லியமாகத் தருகிறது: யாக்கோபு ஒரு கல்லை எடுத்து, அதை מַצֵּבָה ஆக நிறுவினார். ‘தூணாக நிறுத்தினார்’ என்பது וַיְרִימֶהָ மற்றும் மַצֵּבָה ஆகியவற்றின் சூழல்சார் பொருளைச் சரியாகக் காக்கிறது; நினைவுச் சின்னம் அல்லது வழிபாட்டுப் பொருள் என்ற கூடுதல் விளக்கத்தை முதன்மை உரையில் புகுத்தவில்லை.'
  naturalness: ‘பின்பு யாக்கோபு ஒரு கல்லை எடுத்து, அதை ஒரு தூணாக நிறுத்தினார்’ என்பது நவீன நிலையான தமிழில் தெளிவான, கண்ணியமான கதைநடை. ஆனால் அடிக்குறிப்பில் உள்ள ‘நிற்கும் கல்’ இயல்பான தமிழ்ச் சொல்லாக்கமல்ல; ‘செங்குத்தாக நிறுத்தப்பட்ட கல்’ என்பது அந்த மாற்றுவழியைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
