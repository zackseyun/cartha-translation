  text: וַ/יִּקַּ֥ח יַעֲקֹ֖ב אָ֑בֶן וַ/יְרִימֶ֖/הָ מַצֵּבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/045.yaml
  text: Then Jacob took a stone and set it up as a pillar[a].
translation:
  language: ta
  text: பின்பு யாக்கோபு ஒரு கல்லை எடுத்து, அதை ஒரு தூணாக நிறுத்தினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செங்குத்தாக நிறுத்தப்பட்ட கல்” அல்லது “நினைவுக்கல்.” எபிரெயச் சொல் מַצֵּבָה நிமிர்த்தி வைக்கப்பட்ட கற்குறி அல்லது தூணைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்து
  rationale: לקח என்பதன் Qal wayyiqtol வடிவம் பொதுவாக ‘எடுத்தல்’ எனப் பொருள்படும்; தொடர்ச்சியான எபிரெயக் கதைநடைக்கு இயல்பான தமிழ் வினையெச்சமாக இது அமைகிறது.
- source_word: יַעֲקֹב
  choice: யாக்கோபு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: אָבֶן
  choice: ஒரு கல்லை
  rationale: ஒருமையில் உள்ள பெயர்ச்சொல்லைத் தமிழில் இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: וַיְרִימֶהָ
  choice: அதை ... நிறுத்தினார்
  rationale: பெண்பால் ஒருமை பின்னொட்டு முன்வரும் கல்லைக் குறிக்கிறது; இச்சூழலில் கல்லை நிமிர்த்தி நிலைநிறுத்திய செயலை ‘நிறுத்தினார்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: מַצֵּבָה
  choice: ஒரு தூணாக
  rationale: நிமிர்த்தி வைக்கப்பட்ட கற்குறி அல்லது தூண் என்பதே சொல்லின் அடிப்படைப் பொருள்; ‘தூண்’ சுருக்கமாகவும் பொருள் மிகைப்படுத்தாமலும் உள்ளது.
theological_decisions:
- issue: מַצֵּבָה என்பது நினைவுச்சின்ன அல்லது வழிபாட்டுச் சார்பைக் கொண்டிருக்கக்கூடிய சூழலில் அதன் மொழிபெயர்ப்பு
  choice: தூண்
  alternative: நிற்கும் கல்; நினைவுக்கல்
  rationale: இந்த வசனம் கல்லை நிமிர்த்தி வைத்த செயலை மட்டுமே வெளிப்படையாகக் கூறுகிறது; அதன் சமய அல்லது நினைவுச் செயல்பாட்டை இங்கே உறுதிப்படுத்தவில்லை. ஆகவே ‘தூண்’ மூலத்தின் திறந்த பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையான ஆனால் கண்ணியமான கதைநடை. எபிரெய வாக்கியத்தின் செயல்வரிசை காக்கப்பட்டுள்ளது; மַצֵּבָה என்பதன் சாத்தியமான நினைவு அல்லது வழிபாட்டுப் பொருள் பிரதான உரையில் கட்டாயப்படுத்தப்படாமல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
