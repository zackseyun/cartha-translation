base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/038.yaml
  text: These twenty years I have been with you; your ewes and your female goats have not miscarried[a], and I have not eaten the rams of your flock.
translation:
  language: ta
  text: இந்த இருபது ஆண்டுகளாக நான் உம்மோடு இருக்கிறேன். உமது பெண் செம்மறியாடுகளும் பெண் வெள்ளாடுகளும் குட்டிகளை இழக்கவில்லை[a]; உமது மந்தையின் கடாக்களை நான் உண்ணவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கருச்சிதைவு அடையவில்லை.” எபிரெய வினைச்சொல் சந்ததியை இழப்பதைக் குறிக்கலாம்; இக்கால்நடை வளர்ப்புச் சூழலில் அது கருச்சிதைவையோ குட்டிகளை இழப்பதையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשְׂרִים שָׁנָה
  choice: இந்த இருபது ஆண்டுகளாக
  rationale: எபிரெய மொழியின் சுட்டுச் சொல்லின் வலியுறுத்தலைத் தக்கவைத்து, நீடித்த காலத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழாக அமைக்கிறது.
- source_word: אָנֹכִי עִמָּךְ
  choice: நான் உம்மோடு இருந்தேன்
  rationale: எபிரெயத்தில் வெளிப்படையான வினைச்சொல் இல்லாவிட்டாலும், சூழலில் யாக்கோபு இருபது ஆண்டு கால உறவையும் பணியையும் பின்னோக்கிச் சுருக்கிக் கூறுகிறார்.
- source_word: רְחֵלֶיךָ
  choice: உமது செம்மறியாட்டுப் பெண் ஆடுகள்
  rationale: பொதுவாகச் செம்மறியாடுகள் என்று கூறாமல், மூலச்சொல் குறிக்கும் பெண்பாலினத் தன்மையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְעִזֶּיךָ
  choice: வெள்ளாட்டுப் பெண் ஆடுகள்
  rationale: மூலச்சொல் பெண் வெள்ளாடுகளைக் குறிப்பதால், அந்தக் கால்நடை மற்றும் பாலின வேறுபாட்டைத் தமிழில் வெளிப்படையாகக் காட்டுகிறது.
- source_word: לֹא שִׁכֵּלוּ
  choice: குட்டிகளை இழக்கவில்லை
  rationale: வினைச்சொல் கருச்சிதைவையும் பிறந்த குட்டியை இழப்பதையும் உள்ளடக்கக்கூடும்; விரிந்த எபிரெயப் பொருளையும் மேய்ப்புச் சூழலின் இயல்பான தெளிவின்மையையும் இது பாதுகாக்கிறது.
- source_word: וְאֵילֵי צֹאנְךָ
  choice: உமது மந்தையிலுள்ள கடாக்கள்
  rationale: אֵילִים என்பது ஆண் செம்மறியாடுகளைக் குறிக்கிறது; தமிழில் கால்நடைச் சூழலுக்கு ஏற்ற ‘கடாக்கள்’ என்ற சொல்லைத் தேர்ந்தெடுத்து, அவை மந்தையைச் சேர்ந்தவை என்பதையும் காட்டுகிறது.
- source_word: לֹא אָכָלְתִּי
  choice: நான் உண்ணவில்லை
  rationale: முழு இருபது ஆண்டு காலத்திலும் யாக்கோபு அவற்றைத் தனது உணவுக்குப் பயன்படுத்தவில்லை என்ற தொடர்ச்சியான நடத்தையைச் சுருக்கமாகத் தெரிவிக்கிறது.
