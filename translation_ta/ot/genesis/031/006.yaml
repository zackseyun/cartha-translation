  yaml_path: translation/ot/genesis/031/006.yaml
  text: And you yourselves know that I have served your father with all my strength[a].
translation:
  language: ta
  text: மேலும், உங்கள் தந்தைக்காக என் முழு வலிமையோடு நான் பணி செய்தேன்[a] என்பதை நீங்களே அறிவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் தந்தைக்காக வேலை செய்தேன்.” எபிரெய வினைச்சொல்லுக்கு “பணி செய்” என்றும் “வேலை செய்” என்றும் பொருள் வரலாம்; லாபானின் கீழ் யாக்கோபு உழைத்த ஆண்டுகளின் சூழலுக்கு இரண்டுமே பொருந்தும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֵּנָה
  choice: உங்களுக்கே
  rationale: இரண்டாம் நபர் பெண்பால் பன்மைத் தனிப்பெயர் ராகேலையும் லேயாளையும் வலியுறுத்தி அழைக்கிறது. தமிழில் ‘உங்களுக்கே’ என்பது அந்த வலியுறுத்தலை இயல்பாகக் காட்டுகிறது; தொடக்க வாவ் இங்கு உரையோட்டத்தில் தனியே மொழிபெயர்க்கப்பட வேண்டியதில்லை.
- source_word: יְדַעְתֶּן
  choice: தெரியும்
  rationale: Qal perfect இரண்டாம் நபர் பெண்பால் பன்மை வடிவம், முன்பே அறிந்து தற்போது நிலவும் அறிவைக் குறிக்கிறது. நவீன தமிழில் ‘தெரியும்’ இயல்பானது.
- source_word: כִּי
  choice: என்பது
  rationale: அவர்கள் அறிந்திருப்பதன் உள்ளடக்கத்தை அறிமுகப்படுத்துவதால், தமிழில் பெயரெச்சத் தொகுப்பை நிறைவு செய்யும் ‘என்பது’ பொருத்தமானது.
- source_word: בְּ/כָל כֹּחִי
  choice: என் முழுப் பலத்தோடும்
  rationale: כֹּחַ என்பது பலம், ஆற்றல், திறன் ஆகிய பொருள்களைக் கொண்டது. உழைப்பின் சூழலில் ‘முழுப் பலத்தோடும்’ முழுமையான முயற்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עָבַדְתִּי
  choice: பணிசெய்தேன்
  rationale: עבד என்பதற்கு ‘பணிசெய்’ அல்லது ‘வேலைசெய்’ என்று பொருள் வரலாம். ஒருவரை நோக்கிய சேவை உறவையும் செய்த உழைப்பையும் ‘பணிசெய்தேன்’ தக்கவைக்கிறது.
- source_word: אֶת אֲבִיכֶן
  choice: உங்கள் தந்தைக்கு
  rationale: עבד என்ற வினையுடன் எபிரெயத்தில் நேர்செயப்படுபொருள் வந்தாலும், தமிழில் ‘பணிசெய்’ என்பதற்கு ‘தந்தைக்கு’ என்ற நான்காம் வேற்றுமை இயல்பானது. பெண்பால் பன்மை உடைமை வடிவம் சூழலுக்கேற்ப ‘உங்கள்’ என மொழிபெயர்க்கப்படுகிறது.
