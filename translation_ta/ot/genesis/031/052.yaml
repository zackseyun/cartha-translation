base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/052.yaml
  text: This heap is a witness[a], and the pillar is a witness, that I will not pass over this heap toward you[c][b], and that you will not pass over this heap and this pillar toward me for harm.
translation:
  language: ta
  text: '“இந்தக் கற்குவியல் சாட்சி; இந்தக் கல் தூணும் சாட்சி: நான் உன்னை நோக்கி இந்தக் கற்குவியலைக் கடந்து செல்லமாட்டேன்; நீயும் என்னை நோக்கி இந்தக் கற்குவியலையும் இந்தக் கல் தூணையும் கடந்து செல்லமாட்டாய்—தீங்கு விளைவிக்கும் நோக்கத்துடன்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தீங்கு விளைவிக்கும் நோக்கத்துடன்” என்பது தீய அல்லது பகைமையான நோக்கத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: עֵד / וְעֵדָה
  choice: சாட்சி / சாட்சியும்
  rationale: இரண்டு எல்லைக் குறிகளும் உடன்படிக்கைக்குச் சாட்சியாகச் செயல்படுகின்றன என்ற இணை அமைப்பைப் பாதுகாக்கிறது. தமிழில் இயல்பாக இருக்க இரண்டாவது கூறில் ‘இந்தத் தூணும் சாட்சி’ என வழங்கப்பட்டுள்ளது.
- source_word: גַּל
  choice: கற்குவியல்
  rationale: சூழலில் எல்லைக் குறியாகக் குவிக்கப்பட்ட கற்களைக் குறிக்கிறது. வெறும் ‘குவியல்’ என்பதைக் காட்டிலும் பொருளைத் தெளிவாகவும் உடற்காட்சியைப் பாதுகாக்கும் விதமாகவும் உள்ளது.
- source_word: מַצֵּבָה
  choice: தூண்
  rationale: நாட்டப்பட்ட கல் அடையாளத்தைக் குறிக்கும் சுருக்கமான, வழக்கமான தமிழ் சொல்; ‘நினைவுத்தூண்’ என்று மொழிபெயர்த்து அதன் செயல்பாட்டை அளவுக்கு மீறி குறிப்பாக்கவில்லை.
- source_word: אִם ... לֹא
  choice: செல்லமாட்டேன் / செல்லமாட்டாய்
  rationale: இங்கு אִם சாதாரண நிபந்தனையை விட சாட்சி அல்லது உடன்படிக்கைச் சூழலில் உறுதிமொழியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. ஆகவே தமிழில் நேரடியான எதிர்கால மறுப்பு இயல்பாக அமைகிறது.
- source_word: אֶעֱבֹר / תַעֲבֹר
  choice: கடந்து செல்லமாட்டேன் / கடந்து செல்லமாட்டாய்
  rationale: எல்லைக் குறியைக் கடப்பதன் இடவியல் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֵלֶיךָ / אֵלַי
  choice: உன்னை நோக்கி / என்னை நோக்கி
  rationale: மற்ற தரப்பை நோக்கிய திசையை வெளிப்படுத்துகிறது; தானாகவே பகைமைப் பொருளைச் சேர்க்காமல், அந்த நோக்கத்தை இறுதியிலுள்ள לְרָעָה தெரிவிக்க அனுமதிக்கிறது.
- source_word: לְרָעָה
  choice: தீங்கு செய்வதற்காக
  rationale: எல்லையை உடலளவில் ஒருபோதும் கடக்கக் கூடாது என்பதல்ல, தீய அல்லது பகைமையான நோக்கத்துடன் கடக்கக் கூடாது என்பதே கருத்து என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘தீங்கு செய்வதற்காக’ என்பதன் வாக்கியச் செயல்பாடு
  choice: இறுதியில் தனியே வைத்து, இரு தரப்பினரின் கடத்தலுக்கும் பொருந்தும் வகையில் மொழிபெயர்க்கப்பட்டது.
  alternative: அதை இரண்டாவது தரப்பின் கடத்தலுடன் மட்டும் நேரடியாக இணைத்தல்.
  rationale: எபிரெயில் இச்சொற்றொடர் வாக்கியத்தின் இறுதியில் இருந்தாலும், உடன்படிக்கையின் பரஸ்பரத் தன்மையும் இணை வாக்கிய அமைப்பும் தீங்கான நோக்கத்துடன் எல்லை கடப்பதற்கான தடை இருவருக்கும் பொருந்துவதைச் சுட்டுகின்றன. இறுதி நிலை மூலத்தின் அமைப்பையும் அதன் சிறிய இலக்கணத் திறப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘கற்குவியல்’, ‘தூண்’, ‘சாட்சி’ ஆகிய சொற்கள் மூலத்தின் பொருட்காட்சியையும் உடன்படிக்கைச் சூழலையும் எளிதில் புரியுமாறு பாதுகாக்கின்றன. இணை அமைப்பும் இறுதிக் காரணச் சொற்றொடரின் இடமும் இயன்றவரை தக்கவைக்கப்பட்டுள்ளன.
