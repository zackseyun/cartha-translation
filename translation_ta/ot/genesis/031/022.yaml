base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/022.yaml
  text: On the third day[a], Laban was told that Jacob had fled.
translation:
  language: ta
  text: மூன்றாம் நாளில், யாக்கோபு தப்பியோடிவிட்டான் என்று லாபானுக்குத் தெரிவிக்கப்பட்டது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மூன்றாம் நாளில், யாக்கோபு தப்பியோடியது லாபானுக்கு அறிவிக்கப்பட்டது.”
    reason: செயப்பாட்டு அறிக்கை அமைப்பைத் தமிழில் வேறொரு இயல்பான முறையில் வழங்கும் மொழிபெயர்ப்பு மாற்று.
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: தெரிவிக்கப்பட்டது
  rationale: ஹொஃபால் வினைவடிவத்தின் செயப்பாட்டு பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; செய்தியைத் தெரிவித்தவர் யார் என்பதை மூலத்தைப் போலவே குறிப்பிடாமல் விடுகிறது.
- source_word: לְלָבָן
  choice: லாபானுக்கு
  rationale: לְ முன்னிடைச்சொல் செய்தியைப் பெறுபவரைக் குறிக்கிறது; தமிழில் நான்காம் வேற்றுமை உருபு இதைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: மூன்றாம் நாளில்
  rationale: மூலத்தின் காலக் குறிப்பை, அதில் வெளிப்படையாக இல்லாத ‘அதற்குப் பிறகு’ போன்ற சொற்களைச் சேர்க்காமல் தருகிறது.
- source_word: כִּי
  choice: என்று
  rationale: இங்கு כִּי காரணத்தைக் குறிக்காமல் தெரிவிக்கப்பட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் மறைமுகக் கூற்றுக்கு ‘என்று’ இயல்பானது.
- source_word: בָרַח
  choice: தப்பியோடிவிட்டான்
  rationale: ברח என்பதன் ‘தப்பி ஓடுதல்’ என்ற பொருளையும், அறிவிப்பு கிடைப்பதற்கு முன்பே அந்தச் செயல் நிகழ்ந்து முடிந்திருப்பதையும் இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: יַעֲקֹב
  choice: யாக்கோபு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் செய்தியைத் தெரிவித்தவர் குறிப்பிடப்படாததால், தமிழிலும் செயப்பாட்டு அமைப்பு காக்கப்பட்டுள்ளது.
