  language: en
  yaml_path: translation/ot/genesis/031/025.yaml
  text: And Laban caught up with Jacob[a]. Now Jacob had pitched his tent in the hill country[c][b], and Laban pitched with his kinsmen in the hill country of Gilead.
translation:
  language: ta
  text: லாபான் யாக்கோபை வந்தடைந்தான்[a]. யாக்கோபு மலைப்பகுதியில்[c] தன் கூடாரத்தை அமைத்திருந்தான்; லாபானோ தன் உறவினர்களோடு[b] கிலேயாதின் மலைப்பகுதியில் முகாமிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யாக்கோபை எட்டினான்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘தன் சகோதரர்களோடு’; இங்கு இது உறவினர்களையோ குலத்தைச் சேர்ந்தவர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘மலையில்.’ ‘கிலேயாதின் மலைப்பகுதி’ என்பதையும் ‘கிலேயாத் மலையில்’ அல்லது ‘கிலேயாதின் மலைகளில்’ என்று மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשֵּׂג
  choice: எட்டிப்பிடித்தான்
  rationale: נשׂג இங்கு பின்தொடர்ந்து சென்று ஒருவரை எட்டுதல் அல்லது அவரிடம் வந்து சேருதல் என்ற பொருளைக் கொண்டது. ‘எட்டிப்பிடித்தான்’ துரத்திச் சென்ற சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; கைது செய்தான் என்று வெளிப்படையாகச் சொல்லவில்லை.
- source_word: תָּקַע ... אָהֳלוֹ
  choice: தன் கூடாரத்தை அமைத்திருந்தான்
  rationale: תקע என்பதும் אהל என்பதும் சேர்ந்த சொற்றொடர் கூடாரத்தை நாட்டுதல் அல்லது அமைத்தல் என்னும் வழக்குச் சொல்லாகும். லாபான் வந்து எட்டுவதற்கு முன்பே யாக்கோபு அங்கே தங்கியிருந்ததை ‘அமைத்திருந்தான்’ தெளிவாகக் காட்டுகிறது.
- source_word: בָּהָר
  choice: மலைப்பகுதியில்
  rationale: הַר என்பது ஒரு குறிப்பிட்ட மலையையோ பரந்த மலைநாட்டையோ குறிக்கலாம். இச்சூழலில் ‘மலைப்பகுதி’ இயல்பாகவும் புவியியல் தெளிவுடனும் உள்ளது; மூலத்தின் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: תָּקַע אֶת אֶחָיו
  choice: தன் உறவினர்களோடு ... முகாமிட்டான்
  rationale: இது இணை வாக்கியத்தின் அடிப்படையில் ‘தன் சகோதரர்கள்/உறவினர்களுடன் முகாமிட்டான்’ என்று புரிந்துகொள்ளப்படும் சுருக்கமான எபிரெய வெளிப்பாடு. மூலத்தில் வெளிப்படையாக இல்லாத ‘பல கூடாரங்கள்’ என்பதைச் சேர்க்காமல் ‘முகாமிட்டான்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶחָיו
  choice: தன் உறவினர்களோடு
  rationale: אחים என்பதன் நேர்ப்பொருள் ‘சகோதரர்கள்’; ஆனால் எபிரெயத்தில் அது விரிந்த உறவினர் அல்லது குலத்தார் குழுவையும் குறிக்கலாம். லாபானுடன் வந்த குழுவை இங்கு ‘உறவினர்கள்’ இயல்பாகக் குறிக்கிறது.
- source_word: בְּהַר הַגִּלְעָד
  choice: கிலேயாதின் மலைப்பகுதியில்
  rationale: இக்கட்டமைப்பை ‘கிலேயாத் மலையில்’ என்றும் ‘கிலேயாதின் மலைகளில்’ என்றும் மொழிபெயர்க்கலாம். இங்கு ஓர் உயர்நிலப் பிரதேசத்தைச் சுட்டுவதாகக் கொண்டு ‘கிலேயாதின் மலைப்பகுதி’ என வழங்கப்பட்டுள்ளது.
