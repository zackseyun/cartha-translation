base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/051.yaml
  text: Then Laban said to Jacob[a], “Look at this mound[b], and look at the pillar that I have set up between me and you.”
translation:
  language: ta
  text: பின்பு லாபான் யாக்கோபிடம், “இதோ இந்தக் கற்குவியல்[a]; இதோ, எனக்கும் உனக்கும் இடையே நான் நிறுவிய தூண்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தக் குவியல்.” இங்கு வரும் எபிரெயச் சொல், லாபானுக்கும் யாக்கோபுக்கும் இடையே சாட்சியாக எழுப்பப்பட்ட கற்களின் குவியலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “செங்குத்தாக நிறுத்தப்பட்ட கல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. ‘பின்பு’ அதன் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: הִנֵּה ... וְהִנֵּה
  choice: இதோ ...; இதோ ...
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் இருமுறை பயன்பாட்டையும் இணையான வலியுறுத்தலையும் தமிழில் காக்கிறது.
- source_word: הַגַּל הַזֶּה
  choice: இந்தக் கற்குவியல்
  rationale: சுற்றியுள்ள சூழலில் இது சாட்சியாக எழுப்பப்பட்ட கற்களின் குவியலைக் குறிக்கிறது. ‘கற்குவியல்’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַמַּצֵּבָה
  choice: இந்தத் தூண்
  rationale: מַצֵּבָה என்பது செங்குத்தாக நிறுத்தப்பட்ட கல் அல்லது தூணைக் குறிக்கிறது. ‘தூண்’ இயல்பானதும் மரியாதையானதுமான பொதுத் தமிழ்.
- source_word: יָרִיתִי
  choice: நான் நிறுத்திய
  rationale: இந்தச் சூழலில் வினைச்சொல் தூணை நிறுவுதல் அல்லது எழுப்பி நிறுத்துதல் என்ற பொருளைக் கொடுக்கிறது; சொற்படியான ‘எறிந்த’ என்பது தமிழில் தவறாகப் புரிந்துகொள்ளப்படும்.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: எனக்கும் உனக்கும் நடுவில்
  rationale: இரு தரப்புகளுக்கு இடையிலான இடத்தையும் உறவையும் நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
