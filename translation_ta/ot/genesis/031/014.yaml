translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மறுமொழியாக ... என்றார்கள்’ என்பது எபிரெயத்தில் அடுத்தடுத்து வரும் ‘பதிலளித்து, சொன்னார்கள்’ என்ற இரு வினைகளையும் தமிழில் தேவையற்ற மறுபடியும் கூறாமல் பிரதிபலிக்கிறது.
