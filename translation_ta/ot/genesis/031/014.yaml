base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/014.yaml
  text: Then Rachel and Leah answered and said to him[b][a], “Do we still have any share or inheritance in our father’s house?”
translation:
  language: ta
  text: அப்போது ராகேலும் லேயாளும் அவனுக்குப் பதிலளித்து, “எங்கள் தந்தையின் வீட்டில்[b] எங்களுக்கு இன்னும் பங்கும்[a] வாரிசுரிமையும் உண்டா?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பங்கு’ என்பதை ‘பாகம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘எங்கள் தந்தையின் வீடு’ என்பது கட்டிடத்தை மட்டுமல்லாமல், குடும்பத்தையோ குடும்பச் சொத்தையோ பரம்பரைச் சொத்தையோ குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעַן
  choice: அப்போது ... மறுமொழியாக
  rationale: வாவ் தொடர்நிலை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையைத் தருகிறது. ‘மறுமொழியாக’ என்பது முந்தைய பேச்சுக்கான பதில் என்பதை வெளிப்படுத்துகிறது.
- source_word: רָחֵל וְלֵאָה
  choice: ராகேலும் லேயாளும்
  rationale: எபிரெயப் பெயர்கள் தமிழில் நிலைபெற்ற வேதாகமப் பெயர் வடிவங்களுக்கு ஏற்ப ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: וַתֹּאמַרְנָה לוֹ
  choice: அவனுக்கு ... என்றார்கள்
  rationale: பெண்பால் பன்மை வினை இருவரும் பேசியதைச் சுட்டுகிறது; לוֹ யாக்கோபை நோக்கிப் பேசியதைத் தெளிவாக வைத்திருக்கிறது.
- source_word: הַעוֹד
  choice: இன்னும்
  rationale: அவர்களுக்கு ஏதேனும் உரிமை தொடர்ந்து எஞ்சியிருக்கிறதா என்ற காலநிலையை இயல்பாகப் பாதுகாக்கிறது.
- source_word: לָנוּ
  choice: எங்களுக்கு ... இருக்கிறதா
  rationale: ‘எங்களுக்காக உள்ளதா’ என்ற சொற்சொல் அமைப்பைவிட, உடைமை அல்லது உரிமையைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்லாக்கம்.
- source_word: חֵלֶק
  choice: பங்கு
  rationale: குடும்பச் சொத்து மற்றும் பரம்பரை உரிமைச் சூழலில் ஒருவருக்குரிய ஒதுக்கீட்டைத் தெளிவாகக் குறிக்கிறது.
- source_word: וְנַחֲלָה
  choice: அல்லது சுதந்தரம்
  rationale: வாவ் இங்கு தொடர்புடைய இரு உரிமைச் சொற்களை இணைக்கிறது; எதிர்மறை விடையை எதிர்பார்க்கும் தமிழ் வினாவில் ‘பங்கு அல்லது சுதந்தரம்’ என்பது இயல்பாக உள்ளது. ‘சுதந்தரம்’ பரம்பரையாகக் கிடைக்கும் சொத்து அல்லது உரிமையைப் பாதுகாக்கிறது.
- source_word: בְּבֵית אָבִינוּ
  choice: எங்கள் தந்தையின் வீட்டில்
  rationale: மூலத்தின் ‘வீடு’ உருவகத்தைப் பாதுகாக்கும் அதே வேளையில் இயல்பான தமிழாக உள்ளது; இது கட்டிடத்தை மட்டுமல்லாமல் குடும்பத்தையும் குடும்பச் சொத்தையும் குறிக்கக்கூடும்.
