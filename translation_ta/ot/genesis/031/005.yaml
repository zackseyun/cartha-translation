base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/005.yaml
  text: And he said to them[a], “I see that your father's face is not toward me as before, but the God of my father has been with me.”
translation:
  language: ta
  text: அவன் அவர்களிடம், “உங்கள் தந்தையின் முகம் முன்புபோல் என்னை நோக்கி இல்லை என்பதை நான் காண்கிறேன்.[a] ஆனால் என் தந்தையின் கடவுள் என்னுடன் இருந்திருக்கிறார்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “நேற்றும் முந்தின நாளும் இருந்ததுபோல்”; இது “முன்புபோல்” என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶן
  choice: அவன் அவர்களிடம் … என்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியையும், ராகேல் மற்றும் லேயாள் ஆகிய பெண்பால் பன்மை விளிப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רֹאֶה אָנֹכִי
  choice: நான் காண்கிறேன்
  rationale: பங்கேற்பு வினையுடன் தனிப்பட்ட சுட்டுப்பெயர் வருவது யாக்கோபின் தற்போதைய உணர்தலை வலியுறுத்துகிறது; நிகழ்காலம் அதைப் பாதுகாக்கிறது.
- source_word: אֶת פְּנֵי אֲבִיכֶן
  choice: உங்கள் தந்தையின் முகம்
  rationale: ‘முகம்’ என்பது மனநிலை அல்லது அணுகுமுறையைக் குறிக்கும் எபிரெய உருவகத்தைத் தக்கவைக்கிறது; ‘முகபாவம்’ என்று விளக்கி மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
- source_word: כִּי אֵינֶנּוּ אֵלַי
  choice: இப்போது என்னை நோக்கி இல்லை
  rationale: லாபானின் மாறிய அணுகுமுறையைச் சுட்டும் திசைசார் உருவகத்தை ‘என்னை நோக்கி’ என்பது பாதுகாக்கிறது. சூழலில் ஏற்பட்ட மாற்றத்தைத் தெளிவாக்க ‘இப்போது’ சேர்க்கப்பட்டுள்ளது.
- source_word: כִּתְמֹל שִׁלְשֹׁם
  choice: முன்பு இருந்ததுபோல்
  rationale: முந்தைய காலத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் தருகிறது; சொற்சொல்லான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וֵאלֹהֵי אָבִי
  choice: ஆனால் என் தந்தையின் கடவுள்
  rationale: லாபானின் மாறிய அணுகுமுறைக்கும் கடவுளின் தொடர்ந்த துணைக்கும் இடையிலான முரண்பாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது; உறவுசார் எபிரெய அமைப்பு பாதுகாக்கப்படுகிறது.
- source_word: הָיָה עִמָּדִי
  choice: என்னுடன் இருந்திருக்கிறார்
  rationale: கடந்த காலத்திலிருந்து பேசும் தருணம்வரை நீடித்த கடவுளின் துணையைத் தமிழின் நிறைவுநிலை வடிவம் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֱלֹהֵי אָבִי என்ற இறைக் குறிப்பை மொழிபெயர்த்தல்
  choice: என் தந்தையின் கடவுள்
  alternative: என் தந்தைக்குரிய கடவுள்
  rationale: தேர்ந்த வடிவம் எபிரெய உறவுநிலைத் தொடரை நெருக்கமாகப் பாதுகாக்கிறது; உரையில் இல்லாத தனிப்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் dignified கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘முகம் … என்னை நோக்கி இல்லை’ என்ற எபிரெய உருவகம் புரியக்கூடிய வகையில் தக்கவைக்கப்பட்டுள்ளது; மரபுத்தொடரின் இயல்பான பொருள் முதன்மை உரையிலும் அதன் சொற்சொல்லான வடிவம் அடிக்குறிப்பிலும் தரப்பட்டுள்ளது.
