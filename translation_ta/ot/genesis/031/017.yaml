  text: Then Jacob arose and put his sons and his wives on the camels[a].
translation:
  language: ta
  text: பின்பு யாக்கோபு எழுந்து, தன் மகன்களையும் தன் மனைவிகளையும் ஒட்டகங்கள்மேல் ஏற்றினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்பதன் தொடர்கதை வடிவம் அடுத்த செயலைத் தொடங்குவதற்காக எழுவதைச் சுட்டுகிறது; ‘எழுந்து’ என்பது இயல்பாகவும் மூலத்தின் கதைத் தொடர்ச்சியைப் பேணுவதாகவும் உள்ளது.
- source_word: וַיִּשָּׂא
  choice: ஏற்றினான்
  rationale: נשׂא என்பதற்கு அடிப்படையில் ‘தூக்குதல்/சுமத்துதல்’ என்ற பொருள் இருந்தாலும், ஒட்டகங்களைக் குறிக்கும் עַל உடன் இங்கு பிறரை அவற்றின்மேல் ஏற்றிவைத்தல் என்ற சூழற்பொருள் வருகிறது; ‘ஏற்றினான்’ இதை இயல்பான தமிழில் துல்லியமாகத் தருகிறது.
- source_word: בָּנָיו
  choice: தன் மகன்களை
  rationale: ஆண்பால் பன்மையான בנים என்பதைப் பாலினத் துல்லியத்துடன் ‘மகன்கள்’ என்று மொழிபெயர்க்கிறது; தற்சுட்டு உடைமைத் தொடர்பைத் தமிழில் இயல்பாகக் காட்ட ‘தன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: נָשָׁיו
  choice: தன் மனைவிகளை
  rationale: இச்சூழலில் אשה என்பதன் பன்மை யாக்கோபின் மனைவிகளையே குறிக்கிறது; ‘மனைவிகள்’ துல்லியமான நவீனத் தமிழ் வடிவம்.
- source_word: עַל הַגְּמַלִּים
  choice: ஒட்டகங்கள்மேல்
  rationale: இயக்கத்தைக் குறிக்கும் வினையுடன் עַל என்பது ‘மேல்/மேலே’ என்ற இலக்கை உணர்த்துகிறது; தமிழில் ‘ஒட்டகங்கள்மேல் ஏற்றினான்’ இயல்பாக இருப்பதுடன் இயக்கத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
