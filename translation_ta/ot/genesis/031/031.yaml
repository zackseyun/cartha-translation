translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையும் கண்ணியமும் கொண்ட நேரடி உரை. ‘நீர்/உமது’ என்பது லாபானை ஒருமையில் மரியாதையுடன் அழைக்கும் வடிவம். ‘பறித்துக்கொள்வீரோ’ என்பது அச்சத்துடன் எதிர்பார்க்கப்பட்ட சாத்தியத்தை இயல்பாகக் காட்டுகிறது.
