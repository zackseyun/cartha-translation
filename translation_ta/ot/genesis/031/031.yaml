  text: וַ/יַּ֥עַן יַעֲקֹ֖ב וַ/יֹּ֣אמֶר לְ/לָבָ֑ן כִּ֣י יָרֵ֔אתִי כִּ֣י אָמַ֔רְתִּי פֶּן תִּגְזֹ֥ל אֶת בְּנוֹתֶ֖י/ךָ מֵ/עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/031.yaml
  text: Then Jacob answered and said to Laban[a], “Because I was afraid, for I said[b], ‘Lest you take your daughters from me by force.’”
translation:
  language: ta
  text: 'அப்போது யாக்கோபு லாபானுக்குப் பதிலளித்துச் சொன்னான்: “நான் பயந்தேன்; ஏனெனில், ‘நீர் உமது மகள்களை என்னிடமிருந்து வலுக்கட்டாயமாகப் பறித்துக்கொள்வீரோ[a]’ என்று எனக்குள் சொல்லிக்கொண்டேன்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சார்பாக, “உமது மகள்களைக் கொள்ளையிட்டுப் பறித்துக்கொள்வீரோ.” இங்கு வரும் எபிரெய வினை அநியாயமாகவோ வலுக்கட்டாயமாகவோ கைப்பற்றுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொற்சார்பாக, “என்று சொன்னேன்.” இச்சூழலில் அது யாக்கோபின் உள்ளார்ந்த எண்ணத்தைக் குறிக்கலாம்.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: பதிலளித்துச் சொன்னான்
  rationale: எபிரெய மொழியின் இரட்டை உரையாடல் அறிமுகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יָרֵאתִי
  choice: நான் பயந்தேன்
  rationale: யாக்கோபின் அச்சத்தை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אָמַרְתִּי
  choice: எனக்குள் சொல்லிக்கொண்டேன்
  rationale: அடிப்படைப் பொருளான ‘சொன்னேன்’ என்பதையும், இங்கு அது உள்ளார்ந்த எண்ணத்தைக் குறிப்பதையும் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: פֶּן
  choice: பறித்துக்கொள்வீரோ
  rationale: அஞ்சப்பட்ட சாத்தியத்தைத் தமிழின் ஐயவினை வடிவில் இயல்பாகக் காட்டுகிறது.
- source_word: תִּגְזֹל
  choice: வலுக்கட்டாயமாகப் பறித்துக்கொள்வீர்
  rationale: גזל என்ற வினையின் அநியாயமாகவும் வலுக்கட்டாயமாகவும் கைப்பற்றும் வலுவான பொருளைப் பாதுகாக்கிறது.
- source_word: בְּנוֹתֶיךָ מֵעִמִּי
  choice: உமது மகள்களை என்னிடமிருந்து
  rationale: உறவையும் யாக்கோபிடமிருந்து பிரித்துக்கொண்டு போவதையும் நேரடியாகத் தெரிவிக்கிறது.
