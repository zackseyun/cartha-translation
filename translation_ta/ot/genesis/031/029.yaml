base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/029.yaml
  text: It is in my power to do you harm[a], but the God of your father spoke to me last night, saying, ‘Be careful not to speak to Jacob either good or bad.’
translation:
  language: ta
  text: உங்களுக்குத் தீங்கு செய்ய எனக்கு வல்லமை இருக்கிறது. ஆனால் உங்கள் தந்தையின் கடவுள் நேற்றிரவு என்னிடம், ‘யாக்கோபிடம் நல்லதோ கெட்டதோ எதுவும் பேசாதபடி எச்சரிக்கையாக இரு’ என்று சொன்னார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “நல்லதிலிருந்து கெட்டதுவரை.” இது நல்லதோ கெட்டதோ எதையும் பேசுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשׁ לְאֵל יָדִי
  choice: எனக்கு வல்லமை இருக்கிறது
  rationale: எபிரெய மொழிநடை ஒருவருக்குச் செயல் புரியும் ஆற்றல் அல்லது அதிகாரம் இருப்பதைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் கண்ணியமாகவும் இதைத் தெரிவிக்கிறது.
- source_word: לַעֲשׂוֹת עִמָּכֶם רָע
  choice: உங்களுக்குத் தீங்கு செய்ய
  rationale: இங்கு רָע என்பது வெறும் அறநெறித் ‘தீமை’ அல்ல; கேட்போருக்கு இழைக்கப்படக்கூடிய தீங்கைக் குறிக்கிறது.
- source_word: וֵאלֹהֵי אֲבִיכֶם
  choice: ஆனால் உங்கள் தந்தையின் கடவுள்
  rationale: וְ இணைப்பு இச்சூழலில் லாபானின் வல்லமைக்கும் கடவுளின் தடைக்கும் இடையிலான எதிர்மறைத் தொடர்பைக் காட்டுகிறது. வடிவத்தில் பன்மைச் சுட்டுப்பெயர் இருந்தாலும், உரை யாக்கோபை நோக்கியதாகவும் ‘தந்தை’ ஒருமையாகவும் உள்ளது.
- source_word: אֶמֶשׁ
  choice: நேற்றிரவு
  rationale: சூழலில் முந்தைய இரவைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: הִשָּׁמֶר לְךָ
  choice: எச்சரிக்கையாக இரு
  rationale: இந்த நிஃபால் கட்டளை எச்சரிப்பையும் கட்டுப்பாட்டையும் வெளிப்படுத்துகிறது.
- source_word: מִדַּבֵּר עִם יַעֲקֹב
  choice: யாக்கோபிடம் ... பேசாதபடி
  rationale: הִשָּׁמֶר உடன் வரும் מִן அமைப்பு தடைப் பொருளைத் தருகிறது; தமிழில் எதிர்மறை வினையெச்ச அமைப்பு இயல்பாக உள்ளது.
- source_word: מִטּוֹב עַד רָע
  choice: நல்லதோ கெட்டதோ எதுவும்
  rationale: ‘நல்லதிலிருந்து கெட்டதுவரை’ என்ற எபிரெய இருதுருவ மரபுத்தொடர் முழு வரம்பையும், இங்கு எந்தச் சொல்லையும், குறிக்கிறது. ‘நல்லதோ கெட்டதோ’ என்ற உருவகத்தைப் பாதுகாத்து ‘எதுவும்’ பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: லாபானிடம் பேசிய தெய்வத்தைக் குறிக்கும் אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: உங்கள் தந்தையின் கடவுள்
  alternative: உங்கள் பிதாக்களின் கடவுள்
  rationale: உடனடிச் சூழலில் உரை யாக்கோபை நோக்குகிறது; אֲבִיכֶם வடிவம் பன்மைச் சுட்டைக் கொண்டிருந்தாலும் אֲבִי ‘தந்தை’ ஒருமை. ஆகவே தனிப்பட்ட உறவுக் குறிப்பைப் பாதுகாக்கிறது; பிற்கால இறையியல் கருத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘வல்லமை’ லாபான் கூறும் ஆற்றல்/அதிகாரத்தைத் தக்கவைக்கிறது. மூலத்தின் ‘நல்லது—கெட்டது’ என்ற பதற்றமுள்ள இருதுருவச் சொல்லாக்கம் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
