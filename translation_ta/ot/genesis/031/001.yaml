translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் கண்ணியமான கதைநடையிலும் மொழிபெயர்க்கப்பட்டது. மகன்களின் குற்றச்சாட்டுத் தொனி காக்கப்பட்டுள்ளது; ஆனால் ‘பறித்தான்’ போன்ற மூலத்தைவிட வலுவான சொல் தவிர்க்கப்பட்டது. அடிக்குறிப்பு குறி தொடர்புடைய ‘செல்வம்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
