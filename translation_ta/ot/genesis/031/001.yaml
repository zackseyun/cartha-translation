  text: וַ/יִּשְׁמַ֗ע אֶת דִּבְרֵ֤י בְנֵֽי לָבָן֙ לֵ/אמֹ֔ר לָקַ֣ח יַעֲקֹ֔ב אֵ֖ת כָּל אֲשֶׁ֣ר לְ/אָבִ֑י/נוּ וּ/מֵ/אֲשֶׁ֣ר לְ/אָבִ֔י/נוּ עָשָׂ֕ה אֵ֥ת כָּל הַ/כָּבֹ֖ד הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/001.yaml
  text: He heard the words of Laban’s sons[a], saying, “Jacob has taken all that belonged to our father, and from what belonged to our father he has gained all this wealth.”
translation:
  language: ta
  text: 'லாபானின் மகன்கள் சொன்ன வார்த்தைகளை யாக்கோபு கேட்டான்: “எங்கள் தந்தைக்கு உரிய எல்லாவற்றையும் யாக்கோபு எடுத்துக்கொண்டான்; எங்கள் தந்தைக்கு உரியவற்றிலிருந்து இந்தச் செல்வம் அனைத்தையும் அவன் சேர்த்துக்கொண்டான்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த மகிமை அனைத்தையும்.” இதற்கான எபிரெயச் சொல் மதிப்பு, மகிமை, அல்லது செல்வம் என்பவற்றைக் குறிக்கலாம்; இங்கு யாக்கோபின் கண்கூடான பொருளாதார வளத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: யாக்கோபு கேட்டான்
  rationale: வினைச்சொல் கதையைத் தொடர்ந்து நகர்த்துகிறது. எபிரெய உரையில் மறைமுகமாக உள்ள எழுவாய் முந்தைய சூழலிலிருந்து யாக்கோபு எனத் தெளிவாவதால், தமிழில் பெயர் வெளிப்படையாகக் கொடுக்கப்பட்டது.
- source_word: דִּבְרֵי בְנֵי לָבָן לֵאמֹר
  choice: லாபானின் மகன்கள் பேசிக்கொண்டிருந்ததை
  rationale: நேரடியாக ‘லாபானின் மகன்களின் வார்த்தைகளைக் கேட்டான்; அவர்கள் சொன்னதாவது’ என மொழிபெயர்க்கலாம். ஆனால் இயல்பான நவீன தமிழில், கேட்ட உரையைத் தொடர்ந்து நேரடி மேற்கோள் வருவதற்கு இவ்வமைப்பு தெளிவாகவும் சரளமாகவும் உள்ளது.
- source_word: לָקַח
  choice: எடுத்துக்கொண்டான்
  rationale: அடிப்படைப் பொருளான ‘எடுத்தான்’ என்பதையும், மகன்களின் குற்றச்சாட்டுத் தொனியையும் மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது; ‘பறித்துக்கொண்டான்’ என்பது மூலச்சொல்லைவிட வலுவானதாக இருக்கும்.
- source_word: כָּל אֲשֶׁר לְאָבִינוּ
  choice: எங்கள் தந்தைக்கு உரிய எல்லாவற்றையும்
  rationale: לְ உடைமை உறவைக் குறிக்கிறது. ‘உரிய’ என்பது இயல்பான தமிழில் அந்த உடைமைப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: וּמֵאֲשֶׁר לְאָבִינוּ
  choice: எங்கள் தந்தைக்கு உரியவற்றிலிருந்தே
  rationale: מִן மூலத்தையோ ஆதாரத்தையோ குறிக்கிறது. எபிரெயத்தின் மீளுரைத்த வலியுறுத்தலைத் தக்கவைத்து, ‘-ஏ’ மகன்களின் குற்றச்சாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עָשָׂה
  choice: சேர்த்துக்கொண்டான்
  rationale: சொற்பொருளாக ‘செய்தான்’ என்றாலும், செல்வத்தைப் பொருளாகக் கொண்ட இச்சூழலில் ‘சேர்த்துக்கொண்டான்’ என்பது பொருளாதார வளத்தைப் பெற்றுக்கொண்டதைக் காட்டும் இயல்பான தமிழ்.
- source_word: כָּל הַכָּבֹד הַזֶּה
  choice: இந்தச் செல்வம் முழுவதையும்
  rationale: כָּבוֹד என்பதற்கு ‘மகிமை, கனம், செல்வம்’ ஆகிய பொருள்கள் உண்டு. இங்கு யாக்கோபின் கண்கூடான பொருளாதார வளமே சூழலுக்குப் பொருந்துகிறது; வேறு சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
