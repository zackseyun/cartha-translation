base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/013.yaml
  text: I am the God of Bethel[a], where you anointed a pillar and where you vowed a vow to me. Now arise, go out from this land[b], and return to the land of your birth.
translation:
  language: ta
  text: “நான் பெத்தேலின் கடவுள்[a]. அங்கே நீ ஒரு தூணுக்கு எண்ணெய் பூசினாய்; அங்கே எனக்கு ஓர் உறுதிமொழி அளித்தாய். இப்போது எழுந்து, இந்த நாட்டைவிட்டுப் புறப்பட்டு, நீ பிறந்த நாட்டிற்குத் திரும்பிப் போ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெத்தேல்’ என்பதற்கு ‘கடவுளின் வீடு’ என்று பொருள்; இங்கு அது ஓர் இடப்பெயர்.
    reason: cultural_note
  - marker: b
    text: ‘நீ பிறந்த நாடு’ என்பதை ‘உன் பூர்வீகத்தார் வாழும் நாடு’ அல்லது ‘உன் உறவினரின் நாடு’ என்றும் பொருள்கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל בֵּית אֵל
  choice: பெத்தேலின் கடவுள்
  rationale: குறிப்பிட்ட ஒரே கடவுளைச் சுட்டும் எபிரெயக் கட்டமைப்பையும், ‘பெத்தேல்’ என்பது இடப்பெயர் என்பதையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: מָשַׁחְתָּ שָּׁם מַצֵּבָה
  choice: அங்கே நீ ஒரு தூணுக்கு எண்ணெய் பூசினாய்
  rationale: מָשַׁח என்பதன் அபிஷேகச் செயலை சாதாரண வாசகருக்குப் புரியும் உறுதியான செயலாகக் காட்டுகிறது; மַצֵּבָה என்பதை கூடுதல் வழிபாட்டு நுணுக்கம் சேர்க்காமல் ‘தூண்’ என வழங்குகிறது.
- source_word: נָדַרְתָּ לִּי שָׁם נֶדֶר
  choice: அங்கே எனக்கு ஓர் உறுதிமொழி அளித்தாய்
  rationale: ஒரே வேரிலிருந்து வந்த வினை–பெயர்ச்சொல் இணைப்பு வலியுறுத்தலைத் தருகிறது; தமிழில் இயல்பற்ற சொல் மீளுரைப்பைத் தவிர்த்து, கடவுளிடம் செய்த வாக்குறுதியைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: קוּם צֵא מִן הָאָרֶץ הַזֹּאת
  choice: எழுந்து, இந்த நாட்டைவிட்டுப் புறப்பட்டு
  rationale: தொடர்ச்சியான கட்டளைகளின் இயக்கத்தையும், அֶרֶץ இங்கு யாக்கோபு தங்கியிருந்த நிலப்பகுதி/நாட்டைக் குறிக்கிறது என்பதையும் இயல்பான தமிழில் தருகிறது.
- source_word: וְשׁוּב אֶל אֶרֶץ מוֹלַדְתֶּךָ
  choice: நீ பிறந்த நாட்டிற்குத் திரும்பிப் போ
  rationale: முந்தைய இடத்திற்குச் செல்லும் שׁוּב என்பதையும், பிறப்பு அல்லது பூர்வீகத் தொடர்பைக் குறிக்கும் מוֹלֶדֶת என்பதையும் தெளிவாகக் கொண்டுவருகிறது; சொல்லின் உறவினர் சார்ந்த சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: பேசுகிறவர் தம்மை ‘பெத்தேலின் கடவுள்’ என்று அடையாளப்படுத்துதல்
  choice: நான் பெத்தேலின் கடவுள்
  alternative: நான் பெத்தேலில் உனக்குத் தோன்றிய கடவுள்
  rationale: மூலத்தின் சுருக்கமான அடையாளப்படுத்தலைப் பாதுகாக்கிறது. பெத்தேலுக்குள் மட்டுப்பட்ட ஒரு தெய்வம் என்ற எண்ணத்தையோ, மூலத்தில் வெளிப்படையாக இல்லாத ‘தோன்றிய’ என்ற விளக்கத்தையோ உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிமையும் இணைந்த நடையில் மொழிபெயர்க்கப்பட்டது. ‘அபிஷேகம்’, ‘பொருத்தனை’ போன்ற எல்லா வாசகர்களுக்கும் உடனடியாகத் தெளிவாக இருக்காத சமயச் சொற்களுக்குப் பதிலாக இயல்பான தமிழ்ச் சொற்றொடர்கள் பயன்படுத்தப்பட்டன.
