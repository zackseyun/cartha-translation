  text: אִם תְּעַנֶּ֣ה אֶת בְּנֹתַ֗/י וְ/אִם תִּקַּ֤ח נָשִׁים֙ עַל בְּנֹתַ֔/י אֵ֥ין אִ֖ישׁ עִמָּ֑/נוּ רְאֵ֕ה אֱלֹהִ֥ים עֵ֖ד בֵּינִ֥/י וּ/בֵינֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/050.yaml
  text: If you mistreat my daughters[a], or if you take wives besides my daughters—though no man is with us—see, God is witness between me and you.
translation:
  language: ta
  text: நீ என் மகள்களைத் துன்புறுத்தினால் அல்லது என் மகள்களோடு வேறு பெண்களையும் மனைவிகளாக ஏற்றுக்கொண்டால்—நம்முடன் எந்த மனிதரும் இல்லை[a]; பார், எனக்கும் உனக்கும் இடையே கடவுளே சாட்சி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, இதற்கு மனிதச் சாட்சி யாரும் இல்லை; அல்லது, ‘நம்முடன் எந்த ஆணும் இல்லை.’
    reason: אִישׁ என்பது வடிவில் ‘ஆண்’ என்றும், இச்சூழலில் பொதுவாக ‘மனிதர்’ என்றும் பொருள்படலாம்; இக்கூற்று மனிதச் சாட்சி இல்லாததைக் குறிக்கிறது.
lexical_decisions:
- source_word: תְּעַנֶּה
  choice: துன்புறுத்தினால்
  rationale: பியேல் வினை இங்கு திருமண உறவில் லாபானின் மகள்களை மோசமாக நடத்தி அவர்களுக்குத் துன்பம் விளைவிப்பதைக் குறிக்கிறது. ‘துன்புறுத்து’ என்பது பொருளை இயல்பாகவும் போதிய அகலத்துடனும் தருகிறது.
- source_word: בְּנֹתַי
  choice: என் மகள்களை / என் மகள்களோடு
  rationale: மூலத்தின் முதலாம் நபர் உடைமைப் பன்மையைத் தெளிவாகத் தருகிறது; வசனத்தில் வரும் இரு இடங்களிலும் மீளுரைத்தல் காக்கப்பட்டுள்ளது.
- source_word: תִּקַּח נָשִׁים עַל בְּנֹתַי
  choice: என் மகள்களோடு வேறு பெண்களையும் மனைவிகளாக ஏற்றுக்கொண்டால்
  rationale: ‘என் மகள்களின்மேல் பெண்களை எடுத்தல்’ என்ற எபிரேய மரபுத்தொடர், அவர்களை நீக்கிவிட்டு வேறு பெண்களை மணப்பதை அல்ல, அவர்களுடன் கூடுதலாக மனைவிகளை ஏற்றுக்கொள்வதைக் குறிக்கிறது. தமிழில் இதை வெளிப்படையாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: אֵין אִישׁ עִמָּנוּ
  choice: நம்முடன் மனிதர் யாரும் இல்லை
  rationale: אִישׁ என்பதன் மனிதச் சாட்சி சார்ந்த பொதுப் பொருளை ‘மனிதர்’ காக்கிறது. உடன்படிக்கை எச்சரிக்கையை நேரில் கேட்கும் மனிதச் சாட்சி இல்லாததை இக்கூற்று சுட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத சலுகை இணைப்பை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: רְאֵה
  choice: பார்
  rationale: கவனத்தை ஈர்க்கும் நேரடி ஒருமை ஏவலைச் சுருக்கமாகக் காக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: உடன்படிக்கைச் சூழலில் சாட்சியாக அழைக்கப்படும் ஒரே இறைவனைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: עֵד
  choice: சாட்சி
  rationale: உடன்படிக்கை மொழிநடையில் வரும் பயனிலைப் பெயர்ச்சொல்லை இயல்பாகத் தருகிறது.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: எனக்கும் உனக்கும் இடையே
  rationale: இரு உடன்படிக்கைத் தரப்புகளுக்கிடையிலான பொறுப்புறுதியைச் சுட்டும் உறவுச் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: אִישׁ என்பதைப் பொதுவான மனிதப் பொருளில் மொழிபெயர்த்தல்
  choice: நம்முடன் மனிதர் யாரும் இல்லை
  alternative: நம்முடன் எந்த ஆணும் இல்லை
  rationale: இச்சூழலில் கருத்து ஆண் பாலினத்தவரின் இல்லாமை மட்டும் அல்ல, மனிதச் சாட்சி எவரும் இல்லாமையே. ‘மனிதர்’ என்பது மூலச்சொல்லின் மனிதச் சார்பையும் கடவுளுக்கு எதிராக நிறுத்தப்படும் மனிதச் சாட்சியின் கருத்தையும் காக்கிறது.
- issue: אֵין אִישׁ עִמָּנוּ என்ற கூற்றின் தொடர்பு
  choice: தனி அறிவிப்பாகக் காக்கப்பட்டது
  alternative: நம்முடன் மனிதர் யாரும் இல்லாவிட்டாலும்
  rationale: சூழலில் சலுகைப் பொருள் இயல்பாக இருக்கலாம்; ஆனால் எபிரேயத்தில் ‘இருந்தாலும்’ என்பதற்கான வெளிப்படையான இணைப்புச் சொல் இல்லை. எனவே முதன்மை உரை மூலத்தின் கட்டமைப்பையும் அதன் சிறிய தொடர்பியல் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் உடன்படிக்கை எச்சரிக்கையின் கண்ணியமான, நேரடியான தொனியுடனும் மொழிபெயர்க்கப்பட்டது. நீளமான முதல் நிபந்தனைத் தொடருக்குப் பின் இடைக்கோடு பயன்படுத்தி, மனிதச் சாட்சி இல்லாமையிலிருந்து கடவுளைச் சாட்சியாக அழைக்கும் உச்சத்தைத் தெளிவாக்குகிறது.
