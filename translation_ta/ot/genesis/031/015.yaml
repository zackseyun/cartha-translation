  text: அவர் எங்களை அந்நியர்களாகவே கருதவில்லையா? ஏனெனில், அவர் எங்களை விற்று, எங்கள் பணத்தையும்கூட முற்றிலும் செலவழித்துவிட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்கள் வெள்ளியையும்கூட முற்றிலும் தின்றுவிட்டார்.” முழுமையாகச் செலவழித்துவிட்டதை வலியுறுத்த, எபிரெய மொழி ‘தின்பது’ என்ற உருவகத்துடன் வலியுறுத்தும் வினை அமைப்பைப் பயன்படுத்துகிறது.
