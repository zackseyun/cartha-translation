base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/008.yaml
  text: If he said this, ‘The speckled will be your wages,’ then all the flock bore speckled young; and if he said this, ‘The streaked will be your wages,’ then all the flock bore streaked young.
translation:
  language: ta
  text: “புள்ளியுள்ளவை உன் கூலியாக இருக்கும்” என்று அவன் இவ்வாறு சொன்னால், மந்தை முழுவதும் புள்ளியுள்ள குட்டிகளை ஈன்றது; “வரிகளுள்ளவை உன் கூலியாக இருக்கும்” என்று அவன் இவ்வாறு சொன்னால், மந்தை முழுவதும் வரிகளுள்ள குட்டிகளை ஈன்றது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְקֻדִּים
  choice: புள்ளிகளுள்ளவை
  rationale: உடலில் தனித்தனிப் புள்ளிகள் காணப்படும் ஆடுமாடுகளைக் குறிக்கும் எபிரெயச் சொல்லை இயல்பான நவீனத் தமிழில் துல்லியமாகத் தருகிறது.
- source_word: עֲקֻדִּים
  choice: வரிகளுள்ளவை
  rationale: உடலில் பட்டை அல்லது வரிபோன்ற அடையாளங்கள் உள்ள கால்நடைகளைக் குறிக்கிறது; நְקֻדִּים என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: שְׂכָרֶךָ
  choice: உன் கூலி
  rationale: யாக்கோபின் உழைப்புக்குக் கிடைக்க வேண்டிய ஊதியம் அல்லது பங்கைக் குறிக்கும் சொல்லின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: וְיָלְדוּ כָל־הַצֹּאן
  choice: மந்தை முழுவதும் … குட்டிகளை ஈன்றது
  rationale: எபிரெயத்தில் ‘மந்தை முழுவதும் … ஈன்றது’ என வரும் கருத்தைத் தமிழில் தேவையான ‘குட்டிகளை’ வெளிப்படையாகச் சேர்த்து இயல்பாக்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. இரு நிபந்தனை வாக்கியங்களின் இணை அமைப்பு காக்கப்பட்டுள்ளது; எபிரெய כֹּה என்பதற்கான தேவையற்ற ‘இவ்வாறு’ என்ற சொல்லாக்கம் தமிழில் தவிர்க்கப்பட்டு, நேரடி மேற்கோள் இயல்பாக வழங்கப்பட்டுள்ளது.
