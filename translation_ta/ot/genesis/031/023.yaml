base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/023.yaml
  text: And he took his kinsmen with him[a], and pursued him for a journey of seven days[d][c][b], and caught up with him in the hill country of Gilead.
translation:
  language: ta
  text: அவன் தன் உறவினர்களைத்[a] தன்னுடன் கூட்டிக்கொண்டு, ஏழு நாள் பயணத் தொலைவு அவனைத் துரத்திச் சென்றான்[d]. கிலேயாதின் மலைப்பகுதியில்[c] அவனை எட்டினான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் சகோதரர்களை.” எபிரெயச் சொல் உடன்பிறந்த சகோதரர்களையோ, விரிந்த பொருளில் உறவினர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனை முந்திப் பிடித்தான்” அல்லது “அவனிடம் வந்து சேர்ந்தான்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “கிலேயாத் மலையில்.” எபிரெயச் சொற்றொடர் ஒரு குறிப்பிட்ட மலையையோ கிலேயாதின் மலைப்பகுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: சொல்லர்த்தமாக, “அவனுக்குப் பின்னால் துரத்திச் சென்றான்.”
    reason: source_form
lexical_decisions:
- source_word: אֶחָיו
  choice: தன் உறவினர்களை
  rationale: אָח என்பதன் அடிப்படைப் பொருள் ‘சகோதரன்’ என்றாலும், இச்சூழலில் லாபானுடன் சென்ற பரந்த குடும்ப அல்லது குல உறவினர்களைக் குறிக்கலாம். ‘உறவினர்கள்’ என்பது அந்த விரிந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: அவனைத் துரத்திச் சென்றான்
  rationale: רדף என்பது ‘துரத்து/பின்தொடர்’ என்றும், אחר என்பது ‘பின்னால்’ என்றும் பொருள்படும். நவீனத் தமிழில் ‘துரத்திச் சென்றான்’ என்பது தொடர்ச்சியான பின்தொடர்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  choice: ஏழு நாள் பயணத் தொலைவுக்கு
  rationale: דֶּרֶךְ இங்கு பாதை அல்லது பயணம் என்ற அடிப்படையிலிருந்து பயணத்தின் அளவைக் குறிக்கிறது. வெறுமனே ‘ஏழு நாட்கள்’ என்பதைக் காட்டிலும் ‘ஏழு நாள் பயணத் தொலைவுக்கு’ என்பது தூரம்/பயண அளவின் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: וַיַּדְבֵּק אֹתוֹ
  choice: அவனை எட்டினான்
  rationale: דבק இச்சூழலில் துரத்திச் சென்று ஒருவரை எட்டுதல் அல்லது அவரிடம் வந்து சேருதல் என்ற பொருளைக் கொண்டது; ‘எட்டினான்’ என்பது உடலால் பற்றிக்கொண்டான் என்ற தேவையற்ற பொருளைச் சேர்க்காமல் இதைத் தெளிவாகச் சொல்கிறது.
- source_word: בְּהַר הַגִּלְעָד
  choice: கிலேயாதின் மலைப்பகுதியில்
  rationale: הַר என்பது தனி மலை, மலைகள், அல்லது மலைப்பகுதி ஆகியவற்றைக் குறிக்கக்கூடும். இங்கு பிராந்தியப் பொருள் சாத்தியமானதால் ‘மலைப்பகுதி’ என வழங்கப்பட்டு, தனி மலையைக் குறிக்கும் வாய்ப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
