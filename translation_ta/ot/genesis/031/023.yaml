translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் தொடர்ச்சியான செயல்கள் தமிழில் இயல்பாக இரு வாக்கியங்களாக அமைக்கப்பட்டுள்ளன; கால அளவைக் காட்டிலும் பயணத் தொலைவின் நுணுக்கம் பாதுகாக்கப்பட்டது.
