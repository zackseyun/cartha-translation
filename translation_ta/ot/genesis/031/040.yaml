base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/040.yaml
  text: By day the heat consumed me[a], and the frost by night, and my sleep fled from my eyes.
translation:
  language: ta
  text: 'நான் இப்படித்தான் இருந்தேன்: பகலில் வெப்பம் என்னை வாட்டியது; இரவில் உறைபனியும் என்னை வாட்டியது; என் கண்களிலிருந்து தூக்கம் அகன்றது.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָיִיתִי
  choice: '[வாக்கிய அமைப்பில் உட்பொருளாக உள்ளது]'
  rationale: எபிரெயச் சொல் நேரடியாக ‘நான் இருந்தேன்’ எனத் தொடங்குகிறது. தமிழில் அப்படியே வைத்தால் இயல்பற்ற வாக்கியமாகும்; பகல் மற்றும் இரவில் யாக்கோபு அனுபவித்த நிலையை விவரிக்கும் முழு வாக்கிய அமைப்பில் அதன் பொருள் வெளிப்படுகிறது.
- source_word: בַיּוֹם
  choice: பகலில்
  rationale: பகல் நேரத்தைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ்ச் சொல்; ‘இரவில்’ என்பதுடன் உள்ள இணை அமைப்பையும் காக்கிறது.
- source_word: אֲכָלַנִי
  choice: என்னைத் தின்றது
  rationale: אכל என்பதன் ‘தின்றது’ என்ற உயிரோட்டமான உருவகத்தைத் தமிழிலும் காக்கிறது; கடுமையான சூழ்நிலை தன்னை முழுமையாக வாட்டியதை இது உணர்த்துகிறது.
- source_word: חֹרֶב
  choice: வெப்பம்
  rationale: இரவு உறைபனிக்கு எதிராக நிறுத்தப்பட்டுள்ளதால், இங்கு வறட்சியைவிட பகலின் கடும் வெப்பமே சூழலுக்குப் பொருத்தமான பொருள்.
- source_word: וְקֶרַח
  choice: உறைபனி
  rationale: இச்சொல் பனி அல்லது உறைந்த குளிரைக் குறிக்கிறது. இரவுநேரக் கடுங்குளிரைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்க ‘உறைபனி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בַּלָּיְלָה
  choice: இரவில்
  rationale: ‘பகலில்’ என்பதற்குரிய நேரடி இணையாக இருந்து எபிரெய இணை அமைப்பைக் காக்கிறது.
- source_word: וַתִּדַּד
  choice: பறந்துபோனது
  rationale: விலகிச் செல்லுதல் அல்லது தப்பியோடுதல் என்ற அரிய வினையின் உயிர்ப்பூட்டப்பட்ட படிமத்தை, தூக்கத்துடன் இயல்பாக இணையும் தமிழில் தருகிறது.
- source_word: שְׁנָתִי
  choice: என் தூக்கம்
  rationale: ஒரு குறிப்பிட்ட இரவின் ஓய்வை மட்டுமல்லாமல் தூக்க நிலையையே குறிக்கிறது; ‘என் தூக்கம்’ எளிமையான நவீன தமிழ்.
- source_word: מֵעֵינָי
  choice: என் கண்களிலிருந்து
  rationale: தூக்கமின்மையைக் குறிக்கும் எபிரெயப் படிமத்தை மாற்றாமல் காக்கிறது; தமிழிலும் தெளிவாகப் புரிகிறது.
