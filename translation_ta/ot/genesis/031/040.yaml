translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘என்னைத் தின்றது’ மற்றும் ‘தூக்கம் பறந்துபோனது’ என்பவற்றால் மூலத்தின் வலுவான உருவகங்கள் காக்கப்பட்டுள்ளன; இரண்டாம் உட்பிரிவின் விடுபட்ட வினை ‘அப்படியே’ என்பதால் இயல்பாக உணர்த்தப்பட்டுள்ளது.
