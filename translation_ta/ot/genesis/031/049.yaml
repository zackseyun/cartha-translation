reference: Genesis 31:49
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הַ/מִּצְפָּה֙ אֲשֶׁ֣ר אָמַ֔ר יִ֥צֶף יְהוָ֖ה בֵּינִ֣/י וּ/בֵינֶ֑/ךָ כִּ֥י נִסָּתֵ֖ר אִ֥ישׁ מֵ/רֵעֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/049.yaml
  text: And Mizpah[a], because he said[b], “May Yahweh watch between me and you when we are hidden from each other.”
translation:
  language: ta
  text: மேலும், மிஸ்பா; ஏனெனில் அவன், “நாம் ஒருவரின் பார்வையிலிருந்து ஒருவர் மறைந்திருக்கும்போது, யாவே எனக்கும் உனக்கும் இடையே கவனித்துப் பார்ப்பாராக” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַמִּצְפָּה
  choice: அது மிஸ்பா என்றும் அழைக்கப்பட்டது
  rationale: מִצְפָּה இங்கு இடப்பெயராகப் பயன்படுகிறது. தமிழில் தனித்து நிற்கும் வசனம் இயல்பாகவும் தெளிவாகவும் அமைய, சூழலில் உள்ள பெயரிடும் கருத்து வெளிப்படையாகச் சொல்லப்பட்டுள்ளது; எபிரெயத்தில் உள்ள ‘கண்காணித்தல்/காவற்கோபுரம்’ என்ற சொல்விளையாட்டு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר אָמַר
  choice: ஏனெனில் அவன் ... என்றான்
  rationale: பெயருக்கான காரணத்தை அறிமுகப்படுத்தும் தொடராக எடுத்துக்கொள்ளப்பட்டுள்ளது. ‘அவன் அதற்கு இப்பெயரிட்டான்’ போன்ற கூடுதல் கருத்து மேற்கோள் அறிமுகத்தில் சேர்க்கப்படவில்லை.
- source_word: יִצֶף
  choice: கண்காணிப்பாராக
  rationale: צפה என்பதன் ‘கவனித்துப் பார்த்தல், கண்காணித்தல்’ என்ற பொருளையும், வேண்டுதல் அல்லது விருப்பத்தைக் குறிக்கும் வினைவடிவின் நுணுக்கத்தையும் இது தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: எனக்கும் உனக்கும் இடையே
  rationale: மூலத்தின் நபர் வரிசையையும் ‘இடையே’ என்ற உறவையும் இயல்பான தமிழில் காக்கிறது.
- source_word: כִּי נִסָּתֵר אִישׁ מֵרֵעֵהוּ
  choice: நாம் ஒருவருக்கொருவர் மறைவாக இருக்கும்போது
  rationale: כִּי இங்கு நிகழும் சூழலைக் குறிக்கும் ‘போது’ எனவும், நிஃபால் வடிவமான נִסָּתֵר-ஐ ‘மறைவாக இருக்கிறோம்’ எனவும், אִישׁ מֵרֵעֵהוּ-ஐ பரஸ்பரப் பொருளில் ‘ஒருவருக்கொருவர்’ எனவும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் ஒரு பொதுப் பட்டம் அல்ல, இறைவனின் தனிப்பட்ட திருப்பெயர் நேரடியாக உள்ளது. ஆகவே பட்டமாக மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தனித்து வழங்கப்பட்ட வசனத்தின் பெயரிடும் கருத்தைத் தெளிவாக்க ‘அது ... என்றும் அழைக்கப்பட்டது’ எனச் சூழலிலிருந்து நிறைவு செய்யப்பட்டுள்ளது; மறைந்திருத்தல் என்ற மூல உருவகம் முதன்மை உரையில் காக்கப்பட்டுள்ளது.
