    rationale: לָנוּ הוּא וּלְבָנֵינוּ states that the wealth is for/belongs to ‘us and our children’; it does not specifically emphasize the children with an equivalent of Tamil -மே. “நமக்கும் நம் பிள்ளைகளுக்கும்” preserves the coordination without adding emphasis.
