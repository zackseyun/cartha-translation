base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/016.yaml
  text: For all the wealth that God has taken from our father belongs to us and to our children. So now[a], whatever God has said to you, do.
translation:
  language: ta
  text: ஏனெனில், நம் தந்தையிடமிருந்து தேவன் எடுத்த செல்வமெல்லாம்[a] நமக்கும் நம் பிள்ளைகளுக்கும் உரியது. ஆகவே இப்போது, தேவன் உங்களிடம் சொன்ன அனைத்தையும் செய்யுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மீட்ட செல்வமெல்லாம்’ அல்லது ‘விடுவித்த செல்வமெல்லாம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை பெரும்பாலும் மீட்பது அல்லது விடுவிப்பது என்ற பொருளைக் கொண்டது; இங்கு லாபானிடமிருந்து செல்வத்தை அகற்றி யாக்கோபின் குடும்பத்துக்குக் கொடுத்த தேவனுடைய செயலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனங்களில் ராகேலும் லேயாளும் தெரிவித்த ஒப்புதலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: כָל הָעֹשֶׁר
  choice: செல்வமெல்லாம்
  rationale: עֹשֶׁר என்பது செல்வம் அல்லது வளத்தைக் குறிக்கிறது; கால்நடைகள் உட்பட பொருளாதார உடைமைகளை உள்ளடக்கும் இயல்பான தமிழ்ச் சொற்றொடர் இது.
- source_word: הִצִּיל
  choice: எடுத்த
  rationale: இந்த வினை பொதுவாக மீட்பதை அல்லது விடுவிப்பதைச் சுட்டலாம்; இச்சூழலில் லாபானிடமிருந்து செல்வம் அகற்றப்பட்டு யாக்கோபின் குடும்பத்துக்கு வந்ததைக் குறிக்க இயல்பான, நடுநிலையான சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: இக்கதையில் உண்மையான கடவுளைக் குறிக்கும் אֱלֹהִים என்பதற்கான மரியாதையான வழக்குத் தமிழ் வடிவம்.
- source_word: מֵאָבִינוּ
  choice: நம் தந்தையிடமிருந்து
  rationale: מן என்னும் முன்னிடைச்சொல் செல்வம் அகற்றப்பட்ட மூலத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: לָנוּ הוּא וּלְבָנֵינוּ
  choice: நமக்கும் நம் பிள்ளைகளுக்குமே உரியது
  rationale: எபிரெய உரையின் உடைமை அல்லது உரிமை உணர்வைத் தெளிவான தமிழில் வெளிப்படுத்துகிறது; ‘-மே’ வலியுறுத்தலை இயல்பாக அளிக்கிறது.
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: காரண விளக்கத்திலிருந்து அதன் அடிப்படையிலான அறிவுறுத்தலுக்கு மாறும் தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: כֹּל אֲשֶׁר אָמַר אֱלֹהִים אֵלֶיךָ
  choice: தேவன் உங்களிடம் சொன்ன அனைத்தையும்
  rationale: כֹּל אֲשֶׁר என்பதன் முழுமை உணர்வை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: עֲשֵׂה
  choice: செய்யுங்கள்
  rationale: யாக்கோபை நோக்கிய ஒருமை ஆண்பால் கட்டளையை, தமிழின் மரியாதை ஒருமையில் சுருக்கமாக வழங்குகிறது.
theological_decisions:
- issue: லாபானின் செல்வம் தொடர்பான தேவனுடைய செயல்
  choice: ‘எடுத்த’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘மீட்டார்’ அல்லது ‘விடுவித்தார்’
  rationale: மூல வினை மீட்பு அல்லது விடுதலை என்ற பொருளையும் கொண்டிருக்கிறது. ஆனால் இங்கு செல்வம் லாபானிடமிருந்து அகற்றப்பட்டு யாக்கோபின் குடும்பத்துக்குரியதாக வந்ததே முன்னிலைப்படுகிறது. ‘எடுத்த’ என்பது தேவனுடைய செயலை திருட்டாகவோ, செல்வமே ஆபத்திலிருந்து மீட்கப்பட்டதாகவோ கூடுதலாக விளக்காமல் சூழலுக்குரிய மாற்றத்தைச் சொல்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், குடும்ப உரையாடலுக்கேற்ற இயல்பும் வேதாகம உரைக்கேற்ற கண்ணியமும் பேணப்பட்டுள்ளன. யாக்கோபை நோக்கிய வினையில் மரியாதை ஒருமையான ‘உங்களிடம்’, ‘செய்யுங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
