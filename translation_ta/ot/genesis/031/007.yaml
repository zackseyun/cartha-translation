  text: וַ/אֲבִי/כֶן֙ הֵ֣תֶל בִּ֔/י וְ/הֶחֱלִ֥ף אֶת מַשְׂכֻּרְתִּ֖/י עֲשֶׂ֣רֶת מֹנִ֑ים וְ/לֹֽא נְתָנ֣/וֹ אֱלֹהִ֔ים לְ/הָרַ֖ע עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/007.yaml
  text: Yet your father has deceived me and changed my wages ten times[c][b][a], but God did not allow him to harm me.
translation:
  language: ta
  text: உங்கள் தந்தை என்னை ஏமாற்றினார்; என் கூலியைப் பத்து முறை[a] மாற்றினார். ஆனால், அவர் எனக்குத் தீங்கு செய்யக் கடவுள் அனுமதிக்கவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பத்து முறை” என்பது மீண்டும் மீண்டும் நிகழ்ந்ததைக் குறிக்கும் மரபுத்தொடராகவும் இருக்கலாம்; இது துல்லியமான எண்ணிக்கையாக இருக்க வேண்டியதில்லை.
    reason: cultural_note
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “கடவுள் அவருக்கு [எனக்குத் தீங்கு செய்ய] கொடுக்கவில்லை”; அதாவது, எனக்குத் தீங்கு செய்ய கடவுள் அவரை அனுமதிக்கவில்லை.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתֶל
  choice: ஏமாற்றி
  rationale: இச்சூழலில் இந்த வினை ஏமாற்றும் அல்லது இகழ்ச்சியாக நடத்தும் செயலைக் குறிக்கலாம். கூலியைத் தொடர்ந்து மாற்றிய நேர்மையற்ற நடத்தையைத் தெளிவாகச் சொல்ல ‘ஏமாற்றி’ இயல்பான தேர்வு.
- source_word: וְהֶחֱלִף
  choice: மாற்றினார்
  rationale: ஒப்புக்கொள்ளப்பட்ட கூலியை மீண்டும் மீண்டும் மாற்றியதைக் குறிக்கிறது; நவீன தமிழில் ‘மாற்றினார்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: מַשְׂכֻּרְתִּי
  choice: என் கூலியை
  rationale: உழைப்புக்குக் கிடைக்கும் ஊதியத்தைக் குறிக்கும் பெயர்ச்சொல்லுக்கு ‘கூலி’ இச்சூழலில் நேரடியான, பொதுவாகப் புரியும் தமிழ்.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: பத்து முறை
  rationale: எபிரெய உரையின் வடிவைத் தக்கவைத்தபடி, இது சரியான எண்ணிக்கையாகவும் அல்லது பலமுறை என்பதற்கான மரபுத்தொடராகவும் இருக்கக்கூடிய தெளிவின்மையை அடிக்குறிப்பு விளக்குகிறது.
- source_word: וְלֹא נְתָנוֹ אֱלֹהִים
  choice: கடவுள் அனுமதிக்கவில்லை
  rationale: சொல்லுக்குச் சொல் ‘கடவுள் அவருக்குக் கொடுக்கவில்லை’ என்ற எபிரெய வழக்கு, வாய்ப்பு அல்லது அனுமதி அளிக்கவில்லை என்று பொருள்படுகிறது. தமிழில் உட்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְהָרַע עִמָּדִי
  choice: அவர் எனக்குத் தீங்கு செய்ய
  rationale: ஒருவரிடம் தீமையாக நடந்துகொள்வது அல்லது அவருக்குத் தீங்கு செய்வது என்ற பொருளைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: யாக்கோபின் பேச்சில் உண்மையான கடவுளைக் குறிக்கும் பொதுப் பெயராக இருப்பதால் ‘கடவுள்’ பொருத்தமானது.
theological_decisions:
- issue: ‘கடவுள் அவருக்குக் கொடுக்கவில்லை’ என்ற வழக்கில் வெளிப்படும் இறைத் தடை
  choice: லாபான் யாக்கோபுக்குத் தீங்கு செய்யக் கடவுள் அனுமதிக்கவில்லை
  alternative: லாபானின் கையில் யாக்கோபைக் கடவுள் ஒப்படைக்கவில்லை; அல்லது தீங்கு செய்வதில் லாபான் வெற்றி பெறக் கடவுள் விடவில்லை
  rationale: எபிரெய வழக்கு கடவுளின் தடுக்கும் செயலைச் சுட்டுகிறது; ஆனால் அது எவ்வாறு நிகழ்ந்தது என்பதை உரை விளக்காததால் கூடுதல் கருத்தைச் சேர்க்காமல் ‘அனுமதிக்கவில்லை’ என்று தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரமான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. ‘உங்கள் தந்தை’ என்பது பன்மைச் சொந்தப்பெயர் வடிவத்தைத் தக்கவைக்கிறது. ‘ஆனால்/இருந்தாலும்’ என்ற அமைப்பு குற்றச்சாட்டிற்கும் கடவுளின் தடைக்கும் இடையிலான எதிர்மறை உறவை இயல்பாக வெளிப்படுத்துகிறது.
