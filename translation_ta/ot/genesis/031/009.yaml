source:
  edition: WLC
  text: וַ/יַּצֵּ֧ל אֱלֹהִ֛ים אֶת מִקְנֵ֥ה אֲבִי/כֶ֖ם וַ/יִּתֶּן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/009.yaml
  text: So God took away your father's livestock and gave it to me[a].
translation:
  language: ta
  text: ஆகவே, கடவுள் உங்கள் தகப்பனுடைய கால்நடைகளை எடுத்துக்கொண்டு, அவற்றை எனக்குக் கொடுத்தார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பறித்தெடுத்து’ அல்லது ‘விடுவித்து’ என்றும் மொழிபெயர்க்கலாம். ஒருவரிடமிருந்து ஒன்றை எடுத்துப் பிறருக்குக் கொடுக்கும் பொருளை இந்த எபிரெய வினை தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל
  choice: எடுத்துக்கொண்டு
  rationale: נצל என்பதன் ஹிஃபில் வடிவம் ஒருவரிடமிருந்து ஒன்றைப் பறித்தெடுத்தல், விடுவித்தல் அல்லது மீட்டல் என்ற பொருள்களைத் தரலாம். இங்கு லாபானிடமிருந்து யாக்கோபுக்குக் கால்நடைகள் மாற்றப்பட்டதைச் சூழல் குறிப்பிடுவதால், ஆபத்திலிருந்து மீட்பதை வலியுறுத்தாமல் மாற்றத்தை இயல்பாகக் காட்டும் வகையில் ‘எடுத்துக்கொண்டு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு யாக்கோபின் சார்பாகச் செயல்படும் இறைவனைக் குறிக்கும் பொதுவான எபிரெயச் சொல்; நவீனத் தமிழில் இயல்பான இணை ‘கடவுள்’.
- source_word: מִקְנֵה
  choice: கால்நடைகளை
  rationale: מִקְנֶה என்பது உடைமையாக்கப்பட்ட சொத்தை, குறிப்பாக வளர்ப்பு விலங்குகளைக் குறிக்கிறது. யாக்கோபு–லாபான் மந்தைச் சூழலில் ‘கால்நடைகள்’ துல்லியமாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֲבִיכֶם
  choice: உங்கள் தகப்பனுடைய
  rationale: 'ஒருமை பெயர்ச்சொல்லோடு இரண்டாம் நபர் பன்மை உருபு உள்ளது: ராகேல், லேயாள் ஆகிய இருவரையும் நோக்கி அவர்களுடைய ஒரே தகப்பனாகிய லாபானைக் குறிப்பிடுகிறது. வேதாகமக் கண்ணிய நடைக்கு ‘தகப்பன்’ தேர்ந்தெடுக்கப்பட்டது.'
- source_word: וַיִּתֶּן לִי
  choice: அவற்றை எனக்குக் கொடுத்தார்
  rationale: נתן மற்றும் ‘எனக்கு’ என்ற மறைமுகச் செயப்படுபொருள் உடைமை மாற்றத்தைக் காட்டுகின்றன. தமிழில் முந்தைய பன்மைப் பெயரான ‘கால்நடைகளை’ மீண்டும் சுட்ட ‘அவற்றை’ சேர்ப்பது தெளிவும் இலக்கண இயல்பும் தருகிறது.
theological_decisions:
- issue: யாக்கோபின் செழிப்பில் கடவுளின் நேரடி செயற்பாடு
  choice: கடவுள் லாபானின் கால்நடைகளை எடுத்துக்கொண்டு யாக்கோபுக்குக் கொடுத்தார் என்று நேரடியாகக் கூறுதல்
  alternative: உடைமை மாற்றத்தைச் சொல்லாமல், கடவுள் யாக்கோபை பொதுவாக ஆசீர்வதித்தார் என்று மென்மைப்படுத்துதல்
  rationale: וַיַּצֵּל ... וַיִּתֶּן என்ற வினைகள் கடவுளின் செயலையும் ஒரு தரப்பிலிருந்து மற்றொரு தரப்புக்கான மாற்றத்தையும் வெளிப்படையாகக் கூறுகின்றன. அந்தத் தீவிரத்தை மொழிபெயர்ப்பு தணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘கால்நடைகள்’ தமிழில் பன்மையாக இயங்குவதால் ‘அவற்றை’ பயன்படுத்தப்பட்டது. தொடக்க וַ־ இங்குள்ள முடிவுரைத் தொடர்பை வெளிப்படுத்த ‘ஆகவே’ என வழங்கப்பட்டது.
