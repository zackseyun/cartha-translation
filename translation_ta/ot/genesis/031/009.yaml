  terminology: “கடவுள்,” “கால்நடைகள்,” “தகப்பன்” ஆகியவை சூழலுக்கேற்ற நிலையான சொற்கள். வினைக்கான அடிக்குறிப்பு ‘பறித்தெடுத்து’ மற்றும் ‘விடுவித்து’ என்ற சாத்தியமான சொற்பொருள் வரம்பைச் சுருக்கமாகவும் பொருத்தமாகவும் குறிப்பிடுகிறது; முதன்மை உரை ஆபத்திலிருந்து மீட்பு என்ற பொருளைத் தேவையின்றி திணிக்கவில்லை.
