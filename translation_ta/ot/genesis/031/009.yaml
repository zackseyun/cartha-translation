  source_fidelity: மூல எபிரெயத்தின் வினைத் தொடரான “கடவுள் ... கால்நடைகளை எடுத்துக்கொண்டு/எடுத்துச் சென்று எனக்குக் கொடுத்தார்” என்ற உடைமை மாற்றமும், யாக்கோபுக்குச் சாதகமான கடவுளின் நேரடி செயல்பாடும் மொழிபெயர்ப்பில் தக்கவைக்கப்பட்டுள்ளன. אֲבִיכֶם என்பது ராகேலும் லேயாளும் பகிரும் ஒரே தந்தையைச் சுட்டுவதால் “உங்கள் தகப்பனுடைய” சரியானது.
