  text: אֱלֹהֵ֨י אַבְרָהָ֜ם וֵֽ/אלֹהֵ֤י נָחוֹר֙ יִשְׁפְּט֣וּ בֵינֵ֔י/נוּ אֱלֹהֵ֖י אֲבִי/הֶ֑ם וַ/יִּשָּׁבַ֣ע יַעֲקֹ֔ב בְּ/פַ֖חַד אָבִ֥י/ו יִצְחָֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/053.yaml
  text: May the God of Abraham and the god of Nahor[a], the god of their father, judge between us[c][b]. And Jacob swore by the Fear of his father Isaac.
translation:
  language: ta
  text: “ஆபிரகாமின் கடவுளும், நாகோரின் கடவுளும்—அவர்களுடைய தந்தையின் கடவுளும்—நமக்கிடையே தீர்ப்பளிப்பார்களாக.”[a] யாக்கோபோ தன் தந்தை ஈசாக்கின் ‘அச்சத்தின்’ பேரில் சத்தியம் செய்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆபிரகாமின் கடவுளும் நாகோரின் கடவுளுமாகிய அவர்களுடைய தந்தையின் கடவுள் நமக்கிடையே தீர்ப்பளிப்பாராக” என்றும் வாசிக்கலாம். எபிரெயத்தில் ‘தீர்ப்பளிப்பார்கள்’ என்ற பன்மை வினை உள்ளது; ஒரே கடவுளா அல்லது ஒன்றுக்கு மேற்பட்ட தெய்வக் குறிப்புகளா என்பது தெளிவாகத் தீர்மானிக்கப்படவில்லை.
    reason: alternative_reading
  - marker: b
    text: ‘ஈசாக்கின் அச்சம்’ என்பது கடவுளைக் குறிக்கும் அரிய பட்டப்பெயர். இதன் எபிரெயச் சொல் நேரடியாக ‘அச்சம்’, ‘பயம்’ அல்லது ‘திகில்’ என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי אַבְרָהָם
  choice: ஆபிரகாமின் கடவுள்
  rationale: אֱלֹהֵי என்பது வடிவத்தில் பன்மை அமைப்புடையதாக இருந்தாலும், ஆபிரகாமுடன் தொடர்புடைய தெய்வத்தைக் குறிக்கும் வழக்கமான ‘கடவுள்’ என்னும் ஒருமைப் பொருளில் உள்ளது.
- source_word: וֵאלֹהֵי נָחוֹר
  choice: நாகோரின் கடவுள்
  rationale: தமிழில் பெரிய/சிறிய எழுத்து வேறுபாட்டால் ‘God/god’ என்ற நுணுக்கத்தைக் காட்ட முடியாது. எனவே ஒரே கடவுளா அல்லது வேறு தெய்வங்களா என்பதைத் தீர்மானிக்காமல், இணை அமைப்பை அப்படியே வைத்துள்ளது.
- source_word: אֱלֹהֵי אֲבִיהֶם
  choice: அவர்களுடைய தந்தையின் கடவுள்
  rationale: முந்திய அழைப்பை விளக்கும் இடைச்சேர்க்கையாக வாசிக்கப்படுகிறது. ஒரே மூதாதையரின் கடவுளை அடையாளப்படுத்துகிறதா அல்லது தனித்த குடும்பத் தெய்வக் குறிப்பா என்ற தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יִשְׁפְּטוּ
  choice: தீர்ப்பளிப்பார்களாக
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை imperfect வடிவத்தையும், வேண்டுதல்/அழைப்பு சார்ந்த jussive நுணுக்கத்தையும் தமிழில் பன்மை வினை மற்றும் ‘-ஆக’ மூலம் வெளிப்படுத்துகிறது.
- source_word: בֵינֵינוּ
  choice: நமக்கு நடுவே
  rationale: உடன்படிக்கையில் இரு தரப்புகளுக்கிடையே நீதித் தீர்ப்பு வழங்கும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּשָּׁבַע
  choice: ஆணையிட்டான்
  rationale: சத்தியம் செய்தான் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தரும் இறந்தகாலக் கதைநடை வினை.
- source_word: בְּפַחַד
  choice: ‘அச்சம்’ என்பவரின் பெயரில்
  rationale: פַּחַד என்பதன் அடிப்படைப் பொருளான ‘அச்சம்/பயம்’ என்பதையும், இங்கு அது கடவுளுக்கான அரிய சிறப்புப் பெயராகச் செயல்படுவதையும் பாதுகாக்கிறது. மேற்கோள் குறியும் ‘என்பவர்’ என்பதும் இது சாதாரண உணர்ச்சியல்ல, ஒரு பட்டப்பெயர் என்பதை வாசகருக்கு உணர்த்துகின்றன.
- source_word: אָבִיו יִצְחָק
  choice: தன் தந்தை ஈசாக்கின்
  rationale: யாருடைய ‘அச்சம்’ என்று குறிப்பிடப்படுகிறது என்பதை இயல்பான தமிழ் உடைமைத் தொடரில் தருகிறது.
theological_decisions:
- issue: ஆபிரகாம், நாகோர், அவர்களுடைய தந்தை ஆகியோருடன் தொடர்புபடுத்தப்படும் தெய்வக் குறிப்புகள் ஒரே கடவுளைக் குறிக்கின்றனவா?
  choice: ஒருமை ‘கடவுள்’ என்பதை ஒவ்வொரு தொடரிலும் வைத்து, எபிரெயப் பன்மை வினையை ‘தீர்ப்பளிப்பார்களாக’ என்று பாதுகாத்தல்
  alternative: “ஆபிரகாமின் கடவுளும் நாகோரின் கடவுளுமாகிய அவர்களுடைய தந்தையின் கடவுள் ... தீர்ப்பளிப்பாராக” என்று அனைத்தையும் ஒரே அடையாளமாகத் தெளிவுபடுத்துதல்
  rationale: எபிரெய உரை ஒருபுறம் ஒரே மாதிரியான אֱלֹהֵי தொடர்களையும் மறுபுறம் பன்மை வினையையும் பயன்படுத்துகிறது. தமிழில் எழுத்துருப் பெருமை வேறுபாடு இல்லாததால், ஒருமைப் பெயர்ச்சொல்–பன்மை வினை இடையிலான பதற்றத்தைத் தக்கவைத்து, ஒரே தெய்வமா பல தெய்வக் குறிப்புகளா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- issue: בְּפַחַד אָבִיו יִצְחָק என்ற யாக்கோபின் ஆணைச் சொல்லை எவ்வாறு வழங்குவது?
  choice: “தன் தந்தை ஈசாக்கின் ‘அச்சம்’ என்பவரின் பெயரில்”
  alternative: “தன் தந்தை ஈசாக்கு பயந்த கடவுளின் பெயரில்” அல்லது “ஈசாக்கின் பயபக்திக்குரியவரின் பெயரில்”
  rationale: மாற்று வடிவங்கள் அரிய தெய்வீகப் பட்டப்பெயரை விளக்கவுரையாக மாற்றிவிடும். ‘அச்சம்’ என்பதை நேரடியாக வைத்திருப்பது மூலத்தின் தனித்துவத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன செந்தரத் தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. ‘தந்தை’ என்பது இயல்பான நவீன வடிவமாகத் தேர்ந்தெடுக்கப்பட்டது. மூலத்தில் உள்ள பன்மை வினையும் அரிய ‘அச்சம்’ பட்டப்பெயரும் மென்மைப்படுத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
