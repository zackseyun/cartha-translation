source:
  edition: WLC
  text: וְ/עַתָּה֙ הָלֹ֣ךְ הָלַ֔כְתָּ כִּֽי נִכְסֹ֥ף נִכְסַ֖פְתָּה לְ/בֵ֣ית אָבִ֑י/ךָ לָ֥/מָּה גָנַ֖בְתָּ אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/030.yaml
  text: And now[a], you have indeed gone away, because you longed greatly for your father's house. Why did you steal my gods?
translation:
  language: ta
  text: இப்போதோ, நீ உன் தந்தையின் வீட்டிற்காக மிகவும் ஏங்கியதால் நிச்சயமாகப் போய்விட்டாய். என் தெய்வங்களை[a] ஏன் திருடினாய்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் வீட்டுத் தெய்வங்களை.” எபிரெய உரையில் “என் தெய்வங்கள்” என்றே உள்ளது; இச்சூழலில் அது லாபானின் வீட்டுத் தெய்வங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: லாபானின் குற்றச்சாட்டில் அடுத்த கருத்தை அறிமுகப்படுத்தும் உரையாடல் இடைச்சொல். தமிழில் இயல்பாக இருக்க ‘இப்போது’ என மொழிபெயர்க்கப்பட்டது; இணைப்பின் தொடர்ச்சி சூழலால் தெளிவாகிறது.
- source_word: הָלֹךְ הָלַכְתָּ
  choice: போயே போய்விட்டாய்
  rationale: முற்றுவினையெச்சத்துடன் அதே வேரிலான வினைச்சொல் வருவது செயலை வலியுறுத்துகிறது. ‘போயே போய்விட்டாய்’ என்பது நிறைவுற்ற புறப்பாட்டையும் வலியுறுத்தலையும் இயல்பான தமிழில் தருகிறது.
- source_word: כִּי
  choice: ஏங்கியதால்
  rationale: யாக்கோபு புறப்பட்டுச் சென்றதற்கான காரணத்தை அறிமுகப்படுத்துகிறது; காரண விகுதி தமிழில் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: נִכְסֹף נִכְסַפְתָּה
  choice: மிகவும் ஏங்கியதால்
  rationale: மீண்டும் வரும் முற்றுவினையெச்சம் வலுவான ஏக்கத்தைச் சுட்டுகிறது. ‘மிகவும் ஏங்கி’ அந்த தீவிரத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: לְבֵית אָבִיךָ
  choice: உன் தகப்பனின் வீட்டிற்காக
  rationale: குடும்பத்தையும் இல்லத்தையும் உள்ளடக்கும் ‘தகப்பனின் வீடு’ என்ற உருவகத்தைத் தக்கவைக்கிறது; நவீன வாசகருக்கும் தெளிவான மரியாதைமிக்க நடை.
- source_word: לָמָּה
  choice: ஏன்
  rationale: நேரடியான காரண வினாவுக்கான இயல்பான தமிழ் வடிவம்.
- source_word: גָנַבְתָּ
  choice: திருடினாய்
  rationale: லாபானின் நேரடியான குற்றச்சாட்டை எளிய இறந்தகால வினாவாக வழங்குகிறது.
- source_word: אֶת אֱלֹהָי
  choice: என் தெய்வங்களை
  rationale: எபிரெய உரையில் நேரடியாக ‘என் தெய்வங்கள்’ என்றே உள்ளது. சூழலிலுள்ள வீட்டுத் தெய்வச் சிலைகள் என்ற விளக்கத்தை முதன்மை உரையில் சேர்க்காமல் அடிக்குறிப்பில் தருகிறது.
theological_decisions:
- issue: லாபானின் பேச்சில் אֱלֹהָי என்பதன் மொழிபெயர்ப்பு
  choice: என் தெய்வங்களை
  alternative: என் வீட்டுத் தெய்வங்களை / என் வீட்டுத் தெய்வச் சிலைகளை
  rationale: மூல எபிரெயம் பொதுவாக ‘என் தெய்வங்கள்’ என்று மட்டுமே கூறுகிறது. சுற்றியுள்ள நிகழ்ச்சியில் வீட்டுத் தெய்வங்களைக் குறித்தாலும், அந்தச் சிறப்பாக்கத்தை முதன்மை உரைக்குள் இறக்குமதி செய்யாமல் அடிக்குறிப்பில் விளக்குவது மூலத்தின் சொல்வடிவத்தையும் சூழலையும் சமநிலைப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியும் கண்ணியமுமான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. இரு எபிரெய வலியுறுத்தல் அமைப்புகளும் முறையே ‘போயே போய்விட்டாய்’ மற்றும் ‘மிகவும் ஏங்கி’ என வேறுபடுத்திக் காட்டப்பட்டுள்ளன. ‘தகப்பன்’ என்பது வேதாகமக் கதைநடைக்கு ஏற்ற மரியாதைமிக்க, பொதுவாகப் புரியும் சொலாகத் தேர்ந்தெடுக்கப்பட்டது.
