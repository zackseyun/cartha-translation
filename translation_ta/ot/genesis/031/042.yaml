source:
  edition: WLC
  text: לוּלֵ֡י אֱלֹהֵ֣י אָבִ/י֩ אֱלֹהֵ֨י אַבְרָהָ֜ם וּ/פַ֤חַד יִצְחָק֙ הָ֣יָה לִ֔/י כִּ֥י עַתָּ֖ה רֵיקָ֣ם שִׁלַּחְתָּ֑/נִי אֶת עָנְיִ֞/י וְ/אֶת יְגִ֧יעַ כַּפַּ֛/י רָאָ֥ה אֱלֹהִ֖ים וַ/יּ֥וֹכַח אָֽמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/042.yaml
  text: If the God of my father[a], the God of Abraham, and the Fear of Isaac, had not been with me, surely by now you would have sent me away empty-handed. God saw my affliction and the labor of my hands, and he judged last night.
translation:
  language: ta
  text: என் தந்தையின் கடவுளும், ஆபிரகாமின் கடவுளும், ஈசாக்கின் பயமுமானவர்[a] எனக்குத் துணையாக இருந்திருக்காவிட்டால், நீ இந்நேரம் என்னை வெறுங்கையுடன் அனுப்பியிருப்பாய். கடவுள் என் துன்பத்தையும் என் கைகளின் உழைப்பையும் பார்த்தார்; நேற்றிரவு அவர் தீர்ப்பளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஈசாக்கு அஞ்சுகிறவர்.’ எபிரேயத்தில் சொல்லுக்கு சொல் ‘ஈசாக்கின் பயம்’; இது கடவுளுக்கான தனித்துவமான பட்டம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵי
  choice: இருந்திருக்காவிட்டால்
  rationale: நிகழாத கடந்தகால நிலையை முன்வைக்கும் எதிர்மறை நிபந்தனையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֱלֹהֵי אָבִי
  choice: என் தந்தையின் கடவுள்
  rationale: எபிரெயக் கூட்டுச் சொல்லைத் தெளிவாகவும் நேரடியாகவும் தருகிறது.
- source_word: אֱלֹהֵי אַבְרָהָם
  choice: ஆபிரகாமின் கடவுள்
  rationale: மூலத்தின் கூட்டுச் சொல்லை வழக்கமான தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וּפַחַד יִצְחָק
  choice: ஈசாக்கின் பயம்
  rationale: கடவுளுக்கான தனித்துவமான எபிரெயப் பட்டத்தை விளக்கவுரையாக மாற்றாமல் பாதுகாக்கிறது; அதன் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: הָיָה לִי
  choice: எனக்குத் துணையாக இருந்தார்
  rationale: இச்சூழலில் கடவுளின் ஆதரவையும் உடனிருப்பையும் குறிக்கும் சொல்லாட்சியை இயல்பான தமிழில் தருகிறது.
- source_word: כִּי עַתָּה
  choice: இந்நேரம்
  rationale: நிபந்தனையின் விளைவு இதற்குள் நிகழ்ந்திருக்கும் என்ற காலப்பொருளைத் தெரிவிக்கிறது.
- source_word: רֵיקָם
  choice: வெறுங்கையுடன்
  rationale: எதுவும் கொடுக்கப்படாமல் அனுப்பப்படுவதைத் தெளிவாகக் கூறும் இயல்பான தமிழ் மரபுத்தொடர்.
- source_word: שִׁלַּחְתָּנִי
  choice: என்னை அனுப்பியிருப்பாய்
  rationale: நிகழாத நிபந்தனையின் விளைவாக வந்திருக்கும் செயலைத் தமிழில் சரியான காலநிலையுடன் தருகிறது.
- source_word: עָנְיִי
  choice: என் துன்பம்
  rationale: வறுமையை மட்டும் அல்லாமல் யாக்கோபு அனுபவித்த ஒடுக்கத்தையும் கடின நிலையையும் உள்ளடக்குகிறது.
- source_word: יְגִיעַ כַּפַּי
  choice: என் கைகளின் உழைப்பு
  rationale: கடினமான தனிப்பட்ட உழைப்பைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் காக்கிறது.
- source_word: רָאָה אֱלֹהִים
  choice: கடவுள் பார்த்தார்
  rationale: எபிரெய வினையை எளிய இறந்தகாலத்தில் நேரடியாக வழங்குகிறது.
- source_word: וַיּוֹכַח
  choice: அவர் தீர்ப்பளித்தார்
  rationale: יכח என்பதிலுள்ள தீர்ப்பிடுதல், கண்டித்தல், வழக்கை முடிவுசெய்தல் ஆகிய சாத்தியங்களுள் நீதித்துறைத் தொனியைப் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையான செயப்படுபொருள் இல்லாததால் தமிழிலும் ஒன்றைச் சேர்க்கவில்லை.
theological_decisions:
- issue: וּפַחַד יִצְחָק என்ற இறைப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: ஈசாக்கின் பயம்
  alternative: ஈசாக்கு அஞ்சுகிறவர்
  rationale: வழக்கத்திற்கு மாறான மூல உருவகத்தையும் அதன் இறையியல் இறுக்கத்தையும் முதன்மை உரையில் காக்கிறது; தெளிவான விளக்கமொழி அடிக்குறிப்பில் தரப்படுகிறது.
- issue: וַיּוֹכַח என்பதன் சூழல்சார் பொருள்
  choice: அவர் தீர்ப்பளித்தார்
  alternative: அவர் கண்டித்தார் / அவர் நியாயம் தீர்த்தார்
  rationale: முந்தைய இரவில் லாபானிடம் கடவுள் தலையிட்ட சூழலைச் சுட்டினாலும், எபிரெயச் சொல்லின் நீதித்துறை மற்றும் கண்டிப்பு சார்ந்த இருபொருள் வாய்ப்பை முற்றிலும் நீக்கவில்லை. மூலத்தில் இல்லாத ‘உன்னை’ என்ற செயப்படுபொருளும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நடையைப் பயன்படுத்துகிறது. எதிர்நிகழ் நிபந்தனை இயல்பாக அமைக்கப்பட்டுள்ளது; அதே நேரத்தில் ‘ஈசாக்கின் பயம்’ என்ற மூலத்தின் அபூர்வ இறைப் பட்டமும், கடைசி வினையின் வெளிப்படையான செயப்படுபொருள் இல்லாமையும் பாதுகாக்கப்பட்டுள்ளன.
