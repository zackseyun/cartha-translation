translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையில் மொழிபெயர்க்கப்பட்டது. ‘குவியல்’ என்ற சொல் கற்களால் செய்யப்பட்ட நினைவுக் குவியலை இயல்பாகக் குறிக்கிறது; மூலத்தின் இரு பொருள் சாத்தியங்களும் அடிக்குறிப்புகள் மூலம் பாதுகாக்கப்பட்டுள்ளன.
