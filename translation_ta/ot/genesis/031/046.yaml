base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/046.yaml
  text: Then Jacob said to his brothers[a], “Gather stones.” So they took stones and made a heap[b], and they ate there by the heap.
translation:
  language: ta
  text: பின்பு யாக்கோபு தன் சகோதரர்களிடம்[a], “கற்களைச் சேகரியுங்கள்” என்றான். அவர்கள் கற்களை எடுத்துக் குவியல் அமைத்தார்கள்; அங்கே அந்தக் குவியலருகே[b] உணவு உண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்கள்” என்பது யாக்கோபின் உடன்பிறந்த சகோதரர்களை மட்டும் அல்லாமல், அவருடைய ஆண் உறவினர்களையோ உடனிருந்த ஆண்களையோ விரிவாகக் குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “அங்கே அந்தக் குவியலின்மேல் உணவு உண்டார்கள்.” எபிரேய முன்னிடைச்சொல்லை இன்னும் நேரடியாக “மேல்” என்று மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֶחָיו
  choice: தன் சகோதரர்களிடம்
  rationale: אָח என்பதன் நேரடிப் பொருள் ‘சகோதரன்’; ஆனால் இச்சூழலில் அது ஆண் உறவினர்களையோ உடனிருந்த ஆண்களையோ விரிவாகக் குறிக்கலாம். மூலத்திற்கு நெருக்கமான ‘சகோதரர்கள்’ முதன்மை உரையில் வைக்கப்பட்டு, விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לִקְטוּ
  choice: சேகரியுங்கள்
  rationale: לקט என்பதன் கட்டளை வடிவம் சிதறிக் கிடப்பவற்றைத் திரட்டுவதைக் குறிக்கிறது; கற்களைச் சேர்க்கும் இச்சூழலில் ‘சேகரியுங்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אֲבָנִים
  choice: கற்கள்
  rationale: אֶבֶן என்பதற்கான வழக்கமான, துல்லியமான தமிழ் இணை ‘கல்’; பன்மையில் ‘கற்கள்’.
- source_word: וַיַּעֲשׂוּ גָל
  choice: குவியல் அமைத்தார்கள்
  rationale: גַּל இங்கு கற்களால் செய்யப்பட்ட குவியலைக் குறிக்கிறது. ‘குவியல் அமைத்தார்கள்’ என்பது செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיֹּאכְלוּ שָׁם עַל הַגָּל
  choice: அங்கே அந்தக் குவியலருகே உணவு உண்டார்கள்
  rationale: עַל என்பதற்கு நேரடியாக ‘மேல்’ என்ற பொருள் இருந்தாலும், சூழலின்படி ‘அருகே/பக்கத்தில்’ என்றும் வரலாம். உணவு உண்ட இடத்தைக் குறிக்கும் இயல்பான வாசிப்பாக ‘குவியலருகே’ தேர்ந்தெடுக்கப்பட்டு, நேரடி மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
