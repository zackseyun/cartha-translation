base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/043.yaml
  text: Then Laban answered and said to Jacob[a], “The daughters are my daughters, and the sons are my sons, and the flock is my flock, and all that you see is mine. But what can I do this day for these my daughters, or for their children whom they have borne?”
translation:
  language: ta
  text: 'அப்போது லாபான் யாக்கோபுக்குப் பதிலளித்துச் சொன்னான்: “மகள்கள் என் மகள்கள்; மகன்கள் என் மகன்கள்; மந்தை என் மந்தை; நீ காண்பவை அனைத்தும் என்னுடையவை. ஆனால் இன்று என் மகள்களாகிய இவர்களுக்கோ, அவர்கள் பெற்றெடுத்த பிள்ளைகளுக்கோ நான் என்ன செய்ய முடியும்?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்கள் பெற்றெடுத்த மகன்களுக்கோ” என்றும் மொழிபெயர்க்கலாம்; בְּנֵיהֶן என்பதைப் பொதுவாகப் பிள்ளைகள் என்று கொள்ளாமல், ஆண் சந்ததியைக் குறிக்கும் சொல்லாகக் குறுகிய பொருளில் எடுத்தால் இவ்வாறு வரும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן לָבָן וַיֹּאמֶר אֶל יַעֲקֹב
  choice: அப்போது லாபான் யாக்கோபுக்குப் பதிலளித்துச் சொன்னான்
  rationale: ‘பதிலளித்தான்’ மற்றும் ‘சொன்னான்’ என்ற இரு எபிரெய வினைகளையும் இயல்பான தமிழ் கதைநடையில் தக்கவைக்கிறது.
- source_word: הַבָּנוֹת בְּנֹתַי
  choice: இந்த மகள்கள் என் மகள்கள்
  rationale: பெயர்ச்சொல் மீளுரைப்பின் வழியாக வரும் லாபானின் வலியுறுத்தப்பட்ட உறவுரிமைக் கூற்றைப் பாதுகாக்கிறது.
- source_word: וְהַבָּנִים בָּנַי
  choice: இந்த மகன்கள் என் மகன்கள்
  rationale: בָּנִים என்பதன் ஆண்பால் பன்மையை இச்சூழலில் ‘மகன்கள்’ என நேரடியாகத் தருகிறது.
- source_word: וְהַצֹּאן צֹאנִי
  choice: இந்த மந்தை என் மந்தை
  rationale: צֹאן குறிக்கும் சிறுகால்நடைகளின் கூட்டுப் பொருளை இயல்பான தமிழில் ‘மந்தை’ என வழங்கி, மூலத்தின் மீளுரைப்பையும் காக்கிறது.
- source_word: וְכֹל אֲשֶׁר אַתָּה רֹאֶה לִי הוּא
  choice: நீ காண்பவை அனைத்தும் என்னுடையவை
  rationale: மூலத்தின் விரிவான உடைமைக் கூற்றைச் சுருக்கமின்றித் தெளிவாகக் கூறுகிறது.
- source_word: מָה אֶעֱשֶׂה ... הַיּוֹם
  choice: இன்று ... நான் என்ன செய்ய முடியும்?
  rationale: இச்சூழலில் உள்ள நடைமுறைச் சாத்தியத்தைக் கேள்வியாக வெளிப்படுத்துகிறது; הַיּוֹם என்பதற்கு நவீன இயல்பான தமிழ் ‘இன்று’ பயன்படுத்தப்படுகிறது.
- source_word: וְלִבְנֹתַי ... אוֹ לִבְנֵיהֶן
  choice: என் மகள்களாகிய இவர்களுக்கோ, அவர்கள் பெற்ற பிள்ளைகளுக்கோ
  rationale: לְ என்பதன் தொடர்பு/நலன் சார்ந்த பொருளை ‘-க்கோ’ எனத் தருகிறது; בְּנֵיהֶן இங்கு பொதுவாகச் சந்ததியைக் குறிக்கக்கூடியதால் ‘பிள்ளைகள்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: אֲשֶׁר יָלָדוּ
  choice: அவர்கள் பெற்ற
  rationale: மகள்களே பெற்றெடுத்தவர்கள் என்ற தாய்வழிக் குறிப்பை இயல்பான தமிழில் சுருக்கமாகத் தக்கவைக்கிறது.
