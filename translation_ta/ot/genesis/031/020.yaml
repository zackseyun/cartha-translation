translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய மரபுத்தொடர் முதன்மை உரையில் இயல்பான பொருளாக மொழிபெயர்க்கப்பட்டு, அதன் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
