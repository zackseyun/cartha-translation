  text: וַ/יִּגְנֹ֣ב יַעֲקֹ֔ב אֶת לֵ֥ב לָבָ֖ן הָ/אֲרַמִּ֑י עַל בְּלִי֙ הִגִּ֣יד ל֔/וֹ כִּ֥י בֹרֵ֖חַ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/020.yaml
  text: And Jacob deceived Laban the Aramean by not telling him that he was fleeing[a].
translation:
  language: ta
  text: யாக்கோபு தான் தப்பியோடுவதை அராமியனான லாபானிடம் சொல்லாமல், அவனை ஏமாற்றினான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “அராமியனான லாபானின் இதயத்தை யாக்கோபு திருடினான்.” இது அவனை ஏமாற்றினான் அல்லது அவனுக்குத் தெரியாமல் செயல்பட்டான் என்று பொருள்படும் ஓர் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְנֹב ... אֶת לֵב
  choice: அவனை ஏமாற்றினான்
  rationale: “இதயத்தைத் திருடினான்” என்ற எபிரெய மரபுத்தொடர் இங்கு அன்பைக் கவர்ந்தான் என்று பொருளல்ல; மறைவாகச் செயல்பட்டு ஒருவரை ஏமாற்றுதல் அல்லது அவருக்குத் தெரியாமல் செய்தல் என்பதே சூழலுக்கேற்ற பொருள். இயல்பான தமிழில் இதை “அவனை ஏமாற்றினான்” என்று வழங்குவது தவறான உணர்ச்சிசார் பொருளைத் தவிர்க்கிறது.
- source_word: הָאֲרַמִּי
  choice: அராமியனான
  rationale: இது எபிரெய மொழியிலுள்ள இன/நிலப்பரப்புப் பெயரை நேரடியாகக் குறிக்கிறது; “சீரியன்” என்ற பாரம்பரியச் சொல்லைவிட “அராமியன்” துல்லியமானது.
- source_word: עַל בְּלִי הִגִּיד לוֹ
  choice: அவரிடம் சொல்லாமல்
  rationale: யாக்கோபு எவ்வாறு லாபானை ஏமாற்றினான் என்பதைக் காட்டும் முறை/வழியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי בֹרֵחַ הוּא
  choice: தான் தப்பியோடுவதை
  rationale: பங்கேற்புவினையின் தொடர்நிலை அல்லது உடனடி நிகழ்வை வெளிப்படுத்துகிறது. “தப்பியோடுவது” என்பது மறைவாக விலகிச் செல்லும் சூழலையும் செயலின் தீவிரத்தையும் தமிழில் தெளிவாகத் தருகிறது.
