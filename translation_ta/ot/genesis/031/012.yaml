  text: וַ/יֹּ֗אמֶר שָׂא נָ֨א עֵינֶ֤י/ךָ וּ/רְאֵה֙ כָּל הָֽ/עַתֻּדִים֙ הָ/עֹלִ֣ים עַל הַ/צֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּ/בְרֻדִּ֑ים כִּ֣י רָאִ֔יתִי אֵ֛ת כָּל אֲשֶׁ֥ר לָבָ֖ן עֹ֥שֶׂה לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/012.yaml
  text: 'And he said[a], “Please lift up your eyes and see: all the male goats that are mating with the flock are striped, speckled, and spotted[b], for I have seen all that Laban is doing to you.”'
translation:
  language: ta
  text: 'அவர் சொன்னார்: “தயவுசெய்து உன் கண்களை உயர்த்திப் பார். மந்தையோடு இனச்சேர்க்கை செய்கிற[a] வெள்ளாட்டுக் கடாக்கள் எல்லாம் வரிகளுள்ளவையும்[b], சிறுபுள்ளிகளுள்ளவையும், திட்டுகளுள்ளவையுமாக இருக்கின்றன. ஏனெனில் லாபான் உனக்குச் செய்துவருவதையெல்லாம் நான் பார்த்திருக்கிறேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “மந்தையின்மேல் ஏறுகிற.” இது விலங்குகளின் இனப்பெருக்கத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: עֲקֻדִּים என்ற எபிரெயச் சொல்லை மரபுவழி மொழிபெயர்ப்புகள் சில “வளைய வரிகளுள்ளவை” என்றும் மொழிபெயர்க்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא עֵינֶיךָ וּרְאֵה
  choice: தயவுசெய்து உன் கண்களை உயர்த்திப் பார்
  rationale: ‘கண்களை உயர்த்துதல்’ என்ற எபிரெயச் சொற்றொடரின் காட்சிசார் வலியுறுத்தலைப் பேணுகிறது; נָא என்பதன் பணிவான வேண்டுகோள் தன்மையை ‘தயவுசெய்து’ வெளிப்படுத்துகிறது.
- source_word: הָעַתֻּדִים
  choice: வெள்ளாட்டுக் கடாக்கள்
  rationale: עתודים என்பது இங்கு செம்மறியாட்டுக் கடாக்களை அல்ல, ஆண் வெள்ளாடுகளைக் குறிக்கிறது; இத்தமிழ்ச் சொல் அந்த வேறுபாட்டைத் தெளிவாக்குகிறது.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: மந்தையோடு இனச்சேர்க்கை செய்கிற
  rationale: விலங்குகளின் இனப்பெருக்கச் சூழலில் ‘மேல் ஏறுதல்’ என்பது இணைசேர்தலைக் குறிக்கும் மரபுத்தொடர். இயல்பான நவீன தமிழில் அதன் பொருளை நேரடியாகத் தருகிறது; சொல்லுக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: עֲקֻדִּים
  choice: வரிகளுள்ளவை
  rationale: பட்டைகள் அல்லது வரிகள் போன்ற அடையாளங்களைக் குறிக்கும் சொல்லை எளிய, தெளிவான தமிழில் தருகிறது.
- source_word: נְקֻדִּים
  choice: சிறுபுள்ளிகளுள்ளவை
  rationale: சிறிய புள்ளிகளைக் குறிக்கும் இச்சொல்லை அடுத்துவரும் பெரிய அல்லது ஒழுங்கற்ற திட்டுகளிலிருந்து வேறுபடுத்துகிறது.
- source_word: וּבְרֻדִּים
  choice: திட்டுகளுள்ளவை
  rationale: பலவிதமாகக் கலந்த அல்லது பெரிய புள்ளித் திட்டுகளைக் கொண்ட தோற்றத்தை இயல்பான தமிழில் வெளிப்படுத்தி, נְקֻדִּים என்பதிலிருந்து இயன்றவரை வேறுபடுத்துகிறது.
- source_word: כִּי רָאִיתִי
  choice: ஏனெனில் ... நான் பார்த்திருக்கிறேன்
  rationale: כִּי என்பதன் காரணத் தொடர்பையும், நிறைவுற்ற பார்வைக்கு நிகழ்காலத் தொடர்பு இருப்பதையும் பேணுகிறது.
- source_word: אֵת כָּל אֲשֶׁר לָבָן עֹשֶׂה לָּךְ
  choice: லாபான் உனக்குச் செய்துகொண்டிருப்பதையெல்லாம்
  rationale: עֹשֶׂה என்ற நிகழ்நிலை வினையெச்சம் தொடரும் செயலைச் சுட்டுகிறது; சூழலில் לָּךְ என்பது யாக்கோபுக்கு எதிராக அல்லது அவனைப் பாதிக்கும் விதமாகச் செய்யப்படுவதை உணர்த்துகிறது.
theological_decisions:
- issue: וַיֹּאמֶר என்பதிலுள்ள ஆண்பால் ஒருமை எழுவாயின் அடையாளம்
  choice: அவர் சொன்னார்
  alternative: அவன் சொன்னான்
  rationale: முந்தைய சூழலில் பேசுபவரைச் சுட்டும் ஆண்பால் ஒருமையைப் பேணியபடி, தமிழில் தெய்வீகத் தூதரைக் குறிப்பிட ஏற்ற மரியாதை ஒருமை பயன்படுத்தப்படுகிறது; பெயரையோ அடையாளத்தையோ இவ்வசனத்துக்குள் புதிதாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இனப்பெருக்கச் சொற்றொடர் மறைக்கப்படாமல் இயல்பாகத் தரப்பட்டுள்ளது; மூன்று வகையான உடல் அடையாளங்களின் வேறுபாடு ‘வரிகள்,’ ‘சிறுபுள்ளிகள்,’ ‘திட்டுகள்’ எனப் பேணப்பட்டுள்ளது.
