  yaml_path: translation/ot/genesis/031/047.yaml
  text: Laban called it Jegar-sahadutha[b][a], but Jacob called it Galeed.
translation:
  language: ta
  text: லாபான் அதை “யெகர்-சகதூதா”[a] என்று அழைத்தான்; ஆனால் யாக்கோபு அதை “கலேயேத்”[b] என்று அழைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யெகர்-சகதூதா” என்பது “சாட்சிக் குவியல்” அல்லது “சான்றுக் குவியல்” என்று பொருள்படும் அரமேயப் பெயர்.
    reason: lexical_alternative
  - marker: b
    text: “கலேயேத்” என்பது “சாட்சிக் குவியல்” அல்லது “சான்றுக் குவியல்” என்று பொருள்படும் எபிரெயப் பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... לָבָן
  choice: லாபான் ... அழைத்தான்
  rationale: קרא என்பது இங்குப் பெயரிடுதலைக் குறிக்கிறது. ‘என்று அழைத்தான்’ என்பது இயல்பான தமிழில் அந்தப் பெயரிடும் செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לּוֹ
  choice: அதை
  rationale: எபிரெயச் சுட்டுப்பெயர் இலக்கணப்படி ஆண்பால் ஒருமையாக இருந்தாலும், சூழலில் அது முன்பு அமைக்கப்பட்ட கற்குவியலைக் குறிக்கிறது; உயிரற்ற பொருளுக்கான இயல்பான தமிழ் வடிவம் ‘அதை’.
- source_word: יְגַר שָׂהֲדוּתָא
  choice: யெகர்-சகதூதா
  rationale: லாபான் சூட்டிய அரமேயப் பெயரை மொழிபெயர்க்காமல் ஒலிபெயர்த்து, பெயரிடுதலின் மொழிவேறுபாட்டைப் பாதுகாக்கிறது; பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְיַעֲקֹב
  choice: ஆனால் யாக்கோபு
  rationale: וְ என்பதன் அடிப்படைப் பொருள் ‘மற்றும்’ என்றாலும், ஒரே குவியலுக்கு லாபானும் யாக்கோபும் வெவ்வேறு மொழிகளில் பெயரிட்டதை இங்கு எதிர்மறை ஒப்பீடாகக் காட்டுவதால் ‘ஆனால்’ இயல்பாக உள்ளது.
- source_word: גַּלְעֵד
  choice: கலேயேத்
  rationale: யாக்கோபு சூட்டிய எபிரெயப் பெயரை ஒலிபெயர்த்து, அரமேயப் பெயருடன் உள்ள பொருள் ஒற்றுமையையும் மொழி வேறுபாட்டையும் அடிக்குறிப்பு மூலம் வெளிப்படுத்துகிறது.
