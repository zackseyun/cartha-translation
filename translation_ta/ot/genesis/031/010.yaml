  yaml_path: translation/ot/genesis/031/010.yaml
  text: And it happened at the time when the flock was mating that I lifted up my eyes and saw in a dream[a], and behold, the male goats that were mounting the flock were striped, speckled[b], and mottled.
translation:
  language: ta
  text: மந்தை இணைசேரும் காலத்தில் நான் கண்களை உயர்த்திக் கனவில் கண்டேன்; இதோ, மந்தையின்மேல் ஏறிக்கொண்டிருந்த ஆட்டுக்கடாக்கள் வரிகள் கொண்டவையாகவும்[a], புள்ளிகள் கொண்டவையாகவும், கலப்பு நிறமுடையவையாகவும்[b] இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வளைய வரிகளுடையவையாகவும்.” எபிரேயச் சொல் விலங்குகளின் உடலில் காணப்படும் பட்டை அல்லது வளையம்போன்ற குறிகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மருவிய நிறமுடையவையாகவும்.” இங்குள்ள மூன்று எபிரேயச் சொற்களும் வெவ்வேறு தோல் அல்லது உரோம நிறவடிவங்களைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: காலத்தில்
