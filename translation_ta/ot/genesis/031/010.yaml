- source_word: יַחֵם הַצֹּאן
  choice: மந்தை இனச்சேர்க்கை செய்த
  rationale: இனப்பெருக்கச் சூழலில் விலங்குகள் இணைசேர்வதைத் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது; கருத்தரித்தல் என்ற விளைவை முன்கூட்டியே கூறுவதில்லை.
- source_word: וָאֶשָּׂא עֵינַי
  choice: நான் என் கண்களை ஏறெடுத்துக்
  rationale: பார்வையை உயர்த்துதல் என்ற எபிரேய மரபுத்தொடரின் உருவகத் தன்மையைப் புரியக்கூடிய தமிழில் பாதுகாக்கிறது.
- source_word: וָאֵרֶא בַּחֲלוֹם
  choice: கனவில் பார்த்தேன்
  rationale: காட்சி கனவின் வழியாகக் காணப்பட்டது என்பதை இயல்பாகக் குறிக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீரெனக் கண்ணில் தோன்றும் காட்சிக்கு எபிரேயச் சொல் தரும் உயிரோட்டத்தையும் கவன ஈர்ப்பையும் காக்கிறது.
- source_word: הָעַתֻּדִים
  choice: ஆட்டுக்கடாக்கள்
  rationale: இனச்சேர்க்கையில் ஈடுபடும் ஆண் வெள்ளாடுகளைக் குறிக்கும் துல்லியமான, பொதுவாகப் புரியக்கூடிய தமிழ் சொல்.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: மந்தையின் மேல் ஏறிய
  rationale: இனச்சேர்க்கையைக் குறிக்கும் மூலமொழியின் நேரடியான உடற்காட்சியை மிகையாக விளக்காமல் பாதுகாக்கிறது.
- source_word: עֲקֻדִּים
  choice: வரியுடையவையாகவும்
  rationale: விலங்குகளின் உடலில் பட்டை அல்லது வளையம்போன்ற வரிக் குறிகள் இருப்பதை எளிய தமிழில் தெரிவிக்கிறது.
- source_word: נְקֻדִּים
  choice: புள்ளியுடையவையாகவும்
  rationale: தனித்தனிப் புள்ளிக் குறிகளைச் சுட்டி, அடுத்த நிறவடிவச் சொல்லிலிருந்து வேறுபடுத்துகிறது.
- source_word: וּבְרֻדִּים
  choice: பலநிறத் திட்டுகளுடையவையாகவும்
  rationale: ஒழுங்கற்ற கலப்பு நிறத் திட்டுகளைக் குறிக்கிறது; புள்ளியுடையவை என்ற முந்தைய சொல்லுடன் ஒன்றாக்காமல் தனித்த வடிவத்தைப் பேணுகிறது.
