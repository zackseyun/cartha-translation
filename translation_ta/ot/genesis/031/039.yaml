  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: טְרֵפָה֙ לֹא הֵבֵ֣אתִי אֵלֶ֔י/ךָ אָנֹכִ֣י אֲחַטֶּ֔/נָּה מִ/יָּדִ֖/י תְּבַקְשֶׁ֑/נָּה גְּנֻֽבְתִ֣י י֔וֹם וּ/גְנֻֽבְתִ֖י לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/039.yaml
  text: I did not bring to you an animal torn by beasts[a]; I myself bore the loss of it. You required it from my hand[b], whether stolen by day or stolen by night.
translation:
  language: ta
  text: காட்டு விலங்கால் கிழிக்கப்பட்ட எந்த மிருகத்தையும் நான் உம்மிடம் கொண்டுவரவில்லை; அதற்கான இழப்பை நானே ஏற்றுக்கொண்டேன்.[a] பகலில் திருடப்பட்டதையும் இரவில் திருடப்பட்டதையும் என்னிடமே நீர் ஈடுகேட்டீர்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதற்கு நானே ஈடுசெய்தேன்.” இங்குள்ள எபிரெய வினை, காணாமற்போன அல்லது அழிந்த மிருகத்துக்கான பொறுப்பை ஏற்று இழப்பை ஈடுசெய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, “என் கையிலிருந்து நீர் அதைக் கேட்டீர்.” இது ஒருவரை இழப்புக்குப் பொறுப்பாக்கி அவரிடமிருந்து ஈடு கோருவதைக் குறிக்கும் எபிரெய வழக்கு.
    reason: idiom
lexical_decisions:
- source_word: טְרֵפָה
  choice: காட்டு விலங்கால் கிழிக்கப்பட்ட எந்த மிருகத்தையும்
  rationale: மேய்ப்புச் சூழலில், காட்டு விலங்கால் தாக்கப்பட்டுக் கொல்லப்பட்ட கால்நடையை இச்சொல் குறிக்கிறது. தமிழில் பொருள் தெளிவாகவும் காட்சித் தன்மை காக்கப்படவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הֵבֵאתִי אֵלֶיךָ
  choice: நான் உம்மிடம் கொண்டுவரவில்லை
  rationale: ביא + אל என்பதன் நேரடிப் பொருளான ஒருவரிடம் ஒன்றைக் கொண்டுவருதல் என்பதைக் காக்கிறது. மறுப்பின் சூழலில் ‘எந்த மிருகத்தையும்’ என்பது இயல்பான தமிழ் வடிவம்.
- source_word: אָנֹכִי
  choice: நானே
  rationale: வினை வடிவத்திற்கு மேலாகத் தனிப்பெயர் சுட்டுப்பெயர் தரும் வலியுறுத்தலைத் தமிழின் ‘-ஏ’ விகுதி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲחַטֶּנָּה
  choice: அதற்கான இழப்பை நானே ஏற்றுக்கொண்டேன்
  rationale: இங்கு חטא என்பதன் பியேல் வடிவம் பாவம் செய்தல் என்பதைக் காட்டிலும் இழப்புக்குப் பொறுப்பேற்றல் அல்லது அதை ஈடுசெய்தல் என்ற மேய்ப்புத் தொழில் சார்ந்த பொருளைக் கொண்டுள்ளது.
- source_word: מִיָּדִי תְּבַקְשֶׁנָּה
  choice: என்னிடமே நீர் ஈடுகேட்டீர்
  rationale: ‘என் கையிலிருந்து’ என்ற எபிரெய வழக்கு தனிப்பட்ட பொறுப்பைக் குறிக்கிறது. சொற்சொல் வடிவத்தைவிட, அந்தப் பொறுப்பையும் பொருளாதாரக் கோரிக்கையையும் இயல்பான தமிழில் ‘என்னிடமே ஈடுகேட்டீர்’ எனக் கொடுக்கிறது.
- source_word: גְּנֻבְתִי יוֹם וּגְנֻבְתִי לָיְלָה
  choice: பகலில் திருடப்பட்டதையும் இரவில் திருடப்பட்டதையும்
  rationale: இரு இணையான சொற்றொடர்களையும் வாவ் இணைப்பையும் கூட்டுப் பொருளில் காக்கிறது; அவை ஈடுகேட்கப்பட்ட தனித்தனி இழப்புகளின் பொருள்களாகத் தெளிவாகின்றன.
