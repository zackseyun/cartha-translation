translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் உரையாடலுக்குரிய கண்ணியமான ‘உம்மிடம்/நீர்’ நடையிலும் அமைக்கப்பட்டுள்ளது. முதல் அரையடியில் வேட்டையாடப்பட்ட மிருக இழப்பும், அடுத்ததில் பகல் மற்றும் இரவுத் திருட்டுகளும் தனித்தனி பொறுப்புகளாகத் தெளிவுபடுத்தப்பட்டுள்ளன.
