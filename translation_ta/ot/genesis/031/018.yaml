  source_fidelity: 'The translation accurately represents the sequence and scope of the Hebrew: Jacob drives all his livestock and possessions, including the livestock/property acquired in Paddan-aram, with the purpose of going to his father Isaac. ‘ஓட்டிக்கொண்டு’ fits נהג in a livestock-moving context, and ‘கானான் நாட்டுக்கு’ properly preserves the directional force of אַרְצָה כְּנָעַן.'
  naturalness: The Tamil is clear, modern, and appropriately dignified. The dash-bounded repetition is somewhat dense, but this is a natural way to retain the Hebrew’s emphatic, appositional repetition without becoming opaque.
  terminology: ‘கால்நடைகள்,’ ‘உடைமைகள்,’ and ‘கால்நடைச் செல்வம்’ suitably distinguish livestock from broader movable possessions. ‘பத்தான் அராம்,’ ‘கானான்,’ and ‘ஈசாக்கு’ are appropriate Tamil transliterations. No theological terminology is at issue.
