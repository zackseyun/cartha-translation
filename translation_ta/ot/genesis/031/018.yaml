source:
  edition: WLC
  text: וַ/יִּנְהַ֣ג אֶת כָּל מִקְנֵ֗/הוּ וְ/אֶת כָּל רְכֻשׁ/וֹ֙ אֲשֶׁ֣ר רָכָ֔שׁ מִקְנֵה֙ קִנְיָנ֔/וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּ/פַדַּ֣ן אֲרָ֑ם לָ/ב֛וֹא אֶל יִצְחָ֥ק אָבִ֖י/ו אַ֥רְצָ/ה כְּנָֽעַן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/018.yaml
  text: And he drove all his livestock and all his possessions that he had acquired—the livestock he had acquired in Paddan-aram—to go to Isaac his father in the land of Canaan[a].
translation:
  language: ta
  text: அவன் தன் கால்நடைகள் அனைத்தையும், தான் சேர்த்திருந்த உடைமைகள் அனைத்தையும்—பத்தான் அராமில் தான் பெற்றிருந்த கால்நடைச் செல்வத்தையும்—ஓட்டிக்கொண்டு, கானான் நாட்டுக்குத் தன் தந்தை ஈசாக்கிடம் செல்வதற்காகப் புறப்பட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடர் கானானை நோக்கிய இயக்கத்தைக் காட்டுகிறது; இதை ‘கானான் நாட்டை நோக்கி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנְהַג
  choice: ஓட்டிக்கொண்டு ... புறப்பட்டான்
  rationale: נהג இங்கு கால்நடைகளை முன்னோக்கி ஓட்டிச் செல்வதைக் குறிக்கிறது. நோக்கத்தைக் காட்டும் לָבוֹא என்பதுடன் இணைந்து தமிழில் இயல்பாக அமைய இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: מִקְנֵהוּ
  choice: தன் கால்நடைகள் அனைத்தையும்
  rationale: מִקְנֶה என்பது மாடுகள் மட்டும் அல்லாமல் வளர்ப்பு விலங்குகள் அனைத்தையும் கூட்டாகக் குறிக்கக்கூடும்; ‘கால்நடைகள்’ அந்த விரிவைத் தக்கவைக்கிறது.
- source_word: רְכֻשׁוֹ
  choice: தான் சேர்த்திருந்த உடைமைகள்
  rationale: רְכוּשׁ என்பது ஒருவருக்குச் சொந்தமான பொருட்களையும் செல்வத்தையும் விரிவாகக் குறிக்கிறது; நவீன தமிழில் ‘உடைமைகள்’ தெளிவான பொதுச்சொல்.
- source_word: רָכָשׁ
  choice: சேர்த்திருந்த / பெற்றிருந்த
  rationale: רכש என்பதன் ‘பெறு, சேர்த்துக்கொள்’ என்ற பொருளை இரு இயல்பான தமிழ் சொற்களால் வெளிப்படுத்துகிறது; எபிரெய மூலத்தின் கருத்து மீளுரைப்பும் ஓரளவு பாதுகாக்கப்படுகிறது.
- source_word: מִקְנֵה קִנְיָנוֹ
  choice: கால்நடைச் செல்வம்
  rationale: இச்சொற்றொடர் அவன் தனக்கெனப் பெற்ற கால்நடை உடைமையை வலியுறுத்துகிறது. ‘கால்நடைச் செல்வம்’ பொருளாதார மதிப்பையும் கூட்டுப் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּפַדַּן אֲרָם
  choice: பத்தான் அராமில்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לָבוֹא אֶל יִצְחָק אָבִיו
  choice: தன் தந்தை ஈசாக்கிடம் செல்வதற்காக
  rationale: לָבוֹא நோக்கத்தைக் குறிக்கும் வினையெச்சம்; இலக்கு ஈசாக்கு என்பதையும் உறவையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אַרְצָה כְּנָעַן
  choice: கானான் நாட்டுக்கு
  rationale: திசை அல்லது இலக்கைச் சுட்டும் ־ָה வடிவத்தைத் தமிழின் ‘-க்கு’ வேற்றுமை உருபு நேரடியாக வெளிப்படுத்துகிறது.
