translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உடைமையையும் கால்நடைச் செல்வத்தையும் குறிக்கும் மீளுரை முற்றிலும் சீராக்கப்படாமல், இடைக்கோடுகளுக்குள் இயல்பாகத் தக்கவைக்கப்பட்டுள்ளது.
