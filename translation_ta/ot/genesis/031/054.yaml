  text: וַ/יִּזְבַּ֨ח יַעֲקֹ֥ב זֶ֨בַח֙ בָּ/הָ֔ר וַ/יִּקְרָ֥א לְ/אֶחָ֖י/ו לֶ/אֱכָל לָ֑חֶם וַ/יֹּ֣אכְלוּ לֶ֔חֶם וַ/יָּלִ֖ינוּ בָּ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/054.yaml
  text: Then Jacob offered a sacrifice on the mountain and called his brothers to eat bread[a]. They ate bread and spent the night on the mountain.
translation:
  language: ta
  text: பின்பு யாக்கோபு மலையின்மேல் ஒரு பலியைச் செலுத்தி, அப்பம் உண்பதற்காகத் தன் சகோதரர்களை[a] அழைத்தான். அவர்கள் அப்பம் உண்டு, மலையின்மேல் இரவைக் கழித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் உறவினர்களை.” இங்கு “சகோதரர்கள்” என்பதற்கான எபிரெயச் சொல், சூழலின்படி ஆண் உறவினர்களையோ உடன் இருந்தவர்களையோ விரிவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח ... זֶבַח
  choice: ஒரு பலியைச் செலுத்தி
  rationale: எபிரெய வினைச்சொல்லும் பெயர்ச்சொல்லும் ஒரே வேரிலிருந்து வந்து பலியிடும் செயலை வலியுறுத்துகின்றன. தமிழில் இயல்பற்ற மறுபடியுரைத்தலைத் தவிர்த்து, வழிபாட்டுச் சார்ந்த பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: בָּהָר
  choice: மலையின்மேல்
  rationale: הַר என்பதன் அடிப்படைப் பொருளான ‘மலை’ என்பதையும், இடத்தைக் குறிக்கும் முன்னொட்டையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וַיִּקְרָא
  choice: அழைத்தான்
  rationale: קרא என்பதன் ‘அழைத்தல்’ என்ற நேரடிப் பொருளைத் தக்கவைக்கிறது; இச்சூழலில் உணவுக்கான அழைப்பாகவும் இயல்பாகப் புரிகிறது.
- source_word: לְאֶחָיו
  choice: தன் சகோதரர்களை
  rationale: אָח என்ற மூலத்தின் குடும்ப உறவுச் சொல்லைத் தக்கவைக்கிறது; இங்கு அதன் பொருள் உடன்பிறந்தவர்களைத் தாண்டி விரிவாக இருக்கக்கூடும் என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: לֶאֱכָל לָחֶם / וַיֹּאכְלוּ לֶחֶם
  choice: அப்பம் உண்பதற்காக / அப்பம் உண்டு
  rationale: ‘அப்பம் உண்ணுதல்’ என்ற எபிரெய சொற்றொடரையும் அதன் மறுபடியுரைத்தலையும் காக்கிறது; இது பொதுவாக உணவருந்துவதையும் குறிக்கலாம்.
- source_word: וַיָּלִינוּ
  choice: இரவைக் கழித்தார்கள்
  rationale: அங்கே இரவு தங்கியதை நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் ‘அவனுடைய சகோதரர்கள்’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘தன் சகோதரர்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: தன் உறவினர்கள்; தன்னுடன் இருந்த ஆண்கள்
  rationale: எபிரெயச் சொல் உடன்பிறந்த சகோதரர்களை மட்டுமல்லாமல் ஆண் உறவினர்களையோ குழுவைச் சேர்ந்தவர்களையோ குறிக்கலாம். இருப்பினும் மூலத்தின் குடும்ப உறவுச் சொல்லையும் அதன் உண்மையான பொருள் விரிவையும் முறையே முதன்மை உரையிலும் அடிக்குறிப்பிலும் காக்கிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்பம் உண்டு’ என்ற மூலமொழிச் சொற்றொடரும் அதன் இருமுறை பயன்பாடும் பாதுகாக்கப்பட்டுள்ளன; ‘ஒரு பலியைச் செலுத்தி’ என்பது எபிரெயத்தின் பலியிடும் பொருளை இயல்பான தமிழில் தருகிறது.
