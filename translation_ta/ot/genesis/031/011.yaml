  text: וַ/יֹּ֨אמֶר אֵלַ֜/י מַלְאַ֧ךְ הָ/אֱלֹהִ֛ים בַּ/חֲל֖וֹם יַֽעֲקֹ֑ב וָ/אֹמַ֖ר הִנֵּֽנִ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/011.yaml
  text: Then the angel of God said to me in the dream[a], ‘Jacob,’ and I said, ‘Here I am.’
translation:
  language: ta
  text: அப்போது தேவனுடைய தூதன் அந்தக் கனவில்[a] என்னிடம், “யாக்கோபே!” என்றார்; நான், “இதோ, நான் இருக்கிறேன்” என்றேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு கனவில்.” எபிரெயத்தில், “அந்தக் கனவில்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வய்யிக்தோல் வடிவம் நிகழ்வின் தொடர்ச்சியை முன்னெடுக்கிறது; ‘அப்போது’ என்பதைப் பயன்படுத்துவது அந்த வரிசையை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: אֵלַי
  choice: என்னிடம்
  rationale: முன்னிடைச்சொல்லையும் முதலாம் நபர் ஒருமை பின்னொட்டையும் நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: தேவதூதர்
  rationale: இச்சூழலில் பரலோகத் தூதரைக் குறிக்கிறது. தமிழ் வேதாகம நடையில் ‘தேவதூதர்’ என்பது ‘தேவனுடைய தூதர்’ என்ற பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது; அந்தத் தூதரின் அடையாளத்தைப் பற்றிய மேலதிக இறையியல் முடிவைத் திணிக்கவில்லை.
- source_word: בַּחֲלוֹם
  choice: அந்தக் கனவில்
  rationale: எபிரெயத்தில் உள்ள சுட்டிய artikல் குறிப்பிட்ட கனவைக் காட்டுவதால் ‘அந்தக் கனவில்’ என மொழிபெயர்க்கப்பட்டது; தமிழில் இது இயல்பாகவும் வடிவத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: יַעֲקֹב
  choice: யாக்கோபே
  rationale: பெயர் வழக்கமான தமிழாக்கத்தில் தரப்பட்டு, நேரடி அழைப்பைக் காட்ட அழைப்புவேற்றுமை ‘-ஏ’ சேர்க்கப்பட்டது.
- source_word: וָאֹמַר
  choice: அதற்கு நான் ... என்றேன்
  rationale: முதலாம் நபர் உரைத் தொடரை இயல்பாகக் காட்டுகிறது; ‘அதற்கு’ என்பது பதிலுரையின் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: הִנֵּנִי
  choice: இதோ, நான் இருக்கிறேன்
  rationale: அழைப்புக்குப் பதிலாகத் தன்னை முன்வைக்கும் எபிரெயச் சொல்லாக்கத்தின் கவன ஈர்ப்பையும் பதிலளிக்கும் வலிமையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: מַלְאַךְ הָאֱלֹהִים என்பவரைத் தெய்வீக நபருடன் அடையாளப்படுத்தக்கூடிய சூழல்
  choice: தேவதூதர்
  alternative: தேவனுடைய தூதர் / இறைத்தூதர்
  rationale: வசனம் அந்த உருவை தேவனுடைய தூதர் என மட்டுமே குறிப்பிடுகிறது. அவருடைய அடையாளத்தைப் பற்றிய விரிவான இறையியல் கேள்வியைத் தீர்மானிக்காமல், மூலத்தின் பெயரிடலை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம உரைநடை. உரையாடல் இயல்பாக அமைக்கப்பட்டாலும் எபிரெயத்தின் குறிப்பிட்ட சுட்டும், அழைப்பும், பதிலுரையும் பாதுகாக்கப்பட்டுள்ளன.
