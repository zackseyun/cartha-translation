    issue: ‘ஓட்டிக்கொண்டு வந்தாய்’ adds a directional nuance.
    rationale: וַתְּנַהֵג means ‘you drove/led’; it does not specify movement toward the speaker’s present location. In context Laban accuses Jacob of taking his daughters away, so ‘ஓட்டிக்கொண்டு சென்றாய்’ is the faithful Tamil phrasing.
