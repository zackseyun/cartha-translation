source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָבָן֙ לְ/יַעֲקֹ֔ב מֶ֣ה עָשִׂ֔יתָ וַ/תִּגְנֹ֖ב אֶת לְבָבִ֑/י וַ/תְּנַהֵג֙ אֶת בְּנֹתַ֔/י כִּ/שְׁבֻי֖וֹת חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/026.yaml
  text: Then Laban said to Jacob[a], “What have you done[c][b], that you have stolen my heart and driven my daughters away like captives of the sword?”
translation:
  language: ta
  text: அப்போது லாபான் யாக்கோபிடம், “நீ என்ன செய்துவிட்டாய்? என்னை ஏமாற்றி, என் மகள்களை வாளால் சிறைபிடிக்கப்பட்ட பெண்களைப்போல் ஏன் ஓட்டிக்கொண்டு சென்றாய்?” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: நீ என்ன செய்துவிட்டாய்?
  rationale: குற்றஞ்சாட்டும் வினாவின் வலிமையையும், செய்து முடிக்கப்பட்ட செயலின் தற்போதைய விளைவையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַתִּגְנֹב אֶת לְבָבִי
  choice: என்னை ஏமாற்றி
  rationale: எபிரெய மொழித்தொடரின் சூழல்சார் பொருள் மறைவாகச் செயல்பட்டு ஒருவரை ஏமாற்றுதல் என்பதாகும். ‘என் இதயத்தைத் திருடி’ என்பது தமிழில் காதல் சார்ந்த தவறான பொருளைத் தரக்கூடும்; சொல்லுக்கு சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַתְּנַהֵג
  choice: ஓட்டிக்கொண்டு வந்தாய்
  rationale: נהג என்பதில் வழிநடத்துவதைக் காட்டிலும் வற்புறுத்தி ஓட்டிச் செல்லும் நுண்பொருள் உள்ளது. பேச்சாளரான லாபான் எதிரே நிற்கும் இடத்திற்கே அவர்கள் வந்திருப்பதால், தமிழில் ‘வந்தாய்’ இயல்பாக அமைகிறது.
- source_word: בְּנֹתַי
  choice: என் மகள்களை
  rationale: முதலாம் நபர் உடைமைப் பன்மையை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: כִּשְׁבֻיוֹת חָרֶב
  choice: வாளால் சிறைபிடிக்கப்பட்ட பெண்களைப்போல்
  rationale: שְׁבֻיוֹת என்பதன் பெண்பால் பன்மையை ‘பெண்கள்’ என்று வெளிப்படுத்தி, חָרֶב தரும் போர் மற்றும் வன்முறைப் படிமத்தை ‘வாளால்’ என்று தக்கவைக்கிறது.
theological_decisions: []
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. லாபானின் கடுமையான குற்றச்சாட்டும் போர்க்கைதிகளின் வன்முறைப் படிமமும் தக்கவைக்கப்பட்டுள்ளன; இலக்கு மொழியில் தவறான காதல் சார்ந்த பொருளை ஏற்படுத்தக்கூடிய எபிரெய மொழிமரபு முதன்மை உரையில் பொருள்பட மொழிபெயர்க்கப்பட்டு, அதன் நேரடி வடிவம் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
