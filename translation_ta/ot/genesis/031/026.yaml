- from: அப்போது லாபான் யாக்கோபிடம், “நீ என்ன செய்துவிட்டாய்? என்னை ஏமாற்றி[a], என் மகள்களை வாளால் சிறைபிடிக்கப்பட்ட பெண்களைப்போல் ஏன் ஓட்டிக்கொண்டு வந்தாய்?” என்றான்.
  to: அப்போது லாபான் யாக்கோபிடம், “நீ என்ன செய்துவிட்டாய்? என்னை ஏமாற்றி, என் மகள்களை வாளால் சிறைபிடிக்கப்பட்ட பெண்களைப்போல் ஏன் ஓட்டிக்கொண்டு சென்றாய்?” என்றான்.
