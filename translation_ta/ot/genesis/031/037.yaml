source:
  edition: WLC
  text: כִּֽי מִשַּׁ֣שְׁתָּ אֶת כָּל כֵּלַ֗/י מַה מָּצָ֨אתָ֙ מִ/כֹּ֣ל כְּלֵי בֵיתֶ֔/ךָ שִׂ֣ים כֹּ֔ה נֶ֥גֶד אַחַ֖/י וְ/אַחֶ֑י/ךָ וְ/יוֹכִ֖יחוּ בֵּ֥ין שְׁנֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/037.yaml
  text: Since you have searched through all my goods[a], what have you found of all the goods of your house? Set it here before my brothers and your brothers[b], and let them judge between the two of us.
translation:
  language: ta
  text: நீ என் பொருள்களையெல்லாம் துழாவித் தேடியிருக்கிறாயே; உன் வீட்டுக்குரிய பொருள்களில் எதைக் கண்டுபிடித்தாய்? அதை இங்கே என் உறவினர்களுக்கும் உன் உறவினர்களுக்கும் முன்பாக வை; அவர்கள் நம் இருவருக்கும் இடையில் தீர்ப்பளிக்கட்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשַּׁשְׁתָּ
  choice: துழாவித் தேடியிருக்கிறாயே
  rationale: இந்த வினைச்சொல் அடிப்படையில் தொட்டுத் தடவிப் பார்ப்பதைக் குறித்தாலும், இச்சூழலில் பொருள்களை முழுமையாகச் சோதித்துத் தேடுவதைக் குறிக்கிறது. ‘துழாவித் தேடு’ அதன் உடல்சார்ந்த வலிமையையும் தீவிரமான தேடலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל כֵּלַי
  choice: என் பொருள்களையெல்லாம்
  rationale: כְּלִי என்பது பாத்திரம், கருவி, உடைமைப் பொருள் எனப் பலவகைப் பொருள்களைக் குறிக்கலாம். இவ்வீட்டு உடைமைச் சூழலில் ‘பொருள்கள்’ என்பது தேவையற்ற குறுக்கமின்றி பரந்த பொருளைத் தருகிறது.
- source_word: מִכֹּל כְּלֵי בֵיתֶךָ
  choice: உன் வீட்டுக்குரிய பொருள்களில்
  rationale: 'מִן இங்கு பகுதியைக் குறிக்கும் பொருளில் வருகிறது: லாபானின் வீட்டுக்குரிய பொருள்களில் எது கண்டுபிடிக்கப்பட்டது என்பதே கேள்வி. ‘வீட்டுக்குரிய’ என்பது உடைமையைத் தெளிவாக்குகிறது.'
- source_word: אַחַי וְאַחֶיךָ
  choice: என் உறவினர்களுக்கும் உன் உறவினர்களுக்கும்
  rationale: אָחִים என்பதன் அடிப்படைப் பொருள் ‘சகோதரர்கள்’ என்றாலும், இக்கதைத்தொடரில் அது உடன் வந்த குலத்தாரையும் உறவினர்களையும் குறிக்கிறது. ‘உறவினர்கள்’ சூழலுக்குரிய விரிந்த பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: וְיוֹכִיחוּ
  choice: அவர்கள் ... தீர்ப்பளிக்கட்டும்
  rationale: יכח என்பதன் ஹிஃபில் வடிவம் இங்கு இரு தரப்பினருக்கிடையிலான வழக்கை விசாரித்துத் தீர்மானிக்கும் நீதிசார் பொருளைக் கொண்டுள்ளது. ‘தீர்ப்பளிக்கட்டும்’ அந்த நடுவர் சார்ந்த வலிமையைப் பாதுகாக்கிறது.
- source_word: בֵּין שְׁנֵינוּ
  choice: நம் இருவருக்கும் இடையில்
  rationale: எபிரெய உரை இரு தரப்பினரையும் வெளிப்படையாகச் சுட்டுகிறது; ‘நம் இருவருக்கும் இடையில்’ அந்த வலியுறுத்தலை அப்படியே காக்கிறது.
