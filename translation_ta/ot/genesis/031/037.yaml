translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியான, கண்ணியமான வாக்கியநடை பயன்படுத்தப்பட்டுள்ளது. யாக்கோபின் சவாலான பேச்சுத் தொனியை ‘தேடியிருக்கிறாயே’ என்பதும் கட்டளை வடிவங்களும் காக்கின்றன; தேவையற்ற சமயவழக்குச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
