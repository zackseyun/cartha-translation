  yaml_path: translation/ot/genesis/031/048.yaml
  text: And Laban said[a], “This heap is a witness between me and you today.” Therefore he called its name Galeed.
translation:
  language: ta
  text: லாபான், “இந்தக் குவியல் இன்று எனக்கும் உனக்கும் இடையே சாட்சியாக இருக்கிறது” என்றான். அதனால் அவன் அதற்கு கலேயேத்[a] என்று பெயரிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கலேயேத்” என்பது “சாட்சியின் குவியல்” எனப் பொருள்படும் எபிரெயப் பெயர்.
    reason: பெயருக்கும் ‘குவியல்’ மற்றும் ‘சாட்சி’ என்ற எபிரெயச் சொற்களுக்கும் இடையிலுள்ள சொல்விளையாட்டைத் துல்லியமாக விளக்குகிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: தொடர்கதை நகர்வைக் குறிக்கும் வாவ் தொடரமைப்பைத் தமிழின் இயல்பான உரையாடல் முடிப்பு வெளிப்படுத்துகிறது.
- source_word: לָבָן
  choice: லாபான்
  rationale: தனிப்பெயர் மொழிபெயர்க்கப்படாமல், தமிழில் வழக்கமான வடிவில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַגַּל הַזֶּה
  choice: இந்தக் குவியல்
  rationale: இந்தச் சூழலில் גַּל என்பது கற்களைக் குவித்த குவியலைக் குறிக்கிறது; ‘குவியல்’ இயல்பான, தெளிவான தமிழ்ச் சொல்.
- source_word: עֵד
  choice: சாட்சியாக
  rationale: இந்தக் குவியல் இரு தரப்பினருக்கும் இடையிலான உடன்பாட்டிற்குச் சான்றாகச் செயல்படுவதை இச்சொல் வெளிப்படுத்துகிறது.
- source_word: בֵּינִי וּבֵינְךָ
  choice: எனக்கும் உனக்கும் இடையே
  rationale: எபிரெய உரை இரு நபர்களையும் ஒருமையில் நேரடியாகக் குறிப்பிடுவதைத் தக்கவைக்கிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: காலக் குறிப்பை எளிய நவீன தமிழில் நேரடியாகக் கொடுக்கிறது.
- source_word: עַל כֵּן
  choice: அதனால்
  rationale: பெயரிடுவதற்கான காரணத் தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: קָרָא שְׁמוֹ
  choice: அதற்கு ... என்று பெயரிட்டான்
  rationale: எபிரெயப் பெயரிடும் மரபுத்தொடரின் பொருளை இயல்பான தமிழில் வழங்குகிறது; வினையின் ஒருமை ஆண்பால் வடிவுக்கு ஏற்ப லாபானே எழுவாயாகத் தொடர்கிறான்.
- source_word: גַּלְעֵד
  choice: கலேயேத்
  rationale: பெயர் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது; அதிலுள்ள சொல்விளையாட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
