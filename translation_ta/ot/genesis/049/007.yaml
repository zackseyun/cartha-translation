source:
  edition: WLC
  text: אָר֤וּר אַפָּ/ם֙ כִּ֣י עָ֔ז וְ/עֶבְרָתָ֖/ם כִּ֣י קָשָׁ֑תָה אֲחַלְּקֵ֣/ם בְּ/יַעֲקֹ֔ב וַ/אֲפִיצֵ֖/ם בְּ/יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/007.yaml
  text: Cursed be their anger[a], for it is fierce, and their wrath, for it is harsh. I will divide them in Jacob and scatter them in Israel.
translation:
  language: ta
  text: அவர்களுடைய கோபம் சபிக்கப்படட்டும்[a]; ஏனெனில் அது கடுமையானது. அவர்களுடைய சீற்றமும் சபிக்கப்படட்டும்; ஏனெனில் அது கடுமையானது. யாக்கோபில் அவர்களைப் பிரிப்பேன்; இஸ்ரவேலில் அவர்களைச் சிதறடிப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அவர்களுடைய கோபம் சபிக்கப்பட்டது … அவர்களுடைய சீற்றமும் சபிக்கப்பட்டது.”'
    reason: אָרוּר என்பதை சாப அறிவிப்பாக ‘சபிக்கப்படட்டும்’ என்றும், நிலையை அறிவிக்கும் வகையில் ‘சபிக்கப்பட்டது’ என்றும் புரிந்துகொள்ள இயலும்.
lexical_decisions:
- source_word: אָרוּר
  choice: சபிக்கப்படட்டும்
  rationale: சாப அறிவிப்பின் வலிமையையும், சாபம் சகோதரர்கள் மீது நேரடியாக அல்லாமல் அவர்களுடைய கோபம் மற்றும் சீற்றத்தின் மீது விழுவதையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אַפָּם
  choice: அவர்களுடைய கோபம்
  rationale: ‘மூக்கு/நாசி’ என்ற சொற்பிறப்புச் சித்திரத்தை விட, இங்கு உள்ள எபிரெய மொழிவழக்கின் பொருளான கோபத்தை இயல்பான தமிழில் தருகிறது.
- source_word: עָז
  choice: கடுமையானது
  rationale: கோபத்தின் தீவிரத்தையும் வன்மையான வலிமையையும் குறிக்கிறது; வெறும் உடல் வலிமை என்ற தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: וְעֶבְרָתָם
  choice: அவர்களுடைய சீற்றம்
  rationale: பொங்கி வழியும் உக்கிரத்தை உணர்த்தி, முதல் அடியிலுள்ள ‘கோபம்’ என்பதிலிருந்து கவிதைநயமான வேறுபாட்டையும் பேணுகிறது.
- source_word: קָשָׁתָה
  choice: கொடியது
  rationale: அடிப்படையான ‘கடினம்/கடுமை’ என்ற கருத்தை இச்சூழலில் வன்முறையுடன் கூடிய இரக்கமற்ற சீற்றமாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲחַלְּקֵם
  choice: அவர்களைப் பிரிப்பேன்
  rationale: அடுத்துள்ள ‘சிதறடிப்பேன்’ என்பதிலிருந்து வினைச்சொல் வேறுபாட்டைப் பேணி, யாக்கோபின் மக்களுக்குள் அவர்களைப் பகுத்துவைப்பதை நேரடியாகக் கூறுகிறது.
- source_word: בְּיַעֲקֹב
  choice: யாக்கோபில்
  rationale: யாக்கோபின் வழிவந்த மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் மூலத்தின் உருவகத்தையும், ‘இஸ்ரவேலில்’ என்பதுடனான இணை அமைப்பையும் பேணுகிறது.
- source_word: וַאֲפִיצֵם
  choice: அவர்களைச் சிதறடிப்பேன்
  rationale: பரவச் செய்வது என்ற காரணவினைப் பொருளையும் தண்டனைத் தோற்றத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: தேசத்தைக் குறிக்கும் இரண்டாவது பெயரை அப்படியே வைத்து, யாக்கோபு/இஸ்ரவேல் என்ற எபிரெயக் கவிதை இணைநிலையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: சாபத்தின் இலக்கு
  choice: சாபம் சிமியோன் மற்றும் லேவியின் நபர்கள்மீது நேரடியாக அல்லாமல் அவர்களுடைய கோபம் மற்றும் சீற்றத்தின் மீது அறிவிக்கப்படுகிறது.
  alternative: சகோதரர்களே நேரடியாகச் சபிக்கப்படுகிறார்கள்.
  rationale: எபிரெய உரை ‘அவர்களுடைய கோபம்’ மற்றும் ‘அவர்களுடைய சீற்றம்’ என்பவற்றையே இலக்கணரீதியாகச் சாபத்தின் பொருள்களாக வைக்கிறது; அந்த முக்கிய வேறுபாடு மொழிபெயர்ப்பில் பாதுகாக்கப்படுகிறது.
- issue: இரண்டாம் கூறில் சாப வினையின் மீளுரைத்தல்
  choice: தமிழில் தெளிவுக்காக ‘சபிக்கப்படட்டும்’ என்பதை இரண்டாம் கூறிலும் வெளிப்படையாக மீளுரைத்தல்.
  alternative: ‘அவர்களுடைய சீற்றமோ, அது கொடியது’ என்று வினையை மறைமுகமாகப் புரியவைத்தல்.
  rationale: எபிரெயக் கவிதையில் אָרוּר இரு பெயர்ச்சொற்களையும் ஆளுகிறது. தமிழில் வினையை மீளுரைப்பது சாபம் கோபத்துக்கும் சீற்றத்துக்கும் உரியது என்பதைத் தெளிவாக்குகிறது; புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைநயமும் தீர்ப்புரையின் கண்ணியமான தொனியும் பேணப்பட்டுள்ளன. ‘யாக்கோபில் / இஸ்ரவேலில்’ என்ற மூலத்தின் இணை அமைப்பு சுருக்கப்படாமல் வைக்கப்பட்டுள்ளது. ‘கடுமையானது / கொடியது’ என்ற வேறுபாடு עָז மற்றும் קָשָׁתָה ஆகியவற்றின் தனித்த நுணுக்கங்களை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
