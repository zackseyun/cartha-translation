base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/008.yaml
  text: Judah[a], your brothers will praise you; your hand will be on the neck of your enemies[b]; the sons of your father will bow down to you.
translation:
  language: ta
  text: 'யூதாவே,[a] உன் சகோதரர்கள் உன்னைப் புகழ்வார்கள்;

    உன் கை உன் பகைவர்களின் பிடரியின்மேல் இருக்கும்;

    உன் தந்தையின் மகன்கள் உனக்குப் பணிவார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உனக்கு நன்றி செலுத்துவார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை நன்றி செலுத்துதல், அறிக்கையிடுதல் அல்லது புகழ்தல் ஆகிய பொருள்களைக் கொண்டிருக்கலாம்; இங்கு ஆசீர்வாதச் சூழலுக்கும் “யூதா” என்ற பெயருடனான சொல்விளையாட்டுக்கும் “புகழ்வார்கள்” மிகவும் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: யூதாவே
  rationale: முறையான தமிழ் வேதாகமப் பெயர் வடிவத்தை விளிவேற்றுமையுடன் பயன்படுத்துவது நேரடி அழைப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יוֹדוּךָ
  choice: உன்னைப் புகழ்வார்கள்
  rationale: இங்கு ידה வினை புகழ்தல் அல்லது மதிப்புடன் ஏற்றுக்கொள்ளுதல் என்ற பொருளைத் தருகிறது. ஆசீர்வாதச் சூழலுக்கும் யூதா என்ற பெயருடனான சொல்விளையாட்டுக்கும் ‘புகழ்வார்கள்’ பொருந்துகிறது; ‘நன்றி செலுத்துவார்கள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אַחֶיךָ
  choice: உன் சகோதரர்கள்
  rationale: எபிரெய ஆண்பால் பன்மையையும் யாக்கோபின் மகன்களாகிய உடனடிக் குடும்பச் சூழலையும் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: יָדְךָ
  choice: உன் கை
  rationale: ஆற்றல் மற்றும் வெற்றியாதிக்கத்தைக் குறிக்கும் திடமான மூலமொழிப் படிமத்தை அப்படியே பாதுகாக்கிறது.
- source_word: בְּעֹרֶף אֹיְבֶיךָ
  choice: உன் பகைவர்களின் பிடரியின்மேல்
  rationale: עֹרֶף என்பது கழுத்தின் பின்புறம் அல்லது பிடரியைக் குறிக்கும். ‘பிடரி’ வென்று அடக்குதலின் மூலப் படிமத்தைத் தமிழில் தெளிவாகக் காக்கிறது.
- source_word: יִשְׁתַּחֲווּ לְךָ
  choice: உன்னைப் பணிந்துகொள்வார்கள்
  rationale: வணக்கமாகக் குனிந்து கீழ்ப்படிதல் அல்லது மரியாதை செலுத்துதல் என்ற மனித அரசமரியாதைச் சூழலை இது தெரிவிக்கிறது; தெய்வ வழிபாடு என்ற பொருளைத் தேவையின்றி சேர்ப்பதில்லை.
- source_word: בְּנֵי אָבִיךָ
  choice: உன் தந்தையின் மகன்கள்
  rationale: ‘உன் தந்தையின் மகன்கள்’ என்ற மூலமொழியின் குடும்ப உறவுச் சொல்லாக்கத்தை வெளிப்படையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יִשְׁתַּחֲווּ לְךָ என்பதிலுள்ள பணிவு/வணக்க மொழியின் பொருள்
  choice: மனிதத் தலைவருக்கு மரியாதையுடனும் கீழ்ப்படிதலுடனும் பணிதல்
  alternative: தெய்வத்துக்குரிய வழிபாடு
  rationale: யாக்கோபின் ஆசீர்வாதத்தில் யூதா நோக்கி சகோதரர்கள் பணிவதே உடனடிச் சூழல். ஆகவே அரச மரியாதை மற்றும் கீழ்ப்படிதலின் நுணுக்கத்தைப் பாதுகாத்து, வசனம் நேரடியாகக் கூறாத தெய்வ வழிபாட்டுப் பொருளைச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிடரி’ மூலமொழியின் வெற்றியாதிக்கப் படிமத்தைத் தெளிவாகக் காக்கிறது; ‘பணிந்துகொள்வார்கள்’ வழிபாடு என்ற தேவையற்ற இறையியல் முடிவைத் தவிர்த்து மரியாதை மற்றும் கீழ்ப்படிதலை வெளிப்படுத்துகிறது.
