base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/002.yaml
  text: Gather yourselves and listen[a], sons of Jacob; listen to Israel your father.
translation:
  language: ta
  text: ஒன்றுகூடுங்கள்; கேளுங்கள், யாக்கோபின் மகன்களே; உங்கள் தந்தையான இஸ்ரவேலுக்குச் செவிகொடுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒன்றுகூடுங்கள்; கேளுங்கள், யாக்கோபின் மகன்களே; உங்கள் தந்தையான இஸ்ரவேலைக் கேளுங்கள்.” எபிரெயத்தில் “கேளுங்கள்” என்ற கட்டளை வலியுறுத்தலுக்காக இருமுறை வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקָּבְצוּ
  choice: ஒன்றுகூடி
  rationale: நிபால் பன்மை ஏவல் வடிவம் மகன்கள் அனைவரும் ஒரே இடத்தில் கூடிவருமாறு அழைக்கிறது. இயல்பான நவீன தமிழில் ‘ஒன்றுகூடி’ இந்தக் கூட்டுச் செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: שִׁמְעוּ
  choice: கேளுங்கள்
  rationale: இங்கு வெறுமனே ஒலி கேட்பதை அல்ல, கவனத்துடன் கேட்பதைக் கட்டளையிடுகிறது. முதற்கட்ட அழைப்பில் ‘கேளுங்கள்’ இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: בְּנֵי יַעֲקֹב
  choice: யாக்கோபின் மகன்களே
  rationale: எபிரெயச் சொற்றொடர் ஆண்பால் பன்மையில் யாக்கோபின் மகன்களை நேரடியாக அழைக்கிறது; அழைப்புவேற்றுமை தமிழில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
- source_word: שִׁמְעוּ אֶל
  choice: செவிகொடுங்கள்
  rationale: மீண்டும் வரும் கட்டளையையும் אֶל உடனான ‘ஒருவரை நோக்கிக் கேட்பது’ என்ற பொருளையும், கவனித்து ஏற்றுக்கொள்ளும் நுணுக்கத்தையும் ‘செவிகொடுங்கள்’ வெளிப்படுத்துகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: யாக்கோபின் மற்றொரு பெயரான இஸ்ரவேல் தனித்தே வைக்கப்படுகிறது; கவிதை இணைப்பில் வரும் இரு பெயர்களும் ஒன்றாக்கப்படவில்லை.
- source_word: אֲבִיכֶם
  choice: உங்கள் தந்தையாகிய
  rationale: இஸ்ரவேல் என்பவர் பேசப்படுகிற மகன்களின் தந்தை என்பதை தமிழில் இயல்பான இணைப்புச் சொல்லால் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: யாக்கோபு / இஸ்ரவேல் என்ற இணையான இரு பெயர்கள்
  choice: ‘யாக்கோபின் மகன்களே ... உங்கள் தந்தையாகிய இஸ்ரவேல்’ என்று இரு பெயர்களையும் தனித்தனியே வைத்தல்
  alternative: வாசிப்பு எளிமைக்காக இரண்டு இடங்களிலும் ஒரே பெயரைப் பயன்படுத்துதல்
  rationale: மூல எபிரெயம் இரு பெயர்களையும் திட்டமிட்டு இணையாகப் பயன்படுத்துகிறது. அதன் கவிதை வலியுறுத்தலையும் உடன்படிக்கை சார்ந்த ஒலிப்பையும் மொழிபெயர்ப்பு சமப்படுத்தாமல் பாதுகாக்கிறது.
- issue: שִׁמְעוּ என்ற கட்டளையின் இருமுறை பயன்பாடு
  choice: இரு கட்டளைகளையும் ‘கேளுங்கள் ... செவிகொடுங்கள்’ என்று வெளிப்படையாகப் பாதுகாத்தல்
  alternative: தமிழில் சுருக்கமாக ஒரே கட்டளையாக மாற்றுதல்
  rationale: கட்டளையின் மறுபயன்பாடு வலியுறுத்தலுக்குரியது; அதை நீக்குவது மூலத்தின் உரையாடல் அழுத்தத்தைக் குறைக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘கேளுங்கள்’ மற்றும் ‘செவிகொடுங்கள்’ ஆகியவை மூலத்தின் மறுபயன்பாட்டைப் பாதுகாத்து, ஒரே சொல்லை அசட்டையாகத் திரும்பச் சொல்லாமல் கவனமான கேட்டலின் வலிமையை வெளிப்படுத்துகின்றன.
