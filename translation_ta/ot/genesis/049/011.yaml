source:
  edition: WLC
  text: אֹסְרִ֤י לַ/גֶּ֨פֶן֙ עיר/ה וְ/לַ/שֹּׂרֵקָ֖ה בְּנִ֣י אֲתֹנ֑/וֹ כִּבֵּ֤ס בַּ/יַּ֨יִן֙ לְבֻשׁ֔/וֹ וּ/בְ/דַם עֲנָבִ֖ים סות/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/011.yaml
  text: Binding his donkey to the vine[a], and his donkey’s colt to the choice vine, he washes his garments in wine[c][b], and his robe in the blood of grapes.
translation:
  language: ta
  text: 'தன் கழுதைக்குட்டியைத் திராட்சைக்கொடியிலும்,

    தன் பெண் கழுதையின் கன்றைத் தேர்ந்த திராட்சைக்கொடியிலும்[a] கட்டுகிறவன்,

    தன் உடையைத் திராட்சரசத்திலும்,

    தன் மேலாடையைத் திராட்சைப்பழங்களின் இரத்தத்திலும்[b] துவைக்கிறான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தேர்ந்த திராட்சைக்கொடி” என்பது உயர்தரமான திராட்சைப் பழங்களைத் தரும் சிறப்பான கொடியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “திராட்சைப்பழங்களின் இரத்தம்” என்பது திராட்சைச்சாறு அல்லது திராட்சரசத்தைக் குறிக்கும் எபிரெயக் கவித்துவப் படிமம்.
    reason: cultural_note
lexical_decisions:
- source_word: אֹסְרִי
  choice: கட்டுகிறவன்
  rationale: ஆண்பால் ஒருமை நிகழ்காலப் பெயரெச்சத்தின் வருணனைத் தன்மையை இயல்பான தமிழில் காக்கிறது; ஆசீர்வாதக் கவிதையில் காட்சியை உயிரோட்டமாக முன்வைக்கிறது.
- source_word: לַגֶּפֶן
  choice: திராட்சைக்கொடியில்
  rationale: גפן என்பதன் பொதுவான பொருள் திராட்சைக்கொடி. ל முன்னொட்டின் இணைப்பு/கட்டுதல் சார்ந்த உறவு தமிழில் இடவேற்றுமையால் இயல்பாக வெளிப்படுகிறது.
- source_word: עִירֹה
  choice: தன் கழுதைக்குட்டியை
  rationale: עַיִר என்பது இளம் கழுதையையோ கழுதைக்குட்டியையோ குறிக்கும். இங்கு அதன் இளமையைத் தெளிவாகவும் தமிழில் இயல்பாகவும் காட்டுகிறது.
- source_word: וְלַשֹּׂרֵקָה
  choice: தேர்ந்த திராட்சைக்கொடியில்
  rationale: שֹׂרֵקָה உயர்தரமான, தேர்ந்தெடுக்கப்பட்ட திராட்சைக்கொடியைக் குறிக்கிறது. ‘தேர்ந்த’ என்பது அதன் தரச்சிறப்பைச் சுருக்கமாகக் காக்கிறது.
- source_word: בְּנִי אֲתֹנוֹ
  choice: தன் பெண் கழுதையின் கன்றை
  rationale: சொல்லடியாக ‘அவனுடைய பெண் கழுதையின் மகன்.’ ‘கன்று’ என்பது விலங்கின் குட்டியையும் தாயுடனான உறவையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כִּבֵּס
  choice: துவைக்கிறான்
  rationale: எபிரெயக் கவிதையில் நிறைவுவினை பண்பான அல்லது எதிர்காலம் நோக்கிய காட்சியை உயிரோட்டமாகச் சொல்லலாம். நிகழ்காலத் தமிழ் வடிவம் அந்தக் காட்சித்தன்மையைப் பேணுகிறது.
- source_word: בַּיַּיִן
  choice: திராட்சரசத்தில்
  rationale: ב முன்னொட்டை ‘-இல்’ எனக் கொண்டு, திராட்சரசத்திலேயே உடையைத் துவைக்கும் மிகுதியின் கவித்துவப் படிமத்தைப் பாதுகாக்கிறது.
- source_word: לְבֻשׁוֹ
  choice: தன் உடையை
  rationale: לְבוּשׁ ஆடை அல்லது உடையைக் குறிக்கிறது. ஒருமையைப் பேணி, இணைவரியிலுள்ள மேலாடையுடன் கவிதை ஒத்திசைவை வழங்குகிறது.
- source_word: וּבְדַם עֲנָבִים
  choice: திராட்சைப்பழங்களின் இரத்தத்தில்
  rationale: ‘திராட்சைகளின் இரத்தம்’ என்ற திடமான எபிரெயக் கவித்துவ உருவகத்தைச் சாறு என்று தட்டையாக்காமல் பாதுகாக்கிறது.
- source_word: סוּתוֹ
  choice: தன் மேலாடையை
  rationale: இது לְבוּשׁ என்பதற்கு இணையாக வரும் ஒரு மூடும் ஆடைச்சொல். ‘மேலாடை’ மிகையாகத் துல்லியப்படுத்தாமல் வேறுபாட்டையும் கவிதை இணைமையையும் தருகிறது.
theological_decisions:
- issue: யூதாவைப் பற்றிய யாக்கோபின் ஆசீர்வாதத்தில் மேசியா அல்லது கோத்திரப் படிமம்
  choice: அசாதாரண வளத்தையும் அரசருக்குரிய செழிப்பையும் காட்டும் கவித்துவப் படிமத்தை மட்டும் மொழிபெயர்ப்பில் வைத்தல்
  alternative: இதை நேரடியான மேசியா தீர்க்கதரிசனமாகவோ, யூதா கோத்திரத்தின் வரலாற்றுச் செழிப்பை மட்டுமே குறிக்கும் வருணனையாகவோ வெளிப்படையாக விளக்குதல்
  rationale: எபிரெய மூலவசனம் திராட்சை வளத்தின் மிகுதியை உருவகங்களால் காட்டுகிறது; மேசியா சார்ந்த அல்லது வரலாற்று சார்ந்த ஒரே விளக்கத்தை வசனத்திற்குள் சேர்ப்பது மூலத்தில் உள்ள விளக்கத் திறப்பைத் தேவையின்றி முடிவுசெய்யும்.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சாதாரண வாசகருக்குப் புரியும் இயல்பான சொற்களுடன் கவிதைக்குரிய கண்ணியமும் இணைவரி அமைப்பும் பேணப்பட்டுள்ளன. முதல் இரு வரிகளின் நிறைவில் வரும் ‘கட்டுகிறவன்’ அடுத்த இரு வரிகளின் ‘துவைக்கிறான்’ என்பதுடன் ஒரே நபரை இணைக்கிறது. மூலத்தின் மிகுதி உருவகம் விளக்கமாக மாற்றப்படாமல் காக்கப்பட்டுள்ளது.
