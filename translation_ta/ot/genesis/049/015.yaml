  source_fidelity: 'மூல எபிரேயத்தின் இணை அமைப்பும் கருத்தோட்டமும் துல்லியமாகக் காக்கப்பட்டுள்ளன: מְנֻחָה-வுக்கு ‘ஓய்விடம்’, நலமான நிலம், சுமை ஏற்கத் தோளைத் தாழ்த்துதல், இறுதியில் கட்டாய உழைப்புச் சார்ந்த பணிநிலை ஆகியவை சரியாக வெளிப்படுகின்றன. לְמַס עֹבֵד என்பதன் சமூக நுணுக்கம் உறுதியாகத் தீர்மானிக்கப்படாமல் அடிக்குறிப்பில் மாற்றுவாசிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளது.'
