source:
  edition: WLC
  text: וַ/יַּ֤רְא מְנֻחָה֙ כִּ֣י ט֔וֹב וְ/אֶת הָ/אָ֖רֶץ כִּ֣י נָעֵ֑מָה וַ/יֵּ֤ט שִׁכְמ/וֹ֙ לִ/סְבֹּ֔ל וַ/יְהִ֖י לְ/מַס עֹבֵֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/015.yaml
  text: He saw that the resting place was good[a], and that the land was pleasant, so he bent his shoulder to bear[c][b], and became a servant for forced labor.
translation:
  language: ta
  text: ஓய்விடம் நல்லது[a] என்றும், நிலம் இனிமையானது என்றும் அவன் கண்டான்; சுமப்பதற்குத் தன் தோளைத் தாழ்த்தி, கட்டாயப் பணியாளனானான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஓய்வு நல்லது.’ மְנֻחָה என்ற எபிரேயச் சொல் ‘ஓய்வு’ அல்லது ‘ஓய்விடம்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கப்பம் செலுத்திப் பணிபுரிபவனானான்’ அல்லது ‘அடிமைத் தொழிலாளியானான்.’ לְמַס עֹבֵד என்ற எபிரேயத் தொடரின் துல்லியமான சமூகப் பொருள் விவாதத்திற்குரியது; מַס பெரும்பாலும் கட்டாயப் பணியைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: מְנֻחָה
  choice: ஓய்விடம்
  rationale: இந்தப் பெயர்ச்சொல் ‘ஓய்வு’ அல்லது ‘ஓய்விடம்’ எனப் பொருள்படலாம். அடுத்துள்ள ‘நிலம்’ என்பதுடன் இணையாக வருவதால், இங்கு இடத்தைக் குறிக்கும் ‘ஓய்விடம்’ இயல்பாகப் பொருந்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: טוֹב
  choice: நல்லது
  rationale: எபிரேயச் சொல்லின் எளிய, பரந்த நேர்மறைப் பொருளை இது காக்கிறது.
- source_word: הָאָרֶץ
  choice: நிலம்
  rationale: கோத்திரத்துக்குரிய வாழிடப் பகுதியைச் சுட்டும் இச்சூழலில் ‘நிலம்’ இயல்பான தமிழாக்கம்.
- source_word: נָעֵמָה
  choice: இனிமையானது
  rationale: நிலம் விரும்பத்தக்கதாகவும் மனதுக்கு உகந்ததாகவும் இருப்பதை, அளவுக்கு மீறாமல் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיֵּט שִׁכְמוֹ
  choice: தன் தோளைத் தாழ்த்தி
  rationale: ஒரு சுமையை ஏற்கத் தோளைத் தாழ்த்தும் உடல்சார் உருவகத்தைத் தமிழில் தெளிவாகக் காக்கிறது.
- source_word: לִסְבֹּל
  choice: சுமப்பதற்கு
  rationale: சுமையை ஏற்றுச் சுமத்தல் என்ற வினையின் நோக்கத்தைச் சுருக்கமாகத் தெரிவிக்கிறது; மூலத்தில் சுமை தனியே குறிப்பிடப்படாததால் தமிழிலும் தேவையற்ற பொருள் சேர்க்கப்படவில்லை.
- source_word: לְמַס עֹבֵד
  choice: கட்டாயப் பணியாளனானான்
  rationale: מַס என்பது பொதுவாக ஆட்சியால் விதிக்கப்படும் கட்டாய உழைப்பையோ பணிச்சுமையையோ குறிக்கிறது; עֹבֵד உழைக்கும் அல்லது பணிசெய்யும் ஒருவரைக் குறிக்கிறது. தமிழில் தேவையற்ற மறுசொல்லாக்கத்தைத் தவிர்த்து இரண்டின் இணைந்த கருத்தையும் இத்தொடர் தெரிவிக்கிறது.
theological_decisions:
- issue: இறுதித் தொடரில் இசக்காரின் கீழ்ப்படிதலின் தன்மை
  choice: கட்டாயப் பணியாளனானான்
  alternative: கப்பம் செலுத்திப் பணிபுரிபவனானான்; அடிமைத் தொழிலாளியானான்
  rationale: מַס பெரும்பாலும் கட்டாய உழைப்பு அல்லது அரசுப் பணிவிதிப்பைக் குறித்தாலும், கப்பம் சார்ந்த கீழ்ப்படிதல் என்ற நுண்பொருளும் முன்வைக்கப்பட்டுள்ளது. முதன்மை உரை அதிக சாத்தியமுள்ள கட்டாயப் பணியை எடுத்துரைக்கிறது; சரியான சமூக நிலை தெளிவாக இல்லாததால் மாற்றுகள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவித்துவமான உடல் உருவகத்தைத் தக்கவைத்துச் சுருக்கமாகவும் கண்ணியமாகவும் மொழிபெயர்க்கப்பட்டது. ‘தோளைத் தாழ்த்தி’ என்பது சுமையை ஏற்கும் படிமத்தையும் அதனுடன் தொடர்புடைய கீழ்ப்படிதலையும் வாசகர் உணர இடமளிக்கிறது.
