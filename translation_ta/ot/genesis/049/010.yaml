  text: לֹֽא יָס֥וּר שֵׁ֨בֶט֙ מִֽ/יהוּדָ֔ה וּ/מְחֹקֵ֖ק מִ/בֵּ֣ין רַגְלָ֑י/ו עַ֚ד כִּֽי יָבֹ֣א שילה וְ/ל֖/וֹ יִקְּהַ֥ת עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/010.yaml
  text: The scepter will not depart from Judah[a], nor the ruler’s staff from between his feet, until Shiloh comes[b]; and to him will be the obedience of the peoples.
translation:
  language: ta
  text: 'செங்கோல் யூதாவைவிட்டு நீங்காது;

    ஆட்சிக்கோல் அவன் கால்களுக்கு இடையிலிருந்து அகலாது,

    சீலோ வரும்வரை[a];

    மக்களினங்களின் கீழ்ப்படிதல் அவருக்கே உரியது[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உரிமையுடையவர் வரும்வரை.’ שילה என்ற எபிரெயச் சொல் புரிந்துகொள்வதற்குக் கடினமானது; அது ஒரு பட்டம், இடப்பெயர், அல்லது காணிக்கையைக் குறிக்கும் சொல்லாகவும் விளக்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘மக்களினங்களின் கூடுகை அவருக்கே உரியது,’ அல்லது ‘மக்களினங்களின் பணிதல் அவருக்கே உரியது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  choice: செங்கோல்
  rationale: מְחֹקֵק என்பதற்கு இணையாக வரும் அரசாட்சிச் சூழலில், இது ஒரு சாதாரண கோலையோ ‘கோத்திரம்’ என்பதையோ விட ஆட்சியின் அடையாளத்தைக் குறிக்கிறது.
- source_word: מִיהוּדָה
  choice: யூதாவைவிட்டு
  rationale: מִן என்னும் முன்னிடைச்சொல் பிரிதல் அல்லது நீங்குதலைக் குறிக்கிறது; ஆகவே இயல்பான தமிழில் ‘யூதாவைவிட்டு’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: מְחֹקֵק
  choice: ஆட்சிக்கோல்
  rationale: இச்சொல் ஆணையிடுகிற ஒருவரையோ ஆட்சியுடன் தொடர்புடைய கோலையோ குறிக்கலாம். ‘செங்கோல்’ என்பதற்கான இணைவரியாகவும் ‘கால்களுக்கு இடையிலிருந்து’ என்பதோடு வருவதாலும், ஆட்சியின் அடையாளமான கோல் என்ற பொருள் தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִבֵּין רַגְלָיו
  choice: அவன் கால்களுக்கு இடையிலிருந்து
  rationale: அமர்ந்திருக்கும் அரசரின் ஆட்சியையோ வழித்தோன்றலையோ இது சுட்டக்கூடும்; ஆனால் எபிரெய உரையின் திட்டவட்டமான உருவகத்தை விளக்கவுரையால் மாற்றாமல் நேரடியாகத் தக்கவைக்கிறது.
- source_word: עַד כִּי
  choice: வரும்வரை
  rationale: முந்தைய கூற்றின் கால எல்லையை அறிமுகப்படுத்தும் சொற்றொடர்; தமிழில் ‘வரும்வரை’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: שילה
  choice: சீலோ
  rationale: இந்த எபிரெய வடிவத்தின் பொருள் மிகவும் சர்ச்சைக்குரியது. மரபான உயிர்க்குறியீட்டின்படி இதை ஒரு பெயராக ஒலிபெயர்த்து, பிற முக்கிய வாசிப்புகளை அடிக்குறிப்பில் தக்கவைக்கிறது.
- source_word: וְלוֹ
  choice: அவருக்கு
  rationale: முதன்மை உரையில் ‘சீலோ’ ஓர் ஆளைக் குறிப்பதாக எடுத்துக்கொள்ளப்பட்டுள்ளதால், பின்னொட்டு மரியாதைக்குரிய ஒருமை ஆளைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: יִקְּהַת
  choice: கீழ்ப்படிவார்கள்
  rationale: அரிதான இச்சொல் ‘கீழ்ப்படிதல்’, ‘பணிதல்’ அல்லது ‘கூடிவருதல்’ என்று புரிந்துகொள்ளப்படலாம். அரசாட்சி சார்ந்த சூழலில் மக்களினங்கள் அந்த ஆளின் ஆட்சிக்கு இணங்குவதை இயல்பான தமிழில் தெரிவிக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: עַמִּים
  choice: மக்களினங்கள்
  rationale: பன்மை வடிவத்தையும் பல இன மக்களை உள்ளடக்கும் விரிவையும் ‘தேசங்கள்’ என்று சற்றே விளக்கமாக்காமல் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: நீண்டகால மேசிய விளக்கத்தைக் கொண்ட உரையில் שילה என்பவரின் அடையாளமும் சொல்லாக்கமும்
  choice: முதன்மை உரையில் வெளிப்படையாக மேசியா என்று அடையாளப்படுத்தாமல், ‘சீலோ’ என்ற பெயரை ஒலிபெயர்த்தல்.
  alternative: ‘அதற்கு உரியவர்’; ‘அவருக்குக் காணிக்கை வரும்வரை’; ‘அவர் சீலோவுக்கு வரும்வரை’.
  rationale: இது கடினமான எபிரெய வாசகத்தைத் தீர்மானமாக ஒரே பொருளில் கட்டுப்படுத்தாமல் அதன் இறையியல் அழுத்தத்தையும் உண்மையான தெளிவின்மையையும் பாதுகாக்கிறது.
- issue: வசனத்தின் அரச மற்றும் மேசிய சார்பு
  choice: ‘செங்கோல்’, ‘ஆட்சிக்கோல்’, ‘கீழ்ப்படிவார்கள்’ என்ற அரசாட்சி மொழியைப் பயன்படுத்தி, உரை கூறுவதைத் தாண்டி வெளிப்படையான கோட்பாட்டுக் கூற்றைச் சேர்க்காதிருத்தல்.
  alternative: மேசிய சார்பில்லாத அரசகுல வாசிப்பு; அல்லது வெளிப்படையாக மேசியாவைச் சுட்டும் விளக்க மொழிபெயர்ப்பு.
  rationale: இந்த வசனம் யூதாவுடன் இணைந்த அரசாட்சிப் படிமங்களைத் தெளிவாகக் கொண்டுள்ளது. அவற்றைத் தக்கவைத்தபடியே, முதன்மை உரையில் விளக்கவுரையான கோட்பாட்டைச் சேர்ப்பது தவிர்க்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைவரிகளின் அரசாட்சிப் படிமம் தக்கவைக்கப்பட்டுள்ளது. அரிதும் சர்ச்சைக்குரியதுமான שילה மற்றும் יִקְּהַת ஆகியவற்றின் மாற்று வாசிப்புகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
