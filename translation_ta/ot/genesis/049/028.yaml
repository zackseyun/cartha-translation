base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/028.yaml
  text: 'All these are the twelve tribes of Israel[a], and this is what their father spoke to them when he blessed them: he blessed each one with the blessing appropriate to him.'
translation:
  language: ta
  text: இவர்கள் அனைவருமே இஸ்ரவேலின் பன்னிரண்டு கோத்திரங்கள். அவர்களுடைய தந்தை அவர்களிடம் கூறியது இதுதான்; அவர் அவர்களை ஆசீர்வதித்தார். ஒவ்வொருவரையும் அவரவருடைய ஆசீர்வாதத்தின்படியே ஆசீர்வதித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “ஒவ்வொருவரையும் அவரவருடைய ஆசீர்வாதத்தின்படி அவர் ஆசீர்வதித்தார்.” இது ஒவ்வொருவருக்கெனத் தனிப்பட்ட அல்லது அவரவருக்குப் பொருந்திய ஆசீர்வாதத்தைக் குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: இவர்கள் அனைவருமே
  rationale: முன்னர் குறிப்பிடப்பட்ட யாக்கோபின் மக்களைத் தொகுத்துச் சுட்டுகிறது. மனிதர்களைக் குறிக்கும் இயல்பான நவீனத் தமிழாகவும், எபிரெயச் சொல்லின் முழுமை வலியுறுத்தலையும் காக்கும் வகையிலும் அமைந்துள்ளது.
- source_word: שִׁבְטֵי יִשְׂרָאֵל שְׁנֵים עָשָׂר
  choice: இஸ்ரவேலின் பன்னிரண்டு கோத்திரங்கள்
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவாகவும் தமிழில் வழக்கமான வேதாகமச் சொல்லாட்சியுடனும் தருகிறது.
- source_word: וְזֹאת אֲשֶׁר דִּבֶּר לָהֶם אֲבִיהֶם
  choice: அவர்களுடைய தந்தை அவர்களிடம் கூறியது இதுதான்
  rationale: דִּבֶּר என்பதன் உரைத்தல்/கூறுதல் பொருளை இயல்பான தமிழில் தருகிறது; முந்தைய உரையைச் சுருக்கிக் குறிப்பிடும் வாக்கிய அமைப்பையும் காக்கிறது.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: அவர் அவர்களை ஆசீர்வதித்தார்
  rationale: இணைப்பு வினையை தனித்த கூற்றாக மொழிபெயர்ப்பதால் எபிரெயத்தின் தொடரமைப்பு பாதுகாக்கப்படுகிறது; அதை காலவினைத் துணைவாக்கியமாக விளக்கிச் சுருக்கவில்லை.
- source_word: אִישׁ אֲשֶׁר כְּבִרְכָתוֹ
  choice: ஒவ்வொருவரையும் அவரவருடைய ஆசீர்வாதத்தின்படியே
  rationale: אִישׁ என்பதன் பகிர்ந்தளிக்கும் ‘ஒவ்வொருவர்’ பொருளையும், כְּבִרְכָתוֹ என்பதன் ‘அவரவருடைய ஆசீர்வாதத்தின்படி’ என்ற உண்மையான சற்றே திறந்த பொருளையும் காக்கிறது.
- source_word: בֵּרַךְ אֹתָם
  choice: ஆசீர்வதித்தார்
  rationale: ברך என்ற வேர்ச்சொல்லின் மறுபயன்பாட்டைத் தமிழிலும் மீண்டும் ‘ஆசீர்வதித்தார்’ எனக் கூறி பாதுகாக்கிறது.
theological_decisions:
- issue: כְּבִרְכָתוֹ என்ற சொற்றொடர் ஒவ்வொருவருக்கும் பொருத்தமான ஆசீர்வாதத்தைக் குறிக்கிறதா அல்லது அவரவருக்கான ஆசீர்வாதத்தை மட்டும் குறிக்கிறதா
  choice: அவரவருடைய ஆசீர்வாதத்தின்படியே
  alternative: அவரவருக்குப் பொருத்தமான ஆசீர்வாதத்தால்
  rationale: ‘பொருத்தமான’ என்பது சூழலிலிருந்து கொள்ளக்கூடிய விளக்கம் என்றாலும் மூலத்தில் வெளிப்படையாக இல்லை. ஆகவே மூலத்தின் பொருள் திறப்பையும் இறையியல் பதற்றத்தையும் தீர்மானிக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கோத்திரங்கள்’, ‘ஆசீர்வதித்தார்’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாக இருப்பதால் தக்கவைக்கப்பட்டுள்ளன; எபிரெயத்தில் உள்ள ‘ஆசீர்வதித்தார்’ என்ற மீளுரையும் பாதுகாக்கப்பட்டுள்ளது.
