  source_fidelity: 'மூல எபிரெயத்தின் கூறுகள் முழுமையாகவும் சரியான வரிசை உறவுடனும் தரப்பட்டுள்ளன: ‘இவர்கள் அனைவருமே’, ‘இஸ்ரவேலின் பன்னிரண்டு கோத்திரங்கள்’, தந்தை அவர்களிடம் கூறியது, அவர்களை ஆசீர்வதித்தது, மேலும் ஒவ்வொருவருக்கும் அவரவர் ஆசீர்வாதத்தின்படி ஆசீர்வதித்தது. וַיְבָרֶךְ אֹתָם என்பதைக் கால/விளக்கத் துணைவாக்கியமாக்காமல் தனிக் கூற்றாகக் கொடுத்திருப்பது மூலத்தின் இணைத் தொடரமைப்பை நன்றாகக் காக்கிறது. இறுதிச் சொற்றொடரின் திறந்த பொருளும் பாதுகாக்கப்பட்டுள்ளது.'
  naturalness: நவீன நிலையான தமிழில் தெளிவான, கண்ணியமான வேதாகம நடையாக உள்ளது. ‘கோத்திரங்கள்’ மற்றும் ‘ஆசீர்வதித்தார்’ ஆகியவை இந்தப் பதிவேட்டிற்கு இயல்பான, பரவலாகப் புரியப்படும் சொற்கள். இரண்டு குறுகிய வாக்கியங்களும் இறுதியில் உள்ள பகிர்ந்தளிக்கும் கூற்றும் வாசிப்பிற்கு இயல்பாக உள்ளன.
