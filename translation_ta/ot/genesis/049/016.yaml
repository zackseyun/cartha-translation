source:
  edition: WLC
  text: דָּ֖ן יָדִ֣ין עַמּ֑/וֹ כְּ/אַחַ֖ד שִׁבְטֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/016.yaml
  text: Dan will judge his people as one of the tribes of Israel[a].
translation:
  language: ta
  text: தாண் தன் மக்களுக்கு நியாயந்தீர்ப்பான், இஸ்ரவேலின் கோத்திரங்களில் ஒன்றைப் போல.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாண் தன் மக்களின் உரிமையை நிலைநாட்டுவான்.” எபிரெய வினைச்சொல் நியாயந்தீர்ப்பதை மட்டுமல்லாமல், அவர்களைக் காத்து அவர்களுக்கு நீதி கிடைக்கச் செய்வதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּן
  choice: தாண்
  rationale: யாக்கோபின் மகனையும் அவரிடமிருந்து தோன்றிய கோத்திரத்தையும் குறிக்கும் இயற்பெயர். இதைத் தொடர்ந்து வரும் יָדִין என்ற வினையுடன் எபிரெயத்தில் சொல்விளையாட்டு உள்ளது; தமிழில் பெயரை வழக்கமான வேதாகம ஒலிபெயர்ப்பாக வைத்திருக்கிறது.
- source_word: יָדִין
  choice: நீதி வழங்குவான்
  rationale: דין என்பதன் Qal முற்றுப்பெறா வடிவம்; இங்கு முன்னறிவிப்பான எதிர்காலப் பொருள் கொண்டது. ‘நியாயந்தீர்ப்பான்’ என்பதைவிட இயல்பான நவீனத் தமிழில் தீர்ப்பளித்தல், ஆளுதல், உரிமையை நிலைநாட்டுதல் ஆகிய பொருள் நிழல்களுக்கு இடமளிக்கிறது.
- source_word: עַמּוֹ
  choice: தன் மக்களுக்கு
  rationale: עם என்பதுடன் மூன்றாம் ஆண் ஒருமை உடைமைப் பின்னொட்டு இணைந்திருப்பதால் ‘அவனுடைய மக்கள்’ என்று பொருள். தமிழில் கர்த்தாவும் உரிமையாளரும் ஒருவரே என்பது தெளிவாக ‘தன் மக்கள்’ என வழங்கப்படுகிறது.
- source_word: כְּאַחַד
  choice: ஒன்றாக
  rationale: ஒப்புமையைக் குறிக்கும் כ மற்றும் אחד இணைந்து ‘ஒன்றைப் போல/ஒன்றாக’ எனப் பொருள்படும். இங்கு இஸ்ரவேலின் கோத்திரங்களில் ஒன்றுக்குரிய முழு நிலையுடன் தாண் செயல்படுவதைச் சொல்கிறது.
- source_word: שִׁבְטֵי
  choice: கோத்திரங்களில்
  rationale: שֵׁבֶט என்பதன் பன்மை இணைப்புரு. சூழலில் ‘செங்கோல்கள்’ அல்ல, இஸ்ரவேலின் கோத்திரங்களே குறிக்கப்படுகின்றன.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: உடன்படிக்கை மக்களையும் தேசத்தையும் குறிக்கும் இயற்பெயர்; தமிழின் நிலைபெற்ற வேதாகம வடிவில் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: ஆசீர்வாதத்தில் தாணின் பங்கு
  choice: இஸ்ரவேலின் கோத்திரங்களில் ஒன்றுக்குரிய நிலையுடன் தாண் தன் மக்களுக்கு நீதி வழங்குவான்.
  alternative: தாண் தன் மக்களின் உரிமையை நிலைநாட்டுவான் அல்லது அவர்களைக் காத்து நியாயம் பெற்றுத் தருவான்.
  rationale: דין என்ற வினை தீர்ப்பளித்தல், ஆளுதல், உரிமையை நிலைநாட்டுதல் ஆகிய பொருள் நிழல்களைக் கொண்டிருக்கலாம். ‘இஸ்ரவேலின் கோத்திரங்களில் ஒன்றாக’ என்ற ஒப்புமை, ஒரு கோத்திரமாக அதிகாரத்துடன் நீதி செலுத்தும் கருத்தை ஆதரிக்கிறது; இருப்பினும் பாதுகாத்து நியாயம் பெற்றுத் தரும் சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ‘நீதி வழங்குவான்’ என்பது மூலத்தின் நீதித்தீர்ப்பு சார்ந்த பொருளைப் பாதுகாத்தபடியே தமிழில் இயல்பாக உள்ளது; மூலத்திலுள்ள தாண்/யாதீன் சொல்விளையாட்டைத் தமிழில் இயல்பாக மீட்டுருவாக்க முடியவில்லை.
