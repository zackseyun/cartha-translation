  text: பென்யமீன் இரையைக் கிழிக்கும் ஓநாய்[a]; காலையில் அவன் இரையை[b] தின்பான்; மாலையில் கொள்ளைப்பொருளைப்[c] பங்கிடுவான்.
  philosophy: optimal-equivalence
