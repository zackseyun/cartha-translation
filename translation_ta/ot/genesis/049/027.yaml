theological_decisions:
- issue: பென்யமீனைப் பற்றிய யாக்கோபின் ஆசீர்வாதத்தில் உள்ள உருவகம்
  choice: கொடூரமாக இரையை வேட்டையாடும் வலிமையையும் பெற்ற வெற்றிப்பொருளைப் பங்கிடுவதையும் காட்டும் கவித்துவ உருவகமாக மொழிபெயர்க்கப்பட்டது; எந்தப் பிற்கால வரலாற்று நிறைவேற்றமும் உரையில் குறிப்பிடப்படவில்லை.
  alternative: இதைப் பென்யமீன் கோத்திரத்தின் போர்க்குணமிக்க வரலாற்றைக் குறிக்கும் நேரடி தீர்க்கதரிசனமாக விளக்குதல்.
  rationale: எபிரெய உரை ஒரு வலிமையான கவித்துவ உருவகத்தையே தருகிறது; குறிப்பிட்ட நிகழ்வையோ நபரையோ வெளிப்படையாக அடையாளப்படுத்தவில்லை. ஆகவே சாத்தியமான வரலாற்று அல்லது இறையியல் தொடர்புகளை மொழிபெயர்ப்பு தீர்மானித்துவிடாமல் விடுகிறது.
