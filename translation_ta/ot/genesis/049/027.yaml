  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் கவித்துவமான கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘காலையில்… மாலையில்…’ என்ற இணை அமைப்பும் ஓநாய்/போர்வெற்றி உருவகங்களுக்கிடையிலான பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
