  yaml_path: translation/ot/genesis/049/021.yaml
  text: Naphtali is a doe let loose[b][a], giving beautiful words.
translation:
  language: ta
  text: 'நப்தலி விடப்பட்ட பெண் மான்[a]; அவன் அழகிய சொற்களை வழங்குகிறான்.[b]


    [a] அல்லது, “ஓட விடப்பட்ட பெண் மான்.” எபிரெய உருவகம், சுதந்திரமாக ஓடும் பெண் மானைக் குறிக்கிறது.


    [b] இறுதிப் பகுதி வேறு விதமாகவும் புரிந்துகொள்ளப்படுகிறது. “அழகிய சொற்களை வழங்குகிறவன்” என்பது ஒரு வாசிப்பு; கடைசிச் சொற்களுக்கு வேறொரு பொருள் முன்மொழியப்பட்டால், “அழகிய மான்குட்டிகளை ஈனுகிற பெண்மான்” என்றும் புரிந்துகொள்ளலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓட விடப்பட்ட பெண் மான்.” எபிரெய உருவகம், சுதந்திரமாக ஓடும் பெண் மானைக் குறிக்கிறது.
    reason: lexical_alternative
