    reason: alternative_reading
lexical_decisions:
- source_word: נַפְתָּלִי
  choice: நப்தலி
  rationale: தனிப்பெயரும் கோத்திரப் பெயரும் என்பதால், எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אַיָּלָה
  choice: பெண்மான்
  rationale: பெண் பாலுடைய மானைத் தெளிவாகக் குறிக்கிறது; கவிதை உருவகத்தின் பெண்பாலைப் பாதுகாக்கிறது.
- source_word: שְׁלֻחָה
  choice: கட்டவிழ்த்து விடப்பட்ட
  rationale: שלח என்பதன் செயல்பாட்டு இறந்த வடிவம். இச்சூழலில் மான் சுதந்திரமாக ஓடும்படி விடப்பட்டிருக்கும் உருவகத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַנֹּתֵן
  choice: வழங்குகிறான்
  rationale: எபிரெயில் இது ஆண்பால் ஒருமைச் செயலெச்சம். அதை நப்தலியோடு தொடர்புபடுத்தி மொழிபெயர்ப்பதன் மூலம் மூலத்தின் இலக்கண வேறுபாடு வெளிப்படுகிறது.
- source_word: אִמְרֵי
  choice: சொற்களை
  rationale: பேசப்படும் சொற்கள் அல்லது கூற்றுகள் என்ற விரிவான பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: שָׁפֶר
  choice: அழகிய
  rationale: அழகு அல்லது இனிமையைக் குறிக்கும் சொல்லை, கவிதைச் சூழலுக்கு ஏற்ற தெளிவான தமிழில் தருகிறது.
theological_decisions:
- issue: இறுதிச் செயலெச்சத் தொடரின் எழுவாய்
  choice: “அவன் அழகிய சொற்களை வழங்குகிறான்” என்று நப்தலியைக் குறிக்கும் தொடராக மொழிபெயர்க்கப்பட்டது.
  alternative: இறுதித் தொடர் பெண்மான் உருவகத்தையே தொடர்ந்து, “அழகிய மான்குட்டிகளை ஈனுகிற பெண்மான்” எனப் புரிந்துகொள்ளப்படலாம்.
  rationale: மசோரா உயிர்க்குறிப்புகள் ‘அழகிய சொற்களை வழங்குகிறவன்’ என்ற வாசிப்பை ஆதரிக்கின்றன; அதேவேளையில் எபிரெயக் கவிதை சுருக்கமாகவும் பொருள் ஐயமுடையதாகவும் இருப்பதால் மாற்று விளக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சுருக்கமான கவிதை நடையும் கண்ணியமான சொற்களும் பயன்படுத்தப்பட்டுள்ளன. “கட்டவிழ்த்து விடப்பட்ட” என்பது சுதந்திரமாக ஓட விடப்பட்ட மானின் உயிருள்ள உருவகத்தைத் தருகிறது. எபிரெயில் பெண்மானைக் குறிக்கும் பெண்பால் பெயர்ச்சொல்லுக்கும் இறுதியில் வரும் ஆண்பால் செயலெச்சத்திற்கும் உள்ள பதற்றம், “அவன்” என்பதன் மூலம் நப்தலியைக் குறிப்பதாக வெளிப்படுத்தப்பட்டு, மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
