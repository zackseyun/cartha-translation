base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/017.yaml
  text: Let Dan be a serpent by the road[a], a viper by the path, that bites the horse’s heels so that its rider falls backward.
translation:
  language: ta
  text: 'தாண் வழியோரத்தில் ஒரு பாம்பாக இருப்பானாக;

    பாதையோரத்தில் ஒரு நச்சுப்பாம்பாக[a] இருப்பானாக;

    அது குதிரையின் குதிகால்களைக் கடித்து,

    அக்குதிரையின் சவாரிக்காரன் பின்னோக்கி விழுவான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: שְׁפִיפֹן என்ற அரிய எபிரெயச் சொல் குறிக்கும் துல்லியமான பாம்பினம் உறுதியாகத் தெரியவில்லை. இதை ‘விரியன் பாம்பு’ என்றும் மொழிபெயர்க்கலாம்; பொதுவாக இது ஆபத்தான நச்சுப்பாம்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: இருப்பானாக
  rationale: היה என்பதன் விருப்பநிலை வடிவம் ஆசீர்வாதத்துக்குரிய விருப்பம் அல்லது அறிவிப்பை வெளிப்படுத்துகிறது; தமிழில் ‘இருப்பானாக’ அந்தக் கவித்துவத் தொனியைக் காக்கிறது.
- source_word: נָחָשׁ
  choice: பாம்பு
  rationale: பொதுவாகப் பாம்பைக் குறிக்கும் சொல்; இயல்பான நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: עֲלֵי דֶרֶךְ
  choice: வழியோரத்தில்
  rationale: பாம்பு வழிக்கு அருகில் பதுங்கியிருக்கும் காட்சியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שְׁפִיפֹן
  choice: விரியன் பாம்பு
  rationale: துல்லியமான பாம்பினம் உறுதியற்ற அரிய எபிரெயச் சொல். ‘விரியன் பாம்பு’ ஆபத்தான நச்சுப்பாம்பு என்ற கருத்தைத் தெளிவாகத் தருகிறது; இனத்தை மிகத் துல்லியமாக நிர்ணயிக்காதிருக்க அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: עֲלֵי אֹרַח
  choice: பாதையோரத்தில்
  rationale: முந்தைய ‘வழியோரத்தில்’ என்பதற்கு இணையான கவித்துவப் பொருத்தத்தைத் தருவதோடு, דֶרֶךְ மற்றும் אֹרַח ஆகிய இரு சொற்களின் வேறுபாட்டையும் காக்கிறது.
- source_word: הַנֹּשֵׁךְ
  choice: அது ... கடிக்கும்போது
  rationale: பாம்பின் தன்மையான செயலை இயல்பான தமிழில் தெரிவித்து, அதன் விளைவாகச் சவாரி செய்பவன் விழும் தொடர்ச்சியையும் தெளிவாக்குகிறது.
- source_word: עִקְּבֵי סוּס
  choice: குதிரையின் குதிகால்கள்
  rationale: குதிரையின் பின்கால் குதிகால் பகுதியைக் குறிக்கும் உருவகத்தை நேரடியாகக் காக்கிறது.
- source_word: וַיִּפֹּל
  choice: விழுவான்
  rationale: கடித்ததன் விளைவாக நிகழும் செயலைக் கவித்துவமான எதிர்கால அறிவிப்பாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רֹכְבוֹ
  choice: அதன் மேல் சவாரி செய்பவன்
  rationale: பின்னொட்டு குதிரையைக் குறிப்பதைத் தெளிவாக்குகிறது; ‘அதன் சவாரிக்காரன்’ என்பதைவிட நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: אָחוֹר
  choice: பின்னோக்கி
  rationale: சவாரி செய்பவன் விழும் திசையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
