source:
  edition: WLC
  text: בְּ/סֹדָ/ם֙ אַל תָּבֹ֣א נַפְשִׁ֔/י בִּ/קְהָלָ֖/ם אַל תֵּחַ֣ד כְּבֹדִ֑/י כִּ֤י בְ/אַפָּ/ם֙ הָ֣רְגוּ אִ֔ישׁ וּ/בִ/רְצֹנָ֖/ם עִקְּרוּ שֽׁוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/006.yaml
  text: Let my soul not enter their council[a]; let my honor not be joined to their assembly. For in their anger they killed a man[c][b], and in their self-will they hamstrung an ox.
translation:
  language: ta
  text: 'அவர்களுடைய ஆலோசனை மன்றத்தில்[a] என் உயிர் நுழையாதிருக்கட்டும்;

    அவர்களுடைய கூட்டத்தோடு என் கண்ணியம்[b] இணையாதிருக்கட்டும்.

    ஏனெனில், தங்கள் கோபத்தில் அவர்கள் ஒரு மனிதனைக் கொன்றார்கள்;

    தங்கள் தன்னிச்சையால் ஓர் எருதின் பின்னங்கால் நரம்புகளை வெட்டினார்கள்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய இரகசிய ஆலோசனையில்’; סוֹד என்ற எபிரெயச் சொல் நெருக்கமான அல்லது இரகசியமான ஆலோசனைக் குழுவையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் மாட்சி அவர்களுடைய கூட்டத்தோடு இணையாதிருக்கட்டும்.’
    reason: lexical_alternative
  - marker: c
    text: எபிரெய மசோரா வாசிப்பு ‘எருது’ என உள்ளது. சிலர் இங்குள்ள எழுத்துகளை வேறுவிதமாகப் புரிந்து, ‘அவர்கள் ஒரு மதிலை இடித்தார்கள்’ என மொழிபெயர்க்கின்றனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּסֹדָם
  choice: அவர்களுடைய ஆலோசனை மன்றத்தில்
  rationale: סוֹד என்பது நெருக்கமான அல்லது இரகசியமான ஆலோசனைக் குழுவைக் குறிக்கலாம். கָהָל என்பதற்கு இணையாக வரும் கவிதை அமைப்பையும், இரகசியம் என்ற பொருளை கட்டாயப்படுத்தாமல் ஆலோசனைக் குழு என்ற அடிப்படை உணர்வையும் இந்தத் தேர்வு காக்கிறது.
- source_word: תָּבֹא נַפְשִׁי
  choice: என் உயிர் நுழையாதிருக்கட்டும்
  rationale: אַל உடன் வரும் வினை விருப்பத்தையோ தடை உணர்வையோ வெளிப்படுத்துகிறது. נֶפֶשׁ என்பதன் கவிதைமிக்க சுயக்குறிப்பை வெறும் ‘நான்’ என்று சுருக்காமல் ‘என் உயிர்’ எனப் பாதுகாக்கிறது.
- source_word: בִּקְהָלָם
  choice: அவர்களுடைய கூட்டத்தோடு
  rationale: קָהָל என்பது கூடிய சபை அல்லது மக்கள் கூட்டத்தைக் குறிக்கிறது. தமிழில் இயல்பான ‘கூட்டம்’ முதல் அடியின் ‘ஆலோசனை மன்றம்’ என்பதுடன் உள்ள இணை அமைப்பைக் காக்கிறது.
- source_word: תֵּחַד כְּבֹדִי
  choice: என் கண்ணியம் இணையாதிருக்கட்டும்
  rationale: יחד இங்கு ஒன்றிணைதல் அல்லது சேர்ந்திருத்தலைக் குறிக்கிறது. כָּבוֹד என்பது மாட்சி, மகிமை, கண்ணியம் எனப் பொருள்படலாம்; வன்முறைச் செயலிலிருந்து யாக்கோபு தன்னை விலக்கிக்கொள்ளும் சூழலில் ‘கண்ணியம்’ இயல்பாக உள்ளது.
- source_word: בְאַפָּם
  choice: தங்கள் கோபத்தில்
  rationale: אַף இங்கு வழக்குப்பொருளில் கோபத்தைக் குறிக்கிறது; ‘தங்கள் கோபத்தில்’ என்பது எளிமையும் வலிமையும் உடைய நேரடி மொழிபெயர்ப்பு.
- source_word: הָרְגוּ אִישׁ
  choice: அவர்கள் ஒரு மனிதனைக் கொன்றார்கள்
  rationale: אִישׁ ஒருமையில் இருப்பதை ‘ஒரு மனிதன்’ என்று அப்படியே வைத்துள்ளது; அதை பொதுவான பன்மையாக மாற்றவில்லை.
- source_word: וּבִרְצֹנָם
  choice: தங்கள் தன்னிச்சையால்
  rationale: רָצוֹן என்பது விருப்பம் அல்லது மனவிருப்பத்தைக் குறிக்கும். எதிர்மறையான இச்சூழலில் கட்டுப்பாடற்ற சொந்த விருப்பத்தை ‘தன்னிச்சை’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עִקְּרוּ
  choice: பின்னங்கால் நரம்புகளை வெட்டினார்கள்
  rationale: עקר என்பது இச்சூழலில் விலங்கை முடமாக்க அதன் பின்னங்கால் நரம்புகளை வெட்டுவதைக் குறிக்கிறது. தமிழில் அரிதான தொழில்நுட்பச் சொல்லை விட செயலைத் தெளிவாகக் கூறுகிறது.
- source_word: שׁוֹר
  choice: ஓர் எருது
  rationale: மசோரா உயிர்க்குறிப்புகளின்படி שׁוֹר என்பது எருது. ஒருமை வடிவத்தையும் עקר உடன் வரும் இயல்பான பொருத்தத்தையும் மொழிபெயர்ப்பு காக்கிறது.
theological_decisions:
- issue: כְבֹדִי என்ற சுயக்குறிப்பு கவிதைச் சொல்லின் பொருள்
  choice: என் கண்ணியம்
  alternative: என் மாட்சி / என் மகிமை
  rationale: இங்கு யாக்கோபு சிமியோன், லேவியின் வன்முறையிலிருந்து தனது நற்பெயரையும் மாண்பையும் விலக்குகிறார். ‘கண்ணியம்’ அந்த உணர்வை நவீன தமிழில் தெளிவாகத் தருகிறது; ‘மகிமை’ எனத் தேர்ந்து பிற்கால இறையியல் பொருளைத் தேவையின்றி முன்வைக்கவில்லை.
- issue: இறுதி அடியிலுள்ள שׁוֹר என்பதன் வாசிப்பு
  choice: ஓர் எருது
  alternative: ஒரு மதில்
  rationale: மசோரா உயிர்க்குறிப்புகள் שׁוֹר என்பதை ‘எருது’ என்று வாசிக்கின்றன; עקר என்ற வினையுடன் இது பொருத்தமாக உள்ளது. ‘மதில்’ என்ற குறிப்பிடத்தக்க மாற்றுப் புரிதல் உரையில் தீர்மானமாக்கப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரமான தமிழில், கவிதைத் தன்மையும் இரு இணை வேண்டுதல்களின் அமைப்பும் காக்கப்பட்டுள்ளன. ‘என் உயிர்’ என்பது எபிரெய நெபெஷ் சொல்லின் கவிதை வலிமையைத் தக்கவைக்கிறது. ‘பின்னங்கால் நரம்புகளை வெட்டினார்கள்’ என்பது விலங்கை hamstring செய்வதைக் சாதாரண வாசகருக்குத் தெளிவாக விளக்கும் இயல்பான சொற்றொடர்.
