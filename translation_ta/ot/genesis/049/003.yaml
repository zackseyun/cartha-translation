  text: רְאוּבֵן֙ בְּכֹ֣רִ/י אַ֔תָּה כֹּחִ֖/י וְ/רֵאשִׁ֣ית אוֹנִ֑/י יֶ֥תֶר שְׂאֵ֖ת וְ/יֶ֥תֶר עָֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/003.yaml
  text: Reuben[a], you are my firstborn, my strength and the firstfruits of my vigor[b], excelling in honor and excelling in power.
translation:
  language: ta
  text: ரூபனே, நீ என் முதற்பேறானவன்; என் வலிமையும், என் ஆற்றலின் முதற்கனியும்[a] நீயே; மாண்பில் மேம்பட்டவன், வல்லமையில் மேம்பட்டவன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் ஆற்றலின் தொடக்கம்.” எபிரேயச் சொற்றொடர் ஒரு தந்தையின் இனப்பெருக்க ஆற்றலின் முதல் வெளிப்பாட்டைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மாண்பில் முதன்மையானவன், வல்லமையில் முதன்மையானவன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹרִי
  choice: என் முதற்பேறானவன்
  rationale: பிறப்பு வரிசையையும் முதற்பேற்றுக்குரிய குடும்ப நிலையையும் ஒருங்கே காக்கிறது.
- source_word: כֹּחִי
  choice: என் வலிமை
  rationale: தந்தையின் உடல் மற்றும் உயிர்ப்பாற்றலைக் குறிக்கும் கவிதைச் சூழலில் இயல்பான, நேரடியான சொல்.
- source_word: רֵאשִׁית אוֹנִי
  choice: என் ஆற்றலின் முதற்கனி
  rationale: மகன் தந்தையின் இனப்பெருக்க ஆற்றலின் முதல் வெளிப்பாடு என்ற உவமைநயத்தை, தேவையற்ற மருத்துவத் தொனியின்றி வெளிப்படுத்துகிறது.
- source_word: יֶתֶר שְׂאֵת
  choice: மதிப்பில் மேம்பட்டவன்
  rationale: יֶתֶר என்பதன் மேன்மை/மிகுதி உணர்வையும் שְׂאֵת என்பதன் உயர்வு, மதிப்பு சார்ந்த பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יֶתֶר עָז
  choice: வல்லமையில் மேம்பட்டவன்
  rationale: முந்தைய தொடரின் இணை அமைப்பைக் காத்து, עָז என்பதன் வலிமை அல்லது வல்லமைப் பொருளைத் தெளிவாகக் கூறுகிறது.
- source_word: אַתָּה
  choice: நீ ... நீயே
  rationale: எபிரேய மொழியின் வெளிப்படையான, வலியுறுத்தப்பட்ட நேரடி அழைப்பைத் தமிழில் இயல்பாக உணர்த்துகிறது.
