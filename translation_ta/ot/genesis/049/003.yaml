translation_notes:
  register: நவீனத் தரத் தமிழில், தந்தை மகனை நேரடியாக அழைக்கும் கவிதைநயமும் இரு இணையான இறுதித் தொடர்களும் காக்கப்பட்டுள்ளன. “முதற்கனி” உவமைமிக்க மூலச்சொற்றொடரை இயல்பாகத் தருகிறது; அடிக்குறிப்புகள் உண்மையான சொற்பொருள் மாற்றுகளைப் பதிவு செய்கின்றன.
