  text: מֵ/אֵ֨ל אָבִ֜י/ךָ וְ/יַעְזְרֶ֗/ךָּ וְ/אֵ֤ת שַׁדַּי֙ וִ/יבָ֣רְכֶ֔/ךָּ בִּרְכֹ֤ת שָׁמַ֨יִם֙ מֵ/עָ֔ל בִּרְכֹ֥ת תְּה֖וֹם רֹבֶ֣צֶת תָּ֑חַת בִּרְכֹ֥ת שָׁדַ֖יִם וָ/רָֽחַם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/025.yaml
  text: by the God of your father[a], who will help you, and by the Almighty, who will bless you with blessings of heaven above, blessings of the deep lying beneath[b], blessings of breasts and womb.
translation:
  language: ta
  text: உன் தந்தையின் இறைவன் உனக்கு உதவுவார்[a]; சர்வவல்லவர் உன்னை ஆசீர்வதிப்பார்—மேலுள்ள வானத்தின் ஆசீர்வாதங்களால், கீழே படுத்திருக்கும் ஆழத்தின் ஆசீர்வாதங்களால்[b], மார்பகங்களினதும் கருப்பையினதும் ஆசீர்வாதங்களால்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன் தந்தையின் இறைவனிடமிருந்து … சர்வவல்லவரோடு” என்றும் மொழிபெயர்க்கலாம். “உன் தந்தையின் இறைவன்” என்பதற்கு முன் வரும் எபிரெய முன்னிடைச்சொல்லும், “சர்வவல்லவர்” என்பதற்கு முன் வரும் துகளும் மிகவும் சுருக்கமான இலக்கண அமைப்பில் உள்ளன; அவை மூலம், செயலாற்றுபவர் அல்லது நெருங்கிய இணைப்புரை ஆகியவற்றைக் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: “கீழே பதுங்கியிருக்கும் ஆழம்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை “படுத்திருத்தல்” அல்லது “பதுங்கியிருத்தல்” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵל אָבִיךָ
  choice: உன் தந்தையின் இறைவனாலே
  rationale: מִן முன்னிடைச்சொல் இங்கு மூலம் அல்லது செயலாற்றுபவரைக் குறிக்கக்கூடும். தமிழில் ‘இறைவனாலே’ என்பது அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது; ‘உன் தந்தை’ என்பது யோசேப்பிடம் பேசப்படும் ஒருமை வடிவைத் தக்கவைக்கிறது.
- source_word: יַעְזְרֶךָ
  choice: உனக்கு உதவி கிடைக்கும்
  rationale: எபிரெய வினை இறைவன் உதவுவார் என்ற வாக்குறுதியைக் குறிக்கிறது. முன்னுள்ள கருவிப்பொருள் அமைப்பை இயல்பான தமிழில் இணைப்பதற்காகப் பெயர்ச்சொல் சார்ந்த வாக்கியமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שַׁדַּי
  choice: சர்வவல்லவர்
  rationale: இறைப்பட்டத்தை ஒலிபெயர்க்காமல் அதன் பொருளைத் தரும், நவீனத் தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் மரியாதையான வடிவம்.
- source_word: וִיבָרְכֶךָ
  choice: நீ ஆசீர்வதிக்கப்படுவாய்
  rationale: சர்வவல்லவரே ஆசீர்வாதத்தின் மூலம் என்பதைத் தெளிவாகவும் இயல்பாகவும் காட்டும் தமிழ்ச் செயப்பாட்டு அமைப்பு; ஆசீர்வாதச் சூழலின் எதிர்கால வலிமையும் தக்கவைக்கப்படுகிறது.
- source_word: בִּרְכֹת שָׁמַיִם מֵעָל
  choice: மேலே வானத்தின் ஆசீர்வாதங்கள்
  rationale: ‘மேலே/கீழே’ என்ற செங்குத்தான கவிதைப் படிமத்தையும், ஆசீர்வாதங்களின் பன்மையையும் தக்கவைக்கிறது.
- source_word: תְּהוֹם רֹבֶצֶת תָּחַת
  choice: கீழே படுத்திருக்கும் ஆழம்
  rationale: תְּהוֹם என்பது ஆழமான நீர்ப்பரப்பை அல்லது ஆதிகால ஆழத்தைச் சுட்டுகிறது. רֹבֶצֶת என்பதன் நேரடிப் படிமமான ‘படுத்திருக்கும்’ என்பதும் மேலே/கீழே இணையும் கவிதை ஒப்புமையும் பாதுகாக்கப்படுகின்றன.
- source_word: שָׁדַיִם
  choice: மார்பகங்கள்
  rationale: ஊட்டத்தையும் வளத்தையும் குறிக்கும் பன்மை உடலுறுப்புப் பெயரைத் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: רָחַם
  choice: கருப்பை
  rationale: மார்பகங்களுடன் இணைந்து இனப்பெருக்க வளத்தைக் குறிக்கும் உடலுறுப்பை நவீனத் தமிழில் நேரடியாகக் குறிக்கிறது.
theological_decisions:
- issue: שַׁדַּי என்ற இறைப்பட்டத்தின் மொழிபெயர்ப்பு
  choice: சர்வவல்லவர்
  alternative: ஷத்தாய்
  rationale: இது பெயராக அல்லாமல் இறைப்பட்டமாகச் செயல்படுவதால், அதன் பொருளைத் தமிழில் மொழிபெயர்ப்பது வாசகருக்கு அதன் வலிமையைத் தெளிவாகத் தெரிவிக்கிறது; கூடுதல் கோட்பாட்டுப் பொருள் சேர்க்கப்படவில்லை.
- issue: முதல் இரண்டு இறைக்குறிப்புகளின் இலக்கண உறவு
  choice: இறைவனாலே ... சர்வவல்லவராலே
  alternative: இறைவனிடமிருந்து ... சர்வவல்லவரோடு
  rationale: சுருக்கமான எபிரெய தொடரில் மூலம், செயலாற்றுபவர் அல்லது நெருங்கிய இணைப்புரை ஆகிய உறவுகள் சாத்தியம். முதன்மை உரை தமிழில் இயல்பான செயலாற்றுபவர்/மூலம் என்ற வாசிப்பைத் தருகிறது; மாற்று வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைத் தன்மையையும் மேலே/கீழே என்ற இணை அமைப்பையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. சுருக்கமான எபிரெய இலக்கணத்தைத் தமிழில் வாசிக்கத்தக்கதாக மாற்ற செயப்பாட்டு அமைப்பு பயன்படுத்தப்பட்டுள்ளது; உடல் சார்ந்த வளப் படிமங்கள் மறைக்கப்படாமல் நேரடியாகத் தக்கவைக்கப்பட்டுள்ளன.
