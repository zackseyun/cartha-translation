  text: The field and the cave that is in it were purchased from the sons of Heth[a][b].
translation:
  language: ta
  text: அந்த நிலத்தையும் அதிலுள்ள குகையையும் வாங்கிப் பெற்றது ஏத்தின் மகன்களிடமிருந்து[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏத்தியரிடமிருந்து.” எபிரெயத்தில், “ஏத்தின் மகன்களிடமிருந்து” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அந்த நிலமும் அதிலுள்ள குகையும் ஏத்தின் மகன்களிடமிருந்து வாங்கப்பட்டவை.”
    reason: previous_rendering
lexical_decisions:
- source_word: מִקְנֵה
  choice: வாங்கப்பட்டவை
  rationale: இந்தப் பெயர்ச்சொல் வாங்கிப் பெறப்பட்ட சொத்தை அல்லது வாங்கிய செயலைக் குறிக்கிறது. எபிரெய பெயர்ச்சொல் வாக்கியத்தின் பொருளை இயல்பான நவீனத் தமிழில் வினை வடிவில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַשָּׂדֶה
  choice: அந்த நிலம்
  rationale: அடக்க இடம் அமைந்துள்ள நிலச்சொத்தை இச்சூழலில் ‘நிலம்’ இயல்பாகவும் துல்லியமாகவும் குறிக்கிறது.
- source_word: וְהַמְּעָרָה
  choice: அதிலுள்ள குகை
  rationale: குகையை நிலத்துடன் இணைப்பதோடு, அடுத்துவரும் உறவுத் தொடரின் பொருளையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: אֲשֶׁר בּוֹ
  choice: அதிலுள்ள
  rationale: குகை அந்த நிலத்திற்குள் இருப்பதைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: מֵאֵת
  choice: இடமிருந்து
  rationale: வாங்கிய சொத்து யாரிடமிருந்து பெறப்பட்டது என்பதைக் குறிக்கும் மூலத்தொடருக்கு இயல்பான தமிழ் இணை.
- source_word: בְּנֵי חֵת
  choice: ஏத்தின் மகன்கள்
  rationale: எபிரெய மொழியின் குடும்பவழி இனப்பெயரைக் கட்டமைப்புடன் பாதுகாக்கிறது; சூழல்சார் ‘ஏத்தியர்’ என்பது அடிக்குறிப்பில் மாற்றாக வழங்கப்படுகிறது.
