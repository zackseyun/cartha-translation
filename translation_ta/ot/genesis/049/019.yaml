revisions:
- from: காதை ஒரு கொள்ளைக் கூட்டம் தாக்கும்[a]; ஆனால் அவன் அவர்களைப் பின்னாலிருந்து தாக்குவான்[b].
  to: காதை ஒரு கொள்ளைக் கூட்டம் தாக்கும்[a]; ஆனால் அவன் அவர்களைப் பின்தொடர்ந்து தாக்குவான்[b].
  rationale: The revision renders the final Hebrew expression with an idiomatic Tamil pursuit image (“அவர்களைப் பின்தொடர்ந்து”), corresponding to “at their heels,” and leaves the alternative rear-attack sense in the footnote. It also clarifies the Hebrew wordplay and the literal ‘heel’ expression without over-literalizing the Tamil main text.
