base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/019.yaml
  text: Gad—a raiding band will raid him[b][a], but he will raid at their heels.
translation:
  language: ta
  text: காதை ஒரு கொள்ளைக் கூட்டம் தாக்கும்[a]; ஆனால் அவன் அவர்களைப் பின்தொடர்ந்து தாக்குவான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘காத்,’ ‘கொள்ளைக் கூட்டம்,’ ‘தாக்கும்’ என்பவற்றுக்கான சொற்கள் ஒரே வேரை அடிப்படையாகக் கொண்ட சொல்விளையாட்டை உருவாக்குகின்றன (gad / gedud / yagud).
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘அவன் குதிகாலில் [அவர்களைத்] தாக்குவான்.’ இந்த இறுதிச் சொற்றொடர் அவர்களைப் பின்தொடர்ந்து தாக்குவதையோ, பின்னாலிருந்து தாக்குவதையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: גָּד
  choice: காத்
  rationale: யாக்கோபின் மகன் மற்றும் அவனிடமிருந்து தோன்றிய கோத்திரத்தின் பெயர்; நவீனத் தமிழ் ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப தரப்பட்டுள்ளது.
- source_word: גְּדוּד
  choice: ஒரு கொள்ளைக் கூட்டம்
  rationale: இச்சொல் கொள்ளையிடும் ஆயுதக் குழுவையோ படைக்குழுவையோ குறிக்கிறது. சூழலில் பகைமைமிக்க திடீர்த் தாக்குதல் முக்கியமானதால் ‘கொள்ளைக் கூட்டம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְגוּדֶנּוּ
  choice: அவனைத் தாக்கும்
  rationale: גדד வேரின் வினைச்சொல்; இங்கு கொள்ளையிடும் படையெடுப்பு அல்லது தாக்குதல் என்ற பொருள். தமிழில் ஒருவரைக் ‘கொள்ளையிடும்’ என்பது இயல்பாக இல்லாததால் ‘தாக்கும்’ எனத் தரப்பட்டுள்ளது.
- source_word: וְהוּא
  choice: ஆனால் அவன்
  rationale: ו இணைப்புச் சொல்லாக இருந்தாலும், தாக்கப்படுவதிலிருந்து பதில்தாக்குதலுக்குத் திரும்பும் கருத்து வேறுபாட்டைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘ஆனால்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יָגֻד
  choice: தாக்குவான்
  rationale: முந்தைய வினைச்சொல்லின் அதே גדד வேர்; எதிர்த் தாக்குதலைத் தெளிவாகக் காட்ட ஒரே தமிழ் வினைச்சொல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: עָקֵב
  choice: பின்னாலிருந்து
  rationale: சொற்பொருள் ‘குதிகால்’; இங்கு எதிரியைப் பின்னால் தாக்குவதையோ பின்தொடர்ந்து தாக்குவதையோ குறிக்கும் இடவழக்காகப் புரிந்துகொள்ளலாம். இயல்பான தமிழில் ‘பின்னாலிருந்து’ எனத் தரப்பட்டுள்ளது.
