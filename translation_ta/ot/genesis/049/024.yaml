  text: Yet his bow remained steady, and his arms were made agile by the hands of the Mighty One of Jacob; from there is the Shepherd, the Stone of Israel.
translation:
  language: ta
  text: ஆனாலும் அவனுடைய வில் உறுதியாக நிலைத்திருந்தது; யாக்கோபின் வல்லவருடைய கைகளால் அவனுடைய புயங்கள் சுறுசுறுப்பாயின. அங்கிருந்து மேய்ப்பர், இஸ்ரவேலின் கல்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் இறுதிப் பகுதி சுருக்கமாகவும் இலக்கண ரீதியாகத் தெளிவற்றதாகவும் உள்ளது. இதை, “அங்கிருந்து இஸ்ரவேலின் மேய்ப்பர், இஸ்ரவேலின் கல்” என்றும் பிரித்துப் புரிந்துகொள்ளலாம்.
    reason: מִשָּׁם רֹעֶה אֶבֶן יִשְׂרָאֵל என்ற தொடரின் விவாதத்திற்குரிய சொல்-இணைப்பு மற்றும் பொருளைத் திறந்தவாறே காக்கிறது.
lexical_decisions:
- source_word: וַתֵּשֶׁב בְּאֵיתָן קַשְׁתּוֹ
  choice: அவனுடைய வில் உறுதியாக நிலைத்திருந்தது
  rationale: בְּאֵיתָן என்பது நிலைத்த வலிமையையும் உறுதியையும் குறிக்கிறது; தமிழில் இயல்பாகவும் உருவகத்தைப் பேணியும் மொழிபெயர்க்கப்பட்டது.
- source_word: וַיָּפֹזּוּ זְרֹעֵי יָדָיו
  choice: அவனுடைய கரங்கள் வலிமை பெற்றன
  rationale: פזז என்பதன் அரிதான வடிவம் இங்கு கரங்கள் சுறுசுறுப்பாக அல்லது பலமாக்கப்பட்டதைக் குறிக்கலாம்; போர்ச் சூழலில் இயல்பான தமிழுக்காக ‘வலிமை பெற்றன’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲבִיר יַעֲקֹב
  choice: யாக்கோபின் வல்லவர்
  rationale: தேவனைச் சுட்டும் பாரம்பரியத் தெய்வீகப் பட்டத்தின் வலிமையை நேரடியாகப் பேணுகிறது.
- source_word: רֹעֶה אֶבֶן יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மேய்ப்பரும் கற்பாறையும்
  rationale: இரு உருவகப் பட்டங்களையும் இணைத்துப் பேணுகிறது; אֶבֶן என்பதற்கு பாதுகாப்பும் நிலைத்தன்மையும் உணர்த்தும் ‘கற்பாறை’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: מִשָּׁם என்பதன் தொடர்பும் இறுதி சொற்றொடரின் இலக்கணமும்
  choice: அங்கிருந்தே இஸ்ரவேலின் மேய்ப்பரும் கற்பாறையும் வருகிறார்
  alternative: அங்கிருந்து—இஸ்ரவேலின் மேய்ப்பர், கல் / யாக்கோபின் வல்லவரிடமிருந்து
  rationale: எபிரேயச் சொற்றொடர் சுருக்கமானதும் இலக்கண ரீதியாகத் தெளிவற்றதும் ஆகும். ‘அங்கிருந்தே’ என்பதை முந்தைய தெய்வீக உதவியின் மூலத்துடன் இணைக்கிறது; எனினும் வேறு பிரிப்புகள் சாத்தியம் என்பதால் அடிக்குறிப்பில் ambiguity வெளிப்படையாக வைக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவித்துவ உருவகங்களையும் கண்ணியமான தொனியையும் பேணியபடி, பொதுவாசகர்களுக்குப் புரியும் இயல்பான வாக்கிய அமைப்பு பயன்படுத்தப்பட்டது.
