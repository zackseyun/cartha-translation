  text: There they buried Abraham and Sarah his wife; there they buried Isaac and Rebekah his wife; and there I buried Leah.
translation:
  language: ta
  text: அங்கே ஆபிரகாமையும் அவருடைய மனைவி சாராளையும் அடக்கம் செய்தார்கள்; அங்கே ஈசாக்கையும் அவருடைய மனைவி ரெபெக்காளையும் அடக்கம் செய்தார்கள்; அங்கே நான் லேயாளை அடக்கம் செய்தேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמָּה
  choice: அங்கே
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட குகையைக் குறிக்கும் இடவினையடை; மூன்று முறை வரும் எபிரெயச் சொல்லின் மீளுருவைத் தமிழிலும் காக்கிறது.
- source_word: קָבְרוּ
  choice: அடக்கம் செய்தார்கள்
  rationale: கால் நிறைவுவினை, மூன்றாம் நபர் பன்மை; குறிப்பிடப்படாத மனிதச் செய்பவர்களை மறைக்காமல் செயப்பாட்டு வடிவில் மொழிபெயர்க்கிறது.
- source_word: אִשְׁתּוֹ
  choice: அவருடைய மனைவி
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டுடன் உள்ள பெயர்ச்சொல்லின் இயல்பான நவீனத் தமிழ் வடிவம்; சாராளுக்கும் ரெபெக்காளுக்கும் இதே அமைப்பு மீண்டும் தரப்படுகிறது.
- source_word: קָבַרְתִּי
  choice: நான் ... அடக்கம் செய்தேன்
  rationale: கால் நிறைவுவினை, முதல் நபர் ஒருமை; லேயாளை அடக்கம் செய்ததில் யாக்கோபின் சொந்தச் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: קָבְרוּ ... קָבְרוּ ... קָבַרְתִּי
  choice: அடக்கம் செய்தார்கள் ... அடக்கம் செய்தார்கள் ... அடக்கம் செய்தேன்
  rationale: קבר என்ற ஒரே வேர்ச்சொல்லின் மூவகை மீளுருவைத் தமிழிலும் ஒரே சொற்றொடரால் பாதுகாக்கிறது.
- source_word: אֶת
  choice: '[தனி சொல்லாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது உறுதியான நேரடிச் செயப்படுபொருளைக் குறிக்கும் எபிரெய இலக்கணக் குறியீடு; தமிழில் தனிச் சொல்லாகத் தேவையில்லை.
