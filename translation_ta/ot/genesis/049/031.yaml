translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெய மூலத்தின் இணையான மூன்று உட்பிரிவுகளும் ‘அங்கே’ மற்றும் ‘அடக்கம் செய்த...’ என்ற மீளுருக்களும் பாதுகாக்கப்பட்டுள்ளன. பாரம்பரியத் தமிழ் வேதாகமப் பெயர்வடிவங்களான ஆபிரகாம், சாராள், ஈசாக்கு, ரெபெக்காள், லேயாள் பயன்படுத்தப்பட்டுள்ளன.
