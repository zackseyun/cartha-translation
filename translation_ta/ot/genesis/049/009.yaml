  to: யூதா ஒரு சிங்கக்குட்டி. இரையிலிருந்து, என் மகனே, நீ மேலேறினாய். அவன் குனிந்து படுத்தான்; சிங்கத்தைப் போலவும் பெண் சிங்கத்தைப் போலவும்[a]—அவனை எழுப்புவான் யார்?[b]
