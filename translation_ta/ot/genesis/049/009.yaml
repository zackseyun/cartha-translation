source:
  edition: WLC
  text: גּ֤וּר אַרְיֵה֙ יְהוּדָ֔ה מִ/טֶּ֖רֶף בְּנִ֣/י עָלִ֑יתָ כָּרַ֨ע רָבַ֧ץ כְּ/אַרְיֵ֛ה וּ/כְ/לָבִ֖יא מִ֥י יְקִימֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/009.yaml
  text: Judah is a lion’s cub[a]; from the prey, my son, you have gone up. He crouched, he lay down like a lion[b], and like a lioness—who will rouse him?
translation:
  language: ta
  text: யூதா ஒரு சிங்கக்குட்டி. இரையிலிருந்து, என் மகனே, நீ மேலேறினாய். அவன் குனிந்து படுத்தான்; சிங்கத்தைப் போலவும் பெண் சிங்கத்தைப் போலவும்[a]—அவனை எழுப்புவான் யார்?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வலிமைமிக்க சிங்கத்தைப் போலவும்.’ இங்கு வரும் எபிரெயச் சொல், இதற்கு முன் ‘சிங்கம்’ என்று மொழிபெயர்க்கப்பட்ட சொல்லிலிருந்து வேறுபட்டது; அது பெண் சிங்கத்தையோ, முழுவளர்ச்சி பெற்ற வலிமைமிக்க சிங்கத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: யூதாவைப் பற்றிய இந்தச் சிங்க உருவகம் பிற்கால அரச மற்றும் மேசிய நம்பிக்கைகளுடன் தொடர்புபடுத்திப் படிக்கப்படுகிறது. ஆனால் இவ்வசனம் நேரடியாக யாக்கோபு யூதாவுக்குக் கூறும் ஆசீர்வாதமாக உள்ளது.
    reason: cross_reference
lexical_decisions:
- source_word: גּוּר אַרְיֵה
  choice: சிங்கக்குட்டி
  rationale: גּוּר என்பது இளம் விலங்கைக் குறிக்கிறது; אַרְיֵה உடன் சேர்ந்து ‘சிங்கத்தின் குட்டி’ என்ற உருவகத்தைத் தருகிறது. ‘சிங்கக்குட்டி’ இயல்பான, சுருக்கமான நவீனத் தமிழ்.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: தனிநபரையும் அவரிடமிருந்து தோன்றும் கோத்திரத்தையும் குறிக்கும் பெயர்; வழக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִטֶּרֶף
  choice: இரையிலிருந்து
  rationale: טֶרֶף என்பது வேட்டையாடிப் பிடிக்கப்பட்ட அல்லது கிழிக்கப்பட்ட இரையைக் குறிக்கிறது. ‘இரையிலிருந்து’ என்பது מִן முன்னிடைச்சொல்லின் ‘இருந்து’ என்ற பொருளையும் சிங்க உருவகத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: בְּנִי
  choice: என் மகனே
  rationale: யாக்கோபு யூதாவை நேரடியாக அழைப்பதைத் தமிழில் இயல்பான விளிவேற்றுமையுடன் வெளிப்படுத்துகிறது.
- source_word: עָלִיתָ
  choice: நீ மேலேறினாய்
  rationale: வினையின் மேல்நோக்கிய இயக்கத்தைப் பாதுகாக்கிறது; இரையைவிட்டு பாதுகாப்பான இடத்துக்குச் செல்லும் சிங்கம் என்ற சாத்தியமான காட்சியை மொழிபெயர்ப்பில் விளக்கமாகச் சேர்க்கவில்லை.
- source_word: כָּרַע
  choice: அவன் குனிந்து
  rationale: விலங்கு உருவகச் சூழலில் உடலைத் தாழ்த்திக் குனிவதைக் குறிக்கிறது; வழிபாட்டுக்குரிய வணக்கத்தைத் தவறாக உணர்த்தாது.
- source_word: רָבַץ
  choice: படுத்துக்கொண்டான்
  rationale: ஓர் விலங்கு படுத்து ஓய்வெடுப்பதற்கான வழக்கமான வினை; நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: כְּאַרְיֵה
  choice: சிங்கத்தைப் போல
  rationale: כְּ ஒப்புமை முன்னொட்டையும் אַרְיֵה என்பதன் வழக்கமான ‘சிங்கம்’ என்ற பொருளையும் நேரடியாக வழங்குகிறது.
- source_word: וּכְלָבִיא
  choice: பெண் சிங்கத்தைப் போலவும்
  rationale: לָבִיא என்பதைக் ‘பெண் சிங்கம்’ என்றும் ‘பெரிய/வலிமைமிக்க சிங்கம்’ என்றும் புரிந்துகொள்ளலாம். முதன்மை உரையில் முந்தைய אַרְיֵה இலிருந்து சொல்வேறுபாட்டைக் காட்ட ‘பெண் சிங்கம்’ தேர்ந்தெடுக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מִי יְקִימֶנּוּ
  choice: அவனை எழுப்புகிறவன் யார்?
  rationale: קום என்பதன் காரணவினை வடிவம் இங்கு படுத்திருக்கும் சிங்கத்தை எழச் செய்வதை, அதாவது கிளறி எழுப்புவதை, குறிக்கிறது. ‘துணிகிறவன் யார்?’ என்ற உட்கருத்தை உரையில் சேர்க்காமல் கேள்வியின் நேரடி வடிவம் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: யூதாவின் சிங்க உருவகம் கோத்திரத்தைக் குறிக்கிறதா, மேசியாவைக் குறிக்கிறதா?
  choice: முதன்மை உரை யாக்கோபு யூதாவுக்குக் கூறும் ஆசீர்வாதமாகவே மொழிபெயர்க்கப்பட்டுள்ளது; மேசியாவைப் பற்றிய நேரடி கூற்று சேர்க்கப்படவில்லை.
  alternative: பிற்கால அரச மற்றும் மேசிய எதிர்பார்ப்புகளோடு இந்தச் சிங்க உருவகத்தை முன்நிழலாக அல்லது மாதிரியாக இணைத்துப் படித்தல்.
  rationale: இவ்வசனம் நேரடியாக யூதாவைச் சிங்கத்தின் வலிமை மற்றும் அச்சமின்மையோடு ஒப்பிடுகிறது. பிற்கால வேதாகமப் பகுதிகள் இதனை அரச அல்லது மேசிய நம்பிக்கையுடன் தொடர்புபடுத்த இடமளித்தாலும், அந்த வளர்ச்சியை இவ்வசனத்தின் மொழிபெயர்ப்புக்குள் சேர்ப்பது மூல உரை கூறுவதைத் தாண்டிவிடும்.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. கவிதைநடையின் சுருக்கமும் சிங்க உருவகத்தின் இயக்கமும் பாதுகாக்கப்பட்டுள்ளன. ‘இரையிலிருந்து ... மேலேறினாய்’ என்ற சற்றே திறந்த அமைப்பு விளக்கத்தைத் திணிக்காமல் மூலத்தின் பொருள் இடைவெளியை வைத்திருக்கிறது; முதல் இரு வாக்கியங்களில் இரண்டாம் நபரும் பின்னர் மூன்றாம் நபரும் வரும் எபிரெயக் கவிதை மாற்றமும் அப்படியே வைக்கப்பட்டுள்ளது.
