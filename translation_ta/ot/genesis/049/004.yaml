source:
  edition: WLC
  text: פַּ֤חַז כַּ/מַּ֨יִם֙ אַל תּוֹתַ֔ר כִּ֥י עָלִ֖יתָ מִשְׁכְּבֵ֣י אָבִ֑י/ךָ אָ֥ז חִלַּ֖לְתָּ יְצוּעִ֥/י עָלָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/004.yaml
  text: Unstable as water[a], you shall not excel, because you went up to your father’s bed; then you defiled it—he went up to my couch.
translation:
  language: ta
  text: தண்ணீரைப்போல் நிலையற்றவனே,[a] நீ மேன்மை பெறமாட்டாய்; ஏனெனில் உன் தந்தையின் படுக்கைக்கு நீ ஏறினாய். அப்போது என் படுக்கையைத் தீட்டுப்படுத்தினாய்—அவன் ஏறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் இயல்பாக: “அப்போது என் படுக்கையைத் தீட்டுப்படுத்தினாய்—நீ அதற்கு ஏறினாய்.” எபிரெய இறுதிக் கூறு திடீரென மூன்றாம் நபருக்கு மாறி, “அவன் ஏறினான்” என்கிறது; இது ரூபனைக் குறிக்கும் வியப்புணர்வுள்ள மறுகூற்றாக இருக்கலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: פַּחַז
  choice: கட்டுப்பாடற்றவனே
  rationale: இந்தச் சொல் நிலையின்மை, பொறுப்பற்ற துணிவு, அடங்காத துடிப்பு ஆகிய அர்த்தங்களைத் தருகிறது. தண்ணீர் என்ற உவமையோடு இயல்பாகச் சேரவும் ரூபனின் ஒழுக்கக் கட்டுப்பாடின்மையை வெளிப்படுத்தவும் இத்தேர்வு உதவுகிறது.
- source_word: כַּמַּיִם
  choice: தண்ணீரைப்போல்
  rationale: கட்டுப்படுத்தப்படாமல் ஓடும் தண்ணீரின் இயல்பை நேரடியான, இயல்பான தமிழ் உவமையாகத் தருகிறது.
- source_word: אַל תּוֹתַר
  choice: நீ முதன்மை பெறமாட்டாய்
  rationale: יתר என்ற வேர்ச்சொல் இங்கு தலைப்பேறு சார்ந்த மேன்மையையோ முன்னுரிமையையோ குறிக்கிறது. தடை வடிவத்தின் விளைவுசார் பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: כִּי עָלִיתָ
  choice: ஏனெனில் ... நீ ஏறினாய்
  rationale: כִּי என்பதன் காரணப் பொருளையும், பாலியல் குற்றத்தை மறைமுகமாகச் சுட்டும் עָלָה என்ற வினையின் நேரடி உருவகத்தையும் பாதுகாக்கிறது.
- source_word: מִשְׁכְּבֵי אָבִיךָ
  choice: உன் தந்தையின் படுக்கைக்கு
  rationale: எபிரெயத்தில் பன்மை வடிவம் இருந்தாலும், திருமணப் படுக்கையைக் குறிக்கும் தமிழ் வழக்கில் ஒருமை இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: חִלַּלְתָּ
  choice: தீட்டுப்படுத்தினாய்
  rationale: புனிதத்தன்மையைக் கெடுத்தல் அல்லது அசுத்தப்படுத்துதல் என்ற வலிமையான ஒழுக்கப் பொருளை இந்தக் குடும்ப மற்றும் பாலியல் சூழலில் தக்கவைக்கிறது.
- source_word: יְצוּעִי
  choice: என் படுக்கை
  rationale: முதல் நபர் உரிமைப்பெயரைப் பாதுகாத்து, படுக்கும் இடம் என்ற பொருளை சாதாரண நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: עָלָה
  choice: அவன் ... ஏறினான்
  rationale: மசோரா உரையிலுள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை வடிவத்தை அப்படியே காத்து, இறுதிக் கூறின் திடீர் இலக்கண மாற்றத்தையும் உண்மையான தெளிவின்மையையும் மறைக்காமல் விடுகிறது.
theological_decisions:
- issue: ரூபனின் பாலியல் குற்றத்தைக் குறிக்கும் மறைமுக மொழியும் அதன் ஒழுக்க மதிப்பீடும்
  choice: “உன் தந்தையின் படுக்கைக்கு நீ ஏறினாய்” என்ற மூலத்தின் மறைமுகமான ஆனால் புரியக்கூடிய மொழியையும், “தீட்டுப்படுத்தினாய்” என்ற கண்டனத்தையும் வைத்திருத்தல்
  alternative: “உன் தந்தையின் மறுமனைவியுடன் உறவுகொண்டாய்” என்று நிகழ்வை வெளிப்படையாக விரித்துரைத்தல்
  rationale: இவ்வசனம் தானே பயன்படுத்தும் மறைமுக நடையைப் பாதுகாக்கிறது; ஆதியாகமம் 35:22-இலிருந்து விவரங்களை இவ்வரிக்குள் சேர்க்காமல் குற்றத்தின் தீவிரத்தைத் தெளிவாக்குகிறது.
- issue: இறுதிக் கூறான עָלָה-வின் நபர் மாற்றம்
  choice: மசோரா உரையின் மூன்றாம் நபரை “அவன் என் படுக்கைக்கு ஏறினான்” என்று முதன்மை உரையில் வைத்திருத்தல்
  alternative: “என் படுக்கைக்கு நீ ஏறினாய்” என்று இரண்டாம் நபராகச் சீராக்குதல்
  rationale: எபிரெய இறுதிக் கூறு இலக்கண ரீதியாகத் திடீரென மூன்றாம் நபருக்கு மாறுகிறது. அதை அமைதியாகச் சீராக்காமல் முதன்மை உரையில் பாதுகாத்து, இயல்பாக்கப்பட்ட வாசிப்பை அடிக்குறிப்பில் தருவது மூலத்தின் தெளிவின்மையை மதிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவமான கண்டனத்தின் கண்ணியத்தையும் தீவிரத்தையும் காக்கும் நடை. “கட்டுப்பாடற்றவனே” என்பது தனியே நிற்கும் பெயர்ச்சொல் வடிவத்தை இயல்பான நேரடி அழைப்பாக அளிக்கிறது. இறுதி மூன்றாம் நபர் மாற்றம் நோக்கத்துடன் சீராக்கப்படவில்லை; அதன் இயல்பான மாற்று அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
