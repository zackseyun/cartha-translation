revisions:
- from: தண்ணீரைப்போல் கட்டுப்பாடற்றவனே,[a] நீ முதன்மை பெறமாட்டாய்; ஏனெனில், உன் தந்தையின் படுக்கைக்கு நீ ஏறினாய். அப்போது அதைத் தீட்டுப்படுத்தினாய்—அவன் என் படுக்கைக்கு ஏறினான்.
  to: தண்ணீரைப்போல் நிலையற்றவனே,[a] நீ மேன்மை பெறமாட்டாய்; ஏனெனில் உன் தந்தையின் படுக்கைக்கு நீ ஏறினாய். அப்போது என் படுக்கையைத் தீட்டுப்படுத்தினாய்—அவன் ஏறினான்.
  rationale: The revision restores ‘என் படுக்கை’ as the object of ‘தீட்டுப்படுத்தினாய்,’ exactly where the Hebrew places the first-person possessive, and leaves the final ‘அவன் ஏறினான்’ syntactically abrupt to preserve the Masoretic third-person shift and ambiguity. The footnote provides the smoother second-person alternative without silently resolving the source text. ‘நிலையற்றவனே’ and ‘மேன்மை பெறமாட்டாய்’ give a more source-focused, natural Tamil rendering of the opening characterization and the loss of preeminence.
