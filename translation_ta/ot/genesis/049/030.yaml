base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/030.yaml
  text: in the cave that is in the field of Machpelah[a], which is opposite Mamre, in the land of Canaan[d][c][b], which Abraham bought with the field from Ephron the Hittite as a burial property.
translation:
  language: ta
  text: கானான் நாட்டில், மம்ரேக்கு எதிரே[a] உள்ள மக்பேலா வயலிலிருக்கும் குகையில்—அந்த வயலை ஆபிரகாம் ஏத்தியனாகிய எப்ரோனிடமிருந்து அடக்கத்திற்கான சொத்தாக வாங்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மம்ரேக்கு முன்பாக’ அல்லது ‘மம்ரேவை நோக்கியவாறு’; எபிரெயச் சொற்றொடர் மம்ரேயுடன் தொடர்புடைய இடஅமைவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמְּעָרָה
  choice: குகையில்
  rationale: בְּ முன்னொட்டும் குறிப்பிட்ட பெயர்ச்சொல்லும் இடத்தைக் குறிக்கின்றன; நவீன தமிழில் ‘குகையில்’ இயல்பான, துல்லியமான மொழிபெயர்ப்பு.
- source_word: אֲשֶׁר בִּשְׂדֵה הַמַּכְפֵּלָה
  choice: மக்பேலா வயலிலிருக்கும்
  rationale: குகை எந்த வயலில் உள்ளது என்பதை உறவுத்தொடர் குறிப்பிடுகிறது; மக்பேலா இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: மம்ரேக்கு எதிரே
  rationale: இந்த எபிரெய இடவழக்கு மம்ரேக்கு எதிரே அல்லது அதை நோக்கிய இடத்தைக் குறிக்கிறது; வெறும் அருகாமை என்று குறுக்காமல் இடவுறவைப் பாதுகாக்கிறது.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: கானான் நாட்டில்
  rationale: புவியியல் குறிப்பை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: அந்த வயலை ஆபிரகாம் ... வாங்கியிருந்தார்
  rationale: אֵת הַשָּׂדֶה என்பது ‘வயல்’ என்பதையே வாங்குதல் வினையின் நேரடிச் செயப்படுபொருளாகக் காட்டுகிறது. நீண்ட எபிரெய உறவுத்தொடரின் பொருளைத் தெளிவாக்க ‘அந்த வயலை’ என மீளச் சுட்டப்பட்டுள்ளது.
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: ஏத்தியனான எப்ரோனிடமிருந்து
  rationale: מֵאֵת விற்பவராகிய மூலநபரைக் குறிக்கிறது; எப்ரோன் பெயராக ஒலிபெயர்க்கப்பட்டு, ‘ஏத்தியன்’ இன அடையாளமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: அடக்கத்திற்குரிய சொத்தாக
  rationale: אֲחֻזָּה என்பது சட்டபூர்வமாக உடைமையாக்கப்பட்ட நிலச் சொத்தைச் சுட்டுகிறது; קֶבֶר அதன் அடக்கப் பயன்பாட்டைக் குறிப்பிடுகிறது. இந்த மொழிபெயர்ப்பு இரு கூறுகளையும் வாசிக்க எளிய தமிழில் காக்கிறது.
