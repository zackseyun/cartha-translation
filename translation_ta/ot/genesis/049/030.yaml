translation_notes:
  register: நவீன நிலையான தமிழில், முந்தைய வசனத்துடன் தொடரும் வாக்கியத் துணுக்காகவே தொடக்கம் வைக்கப்பட்டுள்ளது. எபிரெய மூலத்தின் நீண்ட உறவுத்தொடர் தமிழில் தெளிவாக அமைய ‘அந்த வயலை’ என மீளச் சுட்டப்பட்டுள்ளது; வாங்கப்பட்ட நேரடிப் பொருள் வயலே என்பது பாதுகாக்கப்பட்டுள்ளது. நடை கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதுமாக உள்ளது.
