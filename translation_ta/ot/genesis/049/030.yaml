  source_fidelity: மூலத்தின் இடவியல் மற்றும் வாங்குதல் தொடர்பான கூறுகள் பெரும்பாலும் சரியாக உள்ளன. குறிப்பாக, אֶת־הַשָּׂדֶה என்பதன் நேரடிச் செயப்படுபொருளான ‘வயல்’ தெளிவாகத் தரப்பட்டுள்ளது. ஆனால் לַאֲחֻזַּת־קָבֶר என்பதிலுள்ள சட்டப்பூர்வ உடைமை/அடக்க நோக்கத்தின் நுணுக்கத்தை ‘அடக்கத்திற்குரிய சொத்து’ முழுமையாகக் காட்டவில்லை; அது ‘அடக்கத்துக்கு ஏற்ற சொத்து’ என்ற பொருளையும் தரலாம்.
