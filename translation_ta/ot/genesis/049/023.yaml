  yaml_path: translation/ot/genesis/049/023.yaml
  text: They bitterly attacked him[a], and shot at him, and hated him—the archers.
translation:
  language: ta
  text: 'அவர்கள் அவனைக் கசப்புறச் செய்தார்கள்;

    அவனைத் தாக்கினார்கள்[a], அவனைப் பகைத்தார்கள்—அம்பெய்பவர்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன்மீது அம்பெய்தார்கள்.” இந்த எபிரெய வினைச்சொல்லின் பொருள் கடினமானது; “அவனோடு போரிட்டார்கள்” அல்லது “அவனைத் தாக்கினார்கள்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרֲרֻהוּ
  choice: அவனை மனங்கசக்கச் செய்தார்கள்
  rationale: מרר என்பதன் பியேல் வடிவம் ‘கசப்பாக்குதல், மனங்கசக்கச் செய்தல், கடுமையாக நடத்துதல்’ என்ற தீவிரமான செயற்பொருளைக் கொண்டது. இங்கு உள்ள பகைமைச் சூழலைக் காக்கும் அதேவேளையில், எபிரெயச் சொல்லின் ‘கசப்பு’ உருவகத்தையும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וָרֹבּוּ
  choice: அவனைத் தாக்கினார்கள்
  rationale: இவ்வினைச்சொல்லின் எபிரெய வடிவமும் பொருளும் கடினமானவை. அம்புகளை உடையவர்கள் என்ற அடுத்த தொடரின் சூழலில் ‘எய்தார்கள்’ எனப் பொருள் கொள்ளலாம்; ஆனால் ‘எதிர்த்துப் போரிட்டார்கள்’ அல்லது பொதுவாக ‘தாக்கினார்கள்’ என்பதும் சாத்தியம். மூலத்தின் நிச்சயமின்மையை அளவுக்கு மீறித் தீர்க்காமல் ‘தாக்கினார்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיִּשְׂטְמֻהוּ
  choice: அவனைப் பகைத்தார்கள்
  rationale: שטם என்பது ஆழ்ந்த பகைமை, வெறுப்பு ஆகியவற்றைக் குறிக்கிறது. ‘பகைத்தார்கள்’ என்பது கவிதை நடைக்கு ஏற்ற சுருக்கமான, இயல்பான தமிழ்.
- source_word: בַּעֲלֵי חִצִּים
  choice: வில்லாளர்கள்
  rationale: சொல்லுக்கு சொல் ‘அம்புகளின் உடையவர்கள்.’ இது அம்பெய்பவர்களைக் குறிக்கும் மரபுத்தொடர்; நவீன தமிழில் இயல்பாக ‘வில்லாளர்கள்’ என வழங்கப்படுகிறது.
