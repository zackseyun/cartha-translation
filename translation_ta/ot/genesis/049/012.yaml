source:
  edition: WLC
  text: חַכְלִילִ֥י עֵינַ֖יִם מִ/יָּ֑יִן וּ/לְבֶן שִׁנַּ֖יִם מֵ/חָלָֽב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/012.yaml
  text: His eyes are darker than wine[b][a], and his teeth whiter than milk.
translation:
  language: ta
  text: திராட்சரசத்தால் அவன் கண்கள் சிவந்திருக்கும்; பாலால் அவன் பற்கள் வெண்மையாயிருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திராட்சரசத்தைவிட அவன் கண்கள் கருமையாகவும், பாலை விட அவன் பற்கள் வெண்மையாகவும் இருக்கும்.” அரிய எபிரெயச் சொல்லும் מִן என்ற இடைச்சொல்லும் காரணப் பொருளையும் ஒப்பீட்டுப் பொருளையும் அனுமதிக்கின்றன.
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: חַכְלִילִי
  choice: சிவந்திருக்கும்
  rationale: இந்த அரிய எபிரெயச் சொல் கண்களின் சிவந்த அல்லது ஆழ்ந்த நிறத்தைக் குறிக்கிறது. நீதிமொழிகள் 23:29-இல் காணப்படும் தொடர்புடைய பயன்பாடும் முந்தைய வசனத்தின் திராட்சரச வளமைச் சூழலும் காரணப் பொருளில் ‘சிவந்திருக்கும்’ என்பதை ஆதரிக்கின்றன; எனினும் சொல்லின் துல்லியமான நிறநுட்பம் விவாதத்திற்குரியது.
- source_word: עֵינַיִם
  choice: கண்கள்
  rationale: இரு கண்களைக் குறிக்கும் எபிரெய இருமை பெயர்ச்சொல்லின் இயல்பான தமிழ் வடிவம்.
- source_word: מִיָּיִן
  choice: திராட்சரசத்தால்
  rationale: מִן என்ற முன்னிடைச்சொல்லை இங்கு காரணம் அல்லது மூலத்தைக் குறிக்கும் வகையில் எடுத்துள்ளோம். 11-ஆம் வசனத்தின் திராட்சரச மிகுதியும் ‘கண்கள் சிவத்தல்’ என்ற படிமமும் இதை ஆதரிக்கின்றன; ஒப்பீட்டுப் பொருளும் இலக்கணரீதியாக சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וּלְבֶן
  choice: வெண்மையாயிருக்கும்
  rationale: வினைச்சொல் இல்லாத எபிரெயக் கவிதை வாக்கியத்தை இயல்பான தமிழில் நிலையைக் குறிக்கும் எதிர்கால வடிவில் வெளிப்படுத்துகிறது. இது ஆசீர்வாதக் கவிதையின் தீர்க்கநோக்குச் சூழலுக்கும் பொருந்துகிறது.
- source_word: שִׁנַּיִם
  choice: பற்கள்
  rationale: இரு வரிசைப் பற்களைக் குறிக்கும் எபிரெய இருமை பெயர்ச்சொல்லின் நேரான தமிழ் மொழிபெயர்ப்பு.
- source_word: מֵחָלָב
  choice: பாலால்
  rationale: 'முதல் கவிதை அடியுடன் இணையான காரணம் அல்லது மூலப் பொருளைத் தக்கவைக்கிறது: திராட்சரசத்தால் சிவந்த கண்கள்; பாலால் வெண்மையான பற்கள். ஒப்பீட்டுப் பொருள் சாத்தியமுள்ளதால் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.'
theological_decisions:
- issue: திராட்சரசமும் பாலும் ஏற்படுத்தும் நிறமா, அவற்றோடு செய்யப்படும் ஒப்பீடா?
  choice: 'காரணம்/மூலம்: ‘திராட்சரசத்தால் … பாலால்’'
  alternative: 'ஒப்பீடு: ‘திராட்சரசத்தைவிட … பாலைைவிட’'
  rationale: முந்தைய வசனத்தில் திராட்சரச மிகுதி பேசப்படுவதும், חַכְלִילִי என்பதற்கான சொற்பொருள் தொடர்பும் காரண வாசிப்பை வலுப்படுத்துகின்றன. ஆயினும் מִן ஒப்பீட்டையும் குறிக்கக்கூடும்; ஆகவே மாற்று வாசிப்பு மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், கவிதைக்குரிய கண்ணியத்தையும் இணை அமைப்பையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘திராட்சரசம்’ என்பது பொதுவாகப் புரியும் துல்லியமான சொல். எபிரெயத்தில் வெளிப்படையான வினைச்சொல் இல்லாவிட்டாலும், யாக்கோபின் ஆசீர்வாதச் சூழலை இயல்பாக வெளிப்படுத்த ‘இருக்கும்’ பயன்படுத்தப்பட்டுள்ளது.
