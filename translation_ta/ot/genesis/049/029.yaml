base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/029.yaml
  text: Then he commanded them and said to them[a], “I am about to be gathered to my people. Bury me with my fathers in the cave that is in the field of Ephron the Hittite,”
translation:
  language: ta
  text: பின்பு அவர் அவர்களுக்குக் கட்டளையிட்டு, அவர்களிடம், “நான் என் மக்களிடம் சேர்க்கப்படவிருக்கிறேன்.[a] ஏத்தியனான எப்ரோனின் நிலத்தில் உள்ள குகையில் என் மூதாதையருடன் என்னை அடக்கம் செய்யுங்கள்” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நான் என் மக்களிடம் சேர்க்கப்படுகிறேன்” என்றும் மொழிபெயர்க்கலாம். இந்த எபிரேய மரபுத்தொடர் நெருங்கிவரும் மரணத்தையும், மரணத்தில் ஒருவருடைய மக்களோடு அல்லது முன்னோர்களோடு சேர்க்கப்படுதலையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டு
  rationale: צוה என்பதன் கட்டளை அல்லது பொறுப்பளிப்பு சார்ந்த வலிமையைத் தக்கவைத்து, யாக்கோபின் இறுதி அறிவுறுத்தலின் தீவிரத்தையும் வெளிப்படுத்துகிறது.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: என்று கூறினார்
  rationale: எபிரெய உரையாடல் சூத்திரத்தை இயல்பான நவீனத் தமிழில் வழங்குகிறது; ‘அவர்களிடம்’ என்ற பொருள் சூழலிலும் முன்வரும் பன்மைச் சுட்டிலும் தெளிவாக உள்ளது.
- source_word: נֶאֱסָף אֶל־עַמִּי
  choice: நான் என் மக்களோடு சேர்த்துக்கொள்ளப்படவிருக்கிறேன்
  rationale: வரவிருக்கும் மரணத்தைக் குறிக்கும் உருவகத்தை ‘நான் இறக்கப்போகிறேன்’ என்று தட்டையாக்காமல் பாதுகாக்கிறது. செயப்பாட்டு வடிவமும் உடனடி எதிர்நோக்கும் உணர்வும் தக்கவைக்கப்படுகின்றன.
- source_word: עַמִּי
  choice: என் மக்கள்
  rationale: ‘என் உறவினர்’ என்று குறுக்காமல், மூலத்தின் விரிவான குடும்ப மற்றும் சமூகத் தொனியைப் பாதுகாக்கிறது.
- source_word: קִבְרוּ אֹתִי
  choice: என்னை அடக்கம் செய்யுங்கள்
  rationale: பன்மை ஏவல் வடிவத்தை இயல்பான, மரியாதையான நவீனத் தமிழில் நேரடியாக வழங்குகிறது.
- source_word: אֶל־אֲבֹתָי
  choice: என் முன்னோர்களுடன்
  rationale: சொல்லுக்குச் சொல் ‘என் தந்தையரிடம்’ என்பதைக் காட்டிலும், இச்சவ அடக்கச் சூழலில் பல தலைமுறை மூதாதையருடன் அடக்கம் செய்யப்படுதல் என்ற பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַמְּעָרָה
  choice: குகை
  rationale: மூலத்தில் உள்ள எளிய பெயர்ச்சொல்லையே வழங்குகிறது; ‘அடக்கக் குகை’ என்று மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: אֲשֶׁר בִּשְׂדֵה עֶפְרוֹן
  choice: எப்ரோனின் நிலத்தில் உள்ள
  rationale: உடைமை உறவையும் இடத்தைக் குறிக்கும் தொடர்பு வாக்கியத்தையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: הַחִתִּי
  choice: இத்தியனான
  rationale: எப்ரோனின் இன அடையாளத்தைக் குறிக்கும் பெயரடையைத் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: ‘என் மக்களோடு சேர்த்துக்கொள்ளப்படுதல்’ என்பதன் பொருள்
  choice: மரணம் மற்றும் இறந்த முன்னோர்களோடு சேர்தல் ஆகியவற்றைச் சுட்டும் மூல உருவகத்தைத் தக்கவைத்தல்
  alternative: நான் இறக்கப்போகிறேன்
  rationale: மூலச்சொற்றொடர் வெறும் உயிரியல் மரணத்தை மட்டும் கூறாமல், ஒருவருடைய மக்களோடு அல்லது முன்னோர்களோடு மரணத்தில் சேர்க்கப்படுதலையும் சுட்டுகிறது. குறிப்பிட்ட மறுமை வாழ்வுக் கோட்பாட்டைத் திணிக்காமல் அந்த இறையியல் நிறைவும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மரணத்தைச் சுட்டும் எபிரெய உருவகம் விளக்கவுரையாக மாற்றப்படாமல் பிரதான உரையில் தக்கவைக்கப்பட்டுள்ளது.
