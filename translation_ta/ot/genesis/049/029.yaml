revisions:
- from: பின்பு அவர் அவர்களுக்குக் கட்டளையிட்டு, “நான் என் மக்களோடு சேர்த்துக்கொள்ளப்படவிருக்கிறேன்.[a] இத்தியனான எப்ரோனின் நிலத்தில் உள்ள குகையில், என் முன்னோர்களுடன் என்னை அடக்கம் செய்யுங்கள்” என்று கூறினார்.
  to: பின்பு அவர் அவர்களுக்குக் கட்டளையிட்டு, அவர்களிடம், “நான் என் மக்களிடம் சேர்க்கப்படவிருக்கிறேன்.[a] ஏத்தியனான எப்ரோனின் நிலத்தில் உள்ள குகையில் என் மூதாதையருடன் என்னை அடக்கம் செய்யுங்கள்” என்று கூறினார்.
  rationale: The revision retains the Hebrew death-and-gathering idiom and its ambiguity, without imposing a doctrine of the afterlife. It explicitly retains the twofold recipient wording in the narrative frame, improves Tamil punctuation and flow, and standardizes the ethnic term as ‘ஏத்தியன்.’
