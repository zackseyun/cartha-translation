source:
  edition: WLC
  text: וַ/יִּקְרָ֥א יַעֲקֹ֖ב אֶל בָּנָ֑י/ו וַ/יֹּ֗אמֶר הֵאָֽסְפוּ֙ וְ/אַגִּ֣ידָה לָ/כֶ֔ם אֵ֛ת אֲשֶׁר יִקְרָ֥א אֶתְ/כֶ֖ם בְּ/אַחֲרִ֥ית הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/001.yaml
  text: Then Jacob called his sons and said[a], “Gather yourselves, and I will tell you what will happen to you in the latter days.”
translation:
  language: ta
  text: பின்பு யாக்கோபு தன் மகன்களை அழைத்து, “நீங்கள் ஒன்றுகூடி வாருங்கள்; இனி வரும் நாட்களில்[a] உங்களுக்கு என்ன நிகழும் என்பதை நான் உங்களுக்குச் சொல்வேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடைசி நாட்களில்.” எபிரெயச் சொற்றொடர் பொதுவாக வருங்காலத்தைக் குறிக்கலாம்; சில சூழல்களில் அது முடிவுக்காலப் பொருளையும் கொண்டிருக்கலாம்.
    reason: மூலமொழியிலுள்ள காலக் குறிப்பின் பொருள் விரிவையும், முடிவுக்கால நுண்பொருள் சாத்தியத்தையும் பாதுகாக்க.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்து
  rationale: கרא என்ற வினை இக்கதைச் சூழலில் ஒருவரை அழைப்பதையோ வரவழைப்பதையோ குறிக்கிறது. “அழைத்து” என்பது இயல்பான நவீனத் தமிழ்.
- source_word: בָּנָיו
  choice: தன் மகன்களை
  rationale: தொடர்ந்து பெயரிடப்படும் யாக்கோபின் ஆண் சந்ததியினரையே இங்கு בנים குறிக்கிறது; எனவே “மகன்கள்” துல்லியமானது.
- source_word: הֵאָסְפוּ
  choice: நீங்கள் ஒன்றுகூடி வாருங்கள்
  rationale: אסף என்பதன் நிஃபால் கட்டளை வடிவம் அவர்கள் தாங்களே ஒன்றாகக் கூடிவருமாறு அழைக்கிறது. இந்தத் தேர்வு அந்தக் கூட்டு மற்றும் அழைப்பு உணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: וְאַגִּידָה לָכֶם
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: கோஹோர்டேட்டிவ் வடிவம் யாக்கோபின் நோக்கத்தை வெளிப்படுத்துகிறது. தமிழில் நிகழ்கால வடிவம் உடனடியாகச் சொல்லவிருக்கும் நோக்கத்தை இயல்பாகக் காட்டுகிறது.
- source_word: אֵת אֲשֶׁר יִקְרָא אֶתְכֶם
  choice: உங்களுக்கு என்ன நிகழும் என்பதை
  rationale: קרה சார்ந்த இச்சொற்றொடர் ஒருவருக்கு நேரவிருப்பதை அல்லது நிகழவிருப்பதை குறிக்கும் மரபுத்தொடர்; இங்கு “அழைக்கும்” என்பது பொருளல்ல.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: இனி வரும் நாட்களில்
  rationale: இந்த எபிரெயச் சொற்றொடர் வருங்காலத்தைக் குறிக்கலாம்; சில சூழல்களில் முடிவுக்கால நுண்பொருளையும் கொண்டிருக்கலாம். முதன்மை உரை பொதுவான வருங்காலக் கருத்தைத் தருகிறது; அதிகச் சொற்பொருள் சார்ந்த மாற்று அடிக்குறிப்பில் வைக்கப்படுகிறது.
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים என்பதை வெளிப்படையான முடிவுக்காலச் சொற்றொடராக மொழிபெயர்க்க வேண்டுமா
  choice: இனி வரும் நாட்களில்
  alternative: கடைசி நாட்களில்
  rationale: உடனடிச் சூழல் யாக்கோபின் மகன்களுக்கும் அவர்களிடமிருந்து உருவாகும் கோத்திரங்களுக்கும் பின்னாளில் நிகழப்போவதைப் பற்றியது. இருப்பினும், எபிரெயச் சொற்றொடருக்கு சில இடங்களில் முடிவுக்கால நுண்பொருள் இருப்பதால், அந்தச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் யாக்கோபின் உரைக்குரிய கண்ணியமான தொனியுடனும் அமைக்கப்பட்டுள்ளது. “ஒன்றுகூடி வாருங்கள்” என்பது கட்டளையின் இயல்பான அழைப்பு உணர்வைத் தருகிறது; பழமையான அல்லது குறிப்பிட்ட சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
