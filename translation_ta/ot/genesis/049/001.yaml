    issue: Tamil verb tense for וְאַגִּידָה לָכֶם
    rationale: ‘சொல்கிறேன்’ normally states a present action, whereas the Hebrew cohortative conveys ‘let me/I will tell.’ ‘சொல்வேன்’ retains the forward-looking intention and fits the immediately following discourse.
