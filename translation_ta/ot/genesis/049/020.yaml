  register: நவீன நிலையான தமிழில், கவிதைநயமும் ஆசீர்வாத உரையின் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘செழுமையான உணவு’ மற்றும் ‘அரசருக்குரிய அருஞ்சுவை உணவுகள்’ ஆகியவை சாதாரண வாசகருக்குத் தெளிவாக இருக்கும்படி தேர்ந்தெடுக்கப்பட்டன; எபிரெய மூலத்தின் சொற்படியான மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
