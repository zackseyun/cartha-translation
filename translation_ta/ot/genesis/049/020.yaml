  text: מֵ/אָשֵׁ֖ר שְׁמֵנָ֣ה לַחְמ֑/וֹ וְ/ה֥וּא יִתֵּ֖ן מַֽעֲדַנֵּי מֶֽלֶךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/020.yaml
  text: Asher's food will be rich[a], and he will provide royal delicacies.
translation:
  language: ta
  text: ஆசேரின் உணவு செழுமையாக இருக்கும்[a]; அவன் அரசருக்கேற்ற சுவைமிகு உணவுகளை வழங்குவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆசேரிடமிருந்து செழுமையான உணவு வரும்”; சொற்படியாக, “ஆசேரிடமிருந்து அவனுடைய அப்பம் செழுமையானது.”
    reason: מֵאָשֵׁר என்பதிலுள்ள ‘ஆசேரிடமிருந்து’ என்ற ஆதார/பிரதேசப் பொருளையும், לַחְמוֹ என்பதிலுள்ள ‘அவனுடைய அப்பம்’ என்ற சொற்படியான பொருளையும் காட்டுகிறது.
lexical_decisions:
- source_word: מֵאָשֵׁר
  choice: ஆசேரின்
  rationale: מִן என்ற முன்னொட்டு சொற்படியாக ‘ஆசேரிடமிருந்து’ எனப் பொருள்படலாம். ஆனால் வினைச்சொல் இல்லாத இக்கவிதை வரியில், ஆசேர் கோத்திரத்தின் விளைச்சல் அல்லது உணவுவளத்தைக் குறிக்கும் இயல்பான தமிழாக ‘ஆசேரின்’ என்று வழங்கப்பட்டுள்ளது; மூலத்தின் ஆதார/பிரதேசப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שְׁמֵנָה
  choice: செழுமையானதாக
  rationale: இந்தப் பெயரடை சொற்படியாக ‘கொழுத்த’ அல்லது ‘கொழுப்புமிக்க’ எனினும், உணவின் வளம், மிகுதி, உயர்தரம் ஆகியவற்றைக் குறிக்கும் சூழலில் ‘செழுமையான’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: לַחְמוֹ
  choice: உணவு
  rationale: לֶחֶם என்பதன் அடிப்படைப் பொருள் ‘அப்பம்’; ஆனால் எபிரெயத்தில் அது பொதுவாக உணவு அல்லது உணவுவளத்தையும் குறிக்கும். இணைவரியில் அருஞ்சுவை உணவுகள் வருவதால் விரிவான ‘உணவு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְהוּא
  choice: அவன்
  rationale: தனிப்பட்ட சுட்டுப்பெயர் ஆசேரை மீண்டும் வலியுறுத்துகிறது. தமிழில் ‘அவன்’ இதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: יִתֵּן
  choice: வழங்குவான்
  rationale: נָתַן என்பதன் நேர்பொருள் ‘கொடுப்பான்’. இங்கு சிறப்புணவுகளை உற்பத்தி செய்து அளிக்கும் கருத்துக்கு ‘வழங்குவான்’ பொருத்தமானது.
- source_word: מַעֲדַנֵּי
  choice: அருஞ்சுவை உணவுகளை
  rationale: இந்தச் சொல் இன்பமளிக்கும் உயர்தர உணவுகள் அல்லது சுவைமிகு சிறப்புணவுகளைக் குறிக்கிறது. ‘அருஞ்சுவை உணவுகள்’ என்பது தெளிவான, கண்ணியமான நவீனத் தமிழ்.
- source_word: מֶלֶךְ
  choice: அரசருக்குரிய
  rationale: இணைப்புத் தொடர் சொற்படியாக ‘ஒரு அரசனின் அருஞ்சுவை உணவுகள்’ என்று பொருள்படும். ‘அரசருக்குரிய’ என்பது அரசரின் தரத்திற்கேற்ற உணவு என்ற பொருளையும் மூலத்தின் உறவையும் பாதுகாக்கிறது.
