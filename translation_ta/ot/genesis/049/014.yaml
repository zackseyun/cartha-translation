  register: நவீன நிலையான தமிழில், கவிதை உருவகத்தையும் எபிரெய மூலத்தின் சுருக்கத்தையும் முடிந்தவரை தக்கவைக்கும் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
