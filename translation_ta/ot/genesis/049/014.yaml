base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/014.yaml
  text: Issachar is a strong-boned donkey[a], lying down between the sheepfolds.
translation:
  language: ta
  text: இசக்கார் வலுவான எலும்புகளுள்ள ஒரு கழுதை; தொழுவங்களுக்கிடையில் படுத்திருக்கிறான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சுமைப்பைகளுக்கிடையில்.” இங்கே வரும் எபிரெயச் சொல் அரிதானது; அதன் பொருள் குறித்து கருத்து வேறுபாடு உள்ளது. இந்த மேய்ப்புச் சூழலில் “தொழுவங்கள்” என்பது பாரம்பரியமானதும் பொருத்தமானதுமான விளக்கம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂשכָר
  choice: இசக்கார்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாகப் பெயர்த்தெழுதிய வடிவம்.
- source_word: חֲמֹר
  choice: கழுதை
  rationale: அடிப்படைப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; ஆண் கழுதை என்று மூலத்தில் இல்லாத வெளிப்பாட்டைச் சேர்க்கவில்லை.
- source_word: גָּרֶם
  choice: வலுவான எலும்புகளுள்ள
  rationale: ‘எலும்பு’ என்ற உருவகத்தைத் தக்கவைத்து, இங்கு மெலிவை அல்லாமல் உறுதியான உடற்கட்டைக் குறிப்பதாகத் தெரியும் பொருளை வெளிப்படுத்துகிறது.
- source_word: רֹבֵץ
  choice: படுத்திருக்கிறான்
  rationale: விலங்கு தரையில் படுத்திருக்கும் அல்லது அமர்ந்திருக்கும் நிலையைச் சுட்டும் எபிரெய வினையெச்சத்தை இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: בֵּין
  choice: இடையில்
  rationale: ‘இரண்டிற்கும் நடுவில்’ என்ற நேரடியான இடப்பொருளைத் தருகிறது.
- source_word: הַמִּשְׁפְּתָיִם
  choice: தொழுவங்கள்
  rationale: அரிதான, பொருள் விவாதத்திற்குரிய சொல்லுக்கு மேய்ப்புச் சூழலுடன் பொருந்தும் பாரம்பரிய விளக்கத்தை முதன்மை உரையில் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
