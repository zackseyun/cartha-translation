  source_fidelity: மூல எபிரெயத்தின் சுருக்கமான பெயர்ச்சொல்-உருவக அமைப்பு நன்றாகக் காக்கப்பட்டுள்ளது. חֲמֹר ‘கழுதை,’ גָּרֶם என்பதன் உடல்வலிமையைச் சுட்டும் உருவகம், רֹבֵץ ‘படுத்திருக்கிறான்,’ மற்றும் בֵּין ‘இடையில்’ ஆகியவை துல்லியமாகத் தரப்பட்டுள்ளன. הַמִּשְׁפְּתָיִם என்ற அரிய, விவாதத்திற்குரிய சொல்லுக்கு முதன்மை உரையில் ‘தொழுவங்கள்’ எனும் பாரம்பரியப் பொருள் தரப்பட்டு, மாற்று விளக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
  naturalness: ‘இசக்கார் வலுவான எலும்புகளுள்ள ஒரு கழுதை; தொழுவங்களுக்கிடையில் படுத்திருக்கிறான்’ என்பது நவீன நிலையான தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. செய்யுளின் சுருக்கமும் விலங்கு-உருவகமும் தக்கவைக்கப்பட்டுள்ளன.
  terminology: ‘இசக்கார்’ என்பது நிலையான பெயர்ப்பெயரெழுத்தாக்கமாக ஏற்றது. ‘கழுதை,’ ‘தொழுவங்கள்,’ மற்றும் ‘எபிரெயச் சொல்’ ஆகிய பயன்பாடுகள் பொருத்தமானவை. அடிக்குறிப்பு அரிய சொல்லின் நிச்சயமின்மையைத் தேவையான அளவில் வெளிப்படுத்துகிறது; எந்தக் குறிப்பிட்ட இறையியல் விளக்கத்தையும் திணிக்கவில்லை.
