source:
  edition: WLC
  text: שִׁמְע֥וֹן וְ/לֵוִ֖י אַחִ֑ים כְּלֵ֥י חָמָ֖ס מְכֵרֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/005.yaml
  text: Simeon and Levi are brothers[a]; weapons of violence are their swords.
translation:
  language: ta
  text: 'சிமியோனும் லேவியும் சகோதரர்கள்;

    அவர்களுடைய வாள்கள்[a] வன்முறையின் ஆயுதங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “வாள்கள்” என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் அரிதானது; அதன் பொருள் உறுதியாகத் தெரியவில்லை. இதை “கருவிகள்” என்றும், பழைய மொழிபெயர்ப்புகள் சிலவற்றில் “வசிப்பிடங்கள்” என்றும் மொழிபெயர்த்துள்ளனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוֹן
  choice: சிமியோன்
  rationale: எபிரெயப் பெயர், தமிழில் வழக்கமாக அறியப்படும் வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְלֵוִי
  choice: லேவியும்
  rationale: இணைப்பிடைச்சொல்லையும் பெயரையும் இயல்பான தமிழ் இணை வடிவில் வழங்குகிறது.
- source_word: אַחִים
  choice: சகோதரர்கள்
  rationale: இங்கு இரத்த உறவையும் அவர்களுக்கிடையிலான கூட்டுச் செயல்பாட்டையும் உணர்த்தும் நேரடியான பொருள் பொருந்துகிறது; எபிரெய மொழியின் வினையற்ற கூற்றைத் தமிழில் இயல்பாகவே வினையின்றி வைத்திருக்கிறது.
- source_word: כְּלֵי
  choice: ஆயுதங்கள்
  rationale: இந்தச் சொல் பொதுவாகப் பாத்திரங்கள், கருவிகள் அல்லது ஆயுதங்கள் எனப் பொருள்படலாம்; חָמָס உடன் வருவதால் இங்கு ‘ஆயுதங்கள்’ என்பது சூழலுக்குப் பொருத்தமானது.
- source_word: חָמָס
  choice: வன்முறை
  rationale: வன்முறையையும் வன்முறையால் நிகழும் அநீதியையும் குறிக்கும் சொல்லின் முதன்மையான பொருளை நேரடியாக வழங்குகிறது.
- source_word: מְכֵרֹתֵיהֶם
  choice: அவர்களுடைய வாள்கள்
  rationale: மிக அரிதானதும் பொருள் உறுதியாகத் தெரியாததுமான இச்சொல்லுக்கு, பாடலின் வன்முறைச் சூழலோடு பொருந்தும் ‘வாள்கள்’ என்ற சாத்தியமான பொருள் முதன்மை உரையில் தரப்பட்டுள்ளது; நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
