  source_fidelity: மூல எபிரெயத்தின் வினையற்ற இணை அமைப்பும், சிமியோன்-லேவி சகோதரர்கள் என்ற கூற்றும் துல்லியமாகக் காக்கப்பட்டுள்ளன. כְּלֵי חָמָס என்பதற்கு «வன்முறையின் ஆயுதங்கள்» பொருத்தமானது. מְכֵרֹתֵיהֶם என்ற அரிய, நிச்சயமற்ற சொல்லுக்கு ஆங்கில POB எடுத்துள்ள «their swords» என்ற வாசிப்பே முதன்மை உரையில் வழங்கப்பட்டு, அதன் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
  naturalness: «சிமியோனும் லேவியும் சகோதரர்கள்; / அவர்களுடைய வாள்கள் வன்முறையின் ஆயுதங்கள்» என்பது நவீனத் தரத் தமிழில் புரியத்தக்க, சுருக்கமான கவிதைநடை. இரு அடிகளாகப் பிரித்திருப்பது யாக்கோபின் கவிதை உரையின் அமைப்புக்கு ஏற்றது.
  terminology: பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பில் உள்ளன. «சகோதரர்கள்», «வன்முறை», «ஆயுதங்கள்» ஆகியவை சூழலுக்கும் பதிவுக்கும் ஏற்றவை. «வாள்கள்» என்பது உரைநிச்சயமற்ற விளக்கமாக இருப்பதால் அடிக்குறிப்பு சரியாக இணைக்கப்பட்டுள்ளது.
