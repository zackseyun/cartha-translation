base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/026.yaml
  text: The blessings of your father have prevailed beyond the blessings of my parents[a], to the utmost bounds of the ancient hills. May they be on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: ta
  text: 'உன் தந்தையின் ஆசீர்வாதங்கள்,

    என் பெற்றோரின் ஆசீர்வாதங்களைவிட

    மிஞ்சுகின்றன,

    பழம்பெரும் குன்றுகளின் கடையெல்லைவரை.[a]


    அவை யோசேப்பின் தலைமீதும்,

    தன் சகோதரர்களிடமிருந்து தனியே பிரித்துவைக்கப்பட்டவனின்[b]

    உச்சந்தலையின்மீதும் தங்கட்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இத்தொடரின் பொருள் உறுதியற்றது. “நித்திய குன்றுகளின் விரும்பத்தக்க பொருள்கள் வரை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தன் சகோதரர்களிடையே இளவரசனாக இருப்பவன்” என்றும் பொருள் கொள்ளலாம். எபிரெயச் சொல் அர்ப்பணிக்கப்பட்ட அல்லது தனியே பிரிக்கப்பட்ட ஒருவனையும் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּרְכֹת אָבִיךָ
  choice: உன் தந்தையின் ஆசீர்வாதங்கள்
  rationale: பன்மை வடிவத்தையும், யாக்கோபு யோசேப்பை நேரடியாக அழைத்துப் பேசுவதையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: גָּבְרוּ עַל
  choice: …விட வலிமைமிக்கவையாகி
  rationale: வினைச்சொல்லின் வலிமையிலும் மேன்மையிலும் மிஞ்சுதல் என்ற பொருளை, கவிதை நயத்தை முற்றிலும் இழக்காமல் தெளிவாகச் சொல்கிறது.
- source_word: הוֹרַי
  choice: என்னைப் பெற்றோர்
  rationale: கொடுக்கப்பட்ட மசோரா உயிர்க்குறிப்பின்படி, யாக்கோபைப் பெற்ற தாய் தந்தையரைக் குறிக்கும் நேரடியான வாசிப்பு இது; ‘மலைகள்’ என்ற மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: תַּאֲוַת גִּבְעֹת עוֹלָם
  choice: பழம்பெரும் குன்றுகளின் கடையெல்லை
  rationale: கடினமான இக்கவிதைத் தொடரை ஆசீர்வாதங்களின் தொலைவான எல்லை எனப் புரிந்துகொண்டு தெளிவாக மொழிபெயர்க்கிறது; ‘விரும்பத்தக்க பொருள்கள்’ என்ற சாத்தியப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תִּהְיֶיןָ
  choice: தங்கட்டும்
  rationale: ஆசீர்வாத அறிவிப்பிலுள்ள வேண்டுதல் சார்ந்த வினைவலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: קָדְקֹד
  choice: உச்சந்தலை
  rationale: தலையின் உச்சிப்பகுதியைக் குறிக்கும் எபிரெயச் சொல்லையும், முந்தைய ‘தலை’ என்பதுடனான கவிதை இணைப்பையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: נְזִיר אֶחָיו
  choice: தன் சகோதரர்களிடமிருந்து பிரித்து வைக்கப்பட்டவன்
  rationale: பிற்கால நசரேய நிறுவகத்தை இங்கு திணிக்காமல், அர்ப்பணிக்கப்பட்ட அல்லது தனியே பிரிக்கப்பட்ட ஒருவன் என்ற அடிப்படைப் பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: נְזִיר אֶחָיו என்ற யோசேப்பின் சிறப்புப்பெயர்
  choice: தன் சகோதரர்களிடமிருந்து பிரித்து வைக்கப்பட்டவன்
  alternative: தன் சகோதரர்களிடையே இளவரசனாக இருப்பவன்
  rationale: யோசேப்பின் தனிப்பட்ட, உயர்ந்த நிலையை உணர்த்தும் அதே வேளையில், இதை அரசியல் பட்டமாகவோ பிற்கால ‘நசரேயன்’ என்ற தொழில்நுட்பப் பெயராகவோ குறுக்காமல் மூலத்தின் பொருள் இழுபறியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதை நடையைப் பயன்படுத்துகிறது. வரிசைப் பிரிப்பு எபிரெயக் கவிதையின் இணை அமைப்பைத் தெளிவாக்குகிறது; அரிதான சொற்களுக்குப் பதிலாக ‘கடையெல்லை’, ‘உச்சந்தலை’, ‘பிரித்து வைக்கப்பட்டவன்’ போன்ற புரிந்துகொள்ளத்தக்க சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
