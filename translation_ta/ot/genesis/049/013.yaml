  text: זְבוּלֻ֕ן לְ/ח֥וֹף יַמִּ֖ים יִשְׁכֹּ֑ן וְ/הוּא֙ לְ/ח֣וֹף אֳנִיּ֔וֹת וְ/יַרְכָת֖/וֹ עַל צִידֹֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/013.yaml
  text: Zebulun will dwell by the shore of the seas[a]; he will be by the shore of ships[c][b], and his flank will be toward Sidon.
translation:
  language: ta
  text: 'செபுலோன் கடல்களின் கரையோரத்தில் குடியிருப்பான்[a];


    அவன் கப்பல்களின் கரையோரத்தில் இருப்பான்[b];


    அவனுடைய பக்கப்பகுதி சீதோனை நோக்கி இருக்கும்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடல்கள்’ என்பது எபிரெயத்தில் பன்மை; இதை இயல்பான பயன்பாட்டில் ‘கடல்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்கு நெருக்கமாக, ‘கப்பல்களின் கரை.’ இதை ‘கப்பல்களுக்கான துறைமுகம்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘அவனுடைய பக்கம்,’ ‘அவனுடைய எல்லைப்பகுதி,’ அல்லது ‘அவனுடைய கடைக்கோடி சீதோனை நோக்கி இருக்கும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் புவியியல் சூழலில் பக்கம், எல்லைப்பகுதி, அல்லது தொலைவான முனை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבוּלֻן
  choice: செபுலோன்
  rationale: தனிப்பெயர் என்பதால், நவீனத் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு வடிவம் பயன்படுத்தப்பட்டது.
- source_word: לְחֹוף
  choice: கரையருகே
  rationale: לְ உடன் வரும் חוֹף இங்கு இருப்பிடத்தைக் குறிக்கிறது. ‘கரையருகே’ என்பது கரை/கடற்கரை என்ற இடவுணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: יַמִּים
  choice: கடல்களின்
  rationale: எபிரெயச் சொல் பன்மையில் இருப்பதால், அதை ஒருமையாக மாற்றாமல் ‘கடல்களின்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: יִשְׁכֹּן
  choice: குடியிருப்பான்
  rationale: שׁכן என்பதன் குடியிருத்தல் அல்லது வாழ்தல் என்ற பொருளை, ஆசீர்வாதப் பாடலின் எதிர்கால நோக்குடன் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְהוּא
  choice: அவன்
  rationale: இணை அமைப்பில் செபுலோனை மீண்டும் வலியுறுத்தும் சுட்டுப்பெயர் வெளிப்படையாகத் தக்கவைக்கப்பட்டது.
- source_word: לְחֹוף אֳנִיּוֹת
  choice: கப்பல்களின் கரையருகே
  rationale: ‘கப்பல்களின் கரை’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, மூலத்தில் நேரடியாக இல்லாத ‘துறைமுகம்’ என்ற விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: וְיַרְכָתוֹ
  choice: அவனுடைய பக்கவாட்டு
  rationale: יַרְכָה என்பது பக்கம், பக்கவாட்டு, எல்லைப்பகுதி அல்லது கடைக்கோடி எனப் பொருள்படலாம். நிலப்பரப்பு மனித உருவில் பேசப்படுவதை ‘பக்கவாட்டு’ தக்கவைக்கிறது; புவியியல் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: עַל
  choice: நோக்கி
  rationale: இடப்பெயருடன் வரும் עַל இங்கு மேலிருத்தலைவிட திசை அல்லது விரிவைச் சுட்டுவதாகத் தோன்றுவதால், எச்சரிக்கையான ‘நோக்கி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: צִידֹן
  choice: சீதோன்
  rationale: இடப்பெயருக்கு நவீனத் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
