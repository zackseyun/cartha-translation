source:
  edition: WLC
  text: בֵּ֤ן פֹּרָת֙ יוֹסֵ֔ף בֵּ֥ן פֹּרָ֖ת עֲלֵי עָ֑יִן בָּנ֕וֹת צָעֲדָ֖ה עֲלֵי שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/022.yaml
  text: Joseph is a fruitful son[a], a fruitful son by a spring[b]; daughters step over the wall.
translation:
  language: ta
  text: யோசேப்பு கனிதரும் மகன்[a], நீரூற்றருகே கனிதரும் மகன்; மகள்கள்[b] மதில்மேல் அடியெடுத்து வைக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோசேப்பு கனிதரும் கிளை, நீரூற்றருகே கனிதரும் கிளை.” எபிரெயக் கவிதை செறிவாக அமைந்துள்ளது; ‘கிளை’ என்ற பாரம்பரிய மொழிபெயர்ப்பு உருவகத்தை இன்னும் வெளிப்படையாக விளக்குகிறது.
    reason: lexical_alternative
  - marker: b
    text: 'நேரடி மொழிபெயர்ப்பு: “மகள்கள்.” இச்சொல் மதில்மேல் படரும் கிளைகள் அல்லது தளிர்களைக் குறிப்பதாக உருவக முறையில் புரிந்துகொள்ளப்படலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן
  choice: மகன்
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருள் ‘மகன்’. ‘கிளை’ என்பது சூழலிலுள்ள தாவர உருவகத்தை வெளிப்படையாக்கும் விளக்க மொழிபெயர்ப்பு; கவிதையின் செறிவையும் தெளிவின்மையையும் காக்க ‘மகன்’ பயன்படுத்தப்பட்டது.
- source_word: פֹּרָת
  choice: கனிதரும்
  rationale: פרה (‘கனிதருதல், பலுகுதல்’) என்ற வேரின் செயற்பண்பை இயல்பான தமிழில் தெரிவிக்கிறது; ‘செழிப்பான’ என்பதைவிட கனி உருவகத்தையும் தெளிவாக வைத்திருக்கிறது.
- source_word: בֵּן פֹּרָת
  choice: கனிதரும் மகன்
  rationale: இச்சொற்றொடர் கவிதைநயமுள்ளதும் சுருக்கமானதும் ஆகும். இரு எபிரெயச் சொற்களின் அடிப்படைப் பொருளையும் காத்து, தமிழில் புரியத்தக்க வகையில் அமைக்கப்பட்டது.
- source_word: עֲלֵי עָיִן
  choice: நீரூற்றருகே
  rationale: עַיִן என்பதற்கு ‘கண்’ என்றும் ‘நீரூற்று’ என்றும் பொருள் உண்டு. கனிதருதல் சார்ந்த சூழலில் ‘நீரூற்று’ இயல்பாகப் பொருந்துகிறது; עֲלֵי இங்கு இடத்தொடர்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: בָּנוֹת
  choice: மகள்கள்
  rationale: சொல்லின் நேரடிப் பொருள் ‘மகள்கள்’. இதை ‘கிளைகள்’ அல்லது ‘தளிர்கள்’ என்று தீர்மானித்துவிடாமல், மூலக் கவிதையின் உருவகத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: צָעֲדָה
  choice: அடியெடுத்து வைக்கிறார்கள்
  rationale: வினைச்சொல் அடியெடுத்து நடத்தல் அல்லது முன்னேறுதலைக் குறிக்கிறது. எபிரெய ஒருமை வினை வடிவம் கூட்டுப் பெயரான ‘மகள்கள்’ உடன் வரினும், இயல்பான தமிழில் பன்மை எழுவாய்க்கேற்ற வினை பயன்படுத்தப்பட்டது.
- source_word: עֲלֵי שׁוּר
  choice: மதில்மேல்
  rationale: שׁוּר இங்கு ‘மதில்/சுவர்’ எனப் புரிந்துகொள்ளப்படுகிறது. עֲלֵי என்பதன் ‘மேல்/மீது’ என்ற இடப்பொருளை வைத்திருப்பதால், ‘மதிலைக் கடந்து’ என்று உருவகத்தை அதிகமாக விளக்குவதைத் தவிர்க்கிறது.
