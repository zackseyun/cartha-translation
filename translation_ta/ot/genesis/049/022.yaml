translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கனிதரும் மகன்’ மற்றும் ‘மகள்கள்’ என்பவை மூல எபிரெயத்தின் செறிவையும் உண்மையான உருவகத் தெளிவின்மையையும் காக்கின்றன. ‘சுவர்’ என்பதற்குப் பதில் கவிதைநடைக்கு ஏற்ற ‘மதில்’ தேர்ந்தெடுக்கப்பட்டது; ‘மதில்மேல்’ என்பது ‘over the wall’ என்பதைத் தவிர, எபிரெய עֲלֵי என்பதன் இடப்பொருளை நெருக்கமாகப் பிரதிபலிக்கிறது.
