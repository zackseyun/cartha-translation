base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/033.yaml
  text: When Jacob finished commanding his sons[a], he drew his feet up into the bed, breathed his last[b], and was gathered to his people.
translation:
  language: ta
  text: யாக்கோபு தம் மகன்களுக்குக் கட்டளையிட்டு முடித்தபின், தம் கால்களைப் படுக்கையின்மேல் இழுத்துக்கொண்டார்[a]. பின்பு கடைசி மூச்சை விட்டு, தம் மக்களோடு சேர்க்கப்பட்டார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “தம் கால்களைப் படுக்கைக்குள் சேர்த்தார்.” எபிரெயத்தில் “சேர்த்தல்” என்ற வினை பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “தம் மக்களோடு சேர்க்கப்பட்டார்” என்பது மரணத்தையும் ஒருவர் தம் மக்களோடு அல்லது முன்னோர்களோடு சேர்வதையும் தொடர்புபடுத்தும் எபிரெயச் சொல்லாட்சி. இது வெறும் அடக்கம் செய்யப்பட்டதைக் குறிப்பதல்ல.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְכַל
  choice: முடித்தபின்
  rationale: כלה என்ற வினை, யாக்கோபு தம் இறுதி அறிவுறுத்தல்களை நிறைவு செய்ததைச் சுட்டுகிறது; தொடர்ச்சியான நிகழ்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְצַוֹּת
  choice: கட்டளையிட்டு
  rationale: צוה என்பதன் முதன்மைப் பொருளான ‘கட்டளையிடுதல்/பணித்தல்’ என்பதைக் காத்து, இறுதி அறிவுறுத்தல்களின் கம்பீரத்தையும் தருகிறது.
- source_word: בָּנָיו
  choice: தம் மகன்களுக்கு
  rationale: எபிரெயச் சொல் குறிப்பாக யாக்கோபின் மகன்களையே குறிக்கிறது; ‘பிள்ளைகள்’ என்று பொதுமைப்படுத்தப்படவில்லை.
- source_word: וַיֶּאֱסֹף רַגְלָיו אֶל הַמִּטָּה
  choice: தம் கால்களைப் படுக்கையின்மேல் இழுத்துக்கொண்டார்
  rationale: ‘கால்களைச் சேர்த்தார்’ என்ற எபிரெயச் சொல்லாட்சியின் உடல் அசைவை இயல்பான தமிழில் தெரிவிக்கிறது; மரணப்படுக்கைக் காட்சியும் தெளிவாகிறது.
- source_word: הַמִּטָּה
  choice: படுக்கை
  rationale: מִטָּה என்பது படுக்கை அல்லது சாய்விருக்கையைக் குறிக்கலாம்; இச்சூழலில் ‘படுக்கை’ நேரடியும் இயல்பானதும் ஆகும்.
- source_word: וַיִּגְוַע
  choice: கடைசி மூச்சை விட்டு
  rationale: גוע என்பது உயிர் பிரிதல் அல்லது இறுதி மூச்சை விடுதல் என்ற நுண்பொருளைக் கொண்டது; அடுத்துள்ள சொல்லாட்சியிலிருந்து இதை வேறுபடுத்திக் காக்கிறது.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: தம் மக்களோடு சேர்க்கப்பட்டார்
  rationale: எபிரெய மரபுச் சொல்லாட்சியைத் தட்டையாக்காமல் காக்கிறது; இது வெறும் அடக்கத்தைக் குறிப்பதல்ல, மரணத்திற்குப் பின் தம் மக்களோடு சேர்க்கப்படுதல் என்ற திறந்த நுண்பொருளையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘தம் மக்களோடு சேர்க்கப்பட்டார்’ என்பதன் பொருள்
  choice: அடக்கம் என்று மட்டும் விளக்காமல் எபிரெய மரபுச் சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: தம் முன்னோர்களோடு அடக்கம் செய்யப்பட்டார்; தம் முன்னோர்களிடம் சென்றார்
  rationale: யாக்கோபின் அடக்கம் அடுத்த அதிகாரத்தில்தான் நிகழ்கிறது. ஆகவே இவ்வாக்கியத்தை அடக்கச் செய்தியாக மட்டும் மொழிபெயர்ப்பது காலவரிசையையும், மரணம் மற்றும் தம் மக்களோடு சேர்க்கப்படுதல் பற்றிய உரையின் திறந்த இறையியல் நுண்பொருளையும் குறைத்துவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் மொழிபெயர்க்கப்பட்டுள்ளது. யாக்கோபைக் குறிக்க மரியாதைப் பன்மையான ‘தம்/ஆர்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெய மூலத்தின் நிகழ்வுத் தொடரை தெளிவாக்க இரண்டு வாக்கியங்களாகப் பிரித்தாலும், கருத்து வரிசை மாற்றப்படவில்லை.
