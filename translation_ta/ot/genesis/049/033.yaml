  naturalness: முக்கிய உரை நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. ‘படுக்கையின்மேல் இழுத்துக்கொண்டார்’ என்பது காட்சியைத் தெளிவாகத் தருகிறது. ஆனால் குறிப்பு a-வில் ‘படுக்கையிடம்’ என்பது படுக்கைக்கருகில்/படுக்கையிடத்திற்கு என்ற பொருளைத் தரக்கூடியதால், மூலத்தின் உடல் அசைவைத் துல்லியமாக வெளிப்படுத்தவில்லை.
