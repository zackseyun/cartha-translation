source:
  edition: WLC
  text: לִֽ/ישׁוּעָתְ/ךָ֖ קִוִּ֥יתִי יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/018.yaml
  text: For your salvation I wait[a], O Yahweh.
translation:
  language: ta
  text: உமது மீட்புக்காக நான் காத்திருக்கிறேன்[a], யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உமது விடுதலைக்காக நான் காத்திருந்தேன், யாவே’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் ‘மீட்பு’ அல்லது ‘விடுதலை’ எனப் பொருள்படலாம்; வினைச்சொல் ‘காத்திருந்தேன்’ என்றும் வழங்கப்படலாம். ‘யாவே’ என்பது YHWH என்ற இறைப் பெயரின் ஒலிபெயர்ப்பு.
    reason: சொற்பொருள் மற்றும் காலநிலை மாற்றுவாசிப்புகள்
lexical_decisions:
- source_word: לִישׁוּעָתְךָ
  choice: உமது மீட்புக்காக
  rationale: יְשׁוּעָה என்பது மீட்பு, விடுதலை, காப்பு ஆகிய பொருள்களைக் கொண்டது. இக்கவிதைச் சூழலில் இராணுவ வெற்றியாக மட்டும் குறுக்காமல், பரந்த மீட்புப் பொருளைப் பாதுகாக்க ‘மீட்பு’ தேர்ந்தெடுக்கப்பட்டது; ל முன்னொட்டு ‘-க்காக’ என வெளிப்படுத்தப்பட்டது.
- source_word: קִוִּיתִי
  choice: நான் காத்திருக்கிறேன்
  rationale: קוה நம்பிக்கையுடனும் எதிர்பார்ப்புடனும் காத்திருப்பதைக் குறிக்கிறது. எபிரேய நிறைவுவினை இங்கு கடந்தகாலத்தை மட்டும் கட்டாயப்படுத்தாததால், தொடரும் எதிர்பார்ப்பை இயல்பாகத் தெரிவிக்கும் நிகழ்காலம் பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יְהוָה என்ற இறைப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக இருப்பதால், அதைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்தோம்.
- issue: יְשׁוּעָה என்பதன் பொருள் எல்லை
  choice: மீட்பு
  alternative: விடுதலை; வெற்றி; இரட்சிப்பு
  rationale: ‘மீட்பு’ என்பது உடனடி ஆபத்திலிருந்து விடுவித்தல் மற்றும் பரந்த இறையியல் காப்பு ஆகிய இரண்டிற்கும் இடமளிக்கிறது; ‘வெற்றி’ என்று குறிப்பாக இராணுவப் பொருளுக்குள் வசனத்தைச் சுருக்கவில்லை.
translation_notes:
  register: சுருக்கமான கவிதைநடையும், மூலத்தில் முன்னிலைப்படுத்தப்பட்ட ‘உமது மீட்புக்காக’ என்ற வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன. ‘உமது’ மரியாதைமிக்க நவீனத் தமிழை வழங்குகிறது; வாக்கியம் சாதாரண வாசகருக்கும் தெளிவாக உள்ளது.
