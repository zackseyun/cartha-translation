  text: וַֽ֠/יִּתְקְעוּ שְׁלֹ֨שֶׁת הָ/רָאשִׁ֥ים בַּ/שּֽׁוֹפָרוֹת֮ וַ/יִּשְׁבְּר֣וּ הַ/כַּדִּים֒ וַ/יַּחֲזִ֤יקוּ בְ/יַד שְׂמאוֹלָ/ם֙ בַּ/לַּפִּדִ֔ים וּ/בְ/יַ֨ד יְמִינָ֔/ם הַ/שּׁוֹפָר֖וֹת לִ/תְק֑וֹעַ וַֽ/יִּקְרְא֔וּ חֶ֥רֶב לַֽ/יהוָ֖ה וּ/לְ/גִדְעֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/020.yaml
  text: Then the three companies blew the trumpets and shattered the jars. They held the torches in their left hands and the trumpets in their right hands to blow[a], and they cried out, “A sword for Yahweh and for Gideon!”
translation:
  language: ta
  text: அப்போது மூன்று படைப்பிரிவினரும் ஊதுகொம்புகளை ஊதி, பானைகளை உடைத்தார்கள். அவர்கள் தங்கள் இடது கைகளில் தீப்பந்தங்களையும், ஊதுவதற்காகத் தங்கள் வலது கைகளில் ஊதுகொம்புகளையும் பிடித்துக்கொண்டு, “யாவேக்காகவும் கிதியோனுக்காகவும் ஒரு வாள்!”[a] என்று முழக்கமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயினதும் கிதியோனினதும் வாள்!”
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁלֹשֶׁת הָרָאשִׁים
  choice: மூன்று படைப்பிரிவினரும்
  rationale: இராணுவச் சூழலில் רָאשִׁים என்பது நேரடியாக ‘தலைகள்’ என்பதல்ல; கிதியோன் பிரித்த மூன்று குழுக்களைக் குறிக்கிறது. ‘படைப்பிரிவுகள்’ சூழலையும் பன்மைச் செய்பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: שׁוֹפָרוֹת
  choice: ஊதுகொம்புகள்
  rationale: שׁוֹפָר என்பது அறிகுறி கொடுக்க ஊதப்படும் கொம்புக் கருவி. ‘ஊதுகொம்புகள்’ என்பது உலோக எக்காளம் என்ற தேவையற்ற கருத்தைச் சேர்க்காமல், கருவியின் தன்மையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַכַּדִּים
  choice: பானைகள்
  rationale: כַּד என்பது திரவம் வைக்கும் குடம் அல்லது பானையைக் குறிக்கும். மூலத்தில் இங்கு பொருள் வெளிப்படையாகக் குறிப்பிடப்படாததால், ‘மண்பானைகள்’ என்று கூடுதல் விவரத்தைச் சேர்க்காமல் ‘பானைகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיַּחֲזִיקוּ
  choice: பிடித்துக்கொண்டு
  rationale: இங்கு חזק என்பதன் ஹிஃபில் வடிவம் கையில் பற்றியிருப்பதைக் குறிக்கிறது. தொடர்ச்சியான செயல்களின் தமிழ்நடை ஓட்டத்துக்கு ‘பிடித்துக்கொண்டு’ இயல்பாக அமைகிறது.
- source_word: בְיַד שְׂמאוֹלָם ... וּבְיַד יְמִינָם
  choice: தங்கள் இடது கைகளில் ... தங்கள் வலது கைகளில்
  rationale: எபிரெயச் சொல்லமைப்பு ஒருமையாக இருந்தாலும் அது ஒவ்வொருவருக்கும் பகிர்ந்து பொருந்தும் விதத்தில் பயன்படுத்தப்பட்டுள்ளது. தமிழில் பன்மை எழுவாய்க்கு ‘கைகளில்’ என்பது தெளிவான இயல்பான வடிவம்.
- source_word: לַפִּדִים
  choice: தீப்பந்தங்கள்
  rationale: לַפִּיד என்பது எரியும் ஒளிப்பந்தம் அல்லது தீப்பந்தத்தைக் குறிக்கிறது. இக்காட்சியில் ‘தீப்பந்தங்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: לִתְקֹעַ
  choice: ஊதுவதற்காக
  rationale: இந்த வினையெச்சம் நோக்கத்தைக் குறிக்கிறது. ‘ஊதுவதற்காக’ என்பது ஊதுகொம்புகளை வலது கைகளில் வைத்திருந்த நோக்கத்தை மூலத்துக்கு நெருக்கமாகத் தெரிவிக்கிறது.
- source_word: וַיִּקְרְאוּ
  choice: முழக்கமிட்டார்கள்
  rationale: קרא இங்கு போர்க்களத்தில் உரக்க எழுப்பிய முழக்கத்தைக் குறிக்கிறது. ‘முழக்கமிட்டார்கள்’ அதன் வலிமையையும் சூழலையும் இயல்பான தமிழில் தருகிறது.
- source_word: חֶרֶב לַיהוָה וּלְגִדְעוֹן
  choice: யாவேக்காகவும் கிதியோனுக்காகவும் ஒரு வாள்!
  rationale: வினையில்லாத, சுருக்கமான எபிரெயப் போர்முழக்கத்தையும் לְ என்பதன் ‘-க்காக’ பொருளையும் இவ்வடிவம் காக்கிறது. தமிழில் இயல்பாகத் தேவையான வரிசை மாற்றம் மட்டும் செய்யப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பொதுப்பட்டமல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரைக் குறிக்கும் நான்கெழுத்துத் திருப்பெயர். ஆகவே ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: חֶרֶב לַיהוָה וּלְגִדְעוֹן என்ற போர்முழக்கத்தின் பொருள்
  choice: யாவேக்காகவும் கிதியோனுக்காகவும் ஒரு வாள்!
  alternative: யாவேயின் வாளும் கிதியோனின் வாளும்!
  rationale: எபிரெயச் சொற்றொடர் வினையில்லாமல் சுருக்கமாக உள்ளது; לְ என்பது ‘-க்கு/-க்காக’ என்றும் உடைமை உறவாகவும் புரிந்துகொள்ளப்படலாம். முதன்மை மொழிபெயர்ப்பு முன்னிடைச்சொல்லின் நேரடியான பொருளையும் திடீர் போர்முழக்கத் தன்மையையும் காக்கிறது; நியாயமான மற்றொரு வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. போர்முழக்கத்தின் சுருக்கமும் மூலத்திலுள்ள பொருள் இருமையும் பாதுகாக்கப்பட்டுள்ளன; அடிக்குறி [a] அதற்குரிய சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
