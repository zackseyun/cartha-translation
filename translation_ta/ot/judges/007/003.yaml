  text: וְ/עַתָּ֗ה קְרָ֨א נָ֜א בְּ/אָזְנֵ֤י הָ/עָם֙ לֵ/אמֹ֔ר מִֽי יָרֵ֣א וְ/חָרֵ֔ד יָשֹׁ֥ב וְ/יִצְפֹּ֖ר מֵ/הַ֣ר הַ/גִּלְעָ֑ד וַ/יָּ֣שָׁב מִן הָ/עָ֗ם עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וַ/עֲשֶׂ֥רֶת אֲלָפִ֖ים נִשְׁאָֽרוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/003.yaml
  text: Please proclaim in the hearing of the people[a], saying, ‘Whoever is fearful and trembling, let him return and depart from Mount Gilead.’ Then twenty-two thousand of the people returned[b], and ten thousand remained.
translation:
  language: ta
  text: 'இப்போது, மக்கள் கேட்கும்படி தயவுசெய்து அறிவித்துச் சொல்: “அஞ்சியும் நடுங்குகிறவன் கிலேயாத் மலையிலிருந்து[a] திரும்பி விலகிப் போகட்டும்[b].” அப்போது மக்களில் இருபத்திரண்டாயிரம் பேர் திரும்பிப் போனார்கள்; பத்தாயிரம் பேர் மீதமிருந்தார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கிலேயாத் மலை’ என்பது எபிரெயச் சொற்றொடரின் நேரடியான மொழிபெயர்ப்பு. ஆனால் இச்சூழலில் அது எந்த இடத்தைக் குறிக்கிறது என்பது தெளிவாக இல்லை; சிலர் இதைக் ‘கிலேயாத்தின் மலைப்பகுதி’ என்று புரிந்துகொள்கிறார்கள்.
    reason: cultural_note
  - marker: b
    text: ‘விலகிப் போ’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெய வினைச்சொல் (וְיִצְפֹּר) அரிதானதும் பொருள் விவாதத்திற்குரியதுமாகும்; அது ‘அதிகாலையிலேயே புறப்படு’ அல்லது ‘நழுவிச் செல்’ என்ற நிழற்பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: எபிரெய மூலத்தில் וְעַתָּה (‘இப்போது’) வெளிப்படையாக இருப்பதால், உரையாடலின் அடுத்த கட்டத்தைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: קְרָא נָא בְּאָזְנֵי הָעָם לֵאמֹר
  choice: மக்கள் கேட்கும்படி தயவுசெய்து அறிவித்துச் சொல்
  rationale: קרא என்பது பொதுவாக அறிவிப்பதையும், נָא வேண்டுகோள் கலந்த கட்டளையையும், בְּאָזְנֵי הָעָם மக்கள் கேட்கும் வகையில் சொல்லப்படுவதையும் குறிக்கின்றன.
- source_word: מִי יָרֵא וְחָרֵד
  choice: அஞ்சிப் பதறுகிறவன்
  rationale: יָרֵא அச்சத்தையும் חָרֵד நடுக்கம் அல்லது பதற்றத்தையும் குறிக்கும்; இயல்பான தமிழில் இரண்டின் தீவிரத்தையும் இச்சொற்றொடர் தக்கவைக்கிறது.
- source_word: יָשֹׁב
  choice: திரும்பி ... போகட்டும்
  rationale: இது அனுமதி அல்லது வழிநடத்தல் பொருளுள்ள jussive வடிவம்; ‘போகட்டும்’ அந்தக் கட்டளைநயத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְיִצְפֹּר
  choice: விலகிப் போகட்டும்
  rationale: அரிதானதும் பொருள் விவாதத்திற்குரியதுமான இந்த வினை, சூழலில் படையணியிலிருந்து அகன்று செல்வதைக் குறிக்கிறது; குறிப்பான விவாதத்திற்குரிய நிழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מֵהַר הַגִּלְעָד
  choice: கிலேயாத் மலையிலிருந்து
  rationale: הַר என்பதன் நேரடியான ஒருமை இடப்பெயர்சார் வாசிப்பு ‘மலை’; இச்சூழலிலுள்ள புவியியல் சிக்கல் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: இருபத்திரண்டாயிரம் பேர்
  rationale: நவீனத் தமிழின் இயல்பான எண்ணுருவும் மனிதர்களைக் குறிக்கும் ‘பேர்’ என்பதும் பயன்படுத்தப்பட்டன.
- source_word: וַעֲשֶׂרֶת אֲלָפִים נִשְׁאָרוּ
  choice: பத்தாயிரம் பேர் மீந்திருந்தார்கள்
  rationale: נשאר என்பதன் ‘மீதியாக இருத்தல்’ என்ற பொருளை இயல்பான தமிழ் கதைநடையில் வெளிப்படுத்துகிறது.
