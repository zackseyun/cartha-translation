translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் வெளிப்படையாக உள்ள וְעַתָּה ‘இப்போது’ எனத் தக்கவைக்கப்பட்டது; ஆங்கில ஆலோசனை உரையின் சமீபத்திய நீக்கத்தை இங்கு பின்பற்றவில்லை. விவாதத்திற்குரிய வினைச்சொல் மற்றும் புவியியல் குறிப்பு உரையில் மிகையாகத் தீர்மானிக்கப்படாமல் அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளன.
