base_translation:
  language: en
  yaml_path: translation/ot/judges/007/002.yaml
  text: And Yahweh said to Gideon[a], “The people who are with you are too many for me to give Midian into their hand, lest Israel boast against me, saying[b], ‘My own hand has saved me.’”
translation:
  language: ta
  text: யாவே கிதியோனிடம், “மீதியானை அவர்களுடைய கையில் ஒப்புக்கொடுக்க உன்னோடு இருக்கும் மக்கள் மிக அதிகம்.[a] இல்லையென்றால், ‘என் சொந்தக் கையே என்னைக் காப்பாற்றியது’[b] என்று சொல்லி இஸ்ரவேல் எனக்கு எதிராகத் தன்னைப் பெருமைப்படுத்திக்கொள்ளும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில் ‘கை’ என்ற ஒருமை வடிவம் அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் மரபுத்தொடராகப் பயன்படுகிறது. இதை ‘அவர்களுடைய கைகளில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘என்னை விடுவித்தது’ என்றும் மொழிபெயர்க்கலாம். எபிரேய வினைச்சொல் ‘காப்பாற்று’ அல்லது ‘விடுவி’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழில் பரவலாக அறியப்படும் வடிவில் இறைவனின் தனிப்பெயரைத் தலைப்பால் மாற்றாமல் வழங்குகிறது.
- source_word: רַב הָעָם אֲשֶׁר אִתָּךְ
  choice: உன்னோடு இருக்கும் மக்கள் மிக அதிகம்
  rationale: ‘மக்கள் அதிகமானவர்கள்’ என்ற எபிரேய அமைப்பை, பின்வரும் தடைக் கருத்துடன் இயல்பான நவீன தமிழில் இணைக்கிறது.
- source_word: מִתִּתִּי אֶת־מִדְיָן בְּיָדָם
  choice: மீதியானை அவர்களுடைய கையில் நான் ஒப்புக்கொடுக்கமாட்டேன்
  rationale: מן + வினையெச்சத்தின் தடுக்கும் பொருளைத் தெளிவாக்குகிறது; ‘கையில் ஒப்புக்கொடுத்தல்’ என்ற ஆட்சி/கட்டுப்பாட்டு மரபுத்தொடரையும் காக்கிறது.
- source_word: פֶּן
  choice: இல்லையென்றால்
  rationale: எதிர்மறை நோக்கம் அல்லது ஏற்படக்கூடிய விளைவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יִתְפָּאֵר עָלַי
  choice: எனக்கு எதிராகப் பெருமைபாராட்டிக்கொள்ளும்
  rationale: தன்னை உயர்த்திப் பெருமை பேசுதல் மற்றும் עַל தரும் எதிர்நிலை ஆகிய இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: יָדִי
  choice: என் சொந்தக் கையே
  rationale: முதல் நபர் உரிமையின் வலியுறுத்தலை ‘சொந்த’ மற்றும் ஏகாரத்தால் இயல்பாகக் காட்டுகிறது.
- source_word: הוֹשִׁיעָה לִּי
  choice: என்னைக் காப்பாற்றியது
  rationale: ישע என்பதன் அடிப்படை ‘காப்பாற்று/விடுவி’ பொருளை இச்சூழலில் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: இறைவனின் தனிப்பெயர்
  choice: யெகோவா
  alternative: யாவே
  rationale: יהוה என்பதை ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மாற்றாமல் தனிப்பெயராகவே வழங்குகிறது; தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பைத் தேர்ந்தெடுக்கிறது.
- issue: ஒருமைக் கூட்டுப்பெயராக இஸ்ரவேல்
  choice: “இஸ்ரவேல் ... ‘என் ... என்னை’” என்ற ஒருமையைப் பேணுதல்
  alternative: “இஸ்ரவேலர் ... ‘எங்கள் ... எங்களை’” எனப் பன்மையாக்குதல்
  rationale: எபிரேய மூலத்தில் இஸ்ரவேல் ஒருமைக் கூட்டுருவாகப் பேசுவதால் அதன் பார்வையையும் இறையியல் நையாண்டியையும் மாற்றாமல் காக்கிறது.
- issue: தெய்வீகச் செயலும் மனிதப் பெருமையும்
  choice: மக்கள் அதிகமாக இருப்பதால் யெகோவா ஒப்புக்கொடுக்கமாட்டார்; இல்லையென்றால் இஸ்ரவேல் தன்னைப் பெருமைப்படுத்தும்
  alternative: இஸ்ரவேலின் வெற்றி வெறும் இராணுவத் தன்னம்பிக்கையாக மட்டுமே விளக்கப்படுதல்
  rationale: வெற்றி யாரால் உண்டானது என்ற மூலவசனத்தின் பதற்றத்தையும், இஸ்ரவேல் கடவுளுக்கு எதிராகத் தன்னை உயர்த்தும் அபாயத்தையும் பேணுகிறது.
translation_notes:
  register: நவீன, தரமான, கண்ணியமான தமிழ். எபிரேயக் கதைநடையின் நேர்மையைக் காக்கும் போதும், தடைக் கருத்தை இயல்பான தமிழ் வாக்கியங்களாகப் பிரித்துள்ளது. ‘இஸ்ரவேல்’ ஒருமைக் கூட்டுப்பெயராகப் பேணப்பட்டுள்ளது; எல்லா அடிக்குறிப்புக் குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
