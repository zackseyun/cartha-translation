  source_fidelity: மூல எபிரெயத்தின் நிபந்தனைத் தொடக்கம், பயம், ‘இறங்குதல்’ வினையின் இருமுறை பயன்பாடு, பூராவுடன் செல்லுதல், முகாமை நோக்கிய இயக்கம் ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. נַעַרְךָ என்பதற்கான ‘உன் உதவியாளனாகிய’ என்பது இச்சூழலில் பாதுகாப்பான சூழல்சார் தெரிவாகும்; அடிக்குறிப்பு அதன் முக்கியமான சொற்பொருள் மாற்றுகளையும் வழங்குகிறது.
