  text: וְ/אִם יָרֵ֥א אַתָּ֖ה לָ/רֶ֑דֶת רֵ֥ד אַתָּ֛ה וּ/פֻרָ֥ה נַעַרְ/ךָ֖ אֶל הַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/010.yaml
  text: But if you are afraid to go down[a], go down to the camp with Purah your servant.
translation:
  language: ta
  text: ஆனால் நீ இறங்கிச் செல்லப் பயப்படுகிறாய் என்றால், உன் உதவியாளனாகிய பூராவுடன்[a] முகாமுக்கு இறங்கிச் செல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் இளைஞனாகிய பூராவுடன்”; அல்லது, “உன் பணியாளனாகிய பூராவுடன்.” எபிரெய மொழியிலுள்ள நஅர் என்ற சொல் சூழலுக்கு ஏற்ப இளைஞன், பணியாள் அல்லது உதவியாளர் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... என்றால்
  rationale: முந்தைய கட்டளைக்கு நிபந்தனையுடன் கூடிய மென்மையான எதிர்மாற்றை அறிமுகப்படுத்துகிறது.
- source_word: יָרֵא אַתָּה
  choice: நீ ... பயப்படுகிறாய்
  rationale: கிதியோனின் தற்போதைய அச்சநிலையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: לָרֶדֶת / רֵד
  choice: இறங்கிச் செல்ல / இறங்கிச் செல்
  rationale: எபிரெய மூலத்தில் ஒரே வினைச்சொல் திரும்ப வருவதைக் காத்து, தமிழில் இயல்பாக அமைக்கிறது.
- source_word: וּפֻרָה
  choice: பூராவுடன்
  rationale: וְ இங்கு பூரா கிதியோனோடு செல்வதைக் குறிக்கும் உடனிகழ்ச்சியாகச் சூழலில் புரிந்துகொள்ளப்படுகிறது.
- source_word: נַעַרְךָ
  choice: உன் உதவியாளனாகிய
  rationale: נַעַר என்பது இளைஞன், பணியாள், உதவியாளர் எனப் பொருள்படலாம்; இச்சூழலில் கிதியோனுக்குத் துணையாகச் செல்லும் கீழ்நிலை உதவியாளரை இயல்பாகக் குறிக்கிறது.
- source_word: אֶל הַמַּחֲנֶה
  choice: முகாமுக்கு
  rationale: אֶל என்பதன் திசைநோக்கிய பொருளை நேரடியாகக் காக்கிறது; 'முகாமுக்குள்' என மிகுதியாக விளக்கவில்லை.
