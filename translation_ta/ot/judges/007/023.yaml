  text: וַ/יִּצָּעֵ֧ק אִֽישׁ יִשְׂרָאֵ֛ל מִ/נַּפְתָּלִ֥י וּ/מִן אָשֵׁ֖ר וּ/מִן כָּל מְנַשֶּׁ֑ה וַֽ/יִּרְדְּפ֖וּ אַחֲרֵ֥י מִדְיָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/023.yaml
  text: And the men of Israel were called out from Naphtali[a], from Asher, and from all Manasseh[c][b], and they pursued Midian.
translation:
  language: ta
  text: இஸ்ரவேலின் ஆண்கள்[b] நப்தலியிலிருந்தும், ஆசேரிலிருந்தும், மனாசே கோத்திரம் முழுவதிலிருந்தும் அணிதிரட்டப்பட்டார்கள்[a]. அவர்கள் மீதியானைத் துரத்தினார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அழைக்கப்பட்டார்கள்” அல்லது “ஒன்றுகூட்டப்பட்டார்கள்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரேய வினைச்சொல் பொருள் காணக் கடினமானது; அதன் அடிப்படைப் பொருள் “கூக்குரலிடுதல்.” ஆனால் இச்சூழலில், மீதியானைப் படைகளைத் துரத்துவதற்காக இஸ்ரவேலர் திரட்டப்பட்டதையே அது குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் “இஸ்ரவேலின் மனிதன்” என்று ஒருமை வடிவம் உள்ளது; இது “இஸ்ரவேலின் ஆண்கள்” அல்லது “இஸ்ரவேலர்” என்ற கூட்டுப்பொருள் தரும் சொற்றொடர்.
    reason: lexical_alternative
  - marker: c
    text: “மீதியான்” என்பது இங்கு மீதியானியப் படைகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק
  choice: அணிதிரட்டப்பட்டார்கள்
  rationale: நிஃபால் வடிவமும் போர்ச் சூழலும், இஸ்ரவேலர் தப்பியோடும் எதிரியைத் துரத்துவதற்காக ஒன்றுகூட்டப்பட்டதைக் குறிக்கின்றன. ‘அணிதிரட்டப்பட்டார்கள்’ என்பது செயலின் படைசார் பொருளை இயல்பான தமிழில் தருகிறது; மூல வினையின் வழக்கமான ‘கூக்குரலிட்டான்’ என்ற பொருள் இச்சூழலுக்கும் வினை வடிவத்திற்கும் குறைவாகப் பொருந்துகிறது.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேல் ஆண்கள்
  rationale: எபிரேயத்தில் ஒருமை வடிவம் இருந்தாலும், இது கூட்டுப்பொருளில் வருகிறது; தொடர்ந்து வரும் பன்மை வினைச்சொல் அதனை உறுதிப்படுத்துகிறது. ஆண்பால் குறிப்பையும் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מִנַּפְתָּלִי
  choice: நப்தலியிலிருந்தும்
  rationale: מִן என்னும் முன்னிடைச்சொல் இங்கு அவர்கள் வந்த மூல இடத்தையோ கோத்திரத்தையோ குறிக்கிறது.
- source_word: וּמִן אָשֵׁר
  choice: ஆசேரிலிருந்தும்
  rationale: அணிதிரட்டப்பட்டவர்கள் வந்த கோத்திரங்களின் பட்டியலை இயல்பான தமிழில் தொடர்கிறது.
- source_word: וּמִן כָּל מְנַשֶּׁה
  choice: மனாசே முழுவதிலிருந்தும்
  rationale: כָּל தரும் முழுமையைக் காத்து, கோத்திரப் பெயரை தேவையின்றி விரிவுபடுத்தாமல் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: וַיִּרְדְּפוּ
  choice: பின்தொடர்ந்தார்கள்
  rationale: רדף என்பது இப்போர்ச் செய்தியில் தப்பிச் செல்லும் எதிரியைத் துரத்திச் செல்வதைக் குறிக்கிறது. ‘பின்தொடர்ந்தார்கள்’ துல்லியமானதும் பொதுவாசகருக்கு இயல்பானதும் ஆகும்.
- source_word: אַחֲרֵי מִדְיָן
  choice: மீதியானைப்
  rationale: רדף உடன் வரும் אַחֲרֵי தமிழில் நேரடிச் செயப்படுபொருளாக இயல்பாக வெளிப்படுகிறது. ‘மீதியான்’ என்பது இங்கு மீதியானியப் படைகளைக் குறிக்கும் ஆகுபெயர்; மூலத்தின் இடப்பெயர் வடிவம் பாதுகாக்கப்படுகிறது.
