translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் கூட்டுப்பொருள், கோத்திரப் பட்டியல், படைசார் அணிதிரட்டல், ‘மீதியான்’ என்ற ஆகுபெயர் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
