base_translation:
  language: en
  yaml_path: translation/ot/judges/007/001.yaml
  text: Then Jerubbaal (that is[a], Gideon) and all the people who were with him rose early and camped by the spring of Harod. The camp of Midian was north of him, by the hill of Moreh in the valley.
translation:
  language: ta
  text: அப்போது யெருபாகால்—அதாவது கிதியோன்—அவரோடு இருந்த மக்கள் அனைவரும் அதிகாலையில் எழுந்து, ஹரோத் நீரூற்றருகே[a] முகாமிட்டார்கள். மீதியானின் முகாம் அவருக்கு வடக்கே, பள்ளத்தாக்கிலுள்ள மோரே குன்றருகே இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்-ஹரோத் அருகே.” இந்த எபிரெயப் பெயரில் “நீரூற்று” என்பதற்கான சொல் அடங்கியுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: அதிகாலையில் எழுந்து
  rationale: שׁכם என்பதன் ஹிப்இல் வடிவம் அதிகாலையில் எழுதல் என்ற காலநுணுக்கத்தைக் கொண்டுள்ளது; இயல்பான நவீனத் தமிழில் அதைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְרֻבַּעַל הוּא גִדְעוֹן
  choice: யெருபாகால்—அதாவது கிதியோன்—
  rationale: הוּא இங்கு இரு பெயர்களும் ஒரே நபரைக் குறிக்கின்றன என்பதை விளக்கும் இணைப்பாக உள்ளது; இரு பெயர்களும் பாதுகாக்கப்படுகின்றன.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: அவரோடு இருந்த மக்கள் அனைவரும்
  rationale: עָם என்பதன் பொதுவான ‘மக்கள்’ என்ற பொருள் தக்கவைக்கப்பட்டுள்ளது; சூழல் இராணுவமானதாயிருந்தாலும் ‘வீரர்கள்’ என்று குறிப்பாக்கப்படவில்லை.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பதன் ‘முகாமிடுதல்’ என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: עַל עֵין חֲרֹד
  choice: ஆரோத் நீரூற்றருகே
  rationale: עֵין என்பது நீரூற்றையும் இடப்பெயரின் கூறையும் குறிக்கிறது; பெயரை ஒலிபெயர்த்து, அதன் புவியியல் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: וּמַחֲנֵה מִדְיָן
  choice: மீதியானின் முகாம்
  rationale: எபிரெயக் கட்டமைப்பின் நேரடியான உடைமை உறவைத் தக்கவைக்கிறது; ‘மீதியானியரின்’ என்று இனப்பெயராக்கவில்லை.
- source_word: הָיָה לוֹ מִצָּפוֹן
  choice: அவருக்கு வடக்கே ... இருந்தது
  rationale: לוֹ என்ற ஒருமை ஆண்பால் பின்னொட்டை அப்படியே தக்கவைத்து, கிதியோனைச் சுட்டும் ‘அவருக்கு’ என மொழிபெயர்க்கிறது; பன்மையாகச் சீராக்கப்படவில்லை.
- source_word: מִגִּבְעַת הַמּוֹרֶה
  choice: மோரே குன்றருகே
  rationale: מן இங்குள்ள நிலவியல் விளக்கத்தில் பிரிவைவிட அண்மையைச் சுட்டுவதாகப் புரிந்துகொள்ளப்பட்டு, இயல்பாக ‘அருகே’ எனத் தரப்பட்டுள்ளது.
- source_word: בָּעֵמֶק
  choice: பள்ளத்தாக்கிலுள்ள
  rationale: עֵמֶק என்பதன் பொதுவான நிலவியல் பொருளான ‘பள்ளத்தாக்கு’ தெளிவாகத் தரப்பட்டுள்ளது.
