base_translation:
  language: en
  yaml_path: translation/ot/judges/007/006.yaml
  text: And the number of those lapping with their hand to their mouth was three hundred men[a], but all the rest of the people knelt on their knees to drink water.
translation:
  language: ta
  text: தங்கள் கையால் தங்கள் வாய்க்குத் தண்ணீரைக் கொண்டுவந்து நக்கிக் குடித்தவர்களின் எண்ணிக்கை முந்நூறு பேர்; மீதியிருந்த மக்கள் அனைவரும் தண்ணீர் குடிப்பதற்காகத் தங்கள் முழங்கால்களில் மண்டியிட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் கையிலிருந்து தங்கள் வாய்க்கு.” அவர்கள் குனிந்து நேரடியாகக் குடிக்காமல், கையால் தண்ணீரை வாய்க்குக் கொண்டுவந்ததை எபிரெயச் சொற்றொடர் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: எண்ணிக்கை
  rationale: ஒரு குறிப்பிட்ட குழுவின் மொத்த எண்ணிக்கையை இயல்பாகவும் நேரடியாகவும் குறிக்கிறது.
- source_word: הַמֲלַקְקִים
  choice: நக்கிக் குடித்தவர்கள்
  rationale: לקק என்ற வினையின் தெளிவான உடல் செயலைப் பாதுகாக்கிறது; தமிழில் தண்ணீர் அருந்தும் இச்செயலை இயல்பாக விளக்குகிறது.
- source_word: בְּיָדָם אֶל־פִּיהֶם
  choice: தங்கள் கையால் தண்ணீரை வாய்க்குக் கொண்டுவந்து
  rationale: எபிரெயச் சொற்றொடரின் கை-வாய் இயக்கத்தைத் தெளிவுபடுத்தி, நேரடியாகக் குனிந்து குடித்த மற்றவர்களுடனான வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: முந்நூறு பேர்
  rationale: படைச் சூழலில் ஆண்களைக் குறித்தாலும், எண்ணிக்கைக்குப் பின் வரும் אִישׁ என்பதற்கான இயல்பான நவீனத் தமிழ் வடிவம் ‘பேர்’ ஆகும்.
- source_word: וְכֹל יֶתֶר הָעָם
  choice: மற்ற மக்கள் அனைவரும்
  rationale: முந்நூறு பேருக்கும் மீதியிருந்த முழுக் குழுவுக்கும் இடையிலான மாறுபாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: כָּרְעוּ עַל בִּרְכֵיהֶם
  choice: முழங்காலிட்டார்கள்
  rationale: ‘தங்கள் முழங்கால்களின் மேல் மண்டியிட்டார்கள்’ என்ற கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לִשְׁתּוֹת מָיִם
  choice: தண்ணீர் குடிப்பதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் எபிரெய இறந்தொழிலைப் பாதுகாத்து, ‘தண்ணீர்’ என்பதையும் வெளிப்படையாக வைத்திருக்கிறது.
