  to: தங்கள் கையால் தங்கள் வாய்க்குத் தண்ணீரைக் கொண்டுவந்து நக்கிக் குடித்தவர்களின் எண்ணிக்கை முந்நூறு பேர்; மீதியிருந்த மக்கள் அனைவரும் தண்ணீர் குடிப்பதற்காகத் தங்கள் முழங்கால்களில் மண்டியிட்டார்கள்.[a]
