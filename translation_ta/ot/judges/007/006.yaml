  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நக்கிக் குடித்தல்’ என்ற காட்சிப்படிமமும் இரு குழுக்களின் உடல் நிலை வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
