base_translation:
  language: en
  yaml_path: translation/ot/judges/007/013.yaml
  text: 'When Gideon came[a], behold, a man was telling a dream to his companion. He said, “Look, I dreamed a dream: behold, a round loaf of barley bread was rolling around in the camp of Midian, and it came up to the tent and struck it so that it fell, He turned it upside down, and the tent collapsed.”'
translation:
  language: ta
  text: 'கிதியோன் வந்தபோது, இதோ, ஒருவன் தன் தோழனிடம் ஒரு கனவை விவரித்துக்கொண்டிருந்தான். அவன், “இதோ, நான் ஒரு கனவு கண்டேன்: உருண்டையான வாற்கோதுமை அப்பம் ஒன்று[a] மீதியானியரின் முகாமில் உருண்டுகொண்டே வந்து, ஒரு கூடாரம்வரை வந்து அதைத் தாக்கியது. அந்தக் கூடாரம் விழுந்தது; அந்த அப்பம் அதைத் தலைகீழாகப் புரட்டியது; கூடாரம் சரிந்து விழுந்தது” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வாற்கோதுமையால் செய்யப்பட்ட வட்டமான அடை ஒன்று” அல்லது “வாற்கோதுமை அப்பம் ஒன்று” என்றும் மொழிபெயர்க்கலாம். இங்கு பயன்படுத்தப்பட்டுள்ள எபிரெயச் சொல் அரிதானது; அது வட்டமான அடையையோ அப்பத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא גִדְעוֹן
  choice: கிதியோன் அங்கே வந்தபோது
  rationale: தொடர்கதை வினைச்சொல்லின் முன்னேற்றத்தையும் அடுத்த காட்சியோடு உள்ள காலத் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீரெனக் கவனத்தை ஈர்க்கும் எபிரெயத் துகளின் உயிரோட்டத்தைப் பாதுகாக்கிறது; நேரடி உரையிலும் அதன் மறுபயன்பாடு தக்கவைக்கப்பட்டுள்ளது.
- source_word: מְסַפֵּר לְרֵעֵהוּ חֲלוֹם
  choice: தன் தோழனிடம் ஒரு கனவை விவரித்துக்கொண்டிருந்தான்
  rationale: பங்கேற்புவினையின் தொடர்ச்சியான செயலை ‘விவரித்துக்கொண்டிருந்தான்’ காட்டுகிறது; இராணுவச் சூழலில் רֵעַ என்பதற்கு ‘தோழன்’ பொருத்தமானது.
- source_word: הִנֵּה חֲלוֹם חָלַמְתִּי
  choice: இதோ, நான் ஒரு கனவு கண்டேன்
  rationale: மூலத்திலுள்ள ஒரே வேர்ச்சொல் மீளுருவாக்கத்தின் வலியுறுத்தலை தமிழின் இயல்பான ‘கனவு கண்டேன்’ என்ற அமைப்பு தக்கவைக்கிறது.
- source_word: צלול לֶחֶם שְׂעֹרִים
  choice: உருண்டையான வாற்கோதுமை அப்பம் ஒன்று
  rationale: அரிதான צלול என்பதன் சாத்தியமான வட்ட வடிவப் பொருளையும், לֶחֶם שְׂעֹרִים என்பதன் வாற்கோதுமை அப்பம் என்ற பொருளையும் தெளிவாகக் காட்டுகிறது; சொல் அரிதானதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִתְהַפֵּךְ
  choice: உருண்டுகொண்டே வந்து
  rationale: தன்னைத்தானே திருப்பிக்கொண்டு நகரும் அல்லது புரண்டுவரும் இயக்கத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: בְּמַחֲנֵה מִדְיָן
  choice: மீதியானியரின் முகாமில்
  rationale: בְּ என்பதன் அடிப்படை இடப்பொருளைத் தக்கவைக்கிறது; இயக்கம் வினைச்சொல் மூலம் வெளிப்படுகிறது.
- source_word: עַד הָאֹהֶל
  choice: ஒரு கூடாரம்வரை
  rationale: עַד குறிக்கும் எல்லைப் புள்ளிவரை வந்த இயக்கத்தை நேரடியாகக் காட்டுகிறது; எபிரெயில் குறிப்பிட்ட உருபு இருந்தாலும் கனவுக் காட்சியை தமிழில் முதன்முறையாக அறிமுகப்படுத்துவதால் ‘ஒரு கூடாரம்’ இயல்பானது.
- source_word: וַיַּכֵּהוּ
  choice: அதைத் தாக்கியது
  rationale: வலிமையான மோதலை எளிய, நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיְהַפְּכֵהוּ לְמַעְלָה
  choice: அந்த அப்பம் அதைத் தலைகீழாகப் புரட்டியது
  rationale: ஆண்பால் ஒருமை வினை வடிவத்தின் தொடர்ச்சியான எழுவாயாக அப்பத்தைப் புரிந்துகொண்டு, கூடாரத்தைச் சுட்டும் பெயர்ச்சொல் பிரதியைத் தமிழில் தக்கவைக்கிறது; ‘மேல்நோக்கிப் புரட்டுதல்’ என்ற படிமம் இயல்பாக ‘தலைகீழாகப் புரட்டியது’ என வழங்கப்படுகிறது.
- source_word: וְנָפַל הָאֹהֶל
  choice: கூடாரம் சரிந்து விழுந்தது
  rationale: נפל என்பதன் விழுதல் பொருளைத் தக்கவைத்தபடி, கூடாரம் அழிவுறும் விதமாக விழுந்ததை இயல்பான தமிழில் ‘சரிந்து விழுந்தது’ என வெளிப்படுத்துகிறது.
theological_decisions:
- issue: וַיְהַפְּכֵהוּ என்பதன் மறைமுக எழுவாய் மற்றும் பெயர்ச்சொல் பிரதியின் குறிப்பு
  choice: உருண்டுவந்த அப்பமே கூடாரத்தைத் தலைகீழாகப் புரட்டியதாகத் தொடரை வழங்குதல்
  alternative: பெயர்ச்சொல் பிரதியை தனி மனித எழுவாயாகக் கொண்டு ‘அவன் அதைத் தலைகீழாகப் புரட்டினான்’ என்று மொழிபெயர்த்தல்
  rationale: எபிரெயக் கதைத்தொடரில் புதிதாக ஒரு மனித எழுவாய் அறிமுகப்படுத்தப்படவில்லை; கனவில் நகரும் அப்பமே முந்தைய தெளிவான ஆண்பால் ஒருமை எழுவாய். ஆகவே அப்பத்தை எழுவாயாக வைத்தல் இலக்கண மற்றும் காட்சித் தொடர்ச்சிக்கு ஏற்றது; இதனால் கனவின் குறியீட்டுப் பொருளை மொழிபெயர்ப்பிலேயே விளக்கிவிடுவதும் தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வாய்வழியாக வாசிக்க ஏற்ற கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற சொல் மூலத்தின் காட்சியூட்டும் வலிமையையும் மீளுருவாக்கத்தையும் பாதுகாக்கிறது. ‘மீதியானியர்’ என்பது மிதியான் மக்களைக் குறிக்கும் இயல்பான இனப்பெயர் வடிவமாகப் பயன்படுத்தப்பட்டுள்ளது.
