base_translation:
  language: en
  yaml_path: translation/ot/judges/007/018.yaml
  text: When I and all who are with me blow the ram’s horn[a], then you also must blow the horns all around the whole camp, and say[b], ‘For Yahweh and for Gideon!’
translation:
  language: ta
  text: நானும் என்னோடு இருப்பவர்கள் அனைவரும் ஆட்டுக்கடாவின் கொம்பை ஊதும்போது[b], நீங்களும் முகாம் முழுவதையும் சுற்றி கொம்புகளை ஊதி, “யாவேக்காகவும் கிதியோனுக்காகவும்!” என்று சொல்லுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில பாரம்பரிய மொழிபெயர்ப்புகள் நீதிபதிகள் 7:20-இல் வரும் அருகிலுள்ள சொற்றொடரின் தாக்கத்தால், “யாவேயின் வாளும் கிதியோனின் வாளும்” என்று வாசிக்கின்றன. ஆனால் இந்த வசனத்தின் எபிரெய உரை, “யாவேக்காகவும் கிதியோனுக்காகவும்” என்று மட்டுமே கூறுகிறது.
    reason: alternative_reading
  - marker: b
    text: எபிரெய שׁוֹפָר என்பது உலோக எக்காளத்தை அல்ல, பொதுவாக ஆட்டுக்கடாவின் கொம்பால் செய்யப்பட்ட ஊதுகருவியைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: תָקַעְתִּי / תְקַעְתֶּם
  choice: ஊதும்போது / ஊதி
  rationale: שׁוֹפָר என்பதுடன் תקע வரும்போது கொம்பை ஊதுதல் எனப் பொருள். தமிழில் இயல்பான வினைச்சொல்லான ‘ஊது’ மூலத்தின் தெளிவான செயலைப் பாதுகாக்கிறது.
- source_word: שׁוֹפָר / שׁוֹפָרוֹת
  choice: ஆட்டுக்கடாவின் கொம்பு / கொம்புகள்
  rationale: שׁוֹפָר என்பது உலோக எக்காளத்தைக் காட்டிலும் பொதுவாக விலங்கின், குறிப்பாக ஆட்டுக்கடாவின், கொம்பால் செய்யப்பட்ட ஊதுகருவியைக் குறிக்கிறது. முதல் இடத்தில் அதன் இயல்பைத் தெளிவுபடுத்தி, பன்மையில் சுருக்கமாக ‘கொம்புகள்’ என வழங்கப்பட்டுள்ளது.
- source_word: אָנֹכִי וְכָל אֲשֶׁר אִתִּי
  choice: நானும் என்னோடு இருப்பவர்கள் அனைவரும்
  rationale: இது கிதியோனையும் அவருடன் இருந்த மனிதர்களையும் குறிக்கிறது; தமிழில் இயல்பாகவும் நபர்களைக் குறிக்கும் விதமாகவும் உள்ளது.
- source_word: גַּם אַתֶּם
  choice: நீங்களும்
  rationale: גַּם தரும் சேர்த்துக்கொள்ளும் வலியுறுத்தலைத் தமிழ் ‘-உம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: סְבִיבוֹת כָּל הַמַּחֲנֶה
  choice: முகாம் முழுவதையும் சுற்றிலும்
  rationale: סְבִיבוֹת மற்றும் כָּל ஆகிய இரண்டின் முழுமையான சுற்றிவளைத்தல் சார்ந்த இடப்பொருளையும் இந்தச் சொற்றொடர் பாதுகாக்கிறது.
- source_word: וַאֲמַרְתֶּם
  choice: என்று சொல்லுங்கள்
  rationale: மூல வினைச்சொல் பொதுவான ‘சொல்’ என்பதே. போர்க்களச் சூழல் உரத்த குரலைக் குறிப்பாக உணர்த்தினாலும், ‘கூச்சலிடுங்கள்’ என்ற கூடுதல் தீவிரத்தை மூலத்தில் இல்லாமல் சேர்க்கவில்லை.
- source_word: לַיהוָה וּלְגִדְעוֹן
  choice: யாவேக்காகவும் கிதியோனுக்காகவும்
  rationale: இருமுறை வரும் ל முன்னொட்டின் இணையான அமைப்பையும், போர்முழக்கத்தில் வெளிப்படும் சார்பு அல்லது ஆதரவு உணர்வையும் ‘-க்காகவும்’ பாதுகாக்கிறது.
theological_decisions:
- issue: לַיהוָה וּלְגִדְעוֹן என்ற போர்முழக்கத்தை வழங்குதல்
  choice: யாவேக்காகவும் கிதியோனுக்காகவும்!
  alternative: யாவேயின் வாளும் கிதியோனின் வாளும்!
  rationale: இந்த வசனத்தின் எபிரெய உரையில் ‘வாள்’ என்ற சொல் இல்லை; அது நீதிபதிகள் 7:20-இன் அருகிலுள்ள வாசகத்தின் தாக்கத்தால் சில மரபுகளில் சேர்க்கப்பட்டுள்ளது. மேலும், இங்கு יהוה என்ற தனிப்பெயர் நேரடியாக இருப்பதால் ‘யாவே’ என வழங்கப்படுகிறது. ל முன்னொட்டின் துல்லிய நுணுக்கம் சூழலில் சார்பு, ஆதரவு அல்லது அர்ப்பணிப்பைச் சுட்டலாம்; ‘-க்காக’ அதை இயல்பாகத் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதையுரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘யாவே’ உடன்படிக்கையின் தெய்வீகப் பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் இல்லாத ‘வாள்’ அல்லது ‘கூச்சலிடு’ போன்ற கூறுகள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
