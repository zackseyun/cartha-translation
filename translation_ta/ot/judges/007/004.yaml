base_translation:
  language: en
  yaml_path: translation/ot/judges/007/004.yaml
  text: 'Then the LORD said to Gideon, “The people are still too many. Bring them down to the water, and there I will test them for you. And this is what will happen: anyone of whom I say to you, ‘This one shall go with you,’ he shall go with you; but anyone of whom I say to you, ‘This one shall not go with you,’ he shall not go.”'
translation:
  language: ta
  text: 'அப்போது கர்த்தர் கிதியோனிடம், “மக்கள் இன்னும் மிகுதியாக இருக்கிறார்கள். அவர்களைத் தண்ணீருக்கு கீழே அழைத்துச் செல்; அங்கே அவர்களை உனக்காகச் சோதிப்பேன். அப்போது இவ்வாறு இருக்கும்: ‘இவன் உன்னுடன் செல்வான்’ என்று நான் உன்னிடம் எவனைப்பற்றிச் சொல்கிறேனோ, அவன் உன்னுடன் செல்வான்; ‘இவன் உன்னுடன் செல்லமாட்டான்’ என்று நான் உன்னிடம் எவனைப்பற்றிச் சொல்கிறேனோ, அவன் செல்லமாட்டான்” என்றார்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: கர்த்தர்
  rationale: தமிழ் வேதாகம வழக்கில் தெய்வீகப் பெயரைக் குறிக்கும் பரவலாக அறியப்பட்ட மரியாதைமிக்க வடிவம்; குறிப்பிட்ட சமயக்குழுவின் தனிச்சிறப்பைச் சேர்க்காமல் வாசிப்புத் தெளிவைத் தருகிறது.
- source_word: הוֹרֵד אוֹתָם אֶל־הַמַּיִם
  choice: அவர்களைத் தண்ணீரிடம் இறங்கிவரச் செய்
  rationale: הוֹרֵד என்பதன் causative கட்டளையையும், இடத்தை நோக்கிய אֶל என்பதையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: וְאֶצְרְפֶנּוּ
  choice: அவர்களைச் சோதித்துத் தேர்ந்தெடுப்பேன்
  rationale: צרף என்பதன் அடிப்படைப் பொருள் உருக்கிச் சுத்திகரித்தல் அல்லது பரிசோதித்தல்; இச்சூழலில் மனிதர்களை வேறுபடுத்திப் பிரிக்கும் சோதனையைச் சுட்டுவதால் இரு நுணுக்கங்களையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זֶה יֵלֵךְ אִתָּךְ
  choice: இவன் உன்னுடன் செல்லட்டும்
  rationale: எபிரேய மொழியின் நேரடி சுட்டுதலையும் தேர்வு அறிவிப்பின் வலிமையையும் சுருக்கமான தமிழில் தக்கவைக்கிறது.
- source_word: זֶה לֹא יֵלֵךְ עִמָּךְ
  choice: இவன் உன்னுடன் செல்ல வேண்டாம்
  rationale: எதிர்மறைத் தேர்வை இயல்பான தமிழ் கட்டளை/நியமன வடிவில் தெரிவிக்கிறது.
theological_decisions:
- issue: தேர்வைச் செய்பவர் யார் என்பதன் தெளிவு
  choice: “நான் ... யாரைக் குறித்துச் சொல்கிறேனோ” என்ற வடிவில் கடவுளின் நேரடித் தேர்வைத் தக்கவைத்தல்
  alternative: கிதியோன் தானாக மனிதர்களைச் சோதித்துத் தேர்வு செய்வதாக மொழிபெயர்த்தல்
  rationale: மூலத்தில் முதல் நபர் வினைச்சொல்லும் தொடர்ந்து வரும் தெய்வீக அறிவிப்புகளும் தேர்வை யெகோவாவே நிர்ணயிப்பதாகத் தெளிவுபடுத்துகின்றன.
- issue: צרף என்ற உருவகத்தின் மொழிபெயர்ப்பு
  choice: “சோதித்துத் தேர்ந்தெடுப்பேன்”
  alternative: “புடமிடுவேன்” அல்லது “சோதிப்பேன்” மட்டும்
  rationale: “புடமிடுதல்” மூல உருவகத்துக்கு நெருக்கமானதாயினும் இங்கு சாதாரண வாசகருக்கு நோக்கம் தெளிவாக இருக்காது; “சோதிப்பேன்” மட்டும் பின்னர் நிகழும் பிரித்தெடுப்பை முழுமையாக வெளிப்படுத்தாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்க வேதாகம நடையும் பொதுவாசகருக்குப் புரியும் இயல்பான வாக்கிய அமைப்பும் இணைக்கப்பட்டுள்ளன. மூலத்தின் மீளுரைத்தல் தேர்வு அறிவிப்பின் வலிமைக்காகப் பாதுகாக்கப்பட்டுள்ளது.
