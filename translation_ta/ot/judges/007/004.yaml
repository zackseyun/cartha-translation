  source_fidelity: திருத்தம் தேவை. וְאֶצְרְפֶנּוּ என்பதற்கு ‘சோதித்துத் தேர்ந்தெடுப்பேன்’ என்று மொழிபெயர்ப்பது, மூலத்தில் வெளிப்படையாக இல்லாத ‘தேர்ந்தெடுப்பேன்’ என்ற செயலைச் சேர்க்கிறது. மேலும், தொடர்ந்து வரும் יֵלֵךְ / לֹא יֵלֵךְ வடிவங்கள் கட்டளை அல்ல; யார் செல்வார், யார் செல்லமாட்டார் என்பதைக் கூறும் தெய்வீக நிர்ணயமாக உள்ளன.
  naturalness: ‘தண்ணீரிடம் இறங்கிவரச் செய்’ என்பதற்குப் பதில் ‘தண்ணீருக்கு கீழே அழைத்துச் செல்’ என்பது உயரத்திலிருந்து நீரிடத்துக்கு அழைத்துச் செல்லும் எபிரேய கட்டளையை நவீன தமிழில் இயல்பாகக் காட்டுகிறது. ‘செல்வான்/செல்லமாட்டான்’ இங்கு இயல்பானதும் மூலத்தின் அறிவிப்புத் தன்மைக்கு ஏற்றதும் ஆகும்.
