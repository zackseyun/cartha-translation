- from: அப்போது கர்த்தர் கிதியோனிடம், “மக்கள் இன்னும் மிகுதியாக இருக்கிறார்கள். அவர்களைத் தண்ணீரிடம் இறங்கிவரச் செய்; அங்கே உனக்காக அவர்களைச் சோதித்துத் தேர்ந்தெடுப்பேன். ‘இவன் உன்னுடன் செல்லட்டும்’ என்று நான் உன்னிடம் யாரைக் குறித்துச் சொல்கிறேனோ, அவன் உன்னுடன் செல்லட்டும். ‘இவன் உன்னுடன் செல்ல வேண்டாம்’ என்று நான் உன்னிடம் யாரைக் குறித்துச் சொல்கிறேனோ, அவன் செல்ல வேண்டாம்” என்றார்.
