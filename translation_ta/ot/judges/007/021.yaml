translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரேயத்தின் பகிர்வுப் பொருளும், முகாமை ஆகுபெயராகப் பயன்படுத்தியிருப்பதும், கூச்சலின் தன்மை குறித்த உண்மையான தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
