base_translation:
  language: en
  yaml_path: translation/ot/judges/007/021.yaml
  text: And each man stood in his place around the camp[a], and the whole camp ran, and they shouted and fled.
translation:
  language: ta
  text: ஒவ்வொருவரும் முகாமைச் சுற்றித் தத்தம் இடத்தில் நின்றார்கள்; முகாமிலிருந்த அனைவரும் ஓடி, கூச்சலிட்டுத் தப்பியோடினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் போர்முழக்கம் எழுப்பித் தப்பியோடினார்கள்.” “கூச்சலிட்டார்கள்” என்று மொழிபெயர்க்கப்பட்டுள்ள வினைச்சொல், போரிலோ பீதியிலோ எழுப்பப்படும் பெருங்குரலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: நின்றார்கள்
  rationale: עמד என்பது நிற்பதையோ தமது நிலையில் நிலைத்திருப்பதையோ குறிக்கிறது; இச்சூழலில் நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: אִישׁ תַּחְתָּיו
  choice: ஒவ்வொருவரும் ... தத்தம் இடத்தில்
  rationale: ‘ஒவ்வொருவரும் தமக்குரிய இடத்தில்’ என்ற பகிர்வுப் பொருளுடைய எபிரேய மரபுத்தொடரைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: סָבִיב לַמַּחֲנֶה
  choice: முகாமைச் சுற்றி
  rationale: முகாமின் சுற்றுப்புறத்தில் அவர்கள் நிலைகொண்டிருந்த இடவுறவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: וַיָּרָץ כָּל הַמַּחֲנֶה
  choice: முகாமிலிருந்த அனைவரும் ஓடி
  rationale: ‘முகாம் முழுவதும்’ என்பது இங்கு முகாமிலிருந்த மக்களைக் குறிக்கும் ஆகுபெயர்; רוץ என்பதன் ‘ஓடு’ என்ற படிமத்தை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: וַיָּרִיעוּ
  choice: கூச்சலிட்டு
  rationale: ריע என்பது போர்முழக்கத்தையோ பீதியால் எழும் பெருங்குரலையோ குறிக்கலாம்; ‘கூச்சலிட்டு’ இந்தச் சூழல்சார் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: ויניסו
  choice: தப்பியோடினார்கள்
  rationale: נוס என்பதன் ஓடித் தப்புதல் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
