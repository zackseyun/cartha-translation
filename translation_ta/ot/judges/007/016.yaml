translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான உரைநடை. எபிரெய மூலத்தின் தொடர்ச்சியான கதைநடைக்கு ‘பின்பு’ பயன்படுத்தப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு அடையாளங்களும் உரையில் தொடர்புடைய சொற்களுக்குப் பின் இடப்பட்டுள்ளன.
