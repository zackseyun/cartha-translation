  to: பின்பு அவர் அந்த முந்நூறு ஆண்களையும் மூன்று அணிகளாகப் பிரித்தார்.[a] அவர்கள் ஒவ்வொருவருடைய கையிலும் ஊதுகொம்புகளையும்,[b] வெறுமையான குடங்களையும்,[c] அந்தக் குடங்களுக்குள் தீப்பந்தங்களையும் கொடுத்தார்.
