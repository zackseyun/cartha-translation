base_translation:
  language: en
  yaml_path: translation/ot/judges/007/016.yaml
  text: Then he divided the three hundred men into three companies[a], and put trumpets into the hands of all of them, and empty jars[c][b], with torches inside the jars.
translation:
  language: ta
  text: பின்பு அவர் அந்த முந்நூறு ஆண்களையும் மூன்று அணிகளாகப் பிரித்தார்.[a] அவர்கள் ஒவ்வொருவருடைய கையிலும் ஊதுகொம்புகளையும்,[b] வெறுமையான குடங்களையும்,[c] அந்தக் குடங்களுக்குள் தீப்பந்தங்களையும் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், ‘மூன்று தலைகளாக’; இது மூன்று குழுக்கள் அல்லது அணிகள் என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது, ‘ஆட்டுக்கடாக்களின் கொம்புகளை.’ எபிரெயச் சொல்: ஷோஃபார்.'
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘வெறுமையான சாடிகளையும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַץ
  choice: பிரித்தார்
  rationale: חצה இச்சூழலில் படையைப் பல அணிகளாகப் பிரிப்பதைக் குறிக்கிறது; ‘பிரித்தார்’ என்பது இயல்பான, துல்லியமான தமிழ்.
- source_word: שְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: அந்த முந்நூறு ஆண்களையும்
  rationale: אִישׁ என்பதன் நேர்ப்பொருள் ‘ஆண்/மனிதன்’; இங்கு கிதியோனின் ஆண் போராளிகளைக் குறிப்பதால் ‘ஆண்கள்’ மூலத்தின் பாலினக் குறிப்பைப் பாதுகாக்கிறது.
- source_word: שְׁלֹשָׁה רָאשִׁים
  choice: மூன்று அணிகளாக
  rationale: நேரடியாக ‘மூன்று தலைகள்’ என்றாலும், இங்கு רָאשִׁים என்பது படைப்பிரிவுகள் அல்லது குழுக்கள் என்ற மரபுத்தொடர் பொருளில் வருகிறது; ‘அணிகள்’ இராணுவச் சூழலுக்கு இயல்பானது.
- source_word: וַיִּתֵּן ... בְּיַד כֻּלָּם
  choice: அவர்கள் ஒவ்வொருவருடைய கையிலும் ... கொடுத்தார்
  rationale: எபிரெயச் சொற்றொடரின் பகிர்ந்தளிக்கும் பொருளையும் கையில் கொடுக்கப்பட்டதென்ற தெளிவான காட்சியையும் இந்த நடை பாதுகாக்கிறது.
- source_word: שׁוֹפָרוֹת
  choice: ஊதுகொம்புகள்
  rationale: שׁוֹפָר என்பது சமிக்ஞைக்காக ஊதப்படும் கொம்புக் கருவி; ‘ஊதுகொம்பு’ நவீன தமிழில் அதன் வடிவத்தையும் பயன்பாட்டையும் தெளிவாகக் காட்டுகிறது.
- source_word: כַדִּים רֵקִים
  choice: வெறும் மண்குடங்கள்
  rationale: כַּד என்பது குடம் அல்லது சாடி; அக்காலச் சூழலில் மட்பாண்டத்தைச் சுட்டுவது இயல்பானதால் ‘மண்குடங்கள்’ தேர்ந்தெடுக்கப்பட்டது. רֵקִים என்பதற்கான ‘வெறும்’ வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לַפִּדִים
  choice: தீப்பந்தங்கள்
  rationale: לַפִּיד என்பது எரியும் பந்தம் அல்லது தீக்கொள்ளி; ‘தீப்பந்தங்கள்’ தெளிவான, வழக்கிலுள்ள தமிழ் இணைச்சொல்.
- source_word: בְּתוֹךְ הַכַּדִּים
  choice: அந்தக் குடங்களுக்குள்
  rationale: பந்தங்கள் பாத்திரங்களின் உள்ளே இருந்த இடநிலையை எளிய நவீன தமிழில் துல்லியமாகத் தெரிவிக்கிறது.
