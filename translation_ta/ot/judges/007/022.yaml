  terminology: யְהוָה-வுக்கு ‘யாவே’ சரியான ஒலிபெயர்ப்பாகத் தக்கவைக்கப்பட்டுள்ளது. שׁוֹפָר-க்கு ‘ஊதுகொம்பு’ பயன்படுத்தப்படுகிறது; அடிக்குறிப்பு அது ஆட்டுக்கடா உள்ளிட்ட விலங்குகளின் கொம்பால் செய்யப்பட்ட கருவி என்பதைப் பாதுகாக்கிறது. שְׂפַת-இன் பரந்த புவியியல் பொருளை ‘எல்லை’ தக்கவைக்கிறது; மாற்றுகள் அடிக்குறிப்பில் உள்ளன.
