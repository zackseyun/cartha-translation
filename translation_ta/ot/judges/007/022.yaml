  text: וַֽ/יִּתְקְעוּ֮ שְׁלֹשׁ מֵא֣וֹת הַ/שּׁוֹפָרוֹת֒ וַ/יָּ֣שֶׂם יְהוָ֗ה אֵ֣ת חֶ֥רֶב אִ֛ישׁ בְּ/רֵעֵ֖/הוּ וּ/בְ/כָל הַֽ/מַּחֲנֶ֑ה וַ/יָּ֨נָס הַֽ/מַּחֲנֶ֜ה עַד בֵּ֤ית הַשִּׁטָּה֙ צְֽרֵרָ֔תָ/ה עַ֛ד שְׂפַת אָבֵ֥ל מְחוֹלָ֖ה עַל טַבָּֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/022.yaml
  text: When the three hundred trumpets were blown[a], Yahweh set every man's sword against his companion and against the whole camp, and the camp fled as far as Beth-shittah toward Zererah, as far as the edge of Abel-meholah[d][c][b], by Tabbath.
translation:
  language: ta
  text: முந்நூறு ஊதுகொம்புகள் ஊதப்பட்டபோது[a], யாவே ஒவ்வொருவனுடைய வாளையும் அவனுடைய தோழனுக்கு எதிராகவும் முகாம் முழுவதிலும்[b] திருப்பினார். அந்தப் படை பெத்-ஷித்தா வழியாகச் செரேராவை நோக்கி, தப்பாத்துக்கு அருகிலுள்ள ஆபேல்-மெகோலாவின் எல்லை[d] வரைத் தப்பியோடியது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள் முந்நூறு ஊதுகொம்புகளை ஊதியபோது.’ எபிரெய שׁוֹפָרוֹת என்பது பொதுவாக ஆட்டுக்கடாவின் கொம்பு போன்ற விலங்குக் கொம்பால் செய்யப்பட்ட ஊதுகருவிகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘முகாம் முழுவதற்கும் எதிராக.’ ஒவ்வொருவனுடைய வாள் முகாமிலிருந்த மற்றவர்களுக்கு எதிராகத் திரும்பியதை அல்லது பீதி முகாம் முழுவதும் பரவியதை எபிரெய தொடர் குறிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: பெத்-ஷித்தா, செரேரா, ஆபேல்-மெகோலா, தப்பாத் ஆகியவை தப்பியோடிய படையின் வழியிலிருந்த இடப்பெயர்கள்.
    reason: cultural_note
  - marker: d
    text: ‘எல்லை’ என்பதற்குப் பதிலாக ‘விளிம்பு’ அல்லது ‘கரை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקְעוּ ... הַשּׁוֹפָרוֹת
  choice: முந்நூறு கொம்பு எக்காளங்களும் ஊதப்பட்டபோது
  rationale: שׁוֹפָר என்பது பொதுவாக விலங்கின் கொம்பால், குறிப்பாக ஆட்டுக்கடாவின் கொம்பால் செய்யப்பட்ட ஊதுகருவியைக் குறிக்கிறது. ‘கொம்பு எக்காளம்’ அதன் வடிவத்தையும் இராணுவச் சமிக்ஞைப் பயன்பாட்டையும் தெளிவாகக் காட்டுகிறது; சூழலில் நேரத்தை உணர்த்தும் வகையில் வாக்கியம் அமைக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה பட்டப்பெயராக மாற்றப்படாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்கப்பட்டுள்ளது.
- source_word: וַיָּשֶׂם ... אֵת חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: ஒவ்வொருவனுடைய வாளையும் அவனுடைய தோழனுக்கு எதிராகத் திருப்பினார்
  rationale: ‘ஒருவனின் வாளை அவனுடைய தோழனுக்கு எதிராக வைத்தார்’ என்ற எபிரெய உருவகத்தை இயல்பான தமிழில் தக்கவைத்து, முகாமுக்குள் ஒவ்வொருவரும் தம்முடன் இருந்தவர்களைத் தாக்கிய பகிர்ந்தளிப்பு அர்த்தத்தையும் காட்டுகிறது.
- source_word: וּבְכָל הַמַּחֲנֶה
  choice: முகாம் முழுவதிலும்
  rationale: בְּ என்ற முன்னிடைச்சொல்லை இடவியல் பொருளில் எடுத்துக்கொள்வது எபிரெய தொடருக்கு இயல்பானது; ‘முகாம் முழுவதற்கும் எதிராக’ என்பதும் சாத்தியமானதால் அது அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיָּנָס הַמַּחֲנֶה
  choice: அந்தப் படை ... தப்பியோடியது
  rationale: מַחֲנֶה என்பது ‘முகாம்’ அல்லது அங்கு தங்கியிருக்கும் ‘படை’ எனப் பொருள்படும். நகர்ந்து தப்பியோடுவது மக்களாகிய படையாதலால், தமிழில் ‘படை’ இயல்பாக உள்ளது.
- source_word: עַד בֵּית הַשִּׁטָּה צְרֵרָתָה
  choice: பெத்-ஷித்தா வரை, செரேராவை நோக்கியும்
  rationale: இடப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; צְרֵרָתָה என்பதிலுள்ள திசைநோக்குச் சொல்லிறுதி ‘செரேராவை நோக்கி’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: שְׂפַת אָבֵל מְחוֹלָה
  choice: ஆபேல்-மெகோலாவின் எல்லை
  rationale: שָׂפָה என்பதன் அடிப்படைப் பொருள் ‘உதடு/விளிம்பு’; புவியியல் சூழலில் நீர்நிலை உறுதியாகக் குறிப்பிடப்படாததால் ‘எல்லை’ என்பது பொருத்தமான, அளவுக்கு மீறி குறிப்பாக்காத தேர்வு.
- source_word: עַל טַבָּת
  choice: தப்பாத்தின் அருகிலுள்ள
  rationale: இங்கு עַל இடத்துடனான அண்மை அல்லது தொடர்பைக் குறிக்கலாம். ‘அருகிலுள்ள’ என்பது இலக்கைத் தேவையின்றி உறுதிப்படுத்தாமல் அந்த உறவை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதனை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது; எந்த ஒரு திருச்சபை மரபின் தனிப்பட்ட வடிவத்தையும் கட்டாயப்படுத்தாமல் ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- issue: முகாமுக்குள் ஏற்பட்ட வாள் தாக்குதலின் காரணம்
  choice: யாவே ஒவ்வொருவனுடைய வாளையும் அவனுடைய தோழனுக்கு எதிராகத் திருப்பினார்
  alternative: அவர்கள் தாமாகவே குழப்பத்தில் ஒருவரையொருவர் தாக்கினர்
  rationale: எபிரெய உரை செயலை நேரடியாக யாவேக்கே உரியதாக்குகிறது. உளவியல் அல்லது இராணுவ இயங்குமுறையை உரை விளக்காததால், அந்த இறைச் செயற்பாட்டை மெலிதாக்காமலும் அதன் முறையை ஊகிக்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. இடப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன. ‘கொம்பு எக்காளம்’ என்ற சொற்றொடர் பழங்கால ஊதுகருவியின் தன்மையைத் தெளிவுபடுத்துகிறது; வசனத்தின் வேகம் மற்றும் போர்க்களக் குழப்பம் சுருக்கமான வாக்கிய அமைப்பில் காக்கப்பட்டுள்ளன.
