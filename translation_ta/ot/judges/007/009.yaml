  text: וַֽ/יְהִי֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֤אמֶר אֵלָי/ו֙ יְהוָ֔ה ק֖וּם רֵ֣ד בַּֽ/מַּחֲנֶ֑ה כִּ֥י נְתַתִּ֖י/ו בְּ/יָדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/009.yaml
  text: And it happened that night that Yahweh said to him[a], “Arise, go down into the camp, for I have given it into your hand.”
translation:
  language: ta
  text: 'அந்த இரவில் நடந்ததாவது: யாவே அவனிடம், “எழுந்து முகாமுக்குள் இறங்கிப் போ; ஏனெனில் அதை உன் கையில்[a] ஒப்புக்கொடுத்துவிட்டேன்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன் கையில்” என்பது “உன் அதிகாரத்திற்குள்” அல்லது “உன் கட்டுப்பாட்டில்” என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: நடந்ததாவது
  rationale: புதிய நிகழ்வை அறிமுகப்படுத்தும் எபிரெயக் கதைநடை வடிவத்தை, பழமையான நடையின்றி இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּלַּיְלָה הַהוּא
  choice: அந்த இரவில்
  rationale: குறிப்பிட்ட அந்த இரவைக் குறிக்கும் இயல்பான நவீனத் தமிழ் காலச்சொற்றொடர்.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: அவனிடம் ... என்றார்
  rationale: אמר என்பதன் நேரடியான பேச்சுப் பொருளைத் தமிழின் இயல்பான மேற்கோள் அமைப்பில் தருகிறது; இறைவனைக் குறிக்கும் மரியாதைப் பன்மை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வாசிக்கத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: קוּם
  choice: எழுந்து
  rationale: உடனடியான செயலுக்கான கட்டளையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: רֵד
  choice: இறங்கிப் போ
  rationale: கீழ்நோக்கிய நகர்வைக் குறிக்கும் ירד என்பதையும் சூழலின் நிலவியல் இயக்கத்தையும் தெளிவாகக் காக்கிறது.
- source_word: בַּמַּחֲנֶה
  choice: முகாமுக்குள்
  rationale: இயக்க வினையோடு வரும் ב இங்கே முகாமின் உள்ளே செல்லுதலைக் குறிக்கிறது; ‘முகாமுக்கு எதிராக’ என்று போர்சார்ந்த பொருளை மிகையாகச் சேர்க்கவில்லை.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை வெளிப்படையாக அறிமுகப்படுத்துகிறது.
- source_word: נְתַתִּיו
  choice: அதை ... ஒப்புக்கொடுத்துவிட்டேன்
  rationale: ஆண்பால் ஒருமை பின்னொட்டு சூழலில் முகாமால் குறிக்கப்படும் எதிரிப்படையைச் சுட்டுகிறது; நிறைவேறியதாகக் கூறப்படும் தெய்வீக ஒப்புக்கொடுத்தலை தமிழ் நிறைவு வினை வடிவம் காக்கிறது.
- source_word: בְּיָדֶךָ
  choice: உன் கையில்
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டுக்குள் ஒப்புக்கொடுத்தலைக் குறிக்கும் எபிரெய உருவகத்தை நேரடியாகத் தக்கவைக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் தனிப்பட்ட தெய்வீகப் பெயரையே பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: נְתַתִּיו என்ற நிறைவேற்றுக் கால வடிவத்தின் வலிமை
  choice: ஒப்புக்கொடுத்துவிட்டேன்
  alternative: ஒப்புக்கொடுப்பேன்
  rationale: எதிரியின் தோல்வி இன்னும் நடைமுறையில் நிறைவேறாதிருந்தாலும், எபிரெய நிறைவேற்றுக் காலம் அதை இறைவனால் தீர்மானிக்கப்பட்டு நிறைவேறிய ஒன்றாக முன்வைக்கிறது; எதிர்காலமாக மாற்றி அந்தத் தெய்வீக உறுதியைத் தளர்த்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நடந்ததாவது’ மூலத்தின் காட்சிமாற்றச் செயல்பாட்டைக் காக்கிறது; ‘உன் கையில்’ என்ற எபிரெய உருவகம் விளக்கக் குறிப்புடன் தக்கவைக்கப்பட்டுள்ளது.
