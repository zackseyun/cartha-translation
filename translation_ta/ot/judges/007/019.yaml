translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் நிகழ்வுவரிசை காக்கப்பட்டு, நீண்ட வாக்கியச் சுமையைத் தவிர்க்க இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘அப்போதுதான்’ என்பது நேரத்தின் துல்லியத்தையும் உடனடித்தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
