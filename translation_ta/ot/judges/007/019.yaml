base_translation:
  language: en
  yaml_path: translation/ot/judges/007/019.yaml
  text: So Gideon and the hundred men who were with him came to the edge of the camp at the beginning of the middle watch[a], just as they had posted the watchmen[c][b]; and they blew the trumpets and smashed the jars that were in their hands.
translation:
  language: ta
  text: கிதியோனும் அவனுடன் இருந்த நூறு பேரும், நடுக் காவலின் தொடக்கத்தில்[a], காவலர்கள் அப்போதுதான் பணியில் அமர்த்தப்பட்டிருந்தபோது[b], பாளையத்தின் விளிம்புக்கு வந்தார்கள். அவர்கள் கொம்புகளை[c] ஊதி, தங்கள் கைகளிலிருந்த குடங்களை உடைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இரவின் நடுக்காவல்’ அல்லது ‘இரண்டாம் காவல்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் இரவு பிரிக்கப்பட்டிருந்த காவல் வேளைகளில் ஒன்றைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘காவலர்களை அப்போதுதான் நிறுத்தியிருந்தபோது’ அல்லது ‘காவலர்கள் அப்போதுதான் பணியில் அமர்த்தப்பட்டிருந்தபோது’ என்றும் மொழிபெயர்க்கலாம். எபிரெய இலக்கண அமைப்பு காவலர்களைப் பணியில் அமர்த்திய செயலை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் ஷோஃபாரோத்; பொதுவாகச் சமிக்ஞை கொடுப்பதற்குப் பயன்படுத்தப்பட்ட கொம்புகள். மரபாக இது ‘எக்காளங்கள்’ என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: பாளையத்தின் விளிம்புக்கு
  rationale: קָצֶה என்பது ஓரம் அல்லது எல்லைப்பகுதியைக் குறிக்கிறது; இயக்கத்தைக் காட்டும் சூழலில் ‘விளிம்புக்கு’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: רֹאשׁ הָאַשְׁמֹרֶת הַתִּיכוֹנָה
  choice: நடுச்சாமக் காவலின் தொடக்கத்தில்
  rationale: רֹאשׁ இங்கு ஒரு காலப்பகுதியின் தொடக்கத்தைக் குறிக்கிறது. אַשְׁמֹרֶת הַתִּיכוֹנָה இரவின் நடுப்பகுதிக்குரிய காவல் முறையைக் குறிப்பதால், ‘நடுச்சாமக் காவல்’ என்பது தமிழில் சுருக்கமாகவும் புரியத்தக்கதாகவும் உள்ளது.
- source_word: אַךְ הָקֵם הֵקִימוּ אֶת־הַשֹּׁמְרִים
  choice: அப்போதுதான் காவலர்களை நிறுத்தியிருந்தார்கள்
  rationale: אַךְ இங்கு உடனடி நேரத்தை வலியுறுத்துகிறது. கום என்பதன் ஹிஃபில் வினை வடிவமும் அதற்கு முன்னுள்ள வினையெச்ச வலியுறுத்தலும் காவலர்களை அப்போதுதான் பணியில் நிறுத்தியிருந்த செயலைக் காட்டுகின்றன.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: அவர்கள் ஊதுகொம்புகளை ஊதி
  rationale: שׁוֹפָר என்பது செய்தி அறிவிக்க அல்லது சமிக்ஞை கொடுக்க ஊதப்படும் கொம்பு. பொதுவான ‘எக்காளம்’ என்பதைக் காட்டிலும் ‘ஊதுகொம்பு’ மூலக் கருவியின் தன்மையை நெருக்கமாக வெளிப்படுத்துகிறது.
- source_word: וְנָפוֹץ הַכַּדִּים
  choice: குடங்களை உடைத்தார்கள்
  rationale: נפץ வலுவாக உடைத்தல் அல்லது நொறுக்குதலைக் குறிக்கிறது. தமிழில் ‘உடைத்தார்கள்’ தெளிவாகவும் இயல்பாகவும் செயலை வெளிப்படுத்துகிறது; כַּד என்பதற்கு ‘குடங்கள்’ பொருத்தமான பொதுச் சொல்.
- source_word: אֲשֶׁר בְּיָדָם
  choice: தங்கள் கைகளிலிருந்த
  rationale: மனிதர்கள் அப்போது தாங்கிக்கொண்டிருந்த குடங்களையே இச்சொற்றொடர் அடையாளப்படுத்துகிறது; ‘தங்கள் கைகளிலிருந்த’ என்பது எபிரெய அமைப்பை இயல்பான தமிழில் பிரதிபலிக்கிறது.
