  source_fidelity: மூல எபிரெய உரைக்கு நம்பிக்கையானது. யாவே, கிதியோன், நக்கிக் குடித்த முந்நூறு பேர், பன்மை ‘உங்களை’ மற்றும் ஒருமை ‘உன் கையில்,’ மீதியானை ஒப்புவித்தல், மற்றவர்கள் அவரவர் இடத்திற்குச் செல்லுதல் ஆகிய அனைத்தும் சரியாகக் காக்கப்பட்டுள்ளன. ‘மற்ற’ என்பது சூழலிலிருந்து இயல்பாகத் தெளிவாக்கப்படும் குறிப்பாகும்; பொருளை மாற்றவில்லை.
  naturalness: நவீனத் தரத்தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘நக்கிக் குடித்த,’ ‘மீட்டு,’ ‘உன் கையில் ஒப்புவிப்பேன்,’ ‘அவரவர் இடத்திற்குப் போகட்டும்’ ஆகியவை இயல்பானவை.
  terminology: ‘யாவே’ தனிப்பெயரைத் தக்கவைக்கிறது. ‘மீதியான்,’ ‘மீட்டு,’ மற்றும் ‘உன் கையில் ஒப்புவிப்பேன்’ ஆகியவை பெயர்கள், இராணுவ விடுதலை, மற்றும் எபிரெய கை-உருவகத்தைச் சரியாக வெளிப்படுத்துகின்றன. அடிக்குறிப்பு கருவிப் பொருளுக்கான செல்லத்தக்க மாற்றை வழங்குகிறது; குறியீட்டு இணைப்பு சரியானது.
