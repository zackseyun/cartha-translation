source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל גִּדְע֗וֹן בִּ/שְׁלֹשׁ֩ מֵא֨וֹת הָ/אִ֤ישׁ הַֽ/מֲלַקְקִים֙ אוֹשִׁ֣יעַ אֶתְ/כֶ֔ם וְ/נָתַתִּ֥י אֶת מִדְיָ֖ן בְּ/יָדֶ֑/ךָ וְ/כָל הָ/עָ֔ם יֵלְכ֖וּ אִ֥ישׁ לִ/מְקֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/007.yaml
  text: And Yahweh said to Gideon[a], “With the three hundred men who lapped, I will save you and give Midian into your hand. And let all the people go, each man to his place.”
translation:
  language: ta
  text: யாவே கிதியோனிடம், “நக்கிக் குடித்த இந்த முந்நூறு பேரைக் கொண்டு[a] நான் உங்களை மீட்டு, மீதியானை உன் கையில் ஒப்புவிப்பேன். மற்ற மக்கள் அனைவரும் அவரவர் இடத்திற்குப் போகட்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நக்கிக் குடித்த இந்த முந்நூறு பேரின் மூலமாக.”
    reason: ב முன்னிடைச்சொல் இங்கு கருவி அல்லது வழிமுறையைக் குறிக்கிறது; ‘கொண்டு’ மற்றும் ‘மூலமாக’ இரண்டும் சாத்தியமான தமிழ் வெளிப்பாடுகள்.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரைப் பொதுப்பட்டப் பெயராக மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בִּשְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: இந்த முந்நூறு பேரைக் கொண்டு
  rationale: ב முன்னிடைச்சொல்லின் கருவிப் பொருளைப் பேச்சுவழக்காக அல்லாமல் இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: הַמֲלַקְקִים
  choice: நக்கிக் குடித்த
  rationale: முந்தைய சூழலில் அடையாளப்படுத்தப்பட்ட உறுதியான செயலைத் தக்கவைக்கிறது; இவ்வசனத்தில் மீண்டும் வராத ‘தண்ணீரை’ என்ற செயப்படுபொருளைச் சேர்க்கவில்லை.
- source_word: אוֹשִׁיעַ אֶתְכֶם
  choice: நான் உங்களை மீட்டு
  rationale: ישׁע என்பதன் இராணுவ விடுதலை மற்றும் இரட்சிப்பு சார்ந்த பரப்பை ‘மீட்டு’ இயல்பாகக் கொண்டுவருகிறது; אֶתְכֶם பன்மையை ‘உங்களை’ எனத் தக்கவைக்கிறது.
- source_word: וְנָתַתִּי אֶת מִדְיָן בְּיָדֶךָ
  choice: மீதியானை உன் கையில் ஒப்புவிப்பேன்
  rationale: வெற்றி மற்றும் கட்டுப்பாட்டைக் கொடுப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் கை உருவகத்தைத் தக்கவைத்து, தமிழில் இயல்பாக அமைகிறது.
- source_word: וְכָל הָעָם
  choice: மற்ற மக்கள் அனைவரும்
  rationale: சூழலில் தேர்ந்தெடுக்கப்பட்ட முந்நூறு பேரைத் தவிர மீதமுள்ள படையினரையே இது குறிக்கிறது என்பதைத் தமிழில் தெளிவாக்குகிறது; ‘மக்கள்’ என்ற மூலச்சொல்லையும் தக்கவைக்கிறது.
- source_word: יֵלְכוּ
  choice: போகட்டும்
  rationale: இங்கு கட்டளை அல்லது அனுமதி உணர்வில் வரும் எபிரெய imperfect வடிவத்தின் jussive வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִישׁ לִמְקֹמוֹ
  choice: அவரவர் இடத்திற்கு
  rationale: ஒவ்வொருவரும் தனக்குரிய இடத்திற்குச் செல்வது என்ற பகிர்நிலைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; மூலத்தில் இல்லாத ‘வீடு’ என்பதைச் சேர்க்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரைப் பொதுப்பட்ட பட்டமாக மாற்றாமல் வெளிப்படையாகத் தக்கவைக்கிறது; ‘யாவே’ என்பது எபிரெயப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிப்பை அணுகும் தமிழ் வடிவம்.
- issue: אוֹשִׁיעַ என்பதன் விடுதலை/இரட்சிப்பு பரப்பு
  choice: மீட்டு
  alternative: காப்பாற்றி; வெற்றி அளித்து
  rationale: சூழலின் இராணுவ விடுதலையை வெளிப்படுத்தினாலும், சொல்லின் விரிந்த இரட்சிப்பு சார்ந்த ஒலியையும் முற்றிலும் ஒடுக்காது.
translation_notes:
  register: நவீனத் தரத்தமிழில் எளிதாகப் புரியக்கூடிய, ஆனால் கண்ணியமான நடையைப் பயன்படுத்துகிறது. கிதியோனை நோக்கிய ஒருமை ‘உன்’ என்பதையும், கிதியோனோடு தொடர்புடைய இஸ்ரவேலரை உள்ளடக்கும் பன்மை ‘உங்களை’ என்பதையும் வேறுபடுத்தித் தக்கவைக்கிறது.
