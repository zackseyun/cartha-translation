  text: and you will hear what they are saying[a], and afterward your hands will be strengthened[b], and you will go down into the camp.” So he went down with Purah his servant to the edge of the armed men who were in the camp.
translation:
  language: ta
  text: “அவர்கள் என்ன பேசுகிறார்கள் என்பதை நீ கேட்பாய்; அதற்குப் பிறகு உன் கைகள் வலுப்பெறும், நீ முகாமுக்குள் இறங்கிச் செல்வாய்.” எனவே, அவன் தன் பணியாளனான பூராவுடன் முகாமிலிருந்த ஆயுதமேந்திய வீரர்களின் விளிம்புவரை[a] இறங்கிச் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆயுதமேந்திய வீரர்களின் விளிம்புவரை” என்பதை “போருக்கு ஆயத்தமான படையினரின் புறப்பகுதிவரை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ מַה יְדַבֵּרוּ
  choice: அவர்கள் என்ன பேசுகிறார்கள் என்பதை நீ கேட்பாய்
  rationale: தொடர்நிகழ்வில் எதிர்காலப் பொருள் தரும் வினையையும், உடனடியாக ஒட்டுக்கேட்கப்படவுள்ள உரையாடலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְאַחַר
  choice: அதற்குப் பிறகு
  rationale: கேட்டதைத் தொடர்ந்து துணிவு ஏற்படும் காலவரிசையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: תֶּחֱזַקְנָה יָדֶיךָ
  choice: உன் கைகள் வலுப்பெறும்
  rationale: துணிவும் செயலுறுதியும் உண்டாவதைக் குறிக்கும் எபிரெய உருவகத்தை விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: וְיָרַדְתָּ בַּמַּחֲנֶה
  choice: நீ முகாமுக்குள் இறங்கிச் செல்வாய்
  rationale: ירד என்பதன் ‘இறங்குதல்’ என்ற திசை உணர்வையும், בְּ இங்கு குறிக்கும் முகாமுக்குள் செல்லும் இயக்கத்தையும் தக்கவைக்கிறது.
- source_word: וַיֵּרֶד הוּא
  choice: எனவே, அவன் ... இறங்கிச் சென்றான்
  rationale: முந்திய கட்டளைக்குப் பதிலாக அடுத்த கதைநிகழ்வு நடந்ததை இயல்பாக இணைக்கிறது.
- source_word: וּפֻרָה
  choice: பூரா
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: נַעֲרוֹ
  choice: தன் பணியாளனான
  rationale: נַעַר என்பதற்கு இச்சூழலில் இளைஞன், பணியாளர், உதவியாளர் ஆகிய பொருள்கள் சாத்தியம்; கிதியோனுடன் சென்ற தனிப்பட்ட உதவியாளரைக் குறிக்க இயல்பான ‘பணியாளன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶל קְצֵה
  choice: விளிம்புவரை
  rationale: קצה என்பதன் எல்லை அல்லது ஓரப்பகுதி என்ற இடவுணர்வைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: הַחֲמֻשִׁים
  choice: ஆயுதமேந்திய வீரர்கள்
  rationale: போருக்காக ஆயத்தப்படுத்தப்பட்ட அல்லது ஆயுதம் தரித்த ஆட்களைக் குறிக்கும் பங்கேற்புப் பெயரின் சூழல்சார் பொருளைத் தருகிறது.
- source_word: אֲשֶׁר בַּמַּחֲנֶה
  choice: முகாமிலிருந்த
  rationale: அந்த ஆயுதமேந்தியவர்கள் முகாமில் இருந்தவர்கள் என்பதை இயல்பான தமிழ் பெயரெச்சத் தொடரால் காட்டுகிறது.
