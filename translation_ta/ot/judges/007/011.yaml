translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. ‘உன் கைகள் வலுப்பெறும்’ என்ற எபிரெய உருவகம் நோக்கமுடன் தக்கவைக்கப்பட்டது. அடிக்குறி குறியீடு தொடர்புடைய சொல்லுக்குப் பின் முதன்மை உரையில் இடப்பட்டுள்ளது.
