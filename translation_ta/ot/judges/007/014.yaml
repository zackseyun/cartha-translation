base_translation:
  language: en
  yaml_path: translation/ot/judges/007/014.yaml
  text: His companion answered and said[a], “This is nothing other than the sword of Gideon son of Joash, a man of Israel[b]. God has given Midian and the whole camp into his hand.”
translation:
  language: ta
  text: 'அவனுடைய தோழன் மறுமொழியாகச் சொன்னான்: “இது வேறொன்றுமல்ல; இஸ்ரவேலனான யோவாசின் மகன் கிதியோனின் வாள்தான். கடவுள் மீதியானையும் முழு முகாமையும் அவன் கையில்[a] ஒப்புக்கொடுத்துவிட்டார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவன் கையில்” என்பது அவனுடைய அதிகாரத்திற்குள் அல்லது கட்டுப்பாட்டிற்குள் என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן רֵעֵהוּ וַיֹּאמֶר
  choice: அவனுடைய தோழன் அதற்கு மறுமொழியாக ... என்றான்
  rationale: எபிரெய உரையாடல் வாய்பாட்டின் ‘மறுமொழி கூறினான்’ என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; இராணுவ முகாம் சூழலில் רֵעֵהוּ என்பதற்கு ‘தோழன்’ பொருத்தமானது.
- source_word: אֵין זֹאת בִּלְתִּי אִם
  choice: இது வேறொன்றுமல்ல; ... வாள்தான்
  rationale: கனவின் பொருளை வேறு வாய்ப்பே இல்லாதபடி உறுதியாக அடையாளப்படுத்தும் எபிரெய வலியுறுத்தலைத் தமிழின் ‘வேறொன்றுமல்ல’ மற்றும் ‘தான்’ இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: חֶרֶב גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: யோவாசின் மகன் கிதியோனுடைய வாள்
  rationale: ‘வாள்’ என்ற உருவக அடையாளத்தை விளக்கமாக மாற்றாமல் நேரடியாகப் பாதுகாக்கிறது; தந்தைவழி அடையாளத்தையும் சுருக்கமாகத் தருகிறது.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேலைச் சேர்ந்த மனிதனான
  rationale: אִישׁ என்ற ஆண்பால் ஒருமையையும் இஸ்ரவேலுடனான தேசிய அடையாளத்தையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: נָתַן הָאֱלֹהִים
  choice: கடவுள் ... ஒப்புக்கொடுத்துவிட்டார்
  rationale: முடிவாகிவிட்ட, உறுதியாகக் கருதப்படும் செயலை எபிரெய நிறைவுவினை குறிக்கிறது; ‘ஒப்புக்கொடுத்துவிட்டார்’ என்பது அந்த நிறைவு உணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: בְּיָדוֹ
  choice: அவன் கையில்
  rationale: ஒருவரின் அதிகாரத்திற்குள் பகைவரை ஒப்புக்கொடுப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரைப் பாதுகாக்கிறது.
- source_word: אֶת מִדְיָן וְאֶת כָּל הַמַּחֲנֶה
  choice: மீதியானையும் முகாம் முழுவதையும்
  rationale: மீதியான் மக்களையும் அவர்களுடைய முழு முகாம் அல்லது படைத்திரளையும் உள்ளடக்கும் மூலத்தின் மொத்தத்தன்மையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: אִישׁ יִשְׂרָאֵל என்பதிலுள்ள பாலினம் மற்றும் அடையாளம்
  choice: இஸ்ரவேலைச் சேர்ந்த மனிதனான
  alternative: இஸ்ரவேலனான
  rationale: மூலத்தில் உள்ள ஆண்பால் ஒருமையான אִישׁ என்பதைப் பொதுப்பாலாக மாற்றாமல், கிதியோனை இஸ்ரவேலைச் சேர்ந்த ஆண் என அடையாளப்படுத்துகிறது.
- issue: נָתַן என்ற நிறைவுவினையின் கால/நிலை நுட்பம்
  choice: ஒப்புக்கொடுத்துவிட்டார்
  alternative: ஒப்புக்கொடுத்தார்
  rationale: கனவின் விளக்கத்தில் வெற்றி ஏற்கெனவே உறுதிசெய்யப்பட்டதாகப் பேசப்படும் நுட்பத்தைத் தக்கவைக்கிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. ‘வாள்தான்’ என்ற உருவகம் விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது; ‘அவன் கையில்’ என்ற மூல மரபுத்தொடரின் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
