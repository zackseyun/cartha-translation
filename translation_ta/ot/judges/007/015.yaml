  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ גִּדְע֜וֹן אֶת מִסְפַּ֧ר הַ/חֲל֛וֹם וְ/אֶת שִׁבְר֖/וֹ וַ/יִּשְׁתָּ֑חוּ וַ/יָּ֨שָׁב֙ אֶל מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יֹּ֣אמֶר ק֔וּמוּ כִּֽי נָתַ֧ן יְהוָ֛ה בְּ/יֶדְ/כֶ֖ם אֶת מַחֲנֵ֥ה מִדְיָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/015.yaml
  text: And when Gideon heard the telling of the dream and its interpretation, he bowed down in worship. Then he returned to the camp of Israel and said, “Get up, for the LORD has given the camp of Midian into your hand.”
translation:
  language: ta
  text: கிதியோன் அந்தக் கனவின் விவரிப்பையும் அதன் விளக்கத்தையும் கேட்டபோது, தாழ்ந்து வணங்கினார். பின்பு அவர் இஸ்ரவேலின் முகாமுக்குத் திரும்பி, “எழுந்திருங்கள்! ஏனெனில் ஆண்டவர் மிதியானியரின் முகாமை உங்கள் கையில் ஒப்புக்கொடுத்துவிட்டார்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפַּר הַחֲלוֹם
  choice: அந்தக் கனவு சொல்லப்பட்டதை
  rationale: מִסְפָּר என்பது இங்கு கனவின் ‘விவரிப்பு/சொல்லுதல்’ என்பதைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் நிகழ்வுசார் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: שִׁבְרוֹ
  choice: அதன் விளக்கத்தை
  rationale: שֵׁבֶר இச்சூழலில் கனவின் பொருள் அல்லது விளக்கம் என்பதைக் குறிக்கிறது.
- source_word: וַיִּשְׁתָּחוּ
  choice: பணிந்து வணங்கினார்
  rationale: வினைச்சொல் உடலைத் தாழ்த்துதல் மற்றும் வணங்குதல் ஆகிய இரண்டையும் வெளிப்படுத்தக்கூடும்; இங்கு கிதியோனின் இறைமறுமொழியை இயல்பாகவும் முழுமையாகவும் தெரிவிக்கிறது.
- source_word: קוּמוּ
  choice: எழுந்திருங்கள்
  rationale: பன்மை ஆணை வடிவைத் துல்லியமாகவும் கண்ணியமான நவீனத் தமிழிலும் தருகிறது.
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: உங்கள் கையில் ஒப்புக்கொடுத்துவிட்டார்
  rationale: எபிரேயத்தின் வெற்றியை ஒருவரின் கையில் கொடுத்தல் என்ற மரபுத்தொடரைப் பேணுகிறது; perfect வடிவின் உறுதியையும் ‘விட்டார்’ வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தமிழ் வேதாகம நடையில் நன்கு அறியப்பட்ட மரியாதைமிக்க பிரதிநிதிப்பு; தெய்வீகப் பெயரைக் குறிப்பதற்கான வெளியீட்டு மரபுடன் பொருந்துகிறது.
theological_decisions:
- issue: கிதியோனின் וַיִּשְׁתָּחוּ செயல் யாரை நோக்கியது
  choice: பணிந்து வணங்கினார்
  alternative: தரையில் விழுந்து வணங்கினார் / தலைவணங்கினார்
  rationale: எபிரேய உரை செயலை மட்டும் கூறி நேரடிச் செயப்படுபொருளைக் குறிப்பிடவில்லை. ஆகவே ‘ஆண்டவரை வணங்கினார்’ என்று உரையில் இல்லாததைச் சேர்க்காமல், வழிபாட்டுச் சார்ந்த பொருளையும் உடல் பணிவையும் காக்கிறது.
- issue: נָתַן என்பதன் கால/நிறைவு வலிமை
  choice: ஒப்புக்கொடுத்துவிட்டார்
  alternative: ஒப்புக்கொடுப்பார்
  rationale: போர் இன்னும் நடைபெறாதிருந்தாலும், தீர்மானிக்கப்பட்ட வெற்றியை எபிரேயம் நிறைவேறியதாக உறுதியாக அறிவிக்கிறது; எதிர்காலமாக மாற்றி அந்தத் தெய்வீக உறுதியை மெலிதாக்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். கதைநடைக்கு இயல்பான வாக்கிய அமைப்பு பயன்படுத்தப்பட்டது; நேரடி உரையில் பன்மை ஆணையும் வெற்றியின் உறுதியும் தெளிவாகப் பேணப்பட்டன.
