base_translation:
  language: en
  yaml_path: translation/ot/judges/007/024.yaml
  text: And Gideon sent messengers throughout all the hill country of Ephraim[a], saying, “Come down against Midian, and seize the waters as far as Beth-barah, and the Jordan.” So every man of Ephraim was called out, and they seized the waters as far as Beth-barah[c][b], and the Jordan.
translation:
  language: ta
  text: கிதியோன் எப்பிராயீமின் மலைநாடெங்கும் தூதர்களை அனுப்பி, “மீதியானியரை எதிர்கொள்ள இறங்கி வாருங்கள்; பெத்-பாராவரை நீர்ப்பகுதிகளையும்[a] யோர்தானையும் கைப்பற்றுங்கள்” என்றான். அப்போது எப்பிராயீமின் ஆண்கள் அனைவரும்[b] அழைக்கப்பட்டனர்[c]; அவர்கள் பெத்-பாராவரை நீர்ப்பகுதிகளையும் யோர்தானையும் கைப்பற்றினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக ‘நீர்களை.’ இங்கு நீரோடைகள் அல்லது போர்தந்திர முக்கியத்துவமுள்ள கடவுத்துறைகள் குறிக்கப்பட்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘எப்பிராயீமின் ஒவ்வோர் ஆணும்.’ இது எப்பிராயீமின் போரிடும் ஆண்களை ஒரு குழுவாகக் குறிக்கும் ஒருமைத் தொகுப்புச்சொல்.
    reason: lexical_alternative
  - marker: c
    text: ‘அழைக்கப்பட்டனர்’ என்று மொழிபெயர்க்கப்பட்ட வினை கடினமானது; இதை இன்னும் சொல்லர்த்தமாக ‘கூக்குரலிட்டார்கள்’ என்றும் புரிந்துகொள்ளலாம். ஆனால் இங்கு அழைக்கப்பட்டு படையாகத் திரண்டனர் என்பதே சூழலுக்குப் பொருத்தமாகத் தெரிகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמַלְאָכִים
  choice: தூதுவர்களை
  rationale: இச்சூழலில் செய்தியுடன் அனுப்பப்பட்ட மனிதர்களைக் குறிக்கிறது; வானதூதர்களை அல்ல.
- source_word: בְּכָל הַר אֶפְרַיִם
  choice: எப்பிராயீமின் மலைநாடு முழுவதற்கும்
  rationale: הַר என்பது இங்கு ஒரு தனி மலையை அல்ல, எப்பிராயீமின் மலைப்பாங்கான நிலப்பகுதியைக் குறிக்கிறது.
- source_word: רְדוּ לִקְרַאת מִדְיָן
  choice: மீதியானியரை எதிர்கொள்ள இறங்கி வாருங்கள்
  rationale: רְדוּ நிலவியல்சார்ந்த கீழிறங்குதலைக் குறிக்கிறது; לִקְרַאת என்ற சொல் படைச்சூழலில் எதிர்கொள்வதையோ வழிமறிப்பதையோ உணர்த்துகிறது.
- source_word: וְלִכְדוּ לָהֶם
  choice: கைப்பற்றுங்கள்
  rationale: לכד என்பதன் கைப்பற்று/பிடி என்ற மையப் பொருளை இயல்பான தமிழில் தருகிறது; לָהֶם என்பதிலுள்ள நலப்பொருள் வேற்றுமை நுட்பத்தைத் தனியாக வெளிப்படுத்துவது தமிழில் செயற்கையாக இருக்கும்.
- source_word: אֶת הַמַּיִם
  choice: நீர்நிலைகளை
  rationale: சொல்லர்த்தமான ‘நீர்கள்’ தமிழில் இயல்பாக இல்லை. போர்தந்திர முக்கியத்துவமுள்ள நீர்ப்பகுதிகளைப் பொதுவாகக் குறிக்கும் வகையில் ‘நீர்நிலைகள்’ பயன்படுத்தப்பட்டது; கடவுத்துறைகள் என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: עַד בֵּית בָּרָה
  choice: பெத்-பாரா வரையுள்ள
  rationale: עַד எல்லை அல்லது பரப்பின் முடிவைக் குறிக்கிறது; இடப்பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְאֶת הַיַּרְדֵּן
  choice: யோர்தானையும்
  rationale: எபிரெய இடப்பெயர் இயல்பான தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டது; ‘ஆறு’ என்பது மூலத்தில் வெளிப்படையாக இல்லை.
- source_word: וַיִּצָּעֵק כָּל אִישׁ אֶפְרַיִם
  choice: எப்பிராயீமின் ஆண்கள் அனைவரும் திரட்டப்பட்டார்கள்
  rationale: வினைவடிவம் கடினமானது. தூதுவர்கள் அனுப்பப்பட்டதைத் தொடரும் சூழலில் படைக்கு அழைக்கப்பட்டு ஒன்றுதிரட்டப்பட்டனர் என்பதே பொருத்தமான பொருள்; மாற்றுவாசிப்பு அடிக்குறிப்பில் தரப்பட்டது.
- source_word: וַיִּלְכְּדוּ
  choice: கைப்பற்றினார்கள்
  rationale: முன்னைய கட்டளையில் வந்த அதே வேர்ச்சொல்லுடன் சொல்லிணக்கத்தைப் பேணுகிறது.
