base_translation:
  language: en
  yaml_path: translation/ot/judges/007/008.yaml
  text: So they took the provisions of the people in their hands[a], along with their trumpets. And he sent every man of Israel, each to his tent, but retained the three hundred men. And the camp of Midian was below him in the valley.
translation:
  language: ta
  text: அப்போது அவர்கள் மக்களின் உணவுப்பொருள்களையும் அவர்களுடைய ஊதுகொம்புகளையும்[a] தங்கள் கைகளில் எடுத்துக்கொண்டார்கள். கிதியோன் இஸ்ரவேல் ஆண்கள் அனைவரையும், ஒவ்வொருவனையும் அவனவன் கூடாரத்துக்கு அனுப்பிவிட்டு, அந்த முந்நூறு பேரைத் தன்னுடன் வைத்துக்கொண்டான். மீதியானின் முகாம் அவனுக்குக் கீழே பள்ளத்தாக்கில் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை “கொம்புகள்” அல்லது “ஆட்டுக்கடா கொம்புகள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், அறிகுறி கொடுப்பதற்குப் பயன்படுத்தப்படும் கொம்புக் கருவியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: அவர்கள் ... எடுத்துக்கொண்டார்கள்
  rationale: לקח என்பதன் வழக்கமான கதைநடைப் பொருள் ‘எடுத்துக்கொண்டார்கள்.’ பன்மை எழுவாய் தேர்ந்தெடுக்கப்பட்ட வீரர்களைக் குறிக்கிறது.
- source_word: צֵדָה
  choice: உணவுப்பொருள்கள்
  rationale: பயணம் அல்லது படை நடவடிக்கைக்காக எடுத்துச் செல்லும் உணவு உள்ளிட்ட ஏற்பாடுகளைக் குறிக்கிறது; இச்சூழலில் இயல்பான தமிழாக ‘உணவுப்பொருள்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: எபிரெயச் சொல்லின் பொதுவான வடிவம் காக்கப்பட்டுள்ளது; சூழலில் இது இஸ்ரவேல் படைவீரர்களின் பெரிய குழுவைக் குறிக்கிறது.
- source_word: בְּיָדָם
  choice: தங்கள் கைகளில்
  rationale: உடமையாக வைத்திருத்தல் அல்லது சுமத்தல் என்ற உறுதியான படிமத்தை நேரடியாகக் காக்கிறது.
- source_word: שׁוֹפְרֹתֵיהֶם
  choice: அவர்களுடைய ஊதுகொம்புகள்
  rationale: שׁוֹפָר என்பது அறிகுறி கொடுக்க ஊதப்படும் கொம்புக் கருவி. ‘ஊதுகொம்பு’ அதன் பொருளையும் பயன்பாட்டையும் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: שִׁלַּח
  choice: அனுப்பிவிட்டு
  rationale: அடிப்படைப் பொருள் ‘அனுப்பினான்’; இச்சூழலில் மற்ற வீரர்களைத் திருப்பி அனுப்பியதைக் குறிக்கிறது. தொடர்வாக்கியத்தின் எதிர்மறை ஒப்புமையை இயல்பாக்க வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: כָּל אִישׁ יִשְׂרָאֵל ... אִישׁ לְאֹהָלָיו
  choice: இஸ்ரவேல் ஆண்கள் அனைவரையும், ஒவ்வொருவனையும் அவனவன் கூடாரத்துக்கு
  rationale: படைவீரர்களைக் குறிக்கும் ஆண்பால் தன்மையையும், ஒவ்வொருவராக அனுப்பப்பட்டனர் என்ற பகிர்வுப் பொருளையும் காக்கிறது.
- source_word: וּבִשְׁלֹשׁ מֵאוֹת הָאִישׁ הֶחֱזִיק
  choice: அந்த முந்நூறு பேரைத் தன்னிடம் வைத்துக்கொண்டான்
  rationale: החזיק இங்கு மற்றவர்களை அனுப்பியபோதும் முந்நூறு பேரைத் தொடர்ந்து தன்னுடன் வைத்திருப்பதைக் குறிக்கிறது.
- source_word: מַחֲנֵה מִדְיָן
  choice: மீதியானின் முகாம்
  rationale: எபிரெய இணைப்புத் தொடரை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: מִתַּחַת ... בָּעֵמֶק
  choice: அவனுக்குக் கீழே பள்ளத்தாக்கில்
  rationale: கிதியோன் இருந்த இடத்தைவிடத் தாழ்வான நிலப்பகுதியில் முகாம் இருந்ததைக் காட்டும் நிலவியல் உறவு காக்கப்பட்டுள்ளது.
