  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם מִמֶּ֥/נִּי תִרְא֖וּ וְ/כֵ֣ן תַּעֲשׂ֑וּ וְ/הִנֵּ֨ה אָנֹכִ֥י בָא֙ בִּ/קְצֵ֣ה הַֽ/מַּחֲנֶ֔ה וְ/הָיָ֥ה כַ/אֲשֶׁר אֶעֱשֶׂ֖ה כֵּ֥ן תַּעֲשֽׂוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/017.yaml
  text: And he said to them[a], “Watch me, and do likewise. Behold, when I come to the edge of the camp, then as I do, so you shall do.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “என்னைக் கவனியுங்கள்; அதேபோல் செய்யுங்கள்.[a] இதோ, நான் முகாமின் ஓரத்துக்கு வரும்போது, அப்போது நான் செய்வதுபோலவே நீங்களும் செய்யுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைப் பாருங்கள்; அதேபோல் செய்யுங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמֶּנִּי תִרְאוּ
  choice: என்னைப் பார்த்து
  rationale: ראה உடன் מן வரும் இச்சூழலில், கிதியோனைச் செயல் முன்மாதிரியாகக் கவனிக்க வேண்டும் என்பதே பொருள். ‘என்னைப் பார்த்து’ என்பது தமிழில் இயல்பாக அந்த அறிவுறுத்தலைத் தெரிவிக்கிறது.
- source_word: וְכֵן תַּעֲשׂוּ
  choice: அதேபோல் செய்யுங்கள்
  rationale: כֵן செயல் முறையை (‘அவ்வாறு/அதேபோல்’) குறிக்கிறது; பன்மை கட்டளையின் வலிமையையும் பின்பற்றுதல் என்ற கருத்தையும் இம்மொழிபெயர்ப்பு காக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה அடுத்து வருவதற்குக் கவனத்தை ஈர்க்கிறது. ‘இதோ’ அந்தச் சுட்டும் வலியுறுத்தலைச் சுருக்கமாகக் காக்கிறது.
- source_word: אָנֹכִי בָא
  choice: நான் … அடையும்போது
  rationale: בָא என்னும் பங்கேற்புவினை வரவிருக்கும் அல்லது நிகழ்ந்துகொண்டிருக்கும் இயக்கத்தைக் குறிக்கிறது. இலக்கைச் சுட்டும் முகாமின் ஓரத்துடன் தமிழில் ‘அடையும்போது’ இயல்பாக உள்ளது.
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: முகாமின் ஓரத்தை
  rationale: קצה என்பது எல்லை அல்லது ஓரம். இராணுவ முகாமின் வெளிப்புற விளிம்பை ‘முகாமின் ஓரம்’ தெளிவாகக் குறிக்கிறது.
- source_word: כַאֲשֶׁר אֶעֱשֶׂה כֵּן תַּעֲשׂוּן
  choice: நான் செய்வதுபோலவே நீங்களும் செய்யுங்கள்
  rationale: எபிரெயத்தின் ஒப்புமை–பின்பற்றுதல் அமைப்பைக் காத்து, கட்டளையின் வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
