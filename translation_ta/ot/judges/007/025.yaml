  source_fidelity: திருத்தம் தேவை. בְּצוּר மற்றும் בְיֶקֶב ஆகிய இடவுறவுகளை வரைவு “அருகே” எனக் குறைத்துள்ளது; மூலத்தில் நிகழ்வு அந்தப் பாறை/திராட்சைப் பிழியும் இடத்தில் நடந்ததாக உள்ளது. இறுதி மֵעֵבֶר לַיַּרְדֵּן, தலைகள் கிதியோனிடம் கொண்டுவரப்பட்டதற்கான இடத்தைக் குறிக்கிறது; அதைத் துரத்தலோடு இணைக்கும் அடிக்குறிப்பு மூலத் தொடரியலுக்கு ஆதாரமற்றது.
  naturalness: “பாறையில்,” “திராட்சை பிழியும் ஆலையில்,” “மீதியானியரைத் துரத்தினார்கள்” ஆகியவை நவீன நிலையான தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளன. “அருகே” மற்றும் “துரத்திச் சென்று” தேவையற்ற இட/செயல் நுணுக்கங்களைச் சேர்க்கின்றன.
  terminology: ஓரேப், சேப் ஆகிய ஆட்பெயர்கள் ஒலிபெயர்ப்பாகத் தக்கவை. שָׂרֵי என்பதற்கு “இரு தலைவர்கள்” போதுமானது. יֶקֶב என்பது திராட்சை ஆலை என்ற பொது நிறுவனத்தைவிடத் திராட்சை பிழியும் இடம்/ஆலை என்பதில் துல்லியமாகும்.
  issues:
  - severity: medium
    issue: “ஓரேபின் பாறையருகே” மற்றும் “சேபின் திராட்சை ஆலையருகே”
    rationale: 'எபிரேய בְּ இடத்தைச் சுட்டுகிறது: ஓரேபின் பாறையில், சேபின் திராட்சைப் பிழியும் இடத்தில். “அருகே” என்பது மூலத்தில் இல்லாத அருகாமை நுணுக்கத்தைச் சேர்க்கிறது.'
  - severity: medium
    issue: '[b] அடிக்குறிப்பு யோர்தானுக்கு அப்பால் என்பதைக் ‘துரத்திச் சென்ற’ செயலுடன் இணைக்கிறது.'
    rationale: மூலத்தின் இறுதிச் சொற்றொடர் “ஓரேப் சேப் தலைகளை ... கிதியோனிடம் கொண்டுவந்தார்கள்” என்பதோடு இணைகிறது. ஆங்கில audit trail-லும் மாற்றுவடிவம் “from beyond the Jordan” மட்டுமே; வினைத்தொடர் இணைப்பை மாற்றுவதில்லை.
  - severity: low
    issue: “திராட்சை ஆலை”
    rationale: יֶקֶב என்பது குறிப்பாக திராட்சையைப் பிழியும் இடம் அல்லது பிழிவுத் தொட்டி; “திராட்சை பிழியும் ஆலை” அதிகத் துல்லியமும் இயல்பும் உடையது.
  revised_text: 'அவர்கள் மீதியானின் இரு தலைவர்களான ஓரேபையும் சேபையும் பிடித்தார்கள்.[a] அவர்கள் ஓரேபை ஓரேபின் பாறையில் கொன்றார்கள்; சேபை சேபின் திராட்சை பிழியும் ஆலையில் கொன்றார்கள். பின்னர் அவர்கள் மீதியானியரைத் துரத்தினார்கள்; ஓரேப், சேப் ஆகியோரின் தலைகளை யோர்தானுக்கு அப்பாலிருந்து கிதியோனிடம் கொண்டுவந்தார்கள்.


    [a] “ஓரேப்” என்ற பெயர் “அண்டங்காக்கை” என்பதற்கான எபிரேயச் சொல்லோடும், “சேப்” என்ற பெயர் “ஓநாய்” என்பதற்கான எபிரேயச் சொல்லோடும் தொடர்புடையவை. எனினும், முதன்மை உரையில் இரண்டும் ஆட்பெயர்களாக ஒலிபெயர்க்கப்பட்டுள்ளன.


    [b] அல்லது, “யோர்தானுக்கு மறுபுறத்திலிருந்து.”'
