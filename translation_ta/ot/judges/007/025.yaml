  revision_rationale: இடவுறவுகளின் துல்லியத்தை மீட்டமைத்து, יֶקֶב-இன் பொருளைத் தெளிவுபடுத்தி, யோர்தானுக்கு அப்பால் என்ற சொல்லின் வினைத்தொடர் இணைப்பை மூலத்திற்கேற்ப கிதியோனிடம் தலைகளை கொண்டுவருதலோடு வைத்துள்ளேன். [b] குறியீடு முதன்மை உரையில் இல்லாததால், அதன் அடிக்குறிப்புக் குறியீட்டை “அப்பாலிருந்து” என்பதன் பின்னர் சேர்க்க வேண்டும்.
