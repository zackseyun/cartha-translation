- from: 'அவர்கள் மீதியானியரின் இரண்டு தலைவர்களான ஓரேபையும் சேபையும் பிடித்தார்கள்.[a] ஓரேபை ஓரேபின் பாறையருகே கொன்றார்கள்; சேபை சேபின் திராட்சை ஆலையருகே கொன்றார்கள். பின்னர் அவர்கள் மீதியானியரைத் துரத்திச் சென்று,[b] ஓரேப், சேப் ஆகியோரின் தலைகளை யோர்தானுக்கு அப்பாலிருந்து கிதியோனிடம் கொண்டுவந்தார்கள்.


    [a] “ஓரேப்” என்ற பெயர் “அண்டங்காக்கை” என்பதற்கான எபிரேயச் சொல்லோடும், “சேப்” என்ற பெயர் “ஓநாய்” என்பதற்கான எபிரேயச் சொல்லோடும் தொடர்புடையவை. எனினும், முதன்மை உரையில் இரண்டும் ஆட்பெயர்களாக ஒலிபெயர்க்கப்பட்டுள்ளன.


