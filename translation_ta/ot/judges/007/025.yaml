translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தொடர் வாவ் வினைமுறைகளின் நிகழ்வுவரிசை இயல்பான தமிழ் வாக்கியங்களாக அமைக்கப்பட்டது. இடப்பெயர்த் தன்மையைப் பாதுகாக்க “ஓரேபின் பாறை,” “சேபின் திராட்சை ஆலை” என்ற அமைப்புகள் வைக்கப்பட்டன. מֵעֵבֶר לַיַּרְדֵּן எந்த வினைத்தொடருடன் சேர்கிறது என்பதில் உள்ள தொடரியல் இருமையை [b] அடிக்குறிப்பு பாதுகாக்கிறது.
