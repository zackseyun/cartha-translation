base_translation:
  language: en
  yaml_path: translation/ot/judges/007/025.yaml
  text: And they captured the two princes of Midian[a], Oreb and Zeeb. They killed Oreb at the rock of Oreb, and they killed Zeeb at the winepress of Zeeb. Then they pursued Midian[b], and they brought the heads of Oreb and Zeeb to Gideon from across the Jordan.
translation:
  language: ta
  text: 'அவர்கள் மீதியானின் இரு தலைவர்களான ஓரேபையும் சேபையும் பிடித்தார்கள்.[a] அவர்கள் ஓரேபை ஓரேபின் பாறையில் கொன்றார்கள்; சேபை சேபின் திராட்சை பிழியும் ஆலையில் கொன்றார்கள். பின்னர் அவர்கள் மீதியானியரைத் துரத்தினார்கள்; ஓரேப், சேப் ஆகியோரின் தலைகளை யோர்தானுக்கு அப்பாலிருந்து கிதியோனிடம் கொண்டுவந்தார்கள்.


    [a] “ஓரேப்” என்ற பெயர் “அண்டங்காக்கை” என்பதற்கான எபிரேயச் சொல்லோடும், “சேப்” என்ற பெயர் “ஓநாய்” என்பதற்கான எபிரேயச் சொல்லோடும் தொடர்புடையவை. எனினும், முதன்மை உரையில் இரண்டும் ஆட்பெயர்களாக ஒலிபெயர்க்கப்பட்டுள்ளன.


    [b] அல்லது, “யோர்தானுக்கு மறுபுறத்திலிருந்து.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஓரேப்” என்ற பெயர் “அண்டங்காக்கை” என்பதற்கான எபிரேயச் சொல்லோடும், “சேப்” என்ற பெயர் “ஓநாய்” என்பதற்கான எபிரேயச் சொல்லோடும் தொடர்புடையவை. எனினும், முதன்மை உரையில் இரண்டும் ஆட்பெயர்களாக ஒலிபெயர்க்கப்பட்டுள்ளன.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யோர்தானுக்கு மறுபுறத்திலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: தலைவர்கள்
  rationale: שַׂר என்பது ஆளுநர், தலைவர், பிரபு அல்லது படைத்தலைவர் எனப் பொருள்படலாம். இங்கு மீதியானியரின் உயர்நிலை அரசியல்-இராணுவத் தலைவர்களைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் மிகை பட்டப்பெயரைத் தவிர்த்தும் “தலைவர்கள்” என வழங்கப்பட்டது.
- source_word: וַיִּלְכְּדוּ
  choice: பிடித்தார்கள்
  rationale: לכד என்பதன் இராணுவச் சூழலிலான பொருள் பிடித்தல் அல்லது கைப்பற்றுதல். ஆட்களைப் போரில் உயிருடன் பிடித்ததைத் தெளிவாகக் காட்ட “பிடித்தார்கள்” தேர்ந்தெடுக்கப்பட்டது.
- source_word: עֹרֵב
  choice: ஓரேப்
  rationale: இது “அண்டங்காக்கை” என்ற பொருளுடன் தொடர்புடைய ஆட்பெயர். பொருள்மொழிபெயர்ப்பு செய்யாமல் எபிரேய ஒலிக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டது.
- source_word: זְאֵב
  choice: சேப்
  rationale: இது “ஓநாய்” என்ற பொருளுடைய எபிரேயச் சொல்லுடன் தொடர்புடைய ஆட்பெயர். எபிரேய z ஒலியைத் தமிழில் பொதுவாகப் பயன்படுத்தப்படும் “ச” மூலம் ஒலிபெயர்த்து, பொருளை அடிக்குறிப்பில் குறிப்பிட்டோம்.
- source_word: בְּצוּר עוֹרֵב
  choice: ஓரேபின் பாறையருகே
  rationale: צוּר என்பது பாறை அல்லது கற்பாறை. בְּ இடவுறவை “அருகே” என வழங்குவது பெயரிடப்பட்ட இடத்தில் நிகழ்ந்த கொலையை இயல்பான தமிழில் தெரிவிக்கிறது; “ஓரேபின் பாறை” என்ற பெயரமைப்பும் பாதுகாக்கப்படுகிறது.
- source_word: בְיֶקֶב זְאֵב
  choice: சேபின் திராட்சை ஆலையருகே
  rationale: יֶקֶב என்பது திராட்சை மிதித்து சாறு பிழியும் ஆலை அல்லது தொட்டி. தமிழில் புரிந்துகொள்ளக்கூடிய “திராட்சை ஆலை” பயன்படுத்தப்பட்டு, בְּ-இன் இடவுறவு நடுநிலையாக “அருகே” என வழங்கப்பட்டது.
- source_word: וַיִּרְדְּפוּ אֶל מִדְיָן
  choice: பின்னர் அவர்கள் மீதியானியரைத் துரத்திச் சென்று
  rationale: רדף + אֶל தொடர்ந்த துரத்தலைக் குறிக்கிறது. “மீதியான்” என்பது மக்களையோ அவர்களுடைய படையையோ குறிக்கும் கூட்டுப்பெயராக இருப்பதால் “மீதியானியரை” என இயல்பாக்கப்பட்டது; “பின்னர்” கதைத் தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: וְרֹאשׁ עֹרֵב וּזְאֵב
  choice: ஓரேப், சேப் ஆகியோரின் தலைகளை
  rationale: רֹאשׁ ஒருமையில் இருந்தாலும் இணைக்கப்பட்ட இரு பெயர்களோடு பகிர்ந்தளிக்கும் பொருளில் வருகிறது. இருவரின் துண்டிக்கப்பட்ட தலைகளும் கொண்டுவரப்பட்டதைத் தெளிவாக்க தமிழில் பன்மை பயன்படுத்தப்பட்டது.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பாலிருந்து
  rationale: இந்தச் சொற்றொடர் “யோர்தானுக்கு அப்பால்/மறுபுறத்திலிருந்து” என்று பொருள்படும். திசைப் பார்வையைத் தீர்மானிக்காமல் இயல்பான தமிழில் “அப்பாலிருந்து” என வைக்கப்பட்டது.
