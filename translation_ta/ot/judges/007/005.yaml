base_translation:
  language: en
  yaml_path: translation/ot/judges/007/005.yaml
  text: So he brought the people down to the water[a], and Yahweh said to Gideon, “Everyone who laps the water with his tongue, as a dog laps, you shall set apart by himself; likewise everyone who kneels on his knees to drink.”
translation:
  language: ta
  text: அவன் மக்களைத் தண்ணீருக்கு இறங்கச் செய்தான். அப்போது யாவே கிதியோனிடம், “தன் நாவால் தண்ணீரை நக்கிக் குடிக்கும் ஒவ்வொருவனையும், நாய் நக்கிக் குடிப்பதுபோல், தனியாகப் பிரித்து நிறுத்து[a]. குடிப்பதற்காக முழங்காலிடும் ஒவ்வொருவனையும் அவ்வாறே பிரித்து நிறுத்து” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒவ்வொருவனையும் தனியாக வை”; இவ்வினைச்சொல் ஒருவரைப் பிரித்து ஓரிடத்தில் வைப்பதையோ நிறுத்துவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹרֶד
  choice: இறங்கச் செய்தான்
  rationale: ירד என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளைத் தருகிறது; கிதியோன் மக்கள் கீழே இறங்கும்படி செய்ததை இச்சொற்றொடர் நேரடியாகக் காட்டுகிறது.
- source_word: הָעָם
  choice: மக்களை
  rationale: עם என்பது பொதுவாக ‘மக்கள்’ என்ற கூட்டுப் பெயர்; இராணுவச் சூழல் இருந்தாலும் மூலத்தின் பொதுவான சொல்லாட்சியைப் பேணுகிறது.
- source_word: הַמָּיִם
  choice: தண்ணீரை / தண்ணீரிடம்
  rationale: מים வடிவத்தில் பன்மையாக இருந்தாலும் இங்கு திரவப் பொருளைக் குறிக்கும் தொகைப்பெயராக வருகிறது; நவீன தமிழில் ‘தண்ணீர்’ இயல்பானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய தனிப்பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: כֹּל אֲשֶׁר יָלֹק בִּלְשׁוֹנוֹ
  choice: தன் நாவால் தண்ணீரை நக்கிக் குடிக்கிற ஒவ்வொருவனையும்
  rationale: பகிர்வுப் பொருளையும் ஒருமை ஆண்பால் பின்னொட்டையும் தெளிவாகப் பேணுகிறது; ‘நக்கிக் குடி’ சூழலுக்கு இயல்பான தமிழ்.
- source_word: כַּאֲשֶׁר יָלֹק הַכֶּלֶב
  choice: நாய் நக்கிக் குடிப்பதுபோல்
  rationale: மூலத்திலுள்ள வெளிப்படையான, உயிரோட்டமுள்ள ஒப்புமையை இயல்பான தமிழில் தருகிறது.
- source_word: תַּצִּיג אֹתוֹ לְבָד
  choice: ஒவ்வொருவனையும் தனியே நிறுத்து
  rationale: יצג என்பதன் காரணவினை வடிவம் ஒருவரை ஓர் இடத்தில் நிறுத்துதல் அல்லது வைத்தல் எனப் பொருள்படும்; לבד பிரித்துத் தனியாக இருப்பதைச் சுட்டுகிறது.
- source_word: וְכֹל אֲשֶׁר יִכְרַע עַל בִּרְכָּיו לִשְׁתּוֹת
  choice: குடிப்பதற்காகத் தன் முழங்கால்களில் மண்டியிடுகிற ஒவ்வொருவனையும் அவ்வாறே நிறுத்து
  rationale: ‘தன் முழங்கால்களில்’ என்ற மூலத்தின் உடல் நிலையைப் பேணுகிறது. இரண்டாம் குழுவுக்கும் முன் கட்டளை பொருந்துவதைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘அவ்வாறே நிறுத்து’ மீளக் கூறப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்ல, இறைவனின் தனிப்பெயர் உள்ளது; ஆகவே அதைத் தமிழில் ஒலிபெயர்த்து வழங்குவது மூல வேறுபாட்டைப் பேணுகிறது.
- issue: இரண்டாம் குழுவுக்கான வெளிப்படையாக மீளாத கட்டளை
  choice: ‘அவ்வாறே நிறுத்து’ என்று பொருள் நிறைவு செய்தல்
  alternative: ‘குடிப்பதற்காகத் தன் முழங்கால்களில் மண்டியிடுகிற ஒவ்வொருவனையும்’ என்று மட்டும் விடுதல்
  rationale: எபிரெயத்தில் இரண்டாம் உறுப்பில் வினை மீண்டும் வரவில்லை; முந்தைய ‘தனியே நிறுத்து’ என்ற கட்டளையே அதற்கும் பொருந்துகிறது. தமிழில் முழுமையற்ற வாக்கியம் ஏற்படாமல், புதிய தத்துவ விளக்கம் சேர்க்காமல் அந்த இயல்பான பொருள் வெளிப்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘நக்கிக் குடி’, ‘மண்டியிடு’ போன்ற சொற்கள் காட்சித்தன்மையைப் பேணுகின்றன; தேவையற்ற இராணுவச் சிறப்பாக்கம் தவிர்க்கப்பட்டுள்ளது.
