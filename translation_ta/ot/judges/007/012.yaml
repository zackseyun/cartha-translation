base_translation:
  language: en
  yaml_path: translation/ot/judges/007/012.yaml
  text: Midian and Amalek and all the people of the East were lying in the valley as numerous as locusts[a], and their camels were without number[b], as the sand on the seashore in abundance.
translation:
  language: ta
  text: மீதியானியரும் அமலேக்கியரும் கிழக்கத்திய மக்கள் அனைவரும்[a] வெட்டுக்கிளிகளைப்போல ஏராளமாகப் பள்ளத்தாக்கில் பரவிக் கிடந்தார்கள்[b]. அவர்களுடைய ஒட்டகங்களுக்கு எண்ணிக்கையே இல்லை; அவை கடற்கரையிலுள்ள மணலைப்போல ஏராளமாக இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, ‘கிழக்கின் புதல்வர்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘விழுந்து கிடந்தார்கள்.’ இங்குள்ள எபிரெயச் சொல் சொல்லர்த்தமாக ‘விழுகிறவர்கள்/விழுந்தவர்கள்’ என்று பொருள்படும்; இச்சூழலில் பள்ளத்தாக்கில் முகாமிட்டுப் பரவிக் கிடந்த படையை விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי קֶדֶם
  choice: கிழக்கத்திய மக்கள்
  rationale: சொல்லர்த்தமாக ‘கிழக்கின் புதல்வர்கள்’; இங்கு இது கிழக்குப் பகுதியைச் சேர்ந்த மக்களைக் குறிக்கும் இன-புவியியல் கூட்டுப்பெயர். நவீன தமிழில் ‘கிழக்கத்திய மக்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: נֹפְלִים
  choice: பரவிக் கிடந்தார்கள்
  rationale: נפל என்ற வினையின் இப்பெயரெச்சம் சொல்லர்த்தமாக ‘விழுகிறவர்கள்/விழுந்தவர்கள்’ எனப் பொருள்படும். ஆனால் இப்போர்ப்படைச் சூழலில் பள்ளத்தாக்கில் முகாமிட்டுப் பரவிக் கிடந்த நிலையை விவரிக்கிறது; தேர்ந்த மொழிபெயர்ப்பு அந்தப் படிமத்தையும் சூழல்சார் பொருளையும் காக்கிறது.
- source_word: בָּעֵמֶק
  choice: பள்ளத்தாக்கில்
  rationale: עֵמֶק என்பதன் நேரடியான, இச்சூழலுக்கு ஏற்ற தமிழ் இணை.
- source_word: כָּאַרְבֶּה לָרֹב
  choice: வெட்டுக்கிளிகளைப் போல ஏராளமாக
  rationale: படையின் மிகப்பெரிய எண்ணிக்கையை வெட்டுக்கிளிக் கூட்டத்துடன் ஒப்பிடும் உவமையையும் לָרֹב தரும் மிகுதி வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִגְמַלֵּיהֶם אֵין מִסְפָּר
  choice: அவர்களுடைய ஒட்டகங்களுக்கு எண்ணிக்கையே இல்லை
  rationale: ‘எண்ணிக்கை இல்லை’ என்ற எபிரெய மிகைப்படுத்தலை நேரடியாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: כַּחוֹל שֶׁעַל שְׂפַת הַיָּם לָרֹב
  choice: அவை கடற்கரை மணலைப் போல மிகுதியாக இருந்தன
  rationale: எண்ணிலடங்காத மிகுதியைக் குறிக்கும் எபிரெய உவமையையும் இறுதியில் மீண்டும் வரும் לָרֹב என்ற வலியுறுத்தலையும் விடாமல் மொழிபெயர்க்கிறது.
