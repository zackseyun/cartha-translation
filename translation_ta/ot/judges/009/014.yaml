source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ כָל הָ/עֵצִ֖ים אֶל הָ/אָטָ֑ד לֵ֥ךְ אַתָּ֖ה מְלָךְ עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/014.yaml
  text: Then all the trees said to the bramble[a], ‘You come, reign over us.’
translation:
  language: ta
  text: அப்போது மரங்களெல்லாம் முட்புதரிடம்[a], “நீ வந்து எங்களை ஆட்சி செய்” என்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முட்செடி.” எபிரெயச் சொல் אָטָד முட்கள் நிறைந்த ஒரு புதரையோ செடியையோ குறிக்கிறது; குறிப்பிட்ட தாவரவியல் இனம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அப்போது ... என்றன
  rationale: வாவ் தொடர் வடிவம் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீனத் தமிழில் இயல்பான நிகழ்வுத் தொடரை ‘அப்போது’ வெளிப்படுத்துகிறது. ‘மரங்கள்’ அஃறிணைப் பன்மை என்பதால் ‘என்றன’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: כָל הָעֵצִים
  choice: மரங்களெல்லாம்
  rationale: כָל என்பதன் முழுமையையும், הָעֵצִים என்பதன் குறிப்புத்தன்மையையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אֶל הָאָטָד
  choice: முட்புதரிடம்
  rationale: אָטָד என்பது முட்கள் நிறைந்த புதர் அல்லது செடியைக் குறிக்கிறது; துல்லியமான தாவரவியல் இனத்தைத் தேவையின்றி நிர்ணயிக்காமல், உவமைக் கதையின் சூழலுக்கு இயல்பான தமிழ்ச் சொல்லாக ‘முட்புதர்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: לֵךְ אַתָּה
  choice: நீ வந்து
  rationale: הלך என்ற கட்டளை மற்றொரு கட்டளைக்கு முன் வந்து அவசரமான அழைப்பையோ பணிப்பையோ குறிக்கிறது. வலியுறுத்தப்பட்ட אַתָּה என்பதை ‘நீ’ காக்கிறது; இச்சூழலில் சொல்லுக்குச் சொல் ‘நீ போய்’ என்பதைவிட ‘நீ வந்து’ இயல்பானது.
- source_word: מְלָךְ עָלֵינוּ
  choice: எங்களை ஆட்சி செய்
  rationale: מְלָךְ அரசனாக ஆளுதல் அல்லது அரசாட்சி செய்தல் என்ற பொருளுடையது; עָלֵינוּ உடன் சேர்ந்து ‘எங்களை ஆட்சி செய்’ என்பது அரசாட்சிச் சார்ந்த பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
