  source_fidelity: வசனத்தின் நிகழ்வுத் தொடரான வாவ்-வடிவம் ‘அப்போது’ எனவும், முழுமையான கூட்டுப்பொருள் כָּל הָעֵצִים ‘மரங்களெல்லாம்’ எனவும் சரியாகக் கொடுக்கப்பட்டுள்ளது. אֶל הָאָטָד என்பதற்கான ‘முட்புதரிடம்’ இயல்பாகவும் பொருளுக்கு உண்மையாகவும் உள்ளது. לֵךְ אַתָּה மְלָךְ עָלֵינוּ என்ற அழைப்பு/கட்டளை ‘நீ வந்து எங்களை ஆட்சி செய்’ எனச் சுருக்கமாகவும் பொருத்தமாகவும் மொழிபெயர்க்கப்பட்டுள்ளது.
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. அஃறிணைப் பன்மைக்கேற்ற ‘என்றன’ சரியானது. மனிதப்படுத்தப்பட்ட மரங்கள் பேசும் உவமைக் கதையின் நடை நன்கு பாதுகாக்கப்பட்டுள்ளது.
  terminology: ‘முட்புதர்’ אָטָד-இன் முட்கள் நிறைந்த புதர்த் தன்மையைத் தேவையற்ற தாவரவியல் குறிப்பாக்கமின்றி தருகிறது. ‘ஆட்சி செய்’ மְלָךְ-இன் ஆட்சியதிகாரப் பொருளை இச்சூழலில் போதுமானவாறு வெளிப்படுத்துகிறது. அடிக்குறிப்பு மாற்றுவழியையும் சொல்லின் பொதுவான தாவரவியல் நிச்சயமின்மையையும் சரியாகக் குறிக்கிறது.
