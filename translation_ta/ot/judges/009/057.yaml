  text: וְ/אֵ֗ת כָּל רָעַת֙ אַנְשֵׁ֣י שְׁכֶ֔ם הֵשִׁ֥יב אֱלֹהִ֖ים בְּ/רֹאשָׁ֑/ם וַ/תָּבֹ֣א אֲלֵי/הֶ֔ם קִֽלֲלַ֖ת יוֹתָ֥ם בֶּן יְרֻבָּֽעַל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/057.yaml
  text: And God repaid all the evil of the men of Shechem on their own heads, and the curse of Jotham son of Jerubbaal came upon them.
translation:
  language: ta
  text: சீகேமைச் சேர்ந்த மனிதர்கள் செய்த எல்லாத் தீமையையும் கடவுள் அவர்களுடைய சொந்தத் தலைமேலேயே திரும்பச் செய்தார்; எருபாகாலின் மகன் யோதாமின் சாபம் அவர்கள்மேல் வந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵשִׁיב
  choice: திரும்பச் செய்தார்
  rationale: שוב என்பதன் ஹிஃபில் வடிவமும், ‘அவர்களுடைய தலைமேல்’ என்ற தொடரும் சேர்ந்து, அவர்கள் செய்த தீமையை அவர்கள்மீதே கடவுள் திரும்பச் செய்தார் என்ற தண்டனைக்குரிய கைம்மாற்றைச் சுட்டுகின்றன. எபிரெய உருவகத்தையும் கடவுளின் செயற்பாட்டையும் இத்தேர்வு காக்கிறது.
- source_word: רָעַת
  choice: தீமையை
  rationale: இங்கு இச்சொல் வெறும் துன்பத்தையோ கேடையையோ அல்ல, சீகேம் மனிதர்கள் செய்த ஒழுக்கத் தீமையைக் குறிக்கிறது.
- source_word: בְּרֹאשָׁם
  choice: அவர்களுடைய சொந்தத் தலைமேலேயே
  rationale: செய்த தீமையின் விளைவு அதைச் செய்தவர்கள்மீதே திரும்புவதை உணர்த்தும் எபிரெய மொழிப்படிமத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: קִלֲלַת
  choice: சாபம்
  rationale: முன்னதாக யோதாம் உரைத்த சாபத்தையே இப்பெயர்ச்சொல் குறிக்கிறது; ‘சாபம்’ இயல்பானதும் சூழலுக்குத் துல்லியமானதும் ஆகும்.
- source_word: וַתָּבֹא אֲלֵיהֶם
  choice: அவர்கள்மேல் வந்தது
  rationale: சாபம் அவர்களுக்கு எதிராக நிறைவேறியதை இயக்க உருவகத்துடன் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: אַנְשֵׁי שְׁכֶם
  choice: சீகேம் மனிதர்கள்
  rationale: மூலத்தின் ‘சீகேமின் மனிதர்கள்’ என்ற ஆண்பால் கூட்டுக் குறிப்பை, நகரத்தைச் சேர்ந்த மனிதர்கள் என்ற இயல்பான தமிழ்ச் சொற்றொடரில் வழங்குகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: ஒருமை வினையுடன் வரும் இச்சொல் இங்கு இஸ்ரவேலின் கடவுளைக் குறிக்கிறது.
- source_word: יוֹתָם בֶּן יְרֻבָּעַל
  choice: எருபாகாலின் மகன் யோதாம்
  rationale: தமிழில் இயல்பான உறவுமுறை அமைப்பில் தந்தை-மகன் அடையாளத்தைத் தெளிவாகத் தக்கவைக்கிறது; பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன.
theological_decisions:
- issue: கடவுளின் கைம்மாற்றுத் தீர்ப்பு
  choice: அவர்கள் செய்த தீமையை அவர்களுடைய சொந்தத் தலைமேல் கடவுள் திரும்பச் செய்தார்
  alternative: அவர்களின் தீமை அவர்கள்மீது திரும்பிவரக் கடவுள் அனுமதித்தார்
  rationale: הֵשִׁיב என்பதற்குக் கடவுளே இலக்கண எழுவாய். ஆகவே வசனம் தெய்வீகச் செயலை நேரடியாகக் கூறுகிறது; அதை வெறும் அனுமதியாக மென்மைப்படுத்தாமல் மூலத்தின் இறையியல் அழுத்தம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘சொந்தத் தலைமேலேயே’ என்ற வலியுறுத்தல் மூல எபிரெய மொழிப்படிமத்தையும் கைம்மாற்றின் தன்மையையும் காக்கிறது. அடிக்குறிப்புகள் தேவையில்லை.
