revisions:
- from: சீகேம் மனிதர்கள் செய்த எல்லாத் தீமையையும் கடவுள் அவர்களுடைய சொந்தத் தலைமேலேயே திரும்பச் செய்தார்; எருபாகாலின் மகன் யோதாமின் சாபம் அவர்கள்மேல் வந்தது.
