    issue: Awkward city-associated personal designation
    rationale: The phrase ‘சீகேம் மனிதர்கள்’ is structurally compressed and less idiomatic in contemporary Tamil. Recasting it as ‘சீகேமைச் சேர்ந்த மனிதர்கள்’ improves readability without broadening ‘men’ to a gender-neutral collective or altering the meaning.
