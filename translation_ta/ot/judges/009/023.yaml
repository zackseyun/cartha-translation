  text: וַ/יִּשְׁלַ֤ח אֱלֹהִים֙ ר֣וּחַ רָעָ֔ה בֵּ֣ין אֲבִימֶ֔לֶךְ וּ/בֵ֖ין בַּעֲלֵ֣י שְׁכֶ֑ם וַ/יִּבְגְּד֥וּ בַעֲלֵי שְׁכֶ֖ם בַּ/אֲבִימֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/023.yaml
  text: Then God sent an evil spirit between Abimelech and the leaders of Shechem[c][b][a], and the leaders of Shechem dealt treacherously with Abimelech.
translation:
  language: ta
  text: அப்போது கடவுள் அபிமெலேக்குக்கும் சீகேமின் தலைவர்களுக்கும்[a] இடையே ஒரு தீய ஆவியை[b] அனுப்பினார். சீகேமின் தலைவர்கள் அபிமெலேக்குக்குத் துரோகம் செய்தார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “சீகேமின் ஆண்டவர்கள்/உரிமையாளர்கள்”; இங்கு நகரத்தின் அதிகாரமுள்ள முன்னணி மனிதர்கள் அல்லது குடியியல் தலைவர்கள் எனப் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தீங்கு விளைவிக்கும் ஆவி.” எபிரெயச் சொற்றொடர் ஒழுக்கத் தீமையையோ தீங்கான விளைவையோ வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அபிமெலேக்குக்கு எதிராக வஞ்சகமாக நடந்துகொண்டார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினார்
  rationale: שׁלח என்பதன் நேரடியான கதைநடைப் பொருளைத் தருகிறது; கடவுளின் செயற்பாட்டையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இக்கதைச் சூழலில் உண்மையான கடவுளைக் குறிக்கிறது; நவீன பொதுத்தமிழில் இயல்பான சொல்.
- source_word: רוּחַ רָעָה
  choice: ஒரு தீய ஆவி
  rationale: רוּחַ רָעָה என்பதன் நேரடியான பொருளையும் அதன் ஒழுக்கத் தீமை அல்லது தீங்கான விளைவு என்ற இரு சாத்தியங்களுக்கிடையிலான பதற்றத்தையும் பாதுகாக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בֵּין ... וּבֵין
  choice: …க்கும் …க்கும் இடையே
  rationale: இரு தரப்பினருக்கிடையில் ஏற்பட்ட பிளவு அல்லது பகைமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: சீகேமின் தலைவர்கள்
  rationale: בעלי என்பதன் சொற்பொருள் ‘ஆண்டவர்கள்/உரிமையாளர்கள்’; இங்குள்ள நகராட்சி மற்றும் அரசியல் சூழலில் அதிகாரமுள்ள முன்னணி மனிதர்களைக் குறிப்பதால் ‘தலைவர்கள்’ தெளிவான நவீனத் தமிழாக்கம்.
- source_word: וַיִּבְגְּדוּ
  choice: துரோகம் செய்தார்கள்
  rationale: בגד குறிக்கும் விசுவாசமின்மையையும் வஞ்சகச் செயலையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בַּאֲבִימֶלֶךְ
  choice: அபிமெலேக்குக்குத்
  rationale: בגד உடன் வரும் ב எதிரான துரோகத்தின் இலக்கைக் குறிக்கிறது; ‘அபிமெலேக்குக்குத் துரோகம் செய்தார்கள்’ என்பது இயல்பான தமிழ் நடை.
theological_decisions:
- issue: தீய ஆவியை அனுப்பியதில் கடவுளின் நேரடி செயற்பாடு
  choice: “கடவுள் … ஒரு தீய ஆவியை அனுப்பினார்” என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: “கடவுள் ஒரு தீய ஆவியை அனுமதித்தார்” அல்லது “பகை உணர்வை ஏற்படுத்த அனுமதித்தார்.”
  rationale: எபிரெய வினையும் வாக்கிய அமைப்பும் அனுப்புதலை நேரடியாகக் கடவுளுக்கே உரிய செயலாகக் கூறுகின்றன. அதை வெறும் அனுமதியாக மாற்றுவது மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கும்; ஆகவே இறையியல் பதற்றம் தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் நேரடி இறைச் செயற்பாடும் ‘தீய ஆவி’ என்ற தெளிவின்மையும் மென்மைப்படுத்தப்படவில்லை. அனைத்து அடிக்குறிப்பு குறிகளும் உரையில் தோன்றுகின்றன.
