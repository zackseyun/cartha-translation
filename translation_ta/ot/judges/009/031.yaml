  text: וַ/יִּשְׁלַ֧ח מַלְאָכִ֛ים אֶל אֲבִימֶ֖לֶךְ בְּ/תָרְמָ֣ה לֵ/אמֹ֑ר הִנֵּה֩ גַ֨עַל בֶּן עֶ֤בֶד וְ/אֶחָי/ו֙ בָּאִ֣ים שְׁכֶ֔מָ/ה וְ/הִנָּ֛/ם צָרִ֥ים אֶת הָ/עִ֖יר עָלֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/031.yaml
  text: And he sent messengers to Abimelek secretly[a], saying, “Look, Gaal son of Ebed and his brothers have come to Shechem, and look, they are besieging the city against you.”
translation:
  language: ta
  text: அவன் அபிமெலேக்கிடம் இரகசியமாக[a] தூதர்களை அனுப்பி, “இதோ, ஏபெத்தின் மகன் காலும் அவனுடைய சகோதரர்களும் சீகேமுக்கு வந்திருக்கிறார்கள். இதோ, அவர்கள் உமக்கு எதிராக நகரத்தைக் கிளர்ந்தெழச் செய்கிறார்கள்[b]” என்று சொல்லச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வஞ்சகமாக.” எபிரெயச் சொல் மறைவான செயலையோ வஞ்சகமான செயலையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இதற்கான எபிரெய வினை இவ்விடத்தில் பொருள் காண்பதற்குக் கடினமானது. சிலர் இதை இன்னும் சொற்சார்பாக, “அவர்கள் நகரத்தை உமக்கு எதிராக முற்றுகையிடுகிறார்கள்” என்று புரிந்துகொள்கிறார்கள்; சூழலில், நகர மக்களை அபிமெலேக்குக்கு எதிராகத் தூண்டுகிறார்கள் என்பதே அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அவன் … தூதர்களை அனுப்பி
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான தமிழ் வினையெச்சத் தொடரால் வெளிப்படுத்துகிறது; மூலத்தில் எழுவாய் மறைமுகமாக இருப்பதால் ‘அவன்’ எனக் குறிப்பிடப்பட்டுள்ளது.
- source_word: מַלְאָכִים
  choice: தூதர்களை
  rationale: இங்கு அரசியல் செய்தியை எடுத்துச் செல்லும் மனிதத் தூதர்களே குறிக்கப்படுகிறார்கள்.
- source_word: בְּתָרְמָה
  choice: இரகசியமாக
  rationale: செய்தி மறைவாக அனுப்பப்பட்டதைச் சூழல் சுட்டுகிறது. இந்தச் சொல் வஞ்சகத்தையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: גַעַל בֶּן עֶבֶד
  choice: ஏபெத்தின் மகன் கால்
  rationale: தந்தை–மகன் உறவை நேரடியாகக் காத்து, பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: וְאֶחָיו
  choice: அவனுடைய சகோதரர்களும்
  rationale: மூலத்தின் ‘சகோதரர்கள்’ என்ற உறவுச்சொல் பொதுவான கூட்டாளிகள் என விரிவாக்கப்படாமல் அப்படியே காக்கப்பட்டுள்ளது.
- source_word: בָּאִים שְׁכֶמָה
  choice: சீகேமுக்கு வந்திருக்கிறார்கள்
  rationale: அவர்கள் வந்து தற்போது அங்கிருப்பதைக் காட்டும் நிகழ்காலத் தொடர்புடைய நிறைவுநிலை தமிழில் இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: הִנֵּה / וְהִנָּם
  choice: இதோ … இதோ
  rationale: அறிக்கையின் இரு கவன ஈர்ப்புச் சொற்களையும் காத்து, நவீனமும் கண்ணியமுமான தமிழில் வழங்குகிறது.
- source_word: צָרִים אֶת הָעִיר עָלֶיךָ
  choice: உமக்கு எதிராக நகரத்தைக் கிளர்ந்தெழச் செய்கிறார்கள்
  rationale: ‘உமக்கு எதிராக’ என்ற தொடருடனும் கிளர்ச்சிச் சூழலுடனும் பொருந்தும் வகையில், நகர மக்களை அபிமெலேக்குக்கு எதிராகத் தூண்டுவது என்ற பொருள் முதன்மைப்படுத்தப்பட்டுள்ளது; வினையின் கடினத்தன்மையும் வேறு சாத்தியமும் அடிக்குறிப்பில் காக்கப்பட்டுள்ளன.
