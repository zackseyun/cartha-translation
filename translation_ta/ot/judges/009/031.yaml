translation_notes:
  register: நவீன நிலையான தமிழில், கதைநடைக்கு ஏற்ற கண்ணியமான மொழிநடை பயன்படுத்தப்பட்டுள்ளது. அபிமெலேக்கை நேரடியாக விளிக்கும் இடத்தில் ‘உமக்கு’ என்பது செய்தியின் அரசியல் மரியாதைநிலையைப் பேணுகிறது. மூலத்தின் இரட்டை הִנֵּה வலியுறுத்தல் ‘இதோ’ என இருமுறையும் காக்கப்பட்டுள்ளது.
