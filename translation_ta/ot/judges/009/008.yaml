base_translation:
  language: en
  yaml_path: translation/ot/judges/009/008.yaml
  text: The trees once went to anoint a king over themselves[a], and they said to the olive tree, ‘Reign over us.’
translation:
  language: ta
  text: மரங்கள் தங்கள்மேல் ஆட்சி செய்ய ஒரு ராஜாவை அபிஷேகம் செய்வதற்குப் புறப்பட்டன[a]. அவை ஒலிவ மரத்திடம், “எங்களை ஆட்சி செய்” என்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “போக, அவை போயின” என வினைச்சொல் வலியுறுத்தி இருமுறை வருகிறது. இதை “மரங்கள் நிச்சயமாகச் சென்றன” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ הָלְכוּ
  choice: புறப்பட்டுச் சென்றன
  rationale: முற்றிலா வினைச்சொல்லும் முற்றுவினையும் இணையும் எபிரெய தீவிர அமைப்பு, செயலை வலியுறுத்துகிறது. தமிழில் மரங்கள் ஒரு நோக்கத்துடன் புறப்பட்டதை இயல்பாகக் காட்ட இந்தச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் குறியிடப்பட்ட அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הָעֵצִים
  choice: மரங்கள்
  rationale: யோதாமின் உவமையில் இது உயிருள்ளவையாக உருவகப்படுத்தப்பட்ட மரங்களைக் குறிக்கிறது.
- source_word: לִמְשֹׁחַ
  choice: அபிஷேகம் செய்வதற்காக
  rationale: מָשַׁח என்பது ஒருவரை பதவியில் நிறுவும் அடையாளமாக எண்ணெய் பூசுவதைச் சுட்டுகிறது. வெறும் ‘நியமிக்க’ என்று பொருளைத் தட்டையாக்காமல், மூலத்தின் அரசியல் மற்றும் சடங்கு உருவகத்தை இது பாதுகாக்கிறது.
- source_word: עֲלֵיהֶם
  choice: தங்களுக்கு மேலாக
  rationale: מֶלֶךְ என்பதுடன் עַל ஆளுகைக்குட்பட்டவர்களுக்கு ‘மேலாக’ இருப்பதைக் குறிக்கிறது; இங்கு பொருள் தற்சுட்டுத் தன்மையுடையது.
- source_word: מֶלֶךְ
  choice: ஒரு ராஜாவை
  rationale: மரங்கள் தங்களை ஆளுவதற்காக குறிப்பிட்டிராத ஒரு ராஜாவைத் தேடுகின்றன; எனவே ஒருமை மற்றும் குறிப்பிடாமை ‘ஒரு’ என்பதால் வெளிப்படுகின்றன.
- source_word: וַיֹּאמְרוּ
  choice: அவை … என்றன
  rationale: இது אָמַר என்பதன் வழக்கமான எபிரெய கதைத் தொடர்வினை; தமிழின் இயல்பான நேரடி உரை அமைப்பில் மொழிபெயர்க்கப்பட்டது.
- source_word: לַזַּיִת
  choice: ஒலிவ மரத்திடம்
  rationale: זַיִת என்பது ஒலிவப் பழத்தையோ மரத்தையோ குறிக்கலாம்; இங்கு உருவகப்படுத்தப்பட்டு உரையாடலில் அழைக்கப்படுவது மரமே.
- source_word: מְלֹכָה
  choice: ஆட்சி செய்
  rationale: מָלַךְ என்பதன் கட்டளை வடிவம். ‘ராஜாவாக இரு’ என்பதும் சாத்தியம்; ஆனால் தொடரும் ‘எங்களை’ என்பதுடன் ‘ஆட்சி செய்’ என்பது இயல்பான நவீனத் தமிழாகவும் அரசாட்சிப் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: עָלֵינוּ
  choice: எங்களை
  rationale: מָלַךְ உடன் עַל ஆட்சிக்குட்பட்டவர்களைச் சுட்டுகிறது. தமிழில் ‘எங்களை ஆட்சி செய்’ என்பது இயல்பான வாக்கிய அமைப்பு; இதன் பொருள் ‘எங்கள்மேல் ஆட்சி செய்’ என்பதே.
