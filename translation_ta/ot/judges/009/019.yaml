base_translation:
  language: en
  yaml_path: translation/ot/judges/009/019.yaml
  text: And if today you have acted in truth and integrity toward Jerubbaal and toward his house[a], rejoice in Abimelech[c][b], and let him also rejoice in you.
translation:
  language: ta
  text: மேலும், இன்று[a] நீங்கள் யெருபாகாலிடமும் அவருடைய வீட்டாரிடமும்[c] உண்மையோடும் நேர்மையோடும் நடந்துகொண்டீர்களானால்[b], அபிமெலேக்கைக் குறித்து மகிழுங்கள்; அவனும் உங்களைக் குறித்து மகிழட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “இந்த நாளில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யெருபாகாலிடமும் அவருடைய வீட்டாரிடமும் உண்மையோடும் நேர்மையோடும் செயல்பட்டீர்களானால்.”
    reason: lexical_alternative
  - marker: c
    text: எபிரெய மொழியில் “அவருடைய வீடு”; இது அவருடைய குடும்பத்தார், வீட்டார், அல்லது வம்சத்தைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: நீங்கள் ... இருந்தால்
  rationale: முந்தைய நிபந்தனை சார்ந்த வாதத்தைத் தொடரும் இணைப்பையும் நிபந்தனைப் பொருளையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது.
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: உண்மையுடனும் நேர்மையுடனும்
  rationale: אֱמֶת என்பதிலுள்ள உண்மை/நம்பகத்தன்மை உணர்வையும் תָמִים என்பதிலுள்ள ஒழுக்க முழுமை மற்றும் கபடமின்மை உணர்வையும் இணையாகப் பேணுகிறது.
- source_word: עֲשִׂיתֶם עִם
  choice: '...இடமும் ... நடந்துகொண்டிருந்தால்'
  rationale: ஒருவரிடம் ஒரு விதத்தில் செயல்படுதல் அல்லது நடந்துகொள்ளுதல் என்ற எபிரெய மரபுத்தொடரின் உறவுசார் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: יְרֻבַּעַל
  choice: யெருபாகால்
  rationale: தனிப்பெயரை எபிரெய உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கிறது.
- source_word: בֵּיתוֹ
  choice: அவருடைய வீட்டார்
  rationale: இங்கு ‘வீடு’ என்பது கட்டடத்தையல்ல, யெருபாகாலின் குடும்பம் அல்லது வம்சத்தைச் சுட்டுவதால் ‘வீட்டார்’ சூழலுக்குப் பொருத்தமானது; பரந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַיּוֹם הַזֶּה
  choice: இன்று
  rationale: சொல்லுக்கு சொல் ‘இந்த நாள்’ என்றாலும், காலக் குறிப்பை இயல்பான நவீன தமிழில் ‘இன்று’ தெளிவாக வழங்குகிறது.
- source_word: שִׂמְחוּ בַּאֲבִימֶלֶךְ
  choice: அபிமெலேக்கைக் குறித்து மகிழுங்கள்
  rationale: שׂמח உடன் வரும் ב முன்னிடைச்சொல் ஒருவரில், ஒருவரால், அல்லது ஒருவரைக் குறித்து மகிழ்வதைக் குறிக்கலாம். தமிழில் தவறான ஆன்மிக உட்பொருள் எழாதவாறு ‘குறித்து’ பயன்படுத்தப்பட்டு, அடுத்த கூறின் இணை அமைப்பும் பேணப்படுகிறது.
- source_word: וְיִשְׂמַח גַּם הוּא בָּכֶם
  choice: அவனும் உங்களைக் குறித்து மகிழட்டும்
  rationale: கட்டளை வடிவுக்குப் பின் வரும் வினைமுற்றின் விருப்ப/அனுமதி நுணுக்கத்தையும் பரஸ்பர இணை அமைப்பையும் ‘மகிழட்டும்’ காக்கிறது.
