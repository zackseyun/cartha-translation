translation_notes:
  register: மொழிநடை நவீன, தெளிவான, கண்ணியமான தரத் தமிழில் உள்ளது. யோதாமின் நிபந்தனை சார்ந்த கிண்டல் நிறைந்த உரையின் பதற்றத்தை விளக்கமாகத் தீர்த்துவிடாமல் பேணுகிறது. ‘மகிழுங்கள் / மகிழட்டும்’ என்ற இணை அமைப்பு மூலத்தின் சொல்லாட்சிச் சமநிலையைத் தக்கவைக்கிறது.
