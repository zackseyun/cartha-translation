  text: וַ/יַּגִּ֣דוּ לְ/יוֹתָ֗ם וַ/יֵּ֨לֶךְ֙ וַֽ/יַּעֲמֹד֙ בְּ/רֹ֣אשׁ הַר גְּרִזִ֔ים וַ/יִּשָּׂ֥א קוֹל֖/וֹ וַ/יִּקְרָ֑א וַ/יֹּ֣אמֶר לָ/הֶ֗ם שִׁמְע֤וּ אֵלַ/י֙ בַּעֲלֵ֣י שְׁכֶ֔ם וְ/יִשְׁמַ֥ע אֲלֵי/כֶ֖ם אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/007.yaml
  text: And they told Jotham[a], and he went and stood on the top of Mount Gerizim, and he lifted up his voice and called out and said to them, “Listen to me, leaders of Shechem[b], that God may listen to you.”
translation:
  language: ta
  text: அவர்கள் யோதாமுக்கு இதைத் தெரிவித்தார்கள். அவன் போய் கெரிசீம் மலையின் உச்சியில் நின்று, குரலை உயர்த்திக் கூப்பிட்டு அவர்களிடம், “சீகேமின் தலைவர்களே[a], கடவுள் உங்களுக்குச் செவிகொடுக்கும்படி எனக்குச் செவிகொடுங்கள்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடி எபிரெயச் சொற்றொடர்: ‘சீகேமின் எஜமானர்கள்’ அல்லது ‘சீகேமின் உரிமையாளர்கள்.’'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எனக்குச் செவிகொடுங்கள்; கடவுளும் உங்களுக்குச் செவிகொடுப்பாராக.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּדוּ לְיוֹתָם
  choice: அவர்கள் யோதாமுக்கு இதைத் தெரிவித்தார்கள்
  rationale: נגד என்பதன் ஹிபீல் வடிவம் ‘தெரிவித்தல்/அறிவித்தல்’ என்று பொருள்படும். தமிழில் இயல்பான தொடருக்காக, முந்தைய நிகழ்வைக் குறிக்கும் ‘இதை’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: וַיֵּלֶךְ וַיַּעֲמֹד
  choice: அவன் போய் ... நின்று
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான தமிழ்ச் சார்பு வினையெச்சங்களால் எடுத்துரைக்கிறது.
- source_word: בְּרֹאשׁ הַר גְּרִזִים
  choice: கெரிசீம் மலையின் உச்சியில்
  rationale: רֹאשׁ என்பதன் நிலவியல் பொருள் ‘உச்சி’; இடப்பெயர் நவீன தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיִּשָּׂא קוֹלוֹ וַיִּקְרָא
  choice: குரலை உயர்த்திக் கூப்பிட்டு
  rationale: இந்த எபிரெய மொழிமரபு உரத்த பொதுக் கூப்பிடுதலைக் குறிக்கிறது; அதன் உருவகத்தையும் செயற்பொருளையும் தமிழில் காக்கிறது.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: சீகேமின் தலைவர்கள்
  rationale: בַּעֲלִים என்பதன் நேரடிப் பொருள் ‘உரிமையாளர்கள்/எஜமானர்கள்’; இச்சூழலில் நகரத்தின் அதிகாரமுள்ள முன்னணியினரைச் சுட்டுவதால் ‘தலைவர்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: שִׁמְעוּ אֵלַי ... וְיִשְׁמַע אֲלֵיכֶם
  choice: கடவுள் உங்களுக்குச் செவிகொடுக்கும்படி எனக்குச் செவிகொடுங்கள்
  rationale: שׁמע என்ற ஒரே வேரின் மீளுரையை ‘செவிகொடு’ என்று இரு இடங்களிலும் காக்கிறது. தமிழின் இயல்பான நோக்கவாக்கிய அமைப்புக்காக உட்பிரிவின் வரிசை மாற்றப்பட்டுள்ளது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: ஒருமை வினையும் சூழலும் இங்கு ஒருமைப் பொருளையே உறுதிப்படுத்துகின்றன.
theological_decisions:
- issue: யோதாமின் இறுதி உட்பிரிவின் இலக்கண வலிமை
  choice: 'நோக்கம்/விளைவு: ‘கடவுள் உங்களுக்குச் செவிகொடுக்கும்படி’'
  alternative: 'விருப்பநிலை: ‘கடவுளும் உங்களுக்குச் செவிகொடுப்பாராக’'
  rationale: வாவ் இணைப்புடன் வரும் நிறைவுறா வினை, கட்டளையைத் தொடர்ந்து நோக்கம் அல்லது விளைவைக் குறிக்கலாம்; அதே நேரத்தில் விருப்பநிலையாகவும் புரிந்துகொள்ள முடியும். முதன்மை உரை நோக்கம்/விளைவைத் தருகிறது; உண்மையான மாற்றுப் புரிதல் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘குரலை உயர்த்தி’ மற்றும் ‘செவிகொடு’ ஆகியவை மூலத்தின் சொல்லமைப்பையும் மீளுரையையும் காக்கின்றன; தமிழின் இயல்புக்காக நீண்ட எபிரெய இணைத் தொடர்ச்சி சுருக்கப்பட்டுள்ளது.
