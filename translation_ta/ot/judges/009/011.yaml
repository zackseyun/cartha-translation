translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் சொல்லாட்சியில் உள்ள மரம் அசைதல்—ஆட்சி செய்தல் என்ற இரட்டைப் பொருள் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டது.
