  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הַ/תְּאֵנָ֔ה הֶ/חֳדַ֨לְתִּי֙ אֶת מָתְקִ֔/י וְ/אֶת תְּנוּבָתִ֖/י הַ/טּוֹבָ֑ה וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/011.yaml
  text: But the fig tree said to them[a], ‘Should I stop producing my sweetness and my good fruit, and go to sway over the trees?’
translation:
  language: ta
  text: ஆனால் அத்திமரம் அவற்றிடம், “என் இனிமையையும் என் நல்ல கனியையும் தருவதை நிறுத்தி, மரங்களுக்குமேல் அசைந்தாடச் செல்வேனோ?” என்றது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: ஆனால் ... என்றது
  rationale: தொடர்ச்சியாக வரும் மறுப்புகளுக்கிடையிலான எதிர்மறைத் தொடர்பை இயல்பான தமிழில் காட்ட ‘ஆனால்’ பயன்படுத்தப்பட்டது.
- source_word: הַתְּאֵנָה
  choice: அத்திமரம்
  rationale: நீதிக்கதையில் பேசும் பாத்திரம் அத்திப்பழம் அல்ல, அத்திமரமே; எனவே இயல்பான தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: הֶחֳדַלְתִּי
  choice: கொடுப்பதை நிறுத்திவிட்டு ... செல்வேனோ?
  rationale: இங்கு நிறைவுற்ற வினைவடிவம் ஆலோசனை சார்ந்த வினாவாக, ‘நான் நிறுத்திவிட்டு செல்வேனோ?’ என்ற பொருளில் வருகிறது. மரத்தின் இனிமையும் கனியும் அதன் உற்பத்தி என்பதால் ‘கொடுப்பதை’ என்பது தமிழில் இயல்புக்காகச் சேர்க்கப்பட்டது.
- source_word: מָתְקִי
  choice: என் இனிமை
  rationale: ‘என் இனிய கனி’ என்று பொருளைச் சுருக்காமல், எபிரேயத்தின் ஆளுருவகப்படுத்தப்பட்ட ‘என் இனிமை’ என்ற சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: תְּנוּבָתִי הַטּוֹבָה
  choice: என் நல்ல கனி
  rationale: תְּנוּבָה என்பது விளைச்சல் அல்லது பலன் எனப் பொருள்படும்; அத்திமரத்தைப் பற்றிய சூழலில் ‘கனி’ இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: לָנוּעַ
  choice: அசைந்தாட
  rationale: נוע என்பதன் நேரடிப் பொருளான அசைதல் அல்லது ஆடுதலைப் பாதுகாத்து, மரங்களின் உருவகத்தையும் ஆளுகை குறித்த நீதிக்கதையின் உட்பொருளையும் ஒருங்கே திறந்துவைக்கிறது.
- source_word: עַל הָעֵצִים
  choice: மரங்களுக்குமேல்
  rationale: עַל குறிக்கும் மேல்நிலையையும் மறைமுகமான அதிகார உறவையும் தமிழில் வெளிப்படுத்துகிறது.
