translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில், அதே நேரத்தில் வரலாற்று விவரணைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் தொடர்ச்சியான செயல்கள் தெளிவான தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டன; ‘உப்பை விதைத்தான்’ என்ற மூலப் படிமம் பாதுகாக்கப்பட்டது.
