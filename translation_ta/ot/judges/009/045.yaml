  text: וַ/אֲבִימֶ֜לֶךְ נִלְחָ֣ם בָּ/עִ֗יר כֹּ֚ל הַ/יּ֣וֹם הַ/ה֔וּא וַ/יִּלְכֹּד֙ אֶת הָ/עִ֔יר וְ/אֶת הָ/עָ֥ם אֲשֶׁר בָּ֖/הּ הָרָ֑ג וַ/יִּתֹּץ֙ אֶת הָ/עִ֔יר וַ/יִּזְרָעֶ֖/הָ מֶֽלַח־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/045.yaml
  text: And Abimelech fought against the city all that day[a], and he captured the city and killed the people who were in it[b]. Then he tore down the city and sowed it with salt.
translation:
  language: ta
  text: அபிமெலேக்கு அந்த நாள் முழுவதும் அந்த நகருக்கு எதிராகப் போரிட்டான்[a]. அவன் நகரைக் கைப்பற்றி, அதிலிருந்த மக்களைக் கொன்றான். பின்னர் அந்த நகரை இடித்தழித்து, அதன்மேல் உப்பை விதைத்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்த நகரைத் தாக்கினான்.’ எபிரெய வினை சொல்லுக்குச் சொல் ‘போரிட்டான்’ என்று பொருள்படும்; இங்கு அதனுடன் பயன்படுத்தப்பட்டுள்ள முன்னிடைச்சொல், நகருக்கு எதிரான இராணுவ நடவடிக்கையைக் குறிக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘உப்பை விதைத்தல்’ என்பது பேரழிவையும் சாபத்தையும் குறிக்கும் அடையாளச் செயல்; அந்த நகரம் பாழாக்கப்பட்டதை இது வெளிப்படுத்துகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: נִלְחָם בָּעִיר
  choice: நகருக்கு எதிராகப் போரிட்டான்
  rationale: לחם என்பதுடன் இங்கு வரும் ב, அடுத்தடுத்த நகரைக் கைப்பற்றுதல் மற்றும் அழித்தல் ஆகிய போர்ச் சூழலில், நகருக்கு எதிரான இராணுவ நடவடிக்கையைக் குறிக்கிறது. ‘தாக்கினான்’ என்பதும் சாத்தியம்; ஆனால் ‘போரிட்டான்’ என்பது எபிரெய வினையின் அடிப்படைப் பொருளை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: כֹּל הַיּוֹם הַהוּא
  choice: அந்த நாள் முழுவதும்
  rationale: குறிப்பிட்ட அந்த நாளின் முழுக் காலத்தையும் செயல் நீடித்ததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וַיִּלְכֹּד
  choice: கைப்பற்றி
  rationale: לכד என்பது போர்ச் சூழலில் ஒரு நகரைப் பிடித்தல் அல்லது கைப்பற்றுதல் என்று பொருள்படும்; ‘கைப்பற்றி’ என்பது தெளிவான இயல்பான இணைச்சொல்.
- source_word: הָעָם אֲשֶׁר בָּהּ
  choice: அதிலிருந்த மக்களை
  rationale: நகருக்குள் இருந்த மக்களைக் குறிக்கும் எபிரெய உறவுத்தொடரைச் சுருக்காமல், இயல்பான தமிழில் தருகிறது.
- source_word: הָרָג
  choice: கொன்றான்
  rationale: வினையின் நேரடியான பொருள் கொல்வதாகும்; பழமையான அல்லது கூடுதல் பாணிச்சாயல் கொண்ட சொற்கள் தவிர்க்கப்பட்டன.
- source_word: וַיִּתֹּץ
  choice: இடித்தழித்து
  rationale: נתץ என்பது கட்டமைப்புகளை இடித்தல் அல்லது தகர்த்தல் என்று பொருள்படும். நகரின் அழிவைத் தெளிவாகவும் இயல்பாகவும் ‘இடித்தழித்து’ தெரிவிக்கிறது.
- source_word: וַיִּזְרָעֶהָ מֶלַח
  choice: அதன்மேல் உப்பை விதைத்தான்
  rationale: எபிரெயத்தில் உள்ள ‘உப்பை விதைத்தான்’ என்ற திட்டமிட்ட உருவகச் செயலைப் பாதுகாக்கிறது; ‘உப்பைத் தூவினான்’ என்பது அந்த விதைத்தல் படிமத்தை இழக்கச் செய்யும்.
