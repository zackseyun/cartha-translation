  yaml_path: translation/ot/judges/009/022.yaml
  text: Abimelech ruled over Israel for three years.
translation:
  language: ta
  text: அபிமெலேக்கு இஸ்ரவேலை மூன்று ஆண்டுகள் ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשַׂר
  choice: ஆட்சி செய்தான்
  rationale: שׂרר என்ற வினை அதிகாரம் செலுத்துவதையும் ஆளுவதையும் குறிக்கிறது. இக்கதைச் சூழலில் இயல்பான நவீனத் தமிழில் அரசியல் ஆளுகையைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: אֲבִימֶלֶךְ
  choice: அபிமெலேக்கு
  rationale: தமிழ் வேதாகமப் பெயரிடும் மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: עַל
  choice: இஸ்ரவேலை
  rationale: ஆட்சி செய்தல் என்ற வினையுடன் עַל ஆளுகைக்குட்பட்ட தரப்பைக் குறிக்கிறது; தமிழில் இரண்டாம் வேற்றுமை உருபுடன் இயல்பாக வெளிப்படுகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: தேசியப் பெயரின் தமிழ் வேதாகம மரபில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: மூன்று ஆண்டுகள்
  rationale: கால நீட்சியை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது; தமிழில் தனி இடைச்சொல் தேவையில்லை.
theological_decisions:
- issue: அபிமெலேக்கின் ஆட்சிக்கான பதவி அல்லது சட்டப்பூர்வ நிலை
  choice: ஆட்சி செய்தான்
  alternative: அரசனாக ஆட்சி செய்தான் / இளவரசனாக இருந்தான்
  rationale: எபிரெய வினை அதிகாரம் செலுத்தியதைச் சொல்கிறது; குறிப்பிட்ட பட்டத்தையோ ஆட்சியின் சட்டப்பூர்வத்தையோ இவ்வசனத்தில் உறுதிப்படுத்தவில்லை. ஆகவே கூடுதல் பட்டம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சுருக்கமான கதைநடை, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சொற்தேர்வு. மூலத்தின் சொல்வரிசை இயன்ற அளவு காக்கப்பட்டுள்ளது.
