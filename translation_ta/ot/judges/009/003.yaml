translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உருவகமான ‘மனம் சாய்ந்தது’ பாதுகாக்கப்பட்டு, அதன் அரசியல் ஆதரவு சார்ந்த திசை ‘பின்பற்றச்’ என்பதால் தெளிவாக்கப்பட்டுள்ளது. மூலத்தில் ‘வார்த்தைகள்/காரியங்கள்’ என்ற பொருள் வாய்ப்பு இருந்தாலும், முந்தைய வசனத்தின் பேச்சைச் சுட்டுவதால் பிரதான உரையில் ‘வார்த்தைகள்’ தேர்ந்தெடுக்கப்பட்டது.
