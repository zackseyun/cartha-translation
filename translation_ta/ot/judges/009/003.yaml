  yaml_path: translation/ot/judges/009/003.yaml
  text: And his mother’s brothers spoke all these words about him in the hearing of all the leaders of Shechem[a], and their hearts turned after Abimelech, for they said[b], “He is our brother.”
translation:
  language: ta
  text: அவனுடைய தாயின் சகோதரர்கள், அவனைப் பற்றிய இந்த வார்த்தைகளையெல்லாம் சீகேமின் தலைவர்கள் அனைவரும்[a] கேட்கும்படி சொன்னார்கள். அவர்களுடைய மனம் அபிமெலேக்கின் பக்கம் சாய்ந்தது; ஏனெனில், “அவன் நம் சகோதரன்” என்று அவர்கள் சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீகேமின் எஜமானர்கள் அனைவரும்” அல்லது “சீகேமின் செல்வாக்குள்ள மனிதர்கள் அனைவரும்.” எபிரெயச் சொற்றொடர் நகரத்தின் செல்வாக்குள்ள ஆண்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: சொன்னார்கள்
  rationale: பேச்சுச் செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; அடுத்துவரும் நேரடிப் பொருளான ‘வார்த்தைகள்’ என்பதோடும் பொருந்துகிறது.
- source_word: אֲחֵי אִמּוֹ
  choice: அவனுடைய தாயின் சகோதரர்கள்
  rationale: இது அவனுடைய தாயின் ஆண் உடன்பிறந்தவர்களைக் குறிப்பாகக் குறிக்கிறது; பொதுவான உறவினர்களாக விரிவுபடுத்தவில்லை.
- source_word: עָלָיו
  choice: அவனைப் பற்றிய
  rationale: அபிமெலேக்கைக் குறித்து அவர்கள் பேசியதை நேரடியாகத் தருகிறது; ‘அவனுக்காக’ என்று மொழிபெயர்த்து நோக்கத்தை மிகுதியாக விளக்கவில்லை.
- source_word: בְּאָזְנֵי
  choice: கேட்கும்படி
  rationale: ‘காதுகளில்’ என்ற எபிரெய மொழிநடையின் பொருளை இயல்பான தமிழில், உரிய கேட்போர் முன்னிலையில் சொல்லப்பட்டதாகத் தெரிவிக்கிறது.
- source_word: כָּל בַּעֲלֵי שְׁכֶם
  choice: சீகேமின் தலைவர்கள் அனைவரும்
  rationale: בעלי என்பது இச்சூழலில் நகரத்தின் செல்வாக்குள்ள குடிமைத் தலைவர்களைக் குறிக்கிறது; ‘எஜமானர்கள்’ என்ற சொற்படி வடிவத்தைவிட ‘தலைவர்கள்’ தெளிவானது.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகளையெல்லாம்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட முன்மொழிவை மீண்டும் எடுத்துரைத்ததைச் சுட்டுகிறது; דברים என்பதன் பேச்சு சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: וַיֵּט לִבָּם
  choice: அவர்களுடைய மனம் ... சாய்ந்தது
  rationale: உள்ளார்ந்த விருப்பம் அல்லது ஆதரவு ஒரு திசையில் திரும்பியதைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: அபிமெலேக்கைப் பின்பற்றச்
  rationale: அபிமெலேக்குக்கு ஆதரவாகச் சென்று அவரைப் பின்பற்றும் அரசியல் விசுவாசத்தைத் தெளிவுபடுத்துகிறது; ‘பின்னால்’ என்ற தமிழில் இயல்பற்ற வடிவத்தைத் தவிர்க்கிறது.
- source_word: כִּי אָמְרוּ
  choice: ஏனெனில் ... என்று அவர்கள் சொன்னார்கள்
  rationale: அவர்கள் அபிமெலேக்கை ஆதரித்ததற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: אָחִינוּ הוּא
  choice: அவன் நம் சகோதரன்
  rationale: சீகேமியத் தாய்வழி உறவை அடிப்படையாகக் கொண்ட ஒற்றுமை வாதத்தின் நேரடியான ‘சகோதரன்’ உருவகத்தைப் பாதுகாக்கிறது; ‘உறவினன்’ என்று பொதுமைப்படுத்தவில்லை.
