source:
  edition: WLC
  text: וַ/יִּקְרָ֨א מְהֵרָ֜ה אֶל הַ/נַּ֣עַר נֹשֵׂ֣א כֵלָ֗י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ שְׁלֹ֤ף חַרְבְּ/ךָ֙ וּ/מ֣וֹתְתֵ֔/נִי פֶּן יֹ֥אמְרוּ לִ֖/י אִשָּׁ֣ה הֲרָגָ֑תְ/הוּ וַ/יִּדְקְרֵ֥/הוּ נַעֲר֖/וֹ וַ/יָּמֹֽת־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/054.yaml
  text: Then he quickly called to the young man who carried his weapons and said to him[a], “Draw your sword and kill me, lest they say of me, ‘A woman killed him.’” So his young man pierced him through, and he died.
translation:
  language: ta
  text: அப்போது அவன் தன் ஆயுதங்களைச் சுமந்த இளைஞனை அவசரமாக அழைத்து[a], “உன் வாளை உருவி, என்னைக் கொன்றுவிடு; இல்லையெனில், ‘ஒரு பெண் அவனைக் கொன்றாள்’ என்று என்னைக் குறித்துச் சொல்வார்கள்” என்றான். எனவே அவனுடைய இளைஞன் அவனைக் குத்தினான்; அவன் இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் ஆயுதங்களைச் சுமந்த இளைஞன்” / “அவனுடைய இளைஞன்” என்பவற்றைச் சூழலுக்கு ஏற்ப “அவனுடைய ஆயுதம் தாங்குபவன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא מְהֵרָה
  choice: அவசரமாக அழைத்து
  rationale: வழக்கமான கதைத் தொடரையும் מְהֵרָה என்பதன் அவசரத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַנַּעַר נֹשֵׂא כֵלָיו
  choice: தன் ஆயுதங்களைச் சுமந்த இளைஞன்
  rationale: נַעַר என்பதன் அடிப்படைப் பொருளான ‘இளைஞன்’ என்பதையும், כֵלָיו என்பதன் சூழல்சார் ‘ஆயுதங்கள்’ என்ற பொருளையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: שְׁלֹף חַרְבְּךָ
  choice: உன் வாளை உருவி
  rationale: உறையிலிருந்து வாளை வெளியே எடுக்கும் செயலை ‘உருவுதல்’ துல்லியமாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: וּמוֹתְתֵנִי
  choice: என்னைக் கொன்றுபோடு
  rationale: பேச்சாளன் தன்னைக் கொல்லுமாறு நேரடியாக இடும் கட்டளையின் தீவிரத்தை இயல்பான தமிழில் தருகிறது.
- source_word: פֶּן יֹאמְרוּ לִי
  choice: இல்லையென்றால் ... என்னைக் குறித்துச் சொல்வார்கள்
  rationale: פֶּן குறிக்கும் தவிர்க்க வேண்டிய விளைவைத் தெளிவாகக் காட்டுகிறது; לִי இச்சூழலில் ‘என்னைக் குறித்து’ என்ற பொருளில் இயல்பாக வருகிறது.
- source_word: אִשָּׁה הֲרָגָתְהוּ
  choice: ‘ஒரு பெண் அவனைக் கொன்றாள்’
  rationale: எபிரெயத்தில் ‘பெண்’ முன்னிலைப்படுத்தப்பட்டுள்ளதையும் நேரடி மேற்கோளின் அவமான உணர்வையும் காக்கிறது.
- source_word: וַיִּדְקְרֵהוּ
  choice: அவனை வாளால் குத்தினான்
  rationale: வினைச்சொல்லின் குத்துதல்/துளைத்தல் பொருளைத் தக்கவைக்கிறது; சூழலில் கருவி வாள் என்பது தெளிவாக இருப்பதால் தமிழில் இயல்புக்காக அதை வெளிப்படுத்துகிறது.
- source_word: נַעֲרוֹ
  choice: அவனுடைய இளைஞன்
  rationale: வசனத்தின் முற்பகுதியில் வரும் נַעַר உடன் சொல் ஒற்றுமையைப் பாதுகாக்கிறது; பொருள் தெளிவுக்கான வழக்குச் சொல் அடிக்குறிப்பில் தரப்படுகிறது.
