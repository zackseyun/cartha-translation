translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நேரடி பேச்சும் வன்முறைச் செயலும் மென்மைப்படுத்தப்படவில்லை; ‘இளைஞன்’ என்ற சொல் இரு இடங்களிலும் ஒரேபடியாக வைக்கப்பட்டு, ‘ஆயுததாரி’ என்ற சூழல்சார் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
