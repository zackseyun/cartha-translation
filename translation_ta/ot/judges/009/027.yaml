  text: וַ/יֵּצְא֨וּ הַ/שָּׂדֶ֜ה וַֽ/יִּבְצְר֤וּ אֶת כַּרְמֵי/הֶם֙ וַֽ/יִּדְרְכ֔וּ וַֽ/יַּעֲשׂ֖וּ הִלּוּלִ֑ים וַ/יָּבֹ֨אוּ֙ בֵּ֣ית אֱֽלֹֽהֵי/הֶ֔ם וַ/יֹּֽאכְלוּ֙ וַ/יִּשְׁתּ֔וּ וַֽ/יְקַלְל֖וּ אֶת אֲבִימֶֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/027.yaml
  text: And they went out into the field and gathered the grapes from their vineyards and trod them[a], and they held a festival[b]. Then they went into the house of their god and ate and drank and cursed Abimelek.
translation:
  language: ta
  text: அவர்கள் வயலுக்குச் சென்று, தங்கள் திராட்சைத்தோட்டங்களிலிருந்து திராட்சைப் பழங்களைப் பறித்து, அவற்றை மிதித்து, விழாக் கொண்டாட்டம் நடத்தினார்கள்.[a] பின்பு அவர்கள் தங்கள் தெய்வத்தின்[b] இல்லத்திற்குச் சென்று, சாப்பிட்டுக் குடித்து, அபிமெலேக்கைச் சபித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அறுவடை விழாக்களைக் கொண்டாடினார்கள்’ அல்லது ‘மகிழ்ந்து கொண்டாடினார்கள்.’ எபிரெயச் சொல் விழாக்காலக் கொண்டாட்டத்தைக் குறிக்கிறது; இங்கு அது திராட்சை அறுவடையுடன் தொடர்புடையதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தங்கள் தெய்வங்களின்.’ எபிரெய வடிவத்தைப் பன்மையாகவும் வாசிக்கலாம்; ஆனால் இங்கு அந்த வழிபாட்டு இல்லத்தில் வணங்கப்பட்ட தெய்வத்தைக் குறிக்கும் ஒருமைப் பொருள் இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ הַשָּׂדֶה
  choice: அவர்கள் வயலுக்குச் சென்று
  rationale: שׂדה־ה என்ற திசைச்சுட்டு வடிவம் வயலுக்கு அல்லது திறந்த வெளிக்குச் செல்வதைக் குறிக்கிறது. சூழலில் நகரத்திலிருந்து வயலுக்குச் சென்றதை இவ்வாறு இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיִּבְצְרוּ אֶת כַּרְמֵיהֶם
  choice: தங்கள் திராட்சைத்தோட்டங்களிலிருந்து திராட்சைப் பழங்களைப் பறித்து
  rationale: בצר என்பது திராட்சைத்தோட்டச் சூழலில் திராட்சைப் பழங்களைப் பறித்து அறுவடை செய்வதைக் குறிப்பாகக் குறிக்கிறது. தமிழில் செயலும் அதன் பொருளும் தெளிவாக இருக்க இவ்விரிவாக்கம் தேவைப்படுகிறது.
- source_word: וַיִּדְרְכוּ
  choice: அவற்றை மிதித்து
  rationale: இங்கு דרך திராட்சைப் பழங்களிலிருந்து சாறு எடுக்க அவற்றைக் காலால் மிதிப்பதைக் குறிக்கிறது. முன் குறிப்பிடப்பட்ட திராட்சைப் பழங்களை ‘அவற்றை’ என்பது இயல்பாகச் சுட்டுகிறது.
- source_word: וַיַּעֲשׂוּ הִלּוּלִים
  choice: அறுவடைக் கொண்டாட்டம் நடத்தினார்கள்
  rationale: הִלּוּלִים திராட்சை அறுவடையோடு தொடர்புடைய விழாக்கால மகிழ்ச்சியைக் குறிக்கிறது. ‘அறுவடைக் கொண்டாட்டம்’ சூழலைத் தெளிவாக்குகிறது; சடங்கின் தன்மையை அளவுக்கு மீறி வரையறுப்பதில்லை.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: தங்கள் தெய்வத்தின் இல்லத்திற்கு
  rationale: בֵּית என்பதற்கு முறையாக நெருக்கமான ‘இல்லம்’ தேர்ந்தெடுக்கப்பட்டது. אֱלֹהֵיהֶם வடிவத்தில் பன்மை சாத்தியம் இருந்தாலும், இச்சூழலில் குறிப்பிட்ட வழிபாட்டுத் தெய்வத்தை ஒருமையில் சுட்டுவது இயல்பான வாசிப்பு.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: சாப்பிட்டுக் குடித்து
  rationale: இரு எளிய வினைகளின் தொடரை இயல்பான நவீன தமிழில் நேரடியாகப் பாதுகாக்கிறது; விருந்து என்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: וַיְקַלְלוּ אֶת אֲבִימֶלֶךְ
  choice: அபிமெலேக்கைச் சபித்தார்கள்
  rationale: קלל என்பதன் பியேல் வடிவம் இங்கு வெறும் பழிப்பதைவிட வலுவாக ‘சபித்தல்’ என்று பொருள்படுகிறது. எபிரெய நேரடிப் பொருள் அமைப்பும் தமிழில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: புறவழிபாட்டுச் சூழலில் אֱלֹהֵיהֶם என்பதன் எண்
  choice: தங்கள் தெய்வத்தின்
  alternative: தங்கள் தெய்வங்களின்
  rationale: இவ்வடிவம் இலக்கணரீதியாகப் பன்மையாக வாசிக்கப்படலாம். எனினும், உடனடி கதைச்சூழல் அவர்கள் நுழைந்த குறிப்பிட்ட வழிபாட்டு இல்லத்தின் தெய்வத்தைச் சுட்டுவதால், மூலத்தின் சாத்தியமான பன்மை வாசிப்பை அடிக்குறிப்பில் வைத்துக்கொண்டு ஒருமை முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான எபிரெய வினைநடையை தமிழில் இயல்பான வினையெச்சத் தொடராக வழங்கி, இறுதி செயல்களைத் தெளிவாக வைத்துள்ளது. ‘கோவில்’ என்பது விளக்கத் தன்மை அதிகமுள்ளதால், மூலத்தின் ‘இல்லம்’ உருவகத்தைப் பாதுகாக்க ‘தெய்வத்தின் இல்லம்’ தேர்ந்தெடுக்கப்பட்டது.
