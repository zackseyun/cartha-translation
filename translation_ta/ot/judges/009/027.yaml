  source_fidelity: 'முதன்மை உரை பெரும்பாலும் எபிரெய வினைவரிசையையும் பொருளையும் நன்றாகப் பிரதிபலிக்கிறது: வயலுக்குச் செல்லுதல், திராட்சை பறித்தல், மிதித்தல், தெய்வத்தின் இல்லத்திற்குச் செல்லுதல், உண்ணுதல், குடித்தல், அபிமெலேக்கைச் சபித்தல் ஆகியவை சரியாக உள்ளன. ஆனால் הִלּוּלִים என்பதற்கு ‘அறுவடைக் கொண்டாட்டம்’ என்று முதன்மை உரையில் கூறுவது, அறுவடையுடனான தொடர்பைச் சூழலிலிருந்து உறுதிப்படுத்தப்பட்டதாக ஆக்குகிறது; மூலச் சொல் பொதுவாக விழாக் கொண்டாட்டத்தைக் குறிக்கிறது; அறுவடைத் தொடர்பு சாத்தியமான சூழல் விளக்கமாகவே உள்ளது.'
  naturalness: நடை நவீனத் தரமான தமிழிலும் கண்ணியமான வேதாகமப் பதிவிலும் இயல்பாக உள்ளது. ‘விழாக் கொண்டாட்டம் நடத்தினார்கள்’ என்பது ‘அறுவடைக் கொண்டாட்டம் நடத்தினார்கள்’ என்பதைக் காட்டிலும் மூலத்தின் திறந்த பொருளைத் தக்கவைத்தபடி இயல்பாக அமையும்.
