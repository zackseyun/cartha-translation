  rationale: விழாவின் அறுவடைத் தொடர்பை உறுதியான முதன்மைப் பொருளாக அல்லாமல் சாத்தியமான சூழல் விளக்கமாக அடிக்குறிப்பில் வைத்துள்ளோம். மற்ற சொற்கள் மூலத்திற்கும் நவீனத் தரமான தமிழ் நடைக்கும் ஏற்றவையாக இருப்பதால் மாற்றப்படவில்லை. அடிக்குறிப்பு அடையாளங்கள் உரிய சொற்களிலேயே நிலைநிறுத்தப்பட்டுள்ளன.
