translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. எபிரெய உறவுமுறை மற்றும் குடும்பக் குழு அமைப்பு மிகையாக விளக்கப்படாமல் உரையிலும் அடிக்குறிப்பிலும் வேறுபடுத்தப்பட்டுள்ளது.
