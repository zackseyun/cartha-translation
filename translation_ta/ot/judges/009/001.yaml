  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ אֲבִימֶ֤לֶךְ בֶּן יְרֻבַּ֨עַל֙ שְׁכֶ֔מָ/ה אֶל אֲחֵ֖י אִמּ֑/וֹ וַ/יְדַבֵּ֣ר אֲלֵי/הֶ֔ם וְ/אֶל כָּל מִשְׁפַּ֛חַת בֵּית אֲבִ֥י אִמּ֖/וֹ לֵ/אמֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/001.yaml
  text: Abimelech son of Jerubbaal went to Shechem[a], to his mother's brothers, and spoke to them and to the whole clan of his mother's father's house, saying,
translation:
  language: ta
  text: 'யெருபாகாலின் மகன் அபிமெலேக்கு சீகேமுக்குத் தன் தாயின் சகோதரர்களிடம் சென்றான். அவர்களிடமும், தன் தாயின் தந்தை வீட்டைச் சேர்ந்த குலத்தார் அனைவரிடமும்[a] அவன் இவ்வாறு சொன்னான்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தன் தாயின் தந்தை வீடு’ என்ற எபிரெயச் சொற்றொடர், அவனுடைய தாய்வழிக் குடும்பத்தாரையோ வம்ச உறவினரையோ குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: சென்றான்
  rationale: வாவ் தொடர் வடிவம் கதையை முன்னெடுக்கிறது. தமிழில் தேவையற்ற ‘பின்பு’ போன்ற காலச்சொல்லைச் சேர்க்காமல் எளிய இறந்தகால வினை இயல்பாக அந்த முன்னேற்றத்தைக் காட்டுகிறது.
- source_word: אֲבִימֶלֶךְ
  choice: அபிமெலேக்கு
  rationale: தனிப்பெயர் நவீனத் தமிழில் எளிதாக வாசிக்கக்கூடிய ஒலிபெயர்ப்பாக வழங்கப்பட்டுள்ளது.
- source_word: בֶּן יְרֻבַּעַל
  choice: யெருபாகாலின் மகன்
  rationale: தந்தை–மகன் உறவை நேரடியாகவும் இயல்பான தமிழ் உடைமைத் தொடரிலும் காட்டுகிறது.
- source_word: שְׁכֶמָה
  choice: சீகேமுக்கு
  rationale: இடப்பெயருடன் இணைந்த திசைச் சுட்டு, அந்த நகரை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் நான்காம் வேற்றுமை இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶל אֲחֵי אִמּוֹ
  choice: தன் தாயின் சகோதரர்களிடம்
  rationale: ‘சகோதரர்கள்’ என்று மூலத்தின் உறவுமுறைச் சொல்லைத் தக்கவைக்கிறது; சூழலில் இவர்கள் அபிமெலேக்கின் தாய்மாமன்கள் என்றாலும் அதை உரையில் விளக்கிப் பதிலீடு செய்யவில்லை.
- source_word: וַיְדַבֵּר אֲלֵיהֶם
  choice: அவர்களிடமும் … அவன் … சொன்னான்
  rationale: அடுத்த வசனத்தில் வரும் நேரடிப் பேச்சை அறிமுகப்படுத்தும் לֵאמֹר உடன் இணைத்து, தமிழில் இயல்பான பேச்சு அறிமுகமாக அமைக்கப்பட்டுள்ளது.
- source_word: וְאֶל כָּל מִשְׁפַּחַת
  choice: குலத்தார் அனைவரிடமும்
  rationale: מִשְׁפָּחָה அணுக்குடும்பத்தைவிட விரிவான உறவுக் குழுவைக் குறிக்கிறது; ‘குலத்தார்’ அந்த சமூக அலகைத் தெரிவிக்கிறது, ‘அனைவரும்’ כָּל என்பதன் முழுமையைப் பேணுகிறது.
- source_word: בֵּית אֲבִי אִמּוֹ
  choice: தன் தாயின் தந்தை வீட்டைச் சேர்ந்த
  rationale: ‘தன் தாயின் தந்தையின் வீடு’ என்ற எபிரெய உறவுக் கட்டமைப்பையும், ‘வீடு’ என்பதன் குடும்பம்/வம்சம் சார்ந்த பொருளையும் தெளிவான தமிழில் பேணுகிறது.
- source_word: לֵאמֹר
  choice: 'இவ்வாறு சொன்னான்:'
  rationale: அடுத்த வசனத்தின் நேரடிப் பேச்சை அறிமுகப்படுத்துகிறது. இரட்டைப் பேச்சுவினையைத் தவிர்த்து தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
