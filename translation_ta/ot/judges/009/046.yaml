source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֔וּ כָּֽל בַּעֲלֵ֖י מִֽגְדַּל שְׁכֶ֑ם וַ/יָּבֹ֣אוּ אֶל צְרִ֔יחַ בֵּ֖ית אֵ֥ל בְּרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/046.yaml
  text: When all the leaders of the tower of Shechem heard it[c][b][a], they went into the inner chamber of the house of El-berith.
translation:
  language: ta
  text: செகேமின் கோபுரத்தின் தலைவர்கள்[a] அனைவரும் இதைக் கேட்டபோது, அவர்கள் எல்-பெரீத்தின் இல்லத்திலுள்ள பாதுகாக்கப்பட்ட உள் அறைக்குள்[b] சென்றார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மிக்தால்-செகேமின் தலைவர்கள்’; ‘செகேமின் கோபுரம்’ என்ற தொடர் ஓர் இடப்பெயராகவும் இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘பாதுகாக்கப்பட்ட உள் அறை’ என்பதற்குப் பதிலாக ‘நிலவறை,’ ‘அரண்,’ அல்லது ‘உள் அறை’ என்றும் பொருள் கொள்ளலாம்; எபிரெயச் சொல் பாதுகாக்கப்பட்ட ஓர் உட்பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘எல்-பெரீத்’ என்பதற்கு ‘உடன்படிக்கையின் கடவுள்’ என்று பொருள் இருக்கலாம். இவ்வதிகாரத்தின் பிற இடங்களிலுள்ள ‘பாகால்-பெரீத்’ என்ற தொடர்புடைய பெயரையும் ஒப்பிடுக.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: இதைக் கேட்டபோது
  rationale: எபிரெய வினை நேரடியாக ‘கேட்டார்கள்’ என்று பொருள்படுகிறது. முந்தைய நிகழ்வைப் பற்றிய செய்தியே சூழலில் மறைமுகச் செயப்படுபொருளாக இருப்பதால், தமிழில் இயல்பாக ‘இதைக் கேட்டபோது’ என வழங்கப்பட்டது.
- source_word: בַּעֲלֵי
  choice: தலைவர்கள்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘உரிமையாளர்கள்/எஜமானர்கள்’ என்றாலும், இங்குள்ள குடிமை மற்றும் இராணுவச் சூழலில் முதன்மையான ஆண்கள் அல்லது முன்னணிக் குடிமக்கள் குறிக்கப்படுகின்றனர்; ‘தலைவர்கள்’ இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִגְדַּל שְׁכֶם
  choice: செகேமின் கோபுரம்
  rationale: מִגְדַּל என்பதன் நேரடிப் பொருள் ‘கோபுரம்.’ இத்தொடர் விளக்கப் பெயராகவும் ‘மிக்தால்-செகேம்’ என்ற இடப்பெயராகவும் இருக்கக்கூடும்; முதன்மை உரையில் நேரடிப் பொருள் வைக்கப்பட்டு, மாற்று சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיָּבֹאוּ אֶל
  choice: உள்ளே சென்றார்கள்
  rationale: அடுத்ததாகக் குறிப்பிடப்படும் அடைக்கலத்தை நோக்கி, அதற்குள் நிகழ்ந்த இயக்கத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: צְרִיחַ
  choice: பாதுகாப்பான உட்கூடம்
  rationale: இந்த அரிய பெயர்ச்சொல் பாதுகாக்கப்பட்ட உள் அறை, நிலவறை அல்லது அரண் போன்ற இடத்தைக் குறிக்கலாம். ‘பாதுகாப்பான உட்கூடம்’ அதன் உள் இருப்பிடத்தையும் அடைக்கலத் தன்மையையும் காட்டுகிறது; துல்லியமான கட்டட வடிவத்தைத் தீர்மானிப்பதில்லை.
- source_word: בֵּית אֵל בְּרִית
  choice: எல்-பெரீத்தின் இல்லம்
  rationale: בֵּית என்பதன் நேரடிப் பொருளான ‘இல்லம்’ வழிபாட்டுத் தலத்தையும் குறிக்கலாம். ‘எல்-பெரீத்’ என்று ஒலிபெயர்ப்பது, அதைத் தெய்வப் பெயர்/பட்டமாக வாசிக்கும் சாத்தியத்தையும் ‘உடன்படிக்கையின் கடவுள்’ என்ற பொருளையும் திறந்தவாறே வைக்கிறது.
theological_decisions:
- issue: אֵל בְּרִית என்ற வழிபாட்டுப் பெயர் அல்லது பட்டத்தை மொழிபெயர்த்தல்
  choice: எல்-பெரீத்
  alternative: உடன்படிக்கையின் கடவுள்; அருகிலுள்ள சூழலுடன் ஒத்திசைத்து பாகால்-பெரீத்
  rationale: ஒலிபெயர்ப்பு, இது தனிப்பெயரா அல்லது பொருளுடைய தெய்வப் பட்டமா என்ற உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது. இவ்வசனத்தில் இல்லாத ‘பாகால்-பெரீத்’ என்ற ஒத்திசைப்பையும் திணிப்பதில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘இல்லம்’ மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது; வழிபாட்டுச் சூழலில் அது கோவிலை அல்லது ஆலயத்தைச் சுட்டுகிறது. மூன்று அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்றொடர்களின் வரிசையில் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
