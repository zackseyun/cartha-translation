revisions:
- from: செகேமின் கோபுரத்துத் தலைவர்கள் அனைவரும் இதைக் கேட்டபோது, அவர்கள் எல்-பெரீத்தின் இல்லத்திலுள்ள பாதுகாப்பான உட்கூடத்திற்குள் சென்றார்கள்.[a][b][c]
  to: செகேமின் கோபுரத்தின் தலைவர்கள்[a] அனைவரும் இதைக் கேட்டபோது, அவர்கள் எல்-பெரீத்தின் இல்லத்திலுள்ள பாதுகாக்கப்பட்ட உள் அறைக்குள்[b] சென்றார்கள்.[c]
  rationale: மொழிபெயர்ப்பின் பொருளை மாற்றாமல், மூலச் சொற்களுடன் அடிக்குறிப்புக் குறிகளை நேரடியாக இணைத்தேன். மேலும், צְרִיחַ என்பதற்கான எச்சரிக்கையான பொருளை நவீன தமிழில் இயல்பாகத் தருவதற்காக ‘பாதுகாப்பான உட்கூடம்’ என்பதை ‘பாதுகாக்கப்பட்ட உள் அறை’ என மாற்றினேன். எல்-பெரீத் பெயரின் தெளிவின்மையும் மிக்தால்-செகேம் இடப்பெயர் சாத்தியமும் பாதுகாக்கப்பட்டுள்ளன.
