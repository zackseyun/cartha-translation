base_translation:
  language: en
  yaml_path: translation/ot/judges/009/020.yaml
  text: But if not[a], let fire come out from Abimelech and consume the leaders of Shechem and Beth-millo[b]; and let fire come out from the leaders of Shechem and from Beth-millo and consume Abimelech.
translation:
  language: ta
  text: ஆனால் அப்படி இல்லையென்றால், அபிமெலேக்கிடமிருந்து நெருப்பு புறப்பட்டு, சீகேமின் தலைவர்களையும்[a] பெத்-மில்லோவையும்[b] எரித்து அழிக்கட்டும்; சீகேமின் தலைவர்களிடமிருந்தும் பெத்-மில்லோவிலிருந்தும் நெருப்பு புறப்பட்டு, அபிமெலேக்கை எரித்து அழிக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “சீகேமின் அதிபதிகள்.” எபிரெயச் சொற்றொடர் நகரத்தின் ஆளும் ஆண்களையோ முக்கியத் தலைவர்களையோ குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: “பெத்-மில்லோ” என்பதை “மில்லோவின் வீடு” என்றும் மொழிபெயர்க்கலாம். இது சீகேமுடன் தொடர்புடைய ஓர் இடத்தையோ ஆளும் குழுவையோ குறித்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם אַיִן
  choice: ஆனால் அப்படி இல்லையென்றால்
  rationale: முந்தைய வசனத்தின் நிபந்தனைக்கு எதிர்மறையான தொடர்ச்சியாக வரும் எபிரெயச் சொற்றொடரை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: תֵּצֵא אֵשׁ
  choice: நெருப்பு புறப்பட்டு ... அழிக்கட்டும்
  rationale: இங்குள்ள yiqtol வடிவத்தின் சாபம் அல்லது வேண்டுதல் சார்ந்த கட்டளைப் பொருளைப் பேணுகிறது; இதை வெறும் எதிர்கால முன்னறிவிப்பாக மாற்றவில்லை.
- source_word: מֵאֲבִימֶלֶךְ
  choice: அபிமெலேக்கிடமிருந்து
  rationale: அழிவை உண்டாக்கும் நெருப்பு அவனிடமிருந்து புறப்படும் என்ற மூல உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: וְתֹאכַל
  choice: எரித்து அழிக்கட்டும்
  rationale: நெருப்பை எழுவாயாகக் கொண்ட אכל என்பதன் ‘விழுங்கு/முற்றிலும் அழி’ என்ற பொருளைத் தமிழில் தெளிவாகவும் உருவகத்துக்கு ஏற்றவாறும் தருகிறது.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: சீகேமின் தலைவர்கள்
  rationale: இச்சூழலில் நகரத்தின் ஆளும் ஆண்கள் அல்லது முக்கியஸ்தர்களைக் குறிக்கிறது; பொதுமக்கள் அனைவரையும் குறிக்கும் மொழியைத் தவிர்க்கிறது.
- source_word: בֵּית מִלּוֹא
  choice: பெத்-மில்லோ
  rationale: இது இடப்பெயர் அல்லது நிறுவப்பட்ட குழுப்பெயராகச் செயல்படக்கூடும் என்பதால் பெயரொலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: וְתֵצֵא אֵשׁ מִבַּעֲלֵי שְׁכֶם וּמִבֵּית מִלּוֹא
  choice: சீகேமின் தலைவர்களிடமிருந்தும் பெத்-மில்லோவிடமிருந்தும் நெருப்பு புறப்பட்டு
  rationale: முதல் கூறுக்கு இணையான அமைப்பைப் பேணி, இரு தரப்பினருக்கும் இடையிலான பரஸ்பர அழிவுச் சாபத்தை வெளிப்படுத்துகிறது.
- source_word: אֶת אֲבִימֶלֶךְ
  choice: அபிமெலேக்கை
  rationale: இறுதி வினையின் நேரடிச் செயப்படுபொருளாகத் துல்லியமாக வழங்கப்பட்டு, பரஸ்பர அழிவின் சமச்சீர் அமைப்பை நிறைவு செய்கிறது.
theological_decisions:
- issue: ‘நெருப்பு’ என்ற உருவகத்தின் தன்மை
  choice: சாபவாக்கில் உள்ள ‘நெருப்பு’ என்ற மூலப் படிமத்தை அப்படியே வைத்தல்
  alternative: அதை வன்முறை மோதல் என்ற உருவகமாக மட்டும் விளக்குதல் அல்லது நேரடியான தெய்வீக நெருப்பாக வெளிப்படையாகக் கூறுதல்
  rationale: எபிரெய உரை ‘நெருப்பு’ என்ற தெளிவான படிமத்தைப் பயன்படுத்துகிறது. சூழலில் அது பரஸ்பர அழிவை முன்னறிவிக்கலாம்; இருப்பினும் அது சொல்லர்த்தமானதா, உருவகமானதா, இரண்டுமா என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல் மூலத்தின் இறையியல் பதற்றத்தைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இரு கூறுகளின் சமச்சீர் அமைப்பும் சாபவாக்கின் வலிமையும் காக்கப்பட்டுள்ளன. வழங்கப்பட்ட ஆங்கில அடுக்கில் [a] குறி தவறான இடத்தில் இருந்ததால், அதன் அடிக்குறிப்பு உள்ளடக்கத்துக்கும் בַּעֲלֵי שְׁכֶם என்ற மூலச் சொல்லுக்கும் பொருந்துமாறு ‘சீகேமின் தலைவர்கள்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
