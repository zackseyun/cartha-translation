revisions:
- from: மறுநாள் மக்கள் வயல்வெளிக்குப் புறப்பட்டுச் சென்றார்கள்; இது அபிமெலேக்குக்கு அறிவிக்கப்பட்டது.[a]
  to: மறுநாள் மக்கள் வயலுக்குச் சென்றார்கள்; அதை அபிமெலேக்குக்குத் தெரிவித்தார்கள்.[a]
  rationale: The revision retains the Hebrew temporal sequence and the collective “people,” while rendering the indefinite plural verb actively and idiomatically. This avoids the vague Tamil pronoun in the passive construction and preserves the source’s unspecified human reporters without identifying them.
