  text: וַֽ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יֵּצֵ֥א הָ/עָ֖ם הַ/שָּׂדֶ֑ה וַ/יַּגִּ֖דוּ לַ/אֲבִימֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/042.yaml
  text: And it happened on the next day that the people went out into the field[a], and it was reported to Abimelek.
translation:
  language: ta
  text: மறுநாள் மக்கள் வயலுக்குச் சென்றார்கள்; அதை அபிமெலேக்குக்குத் தெரிவித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “அவர்கள் அபிமெலேக்குக்குத் தெரிவித்தார்கள்.” இங்குள்ள “அவர்கள்” என்பது யாரென்று குறிப்பிடப்படாத பன்மை எழுவாய்; மக்கள் வயலுக்குச் சென்றதை யாரோ அபிமெலேக்குக்குத் தெரிவித்தார்கள் என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[தனி வார்த்தையாக மொழிபெயர்க்காமல் நிகழ்வின் தொடர்ச்சியில் வெளிப்படுத்தப்பட்டது]'
  rationale: இது அடுத்த நிகழ்வை அறிமுகப்படுத்தும் எபிரெயக் கதைத் தொடரின் வழக்கமான வடிவம். தமிழில் இயல்பான கதைநடைக்காக ‘மறுநாள்’ என்று நேரடியாகத் தொடங்குவது அதன் செயல்பாட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִמָּחֳרָת
  choice: மறுநாள்
  rationale: அடுத்த நாள் அல்லது பின்வரும் நாள் என்ற காலப்பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וַיֵּצֵא
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: יצא என்பதன் வெளியே செல்லுதல் என்ற இயக்கப்பொருளைச் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: பாலினத்தைக் குறிப்பாக வரையறுக்காமல் ஒரு மக்கள் கூட்டத்தைச் சுட்டும் עם என்ற கூட்டுப்பெயருக்கு நேரான தேர்வு.
- source_word: הַשָּׂדֶה
  choice: வயல்வெளிக்கு
  rationale: நகருக்கு வெளியேயுள்ள திறந்த அல்லது பயிரிடப்படும் நிலத்தைக் குறிக்கும் שׂדה என்ற ஒருமைப் பெயரின் சூழல்சார் பொருளைப் பாதுகாக்கிறது.
- source_word: וַיַּגִּדוּ
  choice: அறிவிக்கப்பட்டது
  rationale: எபிரெயத்தில் செய்பவர் யார் என்று குறிப்பிடாத மூன்றாம் நபர் பன்மை வினை உள்ளது. தமிழில் செய்பவரைக் கூடுதலாக ஊகிக்காமல் அதன் பொருளை இயல்பாகத் தர செயப்பாட்டு வடிவம் பயன்படுத்தப்பட்டது.
- source_word: לַאֲבִימֶלֶךְ
  choice: அபிமெலேக்குக்கு
  rationale: எபிரெயப் பெயரான אֲבִימֶלֶךְ தமிழில் ஒலிபெயர்க்கப்பட்டு, לְ முன்னிடைச்சொல்லின் பெறுநர் பொருள் ‘-க்கு’ மூலம் வெளிப்படுத்தப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. எபிரெயக் கதைத் தொடரின் இயல்பைத் தமிழில் தேவையற்ற சொற்சுமையின்றி வெளிப்படுத்தி, செய்தி தெரிவித்தவர்களின் அடையாளம் குறிப்பிடப்படாத நிலை பாதுகாக்கப்பட்டது.
