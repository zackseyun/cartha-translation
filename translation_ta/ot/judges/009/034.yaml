source:
  edition: WLC
  text: וַ/יָּ֧קָם אֲבִימֶ֛לֶךְ וְ/כָל הָ/עָ֥ם אֲשֶׁר עִמּ֖/וֹ לָ֑יְלָה וַ/יֶּאֶרְב֣וּ עַל שְׁכֶ֔ם אַרְבָּעָ֖ה רָאשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/034.yaml
  text: So Abimelech and all the people who were with him got up by night[a], and they lay in ambush against Shechem in four companies.
translation:
  language: ta
  text: அபிமெலேக்கும் அவனோடு இருந்த மக்கள் அனைவரும் இரவில் எழுந்து, நான்கு பிரிவுகளாக[a] சீகேமுக்கு எதிராகப் பதுங்கிக் காத்திருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘நான்கு தலைகளாக’; அதாவது நான்கு குழுக்களாக அல்லது பிரிவுகளாக.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்பதன் கதைநடை வடிவம்; எழுவதையும் செயல்படத் தொடங்குவதையும் இயல்பாகக் குறிக்கிறது. புறப்பட்டான் என்று மட்டும் பொருளைச் சுருக்கவில்லை.
- source_word: לָיְלָה
  choice: இரவில்
  rationale: காலத்தைக் குறிக்கும் வினையடைப் பயன்பாடு; நடவடிக்கை இரவில் நிகழ்ந்ததைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיֶּאֶרְבוּ
  choice: பதுங்கிக் காத்திருந்தார்கள்
  rationale: ארב குறிக்கும் தாக்குவதற்காக மறைந்து காத்திருக்கும் நிலையைக் தற்போதைய இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל שְׁכֶם
  choice: சீகேமுக்கு எதிராக
  rationale: ארב உடன் வரும் עַל இங்கு வெறும் இடத்தை மட்டுமல்ல, பகைமை நோக்குடைய இலக்கையும் குறிக்கலாம்; அதனால் ‘எதிராக’ பொருத்தமானது.
- source_word: אַרְבָּעָה רָאשִׁים
  choice: நான்கு பிரிவுகளாக
  rationale: சொல்லுக்குச் சொல் ‘நான்கு தலைகள்’; இச்சூழலில் நான்கு தனித்த குழுக்கள் அல்லது படைப்பிரிவுகள் என்ற எபிரெய மரபுத்தொடரின் பொருளைத் தருகிறது.
- source_word: הָעָם אֲשֶׁר עִמּוֹ
  choice: அவனோடு இருந்த மக்கள் அனைவரும்
  rationale: עָם என்பது பொதுவாக ‘மக்கள்’ என்று பொருள்படும். சூழல் இராணுவச் சூழலாயினும், மூலத்தில் ‘வீரர்கள்’ அல்லது ‘படைகள்’ என்று வெளிப்படையாக இல்லை என்பதால் பரந்த சொல்லே வைக்கப்பட்டுள்ளது.
