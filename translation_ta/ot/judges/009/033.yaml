translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்கு விளங்கும் கண்ணியமான வரலாற்று-போரியல் நடை பயன்படுத்தப்பட்டுள்ளது. கட்டளையின் வலிமை காக்கப்பட்டுள்ளது; ‘அவனுக்குச் செய்’ என்ற திறந்த முடிவு மூலத்தின் கடுமையையும் தெளிவின்மையையும் விளக்கிச் சீராக்காமல் வைத்துள்ளது.
