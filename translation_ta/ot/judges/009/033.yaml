  text: וְ/הָיָ֤ה בַ/בֹּ֨קֶר֙ כִּ/זְרֹ֣חַ הַ/שֶּׁ֔מֶשׁ תַּשְׁכִּ֖ים וּ/פָשַׁטְתָּ֣ עַל הָ/עִ֑יר וְ/הִנֵּה ה֞וּא וְ/הָ/עָ֤ם אֲשֶׁר אִתּ/וֹ֙ יֹצְאִ֣ים אֵלֶ֔י/ךָ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֖ר תִּמְצָ֥א יָדֶֽ/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/033.yaml
  text: Then in the morning[a], as soon as the sun rises, you must get up early and spread out against the city. And look, when he and the people who are with him come out to you, you shall do to him as your hand finds.
translation:
  language: ta
  text: காலையில், சூரியன் உதித்தவுடன், நீ அதிகாலையிலேயே எழுந்து நகருக்கு எதிராகப் படையெடுத்துச் செல். இதோ, அவனும் அவனோடு இருக்கும் மக்களும் உன்னை நோக்கி வெளியே வரும்போது, உன் கைக்குக் கிடைப்பதன்படி அவனுக்குச் செய்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַבֹּקֶר
  choice: காலையில்
  rationale: וְהָיָה இங்கு அறிவுறுத்தலின் அடுத்த கட்டத்தை அறிமுகப்படுத்துகிறது; தமிழில் தனியே ‘அப்போது நிகழும்’ என்று மொழிபெயர்ப்பது இயல்பற்றதால் காலக் குறிப்போடு இயல்பாக இணைக்கப்பட்டது.
- source_word: כִּזְרֹחַ הַשֶּׁמֶשׁ
  choice: சூரியன் உதித்தவுடன்
  rationale: כ + வினையெச்சப் பெயராக்கம் காலத்தையும் உடனடித் தொடர்ச்சியையும் குறிக்கிறது; போர்த் திட்டத்தின் அவசரத்தையும் இத்தேர்வு வெளிப்படுத்துகிறது.
- source_word: תַּשְׁכִּים
  choice: நீ அதிகாலையிலேயே எழுந்து
  rationale: שכם என்பதன் ஹிஃபில் வடிவம் அதிகாலையில் எழுதல் அல்லது முன்கூட்டியே தொடங்குதல் என்ற பொருளைக் கொண்டது; சூழலில் கட்டளை வலிமை உள்ளது.
- source_word: וּפָשַׁטְתָּ עַל הָעִיר
  choice: நகருக்கு எதிராகப் படையெடுத்துச் செல்
  rationale: போர்ச் சூழலில் פשט படையைப் பரப்பி முன்னேறுதல், திடீர்த் தாக்குதல் அல்லது படையெடுத்தல் எனப் பொருள்படலாம். தமிழில் ‘படையெடுத்துச் செல்’ இராணுவச் செயலை இயல்பாகக் காட்டுகிறது; தாக்குதலின் துல்லிய முறையை மிகையாக நிர்ணயிக்கவில்லை.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: அடுத்த நிகழ்வின் மீது கவனத்தைத் திருப்பும் எபிரேய உரையாடல் குறியைத் தமிழில் சுருக்கமாகவும் மரியாதையான நடையிலும் காக்கிறது.
- source_word: הוּא וְהָעָם אֲשֶׁר אִתּוֹ
  choice: அவனும் அவனோடு இருக்கும் மக்களும்
  rationale: עָם என்பதை ‘படை வீரர்கள்’ எனக் குறுக்காமல் அதன் பரந்த சொற்பொருளான ‘மக்கள்’ என்று வைத்துள்ளது.
- source_word: יֹצְאִים אֵלֶיךָ
  choice: உன்னை நோக்கி வெளியே வரும்போது
  rationale: אֶל இன் அடிப்படை திசைப் பொருளை ‘நோக்கி’ காக்கிறது. போர்ச் சூழல் பகைமையை உணர்த்தினாலும், ‘உனக்கு எதிராக’ என்று மூலத்தைவிடத் தெளிவுபடுத்தவில்லை.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: அவனுக்குச் செய்
  rationale: ஒருமை பின்னொட்டு முதன்மையாக அந்தத் தலைவனைச் சுட்டுவதால், எபிரேய ஒருமை தமிழிலும் காக்கப்பட்டது.
- source_word: כַּאֲשֶׁר תִּמְצָא יָדֶךָ
  choice: உன் கைக்கு எது முடியுமோ அதன்படி
  rationale: ‘உன் கை கண்டடைவதன்படி’ என்ற எபிரேய மரபுத்தொடர் ஒருவரின் ஆற்றல் அல்லது கிடைக்கும் வாய்ப்புக்கு ஏற்பச் செயல்படுவதைக் குறிக்கிறது. சொற்சொற் வடிவம் தமிழில் பொருள் மங்கச் செய்வதால் அதன் உருவகத்தை ஓரளவு காத்து அர்த்தம் தெளிவாக்கப்பட்டது.
