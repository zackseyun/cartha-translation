    rationale: ‘உன் கைக்கு எது முடியுமோ அதன்படி’ is a calqued construction. ‘உன் கைக்குக் கிடைப்பதன்படி’ is idiomatic Tamil and retains the Hebrew’s intentionally open sense of acting as circumstances and capacity allow.
  revised_text: காலையில், சூரியன் உதித்தவுடன், நீ அதிகாலையிலேயே எழுந்து நகருக்கு எதிராகப் படையெடுத்துச் செல். இதோ, அவனும் அவனோடு இருக்கும் மக்களும் உன்னை நோக்கி வெளியே வரும்போது, உன் கைக்குக் கிடைப்பதன்படி அவனுக்குச் செய்.
