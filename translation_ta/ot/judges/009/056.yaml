  text: וַ/יָּ֣שֶׁב אֱלֹהִ֔ים אֵ֖ת רָעַ֣ת אֲבִימֶ֑לֶךְ אֲשֶׁ֤ר עָשָׂה֙ לְ/אָבִ֔י/ו לַ/הֲרֹ֖ג אֶת שִׁבְעִ֥ים אֶחָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/056.yaml
  text: Thus God repaid Abimelech for the evil that he had done to his father by killing his seventy brothers[a].
translation:
  language: ta
  text: இவ்வாறு, தன் சகோதரர்கள் எழுபது பேரைக் கொன்றதன் மூலம் தன் தந்தைக்குச் செய்த தீமையை கடவுள் அபிமெலேக்கின் மேல் திரும்பிவரச் செய்தார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அபிமெலேக்கின் தீமையை அவன்மேல் திரும்ப வரச் செய்தார்.” எபிரேய மரபுத்தொடர், ஒருவன் செய்த தீமை அவன்மேலேயே திரும்பிவரும்படி செய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: அவன்மீதே திரும்பிவரச் செய்தார்
  rationale: שׁוב என்பதன் ஹிப்ஃபில் வடிவம், அபிமெலேக்கின் தீமை அவன்மீதே திரும்பும்படி கடவுள் செய்தார் என்ற காரணவினை மற்றும் நீதித்தீர்ப்பு சார்ந்த எபிரேய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வினைச்சொல் ஒருமையில் இருப்பதாலும், இங்கு இஸ்ரவேலின் ஒரே கடவுள் நீதித்தீர்ப்பைச் செயல்படுத்துபவராகக் குறிப்பிடப்படுவதாலும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: רָעַת
  choice: தீமையை
  rationale: இச்சூழலில் இது வெறும் கேடு அல்லது துன்பத்தைக் குறிக்காமல், அபிமெலேக்கின் ஒழுக்கரீதியான கொடிய செயலைக் குறிக்கிறது.
- source_word: אֲבִימֶלֶךְ
  choice: அபிமெலேக்கு
  rationale: தனிப்பெயர் நவீனத் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר עָשָׂה לְאָבִיו
  choice: தன் தந்தைக்கு எதிராகச் செய்த
  rationale: לְ இங்கு அந்தத் தீமையால் பாதிக்கப்பட்டவரைச் சுட்டுகிறது; கொலை அவரது மகன்களுக்கு நேர்ந்தாலும், அது தந்தைக்கு எதிராகச் செய்யப்பட்ட தீமை எனப் பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: לַהֲרֹג
  choice: கொன்ற தீமையை
  rationale: לְ உடனான வினையெச்சம் முன் கூறப்பட்ட தீமையின் உள்ளடக்கத்தை விளக்குகிறது. தமிழில் மீளுரை பயன்படுத்துவது அந்த உறவைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: שִׁבְעִים אֶחָיו
  choice: தன் சகோதரர்கள் எழுபது பேரை
  rationale: எண்ணிக்கையையும் குடும்ப உறவையும் நேரடியாகப் பாதுகாக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: וַ
  choice: இவ்வாறு
  rationale: எளிய இணைப்புச் சொல்லாக இருந்தாலும், இவ்வசனம் முந்தைய நிகழ்வுகளின் நீதித்தீர்ப்பு சார்ந்த முடிவைச் சுருக்குவதால் விளைவு மற்றும் முடிவுரை உணர்வை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: நீதித்தீர்ப்பில் கடவுளின் நேரடி செயற்பாடு
  choice: அபிமெலேக்கின் தீமை அவன்மீதே திரும்பிவரும்படி கடவுள் செய்தார்
  alternative: அபிமெலேக்கின் தீமை அவன்மீது திரும்பிவரக் கடவுள் அனுமதித்தார்
  rationale: எபிரேய வாக்கியத்தில் கடவுளே வெளிப்படையான எழுவாய்; காரணவினை வடிவம் அவர் தீமை திரும்பும்படி செய்கிறார் என்று கூறுகிறது. எனவே தெய்வீகச் செயற்பாட்டை வெறும் அனுமதியாக மென்மைப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரேய மொழியின் ‘தீமை திரும்பிவருதல்’ என்ற உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் நீதிப்பலன் சார்ந்த பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
