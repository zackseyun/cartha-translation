lexical_decisions:
- source_word: וַיִּרְדְּפֵהוּ
  choice: அவனைத் துரத்தினான்
  rationale: רדף என்பது பகைவரைப் பின்தொடர்ந்து துரத்துவதைக் குறிக்கிறது; “துரத்தினான்” போர்ச் சூழலை இயல்பாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: וַיָּנָס מִפָּנָיו
  choice: அவன் அபிமெலேக்கிடமிருந்து தப்பியோடினான்
  rationale: נוס என்பது தப்பியோடுவதைக் குறிக்கிறது; מִפָּנָיו என்பதன் சொற்பொருள் “அவனுடைய முகத்திலிருந்து/முன்னிலையிலிருந்து” என்றாலும், இச்சூழலில் “அவனிடமிருந்து” என்பது இயல்பான தமிழ் வழக்கு. குழப்பத்தைத் தவிர்க்க இரண்டாவது சுட்டுப்பெயருக்குப் பதிலாக அபிமெலேக்கின் பெயர் மீண்டும் கூறப்பட்டுள்ளது.
- source_word: וַיִּפְּלוּ חֲלָלִים רַבִּים
  choice: பலர் வெட்டுண்டு விழுந்தார்கள்
  rationale: נפל என்பதன் “விழுதல்” என்ற போர்க்களப் படிமம் தக்கவைக்கப்பட்டுள்ளது. חֲלָלִים என்பது போரில் குத்தப்பட்ட அல்லது கொல்லப்பட்டவர்களைக் குறிக்கிறது; “வெட்டுண்டு” என்பது அந்தப் போர்சார் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது, அவர்கள் இறந்தார்களா காயமடைந்தார்களா என்ற சொல்லின் சாத்தியமான பரப்பை தேவையின்றி மேலும் குறுக்கவில்லை.
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: நகரவாசலின் நுழைவிடம் வரையிலும்
  rationale: עַד என்பது “வரையிலும்,” פֶּתַח என்பது “நுழைவிடம்/திறப்பு,” שַׁעַר என்பது நகரவாசலைக் குறிக்கிறது. சூழலைத் தெளிவாக்க “நகரவாசல்” தேர்ந்தெடுக்கப்பட்டது.
