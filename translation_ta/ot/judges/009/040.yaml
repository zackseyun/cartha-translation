  text: Abimelech pursued him[a], and he fled before him; and many slain fell as far as the entrance of the gate.
translation:
  language: ta
  text: அபிமெலேக்கு அவனைத் துரத்தினான்; அவன் அபிமெலேக்கிடமிருந்து தப்பியோடினான். பலர் கொல்லப்பட்டு வாசலின் நுழைவிடம் வரை விழுந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பல கொல்லப்பட்டோர் வாசலின் நுழைவிடம் வரை விழுந்தார்கள்.” எபிரெயத்தில் போர்க்களத்தின் உயிரோட்டமான சொல்லாட்சியாக, “கொல்லப்பட்டோர்” என்பதுடன் “விழுந்தார்கள்” என வருகிறது.
