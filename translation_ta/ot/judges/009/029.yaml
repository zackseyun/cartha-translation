  - marker: b
    text: “உன் படையைப் பெருக்கு; வெளியே வா” என்ற சவால் அபிமெலேக்கை நோக்கிய ஏளனமாக இருக்கலாம்; அது அவனிடம் நேரடியாகச் சொல்லப்பட்டதா அல்லது சொல்லாட்சி முறையில் அவனை நோக்கிக் கூறப்பட்டதா என்பது தெளிவில்லை.
