  text: וּ/מִ֨י יִתֵּ֜ן אֶת הָ/עָ֤ם הַ/זֶּה֙ בְּ/יָדִ֔/י וְ/אָסִ֖ירָה אֶת אֲבִימֶ֑לֶךְ וַ/יֹּ֨אמֶר֙ לַ/אֲבִימֶ֔לֶךְ רַבֶּ֥ה צְבָאֲ/ךָ֖ וָ/צֵֽאָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/029.yaml
  text: If only this people were in my hand[a], then I would remove Abimelek. And he said to Abimelek[b], “Increase your army and come out!”
translation:
  language: ta
  text: இந்த மக்கள் என் கையில் இருந்தால் எவ்வளவு நன்றாயிருக்கும்![a] அப்போது அபிமெலேக்கை அகற்றிவிடுவேன். அவன் அபிமெலேக்கிடம்[b], “உன் படையைப் பெருக்கு; வெளியே வா!” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல் வடிவுக்கு நெருக்கமாக, “இந்த மக்களை என் கையில் யார் கொடுப்பார்? அப்போது அபிமெலேக்கை அகற்றிவிடுவேன்” என்றும் மொழிபெயர்க்கலாம். “யார் கொடுப்பார்?” என்பது எபிரெயத்தில் ஒரு விருப்பத்தை வெளிப்படுத்தும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: “உன் படையைப் பெருக்கு; வெளியே வா” என்ற சவால் அபிமெலேக்கை நோக்கிய ஏளனமாக இருக்கலாம்; அது அவனிடம் நேரடியாகச் சொல்லப்பட்டதா அல்லது சொல்லாட்சி முறையில் அவனை நோக்கிக் கூறப்பட்டதா என்பது தெளிவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִי יִתֵּן
  choice: இந்த மக்கள் மட்டும் என் கையில் இருந்தால்
  rationale: מִי יִתֵּן என்பது சொற்பொருளில் ‘யார் கொடுப்பார்?’ என்றாலும், இங்கு அது தீவிரமான விருப்பத்தை வெளிப்படுத்தும் எபிரெய மரபுத்தொடர். ‘...மட்டும் ... இருந்தால்’ என்பது அந்த விருப்பநிலையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: הָעָם הַזֶּה
  choice: இந்த மக்கள்
  rationale: עָם என்பது ஒருமை வடிவிலுள்ள கூட்டுப்பெயர்; சூழலில் குறிப்பிடப்படும் மக்களைக் குறிக்கிறது. ‘படை’ என்று மொழிபெயர்ப்பது பொருளைத் தேவையின்றிக் குறுக்கிவிடும்.
- source_word: בְּיָדִי
  choice: என் கையில்
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְאָסִירָה
  choice: அகற்றிவிடுவேன்
  rationale: Hiphil வடிவிலுள்ள סוּר ‘அகற்று’ என்று பரந்த பொருள் தருகிறது. கொல்லுதல், விரட்டுதல், பதவியிலிருந்து நீக்குதல் ஆகியவற்றில் எதையும் தேவையின்றித் தீர்மானிக்காமல் அச்சுறுத்தலின் திறந்த பொருளைப் பாதுகாக்கிறது.
- source_word: וַיֹּאמֶר לַאֲבִימֶלֶךְ
  choice: அவன் அபிமெலேக்கிடம் ... என்றான்
  rationale: לְ பொதுவாக உரையின் பெறுநரைக் குறிக்கிறது. சவால் நேரடியாகச் சொல்லப்பட்டதா அல்லது சொல்லாட்சி முறையில் அவனை நோக்கி விடப்பட்டதா என்பது சூழலில் தெளிவாகாததால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: רַבֶּה צְבָאֲךָ
  choice: உன் படையைப் பெருக்கிக்கொண்டு
  rationale: רבה என்ற கட்டளை வடிவம் எண்ணிக்கையையோ வலிமையையோ அதிகரிக்க அழைக்கிறது; צָבָא இங்கு இராணுவப் படையைக் குறிக்கிறது. ‘படையைப் பெருக்கு’ என்பது இயல்பான சவால் மொழி.
- source_word: וָצֵאָה
  choice: வெளியே வா
  rationale: יצא என்பதன் கட்டளை வடிவம் ‘வெளியே செல்/வா’ என்பதாகும். எதிரியைச் சண்டைக்கு அழைக்கும் சவாலில் ‘வெளியே வா’ என்பது இயல்பான தமிழ்.
