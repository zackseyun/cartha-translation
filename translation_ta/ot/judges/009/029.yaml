translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தின் விருப்ப மரபுத்தொடர் இயல்பான தமிழாக்கமாக முதன்மை உரையில் தரப்பட்டு, சொல் வடிவுக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. ‘அகற்றிவிடுவேன்’ என்பது அச்சுறுத்தலின் நோக்கத்தை மிகையாகத் தீர்மானிக்காமல் விடுகிறது.
