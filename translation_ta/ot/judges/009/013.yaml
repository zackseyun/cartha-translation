source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הַ/גֶּ֔פֶן הֶ/חֳדַ֨לְתִּי֙ אֶת תִּ֣ירוֹשִׁ֔/י הַֽ/מְשַׂמֵּ֥חַ אֱלֹהִ֖ים וַ/אֲנָשִׁ֑ים וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/013.yaml
  text: But the vine said to them[a], ‘Should I stop producing my new wine, which gladdens gods and men, and go to sway over the trees?’
translation:
  language: ta
  text: ஆனால் திராட்சைக்கொடி அவர்களிடம், “தெய்வங்களையும் மனிதர்களையும்[a] மகிழ்விக்கும் என் புதிய திராட்சரசத்தை உண்டாக்குவதை நான் நிறுத்திவிட்டு, மரங்களின்மேல் அசைந்தாடப் போவேனா?” என்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளையும் மனிதர்களையும்.”
    reason: אֱלֹהִים என்ற வடிவம் பன்மையாக இருந்தாலும், அது ஒருமையில் ‘கடவுள்’ என்றும் பொருள்பட முடியும்; உண்மையான மூலமொழி இருபொருள் வாய்ப்பைப் பேணுவதற்காக.
lexical_decisions:
- source_word: הַגֶּפֶן
  choice: திராட்சைக்கொடி
  rationale: யோதாமின் உவமையில் பேசும் தாவரத்தைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: הֶחֳדַלְתִּי
  choice: நான் நிறுத்திவிட்டு ... போவேனா?
  rationale: சூழலில் இது ஆலோசனைத் தன்மையுள்ள எதிர்மறை வினாவாகச் செயல்படுகிறது. தமிழில் பொருளுடன் இயல்பாக இணைய ‘உண்டாக்குவதை’ வெளிப்படையாக்கப்பட்டுள்ளது.
- source_word: תִּירוֹשִׁי
  choice: என் புதிய திராட்சரசம்
  rationale: תִּירוֹשׁ என்பதன் புதிய அல்லது இளமையான திராட்சரசம் என்ற வேளாண் நுணுக்கத்தைப் பேணுகிறது; ‘திராட்சைச் சாறு’ என்று மதுவின் சாத்தியத்தை நீக்கவில்லை.
- source_word: הַמְשַׂמֵּחַ
  choice: மகிழ்விக்கும்
  rationale: שׂמח என்பதன் ஹிஃபில் காரணவினைப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: אֱלֹהִים וַאֲנָשִׁים
  choice: தெய்வங்களையும் மனிதர்களையும்
  rationale: אֱלֹהִים என்பதன் வடிவியல் பன்மையையும் உவமையின் பண்டைய இலக்கியச் சூழலையும் முதன்மையாகப் பேணுகிறது; ஒருமை வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לָנוּעַ עַל הָעֵצִים
  choice: மரங்களின்மேல் அசைந்தாட
  rationale: கொடி அசையும் காட்சியையும் மரங்களின்மேல் அரசாளும் மறைபொருளையும் ஒரே நேரத்தில் சுட்டுகிறது; நேரடியாக ‘ஆட்சி செய்ய’ என்று மாற்றி உருவகத்தை அழிக்கவில்லை.
theological_decisions:
- issue: אֱלֹהִים என்பதை இவ்விடத்தில் பன்மையாகவா ஒருமையாகவா புரிந்துகொள்வது
  choice: தெய்வங்கள்
  alternative: கடவுள்
  rationale: எபிரெயச் சொல் வடிவியல் ரீதியாகப் பன்மையானது; இந்த உவமைச் சூழலில் தெய்வீகர்களையும் மனிதர்களையும் மகிழ்விக்கும் திராட்சரசம் என்ற வழக்குச் சொல்லாகப் புரிந்துகொள்ள இயலும். எனினும் இஸ்ரவேலின் கடவுளைக் குறிக்கும் ஒருமை வாசிப்பும் இலக்கண ரீதியாகச் சாத்தியமானதும் மொழிபெயர்ப்பு மரபில் பரவலானதும் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உவமைநடை பயன்படுத்தப்பட்டுள்ளது. ‘புதிய திராட்சரசம்’ மூலச்சொல்லின் வேளாண் நுணுக்கத்தைப் பேணுகிறது; ‘அசைந்தாட’ என்பது கொடியின் உடல் அசைவையும் அரசாட்சியின் உருவகத்தையும் திறந்த நிலையில் வைக்கிறது.
