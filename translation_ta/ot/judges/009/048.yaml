base_translation:
  language: en
  yaml_path: translation/ot/judges/009/048.yaml
  text: Then Abimelek went up Mount Zalmon[a], he and all the people who were with him. Abimelek took the axes in his hand, cut down a bundle of branches, lifted it, and put it on his shoulder. Then he said to the people who were with him, “What you have seen me do, hurry and do as I have done.”
translation:
  language: ta
  text: அபிமெலேக்கும் அவனோடு இருந்த மக்கள் அனைவரும் சல்மோன் மலைக்கு ஏறிச் சென்றார்கள். அபிமெலேக்கு கோடரிகளைத் தன் கையில் எடுத்தான்; மரக்கிளைகளின் ஒரு கொத்தை[a] வெட்டினான்; அதைத் தூக்கித் தன் தோள்மேல் வைத்தான். பின்பு அவன் தன்னோடு இருந்த மக்களிடம், “நான் செய்ததை நீங்கள் பார்த்தீர்களே; விரைந்து, என்னைப் போலவே செய்யுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “மரக்கிளை,” “மரப்புதர்,” அல்லது “சுள்ளிக்கட்டு.” இங்கு வரும் எபிரெயச் சொல் அரிதானது; அது கிளைகள் அல்லது புதர்ச்செடிகளின் ஒரு திரளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ஏறிச் சென்றார்கள்
  rationale: עלה என்பதன் மேல்நோக்கிய இயக்கத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; கூட்டு எழுவாய்க்கேற்ப பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַר צַלְמוֹן
  choice: சல்மோன் மலை
  rationale: இடப்பெயரை மொழிபெயர்க்காமல் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்த்து, הַר என்பதை ‘மலை’ என வழங்குகிறது.
- source_word: הוּא וְכָל־הָעָם אֲשֶׁר אִתּוֹ
  choice: அபிமெலேக்கும் அவனோடு இருந்த மக்கள் அனைவரும்
  rationale: עָם என்பதை ‘வீரர்கள்’ அல்லது ‘ஆண்கள்’ என்று குறுக்காமல் பொதுவான ‘மக்கள்’ என்றே வைத்திருக்கிறது; எபிரெய வலியுறுத்தலும் தக்கவைக்கப்படுகிறது.
- source_word: הַקַּרְדֻּמּוֹת בְּיָדוֹ
  choice: கோடரிகளைத் தன் கையில் எடுத்துக்கொண்டு
  rationale: கோடரிகள் என்ற இலக்கணப் பன்மையையும் ‘தன் கையில்’ என்ற மூலத்தின் ஒருமையையும் இயன்றவரை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיִּכְרֹת שׂוֹכַת עֵצִים
  choice: மரக்கிளைகளின் ஒரு கொத்தை வெட்டி
  rationale: அரிதான שׂוֹכָה என்பது கிளைகள் அல்லது புதர்ச்செடிகளின் திரளைச் சுட்டுகிறது. தோளில் சுமக்கக்கூடிய கிளைத்திரள் என்ற சூழலை ‘கொத்து’ இயல்பாக வெளிப்படுத்துகிறது; துல்லியமான வடிவம் உறுதியற்றதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: וַיִּשָּׂאֶהָ וַיָּשֶׂם עַל שִׁכְמוֹ
  choice: அதைத் தூக்கித் தன் தோள்மேல் வைத்தான்
  rationale: தூக்குதல், பின்னர் தோளில் வைத்தல் என்ற செயல்வரிசையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מָה רְאִיתֶם עָשִׂיתִי
  choice: நான் செய்ததை நீங்கள் பார்த்தீர்களே
  rationale: சுருக்கமான எபிரெய தொடரை இயல்பான தமிழில் வழங்கி, அவர்கள் கண்ட முன்மாதிரியைச் சுட்டுகிறது.
- source_word: מַהֲרוּ עֲשׂוּ כָמוֹנִי
  choice: விரைந்து, என்னைப் போலவே செய்யுங்கள்
  rationale: பன்மை கட்டளையின் அவசரத்தையும் כָמוֹנִי என்பதன் ‘என்னைப் போல’ என்ற நேரடியான ஒப்புமையையும் பாதுகாக்கிறது.
