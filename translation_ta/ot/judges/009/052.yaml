translation:
  language: ta
  text: அபிமெலேக்கு கோபுரம்வரை வந்து, அதற்கு எதிராகப் போரிட்டான். பின்னர் அதை நெருப்பால் எரிப்பதற்காகக் கோபுரத்தின் வாயில்வரை அணுகினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא ... עַד הַמִּגְדָּל
  choice: அந்தக் கோபுரம்வரை வந்து
  rationale: עַד என்பதன் எல்லை/அணுகல் உணர்வை இயல்பான தமிழில் காட்டுகிறது. நில அமைப்பு தெளிவாகக் கூறப்படாததால் ‘மேலே வந்தான்’ என்று சேர்க்கவில்லை.
- source_word: וַיִּלָּחֶם בּוֹ
  choice: அதைத் தாக்கினான்
  rationale: கோபுரத்திற்கு எதிரான தாக்குதலை இயல்பாக வெளிப்படுத்துகிறது; எபிரெய வினையின் போரிடுதல் என்ற வலிமையையும் சூழலில் காக்கிறது.
- source_word: פֶּתַח הַמִּגְדָּל
  choice: கோபுரத்தின் நுழைவாயில்
  rationale: פֶּתַח இங்கு கட்டிடத்திற்குள் செல்லும் திறப்பைச் சுட்டுவதால் ‘நுழைவாயில்’ தெளிவான நவீனத் தமிழ்.
- source_word: לְשָׂרְפוֹ בָאֵשׁ
  choice: அதைத் தீயிட்டுக் கொளுத்துவதற்காக
  rationale: எபிரெய மொழியின் நோக்கத்தையும் தீயால் எரித்தல் என்ற வலியுறுத்தலையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
