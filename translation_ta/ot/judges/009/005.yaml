translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தகப்பன்’ என்பது வேதாகம நடையின் பரிச்சயத்தையும் இயல்பையும் சமநிலைப்படுத்தப் பயன்படுத்தப்பட்டது; பெயர்கள் தமிழ் வேதாகம மரபுக்கு ஏற்ப ஒலிபெயர்க்கப்பட்டன.
