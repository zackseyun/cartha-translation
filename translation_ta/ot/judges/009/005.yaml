base_translation:
  language: en
  yaml_path: translation/ot/judges/009/005.yaml
  text: Then he went to his father’s house at Ophrah and killed his brothers[a], the sons of Jerubbaal—seventy men—on one stone. But Jotham, the youngest son of Jerubbaal, was left[c][b], because he hid himself.
translation:
  language: ta
  text: பின்பு அவன் ஒப்ராவிலுள்ள தன் தந்தையின் வீட்டிற்குச் சென்று, தன் சகோதரர்களாகிய யெருபாகாலின் மகன்கள் எழுபது பேரையும் ஒரே கல்லின்மேல் கொன்றான்.[a] ஆனால் யெருபாகாலின் இளைய மகனான யோதாம் ஒளிந்துகொண்டதால் உயிர்தப்பினான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒரே கல்லின்மேல்” என்பது, அவர்கள் அனைவரும் கொல்லப்பட்ட ஒரே கல்லையோ அல்லது ஒரே இடத்தையோ குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: எபிரெயத்தில், “மீதியாக இருந்தான்” அல்லது “விடப்பட்டான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא בֵית אָבִיו עָפְרָתָה
  choice: பின்பு அவன் ஒப்ராவில் இருந்த தன் தகப்பனுடைய வீட்டிற்குச் சென்று
  rationale: தொடர்கதை நகர்வை வாவ்-தொடர்ச்சிக்கேற்ப ‘பின்பு’ எனக் காட்டுகிறது. இடநோக்கிச் செல்லும் பொருளையும் ஒப்ரா என்ற இலக்கையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: וַיַּהֲרֹג
  choice: கொன்றான்
  rationale: வினையின் அடிப்படைப் பொருளைத் தருகிறது; மூலத்தில் இல்லாத சட்டரீதியான கூடுதல் நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: אֶת אֶחָיו בְּנֵי יְרֻבַּעַל שִׁבְעִים אִישׁ
  choice: தன் சகோதரர்களாகிய யெருபாகாலின் மகன்கள் எழுபது பேரையும்
  rationale: ‘சகோதரர்கள்’ என்பதையும், அவர்களை அடையாளப்படுத்தும் ‘யெருபாகாலின் மகன்கள்’ என்பதையும் தக்கவைத்து, எண்ணிக்கையைத் தெளிவாகக் கூறுகிறது.
- source_word: עַל אֶבֶן אֶחָת
  choice: ஒரே கல்லின்மேல்
  rationale: எபிரெயச் சொல்லாட்சியின் கடுமையான படிமத்தை விளக்கிச் சீராக்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיִּוָּתֵר
  choice: அவன் மட்டும் உயிர்தப்பினான்
  rationale: இந்தச் சூழலில் ‘மீதியாக விடப்பட்டான்/மீதியானான்’ என்பது உயிருடன் தப்பியதைக் குறிக்கிறது; இயல்பான தமிழுக்காகச் சூழற்பொருள் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: הַקָּטֹן
  choice: இளைய மகன்
  rationale: குடும்பச் சூழலில் ‘சிறியவன்’ என்பதன் இயல்பான வயதுசார் பொருள் ‘இளையவன்’ ஆகும்.
- source_word: כִּי נֶחְבָּא
  choice: ஒளிந்துகொண்டதால்
  rationale: யோதாம் உயிர்தப்பியதற்கான காரணத்தைத் தரும் தன்னிலை/இடைநிலைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
