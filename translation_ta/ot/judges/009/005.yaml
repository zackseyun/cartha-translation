revisions:
- from: பின்பு அவன் ஒப்ராவில் இருந்த தன் தகப்பனுடைய வீட்டிற்குச் சென்று, தன் சகோதரர்களாகிய யெருபாகாலின் மகன்கள் எழுபது பேரையும் ஒரே கல்லின்மேல் கொன்றான்.[a] ஆனால் யெருபாகாலின் இளைய மகன் யோதாம் ஒளிந்துகொண்டதால், அவன் மட்டும் உயிர்தப்பினான்.[b]
  to: பின்பு அவன் ஒப்ராவிலுள்ள தன் தந்தையின் வீட்டிற்குச் சென்று, தன் சகோதரர்களாகிய யெருபாகாலின் மகன்கள் எழுபது பேரையும் ஒரே கல்லின்மேல் கொன்றான்.[a] ஆனால் யெருபாகாலின் இளைய மகனான யோதாம் ஒளிந்துகொண்டதால் உயிர்தப்பினான்.[b]
  rationale: The revision preserves the Hebrew narrative and its stark ‘one stone’ imagery, improves modern Tamil flow, removes the unexpressed restrictive ‘only,’ and recasts the cultural note so that it does not characterize the killings as formal executions. The footnote for Jotham preserves the Hebrew’s ‘was left/remained’ wording while the main text naturally communicates survival in context.
