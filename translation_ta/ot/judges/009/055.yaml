base_translation:
  language: en
  yaml_path: translation/ot/judges/009/055.yaml
  text: When the men of Israel saw that Abimelech was dead[a], each went to his own place.
translation:
  language: ta
  text: அபிமெலேக்கு இறந்துவிட்டதை இஸ்ரவேல் ஆண்கள் கண்டபோது, ஒவ்வொருவரும் தத்தம் இடத்திற்குச் சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘இஸ்ரவேல் மனிதர்’ மற்றும் ‘ஒவ்வொருவனும் தன் இடத்துக்கு’ என்ற ஒருமை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. இவை குழுவில் இருந்தவர்கள் ஒவ்வொருவராகத் தங்கள் இடங்களுக்குச் சென்றதைக் குறிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: கண்டபோது
  rationale: ראה என்பதன் அடிப்படைப் பொருளான பார்த்து அறிதலைப் பேணுகிறது; இச்சூழலில் அடுத்த நிகழ்வுடன் இயல்பாக இணைக்க வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேல் ஆண்கள்
  rationale: אִישׁ ஒருமையில் இருந்தாலும் பன்மை வினைகள் இதைக் கூட்டுப் பொருளில் காட்டுகின்றன; ஆண்பாலைக் குறிக்கும் மூலத்தின் தன்மையையும் மொழிபெயர்ப்பு பேணுகிறது.
- source_word: כִּי
  choice: என்பதை
  rationale: 'அவர்கள் கண்டறிந்த செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது: அபிமெலேக்கு இறந்துவிட்டார் என்பது.'
- source_word: מֵת
  choice: இறந்துவிட்டதை
  rationale: அவர்கள் உணர்ந்தபோது அபிமெலேக்கு மரித்த நிலையில் இருந்ததை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: אֲבִימֶלֶךְ
  choice: அபிமெலேக்கு
  rationale: தனிப்பெயர் தமிழின் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்றவாறு தரப்பட்டுள்ளது.
- source_word: וַיֵּלְכוּ
  choice: சென்றார்கள்
  rationale: הלך என்பதன் எளிய நிகழ்வுரைச் சார்ந்த பொருளைப் பேணுகிறது; ‘திரும்பிச் சென்றார்கள்’ என்று மூலத்தில் இல்லாத கருத்தைச் சேர்க்கவில்லை.
- source_word: אִישׁ לִמְקֹמוֹ
  choice: ஒவ்வொருவரும் தத்தம் இடத்திற்குச் சென்றார்கள்
  rationale: பன்மைக் குழுவினரிடையே செயலைப் பகிர்ந்தளிக்கும் ஒருமை אִישׁ என்பதை ‘ஒவ்வொருவரும்’ என்றும், מָקוֹם என்பதை ‘வீடு’ எனக் குறுக்காமல் ‘இடம்’ என்றும் மொழிபெயர்க்கிறது.
