  yaml_path: translation/ot/judges/009/032.yaml
  text: Now then[a], arise by night, you and the people who are with you[b], and lie in wait in the field.
translation:
  language: ta
  text: இப்போது, நீ இரவில் எழுந்து, உன்னோடு இருக்கும் மக்களுடன் வயல்வெளியில் பதுங்கியிரு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வயல்வெளியில் மறைந்திருந்து தாக்கக் காத்திரு.” எபிரெய வினை, தாக்குவதற்காகப் பதுங்கிக் காத்திருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: முந்தைய ஆலோசனையிலிருந்து உடனடியான கட்டளைக்குச் செல்லும் இடைமாற்றத்தையும் அவசரத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: קוּם
  choice: எழுந்து
  rationale: קום என்பதன் ஆண்பால் ஒருமை கட்டளை வடிவத்தின் நேரடியான வலிமையைத் தக்கவைக்கிறது; தொடர்ந்து வரும் பன்மைக் குழுவையும் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: לַיְלָה
  choice: இரவில்
  rationale: இரவு நேரத்தில் செயல்படுவதைக் குறிக்கும் வினையடைப் பயன்பாடு; எபிரெயம் கட்டாயமாக ‘இன்றிரவு’ என்று வரையறுக்காததால் அதைத் தவிர்க்கிறது.
- source_word: אַתָּה וְהָעָם אֲשֶׁר אִתָּךְ
  choice: நீயும் உன்னோடு இருக்கிற மக்களும்
  rationale: வலியுறுத்தப்பட்ட ‘நீ’ என்பதையும் עָם என்பதன் பொதுவான ‘மக்கள்’ பொருளையும் தக்கவைக்கிறது; ‘படைவீரர்கள்’ என்று சூழலின் அடிப்படையில் மிகுதியாக விளக்கவில்லை.
- source_word: וֶאֱרֹב
  choice: பதுங்கியிருங்கள்
  rationale: தாக்குவதற்கு மறைந்து காத்திருக்கும் ארב என்பதன் நிலைப்பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; தாக்குதலே தொடங்கிவிட்டதாகக் காட்டாது.
- source_word: בַּשָּׂדֶה
  choice: வயல்வெளியில்
  rationale: שָׂדֶה என்பதன் ‘வயல்/திறந்த வெளி’ பொருளை இத்தந்திரச் சூழலில் இயல்பாகக் கொண்டுவருகிறது.
