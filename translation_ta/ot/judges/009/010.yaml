review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the narrative sequence, the trees as speakers, the fig tree as addressee, and the two feminine-singular imperatives. The explicit addressee pronoun is appropriately retained in Tamil as ‘நீ.’
  naturalness: ‘எங்களை ஆட்சி செய்’ is understandable, but ‘எங்கள்மேல் ஆட்சி செய்’ is the more idiomatic modern Tamil construction for reigning/ruling over people and more directly reflects עָלֵינוּ (‘over us’).
  terminology: ‘அத்திமரம்’ correctly identifies the fig tree, and ‘ஆட்சி செய்’ suitably conveys the royal-rule sense of מלך in this fable context.
  issues:
