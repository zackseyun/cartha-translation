    issue: Government of ‘ஆட்சி செய்’
    rationale: Modern standard Tamil normally uses ‘மேல்’ (or alternatively the verb ‘ஆள்’) for rule over subjects. Adding ‘மேல்’ improves idiomatic precision without changing meaning.
  revised_text: அப்போது மரங்கள் அத்திமரத்திடம், “நீ வந்து எங்கள்மேல் ஆட்சி செய்” என்றன.
