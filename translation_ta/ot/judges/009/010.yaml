- from: அப்போது மரங்கள் அத்திமரத்திடம், “நீ வந்து எங்களை ஆட்சி செய்” என்றன.
  to: அப்போது மரங்கள் அத்திமரத்திடம், “நீ வந்து எங்கள்மேல் ஆட்சி செய்” என்றன.
  rationale: The sole revision changes the case construction with ‘ஆட்சி செய்’ to the natural Tamil expression ‘எங்கள்மேல் ஆட்சி செய்,’ preserving the Hebrew sense of ruling over the trees.
