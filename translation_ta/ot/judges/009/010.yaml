id: JDG.9.10
reference: Judges 9:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ הָ/עֵצִ֖ים לַ/תְּאֵנָ֑ה לְכִי אַ֖תְּ מָלְכִ֥י עָלֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/010.yaml
  text: Then the trees said to the fig tree, ‘You come, reign over us.’
translation:
  language: ta
  text: அப்போது மரங்கள் அத்திமரத்திடம், “நீ வந்து எங்கள்மேல் ஆட்சி செய்” என்றன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அப்போது ... என்றன
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ அதன் தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது. பலவினப் பொருளான மரங்களுக்கு ஏற்ப ‘என்றன’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָעֵצִים
  choice: மரங்கள்
  rationale: இந்த உவமைக் கதையில் עֵצִים என்பது பேசும் மரங்களையே தெளிவாகக் குறிக்கிறது.
- source_word: לַתְּאֵנָה
  choice: அத்திமரத்திடம்
  rationale: תְּאֵנָה இங்கு பழத்தை அல்ல, அத்திமரத்தைக் குறிக்கிறது; ל என்பது பேச்சு செலுத்தப்படும் மறைமுகச் செயப்படுபொருளைக் குறிக்கிறது.
- source_word: לְכִי אַתְּ
  choice: நீ வந்து
  rationale: பெண்பால் ஒருமை கட்டளையான לְכִי மற்றும் வலியுறுத்தும் தனிப்பெயரான אַתְּ ஆகிய இரண்டையும் ‘நீ வந்து’ இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: מָלְכִי
  choice: ஆட்சி செய்
  rationale: מלך வினையின் பெண்பால் ஒருமை கட்டளை வடிவம் அரசராக ஆளுவதைக் குறிக்கிறது; தமிழில் ‘ஆட்சி செய்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: עָלֵינוּ
  choice: எங்களை
  rationale: מלך உடன் வரும் על ஆட்சிக்குட்பட்டவர்களைக் குறிக்கிறது; ‘எங்களை ஆட்சி செய்’ என்பது இயல்பான நவீனத் தமிழ் அமைப்பு.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான உவமைக் கதை நடை. எபிரெய உரையில் அத்திமரம் இலக்கணப் பெண்பாலாக இருப்பது தமிழில் தனியாகக் குறிக்கப்படவில்லை; ஆனால் ஒருமை நேர்முக அழைப்பான ‘நீ’ பாதுகாக்கப்பட்டுள்ளது.
