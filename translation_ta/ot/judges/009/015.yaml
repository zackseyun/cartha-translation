base_translation:
  language: en
  yaml_path: translation/ot/judges/009/015.yaml
  text: Then the bramble said to the trees[a], ‘If you are truly anointing me as king over you, come, take refuge in my shade; but if not[c][b], let fire come out from the bramble and consume the cedars of Lebanon.’
translation:
  language: ta
  text: அப்போது முட்புதர் மரங்களை நோக்கி, “நீங்கள் உண்மையாகவே என்னை உங்கள்மேல் அரசனாக அபிஷேகம் செய்கிறீர்கள் என்றால், வந்து என் நிழலில் அடைக்கலம் புகுங்கள்[a]. இல்லையென்றால், முட்புதரிலிருந்து நெருப்பு புறப்பட்டு[b] லெபனோனின் கேதுரு மரங்களை எரித்து அழிக்கட்டும்” என்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அடைக்கலம் புகுங்கள்” என்பதை “பாதுகாப்பை நாடுங்கள்” என்றும் மொழிபெயர்க்கலாம். முட்புதர் உண்மையில் மிகக் குறைந்த நிழலையே தருவதால், இச்சொற்களில் மறைநகை இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முட்புதரிலிருந்து நெருப்பு புறப்பட்டு ... எரித்து அழிக்கும்.” எபிரேய வினை வேண்டுதல் அல்லது சாபம் போன்ற பொருளிலும், நிகழப்போவதைச் சொல்லும் முன்னறிவிப்பாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָטָד
  choice: முட்புதர்
  rationale: முள் நிறைந்த புதர் அல்லது சிறுசெடியைக் குறிக்கும் எபிரேயச் சொல்லுக்கு இயல்பான பொதுத்தமிழ் இணை; உவமையில் உயர்ந்த மரங்களோடு உள்ள முரண்பாட்டையும் தெளிவாக வைத்திருக்கிறது.
- source_word: אִם בֶּאֱמֶת
  choice: நீங்கள் உண்மையாகவே ... என்றால்
  rationale: செயலின் நேர்மையையும் உண்மைத்தன்மையையும் சவாலிடும் நிபந்தனையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֹשְׁחִים אֹתִי לְמֶלֶךְ
  choice: என்னை உங்களுக்கு அரசனாக அபிஷேகம் செய்கிறீர்கள்
  rationale: משׁח என்பதன் அபிஷேகம் செய்யும் அரசியல்-அரசாட்சிப் படிமத்தைப் பொதுவான நியமனமாகத் தளர்த்தாமல் பாதுகாக்கிறது.
- source_word: בֹּאוּ חֲסוּ בְצִלִּי
  choice: வந்து என் நிழலில் அடைக்கலம் புகுங்கள்
  rationale: அணுகி பாதுகாப்பை நாடும் இரு கட்டளைகளையும் தக்கவைக்கிறது; மிகக் குறைவான நிழலே தரக்கூடிய முட்புதரைப் பற்றிய மறைநகையும் நீடிக்கிறது.
- source_word: וְאִם אַיִן
  choice: இல்லையென்றால்
  rationale: முந்தைய நிபந்தனை நிறைவேறாதபோது வரும் எதிர்விளைவைத் தெளிவான நவீன தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: תֵּצֵא אֵשׁ מִן הָאָטָד
  choice: முட்புதரிலிருந்து நெருப்பு புறப்பட்டு
  rationale: நெருப்பு புதரிலிருந்து வெளிவரும் மூலப்படிமத்தைப் பாதுகாக்கிறது; வினையின் வேண்டுதல்/சாபம் போன்ற நுணுக்கம் இறுதியில் வரும் ‘அழிக்கட்டும்’ என்பதில் வெளிப்படுகிறது.
- source_word: וְתֹאכַל
  choice: எரித்து அழிக்கட்டும்
  rationale: நெருப்பு ‘உண்பது’ என்ற எபிரேய மரபுத்தொடரின் பொருளான முற்றாக எரித்தழித்தலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אַרְזֵי הַלְּבָנוֹן
  choice: லெபனோனின் கேதுரு மரங்கள்
  rationale: லெபனோனோடு தொடர்புடைய மகத்தான cedar மரங்களைச் சுட்டும் நிலையான வேதாகமப் பெயர்ப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: תֵּצֵא என்பதன் விதம்
  choice: ‘அழிக்கட்டும்’ என வேண்டுதல் அல்லது சாபம் போன்ற வலிமையுடன் மொழிபெயர்த்தல்
  alternative: ‘நெருப்பு புறப்பட்டு ... அழிக்கும்’ என்ற முன்னறிவிப்பாக மொழிபெயர்த்தல்
  rationale: எபிரேய imperfect இங்கு jussive போன்ற வேண்டுதல்/சாபப் பொருளாகவும் சாதாரண எதிர்கால முன்னறிவிப்பாகவும் புரிந்துகொள்ளப்படலாம்; முதன்மை உரை முதலாவதைக் காட்டுகிறது, அடிக்குறிப்பு மாற்றுப் புரிதலைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அபிஷேகம்’, ‘அடைக்கலம்’, ‘கேதுரு’ ஆகியவை மூலத்தின் அரசியல், பாதுகாப்பு, தாவரவியல் படிமங்களைத் தக்கவைக்கின்றன; முட்புதரின் நிழலைப் பற்றிய உவமையின் மறைநகை விளக்கமின்றியே முதன்மை உரையில் நிலைக்கிறது.
