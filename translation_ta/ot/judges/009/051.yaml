id: JDG.9.51
reference: Judges 9:51
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/מִגְדַּל עֹז֮ הָיָ֣ה בְ/תוֹךְ הָ/עִיר֒ וַ/יָּנֻ֨סוּ שָׁ֜מָּ/ה כָּל הָ/אֲנָשִׁ֣ים וְ/הַ/נָּשִׁ֗ים וְ/כֹל֙ בַּעֲלֵ֣י הָ/עִ֔יר וַֽ/יִּסְגְּר֖וּ בַּעֲדָ֑/ם וַֽ/יַּעֲל֖וּ עַל גַּ֥ג הַ/מִּגְדָּֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/051.yaml
  text: But there was a strong tower in the middle of the city[a], and all the men and women and all the leaders of the city fled there and shut themselves in[b], and they went up onto the roof of the tower.
translation:
  language: ta
  text: நகரின் நடுவில் வலுவான ஒரு கோபுரம்[a] இருந்தது. ஆண்கள், பெண்கள், நகரின் தலைவர்கள்[b] ஆகிய அனைவரும் அங்கே தப்பியோடி, தங்களை உள்ளே அடைத்துக்கொண்டு, கோபுரத்தின் கூரையின்மேல் ஏறினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அரணாக்கப்பட்ட ஒரு கோபுரம்.’ எபிரெயச் சொற்றொடர் ‘கோபுரம்’ என்பதுடன் ‘வலிமை’ என்பதையும் இணைத்து, அதன் பாதுகாப்புத் தன்மையை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொற்படியாக, ‘நகரின் உரிமையாளர்கள்’ அல்லது ‘நகரின் எஜமானர்கள்.’ இச்சொற்றொடர் நகரின் முதன்மையானவர்களைக் குறிக்கலாம்; அது நகரவாசிகள் அனைவரையும் அவசியமாகக் குறிப்பதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֹז
  choice: வலுவான ஒரு கோபுரம்
  rationale: מִגְדַּל என்பது ‘கோபுரம்’; עֹז அதன் வலிமையையும் பாதுகாப்புத் தன்மையையும் வலியுறுத்துகிறது. ‘வலுவான கோபுரம்’ என்பது உருவகமாக்காமல் நேரடியான கட்டடத்தைக் குறிக்கும் இயல்பான தமிழ்.
- source_word: בְּתוֹךְ הָעִיר
  choice: நகரின் நடுவில்
  rationale: בְּתוֹךְ என்பதன் ‘நடுவில்/மத்தியில்’ என்ற இடவியல் பொருளைத் துல்லியமாகப் பேணுகிறது.
- source_word: וַיָּנֻסוּ שָׁמָּה
  choice: அங்கே தப்பியோடி
  rationale: נוּס என்பது ஆபத்திலிருந்து தப்பியோடுதலைக் குறிக்கிறது. அடைக்கலம் தேடிய நோக்கம் சூழலில் இருந்தாலும், அதை வினையில் கூடுதலாகச் சேர்க்கவில்லை.
- source_word: כָּל הָאֲנָשִׁים וְהַנָּשִׁים
  choice: ஆண்கள், பெண்கள் ஆகிய அனைவரும்
  rationale: எபிரெய உரை ஆண்களையும் பெண்களையும் தனித்தனியாகக் குறிப்பிடுவதால் இரண்டையும் வெளிப்படையாகப் பேணுகிறது.
- source_word: וְכֹל בַּעֲלֵי הָעִיר
  choice: நகரின் தலைவர்கள் அனைவரும்
  rationale: בַּעֲלֵי என்பதன் நேரடிப் பொருள் ‘உரிமையாளர்கள்/எஜமானர்கள்’; இக்குடிமைச் சூழலில் அது நகரின் முதன்மையானவர்களையோ தலைவர்களையோ குறிக்கும் மரபுத்தொடராகப் புரிகிறது. ‘தலைவர்கள்’ இயல்பான தமிழில் அந்தச் சூழற்பொருளை வழங்குகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּסְגְּרוּ בַעֲדָם
  choice: தங்களை உள்ளே அடைத்துக்கொண்டு
  rationale: இத்தொடர் சொற்படியாக ‘தங்களுக்குப் பின்னால் மூடினர்’ எனப் பொருள்படும். எபிரெயத்தில் இல்லாத ‘கதவு’ என்ற பொருளைச் சேர்க்காமல், தங்களைப் பாதுகாப்பாக உள்ளே அடைத்துக்கொண்ட செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיַּעֲלוּ עַל גַּג הַמִּגְדָּל
  choice: கோபுரத்தின் கூரையின்மேல் ஏறினார்கள்
  rationale: עָלָה என்பது ‘மேலே ஏறு/செல்’; גַּג என்பது பொதுவான ‘உச்சி’ அல்ல, குறிப்பாக ‘கூரை’. இரு கூறுகளையும் மொழிபெயர்ப்பு பேணுகிறது.
