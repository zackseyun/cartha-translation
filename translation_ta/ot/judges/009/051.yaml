translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் அமைக்கப்பட்டது. நிகழ்வுகளின் வேகத்தைப் பேண தொடர் வினை அமைப்பு பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்கு உடனே பின்வருகின்றன.
