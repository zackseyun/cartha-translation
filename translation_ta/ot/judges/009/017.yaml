  text: because my father fought for you[a], cast his life in front of him[b], and delivered you from the hand of Midian.
translation:
  language: ta
  text: ஏனெனில், என் தந்தை உங்களுக்காகப் போரிட்டு, தன் உயிரையே பணயம் வைத்து[a], மீதியானியரின் கையிலிருந்து[b] உங்களை விடுவித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “தன் உயிரை முன்னே எறிந்தார்”; அதாவது, உயிருக்கு நேரக்கூடிய ஆபத்தையும் பொருட்படுத்தவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மீதியானியரின் அதிகாரத்திலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: என் தந்தை
  rationale: இது முந்தைய வசனத்தோடு இணையும் தொடர்புச் சொல். தனியாகக் கொடுக்கப்பட்ட இவ்வசனத்தில் இயல்பான தமிழுக்காக அதைத் தனியே மொழிபெயர்க்காமல், தொடரின் காரணத்தை விளக்கும் உட்பிரிவாக அமைத்துள்ளோம்.
- source_word: נִלְחַם ... עֲלֵיכֶם
  choice: உங்களுக்காகப் போரிட்டு
  rationale: இங்கு עַל எதிராக என்பதைக் குறிக்காமல், மக்களின் நன்மைக்காக அல்லது அவர்கள் சார்பாக என்பதைக் குறிக்கிறது; அடுத்துவரும் மீட்புச் செயலும் இதை உறுதிப்படுத்துகிறது.
- source_word: וַיַּשְׁלֵךְ אֶת־נַפְשׁוֹ מִנֶּגֶד
  choice: தன் உயிரையே பணயம் வைத்து
  rationale: சொல்லுக்குச் சொல் பார்த்தால் ‘தன் உயிரை முன்னே எறிந்தார்’ என்ற எபிரெயச் சொற்றொடர்; உயிருக்கு நேரக்கூடிய ஆபத்தைப் பொருட்படுத்தாமல் செயல்பட்டார் என்பதே அதன் இயல்பான பொருள்.
- source_word: וַיַּצֵּל
  choice: விடுவித்தார்
  rationale: Hiphil வடிவிலுள்ள נצל ஒருவரை ஆபத்து அல்லது ஆதிக்கத்திலிருந்து மீட்பது/விடுவிப்பது என்று பொருள்படும்; இராணுவச் சூழலுக்கு ‘விடுவித்தார்’ பொருத்தமானது.
- source_word: מִיַּד מִדְיָן
  choice: மீதியானியரின் கையிலிருந்து
  rationale: ‘கை’ என்பது அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய மரபுத்தொடர். அதைப் புரிந்துகொள்ளக்கூடிய வேதாகமத் தமிழில் தக்கவைத்துள்ளோம்.
