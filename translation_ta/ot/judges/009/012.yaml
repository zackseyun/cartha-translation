translation_notes:
  register: நவீன நிலையான தமிழில், உவமைக் கதையின் எளிமையையும் நபராக்கத்தையும் காக்கும் கண்ணியமான நடை. ‘அரசாள்’ என்பது பேச்சுவழக்குச் சுருக்கமின்றி அரச ஆட்சியின் பொருளைத் தெளிவாகத் தருகிறது.
