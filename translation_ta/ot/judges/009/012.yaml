  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ הָ/עֵצִ֖ים לַ/גָּ֑פֶן לְכִי אַ֖תְּ מלוכי עָלֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/012.yaml
  text: Then the trees said to the vine[a], ‘Come, reign over us.’
translation:
  language: ta
  text: அப்போது மரங்கள் திராட்சைக்கொடியிடம், “வா, எங்களை அரசாள்[a]” என்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “போ, நீ எங்கள்மேல் அரசாளு.” எபிரெய மரபுத்தொடர் தமிழில் இயல்பாக, “வா, எங்களை அரசாள்” எனக் கொடுக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அப்போது ... என்றன
  rationale: வாவ் தொடர் வடிவம் கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது. நவீன தமிழில் ‘அப்போது’ இயல்பாக அந்த வரிசையை வெளிப்படுத்துகிறது; பன்மையான ‘மரங்கள்’ என்பதற்கேற்ப ‘என்றன’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָעֵצִים
  choice: மரங்கள்
  rationale: யோதாமின் உவமைக் கதைச் சூழலில் עֵץ என்பதன் பன்மை மரங்களையே குறிக்கிறது; மரப்பொருளையோ பொதுவான தாவரங்களையோ அல்ல.
- source_word: לַגָּפֶן
  choice: திராட்சைக்கொடியிடம்
  rationale: גֶּפֶן என்பது திராட்சைக்கொடியைக் குறிக்கிறது. பேசப்படுகிற நபராக்கப்பட்ட கொடியைத் தமிழில் இயல்பாகக் காட்ட ‘-இடம்’ வேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְכִי
  choice: வா
  rationale: הלך என்பதன் அடிப்படைப் பொருள் ‘போ/நட’ என்றாலும், அடுத்த கட்டளையுடன் வரும் இந்த அழைப்பு மரபுத்தொடர் தமிழில் இயல்பாக ‘வா’ என அமைகிறது.
- source_word: אַתְּ
  choice: கட்டளையில் மறைமுகமாக உள்ள ‘நீ’
  rationale: எபிரெயத்தில் இது பெண்பால் ஒருமைச் சுட்டுப்பெயர்; திராட்சைக்கொடியின் இலக்கணப் பாலுடன் ஒத்துள்ளது. தமிழில் ஒருமைக் கட்டளை வினையே எழுவாயைத் தெளிவாக்குவதால் ‘நீ’ என்பதை வெளிப்படையாகச் சேர்க்கத் தேவையில்லை.
- source_word: מְלֹכִי
  choice: அரசாள்
  rationale: מלך என்பதன் பெண்பால் ஒருமைக் கட்டளை வடிவம் அரசராக ஆட்சி செய்வதைக் குறிக்கிறது. ‘அரசாள்’ அரச அதிகாரத்தின் நுணுக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: עָלֵינוּ
  choice: எங்களை
  rationale: מלך உடன் வரும் עַל ஆட்சிக்குட்பட்டவர்களைக் குறிக்கிறது. தமிழில் ‘எங்களை அரசாள்’ என்பது இயல்பான வினை அமைப்பு; சொற்சொல்லான ‘எங்கள்மேல்’ என்பதும் சாத்தியம்.
