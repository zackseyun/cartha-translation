  terminology: “திராட்சைக்கொடி” precisely represents גֶּפֶן. “அரசாள்” is an apt dignified imperative for royal rule, without importing interpretive or denominational content. The footnote correctly identifies the more literal alternative and explains the idiomatic rendering.
