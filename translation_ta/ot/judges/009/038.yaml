base_translation:
  language: en
  yaml_path: translation/ot/judges/009/038.yaml
  text: Then Zebul said to him[a], “Where is your mouth now, you who said, ‘Who is Abimelech, that we should serve him?’ Is this not the people whom you despised? Go out now and fight against them.”
translation:
  language: ta
  text: அப்போது செபூல் அவனிடம், “இப்போது உன் வாய் எங்கே?[a] ‘அபிமெலேக்கு யார், நாம் அவனுக்குப் பணிசெய்வதற்கு?’ என்று சொன்னவன் நீதானே! நீ இகழ்ந்த மக்கள் இவர்கள்தானே? இப்போதே வெளியே போய் அவர்களோடு போரிடு” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன் வாய் எங்கே?” என்பது எபிரெய மொழியின் சொற்சொல்லான வடிவம்; முன்பு வீரமாகப் பேசிய பேச்சு இப்போது எங்கே போனது என்று கேலி செய்வதே இதன் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה אֵפוֹא פִיךָ
  choice: இப்போது உன் வாய் எங்கே?
  rationale: எபிரெய மொழியின் உயிரோட்டமான கேலிப் பேச்சை நேரடியாகத் தக்கவைக்கிறது; இதன் இடியோமப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: אֲשֶׁר תֹּאמַר
  choice: என்று சொன்னவன் நீதானே
  rationale: முன்பு சவால் விட்டவனையே நேரடியாகச் சுட்டி, செபூலின் குத்தலான தொனியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִי אֲבִימֶלֶךְ כִּי נַעַבְדֶנּוּ
  choice: அபிமெலேக்கு யார், நாம் அவனுக்குப் பணிசெய்வதற்கு?
  rationale: இகழ்ச்சியும் மறுப்பும் நிறைந்த வினாவை நெருக்கமாகப் பாதுகாக்கிறது; עבד என்பதற்கு இச்சூழலில் ‘பணிசெய்’ இயல்பானது.
- source_word: הֲלֹא זֶה הָעָם
  choice: மக்கள் இவர்கள்தானே?
  rationale: எதிர்பார்க்கப்படும் உடன்பாட்டை வலியுறுத்தும் சொல்லாட்சியையும், எதிரே காணப்படும் மக்களைச் சுட்டும் தன்மையையும் காக்கிறது.
- source_word: מָאַסְתָּה בּוֹ
  choice: நீ இகழ்ந்த
  rationale: מאס இங்கு நிராகரிப்போடு கலந்த அவமதிப்பை உணர்த்துவதால், சவாலான சூழலுக்கு ‘இகழ்ந்த’ பொருந்துகிறது.
- source_word: צֵא נָא עַתָּה
  choice: இப்போதே வெளியே போய்
  rationale: נא-வின் தூண்டுதல் வலிமையை மரியாதையான ‘தயவுசெய்து’ என மாற்றாமல், ‘இப்போதே’ என்பதன் மூலம் தருகிறது.
- source_word: וְהִלָּחֶם בּוֹ
  choice: அவர்களோடு போரிடு
  rationale: בו இலக்கணத்தில் ஒருமையாக இருந்தாலும், அதன் முன்னிலைச் சொல் கூட்டுப் பெயரான ‘மக்கள்’; தமிழில் குறிக்கப்படும் படையினரை இயல்பாகப் பன்மையில் குறிப்பிடுகிறது.
