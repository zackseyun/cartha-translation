  register: நவீனத் தரத் தமிழில், போர்க்களக் கேலியின் கூர்மையையும் நேரடித் தொனியையும் தக்கவைக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. பெயர்கள் ‘செபூல்’, ‘அபிமெலேக்கு’ என ஒலிபெயர்க்கப்பட்டுள்ளன.
