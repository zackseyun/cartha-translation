  source_fidelity: மூல எபிரெயத்தின் கேலித் தொனி, முன் கூறிய சவாலை மீளுரைப்பது, “இந்த மக்கள்” என்ற சுட்டல், மற்றும் உடனடிப் போர்க்கட்டளை ஆகியவை நம்பகமாகக் காக்கப்பட்டுள்ளன. בּוֹ இலக்கணத்தில் ஒருமையாக இருந்தாலும், הָעָם என்ற கூட்டுப் பெயரைக் குறிக்கிறது; “அவர்களோடு போரிடு” என்பது தமிழில் அந்தப் படைவீரர் கூட்டத்தைக் குறிக்கும் இயல்பான பயன்பாடு.
  naturalness: நவீனத் தரத் தமிழில் வசனம் தெளிவாகவும் போர்க்களக் கேலிக்குரிய நேரடித் தொனியுடனும் உள்ளது. “இப்போது உன் வாய் எங்கே?” என்ற சொற்சொல்லான கேள்வி தமிழிலும் புரியக்கூடிய கேலிப் பயன்பாடாக உள்ளது; அதன் இடியோமப் பொருளை அடிக்குறிப்பு போதுமானவாறு விளக்குகிறது.
  terminology: செபூல், அபிமெலேக்கு ஆகிய பெயரொலிபெயர்ப்புகள் தொடர்ச்சியாக உள்ளன. “இகழ்ந்த,” “பணிசெய்வதற்கு,” “போரிடு” ஆகிய சொற்கள் மூலத்தின் இகழ்ச்சி, கீழ்ப்படிதல், போரிடுதல் ஆகிய பொருள்களுக்கு ஏற்றவை.
