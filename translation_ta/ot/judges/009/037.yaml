  register: நவீனத் தரத் தமிழில், காட்சியை நேரில் சுட்டிக்காட்டும் உரையாடல் தொனியும் நீதிபதிகள் நூலுக்கேற்ற கண்ணியமான கதைநடையும் பேணப்பட்டுள்ளன. மூலமொழியில் உறுதியற்ற மரவகையும் இடப்பெயர் விளக்கமும் முதன்மை உரையில் தீர்மானிக்கப்பட்டதாகக் காட்டப்படாமல் அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளன.
