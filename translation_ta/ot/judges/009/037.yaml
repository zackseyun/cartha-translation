source:
  edition: WLC
  text: וַ/יֹּ֨סֶף ע֣וֹד גַּעַל֮ לְ/דַבֵּר֒ וַ/יֹּ֕אמֶר הִנֵּה עָם֙ יֽוֹרְדִ֔ים מֵ/עִ֖ם טַבּ֣וּר הָ/אָ֑רֶץ וְ/רֹאשׁ אֶחָ֣ד בָּ֔א מִ/דֶּ֖רֶךְ אֵל֥וֹן מְעוֹנְנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/037.yaml
  text: Gaal spoke again and said[a], “Look, people are coming down from the center of the land[b], and one company is coming by the way of the Oak of the Soothsayers.”
translation:
  language: ta
  text: 'கால் மீண்டும் பேசினான்: “இதோ, மக்கள் நிலத்தின் நடுப்பகுதியிலிருந்து[a] இறங்கி வருகிறார்கள்; ஒரு பிரிவு குறிசொல்பவர்களின் பெருமரத்தின் வழியாக வருகிறது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேர்ப்பொருளாக, “நிலத்தின் தொப்புளிலிருந்து”; இது நிலத்தின் மையப்பகுதியைக் குறிக்கும் மொழிமரபு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד גַּעַל לְדַבֵּר
  choice: காகால் மீண்டும் பேசி
  rationale: ‘மேலும் மறுபடியும் பேசச் சேர்த்தான்’ என்ற எபிரெய மொழிமரபை இயல்பான நவீனத் தமிழில் ‘மீண்டும் பேசி’ என்று வழங்குகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: பார்ப்பவரின் கவனத்தை உடனடியாக ஈர்க்கும் மூலமொழியின் சுட்டும் வலிமையை இயல்பாகப் பேணுகிறது.
- source_word: עָם יֹרְדִים
  choice: மக்கள் ... இறங்கி வருகிறார்கள்
  rationale: עָם என்பதன் பொதுவான ‘மக்கள்’ என்ற பொருளைத் தக்கவைத்து, நடந்துகொண்டிருக்கும் கீழ்நோக்கிய இயக்கத்தை பார்ப்பவரின் நோக்கிலிருந்து தெரிவிக்கிறது.
- source_word: מֵעִם טַבּוּר הָאָרֶץ
  choice: நாட்டின் நடுப்பகுதியிலிருந்து
  rationale: טַבּוּר என்பதன் நேர்ப்பொருள் ‘தொப்புள்’; நிலவியல் மொழிமரபில் அது நாட்டின் மையம் அல்லது நடுப்பகுதியைக் குறிக்கிறது. உருவகத்தை அடிக்குறிப்பில் பேணியபடி பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וְרֹאשׁ אֶחָד
  choice: ஒரு பிரிவு
  rationale: רֹאשׁ என்பதன் நேர்ப்பொருள் ‘தலை’; இங்கு அணுகிவரும் மக்களில் தனியான ஓர் அணியையோ பிரிவையோ குறிக்கிறது. ‘படைப்பிரிவு’ என்று கூறுவது மூலச்சொல்லைவிட இராணுவப் பொருளை அதிகமாக்கும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: מִדֶּרֶךְ
  choice: இருக்கும் வழியாக
  rationale: குறிப்பிட்ட இடக்குறியை ஒட்டிச் செல்லும் பாதை அல்லது திசையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֵלוֹן
  choice: பெருமரம்
  rationale: இச்சொல் கருவாலி அல்லது டெரிபிந்த் போன்ற பெரிய மரத்தைக் குறிக்கலாம்; துல்லியமான மரவகை உறுதியற்றதால் பொதுவான ‘பெருமரம்’ தேர்ந்தெடுக்கப்பட்டு மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: מְעוֹנְנִים
  choice: குறிசொல்பவர்கள்
  rationale: இது குறிசொல்லுதல் அல்லது சகுனம் பார்த்தல் தொடர்பான சொல்லாகப் புரிந்துகொள்ளப்படுகிறது; எனினும் இங்கு இடப்பெயரின் பகுதியாக இருக்கக்கூடும் என்பதால் அந்த ஐயம் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
