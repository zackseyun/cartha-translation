translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான கதையாடல் நடையில் மொழிபெயர்க்கப்பட்டது. அரிதான கட்டிடவியல் சொல்லுக்கு மிகத் தொழில்நுட்பமான பதத்தைத் தவிர்த்து ‘பாதுகாப்பு அறை’ பயன்படுத்தப்பட்டது. ‘அவர்கள்மேல்’ என்ற எபிரெய இடவியல் கூறு தமிழில் புரியும்படி ‘உள்ளே இருந்தவர்கள்மேல்’ என வழங்கப்பட்டது.
