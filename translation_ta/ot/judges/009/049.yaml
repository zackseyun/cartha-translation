base_translation:
  language: en
  yaml_path: translation/ot/judges/009/049.yaml
  text: So all the people also cut down a branch each[a], and they went after Abimelech and piled them against the inner chamber, and set the inner chamber on fire over them, so that all the people of the tower of Shechem also died[b], about a thousand men and women.
translation:
  language: ta
  text: அப்போது மக்கள் எல்லாரும் ஆளுக்கு ஒரு கிளையை வெட்டிக்கொண்டு, அபிமெலேக்கைப் பின்தொடர்ந்தார்கள். அவர்கள் அந்த உட்புற அடைக்கலத்தின்[அ] மீது அவற்றைக் குவித்து, அதில் இருந்தவர்கள்மேல் அந்த அடைக்கலத்துக்குத் தீ வைத்தார்கள். இவ்வாறு சீகேம் கோபுரத்தைச் சேர்ந்த அனைவரும்—ஆண்களும் பெண்களுமாக ஏறக்குறைய ஆயிரம் பேர்—இறந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: அ
    text: எபிரெயச் சொல் கோபுரத்துக்குள் இருந்த அடைக்கலமான உட்புறப் பகுதி, அறை, அல்லது அரணான பகுதியைக் குறிக்கலாம்; இதன் துல்லியமான கட்டிடவியல் பொருள் உறுதியில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ ... אִישׁ שׂוֹכֹה
  choice: ஆளுக்கு ஒரு கிளையை வெட்டிக்கொண்டு
  rationale: ‘ஒவ்வொருவரும் தமக்கென ஒரு கிளை’ என்ற பகிர்வுப் பொருளையும் ஒருமை ‘கிளை’ என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיֵּלְכוּ אַחֲרֵי אֲבִימֶלֶךְ
  choice: அபிமெலேக்கைப் பின்தொடர்ந்தார்கள்
  rationale: எபிரெய ‘அவருக்குப் பின்னால் சென்றார்கள்’ என்பது இங்கு அவரது செயலைப் பின்பற்றியதைக் குறிக்கிறது; ‘பின்தொடர்ந்தார்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַצְּרִיחַ
  choice: பாதுகாப்பு அறை
  rationale: இச்சொல் கோபுரம் முழுவதையும் அல்லாமல், அதற்குள் அடைக்கலமாக இருந்த பாதுகாப்பான உட்பகுதியைக் குறிக்கலாம்; பின்னர் வரும் מִגְדַּל (‘கோபுரம்’) என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: וַיָּשִׂימוּ עַל הַצְּרִיחַ
  choice: அவற்றை அந்தப் பாதுகாப்பு அறைக்கு எதிராகக் குவித்து
  rationale: தீ வைப்பதற்காக கிளைகளை அந்தக் கட்டமைப்பின்மீது அல்லது அதனை ஒட்டி வைத்த செயலைச் சூழலுக்கேற்ற தமிழில் கூறுகிறது.
- source_word: וַיַּצִּיתוּ עֲלֵיהֶם אֶת הַצְּרִיחַ בָּאֵשׁ
  choice: உள்ளே இருந்தவர்கள்மேல் அந்த அறைக்குத் தீ வைத்தார்கள்
  rationale: עֲלֵיהֶם என்பதன் ‘அவர்கள்மேல்’ என்ற இடவியல் வலிமையைப் பாதுகாக்கிறது; அவர்கள் அறைக்குள் இருந்தது உடனடிச் சூழலால் தெளிவாகிறது.
- source_word: אַנְשֵׁי מִגְדַּל שְׁכֶם
  choice: சீகேம் கோபுரத்தைச் சேர்ந்த மக்கள்
  rationale: אַנְשֵׁי இலக்கணரீதியாக ஆண்பால் வடிவமானாலும், அடுத்து ‘ஆண்களும் பெண்களும்’ என வருவதால் இங்கு கோபுரத்துடன் தொடர்புடைய அனைவரையும் குறிக்கும் ‘மக்கள்’ பொருத்தமானது.
- source_word: כְּאֶלֶף אִישׁ וְאִשָּׁה
  choice: ஆண்களும் பெண்களுமாக ஏறக்குறைய ஆயிரம் பேர்
  rationale: כְּ முன்னொட்டின் தோராயப் பொருளையும், இருபாலரும் உயிரிழந்ததையும் தெளிவாகப் பாதுகாக்கிறது.
