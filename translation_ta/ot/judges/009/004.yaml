base_translation:
  language: en
  yaml_path: translation/ot/judges/009/004.yaml
  text: And they gave him seventy pieces of silver from the house of Baal-berith[a], and with them Abimelek hired worthless and reckless men[c][b], and they followed him.
translation:
  language: ta
  text: அவர்கள் பாகால்-பெரீத்தின் வீட்டிலிருந்து[a] எழுபது வெள்ளிக்காசுகளை[b] அவனுக்குக் கொடுத்தார்கள். அவற்றைக் கொண்டு அபிமெலேக்கு பயனற்றவர்களும் கட்டுப்பாடற்றவர்களுமான மனிதர்களைக்[c] கூலிக்கு அமர்த்தினான்; அவர்கள் அவனைப் பின்பற்றினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாகால்-பெரீத்தின் ஆலயத்திலிருந்து.” எபிரெயத்தில் “வீடு” என்று உள்ளது; வழிபாட்டுச் சூழலில் அது ஆலயம் அல்லது வழிபாட்டிடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எழுபது வெள்ளிச் சேக்கல்கள்.” எபிரெயத்தில் நேரடியாக “எழுபது வெள்ளி” என்று உள்ளது; இது எடையின் அடிப்படையில் கூறப்பட்ட பண மதிப்பு.
    reason: lexical_alternative
  - marker: c
    text: நேரடியாக, “வெறுமையானவர்களும் கட்டுப்பாடற்றவர்களுமான மனிதர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעִים כֶּסֶף
  choice: எழுபது வெள்ளிக்காசுகள்
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘எழுபது வெள்ளி’ என்று கூறி, எடையின் அடிப்படையிலான பண மதிப்பைக் குறிக்கிறது. ‘வெள்ளிக்காசுகள்’ என்பது இயல்பான தமிழில் பணத்தைக் குறிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘சேக்கல்’ என்ற அலகை முதன்மை உரையில் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: מִבֵּית בַּעַל בְּרִית
  choice: பாகால்-பெரீத்தின் ஆலயத்திலிருந்து
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருள் ‘வீடு’; ஆனால் இங்குள்ள வழிபாட்டுச் சூழலில் அது கோவில் அல்லது வழிபாட்டிடம் எனப் பொருள்படுகிறது. நவீன தமிழில் ‘ஆலயம்’ அந்தக் கருத்தைத் தெளிவாகத் தருகிறது; ‘பாகால்-பெரீத்’ பெயர் ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיִּשְׂכֹּר בָּהֶם
  choice: அவற்றைக் கொண்டு ... கூலிக்கு அமர்த்தினான்
  rationale: בָּהֶם என்பது முன்கூறிய வெள்ளியைப் பயன்படுத்தியதைக் குறிக்கிறது. ‘அவற்றைக் கொண்டு’ அந்தக் கருவிப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; שׂכר என்பதற்கு ‘கூலிக்கு அமர்த்தினான்’ பொருத்தமானது.
- source_word: אֲנָשִׁים רֵיקִים
  choice: பயனற்ற ... மனிதர்கள்
  rationale: רֵיקִים என்பதன் நேரடிப் பொருள் ‘வெறுமையானவர்கள்’; இங்கு சமூக மற்றும் ஒழுக்க மதிப்பில்லாதவர்களைக் குறிக்கிறது. ‘பயனற்ற’ என்பது மூல உருவகத்தை முழுவதும் சொற்சொல்லாக மாற்றாமல் அதன் மதிப்பீட்டுச் சக்தியைத் தருகிறது.
- source_word: וּפֹחֲזִים
  choice: துணிகரமான
  rationale: இந்தச் சொல் கட்டுப்பாடற்ற, அவசரமான, பொறுப்பற்ற நடத்தையைக் குறிக்கலாம். ‘துணிகரமான’ என்பது இச்சூழலில் ஆபத்தைப் பொருட்படுத்தாத அடாவடியான தன்மையைத் தருகிறது; மாற்று நேரடிப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: וַיֵּלְכוּ אַחֲרָיו
  choice: அவர்கள் அவனைப் பின்பற்றினார்கள்
  rationale: நேரடியாக ‘அவனுக்குப் பின்னால் சென்றார்கள்’ என்றாலும், இங்கு அவர்கள் அபிமெலேக்கின் ஆதரவாளர்களாக இணைந்ததைக் குறிக்கிறது. ‘பின்பற்றினார்கள்’ இந்தச் சூழல்பொருளை இயல்பாகத் தருகிறது.
