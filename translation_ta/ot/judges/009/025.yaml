base_translation:
  language: en
  yaml_path: translation/ot/judges/009/025.yaml
  text: Then the leaders of Shechem set men in ambush for him on the tops of the mountains[a], and they robbed everyone who passed by them on the road; and it was reported to Abimelech.
translation:
  language: ta
  text: அப்போது சீகேமின் தலைவர்கள்[a] அவனுக்கு எதிராக மலை உச்சிகளில் பதுங்கியிருக்க ஆட்களை நியமித்தார்கள். அவர்கள் சாலையில் தங்களைக் கடந்து சென்ற ஒவ்வொருவரையும் கொள்ளையடித்தார்கள். இது அபிமெலேக்குக்கு அறிவிக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீகேமின் குடிமக்கள்” அல்லது “சீகேமின் பிரபுக்கள்.” எபிரெயத்தில் உள்ள சொல் நேரடியாக “சீகேமின் உரிமையாளர்கள்/அதிகாரமுள்ளவர்கள்” என்ற பொருளுடையது; இச்சூழலில் அது நகரத்தின் தலைவர்களையோ அதிகாரம் கொண்டவர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַעֲלֵי שְׁכֶם
  choice: சீகேமின் தலைவர்கள்
  rationale: בַעֲלֵי என்பதன் அடிப்படைப் பொருள் உரிமையாளர்கள் அல்லது அதிகாரம் உடையவர்கள்; இங்கு நகரின் செல்வாக்கும் அதிகாரமும் கொண்டவர்களைக் குறிக்கிறது. இயல்பான நவீன தமிழில் அதன் குடிமை-அரசியல் பொருளை ‘தலைவர்கள்’ தெரிவிக்கிறது.
- source_word: וַיָּשִׂימוּ לוֹ מְאָרְבִים
  choice: அவனுக்கு எதிராக ... பதுங்கியிருப்பவர்களை நிறுத்தினார்கள்
  rationale: שׂים, לוֹ, மற்றும் ஆண்பால் பன்மைப் பங்கேற்பு வடிவமான מְאָרְבִים ஆகியவை அபிமெலேக்குக்கு எதிராகப் பதுங்கித் தாக்க ஆட்களை நிலைநிறுத்தியதைச் சுட்டுகின்றன; ‘எதிராக’ என்பது சூழலின் பகைமை நோக்கை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל רָאשֵׁי הֶהָרִים
  choice: மலை உச்சிகளில்
  rationale: சொல்லெழுத்தாக ‘மலைகளின் தலைகளின்மேல்’; ‘மலை உச்சிகளில்’ என்பது உயரமான பதுங்கிடத்தைத் துல்லியமாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: וַיִּגְזְלוּ
  choice: கொள்ளையடித்தார்கள்
  rationale: גזל வன்முறையாகப் பறித்தல் அல்லது வழிப்பறி செய்தலைக் குறிக்கிறது. சாலையில் பயணித்தவர்களைத் தாக்கிய இச்சூழலுக்கு ‘கொள்ளையடித்தார்கள்’ பொருத்தமானது.
- source_word: אֵת כָּל אֲשֶׁר יַעֲבֹר עֲלֵיהֶם בַּדָּרֶךְ
  choice: சாலையில் தங்களைக் கடந்து சென்ற ஒவ்வொருவரையும்
  rationale: כָּל உடன் வரும் ஒருமை வினை பகிர்ந்தளிக்கும் பொருளில் ஒவ்வொரு பயணியையும் குறிக்கிறது; தமிழ் சொற்றொடர் அந்தப் பொருளையும் வழிப்பாதைச் சூழலையும் தெளிவாகக் காக்கிறது.
- source_word: וַיֻּגַּד לַאֲבִימֶלֶךְ
  choice: இது அபிமெலேக்குக்கு அறிவிக்கப்பட்டது
  rationale: நிகழ்த்துபவர் குறிப்பிடப்படாத Hophal செயப்பாட்டு வடிவத்தைத் தமிழிலும் செயப்பாட்டு அமைப்பால் காக்கிறது.
