  text: וְ/אַתֶּ֞ם קַמְתֶּ֨ם עַל בֵּ֤ית אָבִ/י֙ הַ/יּ֔וֹם וַ/תַּהַרְג֧וּ אֶת בָּנָ֛י/ו שִׁבְעִ֥ים אִ֖ישׁ עַל אֶ֣בֶן אֶחָ֑ת וַ/תַּמְלִ֜יכוּ אֶת אֲבִימֶ֤לֶךְ בֶּן אֲמָת/וֹ֙ עַל בַּעֲלֵ֣י שְׁכֶ֔ם כִּ֥י אֲחִי/כֶ֖ם הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/018.yaml
  text: But you have risen up against my father's house today[a], and you killed his sons, seventy men, on one stone, and you made Abimelek, the son of his female servant, king over the leaders of Shechem, because he is your brother.
translation:
  language: ta
  text: ஆனால் நீங்களோ இன்று என் தந்தையின் குடும்பத்திற்கு எதிராக எழுந்து, அவருடைய எழுபது மகன்களை ஒரே கல்லின்மேல் கொன்றீர்கள்; அவருடைய பணிப்பெண்ணின் மகனான அபிமெலேக்கை, அவன் உங்கள் சகோதரன் என்பதற்காக, சீகேமின் தலைவர்கள்மேல் அரசனாக்கினீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பணிப்பெண்” என்பதை “அடிமைப் பெண்” என்றும் மொழிபெயர்க்கலாம். “வைப்பாட்டியின் மகன்” என்பது சூழல் சார்ந்த விளக்க மொழிபெயர்ப்பு; எபிரெயச் சொல் நேரடியாகப் பெண் பணியாளர் அல்லது அடிமைப் பெண்ணைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַמְתֶּם עַל
  choice: எதிராக எழும்பி
  rationale: பகைமையான எதிர்ப்பைக் குறிக்கும் எபிரெயச் சொற்றொடரின் உருவகத்தையும் குற்றஞ்சாட்டும் வலிமையையும் காக்கிறது.
- source_word: בֵּית אָבִי
  choice: என் தந்தையின் குடும்பத்தார்
  rationale: இங்கு ‘வீடு’ என்பது கட்டடத்தை அல்ல, தந்தையின் குடும்பத்தையும் வம்சத்தையும் குறிக்கிறது; தமிழில் பொருள் தெளிவாக இருக்க ‘குடும்பத்தார்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: யோதாமின் உரையில் நிகழ்காலச் சந்தர்ப்பத்துக்கு அளிக்கப்படும் கால அழுத்தத்தை நேரடியாகக் காக்கிறது.
- source_word: וַתַּהַרְגוּ
  choice: கொன்றுபோட்டீர்கள்
  rationale: கொலை செய்ததை வலுவாகவும் இயல்பாகவும் கூறுகிறது; மூல வினை வெளிப்படையாகத் தராத சட்டரீதியான ‘படுகொலை’ என்ற தீர்ப்பைச் சேர்க்கவில்லை.
- source_word: בָּנָיו שִׁבְעִים אִישׁ
  choice: அவருடைய மகன்களாகிய எழுபது பேரையும்
  rationale: பின்னொட்டு தந்தையைக் குறிப்பதாகப் புரிந்துகொண்டு, எண்ணப்பட்டவர்கள் ஆண்கள் என்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל אֶבֶן אֶחָת
  choice: ஒரே கல்லின்மேல்
  rationale: கூட்டுக் கொலையின் கொடூரமான இடச்சித்திரத்தை மூலத்துக்கு நெருக்கமாகக் காக்கிறது.
- source_word: וַתַּמְלִיכוּ
  choice: அரசனாக்கினீர்கள்
  rationale: ‘ஒருவனை அரசனாகச் செய்தல்’ என்ற எபிரெய causative வினையின் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: בֶּן אֲמָתוֹ
  choice: அவருடைய பணிப்பெண்ணின் மகன்
  rationale: אָמָה என்பதன் பெண் பணியாளர்/அடிமைப் பெண் என்ற அடிப்படைப் பொருளை ‘மறுமனைவி’ என மிகையாக விளக்காமல், நவீன தமிழில் வாசிக்கத்தக்க வகையில் தருகிறது.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: சீகேமின் தலைவர்கள்
  rationale: நகரத்தின் அதிகாரமுள்ள குடிமக்கள் அல்லது தலைமை வகிப்பவர்களைக் குறிக்கும் அரசியல்-சமூகப் பொருளைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: כִּי אֲחִיכֶם הוּא
  choice: உங்கள் சகோதரன் என்பதற்காக
  rationale: அவர்களின் செயலைத் தூண்டிய காரணத்தையும் யோதாமின் குற்றச்சாட்டிலுள்ள நையாண்டித் தொனியையும் காக்கிறது.
theological_decisions:
- issue: அபிமெலேக்கின் தாயைக் குறிக்கும் אֲמָתוֹ என்பதிலுள்ள சமூக நிலை நுட்பம்
  choice: முதன்மை உரையில் ‘பணிப்பெண்’
  alternative: ‘அடிமைப் பெண்’; சூழலை விளக்கி ‘மனைவிக்குரிய முழு உரிமை பெறாத பெண்’
  rationale: எபிரெயப் பெயர்ச்சொல் பெண் பணியாளர் அல்லது அடிமைப் பெண்ணைக் குறிக்கிறது. ‘மறுமனைவி/வைப்பாட்டி’ என்று மொழிபெயர்ப்பது கதையின் சூழலிலிருந்து பெறப்படும் விளக்கம்; சொல்லின் நேரடிப் பொருள் அல்ல. ஆகவே நேரடிப் பொருள் முதன்மை உரையிலும் சமூக நிலையின் மாற்று நுட்பம் அடிக்குறிப்பிலும் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. குடும்ப-வம்சப் பொருளுக்காக ‘வீடு’ என்பதற்குப் பதில் ‘குடும்பத்தார்’ பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் குற்றஞ்சாட்டும் தொனியும் ‘ஒரே கல்லின்மேல்’ என்ற கடுமையான காட்சியும் காக்கப்பட்டுள்ளன.
