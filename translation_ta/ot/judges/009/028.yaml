translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. அரசியல் கீழ்ப்படிதலைக் குறிக்கும் עבד என்பதற்கு வசனம் முழுவதும் “பணிசெய்” என்ற ஒரே சொல்லாட்சி வைக்கப்பட்டுள்ளது. “சீகேம் யார்?” என்ற அசாதாரணமான ஆனால் மூலத்துக்கு நெருக்கமான வினா, ஆகுபெயர் சார்ந்த தெளிவின்மையைப் பாதுகாக்கிறது.
