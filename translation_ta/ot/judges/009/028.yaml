source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר גַּ֣עַל בֶּן עֶ֗בֶד מִֽי אֲבִימֶ֤לֶךְ וּ/מִֽי שְׁכֶם֙ כִּ֣י נַעַבְדֶ֔/נּוּ הֲ/לֹ֥א בֶן יְרֻבַּ֖עַל וּ/זְבֻ֣ל פְּקִיד֑/וֹ עִבְד֗וּ אֶת אַנְשֵׁ֤י חֲמוֹר֙ אֲבִ֣י שְׁכֶ֔ם וּ/מַדּ֖וּעַ נַעַבְדֶ֥/נּוּ אֲנָֽחְנוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/028.yaml
  text: And Gaal son of Ebed said[a], “Who is Abimelek, and who is Shechem, that we should serve him? Is he not the son of Jerubbaal, and Zebul his officer? Serve the men of Hamor[c][b], the father of Shechem! But why should we serve him?”
translation:
  language: ta
  text: 'ஏபெத்தின் மகன் காகால் சொன்னான்: “அபிமெலேக்கு யார்? சீகேம் யார்[a]? நாம் அவனுக்குப் பணிசெய்ய வேண்டுமா? அவன் யெருபாகாலின் மகனும், செபூல் அவனுடைய அதிகாரியும்தானே[b]? சீகேமின் தந்தையான ஏமோரின் ஆட்களுக்குப்[c] பணிசெய்யுங்கள்! ஆனால் நாம் ஏன் அவனுக்குப் பணிசெய்ய வேண்டும்?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சீகேம் யார்?” என்பதற்கு “சீகேம் என்பது என்ன?” என்றும் பொருள் கொள்ளலாம். எபிரெய உரை சீகேம் என்ற பெயரை நேரடியாகக் குறிப்பிடுகிறது; அது நகரத்தையோ அதன் ஆளும் சமூகத்தையோ ஆகுபெயராகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அதிகாரி” என்பதை “துணை அதிகாரி” அல்லது “நியமிக்கப்பட்ட பொறுப்பாளர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, ஏமோரின் வழிவந்தவர்கள் அல்லது அவரோடு தொடர்புடைய மக்கள். சீகேமின் தந்தை அல்லது மூதாதை என நினைவுகூரப்படும் ஏமோரைப் பற்றி ஆதியாகமம் 34-ஐப் பார்க்கவும்.
    reason: cross_reference
lexical_decisions:
- source_word: מִי אֲבִימֶלֶךְ וּמִי שְׁכֶם
  choice: அபிமெலேக்கு யார்? சீகேம் யார்?
  rationale: מִי என்ற ஆளைக் கேட்கும் வினாவையும், அபிமெலேக்கு மற்றும் சீகேம் ஆகிய இரு பெயர்களை நேரடியாகச் சவாலிடும் இகழ்ச்சித் தொனியையும் பாதுகாக்கிறது. சீகேம் என்பது நகரையோ அதன் ஆளும் சமூகத்தையோ ஆகுபெயராகக் குறிக்கலாம்; அதை உரையிலேயே விளக்கித் தீர்மானிக்கவில்லை.
- source_word: כִּי נַעַבְדֶנּוּ
  choice: நாம் அவனுக்குப் பணிசெய்ய வேண்டுமா?
  rationale: இங்கு עבד சாதாரண உழைப்பை விட அரசியல் கீழ்ப்படிதல் அல்லது ஆட்சிச் சேவையைக் குறிக்கிறது. தமிழில் கேள்வி வடிவம் இகழ்ச்சியுடன் கூடிய மறுப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הֲלֹא בֶן יְרֻבַּעַל וּזְבֻל פְּקִידוֹ
  choice: அவன் யெருபாகாலின் மகனும், செபூல் அவனுடைய அதிகாரியும்தானே?
  rationale: הֲלֹא எதிர்பார்க்கப்படும் ஒப்புதலைக் கோரும் வினா; “தானே” அதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. இணைக்கப்பட்ட இரு கூற்றுகளையும் எபிரெய அமைப்புக்கு நெருக்கமாக வைத்திருக்கிறது.
- source_word: פְּקִידוֹ
  choice: அவனுடைய அதிகாரி
  rationale: நியமிக்கப்பட்ட கீழ்நிலை நிர்வாகி அல்லது பொறுப்பாளர் என்ற பரப்பைத் தருகிறது; செபூலின் பதவியை ஆதாரத்தை மீறிக் குறிப்பாக்கவில்லை.
- source_word: עִבְדוּ אֶת אַנְשֵׁי חֲמוֹר
  choice: ஏமோரின் ஆட்களுக்குப் பணிசெய்யுங்கள்
  rationale: பன்மை கட்டளையின் கூர்மையைப் பாதுகாக்கிறது. אַנְשֵׁי என்பதை “ஆட்கள்” என்று நெருக்கமாக மொழிபெயர்த்து, வம்சத்தாரா அல்லது தொடர்புடைய சமூகமா என்பதை உரையில் தீர்மானிக்காமல் விடுகிறது.
- source_word: וּמַדּוּעַ נַעַבְדֶנּוּ אֲנָחְנוּ
  choice: ஆனால் நாம் ஏன் அவனுக்குப் பணிசெய்ய வேண்டும்?
  rationale: וּமுன்னொட்டு இங்கு உச்சக்கட்ட எதிர்மறைச் சவாலை அறிமுகப்படுத்துவதால் “ஆனால்” பொருத்தமானது. வெளிப்படையாக வரும் אֲנָחְנוּ என்பதன் அழுத்தத்தை “நாம்” மூலம் வைத்திருக்கிறது.
