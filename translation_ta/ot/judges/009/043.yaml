  naturalness: திருத்தப்பட்ட உரை நவீன நிலையான தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘மூன்று அணிகளாக’ என்பது இராணுவச் சூழலை உணர்த்தினாலும், ‘படைப்பிரிவுகள்’ என்பதைவிட மூலத்தின் பரந்த ‘பிரிவுகள்/தலைகள்’ என்ற பொருளுக்கு நெருக்கமாக உள்ளது.
  terminology: ‘பதுங்கிக் காத்திருந்தான்,’ ‘எதிராக எழுந்து,’ ‘தாக்கி வீழ்த்தினான்’ ஆகியவை பொருத்தமானவை. ரָאשִׁים என்ற எபிரேய மரபுத்தொடருக்கான விளக்க அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
