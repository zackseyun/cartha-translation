  text: וַ/יִּקַּ֣ח אֶת הָ/עָ֗ם וַֽ/יֶּחֱצֵ/ם֙ לִ/שְׁלֹשָׁ֣ה רָאשִׁ֔ים וַ/יֶּאֱרֹ֖ב בַּ/שָּׂדֶ֑ה וַ/יַּ֗רְא וְ/הִנֵּ֤ה הָ/עָם֙ יֹצֵ֣א מִן הָ/עִ֔יר וַ/יָּ֥קָם עֲלֵי/הֶ֖ם וַ/יַּכֵּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/043.yaml
  text: He took the people[a], divided them into three companies, and lay in wait in the field. When he saw that the people were coming out of the city, he rose up against them and struck them down.
translation:
  language: ta
  text: அவன் மக்களை அழைத்துக்கொண்டு, அவர்களை மூன்று அணிகளாகப் பிரித்து, வயல்வெளியில் பதுங்கிக் காத்திருந்தான். நகரத்திலிருந்து மக்கள் வெளியே வந்துகொண்டிருப்பதை அவன் கண்டதும், அவர்களுக்கு எதிராக எழுந்து அவர்களைத் தாக்கி வீழ்த்தினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח אֶת־הָעָם
  choice: அவன் தன் ஆட்களை அழைத்துக்கொண்டு
  rationale: עָם என்பதன் அடிப்படைப் பொருள் ‘மக்கள்’; இங்கு இராணுவச் சூழலில் அது அபிமெலேக்கின் கீழிருந்த ஆட்களைக் குறிக்கிறது. இயல்பான தமிழுக்காக ‘தன் ஆட்களை’ என மொழிபெயர்க்கப்பட்டது; இதற்கான நேரடி மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיֶּחֱצֵם לִשְׁלֹשָׁה רָאשִׁים
  choice: அவர்களை மூன்று படைப்பிரிவுகளாகப் பிரித்து
  rationale: חצה என்பது ‘பிரி’ என்று பொருள். ‘மூன்று தலைகளாக’ என்ற நேரடிப் பொருளுடைய רָאשִׁים இங்கு குழுக்கள் அல்லது படைப்பிரிவுகளைக் குறிக்கும் எபிரேய மரபுத்தொடர்; இராணுவச் சூழலுக்கு ‘படைப்பிரிவுகள்’ பொருத்தமானது.
- source_word: וַיֶּאֱרֹב בַּשָּׂדֶה
  choice: வயல்வெளியில் பதுங்கிக் காத்திருந்தான்
  rationale: ארב மறைந்திருந்து தாக்குவதற்காகக் காத்திருப்பதைக் குறிக்கிறது. ‘பதுங்கிக் காத்திருந்தான்’ என்பது அந்தச் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; שׂדה இங்கு திறந்த வயல்வெளியைக் குறிக்கிறது.
- source_word: וַיַּרְא וְהִנֵּה
  choice: அவன் கண்டதும்
  rationale: וְהִנֵּה காட்சியின் திடீர் கவனிப்பையும் உயிரோட்டத்தையும் தருகிறது. தமிழில் மரப்போல ‘இதோ’ என்று சேர்க்காமல், தொடர்ச்சியான நிகழ்வாக ‘கண்டதும்’ எனக் கொடுக்கப்பட்டது.
- source_word: הָעָם יֹצֵא מִן־הָעִיר
  choice: நகரத்திலிருந்து மக்கள் வெளியே வந்துகொண்டிருப்பதை
  rationale: יֹצֵא என்ற பங்கேற்புவினை கவனிக்கப்பட்டபோது நடந்துகொண்டிருந்த செயலைக் காட்டுகிறது; ஆகவே ‘வந்துகொண்டிருப்பதை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיָּקָם עֲלֵיהֶם
  choice: அவர்களுக்கு எதிராக எழுந்து
  rationale: קום על என்பது ‘ஒருவருக்கு எதிராக எழு’ என்றும் சூழலின்படி ‘தாக்கு’ என்றும் பொருள்படும். எபிரேய உருவகத்தைப் பாதுகாக்க ‘எதிராக எழுந்து’ எனக் கொடுக்கப்பட்டது.
- source_word: וַיַּכֵּם
  choice: அவர்களைத் தாக்கி வீழ்த்தினான்
  rationale: נכה என்பது தாக்குதல், அடித்தல், தோற்கடித்தல் ஆகிய பொருட்களை உடையது; அவசியமாக எல்லாரையும் கொன்றதாகச் சொல்லாது. ‘தாக்கி வீழ்த்தினான்’ அதன் தீர்மானமான வன்முறையை வெளிப்படுத்தினாலும், ‘கொன்றான்’ என்று மிகைப்படுத்தாது.
