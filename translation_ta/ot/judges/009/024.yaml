base_translation:
  language: en
  yaml_path: translation/ot/judges/009/024.yaml
  text: so that the violence done to the seventy sons of Jerubbaal might come[a], and their blood be laid on Abimelech their brother, who killed them, and on the leaders of Shechem[c][b], who strengthened his hands to kill his brothers.
translation:
  language: ta
  text: யெருபாகாலின் எழுபது மகன்களுக்கு இழைக்கப்பட்ட வன்முறை வரவும், அவர்களுடைய இரத்தம்[a] அவர்களைக் கொன்ற அவர்களுடைய சகோதரன் அபிமெலேக்கின்மேலும், அவன் தன் சகோதரர்களைக் கொல்ல அவனுடைய கைகளை வலுப்படுத்திய[c] சீகேமின் தலைவர்களின்மேலும்[b] சுமத்தப்படவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களுடைய இரத்தம் ... சுமத்தப்படவும்” என்பது, அவர்கள் கொல்லப்பட்டதற்கான குற்றமும் பொறுப்பும் சம்பந்தப்பட்டவர்கள்மேல் சுமத்தப்படுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சீகேமின் அதிகாரமிக்க மனிதர்கள்”; எபிரெயச் சொல் நகரத்தின் முதன்மையான அல்லது அதிகாரம் செலுத்திய மனிதர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “அவனுடைய கைகளை வலுப்படுத்திய” என்பது, அவனுக்கு ஆதரவளித்து அவனைத் துணிவூட்டியதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָבוֹא
  choice: வந்தடையவும்
  rationale: ל prefixed infinitive expresses purpose or result in continuity with the preceding verse. ‘வந்தடைய’ preserves the Hebrew image of the violent wrong reaching those responsible without over-specifying how.
- source_word: חֲמַס שִׁבְעִים בְּנֵי יְרֻבָּעַל
  choice: யெருபாகாலின் எழுபது மகன்களுக்கு இழைக்கப்பட்ட வன்முறை
  rationale: חמס denotes violence or violent wrong. The dative-like relation to the seventy sons is made natural and explicit in Tamil while retaining ‘வன்முறை’ rather than reducing it to a general injustice.
- source_word: וְדָמָם לָשׂוּם עַל
  choice: அவர்களுடைய இரத்தம் ... மேல் சுமத்தப்படவும்
  rationale: The concrete blood imagery and the idiom of placing responsibility upon someone are retained. A footnote explains that this denotes accountability for bloodshed.
- source_word: אֲבִימֶלֶךְ אֲחִיהֶם
  choice: அவர்களுடைய சகோதரன் அபிமெலேக்
  rationale: The apposition identifies Abimelech as the slain men's brother; Tamil word order makes this relationship clear and rhetorically direct.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: சீகேமின் தலைவர்கள்
  rationale: Here בעלי refers to the city's principal men or power-holders. ‘தலைவர்கள்’ is natural modern Tamil and avoids suggesting ownership, while the alternative literal-social nuance is noted.
- source_word: חִזְּקוּ אֶת יָדָיו
  choice: அவனுடைய கைகளை வலுப்படுத்திய
  rationale: The Hebrew hand-strengthening idiom is preserved in the text; a footnote gives its contextual sense of supporting or backing him.
- source_word: לַהֲרֹג אֶת אֶחָיו
  choice: அவன் தன் சகோதரர்களைக் கொல்வதற்கு
  rationale: The infinitive of purpose is represented directly. ‘சகோதரர்கள்’ accurately refers to the male siblings in context, and ‘கொல்’ does not add a more specific legal classification than the Hebrew verb.
theological_decisions:
- issue: சிந்தப்பட்ட இரத்தத்திற்கான பொறுப்பைக் குறிக்கும் உருவகம்
  choice: ‘அவர்களுடைய இரத்தம் ... மேல் சுமத்தப்படவும்’ என்ற உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘அவர்களுடைய இரத்தப்பழி ... மீது சுமத்தப்படவும்’ அல்லது ‘அவர்களுடைய இரத்தத்திற்காகப் பழிவாங்கப்படவும்’
  rationale: The Hebrew speaks concretely of ‘their blood’ being placed upon the perpetrators and supporters. Retaining that image preserves its judicial and theological force without deciding whether the emphasis is guilt, liability, or retribution; the footnote clarifies the idiom.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வசனத்தின் நோக்கம்/விளைவைக் தொடர்வதால், தமிழில் தனியே வாசிக்க உதவ இறுதியில் ‘இவ்வாறு நிகழ்ந்தது’ சேர்க்கப்பட்டுள்ளது; இது புதிய நிகழ்வைச் சேர்க்காமல் எபிரெய நோக்கத் தொடரை நிறைவு செய்கிறது. ‘இரத்தம் சுமத்தப்படுதல்’ மற்றும் ‘கைகளை வலுப்படுத்துதல்’ போன்ற மூலமொழி உருவகங்கள் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
