  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. வசனம் எளிதில் புரியும்படி இருந்தாலும், எபிரெய மூலத்தின் ‘கோபம் எரிதல்’ உருவகம் பாதுகாக்கப்பட்டுள்ளது; நவீன நிர்வாகப் பதவியைக் குறிக்கும் அளவுக்கு שַׂר மிகையாகத் துல்லியப்படுத்தப்படவில்லை.
