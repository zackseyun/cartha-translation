source:
  edition: WLC
  text: וַ/יִּשְׁמַ֗ע זְבֻל֙ שַׂר הָ/עִ֔יר אֶת דִּבְרֵ֖י גַּ֣עַל בֶּן עָ֑בֶד וַ/יִּ֖חַר אַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/030.yaml
  text: When Zebul[a], the ruler of the city, heard the words of Gaal son of Ebed, his anger burned.
translation:
  language: ta
  text: நகரத்தின் தலைவனான செபூல், ஏபேத்தின் மகன் காலின் வார்த்தைகளைக் கேட்டபோது, அவனுடைய கோபம் பற்றியெரிந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவனுடைய மூக்கு எரிந்தது”; இது அவன் கோபமடைந்தான் அல்லது அவனுடைய கோபம் மூண்டது என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: கேட்டபோது
  rationale: שׁמע இங்கு காகாலின் பேச்சைக் கேட்டறிந்ததைக் குறிக்கிறது; தொடர் நிகழ்வைக் காட்டும் எபிரெய வினை வடிவம் தமிழில் இயல்பாகக் காலத் துணைவாக்கியமாக மொழிபெயர்க்கப்படுகிறது.
- source_word: זְבֻל
  choice: செபூல்
  rationale: தனிப்பெயர் எபிரெய உச்சரிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שַׂר הָעִיר
  choice: நகரத்தின் தலைவன்
  rationale: שַׂר என்பது தலைவர், ஆளுநர், அதிகாரி போன்ற பரந்த பொருளுடைய சொல். குறிப்பிட்ட நவீன நிர்வாகப் பதவியைத் திணிக்காமல், செபூலின் நகர அதிகாரத்தை இயல்பாகக் காட்ட ‘தலைவன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶת דִּבְרֵי
  choice: வார்த்தைகளை
  rationale: דִּבְרֵי என்பதன் நேரடியான கருத்தான ‘வார்த்தைகள்’ பாதுகாக்கப்படுகிறது; தமிழிலும் இச்சூழலில் இது இயல்பாக உள்ளது.
- source_word: גַּעַל בֶּן עָבֶד
  choice: ஏபேதின் மகன் காகால்
  rationale: பெயர்கள் எபிரெய வடிவங்களிலிருந்து ஒலிபெயர்க்கப்பட்டு, தந்தை-மகன் உறவு தமிழின் இயல்பான உடைமைத் தொடரால் தரப்பட்டுள்ளது.
- source_word: וַיִּחַר אַפּוֹ
  choice: அவனுடைய கோபம் பற்றியெரிந்தது
  rationale: சொல்லுக்கு சொல் ‘அவனுடைய மூக்கு எரிந்தது’ எனும் எபிரெய மரபுத்தொடர் கடும் கோபத்தைக் குறிக்கிறது. ‘கோபம் பற்றியெரிந்தது’ அதன் உருவக வலிமையைப் பாதுகாத்தும் தமிழில் தெளிவாகவும் உள்ளது.
