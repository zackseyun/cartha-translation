translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று-போரியல் நடை பயன்படுத்தப்பட்டது. எபிரெய உரையின் மீளுரையும் சூழல்சார் தெளிவும் சமநிலைப்படுத்தப்பட்டுள்ளன; உரையில் உள்ள [a] குறியீடு அடிக்குறிப்புடன் பொருந்துகிறது.
