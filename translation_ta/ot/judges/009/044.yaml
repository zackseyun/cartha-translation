base_translation:
  language: en
  yaml_path: translation/ot/judges/009/044.yaml
  text: And Abimelech and the leaders who were with him rushed forward and took their stand at the entrance of the city gate[a], while the two other companies rushed against everyone who was in the field and struck them down.
translation:
  language: ta
  text: அபிமெலேக்கும் அவனோடு இருந்த தலைவர்களும் வேகமாக முன்னேறி, நகரவாசலின் நுழைவிடத்தில் நிலைகொண்டார்கள். மற்ற இரண்டு படைப்பிரிவுகளோ[a] வயல்வெளியில் இருந்த அனைவர்மீதும் பாய்ந்து அவர்களை அடித்து வீழ்த்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொற்படியாக, “இரண்டு தலைவர்கள்.” முந்தைய வசனத்தில் குறிப்பிடப்பட்ட மூன்று படைப்பிரிவுகளில் மீதமிருந்த இரண்டு பிரிவுகளையே இது இச்சூழலில் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשְׁטוּ
  choice: வேகமாக முன்னேறி / பாய்ந்து
  rationale: இந்தப் போர்ச் சூழலில் வினைச்சொல் விரைவான முன்னேற்றத்தையும் தாக்குதலையும் குறிக்கிறது. முதல் இடத்தில் படைநகர்வையும், இரண்டாம் இடத்தில் நேரடித் தாக்குதலையும் இயல்பான தமிழில் வெளிப்படுத்த இரு சூழல்சார் வடிவங்கள் பயன்படுத்தப்பட்டன.
- source_word: הָרָאשִׁים
  choice: தலைவர்கள்
  rationale: சொற்பொருள் ‘தலைவர்கள்’; அபிமெலேக்குடன் இருந்த படைத்தலைவர்களைக் குறிக்கும் வகையில் நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: וַיַּעַמְדוּ
  choice: நிலைகொண்டார்கள்
  rationale: வெறுமனே நின்றார்கள் என்பதைக் காட்டிலும், போர்த் திட்டத்தின்படி குறிப்பிட்ட இடத்தில் தங்களை நிறுத்திக்கொண்டார்கள் என்ற நோக்கமுள்ள செயலை வெளிப்படுத்துகிறது.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: நகரவாசலின் நுழைவிடம்
  rationale: வாசலின் திறப்பு அல்லது நுழைவுப் பகுதி என்ற தெளிவான இடவிவரத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: וּשְׁנֵי הָרָאשִׁים
  choice: மற்ற இரண்டு படைப்பிரிவுகள்
  rationale: எபிரெய உரை சொற்படியாக ‘இரண்டு தலைவர்கள்’ என இருந்தாலும், முந்தைய வசனத்தில் படை மூன்று பிரிவுகளாகப் பிரிக்கப்பட்ட சூழல் இங்கு மீதமுள்ள இரண்டு படைப்பிரிவுகளைக் குறிக்கிறது. ‘மற்ற’ என்பது அந்தச் சூழல் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: עַל כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: வயல்வெளியில் இருந்த அனைவர்மீதும்
  rationale: அடுத்து வரும் பன்மை மனிதச் சுட்டுப்பெயரும் தாக்குதல் வினையும் காரணமாக, வயலில் இருந்த மனிதர்களே குறிக்கப்படுகிறார்கள் என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיַּכּוּם
  choice: அவர்களை வெட்டி வீழ்த்தினார்கள்
  rationale: נכה என்பதன் வன்முறையான ‘அடித்து வீழ்த்துதல்’ பொருளை போர்ச் சூழலில் இயல்பாக வெளிப்படுத்துகிறது; அனைவரும் கட்டாயம் கொல்லப்பட்டனர் என்று தேவையின்றி மிகத் துல்லியப்படுத்தவில்லை.
