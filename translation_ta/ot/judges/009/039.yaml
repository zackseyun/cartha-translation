base_translation:
  language: en
  yaml_path: translation/ot/judges/009/039.yaml
  text: So Gaal went out before the leaders of Shechem and fought against Abimelech[a].
translation:
  language: ta
  text: எனவே கால் சீகேமின் தலைவர்களுக்கு முன்பாகப் புறப்பட்டுச் சென்று, அபிமெலேக்குக்கு எதிராகப் போரிட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீகேமின் தலைவர்களுக்கு முன்னின்று”; இச்சூழலில் “முன்பாக” என்பது அவர்களைத் தலைமையேற்று நடத்தியதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: புறப்பட்டுச் சென்றான்
  rationale: יצא என்பதன் Qal தொடர் இறந்தகால வடிவம் வெளியே செல்லுதல் அல்லது புறப்படுதலைக் குறிக்கிறது. இங்கு போருக்காக நகரிலிருந்து புறப்பட்டுச் செல்வதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: גַעַל
  choice: காகால்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பெயர்ப்பு; ע ஒலியைத் தமிழில் தனியே துல்லியமாகக் குறிக்க இயலாததால், வாசிக்கத்தக்க மரபில் காகால் என வழங்கப்படுகிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: அடிப்படையில் ‘முன்னே/முன்பாக’ என்று பொருள். சூழலில் படையை முன்னின்று நடத்துவதையும் குறிக்கக்கூடும்; அந்த வாய்ப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: சீகேமின் தலைவர்கள்
  rationale: இங்கு בַּעֲלֵי என்பது நகரின் வெறும் குடிமக்களைவிட அதிகாரமும் செல்வாக்கும் கொண்ட முன்னணியினரைக் குறிக்கிறது. நவீன தமிழில் ‘தலைவர்கள்’ அந்தக் குடியியல்-அரசியல் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וַיִּלָּחֶם
  choice: போரிட்டான்
  rationale: לחם என்பதன் Niphal தொடர் இறந்தகால வடிவம் போரிடுதல் என்ற பொருளுடையது; தமிழ்க் கதைநடையில் ‘போரிட்டான்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: בַּאֲבִימֶלֶךְ
  choice: அபிமெலேக்குக்கு எதிராக
  rationale: לחם உடன் வரும் בְּ இங்கு எதிர்த்தரப்பைக் குறிக்கிறது. ‘எதிராக’ என்பது காகால் அபிமெலேக்கை எதிர்த்துப் போரிட்டான் என்பதைத் தெளிவுபடுத்துகிறது.
