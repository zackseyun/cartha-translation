base_translation:
  language: en
  yaml_path: translation/ot/judges/009/035.yaml
  text: Then Gaal son of Ebed went out and stood at the entrance of the city gate[b][a], and Abimelech and the people who were with him rose from the ambush.
translation:
  language: ta
  text: அப்போது ஏபெத்தின் மகன் காகால் வெளியே சென்று நகரவாசலின் நுழைவிடத்தில் நின்றான். அபிமெலேக்கும் அவனோடு இருந்த மக்களும் பதுங்கியிருந்த இடத்திலிருந்து எழுந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பதுங்கியிருந்த நிலையிலிருந்து எழுந்தார்கள்.” எபிரேயச் சொல் பதுங்கித் தாக்குதலையோ அதற்காகப் பதுங்கியிருந்த இடத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: வெளியே சென்று
  rationale: יצא வெளிப்புறத்தை நோக்கிய நகர்வைக் குறிக்கிறது. தமிழில் இயல்பான கதைநடையாகவும் திசையை மிகுதியாக விளக்காமலும் ‘வெளியே சென்று’ தருகிறது.
- source_word: גַּעַל בֶּן עֶבֶד
  choice: ஏபெத்தின் மகன் காகால்
  rationale: எபிரேய மரபுப்பெயர்க் கட்டமைப்பை இயல்பான தமிழ்ச் சொல்லொழுங்கில் வழங்குகிறது; பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: וַיַּעֲמֹד
  choice: நின்றான்
  rationale: עמד என்பதன் எளிய பொருளான ‘நின்றான்’ என்பதைத் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத இராணுவ நுட்பத்தைச் சேர்க்கவில்லை.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: நகரவாசலின் நுழைவிடத்தில்
  rationale: פתח என்பதன் ‘நுழைவிடம்/திறப்பு’ என்ற பொருளையும் שער העיר என்ற இணைப்பையும் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: וַיָּקָם
  choice: எழுந்தார்கள்
  rationale: קום என்பது இங்கு மறைவிலிருந்து செயலில் இறங்குவதைச் சுட்டுகிறது. ‘எழுந்தார்கள்’ மூலத்தின் சுருக்கமான கதைநடையைப் பேணுகிறது.
- source_word: וְהָעָם אֲשֶׁר אִתּוֹ
  choice: அவனோடு இருந்த மக்களும்
  rationale: עם என்பதன் அடிப்படைப் பொருளான ‘மக்கள்’ என்பதைக் காக்கிறது; சூழல் அவர்கள் அபிமெலேக்குடன் இருந்த படையினர் என்பதை உணர்த்துகிறது.
- source_word: מִן הַמַּאְרָב
  choice: பதுங்கியிருந்த இடத்திலிருந்து
  rationale: מארב என்பது பதுங்கித் தாக்குதல் அல்லது அதற்கான பதுங்கிய நிலை/இடம் ஆகிய இரண்டையும் குறிக்கலாம். தமிழில் இங்கு இடத்திலிருந்து எழுதல் இயல்பாகத் தெரிவதால் இவ்வாறு வழங்கி, மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
