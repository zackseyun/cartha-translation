translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் எளிய, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய வாக்கியத்தின் தொடர்ச்சியான செயல்கள் தெளிவான இரண்டு தமிழ் வாக்கியங்களாக வழங்கப்பட்டுள்ளன. அடிக்குறி தொடர்புடைய சொல்லின் பின்னர் வைக்கப்பட்டுள்ளது.
