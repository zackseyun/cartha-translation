  yaml_path: translation/ot/judges/009/021.yaml
  text: Then Jotham fled and escaped and went to Beer[a], and he lived there away from Abimelech his brother.
translation:
  language: ta
  text: அப்போது யோத்தாம் தப்பியோடி, பெயேருக்குச் சென்று, தன் சகோதரன் அபிமெலேக்கிடமிருந்து விலகி அங்கே வாழ்ந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּנָס ... וַיִּבְרַח
  choice: தப்பியோடி
  rationale: இரு வினைகளும் ஆபத்திலிருந்து ஓடித் தப்புவதைக் குறிக்கும் நெருங்கிய பொருளுடைய தொடர். தமிழில் இயல்பாகவும் இரு கூறுகளின் ஒருங்கிணைந்த வலிமையைத் தக்கவைக்கவும் ‘தப்பியோடி’ என வழங்கப்பட்டது.
- source_word: בְּאֵרָה
  choice: பேயேர்
  rationale: இது ஓர் இடப்பெயர். எபிரெய வடிவில் இறுதியிலுள்ள -ָה திசையைக் குறிக்கும் பின்னொட்டாக (‘பேயேருக்கு’) புரிந்துகொள்ளப்படுவதால், இடப்பெயர் ‘பேயேர்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיֵּשֶׁב שָׁם
  choice: அங்கே வாழ்ந்தான்
  rationale: יָשַׁב இச்சூழலில் தங்கி வாழ்வதைக் குறிக்கிறது; நவீன தமிழில் இயல்பான ‘வாழ்ந்தான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִפְּנֵי
  choice: இடமிருந்து விலகி
  rationale: சொல்லுக்கு நேரடியாக ‘முகத்திலிருந்து/முன்னிலையிலிருந்து’ என்ற அடிப்படை உணர்வு உண்டு. இங்கு அபிமெலேக்கின் அணுகலிலிருந்து விலகியிருப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; காரணம் அல்லது பயம் என்பதை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: אָחִיו
  choice: தன் சகோதரன்
  rationale: மூன்றாம் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் வரும் உறவுமுறைச் சொல்லை வெளிப்படையாகத் தக்கவைத்து, குடும்பத்திற்குள்ளான மோதலைச் சுட்டுகிறது.
