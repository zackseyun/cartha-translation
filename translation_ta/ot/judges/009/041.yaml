base_translation:
  language: en
  yaml_path: translation/ot/judges/009/041.yaml
  text: And Abimelech stayed in Arumah[a], and Zebul drove Gaal and his brothers out from dwelling in Shechem.
translation:
  language: ta
  text: அபிமெலேக்கு அரூமாவில் தங்கினான்; செபூல் காலையும் அவனுடைய சகோதரர்களையும் சீகேமில் குடியிருக்கவிடாமல்[a] துரத்திவிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீகேமில் குடியிருப்பதிலிருந்து காலையும் அவனுடைய சகோதரர்களையும் துரத்திவிட்டான்.” எபிரெய வினையெச்சக் கட்டமைப்பு, அவர்கள் அங்கே குடியிருப்பதிலிருந்து விலக்கப்பட்டதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: தங்கியிருந்தான்
  rationale: ישׁב என்பதற்கு ‘அமர்தல், குடியிருத்தல், தங்கியிருத்தல்’ என்ற பொருள்கள் உண்டு. இந்தப் போர்ச் சம்பவச் சூழலில், நீண்டகாலக் குடியிருப்பை அவசியமாகக் குறிக்காமல் அபிமெலேக்கு அரூமாவில் நிலைகொண்டிருந்ததை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בָּארוּמָה
  choice: அரூமாவில்
  rationale: இது ஓர் இடப்பெயர்; எபிரெய ஒலிப்பை அணுகியவாறு எழுத்துப்பெயர்க்கப்பட்டு, בְּ முன்னொட்டு ‘-இல்’ என்னும் இடவேற்றுமையாக மொழிபெயர்க்கப்பட்டது.
- source_word: וַיְגָרֶשׁ
  choice: துரத்திவிட்டான்
  rationale: גרשׁ வலுக்கட்டாயமாக வெளியேற்றுதல் அல்லது விரட்டுதல் என்ற பொருளுடையது. சட்டரீதியான நாடுகடத்தலைக் குறிப்பதாக மிகைப்படுத்தாமல், அதன் வலிமையை இயல்பான தமிழில் இது தருகிறது.
- source_word: זְבֻל
  choice: செபூல்
  rationale: தனிநபரின் பெயர் எபிரெய ஒலிப்பை அணுகியவாறு எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: גַּעַל
  choice: காகால்
  rationale: தனிநபரின் பெயர் எழுத்துப்பெயர்க்கப்பட்டது; ע மெய்யொலியைத் தனியே குறிக்கத் தமிழில் நிலையான எளிய வழி இல்லாததால், வாசிக்கத்தக்க ‘காகால்’ வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אֶחָיו
  choice: அவனுடைய சகோதரர்களை
  rationale: אָח என்பதன் நேரான பொருள் ‘சகோதரன்.’ இங்கு ‘உறவினர்கள்’ அல்லது ‘தோழர்கள்’ என்று விரிவுபடுத்தத் தெளிவான சூழல் ஆதாரம் இல்லாததால் குடும்ப உறவுச் சொல் தக்கவைக்கப்பட்டது.
- source_word: מִשֶּׁבֶת
  choice: குடியிருக்கவிடாமல்
  rationale: מן முன்னொட்டுடன் வரும் ישׁב வினையெச்சக் கட்டமைப்பு, அங்கே வசிப்பதிலிருந்து விலக்கப்படுவதையோ வசிக்க முடியாமல் தடுக்கப்படுவதையோ குறிக்கிறது. அதன் விளைவை இயல்பான தமிழில் இச்சொற்றொடர் தெளிவாக்குகிறது.
- source_word: בִּשְׁכֶם
  choice: சீகேமில்
  rationale: இடப்பெயர் எழுத்துப்பெயர்க்கப்பட்டு, בְּ முன்னொட்டு ‘-இல்’ என வழங்கப்பட்டது.
