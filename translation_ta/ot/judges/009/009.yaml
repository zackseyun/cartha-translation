  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ הַ/זַּ֔יִת הֶ/חֳדַ֨לְתִּי֙ אֶת דִּשְׁנִ֔/י אֲשֶׁר בִּ֛/י יְכַבְּד֥וּ אֱלֹהִ֖ים וַ/אֲנָשִׁ֑ים וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/009.yaml
  text: But the olive tree said to them[a], ‘Should I stop producing my oil, by which gods and men are honored[b], and go to sway over the trees?’
translation:
  language: ta
  text: ஆனால் ஒலிவ மரம் அவற்றிடம், “தெய்வங்களும்[a] மனிதர்களும் மதிக்கப்படுவதற்குக் காரணமான என் செழுமையை நான் கைவிட்டு, மரங்களின்மேல் அசைந்தாடப் போவேனா?” என்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளும்.” ஒலிவ எண்ணெய் வழிபாட்டில் பயன்படுத்தப்பட்டதால் பல மொழிபெயர்ப்புகள் இங்குள்ள אֱלֹהִים என்ற சொல்லை உண்மையான கடவுளைக் குறிப்பதாக எடுத்துக்கொள்கின்றன; ஆனால் எபிரெயச் சொல்லும் அதனுடன் வரும் வினையும் பன்மை வடிவில் உள்ளன.
    reason: alternative_reading
lexical_decisions:
- source_word: הַזַּיִת
  choice: ஒலிவ மரம்
  rationale: எபிரெயச் சொல் ‘ஒலிவம்’ என இருந்தாலும், உருவகக் கதையில் பேசும் பாத்திரம் மரமாக இருப்பதால் தமிழில் ‘ஒலிவ மரம்’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הֶחֳדַלְתִּי
  choice: நான் விட்டுவிட்டு … போவேனா?
  rationale: முற்றுவினை வடிவம் இச்சூழலில் வினாவியல் மறுப்புணர்வுடன் வருகிறது. தமிழில் ‘விட்டுவிட்டு … போவேனா?’ என்பது அந்தச் சொல்லாட்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: דִּשְׁנִי
  choice: என் செழுமையை
  rationale: இதன் நேர்ப்பொருள் ‘என் கொழுமை/செழுமை.’ ஒலிவ எண்ணெயைச் சூழல் சுட்டினாலும், மூலத்தில் ‘எண்ணெய்’ என்று வெளிப்படையாக இல்லை; ஆகவே உருவகத்தைப் பாதுகாக்க ‘செழுமை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲשֶׁר בִּי
  choice: மதிக்கப்படுவதற்குக் காரணமான
  rationale: בִּי என்பதன் கருவி அல்லது காரணப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அது மரத்தின் செழுமையுடன் தொடர்புடையது என்பதையும் சூழல் தெளிவாக்குகிறது.
- source_word: יְכַבְּדוּ
  choice: மதிக்கப்படுவதற்கு
  rationale: எபிரெயத்தில் செய்பவர் குறிப்பிடப்படாத பன்மைச் செயப்பாட்டு அமைப்பு உள்ளது. தமிழில் செயப்படுபொருள் அமைப்பு, குறிப்பிடப்படாத எழுவாயைச் சேர்க்காமல் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: אֱלֹהִים
  choice: தெய்வங்கள்
  rationale: சொல்லின் பன்மை வடிவமும் அதனுடன் வரும் பன்மை வினையும் இங்கு ‘தெய்வங்கள்’ என்ற வாசிப்பை ஆதரிக்கின்றன. ‘கடவுள்’ என்ற மரபுவழி மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַאֲנָשִׁים
  choice: மனிதர்கள்
  rationale: ஆண்களை மட்டும் குறிக்க வேண்டிய கட்டாயம் இல்லாத பொதுப் பன்மைச் சொல்லாக இங்கு வருவதால், நவீனத் தமிழில் ‘மனிதர்கள்’ இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: לָנוּעַ עַל הָעֵצִים
  choice: மரங்களின்மேல் அசைந்தாட
  rationale: נוּעַ என்பதிலுள்ள அசைதல் என்ற மரப்படிமத்தையும், மற்ற மரங்களுக்குமேல் நிற்கும் அரசாட்சியின் நையாண்டித் தொனியையும் இந்த மொழிபெயர்ப்பு பாதுகாக்கிறது.
theological_decisions:
- issue: אֱלֹהִים என்பதன் குறிப்பு
  choice: தெய்வங்கள்
  alternative: கடவுள்
  rationale: பன்மை வடிவமும் பன்மை வினையும் ‘தெய்வங்கள்’ என்பதை நேரடியாக ஆதரிக்கின்றன. ஆயினும், ஒலிவ எண்ணெயின் வழிபாட்டுப் பயன்பாட்டை முன்னிட்டு இதை இஸ்ரவேலின் கடவுளைக் குறிப்பதாகப் புரிந்துகொள்ளும் பழமையான வாசிப்பும் உண்டு; அந்த உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனச் செந்தமிழின் கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. மரத்தின் பேச்சில் உள்ள உருவகமும் நையாண்டி கலந்த ‘அசைந்தாடுதல்’ படிமமும் பாதுகாக்கப்பட்டுள்ளன.
