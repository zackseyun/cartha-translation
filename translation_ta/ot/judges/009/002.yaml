source:
  edition: WLC
  text: דַּבְּרוּ נָ֞א בְּ/אָזְנֵ֨י כָל בַּעֲלֵ֣י שְׁכֶם֮ מַה טּ֣וֹב לָ/כֶם֒ הַ/מְשֹׁ֨ל בָּ/כֶ֜ם שִׁבְעִ֣ים אִ֗ישׁ כֹּ֚ל בְּנֵ֣י יְרֻבַּ֔עַל אִם מְשֹׁ֥ל בָּ/כֶ֖ם אִ֣ישׁ אֶחָ֑ד וּ/זְכַרְתֶּ֕ם כִּֽי עַצְמֵ/כֶם וּ/בְשַׂרְ/כֶ֖ם אָנִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/002.yaml
  text: 'Please speak in the hearing of all the leaders of Shechem: Which is better for you—that seventy men[a], all the sons of Jerubbaal, rule over you, or that one man rule over you? And remember that I am your bone and your flesh.'
translation:
  language: ta
  text: '“தயவுசெய்து சீகேமின் தலைவர்கள் அனைவரும் கேட்கும்படி சொல்லுங்கள்: ‘யெருபாகாலின் மகன்கள் அனைவருமாகிய எழுபது ஆண்கள் உங்களை ஆளுவது உங்களுக்கு நல்லதா, அல்லது ஒரே ஓர் ஆண் உங்களை ஆளுவது நல்லதா? நான் உங்கள் எலும்பும் உங்கள் சதையுமாய் இருக்கிறேன்[a] என்பதை நினைவில் கொள்ளுங்கள்.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்கள் எலும்பும் உங்கள் சதையும்” என்பது “உங்கள் சொந்த இரத்த உறவினன்” அல்லது நெருங்கிய உறவினன் என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ נָא
  choice: தயவுசெய்து ... சொல்லுங்கள்
  rationale: பன்மை ஏவலுடன் வரும் נָא வேண்டுகோளின் மென்மையை வெளிப்படுத்துகிறது; நவீன தமிழில் இயல்பாக வேண்டுகோளைத் தெரிவிக்கிறது.
- source_word: בְּאָזְנֵי כָל בַּעֲלֵי שְׁכֶם
  choice: சீகேமின் தலைவர்கள் அனைவரும் கேட்கும்படி
  rationale: בְּאָזְנֵי என்பதன் கேட்கும் முன்னிலையில் பேசுதல் என்ற பொருளையும், בַּעֲלֵי என்பதன் நகரின் செல்வாக்குள்ள ஆண்கள் அல்லது குடிமைத் தலைவர்கள் என்ற சூழல்சார் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: מַה טּוֹב לָכֶם
  choice: உங்களுக்கு நல்லதா
  rationale: தொடர்ந்து வரும் இரண்டு மாற்றுத் தேர்வுகள் ஒப்பீட்டுப் பொருளைத் தெளிவாக்குகின்றன; தமிழில் இரண்டிலும் ‘நல்லதா’ என்று மீட்டுரைப்பது கேள்வியை இயல்பாக்குகிறது.
- source_word: הַמְשֹׁל בָּכֶם ... מְשֹׁל בָּכֶם
  choice: உங்களை ஆளுவது ... உங்களை ஆளுவது
  rationale: அரசியல் ஆட்சியைச் சுட்டும் משל வினையின் மீளுரைப்பைப் பாதுகாக்கிறது.
- source_word: שִׁבְעִים אִישׁ כֹּל בְּנֵי יְרֻבַּעַל
  choice: யெருபாகாலின் மகன்கள் அனைவருமாகிய எழுபது ஆண்கள்
  rationale: இங்கு אִישׁ ஆண்களையே குறிக்கிறது; அவர்கள் யெருபாகாலின் மகன்கள் என்பதையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: אִישׁ אֶחָד
  choice: ஒரே ஓர் ஆண்
  rationale: எழுபது ஆண்களுடன் உள்ள வலுவான எண்ணிக்கை முரண்பாட்டையும் பாலினத் துல்லியத்தையும் தக்கவைக்கிறது.
- source_word: וּזְכַרְתֶּם
  choice: நினைவில் கொள்ளுங்கள்
  rationale: சூழலில் உள்ள வலியுறுத்தும் அறிவுறுத்தலை நவீன, கண்ணியமான தமிழில் தருகிறது.
- source_word: עַצְמֵכֶם וּבְשַׂרְכֶם אָנִי
  choice: நான் உங்கள் எலும்பும் உங்கள் சதையுமாய் இருக்கிறேன்
  rationale: இரத்த உறவைக் குறிக்கும் எபிரெய உருவக மொழியை விளக்கமாக மாற்றாமல் முதன்மை உரையில் பாதுகாக்கிறது.
theological_decisions:
- issue: உறவுமுறையைக் குறிக்கும் ‘எலும்பும் சதையும்’ என்ற உருவகம்
  choice: முதன்மை உரையில் உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘நான் உங்கள் சொந்த இரத்த உறவினன்’ என்று பொருளை நேரடியாகக் கூறுதல்
  rationale: எபிரெய மொழியின் உடல் சார்ந்த வலிமையையும் உறவுமுறைப் பொருளையும் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் வழக்குப் பொருளை விளக்குகிறது.
- issue: யெருபாகாலின் சந்ததியரைக் குறிக்கும் பாலின மொழி
  choice: ‘எழுபது ஆண்கள்’ மற்றும் ‘ஒரே ஓர் ஆண்’
  alternative: ‘எழுபது பேர்’ மற்றும் ‘ஒரே ஒருவர்’
  rationale: אִישׁ என்பதும் சூழலில் குறிப்பிடப்படும் யெருபாகாலின் மகன்களும் அபிமெலேக்கும் ஆண்கள் என்பதால், பாலினத் துல்லியம் பாதுகாக்கப்படுகிறது.
- issue: בַּעֲלֵי שְׁכֶם என்போரின் சமூக அடையாளம்
  choice: ‘சீகேமின் தலைவர்கள்’
  alternative: ‘சீகேமின் குடிமக்கள்’ அல்லது ‘சீகேமின் உரிமையாளர்கள்’
  rationale: சொல் உரிமையாளர்கள், எஜமானர்கள், முக்கிய ஆண்கள் எனப் பலவாறு பொருள்படலாம்; இந்த அரசியல் சூழலில் ‘தலைவர்கள்’ பொருத்தமானது, ஆனால் மூலத்தின் சமூக எல்லை முற்றிலும் உறுதியானதல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. அரசியல் ஆட்சியைக் குறிக்கும் மீளுரைப்பும், உறவுமுறை உருவகமும், ஆண் பாலைக் குறிக்கும் மூலமொழித் துல்லியமும் பாதுகாக்கப்பட்டுள்ளன.
