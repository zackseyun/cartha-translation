base_translation:
  language: en
  yaml_path: translation/ot/judges/009/053.yaml
  text: But a certain woman threw an upper millstone on Abimelech’s head and crushed his skull[a].
translation:
  language: ta
  text: ஆனால் ஒரு பெண் மேல் திரிகைக்கல்லை அபிமெலேக்கின் தலைமீது எறிந்து, அவனுடைய மண்டையோட்டை நொறுக்கினாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மேல் திரிகைக்கல்லின் ஒரு துண்டை’; எபிரெயச் சொற்றொடர் மேல் திரிகைக்கல்லின் ஒரு பகுதியையோ உடைந்த துண்டையையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁלֵךְ
  choice: எறிந்து
  rationale: שׁלך என்பதன் செயப்படுத்தும் வலிமையையும் தொடர்ச்சியான எபிரெயக் கதைநடையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; தற்செயலாகக் கீழே போட்டாள் என்ற பொருளைத் தவிர்க்கிறது.
- source_word: אִשָּׁה אַחַת
  choice: ஒரு பெண்
  rationale: சொல்லர்த்தமாகவும் இயல்பான தமிழ் கதைநடையிலும் பொருந்துகிறது; பெயர் குறிப்பிடப்படாத ஒரே பெண்ணின் தீர்மானமான செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: פֶּלַח רֶכֶב
  choice: மேல் திரிகைக்கல்
  rationale: רֶכֶב என்பது திரிகையின் மேல் கல்லைக் குறிப்பாகக் குறிக்கிறது. פֶּלַח ஒரு பகுதி அல்லது துண்டு என்ற நுண்பொருளையும் தரக்கூடும் என்பதால் அந்த மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: עַל רֹאשׁ
  choice: தலைமீது
  rationale: நேரடியான இடவியல் பொருளை நவீனத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲבִימֶלֶךְ
  choice: அபிமெலேக்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பைத் தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: וַתָּרִץ
  choice: நொறுக்கினாள்
  rationale: רצץ என்பதன் நசுக்குதல் அல்லது நொறுக்குதல் என்ற வன்மையான பொருளைச் சூழலுக்கேற்ற இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: גֻּלְגָּלְתּוֹ
  choice: அவனுடைய மண்டையோட்டை
  rationale: பொதுவான ‘தலை’ என்பதற்குப் பதிலாக, மூலத்தில் உள்ள உடற்கூற்றுத் துல்லியத்தையும் அடியின் தீவிரத்தையும் காக்கிறது.
