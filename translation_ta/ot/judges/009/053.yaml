translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சுருக்கமும் வன்மையின் தீவிரமும் காக்கப்பட்டுள்ளன; ‘மேல் திரிகைக்கல்’ என்ற குறிப்பிட்ட அர்த்தம் முதன்மை உரையில் வைக்கப்பட்டு, ‘ஒரு துண்டு’ என்ற உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
