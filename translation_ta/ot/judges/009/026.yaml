  to: அப்போது ஏபேத்தின் மகன் கால் தன் சகோதரர்களுடன் வந்தான்; அவர்கள் சீகேமுக்குள் கடந்து சென்றார்கள்[a]. சீகேமின் தலைவர்கள்[b] அவன்மீது நம்பிக்கை வைத்தார்கள்.
