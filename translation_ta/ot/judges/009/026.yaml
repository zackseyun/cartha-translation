base_translation:
  language: en
  yaml_path: translation/ot/judges/009/026.yaml
  text: Then Gaal son of Ebed came with his brothers and crossed into Shechem[c][b][a], and the leaders of Shechem put their trust in him.
translation:
  language: ta
  text: அப்போது ஏபேத்தின் மகன் கால் தன் சகோதரர்களுடன் வந்தான்; அவர்கள் சீகேமுக்குள் கடந்து சென்றார்கள்[a]. சீகேமின் தலைவர்கள்[b] அவன்மீது நம்பிக்கை வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீகேம் வழியாகக் கடந்து சென்றார்கள்” அல்லது “சீகேமுக்குச் சென்றார்கள்.” இங்குள்ள எபிரேய வினை கடந்து செல்லுதலைக் குறிக்கலாம்; சூழலில் அதன் துல்லியமான நுட்பம் விவாதத்திற்குரியது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “சீகேமின் ஆண்டவர்கள்”; இது நகரத்தில் அதிகாரமும் செல்வாக்கும் கொண்டவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: அப்போது ... வந்து
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் ‘அப்போது’ இயல்பாக அந்தத் தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: גַּעַל
  choice: காகால்
  rationale: எபிரேய தனிப்பெயரின் ஒலிப்பைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் எழுத்துப்பெயர்ப்பு.
- source_word: בֶּן עֶבֶד
  choice: ஏபேத்தின் மகன்
  rationale: எபிரேய தந்தைவழிப் பெயரடையாளத்தை இயல்பான தமிழில் தருகிறது.
- source_word: וְאֶחָיו
  choice: தன் சகோதரர்களுடன்
  rationale: இணைப்புச் சொல் நேரடியாக ‘மற்றும்’ என்றாலும், வருகையில் உடன்சேர்ந்தவர்களைக் குறிக்கும் பொருளைத் தமிழில் ‘உடன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיַּעַבְרוּ בִּשְׁכֶם
  choice: சீகேமுக்குள் கடந்து சென்றான்
  rationale: עבר என்பதன் கடத்தல் அல்லது கடந்துசெல்லுதல் சார்ந்த இயக்கப் பொருளையும், בְ உடன் வரும் இடப்பொருளின் தெளிவின்மையையும் ஓரளவு காக்கிறது; கூட்டு எழுவாய் இருந்தாலும் தமிழில் முதன்மை நபரை மையப்படுத்தும் ஒருமை வினை இயல்பானது.
- source_word: וַיִּבְטְחוּ בוֹ
  choice: அவன்மேல் நம்பிக்கை வைத்தார்கள்
  rationale: בטח בְ என்பது ஒருவர்மீது நம்பிக்கை அல்லது சார்பு வைப்பதைக் குறிக்கிறது; இத்தொடர் நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: சீகேமின் தலைவர்கள்
  rationale: நகரத்தின் எல்லாக் குடிமக்களையும் அல்லாமல், அதிகாரமும் செல்வாக்கும் கொண்ட ஆண்களை בעלי குறிக்கிறது; ‘தலைவர்கள்’ அந்தச் சமூக-அரசியல் பொருளைத் தெளிவாகத் தருகிறது.
