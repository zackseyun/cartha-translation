translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய இயக்கவினையின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; ‘பעלי’ என்பதற்கு பழமையான அல்லது தவறாகப் புரியக்கூடிய ‘ஆண்டவர்கள்’ என்பதற்குப் பதில் ‘தலைவர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
