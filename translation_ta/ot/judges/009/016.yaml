  to: ஆகவே இப்போது, நீங்கள் அபிமெலேக்கை அரசனாக்கியபோது உண்மையுடனும் நேர்மையுடனும் நடந்துகொண்டீர்களானால், எருபாகாலுக்கும் அவரது வீட்டாருக்கும் நன்மை செய்தீர்களானால், அவருடைய செயல்களுக்கேற்றபடி அவரை நடத்தினீர்களானால்[a]—
  rationale: 'திருத்தம் இறுதி நிபந்தனையில் உள்ள எபிரெய மரபுத்தொடரின் மதிப்பீட்டுத் திறந்த தன்மையைப் பாதுகாக்கிறது: எருபாகால் செய்த செயல்களுக்கு ஏற்றவாறு அவரை நடத்தினார்களா என்பதே கேள்வி; அது வெகுமதி அளித்தல் மட்டுமே என வரையறுக்கப்படவில்லை. அடிக்குறிப்பும் நேரடியான மரபுத்தொடரையும் அதன் பொருளையும் இலக்கணமாகத் தெளிவாகத் தருகிறது. இறுதி நீள்கோடு மூலத்தின் அடுத்த வசனத்தில் தொடரும் நிறைவுறாத நிபந்தனை அமைப்பைத் தக்கவைக்கிறது.'
