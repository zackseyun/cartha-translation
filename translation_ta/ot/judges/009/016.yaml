  text: וְ/עַתָּ֗ה אִם בֶּ/אֱמֶ֤ת וּ/בְ/תָמִים֙ עֲשִׂיתֶ֔ם וַ/תַּמְלִ֖יכוּ אֶת אֲבִימֶ֑לֶךְ וְ/אִם טוֹבָ֤ה עֲשִׂיתֶם֙ עִם יְרֻבַּ֣עַל וְ/עִם בֵּית֔/וֹ וְ/אִם כִּ/גְמ֥וּל יָדָ֖י/ו עֲשִׂ֥יתֶם לֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/016.yaml
  text: Now therefore[a], if you have acted in truth and integrity when you made Abimelech king, and if you have dealt well with Jerubbaal and with his house, and if you have dealt with him according to the recompense of his hands,
translation:
  language: ta
  text: ஆகவே இப்போது, நீங்கள் அபிமெலேக்கை அரசனாக்கியபோது உண்மையுடனும் நேர்மையுடனும் நடந்துகொண்டீர்களானால், எருபாகாலுக்கும் அவரது வீட்டாருக்கும் நன்மை செய்தீர்களானால், அவருடைய செயல்களுக்கேற்றபடி அவரை நடத்தினீர்களானால்[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘அவருடைய கைகளுக்குரிய கைம்மாற்றின்படி அவருக்குச் செய்தீர்களானால்.’ ‘கைகள்’ என்பது அவர் செய்த செயல்களைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: மூலமொழி மரபுத்தொடரின் மாற்று விளக்கம்
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: கால மாற்றத்தையும் முன் கூறியவற்றிலிருந்து வரும் முடிவுரைத்தன்மையையும் இணைத்துக் காட்டுகிறது.
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: உண்மையுடனும் நேர்மையுடனும்
  rationale: நடத்தையின் நம்பகத்தன்மை மற்றும் முழுமையான ஒழுக்கநேர்மை ஆகிய இணையான கருத்துகளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וַתַּמְלִיכוּ אֶת־אֲבִימֶלֶךְ
  choice: அபிமெலேக்கை அரசனாக்கியபோது
  rationale: מלך என்பதன் ஹிஃபில் வடிவிலுள்ள ‘அரசாளச் செய்தல்/அரசனாக்குதல்’ என்ற பொருளைத் தெளிவாகத் தருகிறது; இச்செயலை முந்தைய நிபந்தனையுடன் இயல்பாக இணைக்கிறது.
- source_word: טוֹבָה עֲשִׂיתֶם עִם
  choice: நன்மை செய்தீர்கள்
  rationale: ‘ஒருவருடன்/ஒருவருக்காக நன்மை செய்தல்’ என்ற எபிரெய மரபுத்தொடரைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְרֻבַּעַל
  choice: எருபாகால்
  rationale: மூல உரை ‘கிதியோன்’ என்பதற்குப் பதிலாகப் பயன்படுத்தும் பெயரையே ஒலிபெயர்க்கிறது.
- source_word: בֵּיתוֹ
  choice: அவரது வீட்டார்
  rationale: இங்கு ‘வீடு’ என்பது கட்டிடத்தை அல்ல, குடும்பம் அல்லது வம்சத்தாரைக் குறிக்கும்; ‘வீட்டார்’ அந்தப் பரப்பை இயல்பாகத் தருகிறது.
- source_word: כִּגְמוּל יָדָיו
  choice: அவருடைய கைகளின் செயல்களுக்கேற்ற பலன்
  rationale: ஒருவரின் செயல்களுக்கு ஏற்ற கைம்மாறு என்ற பொருளையும் ‘கைகள்’ என்னும் எபிரெய உருவகத்தையும் காக்கிறது.
- source_word: עֲשִׂיתֶם לוֹ
  choice: அவருக்குச் செலுத்தினீர்கள்
  rationale: செயல்களுக்கு ஏற்ற கைம்மாறு அளித்தல் என்ற சூழ்நிலைப் பொருளைத் தெளிவாகவும் தமிழில் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: כִּגְמוּל יָדָיו என்பது நன்மையான கைம்மாறா அல்லது நடுநிலையான தகுந்த பலனா
  choice: அவருடைய கைகளின் செயல்களுக்கேற்ற பலனை அவருக்குச் செலுத்தினீர்களானால்
  alternative: அவருடைய செயல்கள் தகுந்த கைம்மாற்றை அவருக்குச் செய்தீர்களானால்
  rationale: சூழல் யோத்தாமின் கேள்வி நன்மையான பதிலை எதிர்பார்ப்பதைக் காட்டினாலும், சொற்றொடரின் அடிப்படைத் தகுதிக்கேற்ற கைம்மாறு என்ற மதிப்பீட்டுத் திறந்த தன்மையை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடை. தொடர்ச்சியாக வரும் நிபந்தனை வாக்கியங்களையும் அடுத்த வசனத்தை நோக்கி நீளும் நிறைவுறாத அமைப்பையும் இறுதி நீள்கோடு காக்கிறது.
