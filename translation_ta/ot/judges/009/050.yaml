source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ אֲבִימֶ֖לֶךְ אֶל תֵּבֵ֑ץ וַ/יִּ֥חַן בְּ/תֵבֵ֖ץ וַֽ/יִּלְכְּדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/050.yaml
  text: Then Abimelech went to Thebez[a], camped against Thebez, and captured it.
translation:
  language: ta
  text: பின்பு அபிமெலேக்கு தேபேசுக்குச் சென்று, தேபேசுக்கு எதிராக முகாமிட்டு[a], அதைக் கைப்பற்றினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேபேசில் முகாமிட்டான்”; எபிரெய முன்னிடைச்சொல்லை இன்னும் நேரடியாக இவ்வாறு மொழிபெயர்க்கலாம். ஆனால் இந்த இராணுவச் சூழலில், அவன் நகருக்கு எதிராக முகாமிட்டான் என்பதே பெரும்பாலும் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: சென்று
  rationale: הלך என்பதன் தொடர்கதை வடிவம் பொதுவாகச் ‘சென்றான்’ எனப் பொருள்படும்; மூல வினையில் வெளிப்படையாக இல்லாத இராணுவ நுட்பத்தைச் சேர்க்காமல் இயல்பான தமிழ் தொடரமைப்பிற்காக ‘சென்று’ பயன்படுத்தப்பட்டது.
- source_word: אֲבִימֶלֶךְ
  choice: அபிமெலேக்கு
  rationale: தனிப்பெயர் நவீனத் தமிழ் வேதாகமப் பயன்பாட்டிற்கு ஏற்ற ஒலிபெயர்ப்பில் தரப்பட்டது.
- source_word: אֶל
  choice: தேபேசுக்கு
  rationale: אֶל இங்கு ஓர் இடத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது; ஆகவே இலக்கைத் தெளிவுபடுத்தும் நான்காம் வேற்றுமை உருபு பயன்படுத்தப்பட்டது.
- source_word: תֵּבֵץ
  choice: தேபேசு
  rationale: எபிரெய இடப்பெயர் தமிழில் எளிதாக வாசிக்கத்தக்க, மரபுக்கு ஏற்ற ஒலிபெயர்ப்பில் வழங்கப்பட்டது.
- source_word: וַיִּחַן
  choice: முகாமிட்டு
  rationale: חנה என்பது முகாமிடுவதைக் குறிக்கிறது. அடுத்துள்ள בְּ மற்றும் இராணுவச் சூழலோடு சேர்ந்து, நகருக்கு எதிரான முற்றுகை நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּתֵבֵץ
  choice: தேபேசுக்கு எதிராக
  rationale: בְּ பொதுவாக ‘இல்’ என வரலாம்; ஆனால் நகரைக் கைப்பற்றும் இராணுவச் சூழலில் ‘எதிராக’ என்பது முகாமின் பகைமை நோக்கைத் தெளிவாகக் காட்டுகிறது. நேரடியான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: וַיִּלְכְּדָהּ
  choice: அதைக் கைப்பற்றினான்
  rationale: לכד ஒரு நகரைப் பிடித்தல் அல்லது கைப்பற்றுதல் என்பதைக் குறிக்கிறது; பெண்பால் ஒருமை பின்னொட்டு தேபேசு நகரத்தைக் குறிக்கிறது.
