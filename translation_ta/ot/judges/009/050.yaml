translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான வரலாற்றுக் கதைநடையும் கண்ணியமான பொதுமொழியும் பயன்படுத்தப்பட்டுள்ளன. ‘சென்று… முகாமிட்டு… கைப்பற்றினான்’ என்ற தொடரமைப்பு எபிரெய தொடர் நிகழ்வுகளை இயல்பான தமிழில் பிரதிபலிக்கிறது.
