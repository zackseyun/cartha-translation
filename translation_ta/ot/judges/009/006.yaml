translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமான ஆனால் சாதாரண வாசகருக்கும் எளிதில் புரியும் நடையில் அமைக்கப்பட்டது. எபிரெய மூலத்தின் தொடர் வினைநடையை தமிழில் இரண்டு வாக்கியங்களாகப் பிரித்து இயல்பாக்கியுள்ளோம். தெளிவில்லாத இடப்பெயர் மற்றும் landmark சொற்றொடர் அடிக்குறிப்புகளில் திறந்தவாறே வைக்கப்பட்டுள்ளன.
