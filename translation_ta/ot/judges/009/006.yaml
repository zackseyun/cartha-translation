  yaml_path: translation/ot/judges/009/006.yaml
  text: Then all the leaders of Shechem and all Beth-millo gathered together[b][a], and they went and made Abimelech king beside the oak pillar that was in Shechem.
translation:
  language: ta
  text: அப்போது செகேமின் தலைவர்கள் அனைவரும் மற்றும் பெத்-மில்லோவினர் அனைவரும்[b] ஒன்றுகூடினார்கள். அவர்கள் சென்று, செகேமிலிருந்த தூணின் கருவாலி மரத்தருகே[a] அபிமெலேக்கை அரசனாக்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தூணின் கருவாலி மரத்தருகே” என்பதற்கு “நிறுத்தப்பட்ட கல்லின் கருவாலி மரத்தருகே” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் கடினமானது; מֻצָּב என்பதன் துல்லியமான பொருள் உறுதியில்லை.
    reason: lexical_alternative
  - marker: b
    text: “பெத்-மில்லோ” என்பதற்கு “மில்லோவின் வீடு” என்று பொருள் இருக்கலாம்; ஆனால் இங்கு அது ஓர் இடத்தின் அல்லது மக்கள் குழுவின் பெயராகச் செயல்படுவதாகத் தெரிகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: בַּעֲלֵי שְׁכֶם
  choice: செகேமின் தலைவர்கள்
  rationale: בעלים என்பதன் அடிப்படைப் பொருள் ‘உரிமையாளர்கள்/எஜமானர்கள்’ என்றாலும், இங்குள்ள நகராட்சி-அரசியல் சூழலில் செகேமின் அதிகாரமுள்ள முன்னணியினரைக் குறிக்கிறது; ‘தலைவர்கள்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בֵּית מִלּוֹא
  choice: பெத்-மில்லோவினர்
  rationale: குறிப்பிடப்படுவது ஓர் இடமா, குலமா, குடும்பக் குழுவா என்பது உறுதியில்லை. பெயர்த்தெழுதி, -வினர் என்ற பின்னொட்டால் அந்தப் பெயருடன் தொடர்புடைய மக்களை இயல்பான தமிழில் குறிக்கிறது.
- source_word: וַיֵּאָסְפוּ
  choice: ஒன்றுகூடினார்கள்
  rationale: வினைச்சொல்லின் கூடி வருதல்/திரளுதல் என்ற கூட்டுச் செயலை நவீன இயல்பான தமிழில் தருகிறது.
- source_word: וַיַּמְלִיכוּ ... לְמֶלֶךְ
  choice: அபிமெலேக்கை அரசனாக்கினார்கள்
  rationale: מלך என்பதன் Hiphil வடிவம் ஒருவரை ஆட்சி செய்யச் செய்தல், அதாவது அரசனாக்குதல் என்பதைக் குறிக்கிறது. ‘முடிசூட்டினார்கள்’ என்று மொழிபெயர்த்தால் மூலத்தில் கூறப்படாத சடங்கைச் சேர்த்துவிடும்.
- source_word: עִם
  choice: அருகே
  rationale: இந்த இடச்சூழலில் ஒரு குறிப்பிடத்தக்க அடையாளத்தின் பக்கத்தில் அல்லது அருகில் என்பதைக் குறிக்கிறது.
- source_word: אֵלוֹן
  choice: கருவாலி மரம்
  rationale: இது பெரிய ஓக் அல்லது டெரிபிந்த் வகை மரத்தைக் குறிக்கலாம். ‘கருவாலி மரம்’ மரபான, வாசிக்க எளிய தேர்வு; துல்லியமான மரவகை உறுதியல்ல.
- source_word: מֻצָּב
  choice: தூண்
  rationale: נצב வேரிலிருந்து வந்த இச்சொல் நிறுத்தப்பட்ட அல்லது நிலைநிறுத்தப்பட்ட ஒன்றைக் குறிக்கிறது. இங்கு ஒரு தூண் அல்லது நிறுத்தப்பட்ட கல் போன்ற அடையாளமாக இருக்கலாம்; கடினமான எபிரெய சொற்றொடரை மிகையாக விளக்காமல் ‘தூண்’ பிரதிபலிக்கிறது.
