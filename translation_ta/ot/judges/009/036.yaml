  text: וַ/יַּרְא גַּעַל֮ אֶת הָ/עָם֒ וַ/יֹּ֣אמֶר אֶל זְבֻ֔ל הִנֵּה עָ֣ם יוֹרֵ֔ד מֵ/רָאשֵׁ֖י הֶ/הָרִ֑ים וַ/יֹּ֤אמֶר אֵלָי/ו֙ זְבֻ֔ל אֵ֣ת צֵ֧ל הֶ/הָרִ֛ים אַתָּ֥ה רֹאֶ֖ה כָּ/אֲנָשִֽׁים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/036.yaml
  text: When Gaal saw the people[a], he said to Zebul, “Look, people are coming down from the tops of the mountains.” But Zebul said to him, “You are seeing the shadow of the mountains as men.”
translation:
  language: ta
  text: கால் அந்த மக்களைக் கண்டபோது, செபூலிடம், “இதோ, மலைகளின் உச்சிகளிலிருந்து மக்கள் இறங்கி வருகிறார்கள்” என்றான். ஆனால் செபூல் அவனிடம், “மலைகளின் நிழலை மனிதர்களாக நீ பார்க்கிறாய்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மலைகளின் நிழல் மனிதர்களைப் போல இருப்பதாக நீ பார்க்கிறாய்.”
    reason: כָאֲנָשִׁים என்பதிலுள்ள כְּ ஒப்புமையை ‘மனிதர்களாக’ என்றும், ‘மனிதர்களைப் போல இருப்பதாக’ என்றும் மொழிபெயர்க்க முடியும். இரண்டாவது வடிவம் ஒப்புமையைத் தெளிவாக வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டபோது
  rationale: ראה என்பதன் எளிய கதைநடைப் பொருள் ‘கண்டான்’; அடுத்த செயலை இயல்பாக இணைக்கத் தமிழில் ‘கண்டபோது’ என வழங்கப்பட்டது.
- source_word: הָעָם / עָם
  choice: அந்த மக்கள் / மக்கள்
  rationale: עָם என்பது பொதுவாக ‘மக்கள்’ என்று பொருள்படும். சூழலில் வருவது படைவீரர்களாக இருக்கக்கூடும்; ஆயினும் எபிரெயச் சொல் அதை வெளிப்படையாகக் குறிப்பிடாததால் ‘மக்கள்’ எனவே வைக்கப்பட்டது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: நேரடிப் பேச்சில் கவனத்தை ஈர்க்கும் சொல்லாகவும், நவீனத் தமிழில் கண்ணியமான இயல்பான வடிவமாகவும் ‘இதோ’ பொருந்துகிறது.
- source_word: יוֹרֵד
  choice: இறங்கி வருகிறார்கள்
  rationale: வினைச்சொல் ஒருமையில் இருந்தாலும் עָם ஒரு கூட்டுப் பெயர். தமிழில் ‘மக்கள்’ என்பதுடன் பன்மை இயைபும், பேச்சாளரை நோக்கிய இயக்கத்தை உணர்த்த ‘இறங்கி வருகிறார்கள்’ என்பதும் இயல்பானது.
- source_word: מֵרָאשֵׁי הֶהָרִים
  choice: மலைகளின் உச்சிகளிலிருந்து
  rationale: רֹאשׁ இங்கு மலைகளின் மேற்பகுதி அல்லது உச்சியைக் குறிக்கிறது; பன்மையும் பாதுகாக்கப்பட்டது.
- source_word: צֵל הֶהָרִים
  choice: மலைகளின் நிழல்
  rationale: צֵל என்பதன் நேரடிப் பொருள் ‘நிழல்’; கண்ணால் தவறாகக் காண்பதாகச் செபூல் கூறும் சூழலுக்கும் இது பொருந்துகிறது.
- source_word: אַתָּה רֹאֶה כָּאֲנָשִׁים
  choice: மனிதர்களாக நீ பார்க்கிறாய்
  rationale: மலைகளின் நிழலை மனிதர்களாகத் தவறாகக் காண்கிறாய் என்ற ஒப்பீட்டை, கூடுதல் விளக்கம் சேர்க்காமல் இந்த வடிவம் தெரிவிக்கிறது.
- source_word: אֲנָשִׁים
  choice: மனிதர்கள்
  rationale: அணுகிவரும் மனித உருவங்களைக் குறிக்கும் பொதுவான, கண்ணியமான தமிழ் சொல். எபிரெயச் சொல்லின் மனித நபர்கள் என்ற கருத்தை இது இயல்பாகத் தருகிறது.
