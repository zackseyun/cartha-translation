translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. ‘படைவீரர்கள்’ என்று சூழலிலிருந்து ஊகித்துச் சேர்க்காமல், மூலத்தின் ‘மக்கள்’ என்ற பொதுத்தன்மை பாதுகாக்கப்பட்டது. அடிக்குறிப்பு குறியீடு அது சார்ந்த இரண்டாவது நேரடிப் பேச்சிலேயே வைக்கப்பட்டது.
