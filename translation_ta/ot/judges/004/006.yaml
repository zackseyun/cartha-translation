  text: 'She sent and summoned Barak son of Abinoam from Kedesh-naphtali, and said to him, “Has not the LORD, the God of Israel, commanded: ‘Go, draw up to Mount Tabor, and take with you ten thousand men from the sons of Naphtali and from the sons of Zebulun’?”'
translation:
  language: ta
  text: அவள் ஆளனுப்பி, அபினோவாமின் மகன் பாராக்கை நப்தலியிலுள்ள கேதேசிலிருந்து வரவழைத்து, அவனிடம், “இஸ்ரவேலின் கடவுளாகிய ஆண்டவர் இவ்வாறு கட்டளையிடவில்லையா? ‘நீ போய், தாபோர் மலையை நோக்கிப் படையெடுத்துச் செல்; நப்தலி மக்களிலும் செபுலோன் மக்களிலும் பத்தாயிரம் பேரை உன்னுடன் அழைத்துக்கொள்’” என்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: அவள் ஆளனுப்பி ... வரவழைத்து
  rationale: 'இரு வினைகளையும் இயல்பான தமிழில் வேறுபடுத்திக் காட்டுகிறது: செய்தி அனுப்புதல், பின்னர் அழைத்து வரச்செய்தல்.'
- source_word: קֶדֶשׁ נַפְתָּלִי
  choice: நப்தலியிலுள்ள கேதேஸ்
  rationale: இது நப்தலி பிரதேசத்திலுள்ள கேதேஸ் என்பதைத் தெளிவாக்கும் இயல்பான இடப்பெயர் அமைப்பு.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தெய்வீகப் பெயரைக் குறிக்கும் மரியாதைமிக்க, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் மரபுச் சொல்.
- source_word: וּמָשַׁכְתָּ בְּהַר תָּבוֹר
  choice: தாபோர் மலையை நோக்கிப் படையெடுத்துச் செல்
  rationale: משך என்பதன் அடிப்படைப் பொருள் ‘இழு/நீட்டு’ என்றாலும், இச்சூழலில் படையை அணிவகுத்து அல்லது நகர்த்திச் செல்வதைக் குறிக்கிறது; இலக்கான தாபோர் மலையையும் இயல்பாக இணைக்கிறது.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: பத்தாயிரம் பேர்
  rationale: எண்ணிக்கையைத் துல்லியமாகவும், தமிழ் வாசிப்பில் இயல்பாகவும் தருகிறது.
- source_word: מִבְּנֵי נַפְתָּלִי וּמִבְּנֵי זְבֻלוּן
  choice: நப்தலி மக்களிலும் செபுலோன் மக்களிலும்
  rationale: ‘மகன்கள்’ என்ற சொற்படி மொழிபெயர்ப்புக்குப் பதிலாக, கோத்திர மக்களைக் குறிக்கும் எபிரெய வழக்கைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: הֲלֹא என்ற கேள்வி வடிவம் கட்டளையின் அதிகாரத்தை எவ்வாறு தெரிவிக்கிறது
  choice: “... கட்டளையிடவில்லையா?”
  alternative: “... கட்டளையிட்டுள்ளார் அல்லவா?”
  rationale: எதிர்பார்க்கப்படும் உறுதிப்பாட்டைக் கொண்ட எபிரெய வினாவைத் தக்கவைத்து, தெபோரா புதிய கட்டளையைத் தானே வழங்குகிறாள் என்று பொருள் தீர்மானிக்காமல் விடுகிறது.
- issue: יהוה என்ற உடன்படிக்கைப் பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: மூலத்தில் தனிப்பெயர் இருப்பதை உணர்ந்தபடியே, நவீனத் தமிழ் வேதாகம வாசகர்களுக்கு மரியாதைமிக்கவும் எளிதில் அறியத்தக்கதாகவும் உள்ள பிரதிநிதிப் பெயரைப் பயன்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. எபிரெய வாக்கியத்தின் கேள்வி வடிவமும் மேற்கோளுக்குள் உள்ள தெய்வீகக் கட்டளையும் பாதுகாக்கப்பட்டுள்ளன.
