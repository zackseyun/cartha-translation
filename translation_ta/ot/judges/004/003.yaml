  text: וַ/יִּצְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה כִּ֠י תְּשַׁ֨ע מֵא֤וֹת רֶֽכֶב בַּרְזֶל֙ ל֔/וֹ וְ֠/הוּא לָחַ֞ץ אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל בְּ/חָזְקָ֖ה עֶשְׂרִ֥ים שָׁנָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/003.yaml
  text: Then the sons of Israel cried out to the LORD, because he had nine hundred iron chariots, and he oppressed the sons of Israel harshly for twenty years.
translation:
  language: ta
  text: அப்போது இஸ்ரவேல் மக்கள் ஆண்டவரை நோக்கிக் கூக்குரலிட்டார்கள்; ஏனெனில் அவனிடம் தொள்ளாயிரம் இரும்புப் போர்த்தேர்கள் இருந்தன. அவன் இஸ்ரவேல் மக்களை இருபது ஆண்டுகள் கடுமையாக ஒடுக்கினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்பதற்குப் பதிலாக, இங்கு முழு சமூகத்தையும் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: וַיִּצְעֲקוּ ... אֶל־יְהוָה
  choice: ஆண்டவரை நோக்கிக் கூக்குரலிட்டார்கள்
  rationale: צעק என்பதன் நெருக்கடியில் உதவி வேண்டிக் கதறும் வலிமையையும், אֶל என்பதன் நோக்குநிலையையும் காக்கிறது; יהוה மரியாதைக்குரிய வழக்குப்படி ‘ஆண்டவர்’ என வழங்கப்படுகிறது.
- source_word: רֶכֶב בַּרְזֶל
  choice: இரும்புப் போர்த்தேர்கள்
  rationale: ரֶכֶב இச்சூழலில் போருக்குரிய தேர்களைக் குறிக்கிறது; ‘இரும்பு’ என்ற மூலத்தின் விவரத்தைத் தீர்மானித்து விரிவாக்காமல் அப்படியே காக்கிறது.
- source_word: לָחַץ
  choice: ஒடுக்கினான்
  rationale: அழுத்துதல், நெருக்குதல், அடக்குமுறை செய்தல் ஆகிய பொருள்களில் இச்சூழலுக்கு இயல்பான ஆட்சிசார் ஒடுக்குமுறையைத் தெரிவிக்கிறது.
- source_word: בְחָזְקָה
  choice: கொடுமையாக
  rationale: வலிமையோடும் கடுமையோடும் ஒடுக்கிய விதத்தை இயல்பான தமிழில் தெரிவிக்கிறது; ஆங்கில ஆலோசனை உரையின் ‘harshly’ என்பதுடனும் ஒத்துள்ளது.
theological_decisions:
- issue: יהוה என்ற தேவப்பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யெகோவா / யாவே
  rationale: தேவப்பெயரைக் குறிக்கும் மரபான மரியாதை வடிவத்தைப் பயன்படுத்துகிறது; குறிப்பிட்ட உச்சரிப்பைத் தீர்மானிப்பதையோ சமயப் பிரிவுச் சார்பை இறக்குமதி செய்வதையோ தவிர்க்கிறது.
- issue: ‘அவனிடம்’ என்பதன் குறிப்பு
  choice: முந்தைய சூழலில் குறிப்பிடப்பட்ட பகை அரசனைச் சுட்டும் ஆண்பால் ஒருமையைப் பாதுகாத்தல்
  alternative: சீசெரா அல்லது யாபீன் என்று பெயரை உரைக்குள் சேர்த்தல்
  rationale: இந்த வசனத்தின் எபிரெய உரையில் பெயர் மீண்டும் வரவில்லை; ஆகவே சூழல் சார்ந்த பிரதிப்பெயரை விளக்கமாக மாற்றாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், அதேவேளை கண்ணியமான வேதாகம நடையில் அமைக்கப்பட்டது. எபிரெய வாக்கியத்தின் காரணத் தொடர்பும் இருபது ஆண்டுகள் நீடித்த ஒடுக்குமுறையின் வலிமையும் காக்கப்பட்டுள்ளன.
