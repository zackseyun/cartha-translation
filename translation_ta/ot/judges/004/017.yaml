- from: ஆனால்[a] சிசெரா, கேனியனான ஏபேரின் மனைவி யாகேலின் கூடாரத்திற்குக் கால்நடையாகத் தப்பியோடினான். ஏனெனில், ஆத்சோரின் அரசன் யாபீனுக்கும் கேனியனான ஏபேரின் வீட்டாருக்கும்[b] இடையே சமாதானம் இருந்தது.
