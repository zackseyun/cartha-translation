  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் எபிரேய ஒலிப்புக்கு நெருக்கமாகத் தமிழாக்கப்பட்டுள்ளன; ‘வீட்டார்’ போன்ற சொற்கள் பண்டைய சமூக அலகின் பொருளை இயல்பாக எடுத்துரைக்கின்றன.
