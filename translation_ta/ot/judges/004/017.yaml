base_translation:
  language: en
  yaml_path: translation/ot/judges/004/017.yaml
  text: But Sisera fled on foot to the tent of Jael[a], the wife of Heber the Kenite[b], because there was peace between Jabin king of Hazor and the house of Heber the Kenite.
translation:
  language: ta
  text: ஆனால்[a] சிசெரா, கேனியனான ஏபேரின் மனைவியான யாகேலின் கூடாரத்திற்குக் கால்நடையாக ஓடிப்போனான். ஏனெனில், ஆத்சோரின் அரசன் யாபீனுக்கும் கேனியனான ஏபேரின் வீட்டாருக்கும்[b] இடையே சமாதானம் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும் சிசெரா கால்நடையாக ஓடிப்போனான்.” எபிரேய இணைப்புச்சொல்லை எளிமையாக ‘மேலும்’ என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள ‘ஆனால்’ முந்தைய நிகழ்வுடன் காணப்படும் கதைநடை முரண்பாட்டைப் பிரதிபலிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: “ஏபேரின் வீட்டார்” என்பது ஏபேரின் குடும்பத்தார் அல்லது குலக் குழுவைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/סִֽיסְרָא֙
  choice: ஆனால் சிசெரா
  rationale: וְ என்பதற்கு பொதுவாக ‘மேலும்/அப்போது’ என்று பொருள் கொள்ளலாம்; இங்கு முந்தைய நிகழ்வுடன் உள்ள கதைநடை முரண்பாட்டை இயல்பான தமிழில் ‘ஆனால்’ வெளிப்படுத்துகிறது. மாற்று வாய்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: נָ֣ס
  choice: தப்பியோடினான்
  rationale: נס என்பதன் அடிப்படைப் பொருள் ஆபத்திலிருந்து ஓடித் தப்புதல். ‘தப்பியோடினான்’ என்பது சூழலையும் செயல்வேகத்தையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: בְּ/רַגְלָ֔י/ו
  choice: கால்நடையாக
  rationale: சொல்லர்த்தமாக ‘தன் கால்களால்’; தேரில் அல்லாமல் நடந்தோ ஓடியோ சென்றதைத் தமிழில் ‘கால்நடையாக’ தெளிவாகக் காட்டுகிறது.
- source_word: אֶל אֹ֣הֶל יָעֵ֔ל
  choice: யாகேலின் கூடாரத்திற்கு
  rationale: எபிரேய உடைமைத் தொடரை இயல்பான தமிழ் உடைமை அமைப்பில் தருகிறது.
- source_word: אֵ֖שֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י
  choice: கேனியனான ஏபேரின் மனைவி
  rationale: யாகேல் யார் என்பதை அடையாளப்படுத்தும் எபிரேய விளக்கத் தொடரைத் தெளிவாகவும் நேரடியாகவும் தருகிறது.
- source_word: כִּ֣י
  choice: ஏனெனில்
  rationale: சிசெரா அந்தக் கூடாரத்திற்குச் சென்றதற்கான காரணத்தை இச்சொல் அறிமுகப்படுத்துகிறது.
- source_word: שָׁל֗וֹם
  choice: சமாதானம்
  rationale: שָׁלוֹם இங்கு இரு தரப்பினரிடையேயான பகையற்ற, அமைதியான உறவைக் குறிக்கிறது. ‘சமாதானம்’ என்பது முறையான உடன்படிக்கை இருந்ததாக மிகையாகக் குறிப்பதில்லை.
- source_word: בֵּ֖ית חֶ֥בֶר הַ/קֵּינִֽי
  choice: கேனியனான ஏபேரின் வீட்டார்
  rationale: בֵּית என்பது இங்கு கட்டடத்தை அல்ல, ஏபேரைச் சேர்ந்த குடும்பத்தார் அல்லது குலக் குழுவைக் குறிக்கிறது; ‘வீட்டார்’ அந்த சமூகப் பொருளை இயல்பான தமிழில் தக்கவைக்கிறது.
