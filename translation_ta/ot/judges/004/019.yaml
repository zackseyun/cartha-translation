source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר אֵלֶ֛י/הָ הַשְׁקִי/נִי נָ֥א מְעַט מַ֖יִם כִּ֣י צָמֵ֑אתִי וַ/תִּפְתַּ֞ח אֶת נֹ֧אוד הֶ/חָלָ֛ב וַ/תַּשְׁקֵ֖/הוּ וַ/תְּכַסֵּֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/019.yaml
  text: And he said to her[a], “Please give me a little water to drink, for I am thirsty.” So she opened the skin of milk and gave him a drink and covered him.
translation:
  language: ta
  text: அவன் அவளிடம், “தயவுசெய்து, எனக்குக் குடிக்கக் கொஞ்சம் தண்ணீர் கொடு; எனக்குத் தாகமாக இருக்கிறது” என்றான். அவள் பால் இருந்த தோல் பையை[a]த் திறந்து, அவனுக்குக் குடிக்கக் கொடுத்து, அவனை மூடிவைத்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, விலங்குத் தோலால் செய்யப்பட்ட பால் வைக்கும் பை; இது இன்றைய பாட்டில் அல்ல.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁקִי/נִי
  choice: நான் குடிக்கக் ... கொடு
  rationale: שׁקה என்பதன் ஹிஃபில் கட்டளை வடிவமும் முதலாம் நபர் ஒருமை பின்னொட்டும் ‘எனக்குக் குடிக்கக் கொடு’ என்ற காரணவினைப் பொருளைக் கொண்டுள்ளன; தமிழில் இயல்பாக அமைய ‘நான் குடிக்கக் ... கொடு’ என வழங்கப்பட்டது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: கட்டளையை மென்மையான வேண்டுகோளாக்கும் மரியாதைத் துகள்; நவீனத் தமிழில் தெளிவான இயல்பான இணைச்சொல்.
- source_word: מְעַט מַיִם
  choice: கொஞ்சம் தண்ணீர்
  rationale: מְעַט சிறிய அளவைக் குறிக்கிறது; ‘கொஞ்சம் தண்ணீர்’ என்பது பொதுமக்களுக்கு இயல்பானதும் மூலத்தின் அளவுக் குறிப்பைத் தக்கவைப்பதும் ஆகும்.
- source_word: כִּי צָמֵאתִי
  choice: எனக்குத் தாகமாக இருக்கிறது
  rationale: வேண்டுகோளுக்கான காரணத்தை நேரடியாகவும் இயல்பான நவீனத் தமிழிலும் தெரிவிக்கிறது.
- source_word: נֹאוד הֶחָלָב
  choice: பாலிருந்த தோல் பை
  rationale: נֹאוד என்பது விலங்குத் தோலால் செய்யப்பட்ட பழங்காலத் திரவக் கொள்கலன்; அதன் உள்ளே பால் இருந்ததை construct தொடர் குறிக்கிறது. ‘தோல் பை’ கலாசாரப் பொருளைத் தக்கவைக்கிறது; ‘பாலிருந்த’ என்பது தமிழில் உறவைத் தெளிவாக்குகிறது.
- source_word: וַתַּשְׁקֵהוּ
  choice: அவனுக்குக் குடிக்கக் கொடுத்து
  rationale: שׁקה என்பதன் காரணவினைப் பொருளை இயல்பான தமிழில் தருகிறது. முந்தைய சொற்றொடர் பாலைச் சுட்டுவதால் ‘பால்’ என்பதை மீண்டும் சேர்க்கவில்லை.
- source_word: וַתְּכַסֵּהוּ
  choice: அவனை மூடினாள்
  rationale: כסה என்பதன் நேரடிப் பொருள் ‘மூடு/மறை’; எதனால் மூடினாள் என்பதை எபிரெயம் கூறாததால் தமிழிலும் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
