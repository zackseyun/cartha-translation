revisions:
- from: அவன் அவளிடம், “தயவுசெய்து, நான் குடிக்கக் கொஞ்சம் தண்ணீர் கொடு; எனக்குத் தாகமாக இருக்கிறது” என்றான். அவள் பாலிருந்த தோல் பையை[a]த் திறந்து, அவனுக்குக் குடிக்கக் கொடுத்து, அவனை மூடினாள்.
  to: அவன் அவளிடம், “தயவுசெய்து, எனக்குக் குடிக்கக் கொஞ்சம் தண்ணீர் கொடு; எனக்குத் தாகமாக இருக்கிறது” என்றான். அவள் பால் இருந்த தோல் பையை[a]த் திறந்து, அவனுக்குக் குடிக்கக் கொடுத்து, அவனை மூடிவைத்தாள்.
  rationale: The revision makes only safe idiomatic improvements. It preserves the request's causative sense, the small quantity of water, the contrast between requested water and supplied milk, and the Hebrew's lack of specification regarding the object used to cover him.
