base_translation:
  language: en
  yaml_path: translation/ot/judges/004/024.yaml
  text: And the hand of the sons of Israel went on[a], growing stronger against Jabin king of Canaan[c][b], until they cut off Jabin king of Canaan.
translation:
  language: ta
  text: இஸ்ரவேல் மக்களின்[a] கை, கானானின் அரசன் யாபீனுக்கு எதிராக மேலும் மேலும் ஓங்கிக்கொண்டே இருந்தது[b]; முடிவில் அவர்கள் கானானின் அரசன் யாபீனை அடியோடு அழித்தார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அவர்களுடைய வல்லமையும் யாபீன்மீதான அழுத்தமும் தொடர்ந்து அதிகரித்தன. எபிரேய வாசகம் ‘கை’ என்ற உருவகத்தையும் படிப்படியான தீவிரத்தையும் இணைக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரேய வினைச்சொல்லின் நேரடிப் பொருள் “துண்டித்துப்போட்டார்கள்”; இங்கு அவரைத் தீர்மானமாக ஒழித்ததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַד
  choice: கை
  rationale: எபிரெயச் சொல்லின் நேரடியான உருவகத்தைத் தக்கவைக்கிறது. தமிழில் ‘கை ஓங்குதல்’ என்பது வல்லமை மேலோங்குவதை இயல்பாக உணர்த்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: நேரடி வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַתֵּלֶךְ ... הָלוֹךְ וְקָשָׁה
  choice: மேலும் மேலும் ஓங்கிக்கொண்டே இருந்தது
  rationale: தொடர்ச்சியாக அதிகரித்த வலிமையையும் அழுத்தத்தையும் குறிக்கும் எபிரெய முன்னேற்றக் கட்டமைப்பை, ‘கை’ என்ற உருவகத்துடன் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל
  choice: எதிராக
  rationale: பகைமை மற்றும் மோதல் நிறைந்த இச்சூழலில் எதிர்திசை வல்லமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: הִכְרִיתוּ
  choice: அடியோடு அழித்தார்கள்
  rationale: כרת என்பதன் ஹிஃபில் வடிவம் ‘துண்டித்துப்போடுதல், ஒழித்தல்’ என்ற தீர்மானமான அழிவைக் குறிக்கிறது; தமிழில் ‘அடியோடு அழித்தார்கள்’ அந்த முடிவுறுத்தும் பொருளை இயல்பாகத் தருகிறது.
