base_translation:
  language: en
  yaml_path: translation/ot/judges/004/016.yaml
  text: And Barak pursued the chariots and the army as far as Harosheth of the nations[a], and all Sisera’s army fell by the edge of the sword[b]; not even one was left.
translation:
  language: ta
  text: பாராக் தேர்களையும்[a] படையையும் நாடுகளின் ஹரோஷேத்[b] வரை துரத்திச் சென்றான். சிசெராவின் படை முழுவதும் வாளின் கூரால் வீழ்ந்தது; ஒருவன்கூட எஞ்சவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேர்ப்படையையும்”; எபிரெயச் சொல் இங்கு கூட்டுப் பொருளில் இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் “நாடுகளின் ஹரோஷேத்”; மரபாக “ஹரோஷேத்-ஹக்கோயிம்” என்று ஒலிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָדַף אַחֲרֵי
  choice: துரத்திச் சென்றான்
  rationale: போர்ச் சூழலில் விடாமல் பின்தொடர்ந்து துரத்துவதைக் குறிக்கும் எபிரெய வினைச்சொல்–முன்னிடைச்சொல் தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָרֶכֶב
  choice: தேர்கள்
  rationale: இச்சொல் ஒருமை வடிவில் இருந்தாலும் இங்கு கூட்டுப் பொருளில் தேர்களையோ தேர்ப்படையையோ குறிக்கிறது; ‘தேர்கள்’ மூலத்தின் படிமத்தைத் தெளிவாக வைத்திருக்கிறது.
- source_word: הַמַּחֲנֶה
  choice: படை
  rationale: இப்போர்க் கதையில் முகாமிடும் இடத்தைவிடப் போரிடும் இராணுவப் படையையே குறிக்கிறது.
- source_word: עַד חֲרֹשֶׁת הַגּוֹיִם
  choice: நாடுகளின் அரோசேத் வரை
  rationale: עַד என்பதன் எல்லைப் பொருளை ‘வரை’ என்றும், இடப்பெயரின் חֲרֹשֶׁת கூறை ஒலிபெயர்த்தும், הַגּוֹיִם என்பதன் அடிப்படைப் பொருளான ‘நாடுகள்’ என்பதைத் தனியே வைத்தும் மொழிபெயர்க்கிறது.
- source_word: וַיִּפֹּל כָּל מַחֲנֵה סִיסְרָא
  choice: சிசெராவின் படை முழுவதும் ... வீழ்ந்தது
  rationale: கூட்டுப் பெயருடன் வரும் ஒருமை வினையைப் பேணி, போரில் முழுப் படையும் கொல்லப்பட்டதை ‘வீழ்ந்தது’ என்ற எபிரெயப் படிமத்துடன் வெளிப்படுத்துகிறது.
- source_word: לְפִי חֶרֶב
  choice: வாளின் கூர்முனையால்
  rationale: சொல்லுக்குச் சொல் ‘வாளின் வாயால்’ எனும் எபிரெய மரபுத்தொடர் போரில் வாளால் கொல்லப்படுவதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் வாளின் கூர்மை என்ற படிமத்தைப் பேணியும் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: לֹא נִשְׁאַר עַד אֶחָד
  choice: ஒருவன்கூட எஞ்சவில்லை
  rationale: ஒருவரும் தப்பிப் பிழைக்கவில்லை என்ற வலியுறுத்தப்பட்ட முழுமையை இயல்பான நவீனத் தமிழில் தருகிறது.
