source:
  edition: WLC
  text: וּ/דְבוֹרָה֙ אִשָּׁ֣ה נְבִיאָ֔ה אֵ֖שֶׁת לַפִּיד֑וֹת הִ֛יא שֹׁפְטָ֥ה אֶת יִשְׂרָאֵ֖ל בָּ/עֵ֥ת הַ/הִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/004.yaml
  text: Deborah, a woman, a prophetess, the wife of Lappidoth, was judging Israel at that time.
translation:
  language: ta
  text: தெபோரா, பெண் இறைவாக்கினரும் லப்பிதோத்தின் மனைவியுமானவர்[a], அக்காலத்தில் இஸ்ரவேலருக்கு நியாயம் வழங்கி வந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “லப்பிதோத்தின் மனைவி” என்பதற்கான எபிரெயச் சொற்றொடரை “தீப்பந்தங்களின் பெண்” அல்லது “சுடர்மிக்க பெண்” என்றும் புரிந்துகொள்ள வாய்ப்புள்ளது.
    reason: לַפִּידוֹת என்பது லப்பிதோத் என்ற ஆண்பெயராகவோ, ‘தீப்பந்தங்கள்’ என்னும் பொதுப்பெயராகவோ புரிந்துகொள்ளக்கூடிய மூலமொழி ambiguity-ஐப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: אִשָּׁה נְבִיאָה
  choice: பெண் இறைவாக்கினர்
  rationale: ‘பெண்’ என்பதையும் ‘இறைவாக்கினர்’ என்பதையும் வெளிப்படையாக வைத்திருந்து, எபிரெயச் சொல்லடுக்கின் வலியுறுத்தலைப் பாதுகாக்கிறது; நவீனத் தமிழில் மரியாதையும் இயல்பும் கொண்ட வடிவம்.
- source_word: אֵשֶׁת לַפִּידוֹת
  choice: லப்பிதோத்தின் மனைவி
  rationale: אֵשֶׁת என்பதன் வழக்கமான பொருள் ‘மனைவி’; לַפִּידוֹת என்பதை மரபுப்படி ஆண்பெயராக ஒலிபெயர்த்துள்ளது. சொற்றொடரின் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שֹׁפְטָה אֶת־יִשְׂרָאֵל
  choice: இஸ்ரவேலருக்கு நியாயம் வழங்கி வந்தாள்
  rationale: பெண்பால் தொடர்ச்சிச் செயலைக் குறிக்கும் எபிரெயப் பங்கேற்பு வடிவத்தை ‘வழங்கி வந்தாள்’ எனக் காட்டுகிறது; ‘இஸ்ரவேல்’ இங்கு மக்களைக் குறிப்பதால் இயல்பான தமிழில் ‘இஸ்ரவேலருக்கு’ என வழங்கப்பட்டுள்ளது.
- source_word: בָּעֵת הַהִיא
  choice: அக்காலத்தில்
  rationale: குறிப்பிட்ட அந்தக் காலத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தெபோராவின் நீதித்தீர்ப்பு வகித்த பங்கு
  choice: இஸ்ரவேலருக்கு நியாயம் வழங்கி வந்தாள்
  alternative: இஸ்ரவேலை ஆட்சி செய்து வந்தாள் / இஸ்ரவேலின் நியாயாதிபதியாக இருந்தாள்
  rationale: שפט என்ற வினையின் நீதிவழங்கும் கருத்தை நேரடியாக வைத்திருக்கிறது; அரசியல் ஆட்சி என்ற கருத்தை மட்டும் திணிக்காமலும், மூலத்தில் இல்லாத பதவிப் பெயராக மட்டும் மாற்றாமலும் உள்ளது.
- issue: אֵשֶׁת לַפִּידוֹת என்பதின் பொருள்
  choice: லப்பிதோத்தின் மனைவி
  alternative: தீப்பந்தங்களின் பெண் / சுடர்மிக்க பெண்
  rationale: இலக்கணத்திற்கும் பழமையான புரிதலுக்கும் ஏற்ற முதன்மை வாசிப்பு ‘லப்பிதோத்தின் மனைவி’; ஆயினும் לַפִּידוֹת என்பது ‘தீப்பந்தங்கள்’ என்றும் பொருள்படக்கூடியதால் அந்த உண்மையான மொழியியல் ஐயம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இறைவாக்கினர்’ பாலினத்தை மறைக்காத மரியாதை வடிவமாகவும், ‘நியாயம் வழங்கி வந்தாள்’ தொடர்ச்சியான நீதிச் செயலை இயல்பாகக் காட்டும் வடிவமாகவும் தேர்ந்தெடுக்கப்பட்டுள்ளன.
