base_translation:
  language: en
  yaml_path: translation/ot/judges/004/010.yaml
  text: Then Barak summoned Zebulun and Naphtali to Kedesh[a], and ten thousand men went up following him, and Deborah went up with him.
translation:
  language: ta
  text: அப்போது பாராக் செபுலோனையும் நப்தலியையும் கேதேசுக்கு அழைத்துத் திரட்டினார். பத்தாயிரம் ஆண்கள் அவரைப் பின்தொடர்ந்து[a] மேலே சென்றனர்; தெபோராளும் அவருடன் மேலே சென்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “அவருடைய காலடியில்”; இது அவரைப் பின்தொடர்ந்து அல்லது அவரது தலைமையில் சென்றதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: அழைத்துத் திரட்டினார்
  rationale: ஹிப்ஃபில் வடிவிலுள்ள זעק இங்கு போருக்காக மக்களை ஒன்றுகூட அழைப்பதைக் குறிக்கிறது. ‘அழைத்துத் திரட்டினார்’ என்பது முறையான கட்டாய ஆட்சேர்ப்பைச் சுட்டாமல் இரு கருத்துகளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶת זְבוּלֻן וְאֶת נַפְתָּלִי
  choice: செபுலோனையும் நப்தலியையும்
  rationale: இவை பாராக் அழைத்த இரண்டு கோத்திரங்களின் பெயர்கள்; தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: קֶדְשָׁה
  choice: கேதேசுக்கு
  rationale: இடப்பெயருடன் சேர்ந்த திசைகாட்டும் ה, கேதேசை நோக்கிய இயக்கத்தைக் குறிக்கிறது; ஆகவே ‘கேதேசுக்கு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּעַל
  choice: சென்றார்கள்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே போதல்’. தமிழில் இச்சூழலில் வெறும் நில உயர்வை வலியுறுத்தாமல் படையினர் நகர்ந்ததை ‘சென்றார்கள்’ என்பது இயல்பாகத் தெரிவிக்கிறது; அடுத்த கூறிலும் அதே வினை இயல்பாக ஒத்திசைக்கப்பட்டுள்ளது.
- source_word: בְּרַגְלָיו
  choice: அவரைப் பின்தொடர்ந்து
  rationale: சொல்லர்த்தமாக ‘அவருடைய காலடியில்’ என்றாலும், இங்கு பாராக்கின் தலைமையில் அவரைப் பின்தொடர்ந்து சென்றதைக் குறிக்கும் எபிரெய மரபுத்தொடர். வாசிப்புக்கு இயல்பான பொருள் முதன்மை உரையில் தரப்பட்டு, சொல்லர்த்தம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: עֲשֶׂרֶת אַלְפֵי אִישׁ
  choice: பத்தாயிரம் ஆண்கள்
  rationale: இது பத்தாயிரம் ஆண் போர்வீரர்களைக் குறிக்கும் நிலையான எண்ணிக்கைச் சொற்றொடர். ‘ஆண்கள்’ என்பது மூலத்தின் பாலினக் குறிப்பைத் தக்கவைக்கிறது.
- source_word: וַתַּעַל עִמּוֹ דְּבוֹרָה
  choice: தெபோராளும் அவருடன் சென்றாள்
  rationale: தெபோராள் பாராக்குடன் பயணம் செய்ததை நேரடியாகத் தெரிவிக்கிறது. ‘-உம்’ இணைப்பு அவளும் உடன் சென்றாள் என்ற மூலத்தின் வலியுறுத்தலை இயல்பாகத் தருகிறது.
