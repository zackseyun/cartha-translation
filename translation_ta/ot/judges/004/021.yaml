  source_fidelity: 'மொழிபெயர்ப்பு எபிரெயக் கதைவரிசையையும் முக்கியச் சொற்களையும் நன்றாகப் பின்பற்றுகிறது: கூடார ஆணி, சுத்தியல், ஓசையற்ற அணுகல், கன்னப்பொட்டு, ஆணி தரைக்குள் இறங்குதல், உறக்கம், சோர்வு ஆகியவை துல்லியமாக உள்ளன. எனினும் וַיָּמֹת என்பதன் சுருக்கமான நேரடித் தன்மைக்கு “இறந்தான்” என்பது “இறந்துபோனான்” என்பதைக் காட்டிலும் நெருக்கமானது.'
