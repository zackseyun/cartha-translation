base_translation:
  language: en
  yaml_path: translation/ot/judges/004/021.yaml
  text: Then Jael[a], the wife of Heber, took a tent peg and put a hammer in her hand, and she went to him quietly and drove the peg into his temple, and it went down into the ground. Now he was fast asleep and exhausted[b], and he died.
translation:
  language: ta
  text: 'பின்பு ஏபேரின் மனைவி யாகேல், ஒரு கூடார ஆணியை எடுத்து, சுத்தியலைக் கையில் பிடித்துக்கொண்டு, அவனிடம் ஓசையின்றி[a] வந்தாள். அந்த ஆணியை அவனுடைய கன்னப்பொட்டுக்குள் அடித்தாள்; அது தரைக்குள் இறங்கியது.[b] அவன் ஆழ்ந்து தூங்கிக்கொண்டிருந்தான், மிகவும் களைத்தும் இருந்தான்; அவன் இறந்தான்.


    [a] அல்லது, “மறைவாக.” எபிரெயச் சொல் ஓசையெழுப்பாமல், கவனத்தை ஈர்க்காத விதத்தில் அணுகுவதைக் குறிக்கிறது.


    [b] “அது” என்பது கூடார ஆணியைக் குறிப்பதாகப் பொருள்கொள்வது இயல்பானது. எபிரெய மொழியில் இங்கு வரும் வினைச்சொல் பெண்பால் வடிவில் இருப்பதால், பெண்பாலான “ஆணி” என்ற சொல்லுடன் அது பொருந்துகிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மறைவாக.” எபிரெயச் சொல் ஓசையெழுப்பாமல், கவனத்தை ஈர்க்காத விதத்தில் அணுகுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அது” என்பது கூடார ஆணியைக் குறிப்பதாகப் பொருள்கொள்வது இயல்பானது. எபிரெய மொழியில் இங்கு வரும் வினைச்சொல் பெண்பால் வடிவில் இருப்பதால், பெண்பாலான “ஆணி” என்ற சொல்லுடன் அது பொருந்துகிறது.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: יְתַד / הַיָּתֵד
  choice: கூடார ஆணி / அந்த ஆணி
  rationale: கூடாரத்தை நிலைநிறுத்தப் பயன்படும் ஆணியைக் குறிக்கிறது. “கூடார ஆணி” என்பது பொருளையும் காட்சியையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הַמַּקֶּבֶת
  choice: சுத்தியல்
  rationale: ஆணியை அடிக்கப் பயன்படும் கருவி; நவீனத் தமிழில் இயல்பான பொதுப்பெயர்.
- source_word: בְּיָדָהּ
  choice: கையில் பிடித்துக்கொண்டு
  rationale: கருவியைத் தன் கையில் வைத்திருந்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בַּלָּאט
  choice: ஓசையின்றி
  rationale: அவள் அமைதியாகவும் கவனத்தை ஈர்க்காமலும் அணுகிய விதத்தைத் தெரிவிக்கிறது; நோக்கத்தை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: וַתִּתְקַע
  choice: அடித்தாள்
  rationale: சுத்தியலாலும் ஆணியாலும் நிகழும் செயலைத் தமிழில் இயல்பாகக் குறிக்கிறது; ஆணி உள்ளே செலுத்தப்பட்ட வலிமையான செயலும் சூழலால் தெளிவாகிறது.
- source_word: בְּרַקָּתוֹ
  choice: அவனுடைய கன்னப்பொட்டுக்குள்
  rationale: רַקָּה என்பது தலையின் பக்கவாட்டிலுள்ள temple பகுதியைக் குறிக்கிறது. “கன்னப்பொட்டு” உடற்கூறைத் தெளிவாகக் காட்டுகிறது; ஆணி முழுதும் ஊடுருவியதாக உரைக்கு அப்பால் மிகைப்படுத்தவில்லை.
- source_word: וַתִּצְנַח בָּאָרֶץ
  choice: அது தரைக்குள் இறங்கியது
  rationale: பெண்பால் வினையின் இயல்பான எழுவாய் ஆணியே. எபிரெயக் கதைவரிசையைப் போல தனித்த தொடர்ச்சியான நிகழ்வாக மொழிபெயர்க்கப்பட்டுள்ளது; நோக்கம் அல்லது கால எல்லை சேர்க்கப்படவில்லை.
- source_word: נִרְדָּם
  choice: ஆழ்ந்து தூங்கிக்கொண்டிருந்தான்
  rationale: அவன் உறக்க நிலையில் இருந்ததைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיָּעַף
  choice: மிகவும் களைத்தும் இருந்தான்
  rationale: அவனுடைய கடும் சோர்வை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: וַיָּמֹת
  choice: அவன் இறந்துபோனான்
  rationale: எபிரெய உரையின் சுருக்கமான, நேரடியான முடிவைப் பாதுகாக்கிறது.
- source_word: אֵשֶׁת חֶבֶר
  choice: ஏபேரின் மனைவி
  rationale: எபிரெய அடைமொழியை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
