translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாவ்-தொடர் தமிழில் குறுகிய வாக்கியங்களாக இயல்பாக்கப்பட்டாலும் நிகழ்வுகளின் வரிசை காக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்புக் குறிகள் விளக்கும் சொற்களோடு பொருந்தாமல் இருந்ததால், [a] “ஓசையின்றி” என்பதற்குப் பின்னும் [b] ஆணி தரைக்குள் இறங்கியதற்குப் பின்னும் பொருள் சார்ந்து வைக்கப்பட்டுள்ளன.
