  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைத் திருப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இரதம்’, ‘படை’, ‘கலங்கடித்தார்’, ‘தப்பியோடினான்’ ஆகியவை போர்ச் சூழலின் வலிமையையும் மூலத்தின் தொடர்ச்சியான நிகழ்வோட்டத்தையும் பேணுகின்றன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
