  text: וַ/יָּ֣הָם יְ֠הוָה אֶת סִֽיסְרָ֨א וְ/אֶת כָּל הָ/רֶ֧כֶב וְ/אֶת כָּל הַֽ/מַּחֲנֶ֛ה לְ/פִי חֶ֖רֶב לִ/פְנֵ֣י בָרָ֑ק וַ/יֵּ֧רֶד סִֽיסְרָ֛א מֵ/עַ֥ל הַ/מֶּרְכָּבָ֖ה וַ/יָּ֥נָס בְּ/רַגְלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/015.yaml
  text: And Yahweh threw Sisera[a], all his chariots, and all his army into confusion before Barak by the sword[c][b]. Then Sisera got down from his chariot and fled on foot.
translation:
  language: ta
  text: யாவே சிசெராவையும்[a], அவனுடைய எல்லா இரதங்களையும், அவனுடைய படை முழுவதையும்[c], பாராக்கின் முன்னிலையில் வாளால்[b] குழப்பமடையச் செய்தார். அப்போது சிசெரா தன் இரதத்திலிருந்து இறங்கி, கால்நடையாகத் தப்பியோடினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிசெராவைப் போரில் முறியடித்தார்”; எபிரெய வினை போரில் பீதியையும் குழப்பத்தையும் உண்டாக்குவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “வாளின் வாயால்”; “வாளின் விளிம்பால்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “முகாம் முழுவதையும்” அல்லது “போர்ப்படை முழுவதையும்”; இங்கு முழுப் போர்ப்படையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּהָם
  choice: கலங்கடித்தார்
  rationale: போரில் பீதியையும் குழப்பத்தையும் உண்டாக்குதல் என்ற காரணவினைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; முழுமையான தோல்வி என்ற பொருளை வினைக்குள் தேவையின்றி சேர்க்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֶת סִיסְרָא וְאֶת כָּל הָרֶכֶב וְאֶת כָּל הַמַּחֲנֶה
  choice: சிசெராவையும், அவனுடைய எல்லா இரதங்களையும், அவனுடைய படை முழுவதையும்
  rationale: மூன்று நேரடிச் செயப்படுபொருட்களையும் தெளிவாகப் பேணுகிறது; சூழலில் இரதங்களும் படையும் சிசெராவின் போர்ப்படைகளைக் குறிக்கும் என்பதால் தமிழ் இயல்புக்கேற்ற உடைமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָרֶכֶב
  choice: அவனுடைய எல்லா இரதங்களையும்
  rationale: இந்தச் சொல்லின் தொகுப்புப் பொருளான இரதப்படையை, வாசகருக்கு எளிதாகப் புரியும் வகையில் ‘இரதங்கள்’ என்று தருகிறது.
- source_word: הַמַּחֲנֶה
  choice: அவனுடைய படை முழுவதையும்
  rationale: முகாம் அல்லது அணிவகுத்த படை என்ற சொல்லின் போர்ச் சூழல் பொருளை ‘படை’ என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְפִי חֶרֶב
  choice: வாளால்
  rationale: ‘வாளின் வாய்/முனை’ என்ற எபிரெய மரபுத்தொடரின் கருவிப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: לִפְנֵי בָרָק
  choice: பாராக்குக்கு முன்பாக
  rationale: பாராக்கின் முன்னிலையில் அல்லது அவன் முன்னேறிச் சென்றபோது நிகழ்ந்த செயலை மூலத்தின் இடத்தொடருக்கு நெருக்கமாக வெளிப்படுத்துகிறது.
- source_word: וַיֵּרֶד מֵעַל הַמֶּרְכָּבָה
  choice: தன் இரதத்திலிருந்து இறங்கி
  rationale: வாகனத்திலிருந்து இறங்குவதை நவீனத் தமிழில் இயல்பாகக் கூறுகிறது; சூழலுக்கேற்ற பிரதிபெயர் உடைமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיָּנָס בְּרַגְלָיו
  choice: கால்நடையாகத் தப்பியோடினான்
  rationale: இரதத்தை விட்டுவிட்டு காலால் தப்பிச் சென்றதைக் குறிக்கும் மரபுத்தொடரையும் அதன் அவசரத் தன்மையையும் தெளிவாகக் காட்டுகிறது.
