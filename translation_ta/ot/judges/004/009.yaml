base_translation:
  language: en
  yaml_path: translation/ot/judges/004/009.yaml
  text: And she said[a], “I will surely go with you. Nevertheless, the honor will not be yours on the way that you are going, for Yahweh will sell Sisera into the hand of a woman.” Then Deborah arose and went with Barak to Kedesh.
translation:
  language: ta
  text: அதற்கு அவள், “நான் நிச்சயமாக உன்னுடன் வருவேன். ஆனாலும், நீ செல்லும் வழியில் பெருமை உனக்குக் கிடைக்காது; ஏனெனில் யாவே சிசெராவை ஒரு பெண்ணின் கையில் ஒப்படைப்பார்[a]” என்றாள். பின்பு தெபோராள் எழுந்து, பாராக்குடன் கேதேசுக்குச் சென்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “யாவே சிசெராவை ஒரு பெண்ணின் கையில் விற்பார்.” இங்கு எபிரெய வழக்கில், ஒருவரின் அதிகாரத்தில் ஒப்படைப்பார் என்பது பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלֹךְ אֵלֵךְ
  choice: நான் நிச்சயமாக ... வருவேன்
  rationale: வினையெச்ச முழுவடிவமும் நிறைவுறா வினையும் சேர்ந்த அமைப்பு வலியுறுத்தலைக் குறிக்கிறது; இயல்பான நவீன தமிழில் ‘நிச்சயமாக’ அதை வெளிப்படுத்துகிறது.
- source_word: אֶפֶס
  choice: ஆனாலும்
  rationale: தெபோராளின் ஒப்புதலுக்கு ஒரு வரம்பை அறிமுகப்படுத்தும் எதிர்மறைத் திருப்பத்தை இயல்பாகக் காட்டுகிறது.
- source_word: תִּפְאַרְתְּךָ
  choice: பெருமை உனக்குக் கிடைக்காது
  rationale: இராணுவ வெற்றியால் கிடைக்கும் புகழ், மாண்பு அல்லது பெருமையை இங்கு குறிக்கிறது; ‘பெருமை’ பொதுவாசகருக்குத் தெளிவானது.
- source_word: עַל הַדֶּרֶךְ אֲשֶׁר אַתָּה הוֹלֵךְ
  choice: நீ போகும் இந்தப் பயணத்தில்
  rationale: எபிரெய மூலத்தின் வழி/பயணம் சார்ந்த உருவகத்தைப் பாதுகாத்தபடி தமிழில் இயல்பாக வழங்குகிறது.
- source_word: בְיַד אִשָּׁה
  choice: ஒரு பெண்ணின் கையில்
  rationale: ஒருவரின் அதிகாரத்திற்குள் ஒப்படைக்கப்படுவதைச் சுட்டும் எபிரெய மொழிப்படிமமான ‘கை’ என்பதைப் பாதுகாக்கிறது.
- source_word: יִמְכֹּר
  choice: விற்றுப்போடுவார்
  rationale: வினையின் அடிப்படைப் பொருளான ‘விற்றல்’ என்பதையும், எதிரியை மற்றொருவரின் அதிகாரத்தில் ஒப்படைக்கும் சூழலையும் காக்கிறது; இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַתָּקָם
  choice: எழுந்து
  rationale: கதைத் தொடர்ச்சியையும் புறப்படத் தொடங்கிய செயலையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: קֶדְשָׁה
  choice: கேதேசுக்கு
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, திசையைக் குறிக்கும் வேற்றுமை உருபுடன் வழங்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: சிசெராவை ஒரு பெண்ணிடம் ஒப்படைப்பதை விவரிக்கும் உருவகம்
  choice: ஒரு பெண்ணின் கையில் விற்றுப்போடுவார்
  alternative: ஒரு பெண்ணிடம் ஒப்படைப்பார்
  rationale: மூலத்தின் ‘விற்பார்’ என்ற வினையையும் ‘கையில்’ என்ற அதிகார உருவகத்தையும் முதன்மை உரையில் காத்து, அதன் இயல்பான பொருளை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியக்கூடியதாயினும் கண்ணியமான வேதாகமக் கதைநடை. மூலத்தின் வலியுறுத்தல், வழி/பயண உருவகம், ‘கை’ மற்றும் ‘விற்றல்’ ஆகிய மொழிப்படிமங்கள் முடிந்தவரை பாதுகாக்கப்பட்டுள்ளன.
