source:
  edition: WLC
  text: וְ/חֶ֤בֶר הַ/קֵּינִי֙ נִפְרָ֣ד מִ/קַּ֔יִן מִ/בְּנֵ֥י חֹבָ֖ב חֹתֵ֣ן מֹשֶׁ֑ה וַ/יֵּ֣ט אָהֳל֔/וֹ עַד אֵל֥וֹן ב/צענים אֲשֶׁ֥ר אֶת קֶֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/011.yaml
  text: Heber the Kenite had separated from the Kenites[a], from the sons of Hobab, the father-in-law of Moses, and had pitched his tent as far as the oak in Zaannannim[b], which is near Kedesh.
translation:
  language: ta
  text: கேனியனான ஏபேர், மோசேயின் மாமனாரான[a] ஓபாபின் வழிவந்த கேனியர்களிடமிருந்து பிரிந்து, கேதேசுக்கு அருகிலுள்ள சானன்னீமிலுள்ள கருவாலி மரம்[b] வரை தன் கூடாரத்தை அமைத்திருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மோசேயின் திருமண உறவினரான.’ எபிரெயச் சொல் ‘மாமனார்’ என்பதைவிட விரிவான உறவைக் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘டெரிபிந்த் மரம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְרָד
  choice: பிரிந்து
  rationale: நிஃபால் வடிவம் ஒரு குழுவிலிருந்து தனியே பிரிந்ததைக் குறிக்கிறது. இவ்வசனம் பின்னணித் தகவலை அளிப்பதால், இறுதியில் வரும் ‘அமைத்திருந்தான்’ என்பதுடன் சேர்ந்து முந்திய நிகழ்வை இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִקַּיִן / הַקֵּינִי
  choice: கேனியர்களிடமிருந்து / கேனியனான
  rationale: இச்சூழலில் இவை காயீன் என்ற தனிநபரை அல்ல, கேனிய இனக்குழுவைக் குறிக்கின்றன.
- source_word: מִבְּנֵי חֹבָב
  choice: ஓபாபின் வழிவந்த
  rationale: בְּנֵי என்பதன் நேர்ப்பொருள் ‘மகன்கள்’ என்றாலும், இங்கு ஓபாபின் குலவழியினரைக் குறிக்கிறது; ‘வழிவந்த’ என்பது நவீன தமிழில் அந்தப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: חֹתֵן מֹשֶׁה
  choice: மோசேயின் மாமனார்
  rationale: חֹתֵן பொதுவாகத் திருமண உறவினரையும், பல இடங்களில் குறிப்பாக மாமனாரையும் குறிக்கிறது. இச்சூழலில் மரபாகவும் பெரும்பாலும் ஏற்கப்படும் பொருள் ‘மாமனார்’; விரிவான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיֵּט אָהֳלוֹ
  choice: தன் கூடாரத்தை அமைத்திருந்தான்
  rationale: נטה אהל என்பது கூடாரத்தை விரித்து அமைப்பதைக் குறிக்கும் மரபுத்தொடர். பின்னணியில் ஏற்கெனவே நடந்த செயலைத் தமிழில் இயல்பாகக் காட்ட ‘அமைத்திருந்தான்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַד
  choice: வரை சென்று
  rationale: ஒரு இடம் வரையிலான நகர்வையும் எல்லையையும் குறிக்கும் עַד என்பதன் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵלוֹן
  choice: கருவாலி மரம்
  rationale: אֵלוֹן என்பது பெரிய கருவாலி அல்லது டெரிபிந்த் மரத்தைக் குறிக்கலாம். வாசகருக்கு எளிதான ‘கருவாலி மரம்’ முதன்மை உரையில் தரப்பட்டு, தாவரவியல் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בצענים
  choice: சானன்னீமின்
  rationale: உறுதியற்ற பொருளுடைய இடப்பெயரை மொழிபெயர்க்காமல், சானன்னீம் என ஒலிபெயர்க்கிறது.
- source_word: אֲשֶׁר אֶת קֶדֶשׁ
  choice: கேதேசுக்கு அருகிலுள்ள
  rationale: இந்த எபிரெயக் கட்டமைப்பு கேதேசுக்கு அருகாமையைக் குறிக்கிறது; தமிழில் பெயரெச்சத் தொடராக இயல்பாக வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: மோசேயுடன் חֹתֵן குறிக்கும் உறவு
  choice: மாமனார்
  alternative: திருமண உறவினர்
  rationale: இச்சொல் விரிவாகத் திருமண உறவினரைக் குறிக்கக்கூடும். எனினும், மோசே–ஓபாப் பற்றிய கதைச்சூழலில் ‘மாமனார்’ என்பது வழக்கமானதும் மிகச் சாத்தியமானதுமான பொருள். உறவுமுறை குறித்த தெளிவின்மையை மறைக்காமல் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயில் தனியான ‘இப்போது’ என்ற காலச்சொல் இல்லாததால் அத்தகைய தொடக்கச் சொல் சேர்க்கப்படவில்லை. ‘ஓபாபின் மகன்கள்’ என்ற சொற்சொல் வடிவுக்குப் பதிலாக இங்கு குலவழியைக் குறிக்கும் கருத்தைத் தெளிவுபடுத்த ‘ஓபாபின் வழிவந்த கேனியர்கள்’ என வழங்கப்பட்டுள்ளது.
