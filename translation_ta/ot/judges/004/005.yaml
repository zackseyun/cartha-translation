base_translation:
  language: en
  yaml_path: translation/ot/judges/004/005.yaml
  text: She used to sit under the palm of Deborah[a], between Ramah and Bethel in the hill country of Ephraim[b], and the sons of Israel went up to her for judgment.
translation:
  language: ta
  text: அவள் எப்பிராயீம் மலைநாட்டில், ராமாவுக்கும் பெத்தேலுக்கும் இடையில் இருந்த தெபோராளின் பேரீச்சமரத்தின்கீழ் வழக்கமாக அமர்ந்திருப்பாள். இஸ்ரவேல் மக்கள்[a] தீர்ப்புக்காக[b] அவளிடம் ஏறிச் செல்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “இஸ்ரவேலின் மகன்கள்.” இது இங்கு இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கும் வழக்குச் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: “நீதிக்காக” அல்லது “சட்டத் தீர்மானத்துக்காக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֶׁבֶת
  choice: எப்போதும் ... அமர்ந்திருப்பாள்
  rationale: எபிரெயப் பங்கேற்புவினை இச்சூழலில் தெபோராள் வழக்கமாக அமர்ந்து நீதி வழங்கிய இடத்தைக் குறிக்கிறது; ஒரு குறிப்பிட்ட தருணத்தை மட்டும் அல்ல.
- source_word: תַּחַת
  choice: கீழ்
  rationale: மரத்துக்கு அடியில் இருந்த இடத்தை இயல்பாகவும் நேரடியாகவும் குறிக்கிறது.
- source_word: תֹּמֶר דְּבוֹרָה
  choice: தெபோராளின் பேரீச்சமரம்
  rationale: இணைப்புத் தொடர் அந்த மரத்தை தெபோராளுடன் தொடர்புபடுத்துகிறது; அதை முறையான இடப்பெயராகக் கட்டாயப்படுத்தாமல் தமிழில் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: בֵּין הָרָמָה וּבֵין בֵּית אֵל
  choice: ராமாவுக்கும் பெத்தேலுக்கும் இடையே
  rationale: நிறுவப்பட்ட ஊர்ப் பெயர்களைப் பாதுகாத்து, எபிரெய இடைநிலைத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: בְּהַר אֶפְרָיִם
  choice: எப்பிராயீம் மலைநாட்டில்
  rationale: הַר இங்கு தனியொரு மலையைவிட மலைப்பாங்கான பிரதேசத்தைக் குறிக்கிறது.
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: அவளிடம் ஏறிச்செல்வார்கள்
  rationale: עלה என்பதிலுள்ள மேல்நோக்கிய அல்லது நிலவியல் இயக்கப் படிமத்தைப் பாதுகாக்கிறது; தொடர்ச்சியான நீதிப்பணி சூழலில் தமிழில் வழக்க நிகழ்வாகத் தரப்பட்டுள்ளது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்குச் சொல் 'இஸ்ரவேலின் மகன்கள்' என்றாலும், இங்கு அது ஆண்களை மட்டும் அல்லாது இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கும் வழக்குச் சொற்றொடர்; நவீன தமிழில் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לַמִּשְׁפָּט
  choice: நீதி விசாரணைக்காக
  rationale: מִשְׁפָּט இங்கு நீதித்தீர்ப்பு, வழக்குத் தீர்மானம் அல்லது நீதிநிர்வாகத்தைச் சுட்டுகிறது; 'நீதி விசாரணை' நீதிமன்றச் சூழலைத் தெளிவுபடுத்தி அகலப் பொருளையும் தக்கவைக்கிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினக் குறியுடைய கூட்டுச் சொற்றொடர்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய வடிவம் இலக்கணரீதியாக ஆண்பால் பன்மையாக இருந்தாலும் இவ்விடத்தில் உடன்படிக்கை மக்களை மொத்தமாகக் குறிக்கிறது. தமிழில் 'மகன்கள்' என்று கொடுத்தால் ஆண்கள் மட்டும் என்ற தவறான புரிதல் எழலாம்; அடிக்குறிப்பு மூலமொழி வடிவத்தை வெளிப்படுத்துகிறது.
- issue: לַמִּשְׁפָּט என்பதன் நீதியியல் பரப்பு
  choice: நீதி விசாரணைக்காக
  alternative: தீர்ப்புக்காக
  rationale: இந்தச் சொல் ஒரு தீர்ப்பின் முடிவை மட்டும் அல்லாமல் வழக்கை விசாரித்து நீதி வழங்குவதையும் குறிக்கலாம்; மொழிபெயர்ப்பு அந்தப் பரப்பை முற்றிலும் ஒடுக்கவில்லை, மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தெபோராளின் வழக்கமான அமர்வையும் இஸ்ரவேலர் வழக்கமாக அவளிடம் செல்வதையும் காட்ட எதிர்கால வழக்குநிலை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ஊர்ப் பெயர்கள் தமிழ் வேதாகம மரபுடன் ஒத்த ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன.
