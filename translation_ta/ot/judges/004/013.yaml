base_translation:
  language: en
  yaml_path: translation/ot/judges/004/013.yaml
  text: Then Sisera called together all his chariots[a], nine hundred iron chariots, and all the people who were with him, from Harosheth-haggoyim to the Wadi Kishon.
translation:
  language: ta
  text: அப்போது சிசெரா தன் தேர்கள் அனைத்தையும், இரும்புத் தேர்களான[a] தொள்ளாயிரம் தேர்களையும், தன்னுடன் இருந்த மக்கள் அனைவரையும் அரோசேத்-அக்கோயிமிலிருந்து கீசோன் ஓடைக்கு[b] அழைத்துத் திரட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இரும்புத் தேர்கள்”; இது இரும்புக் கூறுகளோ ஆயுதங்களோ பொருத்தப்பட்ட தேர்களைக் குறிக்கலாம்.
    reason: முதன்மை உரையில் மூலத்தின் நேரடி சொல்லாட்சியைத் தக்கவைத்தபடி, சாத்தியமான விளக்கத்தை வழங்குகிறது.
  - marker: b
    text: எபிரெயச் சொல் ஓடை, ஓடைப்படுகை, அல்லது பருவகால வெள்ளோடைப் பள்ளத்தாக்கைக் குறிக்கலாம்.
    reason: நַחַל என்பதன் புவியியல் பொருள் முழுமையாக ஒரு நிரந்தர ஆற்றுக்கு இணையானதல்ல என்பதைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: திரட்டினான்
  rationale: இச்சொல் பொதுவாகக் ‘கூக்குரலிடுதல்’ என்று பொருள்பட்டாலும், படைகளைக் குறிக்கும் நேரடிச் செயப்படுபொருள்களுடன் வரும் இப்போர்ச் சூழலில் அழைத்து ஒன்றுதிரட்டுவதைக் குறிக்கிறது.
- source_word: רִכְבּוֹ
  choice: தன் தேர்கள் அனைத்தையும்
  rationale: רכב என்பது மொத்தத் தேர்ப்படையையும் குறிக்கக்கூடும்; தொடர்ந்து வரும் ‘தொள்ளாயிரம் ... தேர்கள்’ என்ற விளக்கத்தால் இங்கு தேர்கள் எனக் கூறுவது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: תְּשַׁע מֵאוֹת רֶכֶב בַּרְזֶל
  choice: இரும்புப் பொருத்தப்பட்ட தொள்ளாயிரம் தேர்கள்
  rationale: ‘இரும்புத் தேர்கள்’ என்பது தேர்கள் முழுவதும் இரும்பால் ஆனவை என்ற தவறான எண்ணத்தைத் தரக்கூடும். எபிரெயச் சொற்றொடரின் சுருக்கத்தையும், இரும்புக் கூறுகள் அல்லது ஆயுதப் பொருத்தங்கள் இருந்திருக்கலாம் என்ற பொருளையும் இத்தேர்வு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: தன்னுடன் இருந்த மக்கள் அனைவரையும்
  rationale: עָם என்பதன் அடிப்படைப் பொருள் ‘மக்கள்’. இப்போர்ச் சூழலில் அவர்கள் படைவீரர்களாக இருக்கலாம்; ஆயினும் மூலத்தின் பொதுவான சொல்லைத் தக்கவைத்து, அந்தப் படைச் சார்பைச் சூழலே உணர்த்த அனுமதிக்கிறது.
- source_word: מֵחֲרֹשֶׁת הַגּוֹיִם
  choice: அரோசேத்-அக்கோயிமிலிருந்து
  rationale: இது ஓர் இடப்பெயர் என்பதால் மொழிபெயர்க்காமல் தமிழுக்கு ஏற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது; מִן முன்னொட்டு ‘இலிருந்து’ என வழங்கப்பட்டுள்ளது.
- source_word: נַחַל קִישׁוֹן
  choice: கீசோன் ஓடைக்கு
  rationale: נַחַל என்பது ஓடை, ஓடைப்படுகை, அல்லது பருவகால வெள்ளோடைப் பள்ளத்தாக்கைக் குறிக்கலாம். ‘ஓடை’ என்பது தமிழில் இயல்பாகவும், பெரிய நிரந்தர ஆறு என்ற மிகைத் தோற்றத்தைத் தவிர்ப்பதாகவும் உள்ளது.
