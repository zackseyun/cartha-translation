base_translation:
  language: en
  yaml_path: translation/ot/judges/004/018.yaml
  text: Jael went out to meet Sisera and said to him[a], “Turn aside, my lord, turn aside to me; do not be afraid.” So he turned aside to her into the tent[b], and she covered him with a blanket.
translation:
  language: ta
  text: யாகேல் சிசெராவைச் சந்திக்க வெளியே சென்று, அவனிடம்[a], “ஒதுங்குங்கள், ஐயா; என்னிடம் ஒதுங்குங்கள்; அஞ்சாதீர்கள்” என்றாள். அவன் அவளிடம் ஒதுங்கிக் கூடாரத்திற்குள் சென்றான்; அவள் அவனை ஒரு போர்வையால்[b] போர்த்தினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உள்ளே வாருங்கள், ஐயா; என்னிடம் உள்ளே வாருங்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “வழியிலிருந்து விலகுதல்” அல்லது “ஒதுங்குதல்”; ஒருவர் தன் பாதையைவிட்டு அடைக்கலத்திற்குச் செல்வதை இது சித்தரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள எபிரெயச் சொல் விரிப்பு அல்லது வேறு வகையான மூடும் துணியையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: வெளியே சென்று
  rationale: יצא என்பதன் அடிப்படைப் பொருளான வெளிய்நோக்கிய இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לִקְרַאת
  choice: சந்திக்க
  rationale: ஒருவரை நோக்கி நோக்கத்துடன் செல்வதை இச்சூழலில் இயல்பாகக் குறிக்கிறது.
- source_word: סוּרָה
  choice: திரும்பி வாரும்
  rationale: வழியிலிருந்து விலகித் தன்னிடம் வருமாறு அழைக்கும் பொருளைத் தக்கவைத்து, எபிரெயச் சொல்லின் இருமுறை கூறப்படுதலையும் பாதுகாக்கிறது.
- source_word: אֲדֹנִי
  choice: என் ஆண்டவனே
  rationale: சமூக நிலையில் உயர்ந்த ஆணிடம் காட்டப்படும் மரியாதையான விளிப்பைத் தருகிறது; இது தெய்வீகப் பட்டமாக இங்கு பயன்படுத்தப்படவில்லை.
- source_word: אַל תִּירָא
  choice: அஞ்ச வேண்டாம்
  rationale: பயப்பட வேண்டாம் என்ற தடைசார் உறுதியளிப்பைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וַיָּסַר
  choice: திரும்பி
  rationale: யாகேல் முன்பு பயன்படுத்திய סור என்ற வினையுடனான சொல் ஒற்றுமையைப் பாதுகாத்து, அவன் அவளுடைய அழைப்புக்கு இணங்கியதைக் காட்டுகிறது.
- source_word: הָאֹהֱלָה
  choice: கூடாரத்திற்குள் சென்றான்
  rationale: திசையைக் குறிக்கும் இறுதியுருபு கூடாரத்தை நோக்கிய இயக்கத்தைக் காட்டுகிறது; சூழலில் உள்ளே நுழைதல் தெளிவாக இருப்பதால் தமிழில் வெளிப்படையாகச் சொல்லப்பட்டுள்ளது.
- source_word: וַתְּכַסֵּהוּ
  choice: அவனை ... மூடினாள்
  rationale: כסה என்பதன் நேரடியான பொருளைத் தக்கவைக்கிறது; மறைத்தாள் என்பது சாத்தியமான விளைவாக இருந்தாலும் சொற்பொருளில் அதைச் சேர்க்கவில்லை.
- source_word: בַּשְּׂמִיכָה
  choice: ஒரு போர்வையால்
  rationale: மூடுவதற்கான துணியைக் குறிக்கும் அரிய சொல்லுக்கு, இச்செயலுடன் பொருந்தும் பொதுவாகப் புரியக்கூடிய நவீன தமிழ்ச் சொல்.
