translation_notes:
  register: நவீன தரத்தமிழில், கண்ணியமான வேதாகம நடையுடன் வடிவமைக்கப்பட்டது. யாகேலின் மரியாதை விளிப்பைத் தெரிவிக்க “என் ஆண்டவனே” என்றும், அழைப்பின் மீளுரையைத் தக்கவைக்க “திரும்பி வாரும்” என்பதும் இருமுறை பயன்படுத்தப்பட்டுள்ளன. அரிய மூடும் துணியின் துல்லிய வடிவம் உறுதியற்றதால் அடிக்குறிப்பில் மாற்றுப் பொருள்கள் தரப்பட்டுள்ளன.
