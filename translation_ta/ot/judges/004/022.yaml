translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பாராக் மற்றும் யாகேல் இடையிலான உரையாடலில் மரியாதை ஒருமை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் இரு וְהִנֵּה குறிகளும் ‘இதோ’ எனப் பாதுகாக்கப்பட்டுள்ளன; நிகழ்வின் வன்முறையை அதிகப்படுத்தவோ மென்மைப்படுத்தவோ செய்யவில்லை.
