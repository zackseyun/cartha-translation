base_translation:
  language: en
  yaml_path: translation/ot/judges/004/022.yaml
  text: And look, Barak was pursuing Sisera. Jael went out to meet him and said to him, “Come, and I will show you the man whom you are seeking.” So he went in to her, and look, Sisera was lying there dead, with the tent peg in his temple.
translation:
  language: ta
  text: இதோ, பாராக் சிசெராவைத் துரத்திக்கொண்டிருந்தான். யாகேல் அவனை எதிர்கொள்ள வெளியே சென்று, “வாரும்; நீர் தேடுகிற மனிதனை உமக்குக் காட்டுகிறேன்” என்று சொன்னாள். அவன் அவளுடைய கூடாரத்திற்குள் சென்றான். இதோ, சிசெரா இறந்து கிடந்தான்; கூடார முளை அவனுடைய கன்னப்பொட்டில் இருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: காட்சியின் திடீர் திருப்பத்தைக் கவனத்திற்குக் கொண்டுவரும் எபிரேய உரையாடல் குறியை இரு இடங்களிலும் சுருக்கமாகவும் இயல்பாகவும் பாதுகாக்கிறது.
- source_word: רֹדֵף
  choice: துரத்திக்கொண்டு வந்தான்
  rationale: நடந்துகொண்டிருந்த பின்தொடர்தலைக் காட்டும் நிகழ்காலப் பங்கேற்புச் சொல்லின் தொடர்ச்சியான செயற்பொருளையும், காட்சியை நோக்கி பாராக் வருவதையும் வெளிப்படுத்துகிறது.
- source_word: לֵךְ
  choice: வாரும்
  rationale: சொல்லுக்குச் சொல் 'செல்' என்றாலும், யாகேல் பாராக்கைத் தன்னுடன் உள்ளே வருமாறு அழைக்கும் சூழலில் தமிழின் இயல்பான அழைப்புக் கட்டளை இது.
- source_word: נֹפֵל מֵת
  choice: இறந்து கிடந்தான்
  rationale: சொல்லுக்குச் சொல் 'விழுந்தவனாய், இறந்தவனாய்' என்ற அமைப்பை, உடல் அங்கே கிடந்ததைக் காட்டும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: הַיָּתֵד
  choice: கூடார முளை
  rationale: முந்தைய நிகழ்வின் கருவி ஒரு கூடாரத்தை நிலைநிறுத்தப் பயன்படுத்தும் முளை என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְרַקָּתוֹ
  choice: அவனுடைய நெற்றிப்பொட்டில்
  rationale: רַקָּה என்பது தலையின் பக்கவாட்டிலுள்ள temple பகுதியைக் குறிக்கிறது; நவீன தமிழில் உடற்கூறு இடத்தைத் துல்லியமாகக் காட்டும் சொல்.
