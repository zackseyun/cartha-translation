  text: וַ/יַּכְנַ֤ע אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/ה֔וּא אֵ֖ת יָבִ֣ין מֶֽלֶךְ כְּנָ֑עַן לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/023.yaml
  text: So on that day God subdued Jabin king of Canaan before the sons of Israel[a].
translation:
  language: ta
  text: இவ்வாறு, அந்த நாளில் கடவுள் கானான் அரசனான யாபீனை இஸ்ரவேல் மகன்களுக்கு முன்பாக அடக்கினார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்” அல்லது “இஸ்ரவேலின் பிள்ளைகள்.” எபிரேய மூலத்தில் “இஸ்ரவேலின் மகன்கள்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְנַע
  choice: அடக்கினார்
  rationale: כנע என்பதன் ஹிஃபில் வடிவம் ஓர் எதிரியைத் தாழ்த்தி, கீழ்ப்படையச் செய்வதைக் குறிக்கிறது. இங்குள்ள இராணுவ-அரசியல் சூழலில் ‘அடக்கினார்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு இஸ்ரவேலின் கடவுளே வரலாற்றில் செயல்படும் ஒருமை எழுவாயாகத் தெளிவாகக் குறிப்பிடப்படுகிறார்.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்த நாளில்
  rationale: எபிரேய காலக் குறிப்பை இயல்பான நவீன தமிழில் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: אֵת יָבִין
  choice: யாபீனை
  rationale: אֵת நேர்முகச் செயப்படுபொருளைக் குறிக்கிறது; யாபீன் என்ற பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு வேற்றுமை உருபுடன் தரப்படுகிறது.
- source_word: מֶלֶךְ כְּנָעַן
  choice: கானான் அரசனான
  rationale: எபிரேய இணைநிலைத் தொடரான ‘கானானின் அரசன்’ என்பதை, யாபீனைக் குறிப்பாக அடையாளப்படுத்தும் இயல்பான தமிழ்ச் சொல்லமைப்பில் தருகிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: இஸ்ரவேல் மக்களோடு தொடர்புடைய வெளிப்படையான தோல்வி அல்லது அவர்களுக்கு எதிராக ஏற்பட்ட கீழ்ப்படுத்தலைக் குறிக்கும் மூலமொழியின் உறவைத் தீர்மானித்துவிடாமல் காக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: மூல எபிரேயத்தின் சொற்படியான பாலினக் குறிப்புள்ள ‘இஸ்ரவேலின் மகன்கள்’ என்ற வெளிப்பாட்டைத் தக்கவைக்கிறது; வாக்கியத்தில் ‘மகன்களுக்கு’ என வேற்றுமை உருபு பெறுகிறது.
theological_decisions:
- issue: இஸ்ரவேலின் வெற்றியில் கடவுளின் நேரடி செயற்பாடு
  choice: யாபீனை அடக்கியவர் கடவுள் என்று நேரடி எழுவாயாகக் கூறுதல்
  alternative: இஸ்ரவேலின் இராணுவ வெற்றியை மட்டும் முன்னிறுத்தும் ஆளில்லா அல்லது மனித மையமான மொழிபெயர்ப்பு
  rationale: எபிரேய வசனத்தில் אֱלֹהִים வினையின் வெளிப்படையான எழுவாய். ஆகவே கடவுளின் செயற்பாட்டை மறைக்காமல் மொழிபெயர்க்க வேண்டும்.
- issue: உடன்படிக்கை மக்களைக் குறிக்கும் பாலினமுள்ள சொற்றொடர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்; இஸ்ரவேலின் பிள்ளைகள்
  rationale: மூலத்தில் בְּנֵי יִשְׂרָאֵל என்பது ஆண்பால் பன்மையில் உள்ளது. அந்தச் சொற்றொடரை முதன்மை உரையில் காத்து, இயல்பான மாற்றுகளை அடிக்குறிப்பில் தருவது மூலத்தின் வடிவத்தையும் பொருளையும் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘அவ்வாறே’ என்பது முந்தைய நிகழ்வின் விளைவை இவ்வசனத்துடன் இணைக்கிறது; ‘அடக்கினார்’ இராணுவ-அரசியல் கீழ்ப்படுத்தலைத் தெளிவாகச் சொல்கிறது. மூலத்தின் பாலினமுள்ள சொற்றொடர் முதன்மை உரையில் பாதுகாக்கப்பட்டு, பொதுவான மாற்றுகள் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளன.
