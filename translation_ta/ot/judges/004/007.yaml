  source_fidelity: 'மூல எபிரெயத்தின் கூறுகள் அனைத்தும் உள்ளன: சிசெரா, யாபீனின் படைத்தளபதி என்ற அவனது பொறுப்பு, தேர்கள், அவனுடைய பெருந்திரள், கீசோன் நஹால், மற்றும் ‘உன் கையில் கொடுப்பேன்’ என்ற ஒப்புவிப்பு உருவகம். ஆனால் ‘அவனுடன் இருக்கும் பெருந்திரள்’ என்பது הֲמוֹנוֹ (‘அவனுடைய பெருந்திரள்/கூட்டம்’) என்பதிலுள்ள உடைமையைக் ‘உடன் இருப்பவர்’ என்ற உறவாக மாற்றுகிறது. அதனை நேரடியாகத் தருவது பாதுகாப்பானது.'
  naturalness: ‘கீசோன் நீரோடைக்கு உன்னிடம் இழுத்துவருவேன்’ என்ற இரட்டை இடத்தொடர் நவீனத் தமிழில் சற்றுக் கடினமாக உள்ளது. ‘கீசோன் நீரோடையில் உன்னிடம் இழுத்துக்கொண்டு வருவேன்’ என்பது இலக்கிடத்தின் சூழலில் பாராக்கிடம் கொண்டுவரப்படுதலை இயல்பாக வெளிப்படுத்துகிறது. ‘இழுத்துக்கொண்டு வருவேன்’ மூல வினையின் உருவக வலிமையையும் காக்கிறது.
