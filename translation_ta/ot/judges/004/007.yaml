translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இழுத்துவருவேன்’ மற்றும் ‘உன் கையில் கொடுப்பேன்’ ஆகியவை மூல எபிரெயத்தின் உருவகங்களைத் தெளிவாகப் பேணுகின்றன. அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சொற்களுடன் பொருந்துமாறு அமைக்கப்பட்டுள்ளன.
