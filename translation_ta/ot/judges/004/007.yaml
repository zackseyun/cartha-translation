  to: யாபீனின் படைத்தளபதியான சிசெராவையும், அவனுடைய தேர்களையும், அவனுடைய பெருந்திரளையும்[b] கீசோன் நீரோடையில்[a] உன்னிடம் இழுத்துக்கொண்டு வருவேன்; அவனை உன் கையில் கொடுப்பேன்.”
