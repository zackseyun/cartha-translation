base_translation:
  language: en
  yaml_path: translation/ot/judges/004/007.yaml
  text: And I will draw Sisera[a], the commander of Jabin’s army, along with his chariots and his multitude, to you at the Wadi Kishon[b], and I will give him into your hand.
translation:
  language: ta
  text: யாபீனின் படைத்தளபதியான சிசெராவையும், அவனுடைய தேர்களையும், அவனுடைய பெருந்திரளையும்[b] கீசோன் நீரோடையில்[a] உன்னிடம் இழுத்துக்கொண்டு வருவேன்; அவனை உன் கையில் கொடுப்பேன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கீசோன் ஆற்றில்” அல்லது “கீசோன் வெள்ளப்பள்ளத்தாக்கில்” என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள எபிரெயச் சொல் நீரோடை, பருவகால ஓடைப்படுகை அல்லது வெள்ளம் பாயும் பள்ளத்தாக்கைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “அவனுடைய படையினரையும்” அல்லது “அவனுடைய படையையும்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் இதைவிடப் பரந்த பொருளில், சொல்லுக்குச் சொல் “அவனுடைய பெருந்திரள்” என உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁכְתִּי
  choice: இழுத்துவருவேன்
  rationale: מָשַׁךְ என்பதன் ‘இழு/ஒரு திசையை நோக்கி வரச்செய்’ என்ற உருவக வலிமையைப் பேணுகிறது; ‘வஞ்சித்து வரவழைப்பேன்’ என்று மூலத்தில் வெளிப்படையாக இல்லாத நோக்கத்தைச் சேர்க்கவில்லை.
- source_word: אֵלֶיךָ
  choice: உன்னிடம்
  rationale: பாராக்கை நோக்கிய இயக்கத்தை இயல்பான நவீனத் தமிழில் நேரடியாகக் குறிக்கிறது.
- source_word: אֶל נַחַל קִישׁוֹן
  choice: கீசோன் நீரோடைக்கு
  rationale: נַחַל என்பது ஆறு மட்டுமல்லாமல் பருவகால நீரோடை, ஓடைப்படுகை அல்லது வெள்ளப்பள்ளத்தாக்கையும் குறிக்கலாம். முதன்மை உரையில் வாசிக்க எளிய ‘நீரோடை’ பயன்படுத்தப்பட்டு, அதன் பரந்த நிலவியல் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: סִיסְרָא
  choice: சிசெரா
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: שַׂר צְבָא יָבִין
  choice: யாபீனின் படைத்தளபதி
  rationale: שַׂר־צָבָא என்பதன் இராணுவத் தலைமைப் பொறுப்பை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: רִכְבּוֹ
  choice: அவனுடைய தேர்கள்
  rationale: இங்கு רֶכֶב கூட்டுப்பொருளில் தேர்களையோ தேர்ப்படையையோ குறிக்கிறது; ‘தேர்கள்’ நேரடியும் இயல்பானதுமாக உள்ளது.
- source_word: הֲמוֹנוֹ
  choice: அவனுடன் இருக்கும் பெருந்திரள்
  rationale: הָמוֹן என்பதன் பரந்த ‘திரள்/கூட்டம்’ என்ற பொருளைப் பேணுகிறது; அதைத் திட்டவட்டமாக ‘படை’ என்று மட்டும் சுருக்கவில்லை. ‘அவனுடன் இருக்கும்’ என்பது தமிழில் உடைமைத் தொடரை இயல்பாக்குகிறது.
- source_word: וּנְתַתִּיהוּ בְּיָדֶךָ
  choice: அவனை உன் கையில் கொடுப்பேன்
  rationale: ஒருவரை மற்றொருவரின் அதிகாரத்திற்குள் ஒப்புவிப்பதைக் குறிக்கும் எபிரெய உருவகத்தைப் பேணும் தெளிவான தமிழ் நடை.
