source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/אֵה֖וּד מֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh after Ehud died[a].
translation:
  language: ta
  text: 'ஏகூத் இறந்தபின், இஸ்ரவேலின் மகன்கள்[a] மீண்டும் யாவேயின் பார்வையில் தீமையானதைச் செய்தார்கள்.


    [a] அதாவது, “இஸ்ரவேலர்கள்.” எபிரெய மொழியில், “இஸ்ரவேலின் மகன்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, “இஸ்ரவேலர்கள்.” எபிரெய மொழியில், “இஸ்ரவேலின் மகன்கள்.”
    reason: மூல எபிரெயத் தொடரின் சொற்சொல் வடிவத்தையும் அதன் இயல்பான தமிழ்க் கூட்டுப்பொருளையும் ஒருசேர காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: மீண்டும் ... செய்தார்கள்
  rationale: יסף என்பதுடன் தொடர்ந்து வரும் வினையெச்சம் இங்கு முந்தைய தீய நடத்தைக்குத் திரும்புவதைச் சுட்டுகிறது. நீதித்தலைவர்கள் நூலின் சுழற்சி அமைப்பில் “மீண்டும்” என்பது இயல்பானவும் துல்லியமானவும் உள்ள தமிழாக்கம்.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயத் தொடரின் ஆண்பால் பன்மை வடிவத்தையும் அதன் பிரதிநிதித்துவக் கூட்டுப்பொருளையும் முதன்மை உரை வெளிப்படையாகக் காக்கிறது; இயல்பான கூட்டுப்பெயரான “இஸ்ரவேலர்கள்” அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לַעֲשׂוֹת הָרַע
  choice: தீமையானதைச் செய்தார்கள்
  rationale: குறிப்பிட்ட பெயரடையாக வரும் הָרַע, “தீமையானது/தீமையானதை” என்ற பொருளில் உள்ளது. தமிழில் வினைத்தொடராக இதை வழங்குவது இயல்பாகவும் மூலத்தின் நெறித் தீர்ப்பைத் தெளிவாகவும் காக்கிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: “யாவேயின் கண்களில்” என்ற சொற்சொல் வடிவம் தமிழில் செயற்கையாக இருக்கும்; “பார்வையில்” என்பது மூல உருவகத்தைப் போதுமான அளவு காத்து, நவீன தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், Yahweh என்பதற்குரிய தமிழ்த் திரிபெழுத்தாக்கமாக வழங்குகிறது.
- source_word: וְאֵהוּד מֵת
  choice: ஏகூத் இறந்தபின்
  rationale: முறையாக இது “ஏகூத் இறந்தார்/இறந்திருந்தார்” என்று இணைக்கப்பட்ட கூற்று. ஆனால் கதைச் சூழலில் இஸ்ரவேலர் மீண்டும் தீமை செய்ததற்கான காலப் பின்னணியைத் தருவதால், தமிழில் “இறந்தபின்” என்று இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் தமிழாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரை ஒரு பட்டத்தை அல்ல, தெய்வீகத் தனிப்பெயரைப் பயன்படுத்துகிறது. ஆகவே அந்தப் பெயரைத் தமிழில் ஒலிபெயர்த்து, பெயர்-பட்டை வேறுபாடு காக்கப்படுகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற ஆண்பால் கூட்டுக் குறிப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள்; இஸ்ரவேல் மக்கள்
  rationale: மூலத்தின் இலக்கண வடிவம் முதன்மை உரையில் காக்கப்படுகிறது; இங்கு அது ஆண்களை மட்டும் அல்ல, இஸ்ரவேல் சமூகத்தைப் பிரதிநிதித்துவமாகக் குறிக்கிறது என்பதை இயல்பான மாற்றுச் சொல்லுடன் அடிக்குறிப்பு விளக்குகிறது.
- issue: וְאֵהוּד מֵת என்பதன் கதைத் தொடர்பு
  choice: ஏகூத் இறந்தபின்
  alternative: ஏகூத் இறந்தார்; ஏகூத் இறந்திருந்தபோது
  rationale: எபிரெய இணைப்புச் சொல் பலவகை உரைத் தொடர்புகளைத் தாங்கலாம். இச்சூழலில் ஏகூத்தின் மரணத்துக்குப் பின் நிகழ்ந்த மறுபடியான வீழ்ச்சியே நோக்கமாக இருப்பதால் காலத் தொடர்பு இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது; காரணத் தொடர்பு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. “மீண்டும்” என்பது நீதித்தலைவர்கள் நூலின் மறுமுறை வீழ்ச்சி வடிவத்தைத் தெளிவாக்குகிறது. “யாவேயின் பார்வையில்” என்பது எபிரெய உருவகத்தை இயல்பான தமிழில் காக்கிறது. அடிக்குறிப்பு குறியீடு அது விளக்கும் சொற்றொடருக்குப் பின்பே வைக்கப்பட்டுள்ளது.
