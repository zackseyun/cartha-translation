  text: וַ/יֹּ֤אמֶר אֵלֶ֨י/הָ֙ בָּרָ֔ק אִם תֵּלְכִ֥י עִמִּ֖/י וְ/הָלָ֑כְתִּי וְ/אִם לֹ֥א תֵלְכִ֛י עִמִּ֖/י לֹ֥א אֵלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/008.yaml
  text: Barak said to her[a], “If you will go with me, I will go; but if you will not go with me, I will not go.”
translation:
  language: ta
  text: பாராக் அவளிடம், “நீ என்னுடன் சென்றால், நான் செல்வேன்; நீ என்னுடன் செல்லாவிட்டால், நான் செல்லமாட்டேன்” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, மேலும் சொற்சார்பாக: “நீ என்னுடன் போனால், நான் போவேன்; நீ என்னுடன் போகாவிட்டால், நான் போகமாட்டேன்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ בָּרָק
  choice: பாராக் அவளிடம் ... என்றான்
  rationale: எபிரெயக் கதையுரையில் நேரடிப் பேச்சை அறிமுகப்படுத்தும் இயல்பான அமைப்பு. אֵלֶיהָ என்பதன் பெண்பால் ஒருமைச் சுட்டு, சூழலில் தெபோராளைக் குறிக்கிறது.
- source_word: אִם תֵּלְכִי עִמִּי
  choice: நீ என்னுடன் வந்தால்
  rationale: הלך என்பதன் அடிப்படைப் பொருள் ‘போ/செல்’ என்றாலும், பேச்சாளருடன் உடன்செல்லுமாறு கூறும் தமிழ்ச் சூழலில் ‘என்னுடன் வந்தால்’ என்பது இயல்பானது; תֵּלְכִי என்பது பெண்பால் ஒருமையில் தெபோராளை நோக்கிப் பேசுகிறது.
- source_word: וְהָלָכְתִּי
  choice: நான் போவேன்
  rationale: நிபந்தனைத் தொடரின் விளைவைத் தெரிவிக்கும் வினை; தமிழில் எதிர்கால வடிவம் இயல்பாகப் பொருளைத் தருகிறது.
- source_word: וְאִם לֹא תֵלְכִי עִמִּי
  choice: நீ என்னுடன் வராவிட்டால்
  rationale: முந்தைய நிபந்தனைக்கு நேர்மாறான நிபந்தனை. தமிழில் ‘வராவிட்டால்’ எதிர்மறையையும் நிபந்தனையையும் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: לֹא אֵלֵךְ
  choice: நான் போகமாட்டேன்
  rationale: பாராக்கின் மறுப்பை நேரடியாக வெளிப்படுத்தும் இயல்பான நவீனத் தமிழ் எதிர்மறை எதிர்கால வடிவம்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதையுரை. உடன்செல்லுதலைக் குறிக்கும் இடங்களில் தமிழின் பார்வைநிலைக்கேற்ப ‘வந்தால்/வராவிட்டால்’ பயன்படுத்தப்பட்டுள்ளது; அதற்கான சொற்சார்ந்த ‘போனால்/போகாவிட்டால்’ மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
