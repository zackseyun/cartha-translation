base_translation:
  language: en
  yaml_path: translation/ot/judges/004/002.yaml
  text: So Yahweh sold them into the hand of Jabin king of Canaan[a], who reigned in Hazor; and the commander of his army was Sisera[b], who lived in Harosheth-haggoyim.
translation:
  language: ta
  text: எனவே யாவே அவர்களைக் கானானின் அரசனாகிய யாபீனின் கையில் விற்றார்[a]. அவன் ஹாசோரில் ஆட்சி செய்தான். அவனுடைய படைத்தலைவன் சிசெரா; சிசெரா ஹரோசேத்-ஹக்கோயிமில் குடியிருந்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கையில் விற்றார்” என்பது எபிரெய மொழியின் உருவகச் சொற்றொடர்; யாவே அவர்களை யாபீனின் அதிகாரத்துக்கு ஒப்படைத்தார் என்பதே பொருள்.
    reason: lexical_alternative
  - marker: b
    text: “ஹரோசேத்-ஹக்கோயிம்” என்பதற்கு “நாடுகளின் ஹரோசேத்” என்று பொருள் இருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְכְּרֵם
  choice: அவர்களை விற்றுப்போட்டார்
  rationale: מָכַר என்பதன் அடிப்படைப் பொருள் ‘விற்றல்’. நியாயாதிபதிகள் நூலில் இது உடன்படிக்கைத் தீர்ப்பாக இஸ்ரவேலை ஒடுக்குபவர்களின் அதிகாரத்துக்கு ஒப்படைப்பதைக் குறிக்கும் உருவகம்; அந்த உருவகத்தின் கடுமையைத் தமிழிலும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கு எழுத்துப் பெயர்; பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּיַד
  choice: கையில்
  rationale: ஒருவருடைய அதிகாரத்துக்குள் ஒப்படைக்கப்படுதல் என்ற எபிரெய வழக்குச் சொல்லின் ‘கை’ உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: יָבִין מֶלֶךְ כְּנַעַן
  choice: கானானின் அரசனாகிய யாபீன்
  rationale: பெயரையும் அரசப் பதவியையும் தெளிவாக இணைக்கும் இயல்பான தமிழ் அமைப்பு.
- source_word: אֲשֶׁר מָלַךְ בְּחָצוֹר
  choice: அவன் ஆத்சோரில் ஆட்சி செய்தான்
  rationale: מָלַךְ என்பதன் அரசனாக ஆளுதல் என்ற குறிப்பான பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: וְשַׂר צְבָאוֹ
  choice: அவனுடைய படைத்தலைவன்
  rationale: שַׂר צָבָא என்பது படையின் தலைமை அதிகாரியைக் குறிக்கிறது; ‘படைத்தலைவன்’ நவீன தமிழில் சுருக்கமும் தெளிவும் உடையது.
- source_word: סִיסְרָא
  choice: சிசெரா
  rationale: தனிநபர் பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְהוּא יוֹשֵׁב
  choice: அவன் ... குடியிருந்தான்
  rationale: எபிரெயப் பங்கேற்பு வடிவம் சிசெராவின் வசிப்பிடத்தைச் சொல்கிறது; ‘குடியிருந்தான்’ இயல்பான கதைநடைத் தமிழ்.
- source_word: בַּחֲרֹשֶׁת הַגּוֹיִם
  choice: அரோசேத்-அக்கோயிமில்
  rationale: இடப்பெயரை மொழிபெயர்த்து ஒரு பொருளைத் தீர்மானிக்காமல் ஒலிபெயர்க்கிறது; அதன் சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இஸ்ரவேலின் ஒடுக்குதலில் தேவனுடைய செயற்பாடு
  choice: யாவே அவர்களை யாபீனின் கையில் விற்றுப்போட்டார் என்று நேரடியாகக் கூறுதல்
  alternative: யாபீனின் அதிகாரத்துக்குள் விழ யாவே அனுமதித்தார்
  rationale: எபிரெய வினை யாவேக்கு நேரடியான செயற்பாட்டைக் கூறுகிறது. அதை வெறும் அனுமதியாக மென்மைப்படுத்தாமல் உடன்படிக்கைத் தீர்ப்பின் பதற்றத்தோடு காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கையில்’ மற்றும் ‘விற்றுப்போட்டார்’ ஆகிய மூல உருவகங்கள் காக்கப்பட்டுள்ளன; நீளமான எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
