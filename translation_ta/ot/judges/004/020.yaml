revisions:
- from: அவன் அவளிடம், “நீ கூடாரத்தின் நுழைவாயிலில் நில்.[a] யாராவது ஓர் ஆண் வந்து உன்னிடம், ‘இங்கே ஆண் யாராவது இருக்கிறாரா?’ என்று கேட்டால், ‘இல்லை’ என்று சொல்” என்றான்.
  to: அவன் அவளிடம், “கூடாரத்தின் நுழைவாயிலில் நில்.[a] ஓர் ஆண் வந்து உன்னிடம், ‘இங்கே ஒரு ஆண் இருக்கிறாரா?’ என்று கேட்டால், ‘இல்லை’ என்று சொல்” என்றான்.
  rationale: The revision improves idiomatic Tamil in both occurrences of אִישׁ while preserving its masculine reference and repetition. It retains the footnote because the WLC text has the notable masculine singular imperative עֲמֹד despite the female addressee, a distinction that Tamil ‘நில்’ cannot itself express.
