translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் கதைநடையின் நேரடித்தன்மையும் காக்கப்பட்டுள்ளன. எபிரெயத்தில் אִישׁ இருமுறை வருவது தமிழிலும் ‘ஆண்’ என இருமுறை பாதுகாக்கப்பட்டுள்ளது; முதல் இடத்தில் ‘யாராவது ஓர் ஆண்’ என்பது நிபந்தனையின் வரையறையற்ற தன்மையை இயல்பாகக் காட்டுகிறது.
