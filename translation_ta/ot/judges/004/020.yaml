  text: וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ עֲמֹ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/הָיָה֩ אִם אִ֨ישׁ יָב֜וֹא וּ/שְׁאֵלֵ֗/ךְ וְ/אָמַ֛ר הֲ/יֵֽשׁ פֹּ֥ה אִ֖ישׁ וְ/אָמַ֥רְתְּ אָֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/020.yaml
  text: And he said to her[a], “Stand at the entrance of the tent, and if anyone comes and asks you, saying, ‘Is there a man here?’ you shall say, ‘No.’”
translation:
  language: ta
  text: அவன் அவளிடம், “கூடாரத்தின் நுழைவாயிலில் நில்.[a] ஓர் ஆண் வந்து உன்னிடம், ‘இங்கே ஒரு ஆண் இருக்கிறாரா?’ என்று கேட்டால், ‘இல்லை’ என்று சொல்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் பெண்ணிடம் சொல்லப்பட்டிருந்தாலும், ‘நில்’ என்பதற்கான வினைச்சொல் ஆண்பால் ஒருமை கட்டளை வடிவில் உள்ளது.
    reason: textual_grammar
lexical_decisions:
- source_word: עֲמֹד
  choice: நில்
  rationale: עמד என்பதன் கட்டளை வடிவம் இங்கு ஒரு குறிப்பிட்ட இடத்தில் நின்றிருக்கும்படி நேரடியாகக் கட்டளையிடுகிறது. ‘நில்’ என்பது இயல்பான, சுருக்கமான தமிழ் வடிவம்.
- source_word: פֶּתַח הָאֹהֶל
  choice: கூடாரத்தின் நுழைவாயில்
  rationale: פֶּתַח என்பது திறப்பு அல்லது நுழைவிடம். கூடாரச் சூழலில் ‘நுழைவாயில்’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וְהָיָה אִם
  choice: …என்றால்
  rationale: இந்த எபிரெயக் கட்டமைப்பு ஒரு நிபந்தனைச் சூழலை அறிமுகப்படுத்துகிறது. தமிழில் வினைமுற்றுடன் வரும் ‘என்றால்’ அதைப் பொருள்மாறாமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִישׁ
  choice: ஆண்
  rationale: אִישׁ இங்கு வரக்கூடிய ஆண் தேடுபவரைக் குறிக்கிறது; அதே சொல் நிபந்தனையிலும் மேற்கோள் கேள்வியிலும் மீண்டும் வருவதால், தமிழிலும் ‘ஆண்’ இருமுறையும் வைக்கப்பட்டுள்ளது.
- source_word: וּשְׁאֵלֵךְ וְאָמַר
  choice: உன்னிடம் … என்று கேட்டால்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘உன்னைக் கேட்டு, சொல்லினால்’ என்பதாக இருந்தாலும், மேற்கோள் கேள்வியை இயல்பான தமிழில் ‘… என்று கேட்டால்’ என்பது துல்லியமாக எடுத்துரைக்கிறது.
- source_word: הֲיֵשׁ פֹּה אִישׁ
  choice: இங்கே ஆண் யாராவது இருக்கிறாரா?
  rationale: הֲיֵשׁ இருப்பைப் பற்றிய கேள்வியை எழுப்புகிறது; פֹּה ‘இங்கே’ என்றும் אִישׁ ‘ஆண்’ என்றும் நேரடியாகப் பிரதிபலிக்கப்படுகின்றன.
- source_word: אָיִן
  choice: இல்லை
  rationale: மூலத்தில் பதில் மிகச் சுருக்கமாக உள்ளது. ‘இல்லை’ அதே சுருக்கத்தையும் இயல்பான தமிழையும் காக்கிறது.
