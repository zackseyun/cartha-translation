  yaml_path: translation/ot/judges/004/012.yaml
  text: And they told Sisera that Barak son of Abinoam had gone up to Mount Tabor.
translation:
  language: ta
  text: அபினோவாமின் மகன் பாராக் தாபோர் மலைக்கு ஏறிச் சென்றதாக சிசெராவுக்கு அறிவித்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: அறிவித்தார்கள்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் இங்கு ‘தெரிவித்தல், அறிவித்தல்’ என்று பொருள்படுகிறது. செய்பவர் யார் என்பது எபிரெய உரையில் குறிப்பிடப்படாததால், தமிழிலும் குறிப்பிடப்படாத பன்மை வினை வடிவம் இயல்பாக உள்ளது.
- source_word: לְסִיסְרָא
  choice: சிசெராவுக்கு
  rationale: לְ என்பது செய்தி தெரிவிக்கப்படும் மறைமுகச் செயப்படுபொருளைக் குறிக்கிறது; தமிழில் நான்காம் வேற்றுமை இயல்பானது.
- source_word: כִּי
  choice: என்று
  rationale: அறிவித்த செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் ‘என்று’ இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: עָלָה
  choice: ஏறிச் சென்றிருப்பதாக
  rationale: עלה என்பதன் மேல் நோக்கிய இயக்கத்தை ‘ஏறிச் செல்’ தெளிவாகக் காட்டுகிறது. அறிவிக்கப்பட்டதற்கு முன்பே பாராக் சென்றிருந்ததைத் தமிழ் செய்தியுரை அமைப்பில் ‘சென்றிருப்பதாக’ இயல்பாக உணர்த்துகிறது.
- source_word: בָּרָק בֶּן אֲבִינֹעַם
  choice: அபினோவாமின் மகன் பாராக்
  rationale: எபிரெயத் தந்தைவழி அடையாளத்தை நவீனத் தமிழின் இயல்பான உடைமைத் தொடரால் தருகிறது; பெயர்கள் மூல உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: הַר תָּבוֹר
  choice: தாபோர் மலைக்கு
  rationale: குறிப்பிட்ட பெயருடைய மலையைக் குறிக்கிறது; தமிழில் இடப்பெயரைத் தொடர்ந்து ‘மலை’ வைத்து இலக்கை நான்காம் வேற்றுமையில் காட்டுவது இயல்பானது.
