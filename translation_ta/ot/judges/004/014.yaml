  source_fidelity: மூல எபிரெய உரையின் கட்டளை, ஊக்குவிக்கும் காரணவுரை, தீர்க்கதரிசன உறுதியைத் தெரிவிக்கும் நிறைவுவினை, ‘கையில் கொடுத்தல்’ என்னும் அதிகார/வெற்றி மொழிமரபு, சொல்லாட்சிக் கேள்வி, தாபோர் மலையிலிருந்து இறங்குதல், பாராக்கைப் பின்தொடரும் பத்தாயிரம் ஆண்கள் ஆகியவை அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன. யְהוָה என்பதற்கு ‘யாவே’ என ஒலிபெயர்த்திருப்பதும் கொடுக்கப்பட்ட POB தீர்மானத்துடன் ஒத்துள்ளது.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘எழுந்திரு!’, ‘இதுவே’, ‘அல்லவா?’ என்பன உரையாடலின் அவசரத்தையும் ஊக்கத்தையும் இயல்பாக வெளிப்படுத்துகின்றன. இறுதி வாக்கியத்தின் கதைநடைவும் இயல்பானது.
