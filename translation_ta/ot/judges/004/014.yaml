source:
  edition: WLC
  text: וַ/תֹּאמֶר֩ דְּבֹרָ֨ה אֶל בָּרָ֜ק ק֗וּם כִּ֣י זֶ֤ה הַ/יּוֹם֙ אֲשֶׁר֩ נָתַ֨ן יְהוָ֤ה אֶת סִֽיסְרָא֙ בְּ/יָדֶ֔/ךָ הֲ/לֹ֥א יְהוָ֖ה יָצָ֣א לְ/פָנֶ֑י/ךָ וַ/יֵּ֤רֶד בָּרָק֙ מֵ/הַ֣ר תָּב֔וֹר וַ/עֲשֶׂ֧רֶת אֲלָפִ֛ים אִ֖ישׁ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/014.yaml
  text: Then Deborah said to Barak[a], “Arise, for this is the day on which Yahweh has given Sisera into your hand. Has not Yahweh gone out before you?” So Barak went down from Mount Tabor[b], with ten thousand men following him.
translation:
  language: ta
  text: அப்போது தெபோராள் பாராக்கிடம், “எழுந்திரு! ஏனெனில் யாவே சிசெராவை உன் கையில் கொடுத்திருக்கிற நாள் இதுவே.[a] யாவே உனக்கு முன்பாகப் புறப்பட்டுச் சென்றிருக்கிறாரல்லவா?[b]” என்றாள். ஆகவே பாராக் தாபோர் மலையிலிருந்து இறங்கினான்; பத்தாயிரம் ஆண்கள் அவனைப் பின்தொடர்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிசெராவை உன் அதிகாரத்தில் ஒப்புக்கொடுத்திருக்கிற நாள் இதுவே.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாவே உனக்கு முன்னால் சென்றிருக்கிறாரல்லவா?”
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּם
  choice: எழுந்திரு
  rationale: உடனடியாகச் செயல்படும்படி பாராக்குக்கு இடப்படும் ஒருமை ஆண்பால் கட்டளையின் வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי זֶה הַיּוֹם אֲשֶׁר
  choice: ஏனெனில் ... நாள் இதுவே
  rationale: כִּי என்பதன் ஊக்குவிக்கும் காரணத்தையும், זֶה הַיּוֹם என்பதிலுள்ள ‘இந்த நாளே’ என்ற சுட்டு வலியுறுத்தலையும் காக்கிறது.
- source_word: נָתַן ... בְּיָדֶךָ
  choice: உன் கையில் கொடுத்திருக்கிற
  rationale: ஒருவரின் அதிகாரத்திற்குள் ஒப்படைப்பதைக் குறிக்கும் எபிரெய மொழிமரபைத் தமிழிலும் புரியக்கூடிய வகையில் காக்கிறது; நிறைவேறப்போகும் வெற்றி உறுதியாக அறிவிக்கப்படுவதால் நிறைவு நிலை பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பால் மாற்றாமல், எபிரெய இறைப்பெயரின் ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: הֲלֹא
  choice: அல்லவா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் சொல்லாட்சிக் கேள்வியின் வடிவத்தையும் வலிமையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יָצָא לְפָנֶיךָ
  choice: உனக்கு முன்பாகப் புறப்பட்டுச் சென்றிருக்கிறார்
  rationale: யாவே முன்னே செல்வதைக் குறிக்கும் இயக்க உருவகத்தைக் காக்கிறது; சூழலில் உள்ள போர்சார் நுணுக்கத்தைத் தேவையின்றி வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: וַיֵּרֶד ... מֵהַר תָּבוֹר
  choice: தாபோர் மலையிலிருந்து இறங்கினான்
  rationale: மலையிலிருந்து கீழ்நோக்கிச் சென்ற இயக்கத்தை இயல்பான தமிழ் கதைநடையில் தெரிவிக்கிறது.
- source_word: וַעֲשֶׂרֶת אֲלָפִים אִישׁ אַחֲרָיו
  choice: பத்தாயிரம் ஆண்கள் அவனைப் பின்தொடர்ந்தார்கள்
  rationale: אִישׁ என்பதன் வெளிப்படையான ஆண்பால் குறிப்பையும், படையினர் பாராக்குக்குப் பின்னால் சென்ற இயக்கத்தையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் தனிப்பட்ட இறைப்பெயரையே பயன்படுத்துகிறது; ஆகவே அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூல வடிவத்தையும் உடன்படிக்கைச் சூழலையும் காக்கிறது.
- issue: நָתַן என்ற நிறைவுற்ற வினையின் காலப் பொருள்
  choice: கொடுத்திருக்கிற
  alternative: கொடுப்பார்
  rationale: போர் இன்னும் நடைபெறாதிருந்தாலும் வெற்றி உறுதியாக அறிவிக்கப்படுவதால், மூலத்தின் நிறைவுற்ற வடிவத்தை எதிர்காலமாகத் தளர்த்தாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எழுந்திரு!’ என்ற நேரடி கட்டளை உடனடி நடவடிக்கையை வலியுறுத்துகிறது. எபிரெய மொழிமரபான ‘உன் கையில்’ புரியத்தக்கதால் பிரதான உரையில் காக்கப்பட்டுள்ளது; அதன் அதிகாரப் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது. அடிக்குறி [a], [b] ஆகியவை அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
