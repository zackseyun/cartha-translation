source:
  edition: WLC
  text: וַ/תְּהִ֤י עַל יִפְתָּח֙ ר֣וּחַ יְהוָ֔ה וַ/יַּעֲבֹ֥ר אֶת הַ/גִּלְעָ֖ד וְ/אֶת מְנַשֶּׁ֑ה וַֽ/יַּעֲבֹר֙ אֶת מִצְפֵּ֣ה גִלְעָ֔ד וּ/מִ/מִּצְפֵּ֣ה גִלְעָ֔ד עָבַ֖ר בְּנֵ֥י עַמּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/029.yaml
  text: Then the Spirit of Yahweh came upon Jephthah[a], and he passed through Gilead and Manasseh. He passed through Mizpah of Gilead, and from Mizpah of Gilead he passed on to the Ammonites.
translation:
  language: ta
  text: அப்போது யாவேயின் ஆவி யெப்தாவின் மேல் வந்தது. அவன் கிலேயாதையும் மனாசேயையும் கடந்து சென்றான். பின்பு கிலேயாதின் மிஸ்பாவைக் கடந்து, கிலேயாதின் மிஸ்பாவிலிருந்து அம்மோனியரிடம் முன்னேறினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அம்மோனியரிடம் சென்றான்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் சூழலுக்கேற்ப ஊடாகச் செல்லுதல், கடந்து போதல் அல்லது முன்னோக்கிச் செல்லுதல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֣וּחַ יְהוָ֔ה
  choice: யாவேயின் ஆவி
  rationale: இந்த நியாயாதிபதிகள் நூல் சூழலில் רוּחַ என்பது காற்றையோ மூச்சையோ அல்ல, தலைவரை வல்லமைப்படுத்தும் தேவ ஆவியைக் குறிக்கிறது. יְהוָה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וַ/תְּהִ֤י עַל
  choice: மேல் வந்தது
  rationale: ஆவி ஒருவர்மேல் வருதல் என்ற எபிரெய மரபுத்தொடரின் நிகழ்வுத்தன்மையையும் தெய்வீக வல்லமையளித்தலையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יִפְתָּח
  choice: யெப்தா
  rationale: எபிரெய தனிப்பெயருக்கான தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு.
- source_word: וַ/יַּעֲבֹ֥ר
  choice: கடந்து சென்றான்
  rationale: பிரதேசப் பெயர்களை நேரடிச் செயப்படுபொருள்களாகக் கொண்டுள்ளதால், עבר என்பதன் ‘ஊடாகச் செல்லுதல்/கடத்தல்’ என்ற இயக்கப் பொருள் இங்கு பொருந்துகிறது.
- source_word: אֶת הַ/גִּלְעָד וְ/אֶת מְנַשֶּׁה
  choice: கிலேயாதையும் மனாசேயையும்
  rationale: இவை பிரதேசப் பெயர்கள்; தமிழ் வேற்றுமை உருபுகள் இணைக்கப்பட்டு இணையான அமைப்பு காக்கப்பட்டுள்ளது.
- source_word: מִצְפֵּ֣ה גִלְעָ֔ד
  choice: கிலேயாதிலுள்ள மிஸ்பா
  rationale: இது ‘காவற்கோபுரம்’ என்று பொருளாக்க வேண்டிய பொதுப்பெயர் அல்ல, ஓர் இடப்பெயர். எபிரெய இணைப்பின் உறவு இயல்பான தமிழில் ‘கிலேயாதிலுள்ள’ எனத் தரப்பட்டுள்ளது.
- source_word: וּ/מִ/מִּצְפֵּ֣ה גִלְעָ֔ד
  choice: கிலேயாதிலுள்ள மிஸ்பாவிலிருந்து
  rationale: מִן முன்னொட்டின் புறப்படும் இடத்தைக் குறிக்கும் பொருளைத் தெளிவாகக் காட்டுகிறது; மூலத்தின் இடப்பெயர் மீளுரைப்பும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: עָבַ֖ר בְּנֵ֥י עַמּֽוֹן
  choice: அம்மோனியரை நோக்கி முன்னேறினான்
  rationale: இங்கு עבר என்பது அம்மோனியரை இலக்காகக் கொண்ட தொடர்ந்த இயக்கத்தைக் குறிக்கிறது. ‘முன்னேறினான்’ போர்ச் சூழலை உணர்த்தினாலும் உடனடியாகத் தாக்கினான் என்று மிகைப்படுத்தாது; ‘நோக்கி’ இலக்கைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: רוח יהוה யெப்தாவின் மேல் வந்ததன் இயல்பு
  choice: யாவேயின் ஆவி யெப்தாவின் மேல் வந்தது
  alternative: யாவேயிடமிருந்து ஒரு காற்று அல்லது ஆற்றல் யெப்தாவின் மேல் வந்தது
  rationale: நியாயாதிபதிகள் நூலில் இம்மரபுத்தொடர் தலைவருக்கான தெய்வீக வல்லமையளித்தலைக் குறிக்கிறது. அதேவேளை, அந்த வல்லமையளித்தல் யெப்தாவின் பின்னைய ஒவ்வொரு செயலுக்கும் அல்லது நேர்த்திக்கடனுக்கும் வெளிப்படையான ஒப்புதல் என்று வசனத்தில் இல்லாத கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், எளிதில் புரியும் அதேவேளை கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மூலத்தில் ‘கிலேயாதிலுள்ள மிஸ்பா’ இருமுறை வருவதால் அந்த மீளுரை சுருக்கப்படாமல் பாதுகாக்கப்பட்டது. அடிக்குறிப்பு குறியீடு அது விளக்கும் இறுதி עבר வினைச்சொற்றொடருக்குப் பின்னர் வைக்கப்பட்டது.
