  text: וַ/יֵּ֣לֶךְ בַּ/מִּדְבָּ֗ר וַ/יָּ֜סָב אֶת אֶ֤רֶץ אֱדוֹם֙ וְ/אֶת אֶ֣רֶץ מוֹאָ֔ב וַ/יָּבֹ֤א מִ/מִּזְרַח שֶׁ֨מֶשׁ֙ לְ/אֶ֣רֶץ מוֹאָ֔ב וַֽ/יַּחֲנ֖וּ/ן בְּ/עֵ֣בֶר אַרְנ֑וֹן וְ/לֹא בָ֨אוּ֙ בִּ/גְב֣וּל מוֹאָ֔ב כִּ֥י אַרְנ֖וֹן גְּב֥וּל מוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/018.yaml
  text: Then he went through the wilderness and went around the land of Edom and the land of Moab[a], and came to the east side of the land of Moab, and they camped beyond the Arnon; but they did not enter the territory of Moab[b], for the Arnon was the border of Moab.
translation:
  language: ta
  text: பின்பு இஸ்ரவேல் வனாந்தரத்தின் வழியாகச் சென்று, ஏதோம் நாட்டையும் மோவாப் நாட்டையும் சுற்றிப் போனது. மோவாப் நாட்டின் கிழக்குப் பக்கத்துக்கு வந்து[a], அர்னோனுக்கு அப்பால்[b] அவர்கள் முகாமிட்டார்கள். ஆனால் அவர்கள் மோவாபின் எல்லைக்குள் நுழையவில்லை; ஏனெனில் அர்னோன் மோவாபின் எல்லையாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொற்சொல்லாக, “சூரியன் உதிக்கும் திசையிலிருந்து மோவாப் நாட்டுக்கு வந்து”; இது அவர்கள் மோவாபை கிழக்கிலிருந்து அணுகியதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அர்னோனின் மறுபக்கத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בַּמִּדְבָּר
  choice: வனாந்தரத்தின் வழியாகச் சென்று
  rationale: הלך என்பது ‘செல்’ என்றும், בַּמִּדְבָּר என்பது வனாந்தரப் பகுதியையும் குறிக்கிறது. பயணப் பாதையைக் காட்டும் சூழலில் ‘வழியாகச் சென்று’ என்பது இயல்பான தமிழாகவும் மூலத்தின் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: וַיָּסָב אֶת אֶרֶץ אֱדוֹם וְאֶת אֶרֶץ מוֹאָב
  choice: ஏதோம் நாட்டையும் மோவாப் நாட்டையும் சுற்றிப் போனது
  rationale: סבב இங்கு அந்த நாடுகளுக்குள் செல்லாமல் அவற்றைச் சுற்றிச் சென்ற பயணத்தைச் சுட்டுகிறது. אֶרֶץ என்பதற்கு இச்சூழலில் ‘நாடு’ இயல்பான தேர்வு.
- source_word: וַיָּבֹא מִמִּזְרַח שֶׁמֶשׁ לְאֶרֶץ מוֹאָב
  choice: மோவாப் நாட்டின் கிழக்குப் பக்கத்துக்கு வந்து
  rationale: ‘சூரியன் உதிக்கும் திசையிலிருந்து’ என்ற எபிரெய வழக்கு கிழக்குத் திசையைக் குறிக்கிறது. அடுத்ததாக அவர்கள் மோவாபின் எல்லைக்குள் நுழையவில்லை என்று கூறப்படுவதால், கிழக்குப் பக்கத்தை வந்தடைந்த பயணப் பொருள் தெளிவாக வழங்கப்படுகிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיַּחֲנוּן
  choice: அவர்கள் முகாமிட்டார்கள்
  rationale: חנה என்பது முகாமிடுதல். எபிரெய உரையில் முன் வரும் ஒருமை கூட்டுப்பொருள் வினையிலிருந்து இங்கு பன்மைக்கு மாறுவதால், அந்த மாற்றம் தமிழிலும் ‘அவர்கள்’ மூலம் காட்டப்படுகிறது.
- source_word: בְּעֵבֶר אַרְנוֹן
  choice: அர்னோனுக்கு அப்பால்
  rationale: עֵבֶר என்பது ஒரு எல்லை அல்லது ஆற்றின் அப்பக்கம்/மறுபக்கம் என்பதைக் குறிக்கலாம். எந்த நோக்கிடத்திலிருந்து என்பதைக் கட்டாயமாகத் தீர்மானிக்காமல் ‘அப்பால்’ என வழங்கப்படுகிறது.
- source_word: וְלֹא בָאוּ בִּגְבוּל מוֹאָב
  choice: அவர்கள் மோவாபின் எல்லைக்குள் நுழையவில்லை
  rationale: גְּבוּל என்பது எல்லையையும் அதனால் வரையறுக்கப்பட்ட நிலப்பரப்பையும் குறிக்கலாம். ‘எல்லைக்குள் நுழையவில்லை’ என்பது எல்லையைக் கடந்து மோவாபிய நிலத்துக்குள் செல்லாததைத் தெளிவாகக் கூறுகிறது.
- source_word: כִּי אַרְנוֹן גְּבוּל מוֹאָב
  choice: ஏனெனில் அர்னோன் மோவாபின் எல்லையாக இருந்தது
  rationale: כִּי இங்கு முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; גְּבוּל என்பதற்கு ‘எல்லை’ என்று ஒரேசீராக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: எபிரெய உரையின் ஒருமை கூட்டுப்பொருளிலிருந்து பன்மைக்கு மாறுதல்
  choice: முதலில் ‘இஸ்ரவேல் ... போனது’ என்றும் பின்னர் ‘அவர்கள் முகாமிட்டார்கள்’ என்றும் வழங்கப்பட்டது
  alternative: முழு வசனத்திலும் ‘அவர்கள்’ என்று ஒரே பன்மையைப் பயன்படுத்துதல்
  rationale: மூலத்தில் וַיֵּלֶךְ, וַיָּסָב, וַיָּבֹא ஆகியவை ஒருமையிலும், וַיַּחֲנוּן, בָאוּ ஆகியவை பன்மையிலும் உள்ளன. தமிழில் புரிதலுக்காக கூட்டுப்பொருளான ‘இஸ்ரவேல்’ வெளிப்படுத்தப்பட்டாலும், மூலத்தின் இலக்கண மாற்றம் இயன்றவரை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘வனாந்தரம்’, ‘முகாமிட்டார்கள்’, ‘எல்லை’ போன்ற பரவலாக அறியப்பட்ட வேதாகம-புவியியல் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற பழமையான வினைமுற்றுகள் தவிர்க்கப்பட்டுள்ளன.
