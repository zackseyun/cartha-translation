  text: וַ/יְהִ֕י כַּ/אֲשֶׁר נִלְחֲמ֥וּ בְנֵֽי עַמּ֖וֹן עִם יִשְׂרָאֵ֑ל וַ/יֵּֽלְכוּ֙ זִקְנֵ֣י גִלְעָ֔ד לָ/קַ֥חַת אֶת יִפְתָּ֖ח מֵ/אֶ֥רֶץ טֽוֹב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/005.yaml
  text: And when the Ammonites fought against Israel[a], the elders of Gilead went to bring Jephthah from the land of Tob.
translation:
  language: ta
  text: அம்மோனியர்கள் இஸ்ரவேலுக்கு எதிராகப் போரிட்டபோது, கிலேயாத்தின் மூப்பர்கள் தோபு நாட்டிலிருந்து யெப்தாவை அழைத்து வருவதற்காகச் சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தோபு நாட்டிலிருந்து யெப்தாவை எடுத்துக்கொள்வதற்காக.” எபிரேய வினைச்சொல் பொதுவாக “எடுத்துக்கொள்” என்று பொருள்படும்; இங்கு அவரை அங்கிருந்து கூட்டிவருவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: போரிட்டபோது
  rationale: எபிரேயக் கதைத் தொடரின் காலத் தொடர்பை இயல்பான நவீனத் தமிழில் காட்டுகிறது; தனியே ‘அப்போது நிகழ்ந்தது’ என்று மரப்பாணியாக மொழிபெயர்க்கவில்லை.
- source_word: נִלְחֲמוּ
  choice: போரிட்டபோது
  rationale: לחם வினையின் நிபால் வடிவம் இங்கு போரில் ஈடுபடுவதைக் குறிக்கிறது.
- source_word: בְנֵי עַמּוֹן
  choice: அம்மோனியர்கள்
  rationale: சொல்லுக்குச் சொல் ‘அம்மோனின் மகன்கள்’ என்பதற்குப் பதிலாக, இச்சூழலில் குறிக்கப்படும் இனக்குழுவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עִם יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராக
  rationale: עִם என்பதன் அடிப்படைப் பொருள் ‘உடன்’ என்றாலும், נלחם என்பதோடு வரும்போது போரின் எதிர்த்தரப்பைக் குறிக்கிறது.
- source_word: זִקְנֵי גִלְעָד
  choice: கிலேயாத்தின் மூப்பர்கள்
  rationale: கிலேயாத்தின் அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கும் எபிரேய இணைப்புத் தொடரை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: לָקַחַת
  choice: அழைத்து வருவதற்காக
  rationale: לקח பொதுவாக ‘எடுத்துக்கொள்’ என்று பொருள்பட்டாலும், இங்கு யெப்தாவை இருந்த இடத்திலிருந்து மீண்டும் கூட்டிவரச் செல்வதே சூழல்சார் பொருள். மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֶת יִפְתָּח
  choice: யெப்தாவை
  rationale: நேரடி செயப்படுபொருள் குறியுடன் வரும் நபரின் பெயரைத் தமிழில் வழக்கமான வடிவில் தருகிறது.
- source_word: מֵאֶרֶץ טוֹב
  choice: தோபு நாட்டிலிருந்து
  rationale: אֶרֶץ இங்கு ஒரு நிலப்பகுதி அல்லது நாட்டைக் குறிக்கிறது; ‘நாடு’ இயல்பான தமிழ் வடிவம்.
