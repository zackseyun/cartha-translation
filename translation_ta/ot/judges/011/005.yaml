translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. ‘மூப்பர்கள்’ என்பது சமூகத் தலைவர்களைக் குறிக்கும் நிலைபெற்ற வேதாகமச் சொல்; பெயர்கள் நவீனத் தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன.
