base_translation:
  language: en
  yaml_path: translation/ot/judges/011/025.yaml
  text: And now[a], are you really better than Balak son of Zippor, king of Moab? Did he ever contend with Israel[b], or did he ever fight against them?
translation:
  language: ta
  text: இப்போது[a], மோவாபின் அரசனும் சிப்போரின் மகனுமான பாலாக்கைவிட நீ உண்மையிலேயே மேலானவனா? அவன் இஸ்ரவேலோடு எப்போதாவது வாதிட்டதுண்டா[b], அல்லது அவர்களுக்கு எதிராக எப்போதாவது போரிட்டதுண்டா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மோவாபின் அரசனும் சிப்போரின் மகனுமான பாலாக்கைவிட நீ ஏதேனும் விதத்தில் மேலானவனா?” ஒப்பீட்டை வலியுறுத்த எபிரெயத்தில் ‘நல்ல/சிறந்த’ என்ற சொல் மறுமொழியாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவன் இஸ்ரவேலோடு எப்போதாவது வழக்காடினானா, அல்லது அவர்களுக்கு எதிராக எப்போதாவது போர் தொடுத்தானா?” முதல் வினைச்சொல் சட்டரீதியான வழக்கையோ பொதுவான பிணக்கையோ குறிக்கலாம்; இரண்டாவது வினைச்சொல் குறிப்பாகப் போரிடுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போதும்
  rationale: וְ என்ற இணைப்பையும் עַתָּה என்ற காலச்சுட்டையும் சுருக்கமாகக் காத்து, யெப்தாவின் வாதத்தில் அடுத்த கட்டத்தை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: הֲטוֹב טוֹב אַתָּה
  choice: நீ உண்மையிலேயே மேலானவனா?
  rationale: טוֹב טוֹב என்ற வலியுறுத்தும் மறுமொழியைச் சொற்சொல்லாகத் திருப்பாமல், ஒப்பீட்டின் வலிமையை ‘உண்மையிலேயே’ என்றும் מִן குறிக்கும் ஒப்பீட்டை ‘மேலானவனா’ என்றும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִבָּלָק בֶּן־צִפּוֹר מֶלֶךְ מוֹאָב
  choice: மோவாபின் அரசனும் சிப்போரின் மகனுமான பாலாக்கைவிட
  rationale: உறவுகளையும் அரசப் பட்டத்தையும் தெளிவான நவீனத் தமிழ்ச் சொற்றொடரில் அமைத்து, מִן குறிக்கும் ‘விட’ என்ற ஒப்பீட்டையும் காக்கிறது.
- source_word: הֲרֹב רָב
  choice: எப்போதாவது வாதிட்டதுண்டா
  rationale: ריב என்பதன் வழக்காடுதல், சர்ச்சையிடுதல், பிணங்குதல் ஆகிய பரந்த பொருளை ‘வாதிடுதல்’ காக்கிறது; வினையின் வலியுறுத்தும் அமைப்பை வினாவுக்குள் ‘எப்போதாவது ... உண்டா’ என்று இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עִם יִשְׂרָאֵל
  choice: இஸ்ரவேலோடு
  rationale: עִם என்பதன் அடிப்படை ‘உடன்/ஓடு’ பொருளைக் காத்து, அடுத்துள்ள வெளிப்படையான போரிடுதல் வினையிலிருந்து இதன் நுணுக்கத்தை வேறுபடுத்துகிறது.
- source_word: אִם
  choice: அல்லது
  rationale: இங்கு இரண்டாவது சொல்லாட்சிவினாவை அறிமுகப்படுத்தும் மாற்றுத் தொடர்புச் சொல்லாக இருப்பதால் ‘அல்லது’ இயல்பானது.
- source_word: נִלְחֹם נִלְחַם בָּם
  choice: அவர்களுக்கு எதிராக எப்போதாவது போரிட்டதுண்டா
  rationale: לחם என்பதன் குறிப்பான போரிடுதல் பொருளையும் בָּם என்பதன் எதிர்நிலைப் பொருளையும் தெளிவாகக் காக்கிறது; வலியுறுத்தும் எபிரெய அமைப்பை இயல்பான தமிழில் எடுத்துரைக்கிறது.
