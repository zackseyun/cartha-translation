id: JDG.11.32
reference: Judges 11:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֥ר יִפְתָּ֛ח אֶל בְּנֵ֥י עַמּ֖וֹן לְ/הִלָּ֣חֶם בָּ֑/ם וַ/יִתְּנֵ֥/ם יְהוָ֖ה בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/032.yaml
  text: So Jephthah crossed over to the Ammonites to fight against them[a], and Yahweh gave them into his hand.
translation:
  language: ta
  text: எனவே யெப்தா அம்மோனியர்களிடம் அவர்களுக்கு எதிராகப் போரிடக் கடந்து சென்றான்; யாவே அவர்களை அவன் கையில் ஒப்புக்கொடுத்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: சென்றான்
  rationale: עבר என்பதன் அடிப்படைப் பொருள் ‘கடந்து செல்லுதல்.’ இங்கு கடக்கப்பட்ட இடம் குறிப்பிடப்படாததாலும், அம்மோனியர்களை நோக்கிய படைநகர்வை இயல்பான நவீன தமிழில் தெரிவிக்க ‘சென்றான்’ என மொழிபெயர்க்கப்பட்டது; போரின் நோக்கம் அடுத்த சொற்றொடரில் தெளிவாகிறது.
- source_word: אֶל בְּנֵי עַמּוֹן
  choice: அம்மோனியர்களிடம்
  rationale: אֶל என்பது ‘நோக்கி/இடம்’ என்பதையும், בְּנֵי עַמּוֹן என்ற இனக்குழுப் பெயர் தமிழில் இயல்பாக ‘அம்மோனியர்கள்’ என்பதையும் குறிக்கின்றன. பகைமையை முன்னிடைச்சொல்லிலேயே சேர்க்காமல் அடுத்த வினைத்தொடருக்கு விட்டுள்ளது.
- source_word: לְהִלָּחֶם בָּם
  choice: அவர்களுக்கு எதிராகப் போரிட்டான்
  rationale: לחם என்ற நிபால் வினை בְּ உடன் ஒருவருக்கு எதிராகப் போரிடுவதைச் சுட்டுகிறது. நோக்கத்தைக் காட்டும் எபிரெய அமைப்பு தமிழில் தொடர்ச்சியான நிகழ்வாக இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: וַיִּתְּנֵם
  choice: அவர்களை ... ஒப்புக்கொடுத்தார்
  rationale: נתן + ‘கையில்’ என்பது போரில் எதிரிகளை ஒருவரின் அதிகாரத்திற்குள் கொடுப்பதைக் குறிக்கும் வழக்குச் சொற்றொடர். ‘ஒப்புக்கொடுத்தார்’ வெற்றிக்கான தெய்வீகச் செயலைத் தெளிவாக்குவதோடு கை என்ற மூல உருவகத்தையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּיָדוֹ
  choice: அவன் கையில்
  rationale: போர்வெற்றி மற்றும் அதிகாரத்தைச் சுட்டும் எபிரெய உருவகம் தமிழிலும் புரிந்துகொள்ளத்தக்கதால் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் ஒரு பொதுப் பட்டத்தை அல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பெயரைப் பயன்படுத்துகிறது. ஆகவே பெயருக்கும் பட்டத்திற்கும் உள்ள வேறுபாட்டைத் தக்கவைக்க ஒலிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- issue: போர்வெற்றியில் யாவேயின் பங்கு
  choice: யாவே அவர்களை அவன் கையில் ஒப்புக்கொடுத்தார்
  alternative: யெப்தா அவர்களை வென்றான்
  rationale: மூலஉரை வெற்றியின் தீர்மானகரமான காரணத்தை யாவேயின் செயலாகக் கூறுகிறது. அதை மனித வெற்றியாக மட்டும் சுருக்காமல், மூலத்தின் இறையியல் வலியுறுத்தல் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிமையானதும் கண்ணியமானதும். ‘அவன் கையில்’ என்ற வேதாகமப் போர் உருவகம் பொருள் தெளிவாக இருப்பதால் தக்கவைக்கப்பட்டது. ‘கடந்து சென்றான்’ என்பதற்குப் பதில், குறிப்பிடப்பட்ட எல்லை அல்லது பொருள் இல்லாத தமிழ்ச் சூழலில் இயல்பான ‘சென்றான்’ பயன்படுத்தப்பட்டது.
