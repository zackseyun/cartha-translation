base_translation:
  language: en
  yaml_path: translation/ot/judges/011/037.yaml
  text: 'And she said to her father[a], “Let this thing be done for me: leave me alone for two months, that I may go and wander on the mountains and weep over my virginity[b], I and my companions.”'
translation:
  language: ta
  text: 'அவள் தன் தந்தையிடம், “இந்தக் காரியம் எனக்குச் செய்யப்படட்டும்: என்னை இரண்டு மாதங்கள் விட்டுவிடுங்கள்[a]. நானும் என் தோழிகளும் மலைகளில் போய் இறங்கி, என் கன்னிமையைக் குறித்து அழுவதற்கு அனுமதியுங்கள்[b]” என்றாள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரண்டு மாதங்களுக்கு எனக்கு விடுப்பளியுங்கள்” / “என்னைப் போகவிடுங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “என் கன்னிமையைக் குறித்து அழுவேன்.” இச்சொற்றொடர் அவளுடைய திருமணமாகாத நிலையையும், அதனுடன் தொடர்புடைய குழந்தைப்பேறு இல்லாதிருக்கும் நிலையையும் முன்னிறுத்துகிறது; ஆனால் கதையின் விரிவான விளக்கக் கேள்வியை இந்த வசனம் மட்டும் தீர்மானிப்பதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: இந்தக் காரியம் எனக்குச் செய்யப்படட்டும்
  rationale: எபிரெய மொழியின் செயப்பாட்டு வேண்டுகோள் வடிவத்தையும் ‘இந்தக் காரியம்’ என்ற சுட்டுத் தொடரையும் காக்கிறது; அதை விளக்கமாக ‘இந்த வேண்டுகோளை ஏற்றுக்கொள்ளுங்கள்’ என்று மாற்றவில்லை.
- source_word: הַרְפֵּה מִמֶּנִּי
  choice: என்னை விட்டுவிடுங்கள்
  rationale: இங்கு வரும் கட்டளைத் தொடர், அவளுக்குச் சிறிது காலம் விலகிச் செல்ல அனுமதிக்க வேண்டும் என்ற பொருளுடையது. ‘என்னை விட்டுவிடுங்கள்’ என்பது மூலத்தின் உருவகத்தைத் தக்கவைக்கும் இயல்பான தமிழ்.
- source_word: שְׁנַיִם חֳדָשִׁים
  choice: இரண்டு மாதங்களுக்கு
  rationale: கால அளவைத் தெளிவாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: וְאֵלְכָה וְיָרַדְתִּי עַל הֶהָרִים
  choice: நான் போய் மலைகளில் இறங்கி
  rationale: எபிரெயத்தில் உள்ள ‘போ’ மற்றும் ‘இறங்கு’ ஆகிய இரு வினைகளையும் தக்கவைக்கிறது. ‘அலைந்து திரிந்து’ என்பது சாத்தியமான சூழல் விளக்கம் என்றாலும், அது மூலத்தில் வெளிப்படையாக இல்லை.
- source_word: וְאֶבְכֶּה עַל בְּתוּלַי
  choice: என் கன்னிமையைக் குறித்து அழுவதற்கு
  rationale: அவள் அழுவது அவளுடைய கன்னிமையைக் குறித்தே என்று வசனம் கூறுவதை நேரடியாகப் பாதுகாக்கிறது; மரணம் அல்லது வாழ்நாள் அர்ப்பணிப்பு குறித்த எந்த ஒரு விளக்கத்தையும் உள்ளே சேர்க்கவில்லை.
- source_word: אָנֹכִי וְרֵעוֹתָי
  choice: என் தோழிகளோடு
  rationale: பெண்பால் பன்மை வடிவம் அவளுடன் சென்ற பெண் தோழிகளைக் குறிக்கிறது. தமிழ் வாக்கிய ஓட்டத்தில் ‘நானும் என் தோழிகளும்’ என்பதற்குச் சமமாகவும் இயல்பாகவும் இது அமைகிறது.
theological_decisions:
- issue: யெப்தாவின் மகள் தன் கன்னிமையைக் குறித்து அழுததன் பொருள்
  choice: வசனம் வெளிப்படையாகக் கூறும் கன்னிமை மற்றும் திருமணமாகாத நிலையை மட்டும் மொழிபெயர்ப்பில் முன்னிறுத்துதல்
  alternative: அவள் வரவிருக்கும் மரணத்தையும் குழந்தையின்மையையும் சேர்த்து எண்ணி அழுதாள்; அல்லது வாழ்நாள் முழுவதும் கன்னியாக அர்ப்பணிக்கப்படுவதற்காக மட்டும் அழுதாள்
  rationale: இந்த வசனம் மரணத்தை வெளிப்படையாகக் குறிப்பிடாமல் கன்னிமையை மையப்படுத்துகிறது. ஆகவே விரிந்த கதைக்கான போட்டி விளக்கங்களில் ஒன்றை மொழிபெயர்ப்பே தீர்மானிக்காமல், மூலத்தின் பதற்றத்தையும் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘செய்யப்படட்டும்’ மற்றும் ‘கன்னிமை’ ஆகியவை மூலத்தின் முறையான தொனியையும் முக்கியச் சொல்லாட்சியையும் காக்கின்றன; மற்ற பகுதிகளில் தேவையற்ற பழமையான அல்லது சமயப் பிரிவுசார் மொழி தவிர்க்கப்பட்டுள்ளது.
