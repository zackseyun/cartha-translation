base_translation:
  language: en
  yaml_path: translation/ot/judges/011/034.yaml
  text: Then Jephthah came to Mizpah[a], to his house, and behold, his daughter was coming out to meet him with tambourines and with dances. Now she was his only child[b]; besides her he had neither son nor daughter.
translation:
  language: ta
  text: பின்பு யெப்தா மிஸ்பாவிலுள்ள தன் வீட்டுக்கு வந்தான். இதோ, அவனுடைய மகள் கஞ்சிராக்களோடும் நடனங்களோடும் அவனை எதிர்கொள்ள வெளியே வந்துகொண்டிருந்தாள்.[a] அவள் அவனுடைய ஒரே பிள்ளை[b]; அவளைத் தவிர அவனுக்கு மகனோ மகளோ இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கஞ்சிராக்களோடும் நடனமாடிக்கொண்டும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘அவனுடைய ஒரே ஒருத்தி’; அதாவது, அவனுடைய ஒரே பிள்ளை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: பின்பு ... வந்தான்
  rationale: வாவ் தொடர் வடிவம் கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; ‘பின்பு’ இயல்பான தமிழ் கதைநடையைத் தருகிறது.
- source_word: הַמִּצְפָּה אֶל בֵּיתוֹ
  choice: மிஸ்பாவிலுள்ள தன் வீட்டுக்கு
  rationale: இரு இலக்குகளையும் முரண்பாடின்றி இணைத்து, அவனுடைய வீடு மிஸ்பாவில் இருந்ததைக் கூறும் இயல்பான தமிழ் அமைப்பு.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீர்த் திருப்பத்தையும் காட்சியின் நாடகத் தாக்கத்தையும் பாதுகாக்கிறது.
- source_word: יֹצֵאת לִקְרָאתוֹ
  choice: அவனை எதிர்கொள்ள வெளியே வந்துகொண்டிருந்தாள்
  rationale: எபிரெயப் பங்கேற்புவினையின் நிகழ்ந்துகொண்டிருக்கும் காட்சித் தன்மையைப் பாதுகாக்கிறது.
- source_word: בְתֻפִּים וּבִמְחֹלוֹת
  choice: கஞ்சிராக்களோடும் நடனங்களோடும்
  rationale: விழாக்காலச் சட்டகப் பறைகளை நவீன தமிழில் ‘கஞ்சிராக்கள்’ எனக் குறிப்பிடுகிறது; இரண்டு பெயர்ச்சொற்களின் பன்மையையும் வைத்திருக்கிறது.
- source_word: וְרַק הִיא יְחִידָה
  choice: அவள் அவனுடைய ஒரே பிள்ளை
  rationale: அடுத்த கூற்று தெளிவுபடுத்தும் பொருளின்படி יְחִידָה என்பதை இயல்பாகவும் துல்லியமாகவும் தருகிறது.
- source_word: אֵין לוֹ מִמֶּנּוּ בֵּן אוֹ בַת
  choice: அவளைத் தவிர அவனுக்கு மகனோ மகளோ இல்லை
  rationale: அவளைத் தவிர வேறு எந்தப் பிள்ளையும் அவனுக்கு இல்லை என்ற முழுமையான மறுப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யெப்தாவின் மகளின் நிலையும் பின்னர் அவளுக்கு நேர்ந்ததும்
  choice: இவ்வசனம் கூறும் நிகழ்வுகளையும் அவள் ஒரே பிள்ளை என்பதையும் மட்டும் விளக்கமாக மொழிபெயர்த்தல்
  alternative: இந்த வலியுறுத்தலை நேரடியான பலி அல்லது வாழ்நாள் முழுவதும் கன்னித்தன்மை/பிள்ளையின்மை என்ற பிற்கால விளக்கங்களுடன் இணைத்தல்
  rationale: இவ்வசனம் அவளுடைய இறுதி நிலையைத் தீர்மானிக்கவில்லை; ஆகவே சுற்றியுள்ள பகுதியின் விவாதத்துக்குரிய விளக்கத்தை மொழிபெயர்ப்புக்குள் கொண்டுவராமல் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற இலக்கியச் சொல் மூலத்தின் திடீர்த் தாக்கத்தைத் தக்கவைக்கிறது; மற்ற சொற்றொடர்கள் சாதாரண வாசகர்களுக்கு எளிதில் புரியும் வகையில் அமைக்கப்பட்டுள்ளன.
