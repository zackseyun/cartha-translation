  text: וַ/תֵּ֧לֶד אֵֽשֶׁת גִּלְעָ֛ד ל֖/וֹ בָּנִ֑ים וַ/יִּגְדְּל֨וּ בְֽנֵי הָ/אִשָּׁ֜ה וַ/יְגָרְשׁ֣וּ אֶת יִפְתָּ֗ח וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֹֽא תִנְחַ֣ל בְּ/בֵית אָבִ֔י/נוּ כִּ֛י בֶּן אִשָּׁ֥ה אַחֶ֖רֶת אָֽתָּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/002.yaml
  text: And Gilead’s wife bore him sons. When the sons of the wife grew up, they drove Jephthah out and said to him, “You will not have an inheritance in our father’s house, for you are the son of another woman.”
translation:
  language: ta
  text: கிலேயாத்தின் மனைவி அவனுக்கு மகன்களைப் பெற்றாள். அந்த மனைவியின் மகன்கள் வளர்ந்தபோது, அவர்கள் யெப்தாவை வெளியேற்றினார்கள்; அவனிடம், “எங்கள் தந்தையின் வீட்டில் நீ பங்குரிமை பெறமாட்டாய்; ஏனெனில் நீ வேறொரு பெண்ணின் மகன்” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשֶׁת גִּלְעָד
  choice: கிலேயாத்தின் மனைவி
  rationale: எபிரெய மூலத்தின் உடைமைத் தொடர்பை நேரடியாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: בְנֵי הָאִשָּׁה
  choice: அந்த மனைவியின் மகன்கள்
  rationale: மூலத்தில் உள்ள குறிப்பிட்ட பெயர்ச்சொல் வடிவத்தைப் பாதுகாக்கிறது; ‘அவனுடைய மனைவி’ என்று மூலத்தில் இல்லாத உடைமைச் சொல்லைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: וַיְגָרְשׁוּ
  choice: துரத்திவிட்டு
  rationale: யெப்தாவை குடும்பச் சூழலிலிருந்து வலுக்கட்டாயமாக வெளியேற்றிய செயலை இயல்பாகக் குறிக்கிறது.
- source_word: לֹא תִנְחַל
  choice: உனக்குப் பங்குரிமை இல்லை
  rationale: נחל என்பதன் குடும்பச் சொத்துரிமை சார்ந்த பொருளைத் தெளிவாகக் காட்டுகிறது; தமிழில் வெறும் எதிர்காலச் செயலாக அல்லாமல் மறுக்கப்பட்ட உரிமையாக இயல்பாக ஒலிக்கிறது.
- source_word: בְּבֵית אָבִינוּ
  choice: எங்கள் தந்தையின் வீட்டில்
  rationale: ‘வீடு’ என்பதன் குடும்பம் மற்றும் குடும்பச் சொத்து ஆகிய இரு சாத்தியமான நிழற்பொருள்களையும் தேவையின்றி குறுக்காமல் பாதுகாக்கிறது.
- source_word: בֶּן אִשָּׁה אַחֶרֶת
  choice: வேறொரு பெண்ணின் மகன்
  rationale: மூலத்தின் திட்டமிட்ட வேறுபடுத்தும் சொல்லாட்சியை நேரடியாகப் பாதுகாக்கிறது; அந்தப் பெண்ணின் சமூக அல்லது திருமண நிலையை ஊகிக்கவில்லை.
theological_decisions:
- issue: யெப்தாவின் தாயின் நிலை
  choice: ‘வேறொரு பெண்’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது
  alternative: ‘வேசி’ அல்லது ‘மறுமனைவி’ என்று இவ்வசனத்தில் குறிப்பிடுதல்
  rationale: முந்தைய வசனம் பின்னணித் தகவலை வழங்கினாலும், இவ்வசனத்தின் אִשָּׁה אַחֶרֶת என்பது ‘வேறொரு பெண்’ என்றே கூறுகிறது. சகோதரர்களின் சொற்களில் இல்லாத குறிப்பை இங்கு சேர்க்கவில்லை.
- issue: சுதந்தர மறுப்பின் தன்மை
  choice: குடும்பப் பங்குரிமை மறுக்கப்படுவதாக மொழிபெயர்க்கப்பட்டது
  alternative: ‘நீ சுதந்தரிக்க மாட்டாய்’ என்ற வினைமைய மொழிபெயர்ப்பு
  rationale: சூழல் தந்தையின் வீட்டிலுள்ள குடும்பச் சொத்துப் பங்கைச் சுட்டுகிறது. அதே நேரத்தில் சட்ட விவரங்களை உரையில் கூடுதலாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதைமிக்க ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. குடும்ப உறவு, வெளியேற்றம், பங்குரிமை மறுப்பு ஆகியவை தெளிவாக வைக்கப்பட்டுள்ளன; மூலத்தில் இல்லாத விளக்கங்கள் சேர்க்கப்படவில்லை.
