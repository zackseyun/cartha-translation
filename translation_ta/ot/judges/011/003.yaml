base_translation:
  language: en
  yaml_path: translation/ot/judges/011/003.yaml
  text: So Jephthah fled from his brothers and lived in the land of Tob[a], and worthless men gathered around Jephthah and went out with him.
translation:
  language: ta
  text: எனவே, யெப்தா தன் சகோதரர்களிடமிருந்து தப்பியோடி, தோபு நாட்டில் வாழ்ந்தான். மதிப்பற்ற ஆட்கள்[a] யெப்தாவைச் சுற்றிக் கூடிவந்து, அவனுடன் புறப்பட்டுச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெறுமையான ஆட்கள்.” எபிரெய மொழிவழக்கில் இது வெறுமனே உடைமையற்றவர்களை அல்லாமல், நன்னடத்தை அல்லது சமூக மதிப்பு குறைந்தவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: தப்பியோடி
  rationale: ברח பகைமை அல்லது ஆபத்திலிருந்து ஓடித் தப்புவதைக் குறிக்கிறது; சூழலின் கட்டாயப் பிரிவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִפְּנֵי אֶחָיו
  choice: தன் சகோதரர்களிடமிருந்து
  rationale: מִפְּנֵי என்பதன் நேரடிப் பொருள் ‘முன்னிலையிலிருந்து’ என்றாலும், இங்கு சகோதரர்களின் பகைமையால் அவர்களிடமிருந்து விலகிச் சென்றதைக் குறிக்கிறது.
- source_word: וַיֵּשֶׁב
  choice: வாழ்ந்தான்
  rationale: ישב இங்கு ஓர் இடத்தில் தங்கி வாழ்வதைக் குறிக்கிறது; ‘குடியேறினான்’ என்பதிலுள்ள நிரந்தரத் தன்மையைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: בְּאֶרֶץ טוֹב
  choice: தோபு நாட்டில்
  rationale: אֶרֶץ என்பது இங்கு நாடு அல்லது நிலப்பகுதியைக் குறிக்கிறது; טוֹב இடப்பெயராக ‘தோபு’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיִּתְלַקְּטוּ אֶל יִפְתָּח
  choice: யெப்தாவிடம் ஒன்றுகூடி
  rationale: התלקט என்ற தன்னிலை வடிவம் மக்கள் தாமாகக் கூடிவருவதைக் குறிக்கிறது; אֶל குறிக்கும் யெப்தாவை நோக்கிய இணைதலும் தமிழில் பாதுகாக்கப்படுகிறது.
- source_word: אֲנָשִׁים רֵיקִים
  choice: பயனற்ற மனிதர்கள்
  rationale: רֵיקִים என்பதன் அடிப்படைப் பொருள் ‘வெறுமையானவர்கள்’; இச்சொற்றொடர் உடைமையின்மையை மட்டும் அல்லாமல் சமூக மதிப்போ நன்னடத்தையோ அற்றவர்களைக் குறிக்கிறது. ‘பயனற்ற’ என்பது இந்த மதிப்பீட்டுத் தொனியைப் பாதுகாத்து, ‘கொள்ளையர்கள்’ போன்ற குறிப்பற்ற தகவலைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: וַיֵּצְאוּ עִמּוֹ
  choice: அவனுடன் புறப்பட்டுச் சென்றார்கள்
  rationale: יצא என்பதன் பொதுவான ‘வெளியே செல்/புறப்படு’ என்ற பொருளைப் பாதுகாக்கிறது; அவர்கள் சென்றதன் நோக்கத்தைத் தாக்குதல் அல்லது கொள்ளை என்று தீர்மானிக்கவில்லை.
