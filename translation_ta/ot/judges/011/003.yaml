translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘யெப்தா’, ‘தோபு’ ஆகியவை எபிரெயப் பெயர்களை அண்மையாக ஒலிபெயர்க்கின்றன. இறுதிக் கூற்று அவர்களின் செயலின் நோக்கத்தை விளக்காமல் மூலத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
