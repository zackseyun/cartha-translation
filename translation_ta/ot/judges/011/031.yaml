  source_fidelity: மூலத்தின் திறந்த குறிப்பு (மனிதரா விலங்கா என்பதைக் குறிப்பிடாதது), ‘சமாதானத்தில்’ திரும்புதல், யெகோவா/YHWH-க்கு அர்ப்பணித்தல், தகனபலியாக ஏற்றுதல் ஆகியவை நன்றாகப் பாதுகாக்கப்பட்டுள்ளன. ஆனால் ஆங்கில POB முதன்மை உரையில் உள்ள “Yahweh” என்ற பெயர்ப்பயன்பாட்டுடன் ஒத்திசைவதற்கும், יהוה என்ற பெயரைத் தெளிவாகப் பிரதிபலிப்பதற்கும் ‘யாவே’ பயன்படுத்தப்பட வேண்டும்.
  naturalness: வாக்கியம் நவீன நிலையான தமிழில் இயல்பாக உள்ளது. ‘திரும்பி வருகையில்’ என்பதற்குப் பதில் ‘திரும்பி வரும்போது’ என்பது சற்றே நேரடியான நடையை அளிக்கிறது; பொருளில் மாற்றமில்லை.
