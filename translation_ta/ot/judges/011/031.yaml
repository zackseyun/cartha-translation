base_translation:
  language: en
  yaml_path: translation/ot/judges/011/031.yaml
  text: then whatever comes out from the doors of my house to meet me when I return in peace from the Ammonites shall be Yahweh’s[a], and I will offer it up as a burnt offering.
translation:
  language: ta
  text: அப்போது, அம்மோனியரிடமிருந்து நான் சமாதானத்துடன் திரும்பி வரும்போது, என்னைச் சந்திக்க என் வீட்டுக் கதவுகளிலிருந்து வெளியே வருவது எதுவோ, அது யாவேக்கு உரியதாகும்[a]; அதை நான் தகனபலியாகச் செலுத்துவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது யாவேக்கு உரியதாகும், அல்லது அதை நான் தகனபலியாகச் செலுத்துவேன்.” இங்குள்ள எபிரெய இணைப்புச்சொல்லைப் பிரிப்புப் பொருளில் எடுத்துக்கொண்டு, யெப்தாவைச் சந்திக்க வெளியே வருவது எதுவோ அதைப் பொறுத்து இரண்டு சாத்தியமான விளைவுகள் கூறப்படுவதாகச் சிலர் கருதுகின்றனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: הַיּוֹצֵא אֲשֶׁר יֵצֵא
  choice: வெளியே வருவது எதுவோ
  rationale: எபிரெயச் சொற்றொடர் ஆண்பால் ஒருமை வடிவில் இருந்தாலும், சூழலில் அது மனிதரையோ விலங்கையோ குறிக்கக்கூடிய தெளிவின்மையை உடையது. ‘வெளியே வருவது எதுவோ’ என்பது அந்தத் தெளிவின்மையைத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: מִדַּלְתֵי בֵיתִי
  choice: என் வீட்டுக் கதவுகளிலிருந்து
  rationale: דַּלְתֵי என்பது ‘கதவுகள்’ என்ற பன்மை இணைப்புநிலை வடிவம். மூலத்தின் பன்மையைப் பேணும் நேரடியான, புரிந்துகொள்ளத்தக்க மொழிபெயர்ப்பு இது.
- source_word: לִקְרָאתִי
  choice: என்னைச் சந்திக்க
  rationale: இச்சொல் ஒருவரை எதிர்கொண்டு சந்திப்பதற்கான நகர்வைக் குறிக்கிறது; ‘என்னைச் சந்திக்க’ என்பது நவீன தமிழில் இயல்பான சமமான சொற்றொடர்.
- source_word: בְּשׁוּבִי בְשָׁלוֹם
  choice: நான் சமாதானத்துடன் திரும்பி வருகையில்
  rationale: שָׁלוֹם என்பதன் அமைதி, நலம், பாதுகாப்பு ஆகிய விரிவான கருத்தை ‘சமாதானத்துடன்’ காக்கிறது; ‘வருகையில்’ கால உறவைத் தெளிவாக்குகிறது.
- source_word: מִבְּנֵי עַמּוֹן
  choice: அம்மோனியரிடமிருந்து
  rationale: சொல்லுக்கு சொல் ‘அம்மோனின் புத்திரரிடமிருந்து’ என்றாலும், மக்களினத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம் ‘அம்மோனியர்’ ஆகும்.
- source_word: וְהָיָה לַיהוָה
  choice: அது யெகோவாவுக்கு உரியதாகும்
  rationale: இவ்வாக்கியம் யெகோவாவுக்கான அர்ப்பணிப்பையோ உடைமையையோ குறிக்கிறது. அதை எவ்வாறு நிறைவேற்றுவது என்ற சர்ச்சையை முன்கூட்டியே தீர்க்காமல் இந்த வடிவம் பொருளைக் காக்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: தெய்வீகப் பெயரான יהוה-ஐ தனிப்பெயராகத் தமிழில் ‘யெகோவா’ என்று வெளிப்படுத்துகிறது.
- source_word: וְהַעֲלִיתִהוּ עוֹלָה
  choice: அதை நான் தகனபலியாகச் செலுத்துவேன்
  rationale: Hiphil வடிவிலுள்ள עלה மற்றும் עוֹלָה இணைந்து ‘தகனபலியாகச் செலுத்துதல்’ என்ற வழக்கமான பலியியல் பொருளைத் தருகின்றன. ஆண்பால் ஒருமை பின்னொட்டை ‘அதை’ என மொழிபெயர்ப்பது முன்னுள்ள குறிப்பின் திறந்த தன்மையைப் பேணுகிறது.
theological_decisions:
- issue: இது ஒரே விளைவைக் குறிக்கும் நேர்ச்சையா (‘யெகோவாவுக்கு உரியதாகும்; அதைத் தகனபலியாகச் செலுத்துவேன்’), அல்லது இரண்டு மாற்று விளைவுகளைக் குறிக்கிறதா (‘யெகோவாவுக்கு உரியதாகும், அல்லது அதைத் தகனபலியாகச் செலுத்துவேன்’)?
  choice: முதன்மை உரையில் இணைப்புப் பொருளுடன் ஒரே விளைவாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அது யெகோவாவுக்கு உரியதாகும், அல்லது அதை நான் தகனபலியாகச் செலுத்துவேன்.’
  rationale: ו என்ற இணைப்புச்சொல்லின் வழக்கமான பொருள் ‘மற்றும்/அடுத்து’ என்பதாகும்; ஆகவே முதன்மை உரை இயல்பான தொடர்ச்சியைப் பின்பற்றுகிறது. எனினும், இங்கு அது பிரிப்புப் பொருளில் ‘அல்லது’ என அமையலாம் என்ற விளக்க மரபு இருப்பதால், அந்த மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மூலத்தில் மனிதரா விலங்கா என்று திறந்துள்ள குறிப்பை ‘எதுவோ/அதை’ மூலம் காத்து, இணைப்புச்சொல்லின் சர்ச்சைக்குரிய மாற்று வாசிப்பை அடிக்குறிப்பில் அளிக்கிறது.
