source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ זִקְנֵ֨י גִלְעָ֜ד אֶל יִפְתָּ֗ח לָ/כֵן֙ עַתָּה֙ שַׁ֣בְנוּ אֵלֶ֔י/ךָ וְ/הָלַכְתָּ֣ עִמָּ֔/נוּ וְ/נִלְחַמְתָּ֖ בִּ/בְנֵ֣י עַמּ֑וֹן וְ/הָיִ֤יתָ לָּ֨/נוּ֙ לְ/רֹ֔אשׁ לְ/כֹ֖ל יֹשְׁבֵ֥י גִלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/008.yaml
  text: And the elders of Gilead said to Jephthah[a], “That is why we have now come back to you, so that you may go with us and fight against the Ammonites[b], and you will be head over all the inhabitants of Gilead.”
translation:
  language: ta
  text: கீலேயாத்தின் மூப்பர்கள் யெப்தாவிடம், “அதனால்தான் இப்போது நாங்கள் உன்னிடம் திரும்பி வந்திருக்கிறோம். நீ எங்களுடன் சென்று அம்மோனியர்களுக்கு[a] எதிராகப் போரிடுவாய்; கீலேயாத்தில் குடியிருப்போர் அனைவரின் தலைவனாக இருப்பாய்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘அம்மோனின் மகன்கள்’; அதாவது, அம்மோனியர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי גִלְעָד
  choice: கீலேயாத்தின் மூப்பர்கள்
  rationale: சமூகத்தால் அங்கீகரிக்கப்பட்ட மூத்த தலைவர்களைக் குறிக்கும் எபிரெயச் சொல்லின் சமூக-அரசியல் பொருளை ‘மூப்பர்கள்’ நேரடியாகப் பாதுகாக்கிறது.
- source_word: לָכֵן עַתָּה
  choice: அதனால்தான் இப்போது
  rationale: முந்தைய வசனத்தில் யெப்தா எழுப்பிய எதிர்ப்புக்கான பதிலாக வரும் காரணத் தொடர்பையும் உடனடி சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שַׁבְנוּ אֵלֶיךָ
  choice: நாங்கள் உன்னிடம் திரும்பி வந்திருக்கிறோம்
  rationale: שׁוּב என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்’ என்பதையும், முன்பு புறக்கணித்த யெப்தாவை மீண்டும் நாடிவந்த சூழலையும் பாதுகாக்கிறது.
- source_word: וְהָלַכְתָּ עִמָּנוּ
  choice: நீ எங்களுடன் சென்று
  rationale: הלך என்பதன் ‘செல்’ என்ற திசைப் பொருளைத் தக்கவைத்தபடி, கூட்டாகப் படையெடுத்துச் செல்வதை இயல்பான தமிழில் கூறுகிறது.
- source_word: וְנִלְחַמְתָּ בִּבְנֵי עַמּוֹן
  choice: அம்மோனியர்களுக்கு எதிராகப் போரிட வேண்டும்
  rationale: בני עמון என்ற இனப்பெயரைத் தெளிவான தமிழில் ‘அம்மோனியர்கள்’ எனக் கொடுத்து, נלחם உடன் வரும் בְּ குறிக்கும் பகைமைப் பொருளை ‘எதிராக’ என வெளிப்படுத்துகிறது.
- source_word: וְהָיִיתָ לָּנוּ לְרֹאשׁ
  choice: நீ தலைவனாக இருப்பாய்
  rationale: רֹאשׁ என்பதன் தலைமை மற்றும் அதிகாரப் பொருளை ‘தலைவன்’ தெளிவாகக் காட்டுகிறது; வெறும் போர்த் தளபதி என்ற குறுகிய பொருளுக்குள் இதை அடக்கவில்லை.
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: கீலேயாத்தில் குடியிருக்கும் அனைவருக்கும்
  rationale: அங்கே வாழும் மக்கள் அனைவரையும் உள்ளடக்கும் முழு பரப்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: யெப்தாவுக்கு வாக்களிக்கப்பட்ட அதிகாரத்தின் பரப்பு
  choice: கீலேயாத்தில் குடியிருக்கும் அனைவருக்கும் உரிய விரிவான தலைமை
  alternative: போர்க்காலத்திற்கான தற்காலிக இராணுவத் தலைமை மட்டும்
  rationale: ‘கீலேயாத்தில் குடியிருக்கும் அனைவருக்கும் தலைவனாக’ என்ற சொற்றொடர் உடனடியான போர்ப் பொறுப்பைத் தாண்டிய பரந்த தலைமை அதிகாரத்தைச் சுட்டுகிறது; அதேவேளை பிற்கால அரசியல் அமைப்புகளை உரைக்குள் இறக்குமதி செய்யவில்லை.
- issue: இணைப்புச் சொற்களின் நோக்கம் மற்றும் விளைவு உறவு
  choice: சென்று போரிட வேண்டும்; தலைவனாக இருப்பாய்
  alternative: சென்று போரிட்டால் மட்டுமே தலைவனாவாய் என்ற வெளிப்படையான நிபந்தனை
  rationale: எபிரெய வாவ் தொடர்கள் நோக்கம், தொடர்ச்சி அல்லது விளைவைத் தரக்கூடும். மொழிபெயர்ப்பு இயல்பான தொடர்ச்சியை வெளிப்படுத்துகிறது; ஆனால் மூலத்தில் வெளிப்படையாக இல்லாத கடுமையான நிபந்தனை வடிவத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மதிப்புடனும் அமைக்கப்பட்டுள்ளது. ‘மூப்பர்கள்’, ‘தலைவன்’ ஆகிய சொற்கள் மூலத்தின் சமூக மற்றும் அதிகாரப் பரிமாணங்களைத் தக்கவைக்கின்றன. நேரடி உரையில் ஒருமை இரண்டாம் நபர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
