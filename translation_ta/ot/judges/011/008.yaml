review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the elders of Gilead, the return to Jephthah, the mission against the Ammonites, and the promised authority. However, ‘போரிட வேண்டும்’ adds an explicit necessity/obligation that is not stated by the Hebrew waw-perfect sequence. A future/request-and-promise formulation better retains the source’s progression and leaves its precise modal force unoverstated.
  naturalness: The Tamil is generally clear and modern. ‘கீலேயாத்தில் குடியிருப்போர் அனைவரின் தலைவனாக’ is more idiomatic and more directly communicates authority over the entire population than ‘...அனைவருக்கும் நீ தலைவனாக.’
  terminology: ‘மூப்பர்கள்,’ ‘யெப்தா,’ ‘கீலேயாத்,’ and ‘அம்மோனியர்கள்’ are appropriate. The ethnonym footnote is accurately anchored and naturally worded.
  issues:
  - severity: medium
    issue: ‘போரிட வேண்டும்’ introduces an explicit obligation.
    rationale: וְנִלְחַמְתָּ is coordinated with ‘you will go’ and ‘you will be head’; it can function as the elders’ requested course of action, but it does not itself express ‘must.’
  - severity: low
    issue: The final authority phrase is less direct than the Hebrew.
    rationale: ‘கீலேயாத்தில் குடியிருப்போர் அனைவரின் தலைவனாக’ naturally conveys that Jephthah will be head over all Gilead’s inhabitants, retaining the broad civic scope.
  revised_text: கீலேயாத்தின் மூப்பர்கள் யெப்தாவிடம், “அதனால்தான் இப்போது நாங்கள் உன்னிடம் திரும்பி வந்திருக்கிறோம். நீ எங்களுடன் சென்று அம்மோனியர்களுக்கு[a] எதிராகப் போரிடுவாய்; கீலேயாத்தில் குடியிருப்போர் அனைவரின் தலைவனாக இருப்பாய்” என்றார்கள்.
