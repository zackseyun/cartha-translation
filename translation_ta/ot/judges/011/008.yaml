revisions:
- from: கீலேயாத்தின் மூப்பர்கள் யெப்தாவிடம், “அதனால்தான் இப்போது நாங்கள் உன்னிடம் திரும்பி வந்திருக்கிறோம். நீ எங்களுடன் சென்று அம்மோனியர்களுக்கு[a] எதிராகப் போரிட வேண்டும்; கீலேயாத்தில் குடியிருக்கும் அனைவருக்கும் நீ தலைவனாக இருப்பாய்” என்றார்கள்.
  to: கீலேயாத்தின் மூப்பர்கள் யெப்தாவிடம், “அதனால்தான் இப்போது நாங்கள் உன்னிடம் திரும்பி வந்திருக்கிறோம். நீ எங்களுடன் சென்று அம்மோனியர்களுக்கு[a] எதிராகப் போரிடுவாய்; கீலேயாத்தில் குடியிருப்போர் அனைவரின் தலைவனாக இருப்பாய்” என்றார்கள்.
  rationale: 'The revision removes the added deontic force of ‘வேண்டும்’ and uses a coordinated future formulation that mirrors the Hebrew sequence: go with us, fight the Ammonites, and be head over all Gilead’s inhabitants. The final phrase is recast to express comprehensive authority naturally and explicitly in modern Tamil. The existing ethnonym footnote remains correctly anchored and sufficient.'
