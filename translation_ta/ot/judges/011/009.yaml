source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יִפְתָּ֜ח אֶל זִקְנֵ֣י גִלְעָ֗ד אִם מְשִׁיבִ֨ים אַתֶּ֤ם אוֹתִ/י֙ לְ/הִלָּחֵם֙ בִּ/בְנֵ֣י עַמּ֔וֹן וְ/נָתַ֧ן יְהוָ֛ה אוֹתָ֖/ם לְ/פָנָ֑/י אָנֹכִ֕י אֶהְיֶ֥ה לָ/כֶ֖ם לְ/רֹֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/009.yaml
  text: Jephthah said to the elders of Gilead[a], “If you bring me back to fight against the Ammonites, and Yahweh gives them before me[b], I will be your head.”
translation:
  language: ta
  text: யெப்தா கீலேயாத்தின் மூப்பர்களிடம், “அம்மோனியரோடு போரிடுவதற்காக நீங்கள் என்னைத் திரும்ப அழைத்து வந்து, யாவே அவர்களை என் முன்னால் ஒப்புக்கொடுத்தால், நான் உங்களுக்குத் தலைவனாக இருப்பேன்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இறுதிக் கூறை, “நான் உங்களுக்குத் தலைவனாக இருப்பேனா?” என்ற கேள்வியாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מְשִׁיבִים אַתֶּם אוֹתִי
  choice: நீங்கள் என்னைத் திரும்ப அழைத்துச் சென்று
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் ‘திரும்பச் செய்யுதல்’ என்று பொருள்படும். முன்பு விரட்டப்பட்ட யெப்தாவை மீண்டும் அழைத்துச் செல்வதைக் காட்ட இச்சொற்றொடர் இயல்பான தமிழில் காரணவினைப் பொருளைப் பேணுகிறது.
- source_word: לְהִלָּחֵם
  choice: போரிடுவதற்காக
  rationale: לחם என்பதன் நிஃபால் வினையெச்சம் இங்கு ஆயுதப் போரில் ஈடுபடுவதைக் குறிக்கிறது; ‘போரிட’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: בִּבְנֵי עַמּוֹן
  choice: அம்மோனியரோடு
  rationale: சொல்லுக்கு சொல் ‘அம்மோனின் மக்களோடு’ என்றாலும், இது அம்மோன் இனத்தாரைக் குறிக்கும் வழக்கமான இனப்பெயர். போர்ச் சூழலில் ב எதிர்ப்பொருளைக் கொண்டுள்ளது; தமிழில் ‘-ஓடு போரிட’ என்பதே இயல்பாக அதை வெளிப்படுத்துகிறது.
- source_word: וְנָתַן יְהוָה אוֹתָם לְפָנָי
  choice: யாவே அவர்களை என் முன்னால் ஒப்புக்கொடுத்தால்
  rationale: נתן + לפני என்பதன் உருவகத்தை ‘என் முன்னால் ஒப்புக்கொடுத்தல்’ என்று பேணி, வெற்றிக்காக எதிரிகளை யெப்தாவின் வசப்படுத்தும் பொருளைத் தெளிவாக்குகிறது. எபிரெயத்தில் இல்லாத ‘என் கையில்’ என்ற உருவகம் சேர்க்கப்படவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய தனிப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לְרֹאשׁ
  choice: தலைவன்
  rationale: רֹאשׁ என்பதன் அடிப்படைப் பொருள் ‘தலை’; இங்கு அது உருவகமாக ஆட்சித் தலைவர் அல்லது முதன்மையானவர் என்பதைக் குறிக்கிறது. ‘தலைவன்’ தமிழில் உருவகத்தையும் அரசியல் பொருளையும் இயல்பாகப் பேணுகிறது.
- source_word: אָנֹכִי אֶהְיֶה לָכֶם לְרֹאשׁ
  choice: நான் உங்களுக்குத் தலைவனாக இருப்பேன்
  rationale: எபிரெயத்தில் கேள்வியைக் குறிக்கும் துகள் இல்லாததால், இலக்கண வடிவத்துக்கு ஏற்ப இதை நிபந்தனையின் விளைவைக் கூறும் உறுதிமொழியாக மொழிபெயர்க்கிறது; உரையாடல் சூழலில் கேள்வியாகப் புரிந்துகொள்ளும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல வசனம் தனிப்பெயரான நான்கு எழுத்துத் திருநாமத்தை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பேணுகிறது.
- issue: אָנֹכִי אֶהְיֶה לָכֶם לְרֹאשׁ என்ற இறுதிக் கூறின் வாக்கிய வலிமை
  choice: ‘நான் உங்களுக்குத் தலைவனாக இருப்பேன்’ என்ற கூற்று
  alternative: ‘நான் உங்களுக்குத் தலைவனாக இருப்பேனா?’ என்ற கேள்வி
  rationale: எபிரெய வாக்கியத்தில் வெளிப்படையான கேள்வித் துகள் இல்லை; ஆகவே கூற்றாக மொழிபெயர்ப்பதே வடிவத்துக்கு மிக நெருக்கமானது. எனினும், யெப்தா நிபந்தனைகளை உறுதிப்படுத்தும் உரையாடல் சூழலால் சிலர் இதைக் கேள்வியாகப் புரிந்துகொள்வதால் அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மூப்பர்கள்,’ ‘யாவே,’ ‘தலைவன்’ ஆகியவை வேதாகமச் சூழலின் கண்ணியத்தைப் பேணுகின்றன; எபிரெயத்தில் உள்ள இறுதிக் கூறின் இலக்கண வடிவமும் உரையாடல் சார்ந்த தெளிவின்மையும் தனித்தனியாகக் காக்கப்பட்டுள்ளன.
