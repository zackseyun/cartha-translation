source:
  edition: WLC
  text: וַ/יִּדַּ֨ר יִפְתָּ֥ח נֶ֛דֶר לַ/יהוָ֖ה וַ/יֹּאמַ֑ר אִם נָת֥וֹן תִּתֵּ֛ן אֶת בְּנֵ֥י עַמּ֖וֹן בְּ/יָדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/030.yaml
  text: And Jephthah made a vow to Yahweh and said[a], “If you indeed give the Ammonites into my hand,”
translation:
  language: ta
  text: 'யெப்தா யாவேக்கு ஒரு நேர்த்திக்கடன் செய்து, இவ்வாறு கூறினான்: “நீர் அம்மோனியரை நிச்சயமாக என் கையில் ஒப்புக்கொடுத்தால்,[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீர் அம்மோனியரை உறுதியாக என் கையில் ஒப்புக்கொடுத்தால்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் வினைச்சொல்லுடன் அதே வேரைச் சேர்ந்த வலியுறுத்தும் முற்றிலா வினை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר יִפְתָּח נֶדֶר
  choice: யெப்தா … ஒரு நேர்த்திக்கடன் செய்து
  rationale: ஒரே வேரிலிருந்து வந்த வினைச்சொல்–பெயர்ச்சொல் இணைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘நேர்த்திக்கடன்’ என்பது கடவுளிடம் உறுதியளிக்கப்படும் வாக்கைத் தெளிவாகக் குறிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேவிடம்
  rationale: எபிரெய மூலத்தில் வரும் கடவுளின் தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது; ל முன்னிடைச்சொல் இச்சூழலில் ‘இடம்’ என இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: אִם
  choice: …ஒப்புக்கொடுத்தால்
  rationale: நிபந்தனையை அறிமுகப்படுத்தும் אִם என்பதன் பொருள், தமிழின் நிபந்தனை வினைமுற்றில் இயல்பாக வெளிப்படுகிறது; வாக்கியம் அடுத்த வசனத்தில் தொடரும் தன்மையும் காக்கப்படுகிறது.
- source_word: נָתוֹן תִּתֵּן
  choice: நிச்சயமாக … ஒப்புக்கொடுத்தால்
  rationale: முற்றுவினையுடன் சேர்ந்த absolute infinitive தரும் வலியுறுத்தலை ‘நிச்சயமாக’ என்பதால் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּנֵי עַמּוֹן
  choice: அம்மோனியரை
  rationale: ‘அம்மோனின் மகன்கள்’ என்ற சொல்லுக்குச் சொல் வடிவத்துக்குப் பதிலாக, குறிக்கப்படும் மக்களினத்தை நவீன தமிழில் நேரடியாகக் கூறுகிறது.
- source_word: בְּיָדִי
  choice: என் கையில்
  rationale: ஒருவரின் அதிகாரத்துக்குள் ஒப்புக்கொடுத்தலைக் குறிக்கும் எபிரெய உருவகத்தையும் மூலத்தின் ஒருமையையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைபெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், பொதுவாக ஏற்றுக்கொள்ளப்படும் ‘யாவே’ என்ற வடிவில் ஒலிபெயர்ப்பது உடன்படிக்கையின் தனிப்பெயரைப் பாதுகாக்கிறது.
- issue: யெப்தாவின் நேர்த்திக்கடனின் நிபந்தனையில் உள்ள வலியுறுத்தல்
  choice: நிச்சயமாக
  alternative: உறுதியாக; உண்மையாகவே
  rationale: נָתוֹן תִּתֵּן என்ற இலக்கண அமைப்பு செயலை வலியுறுத்துகிறது. அடுத்த வசனத்தில் வரும் நேர்த்திக்கடனின் உள்ளடக்கத்தை முன்கூட்டியே விளக்காமல், இவ்வசனத்தின் வலியுறுத்தலை மட்டும் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையுடனும் பொதுவாசகர்களுக்குப் புரியும் வகையிலும் அமைக்கப்பட்டுள்ளது. இறைவனை நோக்கிய ஒருமை மரியாதை வடிவமாக ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது. மேற்கோள் அடுத்த வசனத்தில் தொடர்வதால் நிபந்தனை முடிவுறாதவாறு விடப்பட்டுள்ளது.
