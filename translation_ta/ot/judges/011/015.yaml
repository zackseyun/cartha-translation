source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֔/וֹ כֹּ֖ה אָמַ֣ר יִפְתָּ֑ח לֹֽא לָקַ֤ח יִשְׂרָאֵל֙ אֶת אֶ֣רֶץ מוֹאָ֔ב וְ/אֶת אֶ֖רֶץ בְּנֵ֥י עַמּֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/015.yaml
  text: 'And he said to him[a], “Thus says Jephthah: Israel did not take the land of Moab or the land of the sons of Ammon.”'
translation:
  language: ta
  text: 'அவன் அவனிடம், “யெப்தா இவ்வாறு கூறுகிறார்: இஸ்ரவேல் மோவாபின் நாட்டையோ அம்மோன் மகன்களின் நாட்டையோ[a] எடுத்துக்கொள்ளவில்லை” என்று சொன்னான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அம்மோனியரின் நாடு.” எபிரேயத்தில், “அம்மோன் மகன்களின் நாடு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לּוֹ
  choice: அவன் அவனிடம் ... சொன்னான்
  rationale: தொடர்ச்சியான அடுத்த பேச்சுச் செயலைக் குறிக்கும் எபிரெயக் கதைநடையைப் பிரதிபலிக்கிறது. எழுவாயும் பெறுவாயும் ஆண்பால் ஒருமையில் இருப்பதைத் தமிழிலும் வெளிப்படுத்தி, அவை யாரைக் குறிக்கின்றன என்பதை உரை தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: כֹּה אָמַר
  choice: இவ்வாறு கூறுகிறார்
  rationale: தூதர் அறிவிப்புக்குரிய முறையான சொற்றொடரின் தன்மையையும், மேற்கோளுக்குள் உள்ள நிகழ்காலத் தொனியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יִפְתָּח
  choice: யெப்தா
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: לֹא לָקַח
  choice: கைப்பற்றவில்லை
  rationale: நிலப்பகுதியைத் ‘தனதாக்கிக் கொள்ளுதல்’ என்ற சூழல்சார் பொருளை இயல்பாகத் தருகிறது; ‘பறித்துக்கொள்ளவில்லை’ என்று மொழிபெயர்த்து தேவையற்ற வன்முறைத் தொனியைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: אֶרֶץ
  choice: நாடு
  rationale: இங்கு புவியியல் மற்றும் அரசியல் நிலப்பகுதி ஆகிய இரு கூறுகளையும் உள்ளடக்கும் இயல்பான தமிழ் சொல்; எபிரெய மூலத்திலுள்ள சொல்லின் மறுபயன்பாடும் காக்கப்படுகிறது.
- source_word: מוֹאָב
  choice: மோவாப்
  rationale: இடம்/மக்கள் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு; வேற்றுமைத் தொடர்புக்காக உரையில் ‘மோவாபின்’ என வருகிறது.
- source_word: בְּנֵי עַמּוֹן
  choice: அம்மோன் புத்திரர்
  rationale: சொல்லுக்குச் சொல் ‘அம்மோனின் மகன்கள்/புத்திரர்’ என்ற எபிரெய இனக்குழுப் பெயரை முதன்மை உரையில் காக்கிறது; இயல்பான இனப்பெயர் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
