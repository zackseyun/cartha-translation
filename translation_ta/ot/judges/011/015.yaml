translation_notes:
  register: நவீனத் தரத் தமிழில், தூதரக அறிவிப்புக்கேற்ற முறையான ஆனால் எளிதில் புரியும் நடையைப் பயன்படுத்துகிறது. மூலத்தின் இரு ஆண்பால் ஒருமைப் பிரதிப்பெயர்களால் ஏற்படும் குறிப்புத் தெளிவின்மை தீர்க்கப்படாமல் காக்கப்பட்டுள்ளது.
