revisions:
- from: 'அவன் அவனிடம், “யெப்தா இவ்வாறு கூறுகிறார்: இஸ்ரவேல் மோவாபின் நாட்டையோ அம்மோன் புத்திரரின் நாட்டையோ[a] கைப்பற்றவில்லை” என்று சொன்னான்.'
  to: 'அவன் அவனிடம், “யெப்தா இவ்வாறு கூறுகிறார்: இஸ்ரவேல் மோவாபின் நாட்டையோ அம்மோன் மகன்களின் நாட்டையோ[a] எடுத்துக்கொள்ளவில்லை” என்று சொன்னான்.'
  rationale: 'The revision changes only two points: it renders לָקַח with the less forceful ‘எடுத்துக்கொள்ளவில்லை,’ and it updates ‘புத்திரர்’ to modern ‘மகன்கள்.’ The pronoun ambiguity, formal quotation formula, and the Hebrew’s repeated territorial construction are retained.'
