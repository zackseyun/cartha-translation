base_translation:
  language: en
  yaml_path: translation/ot/judges/011/040.yaml
  text: From year to year the daughters of Israel would go to commemorate the daughter of Jephthah the Gileadite four days in the year[a].
translation:
  language: ta
  text: ஆண்டுதோறும் இஸ்ரவேலின் மகள்கள், கிலேயாத்தியனான யெப்தாவின் மகளை நினைவுகூருவதற்காக ஆண்டில் நான்கு நாட்கள் செல்வது வழக்கமாயிருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யெப்தாவின் மகளுக்காகப் புலம்ப”; அல்லது, “யெப்தாவின் மகளைப் பற்றிச் சொல்ல.” இதற்கான எபிரெய வினைச்சொல் அரிதானது; அதன் பொருள் விவாதத்திற்குரியது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיָּמִים יָמִימָה
  choice: ஆண்டுதோறும்
  rationale: இந்த எபிரெய மரபுத்தொடர் ஆண்டுதோறும் நிகழும் ஒழுங்கான வழக்கத்தைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: תֵּלַכְנָה
  choice: போய் ... வழக்கமாயிற்று
  rationale: இங்குள்ள imperfect வடிவம் கடந்தகாலத்தில் தொடர்ந்து நிகழ்ந்த வழக்கத்தைக் காட்டுகிறது; தமிழில் இந்த அமைப்பு அந்த வழக்கத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகள்கள்
  rationale: வயது அல்லது திருமண நிலையை ஊகிக்காமல் எபிரெயச் சொல்லமைப்பை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: לְתַנּוֹת
  choice: நினைவுகூர
  rationale: இந்த அரிய வினைச்சொல்லின் பொருள் விவாதத்திற்குரியது. இச்சூழலில் நினைவுகூருதல் பொருத்தமான முதன்மைத் தேர்வாக உள்ளது; புலம்புதல் அல்லது அவளைப் பற்றிச் சொல்லுதல் ஆகிய சாத்தியங்கள் அடிக்குறிப்பில் வைக்கப்படுகின்றன.
- source_word: לְבַת יִפְתָּח
  choice: யெப்தாவின் மகளை
  rationale: ஆண்டு அனுசரிப்பின் தொடர்புப் பொருளாக யெப்தாவின் மகளை நேரடியாக அடையாளப்படுத்துகிறது.
- source_word: הַגִּלְעָדִי
  choice: கிலேயாத்தியனான
  rationale: இனப்பெயர்/பிரதேச அடையாளத்தை இயல்பான தமிழ் பெயரடை அமைப்பில் தருகிறது.
- source_word: אַרְבַּעַת יָמִים בַּשָּׁנָה
  choice: ஆண்டுக்கு நான்கு நாட்கள்
  rationale: அனுசரிப்பின் கால அளவையும் ஆண்டு நிகழ்வையும் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: யெப்தாவின் மகளைச் சார்ந்த ஆண்டு அனுசரிப்பின் தன்மை
  choice: முதன்மை உரையில் ‘நினைவுகூர’ என்று மொழிபெயர்த்து, வேறு சாத்தியமான பொருள்களை அடிக்குறிப்பில் பாதுகாத்தல்
  alternative: ‘புலம்ப’ அல்லது ‘அவளைப் பற்றிச் சொல்ல’
  rationale: இந்த அரிய எபிரெய வினைச்சொல்லின் பொருள் உறுதியற்றது; மேலும் அதன் விளக்கம் யெப்தாவின் நேர்த்திக்கடனையும் அவரது மகளின் முடிவையும் பற்றிய விவாதத்துடன் தொடர்புடையது. ஆகவே எந்த ஒரு இறையியல் முடிவையும் மொழிபெயர்ப்புக்குள் திணிக்காமல் பொருள் வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இஸ்ரவேலின் மகள்கள்’ என்ற எபிரெய வடிவம் பாதுகாக்கப்பட்டுள்ளது; வழக்கமான கடந்தகாலச் செயலைத் தமிழில் இயல்பாகக் காட்ட ‘வழக்கமாயிற்று’ பயன்படுத்தப்பட்டுள்ளது.
