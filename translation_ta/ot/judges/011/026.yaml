base_translation:
  language: en
  yaml_path: translation/ot/judges/011/026.yaml
  text: While Israel has lived in Heshbon and its daughter towns[a], and in Aroer and its daughter towns, and in all the cities that are along the Arnon, for three hundred years[b], why did you not recover them during that time?
translation:
  language: ta
  text: இஸ்ரவேல் எஸ்போனிலும் அதன் துணை ஊர்களிலும்[a], அரோவேரிலும் அதன் துணை ஊர்களிலும், அர்னோன் ஓரத்திலுள்ள எல்லாப் பட்டணங்களிலும் முந்நூறு ஆண்டுகளாகக் குடியிருந்த அந்தக் காலத்தில், நீங்கள் ஏன் அவற்றை மீட்டுக்கொள்ளவில்லை?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அதன் மகள்கள்’; ஒரு முதன்மைப் பட்டணத்தைச் சார்ந்த சிறிய குடியிருப்புகளைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: ‘அவற்றை விடுவிக்கவில்லை’ அல்லது ‘அவற்றைக் காப்பாற்றவில்லை’ என்றும் மொழிபெயர்க்கலாம்; இச்சூழலில் நிலப்பகுதியை மீட்டுக்கொள்வதே கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֶׁבֶת
  choice: குடியிருந்து வந்தபோது
  rationale: בְּ உடன் வரும் ישׁב வினையெச்ச வடிவம் காலச் சூழலைக் குறிக்கிறது; தொடர்ந்து நீடித்த குடியிருப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּנוֹתֶיהָ
  choice: அதன் துணை ஊர்கள்
  rationale: சொல்லுக்கு சொல் பொருள் ‘அதன் மகள்கள்’; முதன்மைப் பட்டணத்தைச் சார்ந்த குடியிருப்புகளைக் குறிக்கும் எபிரெய மரபுத்தொடரின் கருத்தைத் தெளிவாக வழங்குகிறது.
- source_word: עַרְעוֹר
  choice: அரோவேர்
  rationale: இடப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: עַל יְדֵי אַרְנוֹן
  choice: அர்னோன் ஓரத்திலுள்ள
  rationale: ‘அருகில், ஓரமாக’ என்ற இடஞ்சார்ந்த பொருளைப் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘ஆறு’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: முந்நூறு ஆண்டுகளாக
  rationale: இஸ்ரவேலின் குடியிருப்பு நீடித்த கால அளவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: הִצַּלְתֶּם
  choice: அவற்றை மீட்டுக்கொள்ளவில்லை
  rationale: נצל என்பதன் ஹிஃபில் வடிவம் பொதுவாக ‘விடுவித்தல்/காப்பாற்றுதல்’ எனப் பொருள்படலாம்; இங்குள்ள நிலப்பகுதி உரிமை விவாதத்தில் மீண்டும் தம் கட்டுப்பாட்டுக்குள் கொண்டுவருதல் என்பதே சூழல்சார் பொருள். மறைமுக செயப்படுபொருள் தமிழில் தெளிவுக்காக ‘அவற்றை’ என வழங்கப்பட்டுள்ளது.
- source_word: בָּעֵת הַהִיא
  choice: அந்தக் காலத்தில்
  rationale: குறிப்பிடப்பட்ட முந்நூறு ஆண்டு காலப்பகுதியைக் குறிக்கும் இயல்பான தமிழ் காலத் தொடர்.
