source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח יִשְׂרָאֵ֣ל מַלְאָכִ֣ים אֶל מֶלֶךְ֩ אֱד֨וֹם לֵ/אמֹ֜ר אֶעְבְּרָה נָּ֣א בְ/אַרְצֶ֗/ךָ וְ/לֹ֤א שָׁמַע֙ מֶ֣לֶךְ אֱד֔וֹם וְ/גַ֨ם אֶל מֶ֧לֶךְ מוֹאָ֛ב שָׁלַ֖ח וְ/לֹ֣א אָבָ֑ה וַ/יֵּ֥שֶׁב יִשְׂרָאֵ֖ל בְּ/קָדֵֽשׁ׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/017.yaml
  text: Then Israel sent messengers to the king of Edom[a], saying, ‘Please let us pass through your land,’ but the king of Edom did not listen. And he also sent to the king of Moab, but he was unwilling[b], so Israel remained at Kadesh.
translation:
  language: ta
  text: அப்போது இஸ்ரவேல் ஏதோம் அரசனிடம் தூதர்களை அனுப்பி, “தயவுசெய்து உமது நாட்டின் வழியாக நான் கடந்துசெல்ல அனுமதியுங்கள்[a]” என்று கேட்டது. ஆனால் ஏதோம் அரசன் அதற்குச் செவிகொடுக்கவில்லை. இஸ்ரவேல் மோவாப் அரசனிடமும் தூதர்களை அனுப்பியது; ஆனால் அவன் அதற்கு உடன்படவில்லை[b]. ஆகவே இஸ்ரவேல் காதேசில் தங்கியிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “நான் கடந்துசெல்ல” என்று ஒருமையில் உள்ளது; இஸ்ரவேல் ஒரு கூட்டாக ஒருமை வடிவில் பேசுகிறது. பொருளை வெளிப்படுத்த சில மொழிபெயர்ப்புகள் “நாங்கள் கடந்துசெல்ல” என்று தருகின்றன.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவன் விரும்பவில்லை” / “அவன் சம்மதிக்கவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: தூதர்களை அனுப்பி
  rationale: எபிரெயக் கதைநடையின் எளிய இறந்தகாலச் செயலை இயல்பான தமிழ் தொடர் வினையாக அளிக்கிறது.
- source_word: מַלְאָכִים
  choice: தூதர்கள்
  rationale: இது அரசியல் தொடர்புடைய மனிதத் தூதர்களைக் குறிக்கிறது; வானதூதர்கள் என்ற பொருள் இச்சூழலில் பொருந்தாது.
- source_word: אֶעְבְּרָה נָּא
  choice: தயவுசெய்து ... நான் கடந்துசெல்ல அனுமதியும்
  rationale: முதல் நபர் ஒருமை cohortative வடிவத்தையும் נָא காட்டும் பணிவான வேண்டுகோளையும் காக்கிறது; இஸ்ரவேல் ஒரு கூட்டு ஆளுமையாக ஒருமையில் பேசுகிறது.
- source_word: בְאַרְצֶךָ
  choice: உமது நாட்டின் வழியாக
  rationale: பயணச் சூழலில் நாட்டுக்குள் தங்குவதை அல்ல, அதன் வழியாகக் கடந்துசெல்வதைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְלֹא שָׁמַע
  choice: அதற்குச் செவிகொடுக்கவில்லை
  rationale: வெறுமனே கேட்கவில்லை என்பதைக் காட்டிலும், வேண்டுகோளை ஏற்றுச் செயல்படவில்லை என்ற שׁמע-வின் சூழல் பொருளை இயல்பாகத் தருகிறது.
- source_word: וְלֹא אָבָה
  choice: அதற்கு உடன்படவில்லை
  rationale: אָבָה என்பதிலுள்ள விருப்பம் அல்லது சம்மதம் இல்லாமையைத் தெரிவிக்கிறது; ‘மறுத்துவிட்டான்’ என்பதைக் காட்டிலும் மூலத்தின் நுண்ணிய பொருளை நெருக்கமாகக் காக்கிறது.
- source_word: וַיֵּשֶׁב
  choice: தங்கியிருந்தது
  rationale: நிரந்தரமாகக் குடியேறியது என்று உணர்த்தாமல், பயணத்தின் நடுவில் ஓரிடத்தில் தொடர்ந்து இருந்ததை வெளிப்படுத்துகிறது.
- source_word: בְּקָדֵשׁ
  choice: காதேசிலேயே
  rationale: இடப்பெயருடன் இயல்பான தமிழ் வேற்றுமையுருபைப் பயன்படுத்தி, அங்கேயே தொடர்ந்திருந்ததையும் வலியுறுத்துகிறது.
theological_decisions:
- issue: இஸ்ரவேல் பேசும் எண்ணிக்கை
  choice: “நான்” என்ற ஒருமை வடிவம்
  alternative: “நாங்கள்” என்ற பன்மை வடிவம்
  rationale: எபிரெய மூலத்தில் முதல் நபர் ஒருமை உள்ளது; இஸ்ரவேல் ஒரு கூட்டு ஆளுமையாகப் பேசும் இலக்கணத் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: 'நவீன தரத் தமிழில் இயல்பான, கண்ணியமான வேதாகமக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசனிடம் பேசும் மரியாதையை ‘உமது’, ‘அனுமதியும்’ என்பவை வெளிப்படுத்துகின்றன. பெயர் எழுதுமுறை: Edom—ஏதோம், Moab—மோவாப், Kadesh—காதேஸ்.'
