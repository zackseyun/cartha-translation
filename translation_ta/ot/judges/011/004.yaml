translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. காலத்தைச் சுட்டும் எபிரெய மரபுத்தொடரின் சொல்லாட்சியை அடிக்குறிப்பு பாதுகாக்கிறது.
