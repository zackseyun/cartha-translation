base_translation:
  language: en
  yaml_path: translation/ot/judges/011/004.yaml
  text: After some time[a], the Ammonites fought against Israel.
translation:
  language: ta
  text: சிறிது காலத்திற்குப் பிறகு[a], அம்மோனியர்கள் இஸ்ரவேலுக்கு எதிராகப் போரிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “நாட்களுக்குப் பிறகு நிகழ்ந்தது”; இது சிறிது காலம் கடந்ததைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: சிறிது காலத்திற்குப் பிறகு
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘நாட்களுக்குப் பிறகு நிகழ்ந்தது’ என்றிருந்தாலும், இது காலம் கடந்ததைச் சுட்டும் எபிரெய மரபுத்தொடர். இயல்பான நவீனத் தமிழில் அதன் காலப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וַיִּלָּחֲמוּ
  choice: போரிட்டார்கள்
  rationale: לחם என்பதன் இந்த வடிவம் இச்சூழலில் போரில் ஈடுபட்டதைக் குறிக்கிறது. ‘போரிட்டார்கள்’ என்பது நேர்த்தியான, இயல்பான தமிழ்.
- source_word: בְּנֵי עַמּוֹן
  choice: அம்மோனியர்கள்
  rationale: சொல்லுக்குச் சொல் ‘அம்மோனின் மகன்கள்’ என்றாலும், இங்கு அது அம்மோன் மக்கள் இனத்தைக் குறிக்கும் வழக்கமான இனப்பெயர்.
- source_word: עִם יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராக
  rationale: עִם என்பதன் அடிப்படைப் பொருள் ‘உடன்’; ஆனால் לחם உடன் வரும் போர்ச் சூழலில் அது எதிர்த்தரப்பைக் குறிக்கிறது. ‘எதிராக’ என்பது தமிழில் அந்த உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
