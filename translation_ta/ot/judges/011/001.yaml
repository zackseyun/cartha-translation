translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டது. தொடக்க וְ என்பதற்காக மூலத்தில் இல்லாத காலக் குறிப்பு சேர்க்கப்படவில்லை. பாலியல் தொழிலைக் குறிக்கும் சொல்லின் நேரடியான பொருள் மழுப்பப்படவில்லை; அதேவேளையில் தேவையற்ற இழிவான நடை தவிர்க்கப்பட்டது.
