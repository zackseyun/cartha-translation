  text: וְ/יִפְתָּ֣ח הַ/גִּלְעָדִ֗י הָיָה֙ גִּבּ֣וֹר חַ֔יִל וְ/ה֖וּא בֶּן אִשָּׁ֣ה זוֹנָ֑ה וַ/יּ֥וֹלֶד גִּלְעָ֖ד אֶת יִפְתָּֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/001.yaml
  text: Jephthah the Gileadite was a mighty warrior[a], and he was the son of a prostitute[c][b]; and Gilead fathered Jephthah.
translation:
  language: ta
  text: கிலேயாத்தைச் சேர்ந்த யெப்தா வலிமைமிக்க போர்வீரனாக இருந்தான்[a]. அவன் பாலியல் தொழில் செய்யும் ஒரு பெண்ணின் மகன்[b]; கிலேயாத்[c] யெப்தாவுக்குத் தந்தையானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்கு நெருக்கமாக, “வலிமையும் வீரமும் கொண்ட மனிதன்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “பாலியல் தொழில் செய்யும் ஒரு பெண்ணின் மகன்.” சில பழைய மொழிபெயர்ப்புகள் இதற்குப் பழமையான அல்லது கடுமையான சொற்களைப் பயன்படுத்துகின்றன.
    reason: lexical_alternative
  - marker: c
    text: இங்கு கிலேயாத் என்பது யெப்தாவின் தந்தையின் தனிப்பெயர்; கிலேயாத் பிராந்தியத்தை மட்டும் குறிக்கவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָדִי
  choice: கிலேயாத்தைச் சேர்ந்த
  rationale: இந்தப் பெயரடை யெப்தாவின் பிராந்தியச் சார்பைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இதைத் தெரிவிக்கிறது.
- source_word: גִּבּוֹר חַיִל
  choice: வலிமைமிக்க போர்வீரன்
  rationale: இச்சொற்றொடர் வலிமை, வீரம், குறிப்பாகப் போர்த்திறன் கொண்ட ஒருவனைக் குறிக்கிறது; கதையின் இராணுவச் சூழலில் இத்தேர்வு இயல்பானது.
- source_word: בֶּן אִשָּׁה זוֹנָה
  choice: ஒரு விபச்சாரப் பெண்ணின் மகன்
  rationale: זוֹנָה என்பதன் நேரடியான சமூகப் பொருளை மழுப்பாமலும் பழமையான சொற்களைப் பயன்படுத்தாமலும் தெளிவாகக் கூறுகிறது.
- source_word: וַיּוֹלֶד
  choice: தந்தையானான்
  rationale: ஹிபீல் வடிவம் உயிரியல் தந்தைமையைக் குறிக்கிறது. தமிழில் ஆண் பெற்றோரைத் தெளிவாகச் சுட்டும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: גִּלְעָד
  choice: கிலேயாத்
  rationale: இங்கு வினையின் எழுவாயாக வருவதால் இது பிராந்தியத்தை அல்ல, யெப்தாவின் தந்தையின் தனிப்பெயரைக் குறிக்கிறது.
- source_word: וְ
  choice: வாக்கியத் தொடர்ச்சி மற்றும் இணைப்பால் வெளிப்படுத்தப்பட்டது
  rationale: எபிரெய இணைப்புச் சொற்கள் தமிழில் ஒவ்வொரு முறையும் தனியே ‘மேலும்’ என்று மொழிபெயர்க்கப்பட வேண்டியதில்லை; இங்கு வாக்கிய அமைப்பே தொடர்ச்சியை இயல்பாகக் காட்டுகிறது.
