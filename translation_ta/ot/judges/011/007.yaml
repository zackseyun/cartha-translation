id: JDG.11.7
reference: Judges 11:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִפְתָּח֙ לְ/זִקְנֵ֣י גִלְעָ֔ד הֲ/לֹ֤א אַתֶּם֙ שְׂנֵאתֶ֣ם אוֹתִ֔/י וַ/תְּגָרְשׁ֖וּ/נִי מִ/בֵּ֣ית אָבִ֑/י וּ/מַדּ֜וּעַ בָּאתֶ֤ם אֵלַ/י֙ עַ֔תָּה כַּ/אֲשֶׁ֖ר צַ֥ר לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/007.yaml
  text: Jephthah said to the elders of Gilead[a], “Did you not hate me and drive me out from my father’s house? So why have you come to me now, when you are in distress?”
translation:
  language: ta
  text: யெப்தா கிலேயாத்தின் மூப்பர்களிடம், “நீங்கள்தானே என்னை வெறுத்து, என் தந்தையின் வீட்டிலிருந்து என்னைத் துரத்திவிட்டீர்கள்? அப்படியிருக்க, இப்போது நீங்கள் நெருக்கடியில் இருக்கும்போது[a] என்னிடம் ஏன் வந்தீர்கள்?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் இக்கட்டில் இருக்கும்போது.” எபிரெயச் சொற்றொடர் நெருக்கடியான அல்லது துன்பமான நிலையில் இருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: எபிரெயக் கதைநடையில் வழக்கமான உரையறிவிப்பாக இருப்பதால், தமிழில் இயல்பான ‘என்றான்’ பயன்படுத்தப்பட்டது.
- source_word: זִקְנֵי גִלְעָד
  choice: கிலேயாத்தின் மூப்பர்கள்
  rationale: இது வெறுமனே முதியவர்களை அல்ல, சமூகத்தை வழிநடத்தும் அதிகாரப்பூர்வ மூப்பர்களைக் குறிக்கிறது.
- source_word: הֲלֹא
  choice: நீங்கள்தானே
  rationale: ஒப்புதலை எதிர்பார்க்கும் வினாவை நவீனத் தமிழில் இயல்பாகவும் வலியுறுத்தலுடனும் வெளிப்படுத்துகிறது.
- source_word: שְׂנֵאתֶם
  choice: வெறுத்து
  rationale: שׂנא என்பதன் நேரடியான உறவுசார் பகைமையை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: וַתְּגָרְשׁוּנִי
  choice: என்னைத் துரத்திவிட்டீர்கள்
  rationale: גרשׁ குறிக்கும் வலுக்கட்டாய வெளியேற்றத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: מִבֵּית אָבִי
  choice: என் தந்தையின் வீட்டிலிருந்து
  rationale: ‘வீடு’ என்பது உடல் கட்டிடத்தையும் குடும்ப வீட்டாரின் வட்டத்தையும் குறிக்கக்கூடிய மூலமொழியின் குடும்ப-சட்டப் பின்னணியைத் திறந்த நிலையில் வைக்கிறது.
- source_word: וּמַדּוּעַ
  choice: அப்படியிருக்க ... ஏன்
  rationale: முந்தைய குற்றச்சாட்டிலிருந்து தொடரும் முரண்பாட்டையும் காரணவியல் தொடர்பையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: בָּאתֶם אֵלַי עַתָּה
  choice: இப்போது ... என்னிடம் ஏன் வந்தீர்கள்
  rationale: עַתָּה என்பதன் கால வலியுறுத்தலைக் காத்து, நேரடி உரையாடலுக்கேற்ற தமிழ்ச் சொல்வரிசையைப் பயன்படுத்துகிறது.
- source_word: כַּאֲשֶׁר צַר לָכֶם
  choice: நீங்கள் நெருக்கடியில் இருக்கும்போது
  rationale: צַר לָכֶם குறிக்கும் இக்கட்டான அல்லது துன்பமான நிலையை அதன் காரணத்தை மிகையாகக் குறிப்பாக்காமல் தெரிவிக்கிறது; כַּאֲשֶׁר என்பதன் காலச்சூழலும் காக்கப்படுகிறது.
