translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நேரடி உரைநடை பயன்படுத்தப்பட்டது. ‘நீங்கள்தானே’ என்பது மூலத்தின் சொல்லாட்சிசார் வினாவையும், ‘அப்படியிருக்க’ என்பது இரண்டாவது கேள்வியின் குற்றஞ்சாட்டும் தொடர்பையும் காக்கிறது.
