  text: וַ/יֹּ֣אמֶר לֵ֔כִי וַ/יִּשְׁלַ֥ח אוֹתָ֖/הּ שְׁנֵ֣י חֳדָשִׁ֑ים וַ/תֵּ֤לֶךְ הִיא֙ וְ/רֵ֣עוֹתֶ֔י/הָ וַ/תֵּ֥בְךְּ עַל בְּתוּלֶ֖י/הָ עַל הֶ/הָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/038.yaml
  text: And he said[a], “Go.” So he sent her away for two months, and she went, she and her companions, and wept over her virginity on the mountains.
translation:
  language: ta
  text: அவன், “போ” என்றான். ஆகவே, அவன் அவளை இரண்டு மாதங்களுக்கு அனுப்பிவைத்தான். அவள் தன் தோழிகளுடன் சென்று, மலைகளில் தன் கன்னிமையைக் குறித்து[a] அழுதாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் கன்னிமைக்காக” / “தன் கன்னிமையின் காரணமாக.” அவள் புலம்பியதன் பொருள் அவளுடைய கன்னிமையே என்று எபிரெய உரை வெளிப்படையாகக் கூறுகிறது; விரிந்த நிகழ்ச்சிப் பகுதியை விளக்குவதில் இது ஒரு மையமான விவரம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵכִי
  choice: போ
  rationale: הלך என்பதன் பெண்பால் ஒருமை கட்டளை வடிவம். சுருக்கமான நேரடிக் கட்டளையை இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: וַיִּשְׁלַח אוֹתָהּ
  choice: அவன் அவளை ... அனுப்பிவைத்தான்
  rationale: இங்கு שׁלח என்பது அவள் குறிப்பிட்ட காலத்திற்குப் புறப்பட்டுச் செல்ல அனுமதித்து அனுப்பியதைக் குறிக்கிறது; நிராகரித்து விரட்டியதாகப் பொருள் தராமல் செயலைத் தெளிவாகக் கூறுகிறது.
- source_word: שְׁנֵי חֳדָשִׁים
  choice: இரண்டு மாதங்களுக்கு
  rationale: அனுமதிக்கப்பட்ட கால அளவைக் குறிக்கும் தொடராகத் தமிழில் இயல்பாக அமைகிறது.
- source_word: וַתֵּלֶךְ הִיא וְרֵעוֹתֶיהָ
  choice: அவள் தன் தோழிகளுடன் சென்று
  rationale: அவளும் அவளுடைய தோழிகளும் சென்றதை இயல்பான நவீனத் தமிழில் கூறுகிறது; எபிரெய உரையின் நாயகி மீதான கவனத்தையும் தக்கவைக்கிறது.
- source_word: רֵעוֹתֶיהָ
  choice: தன் தோழிகள்
  rationale: பெண்பால் பன்மை வடிவமான இச்சொல் அவளுடன் சென்ற பெண் தோழிகளைக் குறிக்கிறது. ‘தோழிகள்’ என்பது இச்சூழலில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וַתֵּבְךְּ
  choice: அழுதாள்
  rationale: בכה என்பது அழுதல் அல்லது கண்ணீர் சிந்துதலைக் குறிக்கிறது; நிகழ்வின் துயரமான தொனிக்கு எளிய ‘அழுதாள்’ பொருந்துகிறது.
- source_word: עַל בְּתוּלֶיהָ
  choice: தன் கன்னிமையைக் குறித்து
  rationale: עַל இங்கு அவளுடைய புலம்பலின் பொருளை அறிமுகப்படுத்துகிறது. ‘குறித்து’ என்பது எபிரெயின் பொருள் பரப்பைப் பேணுவதோடு, ‘அதன் காரணமாக’ என்ற ஒரே விளக்கத்திற்குள் வசனத்தைச் சுருக்குவதில்லை.
- source_word: עַל הֶהָרִים
  choice: மலைகளில்
  rationale: அவர்கள் மலைப்பகுதியில் இருந்த இடச்சூழலை இயல்பான தமிழில் குறிக்கிறது; ‘மலைகளின்மேல்’ என்பது இங்கு செயற்கையாக ஒலிக்கும்.
theological_decisions:
- issue: யெப்தாவின் மகள் தன் கன்னிமையைக் குறித்து அழுததன் பொருள்
  choice: அவளுடைய புலம்பலின் வெளிப்படையான பொருள் அவளது கன்னிமை என்பதையே முதன்மை உரை கூறுகிறது.
  alternative: அவள் மனிதப் பலியாக இறக்கவிருந்ததற்காக அழுதாள்; அல்லது வாழ்நாள் முழுவதும் கன்னியாகவும் பிள்ளையற்றவளாகவும் இருக்கவிருந்ததற்காக அழுதாள்.
  rationale: இந்த வசனம் அவள் தன் கன்னிமையைக் குறித்து அழுததாக மட்டுமே வெளிப்படையாகக் கூறுகிறது. விரிந்த நிகழ்ச்சிப் பகுதியின் விவாதத்திற்குரிய முடிவை மொழிபெயர்ப்புக்குள் சேர்க்காமல், மூல உரையின் இறையியல் மற்றும் விளக்கவியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கன்னிமை’ என்பது மூலத்தின் בְּתוּלִים என்ற கருத்தை நேரடியாகப் பேணுகிறது. அடிக்குறிப்பு குறி அது விளக்கும் சொற்றொடருக்குப் பின்பே வைக்கப்பட்டுள்ளது.
