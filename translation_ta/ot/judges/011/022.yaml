translation_notes:
  register: நவீனத் தரத் தமிழில், வேதாகமப் புவியியல் நடையைக் காக்கும் கண்ணியமான ஆனால் எளிதில் புரியும் மொழிநடை பயன்படுத்தப்பட்டுள்ளது. எல்லையைக் குறிக்கும் இரட்டை ‘முதல்…வரையிலும்’ அமைப்பு மூலத்தின் இணைநிலையைப் பாதுகாக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
