  to: அவர்கள் எமோரியர்களின்[a] முழு எல்லைப்பகுதியையும்[b] அர்னோன் முதல் யாபோக்கு வரையிலும், பாலைநிலம் முதல் யோர்தான் வரையிலும் கைப்பற்றினர்.[c]
