base_translation:
  language: en
  yaml_path: translation/ot/judges/011/022.yaml
  text: So they took possession of all the territory of the Amorites[a], from the Arnon as far as the Jabbok[c][b], and from the wilderness as far as the Jordan.
translation:
  language: ta
  text: அவர்கள் எமோரியர்களின்[a] முழு எல்லைப்பகுதியையும்[b] அர்னோன் முதல் யாபோக்கு வரையிலும், பாலைநிலம் முதல் யோர்தான் வரையிலும் கைப்பற்றினர்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘எமோரியன்’ என்று ஒருமையில் உள்ளது; அது எமோரிய மக்களை மொத்தமாகக் குறிக்கும் தொகுப்பொருள் ஒருமை.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல்லை ‘எல்லை’ அல்லது ‘எல்லைப்பகுதி’ என்றும் மொழிபெயர்க்கலாம்; இங்கு அந்த எல்லைகளுக்குள் இருந்த முழு நிலப்பரப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘கைப்பற்றினர்’ என்பதற்கான எபிரெய வினைச்சொல்லை ‘உடைமையாக்கினர்’ அல்லது ‘சுதந்தரித்தனர்’ என்றும் மொழிபெயர்க்கலாம்; இங்கு ஒரு நிலப்பரப்பைக் கட்டுப்பாட்டுக்குள் கொண்டுவருவது பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: கைப்பற்றிக்கொண்டார்கள்
  rationale: ירשׁ என்பது வெற்றிகொள்ளும் சூழலில் ஒரு நிலப்பகுதியைத் தங்கள் கட்டுப்பாட்டுக்குள் கொண்டு வந்து உடைமையாக்குவதைக் குறிக்கிறது; இங்கு ‘சுதந்தரித்தார்கள்’ என்பதைவிடச் செயற்பாட்டுள்ள நிலக் கைப்பற்றுதலை இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל גְּבוּל
  choice: எல்லாப் பகுதிகளையும்
  rationale: כָּל என்பதன் முழுமையையும், גְּבוּל இங்கு எல்லைக் கோடுகளை மட்டும் அல்லாமல் அவற்றுக்குள் உள்ள நிலப்பரப்பைக் குறிப்பதையும் இந்தச் சொற்றொடர் தெரிவிக்கிறது.
- source_word: הָאֱמֹרִי
  choice: எமோரியர்களின்
  rationale: எபிரெயத்தில் ஒருமை வடிவம் இருந்தாலும் அது எமோரிய மக்களை மொத்தமாகக் குறிக்கும் தொகுப்பொருள் ஒருமை; தமிழில் பன்மை இயல்பானது.
- source_word: מֵאַרְנוֹן וְעַד הַיַּבֹּק
  choice: அர்னோன் முதல் யாப்போக்கு வரையிலும்
  rationale: מִן...עַד என்னும் அமைப்பு நிலப்பரப்பின் இரு எல்லைகளுக்கு இடையிலான பரப்பைக் குறிக்கிறது.
- source_word: וּמִן הַמִּדְבָּר וְעַד הַיַּרְדֵּן
  choice: பாலைநிலம் முதல் யோர்தான் வரையிலும்
  rationale: מִדְבָּר என்பது மணற்பாலைவனத்தை மட்டும் குறிக்காமல் குடியிருப்பில்லாத வறண்ட பாலைநிலத்தையும் குறிக்கலாம்; இணையான எல்லை அமைப்பு தமிழிலும் காக்கப்படுகிறது.
