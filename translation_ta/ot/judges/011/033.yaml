base_translation:
  language: en
  yaml_path: translation/ot/judges/011/033.yaml
  text: And he struck them from Aroer as far as the entrance to Minnith[a], twenty cities, and as far as Abel-keramim, with a very great slaughter[d][c][b]. So the sons of Ammon were subdued before the sons of Israel.
translation:
  language: ta
  text: அவன் அம்மோனியரை ஆரோவேர் தொடங்கி மின்னித்தின் நுழைவிடம் வரை[a]—இருபது நகரங்கள்—மேலும் ஆபேல்-கெராமீம்[b] வரையிலும் மிகப் பெரும் அடியால் தாக்கினான்[c]. இவ்வாறு அம்மோனியர் இஸ்ரவேலருக்கு முன்பாக அடக்கப்பட்டார்கள்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மின்னித் வரை,” அல்லது “மின்னித்தை அணுகும் இடம் வரை.” எபிரெயத் தொடர் சற்றுக் கடினமானது; அது நகரை அணுகும் இடத்தையோ நகரத்தையேவோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ஆபேல்-கெராமீம் என்பது ஓர் இடப்பெயர். அதன் கூறுகள் ஏறத்தாழ “திராட்சைத்தோட்டங்களின் புல்வெளி” என்று பொருள்படலாம்; ஆனால் இங்கு இடப்பெயராக இருப்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “மிகப் பெரும் தாக்குதலால்” அல்லது “மிகப் பெரிய படுதோல்விக்கு உள்ளாக்கி.” எபிரெயச் சொற்றொடர் பேரழிவை ஏற்படுத்தும் இராணுவத் தாக்குதலைக் குறிக்கலாம்; அது தனியே மரணங்களின் துல்லிய அளவை நிர்ணயிப்பதில்லை.
    reason: lexical_alternative
  - marker: d
    text: சொற்சொல்லாக, “அம்மோனின் மகன்கள் இஸ்ரவேலின் மக்களுக்கு முன்பாக.” இவை அம்மோனியரையும் இஸ்ரவேலரையும் குறிக்கும் எபிரெய இனக்குழு வழக்குகள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: அவர்களை ... முறியடித்தான்
  rationale: נכה என்பதன் அடிப்படைப் பொருள் ‘அடி/தாக்கு’; போர்ச் சூழலிலும் தொடர்ந்து வரும் מַכָּה என்ற சொல்லுடனும் சேர்ந்து, தமிழில் இயல்பாகவும் நிகழ்வின் இராணுவத் தன்மையைத் தெளிவாகவும் சொல்ல ‘முறியடித்தான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מֵעֲרוֹעֵר
  choice: ஆரோவேர் தொடங்கி
  rationale: இது ஓர் இடப்பெயர்; மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டது. מִן குறிக்கும் தொடக்க எல்லை ‘தொடங்கி’ என வழங்கப்பட்டது.
- source_word: וְעַד בּוֹאֲךָ מִנִּית
  choice: மின்னித்தின் நுழைவிடம் வரை
  rationale: בּוֹאֲךָ என்ற கடினமான புவியியல் தொடரை நகரை அணுகும் இடம் அல்லது நுழைவிடம் எனப் புரிந்துகொள்ளலாம். முதன்மை உரையில் இயல்பான ‘நுழைவிடம்’ பயன்படுத்தப்பட்டு, உண்மையான மாற்று வாசிப்புகள் அடிக்குறிப்பில் வைக்கப்பட்டன.
- source_word: עֶשְׂרִים עִיר
  choice: இருபது நகரங்களையும்
  rationale: எண்ணும் பெயர்ச்சொல்லும் நேரடியாக மொழிபெயர்க்கப்பட்டன; עִיר என்பதற்கு இச்சூழலில் ‘நகரம்’ பொருத்தமானது.
- source_word: וְעַד אָבֵל כְּרָמִים
  choice: ஆபேல்-கெராமீம் வரையிலும்
  rationale: இது இடப்பெயராகச் செயல்படுவதால் அதன் கூறுகளைப் பொருளாக்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: מַכָּה גְּדוֹלָה מְאֹד
  choice: மிகப் பெரும் தாக்குதலால்
  rationale: מַכָּה என்பது ‘அடி, தாக்குதல், படுதோல்வி’ ஆகிய பொருள்களை ஏற்கக்கூடியது. போர்ச் சூழலையும் சொல்லின் உருவகத் திறப்பையும் காக்க ‘மிகப் பெரும் தாக்குதல்’ தேர்ந்தெடுக்கப்பட்டது; ‘படுகொலை’ என்று இறப்பின் அளவை உரைக்கு மேலாகத் தீர்மானிக்கவில்லை.
- source_word: וַיִּכָּנְעוּ
  choice: அடக்கப்பட்டார்கள்
  rationale: Niphal வடிவிலுள்ள כנע இங்கு இராணுவ-அரசியல் அடக்கத்தைக் குறிக்கிறது; உள்ளார்ந்த தாழ்மையைச் சுட்டும் சொல்லைவிட ‘அடக்கப்பட்டார்கள்’ சூழலுக்குப் பொருந்துகிறது.
- source_word: בְּנֵי עַמּוֹן ... בְּנֵי יִשְׂרָאֵל
  choice: அம்மோனியர் ... இஸ்ரவேலர்
  rationale: எபிரெய ‘மகன்கள்’ என்ற இனக்குழு வழக்கைச் சொற்சொல்லாக வழங்குவது நவீன தமிழில் இயல்பற்றதாக இருப்பதால், அதன் சமூகப் பொருளைத் துல்லியமாகத் தரும் இனப்பெயர்கள் பயன்படுத்தப்பட்டன; சொற்சொல் வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்பட்டது.
- source_word: מִפְּנֵי
  choice: முன்பாக
  rationale: எதிரியின் முன்னிலையில் அல்லது எதிரே அடக்கப்படுதல் என்ற எபிரெய உறவுப்பொருளை ‘முன்பாக’ காக்கிறது.
