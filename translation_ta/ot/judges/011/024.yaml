  rationale: திருத்தம் ஹிஃபில் வினையின் காரணவினை நுணுக்கத்தை முதல் பாதியில் இயல்பாகத் தக்கவைக்கிறது. இரண்டாம் பாதியில், மூல உரை வெளிப்படையாகக் கூறாத ‘நமக்கு உடைமையாக்கித் தந்தார்’ என்ற கூடுதல் செயற்பாட்டை நீக்கி, அகற்றுதல் மற்றும் அதன் விளைவான கைப்பற்றுதல் என்ற இணை அமைப்பைத் தெளிவாகக் காக்கிறது. பொருளின் பரந்த/திறந்த குறிப்பு மாற்றப்படவில்லை.
