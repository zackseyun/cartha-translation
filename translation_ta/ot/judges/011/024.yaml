- from: உன் கடவுளான கேமோஷ் எதை உனக்கு உடைமையாக்கித் தருகிறானோ,[a] அதை நீ உடைமையாக்கிக்கொள்ள மாட்டாயா? அதுபோல, நம் கடவுளான யாவே நம் முன்னிலையிலிருந்து எதையெல்லாம் அகற்றி நமக்கு உடைமையாக்கித் தந்தாரோ, அதையெல்லாம் நாம் உடைமையாக்கிக்கொள்வோம்.[b]
