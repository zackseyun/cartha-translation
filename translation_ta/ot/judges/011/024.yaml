  text: הֲ/לֹ֞א אֵ֣ת אֲשֶׁ֧ר יוֹרִֽישְׁ/ךָ֛ כְּמ֥וֹשׁ אֱלֹהֶ֖י/ךָ אוֹת֥/וֹ תִירָ֑שׁ וְ/אֵת֩ כָּל אֲשֶׁ֨ר הוֹרִ֜ישׁ יְהוָ֧ה אֱלֹהֵ֛י/נוּ מִ/פָּנֵ֖י/נוּ אוֹת֥/וֹ נִירָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/024.yaml
  text: Will you not possess what Chemosh your god causes you to possess? And all that Yahweh our God has dispossessed before us[b][a], that we will possess.
translation:
  language: ta
  text: உன் கடவுளான கேமோஷ் உனக்குச் சொந்தமாக்கித் தருவதை நீ கைப்பற்றிக்கொள்ள மாட்டாயா?[a] அதுபோல, நம் கடவுளான யாவே நம் முன்னிலையிலிருந்து எதையெல்லாம் அகற்றினாரோ, அதையெல்லாம் நாம் கைப்பற்றிக்கொள்வோம்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உனக்குச் சொந்தமாக்கித் தருவதை’ என்பதற்கான எபிரெய வினை, பிறரை அகற்றுவதன் மூலம் ஒருவரை ஒரு நிலத்தின் உடைமையாளராகச் செய்வதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இவ்வசனத்தில் மீண்டும் வரும் எபிரெய வினை ירשׁ, ‘மரபுரிமையாகப் பெறு,’ ‘உடைமையாக்கிக்கொள்,’ அல்லது முன்னிருந்தவர்களை அகற்றி ஒரு நிலத்தைக் கைப்பற்று என்ற பொருள்களில் வரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: உடைமையாக்கிக்கொள்ள மாட்டாயா?
  rationale: இது ஒப்புதலை எதிர்பார்க்கும் வினாவாக இருப்பதால், தமிழில் இயல்பான எதிர்மறை வினா வடிவம் பயன்படுத்தப்பட்டது.
- source_word: יוֹרִישְׁךָ
  choice: உனக்கு உடைமையாக்கித் தருகிறானோ
  rationale: ירשׁ என்பதன் ஹிஃபில் வடிவம், பிறரை அகற்றுவதன் மூலம் ஒருவரை உடைமைகொள்ளச் செய்வது என்ற காரணவினைப் பொருளைக் கொண்டுள்ளது. தமிழில் விளைவான உடைமையை இயல்பாக வெளிப்படுத்தும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: כְּמוֹשׁ אֱלֹהֶיךָ
  choice: உன் கடவுளான கேமோஷ்
  rationale: தெய்வத்தின் தனிப்பெயர் ஒலிபெயர்க்கப்பட்டு, எபிரெய உரையின் நேரடி உரையாடல் அமைப்பு பாதுகாக்கப்பட்டது.
- source_word: תִירָשׁ
  choice: உடைமையாக்கிக்கொள்ள மாட்டாயா
  rationale: இங்கு ירשׁ நிலப்பகுதியைக் கைப்பற்றி உடைமையாகக் கொள்வதைக் குறிக்கிறது; குடும்ப மரபுரிமை என்ற தவறான எண்ணத்தைத் தவிர்க்க ‘உடைமையாக்கிக்கொள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הוֹרִישׁ
  choice: அகற்றி நமக்கு உடைமையாக்கித் தந்தாரோ
  rationale: முன்னிருந்தவர்களை அகற்றுதல் மற்றும் அதன் விளைவாக இஸ்ரவேலர் உடைமைகொள்ளுதல் ஆகிய இரு கூறுகளையும் ஹிஃபில் வடிவம் சுமப்பதால், தமிழில் அவை இரண்டும் வெளிப்படையாகக் கூறப்பட்டன.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயர் ஒரு பட்டத்தால் மாற்றப்படாமல், எபிரெய தனிப்பெயரின் பொதுவான தமிழ் ஒலிபெயர்ப்பாக வழங்கப்பட்டது.
- source_word: מִפָּנֵינוּ
  choice: நம் முன்னிலையிலிருந்து
  rationale: ‘நமக்கு முன்பாக இருந்து’ என்ற இடவியல் மற்றும் மோதல் சார்ந்த எபிரெயச் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: נִירָשׁ
  choice: நாம் உடைமையாக்கிக்கொள்வோம்
  rationale: முதல் பாதியில் வரும் அதே ירשׁ வேரின் நிலவுடைமைப் பொருளையும் வாதத்தின் இணை அமைப்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: யெப்தாவின் உரையில் கேமோஷ் ‘உன் கடவுள்’ என்று குறிப்பிடப்படுதல்
  choice: ‘உன் கடவுளான கேமோஷ்’ என்று தகுதிப்படுத்தாமல் நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: மேற்கோள் குறிகள், ‘நீ கடவுளென்று கருதும்’ போன்ற விளக்கச் சொற்கள், அல்லது நையாண்டியாகப் பொருளுரைத்தல்.
  rationale: யெப்தா எதிர்த்தரப்பின் மதக் கோரிக்கையை அடிப்படையாகக் கொண்டு வாதிடுவதை எபிரெய உரை நேரடியாகப் பதிவு செய்கிறது. இந்தச் சொற்கள் கேமோஷின் உண்மையான தெய்வீகத்தையோ ஆற்றலையோ கதைசொல்லி உறுதிப்படுத்துவதாக அவசியமில்லை; கூடுதல் தகுதிப்படுத்தல் உரையில் இல்லாத விளக்கத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசர்களுக்கிடையிலான வாதத்தின் கண்ணியமான ஆனால் நேரடியான தொனி பேணப்பட்டது. ‘சுதந்தரித்தல்’ குடும்ப மரபுரிமையை முதன்மையாக நினைவூட்டக்கூடும் என்பதால், இங்குள்ள நிலப்பரப்பு மற்றும் அகற்றுதல் சார்ந்த பொருளுக்கு ‘உடைமையாக்கிக்கொள்ளுதல்’ பயன்படுத்தப்பட்டது. இணை வாக்கிய அமைப்பும் இரண்டாம் நபர்/முதல் நபர் எதிர்நிலையும் பாதுகாக்கப்பட்டன.
