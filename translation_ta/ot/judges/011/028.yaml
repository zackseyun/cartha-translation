base_translation:
  language: en
  yaml_path: translation/ot/judges/011/028.yaml
  text: But the king of the Ammonites did not listen to the words of Jephthah that he sent to him.
translation:
  language: ta
  text: ஆனால், அம்மோனியரின் ராஜா, யெப்தா அவனுக்கு அனுப்பிய வார்த்தைகளுக்குச் செவிகொடுக்கவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא שָׁמַע
  choice: ஆனால் ... செவிகொடுக்கவில்லை
  rationale: שׁמע with אֶל here means to heed or pay attention, not merely to hear. Tamil ‘செவிகொடுக்கவில்லை’ naturally preserves that sense; the initial conjunction is rendered contrastively as ‘ஆனால்’ in context.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: அம்மோனியரின் ராஜா
  rationale: The construct phrase literally denotes ‘the king of the sons/people of Ammon.’ ‘அம்மோனியரின் ராஜா’ is clear and idiomatic modern Tamil.
- source_word: דִּבְרֵי יִפְתָּח אֲשֶׁר שָׁלַח אֵלָיו
  choice: யெப்தா தனக்கு அனுப்பிய செய்தி
  rationale: דברים can denote words or a communicated message. Since Jephthah sent these words to the king, singular collective ‘செய்தி’ gives the intended sense naturally. ‘தனக்கு’ makes the recipient refer back to the king and avoids an awkward chain of pronouns.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘ராஜா’ பொதுவாசகர்களுக்குப் பரிச்சயமான வேதாகம அரசாட்சிச் சொல்லாகத் தக்கவைக்கப்பட்டது; வசனத்தின் பொருளைத் தீர்மானிக்கும் சமயவியல் விரிவாக்கம் எதுவும் சேர்க்கப்படவில்லை.
