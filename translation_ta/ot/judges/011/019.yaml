source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיח֥וֹן מֶֽלֶךְ הָ/אֱמֹרִ֖י מֶ֣לֶךְ חֶשְׁבּ֑וֹן וַ/יֹּ֤אמֶר ל/וֹ֙ יִשְׂרָאֵ֔ל נַעְבְּרָה נָּ֥א בְ/אַרְצְ/ךָ֖ עַד מְקוֹמִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/019.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], king of Heshbon, and Israel said to him[b], “Please let us pass through your land to our place.”
translation:
  language: ta
  text: பின்பு இஸ்ரவேல், அமோரியரின் அரசனும் எஸ்போனின் அரசனுமான சீகோனிடம் தூதர்களை[a] அனுப்பியது. இஸ்ரவேல் அவனிடம், “தயவுசெய்து, உமது நாட்டின் வழியாக என் இடம்வரை[b] நாங்கள் கடந்து செல்ல அனுமதியுங்கள்” என்று கூறியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அரசியல் பேச்சுவார்த்தைக்காக அனுப்பப்பட்டவர்கள் என்பதால், “பிரதிநிதிகளை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “என் இடம்வரை.” இஸ்ரவேல் மக்களைக் கூட்டாக ஒரே நபர்போல் பேசுகிறது; அதே வேண்டுகோளில் “நாங்கள்” என்ற பன்மை வடிவமும் வருகிறது.'
    reason: collective_number_ambiguity
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பி
  rationale: தொடர்ச்சியான எபிரெயக் கதைநடையை இயல்பான தமிழ் வினையெச்சத் தொடராக வழங்குகிறது.
- source_word: מַלְאָכִים
  choice: தூதர்களை
  rationale: இங்கு விண்ணுலகத் தூதர்கள் அல்ல, அரசரிடம் அனுப்பப்பட்ட மனிதத் தூதர்கள் குறிக்கப்படுகின்றனர்; அரசியல் சூழலில் ‘பிரதிநிதிகள்’ என்றும் பொருள்படலாம்.
- source_word: מֶלֶךְ הָאֱמֹרִי מֶלֶךְ חֶשְׁבּוֹן
  choice: எமோரியரின் அரசனும் எஸ்போனின் அரசனுமான
  rationale: சீகோனை விவரிக்கும் இரண்டு இணையான அரசப் பட்டங்களையும் விடாமல், தமிழில் இயல்பாக இணைக்கிறது.
- source_word: וַיֹּאמֶר לוֹ יִשְׂרָאֵל
  choice: அவனிடம் ... என்று கூறியது
  rationale: மூலத்தில் ‘இஸ்ரவேல்’ மீண்டும் வெளிப்படையாக வருவதை, தமிழில் அதே எழுவாயின் தொடர்ச்சியாகவும் ஒரு மக்களினத்தை ஒருமை அலகாகவும் காட்டுகிறது.
- source_word: נַעְבְּרָה נָּא
  choice: தயவுசெய்து ... நாங்கள் கடந்துசெல்ல அனுமதியும்
  rationale: பன்மை விருப்பவினை வடிவத்தையும் நָא காட்டும் மரியாதையான வேண்டுகோளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְאַרְצְךָ
  choice: உமது நாட்டின் வழியாக
  rationale: עבר என்பதுடன் இச்சொற்றொடர் ஒரு நிலப்பரப்பினூடாகப் பயணிப்பதைக் குறிக்கிறது; ‘வழியாக’ என்பது தமிழில் இயல்பான திசைப்பொருளைத் தருகிறது.
- source_word: עַד מְקוֹמִי
  choice: என் இடம்வரை
  rationale: மசோரா எபிரெய உரையில் உள்ள முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டை (‘என்’) பாதுகாக்கிறது; பன்மையாக மாற்றி ஒத்திசைக்கவில்லை.
