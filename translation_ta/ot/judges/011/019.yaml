translation_notes:
  register: நவீன செந்தமிழ் நடையும் மரியாதையான அரசியல் வேண்டுகோள் தொனியும் பயன்படுத்தப்பட்டுள்ளன. ‘என்’ மற்றும் ‘நாங்கள்’ இடையிலான மூலமொழியின் எண்ணியல் பதற்றம் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது; ‘எங்கள் இடம்’ என்று சீராக்கப்படவில்லை.
