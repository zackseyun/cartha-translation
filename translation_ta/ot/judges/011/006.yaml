  yaml_path: translation/ot/judges/011/006.yaml
  text: And they said to Jephthah[a], “Come and be our commander, and let us fight against the Ammonites.”
translation:
  language: ta
  text: அவர்கள் யெப்தாவிடம், “வாருங்கள்; எங்களுக்குப் படைத்தலைவராக இருங்கள்; நாம் அம்மோனியருக்கு எதிராகப் போரிடுவோம்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ לְיִפְתָּח
  choice: அவர்கள் யெப்தாவிடம் ... என்றார்கள்
  rationale: தொடர்நிகழ்வைக் குறிக்கும் எபிரெய வினை வடிவத்தைத் தமிழின் இயல்பான கதைநடையில் மொழிபெயர்த்து, יִפְתָּח என்ற பெயரை ‘யெப்தா’ என ஒலிபெயர்த்தது.
- source_word: לְכָה
  choice: நீர் வந்து
  rationale: இந்தச் சூழலில் அழைப்பு அல்லது வேண்டுகோளாக வரும் கட்டளை வடிவத்தை மரியாதையான நேரடி உரையில் இயல்பாகத் தருகிறது.
- source_word: וְהָיִיתָה לָּנוּ
  choice: எங்களுக்குப் ... இரும்
  rationale: ‘எங்களுக்காக/எங்களுக்குரியவராக இரும்’ என்ற எபிரெய அமைப்பின் பொருளைத் தமிழ் நேரடி உரையில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: לְקָצִין
  choice: படைத்தலைவராக
  rationale: קָצִין என்பது தலைவர் அல்லது தளபதியைக் குறிக்கலாம்; உடனடியான போர் சூழலில் ‘படைத்தலைவர்’ துல்லியமும் பொதுப் புரிதலும் உடையது.
- source_word: וְנִלָּחֲמָה
  choice: நாம் ... போரிடுவோம்
  rationale: முதல் நபர் பன்மை cohortative வடிவத்தின் கூட்டு முனைப்பை, தேவையற்ற நோக்கப் பொருளைச் சேர்க்காமல் வெளிப்படுத்துகிறது.
- source_word: בִּבְנֵי עַמּוֹן
  choice: அம்மோனியரோடு
  rationale: לחם உடன் வரும் ב எதிர்த்துப் போரிடும் தரப்பைக் குறிக்கிறது; ‘அம்மோனின் மகன்கள்’ என்பது இனக்குழுப் பெயராதலால் தமிழில் வழக்கமான ‘அம்மோனியர்’ எனத் தரப்பட்டது.
