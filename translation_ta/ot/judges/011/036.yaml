base_translation:
  language: en
  yaml_path: translation/ot/judges/011/036.yaml
  text: And she said to him[a], “My father, you have opened your mouth to Yahweh; do to me according to what has gone out from your mouth, since Yahweh has taken vengeance for you on your enemies[b], on the sons of Ammon.”
translation:
  language: ta
  text: அவள் அவரிடம், “என் தந்தையே, நீங்கள் யாவேயிடம் உங்கள் வாயைத் திறந்திருக்கிறீர்கள்[a]. உங்கள் வாயிலிருந்து வெளிவந்ததன்படியே எனக்குச் செய்யுங்கள். ஏனெனில் யாவே உங்கள் எதிரிகளாகிய அம்மோனியர்கள்மேல் உங்களுக்காகப் பழிவாங்கியிருக்கிறார்[b]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவேயிடம் வாயைத் திறத்தல்” என்பது ஒரு நேர்த்திக்கடன் செய்தலைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: 'எபிரெயில் சொல்லுக்கு சொல்: “அம்மோனின் மக்களிடமிருந்து.” இதை “அம்மோனியர்களுக்கு எதிராக” என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצִיתָה אֶת־פִּיךָ
  choice: உங்கள் வாயைத் திறந்துவிட்டீர்கள்
  rationale: சொல்லப்பட்ட நேர்த்திக்கடனைக் குறிக்கும் எபிரெய மரபுத்தொடரின் உருவகத்தைத் தக்கவைக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றாக இடாமல், எபிரெய தனிப்பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: עֲשֵׂה לִי
  choice: எனக்குச் செய்யுங்கள்
  rationale: முதல் நபர் பின்னொட்டுடன் வரும் לְ என்பதன் இயல்பான தமிழாக்கம்; நேர்த்திக்கடன் எவ்வாறு நிறைவேற்றப்படும் என்பதை இந்த வசனத்திலேயே தீர்மானிக்கவில்லை.
- source_word: כַּאֲשֶׁר יָצָא מִפִּיךָ
  choice: உங்கள் வாயிலிருந்து வெளிவந்தபடியே
  rationale: முன்னுள்ள ‘வாயைத் திறத்தல்’ என்ற சொல்லாட்சியுடன் உள்ள தொடர்பையும், வாயால் கூறப்பட்ட வார்த்தையின் கட்டுப்படுத்தும் தன்மையையும் காக்கிறது.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: ஏனெனில்
  rationale: இங்கு வெறும் காலத் தொடர்ச்சியைவிட, மகளின் வேண்டுகோளுக்கான காரணத்தை இச்சொற்றொடர் அறிமுகப்படுத்துகிறது.
- source_word: נְקָמוֹת
  choice: பழிவாங்கியிருக்கிறார்
  rationale: எதிரிகளுக்கு எதிராக நிகழ்த்தப்பட்ட பழிதீர்க்கும் செயல்களை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מֵאֹיְבֶיךָ
  choice: உங்கள் எதிரிகள்மேல்
  rationale: מִן என்பதன் நேரடி ‘இருந்து’ என்ற பொருளை விட, பழிவாங்குதலின் இலக்கைத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: מִבְּנֵי עַמּוֹן
  choice: அம்மோனியர்கள்மேல்
  rationale: ‘அம்மோனின் மகன்கள்’ என்ற எபிரெய இனப்பெயரை, பாலினத் தவறுணர்வு ஏற்படாத இயல்பான நவீனத் தமிழில் தருகிறது.
theological_decisions:
- issue: யெப்தாவின் நேர்த்திக்கடன் எவ்வகையானது என்பது
  choice: அந்த நேர்த்திக்கடன் தன்னிடம் நிறைவேற்றப்படுவதற்கு மகள் இணங்குவதாக மட்டும் மொழிபெயர்த்து, அதன் நிறைவேற்றத்தின் தன்மையைத் தீர்மானிக்காமல் விடுதல்
  alternative: அது அவளைப் பலியிடுவதைக் குறித்தது என்று அல்லது வாழ்நாள் முழுவதும் கன்னியாக அர்ப்பணிப்பதைக் குறித்தது என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: இந்த வசனம் அவளுடைய இணக்கத்தைப் பதிவு செய்கிறது; நேர்த்திக்கடன் எவ்வாறு நிறைவேற்றப்படும் என்பதை இவ்வசனம் தனியே குறிப்பிடவில்லை. ஆகவே விவாதத்திற்குரிய விளக்கங்களில் ஒன்றை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மகள் தந்தையிடம் பேசுவதற்கேற்ற மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் ‘வாய்’ உருவகம் தக்கவைக்கப்பட்டாலும், இனப்பெயர் இயல்பான ‘அம்மோனியர்கள்’ என வழங்கப்பட்டுள்ளது. நடை கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமாக உள்ளது.
