source:
  edition: WLC
  text: וַ֠/יִּתֵּן יְהוָ֨ה אֱלֹהֵֽי יִשְׂרָאֵ֜ל אֶת סִיח֧וֹן וְ/אֶת כָּל עַמּ֛/וֹ בְּ/יַ֥ד יִשְׂרָאֵ֖ל וַ/יַּכּ֑וּ/ם וַ/יִּירַשׁ֙ יִשְׂרָאֵ֔ל אֵ֚ת כָּל אֶ֣רֶץ הָ/אֱמֹרִ֔י יוֹשֵׁ֖ב הָ/אָ֥רֶץ הַ/הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/021.yaml
  text: And Yahweh[a], the God of Israel, gave Sihon and all his people into the hand of Israel, and they struck them down. So Israel took possession of all the land of the Amorites who lived in that land.
translation:
  language: ta
  text: இஸ்ரவேலின் கடவுளாகிய யாவே[a], சீகோனையும் அவனுடைய மக்கள் அனைவரையும் இஸ்ரவேலின் கையில் ஒப்புக்கொடுத்தார்; அவர்கள் அவர்களை வீழ்த்தினார்கள். இவ்வாறு, அந்த நாட்டில் வாழ்ந்த எமோரியரின் நாடு முழுவதையும் இஸ்ரவேல் கைப்பற்றியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் இறைவனின் தனிப்பெயர் יהוה (YHWH); இங்கே அது “யாவே” என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: divine_name
lexical_decisions:
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கையில் ஒப்புக்கொடுத்தார்
  rationale: נתן என்பதும் ‘கையில்’ என்ற எபிரேய மரபுத்தொடரும் சேர்ந்து, ஒருவரின் அதிகாரத்திற்குள் ஒப்புக்கொடுப்பதைச் சுட்டுகின்றன. ‘ஒப்புக்கொடுத்தார்’ என்பது போர்ச் சூழலின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; ‘கையில்’ என்பதையும் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயர்; பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்கப்படுகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: YHWH-ஐ இஸ்ரவேலின் கடவுளாக அடையாளப்படுத்தும் எபிரேய இணைநிலை அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: סִיחוֹן
  choice: சீகோன்
  rationale: எபிரேய தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: כָּל עַמּוֹ
  choice: அவனுடைய மக்கள் அனைவரையும்
  rationale: עַם என்பதன் நேரடிப் பொருள் ‘மக்கள்’. போர்ச் சூழல் இருந்தாலும், மூலத்தில் வெளிப்படையாக ‘படை’ என்று இல்லாததால் அதனைச் சேர்க்கவில்லை.
- source_word: וַיַּכּוּם
  choice: அவர்கள் அவர்களை வீழ்த்தினார்கள்
  rationale: נכה என்ற வினை போர்ச் சூழலில் தாக்கி முறியடித்தல் அல்லது வீழ்த்துதல் என்ற பொருளைக் கொண்டது. பன்மை எழுவாயையும் ஆண்பால் பன்மை செயப்படுபொருளையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַיִּירַשׁ
  choice: கைப்பற்றியது
  rationale: ירש இங்கு வெற்றிக்குப் பின் நாட்டைத் தம் உடைமையாக்கிக் கொண்டதைக் குறிக்கிறது. ‘கைப்பற்றியது’ என்பது தமிழில் நிலப்பகுதியை வசப்படுத்திய பொருளை இயல்பாகத் தருகிறது.
- source_word: כָּל אֶרֶץ הָאֱמֹרִי
  choice: எமோரியரின் நாடு முழுவதையும்
  rationale: எபிரேய ஒருமை இனப்பெயர் கூட்டுப்பொருளில் வருகிறது; தமிழில் ‘எமோரியர்’ எனப் பன்மைக் கூட்டுப்பெயராக வழங்குவது இயல்பானது. כָּל என்பதன் முழுமை ‘நாடு முழுவதையும்’ எனக் காக்கப்படுகிறது.
- source_word: יוֹשֵׁב הָאָרֶץ הַהִיא
  choice: அந்த நாட்டில் வாழ்ந்த
  rationale: செயற்பெயரெச்சம் அந்த நாட்டில் குடியிருந்த எமோரியரை விவரிக்கிறது; தமிழில் பெயரெச்சத் தொடராக இயல்பாக வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதனை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: சீகோனின் ‘மக்கள்’ என்பது படையையா எல்லா மக்களையுமா குறிக்கிறது
  choice: மக்கள் அனைவரும்
  alternative: படை முழுவதும்
  rationale: போர்ச் சூழலில் போரிட்டவர்களைக் குறிப்பதாக இருக்கலாம்; ஆனால் עַם என்ற சொல் ‘மக்கள்’ என்பதே. மூலத்தின் பரப்பைச் சுருக்காமல் அந்தத் தெளிவின்மையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கையில் ஒப்புக்கொடுத்தார்’ என்பது எபிரேய உருவகத்தையும் அதன் அதிகாரப் பொருளையும் ஒருசேரக் காக்கிறது. ‘அவர்கள் அவர்களை’ என்ற மீளுரைத்தல் எபிரேய வாக்கியத்தின் பன்மை உறவுகளைத் தெளிவுபடுத்துவதற்காகத் தக்கவைக்கப்பட்டுள்ளது.
