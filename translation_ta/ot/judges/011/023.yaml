  to: இப்போது இஸ்ரவேலின் கடவுளாகிய யாவே, தம் மக்களாகிய இஸ்ரவேலின் முன்னிலையிலிருந்து எமோரியரை அகற்றியிருக்கிறார். நீயோ அதை உடைமையாக்கிக்கொள்வாயா?[a]
