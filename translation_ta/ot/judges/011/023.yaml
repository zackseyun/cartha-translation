base_translation:
  language: en
  yaml_path: translation/ot/judges/011/023.yaml
  text: And now Yahweh[a], the God of Israel, has dispossessed the Amorites from before his people Israel; and are you to possess it?
translation:
  language: ta
  text: இப்போது இஸ்ரவேலின் கடவுளாகிய யாவே, தம் மக்களாகிய இஸ்ரவேலின் முன்னிலையிலிருந்து எமோரியரை அகற்றியிருக்கிறார். நீயோ அதை உடைமையாக்கிக்கொள்வாயா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அதைச் சுதந்தரித்துக்கொள்வாயா?” அல்லது “அதைக் கைப்பற்றிக்கொள்வாயா?” என்றும் மொழிபெயர்க்கலாம். எபிரேய வினைச்சொல், ஒரு நிலத்தைச் சுதந்தரித்துக்கொள்வதையோ அதன் உடைமையைப் பெற்றுக்கொள்வதையோ குறிக்கலாம்.
    reason: ירש என்ற வினைச்சொல்லின் நிலத்தைச் சுதந்தரித்தல், உடைமையாக்குதல், கைப்பற்றுதல் ஆகிய பொருள் வாய்ப்புகளைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: முந்தைய வாதத்திலிருந்து யெப்தா முன்வைக்கும் முடிவுக்கான உரையாடல் மாற்றத்தை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: யாவேவை இஸ்ரவேலின் கடவுளாக அடையாளப்படுத்தும் எபிரெய இணைப்புத் தொடரை நேரடியாகக் காட்டுகிறது.
- source_word: הוֹרִישׁ
  choice: அவர்களுடைய நிலத்திலிருந்து அகற்றியிருக்கிறார்
  rationale: ஹிஃபில் வடிவம் எமோரியர் நிலவுடைமையை இழக்கச் செய்யப்பட்டதை உணர்த்துகிறது. தமிழில் வெறும் ‘துரத்தினார்’ என்பதைக் காட்டிலும் நிலவுடைமைச் சூழலை இச்சொற்றொடர் தெளிவாக்குகிறது.
- source_word: הָאֱמֹרִי
  choice: எமோரியரை
  rationale: எபிரெயத்தில் ஒருமை வடிவம் இனக்குழுவைக் கூட்டாகக் குறிக்கிறது; தமிழில் பன்மை மக்கள் பெயர் இயல்பானது.
- source_word: מִפְּנֵי עַמּוֹ יִשְׂרָאֵל
  choice: தம் மக்களான இஸ்ரவேலுக்கு முன்பாக
  rationale: இஸ்ரவேல் யாவேயின் மக்கள் என்பதையும், அவர்களுக்கு முன்பாக எமோரியர் அகற்றப்பட்டார்கள் என்ற இடம்சார் உருவகத்தையும் காக்கிறது.
- source_word: וְאַתָּה
  choice: நீயோ
  rationale: தனி சுட்டுப்பெயரின் வலியுறுத்தலையும் எதிர்கொள்ளும் வினாவின் கூர்மையையும் தமிழின் ‘-ஓ’ விகுதி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תִּירָשֶׁנּוּ
  choice: அதை உடைமையாக்கிக்கொள்வாயா
  rationale: நிலத்தைப் பெற்றுக்கொள்வது அல்லது கைப்பற்றுவது என்ற ירש வேரின் பொருளைச் சூழலுக்கேற்றவாறு காட்டுகிறது; ஒருமைச் சுட்டுப்பொருள் நிலப்பகுதியைக் குறிக்கும் எனப் பொருள்கொள்ளப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதைப் ‘ஆண்டவர்’ போன்ற பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: இறுதி வினாவின் சுட்டுப்பொருள்
  choice: ‘அதை’ என்பது நிலம் அல்லது பிரதேசத்தைக் குறிக்கிறது
  alternative: இலக்கணரீதியாக ஆண்பால் ஒருமைச் சுட்டு எமோரிய இனத்தாரைக் கூட்டாகக் குறிக்கலாம்
  rationale: உடைமை மற்றும் நில உரிமை பற்றிய உடனடி வாதச் சூழல் நிலப்பகுதியையே நோக்குகிறது; ஆயினும் எபிரெயச் சுட்டின் இலக்கண வடிவம் காரணமாக உள்ள நுண்ணிய தெளிவின்மை முற்றிலும் மறுக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீயோ’ என்பது மூலத்தின் வலியுறுத்தப்பட்ட எதிர்வினாவைப் பாதுகாக்கிறது; ‘உடைமையாக்கிக்கொள்’ நில உரிமை சார்ந்த மையப் பொருளைத் தெளிவாக்குகிறது.
