translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வனாந்தரம்’ மற்றும் ‘இஸ்ரவேல்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல்வடிவங்கள் வாசகருக்குப் பரிச்சயத்தைத் தக்கவைக்கின்றன; மூலத்தின் தொடர்ச்சியான பயண நிகழ்வுகளும் இலக்கண ஒருமையும் பாதுகாக்கப்பட்டுள்ளன.
