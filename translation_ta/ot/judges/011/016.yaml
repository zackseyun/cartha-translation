id: JDG.11.16
reference: Judges 11:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֖י בַּ/עֲלוֹתָ֣/ם מִ/מִּצְרָ֑יִם וַ/יֵּ֨לֶךְ יִשְׂרָאֵ֤ל בַּ/מִּדְבָּר֙ עַד יַם ס֔וּף וַ/יָּבֹ֖א קָדֵֽשָׁ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/016.yaml
  text: For when they came up from Egypt[a], Israel went through the wilderness as far as the Red Sea and came to Kadesh.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் எகிப்திலிருந்து புறப்பட்டு வந்தபோது, இஸ்ரவேல் வனாந்தரத்தின் வழியாக செங்கடல்[a] வரை சென்று, காதேசுக்கு வந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாணற்கடல்.’
    reason: יַם סוּף என்பதன் சொற்பொருள் சார்ந்த மாற்று மொழிபெயர்ப்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: எப்தாவின் வரலாற்று விளக்கத்தில், முந்தைய கூற்றுக்கான பின்னணியையும் காரணத்தையும் அறிமுகப்படுத்துகிறது; அடுத்து வரும் காலவாசகம் ‘வந்தபோது’ என்ற பொருளைத் தாங்குகிறது.
- source_word: בַּעֲלוֹתָם מִמִּצְרַיִם
  choice: அவர்கள் எகிப்திலிருந்து புறப்பட்டு வந்தபோது
  rationale: ב + வினையெச்சப் பெயர்ச்சொல் அமைப்பு காலப்பொருளைக் கொடுக்கிறது. עלה என்பதன் ‘மேலே வருதல்’ என்ற வெளியேற்ற மரபுத்தொடரைத் தமிழில் இயல்பாக ‘புறப்பட்டு வந்தபோது’ என்று வழங்குகிறது.
- source_word: וַיֵּלֶךְ ... בַּמִּדְבָּר
  choice: வனாந்தரத்தின் வழியாக ... சென்று
  rationale: הלך என்பது செல்லுதலைக் குறிக்கிறது; בַּמִּדְבָּר உடன் பயணப் பாதையைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘வனாந்தரத்தின் வழியாக’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: மக்களைக் கூட்டாகக் குறிக்கும் மரபான தமிழ் வேதாகமப் பெயர்வடிவம்; எபிரெய ஒருமை இலக்கணத்துக்கேற்ப ‘வந்தது’ எனத் தொடர்கிறது.
- source_word: עַד יַם סוּף
  choice: செங்கடல் வரை
  rationale: עַד குறிக்கும் எல்லை அல்லது பயணத்தின் தொலைவை ‘வரை’ துல்லியமாக வெளிப்படுத்துகிறது. יַם סוּף என்பதற்கு பரவலாக அறியப்பட்ட ‘செங்கடல்’ முதன்மைப் பாடத்தில் வைக்கப்பட்டு, சொற்பொருள் சார்ந்த மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיָּבֹא קָדֵשָׁה
  choice: காதேசுக்கு வந்தது
  rationale: בוא என்பதற்கு ‘வந்தது’ பொருந்துகிறது; קָדֵשָׁה-வில் உள்ள திசைகாட்டும் ה, காதேசை நோக்கிய இயக்கத்தைச் சுட்டுவதால் ‘காதேசுக்கு’ என வழங்கப்பட்டுள்ளது.
