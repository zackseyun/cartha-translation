  to: 'இரண்டு மாதங்களின் முடிவில் அவள் தன் தந்தையிடம் திரும்பிவந்தாள். அவனோ, தான் செய்திருந்த நேர்த்திக்கடனை அவள்மேல் நிறைவேற்றினான்.[a] அவள் எந்த ஆணுடனும் உடலுறவு கொண்டிருக்கவில்லை.[b] அது இஸ்ரவேலில் ஒரு வழக்கமாகியது:'
  rationale: திருத்தம் தமிழின் தொடரியல் இயல்பைச் சீர்செய்கிறது. ‘அவள்மேல் ... நிறைவேற்றினான்’ என்பது வாக்குறுதியை நிறைவேற்றிய செயலின் இலக்காக மகள் இருந்ததைத் தெளிவாகக் காட்டுகிறது; எனினும் செயலின் குறிப்பிட்ட வடிவத்தைத் தீர்மானிக்காது. இறுதி வாக்கியத்தில் ‘ஒரு வழக்கமாகியது’ வַתְּהִי חֹק என்பதன் உருவான/நிலவிய சமூக வழக்கப் பொருளைத் தக்கவைக்கிறது.
