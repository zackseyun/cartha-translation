  text: וַ/יְהִ֞י מִ/קֵּ֣ץ שְׁנַ֣יִם חֳדָשִׁ֗ים וַ/תָּ֨שָׁב֙ אֶל אָבִ֔י/הָ וַ/יַּ֣עַשׂ לָ֔/הּ אֶת נִדְר֖/וֹ אֲשֶׁ֣ר נָדָ֑ר וְ/הִיא֙ לֹא יָדְעָ֣ה אִ֔ישׁ וַ/תְּהִי חֹ֖ק בְּ/יִשְׂרָאֵֽל׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/039.yaml
  text: 'And at the end of two months she returned to her father[a], and he did to her according to his vow that he had vowed. Now she had not known a man[b]. And it became a statute in Israel:'
translation:
  language: ta
  text: 'இரண்டு மாதங்களின் முடிவில் அவள் தன் தந்தையிடம் திரும்பிவந்தாள். அவனோ, தான் செய்திருந்த நேர்த்திக்கடனை அவள்மேல் நிறைவேற்றினான்.[a] அவள் எந்த ஆணுடனும் உடலுறவு கொண்டிருக்கவில்லை.[b] அது இஸ்ரவேலில் ஒரு வழக்கமாகியது:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தான் செய்திருந்த நேர்த்திக்கடனை அவள்மேல் நிறைவேற்றினான்.” யெப்தா அவளைப் பலியிட்டான் என்று இது குறிக்கிறதா, அல்லது வாழ்நாள் முழுவதும் கன்னியாக இருக்கும்படி அவளை அர்ப்பணித்தான் என்று குறிக்கிறதா என்பதில் விளக்கவுரையாளர்கள் வேறுபடுகின்றனர். இங்குள்ள எபிரெயச் சொற்றொடர் இந்தக் கேள்வியை வெளிப்படையாகத் தீர்ப்பதில்லை.
    reason: alternative_reading
  - marker: b
    text: சொல்லுக்குச் சொல், “அவள் ஒரு ஆணை அறிந்திருக்கவில்லை.” இது அவள் பாலுறவு கொண்டிருக்கவில்லை என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שְׁנַיִם חֳדָשִׁים
  choice: இரண்டு மாதங்கள் முடிந்தபின்
  rationale: குறிப்பிட்ட காலம் நிறைவடைந்ததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וַתָּשָׁב אֶל אָבִיהָ
  choice: அவள் தன் தந்தையிடம் திரும்பிவந்தாள்
  rationale: שׁוּב என்பதன் ‘திரும்புதல்’ என்ற நேரடியான பொருளையும், இலக்காகத் தந்தையே குறிப்பிடப்படுவதையும் காக்கிறது.
- source_word: וַיַּעַשׂ לָהּ אֶת נִדְרוֹ אֲשֶׁר נָדָר
  choice: அவனோ, தான் செய்திருந்த நேர்த்திக்கடன்படி அவளுக்குச் செய்தான்
  rationale: ‘அவளுக்குச் செய்தான்’ என்ற எபிரெய உரையின் கடுமையான நேரடித்தன்மையைத் தக்கவைத்து, நேர்த்திக்கடன் எவ்வாறு நிறைவேற்றப்பட்டது என்பதை மொழிபெயர்ப்பிலேயே தீர்மானிக்கவில்லை.
- source_word: וְהִיא לֹא יָדְעָה אִישׁ
  choice: அவள் எந்த ஆணுடனும் உடலுறவு கொண்டிருக்கவில்லை
  rationale: ‘ஒரு ஆணை அறியவில்லை’ என்ற எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவான, கண்ணியமான நவீன தமிழில் தருகிறது.
- source_word: חֹק
  choice: வழக்கம்
  rationale: அடுத்த வசனத்தில் விவரிக்கப்படும் ஆண்டுதோறும் கடைப்பிடிக்கப்பட்ட சமூக நடைமுறைக்கு இச்சூழலில் ‘வழக்கம்’ பொருத்தமாகிறது.
theological_decisions:
- issue: யெப்தா தனது நேர்த்திக்கடனை நிறைவேற்றிய விதம்
  choice: அவன் ‘அவளுக்குச் செய்தான்’ என்ற மூல உரையின் தெளிவற்ற நேரடித்தன்மை பாதுகாக்கப்படுகிறது.
  alternative: அவளைத் தகனபலியாகச் செலுத்தினான்; அல்லது வாழ்நாள் முழுவதும் கன்னியாக அர்ப்பணித்தான்.
  rationale: இந்த வசனம் நேர்த்திக்கடனின் விளைவை வெளிப்படையாக விளக்கவில்லை. ஆகவே நீண்டகால விளக்கவுரை வேறுபாட்டில் எந்த ஓர் முடிவையும் முதன்மை உரையில் புகுத்தாமல், இரு முக்கிய வாசிப்புகளையும் அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; இயல்பானாலும் கண்ணியமான வேதாகம நடையுடன் அமைக்கப்பட்டது. விவாதத்திற்குரிய நேர்த்திக்கடனின் தன்மை திட்டமிட்டு தீர்மானிக்கப்படாமல் விடப்பட்டுள்ளது. இறுதியில் வரும் முக்காற்புள்ளி அடுத்த வசனத்தில் வழக்கம் விளக்கப்படுவதைக் காட்டுகிறது.
