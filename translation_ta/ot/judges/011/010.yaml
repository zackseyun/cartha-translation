  text: וַ/יֹּאמְר֥וּ זִקְנֵֽי גִלְעָ֖ד אֶל יִפְתָּ֑ח יְהוָ֗ה יִהְיֶ֤ה שֹׁמֵ֨עַ֙ בֵּֽינוֹתֵ֔י/נוּ אִם לֹ֥א כִ/דְבָרְ/ךָ֖ כֵּ֥ן נַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/010.yaml
  text: Then the elders of Gilead said to Jephthah[a], “Yahweh will be witness between us if we do not do according to your word.”
translation:
  language: ta
  text: அப்போது கீலேயாத்தின் மூப்பர்கள் யெப்தாவிடம், “நீ சொன்னபடி நாங்கள் செய்யாவிட்டால், யாவே நமக்கிடையே சாட்சியாக இருப்பார்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “யாவே நமக்கிடையே கேட்பவராக இருப்பார்.” இங்கு ‘கேட்பவர்’ என்பது இரு தரப்பினருக்கிடையே சாட்சியாகவோ நீதிபதியாகவோ இருப்பவரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அப்போது ... என்றார்கள்
  rationale: தொடர்கதைச் சம்பவ வரிசையை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: זִקְנֵי גִלְעָד
  choice: கீலேயாத்தின் மூப்பர்கள்
  rationale: கீலேயாத் சமூகத்தின் அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கும் இணைப்புத் தொடரைத் தெளிவாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய தனிப்பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: יִהְיֶה שֹׁמֵעַ בֵּינוֹתֵינוּ
  choice: நமக்கிடையே சாட்சியாக இருப்பார்
  rationale: சொல்லளவில் ‘நமக்கிடையே கேட்டுக்கொண்டிருப்பார்’ என்றாலும், உடன்படிக்கை அல்லது ஆணைச் சூழலில் இரு தரப்புக்கும் இடையே கேட்டு சாட்சி நிற்பவர் என்ற நீதிசார் பொருளை இயல்பாகத் தெரிவிக்கிறது; சொல்லளவிலான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אִם לֹא
  choice: செய்யாவிட்டால்
  rationale: ஆணையுடன் இணைந்த எதிர்மறை நிபந்தனையைத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: כִדְבָרְךָ כֵּן נַעֲשֶׂה
  choice: நீ சொன்னபடி நாங்கள் செய்ய
  rationale: ‘உன் வார்த்தையின்படி அவ்வாறே செய்வோம்’ என்பதன் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; முதல் நபர் பன்மையை வெளிப்படையாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையில் தனிப்பெயர் நேரடியாக வருவதால், அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: שֹׁמֵעַ בֵּינוֹתֵינוּ என்பதன் நீதிசார் பொருள்
  choice: நமக்கிடையே சாட்சியாக இருப்பார்
  alternative: நமக்கிடையே கேட்டுக்கொண்டிருப்பவராக இருப்பார்
  rationale: ஆணைச் சூழலில் யாவே இரு தரப்பினரின் சொல்லையும் கேட்டு, மீறலைக் குறித்து சாட்சி அல்லது நீதிபதியாக நிற்பார் என்ற உட்கருத்தைத் தருகிறது; ‘கேட்பவர்’ என்ற மூல உருவகத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘நீ சொன்னபடி’ என்பது பேச்சுச் சூழலில் இயல்பாக இருந்தாலும், எபிரெய ‘உன் வார்த்தையின்படி’ என்ற கருத்தைத் தக்கவைக்கிறது.
