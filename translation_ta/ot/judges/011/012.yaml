  register: நவீன பொதுத் தமிழில், அரசியல் தூதரகச் சூழலுக்கேற்ற கண்ணியமான ஆனால் நேரடியான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மரபுத்தொடரின் பகைமைத் தொனி முதன்மை உரையில் தெளிவாக்கப்பட்டு, சொல்லமைப்புக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
