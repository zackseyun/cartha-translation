  yaml_path: translation/ot/judges/011/012.yaml
  text: Then Jephthah sent messengers to the king of the Ammonites[a], saying, “What is there between me and you, that you have come against me to fight in my land?”
translation:
  language: ta
  text: பின்பு யெப்தா அம்மோனியரின் அரசனுக்கு தூதர்களை அனுப்பி, “எனக்கும் உனக்கும் என்ன சம்பந்தம்? என் நாட்டில் போரிட நீ ஏன் எனக்கு எதிராக வந்திருக்கிறாய்?” என்று சொல்லி அனுப்பினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: பின்பு ... அனுப்பி
  rationale: வாவ்-தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் இயல்பான நிகழ்வுத் தொடரை ‘பின்பு’ காட்டுகிறது.
- source_word: יִפְתָּח
  choice: யெப்தா
  rationale: எபிரெய தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: מַלְאָכִים
  choice: தூதர்களை
  rationale: அரசர்களுக்கிடையிலான இந்தச் சூழலில் இது விண்ணுலகத் தூதர்களை அல்ல, செய்தி எடுத்துச் செல்லும் மனிதப் பிரதிநிதிகளைக் குறிக்கிறது.
- source_word: אֶל מֶלֶךְ בְּנֵי עַמּוֹן
  choice: அம்மோனியரின் அரசனிடம்
  rationale: ‘அம்மோனின் புத்திரர்’ என்பது இனக்குழுவைக் குறிக்கும் வழக்குச் சொற்றொடர்; ‘அம்மோனியர்’ அதன் இயல்பான தமிழ் வடிவம்.
- source_word: מַה לִּי וָלָךְ
  choice: எனக்கும் உனக்கும் என்ன பிரச்சினை
  rationale: இந்த எபிரெய மரபுத்தொடர் இரு தரப்பினருக்கிடையிலான பகைமை, தகராறு அல்லது வேண்டாத தலையீட்டை வெளிப்படுத்துகிறது; தமிழில் பொருள் தெளிவாகவும் நேரடியாகவும் வருகிறது.
- source_word: בָאתָ אֵלַי
  choice: நீ எனக்கு எதிராக வந்திருக்கிறாயே
  rationale: சொல்லளவில் ‘என்னிடம் வந்தாய்’ என்றாலும், தொடர்ந்து வரும் ‘போர் செய்ய’ என்பதால் எதிர்ப்பான நோக்கம் தெளிவாகிறது.
- source_word: לְהִלָּחֵם
  choice: போர் செய்ய
  rationale: לחם என்பதன் நிஃபால் வினைவடிவம் போரில் ஈடுபடுவதைக் குறிக்கிறது; ‘போர் செய்ய’ இயல்பான, தெளிவான தமிழ்.
- source_word: בְּאַרְצִי
  choice: என் நாட்டில்
  rationale: בְ முன்னிடைச்சொல்லின் அடிப்படைப் பொருளான ‘இல்’ என்பதைக் காத்து, ஆளுகைக்குட்பட்ட நிலப்பரப்பை இயல்பாகக் குறிக்கிறது.
