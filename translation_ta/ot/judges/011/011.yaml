base_translation:
  language: en
  yaml_path: translation/ot/judges/011/011.yaml
  text: So Jephthah went with the elders of Gilead[a], and the people made him head and commander over them[b]. And Jephthah spoke all his words before Yahweh at Mizpah.
translation:
  language: ta
  text: எனவே, யெப்தா கிலேயாத்தின் மூப்பர்களுடன் சென்றார்; மக்கள் அவரைத் தங்களுக்கு தலைவராகவும் அதிகாரியாகவும் நியமித்தனர்.[a] யெப்தா தன் சொற்கள் அனைத்தையும் மிஸ்பாவில் யாவேவின் முன்னிலையில் உரைத்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அதிகாரி” என்பதற்கான எபிரேயச் சொல் “ஆட்சியாளர்” அல்லது “படைத்தலைவர்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அவர் முன்பு கூறிய நிபந்தனைகள் அனைத்தையும் யாவேவின் முன்னிலையில் மீண்டும் கூறினார் என்றும் பொருள்கொள்ளலாம். எபிரேயம் நேரடியாக, “தன் சொற்கள் அனைத்தையும் உரைத்தார்” என்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ יִפְתָּח עִם זִקְנֵי גִלְעָד
  choice: யெப்தா கிலேயாத்தின் மூப்பர்களுடன் சென்றார்
  rationale: הלך என்பதன் தொடர்கதை வடிவையும் עִם குறிக்கும் உடன்செல்லுதலையும் இயல்பான நவீன தமிழில் தருகிறது; זִקְנֵי என்பது சமூகத் தலைவர்களைக் குறிக்கும் வழக்கமான ‘மூப்பர்கள்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: וַיָּשִׂימוּ הָעָם אוֹתוֹ עֲלֵיהֶם
  choice: மக்கள் அவரைத் தங்களுக்குத் ... நியமித்தார்கள்
  rationale: שׂים + עַל இங்கு ஒருவரை அதிகாரப் பொறுப்பில் அமர்த்துவதைக் குறிக்கிறது; ‘நியமித்தார்கள்’ என்பது அந்தப் பொருளைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: לְרֹאשׁ
  choice: தலைவராக
  rationale: רֹאשׁ என்பதன் ‘தலை/முதன்மையானவர்’ என்ற உருவகப் பொருளை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: וּלְקָצִין
  choice: படைத்தலைவராக
  rationale: קָצִין என்பது ஆட்சியாளர், அதிகாரி அல்லது படைத்தலைவர் எனப் பொருள்படலாம்; அம்மோனுக்கு எதிரான போர்ச் சூழலில் ‘படைத்தலைவர்’ பொருத்தமானது, ஆனால் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיְדַבֵּר יִפְתָּח אֶת כָּל דְּבָרָיו
  choice: யெப்தா தன் சொற்கள் அனைத்தையும் ... உரைத்தார்
  rationale: எபிரேயத்தின் நேரடியான ‘தன் சொற்கள் அனைத்தையும் பேசினார்’ என்ற விரிவான சொல்லாட்சியைப் பாதுகாக்கிறது; உடன்பாட்டு நிபந்தனைகளை மீண்டும் கூறினார் என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: לִפְנֵי குறிக்கும் முன்னிலை அல்லது சாட்சியிலான நிகழ்வை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநான்கெழுத்து தெய்வீகப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவில் தருகிறது.
- source_word: בַּמִּצְפָּה
  choice: மிஸ்பாவில்
  rationale: இடப்பெயரை ஒலிபெயர்த்து, בְּ குறிக்கும் நிகழ்விடத்தை ‘-இல்’ வேற்றுமையால் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் வரும் தனிப்பெயரைப் பாதுகாக்கிறது. அதன் பண்டைய உச்சரிப்பு முழுமையாக உறுதிசெய்யப்படாததால், நவீனத் தமிழில் பரவலாக அடையாளம் காணப்படும் ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: யெப்தா யெகோவாவின் முன்னிலையில் கூறியதன் தன்மை
  choice: தன் சொற்கள் அனைத்தையும் ... உரைத்தார்
  alternative: தன் நிபந்தனைகள் அனைத்தையும் மீண்டும் கூறினார்
  rationale: இது உடன்பாட்டை உறுதிப்படுத்திய உரை, ஜெபம் அல்லது வேறு ஓர் அதிகாரபூர்வ அறிக்கை என இருக்கக்கூடும். மூலத்தின் விரிவான சொல்லாட்சியை வைத்து அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: קָצִין என்பவரின் பங்கு
  choice: படைத்தலைவர்
  alternative: ஆட்சியாளர்
  rationale: உடனடி போர்ச் சூழல் இராணுவத் தலைமையைச் சுட்டினாலும், சொல்லின் நிர்வாக அல்லது ஆட்சிசார் பரப்பை அடிக்குறிப்பு வழியாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மூப்பர்கள்,’ ‘தலைவர்,’ ‘படைத்தலைவர்’ ஆகிய சொற்கள் சமூக மற்றும் இராணுவப் பொறுப்புகளை வேறுபடுத்துகின்றன. மூலத்தில் உள்ள இரு முக்கியத் தெளிவின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
