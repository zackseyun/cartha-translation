  source_fidelity: 'ஒரு முக்கியமான இடச்சுட்டுப் பொருள் திருத்தப்பட வேண்டும்: எபிரெயம் אֶל־יְהוָה என்பது ‘யாவேக்கு/யாவேவிடம்’ என்பதே; ‘யாவேக்கு முன்பாக’ என்பது மூலத்தில் இல்லாத ‘முன்பாக’ என்ற இடப்பொருளைச் சேர்க்கிறது. மற்ற முக்கிய கூறுகள்—ஆடைகளைக் கிழித்தல், துயர இடைச்சொல், வலியுறுத்தப்பட்ட தாழ்த்துதல், தொல்லை விளைவித்தல், மற்றும் திரும்ப முடியாமை—மூலத்துடன் பொருந்துகின்றன.'
