source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/רְאוֹת֨/וֹ אוֹתָ֜/הּ וַ/יִּקְרַ֣ע אֶת בְּגָדָ֗י/ו וַ/יֹּ֨אמֶר֙ אֲהָ֤הּ בִּתִּ/י֙ הַכְרֵ֣עַ הִכְרַעְתִּ֔/נִי וְ/אַ֖תְּ הָיִ֣יתְ בְּ/עֹֽכְרָ֑/י וְ/אָנֹכִ֗י פָּצִ֤יתִי פִ/י֙ אֶל יְהוָ֔ה וְ/לֹ֥א אוּכַ֖ל לָ/שֽׁוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/035.yaml
  text: And when he saw her[a], he tore his clothes and said, “Alas, my daughter! You have brought me very low, and you have become the cause of my trouble. For I have opened my mouth to Yahweh, and I cannot turn back.”
translation:
  language: ta
  text: அவன் அவளைப் பார்த்ததும் தன் ஆடைகளைக் கிழித்து, “ஐயோ, என் மகளே! நீ என்னை மிகவும் தாழ்த்திவிட்டாய்; நீ எனக்குத் துன்பம் விளைவிப்பவளாகிவிட்டாய். நான் யாவேவிடம் என் வாயைத் திறந்தேன்[a]; இனி என்னால் பின்வாங்க முடியாது” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் வெளிப்படையாக, “நான் யாவேக்கு ஒரு நேர்ச்சை செய்தேன்.” எபிரெயத்தில் சொல்லுக்குச் சொல், “நான் யாவேவிடம் என் வாயைத் திறந்தேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹתוֹ אוֹתָהּ
  choice: அவன் அவளைப் பார்த்ததும்
  rationale: எபிரெயக் கதைநடைத் தொடக்கச் சூத்திரத்தைத் தமிழில் இயல்பான காலவினைத் தொடராக வழங்குகிறது.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: தன் ஆடைகளைக் கிழித்துக்கொண்டு
  rationale: துயரம் அல்லது கடும் மனக்கலக்கத்தை வெளிப்படுத்தும் வழக்கமான செயலை இயல்பான நவீனத் தமிழில் நேரடியாகக் கூறுகிறது.
- source_word: אֲהָהּ בִּתִּי
  choice: ஐயோ, என் மகளே!
  rationale: துயரமும் அதிர்ச்சியும் நிறைந்த இடைச்சொல்லையும் நேரடி விளியையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: הַכְרֵעַ הִכְרַעְתִּנִי
  choice: நீ என்னை மிகவும் தாழ்த்திவிட்டாய்
  rationale: முற்றுவினையுடன் வரும் வினையெச்சப் பெயரின் வலியுறுத்தலை ‘மிகவும்’ என்பதால் காட்டி, கடுமையாகத் தாழ்த்துதல் என்ற கருத்தைப் பாதுகாக்கிறது.
- source_word: וְאַתְּ הָיִיתְ בְּעֹכְרָי
  choice: நீ எனக்குத் துன்பம் உண்டாக்குகிறவளாகிவிட்டாய்
  rationale: עכר என்பதன் துன்பம் அல்லது பேரிடர் வரச் செய்தல் என்ற பொருளை, தேவையற்ற கூடுதல் குற்றச்சாட்டைச் சேர்க்காமல் இயல்பான தமிழில் வழங்குகிறது.
- source_word: וְאָנֹכִי פָצִיתִי פִי אֶל־יְהוָה
  choice: நான் யாவேக்கு முன்பாக என் வாயைத் திறந்துவிட்டேன்
  rationale: சூளுரை செய்ததைக் குறிக்கும் எபிரெய மொழிப்படிமத்தை முதன்மை உரையில் பாதுகாக்கிறது; அதன் வெளிப்படையான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְלֹא אוּכַל לָשׁוּב
  choice: இனி என்னால் பின்வாங்க முடியாது
  rationale: தான் கூறிய சூளுரையிலிருந்து திரும்ப முடியாது என்ற சூழ்நிலைப் பொருளையும், שוב என்பதன் ‘திரும்புதல்’ படிமத்தையும் காக்கிறது.
theological_decisions:
- issue: யெப்தாவின் சொல் ஒரு நேர்ச்சை என்பதை முதன்மை உரையிலேயே வெளிப்படையாகக் கூறுவதா
  choice: ‘என் வாயைத் திறந்துவிட்டேன்’ என்ற எபிரெய மொழிப்படிமத்தை முதன்மை உரையில் வைத்தல்
  alternative: ‘யாவேக்கு ஒரு நேர்ச்சை செய்துவிட்டேன்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: சூழல் நேர்ச்சையைக் குறித்தாலும், மூல உரையின் உருவகமும் அதன் solemn force-உம் பாதுகாக்கப்படுகின்றன; தெளிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: மகளை நோக்கிய யெப்தாவின் வேதனையை எவ்வளவு தீவிரமாக மொழிபெயர்ப்பது
  choice: ‘மிகவும் தாழ்த்திவிட்டாய்’ என்றும் ‘துன்பம் உண்டாக்குகிறவளாகிவிட்டாய்’ என்றும் வழங்குதல்
  alternative: ‘என்னை அழித்துவிட்டாய்’ அல்லது ‘என் அழிவுக்குக் காரணமாகிவிட்டாய்’
  rationale: மூலத்தின் கடும் மனவேதனையைத் தக்கவைத்தபடியே, உரையில் அவசியமில்லாத அளவுக்கு அழிவு அல்லது ஒழுக்கக் குற்றச்சாட்டை வலுப்படுத்தாமல் இருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், அதே நேரத்தில் துயரமிக்க கதைநடைக்கு ஏற்ற கண்ணியமான நடை. எபிரெய மூலத்தின் தீவிரத்தையும் மொழிப்படிமத்தையும் இயன்றவரை காக்கும் உகந்த-ஒப்புமை அணுகுமுறை பயன்படுத்தப்பட்டுள்ளது.
