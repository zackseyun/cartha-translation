  text: וְ/אָֽנֹכִי֙ לֹֽא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֞ה עֹשֶׂ֥ה אִתִּ֛/י רָעָ֖ה לְ/הִלָּ֣חֶם בִּ֑/י יִשְׁפֹּ֨ט יְהוָ֤ה הַ/שֹּׁפֵט֙ הַ/יּ֔וֹם בֵּ֚ין בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/בֵ֖ין בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/027.yaml
  text: I have not sinned against you[a], but you are doing me wrong by making war against me. May Yahweh, the Judge, judge today between the sons of Israel and the sons of Ammon.
translation:
  language: ta
  text: நான் உனக்கு எதிராகப் பாவம் செய்யவில்லை. ஆனால் நீயோ என்மீது போர் தொடுப்பதன் மூலம் எனக்குத் தீங்கு செய்கிறாய். நியாயந்தீர்ப்பவரான யாவே இன்று இஸ்ரவேல் மக்களுக்கும் அம்மோன் மக்களுக்கும்[a] இடையே நியாயந்தீர்ப்பாராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, “இஸ்ரவேலின் மகன்களுக்கும் அம்மோனின் மகன்களுக்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי לָךְ
  choice: உனக்கு எதிராகப் பாவம் செய்யவில்லை
  rationale: חטא என்பதன் அடிப்படை அறநெறி மற்றும் நீதித்துறை வலிமையைப் பாதுகாக்க ‘பாவம் செய்யவில்லை’ என மொழிபெயர்க்கப்பட்டது; לָךְ இச்சூழலில் ‘உனக்கு எதிராக’ என்ற பொருள் தருகிறது.
- source_word: עֹשֶׂה אִתִּי רָעָה
  choice: எனக்குத் தீங்கு செய்கிறாய்
  rationale: சொற்றொடரின் ‘எனக்குத் தீமை செய்கிறாய்’ என்ற பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; சட்டரீதியான குற்றச்சாட்டின் தொனியும் நீடிக்கிறது.
- source_word: לְהִלָּחֶם בִּי
  choice: என்மீது போர் தொடுப்பதன் மூலம்
  rationale: இது தனிப்பட்ட சண்டையல்ல, இரு மக்களுக்கிடையிலான போர் என்பதையும், அந்தப் போரே செய்யப்பட்ட தீங்கின் விதம் என்பதையும் தெளிவாகக் காட்டுகிறது.
- source_word: יִשְׁפֹּט ... הַשֹּׁפֵט
  choice: நியாயந்தீர்ப்பவரான ... நியாயந்தீர்ப்பாராக
  rationale: שפט என்ற ஒரே எபிரெய வேர் இருமுறை வருவதால் உருவாகும் சொல்லாட்சி மீளுருவாக்கத்தைத் தமிழிலும் பாதுகாக்கிறது; வேண்டுதல் அல்லது முறையீட்டு வலிமையை ‘-ஆராக’ வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, எபிரெய மூலத்தில் நேரடியாக வரும் இறைப் பெயர்; ஆகவே தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: בֵּין בְּנֵי יִשְׂרָאֵל וּבֵין בְּנֵי עַמּוֹן
  choice: இஸ்ரவேல் மக்களுக்கும் அம்மோன் மக்களுக்கும் இடையே
  rationale: בני என்பதன் கூட்டினப் பொருளை நவீன தமிழில் இயல்பாக ‘மக்கள்’ எனத் தருகிறது; அதன் சொற்பொருளான ‘மகன்கள்’ அடிக்குறிப்பில் சுட்டப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: יִשְׁפֹּט என்பதன் வாக்கிய வலிமை
  choice: நியாயந்தீர்ப்பாராக
  alternative: நியாயந்தீர்ப்பார்
  rationale: சூழல் யாவேயிடம் செய்யப்படும் நீதித்துறை முறையீட்டைச் சுட்டுகிறது. எபிரெய வடிவம் எதிர்காலக் கூற்றாகவும் புரிந்துகொள்ளப்படக்கூடியிருந்தாலும், இங்கு வேண்டுதல் வலிமை பொருத்தமானது; அதனைத் தீர்மானவாதமான கூற்றாக மாற்றவில்லை.
- issue: בְּנֵי என்ற ஆண்பால் கூட்டினச் சொல்லின் வெளிப்பாடு
  choice: மக்கள்
  alternative: மகன்கள்
  rationale: இங்கு בני தனிப்பட்ட ஆண் பிள்ளைகளை மட்டும் அல்ல, இஸ்ரவேல் மற்றும் அம்மோன் இனக்குழுக்களைச் சுட்டுகிறது. ‘மக்கள்’ என்பது தமிழில் இயல்பான கூட்டினப் பெயர்; சொற்படியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், தூதரக மற்றும் நீதித்துறைச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நியாயந்தீர்ப்பவர் ... நியாயந்தீர்ப்பாராக’ என்ற மீளுருவாக்கம் மூலத்தின் சொல்லாட்சியைப் பாதுகாக்கிறது; அளவுக்கு மீறிய பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
