  to: ஆனால், இஸ்ரவேல் தன் நாட்டின் வழியாகக் கடந்துசெல்ல சீகோன் நம்பவில்லை[a]. எனவே சீகோன் தன் மக்கள் அனைவரையும்[b] ஒன்றுதிரட்டினான். அவர்கள் யாகாஸில் முகாமிட்டார்கள்; அவன் இஸ்ரவேலுடன் போரிட்டான்[c].
