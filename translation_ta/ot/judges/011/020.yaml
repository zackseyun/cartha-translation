  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘மக்கள் அனைவரையும்’ என்ற மூலத்தின் பரந்த சொல்லாட்சி காக்கப்பட்டது; இராணுவப் பொருள் உரைக்குள் வலுக்கட்டாயமாகச் சேர்க்கப்படவில்லை.
