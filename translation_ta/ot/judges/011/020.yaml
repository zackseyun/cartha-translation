  text: But Sihon did not trust Israel to pass through his territory[a]. So Sihon gathered all his people, and they camped at Jahaz[c][b], and he fought against Israel.
translation:
  language: ta
  text: ஆனால், இஸ்ரவேல் தன் நாட்டின் வழியாகக் கடந்துசெல்ல சீகோன் நம்பவில்லை[a]. எனவே சீகோன் தன் மக்கள் அனைவரையும்[b] ஒன்றுதிரட்டினான். அவர்கள் யாகாஸில் முகாமிட்டார்கள்; அவன் இஸ்ரவேலுடன் போரிட்டான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இஸ்ரவேலை நம்பவில்லை’ என்றும் மொழிபெயர்க்கலாம். இச்சூழலில், அவர்கள் கடந்துசெல்ல அனுமதிக்கும் அளவுக்கு அவர்களை நம்பவில்லை என்பது பொருள்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘தன் மக்கள் அனைவரையும்’ என்றே உள்ளது; சூழல் போரைப் பற்றியதாக இருந்தாலும், ‘தன் படை முழுவதையும்’ என்று வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் சொல்லுக்குச் சொல் ‘இஸ்ரவேலுடன் போரிட்டான்’; சூழலில் இதற்கு ‘இஸ்ரவேலை எதிர்த்துப் போரிட்டான்’ என்பது பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמִין
  choice: நம்பவில்லை
  rationale: אמן என்பதன் ஹிஃபில் வடிவம் இங்கு ஒருவர்மீது நம்பிக்கை வைப்பதைக் குறிக்கிறது. சீகோன் அனுமதி அளிக்கவில்லை என்ற விளைவை மட்டும் கூறாமல், எபிரெய வினையின் அடிப்படைப் பொருளைத் தக்கவைக்கிறது.
- source_word: עֲבֹר בִּגְבֻלוֹ
  choice: தன் நாட்டின் வழியாகக் கடந்துசெல்ல
  rationale: עבר என்பது கடந்துசெல்வதையும், גבול இச்சூழலில் வெறும் எல்லைக்கோட்டைவிட ஆட்சிக்குட்பட்ட நிலப்பரப்பையும் குறிக்கிறது. இத்தொடர் தமிழில் இயல்பாகப் பயண அனுமதியின் சூழலை வெளிப்படுத்துகிறது.
- source_word: וַיֶּאֱסֹף
  choice: ஒன்றுதிரட்டினான்
  rationale: இங்கு வினை போருக்காக மக்களைத் திரட்டுவதைக் குறிக்கிறது; படை என்று வெளிப்படையாக இல்லாத தகவலைச் சேர்க்காமல் இராணுவச் சூழலுக்கு ஏற்ற இயல்பான தமிழை வழங்குகிறது.
- source_word: כָּל עַמּוֹ
  choice: தன் மக்கள் அனைவரையும்
  rationale: எபிரெய உரை ‘அவனுடைய மக்கள் அனைவரையும்’ என்றே கூறுகிறது; சூழல் இராணுவமானதாயினும் ‘படை முழுவதையும்’ என்று குறுக்கவில்லை.
- source_word: וַיַּחֲנוּ
  choice: அவர்கள் முகாமிட்டார்கள்
  rationale: பன்மை வினை திரட்டப்பட்ட மக்களைக் கர்த்தாவாகக் கொண்டுள்ளது. நவீனத் தமிழில் தெளிவான வடிவம்.
- source_word: בְּיָהְצָה
  choice: யாகாசில்
  rationale: இடப்பெயர் Jahaz என்பதற்கான தமிழ் ஒலிபெயர்ப்பு; בְ முன்னொட்டு முகாமிட்ட இடத்தைக் குறிக்க ‘-இல்’ என வழங்கப்பட்டது.
- source_word: וַיִּלָּחֶם עִם
  choice: இஸ்ரவேலுடன் போரிட்டான்
  rationale: வினை ஒருமை என்பதால் கர்த்தா மீண்டும் சீகோன். עִם என்பதன் நேரடிப் பொருளான ‘உடன்’ தக்கவைக்கப்பட்டாலும், போரிடுதல் இயல்பாக எதிர்ப்பொருளைக் கொண்டுள்ளது.
