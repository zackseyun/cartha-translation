  text: Then Jephthah again sent messengers to the king of the Ammonites[a].
translation:
  language: ta
  text: பின்பு எப்தா மீண்டும் அம்மோனியரின் அரசனிடம்[a] தூதுவர்களை அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அம்மோனின் மகன்களுடைய அரசன்”; இது அம்மோன் மக்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף עוֹד
  choice: பின்பு ... மீண்டும்
  rationale: יָסַף עוֹד என்ற எபிரெயச் சொற்றொடர் ஒரு செயல் மறுபடியும் செய்யப்படுவதைக் குறிக்கிறது. ‘மீண்டும்’ அதன் மையப் பொருளை இயல்பாகத் தருகிறது; தொடக்கத்திலுள்ள வாவ் தொடர்கதை ஓட்டத்தை ‘பின்பு’ காட்டுகிறது.
- source_word: יִפְתָּח
  choice: எப்தா
  rationale: தனிப்பெயர் தமிழில் பரவலாக அறியப்பட்ட வேதாகமப் பெயர் வடிவத்தின்படி ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினார்
  rationale: இந்தத் தூதரகச் சூழலில் שׁלח என்பதற்கான தெளிவான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: מַלְאָכִים
  choice: தூதுவர்களை
  rationale: இங்கு மனிதர்களாகிய செய்தியாளர்கள் அல்லது அரசியல் தூதர்கள் குறிக்கப்படுகிறார்கள்; தேவதூதர்கள் அல்ல. ‘தூதுவர்கள்’ பொதுவாகவும் தெளிவாகவும் பொருந்துகிறது.
- source_word: אֶל
  choice: அரசனிடம்
  rationale: இலக்கைச் சுட்டும் אֶל, தமிழ் வாக்கிய அமைப்பில் ‘-ிடம்’ என்ற வேற்றுமை வடிவால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: அம்மோனியரின் அரசன்
  rationale: ‘அம்மோனின் மகன்கள்’ என்பது அம்மோன் மக்களைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘அம்மோனியர்’ அதன் மக்கள் இனக் குறிப்பை இயல்பான தமிழில் தருகிறது.
