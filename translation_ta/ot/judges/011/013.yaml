base_translation:
  language: en
  yaml_path: translation/ot/judges/011/013.yaml
  text: And the king of the Ammonites said to Jephthah’s messengers, “Because Israel took my land when it came up from Egypt, from the Arnon as far as the Jabbok and as far as the Jordan, now restore them peacefully.”
translation:
  language: ta
  text: அம்மோனியரின் அரசன் யெப்தாவின் தூதுவர்களிடம், “இஸ்ரவேலர் எகிப்திலிருந்து புறப்பட்டு வந்தபோது, அர்னோன் முதல் யாப்போக்கு வரையிலும் யோர்தான் வரையிலும் இருந்த என் நாட்டைக் கைப்பற்றிக்கொண்டார்கள். ஆகவே, இப்போது அந்தப் பகுதிகளை[a] சமாதானமாகத் திருப்பிக் கொடுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில் இங்கு “அவற்றை” என்று பன்மையில் உள்ளது; முன்பு கூறப்பட்ட நாட்டின் பல பகுதிகளை இது குறிக்கலாம்.
    reason: ஒருமையான ‘என் நாடு’ என்பதிலிருந்து பன்மையான சுட்டுப்பெயருக்கு மாறும் மூல உரையின் தன்மையை வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: כִּי
  choice: ஆகவே என்பதற்கு முன் காரணத்தை நேரடியாகக் கூறும் வாக்கிய அமைப்பு
  rationale: இச்சொல் அரசன் முன்வைக்கும் காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பாகப் புரியும்படி காரணக் கூற்றை முதலில் வைத்து, அதன் விளைவாக வரும் கோரிக்கையை ‘ஆகவே’ என்று இணைத்துள்ளது.
- source_word: לָקַח
  choice: கைப்பற்றிக்கொண்டார்கள்
  rationale: இங்கு வெறுமனே ‘எடுத்தார்கள்’ என்பதைக் காட்டிலும், நிலப்பகுதியைத் தமதாக்கிக் கொண்டதாக அம்மோனிய அரசன் முன்வைக்கும் குற்றச்சாட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בַעֲלוֹתוֹ מִמִּצְרַיִם
  choice: எகிப்திலிருந்து புறப்பட்டு வந்தபோது
  rationale: சொற்பொருளில் ‘எகிப்திலிருந்து மேலே வந்தபோது’; தமிழில் பயணத்தைக் குறிக்கும் இயல்பான நடை தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: הָשִׁיבָה
  choice: திருப்பிக் கொடுங்கள்
  rationale: முன்பு கைப்பற்றப்பட்டதாகக் கூறப்படும் நிலத்தை அதன் உரிமையாளரிடம் மீண்டும் ஒப்படைக்குமாறு விடுக்கும் கோரிக்கையை இயல்பாகக் காட்டுகிறது.
- source_word: בְּשָׁלוֹם
  choice: சமாதானமாக
  rationale: போரின்றி அமைதியான முறையில் திருப்பிக் கொடுக்க வேண்டும் என்ற கோரிக்கையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: அம்மோனிய அரசனின் நில உரிமைக் கூற்று
  choice: அவன் கூறிய குற்றச்சாட்டாகவே மொழிபெயர்க்கப்பட்டது
  alternative: அந்த நிலம் உண்மையிலேயே அம்மோனுக்குரியது என மொழிபெயர்ப்பில் உறுதிப்படுத்துதல்
  rationale: வசனம் அரசனின் கூற்றை மட்டுமே பதிவு செய்கிறது; அதன் வரலாற்று அல்லது நெறிசார் உண்மையை உரையாளர் இங்கு தீர்மானிப்பதில்லை.
- issue: ஒருமை ‘என் நாடு’ என்பதற்குப் பின் வரும் பன்மைச் சுட்டுப்பெயர்
  choice: ‘அந்தப் பகுதிகளை’ என்று பொருளை வெளிப்படுத்துதல்
  alternative: ‘அதை’ என்று ஒருமையில் ஒற்றுமைப்படுத்துதல்
  rationale: எபிரேய உரையில் אַרְצִי (‘என் நாடு/நிலம்’) ஒருமையாக இருந்தாலும், பின்னர் אֶתְהֶן (‘அவற்றை’) என்ற பெண்பால் பன்மை வருகிறது. இந்த இலக்கண மாறுபாட்டை நிலத்தின் பல பகுதிகளைக் குறிக்கும் வகையில் பாதுகாத்துள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வரலாற்றுக் கதையாடலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்புகளாக வழங்கப்பட்டுள்ளன; அரசனின் காரணக் கூற்றும் அமைதியான ஒப்படைப்பு கோரிக்கையும் தெளிவாகப் பிரிக்கப்பட்டுள்ளன.
