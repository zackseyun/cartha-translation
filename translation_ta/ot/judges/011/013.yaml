  source_fidelity: மூல எபிரேயத்தின் காரணக் கூற்று (כִּי), இஸ்ரவேலர் எகிப்திலிருந்து வந்தபோது நிலத்தை எடுத்துக்கொண்டதாக அம்மோன் அரசன் கூறுவது, அர்னோன்–யாப்போக்கு–யோர்தான் எல்லைக் குறிப்புகள், மற்றும் ‘அவற்றை அமைதியாகத் திருப்பிக்கொடு’ என்ற கோரிக்கை அனைத்தும் பொருளுடன் வழங்கப்பட்டுள்ளன. ‘என் நாடு’ என்பதற்குப் பின் வரும் பெண்பால் பன்மைச் சுட்டுப்பெயரின் மாறுபாடும் அடிக்குறிப்பில் நேர்மையாகக் குறிக்கப்பட்டுள்ளது.
