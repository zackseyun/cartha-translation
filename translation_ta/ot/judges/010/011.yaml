  text: וַ֥/יֹּאמֶר יְהוָ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ וּ/מִן הָ֣/אֱמֹרִ֔י וּ/מִן בְּנֵ֥י עַמּ֖וֹן וּ/מִן פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/011.yaml
  text: And Yahweh said to the sons of Israel[a], “Was it not from Egypt, and from the Amorites, and from the Ammonites, and from the Philistines[b], that I delivered you?"
translation:
  language: ta
  text: யாவே இஸ்ரவேல் மக்களிடம்[a], “எகிப்திலிருந்தும், எமோரியரிடமிருந்தும், அம்மோனியரிடமிருந்தும், பெலிஸ்தியரிடமிருந்தும் நான் உங்களை விடுவிக்கவில்லையா?[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயில் சொல்லுக்கு சொல்: ‘இஸ்ரவேலின் மகன்களிடம்.’ இங்கு அது இஸ்ரவேல் மக்களைக் குறிக்கும் மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: b
    text: இந்த வசனத்தின் எபிரெய வாசகம் வினைச்சொல்லை வெளிப்படையாகக் கூறாமல் விடுகிறது. சூழலின் அடிப்படையில் ‘நான் உங்களை விடுவிக்கவில்லையா?’ என்பது தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது.
    reason: source_ellipsis
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: אמר என்பதன் தொடர்கதை வடிவம் நேரடி உரையை அறிமுகப்படுத்துகிறது; தமிழில் மேற்கோளின் முடிவில் ‘என்றார்’ என்பது இயல்பான கதைநடை அமைப்பு.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது எபிரெய தனிப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பு; ‘ஆண்டவர்’ போன்ற பட்டப்பெயரால் அதை மாற்றவில்லை.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது இஸ்ரவேல் சமூகத்தைக் குறிக்கும் வழக்குச் சொற்றொடர்; ‘இஸ்ரவேல் மக்கள்’ நவீன தமிழில் இயல்பாகவும் உள்ளடக்கத்தைத் துல்லியமாகவும் தருகிறது.
- source_word: הֲלֹא
  choice: நானல்லவா?
  rationale: மறுப்புடன் கூடிய வினாத்துகள் எதிர்பார்க்கப்படும் உறுதிப்பதில் கொண்ட சொல்லாட்சி வினாவைக் குறிக்கின்றன; தமிழில் ‘நானல்லவா?’ அதே வலியுறுத்தலைத் தருகிறது.
- source_word: מִמִּצְרַיִם
  choice: எகிப்திலிருந்து
  rationale: מן பிறப்பிடம் அல்லது பிரிவிடத்தைக் குறிக்கிறது; இங்கு நாடான எகிப்திலிருந்து விடுதலை பெற்றதைக் குறிப்பிடுகிறது.
- source_word: הָאֱמֹרִי
  choice: எமோரியர்
  rationale: எபிரெயில் ஒருமை வடிவிலுள்ள இனக்குழுப் பெயர் கூட்டாகப் பயன்படுத்தப்பட்டுள்ளது; தமிழில் மக்களினப் பெயரின் மரியாதைப் பன்மை இயல்பானது.
- source_word: בְּנֵי עַמּוֹן
  choice: அம்மோனியர்
  rationale: சொல்லுக்கு சொல் ‘அம்மோனின் மகன்கள்’; இங்கு நிலையான இனக்குழுப் பெயராக ‘அம்மோனியர்’ தெளிவானது.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்
  rationale: இனக்குழுவைக் குறிக்கும் எபிரெயப் பன்மைக்கு வழக்கமான தமிழ்ப் பெயர்.
- source_word: '[சூழலிலிருந்து உணரப்படும் வினைச்சொல்]'
  choice: உங்களை விடுவித்தது
  rationale: எபிரெய வசனம் இவ்விடத்தில் வினைச்சொல்லை வெளிப்படையாகக் கூறாமல் அடுத்துவரும் உரையையும் பரந்த சூழலையும் சார்ந்துள்ளது; முழுமையான தமிழ்ச் சொற்றொடருக்காக ‘விடுவித்தது’ சேர்க்கப்பட்டுள்ளது. இது நியாயாதிபதிகள் நூலில் பகைவர்களின் ஒடுக்குமுறையிலிருந்து மீட்பதைக் குறிக்கும் கருத்தைத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, தனிப்பெயர் உள்ளது. ஆகவே அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற எபிரெய மரபுத்தொடரைத் தமிழாக்குதல்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இங்கு சொற்றொடர் ஒட்டுமொத்த இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது. சொல்லுக்கு சொல் வடிவம் தமிழில் ஆண்களை மட்டும் குறிக்கும் தவறான எண்ணத்தை உருவாக்கக்கூடும்; அடிக்குறிப்பு மூல வடிவத்தைப் பதிவு செய்கிறது.
- issue: முழுமையின்றி விடப்பட்ட சொல்லாட்சி வினாவில் வினைச்சொல்லை நிரப்புதல்
  choice: உங்களை விடுவித்தது நானல்லவா?
  alternative: மூலத்தின் பட்டியலை வினைச்சொல் இன்றியே விடுதல்
  rationale: எபிரெயின் இடைவிடப்பட்ட அமைப்பைச் சூழல் நிறைவு செய்கிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘விடுவித்தது’ சேர்க்கப்பட்டது; இது ஆன்மீக இரட்சிப்பு என்ற கூடுதல் கருத்தைத் திணிக்காமல் வரலாற்றுச் சூழலிலான மீட்பைக் குறிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாக வாசிக்கக்கூடிய, அதே நேரத்தில் வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இனக்குழுப் பெயர்களுக்கு தமிழின் மரியாதைப் பன்மை வடிவம் பயன்படுத்தப்பட்டது; மூலத்தின் சொல்லாட்சி வினாவின் வலியுறுத்தல் காக்கப்பட்டுள்ளது.
