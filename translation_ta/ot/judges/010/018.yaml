  text: וַ/יֹּאמְר֨וּ הָ/עָ֜ם שָׂרֵ֤י גִלְעָד֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ מִ֣י הָ/אִ֔ישׁ אֲשֶׁ֣ר יָחֵ֔ל לְ/הִלָּחֵ֖ם בִּ/בְנֵ֣י עַמּ֑וֹן יִֽהְיֶ֣ה לְ/רֹ֔אשׁ לְ/כֹ֖ל יֹשְׁבֵ֥י גִלְעָֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/018.yaml
  text: And the people[a], the leaders of Gilead, said to one another, “Who is the man who will begin to fight against the sons of Ammon? He shall become head over all the inhabitants of Gilead.”
translation:
  language: ta
  text: கிலேயாத்தின் தலைவர்களாகிய மக்கள் ஒருவரோடு ஒருவர், “அம்மோனியருக்கு எதிராகப் போரிடத் தொடங்கும் மனிதன் யார்? அவன் கிலேயாத்தில் குடியிருக்கும் அனைவருக்கும் தலைவனாவான்” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם שָׂרֵי גִלְעָד
  choice: கிலேயாத்தின் தலைவர்களாகிய மக்கள்
  rationale: எபிரெயச் சொற்றொடரில் இணைப்புச்சொல் இன்றி அடுத்தடுத்து வரும் ‘மக்கள்’ மற்றும் ‘கிலேயாத்தின் தலைவர்கள்’ ஆகிய இரண்டையும், பின்னது முன்னதை விளக்கும் இணைப்பாக இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: ஒருவரோடு ஒருவர்
  rationale: சொல்லுக்கு சொல் ‘ஒரு மனிதன் தன் தோழனிடம்’ என்றாலும், இங்கு பரஸ்பர உரையாடலைக் குறிக்கும் இயல்பான தமிழ் வடிவம் இது.
- source_word: מִי הָאִישׁ
  choice: மனிதன் யார்?
  rationale: குறிப்பிட்ட ஆண் போர்த் தலைவரைத் தேடும் சூழலில், மூலத்தின் வெளிப்படையான אִישׁ என்பதைக் பாலின நடுநிலையாக்காமல் தக்கவைக்கிறது.
- source_word: יָחֵל לְהִלָּחֵם
  choice: போரிடத் தொடங்கும்
  rationale: யָחֵל என்பதன் ஹிஃபில் வடிவிலுள்ள ‘தொடங்கு’ என்ற பொருளையும், לְהִלָּחֵם என்பதன் இராணுவப் பொருளையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: בִּבְנֵי עַמּוֹן
  choice: அம்மோனியருக்கு எதிராக
  rationale: சொல்லுக்கு சொல் ‘அம்மோனின் மகன்களுக்கு எதிராக’; தமிழில் அந்த இனக்குழுவைக் குறிக்கும் இயல்பான பெயர் ‘அம்மோனியர்’.
- source_word: יִהְיֶה לְרֹאשׁ
  choice: தலைவனாவான்
  rationale: ‘தலையாக இருப்பான்/ஆவான்’ என்ற மூல உருவகத்தின் அரசியல் தலைமைப் பொருளையும், போரில் முன்னெடுப்பதன் விளைவாகத் தலைமை அடைவதையும் சுருக்கமாகத் தருகிறது.
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: கிலேயாத்தில் குடியிருக்கும் அனைவருக்கும்
  rationale: இடத்தில் வாழ்பவர்களைக் குறிக்கும் பங்கேற்புச் சொல்லையும், தலைமையின் முழுமையான பரப்பையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: தலைமைத் தேர்வின் சூழலில் வெளிப்படையான ஆண்பால் சொல்லை மொழிபெயர்த்தல்
  choice: ‘மனிதன்’ என்பதை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘ஒருவர்’ அல்லது ‘ஆள்’
  rationale: மூலத்தில் אִישׁ வெளிப்படையாக உள்ளது; பண்டைய இராணுவத் தலைவரைத் தேர்ந்தெடுக்கும் சூழலும் அதற்கு ஏற்றது. ஆகவே அதை நடுநிலையாக்காமல் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெயச் சொற்றொடரின் சற்றே நெருக்கமான இணைப்பை இயல்பாக்கி, இரு கூறுகளையும் கைவிடாமல் வைத்துள்ளது.
