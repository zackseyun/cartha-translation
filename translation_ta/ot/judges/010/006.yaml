source:
  edition: WLC
  text: וַ/יֹּסִ֣פוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לַ/עֲשׂ֣וֹת הָ/רַע֮ בְּ/עֵינֵ֣י יְהוָה֒ וַ/יַּעַבְד֣וּ אֶת הַ/בְּעָלִ֣ים וְ/אֶת הָ/עַשְׁתָּר֡וֹת וְ/אֶת אֱלֹהֵ֣י אֲרָם֩ וְ/אֶת אֱלֹהֵ֨י צִיד֜וֹן וְ/אֵ֣ת אֱלֹהֵ֣י מוֹאָ֗ב וְ/אֵת֙ אֱלֹהֵ֣י בְנֵי עַמּ֔וֹן וְ/אֵ֖ת אֱלֹהֵ֣י פְלִשְׁתִּ֑ים וַ/יַּעַזְב֥וּ אֶת יְהוָ֖ה וְ/לֹ֥א עֲבָדֽוּ/הוּ׀־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/006.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and they served the Baals and the Ashtoreths, and the gods of Aram, the gods of Sidon, the gods of Moab, the gods of the sons of Ammon, and the gods of the Philistines[b]. They forsook Yahweh and did not serve him.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் மீண்டும் யாவேயின் பார்வையில் தீமையானதைச் செய்தார்கள்.[a] அவர்கள் பாகால்களையும் அஸ்தரோத்துகளையும், ஆராமின் தெய்வங்களையும், சீதோனின் தெய்வங்களையும், மோவாபின் தெய்வங்களையும், அம்மோன் மக்களின் தெய்வங்களையும்[b], பெலிஸ்தியரின் தெய்வங்களையும் சேவித்தார்கள். அவர்கள் யாவேயைக் கைவிட்டு, அவரைச் சேவிக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் பார்வையில் தீமையானதைத் தொடர்ந்து செய்தார்கள்.” எபிரேய வினைச்சொல் ஒரு செயல் மீண்டும் நிகழ்வதையோ தொடர்ந்து நடைபெறுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, “அம்மோனின் மகன்களுடைய தெய்வங்கள்”; அதாவது, அம்மோனியர் வழிபட்ட தெய்வங்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: மீண்டும் ... செய்தார்கள்
  rationale: יסף + infinitive என்பது செயல் மீண்டும் நிகழ்வதையோ தொடர்வதையோ குறிக்கலாம். நியாயாதிபதிகள் நூலின் சுழற்சி அமைப்பில் ‘மீண்டும்’ இயல்பாக உள்ளது; ‘தொடர்ந்து’ என்பதும் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரேய மரபுத்தொடரின் சமூகப் பொருளை நவீன தமிழில் இயல்பாகவும் அனைவரையும் உள்ளடக்கும் வகையிலும் தெரிவிக்கிறது.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில் தீமையானதைச் செய்தார்கள்
  rationale: ‘கண்களில்’ என்ற எபிரேய உருவகத்தின் மதிப்பீட்டுப் பொருளை இயல்பான தமிழ் ‘பார்வையில்’ என்பதன் மூலம் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்ற தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיַּעַבְדוּ / עֲבָדוּהוּ
  choice: சேவித்தார்கள் / அவரைச் சேவிக்கவில்லை
  rationale: עבד என்பதன் அடிப்படைப் பொருளான சேவை மற்றும் விசுவாசப் பற்றைத் தக்கவைத்து, சிலைகளுக்குச் செய்த சேவையையும் யாவேக்குச் செய்யாத சேவையையும் எதிரெதிராக நிறுத்துகிறது.
- source_word: הַבְּעָלִים
  choice: பாகால்கள்
  rationale: பல்வேறு உள்ளூர் பாகால் வழிபாட்டு வடிவங்களைக் குறிக்கும் எபிரேயப் பன்மையைப் பாதுகாக்கும் ஒலிபெயர்ப்பு.
- source_word: הָעַשְׁתָּרוֹת
  choice: அஸ்தரோத்துகள்
  rationale: வழிபாட்டுடன் தொடர்புடைய பெயரின் எபிரேயப் பன்மை வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי אֲרָם
  choice: ஆராமின் தெய்வங்கள்
  rationale: பிற்கால ‘சிரியா’ என்ற பெயரைப் பயன்படுத்தாமல் மூல இடப்பெயரான ஆராமைத் தக்கவைக்கிறது.
- source_word: אֱלֹהֵי בְנֵי עַמּוֹן
  choice: அம்மோன் மக்களின் தெய்வங்கள்
  rationale: ‘அம்மோனின் மகன்கள்’ என்ற சொற்சொல் வடிவத்துக்குப் பதிலாக அதன் இனக்குழுப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் பட்டப்பெயரான ‘கர்த்தர்’ என்று மாற்றவில்லை; ‘யெகோவா’வைக் காட்டிலும் ‘யாவே’ எபிரேயப் பெயரின் ஏற்ற ஒலிபெயர்ப்பாகும்.
- issue: עבד என்பதை விக்கிரக வழிபாட்டுச் சூழலில் எவ்வாறு தருவது
  choice: சேவித்தார்கள்
  alternative: வழிபட்டார்கள்
  rationale: ‘வழிபட்டார்கள்’ சூழலுக்குப் பொருந்தினாலும், வசனத்தின் இறுதியில் அதே வினைச்சொல் யாவேக்கான சேவையை மறுத்துக் கூறுகிறது. ‘சேவித்தார்கள்’ என்பது வழிபாட்டுடன் விசுவாசப் பற்றும் கீழ்ப்படிதலும் அடங்கிய எதிர்மறை இணைப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. பட்டியலின் மீளுருவாக்கமும், ‘சேவித்தார்கள் / சேவிக்கவில்லை’ என்ற மூலத்தின் சொல்லியல் எதிர்மறையும் காக்கப்பட்டுள்ளன. இனக்குழுவைக் குறிக்கும் בני ישראל என்பது பாலின வரம்பை உருவாக்காத வகையில் ‘இஸ்ரவேல் மக்கள்’ என வழங்கப்பட்டுள்ளது.
