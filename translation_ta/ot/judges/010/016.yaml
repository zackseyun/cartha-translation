base_translation:
  language: en
  yaml_path: translation/ot/judges/010/016.yaml
  text: So they removed the foreign gods from among them and served Yahweh[a], and he became impatient over the misery of Israel.
translation:
  language: ta
  text: அவர்கள் தங்கள் நடுவிலிருந்து அந்நிய தெய்வங்களை அகற்றிவிட்டு, யாவேக்கு ஊழியம் செய்தார்கள். இஸ்ரவேலின் துன்பத்தின் காரணமாக அவருடைய உள்ளம் பொறுமையிழந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலின் துன்பத்தை அவரால் இனியும் பொறுத்துக்கொள்ள முடியவில்லை.” எபிரெயத்தில் நேரடியாக, “இஸ்ரவேலின் துன்பத்தினால் அவருடைய உள்ளம் குறுகியது” என்று உள்ளது. இது பொறுமையிழப்பதையோ இனியும் தாங்க முடியாத நிலையையோ குறிக்கும் மரபுத்தொடர்.
    reason: மூல எபிரெய மரபுத்தொடரின் மாற்றுப் பொருளையும் அதன் நேரடிச் சொல்லமைப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: அகற்றிவிட்டு
  rationale: சוּר என்பதன் ஹிஃபில் வடிவம் ‘விலகச் செய்தல், அகற்றுதல்’ என்று பொருள்படும். சிலைகளைத் தங்களிடமிருந்து நீக்கிய உறுதியான செயலை இச்சொல் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: அந்நிய தெய்வங்களை
  rationale: இது இஸ்ரவேலரல்லாத மக்களின் தெய்வங்களைக் குறிக்கும் வழக்குச் சொற்றொடர். ‘அந்நிய தெய்வங்கள்’ என்பது தெளிவான, நவீன தமிழாக்கம்.
- source_word: מִקִּרְבָּם
  choice: தங்கள் நடுவிலிருந்த
  rationale: ‘அவர்களுடைய நடுவிலிருந்து’ என்ற சமூகப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיַּעַבְדוּ אֶת יְהוָה
  choice: யாவேக்கு ஊழியம் செய்தார்கள்
  rationale: עבד என்பது இங்கு வழிபாட்டை மட்டுமல்லாமல் பற்றுறுதியுடனான சேவையையும் கீழ்ப்படிதலையும் உள்ளடக்குகிறது. ‘ஊழியம் செய்தார்கள்’ அந்த விரிவான உடன்படிக்கைச் சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரைப் பெயராகவே ஒலிபெயர்த்து வழங்குகிறது.
- source_word: וַתִּקְצַר נַפְשׁוֹ
  choice: அவருடைய உள்ளம் பொறுமையிழந்தது
  rationale: நேரடியாக ‘அவருடைய உயிர்/உள்ளம் குறுகியது’ எனும் எபிரெய மரபுத்தொடர், இனியும் தாங்க இயலாத நிலையையோ பொறுமையிழப்பையோ குறிக்கிறது. ‘உள்ளம்’ נפשׁ என்பதன் தனிப்பட்ட, உணர்வுப்பூர்வமான மொழியை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: בַּעֲמַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின் துன்பத்தைக் கண்டு
  rationale: עָמָל இச்சூழலில் துயரம், துன்பம் அல்லது வேதனையைக் குறிக்கிறது. காரணத்தையும் எதிர்வினையையும் இயல்பான தமிழில் காட்ட ‘துன்பத்தைக் கண்டு’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: וַתִּקְצַר נַפְשׁוֹ என்பதில் யாவே மனித உணர்வுகளுடன் விவரிக்கப்படுதல்
  choice: அவருடைய உள்ளம் பொறுமையிழந்தது
  alternative: இஸ்ரவேலின் துன்பத்தை அவரால் இனியும் பொறுத்துக்கொள்ள முடியவில்லை
  rationale: மூலத்தில் உள்ள உயிரோட்டமான தனிப்பட்ட மொழியை ஓர் அருவமான இறையியல் விளக்கமாக மாற்றாமல் பாதுகாக்கிறது. அதே நேரத்தில், இந்த மரபுத்தொடர் ‘இனியும் தாங்க முடியவில்லை’ என்றும் புரிந்துகொள்ளப்படலாம் என்பதை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அந்நிய தெய்வங்கள்’, ‘ஊழியம் செய்தார்கள்’, ‘உள்ளம் பொறுமையிழந்தது’ ஆகியவை முறையே மூலத்தின் சமூக, உடன்படிக்கை, உணர்வுப்பூர்வ நுணுக்கங்களை இயல்பாகப் பாதுகாக்கின்றன.
