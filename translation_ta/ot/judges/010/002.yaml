  yaml_path: translation/ot/judges/010/002.yaml
  text: He judged Israel twenty-three years. Then he died and was buried in Shamir.
translation:
  language: ta
  text: அவர் இஸ்ரவேலை இருபத்து மூன்று ஆண்டுகள் நியாயந்தீர்த்தார். பின்னர் அவர் இறந்தார்; சாமீரில் அடக்கம் செய்யப்பட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: நியாயந்தீர்த்து வழிநடத்தினார்
  rationale: நியாயாதிபதிகள் நூலில் שׁפט என்பது தீர்ப்பு வழங்குவதை மட்டும் அல்லாமல், நியாயாதிபதியாக இஸ்ரவேலை வழிநடத்துவதையும் குறிக்கிறது. தமிழ் வாசகருக்கு அந்த விரிந்த பொருள் தெளிவாக இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை
  rationale: நேரடிச் செயப்படுபொருளாக வரும் இஸ்ரவேல் மக்களை இயல்பான தமிழில் இவ்வாறு வழங்குகிறது.
- source_word: עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: இருபத்து மூன்று ஆண்டுகள்
  rationale: கால அளவைத் துல்லியமாகவும் நவீனத் தமிழின் இயல்பான எண் அமைப்பிலும் வழங்குகிறது.
- source_word: וַיָּמָת
  choice: பின்பு அவர் இறந்து
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வைக் குறிக்கிறது; 'பின்பு' நிகழ்வுகளின் வரிசையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டார்
  rationale: நிஃபால் வடிவத்தின் செயப்பாட்டு பொருளைப் பாதுகாத்து, அடக்கம் செய்தவர் யார் என்பதைச் சேர்க்காமல் விடுகிறது.
- source_word: בְּשָׁמִיר
  choice: சாமீரில்
  rationale: בְּ என்ற முன்னொட்டின் இடப்பொருளை '-இல்' மூலம் வழங்கி, இடப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. 'நியாயந்தீர்த்து வழிநடத்தினார்' என்பது நூலின் நியாயாதிபதி-தலைமைச் சூழலைத் தெளிவாக்குகிறது; தேவையற்ற விளக்கமோ சமயப்பிரிவு சார்ந்த பொருளோ சேர்க்கப்படவில்லை.
