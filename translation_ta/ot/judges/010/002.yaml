revisions:
- from: அவர் இஸ்ரவேலை இருபத்து மூன்று ஆண்டுகள் நியாயந்தீர்த்து வழிநடத்தினார். பின்பு அவர் இறந்து, சாமீரில் அடக்கம் செய்யப்பட்டார்.
  to: அவர் இஸ்ரவேலை இருபத்து மூன்று ஆண்டுகள் நியாயந்தீர்த்தார். பின்னர் அவர் இறந்தார்; சாமீரில் அடக்கம் செய்யப்பட்டார்.
  rationale: The revision removes the interpretive addition ‘வழிநடத்தினார்’ while preserving the book’s judicial-leadership terminology through ‘நியாயந்தீர்த்தார்.’ It also renders the consecutive narrative actions as distinct, natural Tamil clauses and retains the source’s unspecified burial agent.
