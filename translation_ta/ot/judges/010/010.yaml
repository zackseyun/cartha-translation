  text: וַֽ/יִּזְעֲקוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל יְהוָ֖ה לֵ/אמֹ֑ר חָטָ֣אנוּ לָ֔/ךְ וְ/כִ֤י עָזַ֨בְנוּ֙ אֶת אֱלֹהֵ֔י/נוּ וַֽ/נַּעֲבֹ֖ד אֶת הַ/בְּעָלִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/010.yaml
  text: Then the sons of Israel cried out to the LORD, saying, “We have sinned against you, because we have forsaken our God and have served the Baals.”
translation:
  language: ta
  text: அப்போது இஸ்ரவேல் மக்கள் ஆண்டவரை நோக்கிக் கூக்குரலிட்டு, “நாங்கள் உமக்கு எதிராகப் பாவம் செய்தோம்; ஏனெனில், எங்கள் கடவுளை விட்டுவிட்டு பாகால்களை வழிபட்டோம்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு சமூகத்தையும் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: எபிரெய தனிப்பெயரைக் குறிக்கும் மரியாதைமிக்க, தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் மரபு வடிவம்.
- source_word: חָטָאנוּ לָךְ
  choice: நாங்கள் உமக்கு எதிராகப் பாவம் செய்தோம்
  rationale: לָךְ என்பதன் உறவுசார் திசையையும் குற்றத்தின் தனிப்பட்ட நோக்கையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְכִי
  choice: ஏனெனில்
  rationale: அவர்கள் செய்த பாவம் எதில் இருந்தது என்பதைத் தொடர்ந்து விளக்கும் காரணத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: הַבְּעָלִים
  choice: பாகால்கள்
  rationale: எபிரெய மூலத்தின் பன்மையைப் பாதுகாக்கிறது; பல்வேறு உள்ளூர் பாகால் வழிபாட்டு வடிவங்களைச் சுட்டும் வாய்ப்பை ஒற்றையாக்கவில்லை.
- source_word: וַנַּעֲבֹד
  choice: வழிபட்டோம்
  rationale: வேற்று தெய்வங்களுக்குச் செய்த சமயச் சேவையை இச்சூழலில் இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: וְכִי என்பதன் உறவு
  choice: ‘ஏனெனில்’ என்று காரணமாக மொழிபெயர்த்தல்
  alternative: ‘மேலும்/உண்மையாகவே’ என்று இரண்டாவது ஒப்புதலாக மொழிபெயர்த்தல்
  rationale: இச்சூழலில் கடவுளை விட்டுப் பாகால்களை வழிபட்டதே அவர்கள் ஆண்டவருக்கு எதிராகச் செய்த பாவம் என்பதை விளக்கும் காரண வாசிப்பு மிகவும் இயல்பானது; இருப்பினும் மூல இணைப்புச்சொல்லில் சிறு நெகிழ்வு உள்ளது.
- issue: הַבְּעָלִים என்பதன் பன்மை
  choice: ‘பாகால்கள்’ என்று பன்மையைப் பாதுகாத்தல்
  alternative: ‘பாகால் தெய்வங்கள்’ அல்லது ஒருமையில் ‘பாகால்’
  rationale: மூல உரையின் பன்மையை இறையியல் அல்லது வரலாற்று விளக்கத்தால் ஒற்றையாக்காமல் அப்படியே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் அமைக்கப்பட்டது. ‘உமக்கு’ என்பது கடவுளை நேரடியாகச் சொல்வதற்கான உயர்வான ஆனால் இன்னும் பரவலாக அறியப்படும் வடிவம்; ‘கூக்குரலிட்டு’ அவசரமான வேண்டுதலின் வலிமையைப் பாதுகாக்கிறது.
