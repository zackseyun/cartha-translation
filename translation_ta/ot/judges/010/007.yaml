  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַֽ/יִּמְכְּרֵ/ם֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/בְ/יַ֖ד בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/007.yaml
  text: So Yahweh’s anger burned against Israel[c][b][a], and he sold them into the hand of the Philistines and into the hand of the Ammonites.
translation:
  language: ta
  text: அப்போது, இஸ்ரவேலுக்கு எதிராக யாவேயின் கோபம் பற்றி எரிந்தது; அவர் அவர்களைப் பெலிஸ்தியரின் கையிலும் அம்மோனியரின் கையிலும் விற்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விற்றார்” என்பது, தீர்ப்பாக இஸ்ரவேலைப் பகைவர்களின் ஆதிக்கத்திற்கு யாவே ஒப்புக்கொடுத்ததைக் குறிக்க நியாயாதிபதிகள் நூலில் மீண்டும் மீண்டும் வரும் சொல்லாட்சி.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: கோபம் பற்றி எரிந்தது
  rationale: எபிரெய மொழியின் ‘கோபம் பற்றியெரிதல்’ என்ற உருவகத்தைத் தக்கவைத்தபடியே, நவீனத் தமிழில் இயல்பாகவும் வலிமையாகவும் ஒலிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயர்; அதனை ஒலிபெயர்த்து வழங்குகிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராக
  rationale: கோபத்தைக் குறிக்கும் இத்தொடரில் בְּ பகைநோக்கிய உறவை, அதாவது ‘எதிராக’ என்ற பொருளைத் தருகிறது.
- source_word: וַיִּמְכְּרֵם
  choice: அவர்களை ... விற்றுப்போட்டார்
  rationale: מכר என்பதன் அடிப்படைப் பொருளான ‘விற்றல்’ என்பதையும், நியாயாதிபதிகள் நூலில் எதிரிகளின் ஆதிக்கத்திற்கு ஒப்படைக்கும் தீர்ப்பைக் குறிக்கும் தொடர்ச்சியான உருவகத்தையும் காக்கிறது.
- source_word: בְּיַד
  choice: கையில்
  rationale: ‘கையில்’ என்பது அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் தக்கவைக்கிறது.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்
  rationale: இந்த மக்கள் குழுவுக்கான தமிழில் நிலைபெற்ற வேதாகமப் பெயர்.
- source_word: בְּנֵי עַמּוֹן
  choice: அம்மோனியர்
  rationale: ‘அம்மோனின் மகன்கள்’ என்பதற்குப் பதிலாக, சூழலில் இயல்பான இனப்பெயரை வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் தேவனுடைய தனிப்பெயரையே பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: וַיִּמְכְּרֵם என்பதில் தெய்வீகத் தீர்ப்பின் செயற்பாடு
  choice: அவர் அவர்களை ... விற்றுப்போட்டார்
  alternative: அவர் அவர்களை ... ஒப்புக்கொடுத்தார்
  rationale: இஸ்ரவேலைப் பகைவர்களின் ஆதிக்கத்திற்கு உட்படுத்தியவர் யாவே என வசனம் நேரடியாகக் கூறுகிறது; ‘விற்றுப்போட்டார்’ என்பது அந்தக் கடுமையையும் நியாயாதிபதிகள் நூலின் மீளும் உருவகத்தையும் மென்மைப்படுத்தாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரெய மொழியின் கோபம் ‘எரிதல்’, எதிரியின் ‘கை’, மக்களை ‘விற்றல்’ ஆகிய முக்கிய உருவகங்கள் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
