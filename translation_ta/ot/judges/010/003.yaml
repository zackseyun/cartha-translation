base_translation:
  language: en
  yaml_path: translation/ot/judges/010/003.yaml
  text: After him arose Jair the Gileadite[a], and he judged Israel twenty-two years.
translation:
  language: ta
  text: அவனுக்குப் பிறகு கிலேயாத்தியனான யாயீர் எழுந்தான்; அவன் இஸ்ரவேலை இருபத்திரண்டு ஆண்டுகள் நியாயந்தீர்த்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, தொடக்கத்திலுள்ள ஆட்சித் தொடர்ச்சி வாய்ப்பாட்டை, “அவனுக்குப் பின் வந்தான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழும்பி
  rationale: קום என்னும் வினை, முந்தைய தலைவருக்குப் பின் அடுத்த தலைவர் தோன்றிச் செயல்படத் தொடங்கியதைச் சுட்டும் தொடர்ச்சி வாய்ப்பாட்டில் வருகிறது. ‘எழும்பி’ என்பது அதன் கதைநடை வடிவத்தைப் பாதுகாக்கிறது.
- source_word: אַחֲרָיו
  choice: அவனுக்குப் பிறகு
  rationale: பின்னொட்டுடன் வந்துள்ள முன்னிடைச்சொல், உடனே முன்பு குறிப்பிடப்பட்ட நியாயாதிபதிக்குப் பிந்தைய காலத்தையும் தொடர்ச்சியையும் நேரடியாகக் குறிக்கிறது.
- source_word: יָאִיר
  choice: யாயீர்
  rationale: எபிரெய தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַגִּלְעָדִי
  choice: கிலேயாத்தியனான
  rationale: இந்த இன/பிராந்திய அடைமொழி, யாயீரின் கிலேயாத் சார்பை இயல்பான தமிழில் பெயரடை வடிவில் காட்டுகிறது.
- source_word: וַיִּשְׁפֹּט
  choice: நியாயந்தீர்த்தான்
  rationale: நியாயாதிபதிகள் நூலில் שפט என்பது நீதித்தீர்ப்பு மட்டுமல்லாமல் மக்களை நியாயாதிபதியாக வழிநடத்தியதையும் குறிக்கலாம். நூலின் தொடர்ச்சியான பதத்தைப் பேண ‘நியாயந்தீர்த்தான்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை
  rationale: நேரடி செயப்படுபொருள் குறியீட்டுக்கு தனி மொழிபெயர்ப்பு தேவையில்லை; இஸ்ரவேல் மக்கள் செயப்படுபொருளாகத் தரப்படுகின்றனர்.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: இருபத்திரண்டு ஆண்டுகள்
  rationale: எபிரெய எண்ணிக்கைச் சொற்றொடர் நவீன தமிழின் இயல்பான எண்ணிக்கை முறையில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: שפט என்ற சொல்லின் ஆட்சித் தலைமை சார்ந்த பரந்த பொருள்
  choice: நியாயந்தீர்த்தான்
  alternative: நியாயாதிபதியாக வழிநடத்தினான்
  rationale: மூலத்தின் மீளும் முக்கியச் சொல்லை வெளிப்படையான விளக்கவுரையாக விரிக்காமல் பாதுகாக்கிறது; அதன் பரந்த தலைமைப் பொருளை நூலின் சூழல் தாங்குகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியமான மொழிநடை. ‘எழும்பி’ மூலத்தின் தொடர்ச்சி வாய்ப்பாட்டைப் பேணுகிறது; அடிக்குறிப்பு மாற்றுப் பொருளைத் தெளிவுபடுத்துகிறது.
