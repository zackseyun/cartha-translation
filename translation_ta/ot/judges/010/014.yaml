review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the plural imperative to go and cry out, the plural referent “gods,” the emphasis of הֵמָּה (“they themselves”), and the final verb’s contextually ironic/jussive force. The alternative future rendering is appropriately retained in the footnote.
  naturalness: The opening “போய்” is colloquial singular/informal in form and does not harmonize well with the following plural-respectful forms “நீங்கள்” and “கூக்குரலிடுங்கள்.” “சென்று” provides a natural modern-standard plural-neutral connection while retaining the dismissive imperative sense. “துன்ப நேரத்தில்” is more idiomatic and direct than the somewhat administrative-sounding “நெருக்கடியின் நேரத்தில்” for צָרָה in this plea-for-help context.
  terminology: “தெய்வங்கள்,” “கூக்குரலிடுங்கள்,” and “காப்பாற்றட்டும்” are suitable. The emphatic inanimate plural “அவைகளே” is defensible for foreign gods/idols and preserves the Hebrew emphasis. The footnote spelling is normalized to “எபிரேய,” and “வினை வடிவம்” is spaced in standard usage.
  issues:
  - severity: low
    issue: Register and agreement at the opening imperative
    rationale: “போய்” is an informal singular-style imperative, whereas the verse otherwise uses plural/respectful address (“நீங்கள்,” “-ிடுங்கள்”). Replacing it with “சென்று” removes the mismatch without changing the source sense.
  - severity: low
    issue: Idiomatic rendering of צָרָה
    rationale: “நெருக்கடியின் நேரத்தில்” is understandable, but “உங்கள் துன்ப நேரத்தில்” more naturally expresses distress/trouble in the immediate context of crying out for rescue.
  - severity: low
    issue: Footnote orthography
    rationale: “எபிரேய வினை வடிவம்” is the standard spaced form and spelling in modern Tamil.
  revised_text: சென்று, நீங்கள் தேர்ந்தெடுத்த தெய்வங்களிடம் கூக்குரலிடுங்கள்; உங்கள் துன்ப நேரத்தில் அவைகளே உங்களைக் காப்பாற்றட்டும்.[a]
