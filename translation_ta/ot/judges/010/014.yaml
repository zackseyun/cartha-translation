revisions:
- from: போய், நீங்கள் தேர்ந்தெடுத்த தெய்வங்களிடம் கூக்குரலிடுங்கள்; உங்கள் நெருக்கடியின் நேரத்தில் அவைகளே உங்களைக் காப்பாற்றட்டும்.[a]
  to: சென்று, நீங்கள் தேர்ந்தெடுத்த தெய்வங்களிடம் கூக்குரலிடுங்கள்; உங்கள் துன்ப நேரத்தில் அவைகளே உங்களைக் காப்பாற்றட்டும்.[a]
  rationale: 'The revision makes only safe stylistic and register corrections: it resolves the imperative-address mismatch, uses a more idiomatic contextual equivalent for “distress,” and standardizes footnote orthography. It preserves the source’s plural gods, emphatic subject, ironic challenge, and documented alternative future reading.'
