source:
  edition: WLC
  text: לְכ֗וּ וְ/זַֽעֲקוּ֙ אֶל הָ֣/אֱלֹהִ֔ים אֲשֶׁ֥ר בְּחַרְתֶּ֖ם בָּ֑/ם הֵ֛מָּה יוֹשִׁ֥יעוּ לָ/כֶ֖ם בְּ/עֵ֥ת צָרַתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/014.yaml
  text: Go and cry out to the gods whom you have chosen[a]; let them save you in the time of your distress.
translation:
  language: ta
  text: சென்று, நீங்கள் தேர்ந்தெடுத்த தெய்வங்களிடம் கூக்குரலிடுங்கள்; உங்கள் துன்ப நேரத்தில் அவைகளே உங்களைக் காப்பாற்றட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவைகள் உங்களைக் காப்பாற்றும்.” எபிரேய வினை வடிவத்தை எளிய எதிர்காலமாகவும் மொழிபெயர்க்கலாம்; ஆனால் இச்சூழலில் அது கிண்டலான சவாலாகச் செயல்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: לְכוּ
  choice: போய்
  rationale: இது பன்மை ஏவல்வினை; கண்டிப்புடன் அனுப்பிவிடும் தொனியை இயல்பான தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: וְזַעֲקוּ
  choice: கூக்குரலிடுங்கள்
  rationale: துன்பத்தில் உதவி கேட்டு உரத்த குரலில் அழைப்பதை זעק குறிக்கிறது; அதன் அவசரத்தையும் தீவிரத்தையும் இச்சொல் காக்கிறது.
- source_word: אֶל הָאֱלֹהִים
  choice: தெய்வங்களிடம்
  rationale: אֱלֹהִים வடிவளவில் இருபொருள் கொள்ளக்கூடியதாயினும், சூழலும் தொடர்ந்து வரும் பன்மைச் சுட்டுப்பெயரும் வினையும் இங்கு இஸ்ரவேல் தேர்ந்தெடுத்த பல அந்நிய தெய்வங்களைக் குறிக்கின்றன.
- source_word: אֲשֶׁר בְּחַרְתֶּם בָּם
  choice: நீங்கள் தேர்ந்தெடுத்த
  rationale: בחר ב என்ற எபிரெயச் சொற்றொடரின் பொருளை இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: הֵמָּה
  choice: அவைகளே
  rationale: தனி பன்மைச் சுட்டுப்பெயரின் வலியுறுத்தலை ‘-ஏ’ விகுதி காக்கிறது; இங்கு பொய்த் தெய்வங்களைக் குறிக்கும் இயல்பான தமிழ் அஃறிணைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: יוֹשִׁיעוּ
  choice: உங்களைக் காப்பாற்றட்டும்
  rationale: ישׁע என்பதன் ஹிஃபீல் வடிவம் ‘காப்பாற்று, விடுவி’ என்று பொருள்படும். சூழலில் இது முன்னறிவிப்பு அல்ல, கிண்டலான சவால்; ‘காப்பாற்றட்டும்’ அந்த உரையாடல் வலிமையை வெளிப்படுத்துகிறது.
- source_word: בְּעֵת
  choice: நேரத்தில்
  rationale: ‘காலத்தில்/நேரத்தில்’ என்ற காலப்பொருளை சுருக்கமான இயல்பான தமிழில் தருகிறது.
- source_word: צָרַתְכֶם
  choice: உங்கள் நெருக்கடி
  rationale: צָרָה குறிக்கும் துன்பம், இடுக்கண், ஆபத்தான சூழ்நிலை ஆகியவற்றை ‘நெருக்கடி’ நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יוֹשִׁיעוּ என்ற இறுதி வினையின் உரையாடல் வலிமை
  choice: கிண்டலான ஏவல்/விருப்ப வினையாக ‘அவைகளே உங்களைக் காப்பாற்றட்டும்’
  alternative: எளிய எதிர்காலமாக ‘அவைகள் உங்களைக் காப்பாற்றும்’
  rationale: வேறு தெய்வங்களைத் தேர்ந்தெடுத்த இஸ்ரவேலை ஆண்டவர் கண்டிக்கும் சூழலில், இது அவை உண்மையில் காப்பாற்றும் என்ற வாக்குறுதி அல்ல; அவற்றிடமே மீட்பை நாடும்படி விடப்படும் கிண்டலான சவால். அதேவேளை, எபிரெய வடிவத்தின் எளிய எதிர்கால வாசிப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், நேரடியான கண்டிப்புத் தொனியும் துன்பத்தில் எழுப்பப்படும் உரத்த அழைப்பும் காக்கப்பட்டுள்ளன. ‘அவைகளே’ என்பது எபிரெய மூலத்தின் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
