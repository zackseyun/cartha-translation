translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இஸ்ரவேலின் புத்திரர்’ என்ற மிகச் சொற்படியான மரபுவழக்குக்குப் பதிலாக, மூலத்தின் உறவுப்பொருளையும் மீளுரைப்பையும் காக்கும் ‘இஸ்ரவேலின் மக்கள்’ தேர்ந்தெடுக்கப்பட்டது. எபிரெய வசனத்தின் காலவாக்கிய அமைப்பில் உள்ள சற்றுக் கடினமான மாறுதலைத் தெளிவுபடுத்த இரண்டு வாக்கியங்களாக வழங்கப்பட்டுள்ளது.
