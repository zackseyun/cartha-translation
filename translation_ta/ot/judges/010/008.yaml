base_translation:
  language: en
  yaml_path: translation/ot/judges/010/008.yaml
  text: And they shattered and crushed the sons of Israel in that year[a]; for eighteen years they oppressed all the sons of Israel who were beyond the Jordan in the land of the Amorites[b], which is in Gilead.
translation:
  language: ta
  text: அந்த ஆண்டில் அவர்கள் இஸ்ரவேல் மக்களை நொறுக்கி நசுக்கினார்கள்[a]. யோர்தானுக்கு அப்பாலுள்ள கீலேயாத்தில் அமைந்த எமோரியரின் நாட்டில் இருந்த இஸ்ரவேல் மக்கள் அனைவரையும் அவர்கள் பதினெட்டு ஆண்டுகள் ஒடுக்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களை உடைத்து நசுக்கினார்கள்” என்றும் மொழிபெயர்க்கலாம். துன்புறுத்தலின் கடுமையை வலியுறுத்த எபிரெய மொழியில் வலிமையான, பொருளில் நெருக்கமான இரண்டு வினைச்சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְעֲצוּ
  choice: நொறுக்கி
  rationale: வன்மையாக உடைத்தல் அல்லது நொறுக்குதல் என்ற சொல்லின் தீவிரமான உருவகப் பொருளைப் பாதுகாக்கிறது.
- source_word: וַיְרֹצְצוּ
  choice: ஒடுக்கினார்கள்
  rationale: முந்தைய வினையுடன் இணைந்து துன்புறுத்தலின் கடுமையை வலுப்படுத்துகிறது; தமிழில் இயல்பாகவும் சூழலுக்கேற்றவாறும் உள்ளது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் உறவுப்பொருளையும் அதன் மீளுரைப்பையும் காக்கும் அதேவேளை, நவீன தமிழில் அனைவரையும் உள்ளடக்கும் இயல்பான வடிவமாக உள்ளது.
- source_word: בַּשָּׁנָה הַהִיא
  choice: அந்த ஆண்டில்
  rationale: காலக் குறிப்பையும் முன்னிடைச்சொல்லின் பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: பதினெட்டு ஆண்டுகள்
  rationale: ஒடுக்குதல் நீடித்த காலத்தைத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: אֶת כָּל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள் அனைவரையும்
  rationale: כָּל என்பதன் முழுமையையும், மீண்டும் வரும் בְּנֵי יִשְׂרָאֵל என்ற தொடரையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: யோர்தானுக்கு அப்பால்
  rationale: எந்தத் திசையிலிருந்து பார்க்கப்படுகிறது என்பதைத் தேவையின்றி தீர்மானிக்காமல் எபிரெய இடவழக்கைத் தக்கவைக்கிறது.
- source_word: בְּאֶרֶץ הָאֱמֹרִי
  choice: எமோரியரின் நாட்டில்
  rationale: பிரதேசத்தைக் குறிக்கும் எபிரெய அமைப்பை நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: אֲשֶׁר בַּגִּלְעָד
  choice: கீலேயாத்திலுள்ள
  rationale: அந்த எமோரியர் நாடு கீலேயாத்தில் அமைந்திருந்தது என்பதைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
