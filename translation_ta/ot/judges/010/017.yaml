  text: וַ/יִּצָּֽעֲקוּ֙ בְּנֵ֣י עַמּ֔וֹן וַֽ/יַּחֲנ֖וּ בַּ/גִּלְעָ֑ד וַ/יֵּאָֽסְפוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַֽ/יַּחֲנ֖וּ בַּ/מִּצְפָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/017.yaml
  text: Then the Ammonites were summoned and camped in Gilead[a], and the sons of Israel gathered together and camped at Mizpah.
translation:
  language: ta
  text: அப்போது அம்மோனியர்கள் அழைக்கப்பட்டு, கீலேயாத்தில் முகாமிட்டார்கள்.[a] இஸ்ரவேல் மக்கள் ஒன்றுகூடி, மிஸ்பாவில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்போது அம்மோனியர்கள் கூக்குரலிட்டு, கீலேயாத்தில் முகாமிட்டார்கள்.” எபிரெய வினைச்சொல் ‘கூக்குரலிடுதல்’ என்றும் பொருள்படலாம்; ஆனால் இச்சூழலில் அது போரணிக்காக அழைக்கப்பட்டு ஒன்று திரண்டதைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֲקוּ
  choice: போருக்காகத் திரட்டப்பட்டு
  rationale: צעק என்பதன் வழக்கமான பொருள் ‘கதறு/கூக்குரலிடு’ என்பதாக இருந்தாலும், உடனே முகாமிடுதல் கூறப்படும் இந்த இராணுவச் சூழலில் போருக்காக அழைத்துத் திரட்டப்படுதல் என்ற பொருள் இயல்பாகிறது. மூலத்தில் உள்ள சாத்தியமான வேறு பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּנֵי עַמּוֹן
  choice: அம்மோனியர்கள்
  rationale: சொல்லுக்கு சொல் ‘அம்மோனின் மகன்கள்’; இங்கு ஒரு மக்களினத்தைக் குறிப்பதால் நவீன தமிழில் ‘அம்மோனியர்கள்’ தெளிவும் இயல்பும் உடையது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது முகாம் அமைத்துத் தங்குவதைக் குறிக்கிறது; ‘முகாமிட்டார்கள்’ இராணுவச் சூழலையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: בַּגִּלְעָד
  choice: கீலேயாத்தில்
  rationale: ב இங்கு ஒரு பிரதேசத்திற்குள் இருப்பதைக் குறிக்கிறது; ஆகவே இடவேற்றுமை உருபான ‘-இல்’ பொருத்தமானது.
- source_word: וַיֵּאָסְפוּ
  choice: ஒன்றுகூடி
  rationale: אסף இங்கு மக்கள் திரண்டு கூடுவதைக் குறிக்கிறது; ‘ஒன்றுகூடி’ கூட்டுத் திரட்டலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’; இங்கு உடன்படிக்கை மக்களாகிய இஸ்ரவேலரை மொத்தமாகக் குறிப்பதால், பாலினத்தைத் தேவையின்றி முன்னிறுத்தாத ‘இஸ்ரவேல் மக்கள்’ நவீன தமிழில் தெளிவானது.
- source_word: בַּמִּצְפָּה
  choice: மிஸ்பாவில்
  rationale: முகாமிட்ட இடமாகிய மிஸ்பாவைக் குறிக்க தமிழில் ‘-இல்’ இயல்பான இடவுருபாகும்.
