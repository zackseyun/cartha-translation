translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. இராணுவச் சூழலைத் தெளிவுபடுத்த ‘போருக்காகத் திரட்டப்பட்டு’ பயன்படுத்தப்பட்டுள்ளது; அதேவேளை மூல எபிரெயச் சொல்லின் உண்மையான சொற்பொருள் வாய்ப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
