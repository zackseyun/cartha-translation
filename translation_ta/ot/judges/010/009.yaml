source:
  edition: WLC
  text: וַ/יַּעַבְר֤וּ בְנֵֽי עַמּוֹן֙ אֶת הַ/יַּרְדֵּ֔ן לְ/הִלָּחֵ֛ם גַּם בִּ/יהוּדָ֥ה וּ/בְ/בִנְיָמִ֖ין וּ/בְ/בֵ֣ית אֶפְרָ֑יִם וַ/תֵּ֥צֶר לְ/יִשְׂרָאֵ֖ל מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/009.yaml
  text: Then the Ammonites crossed the Jordan to fight also against Judah[a], Benjamin, and the house of Ephraim, and Israel was greatly distressed.
translation:
  language: ta
  text: பின்பு அம்மோனியர் யூதாவுக்கும் பென்யமீனுக்கும் எப்பிராயீம் குடும்பத்தினருக்கும் எதிராகப் போரிட யோர்தானைக் கடந்தார்கள். இஸ்ரவேல் மிகுந்த நெருக்கடியில் சிக்கியது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: கடந்தார்கள்
  rationale: עבר என்ற வினைச்சொல்லுக்கு யோர்தான் நேரடிச் செயப்படுபொருளாக இருப்பதால், ஆற்றைக் கடக்கும் குறிப்பான இயக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְנֵי עַמּוֹן
  choice: அம்மோனியர்
  rationale: சொல்லுக்குச் சொல் 'அம்மோனின் மகன்கள்' என்றாலும், இங்கு ஒரு மக்களினத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம் இது.
- source_word: אֶת הַיַּרְדֵּן
  choice: யோர்தானை
  rationale: எபிரெயத்தில் ஆற்றின் பெயர் மட்டும் உள்ளது; தமிழிலும் வழக்கமான வேதாகம இடப்பெயரைச் செயப்படுபொருள் வேற்றுமையுடன் வழங்குகிறது.
- source_word: לְהִלָּחֵם
  choice: போரிட
  rationale: לחם வேரின் இவ்வடிவம் போரில் ஈடுபடுவதைக் குறிக்கிறது; 'போரிட' என்பது சுருக்கமானதும் துல்லியமானதும் ஆகும்.
- source_word: גַּם
  choice: -உம் … -உம் … -உம்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட யோர்தானுக்குக் கிழக்கேயான ஒடுக்குதலோடு இப்பகுதிகளையும் சேர்க்கும் பொருளை, தமிழ் இணைப்பும்மை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בִּיהוּדָה וּבְבִנְיָמִין וּבְבֵית אֶפְרָיִם
  choice: யூதாவுக்கும் பென்யமீனுக்கும் எப்பிராயீம் குடும்பத்தாருக்கும் எதிராக
  rationale: בְּ என்பதன் அடிப்படைப் பொருள் 'இல்' என்றாலும், לְהִלָּחֵם உடன் இங்கு போரின் இலக்கைக் குறிக்கிறது. בֵּית என்பதைக் கைவிடாமல் 'குடும்பத்தார்' எனப் பாதுகாக்கிறது.
- source_word: וַתֵּצֶר לְיִשְׂרָאֵל מְאֹד
  choice: அதனால் இஸ்ரவேல் மிகுந்த நெருக்கடிக்குள்ளானது
  rationale: பெண்பால் ஒருமை வினையின் ஆளற்ற அமைப்பை இயல்பான தமிழில் பாதிக்கப்பட்ட தரப்பை எழுவாயாக்கி வழங்குகிறது; מְאֹד என்பதன் வலிமையை 'மிகுந்த' காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் தொடர்ச்சியைத் தமிழில் தெளிவாக்க 'பின்பு' மற்றும் விளைவு உறவை இயல்பாக்க 'அதனால்' பயன்படுத்தப்பட்டன. தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டன.
