translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் வம்சாவளி, கோத்திரச் சார்பு, புவியியல் குறிப்புகள் ஆகியவை இயல்பான தமிழ் சொல்வரிசையில் வழங்கப்பட்டுள்ளன; மூலத்தின் உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் தக்கவைக்கப்பட்டுள்ளது.
