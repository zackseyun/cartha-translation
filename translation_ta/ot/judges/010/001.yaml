source:
  edition: WLC
  text: וַ/יָּקָם֩ אַחֲרֵ֨י אֲבִימֶ֜לֶךְ לְ/הוֹשִׁ֣יעַ אֶת יִשְׂרָאֵ֗ל תּוֹלָ֧ע בֶּן פּוּאָ֛ה בֶּן דּוֹד֖וֹ אִ֣ישׁ יִשָּׂשכָ֑ר וְ/הֽוּא יֹשֵׁ֥ב בְּ/שָׁמִ֖יר בְּ/הַ֥ר אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/001.yaml
  text: After Abimelech[a], Tola son of Puah, son of Dodo, a man of Issachar, arose to save Israel; and he lived in Shamir in the hill country of Ephraim.
translation:
  language: ta
  text: அபிமெலேக்கிற்குப் பிறகு, இஸ்ரவேலைக் காப்பாற்ற பூவாவின் மகனும் தோதோவின்[a] பேரனுமான, இசக்கார் குலத்தைச் சேர்ந்த தோலா எழுந்தார். அவர் எப்பிராயீமின் மலைநாட்டிலுள்ள சாமீரில் வாழ்ந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய மாமாவின் மகன்.” எபிரெயச் சொற்றொடரைத் ‘தோதோ’ என்ற இயற்பெயராகவோ, ‘அவருடைய மாமா’ என்பதைக் குறிக்கும் பொதுப்பெயர்ச் சொற்றொடராகவோ வாசிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்தார்
  rationale: ஒரு தலைவரின் தோற்றத்தை அறிமுகப்படுத்தும் எபிரெயக் கதைநடையின் முறையான பொருளைத் தக்கவைக்கிறது; அதிகாரப்பூர்வ நியமனம் என்று மிகையாக விளக்கவில்லை.
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: அபிமெலேக்கிற்குப் பிறகு
  rationale: கதைத் தொடரில் காலவரிசையையும் அடுத்தடுத்த நிகழ்வையும் இயல்பாகக் குறிக்கிறது.
- source_word: לְהוֹשִׁיעַ אֶת־יִשְׂרָאֵל
  choice: இஸ்ரவேலைக் காப்பாற்ற
  rationale: ישׁע என்பதன் ஹிஃபில் வடிவத்திலுள்ள மீட்பு அல்லது காப்பாற்றுதல் என்ற பொருளைப் பாதுகாக்கிறது; இதை இராணுவ விடுதலைக்கு மட்டும் குறுக்கவில்லை.
- source_word: תּוֹלָע
  choice: தோலா
  rationale: தனிநபர் பெயர் நவீனத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן־פּוּאָה
  choice: பூவாவின் மகன்
  rationale: வழக்கமான வம்சாவளிக் கட்டமைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: בֶּן־דּוֹדוֹ
  choice: தோதோவின் பேரன்
  rationale: தோதோ என்பதை இயற்பெயராக ஏற்று, தொடர்ச்சியான வம்சாவளியில் தோலாவின் தந்தையின் தந்தை என்ற உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אִישׁ יִשָּׂשכָר
  choice: இசக்கார் குலத்தைச் சேர்ந்த
  rationale: கோத்திரச் சார்பை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְהוּא יֹשֵׁב
  choice: அவர் ... வாழ்ந்தார்
  rationale: குடியிருந்த இடத்தை விவரிக்கும் எபிரெயப் பெயரெச்சக் கட்டமைப்பை இயல்பான தமிழ் இறந்தகாலக் கதைநடையில் வழங்குகிறது.
- source_word: בְּשָׁמִיר
  choice: சாமீரில்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּהַר אֶפְרָיִם
  choice: எப்பிராயீமின் மலைநாட்டில்
  rationale: ஒரு தனி மலையைக் காட்டிலும் நிலப்பகுதியைக் குறிக்கும் புவியியல் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
