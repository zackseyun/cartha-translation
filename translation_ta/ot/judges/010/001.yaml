  source_fidelity: 'வரைவில் முக்கியமான எபிரெயக் கூறுகள் அனைத்தும் உள்ளன: அபிமெலேக்கிற்குப் பிந்தைய காலச்சுட்டு, இஸ்ரவேலைக் காப்பாற்றுதல், தோலாவின் தந்தை/மூதாதையர் வரிசை, இசக்கார் கோத்திர அடையாளம், சாமீர் மற்றும் எப்பிராயீமின் மலைநாடு. இருப்பினும், மூலத்தின் ஒரே அடையாளத் தொடரை இரண்டு வாக்கியங்களாகப் பிரித்திருப்பது சற்றே தளர்வானது; அதை ஒரே வாக்கியத்தில் இணைப்பது மூலத்திற்கும் தெளிவான தமிழுக்கும் ஏற்றது.'
