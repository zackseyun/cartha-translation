translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடை. எபிரெய மூலத்தின் கழுதைக்குட்டிகள்/ஊர்கள் என்ற சொல்விளையாட்டு தமிழில் இயல்பாக மறுபடியும் உருவாக்க முடியாததால், இரு பொருள்களும் துல்லியமாகத் தனித்தனியே வழங்கப்பட்டன. மூலத்தில் மீண்டும் வரும் לָהֶם கருத்துச் சுமையற்ற மறுபதிப்பாக இருப்பதால் தமிழில் ஒருமுறை இயல்பாக அளிக்கப்பட்டது.
