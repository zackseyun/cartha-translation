  yaml_path: translation/ot/judges/010/004.yaml
  text: He had thirty sons, riding on thirty donkeys, and they had thirty towns. To this day they are called Havvoth-jair, which are in the land of Gilead.
translation:
  language: ta
  text: அவனுக்கு முப்பது மகன்கள் இருந்தார்கள். அவர்கள் முப்பது இளம் கழுதைகளின்மேல் சவாரி செய்தார்கள்; அவர்களுக்கு முப்பது ஊர்கள் இருந்தன. கீலேயாத் நாட்டிலுள்ள அந்த ஊர்கள் இன்றுவரை ஹவ்வோத்-யாயீர்[a] என்று அழைக்கப்படுகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “ஹவ்வோத்-யாயீர்”; இதன் பொருள் “யாயீரின் குடியிருப்புகள்.”'
    reason: நிலையான எபிரெய இடப்பெயரை முதன்மை உரையில் பாதுகாத்து, அதன் பொருளை வாசகருக்குத் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: עֲיָרִים
  choice: கழுதைக்குட்டிகள்
  rationale: இங்கு இது עַיִר என்பதன் பன்மை; சவாரிக்குப் பயன்படுத்தப்பட்ட இளம் கழுதைகளைக் குறிக்கிறது. அடுத்ததாக வரும் ஒத்தொலியுடைய עָרִים (‘ஊர்கள்’) என்பதிலிருந்து வேறுபடுத்தப்பட்டது.
- source_word: עָרִים
  choice: ஊர்கள்
  rationale: குடியிருப்புகளைக் குறிக்கும் பொதுவான, இயல்பான நவீனத் தமிழ் சொல்.
- source_word: חַוֺּת יָאִיר
  choice: யாவீரின் குடியிருப்புகள்
  rationale: பெயரின் பொருளைத் தமிழில் உணர்த்தி, எபிரெயப் பெயரான யாவீரையும் தக்கவைக்கிறது; இது ஒரு நிலையான இடப்பெயர் என்பதைக் காலடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை
  rationale: விவரிக்கப்படும் பெயர் உரை எழுதப்பட்ட காலம்வரை தொடர்ந்ததை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶרֶץ הַגִּלְעָד
  choice: கீலேயாத் நாடு
  rationale: אֶרֶץ என்பதன் பிராந்தியப் பொருளை ‘நாடு’ என இயல்பாக வழங்கி, கீலேயாத் என்ற இடப்பெயரை ஒலிபெயர்க்கிறது.
