revisions:
- from: இஸ்ரவேலின் மகன்கள்[a] யாவேவிடம், “நாங்கள் பாவம் செய்தோம். உங்கள் பார்வையில் நல்லதாயிருக்கும் அனைத்தின்படியும் எங்களுக்குச் செய்யுங்கள்[b]. ஆனால் தயவுசெய்து, இன்று மட்டும் எங்களை விடுவியுங்கள்[c]” என்றார்கள்.
  to: இஸ்ரவேலின் மகன்கள்[a] யாவேவிடம், “நாங்கள் பாவம் செய்தோம். உங்கள் பார்வையில் நல்லதாயிருக்கும் அனைத்தின்படியும் எங்களுக்குச் செய்யுங்கள்[b]. ஆயினும், தயவுசெய்து இன்று எங்களை விடுவியுங்கள்[c]” என்றார்கள்.
  rationale: ‘ஆனால் ... இன்று மட்டும்’ என்பதற்குப் பதிலாக ‘ஆயினும், தயவுசெய்து இன்று’ என மாற்றப்பட்டுள்ளது. இது אַךְ என்பதன் வரம்பிடும் வேண்டுகோளை—யாவே எது நல்லதெனக் காண்கிறாரோ அதன்படி செய்ய அனுமதித்தபின், விடுதலையை மட்டும் மன்றாடுவதை—துல்லியமாகக் காக்கிறது. அடிக்குறிப்பு c-யும் நவீன தமிழில் தெளிவான மீட்பு/காப்பு மாற்றாகச் சீரமைக்கப்பட்டுள்ளது.
