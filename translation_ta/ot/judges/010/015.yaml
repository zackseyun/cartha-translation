source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶל יְהוָה֙ חָטָ֔אנוּ עֲשֵׂה אַתָּ֣ה לָ֔/נוּ כְּ/כָל הַ/טּ֖וֹב בְּ/עֵינֶ֑י/ךָ אַ֛ךְ הַצִּילֵ֥/נוּ נָ֖א הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/015.yaml
  text: And the sons of Israel said to Yahweh[a], “We have sinned. Do to us according to all that is good in your eyes[c][b]. Only please deliver us this day.”
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள்[a] யாவேவிடம், “நாங்கள் பாவம் செய்தோம். உங்கள் பார்வையில் நல்லதாயிருக்கும் அனைத்தின்படியும் எங்களுக்குச் செய்யுங்கள்[b]. ஆயினும், தயவுசெய்து இன்று எங்களை விடுவியுங்கள்[c]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “இஸ்ரவேலர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “உங்கள் கண்களில் நல்லதாயிருக்கும் அனைத்தின்படியும்”; அதாவது, உங்களுக்கு நல்லதாகத் தோன்றுகிறபடி.
    reason: lexical_alternative
  - marker: c
    text: அல்லது “எங்களைக் காப்பாற்றுங்கள்” அல்லது “எங்களை மீட்குங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: என்றார்கள்
  rationale: எபிரெயக் கதைநடையை இயல்பான தமிழில் தொடரும் வகையில் உரையாடலின் முடிவில் வினை வைக்கப்பட்டுள்ளது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: மூலத்தின் ‘இஸ்ரவேலின் மகன்கள்’ என்ற பாலினத்தைக் குறிக்கும் இனக்குழு மரபுத்தொடரை முறையாகப் பாதுகாக்கிறது; இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: חָטָאנוּ
  choice: நாங்கள் பாவம் செய்தோம்
  rationale: முடிவுற்ற செயலையும் நேரடியான பாவஒப்புதலையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עֲשֵׂה אַתָּה לָנוּ
  choice: எங்களுக்குச் செய்யுங்கள்
  rationale: அவர்கள் தங்களை யாவேயின் தீர்மானத்துக்கு ஒப்படைக்கும் நேரடியான கட்டளை வடிவைப் பாதுகாக்கிறது.
- source_word: כְּכָל הַטּוֹב בְּעֵינֶיךָ
  choice: உங்கள் பார்வையில் நல்லதாயிருக்கும் அனைத்தின்படியும்
  rationale: ‘கண்களில் நல்லது’ என்ற எபிரெய உருவகத்தைத் தமிழில் ‘பார்வையில் நல்லது’ எனப் பாதுகாத்து, כָּל என்பதையும் ‘அனைத்தும்’ என்று வெளிப்படுத்துகிறது.
- source_word: אַךְ
  choice: ஆனால் ... மட்டும்
  rationale: முழுமையான ஒப்புக்கொடுத்தலைத் தொடர்ந்து வரும் கட்டுப்படுத்தப்பட்ட வேண்டுகோளின் எதிர்மறைத் திருப்பையும் வரம்பையும் வெளிப்படுத்துகிறது.
- source_word: הַצִּילֵנוּ
  choice: எங்களை விடுவியுங்கள்
  rationale: ஆபத்திலிருந்து மீட்பதைக் குறிக்கும் நצל வினையின் காரணவினைப் பொருளைச் சூழலுக்கு ஏற்றவாறு வழங்குகிறது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: கட்டளையுடன் இணைந்த பணிவான மன்றாட்டை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: הַיּוֹם הַזֶּה
  choice: இன்று
  rationale: ‘இந்த நாள்’ என்பதன் உடனடித் தன்மையை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் ஒரு பொதுப் பட்டம் அல்ல, உடன்படிக்கையின் தனிப்பெயர் நேரடியாக இடம்பெறுவதால் அதை ஒலிபெயர்ப்பாகப் பாதுகாக்கிறது.
- issue: בְנֵי יִשְׂרָאֵל என்பதன் வடிவம்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள்
  rationale: மூலமொழியின் ஆண்பால் வடிவத்தையும் இனமரபுத் தொடரையும் முதன்மை உரையில் பாதுகாத்து, அதன் இயல்பான குழுப்பெயர் மாற்றை அடிக்குறிப்பில் அளிக்கிறது.
- issue: כְּכָל הַטּוֹב בְּעֵינֶיךָ என்பதிலுள்ள தெய்வீகத் தீர்மானத்துக்கான ஒப்புக்கொடுத்தல்
  choice: உங்கள் பார்வையில் நல்லதாயிருக்கும் அனைத்தின்படியும்
  alternative: உங்களுக்கு எது நல்லதாகத் தோன்றுகிறதோ அதன்படி
  rationale: அவர்கள் தண்டனையையோ இரக்கத்தையோ முன்கூட்டியே வரையறுக்காமல் யாவேயின் தீர்மானத்துக்கு ஒப்புக்கொடுக்கும் பதற்றத்தைத் தீர்த்துவிடாமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. கடவுளை நோக்கிய உரையில் மரியாதைப் பன்மை வினை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் ‘பார்வையில் நல்லது’ என்ற உருவகமும், ஒப்புக்கொடுத்தலைத் தொடர்ந்து வரும் அவசரமான வரம்பிட்ட மன்றாட்டும் பாதுகாக்கப்பட்டுள்ளன.
