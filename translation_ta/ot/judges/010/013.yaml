  text: But you have forsaken me and served other gods[a]; therefore I will no longer save you.
translation:
  language: ta
  text: ஆனால் நீங்களோ என்னைக் கைவிட்டு, மற்ற தெய்வங்களைச் சேவித்தீர்கள். ஆகவே, இனி நான் உங்களைக் காப்பாற்ற மாட்டேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விடுவிக்க மாட்டேன்” அல்லது “மீட்க மாட்டேன்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் எதிரிகளிடமிருந்து விடுவிப்பதையும், பொதுவாகக் காப்பாற்றுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: ஆனால் நீங்களோ
  rationale: இணைப்புச்சொல்லும் வெளிப்படையான முன்னிலைப் பெயரும் சூழலில் முரண்பாட்டையும் அழுத்தத்தையும் காட்டுகின்றன; ‘ஆனால் நீங்களோ’ என்பது அதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֲזַבְתֶּם
  choice: கைவிட்டு
  rationale: עזב என்பது கைவிடுதல் அல்லது புறக்கணித்தல் என்னும் உறவுசார் கனத்தை உடையது; ‘கைவிட்டு’ அதனைத் தெளிவாகத் தருகிறது.
- source_word: אוֹתִי
  choice: என்னை
  rationale: முதலாம் நபர் ஒருமை நேரடிச் செயப்படுபொருளை இயல்பாக மொழிபெயர்க்கிறது.
- source_word: וַ/תַּעַבְדוּ
  choice: பணிசெய்தீர்கள்
  rationale: தெய்வங்களுடன் வரும் עבד வழிபாட்டுச் சேவையையும் விசுவாசப் பற்றையும் குறிக்கிறது. ‘பணிசெய்தீர்கள்’ என்பது வெறும் சடங்கு வழிபாட்டைவிடச் சொல்லின் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்களுக்கு
  rationale: இந்தச் சொற்றொடர் யாவேக்கு மாறான பிற தெய்வங்களைக் குறிக்கிறது; ‘வேறு தெய்வங்கள்’ நேரடியும் இயல்பானதுமாகும்.
- source_word: לָכֵן
  choice: ஆகவே
  rationale: முந்தைய செயலுக்கும் தொடர்ந்து வரும் தீர்ப்புக்கும் இடையிலான விளைவு உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: לֹא אוֹסִיף
  choice: இனி ... மாட்டேன்
  rationale: மறுப்புடன் வரும் יסף இங்கு ஒரு செயலைத் தொடர்ந்து செய்யாமையைக் குறிக்கிறது; நவீன தமிழில் ‘இனி ... மாட்டேன்’ இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: לְ/הוֹשִׁיעַ
  choice: காப்பாற்ற
  rationale: ישע என்பது காப்பாற்றுதல், விடுவித்தல், மீட்டல் ஆகிய பொருள்களைக் கொள்ளும். ‘காப்பாற்ற’ உடனடி பகைவர் ஒடுக்குமுறையிலிருந்து விடுதலையையும் பரந்த இரட்சிப்புக் கருத்தையும் தாங்கக்கூடியது.
- source_word: אֶתְ/כֶם
  choice: உங்களை
  rationale: இரண்டாம் நபர் பன்மை நேரடிச் செயப்படுபொருளைத் துல்லியமாகக் காட்டுகிறது.
theological_decisions:
- issue: நியாயாதிபதிகள் நூலின் சூழலில் ישע என்ற தெய்வீக விடுதலைச் சொல்லை மொழிபெயர்த்தல்
  choice: காப்பாற்ற
  alternative: விடுவிக்க; மீட்க
  rationale: உடனடிச் சூழல் ஒடுக்குகிற எதிரிகளிடமிருந்து கிடைக்கும் விடுதலையைப் பற்றியது; எனினும் எபிரெயச் சொல் அதைவிடப் பரந்தது. ‘காப்பாற்ற’ இரு பரிமாணங்களையும் திறந்தவையாக வைத்திருக்கிறது; மாற்று மொழிபெயர்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீங்களோ’ மூலம் எதிர்மறை அழுத்தமும், ‘பணிசெய்தீர்கள்’ மூலம் வழிபாடு மற்றும் கீழ்ப்படிதல் ஆகிய இரு நிழற்பொருள்களும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘காப்பாற்ற’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
