translation:
  language: ta
  text: யாயீர் இறந்தார்; காமோனில் அடக்கம் செய்யப்பட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தார்
  rationale: מות என்பதன் வழக்கமான நேரடியான கதைநடைப் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; மென்மைப்படுத்தும் சொற்றொடர் தவிர்க்கப்பட்டது.
- source_word: יָאִיר
  choice: யாயீர்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் இயன்றவரை தெளிவாகப் பெயர்த்தெழுதுகிறது.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டார்
  rationale: קבר வினையின் நிபால் வடிவிலுள்ள செயல்பாட்டு நிலையைக் காக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: בְּקָמוֹן
  choice: காமோனில்
  rationale: בְּ இடத்தைக் குறிக்கிறது; காமோன் என்ற இடத்திற்குள் அல்லது அங்கு அடக்கம் செய்யப்பட்டார் என்ற இயல்பான தமிழ்ச் சொல்லாக்கம்.
