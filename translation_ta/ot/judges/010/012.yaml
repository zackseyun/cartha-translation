  text: וְ/צִידוֹנִ֤ים וַֽ/עֲמָלֵק֙ וּ/מָע֔וֹן לָחֲצ֖וּ אֶתְ/כֶ֑ם וַ/תִּצְעֲק֣וּ אֵלַ֔/י וָ/אוֹשִׁ֥יעָ/ה אֶתְ/כֶ֖ם מִ/יָּדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/012.yaml
  text: The Sidonians[a], Amalek, and Maon oppressed you, and you cried out to me[b], and I saved you from their hand.
translation:
  language: ta
  text: சீதோனியரும், அமாலேக்கும்[a], மாவோனும்[b] உங்களை ஒடுக்கினார்கள். அப்போது நீங்கள் என்னை நோக்கிக் கூக்குரலிட்டீர்கள்; நான் உங்களை அவர்களுடைய கையிலிருந்து காப்பாற்றினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அமாலேக்கியர்கள்.’ எபிரெய உரையில் ‘அமாலேக்கு’ என்று உள்ளது; அது அந்த மக்கள் முழுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மாவோனியர்கள்.’ எபிரெய உரையில் ‘மாவோன்’ என்று உள்ளது; அது மாவோனுடன் தொடர்புடைய ஒரு மக்களினத்தைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִידוֹנִים
  choice: சீதோனியர்
  rationale: சீதோன் நகரைச் சேர்ந்த மக்களைக் குறிக்கும் பன்மை இனப்பெயர்; தமிழில் இயல்பான இனக்குழுப் பெயராக வழங்கப்பட்டது.
- source_word: עֲמָלֵק
  choice: அமாலேக்கு
  rationale: எபிரெய உரையில் உள்ள தனிப்பெயரையே தக்கவைக்கிறது; இங்கு அது அந்த மக்களினம் முழுவதையும் குறிக்கலாம்.
- source_word: מָעוֹן
  choice: மாவோன்
  rationale: எபிரெய மெய்யெழுத்து உரையில் தனிப்பெயராக இருப்பதால் ஒலிபெயர்க்கப்பட்டது; ஒரு மக்களினத்தைக் குறிப்பதாகப் புரிந்துகொள்ளும் வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לָחֲצוּ
  choice: ஒடுக்கினார்கள்
  rationale: பகைமை கொண்டு அழுத்தி, துன்புறுத்தி, ஆதிக்கம் செலுத்தியதைக் குறிக்கும் வினைக்கு இயல்பான நவீனத் தமிழ்.
- source_word: וַתִּצְעֲקוּ אֵלַי
  choice: என்னை நோக்கிக் கூக்குரலிட்டீர்கள்
  rationale: உதவி வேண்டி இறைவனை நோக்கி எழுப்பிய அவசரமான மன்றாட்டின் உணர்ச்சியையும் திசைநோக்கையும் காக்கிறது.
- source_word: וָאוֹשִׁיעָה
  choice: நான் ... காப்பாற்றினேன்
  rationale: ישׁע என்ற வேரின் காப்பாற்றுதல்/விடுவித்தல் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מִיָּדָם
  choice: அவர்களுடைய கையிலிருந்து
  rationale: ஒருவரின் அதிகாரம் அல்லது பிடியிலிருந்து என்பதைக் குறிக்கும் எபிரெய உருவகத்தைப் புரியத்தக்க தமிழில் தக்கவைக்கிறது.
