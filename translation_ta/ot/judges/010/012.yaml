translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தில் தனிப்பெயர்களாக உள்ள ‘அமாலேக்கு,’ ‘மாவோன்’ ஆகியவை முதன்மை உரையில் தக்கவைக்கப்பட்டு, மக்களினப் பொருள் அடிக்குறிப்புகளில் வழங்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் இடம் தவறியிருந்த அடிக்குறிப்பு சுட்டிகள் உரிய சொற்களுக்குப் பின் வைக்கப்பட்டுள்ளன.
