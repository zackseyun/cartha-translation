source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מִיכָ֔ה עַתָּ֣ה יָדַ֔עְתִּי כִּֽי יֵיטִ֥יב יְהוָ֖ה לִ֑/י כִּ֧י הָיָה לִ֛/י הַ/לֵּוִ֖י לְ/כֹהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/013.yaml
  text: Then Micah said[a], “Now I know that Yahweh will do good to me, because I have a Levite as priest.”
translation:
  language: ta
  text: 'அப்போது மீகா, “இப்போது எனக்குத் தெரியும்: யாவே எனக்கு நன்மை செய்வார்; ஏனெனில் ஒரு லேவியர்[a] எனக்கு ஆசாரியராக இருக்கிறார்” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த லேவியர் எனக்கு ஆசாரியராக இருக்கிறார்.” எபிரேயத்தில் “லேவியர்” என்பதற்கு சுட்டுக் கட்டுரை உள்ளது; இது ஏற்கெனவே அறிமுகமான குறிப்பிட்ட லேவியரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; நவீன தமிழில் இயல்பான நிகழ்வுத் தொடரை இது வெளிப்படுத்துகிறது.
- source_word: מִיכָה
  choice: மீகா
  rationale: எபிரேய தனிப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: עַתָּה יָדַעְתִּי
  choice: இப்போது எனக்குத் தெரியும்
  rationale: நிகழ்ந்த உணர்தலால் ஏற்பட்ட தற்போதைய உறுதியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יֵיטִיב ... לִי
  choice: எனக்கு நன்மை செய்வார்
  rationale: יטב என்பதன் ஹிஃபில் வடிவிலுள்ள ‘நன்மை செய்/நன்றாக நடத்து’ என்ற பொருளை, செழிப்பை மட்டும் குறிப்பதாகச் சுருக்காமல் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருப்பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் தருகிறது; ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மாற்றவில்லை.
- source_word: כִּי הָיָה לִי
  choice: ஏனெனில் ... எனக்கு ... இருக்கிறார்
  rationale: இரண்டாவது כִּי காரணத்தை அறிமுகப்படுத்துகிறது; הָיָה לִי உடைமை அல்லது உறவு நிலையைச் சுட்டுகிறது.
- source_word: הַלֵּוִי
  choice: ஒரு லேவியர்
  rationale: எபிரேயத்தில் சுட்டுக் கட்டுரை இருந்தாலும், மீகாவின் காரணவாதத்தில் அந்த மனிதரின் லேவிய அடையாளமே முன்வைக்கப்படுகிறது; தமிழ் உடைமை அமைப்பில் ‘ஒரு லேவியர்’ இயல்பாக உள்ளது. சுட்டியுள்ள மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: לְכֹהֵן
  choice: ஆசாரியராக
  rationale: லாமேத் குறிக்கும் பணி அல்லது வகிபாகத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, தனிப்பெயர் என்பதைக் காக்கிறது. நவீன தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட ‘யெகோவா’ வடிவம் வாசகர்களுக்கு தெளிவாக உள்ளது; ‘யாவே’ என்பது மூல ஒலிப்புக்கு நெருக்கமான மாற்று ஒலிபெயர்ப்பு.
- issue: מִיכָה கூறும் நம்பிக்கையின் மதிப்பீடு
  choice: அவனுடைய கூற்றை விளக்கமின்றி நேரடியாகப் பதிவு செய்தல்
  alternative: அவனுடைய நம்பிக்கை தவறானது என்று உரையிலேயே குறிப்பிடுதல்
  rationale: மூல வசனம் மீகாவின் முடிவை விவரிக்கிறது; அதை ஆதரிக்கவோ மறுக்கவோ இவ்வசனத்திலேயே வெளிப்படையான மதிப்பீடு சேர்க்கவில்லை. ஆகவே கதையின் இறையியல் பதற்றம் அப்படியே வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில் மரியாதையும் கதைநடையும் காக்கப்பட்டுள்ளன. ‘ஆசாரியர்’ என்பது சூழலுக்குரிய நிலையான வேதாகமச் சொலாக வைக்கப்பட்டுள்ளது; இறைப்பெயர் பட்டப்பெயராக மாற்றப்படவில்லை.
