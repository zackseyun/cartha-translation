base_translation:
  language: en
  yaml_path: translation/ot/judges/017/007.yaml
  text: There was a young man from Bethlehem in Judah[a], from the clan of Judah; and he was a Levite[b], and he was sojourning there.
translation:
  language: ta
  text: யூதாவிலுள்ள பெத்லகேமைச் சேர்ந்த ஓர் இளைஞன் இருந்தான். அவன் யூதா குலத்தைச்[a] சேர்ந்தவன்; அவன் ஒரு லேவியன்; அவன் அங்கே தங்கியிருந்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூதாவின் குடும்பத்தைச் சேர்ந்தவன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒரு குடும்பத்தையோ விரிவான குலக் குழுவையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அங்கே தற்காலிகமாக வாழ்ந்துவந்தான் அல்லது வெளியாளாக வசித்துவந்தான். எபிரெய வினைச்சொல் ஒருவரது சொந்த இடமல்லாத ஓரிடத்தில் தங்கியிருப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: இருந்தான்
  rationale: கதைப்போக்கில் ஓர் புதிய நபரை அறிமுகப்படுத்துகிறது. மூலத்தில் தனியான ‘இப்போது’ என்ற காலச்சொல் இல்லாததால் அதைச் சேர்க்கவில்லை.
- source_word: נַעַר
  choice: இளைஞன்
  rationale: இச்சூழலில் ஊழியன் என்ற பங்கைக் காட்டாமல், வயதையும் நபரையும் குறிக்கிறது; ஆகவே இயல்பான நவீனத் தமிழ் சொல்லாக ‘இளைஞன்’ பயன்படுத்தப்பட்டது.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: யூதாவிலுள்ள பெத்லகேமைச் சேர்ந்த
  rationale: மற்ற பெத்லகேம்களிலிருந்து வேறுபடுத்தும் புவியியல் குறிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִמִּשְׁפַּחַת יְהוּדָה
  choice: யூதா குலத்தைச் சேர்ந்தவன்
  rationale: מִשְׁפָּחָה என்பது குடும்பத்தையோ விரிவான குலக் குழுவையோ குறிக்கலாம். இங்கு ‘குலம்’ அதன் சமூகக் குழு சார்ந்த பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: לֵוִי
  choice: ஒரு லேவியன்
  rationale: அவனை லேவியனாக நேரடியாக அடையாளப்படுத்துகிறது; யூதா குலத்தைச் சேர்ந்தவன் என்ற முந்தைய கூற்றுடன் காணப்படும் பதற்றத்தை நீக்கவில்லை.
- source_word: גָר שָׁם
  choice: அங்கே தங்கியிருந்தான்
  rationale: גור வேறிடத்தில் தற்காலிகமாக வாழ்தல் அல்லது வெளியாளாக வசித்தல் ஆகிய நிழற்பொருள்களைக் கொண்டது. ‘தங்கியிருந்தான்’ இயல்பான தமிழில் அடிப்படைப் பொருளைத் தருகிறது; கூடுதல் நிழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இளைஞனின் யூதா குலச் சார்புக்கும் லேவிய அடையாளத்துக்கும் இடையிலான வெளிப்படையான பதற்றம்
  choice: ‘யூதா குலத்தைச் சேர்ந்தவன்’ என்றும் ‘ஒரு லேவியன்’ என்றும் இரண்டையும் முதன்மை உரையில் வைத்தல்
  alternative: ‘யூதா’ என்பதை புவியியல் அல்லது சமூகத் தொடர்பாக விளக்கிப் பதற்றத்தை நீக்குதல்
  rationale: எபிரெய உரை இரண்டு அடையாளங்களையும் அடுத்தடுத்து கூறுகிறது. அவற்றை மொழிபெயர்ப்பிலேயே ஒத்திசைத்து விளக்காமல், மூலத்தின் உண்மையான தெளிவின்மையைப் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவன்’ என்ற இயல்பான சுட்டுப்பெயர் தொடர்ச்சிக்காக வைக்கப்பட்டுள்ளது. மூலத்தில் உள்ள அடையாளப் பதற்றம் விளக்கிப் போக்கப்படவில்லை; ‘தங்கியிருந்தான்’ என்ற வாசகர் நட்பு சொல் அடிக்குறிப்பால் துல்லியப்படுத்தப்பட்டுள்ளது.
