  edition: WLC
  text: וַ/יֵּ֨לֶךְ הָ/אִ֜ישׁ מֵ/הָ/עִ֗יר מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה לָ/ג֖וּר בַּ/אֲשֶׁ֣ר יִמְצָ֑א וַ/יָּבֹ֧א הַר אֶפְרַ֛יִם עַד בֵּ֥ית מִיכָ֖ה לַ/עֲשׂ֥וֹת דַּרְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/008.yaml
  text: And the man went from the city[a], from Bethlehem of Judah, to sojourn wherever he might find a place. And he came to the hill country of Ephraim, as far as the house of Micah, to continue his journey.
translation:
  language: ta
  text: அந்த மனிதன் யூதாவிலுள்ள பெத்லெகேம் நகரத்திலிருந்து புறப்பட்டு, குடியிருக்க இடம் எங்கே கிடைக்குமோ அங்கே செல்லச் சென்றான். அவன் தன் வழியில் பயணம் செய்துகொண்டிருந்தபோது[a], எப்பிராயீமின் மலைநாட்டிலுள்ள மீகாவின் வீட்டுவரை வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் பயணத்தைத் தொடருவதற்காக” அல்லது “தன் வழியே சென்றபோது.” எபிரேய மரபுத்தொடரின் நேரடிப் பொருள் “தன் வழியைச் செய்ய” என்பதாகும்.
    reason: לַעֲשׂוֹת דַּרְכּוֹ என்ற மரபுத்தொடரின் நோக்கநிலை அல்லது காலநிலை சார்ந்த தொடரியல் தெளிவின்மையையும் அதன் நேரடிப் படிமத்தையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: புறப்பட்டு ... சென்றான்
  rationale: הלך என்பதன் எளிய நகர்வுப் பொருளை இயல்பான தமிழ் கதைநடையில் தருகிறது; பெத்லெகேமிலிருந்து கிளம்பியதையும் நோக்கத்துடன் சென்றதையும் தெளிவாக்குகிறது.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: மூலத்தில் இவ்வசனம் האיש, ‘அந்த மனிதன்’ என்றே கூறுகிறது; முந்தைய சூழலில் அவன் இளைஞனும் லேவியனுமாக இருந்தாலும், அந்த விவரங்களை இங்கே சேர்க்கவில்லை.
- source_word: מֵהָעִיר מִבֵּית לֶחֶם יְהוּדָה
  choice: யூதாவிலுள்ள பெத்லெகேம் நகரத்திலிருந்து
  rationale: ‘நகரத்திலிருந்து, யூதாவின் பெத்லெகேமிலிருந்து’ என்ற எபிரெய இணைப்பை இயல்பான தமிழில் ஒரே புவியியல் சொற்றொடராக வழங்குகிறது.
- source_word: לָגוּר
  choice: குடியிருக்க
  rationale: גור என்பது வெறுமனே ஓரிரவு தங்குவதைவிட, நிரந்தர உரிமையில்லாதவராக அல்லது தற்காலிகமாக ஓரிடத்தில் வசிப்பதைக் குறிக்கலாம்; ‘குடியிருக்க’ அந்த வசிப்புப் பொருளைப் பாதுகாக்கிறது.
- source_word: בַּאֲשֶׁר יִמְצָא
  choice: தங்குவதற்கு இடம் எங்கே கிடைக்குமோ அங்கே
  rationale: மூலத்தில் ‘இடம்’ என்பது வெளிப்படையாக இல்லாவிட்டாலும் ‘கிடைக்கும் எங்கேயாயினும்’ என்பதில் அது உட்பொருளாக உள்ளது; தமிழில் பொருள் தெளிவாக இயங்க இதை வெளிப்படுத்துகிறது.
- source_word: הַר אֶפְרַיִם
  choice: எப்பிராயீமின் மலைநாடு
  rationale: இது பொதுவாக ஒரே மலையை அல்ல, எப்பிராயீமைச் சேர்ந்த மலைப்பாங்கான பிரதேசத்தைக் குறிக்கிறது.
- source_word: עַד בֵּית מִיכָה
  choice: மீகாவின் வீட்டுவரை
  rationale: עד குறிக்கும் எல்லை அல்லது சென்றடைந்த முனையை ‘வீட்டுவரை’ நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: לַעֲשׂוֹת דַּרְכּוֹ
  choice: தன் பயணத்தை மேற்கொண்டபோது
  rationale: சொல்லுக்குச் சொல் ‘தன் வழியைச் செய்ய’ என்ற எபிரெய மரபுத்தொடர், பயணத்தில் செல்வதைக் குறிக்கிறது. சூழலில் காலநிலைப் பொருள் இயல்பாக இருந்தாலும், நோக்கப்பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
