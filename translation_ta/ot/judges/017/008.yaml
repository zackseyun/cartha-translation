translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘குடியிருக்க’ என்பது גור-இன் வசிப்புப் பொருளை அளிக்கிறது; ‘தங்குவதற்கு இடம்’ அதன் தற்காலிக அல்லது வெளியூர்வாசி நிழற்பொருளைச் சூழலிலேயே உணர்த்துகிறது. இறுதி எபிரெய மரபுத்தொடரின் தெளிவின்மை அடிக்குறிப்பில் விடப்பட்டுள்ளது.
