base_translation:
  language: en
  yaml_path: translation/ot/judges/017/001.yaml
  text: There was a man from the hill country of Ephraim[a], and his name was Mikayhu.
translation:
  language: ta
  text: எப்பிராயீமின் மலைநாட்டைச் சேர்ந்த ஒரு மனிதன் இருந்தான்; அவன் பெயர் மீகாயெஹூ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபாக இந்தப் பெயர் ‘மீகா’ என்று வழங்கப்படுகிறது. இங்கு எபிரெயத்தில் உள்ள வடிவம் ‘மீகாயெஹூ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: இருந்தான்
  rationale: புதிய கதைப்பகுதியை அறிமுகப்படுத்தும் היה வினைச்சொல்லை இயல்பான தமிழ் இருப்புவாக்கியமாகத் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘இப்போது’ போன்ற காலச் சொல்லைச் சேர்க்கவில்லை.
- source_word: אִישׁ
  choice: ஒரு மனிதன்
  rationale: இங்கு தனிப்பட்ட ஓர் ஆணைக் குறிக்கும் சொல்லின் நேரடியான, பொதுவாசகருக்குப் புரியும் மொழிபெயர்ப்பு.
- source_word: מֵהַר אֶפְרָיִם
  choice: எப்பிராயீமின் மலைநாட்டைச் சேர்ந்த
  rationale: இது ஒரு தனி மலையை அல்ல, எப்பிராயீமுடன் தொடர்புடைய மேட்டுநிலப் பகுதியைக் குறிக்கிறது; தமிழில் இயல்பான புவியியல் சொல்லாக்கமாக ‘மலைநாடு’ பயன்படுத்தப்பட்டது.
- source_word: וּשְׁמוֹ
  choice: அவன் பெயர்
  rationale: எபிரெய இணைப்பை அரைப்புள்ளிக்குப் பிந்தைய ஒருங்கிணைந்த தமிழ் வாக்கியமாகப் பாதுகாக்கிறது.
- source_word: מִיכָיְהוּ
  choice: மீகாயேகு
  rationale: இவ்வசனத்திலுள்ள எபிரெயப் பெயரின் குறிப்பிட்ட வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது; மரபான சுருக்கப் பெயரால் அதை மாற்றவில்லை.
theological_decisions: []
