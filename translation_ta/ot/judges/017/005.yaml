  text: וְ/הָ/אִ֣ישׁ מִיכָ֔ה ל֖/וֹ בֵּ֣ית אֱלֹהִ֑ים וַ/יַּ֤עַשׂ אֵפוֹד֙ וּ/תְרָפִ֔ים וַ/יְמַלֵּ֗א אֶת יַ֤ד אַחַד֙ מִ/בָּנָ֔י/ו וַ/יְהִי ל֖/וֹ לְ/כֹהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/005.yaml
  text: The man Micah had a house of God[a], and he made an ephod and household idols, and he ordained one of his sons[b], and he became his priest.
translation:
  language: ta
  text: மீகா என்ற அந்த மனிதனிடம் தெய்வங்களின் இல்லம் ஒன்று இருந்தது[a]. அவன் ஓர் ஏபோத்தையும் வீட்டுத் தெய்வச் சிலைகளையும் செய்து, தன் மகன்களில் ஒருவனை ஆசாரியனாக நியமித்தான்[b]; அவன் மீகாவுக்கு ஆசாரியனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு வழிபாட்டிடம்” அல்லது “கடவுளின் இல்லம்.” எபிரெயில் சொற்பட “தெய்வங்களின் இல்லம்”; אֱלֹהִים என்ற சொல் வடிவில் பன்மையாக இருந்தாலும், சில சூழல்களில் ஒருமைப் பொருளில் “கடவுள்” என்றும் வரும்.
    reason: lexical_alternative
  - marker: b
    text: சொற்பட, “தன் மகன்களில் ஒருவனுடைய கையை நிரப்பினான்.” இது ஒருவரை ஆசாரியப் பணியில் நிறுவுதல் அல்லது அர்ப்பணித்தலைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית אֱלֹהִים
  choice: தெய்வங்களின் இல்லம்
  rationale: בֵּית என்பதன் ‘இல்லம்’ என்ற உருவகத்தையும் אֱלֹהִים என்பதன் வடிவியல் பன்மையையும் தக்கவைக்கிறது. ஏபோத் மற்றும் தெராப்பீம் குறித்த உடனடிச் சூழல், இது மீகாவின் தனிப்பட்ட வழிபாட்டிடம் என்பதைச் சுட்டுகிறது; இருப்பினும் ‘கடவுளின் இல்லம்’ என்ற ஒருமை வாசிப்பும் இயலுவதால் அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֵפוֹד
  choice: ஏபோத்
  rationale: இதற்குத் துல்லியமான நவீனத் தமிழ் இணைச்சொல் இல்லை. பழங்கால வழிபாட்டோடு தொடர்புடைய குறிப்பிட்ட பொருள் அல்லது உடையைக் குறிக்கும் சொல்லாக இருப்பதால் ஒலிபெயர்ப்பு செய்யப்பட்டுள்ளது.
- source_word: תְרָפִים
  choice: வீட்டுத் தெய்வச் சிலைகள்
  rationale: வீட்டுச் சூழலில் வழிபாட்டுக்குப் பயன்படுத்தப்பட்ட உருவங்களைக் குறிக்கும் சொல்லின் பொருளை சாதாரண தமிழ் வாசகருக்குத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וַיְמַלֵּא אֶת־יַד
  choice: ஆசாரியனாக நியமித்தான்
  rationale: ‘கையை நிரப்பினான்’ என்பது ஆசாரியப் பணியில் ஒருவரை நிறுவுதல் அல்லது அர்ப்பணித்தல் குறித்த எபிரெய மரபுத்தொடர். அதன் செயல்பாட்டு பொருள் இயல்பான தமிழில் தரப்பட்டு, சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אַחַד מִבָּנָיו
  choice: தன் மகன்களில் ஒருவனை
  rationale: எபிரெயப் பகுதியின் ஆண்பால் மற்றும் பகுதி சார்ந்த அமைப்பை நேரடியாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: וַיְהִי לוֹ לְכֹהֵן
  choice: அவன் மீகாவுக்கு ஆசாரியனானான்
  rationale: நியமனத்தின் விளைவாக மகன் மீகாவுக்கான ஆசாரியனானான் என்ற விளைவு நிலையைத் தெளிவுபடுத்துகிறது; ‘அவன்’ என்பதன் தொடர்பு குழப்பமடையாதபடி ‘மீகாவுக்கு’ என்று பெயர் மீண்டும் கூறப்பட்டுள்ளது.
- source_word: וְהָאִישׁ מִיכָה
  choice: மீகா என்ற அந்த மனிதன்
  rationale: பெயருக்கு முன் வரும் குறிப்பிட்ட பெயர்ச்சொல்லைத் தக்கவைத்து, எபிரெயில் இல்லாத ‘இப்போது’ போன்ற காலக் குறிப்பைச் சேர்க்காமல் இயல்பான தமிழில் தலைப்பை மீண்டும் முன்னிறுத்துகிறது.
theological_decisions:
- issue: בֵּית אֱלֹהִים என்பது உண்மையான கடவுளின் அங்கீகரிக்கப்பட்ட ஆலயத்தைக் குறிக்கிறதா, அல்லது மீகாவின் தனிப்பட்ட பலதெய்வ வழிபாட்டிடத்தைக் குறிக்கிறதா?
  choice: தெய்வங்களின் இல்லம்
  alternative: கடவுளின் இல்லம்; ஒரு வழிபாட்டிடம்
  rationale: இங்கு ஏபோத், வீட்டுத் தெய்வச் சிலைகள், தன் மகனை ஆசாரியனாக்குதல் ஆகிய முறையற்ற வழிபாட்டு அம்சங்கள் உடனடியாகக் கூறப்படுகின்றன. ஆகவே பன்மை வடிவத்தையும் சூழலின் தனிப்பட்ட வழிபாட்டு தன்மையையும் பிரதான உரை காட்டுகிறது. எனினும் אֱלֹהִים ஒருமைப் பொருளிலும் வரக்கூடியதால் அந்த உண்மையான மொழியியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான வேதாகம நடையில் அமைக்கப்பட்டது. ‘ஏபோத்’ மட்டும் துல்லியமான தமிழ் இணைச்சொல் இல்லாததால் ஒலிபெயர்க்கப்பட்டுள்ளது. ‘ஆசாரியன்’ என்பது இச்சூழலின் வழிபாட்டுப் பதவியைத் தெளிவாகக் குறிக்கப் பயன்படுத்தப்பட்டுள்ளது; குறிப்பிட்ட சமயப் பிரிவின் அருட்பொழிவு கருத்து உரையில் ஏற்றப்படவில்லை.
