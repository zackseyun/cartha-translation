base_translation:
  language: en
  yaml_path: translation/ot/judges/017/003.yaml
  text: So he returned the eleven hundred pieces of silver to his mother[a], and his mother said, “I had solemnly dedicated the silver to Yahweh from my hand for my son, to make a carved image and a cast image[b]; so now I return it to you.”
translation:
  language: ta
  text: அவன் ஆயிரத்து நூறு வெள்ளித் துண்டுகளைத் தன் தாயிடம் திருப்பிக் கொடுத்தான். அப்போது அவனுடைய தாய், “இந்த வெள்ளியை என் கையிலிருந்து[a] என் மகனுக்காக, செதுக்கப்பட்ட ஓர் உருவத்தையும் வார்க்கப்பட்ட ஓர் உருவத்தையும்[b] செய்வதற்கு யாவேவுக்கு உறுதியாக அர்ப்பணித்திருந்தேன். இப்போது அதை உன்னிடம் திருப்பிக் கொடுக்கிறேன்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் கையிலிருந்து” என்பது அந்த வெள்ளி அவளுடைய உடைமையிலிருந்து அல்லது அவளது சொந்தச் செயலால் அர்ப்பணிக்கப்பட்டதைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: “வார்க்கப்பட்ட உருவம்” என்பது உலோகம் போன்ற பொருளை உருக்கி அச்சில் வார்த்து செய்யப்பட்ட உருவத்தைக் குறிக்கலாம். இந்த இரு சொற்களும் இரண்டு உருவங்களையோ, ஒரே உருவத்தின் இரு அம்சங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: திருப்பிக் கொடுத்தான்
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் இங்கு எடுத்ததை மீண்டும் கொடுப்பதைக் குறிக்கிறது; இயல்பான தமிழில் restitution உணர்வையும் காக்கிறது.
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: ஆயிரத்து நூறு வெள்ளித் துண்டுகள்
  rationale: மூலத்தில் எடையலகான ‘சேக்கல்’ வெளிப்படையாக இல்லை. ஆகவே அதைச் சேர்க்காமல், எண்ணப்பட்ட வெள்ளியைக் குறிக்கும் இயல்பான பொதுச்சொல் பயன்படுத்தப்பட்டது.
- source_word: הַקְדֵּשׁ הִקְדַּשְׁתִּי
  choice: உறுதியாக அர்ப்பணித்திருந்தேன்
  rationale: வினையெச்சப் பெயருருவும் முற்றுவினையும் இணைந்து அர்ப்பணிப்பை வலியுறுத்துகின்றன. ‘உறுதியாக’ அந்த வலியுறுத்தலைத் தருகிறது; ‘அர்ப்பணித்திருந்தேன்’ முன்பே நிகழ்ந்த அர்ப்பணிப்பைச் சூழலுக்கு ஏற்றவாறு காட்டுகிறது.
- source_word: לַיהוָה
  choice: யாவேவுக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயர் பொதுப்பட்டமாக மாற்றப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: מִיָּדִי
  choice: என் கையிலிருந்து
  rationale: மூலத்தின் உருவகச் சொல்லாட்சியைத் தக்கவைத்து, வெள்ளி தாயின் உடைமையிலிருந்து அல்லது அவளது நேரடி செயலால் அர்ப்பணிக்கப்பட்டதைக் காட்டுகிறது.
- source_word: לִבְנִי
  choice: என் மகனுக்காக
  rationale: ל முன்னொட்டு இங்கு பயனாளியை அல்லது நோக்கத்தைச் சுட்டுகிறது.
- source_word: פֶּסֶל
  choice: செதுக்கப்பட்ட ஓர் உருவம்
  rationale: செதுக்கி வடிவமைக்கப்பட்ட வழிபாட்டு உருவம் என்ற கைக்கூடிய பொருளை, விளக்கத் தீர்ப்பைச் சேர்க்காமல் தருகிறது.
- source_word: וּמַסֵּכָה
  choice: வார்க்கப்பட்ட ஓர் உருவம்
  rationale: உருக்கிய பொருளை அச்சில் வார்த்து உருவாக்கிய உருவம் என்ற מסכה சொல்லின் தொழில்நுட்பப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֲשִׁיבֶנּוּ לָךְ
  choice: அதை உன்னிடம் திருப்பிக் கொடுக்கிறேன்
  rationale: சூழலில் உடனடியாகச் செய்யப்படும் செயலைக் குறிக்கும் முதல் நபர் கூற்றாக இயல்பாக மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இடம்பெறுவதால், பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- issue: விக்கிரக உருவங்களைச் செய்வதற்கான வெள்ளியை யாவேவுக்கு அர்ப்பணித்ததாகக் கூறும் பதற்றம்
  choice: அர்ப்பணிப்பு மொழியையும் உருவங்கள் செய்யும் நோக்கத்தையும் அப்படியே வைத்தல்
  alternative: அர்ப்பணிப்பைத் தவறானதாக விளக்கும் அல்லது மென்மைப்படுத்தும் மொழியைச் சேர்த்தல்
  rationale: எபிரேய உரை பக்திசார் அர்ப்பணிப்பு மொழியையும் உருவங்கள் செய்யும் நோக்கத்தையும் அருகருகே வைக்கிறது. அதன் இறையியல் முரண்பாடு விளக்கிச் சரிசெய்யப்படாமல் பாதுகாக்கப்பட்டது.
- issue: פֶּסֶל וּמַסֵּכָה ஒரே உருவத்தின் இரு விளக்கங்களா அல்லது இரண்டு உருவங்களா
  choice: செதுக்கப்பட்ட ஓர் உருவத்தையும் வார்க்கப்பட்ட ஓர் உருவத்தையும்
  alternative: செதுக்கி வார்க்கப்பட்ட ஓர் உருவத்தை
  rationale: ו இணைப்பை அதன் சாதாரண கூட்டிணைப்பு பொருளில் மொழிபெயர்த்து இரு பெயர்ச்சொற்களின் தனித்தன்மையைப் பேணுகிறது; அவை ஒரே பொருளைக் குறிக்கக்கூடும் என்ற சாத்தியத்தை மொழிபெயர்ப்பில் கட்டாயமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் நடையில் அமைக்கப்பட்டது. ‘வெள்ளித் துண்டுகள்’ என்பது மூலத்தில் குறிப்பிடப்படாத ‘சேக்கல்’ என்ற அலகைச் சேர்ப்பதைத் தவிர்க்கிறது. இறைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது; அர்ப்பணிப்புக்கும் உருவம் செய்வதற்குமான நோக்கத்திற்கும் இடையிலான உரையின் பதற்றம் மென்மைப்படுத்தப்படவில்லை.
