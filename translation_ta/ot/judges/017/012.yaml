  text: וַ/יְמַלֵּ֤א מִיכָה֙ אֶת יַ֣ד הַ/לֵּוִ֔י וַ/יְהִי ל֥/וֹ הַ/נַּ֖עַר לְ/כֹהֵ֑ן וַ/יְהִ֖י בְּ/בֵ֥ית מִיכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/012.yaml
  text: So Micah ordained the Levite[a], and the young man became his priest and was in Micah’s house.
translation:
  language: ta
  text: மீகா அந்த லேவியரை ஆசாரியப் பணியில் அமர்த்தினான்[a]. அந்த இளைஞன் மீகாவுக்கு ஆசாரியனானான்; அவன் மீகாவின் வீட்டில் இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “லேவியனின் கையை நிரப்பினான்.” இது ஒருவரை ஆசாரியப் பணியில் நிறுவுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא אֶת־יַד
  choice: ஆசாரியப் பணியில் அமர்த்தினான்
  rationale: ‘கையை நிரப்புதல்’ என்ற எபிரெய மரபுத்தொடர் ஒருவரை ஆசாரியப் பணியில் நிறுவுவதைக் குறிக்கிறது. சொல்லுக்குச் சொல் மொழிபெயர்ப்பு நவீனத் தமிழில் தெளிவற்றதாக இருப்பதால், செயலின் பொருளை இயல்பாக வெளிப்படுத்தும் இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַלֵּוִי
  choice: அந்த லேவியரை
  rationale: இது அந்த மனிதரை அவரது கோத்திர அடையாளத்தால் குறிப்பிடுகிறது. தமிழில் மரியாதையுடனும் இயல்பாகவும் மனிதரைச் சுட்ட ‘லேவியரை’ பயன்படுத்தப்பட்டது.
- source_word: הַנַּעַר
  choice: அந்த இளைஞன்
  rationale: נַעַר என்பது சூழலுக்கு ஏற்ப சிறுவன், இளைஞன் அல்லது பணியாள் எனப் பொருள்படலாம். இங்கு தனியாக ஆசாரியப் பொறுப்பேற்கும் நபரைக் குறிப்பதால் ‘இளைஞன்’ பொருத்தமானது.
- source_word: לְכֹהֵן
  choice: ஆசாரியனாகி
  rationale: לְ இங்கு பங்கு அல்லது பணியைச் சுட்டுகிறது. ‘அவனுடைய ஆசாரியனாகி’ என்பது அந்த இளைஞன் மீகாவுக்காக வகித்த பங்கையும் ஏற்பட்ட மாற்றத்தையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיְהִי לוֹ
  choice: அவனுடைய ... ஆகி
  rationale: இந்த அமைப்பு அந்த இளைஞன் மீகாவுக்குரிய ஆசாரியப் பங்கை ஏற்றதைக் குறிக்கிறது; தமிழில் உடைமைத் தொடர்பும் நிலைமாற்றமும் இவ்வாறு தெளிவாகின்றன.
- source_word: בְּבֵית מִיכָה
  choice: மீகாவின் வீட்டில் தங்கியிருந்தான்
  rationale: மூலத்தில் ‘மீகாவின் வீட்டில் இருந்தான்’ என்று உள்ளது. தொடர்ச்சியான குடியிருப்பை இயல்பான தமிழில் தெரிவிக்க ‘தங்கியிருந்தான்’ என வழங்கப்பட்டது; ‘வீடு’ என்ற இடப்பொருள் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: தனிப்பட்ட, ஒழுங்குமுறையற்ற வழிபாட்டு ஏற்பாட்டிற்கு சட்டப்பூர்வ அல்லது தெய்வீக அங்கீகாரம் இருப்பதாக மொழிபெயர்ப்பு உணர்த்தாதிருத்தல்
  choice: ஆசாரியப் பணியில் அமர்த்தினான்
  alternative: பிரதிஷ்டை செய்தான்; கையை நிரப்பினான்
  rationale: மூலம் மீகா லேவியரை ஆசாரியப் பணியில் நிறுவிய செயலை விவரிக்கிறது; அந்தச் செயல் கடவுளால் அங்கீகரிக்கப்பட்டது என்று கூறவில்லை. ‘பணியில் அமர்த்தினான்’ என்பது நடந்த செயலை மட்டும் தெரிவித்து, அதன் சட்டப்பூர்வத்தன்மை குறித்து தீர்ப்பு சேர்க்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘திருநிலைப்படுத்தினான்’ அல்லது ‘பிரதிஷ்டை செய்தான்’ போன்ற அங்கீகாரத் தொனியைக் கொடுக்கக்கூடிய சொற்களைத் தவிர்த்து, நடுநிலையான ‘ஆசாரியப் பணியில் அமர்த்தினான்’ பயன்படுத்தப்பட்டது.
