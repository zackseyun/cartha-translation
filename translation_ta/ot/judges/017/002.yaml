base_translation:
  language: en
  yaml_path: translation/ot/judges/017/002.yaml
  text: And he said to his mother[a], “The eleven hundred pieces of silver that were taken from you, about which you uttered a curse and also spoke in my hearing—look, the silver is with me; I took it.” And his mother said[b], “Blessed be my son by Yahweh.”
translation:
  language: ta
  text: அவன் தன் தாயிடம்[a], “உன்னிடமிருந்து எடுத்துச் செல்லப்பட்ட ஆயிரத்து நூறு வெள்ளித் துண்டுகளைப் பற்றி நீ சாபமிட்டதையும், அதை என் காதுபடச் சொன்னதையும் நான் கேட்டேன். இதோ, அந்த வெள்ளி என்னிடம்தான் இருக்கிறது; நான்தான் அதை எடுத்தேன்” என்றான். அப்போது அவனுடைய தாய்[b], “என் மகன் யாவேவால் ஆசீர்வதிக்கப்படுவானாக” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீ சாபமிட்டதையும்” என்பதற்கு, “நீ ஆணை செய்ததையும்” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல் ஆணையையோ சாபத்தையோ குறிக்கக்கூடும். இச்சூழலில் சாபம் என்ற பொருள் அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “என் மகன் யாவேக்கு/யாவேவால் ஆசீர்வதிக்கப்பட்டவன்” என்ற சுருக்கமான ஆசீர்வாத வாய்பாடு உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: ஆயிரத்து நூறு வெள்ளிக்காசுகள்
  rationale: எபிரெயத்தில் அளவின் அலகு வெளிப்படையாக இல்லை. ‘வெள்ளிக்காசுகள்’ என்பது இயல்பான தமிழில் எண்ணப்பட்ட வெள்ளித் துண்டுகளைக் குறிக்கிறது; ‘சேக்கல்’ என்று குறிப்பிடுவது மூலத்தில் இல்லாத அலகைச் சேர்த்துவிடும்.
- source_word: לֻקַּח לָךְ
  choice: உன்னிடமிருந்து எடுத்துச் செல்லப்பட்ட
  rationale: לקח என்பதன் செயப்பாட்டு வடிவம் ‘எடுக்கப்பட்டது’ என்பதாகும். சூழல் திருட்டைக் குறிப்பிட்டாலும், ‘திருடப்பட்ட’ என்று மொழிபெயர்க்காமல் மூலத்தின் பொதுவான சொல்லைத் தக்கவைக்கிறது.
- source_word: וְאַתִּי אָלִית
  choice: நீ சாபமிட்டு
  rationale: אלה என்பது ஆணையையோ சாபத்தையையோ குறிக்கலாம். காணாமற்போன வெள்ளி மற்றும் தாயின் உடனடி ஆசீர்வாதம் ஆகிய சூழலில் ‘சாபமிட்டு’ என்பது அதிகம் பொருந்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְגַם אָמַרְתְּ בְּאָזְנַי
  choice: அதை என் காதுபடவும் சொன்னாயே
  rationale: ‘என் காதுகளில் சொன்னாய்’ என்ற எபிரெய மரபுத்தொடரின் உருவகத் தன்மையை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் குறியை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַכֶּסֶף אִתִּי
  choice: அந்த வெள்ளி என்னிடம்தான் இருக்கிறது
  rationale: ‘வெள்ளி என்னுடன் இருக்கிறது’ என்ற மூல அமைப்பைப் பின்பற்றி, ஒப்புதலின் வலியுறுத்தலை ‘தான்’ வெளிப்படுத்துகிறது.
- source_word: אֲנִי לְקַחְתִּיו
  choice: நான்தான் அதை எடுத்தேன்
  rationale: வெளிப்படையாக இடப்பட்ட אֲנִי என்ற தனிப்பெயரின் வலியுறுத்தலை தமிழின் ‘நான்தான்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּרוּךְ בְּנִי לַיהוָה
  choice: என் மகன் யாவேவால் ஆசீர்வதிக்கப்படுவானாக
  rationale: சுருக்கமான எபிரெய ஆசீர்வாத வாய்பாட்டை இயல்பான தமிழில் விருப்பவினை வடிவில் தருகிறது; לַיהוָה என்பதிலுள்ள முகமை/உறவு நுணுக்கம் தெளிவாகத் தீராததால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரை ஒரு பட்டமாக மாற்றாமல், எபிரெய உடன்படிக்கைப் பெயரின் தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயரே உள்ளது. எனவே ஒரு பட்டத்தால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: לַיהוָה உடன் வரும் ஆசீர்வாத வாய்பாடு
  choice: யாவேவால் ஆசீர்வதிக்கப்படுவானாக
  alternative: யாவேக்கு ஆசீர்வதிக்கப்பட்டவனாக இருப்பானாக
  rationale: לְ என்ற முன்னிடைச்சொல் முகமை அல்லது உறவைக் குறிக்கக்கூடிய சுருக்கமான வாய்பாடு இது. தமிழில் இயல்பான ஆசீர்வாதமாக முகமைப் பொருள் முதன்மைப்படுத்தப்பட்டாலும், மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘என் காதுபட’, ‘இதோ’, ‘நான்தான்’ ஆகியவை மூலத்தின் உரையாடல் வலிமையையும் வலியுறுத்தலையும் இயல்பாகக் காக்கின்றன; ‘யாவே’ இறைப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
