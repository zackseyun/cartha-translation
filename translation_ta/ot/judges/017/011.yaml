  yaml_path: translation/ot/judges/017/011.yaml
  text: So the Levite agreed to stay with the man[b][a], and the young man became like one of his sons to him.
translation:
  language: ta
  text: எனவே, அந்த லேவியன் அந்த மனிதனுடன் தங்கியிருக்கச் சம்மதித்தான்[a]. அந்த இளைஞன் அந்த மனிதனுக்கு அந்த மனிதனுடைய மகன்களில் ஒருவனைப்போல் ஆனான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்த மனிதனுடன் தங்கியிருக்க விரும்பினான்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘அந்த இளைஞன் அவனுக்கு அவனுடைய மகன்களில் ஒருவனைப்போல் ஆனான்.’ இங்கு இரு ‘அவன்’ என்பவையும் அந்த மனிதனைக் குறிக்கின்றன; லேவியன் அவரது வீட்டாரில் ஒருவரைப் போன்ற நிலையைப் பெற்றதை இது காட்டுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: சம்மதித்தான்
  rationale: הואיל/יאל என்பதன் இப்பயன்பாடு விருப்பத்துடன் இணங்குதல் அல்லது சம்மதித்தலைக் குறிக்கிறது; சூழலில் மீகாவின் அழைப்பை லேவியன் ஏற்றுக்கொண்டதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַלֵּוִי
  choice: அந்த லேவியன்
  rationale: முன்னரே அறிமுகப்படுத்தப்பட்ட குறிப்பிட்ட லேவியனைக் குறிக்கும் வரையறுக்கப்பட்ட பெயர்ச்சொல்.
- source_word: לָשֶׁבֶת
  choice: தங்கியிருக்க
  rationale: ישׁב என்பது உட்காருதல், குடியிருத்தல், தங்குதல் ஆகிய பொருள்களைக் கொண்டது; இங்கு ஒருவருடைய வீட்டில் தொடர்ந்து வசிப்பதைக் குறிக்கும் வகையில் ‘தங்கியிருக்க’ இயல்பாக உள்ளது.
- source_word: אֶת הָאִישׁ
  choice: அந்த மனிதனுடன்
  rationale: ישׁב உடன் வரும் אֶת இங்கு உடனிருப்பு அல்லது தொடர்பைக் குறிக்கிறது; தமிழில் ‘உடன்’ இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַיְהִי
  choice: ஆனான்
  rationale: היה இங்கு அதன் பின்விளைவாக ஏற்பட்ட நிலையைச் சுட்டலாம்; ‘ஆனான்’ மாற்றம் அல்லது புதிய உறவுநிலையைப் பாதுகாக்கிறது.
- source_word: הַנַּעַר
  choice: அந்த இளைஞன்
  rationale: נַעַר என்பது சிறுவன் முதல் இளைஞன் அல்லது பணியாள் வரை குறிக்கலாம்; தனியாகச் செயல்படும் இந்த லேவியனுக்கு ‘இளைஞன்’ பொருத்தமானது.
- source_word: כְּאַחַד מִבָּנָיו
  choice: அவனுடைய மகன்களில் ஒருவனைப்போல்
  rationale: כְּ என்ற ஒப்புமைக் குறியையும் ‘அவனுடைய மகன்களில் ஒருவன்’ என்ற குடும்ப உறவுக்கு ஒப்பான நிலையையும் நேரடியாகப் பாதுகாக்கிறது.
