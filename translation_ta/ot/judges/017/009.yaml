  source_fidelity: மூல எபிரெயத்தின் உரையாடல் அமைப்பும் பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன. מֵאַיִן என்பதற்கு “நீ எங்கிருந்து வருகிறாய்?” இயல்பானது; லேவிய அடையாளம், யூதாவிலுள்ள பெத்லெகேம், மேலும் எங்கு இடம் கிடைக்குமோ அங்கு தற்காலிகக் குடியிருப்பு தேடும் நோக்கம் ஆகியவை அனைத்தும் சரியாக வெளிப்படுகின்றன. எபிரெயத்தில் மறைந்துள்ள ‘இடம்’ தமிழின் தெளிவுக்காகச் சேர்க்கப்பட்டிருப்பது நியாயமானது.
  naturalness: நவீன நிலையான தமிழில் உரையாடல் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. “அவனை நோக்கி” மற்றும் “அதற்கு அவன்” ஆகியவை சற்றே இலக்கியத் தன்மை கொண்டவை என்றாலும், பொதுவாசிப்பிற்குத் தடையல்ல; பதிவு முழுப் பகுதியில் இயல்பாக உள்ளது.
  terminology: “லேவியன்” என்பது நிலையான வேதாகமப் பயன்பாடு. “யூதாவிலுள்ள பெத்லெகேம்” புவியியல் வேறுபாட்டைத் தெளிவுபடுத்துகிறது. “தற்காலிகமாகக் குடியிருக்க” என்பது לָגוּר-இன் தங்குதல்/அந்நியக் குடியிருப்பு நுணுக்கத்தை முறையற்ற அளவு விரிவுபடுத்தாமல் சரியாகத் தருகிறது.
