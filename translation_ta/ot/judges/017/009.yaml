base_translation:
  language: en
  yaml_path: translation/ot/judges/017/009.yaml
  text: Micah said to him[a], “Where do you come from?” And he said to him, “I am a Levite from Bethlehem in Judah, and I am going to sojourn wherever I may find a place.”
translation:
  language: ta
  text: மீகா அவனை நோக்கி, “நீ எங்கிருந்து வருகிறாய்?” என்று கேட்டான். அதற்கு அவன், “நான் யூதாவிலுள்ள பெத்லெகேமைச் சேர்ந்த ஒரு லேவியன். எங்கு இடம் கிடைக்கிறதோ அங்கு தற்காலிகமாகக் குடியிருக்கப் போகிறேன்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தற்காலிகமாகக் குடியிருக்க’ என்பதற்கான எபிரெய வினை, ஒருவருக்குச் சொந்தமான நிரந்தர இடத்தில் வாழ்வதைவிட, அந்நியராகவோ பிறரைச் சார்ந்திருப்பவராகவோ ஒரு காலம் தங்கும் பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן
  choice: நீ எங்கிருந்து வருகிறாய்?
  rationale: தோற்ற இடத்தை விசாரிக்கும் எபிரெயக் கேள்வியை இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: לֵוִי
  choice: ஒரு லேவியன்
  rationale: லேவி கோத்திரத்தைச் சேர்ந்தவர் என்ற அடையாளத்தைத் தெளிவாகக் குறிக்கிறது; தன்னை அறிமுகப்படுத்தும் தமிழ் வாக்கியத்தில் ‘ஒரு’ இயல்பாக உள்ளது.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: யூதாவிலுள்ள பெத்லெகேமைச் சேர்ந்த
  rationale: இது யூதா பிரதேசத்திலுள்ள பெத்லெகேம் என்பதைத் தெளிவுபடுத்தி, தமிழில் இயல்பான ஊர்சார் அடையாளமாக வழங்குகிறது.
- source_word: הֹלֵךְ
  choice: போகிறேன்
  rationale: நடைபெற்றுக்கொண்டிருக்கும் அல்லது உடனடி நோக்கத்தைக் குறிக்கும் எபிரெயப் பங்கேற்பு வடிவத்தை எளிய நிகழ்காலத் தமிழில் தருகிறது.
- source_word: לָגוּר
  choice: தற்காலிகமாகக் குடியிருக்க
  rationale: גור என்பதில் உள்ள நிரந்தர உரிமையின்றி, அந்நியர் அல்லது சார்ந்திருப்பவர் போல ஒரு காலம் வசிக்கும் நுணுக்கத்தை, பழமையான சொல்லாட்சி இன்றி வாசகருக்குப் புரியுமாறு தருகிறது.
- source_word: בַּאֲשֶׁר אֶמְצָא
  choice: எங்கு இடம் கிடைக்கிறதோ அங்கு
  rationale: எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாகக் கூறப்படவில்லை; தமிழில் வாக்கியம் இயல்பாக அமைய ‘இடம்’ சேர்க்கப்பட்டுள்ளது. திறந்த முடிவுடைய தேடல் என்ற கருத்தும் காக்கப்படுகிறது.
