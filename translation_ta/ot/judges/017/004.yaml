  text: וַ/יָּ֥שֶׁב אֶת הַ/כֶּ֖סֶף לְ/אִמּ֑/וֹ וַ/תִּקַּ֣ח אִמּ/וֹ֩ מָאתַ֨יִם כֶּ֜סֶף וַ/תִּתְּנֵ֣/הוּ לַ/צּוֹרֵ֗ף וַֽ/יַּעֲשֵׂ֨/הוּ֙ פֶּ֣סֶל וּ/מַסֵּכָ֔ה וַ/יְהִ֖י בְּ/בֵ֥ית מִיכָֽיְהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/004.yaml
  text: So he returned the silver to his mother[a], and his mother took two hundred pieces of silver and gave it to the silversmith, and he made it into a carved image and a cast image[c][b], and it was in the house of Micah.
translation:
  language: ta
  text: அவன் அந்த வெள்ளியைத் தன் தாயிடம் திருப்பிக் கொடுத்தான். அவனுடைய தாய் இருநூறு வெள்ளித் துண்டுகளை[a] எடுத்து, அவற்றை வெள்ளிக் கொல்லனிடம் கொடுத்தாள். அவன் அதைக் கொண்டு செதுக்கப்பட்ட ஓர் உருவத்தையும் வார்க்கப்பட்ட ஓர் உருவத்தையும்[b] செய்தான். அது[c] மீகாவின் வீட்டில் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இருநூறு வெள்ளிச் சேக்கல்களை.’ இந்த வசனத்தின் எபிரெய மூலத்தில் அலகு வெளிப்படையாகக் குறிப்பிடப்படாமல், ‘இருநூறு வெள்ளி’ என்று மட்டுமே உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘செதுக்கிய ஓர் உருவத்தையும் உருக்கி வார்த்த ஓர் உருவத்தையும்.’
    reason: lexical_alternative
  - marker: c
    text: ‘செதுக்கப்பட்ட ஓர் உருவத்தையும் வார்க்கப்பட்ட ஓர் உருவத்தையும்’ என்பதற்குப் பின் எபிரெயத்தில் ‘அது இருந்தது’ என்ற ஒருமை வினை வருகிறது; செய்யப்பட்ட பொருளையோ அவற்றின் தொகுதியையோ ஒன்றாகக் கருதுவது இதற்குக் காரணமாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: திருப்பிக் கொடுத்தான்
  rationale: שוב என்பதன் ஹிப்இல் வடிவம் வெள்ளியை அதன் முந்தைய உரிமையாளரிடம் மீண்டும் கொடுத்ததைச் சுட்டுகிறது; நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַכֶּסֶף
  choice: அந்த வெள்ளி
  rationale: כֶּסֶף என்பது ‘வெள்ளி’ அல்லது ‘பணம்’ எனப் பொருள்படலாம். இங்கு உலோகக் கைவினைப் பொருள் செய்யப்படுவதால் ‘வெள்ளி’ என்ற நேரடியான பொருள் ஏற்றது.
- source_word: מָאתַיִם כֶּסֶף
  choice: இருநூறு வெள்ளித் துண்டுகள்
  rationale: எபிரெயத்தில் எண்ணிக்கையும் ‘வெள்ளி’ என்பதும் மட்டுமே உள்ளன; அலகு வெளிப்படையாகக் கூறப்படவில்லை. ‘துண்டுகள்’ என்பது தமிழில் வாசிக்க இயல்பாக இருந்து, ‘சேக்கல்’ என்பதை மூலத்தில் இல்லாமல் உறுதியாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: לַצּוֹרֵף
  choice: வெள்ளிக் கொல்லனிடம்
  rationale: צֹרֵף என்பது உலோகத்தை உருக்கிச் சுத்திகரிப்பவர் அல்லது உலோகக் கைவினைஞர். இங்கு வெள்ளி பயன்படுத்தப்படுவதால் ‘வெள்ளிக் கொல்லன்’ சூழலுக்கு ஏற்ற இயல்பான தமிழ்ச் சொல்.
- source_word: וַיַּעֲשֵׂהוּ
  choice: அவன் அதைக் கொண்டு ... செய்தான்
  rationale: மூன்றாம் ஆண்பால் ஒருமை வினையின் எழுவாய் இயல்பாக வெள்ளிக் கொல்லன்; ஒருமைப் பொருட்சுட்டு வெள்ளியைக் குறிக்கிறது. ‘அதைக் கொண்டு’ என்பது மாற்றி உருவாக்கும் கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פֶּסֶל
  choice: செதுக்கப்பட்ட ஓர் உருவம்
  rationale: פֶּסֶל என்பது பொதுவாகச் செதுக்கப்பட்ட வழிபாட்டு உருவத்தைக் குறிக்கிறது. ‘சிலை’ அல்லது ‘விக்கிரகம்’ என்பதைக் காட்டிலும் ‘உருவம்’ மூலத்தின் சொல்லாட்சியைத் தக்கவைத்து, கூடுதல் கண்டனப் பொருளைச் சேர்க்காது.
- source_word: וּמַסֵּכָה
  choice: வார்க்கப்பட்ட ஓர் உருவம்
  rationale: מַסֵּכָה என்பது உருக்கிய உலோகத்தை அச்சில் வார்த்து செய்யப்பட்ட உருவம். ‘வார்க்கப்பட்ட உருவம்’ நவீனத் தமிழில் தொழில்முறையைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיְהִי בְּבֵית מִיכָיְהוּ
  choice: அது மீகாவின் வீட்டில் இருந்தது
  rationale: முந்தைய இணைச்சொற்களுக்குப் பிறகும் எபிரெய வினை ஒருமையில் உள்ளது. தமிழிலும் ‘அது’ என்று ஒருமையைப் பேணி, உருவாக்கப்பட்ட பொருள் அல்லது தொகுதி ஒன்றாகக் கருதப்படும் மூலத்தின் இலக்கண அழுத்தத்தைத் தக்கவைக்கிறது.
- source_word: מִיכָיְהוּ
  choice: மீகா
  rationale: நியாயாதிபதிகள் நூலில் இப்பெயருக்குப் பயன்படும் இயல்பான தமிழ் வடிவம் ‘மீகா’.
theological_decisions:
- issue: פֶּסֶל וּמַסֵּכָה என்பதை வெளிப்படையாகக் கண்டிக்கும் சொல்லால் மொழிபெயர்க்க வேண்டுமா
  choice: செதுக்கப்பட்ட ஓர் உருவத்தையும் வார்க்கப்பட்ட ஓர் உருவத்தையும்
  alternative: ஒரு விக்கிரகத்தையும் வார்ப்புச் சிலையையும்
  rationale: பெரிய இலக்கியச் சூழலில் இவை தவறான வழிபாட்டுப் பொருட்கள் என்பது தெளிவானாலும், இவ்வசனத்தின் பெயர்ச்சொற்களை அதைவிட வலுவான சமயத் தீர்ப்பாக விரிவுபடுத்தாமல் மொழிபெயர்ப்பது மூலத்தின் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: இரண்டு பெயர்ச்சொற்களுக்குப் பின் வரும் ஒருமை வினையை எவ்வாறு கையாளுவது
  choice: அது ... இருந்தது
  alternative: அவை ... இருந்தன
  rationale: எபிரெயத்தில் וַיְהִי ஒருமையில் உள்ளது. இரண்டு உருவங்கள் என வாசிக்கக்கூடிய சொல்லாட்சிக்கும், அவற்றை ஒரு பொருள் அல்லது ஒரே தொகுதியாகக் கருதும் ஒருமை வினைக்கும் இடையிலான உண்மையான தெளிவின்மையைத் தீர்த்துவிடாமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கொண்டுள்ளது. ‘வெள்ளிக் கொல்லன்,’ ‘செதுக்கப்பட்ட உருவம்,’ ‘வார்க்கப்பட்ட உருவம்’ ஆகியவை தொழில்நுட்பத் துல்லியத்தையும் இயல்பான வாசிப்பையும் சமநிலைப்படுத்துகின்றன. மூலத்தில் உள்ள ஒருமை–இருமைப் பதற்றம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
