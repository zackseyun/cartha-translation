- from: மீகா அவனிடம், “என்னோடு தங்கியிருந்து, எனக்குத் தந்தையாகவும் ஆசாரியனாகவும் இரு. நான் உனக்கு ஆண்டுக்கு வெள்ளித் துண்டுகள் பத்தும்[a], ஓர் உடைத் தொகுப்பும்[b], உன் வாழ்வாதாரத்தையும் கொடுப்பேன்” என்றான். பின்னர் அந்த லேவியன் சென்றான்[c].
  to: மீகா அவனிடம், “என்னோடு தங்கியிருந்து, எனக்குத் தந்தையாகவும் ஆசாரியனாகவும் இரு. நான் உனக்கு ஆண்டுக்கு பத்து வெள்ளியும்[a], ஓர் உடைத் தொகுப்பும்[b], உனக்கான பராமரிப்பும் கொடுப்பேன்” என்றான். அந்த லேவியன் சென்றான்[c].
