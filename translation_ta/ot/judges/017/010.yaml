  text: וַ/יֹּאמֶר֩ ל֨/וֹ מִיכָ֜ה שְׁבָ֣/ה עִמָּדִ֗/י וֶֽ/הְיֵה לִ/י֮ לְ/אָ֣ב וּ/לְ/כֹהֵן֒ וְ/אָנֹכִ֨י אֶֽתֶּן לְ/ךָ֜ עֲשֶׂ֤רֶת כֶּ֨סֶף֙ לַ/יָּמִ֔ים וְ/עֵ֥רֶךְ בְּגָדִ֖ים וּ/מִחְיָתֶ֑/ךָ וַ/יֵּ֖לֶךְ הַ/לֵּוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/010.yaml
  text: Micah said to him[a], “Stay with me, and be a father and a priest to me, and I will give you ten pieces of silver a year, a set of clothes[c][b], and your living.” So the Levite went in.
translation:
  language: ta
  text: மீகா அவனிடம், “என்னோடு தங்கியிருந்து, எனக்குத் தந்தையாகவும் ஆசாரியனாகவும் இரு. நான் உனக்கு ஆண்டுக்கு பத்து வெள்ளியும்[a], ஓர் உடைத் தொகுப்பும்[b], உனக்கான பராமரிப்பும் கொடுப்பேன்” என்றான். அந்த லேவியன் சென்றான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல் ‘வெள்ளி பத்து’; அதன் அலகு குறிப்பிடப்படவில்லை. ‘பத்து சேக்கல் வெள்ளி’ என்பது வழக்கமான விளக்க மொழிபெயர்ப்பு.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உடைகளுக்கான ஓர் ஒதுக்கீடும்.’
    reason: lexical_alternative
  - marker: c
    text: எபிரெய வினைச்சொல் வெறுமனே ‘சென்றான்’ என்கிறது. சூழலில், அவன் மீகாவின் வீட்டுக்குள் சென்றான் அல்லது அவனுடன் சேர்ந்துகொண்டான் என்ற பொருள் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה עִמָּדִי
  choice: என்னோடு தங்கியிருந்து
  rationale: ישב என்பதன் கட்டளை வடிவம் இச்சூழலில் மீகாவுடன் தொடர்ந்து வசிக்கும்படியான அழைப்பைக் குறிக்கிறது; ‘தங்கியிருந்து’ என்பது இயல்பான நவீனத் தமிழில் அந்த நீடித்த பொருளைத் தருகிறது.
- source_word: לְאָב
  choice: தந்தையாக
  rationale: இது உடல்சார்ந்த தந்தைத்துவத்தைக் குறிக்காமல் மரியாதை மற்றும் சமய ஆலோசனையுடன் தொடர்புடைய உருவகப் பதவியைக் குறிக்கிறது; மூலத்தின் குடும்ப உருவகம் அப்படியே வைக்கப்படுகிறது.
- source_word: וּלְכֹהֵן
  choice: ஆசாரியனாகவும்
  rationale: כֹהֵן என்பது வழிபாட்டுப் பணியாற்றும் ஆசாரியனைக் குறிக்கிறது; ‘தந்தையாகவும்’ என்பதுடன் இணையான இலக்கண அமைப்பு பேணப்படுகிறது.
- source_word: עֲשֶׂרֶת כֶּסֶף
  choice: வெள்ளித் துண்டுகள் பத்தும்
  rationale: எபிரெயத்தில் வெள்ளியின் அலகு குறிப்பிடப்படவில்லை. தமிழில் பொருள் விளங்க ‘துண்டுகள்’ பயன்படுத்தப்பட்டாலும், ‘சேக்கல்’ என்ற குறிப்பிடப்படாத அலகு சேர்க்கப்படவில்லை; இதற்கான தெளிவுரை அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַיָּמִים
  choice: ஆண்டுக்கு
  rationale: ‘நாட்களுக்காக’ என்ற சொற்றொடர் இங்கு ஆண்டுதோறும் வழங்கப்படும் ஊதியத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர்; ‘ஆண்டுக்கு’ என்பது இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: וְעֵרֶךְ בְּגָדִים
  choice: ஓர் உடைத் தொகுப்பும்
  rationale: இந்த அரிதான சொற்றொடர் உடைகளுக்கான ஏற்பாடு, மதிப்பு அல்லது ஒதுக்கீட்டைக் குறிக்கலாம். ‘உடைத் தொகுப்பு’ concrete பொருளை இயல்பாகத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பேணப்படுகிறது.
- source_word: וּמִחְיָתֶךָ
  choice: உன் வாழ்வாதாரத்தையும்
  rationale: מִחְיָה உணவு மட்டும் அல்லாமல் வாழ்க்கைக்குத் தேவையான பராமரிப்பு அல்லது ஆதரவையும் குறிக்கக்கூடும்; ‘வாழ்வாதாரம்’ அந்த விரிந்த பொருளைப் பேணுகிறது.
- source_word: וַיֵּלֶךְ הַלֵּוִי
  choice: பின்னர் அந்த லேவியன் சென்றான்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘சென்றான்’ என்பதே. வீட்டுக்குள் சென்றான் அல்லது மீகாவுடன் சேர்ந்தான் என்று சூழல் உணர்த்தக்கூடியிருந்தாலும், அது முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: ஒழுங்கற்ற வழிபாட்டுச் சூழலில் ‘தந்தை’ என்ற மரியாதைப் பெயர்
  choice: ‘தந்தை’ என்ற உருவகத்தை அப்படியே வைத்தல்
  alternative: ஆலோசகர் / சமயத் தலைவர்
  rationale: மூல எபிரெயம் குடும்ப உருவகத்தையே வெளிப்படையாகப் பயன்படுத்துகிறது. அதை மாற்றாமல் வைப்பது அந்தச் சமூக-சமயப் பங்கையும் கதையிலுள்ள பதற்றத்தையும் பேணுகிறது; பிற்கால திருச்சபைச் சொற்பயன்பாடு எதுவும் இறக்குமதி செய்யப்படவில்லை.
- issue: வெள்ளியின் குறிப்பிடப்படாத அலகு
  choice: முதன்மை உரையில் ‘சேக்கல்’ என்று குறிப்பிடாதிருத்தல்
  alternative: பத்து சேக்கல் வெள்ளி
  rationale: மூலத்தில் எடை அல்லது நாணய அலகு வெளிப்படையாக இல்லை. ஆகவே மரபான ஊகத்தை முதன்மை உரையில் சேர்க்காமல், தெளிவின்மையை அடிக்குறிப்புடன் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘ஆசாரியன்’, ‘லேவியன்’ ஆகியவை வேதாகமச் சூழலுக்குரிய தெளிவான பதங்களாக வைக்கப்பட்டுள்ளன. மூலத்தில் இல்லாத வெள்ளி அலகும், ‘சென்றான்’ என்பதற்கான சூழல் விரிவாக்கமும் முதன்மை உரையில் சேர்க்கப்படவில்லை.
