source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל אִ֛ישׁ הַ/יָּשָׁ֥ר בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/006.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: ta
  text: அந்த நாட்களில் இஸ்ரவேலில் அரசன் இல்லை; ஒவ்வொருவனும்[a] தன் பார்வையில் சரியானதைச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அனைவரும் தங்கள் பார்வையில் சரியானதைச் செய்தார்கள்.” எபிரெயத்தில் ஆண்பால் ஒருமையான “மனிதன்” என்ற சொல் பிரதிநிதித்துவப் பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: அந்த நாட்களில்
  rationale: எபிரெயக் கதைநடையில் வரும் வழக்கமான காலக் குறிப்பை இயல்பான, dignified modern Tamil-இல் நேரடியாகக் காக்கிறது.
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில் அரசன் இல்லை
  rationale: אֵין குறிக்கும் இல்லாமையைத் தெளிவாகச் சொல்கிறது; மூலத்தில் இல்லாத அரசியல் அல்லது இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: אִישׁ
  choice: ஒவ்வொருவனும்
  rationale: ஆண்பால் ஒருமைச் சொல்லின் பிரதிநிதித்துவப் பயன்பாட்டையும் அதன் பகிர்வுப் பொருளான ‘ஒவ்வொருவரும்’ என்பதையும் தமிழில் காக்கிறது.
- source_word: הַיָּשָׁר
  choice: சரியானதை
  rationale: יָשָׁר என்பதன் ‘நேரானது/சரியானது’ என்ற மதிப்பீட்டுப் பொருளை இச்சொற்றொடரில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּעֵינָיו
  choice: தன் பார்வையில்
  rationale: சொல்லுக்குச் சொல் ‘தன் கண்களில்’ என்பதற்குப் பதிலாக, தனிப்பட்ட மதிப்பீட்டைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יַעֲשֶׂה
  choice: செய்தான்
  rationale: வடிவத்தில் imperfect என்றாலும், இங்கு கடந்தகால வழக்கச் செயலைச் சுருக்கமாகக் குறிக்கிறது; ‘ஒவ்வொருவனும்’ என்பதே அதன் மீளும் இயல்பைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: இஸ்ரவேலின் நிலையை விவரிக்கும் உரையாளர் மதிப்பீடு, ஆனால் அரசாட்சியே முழுமையான இறையியல் தீர்வு என்று வெளிப்படையாகக் கூறாதிருத்தல்
  choice: வசனத்தை நேரடியான வரலாற்று விவரிப்பாக மொழிபெயர்த்து, ‘தன் பார்வையில் சரியானதை’ என்ற மரபுத்தொடரிலுள்ள எதிர்மறை மதிப்பீட்டை அப்படியே ஒலிக்கவிடுதல்
  alternative: இதை நடுநிலையான அரசியல் குறிப்பாக மட்டும் மொழிபெயர்த்தல், அல்லது அரசாட்சியே அவசியமான தீர்வு என்று விரிவுபடுத்தல்
  rationale: நியாயாதிபதிகள் நூலில் மீண்டும் வரும் இவ்வாக்கியம் சமூக மற்றும் சமயச் சீர்கேட்டை இலக்கிய ரீதியில் மதிப்பிடுகிறது. ஆயினும் இந்த வசனம் அரசாட்சியைப் பற்றிய முழுமையான கோட்பாட்டைத் தானாக முன்வைக்கவில்லை; எனவே அந்த இறையியல் பதற்றம் தீர்மானிக்கப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘தன் பார்வையில்’ என்பது எபிரெய மரபுத்தொடரின் தனிப்பட்ட தீர்ப்புணர்வை இயல்பாகக் காக்கிறது.
