base_translation:
  language: en
  yaml_path: translation/ot/judges/021/016.yaml
  text: Then the elders of the congregation said[a], “What shall we do for wives for those who remain, since the women of Benjamin have been destroyed?”
translation:
  language: ta
  text: அப்போது சபையின் மூப்பர்கள், “எஞ்சியிருப்பவர்களுக்கு மனைவிகள் கிடைக்க நாம் என்ன செய்வோம்? ஏனெனில் பென்யமீனின் பெண்கள் அழிக்கப்பட்டுவிட்டார்கள்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “பென்யமீனிலிருந்து ஒரு பெண் அழிக்கப்பட்டாள்” என்று உள்ளது; இங்கு ஒருமையான “பெண்” என்பது பென்யமீனின் பெண்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעֵדָה
  choice: சபையின் மூப்பர்கள்
  rationale: கட்டுநிலைப் பன்மையான זִקְנֵי என்பதையும், கூடியிருக்கும் சமூகத்தைக் குறிக்கும் הָעֵדָה என்பதையும் இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מַה נַּעֲשֶׂה
  choice: நாம் என்ன செய்வோம்?
  rationale: முதல் நபர் பன்மை நிறைவுறா வினை இங்கு எதிர்கால நடவடிக்கை குறித்த கூட்டு ஆலோசனையை வெளிப்படுத்துகிறது.
- source_word: לַנּוֹתָרִים
  choice: மீதியிருப்பவர்களுக்கு
  rationale: படுகொலைக்குப் பின் எஞ்சியவர்களைக் குறிக்கும் பங்கேற்புவினைச் சொல்லின் பொருளை, தேவையற்ற விளக்கத்தைச் சேர்க்காமல் நெருக்கமாகக் காக்கிறது.
- source_word: לְנָשִׁים
  choice: மனைவிகள் கிடைக்க
  rationale: இந்தச் சூழலில் பெண்களைப் பொதுவாக அல்ல, திருமணத்திற்கான மனைவிகளாகப் பெறுவதையே சொற்றொடர் குறிக்கிறது; தமிழில் வாக்கியம் இயல்பாக அமைய ‘கிடைக்க’ சேர்க்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கேள்விக்கான காரணத்தை அறிமுகப்படுத்தும் காரண இடைச்சொல்லின் வலிமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: נִשְׁמְדָה
  choice: அழிக்கப்பட்டுவிட்டார்களே
  rationale: שׁמד என்பதன் நிபால் வடிவம் அழிக்கப்பட்ட நிலையைத் தெரிவிக்கிறது; ‘விட்டார்’ வடிவம் நிகழ்வின் முடிவுற்ற விளைவை உணர்த்துகிறது, ‘-ஏ’ அவர்களின் ஆலோசனைக்கான காரணத்தை இயல்பான தமிழில் வலியுறுத்துகிறது.
- source_word: מִבִּנְיָמִן אִשָּׁה
  choice: பென்யமீனின் பெண்கள்
  rationale: எபிரெயத்தில் ‘பெண்’ ஒருமை கூட்டுப்பொருளில் பயன்படுத்தப்பட்டுள்ளது; தமிழில் நோக்கப்பட்ட பொருளைத் தெளிவாக்கப் பன்மையாக மொழிபெயர்க்கப்பட்டுள்ளது.
