translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இஸ்ரவேல் மக்கள்’ பாலினப் பொருள் குழப்பத்தைத் தவிர்க்கிறது; ‘வெட்டுண்டுபோயிற்று’ மூலமொழியின் உருவகத்தைப் பாதுகாக்கிறது. அடிக்குறி [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
