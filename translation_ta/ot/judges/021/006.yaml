  text: וַ/יִּנָּֽחֲמוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל בִּנְיָמִ֖ן אָחִ֑י/ו וַ/יֹּ֣אמְר֔וּ נִגְדַּ֥ע הַ/יּ֛וֹם שֵׁ֥בֶט אֶחָ֖ד מִ/יִּשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/006.yaml
  text: And the sons of Israel grieved over Benjamin their brother[a], and they said, “Today one tribe has been cut off from Israel.”
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் தங்கள் சகோதரனான பென்யமீனுக்காக மனம் வருந்தி[a], “இன்று இஸ்ரவேலிலிருந்து ஒரு கோத்திரம் வெட்டுண்டுபோயிற்று” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் சகோதரனான பென்யமீன்மேல் இரக்கங்கொண்டார்கள்’ அல்லது ‘தங்கள் சகோதரனான பென்யமீனுக்காக வருத்தப்பட்டார்கள்.’ எபிரெய வினைச்சொல் சூழலுக்கேற்ப துயரம், இரக்கம், அல்லது மனம் மாறுதல் ஆகியவற்றை வெளிப்படுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֲמוּ
  choice: மனம் வருந்தி
  rationale: נחם என்பதன் நிஃபால் வடிவம் இச்சூழலில் துயரம், இரக்கம், அல்லது மனமாற்றம் ஆகிய பொருள் நிழல்களைக் கொண்டுள்ளது. பென்யமீன் ஏறக்குறைய அழிந்ததை எண்ணிய துயரத்தை ‘மனம் வருந்தி’ இயல்பாக வெளிப்படுத்துகிறது; பிற பொருள் வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடர் சொற்பட ‘இஸ்ரவேலின் மகன்கள்’ என இருந்தாலும், நவீனத் தமிழில் அது ஆண் பாலரையே குறிக்கும் தவறான எண்ணத்தைத் தரக்கூடும். ‘இஸ்ரவேல் மக்கள்’ கூட்டுச் சமூகத்தைக் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: אֶל
  choice: -க்காக
  rationale: נחם உடன் வரும் אֶל இங்கு உணர்ச்சியின் இலக்கைச் சுட்டுகிறது. ‘மனம் வருந்துதல்’ என்பதுடன் ‘பென்யமீனுக்காக’ என்பது இயல்பான தமிழ்ச் சேர்க்கை.
- source_word: בִּנְיָמִן אָחִיו
  choice: தங்கள் சகோதரனான பென்யமீன்
  rationale: ‘அவனுடைய சகோதரன்’ என்ற ஒருமை பின்னொட்டு, பன்மைக் கூட்டெழுவாயோடு இணைந்து பென்யமீனை இஸ்ரவேல் மக்களின் சகோதரக் கோத்திரமாகக் காட்டுகிறது. தமிழில் கூட்டுறவைத் தெளிவுபடுத்த ‘தங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: נִגְדַּע
  choice: வெட்டுண்டுபோயிற்று
  rationale: גדע என்பதின் வெட்டுதல்/தறித்தல் உருவகத்தையும் அதன் கடுமையையும் இச்சொல் காக்கிறது; முழுமையாக அழிக்கப்பட்டது என்று தேவையின்றி விளக்குவதில்லை.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: உடனடித் தன்மையைத் தக்கவைக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: שֵׁבֶט אֶחָד
  choice: ஒரு கோத்திரம்
  rationale: இஸ்ரவேலின் தனித்த கோத்திர அலகை நேரடியாகக் குறிக்கிறது; வேதாகமச் சூழலில் ‘கோத்திரம்’ பரவலாகப் புரிந்துகொள்ளப்படும் சொல்.
- source_word: מִיִּשְׂרָאֵל
  choice: இஸ்ரவேலிலிருந்து
  rationale: தேசிய முழுமையிலிருந்து பிரிக்கப்பட்ட நிலையை מִן என்ற பிரிவுப் பொருள் இயல்பாக வெளிப்படுத்துகிறது.
