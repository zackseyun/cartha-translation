source:
  edition: WLC
  text: וְ/אִ֣ישׁ יִשְׂרָאֵ֔ל נִשְׁבַּ֥ע בַּ/מִּצְפָּ֖ה לֵ/אמֹ֑ר אִ֣ישׁ מִמֶּ֔/נּוּ לֹא יִתֵּ֥ן בִּתּ֛/וֹ לְ/בִנְיָמִ֖ן לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/001.yaml
  text: The men of Israel had sworn at Mizpah[a], saying, “No man among us shall give his daughter to Benjamin as a wife.”
translation:
  language: ta
  text: இஸ்ரவேல் ஆண்கள் மிஸ்பாவில், “நம்மில் எவனும் தன் மகளைப் பென்யமீனுக்கு[a] மனைவியாகக் கொடுக்கக் கூடாது” என்று சத்தியம் செய்திருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பென்யமீனுக்கு” என்பது இங்கு பென்யமீன் கோத்திரத்துக்கோ, அந்தக் கோத்திரத்தைச் சேர்ந்த ஒருவனுக்கோ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேல் ஆண்கள்
  rationale: אִישׁ இலக்கண வடிவில் ஒருமையாக இருந்தாலும், இங்கு இஸ்ரவேல் மக்களிலுள்ள ஆண்களை ஒரு குழுவாகக் குறிக்கிறது. வசனத் தொடக்கத்திலுள்ள וְ என்பதற்குத் தனியாக ‘மேலும்’ என்று இடுவது நவீன தமிழில் தேவையற்றதால் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
- source_word: נִשְׁבַּע
  choice: சத்தியம் செய்திருந்தார்கள்
  rationale: שׁבע என்பதன் நிபால் வடிவம் ‘சத்தியம் செய்/ஆணையிடு’ என்று பொருள்படும். அடுத்த நிகழ்வுகளுக்கு முன்னரே இந்தச் சத்தியம் செய்யப்பட்டிருந்ததை இறந்தகால நிறைவுவடிவம் இயல்பாகக் காட்டுகிறது.
- source_word: בַּמִּצְפָּה
  choice: மிஸ்பாவில்
  rationale: சத்தியம் செய்யப்பட்ட இடத்தை இயல்பான தமிழ் இடவேற்றுமை உருபுடன் குறிக்கிறது.
- source_word: לֵאמֹר
  choice: என்று
  rationale: மேற்கோளின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெயச் சொல்லுக்கு இயல்பான தமிழ் மேற்கோள் இணைப்பு.
- source_word: אִישׁ מִמֶּנּוּ
  choice: நம்மில் எவனும்
  rationale: ஒவ்வொரு ஆணையும் தனித்தனியாக உள்ளடக்கும் பகிர்வுப் பொருளையும் மூலத்தின் பாலினக் குறிப்பையும் காக்கிறது.
- source_word: לֹא יִתֵּן
  choice: கொடுக்கக் கூடாது
  rationale: சத்தியத்தின் கட்டுப்படுத்தும் எதிர்மறை உறுதியைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது; இது வெறும் எதிர்கால முன்னறிவிப்பு அல்ல.
- source_word: בִּתּוֹ
  choice: தன் மகளை
  rationale: எழுவாயையே திரும்பக் குறிக்கும் உடைமைப் பொருளைத் தமிழில் ‘தன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְבִנְיָמִן
  choice: பென்யமீனுக்கு
  rationale: மூலத்திலுள்ள ஒருமை இயற்பெயரை நெருக்கமாகக் காக்கிறது; சூழலில் அது பென்யமீன் கோத்திரத்தையோ அந்தக் கோத்திரத்தைச் சேர்ந்த ஒருவனையோ குறிக்கலாம்.
- source_word: לְאִשָּׁה
  choice: மனைவியாக
  rationale: ஒரு பெண்ணைத் திருமணம் செய்து கொடுப்பதன் நோக்கத்தையும் அவள் மனைவியாவதையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
