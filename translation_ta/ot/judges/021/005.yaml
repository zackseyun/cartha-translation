  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ֠י אֲשֶׁ֨ר לֹא עָלָ֧ה בַ/קָּהָ֛ל מִ/כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה כִּי֩ הַ/שְּׁבוּעָ֨ה הַ/גְּדוֹלָ֜ה הָיְתָ֗ה לַ֠/אֲשֶׁר לֹא עָלָ֨ה אֶל יְהוָ֧ה הַ/מִּצְפָּ֛ה לֵ/אמֹ֖ר מ֥וֹת יוּמָֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/005.yaml
  text: And the sons of Israel said[a], “Who is there from all the tribes of Israel who did not come up to Yahweh in the assembly?” For the great oath had been made concerning whoever did not come up to Yahweh at Mizpah, saying[b], “He shall surely be put to death.”
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள்[a], “இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலும், சபையில் யாவேயிடம் கூடிவராதவர் யார்?” என்று சொன்னார்கள். ஏனெனில், மிஸ்பாவில் யாவேயிடம் கூடிவராத எவரைக் குறித்தும், “அவர் நிச்சயமாகக் கொல்லப்பட வேண்டும்” என்று மாபெரும் சத்தியப்பிரமாணம் செய்யப்பட்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு இஸ்ரவேல் சமூகத்தை ஒட்டுமொத்தமாகக் குறிக்கும் எபிரெய மரபுத்தொடர். நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க ‘இஸ்ரவேல் மக்கள்’ என மொழிபெயர்க்கப்பட்டது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מִי אֲשֶׁר לֹא עָלָה
  choice: கூடிவராதவர் யார்?
  rationale: עָלָה என்பதன் அடிப்படைப் பொருள் ‘ஏறிவருதல்/மேலே செல்லுதல்.’ இச்சூழலில் புனிதக் கூட்டத்திற்கு வருதலைக் குறிக்கும் என்பதால் தமிழில் இயல்பான ‘கூடிவருதல்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בַקָּהָל
  choice: சபைக்கு
  rationale: קהל என்பது கூடியிருந்த சமூகப் பேரவையைக் குறிக்கிறது. திருச்சபை சார்ந்த தனிப்பொருளைத் திணிக்காமல், சூழலில் மக்கள் கூடுகையைச் சுட்ட ‘சபை’ பயன்படுத்தப்பட்டது.
- source_word: אֶל יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: சொற்படி ‘யாவேயிடம்/யாவேக்கு’ என்றாலும், யாவேக்காக மிஸ்பாவில் கூடிய சபையின் சூழலை நவீன தமிழில் தெளிவாக வெளிப்படுத்த ‘யாவே முன்னிலையில்’ என வழங்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதத்தில் வரும் இறைபெயரான יהוה-ஐ ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு வடிவில் வழங்குகிறது.
- source_word: הַשְּׁבוּעָה הַגְּדוֹלָה
  choice: மிகக் கடுமையான சத்தியப்பிரமாணம்
  rationale: சொற்படி ‘பெரிய சத்தியம்.’ தமிழில் அதன் தீவிரமான, கட்டுப்படுத்தும் சட்டப்பூர்வ வலிமையை இயல்பாகக் காட்ட ‘மிகக் கடுமையான சத்தியப்பிரமாணம்’ எனப்பட்டது.
- source_word: מוֹת יוּמָת
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: வினையெச்ச முழுமையும் செயப்பாட்டு வினையும் மரணத் தீர்ப்பின் உறுதியை வலியுறுத்துகின்றன. ‘நிச்சயமாக’ வலியுறுத்தலைவும் ‘கொல்லப்பட வேண்டும்’ நீதித்தீர்ப்பு சார்ந்த செயப்பாட்டு பொருளையும் காக்கின்றன.
theological_decisions:
- issue: יהוה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைபெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது; வாசகர் உதவிக்காக அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற ஆண்பால் வடிவுடைய கூட்டு மரபுத்தொடர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இங்கு கோத்திரங்களால் அமைந்த இஸ்ரவேல் சமூகமே குறிக்கப்படுகிறது. தமிழில் ‘மகன்கள்’ என்பது ஆண்களை மட்டும் குறிக்கும் தவறான எண்ணத்தை ஏற்படுத்தக்கூடும்; எனவே இயல்பான கூட்டுப் பெயர் முதன்மை உரையில் வைக்கப்பட்டு, சொற்படி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- issue: מוֹת יוּמָת என்பதன் மரணத் தீர்ப்பு சார்ந்த வலிமை
  choice: அவர் நிச்சயமாகக் கொல்லப்பட வேண்டும்
  alternative: அவர் நிச்சயமாகச் சாவார்
  rationale: எபிரெய வடிவம் வெறும் மரண முன்னறிவிப்பாக அல்லாமல், சமூகத்தால் நிறைவேற்றப்படும் செயப்பாட்டு மரணத் தீர்ப்பைச் சுட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்றுக் கதைநடைக்கு ஏற்ற கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சபை’ இங்கு திருச்சபையைக் குறிக்காமல் இஸ்ரவேலரின் பொதுக்கூட்டத்தைக் குறிக்கிறது. இறுதி வாக்கியம் மூலத்தின் கடுமையான நீதித்தீர்ப்பு வலிமையை மென்மைப்படுத்தாமல் காக்கிறது.
