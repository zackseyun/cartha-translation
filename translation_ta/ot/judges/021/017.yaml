translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூலத்தின் சுருக்கமான, வினையில்லா முதல் கூற்றைத் தமிழில் தெளிவாக்க ‘இருக்க வேண்டும்’ சேர்க்கப்பட்டுள்ளது. ‘கோத்திரம்’ என்பது வேதாகமச் சூழலில் பரவலாக அறியப்படும் சொல்; ‘பரம்பரைச் சொத்து’ நிலவுரிமை மற்றும் தலைமுறைத் தொடர்ச்சி இரண்டையும் தாங்குகிறது.
