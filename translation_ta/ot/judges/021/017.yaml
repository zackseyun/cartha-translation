base_translation:
  language: en
  yaml_path: translation/ot/judges/021/017.yaml
  text: And they said[a], “There must be an inheritance for the survivors of Benjamin, so that a tribe may not be blotted out from Israel.”
translation:
  language: ta
  text: அவர்கள்[a], “பென்யமீனின் உயிர்தப்பியவர்களுக்கு ஒரு பரம்பரைச் சொத்து இருக்க வேண்டும்; அதனால் இஸ்ரவேலிலிருந்து ஒரு கோத்திரம் அழிந்துபோகாது” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பென்யமீனுக்கு எஞ்சியோர்” அல்லது “பென்யமீனின் உயிர்தப்பியவர்களின் பரம்பரைச் சொத்து” என்றும் மொழிபெயர்க்கலாம். எபிரேயத்தில் “பரம்பரைச் சொத்து,” “உயிர்தப்பியோர்/எஞ்சியோர்” என்ற இரு பெயர்ச்சொற்களும் சுருக்கமாக அடுத்தடுத்து வருகின்றன; அவற்றுக்கிடையிலான துல்லியமான தொடர்பை ஒன்றுக்கு மேற்பட்ட இயல்பான முறைகளில் வெளிப்படுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அவர்கள் … என்றார்கள்
  rationale: אמר என்பதன் வழக்கமான தொடர்-கதை வடிவம். தமிழில் நேரடி உரையை இயல்பாகச் சூழும் வகையில் உரையின் முடிவில் ‘என்றார்கள்’ என்று அமைக்கப்பட்டது.
- source_word: יְרֻשַּׁת
  choice: ஒரு பரம்பரைச் சொத்து
  rationale: ירש வேரிலிருந்து வரும் இச்சொல் பரம்பரையாகக் கிடைக்கும் உரிமை அல்லது உடைமையைக் குறிக்கிறது. கோத்திர நிலவுரிமையும் தொடர்ச்சியும் பேசப்படும் சூழலில் ‘பரம்பரைச் சொத்து’ தெளிவாக உள்ளது.
- source_word: פְּלֵיטָה
  choice: உயிர்தப்பியவர்கள்
  rationale: அழிவிலிருந்து தப்பிப் பிழைத்தவர்களைக் குறிக்கும் சொல். இங்கு கிட்டத்தட்ட அழிக்கப்பட்ட பென்யமீன் கோத்திரத்தில் எஞ்சியவர்களை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: לְבִנְיָמִן
  choice: பென்யமீனில்
  rationale: לְ என்பதையும் அடுத்துள்ள ‘உயிர்தப்பியவர்கள்’ என்பதையும் இணைத்து, அவர்கள் பென்யமீன் கோத்திரத்தைச் சேர்ந்தவர்கள் என்ற பொருளை ‘பென்யமீனில் உயிர்தப்பியவர்கள்’ என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְלֹא יִמָּחֶה
  choice: அப்போதுதான் … அழிந்துபோகாது
  rationale: מחה என்பதன் நிஃபால் வடிவம் முற்றாக நீக்கப்படுதல் அல்லது அழிக்கப்படுதல் என்பதைக் குறிக்கிறது. சூழலில் உள்ள நோக்கம்/விளைவை ‘அப்போதுதான்’ தெளிவாக்குகிறது; ‘அழிந்துபோகாது’ கோத்திரம் இல்லாமற்போவதை இயல்பாகச் சொல்கிறது.
- source_word: שֵׁבֶט
  choice: ஒரு கோத்திரம்
  rationale: இஸ்ரவேலின் பன்னிரண்டு கோத்திரங்களில் ஒன்றைக் குறிக்கிறது. எபிரேய மொழியின் குறிப்பில்லா வடிவத்தை ‘ஒரு’ பாதுகாக்கிறது.
- source_word: מִיִּשְׂרָאֵל
  choice: இஸ்ரவேலிலிருந்து
  rationale: பிரிவு அல்லது நீக்கத்தை உணர்த்தும் מִן முன்னொட்டை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
