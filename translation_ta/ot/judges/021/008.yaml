base_translation:
  language: en
  yaml_path: translation/ot/judges/021/008.yaml
  text: And they said[a], “Which one of the tribes of Israel did not go up to Yahweh at Mizpah?” And behold, not a man from Jabesh-gilead had come to the camp[b], to the assembly.
translation:
  language: ta
  text: அப்போது அவர்கள், “இஸ்ரவேல் கோத்திரங்களில் மிஸ்பாவில் யாவேயிடம்[a] ஏறிச் செல்லாத கோத்திரம் எது?” என்று கேட்டார்கள். இதோ, யாபேஸ்-கிலேயாத்திலிருந்து ஒரு ஆண்கூட[b] பாளயத்துக்கு, கூட்டத்துக்கு வந்திருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மிஸ்பாவில் யாவேக்கு முன்பாக” என்றும் பொருள் கொள்ளலாம். இச்சொற்றொடர், கூடுகை நடைபெற்ற இடத்தில் யாவேக்கு முன்பாக வந்து நிற்பதைக் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில், “ஒரு ஆணும் இல்லை.” ஆண்பால் ஒருமை வடிவம் யாபேஸ்-கிலேயாத்தைச் சேர்ந்த ஒரு தனி ஆண்கூட அங்கே வரவில்லை என்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அப்போது அவர்கள் … என்று கேட்டார்கள்
  rationale: வழக்கமான எபிரெய கதைத் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் காட்டுகிறது; நேரடிக் கேள்வி என்பதால் ‘சொன்னார்கள்’ என்பதற்குப் பதில் ‘கேட்டார்கள்’ பொருத்தமாக உள்ளது.
- source_word: מִי אֶחָד מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் கோத்திரங்களில் … எந்தக் கோத்திரம்
  rationale: ஒரு குறிப்பிட்ட குழுவை இஸ்ரவேலின் கோத்திரங்களிலிருந்து அடையாளம் காணும் கேள்வியைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לֹא עָלָה
  choice: ஏறிவராதது
  rationale: கூடுகை அல்லது புனித இடத்தை நோக்கிச் செல்வதற்குப் பயன்படுத்தப்படும் עלה என்பதிலுள்ள ‘மேலே செல்லுதல்’ என்ற நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: אֶל יְהוָה הַמִּצְפָּה
  choice: மிஸ்பாவில் யாவேயிடம்
  rationale: אֶל என்பதன் நேரடியான திசைநோக்கையும் மிஸ்பா என்ற கூடுகை இடத்தையும் இயல்பான தமிழ் சொல்வரிசையில் தருகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கதையில் கவனத்துக்குரிய கண்டுபிடிப்பை அறிமுகப்படுத்தும் சொல்லின் உரையாடல் வலிமையைத் தக்கவைக்கிறது.
- source_word: לֹא בָא אִישׁ
  choice: ஒருவன்கூட … வந்திருக்கவில்லை
  rationale: எதிர்மறையுடன் வரும் ஆண்பால் ஒருமையைத் தக்கவைத்து, ஒரு தனி ஆண்கூட வரவில்லை என்ற வலியுறுத்தலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: מִיָּבֵישׁ גִּלְעָד
  choice: யாபேஸ்-கிலேயாத்திலிருந்து
  rationale: முன்னிடைச்சொல் காட்டும் பிறப்பிடம் அல்லது வருகையின் மூலத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: אֶל הַמַּחֲנֶה … אֶל הַקָּהָל
  choice: பாளயத்துக்கு, சபைக்கு
  rationale: இருமுறை வரும் אֶל என்பதையும், பாளயமும் அங்கு கூடிய சமூகமும் இணையாகச் சுட்டப்படுவதையும் விளக்கச் சேர்க்கையின்றி பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: אֶל יְהוָה என்பதன் பொருள்
  choice: யாவேயிடம்
  alternative: யாவேக்கு முன்பாக
  rationale: אֶל என்பதன் நேரடி திசைநோக்கை முதன்மை உரையில் வைத்தபோதும், யாவேக்கு முன்பாகக் கூடிவருதல் என்ற சூழல்சார் புரிதலை அடிக்குறிப்பில் திறந்துவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கோத்திரம்’, ‘பாளயம்’, ‘சபை’ ஆகியவை இச்சூழலின் சமூக-குடியியல் கூடுகையைத் தெளிவாகக் காட்டும் பரவலாக அறியப்பட்ட சொற்களாக வைக்கப்பட்டுள்ளன; ‘சபை’ இங்கு திருச்சபை என்ற பிற்கால நிறுவனப் பொருளில் அல்ல, கூடிய மக்கள் சமூகத்தைக் குறிக்கிறது.
