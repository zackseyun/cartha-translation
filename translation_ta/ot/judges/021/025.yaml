id: JDG.21.25
reference: Judges 21:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל אִ֛ישׁ הַ/יָּשָׁ֥ר בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/025.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: ta
  text: அந்நாட்களில் இஸ்ரவேலில் அரசன் இல்லை; ஒவ்வொருவனும் தன் பார்வையில் சரியானதைச் செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: அந்நாட்களில்
  rationale: எபிரெயக் கதைநடையில் வரும் வழக்கமான காலக் குறிப்பு; பின்னோக்கிப் பார்க்கும் தொனியை இயல்பான தமிழில் காக்கிறது.
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில் அரசன் இல்லை
  rationale: אֵין என்பதன் இருப்பின்மைப் பொருளையும், בְּיִשְׂרָאֵל என்பதன் இடம்/தேசியச் சூழலையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: אִישׁ
  choice: ஒவ்வொருவனும்
  rationale: ஆண்பால் ஒருமைச் சொல்லின் பகிர்வுப் பொருளைத் தமிழில் காக்கிறது; இங்கு ஒவ்வொரு மனிதனையும் தனித்தனியாகக் குறிக்கிறது.
- source_word: הַיָּשָׁר
  choice: சரியானதை
  rationale: பெயர்ச்சொல் போல் பயன்படுத்தப்பட்டுள்ள உரிச்சொல்லின் ‘சரியானது/நேரானது’ என்ற மதிப்பீட்டுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּעֵינָיו
  choice: தன் பார்வைக்கு
  rationale: தனிப்பட்ட மதிப்பீட்டைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவாகவும் நவீனத் தமிழுக்கு இயல்பாகவும் தருகிறது.
- source_word: יַעֲשֶׂה
  choice: செய்தான்
  rationale: வடிவில் imperfect என்றாலும், இங்கு கடந்தகாலத்தில் வழக்கமாக நிகழ்ந்த செயலைச் சுருக்கிக் கூறுகிறது; தமிழ் இறந்தகாலம் அந்தக் கதைச்சூழலை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: אִישׁ என்பதிலுள்ள ஆண்பால் பிரதிநிதித்துவ மொழி
  choice: ஒவ்வொருவனும்
  alternative: ஒவ்வொருவரும்
  rationale: மூலத்தின் ஆண்பால் ஒருமை வடிவத்தையும் அதன் பகிர்வுப் பொருளையும் காக்கிறது; அதேவேளை இது மக்களிடையே ஒவ்வொருவரையும் குறிக்கும் பொதுமைப்படுத்தப்பட்ட சொல்லாட்சி.
- issue: இந்த மறுமொழியில் உட்பொருந்தியுள்ள மதிப்பீடு
  choice: மூலத்தில் உள்ளபடியே ‘தன் பார்வைக்குச் சரியானதைச் செய்தான்’ என்று தருதல்
  alternative: தனக்கு விருப்பமானதைச் செய்தான்
  rationale: இந்த வசனம் இஸ்ரவேலின் ஒழுங்கின்மையை எதிர்மறையாக மதிப்பிடுவதாகப் புரிந்துகொள்ளப்படலாம்; ஆனால் மூல எபிரெயம் கூறுவதைக் காட்டிலும் மொழிபெயர்ப்பு மதிப்பீட்டைத் தீவிரப்படுத்தக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சுருக்கமானதும் கண்ணியமானதும் கதைநடைக்கு ஏற்றதுமான மொழி. ‘தன் பார்வைக்கு’ என்பது சொற்சொற் கட்டமைப்பை அதிகமாகச் சுமத்தாமல் எபிரெய மரபுத்தொடரின் தனிப்பட்ட மதிப்பீட்டுப் பொருளைக் காக்கிறது.
