base_translation:
  language: en
  yaml_path: translation/ot/judges/021/022.yaml
  text: And it shall be[a], when their fathers or their brothers come to contend with us, that we will say to them, ‘Show us favor concerning them, because we did not take for each man his wife in the battle; for you did not give them to them[e][d][c][b], at this time, so that you should incur guilt.’
translation:
  language: ta
  text: அவர்களுடைய தந்தையரோ சகோதரர்களோ எங்களிடம் முறையிட வரும்போது, நாங்கள் அவர்களிடம், ‘அந்தப் பெண்களைக் குறித்து எங்களுக்குத் தயவுகாட்டுங்கள்.[a] ஏனெனில் போரில் ஒவ்வொருவனுக்கும் ஒரு மனைவியை நாங்கள் எடுத்துக்கொள்ளவில்லை.[b] நீங்கள் அவர்களை இவர்களுக்குக் கொடுக்கவில்லை; அப்படிக் கொடுத்திருந்தால் இப்போது நீங்கள் குற்றவாளிகளாயிருப்பீர்கள்’[c] என்று சொல்வோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை எங்களுக்கு ஒரு தயவாக விட்டுக்கொடுங்கள்.” எபிரெயத்தில் சொற்சொல்லாக, “அவர்களைக் குறித்து எங்களுக்குத் தயவுகாட்டுங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயச் சொற்றொடர் சுருக்கமானது: “போரில் ஒவ்வொருவனும் தன் மனைவியை நாங்கள் எடுத்துக்கொள்ளவில்லை.” போரில் பென்யமீனிய ஆண்கள் ஒவ்வொருவருக்கும் போதிய மனைவிகள் கிடைக்கவில்லை என்பதே இதன் பொருளாக இருக்கலாம்.'
    reason: cultural_note
  - marker: c
    text: 'இறுதித் தொடர் கடினமான எபிரெயம். குடும்பத்தினர் பெண்களைத் தாங்களே கொடுக்காததால், தங்கள் சத்தியத்தை மீறிய குற்றம் அவர்கள்மேல் வராது என்பதே கருத்து. மற்றொரு மொழிபெயர்ப்பு: “நீங்கள் அவர்களை இவர்களுக்குக் கொடுக்கவில்லை; இப்போது நீங்கள் குற்றவாளிகளாக மாட்டீர்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרִיב
  choice: எங்களிடம் வழக்காட வரும்போது
  rationale: ריב என்பது சச்சரவிடுதல், முறையிடுதல், அல்லது வழக்குத் தொடுப்பதைக் குறிக்கலாம். இங்கு பெண்களின் குடும்பத்தினர் குறை கேட்க வருவதிலுள்ள எதிர்ப்பும் உரிமைக்கோரலும் ‘வழக்காட’ என்பதில் இயல்பாக வெளிப்படுகின்றன; முற்றிலும் நீதிமன்ற நடவடிக்கை என்று இது கட்டாயப்படுத்தாது.
- source_word: חָנּוּנוּ אֹתָם
  choice: அந்தப் பெண்கள் குறித்த விஷயத்தில் எங்களுக்குத் தயவுகாட்டுங்கள்
  rationale: חנן வினையின் கட்டளை வடிவமும் முதலாம் பன்மை பின்னொட்டும் நேரடியாக ‘எங்களுக்குத் தயவுகாட்டுங்கள்’ எனப் பொருள்படும். தொடரும் ‘அவர்களை’ என்பது பெண்களைச் சுட்டுவதால், தமிழில் அதன் தொடர்பைத் தெளிவாக்க ‘அந்தப் பெண்கள் குறித்த விஷயத்தில்’ என வழங்கப்பட்டுள்ளது.
- source_word: לֹא לָקַחְנוּ אִישׁ אִשְׁתּוֹ בַּמִּלְחָמָה
  choice: போரில் ஒவ்வொருவனுக்கும் ஒரு மனைவியை நாங்கள் எடுத்துக்கொள்ளவில்லை
  rationale: எபிரெய உரை சுருக்கமாகவும் சற்றுக் கடினமாகவும் உள்ளது. போரில் பென்யமீனியர் ஒவ்வொருவருக்கும் போதிய மனைவிகளைப் பெறவில்லை என்பதே சூழல்சார் பொருள். ‘ஒவ்வொருவனுக்கும் ஒரு மனைவி’ என்பது אִישׁ אִשְׁתּוֹ என்பதன் பகிர்ந்தளிக்கும் கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: בַּמִּלְחָמָה
  choice: போரில்
  rationale: முன்னொட்டு ב இங்கு அண்மைய போரைக் குறிக்கும் இட/சாதனப் பொருளைக் கொண்டுள்ளது. ‘போரில்’ என்பது சுருக்கமானதும் இயல்பானதும் ஆகும்.
- source_word: לֹא אַתֶּם נְתַתֶּם לָהֶם
  choice: நீங்கள் அவர்களை இவர்களுக்குக் கொடுக்கவில்லையே
  rationale: ‘அவர்கள்’ பெண்களையும் ‘இவர்கள்’ பென்யமீனிய ஆண்களையும் வேறுபடுத்துகிறது. குடும்பத்தினர் பெண்களைத் திருமணத்திற்காக நேரடியாகக் கொடுக்கவில்லை என்ற முரண்பாட்டை இது காக்கிறது.
- source_word: כָּעֵת תֶּאְשָׁמוּ
  choice: கொடுத்திருந்தால் இப்போது நீங்கள் குற்றவாளிகளாவீர்கள்
  rationale: இறுதித் தொடர் கடினமான எபிரெயம். பெண்களை குடும்பத்தினர் முறைப்படி கொடுக்காததால் அவர்கள் சத்தியத்தை மீறிய குற்றத்திற்கு ஆளாகவில்லை என்பதே சூழலின் கருத்து. தமிழில் மறைந்துள்ள நிபந்தனைத் தொடர்பை வெளிப்படுத்தி, כָּעֵת என்பதிலுள்ள ‘இப்போது’ என்பதையும் காத்துள்ளது.
theological_decisions:
- issue: குடும்பத்தினர் குற்றம் அடைவதற்கான காரணம்
  choice: பெண்களை நேரடியாகக் கொடுத்திருந்தால் அவர்கள் இப்போது குற்றவாளிகளாவார்கள் என்று நிபந்தனைப் பொருளில் மொழிபெயர்த்தல்
  alternative: ‘இந்த நேரத்தில் நீங்கள் குற்றம் அடைவீர்கள்’ என்று சொற்சொல்லாக வழங்குதல்
  rationale: நியாயாதிபதிகள் 21:18-இல் உள்ள சத்தியத்தின் பின்னணியில், கடத்தலை அனுமதிப்பதற்கும் பெண்களைத் தாமே கொடுப்பதற்கும் இடையிலான வேறுபாடே இவ்வாதத்தின் மையம். மொழிபெயர்ப்பு அந்தத் தர்க்கத்தைத் தெளிவாக்குகிறது; அதனை நெறியியல் அங்கீகாரமாக மாற்றுவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. உரையின் சட்ட/சச்சரவு நிழலும் சுருக்கமான காரணவாதமும் காக்கப்பட்டுள்ளன. ‘பெண்கள்’ என்பதைத் தேவையான இடத்தில் வெளிப்படையாகச் சேர்த்து குழப்பம் குறைக்கப்பட்டுள்ளது; உரையிலுள்ள செயலை நெறியியல் ரீதியாக நியாயப்படுத்தும் மொழி தவிர்க்கப்பட்டுள்ளது.
