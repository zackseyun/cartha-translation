  to: அவர்களுடைய தந்தையரோ சகோதரர்களோ எங்களிடம் முறையிட வரும்போது, நாங்கள் அவர்களிடம், ‘அந்தப் பெண்களைக் குறித்து எங்களுக்குத் தயவுகாட்டுங்கள்.[a] ஏனெனில் போரில் ஒவ்வொருவனுக்கும் ஒரு மனைவியை நாங்கள் எடுத்துக்கொள்ளவில்லை.[b] நீங்கள் அவர்களை இவர்களுக்குக் கொடுக்கவில்லை; அப்படிக் கொடுத்திருந்தால் இப்போது நீங்கள் குற்றவாளிகளாயிருப்பீர்கள்’[c] என்று சொல்வோம்.
