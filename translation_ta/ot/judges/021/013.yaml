  text: וַֽ/יִּשְׁלְחוּ֙ כָּל הָ֣/עֵדָ֔ה וַֽ/יְדַבְּרוּ֙ אֶל בְּנֵ֣י בִנְיָמִ֔ן אֲשֶׁ֖ר בְּ/סֶ֣לַע רִמּ֑וֹן וַ/יִּקְרְא֥וּ לָ/הֶ֖ם שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/013.yaml
  text: Then the whole congregation sent word and spoke to the sons of Benjamin who were at the rock of Rimmon[a], and proclaimed peace to them.
translation:
  language: ta
  text: பின்பு முழுச் சபையும் ரிம்மோன் கற்பாறையில்[a] இருந்த பென்யமீனின் புதல்வர்களுக்குச் செய்தி அனுப்பி, அவர்களிடம் பேசி, அவர்களுக்குச் சமாதானத்தை அறிவித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘செலா-ரிம்மோனில்’. எபிரேயச் சொற்றொடரை ‘ரிம்மோன் கற்பாறை’ என்ற விளக்கத் தொடராகவோ, நிலைபெற்ற ஓர் இடப்பெயராகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: ஆள் அனுப்பி
  rationale: שׁלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்பு’. அடுத்து ‘பேசினார்கள்’ என வருவதால், செய்தித் தொடர்புக்காக மனிதர்களை அனுப்பிய சூழலை இயல்பான தமிழில் காட்டுகிறது; எபிரேயத்தில் வெளிப்படையாக இல்லாத ‘தூதர்கள்’ என்பதைப் புகுத்தவில்லை.
- source_word: כָּל הָעֵדָה
  choice: சபையார் அனைவரும்
  rationale: עֵדָה இஸ்ரவேலின் ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது. ‘சபையார்’ அதன் சமூகத் தன்மையையும், ‘அனைவரும்’ כָּל என்பதையும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: וַיְדַבְּרוּ אֶל
  choice: பேசி
  rationale: דבר אל என்பதன் நேரடியான பொருள் ‘ஒருவரிடம் பேசுதல்’. முந்தைய வினையுடன் இணைத்து இயல்பான தமிழ் தொடராக வழங்கப்பட்டுள்ளது.
- source_word: בְּנֵי בִנְיָמִן
  choice: பென்யமீனின் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘பென்யமீனின் மகன்கள்’ என்றாலும், இங்கு கோத்திரத்தைச் சேர்ந்த எஞ்சிய ஆண்களைக் குறிக்கும் குடும்ப/கோத்திரச் சொல்லாட்சி. ‘மக்கள்’ நவீன தமிழில் இயல்பாக இருந்து, கோத்திரத் தொடர்பைத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר בְּסֶלַע רִמּוֹן
  choice: ரிம்மோன் கற்பாறையில் இருந்த
  rationale: סֶלַע என்பது ‘பாறை/கற்பாறை’. ரִמּוֹן இடப்பெயர் கூறாக இருப்பதால், முதன்மை உரையில் விளக்கப் பொருளான ‘ரிம்மோன் கற்பாறை’ பயன்படுத்தப்பட்டு, நிலையான இடப்பெயராகப் புரிந்துகொள்ளும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּקְרְאוּ לָהֶם שָׁלוֹם
  choice: அவர்களுக்குச் சமாதானத்தை அறிவித்தார்கள்
  rationale: קרא + மறைமுகப் பொருள் + שׁלום என்பது அமைதியான உறவை முறையாக அறிவிப்பதைக் குறிக்கிறது. ‘சமாதானத்தை அறிவித்தார்கள்’ அதன் வெளிப்படையான அறிவிப்பு வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: שָׁלוֹם
  choice: சமாதானம்
  rationale: இச்சூழலில் שָׁלוֹם தனிப்பட்ட நலத்தைவிட பகை முடிந்து அமைதியான உறவு ஏற்படுவதைக் குறிக்கிறது; ‘சமாதானம்’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
