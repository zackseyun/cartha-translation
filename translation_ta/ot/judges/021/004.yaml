  text: וַֽ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יַּשְׁכִּ֣ימוּ הָ/עָ֔ם וַ/יִּבְנוּ שָׁ֖ם מִזְבֵּ֑חַ וַ/יַּעֲל֥וּ עֹל֖וֹת וּ/שְׁלָמִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/004.yaml
  text: And the next day the people rose early[a], built an altar there, and offered burnt offerings and peace offerings.
translation:
  language: ta
  text: மறுநாள் மக்கள் அதிகாலையில் எழுந்து, அங்கே ஒரு பலிபீடத்தைக் கட்டி, தகனபலிகளையும் சமாதானப் பலிகளையும்[a] செலுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உறவுப் பலிகள்’ அல்லது ‘நல்வாழ்வுப் பலிகள்’ என்றும் மொழிபெயர்க்கலாம். இந்த எபிரெயச் சொல் சமாதானம், முழுமை, நல்வாழ்வு, பகிர்ந்துண்ணும் உறவு ஆகியவற்றோடு தொடர்புடைய ஒரு பலிவகையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: மறுநாள்
  rationale: எபிரெயக் கதைநடையின் ‘அது மறுநாளில் நிகழ்ந்தது’ என்ற தொடக்கச் சூத்திரத்தை இயல்பான நவீன தமிழில் சுருக்கமாகத் தருகிறது; காலக் குறிப்பை முழுமையாகக் காக்கிறது.
- source_word: וַיַּשְׁכִּימוּ
  choice: அதிகாலையில் எழுந்து
  rationale: வினைச்சொல்லில் உள்ள காலையிலேயே எழுதல் என்ற வலியுறுத்தலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: மூலத்தில் உள்ள பொதுவான பெயர்ச்சொல்லை அப்படியே காக்கிறது; சூழலிலிருந்து இவர்கள் இஸ்ரவேலர் என்பது தெரிந்தாலும், அதை வசனத்திற்குள் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: וַיִּבְנוּ שָׁם מִזְבֵּחַ
  choice: அங்கே ஒரு பலிபீடத்தைக் கட்டி
  rationale: שָׁם என்பதன் ‘அங்கே’ என்ற இடக் குறிப்பைத் தக்கவைத்து, இயல்பான தமிழ் சொல் வரிசையில் தருகிறது.
- source_word: וַיַּעֲלוּ
  choice: செலுத்தினார்கள்
  rationale: பலியிடும் சூழலில் ‘மேலே ஏறச் செய்தார்கள்’ என்ற சொற்பொருளைவிட, பலிகளை அர்ப்பணித்த செயலைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: עֹלוֹת
  choice: தகனபலிகள்
  rationale: முழுவதும் எரிக்கப்படும் இந்தப் பலிவகைக்கான சுருக்கமான, நிலைபெற்ற தமிழ் சொல்.
- source_word: וּשְׁלָמִים
  choice: சமாதானப் பலிகள்
  rationale: שְׁלָמִים என்ற பலிவகையின் அமைதி, முழுமை, நல்வாழ்வு ஆகிய பொருள் நிழல்களைத் தாங்கும் நிலைபெற்ற மொழிபெயர்ப்பு; இணைந்துண்ணும் உறவின் அம்சம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: பலிவகைகளுக்கான சொற்களை மொழிபெயர்த்தல்
  choice: தகனபலிகள் மற்றும் சமாதானப் பலிகள்
  alternative: முழுத் தகனபலிகள் மற்றும் உறவுப் பலிகள் / நல்வாழ்வுப் பலிகள்
  rationale: வசனம் இரண்டு வழக்கமான இஸ்ரவேலிய பலிவகைகளை மட்டும் பெயரிடுகிறது; மேலதிக இறையியல் விளக்கத்தை உரைக்குள் சேர்க்காமல், புரிந்துகொள்ளக்கூடிய நிலைபெற்ற சொற்கள் பயன்படுத்தப்பட்டுள்ளன. שְׁלָמִים என்பதன் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கதைத் தொடக்கச் சூத்திரம் தமிழில் இயல்பாகச் சுருக்கப்பட்டுள்ளது; பலிவழிபாட்டுச் சொற்கள் தெளிவாகவும் மரபுசார் தனியுரிமை இல்லாமலும் தரப்பட்டுள்ளன.
