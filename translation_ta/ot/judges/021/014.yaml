  source_fidelity: 'முக்கியக் கருத்து மூல எபிரெயத்துடன் பொருந்துகிறது: பென்யமீன் திரும்பியது, யாபேஸ்-கீலேயாத்துப் பெண்களில் உயிரோடு வைக்கப்பட்ட பெண்கள் வழங்கப்பட்டனர், ஆனால் அந்த ஏற்பாடு போதவில்லை. ஆயினும், கோத்திரத்தைக் குறிக்கும் பெயருக்கு அஃறிணை ஒருமை பயன்படுத்தியதும் பின்னர் மனிதப் பன்மைக்குத் தாவியதும் நடையைச் சற்றுக் குலைக்கிறது. இறுதி அடிக்குறிப்பின் சொற்சொல் மொழிபெயர்ப்பு தமிழில் மீளுரைப்பாகவும் இயல்பற்றதாகவும் உள்ளது.'
  naturalness: ‘பென்யமீனியர்’ எனத் தொடக்கம் முதலே பயன்படுத்துவது நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்கும். ‘அந்த வழியில்’ என்பதற்குப் பதில் ‘இந்த முறையில்’ சூழலிலுள்ள ஏற்பாட்டைத் தெளிவாகச் சுட்டும். அடிக்குறிப்பு எபிரெயத்தின் விடுபட்ட பொருளை விளக்க வேண்டும்; ஆனால் அதன் தமிழ் மேற்கோள் இலக்கணமாகவும் வாசிக்கத்தக்கதாகவும் இருக்க வேண்டும்.
  terminology: ‘பெண்கள்’ என்பது הַנָּשִׁים என்பதற்குச் சரியானது; ‘மனைவிகள்’ என்று முன்கூட்டியே குறுக்கக் கூடாது. ‘உயிரோடு வைத்திருந்த’ என்பது חִיּוּ என்பதற்கு நெருக்கமானது. ‘யாபேஸ்-கீலேயாத்’ என்ற இணைப்புக்கோடு இடப்பெயரின் ஒருமைப்பாட்டைத் தெளிவாக்குகிறது.
