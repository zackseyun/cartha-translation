base_translation:
  language: en
  yaml_path: translation/ot/judges/021/014.yaml
  text: So Benjamin returned at that time[a], and they gave them the women whom they had kept alive from the women of Jabesh-gilead; but they did not find enough for them that way.
translation:
  language: ta
  text: அந்நேரத்தில் பென்யமீனியர் திரும்பிவந்தார்கள். யாபேஸ்-கீலேயாத்துப் பெண்களில் தாங்கள் உயிரோடு வைத்திருந்த பெண்களை அவர்கள் பென்யமீனியருக்குக் கொடுத்தார்கள். ஆனால், இந்த முறையில் அவர்களுக்குப் போதுமான பெண்கள் கிடைக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “ஆனால், அவர்களுக்காக அவ்வாறு அவர்கள் காணவில்லை.” எபிரெயத் தொடர் விடுபட்ட பொருளுடையது; இந்த முறையில் பென்யமீனியருக்குப் போதுமான பெண்கள் கிடைக்கவில்லை என்பதே சூழலிலுள்ள பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב בִּנְיָמִן
  choice: பென்யமீன் திரும்பிவந்தது
  rationale: שׁוב என்பது இக்கதைத் தொடரில் ‘திரும்பிவந்தது’ என்று பொருள்படுகிறது. בִּנְיָמִן ஒருமை வடிவில் இருந்தாலும் கோத்திரத்தைக் கூட்டாகக் குறிக்கிறது; அதனால் தமிழிலும் கோத்திரப் பெயர் அப்படியே வைக்கப்பட்டுள்ளது.
- source_word: בָּעֵת הַהִיא
  choice: அந்த நேரத்தில்
  rationale: எபிரெய உரையின் காலக் குறிப்பை இயல்பான நவீன தமிழில் நேரடியாகத் தருகிறது.
- source_word: וַיִּתְּנוּ לָהֶם
  choice: அவர்கள் பென்யமீனியருக்குக் கொடுத்தார்கள்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடுத்தார்கள்.’ எபிரெயத்தில் மறைமுகப் பொருள் பதிலிப்பெயராக இருந்தாலும், தமிழில் யாருக்குக் கொடுத்தார்கள் என்பது தெளிவாக இருக்க ‘பென்யமீனியருக்கு’ என்று கூறப்பட்டுள்ளது.
- source_word: הַנָּשִׁים
  choice: பெண்களை
  rationale: சூழலில் அவர்கள் மனைவிகளாக வழங்கப்பட்டாலும், மூலச்சொல் குறிப்பாக ‘மனைவிகள்’ என்று அல்லாமல் ‘பெண்கள்’ என்றே கூறுகிறது.
- source_word: אֲשֶׁר חִיּוּ
  choice: தாங்கள் உயிரோடு வைத்திருந்த
  rationale: חיה என்பதன் பியேல் வடிவம் படுகொலையின்போது அவர்களைச் சாகவிடாமல் உயிருடன் வைத்த செயலைக் குறிக்கிறது.
- source_word: מִנְּשֵׁי יָבֵשׁ גִּלְעָד
  choice: யாபேஸ் கீலேயாத்தின் பெண்களில்
  rationale: מן இங்கு ஒரு பெரிய குழுவிலிருந்து தேர்ந்தெடுக்கப்பட்டவர்களைக் குறிக்கிறது; ‘பெண்களில்’ என்பது அந்தப் பகுதி சார்ந்த நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: וְלֹא מָצְאוּ לָהֶם כֵּן
  choice: ஆனால் இவ்வழியில் அவர்களுக்குப் போதுமான பெண்கள் கிடைக்கவில்லை
  rationale: எபிரெயத் தொடர் சுருக்கமாகவும் விடுபட்ட பொருளுடனும் உள்ளது. சூழலின்படி இம்முறையில் எல்லாருக்கும் போதுமான பெண்கள் கிடைக்கவில்லை என்பதே கருத்து; ‘இவ்வழியில்’ என்பது כֵּן என்பதையும் தக்கவைக்கிறது.
