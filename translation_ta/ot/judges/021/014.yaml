translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பென்யமீன்’ கோத்திரத்தைக் கூட்டாகக் குறிப்பதால் முதல் வாக்கியத்தில் அஃறிணை ஒருமை வினை அமைந்துள்ளது; அடுத்த வாக்கியங்களில் வாசிப்புத் தெளிவுக்காக ‘பென்யமீனியர்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இறுதி சுருக்கத் தொடரின் தெளிவின்மை அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
