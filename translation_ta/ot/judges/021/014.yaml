- from: அந்த நேரத்தில் பென்யமீன் திரும்பிவந்தது. யாபேஸ் கீலேயாத்தின் பெண்களில் தாங்கள் உயிரோடு வைத்திருந்த பெண்களை அவர்கள் பென்யமீனியருக்குக் கொடுத்தார்கள். ஆனால் இவ்வழியில் அவர்களுக்குப் போதுமான பெண்கள் கிடைக்கவில்லை.[a]
  to: அந்நேரத்தில் பென்யமீனியர் திரும்பிவந்தார்கள். யாபேஸ்-கீலேயாத்துப் பெண்களில் தாங்கள் உயிரோடு வைத்திருந்த பெண்களை அவர்கள் பென்யமீனியருக்குக் கொடுத்தார்கள். ஆனால், இந்த முறையில் அவர்களுக்குப் போதுமான பெண்கள் கிடைக்கவில்லை.[a]
  rationale: திருத்தம் மூலத்தின் பொருளையோ அதன் இறுதித் தொடரின் சுருக்கத்தையோ மாற்றவில்லை. கோத்திரத்திற்கான தமிழ் இலக்கண ஒத்திசைவு சீராக்கப்பட்டது; இடப்பெயர் இணைக்கப்பட்டது; இறுதி ஏற்பாட்டின் போதாமை தெளிவாக வைக்கப்பட்டது. அடிக்குறிப்பு எபிரெயத்தின் சொற்சொல் வடிவத்தையும் அதன் சூழல் சார்ந்த பொருளையும் வேறுபடுத்தி இயல்பாகத் தருகிறது.
