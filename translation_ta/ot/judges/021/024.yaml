translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் இரு புறப்பாட்டு வினைகளும் பாதுகாக்கப்பட்டுள்ளன; இயல்பான தமிழ் உடைமை ஒத்திசைவுக்காக ஒருமை ஆண்பால் வடிவங்கள் ‘ஒவ்வொருவரும் தங்கள்’ என வழங்கப்பட்டுள்ளன.
