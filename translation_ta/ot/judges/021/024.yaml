base_translation:
  language: en
  yaml_path: translation/ot/judges/021/024.yaml
  text: Then the sons of Israel departed from there at that time[a], each man to his tribe and to his family, and they went out from there[b], each man to his inheritance.
translation:
  language: ta
  text: அக்காலத்தில் இஸ்ரவேல் மக்கள் அங்கிருந்து புறப்பட்டார்கள்; ஒவ்வொருவரும் தங்கள் கோத்திரத்திற்கும் தங்கள் குடும்பத்திற்கும்[a] சென்றார்கள். அவர்கள் அங்கிருந்து புறப்பட்டார்கள்; ஒவ்வொருவரும் தங்கள் மரபுரிமை நிலத்திற்குச்[b] சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் குலத்திற்கும்”; இங்குள்ள எபிரெயச் சொல், உடனடி குடும்பத்தைவிட விரிந்த உறவுக் குழுவைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தங்கள் சுதந்தரத்திற்குச்”; இங்கு இது ஒவ்வொருவருக்கும் மரபுரிமையாக ஒதுக்கப்பட்ட நிலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: புறப்பட்டு ... சென்றார்கள்
  rationale: התהלך என்பதன் ஹித்பாயேல் வடிவம் இங்கு நடப்பதை வலியுறுத்தாமல், கூட்டம் கலைந்து அவரவர் இடத்திற்குச் செல்வதைக் குறிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெய மொழியில் சொற்படியாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு சமூகமாகிய இஸ்ரவேலரை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: בָּעֵת הַהִיא
  choice: அக்காலத்தில்
  rationale: கதை நிகழ்ந்த காலத்தைக் குறிக்கும் எளிய காலச் சுட்டியைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אִישׁ
  choice: ஒவ்வொருவரும்
  rationale: இங்கு אִישׁ பகிர்மானப் பொருளில் வருகிறது; தனித்தனி நபர்கள் அவரவர் குழுவிற்கும் நிலத்திற்கும் சென்றதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְשִׁבְטוֹ
  choice: தங்கள் கோத்திரத்தாரிடம்
  rationale: שֵׁבֶט என்பதற்கான வழக்கமான வேதாகமத் தமிழ் ‘கோத்திரம்’; மனிதக் குழுவிடம் திரும்பிச் செல்வதை ‘கோத்திரத்தாரிடம்’ தெளிவாக்குகிறது.
- source_word: וּלְמִשְׁפַּחְתּוֹ
  choice: தங்கள் குடும்பத்தாரிடம்
  rationale: מִשְׁפָּחָה குடும்பத்தைவிட விரிந்த உறவுக் குழுவையும் குறிக்கலாம்; வாசிப்பிற்கு இயல்பான ‘குடும்பத்தார்’ முதன்மை உரையில் வைக்கப்பட்டு மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיֵּצְאוּ
  choice: புறப்பட்டு ... சென்றார்கள்
  rationale: יצא என்பதன் ‘வெளியேறு/புறப்படு’ என்ற இயக்கப் படிமத்தைப் பாதுகாத்து, தமிழ் வாக்கிய ஓட்டத்திற்கேற்ப அமைக்கிறது.
- source_word: לְנַחֲלָתוֹ
  choice: தங்கள் உரிமை நிலத்திற்கு
  rationale: נַחֲלָה இங்கு ஒவ்வொருவருக்கும் மரபுரிமையாக ஒதுக்கப்பட்ட நிலப்பகுதியைக் குறிக்கிறது; ‘உரிமை நிலம்’ அதன் நிலவியல் மற்றும் சட்டப் பொருளைத் தெளிவாக எடுத்துரைக்கிறது.
