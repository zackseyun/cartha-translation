base_translation:
  language: en
  yaml_path: translation/ot/judges/021/019.yaml
  text: And they said[a], "Look, there is a feast of Yahweh in Shiloh from year to year, which is north of Bethel, east of the highway that goes up from Bethel to Shechem[b], and south of Lebonah."
translation:
  language: ta
  text: அவர்கள், “இதோ, சீலோவில் ஆண்டுதோறும்[a] யாவேக்கு ஒரு திருவிழா உண்டு. சீலோ பெத்தேலுக்கு வடக்கிலும், பெத்தேலிலிருந்து சீகேமுக்குச் செல்லும் நெடுஞ்சாலைக்குக் கிழக்கிலும், லெபோனாவுக்குத் தெற்கிலும் இருக்கிறது” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “நாட்களிலிருந்து நாட்களுக்கு”; இதன் பொருள், “ஆண்டுதோறும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: தொடர்ந்து சொல்லப்படவிருக்கும் தகவலின் மீது கவனத்தை ஈர்க்கும் எபிரெயச் சுட்டுச்சொல்லின் வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: חַג יְהוָה
  choice: யாவேக்கான ஒரு திருவிழா
  rationale: חַג என்பது விழா அல்லது விருந்து சார்ந்த பண்டிகையைக் குறிக்கிறது; இங்கு நடைபெறும் ஆண்டுவிழாவைக் குறிக்க ‘திருவிழா’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது. יְהוָה என்பது பட்டப்பெயராக மாற்றப்படாமல் ‘யாவே’ எனப் பெயரெழுத்தாக்கப்பட்டுள்ளது.
- source_word: בְּשִׁלֹה
  choice: சீலோவில்
  rationale: இடப்பொருளைக் குறிக்கும் முன்னொட்டுடன் வரும் ஊர்ப்பெயரைத் தமிழில் நிலையான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מִיָּמִים יָמִימָה
  choice: ஆண்டுதோறும்
  rationale: சொல்லுக்குச் சொல் ‘நாட்களிலிருந்து நாட்களுக்கு’ என்ற எபிரெய மரபுத்தொடர் ஆண்டுதோறும் நிகழும் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் ‘ஆண்டுதோறும்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: מִצְּפוֹנָה לְבֵית אֵל
  choice: பெத்தேலுக்கு வடக்கில்
  rationale: பெத்தேலை ஒப்பீட்டுப் புள்ளியாகக் கொண்ட புவியியல் திசையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִזְרְחָה הַשֶּׁמֶשׁ לִמְסִלָּה
  choice: நெடுஞ்சாலைக்குக் கிழக்கில்
  rationale: ‘சூரியன் உதிக்கும் திசை’ என்ற சொல்லாட்சியை புவியியல் சூழலுக்கேற்ற ‘கிழக்கு’ எனவும், மְסִלָּה என்பதை முதன்மையான வழித்தடத்தைக் குறிக்கும் ‘நெடுஞ்சாலை’ எனவும் வழங்குகிறது.
- source_word: הָעֹלָה מִבֵּית אֵל שְׁכֶמָה
  choice: பெத்தேலிலிருந்து சீகேமுக்குச் செல்லும்
  rationale: சாலையின் திசையையும் இலக்கையும் இயல்பான தமிழில் காட்டுகிறது; ‘மேலே செல்கிறது’ என்ற எபிரெய நிலவியல் சொல்லாட்சியை தேவையின்றி கடினமாக்காமல் ‘செல்லும்’ என வழங்குகிறது.
- source_word: וּמִנֶּגֶב לִלְבוֹנָה
  choice: லெபோனாவுக்குத் தெற்கில்
  rationale: சீலோவின் இருப்பிடத்தை நிறைவு செய்யும் தெற்குத் திசை உறவைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: இங்கு உடன்படிக்கையின் தனிப்பெயர் இடம்பெறுவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் எபிரெயப் பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குவது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: אֲשֶׁר தொடங்கும் இடவிளக்கத்தின் தொடர்பு
  choice: சீலோவை விளக்கும் தனி வாக்கியம்
  alternative: திருவிழாவை நேரடியாகத் தொடரும் ஒரே சார்பு வாக்கியம்
  rationale: இடவிவரங்கள் சீலோவின் இருப்பிடத்தைச் சுட்டுகின்றன. தமிழில் தொடர்பைத் தெளிவாக்க ‘சீலோ’ என்பதை மீண்டும் கூறியுள்ளோம்; புதிய பொருள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. நீண்ட எபிரெய இடவிளக்கம் தமிழில் தெளிவாக இருக்க இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; திசைத் தகவல்களின் வரிசை பாதுகாக்கப்பட்டது.
