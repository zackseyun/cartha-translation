base_translation:
  language: en
  yaml_path: translation/ot/judges/021/018.yaml
  text: But we cannot give them wives from our daughters[a], because the sons of Israel have sworn, saying, ‘Cursed is the one who gives a wife to Benjamin.’
translation:
  language: ta
  text: ஆனால், நம் மகள்களை அவர்களுக்கு மனைவிகளாகக் கொடுக்க நம்மால் முடியாது; ஏனெனில் இஸ்ரவேலின் மகன்கள், “பென்யமீனுக்கு ஒரு மனைவியைக் கொடுப்பவன் சபிக்கப்பட்டவன்” என்று சத்தியம் செய்திருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் வெளிப்படையாக, “பென்யமீன் கோத்திரத்துக்கு” அல்லது “பென்யமீன் கோத்திரத்தைச் சேர்ந்த ஒருவருக்கு”; எபிரேயத்தில் “பென்யமீன்” என்ற கோத்திரப் பெயரே நேரடியாக வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: ஆனால் ... நம்மால்
  rationale: இணைப்புச்சொல்லும் தனிப்பட்ட சுட்டுப்பெயரும் முந்தைய ஆலோசனைக்கு மாறுபட்ட திருப்பத்தையும் எழுவாய் வலியுறுத்தலையும் தருகின்றன; நவீன தமிழில் ‘ஆனால் ... நம்மால்’ அவற்றை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא נוּכַל
  choice: முடியாது
  rationale: יכל என்பது திறன் அல்லது சாத்தியத்தைக் குறிக்கிறது. சூழலில் ஆணை காரணமான கட்டுப்பாடு இருந்தாலும், ‘சட்டப்படி முடியாது’ போன்ற விளக்கத்தை மூலத்தில் இல்லாமல் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לָתֵת לָהֶם נָשִׁים מִבְּנוֹתֵינוּ
  choice: நம்முடைய மகள்களில் யாரையும் அவர்களுக்கு மனைவிகளாகக் கொடுக்க
  rationale: מן மூலத்தையோ ஒரு தொகுதியிலிருந்து தெரிவையோ குறிக்கிறது; தமிழ் வழக்கில் ‘மகள்களில் யாரையும்’ என்பது அந்தப் பகுதி சார்ந்த பொருளைத் தெளிவாகக் காட்டுகிறது. திருமணச் சூழலால் נָשִׁים ‘மனைவிகள்’ என்று கொள்ளப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன் கூறிய இயலாமைக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: נִשְׁבְּעוּ
  choice: ஆணையிட்டிருந்தார்கள்
  rationale: Niphal வடிவம் சத்தியம் செய்தல் அல்லது ஆணையிடுதலைக் குறிக்கிறது; இறந்தகாலத்தில் செய்யப்பட்ட ஆணை அந்நேர விவாதத்திலும் கட்டுப்படுத்துவதை இறந்தகால நிறைவு வடிவம் உணர்த்துகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: மூலத்தின் வெளிப்படையான ஆண்பால் பன்மை வடிவத்தை பொதுப்படுத்தி ‘இஸ்ரவேலர்’ என மாற்றாமல் முறையாகப் பேணுகிறது.
- source_word: לֵאמֹר
  choice: என்று
  rationale: மேற்கோளின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரேய மேற்கோள் வடிவத்திற்கு இயல்பான தமிழ் இணைப்பு.
- source_word: אָרוּר
  choice: சபிக்கப்பட்டவன்
  rationale: உடன்படிக்கை அல்லது நீதித்தீர்ப்பு சார்ந்த சாபத்துக்கு உட்பட்ட நிலையைத் தெளிவான, மரியாதையான நவீன தமிழில் தருகிறது.
- source_word: נֹתֵן אִשָּׁה
  choice: மனைவியைக் கொடுப்பவன்
  rationale: பங்கெச்சம் பொதுவான ஒருமைச் செய்பவரைக் குறிக்கிறது; சூழலின்படி אִשָּׁה திருமணத்திற்குக் கொடுக்கப்படும் மனைவியைக் குறிக்கிறது.
- source_word: לְבִנְיָמִן
  choice: பென்யமீனுக்கு
  rationale: மூலம் கோத்திரப் பெயரை நேரடியாகப் பயன்படுத்துவதால் அதையே சுருக்கமாகப் பேணுகிறது; சூழலில் அது பென்யமீன் கோத்திரத்தையோ அதன் ஒருவரையோ குறிக்கலாம்.
