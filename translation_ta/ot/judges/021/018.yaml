revisions:
- from: ஆனால் நம்முடைய மகள்களில் யாரையும் அவர்களுக்கு மனைவிகளாகக் கொடுக்க நம்மால் முடியாது. ஏனெனில் இஸ்ரவேலின் மகன்கள், “பென்யமீனுக்கு மனைவியைக் கொடுப்பவன் சபிக்கப்பட்டவன்” என்று ஆணையிட்டிருந்தார்கள்.[a]
  to: ஆனால், நம் மகள்களை அவர்களுக்கு மனைவிகளாகக் கொடுக்க நம்மால் முடியாது; ஏனெனில் இஸ்ரவேலின் மகன்கள், “பென்யமீனுக்கு ஒரு மனைவியைக் கொடுப்பவன் சபிக்கப்பட்டவன்” என்று சத்தியம் செய்திருந்தார்கள்.[a]
  rationale: The revision corrects the central lexical error by rendering the Israelites’ action as swearing an oath rather than issuing an order. It also makes the marriage-giving expression more idiomatic in modern standard Tamil without adding an interpretation, and refines the footnote’s alternative wording for naturalness and precision.
  reviewer_model: gpt-5.6-terra
