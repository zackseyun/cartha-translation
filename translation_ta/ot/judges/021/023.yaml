    rationale: ‘நடனமாடிய பெண்களிலிருந்து ... பறித்துக்கொண்டவர்களை’ என்ற சொல்வரிசை இலக்கணப்படி புரியக்கூடியதாயினும், ‘பெண்களிடமிருந்து’ என்பதைத் தொடர்ந்து ‘பறித்துக்கொண்ட பெண்களை’ என அமைத்தால் தமிழ் வாசிப்பு தெளிவாகும்.
