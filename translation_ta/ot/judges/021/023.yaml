    rationale: ‘பென்யமீனின் மகன்கள்’ என்பதைக் காட்டிலும் ‘பென்யமீன் மகன்கள்’ நவீன தமிழ் உரைநடையில் மென்மையாக உள்ளது; எபிரெய குடும்ப/கோத்திரச் சொல்லாட்சியும் காக்கப்படுகிறது.
  revised_text: பென்யமீன் மகன்கள் அவ்வாறே செய்தார்கள். தங்கள் எண்ணிக்கைக்கு ஏற்ப, நடனமாடிக்கொண்டிருந்த பெண்களிடமிருந்து[a] தாங்கள் வலுக்கட்டாயமாகப் பறித்துக்கொண்ட பெண்களை[b] மனைவிகளாகக் கொண்டார்கள். பின்பு அவர்கள் புறப்பட்டுத் தங்கள் சுதந்தரப் பங்கிற்குத் திரும்பி, பட்டணங்களை மீண்டும் கட்டி[c], அவற்றில் குடியிருந்தார்கள்.
