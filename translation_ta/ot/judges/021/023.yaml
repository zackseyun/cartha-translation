  source_fidelity: 'மூலத்தின் முக்கிய கூறுகள் அனைத்தும் உள்ளன: பென்யமீன் ஆண்கள் முன்னர்க் கூறப்பட்ட செயலைச் செய்தனர்; நடனமாடும் பெண்களிடமிருந்து தங்கள் எண்ணிக்கைக்கு ஏற்ப மனைவிகளைப் பலவந்தமாகப் பறித்துக்கொண்டனர்; தங்கள் மரபுரிமைப் பங்கிற்குத் திரும்பி, நகரங்களைக் கட்டி அவற்றில் குடியிருந்தனர். ஆயினும், முதன்மை உரையில் ‘நடனமாடிய பெண்களிலிருந்து ... பறித்துக்கொண்டவர்களை’ என்ற தொடரில் ‘பெண்களிலிருந்து’ மற்றும் ‘வர்களை’ இடையிலான தொடர்பு சற்றே கனமாக உள்ளது. சொல்வரிசையை மாற்றுவது மூலத்தின் வலுக்கட்டாயப் பொருளையோ எண்ணிக்கைத் தொடர்பையோ மாற்றாமல் தெளிவாக்குகிறது.'
  naturalness: ‘பென்யமீனின் மகன்கள்’ என்பதற்குப் பதிலாக ‘பென்யமீன் மகன்கள்’ நவீன நிலையான தமிழில் சற்றே இயல்பானது. ‘நடனமாடிக்கொண்டிருந்த பெண்களிடமிருந்து’ என்பது மூலத்தின் பெண்பால் பன்மை நிகழ்கால வினையெச்சத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது. ‘சுதந்தரப் பங்கு’ என்பது נחלה என்பதற்கான இயல்பான மரபுரிமை/ஒதுக்கீட்டு நிலச் சொல்லாட்சி.
  terminology: ‘மனைவிகளாகக் கொண்டார்கள்,’ ‘வலுக்கட்டாயமாகப் பறித்துக்கொண்ட,’ ‘சுதந்தரப் பங்கு,’ ‘குடியிருந்தார்கள்’ ஆகியவை பொருத்தமானவை. גזל சொல்லின் வன்முறை வலிமை பாதுகாக்கப்படுகிறது; உரை அந்தச் செயலை அங்கீகரிப்பதில்லை. ‘மீண்டும் கட்டி’ என்பது சூழலால் ஆதரிக்கப்படும் விளக்கமான மொழிபெயர்ப்பு என்பதால், அதற்கான அடிக்குறிப்பு அவசியமாகத் தக்கவைக்கப்பட்டுள்ளது.
