base_translation:
  language: en
  yaml_path: translation/ot/judges/021/023.yaml
  text: So the sons of Benjamin did so[a], and took wives according to their number from the dancers whom they had seized. Then they went and returned to their inheritance, rebuilt the cities[c][b], and lived in them.
translation:
  language: ta
  text: பென்யமீன் மகன்கள் அவ்வாறே செய்தார்கள். தங்கள் எண்ணிக்கைக்கு ஏற்ப, நடனமாடிக்கொண்டிருந்த பெண்களிடமிருந்து[a] தாங்கள் வலுக்கட்டாயமாகப் பறித்துக்கொண்ட பெண்களை[b] மனைவிகளாகக் கொண்டார்கள். பின்பு அவர்கள் புறப்பட்டுத் தங்கள் சுதந்தரப் பங்கிற்குத் திரும்பி, பட்டணங்களை மீண்டும் கட்டி[c], அவற்றில் குடியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் பெண்பால் பன்மையில் உள்ளது; ‘நடனமாடும் பெண்களிடமிருந்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பலவந்தமாகப் பிடித்துக்கொண்ட பெண்களை,’ ‘கவர்ந்துகொண்ட பெண்களை,’ அல்லது ‘கொண்டுபோன பெண்களை’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை வலுக்கட்டாயமாக எடுத்துக்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் நேரடியாக ‘பட்டணங்களைக் கட்டினார்கள்’ என்று உள்ளது. முந்தைய நிகழ்வுகளில் பென்யமீனின் பட்டணங்கள் அழிக்கப்பட்டிருந்த சூழலை ‘மீண்டும் கட்டி’ பிரதிபலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: அவ்வாறே செய்தார்கள்
  rationale: முன்பு கூறப்பட்ட திட்டத்தை அவர்கள் செயல்படுத்தினார்கள் என்பதைக் காட்டும் எபிரெயக் கதைநடைச் சூத்திரத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: בְּנֵי בִנְיָמִן
  choice: பென்யமீனின் மகன்கள்
  rationale: செயலில் ஈடுபட்ட ஆண் கோத்திர உறுப்பினர்களைக் குறிக்கும் எபிரெயக் குடும்ப/கோத்திரச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: וַיִּשְׂאוּ נָשִׁים
  choice: மனைவிகளாகக் கொண்டார்கள்
  rationale: திருமண உறவுக்காகப் பெண்களை எடுத்துக்கொண்டதைக் குறிக்கும் எபிரெய மரபுத்தொடரைத் தமிழில் தெளிவாகத் தருகிறது; அடுத்துள்ள வன்முறைச் சொல்லை இது மறைக்கவில்லை.
- source_word: לְמִסְפָּרָם
  choice: தங்கள் எண்ணிக்கைக்கு ஏற்ப
  rationale: எடுத்துக்கொள்ளப்பட்ட மனைவிகளின் எண்ணிக்கை பென்யமீன் ஆண்களின் தேவையான எண்ணிக்கையுடன் பொருந்தியது என்பதை நெருக்கமாக வெளிப்படுத்துகிறது.
- source_word: מִן הַמְּחֹלְלוֹת
  choice: நடனமாடிய பெண்களிலிருந்து
  rationale: பெண்பால் பன்மை வினையெச்சத்தின் பொருளை வெளிப்படையாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲשֶׁר גָּזָלוּ
  choice: தாங்கள் வலுக்கட்டாயமாகப் பறித்துக்கொண்டவர்களை
  rationale: גזל என்ற வினையின் பலவந்தமாகப் பறித்தல் அல்லது கொள்ளையிடுதல் என்ற கடுமையான பொருளை மென்மைப்படுத்தாமல் பாதுகாக்கிறது.
- source_word: וַיֵּלְכוּ וַיָּשׁוּבוּ
  choice: புறப்பட்டுத் ... திரும்பி
  rationale: விழா நடந்த இடத்திலிருந்து அவர்கள் சென்றதையும் தங்கள் நிலத்திற்குத் திரும்பியதையும் குறிக்கும் இரு எபிரெய வினைகளையும் சுருக்காமல் பிரதிபலிக்கிறது.
- source_word: אֶל נַחֲלָתָם
  choice: தங்கள் உரிமைப் பங்கு நிலத்திற்குத்
  rationale: கோத்திரத்துக்குப் பங்கிடப்பட்ட மரபுரிமை நிலம் என்ற נחלה சொல்லின் உடன்படிக்கை-நிலப் பின்னணியைத் தெளிவாகத் தருகிறது.
- source_word: וַיִּבְנוּ אֶת הֶעָרִים
  choice: பட்டணங்களை மீண்டும் கட்டி
  rationale: எபிரெயத்தில் நேரடியாக ‘பட்டணங்களைக் கட்டினார்கள்’ என்றாலும், முந்தைய போரில் அழிக்கப்பட்ட பென்யமீன் பட்டணங்களைக் குறிக்கும் சூழலால் ‘மீண்டும்’ என்பது பொருத்தமாகிறது; இதை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: அவற்றில் குடியிருந்தார்கள்
  rationale: குடியேறி வாழ்தல் என்ற ישב சொல்லின் இச்சூழலுக்குரிய பொருளை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
theological_decisions:
- issue: பெண்கள் எவ்வாறு கொண்டுசெல்லப்பட்டார்கள் என்பதை விவரிக்கும் גָּזָלוּ சொல்லின் ஒழுக்கநெறிசார் வலிமை
  choice: ‘வலுக்கட்டாயமாகப் பறித்துக்கொண்டவர்கள்’ என்று வன்முறையை வெளிப்படையாகத் தெரிவித்தல்
  alternative: ‘கொண்டுவந்தவர்கள்’ அல்லது ‘அழைத்துவந்தவர்கள்’ என்று மென்மையாக மொழிபெயர்த்தல்
  rationale: இஸ்ரவேலரின் திட்டத்தின் பகுதியாக இது நிகழ்ந்தாலும், எபிரெய வினை பலவந்தமாகப் பறித்தலைக் குறிக்கிறது. மொழிபெயர்ப்பு அந்தச் செயலை அங்கீகரிப்பதாகவோ அதன் வன்முறையை மறைப்பதாகவோ அமையக்கூடாது.
- issue: கோத்திர மற்றும் நிலப்பங்கு சார்ந்த சொல்லாட்சியை நவீன பொதுச்சொற்களாக மாற்றலாமா என்பது
  choice: ‘பென்யமீனின் மகன்கள்’ மற்றும் ‘உரிமைப் பங்கு நிலம்’ என்று மூலத்தின் கோத்திரப் பின்னணியைப் பாதுகாத்தல்
  alternative: ‘பென்யமீனியர்’ மற்றும் ‘அவர்களுடைய பகுதி’
  rationale: மூலத்தின் குடும்ப-கோத்திர அமைப்பையும் பங்கிடப்பட்ட நிலத்தின் மரபுரிமை நுணுக்கத்தையும் புரியத்தக்க தமிழில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘புறப்பட்டுத் ... திரும்பி’ என்ற அமைப்பு மூலத்தின் இரட்டை வினைநடையைப் பாதுகாக்கிறது. பெண்கள் பலவந்தமாகப் பறிக்கப்பட்டதை மறைக்கும் நயப்படுத்தல் தவிர்க்கப்பட்டுள்ளது.
