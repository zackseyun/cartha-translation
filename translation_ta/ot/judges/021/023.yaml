    text: ‘பலவந்தமாகப் பிடித்துக்கொண்ட பெண்களை,’ ‘கவர்ந்துகொண்ட பெண்களை,’ அல்லது ‘கொண்டுபோன பெண்களை’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை வலுக்கட்டாயமாக எடுத்துக்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் நேரடியாக ‘பட்டணங்களைக் கட்டினார்கள்’ என்று உள்ளது. முந்தைய நிகழ்வுகளில் பென்யமீனின் பட்டணங்கள் அழிக்கப்பட்டிருந்த சூழலை ‘மீண்டும் கட்டி’ பிரதிபலிக்கிறது.
    reason: lexical_alternative
  revision_rationale: பொருளை மாற்றாமல், பெண்களைக் குறிக்கும் தொடர்புத் தொடரை இயல்பாக்கவும் பெண்பால் பன்மைச் சுட்டலை வெளிப்படையாக்கவும் சொல்வரிசை திருத்தப்பட்டுள்ளது. மரபுரிமையாகப் பங்கிடப்பட்ட நிலம் என்ற נחלה சொல்லின் பொருளுக்காக ‘சுதந்தரப் பங்கு’ பயன்படுத்தப்பட்டுள்ளது. ‘மீண்டும்’ என்பது மூலச் சொல்லில் வெளிப்படையாக இல்லாத சூழல்-அடிப்படையிலான விளக்கம் என்பதால் அடிக்குறிப்பு காக்கப்பட்டுள்ளது.
