  text: וַֽ/יִּמְצְא֞וּ מִ/יּוֹשְׁבֵ֣י יָבֵ֣ישׁ גִּלְעָ֗ד אַרְבַּ֤ע מֵאוֹת֙ נַעֲרָ֣ה בְתוּלָ֔ה אֲשֶׁ֧ר לֹֽא יָדְעָ֛ה אִ֖ישׁ לְ/מִשְׁכַּ֣ב זָכָ֑ר וַ/יָּבִ֨יאוּ אוֹתָ֤/ם אֶל הַֽ/מַּחֲנֶה֙ שִׁלֹ֔ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ כְּנָֽעַן׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/012.yaml
  text: And from the inhabitants of Jabesh-gilead they found four hundred young women, virgins, who had not known a man by lying with a male; and they brought them to the camp at Shiloh, which is in the land of Canaan.
translation:
  language: ta
  text: யாபேஸ்-கிலேயாத்தின் குடியிருப்பாளர்களிடமிருந்து, ஒரு ஆணுடன் படுத்து ஆணை அறியாத இளம் கன்னிப் பெண்கள் நானூறு பேரை அவர்கள் கண்டுபிடித்தார்கள். அவர்களை கானான் நாட்டில் அமைந்திருந்த சீலோவிலுள்ள முகாமுக்குக் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיּוֹשְׁבֵי יָבֵישׁ גִּלְעָד
  choice: யாபேஸ்-கிலேயாத்தின் குடியிருப்பாளர்களிடையே
  rationale: מן இங்கு அந்த ஊரின் குடிமக்கள் மத்தியிலிருந்து பெண்கள் கண்டுபிடிக்கப்பட்டதைக் குறிக்கிறது; இயல்பான தமிழில் ‘குடியிருப்பாளர்களிடையே’ என வழங்கப்பட்டது.
- source_word: נַעֲרָה בְתוּלָה
  choice: கன்னிப் பெண்கள்
  rationale: נַעֲרָה இளம் பெண்ணையும் בְתוּלָה கன்னித்தன்மையையும் குறிக்கின்றன; எண்ணிக்கையுடன் இயல்பாகப் பன்மையில் வழங்கப்பட்டது.
- source_word: לֹא יָדְעָה אִישׁ לְמִשְׁכַּב זָכָר
  choice: ஆணுடன் படுத்து எந்த ஆணையும் அறியாத
  rationale: ‘அறிதல்’ என்ற எபிரெய மறைமுகப் பாலுறவுச் சொல்லையும், ‘ஆணுடன் படுத்தல்’ என்ற விளக்கத்தையும் மூலத்தின் வெளிப்படையான அமைப்புக்கு நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: שִׁלֹה
  choice: சீலோ
  rationale: இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: אֶרֶץ כְּנָעַן
  choice: கானான் நாடு
  rationale: புவியியல் பெயரைத் தெளிவான, வழக்கமான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: ‘அறிதல்’ என்ற பாலுறவுச் சொற்பயன்பாடு
  choice: மூலத்தின் ‘அறிதல்’ என்பதையும் அதனுடன் வரும் வெளிப்படையான விளக்கத்தையும் இரண்டையும் தக்கவைத்தல்
  alternative: ‘ஆணுடன் பாலுறவு கொள்ளாத’ என்று மட்டும் பொருளுரைத்தல்
  rationale: மூல எபிரெய உரையின் மறைமுகச் சொல்லும் விளக்கச் சொற்றொடரும் இணைந்துள்ள தன்மையைச் சுருக்கி விடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரமான தமிழ்; வரலாற்றுக் கதையாடலுக்கேற்ற கண்ணியமான, நேரடியான நடை. சம்பவத்தின் கடுமையை மென்மையாக்கவோ உரையில் இல்லாத மதிப்பீட்டைச் சேர்க்கவோ செய்யவில்லை.
