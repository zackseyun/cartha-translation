translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய உறவுமுறைச் சொற்றொடரான ‘பென்யமீனின் மகன்கள்’ தக்கவைக்கப்பட்டுள்ளது; நேர்கூற்றை அறிமுகப்படுத்த தமிழுக்கேற்ற இரட்டைப் புள்ளி பயன்படுத்தப்பட்டுள்ளது.
