source:
  edition: WLC
  text: ו/יצו אֶת בְּנֵ֥י בִנְיָמִ֖ן לֵ/אמֹ֑ר לְכ֖וּ וַ/אֲרַבְתֶּ֥ם בַּ/כְּרָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/020.yaml
  text: And they commanded the sons of Benjamin[a], saying[b], “Go and lie in wait in the vineyards.”
translation:
  language: ta
  text: 'அவன் பென்யமீனின் மகன்களுக்குக் கட்டளையிட்டான்: “நீங்கள் போய்த் திராட்சைத்தோட்டங்களில் பதுங்கிக் காத்திருங்கள்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ו/יצו
  choice: அவர்கள் ... கட்டளையிட்டார்கள்
  rationale: צוה என்பது ‘கட்டளையிடு, அறிவுறுத்து’ என்று பொருள்படும். கொடுக்கப்பட்ட உரைச் சூழலும் பன்மை வாசிப்பை ஆதரிப்பதால், எழுவாய் ‘அவர்கள்’ என்றும் செயல் ‘கட்டளையிட்டார்கள்’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: பென்யமீனின் மகன்களுக்கு
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான உறவுமுறை வெளிப்பாட்டைத் தக்கவைக்கிறது; இங்கு அது பென்யமீன் கோத்திரத்தைச் சேர்ந்த ஆண்களைக் குறிக்கிறது.
- source_word: לֵאמֹר
  choice: ':'
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் வழக்கமான எபிரெய வடிவம். தமிழில் ‘என்று சொல்லி’ எனச் சேர்ப்பதைவிட இரட்டைப் புள்ளியுடன் நேர்கூற்றைத் தொடங்குவது இயல்பானது.
- source_word: לְכוּ
  choice: நீங்கள் போய்
  rationale: பன்மை ஏவல் வடிவம்; தமிழில் யாரிடம் பேசப்படுகிறது என்பதைத் தெளிவாக்க ‘நீங்கள்’ சேர்க்கப்பட்டது.
- source_word: וַאֲרַבְתֶּם
  choice: பதுங்கிக் காத்திருங்கள்
  rationale: ארב என்பது தாக்குவதற்கான தருணத்தை எதிர்பார்த்துப் பதுங்கியிருப்பதைக் குறிக்கிறது. ‘பதுங்கிக் காத்திருங்கள்’ என்பது அந்தச் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘பதுங்கித் தாக்குங்கள்’ என்பது தாக்கும் செயலையே உரையில் இல்லாமல் முன்கூட்டியே சேர்த்துவிடும்.
- source_word: בַּכְּרָמִים
  choice: திராட்சைத்தோட்டங்களில்
  rationale: כרמים என்பதன் பன்மை ‘திராட்சைத்தோட்டங்கள்’; ב முன்னொட்டு இங்கு ‘-இல்/-களில்’ என்ற இடப்பொருளைத் தருகிறது.
