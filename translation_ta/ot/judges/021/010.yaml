base_translation:
  language: en
  yaml_path: translation/ot/judges/021/010.yaml
  text: So the assembly sent there twelve thousand men from the sons of valor, and they commanded them, saying, “Go and strike the inhabitants of Jabesh-gilead with the edge of the sword, including the women and the little ones.”
translation:
  language: ta
  text: 'ஆகவே, சபையார் வீரமிக்கவர்களில் பன்னிரண்டாயிரம் பேரை அங்கே அனுப்பி, அவர்களுக்குக் கட்டளையிட்டுச் சொன்னார்கள்: “நீங்கள் போய், யாபேஸ்-கிலேயாத்தின் குடியிருப்பாளர்களைப் பெண்கள், சிறுபிள்ளைகள் உட்பட வாளால் வெட்டி வீழ்த்துங்கள்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: சபையார்
  rationale: இங்கு கூடியிருந்த இஸ்ரவேல் சமூகத்தைக் குறிக்கும்; நவீன தமிழில் இயல்பாகவும் கூட்டாகச் செயல்படும் மக்களைக் குறிக்கும் வகையிலும் உள்ளது.
- source_word: מִבְּנֵי הֶחָיִל
  choice: வீரமிக்கவர்களில்
  rationale: சொல்லுக்கு சொல் வடிவமான ‘வீரத்தின் மகன்கள்’ தமிழில் இயல்பற்றது; போர்திறனும் துணிவும் கொண்ட ஆட்களைச் சுட்டும் எபிரேய வழக்கை இயல்பாக வழங்குகிறது.
- source_word: לְפִי חֶרֶב
  choice: வாளால் வெட்டி வீழ்த்துங்கள்
  rationale: சொற்பொருளில் ‘வாளின் வாயால்’ என்றாலும், இது வாளால் கொல்வதைக் குறிக்கும் எபிரேய மரபுத்தொடர்; வன்முறையை மங்கச் செய்யாமல் தமிழில் தெளிவாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: הַטָּף
  choice: சிறுபிள்ளைகள்
  rationale: சார்ந்திருக்கும் சிறு குழந்தைகளை அல்லது சிறியவர்களைக் குறிக்கும் கூட்டுப்பெயர்; இச்சூழலில் ‘சிறுபிள்ளைகள்’ இயல்பானதும் துல்லியமானதும் ஆகும்.
theological_decisions:
- issue: பெண்களும் சிறுபிள்ளைகளும் கொல்லப்பட வேண்டும் என்ற கட்டளை
  choice: வசனத்தின் கடுமையான உள்ளடக்கத்தை வெளிப்படையாக அப்படியே மொழிபெயர்த்தல்
  alternative: வன்முறையை மென்மைப்படுத்தி அல்லது மறைமுகமாகக் கூறுதல்
  rationale: இது நிகழ்வுரையில் மனித சபையார் கொடுத்த கட்டளை; மூலத்தில் உள்ள ஒழுக்க மற்றும் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு மறைக்கவோ இதை நேரடியாகத் தெய்வீகக் கட்டளையாக மாற்றவோ கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமான, நேரடியான நிகழ்வுரை. இடப்பெயர் ‘கிலேயாத்திலுள்ள யாபேசு’ என தமிழில் புரியும்படி உறவுபடுத்தப்பட்டுள்ளது. மூலத்தின் வன்முறைத் தீவிரம் மென்மைப்படுத்தப்படவில்லை.
