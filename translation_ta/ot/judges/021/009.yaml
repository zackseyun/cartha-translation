  text: וַ/יִּתְפָּקֵ֖ד הָ/עָ֑ם וְ/הִנֵּ֤ה אֵֽין שָׁם֙ אִ֔ישׁ מִ/יּוֹשְׁבֵ֖י יָבֵ֥שׁ גִּלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/009.yaml
  text: And the people were mustered[a], and behold, there was not a man there from the inhabitants of Jabesh-gilead.
translation:
  language: ta
  text: மக்கள் கணக்கெடுக்கப்பட்டனர்; இதோ, யாபேஸ்-கீலேயாத்தின் குடியிருப்பாளர்களில் ஓர் ஆணும் அங்கே இருக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாபேஸ்-கீலேயாத்தின் குடியிருப்பாளர்களில் ஒருவரும் அங்கே இருக்கவில்லை.” எபிரெய மூலத்தில் சொல்லுக்குச் சொல், “ஓர் ஆணும் அங்கே இருக்கவில்லை” என்று உள்ளது. இங்குள்ள ஆண்பால் மொழிநடை ஊரின் ஆண் பிரதிநிதிகள் அல்லது போர்வீரர்கள் குறித்த சூழலைப் பிரதிபலிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּקֵד
  choice: கணக்கெடுக்கப்பட்டபோது
  rationale: פקד என்ற வினையின் இவ்வடிவம் மக்களைப் பட்டியலிட்டு எண்ணியதைக் குறிக்கிறது. தமிழில் இயல்பான தொடர்ச்சிக்காக காலத் தொடர்பைக் காட்டும் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: עָם என்பதன் இயல்பான பொருளைத் தக்கவைக்கிறது; சூழல் போர்சார்ந்ததாக இருந்தாலும் ‘படை’ என்று மிகையாகக் குறிப்பாக்கவில்லை.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: எண்ணிக்கையெடுப்பில் தெரியவந்த ஆச்சரியமான உண்மையின்மீது கவனத்தைத் திருப்பும் הִנֵּה என்பதன் உரையாடல் வலிமையைப் பாதுகாக்கிறது.
- source_word: אֵין שָׁם אִישׁ
  choice: ஓர் ஆணும் அங்கே இருக்கவில்லை
  rationale: எபிரெய மொழியில் உள்ள ஆண்பால் ஒருமை אִישׁ என்பதைத் தெளிவாகப் பிரதிபலிக்கிறது; இது போர்வீரர் அல்லது ஊரின் ஆண் பிரதிநிதிகள் சார்ந்த சூழலாக இருக்கலாம்.
- source_word: מִיּוֹשְׁבֵי
  choice: குடியிருப்பாளர்களில்
  rationale: ישב என்பதன் பங்கேற்புவினை வடிவம் ஓர் இடத்தில் வசிப்பவர்களைக் குறிக்கிறது; ‘குடியிருப்பாளர்கள்’ நவீனத் தமிழில் தெளிவான, மரியாதையான சொல்.
- source_word: יָבֵשׁ גִּלְעָד
  choice: யாபேஸ்-கீலேயாத்
  rationale: எபிரெய இடப்பெயரின் ஒலிப்பைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது; இணைப்புக்குறி இதை ஒரே இடப்பெயராகக் காட்டுகிறது.
