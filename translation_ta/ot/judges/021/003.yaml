language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ לָ/מָ֗ה יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הָ֥יְתָה זֹּ֖את בְּ/יִשְׂרָאֵ֑ל לְ/הִפָּקֵ֥ד הַ/יּ֛וֹם מִ/יִּשְׂרָאֵ֖ל שֵׁ֥בֶט אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/003.yaml
  text: And they said[a], “Why, O Yahweh, God of Israel, has this happened in Israel[b], that today one tribe should be lacking from Israel?”
translation:
  language: ta
  text: அவர்கள், “யாவே, இஸ்ரவேலின் கடவுளே, இன்று இஸ்ரவேலிலிருந்து ஒரு கோத்திரம் இல்லாமல் போகும் நிலை வரும்படி, இஸ்ரவேலில் இது ஏன் நிகழ்ந்தது?” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அவர்கள் … என்றார்கள்
  rationale: தொடர்நிகழ்வைக் குறிக்கும் wayyiqtol வடிவத்தைத் தமிழ் உரையாடல் அமைப்புக்கு இயல்பாக மொழிபெயர்க்கிறது.
- source_word: לָמָה
  choice: ஏன்
  rationale: புலம்பலும் வினாவும் கலந்த நேரடியான கேள்வியை இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளே
  rationale: விளித்தொடரையும் எபிரெயக் கட்டுத்தொடரையும் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: הָיְתָה זֹּאת
  choice: இது … நிகழ்ந்தது
  rationale: சொல்லுக்கு சொல் ‘இது இருந்தது’ என்பதற்குப் பதிலாக, நிகழ்வைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: இடத்தையும் தேசியக் குழுவுக்குள்ளான நிகழ்வையும் சுருக்கமாகக் காக்கிறது.
- source_word: לְהִפָּקֵד
  choice: இல்லாமற்போகும்படி
  rationale: פקד என்பதன் Niphal வடிவம் இங்கு மொத்தக் குழுவிலிருந்து காணாமற்போதல் அல்லது குறைவுபடுதல் என்ற விளைவைச் சுட்டுகிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: கால வலியுறுத்தலை நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: מִיִּשְׂרָאֵל
  choice: இஸ்ரவேலிலிருந்து
  rationale: தேசிய முழுமையிலிருந்து பிரிதல் அல்லது இல்லாமற்போதல் என்ற מן முன்னிடைச்சொல்லின் பொருளைக் காக்கிறது.
- source_word: שֵׁבֶט אֶחָד
  choice: ஒரு கோத்திரம்
  rationale: இஸ்ரவேலின் பழங்குடி அலகைக் குறிக்கும் வேதாகமச் சூழலுக்கு ஏற்ற, பரவலாகப் புரிந்துகொள்ளப்படும் சொல்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: לְהִפָּקֵד என்பதன் நோக்கம்/விளைவு சார்ந்த நுட்பம்
  choice: இல்லாமற்போகும்படி
  alternative: காணாமற்போனது ஏன்?
  rationale: לְ infinitive அமைப்பின் விளைவு அல்லது நிகழ்வின் தன்மையைத் தமிழ் வாக்கியத்தில் காக்கிறது; இது கடவுளின் நோக்கம் என்று தீர்மானித்துச் சொல்லவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், புலம்பல் நிறைந்த நேரடி வேண்டுதலின் கண்ணியமான தொனி காக்கப்பட்டது. ‘கோத்திரம்’ என்பது சூழலுக்கேற்ற மரபுச் சொலாக வைத்துக்கொள்ளப்பட்டது; வாக்கிய அமைப்பு சாதாரண வாசகருக்குப் புரியுமாறு இயல்பாக்கப்பட்டது.
