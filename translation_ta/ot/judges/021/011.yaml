  text: וְ/זֶ֥ה הַ/דָּבָ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ כָּל זָכָ֗ר וְ/כָל אִשָּׁ֛ה יֹדַ֥עַת מִשְׁכַּב זָכָ֖ר תַּחֲרִֽימוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/011.yaml
  text: 'And this is what you shall do: every male[a], and every woman who has known the bed of a male[b], you shall devote to destruction.'
translation:
  language: ta
  text: 'நீங்கள் செய்ய வேண்டியது இதுதான்: ஆண்பாலினர் அனைவரையும், ஆணுடன் உடலுறவு கொண்ட ஒவ்வொரு பெண்ணையும்[a], அழிவுக்கென அர்ப்பணித்துவிடுங்கள்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘ஆணின் படுக்கையை அறிந்த ஒவ்வொரு பெண்ணையும்’; இது பாலுறவைக் குறிக்கும் மறைமுகச் சொல்லாட்சி.
    reason: lexical_alternative
  - marker: b
    text: ‘அழிவுக்கென அர்ப்பணித்தல்’ என்பதற்கான எபிரெயச் சொல், சாதாரணமாகக் கொல்வதை மட்டும் குறிக்காமல், அழிக்கப்படுவதற்காக ஒருவரைத் தடையின் கீழ் ஒதுக்குவதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה הַ/דָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: நீங்கள் செய்ய வேண்டியது இதுதான்
  rationale: எபிரெய மொழியின் அறிவுறுத்தல் வலிமையை இயல்பான நவீனத் தமிழில் தருகிறது; தொடக்க இணைப்புச்சொல்லைத் தமிழில் கட்டாயமாகச் சேர்க்காமல் கதையோட்டத்தைத் தொடர்கிறது.
- source_word: כָּל זָכָר
  choice: ஆண்பாலினர் அனைவரையும்
  rationale: זָכָר என்பது வயதுவந்த ஆண்களை மட்டும் அல்லாமல் ஆண்பாலினரைக் குறிக்கிறது. ஆகவே ‘ஆண்கள்’ என்பதைவிட இத்தேர்வு விரிவான மூலப்பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: וְ/כָל אִשָּׁה
  choice: ஒவ்வொரு பெண்ணையும்
  rationale: אִשָּׁה இங்கு பாலுறவு அனுபவத்தால் வரையறுக்கப்படும் பெண்ணைக் குறிக்கிறது; ‘மனைவி’ என்பது அளவுக்கு மீறிய குறிப்பாக்கமாக இருக்கும்.
- source_word: יֹדַעַת מִשְׁכַּב זָכָר
  choice: ஆணுடன் படுக்கையைப் பகிர்ந்த
  rationale: பாலுறவைக் குறிக்கும் எபிரெய மறைமுகச் சொல்லாட்சியை இயல்பான, கண்ணியமான தமிழில் காக்கிறது. வெளிப்படையான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תַּחֲרִימוּ
  choice: அழிவுக்கென அர்ப்பணித்துவிடுங்கள்
  rationale: חרם என்பதன் ஹிஃபில் வடிவம் சாதாரணமாகக் கொல்வதை மட்டுமல்ல, அழிக்கப்படுவதற்காகத் தடையின் கீழ் ஒதுக்குவதைச் சுட்டுகிறது. ‘அர்ப்பணித்துவிடுங்கள்’ அந்தத் தொழில்நுட்பமான மத-போரியல் நுணுக்கத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: போர்/தீர்ப்புச் சூழலில் חרם என்பதன் மொழிபெயர்ப்பு
  choice: அழிவுக்கென அர்ப்பணித்துவிடுங்கள்
  alternative: முற்றிலும் அழித்துவிடுங்கள்; அழிவுத் தடையின் கீழ் வையுங்கள்
  rationale: இச்சொல் சாதாரணக் கொலையைவிட அதிகமாக, ஒருவரை அழிவுக்குரிய தடையின் கீழ் ஒதுக்குவதைக் குறிக்கிறது. தேர்ந்த மொழிபெயர்ப்பு அந்தச் சட்ட-சமய நுணுக்கத்தைத் தமிழில் ஓரளவு வெளிப்படையாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியக்கூடிய நடை. பாலுறவுக்கான மூலத்தின் மறைமுகச் சொல்லாட்சி முதன்மை உரையில் காக்கப்பட்டு, அதன் வெளிப்படையான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. חרם என்பதன் தொழில்நுட்ப நுணுக்கம் எளிய ‘கொல்லுங்கள்’ என்று சுருக்கப்படவில்லை.
