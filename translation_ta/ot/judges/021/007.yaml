base_translation:
  language: en
  yaml_path: translation/ot/judges/021/007.yaml
  text: What shall we do for them—for those who remain—to get wives? For we have sworn by Yahweh not to give them any of our daughters as wives.
translation:
  language: ta
  text: எஞ்சியிருப்பவர்களான அவர்களுக்கு மனைவிகள் கிடைக்க நாம் என்ன செய்வது?[a] ஏனெனில், நம் மகள்களில் எவரையும் அவர்களுக்கு மனைவியாகக் கொடுக்கக்கூடாது என்று யாவே பெயரில் நாம் சத்தியம் செய்திருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, “மனைவிகளுக்காக”; சூழலில் மறைந்திருக்கும் பொருள் தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נַּעֲשֶׂה
  choice: நாம் என்ன செய்வது?
  rationale: מַה உடன் வரும் முதல் நபர் பன்மை imperfect, மேற்கொள்ள வேண்டிய செயலைப் பற்றிய ஆலோசனை வினாவைக் குறிக்கிறது. இத்தமிழ் வடிவம் அந்த ஆலோசனைத் தொனியை இயல்பாகத் தருகிறது.
- source_word: לָהֶם לַנּוֹתָרִים
  choice: எஞ்சியிருக்கும் அவர்களுக்கு
  rationale: לָהֶם என்பது அவர்களுடைய நலனுக்காகச் செய்யப்படுவதைச் சுட்டுகிறது; לַנּוֹתָרִים என்பது பென்யமீனில் உயிருடன் எஞ்சிய ஆண்களைக் குறிக்கும் பங்கேற்பெயர். இரண்டையும் இயல்பான தமிழ் தொடரில் ஒருங்கிணைக்கிறது.
- source_word: לְנָשִׁים
  choice: மனைவிகள் கிடைக்க
  rationale: முதல் இடத்தில் எபிரெயச் சொற்றொடர் சொற்படியாக ‘மனைவிகளுக்காக’ என்று நீள்விடுபட்ட அமைப்பில் உள்ளது. சூழலில் மறைந்திருக்கும் நோக்கத்தை ‘மனைவிகள் கிடைக்க’ என்று தமிழ் இயல்புக்கு ஏற்ப வெளிப்படுத்துகிறது; இதை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: וַאֲנַחְנוּ נִשְׁבַּעְנוּ
  choice: நாம் ... ஆணையிட்டிருக்கிறோமே
  rationale: கடந்த காலத்தில் செய்யப்பட்டு இன்னும் கட்டுப்படுத்தும் ஆணையை perfect வடிவம் குறிக்கிறது. வாக்கிய முடிவிலுள்ள ‘-ஓமே’ முந்தைய வினாவுக்கான சிக்கலின் காரணத்தை இயல்பாக உணர்த்துகிறது.
- source_word: בַיהוָה
  choice: யாவேமீது
  rationale: בְּ என்பது ஆணைச் சூத்திரத்தில் யார்மீது ஆணையிடப்பட்டது என்பதைக் குறிக்கிறது. יהוה என்ற தனிப்பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: לְבִלְתִּי תֵּת
  choice: கொடுக்கக் கூடாது என்று
  rationale: இந்த அமைப்பு ஆணையின் உள்ளடக்கமான தடையைச் சுட்டுகிறது. தமிழில் ஆணையின் நேரடி உள்ளடக்கமாக இவ்வாறு சொல்வது தெளிவும் இயல்பும் உடையது.
- source_word: מִבְּנוֹתֵינוּ
  choice: நம் மகள்களில் எவரையும்
  rationale: 'מִן இங்கு பகுதிப்பொருளில் வருகிறது: மகள்களின் தொகுதியிலிருந்து ஒருவரைக்கூட கொடுக்கக் கூடாது. ‘எவரையும்’ அதன் பரவலான மறுப்பைத் தெளிவாகக் காட்டுகிறது.'
- source_word: לְנָשִׁים
  choice: மனைவியாக
  rationale: இரண்டாம் occurrence, மகள்களைக் கொடுப்பதன் திருமண நோக்கம் அல்லது நிலையைச் சுட்டுகிறது. ஒருமை ‘எவரையும்’ என்பதுடன் ‘மனைவியாக’ இலக்கணமாகப் பொருந்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை நான்கெழுத்து இறைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. பொதுப்பட்டத்தால் மாற்றாமல் உடன்படிக்கைப் பெயரை ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: நிகழ்வை நெறிமுறைப்படி நியாயப்படுத்துகிறதா என்ற கேள்வி
  choice: ஆலோசனையையும் ஆணையையும் விவரிப்பதாக மட்டும் மொழிபெயர்த்தல்
  alternative: அவர்களுடைய செயலை ஏற்றுக்கொள்ளும் அல்லது கண்டிக்கும் மொழியைச் சேர்த்தல்
  rationale: வசனம் கதாபாத்திரங்களின் சிக்கலையும் முந்தைய ஆணையையும் பதிவு செய்கிறது; இவ்வசனத்திலேயே வெளிப்படையாக இல்லாத நெறிமுறைத் தீர்ப்பை மொழிபெயர்ப்பில் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எஞ்சியிருக்கும்’ என்பது பங்கேற்பெயரின் வடிவத்தைப் பாதுகாக்கிறது; ‘ஆணையிட்டிருக்கிறோமே’ என்பது கடந்த ஆணையின் தொடரும் கட்டுப்பாட்டையும் காரணத் தொனியையும் தருகிறது.
