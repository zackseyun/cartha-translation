  text: וּ/רְאִיתֶ֗ם וְ֠/הִנֵּה אִם יֵ֨צְא֥וּ בְנוֹת שִׁילוֹ֮ לָ/ח֣וּל בַּ/מְּחֹלוֹת֒ וִֽ/יצָאתֶם֙ מִן הַ/כְּרָמִ֔ים וַ/חֲטַפְתֶּ֥ם לָ/כֶ֛ם אִ֥ישׁ אִשְׁתּ֖/וֹ מִ/בְּנ֣וֹת שִׁיל֑וֹ וַ/הֲלַכְתֶּ֖ם אֶ֥רֶץ בִּנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/021.yaml
  text: Watch[a], and behold, when the daughters of Shiloh come out to dance in the dances, then come out from the vineyards and seize for yourselves, each man his wife from the daughters of Shiloh, and go to the land of Benjamin.
translation:
  language: ta
  text: கவனியுங்கள்; இதோ, சீலோவின் மகள்கள் நடனங்களில் நடனமாட வெளியே வரும்போது, திராட்சைத்தோட்டங்களிலிருந்து வெளியே வந்து, உங்களில் ஒவ்வொருவனும் சீலோவின் மகள்களில் ஒருத்தியைத் தனக்கு மனைவியாகப் பறித்துக்கொள்ளுங்கள்[a]; பின்னர் பென்யமீன் நாட்டுக்குப் போங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வலுக்கட்டாயமாகப் பிடித்துக்கொள்ளுங்கள்,’ ‘தூக்கிச் செல்லுங்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினை திடீரெனப் பலவந்தமாக எடுத்துக்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: நீங்கள் கவனித்துக்கொண்டிருங்கள்
  rationale: சொல்லர்த்தமாக ‘நீங்கள் பார்ப்பீர்கள்’ என்றாலும், பதுங்கிக் காத்திருக்கும் இந்த அறிவுறுத்தல் தொடரில் கவனமாகக் கண்காணிக்கும்படியான கட்டளையாகச் செயல்படுகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: நிகழவிருப்பதற்குக் கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் குறியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִם יֵצְאוּ
  choice: வெளியே வரும்போது
  rationale: אִם வடிவத்தில் நிபந்தனையைக் குறித்தாலும், திட்டமிடப்பட்ட நிகழ்வின் நேரத்தை இச்சூழலில் சுட்டுவதால் ‘வரும்போது’ என்பது இயல்பாக உள்ளது; நிகழ்வு நிச்சயமாக நடக்கும் என்று தேவையின்றி வலுப்படுத்தவில்லை.
- source_word: בְנוֹת שִׁילוֹ
  choice: சீலோவின் மகள்கள்
  rationale: இளம் பெண்களைக் குறிக்கும் ஊர் சார்ந்த எபிரெய சமூக மரபுத்தொடரை அதன் மூல வடிவத்துக்கு நெருக்கமாக வைத்திருக்கிறது; வயதை மேலதிகமாக ஊகிக்கவில்லை.
- source_word: לָחוּל בַּמְּחֹלוֹת
  choice: நடனமாடுவதற்காக
  rationale: வினையும் தொடர்புடைய பன்மை பெயர்ச்சொல்லும் நடன நிகழ்வைக் குறிக்கின்றன. எபிரெயின் மறுபடியான சொல்லமைப்பை அப்படியே கொண்டு வந்து செயற்கையான தமிழாக்கம் உருவாக்காமல், அதன் பொருளைத் தெளிவாக அளிக்கிறது.
- source_word: וַחֲטַפְתֶּם
  choice: வலுக்கட்டாயமாகப் பிடித்துக்கொண்டு
  rationale: חטף திடீரெனவும் பலவந்தமாகவும் ஒருவரைப் பிடித்தெடுப்பதைக் குறிக்கிறது. தமிழில் வெறும் ‘பிடித்துக்கொண்டு’ என்பதால் வன்முறை மறையக்கூடும் என்பதால், வினையின் பலவந்தத் தன்மை வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
- source_word: אִישׁ אִשְׁתּוֹ
  choice: ஒவ்வொருவரும் ... ஒருத்தியைத் தனக்கு மனைவியாக
  rationale: ஆண் ஒருவருக்கு ஒரு பெண் என்ற எபிரெயின் ஒருமை-பகிர்ந்தளிப்பு அமைப்பை இயல்பான நவீன தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: אֶרֶץ בִּנְיָמִן
  choice: பென்யமீன் நாட்டுக்கு
  rationale: பழங்குடியினருக்குரிய நிலப்பகுதியைக் குறிக்கும் எபிரெய சொற்றொடரின் நேரடியான, இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: பாலினத்தைக் குறிக்கும் பகிர்ந்தளிப்பு மொழி
  choice: ஒவ்வொருவரும் ... ஒருத்தியைத் தனக்கு மனைவியாக
  alternative: உங்களில் ஒவ்வொருவரும் ஒரு மனைவியை
  rationale: மூல எபிரெயம் ஆண்களையும் அவர்கள் தமக்காக எடுத்துக்கொள்ளும் பெண்களையும் வெளிப்படையாகக் குறிக்கிறது. இதை பாலினப் பொதுமைப்படுத்தலால் மறைக்காமல், தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- issue: பெண்களைப் பலவந்தமாக எடுத்துச் செல்லும் செயலை விவரித்தல்
  choice: வலுக்கட்டாயமாகப் பிடித்துக்கொண்டு
  alternative: கடத்திக்கொண்டு
  rationale: வசனம் கூறும் செயல் வன்முறையானது; மொழிபெயர்ப்பு அதை மென்மைப்படுத்தக் கூடாது. அதேவேளை, மூல வினையைத் தாண்டிய நவீன சட்ட வகைப்பாட்டை முதன்மை உரையில் சேர்க்காமல் அதன் பலவந்தத் தன்மையைத் துல்லியமாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடையைப் பயன்படுத்துகிறது. ‘சீலோவின் மகள்கள்’ என்ற மூல சமூக மரபுத்தொடர் காக்கப்பட்டுள்ளது; அதே நேரத்தில் எபிரெய சொல் மறுபடிகளைச் செயற்கையாகப் பிரதியெடுக்காமல் இயல்பான தமிழ் வாக்கிய ஓட்டம் பேணப்பட்டுள்ளது.
