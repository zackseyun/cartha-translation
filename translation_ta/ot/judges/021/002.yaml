source:
  edition: WLC
  text: וַ/יָּבֹ֤א הָ/עָם֙ בֵּֽית אֵ֔ל וַ/יֵּ֤שְׁבוּ שָׁם֙ עַד הָ/עֶ֔רֶב לִ/פְנֵ֖י הָ/אֱלֹהִ֑ים וַ/יִּשְׂא֣וּ קוֹלָ֔/ם וַ/יִּבְכּ֖וּ בְּכִ֥י גָדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/002.yaml
  text: Then the people came to Bethel and sat there before God until evening[a], and they raised their voices and wept with great weeping.
translation:
  language: ta
  text: பின்பு மக்கள் பெத்தேலுக்கு வந்து, மாலைவரை அங்கே கடவுளின் முன்னிலையில் அமர்ந்திருந்தார்கள். அவர்கள் குரலெழுப்பிப் பெரிதும் அழுதார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘மிகுந்த அழுகையாய் அழுதார்கள்’; எபிரெயத்தில் ஒரே வேர்ச்சொல்லைக் கொண்ட சொற்கள் அழுகையின் தீவிரத்தை வலியுறுத்துகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்து
  rationale: בוא இங்கு ஒரு இடத்தை வந்தடைவதைக் குறிக்கிறது; தமிழ்க் கதைநடையில் ‘வந்து’ இயல்பாக உள்ளது, ‘நுழைந்து’ என்பது மூலத்தில் இல்லாத துல்லியத்தைச் சேர்க்கும்.
- source_word: הָעָם
  choice: மக்கள்
  rationale: עם இங்கு கூடியிருந்த இஸ்ரவேலரை ஒட்டுமொத்தமாகக் குறிக்கிறது; படையினரை மட்டும் குறிக்கவில்லை.
- source_word: בֵּית אֵל
  choice: பெத்தேல்
  rationale: இது இவ்வசனத்தில் ‘கடவுளின் வீடு’ என்ற பொதுப்பெயர்ச் சொற்றொடர் அல்ல, இடப்பெயர்.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: அங்கே ... அமர்ந்திருந்தார்கள்
  rationale: ישב என்பதன் உடல்சார்ந்த ‘அமர்தல்’ உணர்வையும், மாலைவரை தொடர்ந்திருந்த காலநீட்சியையும் இவ்வடிவம் வெளிப்படுத்துகிறது.
- source_word: עַד הָעֶרֶב
  choice: மாலைவரை
  rationale: கால எல்லையைக் குறிக்கும் எளிய, இயல்பான தமிழ் வடிவம்.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: கடவுளின் முன்னிலையில்
  rationale: לפני என்பதன் சந்நிதி/முன்னிலை உணர்வை இயல்பான தமிழில் தருகிறது; האלהים என்பதால் ‘கர்த்தர்’ என மாற்றப்படவில்லை.
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: குரலெழுப்பி
  rationale: ‘தங்கள் குரலை உயர்த்தினார்கள்’ என்ற எபிரெய மொழிவழக்கின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וַיִּבְכּוּ בְּכִי גָדוֹל
  choice: பெரிதும் அழுதார்கள்
  rationale: ஒரே வேர்ச்சொல்லைக் கொண்ட வினை-பெயர் அமைப்பு அழுகையின் தீவிரத்தை வலியுறுத்துகிறது; ‘பெரிதும் அழுதார்கள்’ அந்த வலியுறுத்தலை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: வழிபாட்டுச் சூழலில் הָאֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: கர்த்தர்
  rationale: மூல உரையில் YHWH என்ற இறைப்பெயர் அல்ல, האלהים உள்ளது. ஆகவே வழிபாட்டுச் சூழல் இருந்தாலும் ‘கர்த்தர்’ என்று ஒத்திசைக்காமல் ‘கடவுள்’ எனப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை. ‘கடவுளின் முன்னிலையில்’ என்பது மூலத்தின் சந்நிதி மொழியைப் பாதுகாக்கிறது; இறுதி எபிரெய வலியுறுத்தல் முதன்மை உரையில் இயல்பாகவும் அடிக்குறிப்பில் வடிவரீதியாகவும் காட்டப்பட்டுள்ளது.
