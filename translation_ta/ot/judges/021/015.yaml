translation:
  language: ta
  text: மக்கள் பென்யமீனுக்காக மனம் வருந்தினார்கள்; ஏனெனில் ஆண்டவர் இஸ்ரவேலின் கோத்திரங்களிடையே ஒரு பிளவை உண்டாக்கியிருந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִחָם
  choice: மனம் வருந்தினார்கள்
  rationale: இங்கு நிஃபால் வடிவம் பென்யமீனின் நிலையை எண்ணி வருந்துதல் அல்லது துயரப்படுதல் என்ற பொருளைத் தருகிறது; சூழலுக்கு ஏற்ற இயல்பான தமிழாக இவ்வாறு வழங்கப்பட்டது.
- source_word: פֶּרֶץ
  choice: பிளவு
  rationale: ஒருங்கிணைந்திருந்த இஸ்ரவேல் கோத்திரங்களுக்குள் ஏற்பட்ட முறிவு அல்லது இடைவெளியைச் சித்தரிக்கும் எபிரெய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தெய்வீகப் பெயரான YHWH-ஐ மரியாதைமிக்க, வழக்கிலுள்ள தமிழ் வேதாகம நடையில் வழங்குகிறது.
theological_decisions:
- issue: கோத்திரங்களிடையே ஏற்பட்ட பிளவுக்கும் ஆண்டவருக்கும் இடையிலான காரணத் தொடர்பு
  choice: ஆண்டவர் ... ஒரு பிளவை உண்டாக்கியிருந்தார்
  alternative: ஆண்டவர் ஒரு பிளவு ஏற்பட அனுமதித்திருந்தார்
  rationale: எபிரெய உரை עָשָׂה (‘செய்தார்/உண்டாக்கினார்’) என்று நேரடியாகக் கூறுகிறது. அந்தத் தெய்வீகச் செயற்பாட்டை ‘அனுமதித்தார்’ என்று மென்மையாக்காமல், உரையின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், மரியாதைமிக்க வேதாகம நடை. ‘மனம் வருந்தினார்கள்’ என்பது உணர்ச்சியை இயல்பாகச் சொல்கிறது; ‘பிளவு’ மூல உருவகத்தைத் தக்கவைக்கிறது.
