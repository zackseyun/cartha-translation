base_translation:
  language: en
  yaml_path: translation/ot/judges/005/020.yaml
  text: From heaven the stars fought[b][a]; from their courses they fought against Sisera.
translation:
  language: ta
  text: வானத்திலிருந்து நட்சத்திரங்கள் போரிட்டன; தங்கள் பாதைகளிலிருந்து அவை சிசெராவுக்கு எதிராகப் போரிட்டன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தங்கள் பாதைகளிலிருந்து” என்பது “தங்கள் வானப் பாதைகளிலிருந்து” என்றும் பொருள்படலாம்; எபிரெயச் சொல் சாலைகள், பாதைகள் அல்லது செல்லும் வழிகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן שָׁמַיִם
  choice: வானத்திலிருந்து
  rationale: எபிரெயச் சொற்றொடரின் இயல்பான பொருளை நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: נִלְחָמוּ
  choice: போரிட்டன
  rationale: போரில் ஈடுபடுதல் என்ற பொருளைத் தெளிவாகக் கூறுவதோடு, வசனத்தின் கவிதைமிகு மறுபடியும் கூறுதலையும் காக்கிறது.
- source_word: הַכּוֹכָבִים
  choice: நட்சத்திரங்கள்
  rationale: குறிப்பிட்டுள்ள வானத்து நட்சத்திரங்களை மேலதிக விளக்கமின்றி நேரடியாகக் குறிக்கிறது.
- source_word: מִמְּסִלּוֹתָם
  choice: தங்கள் பாதைகளிலிருந்து
  rationale: מְסִלּוֹת என்பதன் ‘சாலைகள்/பாதைகள்/செல்லும் வழிகள்’ என்ற உருவகத்தை இயல்பான தமிழில் காக்கிறது; இங்கு அது நட்சத்திரங்களின் வானப் பாதைகளைக் குறிக்கலாம்.
- source_word: עִם סִיסְרָא
  choice: சிசெராவுக்கு எதிராக
  rationale: עִם என்பதன் அடிப்படைப் பொருள் ‘உடன்’ என்றாலும், לחם உடனான போர்ச் சூழலில் எதிராளியைக் குறிக்கிறது; தமிழில் ‘எதிராக’ என்பது கருத்தைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: போரில் நட்சத்திரங்கள் பங்கேற்றதன் இயல்பு
  choice: நட்சத்திரங்கள் போரிட்டன என்ற கவிதைப் படிமத்தை விளக்கி வரையறுக்காமல் அப்படியே வைத்தல்
  alternative: நேரடியான விண்மீன் தலையீடு, வானதூதர்/வானப்படை உருவகம், அல்லது இறைப் பராமரிப்பின்கீழ் இயற்கை ஆற்றல்கள் செயல்பட்டதற்கான கவிதை உருவகம்
  rationale: எபிரெயப் பாடல் நட்சத்திரங்கள் போரிட்டதாகக் கூறுகிறது; அது எவ்வாறு நிகழ்ந்தது என்பதை வரையறுப்பதில்லை. எனவே மொழிபெயர்ப்பு அந்தத் தெளிவின்மையையும் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பாடலுக்குரிய உயர்வும் எளிய புரிதலும் சமநிலைப்படுத்தப்பட்டுள்ளன. ‘போரிட்டன’ என்ற மறுபயன்பாடு மூலத்தின் கவிதை இணைநிலையைப் பாதுகாக்கிறது.
