translation_notes:
  register: நவீனத் தரத் தமிழில், பாடலுக்குரிய சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் நடை. ‘பெருவழிகள்’ மற்றும் ‘சுற்றுவழிகள்’ என்ற சொற்கள் சாதாரண முக்கியப் பாதைகளுக்கும் தவிர்த்து செல்லப்பட்ட மறைமுகப் பாதைகளுக்கும் உள்ள வேறுபாட்டை தெளிவுபடுத்துகின்றன.
