  text: בִּ/ימֵ֞י שַׁמְגַּ֤ר בֶּן עֲנָת֙ בִּ/ימֵ֣י יָעֵ֔ל חָדְל֖וּ אֳרָח֑וֹת וְ/הֹלְכֵ֣י נְתִיב֔וֹת יֵלְכ֕וּ אֳרָח֖וֹת עֲקַלְקַלּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/006.yaml
  text: In the days of Shamgar son of Anath[a], in the days of Jael, the highways were deserted[b], and travelers went by roundabout paths.
translation:
  language: ta
  text: ஆனாத்தின் மகன் சம்காரின் நாட்களிலும், யாகேலின் நாட்களிலும், பெருவழிகள் வெறிச்சோடின[a]; வழிப்போக்கர்கள் சுற்றுவழிகளில் சென்றார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வழிகள் ஒழிந்துபோயின”—அதாவது, முக்கிய வழிகளில் வழக்கமான போக்குவரத்து நின்றுபோனது.
    reason: lexical_alternative
  - marker: b
    text: “சுற்றுவழிகள்” என்பது அறநெறியில் தவறான வழிகளைக் குறிப்பதல்ல; பாதுகாப்புக்காகப் பயன்படுத்தப்பட்ட நேரடியல்லாத பக்கவழிகளை இது குறித்திருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: בִּימֵי
  choice: நாட்களிலும்
  rationale: ஒருவர் வாழ்ந்த அல்லது செயல்பட்ட காலப்பகுதியைக் குறிக்கும் எபிரெய கால மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: ஆனாத்தின் மகன் சம்கார்
  rationale: தனிப்பெயர்களைத் தமிழில் ஒலிபெயர்த்து, בֶּן என்பதை தெளிவாக ‘மகன்’ என்று மொழிபெயர்க்கிறது.
- source_word: יָעֵל
  choice: யாகேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை பிரதிபலிக்கிறது.
- source_word: חָדְלוּ אֳרָחוֹת
  choice: பெருவழிகள் வெறிச்சோடின
  rationale: வழிகள் நேரடியாக ‘நின்றன’ என்பதற்குப் பதிலாக, அவற்றில் வழக்கமான போக்குவரத்து நின்றுபோன விளைவை இயல்பான தமிழில் தெரிவிக்கிறது; நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הֹלְכֵי נְתִיבוֹת
  choice: வழிப்போக்கர்கள்
  rationale: சொல்லுக்குச் சொல் ‘பாதைகளில் செல்பவர்கள்’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: יֵלְכוּ
  choice: சென்றார்கள்
  rationale: பாடல் வடிவிலான கடந்தகாலச் சூழலில் வழக்கமாக நடந்த செயலைத் தமிழ் இறந்தகாலத்தில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֳרָחוֹת עֲקַלְקַלּוֹת
  choice: சுற்றுவழிகளில்
  rationale: வளைந்து செல்லும் அல்லது நேரடியல்லாத வழிகளைச் சுட்டுகிறது; அறநெறி சார்ந்த ‘கோணலான’ என்ற தவறான உட்பொருளைத் தவிர்க்கிறது.
