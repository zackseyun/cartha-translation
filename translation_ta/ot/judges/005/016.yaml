revisions:
- from: மந்தைத் தொழுவங்களுக்கு நடுவே நீ ஏன் உட்கார்ந்திருந்தாய்? மந்தைகளை அழைக்கும் சீழ்க்கை ஒலிகளைக் கேட்டுக்கொண்டிருக்கவா? ரூபேனின் பிரிவுகளிடையே[a] உள்ளத்தின் ஆழ்ந்த ஆராய்ச்சிகள் மிகுந்திருந்தன.
  to: மந்தைத் தொழுவங்களுக்கு நடுவே நீ ஏன் உட்கார்ந்திருந்தாய்? மந்தைகளை அழைக்கும் சீழ்க்கை ஒலிகளைக் கேட்டுக்கொண்டிருக்கவா? ரூபேனின் பிரிவுகளுக்குள் உள்ளத்தில் பெரும் ஆராய்ச்சிகள் இருந்தன.[a]
  rationale: The revision corrects the Tamil relation expressed by the Hebrew preposition in the final clause, preserves the lexical ambiguity of פְלַגּוֹת in the anchored footnote, and renders ‘great searchings of heart’ with a more direct modern-Tamil equivalent. No doctrinal interpretation has been introduced.
