base_translation:
  language: en
  yaml_path: translation/ot/judges/005/016.yaml
  text: Why did you sit among the sheepfolds[a], to hear the whistling for the flocks? For the divisions of Reuben there were great searchings of heart.
translation:
  language: ta
  text: மந்தைத் தொழுவங்களுக்கு நடுவே நீ ஏன் உட்கார்ந்திருந்தாய்? மந்தைகளை அழைக்கும் சீழ்க்கை ஒலிகளைக் கேட்டுக்கொண்டிருக்கவா? ரூபேனின் பிரிவுகளுக்குள் உள்ளத்தில் பெரும் ஆராய்ச்சிகள் இருந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ரூபேனின் நீரோடைகளருகே உள்ளத்தில் பெரும் ஆராய்ச்சிகள் இருந்தன.” எபிரெயச் சொல் “பிரிவுகள்” அல்லது “நீரோடைகள்” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: ஏன்
  rationale: ரூபேனின் செயலின்மைக்கான காரணத்தைக் கேட்கும் நேரடியான வினாவை இயல்பாகவும் துல்லியமாகவும் தருகிறது.
- source_word: יָשַׁבְתָּ
  choice: நீ உட்கார்ந்திருந்தாய்
  rationale: ‘உட்கார்/தங்கு’ என்ற வினையின் கண்முன் நிற்கும் உருவகத்தையும் கவிதையின் கண்டனத் தொனியையும் காக்கிறது.
- source_word: בֵּין הַמִּשְׁפְּתַיִם
  choice: மந்தைத் தொழுவங்களுக்கு நடுவே
  rationale: அடுத்துவரும் மந்தைகள் குறித்த சொல்லுடன் பொருந்தும் பாரம்பரியமான மேய்ப்புச் சூழலைக் காட்டுகிறது; ‘நடுவே’ என்பது எபிரெய ‘இடையில்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לִשְׁמֹעַ
  choice: கேட்டுக்கொண்டிருக்கவா
  rationale: நோக்கத்தைக் குறிக்கும் வினையெச்சத்தை தொடரும் வினாவாக அமைத்து, செயலின்றித் தங்கியிருந்ததைச் சாடும் தொனியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁרִקוֹת עֲדָרִים
  choice: மந்தைகளை அழைக்கும் சீழ்க்கை ஒலிகள்
  rationale: இச்சொற்றொடர் மந்தைகளுக்காக எழுப்பப்படும் விசில் அல்லது குழலொத்த மேய்ப்பரின் அழைப்பொலிகளைக் குறிக்கலாம்; ‘சீழ்க்கை ஒலிகள்’ மூலத்தின் ஒலிப்படிமத்தைக் காக்கிறது.
- source_word: לִפְלַגּוֹת רְאוּבֵן
  choice: ரூபேனின் பிரிவுகளிடையே
  rationale: פְלַגּוֹת என்பதன் ‘பிரிவுகள்’ என்ற பொருளையும், ரூபேன் கோத்திரத்தின் பிளவு அல்லது தயக்கத்தையும் வெளிப்படுத்துகிறது; ‘நீரோடைகள்’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: גְּדוֹלִים חִקְרֵי לֵב
  choice: உள்ளத்தின் ஆழ்ந்த ஆராய்ச்சிகள் மிகுந்திருந்தன
  rationale: உள்ளார்ந்த ஆய்வு, சிந்தனை அல்லது தயக்கம் எனப் பொருள்படும் கவிதை உருவகத்தைக் காத்து, גְּדוֹלִים தரும் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
