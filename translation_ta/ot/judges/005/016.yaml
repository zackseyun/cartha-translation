  register: நவீனத் தரநிலைத் தமிழில், பாடலுக்குரிய கண்ணியமான கவித்துவத் தொனியும் கண்டன வினாவின் வலிமையும் காக்கப்பட்டுள்ளன. புரிதலுக்காகச் சிறிதளவு இயல்பாக்கப்பட்டாலும், மூலத்தின் சொற்படிமங்களும் பொருள் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
