  register: நவீன நிலையான தமிழில், கவிதைநயம் மற்றும் இரு அடிகளின் இணையான அமைப்பு காக்கப்பட்டுள்ளன. ‘ஸ்திரீ’ போன்ற பழைய சொற்களுக்கு மாறாக ‘பெண்கள்’ பயன்படுத்தப்பட்டுள்ளது; தனிப்பெயர்கள் பொதுவாக அறியப்பட்ட தமிழ் வேதாகம ஒலிபெயர்ப்பு மரபைத் தொடர்கின்றன.
