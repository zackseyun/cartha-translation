  text: תְּבֹרַךְ֙ מִ/נָּשִׁ֔ים יָעֵ֕ל אֵ֖שֶׁת חֶ֣בֶר הַ/קֵּינִ֑י מִ/נָּשִׁ֥ים בָּ/אֹ֖הֶל תְּבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/024.yaml
  text: Most blessed among women is Jael[a], the wife of Heber the Kenite; among women in the tent[b], most blessed is she.
translation:
  language: ta
  text: பெண்களுள் மிகவும் ஆசீர்வதிக்கப்பட்டவள் யாகேல்[a], கேனியனான ஏபேரின் மனைவி; கூடாரத்தில் பெண்களுள்[b] மிகவும் ஆசீர்வதிக்கப்பட்டவள் அவளே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெண்களைவிட ஆசீர்வதிக்கப்பட்டவள் யாகேல் … கூடாரத்தில் பெண்களைவிட ஆசீர்வதிக்கப்பட்டவள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய ஒப்பீட்டுக் கட்டமைப்பு ‘பெண்களுள்’ அல்லது ‘பெண்களைவிட’ என்ற இரு பொருள்களையும் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘கூடாரத்தில்.’ இது கூடாரவாழ் பெண்களை நினைவூட்டும் வழக்காக இருக்கலாம்; எனினும் எபிரெயில் ‘கூடாரம்’ ஒருமையில் உள்ளது.
    reason: cultural_note
lexical_decisions:
- source_word: תְּבֹרַךְ / תְּבֹרָךְ
  choice: மிகவும் ஆசீர்வதிக்கப்பட்டவள்
  rationale: ברך என்பதன் Pual வடிவம் ‘ஆசீர்வதிக்கப்பட்டவள்’ அல்லது ‘போற்றப்பட்டவள்’ என்ற பொருளைத் தருகிறது. מִן + נשים என்ற ஒப்பீட்டுக் கட்டமைப்புடன் வருவதால், உயர்நிலை ஒப்பீட்டு வலிமையை வெளிப்படுத்த ‘மிகவும்’ சேர்க்கப்பட்டுள்ளது; இரண்டாம் வரியிலும் வினைச்சொல்லின் கவிதைமிகு மறுபதிப்பு காக்கப்பட்டுள்ளது.
- source_word: מִנָּשִׁים
  choice: பெண்களுள்
  rationale: מִן இங்கு ஒப்பீட்டை அல்லது ஒரு குழுவுக்குள் சிறந்து நிற்பதைச் சுட்டலாம். ‘பெண்களுள்’ என்பது இயல்பான நவீனத் தமிழில் அந்த உயர்நிலைப் பொருளைத் தருகிறது; ‘பெண்களைவிட’ என்ற மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יָעֵל
  choice: யாகேல்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: אֵשֶׁת חֶבֶר הַקֵּינִי
  choice: கேனியனான ஏபேரின் மனைவி
  rationale: யாகேலைத் திருமண உறவாலும் இனக்குழுச் சேர்ந்ததாலும் அடையாளப்படுத்தும் எபிரெய இணைப்புத் தொடரைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: בָּאֹהֶל
  choice: கூடாரத்திலுள்ள
  rationale: மூலத்தில் ‘கூடாரத்தில்’ என்று ஒருமையில் உள்ளது. கூடாரவாழ் பெண்களை மறைமுகமாகக் குறிக்கக்கூடியிருந்தாலும், அந்த விளக்கத்தை நேரடியாக உரைக்குள் விரிவாக்காமல் ஒருமை காக்கப்பட்டுள்ளது.
