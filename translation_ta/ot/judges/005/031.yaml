base_translation:
  language: en
  yaml_path: translation/ot/judges/005/031.yaml
  text: So may all your enemies perish[a], O Yahweh, but may those who love him be like the rising of the sun in its strength[b]. And the land had rest forty years.
translation:
  language: ta
  text: “யாவே, உமது பகைவர்கள் அனைவரும் இவ்வாறே அழிந்துபோவார்களாக! ஆனால் அவரை நேசிப்பவர்கள், சூரியன் தன் வலிமையோடு உதிப்பதைப்போல் இருப்பார்களாக![a]” பின்பு நாடு நாற்பது ஆண்டுகள் அமைதியாக இருந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல்லாக, “சூரியன் தன் வலிமையில் புறப்படுவதுபோல்.” இரண்டாம் பகுதியில் வெளிப்படையான வினை இல்லை; எனவே “அவரை நேசிப்பவர்கள் ... போன்றவர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_and_grammatical_ambiguity
  - marker: b
    text: எபிரெயத்தில், “நாடு அமைதியாயிருந்தது.” நியாயாதிபதிகள் நூலில் இந்தச் சொற்றொடர் பொதுவாகப் போருக்குப் பிந்தைய அமைதி அல்லது ஓய்வுக் காலத்தைக் குறிக்கிறது.
    reason: idiom
lexical_decisions:
- source_word: כֵּן יֹאבְדוּ
  choice: இவ்வாறே அழிந்துபோவார்களாக
  rationale: כֵּן முந்தைய நிகழ்வைச் சுட்டும் ‘இவ்வாறே’ என்ற பொருளையும், יֹאבְדוּ இங்கு வேண்டுதல் சார்ந்த ‘அழிந்துபோவார்களாக’ என்ற வினை வலிமையையும் தருகிறது.
- source_word: כָל אוֹיְבֶיךָ
  choice: உமது பகைவர்கள் அனைவரும்
  rationale: இரண்டாம் நபர் ஒருமை ஆண்பால் பின்னொட்டை நேரடியான இறைமுகப்பாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பால் தருகிறது.
- source_word: וְאֹהֲבָיו
  choice: ஆனால் அவரை நேசிப்பவர்கள்
  rationale: எதிர்மறை ஒப்புமையை ‘ஆனால்’ தெளிவாக்குகிறது; எபிரெய மூன்றாம் நபர் சுட்டை ‘அவரை’ என்று பாதுகாக்கிறது.
- source_word: כְּצֵאת הַשֶּׁמֶשׁ בִּגְבֻרָתוֹ
  choice: சூரியன் தன் வலிமையோடு உதித்தெழுவதுபோல்
  rationale: יצא என்பதன் அடிப்படை ‘வெளிப்படுதல்/புறப்படுதல்’ படிமத்தை, சூரியனைப் பற்றிய சூழலில் இயல்பான ‘உதித்தெழுதல்’ எனத் தருகிறது; வலிமை என்ற படிமத்தையும் தக்கவைக்கிறது.
- source_word: וַתִּשְׁקֹט הָאָרֶץ
  choice: பின்பு நாடு ஓய்வு பெற்றது
  rationale: நியாயாதிபதிகள் நூலில் போர் முடிந்த பின் ஏற்பட்ட அமைதி மற்றும் ஓய்வைக் குறிக்கும் வழக்குச் சொற்றொடராக இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַרְבָּעִים שָׁנָה
  choice: நாற்பது ஆண்டுகள்
  rationale: கால அளவை நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயர்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் திருப்பெயரே இருப்பதால், அதை ஒலிபெயர்ப்பாகப் பாதுகாக்கிறது.
- issue: וְאֹהֲבָיו என்பதிலுள்ள சுட்டுப்பெயரின் நபர்நிலை
  choice: அவரை நேசிப்பவர்கள்
  alternative: உம்மை நேசிப்பவர்கள்
  rationale: முந்தைய பகுதியில் கடவுளை ‘உமது’ என்று நேரடியாக விளித்தபோதிலும், இங்கு எபிரெயம் மூன்றாம் நபருக்கு மாறுகிறது. அந்த இலக்கண மாற்றத்தையும் அதன் சாத்தியமான சொல்லாட்சித் தாக்கத்தையும் சீராக்காமல் பாதுகாக்கிறது.
- issue: அன்புகூருவோரைக் குறித்த இரண்டாம் பகுதியில் வேண்டுதல் வலிமை
  choice: இருப்பார்களாக
  alternative: இருப்பவர்கள்
  rationale: முதல் பகுதியின் வேண்டுதல் சார்ந்த வினைக்கு இணையாக இரண்டாம் பகுதியையும் வாழ்த்துரையாக வாசிப்பது பாடலின் முடிவுரைக்கு இயல்பானது; எபிரெயத்தில் இரண்டாம் பகுதியில் வெளிப்படையான வினை இல்லாததால் மாற்று வாசிப்பும் சாத்தியம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பாடலின் உயர்ந்த வேண்டுதல் தொனியைப் பாதுகாக்க ‘அழிந்துபோவார்களாக’, ‘இருப்பார்களாக’ ஆகிய வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘உமது’ என்பதிலிருந்து ‘அவரை’ என்பதற்கான மூலமொழி நபர்நிலை மாற்றம் திட்டமிட்டு அப்படியே வைக்கப்பட்டுள்ளது.
