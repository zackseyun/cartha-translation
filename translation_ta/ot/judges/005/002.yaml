source:
  edition: WLC
  text: בִּ/פְרֹ֤עַ פְּרָעוֹת֙ בְּ/יִשְׂרָאֵ֔ל בְּ/הִתְנַדֵּ֖ב עָ֑ם בָּרֲכ֖וּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/002.yaml
  text: When leaders took the lead in Israel, when the people volunteered, bless the LORD!
translation:
  language: ta
  text: 'இஸ்ரவேலில் தலைவர்கள் தலைமையேற்றபோது[a],

    மக்கள் மனமுவந்து முன்வந்தபோது,

    யெகோவாவைப் போற்றுங்கள்!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த எபிரெயச் சொற்றொடரின் பொருள் உறுதியாகத் தெரியவில்லை. இதை “இஸ்ரவேலில் தலைமுடி அவிழ விடப்பட்டபோது” என்றும் மொழிபெயர்க்கலாம்; அது போருக்காக அர்ப்பணித்துக்கொண்டதையோ கட்டுப்பாடின்றி இருந்த நிலையையோ குறிக்கக்கூடும்.
    reason: בִּפְרֹעַ פְּרָעוֹת என்பது அரிதான, பலவாறு புரிந்துகொள்ளப்பட்ட சொற்றொடர்; முதன்மை மொழிபெயர்ப்பு மட்டும் அதன் உண்மையான மொழியியல் தெளிவின்மையை மறைத்துவிடும்.
lexical_decisions:
- source_word: בִּפְרֹעַ פְּרָעוֹת
  choice: தலைவர்கள் தலைமையேற்றபோது
  rationale: எபிரெயச் சொற்றொடர் அரிதானதும் பொருள் தெளிவில்லாததும் ஆகும். பாடலின் இணைவரி மக்கள் தாமாக முன்வந்ததைச் சொல்வதால், இங்கு தலைவர்கள் முன்னின்று வழிநடத்தியதைக் குறிக்கும் பாரம்பரியப் பொருள் இயல்பாகப் பொருந்துகிறது; மூலத்தின் வினை–பெயர்ச்சொல் ஒலியிணைப்பைத் தமிழில் ‘தலைவர்கள் தலைமையேற்றபோது’ என ஓரளவு காக்கிறது.
- source_word: בְּהִתְנַדֵּב עָם
  choice: மக்கள் மனமுவந்து முன்வந்தபோது
  rationale: התנדב என்பது கட்டாயமின்றி தன்னார்வமாக முன்வருதலைக் குறிக்கிறது. ‘மனமுவந்து’ தன்னார்வத்தையும், ‘முன்வந்தபோது’ செயலில் பங்கேற்றதையும் வெளிப்படுத்துகிறது.
- source_word: בָּרֲכוּ
  choice: போற்றுங்கள்
  rationale: ברך என்பதன் இச்சூழலிலான கட்டளை வடிவம் கடவுளைப் புகழ்ந்து வாழ்த்துமாறு அழைக்கிறது; இயற்கையான தமிழ் துதிமொழியாக ‘போற்றுங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: மூலத்தில் பொதுப்பட்டமான ‘ஆண்டவர்’ அல்ல, தேவனுடைய தனிப்பெயரான יהוה உள்ளது. அதனைத் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என வெளிப்படையாகக் கொடுக்கிறது.
theological_decisions:
- issue: יהוה என்ற தேவப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: ஆண்டவர் / கர்த்தர்
  rationale: மூல எபிரெய உரையில் உள்ள தனிப்பெயரை பொதுப்பட்டமாக மாற்றாமல் பாதுகாக்கிறது; குறிப்பிட்ட உச்சரிப்பைச் சார்ந்த இறையியல் முடிவை இதனால் சேர்ப்பதில்லை.
- issue: בפרע פרעות என்ற தெளிவில்லாத சொற்றொடர்
  choice: தலைவர்கள் தலைமையேற்றபோது
  alternative: இஸ்ரவேலில் தலைமுடி அவிழ விடப்பட்டபோது / கட்டுப்பாடுகள் நீங்கியபோது
  rationale: இணைவரியின் தன்னார்வ முன்வருதலோடும் பாடலின் போர்ச் சூழலோடும் தலைமைப் பொருள் நன்றாகப் பொருந்துகிறது. இருப்பினும் மூலத்தின் உண்மையான தெளிவின்மையை அடிக்குறிப்பில் வெளிப்படையாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பாடலுக்கேற்ற சுருக்கமான மூன்று வரி அமைப்பும் கண்ணியமான துதிநடையும் பயன்படுத்தப்பட்டுள்ளன. ‘தலைவர்கள் தலைமையேற்றபோது’ என்ற சொல் மீளுரை, மூல எபிரெயத்தின் சொல்விளையாட்டை இயன்றவரை பிரதிபலிக்கிறது.
