  text: Village life ceased in Israel; it ceased until I[a], Deborah, arose—until I arose as a mother in Israel.
translation:
  language: ta
  text: இஸ்ரவேலில் கிராம வாழ்க்கை[a] ஓய்ந்துபோனது; தெபொராளாகிய நான் எழும்பும்வரை அது ஓய்ந்துபோனது—இஸ்ரவேலில் ஒரு தாயாக நான் எழும்பும்வரை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இஸ்ரவேலில் கிராமவாசிகள் இல்லாமற்போனார்கள்’ அல்லது ‘இஸ்ரவேலில் ஊரக மக்கள் இல்லாமற்போனார்கள்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயப் பெயர்ச்சொல் பொருளறியக் கடினமானது; அது கிராமவாசிகளையோ, விரிவாகக் கிராம வாழ்க்கையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדְלוּ / חָדֵלּוּ
  choice: ஓய்ந்துபோனது
  rationale: חדל என்ற வினை செயல் அல்லது நிலை முடங்கியதைக் குறிக்கிறது. இருமுறை வரும் கவிதைநடை மறுபதிப்பைத் தக்கவைத்தபடி, சமூக வாழ்வு செயலிழந்த சூழலுக்கு ‘ஓய்ந்துபோனது’ இயல்பாகப் பொருந்துகிறது.
- source_word: פְרָזוֹן
  choice: கிராம வாழ்க்கை
  rationale: இச்சொல் பொருளறியக் கடினமானது; கிராமவாசிகளையோ, மதிலற்ற ஊரகக் குடியிருப்பையோ, அங்குள்ள இயல்பு வாழ்க்கையையோ குறிக்கலாம். முதன்மை உரையில் ‘கிராம வாழ்க்கை’ என்பது பரந்த சமூகச் சீர்குலைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: ב இங்கு இடத்தைக் குறிக்கிறது. ‘இஸ்ரவேலில்’ என்பது தேசியச் சூழலை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: עַד
  choice: வரை
  rationale: முந்தைய நிலை தெபோராள் எழும்பிய தருணம்வரை நீடித்தது என்ற கவிதையின் திருப்புமுனையை இது காட்டுகிறது.
- source_word: שַׁקַּמְתִּי
  choice: நான் எழும்பும்வரை
  rationale: קום என்பதன் இவ்வடிவம் நடவடிக்கை எடுக்க முன்வருதலைக் குறிக்கிறது. ‘எழும்பு’ கவிதைக்குரிய உயர்ந்த நடையையும் இருமுறை வரும் முதலாம் நபர் வலியுறுத்தலையும் காக்கிறது.
- source_word: דְּבוֹרָה
  choice: தெபோராள்
  rationale: தமிழ் வேதாகமப் பெயரிடல் மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது; வாக்கியத்தில் பெண்பால் பெயராக இயல்பாக அமைய ‘ள்’ முடிவு தரப்பட்டுள்ளது.
- source_word: אֵם
  choice: ஒரு தாயாக
  rationale: இது தெபோராளின் பாதுகாப்பும் தலைமைப் பங்கும் சார்ந்த உருவக அல்லது மரியாதைப் பயன்பாடு. ‘ஒரு தாயாக’ என்பது ‘இஸ்ரவேலின் தாய்’ என்று மூலத்தைவிட வலுவான பட்டமாக மாற்றாமல் உருவகத் தன்மையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֵם בְּיִשְׂרָאֵל என்ற தெபோராளின் தற்குறிப்பின் உருவகப் பொருள்
  choice: ‘இஸ்ரவேலில் ஒரு தாயாக’ என்று மொழிபெயர்த்து, பாதுகாப்பும் பேணுதலும் கொண்ட தலைமைப் பங்கை உணர்த்துதல்
  alternative: ‘இஸ்ரவேலின் தாயாக’ என்ற வலுவான பட்டப்பெயர்; அல்லது விளக்க நுட்பமில்லாத முற்றிலும் நேரடி தாய்மைச் சொல்
  rationale: எபிரெய உரை ‘இஸ்ரவேலின் தாய்’ என்று அல்ல, ‘இஸ்ரவேலில் தாய்’ என்று கூறுகிறது. ‘இஸ்ரவேலில்’ என்பதைத் தக்கவைப்பது மூலத்தின் உறவைப் பாதுகாத்து, தெபோராளின் தலைமைப் பங்கைக் கேட்பவர் உணர இடமளிக்கிறது; எந்தக் கோட்பாட்டுச் சிறப்புரிமையையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஓய்ந்துபோனது’ மற்றும் ‘எழும்பும்வரை’ ஆகிய மறுபதிப்புகள் மூலப்பாடலின் இணை அமைப்பைத் தக்கவைக்கின்றன. அடிக்குறி [a] முதன்மை உரையில் பொருத்தப்பட்டுள்ளது.
