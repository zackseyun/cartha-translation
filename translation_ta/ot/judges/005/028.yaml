  yaml_path: translation/ot/judges/005/028.yaml
  text: 'Through the window Sisera’s mother looked out and wailed through the lattice: “Why is his chariot so late in coming? Why do the hoofbeats of his chariots delay?”[a][b]'
translation:
  language: ta
  text: 'சாளரத்தின் வழியாக சிசெராவின் தாய் வெளியே பார்த்தாள்; கம்பி வலைச் சாளரத்தின் வழியாகப் புலம்பினாள்: “அவனுடைய தேர் வர ஏன் இவ்வளவு தாமதமாகிறது? அவனுடைய தேர்களின் அடிகள் ஏன் தாமதிக்கின்றன?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘புலம்பினாள்’ என்பதற்குப் பதிலாக ‘குரலெழுப்பினாள்’ என்றும் மொழிபெயர்க்கலாம்; இதற்கான எபிரெய வினை அரிதானது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘அவனுடைய தேர்களின் அடிகள்.’ தேர்கள் வருவதைக் குறிக்கும் நடை அல்லது ஒலியை இது கவித்துவமாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעַד הַחַלּוֹן
  choice: சாளரத்தின் வழியாக
  rationale: ஓர் திறப்பின் வழியே பார்த்தல் என்ற இடவுணர்வை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: נִשְׁקְפָה
  choice: வெளியே பார்த்தாள்
  rationale: சாளரம் அல்லது உயர்ந்த இடத்திலிருந்து வெளியே நோக்குதல் என்ற வினையின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וַתְּיַבֵּב
  choice: புலம்பினாள்
  rationale: அரிதான இவ்வினை துயரமான அல்லது பதற்றமுள்ள குரலெழுப்புதலைக் குறிக்கலாம்; ‘புலம்பினாள்’ அதன் உணர்ச்சித் தீவிரத்தை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: אֵם סִיסְרָא
  choice: சிசெராவின் தாய்
  rationale: எபிரெயக் கட்டமைப்பிலுள்ள உடைமை உறவை இயல்பான தமிழில் தருகிறது.
- source_word: הָאֶשְׁנָב
  choice: பின்னல் சாளரம்
  rationale: பின்னலமைப்புடைய சாளரத் திறப்பைக் குறிக்கும் பெயர்ச்சொல்லின் கட்டடவியல் பொருளைத் தெளிவாக்குகிறது.
- source_word: בֹּשֵׁשׁ רִכְבּוֹ לָבוֹא
  choice: அவனுடைய தேர் வர ஏன் இவ்வளவு தாமதமாகிறது?
  rationale: வருவதில் ஏற்படும் தாமதத்தையும் தாயின் பதற்றமுள்ள கேள்வியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: פַּעֲמֵי מַרְכְּבוֹתָיו
  choice: அவனுடைய தேர்களின் காலடிகள்
  rationale: மூலத்தில் உள்ள ‘அடிகள்/காலடிகள்’ என்ற உருவகமான சொல்லாட்சியை ‘குளம்பொலி’ அல்லது ‘சக்கரங்கள்’ என்று விளக்கித் தீர்க்காமல் அப்படியே காக்கிறது.
