source:
  edition: WLC
  text: יִבְחַר֙ אֱלֹהִ֣ים חֲדָשִׁ֔ים אָ֖ז לָחֶ֣ם שְׁעָרִ֑ים מָגֵ֤ן אִם יֵֽרָאֶה֙ וָ/רֹ֔מַח בְּ/אַרְבָּעִ֥ים אֶ֖לֶף בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/008.yaml
  text: They chose new gods[a]; then war was at the gates[b]. Was a shield or spear to be seen among forty thousand in Israel?
translation:
  language: ta
  text: அவர்கள் புதிய தெய்வங்களைத் தேர்ந்தெடுத்தார்கள்[a]; அப்போது நகரவாயில்களில் போர் மூண்டது[b]. இஸ்ரவேலில் இருந்த நாற்பதாயிரம் பேரில் ஒரு கேடயமோ ஈட்டியோ காணப்பட்டதா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, ‘அவன்/ஒருவன் புதிய தெய்வங்களைத் தேர்ந்தெடுத்தான்.’ எபிரெய வினை ஒருமையில் உள்ளது; ஆனால் இங்கு அது இஸ்ரவேல் மக்களை கூட்டாகக் குறிப்பதாகப் பொதுவாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: இந்த வரியின் எபிரெய வாசகம் கடினமானது. ‘அப்போது நகரவாயில்களில் சண்டை நடந்தது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְחַר
  choice: அவர்கள் தேர்ந்தெடுத்தார்கள்
  rationale: எபிரெய வினை இலக்கணப்படி மூன்றாம் நபர் ஆண்பால் ஒருமையில் இருந்தாலும், சூழலில் அதன் எழுவாய் இஸ்ரவேல் மக்கள் எனக் கூட்டுப்பொருளில் புரிந்துகொள்ளப்படுகிறது. மூலத்தின் வடிவ வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֱלֹהִים חֲדָשִׁים
  choice: புதிய தெய்வங்களை
  rationale: இச்சூழலில் இது இஸ்ரவேலின் தேவனை அல்ல, புதிதாக ஏற்றுக்கொள்ளப்பட்ட அந்நிய தெய்வங்களைக் குறிக்கிறது.
- source_word: אָז
  choice: அப்போது
  rationale: விசுவாசத் துரோகத்திற்குப் பின்வந்த போர் நெருக்கடியை இணைக்கும் காலச்சொல்லாக இயல்பாக அமைகிறது.
- source_word: לָחֶם שְׁעָרִים
  choice: நகரவாயில்களில் போர் மூண்டது
  rationale: எபிரெய தொடர் சுருக்கமானதும் கடினமானதும் ஆகும். לָחֶם என்பதை ‘போர்/சண்டை’ எனக் கொண்டு, போர் நகரவாயில்களை எட்டிய நிலையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; நிச்சயமின்மை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: מָגֵן
  choice: கேடயம்
  rationale: இது போரில் பயன்படுத்தப்படும் பாதுகாப்புக் கருவிக்கான வழக்கமான தமிழ்ச் சொல்.
- source_word: אִם יֵרָאֶה
  choice: காணப்பட்டதா?
  rationale: ஆயுதங்கள் இல்லாத நிலையை வலியுறுத்தும் எதிர்பார்க்கப்பட்ட மறுப்புப் பதிலுடைய வினாவாக மொழிபெயர்க்கப்படுகிறது.
- source_word: וָרֹמַח
  choice: ஈட்டியோ
  rationale: רֹמַח குறிக்கும் போராயுதத்திற்கு தெளிவான, பொதுவாகப் புரியும் நவீன தமிழ்ச் சொல்.
- source_word: בְּאַרְבָּעִים אֶלֶף
  choice: நாற்பதாயிரம் பேரில்
  rationale: அந்தப் பெரும் மக்கள் தொகையில் ஆயுதம் எதுவும் காணப்படவில்லை என்ற வினாவின் அளவுணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில் இருந்த
  rationale: தேசிய/சமூக எல்லையை இயல்பான தமிழில் சுட்டுகிறது.
theological_decisions:
- issue: தொடக்க வினையின் எழுவாய்
  choice: இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கும் ‘அவர்கள்’
  alternative: ‘அவன்/ஒருவன் புதிய தெய்வங்களைத் தேர்ந்தெடுத்தான்’; அல்லது ‘தேவன் புதியவற்றைத் தேர்ந்தெடுத்தார்’
  rationale: உடனடிச் சூழல் இஸ்ரவேலின் பிறதெய்வ வழிபாட்டையும் அதனைத் தொடர்ந்த ஒடுக்குதலையும் பற்றியது. ‘தேவன் புதிய தெய்வங்களைத் தேர்ந்தெடுத்தார்’ என்பது சூழலோடும் செய்யுளின் குற்றச்சாட்டோடும் பொருந்தாது. ஆயினும், எபிரெய வினையின் ஒருமை வடிவம் அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான செய்யுள் நடை பயன்படுத்தப்பட்டுள்ளது. ‘நகரவாயில்கள்’ என்பது பண்டைய நகரங்களின் வாயில்களைக் தெளிவுபடுத்துகிறது. மூல எபிரெயத்தின் இலக்கண மற்றும் சொற்பொருள் நிச்சயமின்மைகள் [a], [b] அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
