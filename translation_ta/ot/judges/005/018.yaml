  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டது. எபிரெயக் கவிதையின் இணை அமைப்பு காக்கப்பட்டாலும், தமிழில் தெளிவுக்காக நப்தலி பற்றிய விடுபட்ட வினைக்கருத்து மீண்டும் சொல்லப்பட்டது.
