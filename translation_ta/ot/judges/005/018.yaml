  text: זְבֻל֗וּן עַ֣ם חֵרֵ֥ף נַפְשׁ֛/וֹ לָ/מ֖וּת וְ/נַפְתָּלִ֑י עַ֖ל מְרוֹמֵ֥י שָׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/018.yaml
  text: Zebulun was a people that risked its life to the death[a], and Naphtali also[b], on the heights of the field.
translation:
  language: ta
  text: செபுலோன் மக்கள் சாகுமளவுக்குத் தங்கள் உயிரைப் பொருட்படுத்தவில்லை[a]; நப்தலி மக்களும் திறந்த வயல்வெளியின் மேடுகளில் தங்கள் உயிரைப் பொருட்படுத்தவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “சாகும்வரை தன் உயிரை இகழ்ந்த மக்கள்” என்று நேரடியாக உள்ளது. அதாவது, அவர்கள் மரணத்தையும் எதிர்கொள்ளும் அளவுக்குத் தங்கள் உயிரைப் பொருட்படுத்தவில்லை. செபுலோன் என்ற கூட்டுப்பொருளுக்கு எபிரெயம் ஒருமையைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயக் கவிதையில் நப்தலியைப் பற்றிய வினைச்சொல் வெளிப்படையாக மீண்டும் சொல்லப்படவில்லை; செபுலோனைப் பற்றிச் சொன்ன கருத்தே நப்தலிக்கும் பொருந்துகிறது. “வயல்வெளியின் உயர்ந்த இடங்களில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: ellipsis_and_lexical_alternative
lexical_decisions:
- source_word: זְבֻלוּן
  choice: செபுலோன்
  rationale: இது கோத்திரத்தின் பெயர்; தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: עַם
  choice: மக்கள்
  rationale: ஒருமை வடிவிலுள்ள கூட்டுப்பெயர்; தமிழில் கோத்திரத்தினரை இயல்பாகக் குறிக்கப் பன்மை வினையுடன் வழங்கப்பட்டது.
- source_word: חֵרֵף
  choice: பொருட்படுத்தவில்லை
  rationale: חרף என்பதன் அடிப்படை இகழ்தல் அல்லது மதிப்பற்றதாகக் கருதுதல். போர்ச் சூழலில் உயிரை மதியாமல் ஆபத்துக்கு உட்படுத்திய கருத்தை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: נַפְשׁוֹ
  choice: தங்கள் உயிரை
  rationale: இந்தப் போர்ச் சூழலில் נפש என்பது ஆன்மா என்பதைக் காட்டிலும் உயிர் அல்லது தன்னையே குறிக்கிறது. கூட்டுப்பொருளான கோத்திரத்துக்கு ஏற்ப மரியாதைப் பன்மை அல்லாத கூட்டுப் பன்மை பயன்படுத்தப்பட்டது.
- source_word: לָמוּת
  choice: சாகுமளவுக்கு
  rationale: ל உடனான வினையெச்ச வடிவம் மரணம் வரையிலான எல்லை அல்லது விளைவைத் தெரிவிக்கிறது; தமிழில் இயல்பாகவும் வலிமையாகவும் இதைச் சொல்கிறது.
- source_word: וְנַפְתָּלִי
  choice: நப்தலி மக்களும்
  rationale: இணைப்புச் சொல் நப்தலியும் அதே பாராட்டில் பங்குபெற்றதைச் சுட்டுகிறது. எபிரெயக் கவிதையில் விடுபட்டுள்ள முன் வினைக்கருத்து தமிழில் மீண்டும் வெளிப்படுத்தப்பட்டது.
- source_word: מְרוֹמֵי
  choice: மேடுகளில்
  rationale: உயர்ந்த நிலப்பகுதிகள் அல்லது மேடுகளைச் சுட்டுகிறது; வழிபாட்டுக்குரிய ‘உயரிடங்கள்’ என்ற தேவையற்ற பொருளைத் தவிர்க்கிறது.
- source_word: שָׂדֶה
  choice: திறந்த வயல்வெளி
  rationale: שדה என்பது வயல் மட்டுமல்லாமல் திறந்த நிலம் அல்லது வெளிப்புற நாட்டுப்பகுதியையும் குறிக்கலாம்; போர்க்களம் என்று மிகுதியாக விளக்காமல் நிலப்பரப்பின் படிமத்தைத் தக்கவைக்கிறது.
