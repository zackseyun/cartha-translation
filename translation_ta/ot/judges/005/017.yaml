base_translation:
  language: en
  yaml_path: translation/ot/judges/005/017.yaml
  text: Gilead stayed beyond the Jordan[b][a]; and Dan—why did he sojourn by the ships? Asher sat by the seashore and stayed by his harbors.
translation:
  language: ta
  text: கீலேயாத் யோர்தானுக்கு அப்பால் தங்கியிருந்தான்; தாணோ—அவன் ஏன் கப்பல்களருகே வசித்துக்கொண்டிருந்தான்?[a] ஆசேர் கடற்கரையில் அமர்ந்திருந்தான்; தன் துறைமுகங்களருகே குடியிருந்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவன் ஏன் கப்பல்களருகே தங்கியிருந்தான்?” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் வசித்தல் அல்லது அயல்நாட்டவரைப் போலத் தங்குதல் என்ற பொருள்களைக் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தன் வளைகுடாக்களருகே” அல்லது “தன் கடலோர நுழைவிடங்களருகே” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பிளவுகள் அல்லது திறப்புகளைக் குறிக்கிறது; இங்குள்ள கடலோரச் சூழலில் துறைமுகங்கள் அல்லது வளைகுடாக்கள் எனப் பொருள்படலாம்.
    reason: lexical_alternative
