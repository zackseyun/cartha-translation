id: JDG.5.22
reference: Judges 5:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אָ֥ז הָלְמ֖וּ עִקְּבֵי ס֑וּס מִֽ/דַּהֲר֖וֹת דַּהֲר֥וֹת אַבִּירָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/022.yaml
  text: Then the horses’ hoofs pounded from the galloping[a], the galloping of his mighty steeds.
translation:
  language: ta
  text: 'அப்போது குதிரைகளின் குளம்புகள் தடதடத்தன—


    பாய்ச்சல்களால்,


    அவனுடைய வலிமைமிக்கவர்களின் பாய்ச்சல்களால்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய வலிமைமிக்க ஆண் குதிரைகளின் பாய்ச்சல்களால்”; அல்லது, “அவனுடைய வலிமைமிக்க வீரர்களின் பாய்ச்சல்களால்.” எபிரெயச் சொற்றொடர் வலிமையான குதிரைகளையோ அவற்றோடு தொடர்புடைய வீரர்களையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: பாடலின் அடுத்த திடமான காட்சியை அறிமுகப்படுத்தும் காலச் சொல்லாக இயல்பாக உள்ளது.
- source_word: הָלְמוּ
  choice: தடதடத்தன
  rationale: வலுவாக மோதும் குளம்புகளின் ஒலியையும் இயக்கத்தையும் இயல்பான தமிழில் ஒருங்கே உணர்த்துகிறது.
- source_word: עִקְּבֵי סוּס
  choice: குதிரைகளின் குளம்புகள்
  rationale: עִקְּבֵי என்பதன் அடிப்படைப் பொருள் ‘குதிகால்கள்’ என்றாலும், குதிரைச் சூழலில் ‘குளம்புகள்’ என்பதே தெளிவான, இயல்பான பொருள்; ஒருமை வடிவிலுள்ள סוּס இங்கு தொகுப்புப் பொருளில் கொள்ளப்படுகிறது.
- source_word: מִדַּהֲרוֹת דַּהֲרוֹת
  choice: பாய்ச்சலால், அவற்றின் பாய்ச்சலால்
  rationale: מִן காரணத்தை உணர்த்துவதால் ‘-ஆல்’ பயன்படுத்தப்பட்டுள்ளது; எபிரெய உரையின் மீளுரைத்தல் கவிதை வலிமைக்காகத் தக்கவைக்கப்பட்டுள்ளது. தமிழில் பொருள் தெளிவாக இருக்க இரண்டாம் இடத்தில் ‘அவற்றின்’ சேர்க்கப்பட்டுள்ளது.
- source_word: אַבִּירָיו
  choice: அவனுடைய வலிமைமிக்க குதிரைகள்
  rationale: குதிரைக் குளம்புகளும் பாய்ச்சலும் பற்றிய உடனடிச் சூழலில் வலிமையான குதிரைகள் என்பது முதன்மைப் பொருளாக இயல்பாகிறது; எனினும் எபிரெயச் சொல் வலிமைமிக்க வீரர்களையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: אַבִּירָיו என்பதில் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியின் குறிப்பு மற்றும் ‘வலிமைமிக்கவர்கள்’ என்போரின் அடையாளம்
  choice: முதன்மை உரையில் ‘அவனுடைய வலிமைமிக்க குதிரைகள்’
  alternative: ‘அவனுடைய வலிமைமிக்க வீரர்கள்’
  rationale: உடனடிக் குதிரைச் சூழல் குதிரைகள் என்ற வாசிப்பை ஆதரிக்கிறது. ஆயினும் எபிரெயக் கவிதை வீரர்களைக் குறிக்கும் வாய்ப்பையும் திறந்துவைப்பதால், அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், பாடலுக்குரிய ஒலிநயத்துடனும் கண்ணியமான நடையுடனும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தின் மீளுரைத்தல் வரி அமைப்பின் வழியாகத் தக்கவைக்கப்பட்டுள்ளது; ‘தடதடத்தன’ குளம்பொலியை சாதாரண வாசகருக்கு உடனடியாக உணர்த்துகிறது.
