source:
  edition: WLC
  text: נַ֤חַל קִישׁוֹן֙ גְּרָפָ֔/ם נַ֥חַל קְדוּמִ֖ים נַ֣חַל קִישׁ֑וֹן תִּדְרְכִ֥י נַפְשִׁ֖/י עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/021.yaml
  text: The torrent of Kishon swept them away— the ancient torrent[a], the torrent of Kishon. March on, my soul[b], with strength!
translation:
  language: ta
  text: 'கீசோன் காட்டாறு அவர்களை அடித்துக்கொண்டு போனது—

    பண்டைக்காலக் காட்டாறு[a], கீசோன் காட்டாறு.

    என் ஆத்துமாவே, வலிமையோடு மிதித்துச் செல்![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பழங்காலத்து ஓடை’ அல்லது ‘ஆதிகாலக் காட்டாறு’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பழமையைக் குறிக்கக்கூடும்; இது வெறும் காலக் குறிப்பாக அல்லாமல் வலுப்படுத்தப்பட்ட கவித்துவ வருணனையாகவும் இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘என் ஆத்துமாவே, வலிமையுடன் நடந்துசெல்!’ அல்லது ‘என் ஆத்துமாவே, ஆற்றலோடு மிதி!’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வாசகம் சுருக்கமானதும் கவித்துவமானதும் ஆகும்; வினைச்சொல் நடந்துசெல்லுதல், மிதித்தல், நசுக்குதல் ஆகிய நிழற்பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל
  choice: காட்டாறு
  rationale: வெள்ளப்பெருக்குடன் பாயும் ஓடை அல்லது வறண்ட காலத்தில் ஓடையற்ற பள்ளத்தாக்கையும் குறிக்கும் சொல்லாகும். போர்ச் சூழலில் எதிரிகளை வெள்ளம் அடித்துக்கொண்டு போகும் வலிமையை ‘காட்டாறு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: קִישׁוֹן
  choice: கீசோன்
  rationale: நீரோடையின் இயற்பெயர்; தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: גְּרָפָם
  choice: அவர்களை அடித்துக்கொண்டு போனது
  rationale: גרף என்பதன் ‘வாரிக்கொண்டு போதல், வெள்ளத்தில் அடித்துக்கொண்டு போதல்’ என்ற வன்மையான நீரியக்கப் படிமத்தை இயல்பான தமிழில் தருகிறது.
- source_word: נַחַל קְדוּמִים
  choice: பண்டைக்காலக் காட்டாறு
  rationale: קְדוּמִים பழமை அல்லது முற்காலத்தைக் குறிக்கலாம். கீசோனை விளக்கும் கவித்துவ இணைப்பாக ‘பண்டைக்காலக் காட்டாறு’ காலப் பொருளையும் உயர்ந்த நடையையும் காக்கிறது.
- source_word: תִּדְרְכִי
  choice: மிதித்துச் செல்
  rationale: דרך என்பதற்கு ‘மிதித்தல், காலால் கடந்துசெல்லுதல்’ என்ற பொருள்கள் உள்ளன. பெண்பால் ஒருமையில் ஆத்துமாவை நோக்கிய சுயத் தூண்டுதலாக இருப்பதால், முன்னேறும் இயக்கத்தையும் மிதிக்கும் படிமத்தையும் இத்தேர்வு காக்கிறது.
- source_word: נַפְשִׁי
  choice: என் ஆத்துமாவே
  rationale: נפש இங்கு பேச்சாளர் தன்னையே கவித்துவமாக நேரடியாக அழைப்பதைக் குறிக்கிறது. ‘ஆத்துமா’ அந்தச் சுயவிளிப்பின் இலக்கிய மற்றும் இறையியல் நடுநிலையைப் பாதுகாக்கிறது.
- source_word: עֹז
  choice: வலிமையோடு
  rationale: עֹז என்பது வலிமை அல்லது ஆற்றலைக் குறிக்கிறது. சுருக்கமான எபிரெயச் சொற்றொடரை வினையடைப் பொருளில் இயல்பாக வழங்குகிறது.
