  naturalness: நடை நவீனத் தரத் தமிழில் இயல்பாகவும் பாடலுக்கேற்ற உயர்வுடனும் உள்ளது. ‘என் ஆத்துமாவே’ என்பது தமிழ் வேதாகமக் கவிதை நடையில் நிலைபெற்ற, புரிந்துகொள்ளக்கூடிய சுயவிளிப்பாகும். வரிப்பிரிப்பும் மீளுரையும் மூலத்தின் ஓசை மற்றும் வலியுறுத்தலைச் சிறப்பாகக் காக்கின்றன.
  terminology: கீசோன் என்ற பெயரொலிபெயர்ப்பு நிலையானது. ‘காட்டாறு,’ ‘ஆத்துமா,’ ‘வலிமையோடு’ ஆகியவை முறையே நீர்ப்பெருக்கு, נפש-இன் கவித்துவ சுயவிளிப்பு, மற்றும் עֹז ஆகியவற்றுக்கு ஏற்ற, கோட்பாட்டுச் சாய்வற்ற சொற்களாக உள்ளன. அடிக்குறிப்புகள் மாற்று சொற்பொருள்களையும் மூலத்தின் சுருக்கமான கவித்துவ இயல்பையும் துல்லியமாகக் குறிப்பிடுகின்றன.
