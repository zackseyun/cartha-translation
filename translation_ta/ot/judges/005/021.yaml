translation_notes:
  register: நவீனத் தரத் தமிழில், பாடலின் உயர்ந்த கவித்துவ நடையையும் மீளுரையையும் காக்கும் மொழிபெயர்ப்பு. ‘காட்டாறு’ வெள்ளத்தின் வன்மையைத் தெளிவாக்குகிறது; ‘ஆத்துமாவே’ என்ற நேரடி விளிப்பு மூலத்தின் சுயத் தூண்டுதலைப் பாதுகாக்கிறது.
