source:
  edition: WLC
  text: יְהוָ֗ה בְּ/צֵאתְ/ךָ֤ מִ/שֵּׂעִיר֙ בְּ/צַעְדְּ/ךָ֙ מִ/שְּׂדֵ֣ה אֱד֔וֹם אֶ֣רֶץ רָעָ֔שָׁה גַּם שָׁמַ֖יִם נָטָ֑פוּ גַּם עָבִ֖ים נָ֥טְפוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/004.yaml
  text: O Yahweh[a], when you went out from Seir, when you marched from the field of Edom, the earth trembled; the heavens also dripped[b], the clouds also dripped water.
translation:
  language: ta
  text: யாவே, நீர் சேயீரிலிருந்து புறப்பட்டபோது, ஏதோமின் வயல்வெளியிலிருந்து அடியெடுத்து வந்தபோது, பூமி அதிர்ந்தது; வானங்களும் சொட்டின; மேகங்களும் நீரைச் சொட்டின.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவத்தில் தருகிறது; எபிரெய உச்சரிப்பை அண்மித்த ‘யாவே’ என்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּצֵאתְךָ
  choice: நீர் ... புறப்பட்டபோது
  rationale: ב + வினையெச்சப் பெயர்ச்சொல் அமைப்பின் காலப்பொருளையும், இறைவனை நேரடியாக மரியாதையுடன் ஒருமையில் அழைப்பதையும் இயல்பான தமிழில் காக்கிறது.
- source_word: מִשֵּׂעִיר
  choice: சேயீரிலிருந்து
  rationale: இடப்பெயரை ஒலிபெயர்த்து, מן முன்னொட்டின் ‘இலிருந்து’ பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּצַעְדְּךָ
  choice: அணிவகுத்து வந்தபோது
  rationale: צעד குறிக்கும் நோக்கமுள்ள, கம்பீரமான நடை அல்லது அணிவகுப்பை கவிதைச் சூழலுக்கு ஏற்றவாறு வெளிப்படுத்துகிறது; ‘வந்த’ என்பது பாடலில் நோக்குநிலையிலிருந்து முன்னேற்றத்தை இயல்பாக்குகிறது.
- source_word: מִשְּׂדֵה אֱדוֹם
  choice: ஏதோம் வெளியிலிருந்து
  rationale: שׂדה என்பதன் வயல்/திறந்த வெளி என்ற உருவகத்தை ‘வெளி’ மூலம் காத்து, இதை வெறுமனே நாட்டுப் பெயராக விரிவாக்குவதைத் தவிர்க்கிறது.
- source_word: אֶרֶץ רָעָשָׁה
  choice: பூமி அதிர்ந்தது
  rationale: வானங்களுடனான இணைப்பால் אֶרֶץ என்பதற்கு அண்டமுழுதையும் சுட்டும் ‘பூமி’ பொருள் ஏற்றது; רעש என்பதன் குலுக்கல்/நடுக்கத்தை ‘அதிர்ந்தது’ இயல்பாகத் தருகிறது.
- source_word: גַּם שָׁמַיִם נָטָפוּ
  choice: வானங்களும் துளித்தன
  rationale: גם-ஐ ‘உம்’ மூலம் காத்து, נטף என்பதன் சொற்படிமமான துளித்தலை அடுத்த வரியின் தண்ணீர் குறிப்புடன் இணைக்கிறது.
- source_word: גַּם עָבִים נָטְפוּ מָיִם
  choice: மேகங்களும் தண்ணீரைத் துளித்தன
  rationale: נטף என்ற வினையின் மறுபயன்பாட்டை அதே ‘துளித்தன’ என்று காத்து, מָיִם என்ற வெளிப்படையான செயப்படுபொருளையும் விடாமல் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; ஆண்டவர்
  rationale: பொதுப்பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக தனிப்பட்ட திருநாமத்தை உரையில் காக்கிறது. WLC-இன் மெய்யெழுத்துகள் மட்டும் துல்லியமான பண்டைய உச்சரிப்பை முடிவுசெய்யாததால், பரவலாக அறியப்பட்ட தமிழ் வடிவத்தை முதன்மை உரையிலும் ‘யாவே’ என்பதை அடிக்குறிப்பிலும் தருகிறது.
- issue: இறைவனின் வருகையைச் சித்தரிக்கும் צעד
  choice: அணிவகுத்து வந்தபோது
  alternative: அடியெடுத்து நடந்தபோது
  rationale: இறைத் தோற்றத்தின் கம்பீரமான முன்னேற்றத்தை வெளிப்படுத்துகிறது; போர்க்குணம் அல்லது குறிப்பிட்ட சமயக் கோட்பாட்டைச் சேர்க்காமல் வினையின் நடப்பு/அணிவகுப்பு நுணுக்கத்தைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடன் அமைக்கப்பட்டது. ‘நீர்’ என்ற மரியாதை ஒருமையும், ‘பூமி—வானங்கள்—மேகங்கள்’ என்ற மூவகைக் கவிதைப் படிமமும், נטף வினையின் மறுமொழியும் காக்கப்பட்டுள்ளன.
