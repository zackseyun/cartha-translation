  yaml_path: translation/ot/judges/005/026.yaml
  text: She reached out her hand for the tent peg[a], her right hand for the workmen’s hammer; then she struck Sisera, she shattered his head[c][b], she smashed and pierced his temple.
translation:
  language: ta
  text: அவள் கூடார முளைக்குத் தன் கையை நீட்டினாள்; தொழிலாளர்களின் சம்மட்டிக்குத் தன் வலக்கையை நீட்டினாள்.[a] அவள் சிசெராவை அடித்தாள்; அவன் தலையை நொறுக்கினாள்;[b] அவன் கன்னப்பொட்டைப் சிதைத்துத் துளைத்தாள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தொழிலாளர்களின் சம்மட்டி” என்பதற்குப் பதிலாக, “வேலையாட்களின் சுத்தியல்” அல்லது “தொழிலாளர்களின் சுத்தி” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் அரிதானது; அடிக்கும் கருவியின் துல்லியமான வகை உறுதியில்லை.
    reason: lexical_alternative
  - marker: b
    text: “அவன் தலையை நசுக்கினாள்” என்றும் மொழிபெயர்க்கலாம். இங்கு எபிரெயம் வன்மையை உயர்த்திக் காட்ட பல வலுவான வினைச்சொற்களை அடுத்தடுத்து பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: “அவன் கன்னப்பொட்டைக் கடந்து சென்றாள்” அல்லது “அதைத் துளைத்தாள்” என்றும் மொழிபெயர்க்கலாம். “கன்னப்பொட்டு” என்பது தலையின் பக்கவாட்டிலுள்ள temple பகுதி. இறுதி வினைச்சொல் ஊடாகச் செல்லும் செயலைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדָהּ ... תִּשְׁלַחְנָה
  choice: அவள் தன் கையை ... நோக்கி நீட்டினாள்
  rationale: ‘கையை நீட்டுதல்’ என்பது எபிரெயச் செயலை இயல்பான தமிழில் தருகிறது; பொருளை எடுக்க நீட்டியதையும் சூழல் உணர்த்துகிறது.
- source_word: לַיָּתֵד
  choice: கூடார முளை நோக்கி
  rationale: யாயேலின் கூடாரச் சூழலில் יָתֵד என்பது கூடாரத்தை நிலைநிறுத்தும் முள்; ‘கூடார முள்’ நவீன வாசகருக்குத் தெளிவானது.
- source_word: וִימִינָהּ
  choice: தன் வலக்கையை
  rationale: முதல் அடியிலுள்ள ‘கை’ என்பதுடன் அமைந்த கவிதை இணைநிலையைப் பாதுகாக்கிறது.
- source_word: לְהַלְמוּת עֲמֵלִים
  choice: கைவினைஞரின் சம்மட்டியை நோக்கி
  rationale: அரிதான இச்சொற்றொடர் அடிக்கும் கருவியைக் குறிக்கிறது. ‘சம்மட்டி’ கூடார முளை அடிக்கப் பயன்படும் கனமான கைக்கருவியை இயல்பாகக் குறிக்கிறது; עֲמֵלִים என்பதன் பணியாளர் சார்ந்த பொருள் ‘கைவினைஞர்’ என்று தரப்பட்டுள்ளது.
- source_word: וְהָלְמָה
  choice: அடித்து
  rationale: הלם என்பதன் வலுவான ‘அடி/தாக்கு’ பொருளை நேரடியாகத் தருகிறது.
- source_word: מָחֲקָה רֹאשׁוֹ
  choice: அவன் தலையை நொறுக்கினாள்
  rationale: מחק இங்கு பலத்த தாக்குதலால் நசுக்குதல் அல்லது நொறுக்குதல் என்ற வன்மையான கவிதைப் பொருளைக் கொண்டுள்ளது.
- source_word: וּמָחֲצָה
  choice: சிதைத்து
  rationale: அடுத்தடுத்து வரும் வலுவான வினைச்சொற்களின் கவிதைச் செறிவைத் தக்கவைக்க, முந்தைய ‘நொறுக்கினாள்’ என்பதிலிருந்து வேறுபடுத்தப்பட்டுள்ளது.
- source_word: וְחָלְפָה
  choice: ஊடுருவினாள்
  rationale: חלף இங்கு கடந்து செல்லுதல் அல்லது துளைத்துச் செல்லுதல் என்ற சாத்தியமான பொருளைக் கொண்டது; ‘ஊடுருவினாள்’ அந்த இயக்கத்தைத் தீர்மானத்தை மிகைப்படுத்தாமல் தருகிறது.
- source_word: רַקָּתוֹ
  choice: அவன் நெற்றிப்பொட்டை
  rationale: רַקָּה தலையின் பக்கவாட்டுப் பகுதியான temple-ஐக் குறிக்கிறது; ‘நெற்றிப்பொட்டு’ என்பது அதற்குரிய புரிந்துகொள்ளத்தக்க தமிழ்ச் சொல்.
