  register: நவீன, கண்ணியமான இலக்கியத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் இணைநிலை, வேகமான வினைச்சொல் தொடர், வன்மையான காட்சி ஆகியவை இயன்றவரை பாதுகாக்கப்பட்டுள்ளன. முதல் இரண்டு உறுப்புகளில் உள்ள ஒரே வினை எபிரெயத்தில் இரண்டாவது உறுப்புக்கும் பொருந்துவதால், இயல்பான தமிழுக்காக ‘நீட்டினாள்’ மீண்டும் கூறப்பட்டுள்ளது.
