  to: அவள் கூடார முளைக்குத் தன் கையை நீட்டினாள்; தொழிலாளர்களின் சம்மட்டிக்குத் தன் வலக்கையை நீட்டினாள்.[a] அவள் சிசெராவை அடித்தாள்; அவன் தலையை நொறுக்கினாள்;[b] அவன் கன்னப்பொட்டைப் சிதைத்துத் துளைத்தாள்.[c]
