source:
  edition: WLC
  text: אָ֚ז יְרַ֣ד שָׂרִ֔יד לְ/אַדִּירִ֖ים עָ֑ם יְהוָ֕ה יְרַד לִ֖/י בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/013.yaml
  text: Then the remnant came down against the nobles[b][a]; the people of Yahweh came down for me against the mighty.
translation:
  language: ta
  text: 'அப்போது எஞ்சியவர்கள் பெருந்தலைவர்களுக்கு எதிராக இறங்கி வந்தார்கள்[a];

    யாவேயின் மக்கள் எனக்காக[b] வல்லவர்களுக்கு எதிராக இறங்கி வந்தார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்போது தப்பியிருந்த ஒருவன் பெருந்தலைவர்களிடம் இறங்கி வந்தான்.” இந்த எபிரெயக் கவிதை வரியின் பொருள் தெளிவாக இல்லை; முன்னிடைச்சொற்களை “எதிராக” என்பதற்குப் பதிலாக “இடம்,” “ஆதரவாக,” அல்லது “உடன்” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில், “எனக்கு.” இது தெபோராள் இந்தப் பாடலில் தன்னையே குறிப்பிடுவதாக இருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: பாடலில் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலக் குறிப்பை இயல்பான தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: יְרַד / יְרַד
  choice: இறங்கி வந்தார்கள்
  rationale: ירד என்பதன் அடிப்படைப் பொருளான ‘கீழே இறங்குதல்’ என்பதைக் காத்து, இரு அரையடிகளிலும் வரும் வினைச்சொல் மீளுருவாக்கத்தையும் பாதுகாக்கிறது; கூட்டுப் பொருளைக் குறிக்கும் பெயர்களுடன் தமிழில் பன்மை வினை இயல்பாக உள்ளது.
- source_word: שָׂרִיד
  choice: எஞ்சியவர்கள்
  rationale: போருக்குப் பின் மீந்தவர் அல்லது எஞ்சிய பகுதி என்ற பொருளைக் கொண்ட சொல்லை, இங்கு ஒரு குழுவைக் குறிக்கும் கூட்டுப் பொருளில் இயல்பாகத் தருகிறது; ஒரே ‘தப்பியவர்’ என்ற வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְאַדִּירִים
  choice: பெருந்தலைவர்களுக்கு எதிராக
  rationale: אַדִּירִים என்பதிலுள்ள உயர்ந்தோர் அல்லது அதிகாரமிக்கோர் என்ற கருத்தை ‘பெருந்தலைவர்கள்’ வெளிப்படுத்துகிறது. போர்ச் சூழலையும் இணை அமைப்பையும் முன்னிட்டு לְ என்பதற்கு எதிர்நிலைப் பொருள் முதன்மை உரையில் கொள்ளப்பட்டுள்ளது.
- source_word: עָם יְהוָה
  choice: யாவேயின் மக்கள்
  rationale: மக்கள் யாவேக்கு உரியவர்கள் என்ற உடைமை மற்றும் உடன்படிக்கை சார்ந்த உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: לִי
  choice: எனக்காக
  rationale: முதலாம் நபர் ஒருமைச் சுட்டை நேரடியாகக் காத்து, தெபோராள் பாடலில் தன்னைக் குறிப்பிடும் சாத்தியத்தை வெளிப்படுத்துகிறது; ‘என்னிடம்/என்னுடன்’ போன்ற நுணுக்கங்கள் அடிக்குறிப்பால் மறைமுகமாகப் பாதுகாக்கப்படுகின்றன.
- source_word: בַּגִּבּוֹרִים
  choice: வல்லவர்களுக்கு எதிராக
  rationale: גִּבּוֹרִים என்பதன் வலிமைமிக்கோர் அல்லது போர்வீரர் என்ற விரிந்த பொருளைத் தருகிறது; முதல் அரையடியிலுள்ள ‘பெருந்தலைவர்கள்’ என்பதிலிருந்து சொல் வேறுபாட்டையும் காக்கிறது. போர்ச் சூழலில் בַּ־ எதிர்நிலைப் பொருளில் வாசிக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் அல்லது யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: இரு அரையடிகளிலுமுள்ள முன்னிடைச்சொற்களின் பொருள்
  choice: 'எதிர்நிலைப் பொருள்: ‘பெருந்தலைவர்களுக்கு எதிராக’ / ‘வல்லவர்களுக்கு எதிராக’'
  alternative: 'திசை, நன்மை அல்லது உடன்நிகழ்வுப் பொருள்: ‘பெருந்தலைவர்களிடம்/அவர்களுக்காக’; ‘வல்லவர்களுடன்/அவர்களிடையே’'
  rationale: வெற்றிப் பாடலின் போர்ச் சூழலும் இரு அரையடிகளின் இணை அமைப்பும் எதிர்நிலை வாசிப்பை ஆதரிக்கின்றன. எனினும் எபிரெயக் கவிதை வரியின் இலக்கணம் கடினமானதால் மற்ற வாசிப்புகள் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் பாடலுக்கேற்ற கண்ணியமான ஓசையுடனும் வடிவமைக்கப்பட்டது. இரு அரையடிகளின் இணை அமைப்பும் ‘இறங்கி வந்தார்கள்’ என்ற வினைச்சொல் மீளுருவாக்கமும் காக்கப்பட்டுள்ளன. மூலத்தின் இலக்கணத் தெளிவின்மை முதன்மை உரையில் மறைக்கப்படாமல் அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
