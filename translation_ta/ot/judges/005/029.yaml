lexical_decisions:
- source_word: חַכְמוֹת שָׂרוֹתֶיהָ
  choice: அவளுடைய ஞானமிக்க அரசகுலப் பெண்கள்
  rationale: חַכְמוֹת என்பது ‘ஞானமிக்கவர்கள்’ என்றும், שָׂרוֹת என்பது உயர்குடி அல்லது அரசவையைச் சேர்ந்த பெண்கள் என்றும் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் பெண்பால் குறிப்பைத் தெளிவாகவும் வெளிப்படுத்த இந்தச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: תַּעֲנֶינָּה
  choice: அவளுக்குப் பதிலளிக்கிறார்கள்
  rationale: இது பெண்பால் பன்மை வினை; சிசெராவின் தாயை நோக்கி அவளது பெண்கள் பதிலளிப்பதை நேரடியாகக் காட்டுகிறது.
- source_word: אַף הִיא תָּשִׁיב אֲמָרֶיהָ לָהּ
  choice: அவளும் தனக்குத்தானே தன் சொற்களைத் திரும்பச் சொல்லிக்கொள்கிறாள்
  rationale: லָהּ என்பதன் ‘தனக்கே’ என்ற திரும்புநிலைப் பொருளையும், תָּשִׁיב என்பதிலுள்ள ‘திருப்புதல்/மீண்டும் கூறுதல்’ நுணுக்கத்தையும் காக்கிறது; அடுத்த வசனத்தில் வரும் எண்ணத்தை அவள் தானும் கூறிக்கொள்வதைக் குறிக்கிறது.
