  text: א֣וֹרוּ מֵר֗וֹז אָמַר֙ מַלְאַ֣ךְ יְהוָ֔ה אֹ֥רוּ אָר֖וֹר יֹשְׁבֶ֑י/הָ כִּ֤י לֹֽא בָ֨אוּ֙ לְ/עֶזְרַ֣ת יְהוָ֔ה לְ/עֶזְרַ֥ת יְהוָ֖ה בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/023.yaml
  text: Curse Meroz[a], said the angel of Yahweh; curse, utterly curse its inhabitants, because they did not come to the help of Yahweh[b], to the help of Yahweh against the mighty.
translation:
  language: ta
  text: '“மேரோஸைச் சபியுங்கள்,” என்று யாவேயின் தூதர்[a] சொன்னார்.


    “அதில் குடியிருப்பவர்களைச் சபியுங்கள், கடுமையாகச் சபியுங்கள்!


    ஏனெனில், அவர்கள் யாவேக்கு உதவ வரவில்லை;


    வலிமைமிக்கவர்களுக்கு எதிராக யாவேக்கு உதவ வரவில்லை.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் செய்தியாளர்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், “வலிமைமிக்கவர்களிடையே யாவேக்கு உதவ.” இதை “வலிமைமிக்கவர்களுக்கு எதிராக” அல்லது “வலிமைமிக்க வீரர்களுடன்” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: א֣וֹרוּ / אֹ֥רוּ אָר֖וֹר
  choice: சபியுங்கள் / சபியுங்கள், கடுமையாகச் சபியுங்கள்
  rationale: ארר என்பதன் கட்டளை வடிவம் வலுவான சாபத்தைக் குறிக்கிறது. இரண்டாவது கட்டளையைத் தொடர்ந்து வரும் வினையெச்ச முழுவடிவம் தீவிரத்தை அதிகரிப்பதால், அதை இயல்பான தமிழில் ‘கடுமையாகச் சபியுங்கள்’ என்று வெளிப்படுத்துகிறது.
- source_word: מֵר֗וֹז
  choice: மேரோஸ்
  rationale: இது ஓர் இடத்தைக் குறிக்கக்கூடிய இயற்பெயர்; மூல உரை பெயரை மட்டும் தருவதால் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מַלְאַ֣ךְ יְהוָ֔ה
  choice: யாவேயின் தூதர்
  rationale: מַלְאָךְ என்பது ‘தூதர்’ அல்லது ‘செய்தியாளர்’ எனப் பொருள்படலாம். ‘தூதர்’ என்பது வழக்கமான வேதாகமத் தொடரையும் அடிப்படைச் சொற்பொருளையும் இயல்பான தமிழில் தக்கவைக்கிறது; அந்த நபரின் இயல்பைப் பற்றிய இறையியல் விவாதத்தைத் தீர்மானிக்கவில்லை.
- source_word: יֹשְׁבֶ֑י/הָ
  choice: அதில் குடியிருப்பவர்கள்
  rationale: மேரோசில் வசிக்கும் மக்களைக் குறிக்கும் பன்மைக் கூட்டுப்பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: כִּ֤י לֹֽא בָ֨אוּ֙
  choice: ஏனெனில், அவர்கள் ... வரவில்லை
  rationale: כִּי இங்கு சாபத்திற்கான காரணத்தை அறிமுகப்படுத்துவதால் அதன் காரணப்பொருள் வெளிப்படையாகத் தரப்பட்டுள்ளது.
- source_word: לְ/עֶזְרַ֣ת יְהוָ֔ה
  choice: யாவேக்கு உதவ வர
  rationale: ‘யாவேயின் உதவிக்கு’ என்ற எபிரெயச் சொல்லமைப்பைச் சொற்சொல்லாகப் பின்பற்றாமல், உதவி செய்ய வருதல் என்ற இயக்கத்தையும் நோக்கத்தையும் இயல்பான தமிழில் தருகிறது. மூலத்தின் வலியுறுத்தும் இரட்டிப்பு இருமுறையும் அப்படியே வைக்கப்பட்டுள்ளது.
- source_word: בַּ/גִּבּוֹרִֽים
  choice: வலிமைமிக்கவர்களுக்கு எதிராக
  rationale: போர்ச் சூழலில் בְּ என்பதை எதிர்ப்பொருளில் புரிந்துகொள்ளும் வாசிப்பை முதன்மை உரை ஏற்கிறது. எனினும் ‘வலிமைமிக்கவர்களிடையே’ அல்லது ‘வலிமைமிக்க வீரர்களுடன்’ என்ற வாசிப்புகளும் இலக்கண ரீதியாகச் சாத்தியமுள்ளதால் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரையிலுள்ள நான்கெழுத்து இறைப்பெயரை பொதுப்பட்டமாக மாற்றாமல், ‘Yahweh’ என்பதற்கு நெருக்கமான நவீன தமிழ் ஒலிபெயர்ப்பான ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- issue: מַלְאַךְ יְהוָה என்பவரின் அடையாளம்
  choice: யாவேயின் தூதர்
  alternative: யாவேயின் செய்தியாளர்
  rationale: இந்தச் சொற்றொடர் ஒரு வானதூதரையா, மனிதச் செய்தியாளரையா, அல்லது சிறப்பான இறைவெளிப்பாட்டையா குறிக்கிறது என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை. மூலத்தின் சொற்பொருளும் இறையியல் நெருக்கடியும் பாதுகாக்கப்படுகின்றன.
- issue: בַּגִּבּוֹרִים என்பதன் தொடர்பு
  choice: வலிமைமிக்கவர்களுக்கு எதிராக
  alternative: வலிமைமிக்கவர்களிடையே; வலிமைமிக்க வீரர்களுடன்
  rationale: சூழல் போரில் எதிரிகளைச் சந்திக்க யாவேக்கு உதவ வராததைக் குறிக்கலாம். ஆனால் எபிரெய முன்னிடைச்சொல் பலவாறு புரிந்துகொள்ளப்படக்கூடியதால் மாற்று வாசிப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. பாடல் தன்மையையும் மூலத்தின் வலியுறுத்தும் மறுபடியுரைத்தலையும் காக்க வரிகள் பிரிக்கப்பட்டுள்ளன. ‘சபியுங்கள்’ வலுவான நீதித்தீர்ப்புச் சாயலைத் தக்கவைக்கிறது; ‘கடுமையாக’ என்பது எபிரெயத் தீவிரப்படுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
