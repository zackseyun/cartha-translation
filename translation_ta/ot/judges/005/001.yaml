base_translation:
  language: en
  yaml_path: translation/ot/judges/005/001.yaml
  text: 'Then Deborah and Barak son of Abinoam sang on that day[a], saying:'
translation:
  language: ta
  text: 'தெபோராளும் அபினோவாமின் மகன் பாராக்கும் அந்நாளில் பாடினார்கள்[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் வினை பெண்பால் ஒருமையில், “தெபோராள் பாடினாள்” என உள்ளது; பின்னர் பாராக் சேர்த்துக் குறிப்பிடப்படுகிறார். சூழலின்படி, தெபோராளும் பாராக்கும் இணைந்து பாடினார்கள் என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשַׁר
  choice: பாடினாள்
  rationale: שׁיר என்பதன் எளிய பொருள் ‘பாடு’. எபிரெய வினை பெண்பால் ஒருமையில் இருந்து முதலில் குறிப்பிடப்படும் தெபோராளுடன் இலக்கண ஒத்திசைவு பெறுகிறது.
- source_word: דְּבוֹרָה
  choice: தெபோராள்
  rationale: தமிழில் வழக்கிலுள்ள வேதாகமப் பெயர்வடிவம்; வாக்கியத்தில் எழுவாயாக இயல்பாக அமைகிறது.
- source_word: וּבָרָק
  choice: பாராக்குடன்
  rationale: இணைப்புச் சொல்லால் பாராக் பாடலில் தெபோராளுடன் இணைக்கப்படுகிறார். எபிரெய ஒருமை வினையைத் தமிழில் இயல்பாகத் தக்கவைக்க ‘உடன்’ அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: בֶּן אֲבִינֹעַם
  choice: அபினோவாமின் மகன்
  rationale: எபிரெய தந்தைவழி அடையாளக் கட்டமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்நாளில்
  rationale: குறிப்பிட்ட வெற்றிநாளைக் குறிக்கும் காலச் சொற்றொடரைச் சுருக்கமாகவும் முறையாகவும் தருகிறது.
- source_word: לֵאמֹר
  choice: பின்வரும் பாடலை அறிமுகப்படுத்தும் முக்காற்புள்ளி
  rationale: לֵאמֹר என்பது அடுத்து வரும் உரையை அறிமுகப்படுத்தும் மேற்கோள் குறியீடு. தமிழில் ‘சொல்லி’ எனச் சேர்ப்பது ‘பாடினாள்’ என்பதோடு செயற்கையாக இருப்பதால், முக்காற்புள்ளி அதன் உரைஅறிமுகச் செயல்பாட்டை இயல்பாக நிறைவேற்றுகிறது.
