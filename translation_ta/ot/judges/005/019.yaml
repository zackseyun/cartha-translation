  text: Kings came; they fought. Then the kings of Canaan fought at Taanach[a], by the waters of Megiddo; they took no plunder of silver.
translation:
  language: ta
  text: அரசர்கள் வந்தார்கள்; போரிட்டார்கள். அப்போது கானானின் அரசர்கள் தானாக்கில், மெகிதோவின் நீர்நிலைகளுக்கு அருகே போரிட்டார்கள்; வெள்ளிக் கொள்ளைப்பொருள் எதையும் அவர்கள் எடுத்துக்கொள்ளவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெள்ளி ஆதாயம்” அல்லது “வெள்ளி இலாபம்.” எபிரெயச் சொற்றொடர் பொதுவாகப் பொருளாதார ஆதாயத்தையும் குறிக்கலாம்; இங்குள்ள போர்ச் சூழலில் “வெள்ளிக் கொள்ளைப்பொருள்” என்பது நன்கு பொருந்துகிறது.
    reason: lexical_alternative
