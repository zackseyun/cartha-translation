  text: וְ/שָׂרַ֤/י בְּ/יִשָּׂשכָר֙ עִם דְּבֹרָ֔ה וְ/יִשָּׂשכָר֙ כֵּ֣ן בָּרָ֔ק בָּ/עֵ֖מֶק שֻׁלַּ֣ח בְּ/רַגְלָ֑י/ו בִּ/פְלַגּ֣וֹת רְאוּבֵ֔ן גְּדֹלִ֖ים חִקְקֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/015.yaml
  text: And the princes of Issachar were with Deborah[a]; and Issachar was likewise with Barak; into the valley they were sent at his feet[c][b]. Among the divisions of Reuben there were great searchings of heart.
translation:
  language: ta
  text: இசக்காரின் தலைவர்கள் தெபோராவுடன் இருந்தார்கள்[a]; இசக்காரும் பாராக்குடன் இருந்தான். பாராக்கைப் பின்தொடர்ந்து, அவர்கள் பள்ளத்தாக்கிற்குள் அனுப்பப்பட்டார்கள்[b]. ரூபனின் பிரிவுகளிடையே மனத்தின் ஆழ்ந்த ஆராய்ச்சிகள் இருந்தன[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இசக்காரின் பிரபுக்கள்” அல்லது “இசக்காரின் முதன்மையானவர்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயக் கவிதைச் சொற்றொடர் எழுத்துப்படியான உடைமையைக் காட்டாமல் மொழிமரபுப்படி வந்திருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்படி, “அவனுடைய காலடிகளில்”; அதாவது, அவனை நெருக்கமாகப் பின்தொடர்ந்து.
    reason: lexical_alternative
  - marker: c
    text: “பெரும் மனத் தீர்மானங்கள்” அல்லது “மனத்தின் ஆழ்ந்த ஆலோசனைகள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் கடினமானது; இச்சூழலில் அது ரூபனின் செயலுக்குப் பதிலான உள்ளார்ந்த தயக்கத்தையும் ஆலோசனையையும் சுட்டக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂרַי
  choice: இசக்காரின் தலைவர்கள்
  rationale: கவிதைச் சூழலில் உள்ள முதல் நபர் ஒருமை பின்னொட்டை எழுத்துப்படியான ‘என் தலைவர்கள்’ என்று கொள்ளாமல், இசக்காரைச் சார்ந்த தலைவர்கள் என மொழிமரபுப்படி எடுத்துக்கொள்கிறது; ‘தலைவர்கள்’ நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: עִם
  choice: உடன் இருந்தார்கள்
  rationale: தெபோராவுடன் இணைந்து நின்ற துணையையும் பங்கேற்பையும் நேரடியாகக் காட்டுகிறது.
- source_word: וְיִשָּׂשכָר כֵּן בָּרָק
  choice: இசக்காரும் பாராக்குடன் இருந்தான்
  rationale: எபிரெயக் கவிதையின் விடுபட்ட வினையைத் தமிழில் இயல்புக்காக நிரப்பி, כֵּן குறிக்கும் ஒத்திணைப்பை ‘உம்’ மூலம் வெளிப்படுத்துகிறது.
- source_word: בָּעֵמֶק
  choice: பள்ளத்தாக்கிற்குள்
  rationale: போருக்காகப் பள்ளத்தாக்கை நோக்கிச் சென்ற இயக்கத்தை இடப்பொருளாக மட்டும் அல்லாமல் இலக்கை நோக்கிய இயக்கமாகக் காட்டுகிறது.
- source_word: שֻׁלַּח
  choice: விரைந்து சென்றார்கள்
  rationale: பொதுவாக ‘அனுப்பப்பட்டான்’ எனப் பொருள்படும் ஒருமைச் செயப்பாட்டு வடிவம் இங்கு கூட்டு இனப்பெயருடன் கவிதைநடையில் வருகிறது. சூழலில் படைகள் பாராக்கைப் பின்தொடர்ந்து போருக்குள் பாய்ந்ததைக் காட்டுவதால், தமிழில் இயல்பான செயற்பாட்டு வடிவம் தேர்ந்தெடுக்கப்பட்டது; செயப்பாட்டு நுணுக்கம் மொழிபெயர்ப்பில் முழுமையாகத் தக்கவைக்கப்படவில்லை.
- source_word: בְּרַגְלָיו
  choice: அவனைப் பின்தொடர்ந்து
  rationale: எழுத்துப்படி ‘அவனுடைய காலடிகளில்’; இங்கு பாராக்கை நெருக்கமாகப் பின்தொடர்வது என்ற மரபுத்தொடரின் பொருள் பிரதான உரையில் தெளிவாக வழங்கப்படுகிறது.
- source_word: בִּפְלַגּוֹת רְאוּבֵן
  choice: ரூபனின் பிரிவுகளிடையே
  rationale: ரூபன் கோத்திரத்தின் உட்பிரிவுகள் அல்லது அணிகளைச் சுட்டும் சொல்லின் அடிப்படைப் பொருளைத் தக்கவைக்கிறது.
- source_word: גְּדֹלִים
  choice: ஆழ்ந்த
  rationale: ‘பெரிய’ என்ற நேரடிப் பொருளைத் தமிழில் மன ஆலோசனைகளின் தீவிரத்தையும் கனத்தையும் இயல்பாக உணர்த்தும் வகையில் வழங்குகிறது.
- source_word: חִקְקֵי לֵב
  choice: மன ஆலோசனைகள்
  rationale: கடினமான கவிதைச் சொற்றொடர். சூழலில் செயலில் இறங்காமல் உள்ளத்தில் ஆழ்ந்து ஆராய்ந்ததையோ தீர்மானித்ததையோ குறிக்கலாம்; ‘மன ஆலோசனைகள்’ அந்தத் தெளிவின்மையை ஓரளவு காக்கிறது.
theological_decisions:
- issue: ரூபனின் חִקְקֵי לֵב என்பது மன ஆராய்ச்சியா உறுதியான தீர்மானங்களா
  choice: ஆழ்ந்த மன ஆலோசனைகள்
  alternative: பெரிய மனத் தீர்மானங்கள்
  rationale: அடுத்தடுத்த வரிகளில் ரூபனின் தயக்கம் வலியுறுத்தப்படுவதால் உள்ளார்ந்த ஆலோசனை பொருத்தமானது; எனினும் எபிரெயச் சொல் ‘தீர்மானங்கள்’ என்றும் புரிந்துகொள்ளப்படலாம் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், தெபோராவின் பாடலுக்குரிய உயர்ந்த கவிதைத் தொனியை மிகைப்படுத்தாமல் காக்கும் நடை. கோத்திரப் பெயர் ஒருமைக் கூட்டு எழுவாயாக வரும் இடத்தில் ‘இசக்காரும் ... இருந்தான்’ எனவும், அதன் படைவீரர்களைக் குறிக்கும் அடுத்த இடத்தில் பன்மை வினையாகவும் வழங்கப்பட்டுள்ளது. அடிக்குறி வரிசை பிரதான உரையில் [a], [b], [c] என ஒழுங்குபடுத்தப்பட்டுள்ளது.
