base_translation:
  language: en
  yaml_path: translation/ot/judges/005/012.yaml
  text: Awake[a], awake, Deborah! Awake, awake, sing a song! Rise up, Barak, and take captive your captives[b], son of Abinoam.
translation:
  language: ta
  text: விழித்தெழு, விழித்தெழு, தெபோராளே! விழித்தெழு, விழித்தெழு, ஒரு பாடலைப் பாடு![a] எழுந்திரு, பாராக்கே! உன் கைதிகளைச் சிறைப்பிடி,[b] அபினோவாமின் மகனே!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்பட, “ஒரு பாடலைப் பேசு.” வழக்கமாக “பாடு” என்று சொல்ல வேண்டிய இடத்தில் எபிரேய மொழி “பேசு” என்ற வினைச்சொல்லைப் பயன்படுத்துகிறது; இது கவிதை அழைப்பின் தனித்துவமான வலிமையைத் திட்டமிட்டே காத்திருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்பட, “உன் கைதிகளைச் சிறைப்பிடி.” எதிரிகளை வென்று அவர்களைக் கைதிகளாகப் பிடித்துச் செல்வதைக் குறிக்கும் எபிரேயச் சொல்லாட்சி.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרִי
  choice: விழித்தெழு
  rationale: பெண்பால் ஒருமை கட்டளை நான்கு முறை மீண்டும் வருகிறது. ‘விழித்தெழு’ என்பது விழிப்பையும் செயலுக்கு எழும்பும் அழைப்பையும் இயல்பான தமிழில் வெளிப்படுத்தி, கவிதையின் அவசரத்தையும் காக்கிறது.
- source_word: דְּבוֹרָה
  choice: தெபோரா
  rationale: தனிப்பெயர் நவீனத் தமிழில் ஒலிபெயர்க்கப்பட்டது; அழைப்புவேற்றுமையில் ‘தெபோராளே’ என வருகிறது.
- source_word: דַּבְּרִי שִׁיר
  choice: ஒரு பாடலைப் பாடு
  rationale: எபிரெயச் சொற்றொடர் சொற்பட ‘ஒரு பாடலைப் பேசு’ என்றாலும், பாடல் சூழலில் நோக்கப்பட்ட செயலை இயல்பான தமிழில் ‘ஒரு பாடலைப் பாடு’ எனத் தருகிறது; மூலத்தின் தனித்துவமான சொல்லாட்சி அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: קוּם
  choice: எழுந்திரு
  rationale: பாராக்கை நோக்கிய ஆண்பால் ஒருமை கட்டளை. போர் வெற்றிப் பாடலின் செயலுக்கான அழைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: בָּרָק
  choice: பாராக்
  rationale: தனிப்பெயர் ஒலிபெயர்க்கப்பட்டது; அழைப்புவேற்றுமையில் ‘பாராக்கே’ என வருகிறது.
- source_word: וּשֲׁבֵה שֶׁבְיְךָ
  choice: உன் சிறைப்பட்டோரைச் சிறைப்பிடித்துக்கொள்
  rationale: வினைச்சொல்–பெயர்ச்சொல் மீளுருவை முடிந்தவரைத் தக்கவைத்து, எதிரிகளை வென்று கைதிகளாக்கும் இராணுவப் பொருளைத் தெரிவிக்கிறது.
- source_word: בֶּן אֲבִינֹעַם
  choice: அபினோவாமின் மகனே
  rationale: தந்தைவழி அடையாளப்படுத்தும் மூல வடிவம் அழைப்பாகத் தக்கவைக்கப்பட்டது.
