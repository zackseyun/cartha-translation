- from: விழித்தெழு, விழித்தெழு, தெபோராளே! விழித்தெழு, விழித்தெழு, ஒரு பாடலைப் பாடு![a] எழுந்திரு, பாராக்கே! உன் சிறைப்பட்டோரைச் சிறைப்பிடித்துக்கொள்,[b] அபினோவாமின் மகனே!
  to: விழித்தெழு, விழித்தெழு, தெபோராளே! விழித்தெழு, விழித்தெழு, ஒரு பாடலைப் பாடு![a] எழுந்திரு, பாராக்கே! உன் கைதிகளைச் சிறைப்பிடி,[b] அபினோவாமின் மகனே!
