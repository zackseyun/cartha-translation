translation_notes:
  register: நவீனத் தரத் தமிழில், பாடலுக்கேற்ற உயர்வும் சாதாரண வாசகர்களுக்கான தெளிவும் சமநிலைப்படுத்தப்பட்டுள்ளன. நான்கு முறை வரும் கட்டளையும், பாராக் மற்றும் அவரது தந்தையை நேரடியாக அழைக்கும் வடிவமும் பாதுகாக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் சேர்க்கப்பட்டுள்ளன.
