translation:
  language: ta
  text: மலைகள் யாவேவின் முன்னிலையில் வழிந்தன[a]; இந்தச் சீனாய், இஸ்ரவேலின் கடவுளான யாவேவின் முன்னிலையில்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வழிந்தன’ என்பதற்கான எபிரெய வினை, நேரடியாக ‘ஒழுகின, சொட்டின’ எனப் பொருள்படும். இந்த இறைத்தோற்றக் கவிதைப் படிமத்தைச் சில மொழிபெயர்ப்புகள் ‘உருகின’ என்றும், விளக்கமாக ‘நடுங்கின’ என்றும் தருகின்றன.
