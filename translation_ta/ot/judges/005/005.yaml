  rationale: எபிரெயக் கவிதையின் விடுபட்ட வினையைத் தமிழில் இயல்பாக நிரப்புகிறது; அதே நேரத்தில் சீனாய் முந்தைய மலைகளுடன் தொடர்புபடுத்தப்படுவதைப் பாதுகாக்கிறது.
