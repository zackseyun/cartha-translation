lexical_decisions:
- source_word: הָרִים
  choice: மலைகள்
  rationale: எபிரெயச் சொல்லின் பன்மையையும் அதன் திட்டவட்ட வடிவத்தையும் இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: נָזְלוּ
  choice: உருகி வழிந்தன
  rationale: வேர்ச்சொல்லின் ‘வழிதல்/ஒழுகுதல்’ என்ற நேரடிப் படிமத்தைப் பாதுகாக்கிறது; மலைகளைப் பற்றிய கவிதைச் சூழலில் ‘உருகி’ என்பது அந்தப் படிமத்தை இயல்பாகப் புரியவைக்கிறது. ‘நடுங்கின’ என்பது சூழலுக்கு ஏற்ற விளக்கம் என்றாலும் வினையின் நேரடிப் பொருள் அல்ல.
- source_word: מִפְּנֵי
  choice: முன்பாக
  rationale: ‘முகம்/சந்நிதியிலிருந்து’ என்ற எபிரெய மரபுத்தொடரை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது; இங்கு ஒருவரின் பிரசன்னத்தால் ஏற்படும் எதிர்வினை என்ற நிழற்பொருளும் நிலைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், நான்கு எழுத்துகளைக் கொண்ட இறைப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: זֶה סִינַי
  choice: இந்தச் சீனாய்
  rationale: ‘இந்த’ என்ற திடீர் கவிதைச் சுட்டை வழுவாமல் காக்கிறது; மூலத்தில் இல்லாத ‘மலை’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: இணைப்புநிலைக் கட்டமைப்பை இயல்பான தமிழில் பிரதிபலித்து, யாவேயை இஸ்ரவேலின் கடவுளாக அடையாளப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
