  source_fidelity: முதன்மை உரையில் בַּעֲמָמֶיךָ என்பதற்கான ‘உன் மக்கள் கூட்டங்களின் நடுவிலிருந்து’ என்பது மூலத்தில் இல்லாத ‘இலிருந்து’ என்ற மூல/புறப்பாட்டு கருத்தைச் சேர்க்கிறது. எபிரெயச் சொல் ‘உன் மக்களிடையே/உன் மக்கள் கூட்டங்களின் நடுவில்’ என்பதே. மற்ற முக்கியச் சொற்கள்—அமலேக்கில், மாகீர், தலைவர்கள், எழுத்தரின் கோல்—மூலத்தின் கவிதைத் தெளிவின்மையைப் போதுமான அளவு காக்கின்றன.
