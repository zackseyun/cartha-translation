source:
  edition: WLC
  text: מִנִּ֣י אֶפְרַ֗יִם שָׁרְשָׁ/ם֙ בַּ/עֲמָלֵ֔ק אַחֲרֶ֥י/ךָ בִנְיָמִ֖ין בַּֽ/עֲמָמֶ֑י/ךָ מִנִּ֣י מָכִ֗יר יָֽרְדוּ֙ מְחֹ֣קְקִ֔ים וּ/מִ֨/זְּבוּלֻ֔ן מֹשְׁכִ֖ים בְּ/שֵׁ֥בֶט סֹפֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/014.yaml
  text: From Ephraim those whose root was in Amalek[a]; after you, Benjamin, among your peoples. From Machir commanders came down[e][d][c][b], and from Zebulun those who wield the staff of the scribe.
translation:
  language: ta
  text: எப்பிராயீமிலிருந்து, அமலேக்கில் வேரூன்றியவர்கள்[a] வந்தார்கள்; உனக்குப் பின்னால், பென்யமீனே, உன் மக்கள் கூட்டங்களின் நடுவில் வந்தார்கள்[b]. மாகீரிலிருந்து[c] தலைவர்கள்[d] இறங்கி வந்தார்கள்; செபுலோனிலிருந்து எழுத்தரின் கோலைக் கையாளுகிறவர்கள்[e] வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அமலேக்குக்கு எதிராக வேரூன்றியவர்கள்”; அல்லது, “அமலேக்கின் மலைநாட்டில் வேரூன்றியவர்கள்.” எபிரெயக் கவிதைவரி கடினமானது; இது புவியியல் குறிப்பாக இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “பென்யமீன் உன்னைப் பின்தொடர்ந்தான், உன் குலத்தாரோடு.” “உன் மக்கள் கூட்டங்களின் நடுவில்” என்பது அசாதாரணமான எபிரெயத் தொடரை நெருக்கமாக மொழிபெயர்க்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “மாகீர்” என்பது மனாசே கோத்திரத்தின் முதன்மைக் குலம்; சில மொழிபெயர்ப்புகள் விரிவான கோத்திரப் பொருளில் “மனாசே” என்று தருகின்றன.
    reason: cultural_note
  - marker: d
    text: அல்லது, “சட்டம் வகுப்பவர்கள்” அல்லது “ஆட்சியாளர்கள்.” எபிரெயச் சொல் ஆணையிடுகிறவர்களையோ ஆணைகள் வகுப்பவர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: e
    text: அல்லது, “எழுத்தரின் கோலை இழுப்பவர்கள்”; அல்லது, “படைத் தலைவரின் கோலை ஏந்துகிறவர்கள்.” இந்த அரிய எபிரெயத் தொடர் படைவீரர்களைப் பதிவு செய்தல், திரட்டுதல், அல்லது வழிநடத்துதல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּי אֶפְרַיִם
  choice: எப்பிராயீமிலிருந்து
  rationale: מִנִּי மூலத்தையோ புறப்பட்ட இடத்தையோ குறிக்கிறது; கவிதைநடையில் வரும் கோத்திரப் பட்டியலை இயல்பாகத் தொடர்கிறது.
- source_word: שָׁרְשָׁם
  choice: வேரூன்றியவர்கள்
  rationale: ‘வேர்’ என்ற உருவகத்தைத் தக்கவைத்தபடி, தமிழில் மக்களைக் குறிக்கும் தொடராக இயல்பாக அமைகிறது; வெறும் ‘சந்ததியினர்’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: בַּעֲמָלֵק
  choice: அமலேக்கில்
  rationale: בְ முன்னிடைச்சொல்லின் இயல்பான இடப்பொருளைத் தக்கவைக்கிறது; தெளிவில்லாத கவிதைவரியை ‘அமலேக்குக்கு எதிராக’ என்று இராணுவப் பொருளில் தீர்மானிக்கவில்லை.
- source_word: אַחֲרֶיךָ בִנְיָמִין
  choice: உனக்குப் பின்னால், பென்யமீனே
  rationale: வினைச்சொல் இல்லாத எபிரெயக் கவிதைச் சுருக்கத்தையும், பென்யமீனை நேரடியாக அழைக்கும் அமைப்பையும் இயன்றவரை பாதுகாக்கிறது.
- source_word: בַּעֲמָמֶיךָ
  choice: உன் மக்கள் கூட்டங்களின் நடுவிலிருந்து
  rationale: ‘உன் மக்களிடையே’ என்ற அசாதாரண பன்மை அமைப்பைத் தெளிவாக வைத்திருக்கிறது; குலங்கள் அல்லது படைகள் என்று மிகுதியாக விளக்கவில்லை.
- source_word: מִנִּי מָכִיר
  choice: மாகீரிலிருந்து
  rationale: மூலத்தில் உள்ள மாகீர் என்ற பெயரையே தக்கவைக்கிறது; அதை விரிவான மனாசே கோத்திரப் பெயராக மாற்றவில்லை.
- source_word: יָרְדוּ
  choice: இறங்கி வந்தார்கள்
  rationale: ירד என்பதன் நேரடியான இறங்குதல் பொருளையும் பாடலின் பார்வைநிலைக்கு ஏற்ற வருகையையும் வெளிப்படுத்துகிறது.
- source_word: מְחֹקְקִים
  choice: தலைவர்கள்
  rationale: சட்டம் வகுப்போர், ஆட்சியாளர்கள், கட்டளையிடுவோர் ஆகிய பொருள் வரம்பைக் கொண்ட சொல்லுக்கு, இந்தப் படைத்திரட்டல் சூழலில் பொதுவான அதிகாரப் பொருளை அளிக்கிறது.
- source_word: וּמִזְּבוּלֻן
  choice: செபுலோனிலிருந்து
  rationale: கோத்திரங்களின் மூலத்தைச் சுட்டும் தொடரை நேரடியாகத் தொடர்கிறது.
- source_word: מֹשְׁכִים
  choice: கையாளுகிறவர்கள்
  rationale: ‘இழுப்பவர்கள்’ என்ற அடிப்படைப் பொருளை ஒரு கருவியைப் பயன்படுத்துவோர் என்ற இயல்பான தமிழில் தருகிறது; அதன் துல்லியச் செயலைத் தீர்மானிக்கவில்லை.
- source_word: בְּשֵׁבֶט סֹפֵר
  choice: எழுத்தரின் கோலை
  rationale: שֵׁבֶט என்பதன் ‘கோல்’ உருவகத்தையும் סֹפֵר என்பதன் ‘எழுத்தர்’ பொருளையும் பாதுகாக்கிறது; அது படைத்திரட்டும் அதிகாரக்கோலா அல்லது எழுதும் கருவியா என்ற தெளிவின்மையைத் திறந்தே வைக்கிறது.
theological_decisions:
- issue: இந்த வசனத்தில் நேரடியான கோட்பாட்டுத் தீர்மானம் இல்லை; தெளிவற்ற கவிதை-புவியியல் மற்றும் பதவிச்சொற்களை எவ்வாறு கையாளுவது
  choice: தெளிவின்மையை முதன்மை உரையிலும் அடிக்குறிப்புகளிலும் பாதுகாத்தல்
  alternative: போரியல் அல்லது நிர்வாகப் பொருளை மட்டும் உறுதியாகத் தேர்ந்தெடுத்தல்
  rationale: மூல எபிரெயம் பல இடங்களில் அரிதானதும் சுருக்கமானதும் ஆக இருப்பதால், ஒரு குறிப்பிட்ட இறையியல் அல்லது வரலாற்று விளக்கத்தை உரைக்குள் கட்டாயப்படுத்தக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சுருக்கமான கோத்திரப் பட்டியல் ஓட்டம் காக்கப்பட்டுள்ளது; தமிழில் முழுமையான வாக்கியமாக அமைய ‘வந்தார்கள்’ தேவையான இடங்களில் வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் தொடர்புடைய சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளன.
