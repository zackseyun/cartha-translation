base_translation:
  language: en
  yaml_path: translation/ot/judges/005/027.yaml
  text: Between her feet he sank[a], he fell, he lay; between her feet he sank, he fell; where he sank[c][b], there he fell—destroyed.
translation:
  language: ta
  text: 'அவளுடைய கால்களுக்கு நடுவே அவன் மடங்கினான், விழுந்தான், கிடந்தான்;

    அவளுடைய கால்களுக்கு நடுவே அவன் மடங்கினான், விழுந்தான்;

    அவன் மடங்கிய இடத்தில், அங்கே அவன் விழுந்தான்—அழிக்கப்பட்டவனாய்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயக் கவிதையில் “மடங்கினான், விழுந்தான், கிடந்தான் … மடங்கினான், விழுந்தான்” என்ற குறுகிய வினைச்சொற்கள் வலியுறுத்துவதற்காக மீண்டும் வருகின்றன. “கால்களுக்கு நடுவே” என்பதை “காலடியில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative_and_poetic_note
lexical_decisions:
- source_word: בֵּין רַגְלֶיהָ
  choice: அவளுடைய கால்களுக்கு நடுவே
  rationale: எபிரெயச் சொற்றொடரின் இடவியல் உருவகத்தையும் அதன் மறுபடியுரைத்தலையும் நேரடியாகப் பாதுகாக்கிறது. ‘அவளுடைய காலடியில்’ என்பது இயல்பான மாற்றாக இருந்தாலும், மூலத்தின் ‘நடுவே’ என்பதை மங்கச் செய்யும்.
- source_word: כָּרַע
  choice: மடங்கி
  rationale: முழங்கால் மடிதல், குனிதல், சரிதல் ஆகிய பொருள் வாய்ப்புகளைத் திறந்தே வைத்துக் கொண்டு, மரணக் காட்சியில் கீழே சரியும் இயக்கத்தைச் சுருக்கமாகக் காட்டுகிறது; ‘வணங்கினான்’ என்ற தன்னார்வச் செயல் கருத்தைத் தவிர்க்கிறது.
- source_word: נָפַל
  choice: விழுந்தான் / வீழ்ந்து
  rationale: נפל என்பதன் அடிப்படைப் பொருளான விழுதலைப் பாதுகாக்கிறது. இறுதி அடியில் தமிழின் இயல்பான வாக்கிய ஓட்டத்திற்காக வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: שָׁכָב
  choice: கிடந்தான்
  rationale: சுருக்கமான வினைத்தொடரையும், விழுந்த பின் அசைவின்றிக் கிடக்கும் நிலையையும் இயல்பான தமிழில் தருகிறது.
- source_word: בַּאֲשֶׁר ... שָׁם
  choice: இடத்திலேயே
  rationale: ‘எங்கு ... அங்கே’ என்ற மூலத்தின் இடக் குறிப்பையும் வலியுறுத்தலையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: שָׁדוּד
  choice: அழிக்கப்பட்டுக் கிடந்தான்
  rationale: கொள்ளையிடப்பட்ட, பாழாக்கப்பட்ட, முற்றிலும் வீழ்த்தப்பட்ட நிலையைச் சுட்டும் சொல்லை, கொல்லப்பட்ட சிசெராவைக் குறிக்கும் இச்சூழலில் இயல்பாகத் தருகிறது; வெறும் ‘இறந்தான்’ என்று பொருளைத் தட்டையாக்கவில்லை.
