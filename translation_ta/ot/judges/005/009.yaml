  text: לִבִּ/י֙ לְ/חוֹקְקֵ֣י יִשְׂרָאֵ֔ל הַ/מִּֽתְנַדְּבִ֖ים בָּ/עָ֑ם בָּרֲכ֖וּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/009.yaml
  text: My heart is with the leaders of Israel[a], who volunteered among the people. Bless Yahweh!
translation:
  language: ta
  text: என் உள்ளம் இஸ்ரவேலின் தலைவர்களோடு இருக்கிறது[a]; அவர்கள் மக்களிடையே தாமாக முன்வந்தார்கள். யாவேவை வாழ்த்துங்கள்!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “இஸ்ரவேலின் சட்டம் வகுப்பவர்களோடு என் உள்ளம் இருக்கிறது; அவர்கள் மக்களிடையே மனமுவந்து தங்களை அளித்தார்கள்.”'
    reason: חקק என்பதற்கு ஆணையிடுதல் அல்லது சட்டம் வகுத்தல் என்ற வேர்ப்பொருளும், נדב என்பதற்கு மனமுவந்து தம்மையே அளித்தல் என்ற முழுமையான நிழற்பொருளும் இருப்பதால் இந்த மாற்று மொழிபெயர்ப்பு சாத்தியம்.
lexical_decisions:
- source_word: לִבִּי
  choice: என் உள்ளம்
  rationale: முதல் நபர் ஒருமை உரிமை விகுதியுடன் வரும் ‘இதயம்’ என்ற எபிரெய உருவகத்தை இயல்பான நவீன தமிழில் காக்கிறது; இங்கு உள்ளார்ந்த பற்றையும் பாராட்டையும் தெரிவிக்கிறது.
- source_word: לְחוֹקְקֵי
  choice: தலைவர்களோடு இருக்கிறது
  rationale: חקק வேரிலிருந்து வந்த இச்சொல் ஆணையிடுகிறவர்கள், ஆட்சிப் பொறுப்பேற்கிறவர்கள் எனப் பொருள்படலாம். இப்பாடலின் சூழலில் நவீன சட்டமியற்றுபவர்கள் என்ற குறுகிய கருத்தைவிட ‘தலைவர்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேலின்
  rationale: தலைவர்கள் இஸ்ரவேலைச் சேர்ந்தவர்கள் என்பதைத் தெரிவிக்கும் இயல்பான தமிழ் உரிமைத் தொடர்பு.
- source_word: הַמִּתְנַדְּבִים
  choice: தாமாக முன்வந்தார்கள்
  rationale: נדב என்பதன் Hitpael வடிவம் மனமுவந்து தம்மையே அளித்து முன்வருதலைக் குறிக்கிறது. ‘தாமாக முன்வந்தார்கள்’ தன்னார்வத் தன்மையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בָּעָם
  choice: மக்களிடையே
  rationale: עם என்பதன் பரந்த அடிப்படைப் பொருள் ‘மக்கள்’. சூழலால் படைவீரர்கள் குறிக்கப்படலாம் என்றாலும், எபிரெயச் சொல்லின் பரப்பைச் சுருக்காமல் வைத்திருக்கிறது.
- source_word: בָּרֲכוּ
  choice: வாழ்த்துங்கள்
  rationale: ברך என்பதன் இரண்டாம் நபர் பன்மை கட்டளை வடிவத்தை நேரடியாகக் காக்கிறது. தேவனை நோக்கிய பயன்பாட்டில் ‘வாழ்த்துங்கள்’ என்பது கண்ணியமான, புரியத்தக்க தமிழ்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய வேதாகமத்தில் வரும் தனிப்பெயரான יהוה-வை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் ஒரு பொதுப் பட்டம் அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைத் தனிப்பெயர் நேரடியாக உள்ளது. தமிழில் பரவலாகப் பயன்படும் ‘யெகோவா’ என்பதை முதன்மைப் பாடத்தில் வைத்து, உச்சரிப்பு மறுகட்டமைப்பின் வேறுபாட்டைத் தேவையின்றி தீர்மானிப்பதைத் தவிர்க்கிறது.
- issue: தலைமைப் பொறுப்பும் தன்னார்வ முன்வருதலும் இடையிலான தொடர்பு
  choice: தலைவர்களோடு இருக்கிறது; அவர்கள் ... தாமாக முன்வந்தார்கள்
  alternative: சட்டம் வகுப்பவர்களோடு என் உள்ளம் இருக்கிறது; அவர்கள் மக்களிடையே மனமுவந்து தங்களை அளித்தார்கள்
  rationale: எபிரெயப் பாடலில் தலைவர்கள் தாமாக முன்வந்தவர்கள் என்ற பாராட்டுத் தொடர்பு உள்ளது. அதைத் தக்கவைத்தபடியே, חקק வேரின் சட்டம்/ஆணை சார்ந்த நிழற்பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். கவிதைநடையின் சுருக்கத்தையும் நேரடி அழைப்பையும் காக்கிறது. ‘என் உள்ளம்’ என்ற எபிரெய உருவகம் அப்படியே பாதுகாக்கப்பட்டுள்ளது; அரிதான ‘சட்டமியற்றுவோர்’ போன்ற நிர்வாகச் சொல்லுக்குப் பதில் பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் ‘தலைவர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
