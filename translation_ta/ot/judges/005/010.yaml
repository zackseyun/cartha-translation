  text: רֹכְבֵי֩ אֲתֹנ֨וֹת צְחֹר֜וֹת יֹשְׁבֵ֧י עַל מִדִּ֛ין וְ/הֹלְכֵ֥י עַל דֶּ֖רֶךְ שִֽׂיחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/010.yaml
  text: You who ride on white donkeys[a], you who sit on carpets[b], and you who walk on the road—speak!
translation:
  language: ta
  text: 'வெண்ணிறப் பெண் கழுதைகளின்மேல் சவாரி செய்கிறவர்களே,


    விரிப்புகளின்மேல்[a] அமர்கிறவர்களே,


    சாலையில் நடந்து செல்கிறவர்களே—


    பேசுங்கள்![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சேணவிரிப்புகளின்மேல்” அல்லது “கம்பளங்களின்மேல்”; இதற்கான எபிரெயச் சொல் அரிதானது, அதன் பொருள் உறுதியற்றது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எடுத்துச் சொல்லுங்கள்” அல்லது “அதை விவரித்துச் சொல்லுங்கள்”; எபிரெய வினைச்சொல் பேசுதல், எடுத்துரைத்தல், நினைவுகூர்ந்து விவரித்தல் ஆகிய பொருட்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְבֵי
  choice: சவாரி செய்கிறவர்களே
  rationale: ஆண்பால் பன்மை இணைநிலைப் பெயரெச்சம் இங்கு அழைப்பாகச் செயல்படுகிறது; நேரடி அழைப்பையும் சவாரி செய்யும் படிமத்தையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: אֲתֹנוֹת
  choice: பெண் கழுதைகள்
  rationale: எபிரெயச் சொல் குறிப்பாகப் பெண் கழுதைகளைக் குறிக்கிறது. தமிழில் இதை இயல்பாகவும் துல்லியமாகவும் வெளிப்படுத்த முடிவதால் பாலினக் குறிப்பைத் தக்கவைத்துள்ளது.
- source_word: צְחֹרוֹת
  choice: வெண்ணிற
  rationale: இந்தப் பெயரடை வெண்மை அல்லது ஒளிர்ந்த நிறத்தைக் குறிக்கிறது; இங்கு தனிச்சிறப்பும் மதிப்பும் வாய்ந்த சவாரி விலங்குகளின் படிமத்துக்கு ‘வெண்ணிற’ பொருந்துகிறது.
- source_word: יֹשְׁבֵי
  choice: அமர்கிறவர்களே
  rationale: இணையான மற்ற பெயரெச்சங்களைப் போல இதுவும் அழைப்பாக உள்ளது. அடுத்துவரும் சொல் அமரும் பொருளைக் குறிக்க வாய்ப்புள்ளதால் ‘வசிக்கிறவர்கள்’ என்பதற்குப் பதில் ‘அமர்கிறவர்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: מִדִּין
  choice: விரிப்புகள்
  rationale: இது அரிதான, பொருள் உறுதியற்ற சொல். சூழலில் அமரப் பயன்படும் துணி, கம்பளம் அல்லது சேணவிரிப்பு என்ற பொருள் மிகச் சாத்தியம்; ‘விரிப்புகள்’ அந்தத் தெளிவின்மையை அளவுக்கு மீறித் தீர்மானிக்காமல் இயல்பாகக் காட்டுகிறது.
- source_word: וְהֹלְכֵי
  choice: நடந்து செல்கிறவர்களே
  rationale: மூன்றாவது பன்மை அழைப்புப் பெயரெச்சம். ‘நடந்து செல்கிற’ என்பது பயணிகளைக் குறிக்கும் அதேவேளையில் மூலத்தின் உறுதியான இயக்கப் படிமத்தையும் காக்கிறது.
- source_word: דֶּרֶךְ
  choice: சாலை
  rationale: பயணச் சூழலில் דֶּרֶךְ என்பதன் நேரடியான பொருள் சாலை அல்லது வழி; ‘சாலை’ இங்கு இயல்பான இடப்பொருளை வழங்குகிறது.
- source_word: שִׂיחוּ
  choice: எடுத்துச் சொல்லுங்கள்
  rationale: இந்தப் பன்மை ஏவல்வினை பேசுதல், எடுத்துரைத்தல், நினைவுகூர்ந்து விவரித்தல் ஆகிய பொருட்களை ஏற்கக்கூடும். வெற்றிப் பாடலின் சூழலில் வெறும் ‘பேசுங்கள்’ என்பதைவிட ‘எடுத்துச் சொல்லுங்கள்’ மறுசொல்லுதல்/அறிவித்தல் நிழற்பொருளை இயல்பாக வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
