base_translation:
  language: en
  yaml_path: translation/ot/judges/005/003.yaml
  text: Hear[a], O kings; give ear, O rulers. I, to Yahweh[b], I will sing; I will make music to Yahweh, the God of Israel.
translation:
  language: ta
  text: அரசர்களே, கேளுங்கள்[a]; ஆட்சியாளர்களே, செவிகொடுங்கள். நான், யாவேக்கு நான் பாடுவேன்; இஸ்ரவேலின் கடவுளாகிய யாவேக்கு இசை எழுப்புவேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “கேளுங்கள்; செவிகொடுங்கள்” என்று நெருங்கிய பொருளுடைய இரண்டு ஏவல் வினைகள் கவிதை வலியுறுத்தலுக்காக இணையாக வருகின்றன.
    reason: lexical_alternative
  - marker: b
    text: “யாவேக்குப் புகழ் பாடுவேன்” என்றும் மொழிபெயர்க்கலாம். எபிரெயம் ‘பாடுவேன்’, ‘இசை எழுப்புவேன்’ என்ற தொடர்புடைய, ஆனால் வேறுபட்ட இரண்டு வினைகளைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: கேளுங்கள்
  rationale: שׁמע என்பதன் பன்மை ஏவல் வடிவம். அரசர்களை நேரடியாக அழைக்கும் கவிதைநடையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מְלָכִים
  choice: அரசர்களே
  rationale: அரசியல் அரசர்களைக் குறிக்கும் நேரடியான பன்மைப் பெயர்; விளிவேற்றுமை நேரடி அழைப்பைப் பாதுகாக்கிறது.
- source_word: הַאֲזִינוּ
  choice: செவிகொடுங்கள்
  rationale: שִׁמְעוּ என்பதற்கு நெருங்கிய பொருளுடைய இன்னொரு ஏவல் வினை. ‘செவிகொடுங்கள்’ என்பது இணை அமைப்பையும் கவிதை வலியுறுத்தலையும் பாதுகாக்கிறது.
- source_word: רֹזְנִים
  choice: ஆட்சியாளர்களே
  rationale: உயர் அதிகாரம் கொண்ட ஆளுநர்கள் அல்லது பெருந்தலைவர்களைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவான அரசியல் பொருளைத் தருகிறது.
- source_word: אָנֹכִי ... אָנֹכִי
  choice: நான் ... நான்
  rationale: தனிப்பட்ட சுட்டுப்பெயரின் மறுபடிவம் வலியுறுத்தலுக்குரியது. தமிழிலும் அதை அப்படியே மீண்டும் கூறி பாடகரின் உறுதியான தன்னறிவிப்பைப் பாதுகாக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கே / யாவேக்கு
  rationale: பாடுதல், இசைத்தல் ஆகியவற்றின் பெறுநர் அல்லது அர்ப்பணிப்புக்குரியவராக யாவே இருப்பதை நான்காம் வேற்றுமை காட்டுகிறது; முதல் இடத்தில் உள்ள ‘ஏ’ வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יהוה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- source_word: אָשִׁירָה
  choice: நான் பாடுவேன்
  rationale: இவ்வடிவத்தின் விருப்பம் அல்லது உறுதி சார்ந்த நுணுக்கத்தைத் தமிழில் எதிர்கால உறுதிமொழியாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲזַמֵּר
  choice: இசை எழுப்புவேன்
  rationale: זמר என்பது இசைத்தல் அல்லது புகழ்ந்து பாடுதலைக் குறிக்கலாம். முந்தைய ‘பாடுவேன்’ என்பதிலிருந்து வினை வேறுபாட்டைப் பாதுகாத்து, இசைக்கருவி பயன்படுத்தப்பட்டது என்று தேவையின்றி குறிப்பதையும் தவிர்க்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: யாவேயை இஸ்ரவேலின் கடவுளாக அடையாளப்படுத்தும் நேரடியான ஆக்கப்பெயர்த் தொடர்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல வசனம் நான்கெழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பாதுகாக்க ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: לַיהוָה என்பதில் உள்ள לְ உறவின் பொருள்
  choice: யாவேக்கே / யாவேக்கு
  alternative: யாவேக்காக
  rationale: இங்கு לְ என்பது பாடலின் பெறுநரையோ அர்ப்பணிப்பையோ குறிக்கலாம். தமிழின் நான்காம் வேற்றுமை அந்த இரு சாத்தியங்களையும் அளவுக்கு மீறித் தீர்மானிக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. நேரடி அழைப்புகளின் விளிவேற்றுமை, இணையான ஏவல் வினைகள், אָנֹכִי என்பதன் மறுபடிவ வலியுறுத்தல் ஆகியவை பாதுகாக்கப்பட்டுள்ளன. அரைப்புள்ளி பாடலின் இணை அடிகளை வாசிக்க உதவுகிறது; நீண்ட கோடு ‘நான்’ என்ற தன்னறிவிப்பின் வலியுறுத்தலைக் காட்டுகிறது.
