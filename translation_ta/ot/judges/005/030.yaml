base_translation:
  language: en
  yaml_path: translation/ot/judges/005/030.yaml
  text: ‘Are they not finding and dividing the spoil? A womb[a], two wombs for each man; spoil of dyed cloths for Sisera, spoil of dyed cloths, embroidered cloth, dyed cloth[b], two embroideries for the necks of the spoil.’
translation:
  language: ta
  text: ‘அவர்கள் கொள்ளைப் பொருளைக் கண்டுபிடித்துப் பங்கிட்டுக்கொண்டிருக்கிறார்கள் அல்லவா? ஒவ்வொரு ஆணுக்கும் ஒரு கருப்பை[a], இரண்டு கருப்பைகள்; சிசெராவுக்குச் சாயமிட்ட துணிகளின் கொள்ளை; சாயமிட்ட துணிகளின் கொள்ளை, பூவேலைப்பாடுள்ள துணி; சாயமிட்ட துணி, இரட்டைப் பூவேலைப்பாடு, கொள்ளையின் கழுத்துகளுக்கு[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லுக்குச் சொல், “ஒரு கருப்பை, இரண்டு கருப்பைகள்.” போரில் கைப்பற்றப்பட்ட பெண்களைப் பாலியல் கொள்ளையாகக் குறிப்பிடும் கொடூரமான ஆகுபெயர் இது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சிறைபிடிக்கப்பட்டவர்களின் கழுத்துகளுக்கு.” இறுதி எபிரேயச் சொற்றொடர் கடினமானது; சிறைபிடிக்கப்பட்ட பெண்கள் அணியும் பூவேலைப்பாடுள்ள துணிகளை இது குறிக்கலாம்.
    reason: alternative_reading
