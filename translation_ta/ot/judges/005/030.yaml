  rationale: தையல் அல்லது பூவேலை அலங்காரத்தைக் குறிக்கும் சொற்களின் ஒருமை–இருமை வேறுபாட்டை முடிந்தவரை பாதுகாக்கிறது.
- source_word: לְצַוְּארֵי שָׁלָל
  choice: கொள்ளைப் பொருளின் கழுத்துகளுக்கு
  rationale: கடினமும் சுருக்கமுமான எபிரெயச் சொற்றொடரின் தெளிவின்மையை முதன்மை உரையில் தீர்த்துவிடாமல் நெருக்கமாக வைத்திருக்கிறது.
theological_decisions:
- issue: רַחַם רַחֲמָתַיִם என்ற பாலியலாக்கப்பட்ட போர்க் கொள்ளை மொழியை மென்மைப்படுத்தலாமா?
  choice: ‘ஒரு கருப்பை, இரண்டு கருப்பைகள்’ என்று நேரடியான ஆகுபெயரைத் தக்கவைத்தல்
  alternative: ‘ஒரு பெண், இரண்டு பெண்கள்’
  rationale: இது சிசெராவின் வீட்டாருடைய கொடூரமான எதிர்பார்ப்பை வெளிப்படுத்துகிறது; கதைசொல்லியின் ஒப்புதலை அல்ல. மென்மைப்படுத்தினால் பாடலின் அறநெறி அதிர்ச்சியும் மனிதத்தன்மையிழக்கச் செய்யும் மொழியும் மறைந்துவிடும்.
- issue: லְצַוְּארֵי שָׁלָל என்ற கடினமான இறுதிச் சொற்றொடரை எவ்வாறு கையாளுவது?
  choice: முதன்மை உரையில் நெருக்கமான மொழிபெயர்ப்பு; அடிக்குறிப்பில் விளக்க மாற்று
  alternative: ‘சிறைபிடிக்கப்பட்டவர்களின் கழுத்துகளுக்கு’
  rationale: எபிரெய இலக்கணத் தொடர்பு விவாதத்திற்குரியது; ஓர் விளக்கத்தை மட்டும் உறுதியாக்காமல் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பாடலுக்கேற்ற கண்ணியமான ஆனால் கூர்மையான நடை பயன்படுத்தப்பட்டுள்ளது. போர்க் கொள்ளையின் பாலியல் வன்முறையை மூலத்தில் உள்ளபடி மறைக்காமல் வைத்திருக்கிறது; கடினமான இறுதிச் சொற்றொடரின் தெளிவின்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
