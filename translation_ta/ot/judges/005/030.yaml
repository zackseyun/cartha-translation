- source_word: רַחַם רַחֲמָתַיִם
  choice: ஒரு கருப்பை, இரண்டு கருப்பைகள்
  rationale: பெண்களைப் பாலியல் கொள்ளைப் பொருளாக மனிதத்தன்மையற்ற விதத்தில் குறிப்பிடும் மூலத்தின் அதிர்ச்சியூட்டும் ஆகுபெயரை மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: לְרֹאשׁ גֶּבֶר
  choice: ஒவ்வொரு ஆணுக்கும்
  rationale: சொல்லுக்குச் சொல் ‘ஒரு ஆணின் தலைக்கு’ என்றாலும், இங்கு ஒருவருக்கு இவ்வளவு என்ற பகிர்வுப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; גֶּבֶר என்பதன் ஆண்பால் குறிப்பும் காக்கப்படுகிறது.
- source_word: שְׁלַל צְבָעִים
  choice: சாயமிட்ட துணிகளைக் கொள்ளையாக
  rationale: போரில் கைப்பற்றிய பொருளையும் வண்ணமேற்றப்பட்ட நெய்த துணிகளையும் தெளிவாகக் காட்டுகிறது.
- source_word: רִקְמָה / רִקְמָתַיִם
