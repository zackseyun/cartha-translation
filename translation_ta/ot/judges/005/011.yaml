  text: מִ/קּ֣וֹל מְחַֽצְצִ֗ים בֵּ֚ין מַשְׁאַבִּ֔ים שָׁ֤ם יְתַנּוּ֙ צִדְק֣וֹת יְהוָ֔ה צִדְקֹ֥ת פִּרְזֹנ֖/וֹ בְּ/יִשְׂרָאֵ֑ל אָ֛ז יָרְד֥וּ לַ/שְּׁעָרִ֖ים עַם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/011.yaml
  text: From the sound of archers among the watering places[a], there they recount the righteous acts of Yahweh, the righteous acts of his villagers in Israel[c][b]. Then the people of Yahweh went down to the gates.
translation:
  language: ta
  text: வில்லாளர்களின் ஓசையிலிருந்து, தண்ணீர் எடுக்கும் இடங்களுக்கு நடுவே[a], அங்கே அவர்கள் யாவேயின் நீதிச் செயல்களையும், இஸ்ரவேலில் அவருடைய கிராம மக்களின் நீதிச் செயல்களையும்[b] எடுத்துரைக்கிறார்கள். அப்பொழுது யாவேயின் மக்கள் நகரவாசல்களுக்கு[c] இறங்கிச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தண்ணீர் எடுக்கும் இடங்களருகே வில்லாளர்களின் ஓசையைக் கேட்டு’ என்றும் மொழிபெயர்க்கலாம். தொடக்கத் தொடர் கடினமானது; சிலர் இதை ஓசையிலிருந்து பிரிவதைக் குறிப்பதாக அல்லாமல், பாடல் கேட்கப்படும் சூழலைக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: ‘கிராம மக்கள்’ என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் கடினமானது. அது ‘மதிலற்ற குடியிருப்புகள்,’ ‘நாட்டுப்புற மக்கள்,’ அல்லது, சாத்தியம் குறைவாக, ‘ஆட்சியாளர்கள்’ என்றும் புரிந்துகொள்ளப்பட்டுள்ளது. இந்தத் தொடர் கிராம மக்கள் செய்த நீதிச் செயல்களையோ, அவர்களுக்காக யாவே செய்த நீதிச் செயல்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: பண்டைய இஸ்ரவேலில் நகரவாசல்கள் ஊரின் பொதுக் கூடுகை இடங்களாகவும், குடிமை வாழ்க்கை, நீதி விசாரணை, பாதுகாப்பு ஆகியவற்றுடன் தொடர்புடைய இடங்களாகவும் இருந்தன.
    reason: cultural_note
lexical_decisions:
- source_word: מִקּוֹל מְחַצְצִים
  choice: வில்லாளர்களின் ஓசையிலிருந்து
  rationale: מִקּוֹל என்பதன் மூல/பிரிவு சார்ந்த பொருளை ‘ஓசையிலிருந்து’ எனப் பேணுகிறது. מְחַצְצִים என்ற அரிய சொல்லைச் சூழலின் அடிப்படையில் ‘வில்லாளர்கள்’ என வழங்குகிறது; தொடக்கத் தொடரின் சிக்கல் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: בֵּין מַשְׁאַבִּים
  choice: தண்ணீர் எடுக்கும் இடங்களின் நடுவே
  rationale: מַשְׁאַבִּים என்பது தண்ணீர் எடுக்கும் இடங்கள் அல்லது நீர்நிலைகளருகிலுள்ள நீர் எடுக்கும் பகுதிகளைக் குறிக்கிறது; בֵּין என்பதன் இடவியல் பொருளை ‘நடுவே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְתַנּוּ
  choice: எடுத்துரைக்கிறார்கள்
  rationale: பியெல் வடிவம் உரக்கச் சொல்லுதல், மீண்டும் எடுத்துச் சொல்லுதல் என்ற பொருளைத் தருகிறது. பாடுதல் என்று கட்டுப்படுத்தாமல் பொதுமக்கள் புரியும் வகையில் ‘எடுத்துரைக்கிறார்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: צִדְקוֹת יְהוָה
  choice: யாவேயின் நீதிச் செயல்கள்
  rationale: צִדְקוֹת என்பது வெறும் பண்பாகிய நீதியை அல்லாமல், நீதியை வெளிப்படுத்தும் செயல்களைக் குறிக்கிறது. மீட்பு அல்லது வெற்றி என்று பொருளைச் சுருக்காமல் ‘நீதிச் செயல்கள்’ எனப் பேணப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה ஒரு பட்டத்தால் மாற்றப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: צִדְקֹת פִּרְזֹנוֹ
  choice: அவருடைய கிராம மக்களின் நீதிச் செயல்கள்
  rationale: פִּרְזוֹן தொடர்புடைய வடிவங்கள் கிராம வாழ்க்கை அல்லது மதிலற்ற குடியிருப்புகளில் வாழும் மக்களைச் சுட்டுகின்றன. உடைமைப் பின்னொட்டையும் சொற்றொடரின் இலக்கணத் திறந்த நிலையையும் பேணும் வகையில் இவ்வாறு வழங்கப்பட்டுள்ளது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: בְּ இங்கு இடத்தைக் குறிக்கிறது; ‘இஸ்ரவேலில்’ என்பது நேரடியும் இயல்புமான தமிழ் வடிவம்.
- source_word: אָז יָרְדוּ
  choice: அப்பொழுது ... இறங்கிச் சென்றார்கள்
  rationale: אָז அடுத்த நிகழ்வின் நேரத்தைக் குறிக்கிறது; ירד என்பதன் கீழ்நோக்கிய இயக்கம் ‘இறங்கிச் சென்றார்கள்’ எனப் பேணப்பட்டுள்ளது.
- source_word: לַשְּׁעָרִים
  choice: நகரவாசல்களுக்கு
  rationale: שְׁעָרִים என்பது வாசல்களைச் சொற்பொருளாகக் குறித்தாலும், இங்கு நகரங்களின் பொது வாழ்வு நடைபெற்ற வாசல் பகுதிகளைக் குறிக்கிறது. தமிழில் சூழலைத் தெளிவாக்க ‘நகரவாசல்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַם יְהוָה
  choice: யாவேயின் மக்கள்
  rationale: உடைமைத் தொடர்பையும் உடன்படிக்கை மக்களாகிய அடையாளத்தையும் சுருக்கமின்றி வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனித்தன்மையைப் பேணுகிறது.
- issue: வெற்றிப் பாடலின் சூழலில் צִדְקוֹת என்பதன் பொருள்
  choice: நீதிச் செயல்கள்
  alternative: மீட்புச் செயல்கள் / வெற்றிகள்
  rationale: இச்சொல் யாவேயின் நீதி வெளிப்படும் செயல்களைக் குறிக்கிறது; சூழலில் அவை விடுதலையளிக்கும் செயல்களாக இருந்தாலும், ‘மீட்பு’ அல்லது ‘வெற்றி’ என்று மட்டும் வழங்குவது பொருளைத் தேவையின்றி குறுக்கும்.
- issue: צִדְקֹת פִּרְזֹנוֹ என்பதில் செயல்களைச் செய்பவர் அல்லது அவற்றைப் பெறுபவர் யார் என்பது
  choice: அவருடைய கிராம மக்களின் நீதிச் செயல்கள்
  alternative: அவருடைய கிராம மக்களுக்காகச் செய்த நீதிச் செயல்கள் / அவருடைய மதிலற்ற குடியிருப்புகளுக்கான நீதிச் செயல்கள்
  rationale: எபிரெய உடைமைத் தொடர் ஒன்றுக்கு மேற்பட்ட உறவுகளை அனுமதிக்கிறது. முதன்மை உரை அதன் நேரடியான வடிவத்தைப் பேணுகிறது; கிராம மக்களுக்காக யாவே செய்த செயல்கள் என்ற புரிதலும் அடிக்குறிப்பில் திறந்துவைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதையின் உயரிய தொனியைத் தக்கவைத்தபடியே சாதாரண வாசகர்களுக்குப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. அரிய எபிரெயச் சொற்களும் இலக்கணத் தெளிவின்மையும் முதன்மை உரையில் அளவுக்கு மீறி விளக்கப்படாமல், அடிக்குறிப்புகளில் வெளிப்படையாகப் பேணப்பட்டுள்ளன.
