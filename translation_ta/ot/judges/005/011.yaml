  source_fidelity: 'மூலத்தின் முக்கிய சொற்கள் நன்கு பேணப்பட்டுள்ளன: מְחַצְצִים ‘வில்லாளர்கள்,’ מַשְׁאַבִּים ‘தண்ணீர் எடுக்கும் இடங்கள்,’ יְתַנּוּ ‘எடுத்துரைக்கிறார்கள்,’ צִדְקוֹת ‘நீதிச் செயல்கள்,’ மற்றும் இறைப்பெயர் ‘யாவே.’ ஆனால் தொடக்கச் சொற்றொடரில் ‘ஓசையிலிருந்து’ என்பதன் தொடர்பு தமிழில் தொங்கலாகத் தோன்றுகிறது. எபிரெயத்தின் கடினமான, விவாதத்துக்குரிய அமைப்பை விளக்காமல் பாதுகாக்கும் வகையில் சொல் வரிசையைச் சிறிது மாற்றுவது பாதுகாப்பானது.'
  naturalness: தற்போதைய உரை பெரும்பாலும் நவீன நிலையான தமிழில் இயல்பாக உள்ளது. ‘தண்ணீர் எடுக்கும் இடங்களின் நடுவே வில்லாளர்களின் ஓசையிலிருந்து’ என்ற தொடக்கம் மட்டும் ‘நடுவே’ எதை வரையறுக்கிறது என்பதில் தற்காலிகத் தடுமாற்றம் உண்டாக்குகிறது. ‘வில்லாளர்களின் ஓசையிலிருந்து, தண்ணீர் எடுக்கும் இடங்களுக்கு நடுவே’ என்பது மூலத்தின் சொற்களையும் கவிதைத் திறந்த நிலையையும் காத்து வாசிப்பை மேம்படுத்துகிறது.
  terminology: ‘யாவே,’ ‘நீதிச் செயல்கள்,’ ‘இஸ்ரவேல்,’ ‘நகரவாசல்கள்’ ஆகியவை சீராகவும் பொருத்தமாகவும் உள்ளன. פִּרְזֹנוֹ பற்றிய முதன்மை மொழிபெயர்ப்பு விவாதத்துக்குரிய நேரடியான வாசிப்பாகத் தக்கது; அடிக்குறிப்பு மாற்று விளக்கங்களை முறையாகக் குறிப்பிடுகிறது.
