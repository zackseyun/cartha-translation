  revised_text: வில்லாளர்களின் ஓசையிலிருந்து, தண்ணீர் எடுக்கும் இடங்களுக்கு நடுவே[a], அங்கே அவர்கள் யாவேயின் நீதிச் செயல்களையும், இஸ்ரவேலில் அவருடைய கிராம மக்களின் நீதிச் செயல்களையும்[b] எடுத்துரைக்கிறார்கள். அப்பொழுது யாவேயின் மக்கள் நகரவாசல்களுக்கு[c] இறங்கிச் சென்றார்கள்.
