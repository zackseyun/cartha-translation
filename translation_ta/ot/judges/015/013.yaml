translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வலியுறுத்தல்கள் இயல்பான தமிழ் வாக்கிய அமைப்பில் காக்கப்பட்டுள்ளன; ‘கையில்’ என்ற மூல உருவகம் பிரதான உரையில் தக்கவைக்கப்பட்டு அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
