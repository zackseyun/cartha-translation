base_translation:
  language: en
  yaml_path: translation/ot/judges/015/013.yaml
  text: They said to him[a], “No, but we will surely bind you and hand you over into their hand[b]; yet we will certainly not put you to death.” So they bound him with two new ropes and brought him up from the rock.
translation:
  language: ta
  text: அவர்கள் அவனிடம், “இல்லை; நாங்கள் உன்னை உறுதியாகக் கட்டி, அவர்களுடைய கையில்[a] ஒப்படைப்போம். ஆனால் நாங்கள் உன்னைக் கொல்லவே மாட்டோம்” என்றார்கள். பின்பு அவர்கள் இரண்டு புதிய கயிறுகளால் அவனைக் கட்டி, பாறையிலிருந்து[b] மேலே கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய அதிகாரத்தில் ஒப்படைப்போம்.” எபிரெய மரபுத்தொடரின் நேரடிப் பொருள் “அவர்களுடைய கையில் ஒப்படைப்போம்” என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பாறைச் செங்குத்திடத்திலிருந்து.” எபிரெயச் சொல் ஒரு தனிப் பாறையை மட்டுமல்லாமல் பாறையான உயரத்தையோ செங்குத்திடத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כִּי
  choice: இல்லை; ... ஆனால்
  rationale: மறுப்பைத் தொடர்ந்து வரும் திருத்தம் அல்லது வரையறையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָסֹר נֶאֱסָרְךָ
  choice: நாங்கள் உன்னை உறுதியாகக் கட்டி
  rationale: முற்றுவினைக்கு முன் வரும் வினையெச்ச வடிவத்தின் வலியுறுத்தலை ‘உறுதியாக’ என்பதன் மூலம் வெளிப்படுத்துகிறது.
- source_word: וּנְתַנּוּךָ בְיָדָם
  choice: அவர்களுடைய கையில் ஒப்படைப்போம்
  rationale: ஒருவரின் அதிகாரத்திற்குள் ஒப்படைத்தல் என்ற எபிரெய மரபுத்தொடரையும் அதன் ‘கை’ உருவகத்தையும் காக்கிறது.
- source_word: וְהָמֵת לֹא נְמִיתֶךָ
  choice: நாங்கள் உன்னைக் கொல்லவே மாட்டோம்
  rationale: வலியுறுத்தப்பட்ட மறுப்பை இயல்பான நவீன தமிழில் ‘வே மாட்டோம்’ என்று தெளிவாகக் காட்டுகிறது.
- source_word: וַיַּאַסְרֻהוּ
  choice: அவனைக் கட்டி
  rationale: முந்தைய கட்டுதல் வாக்குறுதியுடன் சொல் தொடர்பைத் தக்கவைக்கிறது.
- source_word: בִּשְׁנַיִם עֲבֹתִים חֲדָשִׁים
  choice: இரண்டு புதிய கயிறுகளால்
  rationale: עֲבֹתִים என்பது தடித்த வடங்கள் அல்லது கயிறுகளைக் குறிக்கிறது; ‘கயிறுகள்’ பொதுவாசகருக்கு இயல்பானது. ‘புதிய’ என்பது கதைச்சூழலில் முக்கியமான விவரமாக இருப்பதால் காக்கப்பட்டுள்ளது.
- source_word: וַיַּעֲלֻהוּ מִן הַסָּלַע
  choice: பாறையிலிருந்து மேலே கொண்டுவந்தார்கள்
  rationale: העלה என்பதன் மேலே கொண்டுவருதல் என்ற காரணவினைப் பொருளையும், סלע என்பதன் பாறை அல்லது பாறைச் செங்குத்திடம் என்ற பொருள் வரம்பையும் பிரதிபலிக்கிறது.
