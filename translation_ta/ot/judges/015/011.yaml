  text: וַ/יֵּרְד֡וּ שְׁלֹשֶׁת֩ אֲלָפִ֨ים אִ֜ישׁ מִֽ/יהוּדָ֗ה אֶל סְעִיף֮ סֶ֣לַע עֵיטָם֒ וַ/יֹּאמְר֣וּ לְ/שִׁמְשׁ֗וֹן הֲ/לֹ֤א יָדַ֨עְתָּ֙ כִּֽי מֹשְׁלִ֥ים בָּ֨/נוּ֙ פְּלִשְׁתִּ֔ים וּ/מַה זֹּ֖את עָשִׂ֣יתָ לָּ֑/נוּ וַ/יֹּ֣אמֶר לָ/הֶ֔ם כַּ/אֲשֶׁר֙ עָ֣שׂוּ לִ֔/י כֵּ֖ן עָשִׂ֥יתִי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/011.yaml
  text: Then three thousand men of Judah went down to the cleft of the rock of Etam and said to Samson[a], “Do you not know that the Philistines are ruling over us? What then is this that you have done to us?” And he said to them, “As they did to me, so I have done to them.”
translation:
  language: ta
  text: அப்போது யூதாவைச் சேர்ந்த மூவாயிரம் ஆண்கள் ஏத்தாம் பாறைப் பிளவுக்கு[a] இறங்கிச் சென்று சிம்சோனிடம், “பெலிஸ்தியர்கள் நம்மை ஆளுகிறார்கள் என்பது உனக்குத் தெரியாதா? அப்படியிருக்க, நீ எங்களுக்கு இப்படிச் செய்தது என்ன?” என்று கேட்டார்கள். அதற்கு அவன், “அவர்கள் எனக்குச் செய்தபடியே நானும் அவர்களுக்குச் செய்தேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏத்தாம் பாறையின் விரிசலுக்கு.”
    reason: סְעִיף என்ற நிலவியல் சொல்லுக்கு ‘பிளவு’, ‘விரிசல்’ போன்ற நெருங்கிய பொருள்கள் உள்ளதால் மாற்று மொழிபெயர்ப்பு தரப்படுகிறது; עֵיטָם என்ற இடப்பெயரும் காக்கப்படுகிறது.
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: இறங்கிச் சென்று
  rationale: ירד என்பதன் கீழ்நோக்கிய இயக்கத்தைத் தெளிவாகக் காத்து, எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான தமிழில் தருகிறது.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ מִיהוּדָה
  choice: யூதாவைச் சேர்ந்த மூவாயிரம் ஆண்கள்
  rationale: எண்ணப்பட்டவர்கள் ஆண்கள் என்பதையும், அவர்கள் யூதா கோத்திரத்தைச் சேர்ந்தவர்கள் என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶל סְעִיף סֶלַע עֵיטָם
  choice: ஏத்தாம் பாறைப் பிளவுக்கு
  rationale: סְעִיף என்பதன் பிளவு அல்லது வெடிப்பு சார்ந்த நிலவியல் பொருளையும், סֶלַע என்பதன் ‘பாறை’ பொருளையும் சுருக்கமாகக் காக்கிறது; עֵיטָם இடப்பெயராக ‘ஏத்தாம்’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: הֲלֹא יָדַעְתָּ
  choice: உனக்குத் தெரியாதா?
  rationale: எதிர்மறை வடிவிலான வினாவின் வலியுறுத்தும், கண்டிக்கும் தொனியை நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: כִּי מֹשְׁלִים בָּנוּ פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்கள் நம்மை ஆளுகிறார்கள் என்பது
  rationale: מֹשְׁלִים என்ற நிகழ்காலப் பங்கேற்புவினை குறிக்கும் தொடர்ச்சியான ஆட்சியையும் ஆதிக்கத்தையும் காக்கிறது.
- source_word: וּמַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: அப்படியிருக்க, நீ எங்களுக்கு இப்படிச் செய்தது என்ன?
  rationale: ‘என்ன’ என்ற மூல வினாவை ‘ஏன்’ என்று விளக்கிப் பொருள்கொள்ளாமல் காக்கிறது; ‘அப்படியிருக்க’ என்பது முந்தைய வினாவோடு உள்ள உரையாடல் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר עָשׂוּ לִי כֵּן עָשִׂיתִי לָהֶם
  choice: அவர்கள் எனக்குச் செய்தபடியே நானும் அவர்களுக்குச் செய்தேன்
  rationale: மூலத்தின் பதிலுக்குப் பதில் என்ற ஒப்புமை அமைப்பையும் நிறைவுற்ற செயலின் சுருக்கமான தன்மையையும் காக்கிறது.
theological_decisions:
- issue: சிம்சோனின் பதிலில் காணப்படும் பதிலடி நோக்கம்
  choice: “அவர்கள் எனக்குச் செய்தபடியே நானும் அவர்களுக்குச் செய்தேன்” என்று மதிப்பீடற்ற நேரடி கூற்றாக மொழிபெயர்க்கப்பட்டது.
  alternative: அதை நியாயமான பழிவாங்குதல் என்றோ குற்றத்துக்குரிய தனிப்பட்ட பழிவாங்குதல் என்றோ விளக்கமாக மொழிபெயர்த்தல்.
  rationale: இந்த வசனம் சிம்சோனின் காரணத்தைப் பதிவு செய்கிறது; அதை வெளிப்படையாக ஆதரிக்கவோ கண்டிக்கவோ இல்லை. ஆகவே மூலத்தில் உள்ள இறையியல் மற்றும் அறநெறி பதற்றம் தீர்க்கப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் dignified கதைநடை பயன்படுத்தப்பட்டது. ‘பெலிஸ்தியர்கள்’, ‘சிம்சோன்’, ‘ஏத்தாம்’ ஆகிய மரபாக அறியப்பட்ட வேதாகமப் பெயர்வடிவங்கள் காக்கப்பட்டுள்ளன; தேவையற்ற அறநெறி விளக்கம் சேர்க்கப்படவில்லை.
