base_translation:
  language: en
  yaml_path: translation/ot/judges/015/020.yaml
  text: And he judged Israel in the days of the Philistines twenty years[a].
translation:
  language: ta
  text: அவர் பெலிஸ்தியரின் காலத்தில் இஸ்ரவேலை இருபது ஆண்டுகள் நியாயந்தீர்த்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலை இருபது ஆண்டுகள் வழிநடத்தினார்.” எபிரெய வினைச்சொல் நீதித்தீர்ப்பு வழங்குவதை மட்டுமல்லாமல், விரிவான தலைமை அல்லது ஆளுகையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: நியாயந்தீர்த்து வழிநடத்தினார்
  rationale: שׁפט என்பது நியாயத்தீர்ப்பு வழங்குவதை மட்டும் குறிக்காமல், நீதித்தலைவராக ஆட்சி அல்லது தலைமை செய்வதையும் குறிக்கலாம். தமிழில் ‘நியாயந்தீர்த்தார்’ மட்டும் இக்கால வாசகருக்கு நீதிமன்றச் செயலாகத் தவறாகச் சுருங்கக்கூடும்; ஆகவே சொல்லின் நீதித்தீர்ப்பு மற்றும் தலைமை ஆகிய இரு கூறுகளையும் இயல்பாகத் தெரிவிக்கும் இணைந்த மொழிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை
  rationale: மூலத்தில் வரும் ‘இஸ்ரவேல்’ என்ற தனிப்பெயரை நேரடிப் பொருளாகவும் தமிழுக்கு இயல்பாகவும் தக்கவைக்கிறது.
- source_word: בִּימֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியரின் காலத்தில்
  rationale: ‘பெலிஸ்தியரின் நாட்களில்’ என்பது சொல்லுக்குச் சொல் நெருக்கமானதாக இருந்தாலும், இங்கு காலப்பகுதியைக் குறிக்கும் எபிரெய மொழிவழக்கை நவீனத் தமிழில் இயல்பாக ‘காலத்தில்’ என வழங்குகிறது.
- source_word: עֶשְׂרִים שָׁנָה
  choice: இருபது ஆண்டுகள்
  rationale: கால அளவைத் தெளிவாகவும் நேரடியாகவும் வழங்குகிறது.
theological_decisions:
- issue: சிம்சோனின் שׁפט பணி எந்த வகையானது
  choice: ‘நியாயந்தீர்த்து வழிநடத்தினார்’ என்று வழங்கி, நீதித்தலைவர் என்ற அவரது விரிவான பணியைத் தக்கவைத்தல்
  alternative: ‘நியாயந்தீர்த்தார்’ அல்லது ‘ஆட்சி செய்தார்’ அல்லது ‘வழிநடத்தினார்’
  rationale: ‘நியாயந்தீர்த்தார்’ என்பது நவீனத் தமிழில் நீதிமன்றத் தீர்ப்பாக மட்டும் புரியக்கூடும்; ‘ஆட்சி செய்தார்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத அரசியல் ஆட்சியை வலியுறுத்தலாம்; ‘வழிநடத்தினார்’ மட்டும் நூலின் மீளும் நீதித்தலைவர் சொல்லிணைப்பை மறைக்கலாம். இணைந்த வடிவம் மூலச்சொல்லின் பரப்பையும் நூலியல் தொடர்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. ‘பெலிஸ்தியரின் காலத்தில்’ என்பது எபிரெய கால மொழிவழக்கை இயல்பாக எடுத்துரைக்கிறது; முக்கிய வினையின் உண்மையான பொருள் பரப்பை அடிக்குறிப்பு வெளிப்படையாகப் பாதுகாக்கிறது.
