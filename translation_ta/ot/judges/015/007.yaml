  source_fidelity: The conditional clause and Samson’s emphatic resolve to take vengeance are conveyed faithfully. However, Hebrew אֶחְדָּל means “I will cease/desist,” specifically from the retaliatory action in context; “ஓய்வேன்” can more readily mean “I will rest,” which is less precise.
