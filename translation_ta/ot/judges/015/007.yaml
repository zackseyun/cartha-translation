  yaml_path: translation/ot/judges/015/007.yaml
  text: And Samson said to them, “If this is what you do, then I swear I will take vengeance on you, and after that I will stop.”
translation:
  language: ta
  text: சிம்சோன் அவர்களிடம், “நீங்கள் இப்படிச் செய்கிறீர்களானால், நான் உங்களைப் பழிவாங்கியே தீருவேன்; அதற்குப் பிறகுதான் நிறுத்துவேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם תַּעֲשׂוּן כָּזֹאת
  choice: நீங்கள் இப்படிச் செய்கிறீர்களானால்
  rationale: The Hebrew conditional construction is retained directly and naturally in modern Tamil.
- source_word: כִּי אִם נִקַּמְתִּי בָכֶם
  choice: நான் உங்களைப் பழிவாங்கியே தீருவேன்
  rationale: כִּי אִם here gives emphatic, oath-like force. The Tamil particle sequence “-ஏ தீருவேன்” conveys firm determination without adding an explicit divine oath absent from the Hebrew.
- source_word: וְאַחַר אֶחְדָּל
  choice: அதற்குப் பிறகுதான் ஓய்வேன்
  rationale: 'This preserves the sequence and restrictive emphasis: Samson will cease only after taking vengeance.'
theological_decisions:
- issue: Whether to make Samson explicitly swear
  choice: Render the emphatic resolve without adding an explicit oath formula
  alternative: “நான் ஆணையிட்டுச் சொல்கிறேன்” or “நான் சத்தியமாக”
  rationale: The Hebrew has oath-like emphasis but no explicit verb meaning “swear.” The chosen Tamil preserves the force while avoiding an interpretive addition.
translation_notes:
  register: Modern standard Tamil in a dignified narrative register. “பழிவாங்கியே தீருவேன்” is readily understandable and carries the emphatic determination of the Hebrew; “ஓய்வேன்” concisely reflects ceasing from retaliatory action.
