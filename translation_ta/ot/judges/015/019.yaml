base_translation:
  language: en
  yaml_path: translation/ot/judges/015/019.yaml
  text: Then God split open the hollow place that is at Lehi[a], and water came out from it. When he drank, his spirit returned and he revived. Therefore he called its name En-hakkore[b], which is at Lehi to this day.
translation:
  language: ta
  text: அப்போது கடவுள் லேகியில் இருந்த பள்ளமான இடத்தைப் பிளந்தார்[a]; அதிலிருந்து தண்ணீர் வெளிவந்தது. அவன் அதைக் குடித்ததும், அவனுக்கு உயிராற்றல் திரும்பி, அவன் புத்துயிர் பெற்றான். ஆகவே, அவன் அதற்கு ஏன்-ஹக்கோரே[b] என்று பெயரிட்டான். அந்த ஊற்று இன்றுவரை லேகியில் இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை வேறுவிதமாக வாசித்தால், “கடவுள் தாடை எலும்பில் இருந்த குழியைப் பிளந்தார்; அதிலிருந்து தண்ணீர் வெளிவந்தது” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “ஏன்-ஹக்கோரே” என்பதற்கு “கூப்பிட்டவனின் ஊற்று” அல்லது “அழைத்தவனின் ஊற்று” என்று பொருள் இருக்கலாம்; இது சிம்சோன் கடவுளை நோக்கிக் கூப்பிட்டதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְקַע
  choice: பிளந்தார்
  rationale: வினைச்சொல் வலுவாகப் பிளத்தல் அல்லது பிளந்து திறத்தலைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் நிகழ்ந்த செயலின் தெளிவை இது காக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இக்கதையாடலில் இஸ்ரவேலின் கடவுளே நேரடியாகச் செயல்படுகிறார்; நவீன பொதுத்தமிழுக்கு ‘கடவுள்’ இயல்பான வடிவம்.
- source_word: הַמַּכְתֵּשׁ
  choice: பள்ளமான இடம்
  rationale: இந்தச் சொல் பொதுவாக உரல் அல்லது குழிவான பாத்திரத்தைக் குறிக்கக்கூடும்; இங்கு தண்ணீர் வெளிவரும் நிலப்பரப்பிலுள்ள குழிவான இடம் என்பது சூழலுக்குப் பொருத்தமானது.
- source_word: בַּלֶּחִי
  choice: லேகியில்
  rationale: இங்கு לֶחִי என்பது இடப்பெயராகச் செயல்படுகிறது. அதே சொல் ‘தாடை எலும்பு’ என்றும் பொருள்படுவதால், அந்த மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיֵּצְאוּ מִמֶּנּוּ מַיִם
  choice: அதிலிருந்து தண்ணீர் வெளிவந்தது
  rationale: எபிரெயச் செயல்தொடரைத் தெளிவாகக் காக்கும் இயல்பான தமிழாக்கம்.
- source_word: וַיֵּשְׁתְּ
  choice: அவன் அதைக் குடித்ததும்
  rationale: அவன் குடித்ததற்கும் உடனடியாக உயிர்ப்புத் திரும்பியதற்கும் இடையிலான காலத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַתָּשָׁב רוּחוֹ
  choice: அவனுடைய உயிர்மூச்சு திரும்பி
  rationale: רוּחַ என்பதற்கு ஆவி, மூச்சு, உயிராற்றல் ஆகிய பொருள் நிழல்கள் உண்டு. ‘உயிர்மூச்சு’ உடல் புத்துயிர் பெறும் சூழலுக்கு ஏற்றதாகவும், வெறும் ‘வலிமை’ என்று விளக்கி முடித்துவிடாமலும் உள்ளது.
- source_word: וַיֶּחִי
  choice: அவன் புத்துயிர் பெற்றான்
  rationale: இங்கு மரித்தோரிலிருந்து உயிர்த்தெழுதல் அல்ல, தளர்ச்சியிலிருந்து மீண்டும் உயிர்த்துடிப்பைப் பெறுதல் குறிக்கப்படுகிறது.
- source_word: קָרָא שְׁמָהּ
  choice: அவன் அதற்கு … என்று பெயரிட்டான்
  rationale: எபிரெயப் பெயரிடும் மரபுத்தொடரின் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: עֵין הַקּוֹרֵא
  choice: ஏன்-ஹக்கோரே
  rationale: கதையில் முக்கியமான இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; அதன் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை
  rationale: எபிரெய காலக் குறிப்புக்கான சுருக்கமான, இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: בַּלֶּחִי என்பதன் குறிப்பு மற்றும் தண்ணீர் வெளிவந்த இடம்
  choice: முதன்மை உரையில் ‘லேகி’ என்பதை இடப்பெயராகக் கொண்டு, லேகியிலுள்ள பள்ளமான இடத்திலிருந்து தண்ணீர் வந்ததாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: கடவுள் தாடை எலும்பிலிருந்த குழியைப் பிளந்து, அதிலிருந்து தண்ணீர் வரச் செய்தார்.
  rationale: உடனடிச் சூழலில் லேகி இடப்பெயராகத் திரும்பத் திரும்ப வருகிறது; ‘இன்றுவரை லேகியில் இருக்கிறது’ என்ற இறுதிக் கூற்றும் புவியியல் வாசிப்பை வலுப்படுத்துகிறது. எனினும், לֶחִי என்பதற்கு ‘தாடை எலும்பு’ என்ற பொருளும் இருப்பதால் அற்புதத்தின் காட்சியை மாற்றக்கூடிய அந்த வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இடப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; எபிரெயத்தில் உள்ள பொருள் விளையாட்டும் மாற்று வாசிப்பும் அடிக்குறிப்புகளில் காக்கப்பட்டுள்ளன. ‘உயிர்மூச்சு’ என்பது רוּחַ என்பதிலுள்ள மூச்சு/உயிராற்றல் நுணுக்கத்தைச் சுமக்கிறது; இதை வெறும் உடல் வலிமை என்றோ மரணத்திலிருந்து உயிர்த்தெழுதல் என்றோ முடிவாக நிர்ணயிக்கவில்லை.
