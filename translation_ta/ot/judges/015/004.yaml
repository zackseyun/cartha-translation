base_translation:
  language: en
  yaml_path: translation/ot/judges/015/004.yaml
  text: So Shimshon went and caught three hundred foxes[a], and he took torches and turned them tail to tail, and put one torch between each pair of tails, in the middle.
translation:
  language: ta
  text: சிம்சோன் சென்று முந்நூறு நரிகளைப்[a] பிடித்தார். அவர் தீப்பந்தங்களை எடுத்து, நரிகளை வாலோடு வால் எதிரெதிராக அமையுமாறு திருப்பி, ஒவ்வொரு வால் ஜோடியின் நடுவில் ஒரு தீப்பந்தத்தை வைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குள்ளநரிகளை.’ எபிரேயச் சொல் שׁוּעָלִים நரிகளையோ அவற்றை ஒத்த நாயின விலங்குகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: போய்
  rationale: הלך என்பதன் தொடர்கதை வடிவத்தை இயல்பான தமிழ் வினையெச்சமாகக் கொடுக்கிறது.
- source_word: שִׁמְשׁוֹן
  choice: சிம்சோன்
  rationale: எபிரேயப் பெயரின் ஒலியமைப்பைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: וַיִּלְכֹּד
  choice: பிடித்தார்
  rationale: இச்சூழலில் உயிருள்ள விலங்குகளைப் பிடித்த செயலைத் தெளிவாகக் குறிக்கிறது.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: முந்நூறு
  rationale: எண்ணின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: שׁוּעָלִים
  choice: நரிகள்
  rationale: שׁוּעָלִים என்பதற்கான பொதுவான பொருள்; குள்ளநரிகள் என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לַפִּדִים / לַפִּיד
  choice: தீப்பந்தங்கள் / தீப்பந்தம்
  rationale: எரியும் பந்தம் அல்லது தீக்கொள்ளியை நவீன வாசகருக்குத் தெளிவாகக் காட்டும் சொல்.
- source_word: וַיֶּפֶן זָנָב אֶל זָנָב
  choice: அவற்றை வாலோடு வால் எதிரெதிராக இருக்கும்படி திருப்பி
  rationale: פנה என்பதன் ‘திருப்பு’ என்ற பொருளைப் பேணுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கட்டினார்’ என்பதைச் சேர்க்கவில்லை.
- source_word: וַיָּשֶׂם לַפִּיד אֶחָד
  choice: ஒரு தீப்பந்தத்தை வைத்தார்
  rationale: שׂים வினையின் எளிய, நேரடியான பொருள்.
- source_word: בֵּין שְׁנֵי הַזְּנָבוֹת בַּתָּוֶךְ
  choice: ஒவ்வொரு இரண்டு வால்களுக்கும் நடுவில்
  rationale: சொல்லர்த்தமான ‘இரண்டு வால்களுக்கு இடையில், நடுவில்’ என்பதைத் தொடர்ச்சியாக இணைக்கப்பட்ட ஒவ்வொரு ஜோடிக்கும் பொருந்துமாறு இயல்பான தமிழில் வழங்குகிறது.
