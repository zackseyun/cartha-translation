revisions:
- from: எனவே சிம்சோன் போய் முந்நூறு நரிகளைப்[a] பிடித்தார். பின்னர் தீப்பந்தங்களை எடுத்து, அவற்றை வாலோடு வால் எதிரெதிராக இருக்கும்படி திருப்பி, ஒவ்வொரு இரண்டு வால்களுக்கும் நடுவில் ஒரு தீப்பந்தத்தை வைத்தார்.
  to: சிம்சோன் சென்று முந்நூறு நரிகளைப்[a] பிடித்தார். அவர் தீப்பந்தங்களை எடுத்து, நரிகளை வாலோடு வால் எதிரெதிராக அமையுமாறு திருப்பி, ஒவ்வொரு வால் ஜோடியின் நடுவில் ஒரு தீப்பந்தத்தை வைத்தார்.
  rationale: The revision replaces the inferential connector with a plain narrative opening, identifies the animals explicitly as the object of ‘turned,’ and improves the idiom for the paired tails. It does not state or imply that the tails were tied, since that detail is not explicit in the Hebrew.
