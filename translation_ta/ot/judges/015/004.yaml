translation_notes:
  register: நவீன தரத் தமிழில், மரியாதை ஒருமை வினைமுற்றுகளுடன் கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத ‘வால்களைக் கட்டினார்’ என்ற விவரம் சேர்க்கப்படவில்லை; விலங்கின் வகை குறித்த சொற்பொருள் ஐயம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
