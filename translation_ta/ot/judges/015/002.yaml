translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான உரையாடல் நடை பயன்படுத்தப்பட்டது. எபிரெய வலியுறுத்தல் அமைப்புகள் இயல்பான தமிழ் வலியுறுத்தல்களாகத் தரப்பட்டுள்ளன; ‘சிறந்தவள்’ என்ற சொல் உடல் அழகை மட்டும் குறிக்கும் விளக்கத்தைத் தவிர்க்கிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய ‘தோழன்’ சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
