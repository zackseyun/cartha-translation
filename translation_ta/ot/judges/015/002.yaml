base_translation:
  language: en
  yaml_path: translation/ot/judges/015/002.yaml
  text: And her father said[a], “I really thought that you utterly hated her, so I gave her to your companion. Is not her younger sister better than she? Please let her be yours instead of her.”
translation:
  language: ta
  text: அவளுடைய தந்தை, “நீ அவளை முற்றிலும் வெறுத்துவிட்டாய் என்று நான் உண்மையாகவே நினைத்தேன். அதனால் அவளை உன் தோழனுக்குக் கொடுத்துவிட்டேன்.[a] அவளுடைய தங்கை அவளைவிடச் சிறந்தவள் அல்லவா? தயவுசெய்து, இவள் அவளுக்குப் பதிலாக உனக்குரியவளாகட்டும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன் நண்பனுக்குக் கொடுத்துவிட்டேன்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நண்பர், கூட்டாளி அல்லது உடனிருந்த தோழர் எனப் பொதுவாகக் குறிக்கலாம்; இந்தத் திருமணச் சூழலில் சிலர் இதை சிம்சோனுக்குத் தோழனாக உடனிருந்த மனிதனைக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמֹר אָמַרְתִּי
  choice: உண்மையாகவே நினைத்தேன்
  rationale: எபிரெய மொழியின் வினையெச்சமும் நிறைவுற்ற வினையும் சேர்ந்த அமைப்பு கூற்றை வலியுறுத்துகிறது; தமிழில் இயல்பாக அந்த அழுத்தத்தைத் தருகிறது.
- source_word: שָׂנֹא שְׂנֵאתָהּ
  choice: அவளை முற்றிலும் வெறுத்துவிட்டாய்
  rationale: ஒரே வேர்ச்சொல்லின் வலியுறுத்தல் அமைப்பை ‘முற்றிலும்’ வெளிப்படுத்துகிறது; சூழலில் உறவு முடிந்துவிட்டதாகத் தந்தை கருதியதையும் ‘விட்டாய்’ இயல்பாக உணர்த்துகிறது.
- source_word: וָאֶתְּנֶנָּה
  choice: அதனால் அவளை ... கொடுத்துவிட்டேன்
  rationale: இங்கு வாவ் தந்தையின் ஊகத்திலிருந்து விளைந்த செயலைத் தொடர்வதால், காரணவிளைவு தொடர்பை ‘அதனால்’ தெளிவாக்குகிறது.
- source_word: לְמֵרֵעֶךָ
  choice: உன் தோழனுக்கு
  rationale: מֵרֵעַ என்பது நண்பர், கூட்டாளி அல்லது உடனிருந்த தோழர் எனப் பரந்த பொருள் தருகிறது; திருமணச் சடங்கில் குறிப்பிட்ட பதவியை ஊகிக்காமல் ‘தோழன்’ அந்தப் பரப்பைத் தக்கவைக்கிறது.
- source_word: אֲחֹתָהּ הַקְּטַנָּה
  choice: அவளுடைய தங்கை
  rationale: சகோதரிகளைக் குறிக்கும் சூழலில் ‘இளைய சகோதரி’ என்பதற்கான இயல்பான நவீனத் தமிழ் வடிவம் ‘தங்கை’.
- source_word: טוֹבָה מִמֶּנָּה
  choice: அவளைவிடச் சிறந்தவள்
  rationale: טוֹבָה பொதுவான மேன்மையைக் குறிக்க முடியும்; ‘அழகானவள்’ என்று குறுக்காமல் மூலத்தின் பொருள் விரிவையும் தெளிவின்மையையும் காக்கிறது.
- source_word: תְּהִי נָא לְךָ
  choice: உனக்குரியவளாக ஏற்றுக்கொள்
  rationale: வேண்டுகோளைக் குறிக்கும் நָא உடன் வரும் அமைப்பை இயல்பான தமிழ் உரையாடலாகத் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத திருமணச் சொல்லைச் சேர்ப்பதில்லை.
- source_word: תַּחְתֶּיהָ
  choice: அவளுக்குப் பதிலாக
  rationale: இங்கு תַּחַת மாற்றீட்டைக் குறிக்கிறது; ‘பதிலாக’ அதனைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
