base_translation:
  language: en
  yaml_path: translation/ot/judges/015/005.yaml
  text: He set fire to the torches and let them go into the standing grain of the Philistines[a], and burned up the shocks and the standing grain[b], and even the olive groves.
translation:
  language: ta
  text: அவன் தீப்பந்தங்களுக்குத் தீ மூட்டி, அவற்றைப் பெலிஸ்தியரின் விளைந்து நின்ற தானியப் பயிர்களின் நடுவே விட்டான். குவித்து வைக்கப்பட்ட தானியக் குவியல்கள் முதல் விளைந்து நின்ற பயிர்கள் வரையும், ஒலிவத் தோப்புகள் வரையும் எரித்து அழித்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தானியக் குவியலிலிருந்து விளைந்து நின்ற பயிர்வரையும், ஒலிவத் தோப்புவரையும்” என்று உள்ளது; இது தீயால் அழிந்த பரப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבְעֶר אֵשׁ בַּלַּפִּידִים
  choice: தீப்பந்தங்களைக் கொளுத்தி
  rationale: בער என்பதன் Hiphil வடிவம் ‘தீ மூட்டு/கொளுத்து’ எனப் பொருள்படும்; אֵשׁ உடன் தமிழில் இயல்பாக ‘தீப்பந்தங்களைக் கொளுத்தி’ என்று வழங்கப்படுகிறது.
- source_word: לַפִּידִים
  choice: தீப்பந்தங்கள்
  rationale: எரியும் பந்தங்கள் அல்லது தீக்கட்டைகள் என்ற பொருள் உண்டு; இச்சூழலில் ‘தீப்பந்தங்கள்’ தெளிவான நவீனத் தமிழ்.
- source_word: וַיְשַׁלַּח
  choice: போகவிட்டான்
  rationale: ‘அனுப்பினான்/விடுவித்தான்’ என்ற பொருளுடைய வினை; முந்தைய வசனத்தில் குறிப்பிடப்பட்ட விலங்குகளை மீண்டும் வெளிப்படையாகச் சேர்க்காமல், எபிரெயச் சுட்டுப்பொருளின் இயல்பான தொடர்ச்சியைப் பேணுகிறது.
- source_word: בְּקָמוֹת
  choice: விளைந்து நின்ற தானியப் பயிர்களுக்குள்
  rationale: קָמָה என்பது அறுவடை செய்யப்படாமல் வயலில் நின்ற தானியப் பயிரைக் குறிக்கிறது; பொதுவான ‘வயல்’ என்பதைக் காட்டிலும் வேளாண் வேறுபாட்டைப் பேணுகிறது.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியரின்
  rationale: மக்களினப் பெயரின் நிலையான தமிழ் ஒலிபெயர்ப்பு.
- source_word: וַיַּבְעֵר
  choice: எரித்துப்போட்டான்
  rationale: தீயால் அழிக்கப்பட்ட முடிவை இயல்பாகவும் வலிமையாகவும் தெரிவிக்கிறது.
- source_word: מִגָּדִישׁ
  choice: குவித்து வைக்கப்பட்ட தானியம்
  rationale: גָּדִישׁ என்பது அறுவடை செய்து குவிக்கப்பட்ட தானியம் அல்லது தானியக் குவியலைக் குறிக்கிறது; அரிதான தொழில்நுட்பச் சொல்லைவிட இது பொதுவாசகருக்குத் தெளிவு.
- source_word: וְעַד קָמָה
  choice: விளைந்து நின்ற பயிர்வரையிலும்
  rationale: מִן...עַד என்ற ‘முதல்...வரை’ எல்லை அமைப்பைத் தமிழிலும் வெளிப்படையாகப் பேணுகிறது.
- source_word: וְעַד כֶּרֶם זָיִת
  choice: ஒலிவத் தோப்புவரையிலும்
  rationale: כֶּרֶם என்பது பயிரிடப்பட்ட தோட்டம்; זַיִת உடன் ஒலிவ மரத் தோப்பைக் குறிக்கிறது. ‘வரையிலும்’ மூலத்தின் சேத எல்லையைப் பேணுகிறது.
