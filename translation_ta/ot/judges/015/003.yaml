  text: And Samson said to them[b][a], “This time I am blameless with respect to the Philistines when I do them harm.”
translation:
  language: ta
  text: சிம்சோன் அவர்களிடம், “இந்த முறை நான் பெலிஸ்தியர்களைப் பொறுத்தவரை குற்றமற்றவன்; அவர்களுக்குத் தீங்கு செய்யும்போது” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தருகிறது; வசனத்தின் இறுதியில் வரும் மேற்கோள் வினையாக அமைக்கப்பட்டது.
- source_word: לָהֶם
  choice: அவர்களிடம்
  rationale: முன்னைய சூழலில் சிம்சோன் பேசுகிற பன்மை நபர்களை நேரடியாகக் குறிக்கிறது.
- source_word: שִׁמְשׁוֹן
  choice: சிம்சோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: נִקֵּיתִי
  choice: குற்றமற்றவன்
  rationale: נקה என்பதன் குற்றப்பொறுப்பு அல்லது பழியிலிருந்து விடுபட்டிருத்தல் என்ற பொருளைத் தெளிவாகத் தருகிறது; இது சிம்சோனின் சுயநியாயக் கூற்று என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல் விடுகிறது.
- source_word: הַפַּעַם
  choice: இந்த முறை
  rationale: மோதலில் இப்போது ஏற்பட்டுள்ள புதிய கட்டத்தைக் குறிக்கும் காலவழக்கை இயல்பாகத் தருகிறது.
- source_word: מִפְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களைப் பொறுத்தவரை
  rationale: נקה என்பதுடன் வரும் מִן குறிக்கும், அவர்களுடன் தொடர்புடைய குற்றப்பொறுப்பிலிருந்து விடுபட்டிருப்பதாகச் சொல்லும் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: כִּי
  choice: செய்யும்போது
  rationale: சிம்சோன் தன்னைப் பழியற்றவன் என்று கூறும் சூழ்நிலையை அறிமுகப்படுத்துகிறது; காரணம் அல்லது காலம் என்ற சாத்தியங்களை மிகையாகத் தீர்மானிக்காமல் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: עֹשֶׂה אֲנִי
  choice: நான் ... செய்யும்போது
  rationale: வலியுறுத்தப்பட்ட எழுவாயையும், தொடங்கவிருக்கும் அல்லது நிகழும் செயலைக் குறிக்கக்கூடிய எபிரெயப் பங்கேற்புவினையின் திறந்த காலநிலையையும் ஏற்ற அளவில் காக்கிறது.
- source_word: עִמָּם
  choice: அவர்களுக்கு
  rationale: עשה עם என்ற சொற்றொடரில் செயல் அவர்களை நோக்கியது என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רָעָה
  choice: தீங்கு
  rationale: இச்சூழலில் பகைமையுடன் விளைவிக்கப்படும் சேதத்தைச் சுட்டுகிறது; ‘தீமை’ என்று மொழிபெயர்த்து கூடுதல் ஒழுக்கத் தீர்ப்பைத் திணிப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: சிம்சோனின் குற்றமற்றவன் என்ற கூற்றின் நிலை
  choice: அதைச் சிம்சோனின் சொந்தக் கூற்றாகவே வழங்குதல்
  alternative: கதைசொல்லி அவரை உண்மையிலேயே குற்றமற்றவர் என உறுதிப்படுத்துவதாக மொழிபெயர்த்தல்
  rationale: எபிரெய உரையில் இது சிம்சோன் பேசும் நேரடி கூற்று; அதன் நெறிசார் உண்மைத்தன்மையை வசனம் தனியே தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பெலிஸ்தியர்களைப் பொறுத்தவரை’ என்பது மூலத்தின் உறவுநிலையைத் துல்லியமாகக் காக்கிறது; பின்னர் வரும் ‘என்மேல் பழி இல்லை’ என்பது தமிழில் கூற்றின் நோக்கத்தை இயல்பாகத் தெளிவுபடுத்துகிறது.
