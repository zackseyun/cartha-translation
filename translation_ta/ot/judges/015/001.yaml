translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மணவுறவு சார்ந்த மறைமுகக் குறிப்பை வெளிப்படையாக விளக்காமல் பாதுகாத்து, ‘மனைவி’ என்ற உறவுப்பெயரும் தந்தையின் அனுமதி மறுப்பும் அப்படியே வைக்கப்பட்டுள்ளன. அடிக்குறி குறியீடு அதற்குரிய ‘உள்ளறைக்குள்’ என்பதற்குப் பின் இடப்பட்டுள்ளது.
