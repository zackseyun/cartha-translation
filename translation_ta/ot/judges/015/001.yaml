base_translation:
  language: en
  yaml_path: translation/ot/judges/015/001.yaml
  text: And after some days[a], in the days of the wheat harvest, Samson visited his wife with a young goat. He said, “Let me go in to my wife, into the inner room.” But her father would not allow him to go in.
translation:
  language: ta
  text: சில நாட்களுக்குப் பிறகு, கோதுமை அறுவடைக் காலத்தில், சிம்சோன் ஒரு வெள்ளாட்டுக் குட்டியைக் கொண்டுகொண்டு தன் மனைவியைப் பார்க்கச் சென்றான். அவன், “என் மனைவியிடம், உள்ளறைக்குள்[a] நான் செல்லட்டும்” என்றான். ஆனால் அவளுடைய தந்தை அவனை உள்ளே போகவிடவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அறைக்குள்.” எபிரெயச் சொல் ஓர் அறையை, குறிப்பாக உட்புற அறையைக் குறிக்கலாம்; இச்சூழலில் அது கணவன் மனைவிக்குரிய தனியறையைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: சில நாட்களுக்குப் பிறகு
  rationale: இந்த எபிரெயச் சொற்றொடர் காலம் கடந்ததைக் குறிக்கிறது. தமிழில் இயல்பாகவும் அதன் காலப் பொருளைப் பாதுகாக்கும் விதமாகவும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: கோதுமை அறுவடைக் காலத்தில்
  rationale: குறிப்பிடப்பட்ட பருவம் கோதுமை அறுவடைக் காலம் என்பதைக் தெளிவாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: וַיִּפְקֹד
  choice: பார்க்கச் சென்றான்
  rationale: இச்சூழலில் פקד என்பது ஒருவரைச் சந்திக்க அல்லது பார்க்கச் செல்வதைக் குறிக்கிறது; கணக்கிடுதல், நியமித்தல், தண்டித்தல் போன்ற பிற பொருள்கள் இங்கு பொருந்தாது.
- source_word: בִּגְדִי עִזִּים
  choice: ஒரு வெள்ளாட்டுக் குட்டியைக் கொண்டுகொண்டு
  rationale: גְּדִי עִזִּים என்பது இளம் வெள்ளாட்டைக் குறிக்கிறது. அது சிம்சோன் உடன் கொண்டுவந்த பொருள் என்பதைத் தமிழில் தெளிவாக்குகிறது; பரிசு என்று மூலத்தில் நேரடியாக இல்லாததைச் சேர்க்கவில்லை.
- source_word: אָבֹאָה אֶל אִשְׁתִּי
  choice: நான் என் மனைவியிடம் ... போகட்டும்
  rationale: வினையின் விருப்ப அல்லது நோக்க நுணுக்கத்தை ‘போகட்டும்’ காக்கிறது. ‘மனைவியிடம் போதல்’ என்ற மறைமுகப் பாலுறவுக் குறிப்பை வெளிப்படையாக விரித்துரைக்காமல் பாதுகாக்கிறது.
- source_word: הֶחָדְרָה
  choice: உள்ளறைக்குள்
  rationale: திசைச்சுட்டு வடிவம் அறை அல்லது உட்புற அறைக்குள் செல்வதைக் குறிக்கிறது. ‘படுக்கையறை’ என்று அளவுக்கு மீறிக் குறிப்பாக்காமல் இடவியல் பொருளையும் சூழலின் தனிப்பட்ட மணவுறவுக் குறிப்பையும் காக்கிறது.
- source_word: וְלֹא נְתָנוֹ אָבִיהָ לָבוֹא
  choice: ஆனால் அவளுடைய தந்தை அவனை உள்ளே போகவிடவில்லை
  rationale: அவளுடைய தந்தை சிம்சோனுக்கு நுழைய அனுமதி மறுத்ததை இயல்பான தமிழில் தெரிவிக்கிறது; சிம்சோனின் முந்தைய ‘போகட்டும்’ என்பதோடும் சொல்லிணக்கம் உள்ளது.
