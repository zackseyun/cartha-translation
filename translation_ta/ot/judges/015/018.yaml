  language: en
  yaml_path: translation/ot/judges/015/018.yaml
  text: And he became very thirsty[a], and he called to Yahweh and said, “You have given this great deliverance by the hand of your servant[c][b], and now shall I die from thirst and fall into the hand of the uncircumcised?”
translation:
  language: ta
  text: அவன் மிகவும் தாகமடைந்தான்; அவன் யாவேயை நோக்கிக் கூப்பிட்டு[a], “உமது அடியானின் கையால் இந்தப் பெரிய விடுதலையை[b] தந்தீர். இப்போது நான் தாகத்தால் இறந்து, விருத்தசேதனம் செய்யப்படாதவர்களின்[c] கையில் விழ வேண்டுமா?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கூப்பிட்டு” என்பதை “உதவிக்காகக் கூக்குரலிட்டு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இந்தப் பெரிய விடுதலை” என்பதை “இந்தப் பெரிய வெற்றி” அல்லது “இந்தப் பெரிய மீட்பு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “விருத்தசேதனம் செய்யப்படாதவர்கள்” என்பது இஸ்ரவேலின் எதிரிகளை, இங்கு குறிப்பாகப் பெலிஸ்தியரை, உடன்படிக்கையின் அடையாளத்தைச் சுட்டும் சொல்லால் குறிப்பிடுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּצְמָא מְאֹד
  choice: அவன் மிகவும் தாகமடைந்தான்
  rationale: צמא என்பதன் தாகமடைதல் என்ற பொருளையும், வழக்கமான நவீனத் தமிழையும் இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: அவன் யாவேயை நோக்கிக் கூப்பிட்டு
  rationale: קרא אל என்பது ஒருவரை நோக்கி உதவிக்காக அழைப்பதையோ வேண்டுதலில் கூப்பிடுவதையோ குறிக்கிறது; உணர்ச்சியை அளவுக்கு மீறிச் சேர்க்காமல் அதன் வேண்டுதல் தன்மையை இச்சொற்றொடர் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டத்தால் மாற்றப்படாமல், எபிரெய உரையிலுள்ள இறைத் திருப்பெயரின் ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: אַתָּה נָתַתָּ
  choice: தந்தவர் நீரே
  rationale: சற்று முன் நிறைவேறிய செயலையும், அதைச் செய்தவர் கடவுளே என்ற வலியுறுத்தலையும் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: בְיַד עַבְדְּךָ
  choice: உமது அடியானின் கையால்
  rationale: ביד என்பதன் கருவி அல்லது செயற்படுத்தும் முகவர் என்ற பொருளையும், மூலத்தின் ‘கை’ உருவகத்தையும் காக்கிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியான்
  rationale: கடவுளிடம் தன்னைத் தாழ்மையாகக் குறிப்பிடும் வழக்கமான சொல்லாக இருப்பதால், இச்சூழலில் ‘அடிமை’ என்பதைவிட ‘அடியான்’ பொருத்தமானது.
- source_word: הַתְּשׁוּעָה הַגְּדֹלָה הַזֹּאת
  choice: இந்தப் பெரிய விடுதலை
  rationale: תשועה என்பதில் உள்ள போர்சார் வெற்றி, மீட்பு, காப்பு ஆகிய பொருள் பரப்பை ‘விடுதலை’ ஓரளவு திறந்தவாறே வைத்திருக்கிறது.
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: பெரிய விடுதலைக்கும் உடனடியான உயிராபத்துக்கும் இடையிலுள்ள முரண்பாட்டை இயல்பாகக் குறிக்கிறது.
- source_word: אָמּוּת בַּצָּמָא
  choice: நான் தாகத்தால் இறந்து
  rationale: ב இங்கு காரணத்தைக் குறிக்கிறது; வினாவிடைச் சொல் இல்லாவிட்டாலும் சூழலில் உள்ள சொல்லாட்சிசார் வினா முழு வாக்கியத்தில் காக்கப்படுகிறது.
- source_word: וְנָפַלְתִּי בְּיַד
  choice: கையில் விழ வேண்டுமா?
  rationale: ஒருவருடைய அதிகாரத்திற்குள் அகப்படுதல் என்ற எபிரெய மரபுத்தொடரையும் ‘கை’ உருவகத்தையும் காக்கிறது.
- source_word: הָעֲרֵלִים
  choice: விருத்தசேதனம் செய்யப்படாதவர்கள்
  rationale: பெலிஸ்தியரைக் குறிக்கும் சூழலாயினும், மூலத்தில் உள்ள உடன்படிக்கைச் சின்னம் சார்ந்த, இகழ்ச்சித் தொனியுடைய பெயரிடலை இனப்பெயராக மாற்றாமல் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கப்படுகிறது.
- issue: הָעֲרֵלִים என்பதன் உடன்படிக்கைச் சார்ந்த வலிமை
  choice: விருத்தசேதனம் செய்யப்படாதவர்கள்
  alternative: பெலிஸ்தியர்
  rationale: இந்தச் சொல் இங்கு பெலிஸ்தியரைக் குறிப்பிட்டாலும், உடன்படிக்கையின் அடையாளத்திற்கு வெளியே இருப்பவர்கள் என்ற சொல்லாட்சிசார் மற்றும் இறையியல் அழுத்தத்தை மூல உரை கொண்டுள்ளது; அதை முதன்மை உரை பாதுகாக்கிறது.
- issue: תשועה என்பதன் பொருள் பரப்பு
  choice: விடுதலை
  alternative: வெற்றி / மீட்பு
  rationale: உடனடி இராணுவ வெற்றியையும் கடவுள் அளித்த காப்பையும் ஒருங்கே உணர்த்தி, ஒரு குறுகிய இறையியல் பொருளுக்குள் சொல்லை அடைக்காமல் இருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியக்கூடிய, அதேவேளையில் மன்றாட்டுக்குரிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய உரையில் ‘உமது’, ‘நீரே’ என்ற மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் ‘கை’ உருவகம் இரு இடங்களிலும் பாதுகாக்கப்பட்டுள்ளது.
