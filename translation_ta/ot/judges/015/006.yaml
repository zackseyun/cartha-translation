base_translation:
  language: en
  yaml_path: translation/ot/judges/015/006.yaml
  text: Then the Philistines said[a], “Who did this?” And they said, “Samson, the Timnite’s son-in-law[b], because he took his wife and gave her to his companion.” So the Philistines went up and burned her and her father with fire.
translation:
  language: ta
  text: 'நியாயாதிபதிகள் 15:6


    அப்போது பெலிஸ்தியர்கள், “இதைச் செய்தது யார்?” என்று கேட்டார்கள். அவர்கள், “திம்னியனின் மருமகனான சிம்சோன்தான். ஏனெனில், அந்தத் திம்னியன் சிம்சோனின் மனைவியை எடுத்துச் சிம்சோனின் தோழனுக்குக் கொடுத்துவிட்டான்[a]” என்றார்கள். ஆகவே பெலிஸ்தியர்கள் ஏறிச் சென்று, அவளையும் அவளுடைய தந்தையையும் நெருப்பால் எரித்தார்கள்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தோழன்’ என்பதற்கு ‘நண்பன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் தோழன் அல்லது நண்பனைக் குறிக்கலாம்; திருமணச் சூழலில் சிலர் இதை மணமகனின் தோழன் அல்லது மாப்பிள்ளைத் தோழன் என்ற குறிப்பான பொருளில் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “அவளையும் அவளுடைய தந்தையையும் நெருப்பால் எரித்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: அறியப்பட்ட மக்களினத்தைக் குறிக்கும் வழக்கமான நவீனத் தமிழ் பெயர்.
- source_word: מִי עָשָׂה זֹאת
  choice: இதைச் செய்தது யார்?
  rationale: எபிரெய நேரடிக் கேள்வியின் எளிமையையும் இயல்பான தமிழ் சொல்வரிசையையும் காக்கிறது.
- source_word: חֲתַן הַתִּמְנִי
  choice: திம்னாவைச் சேர்ந்தவனின் மருமகனான
  rationale: חָתָן என்பது மணமகன் அல்லது மருமகன் என்ற திருமண உறவைக் குறிக்கலாம்; இச்சூழலில் திம்னாவைச் சேர்ந்தவனின் மகளுக்குக் கணவனான சிம்சோனைச் சுட்டுவதால் ‘மருமகன்’ தெளிவானது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சிம்சோன் ஏன் இதைச் செய்தான் என்பதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: לָקַח אֶת אִשְׁתּוֹ
  choice: அந்தத் திம்னாவைச் சேர்ந்தவன் சிம்சோனின் மனைவியை எடுத்துச்
  rationale: எபிரெயத்தில் எழுவாய் மறைமுகமாகவும் ‘அவனுடைய மனைவி’ என்ற பதிலீடும் சூழல் சார்ந்ததாகவும் உள்ளன. தமிழில் தவறான புரிதலைத் தவிர்க்க, முந்தைய நிகழ்வின் அடிப்படையில் எழுவாயையும் உரிமையாளரையும் வெளிப்படையாகக் கூறுகிறது.
- source_word: וַיִּתְּנָהּ לְמֵרֵעֵהוּ
  choice: சிம்சோனின் தோழனுக்குக் கொடுத்துவிட்டான்
  rationale: முந்தைய நிகழ்வில் (14:20) கூறப்பட்ட உறவைத் தெளிவாக்குகிறது; מֵרֵעַ என்பதைக் குறிப்பிட்ட திருமணச் சடங்குப் பதவியாக மாற்றாமல் பொதுவான ‘தோழன்’ என வழங்குகிறது.
- source_word: וַיַּעֲלוּ
  choice: ஏறிச் சென்று
  rationale: எபிரெய இயக்க வினையின் ‘மேலே செல்லுதல்’ என்ற கூறைப் பாதுகாக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: וַיִּשְׂרְפוּ אוֹתָהּ וְאֶת אָבִיהָ בָּאֵשׁ
  choice: அவளையும் அவளுடைய தகப்பனையும் நெருப்பில் எரித்தார்கள்
  rationale: ‘நெருப்பால்/நெருப்பில் எரித்தார்கள்’ என்ற எபிரெய வலியுறுத்தலைக் காக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கொன்றார்கள்’ என்பதைச் சேர்க்கவில்லை.
