translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. நேரடி உரையின் வேகம் காக்கப்பட்டுள்ளது. ‘தகப்பன்’ என்பது வேதாகமக் கதைநடைக்கு ஏற்ற, இன்னும் எளிதில் புரியும் சொலாகத் தேர்ந்தெடுக்கப்பட்டது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்புக் குறிகள் பொருந்தாத இடங்களில் இருந்ததால், [a] ‘தோழன்’ என்பதற்குப் பின்னும் [b] ‘நெருப்பில் எரித்தார்கள்’ என்பதற்குப் பின்னும் பொருள் சார்ந்த முறையில் வைக்கப்பட்டுள்ளன.
