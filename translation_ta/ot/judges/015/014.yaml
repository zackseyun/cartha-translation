  text: הוּא בָ֣א עַד לֶ֔חִי וּ/פִלְשִׁתִּ֖ים הֵרִ֣יעוּ לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַ/תִּהְיֶ֨ינָה הָ/עֲבֹתִ֜ים אֲשֶׁ֣ר עַל זְרוֹעוֹתָ֗י/ו כַּ/פִּשְׁתִּים֙ אֲשֶׁ֣ר בָּעֲר֣וּ בָ/אֵ֔שׁ וַ/יִּמַּ֥סּוּ אֱסוּרָ֖י/ו מֵ/עַ֥ל יָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/014.yaml
  text: When he came as far as Lehi[a], the Philistines shouted as they came to meet him. Then the Spirit of Yahweh rushed upon him, and the ropes that were on his arms became like flax that has been burned in the fire, and his bonds melted off his hands.
translation:
  language: ta
  text: அவன் லேகி[a] வரை வந்தபோது, பெலிஸ்தியர்கள் அவனை எதிர்கொள்ள வந்து உரக்கக் கூச்சலிட்டார்கள். அப்போது யாவேயின் ஆவி அவன்மேல் வல்லமையாய் இறங்கியது. அவனுடைய புயங்களில் இருந்த கயிறுகள் நெருப்பில் எரிந்த ஆளி நாரைப் போலாயின; அவனுடைய கட்டுகள் அவன் கைகளிலிருந்து உருகிப்போயின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: லேகி என்பது ஓர் இடப்பெயர். அதற்கான எபிரெயச் சொல் ‘தாடை எலும்பு’ என்ற சொல்லோடும் தொடர்புடையது; அதைச் சுற்றியுள்ள கதையில் அந்தச் சொல் முக்கியமானதாகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחִי
  choice: லேகி
  rationale: சூழலில் இது ஓர் இடப்பெயராகச் செயல்படுகிறது. எபிரெயச் சொல்லின் ‘தாடை எலும்பு’ என்ற பொருள் சுற்றியுள்ள நிகழ்வில் முக்கியமாதலால் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: הֵרִיעוּ לִקְרָאתוֹ
  choice: அவனை எதிர்கொண்டு ஆரவாரம் செய்தார்கள்
  rationale: வினைச்சொல் உரத்த முழக்கத்தைக் குறிக்கிறது; לִקְרָאתוֹ எதிர்கொள்ள வருவதையும் சந்திப்பதையும் தெரிவிக்கிறது. ‘போர்முழக்கம்’ என்று அளவுக்கு மீறிக் குறிப்பாக்காமல் இரு கூறுகளும் காக்கப்படுகின்றன.
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: யாவேயின் ஆவி அவன்மேல் வல்லமையுடன் இறங்கியது
  rationale: שׁ רוח יהוה உடன் வரும் צלח திடீரான, வலிமைமிக்க ஆற்றலளிப்பைக் காட்டுகிறது. இயல்பான நவீனத் தமிழில் அதன் வலிமையை இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: הָעֲבֹתִים
  choice: கயிறுகள்
  rationale: கட்டுவதற்குப் பயன்படுத்தப்பட்ட தடித்த கயிறுகள் அல்லது வடங்களைக் குறிக்கும் சொல். ‘கயிறுகள்’ என்பது சூழலுக்கேற்ற இயல்பான பொதுச்சொல்.
- source_word: זְרוֹעוֹתָיו
  choice: கைகள்
  rationale: זְרוֹעַ கை அல்லது புயத்தைக் குறிக்கலாம். தமிழில் இங்கு ‘கைகள்’ இயல்பாக உள்ளது; ‘முன்கைகள்’ என உடற்கூற்றை அளவுக்கு மீறிக் குறிப்பாக்கவில்லை.
- source_word: כַּפִּשְׁתִּים
  choice: சணல் நார்
  rationale: פִשְׁתִּים என்பது flax நாரைக் குறிக்கிறது. பொதுவாசகருக்குப் புரியும் வகையில் ‘சணல் நார்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר בָּעֲרוּ בָאֵשׁ
  choice: நெருப்பில் எரிந்த
  rationale: நெருப்பால் பாதிக்கப்பட்ட நாரின் வலுவிழந்த நிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיִּמַּסּוּ
  choice: உருகி விழுந்தன
  rationale: מסס என்பதன் உருகுதல் அல்லது கரைதல் என்ற உருவக வலிமையைக் காத்து, கட்டுகள் கைகளிலிருந்து நீங்கிய விளைவையும் தெளிவாக்குகிறது.
- source_word: אֱסוּרָיו
  choice: கட்டுகள்
  rationale: அவனைக் கட்டியிருந்த பிணைப்புகளைக் குறிக்கிறது. உலோக விலங்குகளை உணர்த்தாமல் கயிற்றுக் கட்டுகளுக்கும் பொருந்துகிறது.
- source_word: מֵעַל יָדָיו
  choice: அவன் கைகளிலிருந்து
  rationale: சொல்லுக்குச் சொல் ‘அவன் கைகளின் மேலிருந்து’ என்பதன் இயல்பான தமிழ் இணை. ‘மணிக்கட்டுகள்’ என மூலத்தைவிட குறிப்பாக்கப்படவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதனை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்த்துள்ளது.
- issue: சிம்சோனுக்கு ஆவி அளிக்கும் வல்லமையின் வர்ணனை
  choice: யாவேயின் ஆவி அவன்மேல் வல்லமையுடன் இறங்கியது
  alternative: யாவேயின் ஆவி அவன்மேல் பாய்ந்தது
  rationale: மூல மொழியின் திடீர், வலிமைமிக்க ஆற்றலளிப்பை காக்கிறது; ‘பாய்ந்தது’ என்பதன் இயல்பற்ற அல்லது உடல்சார் தோற்றத்தைத் தவிர்த்து, பிற்கால இறையியல் வகைப்பாடுகளை இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கதைநடையின் வேகமும் எபிரெய உருவகங்களான எரிந்த சணல் நார் மற்றும் உருகும் கட்டுகள் என்பவையும் காக்கப்பட்டுள்ளன.
