revisions:
- from: அவன் கழுதையின் ஈரமான தாடை எலும்பு ஒன்றைக் கண்டான்[a]. தன் கையை நீட்டி அதை எடுத்துக்கொண்டு, அதனால் ஆயிரம் பேரை வீழ்த்தினான்.
  to: அவன் புதியதாக இருந்த கழுதைத் தாடை எலும்பு ஒன்றைக் கண்டான்[a]. தன் கையை நீட்டி அதை எடுத்துக்கொண்டு, அதனால் ஆயிரம் பேரை வீழ்த்தினான்.
  rationale: The revision replaces an unduly narrow physical description with a natural Tamil expression for the primary sense, while the footnote preserves the alternative sense indicated by the Hebrew adjective. All other elements retain the source’s sequence, concrete action, and combat setting.
