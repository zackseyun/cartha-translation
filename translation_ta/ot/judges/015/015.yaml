id: JDG.15.15
reference: Judges 15:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּמְצָ֥א לְחִֽי חֲמ֖וֹר טְרִיָּ֑ה וַ/יִּשְׁלַ֤ח יָד/וֹ֙ וַ/יִּקָּחֶ֔/הָ וַ/יַּךְ בָּ֖/הּ אֶ֥לֶף אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/015.yaml
  text: And he found a fresh jawbone of a donkey[a], and he reached out his hand and took it, and with it he struck down a thousand men.
translation:
  language: ta
  text: அவன் புதியதாக இருந்த கழுதைத் தாடை எலும்பு ஒன்றைக் கண்டான்[a]. தன் கையை நீட்டி அதை எடுத்துக்கொண்டு, அதனால் ஆயிரம் பேரை வீழ்த்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இன்னும் காயாத கழுதைத் தாடை எலும்பு ஒன்றை.” எபிரெயப் பெயரடை புதியதாகக் கிடைத்ததையோ, இன்னும் காயாத புதிய நிலையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: கண்டான்
  rationale: מצא என்பதன் தொடர்கதை வடிவம் இங்கு கடந்தகாலத்தில் நிகழ்ந்த எளிய செயலைக் குறிக்கிறது; ‘கண்டான்’ என்பது இயல்பான நேரடி மொழிபெயர்ப்பு.
- source_word: לְחִי חֲמוֹר
  choice: கழுதையின் தாடை எலும்பு
  rationale: לְחִי என்பது தாடை அல்லது தாடை எலும்பைக் குறிக்கலாம். ஆயுதமாகப் பயன்படுத்தப்படும் எலும்பு என்பதால் ‘தாடை எலும்பு’ துல்லியமானது.
- source_word: טְרִיָּה
  choice: ஈரமான
  rationale: இந்தச் சொல் காய்ந்து பழையதாகாத, புதிதாகக் கிடைத்த எலும்பைக் குறிக்கிறது. ‘ஈரமான’ என்பது அதன் உடல் நிலையைக் காட்டுகிறது; ‘புதிய’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: தன் கையை நீட்டி
  rationale: எபிரெயச் சொற்றொடரின் தெளிவான உடல் இயக்கப் படிமத்தைக் காத்து, தமிழிலும் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: וַיִּקָּחֶהָ
  choice: அதை எடுத்துக்கொண்டு
  rationale: பெண்பால் பின்னொட்டு முன் கூறப்பட்ட தாடை எலும்பைக் குறிக்கிறது; לקח என்பதற்கு இங்கு எளிய ‘எடுத்தான்’ என்ற பொருள் பொருந்துகிறது.
- source_word: וַיַּךְ בָּהּ
  choice: அதனால் ... வீழ்த்தினான்
  rationale: נכה என்பது அடித்தல் அல்லது தாக்கி வீழ்த்துதலைக் குறிக்கும். போர்ச் சூழலில் ஏற்பட்ட உயிர்க்கொல்லும் விளைவை ‘வீழ்த்தினான்’ இயல்பாக உணர்த்துகிறது; நேரடியாக ‘கொன்றான்’ என்று வினையை மிகத் தெளிவுபடுத்தவில்லை.
- source_word: אֶלֶף אִישׁ
  choice: ஆயிரம் பேரை
  rationale: எண்ணுக்குப் பின் வரும் אִישׁ போரில் ஈடுபட்ட மனிதர்களைக் குறிக்கிறது. தமிழில் ‘ஆயிரம் பேரை’ இயல்பாகவும் மனிதர்களைத் தெளிவாகவும் குறிக்கிறது.
