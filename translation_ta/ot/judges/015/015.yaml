translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட தொடர்கதை நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் தொடர் வினை அமைப்பு தமிழில் இயல்பாக ஓடும்படி இணைக்கப்பட்டுள்ளது; சொல்லின் உண்மையான பொருள் வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
