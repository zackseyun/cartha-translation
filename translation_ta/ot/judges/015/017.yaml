base_translation:
  language: en
  yaml_path: translation/ot/judges/015/017.yaml
  text: And when he had finished speaking[a], he threw the jawbone from his hand, and he called that place Ramath-lehi.
translation:
  language: ta
  text: அவன் பேசி முடித்தபோது, தன் கையிலிருந்த தாடை எலும்பை எறிந்துவிட்டு, அந்த இடத்துக்கு ராமத்-லேகி[a] என்று பெயரிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ராமத்-லேகி” என்பதற்கு “தாடை எலும்பின் மேடு” அல்லது “தாடை எலும்பின் உயரம்” என்று பொருள் இருக்கலாம். “லேகி” என்பது “தாடை எலும்பு” என்ற சொல்லுடன் ஏற்படுத்தும் சொல்விளையாட்டை இந்தப் பெயர் தக்கவைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: அவன் பேசி முடித்தபோது
  rationale: כְּ முன்னொட்டுடன் வரும் כלה வினையின் infinitive construct மற்றும் לְדַבֵּר இணைந்து, ‘அவன் பேசி முடித்தபோது/முடித்ததும்’ என்ற காலப் பொருளைத் தருகின்றன. தமிழில் இயல்பான தொடராக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וַיַּשְׁלֵךְ
  choice: எறிந்துவிட்டு
  rationale: சொல் ‘எறிதல்/வீசுதல்’ எனப் பொருள்படும். அடுத்த செயலைத் தொடரும் எபிரெயக் கதைநடையை இயல்பான தமிழில் இணைக்க ‘எறிந்துவிட்டு’ பயன்படுத்தப்பட்டது; தேவையற்ற வலிமை சேர்க்கப்படவில்லை.
- source_word: הַלְּחִי
  choice: தாடை எலும்பை
  rationale: முந்தைய வசனங்களின் சூழலில் இது சிம்சோன் ஆயுதமாகப் பயன்படுத்திய கழுதையின் தாடை எலும்பைக் குறிக்கிறது. ‘தாடை எலும்பு’ என்பது நவீன தமிழில் தெளிவான இணை.
- source_word: מִיָּדוֹ
  choice: தன் கையிலிருந்த
  rationale: சொல்லடியாக ‘அவனுடைய கையிலிருந்து.’ தமிழ் நடை மற்றும் எழுவாய் குறிப்பு தெளிவாக இருக்க ‘தன் கையிலிருந்த’ என வழங்கப்பட்டது.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: அந்த இடத்துக்கு … என்று பெயரிட்டான்
  rationale: קרא என்பது இங்கு ஓர் இடத்துக்குப் பெயர் சூட்டுவதைக் குறிக்கிறது. ‘அழைத்தான்’ என்பதைவிட ‘பெயரிட்டான்’ தமிழில் இந்தப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: רָמַת לֶחִי
  choice: ராமத்-லேகி
  rationale: இடப்பெயர் முதன்மை உரையில் ஒலிபெயர்க்கப்பட்டது. לֶחִי என்ற சொல் ‘தாடை/தாடை எலும்பு’ எனவும் இங்கு இடப்பெயரின் பகுதியாகவும் விளங்குவதால், அதன் சொல்விளையாட்டு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
