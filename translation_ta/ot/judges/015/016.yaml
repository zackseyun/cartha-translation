base_translation:
  language: en
  yaml_path: translation/ot/judges/015/016.yaml
  text: Then Samson said[a], “With the jawbone of a donkey, a heap, two heaps; with the jawbone of a donkey I have struck down a thousand men.”
translation:
  language: ta
  text: 'அப்போது சிம்சோன் சொன்னான்:


    “கழுதையின் தாடையெலும்பால்,


    குவியல், இரு குவியல்கள்;


    கழுதையின் தாடையெலும்பால்


    ஆயிரம் பேரை வீழ்த்தினேன்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழியில் இங்கு சொல்விளையாட்டு உள்ளது: ‘கழுதை’ மற்றும் ‘குவியல்/குவியல்கள்’ என்பதற்கான சொற்களின் அடிச்சொல் ஒரே மெய்யெழுத்துகளால் எழுதப்படுகிறது; உயிரெழுத்துகளும் சொல்லின் முடிவும் வேறுபடுகின்றன.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... சொன்னான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீனத் தமிழில் இயல்பான தொடர்ச்சியை ‘அப்போது’ காட்டுகிறது.
- source_word: שִׁמְשׁוֹן
  choice: சிம்சோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட பெயர்வடிவம்.
- source_word: בִּלְחִי הַחֲמוֹר
  choice: கழுதையின் தாடையெலும்பால்
  rationale: לְחִי இங்கு ஆயுதமாகப் பயன்படுத்தப்பட்ட தாடையெலும்பைக் குறிக்கிறது; ב கருவிப்பொருளைக் குறிப்பதால் ‘-ஆல்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: חֲמוֹר חֲמֹרָתָיִם
  choice: குவியல், இரு குவியல்கள்
  rationale: ‘கழுதை’ என்பதற்கான חֲמוֹר என்ற சொல்லுக்கும் குவியல் சார்ந்த ஒத்தொலிச் சொல்லுக்கும் இடையிலான எபிரெயச் சொல்விளையாட்டை, பொருளை மிகைப்படுத்தாமல், வெளிப்படையான எண்ணிக்கை அமைப்புடன் பிரதிபலிக்கிறது.
- source_word: הִכֵּיתִי
  choice: வீழ்த்தினேன்
  rationale: נכה என்பதன் ‘அடித்தல்/வீழ்த்துதல்’ பொருளையும் இச்சூழலில் ஏற்பட்ட மரண விளைவையும் இயல்பான தமிழில் சுருக்கமாகக் காட்டுகிறது; ‘கொன்றேன்’ என்று நேரடியாக மிகத் தெளிவுபடுத்துவதைத் தவிர்க்கிறது.
- source_word: אֶלֶף אִישׁ
  choice: ஆயிரம் பேரை
  rationale: இராணுவச் சூழலில் ஆயிரம் ஆண்களைக் குறித்தாலும், எண்ணிக்கைக்குப் பின் நவீனத் தமிழில் ‘பேர்’ இயல்பாகவும் மனிதர்களைக் குறிக்கும் வகையிலும் அமைகிறது.
