translation_notes:
  register: கவிதைபோன்ற வெற்றிக் கூற்றின் வரியமைப்பு பாதுகாக்கப்பட்டுள்ளது. மொழிநடை நவீனமானதும் கண்ணியமானதும்; ‘குவியல், இரு குவியல்கள்’ என்ற சற்றே விசித்திரமான அமைப்பு மூலத்தின் சொல்விளையாட்டையும் உண்மையான தெளிவின்மையையும் தக்கவைக்கிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய முழுக் கூற்றின் முடிவில் வைக்கப்பட்டுள்ளது.
