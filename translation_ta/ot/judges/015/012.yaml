  text: They said to him, “We have come down to bind you, to hand you over into the hand of the Philistines.” Samson said to them, “Swear to me that you yourselves will not attack me.”
translation:
  language: ta
  text: அவர்கள் அவனை நோக்கி, “உன்னைக் கட்டிப் பெலிஸ்தியரின் கையில் ஒப்படைக்கவே இறங்கி வந்திருக்கிறோம்” என்றார்கள். சிம்சோன் அவர்களிடம், “நீங்களே என்மேல் தாக்குதல் நடத்த மாட்டீர்கள் என்று எனக்குச் சத்தியம் செய்யுங்கள்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶאֱסָרְךָ
  choice: உன்னைக் கட்டி
  rationale: אסר என்பதன் அடிப்படைப் பொருளான ‘கட்டு/பிணை’ என்பதை இயல்பான தமிழில் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: לְתִתְּךָ בְּיַד פְּלִשְׁתִּים
  choice: பெலிஸ்தியரின் கையில் ஒப்படைக்க
  rationale: ‘ஒருவரை ஒருவரின் கையில் கொடுத்தல்’ என்ற எபிரெய மொழிப்படிமத்தையும், அதிகாரத்திற்குள் ஒப்படைக்கும் கருத்தையும் காக்கிறது.
- source_word: הִשָּׁבְעוּ לִי
  choice: எனக்கு ஆணையிட்டுக் கூறுங்கள்
  rationale: שׁבע என்பதிலுள்ள உறுதிமொழி/சத்தியத்தின் வலிமையை நவீன, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: פֶּן תִּפְגְּעוּן בִּי אַתֶּם
  choice: நீங்களே என்மேல் தாக்குதல் நடத்த மாட்டீர்கள் என்று
  rationale: פגע இச்சூழலில் உடல்ரீதியாகத் தாக்குதல் நடத்துவதைக் குறிக்கிறது; אַתֶּם என்பதன் வலியுறுத்தலை ‘நீங்களே’ காக்கிறது.
