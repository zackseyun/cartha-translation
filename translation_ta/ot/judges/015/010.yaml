  text: And the men of Judah said, “Why have you come up against us?” And they said, “We have come up to bind Samson, to do to him just as he did to us.”
translation:
  language: ta
  text: யூதா மக்கள், “நீங்கள் ஏன் எங்களுக்கு எதிராக வந்தீர்கள்?” என்று கேட்டார்கள். அவர்கள், “சிம்சோனைக் கட்டுவதற்கு வந்தோம்; அவன் எங்களுக்குச் செய்தது போலவே அவனுக்கு செய்வதற்கு வந்தோம்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ יְהוּדָה
  choice: யூதா ஆண்கள்
  rationale: אִישׁ ஒருமை வடிவில் இருந்தாலும், பன்மை வினைச்சொல்லுடன் இங்கு ஒரு கூட்டத்தைக் குறிக்கிறது. பாலினத்தைக் காட்டும் மூல வடிவையும் இயல்பான தமிழையும் காக்க ‘யூதா ஆண்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לָמָה
  choice: ஏன்
  rationale: காரணத்தைக் கேட்கும் வழக்கமான வினாவுக்கு நவீன தமிழில் இயல்பான நேரடி இணை.
- source_word: עֲלִיתֶם עָלֵינוּ
  choice: எங்களுக்கு எதிராகப் படையெடுத்து வந்தீர்கள்
  rationale: עלה + על இங்கு பகைமையான முன்னேற்றத்தைக் குறிக்கிறது. ‘எதிராக வந்தீர்கள்’ என்பதைக் காட்டிலும், ஆயுதமேந்திய பெலிஸ்தியரின் சூழலில் ‘படையெடுத்து’ என்பது இயக்கத்தின் பகைமைத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது; ‘வந்தீர்கள்’ பேசுபவர்களின் நோக்குநிலையைத் தக்கவைக்கிறது.
- source_word: לֶאֱסוֹר
  choice: கட்டிப்போட்டு
  rationale: אָסַר என்பதன் கட்டுதல் அல்லது சிறைப்படுத்துதல் என்ற பொருளை, சிம்சோனைப் பிடிக்கும் உடனடிச் சூழலில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: עָלִינוּ
  choice: படையெடுத்து வந்தோம்
  rationale: முந்தைய கேள்வியிலுள்ள עלה வினை மீண்டும் வருவதைத் தமிழிலும் அதே சொற்றொடரை மீளப் பயன்படுத்தி காக்கிறது.
- source_word: לַעֲשׂוֹת לוֹ
  choice: அவனுக்கும் செய்வதற்காக
  rationale: பழிவாங்கும் சூழலில் עשה + ל என்பது ‘அவனுக்குச் செய்வது’ என்ற இலக்குறு பொருளைக் கொண்டது; தமிழில் முன் வரும் ‘எங்களுக்குச் செய்தது’ என்பதோடு இணைந்து அதன் தீங்கான பொருள் தெளிவாகிறது.
- source_word: כַּאֲשֶׁר עָשָׂה לָנוּ
  choice: அவன் எங்களுக்குச் செய்தது போலவே
  rationale: ஒப்பீட்டையும் பழிக்குப்பழி என்ற சமச்சீரையும் ‘போலவே’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: שִׁמְשׁוֹן
  choice: சிம்சோன்
  rationale: தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்ப ஒலிபெயர்க்கப்பட்டது.
