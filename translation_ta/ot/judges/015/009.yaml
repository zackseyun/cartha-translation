  yaml_path: translation/ot/judges/015/009.yaml
  text: Then the Philistines went up and camped in Judah[a], and spread out at Lehi.
translation:
  language: ta
  text: பின்பு பெலிஸ்தியர்கள் மேலே சென்று, யூதாவில் முகாமிட்டு, லேகியில் பரவினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “லேகியில் படையாக விரிந்து நிலைகொண்டார்கள்.” எபிரெய வினை படையினர் ஓர் இடத்தில் விரிந்து நிலைகொள்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: மேலே சென்று
  rationale: עלה என்ற வினை புவியியல் அல்லது படை நகர்வில் ‘மேலே செல்’ என்னும் திசை உணர்வைத் தருகிறது; அதை மிகையாக விளக்காமல் இயல்பான தமிழில் காக்கிறது.
- source_word: פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இந்த மக்கள் இனத்திற்கான தமிழில் நிலைபெற்ற பெயர்.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டு
  rationale: חנה முகாம் அமைத்துத் தங்குவதைக் குறிக்கிறது; ‘முகாமிட்டு’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: בִּיהוּדָה
  choice: யூதாவில்
  rationale: ב இங்கு பகைநோக்கைக் காட்டுவதைவிட இருப்பிடத்தைக் காட்டுகிறது; அடுத்த சொற்றொடர் குறிப்பிட்ட இடமாக லேகியைச் சொல்கிறது.
- source_word: וַיִּנָּטְשׁוּ
  choice: அணிவகுத்துப் பரவினார்கள்
  rationale: נטשׁ இச்சூழலில் படை ஓர் இடத்தில் விரிந்து நிலைகொள்வதைக் குறிக்கலாம். ‘அணிவகுத்துப் பரவினார்கள்’ என்பது அதன் இராணுவ நுண்ணுணர்வையும் பொதுவான புரிதலையும் இணைக்கிறது.
- source_word: בַּלֶּחִי
  choice: லேகியில்
  rationale: לֶחִי இங்கு ஓர் இடப்பெயர்; ב முன்னிடைச்சொல்லின் இடவுணர்வை ‘-இல்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. படைச்சூழலை உணர்த்தும் வகையில் ‘அணிவகுத்துப் பரவினார்கள்’ என மொழிபெயர்க்கப்பட்டாலும், எபிரெயச் சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
