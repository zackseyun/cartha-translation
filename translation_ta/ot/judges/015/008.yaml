  text: וַ/יַּ֨ךְ אוֹתָ֥/ם שׁ֛וֹק עַל יָרֵ֖ךְ מַכָּ֣ה גְדוֹלָ֑ה וַ/יֵּ֣רֶד וַ/יֵּ֔שֶׁב בִּ/סְעִ֖יף סֶ֥לַע עֵיטָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/008.yaml
  text: And he struck them hip and thigh with a great slaughter[a], and he went down and stayed in the cleft of the rock of Etam.
translation:
  language: ta
  text: அவன் அவர்களை இடுப்பும் தொடையுமாக[a] தாக்கி, பெரும் படுகொலை செய்தான்; பிறகு இறங்கி, ஏத்தாம் கற்பாறையின் பிளவில் தங்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இடுப்பும் தொடையுமாக.” இது பேரழிவான அல்லது முழுமையான தோல்வியைக் குறிக்கும் மரபுத்தொடராக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: தாக்கி
  rationale: נכה என்பதன் அடிப்படைப் பொருள் ‘அடி/தாக்கு’. இங்குள்ள வன்முறைச் சூழலைத் தெளிவாகக் காட்டுகிறது; அதேவேளையில் இந்த வினைச்சொல் மட்டும் எல்லாரும் கொல்லப்பட்டதாக மிகைப்படுத்துவதில்லை.
- source_word: שׁוֹק עַל יָרֵךְ
  choice: காலும் தொடையுமாக
  rationale: சொல்லாட்சியின் உடல் சார்ந்த உருவகத்தைத் தமிழில் இயன்றவரை காக்கிறது. இதன் துல்லியமான மரபுத்தொடர்ப் பொருள் உறுதியற்றதால், விளக்கப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מַכָּה גְדוֹלָה
  choice: பெரும் படுகொலை செய்தான்
  rationale: מַכָּה என்பதற்கு அடிப்படையில் ‘அடி/தாக்குதல்’ என்று பொருள்; போர்ச் சூழலில் அது பேரழிவான தாக்குதல் அல்லது படுகொலையைக் குறிக்கலாம். இங்கு வன்முறையின் தீவிரத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיֵּרֶד
  choice: கீழே இறங்கிப்போய்
  rationale: திசையைக் குறிக்கும் ‘இறங்கினான்’ என்ற பொருளை இயல்பான கதைநடைத் தமிழில் காக்கிறது.
- source_word: וַיֵּשֶׁב
  choice: தங்கினான்
  rationale: ישב என்பது உட்காருதல், குடியிருத்தல் அல்லது தங்குதல் எனப் பொருள்படலாம். இந்த இடத்தில் தற்காலிகமாக அங்கே இருந்ததை ‘தங்கினான்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: בִּסְעִיף
  choice: பிளவில்
  rationale: பிளவு அல்லது வெடிப்பு எனும் பொருளைத் தருகிறது; கற்பாறைக்குள் புகலிடமாக அமைந்த இடத்துக்கு ஏற்ற இயல்பான சொல்.
- source_word: סֶלַע
  choice: கற்பாறை
  rationale: סֶלַע என்பது பெரிய பாறை அமைப்பு அல்லது பாறை முகட்டைக் குறிக்கும். ‘கற்பாறை’ இங்கு தெளிவான, இயல்பான தமிழ்.
- source_word: עֵיטָם
  choice: ஏத்தாம்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
