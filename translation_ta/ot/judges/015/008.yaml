translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பொருள் உறுதியற்ற எபிரெய மரபுத்தொடரின் உடல் சார்ந்த உருவகம் மூலவசனத்தில் காக்கப்பட்டு, அதன் சாத்தியமான பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
