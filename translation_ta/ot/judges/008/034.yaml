  edition: WLC
  text: וְ/לֹ֤א זָֽכְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת יְהוָ֖ה אֱלֹהֵי/הֶ֑ם הַ/מַּצִּ֥יל אוֹתָ֛/ם מִ/יַּ֥ד כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/034.yaml
  text: And the sons of Israel did not remember Yahweh their God[a], who had delivered them from the hand of all their enemies all around.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள்[a] தங்களைச் சுற்றியிருந்த எல்லா எதிரிகளின் கையிலிருந்தும் தங்களை விடுவித்த தங்கள் கடவுளாகிய யாவேவை நினைவுகூரவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்கள்.” எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: நினைவுகூரவில்லை
  rationale: எபிரெய மொழியின் இணைப்புச் சொல்லும் மறுப்பும் தொடரும் கதைநடையில் இயல்பாக வெளிப்படுகின்றன; தமிழில் வசனத்தைத் தனியே வாசிக்கும்போது தேவையற்ற ‘மேலும்’ என்பதைத் தவிர்ப்பது இயல்பானது.
- source_word: זָכְרוּ
  choice: நினைவுகூரவில்லை
  rationale: இது வெறும் மன நினைவை மட்டுமல்லாமல், கடவுளுடைய செயல்களை நினைவில் கொண்டு அவருக்கு உண்மையாய் இருப்பதையும் குறிக்கக்கூடிய பரந்த சொல்.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: மூலத்தின் ‘இஸ்ரவேலின் மகன்கள்’ என்ற ஆண்பால் பன்மை வடிவத்தைப் பாதுகாக்கிறது; இயல்பான கூட்டுப்பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயரால் மாற்றப்படாமல், எபிரெய வேதத்தில் வரும் கடவுளின் தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵיהֶם
  choice: தங்கள் கடவுளாகிய
  rationale: யாவே என்பவரையே சுட்டுவதால் ஒருமையான ‘கடவுள்’ பொருத்தமானது; ‘தங்கள்’ உடன்படிக்கை உறவையும் தெளிவாக்குகிறது.
- source_word: הַמַּצִּיל
  choice: விடுவித்தவர்
  rationale: பெயரடைத் தன்மை கொண்ட எபிரெயப் பங்கேற்புவினையை தமிழில் இயல்பான அடையாளப்படுத்தும் வடிவில் தருகிறது; விடுவித்த செயல் அவர்கள் நினைவுகூரத் தவறியதற்கு முன்பு நிகழ்ந்தது.
- source_word: מִיַּד
  choice: கையிலிருந்தும்
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய உருவகத்தை தமிழிலும் புரியத்தக்க வகையில் பாதுகாக்கிறது.
- source_word: כָּל אֹיְבֵיהֶם
  choice: அவர்களுடைய எல்லா எதிரிகளின்
  rationale: முழுமையைக் குறிக்கும் כָּל என்பதையும் எதிரிகளுடனான உறவையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: מִסָּבִיב
  choice: சுற்றிலும் இருந்த
  rationale: எல்லாப் பக்கங்களிலும் இருந்த எதிரிகளை நவீனத் தமிழில் இயல்பாகக் குறிப்பிடுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் உடன்படிக்கைப் பெயரைப் பாதுகாக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினம் குறிக்கப்பட்ட குழுப்பெயர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள்; இஸ்ரவேல் மக்கள்
  rationale: மூலத்தின் இலக்கண ஆண்பால் பன்மையை முதன்மை உரையில் பாதுகாத்து, தமிழில் இயல்பான கூட்டுப்பெயரை அடிக்குறிப்பில் வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. எபிரெய ‘கை’ உருவகமும் ‘இஸ்ரவேலின் மகன்கள்’ என்ற வடிவமும் பாதுகாக்கப்பட்டுள்ளன; நீண்ட மூலவாக்கியம் தமிழில் தெளிவுக்காக இரு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
