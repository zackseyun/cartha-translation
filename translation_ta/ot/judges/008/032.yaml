base_translation:
  language: en
  yaml_path: translation/ot/judges/008/032.yaml
  text: And Gideon son of Joash died at a good old age and was buried in the tomb of Joash his father[b][a], in Ophrah of the Abiezrites.
translation:
  language: ta
  text: யோவாசின் மகன் கிதியோன் நல்ல முதுமையில் இறந்தார். அபியேசரியருக்குரிய ஒப்ராவில்[b], அவருடைய தந்தை யோவாசின் கல்லறையில்[a] அவர் அடக்கம் செய்யப்பட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய தந்தை யோவாசின் புதைகுழியில்.” எபிரெய மொழியிலுள்ள קֶבֶר என்ற சொல் புதைகுழி, கல்லறை, அல்லது அடக்க இடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில், “அபியேசரியரின் ஒப்ராவில்”; அதாவது, அபியேசரின் குலத்துக்குரிய ஒப்ரா.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தார்
  rationale: מות என்பதன் நேரடியான பொருள் ‘இறத்தல்’; எபிரெயச் சொல்லை மென்மைப்படுத்தாமல் இயல்பான மரியாதை நடையில் தருகிறது.
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: யோவாசின் மகன் கிதியோன்
  rationale: வம்ச உறவைக் குறிக்கும் construct தொடரை இயல்பான தமிழ் சொல் வரிசையில் தருகிறது.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: நல்ல முதிர்வயதில்
  rationale: שֵׂיבָה என்பது முதுமை அல்லது நரைமுதிர்ந்த வயதைக் குறிக்கிறது; טוֹבָה தரும் சாதகமான நுண்ணுணர்வை ‘நல்ல’ காக்கிறது.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டார்
  rationale: קבר வினையின் நிபால் வடிவிலுள்ள செயப்பாட்டு பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּקֶבֶר
  choice: கல்லறையில்
  rationale: קֶבֶר என்பது தனிக் குழியையோ கல்லறை/அடக்க இடத்தையோ குறிக்கலாம்; குடும்ப அடக்க இடம் என்ற சூழலில் ‘கல்லறை’ இயல்பானது, ஆனால் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יוֹאָשׁ אָבִיו
  choice: அவருடைய தந்தை யோவாசின்
  rationale: யோவாசை கிதியோனின் தந்தையாக அடையாளப்படுத்தி, தமிழ் உரிமைத் தொடரில் தெளிவாகத் தருகிறது.
- source_word: בְּעָפְרָה אֲבִי הָעֶזְרִי
  choice: அபியேசரியருக்குரிய ஒப்ராவில்
  rationale: ஒருமை வடிவிலுள்ள இனக்குழுப் பெயர் அபியேசரின் குலத்துக்குரிய ஒப்ராவைக் குறிக்கிறது; ஊர் பெயருடன் உள்ள குலத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
