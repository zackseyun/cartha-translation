translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் மரியாதையும் கொண்ட வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டிற்கு ஏற்றவாறு ‘கிதியோன்,’ ‘யோவாசு,’ ‘ஒப்ரா,’ ‘அபியேசரியர்’ என ஒலிபெயர்க்கப்பட்டுள்ளன; வசனத்தில் ‘யோவாசின்’ என்பது வேற்றுமை உருபால் இயல்பாக்கப்பட்டுள்ளது. இரு அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
