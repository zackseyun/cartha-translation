translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரெயத்தின் சுருக்கமான பங்கேற்புவினை அமைப்பு இயல்பான தமிழ் கதைநடைக்காக முழு வினை வடிவில் தரப்பட்டுள்ளது; சோர்வுக்கும் தொடரும் துரத்தலுக்கும் இடையிலான தொடர்பின் சிறிய தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
