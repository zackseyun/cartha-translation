  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּבֹ֥א גִדְע֖וֹן הַ/יַּרְדֵּ֑נָ/ה עֹבֵ֣ר ה֗וּא וּ/שְׁלֹשׁ מֵא֤וֹת הָ/אִישׁ֙ אֲשֶׁ֣ר אִתּ֔/וֹ עֲיֵפִ֖ים וְ/רֹדְפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/004.yaml
  text: Then Gideon came to the Jordan and crossed over[a], he and the three hundred men who were with him, exhausted yet pursuing.
translation:
  language: ta
  text: பின்பு கிதியோன் யோர்தானுக்கு வந்து அதைக் கடந்தார்; அவரும் அவரோடு இருந்த முந்நூறு பேரும் களைத்திருந்தும் தொடர்ந்து துரத்திச் சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “களைப்பாக இருந்தும் துரத்திக்கொண்டிருந்தார்கள்”; அல்லது, “சோர்வடைந்தவர்களாகவும் துரத்துகிறவர்களாகவும் இருந்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்து
  rationale: בוא என்பதன் இயல்பான வருகை/அடைதல் பொருளையும் யோர்தானை நோக்கிய கதை நகர்வையும் இயல்பான தமிழில் தருகிறது.
- source_word: הַיַּרְדֵּנָה
  choice: யோர்தானுக்கு
  rationale: திசையைக் குறிக்கும் ־ָה பின்னொட்டு யோர்தானை நோக்கிய நகர்வைக் காட்டுகிறது; ‘ஆறு’ என்பது சூழலில் உள்ளடங்கியிருப்பதால் சேர்க்கப்படவில்லை.
- source_word: עֹבֵר הוּא
  choice: அதைக் கடந்தார்; அவரும்
  rationale: பங்கேற்புவினையும் வலியுறுத்தும் הוּא என்பதும் கிதியோன் தாமே கடந்ததையும் அவரோடு குழுவினரும் சென்றதையும் தெளிவாகக் காட்டுகின்றன.
- source_word: וּשְׁלֹשׁ מֵאוֹת הָאִישׁ אֲשֶׁר אִתּוֹ
  choice: அவரோடு இருந்த முந்நூறு வீரர்களும்
  rationale: இராணுவச் சூழலில் הָאִישׁ என்பதை இயல்பான தமிழில் ‘வீரர்கள்’ என வழங்குவது ஆண்களைக் கொண்ட படைக்குழுவைக் குறிக்கிறது.
- source_word: עֲיֵפִים
  choice: களைத்திருந்தும்
  rationale: உடல் சோர்வை நவீன தமிழில் தெளிவாகக் கூறுகிறது; அடுத்த செயலோடு உள்ள எதிர்மறைத் தொடர்பை ‘இருந்தும்’ வெளிப்படுத்துகிறது.
- source_word: וְרֹדְפִים
  choice: தொடர்ந்து துரத்திச் சென்றார்கள்
  rationale: רֹדְפִים என்பது பின்தொடர்ந்து விரட்டுவதைச் சுட்டுகிறது; ‘தொடர்ந்து’ அவர்கள் களைப்பையும் மீறி வேட்டையை நிறுத்தவில்லை என்பதை இயல்பாகத் தெரிவிக்கிறது.
