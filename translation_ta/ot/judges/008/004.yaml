revisions:
- from: பின்பு கிதியோன் யோர்தானுக்கு வந்து அதைக் கடந்தார்; அவரும் அவரோடு இருந்த முந்நூறு வீரர்களும் களைத்திருந்தும் தொடர்ந்து துரத்திச் சென்றார்கள்.[a]
  to: பின்பு கிதியோன் யோர்தானுக்கு வந்து அதைக் கடந்தார்; அவரும் அவரோடு இருந்த முந்நூறு பேரும் களைத்திருந்தும் தொடர்ந்து துரத்திச் சென்றார்கள்.[a]
  rationale: The revision retains the source’s sequence and participial portrayal of exhaustion alongside pursuit, while replacing the interpretively stronger ‘வீரர்கள்’ with the neutral and natural ‘பேர்.’ The footnote is simplified to present viable Tamil renderings of the Hebrew wording and its syntactic nuance.
