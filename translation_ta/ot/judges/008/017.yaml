  yaml_path: translation/ot/judges/008/017.yaml
  text: He tore down the tower of Penuel and killed the men of the city[a].
translation:
  language: ta
  text: அவன் பெனுவேலின் கோபுரத்தை இடித்துப்போட்டு, அந்த நகரத்தின் ஆண்களைக் கொன்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'பெனுவேல்: மரபுவழியாக ‘பெனியேல்’ என்றும் எழுதப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְדַּל
  choice: கோபுரம்
  rationale: இச்சொல் பொதுவாக உயரமான அல்லது அரணமைப்புடைய கோபுரத்தைக் குறிக்கிறது; சூழலில் ‘கோபுரம்’ என்பது நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: פְּנוּאֵל
  choice: பெனுவேல்
  rationale: இங்குள்ள எபிரெய மெய்யெழுத்து வடிவத்தைப் பின்பற்றிய ஒலிபெயர்ப்பு; ‘பெனியேல்’ என்பது மரபில் காணப்படும் மாற்று வடிவம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: נָתָץ
  choice: இடித்துப்போட்டு
  rationale: கட்டடம் போன்ற ஒன்றை இடித்துத் தகர்ப்பதை இவ்வினைச்சொல் குறிக்கிறது; ‘இடித்துப்போட்டு’ என்பது அதன் வலிமையையும் தொடர்ந்த செயலுடன் உள்ள தொடர்பையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: וַיַּהֲרֹג
  choice: கொன்றான்
  rationale: הרג என்பதன் நேரடிப் பொருள் ‘கொல்லுதல்’; கூடுதல் படிமத்தைச் சேர்க்காமல் தெளிவாக மொழிபெயர்க்கப்படுகிறது.
- source_word: אַנְשֵׁי הָעִיר
  choice: அந்த நகரத்தின் ஆண்கள்
  rationale: இக்கட்டமைப்பு சொல்லுக்குச் சொல் ‘நகரத்தின் ஆண்கள்’ என்று பொருள்படும்; தண்டனை சார்ந்த இராணுவச் சூழலில் மூலத்தின் ஆண்பால் குறிப்பை பொதுமைப்படுத்தாமல் தக்கவைக்கிறது.
