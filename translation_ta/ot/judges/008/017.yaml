  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. தொடர்ச்சியான இரண்டு செயல்களை இயல்பாக இணைக்க ‘இடித்துப்போட்டு’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் வெளிப்படையான ஆண்பால் குறிப்பு தக்கவைக்கப்பட்டுள்ளது.
