  source_fidelity: 'மூல எபிரெயத்தின் இரண்டு தொடர்ச்சியான வினைச்செயல்களும் துல்லியமாகத் தரப்பட்டுள்ளன: பெனுவேலின் கோபுரத்தை இடித்தல்; நகரத்தின் ஆண்களைக் கொல்லுதல். מִגְדַּל என்பதற்கு ‘கோபுரம்,’ נָתָץ என்பதற்கு ‘இடித்துப்போட்டு,’ மற்றும் אַנְשֵׁי הָעִיר என்பதிலுள்ள வெளிப்படையான ஆண்பால் குறிப்பு ஆகியவை முறையாகப் பாதுகாக்கப்பட்டுள்ளன.'
