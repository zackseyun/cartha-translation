  register: நவீன பொதுத் தமிழில், வேதாகம உரைக்கேற்ற கண்ணியமான நடை. எபிரெய வாக்கியத்தின் தொடர்ச்சியையும் ‘அவளும்’ என்ற வலியுறுத்தலையும் காக்கிறது. தேவையற்ற குடியிருப்பு அல்லது உறவுநிலை விளக்கங்கள் சேர்க்கப்படவில்லை.
