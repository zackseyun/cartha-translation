  yaml_path: translation/ot/judges/008/031.yaml
  text: And his concubine who was in Shechem also bore him a son[a], and he named him Abimelek.
translation:
  language: ta
  text: சேகேமில் இருந்த அவனுடைய மறுமனையாட்டியும் அவனுக்கு ஒரு மகனைப் பெற்றாள்; அவன் அவனுக்கு அபிமெலேக்கு என்று பெயரிட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: அவனுடைய மறுமனையாட்டியும்
  rationale: פִּילֶגֶשׁ என்பது முழு மனைவியிலிருந்து சமூக மற்றும் சட்ட நிலைமையில் வேறுபட்ட துணைவியைக் குறிக்கிறது. ‘மறுமனையாட்டி’ என்பது தமிழில் நேரடியான, மரியாதையான வேறுபாட்டைக் காக்கிறது; וּ மற்றும் பின்னுள்ள גַם הִיא ஆகியவற்றின் இணைந்த கருத்தை ‘-உம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר בִּשְׁכֶם
  choice: சேகேமில் இருந்த
  rationale: இவ்வுறவுச் சொற்றொடர் அவளைக் குறிப்பிட்ட இடத்தால் அடையாளப்படுத்துகிறது. ‘வாழ்ந்த’ என்று மொழிபெயர்ப்பது மூலத்தில் வெளிப்படையாக இல்லாத நிரந்தர வசிப்பிடக் கருத்தைச் சேர்க்கும்.
- source_word: יָלְדָה לּוֹ
  choice: அவனுக்கு ... பெற்றாள்
  rationale: יַלד உடன் வரும் לּוֹ, அவள் அவனுக்கு ஒரு குழந்தையைப் பெற்றாள் என்ற பொருளைத் தருகிறது; தமிழில் இது இயல்பாக இவ்வாறு அமைகிறது.
- source_word: גַם הִיא
  choice: -உம்
  rationale: ‘அவளும்’ என்ற தமிழ்ச் சேர்க்கை, மற்ற பெண்களைப்போல இவளும் ஒரு மகனைப் பெற்றாள் என்ற மூலத்தின் வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: בֵּן
  choice: ஒரு மகனை
  rationale: இங்கு பெயர்ச்சொல் குறிப்பிட்ட முன் அறிமுகமில்லாத மகனைச் சுட்டுவதால் தமிழில் ‘ஒரு மகனை’ இயல்பானது.
- source_word: וַיָּשֶׂם אֶת־שְׁמוֹ
  choice: அவன் அவனுக்கு ... என்று பெயரிட்டான்
  rationale: எபிரெய idiom-இன் சொற்படியான ‘அவனுடைய பெயரை வைத்தான்’ என்பதற்குப் பதிலாக, அதன் பொருளைத் தெளிவாகவும் இயல்பாகவும் தரும் தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲבִימֶלֶךְ
  choice: அபிமெலேக்கு
  rationale: எபிரெய உச்சரிப்பான ʾĂḇîmeleḵ-ஐ நெருக்கமாகக் காட்டும் தமிழ் ஒலிபெயர்ப்பு; இறுதி ךְ-இன் மெய்யொலியையும் வாசிக்கத்தக்க தமிழில் பிரதிபலிக்கிறது.
