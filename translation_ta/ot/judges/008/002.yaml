source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם מֶה עָשִׂ֥יתִי עַתָּ֖ה כָּ/כֶ֑ם הֲ/ל֗וֹא ט֛וֹב עֹלְל֥וֹת אֶפְרַ֖יִם מִ/בְצִ֥יר אֲבִיעֶֽזֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/002.yaml
  text: But he said to them[a], “What have I done now compared to you? Are not the gleanings of Ephraim better than the grape harvest of Abiezer?”
translation:
  language: ta
  text: அதற்கு அவர் அவர்களிடம், “உங்களோடு ஒப்பிட்டால் இப்போது நான் செய்தது என்ன? அபியேசரின் திராட்சை அறுவடையைவிட எப்பிராயீமின் மீதித் திராட்சைப் பொறுக்குதல் சிறந்ததல்லவா?” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: அதற்கு அவர் அவர்களிடம் ... என்றார்
  rationale: வாவ் தொடர்கதைச் செயலை முன்னெடுக்கிறது; முந்தைய குற்றச்சாட்டுக்கு கிதியோன் பதிலளிக்கும் எதிர்வினைச் சூழலை ‘அதற்கு’ இயல்பாக வெளிப்படுத்துகிறது. אֲלֵיהֶם என்பது ‘அவர்களிடம்’.
- source_word: מֶה עָשִׂיתִי עַתָּה כָּכֶם
  choice: உங்களோடு ஒப்பிட்டால் இப்போது நான் செய்தது என்ன?
  rationale: כ இங்கு ஒப்பீட்டைக் குறிக்கிறது. கிதியோன் தன் சாதனையை அவர்களுடையதைக் காட்டிலும் சிறியதாகச் சொல்லும் வினாவை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: הֲלוֹא טוֹב
  choice: சிறந்ததல்லவா?
  rationale: הֲלוֹא உடன்பாட்டை எதிர்பார்க்கும் வினாவைக் குறிக்கிறது; מן உடனான טוֹב ஒப்பீட்டுப் பொருளில் ‘சிறந்தது’ என வருகிறது.
- source_word: עֹלְלוֹת אֶפְרַיִם
  choice: எப்பிராயீமின் மீதித் திராட்சைப் பொறுக்குதல்
  rationale: עֹלְלוֹת என்பது முதன்மை அறுவடைக்குப் பின் எஞ்சிய திராட்சைகளைப் பொறுக்குவதைக் குறிக்கிறது. ‘மீதித் திராட்சைப் பொறுக்குதல்’ திராட்சைத்தோட்ட உருவகத்தையும் அறுவடைக்குப் பிந்தைய தன்மையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מִבְצִיר אֲבִיעֶזֶר
  choice: அபியேசரின் திராட்சை அறுவடையைவிட
  rationale: בְצִיר என்பது திராட்சை அறுவடை; முன்னொட்டு מִן ஒப்பீட்டை (‘விட’) குறிக்கிறது. אֲבִיעֶזֶר கிதியோனின் குலப்பெயர்.
