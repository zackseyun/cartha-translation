  register: நவீனத் தரத் தமிழ்; கண்ணியமான நேரடி உரையாடல். மூலத்தின் இலக்கண வடிவத்தைவிட சூழலும் பதிலின் தன்மையும் ஆதரிக்கும் பொருளுக்கு முன்னுரிமை அளிக்கப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கில அடிக்குறி குறியீடுகளும் அவற்றின் உரைகளும் ஒன்றோடொன்று பொருந்தாததால் அவை ஆதாரமின்றி சேர்க்கப்படவில்லை.
