  text: וַ/יֹּ֗אמֶר אֶל זֶ֨בַח֙ וְ/אֶל צַלְמֻנָּ֔ע אֵיפֹה֙ הָ/אֲנָשִׁ֔ים אֲשֶׁ֥ר הֲרַגְתֶּ֖ם בְּ/תָב֑וֹר וַֽ/יֹּאמרוּ֙ כָּמ֣וֹ/ךָ כְמוֹ/הֶ֔ם אֶחָ֕ד כְּ/תֹ֖אַר בְּנֵ֥י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/018.yaml
  text: Then he said to Zebah and Zalmunna[a], “Where are the men whom you killed at Tabor?” And they said, “As you are, so were they[b]; each one had the appearance of the sons of a king.”
translation:
  language: ta
  text: பின்பு அவன் சேபாவையும் சல்முன்னாவையும் நோக்கி, “தாபோரில் நீங்கள் கொன்ற அந்த ஆண்கள் எங்கே?” என்று கேட்டான். அதற்கு அவர்கள், “அவர்கள் உன்னைப் போலவே இருந்தார்கள்; ஒவ்வொருவரும் அரசனின் மகன்களைப் போன்ற தோற்றமுடையவர்களாய் இருந்தார்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵיפֹה
  choice: எப்படிப்பட்டவர்கள்
  rationale: אֵיפֹה பொதுவாக இடத்தை வினவும் சொல். ஆனால் கொல்லப்பட்டவர்கள் இனி எங்கே உள்ளனர் என்பது கேள்வியாக இருக்க முடியாததால், இச்சூழலில் ‘எப்படிப்பட்டவர்கள்?’ என்ற அரிதான பண்புவினாப் பொருள் இயல்பாகிறது; தொடர்ந்து வரும் பதிலும் அவர்களின் தோற்றத்தையே விவரிக்கிறது.
- source_word: הָאֲנָשִׁים
  choice: ஆண்கள்
  rationale: இங்கு அடையாளம் காணக்கூடிய ஆண் பலியாளர்களைக் குறிக்கிறது; பொதுவான ‘மனிதர்கள்’ என்பதைவிட ‘ஆண்கள்’ துல்லியமானது.
- source_word: הֲרַגְתֶּם
  choice: நீங்கள் கொன்ற
  rationale: வினையின் அடிப்படைப் பொருள் ‘கொல்லுதல்’; ‘படுகொலை செய்த’ போன்ற சட்ட அல்லது அற மதிப்பீட்டைச் சேர்க்கவில்லை.
- source_word: בְּתָבוֹר
  choice: தாபோரில்
  rationale: בְּ இங்கு இடத்தைக் குறிக்கிறது. எபிரெயப் பெயரை விரிவாக்காமல் இயல்பான தமிழ் இடவேற்றுமையில் தருகிறது.
- source_word: כָּמוֹךָ כְמוֹהֶם
  choice: அவர்கள் உன்னைப் போலவே இருந்தார்கள்
  rationale: எபிரெய மொழியின் சுருக்கமான, நீள்வட்ட ஒப்பீட்டைத் தெளிவான தமிழில் தருகிறது; அவர்கள் கிதியோனோடு ஒப்பிடப்படுகிறார்கள்.
- source_word: אֶחָד
  choice: ஒவ்வொருவரும்
  rationale: பன்மைக் குழுவிலுள்ள ஒவ்வொரு நபரையும் பகிர்ந்தளிக்கும் பொருளில் குறிக்கிறது.
- source_word: כְּתֹאַר
  choice: போன்ற தோற்றமுடையவர்களாய்
  rationale: תֹּאַר என்பது உருவம் அல்லது வெளித்தோற்றத்தைக் குறிக்கும்; தற்போதைய தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: அரசனின் மகன்கள்
  rationale: அரச குமாரருக்குரிய தோற்றத்தைச் சுட்டும் எபிரெயச் சொற்றொடரைப் பாதுகாக்கிறது; விளக்கமளிக்கும் ‘இளவரசர்கள்’ என்று மாற்றவில்லை.
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: கேட்டான் ... என்றார்கள்
  rationale: முதல் உரை கேள்வி என்பதால் தமிழில் ‘கேட்டான்’ இயல்பானது; இரண்டாவது உரைக்கு நடுநிலையான ‘என்றார்கள்’ பயன்படுத்தப்படுகிறது.
