  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெய உரையிலுள்ள ‘பாளயம்’ என்ற சொல்லின் மீளுரைத்தல் பேணப்பட்டுள்ளது; בֶטַח என்பதிலுள்ள பாதுகாப்பு/கவலையின்மை சார்ந்த பொருள் வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
