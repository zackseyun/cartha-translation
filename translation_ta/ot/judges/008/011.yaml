base_translation:
  language: en
  yaml_path: translation/ot/judges/008/011.yaml
  text: Then Gideon went up by the route of those who dwell in tents[a], east of Nobah and Jogbehah, and struck the camp while the camp was unsuspecting.
translation:
  language: ta
  text: பின்பு கிதியோன் நோபாகுக்கும் யொக்பெகாவுக்கும் கிழக்கே இருந்த கூடாரவாசிகளின் பாதையில் ஏறிச் சென்று, பாளயத்தைத் தாக்கினான்; அந்தப் பாளயம் எச்சரிக்கையின்றி இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாதுகாப்பாக இருந்தது.” எபிரெயச் சொல் பாதுகாப்பு அல்லது நம்பிக்கையுடன் இருக்கும் நிலையைக் குறிக்கலாம்; இங்கு பாளயம் எச்சரிக்கையின்றி இருந்தது என்பதையும் உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ஏறிச் சென்று
  rationale: עלה என்பதன் அடிப்படை இயக்கப் பொருளான ‘மேலே செல்/ஏறிச் செல்’ என்பதைப் பேணுகிறது; இதைத் தனியாக ‘படையெடுத்துச் சென்றான்’ என்று விளக்கி விடவில்லை.
- source_word: דֶּרֶךְ הַשְּׁכוּנֵי בָאֳהָלִים
  choice: கூடாரங்களில் குடியிருப்பவர்களின் வழியாக
  rationale: கூடாரங்களில் வாழும் மக்களை நேரடியாகக் குறிக்கும் எபிரெய சொற்றொடரைத் தெளிவாக வழங்குகிறது; ‘நாடோடிகள்’ என்ற கூடுதல் சமூக விளக்கத்தைப் புகுத்தவில்லை.
- source_word: מִקֶּדֶם לְנֹבַח וְיָגְבֳּהָה
  choice: நோபாகுக்கும் யொக்பெகாவுக்கும் கிழக்கே
  rationale: இங்கு קדם இடவியல் சார்ந்து அந்த இரு இடங்களுக்கும் கிழக்கிலுள்ள பகுதியைக் குறிக்கிறது.
- source_word: וַיַּךְ אֶת־הַמַּחֲנֶה
  choice: அந்தப் பாளயத்தைத் தாக்கினான்
  rationale: נכה என்பதன் இராணுவச் சூழலுக்குரிய தாக்குதல் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; தாக்குதலின் முடிவை ‘தோற்கடித்தான்’ என்று முன்கூட்டியே நிர்ணயிக்கவில்லை.
- source_word: בֶטַח
  choice: கவலையின்றி இருந்தது
  rationale: பாதுகாப்பு அல்லது நம்பிக்கையால் அச்சமின்றி இருக்கும் நிலையைச் சுட்டுகிறது; இராணுவச் சூழலில் எச்சரிக்கையற்ற நிலையையும் உணர்த்துகிறது, ஆனால் அந்தப் பொருளை மட்டும் கட்டாயப்படுத்தவில்லை.
