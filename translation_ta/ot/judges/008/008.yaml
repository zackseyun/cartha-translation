  naturalness: மொத்தத்தில் நடை நவீனத் தரமான தமிழாக உள்ளது. ஆனால் ‘சுக்கோத்தின் ஆண்கள் பதிலளித்தது போலவே’ இலக்கண இயல்புக்கு மாறானது; ‘பதிலளித்தார்களோ’ அல்லது ‘பதிலளித்ததுபோலவே’ என்பதற்குப் பதிலாக மனிதப் பன்மைக்கு ஏற்ற வடிவம் தேவை. ‘மேலே சென்றான்’ இச்சூழலில் இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது.
