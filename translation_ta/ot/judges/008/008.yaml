base_translation:
  language: en
  yaml_path: translation/ot/judges/008/008.yaml
  text: From there he went up to Penuel and spoke to them in the same way[b][a], and the men of Penuel answered him just as the men of Succoth had answered.
translation:
  language: ta
  text: அங்கிருந்து அவன் பெனூவேலுக்கு மேலே சென்று,[b] அவர்களிடமும் இவ்வாறே பேசினான்.[a] பெனூவேலின் ஆண்கள் அவனுக்குப் பதிலளித்தார்கள்; சுக்கோத்தின் ஆண்கள் பதிலளித்தார்களோ அப்படியே பதிலளித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “அவர்களிடம் இவ்வாறு பேசினான்.” இது முந்தைய வசனத்தில் கூறப்பட்ட அதே வகையான வேண்டுகோளை அல்லது பேச்சைச் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: பெனூவேல் என்ற பெயர் வேறு இடங்களில் “பெனியேல்” என்றும் எழுதப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל מִשָּׁם
  choice: அங்கிருந்து ... சென்று
  rationale: עלה என்பதில் மேலே செல்லுதல் என்ற திசைநுட்பம் இருக்கலாம்; ஆனால் தமிழில் இச்சூழலில் இயல்பாக ஒலிக்கவும், உரையில் உறுதியாகத் தெரியாத நிலவியல் விளக்கத்தைத் திணிக்காமல் இருக்கவும் ‘சென்று’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: פְּנוּאֵל
  choice: பெனூவேல்
  rationale: இவ்வசனத்தின் எபிரெய் மெய்யெழுத்து வடிவத்தை ஒட்டி இடப்பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיְדַבֵּר אֲלֵיהֶם כָּזֹאת
  choice: அவர்களிடமும் அதே விதமாகப் பேசினான்
  rationale: சொல்லுக்குச் சொல் ‘இவ்வாறு அவர்களிடம் பேசினான்’; முந்தைய வசனத்தில் கூறப்பட்ட அதே வேண்டுகோளை இங்கு சுட்டுவதால், அதன் பின்னோக்குச் சுட்டும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיַּעֲנוּ אוֹתוֹ
  choice: அவனுக்குப் பதிலளித்தார்கள்
  rationale: ענה இங்கு ஒருவருக்குப் பதில் கூறுவதைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: אַנְשֵׁי פְנוּאֵל
  choice: பெனூவேலின் ஆண்கள்
  rationale: אַנְשֵׁי என்பது குறிப்பாக ‘ஆண்கள்’ எனும் ஆண்பால் சமூகக் குறிப்பைக் கொண்டிருப்பதால் அதை பொதுவான ‘மக்கள்’ என்று மாற்றவில்லை.
- source_word: כַּאֲשֶׁר עָנוּ אַנְשֵׁי סֻכּוֹת
  choice: சுக்கோத்தின் ஆண்கள் பதிலளித்தது போலவே
  rationale: כַּאֲשֶׁר குறிக்கும் ஒப்பீட்டை ‘போலவே’ தெளிவாக வெளிப்படுத்துகிறது; தமிழ் வாக்கிய அமைப்பே அந்தப் பதில் முன்னதாக நிகழ்ந்ததை உணர்த்துகிறது.
- source_word: סֻכּוֹת
  choice: சுக்கோத்
  rationale: எபிரெய் இடப்பெயரின் ஒலியை நவீனத் தமிழில் நெருக்கமாகக் காட்டும் ஒலிபெயர்ப்பு.
