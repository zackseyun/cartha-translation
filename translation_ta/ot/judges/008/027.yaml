base_translation:
  language: en
  yaml_path: translation/ot/judges/008/027.yaml
  text: Gideon made it into an ephod and set it up in his city[a], in Ophrah. And all Israel prostituted themselves after it there[b], and it became a snare to Gideon and to his house.
translation:
  language: ta
  text: கிதியோன் அதை ஓர் ஏபோதாகச் செய்து, தன் ஊரான ஒப்ராவில் அதை நிறுத்திவைத்தார்[a]. இஸ்ரவேலர் அனைவரும் அங்கே அதைத் பின்பற்றி வேசித்தனம் செய்தார்கள்[b]. அது கிதியோனுக்கும் அவருடைய வீட்டாருக்கும் ஒரு கண்ணியாக ஆனது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஏபோத்’ என்பது ஆசாரியப் பயன்பாட்டோடு தொடர்புடைய ஒரு வழிபாட்டுப் பொருள் அல்லது உடை. இங்கே அதன் துல்லிய வடிவத்தையோ பயன்பாட்டையோ உரை முழுமையாகக் குறிப்பிடவில்லை.
    reason: cultural_note
  - marker: b
    text: ‘வேசித்தனம் செய்தார்கள்’ என்பது நேரடியான பாலியல் உருவகத்தைப் பயன்படுத்தி, இஸ்ரவேலர் விக்கிரக வழிபாட்டில் ஈடுபட்டு கடவுளுக்கு உண்மையற்றவர்களானதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֵפוֹד
  choice: ஓர் ஏபோத்தை
  rationale: 'לְ உடன் வரும் עשה இங்கு விளைவைக் குறிக்கிறது: பொன் ஏபோத் எனப்படும் ஒன்றாகச் செய்யப்பட்டது. ஏபோத்தின் துல்லிய வடிவத்தையோ பயன்பாட்டையோ உரை குறிப்பிடாததால் பெயர் ஒலிபெயர்க்கப்பட்டது.'
- source_word: וַיַּצֵּג
  choice: நிறுவினார்
  rationale: ஒரு பொருளை நிறுத்தி வைப்பது அல்லது நிலைநிறுத்துவது என்ற காரணவினைப் பொருளை இயல்பான தமிழில் தருகிறது; வெறும் அலங்காரக் காட்சியாக இருந்தது என்று மிகையாக விளக்கவில்லை.
- source_word: בְעִירוֹ בְעָפְרָה
  choice: தன் ஊரான ஒப்ராவில்
  rationale: עִיר என்பது குடியிருப்பிடம் அல்லது நகரத்தைக் குறிக்கலாம். ஒப்ராவைக் குறிப்பிடும் இச்சூழலில், நவீன தமிழில் இயல்பாகவும் அளவை மிகைப்படுத்தாமலும் இருக்க ‘ஊர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיִּזְנוּ ... אַחֲרָיו
  choice: அதன் பின்னால் வேசித்தனம் செய்தார்கள்
  rationale: זנה விக்கிரக வழிபாட்டை பாலியல் துரோக உருவகத்தால் சித்தரிக்கிறது. ‘வேசித்தனம் செய்தார்கள்’ அந்தக் கடுமையான உருவகத்தை மென்மைப்படுத்தாமல் காக்கிறது; ‘அதன் பின்னால்’ என்பது ஏபோத்தைத் தொடர்ந்து நாடியதைக் காட்டுகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: இஸ்ரவேலின் வழிபாட்டுத் துரோகம் குறிப்பாக ஒப்ராவில் நிகழ்ந்ததைச் சுட்டுவதால் தக்கவைக்கப்பட்டது.
- source_word: לְמוֹקֵשׁ
  choice: ஒரு கண்ணியாக
  rationale: מוֹקֵשׁ என்பது பிடித்து வீழ்த்தும் கண்ணி; பாவத்திற்கும் அழிவிற்கும் இட்டுச்செல்லும் அபாய உருவகத்தை ‘கண்ணி’ காக்கிறது.
- source_word: וּלְבֵיתוֹ
  choice: அவருடைய வீட்டாருக்கும்
  rationale: בַּיִת இங்கு கட்டிடத்தைவிட கிதியோனின் குடும்பம் அல்லது வம்ச வீட்டைக் குறிக்கிறது. ‘வீட்டார்’ தமிழில் அந்த மனிதக் குழுவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ஏபோத்தை நாடிய இஸ்ரவேலரின் விக்கிரக வழிபாட்டை எவ்வாறு மொழிபெயர்ப்பது
  choice: பாலியல் துரோக உருவகத்தைத் தெளிவாகக் காத்து ‘அதன் பின்னால் வேசித்தனம் செய்தார்கள்’ என மொழிபெயர்த்தல்
  alternative: ‘அதன் பின்னால் வழிதவறிச் சென்றார்கள்’ அல்லது ‘அதற்கு உண்மையற்றவர்களானார்கள்’
  rationale: எபிரெய זנה உடன்படிக்கை மற்றும் வழிபாட்டு துரோகத்தை வேசித்தன உருவகத்தால் கூறுகிறது. பொதுவான கீழ்ப்படியாமையாக அதை மென்மைப்படுத்தாமல் உரையின் இறையியல் தீவிரம் காக்கப்படுகிறது.
- issue: கிதியோன் செய்த ஏபோத்தின் இயல்பு
  choice: அதன் துல்லிய வடிவத்தையோ பணியையோ நிர்ணயிக்காமல் ‘ஏபோத்’ என்றே வழங்குதல்
  alternative: ‘ஆசாரிய உடை’, ‘சிலை’ அல்லது ‘குறிகேட்கும் புனிதப் பொருள்’
  rationale: உரை பொருளுக்கு ஏபோத் என்று பெயரிடுகிறது; அது உடையா, சிலையா, குறிகேட்கும் பொருளா என்பதை முழுமையாக விளக்கவில்லை. எனவே உண்மையான தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘ஏபோத்’ தொழில்நுட்பச் சொல்லாக ஒலிபெயர்க்கப்பட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது. எபிரெய உரையின் கடுமையான வேசித்தன உருவகமும் ‘கண்ணி’ உருவகமும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்கு உடனடியாக வைக்கப்பட்டுள்ளன.
