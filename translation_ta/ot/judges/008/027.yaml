- from: கிதியோன் அதைக் கொண்டு ஓர் ஏபோத்தைச் செய்து, தன் ஊரான ஒப்ராவில் அதை நிறுவினார். இஸ்ரவேலர் அனைவரும் அங்கே அதன் பின்னால் வேசித்தனம் செய்தார்கள்[a]. அது கிதியோனுக்கும் அவருடைய வீட்டாருக்கும் ஒரு கண்ணியாக ஆனது.[b]
  to: கிதியோன் அதை ஓர் ஏபோதாகச் செய்து, தன் ஊரான ஒப்ராவில் அதை நிறுத்திவைத்தார்[a]. இஸ்ரவேலர் அனைவரும் அங்கே அதைத் பின்பற்றி வேசித்தனம் செய்தார்கள்[b]. அது கிதியோனுக்கும் அவருடைய வீட்டாருக்கும் ஒரு கண்ணியாக ஆனது.
  rationale: எபிரெய வினைச்சொல் அமைப்பின் விளைவுப் பொருளை ‘அதை ஓர் ஏபோதாகச் செய்து’ எனத் தெளிவுபடுத்தினேன். וַיַּצֵּג-இன் நிறுவி வைக்கும் கருத்தை ‘நிறுத்திவைத்தார்’ என வழங்கினேன். זנה உருவகத்தைத் தளர்த்தாமல், தமிழில் இயல்பாக அமைய ‘அதைத் பின்பற்றி வேசித்தனம் செய்தார்கள்’ என மாற்றினேன். இரண்டு அடிக்குறிப்புகளும் அவை விளக்கும் சொற்களுக்கு உடனடியாக இணைக்கப்பட்டுள்ளன.
