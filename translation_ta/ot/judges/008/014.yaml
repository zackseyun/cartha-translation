translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. தொடர் வினைகளில் எழுவன் மாறுவதால் ஏற்படக்கூடிய குழப்பத்தைத் தவிர்க்க ‘அந்த இளைஞன்’ மீண்டும் வெளிப்படையாகக் குறிப்பிடப்பட்டது. அதிகாரிகளும் மூப்பர்களும் சேர்த்து எழுபத்தேழு பேர் என்ற தொடர்பை இடைக்கோடுகள் மூலம் தெளிவாக்கினாலும், மூலத்தின் தகவல் வரம்பு மீறப்படவில்லை.
