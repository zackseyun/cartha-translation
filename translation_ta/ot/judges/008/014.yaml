base_translation:
  language: en
  yaml_path: translation/ot/judges/008/014.yaml
  text: And he captured a young man from the men of Succoth and questioned him[a], and he wrote down for him the officials of Succoth and its elders, seventy-seven men.
translation:
  language: ta
  text: அவன் சுக்கோத்தைச் சேர்ந்தவர்களில் ஓர் இளைஞனைப் பிடித்து, அவனிடம் விசாரித்தான். அந்த இளைஞன் சுக்கோத்தின் அதிகாரிகளையும்[a] அதன் மூப்பர்களையும்—மொத்தம் எழுபத்தேழு பேரை—அவனுக்காகப் பட்டியலிட்டு எழுதிக் கொடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘தலைவர்களையும்’; இதற்கான எபிரெயச் சொல் அதிகாரிகள், தலைவர்கள் அல்லது ஆட்சியாளர்கள் எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכָּד
  choice: பிடித்து
  rationale: לכד என்பது பிடித்தல் அல்லது கைப்பற்றுதல் என்று பொருள்படும். இங்கு தகவல் பெறுவதற்காக ஒருவரைக் கட்டுப்பாட்டுக்குள் கொண்டுவரும் நிகழ்ச்சிக்கு ‘பிடித்து’ இயல்பாகப் பொருந்துகிறது.
- source_word: נַעַר
  choice: ஓர் இளைஞன்
  rationale: נַעַר என்பது சிறுவன், இளைஞன், பணியாள் எனச் சூழலுக்கேற்ப பொருள்படலாம். இவன் நகரத் தலைவர்களை அடையாளம் காட்டும் திறனுடையவன் என்பதால், வயதையோ பணிநிலையையோ மிகையாகக் குறிக்காத ‘இளைஞன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מֵאַנְשֵׁי סֻכּוֹת
  choice: சுக்கோத்தைச் சேர்ந்தவர்களில்
  rationale: מן முன்னிடைச்சொல் ஒரு குழுவிலிருந்து தேர்ந்தெடுக்கப்பட்ட ஒருவரைக் குறிக்கிறது. இந்தத் தமிழ் வடிவம் அந்த இளைஞன் சுக்கோத்து மக்களில் ஒருவன் என்பதைக் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיִּשְׁאָלֵהוּ
  choice: அவனிடம் விசாரித்தான்
  rationale: שׁאל என்பது கேட்பது அல்லது விசாரிப்பது. இராணுவச் சூழலில் நோக்கமுடைய கேள்வியைக் குறிக்க ‘விசாரித்தான்’ பொருத்தமானது; அதேவேளையில் துன்புறுத்தலுடன் கூடிய விசாரணை என்று பொருள் சேர்க்கவில்லை.
- source_word: וַיִּכְתֹּב אֵלָיו
  choice: அவனுக்காகப் பட்டியலிட்டு எழுதிக் கொடுத்தான்
  rationale: இங்கே எழுதுபவன் பிடிக்கப்பட்ட இளைஞன்; אֵלָיו கிதியோனுக்காக அல்லது அவரிடம் எழுதிக் கொடுத்ததைக் குறிக்கிறது. எபிரெய மொழியில் மனிதர்களையே ‘எழுதினான்’ என்று வரும் சுருக்கமான அமைப்பை, தமிழில் புரியும்படி ‘பட்டியலிட்டு எழுதிக் கொடுத்தான்’ என வழங்குகிறது.
- source_word: שָׂרֵי סֻכּוֹת
  choice: சுக்கோத்தின் அதிகாரிகள்
  rationale: שָׂרִים என்பது ஆட்சியாளர்கள், தலைவர்கள் அல்லது அதிகாரிகளைக் குறிக்கலாம். நகர நிர்வாகச் சூழலில் ‘அதிகாரிகள்’ பொருத்தமானது; நவீன தமிழில் தவறாக அரச மரபை உணர்த்தக்கூடிய ‘இளவரசர்கள்’ தவிர்க்கப்பட்டது.
- source_word: זְקֵנֶיהָ
  choice: அதன் மூப்பர்கள்
  rationale: பெண்பால் ஒருமை பின்னொட்டு சுக்கோத்து நகரத்தைக் குறிக்கிறது. ‘மூப்பர்கள்’ என்பது வயதானவர்களை மட்டும் அல்லாமல் அங்கீகரிக்கப்பட்ட சமூகத் தலைவர்களையும் குறிக்கும் வேதாகமச் சூழலுக்கு ஏற்றது.
- source_word: שִׁבְעִים וְשִׁבְעָה אִישׁ
  choice: மொத்தம் எழுபத்தேழு பேர்
  rationale: எபிரெய எண்ணிக்கை நேரடியாக எழுபத்தேழு ஆண்களைக் குறிக்கிறது. முன் குறிப்பிடப்பட்ட அதிகாரிகளும் மூப்பர்களும் சேர்ந்த மொத்த எண்ணிக்கை என்பது தமிழில் தெளிவாக அமைய ‘மொத்தம்’ சேர்க்கப்பட்டது.
