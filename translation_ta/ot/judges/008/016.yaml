  yaml_path: translation/ot/judges/008/016.yaml
  text: Then he took the elders of the city[a], and thorns of the wilderness and briers, and with them he disciplined the men of Succoth.
translation:
  language: ta
  text: பின்பு அவன் நகரத்தின் மூப்பர்களையும் பாலைநிலத்து முட்செடிகளையும் முட்புதர்களையும் எடுத்துக்கொண்டு, அந்த முட்செடிகளாலும் முட்புதர்களாலும் சுக்கோத்தின் ஆண்களுக்குப் பாடம் புகட்டினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடர் பொருள் காண்பதற்குக் கடினமானது. இதை, ‘அந்த முட்செடிகளாலும் முட்புதர்களாலும் சுக்கோத்தின் ஆண்களைத் தண்டித்தான்’ என்றும் மொழிபெயர்க்கலாம்; சாதாரண அறிவுறுத்தலைவிடக் கடுமையான தண்டனை நடவடிக்கையே இங்கு குறிக்கப்படுகிறது என்று சிலர் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעִיר
  choice: நகரத்தின் மூப்பர்கள்
  rationale: זִקְנֵי என்பது நகர நிர்வாகத்தில் அதிகாரம் வகித்த ‘மூப்பர்களை’க் குறிக்கிறது. ‘தலைவர்கள்’ என்பதைவிட ‘மூப்பர்கள்’ என்பது சமூக-அரசியல் பட்டத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: பாலைநிலத்து முட்செடிகள்
  rationale: இச்சொற்றொடர் பாலைநிலத்தில் வளரும் முள்ளுள்ள செடிகளைக் குறிக்கிறது; இயற்கையான தமிழில் அதன் தெளிவான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: הַבַּרְקֳנִים
  choice: முட்புதர்கள்
  rationale: துல்லியமான தாவரவகை உறுதியல்லாததால், குத்தும் தன்மையுள்ள செடிகளைக் குறிக்கும் பொதுவான சொல்லாக ‘முட்புதர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיֹּדַע בָּהֶם
  choice: அவற்றால் … பாடம் புகட்டினான்
  rationale: ידע என்பதன் ஹிஃபில் வடிவம் வழக்கமாக ‘அறியச் செய்தான்’ என்று பொருள்படும்; இங்கு முட்செடிகளைக் கொண்டு செய்யப்பட்ட தண்டனை நடவடிக்கையைச் சுட்டும் கடினமான சொற்றொடர். ‘பாடம் புகட்டினான்’ என்பது அறிவுறுத்தல் என்ற அடிப்படை நிழலையும் தண்டனைச் சூழலையும் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: சுக்கோத்தின் ஆண்கள்
  rationale: אַנְשֵׁי என்பது இலக்கணரீதியாக ஆண்பால் பன்மை; ஆகவே பொதுவான ‘மக்கள்’ என்பதற்குப் பதிலாக ‘ஆண்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
