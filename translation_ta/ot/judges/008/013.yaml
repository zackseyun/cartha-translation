  yaml_path: translation/ot/judges/008/013.yaml
  text: Then Gideon son of Joash returned from the battle by the ascent of Heres[a].
translation:
  language: ta
  text: அப்போது யோவாசின் மகன் கிதியோன் போரிலிருந்து ஏரேஸ் ஏற்றப்பாதை வழியாகத் திரும்பிவந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சூரியன் மேலேறுவதற்கு முன்.” எபிரெயச் சொற்றொடர் கடினமானது; הֶחָרֶס என்பதை ‘ஏரேஸ்’ என்ற இடப்பெயராகவோ ‘சூரியன்’ என்ற பொருளிலோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: அப்போது ... திரும்பிவந்தான்
  rationale: שוב என்பதன் தொடர்கதை இறந்தகால வடிவம் நிகழ்வை முன்னெடுக்கிறது. ‘திரும்பிவந்தான்’ அதன் இயல்பான பொருளையும், ‘அப்போது’ எபிரெயக் கதைத் தொடர்ச்சியையும் நவீன தமிழில் வெளிப்படுத்துகின்றன.
- source_word: גִּדְעוֹן
  choice: கிதியோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவம்.
- source_word: בֶּן יוֹאָשׁ
  choice: யோவாசின் மகன்
  rationale: எபிரெயத் தந்தைவழி அடையாளக் கட்டமைப்பை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: מִן הַמִּלְחָמָה
  choice: போரிலிருந்து
  rationale: מִלְחָמָה என்பது போர் அல்லது போர்ச்சண்டையைக் குறிக்கலாம்; இங்குள்ள குறிப்பிட்ட படை நடவடிக்கையின் சூழலில் ‘போரிலிருந்து’ இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: מִלְמַעֲלֵה
  choice: மேட்டுவழியாக
  rationale: מַעֲלֶה என்பது ஏற்றம், மேலேறும் பாதை, அல்லது மேடு வழியைக் குறிக்கும். இங்கு திரும்பிய வழித்தடத்தைக் காட்டும் வகையில் ‘மேட்டுவழியாக’ இயல்பான தமிழில் நிலவியல் உணர்வைப் பேணுகிறது.
- source_word: הֶחָרֶס
  choice: ஏரேஸ்
  rationale: இச்சொல் ஓர் இடப்பெயராக இருக்கக்கூடும் என்பதால் முதன்மை உரையில் ஒலிபெயர்க்கப்பட்டுள்ளது. ‘சூரியன்’ என்ற சொற்பொருள் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
