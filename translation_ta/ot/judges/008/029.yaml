    issue: “புறப்பட்டுச் சென்று” over-specifies וַיֵּלֶךְ.
    rationale: The Hebrew narrative verb means “went”; it does not explicitly state that Jerubbaal set out or departed. Removing “புறப்பட்டு” preserves the source’s unmarked directionality and avoids interpretive expansion.
