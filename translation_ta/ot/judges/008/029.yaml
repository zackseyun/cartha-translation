  text: Then Jerubbaal son of Joash went and lived in his house[a].
translation:
  language: ta
  text: பின்பு, யோவாசின் மகன் யெருபாகால் சென்று தன் வீட்டில் குடியிருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் வீட்டில் வசித்தான்”; அல்லது, “தன் வீட்டில் குடியேறினான்.” எபிரெய வினைச்சொல் வெறுமனே உட்காருவதைக் குறிக்காமல், வசிப்பதையோ குடியேறுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: புறப்பட்டுச் சென்று
  rationale: הלך என்பது தொடர்கதை அமைப்பில் ‘சென்றான்’ என்று பொருள்படும். இங்கு புதிய வாழ்க்கைநிலைக்கான நகர்வை இயல்பாக வெளிப்படுத்த ‘புறப்பட்டுச் சென்று’ என மொழிபெயர்க்கப்பட்டது; ‘திரும்பிச் சென்றான்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத திசையைச் சேர்க்கும்.
- source_word: יְרֻבַּעַל
  choice: யெருபாகால்
  rationale: எபிரெய உரையில் உள்ள יְרֻבַּעַל என்ற பெயரையே ஒலிபெயர்த்துள்ளோம்; பரிச்சயமான மாற்றுப் பெயரான ‘கிதியோன்’ இங்கு பதிலிடப்படவில்லை.
- source_word: בֶּן יוֹאָשׁ
  choice: யோவாசின் மகன்
  rationale: எபிரெய மொழியின் இயல்பான தந்தை–மகன் உறவுக் கட்டமைப்பைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: וַיֵּשֶׁב
  choice: குடியிருந்தான்
  rationale: ישב என்பதற்கு ‘உட்கார்,’ ‘வசித்திரு,’ ‘குடியேறு’ ஆகிய பொருள்கள் உண்டு. בְּבֵיתוֹ என்பதுடன் இங்கு அது வெறுமனே உட்கார்ந்திருப்பதை அல்ல, வசிப்பதைக் குறிக்கிறது.
- source_word: בְּבֵיתוֹ
  choice: தன் வீட்டில்
  rationale: בְּ + ‘வீடு’ + மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதி என்பதன் நேரடியான பொருள் ‘அவனுடைய வீட்டில்.’ தமிழ் நடையில் எழுவாயையே சுட்டும் இயல்பான வடிவமாக ‘தன் வீட்டில்’ பயன்படுத்தப்பட்டது.
- source_word: וַ...וַ
  choice: பின்பு ... புறப்பட்டுச் சென்று, ... குடியிருந்தான்
  rationale: இணைந்த waw-consecutive வினைகள் தொடர்கதையை முன்னெடுக்கின்றன. ‘பின்பு’ மற்றும் தொடர்ச்சியான வினை அமைப்பு அந்த நிகழ்வோட்டத்தை இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
