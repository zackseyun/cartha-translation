  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பெயர் மூல எபிரெய வடிவத்திலிருந்து ஒலிபெயர்க்கப்பட்டுள்ளது; வினைச்சொல்லின் வசித்தல்/குடியேறுதல் சார்ந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
