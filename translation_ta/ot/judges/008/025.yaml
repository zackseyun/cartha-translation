  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிய புரிதலும் இணையும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வலியுறுத்தல் ‘நிச்சயமாக’ எனத் தக்கவைக்கப்பட்டுள்ளது; נֶזֶם என்பதிலுள்ள காது/மூக்கு ambiguity பிரதான உரையில் ‘வளையம்’ என்றும் அடிக்குறிப்பில் மாற்று வாய்ப்புகளுடனும் பாதுகாக்கப்பட்டுள்ளது.
