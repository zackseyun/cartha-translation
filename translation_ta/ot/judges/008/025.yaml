base_translation:
  language: en
  yaml_path: translation/ot/judges/008/025.yaml
  text: And they said[a], “We will surely give them.” Then they spread out the cloak[c][b], and each man threw there an earring from his spoil.
translation:
  language: ta
  text: அதற்கு அவர்கள், “நாங்கள் நிச்சயமாகக் கொடுப்போம்”[a] என்றார்கள். பின்பு அந்த மேலாடையை[b] விரித்தார்கள்; ஒவ்வொருவனும் தன் கொள்ளைப்பொருளிலிருந்த ஒரு வளையத்தை[c] அதில் எறிந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், கொடுக்கும் செயலை வலியுறுத்தும் இலக்கண அமைப்பு உள்ளது; இதை “நாங்கள் நிச்சயமாய்க் கொடுப்போம்” அல்லது “கொடுத்தே தீருவோம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “அந்த ஆடை”; பொருட்களைப் பெறுவதற்காக விரிக்கப்பட்ட வெளிப்புற ஆடை.
    reason: cultural_note
  - marker: c
    text: எபிரெயச் சொல் காதணி, மூக்குத்தி, அல்லது பொதுவான ஒரு வளையம் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן נִתֵּן
  choice: நாங்கள் நிச்சயமாகக் கொடுப்போம்
  rationale: எபிரெயத்தில் வினையெச்ச முழுவடிவத்துடன் வரையறுக்கப்பட்ட வினை சேர்ந்து கொடுக்கும் செயலை வலியுறுத்துகிறது. ‘நிச்சயமாக’ என்பது விருப்பமுடன் என்பதைக் கூடுதலாகப் பொருத்தாமல் அந்த வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַשִּׂמְלָה
  choice: அந்த மேலங்கி
  rationale: இந்தச் சொல் ஆடை அல்லது போர்த்திக்கொள்ளும் வெளிப்புற ஆடையைக் குறிக்கலாம். பொருட்களைச் சேகரிக்க விரிக்கப்படும் ஆடை என்ற காட்சிக்கு ‘மேலங்கி’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַיִּפְרְשׂוּ
  choice: விரித்து வைத்தார்கள்
  rationale: פרשׂ என்பது விரித்தல் அல்லது பரப்புதல். சேகரிப்பதற்காக ஆடையைத் திறந்து தரையில் அமைத்த செயலை ‘விரித்து வைத்தார்கள்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיַּשְׁלִיכוּ שָׁמָּה
  choice: அதில் எறிந்தான்
  rationale: שׁלך என்பது வைப்பதைவிட வலுவாக எறிதல் அல்லது வீசுதலைக் குறிக்கிறது. שָׁמָּה என்பதன் ‘அங்கே’ என்ற இடக்குறிப்பு தமிழில் முன் சொல்லப்பட்ட மேலங்கியைச் சுட்டும் ‘அதில்’ என இயல்பாக வெளிப்படுகிறது.
- source_word: אִישׁ
  choice: ஒவ்வொருவனும்
  rationale: இங்கு אִישׁ பகிர்மானப் பொருளில் ‘ஒவ்வொரு ஆணும்’ என்பதைக் குறிக்கிறது. ‘ஒவ்வொருவனும்’ எபிரெயத்தின் ஆண்பால் ஒருமைப் பகிர்மான வடிவத்தைப் பாதுகாக்கிறது.
- source_word: נֶזֶם
  choice: ஒரு வளையம்
  rationale: נֶזֶם என்பது காதிலோ மூக்கிலோ அணியும் வளையத்தைக் குறிக்கக்கூடும். முந்தைய வசனத்தின் சூழலில் காதணி சாத்தியமானதாயினும், உறுப்பைத் தீர்மானிக்காத ‘வளையம்’ மூலமொழியின் உண்மையான பொருள் வரம்பைப் பாதுகாக்கிறது.
- source_word: שְׁלָלוֹ
  choice: தன் கொள்ளைப்பொருளிலிருந்த
  rationale: שָׁלָל என்பது போரில் கைப்பற்றப்பட்ட கொள்ளை அல்லது கொள்ளைப்பொருளைக் குறிக்கிறது. மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டு பகிர்மான ‘ஒவ்வொருவனும்’ என்பதுடன் ‘தன்’ என இயல்பாகப் பொருந்துகிறது.
