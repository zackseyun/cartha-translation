translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் சேர்க்கைத் தொடர்பு, ஆண்பால் குறிப்பு, திரும்பிவருவதன் நிலை குறித்த பொருள் விரிவு, கட்டமைப்பை இடிக்கும் வலிமை ஆகியவை தக்கவைக்கப்பட்டுள்ளன.
