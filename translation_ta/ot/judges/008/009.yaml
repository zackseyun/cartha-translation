source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר גַּם לְ/אַנְשֵׁ֥י פְנוּאֵ֖ל לֵ/אמֹ֑ר בְּ/שׁוּבִ֣/י בְ/שָׁל֔וֹם אֶתֹּ֖ץ אֶת הַ/מִּגְדָּ֥ל הַ/זֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/009.yaml
  text: He also said to the men of Penuel[a], “When I return in peace[c][b], I will tear down this tower.”
translation:
  language: ta
  text: அவர் பெனுவேலின் ஆண்களிடமும்[a], “நான் நலமாகத் திரும்பி வரும்போது[b], இந்தக் கோபுரத்தை[c] இடித்துத் தள்ளுவேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெனுவேலின் ஆண்கள்” என்பது அந்த நகரத்தின் ஆண் தலைவர்களையோ பிரதிநிதிகளையோ குறிக்கலாம்; அங்கிருந்த ஒவ்வொரு குடியிருப்பாளரையும் அவசியம் குறிக்காது.
    reason: cultural_note
  - marker: b
    text: எபிரெயத்தில், “சமாதானத்துடன்.” இங்கு “பாதுகாப்பாக,” “சேதமின்றி,” அல்லது “வெற்றிகரமாக” என்ற பொருள் இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “கோபுரம்” என்பது பெனுவேலுக்குள் இருந்த தற்காப்பு அரணையோ பலப்படுத்தப்பட்ட கோபுரத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: -உம்
  rationale: முந்தைய குழுவிடம் கிதியோன் கூறியதோடு இதையும் இணைக்கும் சேர்க்கைப் பொருளை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לְאַנְשֵׁי פְנוּאֵל
  choice: பெனுவேலின் ஆண்களிடம்
  rationale: אַנְשֵׁי என்பதன் ஆண்பால் குறிப்பைத் தக்கவைக்கிறது; சூழலில் இது நகரத்தின் ஆண் தலைவர்களையோ பிரதிநிதிகளையோ குறிக்கலாம்.
- source_word: בְּשׁוּבִי
  choice: நான் ... திரும்பி வரும்போது
  rationale: בְּ உடன் வரும் முதலாம் நபர் ஒருமை பின்னொட்டுடைய வினையெச்சத்தின் காலப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בְשָׁלוֹם
  choice: நலமாக
  rationale: இச்சூழலில் שָׁלוֹם போரிலிருந்து பாதுகாப்பாகவும் சேதமின்றியும், ஒருவேளை வெற்றிகரமாகவும் திரும்புவதைக் குறிக்கிறது; ‘நலமாக’ என்பது தேவையற்ற விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: אֶתֹּץ
  choice: இடித்துத் தள்ளுவேன்
  rationale: נתץ என்பது ஒரு கட்டமைப்பை இடிப்பதையோ தகர்ப்பதையோ குறிக்கிறது; தேர்ந்த சொற்றொடர் அதன் வலிமையையும் எதிர்கால அச்சுறுத்தலையும் தெளிவாகக் காட்டுகிறது.
- source_word: הַמִּגְדָּל הַזֶּה
  choice: இந்தக் கோபுரத்தை
  rationale: מִגְדָּל என்பதன் நேரடியான பொருளான ‘கோபுரம்’ தக்கவைக்கப்படுகிறது; அதன் தற்காப்புப் பயன்பாடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
