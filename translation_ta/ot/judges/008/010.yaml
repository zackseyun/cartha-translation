base_translation:
  language: en
  yaml_path: translation/ot/judges/008/010.yaml
  text: Zebah and Zalmunna were in Karkor[a], and their camps were with them, about fifteen thousand men, all who were left from all the camp of the sons of the east; and those who had fallen were one hundred twenty thousand men drawing the sword.
translation:
  language: ta
  text: செபாவும் சல்முன்னாவும் கர்கோரில் இருந்தனர்; அவர்களுடைய படை முகாம்களும் அவர்களோடு இருந்தன. கிழக்கத்திய மக்களின் முழுப் படை முகாமிலிருந்து எஞ்சியிருந்த அனைவருமான ஏறக்குறைய பதினைந்தாயிரம் பேர் அவர்களோடு இருந்தனர். வாளை உருவிய ஒரு இலட்சத்து இருபதாயிரம் பேர் வீழ்ந்திருந்தனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּקַּרְקֹר
  choice: கர்கோரில்
  rationale: בְּ இடத்தைக் குறிக்கிறது; இடப்பெயருடன் ‘-இல்’ என்பது இயல்பான தமிழ் வடிவம்.
- source_word: וּמַחֲנֵיהֶם עִמָּם
  choice: அவர்களுடைய படை முகாம்களும் அவர்களோடு இருந்தன
  rationale: מַחֲנֵיהֶם என்பது பன்மை வடிவம்; இராணுவச் சூழலைத் தெளிவாக்க ‘படை முகாம்கள்’ எனவும், עִמָּם என்பதைக் ‘அவர்களோடு’ எனவும் வெளிப்படையாகத் தக்கவைத்துள்ளது.
- source_word: כַּחֲמֵשֶׁת עָשָׂר אֶלֶף
  choice: ஏறக்குறைய பதினைந்தாயிரம் பேர்
  rationale: எண்ணுக்கு முன் உள்ள כְּ தோராயத்தைக் குறிப்பதால் ‘ஏறக்குறைய’ சேர்க்கப்பட்டுள்ளது.
- source_word: כֹּל הַנּוֹתָרִים
  choice: எஞ்சியிருந்த ... பேரும் இவர்களே
  rationale: יתר என்பதன் நிபால் பங்கேற்பு வடிவத்தின் எஞ்சிய/உயிர்தப்பிய நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִכֹּל מַחֲנֵה בְנֵי קֶדֶם
  choice: கிழக்கத்திய மக்களின் முழுப் படை முகாமிலிருந்தும்
  rationale: מִן என்பதன் பகுதி/மூலப் பொருளை ‘-இலிருந்தும்’ தக்கவைக்கிறது; בְנֵי קֶדֶם என்ற எபிரேய இன-புவியியல் சொல்லாட்சியை இயல்பான தமிழில் ‘கிழக்கத்திய மக்கள்’ என வழங்குகிறது.
- source_word: וְהַנֹּפְלִים
  choice: ஏற்கெனவே வீழ்ந்தவர்கள்
  rationale: முந்தைய போரில் கொல்லப்பட்டவர்களைத் திரும்பிப் பார்ப்பதால் நிறைவுற்ற முன்னிலை உணர்வை ‘ஏற்கெனவே’ தெளிவாக்குகிறது; ‘வீழ்ந்தவர்கள்’ போரில் இறந்தோர் என்ற மரியாதையான சொல்லாட்சி.
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: ஒரு இலட்சத்து இருபதாயிரம் பேர்
  rationale: தமிழில் இயல்பான எண் முறையில் 120,000 வழங்கப்பட்டுள்ளது.
- source_word: אִישׁ שֹׁלֵף חָרֶב
  choice: வாளை உருவிப் போரிடுகிறவர்கள்
  rationale: சொல்லுக்குச் சொல் ‘வாளை உருவுகிறவர்’; இது போரிடத் தகுதியுள்ள ஆயுதமேந்திய வீரர்களைக் குறிக்கும் இராணுவ மரபுத்தொடர். உருவகத்தின் உயிரோட்டத்தைத் தக்கவைத்து பொருளையும் தெளிவாக்க ‘போரிடுகிறவர்கள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: וְ
  choice: செபாவும்
  rationale: தொடக்க வாவை தனியான ‘இப்போது’ என விரிவாக்காமல், தமிழின் இணைப்புத் துணை ‘-உம்’ வழியாக இயல்பாகக் கடத்தியுள்ளது.
