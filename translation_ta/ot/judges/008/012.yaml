  edition: WLC
  text: וַ/יָּנ֗וּסוּ זֶ֚בַח וְ/צַלְמֻנָּ֔ע וַ/יִּרְדֹּ֖ף אַחֲרֵי/הֶ֑ם וַ/יִּלְכֹּ֞ד אֶת שְׁנֵ֣י מַלְכֵ֣י מִדְיָ֗ן אֶת זֶ֨בַח֙ וְ/אֶת צַלְמֻנָּ֔ע וְ/כָל הַֽ/מַּחֲנֶ֖ה הֶחֱרִֽיד־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/012.yaml
  text: Zebah and Zalmunna fled[a], and he pursued them and captured the two kings of Midian, Zebah and Zalmunna; and he threw the whole camp into panic.
translation:
  language: ta
  text: செபாவும் சல்முன்னாவும் தப்பியோடினார்கள். கிதியோன் அவர்களைத் துரத்திச் சென்று, மீதியானின் இரண்டு அரசர்களான செபாவையும் சல்முன்னாவையும் பிடித்தார்; முகாம் முழுவதையும் பீதிக்குள்ளாக்கினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முகாம் முழுவதையும் நடுங்கச் செய்தார்”; அல்லது, “முகாம் முழுவதையும் சிதறடித்தார்.” எபிரெய வினைச்சொல் நடுக்கத்தையோ பீதியையோ ஏற்படுத்துவதைக் குறிக்கலாம்; இங்கு அது போர்ச் சூழலுக்குரிய விளைவையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנוּסוּ
  choice: தப்பியோடினார்கள்
  rationale: נוּס என்பதன் பொருள் ஆபத்திலிருந்து தப்பி ஓடுதல்; தமிழ் கதைநடையில் இயல்பாகவும் தெளிவாகவும் இதை வெளிப்படுத்துகிறது.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: செபாவும் சல்முன்னாவும்
  rationale: தனிப்பட்ட பெயர்கள் நவீனத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: וַיִּרְדֹּף אַחֲרֵיהֶם
  choice: அவர்களைத் துரத்திச் சென்று
  rationale: רדף אחרי என்பதன் தொடர்ச்சியான பின்தொடர்தல் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּלְכֹּד
  choice: பிடித்தார்
  rationale: போர்ச் சூழலில் לכד என்பது எதிரிகளைப் பிடித்தல் அல்லது கைப்பற்றுதல்; உயிருடன் பிடிக்கப்பட்ட அரசர்களைக் குறிக்க ‘பிடித்தார்’ இயல்பானது.
- source_word: שְׁנֵי מַלְכֵי מִדְיָן
  choice: மீதியானின் இரண்டு அரசர்கள்
  rationale: எபிரெயக் கட்டமைப்பிலுள்ள உடைமை உறவைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֶת זֶבַח וְאֶת צַלְמֻנָּע
  choice: செபாவையும் சல்முன்னாவையும்
  rationale: முன்னர் குறிப்பிடப்பட்ட இரண்டு அரசர்கள் யார் என்பதை விளக்கும் மூலத்தின் மறுபெயரிடலைத் தக்கவைக்கிறது.
- source_word: וְכָל הַמַּחֲנֶה
  choice: முகாம் முழுவதையும்
  rationale: מַחֲנֶה இங்கு படை முகாமை அல்லது முகாமிட்டிருந்த படையைக் கூட்டாகக் குறிக்கிறது; ‘முகாம் முழுவதையும்’ அந்தக் கூட்டுப்பொருளைத் தக்கவைக்கிறது.
- source_word: הֶחֱרִיד
  choice: பீதிக்குள்ளாக்கினார்
  rationale: חרד என்பதன் ஹிஃபில் வடிவம் நடுங்கச் செய்தல் அல்லது பீதியடையச் செய்தல் எனும் காரணவினைப் பொருளைக் கொண்டது; போர்ச் சூழலிலுள்ள குழப்பத்தையும் இத்தேர்வு உணர்த்துகிறது.
