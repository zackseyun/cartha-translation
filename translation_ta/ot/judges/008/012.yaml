translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தில் இரண்டாம் மற்றும் மூன்றாம் வினைகளின் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை; முந்தைய சூழலின் அடிப்படையில் தெளிவுக்காக ‘கிதியோன்’ சேர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு தொடர்புடைய இறுதி வினைத்தொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
