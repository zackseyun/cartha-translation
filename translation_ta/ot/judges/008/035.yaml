  text: וְ/לֹֽא עָשׂ֣וּ חֶ֔סֶד עִם בֵּ֥ית יְרֻבַּ֖עַל גִּדְע֑וֹן כְּ/כָל הַ/טּוֹבָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה עִם יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/035.yaml
  text: And they did not show kindness to the house of Jerubbaal (that is, Gideon), in keeping with all the good that he had done for Israel.
translation:
  language: ta
  text: அவர்கள் யெருபாகாலின் (அதாவது கிதியோனின்) குடும்பத்தாரிடம், அவர் இஸ்ரவேலுக்குச் செய்த எல்லா நன்மைகளுக்கும் ஏற்ப தயவு காட்டவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד
  choice: அன்பு
  rationale: இங்கு உடன்படிக்கைச் சூழலில் எதிர்பார்க்கப்படும் விசுவாசமான அன்பையும் நன்றியுணர்வுடன் கூடிய நற்பண்பையும் குறிக்கிறது; இயல்பான தமிழில் ‘அன்பு காட்டவில்லை’ என வழங்கப்பட்டது.
- source_word: בֵּית יְרֻבַּעַל
  choice: யெருபாகாலின் குடும்பத்தார்
  rationale: בֵּית என்பது இங்கு கட்டடத்தை அல்ல, கிதியோனின் குடும்பம் அல்லது வீட்டாரைக் குறிக்கிறது.
- source_word: כְּכָל הַטּוֹבָה
  choice: செய்த எல்லா நன்மைகளுக்கும் ஏற்றவாறு
  rationale: כְּ தொடர்பையும் அளவொப்புமையையும் உணர்த்துவதால், கிதியோன் செய்த நன்மைகளுக்குத் தகுந்த பதிலை அவர்கள் அளிக்கவில்லை என்ற கருத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: யெருபாகால் மற்றும் கிதியோன் என்ற பெயர்களின் தொடர்பு
  choice: யெருபாகால், அதாவது கிதியோன்
  alternative: யெருபாகால் கிதியோன்
  rationale: இரண்டும் ஒரே நபரைக் குறிக்கின்றன என்பதை வாசகருக்கு தெளிவாக்குகிறது; புதிய இறையியல் விளக்கம் எதையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடியதும் கண்ணியமானதுமான நடை. எபிரெய வாக்கியத்தின் எதிர்மறை வலியுறுத்தலும் நன்றியின்மைக் கருத்தும் பாதுகாக்கப்பட்டுள்ளன.
