revisions:
- from: அவர்கள் இஸ்ரவேலுக்காக யெருபாகால், அதாவது கிதியோன், செய்த எல்லா நன்மைகளுக்கும் ஏற்றவாறு அவருடைய குடும்பத்தாருக்கு அன்பு காட்டவில்லை.
  to: அவர்கள் யெருபாகாலின் (அதாவது கிதியோனின்) குடும்பத்தாரிடம், அவர் இஸ்ரவேலுக்குச் செய்த எல்லா நன்மைகளுக்கும் ஏற்ப தயவு காட்டவில்லை.
  rationale: The revision retains the source’s meaning while explicitly linking Jerubbaal and Gideon to the household in question, and it uses a more contextually fitting Tamil expression for the kindness that Israel failed to show. No footnote is necessary because the parenthetical identification supplies the needed clarification.
