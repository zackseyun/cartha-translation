base_translation:
  language: en
  yaml_path: translation/ot/judges/008/005.yaml
  text: And he said to the men of Succoth[a], “Please give loaves of bread to the people who are with me, for they are weary, and I am pursuing Zebah and Zalmunna, the kings of Midian.”
translation:
  language: ta
  text: அவர் சுக்கோத்தின் ஆண்களிடம், “தயவுசெய்து என்னுடன் இருக்கும் மக்களுக்கு[a] அப்பங்களைக் கொடுங்கள். அவர்கள் களைத்துப்போயிருக்கிறார்கள்; நானோ மீதியானின் அரசர்களான சேபாவையும் சல்முன்னாவையும் துரத்திச் செல்கிறேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “என் காலடியில் இருக்கும் மக்களுக்கு.” இது அவருடன் வருகிறவர்களையோ அவரைப் பின்தொடருகிறவர்களையோ குறிக்கும் மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַנְשֵׁי סֻכּוֹת
  choice: சுக்கோத்தின் ஆண்களிடம்
  rationale: אַנְשֵׁי என்பது பொதுவாக ஊர்மக்கள் அனைவரையும் அல்ல, ஆண்களை—இங்கு நகரத்தின் ஆண் பிரதிநிதிகளை—குறிக்கிறது.
- source_word: תְּנוּ נָא
  choice: தயவுசெய்து ... கொடுங்கள்
  rationale: கட்டளையுடன் வரும் נָא வேண்டுகோளின் பணிவையோ அவசரத்தையோ காட்டுகிறது; இச்சொற்றொடர் அதை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: כִּכְּרוֹת לֶחֶם
  choice: அப்பங்கள்
  rationale: כִּכָּר இங்கு வட்டமான ரொட்டித் துண்டையோ முழு அப்பத்தையோ குறிக்கிறது; ‘அப்பங்கள்’ சுருக்கமாகவும் சூழலுக்கு இயல்பாகவும் உள்ளது.
- source_word: לָעָם אֲשֶׁר בְּרַגְלָי
  choice: என்னுடன் வந்திருக்கிற மக்களுக்கு
  rationale: ‘என் காலடியில் உள்ளவர்கள்’ என்ற எபிரெய மரபுத்தொடர் கிதியோனுடன் வந்து அவரைப் பின்தொடர்ந்தவர்களைக் குறிக்கிறது. முதன்மை உரை பொருளை இயல்பாகத் தருகிறது; நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עֲיֵפִים
  choice: களைத்துப்போயிருக்கிறார்கள்
  rationale: பயணமும் போராட்டமும் உண்டாக்கிய சோர்வைத் துல்லியமாகக் காட்டுகிறது; மயக்கமடையும் அளவிலான நிலையை தேவையின்றி உணர்த்தாது.
- source_word: רֹדֵף אַחֲרֵי
  choice: துரத்திச் செல்கிறேன்
  rationale: பங்கேற்புவினை வடிவம் தொடர்ந்துகொண்டிருக்கும் துரத்தலைக் குறிக்கிறது; தமிழில் இவ்வடிவம் அந்த நீடித்த செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: சேபாவையும் சல்முன்னாவையும்
  rationale: தனிப்பெயர்கள் மொழிபெயர்க்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: מַלְכֵי מִדְיָן
  choice: மீதியானின் அரசர்களான
  rationale: ‘மீதியானின் அரசர்கள்’ என்ற எபிரெய இணைப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
