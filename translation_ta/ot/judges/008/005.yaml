translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மரபுத்தொடரின் பொருள் முதன்மை உரையில் இயல்பாகத் தரப்பட்டு, அதன் நேரடி சொல்வடிவம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
