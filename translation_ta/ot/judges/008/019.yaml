source:
  edition: WLC
  text: וַ/יֹּאמַ֕ר אַחַ֥/י בְּנֵֽי אִמִּ֖/י הֵ֑ם חַי יְהוָ֗ה ל֚וּ הַחֲיִתֶ֣ם אוֹתָ֔/ם לֹ֥א הָרַ֖גְתִּי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/019.yaml
  text: And he said[a], “They were my brothers, the sons of my mother. As Yahweh lives, if you had let them live[b], I would not have killed you.”
translation:
  language: ta
  text: 'அவர் சொன்னார்: “அவர்கள் என் சகோதரர்கள், என் தாயின் மகன்கள்.[a] யாவே வாழ்கிறபடியால், நீங்கள் அவர்களை உயிரோடு விட்டிருந்தால், நான் உங்களைக் கொன்றிருக்க மாட்டேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் தாயின் மகன்கள்” என்பது அவர்கள் வெறும் உறவினர்கள் அல்ல; கிதியோனின் தாயின் மகன்களாகிய அவரது சகோதரர்கள் என்பதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: அவர் சொன்னார்
  rationale: எபிரெயக் கதைநடையின் வழக்கமான wayyiqtol வடிவை இயல்பான நவீனத் தமிழில் தருகிறது; சூழலில் பேசுபவர் கிதியோன்.
- source_word: אַחַי בְּנֵי אִמִּי הֵם
  choice: அவர்கள் என் சகோதரர்கள்—என் தாயின் மகன்கள்
  rationale: אַחַי என்பதன் நேரடியான குடும்பப் பொருளையும், தொடர்ந்து வரும் விளக்கச் சொற்றொடரையும் காக்கிறது. கோடு இரண்டாம் பகுதி முதல் பகுதியைத் தெளிவுபடுத்துவதை வெளிப்படுத்துகிறது.
- source_word: חַי יְהוָה
  choice: யாவே உயிரோடிருப்பது எவ்வளவு உறுதியோ, அவ்வளவு உறுதியாகச் சொல்கிறேன்
  rationale: இது ஓர் ஆணைச் சூத்திரம். சொற்சொல் அமைப்பை மட்டும் பின்பற்றாமல், அதன் ஆணையுறுதியை இயல்பான மற்றும் கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பால் தருகிறது.
- source_word: לוּ הַחֲיִתֶם אוֹתָם
  choice: நீங்கள் அவர்களை உயிரோடு விட்டிருந்தால்
  rationale: לוּ அறிமுகப்படுத்தும் நிகழாத கடந்தகால நிபந்தனையையும், חיה என்பதன் Hiphil வடிவிலுள்ள ‘உயிரோடு வைத்தல்/விடுதல்’ பொருளையும் இயல்பாகத் தருகிறது.
- source_word: לֹא הָרַגְתִּי אֶתְכֶם
  choice: நான் உங்களைக் கொன்றிருக்க மாட்டேன்
  rationale: நிகழாத கடந்தகால நிபந்தனையின் விளைவைத் தமிழில் தெளிவாகக் காட்டுகிறது; ‘கொல்ல மாட்டேன்’ என்பது எதிர்காலப் பொருளாகப் புரிந்துகொள்ளப்படலாம்.
theological_decisions:
- issue: ஆணையில் வரும் יהוה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைநாமம் நேரடியாக உள்ளது. அதைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது; ‘யாவே’ என்பது தற்போதைய ஆய்வில் பரவலாக ஏற்ற மறுகட்டமைக்கப்பட்ட உச்சரிப்பை பிரதிபலிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான ஆனால் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ஆணைச் சூத்திரம் தமிழில் புரியும்படி விரிவாக்கப்பட்டுள்ளது; நிகழாத கடந்தகால நிபந்தனை தெளிவாகக் காக்கப்பட்டுள்ளது.
