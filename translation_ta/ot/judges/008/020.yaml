base_translation:
  language: en
  yaml_path: translation/ot/judges/008/020.yaml
  text: Then he said to Jether his firstborn[a], “Get up, kill them.” But the young man did not draw his sword, because he was afraid, for he was still a young man.
translation:
  language: ta
  text: பின்பு அவர் தன் முதற்பிறந்த மகன் யேத்தேரிடம், “எழுந்து, அவர்களைக் கொல்” என்றார். ஆனால் அந்த இளைஞன்[a] பயந்ததால் தன் வாளை உருவவில்லை; ஏனெனில், அவன் இன்னும் இளைஞனாகவே இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லான naʿar என்பதற்கு ‘சிறுவன்,’ ‘வாலிபன்,’ அல்லது ‘இளைஞன்’ என்று பொருள் கொள்ளலாம்; அது சிறுவயது முதல் இளம் பருவம் வரையிலான வயதைக் குறிக்கக்கூடும். இங்கு அவன் வாள் வைத்திருப்பதாலும் அவர்களைக் கொல்லும்படி கட்டளையிடப்படுவதாலும் ‘இளைஞன்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு அவர் ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘பின்பு’ என்பது அந்த வரிசையை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: לְיֶתֶר
  choice: யேத்தேரிடம்
  rationale: தனிப்பெயர் எபிரெய உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּכוֹרוֹ
  choice: தன் முதற்பிறந்த மகன்
  rationale: בכור பிறப்பு வரிசையில் முதலில் பிறந்த மகனைக் குறிக்கிறது; ‘முதற்பிறந்த’ என்பது அதன் நேரடியான பொருளையும் முக்கியத்துவத்தையும் காக்கிறது.
- source_word: קוּם
  choice: எழுந்து
  rationale: קום என்பதன் கட்டளை வடிவை இயல்பாகவும் நேரடியாகவும் தருகிறது.
- source_word: הֲרֹג אוֹתָם
  choice: அவர்களைக் கொன்றுவிடு
  rationale: הרג என்பது கொல்வதற்கான பொதுவான நேரடி வினை; பன்மைச் சுட்டை ‘அவர்களை’ எனக் காக்கிறது.
- source_word: וְלֹא שָׁלַף
  choice: ஆனால் ... உருவவில்லை
  rationale: கட்டளைக்கும் அதை நிறைவேற்றாத செயலுக்கும் இடையிலான முரண்பாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது; வாளை உறையிலிருந்து எடுப்பதை ‘உருவவில்லை’ இயல்பாகக் குறிக்கிறது.
- source_word: הַנַּעַר
  choice: அந்த இளைஞன்
  rationale: נער என்பது சிறுவன் முதல் இளம் வயது ஆண் வரை குறிக்கக்கூடியது. இங்கு வாள் வைத்திருப்பதாலும் கொல்லும்படி கட்டளையிடப்படுவதாலும் ‘இளைஞன்’ சூழலுக்கு ஏற்றது; சுட்டு உருபு குறிப்பிட்ட நபரை அடையாளப்படுத்துகிறது.
- source_word: חַרְבּוֹ
  choice: தன் வாளை
  rationale: எழுவாயையே உடைமையாளராகக் காட்டும் இயல்பான தமிழ் தற்சுட்டுப் பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: כִּי יָרֵא
  choice: பயந்ததால்
  rationale: முதல் כִּי, அவன் வாளை உருவாததற்கான காரணத்தைத் தருகிறது; தமிழ் காரணவிகுதி இதைத் தெளிவாகக் காட்டுகிறது.
- source_word: כִּי עוֹדֶנּוּ נָעַר
  choice: ஏனெனில், அவன் இன்னும் இளைஞனாகவே இருந்தான்
  rationale: இரண்டாம் כִּי பயத்திற்கான மேலதிக காரணத்தைத் தருகிறது. עוֹדֶנּוּ என்பதின் தொடர்நிலை ‘இன்னும் ... ஆகவே’ எனவும், נער என்பதின் மறுபயன்பாடு ‘இளைஞன்’ என்பதை மீண்டும் பயன்படுத்தியும் காக்கப்பட்டுள்ளது.
