base_translation:
  language: en
  yaml_path: translation/ot/judges/008/021.yaml
  text: Then Zebah and Zalmunna said[a], “Rise yourself and strike us down, for as the man is, so is his strength.” So Gideon rose and killed Zebah and Zalmunna[c][b], and he took the crescent ornaments that were on the necks of their camels.
translation:
  language: ta
  text: அப்போது சேபாவும் சல்முன்னாவும், “நீயே எழுந்து எங்களை வீழ்த்திவிடு[a]. ஒருவன் எப்படிப்பட்டவனோ, அவனுடைய வலிமையும் அப்படிப்பட்டதே[b]” என்றார்கள். அப்போது கிதியோன் எழுந்து சேபாவையும் சல்முன்னாவையும் கொன்றான்; அவர்களுடைய ஒட்டகங்களின் கழுத்துகளில் இருந்த பிறை வடிவ அணிகலன்களையும்[c] எடுத்துக்கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களைக் கொன்றுபோடு.” இச்சூழலில் וּפְגַע בָּנוּ என்பது உயிர்க்கொல்லும் தாக்குதலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், “ஆள் எப்படியோ, அவனுடைய வலிமையும் அப்படியே.” இது ஒருவனுடைய உடல்வாகு, வீரத்தன்மை அல்லது ஆற்றலுக்கு அவனுடைய வலிமை ஒத்திருக்கும் என்பதைக் கூறும் பழமொழித்தொடர்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “பிறைகள்,” அதாவது நிலாப்பிறை வடிவ அணிகலன்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... זֶבַח וְצַלְמֻנָּע
  choice: அப்போது சேபாவும் சல்முனாவும் ... என்றார்கள்
  rationale: கூட்டெழுவாயுடன் வரும் எபிரெய ஒருமை வினைச்சொல் தமிழில் இயல்பாகப் பன்மையில் தரப்பட்டுள்ளது; வாவ் தொடர்ச்சி ‘அப்போது’ எனக் கதைநடையில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: קוּם אַתָּה
  choice: நீயே எழுந்து
  rationale: வெளிப்படையாக இடம்பெறும் אַתָּה என்ற முன்னிலைப்பெயரின் வலியுறுத்தலை ‘நீயே’ காக்கிறது.
- source_word: וּפְגַע בָּנוּ
  choice: எங்களை வீழ்த்திவிடு
  rationale: פגע என்பதன் தாக்குதல்/அடித்தல் சார்ந்த பொருளையும், இச்சூழலில் அதன் உயிர்க்கொல்லும் நோக்கையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘கொன்றுபோடு’ என்ற வெளிப்படையான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כִּי כָאִישׁ גְּבוּרָתוֹ
  choice: ஒருவன் எப்படிப்பட்டவனோ, அவனுடைய வலிமையும் அப்படிப்பட்டதே
  rationale: மனிதனின் தன்மை அல்லது வீரத்திற்கேற்ப அவன் வலிமை அமையும் என்ற பழமொழித்தன்மையைத் தமிழில் இயல்பாகக் காக்கிறது; ஆண்பால் ஒருமையும் சூழலுக்கேற்ப நிலைநிறுத்தப்பட்டுள்ளது.
- source_word: וַיָּקָם גִּדְעוֹן
  choice: எனவே கிதியோன் எழுந்து
  rationale: முந்தைய கட்டளையில் உள்ள קוּם என்பதோடு ஏற்படும் சொல் எதிரொலியை ‘எழுந்து’ காக்கிறது; கிதியோனின் பதிலை ‘எனவே’ தெளிவுபடுத்துகிறது.
- source_word: וַיַּהֲרֹג
  choice: கொன்றான்
  rationale: הרג என்ற பொதுவான கொலை வினையைத் தெளிவான நவீன தமிழில் நேரடியாக வழங்குகிறது.
- source_word: הַשַּׂהֲרֹנִים
  choice: பிறை வடிவ அணிகலன்கள்
  rationale: சொல் குறிக்கும் நிலாப்பிறை வடிவிலான அலங்காரப் பொருட்களைத் தவறான புரிதலின்றி தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: அவர்களுடைய ஒட்டகங்களின் கழுத்துகளில் இருந்த
  rationale: அணிகலன்களின் இருப்பிடத்தை மூலத்தின் உறவுத்தொடருக்கு ஏற்ப இயல்பான தமிழில் குறிப்பிடுகிறது.
theological_decisions:
- issue: כָאִישׁ என்ற ஆண்பால் பழமொழித் தொடர்
  choice: ஒருவன் எப்படிப்பட்டவனோ, அவனுடைய வலிமையும் அப்படிப்பட்டதே
  alternative: ஒருவர் எப்படிப்பட்டவரோ, அவருடைய வலிமையும் அப்படிப்பட்டதே
  rationale: இச்சூழல் ஆண் போர்வீரனையும் அவனுடைய உடல்/வீர வலிமையையும் குறிக்கிறது. ஆகவே மூலத்தின் ஆண்பால் ஒருமையைப் பொதுப்பாலாக்காமல் காக்கிறது; அதே நேரத்தில் குறிப்பிட்ட கோட்பாட்டு விளக்கம் எதையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகமக் கதைநடைக்கேற்ற கண்ணியத்துடனும் மொழியாக்கப்பட்டுள்ளது. ‘நீயே’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது; ‘எழுந்து’ என்ற சொல் கட்டளையிலும் கிதியோனின் செயலிலும் மீண்டும் வருவதால் எபிரெய சொல் எதிரொலி பாதுகாக்கப்படுகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் தொடர்புடைய இடங்களில் இணைக்கப்பட்டுள்ளன.
