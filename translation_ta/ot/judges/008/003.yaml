base_translation:
  language: en
  yaml_path: translation/ot/judges/008/003.yaml
  text: Into your hand God gave the princes of Midian[a], Oreb and Zeeb; and what was I able to do compared with you? Then their spirit relaxed toward him when he spoke this word.
translation:
  language: ta
  text: “உங்கள் கையில் கடவுள் மீதியானின் தலைவர்களான ஓரேபையும் சேபையும் ஒப்புக்கொடுத்தார். உங்களோடு ஒப்பிடும்போது என்னால் என்ன செய்ய முடிந்தது?” அவர் இவ்வாறு சொன்னபோது, அவர்மீது இருந்த அவர்களுடைய கோபம் தணிந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லுக்கு நெருக்கமாக, “அவர்களுடைய ஆவி அவர்மேலிருந்து தளர்ந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיֶדְכֶם נָתַן אֱלֹהִים
  choice: உங்கள் கையில் கடவுள் ஒப்புக்கொடுத்தார்
  rationale: ‘கையில் கொடுத்தல்’ என்பது ஒருவரின் அதிகாரத்திற்குள் அல்லது கட்டுப்பாட்டிற்குள் ஒப்புக்கொடுப்பதைக் குறிக்கும் எபிரேய மரபுத்தொடர். தமிழில் அதன் உருவகத்தையும் பொருளையும் இயல்பாகத் தக்கவைக்க ‘உங்கள் கையில் ... ஒப்புக்கொடுத்தார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שָׂרֵי מִדְיָן
  choice: மீதியானின் தலைவர்கள்
  rationale: שָׂרִים என்பது ஆட்சியாளர்கள், பிரபுக்கள் அல்லது படைத்தலைவர்களைக் குறிக்கலாம். நவீனத் தமிழில் பதவியை மிகையாகக் குறிப்பாக்காமல் இயல்பாகப் புரிய ‘தலைவர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עֹרֵב וְאֶת זְאֵב
  choice: ஓரேபையும் சேபையும்
  rationale: எபிரேயப் பெயர்களின் ஒலிப்பை நவீனத் தமிழ் எழுத்துமுறையில் அண்மையாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: וּמַה יָּכֹלְתִּי עֲשׂוֹת כָּכֶם
  choice: உங்களோடு ஒப்பிடும்போது நான் செய்தது என்ன?
  rationale: கிதியோன் தன் சாதனையை எப்பிராயீமருடைய சாதனையைவிடச் சிறியதாகக் கூறும் ஒப்பீட்டு, தன்னடக்கமான வினாவின் இயல்பான தமிழாக்கம்.
- source_word: רָפְתָה רוּחָם מֵעָלָיו
  choice: அவர்மீது இருந்த அவர்களுடைய கோபம் தணிந்தது
  rationale: சொல்லுக்கு நெருக்கமாக ‘அவர்களுடைய ஆவி அவர்மேலிருந்து தளர்ந்தது’ என்றாலும், சூழலில் பகைமை அல்லது கோபம் அடங்கியதையே இம்மரபுத்தொடர் குறிக்கிறது. தமிழில் தெளிவாகவும் இயல்பாகவும் ‘கோபம் தணிந்தது’ என வழங்கப்பட்டது; நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּדַבְּרוֹ הַדָּבָר הַזֶּה
  choice: அவர் இவ்வாறு சொன்னபோது
  rationale: ‘அவர் இந்த வார்த்தையைப் பேசியபோது’ என்பது நேரடி வடிவம்; நவீனத் தமிழில் அதே நிகழ்வுறவை இயல்பாக வெளிப்படுத்த ‘அவர் இவ்வாறு சொன்னபோது’ பயன்படுத்தப்பட்டது.
