translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரேய மரபுத்தொடரான ‘கையில் கொடுத்தல்’ பாதுகாக்கப்பட்டு, தெளிவுக்காக ‘ஒப்புக்கொடுத்தார்’ பயன்படுத்தப்பட்டது. இறுதி மரபுத்தொடரின் நேரடி உருவகம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
