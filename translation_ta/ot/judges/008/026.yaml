base_translation:
  language: en
  yaml_path: translation/ot/judges/008/026.yaml
  text: And the weight of the gold rings that he requested was 1,700 shekels of gold[a], besides the crescent ornaments and the pendants and the purple garments that were on the kings of Midian[b], and besides the necklaces that were on the necks of their camels.
translation:
  language: ta
  text: அவன் கேட்ட தங்க வளையங்களின்[b] எடை 1,700 சேக்கல் தங்கம்[a] ஆகும்; இதைத் தவிர, பிறை வடிவ அணிகலன்களும் தொங்கும் அணிகலன்களும் மீதியானின் அரசர்கள் அணிந்திருந்த ஊதா நிற ஆடைகளும் அவர்களுடைய ஒட்டகங்களின் கழுத்துகளில் இருந்த கழுத்தணிகளும் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லுக்கு சொல், “1,700 தங்கம்”; சூழலில் புரிந்துகொள்ளப்படும் எடை அலகான “சேக்கல்” இங்கே சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “வளையங்கள்” என்பதற்கு “காதணிகள்” என்றும் மொழிபெயர்க்கலாம்; எபிரேயச் சொல் காதிலோ மூக்கிலோ அணியும் வளையத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקַל
  choice: எடை
  rationale: இந்தப் பெயர்ச்சொல் வெறும் அளவையல்ல, எடையிட்டு அளக்கப்பட்ட எடையைக் குறிக்கிறது.
- source_word: נִזְמֵי הַזָּהָב
  choice: தங்க வளையங்கள்
  rationale: נזם என்பது காது அல்லது மூக்கில் அணியும் வளையத்தைக் குறிக்கலாம்; எங்கு அணியப்பட்டது என்பதை எபிரேயம் இங்கு குறிப்பிடாததால் பொதுவான ‘வளையங்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר שָׁאָל
  choice: அவன் கேட்டுப் பெற்ற
  rationale: சூழலில் கிதியோன் கொள்ளைப்பொருளிலிருந்து அவற்றைக் கேட்டதும் மக்கள் கொடுத்ததும் அடங்கியிருப்பதால், தமிழில் இயல்பாகப் பொருள் தெளிவுபடுத்தப்படுகிறது.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת זָהָב
  choice: 1,700 சேக்கல்
  rationale: எபிரேயத்தில் ‘1,700 தங்கம்’ என்று நேரடியாக இருந்தாலும், விலையுயர்ந்த உலோகத்தின் எடைக்குரிய புரிந்துகொள்ளப்பட்ட அலகு சேக்கல்; அதை உரையில் வழங்கி அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
- source_word: לְבַד מִן
  choice: இதைத் தவிர
  rationale: முன்னர் சொல்லப்பட்ட எடைக்கணக்கில் பின்வரும் பொருட்கள் சேர்க்கப்படவில்லை என்பதைத் தெளிவாகக் குறிக்கிறது.
- source_word: הַשַּׂהֲרֹנִים
  choice: பிறை வடிவ அணிகலன்கள்
  rationale: பிறை வடிவமுள்ள ஆபரணங்களைச் சுட்டும் சொல்லின் வடிவார்த்தத்தையும் பயன்பாட்டையும் பாதுகாக்கிறது.
- source_word: הַנְּטִפוֹת
  choice: தொங்கட்டான்கள்
  rationale: தொங்கும் வகை அணிகலன்களைக் குறிக்கும் சொல்லுக்கு இயல்பான, குறிப்பிட்ட தமிழ் இணை.
- source_word: בִגְדֵי הָאַרְגָּמָן
  choice: ஊதா நிற ஆடைகள்
  rationale: அரச மரியாதையோடு தொடர்புடைய ஊதா சாயம் அல்லது துணியால் ஆன ஆடைகளை நேரடியாகக் குறிக்கிறது.
- source_word: שֶׁעַל מַלְכֵי מִדְיָן
  choice: மீதியானின் அரசர்கள் அணிந்திருந்த
  rationale: ஆடைகள் அரசர்கள்மேல் இருந்தன என்ற எபிரேய உருவகத்தை இயல்பான தமிழில், அவை அணியப்பட்டிருந்தன என்று வழங்குகிறது.
- source_word: הָעֲנָקוֹת
  choice: கழுத்தணிகள்
  rationale: கழுத்தில் அணியும் ஆபரணங்கள் அல்லது சங்கிலிகள் என்பதைக் குறிக்கிறது; அடுத்த சொற்றொடரில் ஒட்டகங்களின் கழுத்துகள் தெளிவாகக் குறிப்பிடப்படுகின்றன.
- source_word: בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: அவர்களுடைய ஒட்டகங்களின் கழுத்துகளில் இருந்த
  rationale: அணிகலன்கள் இருந்த இடத்தை மூலத்திற்கு நெருக்கமாகவும் இயல்பாகவும் கூறுகிறது.
