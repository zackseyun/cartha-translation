base_translation:
  language: en
  yaml_path: translation/ot/judges/008/022.yaml
  text: Then the men of Israel said to Gideon[a], “Rule over us—you, your son, and your grandson as well—for you have saved us from the hand of Midian.”
translation:
  language: ta
  text: பின்பு இஸ்ரவேலின் ஆண்கள் கிதியோனிடம், “நீர் எங்களை ஆளும்; நீரும் உமது மகனும் உமது மகனின் மகனும்கூட[a]. ஏனெனில், மீதியானின் கையிலிருந்து நீர் எங்களைக் காப்பாற்றினீர்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “நீரும் உமது மகனும் உமது மகனின் மகனும்கூட” என்று அடுத்தடுத்த தலைமுறைகள் வெளிப்படையாகக் குறிப்பிடப்படுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: பின்பு ... என்றார்கள்
  rationale: வாவ் தொடர்வினை கதை நிகழ்வை முன்னெடுத்துச் செல்கிறது; ‘பின்பு’ இயல்பான தமிழ் கதை ஓட்டத்தில் அந்த வரிசையைத் தெளிவாக்குகிறது.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஆண்கள்
  rationale: אִישׁ ஒருமை வடிவில் இருந்தாலும் பன்மை வினையுடன் இங்கு ஒரு கூட்டத்தைக் குறிக்கிறது; பாலினம் சுட்டும் மூலத்தின் கூறையும் இந்த மொழிபெயர்ப்பு காக்கிறது.
- source_word: מְשָׁל בָּנוּ
  choice: எங்களை ஆளும் ... எங்களை ஆளட்டும்
  rationale: מְשָׁל அரசியல் ஆட்சி அல்லது அதிகாரத்தைச் செலுத்துவதைக் குறிக்கிறது. எபிரெயச் சொல்லாட்சியில் ஒரே கட்டளையின் கீழ் மூன்று தலைமுறைகளும் வருவதால், இயல்பான தமிழுக்காக வினை இரு இடங்களில் அமைக்கப்பட்டுள்ளது.
- source_word: גַּם אַתָּה גַּם בִּנְךָ גַּם בֶּן בְּנֶךָ
  choice: நீரும் உமது மகனும் உமது மகனின் மகனும்கூட
  rationale: மீண்டும் மீண்டும் வரும் גַּם அடுத்தடுத்த தலைமுறைகளின் சேர்க்கையையும் வாரிசுரிமை சார்ந்த வலியுறுத்தலையும் காட்டுகிறது; ‘மகனின் மகன்’ மூலத்தின் வெளிப்படையான தலைமுறைச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அவர்களின் கோரிக்கைக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: הוֹשַׁעְתָּנוּ
  choice: நீர் எங்களைக் காப்பாற்றினீர்
  rationale: ישע விடுவித்தல் அல்லது காப்பாற்றுதல் என்ற பொருளைக் கொண்டது; இங்கு இராணுவச் சூழலுக்கு இயல்பாகவும் பரந்த வேதாகமச் சொற்பிணைப்பை முற்றிலும் இழக்காமலும் ‘காப்பாற்றினீர்’ அமைகிறது.
- source_word: מִיַּד מִדְיָן
  choice: மீதியானின் கையிலிருந்து
  rationale: ‘கை’ அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய மரபுத்தொடர்; தமிழிலும் புரிந்துகொள்ளக்கூடியதால் அதன் வேதாகமச் சொல்லோவியம் காக்கப்படுகிறது.
theological_decisions:
- issue: கிதியோனிடம் கோரப்பட்ட ஆட்சியின் தன்மை
  choice: கிதியோன், அவரது மகன், அவரது மகனின் மகன் எனத் தொடரும் பரம்பரை அரசியல் ஆட்சிக்கான கோரிக்கையாக மொழிபெயர்த்தல்
  alternative: பரம்பரைத் தன்மை இல்லாத பொதுவான தலைமைக்கான கோரிக்கை
  rationale: מְשָׁל என்ற கட்டளையும் ‘நீர் ... உமது மகன் ... உமது மகனின் மகன்’ என்ற அடுத்தடுத்த தலைமுறை வரிசையும் தற்காலிக இராணுவத் தலைமையைவிடத் தொடர்ச்சியான பரம்பரை ஆட்சியைக் கோருவதைச் சுட்டுகின்றன. எனினும், மூலத்தில் இல்லாத ‘ராஜா’ அல்லது ‘மன்னராட்சி’ என்ற சொல்லை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுவதற்காக கிதியோனை நோக்கி ‘நீர்/உமது’ பயன்படுத்தப்பட்டுள்ளது. இயல்பான தமிழ் வாக்கிய அமைப்புக்காக ‘ஆளும்’ என்ற ஒரே எபிரெயக் கட்டளை இரண்டு வினை வடிவங்களாக விரிக்கப்பட்டாலும், மூன்று தலைமுறைகளும் ஒரே ஆட்சிக் கோரிக்கைக்குள் வைக்கப்பட்டுள்ளன.
