base_translation:
  language: en
  yaml_path: translation/ot/judges/008/007.yaml
  text: And Gideon said[a], “Therefore, when Yahweh gives Zebah and Zalmunna into my hand, I will thresh your flesh with the thorns of the wilderness and with briers.”
translation:
  language: ta
  text: ஆகையால் கிதியோன், “யாவே சேபாவையும் சல்முன்னாவையும் என் கையில் ஒப்புக்கொடுக்கும்போது, வனாந்தரத்தின் முட்களாலும் முட்செடிகளாலும்[a] உங்கள் சதையைப் போரடிப்பேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “முட்புதர்களாலும்”; இங்கு வரும் எபிரெயச் சொல் குறிக்கும் துல்லியமான தாவர இனம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: அதற்கு
  rationale: முந்தைய வசனத்தில் சுக்கோத்தின் ஆட்கள் மறுத்ததற்குப் பதிலாகவும் அதன் விளைவாகவும் கிதியோன் கூறுவதை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: בְּתֵת
  choice: ஒப்புக்கொடுக்கும்போது
  rationale: בְּ + வினையெச்சப் பெயர் இங்கு காலப்பொருள் தருவதால், எதிர்காலத்தில் நிகழும் ஒப்புக்கொடுத்தலைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: בְּיָדִי
  choice: என் கையில்
  rationale: ஒருவரின் அதிகாரத்துக்குள் ஒப்புக்கொடுக்கப்படுதல் என்ற எபிரெய உருவகத்தைத் தமிழிலும் பாதுகாக்கிறது.
- source_word: וְדַשְׁתִּי
  choice: போரடிப்பேன்
  rationale: தானியத்தைப் போரடிக்கும் செயலைக் குறிக்கும் வேளாண்மை உருவகத்தையும் அச்சுறுத்தலின் வன்மையையும் பாதுகாக்கிறது.
- source_word: בְּשַׂרְכֶם
  choice: உங்கள் சதையை
  rationale: உடலைவிடக் கூர்மையாகவும் நேரடியாகவும் உள்ள ‘சதை’ என்ற பொருளைத் தக்கவைத்து அச்சுறுத்தலின் கொடுமையை வெளிப்படுத்துகிறது.
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: வனாந்தரத்தின் முட்கள்
  rationale: முட்களையும் அவை காணப்படும் வனாந்தரச் சூழலையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: הַבַּרְקֳנִים
  choice: முட்செடிகள்
  rationale: குறிப்பிட்ட தாவர இனம் உறுதியாகத் தெரியாததால், காயப்படுத்தக்கூடிய முட்களுள்ள தாவரத்தைக் குறிக்கும் பொதுவான தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா
  rationale: இவ்வசனம் நான்கெழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது; அதைப் ‘ஆண்டவர்’ என்ற பட்டமாக மாற்றாமல், எபிரெய உச்சரிப்புக்கு நெருக்கமான வடிவில் வழங்குகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘சதை’ மற்றும் ‘போரடிப்பேன்’ என்பவை மூலத்தின் கடுமையான வேளாண்மை உருவகத்தை மென்மைப்படுத்தாமல் பாதுகாக்கின்றன; [a] குறிப்பு அதற்குரிய சொல்லுக்குப் பின்பே இடப்பட்டுள்ளது.
