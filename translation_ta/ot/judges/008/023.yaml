  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ גִּדְע֔וֹן לֹֽא אֶמְשֹׁ֤ל אֲנִי֙ בָּ/כֶ֔ם וְ/לֹֽא יִמְשֹׁ֥ל בְּנִ֖/י בָּ/כֶ֑ם יְהוָ֖ה יִמְשֹׁ֥ל בָּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/023.yaml
  text: But Gideon said to them[a], “I will not rule over you, and my son will not rule over you; Yahweh will rule over you.”
translation:
  language: ta
  text: ஆனால் கிதியோன் அவர்களிடம்[a], “நான் உங்களை ஆளமாட்டேன்; என் மகனும் உங்களை ஆளமாட்டான். யாவே உங்களை ஆள்வார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிதியோன் அவர்களிடம் கூறினார்.” எபிரெய இணைப்புச்சொல்லை வெறும் கதைத் தொடர்ச்சியாகவும் மொழிபெயர்க்கலாம்; இங்கு முந்தைய வசனத்தில் மக்கள் வைத்த கோரிக்கைக்கு கிதியோன் அளிக்கும் மறுப்பை “ஆனால்” தெளிவுபடுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் ... என்றார்
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுத்துச் செல்கிறது; முந்தைய வசனத்தில் மக்கள் வைத்த கோரிக்கையை கிதியோன் மறுப்பதால், சூழலில் உள்ள எதிர்மறைத் திருப்பத்தை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲלֵהֶם
  choice: அவர்களிடம்
  rationale: திசையைக் குறிக்கும் முன்னிடைச்சொல்லையும் மூன்றாம் நபர் பன்மை பின்னொட்டையும் இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: גִּדְעוֹן
  choice: கிதியோன்
  rationale: எபிரெயத் தனிப்பெயருக்கான தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: לֹא אֶמְשֹׁל אֲנִי בָּכֶם
  choice: நான் உங்களை ஆளமாட்டேன்
  rationale: מָשַׁל என்பது இங்கு அரசியல் அதிகாரத்துடன் ஆளுவதைக் குறிக்கிறது. வெளிப்படையாக உள்ள אֲנִי என்பதைக் ‘நான்’ எனப் பேணி, மறுப்பை இயல்பான தமிழ் எதிர்கால வடிவில் வழங்குகிறது.
- source_word: וְלֹא יִמְשֹׁל בְּנִי בָּכֶם
  choice: என் மகனும் உங்களை ஆளமாட்டான்
  rationale: முந்தைய கூற்றின் இணையான அமைப்பையும் வம்சவழி ஆட்சிக்கான மறுப்பையும் ‘மகனும்’ இயல்பாகக் காட்டுகிறது.
- source_word: בְּנִי
  choice: என் மகன்
  rationale: முதல் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள ஒருமைச் சொல்லைத் துல்லியமாகப் பேணுகிறது; ‘சந்ததி’ என்று விரிவாக்கவில்லை.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநான்கெழுத்துப் பெயரை ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் தருகிறது.
- source_word: יְהוָה יִמְשֹׁל בָּכֶם
  choice: யெகோவாவே உங்களை ஆள்வார்
  rationale: முந்தைய இரு கூறுகளிலுள்ள מָשַׁל என்பதற்கு பயன்படுத்திய ‘ஆள்’ என்ற சொல்லையே மீண்டும் கொண்டு, மனித ஆட்சிக்கும் இறை ஆட்சிக்கும் இடையிலான சொல்லாட்சிசார் முரணைத் தக்கவைக்கிறது; ‘-வே’ எழுவாய் எதிர்மறை ஒப்புமையை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கிதியோன் அரசாட்சியைப் போன்ற அதிகாரத்தை மறுப்பது
  choice: கிதியோன் தானும் தன் மகனும் ஆள்வதை மறுத்து, ஆளும் உரிமையை யெகோவாவுக்கே உரியதாகக் கூறுகிறார்.
  alternative: கிதியோன் அரசன் என்ற முறையான பட்டத்தை மட்டும் மறுத்தாலும், நடைமுறையில் ஆட்சியதிகாரத்தைச் செலுத்தினார் என்று வாசித்தல்.
  rationale: எபிரெய உரை கிதியோன், அவனுடைய மகன், யெகோவா ஆகிய மூவரைப் பற்றியும் מָשַׁל (‘ஆள்’) என்ற ஒரே வேர்ச்சொல்லை மீண்டும் பயன்படுத்துகிறது; ‘அரசன்’ என்ற தனிச் சொல்லைப் பயன்படுத்தவில்லை. ஆகவே மொழிபெயர்ப்பு மனித ஆட்சிக்கும் இறை ஆட்சிக்கும் இடையிலான முரணைப் பேணுகிறது; வசனம் கூறாத அரசியல் வகைப்பாட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆள்’ என்ற வினை மூன்று இடங்களிலும் ஒரேபோல் பயன்படுத்தப்பட்டு மூலத்தின் சொல்லாட்சி மீளுருவாக்கம் பேணப்பட்டுள்ளது. தெய்வீகப் பெயருக்கு தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ வடிவம் பயன்படுத்தப்பட்டுள்ளது.
