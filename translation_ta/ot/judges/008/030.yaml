source:
  edition: WLC
  text: וּ/לְ/גִדְע֗וֹן הָיוּ֙ שִׁבְעִ֣ים בָּנִ֔ים יֹצְאֵ֖י יְרֵכ֑/וֹ כִּֽי נָשִׁ֥ים רַבּ֖וֹת הָ֥יוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/030.yaml
  text: Gideon had seventy sons[a], his own offspring, because he had many wives.
translation:
  language: ta
  text: கிதியோனுக்குப் பல மனைவிகள் இருந்ததால், அவனுக்குப் பிறந்த எழுபது மகன்கள் இருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “அவனுடைய தொடையிலிருந்து புறப்பட்டவர்கள்”; இது அவனுடைய உடல்சார் சந்ததியைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגִדְעוֹן הָיוּ
  choice: கிதியோனுக்கு ... இருந்தார்கள்
  rationale: לְ + היה என்ற எபிரெயச் சொற்றொடர் உடைமையைக் குறிக்கிறது. தமிழில் இயல்பாக ‘கிதியோனுக்கு ... இருந்தார்கள்’ என்று வழங்கப்படுகிறது; தொடக்க வாவிற்கு தேவையற்ற காலக் குறிப்பு சேர்க்கப்படவில்லை.
- source_word: שִׁבְעִים בָּנִים
  choice: எழுபது மகன்கள்
  rationale: בָּנִים இங்கு பொதுவான ‘பிள்ளைகள்’ அல்ல, ஆண்பாலைக் குறிப்பாகச் சுட்டும் ‘மகன்கள்’ என்பதாகும்.
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: அவர்கள் அவனிடமிருந்து பிறந்தவர்கள்
  rationale: சொல்லுக்குச் சொல் ‘அவனுடைய தொடை/இடுப்பிலிருந்து புறப்பட்டவர்கள்’ என்ற உடல்சார் மரபுத்தொடர், அவனுடைய நேரடியான உயிரியல் சந்ததியைக் குறிக்கிறது. தமிழில் கண்ணியமாகவும் தெளிவாகவும் அதன் கருத்து வழங்கப்பட்டுள்ளது; நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: எழுபது மகன்கள் இருந்ததற்கான காரணத்தை அறிமுகப்படுத்துவதால் காரண இணைப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: נָשִׁים רַבּוֹת הָיוּ לוֹ
  choice: அவனுக்குப் பல மனைவிகள் இருந்தார்கள்
  rationale: இந்தக் குடும்பச் சூழலில் נָשִׁים என்பது வெறுமனே ‘பெண்கள்’ என்பதல்ல, ‘மனைவிகள்’ என்பதைக் குறிக்கிறது; היה + ל உடைமை உறவைத் தெரிவிக்கிறது.
theological_decisions:
- issue: பல மனைவிகளைக் கொண்ட குடும்பநிலையின் விவரிப்பு
  choice: ‘பல மனைவிகள்’ என்று மதிப்பீடின்றி விவரித்தல்
  alternative: ‘பல பெண்கள்’ என்று உறவை மங்கச் செய்தல் அல்லது ஒப்புதல்/கண்டனத்தைச் சேர்த்தல்
  rationale: வசனம் கிதியோனின் குடும்பநிலையை விவரிக்கிறது; அதை வெளிப்படையாக ஏற்கவோ கண்டிக்கவோ இல்லை. ஆகவே திருமண உறவைத் தெளிவாகக் கூறி, மூலத்தில் இல்லாத ஒழுக்கத் தீர்ப்பைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெய உடைமை அமைப்பு தமிழுக்கேற்றவாறு வழங்கப்பட்டு, உடல்சார் மரபுத்தொடரின் கருத்து முதன்மை உரையில் தெளிவாக்கப்பட்டதும் அதன் நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டதும் ஆகும்.
