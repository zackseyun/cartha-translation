revisions:
- from: அப்போது சுக்கோத்தின் தலைவர்கள், “சேபா, சல்முன்னா ஆகியோரின் கைகள் ஏற்கெனவே உன் கையில் இருக்கின்றனவா, நாங்கள் உன் படைக்கு உணவு கொடுப்பதற்கு?” என்றார்கள்.[a]
  to: அப்போது சுக்கோத்தின் தலைவர்கள், “சேபாவும் சல்முன்னாவும் ஏற்கெனவே உன் பிடியில் இருக்கிறார்களா? நாங்கள் உன் படைக்கு அப்பம் கொடுக்க வேண்டுமா?” என்றார்கள்.
  rationale: The revision expresses the Hebrew hand/power idiom in natural Tamil without adding conjectural imagery, retains the leaders’ sarcastic ‘already/now’ challenge, and restores the specific reference to bread. The two rhetorical elements are rendered as two Tamil questions for clarity while preserving the meaning.
