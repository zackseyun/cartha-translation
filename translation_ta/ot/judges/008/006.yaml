source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ שָׂרֵ֣י סֻכּ֔וֹת הֲ֠/כַף זֶ֧בַח וְ/צַלְמֻנָּ֛ע עַתָּ֖ה בְּ/יָדֶ֑/ךָ כִּֽי נִתֵּ֥ן לִֽ/צְבָאֲ/ךָ֖ לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/006.yaml
  text: Then the leaders of Succoth said, “Are the hands of Zebah and Zalmunna already in your hand, that we should give bread to your army?”
translation:
  language: ta
  text: அப்போது சுக்கோத்தின் தலைவர்கள், “சேபாவும் சல்முன்னாவும் ஏற்கெனவே உன் பிடியில் இருக்கிறார்களா? நாங்கள் உன் படைக்கு அப்பம் கொடுக்க வேண்டுமா?” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי סֻכּוֹת
  choice: சுக்கோத்தின் தலைவர்கள்
  rationale: שָׂרִים என்பது நகரின் ஆட்சியாளர்கள் அல்லது தலைவர்களைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் பரந்த பொருளைத் தக்கவைத்தும் ‘தலைவர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הֲכַף זֶבַח וְצַלְמֻנָּע
  choice: சேபா, சல்முன்னா ஆகியோரின் கைகள்
  rationale: כַּף என்பதன் நேரடிப் பொருளான ‘கைகள்’ தக்கவைக்கப்பட்டது. இது அவர்களையே குறிக்கும் ஆகுபெயராகவோ, அவர்கள் பிடிபட்டதற்கான சான்றாக அவர்களது துண்டிக்கப்பட்ட கைகளைக் குறிக்கும் படிமமாகவோ புரியக்கூடியதால் மூலத்தின் கடுமையான தெளிவின்மை பாதுகாக்கப்படுகிறது.
- source_word: עַתָּה
  choice: ஏற்கெனவே
  rationale: இந்த ஏளனக் கேள்வியில் ‘இப்போதே/ஏற்கெனவே’ என்ற காலநிலைப் பொருள் உள்ளது; எதிரிகளை இன்னும் பிடிக்காத நிலையில் உதவி கேட்பதைத் தலைவர்கள் கேலி செய்வதை ‘ஏற்கெனவே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְיָדֶךָ
  choice: உன் கையில்
  rationale: கிதியோனை நோக்கிய எபிரெய ஒருமை இரண்டாம் நபரும், ‘உன் அதிகாரத்தில்/பிடியில்’ என்ற மொழிப்படிமமும் நேரடியாகத் தக்கவைக்கப்பட்டன.
- source_word: לִצְבָאֲךָ
  choice: உன் படைக்கு
  rationale: צָבָא இங்கு கிதியோனோடு போரிடும் படைவீரர் அணியைக் குறிக்கிறது; ‘படை’ சுருக்கமான, இயல்பான சமமான சொல்.
- source_word: לֶחֶם
  choice: உணவு
  rationale: לֶחֶם என்பதன் அடிப்படைப் பொருள் ‘அப்பம்’ என்றாலும், படைக்கு வேண்டிய பொதுவான உணவுப்பொருளை இங்கு குறிக்கிறது; தமிழ் சூழலில் ‘உணவு’ நோக்கப்பட்ட பரந்த பொருளைத் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: ‘கைகள்’ என்பதன் குறிப்பு
  choice: மூலத்தின் ‘கைகள்’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘சேபாவையும் சல்முன்னாவையும் நீ ஏற்கெனவே பிடித்துவிட்டாயா?’ என்று பொருளை வெளிப்படையாகக் கூறுதல்
  rationale: அந்தச் சொற்றொடர் எதிரிகளைப் பிடித்திருப்பதைக் குறிக்கும் ஆகுபெயராக இருக்கலாம்; அவர்களுடைய கைகள் நேரடியாகக் கிதியோனிடம் உள்ளனவா என்ற கேலியாகவும் இருக்கலாம். விளக்க மொழிபெயர்ப்பு இந்தப் பலஅர்த்தத் தன்மையைத் தேவையின்றி தீர்த்துவிடும்.
translation_notes:
  register: நவீன, தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தலைவர்களின் ஏளனமும் உதவி மறுப்பும் கேள்வி வடிவில் பாதுகாக்கப்பட்டுள்ளன. பெயர்கள் பொதுவான தமிழ் ஒலிபெயர்ப்பில் வழங்கப்பட்டுள்ளன.
