base_translation:
  language: en
  yaml_path: translation/ot/judges/008/024.yaml
  text: 'Then Gideon said to them, “Let me ask one request of you: each man, give me an earring from his spoil.” For they had gold earrings, because they were Ishmaelites.'
translation:
  language: ta
  text: 'அப்போது கிதியோன் அவர்களிடம், “நான் உங்களிடம் ஒரு வேண்டுகோள் வைக்கிறேன்: ஒவ்வொருவரும் தன் கொள்ளைப் பொருளிலிருந்து ஒரு காதணியை எனக்குக் கொடுங்கள்” என்றான். அவர்கள் இஸ்மவேலர்கள் என்பதால், அவர்களிடம் தங்கக் காதணிகள் இருந்தன.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶשְׁאֲלָה מִכֶּם שְׁאֵלָה
  choice: நான் உங்களிடம் ஒரு வேண்டுகோள் வைக்கிறேன்
  rationale: எபிரெய மொழியின் வலியுறுத்தும் சொற்பிறழ்வை இயல்பான நவீனத் தமிழில் வேண்டுகோள் வைப்பதாகத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אִישׁ
  choice: ஒவ்வொருவரும்
  rationale: பகிர்ந்தளிக்கும் பொருளில் வரும் ‘ஒவ்வொரு மனிதனும்’ என்பதை இயல்பான, அனைவரையும் குறிக்கும் தமிழில் வழங்குகிறது.
- source_word: נֶזֶם
  choice: காதணி
  rationale: சொல் மூக்கு வளையத்தையோ காதணியையோ குறிக்கலாம்; இச்சூழலிலும் பாரம்பரியப் புரிதலிலும் காதணி பொருத்தமானது.
- source_word: שְׁלָלוֹ
  choice: தங்கள் கொள்ளைப்பொருளிலிருந்து
  rationale: ஒவ்வொருவருக்கும் உரிய போர்க் கொள்ளையின் பங்கைக் குறிக்கும் உடைமைப் பொருளைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: יִשְׁמְעֵאלִים
  choice: இஸ்மவேலர்கள்
  rationale: மூலத்தில் உள்ள இனக்குழுப் பெயரை வழக்கமான தமிழ் வேதாகம வடிவில் தருகிறது.
theological_decisions:
- issue: மிதியானியர்கள் இஸ்மவேலர்கள் என அழைக்கப்படுதல்
  choice: மூலத்தின் ‘இஸ்மவேலர்கள்’ என்ற அடையாளத்தை அப்படியே வைத்தல்
  alternative: இதை ‘மிதியானியர்கள்’ என்று மாற்றுதல் அல்லது இரு பெயர்களின் உறவை விளக்குதல்
  rationale: வசனத்தின் சொந்த இன அடையாளச் சொல்லையும் அதன் வரலாற்று/இலக்கியத் திணறலையும் விளக்கவுரை மூலம் தீர்க்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதும். உரையாடல் நேரடியாகவும், மூலத்தின் காரணவாக்கியம் தெளிவாகவும் வைக்கப்பட்டுள்ளது.
