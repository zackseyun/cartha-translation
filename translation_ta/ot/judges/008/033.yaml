source:
  edition: WLC
  text: וַ/יְהִ֗י כַּֽ/אֲשֶׁר֙ מֵ֣ת גִּדְע֔וֹן וַ/יָּשׁ֨וּבוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּזְנ֖וּ אַחֲרֵ֣י הַ/בְּעָלִ֑ים וַ/יָּשִׂ֧ימוּ לָ/הֶ֛ם בַּ֥עַל בְּרִ֖ית לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/033.yaml
  text: And it happened that[a], when Gideon died, the sons of Israel turned back and prostituted themselves after the Baals[b], and they made Baal-berith their god.
translation:
  language: ta
  text: கிதியோன் இறந்தபோது, இஸ்ரவேல் மக்கள் மீண்டும் பாகால்களைப் பின்பற்றி விபசாரம் செய்தார்கள்[a]. பாகால்-பெரீத்தை[b] தங்களுக்குக் கடவுளாக வைத்துக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாகால்களின் பின்னால் சென்று வேசித்தனம் செய்தார்கள்.” சிலைவழிபாட்டின் மூலம் இஸ்ரவேல் காட்டிய உடன்படிக்கை உண்மையின்மையை எபிரெய மொழி பாலியல் உருவகத்தால் கூறுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “பாகால்-பெரீத்” என்பதற்கு “உடன்படிக்கையின் பாகால்” அல்லது “உடன்படிக்கையின் ஆண்டவன்” என்று பொருள் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: இறந்தபோது
  rationale: இந்த எபிரெயக் கதைத் தொடர் ஒரு கால மாற்றத்தை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பான காலவாக்கியமாக மொழிபெயர்க்கப்பட்டது; தனியே ‘அப்போது நிகழ்ந்தது’ என்று சேர்ப்பது தமிழில் தேவையற்ற கனத்தை உண்டாக்கும்.
- source_word: וַיָּשׁוּבוּ
  choice: மீண்டும்
  rationale: இது உடல்ரீதியான திரும்புதலை அல்ல, முந்தைய சிலைவழிபாட்டுக்குத் திரும்பிச் சென்றதைச் சுட்டுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: இங்கு முழு உடன்படிக்கைச் சமூகத்தையும் குறிக்கும் எபிரெய மரபுத்தொடருக்கு இயல்பான, அனைவரையும் உள்ளடக்கும் நவீனத் தமிழ் வடிவம்.
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: பின்பற்றி விபசாரம் செய்தார்கள்
  rationale: சிலைவழிபாட்டை உடன்படிக்கைத் துரோகமாகக் காட்டும் மூலத்தின் பாலியல் உருவகத்தின் தீவிரம் தணிக்கப்படாமல் காக்கப்படுகிறது.
- source_word: הַבְּעָלִים
  choice: பாகால்கள்
  rationale: பாகால் வழிபாட்டின் பல உள்ளூர் வடிவங்கள் அல்லது தெய்வங்களைச் சுட்டும் பன்மை அப்படியே காக்கப்படுகிறது.
- source_word: וַיָּשִׂימוּ לָהֶם
  choice: தங்களுக்குக் ... வைத்துக்கொண்டார்கள்
  rationale: ஒரு தெய்வத்தைத் தங்களுக்குரியதாக ஏற்றுக்கொண்டு நிறுவியதைக் குறிக்கும் שׂים + לָהֶם என்பதன் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּעַל בְּרִית
  choice: பாகால்-பெரீத்
  rationale: இது ஒரு குறிப்பிட்ட வழிபாட்டுப் பெயர் என்பதால் முதன்மை உரையில் ஒலிபெயர்க்கப்பட்டு, அதன் சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֵאלֹהִים
  choice: கடவுளாக
  rationale: லாமேத் முன்னொட்டு இங்கு நியமித்தல் அல்லது ஏற்றுக்கொள்ளுதலைக் குறிக்கிறது; לָהֶם உடன் சேர்ந்துள்ள உடைமைப் பொருள் ‘தங்களுக்குக்’ என்பதில் வெளிப்படுகிறது.
theological_decisions:
- issue: சிலைவழிபாட்டைக் குறிக்கும் பாலியல் உருவகத்தைத் தக்கவைத்தல்
  choice: பாகால்களைப் பின்பற்றி விபசாரம் செய்தார்கள்
  alternative: பாகால்களைப் பின்பற்றி கடவுளுக்கு உண்மையற்றவர்களானார்கள்
  rationale: זנה என்ற வினை திட்டவட்டமான பாலியல் உருவகத்தைப் பயன்படுத்தி இஸ்ரவேலின் உடன்படிக்கைத் துரோகத்தைச் சித்தரிக்கிறது. அதை பொதுவான ‘உண்மையின்மை’ என்று மென்மையாக்காமல் அதன் இறையியல் அழுத்தம் காக்கப்படுகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இங்கு ஆண்களை மட்டும் அல்லாமல் இஸ்ரவேல் சமூகத்தை மொத்தமாகக் குறிக்கும் எபிரெய மரபுத்தொடர் என்பதால், தமிழில் பாலினத்தைத் தவறாகக் குறுக்காத இயல்பான கூட்டுப்பெயர் தேர்ந்தெடுக்கப்பட்டது.
- issue: பாகால்-பெரீத் என்ற வழிபாட்டுப் பெயர்
  choice: பெயரை ஒலிபெயர்த்து, பொருளை அடிக்குறிப்பில் கூறுதல்
  alternative: உடன்படிக்கையின் பாகால் / உடன்படிக்கையின் ஆண்டவன்
  rationale: பெயரை முதன்மை உரையில் மொழிபெயர்த்தால் அது பொதுவான பட்டமா குறிப்பிட்ட தெய்வப்பெயரா என்ற வேறுபாடு மங்கலாம். ஒலிபெயர்ப்பு வரலாற்று வழிபாட்டுப் பெயரைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘விபசாரம் செய்தார்கள்’ என்பது திட்டமிட்டே வலுவாக வைக்கப்பட்டு, அது சிலைவழிபாட்டுக்கான உருவகம் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது. ‘பாகால்கள்’ என்ற பன்மையும் ‘பாகால்-பெரீத்’ என்ற குறிப்பிட்ட பெயரும் வேறுபடுத்தப்பட்டுள்ளன.
