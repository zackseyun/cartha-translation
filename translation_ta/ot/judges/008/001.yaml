  source_fidelity: 'மூலத்தின் கருத்து பெரும்பாலும் துல்லியமாக உள்ளது: எப்பிராயீமின் கூட்டுப்பொருள், அழைக்கப்படாத குறை, மீதியானுக்கு எதிரான போர், பின்னர் ஏற்பட்ட தீவிரமான மோதல் ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் וַיֹּאמְרוּ (''அவர்கள் சொன்னார்கள்'') என்பதற்கு ''கேட்டார்கள்'' என்பது சற்றே குறுகலானது; மேலும் வினாவின் ''இந்தக் காரியம்'' என்ற வடிவத்தைத் தக்கவைப்பது மூலத்திற்கு நெருக்கமானது.'
  naturalness: திருத்திய உரை நவீனத் தரமான தமிழில் இயல்பாகவும், மரியாதை ஒருமை உரையாடலுக்கும் பன்மைச் செயற்பாடுகளுக்கும் ஏற்றவாறும் உள்ளது. 'வாதிட்டார்கள்' என்பது இச்சூழலின் வாய்மொழி மோதலை இயல்பாக வெளிப்படுத்துகிறது.
