base_translation:
  language: en
  yaml_path: translation/ot/judges/008/001.yaml
  text: Then the men of Ephraim said to him[a], “What is this thing you have done to us[b], not calling us when you went to fight against Midian?” And they contended with him strongly.
translation:
  language: ta
  text: அப்போது எப்பிராயீம் கோத்திரத்தார்[a] அவரிடம், “நீர் மீதியானியருக்கு எதிராகப் போரிடச் சென்றபோது எங்களை அழைக்காமல், எங்களுக்கு இந்தக் காரியத்தை ஏன் செய்தீர்?” என்று கூறினார்கள். அவர்கள் அவரோடு கடுமையாக வாதிட்டார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் எழுத்துப்படி, “எப்பிராயீமின் மனிதன்”; இது எப்பிராயீம் கோத்திரத்தாரைக் கூட்டாகக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: வேறு விதமாக, “அவரோடு மிகவும் தீவிரமாக வாதிட்டார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶפְרַיִם
  choice: எப்பிராயீம் கோத்திரத்தார்
  rationale: אִישׁ ஒருமை வடிவில் இருந்தாலும், எப்பிராயீம் என்னும் கோத்திரப் பெயருடன் இங்கு கூட்டுப் பொருளில் வருகிறது; தொடர்ந்து வரும் பன்மை வினைகளும் இதை உறுதிப்படுத்துகின்றன. இயல்பான நவீனத் தமிழில் கோத்திர மக்களைத் தெளிவாகக் குறிக்கிறது.
- source_word: מָה הַדָּבָר הַזֶּה עָשִׂיתָ לָּנוּ
  choice: எங்களுக்கு இப்படிச் செய்தது ஏன்?
  rationale: எபிரெயச் சொற்றொடர் எழுத்துப்படி ‘எங்களுக்கு நீர் செய்த இந்தக் காரியம் என்ன?’ எனினும், குற்றஞ்சாட்டும் வினாவின் இயல்பான தமிழ்ப் பொருளையும் வலிமையையும் ‘இப்படிச் செய்தது ஏன்?’ தக்கவைக்கிறது.
- source_word: לְבִלְתִּי קְרֹאות לָנוּ
  choice: எங்களை அழைக்காமல்
  rationale: கָרָא என்பதன் அடிப்படைப் பொருளான ‘அழைத்தல்’ என்பதைக் காக்கிறது; ‘வரவழைக்காமல்’ அல்லது ‘அணிதிரட்டாமல்’ என்று சூழலை மிகையாக விளக்கவில்லை.
- source_word: כִּי הָלַכְתָּ לְהִלָּחֵם בְּמִדְיָן
  choice: நீர் மீதியானியருக்கு எதிராகப் போரிடச் சென்றபோது
  rationale: כִּי இங்கு குறை நிகழ்ந்த காலச் சூழலை அறிமுகப்படுத்துவதாக எடுத்துக்கொள்ளப்பட்டுள்ளது. בְּ உடன் வரும் போரிடுதல் வினையின் எதிர்ப்புப் பொருளை ‘எதிராக’ வெளிப்படுத்துகிறது; ‘மீதியான்’ என்பது இங்கு மக்களைக் குறிப்பதால் தமிழில் ‘மீதியானியர்’ என வழங்கப்படுகிறது.
- source_word: וַיְרִיבוּן אִתּוֹ בְּחָזְקָה
  choice: அவரோடு மிகக் கடுமையாக வாக்குவாதம் செய்தார்கள்
  rationale: ריב இச்சூழலில் வாய்மொழிக் கண்டனமும் சச்சரவும் கொண்ட மோதலைக் குறிக்கிறது. בְּחָזְקָה அதன் தீவிரத்தைச் சுட்டுவதால் ‘மிகக் கடுமையாக’ என மொழிபெயர்க்கப்பட்டுள்ளது.
