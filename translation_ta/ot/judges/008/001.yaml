translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. கிதியோனை நோக்கிய ஒருமை ஆண்பால் வினைகளுக்காக ‘நீர்’ மரியாதை ஒருமை பயன்படுத்தப்பட்டாலும், எப்பிராயீம் கோத்திரத்தாருக்கான வினைகள் பன்மையில் வைக்கப்பட்டுள்ளன. மூலத்தில் பெயர் இல்லாததால் ‘கிதியோன்’ என்று உரைக்குள் சேர்க்கப்படவில்லை.
