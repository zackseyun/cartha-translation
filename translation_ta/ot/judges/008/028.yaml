  text: וַ/יִּכָּנַ֣ע מִדְיָ֗ן לִ/פְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/לֹ֥א יָסְפ֖וּ לָ/שֵׂ֣את רֹאשָׁ֑/ם וַ/תִּשְׁקֹ֥ט הָ/אָ֛רֶץ אַרְבָּעִ֥ים שָׁנָ֖ה בִּ/ימֵ֥י גִדְעֽוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/028.yaml
  text: So Midian was subdued before the sons of Israel[a], and they did not again lift up their head. And the land had rest forty years in the days of Gideon.
translation:
  language: ta
  text: இவ்வாறு மீதியான் இஸ்ரவேல் மக்களின் முன் அடக்கப்பட்டது; மீதியான் மீண்டும் தலைதூக்கவில்லை.[a] கிதியோனின் நாட்களில் நாடு நாற்பது ஆண்டுகள் அமைதியாயிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீண்டும் வலிமை பெறவில்லை”; சொற்சொல்லாக, “மீண்டும் தங்கள் தலையை உயர்த்தவில்லை.”
    reason: “தலையை உயர்த்துதல்” என்ற எபிரெய மரபுத்தொடர் மீண்டும் வலிமை அல்லது துணிவு பெறுவதைக் குறிக்கலாம்; அதன் உருவகமும் விளக்கப் பொருளும் இரண்டையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: அடக்கப்பட்டது
  rationale: כנע என்பதன் நிஃபால் வடிவம், மீதியான் கீழ்ப்படுத்தப்பட்டதைச் சுட்டுகிறது. போர்ச் சூழலில் “அடக்கப்பட்டது” என்பது அதன் செயப்பாட்டு உணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: לִפְנֵי
  choice: முன்
  rationale: இஸ்ரவேல் மக்களுடன் ஒப்பிடுகையில் மீதியான் கீழ்ப்படுத்தப்பட்ட நிலையை உணர்த்தும் எபிரெய மரபுத்தொடரைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: இது ஒரு தேசிய இனக்குழுவைக் குறிக்கும் வழக்கமான எபிரெயப் பெயர். “இஸ்ரவேலின் மகன்கள்” என்ற சொற்சொல் வடிவத்தைவிட “இஸ்ரவேல் மக்கள்” நவீனத் தமிழில் இயல்பாகவும் பொருள் துல்லியமாகவும் உள்ளது.
- source_word: וְלֹא יָסְפוּ
  choice: மீண்டும் … இல்லை
  rationale: יסף உடன் வரும் வினையெச்ச அமைப்பு இங்கு முன்பு செய்ததை மறுபடியும் செய்யாததைக் குறிக்கிறது.
- source_word: לָשֵׂאת רֹאשָׁם
  choice: தலைதூக்கவில்லை
  rationale: புதுப்பிக்கப்பட்ட வலிமை, துணிவு அல்லது ஆதிக்கத்தைச் சுட்டும் மூல உருவகத்தை “தலைதூக்கு” என்ற இயல்பான தமிழ் மரபுத்தொடர் காக்கிறது.
- source_word: וַתִּשְׁקֹט
  choice: அமைதியாயிருந்தது
  rationale: நியாயாதிபதிகள் நூலில் போர் இல்லாத ஓய்வுக் காலத்தைச் சுருக்கமாகக் குறிக்கும் வினை. “அமைதியாயிருந்தது” என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: இங்கு இஸ்ரவேலின் நிலப்பரப்பையும் அங்கு வாழும் சமூகத்தையும் கூட்டாகக் குறிக்கிறது; “நாடு” சூழலுக்கு ஏற்ற இயல்பான தமிழ் தேர்வு.
- source_word: אַרְבָּעִים שָׁנָה
  choice: நாற்பது ஆண்டுகள்
  rationale: எண்ணிக்கையை நேரடியாகவும் விரிவாக்கமின்றியும் மொழிபெயர்க்கிறது.
- source_word: בִּימֵי גִדְעוֹן
  choice: கிதியோனின் நாட்களில்
  rationale: மூலத்தின் காலக்குறிப்பு வடிவத்தைப் பாதுகாத்து, அது கிதியோனின் முழு வாழ்நாளையா அல்லது அவரது தலைமைக் காலத்தையா குறிக்கிறது என்பதைத் தேவையின்றி முடிவுசெய்யாமல் விடுகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இது பாலினத்தை வலியுறுத்தும் தனிநபர் குறிப்பு அல்ல, ஒரு வழக்கமான தேசியப் பெயர். ஆகவே நவீனத் தமிழில் இயல்பான தேசியக் குறிப்பைப் பயன்படுத்துவது பொருளைச் சரியாகத் தருகிறது.
- issue: לָשֵׂאת רֹאשָׁם என்ற எபிரெய உருவகத்தைப் பாதுகாத்தல்
  choice: தலைதூக்கவில்லை
  alternative: மீண்டும் வலிமை பெறவில்லை
  rationale: மூலத்தின் காட்சிப்படையான உருவகத்தையும், அது வலிமை, துணிவு, ஆதிக்கம் ஆகியவற்றில் எதைக் குறிப்பாக வலியுறுத்துகிறது என்ற திறந்த தன்மையையும் முதன்மை உரை பாதுகாக்கிறது; விளக்கப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “தலைதூக்கவில்லை” என்ற இயல்பான தமிழ் மரபுத்தொடர் மூல உருவகத்தைத் தக்கவைக்கிறது; “கிதியோனின் நாட்களில்” என்ற வடிவம் காலக்குறிப்பின் தெளிவின்மையைப் பாதுகாக்கிறது.
