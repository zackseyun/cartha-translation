base_translation:
  language: en
  yaml_path: translation/ot/judges/008/015.yaml
  text: Then he came to the men of Succoth and said[a], “Here are Zebah and Zalmunna, about whom you taunted me, saying, ‘Are Zebah and Zalmunna already in your hand[b], that we should give bread to your weary men?’”
translation:
  language: ta
  text: பின்பு அவன் சுக்கோத்தின் ஆண்களிடம் வந்து, “இதோ, சேபாவும் சல்முன்னாவும்! இவர்களைக் குறித்துத்தான் நீங்கள், ‘சேபாவும் சல்முன்னாவும் இப்போதே உன் கையில் இருக்கிறார்களா[a]? நாங்கள் உன் களைப்படைந்த ஆட்களுக்கு அப்பம் கொடுக்க வேண்டுமா?’ என்று சொல்லி என்னை ஏளனம் செய்தீர்கள்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “சேபா, சல்முன்னா ஆகியோரின் கை அல்லது உள்ளங்கை இப்போது உன் கையில் இருக்கிறதா?” இது, “அவர்களை நீ ஏற்கெனவே பிடித்துவிட்டாயா?” என்று பொருள்படும் மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: b
    text: “என்னை நிந்தித்தீர்கள்” அல்லது “என்னைக் கேலி செய்தீர்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் இகழ்ச்சியுடன் பழித்துரைக்கும் பொருளைக் கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: சுக்கோத்தின் ஆண்கள்
  rationale: மூலத்தில் உள்ள ‘சுக்கோத்தின் ஆண்கள்’ என்ற பாலினத்தையும் சமூகக் குறிப்பையும் காக்கிறது; சூழலில் கிதியோனுக்கு மறுமொழி கூறிய ஆண் குடிமக்கள் அல்லது தலைவர்கள் குறிக்கப்படுகின்றனர்.
- source_word: הִנֵּה
  choice: இதோ
  rationale: முன்னிலையில் பிடிபட்டிருக்கும் அரசர்களைச் சுட்டிக் காட்டும் கவன ஈர்ப்புச் சொல்லாக இயல்பாக அமைகிறது.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: சேபாவும் சல்முன்னாவும்
  rationale: எபிரெய தனிப்பெயர்களைத் தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: אֲשֶׁר חֵרַפְתֶּם אוֹתִי
  choice: இவர்களைக் குறித்துத்தான் ... என்னை ஏளனம் செய்தீர்கள்
  rationale: חרף என்பதிலுள்ள இகழ்ச்சியும் நிந்தனையான சவாலும் ‘ஏளனம் செய்தீர்கள்’ என்பதில் தெளிவாகிறது; தொடர்புப் பெயரெச்சம் அந்த ஏளனம் இவ்விரு அரசர்களைக் குறித்தது என்பதைப் பாதுகாக்கிறது.
- source_word: לֵאמֹר
  choice: என்று சொல்லி
  rationale: முந்தைய நேரடிக் கூற்றை அறிமுகப்படுத்தும் இயல்பான தமிழ் மேற்கோள் அமைப்பு.
- source_word: הֲכַף ... בְּיָדֶךָ
  choice: உன் கையில் இருக்கிறார்களா
  rationale: பிடிபட்டு அதிகாரத்துக்குள் இருப்பதைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் காக்கிறது; மூலத்தின் அசாதாரண ‘உள்ளங்கை/கை’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַתָּה
  choice: இப்போதே
  rationale: அவர்களை இன்னும் பிடிக்கவில்லை என்ற கேலியான சவாலில் வரும் ‘இப்போது/ஏற்கெனவே’ என்ற வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: כִּי נִתֵּן
  choice: நாங்கள் ... கொடுப்பதற்கு
  rationale: 'வினாவால் சுட்டப்படும் விளைவைத் தமிழில் இயல்பாக இணைக்கிறது: அவர்கள் பிடிபட்டிருந்தால்தான் உணவு கொடுக்க வேண்டுமா என்ற கேலியான மறுப்பு.'
- source_word: לַאֲנָשֶׁיךָ הַיְּעֵפִים
  choice: உன் களைப்படைந்த ஆட்களுக்கு
  rationale: துரத்திச் சென்றதால் ஏற்பட்ட கடும் சோர்வை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: לָחֶם
  choice: அப்பம்
  rationale: மூலத்தின் நேரடி உணவுச் சொல்லைப் பாதுகாக்கிறது; அது சூழலில் உணவைப் பொதுவாகவும் குறிக்கலாம்.
