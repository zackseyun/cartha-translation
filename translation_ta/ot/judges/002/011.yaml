source:
  edition: WLC
  text: וַ/יַּעֲשׂ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יַּעַבְד֖וּ אֶת הַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/011.yaml
  text: And the sons of Israel did what was evil in the sight of Yahweh[b][a], and they served the Baals.
translation:
  language: ta
  text: இஸ்ரவேலின் மக்கள் யாவேயின் பார்வையில் தீமையானதைச் செய்து, பாகால்களுக்குப் பணிவிடை செய்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாகால்களை வழிபட்டார்கள்.” இங்குள்ள எபிரெய வினை வழிபாட்டில் செய்யப்படும் பணிவிடையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: செய்து
  rationale: עשה என்பதன் இயல்பான பொருள் ‘செய்’. தொடர் வினை அமைப்பில் எபிரெய வாவ்-தொடர்ச்சியை இயல்பான தமிழில் இணைக்கிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கும் மரபுத்தொடர்; ‘மக்கள்’ என்பது பாலின வரம்பைத் தவிர்த்து இயல்பான நவீனத் தமிழை வழங்குகிறது.
- source_word: אֶת הָרַע
  choice: தீமையானதை
  rationale: ‘தீமையைச் செய்தார்கள்’ என்பதும் சாத்தியம்; ஆனால் ‘தீமையானதைச் செய்தார்கள்’ என்பது குறிப்பிட்ட எபிரெய மரபுத்தொடரின் மதிப்பீட்டு வலிமையை இயல்பாகப் பாதுகாக்கிறது.
- source_word: בְעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: சொல்லுக்கு சொல் ‘யாவேயின் கண்களில்’; தமிழில் ‘பார்வையில்’ என்பது தெய்வீக மதிப்பீட்டைக் குறிக்கும் இயல்பான மரபுத்தொடர்.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமமான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיַּעַבְדוּ
  choice: பணிவிடை செய்தார்கள்
  rationale: עבד என்பதில் சேவையும் வழிபாட்டு அர்ப்பணிப்பும் அடங்கும். ‘பணிவிடை செய்தார்கள்’ அதன் அடிப்படைச் சேவைப் பொருளைப் பாதுகாக்கிறது; சூழலில் வழிபாடு உட்பொருளாக உள்ளது.
- source_word: הַבְּעָלִים
  choice: பாகால்கள்
  rationale: பாகால் தெய்வத்தின் பல உள்ளூர் வடிவங்கள் அல்லது வெளிப்பாடுகளைக் குறிக்கும் எபிரெயப் பன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்னும் உடன்படிக்கைத் திருநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட திருநாமமே நேரடியாக உள்ளது. பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: עבד என்பதைக் ‘பணிவிடை செய்தார்கள்’ அல்லது ‘வழிபட்டார்கள்’ என்று வழங்குதல்
  choice: பணிவிடை செய்தார்கள்
  alternative: வழிபட்டார்கள்
  rationale: சூழல் சிலைவழிபாட்டைத் தெளிவாகக் குறித்தாலும், எபிரெய வினையின் விரிந்த ‘சேவை செய்’ பொருளையும் யாவேக்கு ஊழியம் செய்வதற்கு எதிரான உடன்படிக்கை முரண்பாட்டையும் தேர்ந்தெடுத்த சொல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘இஸ்ரவேலின் மக்கள்’ என்பது ‘இஸ்ரவேலின் மகன்கள்’ என்ற எபிரெய மரபுத்தொடரின் சமூகக் குறிப்பை இயல்பாக வெளிப்படுத்துகிறது. ‘பாகால்கள்’ எனப் பன்மை பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்புக் குறி சம்பந்தப்பட்ட வாக்கிய முடிவில் இடப்பட்டுள்ளது.
