  source_fidelity: மூல எபிரெயத்தின் வினைநிலை, ‘உங்கள் முன்னிலையிலிருந்து’ என்ற இடவியல் சொற்றொடர், வெளியேற்ற மறுக்கும் அறிவிப்பு, மற்றும் தெய்வங்கள் ‘கண்ணி’ ஆகும் உருவகம் ஆகியவை நம்பகமாகத் தரப்பட்டுள்ளன. לְצִדִּים என்ற கடினமான மசோரா வாசகத்திற்கு ‘உங்களுக்கு எதிரிகளாக’ என்பது சூழலுக்கு ஏற்ற, அளவான விளக்க மொழிபெயர்ப்பு; அது அடிக்குறிப்பால் வெளிப்படையாகக் குறிக்கப்படுகிறது.
  naturalness: நவீன நிலையான தமிழில் வாசகம் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. மேற்கோள் அமைப்பும் எதிர்கால வினை வடிவங்களும் தெளிவானவை.
  terminology: ‘துரத்திவிட’, ‘தெய்வங்கள்’, ‘கண்ணி’ ஆகியவை பொருத்தமானவை. ‘எதிரிகளாக’ என்பது மூலத்தின் சொற்சொல் வடிவத்தை மாற்றி அமைக்காமல் அதன் சூழல்சார் பகைமையான விளைவைத் தருகிறது; அடிக்குறிப்பு இந்த மொழிபெயர்ப்பு முடிவுக்கு தேவையான சமநிலையை வழங்குகிறது.
