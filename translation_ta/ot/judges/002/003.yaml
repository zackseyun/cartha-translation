id: JDG.2.3
reference: Judges 2:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/גַ֣ם אָמַ֔רְתִּי לֹֽא אֲגָרֵ֥שׁ אוֹתָ֖/ם מִ/פְּנֵי/כֶ֑ם וְ/הָי֤וּ לָ/כֶם֙ לְ/צִדִּ֔ים וֵ/אלֹ֣הֵי/הֶ֔ם יִהְי֥וּ לָ/כֶ֖ם לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/003.yaml
  text: So I also said[a], ‘I will not drive them out from before you; they will become adversaries to you, and their gods will become a snare to you.’
translation:
  language: ta
  text: ஆகவே நானும், ‘அவர்களை உங்கள் முன்னிலையிலிருந்து துரத்திவிட மாட்டேன்; அவர்கள் உங்களுக்கு எதிரிகளாக இருப்பார்கள்[a]; அவர்களுடைய தெய்வங்கள் உங்களுக்குக் கண்ணியாக இருக்கும்’ என்று சொன்னேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக ‘பக்கங்களாக.’ சில பழமையான மொழிபெயர்ப்புகளும் இணையான வேதப்பகுதிகளும் இதை ‘உங்கள் பக்கங்களில் முட்களாக’ என்று வாசிக்கின்றன அல்லது பொருள் கொள்கின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: ஆகவே நானும்
  rationale: முந்தைய கண்டனத்துடன் இக்கூற்றை இணைத்து, தொடர்ச்சியையும் விளைவுசார் வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָמַרְתִּי
  choice: என்று சொன்னேன்
  rationale: எளிய இறந்தகாலம் கதைச் சூழலுக்குப் பொருந்துகிறது; மூலத்தின் பொதுவான ‘சொல்’ வினையை அளவுக்கு மீறிய முறையில் உயர்த்துவதில்லை.
- source_word: לֹא אֲגָרֵשׁ אוֹתָם
  choice: அவர்களை ... துரத்திவிட மாட்டேன்
  rationale: גרש என்பதன் வெளியேற்றுதல்/துரத்துதல் என்ற வெற்றிகொள்ளல் சூழலிலான பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: מִפְּנֵיכֶם
  choice: உங்கள் முன்னிலையிலிருந்து
  rationale: ‘உங்களுக்கு முன்பாக இருந்து’ என்ற எபிரெய இடவியல் சொல்லாட்சியை இயல்பான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: וְהָיוּ לָכֶם לְצִדִּים
  choice: அவர்கள் உங்களுக்கு எதிரிகளாக இருப்பார்கள்
  rationale: லְצִדִּים என்ற கடினமான மசோரா வாசகம் சொற்சொல்லாக ‘பக்கங்களாக’ என இருந்தாலும், சூழலில் பகைமையான தொல்லையைக் குறிக்கிறது. புரியாத சொற்சொல் மொழிபெயர்ப்பைத் தவிர்த்து, அடிக்குறிப்பில் மூலத்தின் சிக்கலைக் காக்கிறது.
- source_word: וֵאלֹהֵיהֶם
  choice: அவர்களுடைய தெய்வங்கள்
  rationale: விக்கிரக வழிபாட்டுச் சூழலில் suffix உடைய אֱלֹהִים என்பதற்கான நேரான பன்மை மொழிபெயர்ப்பு.
- source_word: יִהְיוּ לָכֶם לְמוֹקֵשׁ
  choice: உங்களுக்குக் கண்ணியாக இருக்கும்
  rationale: מוֹקֵשׁ என்பதன் பொறி அல்லது கண்ணி என்ற உருவகத்தையும், வழிதவறச் செய்யும் அபாயத்தையும் காக்கிறது.
theological_decisions:
- issue: לְצִדִּים என்ற கடினமான மசோரா வாசகத்தைக் கையாளுதல்
  choice: எதிரிகளாக
  alternative: உங்கள் பக்கங்களில் முட்களாக
  rationale: கொடுக்கப்பட்ட எபிரெய உரை சொற்சொல்லாக ‘பக்கங்கள்’ என்று வாசிக்கிறது; ‘முட்கள்’ என்பது சில பழமையான மொழிபெயர்ப்புகளிலும் இணையான பகுதிகளிலும் காணப்படும் வாசிப்பு அல்லது விளக்கம். முதன்மை உரையை இணையான வசனத்துடன் அமைதியாக ஒத்திசைக்காமல், சூழல்சார் பொருளை முதன்மை உரையில் அளித்து, உண்மையான உரைச் சிக்கலையும் பாரம்பரிய மாற்றையும் அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. கடினமான எபிரெய வாசகம் பிரதான உரையில் அதன் சூழல்சார் பொருளோடும், அடிக்குறிப்பில் அதன் சொற்சொல் வடிவம் மற்றும் பழமையான மாற்று வாசிப்போடும் பாதுகாக்கப்பட்டுள்ளது.
