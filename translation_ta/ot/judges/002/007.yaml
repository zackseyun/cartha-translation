source:
  edition: WLC
  text: וַ/יַּעַבְד֤וּ הָ/עָם֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשׁ֔וּעַ אֲשֶׁ֣ר רָא֗וּ אֵ֣ת כָּל מַעֲשֵׂ֤ה יְהוָה֙ הַ/גָּד֔וֹל אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/007.yaml
  text: And the people served Yahweh all the days of Joshua[a], and all the days of the elders who lived on after Joshua, who had seen all the great work of Yahweh that he had done for Israel.
translation:
  language: ta
  text: யோசுவாவின் நாட்களெல்லாம், யோசுவாவுக்குப் பிறகும் வாழ்ந்த, யாவே இஸ்ரவேலுக்காகச் செய்த அந்த மகத்தான செயலைக் கண்டிருந்த மூப்பர்களின் நாட்களெல்லாம் மக்கள் யாவேவுக்குச் சேவை செய்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யாவேயின் மகத்தான செயல்” என்பது ஒருமையில் உள்ளது; இதை “மகத்தான கிரியை” அல்லது “மகத்தான செய்கை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: பணிசெய்தார்கள்
  rationale: עבד என்பது யாவேவுக்கு உடன்படிக்கை விசுவாசத்துடன் சேவை செய்வதைக் குறிக்கிறது; வழிபாட்டையும் உள்ளடக்கலாம், ஆனால் அதைவிட விரிவானது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: உடன்படிக்கைச் சமூகத்தை ஒட்டுமொத்தமாகக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புச் சொல்லால் மாற்றாமல், எபிரெய தனிப்பெயரின் பரவலாக ஏற்கப்பட்ட தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: כֹּל יְמֵי
  choice: வாழ்ந்த நாட்களெல்லாம்
  rationale: ஒருவரின் வாழ்நாள் அல்லது தலைமைக் காலத்தின் முழு நீளத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַזְּקֵנִים
  choice: மூப்பர்கள்
  rationale: வயதில் மூத்தவர்களாகவும் சமூகத்தில் அங்கீகரிக்கப்பட்ட தலைவர்களாகவும் இருந்தவர்களைக் குறிக்கும் வழக்கமான வேதாகமத் தமிழ் சொல்.
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי
  choice: பின்பும் தொடர்ந்து வாழ்ந்து
  rationale: சொல்லெழுத்தாக 'நாட்களை நீட்டித்தனர்' என்பதற்குப் பதிலாக, யோசுவாவின் காலத்திற்குப் பின்னும் உயிர்வாழ்ந்தனர் என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: רָאוּ
  choice: கண்டிருந்த
  rationale: அவர்களின் தொடர்ந்த உண்மைத்தன்மைக்கு முன்பட்ட அனுபவத்தைத் தமிழில் இயல்பான இறந்தகால வினையெச்சமாகக் காட்டுகிறது.
- source_word: מַעֲשֵׂה ... הַגָּדוֹל
  choice: மகத்தான செயல்கள் அனைத்தையும்
  rationale: எபிரெயத்தில் 'மகத்தான செயல்' என்பது ஒருமைத் தொகுப்புப் பயன்பாடாக இருந்து யாவே செய்த அனைத்தையும் குறிக்கலாம்; தமிழில் சூழலுக்கேற்ற பன்மை இயல்பாக உள்ளது, ஆனால் அடிப்படை ஒருமை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்காகச் செய்த
  rationale: ל இங்கு இஸ்ரவேலின் நன்மைக்காகச் செய்யப்பட்டதைச் சுட்டும் பயன்நிலைப் பொருளை அளிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா / ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: עבד என்பதன் பொருள்
  choice: பணிசெய்தார்கள்
  alternative: வழிபட்டார்கள்
  rationale: இச்சொல் சடங்கு வழிபாட்டை மட்டும் அல்லாமல், யாவேவுக்கான விரிவான உடன்படிக்கைச் சேவையையும் விசுவாசத்தையும் குறிக்கக்கூடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. நீண்ட எபிரெய வாக்கியத்தின் காலச்சார்ந்த இணைப்புகள் பாதுகாக்கப்பட்டுள்ளன; 'பணிசெய்தார்கள்' என்பது வழிபாட்டை மட்டும் குறுக்காமல் உடன்படிக்கைச் சேவையின் பரப்பைத் தக்கவைக்கிறது.
