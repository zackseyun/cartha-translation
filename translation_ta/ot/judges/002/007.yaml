revisions:
- from: யோசுவா வாழ்ந்த நாட்களெல்லாம், யோசுவாவுக்குப் பின்பும் தொடர்ந்து வாழ்ந்து, யாவே இஸ்ரவேலுக்காகச் செய்த அவருடைய மகத்தான செயல்கள் அனைத்தையும் கண்டிருந்த மூப்பர்கள் வாழ்ந்த நாட்களெல்லாம், மக்கள் யாவேவுக்குப் பணிசெய்தார்கள்.[a]
  to: யோசுவாவின் நாட்களெல்லாம், யோசுவாவுக்குப் பிறகும் வாழ்ந்த, யாவே இஸ்ரவேலுக்காகச் செய்த அந்த மகத்தான செயலைக் கண்டிருந்த மூப்பர்களின் நாட்களெல்லாம் மக்கள் யாவேவுக்குச் சேவை செய்தார்கள்.[a]
  rationale: The revision retains the source’s two parallel time periods and the elders’ defining experience, uses a natural Tamil verb for covenantal service, and represents the singular collective “great work” as singular. The marker is placed directly after the relevant translated expression at the verse end.
