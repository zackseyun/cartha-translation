base_translation:
  language: en
  yaml_path: translation/ot/judges/002/020.yaml
  text: So the anger of Yahweh burned against Israel[a], and he said, “Because this nation has transgressed my covenant that I commanded their fathers[b], and they have not listened to my voice,”
translation:
  language: ta
  text: 'யாவேயின் கோபம் இஸ்ரவேலுக்கு எதிராக மூண்டது. அவர் கூறினார்: “இந்தத் தேசம் அவர்களுடைய முன்னோர்களுக்குக் நான் கட்டளையிட்ட என் உடன்படிக்கையை மீறியதாலும்[a], என் குரலுக்குச் செவிகொடுக்காததாலும்[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் உடன்படிக்கையை முறித்ததாலும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல்லுக்கு நேரடியாக ‘கடந்து செல்லுதல்’ என்று பொருள்; உடன்படிக்கைச் சூழலில் அது மீறுதல் அல்லது முறித்தல் என்ற பொருளைத் தருகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘என் குரலுக்குக் கீழ்ப்படியாததாலும்’ என்றும் மொழிபெயர்க்கலாம். ‘என் குரலுக்குச் செவிகொடுத்தல்’ என்ற எபிரெய மரபுத்தொடர் கேட்டலோடு கீழ்ப்படிதலையும் பொதுவாக உள்ளடக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: கோபம் ... மூண்டது
  rationale: எபிரெய மொழியின் ‘கோபம் எரிதல்/சூடாதல்’ என்ற உருவகத்தை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், יהוה என்பதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராக
  rationale: கோபத்தின் இலக்கைச் சுட்டும் בְּ என்பதன் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: יַעַן אֲשֶׁר
  choice: '...தாலும்'
  rationale: அடுத்து வரும் தெய்வீகத் தீர்ப்புக்கான காரணத்தை அறிமுகப்படுத்தும் தொடராகத் தமிழில் இயல்பாக அமைகிறது; வசனம் 21-ல் வாக்கியம் தொடர்வதையும் காக்கிறது.
- source_word: עָבְרוּ
  choice: மீறியதாலும்
  rationale: அடிப்படையில் ‘கடந்து செல்லுதல்’ என்று பொருள்படும் வினை, உடன்படிக்கையைப் பொருளாகக் கொள்ளும்போது அதை மீறுதல் என்ற ஒழுக்க-உடன்படிக்கைப் பொருளை தருகிறது.
- source_word: הַגּוֹי הַזֶּה
  choice: இந்தத் தேசம்
  rationale: גוי என்பதன் ‘தேசம்/நாடு’ என்ற குறிக்கப்பட்ட சொல்லாட்சியை ‘மக்கள்’ என்று பொதுமைப்படுத்தாமல் காக்கிறது; இங்கு மக்களைக் கூட்டாகக் குறிக்கிறது.
- source_word: בְּרִיתִי
  choice: என் உடன்படிக்கை
  rationale: ברית என்பதற்கான நிலையான, தெளிவான தமிழ் இணைச்சொல்; இஸ்ரவேலுடனான உறவின் உடன்படிக்கைத் தன்மையைத் தக்கவைக்கிறது.
- source_word: צִוִּיתִי אֶת אֲבוֹתָם
  choice: அவர்களுடைய முன்னோர்களுக்கு நான் கட்டளையிட்ட
  rationale: சுருக்கமான எபிரெயக் கட்டமைப்பின் பொருளை இயல்பான தமிழில் தருகிறது; אבותם இங்கு முந்தைய தலைமுறையினரைக் குறிப்பதால் ‘முன்னோர்கள்’ என வழங்கப்படுகிறது.
- source_word: שָׁמְעוּ לְקוֹלִי
  choice: என் குரலுக்குச் செவிகொடுக்காததாலும்
  rationale: கேட்டல் மற்றும் அதற்குக் கீழ்ப்படிந்து நடப்பது ஆகிய இரண்டையும் உள்ளடக்கும் எபிரெய மரபுத்தொடரின் செவிவழி உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: உடன்படிக்கை சார்ந்த நீதிமொழியைத் தக்கவைத்தல்
  choice: என் உடன்படிக்கையை மீறியதாலும் ... என் குரலுக்குச் செவிகொடுக்காததாலும்
  alternative: என் உடன்படிக்கையை உடைத்ததாலும் ... எனக்குக் கீழ்ப்படியாததாலும்
  rationale: மூலத்தின் உடன்படிக்கைச் சொல்லாட்சியையும் ‘குரலுக்குச் செவிகொடுத்தல்’ என்ற உருவகத்தையும் விளக்கவுரையாகச் சுருக்காமல் காக்கிறது.
- issue: வசனம் முடிவில் தொடரும் காரண வாக்கியம்
  choice: இறுதியில் காற்புள்ளியுடன் மேற்கோளைத் திறந்தே வைத்தல்
  alternative: ‘என்று கூறினார்’ என வாக்கியத்தை இவ்வசனத்திலேயே முடித்தல்
  rationale: יַעַן אֲשֶׁר தொடங்கும் காரணப் பகுதியின் விளைவு அடுத்த வசனத்தில் வருவதால், மூலத்தின் தொடர்ச்சியையும் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை. ‘மூண்டது,’ ‘உடன்படிக்கை,’ ‘செவிகொடுக்குதல்’ ஆகியவை மூல உருவகங்களையும் உடன்படிக்கைச் சொல்லாட்சியையும் இயல்பாகத் தக்கவைக்கின்றன. வசனம் 21-ல் வாக்கியம் தொடர்வதால் இறுதிக் காற்புள்ளியும் திறந்த மேற்கோளும் நோக்கத்துடன் வைக்கப்பட்டுள்ளன.
