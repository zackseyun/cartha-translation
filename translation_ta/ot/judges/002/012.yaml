  text: וַ/יַּעַזְב֞וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבוֹתָ֗/ם הַ/מּוֹצִ֣יא אוֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַ/יֵּלְכ֞וּ אַחֲרֵ֣י אֱלֹהִ֣ים אֲחֵרִ֗ים מֵ/אֱלֹהֵ֤י הָֽ/עַמִּים֙ אֲשֶׁר֙ סְבִיב֣וֹתֵי/הֶ֔ם וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם וַ/יַּכְעִ֖סוּ אֶת יְהוָֽה־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/012.yaml
  text: And they abandoned Yahweh[a], the God of their fathers, who had brought them out from the land of Egypt, and went after other gods from among the gods of the peoples who were around them, and they bowed down to them and provoked Yahweh to anger.
translation:
  language: ta
  text: அவர்கள் தங்கள் தந்தையரின் தேவனாகிய யாவேவைக் கைவிட்டார்கள்; அவரே அவர்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்தவர். அவர்கள் தங்களைச் சுற்றியிருந்த மக்களின் தெய்வங்களுள் வேறு தெய்வங்களைப் பின்பற்றி[a], அவற்றுக்கு முன்பாகப் பணிந்து, யாவேவுக்குக் கோபமூட்டினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களைச் சுற்றியிருந்த மக்களின் தெய்வங்களைப் பின்பற்றி.” எபிரெயத் தொடர், இஸ்ரவேலைச் சுற்றியிருந்த மக்கள் வழிபட்ட தெய்வங்களைப் பொதுவாகக் குறிப்பதாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: கைவிட்டார்கள்
  rationale: עזב இங்கு வெறுமனே ஓரிடத்தைவிட்டு நீங்குவதைக் குறிக்காமல், உறவு மற்றும் உடன்படிக்கை சார்ந்த விசுவாசத்தைத் துறப்பதைக் குறிக்கிறது; ‘கைவிட்டார்கள்’ அந்த வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, எபிரெய வேதத்தில் வரும் இறைநாமம்; ஆகவே தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: தங்கள் தந்தையரின் தேவன்
  rationale: மூலத்தின் ஆண்பால் பன்மையையும் உடன்படிக்கை வரலாற்றுச் சொற்றொடரையும் காக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: הַמּוֹצִיא אוֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: அவர்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்தவர்
  rationale: குறிப்பிட்ட பெயரெச்சத் தொடர் யாவேவை விடுதலைச் செயலால் அடையாளப்படுத்துகிறது; தமிழ் வாக்கியத் தெளிவுக்காக தனி தொடர்புடைய கூற்றாக வழங்கப்பட்டது.
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: பின்பற்றி
  rationale: இந்த எபிரெய வழக்கு ஒருவரை அல்லது ஒரு தெய்வத்தை நாடிச் சென்று அதற்கு விசுவாசம் செலுத்துவதைக் குறிக்கிறது; ‘பின்பற்றி’ தமிழில் இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்கள்
  rationale: אֲחֵרִים என்பதன் நேரடிப் பொருள் ‘வேறு’; ‘அந்நிய’ என்று மொழிபெயர்ப்பது இங்கு தேவையற்ற விளக்கத்தைச் சேர்க்கும்.
- source_word: מֵאֱלֹהֵי הָעַמִּים אֲשֶׁר סְבִיבוֹתֵיהֶם
  choice: தங்களைச் சுற்றியிருந்த மக்களின் தெய்வங்களுள்
  rationale: முன்னொட்டு מִן-ஐ பகுதிப்பொருளில் எடுத்துக்கொண்டு, சுற்றுப்புற மக்களின் தெய்வங்களில் சிலவற்றை அவர்கள் பின்பற்றினார்கள் என்ற தொடரமைப்பு காக்கப்பட்டது; பொதுவான தொடர்பைக் குறிக்கும் வாசிப்பும் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: அவற்றுக்கு முன்பாகப் பணிந்து
  rationale: வினைச்சொல்லின் உடல்சார்ந்த பணிதல் அல்லது சாஷ்டாங்கமிடுதல் என்ற உருவகத்தைப் பாதுகாக்கிறது; சூழல் அது வழிபாட்டுச் செயல் என்பதைத் தெளிவாக்குகிறது.
- source_word: וַיַּכְעִסוּ אֶת יְהוָה
  choice: யாவேவுக்குக் கோபமூட்டினார்கள்
  rationale: כעס என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளை ‘கோபமூட்டினார்கள்’ நேரடியாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைநாமமே உள்ளது; அதனால் பெயர் ஒலிபெயர்க்கப்பட்டது.
- issue: இஸ்ரவேலின் துரோகத்தின் உடன்படிக்கைச் சார்ந்த வலிமை
  choice: ‘கைவிட்டார்கள்’ உள்ளிட்ட மூலத்தின் உறவுசார் மொழியைத் தக்கவைத்தல்
  alternative: முதன்மை உரையிலேயே ‘உடன்படிக்கையை மீறினார்கள்’ என்று விளக்கிச் சேர்த்தல்
  rationale: வசனம் யாவேவைக் கைவிடுதல், வேறு தெய்வங்களைப் பின்பற்றுதல், பணிதல், கோபமூட்டுதல் ஆகியவற்றைச் சொல்கிறது; வெளிப்படையாக இல்லாத கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் அந்தத் தீவிரம் காக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட எபிரெய வாக்கியத்தின் அடையாளப்படுத்தும் பெயரெச்சத் தொடர் தெளிவுக்காக அரைப்புள்ளியால் பிரிக்கப்பட்டது; இருப்பினும் செயல்களின் தொடர்ச்சி காக்கப்பட்டது.
