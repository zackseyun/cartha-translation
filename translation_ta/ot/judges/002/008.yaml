id: JDG.2.8
reference: Judges 2:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּ֛מָת יְהוֹשֻׁ֥עַ בִּן נ֖וּן עֶ֣בֶד יְהוָ֑ה בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/008.yaml
  text: And Joshua son of Nun[a], the servant of Yahweh, died at the age of one hundred and ten years.
translation:
  language: ta
  text: நூனின் மகனும் யாவேயின் ஊழியருமான யோசுவா நூற்றுப் பத்து வயதில் இறந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் அடிமை.” எபிரேயச் சொல் “ஊழியர்,” “அடிமை” ஆகிய இரு பொருள்களையும் குறிக்கலாம்; இங்கு அது யோசுவாவுக்குரிய மதிப்புமிக்க பட்டமாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தார்
  rationale: מות என்பதன் Qal wayyiqtol வடிவம் கதையின் அடுத்த நிகழ்வைக் குறிக்கிறது. தமிழில் தொடர்ச்சியைச் சொல்லமைப்பே இயல்பாக வெளிப்படுத்துவதால் தனியே ‘அப்போது’ அல்லது ‘மேலும்’ சேர்க்கப்படவில்லை.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட பெயர்வடிவம்; மூலப் பெயரை மொழிபெயர்க்காமல் ஒலிபெயர்க்கிறது.
- source_word: בִּן נוּן
  choice: நூனின் மகன்
  rationale: பெற்றோர் உறவைக் குறிக்கும் எபிரேய இணைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֶבֶד יְהוָה
  choice: யெகோவாவின் ஊழியர்
  rationale: עֶבֶד என்பது ‘ஊழியர்’ அல்லது ‘அடிமை’ எனப் பொருள்படலாம். இங்கு யோசுவாவுக்குரிய மதிப்புமிக்க பட்டமாக இருப்பதால் ‘ஊழியர்’ சூழலுக்கு ஏற்றது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் நிலைபெற்ற நேரடி பெயர்வடிவமான ‘யெகோவா’ என வழங்குகிறது.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: நூற்றுப் பத்து வயதில்
  rationale: ‘நூற்றுப் பத்து ஆண்டுகளின் மகன்’ என்ற எபிரேய வயதுக் கூறை, எண்ணியல் விவரத்தை முழுமையாகக் காத்து இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றாமல் பெயராகவே வழங்குவது மூலத்தின் வேறுபாட்டைக் காக்கிறது; ‘யெகோவா’ தமிழ் வாசகர்களிடையே நிலைபெற்ற வடிவம்.
- issue: யோசுவாவின் பட்டத்தில் עֶבֶד என்பதன் பொருள்
  choice: ஊழியர்
  alternative: அடிமை
  rationale: சொல் இரண்டு பொருள்களையும் தாங்கினாலும், இங்கு யோசுவாவுக்கும் யெகோவாவுக்கும் உள்ள உறவை மதிப்புடன் சுட்டும் பட்டமாகப் பயன்படுகிறது. ‘ஊழியர்’ அந்தச் சூழல்சார் வலிமையை இயல்பாகக் காக்கிறது; ‘அடிமை’ என்ற சாத்தியம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மரியாதை ஒருமை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது; எபிரேய வயதுக் கூறு இயல்பான தமிழாக்கமாக வழங்கப்பட்டுள்ளது.
