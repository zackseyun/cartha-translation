id: JDG.2.16
reference: Judges 2:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּ֥קֶם יְהוָ֖ה שֹֽׁפְטִ֑ים וַ/יּ֣וֹשִׁיע֔וּ/ם מִ/יַּ֖ד שֹׁסֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/016.yaml
  text: Then Yahweh raised up judges[a], and they saved them from the hand of those who plundered them.
translation:
  language: ta
  text: 'அப்போது யாவே நியாயாதிபதிகளை எழுப்பினார். அவர்களைக் கொள்ளையடித்தவர்களின் கையிலிருந்து அந்த நியாயாதிபதிகள் அவர்களை மீட்டார்கள்.[a]


    [a] அல்லது, “அவர்களை விடுவித்தார்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை விடுவித்தார்கள்.”
    reason: וַיּוֹשִׁיעוּם என்பதற்கு “மீட்டார்கள்” மற்றும் “விடுவித்தார்கள்” ஆகிய இரண்டும் இச்சூழலில் பொருத்தமான மொழிபெயர்ப்புகள்; மாற்றுச் சொல்லாக்கத்தைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיָּקֶם
  choice: எழுப்பினார்
  rationale: קום என்பதன் ஹிஃபில் வடிவம், தலைவர்கள் தோன்றும்படி செய்து அவர்களைப் பணிக்கு ஏற்படுத்திய யாவேயின் முன்முயற்சியைக் குறிக்கிறது. “எழுப்பினார்” என்பது அந்தச் செயற்பாட்டையும் இறை நியமனத்தையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: שֹׁפְטִים
  choice: நியாயாதிபதிகள்
  rationale: இந்த நபர்கள் மீட்புத் தலைவர்களாகவும் செயல்பட்டாலும், שֹׁפְטִים என்பதன் அடிப்படைப் பொருளையும் நூலின் முக்கியச் சொல்லாட்சியையும் “நியாயாதிபதிகள்” பாதுகாக்கிறது.
- source_word: וַיּוֹשִׁיעוּם
  choice: அவர்களை மீட்டார்கள்
  rationale: ישע என்பது ஆபத்திலிருந்தும் எதிரியின் ஆட்சியிலிருந்தும் காப்பாற்றுதல் அல்லது விடுவித்தலைக் குறிக்கிறது. இச்சூழலில் “மீட்டார்கள்” தெளிவாகவும் இயல்பாகவும் உள்ளது; “விடுவித்தார்கள்” என்பது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: அதிகாரம் அல்லது பிடியைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் புரிந்துகொள்ளக்கூடிய வகையில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: שֹׁסֵיהֶם
  choice: அவர்களைக் கொள்ளையடித்தவர்கள்
  rationale: இந்தச் சொல் வன்முறையாகச் சூறையாடி உடைமைகளைப் பறிப்பவர்களைக் குறிக்கிறது. “கொள்ளையடித்தவர்கள்” அந்தப் பொருளை நவீனத் தமிழில் தெளிவாக வழங்குகிறது; “ஒடுக்கியவர்கள்” என்பது மிகப் பொதுவானது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பட்ட பெயரையே பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: שֹׁפְטִים என்பவர்களின் பதவியையா மீட்புப் பணியையா முன்னிறுத்துவது
  choice: பதவிக்குப் “நியாயாதிபதிகள்” என்றும், அடுத்த வினையில் அவர்களின் மீட்புச் செயலைத் தெளிவாகவும் கூறுதல்
  alternative: “மீட்பர்கள்” என்று மட்டும் வழங்குதல்
  rationale: எபிரெய உரை அவர்களை “நியாயாதிபதிகள்” என்று அழைத்து, பின்னர் அவர்கள் இஸ்ரவேலை மீட்டதாகக் கூறுகிறது. இரண்டையும் தனித்தனியாகப் பாதுகாப்பது அவர்களின் பங்கை ஒரே செயலுக்குள் சுருக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. முதல் வாக்கியத்தின் கருப்பொருள் இரண்டாம் வாக்கியத்திலும் தெளிவாக இருக்க “அந்த நியாயாதிபதிகள்” என்று மீண்டும் குறிப்பிடப்பட்டுள்ளது; இது எபிரெய ஆண்பால் பன்மை வினையின் சுட்டுதலைத் தமிழில் குழப்பமின்றி வெளிப்படுத்துகிறது.
