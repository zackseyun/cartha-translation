base_translation:
  language: en
  yaml_path: translation/ot/judges/002/015.yaml
  text: Wherever they went out[a], the hand of Yahweh was against them for harm, just as Yahweh had spoken and just as Yahweh had sworn to them[b], and they were greatly distressed.
translation:
  language: ta
  text: அவர்கள் எங்கு புறப்பட்டுச் சென்றாலும்[a], யாவேயின் கை அவர்களுக்குத் தீங்கு[b] விளைவிக்க, யாவே கூறியிருந்தபடியும் அவர்களுக்குச் சத்தியம் செய்திருந்தபடியும், அவர்களுக்கு எதிராக இருந்தது. அவர்கள் மிகுந்த நெருக்கடியில் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் எப்போது புறப்பட்டுச் சென்றாலும்.” இங்கு போருக்கோ படையெடுப்புக்கோ புறப்படுவது குறிப்பாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தீங்கு” என்பதற்கு “பேரிடர்” அல்லது “கேடு” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரேயச் சொல் அறநெறிசார் தீமையை அவசியம் குறிக்காமல், துன்பத்தையோ அழிவையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹל אֲשֶׁר יָצְאוּ
  choice: அவர்கள் எங்கு புறப்பட்டுச் சென்றாலும்
  rationale: இந்த எபிரேயச் சொற்றொடர் அவர்கள் மேற்கொண்ட எல்லாப் புறப்பாடுகளையும் குறிக்கிறது. இடம் அல்லது நிகழும் ஒவ்வொரு முறையும் என்ற இரு நுணுக்கங்களுக்கும் வாய்ப்பிருப்பதால், முதன்மை உரை பொதுவான பொருளை வைத்துக்கொண்டு மாற்றுப் பொருளை அடிக்குறிப்பில் தருகிறது.
- source_word: יַד יְהוָה
  choice: யாவேயின் கை
  rationale: இது யாவேயின் செயல்படும் வல்லமையையும் நேரடியான தலையீட்டையும் குறிக்கும் எபிரேய உருவகமாகும்; ‘கை’ என்ற உருவகம் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: הָיְתָה בָם לְרָעָה
  choice: அவர்களுக்குத் தீங்கு உண்டாக்கும்படி அவர்களுக்கு எதிராக இருந்தது
  rationale: யாவேயின் எதிரான செயல் அவர்களுக்குக் கேடும் துன்பமும் விளைவித்ததை இது வெளிப்படுத்துகிறது. רָעָה என்பதை அறநெறிசார் ‘தீமை’ என்று தவறாகப் புரிந்துகொள்ளாமல், இச்சூழலில் உள்ள கேடு அல்லது பேரிடர் சார்ந்த பொருளை ‘தீங்கு’ தெரிவிக்கிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: யாவே கூறியபடி
  rationale: முன்னதாக வழங்கப்பட்ட தெய்வீக எச்சரிக்கையைத் திரும்பச் சுட்டுகிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וְכַאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: அவர்களுக்கு ஆணையிட்டுச் சத்தியம் செய்தபடி
  rationale: נשבע என்பதன் ஆணையிட்டு உறுதிப்படுத்தும் வலிமையைப் பாதுகாக்கிறது; לָהֶם அந்தச் சத்தியம் அவர்களை நோக்கிச் செய்யப்பட்டதைக் காட்டுகிறது.
- source_word: וַיֵּצֶר לָהֶם מְאֹד
  choice: அவர்கள் மிகுந்த நெருக்கடிக்குள்ளானார்கள்
  rationale: அவர்கள் அனுபவித்த கடுமையான இடுக்கணை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; מְאֹד என்பதன் தீவிரத்தை ‘மிகுந்த’ பாதுகாக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைத் தீர்ப்பில் யாவேயின் எதிரான செயல்
  choice: யாவேயின் கை அவர்களுக்குத் தீங்கு உண்டாக்கும்படி அவர்களுக்கு எதிராக இருந்தது
  alternative: யாவேயின் கை அவர்கள்மேல் பேரிடரை வரவழைத்தது
  rationale: எபிரேய உரை தீர்ப்பில் யாவே நேரடியாகச் செயல்பட்டதைத் தெளிவாகக் கூறுகிறது. அதேவேளை רָעָה என்பதை அறநெறிசார் தீமை என்று விளக்காமல், அவர்களுக்கு நேர்ந்த கேடு என்ற பொருளில் வழங்குவதன் மூலம் உரையின் இறையியல் அழுத்தம் பாதுகாக்கப்படுகிறது.
- issue: தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: יְהוָה என்பது பொதுப்பட்டம் அல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பெயர் என்பதால் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரேயத்தின் ‘கை’ உருவகமும் தெய்வீகப் பெயரும் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற இராணுவச் சிறப்பாக்கம் முதன்மை உரையில் தவிர்க்கப்பட்டு அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
