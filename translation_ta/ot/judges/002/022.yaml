base_translation:
  language: en
  yaml_path: translation/ot/judges/002/022.yaml
  text: in order to test Israel by them[a], whether they would keep the way of Yahweh by walking in it, as their fathers kept it, or not.
translation:
  language: ta
  text: அவர்களைக் கொண்டு[a] இஸ்ரவேலைச் சோதிப்பதற்காக—தங்கள் தந்தையர் கடைப்பிடித்ததுபோல, இவர்களும் யாவேவின் வழியைக் கடைப்பிடித்து அதில் நடப்பார்களா இல்லையா என்று.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் மூலமாக.” இங்குள்ள எபிரேயச் சுட்டுப்பெயர், முந்தைய சூழலில் நாட்டில் விடப்பட்ட பிற இனத்தாரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן נַסּוֹת
  choice: சோதிப்பதற்காக
  rationale: לְמַעַן என்பதன் நோக்கப் பொருளையும் נַסּוֹת என்பதன் ‘சோதித்தறிதல்’ பொருளையும் இயல்பான நவீனத் தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: בָּם
  choice: அவர்களைக்கொண்டு
  rationale: முந்தைய சூழலில் நாட்டில் விடப்பட்ட பிற இனத்தாரைக் குறிக்கும் பன்மைப் பதிற்பெயரின் கருவிப் பொருளைப் பாதுகாக்கிறது.
- source_word: הֲשֹׁמְרִים הֵם
  choice: இவர்களும் ... கடைப்பிடித்து ... நடப்பார்களா
  rationale: சோதனையின் உள்ளடக்கத்தைத் தெரிவிக்கும் எபிரேய வினாவை இயல்பான தமிழ் எதிர்கால வினாவாக வழங்குகிறது; ‘இவர்களும்’ என்பது இஸ்ரவேலை அவர்களுடைய தந்தையருடன் ஒப்பிடுவதைத் தெளிவாக்குகிறது.
- source_word: דֶּרֶךְ יְהוָה
  choice: யாவேவின் வழி
  rationale: ‘வழி’ என்ற வேதாகம உருவகத்தையும் יהוה என்ற இறைப் பெயரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: לָלֶכֶת בָּם
  choice: அதில் நடப்பார்களா
  rationale: ‘வழியில் நடத்தல்’ என்ற எபிரேய உருவகத்தைத் தமிழில் புரியக்கூடியவாறு வைத்திருக்கிறது; பதிற்பெயர் முன்னுள்ள ஒருமை ‘வழி’யைக் குறிக்கிறது.
- source_word: כַּאֲשֶׁר שָׁמְרוּ אֲבוֹתָם
  choice: தங்கள் தந்தையர் கடைப்பிடித்ததுபோல
  rationale: ஒப்பீட்டையும் שמר வினையின் மீள்வருகையையும் பாதுகாக்கிறது; אֲבוֹתָם என்பதன் ஆண்பால் வம்சவழிக் குறிப்பை ‘தந்தையர்’ என வழங்குகிறது.
- source_word: אִם לֹא
  choice: இல்லையா என்று
  rationale: ‘...ஆ இல்லையா’ என்ற வினா அமைப்பை இயல்பான தமிழில் நிறைவு செய்கிறது.
theological_decisions:
