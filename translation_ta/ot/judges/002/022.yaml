  rationale: בָּם என்பதன் கருவிப் பொருளை வைத்திருக்கிறது; அந்த இனங்கள் தாமே சோதனையின் இறுதி செயற்பாட்டாளர்கள் என்று மேலதிகமாகத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், இயல்பானதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. ‘வழியைக் கடைப்பிடித்து அதில் நடப்பது’ என்ற சொற்றொடர் மூலத்தின் உருவகத்தையும் שמר வினையின் ஒழுக்கக் கருத்தையும் பாதுகாக்கிறது. வசனம் முந்தைய வாக்கியத்தின் நோக்கத் தொடராக இருப்பதால் அதன் சார்பு அமைப்பு தமிழிலும் விடப்பட்டுள்ளது.
