revisions:
- from: அவர்கள் அவரை அவருடைய உரிமைச் சொத்தின் எல்லைக்குள்[a], எப்பிராயீமின் மலைநாட்டிலுள்ள திம்னாத்-கேரேசில், காயாஸ் மலையின் வடக்கே அடக்கம் செய்தார்கள்.
  to: அவர்கள் அவரை, அவருக்குக் கிடைத்த உரிமைநிலப் பகுதியில்[a], எப்பிராயீமின் மலைநாட்டிலுள்ள திம்னாத்-ஹெரெஸில், காஅஷ் மலையின் வடக்கே அடக்கம் செய்தார்கள்.
