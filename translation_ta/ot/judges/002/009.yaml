  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரேயப் புவியியல் சொற்றொடரின் பொருளைத் தெளிவாக வழங்குவதோடு இடப்பெயர் வேறுபாட்டையும் அடிக்குறிப்பில் பாதுகாக்கிறது.
