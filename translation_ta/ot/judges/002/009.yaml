  text: וַ/יִּקְבְּר֤וּ אוֹת/וֹ֙ בִּ/גְב֣וּל נַחֲלָת֔/וֹ בְּ/תִמְנַת חֶ֖רֶס בְּ/הַ֣ר אֶפְרָ֑יִם מִ/צְּפ֖וֹן לְ/הַר גָּֽעַשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/009.yaml
  text: And they buried him within the territory of his inheritance[a], in Timnath-heres, in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: ta
  text: அவர்கள் அவரை, அவருக்குக் கிடைத்த உரிமைநிலப் பகுதியில்[a], எப்பிராயீமின் மலைநாட்டிலுள்ள திம்னாத்-ஹெரெஸில், காஅஷ் மலையின் வடக்கே அடக்கம் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: யோசுவா 24:30-ல் ‘திம்னாத்-ஹெரெஸ்’ என்பதற்குப் பதிலாக ‘திம்னாத்-சேராக்’ என்று உள்ளது. இணையான இந்த அடக்கக் குறிப்புகளில் காணப்படும் இடப்பெயர் வேறுபாடு இங்கே அப்படியே தக்கவைக்கப்பட்டுள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: அவர்கள் அவரை ... அடக்கம் செய்தார்கள்
  rationale: வய்யிக்தோல் வடிவம் தொடரும் கடந்தகால நிகழ்வைக் குறிக்கிறது; ஆண்பால் ஒருமை சுட்டுப்பெயர் சூழலில் யோசுவாவைக் குறிக்கிறது.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: அவருடைய உரிமைச் சொத்தின் எல்லைக்குள்
  rationale: גְּבוּל என்பது எல்லையையோ எல்லைக்குட்பட்ட நிலப்பரப்பையோ குறிக்கலாம்; இங்கு புதைக்கப்பட்ட இடத்தைக் குறிப்பதால் ‘எல்லைக்குள்’ இயல்பாக உள்ளது. נַחֲלָה ஒதுக்கிக் கிடைத்த மரபுரிமை நிலம் என்ற கருத்தைத் தக்கவைக்க ‘உரிமைச் சொத்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּתִמְנַת חֶרֶס
  choice: திம்னாத்-கேரேசில்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, בְּ முன்னொட்டு இடத்தைக் குறிக்கும் ‘-இல்’ விகுதியால் தரப்பட்டுள்ளது.
- source_word: בְּהַר אֶפְרָיִם
  choice: எப்பிராயீமின் மலைநாட்டிலுள்ள
  rationale: இந்தப் புவியியல் தொடரில் הַר ஒரு தனி மலையைவிட மலைப்பாங்கான பிரதேசத்தைக் குறிக்கிறது.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: காயாஸ் மலையின் வடக்கே
  rationale: இந்த அமைப்பு காயாஸ் மலையை ஒப்பீட்டுப் புள்ளியாகக் கொண்டு திம்னாத்-கேரேசின் சார்பு இருப்பிடத்தைக் குறிக்கிறது.
