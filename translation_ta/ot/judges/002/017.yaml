base_translation:
  language: en
  yaml_path: translation/ot/judges/002/017.yaml
  text: Yet they did not listen even to their judges[a], for they prostituted themselves after other gods and bowed down to them. They quickly turned aside from the way in which their fathers had walked in obeying the commandments of Yahweh; they did not do so.
translation:
  language: ta
  text: ஆனாலும், அவர்கள் தங்கள் நியாயாதிபதிகளுக்குக்கூட செவிகொடுக்கவில்லை. ஏனெனில், அவர்கள் வேறு தெய்வங்களைப் பின்தொடர்ந்து வேசித்தனம் புரிந்தார்கள்[a]; அவற்றுக்கு முன் தலைவணங்கினார்கள். யாவேயின் கட்டளைகளுக்குக் கீழ்ப்படிந்து தங்கள் மூதாதையர் நடந்த வழியிலிருந்து அவர்கள் விரைவாக விலகினார்கள்; அவர்கள் அவ்வாறு செய்யவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேறு தெய்வங்களைப் பின்தொடர்ந்து வேசித்தனம் புரிந்தார்கள்.” விக்கிரக வழிபாட்டையும் உடன்படிக்கைக்கு உண்மையற்றிருப்பதையும் குறிக்க எபிரெயம் பாலியல் உண்மையின்மையின் உருவகத்தைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: ஆனாலும் ... கூட
  rationale: முந்தைய சூழலுடன் உள்ள மிதமான முரண்பாட்டையும், நியாயாதிபதிகளுக்குக்கூட அவர்கள் செவிகொடுக்கவில்லை என்ற வலியுறுத்தலையும் வெளிப்படுத்துகிறது.
- source_word: אֶל שֹׁפְטֵיהֶם לֹא שָׁמֵעוּ
  choice: அவர்கள் தங்கள் நியாயாதிபதிகளுக்குக்கூட செவிகொடுக்கவில்லை
  rationale: שׁמע என்பதன் ‘கேட்டு ஏற்றுக்கொள்/செவிகொடு’ என்ற கருத்தைத் தக்கவைத்து, கீழ்ப்படிய மறுத்ததையும் சூழல் உணர்த்தும்படி செய்கிறது.
- source_word: שֹׁפְטֵיהֶם
  choice: தங்கள் நியாயாதிபதிகள்
  rationale: இந்தக் காலத்தில் எழுப்பப்பட்ட குறிப்பிட்ட தலைவர்களைக் குறிக்கும் வரலாற்றுப் பதவிப்பெயரைப் பொதுவான ‘தலைவர்கள்’ என்று மாற்றாமல் தக்கவைக்கிறது.
- source_word: זָנוּ אַחֲרֵי
  choice: பின்தொடர்ந்து வேசித்தனம் செய்தார்கள்
  rationale: விக்கிரக வழிபாட்டையும் உடன்படிக்கைத் துரோகத்தையும் பாலியல் உண்மையின்மையின் வலுவான உருவகத்தால் கூறும் எபிரெயச் சொல்லின் அதிர்வைத் தக்கவைக்கிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்கள்
  rationale: யாவே அல்லாத தெய்வங்களை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: அவற்றுக்கு முன்பாகத் தலைவணங்கினார்கள்
  rationale: வழிபாட்டைக் குறிக்கும் உடல்சார்ந்த பணிதல்/வணங்குதல் என்ற மூலப்படிமத்தைத் தக்கவைக்கிறது.
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: வழியிலிருந்து அவர்கள் விரைவாக விலகினார்கள்
  rationale: வாழ்க்கை நடத்தையை ஒரு வழியாகக் காட்டும் உருவகத்தையும், מַהֵר குறிக்கும் விரைவையும் காக்கிறது.
- source_word: אֲשֶׁר הָלְכוּ אֲבוֹתָם
  choice: தங்கள் மூதாதையர் நடந்த
  rationale: ‘நடத்தல்’ என்ற மூல உருவகத்தைத் தக்கவைத்து, אֲבוֹתָם என்பதைக் காலந்தாழ்ந்த ‘பிதாக்கள்’ என்பதற்குப் பதிலாக இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: לִשְׁמֹעַ מִצְוֺת יְהוָה
  choice: யாவேயின் கட்டளைகளுக்குக் கீழ்ப்படிந்து
  rationale: கட்டளைகளுடன் வரும் שׁמע இங்கு செயற்பூர்வமான கீழ்ப்படிதலைக் குறிக்கிறது; இந்தச் சொற்றொடர் மூதாதையர் நடந்த வழியின் தன்மையை விளக்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலான ஒலிபெயர்ப்பைத் தமிழில் வழங்குகிறது.
- source_word: לֹא עָשׂוּ כֵן
  choice: தங்கள் மூதாதையரைப் போல அவர்கள் நடக்கவில்லை
  rationale: சொல்லுக்குச் சொல் ‘அவர்கள் அவ்வாறு செய்யவில்லை’ என்று கூறுவதைக் காட்டிலும், ‘அவ்வாறு’ சுட்டுவது மூதாதையரின் கீழ்ப்படிதலான நடத்தை என்பதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: זָנוּ என்பதில் உடன்படிக்கைத் துரோகத்தைக் குறிக்கும் பாலியல் உருவகம்
  choice: வேசித்தனம் செய்தார்கள்
  alternative: உண்மையற்றவர்களாக நடந்துகொண்டார்கள்
  rationale: மூல எபிரெயம் விக்கிரக வழிபாட்டை ஒழுக்கரீதியாகத் தீவிரமான பாலியல் உண்மையின்மை உருவகத்தால் சித்தரிக்கிறது. அதை பொதுவான ‘உண்மையின்மை’ என்று மழுங்கடிக்காமல் தக்கவைக்கிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட தெய்வீகப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: לֹא עָשׂוּ כֵן என்பதன் சுட்டுப்பொருள்
  choice: தங்கள் மூதாதையரைப் போல அவர்கள் நடக்கவில்லை
  alternative: அவர்கள் அவ்வாறு செய்யவில்லை
  rationale: ‘அவ்வாறு’ என்பது யாவேயின் கட்டளைகளுக்குக் கீழ்ப்படிந்து மூதாதையர் நடந்ததைச் சுட்டுகிறது. தமிழ் வாசகருக்கு அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நியாயாதிபதிகள்’ என்ற வரலாற்றுப் பதவிப்பெயர் தக்கவைக்கப்பட்டுள்ளது; ‘வழி’ மற்றும் ‘நடத்தல்’ உருவகங்களும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன. வலுவான ‘வேசித்தனம்’ உருவகம் மென்மையாக்கப்படாமல், அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
