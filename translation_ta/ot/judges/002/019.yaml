  text: וְ/הָיָ֣ה בְּ/מ֣וֹת הַ/שּׁוֹפֵ֗ט יָשֻׁ֨בוּ֙ וְ/הִשְׁחִ֣יתוּ מֵֽ/אֲבוֹתָ֔/ם לָ/לֶ֗כֶת אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים לְ/עָבְדָ֖/ם וּ/לְ/הִשְׁתַּחֲוֺ֣ת לָ/הֶ֑ם לֹ֤א הִפִּ֨ילוּ֙ מִ/מַּ֣עַלְלֵי/הֶ֔ם וּ/מִ/דַּרְכָּ֖/ם הַ/קָּשָֽׁה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/019.yaml
  text: And when the judge died[a], they turned back and acted more corruptly than their fathers, going after other gods to serve them and to bow down to them. They did not drop any of their deeds or their stubborn way.
translation:
  language: ta
  text: நியாயாதிபதி இறந்ததும், அவர்கள் மீண்டும் திரும்பி, தங்கள் முன்னோர்களைவிட அதிகமாகச் சீர்கெட்டார்கள். வேறு தெய்வங்களைப் பின்பற்றி, அவற்றுக்குப் பணிசெய்யவும் அவற்றுக்கு முன் பணிந்து வணங்கவும் செய்தார்கள். அவர்கள் தங்கள் செயல்களையோ தங்கள் பிடிவாதமான வழியையோ கைவிடவில்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் தங்கள் பழக்கங்களையோ தங்கள் பிடிவாதமான வழியையோ விட்டொழிக்கவில்லை.” எபிரெயச் சொற்றொடர், அவர்கள் அவற்றை ‘விழவிடவில்லை’ என்று நேரடியாகக் கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּמוֹת הַשּׁוֹפֵט
  choice: நியாயாதிபதி இறந்ததும்
  rationale: எபிரெயக் கதைநடைச் சூத்திரத்தைச் சொற்சொல்லாக அல்லாமல் இயல்பான தமிழ்க் காலவாக்கியமாக வழங்குகிறது; שֹׁפֵט என்பதற்குப் புத்தகத்தின் நிலையான வரலாற்றுச் சொல்லான ‘நியாயாதிபதி’ தக்கவைக்கப்படுகிறது.
- source_word: יָשֻׁבוּ
  choice: அவர்கள் மீண்டும் பழைய வழிக்குத் திரும்பி
  rationale: שׁוּב இங்கு நியாயாதிபதியின் காலத்துக்குப் பின் ஏற்பட்ட பழைய நடத்தைக்கான மீள்சரிவைக் குறிக்கிறது. ‘பழைய வழி’ என்பது சூழலால் தெளிவாகப் பெறப்படும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְהִשְׁחִיתוּ מֵאֲבוֹתָם
  choice: தங்கள் முன்னோர்களைவிட அதிகமாகச் சீர்கெட்டார்கள்
  rationale: Hiphil வடிவின் ஒழுக்கச் சீரழிவையும் מן குறிக்கும் ஒப்பீட்டையும் தெளிவாகக் காட்டுகிறது. אֲבוֹתָם இங்கு முந்தைய தலைமுறையினரைச் சுட்டுவதால் ‘முன்னோர்கள்’ இயல்பானது.
- source_word: לָלֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்களைப் பின்பற்றி
  rationale: ‘பின்னே செல்லுதல்’ என்ற விசுவாசம்/பற்றுறுதியைக் குறிக்கும் உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது; ‘வேறு தெய்வங்கள்’ என்பது இன அல்லது நாட்டுச் சார்பைத் தேவையின்றி சேர்க்காது.
- source_word: לְעָבְדָם
  choice: அவற்றுக்குப் பணிசெய்யவும்
  rationale: עבד என்பதிலுள்ள சேவையின் தனித்த பொருளைத் தக்கவைத்து, அடுத்து வரும் பணிந்து வணங்குதலுடன் ஒன்றாக்காமல் வழங்குகிறது.
- source_word: וּלְהִשְׁתַּחֲוֹת לָהֶם
  choice: அவற்றுக்கு முன் பணிந்து வணங்கவும்
  rationale: השתחוה குறிக்கும் உடலால் பணிதலையும் வழிபாட்டு மரியாதையையும் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לֹא הִפִּילוּ מִמַּעַלְלֵיהֶם
  choice: அவர்கள் தங்கள் செயல்களையோ ... கைவிடவில்லை
  rationale: נפל Hiphil + מן என்பதன் ‘விழவிடுதல்/விட்டொழித்தல்’ என்ற உருவகப் பொருளை இயல்பான தமிழில் ‘கைவிடவில்லை’ என வழங்குகிறது; நேரடியான உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּמִדַּרְכָּם הַקָּשָׁה
  choice: தங்கள் பிடிவாதமான வழியையோ
  rationale: דֶּרֶךְ என்பதை வாழ்க்கைநடத்தையாகவும் קָשֶׁה என்பதை உடல் கடினத்தன்மை அல்ல, ஒழுக்கப் பிடிவாதமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: אֱלֹהִים אֲחֵרִים என்பதன் பலதெய்வச் சூழல்
  choice: வேறு தெய்வங்கள்
  alternative: அந்நிய தெய்வங்கள்
  rationale: உரை ஆண்டவரைத் தவிர்ந்த பிற தெய்வங்களைப் பின்பற்றிய உடன்படிக்கைத் துரோகத்தைச் சொல்கிறது. ‘அந்நிய’ என்பது மூலத்தில் கட்டாயமில்லாத இன/நாட்டுச் சார்ந்த நுணுக்கத்தைச் சேர்க்கக்கூடும்.
- issue: השתחוה என்பதில் வழிபாடும் உடலால் பணிதலும்
  choice: பணிந்து வணங்குதல்
  alternative: வழிபடுதல்
  rationale: பொதுவான ‘வழிபடுதல்’ என்பதைக் காட்டிலும் மூலத்தில் உள்ள விழுந்து பணியும் உடல் நடவடிக்கையையும் வழிபாட்டு நோக்கத்தையும் ஒன்றாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நியாயாதிபதி’ நூலின் வரலாற்று-இலக்கியச் சொல்லாட்சியைத் தக்கவைக்கிறது. எபிரெயத்தின் இயல்பற்ற ‘விழவிடவில்லை’ என்ற உருவகம் முதன்மை உரையில் இயல்பான ‘கைவிடவில்லை’ எனவும், அதன் நேரடி வடிவம் அடிக்குறிப்பிலும் வழங்கப்பட்டுள்ளது.
