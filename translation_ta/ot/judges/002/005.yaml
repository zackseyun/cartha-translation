  variant: modern standard Tamil
source:
  edition: WLC
  text: וַֽ/יִּקְרְא֛וּ שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בֹּכִ֑ים וַ/יִּזְבְּחוּ שָׁ֖ם לַֽ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/005.yaml
  text: So they called the name of that place Bochim[a], and they sacrificed there to Yahweh.
translation:
  language: ta
  text: அதனால் அவர்கள் அந்த இடத்திற்குப் போகீம்[a] என்று பெயரிட்டு, அங்கே யாவேக்கு பலியிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “போகீம்” என்பது “அழுகிறவர்கள்” அல்லது “அழுவோர்” என்பதற்கான எபிரெயச் சொல்லுடன் தொடர்புடையது.
    reason: இடப்பெயரின் சொல்விளையாட்டையும் மூலப்பொருளையும் விளக்குகிறது.
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם
  choice: பெயரிட்டு
  rationale: எபிரெய மொழியின் ‘பெயரை அழைத்தார்கள்’ என்ற சொற்றொடர் தமிழில் இயல்பாக ‘பெயரிட்டார்கள்’ எனப் பொருள்படும்; தொடரின் வாவ் வடிவத்தை முன்னைய நிகழ்வின் விளைவாக ‘அதனால்’ பிரதிபலிக்கிறது.
- source_word: הַמָּקוֹם הַהוּא
  choice: அந்த இடத்திற்கு
  rationale: சுட்டுப்பெயரடை הַהוּא-வை ‘அந்த’ என்று தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: בֹּכִים
  choice: போகீம்
  rationale: இது இடப்பெயராக வருவதால் மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது; அழுதல் தொடர்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּזְבְּחוּ
  choice: பலியிட்டார்கள்
  rationale: זבח வினையின் பலியிடுதல் என்ற சடங்குசார் பொருளை இயல்பான தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: முன்னர் பெயரிடப்பட்ட இடத்தைச் சுட்டும் இடவினையடை.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: לְ முன்னொட்டின் நோக்குப் பொருளையும் יהוה என்ற உடன்படிக்கைப் பெயரையும் நேரடியாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் நான்கெழுத்து இறைப்பெயரை பொதுப்பட்டமாக மாற்றாமல், தனிப்பெயராக ஒலிபெயர்க்கிறது.
- issue: בֹּכִים என்பதை மொழிபெயர்ப்பதா அல்லது ஒலிபெயர்ப்பதா
  choice: போகீம்
  alternative: அழுகிறவர்கள்
  rationale: இங்கு அது இடப்பெயராகச் செயல்படுவதால் பிரதான உரையில் ஒலிபெயர்க்கப்படுகிறது; அதன் சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயப் பெயரிடும் மரபுத்தொடர் தமிழின் இயல்புக்கேற்ப ‘பெயரிட்டு’ என வழங்கப்பட்டு, இடப்பெயரின் பொருள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
