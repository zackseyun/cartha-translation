base_translation:
  language: en
  yaml_path: translation/ot/judges/002/004.yaml
  text: And when the angel of Yahweh spoke these words to all the sons of Israel[b][a], the people raised their voices and wept.
translation:
  language: ta
  text: யாவேயின் தூதர்[b] இந்த வார்த்தைகளை இஸ்ரவேல் மக்கள் அனைவரிடமும்[a] பேசியபோது, மக்கள் தங்கள் குரலை உயர்த்தி அழுதார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, ‘இஸ்ரவேலின் மகன்கள் அனைவரிடமும்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘யாவேயின் செய்தியாளர்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: பேசியபோது
  rationale: היה உடன் வரும் காலவினை அமைப்பு பின்னணிக் காலத்தை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பான ‘பேசியபோது’ என்பது நிகழ்ச்சித் தொடரை தேவையற்ற ‘அது நிகழ்ந்தது’ என்ற சொல்லாக்கமின்றி தெரிவிக்கிறது.
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאַךְ என்பதற்கு ‘தூதர்’ அல்லது ‘செய்தியாளர்’ என்று பொருள் வரலாம். ‘தூதர்’ என்பது சூழலில் இயல்பாகவும், மூலச்சொல்லின் செயல்பாட்டு பொருளை முற்றிலும் இழக்காமலும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் வழக்கமான ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகளை
  rationale: דְּבָרִים இங்கு முன்பு உரைக்கப்பட்ட செய்தியின் வார்த்தைகளைக் குறிக்கிறது; ‘வார்த்தைகள்’ அதன் வாய்மொழித் தன்மையைப் பாதுகாக்கிறது.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள் அனைவரிடமும்
  rationale: சொல்லர்த்தமாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு கூடியிருந்த இஸ்ரவேலரைக் கூட்டாகக் குறிக்கிறது. ‘இஸ்ரவேல் மக்கள் அனைவரும்’ என்பது உள்ளடக்கத்தை மாற்றாமல் இயல்பான நவீனத் தமிழில் தருகிறது; சொல்லர்த்த வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיִּשְׂאוּ הָעָם אֶת קוֹלָם
  choice: மக்கள் தங்கள் குரலை உயர்த்தி
  rationale: ‘குரலை உயர்த்துதல்’ என்ற எபிரெய மரபுத்தொடரைத் தமிழிலும் தெளிவாகப் பாதுகாக்கிறது; உடைமைப் பன்மையை ‘தங்கள்’ வெளிப்படுத்துகிறது.
- source_word: וַיִּבְכּוּ
  choice: அழுதார்கள்
  rationale: בכה என்பதன் நேரான பொருள் ‘அழுதல்’; மூலத்தில் வெளிப்படையாக இல்லாத தீவிரத்தைச் சேர்க்காமல் solemnமான நிகழ்வைத் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல வசனத்தில் நான்கெழுத்துத் தெய்வீகப் பெயர் நேரடியாக வருகிறது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் தனிப்பட்ட உடன்படிக்கைப் பெயராக ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: מַלְאַךְ என்பவர் வானதூதரா அல்லது செய்தியாளரா
  choice: தூதர்
  alternative: செய்தியாளர்
  rationale: மூலச்சொல் இரண்டு பொருட்களையும் ஏற்கிறது. இச்சூழலில் மரபாக வானதூதரைக் குறிக்கும் வாசிப்பு இயல்பானது; இருப்பினும் ‘தூதர்’ என்ற தேர்வும் அடிக்குறிப்பும் சொற்பொருள் சார்ந்த மாற்று வாய்ப்பைத் திறந்தே வைக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘குரலை உயர்த்தி’ என்ற சொல்லாக்கம் எபிரெய மரபுத்தொடரின் உருவகத்தைத் தக்கவைக்கிறது; ‘இஸ்ரவேல் மக்கள்’ என்பது பாலினத்தைக் குறுகச் செய்யாமல் இங்குள்ள கூட்டுப்பொருளை இயல்பாகத் தெரிவிக்கிறது.
