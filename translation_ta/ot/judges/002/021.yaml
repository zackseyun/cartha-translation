  text: I also will no longer continue to drive out before them any of the nations that Joshua left when he died[a].
translation:
  language: ta
  text: நானும், யோசுவா இறந்தபோது அவர் விட்டுவைத்த நாடுகளில் ஒன்றைக்கூட இனி அவர்களுக்கு முன்னிலையிலிருந்து அகற்றமாட்டேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோசுவா விட்டுவைத்த நாடுகளில் ஒன்றைக்கூட இனி அவர்களுக்கு முன்னிலையிலிருந்து நான் அகற்றமாட்டேன்; பின்னர் அவர் இறந்தார்.” எபிரேயத்தில் சொற்சொல்லாக “அவர் இறந்தார்” என்று உள்ளது; முதன்மை உரையிலுள்ள “இறந்தபோது” அதன் காலத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: நானும்
  rationale: גַּם என்பதன் தொடர்ச்சி மற்றும் வலியுறுத்தலைத் தனிப்பட்ட சுட்டுப்பெயருடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא אוֹסִיף
  choice: இனி ... மாட்டேன்
  rationale: தொடர்ந்து செய்துவந்த செயல் இனிமேல் நடைபெறாது என்ற எதிர்மறைத் தொடர்ச்சி அர்த்தத்தை நவீன தமிழில் இயல்பாகத் தருகிறது; கூடுதலாக ‘தொடர்ந்து’ என்று சேர்ப்பது தேவையற்ற மீளுரையாகும்.
- source_word: לְהוֹרִישׁ
  choice: துரத்திவிட
  rationale: கானான் கைப்பற்றல் சூழலில், அங்கு இருந்த மக்களை அகற்றுவது அல்லது வெளியேற்றுவது என்ற பொருளை எளிய தமிழில் தெரிவிக்கிறது.
- source_word: אִישׁ ... מִן הַגּוֹיִם
  choice: நாடுகளில் ஒன்றைக்கூட
  rationale: אִישׁ இங்கு பகிர்வுச் சார்பாக ‘ஒருவரைக்கூட/ஒன்றைக்கூட’ என்ற வலியுறுத்தலைக் கொண்டது; நாடுகளுடன் தமிழில் ‘ஒன்றைக்கூட’ இயல்பானது.
- source_word: מִפְּנֵיהֶם
  choice: அவர்களுக்கு முன்பாக இருந்து
  rationale: அவர்களின் முன்னிலையிலிருந்து அகற்றுதல் என்ற எபிரேய உருவகத்தைத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר עָזַב יְהוֹשֻׁעַ
  choice: யோசுவா விட்டுவைத்துவிட்டு
  rationale: עזב என்பதன் ‘விட்டுவை/எஞ்சவிடு’ என்ற பொருளையும், அந்த நாடுகள் தொடர்ந்து இருந்ததையும் வெளிப்படுத்துகிறது.
- source_word: וַיָּמֹת
  choice: இறந்தபோது
  rationale: எபிரேயத்தில் சொற்சொல்லாக ‘அவன் இறந்தான்’ என்றிருந்தாலும், முந்தைய தொடருடன் உள்ள காலத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: தெய்வீகப் பேச்சாளரை அடையாளப்படுத்துதல்
  choice: முதல் நபர் ஒருமையான ‘நான்’ மட்டுமே வைக்கப்பட்டது
  alternative: ‘ஆண்டவர்’ என்பதை விளக்கமாகச் சேர்த்தல்
  rationale: இவ்வசனத்தின் எபிரேய உரையில் தெய்வீகப் பெயர் மீண்டும் இடம்பெறவில்லை; சூழல் பேச்சாளரைத் தெளிவுபடுத்துவதால் மூலத்தில் இல்லாத பெயரைச் சேர்க்கவில்லை.
- issue: וַיָּמֹת என்பதன் தொடரியல் தொடர்பு
  choice: காலப் பொருளில் ‘இறந்தபோது’
  alternative: சொற்சொல்லாக ‘அவன் இறந்தான்’
  rationale: முக்கிய உரையில் இயல்பான காலத் தொடர்பு தரப்பட்டுள்ளது; இணைப்புச் சொல்லின் சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு புரியும் வகையில் எளிமையும், வேதாகம உரைக்கு ஏற்ற கண்ணியமும் பேணப்பட்டுள்ளன. ‘நாடுகளில் ஒன்றைக்கூட’ என்பது எபிரேயப் பகிர்வு வலியுறுத்தலைத் தெளிவாகக் காட்டுகிறது.
