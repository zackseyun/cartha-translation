source:
  edition: WLC
  text: וְ/אַתֶּ֗ם לֹֽא תִכְרְת֤וּ בְרִית֙ לְ/יֽוֹשְׁבֵי֙ הָ/אָ֣רֶץ הַ/זֹּ֔את מִזְבְּחוֹתֵי/הֶ֖ם תִּתֹּצ֑וּ/ן וְ/לֹֽא שְׁמַעְתֶּ֥ם בְּ/קֹלִ֖/י מַה זֹּ֥את עֲשִׂיתֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/002.yaml
  text: And you were not to make a covenant with the inhabitants of this land; you were to tear down their altars[a]. But you have not listened to my voice. What is this you have done?
translation:
  language: ta
  text: நீங்கள் இந்த நாட்டில் குடியிருப்பவர்களுடன் உடன்படிக்கை செய்யக்கூடாது[a]; அவர்களுடைய பலிபீடங்களை இடித்துத் தள்ள வேண்டும். ஆனால் நீங்கள் என் குரலுக்குச் செவிகொடுக்கவில்லை. நீங்கள் செய்திருப்பது என்ன?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “உடன்படிக்கையை வெட்டுதல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִכְרְתוּ בְרִית
  choice: உடன்படிக்கை செய்ய
  rationale: எபிரெய மொழிவழக்கு சொல்லுக்கு சொல் ‘உடன்படிக்கையை வெட்டுதல்’ என இருந்தாலும், நவீன தமிழில் ‘உடன்படிக்கை செய்தல்’ இயல்பாகவும் בְּרִית என்பதன் உடன்படிக்கை சார்ந்த வலிமையைத் தக்கவைத்தும் உள்ளது.
- source_word: לְיֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: இந்த நாட்டில் குடியிருக்கிறவர்களோடு
  rationale: יֹשְׁבֵי என்பது அங்கு குடியிருப்பவர்களைக் குறிக்கிறது; ‘இந்த நாடு’ என்பது சுட்டுப்பெயரின் வலிமையைப் பாதுகாக்கிறது. לְ இங்கு உடன்படிக்கை செய்யப்படும் தரப்பைக் குறிப்பதால் ‘-ஓடு’ இயல்பான தமிழ்.
- source_word: מִזְבְּחוֹתֵיהֶם תִּתֹּצוּן
  choice: அவர்களுடைய பலிபீடங்களை இடித்துப்போட வேண்டும்
  rationale: נתץ என்பது கட்டமைப்புகளையும் பலிபீடங்களையும் இடித்தல் அல்லது தகர்த்தல் என்பதைக் குறிக்கிறது. ‘இடித்துப்போட’ செயலைத் தெளிவாகக் காட்டுகிறது; பின்னோக்கி நினைவூட்டப்படும் கட்டளையைத் தமிழில் ‘வேண்டும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלִי
  choice: ஆனால் நீங்கள் என் குரலுக்குச் செவிகொடுக்கவில்லை
  rationale: שמע בקול என்பது கேட்பதையும் அதற்குக் கீழ்ப்படிவதையும் உள்ளடக்கக்கூடும். ‘குரலுக்குச் செவிகொடுக்கவில்லை’ என்ற வடிவம் மூல உருவகத்தைத் தக்கவைத்து, கீழ்ப்படியாமையைச் சூழல் உணர்த்த அனுமதிக்கிறது.
- source_word: מַה זֹּאת עֲשִׂיתֶם
  choice: நீங்கள் செய்திருப்பது என்ன?
  rationale: இது காரணத்தை நேரடியாகக் கேட்பதைவிட, செய்த காரியத்தைக் குறித்த அதிர்ச்சியும் கண்டனமும் கொண்ட வினா. தமிழ் வடிவம் அந்தச் சொல்லாட்சி வலிமையை இயல்பாகப் பாதுகாக்கிறது.
- source_word: וְאַתֶּם לֹא ... תִּכְרְתוּ ... תִּתֹּצוּן
  choice: நீங்கள் ... செய்யக்கூடாது; ... இடித்துப்போட வேண்டும்
  rationale: இங்குள்ள imperfect வடிவங்கள் முன்பு கொடுக்கப்பட்ட கட்டளைகளை இப்போதைய கண்டனத்தில் நினைவூட்டுகின்றன. தமிழில் தடை மற்றும் கடமையை இவ்வாறு கூறுவது காலத்தை அளவுக்கு மீறிக் குறிப்பாக்காமல் கட்டளையின் வலிமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: கானானிய குடிகளோடு இஸ்ரவேல் ஏற்படுத்தக்கூடாத உறவுக்கான בְּרִית என்ற சொல்
  choice: உடன்படிக்கை
  alternative: ஒப்பந்தம் / சமாதான உடன்பாடு
  rationale: ‘உடன்படிக்கை’ என்பது சொல்லின் பரந்த வேதாகம மற்றும் உறவுசார் வலிமையைத் தக்கவைக்கிறது; வெறும் அரசியல் ஒப்பந்தமாக அதன் பொருளைக் குறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் கண்டனத்தின் கண்ணியமான நேரடித்தன்மையைப் பாதுகாக்கும் வகையிலும் மொழியாக்கப்பட்டுள்ளது. தேவையற்ற சொல்லுக்குச் சொல் எபிரெய மொழிவழக்கு தவிர்க்கப்பட்டுள்ளது; இவ்வசனத்திற்கு அவசியமான அடிக்குறிப்பு இல்லை.
