base_translation:
  language: en
  yaml_path: translation/ot/judges/002/010.yaml
  text: And all that generation also were gathered to their fathers[a], and another generation arose after them who did not know Yahweh[b], or even the work that he had done for Israel.
translation:
  language: ta
  text: அந்தத் தலைமுறையினர் அனைவரும் கூடத் தங்கள் முன்னோர்களுடன் சேர்க்கப்பட்டார்கள்[a]. அவர்களுக்குப் பிறகு வேறொரு தலைமுறை எழும்பியது. அவர்கள் யாவேவை அறியவில்லை[b]; அவர் இஸ்ரவேலுக்காகச் செய்த செயலையும் அறியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தங்கள் முன்னோர்களுடன் சேர்க்கப்பட்டார்கள்” என்பது, ஒருவர் இறந்து தமது முன்னோர்களுடன் சேர்ந்ததைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: “யாவேவை அங்கீகரிக்கவில்லை” என்றும் பொருள்படலாம்; இங்குள்ள எபிரேயச் சொல் தகவல் அறிவை மட்டுமல்ல, உறவு அல்லது உடன்படிக்கை சார்ந்த அறிதலையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם כָּל הַדּוֹר הַהוּא
  choice: அந்தத் தலைமுறையினர் அனைவரும்
  rationale: וְגַם முந்தைய சூழலோடு கூடுதலான தொடர்பைக் காட்டுகிறது; தமிழில் தனியே ‘மேலும்’ சேர்ப்பது இயல்பற்றதாக இருப்பதால், ‘அனைவரும்’ என்பதில் அதன் சேர்க்கை மற்றும் முழுமைச் சாயல் இயல்பாக வெளிப்படுகிறது.
- source_word: נֶאֶסְפוּ אֶל אֲבוֹתָיו
  choice: தங்கள் முன்னோர்களுடன் சேர்க்கப்பட்டார்கள்
  rationale: இறந்து முன்னோர்களுடன் சேர்ந்ததைக் குறிக்கும் எபிரேய மரபுத்தொடரின் உருவகத்தைத் தக்கவைக்கிறது; ‘தந்தையர்’ என்பதைவிட ‘முன்னோர்’ நவீனத் தமிழில் இப்பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: וַיָּקָם דּוֹר אַחֵר אַחֲרֵיהֶם
  choice: அவர்களுக்குப் பிறகு வேறொரு தலைமுறை எழும்பியது
  rationale: காலத் தொடர்ச்சியையும் முந்தைய தலைமுறையிலிருந்து வேறுபட்ட புதிய குழுவின் தோற்றத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: לֹא יָדְעוּ אֶת יְהוָה
  choice: அவர்கள் யாவேவை அறியவில்லை
  rationale: יָדַע என்பது தகவல் அறிவை மட்டுமல்ல, உறவு மற்றும் உடன்படிக்கை சார்ந்த அறிதலையும் குறிக்கலாம். ‘அறியவில்லை’ இந்தப் பொருள் அகலத்தையும் தெளிவின்மையையும் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை பட்டப்பெயராக மாற்றாமல், அதன் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: וְגַם אֶת הַמַּעֲשֶׂה אֲשֶׁר עָשָׂה לְיִשְׂרָאֵל
  choice: அவர் இஸ்ரவேலுக்காகச் செய்த செயலையும் அறியவில்லை
  rationale: இரண்டாவது அறியாமைப் பொருளை ‘செயலையும்’ எனச் சேர்த்துக் காட்டுகிறது. לְ இங்கு இஸ்ரவேலின் நன்மைக்காகச் செய்த செயலைக் குறிக்கும் பயனாளிப் பொருளில் ‘இஸ்ரவேலுக்காக’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: ‘யாவேவை அறியவில்லை’ என்பதன் பொருள்
  choice: உறவு, உடன்படிக்கை, அனுபவம், தகவல் ஆகிய சாத்தியங்களை உள்ளடக்கும் அகலமான ‘அறியவில்லை’
  alternative: ‘யாவேவை ஏற்றுக்கொள்ளவில்லை’ அல்லது ‘யாவேவைப் பற்றி அறிந்திருக்கவில்லை’
  rationale: எபிரேய יָדַע பலவகையான அறிதலைக் குறிக்கிறது; அடுத்ததாக அவரது செயலையும் அறியவில்லை என்று வருவதால், ஒரே பொருளாகக் குறுக்காமல் மூலத்தின் இறையியல் அழுத்தத்தைத் தக்கவைக்கிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: கர்த்தர் அல்லது யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட தெய்வீகப் பெயரை வெளிப்படையாகவும் பெயராகவும் வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடையில் வடிவமைக்கப்பட்டது. எபிரேய மரபுத்தொடரின் உருவகம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது; ‘அறிதல்’ என்பதிலுள்ள நோக்கமுள்ள பொருள் அகலம் தீர்மானிக்கப்படாமல் விடப்பட்டுள்ளது.
