base_translation:
  language: en
  yaml_path: translation/ot/judges/002/014.yaml
  text: Then the anger of Yahweh burned against Israel[a], and he gave them into the hand of plunderers, who plundered them. He sold them into the hand of their enemies all around[c][b], so that they could no longer stand before their enemies.
translation:
  language: ta
  text: அப்போது இஸ்ரவேலுக்கு எதிராக யாவேயின் கோபம் பற்றியெரிந்தது. அவர் அவர்களைக் கொள்ளையர்களின் கையில் ஒப்படைத்தார்; அவர்கள் அவர்களைக் கொள்ளையிட்டனர்.[a] அவர் அவர்களைச் சுற்றிலும் இருந்த அவர்களுடைய எதிரிகளின் கையில் அவர்களை விற்றார். அதனால் அவர்கள் தங்கள் எதிரிகளின் முன் இனி நிற்க முடியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவ்வசனத்தில் “கையில்” என்பது ஒருவரின் அதிகாரத்திற்குள் அல்லது கட்டுப்பாட்டிற்குள் என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: கோபம் பற்றியெரிந்தது
  rationale: எபிரெய மொழியின் ‘கோபம் எரிதல்’ என்ற உயிரோட்டமான உருவகத்தை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயரால் மாற்றப்படாமல், எபிரெய வேதத்தில் வரும் இறைத் திருப்பெயரின் வழக்கமான ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: וַיִּתְּנֵם בְּיַד
  choice: அவர்களைக் ... கையில் ஒப்படைத்தார்
  rationale: ‘கையில் கொடுத்தார்’ என்பது மற்றொருவரின் அதிகாரத்திற்குள் ஒப்படைப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்; தமிழிலும் புரியக்கூடிய வகையில் ‘ஒப்படைத்தார்’ சேர்க்கப்பட்டுள்ளது.
- source_word: שֹׁסִים / וַיָּשֹׁסּוּ
  choice: கொள்ளையிடுகிறவர்கள் / கொள்ளையிட்டார்கள்
  rationale: பெயரெச்சத்திற்கும் அதே வேரிலிருந்து வரும் வினைக்கும் இடையிலான சொல் தொடர்பைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: וַיִּמְכְּרֵם
  choice: அவர் அவர்களை விற்றார்
  rationale: மூலத்தின் நேரடியான ‘விற்றார்’ என்ற கடுமையான உருவகத்தை மென்மைப்படுத்தாமல் பாதுகாக்கிறது.
- source_word: אֹיְבֵיהֶם מִסָּבִיב
  choice: அவர்களைச் சுற்றிலுமிருந்த எதிரிகள்
  rationale: எதிரிகள் எல்லாப் பக்கங்களிலும் இருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְלֹא יָכְלוּ עוֹד לַעֲמֹד לִפְנֵי
  choice: தங்கள் எதிரிகளுக்கு முன்பாக அவர்களால் இனி நிலைநிற்க முடியவில்லை
  rationale: எதிரிகளை எதிர்கொண்டு நிலைத்திருக்க இயலாமையைக் குறிக்கும் மூலச் சொல்லமைப்பை நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: இறைக் கோபத்தைக் குறிக்கும் மனித இயல்புசார்ந்த உருவகம்
  choice: யாவேயின் கோபம் பற்றியெரிந்தது
  alternative: யாவே இஸ்ரவேல்மீது கோபமடைந்தார்
  rationale: மூலத்தில் உள்ள ‘கோபம் எரிதல்’ என்ற வலுவான உருவகத்தை விளக்கவுரையாக மாற்றாமல் தக்கவைக்கிறது.
- issue: இஸ்ரவேலை எதிரிகளிடம் ‘விற்றார்’ என்ற நியாயத்தீர்ப்பு உருவகம்
  choice: அவர் அவர்களை விற்றார்
  alternative: அவர் அவர்களை எதிரிகளிடம் ஒப்படைத்தார்
  rationale: ‘விற்றார்’ என்பது மூலத்தின் திட்டவட்டமான வினை; அதன் இறையியல் தீவிரத்தை மென்மைப்படுத்தாமல் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. மூலத்தின் மறுமொழி, உருவகம், நியாயத்தீர்ப்பின் தீவிரம் ஆகியவை இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
