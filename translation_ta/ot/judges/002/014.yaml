revisions:
- from: அப்போது இஸ்ரவேலுக்கு எதிராக யாவேயின் கோபம் பற்றியெரிந்தது. அவர் அவர்களைக் கொள்ளையிடுகிறவர்களின் கையில் ஒப்படைத்தார்; அவர்கள் இவர்களைக் கொள்ளையிட்டார்கள். அவர்களைச் சுற்றிலுமிருந்த எதிரிகளின் கையில் அவர் அவர்களை விற்றார்.[a] அதனால் தங்கள் எதிரிகளுக்கு முன்பாக அவர்களால் இனி நிலைநிற்க முடியவில்லை.
  to: அப்போது இஸ்ரவேலுக்கு எதிராக யாவேயின் கோபம் பற்றியெரிந்தது. அவர் அவர்களைக் கொள்ளையர்களின் கையில் ஒப்படைத்தார்; அவர்கள் அவர்களைக் கொள்ளையிட்டனர்.[a] அவர் அவர்களைச் சுற்றிலும் இருந்த அவர்களுடைய எதிரிகளின் கையில் அவர்களை விற்றார். அதனால் அவர்கள் தங்கள் எதிரிகளின் முன் இனி நிற்க முடியவில்லை.
  rationale: The revision makes the Tamil more idiomatic while retaining the Hebrew's lexical linkage between the noun and verb for plundering. It maintains the literal and theologically significant "விற்றார்" and preserves the military sense of being unable to stand before one's enemies. The note is retained and its scope clarified for the two occurrences of the Hebrew hand idiom.
