base_translation:
  language: en
  yaml_path: translation/ot/judges/002/001.yaml
  text: Then the angel of Yahweh went up from Gilgal to Bochim and said[a], “I brought you up from Egypt and brought you into the land that I swore to your fathers, and I said[b], ‘I will never break my covenant with you.’”
translation:
  language: ta
  text: யாவேயின் தூதர்[a] கில்காலிலிருந்து போகீமுக்கு[b] மேலே சென்று, “நான் உங்களை எகிப்திலிருந்து மேலே அழைத்துவந்து, உங்கள் தந்தையருக்குச் சத்தியம் செய்து வாக்குறுதி அளித்த நாட்டிற்குள் உங்களைக் கொண்டுவந்தேன். மேலும், ‘உங்களுடனான என் உடன்படிக்கையை நான் ஒருபோதும் முறிக்கமாட்டேன்’ என்று சொன்னேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தூதர்’ என்பதை ‘வானதூதர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘போகீம்’ என்பதற்கு ‘அழுகிறவர்கள்’ அல்லது ‘அழுகையின் இடம்’ என்று பொருள் இருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאַךְ என்பதற்கு ‘தூதர்’ அல்லது ‘வானதூதர்’ என்று பொருள் வரலாம். ‘தூதர்’ என்பது தமிழில் இயல்பாக இருப்பதோடு, இங்கு பேசுபவர் தேவனுடைய முதலாம் நபர் சொற்களைப் பேசுவதால் எழும் அடையாளத் தெளிவின்மையையும் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
- source_word: וַיַּעַל
  choice: மேலே சென்று
  rationale: עלה என்பதன் திசை அல்லது நிலவியல் சார்ந்த ‘மேலே செல்லுதல்’ என்ற நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: הַגִּלְגָּל / הַבֹּכִים
  choice: கில்கால் / போகீம்
  rationale: இடப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன; போகீம் என்ற பெயரின் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אַעֲלֶה אֶתְכֶם מִמִּצְרַיִם
  choice: நான் உங்களை எகிப்திலிருந்து அழைத்துக்கொண்டுவந்து
  rationale: வினை வடிவம் இறந்தகாலச் செயல்களை நினைவுகூரும் உரையோட்டத்தில் நிற்பதால், அடுத்த இறந்தகால வினையுடன் இயல்பாக இணையும் வகையில் நிறைவேறிய கடந்த செயல் என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הָאָרֶץ אֲשֶׁר נִשְׁבַּעְתִּי לַאֲבֹתֵיכֶם
  choice: உங்கள் தந்தையருக்குக் கொடுப்பதாக ஆணையிட்டிருந்த நாடு
  rationale: எபிரெய வாக்கியத்தில் மறைமுகமாக உள்ள ‘கொடுப்பதாக’ என்பதைத் தமிழில் தெளிவுக்காக வெளிப்படுத்துகிறது; אָבוֹת என்பதன் ஆண்பால் குறிப்பை ‘தந்தையர்’ எனத் தக்கவைக்கிறது.
- source_word: לֹא אָפֵר בְּרִיתִי אִתְּכֶם לְעוֹלָם
  choice: உங்களோடு செய்த என் உடன்படிக்கையை நான் ஒருபோதும் முறிக்கமாட்டேன்
  rationale: הפר என்பதன் உடன்படிக்கை சார்ந்த ‘முறித்தல்’ என்ற பொருளையும், לְעוֹלָם உடன் வரும் நிலையான மறுப்பையும் இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: מַלְאַךְ יְהוָה என்பவரின் அடையாளம்
  choice: ‘யாவேயின் தூதர்’ என்று மொழிபெயர்த்து, அவர் யாவேயின் சொந்த முதலாம் நபர் வார்த்தைகளைப் பேசுவதை அப்படியே வைத்தல்
  alternative: அவரை ஒரு படைக்கப்பட்ட வானதூதர் என்றோ, யாவேயின் நேரடியான வெளிப்பாடு என்றோ வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: வசனம் தூதரை அறிமுகப்படுத்தினாலும், அவருடைய பேச்சு யாவே செய்த செயல்களையும் உடன்படிக்கையையும் முதலாம் நபரில் உரைக்கிறது. மொழிபெயர்ப்பு இந்த இறையியல் அழுத்தத்தைத் தீர்மானித்து விடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘உடன்படிக்கை’, ‘ஆணையிட்டிருந்த’ போன்ற வேதாகமக் கருத்துச் சொற்கள் துல்லியத்திற்காக வைக்கப்பட்டுள்ளன; தேவையற்ற பழமையான வினைமுற்றுகள் தவிர்க்கப்பட்டுள்ளன.
