revisions:
- from: அப்போது யோசுவா மக்களை அனுப்பிவிட்டார். இஸ்ரவேலின் மகன்கள்[a] ஒவ்வொருவரும் நாட்டைத் தங்கள் வசமாக்கிக்கொள்வதற்காக அவரவர் சுதந்தரப் பங்கிற்குச் சென்றார்கள்.
  to: அப்போது யோசுவா மக்களை அனுப்பிவிட்டார்; இஸ்ரவேலின் மகன்கள்[a] ஒவ்வொருவரும் நிலத்தைத் தங்கள் உடைமையாக்கிக்கொள்ள அவரவர் மரபுரிமைப் பங்கிற்குச் சென்றார்கள்.
  rationale: ‘நாட்டை’ என்பதற்குப் பதிலாக ‘நிலத்தை’ பயன்படுத்தி הָאָרֶץ என்பதன் சூழல்சார் பொருளைத் துல்லியமாக்கினேன். நַחֲלָה என்பதன் மரபுரிமை பெற்ற பங்கீட்டு உணர்வை நவீனத் தமிழில் தெளிவாகக் காட்ட ‘மரபுரிமைப் பங்கு’ என மாற்றினேன். மற்ற கூறுகள் மூலத்தின் வரிசை, பகிர்வுணர்வு, மற்றும் நோக்கத்தைத் தக்கவைத்துள்ளன.
