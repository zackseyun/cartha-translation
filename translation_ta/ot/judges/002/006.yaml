source:
  edition: WLC
  text: וַ/יְשַׁלַּ֥ח יְהוֹשֻׁ֖עַ אֶת הָ/עָ֑ם וַ/יֵּלְכ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אִ֥ישׁ לְ/נַחֲלָת֖/וֹ לָ/רֶ֥שֶׁת אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/006.yaml
  text: Then Joshua sent the people away[a], and the sons of Israel went, each man to his inheritance, to take possession of the land.
translation:
  language: ta
  text: அப்போது யோசுவா மக்களை அனுப்பிவிட்டார்; இஸ்ரவேலின் மகன்கள்[a] ஒவ்வொருவரும் நிலத்தைத் தங்கள் உடைமையாக்கிக்கொள்ள அவரவர் மரபுரிமைப் பங்கிற்குச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்.” எபிரெய மொழியில் சொல்லுக்குச் சொல், “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: அனுப்பிவிட்டார்
  rationale: שׁלח இச்சூழலில் மக்களை அனுப்பிவிடுதல் அல்லது விடை கொடுத்து அனுப்புதல் என்பதைக் குறிக்கிறது. ‘அனுப்பிவிட்டார்’ என்பது அதன் நிறைவுற்ற செயலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָעָם
  choice: மக்களை
  rationale: எபிரெய உரையில் பொதுவாக ‘மக்கள்’ என்றே உள்ளது; அவர்கள் இஸ்ரவேலர் என்பதை விளக்கமாகச் சேர்க்காமல் மூலத்தின் சொல் தேர்வு காக்கப்படுகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய மொழியின் ஆண்பால் கூட்டுப் பெயரையும் அதன் மரபுத்தொடரையும் நேரடியாகக் காக்கிறது; இயல்பான மாற்றுச் சொல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אִישׁ
  choice: ஒவ்வொருவரும் … அவரவர்
  rationale: אִישׁ இங்கு பகிர்ந்தளிப்பு உணர்வில் ‘ஒவ்வொருவரும்’ எனப் பொருள்படுகிறது. தமிழில் ‘ஒவ்வொருவரும் … அவரவர்’ என்பது தனித்தனியாகத் தமக்குரிய பங்கிற்குச் சென்றதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: לְנַחֲלָתוֹ
  choice: அவரவர் சுதந்தரப் பங்கிற்கு
  rationale: נַחֲלָה என்பது இங்கு இஸ்ரவேலருக்குப் பங்கிட்டுக் கொடுக்கப்பட்ட நில உரிமையைக் குறிக்கிறது. ‘சுதந்தரப் பங்கு’ என்பது சுதந்தர உணர்வையும் நிலப் பங்கீட்டையும் ஒருங்கே தெரிவிக்கிறது.
- source_word: לָרֶשֶׁת
  choice: தங்கள் வசமாக்கிக்கொள்வதற்காக
  rationale: יָרַשׁ இங்கு நிலத்தைச் சென்று கைப்பற்றி அதன் உரிமையை ஏற்றுக்கொள்ளும் நோக்கத்தைக் குறிக்கிறது. இவ்வுரை நோக்கத்தைக் காட்டும் எபிரெய வினையெச்ச அமைப்பையும் காக்கிறது.
- source_word: הָאָרֶץ
  choice: நாட்டை
  rationale: குடியேற்றச் சூழலில் אֶרֶץ என்பது இஸ்ரவேலருக்குக் கொடுக்கப்பட்ட குறிப்பிட்ட நாட்டைக் குறிக்கிறது; ‘நாடு’ நவீனத் தமிழில் இயல்பாக உள்ளது.
theological_decisions:
- issue: பாலினக் குறியீடுள்ள உடன்படிக்கைச் சமூகப் பெயர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: மூல எபிரெயத்தின் ஆண்பால் வடிவத்தையும் மரபுத்தொடரையும் முதன்மை உரை காக்கிறது; அது இஸ்ரவேல் சமூகத்தை மொத்தமாகக் குறிக்கும் இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: நிலப் பங்கின் சுதந்தரச் சொற்கள்
  choice: சுதந்தரப் பங்கு
  alternative: உடைமை / ஒதுக்கப்பட்ட பங்கு
  rationale: இந்தத் தேர்வு நிலத்தை வெறும் சொத்தாக மட்டுமே காட்டாமல், இஸ்ரவேலருக்குக் கொடுக்கப்பட்டு பங்கிடப்பட்ட சுதந்தர நிலம் என்ற உடன்படிக்கை சார்ந்த ஒலிப்பையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘அனுப்பிவிட்டார்,’ ‘ஒவ்வொருவரும் … அவரவர்,’ ‘சுதந்தரப் பங்கு’ ஆகியவை மூலத்தின் செயல்நிலை, பகிர்ந்தளிப்பு அமைப்பு, நிலச் சுதந்தர உணர்வு ஆகியவற்றைத் தெளிவாகக் காக்கின்றன.
