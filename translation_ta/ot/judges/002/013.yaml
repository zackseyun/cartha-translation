base_translation:
  language: en
  yaml_path: translation/ot/judges/002/013.yaml
  text: They abandoned Yahweh and served Baal and the Ashtoreths[a][b][c].
translation:
  language: ta
  text: அவர்கள் யாவேயைக் கைவிட்டு, பாகாலையும் அஸ்தரோத்துகளையும்[a] சேவித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அஸ்தரோத்துகள்” என்பது எபிரெயத்தில் பன்மை வடிவம். இது அஸ்தரோத் (அஸ்தர்த்தே) என அறியப்பட்ட பெண் தெய்வத்தின் பல உள்ளூர் வடிவங்களையோ சிலைகளையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: கைவிட்டு
  rationale: עזב என்பதன் ‘விட்டுவிடுதல், கைவிடுதல்’ என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; இச்சூழலில் உள்ள உடன்படிக்கைத் துரோகத்தின் வலிமையையும் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான יהוה என்பதை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיַּעַבְדוּ
  choice: சேவித்தார்கள்
  rationale: עבד என்பதன் அடிப்படைப் பொருளான ‘சேவை செய்தல்’ என்பதைப் பாதுகாக்கிறது; பாகாலும் அஸ்தரோத்துகளும் இதன் பொருள்களாக இருப்பதால் வழிபாட்டு நுணுக்கம் சூழலிலேயே தெளிவாகிறது.
- source_word: לַבַּעַל
  choice: பாகாலை
  rationale: எபிரெயச் சொல்லிலுள்ள குறிப்புச் சுட்டைத் தமிழில் இயல்பற்ற ‘அந்தப் பாகால்’ என மிகைநேரடியாக்காமல், தெய்வப் பெயரை இயல்பாக வழங்குகிறது.
- source_word: וְלָעַשְׁתָּרוֹת
  choice: அஸ்தரோத்துகளை
  rationale: עשתרות என்பதன் இலக்கணப் பன்மையைத் தமிழிலும் வெளிப்படையாகப் பாதுகாக்கிறது; அதை ஒருமைப் பெண் தெய்வப் பெயராக மாற்றவில்லை.
theological_decisions:
- issue: עשתרות என்ற பன்மை வடிவத்தின் மொழிபெயர்ப்பு
  choice: அஸ்தரோத்துகள்
  alternative: அஸ்தரோத் / அஸ்தர்த்தே
  rationale: மூல எபிரெயத்தில் உள்ள பன்மையை முதன்மை உரை பாதுகாக்கிறது. அது அந்தத் தேவியின் பல உள்ளூர் வடிவங்களையோ உருவங்களையோ குறிக்கிறதா என்பதை உரை தீர்மானிப்பதில்லை.
- issue: புறதெய்வங்கள் தொடர்பில் עבד என்பதன் வழிபாட்டு நுணுக்கம்
  choice: சேவித்தார்கள்
  alternative: வழிபட்டார்கள்
  rationale: ‘சேவித்தல்’ என்பது மூல வினையின் விரிந்த பொருளைத் தக்கவைக்கிறது; ‘வழிபட்டார்கள்’ என்பது உண்மையான சூழற்பொருளாக இருந்தாலும் சொல்லின் பொருளைச் சற்றுக் குறுக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவே’ தனிப்பெயராகவும், ‘அஸ்தரோத்துகள்’ மூலத்தின் பன்மையைப் பாதுகாக்கும் ஒலிபெயர்ப்பாகவும் வழங்கப்பட்டுள்ளன.
