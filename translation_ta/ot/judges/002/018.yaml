  text: וְ/כִֽי הֵקִ֨ים יְהוָ֥ה לָ/הֶם֮ שֹֽׁפְטִים֒ וְ/הָיָ֤ה יְהוָה֙ עִם הַ/שֹּׁפֵ֔ט וְ/הֽוֹשִׁיעָ/ם֙ מִ/יַּ֣ד אֹֽיְבֵי/הֶ֔ם כֹּ֖ל יְמֵ֣י הַ/שּׁוֹפֵ֑ט כִּֽי יִנָּחֵ֤ם יְהוָה֙ מִ/נַּֽאֲקָתָ֔/ם מִ/פְּנֵ֥י לֹחֲצֵי/הֶ֖ם וְ/דֹחֲקֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/018.yaml
  text: Whenever Yahweh raised up judges for them[a], Yahweh was with the judge and saved them from the hand of their enemies all the days of the judge, for Yahweh was moved to pity by their groaning because of those who oppressed and afflicted them.
translation:
  language: ta
  text: யாவே அவர்களுக்காக நியாயாதிபதிகளை எழுப்பியபோதெல்லாம், யாவே அந்த நியாயாதிபதியுடன் இருந்து, அந்த நியாயாதிபதியின் நாட்களெல்லாம் அவர்களுடைய பகைவர்களின் கையிலிருந்து அவர்களைக் காப்பாற்றினார். ஏனெனில், அவர்களை ஒடுக்கி நெருக்கியவர்களால் அவர்கள் எழுப்பிய முனகலினால் யாவே மனமிரங்கினார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே மனம் மாறினார்” அல்லது “யாவே இரக்கம் காட்டினார்.” இந்த எபிரெய வினைச்சொல் மனப்போக்கில் ஏற்பட்ட மாற்றத்தையோ இரக்கத்துடன் அளித்த மறுமொழியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: எழுப்பியபோதெல்லாம்
  rationale: இது ஒரே நிகழ்வை அல்லாமல் மீண்டும் மீண்டும் நிகழ்ந்த செயலைச் சுருக்கமாக விவரிப்பதால், காலத்தையும் வழக்கமான தொடர்ச்சியையும் ‘போதெல்லாம்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הֵקִים
  choice: எழுப்பினார்
  rationale: தலைவர்களைத் தேவன் முன்வரச் செய்தார் என்ற எபிரெய மொழிப்படிமத்தையும் தெய்வீக முன்முயற்சியையும் இது காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் தேவனுடைய தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: שֹׁפְטִים
  choice: நியாயாதிபதிகள்
  rationale: இவர்கள் நீதி வழங்குவதோடு விடுதலைத் தலைவர்களாகவும் செயல்பட்டாலும், நியாயாதிபதிகள் நூலின் சூழலில் நிலைபெற்றதும் பொருத்தமானதுமான பதம் இதுவே; மீட்புச் செயலை அடுத்த வினை தனியாகக் கூறுகிறது.
- source_word: וְהָיָה יְהוָה עִם הַשֹּׁפֵט
  choice: யாவே அந்த நியாயாதிபதியுடன் இருந்து
  rationale: தேவனுடைய உடனிருப்பையும் ஆதரவையும் கூடுதல் விளக்கமின்றி நேரடியாகத் தெரிவிக்கிறது.
- source_word: וְהוֹשִׁיעָם
  choice: அவர்களைக் காப்பாற்றினார்
  rationale: ישׁע என்பதன் causative வடிவம் இங்கு பகைவர்களின் அதிகாரத்திலிருந்து மீட்பதைக் குறிக்கிறது; ‘காப்பாற்றினார்’ இயல்பான தமிழில் அந்தப் பொருளைத் தருகிறது.
- source_word: מִיַּד אֹיְבֵיהֶם
  choice: அவர்களுடைய பகைவர்களின் கையிலிருந்து
  rationale: ‘கை’ என்பது அதிகாரத்தையும் கட்டுப்பாட்டையும் குறிக்கும் எபிரெய உருவகமாகும்; தமிழிலும் புரியக்கூடியதால் அது பாதுகாக்கப்பட்டுள்ளது.
- source_word: כֹּל יְמֵי הַשּׁוֹפֵט
  choice: அந்த நியாயாதிபதியின் நாட்களெல்லாம்
  rationale: அந்த நியாயாதிபதியின் வாழ்நாள் அல்லது பணிக்காலம் என்ற இரண்டில் ஒன்றை வெளிப்படையாகத் தேர்ந்தெடுக்காமல், மூலத்தின் சுருக்கமான சொல்லமைப்பைத் தக்கவைக்கிறது.
- source_word: יִנָּחֵם
  choice: மனமிரங்கினார்
  rationale: இஸ்ரவேலரின் துயரத்திற்கு யாவே இரக்கத்துடன் மறுமொழி அளித்ததை இயல்பான தமிழில் தெரிவிக்கிறது; அதேவேளை எபிரெய வினையின் ‘மனம் மாறுதல்/இரக்கம் கொள்ளுதல்’ என்ற பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִנַּאֲקָתָם
  choice: அவர்கள் எழுப்பிய முனகலால்
  rationale: அவர்களுடைய வேதனைமிக்க முனகல் யாவேயின் மனமிரக்கத்திற்கான காரணம் அல்லது தூண்டுதல் என்பதை מן முன்னொட்டின் காரணப்பொருளுடன் வெளிப்படுத்துகிறது.
- source_word: מִפְּנֵי לֹחֲצֵיהֶם וְדֹחֲקֵיהֶם
  choice: அவர்களை ஒடுக்கி நெருக்கியவர்களின் காரணமாக
  rationale: இரு செயப்பெயர்களும் அவர்களைத் தொடர்ந்து ஒடுக்கியவர்களைக் குறிக்கின்றன; காரண உறவையும் இரு வினைகளின் வேறுபாட்டையும் தமிழ் சொற்றொடர் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை தேவனுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ‘யாவே’ என்று ஒலிபெயர்ப்பது உடன்படிக்கையின் பெயரை ஒரு பட்டத்தால் மாற்றாமல் பாதுகாக்கிறது.
- issue: יִנָּחֵם יְהוָה என்பதில் தேவனுக்குக் கூறப்படும் மனித உணர்வை ஒத்த மொழி
  choice: யாவே மனமிரங்கினார்
  alternative: யாவே மனம் மாறினார்; யாவே இரக்கம் காட்டினார்
  rationale: மூலம் தேவன் இஸ்ரவேலரின் வேதனைக்கு இரக்கத்துடன் பதிலளிப்பதை, மனப்போக்கில் மாற்றத்தையும் குறிக்கக்கூடிய வினையால் கூறுகிறது. முதன்மை உரை இரக்கத்தின் உணர்வைத் தெளிவாகக் கூறுகிறது; உண்மையான சொற்பொருள் விரிவை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. நூலின் மரபான அடையாளத்தைத் தெளிவாக வைத்திருக்க ‘நியாயாதிபதிகள்’ பயன்படுத்தப்பட்டுள்ளது; ‘கையிலிருந்து’ மற்றும் ‘நாட்களெல்லாம்’ போன்ற மூல உருவகங்கள் தமிழில் புரியக்கூடியதால் தக்கவைக்கப்பட்டுள்ளன.
