    reason: lexical_alternative
  revision_rationale: The revised wording removes the added locative force of “அங்கேயே” while retaining the Hebrew sense that Yahweh left or allowed these nations to remain. It also makes the second clause more idiomatic and aligns the footnote’s referent with the main text. The wording does not force the debated purpose/result nuance of לְבִלְתִּי beyond the source’s sense.
