  text: וַ/יַּנַּ֤ח יְהוָה֙ אֶת הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה לְ/בִלְתִּ֥י הוֹרִישָׁ֖/ם מַהֵ֑ר וְ/לֹ֥א נְתָנָ֖/ם בְּ/יַד יְהוֹשֻֽׁעַ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/023.yaml
  text: So Yahweh left these nations[a], not driving them out quickly, and he did not give them into the hand of Joshua.
translation:
  language: ta
  text: ஆகவே, யாவே அந்த மக்களினங்களை விரைவாகத் துரத்திவிடாமல் விட்டுவைத்தார்[a]; அவர்களை யோசுவாவின் கையில் ஒப்புக்கொடுக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த மக்களினங்கள் தொடர்ந்து இருக்க அனுமதித்தார்.” எபிரெய வினைச்சொல் “விட்டுவைத்தார்” அல்லது “இருக்க அனுமதித்தார்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: அங்கேயே இருக்கவிட்டார்
  rationale: הניח என்பதன் காரணவினை வடிவம் இச்சூழலில் ‘தொடர்ந்து இருக்க அனுமதித்தார்’ அல்லது ‘அப்படியே விட்டுவைத்தார்’ எனப் பொருள்படுகிறது. கானானில் அந்த மக்களினங்கள் தொடர்ந்து இருந்ததை இயல்பான தமிழில் இது தெளிவாகக் கூறுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: அந்த மக்களினங்களை
  rationale: גּוֹיִם என்பது ‘நாடுகள்’ அல்லது ‘மக்களினங்கள்’ எனப் பொருள்படலாம். இங்கு நிலத்தில் எஞ்சியிருந்த இனக்குழுக்களே குறிக்கப்படுவதால் ‘மக்களினங்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לְבִלְתִּי הוֹרִישָׁם
  choice: அவர்களைத் துரத்திவிடாமல்
  rationale: ירשׁ என்பதன் காரணவினை வடிவம் இங்கு குடியிருந்தவர்களை நிலத்திலிருந்து அகற்றுதல் அல்லது துரத்துதல் என்பதைக் குறிக்கிறது; எதிர்மறை இறைச்சவினை அமைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַהֵר
  choice: விரைவாக
  rationale: ‘விரைவாக’ அல்லது ‘சீக்கிரமாக’ என்ற வினையடைப் பொருளை நவீன எழுத்துத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: וְלֹא נְתָנָם בְּיַד יְהוֹשֻׁעַ
  choice: அவர்களை யோசுவாவின் கையில் ஒப்புக்கொடுக்கவும் இல்லை
  rationale: ‘ஒருவரின் கையில் கொடுத்தல்’ என்ற எபிரெயச் சொற்றொடர் அதிகாரத்திற்குள் அல்லது போரில் வெற்றிபெறும்படி ஒப்புக்கொடுத்தலைக் குறிக்கிறது. ‘கையில் ஒப்புக்கொடுத்தல்’ மூலப்படிமத்தைத் தக்கவைத்தபடியே தமிழில் பொருள் புரியச் செய்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக வருகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: மக்களினங்கள் எஞ்சியிருந்ததற்கான நோக்கம் அல்லது விளைவு
  choice: விரைவாகத் துரத்திவிடாமல் அங்கேயே இருக்கவிட்டார்
  alternative: அவர்களை விரைவாகத் துரத்திவிடாதபடிக்கு விட்டுவைத்தார்
  rationale: לְבִלְתִּי அமைப்பு நோக்கத்தையோ விளைவையோ சுட்டலாம். தமிழ் உரை அதைத் திட்டவட்டமாக ஒன்றாக மட்டும் தீர்மானிக்காமல், அவர்கள் உடனடியாக அகற்றப்படாமல் எஞ்சியிருந்தனர் என்ற மையக் கருத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘மக்களினங்கள்’ என்பது இங்கு அரசியல் நாடுகளைவிட கானானிய இனக்குழுக்களைக் குறிப்பதால் தேர்ந்தெடுக்கப்பட்டது; ‘யோசுவாவின் கையில்’ என்ற எபிரெய உருவகம் பாதுகாக்கப்பட்டது.
