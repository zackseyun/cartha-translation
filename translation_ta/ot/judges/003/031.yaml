base_translation:
  language: en
  yaml_path: translation/ot/judges/003/031.yaml
  text: After him was Shamgar son of Anath[a], and he struck down six hundred Philistines with an ox goad[b]; he too saved Israel.
translation:
  language: ta
  text: அவருக்குப் பிறகு ஆனாத்தின் மகன் சம்கார் இருந்தார்; அவர் மாடுகளை ஓட்டும் தாற்றுக்கோலால்[a] அறுநூறு பெலிஸ்தியர்களை வீழ்த்தினார். அவரும் இஸ்ரவேலைக் காப்பாற்றினார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தாற்றுக்கோல்’ என்பது மாடுகளை ஓட்டுவதற்குப் பயன்படுத்தப்பட்ட கூர்முனையுள்ள நீண்ட கோல்.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘இஸ்ரவேலை விடுவித்தார்.’ எபிரெய வினைச்சொல் போர்ச் சூழலில் எதிரிகளிடமிருந்து மீட்பதையோ விடுவிப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: அவனுக்குப் பிறகு
  rationale: முந்தைய நியாயாதிபதியைக் குறிக்கும் பிரதிப்பெயர்ச் சுட்டை அப்படியே காக்கிறது; உரையில் இல்லாத ‘ஏகூத்துக்குப் பிறகு’ என்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: הָיָה
  choice: வந்தார்
  rationale: அடுத்த நபரை நிகழ்வுத் தொடரில் அறிமுகப்படுத்தும் எளிய வினையாக இங்கு வருகிறது. சொற்சொல்லான ‘இருந்தார்’ என்பதைவிட தமிழில் ‘வந்தார்’ இயல்பாக இருக்கிறது; ‘எழும்பினார்’ போன்ற கூடுதல் வீரத் தொனியைச் சேர்ப்பதில்லை.
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: ஆனாத்தின் மகன் சம்கார்
  rationale: பெயர்களைத் தமிழில் ஒலிபெயர்த்து, ‘மகன்’ என்ற உறவுமுறையை வெளிப்படையாகக் காக்கிறது; இது ஓர் அடைமொழியாக இருக்கக்கூடிய சாத்தியத்தைத் தீர்மானித்து விடவில்லை.
- source_word: וַיַּךְ
  choice: வீழ்த்தினார்
  rationale: נכה போர்ச் சூழலில் தாக்கி வீழ்த்துவதையும் பெரும்பாலும் கொல்வதையும் குறிக்கும். ‘வீழ்த்தினார்’ வன்முறையான தோல்வியைத் தெரிவிக்கிறது; வினைச்சொல் வெளிப்படையாகச் சொல்லாததை ‘கொன்றார்’ என்று முற்றாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: פְּלִשְׁתִּים שֵׁשׁ מֵאוֹת אִישׁ
  choice: பெலிஸ்தியர்களில் அறுநூறு பேர்
  rationale: மக்களினப் பெயரையும் எண்ணிக்கையையும் நவீன தமிழில் இயல்பாக அளிக்கிறது; போர்ச் சூழலில் எண்ணப்பட்டவர்கள் ஆண்கள் என்பதைக் கூடுதலாக உரையில் வலியுறுத்த வேண்டியதில்லை.
- source_word: בְּמַלְמַד הַבָּקָר
  choice: மாடுகளை ஓட்டும் தாற்றுக்கோலால்
  rationale: மாடுகளை ஓட்டப் பயன்படுத்திய கூர்முனைக் கோலைத் தெளிவாகவும் பண்பாட்டுச் சூழலுக்கேற்பவும் குறிக்கிறது.
- source_word: וַיֹּשַׁע
  choice: காப்பாற்றினார்
  rationale: நியாயாதிபதிகள் நூலில் இஸ்ரவேலை எதிரிகளிடமிருந்து மீட்பதைக் குறிக்கும் வினை. ‘காப்பாற்றினார்’ நவீன வாசகருக்குத் தெளிவானது; இராணுவ விடுதலை என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: גַּם הוּא
  choice: அவரும்
  rationale: சம்காரும் முந்தைய விடுவிப்பவர்களின் வரிசையில் ஒருவர் என்ற சேர்க்கைப் பொருளைச் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: சம்கார் செய்த மீட்பின் தன்மை
  choice: அவரும் இஸ்ரவேலைக் காப்பாற்றினார்
  alternative: அவரும் இஸ்ரவேலை விடுவித்தார்
  rationale: இந்த வசனம் சம்கார் உண்மையாக இஸ்ரவேலை மீட்டார் என்று கூறுகிறது; ஆனால் அந்த மீட்பின் அளவையோ காலநீளத்தையோ வரையறுக்கவில்லை. ‘காப்பாற்றினார்’ என்ற சொல் இதைக் காக்கிறது; விரிவான இரட்சிப்பியல் பொருளைத் திணிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடையைக் கொண்டுள்ளது. பழைய மொழிநடையான ‘குமாரன்,’ ‘இரட்சித்தான்,’ ‘கொன்றுபோட்டான்’ ஆகியவற்றைத் தவிர்த்து, மூலத்தின் சுருக்கத்தையும் போர்ச் சூழலின் வலிமையையும் காக்கிறது. மரியாதைப் பன்மை வினைமுற்றுகள் தமிழின் வேதாகம உரைநடைக்கு ஏற்ற கண்ணியத்தை அளிக்கின்றன.
