base_translation:
  language: en
  yaml_path: translation/ot/judges/003/010.yaml
  text: The Spirit of Yahweh came upon him[a], and he judged Israel. He went out to battle, and Yahweh gave Cushan-rishathaim king of Aram into his hand[b], and his hand prevailed over Cushan-rishathaim.
translation:
  language: ta
  text: யாவேயின் ஆவி அவர்மேல் வந்தது[a]. அவர் இஸ்ரவேலை நியாயந்தீர்த்தார். அவர் போருக்குப் புறப்பட்டார். யாவே அராமின்[b] அரசனான கூஷான்-ரிஷ்அத்தாயீமை அவருடைய கையில் ஒப்புக்கொடுத்தார்; அவருடைய கை கூஷான்-ரிஷ்அத்தாயீமுக்கு எதிராக மேலோங்கியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் ஆவி அவர்மேல் இருந்தது.” எபிரெயச் சொற்றொடர் ஒரு நிலையை இவ்வாறும் குறிக்கலாம்; ஆனால் நிகழ்வின் சூழல் “வந்தது” என்பதற்கு ஆதரவளிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அராம்” என்பது எபிரெய இடப்பெயர்; சில பழைய மொழிபெயர்ப்புகளில் இது “சீரியா” என்று வழங்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּהִי עָלָיו רוּחַ יְהוָה
  choice: யாவேயின் ஆவி அவர்மேல் வந்தது
  rationale: היה על என்ற சொற்றொடர் இங்கு ஒருவர்மேல் ஆவி வந்து அவரை வல்லமையூட்டுவதைக் குறிக்கலாம். நிகழ்வின் தொடக்கத்தை இயல்பாக வெளிப்படுத்துவதால் ‘வந்தது’ முதன்மை வாசகமாகத் தேர்ந்தெடுக்கப்பட்டது; ‘அவர்மேல் இருந்தது’ என்பதும் இலக்கணரீதியாகச் சாத்தியம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் வழக்கமான அறிவார்ந்த ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: அவர் இஸ்ரவேலுக்கு நீதித்தலைவராகச் செயல்பட்டார்
  rationale: שׁפט என்பது நீதித்தீர்ப்பு வழங்குவதோடு, நீதித்தலைவராக வழிநடத்தி விடுவிக்கும் பணியையும் நியாயாதிபதிகள் நூலில் குறிக்கிறது. வெறும் ‘நியாயந்தீர்த்தார்’ என்று சொல்வதால் ஏற்படக்கூடிய குறுகிய பொருளைத் தவிர்த்து, நூலின் பதவிசார் கருத்தைத் தெளிவாக்குகிறது.
- source_word: וַיֵּצֵא לַמִּלְחָמָה
  choice: அவர் போருக்குப் புறப்பட்டார்
  rationale: இது இராணுவ மோதலுக்குப் புறப்படுவதைக் குறிக்கும் இயல்பான எபிரெயச் சொற்றொடர்; நவீனத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் தரப்பட்டுள்ளது.
- source_word: וַיִּתֵּן יְהוָה בְּיָדוֹ
  choice: யாவே ... அவருடைய கையில் ஒப்புக்கொடுத்தார்
  rationale: נתן ביד என்பது ஒருவரை இன்னொருவரின் அதிகாரத்திற்குள் கொடுப்பதைக் குறிக்கும். ‘கையில் ஒப்புக்கொடுத்தார்’ என்பது மூல உருவகத்தையும் வெற்றியின் கருத்தையும் காக்கிறது.
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: கூசான்-ரிஷாதயீம்
  rationale: தனிப்பெயரை மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கிறது; கூட்டுப் பெயரின் பகுதிகளை இணைப்புக்குறி காட்டுகிறது.
- source_word: מֶלֶךְ אֲרָם
  choice: அராமின் அரசன்
  rationale: אֲרָם என்ற மூல இடப்பெயரை நேரடியாகப் பேணுகிறது; பிற்காலப் புவியியல் பெயரான ‘சீரியா’ என்று மாற்றவில்லை.
- source_word: וַתָּעָז יָדוֹ עַל
  choice: அவருடைய கை ... எதிராக மேலோங்கியது
  rationale: எதிரியை அடக்குமளவுக்கு ஒருவரின் வல்லமை ஓங்கியதைச் சுட்டும் எபிரெய உருவகத்தைப் பேணி, தமிழில் புரியக்கூடியவாறு தருகிறது.
theological_decisions:
- issue: தெய்வீக ஆவி அவர்மேல் இருந்ததா அல்லது வந்ததா
  choice: யாவேயின் ஆவி அவர்மேல் வந்தது
  alternative: யாவேயின் ஆவி அவர்மேல் இருந்தது
  rationale: எபிரெய வடிவம் நிலைமையையும் நிகழ்வின் தொடக்கத்தையும் ஏற்கக்கூடும். அடுத்துவரும் நீதித்தலைமை மற்றும் போர் நடவடிக்கைகளுக்கான தெய்வீக வல்லமையூட்டலின் தொடக்கத்தைச் சூழல் சுட்டுவதால் ‘வந்தது’ முதன்மைப்படுத்தப்படுகிறது; மாற்று வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: שׁפט என்பதன் பதவிசார் மற்றும் நீதிசார் பரப்பு
  choice: நீதித்தலைவராகச் செயல்பட்டார்
  alternative: இஸ்ரவேலை நியாயந்தீர்த்தார்
  rationale: இப்பகுதியில் ஒத்னியேலின் பணி சட்டத் தீர்ப்புக்கு மட்டும் வரையறுக்கப்படவில்லை; மக்களை வழிநடத்தி எதிரியிடமிருந்து விடுவிப்பதும் அடங்குகிறது. அதேவேளை அவரை ‘அரசாண்டார்’ என்று கூறி அரசபதவியைத் திணிக்கவில்லை.
- issue: தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட தெய்வீகப் பெயரைப் பட்டத்தால் மாற்றாமல் வெளிப்படையாகப் பேணுகிறது; இதனால் வசனத்தில் பெயருக்கும் ஆவிக்கும் உள்ள தொடர்பும் மறைக்கப்படாது.
