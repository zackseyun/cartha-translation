translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் வேதாகம உரைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கதைத்தொடரின் காரண–விளைவு மற்றும் கால வரிசை “அதனால்” மற்றும் “பின்பு” என்பவற்றால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
