  text: So the land had rest for forty years. Then Othniel son of Kenaz died.
translation:
  language: ta
  text: நாடு நாற்பது ஆண்டுகள் அமைதியாக இருந்தது. பின்னர் கெனாஸின் மகன் ஒத்னியேல் இறந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: அமைதியாக இருந்தது
  rationale: שׁקט என்பது தொந்தரவின்றி அமைதியுடனும் ஓய்வுடனும் இருப்பதைக் குறிக்கிறது. இங்கு ஒடுக்குமுறையிலிருந்து விடுதலை பெற்ற பிந்தைய அமைதிக்காலத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; முழுமையான செழிப்பைத் தேவையின்றி பொருளில் சேர்ப்பதில்லை.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: நியாயாதிபதிகள் நூலின் சூழலில் אֶרֶץ என்பது முழு பூமியையல்ல, இஸ்ரவேலரின் நாட்டைக் குறிக்கிறது. தமிழில் இச்சூழலுக்கு “நாடு” இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אַרְבָּעִים שָׁנָה
  choice: நாற்பது ஆண்டுகள்
  rationale: இது கால நீட்சியைக் குறிக்கும் சொற்றொடர். “நாற்பது ஆண்டுகள்” என்பது தமிழில் அந்தக் கால அளவைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וַיָּמָת
  choice: பின்பு … இறந்தார்
  rationale: முன்னொட்டு வாவ் கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது. “பின்பு” நிகழ்வின் தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது; வினைச்சொல் மரணத்தை நேரடியாகக் கூறுகிறது.
- source_word: עָתְנִיאֵל
  choice: ஒத்னியேல்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பை நவீன தமிழில் வாசிக்கத்தக்க வகையில் ஒலிபெயர்க்கிறது.
- source_word: בֶּן קְנַז
  choice: கேனாசின் மகன்
  rationale: இந்த இணைப்புச் சொற்றொடர் ஒத்னியேலை அவரது தந்தைவழி அடையாளப்படுத்துகிறது. உடைமை வேற்றுமையுடன் கூடிய “கேனாசின் மகன்” என்பது இயல்பான தமிழ் வடிவம்.
