source:
  edition: WLC
  text: וַ/יַּעַבְד֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶת עֶגְל֣וֹן מֶֽלֶךְ מוֹאָ֔ב שְׁמוֹנֶ֥ה עֶשְׂרֵ֖ה שָׁנָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/014.yaml
  text: And the sons of Israel served Eglon king of Moab for eighteen years[a].
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் மோவாபின் அரசனான எக்லோனுக்குப் பதினெட்டு ஆண்டுகள் சேவை செய்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, பொருளை இன்னும் வெளிப்படையாகக் கூறினால்: “இஸ்ரவேல் மக்கள் மோவாபின் அரசனான எக்லோனுக்குப் பதினெட்டு ஆண்டுகள் கீழ்ப்பட்டிருந்தார்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: பணிபுரிந்தார்கள்
  rationale: עבד என்ற வினை இச்சூழலில் வழிபாட்டை அல்ல, அந்நிய அரசனுக்குக் கீழ்ப்பட்டு சேவை செய்த அரசியல் அடிமைத்தனத்தைக் குறிக்கிறது. “பணிபுரிந்தார்கள்” எபிரெயச் சொல்லின் அடிப்படை உருவகத்தைத் தக்கவைக்கிறது; சூழல்சார் விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லளவில் “இஸ்ரவேலின் மகன்கள்” என்றாலும், இங்கு அது இஸ்ரவேல் சமூகத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர். நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் “இஸ்ரவேல் மக்கள்” என வழங்கப்பட்டுள்ளது.
- source_word: אֶת עֶגְלוֹן
  choice: எக்லோனுக்கு
  rationale: אֶת நேரடி செயப்படுபொருளைக் குறிக்கிறது. ஆனால் தமிழ் வினைத்தொடரான “பணிபுரிந்தார்கள்” இயல்பாக நான்காம் வேற்றுமையை வேண்டுவதால், பெயர் “எக்லோனுக்கு” என அமைக்கப்பட்டுள்ளது.
- source_word: מֶלֶךְ מוֹאָב
  choice: மோவாபின் அரசனான
  rationale: எபிரெய இணைநிலைத் தொடரான “மோவாபின் அரசன்” என்பதை எக்லோனுடன் தமிழில் இயல்பாக இணைக்க “மோவாபின் அரசனான” என வழங்கப்பட்டுள்ளது.
- source_word: שְׁמוֹנֶה עֶשְׂרֵה שָׁנָה
  choice: பதினெட்டு ஆண்டுகள்
  rationale: காலநீட்சியைக் குறிக்கும் எபிரெய வேற்றுமையற்ற காலத்தொடர் தமிழில் இயல்பாக “பதினெட்டு ஆண்டுகள்” என வருகிறது.
theological_decisions:
- issue: עבד என்பதன் இச்சூழலிலான பொருள்
  choice: அரசியல் கீழ்ப்படிதலை உணர்த்தும் “பணிபுரிந்தார்கள்”
  alternative: “கீழ்ப்பட்டிருந்தார்கள்”
  rationale: இங்கு வழிபாடு குறிக்கப்படவில்லை. மூல வினையின் ‘சேவை செய்தல்’ என்ற வடிவத்தை முதன்மை உரை தக்கவைக்கிறது; அரசியல் அடக்கத்தைக் கூடுதல் தெளிவுடன் கூறும் மாற்று அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. “இஸ்ரவேலின் மகன்கள்” என்ற சொற்கூறு தமிழில் பாலின ரீதியாகத் தேவையற்ற குறுகலை ஏற்படுத்தக்கூடும் என்பதால், அதன் கூட்டு இனப்பொருளை இயல்பாக வெளிப்படுத்த “இஸ்ரவேல் மக்கள்” பயன்படுத்தப்பட்டது.
