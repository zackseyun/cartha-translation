source:
  edition: WLC
  text: וַ/יִּזְעֲק֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶל יְהוָ֔ה וַ/יָּ֨קֶם יְהוָ֥ה מוֹשִׁ֛יעַ לִ/בְנֵ֥י יִשְׂרָאֵ֖ל וַ/יּֽוֹשִׁיעֵ֑/ם אֵ֚ת עָתְנִיאֵ֣ל בֶּן קְנַ֔ז אֲחִ֥י כָלֵ֖ב הַ/קָּטֹ֥ן מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/009.yaml
  text: 'Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up a deliverer for the sons of Israel, who delivered them: Othniel son of Kenaz[c][b], Caleb’s younger brother.'
translation:
  language: ta
  text: 'அப்போது இஸ்ரவேலின் மக்கள்[a] யாவேவை நோக்கி உதவிக்காகக் கூக்குரலிட்டார்கள். யாவே இஸ்ரவேலின் மக்களுக்காக ஒரு விடுவிப்பவரை[b] எழுப்பினார்; அவர் அவர்களை விடுவித்தார்: கேனாசின் மகனும் காலேபின் இளைய சகோதரருமான ஒத்னியேல்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “விடுவிப்பவர்” என்பதை “மீட்பர்” அல்லது “காப்பவர்” என்றும் மொழிபெயர்க்கலாம். இங்கு எபிரெயச் சொல், இஸ்ரவேலை விடுவிப்பதற்காக யாவே எழுப்பிய மனித முகவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், “காலேபின் சகோதரர், அவனைவிட இளையவர்.” இங்கு ஒத்னியேல் காலேபைவிட இளையவர் எனப் பொருள் கொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: உதவிக்காகக் கூக்குரலிட்டார்கள்
  rationale: זעק என்பது நெருக்கடியில் உதவி வேண்டி எழுப்பும் தீவிரமான கூக்குரலைக் குறிக்கிறது; வெறுமனே அழைத்தார்கள் அல்லது ஜெபித்தார்கள் என்பதைக் காட்டிலும் இச்சூழலின் அவசரத்தைக் காக்கிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘இஸ்ரவேலின் மகன்கள்’; நவீனத் தமிழில் முழு இஸ்ரவேல் சமூகத்தையும் இயல்பாகக் குறிக்க ‘மக்கள்’ பயன்படுத்தப்பட்டு, நேரடிப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, எபிரெயத் திருப்பெயர்; தமிழில் வழக்கமான ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיָּקֶם
  choice: எழுப்பினார்
  rationale: הקים இங்கு ஒரு குறிப்பிட்ட பணிக்காக ஒருவரைத் தோன்றச் செய்து செயல்பட வைப்பதைக் குறிக்கிறது; ‘எழுப்பினார்’ அந்தச் செயற்பாட்டு நுணுக்கத்தைக் காக்கிறது.
- source_word: מוֹשִׁיעַ
  choice: விடுவிப்பவர்
  rationale: ישע வேரிலிருந்து வந்த இச்சொல் ஒடுக்குமுறையிலிருந்து மீட்கும் மனித முகவரைக் குறிக்கிறது; ‘விடுவிப்பவர்’ நீதித்தலைவர்கள் நூலின் அரசியல்-இராணுவச் சூழலுக்கு ஏற்றது.
- source_word: וַיּוֹשִׁיעֵם
  choice: அவர் அவர்களை விடுவித்தார்
  rationale: இவ்வினைச்சொல் பகைவரின் ஒடுக்குமுறையிலிருந்து நிகழ்ந்த நடைமுறை மீட்பைக் குறிக்கிறது; மேலும் ‘விடுவிப்பவர்’ என்பதோடு சொல்லியல் தொடர்பைத் தக்கவைக்கிறது.
- source_word: עָתְנִיאֵל בֶּן קְנַז
  choice: கேனாசின் மகன் ஒத்னியேல்
  rationale: எபிரெயப் பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டு, தந்தை-மகன் உறவு இயல்பான தமிழ் தொடரில் வழங்கப்பட்டுள்ளது.
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: காலேபைவிட இளையவரான காலேபின் சகோதரர்
  rationale: சொற்றொடரின் அண்மைய தொடர்புப்படி கேனாஸ் காலேபின் சகோதரர் என்றும் காலேபைவிட இளையவர் என்றும் முதன்மை உரை எடுத்துக்கொள்கிறது; ஒத்னியேலையே காலேபின் இளைய சகோதரராகக் கொள்ளும் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயரே உள்ளது; அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: מוֹשִׁיעַ என்பதன் பொருள்
  choice: விடுவிப்பவர்
  alternative: மீட்பர்; காப்பவர்
  rationale: இங்கு கடவுள் எழுப்பும் மனித முகவர் இஸ்ரவேலை ஒடுக்குநரிடமிருந்து விடுவிக்கிறார். ‘விடுவிப்பவர்’ அந்த வரலாற்றுச் சூழலைத் தெளிவாகக் காட்டி, தேவையற்ற பிற்கால இறையியல் பொருளைத் திணிக்காது.
- issue: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ என்ற உறவுமுறைத் தொடரின் இணைப்பு
  choice: கேனாஸ் காலேபின் இளைய சகோதரர்
  alternative: ஒத்னியேல் காலேபின் இளைய சகோதரர்
  rationale: எபிரெயத் தொடரில் ‘காலேபின் சகோதரர்’ என்பது அண்மையில் உள்ள கேனாசுடன் இயல்பாக இணைக்கப்படலாம்; ஆயினும் வாக்கிய அமைப்பு வேறு இணைப்புக்கும் இடமளிப்பதால் மாற்றுப் புரிதல் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் எழுதப்பட்டுள்ளது. ‘உதவிக்காகக் கூக்குரலிட்டார்கள்’ நெருக்கடியின் தீவிரத்தை வெளிப்படுத்துகிறது. மூலத்தின் மீட்பு-சொல்லியல் தொடர்பை ‘விடுவிப்பவர்/விடுவித்தார்’ என்ற இணை காக்கிறது; விவாதத்துக்குரிய உறவுமுறை அமைப்பு முதன்மை உரையிலும் அடிக்குறிப்பிலும் நேர்மையாகச் சுட்டப்பட்டுள்ளது.
