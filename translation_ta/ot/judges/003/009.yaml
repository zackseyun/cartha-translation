- from: அப்போது இஸ்ரவேலின் மக்கள்[a] யாவேவை நோக்கி உதவிக்காகக் கூக்குரலிட்டார்கள். யாவே அவர்களுக்காக ஒரு விடுவிப்பவரை[b] எழுப்பினார்; அவர் அவர்களை விடுவித்தார். அவர், காலேபைவிட இளையவரான காலேபின் சகோதரர் கேனாசின் மகன் ஒத்னியேல்.[c]
  to: 'அப்போது இஸ்ரவேலின் மக்கள்[a] யாவேவை நோக்கி உதவிக்காகக் கூக்குரலிட்டார்கள். யாவே இஸ்ரவேலின் மக்களுக்காக ஒரு விடுவிப்பவரை[b] எழுப்பினார்; அவர் அவர்களை விடுவித்தார்: கேனாசின் மகனும் காலேபின் இளைய சகோதரருமான ஒத்னியேல்[c].'
