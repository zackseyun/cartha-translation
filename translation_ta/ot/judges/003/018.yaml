  text: וַֽ/יְהִי֙ כַּ/אֲשֶׁ֣ר כִּלָּ֔ה לְ/הַקְרִ֖יב אֶת הַ/מִּנְחָ֑ה וַ/יְשַׁלַּח֙ אֶת הָ/עָ֔ם נֹשְׂאֵ֖י הַ/מִּנְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/018.yaml
  text: And when he had finished presenting the tribute[a], he sent away the people who were carrying the tribute.
translation:
  language: ta
  text: அவன் அந்தத் திறையை[a] செலுத்தி முடித்தபோது, அதைச் சுமந்துவந்த மக்களை அனுப்பிவிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கொடையை’ அல்லது ‘காணிக்கையை.’ இங்குள்ள எபிரெயச் சொல் பலிக்காணிக்கையைவிட, ஓர் ஆட்சியாளருக்குச் செலுத்தப்பட்ட திறையைக் குறிக்கவே வாய்ப்பு அதிகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: முடித்தபோது
  rationale: எபிரெயக் கதைநடைத் தொடரையும் காலத் தொடர்பையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘அப்போது நிகழ்ந்தது’ போன்ற சொல்லுக்குச் சொல் அமைப்பு தவிர்க்கப்படுகிறது.
- source_word: כִּלָּה
  choice: முடித்த
  rationale: செயல் நிறைவடைந்த பின்னரே அடுத்த செயல் நடந்தது என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְהַקְרִיב
  choice: செலுத்தி
  rationale: இங்கு அரசனுக்குக் கொண்டுவரப்பட்ட கட்டாய அரசியல் கொடை என்பதால், வழிபாட்டுச் சாயல் கொண்ட ‘பலியிட்டு’ என்பதைக் காட்டிலும் ‘செலுத்தி’ சூழலுக்கு ஏற்றது.
- source_word: הַמִּנְחָה
  choice: திறை
  rationale: מִנְחָה என்பதற்கு கொடை அல்லது காணிக்கை என்ற பொருள்களும் இருக்கலாம்; இச்சூழலில் கீழ்ப்பட்டோர் அரசனுக்குச் செலுத்தும் அரசியல் திறை என்ற பொருள் மிகப் பொருத்தமானது.
- source_word: וַיְשַׁלַּח
  choice: அனுப்பிவிட்டான்
  rationale: தன்னுடன் வந்தவர்களை அங்கிருந்து திருப்பி அனுப்பிய செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָעָם
  choice: மக்களை
  rationale: மூலத்தில் பொதுவான ‘மக்கள்’ என்ற சொல் உள்ளது; பாலினத்தையோ குறிப்பிட்ட குழுப் பெயரையோ மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- source_word: נֹשְׂאֵי הַמִּנְחָה
  choice: அதைச் சுமந்துவந்த மக்களை
  rationale: பங்கேற்புப் பெயரெச்சத் தொடரை இயல்பான தமிழ் வினையெச்சத் தொடராக மாற்றி, அவர்கள் திறையைச் சுமந்து வந்தவர்கள் என்பதைப் பாதுகாக்கிறது.
