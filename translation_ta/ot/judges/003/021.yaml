base_translation:
  language: en
  yaml_path: translation/ot/judges/003/021.yaml
  text: Then Ehud reached with his left hand[a], took the sword from his right thigh[b], and thrust it into his belly.
translation:
  language: ta
  text: அப்போது ஏகூத் தன் இடது கையை நீட்டி, தன் வலது தொடையிலிருந்து வாளை எடுத்து, அதை அவனுடைய வயிற்றில் குத்தினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதை அவனுடைய வயிற்றில் ஊடுருவச் செய்தான்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: கையை நீட்டி
  rationale: உடல்சார் செயலைக் குறிக்கும் இச்சூழலில், கையை நீட்டுதல் என்ற பொருள் இயல்பாக அமைகிறது; அடுத்ததாக வாளை எடுக்கும் செயலுடனும் தெளிவாக இணைகிறது.
- source_word: יַד שְׂמֹאלוֹ
  choice: தன் இடது கையை
  rationale: எபிரெய உரையில் ‘கை’ வெளிப்படையாக உள்ளது; ஏகூத்தின் இடதுகைச் செயலை வலியுறுத்தும் விவரத்தையும் இத்தேர்வு காக்கிறது.
- source_word: וַיִּקַּח
  choice: எடுத்து
  rationale: தொடர்ச்சியான கதைநடையில் לקח என்பதற்கான நேரடியான, இயல்பான தமிழ் இணை.
- source_word: הַחֶרֶב
  choice: வாளை
  rationale: இது ‘வாள்’ என்பதற்கான பொதுவான எபிரெயச் சொல். சூழலில் குறுவாளாக இருக்கக்கூடும் என்றாலும், மூலத்தின் பொதுவான சொல்லைத் தமிழிலும் காக்கிறது.
- source_word: מֵעַל יֶרֶךְ יְמִינוֹ
  choice: தன் வலது தொடையில் இருந்த
  rationale: வலது தொடையின் மேல் கட்டப்பட்டிருந்த ஆயுதத்தை அங்கிருந்து எடுத்ததைக் காட்டும் இயல்பான தமிழ் அமைப்பு.
- source_word: וַיִּתְקָעֶהָ
  choice: அதை ... குத்தி இறக்கினான்
  rationale: תקע இங்கு ஆயுதத்தை வலுவாக உடலுக்குள் செலுத்தும் செயலைக் குறிக்கிறது. ‘குத்தி இறக்கினான்’ என்பது வன்மையான ஊடுருவலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְּבִטְנוֹ
  choice: அவனுடைய வயிற்றில்
  rationale: בטן என்பதன் நேரடியான, உயிரோட்டமுள்ள தமிழ் இணை ‘வயிறு’; ‘அவனுடைய’ என்பது இலக்கு ஏகூத் அல்ல, மற்றொரு ஆண் என்பதைத் தெளிவாக்குகிறது.
