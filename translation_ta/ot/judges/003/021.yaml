translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தொடர் வினைகள் மூலத்தின் வேகமான நிகழ்வுப்போக்கைக் காக்கின்றன. எபிரெய வாக்கிய முடிவிலுள்ள சிறப்பு நிறுத்தக் குறிக்கு மொழிபெயர்ப்பில் தனிப்பட்ட சொற்பொருள் வழங்கப்படவில்லை.
