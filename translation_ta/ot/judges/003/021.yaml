revisions:
- from: அப்போது ஏகூத் தன் இடது கையை நீட்டி, தன் வலது தொடையில் இருந்த வாளை எடுத்து, அதை அவனுடைய வயிற்றில் குத்தி இறக்கினான்.[a]
  to: அப்போது ஏகூத் தன் இடது கையை நீட்டி, தன் வலது தொடையிலிருந்து வாளை எடுத்து, அதை அவனுடைய வயிற்றில் குத்தினான்.[a]
