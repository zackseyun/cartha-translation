  terminology: “பணியாளர்கள்,” “மேல் அறை,” and “பூட்டப்பட்டிருந்தன” suit the setting and register. The footnote should identify the Hebrew expression as a euphemism for bodily relief without unnecessarily narrowing it to defecation alone.
