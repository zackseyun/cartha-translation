translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசரைப் பற்றிப் பணியாளர்கள் பேசுவதால் மேற்கோளில் மரியாதைப் பன்மை இடப்பட்டுள்ளது. மூல எபிரெய மொழியின் மறைமுகச் சொல்லாட்சி முதன்மை உரையில் வைக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
