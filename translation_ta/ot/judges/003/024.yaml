    rationale: “எனவே” marks a direct logical result, whereas the particle here marks the servants’ assured supposition. “நிச்சயமாக” preserves that inferential force.
  - severity: medium
    issue: The main text retains a literal Hebrew idiom that is not a functioning Tamil euphemism.
    rationale: Optimal-equivalence and the English audit trail favor a clear euphemistic Tamil sense in the text, while the literal “covering his feet” is appropriately preserved in a footnote.
