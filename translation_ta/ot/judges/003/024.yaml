base_translation:
  language: en
  yaml_path: translation/ot/judges/003/024.yaml
  text: When he had gone out[a], his servants came and looked, and behold, the doors of the upper room were locked. So they said, “Surely he is relieving himself in the cool inner room.”
translation:
  language: ta
  text: அவன் வெளியே சென்றபின், அவனுடைய பணியாளர்கள் வந்து பார்த்தார்கள். இதோ, மேல் அறையின் கதவுகள் பூட்டப்பட்டிருந்தன. அப்போது அவர்கள், “அவர் நிச்சயமாகக் குளிர்ச்சியான உள் அறையில் இயற்கை உபாதையைத் தீர்த்துக்கொண்டிருக்கிறார்[a]” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “தம் கால்களை மூடிக்கொண்டிருக்கிறார்.” இது உடல் கழிவை வெளியேற்றுவதைக் குறிக்கும் எபிரெய மறைமுகச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יָצָא
  choice: அவன் வெளியே சென்றபின்
  rationale: எகூத் வெளியேறியதைத் தொடர்ந்து பணியாளர்கள் வந்த காலத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள்
  rationale: அரச குடும்பச் சூழலில் பணிவிடை செய்தவர்களைக் குறிக்கிறது; அவர்களுடைய சட்டநிலையை உரை வலியுறுத்தாததால் ‘அடிமைகள்’ எனத் தீர்மானிக்கவில்லை.
- source_word: וַיִּרְאוּ
  choice: வந்து பார்த்தார்கள்
  rationale: எபிரெயக் கதைநடையின் ‘பார்த்தார்கள்’ என்ற செயலை, அவர்கள் வந்தடைந்து கவனித்த சூழலுடன் இயல்பாக இணைக்கிறது.
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: மேல் அறையின் கதவுகள்
  rationale: עֲלִיָּה என்பது கட்டிடத்தின் மேல்தளத்திலுள்ள அறையைக் குறிக்கிறது.
- source_word: נְעֻלוֹת
  choice: பூட்டப்பட்டிருந்தன
  rationale: கதவுகள் பாதுகாப்பாக மூடப்பட்டிருந்த நிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: אַךְ
  choice: எனவே
  rationale: பூட்டிய கதவுகளைக் கண்ட பணியாளர்கள் எடுத்த முடிவைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது; அவர்களுடைய ஊகத்தின் உறுதியை மேற்கோள் அமைப்பே உணர்த்துகிறது.
- source_word: מֵסִיךְ ... אֶת רַגְלָיו
  choice: தம் கால்களை மூடிக்கொண்டிருக்கிறார்
  rationale: மூலத்தின் மறைமுகமான, சொற்சார்ந்த உருவகத்தை முதன்மை உரையில் பாதுகாக்கிறது; அதன் உடற்கழிவு சார்ந்த பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: חֲדַר הַמְּקֵרָה
  choice: குளிர்ச்சியான உள் அறை
  rationale: குளிர்ச்சியுடன் தொடர்புடைய தனியறை என்ற பொருளைத் தெளிவான நவீன தமிழில் தருகிறது; அறையின் துல்லியமான கட்டிட அமைப்பை அளவுக்கு மீறி நிர்ணயிக்கவில்லை.
