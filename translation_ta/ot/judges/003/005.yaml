  text: And the sons of Israel lived among the Canaanites[a], the Hittites, the Amorites, the Perizzites, the Hivites, and the Jebusites.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள்[a] கானானியர், ஏத்தியர், எமோரியர், பெரிசியர், ஏவியர், எபூசியர் ஆகியோரின் நடுவே வாழ்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில், ‘இஸ்ரவேலின் மகன்கள்.’ இதை இயல்பான தமிழில் ‘இஸ்ரவேலர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: בְּנֵי என்பதன் நேர்ப்பொருள் ‘மகன்கள்.’ எபிரேய மூலத்தின் குடும்ப உறவுச் சொல்லாட்சியைத் தக்கவைக்கும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது; இயல்பான மாற்றாக ‘இஸ்ரவேலர்’ என்பதையும் பயன்படுத்தலாம்.
- source_word: יָשְׁבוּ
  choice: வாழ்ந்தார்கள்
  rationale: இச்சூழலில் ישׁב அந்த மக்களிடையே தொடர்ந்து குடியிருந்து வாழ்ந்ததைக் குறிக்கிறது. ‘வாழ்ந்தார்கள்’ என்பது இன்றைய தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּקֶרֶב
  choice: நடுவே
  rationale: சுற்றியுள்ள பிற மக்களுக்கிடையில் வாழ்ந்தனர் என்ற இடம் மற்றும் உறவுநிலையை இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַכְּנַעֲנִי הַחִתִּי וְהָאֱמֹרִי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: கானானியர், ஏத்தியர், எமோரியர், பெரிசியர், ஏவியர், எபூசியர்
  rationale: எபிரேயத்தில் ஒருமை வடிவில் இருந்தாலும், இவை ஒவ்வொன்றும் ஒரு மக்கள் குழுவைக் குறிக்கும் கூட்டுப்பெயர்கள். தமிழில் மக்கள் இனங்களைக் குறிக்கும் இயல்பான பன்மைப் பயன்பாட்டில் தரப்பட்டுள்ளன.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. இனப்பெயர்களுக்கு தமிழ் வேதாகம மரபில் பரவலாக அறியப்பட்ட வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் குடும்ப உறவுச் சொல்லாட்சி முதன்மை உரையில் தக்கவைக்கப்பட்டுள்ளது.
