source:
  edition: WLC
  text: וַ/יַּעַשׂ֩ ל֨/וֹ אֵה֜וּד חֶ֗רֶב וְ/לָ֛/הּ שְׁנֵ֥י פֵי֖וֹת גֹּ֣מֶד אָרְכָּ֑/הּ וַ/יַּחְגֹּ֤ר אוֹתָ/הּ֙ מִ/תַּ֣חַת לְ/מַדָּ֔י/ו עַ֖ל יֶ֥רֶךְ יְמִינֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/016.yaml
  text: Ehud made himself a sword with two edges[a], a cubit in length[b], and strapped it on under his clothes on his right thigh.
translation:
  language: ta
  text: ஏகூத் தனக்காக இருபுறமும் கூர்மையான ஒரு வாளைச் செய்தான். அது ஒரு கோமேத்[a] நீளமுடையது. அதைத் தன் ஆடைகளுக்குக் கீழே, வலது தொடையில் கட்டிக்கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கோமேத்” என்பது எபிரேயத்தில் அரிதாக வரும் ஓர் அளவைச்சொல். அதன் துல்லியமான நீளம் தெரியவில்லை; பொதுவாக இது ஏறக்குறைய ஒரு முழம் அல்லது முன்கையின் நீளம் எனப் புரிந்துகொள்ளப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: தனக்காகச் செய்தான்
  rationale: לּוֹ என்பதன் பயன்நோக்கிய அல்லது தனக்கான பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ஏகூத் தானே செய்தான் என்ற வாசகத்தின் நேரடிப் பொருளையும் காக்கிறது.
- source_word: חֶרֶב
  choice: வாள்
  rationale: இது வாளைக் குறிக்கும் பொதுவான எபிரேயச் சொல். சூழலில் ஆயுதம் குறுகியதாக இருந்திருக்கலாம் என்றாலும், ‘குறுவாள்’ என்று மிகத் துல்லியப்படுத்தாமல் மூலச்சொல்லின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: וְלָהּ שְׁנֵי פֵיוֹת
  choice: இருபுறமும் கூர்மையான
  rationale: சொல்லுக்கு சொல் ‘அதற்கு இரண்டு வாய்கள்’ என்ற எபிரேய மரபுத்தொடர், வாளின் இரு வெட்டுமுனைகளைக் குறிக்கிறது. நவீன தமிழில் இதுவே தெளிவான இயல்பான வெளிப்பாடு.
- source_word: גֹּמֶד אָרְכָּהּ
  choice: ஒரு கோமேத் நீளமுடையது
  rationale: גֹּמֶד அரிதாக வரும் அளவைச்சொல்; அதன் துல்லியமான நீளம் உறுதியில்லை. அதை ‘முழம்’ என்று உறுதியாக்காமல் ஒலிபெயர்த்து, அடிக்குறிப்பில் ஐயத்தை விளக்குவது மூல ஆதாரத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: וַיַּחְגֹּר אוֹתָהּ
  choice: அதைக் கட்டிக்கொண்டான்
  rationale: חגר என்பது உடலில் ஆயுதத்தை இறுக்கிக் கட்டுதல் அல்லது அணிதலைக் குறிக்கிறது. தமிழில் செயலை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: מִתַּחַת לְמַדָּיו
  choice: தன் ஆடைகளுக்குக் கீழே
  rationale: מַדָּיו என்பது அவன் அணிந்த ஆடைகளைப் பொதுவாகக் குறிக்கிறது; குறிப்பிட்ட வகை உடையை ஊகிக்காமல் பன்மையையும் பொருளையும் காக்கிறது.
- source_word: עַל יֶרֶךְ יְמִינוֹ
  choice: வலது தொடையில்
  rationale: יֶרֶךְ என்பதன் நேரடிப் பொருள் தொடை அல்லது இடுப்பை ஒட்டிய பகுதி. ஆயுதம் வைக்கப்பட்ட இடத்தை ‘வலது தொடையில்’ என்பது தெளிவாகக் காட்டுகிறது.
