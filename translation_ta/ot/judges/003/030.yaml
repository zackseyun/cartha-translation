base_translation:
  language: en
  yaml_path: translation/ot/judges/003/030.yaml
  text: So Moab was subdued under the hand of Israel that day[c][b][a], and the land had rest for eighty years.
translation:
  language: ta
  text: இவ்வாறு, அந்நாளில்[a] மோவாப் இஸ்ரவேலின் கையின் கீழ் கீழ்ப்படுத்தப்பட்டது[b]. நாடு எண்பது ஆண்டுகள் அமைதியாக இருந்தது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நாளில்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “இஸ்ரவேலின் கையின் கீழ்”; இது இஸ்ரவேலின் அதிகாரத்திற்குக் கீழ்ப்படுத்தப்பட்டதைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “ஓய்வு பெற்றது” அல்லது “சமாதானமாக இருந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכָּנַע
  choice: கீழ்ப்படுத்தப்பட்டது
  rationale: כנע என்பதன் நிஃபால் வடிவம் இங்கு மோவாப் இராணுவ-அரசியல் ஆட்சிக்குக் கொண்டுவரப்பட்டதைக் குறிக்கிறது. ‘கீழ்ப்படுத்தப்பட்டது’ என்பது அழித்தொழித்தல் என்ற மிகைப்படுத்தலைத் தவிர்த்து, செயலின் passive/resultative தன்மையைப் பாதுகாக்கிறது.
- source_word: מוֹאָב
  choice: மோவாப்
  rationale: நாட்டுப் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்நாளில்
  rationale: குறிப்பிட்ட அந்த நாளைக் குறிக்கும் எபிரெய காலச் சொற்றொடரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: תַּחַת יַד יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கைக்குக் கீழ்
  rationale: ஆட்சி அல்லது அதிகாரத்திற்குக் கீழிருப்பதைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் புரிந்துகொள்ளத்தக்க வகையில் பாதுகாக்கிறது.
- source_word: וַתִּשְׁקֹט
  choice: அமைதியாக இருந்தது
  rationale: שקט என்பது தொந்தரவு அல்லது போரிலிருந்து கிடைத்த ஓய்வு, அமைதி ஆகியவற்றைக் குறிக்கிறது. நியாயாதிபதிகள் நூலின் சூழலில் ‘அமைதியாக இருந்தது’ போர் ஓய்ந்த நிலையைக் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: இங்கு இஸ்ரவேலின் நிலப்பகுதியையும் அதில் வாழும் சமூகத்தின் நிலையையும் குறிக்கிறது; நவீனத் தமிழில் ‘நாடு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: שְׁמוֹנִים שָׁנָה
  choice: எண்பது ஆண்டுகள்
  rationale: கால நீடிப்பைத் தமிழில் இயல்பாகக் குறிப்பிடுகிறது.
theological_decisions:
- issue: மோவாபின்மேல் இஸ்ரவேல் பெற்ற ஆதிக்கத்தின் தன்மை
  choice: வழக்கமான வேதாகம உருவகத்தால் வெளிப்படுத்தப்பட்ட இராணுவ-அரசியல் கீழ்ப்படுத்தல்
  alternative: வெறும் உருவகத் தாழ்த்தல் அல்லது முழுமையான அழித்தொழித்தல்
  rationale: வசனம் மோவாப் இஸ்ரவேலின் அதிகாரத்திற்குக் கொண்டுவரப்பட்டதையும் அதன் விளைவாக நாடு அமைதி பெற்றதையும் கூறுகிறது. ஆகவே அதை உணர்ச்சிசார் அவமானமாக மட்டும் குறைக்கவோ முற்றழிவாக மிகைப்படுத்தவோ கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய ‘கை’ உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
