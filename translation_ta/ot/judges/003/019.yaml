translation:
  language: ta
  text: ஆனால் அவன் தானே கில்காலுக்கு அருகிலிருந்த செதுக்கப்பட்ட உருவங்களிடமிருந்து திரும்பி, “அரசே, உங்களுக்கான இரகசியச் செய்தி ஒன்று என்னிடம் உள்ளது[a]” என்றான். அரசன், “அமைதி!” என்றான். அப்போது அரசனருகில் நின்றுகொண்டிருந்த அனைவரும் அவன் முன்னிலையிலிருந்து வெளியே சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “செதுக்கப்பட்ட உருவங்கள்” என்பதற்கு “சிலைகள்” என்றும், “கில்காலுக்கு அருகிலிருந்த” என்பதற்கு “கில்காலிலிருந்த” என்றும் மொழிபெயர்க்கலாம். “இரகசியச் செய்தி” என்பதற்கு “இரகசியமான ஒரு விஷயம்” அல்லது “இரகசியமான ஒரு சொல்” என்றும் மொழிபெயர்க்கலாம். எபிரெய இடக்குறிப்பு சுருக்கமாக உள்ளது.
