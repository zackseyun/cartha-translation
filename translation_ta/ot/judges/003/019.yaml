- source_word: לִי אֵלֶיךָ
  choice: உங்களிடம் ... ஒன்று என்னிடம் உள்ளது
  rationale: முதலாம் நபர் உடைமையையும் அரசனை நோக்கிய திசையையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசே
  rationale: நேரடி அழைப்புக்குரிய மரியாதையான, இயல்பான தமிழ் வடிவம்.
- source_word: הָס
  choice: அமைதி!
  rationale: சுருக்கமான, திடீர் அமைதிக் கட்டளையைத் தக்கவைக்கிறது.
- source_word: כָּל הָעֹמְדִים עָלָיו
  choice: அவனருகில் நின்றுகொண்டிருந்த அனைவரும்
  rationale: அரசனுக்குப் பணிவிடை செய்ய அருகில் நின்றிருந்தவர்களைக் குறிக்கும் பங்கேற்பு சொற்றொடரை நெருக்கமாகவும் வாசிக்க எளிதாகவும் தருகிறது.
- source_word: מֵעָלָיו
  choice: அவன் முன்னிலையிலிருந்து
  rationale: அரசனின் அருகிலிருந்த பணிவிடை நிலையிலிருந்து விலகிச் சென்ற சமூகப் பொருளைத் தெரிவிக்கிறது.
