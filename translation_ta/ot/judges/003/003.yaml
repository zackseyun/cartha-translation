translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதும் பொதுவாசகருக்குப் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டது. வசனம் முந்தைய வசனத்தின் பட்டியலைத் தொடரும் துண்டுவாக்கியம் என்பதால் ‘ஆகியோர்’ என்ற பட்டியல் நிறைவு இயல்பாக வைக்கப்பட்டது. அடிக்குறி அது விளக்கும் ‘லெபோ-ஆமாத்’ என்பதற்குப் பின் அமைக்கப்பட்டது.
