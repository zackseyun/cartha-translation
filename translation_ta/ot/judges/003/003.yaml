base_translation:
  language: en
  yaml_path: translation/ot/judges/003/003.yaml
  text: the five rulers of the Philistines[a], and all the Canaanites, and the Sidonians, and the Hivites who lived in the hill country of Lebanon, from Mount Baal-hermon as far as Lebo-hamath.
translation:
  language: ta
  text: பெலிஸ்தியரின் ஐந்து ஆட்சியாளர்கள், கானானியர் அனைவரும், சீதோனியர், பாகால்-எர்மோன் மலையிலிருந்து லெபோ-ஆமாத்[a] வரையுள்ள லெபனோன் மலைப்பகுதியில் வாழ்ந்த ஏவியர் ஆகியோர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆமாத்தின் நுழைவிடம் வரை.’ எபிரெயச் சொற்றொடரை ‘லெபோ-ஆமாத்’ என்ற இடப்பெயராகவோ, விளக்கவுரையாகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲמֵשֶׁת סַרְנֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியரின் ஐந்து ஆட்சியாளர்கள்
  rationale: சְרָנִים என்பது பெலிஸ்தியரின் தனித்துவமான அரசியல் தலைவர்களைக் குறிக்கிறது. இன்றைய வாசகருக்குத் தெளிவாகவும் நிலப்பிரபுத்துவப் பொருளைத் தவிர்க்கவும் ‘ஆட்சியாளர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: כָל הַכְּנַעֲנִי
  choice: கானானியர் அனைவரும்
  rationale: எபிரெயத்தில் ஒருமை வடிவம் இருந்தாலும் இங்கு அது ஓர் இனக்குழுவைக் கூட்டாகக் குறிக்கிறது; தமிழில் இயல்பாகப் பன்மையில் தரப்பட்டது.
- source_word: הַצִּידֹנִי
  choice: சீதோனியர்
  rationale: கூட்டுப்பொருளில் வரும் இனப்பெயர் தமிழில் இயல்பான பன்மை இனப்பெயராகத் தரப்பட்டது.
- source_word: הַחִוִּי
  choice: ஏவியர்
  rationale: இனக்குழுவைக் குறிக்கும் மரபான தமிழ் ஒலிபெயர்ப்பு; கூட்டுப்பொருள் காரணமாகப் பன்மையில் தரப்பட்டது.
- source_word: יֹשֵׁב
  choice: வாழ்ந்த
  rationale: எபிரெயப் பங்கேற்புவினை ஏவியரை விவரிக்கிறது; வரலாற்றுக் கதைச் சூழலுக்கு ஏற்ற இயல்பான இறந்தகாலப் பெயரெச்சமாக மொழிபெயர்க்கப்பட்டது.
- source_word: הַר הַלְּבָנוֹן
  choice: லெபனோன் மலைப்பகுதி
  rationale: சொல்லுக்கு நேர் பொருள் ‘லெபனோனின் மலை’ என்றாலும், இங்கு ஒரு தனிச் சிகரத்தைவிட மலைசார்ந்த பிரதேசமே குறிக்கப்படுகிறது.
- source_word: מֵהַר בַּעַל חֶרְמוֹן
  choice: பாகால்-எர்மோன் மலையிலிருந்து
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, எல்லையின் தொடக்கத்தைக் குறிக்கும் מִן முன்னொட்டு ‘இலிருந்து’ என வெளிப்படுத்தப்பட்டது.
- source_word: עַד לְבוֹא חֲמָת
  choice: லெபோ-ஆமாத் வரை
  rationale: இச்சொற்றொடர் வேதாகமப் புவியியலில் இடப்பெயராகப் புரிந்துகொள்ளப்படலாம். அதேவேளை விளக்கவுரைப் பொருளும் சாத்தியமாதலால் அது அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
