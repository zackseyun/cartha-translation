  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: רַ֗ק לְמַ֨עַן֙ דַּ֚עַת דֹּר֣וֹת בְּנֵֽי יִשְׂרָאֵ֔ל לְ/לַמְּדָ֖/ם מִלְחָמָ֑ה רַ֥ק אֲשֶׁר לְ/פָנִ֖ים לֹ֥א יְדָעֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/002.yaml
  text: only so that the generations of the sons of Israel might know[b][a], to teach them war—only those who formerly had not known it.
translation:
  language: ta
  text: இஸ்ரவேல் மக்களின் தலைமுறையினர் போர் பற்றி அறிந்துகொள்ளவும், முன்பு அதை அறிந்திராதவர்களுக்குப் போரைக் கற்பிப்பதற்காகவும் மட்டுமே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: மட்டுமே
  rationale: நோக்கத்தை வரையறுக்கும் துகளின் வலிமையையும், எபிரெய உரையில் அது இருமுறை வருவதையும் மொழிபெயர்ப்பில் இருமுறை தக்கவைக்கிறது.
- source_word: לְמַעַן דַּעַת
  choice: அறிந்துகொள்வதற்காக
  rationale: நோக்கத்தைச் சுட்டும் அமைப்பையும் ידע என்பதன் அடிப்படைப் பொருளான ‘அறிதல்’ என்பதையும் காக்கிறது.
- source_word: דֹּרוֹת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் தலைமுறைகள்
  rationale: இது இஸ்ரவேல் சமூகத்தைக் குறிக்கும் வழக்கமான இனப்பெயர்; நவீன தமிழில் இயல்பாகவும் அனைவரையும் உள்ளடக்கிய கூட்டுப்பொருளோடும் வழங்கப்படுகிறது.
- source_word: לְלַמְּדָם מִלְחָמָה
  choice: அவர்களுக்குப் போரைப் பயிற்றுவிப்பதற்காக
  rationale: למד என்பதன் பியெல் வடிவம் கற்பித்தல்/பயிற்றுவித்தலைக் குறிக்கிறது; ‘போர்’ என்ற பொருளுடன் தமிழில் ‘பயிற்றுவித்தல்’ இயல்பாக இராணுவக் கற்றலை வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר לְפָנִים לֹא יְדָעוּם
  choice: முன்பு போரை அறிந்திராதவர்கள்
  rationale: காலக் குறிப்பான ‘முன்பு’ என்பதையும் ‘அறிதல்’ என்ற வினையின் திட்டமிட்ட பரந்த பொருளையும் தக்கவைக்கிறது; அனுபவித்தல் என்று மட்டும் குறுக்கவில்லை.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலின வடிவமுள்ள கூட்டுச் சொல்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இச்சூழலில் எபிரெயச் சொற்றொடர் ஆண்களை மட்டும் அல்லாமல் உடன்படிக்கைச் சமூகமான இஸ்ரவேலரை மொத்தமாகக் குறிக்கிறது; ‘இஸ்ரவேல் மக்கள்’ என்பது நவீன தமிழில் துல்லியமான இயல்பான இனப்பெயர்.
- issue: ‘போரை அறிதல்’ என்பதன் பொருள்
  choice: போரை அறிந்திருத்தல்
  alternative: போரை அனுபவித்திருத்தல்
  rationale: ידע என்ற வினையின் பரந்த பொருளையும் உரையின் தெளிவுபடுத்தப்படாத பதற்றத்தையும் காக்கிறது; அது அறிவு, பழக்கம், அனுபவம் ஆகியவற்றை உள்ளடக்கக்கூடும்.
- issue: வசனத்தின் சார்புநிலை அமைப்பு
  choice: ‘அந்த நாடுகள் விடப்பட்டன’ என்பதைச் சூழலிலிருந்து தெளிவுக்காக நிறைவு செய்தல்
  alternative: துண்டு வாக்கியமாக நோக்கக் கூறுகளை மட்டும் மொழிபெயர்த்தல்
  rationale: எபிரெய வசனம் முந்தைய வசனத்தின் வினையுடன் தொடர்கிறது. தனி வசனமாக தமிழில் புரியுமாறு அந்த வினைமையைக் குறைந்த அளவில் வெளிப்படுத்துகிறது; புதிய இறையியல் காரணத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரெயின் ‘மட்டுமே’ என்ற மீளுரைப்பும் ‘அறிதல்’ என்ற பொருள் அகலமும் காக்கப்பட்டுள்ளன. வசனம் முந்தைய வாக்கியத்தைச் சார்ந்திருப்பதால், ‘அந்த நாடுகள் விடப்பட்டன’ என்பது தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது.
