source:
  edition: WLC
  text: וַ/יֵּצֵ֥א אֵה֖וּד הַֽ/מִּסְדְּר֑וֹנָ/ה וַ/יִּסְגֹּ֞ר דַּלְת֧וֹת הָ/עַלִיָּ֛ה בַּעֲד֖/וֹ וְ/נָעָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/023.yaml
  text: Then Ehud went out into the vestibule and shut the doors of the upper room behind him and locked them[a].
translation:
  language: ta
  text: பிறகு ஏகூத் முன்கூடத்திற்குள்[a] வெளியேறி, மேலறையின் கதவுகளைத் தனக்குப் பின்னால் மூடிப் பூட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தாழ்வாரத்திற்குள்,’ ‘இடைஅறைக்குள்,’ அல்லது ‘தூண்மண்டபத்திற்குள்’ என்றும் மொழிபெயர்க்கலாம்; இதற்கான எபிரெயச் சொல் அரிதானது, ஒட்டியுள்ள ஒரு கட்டடப் பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: வெளியேறி
  rationale: יצא என்பது ஓர் இடத்திலிருந்து வெளியே செல்லுவதைக் குறிக்கும் வழக்கமான கதைநடை வினை; அடுத்துவரும் திசைச்சுட்டும் சொல்லுடன் இயல்பாக இணைகிறது.
- source_word: הַמִּסְדְּרוֹנָה
  choice: முன்கூடத்திற்குள்
  rationale: மִסְדְּרוֹן என்பது அரிதான கட்டடக்கலைச் சொல்; மேலறையை ஒட்டிய நுழைவு அல்லது இடைப்பட்ட பகுதியை மிகத் துல்லியமாக வரையறுக்காமல் ‘முன்கூடம்’ தெரிவிக்கிறது. இறுதியிலுள்ள திசைச்சுட்டு ־ה, அந்த இடத்திற்குள் செல்லும் இயக்கத்தைக் காட்டுகிறது.
- source_word: וַיִּסְגֹּר
  choice: மூடி
  rationale: סגר என்பதன் பொதுவான பொருள் கதவை மூடுவது; தமிழில் ‘கதவுகளை மூடி’ என்பது இயல்பான இணைவு.
- source_word: דַּלְתוֹת
  choice: கதவுகளை
  rationale: பன்மை வடிவம் கதவுகளையோ இரட்டைக் கதவின் இரு பலகைகளையோ குறிக்கலாம்; ‘கதவுகள்’ மூலத்தின் பன்மையை இயல்பாகப் பேணுகிறது.
- source_word: הָעֲלִיָּה
  choice: மேலறையின்
  rationale: עֲלִיָּה என்பது கட்டடத்தின் மேற்பகுதியிலுள்ள அறையைக் குறிக்கிறது; ‘மேலறை’ தெளிவான நவீனத் தமிழ்.
- source_word: בַּעֲדוֹ
  choice: தனக்குப் பின்னால்
  rationale: 'மூடுதல் சார்ந்த சூழலில் בְּעַד இடவுறவைக் குறிக்கிறது: ஏகூத் வெளியேறியபின் கதவுகள் அவனுக்குப் பின்னால் மூடப்பட்டன.'
- source_word: וְנָעָל
  choice: பூட்டினான்
  rationale: இந்தச் சூழலில் נעל கதவைப் பூட்டுதல் அல்லது தாழிடுதலைக் குறிக்கிறது; பயன்படுத்தப்பட்ட பூட்டும் முறை கூறப்படாததால் ‘பூட்டினான்’ இயல்பாகவும் நடுநிலையாகவும் உள்ளது.
