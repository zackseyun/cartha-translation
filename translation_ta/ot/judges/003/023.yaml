  register: நவீன நிலையான தமிழில் தெளிவான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரிதான கட்டடக்கலைச் சொல்லின் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; மூலத்தின் தொடர்ச்சியான செயல்கள் ‘வெளியேறி… மூடிப் பூட்டினான்’ என்று இயல்பாக இணைக்கப்பட்டுள்ளன.
