base_translation:
  language: en
  yaml_path: translation/ot/judges/003/007.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and they forgot Yahweh their God and served the Baals and the Asherahs.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள்[a] யாவேயின் பார்வையில் தீமையானதைச் செய்தார்கள்.[b] அவர்கள் தங்கள் கடவுளாகிய யாவேயை மறந்து, பாகால்களையும் அசேராக்களையும்[c] வழிபட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் நேரடியாக, ‘இஸ்ரவேலின் மகன்கள்’; இங்கு அது இஸ்ரவேல் மக்களை மொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘யாவேயின் பார்வையில் தீமை’ என்பது யாவே தீமை என்று தீர்ப்பிடுவதைச் சுட்டும் வழக்கமான எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அசேரா கம்பங்கள்.’ எபிரெயச் சொல் அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருள்களையோ, இன்னும் பரந்த பொருளில் அசேரா வழிபாட்டையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெய மொழியின் நேரடி வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது இஸ்ரவேலரை ஒரு மக்களினமாகக் கூட்டாகக் குறிக்கும் மரபுத்தொடர். ‘இஸ்ரவேல் மக்கள்’ என்பது அதன் பொருளை இயல்பான நவீன தமிழில் தருகிறது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில் தீமையானதை
  rationale: ‘கண்களில் தீமையானது’ என்ற எபிரெய மதிப்பீட்டு மரபுத்தொடரின் உருவகத்தையும், எது தீமை என்பதை யாவேயின் தீர்ப்பு நிர்ணயிக்கிறது என்ற கருத்தையும் ‘பார்வையில்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பால் மாற்றாமல், எபிரெய வேதாகமத்தின் தனிப்பட்ட இறைப்பெயரான יהוה என்பதைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַיִּשְׁכְּחוּ
  choice: மறந்து
  rationale: שׁכח என்பதன் அடிப்படைப் பொருள் ‘மறத்தல்.’ உடன்படிக்கைச் சூழலில் இது நடைமுறைப் புறக்கணிப்பையும் உணர்த்தினாலும், மூலத்தின் நேரடி சொல்லை வைத்திருப்பது அந்த இறையியல் வலிமையை வாசகர் சூழலிலிருந்து உணர அனுமதிக்கிறது.
- source_word: אֱלֹהֵיהֶם
  choice: தங்கள் கடவுளாகிய
  rationale: இங்கு யாவேயையே குறிப்பதால் ஒருமைப் பொருள் தேவை. ‘தங்கள் கடவுளாகிய யாவே’ என்பது எபிரெய இணைப்பைத் தெளிவான தமிழில் தருகிறது.
- source_word: וַיַּעַבְדוּ
  choice: வழிபட்டார்கள்
  rationale: עבד என்பதற்கு ‘சேவை செய்தல்’ என்றும் வழிபாட்டுச் சூழலில் ‘வழிபடுதல்’ என்றும் பொருள் உண்டு. பாகால்களும் அசேராக்களும் பொருள்களாக வரும் இச்சூழலில், ‘வழிபட்டார்கள்’ என்பது சாதாரண வாசகருக்குத் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַבְּעָלִים
  choice: பாகால்கள்
  rationale: எபிரெயப் பன்மையைப் பாதுகாத்து, பாகால் வழிபாட்டின் பல உள்ளூர் வடிவங்கள் அல்லது வெளிப்பாடுகளைக் குறிக்கக்கூடிய சொல்லை தேவையின்றி ஒருமைப்படுத்தாமல் விடுகிறது.
- source_word: הָאֲשֵׁרוֹת
  choice: அசேராக்கள்
  rationale: இச்சொல் அசேரா தேவியின் உள்ளூர் வடிவங்களையோ, அவளோடு தொடர்புடைய வழிபாட்டுப் பொருள்களையோ குறிக்கலாம். ஒலிபெயர்க்கப்பட்ட பன்மை, மூலத்திலுள்ள இத்தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை எவ்வாறு மொழிபெயர்ப்பது
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதனை ஒரு பட்டத்தால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: הָאֲשֵׁרוֹת என்பது தேவியின் வடிவங்களையா அல்லது வழிபாட்டுப் பொருள்களையா குறிப்பது
  choice: அசேராக்கள்
  alternative: அசேரா கம்பங்கள்; அசேரா வழிபாட்டுச் சின்னங்கள்
  rationale: மூலச்சொல் ஆளுருவங்களையும் வழிபாட்டுப் பொருள்களையும் குறிக்கக்கூடியது. முதன்மை உரையில் ‘அசேராக்கள்’ என்று வைத்து, குறிப்பிட்ட தொல்லியல் அல்லது சமய விளக்கத்தைத் திணிக்காமல் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் இயல்பான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மரபுத்தொடர் ‘யாவேயின் பார்வையில்’ எனப் பாதுகாக்கப்பட்டுள்ளது; இனக்குழுவைக் குறிக்கும் ‘மகன்கள்’ இயல்பான தமிழுக்காக ‘மக்கள்’ என வழங்கப்பட்டு நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது. ‘அசேராக்கள்’ என்ற ஒலிபெயர்ப்பு மூலத்தின் வரலாற்று-சமயத் தெளிவின்மையைத் திறந்தவாறே வைக்கிறது.
