  text: וַֽ/יִּהְי֕וּ לְ/נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל לָ/דַ֗עַת הֲ/יִשְׁמְעוּ֙ אֶת מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁר צִוָּ֥ה אֶת אֲבוֹתָ֖/ם בְּ/יַד מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/004.yaml
  text: And they were there to test Israel[a], to know whether they would listen to the commandments of Yahweh[c][b], which he commanded their fathers through Moses.
translation:
  language: ta
  text: இஸ்ரவேலரை அவர்கள் மூலம் சோதிப்பதற்காகவும்[a], அவர்கள் யாவே தங்கள் பிதாக்களுக்குக்[c] மோசேயின் மூலம் கட்டளையிட்ட கட்டளைகளுக்குச் செவிகொடுப்பார்களா[b] என்பதை அறிந்துகொள்வதற்காகவும் அந்தத் தேசத்தார் அங்கே இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “அவர்கள் மூலம் இஸ்ரவேலைச் சோதிப்பதற்காக” என்று உள்ளது. நாட்டில் விட்டுவைக்கப்பட்ட தேசத்தார் சோதனையின் கருவியாக இருந்தனர்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “செவிகொடுப்பது” என்பது யாவேயின் கட்டளைகளைக் கவனித்துக் கீழ்ப்படிவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயில் “அவர்களுடைய பிதாக்கள்”; அதாவது இஸ்ரவேலரின் முற்பிதாக்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: அந்த தேசத்தார் அங்கே இருந்தார்கள்
  rationale: முந்தைய சூழலில் நாட்டில் விட்டுவைக்கப்பட்ட தேசத்தாரை இது குறிக்கிறது. இயல்பான தமிழுக்காக எழுவாய் வெளிப்படையாகக் கூறப்பட்டு, அவர்கள் தொடர்ந்து அங்கே இருந்த நிலை தெரிவிக்கப்படுகிறது.
- source_word: לְנַסּוֹת
  choice: சோதிப்பதற்காக
  rationale: נסה இங்கு தீமைக்கு இழுப்பதை அல்ல, சோதனைக்கு உட்படுத்தி மெய்ப்பிப்பதைக் குறிக்கிறது; ‘சோதிக்க’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: בָּם
  choice: அவர்கள் மூலம்
  rationale: இந்தப் பதிற்பெயர் பின்னொட்டு எஞ்சியிருந்த தேசத்தாரைக் குறிக்கிறது; அவர்கள் இஸ்ரவேலைச் சோதிக்கும் கருவியாக இருந்ததை ‘மூலம்’ துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: לָדַעַת
  choice: அறிந்துகொள்வதற்காக
  rationale: ידע என்பதன் அடிப்படைப் பொருளான ‘அறிதல்’ காக்கப்படுகிறது; சோதனையின் நோக்கமாக இஸ்ரவேல் கீழ்ப்படியுமா என்பதைத் தெரிந்துகொள்வது இங்கு குறிக்கப்படுகிறது.
- source_word: הֲיִשְׁמְעוּ
  choice: செவிகொடுப்பார்களா
  rationale: கட்டளைகளோடு வரும் שׁמע கேட்டல் மட்டுமல்லாமல் கவனித்து கீழ்ப்படிதலையும் குறிக்கிறது. ‘செவிகொடு’ எபிரெயச் செவிவழி உருவகத்தையும் கீழ்ப்படிதல் நுண்பொருளையும் காக்கிறது.
- source_word: מִצְוֺת
  choice: கட்டளைகள்
  rationale: מצוה என்பதற்கான இயல்பான, துல்லியமான தமிழ்ச் சொல்; இங்கு உடன்படிக்கை சார்ந்த கட்டளைகளைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் வழங்குகிறது.
- source_word: אֲבוֹתָם
  choice: அவர்களுடைய முன்னோர்கள்
  rationale: எபிரெயச் சொல் நேரடியாக ‘அவர்களுடைய தந்தையர்’ என்றாலும், இங்கு இஸ்ரவேலின் முற்பிதாக்கள் அல்லது முந்தைய தலைமுறையினரைச் சுட்டுகிறது; ‘முன்னோர்கள்’ தற்போதைய தமிழில் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: בְּיַד מֹשֶׁה
  choice: மோசேயின் மூலம்
  rationale: ‘மோசேயின் கையால்’ என்ற எபிரெய மரபுத்தொடர் முகமை அல்லது இடைமுகத்தைக் குறிக்கிறது; ‘மூலம்’ அதனை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: சோதனை மொழியின் பொருள்
  choice: எஞ்சியிருந்த தேசத்தார் மூலம் இஸ்ரவேலின் உடன்படிக்கைக் கீழ்ப்படிதல் சோதிக்கப்பட்டதாக வசனம் கூறுகிறது.
  alternative: இறையியல் நோக்கம் இல்லாத வெறும் வரலாற்றுக் கண்காணிப்பாகச் சோதனையை வாசித்தல்.
  rationale: לְנַסּוֹת மற்றும் לָדַעַת ஆகிய நோக்க வினையெச்சங்கள் சோதித்தல் மற்றும் அறிதல் என்ற நோக்கத்தை வெளிப்படுத்துகின்றன. யார் அறிந்துகொள்வது என்பதை உரை வெளிப்படையாகக் கூறாததால் மொழிபெயர்ப்பு அதைச் சேர்த்து முடிவுசெய்யவில்லை.
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: தனிப்பட்ட தெய்வீகப் பெயரைப் பட்டமாக மாற்றாமல் பெயராகவே வழங்குகிறது; ‘யெகோவா’ நவீனத் தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய நோக்க அமைப்பை இரட்டை ‘-தற்காகவும்’ வடிவில் காத்து, நீண்ட வாக்கியம் தமிழில் தெளிவாக அமைக்கப்பட்டது. உரையில் இல்லாத அறிவின் எழுவாய் சேர்க்கப்படவில்லை.
