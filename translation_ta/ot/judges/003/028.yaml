  source_fidelity: 'முக்கிய உரை எபிரெய மூலத்திற்கு நெருக்கமாக உள்ளது: רִדְפוּ אַחֲרַי என்பதன் தலைவரைப் பின்தொடர்ந்து அவசரமாகச் செல்லும் அழைப்பு, נתן ביד என்ற அதிகார/ஒப்புக்கொடுத்தல் உருவகம், மோவாப் என்ற தேசியக் கூட்டுப்பெயர், இறங்கிச் செல்லுதல், யோர்தானின் கடக்கும் இடங்கள், யாரையும் கடக்க விடாதல் ஆகியவை நன்றாகப் பாதுகாக்கப்பட்டுள்ளன. ஆனால் לְמוֹאָב-ஐ ‘மோவாபுக்கு எதிரான’ என்று மாற்று வாசகமாகக் கூறும் அடிக்குறிப்பு, முன்னொட்டின் அடிப்படைத் திசை/இலக்குப் பொருளை விடச் சூழல்சார் விளக்கத்தை அதிகப்படுத்துகிறது.'
  naturalness: நடை நவீன தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘யோர்தானின் கடவுத்துறைகள்’ மற்றும் ‘ஒருவரையும் கடந்து செல்ல விடவில்லை’ இயல்பானவை. ‘மோவாபை நோக்கிய’ என்பதும் இச்சூழலில் புரியக்கூடிய திசைக் குறிப்பு.
  terminology: ‘யாவே’ தனிப்பெயரைத் தக்கவைக்கிறது. ‘மோவாப்’ என்பதை நாட்டின் பெயராகவும் கூட்டாக எதிரியைக் குறிக்கவும் பயன்படுத்துவது மூலத்துக்கு ஏற்றது. ‘கடவுத்துறைகள்’ מעברות என்பதற்குப் பொருத்தமானது.
  issues:
  - severity: medium
    issue: அடிக்குறிப்பு c-இல் ‘மோவாபுக்கு எதிரான’ என்ற மாற்று
    rationale: לְמוֹאָב இங்கு முதன்மையாக மோவாபை நோக்கிய/மோவாபின் பக்கத்துக்குச் செல்லும் திசை அல்லது இலக்கைக் குறிக்கிறது. ‘எதிரான’ என்பது போர்ச் சூழலில் ஊகிக்கப்படலாம்; ஆனால் சொல்லின் நேரடியான மாற்றாக அளித்தால் மூலத்தின் இடவியல் தெளிவின்மையைச் சுருக்குகிறது. கடக்கும் இடங்கள் என்ற சொல் மாற்றைத் தருவது பாதுகாப்பானது.
  revised_text: அவர் அவர்களிடம், “என்னைப் பின்தொடர்ந்து வாருங்கள்[a]; ஏனெனில் உங்கள் எதிரிகளாகிய மோவாபை[b] யாவே உங்கள் கையில் ஒப்புக்கொடுத்திருக்கிறார்” என்றார். அவர்கள் அவருக்குப் பின்னால் இறங்கிச் சென்று, மோவாபை நோக்கிய யோர்தானின் கடவுத்துறைகளைக்[c] கைப்பற்றினார்கள்; ஒருவரையும் கடந்து செல்ல விடவில்லை.
  revised_footnotes:
  - marker: a
    text: அல்லது, “என் பின்னால் துரத்திச் செல்லுங்கள்.”
    reason: רִדְפוּ என்பதன் அடிப்படைப் பொருள் ‘துரத்துங்கள்’; இங்கு அது தலைவரைப் பின்தொடர்ந்து முன்னேறுவதைக் குறிக்கலாம்.
  - marker: b
    text: எபிரெயத்தில், “உங்கள் எதிரிகளை, மோவாபை”; “மோவாப்” என்பது “உங்கள் எதிரிகள்” என்பதை விளக்கும் இணைப்பெயர்.
    reason: மூலத்தின் இணைப்பெயர் அமைப்பையும், நாட்டின் பெயர் கூட்டாகப் பயன்படுத்தப்படுவதையும் தெளிவுபடுத்துகிறது.
  - marker: c
    text: அல்லது, “மோவாபை நோக்கிய யோர்தானைக் கடக்கும் இடங்களை.”
    reason: מַעְבְּרוֹת என்பது ஆற்றைக் கடக்கும் இடங்களைக் குறிக்கிறது; לְמוֹאָב திசை அல்லது இலக்கைக் குறிக்கிறது.
  revision_rationale: முக்கிய உரையில் மாற்றம் தேவையில்லை. அடிக்குறிப்பு c மட்டும், லாமெத்தின் திசைப் பொருளைத் தக்கவைத்து, ‘கடவுத்துறைகள்’ என்பதற்கான நேரடியான சொல் மாற்றை வழங்கும்படி திருத்தப்பட்டுள்ளது. இதனால் இராணுவச் சூழலிலிருந்து பெறப்படும் ‘எதிரான’ என்ற விளக்கத்தை மூலத்தின் சொல்லாட்சி மீது திணிக்காமல் தவிர்க்கிறது.
