  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ רִדְפ֣וּ אַחֲרַ֔/י כִּֽי נָתַ֨ן יְהוָ֧ה אֶת אֹיְבֵי/כֶ֛ם אֶת מוֹאָ֖ב בְּ/יֶדְ/כֶ֑ם וַ/יֵּרְד֣וּ אַחֲרָ֗י/ו וַֽ/יִּלְכְּד֞וּ אֶת מַעְבְּר֤וֹת הַ/יַּרְדֵּן֙ לְ/מוֹאָ֔ב וְ/לֹֽא נָתְנ֥וּ אִ֖ישׁ לַ/עֲבֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/028.yaml
  text: And he said to them[a], “Follow after me, for Yahweh has given your enemies, Moab, into your hand.” So they went down after him and captured the fords of the Jordan against Moab[c][b], and they did not allow anyone to cross over.
translation:
  language: ta
  text: அவர் அவர்களிடம், “என்னைப் பின்தொடர்ந்து வாருங்கள்[a]; ஏனெனில் உங்கள் எதிரிகளாகிய மோவாபை[b] யாவே உங்கள் கையில் ஒப்புக்கொடுத்திருக்கிறார்” என்றார். அவர்கள் அவருக்குப் பின்னால் இறங்கிச் சென்று, மோவாபை நோக்கிய யோர்தானின் கடவுத்துறைகளைக்[c] கைப்பற்றினார்கள்; ஒருவரையும் கடந்து செல்ல விடவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் பின்னால் துரத்திச் செல்லுங்கள்.”
    reason: רִדְפוּ என்பதன் அடிப்படைப் பொருள் ‘துரத்துங்கள்’; இங்கு அது தலைவரைப் பின்தொடர்ந்து முன்னேறுவதைக் குறிக்கலாம்.
  - marker: b
    text: எபிரெயத்தில், “உங்கள் எதிரிகளை, மோவாபை”; “மோவாப்” என்பது “உங்கள் எதிரிகள்” என்பதை விளக்கும் இணைப்பெயர்.
    reason: மூலத்தின் இணைப்பெயர் அமைப்பையும், நாட்டின் பெயர் கூட்டாகப் பயன்படுத்தப்படுவதையும் தெளிவுபடுத்துகிறது.
  - marker: c
    text: அல்லது, “மோவாபை நோக்கிய யோர்தானைக் கடக்கும் இடங்களை.”
    reason: מַעְבְּרוֹת என்பது ஆற்றைக் கடக்கும் இடங்களைக் குறிக்கிறது; לְמוֹאָב திசை அல்லது இலக்கைக் குறிக்கிறது.
lexical_decisions:
- source_word: רִדְפוּ אַחֲרַי
  choice: என்னைப் பின்தொடர்ந்து வாருங்கள்
  rationale: רדף என்பதன் அடிப்படைப் பொருள் ‘துரத்து’ என்பதாக இருந்தாலும், இங்கு ஏகூத்தின் தலைமையில் உடனடியாக முன்னேறுமாறு வீரர்களுக்கு விடுக்கப்படும் அழைப்பு. ‘பின்தொடர்ந்து வாருங்கள்’ என்பது இயக்கத்தையும் இராணுவ அவசரத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தின் துரத்தல் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: உங்கள் கையில் ஒப்புக்கொடுத்திருக்கிறார்
  rationale: ‘கையில் கொடுத்தல்’ என்பது ஒருவரின் அதிகாரத்திற்குள் ஒப்புக்கொடுத்தலைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘ஒப்புக்கொடுத்திருக்கிறார்’ என்பது வெற்றி உறுதி செய்யப்பட்டிருப்பதைத் தெளிவாக்குகிறது; ‘உங்கள் கையில்’ என்ற மூல உருவகமும் தக்கவைக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டமல்ல, தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கு எழுத்துப் பெயர். அதனால் பாரம்பரிய பட்டப்பெயரை மாற்றாக இடாமல் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֹיְבֵיכֶם אֶת מוֹאָב
  choice: உங்கள் எதிரிகளாகிய மோவாபை
  rationale: ‘மோவாப்’ என்பது ‘உங்கள் எதிரிகள்’ என்பதை விளக்கும் இணைப்பெயராக உள்ளது. மூலத்தில் இனப்பெயர் அல்லாமல் நாட்டின் பெயரே வருவதால், ‘மோவாபியர்’ என்று விரிவாக்காமல் கூட்டாகக் குறிக்கும் ‘மோவாப்’ தக்கவைக்கப்படுகிறது.
- source_word: וַיֵּרְדוּ אַחֲרָיו
  choice: அவர்கள் அவருக்குப் பின்னால் இறங்கிச் சென்று
  rationale: மலைநாட்டிலிருந்து யோர்தான் பள்ளத்தாக்கை நோக்கிய நிலவியல் இறக்கத்தை ירד நேரடியாகக் குறிக்கிறது. எனவே வெறுமனே ‘பின்தொடர்ந்தார்கள்’ எனச் சுருக்காமல் ‘இறங்கிச் சென்று’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: מַעְבְּרוֹת הַיַּרְדֵּן
  choice: யோர்தானின் கடவுத்துறைகள்
  rationale: מעברות என்பது ஆற்றைக் கடக்கக்கூடிய ஆழமற்ற இடங்களைக் குறிக்கிறது. ‘கடவுத்துறைகள்’ என்பது அந்த இராணுவ-நிலவியல் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: לְמוֹאָב
  choice: மோவாபை நோக்கிய
  rationale: לְ என்ற முன்னொட்டு இங்கு திசை அல்லது இலக்கைக் குறிக்கக்கூடும். ‘மோவாபை நோக்கிய’ என்பது அந்த இயல்பான திசைப் பொருளை வழங்குகிறது; சூழலில் சாத்தியமான எதிர்ப்புப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְלֹא נָתְנוּ אִישׁ לַעֲבֹר
  choice: ஒருவரையும் கடந்து செல்ல விடவில்லை
  rationale: சொல்லுக்குச் சொல் ‘ஒரு மனிதனைக் கடக்கக் கொடுக்கவில்லை’ என்ற எபிரெய மரபுத்தொடர், யாரையும் கடக்க அனுமதிக்கவில்லை என்பதைக் குறிக்கிறது. நவீன தமிழில் அதன் முழுமையான தடையை இயல்பாக இவ்வாறு கூறலாம்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல வசனம் தேவனுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஒரு பட்டப்பெயரால் அதை மாற்றாமல் தனிப்பெயராக ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: מוֹאָב என்ற தேசியப் பெயரின் கூட்டுப் பயன்பாடு
  choice: மோவாப்
  alternative: மோவாபியர்
  rationale: எபிரெய உரை மக்களைக் குறிக்கும் தனி இனப்பெயரைப் பயன்படுத்தாமல் நாட்டின் பெயரான ‘மோவாப்’ என்பதையே எதிரிகளைச் சுட்டும் இணைப்பெயராக வைக்கிறது. அந்த தேசிய உருவகத்தை மொழிபெயர்ப்பு தக்கவைக்கிறது.
- issue: לְמוֹאָב என்பதன் உறவு
  choice: மோவாபை நோக்கிய
  alternative: மோவாபுக்கு எதிரான
  rationale: לְ என்பது திசை/இலக்கையும், சில சூழல்களில் எதிரான நடவடிக்கையையும் குறிக்கலாம். முக்கிய உரையில் வடிவியல் ரீதியாக நேரடியான திசைப் பொருள் தேர்ந்தெடுக்கப்பட்டு, இராணுவச் சூழலில் சாத்தியமான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான வரலாற்று-கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கடவுத்துறை’, ‘ஒப்புக்கொடுத்திருக்கிறார்’ போன்ற சொற்கள் மூலத்தின் நிலவியல் மற்றும் அதிகார உருவகங்களைத் தெளிவாக வைத்திருக்கின்றன; தேவையற்ற சமயப் பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
