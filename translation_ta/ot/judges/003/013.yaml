  text: וַ/יֶּאֱסֹ֣ף אֵלָ֔י/ו אֶת בְּנֵ֥י עַמּ֖וֹן וַ/עֲמָלֵ֑ק וַ/יֵּ֗לֶךְ וַ/יַּךְ֙ אֶת יִשְׂרָאֵ֔ל וַ/יִּֽירְשׁ֖וּ אֶת עִ֥יר הַ/תְּמָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/013.yaml
  text: He gathered to himself the Ammonites and Amalek[a], and he went and struck Israel[b], and they took possession of the City of Palms.
translation:
  language: ta
  text: அவன் அம்மோனியரையும் அமலேக்கையும்[a] தன்னிடம் திரட்டிக்கொண்டான். பின்பு அவன் சென்று இஸ்ரவேலைத் தாக்கினான்; அவர்கள் “பேரீச்சமரங்களின் நகரத்தை”[b] கைப்பற்றினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, அமலேக்கியர். எபிரெயத்தில் ‘அமலேக்கு’ என்ற பெயர் அந்த மக்களினத்தைக் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இது எரிகோவைக் குறிக்கலாம்; உபாகமம் 34:3; 2 நாளாகமம் 28:15 ஆகியவற்றை ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֶּאֱסֹף אֵלָיו
  choice: தன்னிடம் திரட்டிக்கொண்டான்
  rationale: ஆட்களைத் தன்னிடம் கூட்டிச் சேர்த்து, தன் தலைமையின்கீழ் அணிதிரட்டுவதை இந்த எபிரெயச் சொற்றொடர் குறிக்கிறது. தமிழ் நடையில் இயல்பாகவும் மூலத்தின் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: בְּנֵי עַמּוֹן
  choice: அம்மோனியர்
  rationale: சொல்லுக்குச் சொல் ‘அம்மோனின் மகன்கள்’ என்றாலும், இங்கு ஒரு மக்களினத்தின் பெயராக வருவதால் ‘அம்மோனியர்’ என்பது இயல்பான தமிழாக்கம்.
- source_word: עֲמָלֵק
  choice: அமாலேக்கு
  rationale: மூலத்தில் மக்களினத்தைக் கூட்டாகக் குறிக்கும் ‘அமாலேக்கு’ என்ற தனிப்பெயரே உள்ளது. அதைப் பிரதான உரையில் தக்கவைத்து, ‘அமாலேக்கியர்’ என்ற பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: וַיֵּלֶךְ
  choice: பின்பு அவன் சென்று
  rationale: הלך என்பது பொதுவாக ‘செல்’ என்று பொருள்படும். மூலத்தில் வெளிப்படையாக இல்லாத ‘படையெடுத்துச் சென்றான்’ போன்ற கூடுதல் இராணுவ நுணுக்கத்தைப் புகுத்தாமல் கதைத் தொடரை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיַּךְ אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலைத் தாக்கினான்
  rationale: נכה என்பதன் அடிப்படைப் பொருள் ‘அடி/தாக்கு’. ‘தோற்கடித்தான்’ என்று முடிவை அதிகமாக விளக்காமல், இங்குள்ள இராணுவச் சூழலுக்கு ஏற்றவாறு ‘தாக்கினான்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיִּירְשׁוּ
  choice: அவர்கள் … கைப்பற்றினார்கள்
  rationale: வினைச்சொல் மூன்றாம் நபர் ஆண்பால் பன்மையில் உள்ளது; ஆகவே எழ்லோனையும் அவனுடன் சேர்ந்த படைகளையும் குறிக்கும் ‘அவர்கள்’ என்பதே பொருத்தம். ירשׁ இங்கு வெற்றியின் விளைவாக ஓர் இடத்தைத் தமதாக்கிக்கொள்வதைக் குறிக்கிறது.
- source_word: עִיר הַתְּמָרִים
  choice: ‘பேரீச்சமரங்களின் நகரம்’
  rationale: תְּמָרִים என்பது பேரீச்சமரங்களைக் குறிக்கிறது. மூலத்தில் எரிகோ என்ற பெயர் நேரடியாக இல்லாததால், உருவகத்தையும் இடப்பெயரின் தன்மையையும் பாதுகாக்கும் வகையில் விளக்கப் பெயரே மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: עִיר הַתְּמָרִים என்ற இடத்தின் அடையாளம்
  choice: பிரதான உரையில் ‘பேரீச்சமரங்களின் நகரம்’ என்ற மூலத்தின் விளக்கப் பெயரை வைத்தல்
  alternative: ‘எரிகோ’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: இந்த இடம் எரிகோவாக இருக்க வாய்ப்பிருந்தாலும், எபிரெய உரை இங்கு எரிகோ என்ற பெயரைச் சொல்லவில்லை. எனவே சாத்தியமான அடையாளத்தை உரைக்குள் உறுதிப்படுத்தாமல் அடிக்குறிப்பில் தருவது மூலத்தின் துல்லியத்தையும் அதன் திறந்த தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கும் பொதுவழக்குக்கும் இடைப்பட்ட, தெளிவான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய தொடர் வாக்கியம் தமிழ் வாசிப்பிற்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. மூலத்தில் உள்ள ஒருமை ‘அவன்’ மற்றும் பன்மை ‘அவர்கள்’ வேறுபாடு வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் அவற்றின் குறிப்புகளுடன் மாறிப் பொருந்தியிருந்ததால், தமிழில் ‘அமாலேக்கு’ என்பதற்கு [a] மற்றும் ‘பேரீச்சமரங்களின் நகரம்’ என்பதற்கு [b] என்று பொருளடிப்படையில் சரிசெய்யப்பட்டுள்ளது.
