reference: Judges 3:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּקְח֨וּ אֶת בְּנוֹתֵי/הֶ֤ם לָ/הֶם֙ לְ/נָשִׁ֔ים וְ/אֶת בְּנוֹתֵי/הֶ֖ם נָתְנ֣וּ לִ/בְנֵי/הֶ֑ם וַ/יַּעַבְד֖וּ אֶת אֱלֹהֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/006.yaml
  text: They took their daughters for themselves as wives[a], and they gave their daughters to their sons, and they served their gods.
translation:
  language: ta
  text: அவர்கள் அவர்களுடைய மகள்களைத் தங்களுக்கு மனைவிகளாக எடுத்துக்கொண்டார்கள்; தங்கள் மகள்களை அவர்களுடைய மகன்களுக்குக் கொடுத்தார்கள்; அவர்களுடைய தெய்வங்களுக்குப் பணிசெய்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய தெய்வங்களை வழிபட்டார்கள்.”
    reason: עבד என்பது இச்சூழலில் ‘பணிசெய்’ என்றும் ‘வழிபடு’ என்றும் பொருள்படலாம்.
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: எடுத்துக்கொண்டார்கள்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்.’ திருமணச் சூழலில் ஒரு பெண்ணை மனைவியாக ஏற்றுக்கொள்வதைக் குறிக்கிறது; தொடர்ந்து வரும் ‘மனைவிகளாக’ என்பது அந்தப் பொருளைத் தெளிவாக்குகிறது.
- source_word: בְּנוֹתֵיהֶם ... לָהֶם לְנָשִׁים
  choice: அவர்களுடைய மகள்களைத் தங்களுக்கு மனைவிகளாக
  rationale: முதல் பன்மைச் சுட்டுப்பெயர் சுற்றியிருந்த மக்களையும், ‘தங்களுக்கு’ என்பது இஸ்ரவேலரையும் குறிக்கிறது. எபிரேயத்தின் பயன் மற்றும் நோக்கக் கட்டமைப்பு தமிழில் இயல்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: וְאֶת בְּנוֹתֵיהֶם נָתְנוּ לִבְנֵיהֶם
  choice: தங்கள் மகள்களை அவர்களுடைய மகன்களுக்குக் கொடுத்தார்கள்
  rationale: இந்த இடத்தில் சூழலின்படி முதல் பின்னொட்டு இஸ்ரவேலரையும், இரண்டாவது பின்னொட்டு சுற்றியிருந்த மக்களையும் குறிக்கிறது. ‘தங்கள்/அவர்களுடைய’ என்ற வேறுபாடு தமிழில் குறிப்பிடப்படும் தரப்புகளை இயல்பாகத் தெளிவுபடுத்துகிறது; ‘கொடுத்தார்கள்’ என்பது נתן என்பதன் நேர்ப் பொருளைப் பாதுகாக்கிறது.
- source_word: וַיַּעַבְדוּ
  choice: பணிசெய்தார்கள்
  rationale: עבד என்பது தெய்வங்களுடன் வரும்போது சேவை, சமயப் பணிவு, வழிபாடு ஆகியவற்றை உள்ளடக்கலாம். ‘பணிசெய்தார்கள்’ அதன் விசாலமான விசுவாசம்/கீழ்ப்படிதல் சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: אֱלֹהֵיהֶם
  choice: அவர்களுடைய தெய்வங்கள்
  rationale: இது சுற்றியிருந்த மக்களின் பல தெய்வங்களைக் குறிக்கும் பன்மை வடிவம்; ‘தெய்வங்கள்’ என்பது தெளிவான, வழக்கமான தமிழ் இணை.
theological_decisions:
- issue: பிற தெய்வங்களுக்குச் செய்யப்படும் עבד என்பதன் சமயப் பொருள்
  choice: அவர்களுடைய தெய்வங்களுக்குப் பணிசெய்தார்கள்
  alternative: அவர்களுடைய தெய்வங்களை வழிபட்டார்கள்
  rationale: ‘பணிசெய்தார்கள்’ என்பது வழிபாட்டோடு சமய விசுவாசம் மற்றும் கீழ்ப்படிதலையும் உள்ளடக்கும் எபிரேயச் சொல்லின் அகலத்தைப் பாதுகாக்கிறது. ‘வழிபட்டார்கள்’ என்பதும் செல்லத்தக்க மாற்று என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தங்கள்’ மற்றும் ‘அவர்களுடைய’ என்பவை சூழலில் மாறும் சுட்டுப்பெயர் குறிப்புகளை அதிக விளக்கச் சொற்கள் சேர்க்காமல் வேறுபடுத்துகின்றன. அடிக்குறி அது விளக்கும் ‘பணிசெய்தார்கள்’ என்பதன் பின்னர் வைக்கப்பட்டுள்ளது.
