base_translation:
  language: en
  yaml_path: translation/ot/judges/003/025.yaml
  text: And they waited until they were embarrassed[a], and behold, he still was not opening the doors of the upper room. So they took the key and opened them, and behold, their master had fallen to the floor[c][b], dead.
translation:
  language: ta
  text: அவர்கள் சங்கடப்படும் அளவுக்குக் காத்திருந்தார்கள்[a]. இதோ, அவன் மாடியறையின்[b] கதவுகளைத் திறக்காமல் இருந்தான். ஆகவே அவர்கள் சாவியை எடுத்து அவற்றைத் திறந்தார்கள். இதோ, அவர்களுடைய எஜமான்[c] தரையில் விழுந்து, இறந்த நிலையில் கிடந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெட்கப்படும் வரை.’ எபிரெயச் சொல் வெட்கம் அல்லது அவமானத்தையும் குறிக்கலாம்; இங்கு அவர்கள் தொடர்ந்து காத்திருந்ததால் ஏற்பட்ட சங்கடத்தைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மேலறையின்’ அல்லது ‘மேல்மாடி அறையின்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அவர்களுடைய ஆண்டவன்.’ இங்கு இச்சொல் அவர்களுடைய மனித அதிகாரியான ஏக்லோனைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחִילוּ
  choice: காத்திருந்தார்கள்
  rationale: இந்தச் சூழலில் ஏக்லோனின் பணியாளர்கள் கதவுக்கு வெளியே தொடர்ந்து காத்திருந்ததைக் குறிக்கிறது; நவீன தமிழில் இது இயல்பானவும் தெளிவானவும் உள்ளது.
- source_word: עַד בּוֹשׁ
  choice: சங்கடப்படும் அளவுக்கு
  rationale: בּוֹשׁ வெட்கம் அல்லது அவமானத்தைக் குறிக்கக்கூடும்; இங்கு நீண்ட நேரம் காத்திருந்ததால் ஏற்பட்ட சமூகத் தர்மசங்கடத்தை ‘சங்கடப்படும் அளவுக்கு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: இரு இடங்களிலும் திடீர் கவனமாற்றத்தையும் காட்சியின் உயிரோட்டத்தையும் தக்கவைக்கிறது.
- source_word: אֵינֶנּוּ פֹתֵחַ
  choice: திறக்காமல் இருந்தான்
  rationale: அந்த நேரத்தில் தொடர்ந்துகொண்டிருந்த செயலின்மையை தமிழில் இயல்பாகத் தெரிவிக்கிறது; எபிரெயத்தில் தனியாக இல்லாத ‘இன்னும்’ என்பதைச் சேர்க்கவில்லை.
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: மாடியறையின் கதவுகள்
  rationale: עֲלִיָּה என்பது கட்டிடத்தின் மேற்பகுதியிலுள்ள அறையைக் குறிக்கிறது; ‘மாடியறை’ சாதாரண நவீன தமிழில் தெளிவாக உள்ளது, மேலும் கதவுகள் என்ற பன்மை தக்கவைக்கப்படுகிறது.
- source_word: הַמַּפְתֵּחַ
  choice: சாவி
  rationale: தமிழில் வழக்கமான, நேரடியான இணைச்சொல்.
- source_word: אֲדֹנֵיהֶם
  choice: அவர்களுடைய எஜமான்
  rationale: இங்கு சொல் கடவுளைக் குறிக்காமல் பணியாளர்களின் மனித அதிகாரியான ஏக்லோனைக் குறிக்கிறது; ‘எஜமான்’ அந்த உறவைத் தெளிவாக்குகிறது.
- source_word: נֹפֵל אַרְצָה מֵת
  choice: தரையில் விழுந்து இறந்துகிடந்தார்
  rationale: கதவு திறக்கப்பட்டபோது கண்ட உடலின் விளைவுநிலையை இயல்பான தமிழில் காட்டுகிறது; אַרְצָה என்பதற்கு உட்புறச் சூழலில் ‘தரையில்’ பொருத்தமானது.
theological_decisions:
- issue: אֲדֹנֵיהֶם என்ற அதிகாரப் பட்டத்தின் குறிப்பு
  choice: எஜமான்
  alternative: ஆண்டவர்
  rationale: இந்த வசனத்தில் அது ஏக்லோன் என்ற மனித அரசரையும் பணியாளர்களுடனான அவரது அதிகார உறவையும் குறிக்கிறது; தெய்வீகப் பட்டமாகத் தவறாகப் புரிந்துகொள்ளப்படாதபடி ‘எஜமான்’ பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், உரையாடல் வழக்குக்கு இறங்காமல் எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய உரையின் இரு וְהִנֵּה சொற்களும் ‘இதோ’ என்று தக்கவைக்கப்பட்டுள்ளன; சமூகச் சங்கடம், தொடர்ந்த செயலின்மை, மற்றும் கண்டுபிடிக்கப்பட்ட இறந்த நிலை ஆகியவை மிகைப்படுத்தாமல் வெளிப்படுத்தப்பட்டுள்ளன.
