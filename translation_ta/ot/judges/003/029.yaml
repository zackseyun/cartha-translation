  yaml_path: translation/ot/judges/003/029.yaml
  text: And at that time they struck down about ten thousand men of Moab[a], every stout man and every man of valor[c][b]; not a man escaped.
translation:
  language: ta
  text: அந்த நேரத்தில் அவர்கள் மோவாபிய ஆண்களில் ஏறக்குறைய பத்தாயிரம் பேரைத் தாக்கி வீழ்த்தினார்கள். அவர்கள் ஒவ்வொருவரும் திடகாத்திரமானவர்களும்[a] வீரர்களுமாய் இருந்தார்கள்[b]. ஒருவன்கூடத் தப்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொழுத்தவர்களும்” அல்லது “உடல்வலிமை மிக்கவர்களும்.” எபிரெயச் சொல் நேரடியாக ‘கொழுத்த’ என்று பொருள்படும்; இங்கு நன்கு போஷிக்கப்பட்ட அல்லது வலிமையான ஆண்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “போர்த்திறன் வாய்ந்தவர்களுமாய்,” “வீரமிக்கவர்களுமாய்,” அல்லது “வல்லமைமிக்கவர்களுமாய்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: வெட்டி வீழ்த்தினார்கள்
  rationale: நכה என்பது போர்ச் சூழலில் தாக்கிக் கொல்லுதல் அல்லது வீழ்த்துதல் என்ற விளைவைக் குறிக்கிறது; தமிழில் ‘வெட்டி வீழ்த்தினார்கள்’ அந்த வன்முறையான போர்ச் செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶת מוֹאָב
  choice: மோவாபியரில்
  rationale: எபிரெயத்தில் நேரடியாக ‘மோவாபை’ என்றிருந்தாலும், தொடர்ந்து வரும் ‘ஏறக்குறைய பத்தாயிரம் பேர்’ என்பது மோவாபிய ஆண்களைச் சுட்டுகிறது; தமிழ் நடை இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּעֵת הַהִיא
  choice: அந்த நேரத்தில்
  rationale: மூலத்தின் காலக் குறிப்பை நெருக்கமாகவும் இயல்பான நவீன தமிழிலும் வழங்குகிறது.
- source_word: כַּעֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: ஏறக்குறைய பத்தாயிரம் பேர்
  rationale: முன்னொட்டு כ இங்கு தோராய எண்ணைக் குறிக்கிறது; ‘ஏறக்குறைய’ அந்த நுட்பத்தைத் தெளிவாகக் காக்கிறது.
- source_word: כָּל שָׁמֵן
  choice: அனைவரும் உடல்வலிமை மிக்கவர்கள்
  rationale: שָׁמֵן என்பதன் நேரடிப் பொருள் ‘கொழுத்த’ என்பதாக இருந்தாலும், இப்போர்ச் சூழலில் நன்கு போஷிக்கப்பட்ட, திடகாத்திரமான அல்லது வலிமையானவர்களைக் குறிப்பதாகத் தெரிகிறது; ‘உடல்வலிமை மிக்கவர்கள்’ சூழல்சார் பொருளை இயல்பாகத் தருகிறது.
- source_word: וְכָל אִישׁ חָיִל
  choice: போர்த்திறன் வாய்ந்தவர்கள்
  rationale: אִישׁ חַיִל என்பது வீரமுள்ள, வல்லமைமிக்க அல்லது திறனுள்ள மனிதனைக் குறிக்கலாம்; போர்ச் சூழலில் ‘போர்த்திறன் வாய்ந்தவர்கள்’ அதன் செயல்சார் பொருளைத் தருகிறது.
- source_word: וְלֹא נִמְלַט אִישׁ
  choice: ஒருவன்கூடத் தப்பவில்லை
  rationale: தோல்வியின் முழுமையை வலியுறுத்தும் மூல மொழி நடையைச் சுருக்கமாகவும் வலிமையாகவும் பிரதிபலிக்கிறது.
