  source_fidelity: ‘வெட்டி வீழ்த்தினார்கள்’ என்பது נכה (‘அடித்தல்/தாக்குதல்/வீழ்த்துதல்’) என்பதைக் குறிப்பாக வெட்டும் ஆயுதத்தால் நிகழ்த்திய செயல் என அதிகமாக்குகிறது. மூலத்தில் அத்தகைய ஆயுதமுறைக் குறிப்பு இல்லை. ‘தாக்கி வீழ்த்தினார்கள்’ மூலத்தின் போர்ச்சூழல் வன்முறையையும், தேவையற்ற குறிப்பாக்கமின்றி, காக்கிறது. ஏறக்குறைய பத்தாயிரம் என்ற எண்ணும், அனைவரையும் குறிக்கும் இரண்டு விளக்கங்களும், ‘ஒருவன்கூடத் தப்பவில்லை’ என்ற முழுமை வலியுறுத்தலும் காக்கப்பட்டுள்ளன.
  naturalness: திருத்தப்பட்ட உரை நவீனத் தரத் தமிழில் இயல்பாக உள்ளது. ‘மோவாபிய ஆண்களில் ஏறக்குறைய பத்தாயிரம் பேரை’ என்பது எண்ணப்படுபவர்கள் மனிதர்கள் என்பதைத் தெளிவுபடுத்துகிறது; ‘அவர்கள் ஒவ்வொருவரும்’ என்பதும் எபிரெயத்தின் ‘ஒவ்வொரு ... ஒவ்வொரு ...’ என்ற பகிர்வுநிலையைத் தெளிவாகத் தருகிறது.
  terminology: ‘திடகாத்திரமானவர்கள்’ שָׁמֵן என்பதன் சூழல்சார் ‘நன்கு போஷிக்கப்பட்ட/வலிமையான’ நுணுக்கத்தை நேரடியாக உடல் அளவை மட்டுமே குறிக்கும் சொல்லாக மாற்றாமல் வெளிப்படுத்துகிறது. ‘வீரர்கள்’ אִישׁ חַיִל என்பதன் போர்ச் சூழலிலான ‘வீரம்/வல்லமை’ பொருளுக்கு இயல்பான தமிழ். அடிக்குறிப்புகள் மாற்றுவழிகளைத் தக்கவைக்கின்றன.
