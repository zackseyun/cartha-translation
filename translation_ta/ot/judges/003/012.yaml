source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְחַזֵּ֨ק יְהוָ֜ה אֶת עֶגְל֤וֹן מֶֽלֶךְ מוֹאָב֙ עַל יִשְׂרָאֵ֔ל עַ֛ל כִּֽי עָשׂ֥וּ אֶת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/012.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and Yahweh strengthened Eglon king of Moab against Israel, because they had done what was evil in the eyes of Yahweh.
translation:
  language: ta
  text: இஸ்ரவேலின் பிள்ளைகள்[a] மீண்டும் யாவேயின் பார்வையில் தீமையானதைச் செய்தார்கள். அவர்கள் யாவேயின் பார்வையில் தீமையானதைச் செய்ததால், யாவே மோவாபின் அரசனான எக்லோனை இஸ்ரவேலுக்கு எதிராக வலுப்படுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘இஸ்ரவேலின் பிள்ளைகள்’; இச்சொற்றொடர் ‘இஸ்ரவேலர்’ அல்லது ‘இஸ்ரவேல் மக்கள்’ என்பதைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: மீண்டும் ... செய்தார்கள்
  rationale: יסף + infinitive என்ற எபிரெயச் சொற்றொடர் ஒரு செயலை மீண்டும் செய்வதையோ தொடர்வதையோ குறிக்கலாம். நீதித்தலைவர்கள் நூலின் சுழற்சி அமைப்பில் இங்கு மீண்டும் செய்தார்கள் என்பது பொருத்தமானது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் பிள்ளைகள்
  rationale: மூலத்தின் குடும்ப உறவுச் சொல்லாட்சியைத் தெளிவாகப் பாதுகாக்கிறது; இது ஒட்டுமொத்த இஸ்ரவேல் மக்களைக் குறிக்கும் மரபுத்தொடர் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: לַעֲשׂוֹת הָרַע
  choice: தீமையானதைச் செய்தார்கள்
  rationale: சொல்லுக்குச் சொல் அமைப்பைத் திணிக்காமல், யாவேயின் மதிப்பீட்டில் தீமையான செயலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: எபிரெய மொழியின் மதிப்பீட்டைக் குறிக்கும் ‘கண்களில்’ என்ற உருவகத்தை தமிழில் புரிந்துகொள்ளத்தக்க ‘பார்வையில்’ என வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரின் ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பை வழங்குகிறது.
- source_word: וַיְחַזֵּק
  choice: வலுப்படுத்தினார்
  rationale: பியேல் வினையின் நேரடியான causative force-ஐப் பாதுகாத்து, யாவேயின் செயற்பாட்டை மெலிதாக்காமல் கூறுகிறது.
- source_word: אֶת עֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: மோவாபின் அரசனான எக்லோனை
  rationale: பெயருக்கும் அரசப் பதவிக்கும் இடையிலான appositional உறவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராக
  rationale: பகைமைச் சூழலில் עַל என்பது ஆட்சி அல்லது இடநிலையைவிட எதிர்ப்பைக் குறிப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל כִּי
  choice: செய்ததால்
  rationale: யாவேயின் நடவடிக்கைக்கான காரணத்தை இயல்பான தமிழ் காரணவினையெச்ச வடிவில் வெளிப்படுத்துகிறது.
- source_word: עָשׂוּ אֶת הָרַע
  choice: தீமையானதைச் செய்தார்கள்
  rationale: தீர்ப்புக்குக் காரணமான அவர்களின் செயலைத் தெளிவாகக் கூறுகிறது; மூலத்தில் உள்ள மீளுரைப்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்து வழங்குவது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: וַיְחַזֵּק יְהוָה אֶת עֶגְלוֹן என்பதில் இறைச் செயற்பாடு
  choice: யாவே ... எக்லோனை ... வலுப்படுத்தினார்
  alternative: எக்லோன் வலுப்பெற யாவே அனுமதித்தார்
  rationale: எபிரெய வினை யாவேயை நேரடிச் செயற்பாட்டாளராகக் காட்டுகிறது. ‘அனுமதித்தார்’ என்று மாற்றுவது மூலத்தில் உள்ள இறையியல் பதற்றத்தை மெலிதாக்கும் என்பதால் நேரடி செயற்பாடு பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மீளுரைப்பும் யாவேயின் நேரடி செயற்பாடும் பாதுகாக்கப்பட்டுள்ளன; காரணக் கிளவி இயல்பான தமிழ் தொடரமைப்புக்காக முன்வைக்கப்பட்டுள்ளது.
