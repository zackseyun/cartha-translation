  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אֵה֥וּד נִמְלַ֖ט עַ֣ד הִֽתְמַהְמְהָ֑/ם וְ/הוּא֙ עָבַ֣ר אֶת הַ/פְּסִילִ֔ים וַ/יִּמָּלֵ֖ט הַ/שְּׂעִירָֽתָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/026.yaml
  text: But Ehud escaped while they delayed[b][a], and he passed beyond the carved images and escaped to Seirah.
translation:
  language: ta
  text: ஆனால் அவர்கள் தாமதித்துக்கொண்டிருந்தபோது ஏகூத் தப்பினான்; அவன் செதுக்கப்பட்ட உருவங்களைக்[a] கடந்து, சேயிராவுக்குத்[b] தப்பினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘சிலைகளைக்’ அல்லது ‘செதுக்கப்பட்ட சிலைகளைக்’.
    reason: lexical_alternative
  - marker: b
    text: ‘சேயிராத்’ என்றும் ஒலிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: נִמְלַט / וַיִּמָּלֵט
  choice: தப்பினான்
  rationale: மלט என்பதன் நிபால் வடிவம் ஆபத்திலிருந்து வெற்றிகரமாகத் தப்புவதைக் குறிக்கிறது. மூலத்தில் ஒரே வினை இருமுறை வருவதால், தமிழிலும் ‘தப்பினான்’ என்று இருமுறை வழங்கப்பட்டுள்ளது.
- source_word: עַד הִתְמַהְמְהָם
  choice: அவர்கள் தாமதித்துக்கொண்டிருந்தபோது
  rationale: מהה என்பதன் ஹித்பயேல் வடிவம் தாமதித்தல் அல்லது காலம் கடத்துதலைக் குறிக்கிறது. இங்கே ஏகூத் தப்பிய காலச்சூழலை இயல்பான தமிழில் இது தெளிவாகக் காட்டுகிறது.
- source_word: עָבַר אֶת הַפְּסִילִים
  choice: செதுக்கப்பட்ட உருவங்களைக் கடந்து
  rationale: עבר என்பது இப்பயணச் சூழலில் ஓர் அறியப்பட்ட இடக்குறியைக் கடந்துசெல்வதைக் குறிக்கிறது; פסילים என்பதன் உருவச்சார்ந்த பொருளும் மொழிபெயர்ப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: הַפְּסִילִים
  choice: செதுக்கப்பட்ட உருவங்கள்
  rationale: פסילים என்பது செதுக்கப்பட்ட உருவங்களையோ சிலைகளையோ குறிக்கலாம். அவை வழிபாட்டுப் பொருட்களாக இருந்திருக்கக்கூடும் என்றாலும், ‘செதுக்கப்பட்ட உருவங்கள்’ என்பது மூலத்தின் சொல்லாட்சியைப் பாதுகாத்து, குறிப்பிட்ட பொருளை வாசகரே உணர இடமளிக்கிறது.
- source_word: הַשְּׂעִירָתָה
  choice: சேயிராவுக்கு
  rationale: இது திசையைக் குறிக்கும் இறுதியொட்டுடன் வரும் இடப்பெயர். ஆகவே பெயர் ஒலிபெயர்க்கப்பட்டு, செல்லும் திசை ‘-க்கு’ என்னும் வேற்றுமையுருபால் காட்டப்பட்டுள்ளது.
- source_word: וְ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் பணியாளர்கள் காத்திருந்ததற்கும் ஏகூத் தப்பியதற்கும் இடையிலான கதைநடைக் முரண்பாட்டை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
