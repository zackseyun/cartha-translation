translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. மூல எபிரெயத்தில் ‘தப்பினான்’ என்ற வினை மீண்டும் வருவது தமிழிலும் பாதுகாக்கப்பட்டுள்ளது; இடப்பெயருக்கான திசைப்பொருள் இயல்பான வேற்றுமையுருபால் தெரிவிக்கப்பட்டுள்ளது.
