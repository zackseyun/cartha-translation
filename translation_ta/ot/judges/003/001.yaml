source:
  edition: WLC
  text: וְ/אֵ֤לֶּה הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִנִּ֣יחַ יְהוָ֔ה לְ/נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל אֵ֚ת כָּל אֲשֶׁ֣ר לֹֽא יָדְע֔וּ אֵ֖ת כָּל מִלְחֲמ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/001.yaml
  text: 'These are the nations that Yahweh left to test Israel by them[a], that is, all who had not known any of the wars of Canaan:'
translation:
  language: ta
  text: கானானின் போர்கள் எதையும் அறிந்திராத இஸ்ரயேலர் அனைவரையும் அவர்கள்மூலம் சோதிப்பதற்காக, யாவே விட்டுவைத்த நாடுகள் இவையே:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கானானின் போர்கள் எதையும் அனுபவித்திராத.”
    reason: ידע என்பது இச்சூழலில் வெறும் தகவல் அறிவை மட்டுமல்லாமல், போரை நேரில் எதிர்கொண்ட அனுபவ அறிவையும் குறிக்கக்கூடும்.
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: இவையே
  rationale: வாவ் இணைப்பின் உரையாடல் தொடர்ச்சியைத் தமிழில் செயற்கையான ‘மேலும்’ என்று கட்டாயப்படுத்தாமல், புதிய பட்டியலை அறிமுகப்படுத்தும் இயல்பான வடிவம்.
- source_word: הַגּוֹיִם
  choice: நாடுகள்
  rationale: இங்கு கானானில் எஞ்சியிருந்த தனித்த இன-அரசியல் மக்கள்குழுக்களைக் குறிக்கிறது; ‘நாடுகள்’ தெளிவான வழக்கமான மொழிபெயர்ப்பு.
- source_word: הִנִּיחַ
  choice: விட்டுவைத்திருந்த
  rationale: ஹிஃபில் வடிவின் ‘எஞ்சியிருக்கும்படி விடுதல்’ என்ற பொருளையும், முந்தைய நிகழ்வைச் சுட்டும் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ‘ஆண்டவர்’ போன்ற பட்டத்தால் மாற்றாமல், எபிரெயத் திருநாமத்தை நவீனத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לְנַסּוֹת
  choice: சோதிப்பதற்காக
  rationale: נסה என்பதன் நோக்கப்பொருளைத் தெளிவாகக் காட்டுகிறது; ‘சோதனைக்குட்படுத்துதல்’ என்ற பொருளைத் தக்கவைத்து ‘தீமைக்கு இழுத்தல்’ என்ற பொருளைச் சேர்ப்பதில்லை.
- source_word: בָּם
  choice: அவர்களைக் கொண்டு
  rationale: எஞ்சவிடப்பட்ட நாடுகளே இஸ்ரயேலைச் சோதிக்கும் கருவி அல்லது வழிமுறை என்பதைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: אֶת יִשְׂרָאֵל אֵת כָּל אֲשֶׁר
  choice: இஸ்ரயேலை—அதாவது, … அனைவரையும்—
  rationale: இரண்டாவது אֵת தொடர் ‘இஸ்ரயேல்’ என்பதைக் குறிப்பாக விளக்கும் இணைப்பாக இருப்பதைத் தெளிவாக்குகிறது; மூலத்தின் நீண்ட வாக்கிய அமைப்பையும் காக்கிறது.
- source_word: לֹא יָדְעוּ
  choice: அறிந்திராத
  rationale: ידע என்பதன் அடிப்படை ‘அறிதல்’ மொழியை முதன்மைப் பிரதியில் காக்கிறது; இங்கு நேரடி அனுபவம் என்ற சாத்தியமான நுணுக்கம் அடிக்குறிப்பில் வழங்கப்படுகிறது.
- source_word: אֵת כָּל מִלְחֲמוֹת כְּנָעַן
  choice: கானானின் போர்கள் எதையும்
  rationale: எதிர்மறை வாக்கியத்தில் எதுவொன்றையும் அறியவில்லை என்ற பொருளை இயல்பான தமிழில் தருகிறது; ‘கானானின் போர்கள்’ என்ற மூலத் தொடர்பை விளக்கவுரையின்றிக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட திருநாமம் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல், Yahweh என்பதற்கான தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- issue: தேவன் நாடுகளை விட்டுவைத்ததன் நோக்கமாகச் சோதித்தல்
  choice: சோதிப்பதற்காக
  alternative: நிரூபிப்பதற்காக
  rationale: தேவனே இந்த நாடுகளை இஸ்ரயேலைச் சோதிப்பதற்காக விட்டுவைத்தார் என்று வசனம் கூறும் இறையியல் அழுத்தத்தை மென்மையாக்காமலும் கூடுதல் விளக்கம் சேர்க்காமலும் காக்கிறது.
- issue: சோதிக்கப்படுகிற ‘இஸ்ரயேல்’ யாரைக் குறிக்கிறது
  choice: ‘அதாவது’ என்ற இடைச்செருகலால் போர்களை அறியாத அனைவரையும் இஸ்ரயேலுடன் இணைத்தல்
  alternative: இரு தனித்த நேரடி பொருள்களாக வாசித்தல்
  rationale: இரண்டாவது אֵת தொடர் முதலாம் பொருளை விளக்கும் இணைப்பாக இயல்பாகப் புரிகிறது; கோடுகள் மூலம் அந்த உறவு காட்டப்பட்டாலும், மூலத்தின் சுருக்கமும் தொடரும் வாக்கியத் தன்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் இணைந்த நடை. வசனம் அடுத்த பட்டியலுக்குத் திறப்பதால் இறுதியில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது. விளக்க இணைப்பு நீளமானாலும் வாசிப்புத் தெளிவுக்காக நீள்கோடுகள் பயன்படுத்தப்பட்டுள்ளன.
