source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יִּמְכְּרֵ֗/ם בְּ/יַד֙ כּוּשַׁ֣ן רִשְׁעָתַ֔יִם מֶ֖לֶךְ אֲרַ֣ם נַהֲרָ֑יִם וַ/יַּעַבְד֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת כּוּשַׁ֥ן רִשְׁעָתַ֖יִם שְׁמֹנֶ֥ה שָׁנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/008.yaml
  text: So the anger of Yahweh burned against Israel[a], and he sold them into the hand of Cushan-rishathaim king of Aram-naharaim[b]. And the sons of Israel served Cushan-rishathaim eight years.
translation:
  language: ta
  text: அதனால் யாவேயின் கோபம் இஸ்ரவேலுக்கு எதிராகப் பற்றி எரிந்தது. அவர் அவர்களை அராம்-நஹராயீமின் அரசனான கூசான்-ரிஷாத்தாயீமின் கையில் விற்றார்[a]. இஸ்ரவேலின் மகன்கள்[b] கூசான்-ரிஷாத்தாயீமுக்குச் எட்டு ஆண்டுகள் சேவை செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மெசொப்பொத்தாமியா.’ எபிரெயத்தில் ‘அராம்-நஹராயீம்’; இது மரபாக ‘இரு நதிகளின் அராம்’ என்று புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: ‘இஸ்ரவேலின் மகன்கள்’ என்பது எபிரெயத்தின் நேரடியான சொற்றொடர்; இங்கு அது இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: கோபம் ... பற்றி எரிந்தது
  rationale: எபிரெய மொழியின் ‘கோபம் எரிதல்’ என்ற உருவகத்தைத் தக்கவைத்து, இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துக் காட்டுகிறது.
- source_word: וַיִּמְכְּרֵם
  choice: அவர்களை ... விற்றார்
  rationale: מכר என்பதன் அடிப்படைப் பொருளான ‘விற்றல்’ என்பதையும், நியாயாதிபதிகள் நூலிலுள்ள உடன்படிக்கைத் தீர்ப்பின் வலிமையான உருவகத்தையும் பாதுகாக்கிறது.
- source_word: בְּיַד
  choice: கையில்
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய உருவகத்தை நேரடியாகத் தக்கவைக்கிறது.
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: கூசான்-ரிஷாதயீம்
  rationale: தனிப்பெயரை மொழிபெயர்க்காமல் தமிழ் எழுத்துகளில் ஒலிபெயர்க்கிறது; இணைப்புக்கோடு இதை ஒரே பெயராக வாசிக்க உதவுகிறது.
- source_word: אֲרַם נַהֲרָיִם
  choice: அராம்-நஹராயிம்
  rationale: ‘மெசொப்பொத்தாமியா’ என்ற விளக்கமான மரபுப் பெயருக்குப் பதிலாக, எபிரெய இடப்பெயரின் வடிவத்தை ஒலிபெயர்க்கிறது.
- source_word: וַיַּעַבְדוּ
  choice: பணிசெய்தார்கள்
  rationale: עבד என்பதன் ‘சேவை செய்தல்/பணிபுரிதல்’ என்ற நேரடிப் பொருளை அளிக்கிறது; இச்சூழலில் அது அரசியல் அடிமைத்தனத்தையும் கீழ்ப்படிதலையும் குறிக்கலாம்.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: ‘இஸ்ரவேலின் மகன்கள்’ என்ற எபிரெய மரபுத்தொடரின் வடிவத்தைப் பாதுகாக்கிறது; இது இங்கு உடன்படிக்கை மக்களைக் கூட்டாகக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: שְׁמֹנֶה שָׁנִים
  choice: எட்டு ஆண்டுகள்
  rationale: கால அளவைக் குறிப்பிடும் சொற்றொடரின் நேரடியான இயல்பான மொழிபெயர்ப்பு.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: בְנֵי יִשְׂרָאֵל என்ற உடன்படிக்கை மக்களைக் குறிக்கும் மரபுத்தொடர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள் / இஸ்ரவேல் மக்கள்
  rationale: மூலத்தின் ஆண்பால் வடிவத்தை முதன்மை உரையில் தக்கவைக்கிறது; அதேவேளை இது இங்கு மக்களினத்தைக் கூட்டாகக் குறிக்கும் பயன்பாடு என்பதை அடிக்குறிப்பில் தெரிவிக்கிறது.
- issue: ‘விற்றார்’ என்ற தெய்வீகத் தீர்ப்பு உருவகம்
  choice: அவர்களை ... கையில் விற்றார்
  alternative: அவர்களை ... வசம் ஒப்புவித்தார்
  rationale: இறைவன் இஸ்ரவேலை ஒடுக்குபவனின் அதிகாரத்திற்கு உட்படுத்தியதைச் சொல்லும் மூல உருவகத்தின் கடுமையையும் இறையியல் பதற்றத்தையும் மென்மைப்படுத்தாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், அதேவேளை கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘கோபம் பற்றி எரிந்தது,’ ‘கையில் விற்றார்’ ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் உள்ளடக்கத்துடன் பொருந்தாத இடங்களில் இருந்ததால், [a] அராம்-நஹராயிமுக்குப் பின்னும் [b] ‘இஸ்ரவேலின் மகன்கள்’ என்பதற்குப் பின்னும் பொருத்தமாக வைக்கப்பட்டுள்ளன.
