revisions:
- from: 'அப்போது இஸ்ரவேலின் மகன்கள் யெகோவாவை நோக்கிக் கூக்குரலிட்டார்கள். யெகோவா அவர்களுக்காக ஒரு விடுவிப்பவரை எழுப்பினார்: அவர் பென்யமீனியனான கேராவின் மகன் ஏகூத்; வலது கை கட்டுப்பட்டிருந்தவர்.[a] இஸ்ரவேலின் மகன்கள் அவர் மூலமாக மோவாபின் அரசனான எக்லோனுக்குக் கப்பம் அனுப்பினார்கள்.'
  to: 'அப்போது இஸ்ரவேலின் மகன்கள் யாவேயை நோக்கிக் கூக்குரலிட்டார்கள். யாவே அவர்களுக்காக ஒரு விடுவிப்பவரை எழுப்பினார்: பென்யமீன் கோத்திரத்தைச் சேர்ந்த கேராவின் மகன் ஏகூத், வலது கையின் பயன்பாடு தடைப்பட்டிருந்த ஒருவர். இஸ்ரவேலின் மகன்கள் அவர் மூலமாக மோவாபின் அரசனான எக்லோனுக்குக் கப்பம் அனுப்பினார்கள்.'
  rationale: The revision aligns the divine name with the required Yahweh rendering, improves the Tamil expression for Ehud’s Benjaminite identity, and clarifies the right-hand idiom without resolving the disputed ambiguity as left-handedness. The footnote preserves the conventional alternative. The footnote anchor [a] should follow ‘வலது கையின் பயன்பாடு தடைப்பட்டிருந்த ஒருவர்.’ in the formatted text.
