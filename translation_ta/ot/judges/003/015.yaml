  text: וַ/יִּזְעֲק֣וּ בְנֵֽי יִשְׂרָאֵל֮ אֶל יְהוָה֒ וַ/יָּקֶם֩ יְהוָ֨ה לָ/הֶ֜ם מוֹשִׁ֗יעַ אֶת אֵה֤וּד בֶּן גֵּרָא֙ בֶּן הַ/יְמִינִ֔י אִ֥ישׁ אִטֵּ֖ר יַד יְמִינ֑/וֹ וַ/יִּשְׁלְח֨וּ בְנֵי יִשְׂרָאֵ֤ל בְּ/יָד/וֹ֙ מִנְחָ֔ה לְ/עֶגְל֖וֹן מֶ֥לֶךְ מוֹאָֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/015.yaml
  text: Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up for them a deliverer, Ehud son of Gera, a Benjaminite, a man hindered in his right hand. And the sons of Israel sent tribute by his hand to Eglon king of Moab.
translation:
  language: ta
  text: 'அப்போது இஸ்ரவேலின் மகன்கள் யாவேயை நோக்கிக் கூக்குரலிட்டார்கள். யாவே அவர்களுக்காக ஒரு விடுவிப்பவரை எழுப்பினார்: பென்யமீன் கோத்திரத்தைச் சேர்ந்த கேராவின் மகன் ஏகூத், வலது கையின் பயன்பாடு தடைப்பட்டிருந்த ஒருவர். இஸ்ரவேலின் மகன்கள் அவர் மூலமாக மோவாபின் அரசனான எக்லோனுக்குக் கப்பம் அனுப்பினார்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: கூக்குரலிட்டார்கள்
  rationale: துன்பத்தில் உதவி நாடி எழுப்பும் அவசரமான கூக்குரலைக் குறிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘உதவிக்காக’ என்ற பொருளைச் சேர்க்கவில்லை.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய மொழியின் சொற்றொடரை வெளிப்படையாகவும் பாலினக் குறிப்பைத் தக்கவைத்தும் வழங்குகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: וַיָּקֶם ... מוֹשִׁיעַ
  choice: ஒரு விடுவிப்பவரை எழுப்பினார்
  rationale: தேவன் நியாயாதிபதியை ஏற்படுத்தி மீட்புப் பணிக்காக நிறுத்தியதைச் சொல்லும் மூல உருவகத்தையும் வரலாற்றுச் சூழலையும் காக்கிறது.
- source_word: אֵהוּד בֶּן גֵּרָא
  choice: கேராவின் மகன் ஏகூத்
  rationale: தனிப்பெயர்களைத் தமிழில் ஒலிபெயர்த்து, இயல்பான தமிழ் உறவுமுறை அமைப்பில் தருகிறது.
- source_word: בֶּן הַיְמִינִי
  choice: பென்யமீனியன்
  rationale: இது கோத்திரச் சேர்ந்ததைக் குறிக்கும் இனப்பெயர்; இயல்பான தமிழில் அந்தப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: אִישׁ אִטֵּר יַד יְמִינוֹ
  choice: வலது கை கட்டுப்பட்டிருந்தவர்
  rationale: வலது கையில் ஏதோ கட்டுப்பாடு அல்லது வரம்பு இருந்ததாகச் சொல்லும் அபூர்வமான எபிரெய மொழியைத் தக்கவைக்கிறது; ‘இடக்கைப் பழக்கமுள்ளவர்’ என்ற பொதுவான விளக்கத்தை நேரடியாக மூலத்தில் ஏற்றவில்லை.
- source_word: וַיִּשְׁלְחוּ ... בְּיָדוֹ
  choice: அவர் மூலமாக ... அனுப்பினார்கள்
  rationale: בְּיָדוֹ என்ற முகமைச் சொற்றொடரின் இயல்பான தமிழ் பொருள்; ஏகூத் கப்பத்தை எடுத்துச் சென்றார் என்பதைக் காட்டுகிறது.
- source_word: מִנְחָה
  choice: கப்பம்
  rationale: இங்கு மேலாதிக்க அரசனுக்குச் செலுத்தப்படும் அரசியல் வரியைக் குறிக்கிறது; ‘காணிக்கை’ என்ற வழிபாட்டுச் சாயலைத் தவிர்க்கிறது.
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: மோவாபின் அரசனான எக்லோனுக்கு
  rationale: பெயர், அரச பட்டம், நாட்டுப் பெயர் ஆகியவற்றை இயல்பான தமிழ் தொடரில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதை ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றாமல் தமிழில் பரவலாக அறியப்பட்ட பெயர் வடிவில் வழங்குகிறது.
- issue: מוֹשִׁיעַ என்பதன் வரலாற்று-இறையியல் நுணுக்கம்
  choice: விடுவிப்பவர்
  alternative: இரட்சகர் / மீட்பவர்
  rationale: இந்தச் சூழலில் மனிதராகிய நியாயாதிபதியின் அரசியல்-இராணுவ விடுதலைப் பணியே முதன்மை; ‘இரட்சகர்’ ஏற்படுத்தக்கூடிய விரிவான இறையியல் அர்த்தத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வலது கை கட்டுப்பட்டிருந்தவர்’ என்ற அபூர்வமான மூலச் சொல்லாக்கம் பிரதான உரையில் காக்கப்பட்டு, வழக்கமான விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
