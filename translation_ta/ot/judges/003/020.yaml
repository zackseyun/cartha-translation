base_translation:
  language: en
  yaml_path: translation/ot/judges/003/020.yaml
  text: Then Ehud came to him while he was sitting alone in his cool roof chamber[a], and Ehud said[c][b], “I have a word from God for you.” So he rose from his seat.
translation:
  language: ta
  text: பின்பு ஏகூத் அவனிடம் வந்தான். அப்போது எக்லோன் தனக்குரிய குளிர்ச்சியான மாடியறையில்[a] தனியாக உட்கார்ந்திருந்தான். ஏகூத் அவனிடம், “உமக்குக் கடவுளிடமிருந்து ஒரு செய்தி[b] இருக்கிறது” என்றான். அப்போது எக்லோன் தன் இருக்கையிலிருந்து[c] எழுந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குளிர்ச்சியான மேலறையில்.”
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “கடவுளிடமிருந்து ஒரு வார்த்தை.”
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், “இருக்கையிலிருந்து”; சூழலைப் பொறுத்து “நாற்காலியிலிருந்து” அல்லது “அரியணையிலிருந்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: வந்தான்
  rationale: வினைச்சொல் ஏகூத் எக்லோனிடம் வந்து சேர்ந்ததைப் பொதுவாகக் குறிக்கிறது; வரும் விதத்தைத் தேவையின்றி குறிப்பாக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: יֹשֵׁב
  choice: உட்கார்ந்திருந்தான்
  rationale: எபிரெயப் பங்கேற்புவினை பின்னணியில் தொடர்ந்துகொண்டிருந்த நிலையைச் சுட்டுகிறது; அதனால் தமிழில் தொடர்நிலை வடிவம் பொருத்தமானது.
- source_word: עֲלִיַּת הַמְּקֵרָה
  choice: குளிர்ச்சியான மாடியறை
  rationale: עֲלִיָּה என்பது மேல்தள அல்லது மாடியறை; הַמְּקֵרָה குளிரூட்டப்பட்ட அல்லது காற்றோட்டமுள்ள அறையைக் குறிக்கலாம். இத்தேர்வு கட்டட அமைப்பையும் குளிர்ச்சியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר לוֹ לְבַדּוֹ
  choice: தனக்குரிய ... தனியாக
  rationale: அறை அவனுக்கென இருந்ததையும் அவன் அங்கே தனியாக இருந்ததையும் எபிரெயச் சொற்றொடர் வலியுறுத்துகிறது; தமிழாக்கம் உடைமை மற்றும் தனிமை ஆகிய இரு நுணுக்கங்களையும் காக்கிறது.
- source_word: דְּבַר אֱלֹהִים
  choice: கடவுளிடமிருந்து ஒரு செய்தி
  rationale: דָּבָר என்பது ‘வார்த்தை’, ‘காரியம்’, அல்லது ‘செய்தி’ எனப் பொருள்படலாம். இச்சூழலில் ‘செய்தி’ இயல்பான நவீனத் தமிழாகவும் தெய்வீகத் தகவல் என்ற கருத்தைத் தெளிவாகவும் தருகிறது; நேரடியான ‘வார்த்தை’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவத்தில் பன்மையாகத் தோன்றினாலும் இச்சொல் எபிரெயத்தில் ஒருமையாகக் கடவுளைக் குறிப்பது வழக்கம்; இக்கட்டமைப்பிலும் சூழலிலும் ஒருமை வாசிப்பே இயல்பானது.
- source_word: וַיָּקָם
  choice: எழுந்தான்
  rationale: இருக்கையிலிருந்து எழுதலைச் சுருக்கமாகவும் கண்ணியமான கதைநடைத் தமிழிலும் தெரிவிக்கிறது.
- source_word: מֵעַל הַכִּסֵּא
  choice: தன் இருக்கையிலிருந்து
  rationale: כִּסֵּא என்பது இருக்கை, நாற்காலி, அல்லது அரியணையைக் குறிக்கலாம். தனியறைச் சூழலில் ‘இருக்கை’ மூலச்சொல்லின் பரப்பைக் காத்து, தேவையற்ற அரசவைப் படிமத்தைச் சேர்க்காது.
theological_decisions:
- issue: ஏகூத்தின் கூற்றிலுள்ள אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: தெய்வங்கள்
  rationale: אֱלֹהִים வடிவத்தில் பன்மை என்றாலும் இச்சொற்றொடரிலும் கதைச் சூழலிலும் ஒருமைப் பொருள் மிக இயல்பானது. ஏகூத்தின் கூற்றை உரை பதிவுசெய்வதற்கும் அப்பால் அதன் நோக்கம் அல்லது இறையியல் விளைவுகளை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எக்லோன் அரசன் என்பது சூழலில் தெரிந்தாலும், இவ்வசனத்தின் தனியறைக் காட்சியில் இல்லாத ‘அரியணை’ என்ற குறிப்பை முதன்மை உரைக்குள் சேர்க்கவில்லை. மரியாதை ஒருமையான ‘உமக்காக’ ஏகூத் அரசனிடம் பேசும் சமூகச் சூழலைப் பிரதிபலிக்கிறது.
