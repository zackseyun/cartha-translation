base_translation:
  language: en
  yaml_path: translation/ot/judges/003/027.yaml
  text: And when he arrived[a], he blew the trumpet in the hill country of Ephraim, and the sons of Israel went down with him from the hill country[b], and he was before them.
translation:
  language: ta
  text: அவன் வந்தபோது, எப்பிராயீமின் மலைநாட்டில் கொம்பை ஊதினான். இஸ்ரவேல் மக்கள் அவனுடன் மலைநாட்டிலிருந்து இறங்கிச் சென்றார்கள்; அவன் அவர்களுக்கு முன்னால் சென்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאוֹ
  choice: அவன் அங்கு வந்தபோது
  rationale: ב + பெயரெச்ச வினை வடிவம் காலத் தொடர்பைக் குறிக்கிறது. தமிழில் இயல்பான கதைநடைக்காக ‘அவன் அங்கு வந்தபோது’ என மொழிபெயர்க்கப்பட்டது; וַיְהִי என்பதைக் கட்டாயமாகத் தனியே மொழிபெயர்க்கவில்லை.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: கொம்பை ஊதினான்
  rationale: שׁוֹפָר என்பது ஊதிச் சமிக்ஞை கொடுக்கும் கொம்பு. ‘கொம்பு’ மூலத்தின் பொருளையும் பண்டைய சூழலையும் இயல்பாகக் காட்டுகிறது.
- source_word: בְּהַר אֶפְרָיִם
  choice: எப்பிராயீமின் மலைநாட்டில்
  rationale: இந்தப் புவியியல் தொடரில் הַר ஒரு தனிமலையை அல்ல, எப்பிராயீமின் மேட்டுப்பாங்கான மலைப்பகுதியைக் குறிக்கிறது.
- source_word: וַיֵּרְדוּ עִמּוֹ בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள் அவனுடன் ... இறங்கி வந்தார்கள்
  rationale: בְנֵי יִשְׂרָאֵל என்பது சொற்படியாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு இஸ்ரவேல் சமூகத்திலிருந்து திரண்ட படையினரைக் குறிக்கும் வழக்குச் சொற்றொடர். நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: מִן הָהָר
  choice: மலைநாட்டிலிருந்து
  rationale: முன்னர் சொல்லப்பட்ட எப்பிராயீமின் மலைநாட்டையே சுட்டுவதால் அதே புவியியல் கருத்து நிலைநிறுத்தப்பட்டது.
- source_word: וְהוּא לִפְנֵיהֶם
  choice: அவன் அவர்களுக்கு முன்னால் சென்றான்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘அவன் அவர்களுக்கு முன் இருந்தான்’ எனினும், நகர்ந்து செல்லும் இந்தச் சூழலில் அவன் அவர்களுக்கு முன்னால் சென்ற நிலையைக் குறிக்கிறது. ‘தலைமை தாங்கினான்’ என்று பொருளை மிகுதியாகத் தீர்மானிக்காமல் இயக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל என்ற பாலினக் குறியுடைய கூட்டுப்பெயர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இது எபிரெயத்தில் நிலையான இன/சமூக அடையாளச் சொற்றொடர். தமிழில் ‘இஸ்ரவேலின் மகன்கள்’ என்பது உயிரியல் மகன்கள் என்ற தவறான எண்ணத்தைத் தரக்கூடும்; ‘இஸ்ரவேல் மக்கள்’ சமூகக் குறியீட்டைப் பாதுகாக்கிறது. சூழலில் போர்வீரர்கள் ஆண்களாக இருந்திருக்கலாம் என்ற சாத்தியத்தை மொழிபெயர்ப்பு தேவையின்றி தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை. எபிரெய வாக்கியத்தின் தொடர்ச்சியான பல ‘וַ’ இணைப்புகளை தமிழின் இயல்புக்கேற்ப இரண்டு வாக்கியங்களாக அமைத்துள்ளது; நிகழ்வுகளின் வரிசை மாறவில்லை.
