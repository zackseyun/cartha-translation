  text: וַ/יָּבֹ֨א גַֽם הַ/נִּצָּ֜ב אַחַ֣ר הַ/לַּ֗הַב וַ/יִּסְגֹּ֤ר הַ/חֵ֨לֶב֙ בְּעַ֣ד הַ/לַּ֔הַב כִּ֣י לֹ֥א שָׁלַ֛ף הַ/חֶ֖רֶב מִ/בִּטְנ֑/וֹ וַ/יֵּצֵ֖א הַֽ/פַּרְשְׁדֹֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/022.yaml
  text: The hilt also went in after the blade[a], and the fat closed over the blade, because he did not pull the sword out of his belly[b]; and the dung came out.
translation:
  language: ta
  text: வாள்ப்பட்டைக்குப் பின்னால் அதன் கைப்பிடியும் உள்ளே சென்றது[a]. அவன் வாளை ஏக்லோனின் வயிற்றிலிருந்து உருவவில்லை; கொழுப்பு வாள்ப்பட்டையைச் சுற்றி மூடிக்கொண்டது. குடல்கழிவும் வெளியே வந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிடி” அல்லது “தண்டு.”
    reason: lexical_alternative
  - marker: b
    text: “குடல்கழிவு” என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் மிகவும் அரிதானது; அது மலம் அல்லது இன்னும் பொதுவாகக் குடலின் உள்ளடக்கம் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּצָּב
  choice: கைப்பிடி
  rationale: வாளின் கத்தியைத் தொடர்ந்து உடலுக்குள் சென்ற பகுதியை இச்சூழலில் குறிக்கிறது. நவீன தமிழில் இயல்பாகப் புரியும் பொதுவான சொல் ‘கைப்பிடி’; ‘பிடியும்’ என்ற சுருக்கமான மாற்றும் சாத்தியம்.
- source_word: הַלַּהַב
  choice: கத்தி
  rationale: இச்சொல் வேறு சூழல்களில் ‘சுடர்’ எனப் பொருள்பட்டாலும், இங்கு வாளின் கூரிய உலோகப் பகுதியைக் குறிக்கிறது. ‘வாளின் கத்தி’ என்பது தமிழில் தெளிவான இணைப்பு.
- source_word: וַיִּסְגֹּר ... בְּעַד
  choice: சுற்றி மூடிக்கொண்டது
  rationale: கொழுப்பு வாளின் கத்தியை மூடி அல்லது சூழ்ந்த உடல்சார் நிகழ்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַחֵלֶב
  choice: கொழுப்பு
  rationale: எபிரெய உரையின் வெளிப்படையான, உடல்சார் விவரத்தை மென்மைப்படுத்தாமல் நேரடியாகக் காக்கிறது.
- source_word: שָׁלַף
  choice: உருவாமல்
  rationale: ஆயுதத்தை உறையிலிருந்தோ உடலிலிருந்தோ வெளியே இழுப்பதற்கு தமிழில் வழக்கமான வினை ‘உருவுதல்’; இங்கு எதிர்மறை வினையெச்சமாக இயல்பாக அமைகிறது.
- source_word: מִבִּטְנוֹ
  choice: ஏக்லோனின் வயிற்றிலிருந்து
  rationale: ‘வயிறு’ என்பது בטן என்பதன் நேரடியான, இயல்பான பொருள். எபிரெயில் உள்ள ஆண்பால் சுட்டுப்பெயர் யாரைக் குறிக்கிறது என்ற குழப்பத்தைத் தமிழில் தவிர்க்க, கதையின் சூழலின்படி ஏக்லோனின் பெயர் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: הַפַּרְשְׁדֹנָה
  choice: குடலின் கழிவு
  rationale: மிக அரிதான இச்சொல் பொதுவாக மலம் அல்லது குடலின் உள்ளடக்கம் வெளியேறியதைக் குறிக்கும் எனப் புரிந்துகொள்ளப்படுகிறது. ‘குடலின் கழிவு’ அருவருப்பை மறைக்காமல், சொல்லின் பரந்த சாத்தியத்தையும் தக்கவைக்கிறது.
- source_word: וַיֵּצֵא
  choice: வெளியே வந்தது
  rationale: எளிய நிகழ்வுரைக் கூறை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: גַם
  choice: -உம்
  rationale: கத்தி மட்டுமல்ல, கைப்பிடியும் உள்ளே சென்றது என்ற சேர்க்கை வலியுறுத்தலைத் தமிழ் இணைப்பிடைச்சொல் இயல்பாக வெளிப்படுத்துகிறது.
