  text: וַ/יַּקְרֵב֙ אֶת הַ/מִּנְחָ֔ה לְ/עֶגְל֖וֹן מֶ֣לֶךְ מוֹאָ֑ב וְ/עֶגְל֕וֹן אִ֥ישׁ בָּרִ֖יא מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/017.yaml
  text: He presented the tribute to Eglon king of Moab[a]. Now Eglon was a very fat man.
translation:
  language: ta
  text: அவன் மோவாபின் அரசன் எக்லோனிடம் கப்பத்தைக்[a] கொண்டுபோய்க் கொடுத்தான். எக்லோன் மிகவும் பருத்த மனிதனாக இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசை” அல்லது “காணிக்கையை.” எபிரெய மொழியிலுள்ள மின்கா என்ற சொல் காணிக்கை அல்லது பரிசைக் குறிக்கலாம்; இங்கு அடிமைப்படுத்தப்பட்ட மக்கள் ஓர் அரசனுக்குச் செலுத்திய கப்பத்தையே பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: கொண்டுபோய்க் கொடுத்தான்
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் இங்கு மேலதிகாரியிடம் ஒன்றைக் கொண்டுவந்து சமர்ப்பிப்பதைக் குறிக்கிறது. அரசவைக் சூழலில் இயல்பாகவும் தெளிவாகவும் இருக்க இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַמִּנְחָה
  choice: கப்பத்தை
  rationale: מִנְחָה என்பது காணிக்கை அல்லது பரிசைக் குறிக்கக்கூடியது; ஆனால் இப்பகுதியில் அடிமைப்படுத்தப்பட்ட மக்கள் அந்நிய அரசனுக்குச் செலுத்தும் அரசியல் கப்பமே சூழலுக்குப் பொருத்தமான பொருள்.
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: மோவாபின் அரசன் எக்லோனிடம்
  rationale: பெயரையும் பட்டத்தையும் நவீனத் தமிழில் இயல்பான முறையில் அமைத்து, לְ என்பதன் பெறுநர் பொருளை ‘இடம்’ உருபால் வெளிப்படுத்துகிறது.
- source_word: אִישׁ בָּרִיא
  choice: பருத்த மனிதன்
  rationale: בָּרִיא இங்கு உடல் பருமனைக் குறிக்கிறது; பின்னர் வரும் நிகழ்வுகளுக்கும் இது தொடர்புடையதால் பொருளை மென்மைப்படுத்தாமல் நேரடியாக மொழிபெயர்க்கப்பட்டது. אִישׁ குறிப்பிட்ட ஆண் நபரைக் குறிக்கிறது.
- source_word: מְאֹד
  choice: மிகவும்
  rationale: எபிரெயச் சொல்லின் வலியுறுத்தலை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: וְעֶגְלוֹן
  choice: எக்லோன்
  rationale: வாவ் இங்கு எக்லோனைப் பற்றிய பின்னணிக் குறிப்பை அறிமுகப்படுத்துகிறது. தனியான தமிழ் வாக்கிய அமைப்பே அந்த உரையாடல் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
