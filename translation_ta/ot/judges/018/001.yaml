base_translation:
  language: en
  yaml_path: translation/ot/judges/018/001.yaml
  text: In those days there was no king in Israel[a]. And in those days the tribe of the Danites was seeking for itself an inheritance to dwell in[b], because up to that day no inheritance had fallen to it among the tribes of Israel.
translation:
  language: ta
  text: அந்நாட்களில் இஸ்ரவேலில் அரசன் இல்லை. அந்நாட்களில் தாண் கோத்திரம்[a] குடியிருப்பதற்கு தனக்கென ஒரு மரபுரிமை நிலப்பங்கைத் தேடிக்கொண்டிருந்தது. ஏனெனில், அந்த நாள்வரை இஸ்ரவேலின் கோத்திரங்களுக்குள் அதற்கு மரபுரிமை நிலப்பங்கு கிடைத்திருக்கவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தாணியரின் கோத்திரம்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரேய மொழியில், ‘அதற்கு மரபுரிமை நிலப்பங்கு விழுந்திருக்கவில்லை’; இது கோத்திர நிலம் பங்கிட்டுக் கொடுக்கப்படுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில் அரசன் இல்லை
  rationale: எபிரேய existential negation-ஐ இயல்பான தமிழில் நேரடியாகத் தருகிறது; முடியாட்சியை ஆதரிக்கிறதா கண்டிக்கிறதா என்ற விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- source_word: שֵׁבֶט הַדָּנִי
  choice: தாணியரின் கோத்திரம்
  rationale: தாணின் வழிவந்த மக்களைக் குறிக்கும் கூட்டு இனப்பெயரையும் ‘கோத்திரம்’ என்ற ஒருமைத் தலைச்சொல்லையும் காக்கிறது.
- source_word: מְבַקֶּשׁ ל֤וֹ
  choice: தான் ... தேடிக்கொண்டிருந்தது
  rationale: பங்கேற்புவினையின் தொடர்ச்சியான செயற்பாட்டை ‘தேடிக்கொண்டிருந்தது’ காட்டுகிறது; לוֹ என்பதன் தற்சுட்டுப் பொருளை ‘தான்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נַחֲלָה
  choice: சுதந்தர நிலப்பங்கு
  rationale: இச்சூழலில் சொல் பொதுவான சொத்தைக் காட்டாமல், கோத்திரத்துக்குப் பங்கிடப்பட்டு உரிமையாகக் கிடைக்கும் நிலத்தைக் குறிக்கிறது. ‘நிலப்பங்கு’ பொருளைத் தெளிவாக்க, ‘சுதந்தர’ அதன் வழிவழி உரிமை நுணுக்கத்தைக் காக்கிறது.
- source_word: לָשֶׁבֶת
  choice: குடியிருப்பதற்கான
  rationale: நிலத்தில் வாழ்வதையும் அங்கே குடியேறுவதையும் உள்ளடக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: כִּי לֹא נָפְלָה לוֹ ... בְּנַחֲלָה
  choice: ஏனெனில் ... அதற்குச் சுதந்தர நிலப்பங்கு கிடைத்திருக்கவில்லை
  rationale: நிலப்பங்கீட்டில் பங்கு ‘விழுதல்’ என்ற எபிரேய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் ‘கிடைத்திருக்கவில்லை’ எனத் தருகிறது; மூல உருவகம் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
- source_word: עַד הַיּוֹם הַהוּא
  choice: அந்த நாள்வரை
  rationale: கதைசொல்லியின் பின்னோக்குப் பார்வையையும் கால எல்லையையும் சுருக்கமாகக் காக்கிறது.
- source_word: בְּתוֹךְ שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கோத்திரங்களுக்குள்
  rationale: கோத்திரங்களின் நடுவே அல்லது அவற்றில் ஒன்றாகப் பங்கு பெறும் சூழலை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: “இஸ்ரவேலில் அரசன் இல்லை” என்ற கதைசார் கூற்று
  choice: வரலாற்று-அரசியல் கூற்றாக மட்டும் நேரடியாக வைக்கப்பட்டது.
  alternative: நியாயாதிபதிகளின் காலத்தை வெளிப்படையாகக் கண்டிக்கும் கூற்றாக விரிவுபடுத்துதல் அல்லது முற்றிலும் பொருளற்ற காலக்குறிப்பாக மாற்றுதல்.
  rationale: மூலவசனம் அரசன் இல்லாமையைச் சொல்கிறது; முடியாட்சிக்கான இறையியல் ஆதரவையோ எதிர்ப்பையோ வெளிப்படையாகச் சேர்ப்பதில்லை. ஆகவே அதன் இறையியல் பதற்றம் தீர்க்கப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘அரசன்’, ‘கோத்திரம்’, ‘சுதந்தர நிலப்பங்கு’ ஆகிய சொற்கள் வேதாகமச் சூழலின் வரலாற்று மற்றும் நிலப்பங்கீட்டு நுணுக்கத்தைத் தக்கவைத்துள்ளன; மிகப் பழமையான வாக்கிய அமைப்புகள் தவிர்க்கப்பட்டுள்ளன.
