  source_fidelity: மூலத்தின் இருமுறை வரும் காலச்சுட்டி, இஸ்ரவேலில் அரசன் இல்லாமை, தாண் கோத்திரம் தனக்காக குடியேறத்தக்க மரபுரிமை நிலப்பங்கைத் தேடிய தொடர்ச்சிச் செயல், மற்றும் அந்நாள்வரை நிலப்பங்கு கிடைக்காததற்கான காரணம் ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் ‘சுதந்தர நிலப்பங்கு’ நவீனத் தமிழில் சுதந்திரம்/தன்னாட்சி என்ற பொருளைத் தூண்டக்கூடியதால், נַחֲלָה-வின் மரபுரிமை நில-ஒதுக்கீட்டுப் பொருளைத் தெளிவாகத் தரும் சொல் தேவைப்படுகிறது.
