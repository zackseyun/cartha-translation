  text: וַ/יִּשְׁלְח֣וּ בְנֵי דָ֣ן מִֽ/מִּשְׁפַּחְתָּ֡/ם חֲמִשָּׁ֣ה אֲנָשִׁ֣ים מִ/קְצוֹתָ/ם֩ אֲנָשִׁ֨ים בְּנֵי חַ֜יִל מִ/צָּרְעָ֣ה וּ/מֵֽ/אֶשְׁתָּאֹ֗ל לְ/רַגֵּ֤ל אֶת הָ/אָ֨רֶץ֙ וּ/לְ/חָקְרָ֔/הּ וַ/יֹּאמְר֣וּ אֲלֵ/הֶ֔ם לְכ֖וּ חִקְר֣וּ אֶת הָ/אָ֑רֶץ וַ/יָּבֹ֤אוּ הַר אֶפְרַ֨יִם֙ עַד בֵּ֣ית מִיכָ֔ה וַ/יָּלִ֖ינוּ שָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/002.yaml
  text: So the sons of Dan sent five men from their clan[a], from among their whole number, valiant men from Zorah and from Eshtaol, to spy out the land and to explore it. And they said to them, “Go, explore the land.” So they came to the hill country of Ephraim, as far as the house of Micah[c][b], and spent the night there.
translation:
  language: ta
  text: ஆகவே, தாணின் மகன்கள் தங்கள் குலத்தைச் சேர்ந்தவர்களுள் இருந்து, சோராவிலிருந்தும் எஸ்தாவோலிலிருந்தும் வந்த திறமைவாய்ந்த ஐந்து ஆண்களை நாட்டை வேவுபார்த்து ஆராயும்படி அனுப்பினார்கள். அவர்களிடம், “போய், நாட்டை ஆராயுங்கள்” என்று சொன்னார்கள். அவர்கள் எப்பிராயீமின் மலைநாட்டுக்கு வந்து, மீகாவின் வீட்டுவரை சென்று, அங்கே இரவைக் கழித்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי דָן
  choice: தாணின் மகன்கள்
  rationale: எபிரெயக் குலமரபுச் சொல்லமைப்பை இயல்பான தமிழில் நேரடியாகப் பேணுகிறது.
- source_word: מִמִּשְׁפַּחְתָּם ... מִקְצוֹתָם
  choice: தங்கள் குலத்திலிருந்து ஐந்து பேரைத் தேர்ந்தெடுத்து
  rationale: מִשְׁפָּחָה என்பதன் குல அளவையும், מִקְצוֹתָם என்பதன் குழுவிலிருந்து சிலரை எடுத்தல் என்ற பகுதிப்பொருளையும் இயல்பாக வெளிப்படுத்துகிறது; 'முழு எண்ணிக்கையிலிருந்து' போன்ற செயற்கையான மொழியைத் தவிர்க்கிறது.
- source_word: אֲנָשִׁים בְּנֵי חַיִל
  choice: திறமைவாய்ந்த ஆண்கள்
  rationale: இந்த வேவுப்பணி சூழலில் வலிமை, தகுதி, செயல்திறன் ஆகியவற்றைக் குறிக்கிறது; போர் வீரத்தையே மட்டும் வலியுறுத்துவதில்லை.
- source_word: מִצָּרְעָה וּמֵאֶשְׁתָּאֹל
  choice: சோராவையும் எஸ்தாவோலையும் சேர்ந்த
  rationale: இடப்பெயர்களைத் தமிழில் ஒலிபெயர்த்து, இரு ஊர்களுடனான தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: לְרַגֵּל
  choice: வேவுபார்த்து
  rationale: மறைவாக அல்லது நோக்கமுடன் நிலத்தை உளவறியும் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וּלְחָקְרָהּ / חִקְרוּ
  choice: ஆராய்வதற்காக / ஆராயுங்கள்
  rationale: חקר வேரின் கவனமாக விசாரித்து அறிதல் என்ற பொருளை இரு இடங்களிலும் ஒரே சொல்லால் பேணுகிறது.
- source_word: הַר אֶפְרַיִם
  choice: எப்பிராயீமின் மலைநாடு
  rationale: ஒரே மலையைக் காட்டாமல் எப்பிராயீமின் மேட்டுநிலப் பகுதியைக் குறிக்கிறது.
- source_word: עַד בֵּית מִיכָה
  choice: மீகாவின் வீட்டுவரை
  rationale: עַד என்பதன் எல்லை அல்லது சென்றடைந்த அளவைப் பேணுகிறது; 'வீடு' குடும்பக் குடியிருப்பு வளாகத்தையும் குறிக்கக்கூடும்.
- source_word: וַיָּלִינוּ שָׁם
  choice: அங்கே இரவைக் கழித்தார்கள்
  rationale: அங்கே தங்கி இரவைக் கடந்தார்கள் என்ற பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
