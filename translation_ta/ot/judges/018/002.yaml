revisions:
- from: ஆகவே, தாணின் மகன்கள் தங்கள் குலத்திலிருந்து ஐந்து பேரைத் தேர்ந்தெடுத்து அனுப்பினார்கள். அவர்கள் சோராவையும் எஸ்தாவோலையும் சேர்ந்த, திறமைவாய்ந்த ஆண்கள்[a]. நாட்டை வேவுபார்த்து அதை ஆராய்வதற்காக அவர்களை அனுப்பி, “போய், நாட்டை ஆராயுங்கள்” என்று சொன்னார்கள். அவர்கள் எப்பிராயீமின் மலைநாட்டிலுள்ள மீகாவின் வீட்டுவரை[b] வந்து, அங்கே இரவைக் கழித்தார்கள்.
  to: ஆகவே, தாணின் மகன்கள் தங்கள் குலத்தைச் சேர்ந்தவர்களுள் இருந்து, சோராவிலிருந்தும் எஸ்தாவோலிலிருந்தும் வந்த திறமைவாய்ந்த ஐந்து ஆண்களை நாட்டை வேவுபார்த்து ஆராயும்படி அனுப்பினார்கள். அவர்களிடம், “போய், நாட்டை ஆராயுங்கள்” என்று சொன்னார்கள். அவர்கள் எப்பிராயீமின் மலைநாட்டுக்கு வந்து, மீகாவின் வீட்டுவரை சென்று, அங்கே இரவைக் கழித்தார்கள்.
  rationale: 'The revision removes the unexpressed ‘selecting,’ restores the direct relation between the sending and its two stated purposes, and renders the men’s origin with the Hebrew’s repeated ‘from.’ It also retains a restrained partitive rendering for the debated expression מִקְצוֹתָם, without introducing ‘whole number’ or a literal geographic sense not securely demanded by the context. Footnote anchors are retained: [a] follows “திறமைவாய்ந்த ஆண்கள்,” and [b] follows “மீகாவின் வீட்டுவரை.”'
