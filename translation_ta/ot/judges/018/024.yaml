- from: அவன்[a], “நான் செய்த என் தெய்வங்களையும் ஆசாரியனையும் நீங்கள் எடுத்துக்கொண்டு போய்விட்டீர்கள். இப்போது என்னிடம் வேறு என்ன இருக்கிறது? அப்படியிருக்க, ‘உனக்கு என்ன?’ என்று என்னிடம் எப்படிக் கேட்கிறீர்கள்?” என்றான்.
  to: அவன், “நான் செய்த என் தெய்வங்களையும்[a] ஆசாரியனையும் நீங்கள் எடுத்துக்கொண்டு போய்விட்டீர்கள். இப்போது என்னிடம் வேறு என்ன இருக்கிறது? அப்படியிருக்க, ‘உனக்கு என்ன ஆயிற்று?’ என்று என்னிடம் எப்படிச் சொல்கிறீர்கள்?” என்றான்.
  rationale: அடிக்குறி அதன் உரிய சொல்லான ‘தெய்வங்கள்’ என்பதோடு இணைக்கப்பட்டது. மேலும், மூலத்தின் ‘நீங்கள் என்னிடம் இப்படிச் சொல்வது என்ன?’ என்ற எதிர்ப்பைத் தக்கவைக்க ‘கேட்கிறீர்கள்’ என்பதற்குப் பதிலாக ‘சொல்கிறீர்கள்’ பயன்படுத்தப்பட்டது. இறுதி மேற்கோள் கேள்வி நவீன தமிழில் தெளிவாக அமைய ‘உனக்கு என்ன ஆயிற்று?’ எனத் திருத்தப்பட்டது; இது பொருளை விரிவாக்காமல் எபிரெய வழக்குத் தொடரின் நோக்கத்தை வெளிப்படுத்துகிறது.
