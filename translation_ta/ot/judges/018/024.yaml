source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר אֶת אֱלֹהַ/י֩ אֲשֶׁר עָשִׂ֨יתִי לְקַחְתֶּ֧ם וְֽ/אֶת הַ/כֹּהֵ֛ן וַ/תֵּלְכ֖וּ וּ/מַה לִּ֣/י ע֑וֹד וּ/מַה זֶּ֛ה תֹּאמְר֥וּ אֵלַ֖/י מַה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/024.yaml
  text: He said[a], “You have taken my gods that I made, and the priest, and you have gone away. What do I have left now? So how can you say to me, ‘What is the matter with you?’”
translation:
  language: ta
  text: அவன், “நான் செய்த என் தெய்வங்களையும்[a] ஆசாரியனையும் நீங்கள் எடுத்துக்கொண்டு போய்விட்டீர்கள். இப்போது என்னிடம் வேறு என்ன இருக்கிறது? அப்படியிருக்க, ‘உனக்கு என்ன ஆயிற்று?’ என்று என்னிடம் எப்படிச் சொல்கிறீர்கள்?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் தெய்வம்” அல்லது “என் தெய்வ உருவங்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சில சூழல்களில் ஒருமையாகவோ பன்மையாகவோ அமையலாம்; இங்கே விரிந்த சூழல் “என் தெய்வங்கள்” என்பதையே ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: என் தெய்வங்கள்
  rationale: இச்சொல் சில சூழல்களில் ஒருமையையோ பன்மையையையோ குறிக்கலாம். ஆனால் மீகாவின் வீட்டிலிருந்த செதுக்கப்பட்ட உருவம் உள்ளிட்ட வழிபாட்டுப் பொருட்களைப் பற்றிய விரிந்த சூழல் இங்கே பன்மையை ஆதரிக்கிறது. ‘தெய்வங்கள்’ என்பது மூலச்சொல்லின் இறையியல் பதற்றத்தையும் மனிதன் செய்த தெய்வங்கள் என்ற கதைநடையின் முரணையும் காக்கிறது.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: நான் செய்த
  rationale: עשה என்பதன் இயல்பான பொருளை நேரடியாகத் தருகிறது; மீகா இந்தத் தெய்வங்களைச் செய்தான் அல்லது செய்வித்தான் என்ற உரையின் வலிமையைத் தக்கவைக்கிறது.
- source_word: לְקַחְתֶּם ... וַתֵּלְכוּ
  choice: நீங்கள் எடுத்துக்கொண்டு போய்விட்டீர்கள்
  rationale: இரண்டு வினைகளையும் இயல்பான தமிழில் ஒருங்கிணைத்து, அவர்கள் எடுத்துச் சென்றதும் இப்போது அவை அவனிடம் இல்லாததும் ஆகிய தொடரும் விளைவை வெளிப்படுத்துகிறது; இரண்டாம் நபர் பன்மையும் காக்கப்படுகிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: தமிழ் வேதாகம நடையில் பரவலாகப் புரிந்துகொள்ளப்படும் பதம்; எபிரெய definite article-ன் குறிப்பிட்ட தன்மை சூழலால் தெளிவாகிறது.
- source_word: וּמַה לִּי עוֹד
  choice: இப்போது என்னிடம் வேறு என்ன இருக்கிறது?
  rationale: இழப்பையும் எதுவும் மீதியில்லை என்ற புலம்பலையும் இயல்பான நவீன தமிழில் தருகிறது; עוֹד என்பதற்கு ‘வேறு’ என்றும் சூழ்நிலை நேரத்துக்கு ‘இப்போது’ என்றும் இடமளிக்கிறது.
- source_word: וּמַה זֶּה תֹּאמְרוּ אֵלַי
  choice: அப்படியிருக்க ... என்று என்னிடம் எப்படிக் கேட்கிறீர்கள்?
  rationale: சொல்லுக்குச் சொல் அமைப்பைத் திணிக்காமல், முந்தைய குற்றச்சாட்டிலிருந்து எழும் கோபமும் ‘இப்படி நீங்கள் எப்படிச் சொல்லலாம்?’ என்ற எதிர்ப்பும் காக்கப்படுகின்றன.
- source_word: מַה לָּךְ
  choice: உனக்கு என்ன?
  rationale: சுருக்கமான எபிரெய வழக்கைச் சுருக்கமான இயல்பான தமிழில் தருகிறது; சூழலில் ‘என்ன பிரச்சினை?’ என்ற பொருள் தெளிவாக உள்ளது.
theological_decisions:
- issue: வீட்டு வழிபாட்டுப் பொருட்களின் சூழலில் אֱלֹהַי என்பதன் மொழிபெயர்ப்பு
  choice: என் தெய்வங்கள்
  alternative: என் தெய்வம்/தெய்வங்கள்; என் தெய்வ உருவங்கள்; என் சிலைகள்
  rationale: மூலச்சொல் ‘தெய்வம்/தெய்வங்கள்’ என்பதே; சூழல் பன்மையான உருவங்களைச் சுட்டுகிறது. பிரதான உரையில் ‘சிலைகள்’ என்று விளக்கமாக மாற்றாமல் இருப்பது மூலத்தின் சொல்லாட்சியையும், மனிதனால் செய்யப்பட்ட ‘தெய்வங்கள்’ என்ற திட்டமிட்ட கதைநடை முரணையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் சாதாரண வாசகர்களுக்குப் புரியும் நேரடி பேச்சு நடை பயன்படுத்தப்பட்டுள்ளது. மீகாவின் அதிர்ச்சியும் கோபமும் கேள்விகளின் இயல்பான தமிழாக்கத்தில் காக்கப்பட்டுள்ளன.
