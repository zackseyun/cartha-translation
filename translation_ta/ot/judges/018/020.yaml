translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரெய மொழியின் இதய உருவகம் ‘உள்ளம் மகிழ்ந்தது’ என்று தக்கவைக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் [a] குறி தவறாக ‘மகிழ்ந்தது’ என்பதற்குப் பின் இருந்தாலும், அதன் அடிக்குறிப்பு தெராப்பீம்களைக் குறிப்பதால் தமிழில் உரிய சொல்லுக்குப் பின் அமைக்கப்பட்டுள்ளது.
