  text: וַ/יִּיטַב֙ לֵ֣ב הַ/כֹּהֵ֔ן וַ/יִּקַּח֙ אֶת הָ֣/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/פָּ֑סֶל וַ/יָּבֹ֖א בְּ/קֶ֥רֶב הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/020.yaml
  text: And the priest’s heart was glad[a], and he took the ephod, the household idols, and the carved image[b], and went into the midst of the people.
translation:
  language: ta
  text: ஆசாரியனின் உள்ளம் மகிழ்ந்தது. அவன் ஏபோத்தையும், வீட்டுத் தெய்வச் சிலைகளையும்[a], செதுக்கப்பட்ட உருவத்தையும்[b] எடுத்துக்கொண்டு மக்களின் நடுவே சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தெராப்பீம்களையும்.’ இந்த எபிரெயச் சொல் வீட்டில் வைக்கப்பட்ட வழிபாட்டுப் பொருட்களை அல்லது வீட்டுத் தெய்வங்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘சிலையையும்’ அல்லது ‘செதுக்கப்பட்ட விக்கிரகத்தையும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב לֵב הַכֹּהֵן
  choice: ஆசாரியனின் உள்ளம் மகிழ்ந்தது
  rationale: எபிரெய மொழியின் ‘ஆசாரியனின் இதயம் நல்லதாக/மகிழ்ச்சியாக ஆனது’ என்ற சொல்லாட்சியின் உருவகத்தை இயல்பான நவீனத் தமிழில் காக்கிறது; ‘ஆசாரியன் மகிழ்ந்தான்’ என்பதும் பொருத்தமான மாற்று.
- source_word: הָאֵפוֹד
  choice: ஏபோத்
  rationale: வழிபாட்டுடன் தொடர்புடைய தொழில்நுட்பச் சொல் என்பதால், தெளிவற்ற விளக்கத்தைச் சேர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַתְּרָפִים
  choice: வீட்டுத் தெய்வச் சிலைகள்
  rationale: வீட்டில் வைக்கப்பட்ட வழிபாட்டுப் பொருட்கள் அல்லது வீட்டுத் தெய்வங்களைக் குறிக்கும் சொல்லின் பொருளை வாசகருக்குத் தெளிவாகக் கூறுகிறது; மூலச்சொல்லும் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַפָּסֶל
  choice: செதுக்கப்பட்ட உருவம்
  rationale: செதுக்கி உருவாக்கப்பட்ட வழிபாட்டு உருவம் என்ற சொல்லின் வடிவச்சார்ந்த நுணுக்கத்தைப் பாதுகாக்கிறது; ‘சிலை’ அல்லது ‘விக்கிரகம்’ என்பவை சாத்தியமான மாற்றுகள்.
- source_word: בְּקֶרֶב הָעָם
  choice: மக்களின் நடுவே
  rationale: ‘மக்களிடையே/மக்களின் நடுவில்’ என்ற இடப்பொருளையும், அங்கு சென்ற இயக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
