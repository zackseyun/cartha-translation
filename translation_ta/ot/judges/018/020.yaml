  source_fidelity: 'மூல எபிரெய உரையின் வரிசையும் பொருளும் நன்றாகக் காக்கப்பட்டுள்ளன: ஆசாரியனின் மகிழ்ச்சி, ஏபோத், தெராப்பீம்கள் (பன்மை), செதுக்கப்பட்ட உருவம், மற்றும் மக்களின் நடுவே அவன் சென்றது ஆகிய அனைத்தும் இடம்பெறுகின்றன. “மக்களின் நடுவே சென்றான்” என்பது בְּקֶרֶב הָעָם என்பதன் இயக்கத்தையும் இடப்பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.'
