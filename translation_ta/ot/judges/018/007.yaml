- from: அந்த ஐந்து ஆண்களும் புறப்பட்டு லாயீசுக்கு வந்து, அங்கு வாழ்ந்த மக்களைப் பார்த்தார்கள். அந்த மக்கள் சீதோனியர்களின் வழக்கத்தின்படி அமைதியாகவும் பாதுகாப்பாகவும் நிம்மதியுடன் வாழ்ந்தார்கள். அந்நாட்டில் எந்தக் காரியத்திலும் அவர்களை அவமானப்படுத்தி அதிகாரம் செலுத்துபவர் எவரும் இல்லை.[a] அவர்கள் சீதோனியர்களிடமிருந்து வெகுதொலைவில் இருந்தார்கள்; வேறு எவருடனும் அவர்களுக்குத் தொடர்பு இல்லை.[b]
  to: அந்த ஐந்து பேரும் புறப்பட்டு லாயீசுக்கு வந்து, அங்கு வாழ்ந்த மக்களைப் பார்த்தார்கள். அந்த மக்கள் சீதோனியர்களின் வழக்கத்தின்படி அமைதியாகவும் பாதுகாப்பாகவும் நிம்மதியுடன் வாழ்ந்தார்கள். அந்நாட்டில், எந்த வகையிலும் அவர்களை இழிவுபடுத்தக்கூடிய அதிகாரமுள்ள எவரும் இல்லை.[a] அவர்கள் சீதோனியர்களிடமிருந்து வெகுதொலைவில் இருந்தார்கள்; எவருடனும் அவர்களுக்குத் தொடர்பு இல்லை.[b]
  rationale: மூலத்தின் மூன்று மடங்கு பாதுகாப்பு வலியுறுத்தலைக் காத்தபடி, கடினமான மַכְלִים דָּבָר / יוֹרֵשׁ עֶצֶר தொடரின் பொருளைத் தமிழில் இயல்பாக அமைத்தோம். அதன் உறுதியற்ற தன்மை அடிக்குறிப்பில் வெளிப்படையாகத் தக்கவைக்கப்பட்டுள்ளது. மூலத்தில் இல்லாத ‘வேறு’ நீக்கப்பட்டுள்ளது.
