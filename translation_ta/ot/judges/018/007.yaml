  source_fidelity: லாயீசு, சீதோனியர் வழக்கம், அவர்களின் பாதுகாப்பான/அச்சமற்ற நிலை, சீதோனிலிருந்து தொலைவு ஆகியவை மூலத்துடன் நன்றாக ஒத்துள்ளன. ஆனால் கடினமான எபிரெயத் தொடரில் தமிழ்ச் சொற்றொடர் அதிகாரம் செலுத்துதலைத் தனி வினையாகக் காட்டுகிறது; ‘அதிகாரமுள்ள’ ஒருவன் அவர்களை இழிவுபடுத்தவில்லை என்ற சாத்தியமான பொருளைத் தெளிவாகவும், அடிக்குறிப்பில் நிச்சயமின்மையுடனும் தருவது பாதுகாப்பானது. இறுதி வாக்கியத்தில் ‘வேறு’ என்பது மூலத்தில் இல்லாத விலக்கு/முரண்பாட்டைத் தோற்றுவிக்கிறது.
