base_translation:
  language: en
  yaml_path: translation/ot/judges/018/007.yaml
  text: Then the five men went and came to Laish[a], and they saw the people who were in it, dwelling securely, according to the custom of the Sidonians, quiet and secure. And there was no one in the land to humiliate them in anything, possessing authority; and they were far from the Sidonians[c][b], and they had no dealings with anyone.
translation:
  language: ta
  text: அந்த ஐந்து பேரும் புறப்பட்டு லாயீசுக்கு வந்து, அங்கு வாழ்ந்த மக்களைப் பார்த்தார்கள். அந்த மக்கள் சீதோனியர்களின் வழக்கத்தின்படி அமைதியாகவும் பாதுகாப்பாகவும் நிம்மதியுடன் வாழ்ந்தார்கள். அந்நாட்டில், எந்த வகையிலும் அவர்களை இழிவுபடுத்தக்கூடிய அதிகாரமுள்ள எவரும் இல்லை.[a] அவர்கள் சீதோனியர்களிடமிருந்து வெகுதொலைவில் இருந்தார்கள்; எவருடனும் அவர்களுக்குத் தொடர்பு இல்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இப்பகுதியின் எபிரெய வாசகம் கடினமானது. சொற்சொல் அமைப்பு, “நாட்டில் எந்தக் காரியத்தையும் இழிவுபடுத்துகிற, அதிகாரத்தை உடைய எவரும் இல்லை” என்பதற்கு ஒத்துள்ளது. அவர்களை இழிவுபடுத்தவோ அடக்கி ஆளவோ ஆட்சியாளர் அல்லது ஒடுக்குபவர் எவரும் இல்லை என்பதே சாத்தியமான பொருள்.
    reason: lexical_alternative
  - marker: b
    text: “தொடர்பு இல்லை” என்பதை “எந்த உறவும் இல்லை” அல்லது “எந்தக் கூட்டுறவும் இல்லை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָיְשָׁה
  choice: லாயீசுக்கு
  rationale: இச்சூழலில் வரும் இடப்பெயரைத் தமிழில் ஒலிபெயர்த்து, இலக்கு வேற்றுமை உருபுடன் வழங்குகிறது.
- source_word: יוֹשֶׁבֶת לָבֶטַח
  choice: பாதுகாப்பாக ... வாழ்ந்தார்கள்
  rationale: தொடர்ந்து நிலவிய பாதுகாப்பான வாழ்க்கையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: כְּמִשְׁפַּט צִדֹנִים
  choice: சீதோனியர்களின் வழக்கத்தின்படி
  rationale: מִשְׁפָּט இங்கு நீதித்தீர்ப்பை அல்ல, ஒரு மக்களின் வழக்கமான சமூக வாழ்க்கை முறையைக் குறிக்கிறது.
- source_word: שֹׁקֵט וּבֹטֵחַ
  choice: அமைதியாகவும் பாதுகாப்பாகவும் நிம்மதியுடன்
  rationale: இரு எபிரெயச் சொற்களும் தடையின்மை, அச்சமின்மை, நம்பிக்கையான நிலை ஆகியவற்றைச் சேர்த்துக் கூறுகின்றன; தமிழில் அவற்றின் கூட்டு வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: מַכְלִים דָּבָר
  choice: எந்தக் காரியத்திலும் அவர்களை அவமானப்படுத்தி
  rationale: כלם என்பதன் Hiphil வடிவம் அவமானம் அல்லது இழிவு ஏற்படுத்துவதைச் சுட்டுகிறது; דָּבָר இங்கு பொதுவாக ‘எந்தக் காரியத்திலும்’ என வழங்கப்படுகிறது.
- source_word: יוֹרֵשׁ עֶצֶר
  choice: அதிகாரம் செலுத்துபவர்
  rationale: மிகக் கடினமான இத்தொடர், சூழலில் கட்டுப்படுத்தும் ஆட்சியாளர் அல்லது ஆதிக்கம் செலுத்துபவரைக் குறிப்பதாகத் தோன்றுகிறது; குறிப்பிட்ட மறுகட்டமைப்பைத் திணிக்காமல் செயல்பாட்டு பொருளை வழங்குகிறது.
- source_word: וּרְחֹקִים הֵמָּה מִצִּדֹנִים
  choice: அவர்கள் சீதோனியர்களிடமிருந்து வெகுதொலைவில் இருந்தார்கள்
  rationale: அவர்களுடைய புவியியல் தனிமையை நேரடியாகப் பிரதிபலிக்கிறது; צִדֹנִים என்பதன் பன்மை வடிவத்தையும் காக்கிறது.
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: வேறு எவருடனும் அவர்களுக்குத் தொடர்பு இல்லை
  rationale: ‘ஒருவருடன் சொல்/காரியம் இல்லை’ என்ற எபிரெய மரபுத்தொடர் உறவு, பரிவர்த்தனை அல்லது தொடர்பின்மையைக் குறிக்கிறது.
- source_word: אָדָם
  choice: எவருடனும்
  rationale: ஒருமை பெயர்ச்சொல் இங்கு பொதுப்பொருளில் வருவதால், பாலினத்தைச் சுட்டாத இயல்பான தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
