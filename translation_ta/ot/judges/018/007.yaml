translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மீளுரைக்கும் பாதுகாப்பு-நிம்மதி வலியுறுத்தல் சுருக்கப்படாமல் காக்கப்பட்டுள்ளது. கடினமான எபிரெயத் தொடரின் நிச்சயமின்மை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது.
