translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் கதைநடைக்கு ஏற்ற இயல்பான உரையாடல். ‘தாணின் மக்கள்’ என்பது மூலத்தின் உறவுமுறை வடிவத்தைத் தக்கவைக்கிறது; இறுதி வினையின் உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
