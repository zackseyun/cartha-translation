source:
  edition: WLC
  text: וַֽ/יִּקְרְאוּ֙ אֶל בְּנֵי דָ֔ן וַ/יַּסֵּ֖בּוּ פְּנֵי/הֶ֑ם וַ/יֹּאמְר֣וּ לְ/מִיכָ֔ה מַה לְּ/ךָ֖ כִּ֥י נִזְעָֽקְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/023.yaml
  text: They called out to the sons of Dan[a], and they turned around and said to Micah, “What is the matter with you[b], that you have called out?”
translation:
  language: ta
  text: அவர்கள் தாணின் மக்களைக் கூப்பிட்டார்கள். அவர்கள் திரும்பி, மீகாவிடம், “உனக்கு என்ன ஆயிற்று? ஏன் கூக்குரலிட்டாய்?[a]” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏன் கூப்பாடு போட்டாய்?”
    reason: זעק என்ற வினையின் நிஃபால் வடிவத்திற்கான இயல்பான சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל־בְּנֵי דָן
  choice: அவர்கள் தாணின் மக்களை நோக்கிக் கூப்பிட்டார்கள்
  rationale: קרא என்பது இங்கு கேட்கும்படி அழைப்பதை அல்லது கூப்பிடுவதைக் குறிக்கிறது. בְּנֵי דָן என்ற எபிரெய உறவுமுறைச் சொற்றொடரை ‘தாணின் மக்கள்’ என்று இயல்பாகத் தக்கவைக்கிறது.
- source_word: וַיַּסֵּבּוּ פְּנֵיהֶם
  choice: அவர்கள் திரும்பிப் பார்த்து
  rationale: சொல்லர்த்தமாக ‘தங்கள் முகங்களைத் திருப்பினார்கள்’; நிகழ்வில் பின்னால் கூப்பிட்டவர்களை நோக்கித் திரும்பிய செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְמִיכָה
  choice: மீகாவிடம்
  rationale: முன்னிடைச்சொல்லும் பெயரும் தமிழில் உரையாடல் பெறுநரை இயல்பாகக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளன.
- source_word: מַה־לְּךָ
  choice: உனக்கு என்ன ஆயிற்று?
  rationale: ஒருவருக்கு என்ன பிரச்சினை அல்லது என்ன நேர்ந்தது என்று கேட்கும் எபிரெய மரபுத்தொடரின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: כִּי נִזְעָקְתָּ
  choice: ஏன் இப்படி ஆட்களைக் கூட்டிக்கொண்டு வந்திருக்கிறாய்?
  rationale: זעק என்பதன் நிஃபால் வடிவம் இங்கு ‘கூக்குரலிட்டு மக்களைத் திரட்டுதல்’ என்ற சூழல்சார் பொருளைக் கொள்ளலாம்; மீகா தன் அயலாரைக் கூட்டிக்கொண்டு அவர்களைத் துரத்திவந்த முந்தைய வசனத்தின் பின்னணியையும் இது இயல்பாக வெளிப்படுத்துகிறது.
