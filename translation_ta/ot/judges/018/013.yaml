  yaml_path: translation/ot/judges/018/013.yaml
  text: From there they passed through the hill country of Ephraim and came as far as Micah’s house[a][b].
translation:
  language: ta
  text: அங்கிருந்து அவர்கள் எப்பிராயீமின் மலைநாட்டைக்[b] கடந்து, மீகாவின் வீடு வரை[a] வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீகாவின் இல்லம்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், “எப்பிராயீமின் மலைநாடு”; மரபுவழியாக “எப்பிராயீம் மலை” என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: கடந்து
  rationale: עבר என்பது கடத்தல் அல்லது ஒரு பகுதியினூடாகச் செல்லுதல் என்ற பொருளைக் கொண்டது; இப்பயணச் சூழலில் ஒரு நிலப்பகுதியைக் கடந்து சென்றதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: முந்தைய இடத்திலிருந்து புறப்பட்டதைச் சுட்டும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: הַר אֶפְרָיִם
  choice: எப்பிராயீமின் மலைநாடு
  rationale: இது தனியொரு மலையைக் காட்டிலும் எப்பிராயீமின் மேட்டுப்பாங்கான பிராந்தியத்தைக் குறிக்கும் நிலவியல் பெயர்; ‘மலைநாடு’ அந்தப் பிராந்தியப் பொருளைப் பாதுகாக்கிறது.
- source_word: וַיָּבֹאוּ
  choice: வந்தார்கள்
  rationale: בוא என்பதன் அடிப்படை இயக்கப் பொருளைத் தக்கவைத்து, தொடரும் עַד உடன் இலக்கை அடைந்த பயண வரிசையை இயல்பாகக் காட்டுகிறது.
- source_word: עַד
  choice: வீட்டுவரை
  rationale: עַד குறிக்கும் எல்லை அல்லது சென்றடைந்த அளவை ‘வரை’ துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: בֵּית מִיכָה
  choice: மீகாவின் வீடு
  rationale: எபிரேய இணைப்புத் தொடரின் உடைமைப் பொருளை இயல்பான தமிழில் தருகிறது; சூழல்படி ‘மீகாவின் இல்லம்’ என்றும் புரிந்துகொள்ளலாம்.
