translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான எளிய கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பயண வரிசையும் ‘வரை’ என்ற எல்லைப் பொருளும் பாதுகாக்கப்பட்டுள்ளன; ‘மலைநாடு’ என்பது தனி மலை என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
