translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தில் அடுத்தடுத்து வரும் இரண்டு ‘வீடு’ சொற்றொடர்களின் விளக்கத் தொடர்பை நீண்ட கோடுகள் மூலம் தெளிவாகக் காட்டப்பட்டுள்ளது; மரபுத்தொடரின் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
