  yaml_path: translation/ot/judges/018/015.yaml
  text: They turned aside there and came to the house of the young Levite[a], to the house of Micah, and asked him about his welfare.
translation:
  language: ta
  text: அவர்கள் வழிவிலகி அங்கே சென்று, இளம் லேவியனின் வீட்டிற்கு—அதாவது, மீகாவின் வீட்டிற்கு—வந்து, அவனுடைய நலனைப் பற்றி விசாரித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனை வாழ்த்தினார்கள்” அல்லது “எல்லாம் நலமா என்று அவனிடம் கேட்டார்கள்.” எபிரெய மரபுத்தொடர் சொல்லர்த்தமாக ஒருவரின் அமைதி அல்லது நலநிலையைப் பற்றி விசாரிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסוּרוּ שָׁמָּה
  choice: அவர்கள் அங்கே திரும்பிச் சென்று
  rationale: סוּר என்பது பயணப் பாதையிலிருந்து விலகி அந்த இடத்தை நோக்கிச் சென்றதைக் குறிக்கிறது; שָׁמָּה இலக்கைச் சுட்டுகிறது. ‘திரும்பிச் சென்று’ என்பது இவ்விரு இயக்க நுணுக்கங்களையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיָּבֹאוּ אֶל
  choice: வந்து
  rationale: בוא + אֶל இங்கு ஒரு இடத்தை அடைவதைக் குறிக்கிறது. வீட்டிற்குள் நுழைந்தார்கள் என்று மூலத்தைவிட அதிகமாகச் சொல்லாமல், வருகையை மட்டும் காக்கிறது.
- source_word: בֵּית הַנַּעַר הַלֵּוִי
  choice: இளம் லேவியனின் வீட்டிற்கு
  rationale: נַעַר என்பதன் இளமைச் சுட்டுதலையும் הַלֵּוִי என்பதன் அடையாளத்தையும் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: בֵּית מִיכָה
  choice: மீகாவின் வீட்டிற்கு
  rationale: முந்தைய வீட்டுச் சொல்லை மீண்டும் குறிப்பிட்டு அந்த இடம் மீகாவின் வீடு என்பதைத் தெளிவுபடுத்தும் எபிரெய இணைப்புச் சொல்லமைப்பைத் தக்கவைக்கிறது.
- source_word: וַיִּשְׁאֲלוּ לוֹ לְשָׁלוֹם
  choice: அவனுடைய நலனைப் பற்றி விசாரித்தார்கள்
  rationale: שׁאל ... לְשָׁלוֹם என்பது ஒருவரின் அமைதி அல்லது நலநிலையை விசாரிக்கும் மரபுத்தொடர். இதை வெறும் வாழ்த்தாகச் சுருக்காமல் அதன் அடிப்படைப் பொருளை இயல்பான தமிழில் காக்கிறது.
