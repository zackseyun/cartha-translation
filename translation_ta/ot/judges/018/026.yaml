translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிமையான, கண்ணியமான வரலாற்று உரைநடை. கோத்திர அடையாளத்தை வெளிப்படையாக வைத்திருக்க ‘தாணின் மகன்கள்’ பயன்படுத்தப்பட்டது. வசனத்தில் உண்மையான உரைவேறுபாடோ இறையியல் தெளிவின்மையோ இல்லாததால் அடிக்குறிப்புகள் சேர்க்கப்படவில்லை.
