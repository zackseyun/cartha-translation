  source_fidelity: 'மையப் பொருள் சரியாக உள்ளது: தாணின் மகன்கள் பயணத்தைத் தொடருதல், மீகா அவர்களின் வலிமையை உணர்தல், பின்னர் திரும்பி வீட்டுக்குச் செல்லுதல் ஆகியவை எபிரெய உரையின் வரிசையோடும் பொருளோடும் ஒத்திருக்கின்றன. எனினும், ‘தங்கள் வழியே சென்றார்கள்’ என்பது தமிழில் இடப்பொருளாக (‘தங்கள் வழியின் ஊடாக’) ஒலிக்க வாய்ப்புள்ளது; לְדַרְכָּם-ன் பயணத்தைத் தொடரும் நுணுக்கத்தைத் தெளிவாகக் கூற வேண்டும். மேலும் וַיִּפֶן மற்றும் וַיָּשָׁב ஆகிய அடுத்தடுத்த வினைகளின் இரு கூறுகளையும் வெளிப்படுத்துவது பாதுகாப்பானது.'
  naturalness: ‘தங்கள் வழியைத் தொடர்ந்து சென்றார்கள்’ நவீனத் தரத் தமிழில் இயல்பாகவும், பயணத்தைத் தொடர்ந்தனர் என்ற கருத்தைத் தெளிவாகவும் தருகிறது. ‘திரும்பி, தன் வீட்டுக்குத் திரும்பிச் சென்றான்’ என்பதில் மீளுரைத்தல் இருந்தாலும், மூலத்தில் உள்ள ‘திரும்பினான்; திரும்பிச் சென்றான்’ என்ற இரட்டைச் செயலைக் காக்கிறது; வரலாற்று உரைநடையில் அது ஏற்றது.
  terminology: ‘தாணின் மகன்கள்’ என்பது בְנֵי דָן என்ற குடும்ப வடிவிலான கோத்திரச் சொல்லை வெளிப்படையாகத் தக்கவைக்கிறது. ‘மீகா’, ‘வலிமையானவர்கள்’, ‘வீடு’ ஆகியவை பொருத்தமானவை. இறையியல் சார்ந்த சிறப்புச் சொல் அல்லது அடிக்குறிப்பு தேவைப்படும் உரைச் சிக்கல் இல்லை.
