  text: Then the sons of Dan went on their way, and Micah saw that they were stronger than he was, so he turned and went back to his house.
translation:
  language: ta
  text: தாணின் மகன்கள் தங்கள் வழியைத் தொடர்ந்து சென்றார்கள். அவர்கள் தன்னைவிட வலிமையானவர்கள் என்பதை மீகா கண்டான்; அவன் திரும்பி, தன் வீட்டுக்குத் திரும்பிச் சென்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי דָן
  choice: தாணின் மகன்கள்
  rationale: எபிரெய மொழியின் குடும்ப உறவுச் சொல்லைத் தக்கவைத்தபடியே, இங்கு அது தாண் கோத்திரத்தாரைக் குறிக்கும் இனக்குழுப் பயன்பாடாக உள்ளது.
- source_word: לְדַרְכָּם
  choice: தங்கள் வழியே சென்றார்கள்
  rationale: அவர்கள் தங்கள் பயணத்தைத் தொடர்ந்தார்கள் என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; ‘வழி’ என்ற மூலப் படிமமும் தக்கவைக்கப்படுகிறது.
- source_word: חֲזָקִים הֵמָּה מִמֶּנּוּ
  choice: அவர்கள் தன்னைவிட வலிமையானவர்கள்
  rationale: חזק உடன் வரும் מן-ஒப்பீட்டின் நேரடியான பொருளான ‘அவனைவிட வலிமையானவர்கள்’ என்பதைத் தெளிவாகப் பாதுகாக்கிறது; ‘அவனால் எதிர்க்க முடியாதவர்கள்’ என்று விளக்கமாக்கவில்லை.
- source_word: וַיִּפֶן
  choice: அவன் திரும்பி
  rationale: வினையின் அடிப்படைப் பொருளான ‘திரும்புதல்’ என்பதைக் காக்கிறது; அடுத்துள்ள שׁוב உடன் சேர்ந்து நிகழ்ச்சியின் தொடரை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיָּשָׁב אֶל בֵּיתוֹ
  choice: தன் வீட்டுக்குச் சென்றான்
  rationale: שׁוב-இன் திரும்பிச் செல்லும் பொருள் முன் வரும் ‘திரும்பி’ என்பதுடன் வெளிப்படுகிறது; אֶל בֵּיתוֹ என்பதற்கு ‘தன் வீட்டுக்கு’ என்பது நேரடியும் இயல்புமான மொழிபெயர்ப்பு.
- source_word: בֵּיתוֹ
  choice: தன் வீடு
  rationale: בַּיִת என்பதன் நேரடி பொருளான ‘வீடு’ என்பதைக் காக்கிறது; தமிழில் எழுவாயைச் சுட்டும் இயல்பான தற்சுட்டுப் பெயராக ‘தன்’ பயன்படுத்தப்பட்டுள்ளது.
