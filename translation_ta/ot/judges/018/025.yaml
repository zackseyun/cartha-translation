  register: நவீன நிலையான தமிழில், உரையின் கடுமையான அச்சுறுத்தல் தொனியைப் பாதுகாக்கும் கண்ணியமான நடை. ஒருமையிலிருந்து பன்மைக்கு மாறும் மூல உரையின் முகவரிச் சுட்டு (‘உன்’ / ‘உங்களை’) அப்படியே காக்கப்பட்டுள்ளது.
