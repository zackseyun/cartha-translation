    issue: ‘மனக்கசப்புள்ள மனிதர்கள்’ understates אַנָשִׁים מָרֵי נֶפֶשׁ.
    rationale: In modern Tamil this can mean simply persons with emotional hurt or grievance. In this hostile warning, the Hebrew idiom denotes men liable to violent action—embittered, fierce, or reckless men. ‘கடுஞ்சினம் கொண்ட மனிதர்கள்’ better conveys the contextual threat while the note preserves alternatives.
