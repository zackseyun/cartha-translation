base_translation:
  language: en
  yaml_path: translation/ot/judges/018/025.yaml
  text: And the sons of Dan said to him[a], “Do not let your voice be heard among us, lest men bitter of soul fall upon you[b], and you lose your life and the lives of your household.”
translation:
  language: ta
  text: தாணின் மகன்கள் அவனிடம், “உன் குரல் எங்களிடையே கேட்கப்பட வேண்டாம்[a]. இல்லையென்றால், கடுஞ்சினம் கொண்ட மனிதர்கள்[b] உங்களைத் தாக்கக்கூடும்; அப்போது நீ உன் உயிரையும் உன் வீட்டாரின் உயிர்களையும் இழக்க நேரிடும்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “உன் குரல் எங்களோடு கேட்கப்பட வேண்டாம்.”'
    reason: lexical_alternative
  - marker: b
    text: “கடுமையான மனிதர்கள்,” “துணிந்துகெட்ட மனிதர்கள்,” அல்லது “உள்ளம் கசந்த மனிதர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי דָן
  choice: தாணின் மகன்கள்
  rationale: எபிரெய மொழியின் உறவுமுறை வடிவத்தையும் கோத்திர அடையாளத்தையும் நேரடியாகப் பாதுகாக்கிறது; நவீன தமிழிலும் புரிகிறது.
- source_word: אַל תַּשְׁמַע קוֹלְךָ עִמָּנוּ
  choice: உன் குரல் எங்களிடையே கேட்கப்பட வேண்டாம்
  rationale: ‘உன் குரல் கேட்கப்படுதல்’ என்ற எபிரெய உருவகத்தைப் பாதுகாத்து, தொடர்ந்து பேச வேண்டாம் என்ற அச்சுறுத்தலைத் தெரிவிக்கிறது.
- source_word: פֶּן
  choice: இல்லையென்றால்
  rationale: எச்சரிக்கையோடு கூடிய அச்சுறுத்தலின் விளைவைக் காட்டும் இயல்பான நவீனத் தமிழ் இணைப்புச்சொல்.
- source_word: יִפְגְּעוּ בָכֶם
  choice: உங்களைத் தாக்கி
  rationale: இச்சூழலில் வினைச்சொல் பகைமையுடன் எதிர்கொண்டு தாக்குவதைக் குறிக்கிறது; தமிழ் வாசகருக்கு பொருள் தெளிவாக உள்ளது.
- source_word: אֲנָשִׁים מָרֵי נֶפֶשׁ
  choice: மனக்கசப்புள்ள மனிதர்கள்
  rationale: ‘உள்ளம்/உயிர் கசந்தவர்கள்’ என்ற மூலப்படிமத்தை ஓரளவு காத்து, ஆபத்தான, கடுஞ்சினமுள்ள மனிதர்கள் என்ற கருத்தை மிகையாக விளக்காமல் தருகிறது.
- source_word: וְאָסַפְתָּה נַפְשְׁךָ
  choice: நீ உன் உயிரை இழக்க நேரிடும்
  rationale: இங்கு אָסַף + נֶפֶשׁ என்பது சொல்லுக்குச் சொல் ‘உயிரைச் சேர்த்தல்’ அல்ல; உயிரிழப்பைக் குறிக்கும் இடியத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְנֶפֶשׁ בֵּיתֶךָ
  choice: உன் வீட்டாரின் உயிர்களையும்
  rationale: ஒருமை வடிவிலுள்ள נֶפֶשׁ இங்கு வீட்டாரைத் தொகுப்பாகக் குறிக்கிறது; தமிழில் அவரவர் உயிர் ஆபத்தில் இருப்பதைப் பன்மை தெளிவாக்குகிறது.
