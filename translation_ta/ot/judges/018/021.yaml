translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் கொண்ட வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர் வினைச்செயல்கள் காக்கப்பட்டுள்ளன; தமிழில் இயல்புக்காக முதல் இரண்டு வினைகள் ஒரே தொடராக அமைக்கப்பட்டுள்ளன. தேவையற்ற விளக்கமோ திசை குறித்த ஊகமோ சேர்க்கப்படவில்லை.
