  yaml_path: translation/ot/judges/018/021.yaml
  text: So they turned and went on[a], and put the little children, the livestock[b], and the valuables before them.
translation:
  language: ta
  text: அவர்கள் திரும்பி, தொடர்ந்து சென்றார்கள்; சிறு பிள்ளைகளையும் கால்நடைகளையும் மதிப்புள்ள உடைமைகளையும் தங்களுக்கு முன்னால் வைத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: திரும்பி
  rationale: פנה என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்’ என்பதை இயல்பான தமிழ் தொடரில் காக்கிறது; அவர்கள் எந்தத் திசையில் திரும்பினார்கள் என்பதை உரை குறிப்பிடாததால் அதைச் சேர்க்கவில்லை.
- source_word: וַיֵּלֵכוּ
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: הלך தொடரும் நகர்வைக் குறிக்கிறது. ‘புறப்பட்டுச் சென்றார்கள்’ என்பது திரும்பியபின் அவர்கள் பயணத்தை மேற்கொண்டதை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיָּשִׂימוּ
  choice: செல்லும்படி வைத்தார்கள்
  rationale: שׂים என்பதன் ‘வைத்தல்/அமைத்தல்’ என்ற பொருளை, மனிதர்கள், கால்நடைகள், உடைமைகள் ஆகிய அனைத்தும் பயணக் குழுவுக்கு முன்னால் இருந்தன என்ற சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: הַטַּף
  choice: சிறு பிள்ளைகள்
  rationale: טף பொதுவாகக் குழுவிலுள்ள சிறியவர்களையும் பாதுகாப்பு தேவைப்படும் குழந்தைகளையும் குறிக்கிறது; அதன் சிறுமை மற்றும் பாதிப்புக்குள்ளாகும் தன்மையை ‘சிறு பிள்ளைகள்’ காக்கிறது.
- source_word: הַמִּקְנֶה
  choice: கால்நடைகள்
  rationale: מקנה என்பது மாடுகள் மட்டும் அல்லாமல் வளர்ப்பு மந்தை விலங்குகளைப் பொதுவாகக் குறிக்கிறது; ‘கால்நடைகள்’ அதன் பரந்த பொருளுக்கு ஏற்றது.
- source_word: הַכְּבוּדָּה
  choice: உடைமைகள்
  rationale: כבודה இச்சூழலில் எடுத்துச் செல்லப்படும் பொருட்கள் அல்லது சொத்துகளைக் குறிக்கிறது; ‘மகிமை’ என்பது இங்கு பொருந்தாது. ‘உடைமைகள்’ மதிப்புள்ள மற்றும் பயணத்தில் எடுத்துச் செல்லக்கூடிய சொத்துகள் என்ற பொருளை மிகைப்படுத்தாமல் தருகிறது.
- source_word: לִפְנֵיהֶם
  choice: தங்களுக்கு முன்னால்
  rationale: ‘அவர்களுக்கு முன்/அவர்களுக்கு முன்னால்’ என்ற எபிரெய நேரடிப் பொருளை காக்கிறது. செய்பவர்களே குறிப்பு பெறும் குழுவாக இருப்பதால், தமிழில் ‘தங்களுக்கு’ என்பது பிரதிபெயர்ப் பொருளைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
