translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. இடப்பெயர்கள் எழுத்துப்பெயர்க்கப்பட்டு, பெயரின் பொருளும் ‘பின்னால்/மேற்கே’ என்ற உண்மையான சொற்பொருள் நுணுக்கமும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
