base_translation:
  language: en
  yaml_path: translation/ot/judges/018/012.yaml
  text: They went up and camped at Kiriath-jearim in Judah. Therefore that place has been called Mahaneh-dan to this day; behold, it is west of Kiriath-jearim.
translation:
  language: ta
  text: அவர்கள் மேலே சென்று, யூதாவிலுள்ள கீரியாத்-யெயாரீமில் முகாமிட்டார்கள். அதனால் அந்த இடம் இன்றுவரை மகனே-தாண்[a] என்று அழைக்கப்படுகிறது. இதோ, அது கீரியாத்-யெயாரீமுக்கு மேற்கே இருக்கிறது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மகனே-தாண்” என்பதற்கு “தாணின் முகாம்” என்று பொருள்.
    reason: எபிரெய இடப்பெயரிலுள்ள சொல்விளையாட்டையும் பெயரிடுவதற்கான காரணத்தையும் வாசகர் அறிய உதவுகிறது.
  - marker: b
    text: அல்லது, “கீரியாத்-யெயாரீமுக்குப் பின்னால் இருக்கிறது.” எபிரெயச் சொல்லின் நேரடிப் பொருள் ‘பின்னால்’; புவியியல் சூழலில் அது ‘மேற்கே’ என்பதைக் குறிக்கலாம்.
    reason: אַחֲרֵי என்ற சொல்லின் நேரடிப் பொருளையும், சூழல்சார்ந்த திசை விளக்கத்தையும் நிர்ணயமாக்காமல் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: புறப்பட்டுச் சென்று
  rationale: இங்கு பயணத்தைத் தொடங்கித் தொடர்வதைக் குறிக்கிறது; தமிழில் வெறும் ‘ஏறிச் சென்றார்கள்’ என்பது தேவையற்ற நிலவியல் குறிப்பாகப் புரியக்கூடும்.
- source_word: קִרְיַת יְעָרִים
  choice: கீரியாத்-யெயாரீம்
  rationale: இடப்பெயரை எபிரெய ஒலிப்புக்கு அருகில் தமிழில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: מַחֲנֵה דָן
  choice: மகனே-தாண்
  rationale: இடப்பெயராக எழுத்துப்பெயர்க்கப்பட்டுள்ளது; அதன் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אַחֲרֵי
  choice: மேற்கே
  rationale: அடிப்படைப் பொருள் ‘பின்னால்’; கிழக்கை நோக்கும் வழக்கமான திசைநோக்கில் அது ‘மேற்கே’ என்பதைக் குறிக்கலாம். சூழலுக்கு ஏற்ற இயல்பான திசைச்சொல் தேர்ந்தெடுக்கப்பட்டது; மொழிநேர்த்தியான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: இடத்தைச் சுட்டிக் கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் குறியீட்டை வெளிப்படையாகப் பாதுகாக்கிறது.
