- from: அவர்கள் மீகாவின் வீட்டைவிட்டுச் சிறிது தூரம் சென்றபோது, மீகாவின் வீட்டுக்கு அருகிலிருந்த வீடுகளில் இருந்த ஆண்கள் ஒன்றுகூடி அழைக்கப்பட்டு[a], தாணின் மக்களைப் பிடித்துக்கொண்டார்கள்.
