base_translation:
  language: en
  yaml_path: translation/ot/judges/018/022.yaml
  text: When they had gone some distance from Micah’s house[a], the men who were in the houses near Micah’s house were called together, and they overtook the sons of Dan.
translation:
  language: ta
  text: அவர்கள் மீகாவின் வீட்டைவிட்டுச் சிறிது தூரம் சென்றிருந்தபோது, மீகாவின் வீட்டுக்கு அருகிலிருந்த வீடுகளில் இருந்த ஆண்கள் ஒன்றுகூட அழைக்கப்பட்டார்கள்[a]; அவர்கள் தாணின் மக்களைப் பின்தொடர்ந்து சென்று எட்டினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எச்சரிக்கைக் கூக்குரல் எழுப்பினர்.” எபிரெய வினை எச்சரிக்கைக் கூக்குரலையோ, அதன் விளைவாக மக்கள் ஒன்றுதிரள்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: அவர்கள்
  rationale: தாண் கோத்திரத்தாரை மீண்டும் சுட்டும் தனிநிலைப் பதிலிப்பெயர்; தமிழில் இயல்பான எழுவாயாக மொழிபெயர்க்கப்பட்டது.
- source_word: הִרְחִיקוּ
  choice: சிறிது தூரம் சென்றபோது
  rationale: רחק என்பதன் பொருள் இங்கு ஓரிடத்திலிருந்து தூரமாகச் செல்வது; நிகழ்ச்சியின் காலத் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִבֵּית מִיכָה
  choice: மீகாவின் வீட்டைவிட்டு
  rationale: மூலத்தின் முன்னிடைச்சொல் மற்றும் உடைமைத் தொடர்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הָאֲנָשִׁים
  choice: ஆண்கள்
  rationale: மூலம் பொதுவாக ‘மக்கள்’ என்று அல்லாமல் குறிப்பாக ஆண்களைக் குறிக்கிறது.
- source_word: אֲשֶׁר בַּבָּתִּים אֲשֶׁר עִם בֵּית מִיכָה
  choice: மீகாவின் வீட்டுக்கு அருகிலிருந்த வீடுகளில் இருந்த ஆண்கள்
  rationale: עִם இங்கு உடனிருத்தல் அல்லது அண்மை என்ற பொருளைக் கொண்டுள்ளது; சற்றுக் கடினமான எபிரெயத் தொடரை அதன் இடவியல் பொருள் கெடாமல் தெளிவான தமிழில் தருகிறது.
- source_word: נִזְעֲקוּ
  choice: ஒன்றுகூடி அழைக்கப்பட்டு
  rationale: זעק வினையின் நிபால் வடிவம் எச்சரிக்கைக் கூக்குரலையோ, அதன் விளைவாக மக்கள் திரட்டப்படுவதையோ குறிக்கலாம்; தொடரும் துரத்தல் நிகழ்ச்சிக்கு ஏற்றவாறு திரட்டப்படுதல் முதன்மைப்படுத்தப்பட்டது.
- source_word: וַיַּדְבִּיקוּ
  choice: பிடித்துக்கொண்டார்கள்
  rationale: דבק இங்கு துரத்திச் சென்று எட்டிப்பிடித்தல் அல்லது பின்னால் நெருங்கிவிடுதல் எனப் பொருள்படும்; ‘பிடித்துக்கொண்டார்கள்’ இயல்பான கதைநடைத் தமிழ்.
- source_word: אֶת בְּנֵי דָן
  choice: தாணின் மக்களை
  rationale: மூலத்திலுள்ள முறையான உறவுமுறைச் சொல்லாக்கத்தைத் தக்கவைத்து, தாணின் வழிவந்தவர்களைக் குறிக்கிறது.
