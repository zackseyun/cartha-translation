base_translation:
  language: en
  yaml_path: translation/ot/judges/018/014.yaml
  text: Then the five men who had gone to spy out the land of Laish answered and said to their brothers[a], “Do you know that in these houses there are an ephod, teraphim, a carved image, and a cast image? So now[b], know what you will do.”
translation:
  language: ta
  text: அப்போது, லாயீசின் நாட்டை வேவுபார்க்கச் சென்றிருந்த அந்த ஐந்து பேரும் பதிலளித்துத் தங்கள் சகோதரர்களிடம், “இந்த வீடுகளில் ஓர் ஏபோத்தும், தெராப்பீம்களும்[a], ஒரு செதுக்கப்பட்ட உருவமும், ஒரு வார்ப்பிக்கப்பட்ட உருவமும் இருக்கின்றன என்பது உங்களுக்குத் தெரியுமா? ஆகவே, இப்போது நீங்கள் என்ன செய்ய வேண்டும் என்பதை அறிந்துகொள்ளுங்கள்” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தெராப்பீம்கள்” என்பது குடும்ப வழிபாட்டில் பயன்படுத்தப்பட்ட படிமங்களையோ வீட்டுத் தெய்வங்களையோ குறிக்கும் எபிரெயச் சொல்; அவற்றின் துல்லிய வடிவமும் பயன்பாடும் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: மறுமொழியாக ... என்றார்கள்
  rationale: ענה என்பதன் எபிரெயக் கதைநடைச் சொல்லாடலை இயல்பான தமிழில் காட்டுகிறது; முன் கூறப்பட்ட நேரடி பேச்சு இல்லாவிட்டாலும் பதிலுரைக்கும் தன்மையைப் பாதுகாக்கிறது.
- source_word: חֲמֵשֶׁת הָאֲנָשִׁים
  choice: அந்த ஐந்து பேரும்
  rationale: முன்னரே குறிப்பிடப்பட்ட ஐந்து வேவுகாரர்களைக் குறிக்கும் குறிப்பிட்ட குழுவை இயல்பான தமிழில் சுட்டுகிறது.
- source_word: הַהֹלְכִים לְרַגֵּל
  choice: வேவுபார்க்கச் சென்றிருந்த
  rationale: அவர்களின் முன்பு நிறைவேறிய உளவு நடவடிக்கையைத் தமிழ் இறந்தகால அமைப்பில் தெளிவாகக் காட்டுகிறது.
- source_word: אֶת הָאָרֶץ לַיִשׁ
  choice: லாயீசின் நிலத்தை
  rationale: אָרֶץ என்பது இங்கு லாயீசோடு தொடர்புடைய நிலப்பகுதியைக் குறிக்கிறது; ‘நிலம்’ மூலச்சொல்லின் பரப்பை மிகைப்படுத்தாமல் தருகிறது.
- source_word: אֶל אֲחֵיהֶם
  choice: தங்கள் சகோதரர்களிடம்
  rationale: ஆண் தாணியர் குழுவைக் குறிக்கும் אֲחֵיהֶם என்பதன் உறவுமுறைப் பொருளையும் பாலினக் குறிப்பையும் பாதுகாக்கிறது.
- source_word: הֲיְדַעְתֶּם כִּי יֵשׁ
  choice: இருப்பது உங்களுக்குத் தெரியுமா?
  rationale: கவனத்தை ஈர்த்து நடவடிக்கைக்குத் தூண்டும் கேள்வியை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: בַּבָּתִּים הָאֵלֶּה
  choice: இந்த வீடுகளில்
  rationale: בָּתִּים என்பதன் நேரடிப் பொருளைப் பாதுகாத்து, ஆலய வளாகம் அல்லது குடும்பங்கள் என்று தேவையின்றி விளக்கவில்லை.
- source_word: אֵפוֹד
  choice: ஓர் ஏபோத்து
  rationale: எளிய தமிழ் இணைச்சொல் இல்லாத தனித்த வழிபாட்டுப் பொருளாதலால் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: תְרָפִים
  choice: தெராப்பீம்கள்
  rationale: இந்தப் பன்மை வழிபாட்டுச் சொல்லை ‘வீட்டுத் தெய்வங்கள்’ அல்லது ‘சிலைகள்’ என்று விளக்கி அதன் உண்மையான தெளிவின்மையை அகற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: פֶסֶל
  choice: ஒரு செதுக்கப்பட்ட உருவம்
  rationale: செதுக்கி உருவாக்கப்பட்ட படிமம் என்ற குறிப்பிட்ட உற்பத்தி முறையைப் பாதுகாக்கிறது.
- source_word: מַסֵּכָה
  choice: ஒரு வார்ப்பிக்கப்பட்ட உருவம்
  rationale: உருக்கி வார்க்கப்பட்ட படிமம் என்ற பொருளை இயல்பான தமிழில் தருகிறது; פֶסֶל என்பதிலிருந்து வேறுபாட்டையும் பாதுகாக்கிறது.
- source_word: וְעַתָּה דְּעוּ מַה תַּעֲשׂוּן
  choice: ஆகவே இப்போது நீங்கள் என்ன செய்யப்போகிறீர்கள் என்பதைத் தீர்மானியுங்கள்
  rationale: ‘நீங்கள் என்ன செய்வீர்கள் என்பதை அறிந்துகொள்ளுங்கள்’ என்ற சொற்படியான ஆனால் இயல்பற்ற தமிழுக்குப் பதிலாக, ஆலோசித்து நடவடிக்கையை முடிவுசெய்யுமாறு கூறும் எபிரெய மரபுத்தொடரின் நடைமுறைப் பொருளை வழங்குகிறது.
theological_decisions:
- issue: மீகாவின் வழிபாட்டிடத்திலிருந்த வழிபாட்டுப் பொருட்களின் வேறுபாடு
  choice: ‘ஏபோத்து, தெராப்பீம்கள், செதுக்கப்பட்ட உருவம், வார்ப்பிக்கப்பட்ட உருவம்’ என்று தனித்தனி சொற்களால் மொழிபெயர்த்தல்
  alternative: எல்லாவற்றையும் பொதுவாக ‘சிலைகள்’ அல்லது ‘விக்கிரகங்கள்’ என்று மொழிபெயர்த்தல்
  rationale: மூலத்தில் உள்ள நான்கு வேறுபட்ட பெயர்களையும் பாதுகாக்கிறது; அவற்றின் மதிப்பீட்டை மொழிபெயர்ப்பிலேயே ஒரே பொதுப் பிரிவாகச் சுருக்கவில்லை.
- issue: תְרָפִים என்பதன் அடையாளம்
  choice: ‘தெராப்பீம்கள்’ என்று ஒலிபெயர்த்து அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘வீட்டுச் சிலைகள்’ அல்லது ‘வீட்டுத் தெய்வங்கள்’
  rationale: இவை குடும்ப வழிபாட்டுப் படிமங்களாக இருக்கலாம்; ஆனால் அவற்றின் துல்லிய இயல்பு உறுதியற்றதால் பிரதான உரையில் ஓர் விளக்கத்தை இறுதியானதாகத் திணிக்கவில்லை.
- issue: אֲחֵיהֶם என்ற பாலினமுள்ள உறவுமுறைச் சொல்
  choice: ‘தங்கள் சகோதரர்கள்’
  alternative: ‘தங்கள் இனத்தவர்கள்’ அல்லது ‘தங்கள் தோழர்கள்’
  rationale: சூழலில் ஆண் தாணியர்களைக் குறிக்கும் மூலத்தின் உறவுமுறை மற்றும் பாலினக் குறிப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கலாசாரத்துக்கே உரிய ‘ஏபோத்து’, ‘தெராப்பீம்கள்’ ஆகியவை ஒலிபெயர்க்கப்பட்டுள்ளன; உருவாக்க முறையை வேறுபடுத்தும் פֶסֶל மற்றும் מַסֵּכָה தனித்தனியாக மொழிபெயர்க்கப்பட்டுள்ளன.
