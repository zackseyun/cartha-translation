revisions:
- from: அப்போது லாயீசின் நிலத்தை வேவுபார்க்கச் சென்றிருந்த அந்த ஐந்து பேரும் தங்கள் சகோதரர்களிடம் மறுமொழியாக, “இந்த வீடுகளில் ஓர் ஏபோத்தும், தெராப்பீம்களும்[a], ஒரு செதுக்கப்பட்ட உருவமும், ஒரு வார்ப்பிக்கப்பட்ட உருவமும் இருப்பது உங்களுக்குத் தெரியுமா? ஆகவே இப்போது நீங்கள் என்ன செய்யப்போகிறீர்கள் என்பதைத் தீர்மானியுங்கள்” என்றார்கள்.
  to: அப்போது, லாயீசின் நாட்டை வேவுபார்க்கச் சென்றிருந்த அந்த ஐந்து பேரும் பதிலளித்துத் தங்கள் சகோதரர்களிடம், “இந்த வீடுகளில் ஓர் ஏபோத்தும், தெராப்பீம்களும்[a], ஒரு செதுக்கப்பட்ட உருவமும், ஒரு வார்ப்பிக்கப்பட்ட உருவமும் இருக்கின்றன என்பது உங்களுக்குத் தெரியுமா? ஆகவே, இப்போது நீங்கள் என்ன செய்ய வேண்டும் என்பதை அறிந்துகொள்ளுங்கள்” என்று சொன்னார்கள்.
  rationale: The revision makes only safe stylistic and grammatical improvements. It retains the source’s ambiguity concerning the teraphim and the force of the concluding imperative, keeps all four cultic objects distinct, and preserves the existing footnote anchor and explanation.
