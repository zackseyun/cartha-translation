  yaml_path: translation/ot/judges/018/006.yaml
  text: And the priest said to them[a], “Go in peace. The journey on which you are going is before Yahweh.”
translation:
  language: ta
  text: ஆசாரியன் அவர்களிடம், “சமாதானத்துடன் செல்லுங்கள். நீங்கள் செல்லும் வழி யாவேக்கு முன்பாக இருக்கிறது[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் வழி யாவேயின் முன்னிலையில் இருக்கிறது”; அதாவது, உங்கள் பயணம் அவருடைய பார்வையில் இருக்கிறது. இந்தச் சொற்றொடர், அவர் அந்தப் பயணத்தை வெளிப்படையாக அங்கீகரிக்கிறார் என்று கட்டாயமாகப் பொருள்படாது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது; காலவரிசையைத் தேவையின்றி வலுப்படுத்தவில்லை.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட குறிப்பிட்ட ஆசாரியனைக் குறிக்கும் வரையறுக்கப்பட்ட பெயர்ச்சொல்.
- source_word: לְכוּ
  choice: செல்லுங்கள்
  rationale: הלך என்பதன் பன்மை ஏவல் வடிவத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: לְשָׁלוֹם
  choice: சமாதானத்துடன்
  rationale: புறப்படும்போது கூறப்படும் வாழ்த்து அல்லது நல்வாழ்த்தின் தன்மையைப் பாதுகாக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: נֹכַח
  choice: முன்பாக
  rationale: ஒருவரின் முன்னிலையில் அல்லது பார்வையில் இருப்பதைக் குறிக்கும் மூலச்சொல்லின் பொருளைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய வேதாகமத்தின் தனிப்பட்ட இறைப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: דַּרְכְּכֶם
  choice: நீங்கள் செல்லும் வழி
  rationale: சொல்லடிப்படையான ‘உங்கள் வழி’ என்ற உருவகத்தையும் பயணச் சூழலையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: אֲשֶׁר תֵּלְכוּ בָהּ
  choice: நீங்கள் செல்லும்
  rationale: ‘அதில் நீங்கள் செல்கிற’ என்ற உறவுச் சொல்லாட்சியை தமிழில் சுருக்கமாகவும் தெளிவாகவும் வழியோடு இணைக்கிறது.
theological_decisions:
- issue: தாண் கோத்திரத்தாரின் பயணத்தைப் பற்றிய ஆசாரியனின் கூற்றின் வலிமை
  choice: “நீங்கள் செல்லும் வழி யாவேக்கு முன்பாக இருக்கிறது” என்று, அந்தப் பயணம் யாவேயின் முன்னிலையில் அல்லது பார்வையில் இருப்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: “யாவே உங்கள் பயணத்தை அங்கீகரிக்கிறார்” அல்லது “யாவே உங்கள் பயணத்தை வெற்றிபெறச் செய்வார்” என்று வெளிப்படையான அங்கீகாரம் அல்லது வெற்றிக்கான உறுதிமொழியாக மொழிபெயர்த்தல்.
  rationale: נֹכַח יְהוָה என்ற சொற்றொடர் வழி யாவேக்கு முன்பாக இருப்பதை நேரடியாகக் கூறுகிறது; அவர் அதை அங்கீகரிக்கிறார், ஆசீர்வதிக்கிறார், அல்லது வெற்றியை உறுதிசெய்கிறார் என்று வெளிப்படையாகக் கூறவில்லை. ஆகவே மூலத்தின் இறையியல் பதற்றம் தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘யாவே’ என்பது יהוה என்ற தனிப்பட்ட இறைப்பெயரின் தமிழ் ஒலிபெயர்ப்பு. மூலத்தின் சற்றே தெளிவற்ற ‘முன்பாக’ என்ற சொல்லாட்சி அடிக்குறிப்பு உதவியுடன் பாதுகாக்கப்பட்டுள்ளது.
