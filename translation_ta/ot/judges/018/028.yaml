base_translation:
  language: en
  yaml_path: translation/ot/judges/018/028.yaml
  text: And there was no one to deliver them[a], because it was far from Sidon, and they had no dealings with anyone; and it was in the valley that belongs to Beth-rehob. Then they rebuilt the city and lived in it.
translation:
  language: ta
  text: அவர்களைக் காப்பாற்ற யாரும் இல்லை; ஏனெனில் அந்த நகரம் சீதோனிலிருந்து வெகு தொலைவில் இருந்தது. அவர்களுக்கு யாருடனும் எந்தத் தொடர்பும் இல்லை. அது பெத்-ரெகோபுக்குச் சொந்தமான பள்ளத்தாக்கில் இருந்தது.[a] பின்னர் அவர்கள் அந்த நகரத்தை மீண்டும் கட்டி, அதில் குடியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெத்-ரெகோபுக்கு அருகிலுள்ள பள்ளத்தாக்கில்.” எபிரெயச் சொற்றொடர் சில சொற்கள் விடுபட்ட சுருக்கமான அமைப்பில் உள்ளது; அதிலுள்ள முன்னொட்டு உடைமையைக் காட்டுவதற்குப் பதிலாக அருகாமையைக் குறிக்கவும் கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצִּיל
  choice: காப்பாற்ற யாரும்
  rationale: நצל என்பதன் ஹிஃபில் வினையெச்சம் ஆபத்திலிருந்து காப்பாற்றுகிற அல்லது மீட்கிற ஒருவரைக் குறிக்கிறது. இங்கு இராணுவத் தாக்குதலின் சூழலில் இயல்பான தமிழாக ‘காப்பாற்ற யாரும்’ என மொழிபெயர்க்கப்பட்டுள்ளது; ‘அவர்களை’ என்பது சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
- source_word: רְחוֹקָה הִיא מִצִּידוֹן
  choice: அந்த நகரம் சீதோனிலிருந்து வெகு தொலைவில் இருந்தது
  rationale: பெண்பால் சுட்டுப்பெயர் நகரத்தைக் குறிக்கிறது. தமிழில் குறிப்பு தெளிவாக இருக்க ‘அந்த நகரம்’ என்று வெளிப்படையாகக் கூறப்பட்டுள்ளது.
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: அவர்களுக்கு யாருடனும் எந்தத் தொடர்பும் இல்லை
  rationale: சொல்லுக்குச் சொல் ‘மனிதனோடு அவர்களுக்கு ஒரு காரியமும் இல்லை’ என்ற நீள்வாக்கியம் இங்கு சமூக அல்லது அரசியல் தனிமையைக் குறிக்கிறது. ‘எந்தத் தொடர்பும் இல்லை’ என்பது அதன் இயல்பான தமிழாக்கம்.
- source_word: אָדָם
  choice: யாருடனும்
  rationale: ஒருமை வடிவில் இருந்தாலும் இங்கு பொதுப்பொருளில் வருவதால் பாலினத்தைக் குறிப்பதில்லாத ‘யாருடனும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בָּעֵמֶק
  choice: பள்ளத்தாக்கில்
  rationale: עֵמֶק பொதுவாகப் பள்ளத்தாக்கு அல்லது தாழ்நிலத்தைக் குறிக்கிறது; இங்கு ‘பள்ளத்தாக்கு’ நேரடியான பொருத்தம்.
- source_word: אֲשֶׁר לְבֵית רְחוֹב
  choice: பெத்-ரெகோபுக்குச் சொந்தமான
  rationale: לְ என்ற முன்னொட்டு உறவு அல்லது உடைமையைக் குறிக்கக்கூடும். முதன்மை உரை சாத்தியமான நிலப்பகுதி சார்ந்த பொருளைத் தருகிறது; இடத்துக்கு அருகாமை என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיִּבְנוּ אֶת הָעִיר
  choice: அந்த நகரத்தை மீண்டும் கட்டி
  rationale: எபிரெயத்தில் நேரடியாக ‘கட்டினார்கள்’ என்றாலும் முந்தைய வசனத்தில் நகரம் எரிக்கப்பட்டதால் இங்கு மறுகட்டுமானமே குறிக்கப்படுகிறது. ‘மீண்டும் கட்டி’ என்பது சூழலால் உறுதிப்படுத்தப்படும் இயல்பான வெளிப்பாடு.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: அதில் குடியிருந்தார்கள்
  rationale: יָשַׁב இங்கு ஒரு இடத்தில் குடியிருந்து வாழ்வதைக் குறிக்கிறது. ‘குடியிருந்தார்கள்’ என்பது தெளிவான, கண்ணியமான நவீன தமிழ்.
- source_word: בֵית רְחוֹב
  choice: பெத்-ரெகோப்
  rationale: இது ஓர் இடப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் எபிரெய ஒலிப்புக்கு ஏற்றவாறு எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
