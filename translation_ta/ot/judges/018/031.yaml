base_translation:
  language: en
  yaml_path: translation/ot/judges/018/031.yaml
  text: So they set up for themselves Micah’s carved image that he had made[a], all the days that the house of God was in Shiloh.
translation:
  language: ta
  text: கடவுளின் இல்லம் சீலோவில் இருந்த காலமெல்லாம், அவர்கள் மீகா செய்திருந்த செதுக்கப்பட்ட உருவத்தைத் தங்களுக்கென்று நிறுவி வைத்திருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விக்கிரகத்தை.” எபிரெயச் சொல் வழிபாட்டுக்காகச் செதுக்கப்பட்ட உருவத்தைக் குறிக்கிறது. “செதுக்கப்பட்ட உருவம்” அதன் உருவாக்கப்பட்ட தன்மையை வெளிப்படுத்துகிறது; “விக்கிரகம்” அதன் வழிபாட்டுச் செயல்பாட்டை இன்னும் தெளிவாக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהֶם
  choice: அவர்கள் தங்களுக்காக ... நிறுவினார்கள்
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வை/அமை’ என்பதாக இருந்தாலும், வழிபாட்டுக்குரிய உருவத்தை ஓர் இடத்தில் நிலைநிறுத்திய சூழலில் ‘நிறுவினார்கள்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது; לָהֶם என்பதன் தங்களுக்கான நுணுக்கமும் காக்கப்படுகிறது.
- source_word: פֶּסֶל
  choice: செதுக்கப்பட்ட உருவம்
  rationale: இச்சொல் வழிபாட்டுக்காக வடிக்கப்பட்ட அல்லது செதுக்கப்பட்ட உருவத்தைக் குறிக்கிறது. ‘சிலை’ என்பதைவிட ‘செதுக்கப்பட்ட உருவம்’ அதன் உருவாக்கப்பட்ட தன்மையை வெளிப்படையாகக் காக்கிறது; அதன் விக்கிரகச் செயல்பாடு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִיכָה
  choice: மீகா
  rationale: தனிப்பெயர் நவீனத் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֲשֶׁר עָשָׂה
  choice: செய்திருந்த
  rationale: உருவத்தை நிறுவுவதற்கு முன்பே மீகா அதைச் செய்திருந்தான் என்ற நிகழ்வுகளின் காலவரிசையைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: כָּל יְמֵי הֱיוֹת
  choice: இருந்த காலமெல்லாம்
  rationale: ‘அது இருந்த எல்லா நாட்களிலும்’ என்ற எபிரெய மரபுத்தொடரின் நீடித்த காலப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: בֵּית הָאֱלֹהִים
  choice: கடவுளின் இல்லம்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருளைப் பாதுகாக்கிறது; ‘திருத்தலம்’ என்று விளக்கமாக மொழிபெயர்த்து உரையின் இறையியல் எதிர்மறை ஒப்பீட்டை முன்கூட்டியே தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: בְּשִׁלֹה
  choice: சீலோவில்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, முன்னிடைச்சொல் வேற்றுமை உருபால் நேரடியாகத் தரப்படுகிறது.
theological_decisions:
- issue: தாணின் முறைகேடான வழிபாட்டு அமைப்புக்கும் சீலோவிலிருந்த அங்கீகரிக்கப்பட்ட வழிபாட்டு மையத்துக்கும் இடையிலான சூழலில் בֵּית הָאֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுளின் இல்லம்
  alternative: கடவுளின் திருத்தலம்
  rationale: மூலச் சொற்றொடர் தன்னளவில் விளக்கவுரையோ கண்டனமோ சேர்ப்பதில்லை. ‘கடவுளின் இல்லம்’ என்பது அதன் நேரடித் தன்மையையும், தாணின் செதுக்கப்பட்ட உருவம் சீலோவிலிருந்த கடவுளின் இல்லத்தோடு ஒரே காலத்தில் நிலவியதாகக் கதை உருவாக்கும் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. முதல் வாக்கியத்திலுள்ள நிறுவப்பட்ட உருவமே தொடர்ந்து இருந்தது என்பதைத் தமிழில் தெளிவாக்க ‘அது அங்கே இருந்தது’ சேர்க்கப்பட்டுள்ளது; இது எபிரெய காலவாக்கியத்தின் இயல்பான பொருளை வெளிப்படுத்துகிறது.
