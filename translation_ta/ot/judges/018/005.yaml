source:
  edition: WLC
  text: וַ/יֹּ֥אמְרוּ ל֖/וֹ שְׁאַל נָ֣א בֵ/אלֹהִ֑ים וְ/נֵ֣דְעָ֔ה הֲ/תַצְלִ֣יחַ דַּרְכֵּ֔/נוּ אֲשֶׁ֥ר אֲנַ֖חְנוּ הֹלְכִ֥ים עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/005.yaml
  text: And they said to him[a], “Please inquire of God, so that we may know whether the journey on which we are going will succeed.”
translation:
  language: ta
  text: அவர்கள் அவனிடம்[a], “நாங்கள் செல்லும் வழி வெற்றிபெறுமா என்று அறிந்துகொள்ளும்படி, தயவுசெய்து கடவுளிடம் விசாரித்துக் கேள்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நாங்கள் மேற்கொள்ளும் பயணம் வெற்றிபெறுமா” என்றும் மொழிபெயர்க்கலாம்; “வழி” என்பது எபிரெய மூலத்தின் நேரடியான உருவகத்தைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ לוֹ
  choice: அவர்கள் அவனிடம் ... என்றார்கள்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தருகிறது; வாக்கியத் தொடக்கத்தில் கட்டாயமாக ‘பின்பு’ சேர்த்து காலவரிசையை மிகைப்படுத்தவில்லை.
- source_word: שְׁאַל נָא
  choice: தயவுசெய்து ... விசாரித்துக் கேள்
  rationale: שׁאל என்பது இச்சூழலில் இறைவழிகாட்டுதலை நாடிக் கேட்பதைக் குறிக்கிறது; נָא கட்டளையை மென்மையாக்குவதால் ‘தயவுசெய்து’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: בֵאלֹהִים
  choice: கடவுளிடம்
  rationale: שׁאל உடன் வரும் ב இங்கு ‘கடவுளிடம் விசாரித்தல்’ என்ற இயல்பான பொருளைத் தருகிறது; சூழலில் אֱלֹהִים ஒருமைப் பொருளில் புரிந்துகொள்ளப்படுகிறது.
- source_word: וְנֵדְעָה
  choice: அறிந்துகொள்வோம்
  rationale: வேண்டுகோளுக்குப் பின்வரும் நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הֲתַצְלִיחַ
  choice: வெற்றிபெறுமா
  rationale: צלח என்பதன் ஹிஃபில் வடிவம் இங்கு முயற்சி வெற்றியடைவதையோ நன்றாக அமைவதையோ குறிக்கிறது; ‘வெற்றிபெறுமா’ தெளிவான நவீனத் தமிழ்.
- source_word: דַּרְכֵּנוּ
  choice: நாங்கள் செல்லும் வழி
  rationale: ‘எங்கள் வழி’ என்ற நேரடி உருவகத்தைத் தொடர்ந்து வரும் சார்பு வாக்கியத்துடன் இணைத்து, பயணம் அல்லது படையெடுப்பு என்ற சூழற்பொருளையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֲשֶׁר אֲנַחְנוּ הֹלְכִים עָלֶיהָ
  choice: நாங்கள் செல்லும்
  rationale: ‘அதன்மேல் நாங்கள் போகிற’ என்ற எபிரெய உருவகத்தைத் தமிழில் இயல்பாகச் சுருக்கி, வழியைக் குறிக்கும் சார்பு வாக்கியமாக வழங்குகிறது.
theological_decisions:
- issue: אֱלֹהִים என்பதன் எண் மற்றும் குறிப்பு
  choice: கடவுள் (ஒருமை)
  alternative: தெய்வங்கள்
  rationale: சொல் வடிவம் பன்மையையும் அனுமதித்தாலும், ஆசாரியன் வழியாகத் தெய்வீக வழிகாட்டுதலைக் கேட்கும் உடனடிச் சூழலில் ஒருமைப் பொருளே இயல்பானது. இது சூழல்சார் மொழியியல் தீர்மானம்; சமயப் பிரிவுசார் விளக்கமல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘வழி’ உருவகம் பிரதான உரையில் பாதுகாக்கப்பட்டு, அதன் சூழற்பொருளான ‘பயணம்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
