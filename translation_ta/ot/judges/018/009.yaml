  yaml_path: translation/ot/judges/018/009.yaml
  text: And they said, “Rise up, and let us go up against them, for we have seen the land, and behold, it is very good. And you are keeping silent—do not be sluggish to go, to enter, to take possession of the land.”
translation:
  language: ta
  text: அவர்கள், “எழுந்திருங்கள்; நாம் அவர்களுக்கு எதிராகப் போவோம். அந்த நாட்டை நாங்கள் பார்த்தோம்; இதோ, அது மிகவும் நல்லது. நீங்கள் அமைதியாக இருக்கிறீர்கள்; அந்த நாட்டுக்குச் சென்று, அதில் நுழைந்து, அதைக் கைப்பற்றச் சுணங்காதீர்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֚וּמָ/ה
  choice: எழுந்திருங்கள்
  rationale: செயலில் இறங்குமாறு அழைக்கும் எபிரெய கட்டளையின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: וְ/נַעֲלֶ֣ה עֲלֵי/הֶ֔ם
  choice: நாம் அவர்களுக்கு எதிராகப் போவோம்
  rationale: עלה על என்பதன் பகைமை சார்ந்த சூழலைத் தெளிவாகக் காட்டுகிறது; தமிழில் தேவையற்ற நிலவியல் அர்த்தத்தைத் தவிர்க்கிறது.
- source_word: מַחְשִׁ֔ים
  choice: தயங்கிக்கொண்டிருக்கிறீர்கள்
  rationale: இங்கு மௌனமாக இருப்பதைவிடச் செயலின்றித் தாமதிப்பதே சூழலுக்குப் பொருத்தமான உட்பொருள்.
- source_word: אַל תֵּעָ֣צְל֔וּ
  choice: சுணங்காதீர்கள்
  rationale: சோம்பல் அல்லது மந்தத்தால் காலம் தாழ்த்தாதிருக்கச் சொல்லும் வினையின் வலிமையைச் சுருக்கமாகத் தருகிறது.
- source_word: לָ/לֶ֥כֶת לָ/בֹ֖א לָ/רֶ֥שֶׁת
  choice: சென்று, அதில் நுழைந்து, அதைக் கைப்பற்ற
  rationale: மூன்று எபிரெய வினையெச்சங்களின் தொடரையும் அவற்றின் முன்னேற்றத்தையும் பாதுகாக்கிறது.
