source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אֶל אֲחֵי/הֶ֔ם צָרְעָ֖ה וְ/אֶשְׁתָּאֹ֑ל וַ/יֹּאמְר֥וּ לָ/הֶ֛ם אֲחֵי/הֶ֖ם מָ֥ה אַתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/008.yaml
  text: Then they came to their brothers at Zorah and Eshtaol[a], and their brothers said to them[b], “What is with you?”
translation:
  language: ta
  text: பின்பு அவர்கள் சோராவிலும் எஸ்தாவோலிலும் இருந்த தங்கள் சகோதரர்களிடம்[a] வந்தார்கள். அவர்களுடைய சகோதரர்கள் அவர்களிடம், “உங்களிடம் என்ன செய்தி?”[b] என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் உறவினர்களிடம்.” எபிரெயத்தில் “சகோதரர்கள்” என்ற சொல் உடன்பிறந்தவர்களை மட்டுமல்லாமல், ஒரே குலம் அல்லது கோத்திரத்தைச் சேர்ந்த உறவினர்களையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயக் கேள்வி மிகச் சுருக்கமாகவும் விடுபட்ட கூறுகளுடனும் உள்ளது; சொல்லுக்குச் சொல், “என்ன, நீங்கள்?” அவர்களுடைய செய்தியையோ நிலைமையையோ விசாரிப்பதாக இது இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: பின்பு அவர்கள் வந்தார்கள்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை இயல்பான நவீனத் தமிழில் முன்னெடுக்கிறது; எளிய வருகை வினையையும் காக்கிறது.
- source_word: אֶל אֲחֵיהֶם
  choice: தங்கள் சகோதரர்களிடம்
  rationale: אָח என்பதன் நேரடி வடிவைத் தக்கவைக்கிறது; இச்சூழலில் அது உடன்பிறந்தவர்களை மட்டுமல்லாமல் குல அல்லது கோத்திர உறவினரையும் குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பு தரப்படுகிறது.
- source_word: צָרְעָה וְאֶשְׁתָּאֹל
  choice: சாராவிலும் எஸ்தாவோலிலும்
  rationale: இடப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன; எபிரெய வாக்கிய அமைப்பின்படி சகோதரர்கள் இருந்த இடங்களாக இயல்பாக இணைக்கப்பட்டுள்ளன.
- source_word: וַיֹּאמְרוּ לָהֶם אֲחֵיהֶם
  choice: அவர்களுடைய சகோதரர்கள் அவர்களிடம் ... என்று கேட்டார்கள்
  rationale: எபிரெயத்தில் வெளிப்படையாக உள்ள எழுவாயையும் பெறுநரையும் காக்கிறது; கேள்வியை அறிமுகப்படுத்துவதால் தமிழில் ‘கேட்டார்கள்’ இயல்பாக உள்ளது.
- source_word: מָה אַתֶּם
  choice: உங்களிடம் என்ன செய்தி?
  rationale: எபிரெயம் மிகச் சுருக்கமான, விடுபட்ட கூறுகளைக் கொண்ட கேள்வி. ஆய்வுப் பயணத்திலிருந்து திரும்பியவர்களின் தகவலைக் கேட்கும் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூலத்தின் சுருக்கமும் மாற்றுப் புரிதலும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
