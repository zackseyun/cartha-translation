translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயத்தின் சுருக்கமான இறுதிக் கேள்வி தமிழில் புரியும்படி வழங்கப்பட்டாலும், அதன் உண்மையான தெளிவின்மை அடிக்குறிப்பில் தக்கவைக்கப்பட்டுள்ளது.
