source:
  edition: WLC
  text: וַ/יִּקְרְא֤וּ שֵׁם הָ/עִיר֙ דָּ֔ן בְּ/שֵׁם֙ דָּ֣ן אֲבִי/הֶ֔ם אֲשֶׁ֥ר יוּלַּ֖ד לְ/יִשְׂרָאֵ֑ל וְ/אוּלָ֛ם לַ֥יִשׁ שֵׁם הָ/עִ֖יר לָ/רִאשֹׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/029.yaml
  text: And they called the name of the city Dan[a], after the name of Dan their father, who was born to Israel; however, the name of the city formerly was Laish.
translation:
  language: ta
  text: அவர்கள் அந்த நகருக்கு, இஸ்ரவேலுக்குப் பிறந்த தங்கள் தந்தையான தாணின் பெயரின்படி, தாண்[a] என்று பெயரிட்டார்கள். ஆனால், அந்த நகரின் பெயர் முன்பு லாயீஷ்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் மூதாதையான தாண்.’ எபிரெய மொழியில் ‘தந்தை’ என்பது உடனடி தந்தையை மட்டுமல்ல, முன்னோரையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם הָעִיר
  choice: அந்த நகருக்கு ... பெயரிட்டார்கள்
  rationale: קרא שׁם என்பதன் பொருள் ‘பெயரிடுதல்’. எபிரெய மொழிநடையைச் சொற்குச் சொல் பின்பற்றாமல், அதன் முழுப் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: דָּן
  choice: தாண்
  rationale: கோத்திர மூதாதையின் பெயரைத் தமிழ் வேதாகம மரபுக்கு ஏற்ற ஒலிபெயர்ப்பில் தருகிறது.
- source_word: בְּשֵׁם דָּן אֲבִיהֶם
  choice: தங்கள் தந்தையாகிய தாணின் பெயரால்
  rationale: בְּשֵׁם இங்கு ஒருவரின் பெயரை அடிப்படையாகக் கொண்டு பெயரிடுதலைக் குறிக்கிறது; אֲבִיהֶם என்பதன் நேரடிப் பொருளான ‘தங்கள் தந்தை’ பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר יוּלַּד לְיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்குப் பிறந்த
  rationale: இஸ்ரவேலுக்கு மகனாகப் பிறந்த தாணை அடையாளப்படுத்தும் தொடர்புச் சொற்றொடர்; மூலத்தில் உள்ள ‘இஸ்ரவேல்’ என்பதே வைக்கப்படுகிறது, ‘யாக்கோபு’ என்று விளக்கமாக மாற்றப்படவில்லை.
- source_word: וְאוּלָם
  choice: ஆனால்
  rationale: புதிய பெயருக்கும் முந்தைய பெயருக்கும் இடையிலான எதிர்மறைத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: לַיִשׁ
  choice: லாயீசு
  rationale: இடப்பெயர் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்படுகிறது.
- source_word: לָרִאשֹׁנָה
  choice: முன்பு
  rationale: நகரம் மறுபெயரிடப்படுவதற்கு முன்னிருந்த பெயரைக் குறிக்கும் காலப் பொருளைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
theological_decisions:
- issue: אֲבִיהֶם என்ற வம்சவழிக் குறிப்பு
  choice: தங்கள் தந்தை
  alternative: தங்கள் மூதாதை
  rationale: ‘தந்தை’ என்பது எபிரெயச் சொல்லின் நேரடிப் பொருள்; வம்சவழிச் சூழலில் அது தொன்மூதாதையையும் குறிக்கலாம். முதன்மை உரை மூலத்தின் குடும்ப உறவுச் சொல்லைத் தக்கவைக்கிறது; விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பெயரிடுதலைக் குறிக்கும் எபிரெயச் சொற்றொடர் தமிழில் இயல்பாக ‘நகருக்கு ... பெயரிட்டார்கள்’ என்று அமைக்கப்பட்டுள்ளது; வம்சவழிச் சொல்லின் உண்மையான பொருள் பரப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
