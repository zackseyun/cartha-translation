  text: וְ/אֵ֗לֶּה בָּ֚אוּ בֵּ֣ית מִיכָ֔ה וַ/יִּקְחוּ֙ אֶת פֶּ֣סֶל הָ/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/מַּסֵּכָ֑ה וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ הַ/כֹּהֵ֔ן מָ֥ה אַתֶּ֖ם עֹשִֽׂים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/018.yaml
  text: These men went into Micah’s house and took the carved image[a], the ephod, the household idols, and the cast image. Then the priest said to them, “What are you doing?”
translation:
  language: ta
  text: இந்த ஆட்கள் மீகாவின் வீட்டிற்குள் சென்று, செதுக்கப்பட்ட உருவத்தையும், ஏபோத்தையும்[a], வீட்டுத் தெய்வச் சிலைகளையும், வார்ப்புச் சிலையையும் எடுத்துக்கொண்டார்கள். அப்போது அந்த ஆசாரியன் அவர்களிடம், “நீங்கள் என்ன செய்கிறீர்கள்?” என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஏபோத்” என்பது வழிபாட்டுடன் தொடர்புடைய ஒரு பொருள். இச்சூழலில் அதன் துல்லிய வடிவமும் பயன்பாடும் உறுதியாகத் தெரியவில்லை.
    reason: cultural_term
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இந்த ஆட்கள்
  rationale: சொல்லுக்கு சொல் எனில் ‘இவர்கள்’; உடனடி சூழலில் முன்பு குறிப்பிடப்பட்ட ஆட்களைக் குறிக்கும் என்பதால், நவீன தமிழில் இயல்பாக ‘இந்த ஆட்கள்’ என வெளிப்படுத்தப்பட்டது.
- source_word: בָּאוּ בֵּית מִיכָה
  choice: மீகாவின் வீட்டிற்குள் சென்று
  rationale: בּוֹא என்பது வருதல்/செல்லுதல்/நுழைதல் எனச் சூழலுக்கேற்ப அமையும்; இங்கு வீட்டுக்குள் நுழையும் நிகழ்வை இயல்பான தமிழில் காட்டுகிறது.
- source_word: וַיִּקְחוּ
  choice: எடுத்துக்கொண்டார்கள்
  rationale: அடிப்படைப் பொருளான ‘எடுத்தார்கள்’ என்பதைக் காக்கிறது; சூழலில் பொருட்களைத் தம்வசப்படுத்தியதையும் இயல்பாக உணர்த்துகிறது, ஆனால் ‘கொள்ளையடித்தார்கள்’ என்று மிகைப்படுத்தவில்லை.
- source_word: פֶּסֶל
  choice: செதுக்கப்பட்ட உருவம்
  rationale: செதுக்கி உருவாக்கப்பட்ட வழிபாட்டு உருவைக் குறிக்கும் சொல்லின் உடற்கூறு பொருளைத் தெளிவாகக் காக்கிறது; அனைத்துப் பொருட்களையும் பொதுவாக ‘சிலைகள்’ என ஒன்றாக்கவில்லை.
- source_word: הָאֵפוֹד
  choice: ஏபோத்
  rationale: இது பண்டைய இஸ்ரவேலின் வழிபாட்டுடன் தொடர்புடைய தனிப்பட்ட பொருள்; ஒரே தமிழ்ச் சமமான சொல் இல்லாததால் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது. இச்சூழலில் அதன் துல்லிய வடிவம் அல்லது பயன்பாட்டை மொழிபெயர்ப்பில் தேவையின்றி நிர்ணயிக்கவில்லை.
- source_word: הַתְּרָפִים
  choice: வீட்டுத் தெய்வச் சிலைகள்
  rationale: குடும்பம் அல்லது வீட்டோடு தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கும் பன்மைச் சொல்லை வாசகர்களுக்குப் புரியுமாறு மொழிபெயர்க்கிறது; ‘தெராபீம்’ என்ற புரியாத ஒலிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: הַמַּסֵּכָה
  choice: வார்ப்புச் சிலை
  rationale: உலோகத்தை வார்த்து செய்யப்பட்ட உருவம் என்ற பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: וַיֹּאמֶר אֲלֵיהֶם הַכֹּהֵן
  choice: அப்போது அந்த ஆசாரியன் அவர்களிடம் ... என்று கேட்டான்
  rationale: தொடர்கதை வாவை ‘அப்போது’ என இயல்பாகக் காட்டுகிறது. கேள்வி உரையை அறிமுகப்படுத்துவதால் தமிழில் ‘கேட்டான்’ என்பது பொருத்தமானது.
- source_word: מָה אַתֶּם עֹשִׂים
  choice: நீங்கள் என்ன செய்கிறீர்கள்?
  rationale: எபிரெய நேரடிக் கேள்வியை எந்த இடவியல் அல்லது விளக்கச் சேர்க்கையும் இன்றி காக்கிறது.
theological_decisions:
- issue: சிலை வழிபாட்டுடன் தொடர்புடைய பல்வேறு பொருட்களை மொழிபெயர்த்தல்
  choice: ‘செதுக்கப்பட்ட உருவம்’, ‘ஏபோத்’, ‘வீட்டுத் தெய்வச் சிலைகள்’, ‘வார்ப்புச் சிலை’ என வேறுபாடுகளைப் பேணுதல்
  alternative: அனைத்தையும் பொதுவாக ‘சிலைகள்’ அல்லது ‘விக்கிரகங்கள்’ என மொழிபெயர்த்தல்
  rationale: எபிரெய உரை தனித்தனி வழிபாட்டுப் பொருட்களைப் பட்டியலிடுகிறது. அவற்றின் வேறுபாட்டைப் பேணுவது உரையின் வரலாற்று மற்றும் இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் காக்கிறது.
- issue: פֶּסֶל הָאֵפוֹד என்ற தொடரின் இலக்கணச் சுருக்கம்
  choice: சூழலில் மீண்டும் மீண்டும் வரும் நான்கு தனித்த பொருட்களின் பட்டியலுக்கு ஏற்ப ‘செதுக்கப்பட்ட உருவத்தையும், ஏபோத்தையும்’ எனப் பிரித்துக் காட்டுதல்
  alternative: ‘ஏபோத்தின் செதுக்கப்பட்ட உருவம்’ என ஒரே கூட்டுச் சொற்றொடராகக் கொள்ளுதல்
  rationale: இவ்வசனத்தின் எபிரெய வடிவத்தில் இணைப்புச்சொல் விடுபட்டதுபோல் தோன்றினாலும், நியாயாதிபதிகள் 18:17, 20 ஆகிய உடனடி இணை வசனங்கள் செதுக்கப்பட்ட உருவம், ஏபோத், தெராபீம், வார்ப்புச் சிலை ஆகிய நான்கு பொருட்களையும் தனித்தனியாகப் பட்டியலிடுகின்றன. ஆகவே பட்டியல் வாசிப்பு சூழலால் வலுவாக ஆதரிக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. ‘ஆசாரியன்’, ‘ஏபோத்’ போன்ற வேதாகமப் பண்பாட்டுச் சொற்கள் தேவையான இடங்களில் மட்டும் வைக்கப்பட்டுள்ளன; பொருட்களின் தனித்தன்மை காக்கப்பட்டுள்ளது.
