- from: அப்போது தாணியரின் குலத்தைச்[a] சேர்ந்த அறுநூறு பேர், சோராவிலிருந்தும் எஸ்தாவோலிலிருந்தும், போர் ஆயுதங்களை இடுப்பில் கட்டிக்கொண்டு[b] அங்கிருந்து புறப்பட்டார்கள்.
  to: அங்கிருந்து தாணியரின் குலத்தைச் சேர்ந்த அறுநூறு ஆண்கள் சோராவிலிருந்தும் எஷ்தாவோலிலிருந்தும் புறப்பட்டார்கள்; அவர்கள் போர் ஆயுதங்களை இடுப்பில் கட்டியிருந்தார்கள்.[a]
  rationale: மூலத்தில் இல்லாத காலச்சுட்டி நீக்கப்பட்டது. ஆண் படைவீரர் எண்ணிக்கையும் ஆயுதங்களுடன் ஆயத்தமாயிருந்த நிலையும்காக்கப்பட்டன. குலம்/குடும்பம் என்னும் மாற்று வாசிப்பை ஒரே அடிக்குறிப்பில் தெளிவாக வழங்கி, தேவையற்ற இரட்டை அடிக்குறிப்பைத் தவிர்த்துள்ளோம்.
