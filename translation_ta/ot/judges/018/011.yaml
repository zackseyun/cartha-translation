base_translation:
  language: en
  yaml_path: translation/ot/judges/018/011.yaml
  text: So six hundred men from the clan of the Danites set out from there[a], from Zorah and from Eshtaol[b], armed with weapons of war.
translation:
  language: ta
  text: அங்கிருந்து தாணியரின் குலத்தைச் சேர்ந்த அறுநூறு ஆண்கள் சோராவிலிருந்தும் எஷ்தாவோலிலிருந்தும் புறப்பட்டார்கள்; அவர்கள் போர் ஆயுதங்களை இடுப்பில் கட்டியிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘போர் ஆயுதங்களால் இடுப்புக்கச்சை கட்டியவர்களாய்.’ ‘தாணியரின் குலம்’ என்பதிலுள்ள எபிரெயச் சொல், கோத்திரத்துக்குள் உள்ள உறவுமுறைப் பிரிவைக் குறிக்கிறது; ‘குடும்பம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டார்கள்
  rationale: נסע என்பதன் கதைநடை வடிவம் முகாமைக் கலைத்துப் பயணத்தைத் தொடங்குவதைக் குறிக்கிறது. நவீனத் தமிழில் ‘புறப்பட்டார்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: இது எளிய இடச்சுட்டுச் சொல்; முந்தைய சூழலில் குறிப்பிடப்பட்ட இடத்திலிருந்து அவர்கள் சென்றதை நேரடியாகக் காட்டுகிறது.
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: தாணியரின் குலத்தைச் சேர்ந்த
  rationale: מִשְׁפָּחָה முழுக் கோத்திரத்தைக் காட்டிலும் சிறிய உறவுமுறைப் பிரிவைக் குறிக்கிறது; ஆகவே ‘குலம்’ பொருத்தமானது. הַדָּנִי என்பது தாண் மக்களைக் குறிக்கும் இனப்பெயர்.
- source_word: מִצָּרְעָה וּמֵאֶשְׁתָּאֹל
  choice: சோராவிலிருந்தும் எஸ்தாவோலிலிருந்தும்
  rationale: இவை இடப்பெயர்கள் என்பதால் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன. இரு பெயர்களோடும் ‘இலிருந்தும்’ வருவது எபிரெய முன்னிடைச்சொற்களின் மீளுரைப்பை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: அறுநூறு பேர்
  rationale: எண்ணுடன் வரும் אִישׁ இங்கு படைக்குச் செல்லும் வயது வந்த ஆண்களைக் குறிக்கிறது. சூழல் அதைத் தெளிவாக்குவதால் ‘பேர்’ என்பது தமிழில் இயல்பான எண்ணிக்கைச் சொல்; தேவையற்ற மீளுரையையும் தவிர்க்கிறது.
- source_word: חָגוּר
  choice: இடுப்பில் கட்டிக்கொண்டு
  rationale: חָגוּר என்பதன் அடிப்படைப் பொருள் ‘இடுப்பில் கட்டிய’ என்பதாகும். போர் ஆயுதங்களைத் தயாராக அணிந்திருந்த நிலையை மூலத்தின் உருவகத்துடன் காக்க இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כְּלֵי מִלְחָמָה
  choice: போர் ஆயுதங்கள்
  rationale: כְּלִי என்பது கருவி அல்லது சாதனம் என்ற பரந்த பொருளுடையது; போர் சூழலில் அது ஆயுதங்களையோ போர்ச் சாதனங்களையோ குறிக்கிறது. ‘போர் ஆயுதங்கள்’ மூலச் சொற்றொடரின் வலிமையைத் தக்கவைக்கிறது.
