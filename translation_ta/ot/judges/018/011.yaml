  source_fidelity: வரைவில் மிஷ்பகா என்பதற்கான ‘குலம்’ சரியானது; இடப்பெயர்களும் பயணித்தல் என்னும் வினைப்பொருளும் நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் ‘அப்போது’ என்பது மூலத்தில் வெளிப்படையாக இல்லை. மேலும், אִישׁ-ஐ ‘பேர்’ என மொழிபெயர்ப்பது எண்ணிக்கையைத் தருகிறதாயினும், இவ்வசனத்தின் ஆண் படைவீரர் குறிப்பு மங்குகிறது. חָגוּר என்பது ஆயுதங்களை வெறுமனே எடுத்துக்கொள்வதல்ல, இடுப்பில் கட்டி ஆயத்தமாயிருந்த நிலையைக் குறிக்கிறது.
  naturalness: ‘போர் ஆயுதங்களை இடுப்பில் கட்டிக்கொண்டு’ என்பது புரிந்துகொள்ளத்தக்கது; ஆனால் வாக்கியத்தில் அது புறப்படுதல் வினையுடன் இணைந்திருப்பதால் ஆயுதங்களைப் புறப்படும் தருணத்தில் கட்டிக்கொண்டார்கள் என்ற பொருளைத் தரலாம். ‘இடுப்பில் கட்டியிருந்த’ என்பது மூலத்தின் நிலைமைக் குறிப்பையும் இயல்பான தமிழையும் சிறப்பாக வெளிப்படுத்தும்.
