  naturalness: ‘நாட்டை உளவுபார்க்கச் சென்றிருந்த’ மற்றும் ‘வார்ப்புச் சிலை’ இயல்பான நவீனத் தமிழாக உள்ளன. ‘வாசலின் நுழைவிடம்’ புரியக்கூடியதாயினும் ‘வாசலின் நுழைவாயில்’ இங்கு சற்றே இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘எடுத்தார்கள்’ என்பது சூழலுக்குப் போதுமான நேரடி வினை; ‘எடுத்துக்கொண்டார்கள்’ தரும் கூடுதல் உடைமையாக்கத் தொனி தேவையில்லை.
