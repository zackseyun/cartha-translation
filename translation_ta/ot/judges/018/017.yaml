base_translation:
  language: en
  yaml_path: translation/ot/judges/018/017.yaml
  text: Then the five men who had gone to spy out the land went up[a], came there, and took the carved image, the ephod, the household gods, and the cast image[b], while the priest was standing at the entrance of the gate with the six hundred men armed with weapons of war.
translation:
  language: ta
  text: அப்போது, நாட்டை உளவுபார்க்கச் சென்றிருந்த அந்த ஐந்து பேரும் மேலே சென்று அங்கே வந்து, செதுக்கப்பட்ட சிலையையும் ஏபோத்தையும் குடும்பத் தெய்வங்களையும்[a] வார்ப்புச் சிலையையும்[b] எடுத்தார்கள். ஆசாரியன், போர் ஆயுதங்களைத் தரித்திருந்த அறுநூறு பேருடன் வாசலின் நுழைவாயிலில் நின்றுகொண்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘திராபீம்’; வீட்டில் வைக்கப்பட்ட வழிபாட்டு உருவங்கள் அல்லது குடும்பத் தெய்வங்களைக் குறிக்கும் சொல்.
    reason: lexical_alternative
  - marker: b
    text: 'பாரம்பரிய மொழிபெயர்ப்பு: ‘உருக்கப்பட்ட சிலை.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: மேலே சென்று
  rationale: עלה என்பதன் அடிப்படை இயக்கப் பொருளான ‘மேலே செல்’ என்பதைத் தக்கவைக்கிறது; வெறுமனே ‘சென்றார்கள்’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: הַהֹלְכִים לְרַגֵּל אֶת־הָאָרֶץ
  choice: நாட்டை உளவுபார்க்கச் சென்றிருந்த
  rationale: רגל இங்குள்ள இராணுவ முன்னாய்வு சூழலில் ‘உளவுபார்’ எனப் பொருள்படுகிறது; இது முன்பு நடந்த பணியென்பதை ‘சென்றிருந்த’ தெளிவாக்குகிறது.
- source_word: בָּאוּ שָׁמָּה
  choice: அங்கே வந்து
  rationale: எதற்குள் நுழைந்தார்கள் என்று எபிரெய உரை குறிப்பிடாததால், ‘உள்ளே நுழைந்து’ என்று மிகைப்படுத்தாமல் நேரடியாக மொழிபெயர்க்கிறது.
- source_word: הַפֶּסֶל
  choice: செதுக்கப்பட்ட சிலை
  rationale: פסל என்பது செதுக்கி உருவாக்கப்பட்ட உருவத்தைக் குறிக்கிறது; ‘விக்கிரகம்’ என்ற மதிப்பீட்டுச் சொல்லைவிட உருவாக்க முறையைத் தெளிவாகக் காட்டுகிறது.
- source_word: הָאֵפוֹד
  choice: ஏபோத்
  rationale: இணையான எளிய தமிழ்ச்சொல் இல்லாத தனிப்பட்ட வழிபாட்டுப் பொருளின் பெயர் என்பதால் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַתְּרָפִים
  choice: குடும்பத் தெய்வங்கள்
  rationale: வீட்டு வழிபாட்டோடு தொடர்புடைய தெய்வ உருவங்கள் அல்லது வழிபாட்டுப் பொருட்களைக் குறிக்கும் சொல்லை நவீன வாசகருக்குப் புரியுமாறு அளிக்கிறது; மூலப் பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַמַּסֵּכָה
  choice: வார்ப்புச் சிலை
  rationale: உருக்கிய பொருளை அச்சில் வார்த்து உருவாக்கப்பட்ட சிலை என்ற பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וְהַכֹּהֵן נִצָּב
  choice: ஆசாரியனோ ... நின்றுகொண்டிருந்தான்
  rationale: பொருட்கள் எடுக்கப்பட்டபோது ஒரே நேரத்தில் நிலவிய சூழலைத் தமிழ் தொடரமைப்பில் தெளிவாகக் காட்டுகிறது.
- source_word: פֶּתַח הַשַּׁעַר
  choice: வாசலின் நுழைவிடம்
  rationale: פתח மற்றும் שער ஆகிய இரு கூறுகளையும் சுருக்காமல் இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: הֶחָגוּר כְּלֵי הַמִּלְחָמָה
  choice: போர் ஆயுதங்களைத் தரித்திருந்த
  rationale: חגור என்பதிலுள்ள அணிந்து அல்லது கட்டிக்கொண்டு ஆயத்தமாயிருந்த நிலையையும், כלי המלחמה என்பதன் இராணுவப் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: תְּרָפִים என்பதன் தன்மை
  choice: குடும்பத் தெய்வங்கள்
  alternative: திராபீம் / குடும்ப வழிபாட்டுப் பொருட்கள்
  rationale: இவை தெய்வங்களாகக் கருதப்பட்ட வீட்டு வழிபாட்டு உருவங்கள் என்பதை வாசகருக்குத் தெரிவிக்கிறது; அவற்றின் துல்லிய வடிவம் உறுதியற்றிருப்பதால் மூலச் சொல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: இரு உருவங்களின் தயாரிப்பு வேறுபாடு
  choice: ‘செதுக்கப்பட்ட சிலை’ மற்றும் ‘வார்ப்புச் சிலை’ என்று வேறுபடுத்துதல்
  alternative: இரண்டையும் ‘விக்கிரகம்’ என மொழிபெயர்த்தல்
  rationale: פסל மற்றும் מסכה ஆகியவற்றில் மூல உரை காட்டும் தயாரிப்பு முறைகளின் வேறுபாட்டைத் தக்கவைக்கிறது; அவற்றின் மதத் தன்மையை மறுப்பதோ கூடுதலாக வரையறுப்பதோ இல்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதாகம வர்ணனைக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மேலே சென்று’ போன்ற எபிரெய இயக்கச் சொல்லும், செதுக்கப்பட்ட சிலை/வார்ப்புச் சிலை என்ற வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் [a] குறி தவறான இடத்தில் இருந்ததால், அதன் அடிக்குறிப்பு சார்ந்த ‘குடும்பத் தெய்வங்கள்’ என்பதருகே சரியாக வைக்கப்பட்டுள்ளது.
