base_translation:
  language: en
  yaml_path: translation/ot/judges/018/027.yaml
  text: So they took what Micah had made[a], along with the priest who belonged to him, and came against Laish, against a people quiet and secure. They struck them with the edge of the sword and burned the city with fire.
translation:
  language: ta
  text: அவர்கள் மீகா செய்தவற்றையும்[a] அவனுக்காக இருந்த ஆசாரியனையும் எடுத்துக்கொண்டு, லாயீசுக்கு எதிராக, அமைதியாகவும் பாதுகாப்பாகவும் இருந்த அந்த மக்களுக்கு எதிராக வந்தார்கள். அவர்கள் அவர்களை வாளின் கூரால் தாக்கி, நகரத்தைத் தீயால் எரித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது மீகா செய்த வழிபாட்டுப் பொருட்களைக் குறிக்கிறது; முந்தைய வசனங்களில் அவை சிலை, வார்ப்பிக்கப்பட்ட உருவம் முதலியவையாக விவரிக்கப்படுகின்றன.
    reason: contextual_clarification
lexical_decisions:
- source_word: וְהֵמָּה לָקְחוּ
  choice: அவர்கள் ... அழைத்துக்கொண்டு
  rationale: தனித்துச் சுட்டப்படும் பன்மைப் பெயர்ச்சொல்லின் வலியுறுத்தலை ‘அவர்கள்’ தக்கவைக்கிறது. பொருட்களையும் ஆசாரியனையும் ஒருசேரக் கொண்டு சென்ற சூழலில் ‘அழைத்துக்கொண்டு’ இயல்பான தமிழாக உள்ளது.
- source_word: אֵת אֲשֶׁר עָשָׂה מִיכָה
  choice: மீகா செய்தவற்றையும்
  rationale: எபிரெய உறவுநிலைத் தொடரை இயல்பாக மொழிபெயர்த்து, முந்தைய சூழலில் கூறப்பட்ட வழிபாட்டுப் பொருட்களின் பன்மைச் சுட்டையும் தக்கவைக்கிறது.
- source_word: וְאֶת הַכֹּהֵן אֲשֶׁר הָיָה לוֹ
  choice: அவனுக்குரிய ஆசாரியனையும்
  rationale: ‘அவனுக்கு இருந்த’ என்ற நேரடிப் பொருளிலுள்ள தொடர்பைச் சுருக்கமாகத் தருகிறது; ஆசாரியன் அடிமைபோல் சொந்தமானவன் என்ற தேவையற்ற பொருளைத் தவிர்க்கிறது.
- source_word: וַיָּבֹאוּ עַל לַיִשׁ
  choice: லாயீசுக்கு எதிராக வந்தார்கள்
  rationale: இராணுவச் சூழலில் עַל குறிக்கும் பகைமை நோக்கிய வருகையைத் தக்கவைக்கிறது; அடுத்த தாக்குதலை முன்கூட்டியே ஒரே வினையாகச் சுருக்கவில்லை.
- source_word: עַל עַם שֹׁקֵט וּבֹטֵחַ
  choice: அமைதியாகவும் பாதுகாப்பாகவும் இருந்த மக்களுடைய நகரமான
  rationale: שֹׁקֵט மற்றும் בֹטֵחַ ஆகியவற்றின் அமைதி, பாதுகாப்பு என்ற இரு கூறுகளையும் தக்கவைக்கிறது. தமிழில் இலக்கு நகரத்தையும் அதன் மக்களையும் தெளிவாக இணைக்கச் சொற்றொடர் அமைக்கப்பட்டுள்ளது.
- source_word: וַיַּכּוּ אוֹתָם
  choice: அவர்களை ... வெட்டி
  rationale: வாள் தொடர்பான தொடருடன் ‘வெட்டி’ இயல்பாக அமைகிறது; கொன்றார்கள் என்று வெளிப்படையாகக் கூறி נכה என்பதின் பரந்த பொருளை அளவுக்கு மீறி முடிவுசெய்யவில்லை.
- source_word: לְפִי חָרֶב
  choice: வாளின் முனையால்
  rationale: சொல்லுக்கு சொல் ‘வாளின் வாயால்’ என்ற எபிரெய மரபுத்தொடரின் இயல்பான தமிழ் இணையாகும்; வாளால் நிகழ்ந்த தாக்குதலின் தீவிரத்தைத் தருகிறது.
- source_word: וְאֶת הָעִיר שָׂרְפוּ בָאֵשׁ
  choice: நகரத்தைத் தீயால் எரித்தார்கள்
  rationale: ‘தீயால்’ என்பதை விடாமல் வைத்து, மூலத்தின் வெளிப்படையான கூறையும் அதன் வலிமையையும் தக்கவைக்கிறது.
