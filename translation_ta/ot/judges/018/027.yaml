revisions:
- from: அவர்கள் மீகா செய்தவற்றையும்[a] அவனுக்குரிய ஆசாரியனையும் அழைத்துக்கொண்டு, அமைதியாகவும் பாதுகாப்பாகவும் இருந்த மக்களுடைய நகரமான லாயீசுக்கு எதிராக வந்தார்கள். அவர்களை வாளின் முனையால் வெட்டி, நகரத்தைத் தீயால் எரித்தார்கள்.
  to: அவர்கள் மீகா செய்தவற்றையும்[a] அவனுக்காக இருந்த ஆசாரியனையும் எடுத்துக்கொண்டு, லாயீசுக்கு எதிராக, அமைதியாகவும் பாதுகாப்பாகவும் இருந்த அந்த மக்களுக்கு எதிராக வந்தார்கள். அவர்கள் அவர்களை வாளின் கூரால் தாக்கி, நகரத்தைத் தீயால் எரித்தார்கள்.
  rationale: The revision uses one inclusive verb for taking both the objects and the priest, avoids implying that the priest was owned by Micah, preserves the Hebrew’s repeated hostile ‘against,’ and renders the sword idiom without restricting the action to cutting or implying only the sword’s point. The existing contextual footnote remains accurately anchored to “மீகா செய்தவற்றை.”
