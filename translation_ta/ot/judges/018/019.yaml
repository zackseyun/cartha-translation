base_translation:
  language: en
  yaml_path: translation/ot/judges/018/019.yaml
  text: They said to him[a], “Be quiet; put your hand over your mouth, and come with us, and be to us a father and a priest. Is it better for you to be priest to the house of one man[c][b], or to be priest to a tribe and a clan in Israel?”
translation:
  language: ta
  text: அவர்கள் அவனிடம், “மௌனமாக இரு[a]; உன் கையை உன் வாயின்மேல் வை; எங்களோடு வா; எங்களுக்குத் தந்தையாகவும்[b] ஆசாரியனாகவும் இரு. ஒரே ஒரு மனிதனின் வீட்டாருக்கு ஆசாரியனாக இருப்பதா, அல்லது இஸ்ரவேலில் ஒரு கோத்திரத்துக்கும் ஒரு குலத்துக்கும்[c] ஆசாரியனாக இருப்பதா—எது உனக்குச் சிறந்தது?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அமைதியாக இரு” என்றும் மொழிபெயர்க்கலாம். எபிரெயக் கட்டளை பேசாமல் அமைதியாக இருக்கும்படி கூறுகிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “தந்தை” என்பது உயிரியல் உறவைக் குறிக்காமல், சமூக அல்லது சமயத் தலைமைக்குரிய பட்டமாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: cultural_note
  - marker: c
    text: “குடும்பம்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் ஒரு கோத்திரத்திற்குள் உள்ள உறவுமுறைச் சமூகக் குழுவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרֵשׁ
  choice: அமைதியாக இரு
  rationale: חרשׁ என்பதன் கட்டளை வடிவம் இங்கு பேசாமல் அமைதியாக இருக்கும்படி சொல்கிறது. நவீன தமிழில் இயல்பாகவும் நேரடியாகவும் இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: שִׂים יָדְךָ עַל־פִּיךָ
  choice: உன் கையை உன் வாயின்மேல் வைத்துக்கொண்டு
  rationale: அமைதியாக இருக்கும்படி குறிக்கும் உடல் சைகையை எபிரெய மூலத்தின் உருவகத்தோடு தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְהְיֵה לָנוּ לְאָב וּלְכֹהֵן
  choice: எங்களுக்குத் தந்தையாகவும் ஆசாரியனாகவும் இரு
  rationale: சமூக-சமயத் தலைமைப் பட்டமாக வரும் ‘தந்தை’ என்பதையும் ‘ஆசாரியன்’ என்பதையும் விளக்கவுரையாகச் சுருக்காமல் இரு வேறு பங்குகளாகப் பாதுகாக்கிறது.
- source_word: לְאָב
  choice: தந்தை
  rationale: உயிரியல் உறவை மட்டும் குறிக்காத பண்பாட்டுச் சிறப்புடைய பட்டத்தை நேரடியாகப் பாதுகாக்கிறது; ‘ஆலோசகர்’ அல்லது ‘தலைவர்’ என்று குறுக்கிப் பொருள் கொள்ளவில்லை.
- source_word: כֹהֵן
  choice: ஆசாரியன்
  rationale: כהן என்பதற்கான சூழலுக்கு ஏற்ற, வழக்கமான தமிழ்ச் சமயச் சொல்.
- source_word: הֲטוֹב
  choice: உனக்கு நல்லதா
  rationale: கேள்விக்குறியும் தொடர்ந்து வரும் இரு வாய்ப்புகளும் ஒப்பீட்டு நன்மையை உணர்த்துகின்றன. தமிழில் இரு வினாக்களின் அமைப்பே ‘எது மேல்’ என்ற ஒப்பீட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְבֵית אִישׁ אֶחָד
  choice: ஒரே ஒரு மனிதனின் வீட்டாருக்கு
  rationale: בית என்பதன் குடும்பம் அல்லது வீட்டார் என்ற கூட்டுப் பொருளைத் தெரிவிக்கிறது; ‘ஒரே ஒரு மனிதன்’ என்பது அடுத்துவரும் பெரிய சமூக அலகுகளுடனான வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: לְשֵׁבֶט וּלְמִשְׁפָּחָה בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில் ஒரு கோத்திரத்துக்கும் ஒரு குலத்துக்கும்
  rationale: שבט என்பதைக் ‘கோத்திரம்’ என்றும், அதற்குள் உள்ள உறவுமுறைச் சமூக அலகான משפחה என்பதைக் ‘குலம்’ என்றும் வேறுபடுத்திக் காட்டுகிறது.
- source_word: עִמָּנוּ
  choice: எங்களோடு
  rationale: நேரடியான, தெளிவான தமிழாக்கம்.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: அவர்கள் அவனிடம் … என்றார்கள்
  rationale: எபிரெய உரையாடல் அறிமுகத்தை இயல்பான தமிழ் மேற்கோள் அமைப்பில் தருகிறது.
theological_decisions:
- issue: ‘தந்தை’ என்பது உயிரியல் உறவா அல்லது ஒரு பட்டமா?
  choice: மூலத்திலுள்ள ‘தந்தை’ என்ற சொல்லைத் தக்கவைத்து, அதன் சமூக-சமயத் தலைமைப் பயன்பாட்டை அடிக்குறிப்பில் விளக்குதல்.
  alternative: ஆலோசகர்; ஆதரவாளர்; தலைவர்
  rationale: மூலத்தின் பண்பாட்டுச் சுமையுள்ள சொல்லைப் பாதுகாக்கிறது; உரை கூறுவதைக் காட்டிலும் குறுகிய நிறுவனம் சார்ந்த பொருளைத் திணிப்பதைத் தவிர்க்கிறது.
- issue: משפחה என்ற உறவுமுறைச் சமூக அலகின் மொழிபெயர்ப்பு
  choice: குலம்
  alternative: குடும்பம்
  rationale: ஒரு மனிதனின் வீட்டார், கோத்திரம், குலம் ஆகிய சமூக அளவுகளுக்கிடையிலான வேறுபாட்டைப் பாதுகாக்கிறது; நவீன ‘குடும்பம்’ என்ற குறுகிய பொருளோடு இதை ஒன்றாக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தந்தை’, ‘ஆசாரியன்’, ‘கோத்திரம்’, ‘குலம்’ ஆகிய சொற்கள் மூல உரையின் சமூக-சமய வேறுபாடுகளைப் பாதுகாக்கின்றன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கம் சேர்க்கப்படவில்லை.
