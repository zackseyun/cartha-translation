  register: நவீன தரமான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் dignified narrative நடை பயன்படுத்தப்பட்டுள்ளது. மூன்று கேள்விகளின் நேரடியான, விசாரணைத் தொனி காக்கப்பட்டுள்ளது; எபிரேய மொழியின் இரு நீள்விடுபட்ட மரபுத்தொடர்களில் உள்ள பொருள் வாய்ப்புகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
