base_translation:
  language: en
  yaml_path: translation/ot/judges/018/003.yaml
  text: While they were near Micah’s house[a], they recognized the voice of the young Levite. So they turned aside there and said to him[b], “Who brought you here? What are you doing in this place? And what do you have here?”
translation:
  language: ta
  text: அவர்கள் மீகாவின் வீட்டருகே இருந்தபோது, அந்த லேவிய இளைஞனின் குரலை அடையாளம் கண்டார்கள். எனவே அவர்கள் வழி விலகி அங்கே சென்று அவனிடம், “உன்னை இங்கே கொண்டுவந்தது யார்? இந்த இடத்தில் நீ என்ன செய்துகொண்டிருக்கிறாய்?[a] இங்கே உனக்கு என்ன இருக்கிறது?[b]” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ இங்கே என்ன செய்துகொண்டிருக்கிறாய்?” எபிரேயத்தில் சொற்பட, “இதில் நீ என்ன செய்துகொண்டிருக்கிறாய்?” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இங்கே உனக்கு என்ன காரியம்?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה עִם בֵּית מִיכָה
  choice: அவர்கள் மீகாவின் வீட்டருகே இருந்தபோது
  rationale: עִם இங்கு வீட்டோடு உடனிருப்பதைக் குறிக்காமல், அதன் அருகாமையில் இருப்பதைக் குறிக்கிறது. ‘வீட்டருகே இருந்தபோது’ என்பது சூழ்நிலையையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: הִכִּירוּ
  choice: அடையாளம் கண்டுகொண்டார்கள்
  rationale: נכר என்பதன் ஹிஃபில் வடிவம் இங்கு ஒரு குரலை அடையாளம் காண்பதைக் குறிக்கிறது; அந்தத் தொடர்பைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֶת קוֹל הַנַּעַר הַלֵּוִי
  choice: அந்த லேவிய இளைஞனின் குரலை
  rationale: קוֹל என்பது இங்கு ‘குரல்’; נַעַר வயது அல்லது இளமை நிலையைக் குறிக்கும் ‘இளைஞன்’; הַלֵּוִי அவனை லேவியன் என அடையாளப்படுத்துகிறது.
- source_word: וַיָּסוּרוּ שָׁם
  choice: எனவே அவர்கள் அங்கே திரும்பிச் சென்று
  rationale: סור பயணப் பாதையிலிருந்து விலகி அந்த இடத்தை நோக்கித் திரும்பிச் செல்வதைக் குறிக்கிறது. ‘திரும்பிச் சென்று’ தமிழில் இயக்கத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִי הֱבִיאֲךָ הֲלֹם
  choice: உன்னை இங்கே கொண்டுவந்தது யார்?
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘கொண்டுவருதல்’ என்ற காரணவினைப் பொருளையும், הֲלֹם ‘இங்கே’ என்ற இடப்பொருளையும் தருகிறது.
- source_word: וּמָה אַתָּה עֹשֶׂה בָּזֶה
  choice: இந்த இடத்தில் நீ என்ன செய்துகொண்டிருக்கிறாய்?
  rationale: בָּזֶה சொற்பட ‘இதில்’ என்றாலும் இங்கு இடத்தைக் குறிக்கும் நீள்விடுபட்ட சொற்றொடராகப் புரிந்துகொள்ளப்படுகிறது. முதன்மை உரை இயல்பான இடப்பொருளைத் தருகிறது; சொற்படியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וּמַה לְּךָ פֹה
  choice: இங்கே உனக்கு என்ன இருக்கிறது?
  rationale: இந்த எபிரேய மரபுத்தொடர் ஒருவருக்கு ஓர் இடத்தில் உள்ள உடைமை, தொடர்பு அல்லது காரியம் ஆகியவற்றைக் கேட்கலாம். நேரடியான concrete wording-ஐ முதன்மை உரை காக்கிறது; ‘என்ன காரியம்’ என்ற விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
