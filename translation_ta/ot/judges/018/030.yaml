base_translation:
  language: en
  yaml_path: translation/ot/judges/018/030.yaml
  text: Then the sons of Dan set up for themselves the carved image, and Jonathan the son of Gershom, son of Moses,[a] he and his sons were priests for the tribe of the Danites until the day of the exile of the land.
translation:
  language: ta
  text: தாணின் சந்ததியினர் அந்தச் செதுக்கப்பட்ட சிலையைத் தங்களுக்காக நிறுவினார்கள். மோசேயின்[a] மகனான கேர்சோமின் மகன் யோனத்தானும் அவனுடைய மகன்களும், நாடு நாடுகடத்தப்பட்ட நாள் வரை தாணியர் கோத்திரத்துக்கு ஆசாரியர்களாக இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய உரை: “மோசே”; மசோரா மரபில் தொங்கியுள்ள “நூன்” எழுத்தால், மரபுவழி வாசிப்பு “மனாசே” என அமைகிறது.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקִימוּ
  choice: நிறுவினார்கள்
  rationale: קום என்பதன் ஹிஃபில் வடிவம் இங்கு ஒன்றை நிலைநிறுத்துதல் அல்லது நிறுவுதல் என்ற பொருளைத் தருகிறது; சிலை வழிபாட்டுக்காக அமைக்கப்பட்ட சூழலுக்கு “நிறுவினார்கள்” இயல்பாகப் பொருந்துகிறது.
- source_word: לָהֶם
  choice: தங்களுக்காக
  rationale: தாணின் சந்ததியினர் தங்கள் சொந்தப் பயன்பாட்டுக்காகச் செய்தார்கள் என்ற தற்சுட்டுப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּנֵי דָן
  choice: தாணின் சந்ததியினர்
  rationale: எபிரெய மொழியின் “தாணின் மகன்கள்” என்ற குலமரபுச் சொல்லை, நவீனத் தமிழில் தவறாகப் புரிந்துகொள்ளப்படாத வகையில் இயல்பாக எடுத்துரைக்கிறது.
- source_word: הַפָּסֶל
  choice: செதுக்கப்பட்ட சிலை
  rationale: פֶּסֶל என்பது செதுக்கி உருவாக்கப்பட்ட உருவத்தைக் குறிக்கிறது; அதன் உருவாக்க முறையையும் வழிபாட்டுச் சூழலையும் இச்சொற்றொடர் காக்கிறது.
- source_word: וִיהוֹנָתָן
  choice: யோனத்தான்
  rationale: எபிரெயப் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: בֶּן גֵּרְשֹׁם בֶּן מְהוּא
  choice: மோசேயின் மகனான கேர்சோமின் மகன்
  rationale: மூலத்தின் தலைமுறைத் தொடர்பைத் தெளிவான தமிழ் தொடரமைப்பில் தருகிறது; மோசே/மனாசே என்ற உரைவேறுபாடு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וּבָנָיו
  choice: அவனுடைய மகன்களும்
  rationale: யோனத்தானோடு அவனுடைய மகன்களும் வாக்கியத்தின் எழுவாய்கள் என்பதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: כֹהֲנִים
  choice: ஆசாரியர்களாக
  rationale: வழிபாட்டுப் பணியைக் குறிக்கும் כהנים என்பதற்கான வழக்கமான, தெளிவான தமிழ்ச் சொல்.
- source_word: לְשֵׁבֶט הַדָּנִי
  choice: தாணியர் கோத்திரத்துக்கு
  rationale: தாண் இனக்குழுவுக்காக அவர்கள் ஆசாரியப் பணி செய்தார்கள் என்ற பொருளையும், שֵׁבֶט என்பதன் கோத்திரக் கருத்தையும் காக்கிறது.
- source_word: עַד יוֹם גְּלוֹת הָאָרֶץ
  choice: நாடு சிறைப்பட்டுப் போன நாள் வரை
  rationale: எபிரெயச் சொற்றொடரின் சுருக்கமான, வழக்கத்திற்கு மாறான வடிவைத் தக்கவைத்து, எந்தச் சிறையிருப்பு குறிக்கப்படுகிறது என்பதை விளக்கமாகத் தீர்மானிக்காமல் விடுகிறது.
theological_decisions:
- issue: யோனத்தானின் மூதாதை யார் என்ற உரைவேறுபாடு
  choice: மோசே
  alternative: மனாசே
  rationale: மெய்யெழுத்து அடிப்படையிலான எபிரெய உரை “மோசே” என்ற வாசிப்பை ஆதரிக்கிறது; மசோரா மரபின் தொங்கவிடப்பட்ட நூன் எழுத்து “மனாசே” என்ற மரபுவழி வாசிப்பை உருவாக்குகிறது. உரைமரபு காத்துள்ள இந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல், “மோசே” முதன்மை உரையிலும் மாற்று வாசிப்பு அடிக்குறிப்பிலும் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. “நாடு சிறைப்பட்டுப் போனது” என்ற மூலத்தின் உருவகமும் வரலாற்றுக் குறிப்பின் தெளிவின்மையும் விளக்கமாகத் தீர்க்கப்படாமல் காக்கப்பட்டுள்ளன.
