base_translation:
  language: en
  yaml_path: translation/ot/judges/018/004.yaml
  text: He said to them[a], “Thus and so Micah did for me, and he hired me, and I became his priest.”
translation:
  language: ta
  text: அவன் அவர்களிடம், “மீகா எனக்கு இன்னின்னவற்றைச் செய்தான்[a]; அவன் என்னைக் கூலிக்கு அமர்த்தினான்; நான் அவனுடைய ஆசாரியனானேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடி எபிரெய மரபுத்தொடர்: “இப்படியும் அப்படியும்”; முன்பு விவரிக்கப்பட்ட செயல்களை மீண்டும் சொல்லாமல் இது சுருக்கமாகக் குறிப்பிடுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: அவன் அவர்களிடம் … என்றான்
  rationale: எபிரெய மொழியின் கதைத் தொடரையும் பேச்சின் முகவரியையும் இயல்பான தமிழ் நேரடி உரை அமைப்பில் தருகிறது.
- source_word: כָּזֹה וְכָזֶה
  choice: இன்னின்னவற்றை
  rationale: முன்பு விவரிக்கப்பட்ட செயல்களை மீண்டும் பட்டியலிடாமல் தொகுத்துச் சொல்லும் எபிரெய மரபுத்தொடரின் உறுதியற்ற சுருக்கப் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: עָשָׂה לִי
  choice: எனக்கு … செய்தார்
  rationale: מִיכָה செய்தவை பேசுபவருக்காக அல்லது அவரைச் சார்ந்து செய்யப்பட்டவை என்பதை לִי உடன் உள்ள עשה தெரிவிக்கிறது.
- source_word: מִיכָה
  choice: மீகா
  rationale: தனிப்பெயர் நவீனத் தமிழ் ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப தரப்படுகிறது.
- source_word: וַיִּשְׂכְּרֵנִי
  choice: என்னைக் கூலிக்கு அமர்த்தினார்
  rationale: שׂכר என்பதன் கூலிக்குப் பணியமர்த்துதல் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וָאֱהִי לוֹ לְכֹהֵן
  choice: நான் அவருடைய ஆசாரியனானேன்
  rationale: היה இங்கு புதிய பொறுப்பில் நுழைந்ததைச் சுட்டுவதால் ‘ஆனேன்’ எனவும், לוֹ உடனான ஆசாரியப் பணியை ‘அவருடைய ஆசாரியன்’ எனவும் தருகிறது.
theological_decisions:
- issue: ஒழுங்குமுறைக்கு முரணான வழிபாட்டுச் சூழலில் ஆசாரியப் பணியின் தன்மை
  choice: அவருடைய ஆசாரியனானேன்
  alternative: அவருக்கு ஆசாரியனாக இருந்தேன்
  rationale: לוֹ לְכֹהֵן என்பது மீகாவுக்குரிய ஆசாரியப் பணியைக் குறிக்கிறது. மொழிபெயர்ப்பு அந்த ஏற்பாட்டை விவரிக்கிறது; அது சட்டபூர்வமானது அல்லது இறைவனால் அங்கீகரிக்கப்பட்டது என்று தீர்ப்பளிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘இன்னின்னவற்றை’ என்ற சொல் மூலமொழியின் சுருக்க மரபுத்தொடரை இயல்பாகக் காக்கிறது; ‘ஆசாரியன்’ என்பது כֹהֵן என்பதற்கான நிலையான வேதாகமத் தமிழ்ச் சொல்.
