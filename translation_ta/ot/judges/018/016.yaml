  text: וְ/שֵׁשׁ מֵא֣וֹת אִ֗ישׁ חֲגוּרִים֙ כְּלֵ֣י מִלְחַמְתָּ֔/ם נִצָּבִ֖ים פֶּ֣תַח הַ/שָּׁ֑עַר אֲשֶׁ֖ר מִ/בְּנֵי דָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/016.yaml
  text: And six hundred men[a], armed with their weapons of war, were standing at the entrance of the gate; these were from the sons of Dan.
translation:
  language: ta
  text: தங்கள் போர் ஆயுதங்களைத் தரித்திருந்த அறுநூறு பேர் வாயிலின் நுழைவிடத்தில் நின்றுகொண்டிருந்தார்கள்; அவர்கள் தாணின் மக்களைச் சேர்ந்தவர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் தாண் குலத்தார்.” சொல்லர்த்தமாக, “அவர்கள் தாணின் மக்களிலிருந்து வந்தவர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁשׁ מֵאוֹת אִישׁ
  choice: அறுநூறு பேர்
  rationale: எண்ணிக்கைக்குப் பின் வரும் אִישׁ இங்கு கூட்டுப்பொருளில் மனிதர்களைக் குறிக்கிறது. தமிழில் ‘அறுநூறு பேர்’ என்பது இயல்பான வடிவம்; தொடக்க וְ வசனத் தொடர்ச்சியில் இணைப்பைத் தரினும், தனிவசனத் தமிழில் கட்டாயமாக வெளிப்படுத்த வேண்டியதில்லை.
- source_word: חֲגוּרִים
  choice: தரித்திருந்த
  rationale: இச்சொல்லின் அடிப்படைப் பொருள் ‘இடுப்பில் கட்டியிருந்த’ என்பதாகும்; போர் ஆயுதங்களோடு வரும் இச்சூழலில் ஆயுதம் ஏந்தி ஆயத்தமாயிருந்ததைக் குறிக்கும் ‘தரித்திருந்த’ என்பது இயல்பாகவும் பொருளுக்குத் துல்லியமாகவும் உள்ளது.
- source_word: כְּלֵי מִלְחַמְתָּם
  choice: போர் ஆயுதங்களை
  rationale: כְּלִי என்பது கருவி அல்லது சாதனம் என்ற பரந்த பொருளுடையது; மִלְחָמָה உடன் இங்கு போருக்கான ஆயுதங்களைக் குறிக்கிறது. ‘போர் ஆயுதங்கள்’ மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: נִצָּבִים
  choice: நின்றுகொண்டிருந்தார்கள்
  rationale: எபிரெயப் பங்கேற்புவினை அந்தக் காட்சியில் அவர்கள் தொடர்ந்து நின்றிருந்த நிலையைச் சித்தரிக்கிறது; தமிழ் தொடர்நிலை வடிவம் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פֶּתַח הַשַּׁעַר
  choice: வாயிலின் நுழைவிடத்தில்
  rationale: פֶּתַח என்பது திறப்பு அல்லது நுழைவிடம்; הַשַּׁעַר என்பது வாயில். இரு பெயர்ச்சொற்களையும் வேறுபடுத்திக் காட்டும் தெளிவான தமிழ் வடிவம் இது.
- source_word: אֲשֶׁר מִבְּנֵי דָן
  choice: அவர்கள் தாணின் மக்களைச் சேர்ந்தவர்கள்
  rationale: இத்தொடர் அந்த அறுநூறு பேரை தாணின் சந்ததியினராக அடையாளப்படுத்துகிறது. ‘தாணின் மக்களைச் சேர்ந்தவர்கள்’ என்பது எபிரெய உறவுமுறைச் சொல்லைத் தக்கவைத்தபடி தமிழில் புரியுமாறு கூறுகிறது.
