source:
  edition: WLC
  text: כְּ/בֹאֲ/כֶ֞ם תָּבֹ֣אוּ אֶל עַ֣ם בֹּטֵ֗חַ וְ/הָ/אָ֨רֶץ֙ רַחֲבַ֣ת יָדַ֔יִם כִּֽי נְתָנָ֥/הּ אֱלֹהִ֖ים בְּ/יֶדְ/כֶ֑ם מָקוֹם֙ אֲשֶׁ֣ר אֵֽין שָׁ֣ם מַחְס֔וֹר כָּל דָּבָ֖ר אֲשֶׁ֥ר בָּ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/010.yaml
  text: When you go[a], you will come to a secure people, and the land is broad; for God has given it into your hand[b], a place where there is no lack of anything that is in the land.
translation:
  language: ta
  text: நீங்கள் அங்கே போகும்போது, பாதுகாப்பாக வாழும் மக்களிடம் வந்துசேருவீர்கள்[a]. அந்த நிலம் விசாலமானது[b]. ஏனெனில், கடவுள் அதை உங்கள் கையில் கொடுத்திருக்கிறார். அது அந்த நாட்டில் உள்ள எந்தப் பொருளுக்கும் பற்றாக்குறை இல்லாத இடம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாதுகாப்புணர்வுடன் வாழும் மக்களிடம்,” அல்லது “எச்சரிக்கையின்றி வாழும் மக்களிடம்.” எபிரெயச் சொல், தாங்கள் பாதுகாப்பாக இருப்பதாக உணர்ந்து வாழ்ந்த மக்களை விவரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “கைகள் அகன்ற நிலம்.” இது விசாலமான நிலத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/בֹאֲ/כֶם ... תָּבֹאוּ
  choice: நீங்கள் அங்கே போகும்போது ... வந்துசேருவீர்கள்
  rationale: எபிரெய வினையெச்சமும் முற்றுவினையும் வருகை/சென்றடைதலை அடுத்தடுத்து வலியுறுத்துகின்றன. தமிழில் இயல்பாகவும் சூழலில் இலக்கைச் சென்றடையும் பொருளுடனும் இருக்க இவ்வாறு தரப்பட்டுள்ளது.
- source_word: עַם בֹּטֵחַ
  choice: பாதுகாப்பாக வாழும் மக்கள்
  rationale: בֹּטֵחַ என்பது அவர்கள் கொண்டிருந்த பாதுகாப்புணர்வைக் குறிக்கிறது. ‘எச்சரிக்கையற்ற மக்கள்’ என்பது சூழலுக்குப் பொருந்தினாலும், எபிரெயச் சொல்லைவிட அதிக விளக்கத்தைச் சேர்க்கும்.
- source_word: וְהָאָרֶץ רַחֲבַת יָדַיִם
  choice: அந்த நிலம் விசாலமானது
  rationale: ‘கைகள் அகன்றது’ என்ற சொல்லமைப்பு பரந்த, இடவசதி மிகுந்த நிலத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர். அதன் பொருளை இயல்பான தமிழில் ‘விசாலமானது’ எனத் தருகிறது.
- source_word: כִּי נְתָנָהּ אֱלֹהִים בְּיֶדְכֶם
  choice: ஏனெனில், கடவுள் அதை உங்கள் கையில் கொடுத்திருக்கிறார்
  rationale: முற்றுவினை, பேசுவோரின் பார்வையில் உறுதிசெய்யப்பட்ட கொடையாக இதைக் காட்டுகிறது. ‘உங்கள் கையில்’ என்பது ஆளுகை அல்லது கைப்பற்றுதலைக் குறிக்கும் மூலமொழி உருவகத்தைப் பாதுகாக்கிறது.
- source_word: מָקוֹם אֲשֶׁר אֵין שָׁם מַחְסוֹר
  choice: எதற்கும் குறைவில்லாத இடம்
  rationale: מַחְסוֹר குறைவு அல்லது பற்றாக்குறையைக் குறிக்கிறது; இத்தொடர் நிலத்தின் வளத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: כָּל דָּבָר אֲשֶׁר בָּאָרֶץ
  choice: அந்த நாட்டில் உள்ள எதற்கும்
  rationale: இங்கு הָאָרֶץ என்பது முழு பூமியையல்ல, பேசப்பட்டுவரும் குறிப்பிட்ட நாட்டுப்பகுதியையே சூழலின்படி குறிக்கிறது.
theological_decisions:
- issue: אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: தெய்வங்கள் / ஒரு தெய்வம்
  rationale: אֱלֹהִים இங்கு ஒருமை வினையுடன் வந்து, ஒற்றை இறைவரைக் குறிக்கிறது. ஆகவே ‘கடவுள்’ என்பது இலக்கணத்துக்கும் சூழலுக்கும் ஏற்ற மொழிபெயர்ப்பு.
- issue: நிலம் ஏற்கெனவே கொடுக்கப்பட்டதாகக் கூறப்படும் உறுதி
  choice: கொடுத்திருக்கிறார்
  alternative: கொடுக்கிறார்
  rationale: எபிரெய முற்றுவினை, பேசுவோரின் நம்பிக்கையின்படி நிகழ்வு உறுதிசெய்யப்பட்டதாக முன்வைக்கிறது; அதனை எதிர்கால வாக்குறுதியாக மட்டும் மாற்றாமல் இவ்வடிவம் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பாதுகாப்பாக வாழும்’ என்பது மூலத்தின் தெளிவின்மையை ஓரளவு காக்கிறது; சூழல்சார்ந்த ‘எச்சரிக்கையற்ற’ என்ற வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது. ‘உங்கள் கையில்’ என்ற மூலமொழி உருவகம் தமிழிலும் புரிந்துகொள்ளத்தக்கதால் பாதுகாக்கப்பட்டுள்ளது.
