  source_fidelity: 'மூலத்தின் முக்கியக் கருத்துகள் காக்கப்பட்டுள்ளன: பாதுகாப்பாக வாழும் மக்கள், விசாலமான நிலம், கடவுள் அதை அவர்களுடைய கையில் ஒப்புக்கொடுத்திருப்பதாகச் சொல்லப்படுதல், மற்றும் அந்த நிலத்தின் மிகுதியான வளம். எனினும், இறுதி வாக்கியத்தில் உள்ள “அது, அந்த நாட்டில் உள்ள எதற்கும் குறைவில்லாத இடம்” என்ற அமைப்பு தமிழில் தடுமாற்றமாக உள்ளது; ‘குறைவு’ என்பது இடத்துக்கல்ல, அங்குள்ள பொருட்களுக்குப் பற்றாக்குறை இல்லை என்பதைக் குறிக்க வேண்டும்.'
