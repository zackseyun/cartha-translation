  source_fidelity: 'மூல எபிரெய உரையின் முக்கிய கூறுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: மனோவா வெள்ளாட்டுக் குட்டியையும் தானியக் காணிக்கையையும் எடுத்தது, பாறையின்மேல் யெகோவாவுக்குச் செலுத்தியது, மனோவாவும் மனைவியும் தொடர்ந்து பார்த்துக்கொண்டிருந்தது ஆகியவை தெளிவாக உள்ளன. וּמַפְלִא לַעֲשׂוֹת என்பதிலுள்ள மறைமுக எழுவாயை முதன்மை உரை வெளிப்படையாகப் பெயரிடாமல் வைத்திருப்பது மூலத்தின் சுருக்கத்தைப் பாதுகாக்கிறது.'
