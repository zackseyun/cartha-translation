source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מָנ֜וֹחַ אֶת גְּדִ֤י הָ/עִזִּים֙ וְ/אֶת הַ/מִּנְחָ֔ה וַ/יַּ֥עַל עַל הַ/צּ֖וּר לַֽ/יהוָ֑ה וּ/מַפְלִ֣א לַ/עֲשׂ֔וֹת וּ/מָנ֥וֹחַ וְ/אִשְׁתּ֖/וֹ רֹאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/019.yaml
  text: So Manoah took the young goat and the grain offering[a], and offered them on the rock to Yahweh, and he did a wondrous thing while Manoah and his wife were watching.
translation:
  language: ta
  text: மனோவா அந்த வெள்ளாட்டுக் குட்டியையும் தானியக் காணிக்கையையும் எடுத்து, அவற்றைப் பாறையின்மேல் யெகோவாவுக்குப் பலியாகச் செலுத்தினான். மனோவாவும் அவன் மனைவியும் பார்த்துக்கொண்டிருக்கையில், அதிசயமான செயல் ஒன்றைச் செய்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யெகோவாவின் தூதர் அதிசயமான செயல் ஒன்றைச் செய்தார்.” எபிரெய உரை எழுவாயை வெளிப்படையாக மீண்டும் குறிப்பிடவில்லை; எனினும் சூழல் யெகோவாவின் தூதரையே சுட்டுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: גְּדִי הָעִזִּים
  choice: வெள்ளாட்டுக் குட்டி
  rationale: இளம் ஆட்டைக் குறிக்கும் எபிரெயச் சொல்லை இயல்பான நவீனத் தமிழில் அளிக்கிறது; பலியிடப்படும் விலங்கு என்ற பொருளையும் காக்கிறது.
- source_word: הַמִּנְחָה
  choice: தானியக் காணிக்கை
  rationale: இந்தப் பலிச் சூழலில் மִנְחָה தானியத்தால் செலுத்தப்படும் காணிக்கையைக் குறிப்பதால், பொதுவான ‘காணிக்கை’ என்பதைவிடத் துல்லியமாக உள்ளது.
- source_word: וַיַּעַל עַל הַצּוּר לַיהוָה
  choice: அவற்றைப் பாறையின்மேல் யெகோவாவுக்குப் பலியாகச் செலுத்தினான்
  rationale: பலியிடும் சூழலில் עלה என்பதன் ‘பலியாக ஏறச்செய்தல்/செலுத்துதல்’ என்ற பொருளை இயல்பாகத் தருகிறது; வெள்ளாட்டுக் குட்டியும் காணிக்கையும் இணைந்து குறிப்பிடப்படுவதால் ‘அவற்றை’ என வழங்கப்பட்டுள்ளது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: יהוה என்ற இறைப்பெயரைத் தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் வெளிப்படையாகக் கொடுக்கிறது.
- source_word: וּמַפְלִא לַעֲשׂוֹת
  choice: அதிசயமான செயல் ஒன்றைச் செய்தார்
  rationale: פלא என்பதன் வியப்பூட்டும் செயல் என்ற கருத்தைக் காக்கிறது. தமிழ் வினையில் எழுவாயை வெளிப்படையாக மறுபடியும் பெயரிடாமல் விடுவதால், எபிரெய உரையின் சுருக்கமும் எழுவாய் குறித்த தெளிவின்மையும் ஓரளவு பாதுகாக்கப்படுகின்றன.
- source_word: רֹאִים
  choice: பார்த்துக்கொண்டிருக்கையில்
  rationale: எபிரெயப் பங்கேற்புவினை காட்டும் தொடர்ச்சியான பார்த்தல் என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: וּמַפְלִא לַעֲשׂוֹת என்பதன் மறைமுக எழுவாய்
  choice: முதன்மை உரையில் எழுவாயின் பெயரைச் சேர்க்காமல், ‘அதிசயமான செயல் ஒன்றைச் செய்தார்’ என்று வழங்கப்பட்டது.
  alternative: ‘யெகோவாவின் தூதர் அதிசயமான செயல் ஒன்றைச் செய்தார்’ என்று எழுவாயை வெளிப்படையாகக் குறிப்பிடுதல்; அல்லது ‘அதிசயமான ஒன்று நிகழ்ந்தது’ என்று ஆளற்ற வாக்கியமாக்குதல்.
  rationale: எபிரெய வாக்கியம் எழுவாயை மீண்டும் வெளிப்படையாகக் குறிப்பிடவில்லை. சூழல் யெகோவாவின் தூதரையே சுட்டினாலும், அவருடைய பெயரை முதன்மை உரையில் சேர்ப்பது மூலத்தில் உள்ள சுருக்கத்தையும் உண்மையான தெளிவின்மையையும் நீக்கிவிடும்; ஆளற்ற வாக்கியம் செய்பவரைக் குறிக்கும் ஒருமை வினையின் வலிமையை இழக்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘பலியாகச் செலுத்தினான்’ என்பது சடங்குச் சூழலைத் தெளிவாக்குகிறது; இறுதி வாக்கியத்தில் எழுவாயைத் தமிழின் இயல்பான விடுபட்ட வடிவில் வைத்ததால் மூலத்தின் இறையியல் மற்றும் இலக்கணத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
