id: JDG.13.10
reference: Judges 13:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/תְּמַהֵר֙ הָֽ/אִשָּׁ֔ה וַ/תָּ֖רָץ וַ/תַּגֵּ֣ד לְ/אִישָׁ֑/הּ וַ/תֹּ֣אמֶר אֵלָ֔י/ו הִנֵּ֨ה נִרְאָ֤ה אֵלַ/י֙ הָ/אִ֔ישׁ אֲשֶׁר בָּ֥א בַ/יּ֖וֹם אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/010.yaml
  text: So the woman hurried and ran and told her husband[a], and said to him, “Look, the man who came to me that day has appeared to me.”
translation:
  language: ta
  text: அந்தப் பெண் விரைந்து ஓடி, தன் கணவனிடம் செய்தியைத் தெரிவித்து, அவனிடம், “இதோ, அன்று[a] என்னிடம் வந்த அந்த மனிதர் எனக்குத் தோன்றினார்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சில நாள்களுக்கு முன்பு.” எபிரெயத் தொடர் சொல்லுக்குச் சொல் “அந்த நாளில்” என்று இருந்து, முந்தைய வருகையைக் குறிப்பிடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: விரைந்து
  rationale: מהר என்பதன் அவசரச் செயலை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: וַתָּרָץ
  choice: ஓடி
  rationale: רוץ உடல்ரீதியாக ஓடுவதைக் குறிக்கிறது; முந்தைய ‘விரைந்து’ என்பதிலிருந்து தனித்த வினையாகப் பேணப்பட்டுள்ளது.
- source_word: וַתַּגֵּד
  choice: செய்தியைத் தெரிவித்து
  rationale: Hiphil வடிவிலுள்ள נגד இங்கு ‘சொல்/தெரிவி’ என்று பொருள் தருகிறது; தொடர்ச்சியான ‘சொன்னாள் ... என்றாள்’ என்ற செயற்கையான மறுபடியுரைத்தலைத் தவிர்த்து, அறிக்கையிடும் நுண்ணுணர்வை வெளிப்படுத்துகிறது.
- source_word: לְאִישָׁהּ
  choice: தன் கணவனிடம்
  rationale: இல்லறச் சூழலில் אִישׁ + மூன்றாம் நபர் பெண்பால் ஒருமை பின்னொட்டு இயல்பாக ‘அவளுடைய கணவன்’ என்பதைக் குறிக்கிறது; தமிழில் எழுவாயை நோக்கிய ‘தன்’ இயல்பானது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை உடனடியாக ஈர்க்கும் எபிரெய இடைச்சொல்லின் உரையாடல் வலிமையை கண்ணியமான நவீனத் தமிழில் பேணுகிறது.
- source_word: נִרְאָה אֵלַי
  choice: எனக்குத் தோன்றினார்
  rationale: ראה என்பதன் Niphal வடிவம் இங்கு ‘தோன்று/காட்சியளி’ என்ற பொருளில் உள்ளது; மனிதரைக் குறிப்பதால் மரியாதைப் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָאִישׁ
  choice: அந்த மனிதர்
  rationale: முன்னர் வந்த நபரைச் சுட்டும் definite noun; பின்னணியில் உள்ள அவரது அடையாளத்தை இவ்வசனத்தில் முன்கூட்டியே சேர்க்காமல் பெண்ணின் சொற்பார்வையைப் பேணுகிறது.
- source_word: אֲשֶׁר בָּא בַיּוֹם אֵלַי
  choice: அன்று என்னிடம் வந்த
  rationale: சொல்லுக்குச் சொல் ‘அந்த நாளில்/நாளில் என்னிடம் வந்த’ எனும் எபிரெயத் தொடர் முந்தைய வருகையைச் சுட்டுகிறது; ‘அன்று’ இயல்பான தமிழாகவும் அதன் பின்னோக்கிய சுட்டையும் பேணுவதாகவும் உள்ளது.
theological_decisions:
- issue: பெண்ணின் பேச்சில் הָאִישׁ என்பவரின் அடையாளம்
  choice: அந்த மனிதர்
  alternative: தூதர் / ஆண்டவருடைய தூதர்
  rationale: விரிவான சூழல் அவரை ஆண்டவருடைய தூதர் என்று அடையாளப்படுத்தினாலும், இங்கு பெண் அவரை ‘மனிதர்’ என்றே குறிப்பிடுகிறாள். மொழிபெயர்ப்பு இந்த உடனடிச் சொற்பார்வையைப் பேணி, முழுமையான இறையியல் அடையாளத்தை வசனத்திற்குள் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. וַתְּמַהֵר மற்றும் וַתָּרָץ ஆகிய இரு அவசர வினைகளும் ‘விரைந்து ஓடி’ எனத் தனித்தனியாகப் பேணப்பட்டுள்ளன. அடிக்குறிக் குறி அது விளக்கும் ‘அன்று’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
