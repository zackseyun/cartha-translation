base_translation:
  language: en
  yaml_path: translation/ot/judges/013/006.yaml
  text: Then the woman came and said to her husband[a], “A man of God came to me, and his appearance was like the appearance of an angel of God, very fearsome. I did not ask him where he was from[b], and he did not tell me his name.”
translation:
  language: ta
  text: அந்தப் பெண் தன் கணவனிடம் வந்து, “தேவனுடைய மனிதர் ஒருவர் என்னிடம் வந்தார். அவருடைய தோற்றம் தேவனுடைய தூதரின் தோற்றம்போல் மிகவும் அச்சத்திற்குரியதாக இருந்தது.[a] அவர் எங்கிருந்து வந்தவர் என்று நான் அவரிடம் கேட்கவில்லை; அவரும் தமது பெயரை என்னிடம் சொல்லவில்லை” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அச்சத்திற்குரியதாக” என்பதை “அச்சமும் பெருவியப்பும் ஏற்படுத்துவதாக” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் தீவிரமான அச்சமும் வியப்பும் கலந்த உணர்வைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: கதையில் ஏற்கெனவே அறிமுகமான மனோவாவின் மனைவியைக் குறிக்கும் எபிரெய definite வடிவத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לְאִישָׁהּ
  choice: தன் கணவனிடம்
  rationale: திருமணச் சூழலில் אִישָׁהּ என்பதன் இயல்பான பொருள் ‘அவளுடைய கணவன்’; தமிழ் தற்சுட்டுப் பயன்பாட்டில் ‘தன் கணவன்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதர் ஒருவர்
  rationale: ‘தேவனுடைய மனிதர்’ என்ற எபிரெய பட்டத்தைப் பேணுவதோடு, אִישׁ என்பதில் குறிப்புச் சுட்டு இல்லாததை ‘ஒருவர்’ வெளிப்படுத்துகிறது.
- source_word: בָּא אֵלַי
  choice: என்னிடம் வந்தார்
  rationale: வினையையும் திசையைக் குறிக்கும் சொற்றொடரையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וּמַרְאֵהוּ
  choice: அவருடைய தோற்றம்
  rationale: מַרְאֶה என்பது காணக்கூடிய தோற்றத்தைக் குறிக்கிறது; மரியாதை ஒருமை இச்சூழலுக்கு ஏற்றது.
- source_word: כְּמַרְאֵה מַלְאַךְ הָאֱלֹהִים
  choice: தேவனுடைய தூதரின் தோற்றம்போல்
  rationale: மூலத்தில் இருமுறை வரும் ‘தோற்றம்’ என்ற கருத்தைப் பேணுகிறது. ‘தூதர்’ என்பது מַלְאַךְ என்பதின் அடிப்படைப் பொருளையும் இங்குள்ள விண்ணுலகத் தூதர் சார்ந்த பொருளையும் தாங்குகிறது; தமிழில் குறிப்பிட்ட/குறிப்பிடாத வேறுபாட்டை வற்புறுத்தாமல் விடுகிறது.
- source_word: נוֹרָא מְאֹד
  choice: மிகவும் அச்சத்திற்குரியதாக
  rationale: נוֹרָא வெளிப்படுத்தும் தீவிரமான அச்சமும் வியப்பும் கலந்த உணர்வில் அச்சக் கூறைத் தெளிவாகப் பேணுகிறது.
- source_word: אֵי מִזֶּה הוּא
  choice: அவர் எங்கிருந்து வந்தவர்
  rationale: அவருடைய பிறப்பிடம் அல்லது வந்த இடத்தை விசாரிக்கும் எபிரெய மரபுத்தொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: וְאֶת שְׁמוֹ לֹא הִגִּיד לִי
  choice: அவரும் தமது பெயரை என்னிடம் சொல்லவில்லை
  rationale: הִגִּיד என்பதன் ‘சொல்/தெரிவி’ என்ற பொருளை உரையாடல் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: מַלְאַךְ הָאֱלֹהִים என்ற வருகையாளரின் அடையாளம்
  choice: தேவனுடைய தூதர்
  alternative: தேவதூதர் ஒருவர் / தேவனுடைய அந்தத் தூதர்
  rationale: இந்த வசனத்தில் பெண் வருகையாளரை முதலில் ‘தேவனுடைய மனிதர்’ என்று அழைத்து, அவரது தோற்றத்தை தேவனுடைய தூதரின் தோற்றத்தோடு ஒப்பிடுகிறாள். ‘தேவனுடைய தூதர்’ என்பது அவரை இக்கட்டத்திலேயே முழுமையாக அடையாளப்படுத்தாமல், சொற்களின் பொருளையும் கதையின் படிப்படியான வெளிப்பாட்டையும் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘தேவனுடைய மனிதர்’, ‘தேவனுடைய தூதர்’ ஆகியவை மூலத்தின் சொற்பிணைப்பையும் கதையில் நிலவும் அடையாளத் தெளிவின்மையையும் பேணுகின்றன; மரியாதை ஒருமை வருகையாளரைப் பற்றிய பெண்ணின் பேச்சுக்கு ஏற்றதாகப் பயன்படுத்தப்பட்டுள்ளது.
