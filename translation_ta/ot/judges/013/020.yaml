  text: וַ/יְהִי֩ בַ/עֲל֨וֹת הַ/לַּ֜הַב מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ הַ/שָּׁמַ֔יְמָ/ה וַ/יַּ֥עַל מַלְאַךְ יְהוָ֖ה בְּ/לַ֣הַב הַ/מִּזְבֵּ֑חַ וּ/מָנ֤וֹחַ וְ/אִשְׁתּ/וֹ֙ רֹאִ֔ים וַ/יִּפְּל֥וּ עַל פְּנֵי/הֶ֖ם אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/020.yaml
  text: And when the flame went up from the altar toward heaven[a], the angel of Yahweh went up in the flame of the altar, while Manoah and his wife were watching[b]; and they fell on their faces to the ground.
translation:
  language: ta
  text: பலிபீடத்திலிருந்து சுடர் வானத்தை நோக்கி எழும்பியபோது, யாவேயின் தூதர்[a] பலிபீடத்தின் சுடரில் மேலே சென்றார். மனோவாவும் அவருடைய மனைவியும் அதைப் பார்த்துக்கொண்டிருந்தார்கள்; அவர்கள் தரையில் முகங்குப்புற விழுந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் செய்தியாளர்.” இதற்கான எபிரெயச் சொல் “தூதர்” அல்லது “செய்தியாளர்” என இருவிதமாகவும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, “அவர்கள் தங்கள் முகங்களின்மேல், தரையை நோக்கி விழுந்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַעֲלוֹת
  choice: எழும்பியபோது
  rationale: இந்த எபிரெயக் கட்டமைப்பு நிகழ்வின் நேரத்தை அறிமுகப்படுத்துகிறது. ‘அது நிகழ்ந்தது’ என்ற மரபுத்தொடரைச் சொற்சொல்லாகக் கொண்டுவராமல், இயல்பான தமிழ் கதைநடையில் காலத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַלַּהַב
  choice: சுடர்
  rationale: לַהַב என்பது தீச்சுடரை அல்லது கொழுந்துவிட்டு எரியும் தீயைக் குறிக்கிறது. ‘சுடர்’ இங்கு காட்சியின் தெளிவையும் உயர்ந்த நடையையும் காக்கிறது.
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: பலிபீடத்திலிருந்து
  rationale: சொற்சொல்லாக ‘பலிபீடத்தின் மேலிருந்து’ என்ற பொருள் இருந்தாலும், மேல்நோக்கிய இயக்கத்தை வினை ஏற்கெனவே காட்டுவதால் ‘பலிபீடத்திலிருந்து’ என்பது இயல்பான தமிழாக உள்ளது.
- source_word: הַשָּׁמַיְמָה
  choice: வானத்தை நோக்கி
  rationale: திசையைக் குறிக்கும் எபிரெய வடிவம் வானத்தை நோக்கிய இயக்கத்தைக் காட்டுகிறது; இலக்கை அடைந்ததாக மிகைப்படுத்தாமல் அந்தத் திசையை மொழிபெயர்ப்பு காக்கிறது.
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאָךְ என்பது தூதர் அல்லது செய்தியாளர் என்று பொருள்படலாம். இக்கதையில் இயற்கைக்கு அப்பாற்பட்டவர் என்பது தெளிவாக இருந்தாலும், அவருடைய இறையியல் அடையாளத்தை மொழிபெயர்ப்பு தீர்மானிக்காமல் எபிரெயப் பெயரிடலைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான YHWH-ஐ பட்டப்பெயராக மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּלַהַב הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் சுடரில்
  rationale: בְּ இங்கு இருப்பிட அல்லது உடன்நிகழ்வு உறவைக் காட்டுகிறது. தூதர் சுடருக்குள் அல்லது சுடரோடு மேலே சென்ற காட்சியை மேலதிக விளக்கமின்றி ‘சுடரில்’ என்பதால் காக்க முடிகிறது.
- source_word: וּמָנוֹחַ וְאִשְׁתּוֹ רֹאִים
  choice: மனோவாவும் அவருடைய மனைவியும் அதைப் பார்த்துக்கொண்டிருந்தார்கள்
  rationale: எபிரெயப் பங்கேற்புவினை தொடர்ந்து நடந்த பார்வையைக் குறிக்கிறது. ‘பார்த்துக்கொண்டிருந்தார்கள்’ அதன் நீடித்த தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם אָרְצָה
  choice: அவர்கள் தரையில் முகங்குப்புற விழுந்தார்கள்
  rationale: எபிரெய மரபுத்தொடரின் உடல் நிலையும் தரையை நோக்கிய இயக்கமும் இயல்பான நவீன தமிழில் வெளிப்படுகின்றன; சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: מַלְאַךְ יְהוָה என்பவரின் அடையாளம்
  choice: ‘யாவேயின் தூதர்’ என்று மொழிபெயர்த்து, இவர் தேவதூதரா, தெய்வீக வெளிப்பாடா என்பதைக் குறித்துத் தீர்ப்பளிக்காமல் விடுதல்
  alternative: ‘யாவேயின் செய்தியாளர்’ என்று மொழிபெயர்த்தல் அல்லது இவரை ஒரு குறிப்பிட்ட தெய்வீக நபராக விளக்குதல்
  rationale: எபிரெய உரை இவரை YHWH-இன் தூதர்/செய்தியாளர் என்று குறிப்பிடுகிறது; ஆனால் அவருடைய துல்லியமான இறையியல் அடையாளத்தை இவ்வசனம் தனியே முடிவு செய்யவில்லை. எனவே உரையிலுள்ள பதற்றமும் திறந்த தன்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சுடர்,’ ‘பலிபீடம்,’ ‘யாவே’ ஆகிய சொற்கள் வேதாகமச் சூழலின் உயர்ந்த நடையைத் தக்கவைக்கின்றன; தேவையற்ற பழந்தமிழ் வடிவங்கள் தவிர்க்கப்பட்டுள்ளன.
