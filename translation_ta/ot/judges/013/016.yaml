base_translation:
  language: en
  yaml_path: translation/ot/judges/013/016.yaml
  text: And the angel of Yahweh said to Manoah[a], “If you detain me, I will not eat your food. But if you prepare a burnt offering[b], offer it up to Yahweh.” For Manoah did not know that he was the angel of Yahweh.
translation:
  language: ta
  text: யாவேயின் தூதர் மனோவாவிடம், “நீ என்னைத் தங்கவைத்தால், உன் உணவை நான் சாப்பிடமாட்டேன்.[a] ஆனால் நீ தகனபலியை ஆயத்தப்படுத்தினால், அதை யாவேக்குச் செலுத்து.[b]” என்றார். ஏனெனில் அவர் யாவேயின் தூதர் என்பதை மனோவா அறிந்திருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ப்பொருளில், “உன் அப்பத்தை நான் சாப்பிடமாட்டேன்.” இங்கு “அப்பம்” என்பது பொதுவாக உணவு அல்லது விருந்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நீ தகனபலியைச் செய்தால், அதை யாவேக்குச் செலுத்து” என்றும் மொழிபெயர்க்கலாம். பலியை ஆயத்தப்படுத்துவதற்கும் அதைச் செலுத்துவதற்கும் எபிரெயத்தில் வெவ்வேறு வினைச்சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: யெகோவாவின் தூதர்
  rationale: מַלְאַךְ என்பதற்கு ‘தூதர்’ அல்லது ‘தேவதூதர்’ என்று பொருள் கொள்ளலாம். இக்கதையில் இயற்கைக்கு அப்பாற்பட்ட இறைத்தூதர் குறிக்கப்படுகிறார்; ‘யெகோவாவின் தூதர்’ என்பது மூலத்தின் சொல்லமைப்பையும் அதன் அடையாளம் சார்ந்த இறையியல் பதற்றத்தையும் காக்கிறது.
- source_word: תַּעְצְרֵנִי
  choice: நீ என்னைத் தங்கவைத்தாலும்
  rationale: עצר இங்கு ஒருவரைப் போகவிடாமல் தடுத்து வைத்திருப்பதைச் சுட்டுகிறது. உணவு ஆயத்தமாகும் வரை விருந்தினரைத் தங்கும்படி மனோவா கேட்ட சூழலில், ‘தங்கவைத்தாலும்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: לֹא אֹכַל בְּלַחְמֶךָ
  choice: உன் உணவை நான் சாப்பிடமாட்டேன்
  rationale: לֶחֶם என்பதன் நேர்ப்பொருள் ‘அப்பம்’; ஆனால் இங்கு அது பொதுவாக உணவு அல்லது விருந்தைக் குறிக்கும் ஆகுபெயராக உள்ளது.
- source_word: תַּעֲשֶׂה עֹלָה
  choice: நீ தகனபலியை ஆயத்தம் செய்தால்
  rationale: עשה பலியுடன் வரும்போது அதைச் செய்தல் அல்லது ஆயத்தப்படுத்துதல் என்று பொருள்படும். அடுத்த வினை பலியைச் செலுத்துவதைத் தனியே குறிப்பிடுவதால், இரு செயல்களுக்கிடையேயான வேறுபாடு காக்கப்படுகிறது.
- source_word: עֹלָה
  choice: தகனபலி
  rationale: முழுவதுமாக எரிக்கப்பட்டு புகையாக மேலெழும் பலியைக் குறிக்கும் வழக்கமான தமிழ் வேதாகமச் சொல்.
- source_word: לַיהוָה תַּעֲלֶנָּה
  choice: அதை யெகோவாவுக்குச் செலுத்த வேண்டும்
  rationale: עלה என்பதன் causative வடிவம் עֹלָה உடன் பலியை மேலே ஏறச்செய்தல், அதாவது பலியாகச் செலுத்துதல் என்று பொருள்படும்; ‘செலுத்த வேண்டும்’ என்பது எபிரெய வாக்கியத்தின் வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: כִּי לֹא יָדַע מָנוֹחַ
  choice: ஏனெனில் ... மனோவா அறிந்திருக்கவில்லை
  rationale: כִּי இங்கு முந்தைய உரையாடலை விளக்கும் கதைசொல்லியின் காரணக் குறிப்பை அறிமுகப்படுத்துகிறது.
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: அவர் யெகோவாவின் தூதர் என்பதை
  rationale: הוּא ஆண்பால் ஒருமைச் சுட்டுப்பெயரை ‘அவர்’ என்று இயல்பாகக் காட்டி, மனோவா அறியாதிருந்த அடையாளத்தைத் தெளிவுபடுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பான ‘யெகோவா’ என்று வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. பட்டப்பெயரான ‘கர்த்தர்’ என்பதைப் பயன்படுத்தாமல் பெயராகவே வழங்கப்படுகிறது; நவீனத் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: מַלְאַךְ என்பதன் அடையாளம்
  choice: தூதர்
  alternative: தேவதூதர்
  rationale: ‘தூதர்’ என்பது சொல்லின் அடிப்படைப் பொருளையும், இக்கதை படிப்படியாக வெளிப்படுத்தும் அந்த நபரின் அடையாளம் குறித்த பதற்றத்தையும் காக்கிறது; ‘தேவதூதர்’ என்பது அதை முன்கூட்டியே முழுமையாகத் தீர்மானிக்கக்கூடும்.
- issue: תַּעֲלֶנָּה என்பதன் வாக்கிய வலிமை
  choice: செலுத்த வேண்டும்
  alternative: செலுத்து
  rationale: இவ்வடிவம் சூழலில் அறிவுறுத்தல் அல்லது கட்டளைப் பொருள் தர முடியும். தமிழில் ‘வேண்டும்’ அதைப் பிரதிபலிக்கிறது; இது யெகோவாவுக்கே பலி செலுத்தப்பட வேண்டும் என்ற கருத்தைக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தகனபலி’ போன்ற நிலைபெற்ற வேதாகமச் சொல் துல்லியத்திற்காகத் தக்கவைக்கப்பட்டுள்ளது. மரியாதை ஒருமை இயல்பாகப் பயன்படுத்தப்பட்டாலும், மூலத்தின் அடையாளத் தெளிவின்மை தீர்த்துவிடப்படவில்லை.
