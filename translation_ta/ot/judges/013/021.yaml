reference: Judges 13:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/לֹא יָ֤סַף עוֹד֙ מַלְאַ֣ךְ יְהוָ֔ה לְ/הֵרָאֹ֖ה אֶל מָנ֣וֹחַ וְ/אֶל אִשְׁתּ֑/וֹ אָ֚ז יָדַ֣ע מָנ֔וֹחַ כִּֽי מַלְאַ֥ךְ יְהוָ֖ה הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/021.yaml
  text: And the angel of Yahweh did not appear again to Manoah and to his wife[a]. Then Manoah knew that he was the angel of Yahweh.
translation:
  language: ta
  text: யாவேயின் தூதர் மனோவாவுக்கும் அவரது மனைவிக்கும் மறுபடியும் தோன்றவில்லை.[a] அப்போது மனோவா, அவர் யாவேயின் தூதர் என்பதை அறிந்துகொண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாவேயின் வானதூதர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ‘தூதர்’ அல்லது ‘வானதூதர்’ என இருவிதமாகப் பொருள்படும்; இச்சூழலில் அது இயற்கைக்கு அப்பாற்பட்ட ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַף עוֹד ... לְהֵרָאֹה
  choice: மறுபடியும் தோன்றவில்லை
  rationale: יָסַף + עוֹד என்ற மரபுத்தொடர் இனி அல்லது மீண்டும் நிகழாததைக் குறிக்கிறது; לְהֵרָאֹה என்பதற்கு இச்சூழலில் இயல்பான தமிழ் ‘தோன்றுதல்’.
- source_word: מַלְאַךְ יְהוָה
  choice: யெகோவாவின் தூதர்
  rationale: מַלְאַךְ என்பதன் அடிப்படைப் பொருள் ‘தூதர்’; இக்கதையில் இயற்கைக்கு அப்பாற்பட்ட நபரைக் குறித்தாலும், ‘தூதர்’ என்ற சொல் எபிரெயச் சொல்லின் உண்மையான பொருள் விரிவையும் அடையாளம் குறித்த பதற்றத்தையும் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருப்பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் தனிப்பெயராகக் காட்டுகிறது; நவீன தமிழில் பரவலாக அறியப்படும் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אֶל מָנוֹחַ וְאֶל אִשְׁתּוֹ
  choice: மனோவாவுக்கும் அவருடைய மனைவிக்கும்
  rationale: மீண்டும் வரும் אֶל முன்னிடைச்சொல்லின் இணை அமைப்பை இயல்பான தமிழ் வேற்றுமை உருபுகளால் பிரதிபலிக்கிறது.
- source_word: אָז יָדַע מָנוֹחַ
  choice: அப்போது ... மனோவா அறிந்துகொண்டார்
  rationale: אָז நிகழ்வுகளின் தொடர்ச்சியில் ஏற்பட்ட உணர்தலைக் குறிக்கிறது; יָדַע இங்கு புதிதாக அடையாளம் கண்டுகொண்ட பொருளில் வருகிறது.
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: அவர் யெகோவாவின் தூதர் என்பதை
  rationale: הוּא முன்பு தோன்றிய ஆண் நபரையே சுட்டுகிறது; ‘அவர்’ என்பது மரியாதையான, இயல்பான தமிழ் ஆள்சுட்டு வடிவம்.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைத் திருப்பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல் பெயராகவே காக்கிறது. ‘யெகோவா’ தமிழ் வாசகர்களிடையே நிலைபெற்ற பெயர்வடிவம்; ‘யாவே’ மூல உச்சரிப்புக்கு அருகான மாற்றாகும்.
- issue: מַלְאַךְ יְהוָה என்பவரின் அடையாளம்
  choice: யெகோவாவின் தூதர்
  alternative: யெகோவாவின் வானதூதர்
  rationale: ‘வானதூதர்’ என்று வெளிப்படையாகச் சொல்வது מַלְאַךְ என்பதிலுள்ள ‘தூதர்/செய்தியாளர்’ என்ற பொருள் விரிவைச் சுருக்கும். வசனம் கூறுவதைத் தாண்டி அந்த நபரின் துல்லியமான தெய்வீக அடையாளத்தைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. ‘அவருடைய’ மற்றும் மரியாதைப் பன்மை வினைமுற்றுகள் நபர்களைக் குறிப்பிடும் இயல்பான தமிழ் மரபுக்கு ஏற்ப அமைந்துள்ளன.
