  source_fidelity: 'எபிரெய மூலத்தின் அனைத்து கூறுகளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: குறிப்பிட்ட பெண் ஒரு மகனைப் பெற்றாள், அவனுக்குச் சிம்சோன் என்று பெயரிட்டாள், சிறுவன் வளர்ந்தான், யாவே அவனை ஆசீர்வதித்தார். הָאִשָּׁה-வின் குறிப்புத்தன்மையும், הַנַּעַר-இன் வளர்ச்சி-சூழலுக்கேற்ற பொருளும் பாதுகாக்கப்படுகின்றன.'
