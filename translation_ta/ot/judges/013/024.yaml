  terminology: “சிம்சோன்” தமிழ் வேதாகம வழக்கில் நிலைபெற்ற பெயர்வடிவம். יהוה-க்கு “யாவே” எனத் தனிப்பட்ட திருநாமத்தை ஒலிபெயர்ப்பது வழங்கப்பட்ட மொழிபெயர்ப்புக் கொள்கையுடனும் மூலத்துடனும் ஒத்துள்ளது. “ஆசீர்வதித்தார்” ברך என்பதன் இறையியல் வலிமையைச் சரியாகக் காக்கிறது.
