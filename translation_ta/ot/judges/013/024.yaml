base_translation:
  language: en
  yaml_path: translation/ot/judges/013/024.yaml
  text: And the woman bore a son and called his name Samson. And the boy grew, and Yahweh blessed him.
translation:
  language: ta
  text: அந்தப் பெண் ஒரு மகனைப் பெற்றெடுத்து, அவனுக்குச் சிம்சோன் என்று பெயரிட்டாள். அந்தப் பையன் வளர்ந்தான்; யாவே அவனை ஆசீர்வதித்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: பெற்றெடுத்து
  rationale: ילד என்பதன் Qal wayyiqtol வடிவம்; குழந்தைப் பிறப்பைக் குறிக்கும் இயல்பான தமிழ் வினை.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: எபிரெய உரை நேரடியாக ‘அந்தப் பெண்’ எனக் கூறி, முன்பு குறிப்பிடப்பட்ட மனோவாவின் மனைவியைச் சுட்டுகிறது; இவ்வசனத்தில் இல்லாத ‘மனைவி’ என்பதைச் சேர்க்கவில்லை.
- source_word: בֵּן
  choice: ஒரு மகனை
  rationale: பிறப்புச் சூழலில் ஆண் குழந்தையைக் குறிக்கும் இயல்பான தமிழ் இணைச்சொல்.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: அவனுக்குப் ... என்று பெயரிட்டாள்
  rationale: எபிரெயப் பெயரிடும் மரபுத்தொடரின் பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שִׁמְשׁוֹן
  choice: சிம்சோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயரெழுத்தாக்கம்.
- source_word: וַיִּגְדַּל
  choice: வளர்ந்தான்
  rationale: இச்சூழலில் גדל சிறுவனின் உடல் மற்றும் வயது வளர்ச்சியைக் குறிக்கிறது; ‘பெரியவனானான்’ என்ற மிகைவாசிப்பைத் தவிர்க்கிறது.
- source_word: הַנַּעַר
  choice: அந்தப் பையன்
  rationale: נער என்பதற்கு வயது வரம்பு விரிந்திருந்தாலும், பிறப்பைத் தொடர்ந்து வரும் இச்சூழலில் ‘பையன்’ பொருத்தமானது.
- source_word: וַיְבָרְכֵהוּ
  choice: அவனை ஆசீர்வதித்தார்
  rationale: ברך என்பதன் இறையியல் நிறைவையும் நேரடிப் பொருளையும் ‘ஆசீர்வதித்தார்’ காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தின் நான்கு மெய்யெழுத்துகளான יהוה-ஐ ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைத் திருநாமம் நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது; ‘யாவே’ என்பது சாத்தியமான பண்டைய உச்சரிப்பை அடிப்படையாகக் கொண்ட தமிழ் வடிவம்.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான கதைநடை. எபிரெய வாக்கியங்களின் தொடர்ச்சியைப் பாதுகாத்தபடியே, ‘பெயரிட்டாள்’ போன்ற இயல்பான தமிழ் மரபுத்தொடர் பயன்படுத்தப்பட்டுள்ளது.
