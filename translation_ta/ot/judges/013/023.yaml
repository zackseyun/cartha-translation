  text: וַ/תֹּ֧אמֶר ל֣/וֹ אִשְׁתּ֗/וֹ לוּ֩ חָפֵ֨ץ יְהוָ֤ה לַ/הֲמִיתֵ֨/נוּ֙ לֹֽא לָקַ֤ח מִ/יָּדֵ֨/נוּ֙ עֹלָ֣ה וּ/מִנְחָ֔ה וְ/לֹ֥א הֶרְאָ֖/נוּ אֶת כָּל אֵ֑לֶּה וְ/כָ/עֵ֕ת לֹ֥א הִשְׁמִיעָ֖/נוּ כָּ/זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/023.yaml
  text: But his wife said to him, “If the LORD had intended to kill us, he would not have accepted from our hand a burnt offering and a grain offering, or shown us all these things, or now announced to us such a thing as this.”
translation:
  language: ta
  text: ஆனால் அவனுடைய மனைவி அவனிடம், “ஆண்டவர்[a] நம்மைக் கொல்ல விரும்பியிருந்தால், நம் கையிலிருந்து தகனபலியையும் தானியக் காணிக்கையையும் ஏற்றுக்கொண்டிருக்க மாட்டார்; இவை அனைத்தையும் நமக்குக் காட்டியிருக்கவும் மாட்டார்; இப்போது இத்தகைய செய்தியை நமக்குத் தெரிவித்திருக்கவும் மாட்டார்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் இங்கு கடவுளின் தனிப்பெயரான ய்ஹ்வ்ஹ் இடம்பெறுகிறது.
    reason: The main-text title “ஆண்டவர்” represents the tetragrammaton; the note preserves source-level transparency.
lexical_decisions:
- source_word: חָפֵץ
  choice: விரும்பியிருந்தால்
  rationale: The verb expresses desire or intention; the Tamil conditional naturally conveys the counterfactual force of the clause.
- source_word: לָקַח
  choice: ஏற்றுக்கொண்டிருக்க மாட்டார்
  rationale: Although the basic sense is “take,” in the sacrificial context it means accepting the offerings.
- source_word: עֹלָה
  choice: தகனபலி
  rationale: This denotes an offering wholly burned on the altar.
- source_word: מִנְחָה
  choice: தானியக் காணிக்கை
  rationale: In this cultic pairing, the term refers to the grain offering rather than a generic gift.
- source_word: הִשְׁמִיעָנוּ
  choice: நமக்குத் தெரிவித்திருக்கவும் மாட்டார்
  rationale: The Hiphil form literally causes someone to hear and here naturally means announcing or communicating a message.
- source_word: כָזֹאת
  choice: இத்தகைய செய்தியை
  rationale: Preserves the demonstrative sense “such a thing as this” while making the communicated content idiomatic in modern Tamil.
theological_decisions:
- issue: Representation of the divine name יהוה
  choice: ஆண்டவர்[a]
  alternative: யெகோவா / யாவே
  rationale: Uses the established dignified Tamil title in the main text while the footnote transparently identifies the Hebrew personal name without asserting a disputed pronunciation.
translation_notes:
  register: Modern standard Tamil with dignified but readily understandable sacrificial terminology. The three coordinated negative clauses and the wife’s counterfactual reasoning are retained without adding a theological explanation.
