id: JDG.13.17
reference: Judges 13:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר מָנ֛וֹחַ אֶל מַלְאַ֥ךְ יְהוָ֖ה מִ֣י שְׁמֶ֑/ךָ כִּֽי יָבֹ֥א דברי/ך וְ/כִבַּדְנֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/017.yaml
  text: Then Manoah said to the angel of Yahweh[a], “What is your name, so that when your words come to pass, we may honor you?”
translation:
  language: ta
  text: அப்போது மனோவா யாவேயின் தூதரிடம்[a], “உமது வார்த்தைகள் நிறைவேறும்போது நாங்கள் உம்மைக் கௌரவிக்கும்படி, உமது பெயர் என்ன?” என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யாவேயின் செய்தியாளர்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאַךְ என்பதற்கு ‘தூதர்’ அல்லது ‘செய்தியாளர்’ என்று பொருள் கொள்ளலாம். இக்கதையில் அவர் இயற்கைக்கு அப்பாற்பட்டவராகச் சித்தரிக்கப்படுவதால் ‘தூதர்’ இயல்பான தேர்வு; יְהוָה என்பது உடன்படிக்கையின் பெயராக ‘யாவே’ என்று தரப்படுகிறது.
- source_word: מִי שְׁמֶךָ
  choice: உமது பெயர் என்ன?
  rationale: எபிரெய மொழிமரபு ஒருவரின் பெயரைக் கேட்கிறது; நவீனத் தமிழில் இயல்பாகவும் மரியாதையாகவும் இவ்வாறு சொல்லப்படுகிறது.
- source_word: כִּי
  choice: …கும்படி
  rationale: இங்கு כִּי, பெயரைக் கேட்பதன் நோக்கத்தையோ விளைவையோ அறிமுகப்படுத்துகிறது; தமிழில் ‘…கும்படி’ அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יָבֹא דְבָרֶיךָ
  choice: உமது வார்த்தைகள் நிறைவேறும்போது
  rationale: דְבָרֶיךָ இலக்கணப்படி பன்மை. ‘வார்த்தைகள் நிறைவேறுதல்’ என்பது அறிவிக்கப்பட்ட செய்தி நிகழ்வதைக் குறிக்கும் எபிரெய மொழிமரபைப் பாதுகாக்கிறது.
- source_word: וְכִבַּדְנוּךָ
  choice: நாங்கள் உம்மைக் கௌரவிக்கும்படி
  rationale: כבד என்பதன் பியேல் வடிவம் ‘கௌரவித்தல், மரியாதை செலுத்துதல்’ எனப் பொருள்படும். ‘மகிமைப்படுத்துதல்’ தேவையற்ற பிற்கால இறையியல் நுணுக்கத்தைச் சேர்க்கக்கூடும்.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதனைப் பொதுப்பட்டமாக மாற்றாமல் உடன்படிக்கையின் தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தைக் காக்கிறது.
- issue: מַלְאַךְ என்பவரின் அடையாளம்
  choice: தூதர்
  alternative: செய்தியாளர்
  rationale: சொல்லின் இயல்பான இருபொருள் சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறோம்; கதையின் இயற்கைக்கு அப்பாற்பட்ட சித்தரிப்பினால் முதன்மை உரையில் ‘தூதர்’ பயன்படுத்தப்படுகிறது, ஆனால் அவரது துல்லியமான இறையியல் அடையாளம் இவ்வசனத்தில் தீர்மானிக்கப்படவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், மரியாதை ஒருமையைப் பயன்படுத்தி, சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான மொழி தேர்ந்தெடுக்கப்பட்டது. நோக்கக் கூறு தமிழில் இயல்பாக அமைய வாக்கியத்தின் இறுதிப் பகுதியில் ‘…கும்படி’ பயன்படுத்தப்பட்டது.
