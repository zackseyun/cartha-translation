reference: Judges 13:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּי֩ הִנָּ֨/ךְ הָרָ֜ה וְ/יֹלַ֣דְתְּ בֵּ֗ן וּ/מוֹרָה֙ לֹא יַעֲלֶ֣ה עַל רֹאשׁ֔/וֹ כִּֽי נְזִ֧יר אֱלֹהִ֛ים יִהְיֶ֥ה הַ/נַּ֖עַר מִן הַ/בָּ֑טֶן וְ/ה֗וּא יָחֵ֛ל לְ/הוֹשִׁ֥יעַ אֶת יִשְׂרָאֵ֖ל מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/005.yaml
  text: For behold[a], you are pregnant and will bear a son. No razor shall come upon his head, for the boy shall be a Nazirite of God from the womb, and he will begin to save Israel from the hand of the Philistines.
translation:
  language: ta
  text: ஏனெனில், இதோ, நீ கர்ப்பமாக இருக்கிறாய்; ஒரு மகனைப் பெற்றெடுப்பாய். அவனுடைய தலையின்மேல் சவரக்கத்தி படக்கூடாது. ஏனெனில், அந்தப் பையன் கருவிலிருந்தே கடவுளின் நாசீரேயனாக இருப்பான். அவன் இஸ்ரவேலைப் பெலிஸ்தியரின் கையிலிருந்து காப்பாற்ற[a]த் தொடங்குவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலைப் பெலிஸ்தியரின் கையிலிருந்து விடுவிக்கத் தொடங்குவான்.” எபிரேய வினைச்சொல் சூழலுக்கேற்ப “காப்பாற்று” அல்லது “விடுவி” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּךְ
  choice: இதோ, நீ
  rationale: கவனத்தை ஈர்க்கும் வலியுறுத்தலையும் அறிவிப்பின் மாண்பையும் இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: הָרָה
  choice: கர்ப்பமாக இருக்கிறாய்
  rationale: இது வருங்காலத்தில் கருத்தரிப்பதைக் குறிக்கும் வினை அல்ல; பெண்ணின் தற்போதைய கர்ப்பநிலையைச் சுட்டும் பயனிலைப் பெயரடை.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: ஒரு மகனைப் பெற்றெடுப்பாய்
  rationale: அறிவிப்பின் சூழலில் உள்ள வருங்காலப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: מוֹרָה
  choice: சவரக்கத்தி
  rationale: நாசீரேய அர்ப்பணிப்பின் சூழலில் தலைமுடியை மழிக்கப் பயன்படும் கருவியைத் துல்லியமாகக் குறிக்கிறது.
- source_word: לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: அவனுடைய தலையின்மேல் ... படக்கூடாது
  rationale: எபிரேய மொழியின் ‘தலையின்மேல் ஏறுதல்’ என்ற உருவகத்தைத் தமிழில் புரியக்கூடிய தடைக் கூற்றாகப் பாதுகாக்கிறது.
- source_word: נְזִיר אֱלֹהִים
  choice: கடவுளுக்கான நாசீரேயன்
  rationale: தொழில்நுட்பமான அர்ப்பணிப்பு நிலையைக் குறிக்கும் ‘நாசீரேயன்’ என்ற சொல்லைத் தக்கவைத்து, கடவுளோடுள்ள உறவையும் வெளிப்படுத்துகிறது.
- source_word: הַנַּעַר
  choice: அந்தப் பையன்
  rationale: வாக்குறுதி அளிக்கப்பட்ட ஆண் குழந்தையைச் சூழலுக்கு ஏற்றவாறு குறிப்பிடுகிறது.
- source_word: מִן הַבָּטֶן
  choice: கருவிலிருந்தே
  rationale: பிறப்புக்குப் பின்பே அல்லாமல் தாயின் கருவிலிருந்தே அர்ப்பணிக்கப்பட்டிருப்பதைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: יָחֵל
  choice: தொடங்குவான்
  rationale: சிம்சோன் விடுதலையை முழுமைப்படுத்துவான் என்று மிகைப்படுத்தாமல், அதன் தொடக்கத்தை ஏற்படுத்துவான் என்ற மூலப்பொருளைப் பாதுகாக்கிறது.
- source_word: לְהוֹשִׁיעַ
  choice: காப்பாற்ற
  rationale: ‘காப்பாற்றுதல்’ மற்றும் ‘விடுவித்தல்’ ஆகிய பொருள்களுக்கு இடமுள்ள வினையை இயல்பான தமிழில் தருகிறது; சூழலுக்குரிய மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: பெலிஸ்தியரின் கையிலிருந்து
  rationale: ஆட்சி அல்லது பகைமை அதிகாரத்தைக் குறிக்கும் எபிரேய ‘கை’ உருவகத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: சிம்சோனின் அர்ப்பணிப்பின் தன்மை
  choice: கருவிலிருந்தே கடவுளுக்கான நாசீரேயன்
  alternative: பிறப்பிலிருந்தே கடவுளுக்கு அர்ப்பணிக்கப்பட்டவன்
  rationale: נְזִיר என்ற குறிப்பிட்ட சொல்லை பொதுவான ‘அர்ப்பணிக்கப்பட்டவன்’ என மங்கச் செய்யாமல், நாசீரேய நிலையும் கருவிலிருந்தே தொடங்கும் அர்ப்பணிப்பும் பாதுகாக்கப்படுகின்றன.
- issue: இஸ்ரவேலின் விடுதலையில் சிம்சோனின் பங்கு
  choice: காப்பாற்றத் தொடங்குவான்
  alternative: இஸ்ரவேலைக் காப்பாற்றுவான்
  rationale: יָחֵל தொடக்கத்தைக் குறிப்பதால், சிம்சோன் விடுதலையை ஆரம்பிப்பான் என்பதையே கூறுகிறது; அதை அவன் முழுமையாக நிறைவேற்றுவான் என்று உரை கூறாததை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மாண்பான நடையில் வடிவமைக்கப்பட்டது. ‘நாசீரேயன்’ என்ற தொழில்நுட்பச் சொல் மூலத்தின் குறிப்பிட்ட அர்ப்பணிப்பு நிலையைப் பாதுகாக்கத் தக்கவைக்கப்பட்டுள்ளது; ‘கை’ என்ற எபிரேய உருவகமும் இயல்பான வேதாகமத் தமிழாக வைக்கப்பட்டுள்ளது.
