id: JDG.13.12
reference: Judges 13:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מָנ֔וֹחַ עַתָּ֖ה יָבֹ֣א דְבָרֶ֑י/ךָ מַה יִּֽהְיֶ֥ה מִשְׁפַּט הַ/נַּ֖עַר וּ/מַעֲשֵֽׂ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/012.yaml
  text: Then Manoah said[a], “Now let your words come true[c][b]. What will be the rule for the boy and for his work?”
translation:
  language: ta
  text: அப்போது மனோவா, “இப்போது உமது வார்த்தைகள் நிறைவேறட்டும்.[a] அந்தப் பையனுக்குரிய விதிமுறையும் அவனுடைய செயலும் என்னவாக இருக்கும்?”[b] என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது வார்த்தைகள் நிறைவேறும்போது.” எபிரெயத் தொடரை ஒரு வேண்டுதலாகவோ, நிகழும் என்று கருதும் காலத் தொடராகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: “விதிமுறை” என்பதை “வழக்கம்,” “நியமம்,” அல்லது “வாழ்க்கை முறை” என்றும்; “அவனுடைய செயல்” என்பதை “அவன் செய்ய வேண்டியது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... கேட்டான்
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுக்கிறது. இங்கு வரும் நேரடி உரை ஒரு கேள்வியாக முடிவதால், தமிழில் இயல்பாக ‘கேட்டான்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מָנוֹחַ
  choice: மனோவா
  rationale: எபிரெய தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: עַתָּה
  choice: இப்போது
  rationale: உடனடியான எதிர்பார்ப்பையும் பதிலுரையின் தருணத்தையும் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: יָבֹא דְבָרֶיךָ
  choice: உமது வார்த்தைகள் நிறைவேறட்டும்
  rationale: சொல்லளவில் ‘உமது வார்த்தைகள் வரட்டும்’ என்பதைக் குறித்தாலும், அறிவிக்கப்பட்டது நிகழ்வதைச் சுட்டும் எபிரெய மரபுத்தொடரைத் தெளிவாகத் தருகிறது. வாழ்த்துரைப் பொருளுக்கும் காலநிபந்தனைப் பொருளுக்கும் இடமுள்ளது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מַה יִּהְיֶה
  choice: என்னவாக இருக்கும்?
  rationale: எதிர்கால நிலை அல்லது விதிமுறையைப் பற்றிய நேரடியான வினா.
- source_word: מִשְׁפַּט
  choice: ஒழுங்குமுறை
  rationale: இச்சூழலில் பையனுக்குப் பொருந்த வேண்டிய நியமம், வழக்கம் அல்லது வாழ்க்கை ஒழுங்கைக் குறிக்கலாம். ‘ஒழுங்குமுறை’ சட்டத் தீர்ப்பு என்ற குறுகிய பொருளைத் தவிர்த்து இந்த விரிவை ஓரளவு காக்கிறது.
- source_word: הַנַּעַר
  choice: அந்தப் பையன்
  rationale: இன்னும் பிறக்காத, முன்பு அறிவிக்கப்பட்ட ஆண் குழந்தையைக் குறிப்பதால் ‘அந்தப் பையன்’ என்று வழங்கப்பட்டது.
- source_word: וּמַעֲשֵׂהוּ
  choice: அவனுடைய செயல்
  rationale: מַעֲשֶׂה என்பதன் செயல், வேலை, நடவடிக்கை என்ற பொருள் அகலத்தை நெருக்கமாகக் காக்கிறது; ‘அவன் செய்ய வேண்டியது’ என்பது சாத்தியமான விளக்க மொழிபெயர்ப்பு.
theological_decisions:
- issue: יָבֹא דְבָרֶיךָ என்பதன் வேண்டுதல் அல்லது காலநிபந்தனைப் பொருள்
  choice: ‘உமது வார்த்தைகள் நிறைவேறட்டும்’ என்ற வேண்டுதல் வாசிப்பு
  alternative: ‘உமது வார்த்தைகள் நிறைவேறும்போது’ என்ற காலநிபந்தனை வாசிப்பு
  rationale: எபிரெய வினை வடிவம் சூழலில் இருவகையாகவும் புரிந்துகொள்ளப்படலாம். முதன்மை உரையில் வேண்டுதல் தொனியை வைத்துக் கொண்டு, உண்மையான தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. கடவுளின் தூதரிடம் பேசும் மரியாதையை ‘உமது’ காக்கிறது. மூலத்தின் ‘ஒழுங்குமுறை’ மற்றும் ‘செயல்’ ஆகிய பரந்த பொருட்கள் விளக்கமாகச் சுருக்கப்படாமல் வைக்கப்பட்டுள்ளன.
