base_translation:
  language: en
  yaml_path: translation/ot/judges/013/007.yaml
  text: For he said to me[a], ‘Look, you will conceive and bear a son. So now, do not drink wine or strong drink, and do not eat anything unclean[b], for the boy will be a Nazirite of God from the womb until the day of his death.’
translation:
  language: ta
  text: அவர் என்னிடம், “இதோ, நீ கருவுற்று ஒரு மகனைப் பெற்றெடுப்பாய்.[a] ஆகவே இப்போது திராட்சைமதுவையோ போதை தரும் பானத்தையோ குடிக்காதே; தீட்டான எதையும் சாப்பிடாதே. ஏனெனில், அந்தப் பையன் தாயின் கருப்பையிலிருந்தே தான் இறக்கும் நாள்வரை கடவுளுக்குரிய நாசீரேயனாக[b] இருப்பான்” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தை இன்னும் நேரடியாக, “இதோ, நீ கர்ப்பமாக இருக்கிறாய்; ஒரு மகனைப் பெறுவாய்” என்றும் மொழிபெயர்க்கலாம். சூழல் இதை எதிர்கால அறிவிப்பாகப் புரிந்துகொள்ள இடமளிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “நாசீரேயன்” என்பது கடவுளுக்கெனச் சிறப்பாக அர்ப்பணிக்கப்பட்ட ஒருவரைக் குறிக்கும் எபிரேயத் தொழில்நுட்பப் பெயர்.
    reason: technical_term
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: அவர் என்னிடம் ... என்று சொன்னார்
  rationale: எபிரேய உரையின் நேரடியான பொருளை இயல்பான தமிழ் மேற்கோள் அமைப்பில் தருகிறது. மூலத்தில் காரணத்தைக் குறிக்கும் சொல் இல்லாததால் ‘ஏனெனில்’ சேர்க்கப்படவில்லை.
- source_word: הִנָּךְ הָרָה וְיֹלַדְתְּ בֵּן
  choice: இதோ, நீ கருவுற்று ஒரு மகனைப் பெறுவாய்
  rationale: הָרָה இலக்கண வடிவில் ‘கர்ப்பமாக இருக்கிறாய்’ என்று புரியக்கூடியது; அறிவிப்பு சூழலில் எதிர்காலப் பொருள் இயல்பாக இருப்பதால் முதன்மை உரையில் ‘கருவுற்று ... பெறுவாய்’ எனத் தரப்பட்டு, உண்மையான மொழியியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: அறிவிப்பிலிருந்து அதனைத் தொடர்ந்து வரும் கட்டளைக்கு உள்ள கருத்துத் தொடர்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: יַיִן וְשֵׁכָר
  choice: திராட்சைமதுவையோ மற்ற போதை பானத்தையோ
  rationale: יַיִן என்பது திராட்சைமது; שֵׁכָר என்பது பொதுவாக திராட்சைமது அல்லாத போதை தரும் பானத்தைக் குறிக்கிறது. குறிப்பிட்ட நவீன பானவகையைத் திணிக்காமல் வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: כָּל טֻמְאָה
  choice: தீட்டான எதையும்
  rationale: சடங்குசார் அசுத்தத்தையோ உண்ணத் தடைசெய்யப்பட்ட பொருளையோ குறிக்கும் சொல்லை, வெறும் உடல் அழுக்காகத் தவறாகப் புரியாத வகையில் ‘தீட்டான’ என்று மொழிபெயர்க்கிறது.
- source_word: נְזִיר אֱלֹהִים
  choice: கடவுளுக்குரிய நாசீரேயன்
  rationale: נָזִיר என்பது கடவுளுக்கெனச் சிறப்பாக அர்ப்பணிக்கப்பட்ட நிலையைக் குறிக்கும் தொழில்நுட்பச் சொல். அதனைப் பொதுவான ‘பரிசுத்தமானவன்’ என்று சமப்படுத்தாமல் ஒலிபெயர்த்து, אֱלֹהִים உடனான உறவை ‘கடவுளுக்குரிய’ எனக் காட்டுகிறது.
- source_word: מִן הַבֶּטֶן עַד יוֹם מוֹתוֹ
  choice: கருவிலிருந்தே தான் இறக்கும் நாள்வரை
  rationale: கால எல்லையின் இரு முனைகளையும், மூலத்தின் ‘கரு’ மற்றும் ‘இறக்கும் நாள்’ என்ற உருவகங்களையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: நாசீரேய அர்ப்பணிப்பின் தன்மை
  choice: கடவுளுக்குரிய நாசீரேயன்
  alternative: கடவுளுக்கென்று அர்ப்பணிக்கப்பட்டவன்
  rationale: தொழில்நுட்பமான נָזִיר என்ற பெயரைத் தக்கவைத்ததால் எண்ணாகமம் 6-இன் பின்னணியுடன் உள்ள தொடர்பு மறையாது; அதேவேளை அடிக்குறிப்பு சாதாரண வாசகருக்குப் பொருளை விளக்குகிறது.
- issue: கருத்தரிப்பு அறிவிப்பின் காலப் பொருள்
  choice: நீ கருவுற்று ஒரு மகனைப் பெறுவாய்
  alternative: நீ கர்ப்பமாக இருக்கிறாய்; ஒரு மகனைப் பெறுவாய்
  rationale: சூழல் எதிர்கால அறிவிப்பை ஆதரிக்கிறது; எனினும் הָרָה என்ற வடிவின் நேரடி நிகழ்கால வாசிப்பை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதாகம அறிவிப்பிற்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நாசீரேயன்’ என்ற அரிதான தொழில்நுட்பச் சொல் பொருள் இழக்காமல் வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; ‘நசரேயன்’ (நாசரேத்தைச் சேர்ந்தவர்) என்பதுடன் குழப்பம் வராதபடி ‘நாசீரேயன்’ என்ற எழுத்தாக்கம் பயன்படுத்தப்பட்டுள்ளது.
