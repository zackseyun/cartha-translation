source:
  edition: WLC
  text: וַ/יֶּעְתַּ֥ר מָנ֛וֹחַ אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר בִּ֣י אֲדוֹנָ֔/י אִ֣ישׁ הָ/אֱלֹהִ֞ים אֲשֶׁ֣ר שָׁלַ֗חְתָּ יָבוֹא נָ֥א עוֹד֙ אֵלֵ֔י/נוּ וְ/יוֹרֵ֕/נוּ מַֽה נַּעֲשֶׂ֖ה לַ/נַּ֥עַר הַ/יּוּלָּֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/008.yaml
  text: Then Manoah entreated Yahweh and said[a], “Please, Lord[c][b], let the man of God whom you sent come again to us and teach us what we should do for the boy who is to be born.”
translation:
  language: ta
  text: அப்போது மனோவா யாவேயிடம் உருக்கமாக மன்றாடி[a], “ஆண்டவரே, தயவுசெய்து, நீர் அனுப்பிய கடவுளின் மனிதர்[b] மீண்டும் எங்களிடம் வந்து, பிறக்கவிருக்கும் பையனுக்கு[c] நாங்கள் என்ன செய்ய வேண்டும் என்பதை எங்களுக்குக் கற்பிக்கட்டும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மன்றாடி’ என்பதற்கு ‘இறைஞ்சி வேண்டி’ அல்லது ‘வேண்டிக்கொண்டு’ என்றும் மொழிபெயர்க்கலாம்; எபிரேய வினை தீவிரமான விண்ணப்பத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் நேரடியாக ‘கடவுளின் மனிதர்.’ வருகையாளரை இன்னும் தெளிவாக அடையாளப்படுத்தாமல், மனோவா அப்போது புரிந்துகொண்ட விதத்திலேயே பேசுகிறான்.
    reason: alternative_reading
  - marker: c
    text: ‘பிறக்கவிருக்கும் குழந்தைக்கு’ என்றும் மொழிபெயர்க்கலாம்; ஆனால் எபிரேயச் சொல் ஆண்பாலானது; எனவே ‘பையன்’ என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּעְתַּר
  choice: உருக்கமாக மன்றாடி
  rationale: עָתַר என்பது சாதாரணமாக வேண்டுவதைக் காட்டிலும் தீவிரமான விண்ணப்பத்தைக் குறிக்கிறது. ‘உருக்கமாக மன்றாடி’ என்பது அதன் வேண்டுதல் சார்ந்த வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மூலத்தில் கடவுளின் தனிப்பெயரான יהוה நேரடியாக வருகிறது; அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בִּי אֲדֹנָי
  choice: ஆண்டவரே, தயவுசெய்து
  rationale: בִּי இங்கு பணிவான வேண்டுதலைக் குறிக்கும் இடைச்சொல்; אֲדֹנָי கடவுளை மரியாதையுடன் அழைக்கும் சொல். இவ்விரண்டையும் இயல்பாக ‘ஆண்டவரே, தயவுசெய்து’ என்று வழங்குகிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: கடவுளின் மனிதர்
  rationale: மூலச்சொற்றொடர் நேரடியாக ‘கடவுளின் மனிதர்’ என்கிறது. வருகையாளரின் அடையாளத்தை இவ்வசனத்திலேயே தூதர் என்று விளக்கிவிடாமல் மனோவாவின் அப்போதைய புரிதல் பாதுகாக்கப்படுகிறது.
- source_word: יָבוֹא נָא עוֹד אֵלֵינוּ
  choice: மீண்டும் எங்களிடம் வந்து
  rationale: נָא உடன் வரும் வினை பணிவான வேண்டுதலையும், עוֹד மீண்டும் வருவதையும் குறிக்கிறது. தமிழ் வாக்கியத்தில் ‘தயவுசெய்து’ மற்றும் ‘மீண்டும்’ இவ்விரு அம்சங்களையும் தெளிவாக்குகின்றன.
- source_word: וְיוֹרֵנוּ
  choice: எங்களுக்குக் கற்பிப்பாராக
  rationale: ירה என்பதன் ஹிஃபில் வடிவம் கற்பித்தல் அல்லது அறிவுறுத்தலைக் குறிக்கிறது. ‘கற்பிப்பாராக’ வேண்டுகோளின் தன்மையையும் மரியாதையான நடையையும் காக்கிறது.
- source_word: מַה נַּעֲשֶׂה
  choice: நாங்கள் என்ன செய்ய வேண்டும்
  rationale: இது நடைமுறை வழிகாட்டுதலைக் கேட்கும் ஆலோசனை வினா; ‘என்ன செய்ய வேண்டும்’ என்பது அதன் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לַנַּעַר הַיּוּלָּד
  choice: பிறக்கவிருக்கும் பையனுக்கு
  rationale: נַעַר ஆண்பாலைக் குறிக்கிறது; הַיּוּלָּד வருங்காலத்தில் பிறக்கவிருப்பவனைச் சுட்டுகிறது. எனவே பாலினத்தையும் எதிர்காலக் குறிப்பையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை எவ்வாறு வழங்குவது
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரைப் பயன்படுத்துவதால், அதை பொதுவான பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: אִישׁ הָאֱלֹהִים என்பவரை இவ்வசனத்திலேயே தேவதூதர் என அடையாளப்படுத்தலாமா
  choice: கடவுளின் மனிதர்
  alternative: கடவுளின் தூதர்
  rationale: பின்னுள்ள கதை அவரது அடையாளத்தை மேலும் வெளிப்படுத்தினாலும், இங்கு மனோவா பயன்படுத்தும் சொல் ‘மனிதர்’ என்பதே. அதை அப்படியே வைப்பது கதையின் திட்டமிட்ட தெளிவின்மையையும் மனோவாவின் பார்வையையும் காக்கிறது.
- issue: לַנַּעַר என்பதன் பாலினக் குறிப்பை மொழிபெயர்த்தல்
  choice: பையனுக்கு
  alternative: குழந்தைக்கு
  rationale: எபிரேயப் பெயர்ச்சொல் ஆண்பாலில் இருப்பதோடு, சூழலும் வாக்களிக்கப்பட்ட ஆண் குழந்தையைக் குறிக்கிறது. எனவே பாலினத்தை நடுநிலையாக்காமல் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டு மரியாதையை இழக்காத வகையிலும் மொழிநடை அமைக்கப்பட்டுள்ளது. கடவுளிடம் பேசும்போது ‘நீர்’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
