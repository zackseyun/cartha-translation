  source_fidelity: 'மூல எபிரேயத்தின் எல்லா முக்கிய கூறுகளும் துல்லியமாகக் கொடுக்கப்பட்டுள்ளன: கடவுள் மனோவாவின் குரலுக்குச் செவிகொடுத்தது, கடவுளின் தூதர் மீண்டும் பெண்ணிடம் வந்தது, அவள் வயலில் அமர்ந்திருந்தது, மனோவா அவளுடன் இல்லாதது ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ‘செவிகொடுத்தார்’ שׁמע בקול என்பதன் சூழல்சார் பதிலளிக்கும் நுணுக்கத்தைச் சரியாக வெளிப்படுத்துகிறது. ‘கடவுளின் தூதர்’ מַלְאַךְ הָאֱלֹהִים என்பதற்கு நம்பகமான, தேவையற்ற வகைப்படுத்தலைத் தவிர்க்கும் மொழிபெயர்ப்பாகும்.'
