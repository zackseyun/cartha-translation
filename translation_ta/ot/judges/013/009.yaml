source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע הָ/אֱלֹהִ֖ים בְּ/ק֣וֹל מָנ֑וֹחַ וַ/יָּבֹ֣א מַלְאַךְ֩ הָ/אֱלֹהִ֨ים ע֜וֹד אֶל הָ/אִשָּׁ֗ה וְ/הִיא֙ יוֹשֶׁ֣בֶת בַּ/שָּׂדֶ֔ה וּ/מָנ֥וֹחַ אִישָׁ֖/הּ אֵ֥ין עִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/009.yaml
  text: And God listened to the voice of Manoah, and the angel of God came again to the woman while she was sitting in the field, and Manoah her husband was not with her.
translation:
  language: ta
  text: மனோவாவின் குரலுக்குக் கடவுள் செவிகொடுத்தார். அந்தப் பெண் வயல்வெளியில் அமர்ந்திருந்தபோது, கடவுளின் தூதர் மீண்டும் அவளிடம் வந்தார். அவளுடைய கணவன் மனோவா அப்போது அவளுடன் இல்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: செவிகொடுத்தார்
  rationale: שׁמע இங்கு வெறுமனே கேட்டதைக் காட்டாமல், முந்தைய வசனத்தில் மனோவா வேண்டியதற்குக் கடவுள் சாதகமாகப் பதிலளித்ததைக் குறிக்கிறது; ‘செவிகொடுத்தார்’ அந்த நுணுக்கத்தை இயல்பாகத் தருகிறது.
- source_word: בְּקוֹל מָנוֹחַ
  choice: மனோவாவின் குரலுக்கு
  rationale: ‘ஒருவரின் குரலுக்குச் செவிகொடு’ என்ற எபிரேய மரபுத்தொடரின் ‘குரல்’ கூறைப் பாதுகாத்து, தமிழிலும் இயல்பான தொடராக வழங்குகிறது.
- source_word: מָנוֹחַ
  choice: மனோவா
  rationale: தனிப்பெயர் எபிரேய ஒலியமைப்பை அணுகிய, தமிழில் வாசிக்க இயல்பான வடிவில் ஒலிபெயர்க்கப்பட்டது.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: கடவுளின் தூதர்
  rationale: מַלְאָךְ என்பதன் அடிப்படைப் பொருள் ‘தூதர்’; இச்சூழலில் அவர் கடவுளிடமிருந்து வரும் இயற்கைக்கு அப்பாற்பட்ட தூதர். ‘தூதர்’ மூலச்சொல்லின் பணி சார்ந்த பொருளையும் சூழலையும் தக்கவைக்கிறது.
- source_word: עוֹד
  choice: மீண்டும்
  rationale: முன்பு நிகழ்ந்த வருகை மறுபடியும் நிகழ்வதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: மூலத்தில் உள்ள ‘பெண்’ என்ற குறிப்பிடலைத் தக்கவைத்து, முந்தைய உரையாடல் நபரையே சுட்டுகிறது என்பதைத் தமிழில் ‘அந்த’ தெளிவாக்குகிறது.
- source_word: וְהִיא יוֹשֶׁבֶת בַּשָּׂדֶה
  choice: அந்தப் பெண் வயல்வெளியில் அமர்ந்திருந்தபோது
  rationale: எபிரேயப் பெயரெச்ச வினை வடிவம் தூதர் வந்தபோது நிலவிய பின்னணிச் செயலைக் காட்டுகிறது; ‘அமர்ந்திருந்தபோது’ அதனை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִישָׁהּ
  choice: அவளுடைய கணவன்
  rationale: אִישׁ அடிப்படையில் ‘ஆண்/மனிதன்’ என்றாலும், பெண்பால் ஒருமை உடைமை விகுதியுடன் இச்சூழலில் ‘அவளுடைய கணவன்’ என்பதே துல்லியமான உறவுப்பொருள்.
- source_word: אֵין עִמָּהּ
  choice: அப்போது அவளுடன் இல்லை
  rationale: எதிர்மறை இருப்புநிலையும் עִם உடனிருப்பையும் இயல்பான தமிழில் தருகிறது; ‘அப்போது’ வருகை நிகழ்ந்த நேரத்தோடு இதைத் தெளிவாக இணைக்கிறது.
theological_decisions:
- issue: הָאֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: தெய்வங்கள்
  rationale: אֱלֹהִים வடிவில் பன்மையாக இருந்தாலும், இக்கதையில் ஒருமை வினையுடன் இஸ்ரவேலின் கடவுளையே குறிக்கிறது; எனவே ‘கடவுள்’ என்பது உடனடி இலக்கணத்துக்கும் சூழலுக்கும் பொருந்துகிறது.
- issue: מַלְאַךְ என்பதன் அடையாளத்தை மொழிபெயர்ப்பில் வெளிப்படுத்துதல்
  choice: தூதர்
  alternative: தேவதூதர்
  rationale: மூலச்சொல் ‘தூதர்/செய்தியாளர்’ எனும் பரந்த பொருளைக் கொண்டது. ‘கடவுளின் தூதர்’ என்பது அவரது தெய்வீக அனுப்புதலைத் தெளிவாக்குவதோடு, ‘தேவதூதர்’ என்று வகைப்படுத்துவதால் ஏற்படும் கூடுதல் விளக்கத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளை கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரேய வாக்கியத்தின் தொடர்ச்சியான ‘וַ’ இணைப்புகளை அப்படியே இயந்திரமாகப் பின்பற்றாமல் மூன்று இயல்பான தமிழ் வாக்கியங்களாக அமைத்துள்ளோம். உண்மையான உரை வேறுபாடு அல்லது வாசகருக்குத் தேவையான விளக்கக் குறிப்பு இல்லாததால் அடிக்குறிப்புகள் சேர்க்கப்படவில்லை.
