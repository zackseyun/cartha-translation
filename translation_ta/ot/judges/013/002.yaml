translation_notes:
  register: நவீன, தெளிவான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மலடி’ என்ற மரபுச் சொல் தவிர்க்கப்பட்டு, குற்றம்சாட்டாத ‘கருத்தரிக்க இயலாதவள்’ என்ற சொல்லாட்சி தேர்ந்தெடுக்கப்பட்டுள்ளது. கதைநடையின் எளிமையும் மூலத்தின் இரு இணையான கூற்றுகளும் பாதுகாக்கப்பட்டுள்ளன.
