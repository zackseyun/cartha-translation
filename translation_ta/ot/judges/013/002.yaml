base_translation:
  language: en
  yaml_path: translation/ot/judges/013/002.yaml
  text: There was a certain man from Zorah[a], from the clan of the Danites, and his name was Manoah. His wife was barren and had not borne children.
translation:
  language: ta
  text: சோராவைச் சேர்ந்த, தாணியரின் குலத்தைச் சேர்ந்த ஒரு மனிதன் இருந்தான். அவன் பெயர் மானோவா. அவனுடைய மனைவி கருத்தரிக்க இயலாதவளாக இருந்தாள்; அவள் பிள்ளை பெற்றிருக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “அவள் பிள்ளைகள் பெற்றிருக்கவில்லை.” எபிரெயத்தில் சொல்லுக்குச் சொல்: “அவள் பெற்றிருக்கவில்லை.”'
    reason: மூலத்தில் ילד என்ற வினைக்கு வெளிப்படையான செயப்படுபொருள் இல்லை; தமிழில் ஒருமை அல்லது பன்மை இரண்டாகவும் சூழலுக்கேற்ப வெளிப்படுத்த முடியும்.
lexical_decisions:
- source_word: וַיְהִי
  choice: இருந்தான்
  rationale: புதிய கதை நிகழ்வை அறிமுகப்படுத்தும் எபிரெய விவரிப்பு வடிவத்தை, தமிழில் இயல்பான இருப்பு வாக்கியமாக வழங்குகிறது; மூலத்தில் இல்லாத தனியான ‘இப்போது’ போன்ற காலச் சொல்லைச் சேர்க்கவில்லை.
- source_word: אִישׁ אֶחָד
  choice: ஒரு மனிதன்
  rationale: இதுவரை பெயரிடப்படாத ஒரு குறிப்பிட்ட நபரை அறிமுகப்படுத்தும் எபிரெய மரபுத்தொடரை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: מִצָּרְעָה
  choice: சோராவைச் சேர்ந்த
  rationale: מִן குறிக்கும் இடத் தோற்றம் அல்லது சேர்ந்திருத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: தாணியரின் குலத்தைச் சேர்ந்த
  rationale: מִשְׁפָּחָה இங்கு பெரிய கோத்திர அமைப்புக்குள் உள்ள உறவினக் குழுவைக் குறிக்கிறது; ‘குலம்’ அந்த அளவை ‘கோத்திரம்’ என்பதைக் காட்டிலும் துல்லியமாகக் காட்டுகிறது.
- source_word: וּשְׁמוֹ מָנוֹחַ
  choice: அவன் பெயர் மனோவா
  rationale: எபிரெய பெயரிடும் வாய்பாட்டைத் தெளிவாகப் பாதுகாத்து, தமிழில் தனி வாக்கியமாக இயல்பாக வழங்குகிறது.
- source_word: עֲקָרָה
  choice: கருத்தரிக்க இயலாதவளாக இருந்தாள்
  rationale: பெண்ணை இழிவுபடுத்தக்கூடிய பழைய சொல்லாட்சியைத் தவிர்த்து, மூலச் சொல்லின் குழந்தைப்பேறின்மை சார்ந்த பொருளைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וְלֹא יָלָדָה
  choice: அவள் பிள்ளை பெற்றிருக்கவில்லை
  rationale: பெண் எழுவாயுடன் ילד குறிக்கும் ‘பெறுதல்/பிள்ளை பெறுதல்’ என்ற பொருளைப் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ஒருமை அல்லது பன்மை எண்ணிக்கையை வலியுறுத்தவில்லை.
