base_translation:
  language: en
  yaml_path: translation/ot/judges/013/011.yaml
  text: So Manoah arose and went after his wife[a], and came to the man and said to him, “Are you the man who spoke to the woman?” And he said[c][b], “I am.”
translation:
  language: ta
  text: அப்போது மனோவா எழுந்து, தன் மனைவிக்குப் பின்னால் சென்றார்[a]. அவர் அந்த மனிதனிடம் வந்து, “அந்தப் பெண்ணிடம் பேசியது நீர்தானா?” என்று கேட்டார்[b]. அதற்கு அவர், “நான்தான்” என்றார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் மனைவியைப் பின்தொடர்ந்து சென்றார்.” எபிரெயத்தில் நேரடியாக “தன் மனைவிக்குப் பின்னால்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “அந்தப் பெண்”; “என் மனைவி” என்று இல்லை.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் நேரடியாக “நான்”; இதை “நான் அவர்தான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்ற வினையின் தொடர்கதை வடிவம் ‘எழுந்தார்/எழுந்து’ என்பதைக் குறிக்கிறது; தமிழில் அடுத்த செயலை இயல்பாக இணைக்க ‘எழுந்து’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: וַיֵּלֶךְ
  choice: சென்றார்
  rationale: הלך இங்கு செல்லுதலைப் பொதுவாகக் குறிக்கிறது; நடைமுறையை மிகைப்படுத்தாமல் ‘சென்றார்’ என வழங்கப்பட்டது.
- source_word: אַחֲרֵי אִשְׁתּוֹ
  choice: தன் மனைவிக்குப் பின்னால்
  rationale: אַחֲרֵי என்பதன் நேரடி இடவியல்/தொடர்தல் பொருளைத் தக்கவைத்து, அவர் மனைவியைப் பின்தொடர்ந்தார் என்ற சூழலையும் இயல்பாக உணர்த்துகிறது.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: அந்த மனிதனிடம் வந்து
  rationale: בוא + אֶל என்பதற்கு ‘அவரிடம் வந்து’ என்பது இயல்பான தமிழ்; אִישׁ என்பதையும் பின்னர் வெளிப்படும் அடையாளத்தை முன்கூட்டியே சேர்க்காமல் ‘மனிதன்’ எனத் தக்கவைக்கிறது.
- source_word: הַאַתָּה הָאִישׁ
  choice: அந்த ... மனிதர் நீர்தானா?
  rationale: எபிரெயக் கேள்வியின் நேரடியான அடையாள விசாரணையை மரியாதைமிக்க நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: אֲשֶׁר דִּבַּרְתָּ אֶל הָאִשָּׁה
  choice: அந்தப் பெண்ணிடம் பேசிய
  rationale: אֶל உடன் வரும் דבר என்பதற்கு ‘பெண்ணிடம் பேசிய’ என்பது பொருத்தமானது; மூலத்தில் உள்ள ‘அந்தப் பெண்’ என்பதைக் ‘என் மனைவி’ என்று மாற்றவில்லை.
- source_word: אָֽנִי
  choice: நான்தான்
  rationale: வினையில்லாத எபிரெயப் பதில் சொற்சொல்லாக ‘நான்’; அடையாளத்தை உறுதிப்படுத்தும் இயல்பான தமிழ் பதில் ‘நான்தான்’ ஆகும்.
theological_decisions:
- issue: வருகையாளரின் அடையாளம்
  choice: הָאִישׁ என்பதை ‘அந்த மனிதன்’ என்று மொழிபெயர்த்தல்
  alternative: ‘தூதர்’ அல்லது ‘கர்த்தருடைய தூதர்’
  rationale: விரிந்த சூழல் அவரைக் கர்த்தருடைய தூதராக அடையாளப்படுத்தினாலும், இவ்வசனம் אִישׁ (‘மனிதன்’) என்றே கூறுகிறது. கதையில் அடையாளம் படிப்படியாக வெளிப்படுவதை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வேதாகமக் கதையாடல் நடையுடன் மொழிபெயர்க்கப்பட்டது. மனோவாவுக்கு ‘அவர்’ என்றும், அவர் வருகையாளரிடம் பேசும்போது மரியாதை ஒருமையான ‘நீர்’ என்றும் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘அந்தப் பெண்’ மற்றும் ‘அந்த மனிதன்’ ஆகிய கூறுகள் இறையியல் அடையாளத்தை முன்கூட்டியே தீர்மானிக்காமல் பாதுகாக்கப்பட்டுள்ளன.
