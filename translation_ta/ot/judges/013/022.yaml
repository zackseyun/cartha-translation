base_translation:
  language: en
  yaml_path: translation/ot/judges/013/022.yaml
  text: And Manoah said to his wife[a], “We will surely die, because we have seen God.”
translation:
  language: ta
  text: மனோவா தன் மனைவியிடம், “நாம் நிச்சயமாகச் சாவோம்; ஏனெனில் நாம் கடவுளைக் கண்டிருக்கிறோம்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு தெய்வம்” அல்லது “ஒரு தெய்வீகமானவர்.” எபிரெய மொழியிலுள்ள אֱלֹהִים என்ற சொல் சில சூழல்களில் ஒரு தெய்வீகமானவரையும் குறிக்கலாம்; ஆனால் இங்கு சூழல் “கடவுள்” என்பதையே ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியைத் தமிழின் இயல்பான வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: מָנוֹחַ
  choice: மனோவா
  rationale: தனிப்பெயர் நவீனத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֶל אִשְׁתּוֹ
  choice: தன் மனைவியிடம்
  rationale: உறவைக் குறிக்கும் எபிரெயச் சொற்றொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: מוֹת נָמוּת
  choice: நாம் நிச்சயமாகச் சாவோம்
  rationale: வினைமுற்றோடு வரும் வினையெச்சப் பெயரின் வலியுறுத்தலைத் தெளிவான நவீனத் தமிழில் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: மனோவாவின் அச்சத்திற்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பாக உள்ளது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: சூழல் ஆண்டவரின் தூதனுடனான சந்திப்பை கடவுளைக் கண்டதாக மனோவா புரிந்துகொள்வதைக் காட்டுவதால், இங்கு ‘கடவுள்’ பொருத்தமானது; மூலச்சொல்லின் பரந்த சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: רָאִינוּ
  choice: கண்டிருக்கிறோம்
  rationale: முடிவுற்ற சந்திப்பின் தற்போதைய விளைவான மரண அச்சத்தை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஆண்டவரின் தூதன் தோன்றிய பின் மனோவா கூறும் אֱלֹהִים என்பதன் பொருள்
  choice: கடவுள்
  alternative: ஒரு தெய்வம்; தெய்வீகமான ஒருவர்
  rationale: உடனடிச் சூழலும் கடவுளைக் காண்பவர் இறப்பார் என்ற மனோவாவின் அச்சமும் ‘கடவுள்’ என்ற வாசிப்பை ஆதரிக்கின்றன. அதேவேளையில், தூதனுக்கும் கடவுளுக்கும் இடையிலான கதைசார் மறைபொருளை மொழிபெயர்ப்பு மேலதிகமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நிச்சயமாகச் சாவோம்’ என்பது மூலத்தின் வலியுறுத்தலைத் தெளிவாகக் காக்கிறது; ‘கண்டிருக்கிறோம்’ என்பது அந்தச் சந்திப்பின் உடனடி விளைவை உணர்த்துகிறது.
