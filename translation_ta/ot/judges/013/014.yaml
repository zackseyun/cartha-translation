lexical_decisions:
- source_word: מִכֹּל אֲשֶׁר יֵצֵא מִגֶּפֶן הַיַּיִן
  choice: திராட்சைக்கொடியிலிருந்து உண்டாகும் எதையும்
  rationale: எபிரெய சொற்றொடரின் விரிவான பொருளையும் יֵצֵא என்பதன் ‘வெளிவருதல்/உண்டாதல்’ என்ற வினை வலிமையையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: לֹא תֹאכַל / אַל תֵּשְׁתְּ / אַל תֹּאכַל
  choice: உண்ணக் கூடாது / குடிக்கக் கூடாது
  rationale: கட்டளையின் தடை வலிமையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: יַיִן
  choice: திராட்சை மது
  rationale: יַיִן என்பதன் வழக்கமான பொருளைத் தெளிவாகக் காட்டி, அடுத்துவரும் שֵׁכָר என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: שֵׁכָר
  choice: போதையூட்டும் மதுபானம்
  rationale: திராட்சை மதுவைத் தவிர்ந்த பிற போதையூட்டும் பானங்களையும் உள்ளடக்கும் அகன்ற சொல்லாக்கம்; ஒரு குறிப்பிட்ட பானமாகக் குறுக்கவில்லை.
- source_word: כָל טֻמְאָה
  choice: தீட்டான எதையும்
  rationale: தோராவின் சடங்கு மற்றும் உடன்படிக்கைச் சார்ந்த தூய்மை மொழியைப் பாதுகாக்கிறது; ‘அசுத்தம்’ என்பதைக் காட்டிலும் இச்சூழலில் இயல்பானது.
- source_word: כֹּל אֲשֶׁר צִוִּיתִיהָ תִּשְׁמֹר
  choice: நான் அவளுக்குக் கட்டளையிட்ட அனைத்தையும் அவள் கடைப்பிடிக்க வேண்டும்
  rationale: முந்தைய கட்டளையைக் குறிப்பதையும் שׁמר என்பதன் ‘கடைப்பிடித்தல்’ என்ற பொருளையும் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: திராட்சைக்கொடியிலிருந்து வரும் பொருட்கள் மீதான தடையின் பரப்பு
  choice: திராட்சைக்கொடியிலிருந்து உண்டாகும் எதையும் என விரிவாக மொழிபெயர்த்தல்
  alternative: உண்ணத்தக்க திராட்சை அல்லது நேரடி திராட்சைப் பொருட்கள் மட்டுமே எனக் குறுக்குதல்
  rationale: ‘திராட்சை மதுவின் கொடியிலிருந்து வெளிவரும் அனைத்தும்’ என்ற எபிரெயச் சொற்றொடர் நோக்கமுடன் விரிவாக உள்ளது. சூழலிலுள்ள அர்ப்பணிப்பு விதிகளின் வலிமையைப் பாதுகாக்கிறது; அதேவேளையில் பிற்காலத் தொழில்நுட்பச் சொற்களை இறக்குமதி செய்யவில்லை.
- issue: טֻמְאָה என்பதன் மொழிபெயர்ப்பு
  choice: தீட்டான
  alternative: தூய்மையற்ற / அசுத்தமான
  rationale: ‘தீட்டு’ என்பது வேதாகமச் சடங்கு-தூய்மை வகைப்பாட்டை நவீன தமிழில் புரியத்தக்கவாறு காக்கிறது; வெறும் உடல் அழுக்கு என்ற பொருளுக்குக் குறுக்காது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. தடை வாக்கியங்களில் ‘கூடாது’ என்றும் இறுதிக் கட்டளையில் ‘கடைப்பிடிக்க வேண்டும்’ என்றும் கூறி கட்டளை வலிமை இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது.
