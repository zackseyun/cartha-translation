base_translation:
  language: en
  yaml_path: translation/ot/judges/013/014.yaml
  text: She must not eat anything that comes from the grapevine[a], and she must not drink wine or strong drink, and she must not eat anything unclean. She must keep all that I commanded her.
translation:
  language: ta
  text: 'திராட்சைக்கொடியிலிருந்து உண்டாகும் எதையும் அவள் உண்ணக் கூடாது[a]. திராட்சை மதுவையோ போதையூட்டும் மதுபானத்தையோ அவள் குடிக்கக் கூடாது; தீட்டான எதையும் அவள் உண்ணக் கூடாது. நான் அவளுக்குக் கட்டளையிட்ட அனைத்தையும் அவள் கடைப்பிடிக்க வேண்டும்.


    [a] எபிரெய மொழியில், “திராட்சை மதுவின் கொடியிலிருந்து வெளிவரும் எதையும்”; அதாவது, திராட்சைக்கொடியிலிருந்து கிடைக்கும் எதையும் குறிக்கிறது.'
  philosophy: optimal-equivalence
