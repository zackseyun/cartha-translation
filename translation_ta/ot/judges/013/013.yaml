source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר מַלְאַ֥ךְ יְהוָ֖ה אֶל מָנ֑וֹחַ מִ/כֹּ֛ל אֲשֶׁר אָמַ֥רְתִּי אֶל הָ/אִשָּׁ֖ה תִּשָּׁמֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/013.yaml
  text: And the angel of Yahweh said to Manoah[a], “The woman must be careful to do everything that I said to her.”
translation:
  language: ta
  text: யாவேவின் தூதர்[a] மனோவாவிடம், “நான் அந்தப் பெண்ணிடம் சொன்ன அனைத்தையும் அவள் கவனமாகக் கடைப்பிடிக்க வேண்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேவின் தேவதூதர்.” எபிரெயச் சொல் “தூதர்” அல்லது “தேவதூதர்” ஆகிய இரு பொருள்களையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியைத் தமிழில் இயல்பான உரையாடல் முடிவால் வெளிப்படுத்துகிறது; தனியாக ‘பின்பு’ போன்ற காலநுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேவின் தூதர்[a]
  rationale: מַלְאַךְ என்பது ‘தூதர்’ அல்லது விண்ணுலகத் ‘தேவதூதர்’ எனப் பொருள்படலாம். ‘தூதர்’ மூலச்சொல்லின் உண்மையான பொருள் இரட்டைத்தன்மையைத் தக்கவைக்கிறது; அடிக்குறிப்பு மாற்றுப் பொருளைக் குறிப்பிடுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், எபிரெய தனிப்பெயரின் தமிழாக்கமாக வழங்குகிறது.
- source_word: אֶל מָנוֹחַ
  choice: மனோவாவிடம்
  rationale: אֶל என்னும் முன்னிடைச்சொல்லையும் மனோவா என்னும் பெயரையும் இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: מִכֹּל אֲשֶׁר אָמַרְתִּי אֶל הָאִשָּׁה
  choice: நான் அந்தப் பெண்ணிடம் சொன்ன அனைத்தையும்
  rationale: எபிரெயச் சொற்றொடரின் முழுமையான வரம்பையும், ‘அந்தப் பெண்’ என்ற வெளிப்படையான குறிப்பையும் பாதுகாக்கிறது.
- source_word: תִּשָּׁמֵר
  choice: அவள் கவனமாகக் கடைப்பிடிக்க வேண்டும்
  rationale: שׁמר என்பதன் நிஃபால் வடிவம் இங்கு தன்னைக் காத்துக்கொண்டு அறிவுறுத்தல்களை எச்சரிக்கையுடன் பின்பற்றுவதைச் சுட்டுகிறது. ‘கவனமாகக் கடைப்பிடிக்க வேண்டும்’ என்பது கட்டளையின் நடைமுறைப் பொருளை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரைப் பாதுகாக்கிறது.
- issue: מַלְאַךְ யாரைக் குறிக்கிறது என்ற பொருள் நுணுக்கம்
  choice: தூதர்
  alternative: தேவதூதர்
  rationale: இச்சொல் மனிதத் தூதரையோ விண்ணுலகத் தூதரையோ குறிக்க முடியும். சூழல் விண்ணுலகத் தூதரைச் சுட்டினாலும், முதன்மை உரையில் ‘தூதர்’ என்று வைத்து சொற்பொருள் சார்ந்த இரட்டைத்தன்மையைப் பாதுகாத்து, மாற்றுப் பொருளை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அந்தப் பெண்’ என்பது மூலத்தின் வெளிப்படையான הָאִשָּׁה என்பதைக் காக்கிறது; ‘மனைவி’ என உறவுச்சொல் சேர்க்கப்படவில்லை.
