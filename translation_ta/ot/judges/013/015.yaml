source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מָנ֖וֹחַ אֶל מַלְאַ֣ךְ יְהוָ֑ה נַעְצְרָה נָּ֣א אוֹתָ֔/ךְ וְ/נַעֲשֶׂ֥ה לְ/פָנֶ֖י/ךָ גְּדִ֥י עִזִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/015.yaml
  text: Then Manoah said to the angel of the LORD, “Please let us detain you, and we will prepare a young goat for you.”
translation:
  language: ta
  text: அப்போது மனோவா யெகோவாவின் தூதரிடம், “தயவுசெய்து, உங்களைச் சிறிது நேரம் தங்கச் செய்ய எங்களை அனுமதியுங்கள்; உங்களுக்காக ஒரு வெள்ளாட்டுக்குட்டியைத் தயாரிப்போம்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: யெகோவாவின் தூதர்
  rationale: מַלְאַךְ என்பதற்கு இயல்பான ‘தூதர்’ என்பதையும், יהוה என்ற தனிப்பெயருக்கு ‘யெகோவா’ என்பதையும் பயன்படுத்தி உடைமைத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: נַעְצְרָה נָּא אוֹתָךְ
  choice: தயவுசெய்து சற்றுத் தங்குங்கள்
  rationale: சொல்லுக்குச் சொல் ‘உம்மைத் தடுத்து நிறுத்துவோம்’ என்றாலும், இங்கு விருந்தோம்பலுக்காகப் போகாமல் தங்கும்படி பணிவுடன் வேண்டுவதே பொருள்; நָא-வின் வேண்டுகோள் நயம் ‘தயவுசெய்து’ என வெளிப்படுகிறது.
- source_word: וְנַעֲשֶׂה לְפָנֶיךָ
  choice: உங்களுக்காகத் தயாரிப்போம்
  rationale: לְפָנֶיךָ சொல்லுருவில் ‘உங்கள் முன்னிலையில்’ என்றாலும், உணவு தயாரித்துப் பரிமாறும் சூழலில் பயனாளரைக் குறிக்கும் இயல்பான தமிழ் ‘உங்களுக்காக’ ஆகும்.
- source_word: גְּדִי עִזִּים
  choice: ஒரு வெள்ளாட்டுக்குட்டி
  rationale: இச்சொற்றொடர் ஆட்டினத்தைத் தெளிவுபடுத்தும் ‘வெள்ளாட்டுக்குட்டி’ என்பதைக் குறிக்கிறது; தமிழில் இயல்பாக ஒருமையை ‘ஒரு’ காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: எபிரேய மூலத்தில் பொதுப் பட்டப்பெயரான אֲדֹנָי அல்ல, தனிப்பெயரான יהוה உள்ளது. ஆகவே பெயர் மற்றும் பட்டப்பெயர் வேறுபாட்டைப் பாதுகாக்க ‘யெகோவா’ பயன்படுத்தப்பட்டது.
- issue: தூதருக்காக உணவு தயாரித்தலா அல்லது பலி செலுத்துதலா
  choice: உங்களுக்காக ஒரு வெள்ளாட்டுக்குட்டியைத் தயாரிப்போம்
  alternative: உங்கள் முன்னிலையில் ஒரு வெள்ளாட்டுக்குட்டியை ஆயத்தம் செய்வோம்
  rationale: இந்த வசனத்தில் மனோவாவின் நோக்கம் விருந்தோம்பலாகத் தோன்றுகிறது; அடுத்த வசனங்கள் அதன் வழிபாட்டு முக்கியத்துவத்தை வெளிப்படுத்துகின்றன. இங்கே முன்கூட்டியே ‘பலியிடுவோம்’ என மொழிபெயர்த்து அந்த வளர்ச்சியைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையான பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன. உரையாடல் இயல்பாகவும் கண்ணியமாகவும் வைக்கப்பட்டுள்ளது; ‘அப்போது’ கதைத் தொடர்ச்சியைச் சுட்டுகிறது.
