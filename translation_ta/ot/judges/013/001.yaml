source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד פְּלִשְׁתִּ֖ים אַרְבָּעִ֥ים שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[b][a], and Yahweh gave them into the hand of the Philistines for forty years.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள்[a] மீண்டும் யாவேயின் பார்வையில் தீயதைச் செய்தார்கள். யாவே அவர்களைப் பெலிஸ்தியர்களின் கையில்[b] நாற்பது ஆண்டுகளுக்கு ஒப்படைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘இஸ்ரவேலின் மகன்கள்’; இது இஸ்ரவேல் மக்கள் அனைவரையும் குறிக்கும் கூட்டு அடையாளம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பெலிஸ்தியர்களின் கையில்’ என்பது அவர்களுடைய அதிகாரத்திற்குள் அல்லது கட்டுப்பாட்டிற்குள் என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: மீண்டும்
  rationale: יסף என்பதுடன் வினையெச்சம் சேரும் இவ்வமைப்பு முந்தைய செயலைத் திரும்பச் செய்வதைக் குறிக்கிறது; நியாயாதிபதிகள் நூலின் சுழற்சி நடையில் ‘மீண்டும்’ இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு ஆண்களை மட்டும் அல்லாமல் இஸ்ரவேல் மக்களினம் முழுவதையும் குறிக்கும் கூட்டு அடையாளம். ‘இஸ்ரவேல் மக்கள்’ நவீனத் தமிழில் இயல்பாகவும் பொருள் துல்லியமாகவும் உள்ளது; மூலத்தின் குடும்பவழிச் சொல்லமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַעֲשׂוֹת הָרַע
  choice: தீயதைச் செய்தார்கள்
  rationale: நியாயாதிபதிகள் நூலில் மீண்டும் வரும் இந்த மரபுத்தொடர், யாவேயின் மதிப்பீட்டின்படி தீயதாக இருந்ததைச் செய்தார்கள் என்னும் பொருளைக் கொண்டது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: ‘யாவேயின் கண்களில்’ என்பது நேரடி உருவகம்; ‘யாவேயின் பார்வையில்’ அந்த மதிப்பீட்டு அர்த்தத்தையும் மூல உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது எபிரெய வேதாகமத்தின் தனிப்பட்ட இறைப்பெயர்; பட்டப்பெயரால் மாற்றாமல் தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיִּתְּנֵם
  choice: அவர்களை ... ஒப்படைத்தார்
  rationale: נתן உடன் ‘ஒருவரின் கையில்’ என்ற தொடர் வரும்போது, பிறரின் அதிகாரத்திற்கு ஒப்புக்கொடுப்பதைக் குறிக்கிறது. ‘ஒப்படைத்தார்’ தமிழில் அந்தச் சூழ்நிலைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களின் கையில்
  rationale: ‘கையில்’ என்ற எபிரெய உருவகம் அதிகாரத்திற்குள் அல்லது கட்டுப்பாட்டிற்குள் கொடுப்பதைக் குறிக்கிறது; தமிழிலும் புரியக்கூடியதால் உருவகம் காக்கப்படுகிறது.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இந்த மக்களினத்திற்கான நிலைபெற்ற தமிழ் ஒலிபெயர்ப்பு.
- source_word: אַרְבָּעִים שָׁנָה
  choice: நாற்பது ஆண்டுகள்
  rationale: செயலின் அல்லது அடக்குமுறையின் காலநீட்சியைத் தமிழில் நேரடியாகக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் இறைவனுடைய தனிப்பட்ட பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமலும் ‘Jehovah’ வடிவத்தைப் பின்பற்றாமலும், பொதுவாக ஏற்றுக்கொள்ளப்படும் உச்சரிப்பைத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற கூட்டு அடையாளம்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்; இஸ்ரவேலின் பிள்ளைகள்
  rationale: இலக்கண வடிவம் ஆண்பால் பன்மையாக இருந்தாலும், சூழலில் இஸ்ரவேல் சமுதாயம் முழுவதையும் குறிக்கிறது. தமிழில் ‘மகன்கள்’ என்பது ஆண்களை மட்டும் குறிக்கும் தவறான எண்ணத்தை உண்டாக்கக்கூடும்; ஆகவே கூட்டு அர்த்தம் முதன்மை உரையில் தரப்பட்டு, நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘பெலிஸ்தியர்களின் கையில்’ என்ற உருவகம்
  choice: உருவகத்தை முதன்மை உரையில் காத்தல்
  alternative: பெலிஸ்தியர்களின் அதிகாரத்திற்குள்
  rationale: ‘கை’ என்பது ஆட்சி அல்லது அதிகாரத்தைக் குறிக்கும் எபிரெய உருவகம். தமிழிலும் அது புரிந்துகொள்ளக்கூடியது; அதன் துல்லியமான பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நியாயாதிபதிகள் நூலின் மீளும் கதைநடையை ‘மீண்டும்’ காக்கிறது. மூலத்தின் ‘கை’ உருவகம் உரையில் வைக்கப்பட்டு விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
