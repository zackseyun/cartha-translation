- from: யெகோவாவின் ஆவி அவனைத் தூண்டத் தொடங்கியது[a]; அது சோராவுக்கும் எஸ்தாவோலுக்கும் இடையிலுள்ள மகனே-தாணில்[b] நிகழ்ந்தது.
  to: யாவேவின் ஆவி அவனைத் தூண்டத் தொடங்கியது[a]; சோராவுக்கும் எஸ்தாவோலுக்கும் இடையிலுள்ள மகனே-தாண் என்னும் இடத்தில்[b].
  rationale: The revision restores the Hebrew syntax by making Mahaneh-dan, between Zorah and Eshtaol, the location of the Spirit’s stirring of Samson. It also changes the divine name to 'யாவே,' consistent with the project policy, while preserving the draft’s cautious lexical rendering and both required footnote anchors.
