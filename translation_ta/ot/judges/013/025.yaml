  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/תָּ֨חֶל֙ ר֣וּחַ יְהוָ֔ה לְ/פַעֲמ֖/וֹ בְּ/מַחֲנֵה דָ֑ן בֵּ֥ין צָרְעָ֖ה וּ/בֵ֥ין אֶשְׁתָּאֹֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/025.yaml
  text: And the Spirit of Yahweh began to stir him in Mahaneh-dan[b][a], between Zorah and Eshtaol.
translation:
  language: ta
  text: யாவேவின் ஆவி அவனைத் தூண்டத் தொடங்கியது[a]; சோராவுக்கும் எஸ்தாவோலுக்கும் இடையிலுள்ள மகனே-தாண் என்னும் இடத்தில்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனை உந்தத் தொடங்கியது” அல்லது “அவனை இயக்கத் தொடங்கியது.”
    reason: lexical_alternative
  - marker: b
    text: “மகனே-தாண்” என்பதற்கு “தாணின் முகாம்” என்று பொருள்; இங்கு அது ஓர் இடப்பெயர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּחֶל
  choice: தொடங்கியது
  rationale: חלל என்பதன் ஹிஃபில் தொடக்கப் பொருளையும் எபிரெயக் கதைநடையின் நிகழ்வுத் தொடரையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: רוּחַ יְהוָה
  choice: யெகோவாவின் ஆவி
  rationale: நியாயாதிபதிகள் நூலின் சூழலில் רוּחַ என்பது சிம்சோனைச் செயல்பட வைக்கும் இறை ஆவியைக் குறிக்கிறது; יְהוָה என்ற தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְפַעֲמוֹ
  choice: அவனைத் தூண்ட
  rationale: פעם இங்கு ஒருவரை இயக்குதல் அல்லது உந்துதல் என்ற பொருள் தருகிறது. ‘தூண்ட’ என்பது செயற்பாட்டுக்கான இறை உந்துதலைக் காட்டுகிறது; ஆனால் அதன் துல்லிய நுண்பொருள் தெளிவாக நிர்ணயிக்கப்படாததால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּמַחֲנֵה דָן
  choice: மகனே-தாணில்
  rationale: சொற்படி ‘தாணின் முகாம்’ என்றாலும் இங்கு அது இடப்பெயராகச் செயல்படுவதால் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: சோராவுக்கும் எஸ்தாவோலுக்கும் இடையில்
  rationale: இரு இடப்பெயர்களுக்கு இடையிலான புவியியல் அமைப்பை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: רוּחַ יְהוָה என்பதன் இயல்பு
  choice: யெகோவாவின் ஆவி எனும் இறை வல்லமையூட்டும் செயல்பாடு
  alternative: யெகோவாவின் காற்று அல்லது மூச்சு
  rationale: சிம்சோன் கதையின் உடனடிச் சூழலில் இந்தச் சொற்றொடர் அவனைச் செயல்பட வைக்கும் யெகோவாவின் ஆவியைக் குறிக்கிறது; பிற்காலக் கோட்பாட்டு விவரங்களை வசனத்திற்குள் சேர்க்கவில்லை.
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் உள்ள நான்கு எழுத்து இறைப் பெயரை பொதுவாக அறியப்பட்ட தமிழ்ச் சொல்வடிவமான ‘யெகோவா’ என்று நேரடியாகக் காட்டுகிறது; பட்டப்பெயரால் மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொல்வரிசையை அப்படியே பின்பற்றுவதால் தமிழில் ஏற்படும் இடரைக் தவிர்க்க, இடத்தைக் குறிக்கும் கூறு தனி வாக்கியத் தொடராக அமைக்கப்பட்டுள்ளது; பொருள் மாற்றப்படவில்லை.
