  to: யாவேவின் தூதர் அவனிடம், “என் பெயரை ஏன் கேட்கிறாய்? அது வியப்புக்குரியதாய் இருக்கையில்!” என்றார்.
  rationale: ‘யெகோவா’ என்பதை மூல-திட்டத்தின் தெய்வநாம வடிவத்துக்கு ஏற்ப ‘யாவே’ என மாற்றியுள்ளோம். வாக்கியத்தின் விளக்கத் தொடர்பை வெளிப்படுத்த ‘அது வியப்புக்குரியதாய் இருக்கையில்’ என அமைத்துள்ளோம். இதனால் பெயரின் தன்மை குறித்த மூலத்தின் வியப்பூட்டும், முழுமையாகப் புரிந்துகொள்ள முடியாத சாத்தியம் பாதுகாக்கப்படுகிறது; தூதரின் அடையாளத்தைப் பற்றி எந்த இறையியல் முடிவும் சேர்க்கப்படவில்லை.
