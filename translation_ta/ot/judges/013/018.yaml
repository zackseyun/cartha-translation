  yaml_path: translation/ot/judges/013/018.yaml
  text: And the angel of Yahweh said to him[a], “Why do you ask my name, seeing it is wonderful?”
translation:
  language: ta
  text: யாவேவின் தூதர் அவனிடம், “என் பெயரை ஏன் கேட்கிறாய்? அது வியப்புக்குரியதாய் இருக்கையில்!” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: யெகோவாவின் தூதர்
  rationale: מַלְאַךְ என்பது ‘தூதர்’ அல்லது ‘வானதூதர்’ எனப் பொருள்படலாம். இக்கதையில் இயற்கைக்கு அப்பாற்பட்ட இறைத்தூதர் குறிக்கப்பட்டாலும், ‘தூதர்’ என்பது எபிரெயச் சொல்லின் பணிசார் பொருளையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவமாக வழங்குகிறது.
- source_word: לָמָּה זֶּה
  choice: ஏன்
  rationale: இது வினாவை வலியுறுத்தும் எபிரெய மரபுத்தொடர்; தமிழில் ‘ஏன்’ அதன் இயல்பான வினாவாற்றலைத் தருகிறது.
- source_word: תִּשְׁאַל לִשְׁמִי
  choice: என் பெயரை ஏன் கேட்கிறாய்
  rationale: שׁאל + ל என்பதன் பொருள் ஒருவருடைய பெயரைக் கேட்பது அல்லது விசாரிப்பது. நேரடியான நவீன தமிழில் ‘என் பெயரைக் கேட்கிறாய்’ இயல்பாக உள்ளது.
- source_word: וְהוּא
  choice: அது
  rationale: இணைப்புச் சொல் முன்னுள்ள வினாவுக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் தனி வாக்கிய அமைப்பு அந்த விளக்கத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פֶלִאי
  choice: வியப்புக்குரியது
  rationale: இந்தச் சொல் சாதாரணத்தை மீறிய, வியக்கத்தக்க, மனிதப் புரிதலுக்கு எளிதில் எட்டாத தன்மையைக் குறிக்கிறது. ‘வியப்புக்குரியது’ அடிப்படைப் பொருளைக் காத்து, ‘இரகசியமானது’ அல்லது ‘புரிந்துகொள்ள முடியாதது’ என்று ஒரே நுண்பொருளுக்குள் அதைச் சுருக்குவதில்லை.
theological_decisions:
- issue: פֶלִאי என்பதன் சாத்தியமான இறைத்தோற்ற அல்லது கிறிஸ்துவியல் முக்கியத்துவம்
  choice: அடையாளத்தைத் தீர்மானிக்காமல் ‘வியப்புக்குரியது’ என மொழிபெயர்த்தல்
  alternative: ‘புரிந்துகொள்ள முடியாதது’ என விளக்கமாக மொழிபெயர்த்தல் அல்லது ஒரு பட்டப்பெயராகக் காட்டுதல்
  rationale: இந்த வசனம் யெகோவாவின் தூதருடைய அடையாளத்தைப் பற்றிய இறையியல் சிந்தனைக்கு இடமளிக்கிறது. ஆயினும் மொழிபெயர்ப்பு அந்த அடையாளத்தை முன்கூட்டியே தீர்மானிக்காமல், எபிரெயச் சொல்லின் வியப்பும் புரிதலை மீறும் சாத்தியமும் நிலைத்திருக்குமாறு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிமையும் கொண்ட வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘வியப்புக்குரியது’ என்ற சொல் மூலத்தின் நுண்பொருள் பரப்பையும் இறையியல் பதற்றத்தையும் காக்கிறது.
