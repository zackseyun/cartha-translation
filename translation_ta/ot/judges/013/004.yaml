id: JDG.13.4
reference: Judges 13:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עַתָּה֙ הִשָּׁ֣מְרִי נָ֔א וְ/אַל תִּשְׁתִּ֖י יַ֣יִן וְ/שֵׁכָ֑ר וְ/אַל תֹּאכְלִ֖י כָּל טָמֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/004.yaml
  text: Now please be careful[a], and do not drink wine or strong drink[c][b], and do not eat anything unclean.
translation:
  language: ta
  text: இப்போது தயவுசெய்து எச்சரிக்கையாக இரு[a]. திராட்சை மதுவையோ போதை தரும் பானத்தையோ[b] குடிக்காதே; தீட்டான எதையும் உண்ணாதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னைக் கவனமாகக் காத்துக்கொள்.”
    reason: lexical_alternative
  - marker: b
    text: “போதை தரும் பானம்” என்பது திராட்சை மதுவைத் தவிர்ந்த பிற மதுபானங்களைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: அடுத்து வரும் அறிவுறுத்தலை அறிமுகப்படுத்தும் கால/உரையாடல் குறியீடு. தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הִשָּׁמְרִי נָא
  choice: தயவுசெய்து எச்சரிக்கையாக இரு
  rationale: שׁמר என்பதன் இங்குள்ள தற்காப்புப் பொருளான கவனமாயிருத்தலை வெளிப்படுத்துகிறது; נָא என்பதன் வேண்டுகோள் நயத்தை ‘தயவுசெய்து’ காட்டுகிறது.
- source_word: וְאַל תִּשְׁתִּי
  choice: குடிக்காதே
  rationale: பெண்ணை நோக்கிக் கூறப்படும் நேரடியான தடையை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: יַיִן
  choice: திராட்சை மது
  rationale: יַיִן என்பதைக் பொதுவான போதைப் பானத்திலிருந்து வேறுபடுத்தி, இச்சூழலில் குறிக்கப்படும் திராட்சை மதுவைத் தெளிவுபடுத்துகிறது.
- source_word: וְשֵׁכָר
  choice: போதை தரும் பானம்
  rationale: திராட்சை மதுவைத் தவிர்ந்த பிற போதை தரும் பானங்களை உள்ளடக்கும் பரந்த சொல்லாக அமைந்து, ‘பீர்’ என்ற தேவையற்ற குறுக்கத்தைத் தவிர்க்கிறது.
- source_word: וְאַל תֹּאכְלִי
  choice: உண்ணாதே
  rationale: இரண்டாவது தடையை நேரடியாகவும் கண்ணியமான நடையிலும் வழங்குகிறது.
- source_word: כָּל טָמֵא
  choice: தீட்டான எதையும்
  rationale: כָּל உடன் பெயர்ச்சொல்லாகப் பயன்படும் טָמֵא, தீட்டான எந்த உணவுப் பொருளையும் குறிக்கிறது. ‘தீட்டு’ என்பது சடங்கு/உடன்படிக்கை சார்ந்த வகைப்பாட்டைப் பேணுகிறது.
theological_decisions:
- issue: טָמֵא என்பதன் பொருள்
  choice: தீட்டான
  alternative: அசுத்தமான
  rationale: இச்சூழலில் இது வெறும் சுகாதாரக் குறைவையோ ஒழுக்கத் தீமையையோ அல்லாமல், தோராவில் காணப்படும் சடங்கு சார்ந்த தீட்டு வகையைச் சுட்டுகிறது. ‘தீட்டான’ என்பது அந்த வேதாகமக் கருத்தைத் தெளிவாகப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமைப் பெண்ணை நோக்கிய நேரடி அறிவுறுத்தலின் நயத்தைப் பேணும் கண்ணியமான, எளிதில் புரியும் நடை. தமிழில் வினை வடிவம் பாலினத்தைக் காட்டாததால், எபிரேயப் பெண்பால் வடிவம் தனியாக வெளிப்படவில்லை.
