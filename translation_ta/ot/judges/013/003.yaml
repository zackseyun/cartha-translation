  text: וַ/יֵּרָ֥א מַלְאַךְ יְהוָ֖ה אֶל הָ/אִשָּׁ֑ה וַ/יֹּ֣אמֶר אֵלֶ֗י/הָ הִנֵּה נָ֤א אַתְּ עֲקָרָה֙ וְ/לֹ֣א יָלַ֔דְתְּ וְ/הָרִ֖ית וְ/יָלַ֥דְתְּ בֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/003.yaml
  text: And the angel of the LORD appeared to the woman and said to her, “Look, please—you are barren and have not borne children, but you will conceive and bear a son.”
translation:
  language: ta
  text: ஆண்டவரின்[a] தூதர் அந்தப் பெண்ணுக்குத் தோன்றி, அவளிடம், “இதோ[b], நீ பிள்ளைப்பேறற்றவள்; இதுவரை குழந்தை பெற்றதில்லை. ஆனால் நீ கருவுற்று ஒரு மகனைப் பெறுவாய்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மூல எபிரெயத்தில் இங்கு கடவுளின் தனிப்பெயரான יהוה (YHWH) உள்ளது; அது ‘ஆண்டவர்’ என்று வழங்கப்பட்டுள்ளது.
    reason: முதன்மை உரையில் மரபான பட்டப்பெயர் பயன்படுத்தப்பட்டாலும், மூலத்தின் தெய்வீகத் தனிப்பெயரை வாசகர் அறியச் செய்கிறது.
  - marker: b
    text: “இதோ” என்பதற்குப் பின் எபிரெயத்தில் வேண்டுகோள் அல்லது மென்மையான வலியுறுத்தலைக் குறிக்கக்கூடிய ஒரு துகள் உள்ளது.
    reason: הִנֵּה נָא என்பதிலுள்ள נָא-வின் நுண்ணிய, சூழலால் தீர்மானிக்கப்படும் பொருளை மிகைப்படுத்தாமல் காக்கிறது.
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: ஆண்டவரின் தூதர்
  rationale: מַלְאַךְ என்பது செய்தியாளர் அல்லது தூதர் எனப் பொருள்படும்; இச்சூழலில் வழக்கமான, இயல்பான ‘தூதர்’ பொருத்தமானது. יהוה என்ற தெய்வீகப் பெயர் முதன்மை உரையில் மரியாதை மரபின்படி ‘ஆண்டவர்’ என வழங்கப்பட்டு, அடிக்குறிப்பில் அதன் தனிப்பெயர்த் தன்மை சுட்டப்படுகிறது.
- source_word: הִנֵּה נָא
  choice: இதோ
  rationale: הִנֵּה கவனத்தை ஈர்க்கும் சொல். נָא இங்கு வேண்டுகோள் அல்லது மென்மையான வலியுறுத்தலைக் குறிக்கலாம்; தமிழில் ‘தயவுசெய்து’ என்று நேரடியாகச் சேர்ப்பது இந்த அறிவிப்பில் செயற்கையாக இருப்பதால், ‘இதோ’வில் அதன் உரையாடல் வலிமை இயல்பாகக் காக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: עֲקָרָה
  choice: பிள்ளைப்பேறற்றவள்
  rationale: கருத்தரிக்க இயலாத அல்லது குழந்தை பிறக்காத பெண்ணைக் குறிக்கும் சொல்லை நவீன, கண்ணியமான தமிழில் தருகிறது; இழிவுபடுத்தக்கூடிய சொற்கள் தவிர்க்கப்படுகின்றன.
- source_word: וְהָרִית וְיָלַדְתְּ בֵּן
  choice: ஆனால் நீ கருவுற்று ஒரு மகனைப் பெறுவாய்
  rationale: முன்னைய பிள்ளைப்பேறின்மைக்கு மாறான எதிர்கால வாக்குறுதியைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது. ‘கருவுற்று’ மற்றும் ‘பெறுவாய்’ ஆகியவை கருத்தரித்தல், மகப்பேறு என்ற இரு தனித்த செயல்களையும் காக்கின்றன.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: முதன்மை உரையில் ‘ஆண்டவர்’; அடிக்குறிப்பில் יהוה ஒரு தனிப்பெயர் என்பதைக் குறிப்பிடுதல்
  alternative: ‘யாவே’ அல்லது ‘யெகோவா’ என்று ஒலிபெயர்த்தல்
  rationale: தமிழ் வேதாகம வாசிப்பு மரபில் புரிந்துகொள்ளக்கூடிய மரியாதை வடிவத்தைப் பயன்படுத்துகிறது; அதே நேரத்தில் மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, தெய்வீகத் தனிப்பெயர் இருப்பதை மறைக்காமல் அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: வாக்கியத்தின் இறுதி வினைச்சொற்கள் எதிர்கால அறிவிப்பா அல்லது கட்டளையா
  choice: எதிர்கால அறிவிப்பாக ‘கருவுற்று… பெறுவாய்’
  alternative: ‘கருவுற்று… பெற்றெடு’ என்ற கட்டளை வடிவம்
  rationale: இச்சூழலும் எபிரெய வினை வடிவங்களும் வரவிருக்கும் நிகழ்வைத் தூதர் அறிவிப்பதைக் காட்டுகின்றன; கட்டளையாக மாற்றுவது தேவையற்ற விளக்கத் தீர்மானமாகிவிடும்.
translation_notes:
  register: நவீன தரமான, கண்ணியமான, பொதுவாசகருக்கு எளிதான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அந்தப் பெண்’ என்பது முந்தைய சூழலில் அறிமுகமான பெண்ணைச் சுட்டும் எபிரெயத் திட்டவட்டச் சுட்டியை இயல்பாகக் காக்கிறது. நேரடி உரை எளிமையாகவும் தீர்க்கமான அறிவிப்பின் தொனியுடனும் அமைக்கப்பட்டுள்ளது.
