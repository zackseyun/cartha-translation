source:
  edition: WLC
  text: וַ/תְּיַשְּׁנֵ֨/הוּ֙ עַל בִּרְכֶּ֔י/הָ וַ/תִּקְרָ֣א לָ/אִ֔ישׁ וַ/תְּגַלַּ֕ח אֶת שֶׁ֖בַע מַחְלְפ֣וֹת רֹאשׁ֑/וֹ וַ/תָּ֨חֶל֙ לְ/עַנּוֹת֔/וֹ וַ/יָּ֥סַר כֹּח֖/וֹ מֵ/עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/019.yaml
  text: So she made him sleep on her knees[a], and she called for a man, and she shaved off the seven locks of his head. Then she began to afflict him[c][b], and his strength left him.
translation:
  language: ta
  text: அவள் அவனைத் தன் முழங்கால்களின்மேல்[a] தூங்கச் செய்து, ஒரு மனிதனை அழைத்தாள்[b]. அவனுடைய தலையிலிருந்த ஏழு முடிக்கற்றைகளையும்[c] அவள் மழித்துவிட்டாள். பின்பு அவள் அவனைத் துன்புறுத்தத் தொடங்கினாள்; அவனுடைய வலிமை அவனைவிட்டு நீங்கியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் மடியில்’; சொல்லர்த்தமாக, ‘தன் முழங்கால்களின்மேல்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஒரு மனிதனை வரவழைத்தாள்.’ இச்செயலைச் செய்வதற்காக ஒருவனை அழைத்ததையோ, ஏற்கெனவே அருகிலிருந்த ஒருவனைக் கூப்பிட்டதையோ எபிரெயச் சொற்றொடர் குறிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, ‘அவனுடைய தலையிலிருந்த ஏழு பின்னல்களையும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּיַשְּׁנֵהוּ
  choice: அவனைத் ... தூங்கச் செய்து
  rationale: ישׁן என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளைக் கொண்டது; அவள் அவனைத் தூங்கச் செய்தாள் என்பதைக் கூடுதல் முறையை ஊகிக்காமல் இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַל בִּרְכֶּיהָ
  choice: தன் முழங்கால்களின்மேல்
  rationale: எபிரெயச் சொல் நேரடியாக ‘அவளுடைய முழங்கால்கள்’ என்று கூறுகிறது; தமிழில் புரிதலுக்காக ‘தன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַתִּקְרָא לָאִישׁ
  choice: ஒரு மனிதனை அழைத்தாள்
  rationale: לְ உடன் வரும் אִישׁ ஒருவனை அழைத்தல் அல்லது வரவழைத்தல் எனப் பொருள்படலாம். எபிரெயில் திட்டவட்டமான சுட்டுரை இல்லாததால் ‘ஒரு மனிதனை’ என வழங்கப்படுகிறது.
- source_word: וַתְּגַלַּח
  choice: அவள் மழித்துவிட்டாள்
  rationale: வினைச்சொல் பெண்பால் ஒருமையில் இருப்பதால் தெலீலாளே இலக்கண எழுவாய். அழைக்கப்பட்ட மனிதன் மூலம் செயலைச் செய்திருக்கலாம் என்ற சாத்தியத்தை உரை தீர்மானிப்பதில்லை.
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשׁוֹ
  choice: அவனுடைய தலையிலிருந்த ஏழு முடிக்கற்றைகள்
  rationale: מַחְלְפוֹת என்பது முடிக்கற்றைகள் அல்லது பின்னல்கள் எனப் பொருள்படக்கூடும். ‘முடிக்கற்றைகள்’ இயல்பானதும் மூலத்தின் பொதுத்தன்மையைப் பேணுவதுமாகும்.
- source_word: לְעַנּוֹתוֹ
  choice: அவனைத் துன்புறுத்த
  rationale: ענה என்பதன் பியேல் வடிவம் துன்புறுத்துதல், ஒடுக்குதல், சிறுமைப்படுத்துதல் ஆகிய பரப்பைக் கொண்டது. இங்கு குறிப்பிட்ட முறையைச் சேர்க்காமல் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: וַיָּסַר כֹּחוֹ מֵעָלָיו
  choice: அவனுடைய வலிமை அவனைவிட்டு நீங்கியது
  rationale: வலிமை அவனிடமிருந்து அகன்றது என்ற எபிரெய மொழிநடையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: சிம்சோனிடமிருந்து நீங்கிய வலிமையின் இயல்பு
  choice: ‘அவனுடைய வலிமை அவனைவிட்டு நீங்கியது’ என்று வசனம் கூறும் அளவிலேயே மொழிபெயர்த்தல்
  alternative: ‘கர்த்தர் கொடுத்த வலிமை அவனைவிட்டு நீங்கியது’ என்று விரிவாக்குதல்
  rationale: இந்த வசனம் வலிமை நீங்கியதாக மட்டுமே கூறுகிறது; கர்த்தரை வெளிப்படையாகச் சேர்ப்பது சூழலிலிருந்து பெறப்படும் விளக்கத்தை வசனத்திற்குள் கொண்டுவரும். மூலத்தின் இறையியல் அழுத்தமும் மறைமுகத்தன்மையும் பேணப்படுகின்றன.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, எளிதில் புரியும் கண்ணியமான உரைநடை. ‘மழித்துவிட்டாள்’ தலைமுடியை முழுமையாக வெட்டியகற்றும் செயலை இயல்பாகக் குறிக்கிறது; பெண்பால் எழுவாயும் மூலத்தின்படி வெளிப்படையாகப் பேணப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
