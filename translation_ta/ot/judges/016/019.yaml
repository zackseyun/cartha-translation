  source_fidelity: மூல எபிரெயத்தின் காரணவினை, ‘தன் முழங்கால்களின்மேல்’ என்ற இடக்குறிப்பு, ஒருவனை அழைத்தல், பெண்பால் ஒருமை வினையுடன் தலைமுடியின் ஏழு கற்றைகளை மழித்தல், பின்னர் துன்புறுத்தத் தொடங்குதல், வலிமை நீங்குதல் ஆகிய அனைத்தும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. அழைக்கப்பட்டவன் செயலைச் செய்தான் என்று உரை வெளிப்படையாகக் கூறாத WLC-யின் இலக்கண வடிவம் பாதுகாக்கப்பட்டுள்ளது.
  naturalness: நடை நவீனத் தரநிலைத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘தூங்கச் செய்து,’ ‘முடிக்கற்றைகள்,’ ‘துன்புறுத்தத் தொடங்கினாள்,’ ‘அவனைவிட்டு நீங்கியது’ ஆகியவை இயல்பானவை. வாக்கியப் பிரிப்பு வாசிப்பை எளிதாக்குகிறது; பொருளில் மாற்றமில்லை.
  terminology: ‘முடிக்கற்றைகள்’ மַחְלְפוֹת என்பதன் பரந்த பொருளைச் சரியாகக் காக்கிறது; மாற்றுவாசிப்பாக ‘பின்னல்கள்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது. ‘வலிமை’ மூலத்தில் வெளிப்படையாகக் குறிப்பிடப்படாத இறையியல் விளக்கத்தைச் சேர்க்காமல் כֹּחוֹ என்பதற்குப் பொருத்தமானது. அடிக்குறிப்பு குறிகளான a, b, c உரையில் சரியான இடங்களில் உள்ளன.
