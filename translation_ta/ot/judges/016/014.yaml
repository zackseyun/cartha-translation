base_translation:
  language: en
  yaml_path: translation/ot/judges/016/014.yaml
  text: Then she fastened it with the pin and said to him[a], “The Philistines are upon you[c][b], Samson!” And he awoke from his sleep and pulled away the pin of the loom and the web.
translation:
  language: ta
  text: பின்பு அவள் அதை முளையால்[a] இறுக்கிப் பொருத்திவிட்டு, அவனிடம், “சிம்சோனே, பெலிஸ்தியர்கள் உன்மேல் வந்துவிட்டார்கள்!” என்றாள். அவன் தூக்கத்திலிருந்து விழித்து, நெசவுத்தறியின் முளையையும் நெய்த துணியையும்[c] பிடுங்கியெடுத்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆப்பால்.’ எபிரெயச் சொல் ஆப்பு அல்லது முளை போன்ற பொருத்தும் சாதனத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இழுத்து அகற்றினான்’ அல்லது ‘பெயர்த்தெடுத்தான்.’ எபிரெய வினை வலிமையாக அகற்றுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘நெய்யப்பட்ட பகுதி.’ எபிரெயச் சொல் தறியிலுள்ள நெய்யப்பட்ட பொருளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְקַע
  choice: இறுக்கிப் பொருத்திவிட்டு
  rationale: תקע என்பது அடித்துப் பதித்தல் அல்லது உறுதியாகப் பொருத்துதல் எனப் பொருள்படும். முந்தைய வசனத்தில் கூறப்பட்ட நெசவு அமைப்பை முன்னிட்டு, செய்முறையை அளவுக்கு மீறிக் குறிப்பாக்காமல் இயல்பான தமிழில் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: בַּיָּתֵד
  choice: முளையால்
  rationale: יָתֵד என்பது ஆப்பு, முளை அல்லது பொருத்தும் குச்சி போன்ற சாதனத்தைக் குறிக்கலாம். நெசவுத்தறிச் சூழலில் ‘முளை’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது; בְּ கருவிப் பொருளில் ‘-ஆல்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: பெலிஸ்தியர்கள் உன்மேல் வந்துவிட்டார்கள்
  rationale: சிம்சோன் கதையில் மீண்டும் வரும் எச்சரிக்கைச் சொற்றொடரின் அவசரத்தையும், ‘உன்மேல்’ என்ற எபிரெய உருவகத்தையும் பாதுகாக்கிறது.
- source_word: וַיִּיקַץ מִשְּׁנָתוֹ
  choice: அவன் தூக்கத்திலிருந்து விழித்து
  rationale: வினையையும் அதனுடன் வரும் முன்னிடைத் தொடரையும் நேரடியாகவும் இயல்பான தமிழ் கதைநடையிலும் தருகிறது.
- source_word: וַיִּסַּע
  choice: பிடுங்கியெடுத்தான்
  rationale: נסע இங்கு பொருத்தப்பட்டிருந்தவற்றை வலிமையாக அகற்றுவதைக் குறிக்கிறது. ‘பிடுங்கியெடுத்தான்’ அந்தச் செயலைத் தெளிவாகக் காட்டுகிறது; பயணம் தொடங்குதல் என்ற வேறு பொருளைத் தவிர்க்கிறது.
- source_word: הַיְתַד הָאֶרֶג
  choice: நெசவுத்தறியின் முளை
  rationale: நெசவு அமைப்புடன் தொடர்புடைய முளையை இயல்பான தமிழில் காட்டுகிறது; எபிரெயச் சொற்றொடரின் தொடர்பும் காக்கப்படுகிறது.
- source_word: הַמַּסָּכֶת
  choice: நெய்த துணி
  rationale: מַסָּכֶת என்பது தறியில் நெய்யப்பட்ட பொருளைக் குறிக்கிறது. ‘நெய்த துணி’ பொதுவாசகருக்குத் தெளிவானது; ‘பாவு’ போன்ற தொழில்நுட்பமான, கூடுதல் குறிப்பாக்கம் கொண்ட சொல்லைத் தவிர்க்கிறது.
