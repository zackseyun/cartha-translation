translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து புரிந்துகொள்ளப்படும் செயப்படுபொருள் ‘அதை’ என வெளிப்படுத்தப்பட்டுள்ளது. நெசவுச் சொற்களில் அளவுக்கு மீறிய தொழில்நுட்பத் துல்லியத்தைத் தவிர்த்து, மூலத்தின் சாத்தியமான பொருள் வரம்பு அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
