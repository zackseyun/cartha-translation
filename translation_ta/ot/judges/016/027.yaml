base_translation:
  language: en
  yaml_path: translation/ot/judges/016/027.yaml
  text: The house was full of men and women[a], and all the lords of the Philistines were there. And on the roof were about three thousand men and women watching Samson as he performed.
translation:
  language: ta
  text: அந்தக் கட்டிடம் ஆண்களாலும் பெண்களாலும் நிறைந்திருந்தது; பெலிஸ்தியரின் அதிபதிகள் அனைவரும் அங்கே இருந்தார்கள். கூரையின்மேல் ஏறக்குறைய மூவாயிரம் ஆண்களும் பெண்களும் சிம்சோன் வேடிக்கை காட்டுவதைப் பார்த்துக்கொண்டிருந்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிம்சோன் விளையாடுவதைப் பார்த்துக்கொண்டிருந்தார்கள்”; இன்னும் சொற்சார்பாக, “சிம்சோனின் கேளிக்கையைப் பார்த்துக்கொண்டிருந்தார்கள்.” இங்குள்ள எபிரெயச் சொல் சிரித்தல், விளையாடுதல், வேடிக்கை செய்தல் அல்லது மகிழ்வித்தல் ஆகிய பொருட்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: அந்தக் கட்டிடம்
  rationale: இச்சொல் அடிப்படையில் ‘வீடு/கட்டிடம்’ எனப் பொருள்படும். சூழல் தாகோனின் ஆலய வளாகத்தைச் சுட்டினாலும், எபிரெய உரை இங்கு ‘ஆலயம்’ என்று குறிப்பாகச் சொல்லாததால், இயல்பானதும் மிகைப்படுத்தாததுமான ‘கட்டிடம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מָלֵא
  choice: நிறைந்திருந்தது
  rationale: நிறைந்த நிலையில் இருந்ததைச் சுட்டும் வினை; தமிழில் இயல்பாக அந்த நிலைப்பொருளைத் தெரிவிக்கிறது.
- source_word: הָאֲנָשִׁים ... וְהַנָּשִׁים
  choice: ஆண்களாலும் பெண்களாலும்
  rationale: மூலத்தில் இரு பாலரும் தனித்தனியாகக் குறிப்பிடப்படுவதைத் தக்கவைக்கிறது; ‘நிறைந்திருந்தது’ என்பதோடு கருவிவேற்றுமை இயல்பாக அமைகிறது.
- source_word: כֹּל סַרְנֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியரின் அதிபதிகள் அனைவரும்
  rationale: סַרְנֵי என்பது பெலிஸ்தியரின் தனித்துவமான உயர்நிலை ஆட்சியாளர்களைக் குறிக்கிறது. ‘அதிபதிகள்’ அவர்களது அரசியல் நிலையைக் கண்ணியமான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְעַל הַגָּג
  choice: கூரையின்மேல்
  rationale: גָּג என்பதன் நேரடியான பொருள் ‘கூரை’; இடத்தை முன்வைக்கும் எபிரெய அமைப்பும் தமிழில் தக்கவைக்கப்படுகிறது.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים
  choice: ஏறக்குறைய மூவாயிரம்
  rationale: முன்னொட்டு כ இங்கு தோராயமான எண்ணிக்கையைக் குறிக்கிறது.
- source_word: אִישׁ וְאִשָּׁה
  choice: ஆண்களும் பெண்களும்
  rationale: ஒருமை வடிவங்கள் பகிர்நிலைப் பொருளில் பன்மையான கலப்புப் பாலினக் கூட்டத்தைக் குறிக்கின்றன; தமிழ் இயல்புக்கு ஏற்ப பன்மையில் தரப்பட்டது.
- source_word: הָרֹאִים
  choice: பார்த்துக்கொண்டிருந்தார்கள்
  rationale: கூரையிலிருந்த மக்கள் தொடர்ந்து காட்சியைப் பார்த்துக்கொண்டிருந்ததை நிகழ்நிலைத் தொடர்வினையாக வெளிப்படுத்துகிறது.
- source_word: בִּשְׂחוֹק שִׁמְשׁוֹן
  choice: சிம்சோன் வேடிக்கை காட்டுவதை
  rationale: שׂחק வேர் சிரித்தல், விளையாடுதல், கேளிக்கை செய்தல் அல்லது மகிழ்வித்தல் ஆகிய பொருட்களைத் தரலாம். உடனடி கதைச்சூழலில் சிம்சோன் கூட்டத்திற்குக் காட்சிப்பொருளாக்கப்பட்டிருப்பதால் ‘வேடிக்கை காட்டுவது’ இயல்பான முதன்மை மொழிபெயர்ப்பு; சொல்லின் விரிந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: சிம்சோனின் செயலை בִּשְׂחוֹק எவ்வாறு விவரிப்பது
  choice: சிம்சோன் வேடிக்கை காட்டுவதை
  alternative: சிம்சோன் விளையாடுவதை / சிம்சோனைக் கேலிப்பொருளாகக் கண்டு
  rationale: மூலச்சொல் நிகழ்ச்சியின் சரியான தன்மையைத் தெளிவுபடுத்தாமல் சிரிப்பு, விளையாட்டு, கேளிக்கை ஆகிய பொருட்களுக்கிடையே திறந்த நிலையில் உள்ளது. பிரதான உரை சூழலுக்கேற்ற இயல்பான பொருளைக் கொடுக்கிறது; அவமானப்படுத்தப்பட்டாரா அல்லது தாமே நிகழ்த்தினாரா என்ற நுணுக்கத்தைத் தீர்மானமாக்காமல் அடிக்குறிப்பு மாற்றுப் புரிதல்களைச் சுட்டுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘ஆலயம்’ என்று சூழலை மிகையாகத் தெளிவுபடுத்தாமல் ‘கட்டிடம்’ என்றும், பெலிஸ்திய ஆட்சியாளர்களின் பதவிநிலையைப் பாதுகாக்க ‘அதிபதிகள்’ என்றும் வழங்கப்பட்டது. மூலத்தில் இல்லாத தொடக்க காலச்சுட்டுச் சொல் சேர்க்கப்படவில்லை.
