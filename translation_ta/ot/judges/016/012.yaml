translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரேயத்தின் ஒருமை வடிவான הָאֹרֵב பிரதான உரையில் ஒருமையாகவே வைக்கப்பட்டு, கூட்டுப் பொருள் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்களுக்குப் பின் பிரதான உரையில் இடப்பட்டுள்ளன.
