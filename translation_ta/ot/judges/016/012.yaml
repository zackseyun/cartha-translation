base_translation:
  language: en
  yaml_path: translation/ot/judges/016/012.yaml
  text: Then Delilah took new ropes and bound him with them[a], and said to him, “The Philistines are upon you, Samson!” Now the ambush was sitting in the inner room[c][b], but he snapped them from off his arms like a thread.
translation:
  language: ta
  text: பின்பு தெலீலாள் புதிய கயிறுகளை[a] எடுத்து, அவற்றால் அவனைக் கட்டி, “சிம்சோனே, பெலிஸ்தியர்கள் உன்மேல் வந்துவிட்டார்கள்!” என்றாள். பதுங்கியிருந்தவன்[b] உள் அறையில்[c] உட்கார்ந்திருந்தான். ஆனால் அவன் அவற்றைத் தன் புயங்களிலிருந்து ஒரு நூலைப்போலப் பிய்த்தெறிந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வடங்களை’.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பதுங்கியிருந்தவர்கள்’. எபிரேயத்தில் மறைந்து காத்திருப்பவரைக் குறிக்கும் சொல் ஒருமையில் உள்ளது; அது ஒருவரையோ பதுங்கியிருந்த குழுவையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘உள் அறை’ என்பதை ‘அறைக்கூடம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבֹתִים
  choice: கயிறுகள்
  rationale: தடித்த கட்டுக் கயிறுகளைக் குறிக்கிறது; வசன முடிவிலுள்ள மெல்லிய ‘நூல்’ என்ற ஒப்புமையுடன் தெளிவான முரணையும் உருவாக்குகிறது.
- source_word: חֲדָשִׁים
  choice: புதிய
  rationale: எளிய பெயரடைப் பொருளை நேரடியாகத் தருகிறது; முன்பு பயன்படுத்தப்படாத கட்டுகளை வலியுறுத்துகிறது.
- source_word: וַתַּאַסְרֵהוּ
  choice: அவனைக் கட்டி
  rationale: אסר என்ற வினையின் கட்டுதல் அல்லது பிணைத்தல் என்னும் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: பெலிஸ்தியர்கள் உன்மேல் வந்துவிட்டார்கள்
  rationale: எபிரேய எச்சரிக்கையின் நெருக்கத்தையும் அவசரத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וְהָאֹרֵב
  choice: பதுங்கியிருந்தவன்
  rationale: எபிரேயத்தில் ஒருமை வினையெச்சம் இருப்பதைப் பாதுகாக்கிறது; கூட்டுப் பொருளான ‘பதுங்கிய படை’ என்று அமைதியாகத் தீர்மானிக்கவில்லை.
- source_word: יֹשֵׁב
  choice: உட்கார்ந்திருந்தான்
  rationale: ‘உட்காருதல்/தங்கியிருத்தல்’ என்ற நேரடிக் காட்சியைப் பாதுகாக்கிறது; சூழலில் காத்திருப்பது உட்பொருளாக உள்ளது.
- source_word: בֶּחָדֶר
  choice: உள் அறையில்
  rationale: חֶדֶר என்பதன் மறைவான உட்புற அறை அல்லது அறைக்கூடம் என்ற சாத்தியமான பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: וַיְנַתְּקֵם
  choice: அறுத்தெறிந்தான்
  rationale: வலுக்கட்டாயமாக அறுத்துப் பிரித்தல் என்ற செயலைத் தெளிவாகக் காட்டுகிறது; நூல் என்ற ஒப்புமைக்கும் பொருந்துகிறது.
- source_word: מֵעַל זְרֹעֹתָיו
  choice: தன் கைகளிலிருந்த
  rationale: கட்டுகள் அவனுடைய கரங்களின் மேலிருந்து அகற்றப்பட்டன என்ற இடவியல் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: כַּחוּט
  choice: ஒரு நூலைப்போல
  rationale: חוּט என்பதன் மெல்லிய நூல் என்ற உருவகத்தைத் தக்கவைத்து, கட்டுகளை எளிதாக அறுத்ததைத் தெளிவாக்குகிறது.
