source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ שִׁמְשׁ֖וֹן עַזָּ֑תָ/ה וַ/יַּרְא שָׁם֙ אִשָּׁ֣ה זוֹנָ֔ה וַ/יָּבֹ֖א אֵלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/001.yaml
  text: Samson went to Gaza[a], and there he saw a prostitute, and he went in to her.
translation:
  language: ta
  text: சிம்சோன் காசாவுக்குச் சென்றான். அங்கே ஒரு விலைமகளைக் கண்டு, அவளிடம் சென்றான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: ‘அவளுடன் பாலுறவு கொண்டான்.’ எபிரெயத்தில் சொல்லுக்குச் சொல், ‘அவளிடம் சென்றான்’; இச்சூழலில் இது பாலுறவைக் குறிக்கும் வழக்கமான மறைமுகச் சொல்லாட்சி.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: சென்றான்
  rationale: வழக்கமான எபிரெயக் கதைநடையில் வரும் இயக்க வினை; கூடுதல் நுணுக்கம் சேர்க்காமல் இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: שִׁמְשׁוֹן
  choice: சிம்சோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயரெழுத்தாக்கம்.
- source_word: עַזָּתָה
  choice: காசாவுக்குச்
  rationale: இடப்பெயருடன் சேர்ந்துள்ள திசைகாட்டும் ־ה, அந்த நகரத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் இலக்கு வேற்றுமையால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וַיַּרְא שָׁם
  choice: அங்கே ... கண்டு
  rationale: שָׁם என்பதன் ‘அங்கே’ என்ற இடப்பொருளையும் தொடர்ச்சியான கதைநடையையும் இயல்பான தமிழ்ச் சொல்வரிசையில் காக்கிறது.
- source_word: אִשָּׁה זוֹנָה
  choice: ஒரு விபச்சாரியை
  rationale: זוֹנָה இச்சூழலில் பாலியல் தொழிலில் ஈடுபடும் பெண்ணைக் குறிக்கிறது. ‘விபச்சாரி’ என்பது நவீனத் தமிழில் புரியக்கூடிய, சுருக்கமான சொல்லாகும்.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: அவளிடம் சென்றான்
  rationale: சொல்லுக்கு நெருக்கமான இயக்கப் பொருளையும், சூழலில் உள்ள பாலுறவைக் குறிக்கும் இடக்கரடக்கலையும் வெளிப்படையாகத் தீவிரப்படுத்தாமல் காக்கிறது; மறைபொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: וַיָּבֹא אֵלֶיהָ என்பதன் பாலுறவுப் பொருளை முதன்மை உரையில் முழுமையாக வெளிப்படுத்துவதா, எபிரெய இடக்கரடக்கலைக் காப்பதா
  choice: ‘அவளிடம் சென்றான்’ என்று இடக்கரடக்கலைப் பேணுதல்
  alternative: ‘அவளுடன் பாலுறவுகொண்டான்’ அல்லது ‘அவளுடன் உறவுகொண்டான்’
  rationale: சூழல் பாலுறவை வலுவாக உணர்த்தினாலும், எபிரெயம் வெளிப்படையான பாலியல் வினைச்சொல்லுக்குப் பதிலாக வழக்கமான இடக்கரடக்கலைப் பயன்படுத்துகிறது. முதன்மை உரையில் அதே அளவு மறைமுகத்தன்மையைப் பேணி, அடிக்குறிப்பில் பொருளை விளக்குவது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதாகப் புரியும், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் சுருக்கமும் மறைமுகமான பாலியல் சொல்லாட்சியும் பேணப்பட்டுள்ளன.
