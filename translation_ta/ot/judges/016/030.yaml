base_translation:
  language: en
  yaml_path: translation/ot/judges/016/030.yaml
  text: And Samson said[a], “Let me die with the Philistines.” Then he bent with all his strength, and the house fell on the rulers and on all the people who were in it[c][b]. So the dead whom he killed at his death were more than those whom he had killed during his life.
translation:
  language: ta
  text: சிம்சோன், “பெலிஸ்தியர்களோடு நானும் சாகட்டும்”[a] என்று சொல்லி, தன் முழுப் பலத்தோடும் சாய்ந்தான். அப்போது அந்தக் கட்டிடம்[c] ஆட்சியாளர்கள்மீதும்[b] அதற்குள் இருந்த மக்கள் அனைவர்மீதும் விழுந்தது. இவ்வாறு, அவன் இறந்தபோது அவன் கொன்றவர்கள், அவன் தன் வாழ்நாளில் கொன்றவர்களைவிட அதிகமானவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொற்சார்ந்த மொழிபெயர்ப்பு: “என் உயிர் பெலிஸ்தியர்களோடு சாகட்டும்.” இங்கு “என் உயிர்” என்பது சிம்சோனையே குறிக்கும் எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பெலிஸ்தியத் தலைவர்கள்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “வீடு”; எபிரெயத்தில் இது வீடு அல்லது கட்டிடம் என்பதற்கான பொதுவான சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמוֹת נַפְשִׁי
  choice: நானும் சாகட்டும்
  rationale: நெஃபெஷ் இங்கு தனியான ‘ஆத்துமா’வைக் குறிக்காமல் சிம்சோனையே குறிக்கும் எபிரெய மரபுத்தொடர். ‘சாகட்டும்’ என்பது விருப்பத்தை வெளிப்படுத்தும் வினை வடிவின் வலிமையை இயல்பான தமிழில் காக்கிறது; ‘நானும்’ என்பது உடன் மரிக்கும் கருத்தைத் தெளிவாக்குகிறது.
- source_word: עִם פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களோடு
  rationale: עִם என்பதன் நேரடியான ‘உடன்’ என்ற பொருளையும், எதிரிகளோடு சேர்ந்து இறப்பதற்கான சிம்சோனின் மனவுறுதியையும் தருகிறது.
- source_word: וַיֵּט בְּכֹחַ
  choice: தன் முழுப் பலத்தோடும் சாய்ந்து தள்ளினான்
  rationale: נטה என்பதன் சாய்தல் அல்லது உடலை வளைத்தல் என்ற பொருளையும், தூண்கள்மீது செலுத்திய வலிமையையும் சூழலுக்கேற்ற இயல்பான தமிழில் இணைக்கிறது.
- source_word: הַבַּיִת
  choice: அந்தக் கட்டிடம்
  rationale: בַּיִת என்பது பொதுவாக வீடு அல்லது கட்டிடம். இங்கு மக்கள் கூடியிருந்த அமைப்பைக் குறிக்கும் ‘கட்டிடம்’ தெளிவானது; ‘கோவில்’ என்று மொழிபெயர்ப்பது மூலச்சொல்லைவிட அதிக விளக்கத்தைச் சேர்க்கும்.
- source_word: הַסְּרָנִים
  choice: ஆட்சியாளர்கள்
  rationale: இந்தச் சொல் பெலிஸ்திய அரசியல் தலைவர்களைக் குறிக்கிறது. ‘ஆட்சியாளர்கள்’ என்பது அவர்களுடைய பதவிநிலையை நவீன தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: כָּל הָעָם אֲשֶׁר בּוֹ
  choice: அதற்குள் இருந்த மக்கள் அனைவரும்
  rationale: כָּל என்ற முழுமையையும், கட்டிடத்துக்குள் இருந்தவர்களைக் குறிக்கும் உறவுத்தொடரையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר הֵמִית בְּמוֹתוֹ
  choice: தான் இறந்தபோது கொன்றவர்கள்
  rationale: சிம்சோனின் மரணமும் அவனால் உண்டான மற்றவர்களின் மரணமும் ஒரே நிகழ்வில் நடந்த காலத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: רַבִּים מֵאֲשֶׁר הֵמִית בְּחַיָּיו
  choice: அவன் தன் வாழ்நாளில் கொன்றவர்களைவிட ... அதிகமாயிருந்தார்கள்
  rationale: மரணத்தின்போது கொல்லப்பட்டோரின் எண்ணிக்கை வாழ்நாளில் கொல்லப்பட்டோரின் எண்ணிக்கையை மிஞ்சியது என்ற ஒப்பீட்டை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: சிம்சோனின் இறுதி கூற்றில் נֶפֶשׁ என்பதைக் கோட்பாட்டு ‘ஆத்துமா’வாகப் புரிந்துகொள்ளாமல் மொழிபெயர்த்தல்
  choice: பெலிஸ்தியர்களோடு நானும் சாகட்டும்
  alternative: என் உயிர் பெலிஸ்தியர்களோடு சாகட்டும்
  rationale: נֶפֶשׁ இங்கு முழு மனிதராகிய சிம்சோனையே குறிக்கும் மரபுத்தொடர். ‘என் ஆத்துமா’ என்பது மூலவசனம் முன்வைக்காத உடல்–ஆத்துமா பிரிவைப் படிப்பவர் மனதில் உருவாக்கக்கூடும். முதன்மை மொழிபெயர்ப்பு அவனுடைய சொந்த மரணத்திற்கான விருப்பத்தைப் பாதுகாக்கிறது; அடிக்குறிப்பு சொற்சார்ந்த வடிவைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘கட்டிடம்’ சூழலைத் தெளிவாக்குகிறது; ‘கோவில்’ என்ற விளக்கச் சேர்க்கை தவிர்க்கப்பட்டது. முதன்மை உரையில் அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களின் உடனேயே வைக்கப்பட்டுள்ளன.
