base_translation:
  language: en
  yaml_path: translation/ot/judges/016/007.yaml
  text: And Samson said to her[a], “If they bind me with seven fresh bowstrings that have not dried, then I will become weak and be like one of the men.”
translation:
  language: ta
  text: சிம்சோன் அவளிடம், “இன்னும் உலராத ஈரமான ஏழு வில் நாண்களால் என்னைக் கட்டினால், நான் பலவீனமடைந்து மற்ற மனிதர்களைப் போல ஆகிவிடுவேன்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு சாதாரண மனிதனைப்போல்.”
    reason: כְּאַחַד הָאָדָם என்ற எபிரெய மரபுத்தொடரின் இயல்பான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַיֹּאמֶר ... שִׁמְשׁוֹן אֵלֶיהָ
  choice: சிம்சோன் அவளிடம் ... என்றான்
  rationale: எபிரெயக் கதைநடையின் அடுத்த நிகழ்வை இயல்பான நவீனத் தமிழ்ச் சொல்லமைப்பில் தருகிறது; தேவையற்ற கால அல்லது காரண வலியுறுத்தலைச் சேர்க்கவில்லை.
- source_word: יַאַסְרֻנִי
  choice: என்னைக் கட்டினால்
  rationale: மூன்றாம் நபர் பன்மை இங்கு குறிப்பிடப்படாத செய்பவர்களைக் குறிக்கிறது. நிபந்தனை வாக்கிய அமைப்பில் செய்பவரை வெளிப்படையாகச் சேர்க்காமல் இருப்பது தமிழில் இயல்பாகவும் மூலத்தின் வரையறுக்கப்படாத தன்மையைப் பாதுகாப்பதாகவும் உள்ளது.
- source_word: בְּשִׁבְעָה יְתָרִים
  choice: ஏழு வில்நாண்களால்
  rationale: בְּ கருவிப் பொருளைக் குறிக்கிறது; இச்சூழலில் יְתָרִים பொதுவான கயிறுகளைவிட வில்நாண்களைக் குறிப்பதாகப் புரிகிறது.
- source_word: לַחִים אֲשֶׁר לֹא חֹרָבוּ
  choice: இன்னும் உலராத ஈரமான
  rationale: לַחִים என்பதன் ஈரமான அல்லது புதிதான நிலையும், அவை உலரவில்லை என்ற தொடர்ந்த விளக்கமும் தமிழில் பாதுகாக்கப்படுகின்றன.
- source_word: וְחָלִיתִי
  choice: நான் பலவீனமடைந்து
  rationale: חלה இங்கு நோயுறுதலைவிட வலிமை குறைவதைச் சுட்டுகிறது; மாற்றத்தின் விளைவையும் ‘பலவீனமடைந்து’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כְּאַחַד הָאָדָם
  choice: மற்ற மனிதர்களில் ஒருவனைப்போல்
  rationale: ‘மனிதர்களில் ஒருவனைப்போல்’ என்ற எபிரெய ஒப்பீட்டை நெருக்கமாகப் பாதுகாத்து, சிம்சோனின் அசாதாரண வலிமைக்கு மாறான சாதாரண மனித நிலையைச் சூழல் உணர்த்த அனுமதிக்கிறது.
theological_decisions:
- issue: כְּאַחַד הָאָדָם என்ற ஒப்பீட்டில் אָדָם என்பதன் பொருள்
  choice: மற்ற மனிதர்களில் ஒருவனைப்போல்
  alternative: ஒரு சாதாரண மனிதனைப்போல்
  rationale: மூலத்தின் ஒப்பீட்டு வடிவத்தையும் ஆண்பால் சூழலையும் முதன்மை உரை பாதுகாக்கிறது; அதன் சூழல்சார், இயல்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது. சிம்சோனின் வலிமை குறித்த கருத்தைத் தாண்டி எந்தக் கோட்பாட்டு விளக்கமும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிதில் புரியக்கூடியதாயும் கண்ணியமான கதைநடையுடனும் அமைக்கப்பட்டுள்ளது. நேரடி உரையில் இயல்பான தமிழ்ச் சொல் வரிசை பயன்படுத்தப்பட்டு, மூலத்தின் நிபந்தனை மற்றும் விளைவு தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
