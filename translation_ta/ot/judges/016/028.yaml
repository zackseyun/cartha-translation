base_translation:
  language: en
  yaml_path: translation/ot/judges/016/028.yaml
  text: Then Samson called to Yahweh and said[a], “Lord GOD, please remember me, and please strengthen me just this once, O God, so that I may take vengeance on the Philistines for my two eyes with one act of vengeance.”
translation:
  language: ta
  text: அப்போது சிம்சோன் யாவேயை நோக்கிக் கூப்பிட்டு, “ஆண்டவராகிய யாவே, தயவுசெய்து என்னை நினைவுகூரும்; தேவனே, இந்த ஒரே முறை மட்டும் தயவுசெய்து எனக்கு வலிமை தாரும். என் இரண்டு கண்களுக்காக பெலிஸ்தியர்மேல் ஒரே பழிவாங்கும் செயலால் நான் பழிதீர்த்துக்கொள்ளட்டும்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “என் இரண்டு கண்களுக்காக.” பெலிஸ்தியர் சிம்சோனின் கண்களைக் குருடாக்கியதைக் இது குறிக்கிறது.
    reason: மூலத்தின் சுருக்கமான சொற்றொடரையும் அதன் சூழல்சார் குறிப்பையும் விளக்குகிறது; ‘ஒரே பழிவாங்கும் செயல்’ என்பது எபிரெய நெகாம் அஹத் என்ற இணை அமைப்பை மொழிபெயர்க்கிறது.
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל־יְהוָה
  choice: யாவேயை நோக்கிக் கூப்பிட்டு
  rationale: קרא אל என்பது ஒருவரை நோக்கி அழைப்பதையோ உதவி வேண்டிக் கூப்பிடுவதையோ குறிக்கிறது. இங்கு ஜெபத்தின் தீவிரத்தைக் காக்கும் இயல்பான தமிழ் நடை பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயராகிய நான்கு எழுத்துப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: אֲדֹנָי יֱהֹוִה
  choice: ஆண்டவராகிய யாவே
  rationale: אֲדֹנָי என்ற பட்டத்தையும் יהוה என்ற தனிப்பெயரையும் வேறுபடுத்திக் காட்டி, தமிழில் இயல்பான நேரடி அழைப்பாக அமைகிறது.
- source_word: זָכְרֵנִי נָא
  choice: தயவுசெய்து என்னை நினைவுகூரும்
  rationale: נָא வெளிப்படுத்தும் வேண்டுதலை ‘தயவுசெய்து’ என்பதும், זכר என்பதன் செயற்பாட்டு நினைவு நுணுக்கத்தை ‘நினைவுகூரும்’ என்பதும் காக்கின்றன.
- source_word: וְחַזְּקֵנִי נָא
  choice: தயவுசெய்து எனக்கு வலிமை தாரும்
  rationale: Piel வடிவம் சிம்சோனுக்கு வலிமையை அளிக்கும்படி கேட்பதைக் குறிக்கிறது; இந்தத் தமிழ் சொற்றொடர் நேரடியாகவும் இயல்பாகவும் உள்ளது.
- source_word: אַךְ הַפַּעַם הַזֶּה
  choice: இந்த ஒரே முறை மட்டும்
  rationale: אַךְ தரும் வரையறையையும் தற்போதைய ஒரே சந்தர்ப்பத்திற்கான வேண்டுதலையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הָאֱלֹהִים
  choice: தேவனே
  rationale: இது நேரடி விளி என்பதால் தமிழ் விளிவேற்றுமை பயன்படுத்தப்பட்டது.
- source_word: וְאִנָּקְמָה
  choice: நான் பழிதீர்த்துக்கொள்ளட்டும்
  rationale: Cohortative வடிவத்தின் விருப்பம் அல்லது வேண்டுகோள் நுணுக்கத்தை ‘-ட்டும்’ அமைப்பு காக்கிறது.
- source_word: נְקַם אַחַת מִשְּׁתֵי עֵינַי
  choice: என் இரண்டு கண்களில் ஒன்றுக்காகவாவது ... பழிதீர்த்துக்கொள்ளட்டும்
  rationale: אַחַת feminine வடிவம் ‘கண்’ என்பதோடு இலக்கணரீதியாக இணைந்து ‘இரண்டு கண்களில் ஒன்று’ என்று வாசிக்கப்படலாம். எபிரெயச் சொற்றொடரின் மற்றொரு சாத்தியமான பிரிப்பான ‘ஒரே பழிவாங்கும் செயலால் இரண்டு கண்களுக்காக’ என்பதும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִפְּלִשְׁתִּים
  choice: பெலிஸ்தியரிடம்
  rationale: נקם உடன் வரும் מִן பழிவாங்குதல் யாரை நோக்கியது என்பதைக் குறிக்கிறது; தமிழில் ‘பெலிஸ்தியரிடம் பழிதீர்த்துக்கொள்ள’ என்பது இயல்பான நடை.
theological_decisions:
- issue: சிம்சோனின் ஜெபத்தில் வரும் தெய்வீகப் பெயரும் பட்டமும்
  choice: יְהוָה என்பதை ‘யாவே’ என்றும் אֲדֹנָי יֱהֹוִה என்பதை ‘ஆண்டவராகிய யாவே’ என்றும் வேறுபடுத்துதல்
  alternative: முதலாவதையும் இரண்டாவதையும் முறையே ‘கர்த்தர்’, ‘கர்த்தராகிய தேவன்’ என்று பொதுப் பட்டங்களால் மொழிபெயர்த்தல்
  rationale: மூலத்தில் தனிப்பெயரும் பட்டமும் திட்டமிட்டு வேறுபடுத்தப்பட்டுள்ளன. தமிழ் மொழிபெயர்ப்பு அந்த அடுக்கை அழிக்காமல், வாசிக்க இயல்பாகக் காக்கிறது.
- issue: சிம்சோன் கேட்கும் பழிவாங்குதலின் அளவு
  choice: ‘என் இரண்டு கண்களில் ஒன்றுக்காகவாவது’ என்ற இலக்கணரீதியான வாசிப்பை முதன்மை உரையில் வைத்தல்
  alternative: ‘ஒரே பழிவாங்கும் செயலால் என் இரண்டு கண்களுக்காக’ என்று வாசித்தல்
  rationale: எபிரெயத் தொடரில் אַחַת என்பது ‘ஒன்று’ என்ற பொருளில் עֵינַי உடன் இணைக்கப்படலாம்; அதே நேரத்தில் அது பழிவாங்குதலை ஒரே செயலாக வரையறுப்பதாகவும் புரிந்துகொள்ளப்பட்டுள்ளது. எந்த வாசிப்பையும் மறைக்காமல் மாற்றுவாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
