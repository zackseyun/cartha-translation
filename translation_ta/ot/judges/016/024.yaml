  text: וַ/יִּרְא֤וּ אֹת/וֹ֙ הָ/עָ֔ם וַֽ/יְהַלְל֖וּ אֶת אֱלֹהֵי/הֶ֑ם כִּ֣י אָמְר֗וּ נָתַ֨ן אֱלֹהֵ֤י/נוּ בְ/יָדֵ֨/נוּ֙ אֶת א֣וֹיְבֵ֔/נוּ וְ/אֵת֙ מַחֲרִ֣יב אַרְצֵ֔/נוּ וַ/אֲשֶׁ֥ר הִרְבָּ֖ה אֶת חֲלָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/024.yaml
  text: When the people saw him, they praised their god, for they said, “Our god has given into our hand our enemy, the devastator of our land, the one who multiplied our slain.”
translation:
  language: ta
  text: மக்கள் அவனைப் பார்த்தபோது, தங்கள் தெய்வத்தைப் புகழ்ந்தார்கள். ஏனெனில், “நம் எதிரியையும், நம் நாட்டைப் பாழாக்குபவனையும், நம்முடைய கொல்லப்பட்டவர்களின் எண்ணிக்கையைப் பெருக்கியவனையும் நம் தெய்வம் நம் கையில் ஒப்படைத்தது” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהַלְלוּ
  choice: புகழ்ந்தார்கள்
  rationale: பீலேல் வடிவத்தின் தீவிரமான ‘புகழ்தல்’ என்ற இயல்பான பொருளை நேரடியாகத் தருகிறது.
- source_word: נָתַן ... בְיָדֵנוּ
  choice: நம் கையில் ஒப்படைத்தது
  rationale: ‘கையில் கொடுத்தது’ என்ற எபிரெய மொழிவழக்கின் வெற்றி மற்றும் அதிகாரத்திற்குள் ஒப்படைத்தல் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: מַחֲרִיב אַרְצֵנוּ
  choice: நம் நாட்டைப் பாழாக்கியவன்
  rationale: சிம்சோனைத் தங்கள் நாட்டை அழித்தவன் எனப் பெலிஸ்தியர் வருணிப்பதைப் பாதுகாக்கிறது.
- source_word: וַאֲשֶׁר הִרְבָּה אֶת חֲלָלֵינוּ
  choice: நம்மில் கொல்லப்பட்டவர்களைப் பெருகச் செய்தவன்
  rationale: ‘எங்கள் கொல்லப்பட்டோரைப் பெருக்கினவன்’ என்ற மூலத்தின் கடுமையான, காரணவியல் சொல்லாட்சியைச் சீராக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: பெலிஸ்தியரின் தெய்வத்தைச் சுட்டும் אֱלֹהִים
  choice: தெய்வம்
  alternative: கடவுள்
  rationale: இது உரையாசிரியரின் அங்கீகாரம் அல்ல; பெலிஸ்தியர் தங்கள் தெய்வத்தைப் பற்றிக் கூறும் மொழி. ‘தெய்வம்’ அந்தக் கதைநிலை வேறுபாட்டை இயல்பாகக் காட்டுகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் dignified நடையில், மூலத்தின் இணை வருணனைகளும் பெலிஸ்தியரின் பார்வையும் பாதுகாக்கப்பட்டுள்ளன.
