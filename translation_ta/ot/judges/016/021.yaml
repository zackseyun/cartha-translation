base_translation:
  language: en
  yaml_path: translation/ot/judges/016/021.yaml
  text: Then the Philistines seized him[a], gouged out his eyes, brought him down to Gaza, bound him with bronze shackles[b], and he was grinding in the prison house.
translation:
  language: ta
  text: அப்போது பெலிஸ்தியர்கள் அவனைப் பிடித்து, அவனுடைய கண்களைப் பிடுங்கி[a], அவனைக் காசாவுக்குக் கொண்டுபோய், வெண்கலக் கட்டுகளால் அவனைக் கட்டினார்கள். அவன் சிறைச்சாலையில் அரைத்துக்கொண்டிருந்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய கண்களைக் குருடாக்கி.” இங்குள்ள எபிரெய வினைச்சொல் கண்களை உடல்ரீதியாகச் சிதைப்பதைக் குறிக்கிறது; “பிடுங்கி” என்பது அந்த வன்முறையைத் தெளிவாக வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சிறையில்.” எபிரெயத்தில், “கைதிகளின் வீட்டில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאחֲזוּהוּ
  choice: அவனைப் பிடித்து
  rationale: אחז என்பது பிடித்தல் அல்லது பற்றிக்கொள்ளுதல் என்பதைக் குறிக்கிறது. பகைமையான சூழலில் ‘பிடித்து’ என்பது இயல்பாகவும் வலிமையாகவும் உள்ளது.
- source_word: פְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: இந்த மக்கள் இனத்திற்கான வழக்கமான நவீனத் தமிழ் பெயர்.
- source_word: וַיְנַקְּרוּ אֶת־עֵינָיו
  choice: அவனுடைய கண்களைப் பிடுங்கி
  rationale: נקר இங்கு கண்களை உடல்ரீதியாகச் சிதைக்கும் வன்முறையான செயலைக் குறிக்கிறது; ‘பிடுங்கி’ அதன் தெளிவான, கடுமையான பொருளைப் பாதுகாக்கிறது.
- source_word: וַיּוֹרִידוּ אֹתוֹ עַזָּתָה
  choice: அவனைக் காசாவுக்குக் கொண்டுபோய்
  rationale: ஹிப்ரு causative வடிவம் ‘கீழே கொண்டுபோதல்’ என்ற திசைநுணுக்கம் கொண்டது. தமிழில் நிலவியல் திசையைச் செயற்கையாகச் சேர்க்காமல் ‘கொண்டுபோய்’ என்பது இயல்பாக உள்ளது; இடப்பெயரிலுள்ள directional he ‘காசாவுக்கு’ என வெளிப்படுகிறது.
- source_word: וַיַּאַסְרוּהוּ בַּנְחֻשְׁתַּיִם
  choice: வெண்கல விலங்குகளால் அவனைக் கட்டினார்கள்
  rationale: אסר என்பது கட்டுதல்; נְחֻשְׁתַּיִם உலோகக் கட்டுப்பாடுகளைக் குறிக்கிறது. ‘வெண்கல விலங்குகள்’ கை/கால் பூட்டுகளைக் குறிக்கும் வழக்கமான, துல்லியமான தமிழ் சொற்றொடர்.
- source_word: וַיְהִי טוֹחֵן
  choice: அவன் ... மாவரைத்துக்கொண்டிருந்தான்
  rationale: இக்கட்டமைப்பு தொடர்ந்த உழைப்பைச் சுட்டுகிறது. மூலத்தில் பொருள் வெளிப்படையாக இல்லாவிட்டாலும், தமிழ் மொழியில் ‘அரைத்தான்’ மட்டும் முழுமையற்றதாக ஒலிப்பதால் சூழலுக்கேற்ற ‘மாவரைத்தல்’ பயன்படுத்தப்பட்டது.
- source_word: בְּבֵית הָאֲסִירִים
  choice: சிறைச்சாலையில்
  rationale: சொல்லுக்கு சொல் ‘கைதிகளின் வீட்டில்’; நவீனத் தமிழில் அதன் இயல்பான பொருள் ‘சிறைச்சாலையில்’.
