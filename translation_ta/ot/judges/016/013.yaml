  rationale: The revision removes an unwarranted completive implication, uses more idiomatic wording for the seven locks/braids, and sharpens the instrumental-passive force of Delilah’s question. It preserves the Hebrew text’s abrupt, incomplete conditional clause and retains the lexical uncertainty of מַסָּכֶת in the footnote.
