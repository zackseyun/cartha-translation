base_translation:
  language: en
  yaml_path: translation/ot/judges/016/013.yaml
  text: Then Delilah said to Samson[a], “Until now you have mocked me and told me lies. Tell me what you may be bound with.” And he said to her, “If you weave the seven locks of my head with the web.”
translation:
  language: ta
  text: அப்போது தெலீலாள் சிம்சோனிடம், “இதுவரை நீ என்னைப் பரிகாசம் செய்து, என்னிடம் பொய்களைச் சொல்லியிருக்கிறாய். உன்னை எதனால் கட்டலாம் என்று எனக்குச் சொல்” என்றாள். அதற்கு அவன், “என் தலைமுடியின் ஏழு சடைகளையும் நெசவுத் துணியோடு[a] நெய்தால்...” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தறியுடன்”; அல்லது, “நெய்யப்பட்ட துணிக்குள்.” இங்குள்ள எபிரெயச் சொல் நெசவு தொடர்பான சிறப்புச் சொல் என்பதால், அது குறிக்கும் பொருள் துல்லியமாக உறுதியல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתַ֤לְתָּ בִּי
  choice: நீ என்னைப் பரிகாசம் செய்து
  rationale: இச்சூழலில் ஒருவரை ஏமாற்றும் விதத்தில் விளையாட்டாக நடத்துதல் அல்லது கேலிசெய்தல் என்ற பொருள் உள்ளது. அடுத்த சொற்றொடரே பொய்களைத் தெளிவாகக் குறிப்பிடுவதால், ‘பரிகாசம் செய்து’ என்பது பொருள் மீளுரையைத் தவிர்க்கிறது.
- source_word: כְּזָבִים
  choice: பொய்களை
  rationale: பல பொய்யான கூற்றுகளைக் குறிக்கும் நேரடியான, இயல்பான நவீனத் தமிழ் சொல்.
- source_word: הַגִּידָה לִּי
  choice: எனக்குச் சொல்
  rationale: கட்டளை வடிவிலுள்ள ‘சொல்/அறிவி’ என்ற அடிப்படைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בַּמֶּה תֵּאָסֵר
  choice: உன்னை எதனால் கட்ட முடியும்
  rationale: எபிரெய மொழியிலுள்ள கருவிப் பொருளான ‘எதனால்’ என்பதையும், செயப்பாட்டு வடிவிலுள்ள சாத்திய நுணுக்கத்தையும் பாதுகாக்கிறது.
- source_word: תַּאַרְגִי
  choice: நெய்துவிட்டால்
  rationale: אָרַג என்பது நெய்தலைக் குறிக்கும் சாதாரண வினை. நிபந்தனை வாக்கிய அமைப்புக்கேற்ற இயல்பான தமிழ் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשִׁי
  choice: என் தலையிலுள்ள ஏழு சடைப்பிரிவுகளையும்
  rationale: מַחְלְפוֹת என்பது தலைமுடியின் பிரிவுகள், சடைகள் அல்லது பின்னல்களைக் குறிக்கலாம். ‘சடைப்பிரிவுகள்’ என்பது தலைமுடியைக் குறிக்கும் சூழலைத் தெளிவாக்கியபடியே குறிப்பிட்ட அலங்கார வடிவத்தை மிகையாக நிர்ணயிப்பதைத் தவிர்க்கிறது.
- source_word: עִם הַמַּסָּכֶת
  choice: நெசவுத் துணியோடு
  rationale: מַסָּכֶת என்பது இங்கு நெசவு சார்ந்த சிறப்புச் சொல்; நெய்யப்படும் துணி, நெசவமைப்பு அல்லது தறி என்பவற்றில் எதைக் குறிக்கிறது என்பது உறுதியல்ல. முதன்மை உரை நெசவுத் துணி என்ற சாத்தியத்தைத் தருகிறது; மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
