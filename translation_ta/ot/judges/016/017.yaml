  source_fidelity: 'The verse''s sequence and conditional consequences are accurately represented: Samson discloses what is in his heart, states that no razor has touched his head, identifies his lifelong status from his mother''s womb, and explains the loss of strength and becoming like other men. The technical designation נְזִיר (Nazirite) should be distinguished in Tamil from terms associated with Nazareth/Nazarene.'
