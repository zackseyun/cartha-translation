  text: וַ/יַּגֶּד לָ֣/הּ אֶת כָּל לִבּ֗/וֹ וַ/יֹּ֤אמֶר לָ/הּ֙ מוֹרָה֙ לֹֽא עָלָ֣ה עַל רֹאשִׁ֔/י כִּֽי נְזִ֧יר אֱלֹהִ֛ים אֲנִ֖י מִ/בֶּ֣טֶן אִמִּ֑/י אִם גֻּלַּ֨חְתִּי֙ וְ/סָ֣ר מִמֶּ֣/נִּי כֹחִ֔/י וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/כָל הָ/אָדָֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/017.yaml
  text: So he told her all his heart and said to her[a], “A razor has never come upon my head, for I have been a Nazirite of God from my mother’s womb. If I am shaved, then my strength will leave me[c][b], and I will become weak and be like every other man.”
translation:
  language: ta
  text: 'அவன் தன் உள்ளத்தில் இருந்த அனைத்தையும் அவளிடம் தெரிவித்து, அவளிடம் சொன்னான்: “சவரக்கத்தி என் தலையின்மேல் பட்டதே இல்லை. ஏனெனில், நான் என் தாயின் கருவிலிருந்தே கடவுளுக்கான நாசிரேயன்[a]. எனக்குச் சவரம் செய்யப்பட்டால், என் வலிமை என்னைவிட்டு நீங்கிவிடும்; நான் பலவீனமடைந்து மற்ற எல்லா மனிதர்களையும் போல் ஆகிவிடுவேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நாசிரேயன்” என்பது கடவுளுக்கென்று சிறப்பாக அர்ப்பணிக்கப்பட்ட ஒருவரைக் குறிக்கும் தொழில்நுட்பப் பெயர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּגֶּד ... אֶת כָּל לִבּוֹ
  choice: தன் உள்ளத்தில் இருந்த அனைத்தையும் அவளிடம் தெரிவித்தான்
  rationale: ‘அவனுடைய முழு இருதயத்தையும் தெரிவித்தான்’ என்ற சொற்சொல் அமைப்பு தமிழில் இயல்பற்றது. எதையும் மறைக்காமல் மனதிலிருந்த அனைத்தையும் வெளிப்படுத்தியதாகிய எபிரேய மரபுத்தொடரின் பொருளை இவ்வாறு இயல்பாகத் தருகிறது.
- source_word: מוֹרָה לֹא עָלָה עַל רֹאשִׁי
  choice: சவரக்கத்தி என் தலையின்மேல் பட்டதே இல்லை
  rationale: מוֹרָה என்பது சவரக்கத்தி. ‘தலையின்மேல் ஏறவில்லை’ என்ற நேரடி வடிவுக்கு மாற்றாக, கருவி தலையைத் தொடாததை நவீனத் தமிழில் தெளிவாகவும் எபிரேய உருவகத்திற்கு நெருக்கமாகவும் தெரிவிக்கிறது.
- source_word: נְזִיר אֱלֹהִים
  choice: கடவுளுக்கான நசரேயன்
  rationale: நசரேய விரதம் அல்லது அர்ப்பணிப்பு என்ற தொழில்நுட்பப் பெயரையும் கடவுளோடுள்ள உறவையும் காக்கிறது; பொதுவான ‘அர்ப்பணிக்கப்பட்டவன்’ என்று பொருளை மட்டுப்படுத்தவில்லை.
- source_word: מִבֶּטֶן אִמִּי
  choice: என் தாயின் கருவிலிருந்தே
  rationale: பிறப்புக்கு முன்பிருந்தே அமைந்த அர்ப்பணிப்பைக் குறிக்கும் எபிரேய மரபுத்தொடருக்கு இயல்பான தமிழ் இணை.
- source_word: אִם גֻּלַּחְתִּי
  choice: எனக்குச் சவரம் செய்யப்பட்டால்
  rationale: எபிரேய வினையின் செயப்பாட்டு வடிவைக் காக்கிறது; சிம்சோன் தானே சவரம் செய்வதாகப் பொருள்படாமல் தடுக்கிறது.
- source_word: וְסָר מִמֶּנִּי כֹחִי
  choice: என் வலிமை என்னைவிட்டு நீங்கிவிடும்
  rationale: வலிமை அவனைவிட்டு அகலும் என்ற எபிரேயச் சொல்லாட்சியையும் நிபந்தனைத் தொடரின் எதிர்கால விளைவையும் காக்கிறது.
- source_word: וְחָלִיתִי
  choice: நான் பலவீனமடைந்து
  rationale: இச்சூழலில் நோயுறுதலைவிட உடல் வலிமை இழப்பதே நோக்கம்; நிலைமாற்றத்தையும் வடிவம் தெரிவிக்கிறது.
- source_word: כְּכָל הָאָדָם
  choice: மற்ற எல்லா மனிதர்களையும் போல்
  rationale: சிம்சோனின் அசாதாரண வலிமைக்கும் சாதாரண மனிதர்களுக்கும் இடையிலான வேறுபாட்டைத் தெளிவாக்குகிறது. ஆண் ஒருவரைக் குறிக்கும் சூழல் இருந்தாலும், தமிழ் ‘மனிதர்கள்’ இங்கு இயல்பாக சாதாரண மக்களைக் குறிக்கிறது.
theological_decisions:
- issue: நְזִיר אֱלֹהִים என்ற அர்ப்பணிப்புச் சொல்லை மொழிபெயர்த்தல்
  choice: கடவுளுக்கான நசரேயன்
  alternative: கடவுளுக்கு அர்ப்பணிக்கப்பட்டவன்
  rationale: தொழில்நுட்பப் பெயரை ஒலிபெயர்ப்பதன் மூலம் எண்ணாகமம் 6 மற்றும் சிம்சோனின் அழைப்புக் கதையோடுள்ள தொடர்பு பாதுகாக்கப்படுகிறது; அடிக்குறிப்பு அதன் பொருளை விளக்குகிறது.
- issue: כְּכָל הָאָדָם என்பதன் எல்லை
  choice: மற்ற எல்லா மனிதர்களையும் போல்
  alternative: மற்ற எந்த மனிதனைப் போலவும்
  rationale: הָאָדָם ஒருமை வடிவில் இருந்தாலும் இங்கு மனிதர்களின் பொதுவகையைச் சுட்டுகிறது. தமிழ் பன்மை அமைப்பு அந்த பொதுமைப்படுத்தலை இயல்பாகத் தருகிறது; சிம்சோன் மற்றவர்களைப் போன்ற சாதாரண வலிமையுள்ளவனாவான் என்ற எதிர்மறை ஒப்புமையைச் சேர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘நசரேயன்’ என்ற வேதாகமத் தொழில்நுட்பச் சொல் மட்டும் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
