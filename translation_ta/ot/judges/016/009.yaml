  to: பதுங்கியிருப்பவன் அவளுக்காக உள் அறையில் காத்திருந்தான்.[a] அவள் அவனை நோக்கி, “சிம்சோனே, பெலிஸ்தியர்கள் உன்மேல் வந்துவிட்டார்கள்!” என்றாள். ஆனால் நெருப்பை முகரும்போது சணல் நார் அறுந்துபோவதுபோல் அவன் அந்த நாண்களைத் துண்டித்தான்.[b] அவனுடைய வலிமை அறியப்படவில்லை.
  rationale: வெட்டுதலைக் குறிக்கும் சொல்லை நீக்கி, கயிறுகளை முறித்தலைக் குறிக்கும் “துண்டித்தான்” பயன்படுத்தப்பட்டது. ‘வலிமையின் காரணம்’ என்ற விளக்கக் கூட்டல் அகற்றப்பட்டு, மூலத்தின் செயல்பாட்டு மறைநிலை நேரடியாக மொழிபெயர்க்கப்பட்டது. ஒருமை எபிரெயப் பங்கேற்பு வடிவத்துக்கு ஏற்ப “பதுங்கியிருப்பவன்” எனத் திருத்தப்பட்டது; லָהּ-இன் உறவு நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
