translation:
  language: ta
  text: பதுங்கியிருப்பவன் அவளுக்காக உள் அறையில் காத்திருந்தான்.[a] அவள் அவனை நோக்கி, “சிம்சோனே, பெலிஸ்தியர்கள் உன்மேல் வந்துவிட்டார்கள்!” என்றாள். ஆனால் நெருப்பை முகரும்போது சணல் நார் அறுந்துபோவதுபோல் அவன் அந்த நாண்களைத் துண்டித்தான்.[b] அவனுடைய வலிமை அறியப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவளுக்காக” என்பது அவளுக்கு உதவுவதற்காக அல்லது அவளுடைய ஏற்பாட்டின்படி என்ற பொருளையும் தரலாம்.
    reason: לָהּ என்ற எபிரெயத் தொடர்புச்சொல் நோக்கம், நன்மை, அல்லது ஏற்பாட்டுச் சார்பைக் குறிக்கக்கூடும்.
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “நெருப்பை முகரும்போது சணல் நார் அறுந்துபோவதுபோல்.” இது நெருப்பின் தாக்கம் அணுகும்போது நார் எளிதில் அறுந்துபோவதைச் சுட்டும் உருவகம்.
    reason: בַּהֲרִיחוֹ אֵשׁ என்ற மனிதராக்கப்பட்ட எபிரெய உருவகத்தையும் அதன் இயல்பான பொருளையும் காக்கிறது.
lexical_decisions:
- source_word: הָאֹרֵב
  choice: பதுங்கியிருந்தவர்கள்
  rationale: எபிரெயச் சொல் ஒருமை வடிவில் இருந்தாலும், தாக்குவதற்காகப் பதுங்கியிருக்கும் குழுவைக் கூட்டுப்பொருளில் குறிக்கிறது; இயல்பான தமிழில் பன்மை பயன்படுத்தப்பட்டது.
- source_word: יְתָרִים
  choice: நாண்கள்
  rationale: இச்சொல் கயிறுகள் அல்லது வில் நாண்களைக் குறிக்கலாம்; முந்தைய வசனச் சூழலைப் பொருத்தும் வகையிலும் தேவையற்ற விளக்கத்தைச் சேர்க்காமலும் ‘நாண்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: פְּתִיל הַנְּעֹרֶת
  choice: சணல் நார்
  rationale: முறுக்கப்படாத அல்லது எளிதில் எரியக்கூடிய சணல் நாரைக் குறிக்கும் உருவகத்தைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: בַּהֲרִיחוֹ אֵשׁ
  choice: நெருப்பின் வெப்பம் பட்ட
  rationale: சொல்லுக்குச் சொல் ‘நெருப்பை முகர்ந்ததும்’ என்ற எபிரெய மொழிநடையின் பொருள் நெருப்பை நெருங்கியவுடன் அல்லது அதன் தாக்கம் பட்டவுடன் என்பதாகும்; தமிழில் இயல்பாகப் பொருள் தரப்பட்டுள்ளது.
- source_word: וְלֹא נוֹדַע כֹּחוֹ
  choice: அவனுடைய வலிமையின் காரணம் கண்டறியப்படவில்லை
  rationale: சூழலில் அவனது வலிமை இருப்பதே அறியப்படாதது அல்ல; அதன் மூலம் என்ன என்பது வெளிப்படவில்லை. எபிரெயச் செயல்பாட்டு மறைநிலையையும் ‘கண்டறியப்படவில்லை’ காக்கிறது.
