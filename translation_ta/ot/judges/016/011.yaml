source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אִם אָס֤וֹר יַאַסְר֨וּ/נִי֙ בַּ/עֲבֹתִ֣ים חֲדָשִׁ֔ים אֲשֶׁ֛ר לֹֽא נַעֲשָׂ֥ה בָ/הֶ֖ם מְלָאכָ֑ה וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/אַחַ֥ד הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/011.yaml
  text: He said to her[a], “If they bind me with new ropes that have never been used for work[b], then I will become weak and be like one of the men.”
translation:
  language: ta
  text: அவன் அவளிடம், “இதுவரை எந்த வேலைக்கும் பயன்படுத்தப்படாத புதிய கயிறுகளால் என்னை உறுதியாகக் கட்டினால்[a], நான் பலவீனமடைந்து, சாதாரண மனிதனைப்போல் ஆவேன்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “கட்டுதல்” என்னும் செயல் வலியுறுத்திக் கூறப்படுகிறது.
    reason: source_emphasis
  - marker: b
    text: சொல்லடியாக, “மற்ற மனிதர்களில் ஒருவனைப்போல்”; அதாவது, அசாதாரண வலிமையில்லாத சாதாரண மனிதனைப்போல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: அவன் அவளிடம் ... என்றான்
  rationale: எபிரெயக் கதையோட்டத்தில் வரும் வַיֹּאמֶר என்பதைக் காலவரிசையைக் காட்டும் இயல்பான நவீனத் தமிழில் வழங்குகிறது; தொடக்க וַ־ தனியே ‘மேலும்’ என மொழிபெயர்க்கப்பட வேண்டியதில்லை.
- source_word: אִם אָסוֹר יַאַסְרוּנִי
  choice: என்னை உறுதியாகக் கட்டினால்
  rationale: முற்றுவினைக்கு முன் வரும் infinitive absolute கட்டும் செயலை வலியுறுத்துகிறது. ‘உறுதியாகக் கட்டினால்’ என்பது அந்த வலியுறுத்தலை இயல்பான தமிழில் தருகிறது; ‘இறுக்கமாக’ என்பது தேவையற்ற உடல் நுணுக்கத்தைச் சேர்க்கக்கூடும்.
- source_word: בַּעֲבֹתִים חֲדָשִׁים
  choice: புதிய கயிறுகளால்
  rationale: עֲבֹתִים என்பது கட்டுவதற்கான தடித்த கயிறுகள் அல்லது வடங்கள்; சூழலில் ‘கயிறுகள்’ தெளிவான பொதுத் தமிழாகும். חֲדָשִׁים என்பதற்கு ‘புதிய’ நேரான இணை.
- source_word: אֲשֶׁר לֹא נַעֲשָׂה בָהֶם מְלָאכָה
  choice: இதுவரை எந்த வேலைக்கும் பயன்படுத்தப்படாத
  rationale: சொல்லடியாக ‘அவற்றால் எந்த வேலையும் செய்யப்படாத’ என்ற செயல்பாட்டில்லாத நிலையை, கயிறுகள் இன்னும் பயன்படுத்தப்படாதவை என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְחָלִיתִי
  choice: நான் பலவீனமாகி
  rationale: חלה இங்கு நோயுறுதல் என்பதைக் காட்டிலும் வலிமை இழந்து பலவீனமாதலைக் குறிக்கிறது.
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  choice: சாதாரண மனிதனைப்போல் ஆகிவிடுவேன்
  rationale: சிம்சோனின் அசாதாரண வலிமைக்கு மாறாக ஒரு பொதுவான மனிதனின் நிலையைச் சுட்டுகிறது. ‘ஒரு மனிதனைப்போல்’ என்ற சொல்லடியான வடிவத்தின் நோக்கத்தை நவீனத் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: כְּאַחַד הָאָדָם என்பதன் பொருள்
  choice: சாதாரண மனிதனைப்போல்
  alternative: மனிதர்களில் ஒருவனைப்போல் / எந்த மனிதனைப்போலவும்
  rationale: இத்தொடர் மனிதகுலத்தை அருவமாகக் குறிப்பிடாமல், சிம்சோனின் அபூர்வ வலிமையற்ற சாதாரண மனித நிலையோடு ஒப்பிடுகிறது. தமிழில் ‘மனிதன்’ இயல்பாகப் பாலினத்தைத் திணிக்காமல் இங்கு தனிநபரைக் குறிக்கிறது.
- issue: אָסוֹר יַאַסְרוּנִי வலியுறுத்தல்
  choice: உறுதியாகக் கட்டினால்
  alternative: கட்டினால்
  rationale: எபிரெய infinitive absolute + finite verb அமைப்பின் வலியுறுத்தலைப் பாதுகாக்கிறது; ஆனால் கட்டும் விதம் குறித்து மூலத்தில் இல்லாத குறிப்பிட்ட ‘இறுக்கம்’ ஒன்றைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கதையாடலுக்கேற்ற கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘பலவீனமாகி’ மற்றும் ‘சாதாரண மனிதனைப்போல்’ ஆகியவை சூழலின் வலிமை-மாறுபாட்டைத் தெளிவாக வைத்துள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
