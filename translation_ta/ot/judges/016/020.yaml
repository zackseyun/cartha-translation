    issue: Ambiguous/incorrect reflexive reference in ‘யாவே தன்னைவிட்டு விலகிவிட்டார்’
    rationale: Because தன் normally refers to the clause subject, this wording can mean ‘Yahweh had departed from himself.’ It must explicitly identify Samson as the one from whom Yahweh departed.
