base_translation:
  language: en
  yaml_path: translation/ot/judges/016/020.yaml
  text: And she said[a], “The Philistines are upon you, Samson!” And he awoke from his sleep and said, “I will go out as at other times and shake myself free.” But he did not know that Yahweh had departed from him.
translation:
  language: ta
  text: அவள், “சிம்சோனே, பெலிஸ்தியர்கள் உன்மேல் வந்துவிட்டார்கள்!” என்றாள். அவன் தூக்கத்திலிருந்து விழித்து, “முந்தைய தடவைகளைப்போல இப்போதும் வெளியே போய், உதறி விடுபடுவேன்[a]” என்று சொன்னான். ஆனால் யாவே அவனைவிட்டு விலகிவிட்டார் என்பது அவனுக்குத் தெரியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னை உதறிக்கொள்வேன்.” முந்தைய சந்தர்ப்பங்களைப்போலத் தன்னை உதறி விடுவித்துக்கொள்வதே இங்கு பெரும்பாலும் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: பெலிஸ்தியர்கள் உன்மேல் வந்துவிட்டார்கள்
  rationale: பகைமை கொண்ட எழுவாயுடன் வரும் עַל உடனடி தாக்குதல் அல்லது பிடித்தலைக் குறிக்கிறது. தமிழில் இயல்பாகவும் எச்சரிக்கையின் அவசரத்தன்மையுடனும் அமைய இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וַיִּקַץ מִשְּׁנָתוֹ
  choice: அவன் தூக்கத்திலிருந்து விழித்து
  rationale: יקץ என்பதையும் מִשְּׁנָתוֹ என்ற சொற்றொடரையும் நேரடியாகவும் நவீனத் தமிழுக்கு இயல்பாகவும் தருகிறது.
- source_word: אֵצֵא
  choice: வெளியே போய்
  rationale: יצא என்பதன் அடிப்படைப் பொருளான ‘வெளியே போதல்’ காக்கப்படுகிறது; தாக்குபவர்களை எதிர்கொள்ளப் போவதாக உரை வெளிப்படையாகச் சொல்லாததால் அது சேர்க்கப்படவில்லை.
- source_word: כְּפַעַם בְּפַעַם
  choice: முந்தைய தடவைகளைப்போல இப்போதும்
  rationale: முன்பு மீண்டும் மீண்டும் நிகழ்ந்த சந்தர்ப்பங்களைச் சுட்டும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְאִנָּעֵר
  choice: உதறி விடுபடுவேன்
  rationale: נער என்பதன் நிபால் வடிவம் தன்னை உதறிக்கொள்வதையோ உதறி விடுபடுவதையோ குறிக்கலாம். சூழலில் எதிரிகளின் பிடியிலிருந்து விடுபடுவது உட்குறிப்பாக இருப்பதால் ‘உதறி விடுபடுவேன்’ எனத் தரப்பட்டு, நெருக்கமான மாற்று அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான יהוה ஒரு பட்டப்பெயரால் மாற்றப்படாமல், நவீனத் தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: סָר מֵעָלָיו
  choice: தன்னைவிட்டு விலகிவிட்டார்
  rationale: סור מן/מעל என்பதன் விலகுதல் அல்லது நீங்குதல் என்ற பொருளைத் தக்கவைக்கிறது; அந்த விலகலின் தன்மை அல்லது நிரந்தரத்தன்மை குறித்து உரையில் இல்லாத விளக்கம் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை நான்கெழுத்துத் திருப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயரால் பதிலிடாமல் தனிப்பெயராக ஒலிபெயர்க்கிறது.
- issue: யாவே சிம்சோனைவிட்டு விலகியதன் தன்மை
  choice: யாவே தன்னைவிட்டு விலகிவிட்டார் என்ற உரையின் கூற்றை விளக்கமின்றித் தக்கவைத்தல்
  alternative: யாவேயின் வல்லமை அளிக்கும் பிரசன்னம் அவனைவிட்டு விலகிவிட்டது
  rationale: இது வல்லமை அளிக்கும் பிரசன்னத்தையா, அருளையா, வேறு எந்தத் தெய்வீக உறவையா குறிக்கிறது என்பதை வசனம் விளக்கவில்லை. ஆகவே அந்த இறையியல் இறுக்கமும் தெளிவின்மையும் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. சிம்சோனின் தன்னம்பிக்கைக்கும் இறுதிக் கூற்றின் கனத்த தன்மைக்கும் இடையிலான முரண் காக்கப்பட்டுள்ளது.
