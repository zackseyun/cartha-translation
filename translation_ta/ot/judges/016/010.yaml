base_translation:
  language: en
  yaml_path: translation/ot/judges/016/010.yaml
  text: Then Delilah said to Samson[a], “Look, you have mocked me and spoken lies to me. Now please tell me what you may be bound with.”
translation:
  language: ta
  text: அப்போது தெலீலாள் சிம்சோனிடம், “இதோ, நீ என்னை முட்டாளாக்கி[a], என்னிடம் பொய்களைப் பேசியிருக்கிறாய். இப்போது, உன்னை எதனால் கட்ட முடியும் என்பதைத் தயவுசெய்து எனக்குச் சொல்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைக் கேலி செய்து”; எபிரெய வினைச்சொல், வஞ்சனையால் ஒருவரை ஏமாற்றி முட்டாளாக்குதல் அல்லது அவருடன் விளையாடுதல் என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: அப்போது ... என்றாள்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழ் கதையோட்டத்தில் ‘அப்போது’ இயல்பாக வரிசையை வெளிப்படுத்துகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: தெலீலாளின் குற்றச்சாட்டைக் கவனிக்கச் செய்யும் இடைச்சொல்லின் சுட்டும் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: הֵתַלְתָּ בִּי
  choice: நீ என்னை ஏமாற்றி
  rationale: התל என்பதில் வஞ்சனையால் ஒருவரை விளையாட்டாக எடுத்தல் அல்லது முட்டாளாக்குதல் என்ற நிழற்பொருள் உள்ளது. ‘ஏமாற்றி’ இச்சூழலில் தெளிவாகவும் இயல்பாகவும் உள்ளது; பரந்த நிழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַתְּדַבֵּר אֵלַי כְּזָבִים
  choice: என்னிடம் பொய்களைப் பேசியிருக்கிறாய்
  rationale: ‘என்னிடம் பொய்களைப் பேசினாய்’ என்ற எபிரெய மூலத்தின் வினைச்செயலையும் பன்மை பெயர்ச்சொல்லையும் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: עַתָּה
  choice: இப்போதாவது
  rationale: முந்தைய ஏமாற்றங்களுக்குப் பின் மீண்டும் விடுக்கப்படும் வேண்டுகோளின் மாற்றத்தையும் வற்புறுத்தலையும் இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: הַגִּידָה נָּא לִי
  choice: தயவுசெய்து எனக்குச் சொல்
  rationale: கட்டளையுடன் வரும் נָא-வின் வேண்டுகோள் தொனியை நவீன, மரியாதையான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּמֶּה תֵּאָסֵר
  choice: உன்னை எதனால் கட்ட முடியும்
  rationale: בַּמֶּה-வின் கருவிப் பொருளான ‘எதனால்’ என்பதையும், நிஃபால் வடிவின் செயப்பாட்டு அர்த்தத்தையும், சூழலிலுள்ள சாத்தியத்தையும் காக்கிறது.
