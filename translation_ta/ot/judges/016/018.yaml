base_translation:
  language: en
  yaml_path: translation/ot/judges/016/018.yaml
  text: When Delilah saw that he had told her all his heart[a], she sent and called for the Philistine rulers, saying, “Come up this time[c][b], for he has told her all his heart.” Then the Philistine rulers came up to her and brought the silver in their hands.
translation:
  language: ta
  text: தெலீலா, அவன் தன் மனதில் இருந்ததையெல்லாம் அவளிடம் சொல்லிவிட்டதைக் கண்டபோது, பெலிஸ்திய ஆட்சியாளர்களுக்கு[b] ஆள் அனுப்பி அழைத்து, “இந்த முறை வாருங்கள்; ஏனெனில் அவன் தன் மனதில் இருந்ததையெல்லாம் அவளிடம் சொல்லிவிட்டான்[a]” என்றாள். அப்போது பெலிஸ்திய ஆட்சியாளர்கள் வெள்ளியை[c] தங்கள் கைகளில் எடுத்துக்கொண்டு அவளிடம் வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில், “அவன் தன் மனதில் இருந்ததையெல்லாம் அவளிடம் சொல்லிவிட்டான்” என்று மூன்றாம் நபர் பெண்பால் வடிவம் உள்ளது. நேரடிப் பேச்சில் “என்னிடம்” என்று சிலர் எதிர்பார்க்கலாம்.
    reason: textual_variant
  - marker: b
    text: அல்லது, “பெலிஸ்தியரின் தலைவர்கள்.”
    reason: lexical_alternative
  - marker: c
    text: இது அவர்களால் கொடுக்கப்படவிருந்த ஊதியமான வெள்ளியைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: கண்டபோது
  rationale: ראה என்பதன் அடிப்படைப் பொருளான ‘காணுதல்’ என்பதைக் காத்து, தொடரும் כִּי கூறை உணர்ந்த உள்ளடக்கமாக இயல்பான தமிழ் காலவாக்கியத்தில் இணைக்கிறது.
- source_word: הִגִּיד
  choice: சொல்லிவிட்டான்
  rationale: Hiphil வடிவின் ‘தெரிவித்தல்/சொல்லுதல்’ பொருளையும், முழு வெளிப்படுத்தல் நிறைவடைந்ததையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אֶת כָּל לִבּוֹ
  choice: தன் மனதில் இருந்ததையெல்லாம்
  rationale: ‘அவனுடைய முழு இருதயம்’ என்ற சொற்சொல் மொழிபெயர்ப்பு தமிழில் உடல் உறுப்பைக் குறிப்பதுபோல் ஒலிக்கலாம்; இந்தத் தமிழ் மரபுத்தொடர் அவன் மறைத்திருந்ததை முழுமையாக வெளிப்படுத்தினான் என்ற எபிரெயப் பொருளை இயல்பாகக் காக்கிறது.
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: அழைத்து வரும்படி ஆள் அனுப்பி
  rationale: ‘அனுப்பினாள்’ மற்றும் ‘அழைத்தாள்’ ஆகிய இரு செயல்களையும் தமிழ் நடைமுறைக்கு ஏற்ற ஒரே தொடரில் தெளிவாகக் காக்கிறது.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: பெலிஸ்திய ஆட்சியாளர்கள்
  rationale: סרן என்பது பெலிஸ்தியரின் உயர்நிலை அரசியல் தலைவர்களைக் குறிக்கிறது; ‘ஆட்சியாளர்கள்’ என்பது நவீன வாசகர்களுக்குத் தெளிவானது, மேலும் நிலப்பிரபுத்துவச் சாயலைத் தவிர்க்கிறது.
- source_word: עֲלוּ הַפַּעַם
  choice: இந்த முறை வாருங்கள்
  rationale: עלה இங்கு தெலீலா இருந்த இடத்தை நோக்கி வருவதைக் குறிக்கிறது; הַפַּעַם இப்போது உண்மையான வாய்ப்பு வந்துவிட்டதைச் சுட்டும் ‘இந்த முறை’ என இயல்பாக வழங்கப்படுகிறது.
- source_word: לָהּ
  choice: அவளிடம்
  rationale: நேரடிப் பேச்சில் ‘என்னிடம்’ என்பது எதிர்பார்க்கப்பட்டாலும், ஏற்றுக்கொள்ளப்பட்ட எபிரெய உரையின் மூன்றாம் நபர் பெண்பால் வடிவம் மாற்றமின்றிக் காக்கப்படுகிறது.
- source_word: וַיַּעֲלוּ הַכֶּסֶף בְּיָדָם
  choice: வெள்ளியைத் தங்கள் கைகளில் எடுத்துக்கொண்டு ... வந்தார்கள்
  rationale: அவர்கள் பணமாகக் கொடுக்க வேண்டிய வெள்ளியை உடன் கொண்டுவந்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது; ‘வெள்ளி’ என்ற மூலச் சொல்லும் காக்கப்படுகிறது.
theological_decisions:
- issue: சிம்சோன் ‘மனதில் இருந்ததையெல்லாம்’ தெரிவித்தான் என்பதன் அளவு
  choice: எபிரெய மரபுத்தொடரின் முழுமை உணர்வை மட்டும் காக்கப்பட்டது
  alternative: அவன் தன் ரகசியத்தை மட்டும் தெரிவித்தான் என்று குறிப்பாக்குதல்
  rationale: உரை ‘அவன் இருதயம் முழுவதையும்’ என்று கூறுகிறது; அதை முடி அல்லது நாசீரேய விரதத்தைப் பற்றிய தகவலாக மட்டும் சுருக்குவது உரையில் உள்ள பரந்த உளவியல் மற்றும் கதைநடைத் தீவிரத்தை முன்கூட்டியே தீர்மானித்துவிடும்.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தெலீலா’ மற்றும் ‘பெலிஸ்தியர்’ என்ற பெயர்வடிவங்கள் தெளிவான நவீன ஒலிபெயர்ப்பாக வழங்கப்பட்டுள்ளன. மூல எபிரெயில் நேரடிப் பேச்சுக்குள் காணப்படும் ‘அவளிடம்’ என்ற இயல்புக்கு மாறான மூன்றாம் நபர் வடிவம் திருத்தப்படாமல், அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
