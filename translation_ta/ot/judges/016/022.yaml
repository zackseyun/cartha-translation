  yaml_path: translation/ot/judges/016/022.yaml
  text: But the hair of his head began to grow again after it had been shaved[a][b].
translation:
  language: ta
  text: ஆனால், அவன் தலைமுடி மழிக்கப்பட்டபின் மீண்டும் வளரத் தொடங்கியது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வளரத் தொடங்கியது.” எபிரெய வினையில் “மீண்டும்” என்பது வெளிப்படையாக இல்லை; முன்பு தலைமுடி மழிக்கப்பட்டிருந்த சூழலிலிருந்து அந்தப் பொருள் பெறப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அது மழிக்கப்பட்டபோது” அல்லது “அவன் மழிக்கப்பட்டபின்.” காலத்தைக் குறிக்கும் உட்பிரிவையும் அதில் மறைமுகமாகச் சுட்டப்படும் பொருளையும் எபிரெயத்தில் சற்றே வேறுபட்ட விதங்களில் வெளிப்படுத்தலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: தொடங்கியது
  rationale: חלל என்ற வினையின் இவ்வடிவம், தொடர்ந்து வரும் வினையெச்சத்துடன் ‘தொடங்குதல்’ என்ற பொருளைத் தருகிறது. நவீன தமிழில் இயல்பாக அமைய ‘வளரத் தொடங்கியது’ என வழங்கப்பட்டது.
- source_word: שְׂעַר רֹאשׁוֹ
  choice: அவன் தலைமுடி
  rationale: சொல்லுக்கு சொல் ‘அவன் தலையின் முடி.’ ‘அவன் தலைமுடி’ என்பது அந்த எபிரெயச் சொல்லிணையின் முழுப் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: לְצַמֵּחַ
  choice: மீண்டும் வளர
  rationale: צמח என்பதன் அடிப்படைப் பொருள் ‘முளைத்தல்/வளர்தல்.’ முடி முன்பு மழிக்கப்பட்டிருந்த சூழலால் ‘மீண்டும்’ என்பது தமிழில் இயல்பாகக் குறிப்பாக்கப்பட்டுள்ளது; அது எபிரெய வினையில் வெளிப்படையாக இல்லை என்பதால் அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר
  choice: மழிக்கப்பட்டிருந்த
  rationale: כַּאֲשֶׁר இங்கு மழித்த நிகழ்வையும் பின்னர் தொடங்கிய வளர்ச்சியையும் காலத் தொடர்பில் இணைக்கிறது. தமிழில் ‘மழிக்கப்பட்டிருந்த’ என்பது முன்னதாக நிகழ்ந்த நிலையையும் பிரதான வாக்கியத்துடனான தொடர்பையும் சுருக்கமாகக் காட்டுகிறது.
- source_word: גֻּלָּח
  choice: மழிக்கப்பட்டிருந்த
  rationale: גלח என்பதன் செயப்பாட்டு வடிவம் ‘மழிக்கப்பட்டது’ என்று பொருள். தமிழில் தலைமுடியைக் குறிக்கும் இயல்பான வினையாக ‘மழி’ தேர்ந்தெடுக்கப்பட்டது; செயப்பாட்டு தன்மை காக்கப்பட்டுள்ளது.
