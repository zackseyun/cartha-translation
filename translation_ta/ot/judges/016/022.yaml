translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், சுருக்கமான மற்றும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆனால்’ என்பது முந்தைய நிகழ்வுடன் உள்ள எதிர்மாற்றத்தை வெளிப்படுத்துகிறது. மூலத்தில் உள்ள காலத் தொடர்பும் மறைமுகக் குறியீட்டின் சிறிய தெளிவின்மையும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
