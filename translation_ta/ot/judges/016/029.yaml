base_translation:
  language: en
  yaml_path: translation/ot/judges/016/029.yaml
  text: Then Samson grasped the two middle pillars on which the house stood[a], and he braced himself against them[b], one with his right hand and one with his left.
translation:
  language: ta
  text: பிறகு சிம்சோன், கட்டிடத்தைத் தாங்கி நின்ற நடுவிலுள்ள இரண்டு தூண்களையும் இறுகப் பற்றினான்; அவற்றின்மேல் தன்னை ஊன்றிக்கொண்டான்—ஒன்றைத் தன் வலது கையாலும் மற்றொன்றைத் தன் இடது கையாலும் பிடித்தான்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மையத்திலுள்ள இரண்டு தூண்களையும்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவற்றின்மேல் தன்னைச் சாய்த்தான்.’ எபிரெய வினை, ஒன்றின்மேல் சாய்வதையோ அதைக் கொண்டு தன்னைத் தாங்கிக்கொள்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְפֹּת
  choice: இறுகப் பற்றிக்கொண்டு
  rationale: இந்த வினை உறுதியாகப் பற்றுதல் அல்லது பிடித்துக்கொள்ளுதல் என்பதைக் குறிக்கிறது. ‘இறுகப் பற்றிக்கொண்டு’ என்பது செயலின் வலிமையையும் நோக்கமுள்ள தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁנֵי עַמּוּדֵי הַתָּוֶךְ
  choice: நடுவிலுள்ள இரண்டு தூண்கள்
  rationale: עַמּוּדֵי என்பது ‘தூண்கள்’; הַתָּוֶךְ என்பது நடுப்பகுதியைக் குறிக்கிறது. இந்தச் சொற்றொடர் கட்டிடத்தின் நடுவில் அல்லது மையத்தில் இருந்த தூண்களைச் சுட்டுகிறது.
- source_word: אֲשֶׁר הַבַּיִת נָכוֹן עֲלֵיהֶם
  choice: அந்தக் கட்டிடம் தாங்கி நின்ற
  rationale: נָכוֹן இங்கு நிலைநிறுத்தப்பட்டிருத்தல் அல்லது ஆதரிக்கப்பட்டிருத்தல் என்ற பொருளைத் தருகிறது. தூண்களே கட்டிடத்தின் கட்டமைப்பு ஆதாரங்கள் என்பதை ‘தாங்கி நின்ற’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיִּסָּמֵךְ עֲלֵיהֶם
  choice: அவற்றின்மேல் தன்னைச் சாய்த்தான்
  rationale: סמך என்பது ஒன்றின்மேல் சாய்தல், தன்னைத் தாங்கிக்கொள்ளுதல் அல்லது அழுத்தி ஊன்றுதல் எனப் பொருள்படலாம். மூலத்தின் பொருள் விரிவை அதிகமாகக் குறுக்காமல் உடல் செயலைத் தெளிவாகக் காட்ட ‘தன்னைச் சாய்த்தான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶחָד בִּימִינוֹ וְאֶחָד בִּשְׂמֹאלוֹ
  choice: ஒன்றைத் தன் வலக்கையாலும் மற்றொன்றைத் தன் இடக்கையாலும்
  rationale: אֶחָד ... וְאֶחָד என்ற பகிர்வுக் கட்டமைப்பு ஒவ்வொரு பக்கத்திற்கும் ஒரு தூண் இருந்ததைக் காட்டுகிறது. சூழலில் சிம்சோன் தூண்களைப் பற்றியதால், வலது மற்றும் இடது என்பவற்றை ‘வலக்கை’, ‘இடக்கை’ எனத் தமிழில் வெளிப்படுத்துவது இயல்பாக உள்ளது.
- source_word: הַבַּיִת
  choice: கட்டிடம்
  rationale: இந்தச் சொல் நேரடியாக ‘வீடு’ என வரலாம்; ஆனால் இங்கு மக்கள் கூடியிருந்த பெரிய கட்டமைப்பைக் குறிக்கும் சூழலில் ‘கட்டிடம்’ என்பது தவறான வீட்டு உணர்வைத் தவிர்த்து, பொருளைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
