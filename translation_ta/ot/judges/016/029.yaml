translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. செயல் வரிசையும் எபிரெய மூலத்தின் உடல் சார்ந்த படிமமும் பாதுகாக்கப்பட்டுள்ளன; ‘சாய்த்தான்’ என்பதன் பொருள் வரம்பு அடிக்குறிப்பில் திறந்துவைக்கப்பட்டுள்ளது.
