  text: וַ/יַּעֲלוּ לָ֞/הּ סַרְנֵ֣י פְלִשְׁתִּ֗ים שִׁבְעָ֛ה יְתָרִ֥ים לַחִ֖ים אֲשֶׁ֣ר לֹא חֹרָ֑בוּ וַ/תַּאַסְרֵ֖/הוּ בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/008.yaml
  text: So the Philistine rulers brought up to her seven fresh bowstrings that had not been dried[a], and she bound him with them.
translation:
  language: ta
  text: பெலிஸ்திய ஆட்சியாளர்கள்[a] இன்னும் உலராத ஏழு ஈரமான வில்நாண்களை[b] அவளிடம் கொண்டுவந்தனர். அவள் அவற்றால் அவனைக் கட்டினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெலிஸ்தியரின் பிரபுக்கள்.” எபிரெயச் சொல் பெலிஸ்தியரின் முதன்மை ஆட்சியதிகாரிகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கயிறுகளை.” இங்குள்ள எபிரெயச் சொல் வில்நாண்களையோ நாண் போன்ற கயிறுகளையோ குறிக்கலாம்.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: கொண்டுவந்தனர்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே போ/மேலே கொண்டுவா’ என்பதாக இருந்தாலும், இச்சூழலில் அவர்கள் கேட்ட பொருட்களை அவளிடம் கொண்டுவந்து கொடுத்தனர் என்பதே இயல்பான தமிழில் தெளிவாகிறது.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: பெலிஸ்திய ஆட்சியாளர்கள்
  rationale: סְרָנִים என்பது பெலிஸ்தியரின் அங்கீகரிக்கப்பட்ட உயர்மட்ட அரசியல் தலைவர்களைக் குறிக்கிறது. ‘ஆட்சியாளர்கள்’ என்பது நவீன தமிழில் தெளிவானதும், தேவையற்ற நிலப்பிரபுத்துவச் சாயலைத் தவிர்ப்பதும் ஆகும்.
- source_word: יְתָרִים
  choice: வில்நாண்கள்
  rationale: இந்தச் சொல் பொதுவான கயிறுகளைக் குறிக்கக்கூடியதாக இருந்தாலும், வில்லுக்குப் பயன்படுத்தப்படும் நாண்கள் என்ற குறிப்பான பொருள் இங்கு பொருத்தமானது. மூலச்சொல்லின் விரிந்த சாத்தியத்தை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: לַחִים
  choice: ஈரமான
  rationale: לַחִים என்பது ஈரம் காயாத, பசுமையான அல்லது புதிய நிலையில் இருப்பதைக் குறிக்கிறது. அடுத்து வரும் ‘இன்னும் உலராத’ என்பதோடு இணைந்து, பொருளின் அப்போதைய நிலையை ‘ஈரமான’ என்பது நேரடியாகத் தெரிவிக்கிறது.
- source_word: אֲשֶׁר לֹא חֹרָבוּ
  choice: இன்னும் உலராத
  rationale: חֹרָבוּ இங்கு உலர்ந்த நிலையை அடையாததைக் குறிக்கிறது. ‘இன்னும் உலராத’ என்பது காலநிலையையும் முடிவுறாத நிலையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וַתַּאַסְרֵהוּ
  choice: அவனைக் கட்டினாள்
  rationale: אסר என்பதன் வழக்கமான பொருள் கட்டுதல் அல்லது பிணைத்தல். ‘கட்டினாள்’ என்பது சுருக்கமாகவும் கதைநடைக்கு ஏற்றதாகவும் உள்ளது.
- source_word: בָּהֶם
  choice: அவற்றால்
  rationale: בָּהֶם கருவிப்பொருளைக் குறிக்கிறது; ‘அவற்றால்’ என்பது அந்த நாண்களைப் பயன்படுத்தி அவனைக் கட்டினாள் என்பதை இயல்பாகத் தெரிவிக்கிறது.
