source:
  edition: WLC
  text: וַ֠/יְהִי כִּֽי הֵצִ֨יקָה לּ֧/וֹ בִ/דְבָרֶ֛י/הָ כָּל הַ/יָּמִ֖ים וַ/תְּאַֽלֲצֵ֑/הוּ וַ/תִּקְצַ֥ר נַפְשׁ֖/וֹ לָ/מֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/016.yaml
  text: And it happened that[a], when she pressed him with her words all the days and urged him on, his soul grew short to the point of death.
translation:
  language: ta
  text: அவள் நாள்தோறும் தன் வார்த்தைகளால் அவனை நெருக்கியும் வற்புறுத்தியும் வந்தபோது, அவன் மனம் சாகுமளவுக்கு நொந்துபோனது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “அவனுடைய உயிர் சாகும்படி குறுகியது.” இது மிகுந்த மனவேதனை, எரிச்சல், அல்லது சோர்வைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: …போது
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியைத் தமிழில் இயல்பான காலத் துணைவாக்கியமாக வெளிப்படுத்துகிறது; தனியே ‘அப்போது நிகழ்ந்தது’ என்று மொழிபெயர்ப்பது நவீன தமிழில் செயற்கையாக ஒலிக்கும்.
- source_word: הֵצִיקָה לוֹ
  choice: அவனை நெருக்கி
  rationale: அவள் சொற்களால் தொடர்ந்து கொடுத்த மனஅழுத்தத்தையும் தொந்தரவையும் சூழலுக்கேற்ற வகையில் தெரிவிக்கிறது.
- source_word: בִדְבָרֶיהָ
  choice: தன் வார்த்தைகளால்
  rationale: கருவிப்பொருளைக் குறிக்கும் எபிரெய முன்னொட்டையும் ‘அவளுடைய வார்த்தைகள்’ என்ற நேரடியான உருவகத்தையும் காக்கிறது.
- source_word: כָּל הַיָּמִים
  choice: நாள்தோறும்
  rationale: ஒவ்வொரு நாளும் நீடித்த அவளுடைய வற்புறுத்தலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וַתְּאַלֲצֵהוּ
  choice: வற்புறுத்தியபோது
  rationale: வெறும் வேண்டுகோளைவிட வலுவான, விடாப்பிடியான கட்டாய அழுத்தத்தை வெளிப்படுத்துகிறது; முந்தைய வினையுடன் சேர்ந்து தீவிரத்தைக் கூட்டுகிறது.
- source_word: וַתִּקְצַר נַפְשׁוֹ
  choice: அவன் மனம் குறுகிப்போனது
  rationale: ‘அவனுடைய உயிர் குறுகியது’ என்ற எபிரெய உருவகத்தின் உள் நெருக்கடியைத் தமிழில் புரியத்தக்கவாறு காக்கிறது; ‘பொறுமை தீர்ந்தது’ என்று மட்டும் கூறி அதன் தீவிரத்தைச் சுருக்கவில்லை.
- source_word: לָמוּת
  choice: சாகுமளவுக்கு
  rationale: அவனுடைய உளவேதனை மரணத்தின் எல்லைவரை சென்றதைக் காட்டுகிறது; அவன் சாக விரும்பினான் என்று மூலத்தில் இல்லாத நோக்கத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: לָמוּת என்பது மரிக்க விரும்பிய நோக்கத்தையா அல்லது துயரத்தின் உச்ச அளவையா குறிக்கிறது?
  choice: சாகுமளவுக்கு
  alternative: சாக விரும்புமளவுக்கு
  rationale: எபிரெய infinitive இங்கு தீவிரத்தின் எல்லையைக் குறிக்க முடியும்; தற்கொலை விருப்பத்தைத் தெளிவாகக் கூறாத மூலத்தின் இடைவெளியை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மனம் குறுகிப்போனது’ என்பது மூல உருவகத்தின் சுவையை ஓரளவு காக்கிறது; அதன் நேரடியான வடிவமும் பொருள் வரம்பும் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
