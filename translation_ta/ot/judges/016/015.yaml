base_translation:
  language: en
  yaml_path: translation/ot/judges/016/015.yaml
  text: Then she said to him[a], “How can you say, ‘I love you,’ when your heart is not with me? These three times you have mocked me and have not told me in what your great strength lies.”
translation:
  language: ta
  text: அப்போது அவள் அவனிடம், “உன் உள்ளம் என்னோடு இல்லாத நிலையில், ‘நான் உன்னை நேசிக்கிறேன்’ என்று நீ எப்படிச் சொல்லலாம்? இந்த மூன்று முறைகளிலும் நீ என்னை ஏமாற்றி விளையாடியிருக்கிறாய்[a]; உன் பெரும் வலிமை எதில் இருக்கிறது என்பதை எனக்குச் சொல்லவில்லை” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னோடு விளையாடியிருக்கிறாய்,” “என்னை ஏமாற்றியிருக்கிறாய்,” அல்லது “என்னை முட்டாளாக்கியிருக்கிறாய்.” எபிரெய வினை, ஏமாற்றிக் கேலி செய்வதன் மூலம் ஒருவரை அற்பமாக நடத்தும் பொருளைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: எப்படிச் சொல்லலாம்?
  rationale: தெலீலாளின் நம்பமுடியாத எதிர்ப்பையும் கேள்வியின் சொல்லாட்சிசார் வலிமையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲהַבְתִּיךְ
  choice: நான் உன்னை நேசிக்கிறேன்
  rationale: இங்கு இறந்தகாலச் செயலை அல்ல, சிம்சோன் கூறும் தொடரும் அன்புக் கூற்றையே குறிக்கிறது.
- source_word: לִבְּךָ אֵין אִתִּי
  choice: உன் உள்ளம் என்னோடு இல்லாதிருக்கும்போது
  rationale: எபிரெய மொழியின் ‘இதயம்/உள்ளம்’ என்ற உருவகத்தையும் அதிலுள்ள பற்றுறுதி மற்றும் உள்நோக்கத்தின் கருத்தையும் மிகையாக விளக்காமல் காக்கிறது.
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: இப்போதோடு மூன்று முறை
  rationale: முன்பு நிகழ்ந்த மூன்று சம்பவங்களைச் சுட்டும் எபிரெய தொடக்கத்தின் இயல்பான தமிழ்ச் சமமான சொற்றொடர்.
- source_word: הֵתַלְתָּ בִּי
  choice: நீ என்னை ஏமாற்றி விளையாடியிருக்கிறாய்
  rationale: ஏமாற்றுவதன் மூலம் ஒருவரை அற்பமாக நடத்துதல் அல்லது அவரோடு விளையாடுதல் என்ற வினையின் கலந்த பொருளைத் தமிழில் எடுத்துரைக்கிறது; பிற சாத்தியங்களை அடிக்குறிப்பு காக்கிறது.
- source_word: הִגַּדְתָּ לִּי
  choice: எனக்குச் சொல்லவில்லை
  rationale: உரையாடல் சூழலுக்கேற்ற நேரடியான, இயல்பான தமிழாக்கம்.
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: உன் பெரும் வலிமை எதில் இருக்கிறது
  rationale: வலிமையின் இருப்பிடத்தை மட்டும் அல்லாமல் அதன் அடிப்படை அல்லது காரணத்தைப் பற்றிய கேள்வியையும் உள்ளடக்கும் மூலமொழியின் தெளிவின்மையைப் பாதுகாக்கிறது.
