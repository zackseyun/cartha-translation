base_translation:
  language: en
  yaml_path: translation/ot/judges/016/031.yaml
  text: Then his brothers and all his father’s household came down[a], carried him away, brought him up, and buried him between Zorah and Eshtaol, in the tomb of Manoah his father. And he judged Israel twenty years.
translation:
  language: ta
  text: பின்பு அவனுடைய சகோதரர்களும் அவனுடைய தந்தையின் குடும்பத்தார் அனைவரும் இறங்கிவந்து, அவனைத் தூக்கிக்கொண்டு மேலே சென்று, சோராவுக்கும் எஸ்தாவோலுக்கும் நடுவே அவனுடைய தந்தை மனோவாவின் கல்லறையில் அவனை அடக்கம் செய்தார்கள். அவன் இஸ்ரவேலை இருபது ஆண்டுகள் நியாயந்தீர்த்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் இஸ்ரவேலை இருபது ஆண்டுகள் நியாயந்தீர்த்திருந்தான்.” இதை முன்பு நிறைவுற்ற அவனுடைய பணிக்காலத்தைத் திரும்பிப் பார்க்கும் சுருக்கமாகவும் எபிரெயத்தில் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: இறங்கிவந்து
  rationale: ירד குறிக்கும் கீழ்நோக்கிய இடப்பெயர்ச்சியை இயல்பான தமிழில் தெரிவிக்கிறது; கதைநோக்கில் அவர்கள் சிம்சோன் இருந்த இடத்துக்கு வந்ததையும் காட்டுகிறது.
- source_word: אֶחָיו
  choice: அவனுடைய சகோதரர்கள்
  rationale: இச்சொல்லின் வழக்கமான நேரடிப் பொருள் உடன்பிறந்த சகோதரர்கள்; இங்கே அதை விரிவாக ‘உறவினர்கள்’ என்று கொள்ள வேண்டிய சூழல் இல்லை.
- source_word: כָּל בֵּית אָבִיהוּ
  choice: அவனுடைய தந்தையின் குடும்பத்தார் அனைவரும்
  rationale: ‘தந்தையின் வீடு’ என்ற எபிரெய மரபுத்தொடர் தந்தைவழிக் குடும்ப அலகைக் குறிக்கிறது; நவீன தமிழில் ‘குடும்பத்தார்’ இதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: அவனைத் தூக்கிக்கொண்டு
  rationale: அடக்கச் சூழலில் נשא என்பது உடலைத் தூக்கிச் செல்வதைக் குறிக்கிறது.
- source_word: וַיַּעֲלוּ
  choice: மேலே சென்று
  rationale: עלה குறிக்கும் மேல்நோக்கிய, பெரும்பாலும் நிலவியல் சார்ந்த இடப்பெயர்ச்சியைப் பாதுகாக்கிறது; முந்தைய வினையால் உடலை எடுத்துச் சென்றது தெளிவாக இருப்பதால் பொருளை மீண்டும் சேர்க்கவில்லை.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: அவனை அடக்கம் செய்தார்கள்
  rationale: அடக்கம் செய்வதற்கான வினையின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: சோராவுக்கும் எஸ்தாவோலுக்கும் நடுவே
  rationale: இரு இடங்களுக்கிடையேயான அடக்க இடத்தை நேரடியாகக் காட்டுகிறது; பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன.
- source_word: בְּקֶבֶר מָנוֹחַ אָבִיו
  choice: அவனுடைய தந்தை மனோவாவின் கல்லறையில்
  rationale: קבר என்பதற்கு இக்குடும்ப அடக்கச் சூழலில் ‘கல்லறை’ இயல்பானது; ‘அவனுடைய தந்தை’ என்ற விளக்கமும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְהוּא שָׁפַט אֶת־יִשְׂרָאֵל
  choice: அவன் இஸ்ரவேலை ... நியாயந்தீர்த்தான்
  rationale: நியாயாதிபதிகள் நூலில் שפט திரும்பத் திரும்ப வரும் நீதித்தலைவர்/விடுவிப்பவர் பணிக்கான சொல்; ‘ஆட்சி செய்தான்’ போன்ற விளக்கமளிக்கும் மாற்றத்தைவிட நூலின் சொல் தொடர்பை இது காக்கிறது.
- source_word: עֶשְׂרִים שָׁנָה
  choice: இருபது ஆண்டுகள்
  rationale: எண் மற்றும் காலப் பெயரின் நேரடியான தமிழ் மொழிபெயர்ப்பு.
theological_decisions:
- issue: சிம்சோனின் நீதித்தலைவர் பணிக்காலத்தை முடிவாகச் சுருக்கிக் கூறுதல்
  choice: அவன் இஸ்ரவேலை இருபது ஆண்டுகள் நியாயந்தீர்த்தான்
  alternative: அவன் இஸ்ரவேலை இருபது ஆண்டுகள் நியாயந்தீர்த்திருந்தான்
  rationale: அடக்கக் குறிப்புக்குப் பின் வரும் எபிரெய வினை வடிவை எளிய இறந்தகால முடிவுச் சுருக்கமாகவும், அதற்கு முன்பே நிறைவுற்ற செயலைத் திரும்பிப் பார்க்கும் வடிவமாகவும் புரிந்துகொள்ள முடியும். நூலில் திரும்ப வரும் முடிவுச் சூத்திரத்துடன் தொடர்பைக் காக்க முதன்மை உரையில் எளிய இறந்தகாலம் வைக்கப்பட்டு, காலநிலைத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நியாயந்தீர்த்தான்’ என்பது இன்றைய பேச்சில் குறைவாக இருந்தாலும், நியாயாதிபதிகள் நூலின் முக்கிய சொல் தொடர்பையும் சிம்சோனின் பணிப் பதற்றத்தையும் காக்கத் தேர்ந்தெடுக்கப்பட்டது.
