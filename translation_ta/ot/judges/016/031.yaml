  source_fidelity: 'The Tamil accurately represents all principal Hebrew clauses: the brothers and entire paternal household descend, carry Samson, go up, bury him between Zorah and Eshtaol in Manoah''s grave, and the concluding statement says that he judged Israel for twenty years. The directional sequence is retained, and the alternative retrospective force of the final perfect is appropriately preserved in the footnote.'
