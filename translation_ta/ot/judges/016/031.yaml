  terminology: “நியாயந்தீர்த்தான்” appropriately preserves the recurrent Judges terminology for שפט without prematurely narrowing it to political rule. “குடும்பத்தார் அனைவரும்” conveys the paternal household idiom well. The place names and Manoah’s name are acceptable Tamil transliterations.
