translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. שׂחק/צחק என்பவற்றில் உள்ள பொழுதுபோக்கு–கேலி–நிகழ்ச்சி என்ற உண்மையான பொருள் விரிவை அடிக்குறிப்பு காக்கிறது; முதன்மை உரையில் ‘வேடிக்கை காட்டுதல்’ என்ற இயல்பான தொடரால் இரு பயன்பாடுகளுக்கும் தொடர்பு பேணப்பட்டுள்ளது.
