base_translation:
  language: en
  yaml_path: translation/ot/judges/016/025.yaml
  text: And when their hearts were merry[a], they said, “Call for Samson, so that he may entertain us.” So they called for Samson from the prison house, and he entertained them[b]. And they made him stand between the pillars.
translation:
  language: ta
  text: அவர்கள் மனம் களித்திருந்தபோது, “சிம்சோனை அழைத்து வாருங்கள்; அவன் நமக்கு வேடிக்கை காட்டட்டும்[a]” என்றார்கள். எனவே, அவர்கள் சிறைச்சாலையிலிருந்து[b] சிம்சோனை அழைத்து வந்தார்கள்; அவன் அவர்களுக்கு முன்பாக வேடிக்கை காட்டினான். பின்பு அவர்கள் அவனைத் தூண்களுக்கு நடுவே நிற்க வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் நமக்காக நிகழ்ச்சி நடத்தட்டும்,” அல்லது “அவனை வைத்து நாம் கேளிக்கை அடைவோம்.” எபிரெய வினைச்சொல் பொழுதுபோக்கு, கேலி அல்லது பொதுநிகழ்ச்சி ஆகியவற்றைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “கைதிகளின் வீட்டிலிருந்து”; அதாவது, சிறைச்சாலையிலிருந்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי טוֹב לִבָּם
  choice: அவர்கள் மனம் களித்திருந்தபோது
  rationale: ‘அவர்களுடைய இருதயம் நன்றாயிருந்தது’ என்ற எபிரெயச் சொற்றொடர் மகிழ்ச்சியான அல்லது களிப்பான மனநிலையைக் குறிக்கிறது. எபிரெய உருவகத்தின் அடிப்படை உணர்வை இயல்பான நவீனத் தமிழில் இது தருகிறது.
- source_word: קִרְאוּ לְשִׁמְשׁוֹן
  choice: சிம்சோனை அழைத்து வாருங்கள்
  rationale: קרא என்பதுடன் ל சேர்ந்துள்ள இக்கட்டளை ஒருவரை வரவழைப்பதைக் குறிக்கிறது. சூழலில் சிம்சோன் சிறையிலிருந்து கொண்டுவரப்படுவதால், ‘அழைத்து வாருங்கள்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וִישַׂחֶק לָנוּ
  choice: அவன் நமக்கு வேடிக்கை காட்டட்டும்
  rationale: שׂחק இங்கு மக்களை மகிழ்வித்தல், அவர்கள் முன்னிலையில் நிகழ்த்துதல், அல்லது கேலிக்குரிய விளையாட்டுப் பொருளாதல் ஆகிய நிழற்பொருள்களைக் கொண்டிருக்கலாம். ‘வேடிக்கை காட்டட்டும்’ என்பது திட்டமிட்டு நிகழ்த்தும் பொழுதுபோக்கையும் அவமானகரமான காட்சியையும் முற்றிலும் பிரித்துத் தீர்மானிக்காமல் விடுகிறது.
- source_word: מִבֵּית הָאֲסִירִים
  choice: சிறைச்சாலையிலிருந்து
  rationale: சொல்லர்த்தமாக ‘கைதிகளின் வீட்டிலிருந்து’ என்பதைக் குறிக்கும் இந்த எபிரெயச் சொற்றொடரின் இயல்பான தமிழ் இணை ‘சிறைச்சாலையிலிருந்து’ என்பதாகும்.
- source_word: וַיְצַחֵק לִפְנֵיהֶם
  choice: அவன் அவர்களுக்கு முன்பாக வேடிக்கை காட்டினான்
  rationale: צחק இச்சூழலில் பொதுமக்கள் முன்னிலையில் மகிழ்விக்கும் நிகழ்ச்சியையோ கேலிக்குரிய காட்சியையோ குறிக்கலாம். ‘அவர்களுக்கு முன்பாக’ என்பது לִפְנֵיהֶם என்பதையும், ‘வேடிக்கை காட்டினான்’ என்பது முந்தைய வேண்டுகோளுடனான சொற்பொருள் தொடர்பையும் காக்கிறது.
- source_word: וַיַּעֲמִידוּ אוֹתוֹ בֵּין הָעַמּוּדִים
  choice: அவர்கள் அவனைத் தூண்களுக்கு நடுவே நிற்க வைத்தார்கள்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் ‘நிற்கச் செய்தல்’ என்ற காரணவினைப் பொருளைக் கொண்டது. ‘நிற்க வைத்தார்கள்’ என்பது சிம்சோன் மீது அவர்கள் செலுத்திய கட்டுப்பாட்டைத் தெளிவாகக் காட்டுகிறது.
