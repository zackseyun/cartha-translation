  text: לַֽ/עַזָּתִ֣ים לֵ/אמֹ֗ר בָּ֤א שִׁמְשׁוֹן֙ הֵ֔נָּה וַ/יָּסֹ֛בּוּ וַ/יֶּאֶרְבוּ ל֥/וֹ כָל הַ/לַּ֖יְלָה בְּ/שַׁ֣עַר הָ/עִ֑יר וַ/יִּתְחָרְשׁ֤וּ כָל הַ/לַּ֨יְלָה֙ לֵ/אמֹ֔ר עַד א֥וֹר הַ/בֹּ֖קֶר וַ/הֲרְגְנֻֽ/הוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/002.yaml
  text: The Gazites were told[a], saying, “Samson has come here.” So they surrounded him and lay in wait for him all night at the city gate. They kept quiet all night, saying, “Until the light of morning[c][b], then we will kill him.”
translation:
  language: ta
  text: 'காசா நகரத்தாருக்குச் செய்தி தெரிவிக்கப்பட்டது[a]: “சிம்சோன் இங்கே வந்திருக்கிறான்.” எனவே அவர்கள் சுற்றி வந்து[b], நகர வாசலில் இரவு முழுவதும் அவனுக்காகப் பதுங்கிக் காத்திருந்தார்கள். அவர்கள் இரவு முழுவதும் அமைதியாக இருந்தார்கள். “காலை வெளிச்சம் வரும்வரை[d] காத்திருப்போம்; பிறகு அவனைக் கொன்றுவிடுவோம்” என்று கூறினர்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காசா மக்களுக்குச் சொல்லப்பட்டது.”
    reason: எபிரெய மொழியின் சுருக்கமான அறிக்கை அமைப்புக்கான மாற்று மொழிபெயர்ப்பு.
  - marker: b
    text: எபிரெயத்தில் “சுற்றி வந்தார்கள்” என்ற வினைக்குச் செயப்படுபொருள் வெளிப்படையாக இல்லை; இது சிம்சோனையோ, அவன் இருந்த இடத்தையோ சுற்றிவளைத்ததைக் குறிக்கலாம்.
    reason: மூலமொழியில் உள்ள இலக்கணத் தெளிவின்மையைப் பாதுகாத்தல்.
  - marker: c
    text: அல்லது, “ஓசையின்றி இருந்தார்கள்” அல்லது “அசையாமல் இருந்தார்கள்”; பதுங்கிக் காத்திருந்தபோது அமைதியாக இருந்ததை எபிரெயச் சொல் உணர்த்துகிறது.
    reason: சூழலுக்குப் பொருந்தும் சொற்பொருள் மாற்றுகளைச் சுட்டுதல்.
  - marker: d
    text: 'சொல்லுக்குச் சொல்: “காலையின் வெளிச்சம் வரும்வரை.”'
    reason: மூல எபிரெயத்தின் உருவகமிக்க சொற்றொடரைச் சுட்டுதல்.
lexical_decisions:
- source_word: לַעַזָּתִים
  choice: காசா நகரத்தாருக்கு
  rationale: காசாவில் வசிப்பவர்களைக் குறிக்கும் பன்மை இன/இடப்பெயர். நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: לֵאמֹר
  choice: செய்தி தெரிவிக்கப்பட்டது
  rationale: எபிரெய உரையில் முற்றுவினை வெளிப்படையாக இல்லாமல் ‘சொல்லும்படி/சொல்லி’ என்ற அமைப்பு வருகிறது. சூழலில் சிம்சோனின் வருகை காசா மக்களுக்குத் தெரிவிக்கப்பட்டது என்பதே இயல்பான பொருள்.
- source_word: בָּא ... הֵנָּה
  choice: இங்கே வந்திருக்கிறான்
  rationale: நிகழ்ந்த வருகையைத் தற்போதைய தொடர்புடைய உண்மையாக அறிவிக்கும் எபிரெய நிறைவுவினையின் நுணுக்கத்தை இது காட்டுகிறது.
- source_word: וַיָּסֹבּוּ
  choice: அவனைச் சுற்றிவளைத்து
  rationale: வினைச்சொல் சுற்றிச் செல்லுதல் அல்லது சுற்றிவளைத்தல் எனப் பொருள்படும். பதுங்கித் தாக்கும் சூழலில் ‘சுற்றிவளைத்து’ பொருத்தமானது; ஆனால் எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை என்பதால் அடிக்குறிப்பில் அது குறிப்பிடப்பட்டுள்ளது.
- source_word: וַיֶּאֶרְבוּ לוֹ
  choice: அவனுக்காகப் பதுங்கிக் காத்திருந்தார்கள்
  rationale: לֹו உடன் வரும் ארב, ஒருவரைத் தாக்குவதற்காக மறைந்து காத்திருப்பதைக் குறிக்கிறது.
- source_word: בְּשַׁעַר הָעִיר
  choice: நகர வாசலில்
  rationale: பண்டைய நகரின் நுழைவு-வெளியேற்றப் பகுதியான வாசலைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: וַיִּתְחָרְשׁוּ
  choice: அமைதியாக இருந்து
  rationale: பதுங்கியிருப்போர் ஓசையின்றி அல்லது அசைவின்றி இருப்பதை இவ்வினை சூழலில் குறிக்கிறது. இரு சாத்தியங்களையும் அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: காலை வெளிச்சம் வரும்வரை
  rationale: ‘காலையின் வெளிச்சம் வரும்வரை’ என்ற மூல உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: וַהֲרַגְנֻהוּ
  choice: பிறகு அவனைக் கொன்றுவிடுவோம்
  rationale: முதல் நபர் பன்மை வினையையும் ஆண்பால் ஒருமை செயப்படுபொருளையும் நேரடியாகக் காட்டுகிறது; ‘பிறகு’ என்பது சூழலிலுள்ள கால வரிசையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
