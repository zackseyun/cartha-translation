id: JDG.16.23
reference: Judges 16:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/סַרְנֵ֣י פְלִשְׁתִּ֗ים נֶֽאֱסְפוּ֙ לִ/זְבֹּ֧חַ זֶֽבַח גָּד֛וֹל לְ/דָג֥וֹן אֱלֹהֵי/הֶ֖ם וּ/לְ/שִׂמְחָ֑ה וַ/יֹּ֣אמְר֔וּ נָתַ֤ן אֱלֹהֵ֨י/נוּ֙ בְּ/יָדֵ֔/נוּ אֵ֖ת שִׁמְשׁ֥וֹן אוֹיְבֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/023.yaml
  text: The rulers of the Philistines gathered to offer a great sacrifice to Dagon their god and to celebrate[a], and they said[b], “Our god has given Samson our enemy into our hand.”
translation:
  language: ta
  text: பெலிஸ்தியரின் ஆட்சியாளர்கள்[a] தங்கள் தெய்வமான தாகோனுக்குப் பெரிய பலி செலுத்தவும் கொண்டாடவும் ஒன்றுகூடினார்கள். அவர்கள், “நம் தெய்வம் நம் பகைவனான சிம்சோனை நம் கையில் ஒப்படைத்திருக்கிறது[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “பெலிஸ்தியரின் அதிபதிகள்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “நம் கையில்”; இது நம் அதிகாரத்திற்குள் அல்லது கட்டுப்பாட்டிற்குள் என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי
  choice: ஆட்சியாளர்கள்
  rationale: பெலிஸ்திய நகர-அரசுகளின் தலைமை அதிகாரிகளைக் குறிக்கும் சொல்லை, இன்றைய வாசகர்களுக்குத் தெளிவாகவும் அவர்களது ஆளும் நிலையை வெளிப்படுத்துமாறும் மொழிபெயர்க்கிறது.
- source_word: נֶאֱסְפוּ
  choice: ஒன்றுகூடினார்கள்
  rationale: ஒரு குழுவாக ஓரிடத்தில் கூடிவந்ததைக் குறிக்கும் எபிரெய வினையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לִזְבֹּחַ זֶבַח גָּדוֹל
  choice: பெரிய பலி செலுத்த
  rationale: மூலத்தில் ஒரே வேர்ச்சொல்லைக் கொண்டு வரும் வினை-பெயர்ச்சொல் அமைப்பின் வலியுறுத்தலை, தமிழில் செயற்கையான மறுபதிப்பு இல்லாமல் இயல்பாகத் தருகிறது.
- source_word: לְדָגוֹן אֱלֹהֵיהֶם
  choice: தங்கள் தெய்வமான தாகோனுக்கு
  rationale: பலி யாருக்குச் செலுத்தப்பட்டது என்பதையும், தாகோன் பெலிஸ்தியரின் தெய்வம் என்பதையும் தெளிவாகக் காட்டுகிறது.
- source_word: וּלְשִׂמְחָה
  choice: கொண்டாடவும்
  rationale: வெற்றியை முன்னிட்டு மகிழ்ச்சியுடன் விழாக் கொண்டாடுவதைக் குறிக்கும் சூழல்சார் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: நம் கையில் ஒப்படைத்திருக்கிறது
  rationale: ஒருவரை மற்றவரின் அதிகாரத்துக்குள் ஒப்படைத்தல் என்ற பொருளையும், எபிரெய மொழியின் ‘கையில்’ என்ற உருவகத்தையும் பாதுகாக்கிறது.
- source_word: שִׁמְשׁוֹן
  choice: சிம்சோன்
  rationale: தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: אוֹיְבֵינוּ
  choice: நம் பகைவனான
  rationale: சொல் வடிவத்தில் பன்மைத் தோற்றம் இருந்தாலும் இங்கு சிம்சோன் என்ற ஒரே நபரைக் குறிப்பதால் ஒருமையாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: அந்நியத் தெய்வச் சூழலில் אֱלֹהֵיהֶם / אֱלֹהֵינוּ என்பவற்றின் எண்ணிக்கை
  choice: தெய்வம் / நம் தெய்வம்
  alternative: தெய்வங்கள் / நம் தெய்வங்கள்
  rationale: இரு இடங்களிலும் உடனடிச் சூழல் பெயரிட்டு குறிப்பிடப்பட்ட தாகோன் என்ற ஒரே தெய்வத்தைச் சுட்டுவதால் ஒருமைத் தொடரே பொருத்தமானது; உரையில் இல்லாத பன்மையை இது புகுத்துவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டுள்ளது. தொடக்க וְ தனியான காலச்சுட்டுச் சொல்லாக விரிவாக்கப்படாமல், தமிழ் உரையின் இயல்பான தொடர்ச்சிக்குள் விடப்பட்டுள்ளது. ‘தாகோன்’ மற்றும் ‘சிம்சோன்’ ஆகிய பெயர்கள் நிலைபெற்ற தமிழ் வேதாகம வழக்கைத் தொடர்கின்றன.
