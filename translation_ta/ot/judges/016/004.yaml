base_translation:
  language: en
  yaml_path: translation/ot/judges/016/004.yaml
  text: After this[a], he loved a woman in the Valley of Sorek, and her name was Delilah.
translation:
  language: ta
  text: இதற்குப் பிறகு, சோரேக் பள்ளத்தாக்கில்[a] ஒரு பெண்ணை அவன் நேசித்தான். அவள் பெயர் தெலீலாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சோரேக் ஓடைப்பகுதியில்.’ எபிரெயச் சொல் பள்ளத்தாக்கு, ஓடைப்படுகை அல்லது பருவகால நீரோடையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: இதற்குப் பிறகு
  rationale: எபிரெயக் கதைநடைத் தொடரின் காலவரிசையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; சொல்லுக்குச் சொல் வரும் ‘இது நடந்தது’ என்பதைக் கட்டாயமாகச் சேர்க்கவில்லை.
- source_word: וַיֶּאֱהַב
  choice: நேசித்தான்
  rationale: אָהַב என்பதன் நேரடியான பொருளைத் தக்கவைத்து, ‘காதலில் விழுந்தான்’ போன்ற கூடுதல் காதல் நுணுக்கத்தைச் சேர்க்காமல் உள்ளது.
- source_word: אִשָּׁה
  choice: ஒரு பெண்ணை
  rationale: இங்கு திருமண உறவு குறிப்பிடப்படாததால், ‘மனைவி’ என்பதைவிட நடுநிலையான ‘பெண்’ பொருத்தமானது.
- source_word: בְּנַחַל שֹׂרֵק
  choice: சோரேக் பள்ளத்தாக்கில்
  rationale: נַחַל என்பது பள்ளத்தாக்கு, ஓடைப்படுகை அல்லது பருவகால நீரோடை எனப் பொருள்படலாம். முதன்மை உரையில் இயல்பான புவியியல் சொல்லாக ‘பள்ளத்தாக்கு’ பயன்படுத்தப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּשְׁמָהּ
  choice: அவள் பெயர்
  rationale: பெண்ணின் பெயரை அறிமுகப்படுத்தும் எபிரெயக் கூற்றைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: דְּלִילָה
  choice: தெலீலாள்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்; மூலப்பெயரின் ஒலியையும் அடையாளத்தையும் தக்கவைக்கிறது.
