- from: இதற்குப் பிறகு, சோரேக் பள்ளத்தாக்கில்[a] இருந்த ஒரு பெண்ணை அவன் நேசித்தான். அவள் பெயர் தெலீலாள்.
  to: இதற்குப் பிறகு, சோரேக் பள்ளத்தாக்கில்[a] ஒரு பெண்ணை அவன் நேசித்தான். அவள் பெயர் தெலீலாள்.
