translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை. ‘அவன்’ என்பது முந்தைய சூழலில் உள்ள சிம்சோனைக் குறிக்கும்; மூலத்தில் பெயர் இவ்வசனத்தில் மீண்டும் சொல்லப்படாததால் அதே அமைப்பு காக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு தொடர்புடைய புவியியல் சொல்லுக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
