base_translation:
  language: en
  yaml_path: translation/ot/judges/016/005.yaml
  text: Then the lords of the Philistines came up to her and said to her[a], “Entice him, and see in what his great strength lies, and by what means we may prevail against him, so that we may bind him to afflict him; and we will each give you eleven hundred pieces of silver.”
translation:
  language: ta
  text: அப்போது பெலிஸ்தியர்களின் ஆட்சியாளர்கள் அவளிடம் வந்து, “அவனை மயக்கி, அவனுடைய பெரும் வலிமை எதில் இருக்கிறது என்பதையும், எந்த வழியில் நாம் அவனை வென்று, அவனைத் துன்புறுத்துவதற்காகக் கட்ட முடியும் என்பதையும் கண்டுபிடி. நாங்கள் ஒவ்வொருவரும் உனக்கு ஆயிரத்து நூறு வெள்ளி தருவோம்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “ஆயிரத்து நூறு வெள்ளி.” இது ஒவ்வொரு பெலிஸ்திய ஆட்சியாளரும் கொடுக்கும் ஆயிரத்து நூறு வெள்ளித் துண்டுகளையோ வெள்ளிச் சேக்கல்களையோ குறித்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: அவளிடம் வந்து
  rationale: עלה אל என்பதன் ஒருவரை நோக்கிய இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது; இங்கு ‘மேலே’ என்ற திசையைச் சொல்லத் தேவையில்லை.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: பெலிஸ்தியர்களின் ஆட்சியாளர்கள்
  rationale: סרן என்பது பெலிஸ்திய நகர-ஆட்சியாளர்களுக்குரிய பதவி; ‘ஆட்சியாளர்கள்’ என்பது நவீன வாசகருக்குத் தெளிவாகவும் வரலாற்றுச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: פַּתִּי
  choice: ஆசைகாட்டி மயக்கி
  rationale: பியேல் கட்டளைவடிவம் ஏமாற்றும் நோக்குடன் ஒருவரைக் கவர்ந்து இணங்கச் செய்வதைக் குறிக்கிறது; பாலியல் பொருளைத் தேவையின்றி சேர்க்காமல் சூழலின் சூழ்ச்சியை வெளிப்படுத்துகிறது.
- source_word: וּרְאִי בַּמֶּה כֹּחוֹ גָדוֹל
  choice: அவனுடைய பெரும் வலிமை எதில் இருக்கிறது என்றும் ... கண்டுபிடி
  rationale: במה வலிமையின் அடிப்படை அல்லது இரகசியத்தை விசாரிக்கிறது; ‘எதில் இருக்கிறது’ என்பது மூலத்தின் உருவகத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: וּבַמֶּה נוּכַל לוֹ
  choice: எப்படி நாங்கள் அவனை வென்று
  rationale: יכל ל என்பது ஒருவருக்கு எதிராக மேலோங்கி வெல்வதைக் குறிக்கும்; ‘வென்று’ பகைமைச் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַאֲסַרְנֻהוּ
  choice: கட்டி
  rationale: אסר என்பதன் அடிப்படைப் பொருளான கட்டுதல் அல்லது பிணைத்தலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: לְעַנֹּתוֹ
  choice: துன்புறுத்த
  rationale: ענה பியேல் வடிவத்தின் துன்பம் விளைவித்தல், ஒடுக்குதல் என்ற பரந்த பொருளைத் தக்கவைக்கிறது; ‘அடக்குதல்’ அல்லது ‘அவமானப்படுத்துதல்’ எனக் குறுக்கவில்லை.
- source_word: וַאֲנַחְנוּ נִתַּן לָךְ אִישׁ אֶלֶף וּמֵאָה כָּסֶף
  choice: நாங்கள் ஒவ்வொருவரும் உனக்கு ஆயிரத்து நூறு வெள்ளி கொடுப்போம்
  rationale: איש இங்கு பகிர்வுப் பொருளில் ‘ஒவ்வொருவரும்’ என வருகிறது. மூலத்தில் எடை அல்லது நாணய அலகு வெளிப்படையாக இல்லாததால் ‘சேக்கல்’ என்பதை முதன்மை உரையில் சேர்க்காமல் ‘வெள்ளி’ என வைத்திருக்கிறது.
