  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்தியுள்ளது. சூழ்ச்சியின் பொருளைத் தெளிவாக்கினாலும், மூலத்தில் இல்லாத பாலியல் குறிப்பையோ குறிப்பிட்ட நாணய அலகையோ முதன்மை உரையில் சேர்க்கவில்லை.
