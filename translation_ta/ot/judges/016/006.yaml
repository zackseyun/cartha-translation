  text: וַ/תֹּ֤אמֶר דְּלִילָה֙ אֶל שִׁמְשׁ֔וֹן הַגִּֽידָ/ה נָּ֣א לִ֔/י בַּ/מֶּ֖ה כֹּחֲ/ךָ֣ גָד֑וֹל וּ/בַ/מֶּ֥ה תֵאָסֵ֖ר לְ/עַנּוֹתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/006.yaml
  text: Then Delilah said to Samson[a], “Please tell me where your great strength lies, and how you could be bound to afflict you.”
translation:
  language: ta
  text: அப்போது தெலீலாள் சிம்சோனிடம், “உமது பெரும் வலிமை எதில் இருக்கிறது என்பதையும், எவ்வாறு உம்மைக் கட்டி உம்மைத் துன்புறுத்த முடியும் என்பதையும் தயவுசெய்து எனக்குச் சொல்லும்” என்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: அப்போது ... என்றாள்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழ் கதைநடையில் ‘அப்போது’ இயல்பாகத் தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: דְּלִילָה
  choice: தெலீலாள்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: אֶל שִׁמְשׁוֹן
  choice: சிம்சோனிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான தமிழில் குறிக்கிறது; சிம்சோன் என்பது வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: הַגִּידָה נָּא לִי
  choice: தயவுசெய்து எனக்குச் சொல்லும்
  rationale: הגיד என்பதன் ‘சொல்/அறிவி’ என்ற பொருளையும், נא தரும் வேண்டுகோள் நயத்தையும் காக்கிறது. சூழலுக்கேற்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: உமது பெரும் வலிமை எதில் இருக்கிறது
  rationale: במה என்பதன் ‘எதில்’ என்ற கேள்வியையும், כחך גדול என்பதன் ‘உமது பெரும் வலிமை’ என்ற பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וּבַמֶּה תֵאָסֵר
  choice: எப்படி உம்மைக் கட்ட முடியும்
  rationale: இரண்டாவது במה இங்கு வழிமுறையை விசாரிப்பதால் ‘எப்படி’ இயல்பானது; אסר என்பதன் நிபால் வடிவமான ‘கட்டப்படுதல்’ தமிழில் செயப்பாட்டுப் பொருளை இயல்பாக வெளிப்படுத்தும் வகையில் அமைக்கப்பட்டுள்ளது.
- source_word: לְעַנּוֹתֶךָ
  choice: உம்மைத் துன்புறுத்துவதற்காக
  rationale: ענה பியேல் வடிவத்தின் அடிப்படைப் பொருளான ‘துன்புறுத்து/ஒடுக்கு/தாழ்த்திவிடு’ என்பதில் ‘துன்புறுத்து’ மூலத்தின் கடின நயத்தை காக்கிறது; சூழலில் ‘அடக்கி மேற்கொள்’ என்ற பொருளும் சாத்தியமாதலால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
