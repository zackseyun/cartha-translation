translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான மற்றும் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தெலீலாள் சிம்சோனை நோக்கிப் பேசுவதால் ‘உமது/உம்மை/சொல்லும்’ என்ற மரியாதை ஒருமை தொடர்ந்து பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள לְעַנּוֹתֶךָ என்பதன் பொருள் விரிவை முதன்மை உரை மற்றும் அடிக்குறிப்பு இணைந்து பாதுகாக்கின்றன.
