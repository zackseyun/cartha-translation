base_translation:
  language: en
  yaml_path: translation/ot/judges/016/003.yaml
  text: And Samson lay until midnight[a]. Then he arose at midnight and seized the doors of the city gate and the two doorposts, and pulled them up with the bar[b]; he put them on his shoulders and carried them up to the top of the hill that is opposite Hebron.
translation:
  language: ta
  text: சிம்சோன் நள்ளிரவுவரை படுத்திருந்தான். நள்ளிரவில் அவன் எழுந்து, நகர வாசலின் கதவுகளையும் அதன் இரண்டு நிலைக்கால்களையும் பற்றிப் பிடித்து, தாழ்ப்பாளோடு அவற்றைப் பெயர்த்தெடுத்தான்[a]. அவற்றைத் தன் தோள்களின் மேல் வைத்துக்கொண்டு, எபிரோனுக்கு எதிரே உள்ள மலையின் உச்சிக்குச் சுமந்துகொண்டு போனான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாழ்ப்பாளோடு அவற்றைப் பிடுங்கியெடுத்தான்.” எபிரெய வினைச்சொல், ஒன்றைப் பொருத்தப்பட்ட இடத்திலிருந்து பெயர்த்து அல்லது வேரோடு பிடுங்கி அகற்றுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எபிரோனை நோக்கியிருந்த மலையின் உச்சிக்கு.” எபிரெய மரபுத்தொடரின் சொல்லுக்குச் சொல் பொருள், “எபிரோனின் முகத்திற்கு முன்பாக” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: படுத்திருந்தான்
  rationale: שׁכב என்பது இங்கு படுத்திருப்பதைக் குறிக்கிறது; அவன் உறங்கினான் என்று மூலத்தில் இல்லாத தகவலைச் சேர்க்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: עַד חֲצִי הַלַּיְלָה / בַּחֲצִי הַלַּיְלָה
  choice: நள்ளிரவுவரை / நள்ளிரவில்
  rationale: ‘இரவின் பாதி’ என்ற எபிரெயச் சொல்லமைப்புக்குத் தெளிவான, இயல்பான நவீனத் தமிழ் இணை.
- source_word: וַיֶּאֱחֹז
  choice: பற்றிப் பிடித்து
  rationale: வலுவாகப் பிடிக்கும் செயலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: דַּלְתוֹת שַׁעַר הָעִיר
  choice: நகர வாசலின் கதவுகள்
  rationale: நகர நுழைவாயிலின் இரட்டை வாயிற்கதவுகளைக் குறிக்கும் கட்டடக்கலைச் சொல்லை வாசகர்களுக்குப் புரியும் தமிழில் தருகிறது.
- source_word: וּבִשְׁתֵּי הַמְּזוּזוֹת
  choice: அதன் இரண்டு நிலைக்கால்கள்
  rationale: מְזוּזוֹת என்பது வாசலின் இருபுறச் செங்குத்துத் தூண்கள் அல்லது கதவு நிலைக்கால்களைக் குறிக்கிறது; ‘நிலைக்கால்கள்’ இங்கு துல்லியமான தமிழ் கட்டடக்கலைச் சொல்.
- source_word: וַיִּסָּעֵם עִם הַבְּרִיחַ
  choice: தாழ்ப்பாளோடு அவற்றைப் பெயர்த்தெடுத்தான்
  rationale: נסע இச்சூழலில் பொருத்தப்பட்ட இடத்திலிருந்து பிடுங்கி அல்லது பெயர்த்து அகற்றுவதைக் குறிக்கிறது; עִם הַבְּרִיחַ தாழ்ப்பாளும் அவற்றோடு எடுத்துச் செல்லப்பட்டதைத் தெரிவிக்கிறது.
- source_word: וַיָּשֶׂם עַל כְּתֵפָיו
  choice: அவற்றைத் தன் தோள்கள்மேல் வைத்துக்கொண்டு
  rationale: சுமையை இரு தோள்கள்மேல் வைத்த செயலை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיַּעֲלֵם
  choice: சுமந்துகொண்டு போனான்
  rationale: முந்தைய சொற்றொடரில் அவற்றைத் தோள்கள்மேல் வைத்ததாகக் கூறப்படுவதால், மேல்நோக்கிச் சுமந்து சென்ற செயலைச் சூழலுக்கேற்றவாறு வெளிப்படுத்துகிறது.
- source_word: אֶל רֹאשׁ הָהָר
  choice: மலையின் உச்சிக்கு
  rationale: רֹאשׁ என்பது இங்கு உச்சியையும் הַר என்பது மலை அல்லது குன்றையும் குறிக்கிறது; ‘மலையின் உச்சி’ நேரடியான, கண்ணியமான தமிழ்.
- source_word: אֲשֶׁר עַל פְּנֵי חֶבְרוֹן
  choice: எப்ரோனுக்கு எதிரே இருந்த
  rationale: עַל־פְּנֵי என்ற இடவியல் மரபுத்தொடர் ‘எதிரே’ அல்லது ‘நோக்கியவாறு’ என்ற பொருளைத் தருகிறது; தேவையற்ற புவியியல் துல்லியத்தைச் சேர்க்காமல் உறவைப் பாதுகாக்கிறது.
