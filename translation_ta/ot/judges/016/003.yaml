translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தொடர் செயல்கள் தெளிவாக இணைக்கப்பட்டுள்ளன; ‘படுத்திருந்தான்’ என்பது உறங்கியதாக மிகைப்படுத்தாமல் மூலத்தின் பொருள் பரப்பைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
