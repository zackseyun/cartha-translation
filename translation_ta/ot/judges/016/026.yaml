translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான கதையாடல் நடையில் மொழிபெயர்க்கப்பட்டது. ‘வீடு’ என்பதற்குப் பதிலாக இச்சூழலில் பெரிய கூடம் அல்லது ஆலயக் கட்டமைப்பைக் குறிக்கும் இயல்பான ‘கட்டிடம்’ பயன்படுத்தப்பட்டது; சிம்சோனின் மறைநோக்கம் வசனத்தில் முன்கூட்டியே சேர்க்கப்படவில்லை.
