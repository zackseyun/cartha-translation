  text: Then Samson said to the young man who was holding his hand, “Let me rest, and guide me to the pillars on which the house stands, so that I may lean against them.”
translation:
  language: ta
  text: அப்போது சிம்சோன் தன் கையைப் பிடித்திருந்த இளைஞனிடம், “என்னை ஓய்வெடுக்க விடு; கட்டிடம் அவற்றின்மேல் நிலைத்திருக்கும் தூண்களை நான் தொட்டுணரும்படி செய்; அவற்றின்மேல் சாய்ந்துகொள்வேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנַּעַר
  choice: இளைஞன்
  rationale: இச்சொல் சிறுவனையோ இளைஞனையோ குறிக்கலாம்; சூழலில் சிம்சோனின் கையைப் பிடித்து வழிநடத்துபவனைக் குறிக்கும் இயல்பான பொதுச் சொல்.
- source_word: הַנִּיחָה אוֹתִי
  choice: நான் சற்றுச் சாய்ந்து ஓய்வெடுக்கும்படி
  rationale: הניח என்பது இங்கு ஓய்வெடுக்க விடுதல் என்ற பொருளைத் தருகிறது; அடுத்து வரும் தூண்கள்மேல் சாய்வதோடு இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: ו/הימש/ני
  choice: என்னை வழிநடத்து
  rationale: மசோரா உரையில் அசாதாரண எழுத்தாக்கம் இருந்தாலும், சூழலும் ஆங்கில ஆலோசனை உரையும் தூண்களிடம் அழைத்துச் செல்லுதல்/வழிநடத்துதல் என்ற பொருளை ஆதரிக்கின்றன.
- source_word: הָעַמֻּדִים אֲשֶׁר הַבַּיִת נָכוֹן עֲלֵיהֶם
  choice: இந்தக் கட்டிடம் நிற்க ஆதாரமாயுள்ள தூண்கள்
  rationale: נכון עליהם என்பதன் கட்டமைப்பு சார்ந்த பொருளைத் தெளிவாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: וְאֶשָּׁעֵן עֲלֵיהֶם
  choice: அவற்றின்மேல் சாய்ந்துகொள்கிறேன்
  rationale: சிம்சோன் கூறும் வெளிப்படையான நோக்கத்தை நேரடியாகப் பாதுகாக்கிறது.
