  text: וַ/יְהִ֗י אַחֲרֵי֙ מ֣וֹת יְהוֹשֻׁ֔עַ וַֽ/יִּשְׁאֲלוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/יהוָ֖ה לֵ/אמֹ֑ר מִ֣י יַעֲלֶה לָּ֧/נוּ אֶל הַֽ/כְּנַעֲנִ֛י בַּ/תְּחִלָּ֖ה לְ/הִלָּ֥חֶם בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/001.yaml
  text: And it happened after the death of Joshua that the sons of Israel asked Yahweh[a], saying[b], “Who will go up for us first against the Canaanites to fight against them?”
translation:
  language: ta
  text: யோசுவா இறந்தபின், இஸ்ரவேல் மக்கள் யாவேயிடம்[a], “எங்களுக்காகக் கானானியருக்கு[b] எதிராகப் போரிட முதலில் யார் ஏறிச் செல்வார்?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாவே’ என்பது எபிரெயில் יהוה (YHWH) என்று எழுதப்படும் இறைவனின் தனிப்பெயர்; அதன் பண்டைய உச்சரிப்பு துல்லியமாகத் தெரியவில்லை.
    reason: textual_cultural_clarification
  - marker: b
    text: எபிரெயில் ‘கானானியன்’ என்று ஒருமை வடிவில் இருந்தாலும், இங்கு அது கானானிய மக்களைக் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת יְהוֹשֻׁעַ
  choice: யோசுவா இறந்தபின்
  rationale: எபிரெயக் கதைத்தொடக்கத்தின் காலத் தொடர்பை இயல்பான நவீனத் தமிழில் தருகிறது; ‘அது நிகழ்ந்தது’ என்ற சொற்சொல் அமைப்பு தமிழில் தேவையற்ற கனத்தை ஏற்படுத்தும்.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுருவில் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது இஸ்ரவேல் சமூகத்தைக் குறிக்கும் மரபான இனக்குழுப் பெயர்; ‘இஸ்ரவேல் மக்கள்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַיִּשְׁאֲלוּ בַּיהוָה
  choice: யாவேயிடம் … கேட்டார்கள்
  rationale: שׁאל என்பது இங்கு வழிநடத்துதலை நாடிக் கேட்பதைக் குறிக்கிறது. ‘கேட்டார்கள்’ நேரடியானதும் சூழலில் போதுமானதும் ஆகும்; יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: எங்களுக்காக … யார் ஏறிச் செல்வார்?
  rationale: עלה என்பதிலுள்ள ‘மேலே/ஏறிச் செல்லுதல்’ என்ற உருவகத்தையும் இராணுவ முன்னேற்றத்தையும் அழிக்காமல் காக்கிறது; לָּנוּ என்பது ‘எங்களுக்காக’ என வழங்கப்பட்டுள்ளது.
- source_word: אֶל הַכְּנַעֲנִי
  choice: கானானியருக்கு எதிராக
  rationale: אֶל என்பதன் திசைநோக்குப் பொருள் இங்கு போர்ச் சூழலால் பகைநோக்காக அமைகிறது. ஒருமை வடிவிலுள்ள ‘கானானியன்’ கூட்டுப்பொருளில் இருப்பதால் தமிழில் மரியாதைப் பன்மை/கூட்டுப்பெயர் வடிவான ‘கானானியர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בַּתְּחִלָּה
  choice: முதலில்
  rationale: கோத்திரங்களில் யார் போருக்கு முன்செல்ல வேண்டும் என்ற வரிசையை இயல்பாகக் குறிக்கிறது.
- source_word: לְהִלָּחֶם בּוֹ
  choice: அவர்களுக்கு எதிராகப் போரிட
  rationale: לחם என்பதன் போரிடுதல் என்ற பொருளை நேரடியாகத் தருகிறது. எபிரெயில் பிரதிப்பெயர் ஒருமையில் இருந்தாலும் அது கூட்டொருமையான ‘கானானியன்’ என்பதைக் குறிக்கிறது; தமிழில் ‘கானானியர்’ என்பதுடன் பொருந்தும் வகையில் பொருள் வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பொதுப்பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளுள்ள உடன்படிக்கைத் தனிப்பெயர் நேரடியாக உள்ளது. அதனை மறைக்காமல், பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புக்கு நெருக்கமாக ‘யாவே’ என வழங்குகிறது; துல்லியமான பண்டைய உச்சரிப்பு உறுதியாக அறியப்படவில்லை என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- issue: ‘கானானியன்’ என்ற இலக்கண ஒருமையின் பொருள்
  choice: கானானியர் என்ற கூட்டுப்பொருள்
  alternative: கானானியன் என்ற தனிநபர் ஒருமை
  rationale: போரின் இலக்கும் அதனுடன் வரும் ஒருமைப் பிரதிப்பெயரும் ஓர் தனிநபரை அல்ல, கானானிய மக்களைக் கூட்டாகக் குறிக்கின்றன. தமிழ் வடிவம் அந்தக் கூட்டுப்பொருளை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. ‘ஏறிச் செல்வார்’ என்பது மூலத்தின் இயக்க உருவகத்தைப் பேணுகிறது; வாக்கியம் தமிழில் இயல்பாக இருக்க மேற்கோள் அமைப்பு மறுவரிசைப்படுத்தப்பட்டுள்ளது.
