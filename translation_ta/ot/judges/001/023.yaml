  yaml_path: translation/ot/judges/001/023.yaml
  text: And the house of Joseph spied out Bethel[a]; formerly the name of the city was Luz.
translation:
  language: ta
  text: யோசேப்பின் குடும்பத்தார் பெத்தேலை வேவுபார்த்தார்கள்[a]. முன்பு அந்த நகரத்தின் பெயர் லூஸ்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பெத்தேலை உளவறிந்து ஆராய்ந்தார்கள்.’ எபிரெய வினைச்சொல் இச்சூழலில் ஓர் இடத்தை வேவுபார்ப்பதையோ ஆராய்வதையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּתִירוּ
  choice: வேவுபார்த்தார்கள்
  rationale: இந்தச் சூழலில் படை நடவடிக்கைக்கு முன் ஓர் இடத்தை உளவறிந்து ஆராய்வதைக் குறிக்கிறது; ‘வேவுபார்த்தார்கள்’ என்பது இயல்பான, சுருக்கமான தமிழாக்கம்.
- source_word: בֵית יוֹסֵף
  choice: யோசேப்பின் குடும்பத்தார்
  rationale: யோசேப்புடன் தொடர்புடைய கோத்திரக் குழுவைக் குறிக்கும் எபிரெயச் சொல்லாட்சியை, அதன் சமூக வரம்பை மிகையாகத் தீர்மானிக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: בְּבֵית אֵל
  choice: பெத்தேலை
  rationale: முன்னுள்ள வினையுடன் சேர்ந்து வேவுபார்க்கப்பட்ட இடத்தைச் சுட்டுவதால் தமிழில் நேரடி செயப்படுபொருளாக வழங்கப்படுகிறது.
- source_word: וְשֵׁם הָעִיר
  choice: அந்த நகரத்தின் பெயர்
  rationale: எபிரெய அமைப்பைப் பாதுகாத்தபடியே தமிழில் இயல்பாக உள்ளது; முன்னர் குறிப்பிடப்பட்ட பெத்தேலை ‘அந்த நகரம்’ எனச் சுட்டுகிறது.
- source_word: לְפָנִים
  choice: முன்பு
  rationale: நகரத்தின் முந்தைய பெயரைச் சுட்டும் காலவினையடை; நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: לוּז
  choice: லூஸ்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
