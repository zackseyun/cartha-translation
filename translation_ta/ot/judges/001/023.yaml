  source_fidelity: வַיָּתִירוּ என்பதன் சூழல்சார் பொருளான வேவு/உளவாய்வு நன்கு தரப்பட்டுள்ளது. בֵית־יוֹסֵף என்ற கோத்திரச் சொல்லாட்சி ‘யோசேப்பின் குடும்பத்தார்’ என இயல்பாகக் கொடுக்கப்பட்டுள்ளது; இது தனிநபர் குடும்பத்தை மட்டும் குறிக்காமல் கூட்டுக் குழுவைக் குறிக்கும் வகையில் சூழலில் புரிகிறது. பெத்தேல் மற்றும் லூஸ் இடப்பெயர்களும், நகரத்தின் முந்தைய பெயரைக் குறிக்கும் לְפָנִים என்பதும் துல்லியமாக உள்ளன.
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் சுருக்கமாகவும் உள்ளது. ‘பெத்தேலை வேவுபார்த்தார்கள்’ என்பது படைச் சூழலுக்கு இயல்பான சொல்லாட்சி.
  terminology: ‘வேவுபார்த்தார்கள்’ என்பது உளவாய்வு/வேவு நடவடிக்கைக்குப் பொருத்தமானது. அடிக்குறிப்பில் உள்ள ‘உளவறிந்து ஆராய்ந்தார்கள்’ என்ற மாற்றுச் சொல்லாக்கம் மூல வினைச்சொல்லின் பொருள் வரம்பை வாசகருக்குத் தெளிவுபடுத்துகிறது. பெயர்கள் சீராக ஒலிபெயர்க்கப்பட்டுள்ளன.
