base_translation:
  language: en
  yaml_path: translation/ot/judges/001/010.yaml
  text: Then Judah went against the Canaanites living in Hebron (Hebron’s former name was Kiriath-arba)[a], and they struck down Sheshai, Ahiman[c][b], and Talmai.
translation:
  language: ta
  text: பின்பு யூதா, எப்ரோனில் குடியிருந்த கானானியருக்கு[a] எதிராகச் சென்றான். எப்ரோனின் முந்தைய பெயர் கிரியாத்-அர்பா.[b] அவர்கள் சேசாய், அகீமான், தல்மாய் ஆகியோரை முறியடித்தார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கானானியனுக்கு”; எபிரெயத்தில் ஒருமை வடிவம் உள்ளது; இங்கு அது கூட்டாகக் கானானிய மக்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எப்ரோன் முன்பு கிரியாத்-அர்பா என்று அழைக்கப்பட்டது.”
    reason: lexical_alternative
  - marker: c
    text: “முறியடித்தார்கள்” என்பதை “வீழ்த்தினார்கள்” அல்லது, இந்தப் போர்ச் சூழலில், “கொன்றார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: எதிராகச் சென்றான்
  rationale: הלך என்பதன் அடிப்படைப் பொருள் ‘சென்றான்’; இங்கு אֶל என்பதுடன் போர்ச் சூழலில் வருவதால் பகைவரை எதிர்த்துச் செல்லும் பொருள் வெளிப்படுகிறது. இயக்கத்தையும் எதிர்ப்புச் சூழலையும் இச்சொற்றொடர் காக்கிறது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: தனிப்பெயர் ஒருமையில் இருந்தாலும் இங்கு யூதா கோத்திரத்தைத் தொகுப்பாகக் குறிக்கிறது. எபிரெய வடிவுக்கு நெருக்கமாக ‘யூதா’ எனவே வைக்கப்பட்டுள்ளது.
- source_word: הַכְּנַעֲנִי
  choice: கானானியர்
  rationale: வடிவியல் அடிப்படையில் ஒருமை என்றாலும் ஒரு மக்கள் குழுவைக் குறிக்கும் தொகுப்பு ஒருமையாக இங்கு பயன்படுகிறது; இயல்பான தமிழில் ‘கானானியர்’ பொருத்தமானது.
- source_word: הַיּוֹשֵׁב בְּחֶבְרוֹן
  choice: எப்ரோனில் குடியிருந்த
  rationale: பங்கேற்பு வினை நிலையான குடியிருப்பைச் சுட்டுகிறது; ‘குடியிருந்த’ என்பது அந்த நீடித்த வசிப்பை இயல்பான தமிழில் தருகிறது.
- source_word: וְשֵׁם חֶבְרוֹן לְפָנִים
  choice: எப்ரோனின் முந்தைய பெயர்
  rationale: לְפָנִים இங்கு ‘முன்பு’ அல்லது ‘முந்தைய காலத்தில்’ எனப் பொருள்படுகிறது. தமிழில் இடப்பெயரின் முந்தைய பெயரைத் தெளிவாகக் கூறும் இயல்பான அமைப்பு இது.
- source_word: קִרְיַת אַרְבַּע
  choice: கிரியாத்-அர்பா
  rationale: இது இடப்பெயர் என்பதால் மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּכּוּ
  choice: முறியடித்தார்கள்
  rationale: נכה போர்ச் சூழலில் தாக்கி வீழ்த்துதல், தோற்கடித்தல், அல்லது கொல்லுதல் ஆகிய நுண்பொருட்களை ஏற்கலாம். மரணம் நிகழ்ந்தது என்று தேவையின்றி உறுதிப்படுத்தாமல் தீர்மானமான போர்வெற்றியை ‘முறியடித்தார்கள்’ வெளிப்படுத்துகிறது.
- source_word: שֵׁשַׁי וְאֶת אֲחִימַן וְאֶת תַּלְמָי
  choice: சேசாய், அகீமான், தல்மாய்
  rationale: இவை ஆட்களின் தனிப்பெயர்கள் என்பதால் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
