  register: நவீன பொதுத்தமிழில் தெளிவும் கண்ணியமும் காக்கப்பட்டுள்ளன. யூதா என்ற ஒருமைப் பெயரின் தொகுப்புப் பொருளைத் தொடர்ந்து வரும் ‘அவர்கள்’ வெளிப்படுத்துகிறது. விளக்கமான இடப்பெயர்க் குறிப்பு தனி வாக்கியமாக அமைக்கப்பட்டு வாசிப்புத் தெளிவு மேம்படுத்தப்பட்டுள்ளது.
