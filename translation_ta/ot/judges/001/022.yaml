source:
  edition: WLC
  text: וַ/יַּעֲל֧וּ בֵית יוֹסֵ֛ף גַּם הֵ֖ם בֵּֽית אֵ֑ל וַֽ/יהוָ֖ה עִמָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/022.yaml
  text: The house of Joseph also went up against Bethel[a], and Yahweh was with them.
translation:
  language: ta
  text: யோசேப்பின் குடும்பத்தாரும் பெத்தேலுக்கு எதிராகப் படையெடுத்துச் சென்றார்கள்[a]. யாவே அவர்களோடு இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெத்தேலுக்குச் சென்றார்கள்.” எபிரெய வினைச்சொல் சொற்சொல்லாக “மேலே சென்றார்கள்” என்று பொருள்படும்; ஆனால் இந்த இராணுவச் சூழலில், நகருக்கு எதிராக முன்னேறிச் சென்றதையே பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: எதிராகப் படையெடுத்துச் சென்றார்கள்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்’. இங்குள்ள இராணுவச் சூழலில் அது ஒரு நகருக்கு எதிராக முன்னேறிச் செல்வதைக் குறிக்கிறது. தேர்ந்த மொழிபெயர்ப்பு பகைமைச் சூழலைத் தெளிவாக்குவதோடு, அடிப்படை இயக்கப் பொருளையும் ஓரளவு காக்கிறது.
- source_word: בֵית יוֹסֵף
  choice: யோசேப்பின் குடும்பத்தார்
  rationale: இது யோசேப்புடன் தொடர்புடைய கோத்திரக் குழுவைக் குறிக்கும் மரபான பெயர். ‘வீடு’ என்ற சொற்சொல் மொழிபெயர்ப்பைவிட ‘குடும்பத்தார்’ நவீனத் தமிழில் இயல்பாகவும் குழுவைக் குறிக்கும் வகையிலும் உள்ளது.
- source_word: גַּם הֵם
  choice: -உம்
  rationale: முந்தைய கோத்திர நடவடிக்கைகளுடன் இவர்களுடைய நடவடிக்கையையும் இணைக்கும் பொருள், ‘குடும்பத்தாரும்’ என்ற இணைப்பு விகுதியால் இயல்பாக வெளிப்படுகிறது.
- source_word: בֵּית אֵל
  choice: பெத்தேல்
  rationale: எபிரெய இடப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: וַיהוָה
  choice: யாவே
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரான יהוה என்பதைப் பட்டப்பெயராக மாற்றாமல் நேரடியாக ஒலிபெயர்க்கிறது.
- source_word: עִמָּם
  choice: அவர்களோடு இருந்தார்
  rationale: தெய்வீக உடனிருப்பையும் ஆதரவையும் மிகையாக விளக்காமல் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல எபிரெய உரை தனிப்பட்ட இறைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதனைப் பொதுப் பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று வழங்குவது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. இராணுவச் சூழல் முதன்மை உரையில் தெளிவாக்கப்பட்டாலும், எபிரெய வினையின் குறைவாக விளக்கப்பட்ட மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
