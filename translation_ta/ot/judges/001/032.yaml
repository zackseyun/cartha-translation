source:
  edition: WLC
  text: וַ/יֵּ֨שֶׁב֙ הָ/אָ֣שֵׁרִ֔י בְּ/קֶ֥רֶב הַֽ/כְּנַעֲנִ֖י יֹשְׁבֵ֣י הָ/אָ֑רֶץ כִּ֖י לֹ֥א הוֹרִישֽׁ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/032.yaml
  text: So the Asherites lived among the Canaanites[a], the inhabitants of the land, because they did not drive them out.
translation:
  language: ta
  text: ஆகவே, ஆசேர் கோத்திரத்தார் அந்த நாட்டில் குடியிருந்த கானானியர்களின் நடுவே வாழ்ந்தார்கள்[a]; ஏனெனில், அவர்கள் கானானியர்களை வெளியேற்றவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் கூட்டுப் பொருளுடைய ஒருமை வடிவங்கள் சொற்சொல்லாக, ‘ஆசேரியன் ... கானானியன் ... அவன் அவனை வெளியேற்றவில்லை’ என்று உள்ளன. தமிழில் அவற்றின் நோக்கப்பட்ட கூட்டுப் பொருள் பன்மையில் தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: வாழ்ந்தார்கள்
  rationale: ישׁב இச்சூழலில் ஒரு மக்களினிடையே குடியிருந்து வாழ்வதைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הָאָשֵׁרִי
  choice: ஆசேர் கோத்திரத்தார்
  rationale: ஒருமை வடிவிலுள்ள இன/கோத்திரப் பெயர் இங்கு மொத்தக் கோத்திரத்தையும் கூட்டாகக் குறிக்கிறது; ‘கோத்திரத்தார்’ அந்தப் பொருளைத் தெளிவாக்குகிறது.
- source_word: בְּקֶרֶב
  choice: நடுவே
  rationale: ஒரு மக்கள் குழுவினரிடையே இருப்பதைச் சுட்டும் בְּקֶרֶב என்பதன் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַכְּנַעֲנִי
  choice: கானானியர்கள்
  rationale: இலக்கண வடிவம் ஒருமையாக இருந்தாலும், அடுத்து வரும் பன்மைச் சொற்றொடரும் சூழலும் இதைக் கூட்டுப் பொருளில் காட்டுகின்றன.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: அந்த நாட்டில் குடியிருந்த
  rationale: இது கானானியர்களை மேலுமாக அடையாளப்படுத்தும் பன்மைச் சொற்றொடர்; தமிழில் பெயரெச்சத் தொடராக இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לֹא הוֹרִישׁוֹ
  choice: அவர்கள் கானானியர்களை வெளியேற்றவில்லை
  rationale: ירשׁ என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் நாட்டின் குடிகளை அகற்றுதல் அல்லது வெளியேற்றுதல் என்று பொருள்படும். எபிரெயக் கூட்டொருமையைத் தமிழில் தெளிவான பன்மையாக வழங்குகிறது.
theological_decisions:
- issue: கோத்திரம் மற்றும் மக்கள் குழுவைக் குறிக்கும் கூட்டொருமை வடிவங்கள்
  choice: ‘ஆசேர் கோத்திரத்தார்’, ‘கானானியர்கள்’, ‘அவர்கள் ... வெளியேற்றவில்லை’ என்று கூட்டுப் பன்மையில் மொழிபெயர்த்தல்
  alternative: ‘ஆசேரியன் ... கானானியன் ... அவன் அவனை அகற்றவில்லை’ என்று இலக்கண ஒருமையை அப்படியே வைத்தல்
  rationale: எபிரெய மொழியில் உள்ள ஒருமை வடிவங்கள் இங்கு தனிநபர்களை அல்ல, முழுக் கோத்திரத்தையும் மக்கள் குழுவையும் கூட்டாகக் குறிக்கின்றன. தமிழில் சொற்சொல்லான ஒருமை தவறான தனிநபர் பொருளை ஏற்படுத்தும்; பன்மை சூழலின் உண்மைப் பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘அந்த நாட்டில் குடியிருந்த கானானியர்கள்’ என்பது மூலத்தின் அடையாளப்படுத்தும் தொடரைப் பாதுகாக்கிறது; ‘வெளியேற்றவில்லை’ என்பது நியாயாதிபதிகள் நூலின் குடிகளை அகற்றும் சூழலுக்கு ஏற்ற தெளிவான சொல்.
