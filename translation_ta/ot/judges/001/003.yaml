  source_fidelity: 'மூல எபிரெய உரையின் முக்கிய கூறுகள் அனைத்தும் துல்லியமாக உள்ளன: யூதா–சிமியோன் சகோதர உறவு, ‘மேலே வா’ என்ற அழைப்பு, சீட்டினால் ஒதுக்கப்பட்ட பகுதி, கானானியருக்கு எதிரான கூட்டு போராட்ட அழைப்பு, யூதாவின் பரஸ்பர உதவி வாக்குறுதி, சிமியோனின் உடன்செல்லுதல் ஆகியவை காக்கப்பட்டுள்ளன. ‘எனவே’ என்பது וַיֵּלֶךְ என்பதன் எளிய தொடர்ச்சியைவிட சற்றே விளைவுத் தொடர்பைச் சுட்டினாலும், சிமியோன் அழைப்பை ஏற்று உடன்சென்ற சூழலில் பொருளை மாற்றுவதில்லை.'
  naturalness: உரை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமான கதைநடையிலும் உள்ளது. ‘என்னுடன் ஏறிவா,’ ‘நாம் போரிடுவோம்,’ ‘நானும் உன்னுடன் வருவேன்’ ஆகியவை நேரடிப் பேச்சின் இயல்பைத் தக்கவைக்கின்றன. பெயர்களும் வாக்கிய ஓட்டமும் இயல்பாக உள்ளன.
  terminology: ‘சகோதரனாகிய’ என்பது אָחִיו-க்கு நம்பகமானது. גוֹרָל-ஐ ‘ஒதுக்கப்பட்ட பகுதி’ எனச் சூழலுக்கேற்ப மொழிபெயர்த்திருப்பது சரியானது; அடிக்குறிப்பு ‘சீட்டுப்பங்கு’ என்ற மூலச் சொல்லையும் சீட்டினால் நிலம் ஒதுக்கப்பட்ட கருத்தையும் தெளிவுபடுத்துகிறது. ‘கானானியர்கள்’ என்ற கூட்டுப் பன்மை பயன்பாடும் பொருத்தமானது.
