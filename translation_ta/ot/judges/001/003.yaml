source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוּדָה֩ לְ/שִׁמְע֨וֹן אָחִ֜י/ו עֲלֵ֧ה אִתִּ֣/י בְ/גוֹרָלִ֗/י וְ/נִֽלָּחֲמָה֙ בַּֽ/כְּנַעֲנִ֔י וְ/הָלַכְתִּ֧י גַם אֲנִ֛י אִתְּ/ךָ֖ בְּ/גוֹרָלֶ֑/ךָ וַ/יֵּ֥לֶךְ אִתּ֖/וֹ שִׁמְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/003.yaml
  text: And Judah said to Simeon his brother[a], “Come up with me into my allotted territory, and let us fight against the Canaanites; and I too will go with you into your allotted territory.” So Simeon went with him.
translation:
  language: ta
  text: யூதா தன் சகோதரனாகிய சிமியோனிடம், “எனக்கு ஒதுக்கப்பட்ட பகுதிக்கு[a] என்னுடன் ஏறிவா; கானானியர்களுக்கு எதிராக நாம் போரிடுவோம். உனக்கு ஒதுக்கப்பட்ட பகுதிக்கு நானும் உன்னுடன் வருவேன்” என்றான். எனவே சிமியோன் அவனுடன் சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “என் சீட்டுப்பங்கு” என்றும் பின்னர் “உன் சீட்டுப்பங்கு” என்றும் உள்ளது; அதாவது, குலுக்குச் சீட்டினால் ஒதுக்கப்பட்ட நிலப்பகுதி.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் எடுத்துரைக்கும் இறந்தகால வினை; தனியே ‘அப்போது’ அல்லது ‘மேலும்’ சேர்த்து காலநுணுக்கத்தை மிகைப்படுத்தவில்லை.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: இங்கு ஒரு கோத்திரத்தை மனிதர்போல் குறிப்பதாக இருந்தாலும், மூலப்பெயர் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தக்கவைக்கப்பட்டுள்ளது.
- source_word: לְשִׁמְעוֹן אָחִיו
  choice: தன் சகோதரனாகிய சிமியோனிடம்
  rationale: אָחִיו என்பதன் வெளிப்படையான ‘அவனுடைய சகோதரன்’ என்ற உறவுமொழியைத் தக்கவைத்து, தமிழ் வாக்கியத்தில் இயல்பாக அமைக்கிறது.
- source_word: עֲלֵה אִתִּי
  choice: என்னுடன் ஏறிவா
  rationale: עלה என்பதிலுள்ள மேலே செல்லுதல் அல்லது படையெடுத்துச் செல்லுதல் என்ற இயக்க நுணுக்கத்தை ‘ஏறிவா’ தக்கவைக்கிறது; நேரடிப் பேச்சில் அழைப்பின் நோக்குநிலையும் இயல்பாக வெளிப்படுகிறது.
- source_word: בְּגוֹרָלִי
  choice: எனக்கு ஒதுக்கப்பட்ட பகுதிக்கு
  rationale: גּוֹרָל என்பதன் சொற்பொருள் ‘சீட்டு/சீட்டுப்பங்கு’; இச்சூழலில் அது சீட்டினால் பங்கிடப்பட்ட நிலப்பகுதியைக் குறிக்கிறது. முதன்மை உரை பொருளைத் தெளிவாக்க, சொற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְנִלָּחֲמָה
  choice: நாம் போரிடுவோம்
  rationale: முதல் நபர் பன்மைக் cohortative வடிவத்தின் கூட்டு அழைப்பையும் தீர்மானத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּכְּנַעֲנִי
  choice: கானானியர்களுக்கு எதிராக
  rationale: எபிரெயத்தில் ஒருமை வடிவில் இருந்தாலும், இங்கு அது மக்களினத்தைக் கூட்டாகக் குறிக்கிறது; தமிழில் பன்மை இயல்பானது.
- source_word: וְהָלַכְתִּי גַם אֲנִי אִתְּךָ
  choice: நானும் உன்னுடன் வருவேன்
  rationale: גַם אֲנִי என்பதிலுள்ள ‘நானும்’ என்ற வலியுறுத்தலையும் பரஸ்பர உதவிக்கான வாக்குறுதியையும் தக்கவைக்கிறது.
- source_word: בְּגוֹרָלֶךָ
  choice: உனக்கு ஒதுக்கப்பட்ட பகுதிக்கு
  rationale: முன்னுள்ள அதே גּוֹרָל சொல்லைச் சூழலுக்கேற்ற ஒரே முறையில் மொழிபெயர்த்து ஒற்றுமையைப் பேணுகிறது.
- source_word: וַיֵּלֶךְ אִתּוֹ שִׁמְעוֹן
  choice: எனவே சிமியோன் அவனுடன் சென்றான்
  rationale: சிமியோன் அழைப்பை ஏற்றுச் சென்றதை விளைவாகக் காட்டுகிறது; ‘எனவே’ கதைத் தொடரின் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אָחִיו என்ற உறவுமொழி
  choice: தன் சகோதரனாகிய
  alternative: தன் உறவினனாகிய
  rationale: மூலத்தில் வெளிப்படையாக ‘சகோதரன்’ என்றே உள்ளது. யூதாவும் சிமியோனும் இஸ்ரவேலின் சகோதரக் கோத்திரங்களாகக் காட்டப்படுவதால், அதை பொதுவான ‘உறவினன்’ என்று மாற்றத் தேவையில்லை.
- issue: வாக்குத்தத்த நாட்டின் பங்கீட்டுச் சூழலில் גּוֹרָל
  choice: ஒதுக்கப்பட்ட பகுதி
  alternative: சீட்டுப்பங்கு
  rationale: இங்கு சொல் வெறும் சீட்டைக் குறிப்பிடாமல், சீட்டினால் கோத்திரத்துக்கு ஒதுக்கப்பட்ட நிலப்பகுதியைக் குறிக்கிறது. முதன்மை உரையில் பொருள் தெளிவாகவும், அடிக்குறிப்பில் மூல உருவகம் வெளிப்படையாகவும் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஏறிவா’ மூலத்தின் இயக்க நுணுக்கத்தைத் தக்கவைக்கிறது; ‘ஒதுக்கப்பட்ட பகுதி’ சூழல்சார் பொருளைத் தெளிவாக்குகிறது. அடிக்குறி அது விளக்கும் முதல் சொற்றொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
