translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரேயத்தின் மீளுரையும், நப்தலி என்ற கோத்திரப் பெயருடன் வரும் ஒருமை வினையும், பின்னர் வரும் பன்மைப் பெயர்ச்சுட்டும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
