base_translation:
  language: en
  yaml_path: translation/ot/judges/001/033.yaml
  text: Naphtali did not drive out the inhabitants of Beth-shemesh or the inhabitants of Beth-anath[a], so he lived among the Canaanites, the inhabitants of the land. And the inhabitants of Beth-shemesh and Beth-anath became forced labor for them.
translation:
  language: ta
  text: நப்தலி, பெத்-ஷெமேஷில் குடியிருந்தவர்களையும் பெத்-அனாத்தில் குடியிருந்தவர்களையும் துரத்திவிடவில்லை. அவன் நாட்டில் குடியிருந்த கானானியர்களின் நடுவே வாழ்ந்தான். பெத்-ஷெமேஷிலும் பெத்-அனாத்திலும் குடியிருந்தவர்கள் அவர்களுக்காகக் கட்டாய உழைப்பு செய்ய வேண்டியவர்களானார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்குக் கட்டாயப் பணிச் சேவை செய்ய வேண்டியவர்களானார்கள்.” எபிரேயச் சொல் வெறும் வரி அல்லது திறை செலுத்துவதை அல்ல, கட்டாய உழைப்புச் சேவையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: துரத்திவிடவில்லை
  rationale: இந்த அதிகாரத்தின் நிலப் பிடிப்பு சூழலில், Hiphil வடிவம் முன்னிருந்த குடிகளை அகற்றுவதைக் குறிக்கிறது; நவீன தமிழில் ‘துரத்திவிடு’ இராணுவ மற்றும் குடியேற்றப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יֹשְׁבֵי
  choice: குடியிருந்தவர்கள்
  rationale: ישב என்பதன் பங்கேற்பு வடிவம் ஒரு இடத்தில் வசிப்பவர்களைக் குறிக்கிறது; மீண்டும் வரும் எபிரேயச் சொல்லமைப்பையும் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בֵית שֶׁמֶשׁ
  choice: பெத்-சேமேஸ்
  rationale: இடப்பெயர் மொழிபெயர்க்கப்படாமல், எபிரேய உச்சரிப்புக்கு ஏற்றவாறு தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֵית עֲנָת
  choice: பெத்-ஆனாத்
  rationale: இடப்பெயர் மொழிபெயர்க்கப்படாமல், எபிரேய உச்சரிப்புக்கு ஏற்றவாறு தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיֵּשֶׁב בְּקֶרֶב
  choice: மாறாக, ... நடுவே அவன் வாழ்ந்தான்
  rationale: துரத்தாததற்குப் பின் ஏற்பட்ட முரண்பட்ட நிலையை ‘மாறாக’ தெளிவாக்குகிறது; בְּקֶרֶב என்பதன் ‘நடுவே/மத்தியில்’ என்ற கருத்தையும் பாதுகாக்கிறது. ஒருமை வினை, கோத்திரமான நப்தலியைத் தொகுதி ஒருமையாகக் காட்டுகிறது.
- source_word: הַכְּנַעֲנִי
  choice: கானானியர்கள்
  rationale: எபிரேயத்தில் வடிவியல் ஒருமையாக இருந்தாலும் இங்கு இனக்குழுவைக் குறிக்கும் தொகுதி ஒருமை; தமிழில் இயல்பாகப் பன்மையில் தரப்பட்டுள்ளது.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: நாட்டில் குடியிருந்த
  rationale: கானானியர்களை அடையாளப்படுத்தும் இணைவிளக்கத்தைத் தவிர்க்காமல் இயல்பான தமிழ் சொல்லமைப்பில் பாதுகாக்கிறது.
- source_word: הָיוּ לָהֶם לָמַס
  choice: அவர்களுக்காகக் கட்டாய உழைப்புச் செய்பவர்களானார்கள்
  rationale: מַס வெறும் வரி அல்லது திறையைக் காட்டிலும் கட்டாயப் பணிச் சேவையைக் குறிக்கிறது; היה + ל அமைப்பின் ‘அவர்களுக்காக ... ஆனார்கள்’ என்ற உறவையும் வெளிப்படுத்துகிறது.
- source_word: לָהֶם
  choice: அவர்களுக்காக
  rationale: பன்மைப் பெயர்ச்சுட்டு நப்தலி கோத்திர உறுப்பினர்களைக் குறிக்க வாய்ப்புள்ளது; எபிரேயப் பன்மை தமிழிலும் பாதுகாக்கப்பட்டுள்ளது.
