  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர் நிகழ்வுகள் தமிழ் வினையெச்சங்களால் இயல்பாக இணைக்கப்பட்டுள்ளன.
