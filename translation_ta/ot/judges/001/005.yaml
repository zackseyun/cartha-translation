revisions:
- from: அவர்கள் பெசேக்கில் அதோனி-பெசேக்கைக்[a] கண்டுபிடித்து, அவனுக்கு எதிராகப் போரிட்டு, கானானியரையும் பெரிசியரையும் வீழ்த்தினார்கள்.
  to: அவர்கள் பெசேக்கில் அதோனி-பெசேக்கைக் கண்டு, அவனுக்கு எதிராகப் போரிட்டு, கானானியரையும் பெரிசியரையும் வீழ்த்தினார்கள்.
  rationale: The revision makes the finding verb semantically more precise and natural in Tamil while retaining every element of the Hebrew. The footnote continues to preserve the lexical alternative without displacing the contextual treatment of Adoni-bezek as a personal name.
