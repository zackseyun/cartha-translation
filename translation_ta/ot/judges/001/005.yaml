  text: וַֽ֠/יִּמְצְאוּ אֶת אֲדֹנִ֥י בֶ֨זֶק֙ בְּ/בֶ֔זֶק וַ/יִּֽלָּחֲמ֖וּ בּ֑/וֹ וַ/יַּכּ֕וּ אֶת הַֽ/כְּנַעֲנִ֖י וְ/אֶת הַ/פְּרִזִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/005.yaml
  text: They found Adoni-bezek in Bezek[a], and they fought against him and struck down the Canaanites and the Perizzites.
translation:
  language: ta
  text: அவர்கள் பெசேக்கில் அதோனி-பெசேக்கைக் கண்டு, அவனுக்கு எதிராகப் போரிட்டு, கானானியரையும் பெரிசியரையும் வீழ்த்தினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: கண்டுபிடித்து
  rationale: מצא என்பது இக்கதைச் சூழலில் ‘கண்டார்கள்/எதிர்கொண்டார்கள்’ என்று பொருள்படும்; தொடர்ச்சியான தமிழ் கதைநடைக்கு ‘கண்டுபிடித்து’ இயல்பாக அமைகிறது.
- source_word: אֲדֹנִי בֶזֶק
  choice: அதோனி-பெசேக்கு
  rationale: சூழலில் இது ஒருவரின் பெயராகச் செயல்படுவதால் ஒலிபெயர்க்கப்படுகிறது; இதன் சொற்பிறப்புப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּבֶזֶק
  choice: பெசேக்கில்
  rationale: בְ இங்கு இடத்தைக் குறிக்கிறது; தமிழில் இடப்பெயருடன் ‘-இல்’ இயல்பான இணைப்பு.
- source_word: וַיִּלָּחֲמוּ בּוֹ
  choice: அவனுக்கு எதிராகப் போரிட்டு
  rationale: לחם என்பதன் நிபால் வடிவம் בְ உடன் எதிரியை எதிர்த்துப் போரிடுதலைக் குறிக்கிறது.
- source_word: וַיַּכּוּ
  choice: வீழ்த்தினார்கள்
  rationale: נכה போர் சூழலில் தாக்கி வீழ்த்துதல் அல்லது தோற்கடித்தல் எனப் பரந்த பொருள் கொண்டது; ஒவ்வொருவரும் உடனே கொல்லப்பட்டதாக மிகைப்படுத்தாமல் அதன் வலிமையைத் தக்கவைக்கிறது.
- source_word: הַכְּנַעֲנִי
  choice: கானானியர்
  rationale: எபிரெயத்தில் ஒருமை வடிவிலிருந்தாலும் இங்கு ஓர் இனக்குழுவைக் கூட்டாகக் குறிக்கிறது.
- source_word: הַפְּרִזִּי
  choice: பெரிசியர்
  rationale: எபிரெயத்தில் ஒருமை வடிவிலிருந்தாலும் போர் சூழலில் ஓர் இனக்குழுவைக் கூட்டாகக் குறிக்கிறது.
