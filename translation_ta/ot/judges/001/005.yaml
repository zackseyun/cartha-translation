    text: “அதோனி-பெசேக்” என்ற பெயரைச் சொற்பிறப்பின்படி “பெசேக்கின் ஆண்டவன்” என்றும் புரிந்துகொள்ளலாம்; இங்கு அது ஒருவரின் பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
