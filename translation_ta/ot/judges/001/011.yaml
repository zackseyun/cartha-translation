  register: நவீன தரநிலைத் தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயின் போர்ச் சூழலை ‘எதிராக’ என்பது வெளிப்படுத்துகிறது; ஆனால் אֶל என்பதிலுள்ள ‘நோக்கி’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. இரண்டு அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
