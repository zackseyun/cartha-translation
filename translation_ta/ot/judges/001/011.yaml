base_translation:
  language: en
  yaml_path: translation/ot/judges/001/011.yaml
  text: From there he went against the inhabitants of Debir[b][a]. (The former name of Debir was Kiriath-sepher.)
translation:
  language: ta
  text: யூதா அங்கிருந்து தெபீரில் குடியிருந்தவர்களுக்கு எதிராகச் சென்றது.[a] தெபீரின் முந்தைய பெயர் கீரியாத்-செப்பேர்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தெபீரில் குடியிருந்தவர்களை நோக்கிச் சென்றது.” எபிரெய முன்னிடைச்சொல்லின் நேரடிப் பொருள் “நோக்கி” என்பதாக இருக்கலாம்; இங்குள்ள வெற்றிக்கொள்ளும் போர்ச் சூழலில் அது பகைமையான நகர்வைக் குறிப்பதால் “எதிராக” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: கீரியாத்-செப்பேர் என்பது தெபீரின் முந்தைய பெயர். அந்தப் பெயருக்கு “புத்தகத்தின் நகரம்” அல்லது “எழுத்தர்களின் நகரம்” என்று பொருள் இருக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: அவர் சென்றார்
  rationale: הלך என்பதன் வழக்கமான கதைநடை வடிவம்; போர்ச் சூழல் இருந்தாலும், வினைச்சொல் தன்னளவில் ‘அணிவகுத்துச் சென்றார்’ என்று குறிப்பாகச் சொல்லவில்லை.
- source_word: מִשָּׁם
  choice: அங்கிருந்து
