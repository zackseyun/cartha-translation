- source_word: אֶל
  choice: எதிராக
  rationale: அடிப்படைப் பொருள் ‘நோக்கி/இடம் நோக்கி’ என்றாலும், இது வெற்றிகொள்ளும் போர்ச் சூழலில் பகைமையான நகர்வைக் குறிக்கிறது; ‘எதிராக’ என்பது சூழலைத் தெளிவாக்குகிறது. மூலத்தின் பரந்த பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: יוֹשְׁבֵי
  choice: குடியிருந்தவர்கள்
