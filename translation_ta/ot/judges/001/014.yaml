base_translation:
  language: en
  yaml_path: translation/ot/judges/001/014.yaml
  text: And when she came[a], she urged him to ask her father for the field. Then she dismounted from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: ta
  text: அவள் வந்தபோது, தன் தந்தையிடம் அந்த வயலைக் கேட்கும்படி அவனைத் தூண்டினாள்[a]. பின்பு அவள் கழுதையிலிருந்து இறங்கினாள்[b]. காலேப் அவளிடம், “உனக்கு என்ன வேண்டும்?”[c] என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தூண்டினாள்” என்பதற்கு “வற்புறுத்தினாள்” அல்லது “தூண்டிவிட்டாள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் வற்புறுத்துவது முதல் தூண்டிவிடுவது வரையிலான பொருள் வீச்சைக் கொண்டது; இங்கு அவனை வேண்டுகோள் விடுக்கச் செய்ததையே சூழல் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “கழுதையிலிருந்து கீழே இறங்கினாள்” அல்லது “கழுதையிலிருந்து சட்டென்று இறங்கினாள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் இறங்குவதையோ கீழே விழுவதுபோன்ற அசைவையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெய மொழிமரபு சொல்லுக்குச் சொல் “உனக்கு என்ன?” என்கிறது. இது “உனக்கு என்ன வேண்டும்?” அல்லது “உனக்கு என்ன ஆயிற்று?” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: அவள் வந்தபோது
  rationale: בְּ + infinitive construct + 3fs suffix forms a temporal expression, literally ‘at her coming’; ‘அவள் வந்தபோது’ is direct and natural in modern Tamil.
- source_word: וַתְּסִיתֵהוּ
  choice: அவனைத் தூண்டினாள்
  rationale: סות can mean urge, persuade, entice, or incite. ‘தூண்டினாள்’ retains this breadth better than a rendering that makes the action unambiguously coercive or negative; the footnote clarifies the contextual sense.
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ הַשָּׂדֶה
  choice: தன் தந்தையிடம் அந்த வயலைக் கேட்கும்படி
  rationale: שאל with מֵאֵת presents the father as the person from whom the specific field is requested. ‘அந்த வயல்’ reflects the Hebrew definite article and reads idiomatically in Tamil.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: அவள் கழுதையிலிருந்து இறங்கினாள்
  rationale: צנח can suggest dropping or descending; in the context of riding a donkey, ‘இறங்கினாள்’ clearly communicates dismounting without overstating the manner.
- source_word: מַה לָּךְ
  choice: உனக்கு என்ன வேண்டும்?
  rationale: The idiom literally means ‘What is to you?’ and can ask either what someone wants or what is troubling them. The request context favors ‘உனக்கு என்ன வேண்டும்?’ while the footnote preserves the alternative.
- source_word: כָּלֵב
  choice: காலேப்
  rationale: The personal name is transliterated according to established Tamil biblical usage.
