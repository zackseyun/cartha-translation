  text: וַ/יֵּ֤לֶךְ יְהוּדָה֙ אֶת שִׁמְע֣וֹן אָחִ֔י/ו וַ/יַּכּ֕וּ אֶת הַֽ/כְּנַעֲנִ֖י יוֹשֵׁ֣ב צְפַ֑ת וַ/יַּחֲרִ֣ימוּ אוֹתָ֔/הּ וַ/יִּקְרָ֥א אֶת שֵׁם הָ/עִ֖יר חָרְמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/017.yaml
  text: Then Judah went with Simeon his brother[a], and they struck down the Canaanites living in Zephath and devoted it to destruction[c][b]; so they called the name of the city Hormah.
translation:
  language: ta
  text: பின்பு யூதாவும் அவன் சகோதரன் சிமியோனும் சென்று, செப்பாத்தில் குடியிருந்த கானானியர்களைத் தாக்கி வீழ்த்தினார்கள். அவர்கள் அந்நகரத்தை அழிவுக்கென அர்ப்பணித்தார்கள்[a]. பின்னர் அவன் அந்த நகரத்துக்கு ஹோர்மா[b] என்று பெயரிட்டான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முற்றிலும் அழித்தார்கள்’ அல்லது ‘தடைக்கு உட்படுத்தினார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை, ஒன்றை மீளப்பெற முடியாதபடி அர்ப்பணிப்பதைக் குறிக்கிறது; இத்தகைய சூழல்களில் அது பொதுவாக அழிப்பின் மூலம் நிறைவேற்றப்பட்டது.
    reason: alternative_reading
  - marker: b
    text: ‘ஹோர்மா’ என்ற பெயர், ‘அழிவுக்கென அர்ப்பணித்தல்’ என்று பொருள்படும் எபிரெயச் சொல்லுடன் ஒத்தொலிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் ‘அவன் பெயரிட்டான்’ என்று ஒருமையில் உள்ளது. இது கூட்டாகக் கருதப்படும் யூதாவையோ அவன் சார்பாகச் செயல்பட்ட ஒருவரையோ குறிக்கலாம்; சில மொழிபெயர்ப்புகள் இதை ‘அவர்கள் பெயரிட்டார்கள்’ என்று வழங்குகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ יְהוּדָה אֶת שִׁמְעוֹן אָחִיו
  choice: யூதா தன் சகோதரனான சிமியோனுடன் சென்று
  rationale: הלך என்பதன் அடிப்படைப் பொருள் ‘சென்றான்’; இங்கு אֶת என்பது உடன்செல்லுதலைக் குறிக்கிறது. ஆகவே, போருக்குச் சென்றதாகத் தேவையின்றி விரிவாக்காமல், இயல்பான தமிழில் ‘உடன் சென்று’ என வழங்கப்படுகிறது.
- source_word: וַיַּכּוּ
  choice: தாக்கி வீழ்த்தினார்கள்
  rationale: נכה என்ற வினை போர்ச் சூழலில் தாக்கி முறியடித்தல் அல்லது வீழ்த்துதல் என்ற வலிமையைக் கொண்டது. வெறுமனே ‘கொன்றார்கள்’ என்று பொருளைச் சுருக்காமல் அதன் போரியல் நுணுக்கத்தை இச்சொற்றொடர் காக்கிறது.
- source_word: הַכְּנַעֲנִי יֹשֵׁב צְפַת
  choice: செப்பாத்தில் குடியிருந்த கானானியர்களை
  rationale: ‘கானானியன்’ என்பது எபிரெயத்தில் ஒருமை வடிவிலுள்ள கூட்டுப்பெயர்; பன்மை வினையும் போர்ச் சூழலும் காரணமாகத் தமிழில் பன்மையாக வழங்குவது தெளிவானது. ישב என்பது இங்கு அங்கே வசித்த மக்களைக் குறிக்கிறது.
- source_word: וַיַּחֲרִימוּ אוֹתָהּ
  choice: அவர்கள் அதை அழிவுக்கென அர்ப்பணித்தார்கள்
  rationale: חרם என்பது ஒன்றை மீளப்பெற முடியாதபடி ஒதுக்கி அர்ப்பணிப்பதையும், இச்சூழலில் அதன் அழிவையும் ஒருங்கே குறிக்கிறது. ‘அழித்தார்கள்’ என்று மட்டும் மொழிபெயர்ப்பதைவிட இந்தத் தேர்வு அதன் சமய-போரியல் பதற்றத்தைப் பாதுகாக்கிறது.
- source_word: וַיִּקְרָא
  choice: அவன் ... பெயரிட்டான்
  rationale: எபிரெய வினை ஒருமையில் உள்ளது. முந்தைய பன்மைச் செயல்களுக்குப் பின்பும் மூலத்தின் திடீர் ஒருமையைப் பாதுகாக்க ‘அவன்’ என வழங்கப்படுகிறது; இது கூட்டுப்பெயராகிய யூதாவையோ அதன் பிரதிநிதியையோ சுட்டலாம்.
- source_word: חָרְמָה
  choice: ஹோர்மா
  rationale: இது இடப்பெயர் என்பதால் ஒலிபெயர்க்கப்படுகிறது. חרם என்ற ‘அழிவுக்கென அர்ப்பணித்தல்’ சார்ந்த சொல்லுடனான ஒலித்தொடர்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: חרם என்ற சொல்லின் அழிவு மற்றும் அர்ப்பணிப்பு சார்ந்த இரட்டைப் பொருள்
  choice: அழிவுக்கென அர்ப்பணித்தார்கள்
  alternative: முற்றிலும் அழித்தார்கள் / தடைக்குள் வைத்தார்கள்
  rationale: மூலச்சொல் வெறும் படை அழிப்பை மட்டுமல்லாமல், ஒன்றை மீளப்பெற முடியாதபடி ஒதுக்கி அர்ப்பணிக்கும் கருத்தையும் கொண்டுள்ளது. தேர்ந்த மொழியாக்கம் இரு அம்சங்களையும் ஒன்றை ஒன்று நீக்காமல் வைத்திருக்கிறது.
- issue: וַיִּקְרָא என்ற ஒருமை வினையின் கர்த்தா
  choice: அவன் ... பெயரிட்டான்
  alternative: அவர்கள் ... பெயரிட்டார்கள்
  rationale: சூழலில் யூதாவும் சிமியோனும் சேர்ந்து செயல்பட்டாலும், மூல எபிரெய வினை ஒருமையில் உள்ளது. அதைச் சீராக்கிப் பன்மையாக்காமல் மூலத்தின் இலக்கணத் தெளிவின்மையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. ‘தாக்கி வீழ்த்தினார்கள்’ என்பது போர்ச் சூழலின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது. ‘அழிவுக்கென அர்ப்பணித்தார்கள்’ என்பது חרם என்பதிலுள்ள சமய அர்ப்பணிப்பையும் அழிவையும் ஒருங்கே காக்கிறது. மூலத்திலுள்ள பன்மையிலிருந்து ஒருமைக்கான மாற்றம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
