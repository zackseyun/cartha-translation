base_translation:
  language: en
  yaml_path: translation/ot/judges/001/029.yaml
  text: And Ephraim did not drive out the Canaanites who lived in Gezer[a], and the Canaanites lived among them in Gezer.
translation:
  language: ta
  text: எப்பிராயீம் கேசேரில் குடியிருந்த கானானியர்களை வெளியேற்றவில்லை; கானானியர்கள் கேசேரில் அவர்களிடையே[a] குடியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, ‘அவன் நடுவில்.’ ஒருமைச் சுட்டுப்பின்னொட்டு எப்பிராயீமை ஒரு கோத்திரக் கூட்டாகக் குறிக்கிறது; அதனால் தமிழில் கூட்டுப்பொருளை வெளிப்படுத்த ‘அவர்களிடையே’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: வெளியேற்றவில்லை
  rationale: ירשׁ என்பதன் ஹிஃபில் வடிவம், முன்னிருந்த குடிகளை அவர்களுடைய இடத்திலிருந்து அகற்றுவதைக் குறிக்கிறது. ‘வெளியேற்றவில்லை’ என்பது இச்சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַכְּנַעֲנִי
  choice: கானானியர்கள்
  rationale: எபிரெயத்தில் ஒருமை வடிவில் இருந்தாலும், இங்கு ஓர் இனக்குழுவைக் கூட்டாகக் குறிக்கிறது; எனவே தமிழில் பன்மை இயல்பானது.
- source_word: הַיּוֹשֵׁב
  choice: குடியிருந்த
  rationale: ישׁב வினையின் பங்கேற்பு வடிவம் தொடர்ந்த குடியிருப்பைக் குறிக்கிறது. ‘குடியிருந்த’ என்பது நிலையான வசிப்பைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: בְּגָזֶר
  choice: கேசேரில்
  rationale: בְּ இடத்தைக் குறிக்கிறது; நகருக்குள் குடியிருப்பதைத் தமிழில் ‘கேசேரில்’ என இயல்பாகச் சொல்லலாம்.
- source_word: וַיֵּשֶׁב
  choice: குடியிருந்தார்கள்
  rationale: இது கதையின் அடுத்த நிலையைத் தொடர்கிறது. மூலத்தின் இணைப்பை காரணவிளைவாக வலுப்படுத்தாமல், வசிப்பு தொடர்ந்ததைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּקִרְבּוֹ
  choice: அவர்கள் நடுவே
  rationale: சொல்லர்த்தமாக ‘அவனுடைய நடுவில்’; ஒருமை பின்னொட்டு எப்பிராயீம் கோத்திரத்தை ஒரு கூட்டு அலகாகக் குறிக்கிறது. தமிழில் ‘அவர்கள் நடுவே’ அந்தக் கூட்டுப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
