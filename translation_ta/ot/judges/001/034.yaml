  text: וַ/יִּלְחֲצ֧וּ הָ/אֱמֹרִ֛י אֶת בְּנֵי דָ֖ן הָ/הָ֑רָ/ה כִּי לֹ֥א נְתָנ֖/וֹ לָ/רֶ֥דֶת לָ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/034.yaml
  text: And the Amorites pressed the sons of Dan back into the hill country[a], because they did not allow them to go down into the valley.
translation:
  language: ta
  text: எமோரியர்கள் தாண் குலத்தாரை மலைநாட்டுக்குள் நெருக்கித் தள்ளினார்கள்[a]; ஏனெனில், அவர்கள் பள்ளத்தாக்கிற்குள் இறங்க எமோரியர்கள் அனுமதிக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “எமோரியன் தாணின் மகன்களை மலைநாட்டை நோக்கி நெருக்கினான்; ஏனெனில், பள்ளத்தாக்கிற்குள் இறங்க அது அவர்களை அனுமதிக்கவில்லை.” எபிரெய மொழி இந்த இனக்குழுக்களை கூட்டுப் பொருளுடைய ஒருமை வடிவங்களில் குறிப்பிடுகிறது; ஆனால் சூழலில் பொருள் பன்மையாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְחֲצוּ
  choice: நெருக்கித் தள்ளினார்கள்
  rationale: לחץ என்பது நெருக்குதல், ஒடுக்குதல் அல்லது கட்டுப்பட்ட இடத்திற்குத் தள்ளுதல் என்னும் பொருள்களைக் கொண்டது. தொடர்ந்து வரும் திசையைக் குறிக்கும் சொற்றொடருடன் சேர்ந்து, பகைமையுடன் மலைநாட்டுக்குள் தள்ளிய செயலை இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָאֱמֹרִי
  choice: எமோரியர்கள்
  rationale: எபிரெயத்தில் ஒருமை வடிவில் இருந்தாலும், இங்கு ஓர் இனக்குழுவைக் குறிக்கும் கூட்டொருமையாகப் பயன்படுகிறது. தமிழில் பன்மை வடிவம் சூழலின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בְּנֵי דָן
  choice: தாணின் மக்களை
  rationale: மூலத்தின் குடும்ப/குல உறவைக் காட்டும் ‘தாணின் மகன்கள்’ என்ற சொல்லமைப்பின் பொருளைப் பாதுகாத்தபடி, ஓர் இனக்குழுவைக் குறிக்க நவீன தமிழில் இயல்பான ‘தாணின் மக்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הָהָרָה
  choice: மலைநாட்டுக்குள்
  rationale: திசை நோக்கிய இயக்கத்தைக் குறிக்கும் எபிரெய வடிவத்தையும், பின்னர் வரும் பள்ளத்தாக்குடனான புவியியல் வேறுபாட்டையும் இது வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய செயலுக்கான காரணத்தை அறிமுகப்படுத்தும் காரணப்பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: לֹא נְתָנוֹ
  choice: எமோரியர்கள் அனுமதிக்கவில்லை
  rationale: மூலத்தில் கூட்டொருமையுடன் தொடர்புடைய இலக்கண ஒருமை வடிவங்கள் உள்ளன. தமிழில் குழப்பத்தைத் தவிர்க்க எழுவாய் மீண்டும் குறிப்பிடப்பட்டு, கூட்டுப் பொருள் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: לָרֶדֶת
  choice: இறங்கிவர
  rationale: மலைநாட்டிலிருந்து தாழ்வான பள்ளத்தாக்கை நோக்கிய நிலவியல் இயக்கத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לָעֵמֶק
  choice: பள்ளத்தாக்கிற்குள்
  rationale: עֵמֶק குறிக்கும் பள்ளத்தாக்கு அல்லது தாழ்நிலப் பகுதியை நேரடியாகவும், மலைநாட்டுடனான வேறுபாடு தெளிவாகவும் தருகிறது.
