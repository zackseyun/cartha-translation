source:
  edition: WLC
  text: זְבוּלֻ֗ן לֹ֤א הוֹרִישׁ֙ אֶת יוֹשְׁבֵ֣י קִטְר֔וֹן וְ/אֶת יוֹשְׁבֵ֖י נַהֲלֹ֑ל וַ/יֵּ֤שֶׁב הַֽ/כְּנַעֲנִי֙ בְּ/קִרְבּ֔/וֹ וַ/יִּֽהְי֖וּ לָ/מַֽס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/030.yaml
  text: Zebulun did not drive out the inhabitants of Kitron or the inhabitants of Nahalol[b][a], so the Canaanites lived among them and became forced laborers.
translation:
  language: ta
  text: செபுலோன், கித்ரோனில் குடியிருந்தவர்களையும் நகலோலில்[a] குடியிருந்தவர்களையும் வெளியேற்றவில்லை. ஆகவே, கானானியர்கள் செபுலோன் கோத்திரத்தினரிடையே குடியிருந்து[b], கட்டாய உழைப்புக்கு உட்படுத்தப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நகலால்’ என்றும் வழங்கலாம்; தொடர்புடைய வேதப்பகுதிகளிலும் சில மொழிபெயர்ப்பு மரபுகளிலும் அந்தப் பெயர் வடிவம் காணப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில், ‘கானானியன் அவன்/அதன் நடுவில் குடியிருந்தான்’ என்று ஒருமை வடிவங்கள் உள்ளன. இங்கே ‘கானானியன்’ ஒரு மக்களினத்தையும், ‘அவன்/அதன்’ என்பது செபுலோன் கோத்திரத்தையும் கூட்டொருமையாகக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: வெளியேற்றவில்லை
  rationale: இங்கு ירש என்பதன் ஹிஃபில் வடிவம், ஏற்கெனவே நாட்டில் குடியிருந்தவர்களை அங்கிருந்து அகற்றுவதைக் குறிக்கிறது. ‘வெளியேற்று’ என்பது இன்றைய தமிழில் இயல்பாகவும் இராணுவக் குடியேற்றச் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: יוֹשְׁבֵי
  choice: குடியிருந்தவர்கள்
  rationale: ישב என்பதன் பங்கேற்பு வடிவம் ஒரு இடத்தில் வசிப்பவர்களைக் குறிக்கிறது; ‘குடியிருந்தவர்கள்’ இடத்துடனான உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: קִטְרוֹן
  choice: கித்ரோன்
  rationale: இடப்பெயர் எபிரெய ஒலிப்புக்கு ஏற்றவாறு தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: נַהֲלֹל
  choice: நகலோல்
  rationale: இவ்வசனத்தின் மசோரா உயிர்க்குறிப்பான Nahalol வடிவத்தைப் பின்பற்றி இடப்பெயர் தமிழில் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וַיֵּשֶׁב הַכְּנַעֲנִי בְּקִרְבּוֹ
  choice: கானானியர்கள் அவர்களிடையே குடியிருந்து
  rationale: הַכְּנַעֲנִי இலக்கணத்தில் ஒருமையாக இருந்தாலும் ஒரு மக்களினத்தைக் குறிக்கும் கூட்டொருமை. בְּקִרְבּוֹ என்பதிலுள்ள ஒருமைப் பின்னொட்டு செபுலோன் கோத்திரத்தை ஒரே கூட்டு அமைப்பாகக் குறிப்பதாகத் தெரிகிறது. இயல்பான தமிழுக்காக இரண்டும் பொருள்சார் பன்மையில் வழங்கப்பட்டன.
- source_word: לָמַס
  choice: கட்டாய உழைப்பாளர்கள்
  rationale: מַס இச்சூழலில் வெறும் பணவரியையல்ல, கீழ்ப்படுத்தப்பட்ட மக்கள்மீது சுமத்தப்பட்ட கட்டாய உழைப்பைக் குறிக்கிறது.
- source_word: וַיִּהְיוּ לָמַס
  choice: கட்டாய உழைப்பாளர்களானார்கள்
  rationale: கானானியர்கள் கட்டாய உழைப்புக்கு உட்படுத்தப்பட்ட நிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: הַכְּנַעֲנִי என்ற கூட்டொருமையும் בְּקִרְבּוֹ என்ற ஒருமைப் பின்னொட்டும்
  choice: ‘கானானியர்கள் அவர்களிடையே’ என்று பொருள்சார் பன்மையில் மொழிபெயர்த்தல்
  alternative: ‘கானானியன் அவன்/அதன் நடுவில்’ என்று இலக்கண வடிவத்தை நேரடியாகப் பிரதிபலித்தல்
  rationale: இது கோட்பாட்டுத் தீர்மானம் அல்ல; எபிரெய மொழியில் ஒரு மக்களினமும் ஒரு கோத்திரமும் கூட்டு ஒருமையாகக் குறிப்பிடப்படலாம். பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கத் தமிழில் பன்மை பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதவசனத்திற்குரிய கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. இடப்பெயர்கள் எழுத்துப்பெயர்க்கப்பட்டன; எபிரெய கூட்டொருமை தமிழில் இயல்பான பன்மையாக வழங்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டது.
