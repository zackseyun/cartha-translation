  source_fidelity: மூல எபிரெயத்தின் காலத் துணைவாக்கியம், இஸ்ரவேல் வலிமை அடைந்த நிலை, கானானியர்கள்மீது விதிக்கப்பட்ட கட்டாய உழைப்பு, மற்றும் அவர்களை முழுமையாக வெளியேற்றாத செயல் ஆகிய அனைத்தையும் மொழிபெயர்ப்பு துல்லியமாகக் காக்கிறது. எபிரெய ஒருமை இனப்பெயருக்கும் ஒருமைச் சுட்டுப்பெயருக்கும் தமிழில் கூட்டுப் பொருளைத் தெளிவாக்கும் பன்மை வடிவம் பொருத்தமானது.
