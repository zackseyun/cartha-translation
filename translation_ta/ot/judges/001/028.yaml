  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּֽי חָזַ֣ק יִשְׂרָאֵ֔ל וַ/יָּ֥שֶׂם אֶת הַֽ/כְּנַעֲנִ֖י לָ/מַ֑ס וְ/הוֹרֵ֖ישׁ לֹ֥א הוֹרִישֽׁ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/028.yaml
  text: And when Israel became strong[a], they put the Canaanites to forced labor[b], but they did not drive them out completely.
translation:
  language: ta
  text: இஸ்ரவேல் வலிமை பெற்றபோது, கானானியர்களைக் கட்டாய உழைப்புக்கு[a] உட்படுத்தியது; ஆனால் அவர்களை முற்றிலும் வெளியேற்றவில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உழைப்புக் கப்பத்துக்கு’ அல்லது ‘அரசுக்கான கட்டாயப் பணிக்கு’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், ஆளும் அதிகாரம் வலுக்கட்டாயமாக விதித்த உழைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘அவனை வெளியேற்றவில்லை’ என்று ஒருமையில் உள்ளது; ஆனால் அந்த ஒருமைச் சுட்டுப்பெயர் கானானிய மக்களைத் தொகுப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: பெற்றபோது
  rationale: எபிரெயக் கதைநடைச் சொற்றொடர் இங்கு காலத்தைக் குறிக்கும் துணைவாக்கியத்தை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பாகவும் சுருக்கமாகவும் ‘...போது’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: חָזַק
  choice: வலிமை பெற்ற
  rationale: இஸ்ரவேல் வலிமையோ ஆதிக்கமோ அடைந்ததைக் குறிக்கும் தொடக்கநிலைப் பொருளை ‘வலிமை பெற்ற’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַכְּנַעֲנִי
  choice: கானானியர்களை
  rationale: எபிரெயத்தில் ஒருமை வடிவம் இருந்தாலும், அது கானானிய மக்களைக் கூட்டாகக் குறிக்கும் இனப்பெயர்; எனவே தமிழில் பன்மை இயல்பானது.
- source_word: לָמַס
  choice: கட்டாய உழைப்புக்கு
  rationale: ஆளும் அதிகாரம் வலுக்கட்டாயமாக விதிக்கும் உழைப்பை מַס குறிக்கிறது. ‘கட்டாய உழைப்பு’ அதன் வற்புறுத்தல் தன்மையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְהוֹרֵישׁ לֹא הוֹרִישׁוֹ
  choice: ஆனால் அவர்களை முற்றிலும் வெளியேற்றவில்லை
  rationale: வினையெச்சப் பெயருருவும் வினைச்சொல்லும் சேர்ந்த எபிரெயக் கட்டமைப்பு மறுக்கப்பட்ட செயலுக்கு அழுத்தம் தருகிறது; ‘முற்றிலும் ... இல்லை’ அதை வெளிப்படுத்துகிறது. ஒருமைச் சுட்டுப்பெயர் கானானிய மக்களைத் தொகுப்பாகக் குறிக்கிறது.
theological_decisions:
- issue: கானானியர்களை இஸ்ரவேல் நடத்திய விதம்
  choice: இஸ்ரவேல் கானானியர்களை முழுமையாக வெளியேற்றாமல் கட்டாய உழைப்புக்கு உட்படுத்தியது
  alternative: அவர்கள் வெறும் கப்பம் செலுத்தும்படி செய்யப்பட்டனர்
  rationale: לָמַס என்பது நடுநிலையான வரி அல்லது கப்பத்தைக் காட்டிலும் ஆளும் வல்லமை விதித்த கட்டாய உழைப்பைக் குறிக்கிறது; உரையின் வற்புறுத்தல் தன்மையை மென்மையாக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கட்டாய உழைப்பு’ வற்புறுத்தலை மறைக்காமல் கூறுகிறது; ‘முற்றிலும் வெளியேற்றவில்லை’ எபிரெய வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
