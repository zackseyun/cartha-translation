  terminology: “கானானியர்கள்,” “கட்டாய உழைப்பு,” “வெளியேற்றவில்லை” ஆகிய சொல் தேர்வுகள் நிலையானவை, புரிந்துகொள்ளத்தக்கவை, மற்றும் உரையின் வற்புறுத்தல் பொருளை மென்மையாக்காதவை. அடிக்குறிப்புகள் சொற்பொருள் மாற்றையும் எபிரெய ஒருமை வடிவத்தின் கூட்டுப் பயன்பாட்டையும் சரியாக விளக்குகின்றன; அவற்றின் குறியீட்டு இடங்களும் தொடர்புடைய சொற்றொடர்களோடு சரியாக இணைக்கப்பட்டுள்ளன.
