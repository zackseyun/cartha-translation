  to: காலேப், “கீரியாத்-சேப்பேரைத் தாக்கிக் கைப்பற்றுகிறவன் எவனோ, அவனுக்கு என் மகள் அக்சாவை மனைவியாகக் கொடுப்பேன்” என்றார்.[a]
