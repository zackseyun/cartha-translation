  text: וַ/יֹּ֣אמֶר כָּלֵ֔ב אֲשֶׁר יַכֶּ֥ה אֶת קִרְיַת סֵ֖פֶר וּ/לְכָדָ֑/הּ וְ/נָתַ֥תִּי ל֛/וֹ אֶת עַכְסָ֥ה בִתִּ֖/י לְ/אִשָּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/012.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him my daughter Achsah as a wife.”
translation:
  language: ta
  text: காலேப், “கீரியாத்-சேப்பேரைத் தாக்கிக் கைப்பற்றுகிறவன் எவனோ, அவனுக்கு என் மகள் அக்சாவை மனைவியாகக் கொடுப்பேன்” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கீரியாத்-சேப்பேரைத் தாக்கிக் கைப்பற்றுகிறவனுக்கு என் மகள் அக்சாவை மனைவியாகக் கொடுப்பேன்.”
    reason: אֲשֶׁר-ஆல் தொடங்கும் தொடர்புத்தொடரைத் தமிழில் வேறு இயல்பான வாக்கிய அமைப்பில் வழங்கலாம்.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: வாவ்-தொடர்நிலை கதையை முன்னெடுக்கிறது; தமிழில் மேற்கோளின் முடிவில் வரும் ‘என்றார்’ இயல்பான கதைநடை வடிவம்.
- source_word: כָּלֵב
  choice: காலேப்
  rationale: எபிரேய தனிப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: אֲשֶׁר
  choice: எவனோ
  rationale: குறிப்பிடப்படாத ஒருவரைச் சுட்டும் தொடர்புத்தொடரைத் திறந்த சவாலாகப் பிரதிபலிக்கிறது; மாற்றாக ‘யார் ... அவனுக்கு’ எனலாம்.
- source_word: יַכֶּה
  choice: தாக்கி
  rationale: נכה என்பதன் இராணுவச் சூழலிலான ‘தாக்குதல்’ பொருளைப் பாதுகாக்கிறது; அடுத்த வினை வெற்றிகரமான கைப்பற்றுதலைத் தனியே குறிப்பிடுகிறது.
- source_word: קִרְיַת סֵפֶר
  choice: கீரியாத்-செப்பேர்
  rationale: இடப்பெயரை எபிரேய ஒலிக்கு அண்மையாக ஒலிபெயர்க்கிறது.
- source_word: וּלְכָדָהּ
  choice: கைப்பற்றுகிறவன்
  rationale: לכד என்பதன் இராணுவச் சூழலிலான நகரைக் கைப்பற்றுதல் என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וְנָתַתִּי לוֹ
  choice: அவனுக்கு ... கொடுப்பேன்
  rationale: வெற்றியை நிபந்தனையாகக் கொண்ட காலேபின் எதிர்கால வாக்குறுதியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַכְסָה
  choice: அக்சாள்
  rationale: எபிரேய பெண்பெயரின் ஒலிபெயர்ப்பு; வேற்றுமை உருபுடன் ‘அக்சாளை’ என வருகிறது.
- source_word: בִתִּי
  choice: என் மகள்
  rationale: மகள் என்ற குடும்ப உறவையும் முதலாம் நபர் உடைமையையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: לְאִשָּׁה
  choice: மனைவியாக
  rationale: ஒரு பெண்ணைத் திருமணம் செய்து கொடுப்பதைக் குறிக்கும் எபிரேய மரபுத்தொடரின் இயல்பான தமிழ் வடிவம்.
