  text: וַ/יַּרְאֵ/ם֙ אֶת מְב֣וֹא הָ/עִ֔יר וַ/יַּכּ֥וּ אֶת הָ/עִ֖יר לְ/פִי חָ֑רֶב וְ/אֶת הָ/אִ֥ישׁ וְ/אֶת כָּל מִשְׁפַּחְתּ֖/וֹ שִׁלֵּֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/025.yaml
  text: So he showed them the entrance to the city[a], and they struck the city with the edge of the sword[b]; but they let the man and all his family go.
translation:
  language: ta
  text: அவன் அவர்களுக்கு நகரத்திற்குள் செல்லும் வழியைக் காட்டினான். அவர்கள் அந்த நகரத்தை வாளால் வெட்டினார்கள்[a]; ஆனால் அந்த மனிதனையும் அவனுடைய குடும்பத்தார் அனைவரையும்[b] போக விட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், சொல்லுக்குச் சொல், ‘வாளின் வாயால்’; இது வாளால் வெட்டுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘அவனுடைய வீட்டார் அனைவரையும்’ அல்லது ‘அவனுடைய குலத்தார் அனைவரையும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְאֵם
  choice: அவன் அவர்களுக்குக் காட்டினான்
  rationale: ראה என்ற வேரின் இவ்வடிவம் இச்சூழலில் ஒருவரைக் காணச் செய்வது அல்லது வழியைக் காட்டுவது என்ற பொருளைத் தருகிறது; நவீன தமிழில் ‘காட்டினான்’ இயல்பாக உள்ளது.
- source_word: מְבוֹא הָעִיר
  choice: நகரத்திற்குள் செல்லும் வழி
  rationale: מָבוֹא என்பது நுழைவிடம், உள்ளே செல்லும் வழி அல்லது அணுகுவழி எனப் பொருள்படும். இராணுவச் சூழலில் மறைந்திருக்கக்கூடிய நுழைவழியை இயல்பாகச் சுட்டும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּכּוּ
  choice: தாக்கினார்கள்
  rationale: נכה என்பது அடித்தல், தாக்குதல், முறியடித்தல் போன்ற பரந்த பொருளுடைய வினை. தொடர்ந்து வரும் வாள் பற்றிய சொற்றொடருடன் சேர்ந்து, இங்கு ‘தாக்கினார்கள்’ என்பது வினையின் பரப்பை மிகைப்படுத்தாமல் தருகிறது.
- source_word: לְפִי חָרֶב
  choice: வாளால்
  rationale: சொல்லுக்குச் சொல் ‘வாளின் வாயால்’ என வரும் எபிரெய மரபுத்தொடர், வாளால் கொல்வதையோ தாக்குவதையோ குறிக்கிறது. தமிழில் இயல்பாக ‘வாளால்’ எனத் தரப்பட்டு, மூல உருவகம் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: குறிப்பிட்ட மனிதனைச் சுட்டும் definite noun முந்தைய வசனத்தில் வந்த நபரையே குறிக்கிறது; தமிழ்க் கதையோட்டத்தில் ‘அந்த மனிதன்’ தெளிவாக உள்ளது.
- source_word: כָּל מִשְׁפַּחְתּוֹ
  choice: அவனுடைய குடும்பத்தார் அனைவரும்
  rationale: מִשְׁפָּחָה குடும்பம், விரிவடைந்த குடும்பம் அல்லது குலக்குழு எனப் பொருள்படலாம். ‘குடும்பத்தார் அனைவரும்’ முதன்மைப் பொருளை இயல்பாகத் தருகிறது; அகன்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שִׁלֵּחוּ
  choice: போகவிட்டார்கள்
  rationale: இச்சூழலில் அந்த மனிதனையும் அவனைச் சேர்ந்தவர்களையும் கொல்லாமல் விடுவித்து அனுப்பியதைக் குறிக்கிறது; ‘போகவிட்டார்கள்’ நவீன தமிழில் இயல்பானது.
