  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான கதையுரை பயன்படுத்தப்பட்டுள்ளது. ‘நகரத்தைத் தாக்கினார்கள்’ என்பது மூலத்தின் நகரத்தை ஒருமைப் பொருளாகச் சுட்டும் உருவகப் பயன்பாட்டைப் பாதுகாக்கிறது; ‘அழித்தார்கள்’ அல்லது ‘அனைவரையும் கொன்றார்கள்’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத விளக்கங்கள் சேர்க்கப்படவில்லை.
