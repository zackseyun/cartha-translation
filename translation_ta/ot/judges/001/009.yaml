source:
  edition: WLC
  text: וְ/אַחַ֗ר יָֽרְדוּ֙ בְּנֵ֣י יְהוּדָ֔ה לְ/הִלָּחֵ֖ם בַּֽ/כְּנַעֲנִ֑י יוֹשֵׁ֣ב הָ/הָ֔ר וְ/הַ/נֶּ֖גֶב וְ/הַ/שְּׁפֵלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/009.yaml
  text: Afterward[a], the sons of Judah went down to fight against the Canaanites living in the hill country, the Negev, and the lowland.
translation:
  language: ta
  text: அதன்பின், யூதாவின் மகன்கள் மலைநாட்டிலும் நெகேபிலும் தாழ்நிலத்திலும்[a] குடியிருந்த கானானியர்களுக்கு எதிராகப் போரிட இறங்கிச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாழ்நிலம்” என்பதை “ஷெஃபெலா” என்றும் மொழிபெயர்க்கலாம்; இது மலைநாட்டுக்கும் கடற்கரைச் சமவெளிக்கும் இடையிலுள்ள யூதேயாவின் மலை அடிவாரப் பகுதி.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: அதன்பின்
  rationale: அடுத்ததாக நிகழ்ந்த செயலைக் குறிக்கும் காலத் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; இடைப்பட்ட காலத்தின் நீளத்தைத் தேவையின்றி வரையறுக்கவில்லை.
- source_word: יָרְדוּ
  choice: இறங்கிச் சென்றார்கள்
  rationale: ירד என்பதன் கீழ்நோக்கிய நிலவியல் இயக்கத்தைத் தக்கவைக்கிறது; வெறுமனே ‘சென்றார்கள்’ என்று சமப்படுத்தவில்லை.
- source_word: בְּנֵי יְהוּדָה
  choice: யூதாவின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் ‘யூதாவின் மகன்கள்’ என்ற வடிவத்தைத் தக்கவைக்கிறது; சூழலில் இது யூதா கோத்திரத்தாரைக் கூட்டாகக் குறிக்கிறது.
- source_word: לְהִלָּחֵם
  choice: போரிட
  rationale: לחם வினையின் ‘சண்டையிடுதல்/போரிடுதல்’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: בַּכְּנַעֲנִי
  choice: கானானியர்களுக்கு எதிராக
  rationale: எபிரெயில் ஒருமை வடிவம் இருந்தாலும் அது இங்கு ஓர் இனக்குழுவைக் கூட்டாகக் குறிக்கிறது; போரின் பகைமைச் சூழலை ‘எதிராக’ தெளிவாக்குகிறது.
- source_word: יוֹשֵׁב
  choice: குடியிருந்த
  rationale: ישב பங்கேற்பு வடிவத்தின் தொடர்ச்சியான வாழிடம்/குடியிருப்பு பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הָהָר
  choice: மலைநாடு
  rationale: ஒரு தனி மலையை அல்லாமல் நிலவியல் உயர்நிலப் பகுதியைக் குறிக்கும் பயன்பாட்டைச் சரியாகத் தருகிறது.
- source_word: הַנֶּגֶב
  choice: நெகேபு
  rationale: நிலவியல் பகுதிகளின் பட்டியலில் வருவதால், பொதுவான ‘தென்பகுதி’ என்பதற்குப் பதிலாக குறிப்பிட்ட பிரதேசப் பெயரைத் தக்கவைக்கிறது.
- source_word: הַשְּׁפֵלָה
  choice: தாழ்நிலம்
  rationale: யூதேயாவின் மலைநாட்டுக்கும் கடற்கரைச் சமவெளிக்கும் இடையிலுள்ள தாழ்ந்த அடிவாரப் பகுதியைக் குறிக்கும் சொல்லை வாசகருக்கு எளிதாக மொழிபெயர்க்கிறது.
