translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான வேதாகமக் கதைநடை. மூலத்தின் நிலவியல் திசைப் பொருளும் மூன்று பிரதேசங்களின் தனித்தன்மையும் தக்கவைக்கப்பட்டுள்ளன. அடிக்குறி குறியீடு தொடர்புடைய ‘தாழ்நிலம்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
