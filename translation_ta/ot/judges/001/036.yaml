  text: וּ/גְבוּל֙ הָ/אֱמֹרִ֔י מִֽ/מַּעֲלֵ֖ה עַקְרַבִּ֑ים מֵ/הַ/סֶּ֖לַע וָ/מָֽעְלָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/036.yaml
  text: And the border of the Amorites was from the Ascent of Akrabbim[b][a], from Sela and upward.
translation:
  language: ta
  text: மேலும், அமோரியரின் எல்லை அக்ரப்பீம் ஏற்றத்திலிருந்து[a], சேலாவிலிருந்து[b] மேல்நோக்கி இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அக்ரப்பீம் என்பதற்கு ‘தேள்கள்’ என்று பொருள்; அல்லது, ‘தேள்களின் ஏற்றம்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, சேலா என்பதை இடப்பெயராக அல்லாமல் பொதுப்பெயராக எடுத்தால், ‘பாறையிலிருந்து.’
    reason: alternative_reading
lexical_decisions:
- source_word: גְבוּל
  choice: எல்லை
  rationale: இச்சொல் இங்கு முழுப் பகுதியைக் காட்டாமல் புவியியல் எல்லைக்கோட்டைக் குறிக்கிறது.
- source_word: הָאֱמֹרִי
  choice: எமோரியரின்
  rationale: எபிரெயத்தில் ஒருமை வடிவிலிருந்தாலும், இனக்குழுவைக் கூட்டாகக் குறிக்கிறது; தமிழில் உடைமைத் தொடர்புடன் பன்மைக் கூட்டு வடிவம் இயல்பானது.
- source_word: מִמַּעֲלֵה עַקְרַבִּים
  choice: அக்ரப்பீம் ஏற்றத்திலிருந்து
  rationale: מַעֲלֵה என்பது ஏற்றத்தைக் குறிக்கிறது; עַקְרַבִּים அறியப்பட்ட இடப்பெயரின் பகுதி என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது. அதன் சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מֵהַסֶּלַע
  choice: சேலாவிலிருந்து
  rationale: புவியியல் சூழலில் இதை சேலா என்ற இடப்பெயராகக் கொள்வது பொருத்தமானது; பொதுப்பெயராக ‘பாறையிலிருந்து’ என்றும் வாசிக்கக்கூடிய தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וָמָעְלָה
  choice: மேல்நோக்கி
  rationale: அந்த இடத்திலிருந்து மேலான திசையில் அல்லது அதற்கு அப்பால் எல்லை தொடர்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וּ
  choice: மேலும் தனியே மொழிபெயர்க்கப்படவில்லை
  rationale: எபிரெய இணைப்புச்சொல் முந்தைய வசனத்தோடு இவ்வாக்கியத்தை இணைக்கிறது; தனி வசனமாக இயல்பான தமிழில் தொடக்க ‘மற்றும்’ தேவையில்லை.
