  text: And the LORD said, “Judah shall go up. Look, I have given the land into his hand.”
translation:
  language: ta
  text: ஆண்டவர், “யூதா மேலே செல்லட்டும். இதோ, அந்த நிலத்தை அவன் கையில் கொடுத்துவிட்டேன்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தமிழ் வேதாகம நடையில் இறைநாமத்தைக் குறிக்க இயல்பாகவும் மரியாதையாகவும் பயன்படும் வடிவம்; மூலத்தில் உள்ள தனிப்பட்ட இறைநாமத்தை பொதுவான பட்டப்பெயராகக் காட்டும் மரபுசார் பிரதிநிதித்துவம்.
- source_word: יַעֲלֶה
  choice: போகட்டும்
  rationale: இந்த இராணுவச் சூழலில் ‘மேலே செல்லுதல்/படையெடுத்துச் செல்லுதல்’ என்பதைக் குறிக்கிறது; தமிழில் இயல்பாக ‘போகட்டும்’ என வழங்கப்பட்டது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து அடுத்த அறிவிப்பை வலியுறுத்தும் மூலச்சொல்லின் செயல்பாட்டை நேரடியாகப் பாதுகாக்கிறது.
- source_word: נָתַתִּי
  choice: கொடுத்துவிட்டேன்
  rationale: எபிரெய நிறைவுற்ற வினை வடிவத்தின் உறுதியையும் நிறைவேற்றப்பட்டதாகக் கூறும் நுணுக்கத்தையும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ
  choice: அந்த நாட்டை
  rationale: சூழலில் கைப்பற்றப்பட வேண்டிய பிரதேசத்தைக் குறிக்கிறது; ‘நிலம்’ என்பதைக் காட்டிலும் ‘நாடு’ தமிழில் இங்கு தெளிவானது.
- source_word: בְיָדוֹ
  choice: அவன் கையில்
  rationale: வெற்றி அல்லது அதிகாரத்துக்குள் ஒப்படைத்தலைக் குறிக்கும் மூல உருவகத்தை அப்படியே காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: தமிழ் வாசகர்களுக்குப் பரிச்சயமான, மரியாதையான வேதாகம வழக்கைத் தேர்ந்தெடுக்கிறது; குறிப்பிட்ட உச்சரிப்பை உரையில் கட்டாயப்படுத்தவில்லை.
- issue: நாடு ஏற்கெனவே கொடுக்கப்பட்டதாகக் கூறும் நிறைவுற்ற வடிவம்
  choice: கொடுத்துவிட்டேன்
  alternative: கொடுப்பேன்
  rationale: மூலத்தின் நிச்சயமான, நிறைவுற்ற அறிவிப்பை எதிர்கால வாக்குறுதியாக மாற்றாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில் எளிமையான, கண்ணியமான நேரடி உரை. யூதாவை ஒரு கோத்திரக் குழுவாகக் குறிப்பிட்டாலும், மூலத்தில் உள்ள ஒருமை வினை மற்றும் ஒருமைச் சுட்டுப்பெயருக்கு ஏற்ப ‘போகட்டும்’, ‘அவன்’ என்பவை வைக்கப்பட்டுள்ளன.
