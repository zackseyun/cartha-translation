source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ הַ/שֹּׁ֣מְרִ֔ים אִ֖ישׁ יוֹצֵ֣א מִן הָ/עִ֑יר וַ/יֹּ֣אמְרוּ ל֗/וֹ הַרְאֵ֤/נוּ נָא֙ אֶת מְב֣וֹא הָ/עִ֔יר וְ/עָשִׂ֥ינוּ עִמְּ/ךָ֖ חָֽסֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/024.yaml
  text: The watchers saw a man coming out of the city[a], and they said to him, “Please show us the entrance to the city[b], and we will deal kindly with you.”
translation:
  language: ta
  text: கவனித்துக்கொண்டிருந்தவர்கள் நகரத்திலிருந்து வெளியே வந்துகொண்டிருந்த ஒரு மனிதனைக் கண்டார்கள். அவர்கள் அவனிடம், “தயவுசெய்து, நகரத்துக்குள் நுழையும் வழியை[a] எங்களுக்குக் காட்டு; நாங்கள் உன்னை நன்மையாக நடத்துவோம்[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நகரத்தின் நுழைவிடத்தை.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ஹெசெத் (חֶסֶד); சூழலுக்கேற்ப இது “தயவு,” “பற்றுறுதி,” அல்லது “மாறாத அன்பு” என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁמְרִים
  choice: காவல் பார்த்துக்கொண்டிருந்தவர்கள்
  rationale: שׁמר என்பதன் பன்மைப் பெயரெச்ச வடிவம், நகருக்கு வெளியே இருந்து கூர்ந்து கவனித்தவர்களைக் குறிக்கிறது. முறைப்படியான இராணுவப் பதவியைச் சுட்டாதபடி அதன் செயற்பொருளை இத்தேர்வு இயல்பாகத் தருகிறது.
- source_word: אִישׁ
  choice: ஒரு மனிதன்
  rationale: இங்கு ஒரே ஓர் ஆண் நபரை நேரடியாகக் குறிக்கிறது.
- source_word: יוֹצֵא
  choice: வெளியே வந்துகொண்டிருந்த
  rationale: יצא என்பதன் பெயரெச்சம் நகரிலிருந்து வெளிநோக்கி நிகழ்ந்த இயக்கத்தைக் காட்டுகிறது; பார்ப்பவர்களின் நோக்குநிலைக்கும் தொடரும் காட்சிக்கும் ஏற்ற தமிழாக்கம்.
- source_word: מְבוֹא
  choice: நுழையும் வழி
  rationale: நுழைவிடம் அல்லது உள்ளே செல்வதற்கான அணுகுவழி என்று பொருள்படும். இப்போர்ச் சூழலில் கட்டடவாயிலை மட்டும் குறுக்காமல் நகருக்குள் புகும் வழியை இயல்பாகக் குறிக்கிறது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: கட்டளையை மென்மைப்படுத்தும் வேண்டுகோள் இடைச்சொல்லுக்கான இயல்பான நவீனத் தமிழ் இணை.
- source_word: וְעָשִׂינוּ עִמְּךָ חָסֶד
  choice: நாங்கள் உனக்கு இரக்கம் காட்டுவோம்
  rationale: இச்சூழலில் חֶסֶד என்பது தகவலுக்குப் பதிலாக அவனை நன்மையாக நடத்துவதாக அளிக்கும் உறுதியைக் குறிக்கிறது. உடன்படிக்கை சார்ந்த பொருளைத் தேவையின்றி ஏற்றாமல், அவனுக்கு தீங்கு செய்யாமல் கருணையுடன் நடத்தும் கருத்தைத் தருகிறது.
theological_decisions:
- issue: חֶסֶד என்பதன் மொழிபெயர்ப்பு
  choice: இரக்கம் காட்டுவோம்
  alternative: அன்பாக நடத்துவோம்; மாறாத அன்பு காட்டுவோம்; உடன்படிக்கைப் பற்றுறுதியுடன் நடந்துகொள்வோம்
  rationale: חֶסֶד பல இடங்களில் அன்பு, பற்றுறுதி, மாறாத அன்பு போன்ற செறிவான பொருள்களைக் கொண்டிருந்தாலும், இக்கதைச் சூழலில் அந்த மனிதனுக்குத் தீங்கு செய்யாமல் நன்மையாக நடத்துவதாக அளிக்கப்படும் வாக்குறுதியே முதன்மையானது. எனவே உடன்படிக்கை சார்ந்த இறையியல் பொருளை இங்கு மிகைப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. “காவலர்கள்” என்பது நகரைக் காத்தவர்களைக் குறிக்கக்கூடும் என்பதால், முற்றுகையிட்ட தரப்பில் கவனித்துக்கொண்டிருந்தவர்களைத் தெளிவாக்க “காவல் பார்த்துக்கொண்டிருந்தவர்கள்” எனத் தரப்பட்டுள்ளது. மூலத்தின் வேண்டுகோள் தொனியும் חֶסֶד என்பதிலுள்ள பொருள் விரிவும் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
