  to: அப்போது யூதா மேலே சென்றான். யாவே கானானியர்களையும் பெரிசியர்களையும்[a] அவர்களுடைய கையில் ஒப்படைத்தார்[b]. அவர்கள் பெசெக்கில் பத்தாயிரம் ஆண்களை வீழ்த்தினார்கள்.
