  source_fidelity: 'திருத்தம் தேவை: וַיַּעַל என்பதன் ‘மேலே சென்றான்/ஏறிச் சென்றான்’ என்ற கூறை வரைவு ‘போருக்குச் சென்றான்’ என மாற்றுகிறது. போர்ச் சூழல் தெளிவானாலும், ‘போர்’ என்பதை வினைச்சொல்லிலேயே சேர்ப்பது மூலத்தைவிடக் குறிப்பானது. பிற கூறுகள்—யாவேயின் செயல், ‘அவர்களுடைய கையில்’ என்ற உருவகம், இறுதியில் வரும் பன்மை மனிதச் செயல், மற்றும் எண்ணிக்கை—மூலத்திற்கு உண்மையாக உள்ளன.'
