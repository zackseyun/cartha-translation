  text: וַ/יַּ֣עַל יְהוּדָ֔ה וַ/יִּתֵּ֧ן יְהוָ֛ה אֶת הַ/כְּנַעֲנִ֥י וְ/הַ/פְּרִזִּ֖י בְּ/יָדָ֑/ם וַ/יַּכּ֣וּ/ם בְּ/בֶ֔זֶק עֲשֶׂ֥רֶת אֲלָפִ֖ים אִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/004.yaml
  text: Then Judah went up[a], and Yahweh gave the Canaanites and the Perizzites into their hand[b], and they struck down ten thousand men at Bezek.
translation:
  language: ta
  text: அப்போது யூதா மேலே சென்றான். யாவே கானானியர்களையும் பெரிசியர்களையும்[a] அவர்களுடைய கையில் ஒப்படைத்தார்[b]. அவர்கள் பெசெக்கில் பத்தாயிரம் ஆண்களை வீழ்த்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘கானானியன், பெரிசியன்’ என்று ஒருமை வடிவங்கள் வருகின்றன; இங்கு அவை அந்த மக்களினங்களைக் கூட்டாகக் குறிக்கின்றன.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘அவர்களுடைய கையில்’; அதாவது, அவர்களுடைய அதிகாரத்திற்குள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: போருக்குச் சென்றான்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்’ என்பதாக இருந்தாலும், இங்குள்ள இராணுவச் சூழலில் யூதா போருக்குப் புறப்பட்டுச் சென்றதைக் குறிக்கிறது. இயல்பற்ற ‘மேலே சென்றான்’ என்பதைத் தவிர்த்து, சூழலை அளவுக்கு மீறி விரிவாக்காமல் இந்த மொழிபெயர்ப்பு தரப்படுகிறது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: கோத்திரத்தை ஒரு கூட்டு அமைப்பாகக் குறிக்கும் இயற்பெயர். எபிரெய ஒருமை வினைக்கு ஏற்ப முதலில் ஒருமையாக வைக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்து இறைப்பெயரின் பொதுவாக ஏற்றுக்கொள்ளப்படும் உச்சரிப்பைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: הַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: கானானியர்களையும் பெரிசியர்களையும்
  rationale: இரு சொற்களும் இலக்கண வடிவில் ஒருமையாக இருந்தாலும், இங்கு மக்களினங்களைக் கூட்டாகக் குறிக்கின்றன; எனவே இயல்பான தமிழில் பன்மையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּיָדָם
  choice: அவர்களுடைய கையில்
  rationale: ‘அவர்களுடைய அதிகாரத்திற்குள்’ என்ற பொருளுடைய எபிரெய உருவகத்தைப் பாதுகாக்கிறது; ‘கை’ என்ற ஒருமை வடிவமும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: וַיַּכּוּם
  choice: வீழ்த்தினார்கள்
  rationale: נכה என்பது அடித்தல், முறியடித்தல், கொல்லுதல் ஆகிய பொருள் பரப்பைக் கொண்டது. போர்ச் சூழலின் வன்மையைத் தக்கவைத்தும், அனைவரும் கொல்லப்பட்டார்கள் என்று உரை கூறுவதைவிட அதிகமாகத் தீர்மானிக்காமலும் ‘வீழ்த்தினார்கள்’ அமைகிறது.
- source_word: בְּבֶזֶק
  choice: பெசெக்கில்
  rationale: ב என்ற முன்னொட்டு இங்கு போரின் இடத்தைக் குறிக்கிறது; தமிழில் இடப்பெயருடன் ‘-இல்’ இயல்பாக அமைகிறது.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: பத்தாயிரம் ஆண்களை
  rationale: எபிரெய உரையின் எண்ணிக்கையையும் אישׁ என்பதன் ஆண்பால் குறிப்பையும் வெளிப்படையாகத் தக்கவைக்கிறது; ‘வீரர்கள்’ என்பது உரையில் இல்லாத கூடுதல் விளக்கம்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: தனிப்பட்ட இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது; ‘யாவே’ என்பது மறுகட்டமைக்கப்பட்ட எபிரெய உச்சரிப்புக்கு நெருக்கமான நவீன தமிழ் வடிவம்.
- issue: இறைச் செயலுக்கும் மனிதச் செயலுக்கும் இடையிலான தொடர்பு
  choice: யாவே எதிரிகளை ஒப்படைக்கிறார்; யூதாவின் மக்கள் அவர்களை வீழ்த்துகிறார்கள்
  alternative: முழு வசனத்தையும் யூதா என்ற ஒருமை எழுவாயோடு சீராக்குதல்
  rationale: வெற்றியைக் கொடுக்கும் இறைச் செயலையும், போரிடும் மக்களின் செயலையும் எபிரெய உரை வேறுபடுத்துகிறது. ‘யூதா’ என்ற கூட்டு ஒருமையிலிருந்து ‘அவர்கள்’ என்ற பன்மைக்கு மாறுவதையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘யூதா’ என்பது கோத்திரத்தைச் சுட்டும் கூட்டு ஒருமையாகவும், பின்னர் வரும் ‘அவர்கள்’ அந்தக் கோத்திரத்தின் போர்வீரர்களைக் குறிக்கும் பன்மையாகவும் வைக்கப்பட்டுள்ளது. ‘வீழ்த்தினார்கள்’ என்பது போரின் வன்மையைக் காட்டுகிறது; ஆனால் נכה என்பதைக் கட்டாயமாக ‘கொன்றார்கள்’ என்று குறுக்கவில்லை.
