translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பென்யமீனின் வழிவந்தவர்கள்’ என்பது கோத்திர-வம்சப் பொருளைக் காத்தபடி ‘மகன்கள்’ என்பதால் ஏற்படக்கூடிய தனிநபர் சார்ந்த தவறான புரிதலைத் தவிர்க்கிறது. இரண்டு எபிரெய வாக்கியங்களின் காரண-விளைவு தொடர்பு தமிழில் ‘ஆகவே’ மூலம் தெளிவாகக் காட்டப்பட்டுள்ளது.
