base_translation:
  language: en
  yaml_path: translation/ot/judges/001/021.yaml
  text: But the sons of Benjamin did not drive out the Jebusites who were living in Jerusalem[a], so the Jebusites have lived with the sons of Benjamin in Jerusalem to this day.
translation:
  language: ta
  text: ஆனால் எருசலேமில் குடியிருந்த எபூசியர்களை[a] பென்யமீனின் வழிவந்தவர்கள் துரத்திவிடவில்லை. ஆகவே எபூசியர்கள் பென்யமீனின் வழிவந்தவர்களுடன் எருசலேமில் இந்நாள்வரை குடியிருந்து வருகின்றனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘எபூசியன்’; ஒருமை வடிவம் இங்கு அந்த மக்களினத்தை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: எபூசியர்கள்
  rationale: எபிரெய வடிவம் ஒருமையில் இருந்தாலும், அது எபூசிய மக்களினத்தைக் கூட்டாகக் குறிக்கிறது. நவீன தமிழில் பன்மை வடிவம் இதை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: יֹשֵׁב יְרוּשָׁלַם
  choice: எருசலேமில் குடியிருந்த
  rationale: பங்கேற்பு வினைச்சொல் தொடர்ந்து அங்கு வசித்த நிலையைக் குறிக்கிறது; ‘குடியிருந்த’ என்பது அந்த நீடித்த குடியிருப்பை இயல்பான தமிழில் தருகிறது.
- source_word: הוֹרִישׁוּ
  choice: துரத்திவிடவில்லை
  rationale: நிலத்திலிருந்து மக்களை அகற்றுதல் அல்லது வெளியேற்றுதல் என்ற வெற்றிகொள்ளல் சூழலிலுள்ள பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּנֵי בִנְיָמִן
  choice: பென்யமீனின் வழிவந்தவர்கள்
  rationale: சொல்லுக்குச் சொல் ‘பென்யமீனின் மகன்கள்’ என்றாலும், இங்கு தனிப்பட்ட மகன்கள் அல்லாமல் கோத்திர வழிவந்த மக்கள் குறிக்கப்படுகிறார்கள். தேர்ந்த வடிவம் வம்சத் தொடர்பையும் நவீனத் தமிழ் தெளிவையும் காக்கிறது.
- source_word: וַיֵּשֶׁב
  choice: குடியிருந்து வருகின்றனர்
  rationale: ‘இந்நாள்வரை’ என்ற தொடருடன் சேர்ந்து, கடந்த காலத்தில் தொடங்கி கதைசொல்லியின் காலம்வரை நீடித்த குடியிருப்பை இவ்வடிவம் வெளிப்படுத்துகிறது.
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: பென்யமீனின் வழிவந்தவர்களுடன்
  rationale: இங்குள்ள אֶת நேரடிச் செயப்படுபொருள் குறியீடாக அல்லாமல் உடனிருப்பைக் குறிக்கிறது; ‘உடன்’ என்பது இரு மக்களும் ஒரே இடத்தில் வசித்ததைத் தெளிவாக்குகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை
  rationale: கதைசொல்லியின் நிகழ்காலம்வரை நிலை தொடர்ந்ததைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கான இயல்பான, செம்மையான தமிழ் வடிவம்.
- source_word: וְ
  choice: ஆனால்
  rationale: சுற்றியுள்ள வெற்றிச் செய்திகளுக்கு மாறாக இங்கு வெளியேற்றத் தவறியதை அறிமுகப்படுத்துவதால், இணைப்புச் சொல்லின் எதிர்மறை மாறுபாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது.
