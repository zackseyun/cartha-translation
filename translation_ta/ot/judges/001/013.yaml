  text: וַֽ/יִּלְכְּדָ/הּ֙ עָתְנִיאֵ֣ל בֶּן קְנַ֔ז אֲחִ֥י כָלֵ֖ב הַ/קָּטֹ֣ן מִמֶּ֑/נּוּ וַ/יִּתֶּן ל֛/וֹ אֶת עַכְסָ֥ה בִתּ֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/013.yaml
  text: Othniel son of Kenaz[a], Caleb’s younger brother, captured it, and he gave him his daughter Achsah as a wife.
translation:
  language: ta
  text: கேனாசின் மகனும் காலேபின் இளைய சகோதரனுமான ஒத்னியேல் அந்த நகரைக் கைப்பற்றினார்.[a] காலேப் தம் மகள் அக்சாளை ஒத்னியேலுக்கு மனைவியாகக் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேனாசின் மகனான ஒத்னியேல், காலேபின் இளைய சகோதரன்.” எபிரெயத்தில் உள்ள ‘சகோதரன்’ என்ற சொல்லை விரிவான உறவுமுறையாகப் புரிந்துகொண்டால், “காலேபின் இளைய உறவினர்” என்றும் பொருள்கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: அந்த நகரைக் கைப்பற்றினார்
  rationale: לכד என்பது நகரத்தைப் போரில் கைப்பற்றுவதைக் குறிக்கிறது. பெண்பால் ஒருமை பின்னொட்டு முந்தைய வசனத்திலுள்ள நகரத்தைக் குறிப்பதால், தமிழில் தெளிவுக்காக ‘அந்த நகரை’ என வெளிப்படுத்தப்பட்டது.
- source_word: עָתְנִיאֵל
  choice: ஒத்னியேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எடுத்துரைக்கும் ஒலிபெயர்ப்பு.
- source_word: בֶּן קְנַז
  choice: கேனாசின் மகன்
  rationale: வம்ச உறவைக் குறிக்கும் எளிய எபிரெய கட்டமைப்பு நேரடியாகப் பாதுகாக்கப்பட்டது.
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: காலேபைவிட இளையவனான அவரது சகோதரன்
  rationale: சொற்றொடரின் இயல்பான பொருள் ‘காலேபின் சகோதரன், அவரைவிட இளையவன்’ என்பதாகும். ஒத்னியேல் காலேபைவிட இளையவர் என்ற ஒப்பீட்டையும் சகோதர உறவையும் தெளிவாக வைத்திருக்கிறது.
- source_word: וַיִּתֶּן לוֹ
  choice: ஆகவே காலேப் ... அவருக்குக் கொடுத்தார்
  rationale: எபிரெயத்தில் சுட்டுப்பெயர்கள் இருந்தாலும், தமிழில் இரு ஆண் நபர்களுக்கிடையிலான செயலைத் தெளிவாக்கச் சூழலால் உறுதியாக அறியப்படும் காலேபின் பெயர் வெளிப்படுத்தப்பட்டது; வாக்குறுதியின் விளைவைக் காட்ட ‘ஆகவே’ பயன்படுத்தப்பட்டது.
- source_word: עַכְסָה
  choice: அக்சாள்
  rationale: எபிரெய தனிப்பெயருக்கான தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு வடிவம்.
- source_word: בִתּוֹ
  choice: தம் மகள்
  rationale: உடைமைச் சுட்டு காலேபைக் குறிக்கிறது. எழுவாயோடு இயல்பாக இணையும் மரியாதைத் தற்சுட்டு வடிவம் பயன்படுத்தப்பட்டது.
- source_word: לְאִשָּׁה
  choice: மனைவியாக
  rationale: ஒரு பெண்ணை மண உறவில் கொடுப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் இயல்பான, சுருக்கமான தமிழ் வடிவம்.
theological_decisions:
- issue: ஒத்னியேலுக்கும் காலேபுக்கும் இடையிலான உறவு
  choice: முதன்மை உரையில் ஒத்னியேல் காலேபைவிட இளைய அவரது சகோதரன் என மொழிபெயர்க்கப்பட்டது.
  alternative: ஒத்னியேல் காலேபின் இளைய உறவினர் அல்லது மருமகன் எனப் புரிந்துகொள்ளலாம்.
  rationale: אֲחִי என்பதன் நேரடிப் பொருள் ‘சகோதரன்’; הַקָּטֹן מִמֶּנּוּ என்பது ‘அவரைவிட இளையவன்’ என இயல்பாக வாசிக்கப்படுகிறது. உறவுச் சொல்லை விரிவான குல உறவாகக் கொள்ளும் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் உரை. எபிரெய வாக்கியத்தின் உறவுமுறைச் சிக்கல் முதன்மை உரையில் இயல்பான வாசிப்போடும் அடிக்குறிப்பில் மாற்றுப் புரிதலோடும் பாதுகாக்கப்பட்டது.
