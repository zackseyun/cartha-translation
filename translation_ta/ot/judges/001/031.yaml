base_translation:
  language: en
  yaml_path: translation/ot/judges/001/031.yaml
  text: Asher did not drive out the inhabitants of Acco[a], or the inhabitants of Sidon, or Ahlab, or Achzib, or Helbah, or Aphek[b], or Rehob.
translation:
  language: ta
  text: ஆசேர் கோத்திரத்தார், அக்கோவில்[b] குடியிருந்தவர்களையோ, சீதோனில் குடியிருந்தவர்களையோ, அக்லாப், அக்சீப், ஹெல்பா, அப்பேக், ரெகோப் ஆகிய இடங்களில் குடியிருந்தவர்களையோ துரத்திவிடவில்லை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உடைமையிலிருந்து அகற்றவில்லை’ அல்லது ‘வெளியேற்றவில்லை’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல், ஏற்கெனவே நிலத்தில் குடியிருந்தவர்களின் நில உரிமையை இழக்கச் செய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அக்கோ என்பது பிற்காலத்தில் ‘ஏக்கர்’ என்று அறியப்பட்ட பண்டைய கடற்கரை நகரம்.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: துரத்திவிடவில்லை
  rationale: ירש என்பதன் ஹிஃபில் வடிவம், கைப்பற்றுதல் தொடர்பான சூழலில், முன்பு நிலத்தை உடைமையாகக் கொண்டிருந்தவர்களை அங்கிருந்து அகற்றுவதைக் குறிக்கிறது. ‘துரத்திவிடவில்லை’ என்பது நவீன தமிழில் இயல்பாகவும் நீதித் தலைவர்கள் 1-ஆம் அதிகாரத்தின் தொடர்ச்சியான சொல்லாட்சிக்கு ஏற்றதாகவும் உள்ளது; உடைமையிலிருந்து அகற்றுதல் என்ற நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יֹשְׁבֵי
  choice: குடியிருந்தவர்கள்
  rationale: ישב என்பதன் பங்கேற்புவினை வடிவம் ஓர் இடத்தில் வசிப்பவர்களை ஒரு கூட்டமாகக் குறிக்கிறது. ‘குடியிருந்தவர்கள்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: עַכּוֹ
  choice: அக்கோ
  rationale: இடப்பெயர் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிக்கு நெருக்கமாக ஒலிபெயர்க்கப்படுகிறது. பின்னாளைய ‘ஏக்கர்’ என்ற பெயரால் ஏற்படக்கூடிய காலவழுவைத் தவிர்க்கிறது.
- source_word: צִידוֹן
  choice: சீதோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம்; மூல இடப்பெயரை அடையாளம் காண உதவுகிறது.
- source_word: אַחְלָב
  choice: அக்லாப்
  rationale: மூல எபிரெய இடப்பெயரின் மெய்யெழுத்து அமைப்பைத் தமிழில் இயன்றவரை நெருக்கமாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: אַכְזִיב
  choice: அக்சீப்
  rationale: மூல எபிரெய இடப்பெயருக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: חֶלְבָּה
  choice: ஹெல்பா
  rationale: இவ்வசனத்தின் எபிரெய வடிவத்தைப் பின்பற்றும் ஒலிபெயர்ப்பு; வேறு உரைமரபுகளில் காணப்படும் ‘ஹெலேப்’ போன்ற வடிவத்தை இங்கு ஏற்கவில்லை.
- source_word: אֲפִיק
  choice: ஆப்பேக்
  rationale: இந்த இடப்பெயரின் வழக்கமான வேதாகம வடிவத்தை அடையாளம் காணக்கூடிய தமிழ் ஒலிபெயர்ப்பு.
- source_word: רְחֹב
  choice: ரெகோப்
  rationale: மூல இடப்பெயரின் ஒலியைத் தமிழில் நெருக்கமாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: וְ/אֶת ... וְ/אֶת
  choice: -களையோ ... -களையோ ... ஆகிய இடங்களில் குடியிருந்தவர்களையோ
  rationale: மறுப்பு வினைக்குப் பின் வரும் தொடர்ச்சியான நேரடிச் செயப்படுபொருட்களைத் தமிழில் பகிர்நிலையாகவும் இயல்பாகவும் காட்ட ‘-ஓ’ இணைப்பு பயன்படுத்தப்பட்டுள்ளது. ஊர்ப்பெயர்களின் பட்டியலை இறுதியில் ‘ஆகிய இடங்களில் குடியிருந்தவர்கள்’ என்பதுடன் இணைப்பது மூலத்தின் பொருளைத் தெளிவாக்குகிறது.
