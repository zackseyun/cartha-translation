  source_fidelity: 'மூல எபிரெயத்தின் பொருள் துல்லியமாகக் கொடுக்கப்பட்டுள்ளது: ஆசேர் அந்த நகரங்களில் வசித்த மக்களை வெளியேற்றவில்லை. பின்வரும் நகரப் பட்டியலுக்குப் பின்னர் மட்டுமே ‘குடியிருந்தவர்கள்’ என்பதைத் தொகுத்துச் சொல்வது, எபிரெயத்தில் உள்ள நீள்வட்டமான பட்டியலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. ஆனால் אֲפִיק என்பதற்கான ‘ஆப்பேக்’ வடிவத்தில் தொடக்க நெடில் தேவையில்லை; ‘அப்பேக்’ மூல ஒலிக்கு நெருக்கமானது.'
