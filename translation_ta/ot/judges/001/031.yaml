translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குத் தெளிவாகவும் கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘ஆசேர்’ தனிநபரைக் குறிக்கிறதுபோல் தவறாகப் புரியாதிருக்க, இங்கு கோத்திரத்தைச் சுட்டும் பொருளை வெளிப்படுத்த ‘ஆசேர் கோத்திரத்தார்’ எனத் தெளிவாக்கப்பட்டுள்ளது. எபிரெயத்தில் திரும்பத் திரும்ப வரும் செயப்படுபொருள் பட்டியல், தமிழில் இயல்பாக இருக்க ‘-ஓ’ அமைப்பாலும் இறுதிக் கூட்டுச் சொற்றொடராலும் வழங்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சொற்களோடு நேரடியாக இணைக்கப்பட்டுள்ளன.
