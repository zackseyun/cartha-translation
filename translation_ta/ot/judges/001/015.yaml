  terminology: ‘ஆசீர்வாதம்’ properly preserves בְּרָכָה, even though the immediate sense is a beneficial grant. ‘நீரூற்றுகள்’ is a sound contextual rendering of גֻּלֹּת, with the uncertainty responsibly stated in the note. ‘நெகேபின் நிலம்’ is retained as a geographic rendering, with the southland alternative footnoted.
