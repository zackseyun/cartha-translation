base_translation:
  language: en
  yaml_path: translation/ot/judges/001/015.yaml
  text: She said to him[a], “Please give me a blessing, because you have given me the land of the Negev[b]; give me also springs of water.” So Caleb gave her the upper springs and the lower springs.
translation:
  language: ta
  text: அவள் அவரிடம், “தயவுசெய்து எனக்கு ஓர் ஆசீர்வாதம் தாரும். நீர் எனக்கு நெகேபின் நிலத்தைக்[a] கொடுத்திருக்கிறீர்; நீரூற்றுகளையும்[b] எனக்குத் தாரும்” என்றாள். ஆகவே காலேப் அவளுக்கு மேலுள்ள நீரூற்றுகளையும் கீழுள்ள நீரூற்றுகளையும் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தென்பகுதியின் நிலம்’ என்றும் மொழிபெயர்க்கலாம். எபிரேய நெகேப் என்பது ‘நெகேப்’ என்ற நிலப்பகுதியின் பெயராகவோ, தெற்கிலுள்ள வறண்ட நிலத்தைக் குறிக்கும் விளக்கமாகவோ அமையலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள எபிரேயச் சொற்றொடர் ஊற்றுகள், குளங்கள் அல்லது பிற நீராதாரங்களைக் குறிக்கலாம். வறண்ட பகுதிக்குத் தொடர்ந்து நீர் வழங்கும் ஆதாரங்கள் தேவைப்படும் இச்சூழலில் ‘நீரூற்றுகள்’ என்பது சிறப்பாகப் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה לִּי
  choice: தயவுசெய்து எனக்கு ... தாரும்
  rationale: வேண்டுகோளாக அமைந்துள்ள எபிரேய கட்டளையின் வலிமையையும், தந்தையிடம் மரியாதையுடன் கேட்கும் சூழலையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְרָכָה
  choice: ஓர் ஆசீர்வாதம்
  rationale: இச்சூழலில் பயனளிக்கும் கொடையைக் குறித்தாலும், மூலச்சொல்லின் நேரடிப் பொருளான ‘ஆசீர்வாதம்’ என்பதையும் குடும்ப உறவுச் சூழலையும் தக்கவைக்கிறது.
- source_word: אֶרֶץ הַנֶּגֶב
  choice: நெகேபின் நிலம்
  rationale: נֶגֶב என்பது தெற்கிலுள்ள வறண்ட நிலப்பகுதியின் பெயராகவும் ‘தென்பகுதி’ என்ற நிலவியல் விளக்கமாகவும் அமையலாம். முதன்மை உரையில் இடப்பெயரை வைத்துப் பிற வாய்ப்பை அடிக்குறிப்பில் தருகிறது.
- source_word: גֻּלֹּת מָיִם
  choice: நீரூற்றுகள்
  rationale: இச்சொற்றொடர் ஊற்றுகள், குளங்கள் அல்லது வேறு நீராதாரங்களைக் குறிக்கக்கூடும்; வறண்ட நிலத்திற்கு நம்பகமான நீர் தேவைப்படும் சூழலில் ‘நீரூற்றுகள்’ மிகவும் இயல்பாகப் பொருந்துகிறது.
- source_word: גֻּלֹּת עִלִּית
  choice: மேல் நீரூற்றுகள்
  rationale: עִלִּית என்பதன் ‘மேல்/உயரமான’ பொருளைக் காத்து, முந்தைய நீராதாரச் சொல்லுடன் ஒருமைப்பாட்டை நிலைநிறுத்துகிறது.
- source_word: גֻּלֹּת תַּחְתִּית
  choice: கீழ் நீரூற்றுகள்
  rationale: תַּחְתִּית என்பதன் ‘கீழ்/தாழ்வான’ பொருளைக் காத்து, ‘மேல் நீரூற்றுகள்’ என்பதற்கு இயல்பான இணையாக அமைகிறது.
- source_word: וַיִּתֶּן לָהּ
  choice: ஆகவே காலேப் அவளுக்கு ... கொடுத்தார்
  rationale: அவளுடைய வேண்டுகோளுக்குக் காலேப் அளித்த பதிலைத் தொடர்ச்சியாகவும் விளைவாகவும் காட்டும் எபிரேய கதைநடையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
