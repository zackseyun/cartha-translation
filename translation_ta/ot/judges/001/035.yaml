  source_fidelity: மொத்தத்தில் மூலத்தின் தொடர்ச்சியான குடியிருப்பு, யோசேப்பின் வீட்டாரின் அதிகரித்த வல்லமை, அதன்பின் எமோரியர்மீது விதிக்கப்பட்ட கட்டாய உழைப்பு ஆகியவற்றைத் துல்லியமாகத் தருகிறது. ஆனால் חֶרֶס என்ற இடப்பெயரில் தொடக்க மெய்யொலி விடுபட்டுள்ளது; ‘ஏரேசு’ என்பதற்குப் பதில் ‘ஹெரெஸ்’ என்பது மூல ஒலிக்கு நெருக்கமானது. הַר-ஐ ‘மலைப்பகுதி’ எனக் குறிப்பது சாத்தியமானாலும், இவ்வசனத்தில் ‘மலை’ என்பது அதிக நேரடியானது.
