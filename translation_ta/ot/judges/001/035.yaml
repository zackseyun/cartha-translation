base_translation:
  language: en
  yaml_path: translation/ot/judges/001/035.yaml
  text: But the Amorites persisted in dwelling in Mount Heres[a], in Aijalon, and in Shaalbim; then the hand of the house of Joseph grew heavy[b], and they became subject to forced labor.
translation:
  language: ta
  text: ஆனால் எமோரியர்கள் ஹெரெஸ் மலையிலும், ஆயலோனிலும், சால்பீமிலும் தொடர்ந்து குடியிருக்க உறுதிகொண்டனர். பின்னர் யோசேப்பின் வீட்டாரின் அதிகாரம் வலுப்பெற்றது[a]; எமோரியர்கள் கட்டாய உழைப்புக்கு உட்பட்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “யோசேப்பின் வீட்டாரின் கை கனத்தது.” இந்த எபிரெயச் சொல்லடை அவர்களுடைய வல்லமை அல்லது அடக்கும் அதிகாரம் அதிகரித்ததைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவர்கள் கட்டாய உழைப்பாளர்களானார்கள்” அல்லது “உழைப்புக் கப்பம் செலுத்துகிறவர்களானார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் கட்டாயமாகச் செய்யப்படும் உழைப்புச் சேவையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: தொடர்ந்து குடியிருக்க உறுதிகொண்டனர்
  rationale: יָאַל என்ற வினை விருப்பம், துணிவு, தீர்மானம் ஆகிய பொருள்களைத் தரக்கூடும். இங்கு לָשֶׁבֶת என்பதோடு இணைந்து, எமோரியர்கள் அந்த இடங்களில் தொடர்ந்து தங்கியிருக்கத் தீர்மானித்ததைச் சூழல் காட்டுகிறது.
- source_word: הָאֱמֹרִי
  choice: எமோரியர்கள்
  rationale: எபிரெயத்தில் ஒருமை வடிவம் இருந்தாலும், இது ஓர் இனக்குழுவைக் கூட்டாகக் குறிக்கிறது; இறுதியில் வரும் பன்மை வினையும் இதை உறுதிப்படுத்துகிறது.
- source_word: בְּהַר חֶרֶס
  choice: ஏரேசு மலைப்பகுதியில்
  rationale: הַר என்பது ஒரு தனி மலையையோ மலைப்பகுதியையோ குறிக்கலாம். இடப்பெயரைப் பாதுகாத்து, தேவையற்ற துல்லியப்படுத்தலைத் தவிர்க்க ‘மலைப்பகுதி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּאַיָּלוֹן
  choice: ஆயலோனில்
  rationale: எபிரெய இடப்பெயரின் தமிழாக்கம்.
- source_word: וּבְשַׁעַלְבִים
  choice: சால்பீமில்
  rationale: எபிரெய இடப்பெயரின் தமிழாக்கம்; இணைப்புச்சொல்லின் உறவும் வாக்கியத்தில் தக்கவைக்கப்பட்டுள்ளது.
- source_word: וַתִּכְבַּד יַד
  choice: அதிகாரம் வலுப்பெற்றது
  rationale: சொல்லர்த்தமாக ‘கை கனத்தது’ என்றாலும், இச்சொல்லடை அதிகாரம் அல்லது அடக்கும் வல்லமை அதிகரித்ததைக் குறிக்கிறது. இயல்பான நவீன தமிழில் பொருள் தெளிவாகத் தரப்பட்டு, மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בֵּית יוֹסֵף
  choice: யோசேப்பின் வீட்டார்
  rationale: ‘யோசேப்பின் வீடு’ என்ற உறவின-அரசியல் கூட்டமைப்பை இயல்பான தமிழில் குறிக்கிறது; இது யோசேப்போடு தொடர்புடைய கோத்திரங்களைச் சுட்டுகிறது.
- source_word: וַיִּהְיוּ לָמַס
  choice: கட்டாய உழைப்புக்கு உட்பட்டார்கள்
  rationale: מַס என்பது வெறும் பணவரியைக் காட்டிலும், அதிகாரத்தின்கீழ் விதிக்கப்படும் கட்டாய உழைப்புச் சேவையைக் குறிக்கிறது. எமோரியர்களே இதற்கு உட்பட்டவர்கள் என்பது தமிழில் தெளிவாக்கப்பட்டுள்ளது.
