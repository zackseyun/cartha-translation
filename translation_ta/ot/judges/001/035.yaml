translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கை கனத்தது’ என்ற எபிரெய உருவகம் பிரதான உரையில் பொருளடிப்படையாக மொழிபெயர்க்கப்பட்டு அடிக்குறிப்பில் தக்கவைக்கப்பட்டுள்ளது. இடப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
