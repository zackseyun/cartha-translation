revisions:
- from: ஆனால் மனாசே, பெத்-ஷான் நகரத்தையும் அதைச் சார்ந்த ஊர்களையும்[a], தானாக் நகரத்தையும் அதைச் சார்ந்த ஊர்களையும், தோர் நகரவாசிகளையும் அதைச் சார்ந்த ஊர்களையும், இப்லெயாம் நகரவாசிகளையும் அதைச் சார்ந்த ஊர்களையும், மெகிதோ நகரவாசிகளையும் அதைச் சார்ந்த ஊர்களையும் கைப்பற்றியிருந்த கானானியர்களை அங்கிருந்து அகற்றவில்லை. கானானியர்கள் இந்த நாட்டிலேயே குடியிருக்கத் துணிந்தார்கள்.[b]
  to: ஆனால் மனாசே பெத்-ஷான் நகரிலும் அதைச் சார்ந்த ஊர்களிலும், தானாக் நகரிலும் அதைச் சார்ந்த ஊர்களிலும், தோரிலும் அதைச் சார்ந்த ஊர்களிலும், இப்லெயாமிலும் அதைச் சார்ந்த ஊர்களிலும், மெகிதோவிலும் அதைச் சார்ந்த ஊர்களிலும் குடியிருந்த கானானியர்களை வெளியேற்றவில்லை.[a] கானானியர்கள் இந்த நாட்டில் குடியிருக்கத் தீர்மானித்திருந்தார்கள்.[b]
  rationale: மூலத்தில் இல்லாத ‘கைப்பற்றியிருந்த’ என்ற கூடுதல் கால/நிலைப் பொருள் நீக்கப்பட்டது. முதல் இரண்டு நகரங்களுக்குப் பின்னர் ‘வாசிகள்’ வெளிப்படையாக வராவிட்டாலும், வெளியேற்றப்பட வேண்டியவர்கள் அந்நகரங்களிலும் அவற்றின் சார்ந்த ஊர்களிலும் வாழ்ந்த கானானியரே என்பது வாக்கியத்தின் பொருளாக இருப்பதால், தமிழில் ஒருமுறை கூட்டாகத் தெளிவுபடுத்தப்பட்டுள்ளது. ‘துணிந்தார்கள்’ என்பதற்குப் பதிலாக ‘தீர்மானித்திருந்தார்கள்’ பயன்படுத்தப்பட்டு, יאל-இன் தீர்மான நுணுக்கம் காக்கப்பட்டுள்ளது; மாற்று ‘விரும்பினார்கள்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு, அது விளக்கும் ‘சார்ந்த ஊர்கள்’ தொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
