  text: וְ/לֹא הוֹרִ֣ישׁ מְנַשֶּׁ֗ה אֶת בֵּית שְׁאָ֣ן וְ/אֶת בְּנוֹתֶי/הָ֮ וְ/אֶת תַּעְנַ֣ךְ וְ/אֶת בְּנֹתֶי/הָ֒ וְ/אֶת ישב ד֜וֹר וְ/אֶת בְּנוֹתֶ֗י/הָ וְ/אֶת יוֹשְׁבֵ֤י יִבְלְעָם֙ וְ/אֶת בְּנֹתֶ֔י/הָ וְ/אֶת יוֹשְׁבֵ֥י מְגִדּ֖וֹ וְ/אֶת בְּנוֹתֶ֑י/הָ וַ/יּ֨וֹאֶל֙ הַֽ/כְּנַעֲנִ֔י לָ/שֶׁ֖בֶת בָּ/אָ֥רֶץ הַ/זֹּֽאת־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/027.yaml
  text: But Manasseh did not dispossess Beth-shean and its daughter towns[a], or Taanach and its daughter towns, or the inhabitants of Dor and its daughter towns, or the inhabitants of Ibleam and its daughter towns, or the inhabitants of Megiddo and its daughter towns[b]; and the Canaanites persisted in dwelling in this land.
translation:
  language: ta
  text: ஆனால் மனாசே பெத்-ஷான் நகரிலும் அதைச் சார்ந்த ஊர்களிலும், தானாக் நகரிலும் அதைச் சார்ந்த ஊர்களிலும், தோரிலும் அதைச் சார்ந்த ஊர்களிலும், இப்லெயாமிலும் அதைச் சார்ந்த ஊர்களிலும், மெகிதோவிலும் அதைச் சார்ந்த ஊர்களிலும் குடியிருந்த கானானியர்களை வெளியேற்றவில்லை.[a] கானானியர்கள் இந்த நாட்டில் குடியிருக்கத் தீர்மானித்திருந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “அதன் மகள்கள்”; முதன்மை நகரத்தைச் சார்ந்த சிற்றூர்கள் அல்லது குடியிருப்புகள் என்று பொருள்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “கானானியர்கள் இந்த நாட்டில் குடியிருக்க விரும்பினார்கள்.” எபிரெய வினை விருப்பத்தையோ உறுதியான தீர்மானத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: கைப்பற்றியிருந்த கானானியர்களை அங்கிருந்து அகற்றவில்லை
  rationale: இங்கு ירשׁ என்பதன் ஹிஃபில் வடிவம், ஒருவரை அவரது உடைமையிலிருந்து நீக்குதல் அல்லது வெளியேற்றுதல் என்ற காரணவினைப் பொருளைத் தருகிறது. எபிரெய வாக்கியத்தில் சில நகரங்களுக்குப் பின் ‘வாசிகள்’ என்பது வெளிப்படையாக இல்லாவிட்டாலும், எல்லா இடங்களிலும் அகற்றப்பட வேண்டிய கானானிய மக்களே குறிக்கப்படுவதால் தமிழில் பொருளைத் தெளிவாக்கப்பட்டுள்ளது.
- source_word: בְּנוֹתֶיהָ
  choice: அதைச் சார்ந்த ஊர்கள்
  rationale: சொல்லுக்குச் சொல் ‘அதன் மகள்கள்’; முதன்மை நகரத்தைச் சார்ந்த சிற்றூர்கள் அல்லது குடியிருப்புகளைக் குறிக்கும் பழமொழிவழக்கு. இயல்பான நவீன தமிழில் உறவுப் பொருள் தெளிவாகத் தரப்பட்டுள்ளது.
- source_word: ישב דּוֹר / יוֹשְׁבֵי יִבְלְעָם / יוֹשְׁבֵי מְגִדּוֹ
  choice: தோர் நகரவாசிகள் ... இப்லெயாம் நகரவாசிகள் ... மெகிதோ நகரவாசிகள்
  rationale: ישׁב வேரிலான பெயரெச்ச வடிவங்கள் அந்த இடங்களில் வாழும் மக்களைக் கூட்டாகக் குறிக்கின்றன; ‘நகரவாசிகள்’ இயல்பான தமிழ்ச் சொல்.
- source_word: וַיּוֹאֶל
  choice: குடியிருக்கத் துணிந்தார்கள்
  rationale: יאל என்ற வினை விருப்பம், முனைப்பு அல்லது உறுதியை வெளிப்படுத்தலாம். ‘துணிந்தார்கள்’ என்பது அவர்களுடைய மனவுறுதியைத் தருகிறது; ஆயினும் ‘உறுதியாக இருந்தார்கள்’ என்ற மாற்று சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַכְּנַעֲנִי
  choice: கானானியர்கள்
  rationale: வடிவத்தில் ஒருமையாக இருந்தாலும் இங்கு மக்கள் இனத்தைக் கூட்டாகக் குறிக்கிறது; தமிழில் பன்மை இயல்பானது.
- source_word: לָשֶׁבֶת בָּאָרֶץ הַזֹּאת
  choice: இந்த நாட்டிலேயே குடியிருக்க
  rationale: ל உடனான வினையெச்சம் கானானியர்கள் முனைந்த செயலைக் குறிக்கிறது. ‘இந்த நாடு’ சுட்டுப்பெயரின் வலிமையைப் பேணுகிறது; ‘-லேயே’ அவர்கள் அங்கேயே தொடர்ந்திருக்கும் சூழ்நிலை வலியுறுத்தலை இயல்பாகக் காட்டுகிறது.
- source_word: בֵּית שְׁאָן / תַּעְנַךְ / דּוֹר / יִבְלְעָם / מְגִדּוֹ
  choice: பெத்-ஷான் / தானாக் / தோர் / இப்லெயாம் / மெகிதோ
  rationale: எபிரெய ஒலிப்பை நவீன தமிழில் எளிதாக வாசிக்கக்கூடிய முறையில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: கானானியர்களின் தொடர்ந்த குடியிருப்பை வர்ணிக்கும் וַיּוֹאֶל என்பதன் நுண்பொருள்
  choice: குடியிருக்கத் துணிந்தார்கள்
  alternative: இந்த நாட்டில் குடியிருக்க உறுதியாக இருந்தார்கள்
  rationale: மூல வினையில் விருப்பம் அல்லது தீர்மானம் ஆகிய இரண்டிற்கும் இடமுள்ளது. முதன்மை உரை மனமுவந்த முனைப்பை இயல்பான தமிழில் தருகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டு மூலத்தின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நகரப் பெயர்களின் நீண்ட பட்டியல் மூலத்தின் இணை அமைப்பைத் தக்கவைத்துள்ளது. ‘மகள் ஊர்கள்’ என்ற அசாதாரண நேரடி உருவகத்திற்கு பதிலாக ‘சார்ந்த ஊர்கள்’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, மூல உருவகம் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
