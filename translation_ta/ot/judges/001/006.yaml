  text: וַ/יָּ֨נָס֙ אֲדֹ֣נִי בֶ֔זֶק וַֽ/יִּרְדְּפ֖וּ אַחֲרָ֑י/ו וַ/יֹּאחֲז֣וּ אֹת֔/וֹ וַֽ/יְקַצְּצ֔וּ אֶת בְּהֹנ֥וֹת יָדָ֖י/ו וְ/רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/006.yaml
  text: But Adoni-bezek fled[a], and they pursued him, seized him, and cut off his thumbs and big toes.
translation:
  language: ta
  text: ஆனால் அதோனி-பெசெக் தப்பி ஓடினான். அவர்கள் அவனைத் துரத்திச் சென்று பிடித்து, அவனுடைய கைக் கட்டைவிரல்களையும் கால் பெருவிரல்களையும் வெட்டிவிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּנָס
  choice: தப்பி ஓடினான்
  rationale: נוּס என்பது ஆபத்திலிருந்து ஓடுவதைக் குறிக்கிறது. பின்னர் அவன் பிடிக்கப்பட்டதால், வெற்றிகரமாகத் தப்பிவிட்டான் என்ற பொருள் வராதவாறு ‘தப்பி ஓடினான்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֲדֹנִי בֶזֶק
  choice: அதோனி-பேசெக்
  rationale: இது சூழலில் பெயர் அல்லது பட்டப்பெயராகச் செயல்படுவதால், ‘பேசெக்கின் ஆண்டவன்’ என்று பொருள் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיִּרְדְּפוּ אַחֲרָיו
  choice: அவனைத் துரத்திச் சென்று
  rationale: רדף + אַחַר என்பதன் இயல்பான பொருள் ‘பின்னால் துரத்துதல்’; தொடர்ச்சியான கதையோட்டத்திற்கேற்ப தமிழில் இயல்பாக வழங்கப்பட்டது.
- source_word: וַיֹּאחֲזוּ אֹתוֹ
  choice: பிடித்து
  rationale: אחז என்பது பற்றிக்கொள்ளுதல் அல்லது கைப்பற்றுதலைக் குறிக்கிறது. இங்கு துரத்தலுக்குப் பின் நிகழும் கைது என்பதால் ‘பிடித்து’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַיְקַצְּצוּ
  choice: வெட்டிவிட்டார்கள்
  rationale: קצץ இச்சூழலில் உடல் உறுப்புகளை வெட்டி அகற்றுவதைக் குறிக்கிறது; தமிழ் வினைமுற்று செயலின் நிறைவைத் தெளிவாக்குகிறது.
- source_word: בְּהֹנוֹת יָדָיו וְרַגְלָיו
  choice: அவனுடைய கைக் கட்டைவிரல்களையும் கால் பெருவிரல்களையும்
  rationale: בֹּהֶן கையில் கட்டைவிரலையும் காலில் பெருவிரலையும் குறிக்கிறது. எபிரெய மொழியின் சுருக்கமான அமைப்பு தமிழில் சரியான உடல் உறுப்புகளைத் தெளிவாகச் சுட்டுமாறு விரித்துரைக்கப்பட்டது.
