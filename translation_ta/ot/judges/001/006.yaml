translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர் செயல்வரிசை—ஓடுதல், துரத்துதல், பிடித்தல், வெட்டுதல்—பாதுகாக்கப்பட்டுள்ளது.
