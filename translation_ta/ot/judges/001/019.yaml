base_translation:
  language: en
  yaml_path: translation/ot/judges/001/019.yaml
  text: And Yahweh was with Judah[a], and he took possession of the hill country; but he could not drive out the inhabitants of the valley, because they had iron chariots.
translation:
  language: ta
  text: யாவே யூதா மக்களோடு இருந்தார். அவர்கள் மலைநாட்டைக் கைப்பற்றினார்கள்; ஆனால் பள்ளத்தாக்கில்[a] குடியிருந்தவர்களிடம் இரும்புத் தேர்கள் இருந்ததால், அவர்களை வெளியேற்ற முடியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சமவெளியில்” அல்லது “தாழ்நிலப் பகுதியில்”; எபிரெயச் சொல் அகன்ற பள்ளத்தாக்குப் பகுதியையும் குறிக்கலாம்.
    reason: עֵמֶק என்ற எபிரெயச் சொல்லுக்குள்ள புவியியல் பொருள் விரிவைச் சுட்டுவதற்காக.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான YHWH-ஐ, அதன் பொதுவாக ஏற்றுக்கொள்ளப்படும் உச்சரிப்புக்கு நெருக்கமான நவீன தமிழெழுத்துப் பெயர்ப்பாக வழங்குகிறது.
- source_word: אֶתּ יְהוּדָה
  choice: யூதா மக்களோடு
  rationale: אֵת இங்கு நேர்செயப்படுபொருள் குறியீடாக அல்லாமல் உடனிருப்பைக் குறிக்கிறது. ‘யூதா’ என்பது கோத்திர மக்களைக் கூட்டாகக் குறிப்பதால், நவீன தமிழில் பொருள் தெளிவாக இருக்க ‘யூதா மக்களோடு’ என வழங்கப்பட்டுள்ளது.
- source_word: וַיֹּרֶשׁ
  choice: கைப்பற்றினார்கள்
  rationale: இந்த Hiphil வடிவம் கைப்பற்றுதல் அல்லது உரிமையாக்கிக்கொள்ளுதல் என்ற பொருளைத் தரலாம். இதன் செயப்படுபொருள் மலைநாடு என்பதால் ‘கைப்பற்றினார்கள்’ என்பது சூழலுக்குப் பொருத்தமானது; அடுத்த கூறிலுள்ள ‘வெளியேற்றுதல்’ என்பதிலிருந்தும் வேறுபாட்டைக் காக்கிறது.
- source_word: הָהָר
  choice: மலைநாடு
  rationale: இங்கு ஒரு தனி மலையை அல்ல, உயர்நிலப் பிரதேசத்தைச் சுட்டுகிறது. ‘மலைநாடு’ இயல்பானதும் புவியியல் பொருளைத் தெளிவாகத் தருவதுமாகும்.
- source_word: כִּי לֹא לְהוֹרִישׁ
  choice: ஆனால் ... வெளியேற்ற முடியவில்லை
  rationale: எபிரெயக் கூறு சுருக்கமானது. தொடர்ந்து வரும் இரும்புத் தேர்கள் பற்றிய காரணக்கூறு, பள்ளத்தாக்கு மக்களை வெளியேற்றுவதில் ஏற்பட்ட இயலாமையை உணர்த்துகிறது. முந்தைய வெற்றியுடன் உள்ள முரண்பாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது.
- source_word: יֹשְׁבֵי הָעֵמֶק
  choice: பள்ளத்தாக்கில் குடியிருந்தவர்கள்
  rationale: பங்கேற்புவினை அமைப்பை இயல்பான நவீன தமிழில் வழங்குகிறது. עֵמֶק என்பதன் முதன்மைப் பொருளான ‘பள்ளத்தாக்கு’ முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
- source_word: רֶכֶב בַּרְזֶל לָהֶם
  choice: அவர்களிடம் இரும்புத் தேர்கள் இருந்ததால்
  rationale: לָהֶם காட்டும் உடைமையையும், இந்தக் கூறு முந்தைய தோல்விக்கான காரணமாகச் செயல்படுவதையும் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இரண்டாம் கூறில் உள்ள இயலாமையின் எழுவாயும் அதன் இறையியல் நெருக்கடியும்
  choice: யூதா மக்கள் பள்ளத்தாக்கில் குடியிருந்தவர்களை வெளியேற்ற முடியவில்லை என்று வழங்குதல்
  alternative: ‘பள்ளத்தாக்கில் குடியிருந்தவர்களை அவர்கள் வெளியேற்றவில்லை’ என்று இயலாமையை வெளிப்படையாகக் கூறாமல் வழங்குதல்
  rationale: எபிரெய இலக்கணம் சுருக்கமாக இருந்தாலும், எதிரிகளின் இரும்புத் தேர்களைக் காரணமாகக் கூறும் சூழல் யூதாவின் தோல்வி அல்லது இயலாமையையே இயல்பாக உணர்த்துகிறது. யாவே யூதாவுடன் இருந்தார் என்ற தொடக்கக் கூற்றுக்கும் இந்த இயலாமைக்கும் இடையிலான இறையியல் நெருக்கடியை மொழிபெயர்ப்பு மென்மையாக்காமல் அப்படியே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வழங்கப்பட்டுள்ளது. ‘யூதா’ என்பது கோத்திரத்தைக் கூட்டாகக் குறிப்பதால் ‘யூதா மக்கள்’ என்றும் பன்மை வினை வடிவங்களும் பயன்படுத்தப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘பள்ளத்தாக்கு’ என்ற சொல்லோடு நேரடியாக இணைக்கப்பட்டுள்ளது.
