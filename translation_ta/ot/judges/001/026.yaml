  source_fidelity: 'எபிரெய மூலத்தின் நிகழ்வுத் தொடரும் பொருளும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: அந்த மனிதன் ஏத்தியர்களின் நாட்டிற்குச் செல்கிறான், நகரம் கட்டுகிறான், அதற்கு லூஸ் என்று பெயரிடுகிறான்; அந்தப் பெயர் இந்நாள்வரை நிலைத்திருக்கிறது. ‘அதுதான் அதன் பெயர்’ என்பது הוּא שְׁמָהּ என்பதிலுள்ள சுட்டு/வலியுறுத்தல் நயத்தை ஏற்றவாறு தருகிறது.'
  naturalness: நவீன நிலையான தமிழில் நடை தெளிவாகவும் கண்ணியமான கதைநடையாகவும் உள்ளது. ‘சென்று, ... கட்டி, ... பெயரிட்டான்’ என்ற வினையெச்சத் தொடர் எபிரெயக் கதைத் தொடரைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. இறுதித் தொடர் சற்றே நேரடிச் சொற்தொடராக இருந்தாலும் இயல்புக்கும் வாசிப்புத் தெளிவுக்கும் இடையூறு இல்லை.
