base_translation:
  language: en
  yaml_path: translation/ot/judges/001/026.yaml
  text: And the man went to the land of the Hittites and built a city and called its name Luz[a]; that is its name to this day.
translation:
  language: ta
  text: அந்த மனிதன் ஏத்தியர்களின் நாட்டிற்குச் சென்று, ஒரு நகரத்தைக் கட்டி, அதற்கு லூஸ் என்று பெயரிட்டான்[a]; இந்நாள்வரை அதுதான் அதன் பெயர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “அதன் பெயரை லூஸ் என்று அழைத்தான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: சென்று
  rationale: הלך என்பதன் கால் தொடர்-இறந்தகால வடிவம் கதையின் அடுத்த நிகழ்வைக் குறிக்கிறது; தமிழில் முந்தைய செயல்களுடன் இயல்பாக இணைக்க வினையெச்சம் பயன்படுத்தப்பட்டது.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: முன்னர் குறிப்பிடப்பட்ட குறிப்பிட்ட ஆணைக் குறிக்கும் வரையறுக்கப்பட்ட ஒருமைச் சொல்; ‘அந்த மனிதன்’ கதைத் தொடர்ச்சியைத் தெளிவாக்குகிறது.
- source_word: אֶרֶץ הַחִתִּים
  choice: ஏத்தியர்களின் நாடு
  rationale: இது நேரடியாக ‘ஏத்தியர்களின் நாடு’ எனப் பொருள்படும் உடைமைத் தொடர்; குறிப்பிட்ட அரசியல் எல்லையை ஊகிக்காமல் இன-புவியியல் குறிப்பைப் பாதுகாக்கிறது.
- source_word: וַיִּבֶן עִיר
  choice: ஒரு நகரத்தைக் கட்டி
  rationale: בנה மற்றும் עִיר ஆகியவற்றின் நேரான பொருள் ‘ஒரு நகரத்தைக் கட்டினான்’; ‘நிறுவினான்’ என்ற விளக்கமான பொருளைச் சேர்க்கவில்லை.
- source_word: וַיִּקְרָא שְׁמָהּ לוּז
  choice: அதற்கு லூஸ் என்று பெயரிட்டான்
  rationale: எபிரெய மொழிநடையின் சொற்பொருள் ‘அதன் பெயரை லூஸ் என்று அழைத்தான்’; நவீன தமிழில் அதே பொருளை இயல்பாகத் தெரிவிக்க ‘பெயரிட்டான்’ பயன்படுத்தப்பட்டது.
- source_word: לוּז
  choice: லூஸ்
  rationale: இடப்பெயர் பொருளாக்கப்படாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הוּא שְׁמָהּ
  choice: அதுதான் அதன் பெயர்
  rationale: வினையில்லா இவ்வாக்கியத்தில் הוּא வலியுறுத்தும் அல்லது சுட்டும் பணியாற்றுகிறது; ‘அதுதான்’ அந்த வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை
  rationale: எபிரெயத்தின் வழக்கமான காலக் குறிப்பைச் சுருக்கமாகவும் உயர்நடைக்கு ஏற்றவாறும் தருகிறது.
