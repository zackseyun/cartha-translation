base_translation:
  language: en
  yaml_path: translation/ot/judges/001/007.yaml
  text: And Adoni-bezek said[a], “Seventy kings, with the thumbs of their hands and their feet cut off, used to gather scraps under my table. As I have done, so God has repaid me.” And they brought him to Jerusalem[b], and he died there.
translation:
  language: ta
  text: 'அதோனி-பெசேக் சொன்னான்: “கைகளின் கட்டைவிரல்களும் கால்களின் பெருவிரல்களும் துண்டிக்கப்பட்ட எழுபது அரசர்கள்[a] என் மேசைக்குக் கீழே உணவுத் துணுக்குகளைப் பொறுக்கிவந்தார்கள். நான் செய்தபடியே கடவுள்[b] எனக்குத் திருப்பிச் செய்தார்.” அவர்கள் அவனை எருசலேமுக்குக் கொண்டுவந்தார்கள்; அவன் அங்கே இறந்தான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ஒரே சொல், கையோடு வரும்போது ‘கட்டைவிரல்’ என்றும் காலோடு வரும்போது ‘பெருவிரல்’ என்றும் பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: אֱלֹהִים என்ற எபிரெயச் சொல் வடிவத்தில் பன்மையானது; ஆனால் இங்கு அதனுடன் வரும் வினை ஒருமையில் இருப்பதால் ‘தெய்வங்கள்’ என்பதற்குப் பதிலாக ‘கடவுள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי בֶזֶק
  choice: அதோனி-பெசேக்
  rationale: சூழலில் இது பேசுபவரின் பெயராகச் செயல்படுவதால், ‘பெசேக்கின் ஆண்டவன்’ என்று மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שִׁבְעִים מְלָכִים
  choice: எழுபது அரசர்கள்
  rationale: எண்ணும் பெயர்ச்சொல்லும் கொண்ட எளிய எபிரெய அமைப்பு நேரடியாகத் தரப்பட்டுள்ளது.
- source_word: בְּהֹנוֹת יְדֵיהֶם וְרַגְלֵיהֶם
  choice: கைகளின் கட்டைவிரல்களும் கால்களின் பெருவிரல்களும்
  rationale: בֹּהֶן என்பது கையைக் குறிக்கும்போது கட்டைவிரலையும் காலைக் குறிக்கும்போது பெருவிரலையும் குறிக்கிறது. எபிரெயத்தில் கைகளும் கால்களும் தனித்தனியாகக் குறிப்பிடப்படுவதால், தமிழில் இயல்பான உடற்கூறு வேறுபாடு தெளிவாகத் தரப்பட்டுள்ளது.
- source_word: מְקֻצָּצִים
  choice: வெட்டப்பட்ட
  rationale: קצץ வினையின் செயப்பாட்டு வினையெச்சம் உறுப்புகள் துண்டித்து அகற்றப்பட்டதைக் குறிக்கிறது; ‘வெட்டப்பட்ட’ என்பது தெளிவான இயல்பான இணைச்சொல்.
- source_word: הָיוּ מְלַקְּטִים
  choice: பொறுக்கிவந்தார்கள்
  rationale: இந்தக் கூட்டு வினை அமைப்பு கடந்தகாலத்தில் வழக்கமாக அல்லது தொடர்ந்து நடந்த செயலைக் குறிக்கிறது. மேசையின் கீழுள்ள சூழலில் לקט என்பதற்கு ‘பொறுக்கு’ இயல்பான தமிழாக்கம்.
- source_word: תַּחַת שֻׁלְחָנִי
  choice: என் மேசைக்குக் கீழே
  rationale: இடத்தைக் குறிக்கும் மூலமொழி அமைப்பு நேரடியாகவும் இயல்பாகவும் தரப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר עָשִׂיתִי כֵּן
  choice: நான் செய்தபடியே
  rationale: செயலுக்கும் அதற்கேற்ற பதிலுக்கும் இடையிலான ஒப்புமைச் சூத்திரம் சுருக்கமாகவும் தெளிவாகவும் காக்கப்பட்டுள்ளது.
- source_word: שִׁלַּם לִי אֱלֹהִים
  choice: கடவுள் எனக்குத் திருப்பிச் செய்தார்
  rationale: Piel வடிவிலுள்ள שׁלם இங்கு செய்ததற்கேற்ற கைம்மாறு அல்லது பதிலைச் செலுத்துவதைக் குறிக்கிறது. தமிழில் தண்டனை என்ற கருத்தை வெளிப்படையாகச் சேர்க்காமல், மூலத்தின் ஈடுசெய்யும் பொருள் காக்கப்பட்டுள்ளது.
- source_word: וַיְבִיאֻהוּ יְרוּשָׁלִַם
  choice: அவர்கள் அவனை எருசலேமுக்குக் கொண்டுவந்தார்கள்
  rationale: மூன்றாம் நபர் பன்மை எழுவாயும் ஆண்பால் ஒருமை செயப்படுபொருளும் தெளிவாகத் தரப்பட்டுள்ளன.
- source_word: וַיָּמָת שָׁם
  choice: அவன் அங்கே இறந்தான்
  rationale: எபிரெயக் கதைத் தொடரின் எளிய இறந்தகால நிகழ்வு, தமிழில் எழுவாயைத் தெளிவுபடுத்தி வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: அதோனி-பெசேக்கின் கூற்றிலுள்ள אֱלֹהִים என்பதன் குறிப்பு
  choice: கடவுள்
  alternative: தெய்வங்கள்
  rationale: אֱלֹהִים வடிவத்தில் பன்மையாக இருந்தாலும், அதனுடன் வரும் שִׁלַּם வினை ஒருமையில் உள்ளது. ஆகவே இங்கு ஒருமைப் பொருளான ‘கடவுள்’ என்பதே இலக்கண ரீதியாக வலுவான வாசிப்பு. அதே நேரத்தில், பேசியவன் கொண்டிருந்த இறையியல் புரிதலை வசனம் கூறுவதைவிட அதிகமாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பழமையான அல்லது சமயப் பிரிவுக்கே உரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன. மூலத்தின் பழிவாங்கும் நீதிக் கருத்தை விளக்கமாக விரிவுபடுத்தாமல், பேச்சாளரின் சொந்த ஒப்புதலாகவே வைத்துள்ளது.
