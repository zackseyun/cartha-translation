source:
  edition: WLC
  text: וּ/בְנֵ֣י קֵינִי֩ חֹתֵ֨ן מֹשֶׁ֜ה עָל֨וּ מֵ/עִ֤יר הַ/תְּמָרִים֙ אֶת בְּנֵ֣י יְהוּדָ֔ה מִדְבַּ֣ר יְהוּדָ֔ה אֲשֶׁ֖ר בְּ/נֶ֣גֶב עֲרָ֑ד וַ/יֵּ֖לֶךְ וַ/יֵּ֥שֶׁב אֶת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/016.yaml
  text: And the descendants of the Kenite[a], Moses’ father-in-law, went up from the City of Palms with the descendants of Judah into the wilderness of Judah, which is in the Negev of Arad[d][c][b]; then he went and settled with the people.
translation:
  language: ta
  text: மோசேயின் மாமனாரான[a] கேனியரின் சந்ததியினர் பேரீச்சமரங்களின் நகரத்திலிருந்து[b] யூதாவின் சந்ததியினருடன் ஆராத்தின் நெகேவில் உள்ள யூதாவின் பாலைநிலத்திற்கு மேலே சென்றார்கள். பின்பு அவன் சென்று அந்த மக்களுடன் குடியேறினான்.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மோசேயின் திருமண உறவினரான.” இங்குள்ள எபிரெயச் சொல் ‘மாமனார்’ என்பதைவிட விரிவான திருமண உறவைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “பேரீச்சமரங்களின் நகரம்” என்பது பொதுவாக எரிகோவைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: cross_reference
  - marker: c
    text: இங்கு எபிரெய உரை ஒருமைக்கு மாறி, “அவன் சென்று ... குடியேறினான்” என்று கூறுகிறது. இது கேனியக் குலத்தைக் கூட்டொருமையாகக் குறிக்கலாம்; சிலர் இதைப் பன்மைப் பொருளில் புரிந்துகொள்கிறார்கள்.
    reason: textual_variant
  - marker: d
    text: “அந்த மக்களிடையே” என்றும் மொழிபெயர்க்கலாம். சில பழமையான சாட்சிகள் “அந்த மக்களுடன்” என்பதற்குப் பதிலாக “அமாலேக்கியருடன்” என்று வாசிக்கின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי קֵינִי
  choice: கேனியனின் வழிவந்தவர்கள்
  rationale: בְּנֵי என்பது இங்கு உடனடியான மகன்களை மட்டும் அல்லாமல் ஒரு குலத்தின் வழிவந்தவர்களைக் குறிக்கிறது; קֵינִי என்பது கேனிய இனத்தவரைக் குறிக்கும் ஒருமை இனப்பெயர்.
- source_word: חֹתֵן מֹשֶׁה
  choice: மோசேயின் மாமனார்
  rationale: חֹתֵן என்பதன் இச்சூழலுக்குரிய பொதுவான பொருள் ‘மாமனார்’; திருமண உறவினர் என்ற விரிவான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עָלוּ מֵעִיר הַתְּמָרִים
  choice: பேரீச்சமரங்களின் நகரத்திலிருந்து புறப்பட்டு
  rationale: עָלוּ என்பது சொற்பட ‘மேலே சென்றார்கள்’ என்றாலும், தமிழில் இலக்கை நோக்கிய பயணத்தை இயல்பாகச் சொல்ல ‘புறப்பட்டு ... சென்றார்கள்’ என வழங்கப்பட்டுள்ளது; இடப்பெயரின் வருணனை நேரடியாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: யூதாவின் வழிவந்தவர்களுடன்
  rationale: אֶת இங்கு உடன்சேர்க்கைப் பொருளில் ‘உடன்’; בְּנֵי என்பது கோத்திர வழிவந்தவர்களைக் குறிக்கிறது.
- source_word: מִדְבַּר יְהוּדָה
  choice: யூதாவின் பாலைநிலத்திற்கு
  rationale: מִדְבָּר என்பது மக்கள் குடியிருப்பு குறைந்த வறண்ட வனாந்தரப் பகுதி; நவீனத் தமிழில் இயல்பான ‘பாலைநிலம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲשֶׁר בְּנֶגֶב עֲרָד
  choice: ஆராத்தின் நெகேவில் உள்ள
  rationale: נֶגֶב என்பதை பொதுவான ‘தெற்கு’ என்று தீர்மானிக்காமல், ஆராத்துடன் தொடர்புடைய புவியியல் பிரதேசப் பெயராக ‘நெகேவ்’ எனப் பாதுகாக்கிறது.
- source_word: וַיֵּלֶךְ וַיֵּשֶׁב
  choice: பின்பு அவன் சென்று ... குடியேறினான்
  rationale: எபிரெய உரையின் திடீர் ஒருமை மாற்றம் மறைக்கப்படாமல் ‘அவன்’ எனத் தக்கவைக்கப்பட்டுள்ளது; ישׁב இங்கு குடியேற்றச் சூழலில் ‘குடியேறினான்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶת הָעָם
  choice: அந்த மக்களுடன்
  rationale: אֶת உடன்சேர்க்கைப் பொருளிலும் הָעָם குறிப்பிட்ட மக்களைக் குறிக்கும் வகையிலும் வழங்கப்பட்டுள்ளது; அதன் துல்லியமான சுட்டுப்பொருள் தெளிவில்லாததால் மொழிபெயர்ப்பில் தீர்மானிக்கப்படவில்லை.
theological_decisions:
- issue: கேனியக் குழுவைக் குறிக்கும் ஒருமை வினைச்சொல்
  choice: ‘அவன்’ என்ற எபிரெய ஒருமையைத் தக்கவைத்தல்
  alternative: ‘அவர்கள்’ என்று பன்மையாக்குதல்
  rationale: மசோரா உரையில் וַיֵּלֶךְ, וַיֵּשֶׁב இரண்டும் ஒருமை; இதை குலத்தைக் குறிக்கும் கூட்டொருமையாகப் புரிந்துகொள்ளலாம், ஆனால் மொழிபெயர்ப்பில் அமைதியாகப் பன்மையாக்குவது உண்மையான உரைநெருக்கடியை மறைக்கும்.
- issue: אֶת הָעָם என்பதன் அடையாளம்
  choice: ‘அந்த மக்களுடன்’ எனத் தெளிவின்மையைப் பாதுகாத்தல்
  alternative: ‘யூதா மக்களுடன்’ அல்லது ‘அமாலேக்கியருடன்’
  rationale: மசோரா உரை மக்களின் அடையாளத்தை வெளிப்படையாகக் கூறவில்லை; சில பழமையான சாட்சிகள் அமாலேக்கைக் காட்டுவதால் எந்த ஓர் விளக்கத்தையும் முதன்மை உரையில் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பும் கண்ணியமும் கொண்ட நடையில் வடிவமைக்கப்பட்டது. எபிரெயத்தின் பன்மையிலிருந்து ஒருமைக்கான திடீர் மாற்றமும், ‘மக்கள்’ யார் என்ற தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன. ‘நெகேவ்’ புவியியல் பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது; ‘பேரீச்சமரங்களின் நகரம்’ என்ற மூல வருணனை முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
