revisions:
- from: மோசேயின் மாமனாரான[a] கேனியனின் வழிவந்தவர்கள், யூதாவின் வழிவந்தவர்களுடன் பேரீச்சமரங்களின் நகரத்திலிருந்து புறப்பட்டு, ஆராத்தின் நெகேவில் உள்ள யூதாவின் பாலைநிலத்திற்குச் சென்றார்கள்.[b] பின்பு அவன் சென்று அந்த மக்களுடன் குடியேறினான்.[c][d]
  to: மோசேயின் மாமனாரான[a] கேனியரின் சந்ததியினர் பேரீச்சமரங்களின் நகரத்திலிருந்து[b] யூதாவின் சந்ததியினருடன் ஆராத்தின் நெகேவில் உள்ள யூதாவின் பாலைநிலத்திற்கு மேலே சென்றார்கள். பின்பு அவன் சென்று அந்த மக்களுடன் குடியேறினான்.[c][d]
  rationale: The revision restores the lexical movement nuance of עָלוּ, uses a natural Tamil clan/gentilic expression, and relocates the City of Palms note marker to its referent. It retains the Hebrew singular shift and the unresolved reference of הָעָם without imposing an interpretation.
