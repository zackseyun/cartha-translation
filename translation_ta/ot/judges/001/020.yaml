translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. முதல் எபிரேய வாக்கியத்தின் நீளத்தைத் தமிழின் இயல்புக்கேற்ப இரண்டு வாக்கியங்களாகப் பிரித்து, இரண்டாவது வாக்கியத்தின் ஒருமை எழுவாய் காலேப் என்பதைத் தெளிவுபடுத்தியுள்ளது. மூலத்தில் உள்ள ‘மகன்கள்’ என்ற சொல் முதன்மை உரையில் காக்கப்பட்டு, அதன் குலவழிப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
