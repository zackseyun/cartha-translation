base_translation:
  language: en
  yaml_path: translation/ot/judges/001/020.yaml
  text: They gave Hebron to Caleb[a], as Moses had said, and he drove out from there the three sons of Anak.
translation:
  language: ta
  text: மோசே கூறியபடியே, அவர்கள் எப்ரோனைக் காலேபுக்குக் கொடுத்தார்கள். காலேப் அங்கிருந்து ஏனாக்கின் மூன்று மகன்களையும்[a] துரத்திவிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனாக்கின் வழிவந்த மூவரையும்” அல்லது “ஏனாக்கியர் மூவரையும்.” எபிரேய மொழியில் “ஏனாக்கின் மகன்கள்” என்று உள்ளது; இது ஏனாக்கின் நேரடி மகன்களைக் குறிக்காமல், அவரது குலவழியினரைக் குறிக்கவும் கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: அவர்கள் கொடுத்தார்கள்
  rationale: נתן என்பதன் தொடர்கதை வடிவம் கடந்தகாலச் செயலைக் குறிக்கிறது. தமிழில் இயல்பான முழு வாக்கியத்திற்காக மறைந்துள்ள பன்மை எழுவாய் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: לְכָלֵב
  choice: காலேபுக்கு
  rationale: לְ மறைமுகச் செயப்படுபொருளைக் குறிக்கிறது; כָלֵב என்ற பெயர் தமிழில் வழக்கமான வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶת חֶבְרוֹן
  choice: எப்ரோனை
  rationale: חֶבְרוֹן இடப்பெயராக இருப்பதால் நகரம் என்ற விளக்கச் சொல்லைச் சேர்க்காமல் நேரடியாகத் தரப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: மோசே கூறியபடியே
  rationale: כַּאֲשֶׁר என்பது ‘கூறியபடி’ என்ற ஒப்புமையைத் தருகிறது; דִּבֶּר என்பதற்கு ‘வாக்குறுதி அளித்தார்’ என்ற வலுவான பொருளைச் சேர்க்காமல் ‘கூறினார்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיּוֹרֶשׁ
  choice: துரத்திவிட்டார்
  rationale: ירש என்பதன் ஹிஃபில் வடிவம் இங்கு குடியிருந்தவர்களை வெளியேற்றுதல் அல்லது உரிமை நீக்கம் செய்தலைக் குறிக்கிறது. நேரடிச் செயப்படுபொருள் மனிதர்கள் என்பதால் ‘துரத்திவிட்டார்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: מִשָּׁם
  choice: அங்கிருந்து
  rationale: இது முன்பு குறிப்பிடப்பட்ட எப்ரோனைச் சுட்டும் இடவினையடை; எபிரேயச் சொல்லமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: אֶת שְׁלֹשָׁה בְּנֵי הָעֲנָק
  choice: ஏனாக்கின் மூன்று மகன்களையும்
  rationale: בְּנֵי என்பதன் நேரடிப் பொருள் ‘மகன்கள்.’ அது குலவழியினரையோ இனக்குழு உறுப்பினர்களையோ குறிக்கவும் கூடும் என்பதால் அந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
