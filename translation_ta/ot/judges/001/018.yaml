translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. யூதா என்பது கூட்டாகச் செயல்படும் கோத்திரத்தைக் குறித்தாலும், மூலத்தில் இல்லாத விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை. ஒரே எபிரெயத் தொடர் மூன்று நகரங்களுக்கும் வருவதால், தமிழிலும் ஒரே சொற்றொடர் மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
