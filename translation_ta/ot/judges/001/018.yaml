base_translation:
  language: en
  yaml_path: translation/ot/judges/001/018.yaml
  text: Judah captured Gaza and its territory[a], Ashkelon and its territory, and Ekron and its territory.
translation:
  language: ta
  text: யூதா காசாவையும் அதன் நிலப்பரப்பையும்[a], அஸ்கலோனையும் அதன் நிலப்பரப்பையும், எக்ரோனையும் அதன் நிலப்பரப்பையும் கைப்பற்றியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மூன்று இடங்களிலும் ‘அதன் எல்லையையும்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் ஓர் எல்லையையோ அந்த எல்லைக்குட்பட்ட நிலப்பரப்பையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: கைப்பற்றியது
  rationale: לכד என்பது ஒரு நகரத்தையோ இடத்தையோ வலிமையால் பிடிப்பதைக் குறிக்கிறது. இராணுவச் சூழலில் ‘கைப்பற்றியது’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: இங்கு தனிப்பெயர் யூதா கோத்திரத்தை ஒட்டுமொத்தமாகக் குறிக்கிறது. மூலத்தில் வெளிப்படையாக இல்லாத ‘கோத்திரம்’ என்பதைச் சேர்க்காமல் பெயரையே வைத்திருக்கிறது.
- source_word: גְּבוּלָהּ
  choice: அதன் சுற்றுப்பகுதி
  rationale: גְּבוּל என்பது எல்லை, எல்லைக்குட்பட்ட நிலப்பரப்பு அல்லது ஆட்சிப்பகுதி ஆகியவற்றைக் குறிக்கலாம். நகரங்களின் கைப்பற்றுதலைப் பட்டியலிடும் இச்சூழலில், நகரைச் சார்ந்த நிலப்பரப்பை ‘சுற்றுப்பகுதி’ இயல்பாக வெளிப்படுத்துகிறது; ‘எல்லை’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עַזָּה
  choice: காசா
  rationale: இடப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: אַשְׁקְלוֹן
  choice: அஸ்கலோன்
  rationale: எபிரெய இடப்பெயருக்கு நெருக்கமான, தமிழில் வாசிக்க இயல்பான ஒலிபெயர்ப்பு.
- source_word: עֶקְרוֹן
  choice: எக்ரோன்
  rationale: எபிரெய இடப்பெயருக்கு நெருக்கமான, தமிழில் வாசிக்க இயல்பான ஒலிபெயர்ப்பு.
