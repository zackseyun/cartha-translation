base_translation:
  language: en
  yaml_path: translation/ot/judges/001/008.yaml
  text: Then the sons of Judah fought against Jerusalem and captured it[a], and struck it with the edge of the sword[b], and they set the city on fire.
translation:
  language: ta
  text: அப்பொழுது யூதாவின் மகன்கள்[a] எருசலேமுக்கு எதிராகப் போரிட்டு, அதைக் கைப்பற்றினார்கள்; பட்டயத்தின் கூர்மையால் அதைத் தாக்கி,[b] நகரத்திற்குத் தீ வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யூதாவின் மகன்கள்.” இது யூதா கோத்திரத்தாரைக் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “பட்டயத்தின் வாயால்.” இது பட்டயத்தின் கூர்மை/விளிம்பைக் குறிக்கும் வழக்குச்சொல். இலக்கணப்படி “அதை” என்பது எருசலேம் நகரத்தைக் குறிக்கிறது; போர்ச் சூழலில் அந்த நகர்மீது நிகழ்ந்த அழிவையும் சுட்டுகிறது.
    reason: source_idiom
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ ... בִּירוּשָׁלִַם
  choice: எருசலேமுக்கு எதிராகப் போரிட்டு
  rationale: לחם என்பதுடன் வரும் ב இங்கு, தொடர்ந்து இடம்பெறும் ‘கைப்பற்றினார்கள்’ என்ற வினையால், இடத்தைக் காட்டுவதைக் காட்டிலும் தாக்குதலின் இலக்கைக் குறிக்கிறது.
- source_word: בְנֵי יְהוּדָה
  choice: யூதாவின் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘யூதாவின் மகன்கள்’; இங்கு அது யூதா கோத்திரத்தாரைக் கூட்டாகக் குறிப்பதால், இயல்பான நவீன தமிழில் ‘யூதாவின் மக்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיִּלְכְּדוּ אֹתָהּ
  choice: அதைக் கைப்பற்றினார்கள்
  rationale: לכד என்பது போர் வருணனையில் ஒரு நகரைப் பிடித்தல் அல்லது கைப்பற்றுதல் என்பதைக் குறிக்கிறது.
- source_word: וַיַּכּוּהָ לְפִי חָרֶב
  choice: பட்டயத்தின் முனையால் அதன் மக்களை வெட்டி வீழ்த்தி
  rationale: எபிரெயச் சொற்றொடர் எழுத்துப்படி நகரத்தையே வெட்டியதாக அமைந்தாலும், வழக்குச்சொல்லாக அது நகர மக்களைப் பட்டயத்தால் கொன்றதைக் குறிக்கிறது; தமிழில் பொருள் தெளிவாக இருக்க உள்ளடங்கிய செயப்படுபொருள் வெளிப்படுத்தப்பட்டது.
- source_word: שִׁלְּחוּ בָאֵשׁ
  choice: நகரத்துக்குத் தீ வைத்தார்கள்
  rationale: ‘நெருப்பில் அனுப்பினார்கள்’ என்ற எபிரெய வழக்கின் இயல்பான பொருள் நகரை எரியவைத்தல்; நவீன தமிழில் ‘தீ வைத்தார்கள்’ என்பது தெளிவான நடை.
