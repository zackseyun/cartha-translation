  text: וַֽ/יִּפְּלוּ֙ מִ/בִּנְיָמִ֔ן שְׁמֹנָֽה עָשָׂ֥ר אֶ֖לֶף אִ֑ישׁ אֶת כָּל אֵ֖לֶּה אַנְשֵׁי חָֽיִל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/044.yaml
  text: And eighteen thousand men from Benjamin fell[a]; all these were valiant warriors.
translation:
  language: ta
  text: பென்யமீனைச் சேர்ந்த பதினெட்டாயிரம் பேர் வீழ்ந்தார்கள்; இவர்கள் அனைவரும் வீரமிக்க போர்வீரர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சொல்லுக்கு இன்னும் நெருக்கமாக, “இவர்கள் அனைவரும் வீரமுள்ள மனிதர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: வீழ்ந்தார்கள்
  rationale: נפל என்பதன் நேரடிப் பொருள் ‘விழுதல்/வீழ்தல்.’ போர்ச் சூழலில் இது போரில் கொல்லப்பட்டதைக் குறிக்கும் வழக்குச் சொல்; ‘வீழ்ந்தார்கள்’ எபிரெயச் சொல்லாட்சியையும் போரின் தொனியையும் காக்கிறது.
- source_word: מִבִּנְיָמִן
  choice: பென்யமீனைச் சேர்ந்த
  rationale: מִן இங்கு மூலத்தையோ குழு உறுப்பினர்தன்மையையோ குறிக்கிறது. இயல்பான நவீன தமிழில், வீழ்ந்தவர்கள் பென்யமீன் கோத்திரத்தைச் சேர்ந்தவர்கள் என்பதை இச்சொற்றொடர் தெளிவாகத் தெரிவிக்கிறது.
- source_word: שְׁמֹנָה עָשָׂר אֶלֶף אִישׁ
  choice: பதினெட்டாயிரம் பேர்
  rationale: எபிரெயத்தில் எண்ணிக்கைக்குப் பின் אִישׁ உள்ளது. தமிழில் எண்ணிக்கையுடன் ‘பேர்’ என்பது மனிதர்களைக் குறிக்கும் இயல்பான வடிவம்; ‘வீரர்கள்’ என்று இங்கே மொழிபெயர்ப்பது அடுத்த சொற்றொடரின் பொருளை முன்கூட்டியே சேர்த்துவிடும்.
- source_word: אֶת כָּל אֵלֶּה
  choice: இவர்கள் அனைவரும்
  rationale: முன் கூறப்பட்ட வீழ்ந்தவர்களைத் தொகுத்துச் சுட்டும் இணைப்புச் சொற்றொடர். ‘இவர்கள் அனைவரும்’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אַנְשֵׁי חָיִל
  choice: வீரமிக்க போர்வீரர்கள்
  rationale: இச்சொற்றொடர் போர்ச் சூழலில் துணிவும் போர்த் திறனும் கொண்ட ஆட்களைக் குறிக்கிறது. ‘வீரமிக்க போர்வீரர்கள்’ இந்த இரு கூறுகளையும் நவீன வாசகருக்குத் தெளிவாக வெளிப்படுத்துகிறது.
