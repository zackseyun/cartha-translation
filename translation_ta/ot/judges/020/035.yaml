revisions:
- from: யாவே பென்யமீனை இஸ்ரவேலுக்கு முன்பாக வீழ்த்தினார்[a]. அன்று இஸ்ரவேல் மக்கள்[b] பென்யமீனைச் சேர்ந்த இருபத்தையாயிரத்து நூறு ஆண்களை அழித்தார்கள். அவர்கள் அனைவரும் வாள் உருவும் வீரர்கள்.
  to: யாவே பென்யமீனை இஸ்ரவேலின் முன் வீழ்த்தினார்[a]. அன்று இஸ்ரவேல் மக்கள்[b] பென்யமீனைச் சேர்ந்த இருபத்தைந்தாயிரத்து நூறு ஆண்களை அழித்தார்கள். அவர்கள் அனைவரும் வாளை உருவியவர்கள்.
  rationale: The revision corrects the numerical expression, improves the battle idiom, and renders “all these drawing the sword” directly and idiomatically. It retains the source text’s distinction between Yahweh’s action in striking Benjamin down and Israel’s action in destroying Benjamin’s men, without resolving their relationship theologically.
