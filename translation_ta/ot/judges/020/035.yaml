base_translation:
  language: en
  yaml_path: translation/ot/judges/020/035.yaml
  text: And Yahweh struck Benjamin down before Israel[a], and the sons of Israel destroyed twenty-five thousand one hundred men of Benjamin that day[b], all these drawing the sword.
translation:
  language: ta
  text: யாவே பென்யமீனை இஸ்ரவேலின் முன் வீழ்த்தினார்[a]. அன்று இஸ்ரவேல் மக்கள்[b] பென்யமீனைச் சேர்ந்த இருபத்தைந்தாயிரத்து நூறு ஆண்களை அழித்தார்கள். அவர்கள் அனைவரும் வாளை உருவியவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பென்யமீனை இஸ்ரவேலின் முன் தோற்கடித்தார்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: வீழ்த்தினார்
  rationale: போர்ச் சூழலில் நָגַף என்பது தாக்கி வீழ்த்துதல் அல்லது தோற்கடித்தல் எனப் பொருள்படும். ‘வீழ்த்தினார்’ என்பது தெய்வீகச் செயலையும் போரின் கடுமையையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தேவநாமத்தின் ஒலிபெயர்ப்பைத் தலைப்பால் மாற்றாமல் தனிப்பட்ட பெயராகத் தருகிறது.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு முன்பாக
  rationale: பென்யமீன் இஸ்ரவேலை எதிர்கொண்ட போரில் வீழ்த்தப்பட்டான் என்ற எபிரெய மரபுத்தொடரின் உருவகத்தையும் சுருக்கத்தையும் காக்கிறது.
- source_word: וַיַּשְׁחִיתוּ
  choice: அழித்தார்கள்
  rationale: ஹிஃபில் வடிவிலுள்ள שׁחת இங்கு உயிரிழப்பை ஏற்படுத்தும் அழிவைக் குறிக்கிறது; ‘அழித்தார்கள்’ அதன் தீவிரத்தைத் தக்கவைக்கிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு இஸ்ரவேல் தரப்புப் போராளிகளைக் குறிக்கும் கூட்டுப்பெயராக இருப்பதால் இயல்பான நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ என வழங்கி, நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּבִנְיָמִן
  choice: பென்யமீனைச் சேர்ந்த
  rationale: எண்ணப்படும் உயிரிழந்த ஆண்கள் பென்யமீன் தரப்பைச் சேர்ந்தவர்கள் என்பதைத் தெளிவான தமிழ் மரபில் காட்டுகிறது.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף וּמֵאָה אִישׁ
  choice: இருபத்தையாயிரத்து நூறு ஆண்கள்
  rationale: எபிரெய எண்ணிக்கையையும், போரிடும் ஆண்களைக் குறிக்கும் אִישׁ என்பதையும் நேரடியாக வழங்குகிறது.
- source_word: כָּל אֵלֶּה שֹׁלֵף חָרֶב
  choice: அவர்கள் அனைவரும் வாள் உருவும் வீரர்கள்
  rationale: ‘வாளை உருவுதல்’ என்ற எபிரெயப் போர்ப்படிமத்தை வைத்துக்கொண்டு, அது ஆயுதமேந்திப் போரிடும் வீரர்களைக் குறிக்கிறது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: போரின் முடிவில் தெய்வீகச் செயலும் மனிதச் செயலும்
  choice: யாவே பென்யமீனை வீழ்த்தினார்; இஸ்ரவேல் மக்கள் பென்யமீன் ஆண்களை அழித்தார்கள் என்ற இரு செயல்களும் தனித்தனியாகத் தக்கவைக்கப்பட்டுள்ளன.
  alternative: முழுக்கத் தெய்வீகக் காரணத்தையோ முழுக்க மனித இராணுவ வெற்றியையோ மட்டும் வலியுறுத்துதல்.
  rationale: எபிரெய உரை தெய்வீகச் செயலையும் மனிதச் செயலையும் அடுத்தடுத்துச் சொல்கிறது; அவற்றில் ஒன்றை மற்றொன்றாகக் கரைக்காமல் உரையின் இறையியல் இழுவை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. போரின் கடுமை மென்மையாக்கப்படவில்லை; அதேவேளை பழமையான அல்லது செயற்கையான சொற்றொடர்கள் தவிர்க்கப்பட்டுள்ளன.
