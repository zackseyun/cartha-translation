base_translation:
  language: en
  yaml_path: translation/ot/judges/020/026.yaml
  text: Then all the sons of Israel and all the people went up and came to Bethel[a], and they wept and sat there before Yahweh and fasted that day until evening[b]. Then they offered up burnt offerings and peace offerings before Yahweh.
translation:
  language: ta
  text: பின்பு இஸ்ரவேல் மக்கள் அனைவரும்[a], அதாவது மக்கள் அனைவரும், மேலே சென்று பெத்தேலுக்கு வந்தார்கள். அவர்கள் அங்கே யாவேயின் முன்னிலையில் அழுது அமர்ந்திருந்தார்கள்; அன்றைய நாள் மாலைவரை உண்ணாவிரதம் இருந்தார்கள். பின்பு யாவேயின் முன்னிலையில் தகனப் பலிகளையும் சமாதானப் பலிகளையும்[b] செலுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “இஸ்ரவேலின் மகன்கள் அனைவரும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உறவுப் பலிகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: மேலே சென்று
  rationale: עלה பயணத்தின் மேல்நோக்கிய திசையைச் சுட்டுகிறது; ‘மேலே சென்று’ என்பது அந்த நுணுக்கத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: כָל בְּנֵי יִשְׂרָאֵל וְכָל הָעָם
  choice: இஸ்ரவேல் மக்கள் அனைவரும், மக்கள் அனைவரும்
  rationale: בני ישראל என்பதைக் காலத்திற்கேற்ற, கூட்டுமக்களைக் குறிக்கும் ‘இஸ்ரவேல் மக்கள்’ என மொழிபெயர்த்து, தொடர்ந்து வரும் வலியுறுத்தும் இரண்டாம் சொற்றொடரையும் நீக்காமல் வைத்துள்ளது.
- source_word: בֵית אֵל
  choice: பெத்தேல்
  rationale: இது இச்சூழலில் இடப்பெயர்; தமிழில் வழக்கமான ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּבְכּוּ
  choice: அவர்கள் அழுது
  rationale: தோல்வி மற்றும் வழிபாட்டுச் சூழலில் உள்ள புலம்பலை எளிய, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיֵּשְׁבוּ שָׁם לִפְנֵי יְהוָה
  choice: அங்கே யாவேக்கு முன்பாக அமர்ந்திருந்து
  rationale: ישב என்பதன் உடல் நிலையான ‘அமர்தல்’ என்ற பொருளைக் காக்கிறது; அங்கே தங்கியிருந்தார்கள் என்ற நீடித்த நுணுக்கமும் ‘அமர்ந்திருந்து’ என்பதில் வெளிப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழுக்கு ஏற்ற வகையில் இறைப் பெயராக ஒலிபெயர்க்கிறது.
- source_word: וַיָּצוּמוּ
  choice: உண்ணாநோன்பிருந்தார்கள்
  rationale: צום உணவைத் தவிர்த்து மேற்கொள்ளும் துக்கம் அல்லது பக்திச் செயலைக் குறிக்கிறது; ‘உண்ணாநோன்பு’ இதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בַיּוֹם הַהוּא עַד הָעָרֶב
  choice: அன்று மாலைவரை
  rationale: எபிரேய உரையின் கால எல்லையைச் சுருக்கமான நவீன தமிழில் முழுமையாகக் காக்கிறது.
- source_word: וַיַּעֲלוּ עֹלוֹת
  choice: தகனப் பலிகளைச் செலுத்தினார்கள்
  rationale: பலியிடும் சூழலில் Hiphil வடிவிலுள்ள עלה ‘பலியாகச் செலுத்துதல்’ என்று பொருள்படும்; עולה முழுவதும் எரிக்கப்படும் பலியாதலால் ‘தகனப் பலி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: שְׁלָמִים
  choice: சமாதானப் பலிகள்
  rationale: שלמים என்பதற்கான மரபான, பொருத்தமான தமிழ் இணை; அதில் உறவு அல்லது பங்குண்ணுதல் சார்ந்த அம்சமும் இருக்கலாம் என்பதால் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: உடன்படிக்கையின் பெயரான יְהוָה-ஐ மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை பொதுப் பட்டமாக மாற்றாமல் பெயராகவே ஒலிபெயர்த்துள்ளது.
- issue: בני ישראל என்ற ஆண்பால் வடிவிலான தேசியக் குறிப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இங்கு முழு தேசியக் கூட்டத்தையும் குறிக்கும் பிரதிநிதித்துவப் பன்மை உள்ளது. நவீன தமிழில் ஆண்களை மட்டும் குறிக்கும் தவறான எண்ணத்தைத் தவிர்க்க ‘மக்கள்’ எனத் தரப்பட்டு, மூலத்தின் குடும்பவழி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: שְׁלָמִים பலியின் பொருள் வரம்பு
  choice: சமாதானப் பலிகள்
  alternative: உறவுப் பலிகள்
  rationale: மூலச் சொல் சமாதானம், முழுமை, கூட்டு உணவு மற்றும் உறவு ஆகிய கருத்துகளோடு தொடர்புடையது. முதன்மை உரையில் மரபான பெயர் வைக்கப்பட்டு, மேலும் விளக்கமளிக்கும் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. தொடர்ச்சியான எபிரேய வினைகளை இயல்பான தமிழ் வாக்கிய ஓட்டத்தில் இணைத்தாலும், ‘மேலே சென்று ... வந்தார்கள்’ என்ற திசை மற்றும் வருகை ஆகிய இரு கூறுகளும் காக்கப்பட்டுள்ளன. மூலத்தில் மீளும் ‘அனைவரும் / மக்கள் அனைவரும்’ என்ற வலியுறுத்தல் சுருக்கப்படவில்லை.
