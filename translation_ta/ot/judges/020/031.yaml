  rationale: திருத்தம் மூலத்தின் சொல்லளவைத் தக்கவைத்துக்கொண்டு, தாக்குதலின் முறையைத் தேவையின்றிக் குறிப்பாக்கிய ‘வெட்டிச் சாய்க்க’ என்பதை ‘தாக்கிக் கொல்ல’ என மாற்றுகிறது. இறுதியில் இறந்தவர்கள் இஸ்ரயேலர் என்பதை வெளிப்படையாகக் குறிப்பிடுகிறது. வழிகள் பற்றிய புவியியல் குறிப்பும், நகரத்திலிருந்து வெளியே கவரப்பட்ட தந்திரநிலையும் பாதுகாக்கப்பட்டுள்ளன.
