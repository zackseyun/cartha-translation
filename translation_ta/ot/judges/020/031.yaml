  yaml_path: translation/ot/judges/020/031.yaml
  text: And the sons of Benjamin came out to meet the people[a], and were drawn away from the city; and they began to strike down some of the people, as at other times, on the highways, one of which goes up to Bethel and one to Gibeah in the open country[d][c][b], about thirty men of Israel.
translation:
  language: ta
  text: பென்யமீன் மக்கள் அந்த மக்களை எதிர்கொள்ள வெளியே வந்தார்கள்; அவர்கள் நகரத்திலிருந்து வெளியே இழுக்கப்பட்டார்கள்.[a] முன்பு போலவே, அவர்கள் பெருவழிகளில் அந்த மக்களில் சிலரைத் தாக்கிக் கொல்லத் தொடங்கினார்கள். அந்த வழிகளில் ஒன்று பெத்தேலுக்கு ஏறிச் செல்கிறது; மற்றொன்று திறந்தவெளியில் கிபியாவுக்குச் செல்கிறது. இவ்வாறு அவர்கள் இஸ்ரயேலரில் ஏறக்குறைய முப்பது பேரைக் கொன்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நகரத்திலிருந்து பிரிக்கப்பட்டார்கள்” அல்லது “நகரத்திலிருந்து வெளியே வரவழைக்கப்பட்டார்கள்.” அவர்கள் நகரின் பாதுகாப்பிலிருந்து வெளியே கவரப்பட்டார்கள் என்பதே சூழலின் கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בִנְיָמִן
  choice: பென்யமீனின் மக்கள்
  rationale: எபிரெய மொழியின் ‘பென்யமீனின் மகன்கள்’ என்ற குல அடையாளச் சொல்லை, நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: לִקְרַאת הָעָם
  choice: இஸ்ரயேல் படையை எதிர்கொள்ள
  rationale: עָם என்பதன் அடிப்படைப் பொருள் ‘மக்கள்’ என்றாலும், இச்சூழலில் எதிரே நிற்கும் இஸ்ரயேல் போர்ப்படையைக் குறிக்கிறது; ‘எதிர்கொள்ள’ என்பது சந்திக்கச் சென்ற போர்நோக்கைத் தெளிவாக்குகிறது.
- source_word: הָנְתְּקוּ מִן הָעִיר
  choice: நகரத்திலிருந்து விலகி இழுக்கப்பட்டார்கள்
  rationale: நகரின் பாதுகாப்பிலிருந்து தந்திரமாக வெளியே இழுக்கப்பட்டார்கள் என்ற சூழல்சார் பொருளையும், எபிரெய வடிவிலுள்ள தெளிவின்மையையும் அளவுக்கு மீறாமல் காக்கிறது.
- source_word: וַיָּחֵלּוּ לְהַכּוֹת ... חֲלָלִים
  choice: வெட்டிச் சாய்க்கத் தொடங்கினார்கள்
  rationale: தாக்குதல் தொடங்கியதையும் அதன் உயிரிழப்பு விளைவையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: כְּפַעַם בְּפַעַם
  choice: முன்பு நடந்ததுபோலவே
  rationale: முந்தைய போர்களில் நிகழ்ந்த முறையுடன் இத்தாக்குதலை ஒப்பிடும் எபிரெய மரபுத்தொடரின் பொருளைத் தருகிறது.
- source_word: בַּמְסִלּוֹת
  choice: சாலைகளில்
  rationale: முக்கிய அல்லது அமைக்கப்பட்ட பாதைகளைக் குறிக்கும் சொல்லை, இச்சூழலில் பொதுவாகப் புரியும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: אַחַת עֹלָה בֵית אֵל וְאַחַת גִּבְעָתָה בַּשָּׂדֶה
  choice: ஒன்று பெத்தேலுக்கும் மற்றொன்று திறந்தவெளி வழியாக கிபியாவுக்கும் செல்கிறது
  rationale: இரு சாலைகளின் இலக்குகளையும், בַשָּׂדֶה என்பதன் திறந்த நாட்டுப்புறப் பாதைச் சுட்டையும் தெளிவாகக் காட்டுகிறது.
- source_word: כִּשְׁלֹשִׁים אִישׁ בְּיִשְׂרָאֵל
  choice: ஏறக்குறைய முப்பது பேரை
  rationale: כִּ என்பதன் தோராய எண்ணிக்கையையும், கொல்லப்பட்டவர்கள் இஸ்ரயேலர் என்பதையும் முன் வாக்கியத் தொடர்பில் இயல்பாக வழங்குகிறது.
