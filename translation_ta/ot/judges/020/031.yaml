- from: பென்யமீனின் மக்கள் இஸ்ரயேல் படையை எதிர்கொள்ளப் புறப்பட்டு வந்து, நகரத்திலிருந்து விலகி இழுக்கப்பட்டார்கள்.[a] முன்பு நடந்ததுபோலவே அவர்கள் இஸ்ரயேல் மக்களில் சிலரைச் சாலைகளில் வெட்டிச் சாய்க்கத் தொடங்கினார்கள். அந்தச் சாலைகளில் ஒன்று பெத்தேலுக்கும் மற்றொன்று திறந்தவெளி வழியாக கிபியாவுக்கும் செல்கிறது. இவ்வாறு அவர்கள் ஏறக்குறைய முப்பது பேரை வெட்டிச் சாய்த்தார்கள்.
