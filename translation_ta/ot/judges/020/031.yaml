  register: நவீனத் தரத் தமிழில், வரலாற்றுப் போர்விவரத்திற்கேற்ற கண்ணியமான மற்றும் பொதுவாகப் புரியும் நடை பயன்படுத்தப்பட்டது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது; இடப்பெயர்கள் ‘பெத்தேல்’, ‘கிபியா’ என ஒலிபெயர்க்கப்பட்டன.
