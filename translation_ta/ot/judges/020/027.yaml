source:
  edition: WLC
  text: וַ/יִּשְׁאֲל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּֽ/יהוָ֑ה וְ/שָׁ֗ם אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים בַּ/יָּמִ֖ים הָ/הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/027.yaml
  text: And the sons of Israel inquired of Yahweh—for the ark of the covenant of God was there in those days—[a][b]
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள்[a] யாவேயிடம் விசாரித்தார்கள்—ஏனெனில், அந்த நாட்களில் தேவனுடைய உடன்படிக்கைப் பெட்டி அங்கே இருந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொற்படியாக, ‘இஸ்ரவேலின் மகன்கள்.’ இங்கு அது இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அந்த நாட்களில் தேவனுடைய உடன்படிக்கைப் பெட்டி அங்கே இருந்தது’ என்ற கூற்று, அவர்கள் யாவேயிடம் விசாரித்த சூழலை விளக்குகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ
  choice: விசாரித்தார்கள்
  rationale: שׁאל + בְּ + இறைப்பெயர் என்பது சாதாரணமாகக் கேள்வி கேட்பதைவிட, இறைவனிடமிருந்து வழிகாட்டுதலையோ தீர்ப்பையோ நாடுவதைக் குறிக்கிறது. ‘விசாரித்தார்கள்’ அந்த முறையான சமயப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இக்கதைச்சூழலில் அது இஸ்ரவேல் சமூகத்தாரைக் கூட்டாகக் குறிக்கிறது. ‘இஸ்ரவேல் மக்கள்’ நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது; சொற்படியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בַּיהוָה
  choice: யாவேயிடம்
  rationale: שׁאל உடன் வரும் בְּ இங்கு விசாரித்தலின் நோக்குநபரைக் குறிக்கிறது; தமிழில் ‘-யிடம்’ இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், பொதுவாக ஏற்றுக்கொள்ளப்படும் ‘Yahweh’ ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ‘யாவே’ என்று எழுத்துப்பெயர்க்கிறது.
- source_word: וְשָׁם
  choice: ஏனெனில் ... அங்கே இருந்தது
  rationale: וְ இங்கு வெறும் தொடரிணைப்பாக மட்டும் இல்லாமல், விசாரணையின் சூழலை விளக்கும் இடைச்செருகல் வாக்கியத்தை அறிமுகப்படுத்துகிறது. நீள்கோடும் ‘ஏனெனில்’ என்பதும் அந்த விளக்கத் தொடர்பைத் தெளிவாக்குகின்றன.
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: தேவனுடைய உடன்படிக்கைப் பெட்டி
  rationale: முழுக் கட்டமைப்பையும் இயல்பான தமிழில் காத்து, இது தேவனுடைய உடன்படிக்கையுடன் தொடர்புடைய புனிதப் பெட்டி என்பதைத் தெளிவுபடுத்துகிறது.
- source_word: בַּיָּמִים הָהֵם
  choice: அந்த நாட்களில்
  rationale: எபிரெய மொழியின் வழக்கமான காலக் குறிப்பை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை ஒரு பட்டமாக மாற்றாமல் காத்து, ‘Yahweh’ என்ற பரவலாக ஏற்றுக்கொள்ளப்படும் ஒலிப்பைத் தமிழில் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பழமையான ‘புத்திரர்’ என்பதற்குப் பதிலாக ‘மக்கள்’ என்றும், புனிதப் பொருளைக் குறிக்கும் אֲרוֹן என்பதற்கு தெளிவான ‘பெட்டி’ என்றும் வழங்கப்பட்டுள்ளது. விளக்க இடைச்செருகலை நீள்கோடு குறிக்கிறது.
