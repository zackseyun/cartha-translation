base_translation:
  language: en
  yaml_path: translation/ot/judges/020/017.yaml
  text: And the men of Israel[a], apart from Benjamin, were mustered at four hundred thousand men drawing the sword[c][b]; all these were men of war.
translation:
  language: ta
  text: பென்யமீனைத் தவிர, இஸ்ரவேலின் ஆண்கள் வாளை உருவும் நான்கு இலட்சம் பேராகப் படைக்காக அணிதிரட்டப்பட்டனர்[a]; இவர்கள் அனைவரும் போர்வீரர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான்கு இலட்சம் பேராகக் கணக்கிடப்பட்டனர்.” எபிரெய வினைச்சொல் இராணுவச் சேவைக்காக எண்ணப்படுதல், பதிவு செய்யப்படுதல், அல்லது அணிதிரட்டப்படுதல் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஆண்கள்
  rationale: אִישׁ ஒருமை வடிவில் இருந்தாலும், இங்கு பன்மை வினையுடன் கூட்டுப்பொருளில் வந்து இஸ்ரவேலின் போரிடத்தக்க ஆண்களைக் குறிக்கிறது.
- source_word: הִתְפָּקְדוּ
  choice: கணக்கெடுக்கப்பட்டபோது
  rationale: פקד என்பதன் ஹித்பயேல் வடிவம் இராணுவச் சூழலில் சேவைக்காகப் பதிவு செய்யப்படுதல் அல்லது கணக்கெடுக்கப்படுதல் எனப் பொருள்படும். தமிழில் இயல்பாக வாசிக்க காலநிலைத் தொடராக வழங்கப்பட்டுள்ளது.
- source_word: לְבַד מִבִּנְיָמִן
  choice: பென்யமீனைத் தவிர
  rationale: கொடுக்கப்படும் மொத்த எண்ணிக்கையில் பென்யமீன் சேர்க்கப்படவில்லை என்பதைப் பிரிப்புப் பொருளுடன் தெளிவாகக் காட்டுகிறது.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף אִישׁ
  choice: நான்கு இலட்சம் பேர்
  rationale: எபிரெய எண்ணிக்கையான நானூறு ஆயிரத்தைத் தமிழின் இயல்பான எண்ணியல் வழக்கில் நான்கு இலட்சம் எனத் தருகிறது; אִישׁ என்பதன் ஆண் குறிப்பு முன்னுள்ள தொடரிலும் அடுத்துள்ள தொடரிலும் வெளிப்படுகிறது.
- source_word: שֹׁלֵף חָרֶב
  choice: வாள் உருவும் ஆண்கள்
  rationale: ‘வாளை உருவுகிற’ என்ற எபிரெயப் படிமத்தைப் பாதுகாத்து, ஆயுதமேந்திய போராளிகளைக் குறிக்கும் இராணுவ மரபுத்தொடரையும் வெளிப்படுத்துகிறது.
- source_word: כָּל זֶה
  choice: இவர்கள் அனைவரும்
  rationale: சொற்படி ‘இவை/இது அனைத்தும்’ என்றாலும், முன்பு எண்ணப்பட்ட ஆண்கள் அனைவரையும் குறிக்கும் இயல்பான தமிழாக்கம்.
- source_word: אִישׁ מִלְחָמָה
  choice: போர்வீரர்கள்
  rationale: போருக்குரிய ஆண்கள் என்ற எபிரெய இராணுவச் சொல்லாட்சியைச் சுருக்கமாகவும் நவீனத் தமிழில் இயல்பாகவும் தருகிறது.
