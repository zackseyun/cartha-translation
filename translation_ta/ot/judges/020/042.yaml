base_translation:
  language: en
  yaml_path: translation/ot/judges/020/042.yaml
  text: So they turned before the men of Israel toward the way of the wilderness[a], but the battle overtook them[c][b]; and those from the cities were destroying them in their midst.
translation:
  language: ta
  text: அவர்கள் இஸ்ரவேல் வீரர்களுக்கு முன்பாகத் திரும்பி, பாலைநிலத்துக்குச் செல்லும் வழியை நோக்கிச் சென்றார்கள்.[a] ஆனால் போர் அவர்களை எட்டிப்பிடித்தது;[b] நகரங்களிலிருந்து வந்தவர்களோ அவர்களுடைய நடுவிலேயே அவர்களை அழித்துக்கொண்டிருந்தார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இஸ்ரவேல் வீரர்களுக்கு முன்பாக” என்பது எபிரெயச் சொல்லாட்சி. இதை “இஸ்ரவேல் வீரர்களிடமிருந்து திரும்பி,” அதாவது அவர்களிடமிருந்து பின்வாங்கி, என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “போர் அவர்களைத் துரத்திப் பிடித்தது.”
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் இந்த இறுதிக் கூற்று சுருக்கமாகவும் பொருள் தீர்மானிக்கக் கடினமாகவும் உள்ளது. நகரங்களிலிருந்தோ பதுங்கியிருந்த இடங்களிலிருந்தோ வெளிவந்த இஸ்ரவேல் படையினர் பென்யமீனரின் அணிவகுப்புக்குள் தாக்கி அவர்களை அழித்ததை இது குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: திரும்பி
  rationale: פנה என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்’ என்பதைக் காக்கிறது; போர்ச் சூழலில் இது பின்வாங்குதலைக் குறிப்பிட்டாலும், ‘தப்பியோடினர்’ என்று மிகையாகத் தெளிவுபடுத்தவில்லை.
- source_word: לִפְנֵי אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேல் வீரர்களுக்கு முன்பாக
  rationale: சொல்லாட்சியில் உள்ள ‘இஸ்ரவேலின் ஆண்கள்’ என்ற படைச்சூழலை இயல்பான தமிழில் ‘இஸ்ரவேல் வீரர்கள்’ எனக் கொடுக்கிறது; לִפְנֵי என்பதன் இடவியல் வடிவத்தையும் காக்கிறது.
- source_word: אֶל דֶּרֶךְ הַמִּדְבָּר
  choice: பாலைநிலத்துக்குச் செல்லும் வழியை நோக்கி
  rationale: דֶּרֶךְ என்பதன் ‘வழி/சாலை’ பொருளையும், அந்த வழி பாலைநிலத்தை நோக்கிச் செல்கிறது என்பதையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְהַמִּלְחָמָה הִדְבִּיקָתְהוּ
  choice: ஆனால் போர் அவர்களை எட்டிப்பிடித்தது
  rationale: דבק என்பதன் ஹிப்ஃபில் வடிவம் துரத்திச் சென்று எட்டிப்பிடித்தலைக் குறிக்கிறது. சூழலின் எதிர்மறைத் திருப்பத்தைத் தமிழில் ‘ஆனால்’ தெளிவாகக் காட்டுகிறது; எபிரெயச் சொற்றொடரின் ‘போர்’ என்ற உருவக எழுவாயையும் காக்கிறது.
- source_word: וַאֲשֶׁר מֵהֶעָרִים
  choice: நகரங்களிலிருந்து வந்தவர்களோ
  rationale: சுருக்கமாகவும் தெளிவற்றும் உள்ள உறவுத்தொடரை அதிகமாக நிரப்பாமல் மொழிபெயர்க்கிறது. இவர்கள் இஸ்ரவேல் படையினர் எனச் சூழல் சுட்டினாலும், அதை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: מַשְׁחִיתִים
  choice: அழித்துக்கொண்டிருந்தார்கள்
  rationale: שׁחת என்பதன் அழித்தல் என்ற அடிப்படைப் பொருளைக் காக்கிறது; தொடர்ச்சியாக நடைபெற்ற படுகொலையை வினைநிலை வெளிப்படுத்துகிறது.
- source_word: אוֹתוֹ
  choice: அவர்களை
  rationale: எபிரெயத்தில் ஒருமைச் சுட்டுப்பெயர் இருந்தாலும், அது பென்யமீன் படையை ஒரு கூட்டாகக் குறிக்கிறது; தமிழில் பன்மை இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּתוֹכוֹ
  choice: அவர்களுடைய நடுவிலேயே
  rationale: ஒருமை பின்னொட்டு கூட்டுப்பொருளைக் கொண்டதாகப் புரிந்துகொள்ளப்படுகிறது. தாக்குதல் அவர்களின் அணிவகுப்பின் நடுவில் நடந்தது என்ற இடவியல் கருத்தைக் காக்கிறது; ‘-ஏ’ உள்ளிருந்து தாக்கப்பட்டதன் தீவிரத்தை இயல்பாக உணர்த்துகிறது.
