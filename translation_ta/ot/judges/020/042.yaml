translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான போர்வருணனை. ‘வீரர்கள்,’ ‘பாலைநிலம்,’ ‘எட்டிப்பிடித்தது’ ஆகியவை இயல்பையும் மூலமொழி உருவகத்தையும் சமநிலைப்படுத்துகின்றன. எபிரெய இறுதிக் கூற்றின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
