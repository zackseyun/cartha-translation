  yaml_path: translation/ot/judges/020/041.yaml
  text: Then the men of Israel turned[a], and the men of Benjamin were terrified, because they saw that disaster had come upon them.
translation:
  language: ta
  text: அப்போது இஸ்ரவேல் வீரர்கள்[a] திரும்பினர்; பென்யமீன் வீரர்கள் தங்கள்மேல் தீங்கு வந்துவிட்டதைக் கண்டதால் திகிலடைந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இஸ்ரவேல் வீரன்,’ ‘பென்யமீன் வீரன்,’ ‘அவன் கண்டான்,’ ‘அவன்மேல்’ என்ற எபிரெய ஒருமை வடிவங்கள் இங்கு இரு தரப்புப் படைகளையும் கூட்டாகக் குறிக்கின்றன; இயல்பான தமிழுக்காக அவை பன்மையில் மொழிபெயர்க்கப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ יִשְׂרָאֵל
  choice: அப்போது இஸ்ரவேல் வீரர்கள்
  rationale: ஒருமை வடிவிலுள்ள אִישׁ இங்கு இஸ்ரவேலின் போர்ப்படையைக் கூட்டாகக் குறிக்கிறது. கதைத் தொடரை இயல்பாகக் காட்ட וְ என்பது ‘அப்போது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הָפַךְ
  choice: திரும்பித் தாக்கினர்
  rationale: போர்ச் சூழலில் இச்சொல் வெறுமனே திரும்பியதை அல்ல, எதிரியை நோக்கித் திரும்பிய தந்திர நடவடிக்கையைக் குறிக்கிறது; தமிழில் பொருள் தெளிவாக இருக்க ‘தாக்கினர்’ சேர்க்கப்பட்டது.
- source_word: וַ/יִּבָּהֵל
  choice: திகிலடைந்தனர்
  rationale: בהל திடீரென ஏற்பட்ட கடும் அச்சத்தையும் கலக்கத்தையும் குறிக்கிறது; ‘திகிலடைந்தனர்’ அதன் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: אִישׁ בִּנְיָמִן
  choice: பென்யமீன் வீரர்கள்
  rationale: ஒருமை வடிவம் பென்யமீனின் போர்வீரர்களைக் கூட்டாகக் குறிக்கிறது; போர்ச் சூழலைத் தெளிவாக்க ‘வீரர்கள்’ பயன்படுத்தப்பட்டது.
- source_word: כִּי רָאָה כִּי
  choice: …கண்டதால்
  rationale: முதல் כִּי காரணத்தையும் இரண்டாவது כִּי கண்டதன் உள்ளடக்கத்தையும் அறிமுகப்படுத்துகிறது. தமிழில் இரண்டையும் இயல்பாக ஒருங்கிணைக்க ‘…கண்டதால்’ பயன்படுத்தப்பட்டது.
- source_word: נָגְעָה עָלָיו
  choice: தங்களுக்கு … வந்துவிட்டது
  rationale: நேரடியாக ‘அவன்மேல் தொட்டது’ என்ற அமைப்பு இங்கு ஒரு கேடு வந்து சேர்ந்துவிட்டதைக் குறிக்கிறது. நிறைவேறிய அபாய உணர்வை ‘வந்துவிட்டது’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָרָעָה
  choice: பேரழிவு
  rationale: רָעָה இங்கு ஒழுக்கத் தீமையை அல்ல, போரில் நேர்ந்த அழிவான கேட்டைச் சுட்டுகிறது; ‘பேரழிவு’ சூழலின் தீவிரத்தைத் தருகிறது.
