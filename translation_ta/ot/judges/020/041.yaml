revisions:
- from: அப்போது இஸ்ரவேல் வீரர்கள் திரும்பித் தாக்கினர்[a]. பென்யமீன் வீரர்களோ தங்களுக்குப் பேரழிவு வந்துவிட்டதைக் கண்டதால் திகிலடைந்தனர்.
  to: அப்போது இஸ்ரவேல் வீரர்கள்[a] திரும்பினர்; பென்யமீன் வீரர்கள் தங்கள்மேல் தீங்கு வந்துவிட்டதைக் கண்டதால் திகிலடைந்தனர்.
  rationale: மூலத்தில் இல்லாத ‘தாக்கினர்’ நீக்கப்பட்டுள்ளது. மேலும், הָרָעָה என்பதன் சூழல்சார் பொருளான வந்துசேரும் கேட்டை, தேவையற்ற தீவிரப்படுத்தல் இன்றி ‘தீங்கு’ என வழங்கப்பட்டுள்ளது. கூட்டு ஒருமை குறித்த அடிக்குறிப்பு தொடர்ந்தும் அனைத்து தொடர்புடைய வடிவங்களையும் விளக்குகிறது.
