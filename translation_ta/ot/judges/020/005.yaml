base_translation:
  language: en
  yaml_path: translation/ot/judges/020/005.yaml
  text: Then the men of Gibeah rose up against me and surrounded the house at night[a]. They intended to kill me, and they violated my concubine[b], and she died.
translation:
  language: ta
  text: அப்போது கிபியாவின் ஆண்கள் எனக்கு எதிராக எழுந்து, இரவில் அந்த வீட்டைச் சுற்றிவளைத்தார்கள். என்னைக் கொல்ல அவர்கள் எண்ணினார்கள்; என் துணைமனைவியைப் பாலியல் வன்முறைக்கு உட்படுத்தினார்கள்[a]; அவள் இறந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளைப் பாலியல் வல்லுறவு செய்தார்கள்.” இங்குள்ள எபிரெய வினைச்சொல் கடுமையாக இழிவுபடுத்துவதையோ கொடுமைப்படுத்துவதையோ குறிக்கலாம்; இச்சூழலில் அது பாலியல் வன்முறையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֵי הַגִּבְעָה
  choice: கிபியாவின் ஆண்கள்
  rationale: בעלי என்பது இங்கு பட்டம் பெற்ற ‘எஜமானர்கள்’ என்பதைக் காட்டாமல், நகரத்தின் ஆண் குடிமக்களைக் குறிக்கும் வழக்குச் சொல்.
- source_word: וַיָּקֻמוּ עָלַי
  choice: எனக்கு எதிராக எழும்பி
  rationale: קום על என்ற பகைமைச் சொல்லாட்சியின் உருவகத்தையும் எதிர்ப்பின் வலிமையையும் காக்கிறது.
- source_word: וַיָּסֹבּוּ עָלַי אֶת־הַבַּיִת
  choice: அந்த வீட்டைச் சூழ்ந்துகொண்டார்கள்
  rationale: வீட்டைச் சுற்றிவளைத்த செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘என்னைச் சுற்றி’ என்பதைத் தனியே சேர்ப்பது தமிழில் செயற்கையாக இருக்கும்.
- source_word: לָיְלָה
  choice: இரவில்
  rationale: செயல் நடந்த நேரத்தைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: דִּמּוּ לַהֲרֹג
  choice: கொல்ல எண்ணினார்கள்
  rationale: דמה இங்கு திட்டம் அல்லது நோக்கத்தைக் குறிக்கிறது; மூலத்தின் நோக்கக் கருத்தைத் தெளிவாகக் காக்கிறது.
- source_word: פִּילַגְשִׁי
  choice: என் மறுமனைவி
  rationale: פילגש குறிக்கும், முழு மனைவி நிலையிலிருந்து வேறுபட்ட இரண்டாம் நிலைத் துணைவியை நவீன வாசகருக்குப் புரியும் மரியாதையான தமிழில் குறிக்கிறது.
- source_word: עִנּוּ
  choice: வன்கொடுமை செய்தார்கள்
  rationale: ענה பியேல் வடிவம் இழிவுபடுத்தல் அல்லது கடுமையான வன்முறையைக் குறிக்கலாம்; இச்சூழலில் பாலியல் வல்லுறவு என்பது தெளிவு. முதன்மை உரை மூலச் சொல்லின் ஓரளவு பரப்பைத் தக்கவைக்கிறது; அடிக்குறிப்பு சூழல்சார் பொருளைத் தெளிவாக்குகிறது.
- source_word: וַתָּמֹת
  choice: அவள் இறந்துபோனாள்
  rationale: வாவ் தொடர்வினையின் கதைத் தொடர்ச்சியை நேரடியாகக் காட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத நோக்கம் அல்லது காரணத் தொடர்பைச் சேர்க்கவில்லை.
