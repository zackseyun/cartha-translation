translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வனாந்தரம்’ வேதாகமப் பயன்பாட்டில் பரிச்சயமான சொல்லாக இருப்பதுடன், இங்கு குடியிருப்பற்ற காட்டுப்பகுதி என்ற பொருளைக் கொடுக்கிறது. எல்லா அடிக்குறிப்பு அடையாளங்களும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
