base_translation:
  language: en
  yaml_path: translation/ot/judges/020/047.yaml
  text: But six hundred men turned and fled toward the wilderness[a], to the rock of Rimmon[b], and stayed at the rock of Rimmon four months.
translation:
  language: ta
  text: ஆனால் அறுநூறு ஆண்கள் திரும்பி, வனாந்தரத்தை நோக்கி[a] ரிம்மோன் கற்பாறைக்குத்[b] தப்பியோடினார்கள். அவர்கள் ரிம்மோன் கற்பாறையில் நான்கு மாதங்கள் தங்கியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வனாந்தரத்திற்குள்.’ திசையைக் குறிக்கும் எபிரெய வடிவம், வனாந்தரப் பகுதியை நோக்கிய அல்லது அதற்குள் சென்ற நகர்வைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘ரிம்மோனின் கற்பாறை’; ‘ரிம்மோன் கற்பாறை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: திரும்பி
  rationale: திசைமாற்றத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; அடுத்து வரும் தப்பியோடுதல் என்ற செயலுடன் நன்றாக இணைகிறது.
- source_word: וַיָּנֻסוּ
  choice: தப்பியோடினார்கள்
  rationale: נוּס என்பதன் அவசரமான தப்பிச்செல்லும் பொருளையும் போர்ச் சூழலையும் தெளிவாகக் காக்கிறது.
- source_word: הַמִּדְבָּרָה
  choice: வனாந்தரத்தை நோக்கி
  rationale: திசையைக் குறிக்கும் எபிரெய வடிவம் வனாந்தரப் பகுதியை நோக்கிய அல்லது அதற்குள் சென்ற இயக்கத்தைக் குறிக்கலாம்; முதன்மை உரையில் அந்தத் தெளிவின்மையை அளவுக்கு மீறித் தீர்மானிக்கவில்லை.
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: ரிம்மோன் கற்பாறைக்கு
  rationale: סֶלַע என்பதன் பாறை/பாறை அரண் சார்ந்த இடப்பொருளைக் காக்கிறது; எபிரெய பெயரமைப்பையும் இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: அறுநூறு பேர்
  rationale: இராணுவச் சூழலில் எண்ணப்படுவோர் ஆண்கள் என்றாலும், தமிழில் ‘பேர்’ இயல்பான எண்ணுச் சொல்லாக இருந்து சூழலால் அவர்களின் அடையாளம் தெளிவாகிறது.
- source_word: וַיֵּשְׁבוּ
  choice: தங்கியிருந்தார்கள்
  rationale: நான்கு மாதங்களுக்கான தற்காலிகத் தங்குதலை இயல்பாகக் கூறுகிறது; நிரந்தரக் குடியேற்றம் என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: בְּסֶלַע רִמּוֹן
  choice: ரிம்மோன் கற்பாறையில்
  rationale: בְּ என்பதன் இடவியல் பொருளை நேரடியாகக் காக்கிறது; பாறை சார்ந்த அடைக்கல இடத்தில் அவர்கள் இருந்ததைக் குறிக்கிறது.
- source_word: אַרְבָּעָה חֳדָשִׁים
  choice: நான்கு மாதங்கள்
  rationale: கால அளவை நேரடியாகவும் தெளிவாகவும் மொழிபெயர்க்கிறது.
- source_word: וַ
  choice: ஆனால்
  rationale: முந்தைய அழிவிலிருந்து உயிர்தப்பிய இந்த அறுநூறு பேரை வேறுபடுத்திக் காட்டும் நிகழ்ச்சித் தொடரின் எதிர்மறைத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
