base_translation:
  language: en
  yaml_path: translation/ot/judges/020/045.yaml
  text: Then they turned and fled toward the wilderness[a], to the rock of Rimmon. And they cut down five thousand men of them on the highways, and pursued them as far as Gidom[b], and struck down two thousand men of them.
translation:
  language: ta
  text: அப்போது அவர்கள் திரும்பி, வனாந்தரத்தை நோக்கி ரிம்மோன் கற்பாறைக்குத் தப்பியோடினார்கள். பெருவழிகளில் அவர்களில் ஐயாயிரம் பேரை இஸ்ரவேலர்கள் வெட்டி வீழ்த்தினார்கள்[a]. அவர்களை[b] கிதோம் வரை துரத்திச் சென்று, அவர்களில் இரண்டாயிரம் பேரை வெட்டி வீழ்த்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதற்கான எபிரெயச் சொல் சொல்லுக்குச் சொல் மொழிபெயர்த்தால், “அவனைப் பொறுக்கினார்கள்” என வரும். அறுவடைக்குப் பின் எஞ்சியதைப் பொறுக்கும் உருவகம் இங்கு தப்பியோடியவர்களை ஒருவருக்கொருவராக வெட்டி வீழ்த்துவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் இவ்விடங்களில் “அவனுக்குப் பின்னால்,” “அவனிடமிருந்து” என ஒருமை பின்னொட்டுகள் உள்ளன; அவை தப்பியோடிய பென்யமீனியரை ஒரு கூட்டமாகக் குறிப்பிடுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ וַיָּנֻסוּ
  choice: அவர்கள் திரும்பி ... தப்பியோடினார்கள்
  rationale: פנה திசைமாற்றத்தையும் נוס போரிலிருந்து ஓடுவதையும் குறிக்கின்றன. ‘திரும்பி’ என்பது தேவையின்றி ‘திரும்பிச் சென்றனர்’ எனப் பின்னோக்கிய இயக்கத்தை வலியுறுத்தாமல் திசைமாற்றத்தைத் தருகிறது; ‘தப்பியோடினார்கள்’ என்பது இராணுவத் தோல்வியிலான ஓட்டத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמִּדְבָּרָה
  choice: வனாந்தரத்தை நோக்கி
  rationale: இறுதியில் உள்ள திசைச்சுட்டு -ה, வனாந்தரப் பகுதியை நோக்கிய இயக்கத்தைக் குறிக்கிறது. ‘நோக்கி’ அந்த நுணுக்கத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: ரிம்மோன் கற்பாறைக்கு
  rationale: סֶלַע என்பது பாறை அல்லது கற்பாறை; ரிம்மோன் இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது. ‘கற்பாறை’ இயற்கையான பாறை அரண் என்ற பொருளுக்கு ஏற்றது.
- source_word: וַיְעֹלְלֻהוּ
  choice: வெட்டி வீழ்த்தினார்கள்
  rationale: עלל என்பதன் அடிப்படை உருவகம் ‘மீதியைப் பொறுக்குதல்’; இங்கு தப்பியோடியவர்களை ஒருவருக்கொருவராகக் கொன்று வீழ்த்துவதைக் குறிக்கும் போர் மரபுத்தொடர். வாசிக்க இயல்பான பொருள் முதன்மை உரையில் தரப்பட்டு, உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בַּמְסִלּוֹת
  choice: பெருவழிகளில்
  rationale: מְסִלּוֹת என்பது அமைக்கப்பட்ட அல்லது உயர்த்தப்பட்ட முக்கியச் சாலைகளைக் குறிக்கும். நவீனச் சூழலிலுள்ள அதிவேகச் சாலை என்ற தவறான உணர்வைத் தவிர்த்து ‘பெருவழிகள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: חֲמֵשֶׁת אֲלָפִים אִישׁ
  choice: ஐயாயிரம் பேர்
  rationale: எபிரெய உரை மனிதர்களின் எண்ணிக்கையைத் தருகிறது. சூழல் ஆண்களைக் குறித்தாலும், தமிழில் எண்ணிக்கையோடு ‘பேர்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது; ‘வீரர்கள்’ என்பது உரையில் வெளிப்படையாக இல்லாத விளக்கத்தைச் சேர்க்கும்.
- source_word: וַיַּדְבִּיקוּ אַחֲרָיו
  choice: அவர்களை ... துரத்திச் சென்று
  rationale: דבק என்பதன் ஹிஃபில் வடிவம் நெருக்கமாகப் பின்தொடர்ந்து துரத்துவதை இங்கு குறிக்கிறது. ‘கடுமையாக’ போன்ற மூலத்தில் இல்லாத வினையடையைச் சேர்க்காமல், தமிழில் இயல்பான தொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַד גִּדְעֹם
  choice: கிதோம் வரை
  rationale: עַד துரத்தலின் எல்லையைக் குறிக்கிறது; இடப்பெயர் גִּדְעֹם ‘கிதோம்’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּכּוּ מִמֶּנּוּ אַלְפַּיִם אִישׁ
  choice: அவர்களில் இரண்டாயிரம் பேரை வெட்டி வீழ்த்தினார்கள்
  rationale: נכה போர் சூழலில் கொன்று வீழ்த்துவதைக் குறிக்கிறது; מִמֶּנּוּ ஒருமை வடிவிலிருந்தாலும் கூட்டத்திலிருந்து ஒரு பகுதியைச் சுட்டுகிறது. ‘மேலும்’ என்பது சூழலால் புரிந்தாலும் மூலத்தில் வெளிப்படையாக இல்லாததால் சேர்க்கப்படவில்லை.
