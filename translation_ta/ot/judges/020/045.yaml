  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று விவரண நடை பயன்படுத்தப்பட்டுள்ளது. செய்பவர் மாறுவது சூழலில் தெளிவாக இருக்க ‘இஸ்ரவேலர்கள்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது; இல்லையெனில் தப்பியோடியவர்களே தங்களை வெட்டி வீழ்த்தியதாகத் தமிழில் தவறாகப் புரியக்கூடும். ‘வனாந்தரம்,’ ‘கற்பாறை,’ ‘பெருவழி’ ஆகியவை வேதாகம வரலாற்று நடைக்கு ஏற்றவையாக இருந்தாலும் இன்றைய வாசகருக்கும் தெளிவானவை.
