base_translation:
  language: en
  yaml_path: translation/ot/judges/020/039.yaml
  text: Then the men of Israel turned in the battle[a], and Benjamin began to strike down the slain among the men of Israel, about thirty men, for they said, “Surely he is utterly defeated before us[b], as in the first battle.”
translation:
  language: ta
  text: அப்போது இஸ்ரவேல் வீரர்கள் போரில் திரும்பினர். பென்யமீனியர்கள் இஸ்ரவேல் வீரர்களில் ஏறக்குறைய முப்பது பேரைக் கொன்று வீழ்த்தத் தொடங்கினர்[a]. ஏனெனில் அவர்கள், “முதல் போரில் இருந்ததுபோலவே, இஸ்ரவேல் நம்முன் நிச்சயமாக முற்றிலும் தோற்கடிக்கப்பட்டிருக்கிறது[b]” என்று சொல்லிக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘இஸ்ரவேல் வீரர்களிடையே கொல்லப்பட்டவர்களை அடிக்கத் தொடங்கினர்’ என்ற சுருக்கமான போர்ச் சொல்லாட்சி உள்ளது. இதன் பொருள், இஸ்ரவேல் வீரர்களில் சிலரைக் கொன்று வீழ்த்தத் தொடங்கினர் என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: ‘தோற்கடிக்கப்பட்டிருக்கிறது’ என்பதற்கான எபிரெய வடிவம் ஒருமையில் உள்ளது; அது இஸ்ரவேலை ஒரே கூட்டாகக் குறிப்பிடுகிறது. இதை ‘இஸ்ரவேலர் நம்முன் நிச்சயமாக முற்றிலும் தோற்கடிக்கப்பட்டிருக்கிறார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲפֹךְ אִישׁ יִשְׂרָאֵל בַּמִּלְחָמָה
  choice: இஸ்ரவேல் வீரர்கள் போரில் திரும்பித் தாக்கினர்
  rationale: אִישׁ יִשְׂרָאֵל என்பது இங்கு படைவீரர்களைக் கூட்டாகக் குறிக்கிறது. הָפַךְ என்பதன் ‘திரும்புதல்’ என்ற பொருளையும், போர்ச் சூழலில் அது எதிரியை நோக்கித் திரும்பியதைக் குறிக்கிறது என்பதையும் இயல்பான தமிழில் தெரிவிக்க ‘திரும்பித் தாக்கினர்’ பயன்படுத்தப்பட்டது.
- source_word: וּבִנְיָמִן
  choice: பென்யமீனியர்களோ
  rationale: கோத்திரத்தின் பெயர் அதன் போர்வீரர்களைக் குறிக்கும் ஆகுபெயராக வருகிறது. நவீனத் தமிழில் நபர்களைக் குறிக்க ‘பென்யமீனியர்கள்’ தெளிவாக உள்ளது; וּ இணைப்பின் எதிர்முகத் தொடர்ச்சியை ‘-ஓ’ காட்டுகிறது.
- source_word: הֵחֵל לְהַכּוֹת חֲלָלִים בְּאִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேல் வீரர்களில் ... பேரை வெட்டிச் சாய்க்கத் தொடங்கினர்
  rationale: சொற்றொடர் எபிரெயத்தில் சுருக்கமான போர்மரபுச் சொல்லாட்சியாக உள்ளது. ‘வெட்டிச் சாய்க்க’ என்பது נכה மற்றும் חֲלָלִים ஆகியவற்றின் கொன்று வீழ்த்தும் கருத்தை இயல்பான தமிழில் ஒருங்கிணைக்கிறது; அதன் சொற்சுருக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כִּשְׁלֹשִׁים אִישׁ
  choice: ஏறக்குறைய முப்பது பேரை
  rationale: כְּ முன்னொட்டு தோராயமான எண்ணிக்கையைக் குறிக்கிறது; ‘ஏறக்குறைய’ அதனைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אַךְ נִגּוֹף נִגָּף הוּא לְפָנֵינוּ
  choice: இப்போதும் இஸ்ரவேல் நமக்கு முன்பாக முற்றிலும் தோற்கடிக்கப்பட்டுவிட்டது
  rationale: முற்றுவினையெச்சத்தோடு அதே வேர்ச்சொல்லின் வினை அமைவது வலியுறுத்தலைக் காட்டுகிறது; அதனை ‘முற்றிலும்’ வெளிப்படுத்துகிறது. ஒருமைச் சுட்டுப்பெயர் இஸ்ரவேலை ஒரு கூட்டாகக் குறிப்பிடுவதால் தமிழிலும் ‘இஸ்ரவேல் ... தோற்கடிக்கப்பட்டுவிட்டது’ என்று ஒருமைத் தன்மை காக்கப்பட்டது.
- source_word: כַּמִּלְחָמָה הָרִאשֹׁנָה
  choice: முந்தைய போரில் நடந்ததுபோலவே
  rationale: ‘முதலாம் போரைப்போல’ என்ற சொற்சார்ந்த வடிவத்தைவிட, இங்கு முந்திய போரில் ஏற்பட்ட தோல்வியுடன் ஒப்பிடப்படுவதை இவ்வடிவம் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலைக் குறிக்கும் எபிரெய ஒருமை வடிவம்
  choice: ‘இஸ்ரவேல் ... தோற்கடிக்கப்பட்டுவிட்டது’ என்ற கூட்டொருமை
  alternative: ‘இஸ்ரவேலர் ... தோற்கடிக்கப்பட்டுவிட்டார்கள்’ என்ற பன்மை
  rationale: மூலத்தில் הוּא மற்றும் נִגָּף ஒருமையில் இருப்பதால் இஸ்ரவேல் ஒரே கூட்டாகக் கருதப்படுகிறது. தமிழில் புரியத்தக்க கூட்டொருமையால் இதைக் காத்து, இயல்பான பன்மை வாய்ப்பை அடிக்குறிப்பில் தருவது மூலத்தின் எண்ணியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நடை நவீனத் தரத் தமிழிலும், போர்க் கதையாடலுக்கேற்ற கண்ணியமான சுருக்கத்துடனும் அமைக்கப்பட்டுள்ளது. ‘வெட்டிச் சாய்க்க’, ‘திரும்பித் தாக்கினர்’ ஆகியவை சாதாரண வாசகருக்குத் தெளிவாக இருக்கும்படியும் மூலப் போர்ச்சூழலை உயிரோட்டமாகக் காக்கும்படியும் தேர்ந்தெடுக்கப்பட்டன.
