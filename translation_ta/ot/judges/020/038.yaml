base_translation:
  language: en
  yaml_path: translation/ot/judges/020/038.yaml
  text: The appointed sign between the men of Israel and the ambush was that they should make a great cloud of smoke rise from the city[a][b][c].
translation:
  language: ta
  text: 'இஸ்ரவேல் வீரர்களுக்கும் பதுங்கியிருந்த படையினருக்கும் இடையே முன்கூட்டியே ஒப்புக்கொள்ளப்பட்ட அடையாளம்[a][b] இதுதான்: அவர்கள் நகரத்திலிருந்து பெரும் புகைத்திரளை எழும்பச் செய்ய வேண்டும்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குறிக்கப்பட்ட நேரம்,” “முன்கூட்டியே செய்யப்பட்ட ஏற்பாடு,” அல்லது “ஒப்புக்கொள்ளப்பட்ட குறியீடு.” எபிரெயச் சொல் மוֹעֵד பொதுவாகக் குறிக்கப்பட்ட நேரத்தைக் குறிக்கும்; இங்கு அது போருக்காக முன்னதாக ஒப்புக்கொள்ளப்பட்ட சமிக்ஞையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “இஸ்ரவேல் மனிதர்களுக்கு, பதுங்கியிருந்த படையினரோடு.” இங்கு இரு தரப்பினருக்கும் இடையேயான ஏற்பாடு என்பதே பொருள்.'
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “பெரும் புகைக்கம்பத்தை” அல்லது “புகைத் திரட்சியை.” எபிரெயத் தொடர் நகரிலிருந்து தெளிவாக மேலெழும் புகைச் சமிக்ஞையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמּוֹעֵד
  choice: முன்கூட்டியே ஒப்புக்கொள்ளப்பட்ட அடையாளம்
  rationale: מוֹעֵד என்பதன் வழக்கமான பொருள் ‘குறிக்கப்பட்ட நேரம்’ அல்லது ‘நியமிக்கப்பட்ட சந்திப்பு.’ ஆனால் இப்போர்ச் சூழலில் இரு தரப்பினரும் முன்னதாக ஒப்புக்கொண்ட புகைச் சமிக்ஞையை இது குறிக்கிறது. ‘முன்கூட்டியே ஒப்புக்கொள்ளப்பட்ட அடையாளம்’ என்பது முன்நியமனத்தையும் சூழல்சார் செயல்பாட்டையும் வெளிப்படுத்துகிறது.
- source_word: לְאִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேல் வீரர்களுக்கும்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘இஸ்ரவேலின் மனிதன்/மனிதர்களுக்கு’ என்பதாக இருந்தாலும், இங்கு அது போரில் ஈடுபட்ட இஸ்ரவேல் ஆட்களைக் கூட்டாகக் குறிக்கிறது. עִם என்பதுடன் சேர்ந்த அமைப்பை இயல்பான தமிழில் ‘...க்கும் ...க்கும் இடையே’ என்று வழங்கப்பட்டுள்ளது.
- source_word: עִם הָאֹרֵב
  choice: பதுங்கியிருந்த படையினருக்கும்
  rationale: אֹרֵב என்பது பதுங்கிக் காத்திருப்பவரை அல்லது பதுங்கிய தாக்குதல் படையை கூட்டாகக் குறிக்கலாம். இங்கு சமிக்ஞையைச் செயல்படுத்தும் படைப்பிரிவைக் குறிப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הֶרֶב
  choice: பெரும்
  rationale: רבה வேரிலிருந்து வந்த இவ்வடிவம் அடுத்த செயலை வலுப்படுத்துகிறது. தமிழில் மரபுசார் வடிவத்தை அப்படியே மீள்கூறாமல், விளையும் புகைத்திரளின் பெருமையைக் காட்டும் ‘பெரும்’ என்பதால் அதன் தீவிரம் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: לְהַעֲלוֹתָם
  choice: அவர்கள் ... எழும்பச் செய்ய வேண்டும்
  rationale: עלה என்பதன் ஹிஃபில் வடிவம் ‘மேலே செல்லச் செய், எழுப்பு’ என்று பொருள்படும். மூன்றாம் நபர் பன்மை பின்னொட்டு சமிக்ஞையை ஏற்படுத்தும் தரப்பைக் குறிக்கிறது; அதைத் தமிழில் வெளிப்படையான வாக்கியமாக வழங்குவது இயல்பாக உள்ளது.
- source_word: מַשְׂאַת הֶעָשָׁן
  choice: புகைத்திரளை
  rationale: מַשְׂאַת என்பது மேலெழுப்பப்பட்ட ஒன்றை அல்லது மேலெழும் திரளை இங்கு குறிக்கிறது. הֶעָשָׁן உடன் சேர்ந்தபோது நகரிலிருந்து தெளிவாகத் தெரியும் புகைச் சமிக்ஞையாகிய புகைத்திரளைச் சுட்டுகிறது.
- source_word: מִן הָעִיר
  choice: நகரத்திலிருந்து
  rationale: புகை எழும் இடத்தை நேரடியாகக் குறிக்கும் இயல்பான தமிழாக்கம்.
