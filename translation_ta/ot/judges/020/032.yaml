  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י בִנְיָמִ֔ן נִגָּפִ֥ים הֵ֛ם לְ/פָנֵ֖י/נוּ כְּ/בָ/רִאשֹׁנָ֑ה וּ/בְנֵ֧י יִשְׂרָאֵ֣ל אָמְר֗וּ נָנ֨וּסָה֙ וּֽ/נְתַקְּנֻ֔/הוּ מִן הָ/עִ֖יר אֶל הַֽ/מְסִלּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/032.yaml
  text: And the sons of Benjamin said[a], “They are being struck down before us as at the first.” But the sons of Israel said[c][b], “Let us flee and draw them away from the city to the highways.”
translation:
  language: ta
  text: பென்யமீனியர், “முந்தைய முறைபோலவே அவர்கள் நம்முன் வீழ்த்தப்படுகிறார்கள்”[a] என்றார்கள். ஆனால் இஸ்ரவேலர், “நாம் ஓடுவோம்; அவர்களை[b] நகரத்திலிருந்து பிரதான பாதைகளுக்கு[c] இழுத்துச் செல்வோம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முந்தைய முறைபோலவே” என்பது இவ்வதிகாரத்தில் இதற்கு முன்பு நடந்த மோதல்களைக் குறிக்கிறது; இதை “முன்புபோல” அல்லது “முதல் மோதலில் நடந்ததுபோல” என்றும் மொழிபெயர்க்கலாம்.
    reason: cross_reference
  - marker: b
    text: எபிரெயத்தில் இங்கு “அவனை இழுத்துச் செல்வோம்” என்று ஒருமை வடிவம் உள்ளது. அது பென்யமீன் மக்களையோ அவர்களுடைய போர்ப்படையையோ கூட்டொருமையாகக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: c
    text: இதனை “சாலைகள்” அல்லது “முக்கிய சாலைகள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அமைக்கப்பட்ட அல்லது உயர்த்தப்பட்ட பாதைகளைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגָּפִים
  choice: வீழ்த்தப்படுகிறார்கள்
  rationale: இது போர்ச் சூழலில் அடித்து வீழ்த்தப்படுதல் அல்லது தோற்கடிக்கப்படுதல் என்ற செயலற்ற தொடர்நிலையை உணர்த்துகிறது. ‘வீழ்த்தப்படுகிறார்கள்’ என்பது வெறும் ‘தோற்கிறார்கள்’ என்பதைவிட மூலத்தின் தெளிவான போர்ச் சித்திரத்தைப் பாதுகாக்கிறது.
- source_word: לְפָנֵינוּ
  choice: நம்முன்
  rationale: போரில் ‘எங்கள் முன்னிலையில்’ அல்லது ‘எங்கள் கையால்’ என்ற பொருளுடைய இயல்பான எபிரெயச் சொற்றொடர்; தமிழில் ‘நம்முன்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: כְּבָרִאשֹׁנָה
  choice: முந்தையதைப் போலவே இப்போதும்
  rationale: இவ்வதிகாரத்தில் முன்பு நடந்த மோதல்களைப் பின்னோக்கிக் குறிக்கிறது. ‘முதல் போரில்’ என்று மூலத்தில் இல்லாத பெயர்ச்சொல்லைச் சேர்க்காமல் ஒப்பீட்டைத் தெளிவாக்குகிறது.
- source_word: נָנוּסָה
  choice: நாம் ஓடிப்போய்
  rationale: முதல் நபர் பன்மை cohortative வடிவத்தின் ஆலோசனை/தீர்மான நுணுக்கத்தை அடுத்து வரும் வினையுடன் இணைந்த இயல்பான தமிழ் திட்டவாக்கியமாக வெளிப்படுத்துகிறது.
- source_word: וּנְתַקְּנֻהוּ
  choice: அவர்களை இழுத்துவருவோம்
  rationale: נתק என்பதன் இச்சூழல் பொருள் எதிரிப்படையை அதன் இடத்திலிருந்து இழுத்து அகற்றுதல். எபிரெயத்தில் ஒருமை பின்னொட்டு இருந்தாலும் அது பென்யமீன் மக்களையோ படையையோ கூட்டொருமையாகக் குறிக்கிறது; தமிழில் பொருளைத் தெளிவாகக் காட்டப் பன்மை பயன்படுத்தப்பட்டது.
- source_word: הָעִיר
  choice: நகரம்
  rationale: עִיר என்பதற்கான வழக்கமான பொருள்; இங்கு கிபியா என்னும் நகர மையத்தைக் குறிக்கிறது.
- source_word: הַמְסִלּוֹת
  choice: நெடுஞ்சாலைகள்
  rationale: מְסִלָּה என்பது அமைக்கப்பட்ட அல்லது உயர்த்தப்பட்ட பிரதான பாதையைக் குறிக்கக்கூடும். பன்மையைப் பாதுகாத்து, பொதுவான ‘சாலைகள்’ என்பதைக் காட்டிலும் சொல்லின் தனித்தன்மையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: וּנְתַקְּנֻהוּ என்பதிலுள்ள ஒருமை ஆண்பால் பொருள் பின்னொட்டு
  choice: முதன்மை உரையில் ‘அவர்களை’ என்று பன்மையாக மொழிபெயர்த்து, ஒருமை வடிவத்தை அடிக்குறிப்பில் பதிவு செய்தல்
  alternative: ‘அவனை’ அல்லது ‘அதை’ என்று இலக்கண ஒருமையை நேரடியாகப் பாதுகாத்தல்
  rationale: இப்பின்னொட்டு பென்யமீனையோ அதன் போர்ப்படையையோ கூட்டொருமையாகக் குறிக்க வாய்ப்புள்ளது. தமிழில் ‘அவனை’ என்பது தனி மனிதரைத் தவறாகச் சுட்டும்; ‘அதை’ மனிதக் குழுவை இயல்பற்றதாகக் காட்டும். பன்மை சூழற்பொருளைப் பாதுகாக்கிறது; அடிக்குறிப்பு மூல இலக்கண வடிவத்தை வெளிப்படையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வாசிக்க எளிதான அதேவேளையில் கண்ணியமான போர்க்கதை நடையைப் பயன்படுத்துகிறது. ‘பென்யமீனின் மகன்கள்’ என்ற சொற்சொல் வடிவத்திற்குப் பதிலாக இயல்பான இனக்குழுப் பெயரான ‘பென்யமீனியர்’ பயன்படுத்தப்பட்டுள்ளது. இரு தரப்பினரின் எண்ணங்களும் நேரடி மேற்கோள்களாகப் பாதுகாக்கப்பட்டுள்ளன.
