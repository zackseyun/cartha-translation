  source_fidelity: மொத்தத்தில் மூலத்தின் இரு பேச்சுகளும், போர்த் தந்திரமும், நகரத்திலிருந்து பிரதான பாதைகளுக்குத் திசைதிருப்பும் கருத்தும் சரியாக உள்ளன. ஆனால் נָנוּסָה என்பது கூட்டுவினை வேண்டுகோள்; ‘நாம் ஓடிப்போய்’ என்பதற்குப் பதில் ‘ஓடுவோம்’ என்பது தெளிவாகும். மேலும் וּנְתַקְּנֻהוּ ‘இழுத்துவருவோம்’ என்பது நகரத்தை நோக்கி இழுத்துவரும் திசையைக் குறிக்கக்கூடியதால், மூலத்தின் ‘நகரத்திலிருந்து ... நோக்கி இழுத்துச் செல்வோம்’ என்ற திசையைத் தெளிவுபடுத்த வேண்டும்.
  naturalness: ‘பென்யமீனியர்’ மற்றும் ‘இஸ்ரவேலர்’ நவீனத் தரத் தமிழில் இயல்பானவை. ‘முந்தையதைப் போலவே இப்போதும்’ சிறிது கனமாகவும், ‘முந்தைய முறைபோல’ என்பது இச்சூழலில் இயல்பாகவும் துல்லியமாகவும் உள்ளது. ‘நெடுஞ்சாலைகள்’ நவீன வாகனச் சாலைகளை நினைவூட்டலாம்; பழங்காலப் போர்க்கதைச் சூழலில் ‘பிரதான பாதைகள்’ அல்லது ‘முக்கிய சாலைகள்’ சிறந்தது.
