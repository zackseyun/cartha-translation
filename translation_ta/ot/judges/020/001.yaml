revisions:
- from: அப்போது இஸ்ரவேலின் மகன்கள் அனைவரும் புறப்பட்டு வந்தார்கள்[a]. தாண்முதல் பெயெர்செபாவரை இருந்தவர்களும் கிலேயாத் நாட்டிலிருந்தவர்களும் அடங்கிய சபையார், ஒரே மனிதனைப்போல்[b] மிஸ்பாவில் யாவேயிடம்[c] ஒன்றுகூடினர்.
  to: அப்பொழுது இஸ்ரவேல் மகன்கள் அனைவரும் புறப்பட்டார்கள்[a]; தாண் முதல் பெயெர்செபா வரையிலும் கிலேயாத் நாட்டிலிருந்தும் வந்த சபையார், ஒரே மனிதனாக[b], மிஸ்பாவில் யாவேயிடம் கூடினர்[c].
  rationale: 'திருத்தம் மூலத்தின் இரண்டு இணைந்த வினைச் செயல்களைத் தெளிவாகக் காக்கிறது: இஸ்ரவேல் மகன்கள் புறப்பட்டனர்; சபை ஒருமனமாகக் கூடியது. ‘தாண் முதல் பெயெர்செபா வரையிலும் கிலேயாத் நாட்டிலிருந்தும்’ என்ற தொடர் கூடிவந்த சபையின் புவியியல் பரப்பாக இயல்பாக அமைக்கப்பட்டுள்ளது. மிஸ்பாவில் யாவேயிடம் கூடுதல் என்ற மூலத்தின் சற்றே திறந்த தொடர்பு முதன்மை உரையில் காக்கப்பட்டு, ‘யாவேயின் முன்னிலையில்’ என்ற சாத்தியமான புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.'
