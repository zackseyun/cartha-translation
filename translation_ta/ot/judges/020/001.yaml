  text: וַ/יֵּצְאוּ֮ כָּל בְּנֵ֣י יִשְׂרָאֵל֒ וַ/תִּקָּהֵ֨ל הָ/עֵדָ֜ה כְּ/אִ֣ישׁ אֶחָ֗ד לְ/מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע וְ/אֶ֖רֶץ הַ/גִּלְעָ֑ד אֶל יְהוָ֖ה הַ/מִּצְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/001.yaml
  text: Then all the sons of Israel came out[a], and the congregation assembled as one man, from Dan to Beer-sheba, and from the land of Gilead[c][b], to Yahweh at Mizpah.
translation:
  language: ta
  text: அப்பொழுது இஸ்ரவேல் மகன்கள் அனைவரும் புறப்பட்டார்கள்[a]; தாண் முதல் பெயெர்செபா வரையிலும் கிலேயாத் நாட்டிலிருந்தும் வந்த சபையார், ஒரே மனிதனாக[b], மிஸ்பாவில் யாவேயிடம் கூடினர்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இஸ்ரவேல் மகன்கள்’ என்பது எபிரெய மொழியின் நேரடியான சொல்லாக்கம்; இங்கு அது ஆண்களை மட்டும் அல்லாமல் இஸ்ரவேல் கோத்திர மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஒரே மனிதனாக’ என்பது ஒருமனப்பட்டு, ஒன்றிணைந்து செயல்படுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: ‘மிஸ்பாவில் யாவேயின் முன்னிலையில்’ என்றும் மொழிபெயர்க்கலாம். கூட்டம் மிஸ்பாவில் யாவேயின் முன்னிலையில் கூடியதாக எபிரெயச் சொல்லாக்கத்தைப் புரிந்துகொள்ள முடியும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: புறப்பட்டு வந்தார்கள்
  rationale: יצא என்பதன் ‘வெளியே புறப்படுதல்’ என்ற அடிப்படை உணர்வையும், பல பகுதிகளிலிருந்து கூடிவந்த நிகழ்வின் திசையையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள் அனைவரும்
  rationale: எபிரெய உரையின் ‘இஸ்ரவேலின் மகன்கள்’ என்ற வடிவத்தைப் பேணுகிறது; இங்கு அது தனிப்பட்ட ஆண்களை மட்டும் அல்லாமல் இஸ்ரவேல் கோத்திர மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: וַתִּקָּהֵל הָעֵדָה
  choice: சபையார் ஒன்றுகூடினர்
  rationale: עֵדָה குறிக்கும் ஒன்றுகூடிய சமூகக் குழுவையும் קהל வினையின் கூடிவருதல் என்ற பொருளையும், தேவையற்ற வழிபாட்டுச் சிறப்புப் பொருளைச் சேர்க்காமல் இயல்பாகத் தருகிறது.
- source_word: כְּאִישׁ אֶחָד
  choice: ஒரே மனிதனைப்போல்
  rationale: ஒன்றுபட்ட மனத்தோடும் செயலோடும் கூடுதலைக் குறிக்கும் எபிரெய உருவகத்தையும் அதன் ஒருமை ஆண்பால் வடிவத்தையும் பேணுகிறது.
- source_word: לְמִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: தாண்முதல் பெயெர்செபாவரை இருந்தவர்கள்
  rationale: இஸ்ரவேல் நாட்டின் முழுப் பரப்பைக் குறிக்கும் வழக்கமான புவியியல் இணையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְאֶרֶץ הַגִּלְעָד
  choice: கிலேயாத் நாட்டிலிருந்தவர்கள்
  rationale: யோர்தானுக்கு அப்பாலிருந்த கிலேயாத் பகுதியும் கூட்டத்தில் பிரதிநிதித்துவம் பெற்றதைத் தெளிவாக்குகிறது; ‘இருந்தவர்கள்’ என்பது சூழலிலிருந்து நிரப்பப்பட்ட இயல்பான தமிழ் வடிவம்.
- source_word: אֶל יְהוָה
  choice: யாவேயிடம்
  rationale: אֶל என்பதன் நேரடியான ‘நோக்கி/இடம்’ சார்ந்த பொருளைப் பேணுகிறது; יהוה என்ற உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
- source_word: הַמִּצְפָּה
  choice: மிஸ்பாவில்
  rationale: இடப்பெயரை ஒலிபெயர்த்து, கூட்டம் நடைபெற்ற இடத்தை இயல்பான தமிழ் இடவேற்றுமையில் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் நான்கெழுத்து இறைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: אֶל יְהוָה என்பதன் தொடர்பு
  choice: யாவேயிடம்
  alternative: யாவேயின் முன்னிலையில்
  rationale: אֶל என்பதன் நேரடியான பொருளை முதன்மை உரையில் வைத்திருக்கிறது; இச்சூழலில் அது யாவேயின் முன்னிலையில் கூடுதலையும் குறிக்கக்கூடும் என்பதால் அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் பேணப்படுகிறது.
- issue: בְּנֵי יִשְׂרָאֵל மற்றும் כְּאִישׁ אֶחָד ஆகியவற்றின் ஆண்பால் மொழி
  choice: ‘இஸ்ரவேலின் மகன்கள்’ மற்றும் ‘ஒரே மனிதனைப்போல்’ என்று பேணுதல்
  alternative: ‘இஸ்ரவேலர்’ மற்றும் ‘ஒரே நபரைப்போல்’
  rationale: மூலத்தின் ஆண்பால் வடிவத்தையும் பிரதிநிதித்துவத் தன்மையையும் அழிக்காமல் வைத்துக் கொண்டு, அதன் கூட்டுப் பொருளை அடிக்குறிப்புகளில் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூலத்தின் கூட்டுப் பொருளையும் ஆண்பால் உருவகத்தையும் பேணியபடி, தவறான தனிநபர் வாசிப்பை அடிக்குறிப்புகள் தடுக்கும். புவியியல் பட்டியல் தமிழில் தெளிவாகப் புரிய ‘இருந்தவர்கள்’ என விரிக்கப்பட்டுள்ளது.
