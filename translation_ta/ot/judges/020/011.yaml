base_translation:
  language: en
  yaml_path: translation/ot/judges/020/011.yaml
  text: So all the men of Israel gathered to the city[a], united as one man.
translation:
  language: ta
  text: இவ்வாறு, இஸ்ரவேலின் ஆண்கள் அனைவரும் ஒரே மனிதனைப்போல் ஒன்றிணைந்து[a] அந்த நகரை நோக்கிக் கூடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒரே மனிதனைப்போல் ஒன்றிணைந்து” என்பது அவர்கள் செயலில் முற்றிலும் ஒருமித்திருந்ததை வலியுறுத்தும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: கூடினார்கள்
  rationale: நிஃபால் வடிவம் இங்கு மக்கள் ஒரே இடத்தில் ஒன்றுகூடியதைக் குறிக்கிறது. தமிழில் பன்மை எழுவாயோடு இயல்பாகச் செயல்பாட்டு வடிவத்தில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஆண்கள் அனைவரும்
  rationale: כָּל உடன் வரும் ஒருமை אִישׁ கூட்டாகவும் பகிர்ந்தளிக்கும் பொருளிலும் உள்ளது; போர் நடவடிக்கைக்காகத் திரண்ட ஆண்களையே சூழல் குறிக்கிறது.
- source_word: אֶל הָעִיר
  choice: அந்த நகரில்
  rationale: אֶל அடிப்படையில் நகரை நோக்கிய இயக்கத்தைக் குறிக்கிறது; ‘கூடுதல்’ என்ற தமிழ்ச் சொல்லோடு இலக்கிடத்தை இயல்பாகக் காட்ட ‘அந்த நகரில்’ என வழங்கப்பட்டுள்ளது. எபிரெயச் சொல் தன்னிச்சையாக ‘நகருக்கு எதிராக’ என்று சொல்லவில்லை.
- source_word: כְּאִישׁ אֶחָד
  choice: ஒரே மனிதனைப்போல்
  rationale: முழுமையான ஒருமித்த செயல்பாட்டைக் குறிக்கும் எபிரெய மரபுத்தொடரின் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: חֲבֵרִים
  choice: ஒன்றிணைந்து
  rationale: இறுதிச் சொல் அவர்கள் இணைக்கப்பட்டவர்களாக, ஒருமித்த நிலையில் இருந்ததைக் கூட்டாக வலியுறுத்துகிறது; தமிழில் வினையடைச் செயல்பாட்டோடு இயல்பாக வழங்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் ‘ஒரே மனிதன்’ என்ற உருவகமும் அதனுடன் வரும் ஒன்றிணைவு வலியுறுத்தலும் தக்கவைக்கப்பட்டுள்ளன.
