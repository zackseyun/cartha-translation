  source_fidelity: மூலத்தின் கடினமான מְנוּחָה சொல்லை ‘ஓய்வின்றி’ என எடுத்துக்கொண்டு, அதன் இடப்பெயர் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. הִדְרִיכֻהוּ-வின் வன்முறைமிக்க ‘மிதித்தல்’ வாசிப்பும் மாற்றுப் பொருளுடன் தரப்பட்டுள்ளது. ஆனால் முதன்மை உரையில் ‘சூரியன் உதிக்கும் கிழக்குப் பக்கம்வரை’ என்ற அமைப்பு திசைச்சொல்லை ‘வரை’ உடன் தேவையற்ற வகையில் பிணைக்கிறது; கிபியாவுக்கு எதிரேயுள்ள இடத்தின் கிழக்குத் திசை சார்ந்த அமைப்பைத் தெளிவாகச் சொல்லுதல் சிறந்தது.
  naturalness: ‘மிதித்துப்போட்டார்கள்’ என்பது நவீன தரநிலை உரைநடையில் சற்றே பேச்சுவழக்காகவும் மிகை முடிவுணர்வுடனும் ஒலிக்கிறது. ‘மிதித்துத் தள்ளினார்கள்’ போர்ச் சூழலின் வன்முறையையும் இயக்கத்தையும் இயல்பாகத் தருகிறது. இடவியல் சொற்றொடரின் வரிசையும் திருத்தப்பட்டுள்ளது.
