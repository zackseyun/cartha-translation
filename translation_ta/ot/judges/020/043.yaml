source:
  edition: WLC
  text: כִּתְּר֤וּ אֶת בִּנְיָמִן֙ הִרְדִיפֻ֔/הוּ מְנוּחָ֖ה הִדְרִיכֻ֑/הוּ עַ֛ד נֹ֥כַח הַ/גִּבְעָ֖ה מִ/מִּזְרַח שָֽׁמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/043.yaml
  text: They surrounded Benjamin[a], pursued him relentlessly, and trampled him down as far as opposite Gibeah[c][b], toward the east of the sun.
translation:
  language: ta
  text: அவர்கள் பென்யமீனைச் சுற்றிவளைத்து, அவனை ஓய்வின்றித் துரத்தி[a], கிபியாவுக்கு எதிரேயுள்ள இடம்வரை, கிழக்குத் திசையில் அவனை மிதித்துத் தள்ளினார்கள்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: מְנוּחָה என்பதை வினையடைப் பொருளில் அல்லாமல் இடப்பெயராக எடுத்தால், “மெனூகாவிலிருந்து அவனைத் துரத்தி” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “அவனை மிதித்துத் தள்ளினார்கள்” என்பதற்குப் பதிலாக, “அவனை ஓட்டிச் சென்றார்கள்” என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள எபிரெய வினை வலுக்கட்டாயமாக மிதிப்பதையோ, ஒருவனை நகர்த்துவதையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயச் சொற்றொடர் சொல்லர்த்தமாக, “சூரியன் உதிக்கும் திசையிலிருந்து” என்று உள்ளது; சூழலில் அது கிழக்குப் பக்கத்தையோ கிழக்கு நோக்கிய திசையையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּתְּרוּ
  choice: சுற்றிவளைத்து
  rationale: எதிரியைச் சூழ்ந்து தப்பிச் செல்ல முடியாதபடி வளைத்துக்கொள்வதைக் குறிக்கும் இராணுவப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֶת־בִּנְיָמִן
  choice: பென்யமீனை
  rationale: எபிரெயத்தில் கோத்திரத்தின் பெயரே அதன் மக்களையோ படையையோ கூட்டாகக் குறிக்கிறது; தொடரும் ஒருமை விகுதிகளுக்கும் ஏற்ப அந்த வடிவம் தக்கவைக்கப்படுகிறது.
- source_word: הִרְדִיפֻהוּ
  choice: அவனை ... துரத்தி
  rationale: போர்ச் சூழலில் רדף என்பதன் வழக்கமான பொருளான தொடர்ந்து விரட்டுதலைத் தெளிவாகக் கூறுகிறது; ஒருமைச் சுட்டு பென்யமீன் கோத்திரத்தைக் கூட்டாகக் குறிக்கிறது.
- source_word: מְנוּחָה
  choice: ஓய்வின்றி
  rationale: மூலச்சொல்லின் அடிப்படைப் பொருள் ‘ஓய்வு/ஓய்விடம்’; இங்குள்ள கடினமான வினையடைப் பயன்பாட்டை, துரத்தப்பட்டவனுக்கு ஓய்வு கொடுக்காத செயல் எனப் பொருள்படுத்துகிறது. இடப்பெயர் வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: הִדְרִיכֻהוּ
  choice: அவனை மிதித்துப்போட்டார்கள்
  rationale: דרך என்பதன் ஹிஃபில் வடிவம் மிதித்தல் அல்லது நடக்கச் செய்தல் என்ற இரு சாத்தியங்களைக் கொண்டது; போரின் வன்முறைச் செயல்தொடரில் ‘மிதித்துப்போட்டார்கள்’ பொருத்தமானது. மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַד נֹכַח הַגִּבְעָה
  choice: கிபியாவுக்கு எதிரே ... வரை
  rationale: נֹכַח குறிக்கும் ‘எதிரில்/முன்னால்’ என்ற இடவியல் உறவைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: מִמִּזְרַח שָׁמֶשׁ
  choice: சூரியன் உதிக்கும் கிழக்குப் பக்கம்வரை
  rationale: ‘சூரியன் உதிக்கும் திசை’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்தபடியே, அது கிழக்குப் பக்கத்தைக் குறிக்கிறது என்பதை நவீன தமிழில் தெளிவாக்குகிறது.
