translation_notes:
  register: நவீன தரநிலைத் தமிழில், போர்க்காட்சியின் தீவிரத்தைத் தக்கவைக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பென்யமீன்’ என்பது கோத்திரத்தையோ அதன் படையையோ குறிக்கும் கூட்டு ஒருமையாகவே வைக்கப்பட்டுள்ளது. கடினமான மְנוּחָה மற்றும் הִדְרִיכֻהוּ ஆகியவற்றின் உண்மையான பொருள்-தெளிவின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
