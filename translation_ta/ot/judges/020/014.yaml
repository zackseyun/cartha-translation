translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘மகன்கள்’ என்ற சொற்சொல் மொழிபெயர்ப்பால் ஏற்படக்கூடிய பாலினக் குழப்பம் தவிர்க்கப்பட்டு, கோத்திர அடையாளத்தை உணர்த்த ‘மக்கள்’ பயன்படுத்தப்பட்டது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
