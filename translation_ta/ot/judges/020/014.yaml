base_translation:
  language: en
  yaml_path: translation/ot/judges/020/014.yaml
  text: And the sons of Benjamin gathered from the cities to Gibeah to go out to battle against the sons of Israel[a][b].
translation:
  language: ta
  text: பென்யமீனின் மக்கள் நகரங்களிலிருந்து கிபியாவுக்குக் கூடி, இஸ்ரவேலின் மக்களுக்கு எதிராகப் போரிடப் புறப்பட்டார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘இஸ்ரவேலின் மக்களுடன்’; போர்ச் சூழலில் இதன் பொருள் ‘இஸ்ரவேலின் மக்களுக்கு எதிராக’ என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பென்யமீனியர் ... இஸ்ரவேலருக்கு எதிராக.’ முதன்மை உரை எபிரெயத்தின் கோத்திர அடையாளத்தை ‘பென்யமீனின் மக்கள்’, ‘இஸ்ரவேலின் மக்கள்’ என வழங்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: திரண்டு வந்து
  rationale: நிப்அல் வடிவம் ஒன்றுகூடுதல் அல்லது திரளுதல் என்ற பொருளைத் தருகிறது. நகரங்களிலிருந்து கிபியாவை நோக்கிய இயக்கத்தையும் இயல்பான தமிழில் காட்ட ‘திரண்டு வந்து’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְנֵי בִנְיָמִן
  choice: பென்யமீனின் மக்கள்
  rationale: எபிரெய tribal kinship idiom-ஐ சொற்சொறாக ‘பென்யமீனின் மகன்கள்’ என வழங்குவது தமிழில் ஆண்களை மட்டும் குறிக்கும் தவறான எண்ணத்தை ஏற்படுத்தலாம்; ‘மக்கள்’ என்பது கோத்திரத்தாரைக் குறிக்கும் இயல்பான, உள்ளடக்கத்துக்கு நெருக்கமான வடிவம்.
- source_word: מִן הֶעָרִים
  choice: பட்டணங்களிலிருந்து
  rationale: מִן தோற்ற இடத்தைக் குறிக்கிறது. இச்சூழலில் עָרִים என்பதற்கு ‘பட்டணங்கள்’ இயல்பாகவும் பண்டைய குடியிருப்பு மையங்களை மிகைப்படுத்தாமலும் அமைகிறது.
- source_word: הַגִּבְעָתָה
  choice: கிபியாவுக்கு
  rationale: இடப்பெயருடன் இணைந்த திசைகாட்டும் ה, கிபியாவை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் ‘கிபியாவுக்கு’ என்று இயல்பாக வழங்கப்படுகிறது.
- source_word: לָצֵאת לַמִּלְחָמָה
  choice: போரிடப் புறப்பட்டார்கள்
  rationale: ‘போருக்காக வெளியே செல்லுதல்’ என்ற எபிரெய இராணுவச் சொற்றொடரை, அதன் செயற்பொருளைத் தெளிவாகக் காக்கும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: עִם בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களுக்கு எதிராக
  rationale: עִם பொதுவாக ‘உடன்’ என்றாலும், போர் சூழலில் எதிர்நிலைப் பொருளாக வருகிறது. உள்நாட்டுப் போரான இச்சூழலில் ‘எதிராக’ என்பதே தேவையான பொருள்; ‘இஸ்ரவேலின் மக்கள்’ கோத்திரக் குடும்ப மொழிநடையை இயல்பான தமிழில் தருகிறது.
