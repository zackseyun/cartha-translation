  text: וַ/יִּרְא֥וּ בְנֵֽי בִנְיָמִ֖ן כִּ֣י נִגָּ֑פוּ וַ/יִּתְּנ֨וּ אִֽישׁ יִשְׂרָאֵ֤ל מָקוֹם֙ לְ/בִנְיָמִ֔ן כִּ֤י בָֽטְחוּ֙ אֶל הָ֣/אֹרֵ֔ב אֲשֶׁר שָׂ֖מוּ אֶל הַ/גִּבְעָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/036.yaml
  text: So the sons of Benjamin saw that they were defeated[a]. Now the men of Israel had given place to Benjamin[b], because they trusted in the ambush that they had set against Gibeah.
translation:
  language: ta
  text: அப்போது பென்யமீன் மக்கள் தாங்கள் தோற்கடிக்கப்பட்டதை கண்டார்கள். இஸ்ரவேலர் பென்யமீனருக்கு இடம் கொடுத்திருந்தார்கள்[a]; ஏனெனில் கிபியாவுக்கு எதிராகத் தாங்கள் நிறுத்தியிருந்த பதுங்கிப் படையை[b] அவர்கள் நம்பியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “பென்யமீனருக்கு இடம் கொடுத்திருந்தார்கள்.” இந்த எபிரெய மரபுத்தொடர், பென்யமீனரை வெளியே இழுப்பதற்காக இஸ்ரவேலர் வேண்டுமென்றே இடம்விட்டதையோ பின்வாங்கியதையோ குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: “தாங்கள் கிபியாவுக்கு எதிராக அமைத்திருந்த பதுங்குத் தாக்குதலை.” எபிரெயச் சொல் பதுங்கித் தாக்கும் ஏற்பாட்டையோ பதுங்கியிருந்த வீரர்களையோ குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: கண்டார்கள்
  rationale: ראה என்பதன் அடிப்படைப் பொருளான ‘காணுதல்’ என்பதைக் காத்து, சூழலில் உள்ள உணர்ந்துகொள்ளும் நுண்பொருளையும் இயல்பாகத் தருகிறது.
- source_word: בְנֵי בִנְיָמִן
  choice: பென்யமீன் மக்கள்
  rationale: எபிரெய உறவுமுறைச் சொல்லைத் தமிழில் சொற்சொல்லாக ‘மகன்கள்’ எனக் கொடுப்பதைவிட, குலத்தாரைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: כִּי נִגָּפוּ
  choice: தாங்கள் தோற்கடிக்கப்பட்டதை
  rationale: Niphal வடிவிலுள்ள נגף போரில் தோல்வியுறுதலைக் குறிக்கிறது; ‘தோற்கடிக்கப்பட்டனர்’ என்பது இச்சூழலுக்கு தெளிவான தமிழ்.
- source_word: וַיִּתְּנוּ ... מָקוֹם
  choice: இடங்கொடுத்துப் பின்வாங்கியிருந்தார்கள்
  rationale: ‘இடம் கொடுத்தல்’ என்ற மூல உருவகத்தையும், எதிரியை வெளியே இழுப்பதற்கான திட்டமிட்ட பின்வாங்கல் என்ற போர்ச் சூழலையும் ஒருங்கே வெளிப்படுத்துகிறது. இறந்தகால நிறைவுவடிவு, முந்திய நிகழ்விற்கான விளக்கத்தைக் காட்டுகிறது.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேல் வீரர்கள்
  rationale: ஒருமை வடிவம் கூட்டுப்பொருளில் போரிடும் இஸ்ரவேல் ஆண்களைக் குறிக்கிறது; ‘வீரர்கள்’ இப்போர்ச் சூழலில் இயல்பாக உள்ளது.
- source_word: כִּי בָטְחוּ
  choice: ஏனெனில் ... நம்பியிருந்தார்கள்
  rationale: בטח என்பதன் நம்பிக்கை/சார்ந்திருத்தல் என்ற நேரடிப் பொருளைத் தக்கவைக்கிறது.
- source_word: אֶל הָאֹרֵב
  choice: பதுங்கிப் படையை
  rationale: אֹרֵב என்பது பதுங்கித் தாக்கும் ஏற்பாட்டையோ பதுங்கியிருக்கும் படையையோ குறிக்கலாம்; இங்கு மனிதப் படையைக் குறிக்கும் இயல்பான தெரிவு செய்யப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: אֲשֶׁר שָׂמוּ
  choice: தாங்கள் நிறுத்தியிருந்த
  rationale: שׂים என்பதன் ‘வைத்தல்/நிறுத்துதல்’ பொருளில், படையை குறிப்பிட்ட இடத்தில் அமர்த்திய செயலை இயல்பாகக் காட்டுகிறது.
- source_word: אֶל הַגִּבְעָה
  choice: கிபியாவுக்கு எதிராக
  rationale: இராணுவச் சூழலில் אֶל என்பது நகரை நோக்கிய அல்லது அதற்கு எதிரான தந்திர நிலைப்பாட்டைக் குறிக்கிறது.
