base_translation:
  language: en
  yaml_path: translation/ot/judges/020/040.yaml
  text: But the signal began to rise from the city as a pillar of smoke[a], and Benjamin turned behind him, and behold[c][b], the whole city was going up to the heavens.
translation:
  language: ta
  text: ஆனால் அந்தச் சைகை நகரத்திலிருந்து புகைத்தூணாக எழும்பத் தொடங்கியது.[a] பென்யமீன் தனக்குப் பின்னால் திரும்பினான்;[b] இதோ, நகரம் முழுவதும் வானத்தை நோக்கி எழுந்துகொண்டிருந்தது.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நகரத்திலிருந்து புகைத்தூணாக அந்த எச்சரிக்கைச் சுடர் எழும்பத் தொடங்கியது.” எபிரெயச் சொல் உயர்த்தப்படும் ஒன்றைக் குறிக்கலாம்; இங்கு அது முன்கூட்டியே ஒப்புக்கொள்ளப்பட்ட போர்ச் சைகையைக் குறிக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “பென்யமீன் தனக்குப் பின்னால் திரும்பினான்.” இது அவன் திரும்பினான் அல்லது பின்னால் பார்க்கத் திரும்பினான் என்று பொருள்படலாம்.'
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “நகரம் முழுவதும் வானம்வரை எழும்பியது”; அதாவது, தீப்பிழம்பும் புகையுமாக மேலெழுந்தது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂאֵת
  choice: அந்த அடையாளம்
  rationale: போரின் சூழலில், பதுங்கியிருந்த படையினர் முன்கூட்டியே ஒப்புக்கொண்ட புகை அடையாளத்தையே இச்சொல் குறிக்கிறது. தமிழில் அதன் தகவல் தெரிவிக்கும் செயல்பாட்டை இயல்பாகக் காட்ட ‘அடையாளம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הֵחֵלָּה לַעֲלוֹת
  choice: எழும்பத் தொடங்கியது
  rationale: தொடக்கத்தையும் மேல்நோக்கிய இயக்கத்தையும் ஒருங்கே தெரிவிக்கிறது; புகையைப் பற்றிய தமிழ்ப் பயன்பாட்டிலும் இயல்பாக உள்ளது.
- source_word: עַמּוּד עָשָׁן
  choice: புகைத்தூணாக
  rationale: செங்குத்தாக உயர்ந்த புகைப் பிழம்பைச் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: וַיִּפֶן בִּנְיָמִן אַחֲרָיו
  choice: பென்யமீன் பின்னால் திரும்பிப் பார்த்தபோது
  rationale: எபிரெயத்தில் ‘திரும்பினான்’ என்பதே நேரடி பொருள்; அடுத்த காட்சியை அவன் கண்டதைக் கருத்தில் கொண்டு தமிழில் இயல்பாக ‘திரும்பிப் பார்த்தபோது’ என வழங்கப்பட்டது. ‘பென்யமீன்’ என்பது கோத்திரத்தை ஒருமையாகக் குறிக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீர் உணர்வையும் காட்சியின் நாடகத் தீவிரத்தையும் நவீனத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: עָלָה
  choice: எழும்பிக்கொண்டிருந்தது
  rationale: பென்யமீன் கண்டுகொண்டிருந்த தொடர்ச்சியான காட்சியை உணர்த்தும் வகையில் நிகழ்நிலைத் தொடர்ச்சி பயன்படுத்தப்பட்டது.
- source_word: כְלִיל הָעִיר
  choice: நகரம் முழுவதும்
  rationale: நகரத்தின் முழுமையைக் குறிக்கும் எபிரெயச் சொல்லை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַשָּׁמָיְמָה
  choice: வானத்தை நோக்கி
  rationale: திசையைக் குறிக்கும் எபிரெய இறுதியைத் தெளிவாக வெளிப்படுத்துகிறது; இங்கு வானம் என்பது மேல்நோக்கிய காட்சியைச் சுட்டுகிறது.
