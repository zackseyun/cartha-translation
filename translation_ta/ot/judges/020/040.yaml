translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘இதோ’ என்ற சொல் மூலத்தின் திடீர் காட்சித் தாக்கத்தைப் பாதுகாக்கிறது. நகரமே எழும்புவதாகக் கூறும் எபிரெய உருவகம் முதன்மை உரையில் தக்கவைக்கப்பட்டு, அதன் தீ மற்றும் புகை சார்ந்த பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
