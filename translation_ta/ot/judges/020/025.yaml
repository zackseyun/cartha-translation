base_translation:
  language: en
  yaml_path: translation/ot/judges/020/025.yaml
  text: Benjamin came out from Gibeah to meet them on the second day[a], and they struck down another eighteen thousand men of Israel to the ground[b]; all these were drawing the sword.
translation:
  language: ta
  text: இரண்டாம் நாளில் பென்யமீன் கோத்திரத்தார் கிபியாவிலிருந்து வெளியே வந்து அவர்களை எதிர்கொண்டார்கள்[a]; அவர்கள் இஸ்ரவேல் மக்களில்[b] மேலும் பதினெட்டாயிரம் ஆண்களைத் தரையில் வீழ்த்தினார்கள்; இவர்கள் அனைவரும் வாளை உருவியவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களைச் சந்திக்க’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் போர்ச் சூழலில் பகைமையாக எதிர்கொள்வதைக் குறிக்கவும் பயன்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘இஸ்ரவேலின் மகன்களில்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא בִנְיָמִן
  choice: பென்யமீனியர் புறப்பட்டு வந்தார்கள்
  rationale: எழுவாய் ஒருமை வடிவிலுள்ள ‘பென்யமீன்’ இங்கு கோத்திரத்தாரைக் கூட்டாகக் குறிக்கிறது. יצא என்பதின் வெளியே வருதல்/புறப்படுதல் என்ற இயக்கப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לִקְרָאתָם
  choice: அவர்களை எதிர்கொள்ள
  rationale: לקראת என்பதற்கு சந்திக்க அல்லது எதிர்கொள்ள என்ற பொருள் உண்டு; போர்ச் சூழலில் பகைமையான சந்திப்பைத் தெரிவிக்கும் ‘எதிர்கொள்ள’ பொருத்தமானது, அதேவேளை வினையின் அடிப்படைச் சந்திப்புப் பொருளையும் காக்கிறது.
- source_word: מִן הַגִּבְעָה
  choice: கிபியாவிலிருந்து
  rationale: இடத்திலிருந்து புறப்படுவதைக் குறிக்கும் מן என்பதையும் கிபியா என்ற இடப்பெயரையும் நேரடியாகக் காட்டுகிறது.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: இரண்டாம் நாளில்
  rationale: எபிரெய உரையின் வரிசை எண்ணைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיַּשְׁחִיתוּ
  choice: வீழ்த்தினார்கள்
  rationale: שׁחת என்பதின் ஹிஃபில் வடிவம் அழித்தல் அல்லது கொல்லுதல் எனப் பொருள்படும். போரில் ஏற்பட்ட உயிரிழப்பைக் காட்டும் இச்சூழலில் ‘வீழ்த்தினார்கள்’ இயல்பானது.
- source_word: בִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களில்
  rationale: בני ישראל என்ற தேசிய-குடும்பக் குறிப்பை தமிழில் இயல்பான ‘இஸ்ரவேல் மக்கள்’ எனத் தருகிறது; முன்னிலையான ב பாதிக்கப்பட்ட குழுவிலிருந்து எண்ணிக்கையைக் குறிக்கிறது.
- source_word: עוֹד שְׁמֹנַת עָשָׂר אֶלֶף אִישׁ
  choice: மேலும் பதினெட்டாயிரம் ஆண்களை
  rationale: עוד என்பதின் கூடுதல் எண்ணிக்கைப் பொருளை ‘மேலும்’ காக்கிறது; איש என்பதால் பாலினத்தைக் குறிப்பாக ‘ஆண்கள்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: אָרְצָה
  choice: தரையில்
  rationale: தரையை நோக்கிய திசையைக் குறிக்கும் வடிவம் கொல்லப்பட்டவர்கள் தரையில் வீழ்ந்ததைக் கூறும் எபிரெயப் போர்மரபுச் சொல்லாட்சியாகும்.
- source_word: כָּל אֵלֶּה שֹׁלְפֵי חָרֶב
  choice: இவர்கள் அனைவரும் வாள் உருவியவர்கள்
  rationale: ‘வாளை உருவுபவர்கள்’ என்ற பங்கேற்பு வடிவின் உயிரோட்டத்தைப் பாதுகாக்கிறது; இங்கு போருக்காக வாளை உறையிலிருந்து எடுத்த ஆயுதமுடைய ஆண்கள் குறிக்கப்படுகின்றனர்.
