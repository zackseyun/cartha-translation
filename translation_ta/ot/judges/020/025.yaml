translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான போர்வருணனைப் பாணி பயன்படுத்தப்பட்டுள்ளது. ‘பென்யமீன்’ என்ற கோத்திரப் பெயர் மக்களைக் கூட்டாகக் குறிப்பதால் ‘பென்யமீனியர்’ எனப் பன்மையில் தரப்பட்டுள்ளது. ‘வாள் உருவியவர்கள்’ என்பது மூலத்தின் உருவகமிக்க பங்கேற்புச் சொல்லாட்சியைப் பாதுகாக்கிறது.
