revisions:
- from: இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும் நூறு பேருக்கு பத்துப் பேரையும், ஆயிரம் பேருக்கு நூறு பேரையும், பத்தாயிரம் பேருக்கு ஆயிரம் பேரையும் மக்களுக்குத் தேவையான பொருள்களை எடுத்துவரும்படி தேர்ந்தெடுப்போம். மக்கள் பென்யமீனின் கிபியாவுக்கு வந்ததும்[a], அது இஸ்ரவேலில் செய்த கொடுஞ்செயல் அனைத்திற்கும்[b] தக்கபடி நடவடிக்கை எடுப்பார்கள்.
  to: இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும் நூறு பேருக்கு பத்துப் பேரையும், ஆயிரம் பேருக்கு நூறு பேரையும், பத்தாயிரம் பேருக்கு ஆயிரம் பேரையும், மக்களுக்கான பயணப் பொருள்களைத் திரட்டுவதற்காகத் தேர்ந்தெடுப்போம்; மக்கள் பென்யமீனின் கிபியாவுக்கு வந்தபோது[a], அது இஸ்ரவேலில் செய்த எல்லாக் கொடுஞ்செயலுக்கும் உரியபடி அதற்கு எதிராக நடவடிக்கை எடுப்பதற்காக.
  rationale: The revision preserves the numerical pattern and the deliberate future sense, improves צֵדָה to a natural broad expression for provisions, and restores the purposive link through which provisions are gathered for the people’s action at Gibeah. “அதற்கு எதிராக நடவடிக்கை எடுப்பதற்காக” safely makes explicit the hostile/judicial action implied by the context and by the compressed Hebrew construction, without specifying a mode of punishment. The lexical note for נְבָלָה is retained; its anchor should follow “கொடுஞ்செயலுக்கும்.”
  reviewer_model: gpt-5.6-terra
