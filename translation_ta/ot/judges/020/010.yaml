base_translation:
  language: en
  yaml_path: translation/ot/judges/020/010.yaml
  text: And we will take ten men out of a hundred from all the tribes of Israel[a], and a hundred out of a thousand, and a thousand out of ten thousand, to get provisions for the people, so that when they come to Gibeah of Benjamin[b], they may do according to all the outrage that it committed in Israel.
translation:
  language: ta
  text: இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும் நூறு பேருக்கு பத்துப் பேரையும், ஆயிரம் பேருக்கு நூறு பேரையும், பத்தாயிரம் பேருக்கு ஆயிரம் பேரையும், மக்களுக்கான பயணப் பொருள்களைத் திரட்டுவதற்காகத் தேர்ந்தெடுப்போம்; மக்கள் பென்யமீனின் கிபியாவுக்கு வந்தபோது[a], அது இஸ்ரவேலில் செய்த எல்லாக் கொடுஞ்செயலுக்கும் உரியபடி அதற்கு எதிராக நடவடிக்கை எடுப்பதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, ‘அவர்கள் பென்யமீனின் கிபியாவுக்கு வரும்போது செய்வதற்காக’ என்று உள்ளது. அவர்கள் அங்கு வந்தபின் நடவடிக்கை எடுப்பார்கள் என்ற பொருளில் இது சுருக்கமாக அமைந்துள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְנוּ
  choice: தேர்ந்தெடுப்போம்
  rationale: இணைப்புடன் வந்துள்ள Qal perfect முதல் நபர் பன்மை வடிவம், இச்சூழலில் கூட்டத்தாரின் அடுத்தகட்டத் திட்டத்தைச் சுட்டுகிறது. தமிழில் எதிர்காலத் திட்டமாக இயல்பாக வெளிப்படுத்தப்பட்டது.
- source_word: עֲשָׂרָה אֲנָשִׁים לַמֵּאָה ... וּמֵאָה לָאֶלֶף וְאֶלֶף לָרְבָבָה
  choice: நூறு பேருக்கு பத்துப் பேரையும், ஆயிரம் பேருக்கு நூறு பேரையும், பத்தாயிரம் பேருக்கு ஆயிரம் பேரையும்
  rationale: ஒவ்வொரு எண்ணிக்கையிலிருந்தும் பத்தில் ஒரு பங்கினரை ஆதரவுப் பணிக்குத் தேர்ந்தெடுக்கும் விகித அமைப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לְכֹל שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும்
  rationale: ஆட்கள் எல்லாக் கோத்திரங்களையும் உள்ளடக்கிய மொத்தக் கூட்டமைப்பிலிருந்து எடுக்கப்படுகிறார்கள் என்பதைக் காட்டுகிறது.
- source_word: לָקַחַת צֵדָה לָעָם
  choice: மக்களுக்குத் தேவையான பொருள்களை எடுத்துவரும்படி
  rationale: צֵדָה என்பது படையெடுப்பு அல்லது பயணத்துக்கான உணவு உள்ளிட்ட தேவையான பொருள்களைக் குறிக்கலாம். 'தேவையான பொருள்கள்' என்ற சொற்றொடர் பொருளை உணவுக்கு மட்டும் குறுக்கவில்லை.
- source_word: לַעֲשׂוֹת לְבוֹאָם
  choice: மக்கள் ... வந்ததும் ... நடவடிக்கை எடுப்பார்கள்
  rationale: எபிரெயத்தில் நெருக்கமாக அமைந்துள்ள infinitive தொடர், வருகைக்குப் பின் மேற்கொள்ளப்படும் செயலைக் குறிக்கிறது. குறிப்பிட்ட நடவடிக்கையை மூலவாக்கியம் வெளிப்படையாகச் சொல்லாததால் பொதுவான சொல்லாக்கம் பயன்படுத்தப்பட்டது.
- source_word: לְגֶבַע בִּנְיָמִן
  choice: பென்யமீனின் கிபியாவுக்கு
  rationale: திசையைக் குறிக்கும் முன்னிடைச்சொல்லை நேரடியாகப் பாதுகாக்கிறது; பகைமையான நடவடிக்கை தொடரும் வினையால் வெளிப்படுகிறது.
- source_word: כְּכָל הַנְּבָלָה
  choice: கொடுஞ்செயல் அனைத்திற்கும் தக்கபடி
  rationale: נְבָלָה என்பது அதிர்ச்சியூட்டும், வெட்கக்கேடான ஒழுக்கக்கேட்டை இங்கு குறிக்கிறது. 'கொடுஞ்செயல்' அதன் கடுமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר עָשָׂה בְּיִשְׂרָאֵל
  choice: அது இஸ்ரவேலில் செய்த
  rationale: மூலத்தில் வினை மூன்றாம் நபர் ஆண்பால் ஒருமையில் உள்ளது. 'அது' என்பது கிபியாவை சமூகக் குற்றவாளியாகக் குறிக்க அனுமதித்து, மூலத்தின் செயப்பாட்டு வடிவத்தையும் தெளிவின்மையையும் ஓரளவு காக்கிறது.
theological_decisions:
- issue: נְבָלָה என்ற ஒழுக்கரீதியாக வலுவான சொல்லின் மொழிபெயர்ப்பு
  choice: கொடுஞ்செயல்
  alternative: இழிவான செயல்; வெட்கக்கேடான செயல்; மதிகேடான செயல்
  rationale: இச்சொல் சாதாரண தவறையோ அறிவின்மையையோ அல்லாமல், சமூகத்தையே அதிர்ச்சியுறச் செய்யும் மிகக் கேவலமான செயலைக் குறிக்கிறது. பிற்கால இறையியல் தொழில்நுட்பச் சொல்லைச் சேர்க்காமல் அதன் ஒழுக்கக் கடுமையை 'கொடுஞ்செயல்' தக்கவைக்கிறது.
- issue: ஒருமை வினையான עָשָׂה-வின் செய்பவர்
  choice: கிபியா நகரத்தை ஒருங்கிணைந்த சமூகமாகக் குறிக்கும் 'அது'
  alternative: அவன் செய்தது; செய்யப்பட்ட செயல்
  rationale: எபிரெய வாக்கியம் இலக்கணத்தில் ஒருமையாக இருந்தாலும், செய்பவர் தனிநபரா, நகரமா, நகரவாசிகளா என்பது வெளிப்படையாகச் சொல்லப்படவில்லை. 'அது' கிபியாவின் கூட்டுப்பொறுப்பைச் சூழலுக்கு ஏற்ப காட்டினாலும் தனிநபர் பெயரைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்கு ஏற்ற கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. எண்ணியல் விகிதம் தெளிவாக வைக்கப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், காரண–நோக்கத் தொடர்பு காக்கப்பட்டுள்ளது.
