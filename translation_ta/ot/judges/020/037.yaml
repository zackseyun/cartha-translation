  to: அப்போது பதுங்கியிருந்தவர்கள் விரைந்து கிபியாவின்மேல் பாய்ந்தார்கள்; பதுங்கியிருந்த படை முன்னேறி[a], நகரம் முழுவதையும் வாளின் கூரிய விளிம்பால் தாக்கியது.
