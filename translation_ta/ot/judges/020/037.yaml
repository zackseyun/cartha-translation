base_translation:
  language: en
  yaml_path: translation/ot/judges/020/037.yaml
  text: Then the men in ambush quickly rushed against Gibeah[a], and the ambush advanced and struck the whole city with the edge of the sword.
translation:
  language: ta
  text: அப்போது பதுங்கியிருந்தவர்கள் விரைந்து கிபியாவின்மேல் பாய்ந்தார்கள்; பதுங்கியிருந்த படை முன்னேறி[a], நகரம் முழுவதையும் வாளின் கூரிய விளிம்பால் தாக்கியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘பதுங்கியிருந்த படை இழுத்தது.’ அந்தப் படை தன்னை முன்னோக்கி நீட்டிக்கொண்டு சென்றதை அல்லது நகருக்குள் தொடர்ந்து நுழைந்ததை இவ்வினை குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹרֵב
  choice: பதுங்கியிருந்தவர்கள் / பதுங்கியிருந்த படை
  rationale: இச்சொல் ஒருமை வடிவில் இருந்தாலும், சூழலில் பதுங்கித் தாக்கக் காத்திருந்த படையைத் தொகுப்பாகக் குறிக்கிறது. முதல் வினைச்சொல் பன்மையில் இருப்பதால் முதல் இடத்தில் மனிதர்களைக் குறிக்கும் பன்மையும், அடுத்த இடத்தில் இயல்பான தமிழுக்காகத் தொகுப்பொருள் தரும் ‘படை’ என்பதும் பயன்படுத்தப்பட்டன.
- source_word: הֵחִישׁוּ
  choice: விரைந்து
  rationale: செயலைத் தாமதமின்றி வேகமாகச் செய்தனர் என்ற எபிரெய வினையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: மேல் பாய்ந்தார்கள்
  rationale: பரவுதல் அல்லது படையெடுத்துச் செல்லுதல் என்ற சொற்பரப்பில், இப்போர்ச் சூழலில் கிபியாவை நோக்கிய திடீர் தாக்குதல் இயக்கத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַגִּבְעָה
  choice: கிபியா
  rationale: இடப்பெயர் நவீனத் தமிழ் வேதாகம நடைக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டது.
- source_word: וַיִּמְשֹׁךְ
  choice: முன்னேறி
  rationale: அடிப்படையில் ‘இழுத்தது/நீட்டியது’ என்று பொருள்படக்கூடிய இவ்வினை, இங்கு பதுங்கிய படை நகருக்குள் தொடர்ந்து முன்னேறியதைச் சுருக்கமாகக் குறிக்கலாம். மூலத்தின் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: וַיַּךְ
  choice: தாக்கியது
  rationale: ‘அடித்தது’ என்ற பரந்த பொருளைத் தக்கவைத்து, அடுத்து வரும் வாள் பற்றிய சொற்றொடருடன் இயல்பாக இணைகிறது.
- source_word: כָּל הָעִיר
  choice: நகரம் முழுவதையும்
  rationale: ‘நகர் அனைத்தையும்’ என்ற எபிரெயத் தொகைமொழியை, குடியிருப்போரை மட்டும் என்று வெளிப்படையாகக் குறுக்காமல் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: לְפִי חָרֶב
  choice: வாள்முனையால்
  rationale: சொல்லுக்கு சொல் ‘வாளின் வாயால்’ என்ற எபிரெய மரபுத்தொடர், வாளின் கூரிய பகுதியால் தாக்குதல் என்ற பொருளில் தமிழில் சுருக்கமாகவும் தெளிவாகவும் வழங்கப்பட்டது.
