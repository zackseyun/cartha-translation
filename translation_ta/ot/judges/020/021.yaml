base_translation:
  language: en
  yaml_path: translation/ot/judges/020/021.yaml
  text: Then the sons of Benjamin came out from Gibeah and struck down twenty-two thousand men of Israel that day[a].
translation:
  language: ta
  text: அப்போது பென்யமீன் மக்கள் கிபியாவிலிருந்து புறப்பட்டு, அன்று இஸ்ரவேல் மக்களில் இருபத்திரண்டாயிரம் பேரைத் தரையில் வீழ்த்தினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அன்று இஸ்ரவேல் மக்களில் இருபத்திரண்டாயிரம் பேரைக் கொன்றார்கள்.”
    reason: שׁחת என்பதன் போர்ச் சூழல் பொருளுக்கான நேரடியான மாற்று மொழிபெயர்ப்பு; ‘தரையில்’ என்பது אָרְצָה-வின் படிமமான கூறாக முதன்மை உரையில் காக்கப்பட்டுள்ளது.
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: புறப்பட்டு வந்து
  rationale: יצא என்பதன் தொடர்நிகழ்வு வடிவம் அடுத்த போர்ச் செயலைக் குறிக்கிறது. நகரத்திலிருந்து படையெடுத்து வெளியே வந்ததை இயல்பான தமிழில் தெரிவிக்கிறது; ‘வந்து/சென்று’ என்ற நோக்குநிலை வேறுபாட்டை அளவுக்கு மீறித் தீர்மானிக்கவில்லை.
- source_word: בְנֵי בִנְיָמִן
  choice: பென்யமீன் மக்கள்
  rationale: எபிரெயக் குலமரபுச் சொல்லின் பொருளை நவீன வாசகர்களுக்குத் தெளிவாகத் தருகிறது. ‘பென்யமீனின் மகன்கள்’ என்பது தமிழில் இங்கு தனிநபரின் நேரடி புதல்வர்களைக் குறிப்பதுபோல் தவறாகப் புரியக்கூடும்.
- source_word: מִן הַגִּבְעָה
  choice: கிபியாவிலிருந்து
  rationale: מן முன்னிடைச்சொல் தோற்ற இடத்தைக் குறிக்கிறது; கிபியா நகரத்தின் பெயரை ஒலிபெயர்த்து, ‘இலிருந்து’ எனத் துல்லியமாக வழங்குகிறது.
- source_word: וַיַּשְׁחִיתוּ
  choice: வீழ்த்தினார்கள்
  rationale: שׁחת என்பதன் Hiphil வடிவம் அழித்தல் அல்லது கொல்லுதலைக் குறிக்கலாம். போரில் உயிரிழந்தவர்களின் எண்ணிக்கை வரும் சூழலில் ‘வீழ்த்தினார்கள்’ என்பது உயிர்க்கொலையைத் தெளிவாக உணர்த்துவதோடு மூலத்தின் போர்க்களப் படிமத்தையும் காக்கிறது.
- source_word: בְיִשְׂרָאֵל
  choice: இஸ்ரவேலரில்
  rationale: இஸ்ரவேல் தரப்பினரில் ஏற்பட்ட உயிரிழப்புகளை இயல்பான தமிழில் குறிக்கிறது; தொடர்ந்து வரும் எண்ணப்பட்ட ஆட்களோடு நன்றாக இணைகிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்று
  rationale: ‘அந்த நாளில்’ என்பதன் இயல்பான, சுருக்கமான நவீனத் தமிழ் வடிவம்.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף
  choice: இருபத்திரண்டாயிரம்
  rationale: எபிரெய எண்ணின் வழக்கமான தமிழாக்கம்.
- source_word: אִישׁ
  choice: பேர்
  rationale: எண்ணிக்கைக்குப் பின் வரும் אִישׁ ஆண் போராளிகளைக் குறிக்கிறது. ‘பேர்’ தமிழ் எண்ணிக்கை இலக்கணத்தில் இயல்பாக இருந்து, சூழலால் ஆண்கள் என்பது தெளிவாகிறது.
- source_word: אָרְצָה
  choice: தரையில்
  rationale: திசைச்சுட்டு வடிவம் ‘தரையை நோக்கி/தரையில்’ என்ற போர்க்களப் படிமத்தைக் கொண்டது. ‘தரையில் வீழ்த்தினார்கள்’ அந்தப் படிமத்தை இயல்பான தமிழில் வெளிப்படையாகக் காக்கிறது.
