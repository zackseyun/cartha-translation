  text: וַ/יֵּצֵא֙ אִ֣ישׁ יִשְׂרָאֵ֔ל לַ/מִּלְחָמָ֖ה עִם בִּנְיָמִ֑ן וַ/יַּעַרְכ֨וּ אִתָּ֧/ם אִֽישׁ יִשְׂרָאֵ֛ל מִלְחָמָ֖ה אֶל הַ/גִּבְעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/020.yaml
  text: The men of Israel went out to battle against Benjamin[a], and the men of Israel drew up for battle against them at Gibeah.
translation:
  language: ta
  text: இஸ்ரவேலின் ஆண்கள் பென்யமீனுக்கு எதிராகப் போரிடப் புறப்பட்டார்கள்; இஸ்ரவேலின் ஆண்கள் கிபியாவில் அவர்களுக்கு எதிராகப் போரிட அணிவகுத்து நின்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரண்டாம் வாக்கியத்தை, “இஸ்ரவேலின் ஆண்கள் கிபியாவில் அவர்களுடன் போரிட அணிவகுத்து நின்றார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல்லமைப்பில் “அவர்களுடன்” என்று இருந்தாலும், இங்கு அது எதிர்த்துப் போரிடுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: புறப்பட்டார்கள்
  rationale: יצא என்ற வினை போர்ச் சூழலில் நடவடிக்கைக்காக வெளியே செல்வதைக் குறிக்கிறது; ‘புறப்பட்டார்கள்’ இயல்பான தமிழில் அந்த இயக்கத்தைத் தெளிவாகத் தருகிறது.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேல் ஆண்கள்
  rationale: אִישׁ இலக்கண வடிவில் ஒருமையாக இருந்தாலும், இங்கு இஸ்ரவேலின் போர்வீரர்களைக் குறிக்கும் கூட்டுப்பெயராக உள்ளது. ஆண்பால் குறிப்பையும் கூட்டுப் பொருளையும் தமிழ் மொழிபெயர்ப்பு காக்கிறது.
- source_word: לַמִּלְחָמָה
  choice: போருக்கு
  rationale: முன்னொட்டுடன் உள்ள இந்தச் சொல் போருக்குச் செல்லும் நோக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: עִם בִּנְיָמִן
  choice: பென்யமீனுக்கு எதிராக
  rationale: עִם பொதுவாக ‘உடன்’ எனப் பொருள்பட்டாலும், இங்குள்ள போர்ச் சூழலில் எதிர்தரப்பைச் சுட்டுகிறது; ‘எதிராக’ என்பது தவறான கூட்டணி உணர்வைத் தவிர்க்கிறது.
- source_word: וַיַּעַרְכוּ
  choice: அணிவகுத்து நின்றார்கள்
  rationale: ערך என்பதன் இராணுவப் பயன்பாடு படைகளைப் போர் ஒழுங்கில் நிறுத்துவதைக் குறிக்கிறது; இந்தத் தமிழ்ச் சொற்றொடர் ஆயத்த நிலையையும் ஒழுங்கமைப்பையும் தெரிவிக்கிறது.
- source_word: אִתָּם
  choice: அவர்களுக்கு எதிராக
  rationale: வடிவம் ‘அவர்களுடன்’ என்ற அடிப்படைப் பொருளை அனுமதித்தாலும், இங்கு பென்யமீனியர் எதிர்தரப்பினர் என்பதால் சூழலுக்கேற்ற எதிர்நிலை வெளிப்படையாகக் கூறப்படுகிறது; அடிப்படைச் சொல் அமைப்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: מִלְחָמָה
  choice: போரிட
  rationale: இங்கு பெயர்ச்சொல் அணிவகுப்பின் நோக்கம் அல்லது வகையைச் சுட்டுகிறது; தமிழில் வினையெச்ச நோக்கத் தொடரான ‘போரிட’ இயல்பாக உள்ளது.
- source_word: אֶל הַגִּבְעָה
  choice: கிபியாவில்
  rationale: אֶל வழக்கமாக ‘நோக்கி’ எனப் பொருள்படலாம்; ஆனால் இச்சூழலில் படைகள் கிபியாவுடன் தொடர்புடைய இடத்தில் அணிவகுத்ததைச் சுட்டுவதால் ‘கிபியாவில்’ என வழங்குவது இயல்பானது.
theological_decisions:
- issue: אִישׁ יִשְׂרָאֵל என்பதில் உள்ள ஆண்பால் கூட்டுப்பெயர்
  choice: இஸ்ரவேல் ஆண்கள்
  alternative: இஸ்ரவேலர் / இஸ்ரவேல் படைகள்
  rationale: எபிரெயச் சொல் இங்கு போரில் ஈடுபடும் ஆண்களை கூட்டாகக் குறிக்கிறது. பாலினக் குறிப்பை நீக்காமல், எந்தத் தனிப்பட்ட இறையியல் கருத்தையும் சேர்க்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- issue: עִם மற்றும் אִתָּם என்பவற்றின் போர்ச் சூழலிலான உறவு
  choice: எதிராக
  alternative: உடன் / அவர்களுடன்
  rationale: முன்னிடைச்சொற்களின் அடிப்படைப் பொருள் ‘உடன்’ என்றாலும், இரு தரப்பினருக்கிடையேயான போரே சூழல். எதிர்நிலையை முதன்மை உரையில் தெளிவாக்கி, சொல்லமைப்பின் மாற்றுப் பிரதிபலிப்பை அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தில் இருமுறை வரும் ‘இஸ்ரவேல் ஆண்கள்’ என்ற கூட்டுக் குறிப்பு வலியுறுத்தலுக்காகத் தக்கவைக்கப்பட்டுள்ளது; இராணுவச் செயலை இயல்பாகச் சொல்ல ‘அணிவகுத்து நின்றார்கள்’ பயன்படுத்தப்பட்டுள்ளது.
