source:
  edition: WLC
  text: וְ/עַתָּ֕ה זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁ֥ר נַעֲשֶׂ֖ה לַ/גִּבְעָ֑ה עָלֶ֖י/הָ בְּ/גוֹרָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/009.yaml
  text: 'But now this is what we will do to Gibeah: against it by lot[a].'
translation:
  language: ta
  text: 'ஆனால் இப்போது கிபியாவுக்கு நாம் செய்யப்போவது இதுதான்: அதற்கு எதிராகச் சீட்டின்படி செயல்படுவோம்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதற்கு எதிராகச் சீட்டுப் போட்டுச் செயல்படுவோம்.” எபிரெய வாசகம் சுருக்கமானது; கிபியாவுக்கு எதிரான படை நடவடிக்கை சீட்டினால் ஒழுங்குபடுத்தப்படும் அல்லது ஒதுக்கப்படும் என்பதை இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆனால் இப்போது
  rationale: அடுத்த நடவடிக்கையை அறிமுகப்படுத்தும் கால மற்றும் உரைமாற்றச் சுட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: זֶה הַדָּבָר אֲשֶׁר
  choice: நாம் செய்யப்போவது இதுதான்
  rationale: குறிப்பிட்ட திட்டத்தை அறிமுகப்படுத்தும் எபிரெயக் கட்டமைப்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: נַעֲשֶׂה
  choice: நாம் செய்யப்போவது
  rationale: முதல் நபர் பன்மை நிறைவேறா வினையின் திட்டமிட்ட எதிர்காலச் செயலைக் காட்டுகிறது; கட்டளையாக மாற்றவில்லை.
- source_word: לַגִּבְעָה
  choice: கிபியாவுக்கு
  rationale: ל முன்னிடைச்சொல் கிபியாவை முன்மொழியப்பட்ட செயலின் இலக்காகக் குறிக்கிறது.
- source_word: עָלֶיהָ
  choice: அதற்கு எதிராக
  rationale: நகருக்கு எதிரான பகைமைச் செயலைக் குறிக்கும் על என்பதன் படைச் சூழல் பொருளை வெளிப்படுத்துகிறது.
- source_word: בְּגוֹרָל
  choice: சீட்டின்படி
  rationale: சீட்டுப் போட்டு நடவடிக்கையைத் தீர்மானித்தல் அல்லது ஒதுக்குதல் என்ற பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் சுருக்கமான, ஓரளவு நீக்கவாக்கியமான அமைப்பைப் பாதுகாத்தபடியே தமிழில் வாக்கியத்தை நிறைவு செய்ய “செயல்படுவோம்” சேர்க்கப்பட்டுள்ளது; அதன் விளக்கத் தன்மை அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
