  language: en
  yaml_path: translation/ot/judges/020/048.yaml
  text: And the men of Israel turned back against the sons of Benjamin and struck them with the edge of the sword[a], from each city, men to livestock, even all that was found[c][b]. Also all the cities that were found they set on fire.
translation:
  language: ta
  text: இஸ்ரவேல் ஆண்கள் திரும்பி பென்யமீனியருக்கு எதிராகச் சென்று, நகரங்களில் இருந்த மனிதர்முதல் கால்நடைகள்வரை, காணப்பட்ட அனைத்தையும் வாளின் முனையால் அழித்தார்கள்.[a] மேலும், அவர்கள் கண்ட எல்லா நகரங்களையும் தீக்கிரையாக்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நகரங்களில் இருந்த மனிதர்முதல்” என்று மொழிபெயர்க்கப்பட்ட எபிரெயத் தொடர் பொருள் தெளிவில்லாதது. நகரங்களில் இருந்தவர்களை முற்றிலும் அழித்து, கால்நடைகளையும் அங்கே காணப்பட்ட மற்ற அனைத்தையும் அழித்தார்கள் என்பதே இதன் சாத்தியமான பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேல் ஆண்கள்
  rationale: אִישׁ ஒருமை வடிவில் இருந்தாலும், பன்மை வினையுடன் இங்கு கூட்டுப்பொருளில் போரில் ஈடுபட்ட இஸ்ரவேல் ஆண்களைக் குறிக்கிறது.
- source_word: שָׁבוּ אֶל
  choice: திரும்பி ... தாக்கி
  rationale: שׁוב இயக்கத்தின் திருப்பத்தைக் குறிக்கிறது; அடுத்துவரும் பகைமைச் செயலைத் தமிழில் இயல்பாக இணைக்க ‘திரும்பி ... தாக்கி’ என வழங்கப்பட்டுள்ளது.
- source_word: בְּנֵי בִנְיָמִן
  choice: பென்யமீனியர்
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘பென்யமீனின் மகன்கள்’ என்றாலும், இங்கு பென்யமீன் கோத்திரத்தாரைக் குறிக்கும் இயல்பான தமிழ்ச் சொல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: வாளால் வெட்டிக் கொன்றார்கள்
  rationale: נכה என்பதன் பரந்த ‘அடித்தல்/வீழ்த்துதல்’ பொருளை, வாளின் ‘வாய்/முனை’ என்ற தொடரும் முழு அழிவைக் கூறும் சூழலும் உயிர்க்கொலை எனத் தெளிவுபடுத்துகின்றன. தமிழில் ‘வாளால் வெட்டிக் கொன்றார்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מֵעִיר מְתֹם עַד בְּהֵמָה עַד כָּל הַנִּמְצָא
  choice: நகரங்களில் இருந்த மனிதர்கள்முதல் கால்நடைகள்வரை, அங்கே காணப்பட்ட அனைத்தையும்
  rationale: சிதைந்தோ கடினமோ ஆன எபிரெயத் தொடரின் சூழல்சார்ந்த மையப்பொருள், நகரங்களின் மனிதர்கள், கால்நடைகள் மற்றும் காணப்பட்ட அனைத்தும் முழுமையாக அழிக்கப்பட்டன என்பதாகும். ‘அங்கே’ என்பது நகரங்களோடு தொடர்பைத் தமிழில் தெளிவாக்குகிறது; மொழியியல் ஐயம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: כָּל הֶעָרִים הַנִּמְצָאוֹת
  choice: அவர்கள் எதிர்ப்பட்ட எல்லா நகரங்களையும்
  rationale: מצא வினையின் பங்கெச்சம் இங்கு இஸ்ரவேலர் கண்டடைந்த அல்லது எதிர்ப்பட்ட நகரங்களைக் குறிக்கிறது; சொற்சொல் மொழிபெயர்ப்பான ‘காணப்பட்ட நகரங்கள்’ என்பதைவிட இது இயல்பான தமிழ்.
- source_word: שִׁלְּחוּ בָאֵשׁ
  choice: தீக்கிரையாக்கினார்கள்
  rationale: ‘நெருப்பில் அனுப்புதல்’ என்ற எபிரெய மரபுத்தொடர் நகரங்களை எரித்ததைக் குறிக்கிறது; ‘தீக்கிரையாக்கினார்கள்’ dignified modern Tamil.
