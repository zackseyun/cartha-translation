base_translation:
  language: en
  yaml_path: translation/ot/judges/020/016.yaml
  text: From all this people[a], seven hundred chosen men were left-handed; every one of these could sling a stone at a hair and not miss.
translation:
  language: ta
  text: இந்த மக்கள் அனைவரிலிருந்தும் தேர்ந்தெடுக்கப்பட்ட எழுநூறு ஆண்கள் இடக்கைப் பயன்படுத்துபவர்களாக இருந்தார்கள்[a]. அவர்களில் ஒவ்வொருவரும் ஒரு முடியை நோக்கிக் கவணால் கல்லெறிந்தும் குறி தவறாதவர்களாக இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “வலது கையில் தடை இருந்தவர்கள்” என்று நேரடியாக உள்ளது; போர்ச் சூழலில் இது இடக்கையால் போரிடுவதைக் குறிக்கலாம்.
    reason: எபிரெய மரபுத்தொடரின் நேரடிப் பொருளையும், இடக்கைப் பயன்பாடு என்பது சூழல் சார்ந்த சாத்தியமான விளக்கமென்பதையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: מִכֹּל הָעָם הַזֶּה
  choice: இந்த மக்கள் அனைவரிலிருந்தும்
  rationale: பகுதிப்பொருளைக் காட்டும் מִן முன்னொட்டையும், עָם என்பதன் பொதுவான ‘மக்கள்’ என்ற பொருளையும் காக்கிறது; சூழல் போர்வீரர்களைக் குறித்தாலும் ‘படையினர்’ என்று மிகையாக விளக்கவில்லை.
- source_word: שְׁבַע מֵאוֹת אִישׁ בָּחוּר
  choice: தேர்ந்தெடுக்கப்பட்ட எழுநூறு ஆண்கள்
  rationale: אִישׁ என்பதைக் கணக்கிடப்படும் வயதுவந்த ஆண்கள் எனவும், בָּחוּר என்பதைக் தேர்ந்தெடுக்கப்பட்ட அல்லது சிறப்பாகத் தெரிந்தெடுக்கப்பட்டவர்கள் எனவும் இயல்பான தமிழில் அளிக்கிறது.
- source_word: אִטֵּר יַד יְמִינוֹ
  choice: இடக்கைப் பழக்கமுள்ளவர்களாக இருந்தார்கள்[a]
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக வலது கை தடைப்பட்டிருப்பதைச் சொன்னாலும், போர்ச் சூழலில் இடக்கையால் ஆயுதம் பயன்படுத்துவதை இயல்பாகக் குறிக்கிறது. நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כָּל זֶה
  choice: அவர்களில் ஒவ்வொருவரும்
  rationale: ஒவ்வொரு வீரரின் தனிப்பட்ட திறமையையும் வலியுறுத்தும் பகிர்வுப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: קֹלֵעַ בָּאֶבֶן
  choice: கவணால் கல்லெறிந்தாலும்
  rationale: קלע என்பதன் கவண் பயன்படுத்திக் கல்லெறியும் போர்த் திறனை இயல்பான தமிழில் தெரிவிக்கிறது; எபிரெயப் பங்கேற்புப் பெயரெச்சத்தின் வழக்கமான திறன் என்ற பொருள் முழு வாக்கியத்தில் வெளிப்படுகிறது.
- source_word: אֶל הַשַּׂעֲרָה
  choice: ஒரு முடியை நோக்கி
  rationale: மிகச் சிறிய இலக்கைக் குறிக்கும் மூலப்படிமத்தை ‘முடி’ என்று நேரடியாகக் காக்கிறது; ‘முடியளவு’ என்று விரித்துரைக்கவில்லை.
- source_word: וְלֹא יַחֲטִא
  choice: குறி தவறமாட்டார்கள்
  rationale: חטא இங்கு ஒழுக்கப் பொருளான ‘பாவம் செய்’ என்பதல்ல; இலக்கைத் தவறவிடுதல் என்பதே சூழலுக்குரிய பொருள்.
