translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இடக்கைப் பழக்கம்’ என்ற வழக்கமான தமிழ் வடிவம் முதன்மை உரையில் கொள்ளப்பட்டு, மூலத்தின் உடல்சார் சொற்றொடர் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
