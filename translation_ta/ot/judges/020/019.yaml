base_translation:
  language: en
  yaml_path: translation/ot/judges/020/019.yaml
  text: Then the sons of Israel rose in the morning and camped against Gibeah[a].
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் காலையில் எழுந்து, கிபியாவுக்கு எதிராக முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: எழுந்து
  rationale: קום என்பதன் தொடர்கதை வடிவம் அடுத்த செயலைக் குறிக்கிறது. “எழுந்து” என்பது புறப்பட்டார்கள் என்று தேவையின்றி விரித்துரைக்காமல் எளிய கதைநடையைப் பாதுகாக்கிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் வடிவம் “இஸ்ரவேலின் மகன்கள்” என்றாலும், இங்கு இந்த எபிரெய மரபுத்தொடர் இஸ்ரவேல் சமூகத்தாரைக் குறிக்கிறது. “இஸ்ரவேல் மக்கள்” என்பது நவீன தமிழில் இயல்பாகவும் பொருளுக்கு உண்மையாகவும் உள்ளது.
- source_word: בַּבֹּקֶר
  choice: காலையில்
  rationale: குறிப்பிட்ட காலை நேரத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் காலவினையடை.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பது முகாம் அமைத்துத் தங்குவதைக் குறிக்கிறது; “முகாமிட்டார்கள்” இராணுவச் சூழலிலும் இயல்பாக உள்ளது.
- source_word: עַל
  choice: எதிராக
  rationale: உடனடிப் போர்ச் சூழலில் עַל வெறும் அருகாமையை அல்ல, நகரை எதிர்த்த பகைமை நிலைப்பாட்டைக் குறிக்கிறது.
- source_word: הַגִּבְעָה
  choice: கிபியா
  rationale: இது கிபியா என்ற இடப்பெயர்; எபிரெய மொழியின் உருபைத் தமிழில் தனியாக மொழிபெயர்க்க வேண்டியதில்லை.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதும் இயல்பானதுமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மரபுத்தொடரான “இஸ்ரவேலின் மகன்கள்” இலக்கு மொழியில் இயல்பாக “இஸ்ரவேல் மக்கள்” என வழங்கப்பட்டுள்ளது; பொருள் சார்ந்த தெளிவு காக்கப்பட்டுள்ளது.
