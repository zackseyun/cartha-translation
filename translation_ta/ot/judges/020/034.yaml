base_translation:
  language: en
  yaml_path: translation/ot/judges/020/034.yaml
  text: Then ten thousand chosen men from all Israel came against Gibeah[a], and the battle was fierce; but they did not know that disaster was closing in on them.
translation:
  language: ta
  text: அப்போது இஸ்ரவேல் முழுவதிலுமிருந்து தேர்ந்தெடுக்கப்பட்ட பத்தாயிரம் பேர் கிபியாவுக்கு எதிராக வந்தார்கள். போர் கடுமையாக இருந்தது; ஆனால் பேரழிவு தங்களை நெருங்கிக்கொண்டிருந்ததைப் பென்யமீனியர் அறியவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “பேரழிவு தங்களை வந்தடைந்துகொண்டிருந்ததை.” எபிரெயத்தில் நேரடியாக, “அழிவு அவர்களைத் தொட்டுக்கொண்டிருந்தது/வந்தடைந்துகொண்டிருந்தது” என்று உள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֶּגֶד לַגִּבְעָה
  choice: கிபியாவுக்கு எதிராக
  rationale: מִנֶּגֶד என்பது நேரடியாக ‘எதிரே’ அல்லது ‘முன்பாக’ என்பதைக் குறிக்கலாம்; போர்ச் சூழலில் படைகள் கிபியாவைத் தாக்குவதற்காக எதிராக வந்ததை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ בָּחוּר
  choice: தேர்ந்தெடுக்கப்பட்ட பத்தாயிரம் வீரர்கள்
  rationale: בָּחוּר இங்கு வயதை மட்டும் குறிக்காமல், போருக்காகத் தேர்ந்தெடுக்கப்பட்ட சிறந்த ஆட்களைக் குறிக்கிறது; ‘வீரர்கள்’ என்பது இராணுவச் சூழலைத் தெளிவாக்குகிறது.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதிலுமிருந்து
  rationale: வீரர்கள் இஸ்ரவேலின் எல்லாப் பகுதிகளிலிருந்தும் திரட்டப்பட்டனர் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וְהַמִּלְחָמָה כָּבֵדָה
  choice: போர் கடுமையாக இருந்தது
  rationale: כָּבֵדָה என்பதன் நேரடிப் பொருள் ‘கனமானது’ என்றாலும், இங்கு போரின் தீவிரத்தையும் கடுமையையும் குறிக்கிறது.
- source_word: וְהֵם לֹא יָדְעוּ
  choice: ஆனால் ... அவர்கள் அறியவில்லை
  rationale: וְ என்பது ‘மேலும்’ எனவும் வரலாம்; இங்கு கடுமையான போருக்கும் பென்யமீனரின் அறியாமைக்கும் இடையிலான முரண்பாட்டை ‘ஆனால்’ இயல்பாகக் காட்டுகிறது.
- source_word: כִּי נֹגַעַת עֲלֵיהֶם הָרָעָה
  choice: அழிவு தங்களை நெருங்கிக்கொண்டிருந்ததை
  rationale: נֹגַעַת என்பது ‘தொடுதல்/சென்றடைதல்’ என்ற உருவகத்தையும் நிகழ்ந்துகொண்டிருக்கும் நெருக்கத்தையும் கொண்டுள்ளது; הָרָעָה இங்கு ஒழுக்கத் தீமையைக் காட்டாமல் பேரழிவைக் குறிக்கிறது.
