  yaml_path: translation/ot/judges/020/007.yaml
  text: Look, all of you sons of Israel, give your word and counsel here.
translation:
  language: ta
  text: இதோ, இஸ்ரவேல் மக்களே, நீங்கள் அனைவரும் இங்கே உங்கள் கருத்தையும் ஆலோசனையையும் தெரிவியுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லை இயல்பாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் 'இஸ்ரவேலின் மகன்கள்' என்றாலும், இங்கு கூடியிருந்த இஸ்ரவேலரை மொத்தமாகக் குறிக்கும் இயல்பான நவீன தமிழ் வடிவம்.
- source_word: הָבוּ לָכֶם דָּבָר וְעֵצָה
  choice: உங்கள் கருத்தையும் ஆலோசனையையும் கூறுங்கள்
  rationale: דָּבָר என்பதன் பரந்த பொருளில் இச்சூழலில் முன்வைக்கப்படும் கருத்து அல்லது தீர்மானத்தைக் குறிக்கிறது; עֵצָה என்பது ஆலோசனை. הָבוּ לָכֶם என்ற சொல்லாட்சியின் செயற்பொருளை இயல்பான தமிழில் 'கூறுங்கள்' எனத் தருகிறது.
- source_word: הֲלֹם
  choice: இங்கே
  rationale: பேச்சாளர் இருக்கும் கூட்டத்தின் இடத்திலேயே கருத்து தெரிவிக்குமாறு அழைப்பதை நேரடியாகக் காட்டுகிறது.
