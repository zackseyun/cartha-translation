translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்களுக்கு எளிதில் புரியும் அதே நேரத்தில் கண்ணியமான பொதுக்கூட்ட அழைப்பு நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய உரையின் இரு இணைச்சொற்களான דָּבָר மற்றும் עֵצָה முறையே 'கருத்து' மற்றும் 'ஆலோசனை' என்று வேறுபடுத்தப்பட்டுள்ளன.
