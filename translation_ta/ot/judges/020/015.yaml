base_translation:
  language: en
  yaml_path: translation/ot/judges/020/015.yaml
  text: 'And on that day the sons of Benjamin were mustered from the cities: twenty-six thousand men drawing the sword[a], besides the inhabitants of Gibeah[b], who were mustered as seven hundred chosen men.'
translation:
  language: ta
  text: அந்த நாளில் பென்யமீனின் மக்கள் பட்டணங்களிலிருந்து வந்த வாளேந்தும் ஆண்கள் இருபத்தாறாயிரம் பேர் கணக்கெடுக்கப்பட்டனர்[a]. இவர்களைத் தவிர, கிபியாவில் குடியிருந்தவர்களாகிய தேர்ந்தெடுக்கப்பட்ட ஆண்கள்[b] எழுநூறு பேர் கணக்கெடுக்கப்பட்டனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எண்ணப்பட்டனர்” அல்லது “போர்ப்பணிக்காகப் பதிவு செய்யப்பட்டனர்.” எபிரெய வினைச்சொல் இங்கு இராணுவப் பணிக்காக ஆட்கள் கணக்கிடப்பட்டதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சிறந்த ஆண்கள்” அல்லது “இளைஞர்கள்.” எபிரெயச் சொல் இளைஞர்களையும் குறிக்கலாம்; இங்கு தேர்ந்தெடுக்கப்பட்ட போர்வீரர்கள் என்பதே சூழலுக்குப் பொருத்தமாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּקְדוּ / הִתְפָּקְדוּ
  choice: கணக்கெடுக்கப்பட்டனர்
  rationale: இங்கு פקד என்பதன் hitpael வடிவம் போர்ப்பணிக்காக ஆட்கள் எண்ணப்பட்டு பதிவுசெய்யப்பட்டதைக் குறிக்கிறது. இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்துவது எபிரெய மூலத்தின் மறுபயன்பாட்டைப் பாதுகாக்கிறது.
- source_word: בְנֵי בִנְיָמִן
  choice: பென்யமீனின் மக்கள்
  rationale: கோத்திர வழிவந்தவர்களைக் குறிக்கும் குடும்பமுறைச் சொல்லாட்சியை இயல்பான நவீன தமிழில் தருகிறது; ‘கோத்திரத்தார்’ என்று மூலத்தில் வெளிப்படையாக இல்லாத சொல்லைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்த நாளில்
  rationale: காலத்தையும் சுட்டு வலியுறுத்தலையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: מֵהֶעָרִים
  choice: பட்டணங்களிலிருந்து வந்த
  rationale: வீரர்கள் எந்த இடங்களிலிருந்து கணக்கில் சேர்க்கப்பட்டனர் என்பதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: עֶשְׂרִים וְשִׁשָּׁה אֶלֶף אִישׁ
  choice: ஆண்கள் இருபத்தாறாயிரம் பேர்
  rationale: எண்ணிக்கையையும் אִישׁ என்பதையும் நேரடியாகத் தருகிறது; அடுத்துள்ள வாளேந்தும் என்ற சொற்றொடரே இராணுவச் சூழலைத் தெளிவாக்குவதால் ‘வீரர்கள்’ என விரித்துரைக்கவில்லை.
- source_word: שֹׁלֵף חָרֶב
  choice: வாளேந்தும்
  rationale: ஆயுதமேந்திப் போரிடத் தகுதியான ஆண்களைக் குறிக்கும் எபிரெய மரபுத்தொடரின் தெளிவான காட்சியையும் இராணுவப் பொருளையும் தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: לְבַד
  choice: இவர்களைத் தவிர
  rationale: கிபியாவின் எழுநூறு பேர் முந்தைய இருபத்தாறாயிரத்துக்கு மேலாகத் தனியே கணக்கிடப்பட்டனர் என்பதைத் தெளிவாக்குகிறது.
- source_word: מִיֹּשְׁבֵי הַגִּבְעָה
  choice: கிபியாவில் குடியிருந்தவர்களில்
  rationale: கிபியாவில் வசித்த மக்களிலிருந்து இந்தப் படைப்பிரிவு வந்தது என்ற பங்கேற்பு வடிவத்தின் பொருளை இயல்பாகத் தருகிறது.
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: ஆண்கள் எழுநூறு பேர்
  rationale: எண்ணிக்கையையும் ‘ஆண்கள்’ என்ற பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: בָּחוּר
  choice: தேர்ந்தெடுக்கப்பட்ட
  rationale: இராணுவச் சூழலில் இச்சொல் தேர்ந்தெடுக்கப்பட்ட அல்லது சிறப்பான போர்வீரர்களைக் குறிக்கலாம்; அடுத்த வசனத்தின் திறமையான வீரர் விளக்கத்துக்கும் இது பொருந்துகிறது. ‘இளைஞர்கள்’ என்பதும் சொல்லியல் வாய்ப்பாக இருப்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
