  text: And the sons of Israel came near to the sons of Benjamin on the second day[a][b].
translation:
  language: ta
  text: இரண்டாம் நாளில் இஸ்ரவேலின் மகன்கள் பென்யமீனின் மகன்களை நெருங்கினார்கள்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அணுகினார்கள்’; போர்ச் சூழலில், ‘எதிராக முன்னேறினார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் ‘இஸ்ரவேலின் மகன்கள்’ என்றும் ‘பென்யமீனின் மகன்கள்’ என்றும் உள்ளது; ‘இஸ்ரவேலர்’ என்றும் ‘பென்யமீனியர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: நெருங்கினார்கள்
  rationale: קرب என்ற வினையின் கால் வடிவம் ‘நெருங்குதல்/அணுகுதல்’ என்று பொருள்படும். போர்ச் சூழலில் ‘எதிராக முன்னேறினார்கள்’ என்றும் கொள்ளலாம்; ஆனால் எபிரெயச் சொல் தாக்குதலை வெளிப்படையாகக் கூறாமல் அருகே செல்லுதலையே கூறுவதால், ‘நெருங்கினார்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயில் நேரடியாக ‘இஸ்ரவேலின் மகன்கள்’ என்று உள்ளது. இது இங்கு இஸ்ரவேல் கோத்திரப் படையினரை ஒட்டுமொத்தமாகக் குறிக்கிறது; மூலத்தின் குடும்பவழி அடையாளத்தையும் இணை அமைப்பையும் காக்க நேரடி வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אֶל
  choice: பென்யமீனின் மகன்களை நெருங்கினார்கள்
  rationale: אֶל பொதுவாக ‘நோக்கி/இடம்’ என்பதைக் குறிக்கிறது. தமிழில் ‘ஒருவரை நெருங்குதல்’ இயல்பாக இருப்பதால் அது வினையுடன் இணைக்கப்பட்டுள்ளது; போர்ச் சூழல் இருந்தாலும் ‘எதிராக’ என்ற பகைமைப் பொருள் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
- source_word: בְנֵי בִנְיָמִן
  choice: பென்யமீனின் மகன்கள்
  rationale: எபிரெயின் நேரடிப் பொருளான ‘பென்யமீனின் மகன்கள்’ தக்கவைக்கப்பட்டது. இது ‘இஸ்ரவேலின் மகன்கள்’ என்பதுடன் உள்ள இணை அமைப்பையும் கோத்திரத்தின் குடும்பவழிப் பெயரிடலையும் பாதுகாக்கிறது.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: இரண்டாம் நாளில்
  rationale: மூலம் வரிசை எண்ணுடன் ‘இரண்டாம் நாளில்’ என்று குறிப்பாகக் கூறுகிறது. ‘மறுநாளில்’ என்பது இயல்பான மாற்றாக இருந்தாலும், மூலத்தின் எண்ணிடப்பட்ட காலக் குறிப்பை நேரடியாகப் பாதுகாக்கப்பட்டது.
