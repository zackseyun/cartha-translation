source:
  edition: WLC
  text: וְ/עַתָּ֡ה תְּנוּ֩ אֶת הָ/אֲנָשִׁ֨ים בְּנֵֽי בְלִיַּ֜עַל אֲשֶׁ֤ר בַּ/גִּבְעָה֙ וּ/נְמִיתֵ֔/ם וּ/נְבַעֲרָ֥ה רָעָ֖ה מִ/יִּשְׂרָאֵ֑ל וְ/לֹ֤א אָבוּ֙ בִּנְיָמִ֔ן לִ/שְׁמֹ֕עַ בְּ/ק֖וֹל אֲחֵי/הֶ֥ם בְּנֵֽי יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/013.yaml
  text: Hand over the men[a], the sons of worthlessness, who are in Gibeah, so that we may put them to death and purge evil from Israel. But Benjamin was not willing to listen to the voice of their brothers[c][b], the sons of Israel.
translation:
  language: ta
  text: கிபியாவில் இருக்கும் அந்தத் தீய மனிதர்களை[a] ஒப்படையுங்கள். நாங்கள் அவர்களைக் கொன்று, இஸ்ரவேலிலிருந்து தீமையை அகற்றுவோம். ஆனால் பென்யமீன் மக்கள், இஸ்ரவேல் மக்களாகிய தங்கள் சகோதரர்களின் சொல்லுக்குச் செவிசாய்க்க விரும்பவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “தகுதியின்மையின் மகன்கள்”; அல்லது, “தீய மனிதர்கள்.” பாரம்பரியமாக, “பெலியாலின் மகன்கள்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “குரலுக்குச் செவிகொடுக்க”; இது “இணங்க” அல்லது “கீழ்ப்படிய” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ
  choice: ஒப்படையுங்கள்
  rationale: நீதித் தீர்ப்புக்காகக் குற்றவாளிகளைச் சபையிடம் ஒப்படைக்க வேண்டும் என்ற கட்டளையின் சட்டப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הָאֲנָשִׁים
  choice: அந்த ஆண்களை
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையாக இருந்து, ஆண் குற்றவாளிகளையே சுட்டுகிறது.
- source_word: בְּנֵי בְלִיַּעַל
  choice: தகுதியற்றவர்களின் மகன்கள்
  rationale: ‘தகுதியின்மையின் மகன்கள்’ என்ற எபிரெய மரபுத்தொடரின் உருவகத்தை ஓரளவு காத்து, ‘பெலியால்’ என்ற தனிப்பெயர் சார்ந்த பிற்கால இறையியல் பொருளைத் தவிர்க்கிறது.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: கிபியாவில் இருக்கிற
  rationale: குற்றவாளிகளை அவர்கள் இருக்கும் நகரத்தால் அடையாளப்படுத்துகிறது.
- source_word: וּנְמִיתֵם
  choice: நாங்கள் அவர்களைக் கொன்று
  rationale: ஒப்படைப்புக்குப் பின் செய்யவிருக்கும் மரணத் தண்டனையை நேரடியாகக் கூறுகிறது; சூழல் அதன் நீதித் தீர்ப்பு சார்ந்த தன்மையை வெளிப்படுத்துகிறது.
- source_word: וּנְבַעֲרָה רָעָה מִיִּשְׂרָאֵל
  choice: இஸ்ரவேலிலிருந்து தீமையை அகற்றுவோம்
  rationale: உடன்படிக்கைச் சட்டத்தில் காணப்படும் சமூகத்திலிருந்து தீமையை முற்றாக நீக்கும் நிலையான கருத்தைத் தெளிவாக வழங்குகிறது.
- source_word: וְלֹא אָבוּ
  choice: மனமில்லாதிருந்தது
  rationale: செய்ய விருப்பமில்லாமை அல்லது இணங்க மறுத்தல் என்ற வினையின் மனவுறுதி சார்ந்த பொருளைத் தக்கவைக்கிறது.
- source_word: לִשְׁמֹעַ בְּקוֹל
  choice: குரலுக்குச் செவிகொடுக்க
  rationale: ‘குரலைக் கேள்’ என்ற எபிரெய மரபுத்தொடரின் உருவகத்தைப் பாதுகாக்கிறது; இச்சூழலில் ‘இணங்கு’ அல்லது ‘கீழ்ப்படி’ என்றும் பொருள்படலாம்.
- source_word: אֲחֵיהֶם בְּנֵי יִשְׂרָאֵל
  choice: தங்கள் சகோதரர்களான இஸ்ரவேல் மக்கள்
  rationale: கோத்திரங்களுக்கு இடையேயான உறவைக் காட்டும் ‘சகோதரர்கள்’ என்ற மொழியையும், ‘இஸ்ரவேல் மக்கள்’ என்ற இயல்பான தமிழையும் இணைக்கிறது.
theological_decisions:
- issue: בְּנֵי בְלִיַּעַל என்பதன் பொருள்
  choice: தகுதியற்றவர்களின் மகன்கள்
  alternative: தீய மனிதர்கள்; பெலியாலின் மகன்கள்
  rationale: இது இங்கு ஒழுக்கக்கேடான மனிதர்களைக் குறிக்கும் எபிரெய மரபுத்தொடர்; ‘பெலியால்’ என்ற பிற்கால தனிப்பட்ட தீய ஆளுமையை உரைக்குள் இறக்குமதி செய்யாமல் அதன் உருவகத் தன்மையைப் பாதுகாக்கிறது.
- issue: கூட்டத்தின் நோக்கத்தைச் சொல்லும் וּנְמִיתֵם וּנְבַעֲרָה
  choice: நாங்கள் அவர்களைக் கொன்று, இஸ்ரவேலிலிருந்து தீமையை அகற்றுவோம்
  alternative: அவர்களுக்கு மரணத் தண்டனை விதித்து, இஸ்ரவேலிலிருந்து தீமையைத் தூய்மைப்படுத்துவோம்
  rationale: மரணமும் சமூகத்திலிருந்து தீமையை நீக்குவதும் இணைந்த நீதிசார் நோக்கத்தைப் பாதுகாக்கிறது; தேவையற்ற விளக்க விரிவாக்கத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘பென்யமீன்’ என்பது கோத்திரத்தை ஒருமைத் தொகுப்புப் பெயராகக் குறிப்பதால், ‘மனமில்லாதிருந்தது’ என்ற ஒருமை அமைப்பு வைக்கப்பட்டுள்ளது. எபிரெய மூலத்தில் வெளிப்படையான ‘இப்போது’ இல்லாததால் தொடக்கத்தில் காலக் குறிப்பு சேர்க்கப்படவில்லை.
