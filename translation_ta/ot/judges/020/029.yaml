  text: וַ/יָּ֤שֶׂם יִשְׂרָאֵל֙ אֹֽרְבִ֔ים אֶל הַ/גִּבְעָ֖ה סָבִֽיב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/029.yaml
  text: So Israel set men in ambush around Gibeah[a].
translation:
  language: ta
  text: இஸ்ரவேலர் கிபியாவைச் சுற்றிலும் பதுங்கியிருந்து தாக்கும் வீரர்களை நிறுத்தினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “கிபியாவை நோக்கி/சுற்றிலும் பதுங்கித் தாக்குபவர்களை நிறுத்தினார்கள்.” இச்சொற்றொடர் நகரைச் சுற்றிய இடங்களில் பதுங்கித் தாக்கும் படையினரை நிறுத்தியதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: நிறுத்தினார்கள்
  rationale: שׂוּם என்பது ‘வைத்தல், நிறுத்துதல், அமைத்தல்’ என்று பொருள்படும். படைவீரர்களைத் திட்டமிட்ட இடங்களில் நிலைநிறுத்திய செயலை இச்சூழலில் ‘நிறுத்தினார்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேலர்
  rationale: இங்கு இஸ்ரவேல் என்ற பெயர் படைத்தொகுதியைச் சேர்ந்த மக்களை கூட்டாகக் குறிக்கிறது; தமிழில் மனிதக் குழுவைக் குறிக்கும் ‘இஸ்ரவேலர்’ இயல்பானது.
- source_word: אֹרְבִים
  choice: பதுங்கியிருந்து தாக்கும் வீரர்களை
  rationale: ארב வேரிலிருந்து வந்த இப்பன்மைப் பெயரெச்சம், தாக்குவதற்காக மறைந்து காத்திருப்பவர்களைக் குறிக்கிறது. ‘பதுங்கியிருந்து தாக்கும் வீரர்கள்’ என்பது ஆட்களைக் குறிக்கும் எபிரெயச் சொல்லின் தன்மையையும் இராணுவ நோக்கத்தையும் தெளிவாகக் காக்கிறது.
- source_word: אֶל ... סָבִיב
  choice: கிபியாவைச் சுற்றிலும்
  rationale: אֶל தனியே ‘நோக்கி/அருகே’ எனப் பொருள்படலாம்; ஆனால் סָבִיב உடனான இக்கட்டமைப்பும் இராணுவச் சூழலும் கிபியாவைச் சுற்றிய நிலைப்படுத்தலைக் குறிக்கின்றன. ‘சுற்றிலும்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: הַגִּבְעָה
  choice: கிபியா
  rationale: இது கிபியா என்ற இடப்பெயர். எபிரெய மொழியிலுள்ள முன்னொட்டு உருபைத் தமிழில் தனியாக மொழிபெயர்க்கத் தேவையில்லை.
