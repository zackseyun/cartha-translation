translation_notes:
  register: நவீன, கண்ணியமான, வாசிக்க எளிய உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘துணை மனைவி’ என்பது פילגש குறிக்கும் வேறுபட்ட திருமணச் சமூகநிலையைத் தெரிவிக்கிறது; ‘கணவன்’ என்ற சொல்லுடன் மூலத்தில் காணப்படும் உறவியல் பதற்றம் தக்கவைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் இடப்பெயர்ச் சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
