  yaml_path: translation/ot/judges/020/004.yaml
  text: Then the Levite[a], the husband of the woman who had been murdered, answered and said, “I came to Gibeah, which belongs to Benjamin, I and my concubine, to spend the night.
translation:
  language: ta
  text: 'கொலை செய்யப்பட்ட அந்தப் பெண்ணின் கணவனான லேவியன் பதிலளித்துச் சொன்னான்: “நானும் என் மறுமனைவியும் இரவு தங்குவதற்காகப் பென்யமீனுக்குரிய கிபியாவுக்கு[a] வந்தோம்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பென்யமீன் பகுதியில் உள்ள கிபியாவுக்கு.”
    reason: אֲשֶׁר לְבִנְיָמִן என்பது கிபியா பென்யமீன் கோத்திரத்துக்குரியது என்பதையும், பென்யமீன் பிரதேசத்தில் உள்ளது என்பதையும் குறிக்கலாம்.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: மறுமொழியாகச் சொன்னான்
  rationale: எபிரெயக் கதையாடலில் பேச்சை அறிமுகப்படுத்தும் இரு வினைகளையும் இயல்பான தமிழில் ஒன்றிணைத்துப் பிரதிபலிக்கிறது; வெளிப்படையான கேள்வி இல்லாவிட்டாலும் பதிலளிக்கும் நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: הָאִישׁ הַלֵּוִי
  choice: லேவியன்
  rationale: பேசுகிறவரின் லேவி அடையாளத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אִישׁ הָאִשָּׁה
  choice: அந்தப் பெண்ணின் கணவன்
  rationale: சொல்லுக்குச் சொல் ‘அந்தப் பெண்ணின் ஆண்’ என்றாலும், இச்சூழலில் உறவைக் குறிக்கும் இயல்பான தமிழ்ச் சொல் ‘கணவன்’; தொடர்ந்து வரும் ‘துணை மனைவி’ என்ற குறிப்போடு உள்ள பதற்றமும் நீக்கப்படவில்லை.
- source_word: הַנִּרְצָחָה
  choice: கொலைசெய்யப்பட்ட
  rationale: רצח என்பதிலுள்ள குற்றவியல் மற்றும் வன்முறை சார்ந்த வலிமையைப் பொதுவான ‘கொல்லப்பட்ட’ என்பதைக் காட்டிலும் தெளிவாகக் காக்கிறது.
- source_word: הַגִּבְעָתָה
  choice: கிபியாவுக்கு
  rationale: இடப்பெயருடன் இணைந்த திசைச்சுட்டும் -ה இறுதியைத் தமிழின் ‘-க்கு’ வேற்றுமை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: பென்யமீனுக்குச் சொந்தமான
  rationale: கிபியா பென்யமீனின் கோத்திரப் பகுதியைச் சார்ந்தது என்ற உறவைத் தெளிவாகக் காட்டுகிறது; ‘பென்யமீனில் உள்ள’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: בָּאתִי אֲנִי וּפִילַגְשִׁי
  choice: நானும் என் துணை மனைவியும் ... வந்தோம்
  rationale: வெளிப்படையான אֲנִי மற்றும் இணைக்கப்பட்ட துணையைத் தமிழில் இயல்பான கூட்டெழுவாயாக வழங்குகிறது. פילגש என்பதன் முழு மனைவி நிலையிலிருந்து வேறுபட்ட சமூக நிலையை ‘துணை மனைவி’ காட்டுகிறது; இழிவான அல்லது மிகப் பழமையான சொல்லைத் தவிர்க்கிறது.
- source_word: לָלוּן
  choice: இரவு தங்குவதற்காக
  rationale: ஓரிரவு தங்கும் நோக்கத்தை நவீனத் தமிழில் தெளிவாகக் கூறுகிறது.
