translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய இணை அமைப்பு ‘பென்யமீனின் மக்கள் / இஸ்ரவேலின் மக்கள்’ என்பதில் காக்கப்பட்டுள்ளது. நேரடிப் பேச்சின் சொல் வரிசையும் கேள்வி வலிமையும் இயல்பான தமிழுக்கு ஏற்றவாறு அமைக்கப்பட்டுள்ளன.
