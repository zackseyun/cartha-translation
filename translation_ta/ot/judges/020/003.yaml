source:
  edition: WLC
  text: וַֽ/יִּשְׁמְעוּ֙ בְּנֵ֣י בִנְיָמִ֔ן כִּֽי עָל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל הַ/מִּצְפָּ֑ה וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל דַּבְּר֕וּ אֵיכָ֥ה נִהְיְתָ֖ה הָ/רָעָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/003.yaml
  text: The sons of Benjamin heard that the sons of Israel had gone up to Mizpah[a]. And the sons of Israel said, “Tell us[b], how did this evil happen?”
translation:
  language: ta
  text: இஸ்ரவேலின் மக்கள் மிஸ்பாவுக்குச் சென்றிருந்ததைப் பென்யமீனின் மக்கள்[a] கேள்விப்பட்டார்கள். இஸ்ரவேலின் மக்கள், “சொல்லுங்கள், இந்தத் தீமை[b] எப்படி நடந்தது?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொற்படியாக, “பென்யமீனின் மகன்கள்,” “இஸ்ரவேலின் மகன்கள்” என்று வருகிறது; இவை பென்யமீனியரையும் இஸ்ரவேலரையும் குறிக்கின்றன.
    reason: lexical_alternative
  - marker: b
    text: “இந்தத் தீமை” என்பதை “இந்தக் கொடுமை” அல்லது “இந்தத் தவறு” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் வலுவான ஒழுக்கப் பொருளைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: கேள்விப்பட்டார்கள்
  rationale: שׁמע இங்கு ஒரு செய்தியை அறிந்துகொள்வதைக் குறிக்கிறது. ‘கேள்விப்பட்டார்கள்’ என்பது இயல்பான தமிழாகவும், மூலத்தின் ‘கேட்டார்கள்’ என்ற அடிப்படை உணர்வைத் தக்கவைத்தும் உள்ளது.
- source_word: בְּנֵי בִנְיָמִן / בְּנֵי יִשְׂרָאֵל
  choice: பென்யமீனின் மக்கள் / இஸ்ரவேலின் மக்கள்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘மகன்கள்’ என்றாலும், இங்கு கோத்திர மக்களைக் குறிக்கிறது. நவீனத் தமிழில் ‘மக்கள்’ தெளிவாகவும் இயல்பாகவும் இருந்து, இரண்டு பெயர்களுக்கிடையிலான இணை அமைப்பையும் காக்கிறது.
- source_word: כִּי עָלוּ
  choice: சென்றிருந்ததை
  rationale: עלה என்பதன் அடிப்படை இயக்கப் பொருள் காக்கப்படுகிறது; கேட்டறிந்த நிகழ்வுக்கு முன்பே அவர்கள் சென்றிருந்ததால் தமிழ் இறந்தகால முற்றுவினை பயன்படுத்தப்பட்டுள்ளது. ‘கூடியிருந்ததை’ என்பது சூழலை விளக்கினாலும் மூல வினையை மிகையாகப் பொருளுரைக்கும்.
- source_word: הַמִּצְפָּה
  choice: மிஸ்பாவுக்கு
  rationale: இது இடப்பெயர். இலக்கைச் சுட்டும் எபிரெய வடிவம் தமிழில் ‘-க்கு’ வேற்றுமையால் இயல்பாக வழங்கப்படுகிறது.
- source_word: וַיֹּאמְרוּ
  choice: என்றார்கள்
  rationale: אמר என்பதன் பொதுவான ‘சொல்’ பொருள் நேரடிப் பேச்சுக்குப் பின் தமிழில் இயல்பான ‘என்றார்கள்’ என வழங்கப்படுகிறது; ‘கேட்டார்கள்’ என்று மொழிபெயர்ப்பது பேச்சுச் செயலின் தன்மையைத் தேவையின்றி விளக்கிவிடும்.
- source_word: דַּבְּרוּ
  choice: சொல்லுங்கள்
  rationale: கட்டளை வடிவமான ‘பேசுங்கள்’ இச்சூழலில் நிகழ்ந்ததை விவரிக்குமாறு கோருகிறது. ‘சொல்லுங்கள்’ இயல்பான மரியாதைப் பன்மை வடிவமாக உள்ளது; மூலத்தில் வெளிப்படையாக இல்லாத ‘எங்களிடம்’ சேர்க்கப்படவில்லை.
- source_word: אֵיכָה נִהְיְתָה
  choice: எப்படி நடந்தது
  rationale: אֵיכָה நிகழ்ந்த முறையைக் கேட்கிறது; היה இவ்வமைப்பில் ‘நடந்தது’ என்று நிகழ்வுப் பொருளில் இயல்பாகத் தமிழாக்கப்படுகிறது.
- source_word: הָרָעָה הַזֹּאת
  choice: இந்தத் தீமை
  rationale: רָעָה இச்சூழலில் வெறும் பேரிடரை அல்ல, கடுமையான ஒழுக்கத் தீமையைச் சுட்டுகிறது. ‘தீமை’ அந்த வலிமையைத் தக்கவைத்தும், ‘அக்கிரமம்’ போன்ற குறுகிய சட்ட அல்லது சமய நிறத்தைச் சேர்க்காமலும் உள்ளது.
