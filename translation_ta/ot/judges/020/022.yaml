  text: וַ/יִּתְחַזֵּ֥ק הָ/עָ֖ם אִ֣ישׁ יִשְׂרָאֵ֑ל וַ/יֹּסִ֨פוּ֙ לַ/עֲרֹ֣ךְ מִלְחָמָ֔ה בַּ/מָּק֕וֹם אֲשֶׁר עָ֥רְכוּ שָׁ֖ם בַּ/יּ֥וֹם הָ/רִאשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/022.yaml
  text: But the people[a], the men of Israel, strengthened themselves and again drew up for battle in the place where they had drawn up on the first day.
translation:
  language: ta
  text: ஆனால், இஸ்ரவேல் மக்களான ஆண்கள் தங்களை உறுதிப்படுத்திக்கொண்டு[a], முதல் நாளில் அணிவகுத்து நின்ற அதே இடத்தில் மீண்டும் போருக்கு அணிவகுத்து நின்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீண்டும் துணிவடைந்து.” தோல்விக்குப் பிறகு அவர்கள் புதிதாக மனவுறுதி பெற்றதையும் எபிரெயச் சொல் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: தங்களைத் திடப்படுத்திக்கொண்டு
  rationale: חזק என்பதன் ஹித்பயேல் வடிவம் இங்கு தோல்விக்குப் பின் அவர்கள் மீண்டும் உறுதியடைந்ததைத் தற்சார்பு நுணுக்கத்துடன் குறிக்கிறது. ‘தங்களைத் திடப்படுத்திக்கொண்டு’ என்பது அந்த வடிவத்தையும் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הָעָם אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேல் ஆண்களாகிய மக்கள்
  rationale: ‘மக்கள்’ என்ற கூட்டுப்பெயரையும் ‘இஸ்ரவேலின் ஆண்/ஆண்கள்’ என்ற போரிடும் ஆண்களைக் குறிக்கும் இணைப்பையும் காக்கிறது; ‘படை’ என்று மொழிபெயர்ப்பது மூலத்தில் இல்லாத இராணுவப் பெயரைச் சேர்த்துவிடும்.
- source_word: וַיֹּסִפוּ
  choice: மீண்டும்
  rationale: தொடரும் வினையெச்சத்துடன் יסף மறுபடியும் செய்தல் அல்லது மீண்டும் தொடங்குதல் என்ற பொருளைத் தருகிறது.
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: போருக்கு அணிவகுத்து நின்றார்கள்
  rationale: ערך + מלחמה என்பது போருக்கான வரிசை அல்லது அணியை அமைத்தலைக் குறிக்கிறது. இத்தமிழ் சொற்றொடர் இராணுவச் சூழலையும் செயல்விளைவையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בַּמָּקוֹם
  choice: அதே இடத்தில்
  rationale: எளிய இடக்குறிப்பைத் தருகிறது; தொடரும் உறவுத்தொடர் முன்பு அவர்கள் நின்ற இடத்தையே சுட்டுவதால் தமிழில் ‘அதே’ இயல்பாக அந்தத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר עָרְכוּ שָׁם
  choice: அணிவகுத்து நின்ற
  rationale: முன்னர் அதே இடத்தில் செய்த இராணுவ அணிவகுப்பைச் சுட்டுகிறது. தமிழில் தேவையற்ற ‘அங்கே’ என்ற மறுபடியுரைத்தலைத் தவிர்த்து, எபிரெய வினையின் பொருளைக் காக்கிறது.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: முதல் நாளில்
  rationale: முந்தைய போர்நாளைத் துல்லியமாகக் குறிக்கும் இயல்பான காலவுரை.
