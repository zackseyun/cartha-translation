translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. போர்ச் சூழலைத் தெளிவாக்க ‘அணிவகுத்து நின்றார்கள்’ என்றும், மூலத்தின் தற்சார்பு நுணுக்கத்தைக் காக்க ‘தங்களைத் திடப்படுத்திக்கொண்டு’ என்றும் வழங்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
