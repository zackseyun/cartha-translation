revisions:
- from: ஆனால் இஸ்ரவேல் ஆண்களாகிய மக்கள் தங்களைத் திடப்படுத்திக்கொண்டு[a], முதல் நாளில் அணிவகுத்து நின்ற அதே இடத்தில் மீண்டும் போருக்கு அணிவகுத்து நின்றார்கள்.
  to: ஆனால், இஸ்ரவேல் மக்களான ஆண்கள் தங்களை உறுதிப்படுத்திக்கொண்டு[a], முதல் நாளில் அணிவகுத்து நின்ற அதே இடத்தில் மீண்டும் போருக்கு அணிவகுத்து நின்றார்கள்.
  rationale: The revision makes only safe idiomatic improvements. It retains the source’s appositional reference to Israel’s people/men, the reflexive sense of the Hitpael verb, repetition of the battle deployment, and the first-day location. The existing footnote anchor and its lexical alternative remain appropriate.
