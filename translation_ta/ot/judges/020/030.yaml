  yaml_path: translation/ot/judges/020/030.yaml
  text: Then the sons of Israel went up against the sons of Benjamin on the third day[a], and they drew up against Gibeah as before.
translation:
  language: ta
  text: மூன்றாம் நாளில் இஸ்ரவேல் மக்கள் பென்யமீன் மக்களுக்கு எதிராகச் சென்றார்கள்[a]. அவர்கள் முன்புபோலவே கிபியாவுக்கு எதிராக அணிவகுத்து நின்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்கள் பென்யமீனியர்களுக்கு எதிராகச் சென்றார்கள்.” எபிரெயத்தில் சொல்லுக்கு நேராக, “இஸ்ரவேலின் மகன்கள்” என்றும் “பென்யமீனின் மகன்கள்” என்றும் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: சென்றார்கள்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்’ என்றாலும், இங்குள்ள போர்ச் சூழலில் எதிரியை நோக்கிச் செல்வதைக் குறிக்கிறது. தமிழில் இயல்பற்ற ‘மேலே சென்றார்கள்’ என்பதைத் தவிர்த்து, அடுத்துள்ள ‘எதிராக’ என்பதுடன் இயல்பாகப் பொருந்தும் ‘சென்றார்கள்’ பயன்படுத்தப்பட்டது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்கு நேரான ‘இஸ்ரவேலின் மகன்கள்’ என்பதற்குப் பதிலாக, ஒரு இனக்குழுவின் உறுப்பினர்கள் அல்லது வழித்தோன்றல்கள் என்ற எபிரெயப் பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது; அதேவேளை எதிர் தரப்பிலும் இணையான சொற்றொடர் பேணப்படுகிறது.
- source_word: אֶל בְּנֵי בִנְיָמִן
  choice: பென்யமீனின் மக்களுக்கு எதிராக
  rationale: אֶל அடிப்படையில் ‘நோக்கி/இடம் நோக்கி’ எனப் பொருள்பட்டாலும், இப்போர்ச் சூழலில் பகைமையான முன்னேற்றத்தை ‘எதிராக’ என்பது தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: மூன்றாம் நாளில்
  rationale: காலத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரின் இயல்பான தமிழாக்கம்.
- source_word: וַיַּעַרְכוּ
  choice: அணிவகுத்து நின்றார்கள்
  rationale: ערך என்ற வினை போருக்காகப் படைகளை ஒழுங்குபடுத்தி நிறுத்துவதைக் குறிக்கிறது. ‘அணிவகுத்து நின்றார்கள்’ அந்த இராணுவப் பொருளைத் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: אֶל הַגִּבְעָה
  choice: கிபியாவுக்கு எதிராக
  rationale: போருக்கான அணிவகுப்பைக் குறிக்கும் வினையுடன் வருவதால், நகரத்தை எதிர்த்து நிலைகொண்டதை ‘எதிராக’ தெளிவாகக் காட்டுகிறது.
- source_word: כְּפַעַם בְּפָעַם
  choice: முன்பு போலவே
  rationale: ‘முந்தைய முறைகளில் செய்ததுபோல்’ என்ற எபிரெய மரபுத்தொடரின் சுருக்கமான, இயல்பான தமிழாக்கம்.
