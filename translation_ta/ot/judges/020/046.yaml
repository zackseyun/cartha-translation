revisions:
- from: அன்றைய நாளில் பென்யமீனிலிருந்து வீழ்ந்தவர்கள் மொத்தம் இருபத்தைந்தாயிரம் பேர்; அவர்கள் அனைவரும் வாள் ஏந்திய வீரர்கள்.
  to: அந்த நாளில் பென்யமீனிலிருந்து வீழ்ந்தவர்கள் மொத்தம் இருபத்தைந்தாயிரம் பேர்; வாள் ஏந்திய அந்த ஆண்கள் அனைவரும் வீரர்களாக இருந்தனர்.
  rationale: The revision places “வாள் ஏந்திய” with the counted men and preserves the resumptive force of “அந்த ஆண்கள் அனைவரும்,” followed by the distinct description “வீரர்களாக இருந்தனர்.” No footnote is needed, since the Tamil rendering does not require an unresolved lexical alternative.
