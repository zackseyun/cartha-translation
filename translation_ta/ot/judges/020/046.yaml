  text: וַ/יְהִי֩ כָל הַ/נֹּ֨פְלִ֜ים מִ/בִּנְיָמִ֗ן עֶשְׂרִים֩ וַ/חֲמִשָּׁ֨ה אֶ֥לֶף אִ֛ישׁ שֹׁ֥לֵֽף חֶ֖רֶב בַּ/יּ֣וֹם הַ/ה֑וּא אֶֽת כָּל אֵ֖לֶּה אַנְשֵׁי חָֽיִל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/046.yaml
  text: So all who fell from Benjamin that day were twenty-five thousand men who drew the sword[a]; all these were men of valor.
translation:
  language: ta
  text: அந்த நாளில் பென்யமீனிலிருந்து வீழ்ந்தவர்கள் மொத்தம் இருபத்தைந்தாயிரம் பேர்; வாள் ஏந்திய அந்த ஆண்கள் அனைவரும் வீரர்களாக இருந்தனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כָל הַנֹּפְלִים מִבִּנְיָמִן
  choice: பென்யமீனிலிருந்து வீழ்ந்தவர்கள் மொத்தம்
  rationale: הַנֹּפְלִים என்ற பெயர்ச்சொல் போலச் செயல்படும் பங்கேற்புவினை, போரில் வீழ்ந்தவர்களைக் குறிக்கிறது. מן என்பதன் ‘இலிருந்து’ என்ற நுணுக்கத்தைத் தக்கவைத்து, וַיְהִי தரும் கதைச்சுருக்கத்தை இயல்பான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף אִישׁ
  choice: இருபத்தைந்தாயிரம் பேர்
  rationale: எண்ணிக்கையையும் אִישׁ என்பதையும் தேவையற்ற இராணுவச் சொல்லைச் சேர்க்காமல் நேரடியாக வழங்குகிறது.
- source_word: שֹׁלֵף חֶרֶב
  choice: வாள் ஏந்திய
  rationale: சொல்லுக்கு சொல் ‘வாளை உருவிய’ எனலாம்; ஆனால் இங்கு இது போரிடத் தகுதியுள்ள ஆயுதம் தாங்கியவர்களைக் குறிக்கும் இராணுவச் சொற்றொடர். ‘வாள் ஏந்திய’ என்பது உருவகத்தைப் பாதுகாத்து இயல்பாக உள்ளது.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்றைய நாளில்
  rationale: குறிப்பிட்ட அந்தப் போர்நாளைக் குறிக்கும் காலச் சுட்டைத் தெளிவாக வழங்குகிறது.
- source_word: אֶת כָּל אֵלֶּה אַנְשֵׁי חָיִל
  choice: அவர்கள் அனைவரும் ... வீரர்கள்
  rationale: אֵת כָּל אֵלֶּה முந்தைய எண்ணிக்கையை மீண்டும் வலியுறுத்துகிறது; ‘அவர்கள் அனைவரும்’ அதனை இயல்பான தமிழில் தக்கவைக்கிறது. אַנְשֵׁי חָיִל இச்சூழலில் திறமையும் துணிவும் கொண்ட போர்வீரர்களைக் குறிக்கிறது.
