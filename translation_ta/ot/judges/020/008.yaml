  text: Then all the people rose up as one man, saying, “Not one of us will go to his tent, and not one of us will turn aside to his house.”
translation:
  language: ta
  text: அப்போது மக்கள் அனைவரும் ஒரே மனிதனைப்போல் எழுந்து, “நம்மில் ஒருவனும் தன் கூடாரத்திற்குப் போகமாட்டான்; ஒருவனும் தன் வீட்டிற்குப் போக வழிவிலகமாட்டான்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து நின்று
  rationale: இச்சூழலில் மக்கள் ஒன்றுகூடி உறுதியான நடவடிக்கைக்காக எழுந்ததைக் காட்டும் இயல்பான தமிழ் நடை.
- source_word: כְּאִישׁ אֶחָד
  choice: ஒரே மனிதனைப்போல்
  rationale: எபிரெய உருவகத்தைத் தக்கவைத்து, மக்களின் ஒருமித்த நிலையை வெளிப்படுத்துகிறது.
- source_word: לֹא נֵלֵךְ אִישׁ לְאָהֳלוֹ
  choice: நம்மில் ஒருவனும் தன் கூடாரத்திற்குப் போகமாட்டான்
  rationale: אִישׁ என்ற பகிர்நிலைச் சொல்லின் பொருளை இயல்பான தமிழில் ‘நம்மில் ஒருவனும்’ என வெளிப்படுத்துகிறது.
- source_word: וְלֹא נָסוּר אִישׁ לְבֵיתוֹ
  choice: ஒருவனும் தன் வீட்டிற்குத் திரும்பிச் செல்லமாட்டான்
  rationale: סור என்பதன் ‘வழிவிலகிச் செல்/திரும்பிச் செல்’ என்ற சூழல்சார் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
