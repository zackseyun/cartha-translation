translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது; ஒருமைப்பாட்டைக் குறிக்கும் எபிரெய உருவகம் நேரடியாகத் தக்கவைக்கப்பட்டது.
