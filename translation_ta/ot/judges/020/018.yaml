  text: וַ/יָּקֻ֜מוּ וַ/יַּעֲל֣וּ בֵֽית אֵל֮ וַ/יִּשְׁאֲל֣וּ בֵ/אלֹהִים֒ וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ֚י יַעֲלֶה לָּ֣/נוּ בַ/תְּחִלָּ֔ה לַ/מִּלְחָמָ֖ה עִם בְּנֵ֣י בִנְיָמִ֑ן וַ/יֹּ֥אמֶר יְהוָ֖ה יְהוּדָ֥ה בַ/תְּחִלָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/018.yaml
  text: Then they arose and went up to Bethel[a], and they inquired of God. The sons of Israel said, “Who will go up first for us to the battle against the sons of Benjamin?” And Yahweh said[c][b], “Judah first.”
translation:
  language: ta
  text: அப்போது அவர்கள் எழுந்து பெத்தேலுக்கு ஏறிச் சென்று, தேவனிடம் விசாரித்தார்கள். இஸ்ரவேலின் மகன்கள், “பென்யமீனின் மகன்களுக்கு எதிராகப் போரிட நமக்காக முதலில் யார் ஏறிச் செல்வார்?” என்று கேட்டார்கள். அதற்கு யாவே[a], “யூதா முதலில்” என்றார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இறைவனுடைய பெயர் יהוה (YHWH); மரபாக இது “கர்த்தர்” என்றும் வழங்கப்படுகிறது.
    reason: divine_name
  - marker: b
    text: “யூதா முதலில்” என்பது எபிரெயத்திலும் இவ்வாறே சுருக்கமாக உள்ளது; “யூதா முதலில் ஏறிச் செல்லட்டும்” என்பது அதன் பொருள்.
    reason: elliptical_expression
lexical_decisions:
- source_word: וַיָּקֻמוּ וַיַּעֲלוּ
  choice: அவர்கள் எழுந்து ... ஏறிச் சென்று
  rationale: קום என்பதன் தொடர்கதை இயக்கத்தை ‘எழுந்து’ என்பதும், עלה என்பதன் ‘மேலே செல்லுதல்/ஏறிச் செல்லுதல்’ உணர்வை ‘ஏறிச் சென்று’ என்பதும் இயல்பான தமிழில் காக்கின்றன.
- source_word: בֵית אֵל
  choice: பெத்தேல்
  rationale: மசோரா உரையில் இது இடப்பெயராக உயிர்க்குறியிடப்பட்டுள்ளது; தமிழில் வழக்கமான ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: וַיִּשְׁאֲלוּ בֵאלֹהִים
  choice: தேவனிடம் விசாரித்தார்கள்
  rationale: שׁאל + ב என்பது சாதாரணமாகக் கேட்பதைவிட இறை வழிகாட்டுதலை நாடி விசாரிப்பதைக் குறிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயக் குலவுறவுச் சொல்லமைப்பையும் அதன் ஆண்பால் வடிவத்தையும் வெளிப்படையாகக் காக்கிறது.
- source_word: מִי יַעֲלֶה לָּנוּ בַתְּחִלָּה
  choice: நம்மில் யார் முதலில் ஏறிச் செல்வார்?
  rationale: மூலத்தின் ஒருமை வினைச்சொல்லையும், எந்தக் கோத்திரம் படையை முன்னின்று நடத்த வேண்டும் என்ற கேள்வியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; לָנוּ இங்கு குழுவின் சார்பில்/நம்மிடமிருந்து என்ற சூழற்பொருளில் தரப்பட்டுள்ளது.
- source_word: לַמִּלְחָמָה עִם בְּנֵי בִנְיָמִן
  choice: பென்யமீனின் மகன்களுக்கு எதிரான போருக்கு
  rationale: עִם என்பதன் அடிப்படைப் பொருள் ‘உடன்’ என்றாலும், போர்ச் சூழலில் எதிர்தரப்புடன் மோதுவதை இங்கு குறிக்கிறது; ‘எதிரான’ என்பது நோக்கத்தைத் தெளிவாக்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், ஏற்ற தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: יְהוּדָה בַתְּחִלָּה
  choice: யூதா முதலில்
  rationale: மூல எபிரெயத்தின் சுருக்கமான, வினைச்சொல் விடுபட்ட பதிலை அப்படியே காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயரே உள்ளது; ஆகவே அதை ஒலிபெயர்த்து, மாற்று மரபுவழி வடிவத்தை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற சமூகப் பெயர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள் / இஸ்ரவேல் மக்கள்
  rationale: மூலத்தின் குலவுறவு உருவகத்தையும் இலக்கண ஆண்பாலையும் காக்கும் வகையில் சொற்படிவம் தக்கவைக்கப்பட்டது; இது உடன்படிக்கை மக்களைச் சமூகமாகக் குறிக்கிறது.
- issue: עִם என்பதன் போர்ச் சூழற்பொருள்
  choice: எதிரான
  alternative: உடன்
  rationale: ‘உடன்’ என்பது சொற்பொருளாக சாத்தியமானாலும், இங்கு பென்யமீனுக்கு எதிராகப் போர் செய்வதே தெளிவான சூழல்; அந்த உட்கருத்தை முதன்மை உரை வெளிப்படுத்துகிறது, சொற்படிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எழுந்து’, ‘ஏறிச் சென்று’, ‘விசாரித்தார்கள்’ ஆகியவை மூலத்தின் தொடரியக்கத்தையும் இறை ஆலோசனை நாடும் தன்மையையும் காக்கின்றன. குலவுறவுச் சொற்றொடர்கள் திட்டமிட்டு சற்றே சொற்படியாக வைக்கப்பட்டுள்ளன.
