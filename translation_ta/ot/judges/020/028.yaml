base_translation:
  language: en
  yaml_path: translation/ot/judges/020/028.yaml
  text: And Phinehas the son of Eleazar[a], son of Aaron, stood before him in those days, saying, “Shall I yet again go out to battle against the sons of Benjamin my brother, or shall I stop?” And Yahweh said, “Go up[c][b], for tomorrow I will give him into your hand.”
translation:
  language: ta
  text: ஆரோனின் மகனான எலெயாசாரின் மகன் பினெகாஸ் அந்நாட்களில் அதன் முன்னிலையில்[a] நின்று, “என் சகோதரனான பென்யமீனின் மகன்களுக்கு எதிராகப் போரிட நான் மீண்டும் புறப்பட வேண்டுமா, அல்லது நிறுத்திவிட வேண்டுமா?” என்று கேட்டான். யாவே, “மேலே செல்லுங்கள்; ஏனெனில் நாளை அவனை[c] உன் கையில் ஒப்புக்கொடுப்பேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவருக்கு முன்பாக” என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள சுட்டுப்பெயர் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட உடன்படிக்கைப் பெட்டியைக் குறிக்கலாம்; அல்லது யாவேயைக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: “அவனை” என்பது பென்யமீன் குலத்தை ஒரே கூட்டுத்தொகுதியாகக் குறிப்பிடுகிறது. “அவனை உன் கையில் ஒப்புக்கொடுப்பேன்” என்பதை “அவனை உன் கையில் தருவேன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִינְחָס בֶּן אֶלְעָזָר בֶּן אַהֲרֹן
  choice: ஆரோனின் மகனான எலெயாசரின் மகன் பினெகாஸ்
  rationale: எபிரெய மூலத்திலுள்ள ஆசாரிய வம்சவரிசையின் இரு தலைமுறைகளையும் இயல்பான தமிழ்ச் சொல் வரிசையில் முழுமையாகப் பேணுகிறது.
- source_word: עֹמֵד לְפָנָיו
  choice: அதற்கு முன்பாக நின்று
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட உடன்படிக்கைப் பெட்டியை அண்மையான முன்னோடியாகக் கொண்டு மொழிபெயர்க்கிறது; எபிரெய ஆண்பால் ஒருமைச் சுட்டுப்பின்னொட்டு பெட்டியையும் யாவேயையும் குறிக்கக்கூடியதால் மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בַּיָּמִים הָהֵם
  choice: அந்நாட்களில்
  rationale: மூலத்தின் வழக்கமான காலக் குறிப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַאוֹסִף עוֹד לָצֵאת לַמִּלְחָמָה
  choice: போரிட நான் மீண்டும் புறப்பட வேண்டுமா
  rationale: יסף மற்றும் עוד ஆகியவற்றின் மீண்டும் செய்வது என்ற கருத்தையும், போருக்குப் புறப்படுதல் என்ற இராணுவ மரபுத்தொடரையும் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: עִם בְּנֵי בִנְיָמִן אָחִי
  choice: என் சகோதரனான பென்யமீனின் மகன்களோடு
  rationale: உள்நாட்டுப் போரின் சூழலிலும் மூலத்தில் வலியுறுத்தப்படும் சகோதர உறவையும் குலவழக்குச் சொல்லாட்சியையும் பேணுகிறது; ‘உடன்’ என்பது இங்கு போரிடும் எதிர்த்தரப்பைக் குறிக்கிறது.
- source_word: אִם אֶחְדָּל
  choice: அல்லது விட்டுவிட வேண்டுமா?
  rationale: חדל என்பதன் நிறுத்துதல் அல்லது தொடராமல் இருத்தல் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיֹּאמֶר יְהוָה
  choice: அதற்கு யாவே ... என்றார்
  rationale: தெய்வீகப் பெயரை ‘யாவே’ என ஒலிபெயர்த்து, உரையாடலின் இயல்புக்காக இணைப்பை ‘அதற்கு’ என வழங்குகிறது.
- source_word: עֲלוּ
  choice: நீங்கள் புறப்பட்டுப் போங்கள்
  rationale: பன்மைக் கட்டளையையும் போருக்கான முன்னேற்றத்தையும் பேணுகிறது; வெறும் ‘மேலே போங்கள்’ என்பதால் தமிழில் ஏற்படும் புவியியல் மிகைவிளக்கத்தைத் தவிர்க்கிறது.
- source_word: כִּי מָחָר אֶתְּנֶנּוּ בְיָדֶךָ
  choice: ஏனெனில் நாளை அவனை உன் கையில் ஒப்புக்கொடுப்பேன்
  rationale: ‘கையில் கொடுத்தல்’ என்ற எபிரெய வெற்றி/ஒப்படைப்பு மரபுத்தொடரையும், பென்யமீனை ஒருமைக் கூட்டுப்பொருளாகச் சுட்டும் ‘அவனை’ என்பதையும் பேணுகிறது.
theological_decisions:
- issue: לְפָנָיו என்பதிலுள்ள சுட்டுப்பின்னொட்டின் குறிப்பு
  choice: முந்தைய வசனத்திலுள்ள உடன்படிக்கைப் பெட்டியைக் குறிக்கும் வகையில் ‘அதற்கு முன்பாக’
  alternative: யாவேயைக் குறிக்கும் வகையில் ‘அவருக்கு முன்பாக’
  rationale: உடன்படிக்கைப் பெட்டி உடனடியான முன்னோடியாக இருப்பதாலும் அதன் முன் ஆசாரியன் நிற்பது சூழலுக்குப் பொருந்துவதாலும் முதன்மை உரையில் இவ்வாசிப்பு தேர்ந்தெடுக்கப்பட்டது. இருப்பினும் எபிரெய இலக்கணமும் இறையியல் சூழலும் யாவேயைக் குறிப்பதாகவும் புரிந்துகொள்ள இடமளிப்பதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட தெய்வீகப் பெயரை பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: கட்டளையில் பன்மையும் தொடர்ந்து வரும் சுட்டுகளில் ஒருமையும்
  choice: ‘நீங்கள் ... அவனை உன் கையில்’ என்று எண்ணிக்கை மாற்றத்தைப் பேணுதல்
  alternative: முழுவதையும் தமிழில் ஒரே எண்ணிக்கையாக ஒத்திசைத்தல்
  rationale: עֲלוּ பன்மை; ஆனால் אֶתְּנֶנּוּ மற்றும் בְיָדֶךָ ஒருமை. இம்மாற்றம் இஸ்ரவேல் குழுவையும் அதன் பிரதிநிதியையும் அல்லது கூட்டுத்தொகுதியாகிய பென்யமீனையும் ஒருங்கே சுட்டக்கூடும்; அதைச் சீராக்காமல் மூலத்தின் பதற்றத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. வம்சவரிசை, சகோதர உறவு, தெய்வீகப் பெயர், கூட்டுப்பொருள் ஒருமை, கட்டளையின் பன்மையிலிருந்து ஒருமைக்கான மாறுதல் ஆகிய மூல அம்சங்கள் தேவையற்ற விளக்கச் சீராக்கமின்றிப் பேணப்பட்டுள்ளன.
