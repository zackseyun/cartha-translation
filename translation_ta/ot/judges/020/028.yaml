revisions:
- from: ஆரோனின் மகனான எலெயாசரின் மகன் பினெகாஸ் அந்நாட்களில் அதற்கு முன்பாக[a] நின்று, “என் சகோதரனான பென்யமீனின் மகன்களோடு[b] போரிட நான் மீண்டும் புறப்பட வேண்டுமா, அல்லது விட்டுவிட வேண்டுமா?” என்று கேட்டான். அதற்கு யாவே, “நீங்கள் புறப்பட்டுப் போங்கள்; ஏனெனில் நாளை அவனை[c] உன் கையில் ஒப்புக்கொடுப்பேன்” என்றார்.
  to: ஆரோனின் மகனான எலெயாசாரின் மகன் பினெகாஸ் அந்நாட்களில் அதன் முன்னிலையில்[a] நின்று, “என் சகோதரனான பென்யமீனின் மகன்களுக்கு எதிராகப் போரிட நான் மீண்டும் புறப்பட வேண்டுமா, அல்லது நிறுத்திவிட வேண்டுமா?” என்று கேட்டான். யாவே, “மேலே செல்லுங்கள்; ஏனெனில் நாளை அவனை[c] உன் கையில் ஒப்புக்கொடுப்பேன்” என்றார்.
  rationale: The revision removes the unsupported ‘அதற்கு,’ explicitly marks Benjamin as the opposing party in battle, improves natural Tamil phrasing, and uses standard Tamil biblical name forms. It preserves the textual ambiguity regarding the antecedent of לְפָנָיו in footnote a and preserves the Hebrew’s plural-to-singular shift in the divine reply. Footnote b remains supplied as an audit note for the kinship wording, though the marker is not required in the running text.
