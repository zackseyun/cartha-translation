base_translation:
  language: en
  yaml_path: translation/ot/judges/020/023.yaml
  text: Then the sons of Israel went up and wept before Yahweh until evening[a], and they inquired of Yahweh, saying, “Shall I continue to go near for battle with the sons of Benjamin, my brother?” And Yahweh said, “Go up against him.”
translation:
  language: ta
  text: 'பின்பு இஸ்ரவேல் மக்கள் ஏறிச் சென்று, மாலைவரை யாவேக்கு முன்பாக அழுதார்கள். அவர்கள் யாவேயிடம் விசாரித்தார்கள்: “என் சகோதரனான பென்யமீன் மக்களோடு போரிட நான் தொடர்ந்து நெருங்கிச் செல்லவா?”[a] அதற்கு யாவே, “அவனுக்கு எதிராக ஏறிச் செல்லுங்கள்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் சகோதரனான பென்யமீன் மக்களுக்கு எதிராகப் போரிட நான் மீண்டும் நெருங்கிச் செல்லவா?” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் தாக்குதலைத் தொடர்வதையோ மீண்டும் செய்வதையோ குறிக்கலாம்; עִם என்பது போர்ச் சூழலில் “எதிராக” என்ற பொருளையும் தரலாம்.
    reason: הַאֹסִיף என்பதன் ‘தொடர்தல்/மீண்டும் செய்தல்’ என்ற வாய்ப்பையும், עִם என்பதன் ‘உடன்/எதிராக’ என்ற சூழல் சார்ந்த வாய்ப்பையும் தக்கவைக்கிறது.
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: ஏறிச் சென்று
  rationale: עלה என்பதன் மேல்நோக்கிய நகர்வை இயல்பான தமிழ் நடையில் காக்கிறது; அவர்கள் சென்ற இடத்தை உரை கூறுவதைவிட அதிகமாகத் தீர்மானிக்கவில்லை.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் குடும்ப மற்றும் கூட்டுக் கருத்தை முறையாகத் தக்கவைக்கிறது.
- source_word: וַיִּבְכּוּ
  choice: அழுதார்கள்
  rationale: இழப்பு மற்றும் துயரத்தின் சூழலில் בכה என்பதன் இயல்பான தமிழ் பொருள்.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் ‘முன்பாக/சந்நிதியில்’ என்ற கருத்தை நேரடியாகக் காட்டுகிறது.
- source_word: וַיִּשְׁאֲלוּ בַיהוָה
  choice: யாவேயிடம் விசாரித்து
  rationale: இது சாதாரணமாகக் கேட்பதைவிடத் தெய்வீக வழிகாட்டுதலை நாடும் விசாரணையைக் குறிக்கிறது.
- source_word: הַאוֹסִיף
  choice: நான் தொடர்ந்து
  rationale: יסף இங்கு செயலைத் தொடர்வதையோ மீண்டும் செய்வதையோ குறிக்கலாம்; முதன்மை உரை ‘தொடர்ந்து’ என்பதைத் தேர்ந்தெடுத்து மாற்றுப் பொருளை அடிக்குறிப்பில் தருகிறது.
- source_word: לָגֶשֶׁת
  choice: நெருங்கிச் செல்ல
  rationale: נגשׁ என்பதன் அடிப்படை நகர்வு உருவகத்தைத் தக்கவைக்கிறது; போர் நோக்கம் அடுத்த சொற்றொடரில் தெளிவாகிறது.
- source_word: עִם בְּנֵי בִנְיָמִן
  choice: பென்யமீனின் மகன்களோடு
  rationale: עִם என்பதன் முறையான ‘உடன்/ஓடு’ பொருளைத் தக்கவைக்கிறது; ‘போரிட’ என்பது இங்கு பகைமைச் சூழலைத் தெளிவாக்குகிறது.
- source_word: אָחִי
  choice: என் சகோதரனாகிய
  rationale: முதலாம் நபர் ஒருமையையும் பென்யமீனுடனான உறவுப் பிணைப்பையும் காக்கிறது.
- source_word: עֲלוּ אֵלָיו
  choice: அவனுக்கு எதிராக ஏறிச் செல்லுங்கள்
  rationale: עלה என்பதன் திசை உணர்வையும் இராணுவச் சூழலில் אֶל பெறும் எதிர்நிலைப் பொருளையும் இணைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: பன்மைச் சமூகத்தின் கேள்வியில் வரும் முதலாம் நபர் ஒருமை
  choice: நான் … என் சகோதரன்
  alternative: நாங்கள் … எங்கள் சகோதரர்கள்
  rationale: הַאוֹסִיף என்ற வினை வடிவமும் אָחִי என்ற சொலும் ஒருமையில் உள்ளன. இயல்பாக்குவதற்காக அவற்றைப் பன்மையாக்காமல், மூலத்தின் குறிப்பிடத்தக்க இலக்கணத் திருப்பத்தையும் கூட்டுச் சமூகத்தின் ஒருமைக் குரலையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. கதைநடையின் எளிமையையும் மூலத்தின் ஒருமை–பன்மை இழுவிசையையும் காக்கிறது; தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
