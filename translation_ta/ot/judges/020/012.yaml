  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘கோத்திரங்கள்’ இஸ்ரவேலின் பெரிய பழங்குடி அமைப்புகளுக்கும், ‘குலங்கள்’ பென்யமீனின் உட்பிரிவுகளுக்கும் பயன்படுத்தப்பட்டு, மூலத்தின் பன்மை இயல்பான தமிழில் வேறுபடுத்தப்பட்டுள்ளது.
