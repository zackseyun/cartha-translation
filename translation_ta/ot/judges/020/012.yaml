id: JDG.20.12
reference: Judges 20:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַֽ/יִּשְׁלְח֞וּ שִׁבְטֵ֤י יִשְׂרָאֵל֙ אֲנָשִׁ֔ים בְּ/כָל שִׁבְטֵ֥י בִנְיָמִ֖ן לֵ/אמֹ֑ר מָ֚ה הָ/רָעָ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר נִהְיְתָ֖ה בָּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/012.yaml
  text: So the tribes of Israel sent men through all the tribes of Benjamin[a], saying[b], “What is this evil that has happened among you?”
translation:
  language: ta
  text: ஆகவே இஸ்ரவேலின் கோத்திரங்கள் பென்யமீனின் எல்லாக் குலங்களிடையிலும்[a] ஆட்களை அனுப்பி, “உங்களிடையே நடந்த இந்தத் தீமை[b] என்ன?” என்று கேட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பென்யமீனின் எல்லாக் குலங்களுக்கும்.” எபிரெய முன்னிடைச்சொல் ஒவ்வொரு குலத்திற்கும் ஆட்கள் அனுப்பப்பட்டனர் என்ற பகிர்ந்தளிக்கும் பொருளிலும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இந்தக் கொடுமை” அல்லது “இந்த அநியாயம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: அனுப்பி
  rationale: שלח என்பதன் நேரடியான பொருள் ‘அனுப்பு.’ தொடர்ந்துவரும் நேரடிக் கூற்றுடன் இயல்பாக இணைய வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கோத்திரங்கள்
  rationale: கூட்டு அமைப்பையும் பன்மைச் சமூகத் தலைப்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֲנָשִׁים
  choice: ஆட்களை
  rationale: எபிரெய உரை இவர்களைத் தூதர்கள் அல்லது பிரதிநிதிகள் என்று குறிப்பாக அழைக்காமல் ‘ஆட்கள்’ என்கிறது; ஆகவே செயல்பாட்டை ஊகித்துச் சேர்க்கவில்லை.
- source_word: בְּכָל שִׁבְטֵי בִנְיָמִן
  choice: பென்யமீனின் எல்லாக் குலங்களிடையிலும்
  rationale: பென்யமீன் ஒரு கோத்திரமாக இருப்பதால், இங்குள்ள பன்மை שִׁבְטֵי அதன் உட்பிரிவுகளைக் குறிக்கிறது. ‘குலங்கள்’ என்பது நவீன தமிழில் இயல்பாகவும் பகிர்ந்தளிக்கும் בְּ பொருளுடன் பொருந்துவதாகவும் உள்ளது; வேற்றுமை உருபின் மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לֵאמֹר
  choice: … என்று கேட்டன
  rationale: சொல்லைச் சொல்லாக ‘சொல்லி’ என மொழிபெயர்ப்பதைவிட, நேரடிக் கேள்வியை அறிமுகப்படுத்தும் இதன் உரையாடல் செயல்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מָה
  choice: என்ன?
  rationale: இது காரணத்தைக் கேட்கும் ‘ஏன்?’ அல்ல; நிகழ்ந்த தீமையின் தன்மையை அடையாளம் காணக் கேட்கிறது.
- source_word: הָרָעָה הַזֹּאת
  choice: இந்தத் தீமை
  rationale: רָעָה என்பதிலுள்ள ஒழுக்கரீதியான தீவிரத்தை ‘தீமை’ தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר נִהְיְתָה
  choice: நடந்த
  rationale: Niphal வடிவம் நிகழ்தல் அல்லது சம்பவித்தலைக் குறிக்கிறது; ‘நடந்த’ என்பது சுருக்கமான, இயல்பான தமிழ்.
- source_word: בָּכֶם
  choice: உங்களிடையே
  rationale: தீமை பென்யமீன் சமூகத்தின் நடுவில் நிகழ்ந்ததைக் குறிக்கிறது; ‘உங்களுக்குள்’ என்பதில் வரக்கூடிய உள்நிலைப் பொருளைத் தவிர்க்கிறது.
