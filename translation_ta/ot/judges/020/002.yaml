base_translation:
  language: en
  yaml_path: translation/ot/judges/020/002.yaml
  text: And the chiefs of all the people[a], of all the tribes of Israel, took their stand in the assembly of the people of God—four hundred thousand foot soldiers drawing the sword.
translation:
  language: ta
  text: இஸ்ரவேலின் எல்லாக் கோத்திரங்களைச் சேர்ந்த மக்கள் அனைவரின் தலைவர்களும்[a] தேவனுடைய மக்களின் சபையில் நிலைகொண்டனர். வாளை உருவிய நான்கு இலட்சம் காலாட்படை வீரர்கள் அங்கே இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லுக்குச் சொல், “மக்கள் அனைவரின் மூலைகள்”; இது தலைவர்களையோ முதன்மையான மனிதர்களையோ குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: தங்கள் இடங்களில் நின்றார்கள்
  rationale: ஹித்பயேல் வடிவம் ஒருவர் தமக்குரிய இடத்தை எடுத்துக்கொண்டு நிற்பதைச் சுட்டுகிறது; சூழலின் அணிவகுப்பு உணர்வையும் இயல்பான தமிழையும் இச்சொற்றொடர் காக்கிறது.
- source_word: פִּנּוֹת
  choice: தலைவர்கள்
  rationale: நேரடிப் பொருள் ‘மூலைகள்’; இங்கு மக்களைத் தாங்கி வழிநடத்தும் முதன்மையானவர்களைக் குறிக்கும் எபிரேய உருவகம். தமிழில் பொருளைத் தெளிவாக வழங்க ‘தலைவர்கள்’ பயன்படுத்தப்பட்டது; நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כָּל הָעָם / כֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: மக்கள் அனைவரும் / இஸ்ரவேலின் எல்லாக் கோத்திரங்களும்
  rationale: முழுமையைக் குறிக்கும் இரு தொடர்களும் காக்கப்பட்டுள்ளன; இரண்டாவது தொடர் முதல் குறிப்பை விளக்கும் இணைப்பாக அமைக்கப்பட்டுள்ளது.
- source_word: בִּקְהַל
  choice: சபையில்
  rationale: קהל என்பது கூடிவந்த மக்கள் கூட்டத்தைக் குறிக்கிறது. ‘சபை’ என்பது இங்கு இயல்பான, கண்ணியமான தமிழ்; குறிப்பாக ஒரு பிற்கால மத நிறுவனத்தை உரையில் சேர்க்கவில்லை.
- source_word: עַם הָאֱלֹהִים
  choice: தேவனுடைய மக்கள்
  rationale: எபிரேய உடைமைத் தொடர்பையும் இஸ்ரவேல் தேவனோடு கொண்டுள்ள உறவைக் குறிக்கும் பெயரிடலையும் நேரடியாகக் காக்கிறது.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף
  choice: நான்கு இலட்சம்
  rationale: எண்ணிக்கையின் நேரடியான நவீனத் தமிழாக்கம்.
- source_word: אִישׁ רַגְלִי
  choice: காலாட்படை வீரர்கள்
  rationale: நேரடியாக ‘காலால் செல்லும் ஆட்கள்’ என்ற இராணுவச் சொல்லுக்கு இயல்பான தமிழ் இணை; குதிரைப்படையிலிருந்து இவர்களை வேறுபடுத்தும் பொருள் காக்கப்படுகிறது.
- source_word: שֹׁלֵף חָרֶב
  choice: வாளை உருவிய
  rationale: எபிரேய ஒருமைப் பெயரெச்சம் பெரும் எண்ணிக்கைக்குப் பின் பகிர்ந்தளிக்கும் பொருளில் வருகிறது. ‘வாளை உருவிய’ என்பது போருக்குத் தயாராக வாளை உறையிலிருந்து எடுத்திருக்கும் உயிரோட்டமான படிமத்தைக் காக்கிறது.
theological_decisions:
- issue: עַם הָאֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: தேவனுடைய மக்கள்
  alternative: தேவனின் மக்கள்
  rationale: மூலத்தின் உறவுசார் கட்டமைப்பையும் கண்ணியமான நடையையும் ‘தேவனுடைய மக்கள்’ தெளிவாகக் காக்கிறது; கூடுதல் சமயப்பிரிவுச் சார்ந்த விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமும் வாசிப்புத் தெளிவும் பேணப்பட்டுள்ளன. நீண்ட எபிரேய வாக்கியம் தமிழில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; இதனால் நான்கு இலட்சம் என்பது தலைவர்களின் எண்ணிக்கை என்ற தவறான புரிதல் தவிர்க்கப்பட்டு, அது கூடியிருந்த காலாட்படை வீரர்களைக் குறிக்கும் சூழல் தெளிவாகிறது.
