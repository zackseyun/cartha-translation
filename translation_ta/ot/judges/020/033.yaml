base_translation:
  language: en
  yaml_path: translation/ot/judges/020/033.yaml
  text: Then all the men of Israel rose from their place and drew up in battle formation at Baal-tamar[a], while the men lying in ambush of Israel rushed out from their place, from Maareh-geba.
translation:
  language: ta
  text: அப்போது இஸ்ரவேலின் ஆண்கள் அனைவரும் தங்கள் இடத்திலிருந்து எழுந்து, பாகால்-தாமாரில் போருக்கு அணிவகுத்து நின்றார்கள். இஸ்ரவேலின் பதுங்குப்படையினரோ மாறே-கேபாவில் இருந்த தங்கள் இடத்திலிருந்து[a] பாய்ந்து வெளியே வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியிலுள்ள “மாறே-கேபா” என்பதை இங்கு ஓர் இடப்பெயராகக் கொள்ளலாம். அதை “கேபாவின் திறந்த வெளி” அல்லது “கேபாவின் புல்வெளி” என்றும் விளக்கமாக வாசிக்க இயலும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹל אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஆண்கள் அனைவரும்
  rationale: אִישׁ ஒருமை வடிவில் இருந்தாலும் כֹל உடன் கூட்டுத் தொகையைக் குறிக்கிறது; போர்ச் சூழலில் ஆண்கள் என்பது பாலினத்தையும் இயல்பான தமிழ்நடையையும் காக்கிறது.
- source_word: קָמוּ מִמְּקוֹמוֹ
  choice: தாங்கள் இருந்த இடத்திலிருந்து எழுந்து
  rationale: பன்மை வினை கூட்டுப் பொருளைக் காட்டுகிறது; ஒருமை உடைமைப் பின்னொட்டு பகிர்வுநிலையாக இருப்பதால் தமிழில் பன்மைக் குழுவுக்கேற்றவாறு தரப்பட்டுள்ளது.
- source_word: וַיַּעַרְכוּ
  choice: போருக்கு அணிவகுத்து நின்றார்கள்
  rationale: ערך போர்ச் சூழலில் படைகளை ஒழுங்குபடுத்தி நிறுத்துவதைக் குறிக்கிறது; தமிழ் வாசகருக்கு இராணுவப் பொருளை இயல்பாகத் தெளிவாக்குகிறது.
- source_word: בְּבַעַל תָּמָר
  choice: பாகால்-தாமாரில்
  rationale: இது ஓர் இடப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֹרֵב יִשְׂרָאֵל
  choice: இஸ்ரவேலின் பதுங்குப்படையினரோ
  rationale: எபிரெயச் சொற்றொடர் இஸ்ரவேலைத் தாக்கப் பதுங்கியவர்களை அல்ல, இஸ்ரவேலுக்குச் சொந்தமான பதுங்குப்படையைக் குறிக்கிறது; சுருக்கமான மூலநடையைத் தமிழ் கூட்டுப்பெயர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵגִיחַ
  choice: பாய்ந்து வெளியே வந்தார்கள்
  rationale: மறைவிடத்திலிருந்து திடீரென வெளிப்படும் இயக்கத்தையும் பதுங்கித் தாக்கும் நிகழ்வின் வேகத்தையும் காக்கிறது.
- source_word: מִמְּקוֹמוֹ
  choice: தாங்கள் இருந்த இடத்திலிருந்து
  rationale: ஒருமை பின்னொட்டு கூட்டுப் படைக்கு பகிர்வுநிலையில் பயன்பட்டுள்ளது; தமிழில் இயல்பான பன்மைச் சுட்டு பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִמַּעֲרֵה גָבַע
  choice: மாறே-கேபாவிலிருந்து
  rationale: சொற்றொடர் தெளிவற்றது; சூழலில் இடப்பெயராக இருக்கக்கூடும் என்பதால் முதன்மை உரையில் ஒலிபெயர்த்து, விளக்கப் பொருள் வாய்ப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
