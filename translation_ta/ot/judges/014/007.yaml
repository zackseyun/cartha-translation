base_translation:
  language: en
  yaml_path: translation/ot/judges/014/007.yaml
  text: Then he went down and spoke to the woman[a], and she was pleasing in Samson’s eyes.
translation:
  language: ta
  text: பின்பு அவன் கீழே சென்று அந்தப் பெண்ணிடம் பேசினான்[a]; அவள் சிம்சோனின் பார்வைக்குச் சரியானவளாக இருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இயல்பான சொல்லாக்கத்தில், “அவள் சிம்சோனுக்குப் பிடித்தவளாக இருந்தாள்” அல்லது “அவள் சிம்சோனுக்குச் சரியானவளாக இருந்தாள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: பின்பு அவன் கீழே சென்று
  rationale: ירד என்பதன் புவியியல் இயக்கத்தை ‘கீழே சென்று’ நேரடியாகக் காக்கிறது; தொடக்க வாவ் தொடர்கதை நகர்வாக இயல்பான ‘பின்பு’ என்று வழங்கப்படுகிறது.
- source_word: וַיְדַבֵּר
  choice: பேசினான்
  rationale: דבר உடன் வரும் ל, ஒருவரிடம் பேசுவதைச் சுட்டுகிறது; ‘பேசினான்’ என்பது நேரடியும் இயல்புமான தமிழாக்கம்.
- source_word: לָאִשָּׁה
  choice: அந்தப் பெண்ணிடம்
  rationale: இங்கு אִשָּׁה இன்னும் மனைவியாகாத திம்னா பெண்ணைக் குறிக்கிறது; எனவே ‘பெண்’ என்பது சூழலுக்கேற்ற, மிகை விளக்கமில்லாத தேர்வு.
- source_word: וַתִּישַׁר
  choice: சரியானவளாகத் தோன்றினாள்
  rationale: ישר இங்கு சிம்சோனின் மதிப்பீட்டில் அவள் சரியானவளாக அல்லது விருப்பத்திற்குரியவளாக இருந்தாள் என்பதைக் குறிக்கிறது. இத்தேர்வு ‘சரியான’ என்ற மூலக் கருத்தையும் மதிப்பீட்டுத் தன்மையையும் காக்கிறது.
- source_word: בְּעֵינֵי שִׁמְשׁוֹן
  choice: சிம்சோனின் பார்வைக்கு
  rationale: ‘கண்களில்’ என்ற எபிரேய மரபுத்தொடரின் மதிப்பீட்டுப் பொருளை இயல்பான தமிழில் வழங்குகிறது; அதேவேளை நீதிபதிகள் நூலின் ‘தன் பார்வைக்குச் சரியானது’ என்ற கருப்பொருளோடும் இருக்கக்கூடிய ஒலிப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: நீதிபதிகள் நூலில் வரும் ‘தன் பார்வைக்குச் சரியானது’ என்ற கருப்பொருளுடன் இருக்கக்கூடிய தொடர்பு
  choice: ‘சிம்சோனின் பார்வைக்குச் சரியானவளாகத் தோன்றினாள்’ என்று மதிப்பீட்டு மொழியைத் தக்கவைத்தல்
  alternative: ‘சிம்சோனுக்கு அவளைப் பிடித்திருந்தது’ என்று முழுமையாக மரபுத்தொடராக்குதல்
  rationale: மூலத்தின் ‘நேரான/சரியான’ மற்றும் ‘கண்களில்’ என்ற கூறுகள் நூலின் பரந்த இலக்கியக் கருப்பொருளை நினைவூட்டக்கூடும். அந்தச் சாத்தியத்தை உறுதிப்படுத்தாமலும் அழித்துவிடாமலும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘கீழே சென்று’ புவியியல் நகர்வைக் காக்கிறது; ‘பார்வைக்குச் சரியானவளாக’ என்பது எபிரேய மதிப்பீட்டு மரபுத்தொடரையும் அதன் சாத்தியமான இலக்கிய ஒலிப்பையும் அளவோடு பாதுகாக்கிறது.
