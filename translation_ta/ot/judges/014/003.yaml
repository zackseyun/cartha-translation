base_translation:
  language: en
  yaml_path: translation/ot/judges/014/003.yaml
  text: But his father and his mother said to him[a], “Is there not a woman among the daughters of your brothers or among all my people, that you are going to take a wife from the uncircumcised Philistines?” But Samson said to his father, “Get her for me[b], for she is right in my eyes.”
translation:
  language: ta
  text: அவனுடைய தந்தையும் தாயும் அவனிடம், “உன் சகோதரர்களின் மகள்களிடையிலும்[a] என் மக்கள் அனைவரிடையிலும் ஒரு பெண்ணும் இல்லையா? விருத்தசேதனம் செய்யப்படாத பெலிஸ்தியரிடமிருந்து மனைவியாக ஒரு பெண்ணைக் கொள்ளப் போகிறாயா?” என்றார்கள். சிம்சோன் தன் தந்தையிடம், “அவளை எனக்கு மணமுடித்துத் தாரும்; ஏனெனில் அவள் என் கண்களுக்குச் சரியானவள்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன் சகோதரர்களின் மகள்கள்” என்பது சிம்சோனின் உடன்பிறந்த சகோதரர்களின் மகள்களை மட்டும் குறிக்காமல், அவனுடைய விரிந்த உறவினர் குழுவை அல்லது இனத்தைச் சேர்ந்த பெண்களைப் பொதுவாகக் குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: “அவள் என் கண்களுக்குச் சரியானவள்” என்பதை “அவள் எனக்குப் பிடித்திருக்கிறாள்” அல்லது “என் பார்வையில் அவள் பொருத்தமானவள்” என்றும் மொழிபெயர்க்கலாம். இந்த எபிரேய மரபுத்தொடர் தனிப்பட்ட விருப்பத்தையோ கவர்ச்சியையோ வெளிப்படுத்தலாம்; முதன்மை உரையின் சொல்வடிவம் நீதித்தலைவர்கள் நூலில் மீண்டும் வரும் கருப்பொருளுடனான ஒலிப்பைத் தக்கவைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֵין
  choice: ஒரு பெண்ணும் இல்லையா?
  rationale: எதிர்மறையுடன் வரும் எபிரேய வினாவை, பெற்றோரின் மறுப்பை எதிர்பார்க்கும் வினாவாக இயல்பான தமிழில் தருகிறது.
- source_word: בִּבְנוֹת אַחֶיךָ
  choice: உன் சகோதரர்களின் மகள்களுக்குள்ளும்
  rationale: ‘சகோதரர்கள்’ என்ற மூலமொழியின் உறவுச் சொல்லைத் தக்கவைக்கிறது; இச்சொல் விரிந்த உறவினர் அல்லது இனக் குழுவைக் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: וּבְכָל עַמִּי
  choice: என் மக்கள் எல்லாருக்குள்ளும்
  rationale: இரு பெற்றோரும் பேசுவதாக இருந்தாலும், எபிரேயத்தில் உள்ள முதல்நபர் ஒருமை உடைமைப் பின்னொட்டை (‘என்’) மாற்றாமல் காக்கிறது.
- source_word: אִשָּׁה
  choice: ஒரு பெண் / ஒரு பெண்ணை மனைவியாக
  rationale: முதல் இடத்தில் திருமணத்திற்குத் தகுந்த பெண்ணையும், இரண்டாம் இடத்தில் திருமண நோக்கையும் சூழலுக்கேற்ற தெளிவுடன் வெளிப்படுத்துகிறது.
- source_word: הוֹלֵךְ לָקַחַת
  choice: மனைவியாகக் கொள்ளப் போகிறாய்
  rationale: தொடர்ந்து நடைபெறவிருக்கும் செயலைக் குறிக்கும் எபிரேயக் கட்டமைப்பையும், இங்கு ‘எடுத்தல்’ என்பது திருமணத்தைக் குறிப்பதையும் இயல்பான தமிழில் தருகிறது.
- source_word: מִפְּלִשְׁתִּים הָעֲרֵלִים
  choice: விருத்தசேதனம் செய்யப்படாத இந்தப் பெலிஸ்தியரிடமிருந்து
  rationale: ‘விருத்தசேதனம் செய்யப்படாதவர்கள்’ என்ற உடன்படிக்கை சார்ந்த இகழ்ச்சிப் பெயரை மென்மைப்படுத்தாமல் தக்கவைக்கிறது; ‘இந்த’ என்பது தமிழில் பெற்றோரின் கண்டனத் தொனியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אוֹתָהּ קַח לִי
  choice: அவளை எனக்கு மணமுடித்துத் தாருங்கள்
  rationale: தந்தை திருமணத்தை ஏற்பாடு செய்யும்படி கூறும் கட்டளையை நவீனத் தமிழில் இயல்பாகத் தருகிறது. மரியாதைப் பன்மை பயன்படுத்தப்பட்டாலும், உரை தந்தையையே நேரடியாகச் சுட்டுகிறது.
- source_word: יָשְׁרָה בְעֵינַי
  choice: என் கண்களுக்குச் சரியானவள் அவள்தான்
  rationale: தனிப்பட்ட விருப்பம் அல்லது கவர்ச்சியைக் குறிக்கக்கூடிய சொற்றொடரின் மதிப்பீட்டுத் தன்மையையும் ‘என் கண்களில்’ என்ற உருவகத்தையும் காக்கிறது; நீதித்தலைவர்கள் நூலின் தொடர் கருப்பொருளுடனான ஒலிப்பையும் இழக்காது.
theological_decisions:
- issue: יָשְׁרָה בְעֵינַי என்ற சொற்றொடருக்கும் நீதித்தலைவர்கள் நூலின் தொடர் கருப்பொருளுக்கும் உள்ள ஒலிப்பு
  choice: என் கண்களுக்குச் சரியானவள் அவள்தான்
  alternative: அவள் எனக்குப் பிடித்திருக்கிறாள் / என் பார்வையில் அவள் பொருத்தமானவள்
  rationale: இச்சொற்றொடர் அவளுடைய கவர்ச்சி அல்லது பொருத்தத்தைக் குறிக்கலாம். இருப்பினும், ‘அவரவர் கண்களுக்குச் சரியானதைச் செய்தனர்’ என்ற நூலின் பிற இடங்களிலுள்ள மதிப்பீட்டு மொழியுடன் உள்ள திட்டமிட்டிருக்கக்கூடிய தொடர்பை மொழிபெயர்ப்பு மறைத்துவிடாதபடி உருவகம் தக்கவைக்கப்படுகிறது; இதனால் சிம்சோனின் நோக்கத்திற்கு மேலதிகத் தார்மீகத் தீர்ப்பு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க உரைநடை பயன்படுத்தப்பட்டுள்ளது. பெற்றோரின் அதிருப்தியை வினா வடிவமும் ‘இந்தப் பெலிஸ்தியர்’ என்ற சுட்டும் வெளிப்படுத்துகின்றன. ‘விருத்தசேதனம் செய்யப்படாத’ என்ற உடன்படிக்கை சார்ந்த சொல்லும், ‘என் கண்களுக்குச் சரியானவள்’ என்ற நோக்கமுள்ள உருவகமும் விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
