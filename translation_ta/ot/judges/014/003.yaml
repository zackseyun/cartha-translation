revisions:
- from: அவனுடைய தந்தையும் தாயும் அவனிடம், “உன் சகோதரர்களின் மகள்களுக்குள்ளும்[a] என் மக்கள் எல்லாருக்குள்ளும் ஒரு பெண்ணும் இல்லையா? விருத்தசேதனம் செய்யப்படாத இந்தப் பெலிஸ்தியரிடமிருந்தா நீ ஒரு பெண்ணை மனைவியாகக் கொள்ளப் போகிறாய்?” என்றார்கள். சிம்சோன் தன் தந்தையிடம், “அவளை எனக்கு மணமுடித்துத் தாருங்கள்; ஏனெனில் என் கண்களுக்குச் சரியானவள் அவள்தான்[b]” என்றான்.
  to: அவனுடைய தந்தையும் தாயும் அவனிடம், “உன் சகோதரர்களின் மகள்களிடையிலும்[a] என் மக்கள் அனைவரிடையிலும் ஒரு பெண்ணும் இல்லையா? விருத்தசேதனம் செய்யப்படாத பெலிஸ்தியரிடமிருந்து மனைவியாக ஒரு பெண்ணைக் கொள்ளப் போகிறாயா?” என்றார்கள். சிம்சோன் தன் தந்தையிடம், “அவளை எனக்கு மணமுடித்துத் தாரும்; ஏனெனில் அவள் என் கண்களுக்குச் சரியானவள்[b]” என்றான்.
  rationale: The revision removes an unsupported demonstrative, improves idiomatic Tamil in the parental question, and changes the request to a respectful singular imperative addressed to Samson’s father. It retains the Hebrew’s ambiguity and key lexical features, including “my people,” “uncircumcised Philistines,” and “right in my eyes.”
  reviewer_model: gpt-5.6-terra
