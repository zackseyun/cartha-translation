base_translation:
  language: en
  yaml_path: translation/ot/judges/014/002.yaml
  text: Then he went up and told his father and mother[a], and he said, “I saw a woman in Timnah from the daughters of the Philistines. So now, get her for me as a wife.”
translation:
  language: ta
  text: பின்பு அவன் மேலே சென்று தன் தந்தையிடமும் தாயிடமும் தெரிவித்தான். அவன் அவர்களிடம், “திம்னாவில் பெலிஸ்தியரின் மகள்களில் ஒரு பெண்ணைக் கண்டேன்.[a] இப்போது அவளை எனக்கு மனைவியாகப் பெற்றுத் தாருங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “பெலிஸ்தியரின் மகள்களிலிருந்து.”'
    reason: எபிரெய மூலத்தின் பகுதிப்பொருளுடைய சொல்லாட்சியை நேரடியாகக் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַיַּעַל
  choice: மேலே சென்று
  rationale: עלה என்பதன் ‘மேலே செல்’ என்ற இயக்கப் பொருளை, நிலவியல் நுணுக்கத்தை மிகைப்படுத்தாமல் பாதுகாக்கிறது.
- source_word: וַיַּגֵּד
  choice: தெரிவித்தான்
  rationale: Hiphil வடிவிலுள்ள נגד என்பதன் ‘சொல், அறிவி’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: தன் தந்தையிடமும் தாயிடமும்
  rationale: இரு பெற்றோரிடமும் அவன் கூறினான் என்பதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אִשָּׁה
  choice: ஒரு பெண்
  rationale: இச்சூழலில் திருமணம் இன்னும் நடைபெறாததால், ‘மனைவி’ என்பதற்குப் பதிலாக பொதுவான ‘பெண்’ என்ற பொருள் பொருத்தமானது.
- source_word: רָאִיתִי
  choice: கண்டேன்
  rationale: நேரடி உரையில் நிறைவுற்ற கடந்தகாலச் செயலை இயல்பாகக் குறிக்கிறது.
- source_word: בְתִמְנָתָה
  choice: திம்னாவில்
  rationale: திம்னா என்ற இடத்தில் என்பதைக் குறிக்கும் இயல்பான இடவெற்றுமை வடிவம்.
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: பெலிஸ்தியரின் மகள்களில் ஒரு பெண்
  rationale: ‘பெலிஸ்தியரின் மகள்களிலிருந்து’ என்ற எபிரெயப் பகுதிப்பொருளையும் குடும்பவழக்குச் சொல்லாட்சியையும் வாசிக்கத்தக்க தமிழில் தருகிறது.
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: அவன் கண்டதைச் சொல்வதிலிருந்து திருமணக் கோரிக்கைக்கு மாறும் இடைநிலையை இயல்பாகக் குறிக்கிறது.
- source_word: קְחוּ
  choice: பெற்றுத் தாருங்கள்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்ளுங்கள்’ என்றாலும், பெற்றோரிடம் விடுக்கப்படும் திருமண ஏற்பாட்டுக் கோரிக்கையில் ‘பெற்றுத் தாருங்கள்’ என்பது நோக்கத்தைத் தவறாகப் புரிந்துகொள்ளாத இயல்பான தமிழ்.
- source_word: אוֹתָהּ לִּי לְאִשָּׁה
  choice: அவளை எனக்கு மனைவியாக
  rationale: ‘எனக்காக’ என்ற தனிப்பட்ட கோரிக்கையையும் ‘மனைவியாக’ என்ற திருமண நோக்கத்தையும் பாதுகாக்கிறது.
