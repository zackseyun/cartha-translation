  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. பெற்றோர் திருமணத்தை ஏற்பாடு செய்யும் பண்டைய சூழலை ‘பெற்றுத் தாருங்கள்’ தெளிவாக்குகிறது; அதேவேளை மூலத்தின் ‘எனக்கு மனைவியாக’ என்ற வலியுறுத்தல் நிலைநிறுத்தப்பட்டுள்ளது.
