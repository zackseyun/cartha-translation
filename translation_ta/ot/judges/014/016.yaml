  register: நவீன நிலையான தமிழ்; வாசிக்க எளிதான, கண்ணியமான கதைநடை. மனைவி கணவனை அழைக்கும் இடங்களில் தமிழ் உறவுமுறை வழக்குக்கேற்ப மரியாதைப் பன்மையும், கணவன் மனைவியை அழைக்கும் இடத்தில் ஒருமையும் பயன்படுத்தப்பட்டுள்ளன. அடிக்குறிப்புக் குறி [a] முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
