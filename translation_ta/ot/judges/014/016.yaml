base_translation:
  language: en
  yaml_path: translation/ot/judges/014/016.yaml
  text: Then Samson’s wife wept before him and said[a], “You only hate me; you do not love me. You have posed the riddle to the sons of my people, but you have not told me.” And he said to her, “Look, I have not told my father or my mother, so should I tell you?”
translation:
  language: ta
  text: அப்போது சிம்சோனின் மனைவி அவன் முன் அழுதுகொண்டு, “நீங்கள் என்னை வெறுக்கத்தான் செய்கிறீர்கள்; நேசிப்பதே இல்லை. என் மக்களின் ஆண்களிடம்[a] விடுகதையைப் போட்டீர்கள்; ஆனால் அதை எனக்குச் சொல்லவில்லை” என்றாள். அவன் அவளிடம், “பார், என் தந்தையிடமோ தாயிடமோ நான் அதைச் சொல்லவில்லை; உனக்கா சொல்லப்போகிறேன்?” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “என் மக்களின் மகன்களிடம்.” இங்குள்ள எபிரெயச் சொல் ஆண்பாலில் உள்ளது; இச்சூழலில் அது அவளுடைய மக்களைச் சேர்ந்த ஆண்களைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּבְךְּ ... עָלָיו
  choice: அவன் முன் அழுது
  rationale: בכה என்பது ‘அழுதல்’; ஒருவரைக் குறிக்கும் עַל இச்சூழலில் அவன் முன்னிலையில் அழுததையும் அவன்மீது உணர்ச்சிப்பூர்வ அழுத்தம் கொடுத்ததையும் குறிக்கலாம். தமிழில் இயல்பாகவும் அளவுக்கு மீறி விளக்காமலும் ‘அவன் முன் அழுது’ என வழங்கப்பட்டது.
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: சிம்சோனின் மனைவி
  rationale: மணவுறவை நேரடியாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: רַק שְׂנֵאתַנִי וְלֹא אֲהַבְתָּנִי
  choice: நீங்கள் என்னை நேசிக்கவே இல்லை; வெறுக்கத்தான் செய்கிறீர்கள்
  rationale: רַק தரும் தீவிரத்தையும் ‘வெறுப்பு—அன்பு’ என்ற முரண்பாட்டையும் தமிழில் இயல்பான குற்றச்சாட்டாகப் பாதுகாக்கிறது. தம்பதியரிடையிலான உரையாடலுக்கு ஏற்ற மரியாதைப் பன்மை பயன்படுத்தப்பட்டது.
- source_word: הַחִידָה חַדְתָּ
  choice: விடுகதையைப் போட்டீர்கள்
  rationale: חִידָה என்பது இங்கு ‘விடுகதை’; חוד வினையின் பொருள் அதை முன்வைத்தல் அல்லது போடுதல். ‘விடுகதை போடுதல்’ இயல்பான தமிழ் வழக்கு.
- source_word: לִבְנֵי עַמִּי
  choice: என் மக்களின் ஆண்களிடம்
  rationale: சொல்லெழுத்தாக ‘என் மக்களின் மகன்களுக்கு’; திருமண விருந்தில் இருந்த ஆண் தோழர்களைக் குறிக்கும் வாய்ப்பு அதிகம். பாலினக் குறிப்பைப் பாதுகாத்து இயல்பான தமிழில் வழங்கப்பட்டது.
- source_word: וְלִי לֹא הִגַּדְתָּה
  choice: ஆனால் எனக்கு அதன் விடையைச் சொல்லவில்லை
  rationale: נגד என்பதன் அடிப்படைப் பொருள் ‘சொல்லுதல்/அறிவித்தல்’. தமிழில் ‘எனக்குச் சொல்லவில்லை’ மட்டும் விடுகதையையா விடையையா என்பது குழப்பமாக இருப்பதால், இச்சூழலில் கோரப்படுவது விடை என்பதை இயல்பாகத் தெளிவுபடுத்துகிறது.
- source_word: הִנֵּה
  choice: பார்
  rationale: கவனத்தை ஈர்க்கும் உரையாடல் இடைச்சொல்லின் வலிமையை அர்ச்சாயிசமின்றி தருகிறது.
- source_word: לְאָבִי וּלְאִמִּי לֹא הִגַּדְתִּי
  choice: என் தந்தையிடமோ தாயிடமோகூட நான் அதைச் சொல்லவில்லை
  rationale: இரு பெற்றோரையும் வெளிப்படையாகக் குறிப்பதோடு, எதிர்மறை வாக்கியத்தில் இயல்பான தமிழ் இணைப்பைப் பயன்படுத்துகிறது.
- source_word: וְלָךְ אַגִּיד
  choice: உனக்கா சொல்லப்போகிறேன்?
  rationale: எபிரெயத்தில் எளிய எதிர்கால/முழுமையுறா வடிவம் இருந்தாலும், சூழலில் இது மறுப்பை உணர்த்தும் சொல்லாட்சிக் கேள்வி. தமிழ் வடிவம் அந்த வாத வலிமையைப் பாதுகாக்கிறது.
