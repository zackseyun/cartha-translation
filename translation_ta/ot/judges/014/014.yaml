base_translation:
  language: en
  yaml_path: translation/ot/judges/014/014.yaml
  text: And he said to them[a], “Out of the eater came food[b], and out of the strong came sweetness.” But they could not tell the riddle for three days.
translation:
  language: ta
  text: 'அவன் அவர்களிடம் சொன்னான்:


    “உண்பவனிடமிருந்து உணவு வெளிவந்தது;

    வலிமையானவனிடமிருந்து[a] இனிமை வெளிவந்தது.”


    ஆனால் மூன்று நாட்களாகியும் அவர்களால் அந்த விடுகதையின் விடையைச் சொல்ல[b] முடியவில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மூர்க்கமானவனிடமிருந்து.” எபிரெயச் சொல் “வலிமையான,” “வல்லமையுள்ள,” அல்லது “மூர்க்கமான” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அந்த விடுகதையை விளக்க.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: அவன் அவர்களிடம் சொன்னான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தருகிறது; காலவரிசையை அளவுக்கு மீறித் துல்லியப்படுத்தவில்லை.
- source_word: מֵהָאֹכֵל
  choice: உண்பவனிடமிருந்து
  rationale: ‘உண்பவன்’ என்ற பெயர்ச்சொல் தன்மையில் வரும் நிகழ்கால வினையெச்சப் பொருளையும், விடுகதையின் மறைபொருளையும் காக்கிறது.
- source_word: יָצָא
  choice: வெளிவந்தது
  rationale: מן உடன் வரும் ‘உள்ளிருந்து வெளிப்படுதல்’ என்ற கருத்தைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: מַאֲכָל
  choice: உணவு
  rationale: אכל என்ற வேருடன் உள்ள சொல்விளையாட்டை ‘உண்பவன்—உணவு’ என்ற தமிழ்ச் சொல்லிணை மூலம் ஓரளவு காக்கிறது.
- source_word: וּמֵעַז
  choice: வலிமையானவனிடமிருந்து
  rationale: עַז என்பதன் அடிப்படைப் பொருளான ‘வலிமையான’ என்பதைத் தேர்ந்தெடுத்து, அதை நேரடியாகச் சிங்கம் என்று விளக்காமல் விடுகதையின் மறைநிலையைப் பாதுகாக்கிறது.
- source_word: מָתוֹק
  choice: இனிமை
  rationale: பெயர்ச்சொல் தன்மையில் பயன்படுத்தப்பட்டுள்ள ‘இனியது/இனிமை’ என்ற கருத்தைச் சுருக்கமாகத் தருவதோடு, ‘உணவு’ என்பதுடனான கவிதைநடை இணைப்பையும் காக்கிறது.
- source_word: לְהַגִּיד הַחִידָה
  choice: அந்த விடுகதையின் விடையைச் சொல்ல
  rationale: தமிழில் ‘விடுகதையைச் சொல்ல’ என்பது அதை எடுத்துரைப்பதாகத் தவறாகப் புரியக்கூடும்; சூழலில் நோக்கப்பட்டுள்ள விடையைக் கண்டறிந்து தெரிவிப்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: மூன்று நாட்களாகியும்
  rationale: மூன்று நாள் காலப்பகுதி கடந்தும் அவர்களால் முடியவில்லை என்ற தொடர்ச்சியான பொருளை இயல்பான தமிழில் தருகிறது; துல்லியமான கால எல்லையை தேவையின்றி வற்புறுத்தவில்லை.
