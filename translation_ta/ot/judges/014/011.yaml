  text: וַ/יְהִ֖י כִּ/רְאוֹתָ֣/ם אוֹת֑/וֹ וַ/יִּקְחוּ֙ שְׁלֹשִׁ֣ים מֵֽרֵעִ֔ים וַ/יִּהְי֖וּ אִתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/011.yaml
  text: And when they saw him[a], they took thirty companions, and they were with him.
translation:
  language: ta
  text: அவர்கள் அவனைக் கண்டபோது, முப்பது தோழர்களை அழைத்தார்கள்; அவர்கள் அவனுடன் இருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தோழர்கள்’ என்பதற்கு ‘நண்பர்கள்’ என்றும் மொழிபெயர்க்கலாம்; இவர்கள் குறிப்பாகத் திருமணத் தோழர்களாக அல்லது மாப்பிள்ளையின் உடனிருப்போராக இருந்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹתָם
  choice: அவர்கள் ... பார்த்தபோது
  rationale: வַיְהִי இங்கு கதைத் தொடரை அறிமுகப்படுத்துகிறது; כִּרְאוֹתָם என்பது காலப் பொருளில் ‘அவர்கள் பார்த்தபோது’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது. தமிழில் தனியே ‘அப்போது நடந்தது’ என்று சேர்ப்பது தேவையற்ற கனத்த நடையை உருவாக்கும்.
- source_word: אֹתוֹ
  choice: அவனை
  rationale: நேரடிச் செயப்படுபொருள் சுட்டுப்பெயர் சிம்சோனைக் குறிக்கிறது.
- source_word: וַיִּקְחוּ
  choice: அழைத்து வந்து ... இருக்கச் செய்தார்கள்
  rationale: அடிப்படைப் பொருள் ‘எடுத்தார்கள்’ என்றாலும், நபர்களைச் சிம்சோனுடன் இருக்க நியமித்த இந்தச் சூழலில் தமிழில் ‘அழைத்து வந்து’ என்பது இயல்பானது; அடுத்த வினையுடன் இணைத்து நோக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: שְׁלֹשִׁים מֵרֵעִים
  choice: முப்பது தோழர்களை
  rationale: מֵרֵעִים என்பது நண்பர்கள் அல்லது உடனிருப்போர் எனப் பொருள்படலாம். ‘தோழர்கள்’ உறவுப் பொருளைக் காக்கிறது; குறிப்பாக ‘மாப்பிள்ளைத் தோழர்கள்’ என்று சூழலை அளவுக்கு மீறி நிர்ணயிக்காது.
- source_word: וַיִּהְיוּ אִתּוֹ
  choice: அவனுடன் இருக்கச் செய்தார்கள்
  rationale: எபிரெயச் சொற்றொடரின் அடிப்படைப் பொருள் ‘அவர்கள் அவனுடன் இருந்தார்கள்.’ தமிழில் முந்தைய வினையுடன் இணைத்த இவ்வடிவம், அந்த முப்பது பேரை அழைத்து அவனுடன் வைத்தனர் என்ற தொடர்ச்சியை இயல்பாகத் தருகிறது.
