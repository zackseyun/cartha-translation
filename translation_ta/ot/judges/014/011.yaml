  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. எபிரெயக் கதைநடையின் தொடர்ச்சி தமிழில் இயல்பாக வழங்கப்பட்டுள்ளது; திருமணச் சூழல் சாத்தியமானதாயினும் முதன்மை உரையில் அளவுக்கு மீறி குறிப்பாக்கப்படவில்லை.
