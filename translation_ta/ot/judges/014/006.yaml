base_translation:
  language: en
  yaml_path: translation/ot/judges/014/006.yaml
  text: Then the Spirit of Yahweh rushed upon him[a], and he tore it apart as one tears apart a young goat, though he had nothing in his hand[b]. But he did not tell his father or his mother what he had done.
translation:
  language: ta
  text: அப்போது யாவேயின் ஆவி அவர்மேல் வல்லமையாய்ப் பாய்ந்தது[a]. அவர் தம் கையில் எதுவும் இல்லாதபோதிலும், ஒரு வெள்ளாட்டுக் குட்டியைக் கிழிப்பதுபோல் அந்தச் சிங்கத்தைக் கிழித்துப்போட்டார்[b]. ஆனால் அவர் செய்ததைத் தம் தந்தையிடமோ தாயிடமோ சொல்லவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்மேல் வல்லமையுடன் இறங்கியது.” எபிரெயச் சொற்றொடர் ஆவி திடீரெனவும் வல்லமையாகவும் அவர்மேல் செயல்பட்டதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், “ஒரு வெள்ளாட்டுக் குட்டியைக் கிழிப்பதுபோல்.” இங்கு கிழிக்கப்பட்டது முந்தைய வசனத்தில் சொல்லப்பட்ட சிங்கம்.
    reason: referent_clarification
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו
  choice: அவர்மேல் வல்லமையுடன் இறங்கியது
  rationale: צלח עַל என்பது இங்கு யாவேயின் ஆவி சிம்சோனைத் திடீரென ஆட்கொண்டு வல்லமை அளித்ததைக் குறிக்கிறது. இயல்பான தமிழில் இந்த வலிமையான நிகழ்வை இச்சொற்றொடர் தெளிவாகத் தெரிவிக்கிறது; மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: רוּחַ יְהוָה
  choice: யாவேயின் ஆவி
  rationale: רוּחַ இங்கு காற்றையோ மனப்பாங்கையோ அல்ல, கடவுள் வல்லமை அளிக்கும் அவரது ஆவியைக் குறிக்கிறது; יהוה தனிப்பெயராகப் பெயரெழுத்தாக்கப்படுகிறது.
- source_word: וַיְשַׁסְּעֵהוּ
  choice: அந்தச் சிங்கத்தைக் கிழித்துப்போட்டார்
  rationale: שׁסע வன்மையாகப் பிளத்தல் அல்லது கிழித்தலைக் குறிக்கிறது. ஆண்பால் ஒருமை பின்னொட்டு முந்தைய வசனத்தின் சிங்கத்தைக் குறிப்பதால், தமிழில் அதன் குறிப்பை வெளிப்படையாகச் சொல்வது தெளிவளிக்கிறது.
- source_word: כְּשַׁסַּע הַגְּדִי
  choice: ஒரு வெள்ளாட்டுக் குட்டியைக் கிழிப்பதுபோல்
  rationale: גְּדִי என்பது இளம் வெள்ளாட்டைக் குறிக்கிறது. 'வெள்ளாட்டுக் குட்டி' என்பது நவீன வாசகருக்கு இயல்பாகவும் தெளிவாகவும் உள்ளது; ஒப்புமை செயல் நிகழ்ந்த விதத்தையும் எளிமையையும் உணர்த்துகிறது.
- source_word: וּמְאוּמָה אֵין בְּיָדוֹ
  choice: தம் கையில் எதுவுமே இல்லாதிருந்தபோதிலும்
  rationale: எபிரெய உரை அவரது கையில் எந்த ஆயுதமும் இல்லை என்பதை வலியுறுத்துகிறது. 'இருந்தபோதிலும்' என்பது சூழலில் உள்ள விட்டுக்கொடுப்பு சார்ந்த நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְלֹא הִגִּיד לְאָבִיו וּלְאִמּוֹ
  choice: ஆனால் ... தம் தந்தையிடமோ தாயிடமோ அவர் சொல்லவில்லை
  rationale: மறுப்பு வாக்கியத்தில் '-இடமோ ... -இடமோ' என்பது இருவரிடமும் சொல்லவில்லை என்பதைத் தெளிவாகக் காட்டுகிறது. וְ இங்கு முந்தைய அசாதாரண செயலுடன் மென்மையான முரண்பாட்டைக் கொண்ட தொடர்ச்சியாக 'ஆனால்' என வழங்கப்படுகிறது.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: தாம் செய்ததை
  rationale: முன்னதாக நிகழ்ந்த செயலைத் தொடர்ந்து சொல்லாததைச் சுருக்கமான, இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை நான்கு எழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. 'யாவே' என்பது அந்த உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல், பரவலாக ஏற்கப்படும் நவீன பெயரெழுத்தாக்கத்தில் காக்கிறது.
- issue: רוּחַ என்பதன் பொருள்
  choice: ஆவி
  alternative: காற்று / மனப்பாங்கு
  rationale: சிம்சோனுக்கு அசாதாரண வல்லமை அளிக்கும் இச்சூழலில், இச்சொல் யாவேயின் செயலாற்றும் ஆவியையே குறிக்கிறது.
translation_notes:
  register: மரியாதைமிக்க, நவீன நிலையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. சிம்சோனை ஒருமை மரியாதை வடிவில் குறிப்பதால் ‘அவர்/தம்’ என்ற வடிவங்கள் ஒருமையாகக் காக்கப்பட்டுள்ளன. செயற்பாட்டின் வன்மையும், ஆயுதமின்மையும், பெற்றோரிடம் மறைத்ததுமான மூல உரையின் அழுத்தங்கள் பாதுகாக்கப்பட்டுள்ளன.
