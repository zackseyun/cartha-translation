  yaml_path: translation/ot/judges/014/015.yaml
  text: And on the seventh day they said to Samson’s wife[a], “Entice your husband so that he may tell us the riddle, lest we burn you and your father’s household with fire[b]. Did you invite us to dispossess us? Is that not so?”
translation:
  language: ta
  text: ஏழாம் நாளில் அவர்கள் சிம்சோனின் மனைவியிடம், “உன் கணவனைத் தந்திரமாகத் தூண்டி, அந்த விடுகதையை எங்களுக்குச் சொல்லச் செய். இல்லையென்றால் உன்னையும் உன் தகப்பன் வீட்டாரையும் நெருப்பால் சுட்டெரிப்போம்.[a] எங்களுக்குரியதைப் பறித்துக்கொள்ளவா[b] எங்களை அழைத்தீர்கள்? அப்படித்தானே?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன் தகப்பனுடைய வீட்டையும் நெருப்பால் எரிப்போம்” என்றும் மொழிபெயர்க்கலாம். “வீடு” என்பதற்கான எபிரெயச் சொல் கட்டிடத்தையோ, விரிவாகக் குடும்பத்தார் அல்லது வீட்டாரையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “எங்களை உடைமையிழக்கச் செய்யவா?” அல்லது “எங்களுடையதை எடுத்துக்கொள்ளவா?” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினைச்சொல் ஒருவருடைய உடைமையைப் பிடுங்கிக்கொள்ளுதல் அல்லது அதைக் கைப்பற்றுதல் என்ற பொருளைத் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתִּי
  choice: வசப்படுத்தி
  rationale: பியேல் கட்டளை வடிவம் வெறும் மென்மையான சம்மதிக்கச் செய்தலைவிட சூழ்ச்சியுடன் இணங்கச் செய்வதைக் குறிக்கிறது; இயல்பான தமிழில் அந்த நயத்தை இது தக்கவைக்கிறது.
- source_word: אִישֵׁךְ
  choice: உன் கணவனை
  rationale: திருமணச் சூழலில் אִישׁ என்பது இயல்பாக ‘கணவன்’ என்று பொருள்படும்.
- source_word: וְיַגֶּד לָנוּ אֶת הַחִידָה
  choice: அந்த விடுகதையின் விடையை எங்களுக்குச் சொல்லச் செய்
  rationale: எபிரெயத்தில் சொற்பட ‘விடுகதையை எங்களுக்குச் சொல்லட்டும்’ என்றாலும், சூழலில் கேட்கப்படுவது அதன் தீர்வு; தமிழ் வழக்கில் நோக்கத்தைத் தெளிவாகச் சொல்கிறது.
- source_word: פֶּן נִשְׂרֹף
  choice: இல்லையென்றால் ... சுட்டெரிப்போம்
  rationale: פֶּן இங்கு மிரட்டலான எதிர்மறை விளைவைக் குறிக்கிறது; தமிழில் ‘இல்லையென்றால்’ இயல்பாக அந்த நிபந்தனைத் தெரிவிக்கிறது.
- source_word: בֵּית אָבִיךְ
  choice: உன் தகப்பனுடைய வீட்டார்
  rationale: ‘தகப்பனின் வீடு’ என்பது கட்டிடத்தையும் குடும்பத்தாரையும் குறிக்கலாம்; மனிதர்களை எரிப்பதாக உள்ள இச்சூழலில் ‘வீட்டார்’ இயல்பான முதன்மைத் தேர்வு.
- source_word: הֲלְיָרְשֵׁנוּ
  choice: எங்களுக்குரியதைப் பறித்துக்கொள்ளவா
  rationale: ירשׁ இங்கு அவர்களுடைய உடைமையைப் பிடுங்கிக்கொள்ளுதல் அல்லது அவர்களை உடைமையிழக்கச் செய்தல் என்ற பொருளைக் கொண்டுள்ளது; இந்தத் தமிழ் வடிவம் இரண்டையும் இயல்பாகச் சுமக்கிறது.
- source_word: קְרָאתֶם לָנוּ
  choice: எங்களை அழைத்தீர்கள்
  rationale: விருந்துச் சூழலில் קרא ל என்பது அழைப்பதைக் குறிக்கிறது; மூலத்தில் இல்லாத ‘இங்கே’ சேர்க்கப்படவில்லை.
- source_word: הֲלֹא
  choice: அப்படித்தானே?
  rationale: ஒப்புதலை எதிர்பார்க்கும் குற்றஞ்சாட்டும் வினாவின் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
