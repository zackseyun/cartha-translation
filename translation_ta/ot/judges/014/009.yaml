base_translation:
  language: en
  yaml_path: translation/ot/judges/014/009.yaml
  text: He scraped it into his hands and went on[a], eating as he went. Then he went to his father and mother and gave some to them, and they ate. But he did not tell them that he had scraped the honey from the carcass of the lion.
translation:
  language: ta
  text: அவன் அதைத் தன் உள்ளங்கைகளில் அள்ளிக்கொண்டு[a], வழியில் சாப்பிட்டுக்கொண்டே சென்றான். பின்பு தன் தந்தையிடமும் தாயிடமும் சென்று, அவர்களுக்கும் கொடுத்தான்; அவர்களும் சாப்பிட்டார்கள். ஆனால் அந்தத் தேனைச் சிங்கத்தின் சடலத்திலிருந்து அள்ளியெடுத்ததை அவன் அவர்களிடம் சொல்லவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதை எடுத்துக்கொண்டான்’ அல்லது ‘அதை அள்ளியெடுத்தான்’; எபிரெய வினைச்சொல், சடலத்துக்குள் இருந்த தேனை கையால் அகற்றி எடுத்ததைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֵּהוּ
  choice: அதைத் தன் உள்ளங்கைகளில் அள்ளிக்கொண்டு
  rationale: רדה இச்சூழலில் சிங்கத்தின் சடலத்துக்குள் இருந்த தேனை கையால் அகற்றி எடுப்பதைக் குறிக்கிறது. ‘அள்ளிக்கொண்டு’ என்பது அந்த உடல்சார்ந்த செயலை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: אֶל כַּפָּיו
  choice: தன் உள்ளங்கைகளில்
  rationale: כַּף என்பது உள்ளங்கை அல்லது கை என்பதைக் குறிக்கும்; தேனை ஏந்திக்கொண்ட செயலில் ‘உள்ளங்கைகளில்’ என்பது மூலத்தின் குறிப்பான படிமத்தைப் பாதுகாக்கிறது.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְאָכֹל
  choice: வழியில் சாப்பிட்டுக்கொண்டே சென்றான்
  rationale: வினைச்சொல்லுடன் வரும் infinitive absolute தொடர்ச்சியாக நடந்த செயலைக் காட்டுகிறது; ‘சாப்பிட்டுக்கொண்டே சென்றான்’ அந்த நீடித்த செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֵּלֶךְ אֶל אָבִיו וְאֶל אִמּוֹ
  choice: பின்பு தன் தந்தையிடமும் தாயிடமும் சென்று
  rationale: הלך என்பதன் நேரான பொருள் ‘செல்’; தொடர் நிகழ்வின் ஓட்டத்தைத் தமிழில் இயல்பாக்க ‘பின்பு’ சேர்க்கப்பட்டுள்ளது.
- source_word: וַיִּתֵּן לָהֶם
  choice: அவர்களுக்கும் கொடுத்தான்
  rationale: கொடுக்கப்பட்ட பொருள் தேன் என்பது சூழலால் தெளிவு. ‘அவர்களுக்கும்’ என்பது அவன் தானும் உண்டபின் அவர்களுடன் பகிர்ந்த பகுதியுணர்வை இயல்பாகக் காட்டுகிறது.
- source_word: וַיֹּאכֵלוּ
  choice: அவர்களும் சாப்பிட்டார்கள்
  rationale: மூலத்தின் எளிய கதைநடை வினையைப் பாதுகாக்கிறது; உண்ட பொருள் தேன் என்பது சூழலிலேயே விளங்குகிறது.
- source_word: וְלֹא הִגִּיד לָהֶם
  choice: ஆனால் ... அவன் அவர்களிடம் சொல்லவில்லை
  rationale: הגיד என்பதற்கு ‘சொல்/அறிவி’ என்பது பொருள். இங்கு முந்தைய செயலுக்கும் மறைக்கப்பட்ட தகவலுக்கும் உள்ள முரண்பாட்டை ‘ஆனால்’ இயல்பாகக் குறிக்கிறது.
- source_word: מִגְּוִיַּת הָאַרְיֵה
  choice: சிங்கத்தின் சடலத்திலிருந்து
  rationale: גְּוִיָּה உயிரற்ற உடலைக் குறிக்கிறது. விலங்கின் இறந்த உடலைக் குறிக்க ‘சடலம்’ மூலத்தின் கடுமையான, தெளிவான படிமத்தைப் பாதுகாக்கிறது.
- source_word: רָדָה הַדְּבָשׁ
  choice: அந்தத் தேனை ... அள்ளியெடுத்ததை
  rationale: முன்னர் வரும் அதே רדה வேருடன் சொல்லிணக்கத்தைப் பேண ‘அள்ளியெடுத்ததை’ பயன்படுத்தப்பட்டுள்ளது; ‘அந்தத் தேன்’ சூழலில் ஏற்கெனவே அறிமுகமான பொருளைக் குறிக்கிறது.
