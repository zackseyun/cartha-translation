  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. விடுகதையின் கவித்துவமான இணை அமைப்பும் ‘இளம்பசுவைக்கொண்டு உழுதல்’ என்ற கடுமையான உருவகமும் தக்கவைக்கப்பட்டுள்ளன.
