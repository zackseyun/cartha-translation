base_translation:
  language: en
  yaml_path: translation/ot/judges/014/018.yaml
  text: And the men of the city said to him on the seventh day[a], before the sun went down, “What is sweeter than honey, and what is stronger than a lion?” And he said to them, “If you had not plowed with my heifer[b], you would not have found out my riddle.”
translation:
  language: ta
  text: ஏழாம் நாளில், சூரியன் மறைவதற்கு முன்[a], நகரத்து ஆண்கள் அவனிடம், “தேனைவிட இனிமையானது எது? சிங்கத்தைவிட வலிமையானது எது?” என்று சொன்னார்கள். அவன் அவர்களிடம், “நீங்கள் என் இளம்பசுவைக் கொண்டு உழுதிருக்காவிட்டால்[b], என் விடுகதைக்கான விடையை நீங்கள் கண்டுபிடித்திருக்க மாட்டீர்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “சூரியன் உள்ளே வருவதற்கு முன்”; இது சூரியன் மறைவதற்கு முன் என்பதைக் குறிக்கும் மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு சொல்: “என் இளம்பசுவைக் கொண்டு உழுதிருக்காவிட்டால்.” சிம்சோன் தன் மனைவியை உருவகமாகக் குறிப்பிட்டு, அவளைப் பயன்படுத்தியே அவர்கள் விடையைக் கண்டறிந்ததாகக் குற்றஞ்சாட்டுகிறான்.'
    reason: cultural_note
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: நகரத்து ஆண்கள்
  rationale: எபிரெயச் சொல்லின் ஆண்பால் பன்மையைத் தக்கவைத்தபடி, நவீனத் தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாளில்
  rationale: காலக் குறிப்பை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: בְּטֶרֶם יָבֹא הַחַרְסָה
  choice: சூரியன் மறைவதற்கு முன்
  rationale: சொல்லுக்கு சொல் வடிவம் ‘சூரியன் வருவதற்கு முன்’ என்றிருந்தாலும், இச்சூழலில் அது சூரிய மறைவைக் குறிக்கும் மரபுத்தொடர்.
- source_word: מַה מָּתוֹק מִדְּבַשׁ
  choice: தேனைவிட இனிமையானது எது?
  rationale: מִן என்ற முன்னிடைச்சொல்லின் ஒப்பீட்டுப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וּמֶה עַז מֵאֲרִי
  choice: சிங்கத்தைவிட வலிமையானது எது?
  rationale: עַז என்பதன் வலிமை, கடுமை ஆகிய பொருட்களில், இவ்விடுகதையின் ஒப்பீட்டு அமைப்புக்கு ‘வலிமையானது’ மிகப் பொருத்தம்.
- source_word: לוּלֵא
  choice: உழாதிருந்தால்
  rationale: நிகழ்வுக்கு மாறான நிபந்தனையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חֲרַשְׁתֶּם בְּעֶגְלָתִי
  choice: என் இளம்பசுவைக்கொண்டு உழாதிருந்தால்
  rationale: சிம்சோனின் வேளாண்மை உருவகத்தையும் அதன் கூர்மையான குற்றச்சாட்டையும் மழுப்பாமல் தக்கவைக்கிறது.
- source_word: מְצָאתֶם חִידָתִי
  choice: என் விடுகதைக்கான விடையை நீங்கள் கண்டுபிடித்திருக்க மாட்டீர்கள்
  rationale: ‘என் விடுகதையை கண்டுபிடித்தல்’ என்பதன் சூழல்சார் பொருள் விடையைக் கண்டறிதல் என்பதால், தமிழில் தெளிவாக வெளிப்படுத்தப்பட்டுள்ளது.
