  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֵּ֥רֶד אָבִ֖י/הוּ אֶל הָ/אִשָּׁ֑ה וַ/יַּ֨עַשׂ שָׁ֤ם שִׁמְשׁוֹן֙ מִשְׁתֶּ֔ה כִּ֛י כֵּ֥ן יַעֲשׂ֖וּ הַ/בַּחוּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/010.yaml
  text: So his father went down to the woman[a], and Samson made a feast there, for that is what the young men did.
translation:
  language: ta
  text: அவனுடைய தந்தை அந்தப் பெண்ணிடம் இறங்கிச் சென்றார். சிம்சோன் அங்கே ஒரு விருந்து[a] வைத்தான்; ஏனெனில் இளைஞர்கள் அவ்வாறு செய்வது வழக்கம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விருந்துணவு’ அல்லது ‘மதுபான விருந்து.’ எபிரெயச் சொல்லான מִשְׁתֶּה, மதுபானம் அருந்துவதையும் பொதுவாக உள்ளடக்கிய ஒரு கொண்டாட்ட விருந்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: இறங்கிச் சென்றார்
  rationale: ירד என்பதன் ‘கீழே செல்/இறங்கு’ என்ற திசைநுட்பத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: אָבִיהוּ
  choice: அவனுடைய தந்தை
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு சூழலில் சிம்சோனைக் குறிக்கிறது.
- source_word: אֶל הָאִשָּׁה
  choice: அந்தப் பெண்ணிடம்
  rationale: எபிரெய உரை ‘அந்தப் பெண்ணிடம்’ என்றே கூறுகிறது; சூழலின் அடிப்படையில் ‘மனைவியிடம்’ என்று குறிப்பாக்கப்படவில்லை.
- source_word: וַיַּעַשׂ
  choice: வைத்தான்
  rationale: עשה என்ற பொதுவான வினைச்சொல் விருந்துடன் சேரும்போது தமிழில் ‘விருந்து வைத்தான்’ என்பது இயல்பான இணைச்சொல்.
- source_word: שָׁם
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் எளிய வினையடை இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִשְׁתֶּה
  choice: ஒரு விருந்து
  rationale: கொண்டாட்ட உணவையும் பொதுவாக மதுபானம் அருந்துவதையும் உள்ளடக்கக்கூடிய சொல்லை அளவுக்கு மீறிக் குறிப்பாக்காமல் மொழிபெயர்க்கிறது.
- source_word: כִּי כֵּן יַעֲשׂוּ
  choice: ஏனெனில் ... அவ்வாறு செய்வது வழக்கம்
  rationale: இந்தக் கூற்று இளைஞர்களின் வழக்கமான நடைமுறையை விளக்குகிறது; எபிரெய இறந்தகாலமற்ற வினையின் பழக்கப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַבַּחוּרִים
  choice: இளைஞர்கள்
  rationale: வாழ்க்கையின் இளமைப் பருவத்தில் உள்ள ஆண்களைக் குறிக்கும் பொதுவான, இயல்பான நவீனத் தமிழ் சொல்.
