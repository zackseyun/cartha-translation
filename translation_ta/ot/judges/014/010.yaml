translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தந்தையைச் சுட்டும் வினையில் தமிழின் இயல்பான மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; சிம்சோனைச் சுட்டும் வினை ஒருமையில் வைக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறி குறியீடு ‘woman’ என்பதற்குப் பின் இருந்தாலும், அதன் உள்ளடக்கம் מִשְׁתֶּה என்பதைக் குறித்ததால் தமிழில் ‘விருந்து’ என்பதற்குப் பின் பொருத்தப்பட்டுள்ளது.
