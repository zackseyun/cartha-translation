  text: After some days he returned to take her, and he turned aside to see the carcass of the lion, and behold, a swarm of bees was in the body of the lion, and honey.
translation:
  language: ta
  text: சில நாட்களுக்குப் பிறகு, அவளைத் தன்னுடன் அழைத்துக்கொள்ள அவன் திரும்பி வந்தான். சிங்கத்தின் சடலத்தைப் பார்ப்பதற்காக அவன் வழியைவிட்டு விலகினான். இதோ, சிங்கத்தின் சடலத்திற்குள் தேனீக்களின் ஒரு கூட்டமும் தேனும் இருந்தன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיָּמִים
  choice: சில நாட்களுக்குப் பிறகு
  rationale: கால இடைவெளியை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; எத்தனை நாட்கள் என்பதை மூலமும் குறிப்பிடவில்லை.
- source_word: לְקַחְתָּהּ
  choice: அவளை அழைத்துக்கொண்டு வருவதற்காக
  rationale: இங்கு திருமண ஏற்பாட்டின் தொடர்ச்சியாக மணமகளைத் தன்னுடன் அழைத்துச் செல்வதைக் குறிக்கிறது; வெறும் ‘எடுத்துக்கொள்ள’ என்பது தமிழில் இயல்பற்றதாகவும் தவறாகப் புரியக்கூடியதாகவும் இருக்கும்.
- source_word: וַיָּסַר
  choice: வழியைவிட்டு விலகிச் சென்றான்
  rationale: தன் பயணப் பாதையிலிருந்து ஒதுங்கிச் சென்ற செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: מַפֶּלֶת הָאַרְיֵה
  choice: சிங்கத்தின் சடலம்
  rationale: மூலச் சொல்லின் அடிப்படை உணர்வு ‘விழுந்துக் கிடப்பது’; இச்சூழலில் இறந்த சிங்கத்தின் உடலைக் குறிக்கும் இயல்பான தமிழ் சொல் ‘சடலம்’.
- source_word: עֲדַת דְּבוֹרִים
  choice: தேனீக்களின் ஒரு கூட்டம்
  rationale: עֵדָה இங்கு ஒன்றாகத் திரண்ட தேனீக் கூட்டத்தைக் குறிக்கிறது.
- source_word: בִּגְוִיַּת הָאַרְיֵה וּדְבָשׁ
  choice: சிங்கத்தின் உடலில் தேனீக்களின் ஒரு கூட்டமும் தேனும் இருந்தன
  rationale: எபிரெயின் சுருக்கமான ‘உடலில் ... மற்றும் தேன்’ அமைப்பைத் தமிழில் முழுமையான, இயல்பான வாக்கியமாக்கி, தேன் இருந்ததையும் தனியே காக்கிறது.
