  source_fidelity: மூலத்தின் காலக் குறிப்பு, வழியிலிருந்து விலகுதல், சிங்கத்தின் சடலம், தேனீக் கூட்டம், தேன் ஆகியவை வரைவு உரையில் துல்லியமாகக் காக்கப்பட்டுள்ளன. ஆனால் לְקַחְתָּהּ என்பதற்கு உள்ள பொதுவான ‘அவளை எடுத்துக்கொள்ள/தன்னுடன் அழைத்துக்கொள்ள’ என்ற பொருளை ‘அழைத்துக்கொண்டு வருவதற்காக’ என மொழிபெயர்ப்பது, மூலத்தில் வெளிப்படையாக இல்லாத திசைநோக்கான ‘வருதல்’ கருத்தைச் சேர்க்கிறது.
