revisions:
- from: அவர்களுடைய விருந்து நடைபெற்ற அந்த ஏழு நாட்களும் அவள் அவனிடம் அழுதுகொண்டிருந்தாள்.[a] ஏழாம் நாளில், அவள் அவனை மிகவும் நெருக்கிக் கேட்டதால் அவன் அவளுக்கு விடையைச் சொன்னான்; அவளோ அந்த விடுகதையின் விடையைத் தன் இனத்து ஆண்களுக்குச் சொன்னாள்.[b]
  to: அவர்களுக்கு விருந்து நடந்த அந்த ஏழு நாட்களும் அவள் அவனிடம் அழுதுகொண்டே இருந்தாள்.[a] ஏழாம் நாளில், அவள் அவனை மிகவும் வற்புறுத்தியதால், அவன் அவளுக்கு அதைச் சொன்னான்; பின்னர் அவள் அந்த விடுகதையைத் தன் மக்களைச் சேர்ந்த ஆண்களுக்குச் சொன்னாள்.[b]
  rationale: The revision preserves the Hebrew’s implicit object in Samson’s disclosure (“அதைச் சொன்னான்”) and its explicit wording “the riddle” in the woman’s subsequent disclosure. It also uses a more idiomatic Tamil expression for the men of her people and adjusts the footnote to retain the contextual identification as tentative.
