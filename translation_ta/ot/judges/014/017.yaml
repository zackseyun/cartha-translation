base_translation:
  language: en
  yaml_path: translation/ot/judges/014/017.yaml
  text: She wept before him the seven days that they had the feast[a]. And on the seventh day he told her, because she pressed him hard[b]; then she told the riddle to the sons of her people.
translation:
  language: ta
  text: அவர்களுக்கு விருந்து நடந்த அந்த ஏழு நாட்களும் அவள் அவனிடம் அழுதுகொண்டே இருந்தாள்.[a] ஏழாம் நாளில், அவள் அவனை மிகவும் வற்புறுத்தியதால், அவன் அவளுக்கு அதைச் சொன்னான்; பின்னர் அவள் அந்த விடுகதையைத் தன் மக்களைச் சேர்ந்த ஆண்களுக்குச் சொன்னாள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழிநடை சொற்சொல்லாக, அவள் ‘அவன்மேல் அழுதாள்’ என்கிறது; அவனிடம் தொடர்ந்து அழுது உணர்ச்சிசார் அழுத்தம் கொடுத்ததை இது உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தன் மக்களைச் சேர்ந்த ஆண்கள்’ என்பது சொற்சொல்லாக ‘தன் மக்களின் மகன்கள்’; உடனடிச் சூழலில் இது அவளுடைய பெலிஸ்திய மக்களைச் சேர்ந்த ஆண்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּבְךְּ עָלָיו
  choice: அவள் அவனிடம் அழுதுகொண்டிருந்தாள்
  rationale: בכה என்பது ‘அழு’ என்பதையும், עַל உடனான அமைப்பு அழுகை சிம்சோனை நோக்கிச் செலுத்தப்பட்டு தொடர்ந்து அழுத்தம் கொடுத்ததையும் குறிக்கிறது. தமிழில் இயல்பற்ற ‘அவன்மேல் அழுதாள்’ என்பதற்குப் பதிலாக ‘அவனிடம் அழுதுகொண்டிருந்தாள்’ என்று தொடர்ச்சியும் நோக்கமும் காக்கப்பட்டன.
- source_word: שִׁבְעַת הַיָּמִים אֲשֶׁר הָיָה לָהֶם הַמִּשְׁתֶּה
  choice: அவர்களுடைய விருந்து நடைபெற்ற அந்த ஏழு நாட்களும்
  rationale: குறிப்பிட்ட ஏழு நாள் விருந்தின் முழுக் காலத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; מִשְׁתֶּה என்பதற்கு சூழலுக்கு ஏற்ற பொதுவான ‘விருந்து’ பயன்படுத்தப்பட்டது.
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாளில்
  rationale: יהי இங்கு கதை நகர்த்தும் அமைப்பாக இருப்பதால், தேவையற்ற ‘அது நடந்தது’ என்பதைச் சேர்க்காமல் கால மாற்றம் நேரடியாகத் தரப்பட்டது.
- source_word: וַיַּגֶּד לָהּ
  choice: அவன் அவளுக்கு விடையைச் சொன்னான்
  rationale: נגד என்பது ‘சொல்/தெரிவி’ என்று பொருள். எதைச் சொன்னான் என்பது எபிரெயத்தில் சூழலால் விளங்குகிறது; தமிழில் தெளிவுக்காக ‘விடையை’ சேர்க்கப்பட்டது.
- source_word: כִּי הֱצִיקַתְהוּ
  choice: அவள் அவனை மிகவும் நெருக்கிக் கேட்டதால்
  rationale: צוק என்பதன் ஹிஃபில் வடிவம் கடுமையான, தொடர்ச்சியான அழுத்தத்தைக் குறிக்கிறது. ‘நெருக்கிக் கேட்டாள்’ உணர்ச்சிசார் வற்புறுத்தலையும் இயல்பான தமிழையும் இணைக்கிறது.
- source_word: וַתַּגֵּד הַחִידָה
  choice: அவள் அந்த விடுகதையின் விடையைச் சொன்னாள்
  rationale: சொல்லாக்கம் நேரடியாக ‘விடுகதையைச் சொன்னாள்’ என்றாலும், இங்கு அவள் விடுகதையின் தீர்வை வெளிப்படுத்துகிறாள். தமிழில் தவறாகப் புரியாமல் இருக்க ‘விடுகதையின் விடை’ எனப் பொருள் வெளிப்படுத்தப்பட்டது.
- source_word: לִבְנֵי עַמָּהּ
  choice: தன் இனத்து ஆண்களுக்கு
  rationale: בני עמה literally ‘அவளுடைய மக்களின் மகன்கள்’; சூழலில் அவளுடைய பெலிஸ்திய இனத்தைச் சேர்ந்த ஆண்களைக் குறிக்கிறது. பாலினச் சிறப்பைத் தக்கவைத்து இயல்பாக ‘தன் இனத்து ஆண்கள்’ என மொழிபெயர்க்கப்பட்டது.
