  text: וַ/תְּהִ֖י אֵ֣שֶׁת שִׁמְשׁ֑וֹן לְ/מֵ֣רֵעֵ֔/הוּ אֲשֶׁ֥ר רֵעָ֖ה לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/020.yaml
  text: And Samson’s wife became the wife of his companion[a], who had been his friend.
translation:
  language: ta
  text: சிம்சோனின் மனைவி, அவனுடைய தோழனுக்கு மனைவியானாள்[a]; அவனே சிம்சோனுக்குத் தோழனாக இருந்தவன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய நண்பனுக்கு மனைவியானாள்; அவன் சிம்சோனுக்குத் துணையாக இருந்தவன்.” சமூக உறவு அல்லது உடனிருப்பைக் குறிக்கும் தொடர்புடைய எபிரெயச் சொற்கள் இங்கு பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: மனைவியானாள்
  rationale: היה என்பதன் தொடர்வினை வடிவம் இங்கு நிலைமாற்றத்தையும் நிகழ்வின் விளைவையும் குறிக்கிறது. தமிழில் ‘மனைவியானாள்’ என்பது வெறும் நிலையை அல்லாமல், அவள் வேறொருவனுக்கு மனைவியாக ஆன மாற்றத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: சிம்சோனின் மனைவி
  rationale: எபிரெயக் கட்டுநிலைத் தொடர் திருமண உறவைக் குறிக்கிறது; ‘சிம்சோனின் மனைவி’ என்பது நவீனத் தமிழில் நேரடியும் இயல்பானதும் ஆகும்.
- source_word: לְמֵרֵעֵהוּ
  choice: அவனுடைய தோழனுக்கு மனைவி
  rationale: היה உடன் வரும் לְ உரிமை அல்லது உறவுநிலை மாற்றத்தைக் காட்டுகிறது. מֵרֵעַ என்பது இச்சூழலில் சமூக உறவுடைய தோழன் அல்லது துணைவரைக் குறிக்கிறது.
- source_word: אֲשֶׁר רֵעָה לוֹ
  choice: அவனே சிம்சோனுக்குத் தோழனாக இருந்தவன்
  rationale: רעה என்ற வேர்ச்சொல் இங்கு மேய்த்தலை அல்ல, ஒருவரோடு பழகுதல் அல்லது துணையாக இருத்தலைக் குறிக்கிறது. சுட்டுப்பெயரின் தொடர்பு தெளிவாக இருக்க ‘சிம்சோனுக்கு’ என்று பெயர் மீண்டும் குறிப்பிடப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையான ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தோழன்’ என்பது திருமணச் சூழலில் உடனிருந்த கூட்டாளி அல்லது நண்பன் என்ற இரு நிழற்பொருள்களையும் ஓரளவு தக்கவைக்கிறது; அடிக்குறிப்பு மாற்று வாசிப்பை வழங்குகிறது.
