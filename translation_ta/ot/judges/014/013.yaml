base_translation:
  language: en
  yaml_path: translation/ot/judges/014/013.yaml
  text: But if you cannot tell me[a], then you must give me thirty linen garments and thirty changes of clothes.” And they said to him, “Tell your riddle, and let us hear it.”
translation:
  language: ta
  text: ஆனால் அதை எனக்குச் சொல்ல உங்களால் முடியாவிட்டால், நீங்கள் எனக்கு முப்பது மெல்லிய நாரிழையால் செய்யப்பட்ட ஆடைகளையும்[a] முப்பது மாற்று உடைகளையும் கொடுக்க வேண்டும்.” அதற்கு அவர்கள் அவனிடம், “உன் விடுகதையைச் சொல்; நாங்கள் அதைக் கேட்போம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முப்பது மெல்லிய நாரிழைத் துணிகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் மெல்லிய நாரிழையால் செய்யப்பட்ட பொருட்களைக் குறிக்கலாம்; இங்கு ‘மாற்று உடைகள்’ என்பதற்கு இணையாக வருவதால், அணியத்தக்க ஆடைகளைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוּכְלוּ
  choice: உங்களால் முடியாவிட்டால்
  rationale: יכל என்பது ஆற்றல் அல்லது இயலுமையைக் குறிக்கிறது. நிபந்தனைத் தொடரில் இந்தத் தமிழ் வடிவம் விருப்பமின்மையை அல்ல, இயலாமையையே இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְהַגִּיד לִי
  choice: அதை எனக்குச் சொல்ல
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் பொதுவாக ‘சொல், தெரிவி’ எனப் பொருள்படும். முந்தைய வசனத்திலுள்ள விடுகதையின் விடையே மறைமுகச் செயப்படுபொருள் என்பதால் ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: וּנְתַתֶּם אַתֶּם לִי
  choice: நீங்கள் எனக்கு ... கொடுக்க வேண்டும்
  rationale: இந்தப் பந்தயச் சூழலில் வாவுடன் வரும் நிறைவுவினை, நிபந்தனை நிறைவேறாததன் கட்டுப்படுத்தும் விளைவை வெளிப்படுத்துகிறது; ‘கொடுக்க வேண்டும்’ அதன் கடப்பாட்டுத் தன்மையைத் தெளிவாக்குகிறது.
- source_word: סְדִינִים
  choice: மெல்லிய நாரிழை ஆடைகள்
  rationale: இந்தச் சொல் மெல்லிய நாரிழையால் ஆன துணிகளையோ அணியத்தக்க ஆடைகளையோ குறிக்கலாம். ஆடைகளைப் பந்தயப் பொருளாகக் கூறும் சூழலும் அடுத்த இணைச்சொல்லும் காரணமாக ‘ஆடைகள்’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது; பொருளின் ஓரளவு தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: மாற்று உடைகள்
  rationale: இந்தச் சொற்றொடர் மாற்றி அணியக்கூடிய உடைத்தொகுப்புகளைக் குறிக்கிறது. ‘மாற்று உடைகள்’ என்பது சுருக்கமான, இயல்பான நவீனத் தமிழ்.
- source_word: חוּדָה
  choice: சொல்
  rationale: חוד என்பதன் கட்டளை வடிவம் இங்கு விடுகதையை முன்வைப்பதைக் குறிக்கிறது. உடனே ‘உன் விடுகதை’ வருவதால் ‘சொல்’ உரையாடல் தமிழில் இயல்பானது.
- source_word: חִידָתְךָ
  choice: உன் விடுகதை
  rationale: חידה என்பதற்கான வழக்கமான, சூழலுக்கு மிகத் துல்லியமான தமிழ்ச் சொல் ‘விடுகதை’.
- source_word: וְנִשְׁמָעֶנָּה
  choice: நாங்கள் அதைக் கேட்போம்
  rationale: முதல் நபர் பன்மைக் cohortative வடிவத்தின் விருப்ப/தூண்டல் நிழலை உரையாடல் தமிழில் இயல்பாகக் காட்டுகிறது; பெண்பால் ஒருமை பின்னொட்டு விடுகதையைக் குறிக்கும் என்பதால் ‘அதை’ சேர்க்கப்பட்டுள்ளது.
