reference: Judges 14:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֵּ֥רֶד שִׁמְשׁ֖וֹן תִּמְנָ֑תָ/ה וַ/יַּ֥רְא אִשָּׁ֛ה בְּ/תִמְנָ֖תָ/ה מִ/בְּנ֥וֹת פְּלִשְׁתִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/001.yaml
  text: Then Samson went down to Timnah[a], and at Timnah he saw a woman from the daughters of the Philistines.
translation:
  language: ta
  text: பின்பு சிம்சோன் திம்னாவுக்கு இறங்கிச் சென்றான். திம்னாவில் பெலிஸ்தியப் பெண்களில் ஒருத்தியை அவன் கண்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: இறங்கிச் சென்றான்
  rationale: ירד என்பதன் ‘கீழே செல்/இறங்கு’ என்ற நிலவியல் சார்ந்த கதைநடைப் பொருளைப் பாதுகாத்து, தமிழில் இயல்பாக அமைக்கிறது.
- source_word: שִׁמְשׁוֹן
  choice: சிம்சோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: תִּמְנָתָה
  choice: திம்னாவுக்கு
  rationale: இறுதியில் உள்ள திசைச்சுட்டும் ה, அந்த இடத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது; ‘-வுக்கு’ இதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיַּרְא
  choice: கண்டான்
  rationale: ראה என்பதன் நேரடியான ‘காண்’ என்ற பொருளை, கூடுதல் விளக்கமின்றிப் பாதுகாக்கிறது.
- source_word: אִשָּׁה
  choice: ஒருத்தியை
  rationale: இங்கு אִשָּׁה என்பது இன்னும் ‘மனைவி’ என்று பொருள்படாது; பின்னர் திருமணம் நாடப்படுவதால் ‘பெண்’ என்பதே சூழலுக்கேற்றது. தமிழில் ‘பெண்களில் ஒருத்தி’ என்ற அமைப்பில் பெயர்ச்சொல் இயல்பாக உட்பொதிகிறது.
- source_word: בְּתִמְנָתָה
  choice: திம்னாவில்
  rationale: בְּ குறிக்கும் இடப்பொருளை ‘-இல்’ வேற்றுமை உருபு தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: பெலிஸ்தியப் பெண்களில் ஒருத்தியை
  rationale: எபிரெய மொழியின் சொற்படியான ‘பெலிஸ்தியரின் மகள்களில்’ என்பது தமிழில் தனிப்பட்ட தந்தை–மகள் உறவைத் தேவையின்றி வலியுறுத்தலாம். இவ்விடத்தில் இனக்குழுவைச் சேர்ந்த பெண்களில் ஒருத்தி என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. ‘இறங்கிச் சென்றான்’ மூலம் மூலத்தின் நிலவியல் சொல்லாட்சி பாதுகாக்கப்பட்டது; இன அடையாளம் ‘பெலிஸ்தியப் பெண்களில் ஒருத்தி’ என்று இயல்பாகத் தரப்பட்டது.
