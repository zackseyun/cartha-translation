base_translation:
  language: en
  yaml_path: translation/ot/judges/014/004.yaml
  text: But his father and mother did not know that it was from Yahweh[a], for he was seeking an occasion from the Philistines[b]. At that time the Philistines were ruling over Israel.
translation:
  language: ta
  text: ஆனால், இது யெகோவாவிடமிருந்து வந்தது என்பதை அவனுடைய தந்தையும் தாயும் அறியவில்லை; ஏனெனில், அவன் பெலிஸ்தியர்களுக்கு எதிராகச் செயல்பட ஒரு வாய்ப்பைத் தேடிக்கொண்டிருந்தான்.[a] அந்தக் காலத்தில் பெலிஸ்தியர்கள் இஸ்ரவேலை ஆட்சி செய்துகொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர் பெலிஸ்தியர்களுக்கு எதிராகச் செயல்பட ஒரு வாய்ப்பைத் தேடிக்கொண்டிருந்தார்” என்றும் மொழிபெயர்க்கலாம்; இங்கு “அவர்” என்பது யெகோவாவைக் குறிக்கும். எபிரெய மொழி இந்த வாசிப்பை அனுமதிக்கிறது. மேலும், “ஒரு வாய்ப்பு” என்பதற்கு “ஒரு சாக்கு” அல்லது “ஒரு சந்தர்ப்பம்” என்றும் பொருள் கொள்ளலாம்.
    reason: எழுவாயின் உண்மையான தெளிவின்மையையும் תֹאֲנָה என்பதன் சொல்லியல் மாற்றுகளையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: מֵיְהוָה
  choice: யெகோவாவிடமிருந்து
  rationale: தேவனுடைய தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பெயராகவே வெளிப்படுத்துகிறது; מִן முன்னொட்டின் மூலத்தைக் குறிக்கும் பொருளையும் காக்கிறது.
- source_word: הִיא
  choice: இது ... வந்தது
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் முந்தைய நிகழ்வு அல்லது விவகாரத்தைக் குறிக்கிறது; தமிழில் இயல்பாக இடைநிலை 'இது' பயன்படுத்தப்படுகிறது.
- source_word: תֹאֲנָה
  choice: செயல்பட ஒரு வாய்ப்பு
  rationale: எதிர்நடவடிக்கைக்கான சந்தர்ப்பம் அல்லது சாக்கு என்ற பொருள் உண்டு. 'வாய்ப்பு' நேர்மையற்ற சாக்கு என்ற கருத்தைத் தேவையின்றித் திணிக்காமல் பரந்த பொருளைக் காக்கிறது.
- source_word: מְבַקֵּשׁ
  choice: தேடிக்கொண்டிருந்தான்
  rationale: எபிரெயப் பங்கேற்புவினையின் தொடர்ச்சியான செயற்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִפְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களுக்கு எதிராக
  rationale: சொல்லுருவில் 'பெலிஸ்தியர்களிடமிருந்து' என இருந்தாலும், תֹאֲנָה தேடுதல் என்ற சொற்றொடரும் கதைச் சூழலும் அவர்களுக்கு எதிரான நடவடிக்கைக்கான வாய்ப்பைக் குறிக்கின்றன.
- source_word: וּבָעֵת הַהִיא
  choice: அந்தக் காலத்தில்
  rationale: கதையின் காலப் பின்னணியை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: מֹשְׁלִים בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலை ஆட்சி செய்துகொண்டிருந்தார்கள்
  rationale: தொடர்ந்து நிலவிய ஆட்சியாதிக்கத்தைப் பங்கேற்புவினைக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- source_word: וְאָבִיו וְאִמּוֹ
  choice: அவனுடைய தந்தையும் தாயும்
  rationale: மீண்டும் வரும் உடைமைத் தொடர்பை இயல்பான தமிழ்ச் சேர்க்கையில் சுருக்கமாகக் காக்கிறது.
- source_word: לֹא יָדְעוּ
  choice: அறியவில்லை
  rationale: ידע வினையின் நேரடியான, தெளிவான தமிழ் இணை.
theological_decisions:
- issue: சிம்சோனின் முயற்சியிலும் அதனால் எழும் மோதலிலும் யெகோவாவின் பங்கு
  choice: இந்த விவகாரம் யெகோவாவிடமிருந்து வந்தது என்றும் சிம்சோன் பெலிஸ்தியர்களுக்கு எதிராகச் செயல்பட வாய்ப்புத் தேடினான் என்றும் இரண்டையும் உரை கூறுகிறது.
  alternative: யெகோவா சிம்சோனின் விருப்பத்தை முழுமையாக நிர்ணயித்தார்; அல்லது சிம்சோனின் தனிப்பட்ட முடிவை யெகோவா பின்னர் மட்டும் பயன்படுத்தினார்.
  rationale: எபிரெய உரை தெய்வீக மூலத்தையும் மனிதச் செயற்பாட்டையும் இணைத்தே வைக்கிறது; அவற்றுக்கிடையிலான இறையியல் இழுபறியை மொழிபெயர்ப்பு தீர்த்துவிடவில்லை.
- issue: מְבַקֵּשׁ என்ற வினையின் எழுவாய்
  choice: '''அவன்'' என்பது சிம்சோனைக் குறிக்கிறது.'
  alternative: '''அவன்'' என்பது யெகோவாவைக் குறிக்கலாம்.'
  rationale: இலக்கணப்படி இரு வாசிப்புகளுக்கும் இடமிருந்தாலும், திருமண நிகழ்வின் விரிவான கதைச் சூழல் வாய்ப்பைத் தேடுகிறவனாகச் சிம்சோனைக் காட்டுவது இயல்பானது; மாற்று வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை. 'தேடிக்கொண்டிருந்தான்', 'ஆட்சி செய்துகொண்டிருந்தார்கள்' ஆகியவை எபிரெயப் பங்கேற்புவினைகளின் தொடர்நிலையை வெளிப்படுத்துகின்றன. தெய்வீகச் செயலும் சிம்சோனின் செயற்பாடும் இடையிலான உரைத் tension தீர்க்கப்படாமல் காக்கப்பட்டுள்ளது.
