  text: And the Spirit of Yahweh rushed upon him[a], and he went down to Ashkelon and struck down thirty men from among them, and took their spoil garments and gave the changes of clothes to those who had explained the riddle. And his anger burned, and he went up to his father's house.
translation:
  language: ta
  text: யாவேயின் ஆவி சிம்சோன்மேல் வல்லமையாய் வந்தது. அவர் அஸ்கலோனுக்கு இறங்கிச் சென்று, அங்கிருந்தவர்களில் முப்பது பேரைக் கொன்று, அவர்களுடைய ஆடைகளை[a] எடுத்துக்கொண்டு, விடுகதையின் விடையைச் சொன்னவர்களுக்கு மாற்று உடைகளாகக் கொடுத்தார். அவருடைய கோபம் கொழுந்துவிட்டு எரிந்தது; அவர் தம் தந்தையின் வீட்டுக்கு ஏறிச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய ஆடைகளைக் கொள்ளையாக எடுத்துக்கொண்டு.” இங்கு வரும் எபிரெயச் சொல், கொல்லப்பட்டவர்களிடமிருந்து கழற்றி எடுக்கப்பட்டு கொள்ளையாகக் கொண்டுசெல்லப்பட்ட ஆடைகளைக் குறிப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: யாவேயின் ஆவி சிம்சோன்மேல் வல்லமையோடு வந்தது
  rationale: צלח உடன் רוּחַ יְהוָה என்பது திடீரான, வலிமைமிக்க தெய்வீக ஆற்றலளிப்பைக் குறிக்கிறது. இயல்பான தமிழுக்காக மறைபொருளான இடப்பெயரை விட ‘சிம்சோன்மேல்’ என்று பெயர் தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַיֵּרֶד אַשְׁקְלוֹן
  choice: அஸ்கலோனுக்குச் சென்று
  rationale: ירד என்பதன் திசை உணர்வு மூலத்தில் ‘கீழே சென்றான்’ என்றாலும், தமிழில் இலக்கை நோக்கிய நகர்வை இயல்பாகத் தெரிவிக்க ‘சென்று’ பயன்படுத்தப்பட்டுள்ளது; இங்கு நிலவியல் உயரத் தாழ்வு கருத்தின் மையம் அல்ல.
- source_word: וַיַּךְ מֵהֶם שְׁלֹשִׁים אִישׁ
  choice: அங்கிருந்தவர்களில் முப்பது பேரைக் கொன்று
  rationale: נכה சூழலில் உயிர்க்கொலையைக் குறிக்கிறது; מֵהֶם என்பதன் பகுதியெடுக்கும் பொருள் ‘அங்கிருந்தவர்களில்’ என்று காக்கப்பட்டுள்ளது.
- source_word: חֲלִיצוֹתָם
  choice: அவர்களிடமிருந்து கொள்ளையாக எடுத்த ஆடைகளை
  rationale: இந்தச் சொல் கொல்லப்பட்டவர்களிடமிருந்து கழற்றி எடுக்கப்பட்ட ஆடைகளைக் குறிக்கலாம். ‘கொள்ளையாக எடுத்த’ என்பது சூழலிலுள்ள வன்முறை மற்றும் கைப்பற்றுதலைத் தெளிவாகக் காட்டுகிறது; பொதுவான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַחֲלִיפוֹת
  choice: மாற்றுடைகளாக
  rationale: חליפות என்பது உடை மாற்றுகளையோ தனித்தனி உடைத் தொகுப்புகளையோ குறிக்கிறது. முந்தைய பந்தயத்தின் பொருளை இயல்பான சுருக்கமான தமிழில் தெரிவிக்கிறது.
- source_word: לְמַגִּידֵי הַחִידָה
  choice: விடுகதையின் விடையைச் சொன்னவர்களுக்கு
  rationale: נגד இங்கு விடையை வெளிப்படுத்தியவர்களைக் குறிக்கிறது. ‘விடையைச் சொன்னவர்கள்’ என்பது நவீன தமிழில் தெளிவான நடை.
- source_word: וַיִּחַר אַפּוֹ
  choice: அவருடைய கோபம் கொழுந்துவிட்டு எரிந்தது
  rationale: எபிரெய மொழியின் ‘கோபம் எரிதல்’ உருவகத்தை உயிரோட்டமுள்ள இயல்பான தமிழில் காக்கிறது.
- source_word: וַיַּעַל בֵּית אָבִיהוּ
  choice: அவர் தம் தந்தையின் வீட்டிற்குத் திரும்பிச் சென்றார்
  rationale: עלה என்பதன் நேர்ப்பொருள் ‘மேலே சென்றார்’; சூழலில் அவர் தந்தையின் வீட்டுக்குத் திரும்புவதையே குறிக்கிறது. தமிழில் தேவையற்ற நிலவியல் கடினத்தன்மையைத் தவிர்த்து நிகழ்வை இயல்பாகக் கூறுகிறது.
theological_decisions:
- issue: தெய்வீக ஆற்றலளிப்பும் அதைத் தொடர்ந்து வரும் வன்முறையும்
  choice: ‘யாவேயின் ஆவி சிம்சோன்மேல் வல்லமையோடு வந்தது’ என்று நேரடியாக மொழிபெயர்த்து, அடுத்த செயலைத் தனி வாக்கியமாக வைத்தல்
  alternative: யாவே அவரது எல்லாச் செயல்களையும் அங்கீகரித்ததாக விளக்கிச் சேர்த்தல்
  rationale: மூலம் தெய்வீக ஆற்றலளிப்பை உறுதியாகக் கூறுகிறது; ஆனால் தொடர்ந்து நிகழும் ஒவ்வொரு செயலின் ஒழுக்க மதிப்பீட்டையும் வெளிப்படையாக வழங்கவில்லை. அந்த இறையியல் பதற்றம் விளக்கத்தால் தீர்க்கப்படாமல் காக்கப்படுகிறது.
- issue: יְהוָה என்ற தெய்வப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: தனிப்பெயரைப் பட்டத்தால் பதிலிடாமல் ஒலிபெயர்ப்பது மூலத்தின் பெயரியல் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தொடர் எபிரெய வாவ் அமைப்புகள் தமிழில் இயல்பான வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளன. ‘கொழுந்துவிட்டு எரிந்தது’ என்ற உருவகம் மூலத்தின் தீவிரத்தைத் தக்கவைக்கிறது.
