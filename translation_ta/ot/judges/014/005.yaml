base_translation:
  language: en
  yaml_path: translation/ot/judges/014/005.yaml
  text: Then Samson went down with his father and his mother to Timnah[a], and they came as far as the vineyards of Timnah. And behold[c][b], a young lion was roaring as it came toward him.
translation:
  language: ta
  text: அப்போது சிம்சோன் தன் தந்தையுடனும் தாயுடனும் திம்னாவுக்கு இறங்கிச் சென்றான். அவர்கள் திம்னாவின் திராட்சைத்தோட்டங்கள்வரை வந்தார்கள். இதோ, ஓர் இளம் சிங்கம்[a] கர்ஜித்துக்கொண்டே அவனை நோக்கி வந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “சிங்கங்களின் இளம் சிங்கம்”; இது “ஓர் இளம் சிங்கம்” என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனை எதிர்கொண்டு கர்ஜித்துக்கொண்டிருந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: இறங்கிச் சென்றான்
  rationale: יָרַד என்பதன் கீழ்நோக்கிய பயண நுட்பத்தையும், மலைப்பகுதியிலிருந்து திம்னாவை நோக்கிய பயணத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: תִּמְנָתָה
  choice: திம்னாவுக்கு
  rationale: இடப்பெயருடன் இணைந்த திசைச் சுட்டும் ה, அந்த இடத்தை நோக்கிய பயணத்தை குறிக்கிறது; தமிழில் இலக்கை இயல்பாகக் காட்டும் வடிவம் இது.
- source_word: וַיָּבֹאוּ עַד
  choice: வந்தார்கள் … வரை
  rationale: בוא உடன் வரும் עַד, பயணத்தில் ஒரு குறிப்பிட்ட எல்லை அல்லது இடம் வரை வந்து சேர்ந்ததைக் காட்டுகிறது.
- source_word: כַּרְמֵי תִמְנָתָה
  choice: திம்னாவின் திராட்சைத்தோட்டங்கள்
  rationale: எபிரெய கட்டமைப்பு திம்னாவைச் சேர்ந்த அல்லது அதனோடு தொடர்புடைய திராட்சைத்தோட்டங்களைக் குறிக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה காட்சியில் நிகழும் வியப்பூட்டும் திருப்பத்திற்குக் கவனத்தை ஈர்க்கிறது; ‘இதோ’ அதன் உயிரோட்டத்தைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: כְּפִיר אֲרָיוֹת
  choice: ஓர் இளம் சிங்கம்
  rationale: כְּפִיר வளர்ந்துவரும் இளம் சிங்கத்தைக் குறிக்கிறது; முழுச் சொற்றொடரும் தமிழில் இயல்பாக ‘இளம் சிங்கம்’ என வழங்கப்படுகிறது.
- source_word: שֹׁאֵג
  choice: கர்ஜித்துக்கொண்டே
  rationale: பங்கேற்பு வடிவம் தொடர்ந்து நடந்துகொண்டிருந்த செயலை உயிரோட்டமாகச் சித்தரிக்கிறது.
- source_word: לִקְרָאתוֹ
  choice: அவனை நோக்கி வந்தது
  rationale: לִקְרַאת என்பது ஒருவரை நோக்கிச் செல்வதையோ எதிர்கொள்ள வருவதையோ குறிக்கலாம்; சிங்கத்தின் அணுகுதலை இயல்பான தமிழில் இவ்வாறு வெளிப்படுத்துகிறது.
