translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. ‘விடுகதை போடுதல்’ என்ற இயல்பான தமிழ்ச் சொற்றொடர் பயன்படுத்தப்பட்டது; ஆடை வகைகள் பற்றிய மூலமொழியின் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
