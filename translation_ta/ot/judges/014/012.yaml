base_translation:
  language: en
  yaml_path: translation/ot/judges/014/012.yaml
  text: And Samson said to them[a], “Please let me put a riddle to you. If you indeed tell it to me within the seven days of the feast and solve it[c][b], then I will give you thirty linen garments and thirty changes of clothes.”
translation:
  language: ta
  text: சிம்சோன் அவர்களிடம், “நான் உங்களுக்கு ஒரு விடுகதை போடட்டுமா? விருந்தின் ஏழு நாட்களுக்குள்[a] அதன் விடையை எனக்குத் தெளிவாகச் சொல்லி, விடுகதையைத் தீர்த்தால்[b], நான் உங்களுக்கு முப்பது மெல்லிய நார்த்துணி ஆடைகளையும்[c] முப்பது மாற்று உடைகளையும் கொடுப்பேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விருந்து” என்பதற்கு “விருந்துவிழா” என்றும், இச்சொற்றொடருக்கு “விருந்துவிழாவின் ஏழு நாட்கள் முழுவதும்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லர்த்தமாக, “அதைக் கண்டுபிடித்தால்”; இங்கு விடுகதையின் விடையைக் கண்டறிவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: இங்கு குறிப்பிடப்படும் இருவகை ஆடைகளின் துல்லியமான வடிவம் உறுதியாகத் தெரியவில்லை; முதல் சொல் மெல்லிய நார்த்துணியால் செய்யப்பட்ட ஆடைகளையும், இரண்டாவது சொற்றொடர் மாற்றி அணியும் உடைத் தொகுப்புகளையும் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: אָחֽוּדָה נָּא
  choice: நான் உங்களுக்கு ஒரு விடுகதை போடட்டுமா?
  rationale: முதல் நபர் விருப்பவினையும் נָא தரும் பணிவான முன்மொழிவையும் இயல்பான நவீனத் தமிழில் கேள்வி வடிவில் வெளிப்படுத்துகிறது.
- source_word: חִידָה
  choice: விடுகதை
  rationale: இச்சூழலில் புதிரான கூற்றைச் சுட்டும் இயல்பான தமிழ்ச் சொல்.
- source_word: אִם הַגֵּד תַּגִּידוּ
  choice: அதை எனக்குச் சரியாகச் சொல்லி
  rationale: வினைமுற்றோடு வரும் வினையெச்ச வடிவின் வலியுறுத்தலை ‘சரியாக’ என்பதால் காட்டுகிறது; திறன் குறித்த கருத்தைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: שִׁבְעַת יְמֵי הַמִּשְׁתֶּה
  choice: விருந்தின் ஏழு நாட்களுக்குள்
  rationale: சவாலுக்குரிய காலவரம்பையும் ஏழு நாள் விருந்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: וּמְצָאתֶם
  choice: விடையைக் கண்டுபிடித்தால்
  rationale: சொல்லர்த்தில் ‘கண்டுபிடித்தல்’; விடுகதைச் சூழலில் அதன் விடையைக் கண்டறிதல் என்பதே பொருள்.
- source_word: שְׁלֹשִׁים סְדִינִים
  choice: முப்பது மெல்லிய நார்த்துணி ஆடைகள்
  rationale: סְדִינִים குறிக்கும் துணி ஆடைகளின் பொதுப் பொருளைப் பாதுகாத்து, அவற்றின் துல்லியமான வடிவத்தை உறுதிப்படுத்தாமல் விடுகிறது.
- source_word: שְׁלֹשִׁים חֲלִפֹת בְּגָדִים
  choice: முப்பது மாற்று உடைகள்
  rationale: மாற்றி அணிவதற்கான உடைத் தொகுப்புகள் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְנָתַתִּי לָכֶם
  choice: நான் உங்களுக்குக் கொடுப்பேன்
  rationale: நிபந்தனை நிறைவேறினால் வழங்கப்படும் பரிசைத் தெளிவாகக் கூறுகிறது.
