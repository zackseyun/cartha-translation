  text: וְ/לֹֽא אָבָ֤ה הָ/אִישׁ֙ לָ/ל֔וּן וַ/יָּ֣קָם וַ/יֵּ֗לֶךְ וַ/יָּבֹא֙ עַד נֹ֣כַח יְב֔וּס הִ֖יא יְרוּשָׁלִָ֑ם וְ/עִמּ֗/וֹ צֶ֤מֶד חֲמוֹרִים֙ חֲבוּשִׁ֔ים וּ/פִילַגְשׁ֖/וֹ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/010.yaml
  text: But the man was not willing to spend the night. He rose and went and came opposite Jebus (that is[a], Jerusalem), and with him were a pair of saddled donkeys and his concubine.
translation:
  language: ta
  text: ஆனால் அந்த மனிதன் இரவு தங்க விரும்பவில்லை. அவன் எழுந்து புறப்பட்டு, எபூசுக்கு எதிரே வந்தான் (அதாவது, எருசலேம்).[a] சேணம் பூட்டப்பட்ட ஒரு ஜோடி கழுதைகள் அவனுடன் இருந்தன; அவனுடைய துணைமனைவியும் அவனுடன் இருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எபூசின் அருகில்” அல்லது “எபூசை எதிர்நோக்கிய இடத்துக்கு” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் அவன் நகருக்குள் வந்தான் என்று தெளிவாகக் கூறாமல், நகருக்கு எதிரே அல்லது அதன் முன்னால் இருந்த ஓர் இடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: விரும்பவில்லை
  rationale: இச்சொல் சம்மதம் அல்லது மனவிருப்பத்தைக் குறிக்கிறது. சூழலில் திட்டமிட்ட மறுப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לָלוּן
  choice: இரவு தங்க
  rationale: ஓரிரவு தங்குவதையே குறிப்பாகக் குறிக்கிறது; நவீன தமிழில் தெளிவான இயல்பான சொற்றொடர்.
- source_word: וַיָּקָם וַיֵּלֶךְ וַיָּבֹא
  choice: எழுந்து புறப்பட்டு ... வந்தான்
  rationale: எபிரெய உரையின் தொடர்ச்சியான மூன்று செயல்களையும் கதைநடைக்கு ஏற்றவாறு காக்கிறது.
- source_word: עַד נֹכַח
  choice: எபூசுக்கு எதிரே
  rationale: நகருக்குள் நுழைந்ததாகக் கூறாமல், அதற்கு எதிரில் அல்லது அதன் முன்னால் உள்ள இடம்வரை வந்த spatial பொருளைக் காக்கிறது.
- source_word: יְבוּס הִיא יְרוּשָׁלָם
  choice: எபூசு (அதாவது, எருசலேம்)
  rationale: பழைய இடப்பெயரை எருசலேமுடன் அடையாளப்படுத்தும் விளக்க இணைப்பைத் தெளிவாக வழங்குகிறது.
- source_word: צֶמֶד חֲמוֹרִים
  choice: இரண்டு கழுதைகள்
  rationale: צֶמֶד இங்கு ஒரு ஜோடி விலங்குகளைக் குறிக்கிறது; இயல்பான தமிழில் எண்ணிக்கையாக வழங்கப்பட்டுள்ளது.
- source_word: חֲבוּשִׁים
  choice: சேணம் பூட்டப்பட்ட
  rationale: பயணத்திற்காகக் கழுதைகள் ஆயத்தப்படுத்தப்பட்டதைச் சூழலுக்கு ஏற்றவாறு தெரிவிக்கிறது; 'சுமை ஏற்றப்பட்ட' என்ற மாற்றுப் பொருளைத் திணிக்கவில்லை.
- source_word: פִּילַגְשׁוֹ
  choice: அவனுடைய மறுமனைவி
  rationale: முழு மனைவியிலிருந்து வேறுபட்ட, இரண்டாம் நிலை திருமண உறவைக் குறிக்கும் எபிரெயச் சொல்லை இழிவூட்டாத புரிந்துகொள்ளத்தக்க நவீன தமிழில் வழங்குகிறது.
