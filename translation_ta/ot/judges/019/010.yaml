  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வினைத் தொடரின் நகர்வும் இடவியல் தெளிவின்மையும் காக்கப்பட்டுள்ளன.
