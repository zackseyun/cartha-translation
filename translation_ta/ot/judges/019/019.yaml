  to: மேலும், எங்கள் கழுதைகளுக்கு வைக்கோலும் தீவனமும் இருக்கிறது[a]. எனக்கும், உமது பணிப்பெண்ணுக்கும்[b], என் அடியார்களோடு இருக்கும் இளைஞனுக்கும் அப்பமும் திராட்சை மதுவும் இருக்கிறது. எதுவும் குறைவில்லை[c].
