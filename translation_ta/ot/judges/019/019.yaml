translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்கள் புரிந்துகொள்ளும் வகையிலும் உரையாடலுக்குரிய மரியாதைத் தொனியுடனும் வடிவமைக்கப்பட்டது. ‘உமது’ என்பது முதியவரை நோக்கிய ஒருமை மரியாதையையும் மூலத்தின் இரண்டாம் நபர் ஒருமையையும் காக்கிறது. எபிரெய இருப்புக் கட்டமைப்பை பிரதிபலிக்க ‘எங்களிடம் உள்ளது’ என்பதற்குப் பதிலாக ‘இருக்கிறது’ பயன்படுத்தப்பட்டது.
