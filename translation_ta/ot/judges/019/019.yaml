  text: Yet there is both straw and fodder for our donkeys[a], and there is bread and wine for me, for your female servant, and for the young man with your servants[c][b]; there is no lack of anything.
translation:
  language: ta
  text: மேலும், எங்கள் கழுதைகளுக்கு வைக்கோலும் தீவனமும் இருக்கிறது[a]. எனக்கும், உமது பணிப்பெண்ணுக்கும்[b], என் அடியார்களோடு இருக்கும் இளைஞனுக்கும் அப்பமும் திராட்சை மதுவும் இருக்கிறது. எதுவும் குறைவில்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மேலும், எங்கள் கழுதைகளுக்கு வைக்கோலும், அதோடு தீவனமும் இருக்கிறது” என்றும் மொழிபெயர்க்கலாம். எபிரெய மூலத்தில் ‘கூட/மேலும்’ என்ற சொல் வலியுறுத்தலுக்காகத் திரும்ப வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: “உமது பணிப்பெண்” என்பது தன்னோடு பயணம் செய்த பெண்ணைப் பற்றி வீட்டின் தலைவரிடம் பேசும்போது பயன்படுத்திய தாழ்மையான குறிப்பு.
    reason: cultural_note
  - marker: c
    text: “எங்களுக்கு எதுவும் குறைவில்லை” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם ... גַם ... וְגַם
  choice: மேலும் ... வைக்கோலும் தீவனமும் ...
  rationale: எபிரெய மொழியில் மீண்டும் மீண்டும் வரும் ‘மேலும்/கூட’ என்ற வலியுறுத்தலைத் தமிழில் இயல்பான இணைப்புச் சொல்லாலும் ‘-உம்’ இணைப்புகளாலும் வெளிப்படுத்துகிறது.
- source_word: תֶּבֶן
  choice: வைக்கோல்
  rationale: கழுதைகளுக்கான உலர்ந்த தாவரப் பொருளைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ்ச்சொல்.
- source_word: מִסְפּוֹא
  choice: தீவனம்
  rationale: விலங்குகளுக்கான உணவை மனிதர்களுக்கான அப்பத்திலிருந்து வேறுபடுத்திக் காட்டுகிறது.
- source_word: לַחֲמוֹרֵינוּ
  choice: எங்கள் கழுதைகளுக்கு
  rationale: மூலத்திலுள்ள முதலாம் நபர் பன்மை உடைமைப் பின்னொட்டையும் விலங்கின் பெயரையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: לֶחֶם וָיַיִן
  choice: அப்பமும் திராட்சை மதுவும்
  rationale: குறிப்பாகச் சொல்லப்பட்ட மனித உணவுப் பொருட்களைப் பொதுவான ‘உணவு’ என்று மாற்றாமல் வைத்திருக்கிறது; ‘திராட்சை மது’ என்பது இச்சூழலில் יַיִן என்பதைக் தெளிவாகக் குறிக்கிறது.
- source_word: אֲמָתֶךָ
  choice: உமது பணிப்பெண்
  rationale: பெண்பாலையும், வீட்டின் தலைவரிடம் பேசும்போது பயன்படுத்தப்படும் தாழ்மையான சமூகச் சொல்லாட்சியையும் நவீன தமிழில் எடுத்துரைக்கிறது.
- source_word: לַנַּעַר עִם עֲבָדֶיךָ
  choice: உமது அடியார்களோடு இருக்கும் இளைஞனுக்கு
  rationale: נַעַר என்பதன் பரந்த ‘இளைஞன்/இளம் உதவியாளர்’ பொருளைக் காக்கிறது; עִם עֲבָדֶיךָ என்ற கடினமான சொற்றொடரைத் திருத்தாமல், பரம்பரையாக வந்த இரண்டாம் நபர் வடிவத்துடன் மொழிபெயர்க்கிறது.
- source_word: אֵין מַחְסוֹר כָּל דָּבָר
  choice: எதுவும் குறைவில்லை
  rationale: முழுமையான போதுமையைச் சுட்டும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
