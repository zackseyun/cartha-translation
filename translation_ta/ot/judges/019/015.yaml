  text: They turned aside there to go in and spend the night at Gibeah[a]. He went in and sat down in the open square of the city[b], and there was no man gathering them into his house to spend the night.
translation:
  language: ta
  text: அவர்கள் கிபியாவுக்குள் சென்று இரவைக் கழிக்க அங்கே வழியை விட்டு விலகினார்கள். அவன் நகரத்துக்குள் சென்று, நகரத்தின் திறந்த வெளியில்[a] உட்கார்ந்தான். அவர்கள் இரவைக் கழிக்க அவர்களைத் தன் வீட்டுக்குள் ஏற்றுக்கொள்ள ஒரு மனிதனும்[b] இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நகரத்தின் தெருவில்”; எபிரெயச் சொல் அகன்ற பொதுவெளியையோ நகரச் சதுக்கத்தையோ குறிக்கவும் முடியும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “ஒரு மனிதனும்”; அதாவது, நகரவாசிகளில் யாரும் அவர்களைத் தம் வீட்டில் தங்க விருந்தோம்ப முன்வரவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֻרוּ
  choice: வழியைவிட்டு விலகி ... திரும்பினார்கள்
  rationale: סור இங்கு பயணப் பாதையிலிருந்து விலகித் திரும்புவதைக் குறிக்கிறது; வெறுமனே நின்றுவிட்டார்கள் என்ற பொருள் அல்ல.
- source_word: לָבוֹא לָלוּן
  choice: உள்ளே சென்று இரவைக் கழிக்க
  rationale: בוא என்பது உள்ளே செல்வதையும், לון என்பது இரவு தங்குவதையும் குறிக்கின்றன; நவீன தமிழில் இயல்பாக இரண்டின் நோக்கத் தொடர்பும் காக்கப்படுகிறது.
- source_word: בַּגִּבְעָה
  choice: கிபியாவுக்குள்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்படுகிறது; நகருக்குள் நுழையும் பயண இயக்கம் தமிழில் தெளிவாக வெளிப்படுகிறது.
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: அவன் நகரத்துக்குள் சென்று ... உட்கார்ந்தான்
  rationale: எபிரெய மூலத்தில் பன்மையிலிருந்து ஒருமைக்கு ஏற்படும் மாற்றம் பாதுகாக்கப்படுகிறது; அந்த ஒருமை குழுவின் தலைமைப் பயணியைக் குறிக்கிறது.
- source_word: בִּרְחוֹב הָעִיר
  choice: நகரத்தின் திறந்த வெளியில்
  rationale: רְחוֹב என்பது குறுகிய தெருவை மட்டுமல்லாமல் அகன்ற பொதுவெளி அல்லது நகரச் சதுக்கத்தையும் குறிக்கலாம்; சூழலுக்கு ஏற்ற பொதுவெளி உணர்வு காக்கப்படுகிறது.
- source_word: וְאֵין אִישׁ
  choice: ஒரு மனிதனும் இல்லை
  rationale: אִישׁ என்ற ஆண்பால் ஒருமைச் சொல்லை மறைக்காமல் தமிழில் நேரடியாகக் கொடுக்கிறது; சூழலில் இது விருந்தோம்ப முன்வரும் குடியிருப்பாளரைக் குறிக்கிறது.
- source_word: מְאַסֵּף אוֹתָם הַבַּיְתָה
  choice: அவர்களைத் தன் வீட்டுக்குள் சேர்த்துக்கொள்ள
  rationale: אסף என்பதன் அடிப்படை ‘சேர்த்துக்கொள்/உள்ளே கொண்டுவா’ என்ற உணர்வையும், பயணிகளுக்கு வீட்டில் விருந்தோம்பல் அளிக்கும் சூழலையும் வெளிப்படுத்துகிறது.
