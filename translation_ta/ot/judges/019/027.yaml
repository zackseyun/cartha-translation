  yaml_path: translation/ot/judges/019/027.yaml
  text: Her master got up in the morning and opened the doors of the house and went out to go on his way[a], and behold, the woman, his concubine, was lying at the entrance of the house, with her hands on the threshold.
translation:
  language: ta
  text: அவளுடைய எஜமான் காலையில் எழுந்து, வீட்டின் கதவுகளைத் திறந்து, தன் வழியே போவதற்காக வெளியே சென்றான். இதோ, அவனுடைய துணைமனைவியான அந்தப் பெண் வீட்டின் வாசலில் கிடந்தாள்[a]; அவளுடைய கைகள் வாசற்படியின்மேல் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இன்னும் நேரடியாக, “விழுந்து கிடந்தாள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֶיהָ
  choice: அவளுடைய எஜமான்
  rationale: ‘அவளுடைய ஆண்டவன்/எஜமான்’ என்பதே எபிரெயச் சொல்லின் நேரடிப் பொருள். இக்கதையில் காணப்படும் சமமற்ற சமூக உறவை ‘எஜமான்’ வெளிப்படுத்துகிறது; ‘கணவன்’ என்று மொழிபெயர்த்து அந்த அம்சத்தை மறைக்கவில்லை.
- source_word: בַּבֹּקֶר
  choice: காலையில்
  rationale: இயல்பான நவீனத் தமிழில் நேரத்தைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: דַּלְתוֹת הַבַּיִת
  choice: வீட்டின் கதவுகள்
  rationale: மூலத்தில் ‘கதவுகள்’ என்பது பன்மையில் இருப்பதால் அது அப்படியே காக்கப்பட்டுள்ளது.
- source_word: וַיֵּצֵא לָלֶכֶת לְדַרְכּוֹ
  choice: தன் வழியே போவதற்காக வெளியே சென்றான்
  rationale: அவன் வெளியே சென்றதன் நோக்கத்தை உணர்த்தும் எபிரெய இறுதிநிலைத் தொடரையும் ‘தன் வழியே போ’ என்ற சொல்லாட்சியையும் காக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: அடுத்து காணப்படும் அதிர்ச்சியான காட்சிக்கு வாசகரின் கவனத்தைத் திடீரெனத் திருப்பும் உரையாடல் குறியீட்டின் வலிமையைத் தக்கவைக்கிறது.
- source_word: הָאִשָּׁה פִילַגְשׁוֹ
  choice: அவனுடைய துணை மனைவியான அந்தப் பெண்
  rationale: ‘அந்தப் பெண்’ மற்றும் ‘அவனுடைய பிலேகேஷ்’ என்ற இணைநிலை அமைப்பை இயல்பான தமிழில் தருகிறது. ‘துணை மனைவி’ என்பது முதன்மை மனைவிக்குச் சமமற்ற நிலையிலிருந்த பெண்ணைக் குறிக்கிறது; இழிவாக ஒலிக்கக்கூடிய சொற்களைத் தவிர்க்கிறது.
- source_word: נֹפֶלֶת
  choice: கிடந்தாள்
  rationale: இங்கு பெண் வாசலில் இருந்த நிலையைக் குறிக்கும் வினையெச்சத்தை இயல்பான தமிழில் தெரிவிக்கிறது. ‘விழுந்து கிடந்தாள்’ என்ற வடிவியல் சார்ந்த வாசிப்பு அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- source_word: פֶּתַח הַבַּיִת
  choice: வீட்டின் வாசலில்
  rationale: வீட்டின் நுழைவிடம் அல்லது திறப்பைக் குறிக்கும் சொல்லுக்கு இயல்பான, காட்சியைத் தெளிவாகக் காட்டும் தமிழ்.
- source_word: וְיָדֶיהָ עַל הַסַּף
  choice: அவளுடைய கைகள் வாசற்படியின்மேல் இருந்தன
  rationale: மூலத்தின் வினையில்லா உட்பிரிவைத் தமிழில் தெளிவான வாக்கியமாக்கி, இரு கைகளும் வாசற்படியின்மேல் இருந்த காட்சியைப் பாதுகாக்கிறது.
