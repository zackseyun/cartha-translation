translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மாமனார்’ என்பவரைக் குறிக்கும் வினைக்கு மரியாதைப் பன்மை பயன்படுத்தப்பட்டாலும், மூல உரையின் நிகழ்வுவரிசையும் கருத்து மாற்றமும் தக்கவைக்கப்பட்டுள்ளன.
