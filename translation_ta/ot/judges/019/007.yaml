  text: וַ/יָּ֥קָם הָ/אִ֖ישׁ לָ/לֶ֑כֶת וַ/יִּפְצַר בּ/וֹ֙ חֹתְנ֔/וֹ וַ/יָּ֖שָׁב וַ/יָּ֥לֶן שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/007.yaml
  text: Then the man got up to go[a], but his father-in-law urged him, so he turned back and spent the night there.
translation:
  language: ta
  text: அப்போது அந்த மனிதன் புறப்பட்டுப் போவதற்காக எழுந்தான். ஆனால் அவனுடைய மாமனார் அவனை விடாமல் வற்புறுத்தினார்[a]. ஆகவே அவன் திரும்பி, அங்கே இரவைக் கழித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனை நெருக்கிக் கேட்டார்’ / ‘அவனை மிகவும் வலியுறுத்திக் கேட்டார்.’ இதற்கான எபிரெய வினைச்சொல், ஒருவர் விடாமல் தொடர்ந்து வற்புறுத்துவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்தான்
  rationale: קום என்பதன் Qal தொடர் வினைவடிவம், கதைநடையில் ஒரு செயலைச் செய்ய எழுவதைக் குறிக்கிறது. அடுத்துவரும் புறப்படுதலுக்கான ஆயத்தச் செயலை ‘எழுந்தான்’ நேரடியாக வெளிப்படுத்துகிறது.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: אִישׁ என்பதன் நேரடிப் பொருள் ‘மனிதன்/ஆண்.’ சூழலில் இது லேவியனைக் குறித்தாலும், மூல உரை உறவுமுறைப் பெயரையோ ‘லேவியன்’ என்ற அடையாளத்தையோ இங்கு பயன்படுத்தவில்லை.
- source_word: לָלֶכֶת
  choice: புறப்பட்டுப் போவதற்காக
  rationale: הלך என்பதன் infinitive construct, קום என்பதற்குப் பின் நோக்கத்தைக் காட்டுகிறது. இச்சூழலில் வெறுமனே நடப்பதைவிட அங்கிருந்து புறப்படுவதையே குறித்தாலும், ‘போ’ என்ற அடிப்படைப் பொருளும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: וַיִּפְצַר בּוֹ
  choice: அவனை விடாமல் வற்புறுத்தினார்
  rationale: פצר என்பது தொடர்ந்து அல்லது தீவிரமாக வலியுறுத்திக் கேட்பதைக் குறிக்கிறது. ‘விடாமல்’ என்பது அதன் தொடர்ச்சியான அழுத்தத்தை இயல்பான தமிழில் காட்டுகிறது; ‘வற்புறுத்தினார்’ என்பதால் அவர் கட்டாயப்படுத்தினார் என்று அவசியமாகத் தீர்மானிக்கப்படவில்லை.
- source_word: חֹתְנוֹ
  choice: அவனுடைய மாமனார்
  rationale: חתן சார்ந்த இந்த உறவுமுறைச் சொல் சூழலின்படி திருமண உறவினரைக் குறிக்கலாம். இங்கு அது அந்தப் பெண்ணின் தந்தையை, அந்த மனிதனுடன் உள்ள உறவின் அடிப்படையில் குறிக்கிறது; எனவே ‘மாமனார்’ துல்லியமான இயல்புத் தமிழ்.
- source_word: וַיָּשָׁב
  choice: அவன் திரும்பி
  rationale: שׁוב என்பது திரும்புதல் அல்லது மீண்டும் வருதலைக் குறிக்கிறது. அவன் புறப்பட எழுந்தபின் தனது முடிவை மாற்றித் திரும்பியதை இச்சொல் வெளிப்படுத்துகிறது.
- source_word: וַיָּלֶן שָׁם
  choice: அங்கே இரவைக் கழித்தான்
  rationale: לון என்பது ஓரிடத்தில் இரவு தங்குவதைக் குறிக்கிறது. ‘அங்கே இரவைக் கழித்தான்’ என்பது காலச்சார்ந்த பொருளை தெளிவாகவும் இயல்பாகவும் தருகிறது.
