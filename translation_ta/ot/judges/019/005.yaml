  text: וַֽ/יְהִי֙ בַּ/יּ֣וֹם הָ/רְבִיעִ֔י וַ/יַּשְׁכִּ֥ימוּ בַ/בֹּ֖קֶר וַ/יָּ֣קָם לָ/לֶ֑כֶת וַ/יֹּאמֶר֩ אֲבִ֨י הַֽ/נַּעֲרָ֜ה אֶל חֲתָנ֗/וֹ סְעָ֧ד לִבְּ/ךָ֛ פַּת לֶ֖חֶם וְ/אַחַ֥ר תֵּלֵֽכוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/005.yaml
  text: On the fourth day[a], they rose early in the morning, and he got up to go. But the young woman’s father said to his son-in-law, “Refresh your heart with a morsel of bread[b], and afterward you may go.”
translation:
  language: ta
  text: நான்காம் நாளில் அவர்கள் அதிகாலையில் எழுந்தார்கள்; அவன் புறப்படுவதற்காக எழுந்தான். அப்போது அந்த இளம் பெண்ணின் தகப்பன் தன் மருமகனிடம், “கொஞ்சம் அப்பம் சாப்பிட்டு உன்னைத் தெம்பூட்டிக்கொள்[a]; அதற்குப் பிறகு நீங்கள் புறப்படலாம்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “கொஞ்சம் அப்பத்தால் உன் இருதயத்தைப் பலப்படுத்திக்கொள்.” இது உணவு உண்டு தன்னைத் தேற்றிக்கொள்வதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “நீங்கள் புறப்படலாம்” என்பதற்கான எபிரெய வினை பன்மையில் உள்ளது. தகப்பன் மருமகனிடம் நேரடியாகப் பேசினாலும், இது பயணம் செய்யவிருந்த அனைவரையும் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: நான்காம் நாளில்
  rationale: எபிரெயத் தொடரின் நேரடியான காலக் குறிப்பை, உரையில் இல்லாத கூடுதல் தகவல் ஏதும் சேர்க்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: அவர்கள் அதிகாலையில் எழுந்தார்கள்
  rationale: பன்மை வினையையும் சீக்கிரமாக எழுந்தனர் என்ற பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַיָּקָם לָלֶכֶת
  choice: அவன் புறப்படுவதற்காக எழுந்தான்
  rationale: ஒருமைக்கு மாறும் எபிரெய வினையையும், செல்லும் நோக்குடன் எழுந்தான் என்பதையும் வெளிப்படுத்துகிறது.
- source_word: אֲבִי הַנַּעֲרָה
  choice: அந்த இளம் பெண்ணின் தகப்பன்
  rationale: נַעֲרָה என்பதை வயதுக்கேற்ற நவீன தமிழில் ‘இளம் பெண்’ எனத் தருகிறது; ‘தகப்பன்’ கதைநடையின் கண்ணியமான பதிவுக்கு ஏற்றது.
- source_word: חֲתָנוֹ
  choice: தன் மருமகனிடம்
  rationale: இச்சூழலில் தகப்பனுக்கும் லேவியனுக்கும் இடையிலான உறவை இயல்பான தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: סְעָד לִבְּךָ
  choice: உன்னைத் தெம்பூட்டிக்கொள்
  rationale: சொல்லுக்கு சொல் ‘உன் இருதயத்தைப் பலப்படுத்து’ என்றாலும், இங்கு உணவு உண்டு உடலைத் தேற்றிக்கொள்வதைக் குறிக்கும் மரபுத்தொடரை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: פַּת לֶחֶם
  choice: கொஞ்சம் அப்பம் சாப்பிட்டு
  rationale: ‘ஒரு துண்டு அப்பம்’ என்ற உருவகத்தை முற்றிலும் பொதுமைப்படுத்தாமல், சிறிதளவு உணவு உண்ணும் விருந்தோம்பல் அழைப்பை இயல்பாகத் தருகிறது.
- source_word: וְאַחַר תֵּלֵכוּ
  choice: அதற்குப் பிறகு நீங்கள் புறப்படலாம்
  rationale: இறுதி வினையின் பன்மையை வெளிப்படையாகப் பாதுகாத்து, பயணக் குழுவைச் சுட்டுகிறது; சூழலின் அனுமதிப் பொருளையும் தருகிறது.
