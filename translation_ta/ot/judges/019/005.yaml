translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் ஒருமையிலிருந்து பன்மைக்கு நிகழும் மாற்றம் பாதுகாக்கப்பட்டுள்ளது. ‘இருதயத்தைப் பலப்படுத்து’ என்ற நேரடி மரபுத்தொடர் முதன்மை உரையில் இயல்பான பொருளாகத் தரப்பட்டு, அதன் சொற்பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
