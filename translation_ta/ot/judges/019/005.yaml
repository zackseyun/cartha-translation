  source_fidelity: மூல எபிரெயத்தின் காலக் குறிப்பு, அதிகாலையில் எழுந்த பன்மை வினை, லேவியரைக் குறிக்கும் ஒருமை வினை, தகப்பன்–மருமகன் உறவு, உணவு மூலம் வலிமை பெறச் சொல்லும் மரபுத்தொடர், இறுதியில் வரும் பன்மை வினை ஆகியவை சரியாகப் பாதுகாக்கப்பட்டுள்ளன. “கொஞ்சம் அப்பம் சாப்பிட்டு உன்னைத் தெம்பூட்டிக்கொள்” என்பது סְעָד לִבְּךָ மற்றும் פַּת לֶחֶם ஆகியவற்றின் சூழல்சார் பொருளை இயல்பாகத் தருகிறது.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. “தகப்பன்,” “மருமகன்,” “அப்பம்” ஆகியவை வேதாகமக் கதைநடைக்கு ஏற்ற, புரிந்துகொள்ளத்தக்க சொற்கள். ஒருமை அழைப்பிலிருந்து பன்மை “நீங்கள் புறப்படலாம்” என மாறுவது மூலத்தின் கவனிக்கத்தக்க அம்சத்தைச் சீராக வெளிப்படுத்துகிறது.
  terminology: “இளம் பெண்,” “தகப்பன்,” “மருமகன்,” “அப்பம்,” “புறப்படலாம்” ஆகிய தெரிவுகள் சூழலுக்கும் பதிவுக்கும் பொருத்தமானவை. இறுதிப் பன்மையை விளக்கும் அடிக்குறிப்பு சரியான இடத்தில் இணைக்கப்பட்டுள்ளது; முதல் அடிக்குறிப்பு மரபுத்தொடரின் சொற்பொருளையும் பொருள்விளக்கத்தையும் துல்லியமாகத் தருகிறது.
