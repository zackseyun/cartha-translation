base_translation:
  language: en
  yaml_path: translation/ot/judges/019/014.yaml
  text: So they passed on and went their way[a], and the sun set on them near Gibeah, which belongs to Benjamin.
translation:
  language: ta
  text: அவர்கள் அதைக் கடந்து தொடர்ந்து சென்றார்கள். பென்யமீனுக்குரிய கிபியாவுக்கு அருகே சூரியன் மறையும் நேரம் அவர்களை எட்டியது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பென்யமீன் பிரதேசத்தில் இருந்த.” எபிரெயத் தொடர், கிபியா பென்யமீன் கோத்திரத்தோடு அல்லது அதன் நிலப்பரப்போடு தொடர்புடையது என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: அவர்கள் அதைக் கடந்து
  rationale: עבר என்னும் வினை, முந்தைய இடத்தில் தங்காமல் அதைக் கடந்து பயணத்தைத் தொடர்ந்ததை இச்சூழலில் குறிக்கிறது. ‘அதைக் கடந்து’ என்பது அந்தக் கதைத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֵּלֵכוּ
  choice: தொடர்ந்து சென்றார்கள்
  rationale: הלך என்பது ‘செல்/நட’ என்னும் பொதுவான வினை. முந்தைய இயக்க வினையுடன் ஒன்றாக்காமல், பயணம் தொடர்ந்ததை நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: וַתָּבֹא לָהֶם הַשֶּׁמֶשׁ
  choice: அவர்கள் வந்தபோது சூரியன் மறைந்தது
  rationale: சொல்லுக்குச் சொல் ‘சூரியன் அவர்களிடம்/அவர்களுக்காக வந்தது’ என்ற எபிரெய மரபுத்தொடர், பயணத்தின்போது சூரிய மறைவு அவர்களை எட்டியதைக் குறிக்கிறது. தமிழில் ‘சூரியன் மறைந்தது’ என்பது இயல்பான இணை; ‘வந்தபோது’ என்பது அவர்கள் அப்போது கிபியாவுக்கு அருகில் இருந்த இடத்தொடர்பைத் தெளிவாக்குகிறது.
- source_word: אֵצֶל
  choice: அருகே
  rationale: இந்த முன்னிடைச்சொல் அண்மையைக் குறிக்கிறது; பயணச் சூழலில் ‘அருகே’ தெளிவான நவீன தமிழ்.
- source_word: הַגִּבְעָה
  choice: கிபியா
  rationale: இந்தச் சொல் பொதுவாக ‘குன்று’ என்று பொருள்படக்கூடியதாயினும், இங்கு பென்யமீனோடு இணைக்கப்பட்ட ஊர்ப்பெயராக வருகிறது. எனவே ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: பென்யமீனுக்குச் சேர்ந்த
  rationale: இந்த எபிரெயத் தொடர் கிபியாவின் கோத்திர அல்லது நிலப்பரப்பு சார்பைச் சுட்டுகிறது. ‘சேர்ந்த’ என்பது உடைமை மற்றும் தொடர்பு ஆகிய இரு நுணுக்கங்களையும் சுருக்கமாகத் தருகிறது; ‘பென்யமீன் பிரதேசத்தில் இருந்த’ என்பது சாத்தியமான மாற்று.
- source_word: בִנְיָמִן
  choice: பென்யமீன்
  rationale: கோத்திரத்தின் தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது.
