translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்திலுள்ள தொடர்ச்சியான இரு இயக்க வினைகளும் ‘அதைக் கடந்து தொடர்ந்து சென்றார்கள்’ என்று வேறுபாடு மங்காதவாறு இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளன. இடப்பெயரும் கோத்திரப்பெயரும் தமிழ் வேதாகம வழக்குக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளன.
