  source_fidelity: 'முக்கிய உரை எபிரெய மூலத்தின் பொருளைச் சரியாகக் கொடுக்கிறது: துணைவியின் பாலியல்/மணவுறவு உண்மையின்மை, அவனிடமிருந்து புறப்படுதல், யூதாவிலுள்ள பெத்லெகேமில் தந்தையின் வீட்டில் நான்கு மாதங்கள் தங்குதல் ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் ‘மறுமனைவி’ என்பது மறுமணம் செய்த பெண் என்ற பொருளையும் தரக்கூடியதால் פִּילַגְשׁוֹ என்பதன் குறைந்தநிலை அங்கீகரிக்கப்பட்ட துணைவி என்ற சமூகப் பங்கிற்கு துல்லியமில்லை.'
  naturalness: உரை நவீன தமிழில் இயல்பாக உள்ளது. இருப்பினும் ‘துணைமனைவி’ என்பது இச்சூழலில் தெளிவானதும் நடுநிலையானதும் ஆகும். இடப்பெயர் மற்றும் தந்தையின் வீடு தொடர்பைச் சற்றே தெளிவாக அமைத்துள்ளேன்.
