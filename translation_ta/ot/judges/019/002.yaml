source:
  edition: WLC
  text: וַ/תִּזְנֶ֤ה עָלָי/ו֙ פִּֽילַגְשׁ֔/וֹ וַ/תֵּ֤לֶךְ מֵֽ/אִתּ/וֹ֙ אֶל בֵּ֣ית אָבִ֔י/הָ אֶל בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וַ/תְּהִי שָׁ֕ם יָמִ֖ים אַרְבָּעָ֥ה חֳדָשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/002.yaml
  text: But his concubine was unfaithful to him[a], and she went away from him to her father's house, to Bethlehem in Judah, and was there for four months.
translation:
  language: ta
  text: ஆனால், அவனுடைய துணைமனைவி அவனுக்கு உண்மையற்றவளாக நடந்துகொண்டாள்[a]. அவள் அவனைவிட்டுப் பிரிந்து, யூதாவிலுள்ள பெத்லெகேமில் உள்ள தன் தந்தையின் வீட்டுக்குச் சென்றாள்; அங்கே நான்கு மாதங்கள் இருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “அவனுக்கு எதிராக விபச்சாரம் செய்தாள்.” சில பழங்கால விளக்கவுரையாளர்கள் இச்சொற்றொடரை “அவன்மீது கோபமடைந்தாள்” அல்லது “அவனுடன் சண்டையிட்டாள்” என்று வேறுவிதமாகப் புரிந்துகொண்டனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְנֶה
  choice: உண்மையற்றவளாக நடந்துகொண்டாள்
  rationale: זנה என்ற வினை பொதுவாக பாலியல் அல்லது மணவுறவு சார்ந்த உண்மையின்மையைக் குறிக்கிறது. வணிக விபச்சாரத்தைத் தேவையின்றி குறிப்பாக்காமல், இச்சூழலில் உள்ள உறவுத் துரோகத்தை இயல்பான நவீன தமிழில் இச்சொற்றொடர் தெரிவிக்கிறது.
- source_word: עָלָיו
  choice: அவனுக்கு
  rationale: זנה என்பதுடன் வரும் על, ஒருவருக்கு எதிராக அல்லது அவரிடம் காட்டப்படும் உண்மையின்மையைக் குறிக்கலாம். ‘உண்மையற்றவளாக’ என்பதுடன் ‘அவனுக்கு’ என்பது தமிழில் இயல்பாக அமைகிறது.
- source_word: פִּילַגְשׁוֹ
  choice: அவனுடைய மறுமனைவி
  rationale: פילגש என்பது அங்கீகரிக்கப்பட்டிருந்தாலும் முதன்மை மனைவியைவிடக் குறைந்த சமூக நிலை கொண்ட துணைவியைக் குறிக்கிறது. ‘மறுமனைவி’ என்பது இவ்வகை இரண்டாம் நிலை மணவுறவை, இன்றைய வாசகர்களுக்கு புரியத்தக்க மதிப்புமிக்க தமிழில் தெரிவிக்கிறது.
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: அவனைவிட்டுப் பிரிந்து ... சென்றாள்
  rationale: இச்சொற்றொடர் உடல்ரீதியான புறப்பாட்டையும் உறவிலிருந்து விலகுதலையும் வெளிப்படுத்துகிறது; தமிழ் வாக்கிய ஓட்டத்திற்கேற்ப ‘பிரிந்து ... சென்றாள்’ என்று வழங்கப்பட்டுள்ளது.
- source_word: אֶל בֵּית אָבִיהָ
  choice: தன் தந்தையின் வீட்டுக்கு
  rationale: குடும்ப இல்லத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: אֶל בֵּית לֶחֶם יְהוּדָה
  choice: யூதாவிலுள்ள பெத்லெகேமில்
  rationale: யூதா பிரதேசத்தில் அமைந்த பெத்லெகேம் நகரைத் தெளிவாக அடையாளப்படுத்துகிறது.
- source_word: וַתְּהִי שָׁם
  choice: அங்கே ... இருந்தாள்
  rationale: ‘அங்கே இருந்தாள்’ என்ற மூலத்தின் எளிய கதையாடல் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: יָמִים אַרְבָּעָה חֳדָשִׁים
  choice: நான்கு மாதங்கள்
  rationale: சொல்லுக்கு சொல் ‘நாட்கள்—நான்கு மாதங்கள்’ எனத் தோன்றும் எபிரெய கால அளவு மரபுத்தொடரின் பொருள் நான்கு மாதங்கள் என்பதாகும்.
theological_decisions:
- issue: וַתִּזְנֶה என்ற ஒழுக்கரீதியாகக் கடுமையான சொல்லின் விளக்கம்
  choice: பாலியல்/மணவுறவு சார்ந்த உண்மையின்மை (‘உண்மையற்றவளாக நடந்துகொண்டாள்’)
  alternative: ‘விபச்சாரியைப்போல் நடந்துகொண்டாள்’; அல்லது சில பழங்கால விளக்க மரபுகளின்படி ‘அவன்மீது கோபமடைந்தாள் / அவனுடன் சண்டையிட்டாள்’
  rationale: மசோரா உயிர்க்குறிகளும் זנה என்பதன் வழக்கமான சொற்பொருளும் பாலியல் உண்மையின்மையை ஆதரிக்கின்றன. எனினும் குற்றச்சாட்டின் தன்மையை வேறுவிதமாகப் புரிந்துகொண்ட பழங்கால மரபு இருப்பதால், அந்தத் தெளிவின்மை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ஒழுக்கரீதியான குற்றச்சாட்டை மென்மையாக்காமல், அதேவேளையில் ‘விபச்சாரம்’ என்ற சொல்லால் வணிக பாலுறவைத் தேவையின்றி குறிப்பாக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
