base_translation:
  language: en
  yaml_path: translation/ot/judges/019/020.yaml
  text: The old man said[a], “Peace be to you. Only let all your needs be my responsibility; only do not spend the night in the open square.”
translation:
  language: ta
  text: அந்த முதியவர், “உமக்குச் சமாதானம் உண்டாவதாக. உமக்குத் தேவையான எல்லாவற்றுக்கும் நான் பொறுப்பு; திறந்த வெளியில் உள்ள சதுக்கத்தில்[a] மட்டும் இரவைக் கழிக்காதீர்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லை “தெருவில்” என்றும் மொழிபெயர்க்கலாம். ஆனால் அது நகருக்குள் உள்ள பொதுவான திறந்த வெளி அல்லது சதுக்கத்தை இன்னும் குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ הַזָּקֵן
  choice: அந்த முதியவர்
  rationale: பெயர்ச்சொல்–பெயரடை அமைப்பை இயல்பான நவீனத் தமிழில் மரியாதையான கதைநடைச் சொல்லாக வழங்குகிறது.
- source_word: שָׁלוֹם לָךְ
  choice: உமக்குச் சமாதானம் உண்டாவதாக
  rationale: வரவேற்பும் நலவாழ்த்தும் கலந்த எபிரெயச் சொற்றொடரின் ‘சமாதானம்’ என்ற அடிப்படைப் பொருளைக் காக்கிறது.
- source_word: רַק
  choice: ஆனால் … மட்டும்
  rationale: இருமுறை வரும் துகளின் வரம்பிடும் மற்றும் எதிர்மறைத் திருப்பம் தரும் செயல்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது; முதல் occurrence தனியே மொழிபெயர்க்கப்படாமல் பொறுப்பேற்கும் வாக்கிய அமைப்பில் உட்பொருளாகிறது.
- source_word: כָּל מַחְסוֹרְךָ
  choice: உமக்குத் தேவையான அனைத்தையும்
  rationale: ‘உம்முடைய எல்லாக் குறைவும்’ என்ற சொற்பொருளை விருந்தோம்பல் சூழலுக்கேற்ற தெளிவான தமிழில் தருகிறது.
- source_word: עָלַי
  choice: நான் பார்த்துக்கொள்கிறேன்
  rationale: சொல்லுக்கு சொல் ‘என்மேல்’ என்பதன் பொறுப்பேற்பு சார்ந்த மொழிப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בָּרְחוֹב
  choice: திறந்த வெளியிலுள்ள நகரச் சதுக்கத்தில்
  rationale: இது வெறும் சாலை அல்லாமல் நகருக்குள் உள்ள பொதுவான திறந்த வெளி அல்லது சதுக்கத்தைக் குறிக்கிறது.
- source_word: אַל תָּלַן
  choice: இரவைக் கழிக்காதீர்
  rationale: அங்கே இரவு தங்க வேண்டாம் என்ற தடை கட்டளையைத் தெளிவாகவும் கண்ணியமாகவும் வழங்குகிறது.
