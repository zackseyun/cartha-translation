translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான வேதாகமக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. உரையாடலில் ஒருமை மரியாதை வடிவமான ‘உமக்கு/உமக்குத்’ மற்றும் ‘கழிக்காதீர்’ பயன்படுத்தப்பட்டுள்ளன. அடிக்குறிப்புக் குறி தொடர்புடைய ‘நகரச் சதுக்கத்தில்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
