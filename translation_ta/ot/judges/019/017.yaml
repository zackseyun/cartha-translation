  source_fidelity: மூல எபிரெயத்தில் முதியவர் கண்களை உயர்த்திப் பார்த்து, நகரத்தின் பொது வெளியில் இருந்த பயணியைக் காண்கிறார்; பின்னர் அவர் இரண்டு கேள்விகளைச் சொல்கிறார். ‘நகரச் சதுக்கம்,’ ‘பயணி,’ மற்றும் இரு வினாக்களும் மூலத்தின் பொருளைத் துல்லியமாகக் காக்கின்றன. ஆனால் וַיֹּאמֶר என்பதன் அடிப்படை வினை ‘சொன்னார்/என்றார்’; ‘கேட்டார்’ என்பது கேள்வி வடிவத்தால் நியாயமானதாக இருந்தாலும், மூல வினையைச் சிறிது விளக்கமாக மாற்றுகிறது.
