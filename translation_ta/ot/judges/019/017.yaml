  yaml_path: translation/ot/judges/019/017.yaml
  text: He looked up and saw the traveler in the open square of the city[a], and the old man said, “Where are you going[b], and where do you come from?”
translation:
  language: ta
  text: அவர் ஏறிட்டுப் பார்த்து, நகரச் சதுக்கத்தில் இருந்த பயணியைக்[a] கண்டார். அந்த முதியவர், “நீ எங்கே போகிறாய்? எங்கிருந்து வருகிறாய்?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “வழிப்போக்கனை.” எபிரெயச் சொல் பயணம் செய்பவரைக் குறிக்கிறது; விருந்தோம்பல் சூழலில் அது விருந்தினரையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: அவர் ஏறிட்டுப் பார்த்தபோது
  rationale: ‘தன் கண்களை உயர்த்தினார்’ என்ற எபிரெய மரபுத்தொடரை, பார்வையை உயர்த்திப் பார்த்த செயலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיַּרְא
  choice: கண்டார்
  rationale: இங்கு அடிப்படையான பார்வையுணர்வே குறிக்கப்படுகிறது; ‘கவனித்தார்’ என்பதைக் காட்டிலும் ‘கண்டார்’ நேரடியானது.
- source_word: הָאִישׁ הָאֹרֵחַ
  choice: பயணியை
  rationale: אֹרֵחַ பயணம் செய்பவரைக் குறிக்கிறது. ‘பயணி’ நவீன தமிழில் தெளிவானது; ‘விருந்தினர்’ என்பது இன்னும் ஏற்பளிக்கப்படாத விருந்தோம்பல் நிலையைக் கூடுதலாக உணர்த்தும்.
- source_word: בִּרְחֹב הָעִיר
  choice: நகரச் சதுக்கத்தில்
  rationale: רְחוֹב என்பது பொதுவாக அகன்ற பொது வெளியையோ சதுக்கத்தையோ குறிக்கிறது; சாதாரண குறுகிய தெரு என்ற எண்ணத்தைத் தவிர்க்க ‘நகரச் சதுக்கம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הָאִישׁ הַזָּקֵן
  choice: அந்த முதியவர்
  rationale: முன்னரே குறிப்பிடப்பட்ட வயதான மனிதரை இயல்பாகவும் மரியாதையான நவீன தமிழ் நடையிலும் அடையாளப்படுத்துகிறது.
- source_word: אָנָה תֵלֵךְ
  choice: நீ எங்கே போகிறாய்?
  rationale: இலக்கை விசாரிக்கும் கேள்வியை உரையாடலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: וּמֵאַיִן תָּבוֹא
  choice: எங்கிருந்து வருகிறாய்?
  rationale: பயணத்தின் தொடக்க இடத்தை விசாரிக்கும் எபிரெயச் சொற்றொடரின் ‘எங்கிருந்து’ என்ற திசைநுட்பத்தைத் தெளிவாகக் காக்கிறது.
