base_translation:
  language: en
  yaml_path: translation/ot/judges/019/030.yaml
  text: And everyone who saw it said[a], “Nothing like this has happened or been seen from the day the sons of Israel came up from the land of Egypt until this day. Consider it, take counsel, and speak.”
translation:
  language: ta
  text: அதைக் கண்ட ஒவ்வொருவரும், “இஸ்ரவேலின் மகன்கள்[a] எகிப்து நாட்டிலிருந்து புறப்பட்டு வந்த நாள் முதல் இந்நாள்வரை, இப்படிப்பட்ட ஒன்று நடந்ததும் இல்லை, காணப்பட்டதும் இல்லை. இதைக் குறித்து நன்கு சிந்தியுங்கள்; ஆலோசனை செய்யுங்கள்; பேசுங்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “இஸ்ரவேலர்” அல்லது “இஸ்ரவேலின் பிள்ளைகள்.”
    reason: בְּנֵי יִשְׂרָאֵל என்பது சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றும், வழக்கமான இனப்பெயராக ‘இஸ்ரவேலர்’ என்றும் மொழிபெயர்க்கப்படலாம்.
lexical_decisions:
- source_word: וְהָיָה כָל הָרֹאֶה וְאָמַר
  choice: அதைக் கண்ட ஒவ்வொருவரும் ... என்றார்கள்
  rationale: וְהָיָה இங்கு ஒரு புதிய நிகழ்வைத் தனியாக அறிமுகப்படுத்துவதைவிட, அதன் விளைவாக ஏற்பட்ட பொதுவான எதிர்வினையை முன்வைக்கிறது. எபிரேய ஒருமை வடிவங்கள் பொதுப்படையான ‘ஒவ்வொருவரும்’ என்ற பொருளைக் கொண்டதால், தமிழில் இயல்பாகப் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֹא נִהְיְתָה וְלֹא נִרְאֲתָה כָּזֹאת
  choice: இப்படிப்பட்ட ஒன்று நடந்ததும் இல்லை, காணப்பட்டதும் இல்லை
  rationale: ‘நடத்தல்’ மற்றும் ‘காணப்படுதல்’ ஆகிய இரு இணை வினைகளையும் தக்கவைத்து, இச்சம்பவம் முற்றிலும் முன்னுதாரணமற்றது என்ற வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: לְמִיּוֹם עֲלוֹת בְּנֵי יִשְׂרָאֵל מֵאֶרֶץ מִצְרַיִם
  choice: இஸ்ரவேலின் மகன்கள் எகிப்து நாட்டிலிருந்து புறப்பட்டு வந்த நாள் முதல்
  rationale: עֲלוֹת என்பதன் வெளியேறுதல்/மேலே வருதல் சார்ந்த இயக்கத்தை ‘புறப்பட்டு வந்த’ என்று இயல்பான தமிழில் காட்டுகிறது; בְּנֵי יִשְׂרָאֵל என்பதன் வடிவத்தை ‘இஸ்ரவேலின் மகன்கள்’ என்று நெருக்கமாகத் தக்கவைக்கிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை
  rationale: கதைசொல்லியின் தற்போதைய காலம் வரையிலான முழுக் காலவெளியையும் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: שִׂימוּ לָכֶם עָלֶיהָ
  choice: இதைக் குறித்து நன்கு சிந்தியுங்கள்
  rationale: சொல்லுக்குச் சொல் அமைப்பில் ‘உங்கள்மேல் வைத்துக்கொள்ளுங்கள்’ என்றாலும், இச்சூழலில் மனத்தில் வைத்து தீவிரமாக ஆராயுமாறு அழைக்கும் எபிரேய மரபுத்தொடரின் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: עֻצוּ
  choice: ஒன்றுகூடி ஆலோசியுங்கள்
  rationale: தனிப்பட்ட சிந்தனையை மட்டும் அல்லாமல், சமூகமாகக் கலந்து ஆலோசித்து ஒரு முடிவை நோக்கிச் செல்லும் கட்டளையின் நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: וְדַבֵּרוּ
  choice: பேசுங்கள்
  rationale: எதைப் பேச வேண்டும் என்று மூலத்தில் குறிப்பிடப்படாததால், அதன் சுருக்கத்தையும் திறந்த தன்மையையும் தீர்மானிக்காமல் தக்கவைக்கிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்; இஸ்ரவேலின் பிள்ளைகள்
  rationale: எபிரேயச் சொற்றொடரின் இலக்கண வடிவத்தை முதன்மை உரையில் தக்கவைக்கிறது. அதேவேளையில், இது முழு இனத்தையும் குறிக்கும் வழக்கமான இனப்பெயராகவும் பயன்படுவதால், இயல்பான மாற்று மொழிபெயர்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், அதிர்ச்சியும் பொதுவான ஆலோசனைக்கான அழைப்பும் வெளிப்படும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இறுதி மூன்று கட்டளைகளின் சுருக்கமான, தீவிரமான ஓசை இயன்றவரை தக்கவைக்கப்பட்டுள்ளது.
