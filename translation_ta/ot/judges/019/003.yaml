  register: நவீன நிலையான தமிழ்; இயல்பான, கண்ணியமான நடையில் எபிரெய மரபுத்தொடரின் உருவகத்தையும் உரைச் சிக்கலையும் அடிக்குறிப்பின் மூலம் பாதுகாக்கிறது. ‘தகப்பன்’ என்பது வேதாகமப் பதிவுக்கேற்ற கண்ணியமான பொதுநடைச் சொலாகப் பயன்படுத்தப்பட்டுள்ளது.
