base_translation:
  language: en
  yaml_path: translation/ot/judges/019/003.yaml
  text: Then her husband arose and went after her to speak to her heart and bring her back[a]. His young servant was with him, along with a pair of donkeys. She brought him into her father’s house, and when the young woman’s father saw him[b], he rejoiced to meet him.
translation:
  language: ta
  text: அப்போது அவளுடைய கணவன் எழுந்து, அவளிடம் கனிவாகப் பேசி[a] அவளைத் திரும்ப அழைத்து வருவதற்காக[b] அவளைப் பின்தொடர்ந்து சென்றான். அவனுடன் அவனுடைய இளம் பணியாளனும் ஒரு ஜோடி கழுதைகளும் இருந்தன. அவள் அவனைத் தன் தந்தையின் வீட்டுக்கு அழைத்துச் சென்றாள். அந்த இளம் பெண்ணின் தந்தை அவனைக் கண்டபோது, அவனைச் சந்தித்ததில் மகிழ்ச்சியடைந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவளுடைய இருதயத்தோடு பேச” என்று உள்ளது; இது கனிவாகப் பேசுவதையோ இணங்கச் செய்யும் விதத்தில் பேசுவதையோ குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: “திரும்ப அழைத்து வர” என்பதற்கான எபிரெய வடிவம் உரைரீதியாகச் சிக்கலானது; அவன் அந்தப் பெண்ணைத் திரும்ப அழைத்து வர எண்ணினான் என்று சூழல் காட்டுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: אִישָׁהּ
  choice: அவளுடைய கணவன்
  rationale: சொல்லுக்கு நேராக ‘அவளுடைய ஆண்’ என்றாலும், இங்குள்ள திருமண உறவுச் சூழலில் இயல்பான பொருள் ‘அவளுடைய கணவன்’ என்பதே.
- source_word: אַחֲרֶיהָ
  choice: அவளைத் தொடர்ந்து
  rationale: ஒருவரைப் பின்தொடர்ந்து செல்வதைக் குறிக்கும்; நவீன தமிழில் ‘அவளைத் தொடர்ந்து சென்றான்’ என்பது இயல்பாக உள்ளது.
- source_word: לְדַבֵּר עַל־לִבָּהּ
  choice: அவளுடைய மனதோடு பேசி
  rationale: ‘அவளுடைய இருதயத்தின்மேல் பேச’ என்ற எபிரெய மரபுத்தொடரின் உருவகத் தன்மையை ஓரளவு காத்து, கனிவாக அல்லது இணங்கச் செய்யும் விதத்தில் பேசுதல் என்ற பொருளைத் தருகிறது.
- source_word: ל/השיב/ו
  choice: அவளைத் திரும்ப அழைத்து வருவதற்காக
  rationale: எழுத்துவடிவத்தில் ஆண்பால் ஒருமை பின்னொட்டு காணப்படுவதால் உரை சிக்கலானது; சூழல், அவன் அந்தப் பெண்ணைத் திரும்ப அழைத்து வர எண்ணியதைக் காட்டுகிறது.
- source_word: נַעֲרוֹ
  choice: அவனுடைய இளம் பணியாளன்
  rationale: נַעַר என்பது இளைஞனையோ பணியாளனையோ குறிக்கலாம்; பயணத்தில் உடன் வருகிறவன் என்பதால் வயதும் பணியும் பிரதிபலிக்கின்றன.
- source_word: צֶמֶד חֲמֹרִים
  choice: இரண்டு கழுதைகள்
  rationale: צֶמֶד ஒரு ஜோடியைக் குறிக்கிறது. தமிழில் ‘இரண்டு கழுதைகள்’ இயல்பானது; அவை நுகத்தால் இணைக்கப்பட்டிருந்தன என்று தேவையின்றி குறிப்பதில்லை.
- source_word: וַתְּבִיאֵהוּ
  choice: அவள் அவனை ... அழைத்துச் சென்றாள்
  rationale: பெண்பால் ஒருமை வினைச்சொல்லின் எழுவாய் அந்தப் பெண்; அவள் அவனைத் தகப்பனுடைய வீட்டுக்குள் கூட்டிச் சென்றாள் என்பதே நேரான பொருள்.
- source_word: הַנַּעֲרָה
  choice: அந்த இளம் பெண்
  rationale: இவ்வாக்கியத்தில் பயன்படுத்தப்பட்டுள்ள சொல் இளம் பெண்ணைக் குறிக்கிறது; சூழலிலுள்ள வேறு உறவுப்பெயரை இங்கே புகுத்தவில்லை.
- source_word: וַיִּשְׂמַח לִקְרָאתוֹ
  choice: அவனைச் சந்தித்ததில் மகிழ்ச்சியடைந்தான்
  rationale: அவனை எதிர்கொண்டு சந்திப்பதுடன் தொடர்புடைய மகிழ்ச்சியை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
