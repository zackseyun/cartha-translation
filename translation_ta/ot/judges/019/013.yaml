translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மூலத்தின் கூட்டு அழைப்பும் பயணச் சூழலும் காக்கப்பட்டுள்ளன; נַעַר மற்றும் הלך ஆகியவற்றின் உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
