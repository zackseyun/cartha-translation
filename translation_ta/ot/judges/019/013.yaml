source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לְ/נַעֲר֔/וֹ לְךָ֥ וְ/נִקְרְבָ֖ה בְּ/אַחַ֣ד הַ/מְּקֹמ֑וֹת וְ/לַ֥נּוּ בַ/גִּבְעָ֖ה א֥וֹ בָ/רָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/013.yaml
  text: He said to his young man[a], “Come, and let us draw near to one of these places[b], and spend the night in Gibeah or in Ramah.”
translation:
  language: ta
  text: அவன் தன் உதவியாளனிடம்[a], “வா[b], இந்த இடங்களில் ஒன்றை நெருங்கிச் சென்று, கிபியாவிலோ ராமாவிலோ இரவைக் கழிப்போம்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உதவியாளன்’ என்பதை ‘இளைஞன்’ அல்லது ‘பணியாளன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல்லின் நேரடிப் பொருள் ‘செல்’; இங்கு இருவரும் சேர்ந்து செல்லும்படியான அழைப்பாக இருப்பதால் ‘வா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ
  choice: தன் உதவியாளனிடம்
  rationale: נַעַר என்பது இளைஞன், பணியாளன், உடன்செல்பவன் ஆகிய பொருள்களைக் குறிக்கலாம். இச்சூழலில் லேவியனோடு பயணம் செய்த ஆண் உதவியாளனைக் குறிப்பதால், ‘உதவியாளன்’ என்பது அவனது பங்கை இயல்பாகத் தெரிவிக்கிறது; வயதையோ அடிமை நிலையையோ தேவையின்றி உறுதிப்படுத்துவதில்லை.
- source_word: לְךָ
  choice: வா
  rationale: הלך என்பதன் கட்டளை வடிவம் சொற்பொருளில் ‘செல்’ என்றாலும், தொடர்ந்து வரும் முதலாம் நபர் பன்மை விருப்பவினையுடன் சேர்ந்து கூட்டாகப் புறப்படும்படி அழைக்கிறது. தமிழில் ‘வா’ என்பது இந்தக் கூட்டு அழைப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְנִקְרְבָה
  choice: நெருங்கிச் சென்று
  rationale: קרב என்பதிலுள்ள ஓர் இடத்தை அணுகும் இயக்கப் பொருளையும், cohortative வடிவிலுள்ள ‘நாம்’ என்ற கூட்டு முன்மொழிவையும் சூழலுக்கு ஏற்ற தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּאַחַד הַמְּקֹמוֹת
  choice: இந்த இடங்களில் ஒன்றை
  rationale: பேசுபவர் தாம் அடையக்கூடிய அருகிலுள்ள இடங்களில் ஒன்றைக் குறிப்பிடுகிறார்; அடுத்ததாக கிபியாவும் ராமாவும் கூறப்படுகின்றன. ‘இந்த’ என்பது தமிழில் அந்தச் சூழ்நிலைச் சுட்டை இயல்பாக்குகிறது.
- source_word: וְלַנּוּ
  choice: இரவைக் கழிப்போம்
  rationale: לון என்பது இரவு தங்குதல் அல்லது இரவைக் கழித்தல் என்று பொருள்படும். ‘இரவைக் கழிப்போம்’ என்பது தெளிவான, தற்காலத் தமிழ்நடை.
- source_word: בַגִּבְעָה
  choice: கிபியாவில்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, ஓர் ஊருக்குள் இரவு தங்குவதை இயல்பான தமிழ் வேற்றுமை உருபுடன் தெரிவிக்கிறது.
- source_word: בָרָמָה
  choice: ராமாவில்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, கிபியாவுக்கு இணையான தொடரமைப்பில் வழங்கப்பட்டுள்ளது.
