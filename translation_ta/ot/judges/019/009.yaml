  yaml_path: translation/ot/judges/019/009.yaml
  text: When the man rose to leave with his concubine and his attendant, his father-in-law, the young woman’s father, said to him, “Look, the day is waning toward evening. Please stay the night. Look, the day is nearly over[a]. Spend the night here and let your heart be glad. Then rise early tomorrow for your journey[b], and go home[c].”
translation:
  language: ta
  text: அந்த மனிதன் தன் வைப்பாட்டியுடனும் பணியாளனுடனும் புறப்பட எழுந்தபோது, அவனுடைய மாமனாராகிய அந்த இளம்பெண்ணின் தந்தை அவனிடம், “இதோ, பகல் மங்கி மாலையாகிறது. தயவுசெய்து இன்றிரவு தங்குங்கள். இதோ, பகல் ஏறக்குறைய முடிந்துவிட்டது[a]. இங்கே இரவு தங்குங்கள்; உங்கள் உள்ளம் மகிழட்டும். நாளை அதிகாலையில் நீங்கள் எல்லாரும் எழுந்து பயணத்திற்குப் புறப்படுங்கள்[b]; நீரோ உங்கள் வீட்டிற்குச் செல்லுங்கள்[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “பகல் முகாமிடுகிறது”; பகல் அடங்கிவருவதையோ முடிவை நெருங்குவதையோ சித்தரிக்கும் உருவகம்.
    reason: source_image
  - marker: b
    text: “நீங்கள் எல்லாரும் எழுந்து பயணத்திற்குப் புறப்படுங்கள்” என்பது பன்மையில் இருந்து, பயணக் குழுவினர் அனைவரையும் குறிக்கிறது.
    reason: grammar
  - marker: c
    text: “நீரோ உங்கள் வீட்டிற்குச் செல்லுங்கள்” என்பது அந்த மனிதனை மட்டும் நோக்கி, மரியாதை ஒருமையில் கூறப்படுகிறது. “வீட்டிற்கு” என்பது சொல்லுக்குச் சொல் “உங்கள் கூடாரத்திற்கு”; இங்கு அது வீட்டிற்குச் செல்வதைக் குறிக்கும் மரபுத்தொடர்.
    reason: grammar_and_lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: இது பொதுவாக ‘மனிதன்/ஆண்’ என்பதைக் குறிக்கும் சொல்; இங்கு உறவுமுறையை ஊகித்து ‘கணவன்’ என்று குறிப்பாக்காமல், எபிரெயக் கதையாடல் முறையைப் பேணுகிறது.
- source_word: פִילַגְשׁוֹ
  choice: அவனுடைய வைப்பாட்டி
  rationale: பண்டைய சமூகத்தில் மனைவியைவிடத் தாழ்ந்த சட்டச் செல்வாக்குடைய துணைவியைக் குறிக்கும் தனிப்பட்ட வகைப்பாட்டைத் தமிழில் நேரடியாகக் காட்டுகிறது; ‘மனைவி’ என்று மென்மையாக்கவில்லை.
- source_word: נַעֲרוֹ
  choice: அவனுடைய பணியாளன்
  rationale: இச்சூழலில் வயதைவிடப் பயணத்தில் உடனிருந்து பணிபுரியும் பங்கே முக்கியம்.
- source_word: רָפָה הַיּוֹם לַעֲרֹב
  choice: பகல் மங்கி மாலையாகிறது
  rationale: மாலை நெருங்கும்போது பகலொளி வலுவிழப்பதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֲנוֹת הַיּוֹם
  choice: பகல் ஏறக்குறைய முடிந்துவிட்டது
  rationale: ‘பகல் முகாமிடுகிறது’ என்ற அரிய உருவகத்தின் காலப்பொருளை முதன்மை உரையில் தெளிவாக்கி, மூல உருவகத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: וְיִיטַב לְבָבֶךָ
  choice: உங்கள் உள்ளம் மகிழட்டும்
  rationale: இதயம் நன்றாக அல்லது மகிழ்ச்சியாக இருப்பதைக் குறிக்கும் எபிரெய உருவகத்தை இயல்பான தமிழில் பேணுகிறது.
- source_word: לְאֹהָלֶךָ
  choice: உங்கள் வீட்டிற்கு
  rationale: சொல்லுக்குச் சொல் ‘உங்கள் கூடாரத்திற்கு’ என்றாலும், இங்கு சொந்த இடத்திற்குத் திரும்புவதைச் சுட்டும் மரபுத்தொடரின் பொருளைத் தருகிறது.
