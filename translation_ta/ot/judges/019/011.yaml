base_translation:
  language: en
  yaml_path: translation/ot/judges/019/011.yaml
  text: When they were near Jebus[a], and the day was far spent, the young man said to his master, “Please come[c][b], let us turn aside to this city of the Jebusites and spend the night in it.”
translation:
  language: ta
  text: அவர்கள் எபூசுக்கு[a] அருகில் இருந்தபோது, பகல் வெகுவாகச் சாய்ந்திருந்தது[b]. அப்போது அந்த இளைஞன்[c] தன் எஜமானிடம், “தயவுசெய்து, வாருங்கள்; இந்த எபூசியர் நகரத்திற்குள் வழியை விட்டு விலகிச் சென்று, அதில் இரவைக் கழிப்போம்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபூசு என்பது எருசலேமின் பழைய பெயர்.
    reason: cross_reference
  - marker: b
    text: அல்லது, “பகல் வெகுவாகக் கடந்துவிட்டது”; “மிகவும் நேரமாகிக்கொண்டிருந்தது.”
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் “இளைஞன்”; சூழலுக்கேற்ப இச்சொல் பணியாளர் அல்லது உதவியாளரையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם עִם יְבוּס
  choice: அவர்கள் எபூசுக்கு அருகில் இருந்தபோது
  rationale: பயணச் சூழலில் עִם என்பது ஓர் இடத்துக்கு அருகாமையில் இருப்பதைக் குறிக்கிறது; இயல்பான தமிழில் காலத் துணைவாக்கியமாக மொழிபெயர்க்கப்பட்டது.
- source_word: יְבוּס
  choice: எபூசு
  rationale: மூலத்தில் உள்ள பழைய இடப்பெயர் தக்கவைக்கப்படுகிறது; அதை நேரடியாக எருசலேம் என்று மாற்றுவது தவிர்க்கப்படுகிறது.
- source_word: וְהַיּוֹם רַד מְאֹד
  choice: பகல் வெகுவாகச் சாய்ந்திருந்தது
  rationale: நாள் மாலையை நோக்கிச் சரியும் மூல உருவகத்தை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: הַנַּעַר
  choice: அந்த இளைஞன்
  rationale: נַעַר என்பதற்கு இளைஞன், சிறுவன், பணியாள் அல்லது உதவியாளர் என்ற பொருள்கள் வரலாம். சொல்லின் அடிப்படைத் தெளிவின்மையைத் தக்கவைக்க ‘இளைஞன்’ பயன்படுத்தப்படுகிறது; அவனது கீழ்நிலை உறவு ‘எஜமான்’ என்பதால் புலப்படுகிறது.
- source_word: אֲדֹנָיו
  choice: தன் எஜமானிடம்
  rationale: இங்கு אֲדוֹן சமூக உறவில் மேலுள்ளவரைக் குறிக்கிறது; ‘எஜமான்’ சூழலுக்கு ஏற்ற, தெளிவான தமிழ்ச் சொல்.
- source_word: לְכָה נָּא
  choice: தயவுசெய்து வாருங்கள்
  rationale: இயக்கத்தைக் குறிக்கும் கட்டளையையும் נָא தரும் பணிவான வேண்டுகோளையும் வெளிப்படுத்துகிறது.
- source_word: וְנָסוּרָה
  choice: திரும்பிச் சென்று
  rationale: பயணித்த பாதையிலிருந்து விலகி நகருக்குள் செல்வதற்கான கூட்டுவிருப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עִיר הַיְבוּסִי הַזֹּאת
  choice: எபூசியர்களின் இந்த நகரத்திற்கு
  rationale: இனப்பெயரை கூட்டுப்பொருளில் எடுத்துக்கொண்டு, சுட்டுப்பெயரடையான ‘இந்த’ என்பதையும் தக்கவைக்கிறது.
- source_word: וְנָלִין בָּהּ
  choice: அதில் இரவைக் கழிப்போம்
  rationale: לוּן குறிக்கும் இரவு தங்குதலை நவீன, எளிய தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
