  to: அவர்கள் எபூசுக்கு[a] அருகில் இருந்தபோது, பகல் வெகுவாகச் சாய்ந்திருந்தது[b]. அப்போது அந்த இளைஞன்[c] தன் எஜமானிடம், “தயவுசெய்து, வாருங்கள்; இந்த எபூசியர் நகரத்திற்குள் வழியை விட்டு விலகிச் சென்று, அதில் இரவைக் கழிப்போம்” என்றான்.
