base_translation:
  language: en
  yaml_path: translation/ot/judges/019/025.yaml
  text: But the men were not willing to listen to him[a], so the man seized his concubine and brought her out to them. And they knew her and abused her all night until morning, and they let her go at the dawn.
translation:
  language: ta
  text: ஆனால் அந்த ஆண்கள் அவன் சொல்வதைக் கேட்க விரும்பவில்லை. ஆகவே அந்த மனிதன் தன் துணை மனைவியைப் பிடித்து வெளியே அவர்களிடம் கொண்டுபோனான். அவர்கள் அவளைப் பாலியல் வல்லுறவுக்கு உட்படுத்தினார்கள்[a]; விடியும்வரை இரவு முழுவதும் அவளைக் கொடுமைப்படுத்தினார்கள். விடியல் எழுந்தபோது அவளைப் போகவிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், சொல்லுக்குச் சொல், “அவளை அறிந்தார்கள்”; இங்கு இது பாலுறவைக் குறிக்கும் மறைமுகச் சொல்லாட்சி. சூழல் இது அவள்மீது நடத்தப்பட்ட பாலியல் வல்லுறவு என்பதைத் தெளிவுபடுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוּ
  choice: மனமில்லாதிருந்தார்கள்
  rationale: இந்த வினைச்சொல்லிலுள்ள விருப்பமின்மை அல்லது இணங்க மறுத்தல் என்ற நுணுக்கத்தை, நோக்கத்தை அளவுக்கு மீறி விளக்காமல் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לִשְׁמֹעַ לוֹ
  choice: அவன் சொல்வதைக் கேட்க
  rationale: இங்கு அவர்கள் அவனுடைய வேண்டுகோளை ஏற்காததையே சூழல் காட்டுகிறது; ‘கீழ்ப்படிய’ என்பதைவிட இது மூலத்தின் கேட்பது/செவிசாய்ப்பது என்ற பொருள் வரம்பைத் திறந்துவைக்கிறது.
- source_word: וַיַּחֲזֵק
  choice: பிடித்து
  rationale: அந்த மனிதன் அவளை வலுக்கட்டாயமாகக் கைப்பற்றிய செயலைத் தெளிவாகக் காட்டுகிறது; ‘அழைத்துக்கொண்டு’ போன்ற மென்மையான சொல்லைத் தவிர்க்கிறது.
- source_word: פִּילַגְשׁוֹ
  choice: தன் துணை மனைவி
  rationale: பண்டைய சமூகத்தில் முதன்மை மனைவியைவிடக் குறைந்த சட்ட மற்றும் சமூக நிலை கொண்ட பெண்ணைக் குறிக்கும் சொல்லை, இழிவுச்சாயலுள்ள அல்லது பழமையான தமிழ்ச் சொற்களைத் தவிர்த்து புரியத்தக்க வகையில் தருகிறது.
- source_word: וַיֹּצֵא אֲלֵיהֶם הַחוּץ
  choice: வெளியே அவர்களிடம் கொண்டுபோனான்
  rationale: ஹிபில் வடிவிலுள்ள ‘வெளியே போகச் செய்தான்’ என்ற காரணவினைப் பொருளையும் הַחוּץ என்பதன் வெளிப்படையான ‘வெளியே’ என்பதையும் காக்கிறது.
- source_word: וַיֵּדְעוּ אוֹתָהּ
  choice: அவர்கள் அவளை “அறிந்தார்கள்”
  rationale: மூல எபிரெய மொழியின் திட்டமிட்ட மறைமுகச் சொல்லாட்சியை முதன்மை உரையில் காக்கிறது; மேற்கோள் குறிகளும் அடிக்குறிப்பும் நவீன வாசகருக்கு அதன் பாலியல் பொருளைத் தெளிவுபடுத்துகின்றன.
- source_word: וַיִּתְעַלְּלוּ בָהּ
  choice: அவளைக் கொடுமைப்படுத்தினார்கள்
  rationale: இழிவுபடுத்தும் வன்முறையான தவறான நடத்தையைத் தெளிவாகக் குறிக்கும் இயல்பான நவீன தமிழ்; பாலியல் வன்முறையை மட்டும் குறிக்கும் சொல்லாக இதன் பரந்த பொருளைச் சுருக்கவில்லை.
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: விடியும்வரை இரவு முழுவதும்
  rationale: வன்முறை நீடித்த முழுக் கால அளவையும் இயல்பான தமிழ் சொல் வரிசையில் அப்படியே தெரிவிக்கிறது.
- source_word: וַיְשַׁלְּחוּהָ
  choice: அவளைப் போகவிட்டார்கள்
  rationale: இச்சூழலில் ‘அனுப்பிவிட்டார்கள்’ அல்லது ‘விடுவித்தார்கள்’ என்பதைக் காட்டிலும் இயல்பாக, தாக்குதலுக்குப் பின் அவளை விட்டுவிட்ட செயலைக் குறிக்கிறது.
- source_word: בעלות השחר
  choice: விடியல் எழுந்தபோது
  rationale: ‘விடியல் எழுதல்’ என்ற மூலமொழியின் காலப்பிம்பத்தைத் தமிழில் இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: பாலியல் வன்முறையைக் குறிக்கும் எபிரெய மறைமுகச் சொல்லாட்சி
  choice: முதன்மை உரையில் ‘அறிந்தார்கள்’ எனக் காத்து, அடிக்குறிப்பில் பாலியல் வல்லுறவைத் தெளிவுபடுத்துதல்
  alternative: ‘அவளைப் பாலியல் வல்லுறவுக்கு உட்படுத்தினார்கள்’ என்று முதன்மை உரையிலேயே நேரடியாக மொழிபெயர்த்தல்
  rationale: மூலத்தின் மறைமுகச் சொல்லாட்சியை மறைக்காமல் காக்கும் அதேவேளையில், இது சம்மதத்துடன் நடந்த பாலுறவு என்ற தவறான எண்ணத்திற்கு இடமளிக்காதபடி சூழலின் வன்முறையை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதாயினும் நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. மூல உரையின் கடுமையைக் குறைத்து மறைக்கவில்லை; அதேவேளையில் அதில் இல்லாத கூடுதல் விவரங்களும் சேர்க்கப்படவில்லை. ‘துணை மனைவி’ என்பது பழமையான அல்லது இழிவுச்சாயலுள்ள வழக்குகளைத் தவிர்க்கும் சமூகப் பதமாகத் தேர்ந்தெடுக்கப்பட்டது.
