base_translation:
  language: en
  yaml_path: translation/ot/judges/019/001.yaml
  text: And it happened in those days[a], when there was no king in Israel, that a Levite man was dwelling in the remote parts of the hill country of Ephraim, and he took for himself a woman, a concubine[b], from Bethlehem in Judah.
translation:
  language: ta
  text: 'அந்த நாட்களில்[a] இவ்வாறு நிகழ்ந்தது: இஸ்ரவேலில் அரசன் இல்லை. எப்பிராயீம் மலைநாட்டின் தொலைதூரப் பகுதிகளில் லேவியன் ஒருவன் குடியிருந்தான். அவன் யூதாவிலுள்ள பெத்லெகேமிலிருந்து ஒரு பெண்ணைத் தனக்குத் துணைமனைவியாக[b] ஏற்றுக்கொண்டான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நாட்களில், இஸ்ரவேலில் அரசன் இல்லாதபோது, ...” எபிரெயத்தில் “இஸ்ரவேலில் அரசன் இல்லை” என்பது இணை வாக்கியமாக உள்ளது; அதைத் தனிக் கூற்றாகவோ காலப் பின்னணியாகவோ மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “துணைமனைவி” என்பது வெறும் தற்காலிகத் துணையைக் குறிக்கவில்லை; மனைவியைவிடத் தாழ்ந்த சமூக நிலையைக் கொண்டிருந்தாலும், அக்காலச் சமூகத்தில் அங்கீகரிக்கப்பட்ட உறவில் இருந்த பெண்ணைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי ... בַּיָּמִים הָהֵם
  choice: அந்த நாட்களில்
  rationale: எபிரெயக் கதைத் தொடக்கச் சூத்திரத்தை இயல்பான நவீனத் தமிழில் தருகிறது; தொடரும் வாக்கியமே நிகழ்வை வெளிப்படுத்துவதால் தனியே ‘இது நிகழ்ந்தது’ என்று சேர்ப்பது தமிழில் தேவையற்ற கனத்தை உண்டாக்கும்.
- source_word: וּמֶלֶךְ אֵין בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில் அரசன் இல்லாதபோது
  rationale: இணைப்புச் சொற்றொடரின் காலப் பின்னணி செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது; அரசாட்சியை ஆதரிப்பதாகவோ எதிர்ப்பதாகவோ உரையை விளக்கவில்லை.
- source_word: אִישׁ לֵוִי
  choice: ஒரு லேவிய மனிதன்
  rationale: ‘மனிதன்’ மற்றும் ‘லேவியன்’ ஆகிய இரு கூறுகளையும் வெளிப்படையாகக் காக்கிறது.
- source_word: גָּר
  choice: குடியிருந்தான்
  rationale: தற்காலிகமாக அல்லது அந்நியக் குடியாளராக வாழும் சாத்திய நிழற்பொருளை முற்றிலும் நீக்காமல், சூழலில் இயல்பான தமிழை வழங்குகிறது.
- source_word: בְּיַרְכְּתֵי הַר אֶפְרַיִם
  choice: எப்பிராயீம் மலைநாட்டின் தொலைதூரப் பகுதிகளில்
  rationale: יַרְכְּתֵי என்பதன் ஓரம், பின்புறம், தொலைவான பகுதி என்ற புவியியல் உணர்வையும், הַר אֶפְרַיִם என்பது தனி மலையல்ல மலைநாட்டுப் பகுதி என்பதையும் தருகிறது.
- source_word: וַיִּקַּח לוֹ
  choice: தனக்குத் ... ஏற்றுக்கொண்டான்
  rationale: ஒரு பெண்ணைத் தனக்கென மணஉறவுக்குள் எடுத்துக்கொண்டான் என்ற பொருளை, உடைமை உணர்வு மிகாமல் இயல்பான தமிழில் தருகிறது.
- source_word: אִשָּׁה פִילֶגֶשׁ
  choice: ஒரு பெண்ணைத் ... துணைமனைவியாக
  rationale: אִשָּׁה என்பதிலுள்ள ‘பெண்’ என்ற கூறைத் தக்கவைத்து, פִילֶגֶשׁ குறிக்கும் அங்கீகரிக்கப்பட்டிருந்தாலும் முழு மனைவியைவிடத் தாழ்ந்த சமூக நிலையுள்ள உறவை ‘துணைமனைவி’ எனக் குறிக்கிறது; இழிவுணர்வோ சாதாரண பாலுறவோ குறிக்கும் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: யூதாவிலுள்ள பெத்லெகேமைச் சேர்ந்த
  rationale: இந்தப் பெத்லெகேமை யூதா பிரதேசத்துடன் தெளிவாக அடையாளப்படுத்தும் இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: இஸ்ரவேலில் அரசன் இல்லாதது பற்றிய நீதித்தலைவர்கள் நூலின் மறுபடி வரும் கூற்று
  choice: இஸ்ரவேலில் அரசன் இல்லாதபோது
  alternative: இஸ்ரவேலில் அரசன் இல்லை
  rationale: இதைக் காலப் பின்னணியாக வாசிக்கச் செய்கிறது; அதேவேளை அரசாட்சிக்கு ஆதரவான அல்லது எதிரான மதிப்பீட்டை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை. எபிரெய இணை வாக்கியமாகவும் வாசிக்க இயலும் என்பதைக் குறிப்பில் காக்கிறது.
- issue: פִילֶגֶשׁ என்பவளின் உறவு நிலை
  choice: துணைமனைவி
  alternative: வைப்பாட்டி; மறுமனைவி
  rationale: இது வெறும் சாதாரண பாலுறவு அல்ல, சமூக ரீதியாக அறியப்பட்ட உறவு என்பதைத் தெரிவிக்கிறது; ‘வைப்பாட்டி’ என்பதன் இன்றைய இழிவான நிழற்பொருளையும், ‘மறுமனைவி’ என்பதன் ‘இரண்டாம் மனைவி’ என்ற தவறான துல்லியத்தையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘லேவிய மனிதன்’ என்பது மூலத்தின் இரு பெயர்ச்சொற்களையும் காக்கும் நோக்கில் சற்றே முறையான நடையாகத் தேர்ந்தெடுக்கப்பட்டது. ‘துணைமனைவி’ என்ற சொல் பண்பாட்டு நிலையை இழிவுபடுத்தாமல் விளக்க அடிக்குறிப்புடன் பயன்படுத்தப்பட்டது.
