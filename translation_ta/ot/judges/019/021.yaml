- from: அவன் அவரைத் தன் வீட்டுக்குள் அழைத்து வந்து, கழுதைகளுக்குத் தீவனம் கலந்து வைத்தான்[a]. பிறகு அவர்கள் தங்கள் கால்களைக் கழுவினார்கள்[b]; சாப்பிட்டுக் குடித்தார்கள்.
  to: அவன் அவனைத் தன் வீட்டுக்குள் கொண்டு வந்து, கழுதைகளுக்குத் தீவனம் கலந்து வைத்தான்[a]. பிறகு அவர்கள் தங்கள் கால்களைக் கழுவினார்கள்[b]; சாப்பிட்டுக் குடித்தார்கள்.
  rationale: திருத்தம் குறைந்த அளவிலானது. மூலத்தின் குறியீடற்ற ஒருமை பொருளைத் தமிழில் «அவனை» எனக் காத்து, கொண்டுவருதல் என்ற செயலையும் நேரடியாக வெளிப்படுத்தினேன். தீவனம் கலத்தல், பன்மை «அவர்கள்», மற்றும் தொடர்நிகழ்வு ஆகியவை மாற்றப்படவில்லை. இரு அடிக்குறிப்பு குறியீடுகளும் அவை சுட்டும் உரைப்பகுதிகளோடு சரியாகவே உள்ளன.
