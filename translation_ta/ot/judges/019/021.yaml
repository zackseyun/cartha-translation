  source_fidelity: 'மூல எபிரெய உரையின் நிகழ்வுவரிசையும் பொருளும் பெரும்பாலும் துல்லியமாகக் கொடுக்கப்பட்டுள்ளன: வீட்டுக்குள் கொண்டுவருதல், கழுதைகளுக்குத் தீவனம் கலத்தல், கால்களைக் கழுவுதல், உண்ணுதல் மற்றும் குடித்தல். ஆனால் ஒருமை மூன்றாம் நபர் பொருளை மரியாதைப் பன்மைத் தோற்றமளிக்கும் «அவரை» என்பதற்குப் பதிலாக «அவனை» எனத் தருவது மூலத்தின் குறியீடற்ற ஒருமையைச் சிறப்பாகக் காக்கும்.'
  naturalness: நடை நவீனத் தமிழில் இயல்பாக உள்ளது. «அவனைத் தன் வீட்டுக்குள் கொண்டு வந்து» என்பது «அவரைத் ... அழைத்து வந்து» என்பதைக் காட்டிலும் நேரடியானதும் மூல வினையின் பொருளுக்கு நெருக்கமானதும் ஆகும். அடிக்குறிப்பு அ-வில் உள்ள «இன்னும் சொல்லுக்குச் சொல்லாக» என்ற தொடர் இயல்பற்றதால் மாற்றப்பட்டுள்ளது.
  terminology: «கழுதைகள்», «தீவனம்», «கால்களைக் கழுவினார்கள்» ஆகியவை பொருத்தமான நவீன நிலையான தமிழ் சொற்கள். விருந்தோம்பல் குறித்த அடிக்குறிப்பு, உரை வெளிப்படுத்தாத கூடுதல் விளக்கத்தைத் திணிக்காமல் பண்பாட்டுப் பின்னணியைச் சரியாகக் குறிப்பிடுகிறது.
