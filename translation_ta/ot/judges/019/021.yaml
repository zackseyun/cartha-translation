translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையின் சுருக்கமான தொடர்நடை காக்கப்பட்டது; ‘அவர்கள்’ யாரைக் குறிக்கிறது என்பதை உரை தெளிவுபடுத்தாததால் அது அப்படியே விடப்பட்டது.
