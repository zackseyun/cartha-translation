  yaml_path: translation/ot/judges/019/021.yaml
  text: So he brought him into his house and fed the donkeys[b][a]. Then they washed their feet and ate and drank.
translation:
  language: ta
  text: அவன் அவனைத் தன் வீட்டுக்குள் கொண்டு வந்து, கழுதைகளுக்குத் தீவனம் கலந்து வைத்தான்[a]. பிறகு அவர்கள் தங்கள் கால்களைக் கழுவினார்கள்[b]; சாப்பிட்டுக் குடித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள எபிரெய வினைச்சொல், நேரடியாகச் சொன்னால், கழுதைகளுக்குத் தீவனத்தைக் ‘கலந்தான்’ என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: பண்டைய அண்மைக் கிழக்கில் விருந்தினர்கள் கால்களைக் கழுவிக்கொள்வதற்கு வசதி செய்வது வழக்கமான விருந்தோம்பல் செயலாக இருந்தது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִיאֵהוּ לְבֵיתוֹ
  choice: அவன் அவரைத் தன் வீட்டுக்குள் அழைத்து வந்து
  rationale: הביא என்பதன் causative பொருள் ‘வரச் செய்தல்/கொண்டுவருதல்.’ இயக்கத்தைக் குறிக்கும் வினையுடன் לְבֵיתוֹ என்பது வீட்டின் உள்ளே கொண்டுவந்ததை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיָּבָול לַחֲמוֹרִים
  choice: கழுதைகளுக்குத் தீவனம் கலந்து வைத்தான்
  rationale: בלל என்பதன் அடிப்படைப் பொருள் ‘கலத்தல்’; இங்கு விலங்குகளுக்கான தீவனத்தைத் தயாரித்துக் கொடுப்பதைக் குறிக்கிறது. ‘தீவனம் கலந்து வைத்தான்’ என்பது அந்தச் சொற்பொருளையும் நிகழ்வின் நடைமுறைப் பொருளையும் காக்கிறது.
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: அவர்கள் தங்கள் கால்களைக் கழுவினார்கள்
  rationale: எபிரெயப் பன்மை எழுவாயையும் உடைமைப் பின்னொட்டையும் நேராகப் பிரதிபலிக்கிறது; கால்களைக் கழுவியது விருந்தோம்பல் சூழலோடு பொருந்துகிறது.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: சாப்பிட்டுக் குடித்தார்கள்
  rationale: எளிய தொடர்நிகழ்வைச் சுருக்கமாகவும் இயல்பான நவீன தமிழிலும் தருகிறது.
