base_translation:
  language: en
  yaml_path: translation/ot/judges/019/023.yaml
  text: Then the man[a], the master of the house, went out to them and said to them, “No, my brothers, please do not act wickedly. Since this man has come into my house, do not do this disgraceful thing.”
translation:
  language: ta
  text: அப்போது வீட்டுத் தலைவனாகிய அந்த மனிதன் வெளியே வந்து, அவர்களிடம் சென்று, “வேண்டாம், என் சகோதரர்களே! தயவுசெய்து தீமை செய்யாதீர்கள். இந்த மனிதன் என் வீட்டிற்கு வந்திருப்பதால், இந்த வெட்கக்கேடான செயலை[a] செய்யாதீர்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அருவருப்பான இந்தச் செயலை” அல்லது “மிக இழிவான இந்தச் செயலை” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் வெட்ககரமான, அறநெறிக்கு முற்றிலும் எதிரான ஒரு செயலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעַל הַבַּיִת
  choice: வீட்டுத் தலைவன்
  rationale: வீட்டையும் குடும்பத்தையும் பொறுப்புடன் நடத்தும் அதிகாரமுள்ள மனிதனைச் சுட்டுகிறது; ‘வீட்டின் உரிமையாளர்’ என்பதைவிட சூழலுக்கேற்ற இயல்பான தமிழ்.
- source_word: אַחַי
  choice: என் சகோதரர்களே
  rationale: எபிரெயச் சொல்லின் நேரடியான ஆண்பால் அழைப்பைத் தக்கவைக்கிறது; இங்கு ஊரிலுள்ள ஆண்களை வேண்டிக்கொள்ளும் சமூக அழைப்பாகப் பயன்படுகிறது.
- source_word: תָּרֵעוּ
  choice: தீமை செய்யாதீர்கள்
  rationale: רעע என்ற வேர்ச்சொல்லின் அறநெறிசார் வலிமையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: வேண்டுகோளின் அவசரத்தையும் கெஞ்சும் தொனியையும் நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: אַחֲרֵי אֲשֶׁר בָּא ... אֶל־בֵּיתִי
  choice: இந்த மனிதன் என் வீட்டிற்கு வந்திருப்பதால்
  rationale: விருந்தாளி தன் வீட்டின் பாதுகாப்புக்குள் வந்துவிட்ட சூழ்நிலையை காரணமாக முன்வைக்கும் தொடரின் பொருளை இயல்பாக வெளிப்படுத்துகிறது; காலவியல் மற்றும் காரணவியல் தொடர்பு இரண்டிலும் இங்கு காரணவியல் மேலோங்குகிறது.
- source_word: הַנְּבָלָה הַזֹּאת
  choice: வெட்கக்கேடான இந்தச் செயல்
  rationale: நெறிகெட்ட, அவமானகரமான, கடும் அருவருப்பைத் தூண்டும் செயலைக் குறிக்கும் சொல்லின் வலிமையை ‘முட்டாள்தனம்’ என்று மெலிதாக்காமல் தெரிவிக்கிறது.
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: அவர்களிடம் வெளியே சென்று
  rationale: வீட்டிலிருந்து வெளியேறி அவர்களிடம் சென்ற இயக்கத்தை நேரடியாகக் காட்டுகிறது.
