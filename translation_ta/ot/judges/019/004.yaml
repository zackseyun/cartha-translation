base_translation:
  language: en
  yaml_path: translation/ot/judges/019/004.yaml
  text: And his father-in-law[a], the young woman's father, urged him to stay, and he remained with him three days; and they ate and drank, and spent the nights there.
translation:
  language: ta
  text: அந்த இளம்பெண்ணின் தந்தையான அவனுடைய மாமனார், அவனைத் தங்கும்படி வற்புறுத்தினார்[a]. அவன் அவருடன் மூன்று நாட்கள் தங்கினான்; அவர்கள் உண்டு குடித்து, அங்கே இரவுகளைக் கழித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனை இணங்கச் செய்தார்,’ ‘அவனை அழுத்தமாக வற்புறுத்தினார்,’ அல்லது ‘அவனைப் போகவிடாமல் தங்கவைத்தார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழிமரபு சொற்படியாக, அவனுடைய மாமனார் ‘அவனுடன்/அவனுக்கு எதிராக வலிமையாக இருந்தார்’ என்று கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק בּוֹ
  choice: அவனைத் தங்கும்படி வற்புறுத்தினார்
  rationale: חזק ב என்ற எபிரெய மொழிமரபு சொற்படியாக ‘அவனுடன்/அவனுக்கு எதிராக வலிமையாக இருந்தார்’ எனப் பொருள்பட்டாலும், இச்சூழலில் தொடர்ந்து தங்குமாறு உறுதியாக வற்புறுத்தியதைக் குறிக்கிறது. அடுத்த வாக்கியம் அவன் தங்கியதாகக் கூறுவதால், வற்புறுத்தலின் மறைமுக நோக்கம் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது; கட்டாயமாகத் தடுத்து வைத்தார் என்ற அளவுக்கு பொருள் மிகைப்படுத்தப்படவில்லை.
- source_word: חֹתְנוֹ
  choice: அவனுடைய மாமனார்
  rationale: இங்கு திருமண உறவின் அடிப்படையில் லேவியனுக்கு அந்தப் பெண்ணின் தந்தை கொண்ட உறவைக் குறிக்கிறது. ‘மாமனார்’ என்பது இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: אֲבִי הַנַּעֲרָה
  choice: அந்த இளம்பெண்ணின் தந்தையான
  rationale: மாமனார் யார் என்பதை இச்சொற்றொடர் மேலும் தெளிவாக அடையாளப்படுத்துகிறது. נַעֲרָה என்பதற்கு இத்திருமணச் சூழலில் ‘இளம்பெண்’ என்பது பொருத்தமானது.
- source_word: וַיֵּשֶׁב אִתּוֹ
  choice: அவன் அவருடன் ... தங்கினான்
  rationale: ישב என்பதற்கு ‘அமர்தல், குடியிருத்தல், தங்குதல்’ ஆகிய பொருள்கள் உண்டு. இவ்விருந்தோம்பல் நிகழ்வில் தொடர்ந்து அங்கே இருந்ததைக் குறிக்க ‘தங்கினான்’ இயல்பாக உள்ளது.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: மூன்று நாட்கள்
  rationale: கால அளவை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: அவர்கள் உண்டு குடித்து
  rationale: மூலத்திலுள்ள இரண்டு எளிய வினைகளும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன; ‘விருந்துண்டனர்’ போன்ற விளக்கச் சுருக்கம் தவிர்க்கப்பட்டுள்ளது.
- source_word: וַיָּלִינוּ שָׁם
  choice: அங்கே இரவுகளைக் கழித்தார்கள்
  rationale: לון என்பது இரவில் தங்குவதைக் குறிப்பாகச் சுட்டுகிறது. மூன்று நாள் காலப்பகுதியில் ஒன்றுக்கு மேற்பட்ட இரவுகள் அங்கே கழிந்ததைப் பன்மை வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
