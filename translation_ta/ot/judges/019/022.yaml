  text: הֵמָּה֮ מֵיטִיבִ֣ים אֶת לִבָּ/ם֒ וְ/הִנֵּה֩ אַנְשֵׁ֨י הָ/עִ֜יר אַנְשֵׁ֣י בְנֵֽי בְלִיַּ֗עַל נָסַ֨בּוּ֙ אֶת הַ/בַּ֔יִת מִֽתְדַּפְּקִ֖ים עַל הַ/דָּ֑לֶת וַ/יֹּאמְר֗וּ אֶל הָ֠/אִישׁ בַּ֣עַל הַ/בַּ֤יִת הַ/זָּקֵן֙ לֵ/אמֹ֔ר הוֹצֵ֗א אֶת הָ/אִ֛ישׁ אֲשֶׁר בָּ֥א אֶל בֵּיתְ/ךָ֖ וְ/נֵדָעֶֽ/נּוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/022.yaml
  text: While they were making their hearts merry[a], behold, the men of the city, worthless men, surrounded the house, pounding on the door. They said to the old man, the master of the house, “Bring out the man who came into your house[b], so that we may know him.”
translation:
  language: ta
  text: அவர்கள் மனமகிழ்ந்துகொண்டிருந்தபோது, இதோ, நகரத்து ஆண்களான தீயவர்கள்[a] வீட்டைச் சூழ்ந்துகொண்டு, கதவைப் பலமாக அடித்துக்கொண்டிருந்தார்கள். அவர்கள் வீட்டுத்தலைவரான அந்த முதியவரிடம், “உன் வீட்டுக்குள் வந்த அந்த மனிதனை வெளியே கொண்டுவா; நாங்கள் அவனை அறிந்துகொள்ள வேண்டும்[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “தீயதன்மையின் மகன்கள்” அல்லது “நல்லதல்லாத தன்மையின் மகன்கள்”; அதாவது, சட்டத்தையும் ஒழுக்கத்தையும் மதிக்காத தீயவர்கள்.
    reason: lexical_alternative
  - marker: b
    text: “அறிந்துகொள்ளுதல்” என்பது இங்கு பாலியல் பொருளுடைய மறைசொல். அவர்கள் அவனைப் பாலியல் வன்கொடுமை செய்ய எண்ணினர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵיטִיבִים אֶת לִבָּם
  choice: மனமகிழ்ந்துகொண்டிருந்தபோது
  rationale: ‘தங்கள் இதயத்தை நன்றாக்குதல்’ என்ற எபிரெய மொழிமரபு இங்கு விருந்துண்டு மகிழ்ந்திருப்பதைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் அதன் மகிழ்ச்சிப் பொருளைத் தருகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கதையில் திடீரென ஏற்படும் அச்சுறுத்தலான திருப்பத்தைச் சுட்டும் கவன ஈர்ப்புச் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: אַנְשֵׁי הָעִיר אַנְשֵׁי בְנֵי בְלִיַּעַל
  choice: நகரத்து ஆண்களான சீர்கெட்டவர்கள்
  rationale: நகரத்தைச் சேர்ந்த ஆண்கள் என்பதையும், அவர்கள் ஒழுக்கமற்ற தீயவர்கள் என்பதையும் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது. சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: נָסַבּוּ אֶת הַבַּיִת
  choice: அந்த வீட்டைச் சூழ்ந்துகொண்டு
  rationale: வீட்டைச் சுற்றி வளைத்த செயலை நேரடியாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: מִתְדַּפְּקִים עַל הַדָּלֶת
  choice: கதவைப் பலமாக அடித்துக்கொண்டிருந்தார்கள்
  rationale: தொடர்ச்சியாகவும் வன்முறையாகவும் கதவைத் தாக்கிய செயலைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בַּעַל הַבַּיִת
  choice: வீட்டின் உரிமையாளர்
  rationale: வீட்டின்மேல் அதிகாரமும் பொறுப்பும் கொண்டவரைக் குறிக்கும் சொற்றொடருக்கு இயல்பான தமிழ் இணை.
- source_word: הַזָּקֵן
  choice: அந்த முதியவர்
  rationale: இங்கு பதவியிலுள்ள மூப்பரை அல்ல, வயதான விருந்தோம்பியையே குறிக்கிறது.
- source_word: הוֹצֵא
  choice: வெளியே கொண்டுவா
  rationale: வீட்டுக்குள் இருக்கும் விருந்தினரை வெளியே ஒப்படைக்கும்படி இடப்படும் கட்டளையை இயல்பாகத் தருகிறது.
- source_word: וְנֵדָעֶנּוּ
  choice: நாங்கள் அவனை அறிந்துகொள்ள வேண்டும்
  rationale: ‘அறிதல்’ என்ற மூலமொழியின் பாலியல் மறைசொல்லையும் ஆதியாகமம் 19 உடனான இலக்கிய எதிரொலியையும் முதன்மை உரையில் பாதுகாக்கிறது; நோக்கம் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
theological_decisions:
- issue: וְנֵדָעֶנּוּ என்ற பாலியல் மறைசொல்லை மொழிபெயர்த்தல்
  choice: முதன்மை உரையில் ‘நாங்கள் அவனை அறிந்துகொள்ள வேண்டும்’ என்று மூல உருவகத்தைப் பாதுகாத்து, பாலியல் வன்முறை நோக்கத்தை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘அவனுடன் பாலுறவு கொள்ள வேண்டும்’ அல்லது ‘அவனைப் பாலியல் வன்கொடுமை செய்ய வேண்டும்’ என்று முதன்மை உரையிலேயே வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: எபிரெய உரை திட்டமிட்டு ‘அறிதல்’ என்ற மறைசொல்லைப் பயன்படுத்துகிறது. அதைத் தக்கவைப்பது மூலத்தின் இலக்கிய வடிவத்தையும் ஆதியாகமம் 19 உடனான தொடர்பையும் காக்கிறது; அதேவேளை அடிக்குறிப்பு வாசகர் பொருளைத் தவறாகப் புரிந்துகொள்ளாமல் செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வன்முறையான சூழல் மறைக்கப்படவில்லை; எனினும் மூலத்தின் பாலியல் மறைசொல் முதன்மை உரையில் பாதுகாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
