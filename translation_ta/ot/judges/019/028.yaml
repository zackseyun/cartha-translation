  source_fidelity: 'மூல எபிரெயத்தின் கதைநடையும் முக்கிய வினைநிலைகளும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன: பெண்பால் ஒருமை கட்டளை “எழுந்திரு,” அழைப்புத் தன்மையுள்ள “நாம் போகலாம்,” பதில் இல்லாமை, அவளை கழுதையின்மேல் ஏற்றுதல், பின்னர் மனிதன் எழுந்து தன் இடத்திற்குச் செல்லுதல் ஆகியவை அனைத்தும் காக்கப்பட்டுள்ளன. மூலத்தில் வெளிப்படையாகச் சொல்லப்படாத மரணம் போன்ற முடிவு எதுவும் சேர்க்கப்படவில்லை.'
  naturalness: உரை நவீன நிலையான தமிழில் இயல்பாகவும் மரியாதையான கதைநடைப் பதிவிலும் உள்ளது. “ஆனால் பதில் ஏதும் இல்லை” சூழலுக்கு ஏற்ற, தெளிவான நடை. “அந்த மனிதன் எழுந்து” என்பது மூலத்தின் தொடர்ச்சியான செயலைச் சீராக வெளிப்படுத்துகிறது.
  terminology: “கழுதை,” “எழுந்திரு,” “தன் இடத்துக்குச்” ஆகிய சொற்கள் பொருத்தமானவை. “தன் இடம்” என்பது מקום என்பதன் விரிவான பொருளைத் தக்கவைத்து, “வீடு” என்ற விளக்கத்தை அடிக்குறிப்பில் மாற்றுவழியாக மட்டும் வழங்குகிறது. அடிக்குறிப்பு அடையாளங்கள் a, b, c முறையே பதிலின்மை, ‘எடுத்தான்’ என்ற வினையின் மாற்றுவழி, மற்றும் “தன் இடம்/வீடு” என்ற இடப்பொருளுடன் சரியாக இணைக்கப்பட்டுள்ளன.
