base_translation:
  language: en
  yaml_path: translation/ot/judges/019/028.yaml
  text: He said to her[a], “Get up, and let us go.” But there was no answer. Then he put her on the donkey[c][b], and the man rose and went to his place.
translation:
  language: ta
  text: அவன் அவளிடம், “எழுந்திரு, நாம் போகலாம்” என்றான். ஆனால் பதில் ஏதும் இல்லை[a]. பின்பு அவன் அவளைக் கழுதையின்மேல் ஏற்றினான்[b]. அந்த மனிதன் எழுந்து தன் இடத்துக்குச்[c] சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “பதிலளிப்பவர் இல்லை” அல்லது “பதிலளித்துக்கொண்டிருந்தவர் எவரும் இல்லை.”'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவளைக் கழுதையின்மேல் எடுத்துவைத்தான்.” எபிரெய வினை சொல்லுக்குச் சொல் “எடுத்தான்” என்பதாகும்; இங்கே அவளைக் கழுதையின்மேல் வைத்து அல்லது தூக்கி ஏற்றியதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: 'அல்லது, “தன் வீட்டுக்குச்.” எபிரெயத்தில்: “தன் இடத்துக்குச்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: அவன் அவளிடம் … என்றான்
  rationale: எபிரெயக் கதையோட்டத்தில் வரும் தொடக்க இணைப்பைத் தமிழில் தனியே மொழிபெயர்க்காமல், இயல்பான நேரடி உரை அமைப்பில் கொடுக்கிறது.
- source_word: קוּמִי
  choice: எழுந்திரு
  rationale: பெண்பால் ஒருமையை நோக்கிய கட்டளை வடிவத்தை இயல்பான நவீனத் தமிழில் துல்லியமாகக் காட்டுகிறது.
- source_word: וְנֵלֵכָה
  choice: நாம் போகலாம்
  rationale: முதலாம் நபர் பன்மை விருப்பவினையின் அழைப்பு அல்லது தூண்டுதல் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: וְאֵין עֹנֶה
  choice: ஆனால் பதில் ஏதும் இல்லை
  rationale: சொல்லுக்குச் சொல் அமைப்பு ‘பதிலளிப்பவர் இல்லை’ என்றாலும், சூழலில் பதிலின்மையைக் குறிக்கும் இயல்பான தமிழ் வடிவம் இது; எதிர்மறைத் திருப்பத்தை ‘ஆனால்’ வெளிப்படுத்துகிறது.
- source_word: וַיִּקָּחֶהָ עַל הַחֲמוֹר
  choice: அவளைக் கழுதையின்மேல் ஏற்றினான்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தான்’; ஆனால் கழுதையின்மேல் என்ற தொடருடன், அவளைத் தூக்கி அல்லது வைத்து ஏற்றிய செயலை இவ்வடிவம் தெளிவாகக் காட்டுகிறது.
- source_word: וַיָּקָם הָאִישׁ
  choice: அந்த மனிதன் எழுந்து
  rationale: קום என்ற வினையை அடுத்துவரும் ‘சென்றான்’ என்பதோடு ஒன்றாக்காமல், மூலத்தின் தொடர்ச்சியான இரு செயல்களையும் காக்கிறது.
- source_word: וַיֵּלֶךְ לִמְקֹמוֹ
  choice: தன் இடத்துக்குச் சென்றான்
  rationale: מקום என்பதன் பரந்த ‘இடம்’ என்ற பொருளைத் தக்கவைக்கிறது; சூழலில் அது அவனுடைய வீடு அல்லது ஊரைக் குறிக்கக்கூடும்.
