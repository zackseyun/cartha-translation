translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. தந்தையின் பணிவான வேண்டுகோளைத் தமிழில் இயல்பாகக் காட்ட மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; இது மூலத்தில் இல்லாத பதவி அல்லது கோட்பாட்டுச் சிறப்பைச் சேர்ப்பதல்ல.
