  text: וַ/יֵּשְׁב֗וּ וַ/יֹּאכְל֧וּ שְׁנֵי/הֶ֛ם יַחְדָּ֖ו וַ/יִּשְׁתּ֑וּ וַ/יֹּ֜אמֶר אֲבִ֤י הַֽ/נַּעֲרָה֙ אֶל הָ/אִ֔ישׁ הֽוֹאֶל נָ֥א וְ/לִ֖ין וְ/יִטַ֥ב לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/006.yaml
  text: So the two of them sat down together and ate and drank. Then the young woman's father said to the man[a], "Please, be willing to stay the night, and let your heart be glad."
translation:
  language: ta
  text: அவர்கள் இருவரும் ஒன்றாக அமர்ந்து சாப்பிட்டுக் குடித்தார்கள். அப்போது இளம்பெண்ணின் தந்தை அந்த மனிதனிடம், “தயவுசெய்து, இரவு தங்கச் சம்மதியுங்கள்; உங்கள் உள்ளம் மகிழட்டும்[a]” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் உள்ளம் களிகூரட்டும்.”
    reason: וְיִטַב לִבֶּךָ என்ற மரபுத்தொடர் மகிழ்ச்சி அல்லது களிப்பைக் குறிக்கலாம்; மாற்று மொழிபெயர்ப்பு அதன் வலுவான களிப்பு நுணுக்கத்தைக் காட்டுகிறது.
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: அமர்ந்து
  rationale: உணவருந்தும் நிகழ்வைத் தொடங்கும் ישׁב என்ற வினையைச் சூழலுக்கு இயல்பாகத் தருகிறது; ‘தங்கியிருந்தார்கள்’ என்ற வேறு சாத்தியத்தை இங்கு தேவையின்றி முன்னிறுத்தவில்லை.
- source_word: וַיֹּאכְלוּ ... וַיִּשְׁתּוּ
  choice: சாப்பிட்டுக் குடித்தார்கள்
  rationale: இரு வினைகளையும் நேரடியாகவும் இயல்பான தமிழ் தொடராகவும் தருகிறது; எதைக் குடித்தார்கள் என்று எபிரெயத்தில் இல்லாத பொருளைச் சேர்க்கவில்லை.
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: அவர்கள் இருவரும் ஒன்றாக
  rationale: ‘அவர்கள் இருவர்’ என்பதையும் ‘ஒன்றாக’ என்பதையும் வைத்து மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: אֲבִי הַנַּעֲרָה
  choice: இளம்பெண்ணின் தந்தை
  rationale: נַעֲרָה என்பதற்கு இச்சூழலில் மரியாதையான, நவீனத் தமிழான ‘இளம்பெண்’ பொருத்தமானது.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: சூழலில் அவர் லேவியர் மற்றும் பெண்ணின் துணைவர் என்றாலும், இவ்வசனம் பயன்படுத்தும் பொதுவான ‘மனிதன்’ என்ற சொல்லையே பாதுகாக்கிறது.
- source_word: הוֹאֶל נָא
  choice: தயவுசெய்து ... இணங்குங்கள்
  rationale: יאל குறிக்கும் விருப்பம் அல்லது சம்மதத்தையும் נָא தரும் பணிவான வேண்டுதலையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְלִין
  choice: இன்றிரவு இங்கே தங்குவதற்கு
  rationale: לון குறிக்கும் இரவுத் தங்குதலை இயல்பான தமிழில் தெரிவிக்கிறது; ‘இன்று’ மற்றும் ‘இங்கே’ ஆகியவை அழைப்பின் உடனடிச் சூழலில் தமிழில் பொருள் தெளிவுக்காக வெளிப்படுத்தப்பட்டுள்ளன.
- source_word: וְיִטַב לִבֶּךָ
  choice: உங்கள் உள்ளம் மகிழட்டும்
  rationale: சொல்லாட்சியிலுள்ள ‘உள்ளம்’ என்பதைப் பாதுகாத்து, ‘உள்ளம் நன்றாக/இனிமையாக இருக்கட்டும்’ என்ற எபிரெய மரபுத்தொடரின் விருந்தோம்பல் சார்ந்த மகிழ்ச்சிப் பொருளை இயல்பாகத் தருகிறது.
