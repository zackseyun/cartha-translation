  yaml_path: translation/ot/judges/019/012.yaml
  text: But his master said to him[a], “We will not turn aside into a foreign city, which is not of the sons of Israel; rather, we will go on as far as Gibeah.”
translation:
  language: ta
  text: அவனுடைய எஜமான் அவனிடம், “இஸ்ரவேலருக்குச் சொந்தமல்லாத அந்நிய நகரத்திற்குள் நாம் வழி விலகிச் செல்ல மாட்டோம்; கிபியா வரைக்கும் தொடர்ந்து செல்வோம்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָיו
  choice: அவனுடைய எஜமான்
  rationale: இங்கு இது தெய்வீகப் பட்டம் அல்ல; வேலைக்காரன்மீது அதிகாரமுள்ள மனித எஜமானைக் குறிக்கிறது.
- source_word: נָסוּר
  choice: நாம் திரும்பிச் செல்ல வேண்டாம்
  rationale: பயணப் பாதையைவிட்டு விலகி நகரத்துக்குள் செல்வதைச் சூழல் குறிக்கிறது; இயல்பான தமிழில் திசைமாற்றத்தையும் நோக்கத்தையும் இது வெளிப்படுத்துகிறது.
- source_word: עִיר נָכְרִי
  choice: அந்நியரின் நகரம்
  rationale: נָכְרִי என்பது இஸ்ரவேலரல்லாத அந்நியரை இங்கு குறிக்கிறது; ‘அந்நியரின் நகரம்’ என்பது நகரத்தின் குடியினத் தன்மையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֲשֶׁר לֹא מִבְּנֵי יִשְׂרָאֵל הֵנָּה
  choice: இஸ்ரவேல் மக்களைச் சேராத
  rationale: எபிரெயச் சொற்றொடர் நகரத்தைக் கூட்டுப்பொருளில் அதன் குடிகளோடு தொடர்புபடுத்துகிறது. ‘இஸ்ரவேல் மக்களைச் சேராத’ என்பது ‘இஸ்ரவேலின் மகன்களில் அல்ல’ என்ற இனக்குழு அடையாளத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וְעָבַרְנוּ
  choice: தொடர்ந்து செல்வோம்
  rationale: இங்கு עָבַר என்பது முன்மொழியப்பட்ட தங்குமிடத்தைத் தவிர்த்து பயணத்தைத் தொடர்வதைக் குறிக்கிறது.
- source_word: עַד גִּבְעָה
  choice: கிபியா வரைக்கும்
  rationale: עַד குறிக்கும் எல்லை அல்லது சென்றடையும் அளவைத் தமிழில் நேரடியாகப் பாதுகாக்கிறது.
