base_translation:
  language: en
  yaml_path: translation/ot/judges/019/008.yaml
  text: He got up early in the morning on the fifth day to go[a], but the young woman's father said, “Please strengthen your heart with a morsel of food, and wait until the day declines.” So the two of them ate.
translation:
  language: ta
  text: ஐந்தாம் நாளில் அவன் புறப்படுவதற்காக அதிகாலையில் எழுந்தான். ஆனால் அந்த இளம்பெண்ணின் தந்தை, “தயவுசெய்து கொஞ்சம் உணவு உண்டு உன் உள்ளத்தை வலுப்படுத்திக்கொள்[a]; பொழுது சாயும்வரை தாமதியுங்கள்” என்றான். ஆகவே அவர்கள் இருவரும் சாப்பிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக, “உன் உள்ளத்தை வலுப்படுத்து.” இது உணவு உண்டு வலிமை பெறுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: அதிகாலையில் எழுந்தான்
  rationale: שׁכם என்பதன் Hiphil வடிவம் அதிகாலையில் எழுவதையோ தொடங்குவதையோ குறிக்கிறது; בַּבֹּקֶר உடன் சேர்ந்து தமிழில் இயல்பாகவும் கால வலியுறுத்தலைக் காத்தும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: ஐந்தாம் நாளில்
  rationale: எபிரெய காலக் குறிப்பை நேரடியாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: לָלֶכֶת
  choice: புறப்படுவதற்காக
  rationale: הלך அடிப்படையில் ‘போகுதல்’ என்றாலும், இச்சூழலில் பயணத்தைத் தொடர இடத்தைவிட்டுப் புறப்படுதல் தெளிவாக இருப்பதால் இயல்பான சூழல் சார்ந்த சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲבִי הַנַּעֲרָה
  choice: அந்த இளம்பெண்ணின் தந்தை
  rationale: נַעֲרָה இங்கு திருமண உறவிலுள்ள இளம் பெண்ணைக் குறிக்கிறது; ‘இளம்பெண்’ என்பது சிறுமி என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: סְעָד נָא לְבָבְךָ
  choice: தயவுசெய்து கொஞ்சம் உணவு உண்டு உன் உள்ளத்தை வலுப்படுத்திக்கொள்
  rationale: ‘உன் இதயத்தைத் தாங்கு/வலுப்படுத்து’ என்ற எபிரெய உருவகத்தை ‘உள்ளம்’ மூலம் காத்து, சூழலில் அது உணவு உண்டு வலிமை பெறுவதைக் குறிக்கிறது என்பதைத் தெளிவாக்குகிறது.
- source_word: וְהִתְמַהְמְהוּ
  choice: தாமதியுங்கள்
  rationale: מהה என்பதன் Hitpael வடிவம் காலந்தாழ்த்துதல் அல்லது தங்கியிருத்தலைக் குறிக்கிறது. பன்மை கட்டளை வடிவமும் தமிழில் காக்கப்பட்டுள்ளது.
- source_word: עַד נְטוֹת הַיּוֹם
  choice: பொழுது சாயும்வரை
  rationale: ‘நாள் சாய்தல்’ என்ற உருவகத்தையும் மாலை நெருங்கும் காலப் பொருளையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: וַיֹּאכְלוּ שְׁנֵיהֶם
  choice: ஆகவே அவர்கள் இருவரும் சாப்பிட்டார்கள்
  rationale: שְׁנֵיהֶם தரும் ‘இருவரும்’ என்ற வெளிப்படையான வலியுறுத்தலைக் காத்து, வேண்டுகோளின் விளைவாக அவர்கள் உண்டதை ‘ஆகவே’ காட்டுகிறது.
