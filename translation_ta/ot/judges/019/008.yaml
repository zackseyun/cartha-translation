translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உள்ளத்தை வலுப்படுத்திக்கொள்’ என்பது மூல உருவகத்தைப் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் மரபுத்தொடர்ப் பொருளை விளக்குகிறது. உரையாடலில் உள்ள ஒருமை (‘உன்’) மற்றும் பன்மை (‘தாமதியுங்கள்’) வேறுபாடு எபிரெய உரையின்படி காக்கப்பட்டுள்ளது.
