  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֹבְרִ֨ים אֲנַ֜חְנוּ מִ/בֵּֽית לֶ֣חֶם יְהוּדָה֮ עַד יַרְכְּתֵ֣י הַר אֶפְרַיִם֒ מִ/שָּׁ֣ם אָנֹ֔כִי וָ/אֵלֵ֕ךְ עַד בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וְ/אֶת בֵּ֤ית יְהוָה֙ אֲנִ֣י הֹלֵ֔ךְ וְ/אֵ֣ין אִ֔ישׁ מְאַסֵּ֥ף אוֹתִ֖/י הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/018.yaml
  text: He said to him[a], “We are passing through from Bethlehem in Judah to the remote parts of the hill country of Ephraim. I am from there, and I went to Bethlehem in Judah, and I am going to the house of Yahweh, but no man is taking me into his house.”
translation:
  language: ta
  text: அவன் அவரிடம், “நாங்கள் யூதாவிலுள்ள பெத்லெகேமிலிருந்து எப்பிராயீம் மலைநாட்டின் தொலைவான பகுதிகளுக்குப் பயணம் செய்துகொண்டிருக்கிறோம். நான் அங்கிருந்து வந்தவன். யூதாவிலுள்ள பெத்லெகேமுக்குப் போனேன்; யாவேவின் இல்லத்திற்குப் போகிறேன்.[a] ஆனால் ஒருவனும் என்னைத் தன் வீட்டில் ஏற்றுக்கொள்ளவில்லை” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் வீட்டிற்குப் போகிறேன்” / “என் வீட்டிற்குப் போகிறேன்.” எபிரெய உரையில் “யாவேவின் இல்லத்திற்குப் போகிறேன்” என்றே உள்ளது; ஆனால் இது சூழலில் எதிர்பாராததாக இருப்பதால், சிலர் இதை ஒரு மரபுத்தொடராகப் புரிந்துகொள்கிறார்கள் அல்லது வேறொரு வாசகத்தை முன்மொழிகிறார்கள்.
    reason: மாற்று வாசிப்பையும் மூல உரையின் சூழல்சார் கடினத்தையும் பதிவு செய்வதற்காக.
lexical_decisions:
- source_word: עֹבְרִים אֲנַחְנוּ
  choice: நாங்கள் … பயணம் செய்துகொண்டிருக்கிறோம்
  rationale: பங்கேற்புப் பெயரெச்சத்துடன் வரும் சுட்டுப்பெயர், நடந்துகொண்டிருக்கும் பயணத்தைக் குறிக்கிறது. தமிழில் இயல்பாகவும் தொடர்நிலைப் பொருளுடனும் மொழிபெயர்க்கப்பட்டது.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: யூதாவிலுள்ள பெத்லெகேமிலிருந்து
  rationale: இடப்பெயரின் புவியியல் அடையாளத்தைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் தருகிறது.
- source_word: יַרְכְּתֵי הַר אֶפְרַיִם
  choice: எப்பிராயீம் மலைநாட்டின் தொலைவான பகுதிகள்
  rationale: יַרְכְּתֵי என்பதன் ‘எல்லைப்புறம்/தொலைவான பகுதி’ என்ற பொருளையும், הַר אֶפְרַיִם என்பதன் நிலவியல் பொருளையும் பாதுகாக்கிறது.
- source_word: מִשָּׁם אָנֹכִי
  choice: நான் அங்குள்ளவன்
  rationale: பேசுபவரின் சொந்த ஊர் அங்கே உள்ளது என்ற எளிய மூலப்பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: וָאֵלֵךְ עַד בֵּית לֶחֶם יְהוּדָה
  choice: யூதாவிலுள்ள பெத்லெகேமுக்குப் போயிருந்தேன்
  rationale: எபிரெய வினை வடிவின் இறந்தகாலப் பொருளைப் பாதுகாத்து, தற்போது திரும்பிச் செல்லும் பயணத்துடன் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ
  choice: இப்போது யாவேவின் இல்லத்திற்குப் போகிறேன்
  rationale: மசோரா உரையில் உள்ள ‘யாவேவின் வீடு/இல்லம்’ என்ற வெளிப்படையான வாசகத்தை முதன்மை உரையில் பாதுகாக்கிறது. சூழலால் முன்மொழியப்படும் வேறு வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְאֵין אִישׁ מְאַסֵּף אוֹתִי הַבָּיְתָה
  choice: ஆனால் ஒருவனும் என்னைத் தன் வீட்டில் ஏற்றுக்கொள்ளவில்லை
  rationale: விருந்தோம்பல் சூழலில் אסף என்பதன் ‘வீட்டிற்குள் ஏற்றுக்கொள்’ என்ற பொருளை இயல்பாகத் தருகிறது; אִישׁ என்பதன் ஆண்பால் ஒருமையையும் ‘ஒருவனும்’ எனப் பாதுகாக்கிறது.
theological_decisions:
- issue: וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ என்ற கடினமான வாசகம்
  choice: யாவேவின் இல்லத்திற்குப் போகிறேன்
  alternative: என் வீட்டிற்குப் போகிறேன் / வீட்டிற்குப் போகிறேன்
  rationale: மசோரா உரை வெளிப்படையாக ‘யாவேவின் இல்லம்’ என்று வாசிக்கிறது. இது சூழலில் எதிர்பாராததாக இருந்தாலும், ஊகத் திருத்தத்தை முதன்மை உரையில் புகுத்தாமல் உண்மையான உரைத் தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: אִישׁ என்ற ஆண்பால் ஒருமை
  choice: ஒருவனும்
  alternative: யாரும்
  rationale: மூலத்தின் ஆண்பால் ஒருமையைத் தக்கவைக்கிறது; இச்சூழலில் வீட்டிற்குள் ஏற்றுக்கொள்ளும் ஆண் வீட்டுத்தலைவர் குறித்த எண்ணத்துடனும் பொருந்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; இயல்பான உரையாடல் ஓட்டத்துடன் கண்ணியமான வேதாகம நடையைக் கடைப்பிடிக்கிறது. இடப்பெயர்கள் வழக்கமான தமிழ் வடிவில் தரப்பட்டுள்ளன. மூலத்தின் கடினமான ‘யாவேவின் இல்லம்’ வாசகம் சீராக்கப்படாமல் முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
