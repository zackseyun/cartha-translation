  verdict: revise
  source_fidelity: மூலத்தின் காலக் குறிப்பு, வருதல், விழுதல், வீட்டின் வாசல், மற்றும் ‘எஜமான்’ என்ற அதிகாரச் சொல்லாட்சி பெரும்பாலும் நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் ‘அங்கேயே கிடந்தாள்’ என்பது மூலத்தில் தனியாகக் கூறப்படாத இடநிலை/தொடர்நிலையைச் சேர்க்கிறது. எபிரெய ‘விழுந்தாள் ... வெளிச்சம் வரும்வரை’ என்ற கால நீட்சியைத் தமிழில் இயல்பாகச் சொல்ல ‘விழுந்துகிடந்தாள்’ பயன்படுத்தலாம்; அது ‘அங்கேயே’ என்ற கூடுதல் வலியுறுத்தலைத் தவிர்க்கிறது. ‘தங்கியிருந்த’ என்பதும் வெறும் ‘இருந்த’ என்பதைக் காட்டிலும் சிறு கூடுதல் நுணுக்கத்தைச் சேர்க்கிறது.
  naturalness: திருத்திய வாசகம் நவீன நிலையான தமிழில் இயல்பாகவும், நிகழ்வின் கடுமையான சுருக்கத்தைப் பாதுகாக்கும் வகையிலும் உள்ளது. ‘விடியல் நெருங்கியபோது’ என்பது தெளிவான இயல்பான காலக் குறிப்பு.
  terminology: ‘தன் எஜமான்’ என்பது אֲדוֹנֶיהָ என்பதிலுள்ள அதிகார உறவை, ‘கணவன்’ என்று விளக்கிவிடாமல், பொருத்தமாக வெளிப்படுத்துகிறது. மாற்றுச் சொல்லாக ‘தன் ஆண்டவர்’ வழங்கும் அடிக்குறிப்பு போதுமானது. ‘அந்த மனிதன் இருந்த’ என்பது שָׁם என்பதன் ‘அங்கே இருந்த’ பொருளை ‘தங்கியிருந்த’ என்பதைக் காட்டிலும் நேரடியாகக் காக்கிறது.
