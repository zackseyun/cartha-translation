source:
  edition: WLC
  text: וַ/תָּבֹ֥א הָ/אִשָּׁ֖ה לִ/פְנ֣וֹת הַ/בֹּ֑קֶר וַ/תִּפֹּ֞ל פֶּ֧תַח בֵּית הָ/אִ֛ישׁ אֲשֶׁר אֲדוֹנֶ֥י/הָ שָּׁ֖ם עַד הָ/אֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/026.yaml
  text: The woman came as morning was dawning and fell at the entrance of the house of the man where her master was[b][a], until it was light.
translation:
  language: ta
  text: விடியல் நெருங்கியபோது[a], அந்தப் பெண் வந்து, தன் எஜமான்[b] இருந்த அந்த மனிதனுடைய வீட்டின் வாசலில் வெளிச்சம் வரும்வரை விழுந்துகிடந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “காலையை நோக்கி” அல்லது “விடியலுக்கு முன்.” எபிரெயச் சொற்றொடர் காலையின் அணுகுதலை அல்லது திருப்பத்தைச் சுட்டுகிறது.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது “தன் ஆண்டவர்.” எபிரெயில் அதிகாரத்தைக் குறிக்கும் “தன் எஜமான்” என்றே உள்ளது; “தன் கணவன்” என்று வெளிப்படையாக இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנוֹת הַבֹּקֶר
  choice: விடியற்காலை நெருங்கியபோது
  rationale: פנה என்பதுடன் வரும் இந்த எபிரெய காலச் சொற்றொடர் காலை நெருங்குவதையோ விடியல் தொடங்குவதையோ குறிக்கிறது. தமிழில் இயல்பாகவும் மூலத்தின் கால இயக்கத்தையும் காக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וַתָּבֹא
  choice: வந்து
  rationale: בוא என்பதன் அடிப்படைப் பொருள் ‘வருதல்’. சூழலில் திரும்பிவந்ததாக இருக்கலாம்; ஆனால் ‘திரும்பி’ என்பது மூல வினையில் வெளிப்படையாக இல்லை.
- source_word: וַתִּפֹּל
  choice: விழுந்தாள்
  rationale: נפל என்பதன் நேரடிப் பொருள் ‘விழுதல்’. ‘சரிந்து விழுந்தாள்’ எனக் காரணத்தையோ தீவிரத்தையோ கூடுதலாக விளக்காமல் மூலத்தின் கடுமையான எளிமை காக்கப்படுகிறது.
- source_word: פֶּתַח בֵּית
  choice: வீட்டின் வாசலில்
  rationale: פֶּתַח என்பது திறப்பு அல்லது நுழைவாயிலைக் குறிக்கிறது. ‘வீட்டின் வாசலில்’ என்பது நவீன தமிழில் இயல்பான, துல்லியமான வடிவம்.
- source_word: הָאִישׁ
  choice: அந்த மனிதன்
  rationale: אִישׁ என்பதன் சாதாரணப் பொருள் ‘மனிதன்/ஆண்’. சூழலில் வீட்டுக்கார முதியவரைக் குறித்தாலும், மூலத்தைவிடக் குறிப்பாக்காமல் மொழிபெயர்க்கப்படுகிறது.
- source_word: אֲדוֹנֶיהָ
  choice: தன் எஜமான்
  rationale: אָדוֹן மற்றும் பெண்பால் ஒருமை உடைமை விகுதி சேர்ந்து ‘அவளுடைய எஜமான்/ஆண்டவர்’ என அதிகார உறவைக் குறிக்கிறது; ‘கணவன்’ என்று வெளிப்படையாகச் சொல்லவில்லை. இங்கு ‘எஜமான்’ அந்த சமூக அதிகார உறவைத் தெளிவாகக் காக்கிறது.
- source_word: שָׁם
  choice: தங்கியிருந்த
  rationale: אֲשֶׁר ... שָׁם என்பது ‘அவர் அங்கே இருந்த’ என்ற உறவுநிலை அமைப்பு. தமிழில் ‘தங்கியிருந்த’ என்பது அந்த வீட்டில் அவர் இருந்ததை இயல்பாகத் தெரிவிக்கிறது; இருப்பினும் தங்குதல் என்ற சூழல்சார் நுணுக்கம் சேர்கிறது.
- source_word: עַד הָאוֹר
  choice: வெளிச்சம் வரும்வரை
  rationale: இந்தச் சொற்றொடர் பகலொளி தோன்றும் வரையிலான காலத்தைச் சுட்டுகிறது. தமிழில் ‘வெளிச்சம் வரும்வரை’ என்பது நேரடியும் இயல்புமான வடிவம்.
theological_decisions:
- issue: אֲדוֹנֶיהָ குறிக்கும் உறவு
  choice: தன் எஜமான்
  alternative: தன் கணவன்
  rationale: அந்த ஆண் கதைச்சூழலில் அவளுடைய துணைவனாக இருந்தாலும், எபிரெயச் சொல் திருமண உறவுப் பெயரை அல்ல, அதிகாரத்தைக் குறிக்கும் ‘எஜமான்/ஆண்டவர்’ என்ற சொல்லையே பயன்படுத்துகிறது. அந்த பதற்றத்தை மொழிபெயர்ப்பு மறைக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘எஜமான்’ சமூக அதிகார உறவைப் பாதுகாக்கிறது. கடைசி வாக்கியத்தில் ‘அங்கேயே கிடந்தாள்’ என்பது எபிரெயில் வெளிப்படையாக மீண்டும் சொல்லப்படாத நிலையைக் கால நீடிப்பு இயல்பாகத் தெரிவிக்கச் சேர்க்கிறது.
