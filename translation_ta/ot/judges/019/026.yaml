revisions:
- from: விடியற்காலை நெருங்கியபோது[a], அந்தப் பெண் வந்து, தன் எஜமான்[b] தங்கியிருந்த அந்த மனிதனுடைய வீட்டின் வாசலில் விழுந்தாள்; வெளிச்சம் வரும்வரை அங்கேயே கிடந்தாள்.
  to: விடியல் நெருங்கியபோது[a], அந்தப் பெண் வந்து, தன் எஜமான்[b] இருந்த அந்த மனிதனுடைய வீட்டின் வாசலில் வெளிச்சம் வரும்வரை விழுந்துகிடந்தாள்.
  rationale: ‘அங்கேயே கிடந்தாள்’ என்ற தனிக் கூடுதல் கூறு நீக்கப்பட்டது. எபிரெய வாக்கியத்தின் ‘விழுந்தாள் ... வெளிச்சம் வரும்வரை’ என்ற தொடர்நிலையைத் தமிழில் இயல்பாகத் தர ‘விழுந்துகிடந்தாள்’ பயன்படுத்தப்பட்டுள்ளது. ‘தங்கியிருந்த’ ‘இருந்த’ எனத் திருத்தப்பட்டு, மூலத்தின் குறைந்தபட்சக் குறிப்பே காக்கப்பட்டுள்ளது. அடிக்குறிப்பு அ தெளிவாகவும் நவீன தமிழுக்கு ஏற்றதாகவும் திருத்தப்பட்டுள்ளது.
