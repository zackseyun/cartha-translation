translation_notes:
  register: நவீன தரநிலைத் தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் கதைசொல்லும் ‘இதோ’ தக்கவைக்கப்பட்டுள்ளது; גור என்பதிலுள்ள அந்நியர்/தற்காலிகக் குடியிருப்பாளர் நுணுக்கம் உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
