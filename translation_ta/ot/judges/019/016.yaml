base_translation:
  language: en
  yaml_path: translation/ot/judges/019/016.yaml
  text: And behold[a], an old man was coming in from his work in the field at evening. The man was from the hill country of Ephraim, and he was staying in Gibeah[b], but the men of the place were Benjaminites.
translation:
  language: ta
  text: இதோ, ஒரு முதியவர் மாலையில் வயலில் தம் வேலையிலிருந்து வந்து கொண்டிருந்தார். அவர் எப்பிராயீம் மலைநாட்டைச் சேர்ந்தவர்; கிபியாவில் தங்கியிருந்தார்.[a] ஆனால் அந்த இடத்து மக்கள் பென்யமீனியர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தங்கியிருந்தார்” என்பதற்கான எபிரெய வினைச்சொல், அங்கே வசித்தார் அல்லது சொந்த ஊரல்லாத இடத்தில் தற்காலிகமாகத் தங்கியிருந்தார் என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கதையில் கவனிக்கத்தக்க புதிய நிகழ்வைச் சுட்டும் எபிரெய உரையாடல் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אִישׁ זָקֵן
  choice: முதியவர் ஒருவர்
  rationale: வயதைக் குறிக்கும் பொருளை மரியாதையான, நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: בָּא מִן מַעֲשֵׂהוּ מִן הַשָּׂדֶה
  choice: வயலில் தமது வேலையை முடித்துவிட்டு வந்துகொண்டிருந்தார்
  rationale: சொல்லர்த்தத்தில் ‘வயலிலுள்ள தமது வேலையிலிருந்து வந்தார்’; தமிழில் இயக்கத்தின் புறப்படும் இடத்தையும் வேலை முடிந்து திரும்பும் சூழலையும் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בָּעֶרֶב
  choice: மாலையில்
  rationale: காலக் குறிப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: מֵהַר אֶפְרַיִם
  choice: எப்பிராயீம் மலைநாட்டைச் சேர்ந்தவர்
  rationale: இது தனி மலையைக் காட்டிலும் எப்பிராயீமின் மலைப்பாங்கான நிலப்பகுதியைக் குறிக்கும் புவியியல் பெயராகும்.
- source_word: גָר בַּגִּבְעָה
  choice: கிபியாவில் அந்நியராகக் குடியிருந்தார்
  rationale: גור என்பது பிறப்பிடத்துக்கு வெளியே அந்நியர் அல்லது தற்காலிகக் குடியிருப்பாளராக வாழ்வதைக் குறிக்கக்கூடும்; ‘குடியிருந்தார்’ என்பதுடன் ‘அந்நியராக’ சேர்ப்பது அந்த நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: וְאַנְשֵׁי הַמָּקוֹם
  choice: ஆனால் அந்த இடத்து மக்கள்
  rationale: எபிரெய இணைப்புச் சொல் பொதுவாக ‘மற்றும்’ என்றாலும், முதியவரின் வேற்றிடப் பின்னணிக்கும் உள்ளூர் மக்களின் கோத்திர அடையாளத்திற்கும் உள்ள உட்கருத்து முரணை ‘ஆனால்’ தெளிவாக்குகிறது.
- source_word: בְּנֵי יְמִינִי
  choice: பென்யமீனியர்
  rationale: ‘பென்யமீனின் மக்கள்/புதல்வர்கள்’ என்ற கோத்திர அடையாளத்தை நவீன தமிழில் இயல்பாகத் தருகிறது.
