base_translation:
  language: en
  yaml_path: translation/ot/judges/019/024.yaml
  text: Look[a], here are my virgin daughter and his concubine. Please let me bring them out. Violate them and do to them what is good in your eyes[c][b]. But to this man do not do this outrageous thing.
translation:
  language: ta
  text: இதோ, கன்னியான என் மகளும் அவனுடைய மறுமனையாட்டியும் இருக்கிறார்கள். தயவுசெய்து, அவர்களை வெளியே கொண்டு வர அனுமதியுங்கள். அவர்களைப் பாலியல் வன்முறைக்கு உள்ளாக்குங்கள்[a]; உங்கள் கண்களுக்கு நலமாகத் தோன்றுவதை அவர்களுக்குச் செய்யுங்கள்[b]. ஆனால் இந்த மனிதனுக்கு இந்தக் கேவலமான செயலைச் செய்யாதீர்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை “அவர்களை வன்புணருங்கள்” என்றும் மொழிபெயர்க்கலாம். இச்சூழலில் எபிரெய வினை பாலியல் வன்முறையையும் அவமதிப்பையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “உங்கள் கண்களுக்கு நலமாகத் தோன்றுவது” என்பது, “உங்களுக்கு விருப்பமானதை” என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: c
    text: “இந்த இழிவான செயல்” அல்லது “இந்த மதிகெட்ட செயல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: அவசரமாகக் கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லின் சுட்டும் வலிமையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: בִתִּי הַבְּתוּלָה
  choice: கன்னியான என் மகள்
  rationale: மகளைக் கன்னியாக அடையாளப்படுத்தும் மூலத்தின் பொருளை, வெறும் திருமண நிலையாக மாற்றாமல் நேரடியாகத் தருகிறது.
- source_word: וּפִילַגְשֵׁהוּ
  choice: அவனுடைய மறுமனையாட்டி
  rationale: פִּילֶגֶשׁ குறிக்கும், முழு மனைவி நிலைக்கு கீழான துணைவி என்ற பண்டைய சமூக உறவைத் தமிழில் வழக்கமான வேதாகமச் சொல்லால் காட்டுகிறது.
- source_word: אוֹצִיאָה נָּא אוֹתָם
  choice: தயவுசெய்து அவர்களை வெளியே கொண்டுவருகிறேன்
  rationale: முதல் நபர் விருப்பத்தை உணர்த்தும் cohortative வடிவத்தையும் נָא என்பதன் வேண்டுகோள் நயத்தையும் காக்கிறது; மூலத்தில் இல்லாத ‘உங்களிடம்’ என்பதைக் கூட்டவில்லை.
- source_word: וְעַנּוּ אוֹתָם
  choice: அவர்களைப் பாலியல் வன்முறைக்கு உள்ளாக்கி
  rationale: Piel ענה இச்சூழலில் குறிக்கும் பாலியல் அவமதிப்பையும் வன்முறையையும் மறைக்காமல் கூறுகிறது; அதேவேளை வினைச்சொல் தனியாகத் தீர்மானிக்காத அளவுக்கு சட்டரீதியான குறிப்பைத் திணிக்கவில்லை.
- source_word: וַעֲשׂוּ לָהֶם הַטּוֹב בְּעֵינֵיכֶם
  choice: உங்கள் கண்களுக்கு நலமாகத் தோன்றுவதை அவர்களுக்குச் செய்யுங்கள்
  rationale: ‘உங்கள் கண்களில் நலமானது’ என்ற எபிரெய உருவகத்தைத் தெளிவான தமிழில் தக்கவைத்து, அவர்கள் விரும்பியபடி செய்வது என்ற கொடூரமான பொருளையும் வாசகர் உணர விடுகிறது.
- source_word: וְלָאִישׁ הַזֶּה
  choice: ஆனால் இந்த மனிதனுக்கு
  rationale: பெண்களுடன் இந்த மனிதனை எதிர்மறையாக ஒப்பிடும் முன்னிலைப்படுத்தப்பட்ட சொற்றொடரின் வலியுறுத்தலைக் காக்கிறது.
- source_word: דְּבַר הַנְּבָלָה הַזֹּאת
  choice: இந்தக் கேவலமான செயல்
  rationale: נְבָלָה குறிக்கும் கடுமையான ஒழுக்கச் சீர்கேட்டையும் சமூக அவமானத்தையும், ‘முட்டாள்தனம்’ என மெலிதாக்காமல் இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: பாலியல் வன்முறையைக் குறிக்கும் ענה வினையின் தெளிவும் அதன் சொற்பொருள் எல்லையும்
  choice: பாலியல் வன்முறைக்கு உள்ளாக்கி
  alternative: அவர்களை வன்புணர்ச்சி செய்து / அவர்களை அவமானப்படுத்தி
  rationale: கதைச்சூழலில் பாலியல் தாக்குதல் தெளிவாக இருப்பதால் அதை மறைக்கக் கூடாது. ஆனால் ‘வன்புணர்ச்சி’ என்பது வினைச்சொல் தனியாகக் காட்டுவதைக் காட்டிலும் சற்றுக் குறிப்பானது; ‘அவமானப்படுத்தி’ என்பது இச்சூழலின் பாலியல் வன்முறையை மிகையாக மறைக்கலாம்.
- issue: נְבָלָה என்பதன் ஒழுக்க மதிப்பீடு
  choice: கேவலமான செயல்
  alternative: இழிவான செயல் / மதிகெட்ட செயல்
  rationale: இது வெறும் அறிவீனத்தை அல்ல, மிகக் கடுமையான ஒழுக்க மற்றும் சமூக அக்கிரமத்தைக் குறிக்கிறது. ‘கேவலமான செயல்’ அந்தக் கண்டனத்தை பொதுவாகப் புரியும் நவீன தமிழில் தருகிறது.
- issue: பேசுபவரின் சிதைந்த ஒழுக்க முன்னுரிமையை மொழிபெயர்ப்பில் சரிசெய்யாமல் காப்பது
  choice: பெண்களுக்குச் செய்யப்படவிருக்கும் வன்முறையை முன்மொழிந்தபடியே, மனிதனுக்கெதிரான செயலை மட்டும் ‘கேவலமானது’ என்று அவர் கூறும் பதற்றத்தை அப்படியே வைத்தல்
  alternative: மொழிபெயர்ப்பில் பெண்களுக்கெதிரான முன்மொழிவையும் வெளிப்படையாகக் கண்டிக்கும் சொற்களைச் சேர்த்தல்
  rationale: விவரிப்பு இக்கூற்றை ஒழுக்கரீதியாக அங்கீகரிக்கவில்லை. மொழிபெயர்ப்பாளர் பேசுபவரின் கொடூரமான இரட்டை அளவுகோலைத் திருத்திச் சொல்லாமல், உரையின் அதிர்ச்சியூட்டும் பதற்றத்தை வாசகரிடம் விட்டுவிட வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான ஆனால் நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. கொடூரத்தை மென்மைப்படுத்தவில்லை; அதேவேளை மூலத்தின் சொற்பொருள் எல்லையை மீறும் தேவையற்ற சட்ட அல்லது சமய விளக்கங்கள் சேர்க்கப்படவில்லை. எல்லா அடிக்குறிப்பு குறிகளும் தொடர்புடைய முதன்மை உரையில் இடம்பெற்றுள்ளன.
