  revised_text: இதோ, கன்னியான என் மகளும் அவனுடைய மறுமனையாட்டியும் இருக்கிறார்கள். தயவுசெய்து, அவர்களை வெளியே கொண்டு வர அனுமதியுங்கள். அவர்களைப் பாலியல் வன்முறைக்கு உள்ளாக்குங்கள்[a]; உங்கள் கண்களுக்கு நலமாகத் தோன்றுவதை அவர்களுக்குச் செய்யுங்கள்[b]. ஆனால் இந்த மனிதனுக்கு இந்தக் கேவலமான செயலைச் செய்யாதீர்கள்[c].
