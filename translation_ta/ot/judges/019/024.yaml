  source_fidelity: 'மூலத்தின் முக்கிய கூறுகள் பெரும்பாலும் காக்கப்பட்டுள்ளன: கன்னியான மகள், அவனுடைய மறுமனையாட்டி, வெளியே கொண்டுவரும் வேண்டுகோள், பாலியல் அவமதிப்பு/வன்முறை, ‘உங்கள் கண்களுக்கு நலமாகத் தோன்றுவது’ என்ற மரபுத்தொடர், மற்றும் மனிதனுக்கு எதிராகச் செய்யக்கூடாத நெவாலா செயல் ஆகியவை உள்ளன. ஆனால் “தயவுசெய்து அவர்களை வெளியே கொண்டுவருகிறேன்” என்பது எபிரெய cohortative வேண்டுகோளைத் தமிழில் இயல்பாக வெளிப்படுத்தவில்லை; அது ஒரு சாதாரண நிகழ்காலக் கூற்றாகத் தோன்றுகிறது.'
  naturalness: “தயவுசெய்து, அவர்களை வெளியே கொண்டு வர அனுமதியுங்கள்” என்பது நவீனத் தமிழில் தெளிவான வேண்டுகோளாக அமைகிறது. பாலியல் வன்முறையைக் குறிக்கும் தொடரையும் இணைவினை வடிவிலிருந்து நேரடி பன்மை ஏவலாக மாற்றுவது மூலத்தின் கட்டளைத் தன்மையையும் தமிழின் ஓட்டத்தையும் மேம்படுத்துகிறது.
  terminology: “மறுமனையாட்டி” பண்டைய சமூக உறவைக் குறிக்க ஏற்ற, வேதாகமப் பயன்பாட்டில் நிலைபெற்ற சொல். “பாலியல் வன்முறைக்கு உள்ளாக்குங்கள்” என்பது ענה வினையின் இச்சூழல் பாலியல்-அவமதிப்பு வலிமையைத் தெளிவாகக் காட்டுகிறது; அடிக்குறிப்பில் உள்ள “வன்புணருங்கள்” மாற்றுவாசகம் அதைவிடச் குறிப்பான மாற்றாகச் சரியாக விளக்கப்படுகிறது. “கேவலமான செயல்” நெவாலாவின் கடுமையான ஒழுக்கக் கண்டனத்தைப் போதுமானவாறு தருகிறது.
