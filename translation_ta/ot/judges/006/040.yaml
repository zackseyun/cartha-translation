  yaml_path: translation/ot/judges/006/040.yaml
  text: And God did so that night[a], and there was dryness on the fleece alone, and on all the ground there was dew.
translation:
  language: ta
  text: அந்த இரவில் கடவுள் அவ்வாறே செய்தார். ஆட்டுமயிர்க் குவியல் மட்டும் உலர்ந்திருந்தது; தரை முழுவதிலும்[a] பனித்துளிகள் படிந்திருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நிலம் முழுவதிலும்.’ எபிரெயச் சொல்லான אֶרֶץ என்பதற்கு ‘தரை,’ ‘நிலம்,’ அல்லது ‘பூமி’ என்று பொருள் கொள்ளலாம்; இங்கு கிதியோனின் அடையாளம் நிகழும் உடனடிச் சூழலுக்கு ‘தரை’ மிகவும் பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ אֱלֹהִים כֵּן
  choice: கடவுள் அவ்வாறே செய்தார்
  rationale: கிதியோன் கேட்ட அடையாளத்தைப் பின்னோக்கிச் சுட்டும் כֵּן என்பதையும், எபிரெய உரையின் சுருக்கமான கதைநடையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בַּלַּיְלָה הַהוּא
  choice: அந்த இரவில்
  rationale: குறிப்பிட்ட அந்த இரவைக் குறிக்கும் காலச் சொற்றொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: חֹרֶב אֶל הַגִּזָּה לְבַדָּהּ
  choice: வெட்டப்பட்ட ஆட்டுமயிர் மட்டும் உலர்ந்திருந்தது
  rationale: גִּזָּה என்பது உரிக்கப்பட்ட தோலை அல்ல, வெட்டியெடுக்கப்பட்ட ஆட்டுமயிர்த் தொகுதியைக் குறிக்கிறது. חֹרֶב என்ற பெயர்ச்சொல்லின் உலர்ந்த நிலையை இயல்பான தமிழில் வினையடை வடிவில் தெரிவிக்கிறது; לְבַדָּהּ குறிக்கும் தனித்தன்மையும் ‘மட்டும்’ என்பதால் தெளிவாகிறது.
- source_word: וְעַל כָּל הָאָרֶץ
  choice: தரை முழுவதிலும்
  rationale: இந்த அடையாளத்தின் உடனடி காட்சிச்சூழலில் אֶרֶץ சுற்றியுள்ள தரையைக் குறிப்பதாகப் புரிந்துகொள்வது பொருத்தம்; சொல்லின் விரிவான பொருள் வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: טָל
  choice: பனித்துளிகள்
  rationale: טָל என்பது பனிப்பொழிவை அல்ல, தரையில் படியும் dew-ஐக் குறிக்கிறது. ‘பனித்துளிகள்’ என்பது நவீன தமிழில் அந்தப் பொருளைத் தெளிவாக வேறுபடுத்துகிறது.
