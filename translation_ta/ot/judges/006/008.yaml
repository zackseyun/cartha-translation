source:
  edition: WLC
  text: וַ/יִּשְׁלַ֧ח יְהוָ֛ה אִ֥ישׁ נָבִ֖יא אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּה אָמַ֥ר יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אָנֹכִ֞י הֶעֱלֵ֤יתִי אֶתְ/כֶם֙ מִ/מִּצְרַ֔יִם וָ/אֹצִ֥יא אֶתְ/כֶ֖ם מִ/בֵּ֥ית עֲבָדִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/008.yaml
  text: 'Then Yahweh sent a man[a], a prophet, to the sons of Israel, and he said to them, “Thus says Yahweh, the God of Israel: I brought you up from Egypt[b], and I brought you out from the house of slavery.”'
translation:
  language: ta
  text: 'அப்போது யாவே ஒரு மனிதனை—ஒரு தீர்க்கதரிசியை—இஸ்ரவேலின் மகன்களிடம்[a] அனுப்பினார். அவர் அவர்களிடம், “இஸ்ரவேலின் கடவுளாகிய யாவே கூறுவது இதுவே: நானே உங்களை எகிப்திலிருந்து மேலே கொண்டுவந்தேன்; அடிமைத்தனத்தின் வீட்டிலிருந்து[b] உங்களை வெளியே கொண்டுவந்தேன்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “இஸ்ரவேலரிடம்”; நேரடியாக, “இஸ்ரவேலின் மகன்களிடம்.”
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “அடிமைகளின் வீட்டிலிருந்து.”
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அப்போது ... அனுப்பினார்
  rationale: தொடர்நிகழ்வைக் குறிக்கும் waw-consecutive-ஐ இயல்பான தமிழ் கதைநடையில் ‘அப்போது’ என வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய தனிப்பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אִישׁ נָבִיא
  choice: ஒரு மனிதனை—ஒரு தீர்க்கதரிசியை—
  rationale: இரண்டு பெயர்ச்சொற்களையும் ஒட்டுநிலையில் வைத்துள்ள எபிரெய அமைப்பைப் பாதுகாக்கிறது; தமிழில் இடைக்கோடுகள் இரண்டாவது சொல் முதலாவதை விளக்குவதைத் தெளிவாக்குகின்றன.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களிடம்
  rationale: ‘இஸ்ரவேலின் மகன்கள்’ என்ற உடன்படிக்கை மக்களைக் குறிக்கும் மூலமொழியின் வழக்குப் பெயரை முறையாகப் பாதுகாக்கிறது; இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: தீர்க்கதரிசனத் தூதர் சூத்திரத்தின் நிகழ்கால வலிமையையும் நவீன தமிழின் இயல்பையும் தக்கவைக்கிறது.
- source_word: אָנֹכִי
  choice: நானே
  rationale: தனியே இடம்பெறும் வலியுறுத்தப்பட்ட முதலாம் நபர் சுட்டுப்பெயரின் அழுத்தத்தைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֶעֱלֵיתִי ... מִמִּצְרַיִם
  choice: எகிப்திலிருந்து மேலே கொண்டுவந்தேன்
  rationale: யாத்திராகமத்தை விவரிக்கும் עלה வினையின் ‘மேலே கொண்டுவருதல்’ என்ற திசை உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וָאֹצִיא
  choice: வெளியே கொண்டுவந்தேன்
  rationale: Hiphil வடிவின் ‘வெளியே வரச்செய்தல்’ என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: מִבֵּית עֲבָדִים
  choice: அடிமைத்தனத்தின் வீட்டிலிருந்து
  rationale: ‘வீடு’ என்ற மூல உருவகத்தைத் தக்கவைத்தபடி, முழுச் சொற்றொடரின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; சொற்பொருள் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற கூட்டுப்பெயர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தையும் உடன்படிக்கைச் சொல்லாட்சியையும் முதன்மை உரையில் பாதுகாத்து, இயல்பான இனப்பெயரை அடிக்குறிப்பில் அளிக்கிறது.
- issue: בֵּית עֲבָדִים என்பதன் உருவகம்
  choice: அடிமைத்தனத்தின் வீடு
  alternative: அடிமைகளின் வீடு
  rationale: எபிரெய மொழியில் நேரடியாக ‘அடிமைகளின் வீடு’ என்றிருந்தாலும், அது அடிமைப்படுத்தப்பட்ட நிலையையும் இடத்தையும் குறிக்கிறது. முதன்மை உரை இயல்பான தமிழைப் பயன்படுத்துகிறது; சொற்சொல்லான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. தீர்க்கதரிசன அறிவிப்பு உயர்ந்த நடையைத் தக்கவைக்கிறது; அரிதான பழந்தமிழ் சொற்கள் தவிர்க்கப்பட்டுள்ளன. ‘யாவே’ தனிப்பெயராகவும், ‘தீர்க்கதரிசி’ பரவலாகப் புரிந்துகொள்ளப்படும் சமயச் சொல்லாகவும் பயன்படுத்தப்பட்டுள்ளன.
