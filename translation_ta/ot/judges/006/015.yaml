source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ בִּ֣י אֲדֹנָ֔/י בַּ/מָּ֥ה אוֹשִׁ֖יעַ אֶת יִשְׂרָאֵ֑ל הִנֵּ֤ה אַלְפִּ/י֙ הַ/דַּ֣ל בִּ/מְנַשֶּׁ֔ה וְ/אָנֹכִ֥י הַ/צָּעִ֖יר בְּ/בֵ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/015.yaml
  text: But he said to him[a], “Please, my lord, how can I save Israel? Look, my clan is the weakest in Manasseh[c][b], and I am the youngest in my father’s house.”
translation:
  language: ta
  text: அவன் அவரிடம், “தயவுசெய்து, தலைவரே, நான் எப்படி இஸ்ரவேலைக் காப்பாற்ற முடியும்? இதோ, மனாசே கோத்திரத்தில் என் குலமே மிகவும் வலிமையற்றது[a]; என் தந்தையின் குடும்பத்தில் நானே இளையவன்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மிகவும் ஏழ்மையானது’ அல்லது ‘மிகவும் தாழ்ந்தது’ என்றும் மொழிபெயர்க்கலாம். ‘என் குலம்’ என்பதற்கான எபிரெயச் சொல் நேரடியாக ‘என் ஆயிரம்’ எனப் பொருள்பட்டு, ஒரு குலப்பிரிவைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘மிகவும் சிறியவன்’ அல்லது ‘முக்கியத்துவம் மிகக் குறைந்தவன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: தயவுசெய்து கேளுங்கள்
  rationale: இங்கு இது இடப்பொருளில் வராமல், பணிவான வேண்டுகோளை அறிமுகப்படுத்தும் உரையாடல் இடைச்சொல்லாக வருகிறது. நவீன தமிழில் இயல்பாகவும் மரியாதையுடனும் ஒலிக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אֲדֹנָי
  choice: தலைவரே
  rationale: பேசப்படுகிறவருக்கு மரியாதை காட்டும் அழைப்பு இது; இவ்விடத்திலேயே அதைத் தெளிவான இறைப்பட்டமாக மாற்றாமல், கதையிலுள்ள அடையாளத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: בַּמָּה
  choice: எப்படி
  rationale: கிதியோன் எந்த வழியால் அல்லது எந்தத் திறனால் இஸ்ரவேலைக் காப்பாற்ற முடியும் என்று கேட்கிறான்; தமிழில் ‘எப்படி’ என்பது இயல்பான சூழல்சார் இணை.
- source_word: אוֹשִׁיעַ
  choice: நான் ... காப்பாற்ற முடியும்
  rationale: יָשַׁע என்பதன் ஹிஃபில் வடிவம் காப்பாற்றுதல் அல்லது விடுவித்தல் என்ற பொருளைத் தருகிறது. கேள்வியின் இயல்பான தமிழ்நடைக்காக ‘முடியும்’ சேர்க்கப்பட்டது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: தொடர்ந்து வரும் காரணத்துக்கு கவனத்தைத் திருப்பும் எபிரெயச் சொல்லின் சுட்டும் வலிமையைப் பாதுகாக்கிறது.
- source_word: אַלְפִּי
  choice: என் குலம்
  rationale: சொல்லின் நேரடித் தொடர்பு ‘ஆயிரம்’ என்பதோடு இருந்தாலும், இத்தகைய கோத்திரச் சமூகச் சூழலில் அது ஒரு குலப்பிரிவைக் குறிக்கலாம். ‘குலம்’ தவறான எண்ணியல் புரிதலைத் தவிர்க்கிறது.
- source_word: הַדַּל
  choice: மிகவும் வலிமையற்றது
  rationale: דַּל என்பது பலவீனம், தாழ்ந்த நிலை அல்லது வறுமையைக் குறிக்கலாம். கிதியோன் தன் குலத்தின் ஆற்றலின்மையையும் முக்கியமின்மையையும் கூறும் இச்சூழலில் ‘வலிமையற்றது’ பொருத்தமானது; பிற வாய்ப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: בִּמְנַשֶּׁה
  choice: மனாசே கோத்திரத்தில்
  rationale: மனாசே என்ற பெயர் இங்கு கோத்திரத்தைக் குறிப்பதால், தமிழ் வாசகருக்கு உறவைத் தெளிவுபடுத்த ‘கோத்திரத்தில்’ சேர்க்கப்பட்டது.
- source_word: הַצָּעִיר
  choice: இளையவன்
  rationale: இச்சொல் இளையவன், சிறியவன் அல்லது முக்கியத்துவம் குறைந்தவன் எனப் பொருள்படலாம். தந்தையின் வீட்டைப் பற்றிய குடும்பச் சூழலில் ‘இளையவன்’ இயல்பான முதன்மைப் பொருள்.
- source_word: בְּבֵית אָבִי
  choice: என் தந்தையின் வீட்டில்
  rationale: தந்தைவழிக் குடும்பம் அல்லது குடும்பக் குழுவைக் குறிக்கும் வழக்கமான எபிரெயச் சொற்றொடர். மூல உருவகத்தையும் தமிழில் புரியத்தக்க நடையையும் இது பாதுகாக்கிறது.
theological_decisions:
- issue: கிதியோன் பயன்படுத்தும் אֲדֹנָי என்ற அழைப்பின் வலிமை
  choice: மரியாதைக்குரிய ஒருவரை அழைக்கும் ‘தலைவரே’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: இறைப்பட்டமாகத் தெளிவுபடுத்தி ‘ஆண்டவரே’ என்று மொழிபெயர்த்தல்
  rationale: இப்பேச்சுக் கட்டத்தில் பேசுகிறவரின் அடையாளம் குறித்த கதையின் பதற்றம் இன்னும் முழுமையாகத் தீரவில்லை. ஆகவே உடனடியாக இறைப்பட்டத்தைத் திணிக்காமல், மரியாதையான அழைப்பாகவே மொழிபெயர்ப்பது மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தலைவரே’ என்பது பழமையான மொழிநடையைத் தவிர்த்து மரியாதையை வெளிப்படுத்துகிறது; ‘என் தந்தையின் வீடு’ என்ற வேதாகமச் சமூகச் சொற்றொடர் அதன் குடும்பப் பொருள் புரியுமாறு தக்கவைக்கப்பட்டுள்ளது.
