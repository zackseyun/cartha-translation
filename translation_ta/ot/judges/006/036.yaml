translation:
  language: ta
  text: அப்போது கிதியோன் கடவுளிடம், “நீர் சொன்னபடியே இஸ்ரவேலை என் கையால் மீட்கப்போகிறீர் என்றால்,” என்று சொன்னான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... சொன்னான்
  rationale: வாவ் தொடர்வினை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; ‘அப்போது’ அதன் தொடர்ச்சித் தன்மையை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: אֶל הָאֱלֹהִים
  choice: கடவுளிடம்
  rationale: சூழலில் கிதியோன் இஸ்ரவேலின் கடவுளிடமே பேசுகிறான்; எபிரெயக் கட்டுரையைத் தமிழில் தனியே மொழிபெயர்க்கத் தேவையில்லை.
- source_word: אִם
  choice: என்றால்
  rationale: அடுத்த வசனத்திலும் தொடரும் நிபந்தனை வாக்கியத்தைத் தெளிவாகவும் இயல்பாகவும் தொடங்குகிறது.
- source_word: יֶשְׁךָ מוֹשִׁיעַ
  choice: மீட்கப்போகிறீர்
  rationale: יֵשׁ + இரண்டாம் நபர் பின்னொட்டு + வினையெச்சம் வரவிருக்கும் செயல் அல்லது நோக்கத்தைக் குறிக்கிறது; ‘மீட்கப்போகிறீர்’ அந்த முன்னோக்கிய நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: בְּיָדִי
  choice: என் கையால்
  rationale: கிதியோனைச் செயற்கருவியாகக் காட்டும் எபிரெய உருவகத்தையும் முகமைப் பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை
  rationale: אֵת குறிக்கும் நேரடி செயப்படுபொருள் தமிழின் வேற்றுமை உருபால் இயல்பாக வெளிப்படுகிறது.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: நீர் சொன்னபடியே
  rationale: கடவுள் முன்பு கூறியதைச் சுட்டும் பொருளை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
theological_decisions:
- issue: אֱלֹהִים என்பதைக் கிதியோன் உரையாடும் சூழலில் மொழிபெயர்த்தல்
  choice: கடவுள்
  alternative: ஒரு தெய்வம் / அந்தக் கடவுள்
  rationale: சூழலில் குறிப்பிடப்படுவது இஸ்ரவேலின் கடவுள்; ‘கடவுள்’ என்பது கூடுதல் கோட்பாட்டுக் கருத்தைச் சேர்க்காமல் அந்தக் குறிப்பிட்ட தொடர்பை வெளிப்படுத்துகிறது.
- issue: מוֹשִׁיעַ என்பதின் இராணுவ மற்றும் இறையியல் பரப்பு
  choice: மீட்க
  alternative: காப்பாற்ற
  rationale: இங்கு மிதியானியரின் ஒடுக்குமுறையிலிருந்து விடுவிக்கும் செயல் முன்னிலையில் உள்ளது; ‘மீட்க’ அந்த விடுதலைப் பொருளைத் தெளிவாகத் தருவதோடு இறையியல் ஒலியையும் முற்றிலும் இழக்காது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. நிபந்தனை அடுத்த வசனத்தில் நிறைவடைவதால், வசன முடிவில் வாக்கியத்தை முடிக்காமல் காற்புள்ளி வைக்கப்பட்டுள்ளது. மரியாதை ஒருமை ‘நீர்/கிறீர்’ கடவுளை நேரடியாகச் சுட்டும் தமிழ்நடைக்கு ஏற்ப பயன்படுத்தப்பட்டுள்ளது.
