  text: וְ/כָל מִדְיָ֧ן וַ/עֲמָלֵ֛ק וּ/בְנֵי קֶ֖דֶם נֶאֶסְפ֣וּ יַחְדָּ֑ו וַ/יַּעַבְר֥וּ וַֽ/יַּחֲנ֖וּ בְּ/עֵ֥מֶק יִזְרְעֶֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/033.yaml
  text: Then all Midian and Amalek and the people of the East gathered together[a], crossed over, and camped in the Valley of Jezreel.
translation:
  language: ta
  text: அப்போது மீதியானியர் அனைவரும், அமலேக்கியரும், கிழக்கத்திய மக்களும்[a] ஒன்றுகூடினர். அவர்கள் கடந்து சென்று, யெஸ்ரயேல் பள்ளத்தாக்கில் முகாமிட்டனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில், ‘கிழக்கின் மகன்கள்’; இது கிழக்குப் பகுதி மக்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל מִדְיָן
  choice: மீதியானியர் அனைவரும்
  rationale: எபிரேய மொழியில் சொற்றொடர் நேரடியாக ‘மீதியான் முழுவதும்’ என்ற கூட்டுப்பொருள் கொண்டது. தமிழில் மக்களைக் குறிக்கும் ‘மீதியானியர் அனைவரும்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַ/עֲמָלֵק
  choice: அமலேக்கியரும்
  rationale: ‘அமலேக்’ என்ற இனப்பெயர் கூட்டாக மக்களைக் குறிக்கிறது; தமிழில் ‘அமலேக்கியர்’ என மக்களைக் குறித்தல் இயல்பானது.
- source_word: וּ/בְנֵי קֶדֶם
  choice: கிழக்கத்திய மக்களும்
  rationale: நேரடியாக ‘கிழக்கின் மகன்கள்’ என்றாலும், இது கிழக்குப் பகுதிகளைச் சேர்ந்த மக்களைக் குறிக்கும் எபிரேய மரபுத்தொடர். நவீன தமிழில் ‘கிழக்கத்திய மக்கள்’ அதன் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: נֶאֶסְפוּ יַחְדָּו
  choice: ஒன்றுகூடினர்
  rationale: אסף என்பதன் நிபால் வடிவமும் יחדו என்பதும் இணைந்து அனைவரும் ஒன்றாகத் திரண்டதைச் சுட்டுகின்றன; ‘ஒன்றுகூடினர்’ சுருக்கமாகவும் இயல்பாகவும் இதைத் தெரிவிக்கிறது.
- source_word: וַ/יַּעַבְרוּ
  choice: மறுகரைக்குச் சென்று
  rationale: עבר என்பது ‘கடந்து செல்’ அல்லது ‘மறுபுறம் செல்’ என்று பொருள்படும். எதைக் கடந்தார்கள் என்பதை மூல உரை குறிப்பிடாததால், தமிழிலும் அதைக் குறிப்பிட்டு நிரப்பாமல் இயக்கத்தின் பொருள் மட்டும் பாதுகாக்கப்படுகிறது.
- source_word: וַֽ/יַּחֲנוּ
  choice: முகாமிட்டனர்
  rationale: חנה என்பது இங்கு படையினர் தங்கி முகாம் அமைத்ததைக் குறிக்கிறது; ‘முகாமிட்டனர்’ நவீன தமிழில் தெளிவான இராணுவப் பயன்பாடு.
- source_word: בְּ/עֵמֶק יִזְרְעֶאל
  choice: யெஸ்ரயேல் பள்ளத்தாக்கில்
  rationale: עמק என்பது பள்ளத்தாக்கு அல்லது சமவெளியைக் குறிக்கலாம். இப்புவியியல் பெயருக்குப் பொதுவாகப் பொருந்தும் ‘யெஸ்ரயேல் பள்ளத்தாக்கு’ தேர்ந்தெடுக்கப்பட்டது.
