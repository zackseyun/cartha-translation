  text: וַ/תָּ֥עָז יַד מִדְיָ֖ן עַל יִשְׂרָאֵ֑ל מִ/פְּנֵ֨י מִדְיָ֜ן עָשֽׂוּ לָ/הֶ֣ם בְּנֵ֣י יִשְׂרָאֵ֗ל אֶת הַ/מִּנְהָרוֹת֙ אֲשֶׁ֣ר בֶּֽ/הָרִ֔ים וְ/אֶת הַ/מְּעָר֖וֹת וְ/אֶת הַ/מְּצָדֽוֹת־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/002.yaml
  text: And the hand of Midian prevailed against Israel[a]. Because of Midian, the sons of Israel made for themselves the dens that are in the mountains, and the caves[b], and the strongholds.
translation:
  language: ta
  text: மீதியானின் கை இஸ்ரவேலுக்கு எதிராக மேலோங்கியது. மீதியானின் காரணமாக, இஸ்ரவேல் மக்கள் மலைகளில் உள்ள பதுங்கிடங்களையும்[a], குகைகளையும், அரண்களையும் தங்களுக்காக அமைத்துக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பதுங்கிடங்கள்” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் அரிதானது; இதை “வளைகள்,” “குழிகள்,” அல்லது “சுரங்கங்கள்” என்றும் மொழிபெயர்த்துள்ளனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּעָז
  choice: வலுப்பெற்றது
  rationale: வினைச்சொல் வலிமையடைதல் அல்லது மேலோங்குதல் என்ற பொருளைக் கொண்டது. ‘கை’ என்ற மூல உருவகத்துடன் இயல்பாக அமைய ‘வலுப்பெற்றது’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יַד מִדְיָן
  choice: மீதியானின் கை
  rationale: அதிகாரம் அல்லது ஆதிக்கத்தைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் தக்கவைக்கிறது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராக
  rationale: இச்சூழலில் பகைமையான ஒடுக்குதலைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִפְּנֵי מִדְיָן
  choice: மீதியானியருக்குப் பயந்து
  rationale: מִפְּנֵי என்பது ‘காரணமாக/முன்னிலையில் இருந்து’ என்ற அடிப்படையில் அச்சுறுத்தலால் ஏற்பட்ட செயலைக் குறிக்கிறது; சூழல் அச்சத்தையும் தற்காப்பையும் உணர்த்துவதால் இயல்பான தமிழாக்கம் பயன்படுத்தப்பட்டது.
- source_word: עָשׂוּ לָהֶם
  choice: தங்களுக்காக அமைத்துக்கொண்டார்கள்
  rationale: செய்தார்கள் என்ற வினையையும் அவர்களுக்கே பயனான அமைப்புகள் என்ற தன்னிலைப் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு மக்களினத்தைக் குறிக்கும் வழக்கமான கூட்டுப்பெயராக இருப்பதால் நவீன தமிழில் இயல்பான ‘இஸ்ரவேல் மக்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַמִּנְהָרוֹת אֲשֶׁר בֶּהָרִים
  choice: மலைகளில் உள்ள பதுங்கிடங்கள்
  rationale: மிக அரிதான מִנְהָרוֹת என்பதன் துல்லியமான வடிவம் உறுதியற்றது; புகலுக்கான வளைகள், குழிகள் அல்லது மறைவிடங்கள் என்ற சூழற்பொருளையும் வெளிப்படையான மலை இருப்பிடத்தையும் இத்தேர்வு காக்கிறது.
- source_word: הַמְּעָרוֹת
  choice: குகைகள்
  rationale: இயற்கையான குகைகளைக் குறிக்கும் தெளிவான, வழக்கமான தமிழ்ச்சொல்.
- source_word: הַמְּצָדוֹת
  choice: அரணான இடங்கள்
  rationale: பாதுகாப்பளிக்கும் வலுவான அல்லது கோட்டையாக்கப்பட்ட இடங்களைக் குறிக்கிறது; கட்டப்பட்ட கோட்டைகள் மட்டுமே என்ற அளவுக்கு பொருளைச் சுருக்காமல் விடுகிறது.
