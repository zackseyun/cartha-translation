base_translation:
  language: en
  yaml_path: translation/ot/judges/006/025.yaml
  text: And it happened that night that Yahweh said to him[a], “Take your father’s bull and the second bull, seven years old, and tear down the altar of Baal that belongs to your father[b], and cut down the Asherah that is upon it.”
translation:
  language: ta
  text: அன்றிரவு யாவே அவனிடம், “உன் தந்தைக்குச் சொந்தமான காளையையும், ஏழு வயதான இரண்டாவது காளையையும் எடுத்துக்கொள். உன் தந்தைக்குச் சொந்தமான பாகாலின் பலிபீடத்தை இடித்துப்போடு; அதன்மேல்[b] உள்ள அசேராவை[a] வெட்டிப்போடு” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அசேரா கம்பம்” அல்லது “புனிதக் கம்பம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அசேராவுடன் தொடர்புடைய ஒரு வழிபாட்டுப் பொருளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அதன்மேல்” என்பது பலிபீடத்தின் மீது, அதற்கு மேலாக, அல்லது அதனுடன் நெருக்கமாக இணைந்த நிலையில் என்பதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: அன்றிரவு
  rationale: எபிரெயக் கதைத் தொடரின் இயல்பான கால மாற்றத்தைச் சுருக்கமாகவும் நவீனத் தமிழிலும் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரின் நான்கு எழுத்து வடிவத்தை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: קַח
  choice: கொண்டுபோ
  rationale: சூழலில் விலங்குகளை அழைத்துச் சென்று அடுத்த கட்டளையை நிறைவேற்றுவதைக் குறிக்கும் இயல்பான தமிழ் வினை; அடிப்படைப் பொருளான ‘எடு/கொள்’ என்பதையும் செயற்பாட்டில் தக்கவைக்கிறது.
- source_word: פַּר הַשּׁוֹר אֲשֶׁר לְאָבִיךָ
  choice: உன் தந்தைக்குச் சொந்தமான காளை
  rationale: சற்றே கடினமான எபிரெயச் சேர்க்கையை இயல்பான தமிழில் உரிமைத் தொடர்புடன் வழங்குகிறது.
- source_word: וּפַר הַשֵּׁנִי שֶׁבַע שָׁנִים
  choice: ஏழு வயதான இரண்டாவது காளை
  rationale: முதல் காளையுடன் கூடுதலாக இன்னொரு காளை குறிப்பிடப்படுவதை ‘-யையும்’ அமைப்பு தெளிவாக்குகிறது; அதன் வயதையும் நேரடியாகத் தருகிறது.
- source_word: וְהָרַסְתָּ
  choice: இடித்துப்போட்டு
  rationale: பலிபீடத்தை முற்றிலும் தகர்க்கும் வலுவான கட்டளையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִזְבַּח הַבַּעַל
  choice: பாகாலின் பலிபீடம்
  rationale: கட்டமைப்புச் சொற்றொடரைத் தெளிவான தமிழ் உடைமை அமைப்பில் வழங்குகிறது.
- source_word: הָאֲשֵׁרָה
  choice: அசேரா
  rationale: இது தேவதையையோ, அவளுடன் தொடர்புடைய வழிபாட்டுப் பொருளையோ குறிக்கக்கூடியதால், ‘கம்பம்’ என்று வரையறுக்காமல் வரலாற்றுச் சமயச் சொல்லை ஒலிபெயர்க்கிறது.
- source_word: אֲשֶׁר עָלָיו
  choice: அதன்மேல் உள்ள
  rationale: עַל என்பதன் நேரடியான இடவியல் பொருளைத் தக்கவைக்கிறது; அதன் துல்லியமான அமைவிடம் உறுதியற்றது என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: תִּכְרֹת
  choice: வெட்டிப்போடு
  rationale: மரத்தாலான வழிபாட்டுப் பொருளை வெட்டி அகற்றும் கட்டளையை வலுவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பெயரைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது உரையின் தனித்துவத்தைப் பாதுகாக்கிறது.
- issue: הָאֲשֵׁרָה என்பதன் குறிப்பு
  choice: அசேரா
  alternative: அசேரா கம்பம் / புனிதக் கம்பம்
  rationale: எபிரெயச் சொல் தேவதையுடன் தொடர்புடைய வழிபாட்டுப் பொருள், சின்னம் அல்லது மரப்பொருளைக் குறிக்கலாம்; ‘அசேரா’ என்று தருவது அந்தத் தெளிவின்மையைத் தக்கவைக்கிறது.
- issue: இரண்டு காளைகளா அல்லது ஒரே காளையின் விளக்கமா
  choice: காளையையும்... இரண்டாவது காளையையும்
  alternative: உன் தந்தையின் காளையாகிய ஏழு வயதான இரண்டாவது காளையை
  rationale: וּפַר என்ற இணைப்பும் ‘இரண்டாவது’ என்ற சொல்லும் இரண்டு விலங்குகள் குறிப்பிடப்படுவதாக இயல்பாகப் படுகின்றன; இருப்பினும் எபிரெயத் தொடரின் சற்று கடினமான அமைப்பு மாற்று வாசிப்புக்கு இடமளிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘அசேரா’ மற்றும் அதன் இருப்பிடத்தைப் பற்றிய மூலத்தின் தெளிவின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
