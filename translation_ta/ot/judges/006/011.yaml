- from: யாவேயின் தூதர் வந்து, ஓப்ராவில் அபியேசரின் குலத்தைச் சேர்ந்த[a] யோவாஷுக்குச் சொந்தமான டெரிபிந்த் மரத்தின்[b] கீழே உட்கார்ந்தார். அப்போது யோவாஷின் மகன் கிதியோன், கோதுமையைத் தடியால் அடித்துப் பிரித்துக்கொண்டிருந்தான்[c]. மீதியானிடமிருந்து அதை மறைத்துவைப்பதற்காக அவன் திராட்சைப் பழங்களைப் பிழியும் தொட்டிக்குள் அதைச் செய்துகொண்டிருந்தான்.
