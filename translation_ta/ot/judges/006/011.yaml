  text: וַ/יָּבֹ֞א מַלְאַ֣ךְ יְהוָ֗ה וַ/יֵּ֨שֶׁב֙ תַּ֤חַת הָֽ/אֵלָה֙ אֲשֶׁ֣ר בְּ/עָפְרָ֔ה אֲשֶׁ֥ר לְ/יוֹאָ֖שׁ אֲבִ֣י הָֽעֶזְרִ֑י וְ/גִדְע֣וֹן בְּנ֗/וֹ חֹבֵ֤ט חִטִּים֙ בַּ/גַּ֔ת לְ/הָנִ֖יס מִ/פְּנֵ֥י מִדְיָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/011.yaml
  text: Then the angel of Yahweh came and sat under the oak that was in Ophrah[a], which belonged to Joash the Abiezrite[c][b], while Gideon his son was beating out wheat in the winepress to hide it from Midian.
translation:
  language: ta
  text: யாவேயின் தேவதூதர் வந்து, ஓப்ராவில் அபியேசர் குலத்தைச் சேர்ந்த[a] யோவாஷுக்குச் சொந்தமான டெரிபிந்த் மரத்தின்[b] கீழ் உட்கார்ந்தார். யோவாஷின் மகன் கிதியோன், மீதியானிடமிருந்து கோதுமையை மறைத்துவைக்க, திராட்சை ஆலையில் அதை அடித்துப் பிரித்துக்கொண்டிருந்தான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘அபியேசரியனான.’ இது அபியேசர் குலத்தைச் சேர்ந்தவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இந்த எபிரெய மரப்பெயர் ‘கருவாலி மரம்’ என்றும் மொழிபெயர்க்கப்படுகிறது; அதன் துல்லியமான தாவரவியல் அடையாளம் உறுதியானதல்ல.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘கோதுமையைப் போரடித்துக்கொண்டிருந்தான்.’ இங்குள்ள எபிரெய வினைச்சொல் தானியத்தை அடித்துப் பிரிப்பதைச் சிறப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאַךְ என்பது ‘தூதர்’ அல்லது ‘தேவதூதர்’ எனப் பொருள்படலாம். இக்கதையில் விண்ணுலகத் தூதர் என்ற பொருள் இயல்பானது; எனினும் அந்த நபரின் அடையாளத்தைத் தேவையின்றி விளக்கித் தீர்க்காமல் இருக்க ‘தூதர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה, ஒரு பட்டத்தால் மாற்றப்படாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הָאֵלָה
  choice: டெரிபிந்த் மரம்
  rationale: אֵלָה பொதுவாக டெரிபிந்த் என அடையாளம் காணப்படும் பெரிய மரத்தைக் குறிக்கிறது. தாவரவியல் அடையாளத்தில் உள்ள உறுதியின்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: אֲבִי הָעֶזְרִי
  choice: அபியேசரின் குலத்தைச் சேர்ந்த
  rationale: இது யோவாஷின் அபியேசர் குல உறவைக் குறிக்கும் குடிப்பெயர்; தெளிவான இயல்பான தமிழில் குலச் சேர்க்கையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: חֹבֵט חִטִּים
  choice: கோதுமையைத் தடியால் அடித்துப் பிரித்துக்கொண்டிருந்தான்
  rationale: חבט என்பது தானியத்தை அடித்துப் பிரித்தெடுக்கும் குறிப்பான செயலைக் குறிக்கிறது. மறைவான சிறிய இடத்தில் செய்யப்பட்ட செயலைத் தெளிவாகக் காட்ட இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בַּגַּת
  choice: திராட்சைப் பழங்களைப் பிழியும் தொட்டிக்குள்
  rationale: גת என்பது திராட்சைரசம் தயாரிக்கப் பழங்களை மிதிக்கும் அல்லது பிழியும் தொட்டி. ‘உள்ளே’ என்பது மறைவான இடத்தில் கிதியோன் வேலை செய்த காட்சியை வெளிப்படுத்துகிறது.
- source_word: לְהָנִיס מִפְּנֵי מִדְיָן
  choice: மீதியானிடமிருந்து அதை மறைத்துவைப்பதற்காக
  rationale: הניס என்பதன் அடிப்படை உணர்வு ‘தப்பியோடச் செய்தல்/அகற்றுதல்.’ இங்கு கோதுமையை மீதியானின் பார்வைக்கும் கைப்பற்றுதலுக்கும் எட்டாமல் வைப்பதே சூழல்சார் பொருள்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைத் தனிப்பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது உரையின் தனிப்பெயர் இயல்பைப் பாதுகாக்கிறது.
- issue: מַלְאַךְ יְהוָה என்பவரின் இயல்பு மற்றும் அடையாளம்
  choice: யாவேயின் தூதர்
  alternative: யாவேயின் தேவதூதர்
  rationale: நிகழ்ச்சியின் சூழல் விண்ணுலகத் தூதரைச் சுட்டினாலும், ‘தூதர்’ என்ற சொல் எபிரெயச் சொல்லின் பரப்பையும் அந்த நபரின் அடையாளம் குறித்த கதைத் தளர்வையும் பாதுகாக்கிறது; பிற்கால இறையியல் அடையாளத்தை உரைக்குள் புகுத்துவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தொழில்சார் பழமையான சொற்களை மட்டும் சாராமல் செயல் விளக்கப்பட்டுள்ளது; பெயர்கள் எபிரெய ஒலியமைப்பிற்கு நெருக்கமாக வழங்கப்பட்டுள்ளன.
