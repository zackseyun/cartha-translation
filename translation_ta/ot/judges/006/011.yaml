  rationale: திராட்சை ஆலையில் அடித்துப் பிரித்தல் மற்றும் மீதியானிடமிருந்து மறைத்தல் என்ற மூலக் காட்சியை ஒருங்கிணைத்து, தெளிவற்ற சொல்லாட்சியை நீக்கினேன். கதைச்சூழல் மற்றும் ஆங்கில POB audit trail ஆதரிக்கும் வானுலகப் பொருளைத் தருவதற்காக ‘தேவதூதர்’ பயன்படுத்தப்பட்டது; இதனால் அவரது அடையாளம் பற்றிய மேலதிக இறையியல் முடிவு எதுவும் சேர்க்கப்படவில்லை. அடிக்குறிப்பு சுட்டிகள் அந்தந்த சொற்களிலேயே நிலைநிறுத்தப்பட்டுள்ளன.
