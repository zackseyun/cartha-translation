base_translation:
  language: en
  yaml_path: translation/ot/judges/006/020.yaml
  text: Then the angel of God said to him[a], “Take the meat and the unleavened bread, and set them on this rock, and pour out the broth.” And he did so.
translation:
  language: ta
  text: அப்போது கடவுளின் தூதர்[a] அவனிடம், “இறைச்சியையும் புளிப்பில்லாத அப்பங்களையும் எடுத்து, இந்தப் பாறையின்மேல் வைத்து, சாறை ஊற்று” என்றார். அவனும் அப்படியே செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளின் வானதூதர்.” எபிரேயச் சொல் மனிதத் தூதரையோ வானதூதரையோ குறிக்கலாம்; இங்கு சூழல் இயற்கைக்கு அப்பாற்பட்ட இறைத்தூதரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: கடவுளின் தூதர்
  rationale: מַלְאַךְ என்பது மனிதத் தூதரையோ வானதூதரையோ குறிக்கலாம். இச்சூழலில் அவர் இயற்கைக்கு அப்பாற்பட்ட இறைத்தூதர் என்பது தெளிவாகி வந்தாலும், ‘தூதர்’ என்ற சொல் எபிரேயத்தின் இயல்பான பொருள் விரிவையும் காக்கிறது; அடிக்குறிப்பு சூழல்சார் பொருளை விளக்குகிறது.
- source_word: קַח
  choice: எடுத்து
  rationale: לקח என்ற கட்டளை வினையின் நேரடிப் பொருள் ‘எடு’; தமிழில் அடுத்துவரும் ‘வைத்து’ என்பதோடு இயல்பாக இணைகிறது.
- source_word: הַבָּשָׂר
  choice: இறைச்சி
  rationale: בָּשָׂר என்பதன் அடிப்படைப் பொருள் ‘சதை’ என்றாலும், உணவுச் சூழலில் ‘இறைச்சி’ என்பது துல்லியமான இயல்பான தமிழ்.
- source_word: הַמַּצּוֹת
  choice: புளிப்பில்லாத அப்பங்கள்
  rationale: מַצּוֹת என்பது புளிக்கவைக்கப்படாத சுட்ட உணவுப் பொருட்களின் பன்மை; ‘புளிப்பில்லாத அப்பங்கள்’ பன்மையையும் உணவின் தன்மையையும் தெளிவாகக் காட்டுகிறது.
- source_word: וְהַנַּח
  choice: வைத்து
  rationale: נוח என்பதன் ஹிஃபில் கட்டளை இங்கு ‘வைக்க’ அல்லது ‘கிடத்த’ என்று பொருள்; தமிழில் ‘பாறையின்மேல் வைத்து’ என்பது இயல்பான இடவமைப்பு.
- source_word: אֶל־הַסֶּלַע הַלָּז
  choice: இந்தப் பாறையின்மேல்
  rationale: סֶלַע என்பது பாறை; הַלָּז இங்கு சுட்டுப்பொருளில் ‘இந்த’ என வருகிறது. வினைச்சூழலால் אֶל என்பதற்கு தமிழில் ‘மேல்’ என்பது இயல்பான இணை.
- source_word: הַמָּרַק
  choice: குழம்பு
  rationale: מָרָק என்பது சமைத்த திரவம் அல்லது இறைச்சிச் சாறு. நவீனத் தமிழில் உணவுடன் வரும் திரவத்தைக் குறிக்க ‘குழம்பு’ எளிதில் புரியும் இயல்பான சொல்.
- source_word: שְׁפֹוךְ
  choice: ஊற்று
  rationale: שפך என்ற கட்டளை வினை திரவத்தை ஊற்றுவதைக் குறிக்கிறது; ‘ஊற்று’ சுருக்கமாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וַיַּעַשׂ כֵּן
  choice: அவனும் அப்படியே செய்தான்
  rationale: இந்த எபிரேய மரபுத்தொடர் கட்டளைக்குக் கீழ்ப்படிந்து அதன்படியே செய்ததைச் சுருக்கமாகச் சொல்கிறது; ‘அப்படியே செய்தான்’ அதன் வலிமையை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: இறைத்தோற்றச் சூழலில் מַלְאַךְ என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: கடவுளின் தூதர்
  alternative: கடவுளின் வானதூதர்
  rationale: எபிரேயச் சொல் பொதுவாக ‘தூதர்’ என்றும் சூழலுக்கேற்ப ‘வானதூதர்’ என்றும் பொருள்படும். நியாயாதிபதிகள் 6-இல் இயற்கைக்கு அப்பாற்பட்ட இறைத்தூதர் என்பதையே சூழல் சுட்டினாலும், ‘தூதர்’ என்பது மூலத்தின் சொற்பொருள் விரிவையும் இறைத்தோற்றம் குறித்த கதையின் பதற்றத்தையும் முன்கூட்டியே தீர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரேய வாக்கியத்தின் தொடர் கட்டளைகளும் இறுதிக் கீழ்ப்படிதல் குறிப்பும் சுருக்கமாகப் பாதுகாக்கப்பட்டுள்ளன.
