source:
  edition: WLC
  text: וְ/ר֣וּחַ יְהוָ֔ה לָבְשָׁ֖ה אֶת גִּדְע֑וֹן וַ/יִּתְקַע֙ בַּ/שּׁוֹפָ֔ר וַ/יִזָּעֵ֥ק אֲבִיעֶ֖זֶר אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/034.yaml
  text: Then the Spirit of Yahweh clothed Gideon[a], and he blew the trumpet[c][b], and Abiezer was summoned after him.
translation:
  language: ta
  text: அப்போது யெகோவாவின் ஆவி கிதியோனை ஆடையாக உடுத்திக்கொண்டது[a]. கிதியோன் கொம்பை ஊதினார்[b]; அபியேசர் குலத்தார் அவருக்குப் பின்னால் அழைக்கப்பட்டார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யெகோவாவின் ஆவி கிதியோன்மேல் வந்தது.” எபிரெயத்தில் சொல்லுக்குச் சொல், “யெகோவாவின் ஆவி கிதியோனை உடுத்திக்கொண்டது.”
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில் ஷோஃபார்: அறிவிப்பதற்கும் மக்களை அழைப்பதற்கும் ஊதப்பட்ட கொம்பு.'
    reason: cultural_note
  - marker: c
    text: அல்லது, “அபியேசர் குலத்தார் அவருக்குப் பின்னால் அணிதிரண்டார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: யெகோவாவின் ஆவி
  rationale: רוּחַ இச்சூழலில் இறைவனால் அளிக்கப்படும் வல்லமையைக் குறிக்கும் ‘ஆவி’ என்ற பொருளில் வருகிறது. יהוה என்பது பொதுப்பட்டப் பெயராக அல்லாமல் இறைவனின் தனிப்பெயராக இருப்பதால் ‘யெகோவா’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: לָבְשָׁה אֶת גִּדְעוֹן
  choice: கிதியோனை ஆடையாக அணிந்துகொண்டது
  rationale: 'לבשׁ என்பதன் உயிர்ப்பான எபிரெய உருவகத்தைப் பாதுகாக்கிறது: இங்கு ஆவியே எழுவாய்; கிதியோன் அதன் நேரடிச் செயப்படுபொருள். வழக்கமான ‘கிதியோன்மேல் இறங்கியது’ என்பது உருவகத்தை மறைத்துவிடும்.'
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: கொம்பை ஊதினார்
  rationale: שׁוֹפָר என்பது செய்தி அறிவிக்க அல்லது அழைப்பு விடுக்க ஊதப்படும் கொம்பு. ‘எக்காளம்’ என்பதைவிட ‘கொம்பு’ அதன் பண்பாட்டு வடிவத்தை நேரடியாகக் காட்டுகிறது.
- source_word: וַיִּזָּעֵק
  choice: திரட்டப்பட்டார்கள்
  rationale: நிபால் வினைவடிவத்தின் செயப்பாட்டு உணர்வையும், போருக்கோ ஆதரவுக்கோ அழைக்கப்பட்டு ஒன்றுகூடிய சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲבִיעֶזֶר
  choice: அபியேசர் குலத்தார்
  rationale: இங்கு பெயர் ஒரே நபரை அல்ல, கிதியோனின் குலத்தாரைக் கூட்டாகக் குறிக்கிறது; ஆகவே தமிழில் எண்ணையும் குறிப்பையும் தெளிவாக்க ‘குலத்தார்’ சேர்க்கப்பட்டது.
- source_word: אַחֲרָיו
  choice: அவரைப் பின்தொடர
  rationale: சொல்லுக்குச் சொல் ‘அவருக்குப் பின்னால்’ என்றாலும், இச்சூழலில் கிதியோனைத் தலைவராக ஏற்று அவருடன் அணிதிரள்வதே பொருள்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: மூலத்தில் உள்ள உடன்படிக்கையின் தனிப்பெயரை பொதுப்பட்டப் பெயராக மாற்றாமல் தமிழ் வேதாகம வாசகர்களுக்கு அறிமுகமான ஒலிவடிவத்தில் வைத்திருக்கிறது.
- issue: ஆவி கிதியோனை ‘அணிந்தது’ என்ற உருவகம்
  choice: ஆவி கிதியோனை ஆடையாக அணிந்துகொண்டது
  alternative: ஆவி கிதியோன்மேல் வந்தது
  rationale: ஆவியே இலக்கண எழுவாய் என்ற மூலத்தின் வியப்பூட்டும் உருவகத்தையும், ஆவியின் ஆட்கொள்ளும் வல்லமையையும் விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமும் வாசிப்புத் தெளிவும் பேணப்பட்டுள்ளன. அரிதான எபிரெய உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் இயல்பான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. ‘அபியேசர்’ என்பது இங்கு குலப்பெயர் என்பதைத் தமிழ் வாசகர் தவறாக ஒரே நபர் எனப் புரிந்துகொள்ளாதபடி ‘குலத்தார்’ சேர்க்கப்பட்டுள்ளது.
