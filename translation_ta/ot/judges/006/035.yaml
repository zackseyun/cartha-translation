base_translation:
  language: en
  yaml_path: translation/ot/judges/006/035.yaml
  text: And he sent messengers throughout all Manasseh[a], and it too was called out after him. He also sent messengers through Asher, Zebulun, and Naphtali, and they went up to meet them.
translation:
  language: ta
  text: அவன் மனாசே முழுவதிலும் தூதர்களை அனுப்பினான்; மனாசேயரும் அவன் பின்னால் அணிதிரண்டார்கள். அவன் ஆசேர், செபுலோன், நப்தலி பகுதிகளிலும் தூதர்களை அனுப்பினான்; அவர்கள் அவர்களைச் சந்திக்க ஏறிச் சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களை” என்பது சூழலில் எதிரிப் படைகளைக் குறிப்பதாக இயல்பாகத் தெரிகிறது. ஆனால் எபிரெயில் இப்பன்மைச் சுட்டின் முன்னோடி வெளிப்படையாகக் குறிப்பிடப்படவில்லை; ஆகவே அவர்கள் கிதியோனையும் அவனுடன் இருந்தவர்களையும் சந்திக்கச் சென்றார்கள் என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאָכִים
  choice: தூதுவர்கள்
  rationale: இராணுவ அணிதிரட்டலுக்கான அழைப்பை எடுத்துச் செல்லும் மனிதத் தூதர்களையே இச்சூழலில் குறிக்கிறது; வானதூதர்களை அல்ல.
- source_word: בְּכָל מְנַשֶּׁה
  choice: மனாசே பகுதி முழுவதிலும்
  rationale: மனாசே கோத்திரத்தாரின் பகுதி எங்கும் அழைப்பு சென்றது என்ற பரந்த பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיִזָּעֵק
  choice: அணிதிரட்டப்பட்டார்கள்
  rationale: நிஃபால் வடிவத்தின் செயல்படுபொருள் நிலையையும் இராணுவ அழைப்புக்குப் பதிலாகக் கூடிவந்த பொருளையும் காக்கிறது.
- source_word: אַחֲרָיו
  choice: அவனைப் பின்தொடர
  rationale: கிதியோனின் தலைமையின் பின்னால் திரள்வதைக் குறிக்கும் இயல்பான தமிழ் நடை.
- source_word: בְּאָשֵׁר וּבִזְבֻלוּן וּבְנַפְתָּלִי
  choice: ஆசேர், செபுலோன், நப்தலி பகுதிகளிலும்
  rationale: அந்தந்த கோத்திரப் பகுதிகளுக்குள் தூதுவர்கள் அனுப்பப்பட்டதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיַּעֲלוּ
  choice: மேலே சென்றார்கள்
  rationale: எபிரெய வினையின் அடிப்படை ஏறிச் செல்லும் பொருளைக் காக்கிறது; வெறும் ‘புறப்பட்டார்கள்’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: לִקְרָאתָם
  choice: அவர்களைச் சந்திக்க
  rationale: எபிரெயச் சொல்லிலுள்ள பன்மை பின்னொட்டைத் தெளிவாகப் பாதுகாக்கிறது; அதன் முன்னிலைச் சுட்டு வெளிப்படையாகக் கூறப்படாததால் அதை முதன்மை உரையில் குறிப்பாக்கவில்லை.
theological_decisions:
- issue: לִקְרָאתָם என்பதிலுள்ள பன்மைச் சுட்டின் குறிப்பு
  choice: ‘அவர்களை’ என்ற பன்மையைப் பாதுகாத்து, குறிக்கப்படுபவர்கள் யார் என்பதை முதன்மை உரையில் வெளிப்படையாகத் தீர்மானிக்காமல் விடுதல்
  alternative: அழைக்கப்பட்ட கோத்திரத்தார் கிதியோனையும் அவனுடைய படையினரையும் சந்திக்கச் சென்றார்கள் என்று புரிந்துகொள்ளுதல்
  rationale: எபிரெயில் பன்மை பின்னொட்டு இருக்கிறது; ஆனால் அதன் முன்னிலைச் சுட்டு வெளிப்படையாக இல்லை. சூழலில் அது எதிரிப் படைகளைக் குறிப்பது இயல்பானதாக இருந்தாலும், வேறு புரிதலுக்கும் இடமுள்ளதால் அடிக்குறிப்பில் ambiguity பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. கோத்திரங்களை ஒருமைக் கூட்டுப்பெயராகக் கொண்ட எபிரெய அமைப்பு, தமிழில் மக்களைக் குறிக்கும் மரியாதைப் பன்மையாக மாற்றப்பட்டுள்ளது. இறுதி பன்மைப் பிரதிப்பெயரின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
