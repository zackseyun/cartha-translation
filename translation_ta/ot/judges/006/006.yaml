base_translation:
  language: en
  yaml_path: translation/ot/judges/006/006.yaml
  text: So Israel became very poor because of Midian[c][b][a], and the sons of Israel cried out to Yahweh.
translation:
  language: ta
  text: மீதியானால் இஸ்ரவேல் மிகவும் தாழ்ந்த நிலைக்குத் தள்ளப்பட்டது.[a] இஸ்ரவேலின் மகன்கள்[b] யாவேவை நோக்கிக் கூக்குரலிட்டார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மிகவும் வறுமையடைந்தது” அல்லது “மிகவும் பலவீனமடைந்தது” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை ஒடுக்குமுறையால் தாழ்த்தப்படுதல், வலிமை குன்றுதல் அல்லது வறுமையடைதல் ஆகிய பொருள்களைக் கொண்டது.
    reason: lexical_alternative
  - marker: b
    text: “இஸ்ரவேலின் மகன்கள்” என்பது இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் வழக்கமான எபிரெயப் பெயர்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் יהוה (YHWH); பாரம்பரியமாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּדַּל
  choice: தாழ்ந்த நிலைக்குத் தள்ளப்பட்டது
  rationale: דל என்ற வினை ஒடுக்குமுறையால் வலிமை குன்றுதல், கீழ்நிலைக்குக் கொண்டுவரப்படுதல், வறுமையடைதல் ஆகிய பரந்த பொருள்களைக் கொண்டது. இங்கு பொருளாதார வறுமையை மட்டும் குறிப்பதாகச் சுருக்காமல், மீதியானின் ஒடுக்குமுறையால் இஸ்ரவேல் முற்றிலும் சீர்குலைந்ததை இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: מְאֹד
  choice: மிகவும்
  rationale: நிலையின் தீவிரத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கும் வலியுறுத்தல் சொல்.
- source_word: מִפְּנֵי מִדְיָן
  choice: மீதியானால்
  rationale: இச்சூழலில் מִפְּנֵי காரணத்தைக் குறிக்கிறது. மீதியானே இஸ்ரவேலின் தாழ்ந்த நிலைக்குக் காரணம் என்பதைத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: וַיִּזְעֲקוּ
  choice: உதவிக்காகக் கதறினார்கள்
  rationale: זעק என்பது துன்பத்தில் எழுப்பப்படும் அவசரமான கூக்குரலைக் குறிக்கிறது. 'கதறினார்கள்' உணர்ச்சித் தீவிரத்தையும், 'உதவிக்காக' அந்தக் கூக்குரலின் சூழல்சார் நோக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் வெளிப்படையான வடிவத்தைத் தக்கவைக்கிறது; அதேவேளையில் இது இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் வழக்கமான பெயர் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: אֶל יְהוָה
  choice: யாவேவை நோக்கி
  rationale: אֶל என்பதன் திசைநோக்குப் பொருளை 'நோக்கி' தெரிவிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் தமிழில் 'யாவே' என்று ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: בְנֵי יִשְׂרָאֵל என்பதன் ஆண்பால் வடிவம் மற்றும் கூட்டு அர்த்தம்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: மூலத்தின் இலக்கண வடிவத்தை முதன்மை உரையில் பாதுகாக்கிறது. அது உடன்படிக்கை மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் வழக்குச் சொல் என்ற கூட்டு அர்த்தம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. முதல் வாக்கியத்தில் எபிரெய வினையின் பொருளாதாரம், சமூக நிலை, வலிமைக் குறைவு ஆகியவற்றை உள்ளடக்கும் பரந்த தன்மை பாதுகாக்கப்பட்டுள்ளது. இரண்டாம் வாக்கியத்தில் துன்பக் கூக்குரலின் தீவிரம் தெளிவாக வெளிப்படுத்தப்பட்டுள்ளது.
