    rationale: “அவன் அவனுடைய பலிபீடத்தை இடித்துப்போட்டதால்” என்ற வடிவில் இரு பிரதிப்பெயர்களும் இயல்பாகப் பாகாலையே சுட்டலாம். ஆனால் சூழலில் செய்பவன் கிதியோன் என ஊகிக்கப்படுகிறான்; எபிரெய மூலத்தில் அவன் பெயரிடப்படவில்லை. ஆகவே அதைச் சூழல்-அடிப்படையிலான விளக்கமாக, மூல உரையில் சேர்க்கப்படாத பெயரை மாற்றுவாசிப்பாகத் திணிக்காமல் குறிப்பிட வேண்டும்.
  - severity: low
