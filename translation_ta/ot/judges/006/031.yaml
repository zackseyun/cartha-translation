  source_fidelity: 'முதன்மை உரை எபிரெய மூலத்தின் சொல்லாட்சியையும் பொருளையும் பெரும்பாலும் நம்பகமாகக் காட்டுகிறது: எதிர்நிற்றல், ריב வேரின் மும்முறைத் திரும்பல், பாகாலை ‘ஒரு தெய்வம்’ எனக் கூறும் நிபந்தனை, மற்றும் பலிபீடம் தகர்க்கப்பட்டதற்கான காரணம் ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் அடிக்குறிப்பின் மாற்றுவடிவத்தில் தொடர்ச்சியான ‘அவன் ... அவனுடைய’ என்பது தமிழில் பாகாலே தன் பலிபீடத்தை இடித்தான் எனத் தவறாகப் புரிய வாய்ப்பளிக்கிறது; மறைந்த எழுவாய் சூழலின்படி கிதியோன் என்பதை அடிக்குறிப்பில் தெளிவுபடுத்த வேண்டும்.'
  naturalness: ‘இடித்துப்போடப்பட்டுள்ளது’ புரியக்கூடியதாயினும், பலிபீடத்தைப் பற்றிய இச்சூழலில் ‘தகர்க்கப்பட்டுள்ளது’ நவீன நிலையான தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது. மற்ற வாக்கிய அமைப்பு கண்ணியமான, தெளிவான நவீன தமிழாக உள்ளது.
  terminology: ‘பாகால்’, ‘தெய்வம்’, ‘பலிபீடம்’, ‘காப்பாற்று’ ஆகியவை பொருத்தமானவை. ‘வாதாடு’ ரிபு வேரின் திட்டமிட்ட திரும்பலை மூன்று இடங்களிலும் காக்கிறது; சட்டவழக்கு என்ற ஒரே நுணுக்கத்திற்குள் பொருளைச் சுருக்குவதில்லை.
  issues:
