    rationale: נָתַץ என்பதன் ‘தகர்த்தல்/இடித்தல்’ பொருளுக்கு ‘தகர்க்கப்பட்டுள்ளது’ சிறப்பாகப் பொருந்துகிறது; பொருள் மாற்றமில்லை.
  revised_text: ஆனால் யோவாஸ் தனக்கு எதிராக நின்ற அனைவரிடமும், “பாகாலுக்காக நீங்கள் வாதாடுவீர்களா? அவனை நீங்கள் காப்பாற்றுவீர்களா? அவனுக்காக வாதாடுகிற எவனும் காலைக்குள் கொல்லப்படுவான். அவன் ஒரு தெய்வமாக இருந்தால், தனக்காக அவனே வாதாடட்டும்; ஏனெனில் அவனுடைய பலிபீடம் தகர்க்கப்பட்டுள்ளது[a]” என்றான்.
