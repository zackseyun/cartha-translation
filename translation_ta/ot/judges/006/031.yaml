source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יוֹאָ֡שׁ לְ/כֹל֩ אֲשֶׁר עָמְד֨וּ עָלָ֜י/ו הַ/אַתֶּ֣ם תְּרִיב֣וּ/ן לַ/בַּ֗עַל אִם אַתֶּם֙ תּוֹשִׁיע֣וּ/ן אוֹת֔/וֹ אֲשֶׁ֨ר יָרִ֥יב ל֛/וֹ יוּמַ֖ת עַד הַ/בֹּ֑קֶר אִם אֱלֹהִ֥ים הוּא֙ יָ֣רֶב ל֔/וֹ כִּ֥י נָתַ֖ץ אֶֽת מִזְבְּחֽ/וֹ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/031.yaml
  text: But Joash said to all who stood against him[a], “Will you contend for Baal? Will you save him? Whoever contends for him shall be put to death by morning. If he is a god, let him contend for himself, because his altar has been torn down.”
translation:
  language: ta
  text: ஆனால் யோவாஸ் தனக்கு எதிராக நின்ற அனைவரிடமும், “பாகாலுக்காக நீங்கள் வாதாடுவீர்களா? அவனை நீங்கள் காப்பாற்றுவீர்களா? அவனுக்காக வாதாடுகிற எவனும் காலைக்குள் கொல்லப்படுவான். அவன் ஒரு தெய்வமாக இருந்தால், தனக்காக அவனே வாதாடட்டும்; ஏனெனில் அவனுடைய பலிபீடம் தகர்க்கப்பட்டுள்ளது[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் அவனுடைய பலிபீடத்தை இடித்துப்போட்டதால்.” எபிரெயத்தில் செய்பவன் பெயரிடப்படவில்லை; சூழலின்படி அவன் கிதியோன் என்று புரிந்துகொள்ளப்படலாம்.
    reason: மூல எபிரெய வினை ஒருமை ஆண்பால் செயல்வினையாக இருந்தாலும் அதன் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. முதன்மை உரை அந்தத் தெளிவின்மையைச் செயப்பாட்டு வடிவில் காக்கிறது; அடிக்குறிப்பு சூழலிலுள்ள செயல்வினை வாசிப்பை விளக்குகிறது.
lexical_decisions:
- source_word: עָמְדוּ עָלָיו
  choice: தனக்கு எதிராக நின்ற
  rationale: עָמַד עַל என்ற தொடர் இச்சூழலில் இடநிலையை அல்ல, யோவாசை எதிர்கொண்டு நின்ற பகைமைச் செயலைக் குறிக்கிறது.
- source_word: תְּרִיבוּן / יָרִיב / יָרֶב
  choice: வாதாடுவீர்களா / வாதாடுகிற / வாதாடட்டும்
  rationale: ריב என்ற ஒரே வேர்ச்சொல்லின் சொல்லாட்சித் திரும்பலைத் தமிழிலும் காக்கிறது; சட்டரீதியான வழக்காடுதலையும் பொதுவான மோதலையும் அளவுக்கு மீறித் தனிப்படுத்தாமல் உள்ளடக்குகிறது.
- source_word: תּוֹשִׁיעוּן
  choice: காப்பாற்றுவீர்களா
  rationale: பாகாலை அவனுடைய வழிபாட்டாளர்களே காப்பாற்ற வேண்டுமா என்ற வசனத்தின் எள்ளல் நிறைந்த கேள்வியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲשֶׁר יָרִיב לוֹ
  choice: அவனுக்காக வாதாடுகிற எவனும்
  rationale: திட்டவட்டமற்ற தொடர்புத் தொடரை பொதுவிதியாகக் கூறும் எபிரெயச் சொல்லமைப்பை ‘எவனும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יוּמַת
  choice: கொல்லப்படுவான்
  rationale: ஹொஃபால் செயப்பாட்டு வடிவத்தின் காரணவினைப் பொருளைச் சாதாரண ‘சாவான்’ என்பதைக் காட்டிலும் துல்லியமாகத் தருகிறது.
- source_word: עַד הַבֹּקֶר
  choice: காலைக்குள்
  rationale: வரவிருக்கும் காலை வரையிலான காலக்கெடுவாக இச்சூழலில் உள்ள அச்சுறுத்தலைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: אֱלֹהִים הוּא
  choice: அவன் ஒரு தெய்வமாக இருந்தால்
  rationale: இங்கு אֱלֹהִים என்பது இஸ்ரவேலின் தேவனை அல்ல, பாகாலின் தெய்வத் தகுதி குறித்த நிபந்தனைக் கூற்றைக் குறிக்கிறது.
- source_word: כִּי נָתַץ אֶת מִזְבְּחוֹ
  choice: ஏனெனில் அவனுடைய பலிபீடம் இடித்துப்போடப்பட்டுள்ளது
  rationale: மூலத்தில் வினை செய்பவன் வெளிப்படையாகப் பெயரிடப்படாததால், முதன்மை உரை பலிபீடம் இடிக்கப்பட்ட நிகழ்வை முன்னிறுத்துகிறது; செய்பவன் கிதியோன் எனப் புரிந்துகொள்ளும் செயல்வினை வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיֹּאמֶר
  choice: ஆனால் யோவாஸ் ... என்றான்
  rationale: மக்களின் கோரிக்கைக்கு மாறான யோவாசின் பதிலைச் சூழலுக்கேற்ற எதிர்மறைத் திருப்பாக இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: אֱלֹהִים என்பது பாகாலைக் குறிப்பது
  choice: ‘ஒரு தெய்வம்’ என்று மொழிபெயர்த்தல்
  alternative: ‘தேவன்’ என்று மொழிபெயர்த்தல்
  rationale: யோவாஸ் பாகாலின் தெய்வத் தகுதியை நிபந்தனையாகச் சோதிக்கிறான்; பாகாலே உண்மையான தேவன் என்று உறுதிப்படுத்தவில்லை. ஆகவே ‘ஒரு தெய்வம்’ என்பது மூலத்தின் பொருளையும் இறையியல் பதற்றத்தையும் தெளிவாகக் காக்கிறது.
- issue: நָתַץ என்ற ஒருமை ஆண்பால் வினையின் மறைந்த எழுவாய்
  choice: முதன்மை உரையில் செயப்பாட்டு வடிவில் நிகழ்வை முன்னிறுத்துதல்
  alternative: கிதியோனை மறைந்த எழுவாயாகக் கொண்டு, ‘அவன் அவனுடைய பலிபீடத்தை இடித்துப்போட்டதால்’ என்று மொழிபெயர்த்தல்
  rationale: எபிரெயத்தில் எழுவாய் பெயரிடப்படவில்லை. சூழல் கிதியோனைச் சுட்டினாலும், அதை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்காமல் அடிக்குறிப்பில் மாற்று வாசிப்பாக வழங்குவது உண்மையான மறைபொருளைத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ריב என்ற வேரின் மூன்றுமுறை சொல்லாட்சித் திரும்பல் ‘வாதாடு’ மூலம் காக்கப்பட்டுள்ளது; பாகாலை மனிதர்கள் காப்பாற்ற வேண்டுமா என்ற யோவாசின் எள்ளலும் தக்கவைக்கப்பட்டுள்ளது.
