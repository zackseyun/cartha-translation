    reason: மூல எபிரெய வினை ஒருமை ஆண்பால் செயல்வினையாக இருந்தாலும் அதன் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. முதன்மை உரை அந்தத் தெளிவின்மையைச் செயப்பாட்டு வடிவில் காக்கிறது; அடிக்குறிப்பு சூழலிலுள்ள செயல்வினை வாசிப்பை விளக்குகிறது.
  revision_rationale: முதன்மை உரையின் நம்பகமான செயப்பாட்டு வாசிப்பு தக்கவைக்கப்பட்டுள்ளது. ‘தகர்க்கப்பட்டுள்ளது’ என மாற்றுவது நָתַץ வினைக்கும் நவீன தமிழ் நடைக்கும் ஏற்றது. அடிக்குறிப்பு, கிதியோனை மூல உரையின் வெளிப்படையான எழுவாயாகக் காட்டாமல், சூழலால் ஊகிக்கப்படும் சாத்தியமான எழுவாயாகத் தெளிவுபடுத்துகிறது; இதனால் பிரதிப்பெயர் ஏற்படுத்தும் தவறான பாகால்-எழுவாய் வாசிப்பு தவிர்க்கப்படுகிறது.
