base_translation:
  language: en
  yaml_path: translation/ot/judges/006/027.yaml
  text: So Gideon took ten men from among his servants and did as Yahweh had spoken to him. But because he feared his father's household and the men of the city too much to do it by day[a], he did it at night.
translation:
  language: ta
  text: கிதியோன் தன் பணியாளர்களில் பத்து ஆண்களை எடுத்துக்கொண்டு, யாவே அவனுக்குச் சொன்னபடியே செய்தான். ஆனால் தன் தந்தையின் வீட்டாரையும் நகரத்து ஆண்களையும் கண்டு அஞ்சி, பகலில் அதைச் செய்யாமல், இரவில் செய்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சொல்லாக, “பகலில் செய்வதிலிருந்து”; அவனுடைய பயம் பகலில் அதைச் செய்யவிடாமல் தடுத்தது என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: அழைத்துக்கொண்டு
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொண்டான்’; ஆனால் மனிதர்களை உடன் கூட்டிச் செயல்படச் செய்த இச்சூழலில் ‘அழைத்துக்கொண்டு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: பத்துப் பேர்
  rationale: எபிரெயத்தில் ஆண்பால் சொல் இருந்தாலும், தமிழில் எண்ணிக்கையுடன் மனிதர்களைக் குறிக்கும் இயல்பான வடிவம் ‘பத்துப் பேர்’; சூழல் இவர்களை ஆண் பணியாளர்களாகவே காட்டுகிறது.
- source_word: מֵעֲבָדָיו
  choice: தன் பணியாளர்களில்
  rationale: עֶבֶד என்பது ‘பணியாளர்’ அல்லது ‘அடிமை’ எனப் பொருள்படலாம். இங்கு அடிமை நிலை வலியுறுத்தப்படாததால் ‘பணியாளர்கள்’ பொருத்தமானது; ‘-இல்’ பகுதியிலிருந்து தேர்ந்தெடுத்ததைக் காட்டுகிறது.
- source_word: וַיַּעַשׂ כַּאֲשֶׁר דִּבֶּר אֵלָיו יְהוָה
  choice: யாவே தனக்குச் சொன்னபடியே செய்தான்
  rationale: தெய்வீகக் கட்டளைக்கும் கிதியோனின் கீழ்ப்படிதலுக்கும் உள்ள நேரடியான தொடர்பைப் பாதுகாத்து, தமிழில் இயல்பாக அமைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בֵּית אָבִיו
  choice: தன் தந்தையின் வீட்டார்
  rationale: בֵּית இங்கு கட்டிடத்தை மட்டும் அல்லாமல் தந்தையின் குடும்பம் அல்லது குடும்பக் குழுவைக் குறிக்கிறது; ‘வீட்டார்’ இதைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אַנְשֵׁי הָעִיר
  choice: நகரத்து ஆண்கள்
  rationale: மூலத்தில் உள்ள ‘நகரத்தின் ஆண்கள்’ என்ற பாலினக் குறிப்பைப் பாதுகாக்கிறது.
- source_word: מֵעֲשׂוֹת יוֹמָם
  choice: பகலில் அதைச் செய்யாமல்
  rationale: מִן + வினையெச்சம் பயத்தால் பகலில் செயல் நடைபெறாமல் போனதைக் குறிக்கிறது. தமிழ் வடிவம் காரணத்தின் விளைவைத் தெளிவாக்குகிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיַּעַשׂ לָיְלָה
  choice: இரவில் செய்தான்
  rationale: ‘பகலில்’ என்பதற்கு நேரான எதிர்மறை காலக் குறிப்பாகவும் நவீனத் தமிழில் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது; ‘யாவே’ நவீன ஆய்வில் ஏற்றுக்கொள்ளப்படும் உச்சரிப்பைத் தமிழில் பிரதிபலிக்கிறது.
- issue: கிதியோனின் பயத்துக்கும் இரவில் செய்த செயலுக்கும் உள்ள தொடர்பு
  choice: பயந்து, பகலில் அதைச் செய்யாமல் இரவில் செய்தான்
  alternative: பகலில் செய்ய முடியாத அளவுக்கு அஞ்சியதால் இரவில் செய்தான்
  rationale: மூலத்தின் காரணத் தொடர்பைப் பாதுகாக்கிறது; அதேவேளையில் ‘முடியவில்லை’ என்று மனவியல் அல்லது திறனின்மையை அளவுக்கு மீறி விளக்காமல் விடுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வீட்டார்’ சமூகக் குடும்ப அலகை உணர்த்துகிறது; ‘பணியாளர்கள்’ அடிமை நிலையை ஆதாரமின்றி வலியுறுத்துவதைத் தவிர்க்கிறது. அடிக்குறிப்பு குறியீடு [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
