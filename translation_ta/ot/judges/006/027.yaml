  terminology: ‘யாவே,’ ‘பணியாளர்கள்,’ ‘தந்தையின் வீட்டார்,’ மற்றும் ‘நகரத்து ஆண்கள்’ ஆகியவை பொருத்தமானவை. ‘வீட்டார்’ בֵּית אָבִיו குறிக்கும் குடும்ப-வீட்டுக் குழுவை இயல்பாக வெளிப்படுத்துகிறது. அடிக்குறிப்பில் מִן + infinitive-இன் சொற்சொல் மாற்று தக்கவாறு பாதுகாக்கப்பட்டுள்ளது.
