revisions:
- from: ஆனால் யாவே அவனிடம், “உனக்குச் சமாதானம் உண்டாவதாக.[a] அஞ்சாதே; நீ சாகமாட்டாய்” என்றார்.
  to: யாவே அவனிடம், “உனக்குச் சமாதானம்.[a] அஞ்சாதே; நீ சாகமாட்டாய்” என்றார்.
  rationale: The revision removes the unsupported adversative connector and preserves the Hebrew’s concise, verbless shalom formula. It retains the direct address, the prohibition against fear, and the assurance of survival, while keeping the lexical breadth of shalom in a properly anchored footnote.
  reviewer_model: gpt-5.6-terra
