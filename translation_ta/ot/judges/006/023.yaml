id: JDG.6.23
reference: Judges 6:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר ל֧/וֹ יְהוָ֛ה שָׁל֥וֹם לְ/ךָ֖ אַל תִּירָ֑א לֹ֖א תָּמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/023.yaml
  text: But Yahweh said to him[a], “Peace be to you. Do not fear; you shall not die.”
translation:
  language: ta
  text: யாவே அவனிடம், “உனக்குச் சமாதானம்.[a] அஞ்சாதே; நீ சாகமாட்டாய்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்கு நலமே.” எபிரெயச் சொல்லான ஷாலோம் சமாதானம், நலம், முழுமை அல்லது உறுதியளிப்பு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: எபிரெயக் கதைநடையில் אמר என்பதன் வழக்கமான உரையாடல் அறிமுகத்தை இயல்பான தமிழில் தெரிவிக்கிறது; எழுவாயான யாவேக்கு ஏற்ற மரியாதைப் பன்மையும் பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயர்; அதன் பரவலான ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: שָׁלוֹם לְךָ
  choice: உனக்குச் சமாதானம் உண்டாவதாக
  rationale: שָׁלוֹם என்பது போர் இல்லாமையை மட்டும் அல்லாமல் நலம், பாதுகாப்பு, முழுமை, ஆறுதல் ஆகியவற்றையும் குறிக்கலாம். இங்கு கிதியோனுக்கு அளிக்கப்படும் உறுதியளிப்பை ஆசீர்வாதத் தொனியுடன் வெளிப்படுத்துகிறது; மாற்றுச் சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אַל תִּירָא
  choice: அஞ்சாதே
  rationale: எதிர்மறைக் கட்டளையின் சுருக்கத்தையும் தேவன் அளிக்கும் ஆறுதலான உறுதியையும் இயல்பான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: לֹא תָּמוּת
  choice: நீ சாகமாட்டாய்
  rationale: வருங்காலத்தில் மரணம் நேராது என்ற நேரடியான உறுதியைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலவசனம் பட்டப்பெயரை அல்ல, தேவனுடைய தனிப்பெயரையே பயன்படுத்துகிறது. எனவே பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: שָׁלוֹם לְךָ என்பதன் இலக்கணத் தொனி
  choice: 'ஆசீர்வாதம் அல்லது உறுதியளிப்பு: “உனக்குச் சமாதானம் உண்டாவதாக”'
  alternative: உனக்கு நலமே
  rationale: வினைச்சொல் இல்லாத எபிரெயச் சொற்றொடர் வாழ்த்தாகவும் தற்போதைய நலனை உறுதிப்படுத்துவதாகவும் புரிந்துகொள்ளப்படலாம். பிரதான உரை ஆசீர்வாதத் தொனியைத் தருகிறது; அறிவிப்புத் தொனி அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான இறையுரை நடை பயன்படுத்தப்பட்டுள்ளது. “அஞ்சாதே” மற்றும் “சாகமாட்டாய்” என்பவை சுருக்கமான மூல உரையின் நேரடித் தன்மையைப் பாதுகாக்கின்றன.
