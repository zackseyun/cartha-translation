source:
  edition: WLC
  text: וַ/יֹּ֨אמְר֜וּ אַנְשֵׁ֤י הָ/עִיר֙ אֶל יוֹאָ֔שׁ הוֹצֵ֥א אֶת בִּנְ/ךָ֖ וְ/יָמֹ֑ת כִּ֤י נָתַץ֙ אֶת מִזְבַּ֣ח הַ/בַּ֔עַל וְ/כִ֥י כָרַ֖ת הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/030.yaml
  text: Then the men of the city said to Joash[a], “Bring out your son, that he may die, because he has torn down the altar of Baal and cut down the Asherah that was beside it.”
translation:
  language: ta
  text: அப்போது நகரத்து ஆண்கள் யோவாசிடம், “உன் மகனை வெளியே கொண்டுவா; அவன் இறக்கும்படி. ஏனெனில் அவன் பாகாலின் பலிபீடத்தை இடித்தான்; அதன் அருகிலிருந்த அசேராவையும்[a] வெட்டினான்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அசேரா கம்பம்.” அசேரா என்ற எபிரேயச் சொல் அசேரா தேவியோடு தொடர்புடைய வழிபாட்டுப் பொருளைக் குறிக்கலாம்; இங்கு அது தேவியையே அல்ல, அந்தப் பொருளையே குறிப்பதாகச் சூழல் உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: நகரத்து ஆண்கள்
  rationale: எபிரேயச் சொற்றொடர் சொற்படியாக ‘நகரத்தின் ஆண்கள்’ என்று பொருள்படுகிறது; ஆண்பால் குறிப்பைத் தக்கவைத்தபடி இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: הוֹצֵא
  choice: வெளியே கொண்டுவா
  rationale: ஹிஃபில் கட்டளை வடிவம் ஒருவரை வெளியே வரச் செய்வதைக் குறிக்கிறது; இத்தமிழ் நடை நேரடியும் இயல்புமானது.
- source_word: וְיָמֹת
  choice: அவன் சாக வேண்டும்
  rationale: கட்டளையைத் தொடர்ந்து வரும் இவ்வடிவம் கோரப்படும் விளைவை வெளிப்படுத்துகிறது. மரணதண்டனையே சூழலில் நோக்கமாக இருந்தாலும், ‘கொல்லப்பட வேண்டும்’ என்று எபிரேயத்தைவிடச் சட்டரீதியாக விரிவுபடுத்தவில்லை.
- source_word: נָתַץ
  choice: இடித்துப்போட்டு
  rationale: பலிபீடம் போன்ற கட்டமைப்பைத் தகர்த்தல் அல்லது இடித்தல் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: מִזְבַּח הַבַּעַל
  choice: பாகாலின் பலிபீடம்
  rationale: எபிரேய இணைப்புநிலையின் நேரடியான, தெளிவான தமிழ் வடிவம்.
- source_word: כָרַת
  choice: வெட்டிப்போட்டான்
  rationale: மரத்தாலான அல்லது மரம் போன்ற வழிபாட்டுப் பொருளை வெட்டி அகற்றிய செயலைக் குறிக்க ஏற்றது.
- source_word: הָאֲשֵׁרָה
  choice: அசேரா
  rationale: இச்சொல் தேவியையோ அவளோடு தொடர்புடைய வழிபாட்டுப் பொருளையோ குறிக்கலாம். இங்கு ‘வெட்டுதல்’ என்ற வினை வழிபாட்டுப் பொருளைக் குறிப்பதாகத் தோன்றினாலும், மொழிபெயர்ப்பில் மூலச்சொல்லின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר עָלָיו
  choice: அதன் அருகிலிருந்த
  rationale: עַל என்பது ‘மேல்’ மட்டுமல்லாமல் ‘அருகில்/பக்கத்தில்’ என்றும் பொருள்படும்; பலிபீடத்தோடு இணைந்திருந்த அசேரா பொருளுக்கு இச்சூழலில் ‘அருகில்’ இயல்பான இடவுறவைக் காட்டுகிறது.
theological_decisions:
- issue: இஸ்ரவேலரின் விக்கிரக வழிபாட்டு எதிர்ப்புச் சூழலில் אֲשֵׁרָה என்பதன் பொருள்
  choice: அசேரா
  alternative: அசேரா கம்பம்; அசேரா தேவி
  rationale: ‘வெட்டிப்போட்டான்’ என்பது வழிபாட்டுப் பொருளைச் சுட்டுகிறது; எனினும் ‘கம்பம்’ என்று குறிப்பிட்டால் மூலத்தில் இல்லாத வடிவத்தை உறுதிப்படுத்திவிடும், ‘தேவி’ என்று மொழிபெயர்த்தால் இங்குள்ள பொருளைத் தவறாக அடையாளப்படுத்தக்கூடும். ஆகவே பெயர் அப்படியே வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: וְיָמֹת என்பதன் கட்டளை வலிமை
  choice: அவன் சாக வேண்டும்
  alternative: அவன் சாகட்டும்; அவன் கொல்லப்பட வேண்டும்
  rationale: இது மகனை வெளியே கொண்டுவருமாறு கூறும் கட்டளையைத் தொடர்ந்து மரணத்தைக் கோருகிறது. தமிழ் வாக்கியம் அந்த வலிமையைத் தெளிவாகத் தருகிறது; அதேவேளை முறையான நீதித்துறை நடைமுறையை மூலத்தைவிட அதிகமாகக் குறிப்பிடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் நேரடியான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பாகால்,’ ‘அசேரா’ ஆகிய வரலாற்று வழிபாட்டுப் பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; மூலத்தின் பொருள் தெளிவின்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
