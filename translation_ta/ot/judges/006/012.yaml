source:
  edition: WLC
  text: וַ/יֵּרָ֥א אֵלָ֖י/ו מַלְּאַ֣ךְ יְהוָ֑ה וַ/יֹּ֣אמֶר אֵלָ֔י/ו יְהוָ֥ה עִמְּ/ךָ֖ גִּבּ֥וֹר הֶ/חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/012.yaml
  text: Then the angel of Yahweh appeared to him and said to him[a], “Yahweh is with you[b], mighty warrior.”
translation:
  language: ta
  text: அப்போது யாவேயின் தூதர்[a] அவனுக்குத் தோன்றி அவனிடம், “யாவே உன்னோடு இருக்கிறார், வலிமைமிக்க வீரனே[b]!” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவேயின் செய்தியாளர்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் மனிதத் தூதரையோ வானதூதரையோ குறிக்கக்கூடும்; இங்குள்ள தோற்றக் காட்சியில் வானதூதர் என்னும் பொருள் மிகவும் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: 'மரபுவழி மொழிபெயர்ப்பு: “வல்லமையுள்ள பராக்கிரமசாலியே.” மூலச் சொற்றொடர் வலிமை, துணிவு, போர்த்திறன் ஆகியவற்றைக் குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: தோன்றி
  rationale: ראה என்பதன் நிஃபால் வடிவம் இங்கு தெய்வீக அல்லது வானுலக வெளிப்பாட்டைக் குறிக்கும் வழக்கமான கதைநடைச் சொல்லாக உள்ளது; நவீன தமிழில் “தோன்றி” இயல்பாகவும் துல்லியமாகவும் அமைகிறது.
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאָךְ என்பது “தூதர்” அல்லது “வானதூதர்” எனப் பொருள்படலாம். தோற்றக் காட்சியின் சூழலில் வானதூதர் என்ற பொருள் இயல்பானது; இருப்பினும் “தூதர்” என்ற சொல் மூலமொழியின் பொருள் அகலத்தைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பொதுவாக ஏற்றுக்கொள்ளப்படும் உச்சரிப்பைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: அவனிடம் … என்றார்
  rationale: மூலத்தில் பெயர் சேர்க்கப்படாமல் ஆண்பால் ஒருமைப் பிரதிப்பெயரே உள்ளது. இயல்பான தமிழ் உரையாடல் அமைப்பில் இதை “அவனிடம் … என்றார்” என வழங்குவது நேர்த்தியானது.
- source_word: יְהוָה עִמְּךָ
  choice: யாவே உன்னோடு இருக்கிறார்
  rationale: வினைச்சொல் இல்லாத எபிரெய வாக்கியம் இச்சூழலில் வாழ்த்தைவிட நிகழ்கால உறுதிக்கூற்றாக இயல்பாகப் புரிகிறது; தமிழில் தேவையான வினைச்சொல் சேர்க்கப்பட்டுள்ளது.
- source_word: גִּבּוֹר הֶחָיִל
  choice: வலிமைமிக்க வீரனே
  rationale: இந்தச் சொற்றொடர் வலிமையும் துணிவும் போர்த்திறனும் கொண்ட ஒருவரைக் குறிக்கிறது. “வலிமைமிக்க வீரன்” என்பது பழமையான அல்லது மிகச் சொற்சொல்லான நடையைத் தவிர்த்து, அதன் போர்சார் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. “யாவே” என்பது அதை ஒரு பட்டப்பெயராக மாற்றாமல் பாதுகாக்கிறது; “யெகோவா” என்பது வேறொரு மரபுவழி வடிவம்.
- issue: מַלְאַךְ יְהוָה என்பவரின் அடையாளம்
  choice: யாவேயின் தூதர்
  alternative: யாவேயின் வானதூதர்
  rationale: இச்சொற்றொடரை மேலும் குறிப்பிட்ட ஓர் இறையியல் அடையாளமாக விளக்காமல், மூலத்தின் சொல்லாட்சியையும் அதிலுள்ள இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
- issue: יְהוָה עִמְּךָ என்ற வினையற்ற கூற்றின் தன்மை
  choice: யாவே உன்னோடு இருக்கிறார்
  alternative: யாவே உன்னோடு இருப்பாராக
  rationale: சூழலில் இது ஆசீர்வாத விருப்பத்தைவிட கிதியோனுக்குக் கூறப்படும் உறுதிக்கூற்றாகத் தெரிகிறது; எனினும் எபிரெய வினையற்ற அமைப்பு தனித்து பார்க்கையில் வாழ்த்தாகவும் வாசிக்கப்படலாம்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. நேரடி அழைப்பைத் தெளிவாக்க “வீரனே” என்ற விளிவேற்றுமையும் உரையின் வலிமையை வெளிப்படுத்த வியப்புக்குறியும் பயன்படுத்தப்பட்டுள்ளன; மூலத்தில் இல்லாத “கிதியோன்” என்ற பெயர் சேர்க்கப்படவில்லை.
