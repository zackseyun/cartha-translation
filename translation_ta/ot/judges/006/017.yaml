  text: וַ/יֹּ֣אמֶר אֵלָ֔י/ו אִם נָ֛א מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ וְ/עָשִׂ֤יתָ לִּ/י֙ א֔וֹת שָׁ/אַתָּ֖ה מְדַבֵּ֥ר עִמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/017.yaml
  text: And he said to him, “If now I have found favor in your eyes, then give me a sign that you are the one speaking with me.”
translation:
  language: ta
  text: அவன் அவரிடம், “தயவுசெய்து, உமது பார்வையில் எனக்குத் தயவு கிடைத்திருந்தால், நீரே என்னோடு பேசுகிறீர் என்பதற்கு எனக்கு ஓர் அடையாளம் தாரும்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: உமது கண்களில் எனக்குத் தயவு கிடைத்திருக்குமானால்
  rationale: ‘ஒருவரின் கண்களில் தயவு காணுதல்’ என்ற எபிரேய மரபுத்தொடரின் உருவகத்தைத் தக்கவைத்து, இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: וְעָשִׂיתָ לִּי אוֹת
  choice: எனக்கு ஓர் அடையாளம் தாரும்
  rationale: சொல்லாட்சிப்படி ‘எனக்காக ஓர் அடையாளத்தைச் செய்’ என்பதன் இயல்பான தமிழாக்கம்; அடையாளத்தை அருளும்படி கேட்கும் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: שָׁאַתָּה מְדַבֵּר עִמִּי
  choice: என்னோடு பேசுகிறவர் நீர்தான் என்பதற்கு
  rationale: אַתָּה மீது உள்ள வலியுறுத்தலை ‘நீர்தான்’ எனப் பிரதிபலித்து, பேசுகிறவரின் அடையாளத்தை உறுதிப்படுத்தும் வேண்டுகோளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: கிதியோன் பேசுகிறவரின் அடையாளத்தை உறுதிப்படுத்தக் கோருவது
  choice: என்னோடு பேசுகிறவர் நீர்தான் என்பதற்கு
  alternative: நீரே என்னோடு பேசுகிறீர் என்பதற்கு
  rationale: மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது; பேசுகிறவரை இவ்வசனத்திலேயே இறையியல் ரீதியாக மேலும் குறிப்பிட்டு அடையாளப்படுத்தாமல், உரையில் உள்ள பதற்றத்தையும் சூழலையும் தக்கவைக்கிறது.
translation_notes:
  register: மரியாதை ஒருமை (‘உமது’, ‘நீர்’, ‘தாரும்’) பயன்படுத்தப்பட்டுள்ளது. நடை நவீனமானதும் கண்ணியமானதும்; எபிரேய உருவகம் தேவையற்ற கடினத்தன்மையின்றித் தக்கவைக்கப்பட்டுள்ளது.
