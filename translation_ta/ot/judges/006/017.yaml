- from: அவன் அவரிடம், “இப்போது உமது கண்களில் எனக்குத் தயவு கிடைத்திருக்குமானால், என்னோடு பேசுகிறவர் நீர்தான் என்பதற்கு எனக்கு ஓர் அடையாளம் தாரும்” என்றான்.
  to: அவன் அவரிடம், “தயவுசெய்து, உமது பார்வையில் எனக்குத் தயவு கிடைத்திருந்தால், நீரே என்னோடு பேசுகிறீர் என்பதற்கு எனக்கு ஓர் அடையாளம் தாரும்” என்றான்.
