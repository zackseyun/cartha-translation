translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கூடாரங்கள் வந்துசேரும்’ என்ற எபிரெயப் படிமம் பிரதான உரையில் பேணப்பட்டு, அதன் உருவக மாற்றுப் பயன்பாடு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. தொடர்ச்சியாக நிகழ்ந்த கடந்தகாலப் படையெடுப்பைத் தமிழ் கதைநடை வழக்கில் ‘வருவார்கள்’ என்று தரப்பட்டுள்ளது.
