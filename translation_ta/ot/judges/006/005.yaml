revisions:
- from: ஏனெனில், அவர்களும் அவர்களுடைய கால்நடைகளும் வருவார்கள்; அவர்களுடைய கூடாரங்களும்[b] திரளான வெட்டுக்கிளிகளைப் போல[a] வந்துசேரும். அவர்களுக்கும் அவர்களுடைய ஒட்டகங்களுக்கும் எண்ணிக்கையே இருக்காது; நாட்டை அழிப்பதற்காக[c] அவர்கள் அதற்குள் வருவார்கள்.
  to: ஏனெனில், அவர்களும் அவர்களுடைய கால்நடைகளும் மேலே வருவார்கள்; அவர்களுடைய கூடாரங்களும் வெட்டுக்கிளிகளைப்போல் எண்ணிக்கையில் மிகுதியாக வந்தன. அவர்களுக்கும் அவர்களுடைய ஒட்டகங்களுக்கும் எண்ணிக்கையே இருக்காது; நாட்டை அழிப்பதற்காக அவர்கள் நாட்டிற்குள் வந்தார்கள்.
  rationale: The revision restores the directional nuance of 'come up,' distinguishes the earlier customary incursion from the final completed entry, and renders the locust comparison as one of overwhelming number. Footnote content is retained with markers placed at their relevant expressions.
