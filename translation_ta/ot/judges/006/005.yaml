base_translation:
  language: en
  yaml_path: translation/ot/judges/006/005.yaml
  text: For they and their livestock would come up[a], and their tents would come like locusts in multitude; both they and their camels were without number[c][b], and they came into the land to destroy it.
translation:
  language: ta
  text: ஏனெனில், அவர்களும் அவர்களுடைய கால்நடைகளும் மேலே வருவார்கள்; அவர்களுடைய கூடாரங்களும் வெட்டுக்கிளிகளைப்போல் எண்ணிக்கையில் மிகுதியாக வந்தன. அவர்களுக்கும் அவர்களுடைய ஒட்டகங்களுக்கும் எண்ணிக்கையே இருக்காது; நாட்டை அழிப்பதற்காக அவர்கள் நாட்டிற்குள் வந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் இஸ்ரவேலருக்கு ஏற்பட்ட வறுமைக்கான காரணத்தை அறிமுகப்படுத்துவதால், விளக்கத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: הֵם וּמִקְנֵיהֶם יַעֲלוּ
  choice: அவர்களும் அவர்களுடைய கால்நடைகளும் வருவார்கள்
  rationale: மக்களையும் அவர்களுடைய எல்லா வகை வளர்ப்பு விலங்குகளையும் தனித்தனியாகக் குறிப்பிடும் எபிரெயச் சொல்லமைப்பைப் பேணுகிறது. இறந்தகாலத்தில் வழக்கமாக மீண்டும் மீண்டும் நடந்த செயலைத் தமிழில் சூழலுக்கு ஏற்ற ‘வருவார்கள்’ தெரிவிக்கிறது.
- source_word: וְאָהֳלֵיהֶם יָבֹאוּ
  choice: அவர்களுடைய கூடாரங்களும் வந்துசேரும்
  rationale: படையெடுப்போரின் முகாம்களை ‘கூடாரங்கள்’ என்று உருவக மாற்றாகக் கூறும் எபிரெய மொழியின் உயிரோட்டமான படிமத்தைத் தக்கவைக்கிறது.
- source_word: כְדֵי אַרְבֶּה לָרֹב
  choice: திரளான வெட்டுக்கிளிகளைப் போல
  rationale: படையெடுப்போரின் பெருந்திரளை வெட்டுக்கிளிகளின் எண்ணிக்கையோடு ஒப்பிடும் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וְלָהֶם וְלִגְמַלֵּיהֶם אֵין מִסְפָּר
  choice: அவர்களுக்கும் அவர்களுடைய ஒட்டகங்களுக்கும் எண்ணிக்கையே இருக்காது
  rationale: மக்களும் ஒட்டகங்களும் கணக்கிட முடியாத அளவில் இருந்தனர் என்ற வலியுறுத்தலையும் ‘எண்ணிக்கை இல்லை’ என்ற எபிரெய மரபுத்தொடரையும் பேணுகிறது.
- source_word: וַיָּבֹאוּ בָאָרֶץ
  choice: அவர்கள் அதற்குள் வருவார்கள்
  rationale: முன்னர் குறிப்பிடப்பட்ட நாட்டுக்குள் அவர்கள் நுழைவதைச் சுருக்கமாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: לְשַׁחֲתָהּ
  choice: நாட்டை அழிப்பதற்காக
  rationale: படையெடுப்பின் நோக்கத்தை வெளிப்படுத்தும் பெயரெச்ச வினை வடிவத்தையும், שׁחת என்பதன் பரந்த அடிப்படைப் பொருளையும் தருகிறது.
