  text: וַ/יֹּ֤אמֶר גִּדְעוֹן֙ אֶל הָ֣/אֱלֹהִ֔ים אַל יִ֤חַר אַפְּ/ךָ֙ בִּ֔/י וַ/אֲדַבְּרָ֖ה אַ֣ךְ הַ/פָּ֑עַם אֲנַסֶּ֤ה נָּא רַק הַ/פַּ֨עַם֙ בַּ/גִּזָּ֔ה יְהִי נָ֨א חֹ֤רֶב אֶל הַ/גִּזָּה֙ לְ/בַדָּ֔/הּ וְ/עַל כָּל הָ/אָ֖רֶץ יִֽהְיֶה טָּֽל־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/039.yaml
  text: 'Then Gideon said to God[a], “Do not let your anger burn against me, and let me speak just this once. Please let me test just this once with the fleece: let there be dryness on the fleece alone[c][b], and on all the ground let there be dew.”'
translation:
  language: ta
  text: அப்போது கிதியோன் கடவுளிடம், “என்மீது உமது கோபம் பற்றியெரிய வேண்டாம்[a]. இந்த ஒருமுறை மட்டும் பேச என்னை அனுமதியுங்கள். தயவுசெய்து ஆட்டுமயிரைக் கொண்டு இந்த ஒருமுறை மட்டும் சோதித்துப் பார்க்க என்னை அனுமதியுங்கள்[b]. ஆட்டுமயிர் மட்டும் உலர்ந்திருக்கட்டும்; நிலம் முழுவதிலும்[c] பனித்துளிகள் இருக்கட்டும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்மீது கோபப்பட வேண்டாம்.” எபிரெய மரபுத்தொடர் சொல்லுக்குச் சொல், “என்மீது உமது கோபம் எரிய வேண்டாம்” என்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆட்டுமயிரைக் கொண்டு இந்த ஒருமுறை மட்டும் முயன்று பார்க்க என்னை அனுமதியுங்கள்.”
    reason: lexical_alternative
  - marker: c
    text: “நிலம்” என்பதற்கு “நாடு” அல்லது “பூமி” என்றும் பொருள் கொள்ளலாம்; இங்கு ஆட்டுமயிருக்கு மாறாக அதைச் சுற்றியுள்ள நிலப்பரப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יִחַר אַפְּךָ בִּי
  choice: என்மீது உமது கோபம் பற்றியெரிய வேண்டாம்
  rationale: ‘கோபம் எரிதல்’ என்ற எபிரெய மரபுத்தொடரின் உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது; வெறுமனே ‘கோபப்பட வேண்டாம்’ என்று அதன் வலிமையைத் தணிக்கவில்லை.
- source_word: וַאֲדַבְּרָה אַךְ הַפָּעַם
  choice: இந்த ஒருமுறை மட்டும் நான் பேச அனுமதியும்
  rationale: விருப்பம் அல்லது வேண்டுகோளை உணர்த்தும் cohortative வடிவத்தையும், கோரிக்கையை ஒரே முறைக்கு வரையறுக்கும் אַךְ הַפָּעַם என்பதையும் வெளிப்படுத்துகிறது.
- source_word: אֲנַסֶּה נָּא רַק הַפַּעַם
  choice: இன்னும் இந்த ஒருமுறை மட்டும் சோதித்துப் பார்க்க அனுமதியும்
  rationale: נסה என்பதன் ‘சோதித்தல்/முயன்று பார்த்தல்’ என்ற பொருளையும் נָא தரும் பணிவான வேண்டுகோளையும் காக்கிறது. சோதிக்கப்படுபவர் யார் என்பதைத் தமிழிலும் வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் மறைநிலையைத் தக்கவைக்கிறது.
- source_word: בַּגִּזָּה
  choice: ஆட்டுமயிரைக் கொண்டு
  rationale: גִּזָּה என்பது வெட்டியெடுக்கப்பட்ட ஆட்டுமயிர் அல்லது fleece. ‘கம்பளி’ என்பது தயாரிக்கப்பட்ட போர்வை எனப் புரியக்கூடும் என்பதால், காட்சியிலுள்ள பொருளைத் தெளிவாகவும் இயல்பாகவும் ‘ஆட்டுமயிர்’ என வழங்குகிறது.
- source_word: יְהִי נָא חֹרֶב אֶל הַגִּזָּה לְבַדָּהּ
  choice: ஆட்டுமயிர் மட்டும் உலர்ந்திருக்கட்டும்
  rationale: חֹרֶב இங்கு பரவலான வறட்சியைக் காட்டிலும் உலர்ந்த நிலையைக் குறிக்கிறது. ‘மட்டும்’ என்பது לְבַדָּהּ கூறும் தனித்த வரம்பைத் தெளிவாக்குகிறது.
- source_word: וְעַל כָּל הָאָרֶץ יִהְיֶה טָּל
  choice: நிலம் முழுவதிலும் பனித்துளிகள் இருக்கட்டும்
  rationale: உடனடி சூழலில் הָאָרֶץ உலகம் முழுவதையும் அல்ல, ஆட்டுமயிரைச் சுற்றியுள்ள நிலப்பரப்பைக் குறிக்கிறது. טַל என்பதற்கு நவீன வாசகருக்குத் தெளிவான ‘பனித்துளிகள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָאֱלֹהִים
  choice: கடவுள்
  rationale: இக்கதைச் சூழலில் இஸ்ரவேலின் கடவுளைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
theological_decisions:
- issue: கிதியோன் கடவுளைச் சோதிக்கிறாரா அல்லது ஓர் அடையாளத்தைப் பணிவுடன் கோருகிறாரா என்பதன் மதிப்பீடு
  choice: ‘சோதித்துப் பார்க்க’ என்று மொழிபெயர்த்து, செயப்படுபொருளைச் சேர்க்காமல், கோபத்தைத் தவிர்க்க வேண்டிய பணிவான வேண்டுகோளையும் மீண்டும் சோதிக்கும் துணிவையும் ஒன்றாகத் தக்கவைத்தல்
  alternative: அவமதிப்பான முறையில் ‘கடவுளைச் சோதிக்க’ என்று வெளிப்படையாகச் சேர்த்தல், அல்லது ‘உறுதிப்படுத்திக்கொள்ள’ என்று மென்மையாக்குதல்
  rationale: எபிரெய உரை கிதியோனின் செயலைப் பாராட்டவோ கண்டிக்கவோ இவ்வசனத்தில் நேரடியாகச் சொல்லவில்லை. ஆகவே அதன் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடை எளிமையும் இணைந்த பாணி பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய உரையில் ‘உமது’, ‘அனுமதியும்’ ஆகிய மரியாதை வடிவங்கள் இடம் பெற்றுள்ளன. ‘பனி’ என்பது snow என்றும் புரியக்கூடும் என்பதால் ‘பனித்துளிகள்’ எனத் தெளிவாக்கப்பட்டுள்ளது.
