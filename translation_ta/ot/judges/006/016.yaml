  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ יְהוָ֔ה כִּ֥י אֶהְיֶ֖ה עִמָּ֑/ךְ וְ/הִכִּיתָ֥ אֶת מִדְיָ֖ן כְּ/אִ֥ישׁ אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/016.yaml
  text: And Yahweh said to him[a], “Surely I will be with you, and you will strike Midian as one man.”
translation:
  language: ta
  text: யாவே அவனிடம், “நிச்சயமாக நான் உன்னோடு இருப்பேன்; நீ மீதியானை ஒரே மனிதனைத் தாக்குவதுபோல் தாக்குவாய்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலருக்கு வெளிப்படுத்தப்பட்ட இறைத் திருப்பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: அவனிடம் ... என்றார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; மரியாதைப் பன்மை இறைவனைக் குறிக்கிறது.
- source_word: כִּי
  choice: நிச்சயமாக
  rationale: இங்கு கிதியோனுக்கு அளிக்கப்படும் உறுதியை வலியுறுத்தும் சொல்லாகப் புரிந்துகொள்ளப்படுகிறது; காரணப்பொருளில் ‘ஏனெனில்’ என்றும் கொள்ள வாய்ப்புள்ளது.
- source_word: אֶהְיֶה עִמָּךְ
  choice: நான் உன்னோடு இருப்பேன்
  rationale: வாக்குறுதியின் சூழலில் முதல் நபர் ஒருமை imperfect வினையின் எதிர்கால உறுதியை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְהִכִּיתָ
  choice: நீ ... தாக்குவாய்
  rationale: נכה என்பதன் அடிப்படைப் பொருளுக்கு நெருக்கமாக இருந்து, வெற்றியின் முடிவை மட்டும் விளக்கமாகச் சேர்க்காமல் விடுகிறது.
- source_word: אֶת מִדְיָן
  choice: மீதியானை
  rationale: மூலத்தில் உள்ள ‘மீதியான்’ என்ற ஒருமைப் பெயரை, அந்த மக்களைக் கூட்டாகக் குறிக்கும் வகையில் அப்படியே வைத்திருக்கிறது.
- source_word: כְּאִישׁ אֶחָד
  choice: ஒரே மனிதனைப்போல்
  rationale: எபிரெய மூலத்தின் ஒருமை ஆண்பால் உருவகத்தைப் பாதுகாத்து, படையை ஒரே மனிதனாகக் கருதித் தாக்குதல் அல்லது ஒருமுகமான தீர்மானமான தாக்குதல் என்ற மொழிவழக்குப் பரப்பைத் திறந்தே வைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டம் அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைத் திருப்பெயரே வருகிறது; எனவே அதனைத் தமிழில் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: כְּאִישׁ אֶחָד என்ற மொழிவழக்கின் பொருள்
  choice: ஒரே மனிதனைப்போல்
  alternative: ஒரே மனிதனைத் தாக்குவதுபோல் / ஒரே அணியாக
  rationale: மூல உருவகத்தையும் அதன் சாத்தியமான பொருள் நிழல்களையும் மொழிபெயர்ப்பிலேயே வைத்திருந்து, குறிப்பிட்ட ஒரு விளக்கத்துக்குள் அதைச் சுருக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. உரையாடலில் கிதியோனை ஒருமையில் அழைக்கும் வடிவமும், இறைவனைக் குறிக்கும் மரியாதை வினைமுற்றும் பயன்படுத்தப்பட்டுள்ளன.
