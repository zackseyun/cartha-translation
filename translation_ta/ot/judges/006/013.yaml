- from: கிதியோன் அவரிடம், “மன்னிக்க வேண்டும், ஐயா,[a] யாவே நம்மோடு இருக்கிறார் என்றால், இவையெல்லாம் ஏன் நமக்கு நேரிட்டன? ‘யாவே நம்மை எகிப்திலிருந்து வெளியே அழைத்துக்கொண்டு வரவில்லையா?’ என்று நம் முன்னோர்கள் நமக்கு எடுத்துரைத்த அவருடைய அற்புதச் செயல்கள்[b] எல்லாம் எங்கே? ஆனால் இப்போது யாவே நம்மைக் கைவிட்டு, மீதியானின் கையில்[c] ஒப்புக்கொடுத்துவிட்டார்” என்றான்.
  to: கிதியோன் அவரிடம், “தயவுசெய்து, ஐயா,[a] யாவே நம்மோடு இருக்கிறார் என்றால், இவையெல்லாம் ஏன் நமக்கு நேரிட்டன? ‘யாவே நம்மை எகிப்திலிருந்து வெளியே கொண்டுவந்தாரல்லவா?’ என்று நம் முன்னோர்கள் நமக்குச் சொன்ன அவருடைய அற்புதச் செயல்கள்[b] எல்லாம் எங்கே? ஆனால் இப்போது யாவே நம்மைக் கைவிட்டு, மீதியானின் கையில்[c] ஒப்புக்கொடுத்துவிட்டார்” என்றான்.
