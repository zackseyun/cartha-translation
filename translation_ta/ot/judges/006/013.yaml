base_translation:
  language: en
  yaml_path: translation/ot/judges/006/013.yaml
  text: Gideon said to him[a], “Please, my lord, if Yahweh is with us, why then has all this happened to us? And where are all his wonders that our fathers told us about, saying[c][b], ‘Did not Yahweh bring us up from Egypt?’ But now Yahweh has abandoned us and given us into the hand of Midian.”
translation:
  language: ta
  text: கிதியோன் அவரிடம், “தயவுசெய்து, ஐயா,[a] யாவே நம்மோடு இருக்கிறார் என்றால், இவையெல்லாம் ஏன் நமக்கு நேரிட்டன? ‘யாவே நம்மை எகிப்திலிருந்து வெளியே கொண்டுவந்தாரல்லவா?’ என்று நம் முன்னோர்கள் நமக்குச் சொன்ன அவருடைய அற்புதச் செயல்கள்[b] எல்லாம் எங்கே? ஆனால் இப்போது யாவே நம்மைக் கைவிட்டு, மீதியானின் கையில்[c] ஒப்புக்கொடுத்துவிட்டார்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மன்னிக்கவும், ஐயா.” எபிரெயில் இது பணிவான மரியாதைச் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவருடைய வியப்பூட்டும் செயல்கள்” அல்லது “அவருடைய அதிசயங்கள்.”
    reason: lexical_alternative
  - marker: c
    text: “மீதியானின் கையில்” என்பது “மீதியானின் அதிகாரத்துக்குள்” என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: idiom_explanation
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: மன்னிக்க வேண்டும், ஐயா
  rationale: בִּי என்பது பணிவான வேண்டுகோள் அல்லது உரையாடலைத் தொடங்கும் மரியாதைச் சொல்; אֲדֹנִי இங்கு தூதரை மரியாதையுடன் அழைக்கிறது. தெய்வப் பட்டத்தை முன்கூட்டியே உணர்த்தாமல் நவீனத் தமிழில் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதாகமத்தில் உள்ள தனிப்பட்ட இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְיֵשׁ יְהוָה עִמָּנוּ
  choice: யாவே நம்மோடு இருக்கிறார் என்றால்
  rationale: சொல்லுக்கு நெருக்கமாக ‘யாவே நம்மோடு இருக்கிறார்’ என்றிருந்தாலும், அடுத்து வரும் எதிர்வினாக்கள் இங்கே நிபந்தனைப் பொருளைத் தெளிவாகக் காட்டுகின்றன.
- source_word: לָמָּה מְצָאַתְנוּ כָּל זֹאת
  choice: இவையெல்லாம் ஏன் நமக்கு நேரிட்டன?
  rationale: מצא என்பது தீங்கு அல்லது துன்பம் ஒருவரை வந்தடைவதைக் குறிக்கலாம்; ‘நேரிட்டன’ என்பது அந்தப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: נִפְלְאֹתָיו
  choice: அவருடைய அற்புதச் செயல்கள்
  rationale: இச்சொல் வியப்பூட்டும் அசாதாரண செயல்களைக் குறிக்கிறது. ‘அற்புதச் செயல்கள்’ என்பது அவற்றை வெறும் காட்சிகளாக அல்லாமல் யாவே செய்த செயல்களாகவும் வெளிப்படுத்துகிறது.
- source_word: סִפְּרוּ לָנוּ אֲבוֹתֵינוּ
  choice: நம் முன்னோர்கள் நமக்கு எடுத்துரைத்த
  rationale: אֲבוֹתֵינוּ இங்கு இஸ்ரவேலின் முந்தைய தலைமுறையினரைக் குறிக்கிறது; ‘முன்னோர்கள்’ நவீனத் தமிழில் அந்த வரலாற்று மரபைத் தெளிவாகக் கூறுகிறது.
- source_word: הֲלֹא מִמִּצְרַיִם הֶעֱלָנוּ יְהוָה
  choice: யாவே நம்மை எகிப்திலிருந்து வெளியே அழைத்துக்கொண்டு வரவில்லையா?
  rationale: הֲלֹא உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் வினா. ‘வெளியே அழைத்துக்கொண்டு வந்தார்’ என்பது எகிப்திலிருந்து புறப்பட்ட நிகழ்வைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: נְטָשָׁנוּ
  choice: நம்மைக் கைவிட்டு
  rationale: נטש என்பது விட்டுவிடுதல் அல்லது கைவிடுதலைக் குறிக்கிறது; கிதியோனின் முறையீட்டின் உணர்வுச் செறிவை ‘கைவிட்டு’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: וַיִּתְּנֵנוּ בְּכַף מִדְיָן
  choice: மீதியானின் கையில் ஒப்புக்கொடுத்துவிட்டார்
  rationale: ‘கையில் கொடுத்தல்’ என்ற எபிரெய உருவகம் ஒருவரின் அதிகாரத்திற்குள் ஒப்படைப்பதைக் குறிக்கிறது. உருவகத்தை முதன்மை உரையில் வைத்துப் பொருளை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: מִדְיָן
  choice: மீதியான்
  rationale: மக்கள் இனத்தையும் அவர்களின் நாட்டையும் குறிக்கும் பெயரின் நிலைபெற்ற தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் ஒரு பட்டம் அல்ல, நான்கெழுத்து இறைப் பெயரே நேரடியாக வருகிறது; ஆகவே தனிப்பட்ட பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: אֲדֹנִי என்ற அழைப்பின் குறிப்பு
  choice: தூதருக்கான மரியாதை அழைப்பு—‘ஐயா’
  alternative: தெய்வப் பட்டம்—‘ஆண்டவரே’
  rationale: இந்த உரையாடல் கட்டத்தில் கிதியோன் எதிரிலுள்ளவரை மரியாதையுடன் அழைக்கிறான். இச்சொற்றொடர் மட்டும் கட்டாயப்படுத்தாத தெய்வ அடையாளத்தை மொழிபெயர்ப்பில் முன்கூட்டியே தீர்மானிக்கவில்லை.
- issue: וְיֵשׁ என்ற தொடரின் தர்க்கப் பொருள்
  choice: நிபந்தனை—‘இருக்கிறார் என்றால்’
  alternative: நேரடி இணைப்பு—‘இருக்கிறார்; அப்படியிருக்க’
  rationale: எபிரெய வடிவம் நேரடியாக ‘மற்றும்/அப்படியிருக்க யாவே நம்மோடு இருக்கிறார்’ என இருக்கலாம்; ஆனால் தொடர்ந்து வரும் ‘ஏன்?’ மற்றும் ‘எங்கே?’ என்ற வினாக்கள் கிதியோன் அந்தக் கூற்றை நிபந்தனையாகச் சோதிப்பதைக் காட்டுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. கிதியோனின் மரியாதையும் அதே நேரத்தில் அவரது கூர்மையான முறையீடும் பாதுகாக்கப்பட்டுள்ளன. இறைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டு, אֲדֹנִי தெய்வப் பட்டமாக முன்கூட்டியே விளக்கப்படாமல் ‘ஐயா’ என வழங்கப்பட்டுள்ளது.
