source:
  edition: WLC
  text: אַל נָ֨א תָמֻ֤שׁ מִ/זֶּה֙ עַד בֹּאִ֣/י אֵלֶ֔י/ךָ וְ/הֹֽצֵאתִי֙ אֶת מִנְחָתִ֔/י וְ/הִנַּחְתִּ֖י לְ/פָנֶ֑י/ךָ וַ/יֹּאמַ֕ר אָנֹכִ֥י אֵשֵׁ֖ב עַ֥ד שׁוּבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/018.yaml
  text: Please do not depart from here until I come to you and bring out my offering and set it before you." And he said[a], "I will stay until you return.
translation:
  language: ta
  text: “நான் உம்மிடம் வந்து, என் காணிக்கையை[a] வெளியே கொண்டுவந்து உம்முன் வைக்கும்வரை, தயவுசெய்து இங்கிருந்து போய்விடாதீர்” என்றான். அதற்கு அவர், “நீ திரும்பிவரும்வரை நான் இங்கேயே இருப்பேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “என் பரிசை” அல்லது “என் திறையை”; எபிரெயச் சொல் பொதுவாக ஒருவர்முன் படைக்கப்படும் பரிசையும், சில சூழல்களில் வழிபாட்டுக் காணிக்கையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָמֻשׁ מִזֶּה
  choice: இங்கிருந்து போய்விடாதீர்
  rationale: מוש என்பது இச்சூழலில் ஓர் இடத்தைவிட்டு அகல்வதைக் குறிக்கிறது. மரியாதையான எதிர்மறை வேண்டுகோளாக இச்சொற்றொடர் இயல்பாக உள்ளது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: வேண்டுகோளின் பணிவான தொனியை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַד בֹּאִי אֵלֶיךָ
  choice: நான் உம்மிடம் ... வரும்வரை
  rationale: பெயரெச்சத் தொடரை இயல்பான தமிழ் வினைமுற்றுத் தொடராக வழங்குகிறது.
- source_word: וְהוֹצֵאתִי
  choice: வெளியே கொண்டுவந்து
  rationale: ஹிபீல் வடிவத்தின் ‘வெளியே கொண்டுவருதல்’ என்ற காரணவினைப் பொருளைப் பாதுகாக்கிறது.
- source_word: מִנְחָתִי
  choice: என் காணிக்கையை
  rationale: מִנְחָה என்பது பரிசு, திறை அல்லது வழிபாட்டுக் காணிக்கை எனப் பலவாறு அமையலாம். ‘காணிக்கை’ சமயத் தொடர்பைத் தக்கவைத்தாலும் தானியக் காணிக்கை என்று அளவுக்கு மீறிக் குறுக்குவதில்லை.
- source_word: וְהִנַּחְתִּי לְפָנֶיךָ
  choice: உம்முன் வைக்கும்வரை
  rationale: ஒருவரின் முன்னிலையில் ஒன்றை வைப்பது என்ற எபிரெய மரபுத்தொடரை இயல்பாகத் தருகிறது.
- source_word: אָנֹכִי אֵשֵׁב
  choice: நான் இங்கேயே இருப்பேன்
  rationale: ישב என்பதன் சொற்பொருள் ‘அமருதல்’ என்றாலும், இங்கு அந்த இடத்திலேயே தங்கியிருப்பதே கருத்து.
- source_word: עַד שׁוּבֶךָ
  choice: நீ திரும்பிவரும்வரை
  rationale: எபிரெய infinitive construct வடிவை இயல்பான தமிழ் காலத் துணைவாக்கியமாக வழங்குகிறது.
theological_decisions:
- issue: கிதியோன் கொண்டுவரும் מִנְחָה என்பதன் பொருள்
  choice: காணிக்கை
  alternative: பரிசு; திறை; தானியக் காணிக்கை
  rationale: கதை பின்னர் தெய்வீகமாக ஏற்றுக்கொள்ளப்படும் படைப்பை நோக்கிச் செல்கிறது. ‘காணிக்கை’ அந்த வழிபாட்டுச் சாயலைத் தக்கவைத்து, இதை முறையான தானியக் காணிக்கை என்று முன்கூட்டியே வரையறுப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. கிதியோன் விருந்தினரிடம் பேசுவதால் ‘உம்மிடம்/உம்முன்/போய்விடாதீர்’ என்ற மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டன; பதிலில் வரும் ஒருமை இரண்டாம் நபர் வடிவம் மூலத்தின் நேரடித்தன்மையைப் பின்பற்றி ‘நீ’ என வழங்கப்பட்டது. மேற்கோளின் பேசுபவர்களைத் தெளிவுபடுத்த ‘என்றான்/என்றார்’ பயன்படுத்தப்பட்டது.
