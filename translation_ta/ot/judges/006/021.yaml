base_translation:
  language: en
  yaml_path: translation/ot/judges/006/021.yaml
  text: Then the angel of Yahweh reached out the tip of the staff that was in his hand and touched the meat and the unleavened bread[a]. And fire went up from the rock and consumed the meat and the unleavened bread[c][b]. Then the angel of Yahweh went away from his sight.
translation:
  language: ta
  text: அப்போது யாவேயின் தூதர்[a] தனது கையிலிருந்த கோலின் நுனியை நீட்டி, இறைச்சியையும் புளிப்பில்லாத அப்பங்களையும் தொட்டார். உடனே கற்பாறையிலிருந்து நெருப்பு எழுந்து, இறைச்சியையும் புளிப்பில்லாத அப்பங்களையும் எரித்து விழுங்கியது. பின்பு யாவேயின் தூதர் கிதியோனின் பார்வையிலிருந்து விலகிச் சென்றார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் தேவதூதர்.” எபிரெயச் சொல் “தூதர்” அல்லது “தேவதூதர்” எனப் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அவருடைய கண்களிலிருந்து சென்றார்”; அதாவது, அவர் இனி கிதியோனுக்குக் காணப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: யெகோவாவின் தூதர்
  rationale: מַלְאָךְ என்பது ‘தூதர்’ அல்லது சூழலின்படி ‘தேவதூதர்’ எனப் பொருள்படலாம். இங்கு இயற்கைக்கு அப்பாற்பட்ட செயல் இடம்பெற்றாலும், எபிரெயச் சொல்லின் அடிப்படைப் பொருளையும் அதன் தெளிவின்மையையும் காக்க ‘தூதர்’ பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்து இறைப்பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவமான ‘யெகோவா’ என வழங்குகிறது.
- source_word: קְצֵה הַמִּשְׁעֶנֶת
  choice: கோலின் நுனி
  rationale: קָצֶה என்பது நுனி அல்லது கடைசி முனை; מִשְׁעֶנֶת என்பது தாங்குகோல் அல்லது கோல். சூழலில் இயல்பான ‘கோலின் நுனி’ துல்லியமானது.
- source_word: וַיִּשְׁלַח
  choice: நீட்டி
  rationale: கோலின் நுனியை முன்னே நீட்டிய செயலை இச்சூழலில் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בָּשָׂר
  choice: இறைச்சி
  rationale: சொல்லின் நேரடிப் பொருள் ‘சதை’; இங்கு கிதியோன் படைத்த உணவைக் குறிப்பதால் ‘இறைச்சி’ என்பது இயல்பான சமையல் சார்ந்த பொருள்.
- source_word: מַצּוֹת
  choice: புளிப்பில்லாத அப்பங்கள்
  rationale: பன்மை வடிவத்தையும் புளிப்புச் சேர்க்கப்படாத உணவு என்ற முக்கியப் பொருளையும் காக்கிறது.
- source_word: וַתַּעַל הָאֵשׁ מִן הַצּוּר
  choice: கற்பாறையிலிருந்து நெருப்பு எழுந்து
  rationale: நெருப்பு பாறையிலிருந்து மேலெழுந்த காட்சியை எபிரெய வாக்கியத்துக்கு நெருக்கமாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: וַתֹּאכַל
  choice: எரித்து விழுங்கியது
  rationale: வினையின் நேரடிப் படிமம் ‘தின்றது/விழுங்கியது’; நெருப்பைப் பற்றிய தமிழ்ப் பயன்பாட்டில் ‘எரித்து விழுங்கியது’ அந்த வலிமையான படிமத்தையும் விளைவையும் காக்கிறது.
- source_word: הָלַךְ מֵעֵינָיו
  choice: கிதியோனின் பார்வையிலிருந்து மறைந்தார்
  rationale: சொல்லுக்கு சொல் ‘அவருடைய கண்களிலிருந்து சென்றார்.’ தமிழ் வாசகருக்கு அதன் பொருள் தெளிவாக இருக்க ‘பார்வையிலிருந்து மறைந்தார்’ எனப்பட்டது; ‘கிதியோன்’ என்பது பிரதிப்பெயரின் சுட்டைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் ஒரு பட்டமல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பெயர் நேரடியாக உள்ளது. அதைத் தமிழில் அடையாளம் காணக்கூடிய தனிப்பெயராகக் காக்க ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: מַלְאַךְ என்பவர் ‘தூதரா’ அல்லது ‘தேவதூதரா’
  choice: தூதர்
  alternative: தேவதூதர்
  rationale: இச்சூழலில் அவர் இயற்கைக்கு அப்பாற்பட்டவராகச் செயல்பட்டாலும், מַלְאָךְ என்ற சொல்லின் அடிப்படைப் பொருள் ‘தூதர்.’ உரையின் அடையாளத் தொடர்பை தேவையின்றி முன்கூட்டியே தீர்மானிக்காமல் ‘தூதர்’ எனக் காத்து, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. எபிரெயக் கதையாடலின் செயல்வரிசை காக்கப்பட்டது. ‘தூதர்’ என்ற சொல் மூலத்தின் சொற்பொருள் தெளிவின்மையைப் பேணுகிறது; ‘தேவதூதர்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது. பிரதான உரையின் எல்லா அடிக்குறிப்பு குறிகளும் [a], [b] என நேரடியாக இடம்பெற்றுள்ளன.
