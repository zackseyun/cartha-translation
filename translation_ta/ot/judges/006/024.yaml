base_translation:
  language: en
  yaml_path: translation/ot/judges/006/024.yaml
  text: Then Gideon built an altar there to Yahweh and called it[a], “Yahweh Is Peace.” It remains there to this day in Ophrah of the Abiezrites.
translation:
  language: ta
  text: அப்போது கிதியோன் அங்கே யாவேக்கு ஒரு பலிபீடத்தைக் கட்டி, அதற்கு “யாவே சமாதானம்”[a] என்று பெயரிட்டான். அது இன்றுவரை அபியேசரியரின் ஒப்ராவில் இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயம்: “YHWH ஷாலோம்”; மரபாக “யாவே-ஷாலோம்” என்று ஒலிபெயர்க்கப்படுகிறது. “ஷாலோம்” என்பதில் சமாதானம், நலம், முழுமை ஆகிய பொருள் நிழல்களும் உள்ளன.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: கட்டினான்
  rationale: பலிபீடத்தை அமைப்பதைக் குறிக்கும் இயல்பான தமிழ் வினைச்சொல்; எபிரெயக் கதைநடையின் பொருளை நேராகக் கொடுக்கிறது.
- source_word: מִזְבֵּחַ
  choice: பலிபீடம்
  rationale: வழிபாட்டுக்குரிய altar என்பதற்கான நிலையான, தெளிவான தமிழ்ச் சொல்.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: ל முன்னொட்டு அர்ப்பணிப்பு அல்லது நோக்கத்தைச் சுட்டுகிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיִּקְרָא לוֹ
  choice: அதற்கு ... என்று பெயரிட்டான்
  rationale: பெயரிடும் சூழலில் קרא + ל என்பதன் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה שָׁלוֹם
  choice: யெகோவா சமாதானம்
  rationale: வினையற்ற எபிரெயப் பெயரிடும் தொடரின் சுருக்கத்தையும் அதன் உண்மையான இலக்கணத் தெளிவின்மையையும் காக்கிறது; ‘யெகோவா சமாதானமாயிருக்கிறார்’ என வினையைச் சேர்த்து ஒரே விளக்கத்தைத் திணிக்கவில்லை.
- source_word: שָׁלוֹם
  choice: சமாதானம்
  rationale: அமைதி, நலம், முழுமை ஆகிய பரந்த பொருள் நிழல்களைக் கொண்ட שָׁלוֹם என்பதற்கான இச்சூழலின் வழக்கமான, சுருக்கமான தமிழ் இணை.
- source_word: עַד הַיּוֹם הַזֶּה עוֹדֶנּוּ
  choice: அது இன்றுவரை ... இருக்கிறது
  rationale: கதைசொல்லியின் காலம்வரை பலிபீடம் தொடர்ந்து இருந்ததைக் காட்டும் இயல்பான தமிழ் அமைப்பு.
- source_word: בְּעָפְרָת אֲבִי הָעֶזְרִי
  choice: அபியேசரியரின் ஒப்ராவில்
  rationale: இடப்பெயரையும் குல அடையாளத்தையும் இயல்பான தமிழ் உடைமைத் தொடரில் வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது; தமிழ்க் கிறிஸ்தவ வாசகர்களிடையே பரவலாக அறியப்படும் வடிவம் பயன்படுத்தப்படுகிறது.
- issue: יְהוָה שָׁלוֹם என்ற பலிபீடப் பெயரின் பொருள்
  choice: யெகோவா சமாதானம்
  alternative: யெகோவா சமாதானமாயிருக்கிறார்
  rationale: எபிரெயில் இணைப்புவினை இல்லாததால் ‘யெகோவா சமாதானம்’ என்ற பெயரிடும் வடிவம் சமன்பாட்டு அல்லது அறிவிப்பு நுணுக்கத்தைத் திறந்தவையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, எளிதில் புரியும் கதைநடை. மூலத்தின் பெயரிடும் சூத்திரத்தில் உள்ள சுருக்கமும் பொருள் விரிவும் காக்கப்பட்டுள்ளன.
