base_translation:
  language: en
  yaml_path: translation/ot/judges/006/038.yaml
  text: And it was so. He rose early the next day and squeezed the fleece[a], wringing dew from the fleece—a bowlful of water.
translation:
  language: ta
  text: அப்படியே நடந்தது. மறுநாள் அதிகாலையில் அவன் எழுந்து, அந்த ஆட்டுமயிர்த் தொகுதியைப் பிழிந்தான்[a]. அந்த ஆட்டுமயிர்த் தொகுதியிலிருந்து ஒரு கிண்ணம் நிறையத் தண்ணீரைப் பனிநீராகப் பிழிந்தெடுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த ஆட்டுமயிர்த் தொகுதியை அழுத்தினான்” / “அதை முறுக்கிப் பிழிந்தான்.” அதை அழுத்துவதையும் அதிலிருந்து பனிநீரைப் பிழிந்தெடுப்பதையும் விவரிக்க எபிரெயத்தில் அடுத்தடுத்து இரண்டு வினைச்சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כֵן
  choice: அப்படியே நடந்தது
  rationale: கிதியோன் கேட்ட அடையாளம் அவர் கேட்டபடியே நிகழ்ந்ததை உறுதிப்படுத்தும் எபிரெயச் சொற்றொடரை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וַיַּשְׁכֵּם מִמָּחֳרָת
  choice: மறுநாள் அதிகாலையில் அவன் எழுந்து
  rationale: வினைச்சொல்லின் ‘அதிகாலையில் எழுதல்’ என்ற பொருளையும், மறுநாள் என்ற காலக் குறிப்பையும் தெளிவாகக் காக்கிறது.
- source_word: וַיָּזַר אֶת־הַגִּזָּה
  choice: அந்தக் கம்பளியைப் பிழிந்தான்
  rationale: திரவத்தை வெளியேற்றுவதற்காக மயிர்த்தொகுதியை அழுத்தும் செயலை சாதாரண வாசகருக்கு இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיִּמֶץ טַל מִן־הַגִּזָּה
  choice: கம்பளியிலிருந்து ... பனித்துளிகளைப் பிழிந்தெடுத்தான்
  rationale: கம்பளியிலிருந்து படிந்திருந்த பனிநீரை வெளியே எடுத்த செயல்-விளைவு உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מְלֹא הַסֵּפֶל מָיִם
  choice: ஒரு கிண்ணம் நிறையத் தண்ணீர் வரும் அளவுக்கு
  rationale: ஒரு பாத்திரத்தை நிரப்பும் அளவு தண்ணீர் கிடைத்தது என்ற அளவுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַסֵּפֶל
  choice: கிண்ணம்
  rationale: கிண்ணம் அல்லது சிறிய பாத்திரத்தைக் குறிக்கும் சொல்லுக்கு நவீன பொதுத்தமிழில் எளிதாகப் புரியும் இணைச்சொல்.
