revisions:
- from: அப்படியே நடந்தது. மறுநாள் அதிகாலையில் அவன் எழுந்து, அந்தக் கம்பளியைப் பிழிந்தான்[a]. கம்பளியிலிருந்து ஒரு கிண்ணம் நிறையத் தண்ணீர் வரும் அளவுக்குப் பனித்துளிகளைப் பிழிந்தெடுத்தான்.
  to: அப்படியே நடந்தது. மறுநாள் அதிகாலையில் அவன் எழுந்து, அந்த ஆட்டுமயிர்த் தொகுதியைப் பிழிந்தான்[a]. அந்த ஆட்டுமயிர்த் தொகுதியிலிருந்து ஒரு கிண்ணம் நிறையத் தண்ணீரைப் பனிநீராகப் பிழிந்தெடுத்தான்.
  rationale: The revision corrects the referent of גִּזָּה from a blanket-like “கம்பளி” to a fleece-like “ஆட்டுமயிர்த் தொகுதி,” while retaining the source’s two sequential actions. It also renders the resulting liquid and its bowlful quantity more directly and naturally in Tamil. The footnote remains anchored to the first extraction verb and explains the paired Hebrew verbs.
