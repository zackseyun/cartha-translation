  edition: WLC
  text: וְ/הָיָ֖ה אִם זָרַ֣ע יִשְׂרָאֵ֑ל וְ/עָלָ֨ה מִדְיָ֧ן וַֽ/עֲמָלֵ֛ק וּ/בְנֵי קֶ֖דֶם וְ/עָל֥וּ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/003.yaml
  text: And whenever Israel sowed[a], Midian and Amalek and the people of the East would come up against them.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் விதைக்கும் போதெல்லாம், மீதியானியரும் அமாலேக்கியரும் கிழக்கத்திய மக்களும் அவர்களுக்கு[a] எதிராகப் படையெடுத்து வருவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவனுக்கு எதிராக” என்று ஒருமைப் பின்னொட்டு உள்ளது; அது இஸ்ரவேல் மக்களை ஒரே கூட்டமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: போதெல்லாம்
  rationale: היה உடன் வரும் אִם இச்சூழலில் ஒருமுறை நிகழ்ந்த நிபந்தனையை அல்ல, மீண்டும் மீண்டும் நிகழ்ந்த காலச் சூழலைக் குறிக்கிறது. ‘போதெல்லாம்’ அந்த வழக்கமான தொடர்நிகழ்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: זָרַע
  choice: விதைக்கும்
  rationale: விதையை நிலத்தில் விதைப்பதைக் குறிக்கும் நேரடியான வேளாண்மைச் சொல்; தொடர்ச்சியாக நிகழ்ந்த சூழலுக்கேற்ப நிகழ்கால வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயத்தில் உள்ள தனிப்பெயர் இங்கு ஒரு தனிநபரை அல்ல, மக்களினத்தை கூட்டாகக் குறிக்கிறது. தமிழில் அதைத் தெளிவாகவும் இயல்பாகவும் காட்ட ‘மக்கள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: מִדְיָן וַעֲמָלֵק
  choice: மீதியானியரும் அமாலேக்கியரும்
  rationale: மூலத்தில் இனக்குழுக்களை கூட்டாகக் குறிக்கும் தனிப்பெயர்கள் உள்ளன. நவீனத் தமிழில் அவற்றை மக்களினப் பெயர்களாக வழங்குவது பொருளைத் தெளிவாக்குகிறது.
- source_word: וּבְנֵי קֶדֶם
  choice: கிழக்கத்திய மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘கிழக்கின் மகன்கள்’; இது கிழக்குப் பகுதியைச் சேர்ந்த மக்களைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘கிழக்கத்திய மக்கள்’ அதன் கூட்டான பிராந்தியப் பொருளை இயல்பாகத் தருகிறது.
- source_word: וְעָלָה ... וְעָלוּ עָלָיו
  choice: அவர்களுக்கு எதிராகப் படையெடுத்து வருவார்கள்
  rationale: עלה + על இங்கு இஸ்ரவேலை நோக்கிய பகைமையான முன்னேற்றத்தைக் குறிக்கிறது. ‘படையெடுத்து வருவார்கள்’ இயக்கத்தையும் பகைமைச் சூழலையும் ஒருங்கே வெளிப்படுத்துகிறது; எதிராக வருவது மீண்டும் மீண்டும் நடந்ததை எதிர்கால வழக்கநிலை வடிவம் காட்டுகிறது.
theological_decisions:
- issue: இஸ்ரவேலைக் குறிக்கும் ஒருமை பின்னொட்டு
  choice: முதன்மை உரையில் ‘அவர்களுக்கு’ என இயல்பான கூட்டுப் பன்மை; அடிக்குறிப்பில் எபிரெய ஒருமை பதிவு
  alternative: ‘அவனுக்கு’ அல்லது ‘அதற்கு’ எதிராக
  rationale: עָלָיו என்பதில் மூன்றாம் நபர் ஆண்பால் ஒருமைப் பின்னொட்டு இருந்தாலும், அது இங்கு இஸ்ரவேல் மக்களை ஒரே கூட்டமாகக் குறிக்கிறது. தமிழில் ‘அவனுக்கு’ என்பது ஒரு தனி ஆணைக் குறிப்பதுபோல் தவறாகப் புரியலாம்; ‘அதற்கு’ மக்களை உயிரற்ற ஒன்றாகக் காட்டலாம். ஆகவே இயல்பான கூட்டுப் பொருள் முதன்மை உரையில் தரப்பட்டு, மூலத்தின் இலக்கண வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மீதியானியர்’, ‘அமாலேக்கியர்’ ஆகிய வடிவங்கள் தனிநபர்களாக அல்லாமல் மக்களினங்களாக வாசிக்க உதவுகின்றன; ‘படையெடுத்து வருவார்கள்’ தொடர்ச்சியான பகைமை முன்னேற்றத்தை இயல்பாக வெளிப்படுத்துகிறது.
