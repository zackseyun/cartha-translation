translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. தொடர்ச்சியாக நடந்த படையெடுப்பைத் தமிழில் இயல்பாக உணர்த்த ‘அழித்துப்போடுவார்கள்’, ‘விட்டுவைக்க மாட்டார்கள்’ என்ற வடிவங்கள் பயன்படுத்தப்பட்டன. மூலத்தின் பரந்த வாழ்வாதாரப் பொருளும் கால்நடைகளின் கூட்டுப்பொருளும் பாதுகாக்கப்பட்டுள்ளன.
