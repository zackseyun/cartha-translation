  text: וַ/יַּחֲנ֣וּ עֲלֵי/הֶ֗ם וַ/יַּשְׁחִ֨יתוּ֙ אֶת יְב֣וּל הָ/אָ֔רֶץ עַד בּוֹאֲ/ךָ֖ עַזָּ֑ה וְ/לֹֽא יַשְׁאִ֤ירוּ מִֽחְיָה֙ בְּ/יִשְׂרָאֵ֔ל וְ/שֶׂ֥ה וָ/שׁ֖וֹר וַ/חֲמֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/004.yaml
  text: They would encamp against them and destroy the produce of the land as far as Gaza[a], and they would leave no sustenance in Israel, nor sheep, ox[b], or donkey.
translation:
  language: ta
  text: அவர்கள் அவர்களுக்கு எதிராக முகாமிட்டு, நாட்டின் விளைச்சலைக் காசாவரை அழித்துப்போடுவார்கள்; இஸ்ரவேலில் பிழைப்புக்கான எதையும்—ஆடுகளையோ, எருதுகளையோ, கழுதைகளையோ—விட்டுவைக்க மாட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחֲנוּ עֲלֵיהֶם
  choice: அவர்கள் இஸ்ரவேலருக்கு எதிராக முகாமிட்டு
  rationale: חנה என்பது முகாமிடுதலைக் குறிக்கிறது; עַל இங்கு எதிர்நிலையைக் காட்டுகிறது. வசனச் சூழலில் திரும்பத் திரும்ப நிகழ்ந்த படையெடுப்பைக் காட்டுவதால் தமிழ் வழக்கில் தொடர்ச்சியான இறந்தகாலச் செயலை உணர்த்தும் அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: וַיַּשְׁחִיתוּ אֶת יְבוּל הָאָרֶץ
  choice: நாட்டின் விளைச்சலை அழித்துப்போடுவார்கள்
  rationale: שׁחת என்பதன் Hiphil வடிவம் அழித்தல் அல்லது பாழாக்குதலைக் குறிக்கிறது; יְבוּל என்பது நிலத்தின் விளைச்சல். ‘அழித்துப்போடுவார்கள்’ முழுமையான வேளாண் சேதத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַד בּוֹאֲךָ עַזָּה
  choice: காசாவரை[a]
  rationale: சொல்லுக்கு நெருக்கமாக ‘நீ காசாவுக்கு வரும் இடம்வரை’ என்றாலும், இது சென்றடையும் எல்லையைக் குறிக்கும் எபிரெய மரபுத்தொடர். இயல்பான தமிழில் ‘காசாவரை’ என வழங்கி, சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: מִחְיָה
  choice: உயிர்வாழ உதவும் எதையும்
  rationale: מִחְיָה உணவு மட்டும் அல்லாமல் வாழ்வாதாரம், உயிர் காக்கும் பொருள், பிழைப்புக்கான வசதி ஆகிய பரந்த கருத்தைக் கொண்டது. ‘உயிர்வாழ உதவும் எதையும்’ அந்தப் பரப்பைத் தேவையின்றிக் குறுக்காமல் இயல்பாகத் தருகிறது.
- source_word: וְשֶׂה וָשׁוֹר וַחֲמוֹר
  choice: ஆடுகளையோ, மாடுகளையோ, கழுதைகளையோகூட
  rationale: ஒருமை வடிவிலுள்ள கால்நடைப் பெயர்கள் இங்கு கூட்டுப்பொருளில் வருகின்றன. நவீன தமிழில் இயல்பாகப் பன்மையில் மொழிபெயர்க்கப்பட்டு, וְ இணைப்பின் வலியுறுத்தல் ‘கூட’ என்பதால் வெளிப்படுத்தப்பட்டது.
