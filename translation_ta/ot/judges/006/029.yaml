revisions:
- from: ஒவ்வொருவரும் தன் அருகிலிருந்தவரிடம்[a], “இந்தக் காரியத்தைச் செய்தது யார்?” என்று கேட்டார். அவர்கள் விசாரித்துத் தேடினார்கள். பின்னர், “யோவாசின் மகன் கிதியோன் இந்தக் காரியத்தைச் செய்தான்” என்று சொன்னார்கள்.
  to: ஒவ்வொருவரும் தம் அயலானிடம்[a], “இந்தக் காரியத்தைச் செய்தது யார்?” என்று கேட்டனர். அவர்கள் விசாரித்துத் தேடினார்கள்; “யோவாசின் மகன் கிதியோன் இந்தக் காரியத்தைச் செய்தான்” என்று சொன்னார்கள்.
  rationale: The revision restores the relational sense of the Hebrew idiom with “அயலானிடம்,” makes the distributive narration idiomatic with “கேட்டனர்,” and removes an unnecessary explicit temporal adverb. The two distinct investigative actions and the repeated identification of the action are retained.
