base_translation:
  language: en
  yaml_path: translation/ot/judges/006/029.yaml
  text: And each man said to his neighbor[a], “Who has done this thing?” And they inquired and searched, and they said[b], “Gideon son of Joash has done this thing.”
translation:
  language: ta
  text: ஒவ்வொருவரும் தம் அயலானிடம்[a], “இந்தக் காரியத்தைச் செய்தது யார்?” என்று கேட்டனர். அவர்கள் விசாரித்துத் தேடினார்கள்; “யோவாசின் மகன் கிதியோன் இந்தக் காரியத்தைச் செய்தான்” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “ஒருவன் தன் அயலானிடம்.” இங்கு இது அவர்கள் ஒருவருக்கொருவர் பேசிக்கொண்டதைக் குறிக்கும் எபிரெய வழக்குத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: ஒவ்வொருவரும் தன் அருகிலிருந்தவரிடம்
  rationale: ‘ஒரு மனிதன் தன் அயலானிடம்’ என்ற எபிரெய வழக்குத்தொடரின் பகிர்வுப் பொருளையும், ஊரார் தங்களுக்குள் பேசிக்கொண்டதையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִי
  choice: யார்
  rationale: செயலைச் செய்த நபர் யார் என்று கேட்கும் நேரடியான வினாப்பெயர்.
- source_word: עָשָׂה
  choice: செய்தது / செய்தான்
  rationale: முடிவுற்ற செயலைக் குறிக்கும் எபிரெய வினையை, கேள்வியில் பாலினம் சுட்டாத வடிவிலும் கிதியோனைக் குறிப்பிடும் பதிலில் ஆண்பால் வடிவிலும் தமிழுக்கு இயல்பாக வழங்குகிறது.
- source_word: הַדָּבָר הַזֶּה
  choice: இந்தக் காரியம்
  rationale: דָּבָר இங்கு சொல்லை அல்ல, கண்டுபிடிக்கப்பட்ட செயலை அல்லது நிகழ்வைக் குறிக்கிறது; ‘காரியம்’ அதன் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: וַיִּדְרְשׁוּ
  choice: விசாரித்தார்கள்
  rationale: என்ன நடந்தது, யார் செய்தது என்று கேட்டறியும் விசாரணையைத் தெளிவாகக் குறிக்கிறது.
- source_word: וַיְבַקְשׁוּ
  choice: தேடினார்கள்
  rationale: முந்தைய ‘விசாரித்தார்கள்’ என்பதிலிருந்து வேறுபட்டு, செய்தவரைக் கண்டறிய முயன்றதை வெளிப்படுத்துகிறது.
- source_word: גִּדְעוֹן בֶּן־יוֹאָשׁ
  choice: யோவாசின் மகன் கிதியோன்
  rationale: எபிரெய தந்தைவழி அடையாளத்தைத் தமிழின் இயல்பான உடைமைத் தொடரில் வழங்குகிறது.
- source_word: וַיֹּאמְרוּ
  choice: சொன்னார்கள்
  rationale: விசாரணைக்குப் பின் அவர்கள் பேசியதை மட்டும் உரை தெரிவிப்பதால், ‘முடிவுசெய்தார்கள்’ போன்ற கூடுதல் விளக்கத்தைச் சேர்க்காமல் எளிய பேச்சு வினை பயன்படுத்தப்படுகிறது.
