base_translation:
  language: en
  yaml_path: translation/ot/judges/006/028.yaml
  text: When the men of the city rose early in the morning[a], behold, the altar of Baal had been torn down, and the Asherah that was on it had been cut down[b], and the second bull had been offered up on the altar that had been built.
translation:
  language: ta
  text: நகரத்து ஆண்கள் அதிகாலையில் எழுந்தபோது, இதோ, பாகாலின் பலிபீடம் இடிக்கப்பட்டிருந்தது; அதன்மேல் இருந்த அசேரா[a] வெட்டித் தள்ளப்பட்டிருந்தது; இரண்டாவது காளை கட்டப்பட்டிருந்த பலிபீடத்தின்மேல் பலியாகச் செலுத்தப்பட்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அசேரா கம்பம்”; எபிரெயத்தில், “அசேரா.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ
  choice: அதிகாலையில் எழுந்தபோது
  rationale: שׁכם என்பதன் ஹிஃபீல் வடிவம் அதிகாலையில் எழுவதைச் சுட்டுகிறது; தமிழில் கால முக்கியத்துவத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַנְשֵׁי הָעִיר
  choice: நகரத்து ஆண்கள்
  rationale: எபிரெய மூலத்தில் ஆண்பால் பன்மையான אֲנָשִׁים இருப்பதால் அதை பாலினப் பொதுமைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: எதிர்பாராத காட்சியைக் கண்டறியும் கதையோட்டத்தின் திடீர்த்தன்மையையும் விறுவிறுப்பையும் தக்கவைக்கிறது.
- source_word: נֻתַּץ
  choice: இடிக்கப்பட்டிருந்தது
  rationale: נתץ என்ற வினையின் செயப்பாட்டு வடிவம் பலிபீடத்தைத் தகர்த்து இடித்திருப்பதைக் குறிக்கிறது.
- source_word: מִזְבַּח הַבַּעַל
  choice: பாகாலின் பலிபீடம்
  rationale: எபிரெய இணைப்புத் தொடரின் உரிமை உறவைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: הָאֲשֵׁרָה
  choice: அசேரா
  rationale: இச்சொல் தேவியையோ அவளுடன் தொடர்புடைய வழிபாட்டுப் பொருளையோ குறிக்கக்கூடும்; ‘கம்பம்’ என்று தேவையின்றிக் குறுக்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר עָלָיו
  choice: அதன்மேல் இருந்த
  rationale: עַל என்பதன் நேரடியான இடப்பொருளான ‘மேல்’ என்பதைத் தக்கவைக்கிறது; ‘அருகில்’ எனச் சூழலின் அடிப்படையில் பொருள் தீர்மானிக்கவில்லை.
- source_word: כֹּרָתָה
  choice: வெட்டித் தள்ளப்பட்டிருந்தது
  rationale: כרת என்ற வினையின் செயப்பாட்டு வடிவம் மரத்தாலான வழிபாட்டுப் பொருளை வெட்டி அகற்றிய செயலை இயல்பான தமிழில் காட்டுகிறது.
- source_word: הַפָּר הַשֵּׁנִי
  choice: இரண்டாவது காளை
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட வரிசையுடனான தொடர்பைப் பாதுகாக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: הֹעֲלָה
  choice: பலியாகச் செலுத்தப்பட்டிருந்தது
  rationale: עלה என்பதன் ஹொஃபால் வடிவம் இங்கு பலியாக மேலே ஏறச்செய்யப்படுதலைக் குறிக்கிறது; தமிழில் பலிச் சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַמִּזְבֵּחַ הַבָּנוּי
  choice: புதிதாகக் கட்டப்பட்டிருந்த பலிபீடம்
  rationale: கதையின் முந்தைய நிகழ்வில் கட்டப்பட்ட பலிபீடத்தைக் குறிப்பதாகப் பங்கேற்பு வடிவத்தை இயல்பாகத் தருகிறது; ‘புதிதாக’ என்பது உடனடியான கதைக்கட்டத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֲשֵׁרָה என்பதன் குறிப்பு
  choice: அசேரா
  alternative: அசேரா கம்பம் / புனிதக் கம்பம்
  rationale: எபிரெயச் சொல் அசேராவுடன் தொடர்புடைய வழிபாட்டுச் சின்னம் அல்லது பொருளைக் குறிக்கலாம். பொருள் கண்டிப்பாகக் கம்பமே என்று மூலவசனம் குறிப்பிடாததால் பெயரை ஒலிபெயர்த்து, மாற்றுப் பொருளை அடிக்குறிப்பில் தருவது உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: עָלָיו என்பதன் இடப்பொருள்
  choice: அதன்மேல்
  alternative: அதன் அருகில்
  rationale: עַל என்பதன் முதன்மையான பொருள் ‘மேல்’ ஆகும். வழிபாட்டுச் சூழலை முன்னிட்டு ‘அருகில்’ என்பது சாத்தியமாக இருந்தாலும், மூலத்தின் நேரடியான இடக்குறிப்பை மைய உரையில் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதையுரை. ‘இதோ’ என்பது וְהִנֵּה-யின் திடீர் கண்டுபிடிப்பு வலிமையைத் தக்கவைக்கிறது. ‘பாகால்,’ ‘அசேரா’ ஆகியவை வழக்கமான தமிழ் வேதாகமப் பெயர்வடிவங்களாகப் பயன்படுத்தப்பட்டுள்ளன.
