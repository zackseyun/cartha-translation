source:
  edition: WLC
  text: וַ/יִּקְרָא ל֥/וֹ בַ/יּוֹם הַ/ה֖וּא יְרֻבַּ֣עַל לֵ/אמֹ֑ר יָ֤רֶב בּ/וֹ֙ הַ/בַּ֔עַל כִּ֥י נָתַ֖ץ אֶֽת מִזְבְּחֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/032.yaml
  text: So on that day he called him Jerubbaal[a], saying, “Let Baal contend against him[b], because he tore down his altar.”
translation:
  language: ta
  text: ஆகவே, அன்று அவனுக்கு “யெருபாகால்”[a] என்று பெயரிட்டான்; “பாகால் அவனுக்கு எதிராக வழக்காடட்டும்[b]; ஏனெனில், அவன் பாகாலின் பலிபீடத்தை இடித்துப்போட்டான்” என்று கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யெருபாகால்” என்ற பெயர், “வழக்காடு” என்று பொருள்படும் எபிரெய வினையுடன் ஒலித்தொடர்பு கொண்டது; அதற்கான விளக்கம், “பாகால் அவனுக்கு எதிராக வழக்காடட்டும்” என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பாகால் அவனுக்கு எதிராக வழக்காடுவானாக.” எபிரெய வினையை விருப்பத்தைத் தெரிவிக்கும் வடிவாகக் கேட்கலாம். சிலர், “பாகால் அவனுக்கு எதிராக வழக்காடுவான்” என்ற உறுதிக் கூற்றாகவும் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: அவன் அவனுக்கு … என்று பெயரிட்டான்
  rationale: קרא + ל அமைப்பு ஒருவருக்குப் பெயர் அல்லது சிறப்புப்பெயர் இடுவதைக் குறிக்கிறது. எபிரெய உரையில் உள்ள ஒருமை எழுவாயையும் செயப்படுபொருளையும் வெளிப்படையாக வைத்திருக்கிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்று
  rationale: ‘அந்த நாளில்’ என்பதன் இயல்பான நவீனத் தமிழ் வடிவம்; நிகழ்வின் அதே நாளைக் குறிக்கிறது.
- source_word: יְרֻבַּעַל
  choice: யெருபாகால்
  rationale: பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; அதைத் தொடர்ந்து வரும் ריב என்ற வினையுடனான சொல்விளையாட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: יָרֶב בּוֹ הַבַּעַל
  choice: பாகால் அவனோடு வழக்காடட்டும்
  rationale: יָרֶב என்பதை வேண்டுதல் அல்லது சவால் உணர்வுள்ள யுசிவ் வடிவாக எடுத்துள்ளது. ריב என்பதன் வழக்கு, வாதம், மோதல் ஆகிய பரப்பை ‘வழக்காடட்டும்’ தக்கவைக்கிறது; בּוֹ என்பதையும் ‘அவனோடு’ என நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: பெயருக்கான கூற்றின் காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: נָתַץ
  choice: இடித்துப்போட்டான்
  rationale: பலிபீடம் போன்ற கட்டமைப்பைத் தகர்த்து கீழே வீழ்த்தும் செயலை இயல்பாகக் குறிக்கிறது.
- source_word: אֶת מִזְבְּחוֹ
  choice: பாகாலின் பலிபீடத்தை
  rationale: ஆண்பால் ஒருமை பின்னொட்டு உடனடி முன்னிலையான பாகாலைக் குறிக்கிறது. தமிழில் குழப்பமின்றி வாசிக்க பெயர் வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: בַּעַל என்பதைப் பொதுப்பெயராகவா தெய்வத்தின் பெயராகவா மொழிபெயர்ப்பது
  choice: பாகால்
  alternative: ஆண்டவன் / எஜமான்
  rationale: இச்சூழலில் இது கானானிய தெய்வத்தின் பெயர் அல்லது பட்டம்; பொதுவான ‘ஆண்டவன்’ என்று மொழிபெயர்ப்பது கர்த்தருடன் குழப்பத்தை ஏற்படுத்தும்.
- issue: יָרֶב என்பதன் வினை உணர்வு
  choice: வழக்காடட்டும்
  alternative: வழக்காடுவான்
  rationale: எபிரெய வடிவம் யுசிவ் வேண்டுதல் அல்லது சவாலாகக் கேட்கலாம்; அதையே முதன்மை உரை தக்கவைக்கிறது. எதிர்காலக் கூற்றாகவும் புரிந்துகொள்ள முடியும் என்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. எபிரெயச் சொல்விளையாட்டை பெயரில் செயற்கையாக மொழிபெயர்க்காமல், விளக்கக் கூற்றிலும் அடிக்குறிப்பிலும் பாதுகாத்துள்ளது. ‘அவன் அவனுக்கு’ என்பது தமிழில் சற்றுக் குறிப்பு தேவைப்படக்கூடியதாக இருந்தாலும், எபிரெய உரையின் தெளிவுபடுத்தப்படாத ஒருமை எழுவாயையும் செயப்படுபொருளையும் தக்கவைக்கிறது.
