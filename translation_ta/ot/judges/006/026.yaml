base_translation:
  language: en
  yaml_path: translation/ot/judges/006/026.yaml
  text: Then build an altar to Yahweh your God on the top of this stronghold[a], in orderly arrangement, and take the second bull and offer it up as a burnt offering with the wood of the Asherah that you cut down.
translation:
  language: ta
  text: 'இந்த அரணின் உச்சியில் உன் கடவுளாகிய யாவேக்கு ஒரு பலிபீடத்தைக் கட்டி, அதை ஒழுங்காக அமைத்து, இரண்டாவது காளையை எடுத்துக்கொண்டு, நீ வெட்டிவீழ்த்தும் அசேராவின்[a] மரத்தைக் கொண்டு அதைத் தகனபலியாகச் செலுத்து.


    [a] “அசேரா கம்பத்தின் மரம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அசேராவுடன் தொடர்புடைய வழிபாட்டுக்குரிய மரப்பொருளைக் குறிக்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அசேரா கம்பத்தின் மரம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அசேராவுடன் தொடர்புடைய வழிபாட்டுக்குரிய மரப்பொருளைக் குறிக்கலாம்.
    reason: אֲשֵׁרָה என்பது தெய்வத்தின் பெயரையா, அதனுடன் தொடர்புடைய கம்பம் அல்லது வேறு மர வழிபாட்டுப் பொருளையா குறிக்கிறது என்பது தெளிவாக இல்லை.
lexical_decisions:
- source_word: וּבָנִיתָ
  choice: கட்டு
  rationale: தொடர்ச்சியான கட்டளையைக் குறிக்கும் வாவ் இணைந்த நிறைவினை வடிவம்; தமிழில் இயல்பான நேரடிக் கட்டளையாக வழங்கப்பட்டது.
- source_word: מִזְבֵּחַ
  choice: பலிபீடம்
  rationale: பலியிடும் கட்டமைப்புக்கான வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவேக்கு
  rationale: உடன்படிக்கைப் பெயரையும் ‘உன் கடவுள்’ என்ற நேரடி உறவுச் சொல்லையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: עַל רֹאשׁ הַמָּעוֹז הַזֶּה
  choice: இந்த அரணின் உச்சியில்
  rationale: רֹאשׁ என்பதன் ‘உச்சி’ என்ற பொருளையும் מָעוֹז என்பதன் வலிமையான பாதுகாப்பிடம் என்ற பொருளையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: בַּמַּעֲרָכָה
  choice: ஒழுங்கான அமைப்பின்படி
  rationale: முறைப்படுத்தப்பட்ட அமைப்பு என்ற சொல்லின் பொருளைப் பாதுகாக்கிறது; கற்கள் அல்லது விறகு என்று மூலத்தில் இல்லாத குறிப்பைச் சேர்ப்பதில்லை.
- source_word: הַפָּר הַשֵּׁנִי
  choice: இரண்டாவது காளை
  rationale: ‘இரண்டாவது’ என்ற சூழல் வேறுபாட்டையும் פַּר என்பதன் அடிப்படைப் பொருளையும் நேரடியாக வழங்குகிறது.
- source_word: וְהַעֲלִיתָ עוֹלָה
  choice: அதைத் தகனபலியாகச் செலுத்து
  rationale: עלה என்ற வினையும் עֹלָה என்ற பலிவகையும் சேர்ந்த வழிபாட்டு மரபுத்தொடரை இயல்பான தமிழில் வழங்குகிறது.
- source_word: בַּעֲצֵי הָאֲשֵׁרָה אֲשֶׁר תִּכְרֹת
  choice: நீ வெட்டிவீழ்த்தும் அசேராவின் மரத்தைக் கொண்டு
  rationale: அசேரா என்ற பெயரை குறிப்பிட்ட வடிவமாகத் தீர்மானிக்காமல் வைத்துக் கொண்டு, வெட்டப்பட்ட அதன் மரம் பலிக்கான எரிபொருளாகப் பயன்படுத்தப்படுவதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயர்
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புக்கு நெருக்கமாகத் தமிழில் தருகிறது.
- issue: אֲשֵׁרָה என்பதன் குறிப்பு
  choice: அசேரா
  alternative: அசேரா கம்பம்; அசேராவின் மரச்சிலை
  rationale: இச்சொல் அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருளைக் குறிக்கலாம்; அதன் துல்லியமான உருவம் விவாதத்திற்குரியது என்பதால் முதன்மை உரை குறிப்பாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; கட்டளைத் தொனி நேரடியாகவும் கண்ணியமாகவும் வைக்கப்பட்டுள்ளது. வழிபாட்டுச் சொற்களில் ‘பலிபீடம்’, ‘தகனபலி’ போன்ற பரவலாகப் புரியக்கூடிய சொற்கள் பயன்படுத்தப்பட்டன. அடிக்குறிப்பு குறி, அதன் பொருளுடன் தொடர்புடைய ‘அசேரா’ என்பதற்குப் பின்பு வைக்கப்பட்டது.
