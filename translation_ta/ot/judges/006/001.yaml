source:
  edition: WLC
  text: וַ/יַּעֲשׂ֧וּ בְנֵי יִשְׂרָאֵ֛ל הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד מִדְיָ֖ן שֶׁ֥בַע שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/001.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and Yahweh gave them into the hand of Midian for seven years.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள்[a] யாவேவின் பார்வையில்[b] தீமையானதைச் செய்தார்கள்; யாவே அவர்களை ஏழு ஆண்டுகளுக்கு மீதியானின் கையில்[c] கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்” அல்லது “இஸ்ரவேல் மக்கள்.” எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “யாவேவின் கண்களில்”; அதாவது, யாவே தீமையென்று மதிப்பிட்டதை.
    reason: idiom_note
  - marker: c
    text: “மீதியானின் கையில்” என்பது மீதியானின் அதிகாரம் அல்லது கட்டுப்பாட்டின்கீழ் என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான வடிவத்தையும், நியாயாதிபதிகள் நூலில் திரும்பத் திரும்ப வரும் கூட்டுப்பெயர் நடையையும் காக்கிறது; இங்கு இது இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
- source_word: הָרַע
  choice: தீமையானதை
  rationale: עשה என்பதுடன் சேர்ந்துள்ள இந்தச் சொல், வெறுமனே ஒரு தவறு அல்லாமல் ஒழுக்கரீதியாகத் தீமையான செயலைக் குறிக்கிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேவின் பார்வையில்
  rationale: ‘யாவேவின் கண்களில்’ என்ற எபிரெய மதிப்பீட்டு மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரைத் தனிப்பெயராக ஒலிபெயர்க்கிறது.
- source_word: וַיִּתְּנֵם
  choice: அவர்களைக் கொடுத்தார்
  rationale: தொடர்ந்து வரும் ‘கையில்’ என்பதுடன் சேர்ந்து, மற்றொருவரின் அதிகாரத்திற்குள் ஒப்புவித்தல் என்ற எபிரெய உருவகத்தைத் தக்கவைக்கிறது.
- source_word: בְּיַד מִדְיָן
  choice: மீதியானின் கையில்
  rationale: ‘கை’ என்பது அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய மரபுத்தொடர்; தமிழிலும் இந்த உருவகம் புரிந்துகொள்ளத்தக்கது.
- source_word: מִדְיָן
  choice: மீதியான்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: שֶׁבַע שָׁנִים
  choice: ஏழு ஆண்டுகள்
  rationale: எபிரெய மூலத்தில் கூறப்படும் காலநீட்சியை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத்திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதனை ஒரு பட்டமாக மாற்றாமல், பரவலாக ஏற்கப்படும் ஒலிப்புக்கு ஏற்ப தருகிறது; பழைய உச்சரிப்பின் துல்லியம் முழுமையாக உறுதிப்படுத்த முடியாதது.
- issue: בְנֵי יִשְׂרָאֵל என்ற கூட்டுக் குறிப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர் / இஸ்ரவேல் மக்கள்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தைத் தக்கவைக்கிறது; அதேவேளை இது இஸ்ரவேல் சமூகத்தை ஒட்டுமொத்தமாகக் குறிக்கும் மரபுத்தொடர் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: யாவே மீதியானின் அதிகாரத்திற்குள் இஸ்ரவேலை ஒப்புவித்தல்
  choice: யாவே அவர்களை ... மீதியானின் கையில் கொடுத்தார்
  alternative: யாவே அவர்களை மீதியானின் அதிகாரத்துக்கு ஒப்புக்கொடுத்தார்
  rationale: தீர்ப்பின் செயற்பாட்டாளராக யாவேவை மூலவசனம் காட்டுவதைத் தெளிவாக வைத்துக்கொண்டு, ‘கை’ என்ற உருவகத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளது. மூலத்தின் மீளும் நியாயாதிபதிகள்-நூல் சூத்திரநடையும் ‘கை’ உருவகமும் தக்கவைக்கப்பட்டுள்ளன; புரிதலை எளிதாக்க அடிக்குறிப்புகள் சேர்க்கப்பட்டுள்ளன.
