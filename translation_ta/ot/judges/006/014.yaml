base_translation:
  language: en
  yaml_path: translation/ot/judges/006/014.yaml
  text: Then Yahweh turned to him and said[a], “Go in this strength of yours and save Israel from the hand of Midian[b]. Have I not sent you?”
translation:
  language: ta
  text: அப்போது யாவே அவனை நோக்கித் திரும்பி, “உன்னுடைய இந்த வலிமையோடு போய்[a], இஸ்ரவேலை மீதியானின் கையிலிருந்து காப்பாற்று[b]. உன்னை அனுப்பியது நான் அல்லவா?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன்னுடைய இந்த வலிமையில் போய்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத் தொடர் வலிமையைச் செயலுக்கான வழிமுறையாகவோ அல்லது ஒருவர் நிற்கும் நிலையையாகவோ குறிக்கலாம்; “இந்த” என்பது வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “மீதியானின் கையிலிருந்து” என்பது மீதியானின் அதிகாரம் அல்லது கட்டுப்பாட்டிலிருந்து விடுவிப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தை பொதுவாக அறியப்பட்ட தமிழ் ஒலிபெயர்ப்பில் நேரடியாக வழங்குகிறது; ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றவில்லை.
- source_word: וַיִּפֶן אֵלָיו
  choice: அவனை நோக்கித் திரும்பி
  rationale: פנה என்பதன் திரும்புதல் என்ற இயக்கத்தையும் אֵלָיו என்பதன் திசைநோக்கையும் இயல்பான தமிழில் காக்கிறது.
- source_word: לֵךְ
  choice: போய்
  rationale: கட்டளையின் நேரடித் தன்மையைக் காக்கிறது; தொடர்ந்து வரும் ‘காப்பாற்று’ என்பதுடன் தமிழில் இயல்பாக இணைகிறது.
- source_word: בְּכֹחֲךָ זֶה
  choice: உனக்குள்ள இந்த வலிமையோடு
  rationale: בְּ என்பதன் கருவிப்பொருளையும் זֶה தரும் சுட்டு வலியுறுத்தலையும் காக்கிறது; இது ‘இந்த உன் வலிமையில்’ என்றும் புரிந்துகொள்ளப்படலாம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: וְהוֹשַׁעְתָּ
  choice: காப்பாற்று
  rationale: முன்னுள்ள கட்டளையைத் தொடரும் ஆணைப்பொருளைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִכַּף מִדְיָן
  choice: மீதியானின் கையிலிருந்து
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய உருவகமான ‘கை’ என்பதைப் பாதுகாக்கிறது.
- source_word: הֲלֹא שְׁלַחְתִּיךָ
  choice: உன்னை அனுப்பியது நான் அல்லவா?
  rationale: உறுதியான ஆம் பதிலை எதிர்பார்க்கும் வினாவின் வலிமையையும் שלח என்பதன் அடிப்படை ‘அனுப்பு’ பொருளையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தில் உள்ள திருநாமத்தை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பால் வழங்குகிறது.
- issue: கிதியோனுடைய வலிமைக்கும் கடவுளின் அனுப்புதலுக்கும் உள்ள தொடர்பு
  choice: ‘இந்த வலிமை’ என்ற சொல்லையும் ‘நான் அல்லவா அனுப்பியது?’ என்ற வினாவையும் தனித்தனியே காத்தல்
  alternative: வலிமை முழுவதும் நேரடியாகக் கடவுளிடமிருந்து வந்ததாக விளக்கிச் சொல்லுதல்
  rationale: வசனம் கிதியோனின் தற்போதைய வலிமையைச் சுட்டுவதோடு, யெகோவாவின் அனுப்புதலையும் வலியுறுத்துகிறது; அவற்றின் உறவை மொழிபெயர்ப்பிலேயே கூடுதலாகத் தீர்மானிக்காமல் மூலத்தின் இறுக்கத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘கை’ என்ற மூல உருவகம் உரையில் காக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; கட்டளையின் வலிமையும் சொல்லாட்சியின் உண்மையான இருபொருள் வாய்ப்பும் பேணப்பட்டுள்ளன.
