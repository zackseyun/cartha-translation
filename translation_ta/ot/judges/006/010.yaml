base_translation:
  language: en
  yaml_path: translation/ot/judges/006/010.yaml
  text: And I said to you[a], ‘I am Yahweh your God; do not fear the gods of the Amorites, in whose land you dwell[b]. But you have not listened to my voice.’
translation:
  language: ta
  text: நான் உங்களிடம், “நானே உங்கள் கடவுளாகிய யாவே; நீங்கள் அவர்களுடைய நாட்டில் குடியிருக்கும் எமோரியரின் தெய்வங்களுக்குப் பயப்படாதீர்கள்[a]” என்று சொன்னேன். ஆனால் நீங்கள் என் குரலுக்குச் செவிகொடுக்கவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடர் ஒரு தடைக் கட்டளையைத் தெரிவிக்கிறது; ‘பயப்படக் கூடாது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘என் குரலுக்குச் செவிகொடுக்கவில்லை’ என்பது ‘எனக்குக் கீழ்ப்படியவில்லை’ என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לָכֶם
  choice: நான் உங்களிடம் … என்று சொன்னேன்
  rationale: אמר என்பதன் நேரடியான பொருளை இயல்பான தமிழ் மேற்கோள் அமைப்பில் தருகிறது. தொடக்க ו־ இங்கு முன்சூழலின் தொடர்ச்சியைச் சுட்டினாலும், தனி வசனத்தில் செயற்கையான ‘மேலும்’ என்பதைக் கட்டாயப்படுத்தாமல் விடப்பட்டுள்ளது.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: நானே உங்கள் கடவுளாகிய யெகோவா
  rationale: אֲנִי என்பதின் வலியுறுத்தலை ‘நானே’ வெளிப்படுத்துகிறது; יהוה தனிப்பெயராக ‘யெகோவா’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது; אֱלֹהֵיכֶם இங்கு ஒருமைப் பொருளில் ‘உங்கள் கடவுள்’ ஆகும்.
- source_word: לֹא תִירְאוּ
  choice: பயப்படாதீர்கள்
  rationale: לֹא உடன் வரும் imperfect இங்கு தடைக் கட்டளையைத் தெரிவிக்கிறது. மரியாதைப் பன்மைக்கு ஏற்ற நேரடியான தமிழ் கட்டளை வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶת אֱלֹהֵי הָאֱמֹרִי
  choice: எமோரியர்களின் நாட்டுத் தெய்வங்கள்
  rationale: எபிரெய இனப்பெயர் ஒருமை கூட்டுப்பொருளில் உள்ளது. ‘நாட்டுத் தெய்வங்கள்’ என்பது அந்த மக்களின் தெய்வங்களைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: אֲשֶׁר אַתֶּם יוֹשְׁבִים בְּאַרְצָם
  choice: நீங்கள் குடியிருக்கிற எமோரியர்களின் நாட்டில்
  rationale: ישב என்பதின் குடியேறி வாழ்தல் என்ற பொருளை ‘குடியிருக்கிற’ காக்கிறது; சார்புத்தொடர் தமிழில் இயல்பாக இனப்பெயருடன் இணைக்கப்பட்டுள்ளது.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹלִי
  choice: ஆனால் நீங்கள் என் குரலுக்குச் செவிகொடுக்கவில்லை
  rationale: שמע בקול என்ற மொழிவழக்கின் கேட்டல் மற்றும் கீழ்ப்படிதல் ஆகிய இரு நிழற்பொருள்களையும் ‘குரலுக்குச் செவிகொடுத்தல்’ பாதுகாக்கிறது. ו־ இங்கு எதிர்மறைத் திருப்பமாக ‘ஆனால்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைத்தனிப்பெயர் நேரடியாக உள்ளது. தமிழ் வாசகர்களிடையே நிலைபெற்ற தனிப்பெயர் வடிவமான ‘யெகோவா’ பயன்படுத்தப்பட்டு, ‘கர்த்தர்’ என்ற பட்டப்பெயர் மாற்றீடு தவிர்க்கப்பட்டது.
- issue: שמע בקול என்பதின் பொருள்
  choice: என் குரலுக்குச் செவிகொடுக்கவில்லை
  alternative: எனக்குக் கீழ்ப்படியவில்லை
  rationale: சூழலில் கீழ்ப்படியாமை உட்பொருளாக இருந்தாலும், மூலத்தின் ‘குரலைக் கேட்டல்’ உருவகத்தைப் பாதுகாத்து அதன் பொருள் விரிவைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கண்ணியமும் கொண்ட எளிய நடையில் வடிவமைக்கப்பட்டது. ‘குடியிருக்கிற’, ‘செவிகொடுக்கவில்லை’ ஆகியவை மூல உருவகங்களைப் பாதுகாத்தபடியே பொதுவாசகருக்குப் புரியும் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன.
