  text: וָ/אַצִּ֤ל אֶתְ/כֶם֙ מִ/יַּ֣ד מִצְרַ֔יִם וּ/מִ/יַּ֖ד כָּל לֹחֲצֵי/כֶ֑ם וָ/אֲגָרֵ֤שׁ אוֹתָ/ם֙ מִ/פְּנֵי/כֶ֔ם וָ/אֶתְּנָ֥/ה לָ/כֶ֖ם אֶת אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/009.yaml
  text: And I delivered you from the hand of Egypt and from the hand of all your oppressors, and I drove them out from before you and gave you their land.
translation:
  language: ta
  text: நான் உங்களை எகிப்தின் கையிலிருந்தும், உங்களை ஒடுக்கிய அனைவரின் கையிலிருந்தும் விடுவித்தேன். அவர்களை உங்கள் முன்னிலையிலிருந்து துரத்திவிட்டு, அவர்களுடைய நாட்டை உங்களுக்குக் கொடுத்தேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַצִּל
  choice: விடுவித்தேன்
  rationale: נצל என்பது ஆபத்து அல்லது ஆதிக்கத்திலிருந்து மீட்பதைக் குறிக்கிறது. இங்கு வரும் ‘கையிலிருந்து’ என்ற அதிகார உருவகத்துடன் ‘விடுவித்தேன்’ இயல்பாகப் பொருந்துகிறது.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: ‘கை’ என்பது அதிகாரத்தையும் கட்டுப்பாட்டையும் குறிக்கும் எபிரேய உருவகம். தமிழிலும் இது புரிந்துகொள்ளக்கூடியதாக இருப்பதால் உருவகம் தக்கவைக்கப்படுகிறது.
- source_word: מִצְרַיִם
  choice: எகிப்து
  rationale: இந்த இடம் மற்றும் நாட்டுப் பெயரின் நிலையான தமிழ் வடிவம்.
- source_word: כָּל לֹחֲצֵיכֶם
  choice: உங்களை ஒடுக்கிய அனைவரும்
  rationale: לחץ என்பதன் கருத்து நெருக்குதல், துன்புறுத்துதல், ஒடுக்குதல் என்பதாகும். பெயர்ச்சொல் வடிவமான ‘ஒடுக்கியவர்கள்’ என்பதைவிட இச்சொற்றொடர் நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: וָאֲגָרֵשׁ
  choice: துரத்திவிட்டு
  rationale: גרש என்பது ஒருவரை ஓட்டிவிடுதல் அல்லது வெளியேற்றுதல். தொடர்ச்சியான இறைச் செயல்களை இயல்பான தமிழில் இணைக்க ‘துரத்திவிட்டு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִפְּנֵיכֶם
  choice: உங்கள் முன்னிலையிலிருந்து
  rationale: சொல்லடியாக ‘உங்கள் முகத்திற்கு/உங்களுக்கு முன்பாக இருந்து’ என்ற இடவியல் கருத்தைக் கொண்டது. ‘முன்னிலையிலிருந்து’ என்பது அந்த உருவகத்தைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: וָאֶתְּנָה לָכֶם אֶת אַרְצָם
  choice: அவர்களுடைய நாட்டை உங்களுக்குக் கொடுத்தேன்
  rationale: נתן உடன் வரும் பெறுநரையும் பொருளையும் நேரடியாகவும் இயல்பான தமிழ் சொல் வரிசையிலும் தெரிவிக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலின் விடுதலையிலும் நிலத்தைப் பெற்றதிலும் கடவுளின் செயற்பாடு
  choice: விடுவித்தல், துரத்துதல், நாட்டைக் கொடுத்தல் ஆகிய அனைத்திற்கும் ‘நான்’ என்பதே செய்பொருளாகத் தெளிவாக வைக்கப்பட்டுள்ளது.
  alternative: சில செயல்களை மறைமுகமாகவோ செயப்பாட்டு வினையிலோ மொழிபெயர்த்தல்.
  rationale: எபிரேய முதல் நபர் வினைச்சொற்கள் ஆண்டவரின் நேரடியான செயற்பாட்டை வலியுறுத்துகின்றன. உரைக்கு அப்பாற்பட்ட விளக்கத்தைச் சேர்க்காமல் அந்த வலியுறுத்தல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும், அதேவேளை கண்ணியமான நடை. ‘கையிலிருந்து’ மற்றும் ‘முன்னிலையிலிருந்து’ ஆகிய எபிரேய உருவகங்கள் தமிழில் தெளிவாக இருப்பதால் பாதுகாக்கப்பட்டுள்ளன.
