  terminology: ‘கதிரடிக்கும் களம்,’ ‘பனி,’ ‘என் கையால்,’ ‘இஸ்ரவேலை மீட்பீர்,’ and respectful plural address are appropriate. ‘கம்பளி மயிர்க் கற்றை’ renders the wool fleece without incorrectly introducing an animal hide.
