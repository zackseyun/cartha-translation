base_translation:
  language: en
  yaml_path: translation/ot/judges/006/037.yaml
  text: Look[a], I am placing a fleece of wool on the threshing floor. If there is dew on the fleece alone, and dryness on all the ground, then I will know that you will save Israel by my hand, just as you have spoken.
translation:
  language: ta
  text: “இதோ, நான் கம்பளி மயிர்க் கற்றை ஒன்றைக் கதிரடிக்கும் களத்தில் வைக்கிறேன். அந்த மயிர்க் கற்றையின்மேல் மட்டும் பனி இருந்து, நிலமெல்லாம்[a] உலர்ந்திருந்தால், நீர் சொன்னபடியே என் கையால் இஸ்ரவேலை மீட்பீர் என்று அறிந்துகொள்வேன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “நாடெல்லாம்” அல்லது “பூமியெல்லாம்.” எபிரெயச் சொல் உள்ளூர் நிலப்பரப்பையோ, பரந்த நாட்டையோ, பூமியையோ குறிக்கலாம். இங்கு அடையாளம் நிகழும் இடத்தைச் சுற்றியுள்ள நிலமே பெரும்பாலும் குறிக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கிதியோன் முன்வைக்கும் அடையாளத்தின் மீது கவனத்தை ஈர்க்கும் எபிரெயச் சுட்டிடைச்சொல்லின் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: מַצִּיג
  choice: வைக்கிறேன்
  rationale: אָנֹכִי என்பதுடன் வரும் பங்கேற்புவினை நிகழவிருக்கும் அல்லது நிகழ்காலச் செயலைக் குறிக்கிறது; பொருளை ஓரிடத்தில் அமைப்பதைத் தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: גִּזַּת הַצֶּמֶר
  choice: கம்பளி மயிர்த்தோல் ஒன்று
  rationale: மயிர் அகற்றப்படாத கம்பளித் தோலைக் குறிக்கும் மூலச்சொல்லின் பொருளை, தேவையற்ற விலங்கு வகையைச் சேர்க்காமல் தெளிவாகத் தருகிறது.
- source_word: בַּגֹּרֶן
  choice: கதிரடிக்கும் களத்தில்
  rationale: தானியத்திலிருந்து மணியைப் பிரிக்கும் களத்தைக் குறிக்கும் גֹּרֶן என்பதற்கான தெளிவான, வழக்கிலுள்ள தமிழ் வெளிப்பாடு.
- source_word: טַל יִהְיֶה
  choice: பனி இருந்து
  rationale: இங்கு טַל என்பது பனித்துளிகளைக் குறிக்கிறது; எபிரெய இருப்புநிலைக் கூற்றைச் செயல் விவரத்தை மிகைப்படுத்தாமல் தருகிறது.
- source_word: עַל הַגִּזָּה לְבַדָּהּ
  choice: அந்த மயிர்த்தோலில் மட்டும்
  rationale: לְבַדָּהּ தரும் தனிப்படுத்தும் வலியுறுத்தலை ‘மட்டும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְעַל כָּל הָאָרֶץ חֹרֶב
  choice: நிலமெல்லாம் உலர்ந்திருந்தால்
  rationale: அடையாளம் நிகழும் உடனடிச் சூழலில் הָאָרֶץ என்பது நிலப்பரப்பையும் חֹרֶב என்பது உலர்ந்த நிலையையும் குறிக்கின்றன; தமிழில் இயல்பான நிலை வாக்கியமாகத் தரப்பட்டுள்ளது.
- source_word: וְיָדַעְתִּי
  choice: அறிந்துகொள்வேன்
  rationale: நிபந்தனை நிறைவேறுவதன் விளைவாக கிதியோன் உறுதியாகத் தெரிந்துகொள்வதை வெளிப்படுத்துகிறது.
- source_word: כִּי תוֹשִׁיעַ
  choice: மீட்பீர் என்று
  rationale: יָשַׁע என்பதன் ஹிஃபில் வடிவம் காப்பாற்றுதல் அல்லது விடுவித்தலைக் குறிக்கிறது; இஸ்ரவேலை எதிரிகளிடமிருந்து விடுவிக்கும் இச்சூழலில் ‘மீட்பீர்’ இயல்பாக உள்ளது.
- source_word: בְּיָדִי
  choice: என் கையால்
  rationale: கிதியோனைச் செயலாற்றும் கருவியாகக் குறிப்பிடும் எபிரெய உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் நேரடியாகத் தக்கவைக்கிறது.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: நீர் சொன்னபடியே
  rationale: ‘பேசினீர்/சொன்னீர்’ என்ற மூல வினையின் பொருளைத் தக்கவைத்து, ‘வாக்குறுதி அளித்தீர்’ என்ற கூடுதல் இறையியல் நுட்பத்தைப் புகுத்தாமல் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: הָאָרֶץ என்பதன் பரப்பு
  choice: நிலம்
  alternative: நாடு அல்லது பூமி
  rationale: கம்பளி மயிர்த்தோலுக்கும் அதைச் சுற்றிய உடனடி நிலப்பரப்புக்கும் இடையிலான வேறுபாடே அடையாளத்தின் மையம். ஆகவே உலகம் முழுவதையோ இஸ்ரவேல் நாடு முழுவதையோ கட்டாயமாகக் குறிக்காமல் உள்ளூர் பொருளை ‘நிலம்’ தக்கவைக்கிறது; பரந்த பொருள் சாத்தியத்தை அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியும் வகையிலும், கடவுளை நோக்கிய மரியாதைப் பன்மையைப் பேணியும் மொழியாக்கம் செய்யப்பட்டுள்ளது. எபிரெய உருவகமான ‘என் கையால்’ தக்கவைக்கப்பட்டுள்ளது; ‘இதோ’ கவன ஈர்ப்புச் சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது.
