  yaml_path: translation/ot/judges/006/019.yaml
  text: Then Gideon went in and prepared a young goat and unleavened bread from an ephah of flour[a]. He put the meat in a basket and the broth in a pot[b], and brought them out to him under the terebinth and presented them.
translation:
  language: ta
  text: பின்பு கிதியோன் உள்ளே சென்று, ஒரு வெள்ளாட்டுக்குட்டியையும் ஒரு எப்பா அளவு மாவில் புளிப்பில்லாத அப்பங்களையும் தயாரித்தான்.[a] இறைச்சியைக் கூடையில் வைத்து, இறைச்சிச் சாற்றைப் பானையில் வைத்து, அவற்றை அவரிடம் தெரபிந்து மரத்தின் கீழ் கொண்டுவந்து, அவர் முன் வைத்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எப்பா’ என்பது பழங்கால உலர் அளவை. அதன் துல்லியமான அளவு குறித்து கணிப்புகள் வேறுபடுகின்றன.
    reason: அறிமுகமில்லாத பழங்கால அளவையை விளக்குதல்
  - marker: b
    text: ‘தெரபிந்து’ என்பதற்குப் பாரம்பரிய மொழிபெயர்ப்புகளில் ‘கருவாலி’ என்றும் உள்ளது. ‘அவர் முன் வைத்தான்’ என்பதற்கு ‘அருகில் கொண்டுவந்தான்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினை அருகில் கொண்டுவருதல் அல்லது முன்வைத்தல் என்று பொருள்படும்.
    reason: தாவரவியல் மாற்றுவாசிப்பையும் வினைச்சொல்லின் சொற்பொருள் மாற்றுவாசிப்பையும் விளக்குதல்
lexical_decisions:
- source_word: בָּא
  choice: உள்ளே சென்று
  rationale: சூழலில் கிதியோன் உணவு தயாரிக்கத் தங்கியிருந்த இடத்திற்குள் செல்கிறான்; எபிரெய வினையின் இயக்கத்தையும் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיַּעַשׂ
  choice: தயாரித்தான்
  rationale: உணவு தயாரித்தல் என்ற சூழலில், பொதுவான ‘செய்தான்’ என்பதைவிட இயல்பும் துல்லியமும் உடையது.
- source_word: גְּדִי עִזִּים
  choice: ஓர் ஆட்டுக்குட்டி
  rationale: இது வெள்ளாட்டு இனத்தைச் சேர்ந்த இளம் ஆட்டைக் குறிக்கிறது; நவீனத் தமிழில் ‘ஆட்டுக்குட்டி’ இயல்பான நடை.
- source_word: אֵיפַת קֶמַח
  choice: ஓர் எப்பா அளவு மாவு
  rationale: மூலத்தில் குறிப்பிட்டுள்ள பழங்கால உலர் அளவையான ‘எப்பா’வைப் பாதுகாத்து, வாசகருக்காக ‘அளவு’ எனத் தெளிவுபடுத்துகிறது.
- source_word: מַצּוֹת
  choice: புளிப்பில்லாத அப்பங்கள்
  rationale: புளிப்பூட்டப்படாத அப்பத்தைத் தெளிவாகக் குறிக்கிறது; பன்மை வடிவத்தையும் பாதுகாக்கிறது.
- source_word: הַבָּשָׂר
  choice: இறைச்சி
  rationale: உணவுச் சூழலில் இயல்பான தமிழ் இணைச்சொல்.
- source_word: סַּל
  choice: கூடை
  rationale: சுமந்து செல்லப் பயன்படும் கொள்கலனைக் குறிக்கும் நேரடியான, இயல்பான சொல்.
- source_word: הַמָּרַק
  choice: குழம்பு
  rationale: சமைத்த இறைச்சியின் திரவம் அல்லது சாறு கலந்த உணவைக் குறிக்கும் இயல்பான பொதுத் தமிழ்; ‘சாறு’ என்ற தெளிவற்ற பொருளைவிட சமையல் சூழலுக்கு ஏற்றது.
- source_word: פָּרוּר
  choice: பானை
  rationale: சமைக்க அல்லது திரவ உணவை வைக்கப் பயன்படும் பாத்திரத்தைக் குறிக்கும் எளிய, மரியாதையான சொல்.
- source_word: וַיּוֹצֵא אֵלָיו
  choice: அவற்றை அந்த மனிதரிடம் கொண்டுவந்து
  rationale: எபிரெய வினை ஒருமையில் இருந்தாலும், இறைச்சி மற்றும் குழம்பு உள்ளிட்ட தயாரிக்கப்பட்டவற்றைத் தொகுப்பாகக் குறிக்கிறது; தமிழில் பன்மைக் குறிப்பு இயல்பாக உள்ளது. ‘அவரிடம்’ என்பதிலுள்ள சுட்டுப்பொருளை ‘அந்த மனிதரிடம்’ எனச் சூழலுக்கேற்ப தெளிவாக்குகிறது.
- source_word: תַּחַת הָאֵלָה
  choice: கருவாலி மரத்தின்கீழ்
  rationale: אֵלָה பொதுவாக terebinth மரத்தைக் குறிக்கிறது. தமிழில் பரவலாக அறியப்படாத ‘தெரபிந்து’ என்ற ஒலிபெயர்ப்பை விட ‘கருவாலி’ இயல்பான தாவரவியல் பெயராகப் பயன்படுத்தப்படுகிறது; மாற்று மரபுவழி வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיַּגַּשׁ
  choice: அவர் முன் வைத்தான்
  rationale: ‘அருகில் கொண்டுவருதல்/முன்வைத்தல்’ என்ற வினையின் பொருளை விருந்தோம்பல் சூழலில் இயல்பாகக் காட்டுகிறது; இதை வெளிப்படையான பலியிடுதலாக மாற்றவில்லை.
theological_decisions:
- issue: கிதியோனின் செயலிலுள்ள சாத்தியமான பலியிடுதல் சார்ந்த நுட்பம்
  choice: விருந்தோம்பலுக்குரிய ‘அவர் முன் வைத்தான்’ என்ற மொழி
  alternative: அவற்றைப் பலியாகச் செலுத்தினான்
  rationale: இவ்வசனத்தின் எபிரெய வினைகள் உணவைத் தயாரித்து, வெளியே கொண்டுவந்து, அருகில் வைப்பதையே கூறுகின்றன. அடுத்த வசனங்களில் பலிசார் நுட்பம் உருவானாலும், அதை இவ்வசனத்திற்குள் முன்கூட்டியே புகுத்தாமல் கதையின் இறையியல் இழுபறி பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பழங்கால அளவுச் சொல்லான ‘எப்பா’ பாதுகாக்கப்பட்டு விளக்கப்பட்டுள்ளது. பலியிடுதல் என்ற பிற்காலக் கதைநுட்பம் இவ்வசனத்தில் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
