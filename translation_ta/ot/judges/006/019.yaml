  source_fidelity: திருத்தம் தேவை. אֵלָה என்பது பொதுவாகத் தெரபிந்து (terebinth) மரத்தைக் குறிக்கும்; ‘கருவாலி’ என்பது ஓக் மரத்தைக் குறிக்கும் வழக்கமான பெயராக இருப்பதால் மூலத்தின் தாவரவியல் குறிப்பை மாற்றுகிறது. மேலும் מָרָק என்பது குழம்பு என்ற கெட்டியான உணவைவிட இறைச்சிச் சாறு/குழம்புநீர் போன்ற சமையல் திரவத்தைக் குறிக்கிறது. גְּדִי עִזִּים என்பதிலுள்ள வெள்ளாட்டு இனக் குறிப்பு ‘வெள்ளாட்டுக்குட்டி’யால் தெளிவாகப் பாதுகாக்கப்படுகிறது.
  naturalness: திருத்தப்பட்ட உரை நவீனத் தரத் தமிழில் இயல்பான கதைநடையைப் பேணுகிறது. ‘தெரபிந்து’ அறிமுகமில்லாத தாவரப்பெயராக இருக்கலாம்; ஆகவே அடிக்குறிப்பில் மரபுவழியான ‘கருவாலி’ மாற்றுவாசிப்பு தரப்பட்டுள்ளது.
