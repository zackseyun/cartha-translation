revisions:
- from: பின்பு கிதியோன் உள்ளே சென்று, ஓர் ஆட்டுக்குட்டியையும் ஓர் எப்பா அளவு மாவில் புளிப்பில்லாத அப்பங்களையும் தயாரித்தான்.[a] இறைச்சியைக் கூடையிலும், குழம்பை ஒரு பானையிலும் வைத்து, அவற்றை அந்த மனிதரிடம் கருவாலி மரத்தின்கீழ் கொண்டுவந்து, அவர் முன் வைத்தான்.[b]
  to: பின்பு கிதியோன் உள்ளே சென்று, ஒரு வெள்ளாட்டுக்குட்டியையும் ஒரு எப்பா அளவு மாவில் புளிப்பில்லாத அப்பங்களையும் தயாரித்தான்.[a] இறைச்சியைக் கூடையில் வைத்து, இறைச்சிச் சாற்றைப் பானையில் வைத்து, அவற்றை அவரிடம் தெரபிந்து மரத்தின் கீழ் கொண்டுவந்து, அவர் முன் வைத்தான்.[b]
  rationale: முதன்மை உரையில் தெரபிந்து மரத்தையும் இறைச்சிச் சாற்றையும் குறிப்பிடுவதன் மூலம் எபிரெயச் சொற்களின் பொருள் வேறுபாடுகள் பாதுகாக்கப்படுகின்றன. பன்மையான ‘அவற்றை’ என்பது தயாரிக்கப்பட்ட உணவுப் பொருட்களை இயல்பாகத் தொகுத்துக் குறிக்கிறது; இறுதி வினைகள் ஒருமையில் இருப்பதைக் கட்டாயமாகத் தமிழில் மீளுருவாக்க வேண்டியதில்லை. ‘அவரிடம்/அவர் முன்’ என்பது எபிரெயச் சுட்டுப்பொருளின் மரியாதைநிலையையும் முன்சூழலிலுள்ள அடையாளத்தைத் தேவையின்றி விளக்காமல் இருப்பதையும் காக்கிறது.
