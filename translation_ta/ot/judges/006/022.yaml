revisions:
- from: அப்போது கிதியோன், அவர் யாவேயின் தூதர்[a] என்று உணர்ந்தான். கிதியோன், “ஐயோ, ஆண்டவராகிய யாவே! நான் யாவேயின் தூதரை முகமுகமாகக் கண்டுவிட்டேனே!” என்றான்.
