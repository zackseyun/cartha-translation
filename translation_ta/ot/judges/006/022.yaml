source:
  edition: WLC
  text: וַ/יַּ֣רְא גִּדְע֔וֹן כִּֽי מַלְאַ֥ךְ יְהוָ֖ה ה֑וּא וַ/יֹּ֣אמֶר גִּדְע֗וֹן אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה כִּֽי עַל כֵּ֤ן רָאִ֨יתִי֙ מַלְאַ֣ךְ יְהוָ֔ה פָּנִ֖ים אֶל פָּנִֽים־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/022.yaml
  text: Then Gideon saw that he was the angel of Yahweh[a], and Gideon said, “Ah, Lord GOD! For I have seen the angel of Yahweh face to face.”
translation:
  language: ta
  text: அப்போது கிதியோன், அவர் யாவேயின் தூதர் என்பதை அறிந்துகொண்டான். கிதியோன், “ஐயோ, ஆண்டவராகிய யாவே! ஏனெனில், நான் யாவேயின் தூதரை முகமுகமாகக் கண்டேன்!” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא ... כִּי
  choice: '... என்று உணர்ந்தான்'
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘காணுதல்’ என்றாலும், כִּי தொடங்கும் உட்பொருள் வாக்கியத்துடன் இங்கு கிதியோன் எதிரில் இருந்தவரின் அடையாளத்தை அறிந்துகொண்டதைக் குறிக்கிறது. இயல்பான தமிழில் ‘என்று உணர்ந்தான்’ அந்தச் சூழ்நிலைப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאָךְ என்பது ‘தூதர்’ அல்லது ‘செய்தியாளர்’ எனப் பொருள்படலாம். இச்சூழலில் இயற்கைக்கு அப்பாற்பட்ட தெய்வீகத் தூதரைக் குறிப்பதால் ‘தூதர்’ பொருத்தமானது; சொல்லின் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் கடவுளின் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
- source_word: אֲהָהּ
  choice: ஐயோ
  rationale: இந்த இடைச்சொல் கிதியோனின் திடுக்கிடலையும் அச்சத்தையும் வெளிப்படுத்துகிறது. ‘ஐயோ’ என்பது இயல்பான நவீனத் தமிழில் அந்த உணர்வைச் செம்மையாகக் காட்டுகிறது.
- source_word: אֲדֹנָי יְהוִה
  choice: ஆண்டவராகிய யாவே
  rationale: אֲדֹנָי என்ற ‘ஆண்டவர்’ பட்டத்தையும் יְהוָה என்ற தனிப்பெயரையும் தனித்தனியாகப் பாதுகாத்து, இயல்பான தமிழ் அழைப்பாக அமைக்கிறது.
- source_word: כִּי עַל כֵּן
  choice: (அச்சத்தை வெளிப்படுத்தும் அடுத்த வாக்கிய அமைப்பு)
  rationale: இந்தத் தொடர் கிதியோனின் கூக்குரலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் தனியே ‘ஏனெனில்’ சேர்ப்பது உரையாடலை செயற்கையாக்குவதால், ‘கண்டுவிட்டேனே’ என்ற விளைவுணர்த்தும் அமைப்பில் காரணமும் அச்சமும் இயல்பாக வெளிப்படுகின்றன.
- source_word: רָאִיתִי
  choice: கண்டுவிட்டேனே
  rationale: நிறைவுற்ற செயல் உடனடியாக ஏற்படுத்திய அச்சத்தை தமிழ் வினைமுற்றான ‘கண்டுவிட்டேன்’ காட்டுகிறது; ‘-ஏ’ விகுதி கிதியோனின் கலக்கத்தையும் காரண வலியுறுத்தலையும் வெளிப்படுத்துகிறது.
- source_word: פָּנִים אֶל פָּנִים
  choice: முகமுகமாக
  rationale: நேரடியான சந்திப்பைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கு இயல்பான, நெருக்கமான தமிழ் இணைச்சொல்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் கடவுளின் தனிப்பெயர் நேரடியாக வருகிறது. ஆகவே அந்தப் பெயரை ஒலிபெயர்த்து, אֲדֹנָי என்பதற்கான ‘ஆண்டவர்’ என்பதிலிருந்து வேறுபடுத்தப்பட்டுள்ளது.
- issue: מַלְאַךְ יְהוָה என்பவரின் அடையாளம்
  choice: யாவேயின் தூதர்
  alternative: யாவேயின் செய்தியாளர்
  rationale: மூலச்சொல்லின் பொருள் வரம்பையும் கதையில் காணப்படும் தெய்வீகத் தூதரின் தன்மையையும் பாதுகாக்கிறது. இவர் யார் என்ற மேலதிக கிறிஸ்தவ இறையியல் அடையாளத்தை வசனத்துக்குள் சேர்க்காமல், மூலத்தின் இறையியல் பதற்றம் அப்படியே விடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், கிதியோனின் அச்சம் வெளிப்படும் வகையில் கண்ணியமான நேரடி உரையாடல் நடையிலும் வடிவமைக்கப்பட்டுள்ளது. ‘யாவே’ தனிப்பெயராகவும் ‘ஆண்டவர்’ பட்டப்பெயராகவும் வேறுபடுத்தப்பட்டுள்ளன.
