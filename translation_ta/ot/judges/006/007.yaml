  source_fidelity: மூல எபிரெயத்தின் காலத் துணைவாக்கிய அமைப்பும் பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன. זָעֲקוּ என்பதன் துன்பத்தில் உதவி கோரும் தீவிரம் ‘கூக்குரலிட்டபோது’ என்பதில் வெளிப்படுகிறது; עַל אֹדוֹת מִדְיָן என்பதன் காரணப் பொருளும் ‘மீதியான் காரணமாக’ என்பதில் சரியாக உள்ளது. வசனம் 8-இல் தொடரும் முழுமையற்ற வாக்கியமாக இருப்பதால் இறுதிக் காற்புள்ளி பொருத்தமானது.
