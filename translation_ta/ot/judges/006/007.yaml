  text: וַ/יְהִ֕י כִּֽי זָעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה עַ֖ל אֹד֥וֹת מִדְיָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/007.yaml
  text: And it happened that[a], when the sons of Israel cried out to Yahweh because of Midian[b],
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள்[a] மீதியான் காரணமாக[b] யாவேவை நோக்கிக் கூக்குரலிட்டபோது,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழியில் சொல்லுக்குச் சொல்: ‘இஸ்ரவேலின் மகன்கள்.’'
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘மீதியானை முன்னிட்டு.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: …போது
  rationale: இந்த எபிரெயக் கட்டமைப்பு அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலத் துணைவாக்கியத்தை உருவாக்குகிறது. தமிழில் இயல்பாகவும் தொடரும் 8ஆம் வசனத்துடன் இணைந்தும் அமைய, தனியே ‘இவ்வாறு நிகழ்ந்தது’ என்று மொழிபெயர்க்காமல் ‘…போது’ என்ற அமைப்பில் அதன் பண்பு வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: זָעֲקוּ
  choice: கூக்குரலிட்டபோது
  rationale: துன்பத்தில் உதவி கோரி உரக்க முறையிடுவதைச் சுட்டும் சொல்லின் தீவிரத்தை ‘கூக்குரலிட்டனர்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கிறது; நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֶל יְהוָה
  choice: யாவேவை நோக்கி
  rationale: אֶל என்பது முறையீடு செலுத்தப்படும் நபரை நோக்கிய திசையைக் குறிக்கிறது. ‘நோக்கி’ என்பது அந்த உறவைத் தெளிவாகக் காட்டுகிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל אֹדוֹת מִדְיָן
  choice: மீதியான் காரணமாக
  rationale: இத்தொடர் அவர்களுடைய கூக்குரலுக்கான காரணத்தைச் சுட்டுகிறது. ‘காரணமாக’ என்பது தமிழில் தெளிவான சூழல்சார் இணை.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை நான்கு எழுத்துகளைக் கொண்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயராக மாற்றாமல் தனிப்பெயரை வெளிப்படையாகக் காக்க ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வசனம் 8ஆம் வசனத்தில் நிறைவடையும் காலத் துணைவாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
