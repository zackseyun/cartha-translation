  text: וַ/יִּצָּעֵק֙ אִ֣ישׁ אֶפְרַ֔יִם וַֽ/יַּעֲבֹ֖ר צָפ֑וֹנָ/ה וַ/יֹּאמְר֨וּ לְ/יִפְתָּ֜ח מַדּ֣וּעַ עָבַ֣רְתָּ לְ/הִלָּחֵ֣ם בִּ/בְנֵי עַמּ֗וֹן וְ/לָ֨/נוּ֙ לֹ֤א קָרָ֨אתָ֙ לָ/לֶ֣כֶת עִמָּ֔/ךְ בֵּיתְ/ךָ֕ נִשְׂרֹ֥ף עָלֶ֖י/ךָ בָּ/אֵֽשׁ׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/001.yaml
  text: Then the men of Ephraim were called together[a], and they crossed over to Zaphon and said to Jephthah[c][b], “Why did you cross over to fight against the Ammonites and not call us to go with you? We will burn your house down over you with fire.”
translation:
  language: ta
  text: பின்னர் எப்ராயீம் மக்கள்[b] ஒன்றுதிரட்டப்பட்டார்கள். அவர்கள் சாபோனுக்குக்[a] கடந்து சென்று யெப்தாவிடம், “நீ அம்மோனியருக்கு எதிராகப் போரிடக் கடந்து சென்றபோது, உன்னோடு வரும்படி எங்களை ஏன் அழைக்கவில்லை? உன் வீட்டை உன்மேல் தீயால் எரித்துவிடுவோம்[c]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சாபோன் என்பதற்குப் பதிலாக, צָפוֹנָה என்பதைத் திசையைக் குறிக்கும் வினையடையாக எடுத்தால், “வடக்கு நோக்கி” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரேயத்தில் சொற்சொல்லாக “எப்ராயீமின் மனிதன்” என்று ஒருமையில் உள்ளது; ஆனால் தொடர்ந்து வரும் பன்மை வினைச்சொற்கள், இது எப்ராயீம் மக்களை ஒரு குழுவாகக் குறிக்கிறது என்பதைக் காட்டுகின்றன.
    reason: lexical_alternative
  - marker: c
    text: இந்த அச்சுறுத்தல், “உன்னை வீட்டுக்குள் வைத்தே அதைக் கொளுத்துவோம்” என்று பொருள்பட வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק אִישׁ אֶפְרַיִם
  choice: எப்ராயீம் மக்கள் ஒன்றுதிரட்டப்பட்டார்கள்
  rationale: אִישׁ என்பது வடிவில் ஒருமையாக இருந்தாலும், தொடர்ந்து வரும் וַיֹּאמְרוּ என்ற பன்மை வினைச்சொல் இதைக் குழுவைக் குறிக்கும் கூட்டுப்பொருளாகக் காட்டுகிறது. וַיִּצָּעֵק இங்கு போருக்காக அழைக்கப்பட்டு ஒன்றுகூடுதலைக் குறிக்கிறது.
- source_word: וַיַּעֲבֹר
  choice: அவர்கள் ... கடந்து சென்று
  rationale: எபிரெய வடிவம் ஒருமையாக இருந்தாலும், கூட்டுப்பொருளுடைய எழுவாயும் தொடர்ந்து வரும் பன்மை வினையும் காரணமாகத் தமிழில் பன்மை இயல்பானது.
- source_word: צָפוֹנָה
  choice: சாபோனுக்கு
  rationale: இதைத் திசையைக் குறிக்கும் ‘வடக்கு நோக்கி’ என்பதற்குப் பதிலாக, சூழலில் சாபோன் என்ற இடப்பெயராக எடுத்துக்கொள்வது பொருத்தமானது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לְהִלָּחֵם בִּבְנֵי עַמּוֹן
  choice: அம்மோனியரோடு போரிட
  rationale: ‘அம்மோனின் மகன்கள்’ என்ற சொற்றொடரை இயல்பான இனப்பெயராக வழங்குகிறது; בְּ குறிக்கும் எதிர்த்துப் போரிடும் உறவு தமிழில் ‘-ஓடு போரிட’ என்பதால் தெளிவாகிறது.
- source_word: וְלָנוּ לֹא קָרָאתָ לָלֶכֶת עִמָּךְ
  choice: உன்னோடு வரும்படி எங்களை ஏன் அழைக்கவில்லை?
  rationale: கָרָא இங்கு போரில் பங்கேற்க அழைப்பதைக் குறிக்கிறது. ‘வரும்படி’ என்பது தமிழ்ப் பேச்சின் பார்வைக்கேற்ப இயல்பாக இருந்தாலும், உடன்செல்லும் பொருளைத் தக்கவைக்கிறது.
- source_word: בֵּיתְךָ נִשְׂרֹף עָלֶיךָ בָּאֵשׁ
  choice: உன் வீட்டை உன்மேல் தீயிட்டுக் கொளுத்துவோம்
  rationale: עָלֶיךָ என்பதன் ‘உன்மேல்’ என்ற கடுமையான படிமத்தையும், בָּאֵשׁ என்பதன் நெருப்புக் குறிப்பையும் தக்கவைக்கிறது; ‘உன்னை உள்ளே வைத்து’ என்று மூலத்தில் வெளிப்படையாக இல்லாத விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
