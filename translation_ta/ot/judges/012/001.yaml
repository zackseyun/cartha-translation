  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில் கண்ணியமான நேரடி நடையில் வடிவமைக்கப்பட்டது. இடப்பெயர் குறித்த உண்மையான ஐயமும் அச்சுறுத்தலின் படிமமும் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
