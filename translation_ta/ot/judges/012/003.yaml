source:
  edition: WLC
  text: וָֽ/אֶרְאֶ֞ה כִּֽי אֵינְ/ךָ֣ מוֹשִׁ֗יע וָ/אָשִׂ֨ימָ/ה נַפְשִׁ֤/י בְ/כַפִּ/י֙ וָֽ/אֶעְבְּרָ/ה֙ אֶל בְּנֵ֣י עַמּ֔וֹן וַ/יִּתְּנֵ֥/ם יְהוָ֖ה בְּ/יָדִ֑/י וְ/לָ/מָ֞ה עֲלִיתֶ֥ם אֵלַ֛/י הַ/יּ֥וֹם הַ/זֶּ֖ה לְ/הִלָּ֥חֶם בִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/003.yaml
  text: When I saw that you were not delivering us[a], I put my life in my hand and crossed over against the Ammonites, and Yahweh gave them into my hand. So why have you come up against me today to fight against me?
translation:
  language: ta
  text: நீர் எங்களை விடுவிக்கவில்லை என்று நான் கண்டபோது, என் உயிரை என் உள்ளங்கையில் வைத்துக்கொண்டு[a] அம்மோனியருக்கு எதிராகக் கடந்துசென்றேன். யாவே அவர்களை என் கையில் கொடுத்தார். அப்படியிருக்க, இன்று என்னை எதிர்த்துப் போரிட நீங்கள் ஏன் எனக்கு எதிராக வந்திருக்கிறீர்கள்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “என் உயிரை என் உள்ளங்கையில் வைத்தேன்.” இது “என் உயிரைப் பணயம் வைத்தேன்” என்று பொருள்படும் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: நான் கண்டபோது
  rationale: ראה என்பதன் தொடர்நிலை வடிவம் அடுத்த செயலுக்குக் காரணமான எப்தாவின் உணர்தலைக் குறிக்கிறது; தமிழில் காலத்தையும் காரணத் தொடர்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי אֵינְךָ מוֹשִׁיעַ
  choice: நீர் எங்களை விடுவிக்கவில்லை என்று
  rationale: இராணுவச் சூழலில் ישׁע மீட்பை அல்லது விடுதலையைச் சுட்டுகிறது. எபிரெயில் வினையின் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும் சூழலிலிருந்து ‘எங்களை’ என்பது தெளிவாகிறது. இங்கு ஒருமை முன்னிலை இருப்பதால் ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וָאָשִׂימָה נַפְשִׁי בְכַפִּי
  choice: என் உயிரை என் உள்ளங்கையில் வைத்துக்கொண்டு
  rationale: உயிரைப் பணயம் வைப்பதைக் குறிக்கும் எபிரெய உருவகத்தைத் தக்கவைத்து, தமிழில் தொடரும் செயலோடு இயல்பாக இணைக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וָאֶעְבְּרָה אֶל בְּנֵי עַמּוֹן
  choice: அம்மோனியருக்கு எதிராகக் கடந்துசென்றேன்
  rationale: போர் நிகழ்வில் עבר மற்றும் אֶל எதிரியை நோக்கி முன்னேறி அல்லது கடந்து செல்வதைக் குறிக்கின்றன. ‘எதிராக’ என்பது பகைமைத் திசையைச் சூழலுக்கு ஏற்ப தெளிவாக்குகிறது.
- source_word: וַיִּתְּנֵם יְהוָה בְּיָדִי
  choice: யாவே அவர்களை என் கையில் கொடுத்தார்
  rationale: வெற்றியைக் குறிக்கும் பொதுவான எபிரெய சொற்றொடரின் ‘கையில்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; יְהוָה தனிப்பெயராக ‘யாவே’ என்று எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: וְלָמָה עֲלִיתֶם אֵלַי
  choice: அப்படியிருக்க, ... நீங்கள் ஏன் எனக்கு எதிராக வந்திருக்கிறீர்கள்?
  rationale: கேள்வியின் விளைவு சார்ந்த தொடர்பை ‘அப்படியிருக்க’ வெளிப்படுத்துகிறது. இங்கு எபிரெயில் பன்மை முன்னிலை இருப்பதால் ‘நீங்கள்’ பயன்படுத்தப்பட்டு, மூலத்தில் உள்ள ஒருமையிலிருந்து பன்மைக்கு மாறுதல் பாதுகாக்கப்படுகிறது.
- source_word: הַיּוֹם הַזֶּה לְהִלָּחֶם בִּי
  choice: இன்று என்னோடு போரிட
  rationale: காலக் குறிப்பையும் לחם உடன் வரும் பகைமைப் போரின் பொருளையும் இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கையின் தனிப்பெயரான நான்கு எழுத்துப் பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டமாக மாற்றாமல் தமிழ் எழுத்துப்பெயர்ப்பில் வழங்குகிறது.
- issue: எபிரெய முன்னிலை எண்ணில் ஏற்படும் மாற்றம்
  choice: முதல் பகுதியில் ‘நீர்’ என்ற ஒருமை; இறுதிக் கேள்வியில் ‘நீங்கள்’ என்ற பன்மை
  alternative: இரு இடங்களிலும் ‘நீங்கள்’
  rationale: אֵינְךָ ஒருமையாகவும் עֲלִיתֶם பன்மையாகவும் உள்ள மூலத்தின் குறிப்பிடத்தக்க மாற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய உருவகங்களான ‘உள்ளங்கையில் உயிரை வைத்தல்’ மற்றும் ‘கையில் கொடுத்தல்’ தக்கவைக்கப்பட்டுள்ளன; முதல் உருவகத்தின் மரபுப்பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. ஒருமை–பன்மை முன்னிலை மாற்றம் நோக்கத்துடன் பாதுகாக்கப்பட்டுள்ளது.
