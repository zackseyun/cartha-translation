  yaml_path: translation/ot/judges/012/014.yaml
  text: He had forty sons and thirty grandsons, riding on seventy donkeys, and he judged Israel eight years.
translation:
  language: ta
  text: அவனுக்கு நாற்பது மகன்களும் முப்பது பேரன்களும் இருந்தார்கள். அவர்கள் எழுபது கழுதைகளின்மேல் சவாரி செய்தார்கள். அவன் இஸ்ரவேலை எட்டு ஆண்டுகள் நியாயம் விசாரித்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי בָנִים
  choice: பேரன்கள்
  rationale: சொல்லுக்கு சொல் ‘மகன்களின் மகன்கள்’ என்றாலும், இயல்பான நவீனத் தமிழில் ஆண் வழிப் பேரப்பிள்ளைகளை இங்கு சுருக்கமாகக் குறிக்கும் சொல்.
- source_word: עֲיָרִם
  choice: கழுதைகள்
  rationale: இங்கு எபிரேயச் சொல் ‘கழுதைகள்’ என்பதைக் குறிக்கிறது; எழுபது என்ற எண்ணிக்கையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: רֹכְבִים עַל
  choice: சவாரி செய்தார்கள்
  rationale: தொடர்ச்சியான/வழக்கமான சவாரி நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: இஸ்ரவேலை ... நியாயம் விசாரித்தான்
  rationale: நீதித்தீர்ப்பு வழங்குதல் மட்டுமல்லாமல் நீதித்தலைவராக ஆட்சி செய்தல் என்ற நியாயாதிபதிகள் நூலின் கருத்தையும் தாங்கும் மரபார்ந்த, புரிந்துகொள்ளக்கூடிய சொற்றொடர்.
