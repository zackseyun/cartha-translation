translation_notes:
  register: நவீன, கண்ணியமான, எளிதில் புரியும் தமிழ். எபிரேயத்தில் உள்ள தொடர்ச்சியான ஒரே வாக்கிய அமைப்பு, தமிழில் தெளிவிற்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டது. ‘அவர்கள்’ என்பது நாற்பது மகன்களையும் முப்பது பேரன்களையும் சேர்த்து எழுபது பேரைக் குறிக்கிறது; இதனால் எழுபது கழுதைகளுடன் உள்ள எண்ணியல் இணைப்பு பாதுகாக்கப்படுகிறது.
