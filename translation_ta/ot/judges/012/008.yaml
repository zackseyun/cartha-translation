  text: After him[a], Ibzan from Bethlehem judged Israel.
translation:
  language: ta
  text: அவருக்குப் பிறகு, பெத்லெகேமைச் சேர்ந்த[a] இப்சான் இஸ்ரவேலை நியாயந்தீர்த்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெத்லெகேமின்.” எபிரெய முன்னொட்டு ஒருவரின் தோற்றத்தையோ தொடர்பையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: நீதி வழங்கினார்
  rationale: நியாயாதிபதிகள் நூலில் שׁפט என்பது இஸ்ரவேலின் நியாயாதிபதியாகச் செயல்பட்டு ஆளுவதைக் குறிக்கிறது. தமிழில் இயல்பாக அமையும் ‘நீதி வழங்கினார்’ என்ற சொற்றொடர் அந்தப் பங்கை உணர்த்துகிறது; வெறும் தீர்ப்பளித்தல் என்ற குறுகிய பொருளில் அதைச் சுருக்கவில்லை.
- source_word: אַחֲרָיו
  choice: அவருக்குப் பிறகு
  rationale: முந்தைய நியாயாதிபதியைத் தொடர்ந்து வந்த காலத்தையும் பதவிவரிசையையும் இந்த வடிவம் நேரடியாகக் காட்டுகிறது; மூலத்தில் இல்லாத ‘யெப்தா’ என்ற பெயரைச் சேர்க்கவில்லை.
- source_word: אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு
  rationale: אֶת என்பது நேரடி செயப்படுபொருள் குறியீடு. ஆனால் ‘நீதி வழங்கினார்’ என்பதுடன் இயல்பான நவீனத் தமிழில் பயனாளி நான்காம் வேற்றுமையில் அமைவதால் ‘இஸ்ரவேலுக்கு’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: אִבְצָן
  choice: இப்சான்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் தெளிவாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: מִבֵּית לָחֶם
  choice: பெத்லெகேமைச் சேர்ந்த
  rationale: מִן இங்கு ஊர்த் தோற்றம் அல்லது தொடர்பைக் குறிக்கிறது. தமிழில் ஒருவரின் ஊர்சார் அடையாளத்தைக் கூற ‘பெத்லெகேமைச் சேர்ந்த’ என்பது இயல்பாகவும் துல்லியமாகவும் அமைகிறது.
