base_translation:
  language: en
  yaml_path: translation/ot/judges/012/009.yaml
  text: He had thirty sons[a], and thirty daughters he sent away, and he brought in thirty daughters from outside for his sons. And he judged Israel seven years.
translation:
  language: ta
  text: அவனுக்கு முப்பது மகன்கள் இருந்தார்கள். அவன் தன் முப்பது மகள்களை வெளியே அனுப்பி வைத்தான்[a]; தன் மகன்களுக்காக வெளியிலிருந்து முப்பது மகள்களைக் கொண்டு வந்தான். அவன் இஸ்ரவேலை ஏழு ஆண்டுகள் நியாயந்தீர்த்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் வெளிப்படையாக, “அவன் தன் முப்பது மகள்களைத் தன் குலம் அல்லது குடும்பத்திற்கு வெளியே திருமணம் செய்து கொடுத்தான்; தன் மகன்களுக்காக வெளியிலிருந்து முப்பது பெண்களைக் கொண்டு வந்தான்” எனப் பொருள்கொள்ளலாம். இரு இடங்களிலும் எபிரெய மூலத்தில் சொல்லர்த்தமாக “மகள்கள்” என்றே உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: அவனுக்கு ... இருந்தார்கள்
  rationale: היה + ל possession-ஐக் குறிக்கும் எபிரெய மொழிமரபை இயல்பான தமிழில் உரிமை/உடமை அமைப்பாகத் தருகிறது.
- source_word: שְׁלֹשִׁים בָּנִים
  choice: முப்பது மகன்கள்
  rationale: எண்ணிக்கையையும் பாலினத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וּשְׁלֹשִׁים בָּנוֹת
  choice: முப்பது மகள்கள்
  rationale: மூலத்தில் உள்ள בנות என்பதன் நேரடிப் பொருளான ‘மகள்கள்’ என்பதைக் காக்கிறது.
- source_word: שִׁלַּח הַחוּצָה
  choice: வெளியே அனுப்பி வைத்தான்
  rationale: שׁלח மற்றும் திசைச்சுட்டும் הַחוּצָה ஆகியவற்றின் அடிப்படைப் பொருளைத் தக்கவைத்து, திருமணம் செய்து கொடுத்தான் என்ற சூழல்சார் உட்பொருளை முதன்மை உரையில் கட்டாயப்படுத்தாமல் விடுகிறது.
- source_word: וּשְׁלֹשִׁים בָּנוֹת הֵבִיא לְבָנָיו מִן הַחוּץ
  choice: தன் மகன்களுக்காக வெளியிலிருந்து முப்பது மகள்களை அழைத்து வந்தான்
  rationale: மூலத்தின் ‘மகள்கள்’ என்ற மறுபயன்பாட்டையும், ‘தன் மகன்களுக்காக’ மற்றும் ‘வெளியிலிருந்து’ என்ற உறவுகளையும் காக்கிறது; திருமணச் சூழல் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: அவன் இஸ்ரவேலை ... நியாயந்தீர்த்தான்
  rationale: நியாயாதிபதிகள் நூலில் மீண்டும் வரும் שׁפט என்ற சொல்லின் நீதிபதி/ஆட்சித் தலைமைச் செயல்பாட்டை மரபான, புரிந்துகொள்ளத்தக்க தமிழில் பாதுகாக்கிறது.
- source_word: שֶׁבַע שָׁנִים
  choice: ஏழு ஆண்டுகள்
  rationale: கால அளவை இயல்பாகவும் துல்லியமாகவும் தருகிறது.
