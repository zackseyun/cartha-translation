  edition: WLC
  text: וַ/יִּשְׁפֹּ֥ט אַחֲרָ֖י/ו אֶת יִשְׂרָאֵ֑ל עַבְדּ֥וֹן בֶּן הִלֵּ֖ל הַ/פִּרְעָתוֹנִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/013.yaml
  text: After him, Abdon son of Hillel the Pirathonite judged Israel.
translation:
  language: ta
  text: அவனுக்குப் பிறகு, பிராத்தோனைச் சேர்ந்த இல்லேலின் மகன் அப்தோன் இஸ்ரவேலை நியாயந்தீர்த்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: நியாயந்தீர்த்தான்
  rationale: நியாயாதிபதிகள் நூலில் שׁפט என்பது இஸ்ரவேலின் நியாயாதிபதிகளுடைய பணியைத் தொடர்ந்து குறிக்கும் முக்கியச் சொல். ‘நியாயந்தீர்த்தான்’ அந்தச் சொல் தொடர்பைப் பேணுவதோடு, ஆட்சி செய்தல் அல்லது வழிநடத்தல் என்ற விரிவான பொருளையும் முற்றிலும் மறுப்பதில்லை.
- source_word: אַחֲרָיו
  choice: அவனுக்குப் பிறகு
  rationale: முந்தைய நியாயாதிபதிக்குப் பின் அப்தோன் வந்த succession-ஐ இந்தச் சொற்றொடர் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֶת יִשְׂרָאֵל
  choice: இஸ்ரவேலை
  rationale: אֶת நேரடி செயப்படுபொருள் குறியீடு; தமிழில் ‘இஸ்ரவேலை’ என்ற வேற்றுமை வடிவம் அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַבְדּוֹן
  choice: அப்தோன்
  rationale: எபிரெய தனிப்பெயருக்கு ஒலிபெயர்ப்பு வழங்கப்பட்டுள்ளது.
- source_word: בֶּן הִלֵּל
  choice: இல்லேலின் மகன்
  rationale: எபிரெய இணைநிலைத் தொடர் அப்தோனின் தந்தையை நேரடியாக அடையாளப்படுத்துகிறது; தமிழின் இயல்பான உடைமைத் தொடரில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַפִּרְעָתוֹנִי
  choice: பிராத்தோனைச் சேர்ந்த
  rationale: இவ்வினப்பெயர் பிராத்தோன் ஊரைச் சேர்ந்த ஒருவரைக் குறிக்கிறது. தமிழில் செயற்கையான குடிப்பெயர் உருவாக்குவதற்குப் பதிலாக, ‘பிராத்தோனைச் சேர்ந்த’ என்பது பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை. நூலின் தொடர்ச்சியான பதவிச்சொல்லைப் பேண ‘நியாயந்தீர்த்தான்’ பயன்படுத்தப்பட்டுள்ளது; இடத்தைச் சார்ந்த அடையாளம் இயல்பான தமிழில் விரிக்கப்பட்டுள்ளது.
