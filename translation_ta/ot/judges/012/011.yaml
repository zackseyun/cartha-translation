  text: After him, Elon the Zebulunite judged Israel ten years.
translation:
  language: ta
  text: அவனுக்குப் பிறகு, செபுலோன் கோத்திரத்தைச் சேர்ந்த ஏலோன் இஸ்ரவேலை நியாயந்தீர்த்தான். அவன் இஸ்ரவேலைப் பத்து ஆண்டுகள் நியாயந்தீர்த்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: நியாயந்தீர்த்தான்
  rationale: நியாயாதிபதிகள் நூலில் திரும்பத் திரும்ப வரும் שׁפט என்ற வினையின் நீதித்துறை மற்றும் ஆட்சித்தலைமை சார்ந்த பரப்பைத் தக்கவைக்கிறது; அதை வெறும் இராணுவ அல்லது நிர்வாகத் தலைமையாகக் குறுக்கவில்லை.
- source_word: אַחֲרָיו
  choice: அவனுக்குப் பிறகு
  rationale: எபிரெயப் பிரதிப்பெயர் முந்தைய நியாயாதிபதியைக் குறிக்கிறது. இந்த வசனத்தில் பெயர் சொல்லப்படாததால், ‘இப்சானுக்குப் பிறகு’ என்று வெளிப்படையாக்காமல் மூலத்தின் வடிவம் காக்கப்படுகிறது.
- source_word: אֵילוֹן
  choice: ஏலோன்
  rationale: ஆள்பெயர் நவீனத் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַזְּבוּלֹנִי
  choice: செபுலோன் கோத்திரத்தைச் சேர்ந்த
  rationale: இந்த இனக்குழு/கோத்திர அடைமொழி ஏலோனின் கோத்திரச் சார்பைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עֶשֶׂר שָׁנִים
  choice: பத்து ஆண்டுகள்
  rationale: கால அளவைக் குறிக்கும் எபிரெயச் சொற்றொடரின் வழக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל ... וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: இஸ்ரவேலை நியாயந்தீர்த்தான் ... இஸ்ரவேலைப் பத்து ஆண்டுகள் நியாயந்தீர்த்தான்
  rationale: 'மூல எபிரெயத்தில் வினைச்சொல் இருமுறை வருகிறது: முதலில் ஏலோனை அறிமுகப்படுத்தவும், பின்னர் அவரது பணிக்காலத்தைக் கூறவும். இரண்டு வாக்கியங்களாக அமைப்பது அந்த மீளுரையைத் தக்கவைத்தபடியே தமிழில் வாசிக்க எளிதாக உள்ளது.'
