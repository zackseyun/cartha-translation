  text: וַ/יִּשְׁפֹּ֥ט יִפְתָּ֛ח אֶת יִשְׂרָאֵ֖ל שֵׁ֣שׁ שָׁנִ֑ים וַ/יָּ֗מָת יִפְתָּח֙ הַ/גִּלְעָדִ֔י וַ/יִּקָּבֵ֖ר בְּ/עָרֵ֥י גִלְעָֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/007.yaml
  text: Jephthah judged Israel six years[a]. Then Jephthah the Gileadite died and was buried in the cities of Gilead.
translation:
  language: ta
  text: யெப்தா இஸ்ரவேலை ஆறு ஆண்டுகள் நியாயந்தீர்த்தார். பின்பு கீலேயாத்தியனான யெப்தா இறந்து, கீலேயாத்தின் பட்டணங்களில் அடக்கம் செய்யப்பட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “கீலேயாத்தின் பட்டணங்களில்.” இங்குள்ள பன்மை, அந்தப் பகுதியில் பெயர் குறிப்பிடப்படாத ஒரு பட்டணத்தைக் குறிக்கும் மொழிமரபாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: நியாயந்தீர்த்தார்
  rationale: நியாயாதிபதிகள் நூலில் שׁפט என்பது நியாயாதிபதி-விடுவிப்பவரின் பணியைச் சுட்டும் தொடர்ச்சியான சொல்லாட்சி; ‘நியாயந்தீர்த்தார்’ அந்த நூல்சார் தொடர்பைப் பேணுகிறது.
- source_word: שֵׁשׁ שָׁנִים
  choice: ஆறு ஆண்டுகள்
  rationale: கால அளவைக் குறிக்கும் நேரடியான சொற்றொடர்.
- source_word: הַגִּלְעָדִי
  choice: கீலேயாத்தியனான
  rationale: இந்தப் பெயரடை யெப்தாவின் பிராந்திய அடையாளத்தைத் தெரிவிக்கிறது; தமிழில் இயல்பான அடைமொழி வடிவில் தரப்பட்டுள்ளது.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டார்
  rationale: எபிரெய வினையின் செயப்பாட்டு வடிவத்தையும் வழக்கமான இறப்பு அறிவிப்பு நடையையும் பேணுகிறது.
- source_word: בְּעָרֵי גִלְעָד
  choice: கீலேயாத்தின் பட்டணங்களில்
  rationale: எபிரெய மூலத்திலுள்ள பன்மையை விளக்கமாக ஒருமையாக்காமல் நேரடியாகப் பேணுகிறது; அதன் சாத்தியமான மொழிமரபுச் சிறப்பை அடிக்குறிப்பு தெரிவிக்கிறது.
