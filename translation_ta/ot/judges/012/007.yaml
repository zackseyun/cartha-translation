translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. நூலின் தொடர்ச்சியான நீதித்தீர்ப்பு சொல்லாட்சியைப் பேண ‘நியாயந்தீர்த்தார்’ தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் பன்மை முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
