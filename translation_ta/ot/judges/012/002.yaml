  text: וַ/יֹּ֤אמֶר יִפְתָּח֙ אֲלֵי/הֶ֔ם אִ֣ישׁ רִ֗יב הָיִ֛יתִי אֲנִ֛י וְ/עַמִּ֥/י וּ/בְנֵֽי עַמּ֖וֹן מְאֹ֑ד וָ/אֶזְעַ֣ק אֶתְ/כֶ֔ם וְ/לֹֽא הוֹשַׁעְתֶּ֥ם אוֹתִ֖/י מִ/יָּדָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/002.yaml
  text: Jephthah said to them[a], “I and my people were in a bitter conflict with the Ammonites, and I called out to you, but you did not save me from their hand.”
translation:
  language: ta
  text: யெப்தா அவர்களிடம், “நானும் என் மக்களும் அம்மோனியரோடு கடும் மோதலில் இருந்தோம்[a]. நான் உங்களை நோக்கிக் கூப்பிட்டேன்; ஆனால் நீங்கள் என்னை அவர்களுடைய கையிலிருந்து காப்பாற்றவில்லை” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் முறையான வடிவில்: “நான் சச்சரவின் மனிதனாக இருந்தேன்; நானும் என் மக்களும் அம்மோனியரோடு மிகுந்த சச்சரவிலிருந்தோம்.”'
    reason: אִישׁ רִיב என்ற எபிரெய மரபுத்தொடரின் முறையான ‘சச்சரவின் மனிதன்’ வடிவத்தையும், வாக்கியத்தின் சுருக்கமான அமைப்பையும் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: אִישׁ רִיב ... מְאֹד
  choice: கடும் மோதலில் இருந்தோம்
  rationale: אִישׁ רִיב என்ற எபிரெய மரபுத்தொடர் இங்கு யெப்தாவின் குணத்தை மட்டும் கூறாமல், அவனும் அவன் மக்களும் இருந்த மோதல் நிலையை விவரிக்கிறது. מְאֹד தரும் தீவிரத்தையும் சேர்த்து, இயல்பான நவீனத் தமிழில் ‘கடும் மோதலில்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְעַמִּי
  choice: என் மக்களும்
  rationale: עַם என்பதன் இயல்பான கூட்டுப்பொருள் ‘மக்கள்’; அதை ‘படை’ என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: וּבְנֵי עַמּוֹן
  choice: அம்மோனியரோடு
  rationale: בני עמון என்ற இனப்பெயருக்கான இயல்பான தமிழாக்கம் ‘அம்மோனியர்’; בְ குறிக்கும் எதிர்நிலையை ‘-ஓடு’ வெளிப்படுத்துகிறது.
- source_word: וָאֶזְעַק אֶתְכֶם
  choice: நான் உங்களை நோக்கிக் கூப்பிட்டேன்
  rationale: זעק உதவி வேண்டி எழுப்பும் கூக்குரலைக் குறிக்கலாம். ‘உங்களை நோக்கிக் கூப்பிட்டேன்’ என்பது மூலத்தின் அழைப்பை இயல்பாகத் தருகிறது; உரையில் வெளிப்படையாக இல்லாத ‘உதவிக்கு’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: וְלֹא הוֹשַׁעְתֶּם אוֹתִי
  choice: நீங்கள் என்னைக் காப்பாற்றவில்லை
  rationale: ישׁע என்பதன் ஹிஃபில் வடிவம் காப்பாற்றுதல் அல்லது விடுவித்தலைக் குறிக்கிறது. இங்குள்ள இராணுவச் சூழலுக்கு ‘காப்பாற்றவில்லை’ நேரடியும் இயல்புமானது.
- source_word: מִיָּדָם
  choice: அவர்களுடைய கையிலிருந்து
  rationale: ஆளுகை அல்லது அதிகாரத்தைக் குறிக்கும் ‘கை’ உருவகத்தைத் தமிழிலும் புரிந்துகொள்ள முடிவதால் அது பாதுகாக்கப்பட்டது.
