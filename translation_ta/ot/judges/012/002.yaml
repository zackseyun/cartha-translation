  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமக் கதைநடையின் செறிவும் காக்கப்பட்டுள்ளன. ‘கை’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; கடினமான எபிரெய மரபுத்தொடரின் முறையான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
