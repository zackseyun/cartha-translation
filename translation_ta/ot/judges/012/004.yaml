base_translation:
  language: en
  yaml_path: translation/ot/judges/012/004.yaml
  text: Then Jephthah gathered all the men of Gilead and fought with Ephraim. And the men of Gilead struck Ephraim down[a], because they had said, “You Gileadites are fugitives of Ephraim, in the midst of Ephraim and in the midst of Manasseh.”
translation:
  language: ta
  text: பின்பு யெப்தா கீலேயாத்தின் ஆண்கள் அனைவரையும் ஒன்றுகூட்டி, எப்பிராயீமுக்கு எதிராகப் போரிட்டான். கீலேயாத்தின் ஆண்கள் எப்பிராயீமை வீழ்த்தினார்கள். ஏனெனில், “கீலேயாத்தியர்களாகிய நீங்கள் எப்பிராயீமிலிருந்து தப்பியோடியவர்கள்; எப்பிராயீமின் நடுவிலும் மனாசேயின் நடுவிலும் இருக்கிறீர்கள்”[a] என்று அவர்கள் கூறியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இறுதி இகழ்ச்சிக் கூற்றின் எபிரெய வாசகம் தொடரியல் ரீதியாகக் கடினமானது. இதை, “கீலேயாத்தே, நீங்கள் எப்பிராயீமின் தப்பியோடியவர்கள்; எப்பிராயீமின் நடுவிலும் மனாசேயின் நடுவிலும் இருக்கிறீர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: ஒன்றுகூட்டி
  rationale: קבץ என்பது ஒன்றுகூட்டுதல் அல்லது திரட்டுதல் என்று பொருள்படும். போருக்கான திரட்டலைச் சூழல் உணர்த்தினாலும், மூலத்தில் இல்லாத படைச்சேர்ப்பு என்ற கூடுதல் கருத்தை இச்சொல் புகுத்தவில்லை.
- source_word: כָּל אַנְשֵׁי גִלְעָד
  choice: கீலேயாத்தின் ஆண்கள் அனைவரையும்
  rationale: אַנְשֵׁי என்பதன் நேரடிப் பொருள் ‘ஆண்கள்’. போர்ச் சூழலில் போரிடும் ஆண்களைக் குறித்தாலும், மூலத்தின் பாலினக் குறிப்பையும் வடிவத்தையும் இத்தேர்வு காக்கிறது.
- source_word: וַיִּלָּחֶם אֶת אֶפְרָיִם
  choice: எப்பிராயீமுக்கு எதிராகப் போரிட்டான்
  rationale: לחם இங்கு போரிடுதலைக் குறிக்கிறது. தமிழில் எதிர்த்தரப்பைத் தெளிவாகவும் இயல்பாகவும் சுட்டுவதற்கு ‘எதிராகப் போரிட்டான்’ பொருத்தமானது.
- source_word: וַיַּכּוּ
  choice: வீழ்த்தினார்கள்
  rationale: נכה என்பது அடித்தல், தாக்கி வீழ்த்தல் அல்லது தோற்கடித்தல் எனப் பொருள்படலாம். ‘வீழ்த்தினார்கள்’ வன்முறையான போர்ச் செயலைக் காக்கிறது; அனைவரும் கொல்லப்பட்டார்கள் என்று தேவைக்கு மீறி வரையறுப்பதில்லை.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: தொடர்ந்து வரும் இகழ்ச்சிக் கூற்று முந்தைய போர்ச்செயலுக்கான காரணமாக வழங்கப்படுவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: எப்பிராயீமிலிருந்து தப்பியோடியவர்கள்
  rationale: פְּלִיטֵי என்பது தப்பியோடியோர் அல்லது தப்பிப்பிழைத்தோர் என்பதைக் குறிக்கிறது. இங்கு இகழ்ச்சியின் வலிமையைக் காக்க ‘தப்பியோடியவர்கள்’ தேர்ந்தெடுக்கப்பட்டது; ‘எப்பிராயீமிலிருந்து’ என்பது சார்பு அல்லது தோற்றம் என்ற இரு சாத்தியங்களுள் இயல்பான வாசிப்பை வழங்குகிறது, ஆனால் சிக்கல் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: אַתֶּם גִּלְעָד
  choice: கீலேயாத்தியர்களாகிய நீங்கள்
  rationale: இடப்பெயரான גִּלְעָד அதன் மக்களைக் கூட்டாகக் குறிக்கிறது. தமிழில் நேரடி அழைப்பை இயல்பாக வெளிப்படுத்த இவ்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: בְּתוֹךְ אֶפְרַיִם בְּתוֹךְ מְנַשֶּׁה
  choice: எப்பிராயீமின் நடுவிலும் மனாசேயின் நடுவிலும்
  rationale: בְּתוֹךְ என்பதன் ‘நடுவில்/மத்தியில்’ என்ற அடிப்படைப் பொருளையும், எபிரெயத்தில் காணப்படும் மீளுரைப்பையும் இத்தேர்வு காக்கிறது.
theological_decisions:
- issue: இறுதி இகழ்ச்சிக் கூற்றின் தொடரியல் தெளிவின்மை
  choice: “கீலேயாத்தியர்களாகிய நீங்கள் எப்பிராயீமிலிருந்து தப்பியோடியவர்கள்; எப்பிராயீமின் நடுவிலும் மனாசேயின் நடுவிலும் இருக்கிறீர்கள்”
  alternative: “கீலேயாத்தே, நீங்கள் எப்பிராயீமின் தப்பியோடியவர்கள்; எப்பிராயீமரிடையிலும் மனாசேயரிடையிலும் இருக்கிறீர்கள்”
  rationale: எபிரெய வாசகம் சுருக்கமாகவும் தொடரியல் ரீதியில் கடினமாகவும் உள்ளது. முதன்மை உரை இகழ்ச்சியின் நேரடித்தன்மையையும் פְּלִיטֵי என்பதன் சொல்லாட்சியையும் காக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டு, தெளிவின்மை மறைக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத்தமிழில் இயல்பான, கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆண்கள்’, ‘போரிட்டான்’, ‘வீழ்த்தினார்கள்’ ஆகியவை போர்ச் சூழலின் நேரடித்தன்மையைத் தக்கவைக்கின்றன. கடினமான இறுதி வாசகம் உரையில் அளவுக்கு மீறித் தெளிவாக்கப்படாமல், மாற்று அமைப்பு அடிக்குறிப்பில் கொடுக்கப்பட்டுள்ளது.
