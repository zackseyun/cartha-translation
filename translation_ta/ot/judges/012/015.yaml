revisions:
- from: பிரத்தோன் ஊரானும் இல்லேலின் மகனுமான அப்தோன் இறந்தான். அவன் எப்பிராயீம் நாட்டிலுள்ள பிரத்தோனில், அமலேக்கியரின் மலைப்பகுதியில் அடக்கம் செய்யப்பட்டான்.[a]
  to: இல்லேலின் மகனும் பிராத்தோனைச் சேர்ந்தவனுமான அப்தோன் இறந்தான். அவன் எப்பிராயீம் நாட்டிலுள்ள பிராத்தோனில், அமலேக்கியரின் மலைநாட்டில்[a] அடக்கம் செய்யப்பட்டான்.
  rationale: The revision retains every source-text element and the draft’s collective interpretation of the singular gentilic, while improving Tamil idiom, using a regional rendering for הַר, and placing the lexical-alternative footnote at its precise referent.
