translation_notes:
  register: நவீன நிலையான தமிழில் நேரடியும் கண்ணியமுமான நடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்களும் தனிப்பெயர்களும் எபிரெய ஒலியமைப்பை அணுகும் வகையில் எழுத்துப்பெயர்க்கப்பட்டுள்ளன; நீளமான புவியியல் தொடரின் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
