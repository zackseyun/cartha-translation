base_translation:
  language: en
  yaml_path: translation/ot/judges/012/015.yaml
  text: And Abdon son of Hillel the Pirathonite died[a], and he was buried in Pirathon, in the land of Ephraim, in the hill country of the Amalekites.
translation:
  language: ta
  text: இல்லேலின் மகனும் பிராத்தோனைச் சேர்ந்தவனுமான அப்தோன் இறந்தான். அவன் எப்பிராயீம் நாட்டிலுள்ள பிராத்தோனில், அமலேக்கியரின் மலைநாட்டில்[a] அடக்கம் செய்யப்பட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொற்சொல்லாக, “அமலேக்கியனின் மலையில்” என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் “அமலேக்கியன்” என்பது ஒருமையில் இருந்தாலும், அது ஒரு மக்களினத்தையோ அவர்களுடன் தொடர்புடைய நிலப்பகுதியையோ கூட்டாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: இறந்தான்
  rationale: מות என்ற வினை மரணத்தை நேரடியாகக் குறிக்கிறது; மறைமுகமான மங்கலச் சொல்லைத் தவிர்த்து இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: עַבְדּוֹן
  choice: அப்தோன்
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்தல்.
- source_word: בֶּן הִלֵּל
  choice: இல்லேலின் மகன்
  rationale: בֶּן குறிக்கும் தந்தை–மகன் உறவை இயல்பான தமிழ் உடைமைத் தொடரால் வெளிப்படுத்துகிறது; הִלֵּל என்பது இல்லேல் என எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: הַפִּרְעָתוֹנִי
  choice: பிரத்தோன் ஊரான்
  rationale: குறிப்பிட்ட ஊரைச் சேர்ந்தவர் என்ற குடிப்பெயரின் பொருளை நவீன வாசகர்களுக்குத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டான்
  rationale: קבר என்பதன் நிஃபால் வடிவிலுள்ள செயப்பாட்டு பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: בְּפִרְעָתוֹן
  choice: பிரத்தோனில்
  rationale: இடப்பொருளுடைய בְּ முன்னொட்டை தமிழ் வேற்றுமை உருபால் தருகிறது; இடப்பெயர் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: בְּאֶרֶץ אֶפְרַיִם
  choice: எப்பிராயீம் நாட்டிலுள்ள
  rationale: אֶרֶץ என்ற வெளிப்படையான புவியியல் சொல்லை விடாமல், அடுத்த இடத்தொடருடன் இயல்பாக இணைக்கிறது.
- source_word: בְּהַר הָעֲמָלֵקִי
  choice: அமலேக்கியரின் மலைப்பகுதியில்
  rationale: הַר என்பது இங்கு தனி மலையைவிட மலைநாட்டுப் பகுதியைக் குறிக்க வாய்ப்புள்ளது; ஒருமை குடிப்பெயர் கூட்டு அல்லது நிலப்பெயர்சார் பொருளில் தமிழில் பன்மையாகத் தரப்பட்டுள்ளது.
