  yaml_path: translation/ot/judges/012/012.yaml
  text: Then Elon the Zebulunite died[a], and he was buried in Aijalon, in the land of Zebulun.
translation:
  language: ta
  text: பின்பு, செபுலோன் கோத்திரத்தைச் சேர்ந்த ஏலோன் இறந்தார்; அவர் செபுலோன் நாட்டிலுள்ள அயலோனில் அடக்கம் செய்யப்பட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: பின்பு ... இறந்தார்
  rationale: தொடர்கதை நிகழ்வைக் குறிக்கும் wayyiqtol வடிவத்தை இயல்பான நவீனத் தமிழில் வரிசைத் தொடர்ச்சியுடன் தருகிறது.
- source_word: אֵלוֹן
  choice: ஏலோன்
  rationale: தனிநபர் பெயர் எபிரெய ஒலிப்புக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: הַזְּבוּלֹנִי
  choice: செபுலோன் கோத்திரத்தைச் சேர்ந்த
  rationale: இவ்வினப்பெயர் ஏலோனின் கோத்திர அல்லது பிராந்தியச் சார்பைக் குறிக்கிறது; தமிழில் தெளிவாகவும் இயல்பாகவும் தரப்பட்டது.
- source_word: וַיִּקָּבֵר
  choice: அவர் ... அடக்கம் செய்யப்பட்டார்
  rationale: קבר என்பதன் நிஃபால் வடிவிலுள்ள செயப்பாட்டு பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בְּאַיָּלוֹן
  choice: அயலோனில்
  rationale: இடப்பெயர் எழுத்துப்பெயர்க்கப்பட்டு, בְ முன்னிடைச்சொல்லின் இடப்பொருள் '-இல்' எனத் தரப்பட்டது.
- source_word: בְּאֶרֶץ זְבוּלֻן
  choice: செபுலோன் நாட்டிலுள்ள
  rationale: אֶרֶץ இங்கு நிலம் அல்லது பிரதேசம் என்று பொருள்படும்; இடப்பெயரைத் தெளிவுபடுத்தும் இயல்பான தமிழ்த் தொடராக அமைக்கப்பட்டது.
