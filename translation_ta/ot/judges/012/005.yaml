base_translation:
  language: en
  yaml_path: translation/ot/judges/012/005.yaml
  text: And Gilead captured the fords of the Jordan against Ephraim. And whenever the fugitives of Ephraim said[a], “Let me cross over,” the men of Gilead would say to him, “Are you an Ephraimite?” If he said, “No,”
translation:
  language: ta
  text: கிலேயாத் மக்கள் எப்பிராயீமுக்கு எதிராக யோர்தானின் கடவுகளைக்[a] கைப்பற்றினர். எப்பிராயீமின் தப்பியோடியவர்கள், “நான் கடக்கட்டும்” என்று சொல்லும்போதெல்லாம், கிலேயாத் மக்கள் அவனிடம், “நீ எப்பிராயீமியரா?” என்று கேட்பார்கள். அவன், “இல்லை” என்று சொன்னால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடக்கும் இடங்கள்.” எபிரெயச் சொல் யோர்தான் ஆற்றைக் கடக்கப் பயன்பட்ட ஆழமற்ற கடவுகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: கைப்பற்றினார்கள்
  rationale: לכד என்பது இராணுவச் சூழலில் ஒரு முக்கிய இடத்தைக் கைப்பற்றி கட்டுப்பாட்டுக்குள் கொண்டுவருவதைக் குறிக்கிறது; தமிழில் இயல்பாகப் பன்மை எழுவாயுடன் வழங்கப்பட்டது.
- source_word: מַעְבְּרוֹת הַיַּרְדֵּן
  choice: யோர்தானின் ஆற்றுக் கடவுகள்
  rationale: מַעְבְּרוֹת என்பது ஆற்றை நடந்து அல்லது எளிதாகக் கடக்கக்கூடிய ஆழமற்ற கடக்கும் இடங்களைக் குறிக்கிறது. ‘ஆற்றுக் கடவுகள்’ இதைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: לְאֶפְרָיִם
  choice: எப்பிராயீமியர்களைத் தடுப்பதற்காக
  rationale: 'சூழலில் ל பகைமை அல்லது எதிர்நோக்கைக் குறிக்கிறது: எப்பிராயீமின் தப்பியோடுவோர் கடப்பதைத் தடுக்கவே கடவுகள் கைப்பற்றப்பட்டன. தமிழில் நோக்கம் வெளிப்படுமாறு மொழிபெயர்க்கப்பட்டது.'
- source_word: וְהָיָה כִּי
  choice: கேட்கும்போதெல்லாம்
  rationale: இந்தக் கட்டமைப்பு மீண்டும் மீண்டும் நடந்த நடைமுறையை அறிமுகப்படுத்துகிறது; ‘போதெல்லாம்’ அதன் தொடர்ச்சியான நிகழ்வுணர்வை இயல்பாகத் தருகிறது.
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: எப்பிராயீமிலிருந்து தப்பியோடிய ஒருவன்
  rationale: פָּלִיט் போரிலிருந்து தப்பிய ஒருவரைக் குறிக்கிறது. அடுத்துவரும் ஒருமைச் சுட்டுப்பெயர்களுக்கு ஏற்ப ஒவ்வொரு தப்பியோடியவனையும் குறிக்கும் பகிர்மான ஒருமை பயன்படுத்தப்பட்டது.
- source_word: אֶעֱבֹרָה
  choice: நான் அக்கரைக்குப் போகட்டும்
  rationale: முதலாம் நபர் cohortative அனுமதி கோரும் பொருளைக் கொண்டது. ஆற்றைக் கடக்கும் சூழலில் ‘அக்கரைக்குப் போகட்டும்’ என்பது இயல்பான தமிழ் வேண்டுகோள்.
- source_word: הַאֶפְרָתִי אַתָּה
  choice: நீ எப்பிராயீமியனா?
  rationale: இது கோத்திர அடையாளத்தைப் பற்றிய நேரடிக் கேள்வி; நவீன தமிழில் இயல்பான வினா வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וַיֹּאמֶר לֹא
  choice: அவன் “இல்லை” என்று சொன்னால்
  rationale: வடிவத்தில் தொடர்கதை வினையாக இருந்தாலும், மீளும் சோதனை நடைமுறையில் அடுத்த செயலுக்கான நிபந்தனையாகச் செயல்படுகிறது; ‘சொன்னால்’ அந்த உறவைத் தெளிவாக்குகிறது.
