translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘கிலேயாத்’ என்ற நிலப்பெயருக்குப் பதிலாக, எபிரெய எழுவாய் சூழலில் அங்குள்ள வீரர்களைக் குறிக்கும் ‘கிலேயாத்தியர்கள்’ பயன்படுத்தப்பட்டது. வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனை வாக்கியமாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டது.
