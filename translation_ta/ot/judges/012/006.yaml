  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. உச்சரிப்புச் சோதனையின் ஒலிவேறுபாட்டைத் தெளிவாக்க ‘ஷிப்போலெத்/சிப்போலெத்’ என ஒலிபெயர்க்கப்பட்டது; வன்முறையை மென்மைப்படுத்தாமல் שׁחט-ன் வலிமை பாதுகாக்கப்பட்டது.
