base_translation:
  language: en
  yaml_path: translation/ot/judges/012/006.yaml
  text: Then they said to him[a], “Please say ‘Shibboleth.’” But he said, “Sibboleth,” because he could not say it that way. So they seized him and slaughtered him at the fords of the Jordan. At that time forty-two thousand from Ephraim fell.
translation:
  language: ta
  text: அப்போது அவர்கள் அவனிடம்[a], “தயவுசெய்து ‘ஷிப்போலெத்’ என்று சொல்” என்றார்கள். ஆனால் அவன், “ஸிப்போலெத்” என்று சொன்னான்; ஏனெனில் அவனால் அதை அவ்வாறு சொல்ல முடியவில்லை. ஆகவே அவர்கள் அவனைப் பிடித்து, யோர்தானின் கடவுத்துறைகளில் அவனை வெட்டிக் கொன்றார்கள். அந்தக் காலத்தில் எப்பிராயீமைச் சேர்ந்த நாற்பத்திரண்டாயிரம் பேர் வீழ்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஷிப்போலெத்’ என்ற எபிரேயச் சொல்லுக்கு ‘தானியக்கதிர்’ அல்லது ‘நீரோடை/வெள்ளம்’ என்று பொருள் இருக்கலாம்; ஆனால் இங்கு அது உச்சரிப்பைச் சோதிக்கும் சொல்லாகப் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמָר נָא
  choice: தயவுசெய்து … என்று சொல்
  rationale: கட்டளையுடன் வரும் נָא-வின் வேண்டுகோள்/மென்மையான தொனியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: שִׁבֹּלֶת
  choice: ஷிப்போலெத்
  rationale: இங்கு சொல்லின் பொருளைவிட அதன் உச்சரிப்பே சோதனையாகப் பயன்படுவதால் ஒலிபெயர்ப்பு செய்யப்பட்டது; சாத்தியமான பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: סִבֹּלֶת
  choice: சிப்போலெத்
  rationale: தொடக்கத்திலுள்ள ‘ஷ்’–‘ச்/ஸ்’ உச்சரிப்பு வேறுபாடே நிகழ்ச்சியின் மையம்; தமிழில் கேட்கக்கூடிய வேறுபாட்டை ஒலிபெயர்ப்பு பாதுகாக்கிறது.
- source_word: וְלֹא יָכִין לְדַבֵּר כֵּן
  choice: அவனால் அதை அவ்வாறு சொல்ல முடியவில்லை
  rationale: ‘அவ்வாறு பேசுவதற்குத் தன்னை ஆயத்தப்படுத்த/நெறிப்படுத்த முடியவில்லை’ என்ற எபிரெய மொழிவழக்கை, குறிப்பிட்ட உச்சரிப்பை உருவாக்க இயலாமை என்ற சூழல்சார் பொருளுடன், மூலத்தின் ‘சொல்ல’ என்ற பொதுவடிவத்தையும் காக்கும் வகையில் மொழிபெயர்க்கிறது.
- source_word: וַיֹּאחֲזוּ אֹתוֹ
  choice: அவனைப் பிடித்து
  rationale: אחז என்பதன் ‘பற்றிக்கொள்/பிடி’ என்ற வலிமையான பொருளையும் உடனடி கைது நடவடிக்கையையும் இயல்பாகத் தருகிறது.
- source_word: וַיִּשְׁחָטוּהוּ
  choice: அவனை வெட்டிக் கொன்றார்கள்
  rationale: שׁחט என்பது பொதுவான ‘கொல்’ என்பதைக் காட்டிலும் அறுத்தல்/வெட்டிக் கொல்லுதல் என்ற கடுமையான வினை; அதன் கொடூரத்தைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֶל מַעְבְּרוֹת הַיַּרְדֵּן
  choice: யோர்தானின் கடவுத்துறைகளில்
  rationale: מַעְבְּרוֹת என்பது ஆற்றைக் கடக்கக்கூடிய ஆழம் குறைந்த இடங்களைக் குறிக்கிறது; ‘கடவுத்துறை’ துல்லியமான தமிழ்ச் சொல்.
- source_word: וַיִּפֹּל ... מֵאֶפְרַיִם
  choice: எப்பிராயீமைச் சேர்ந்த … பேர் வீழ்ந்தார்கள்
  rationale: போர்ச் சூழலில் נפל என்பது இறந்ததைச் சுட்டும் ‘வீழ்தல்’; שבט/மக்கள் சார்பை ‘எப்பிராயீமைச் சேர்ந்த’ என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַרְבָּעִים וּשְׁנַיִם אָלֶף
  choice: நாற்பத்திரண்டாயிரம்
  rationale: மூல எண்ணிக்கையை அப்படியே துல்லியமாகப் பாதுகாக்கிறது.
