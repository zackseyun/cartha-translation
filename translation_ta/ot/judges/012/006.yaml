    issue: The test-word response is transliterated as «சிப்போலெத்».
    rationale: The narrative hinges on the contrast between Hebrew /ʃ/ in שִׁבֹּלֶת and /s/ in סִבֹּלֶת. In Tamil, «ச» most naturally represents /c/ rather than /s/. «ஸிப்போலெத்» clearly preserves the /s/ pronunciation and prevents the contrast from becoming /sh/ versus /ch/.
