translation:
  language: ta
  text: பின்பு இப்சான் இறந்து பெத்லகேமில் அடக்கம் செய்யப்பட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: பின்பு ... இறந்து
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது. நவீன தமிழில் இயல்பான நிகழ்வுத் தொடரைத் தெரிவிக்க ‘பின்பு’ பயன்படுத்தப்பட்டது; מוּת என்ற வினையின் பொருள் ‘இறத்தல்’.
- source_word: אִבְצָן
  choice: இப்சான்
  rationale: எபிரேயத் தனிப்பெயரின் ஒலியமைப்பை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டார்
  rationale: קבר என்பதன் நிஃபால் வடிவம் இங்கு செயப்பாட்டு பொருளில் உள்ளது. ‘அடக்கம் செய்யப்பட்டார்’ என்பது மரியாதையும் தெளிவும் கொண்ட இயல்பான தமிழாக்கம்.
- source_word: בְּבֵית לָחֶם
  choice: பெத்லெகேமில்
  rationale: בְּ முன்னொட்டு இடத்தைக் குறிக்கிறது; அதனை ‘-இல்’ வேற்றுமை உருபால் மொழிபெயர்த்தோம். இடப்பெயர் தமிழ் வேதாகம வழக்கில் அறியப்பட்ட வடிவில் எழுத்துப்பெயர்க்கப்பட்டது.
