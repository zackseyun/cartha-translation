source:
  edition: WLC
  text: וּ/בְ/הֵעָל֤וֹת הֶֽ/עָנָן֙ מֵ/עַ֣ל הַ/מִּשְׁכָּ֔ן יִסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/כֹ֖ל מַסְעֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/036.yaml
  text: Whenever the cloud was taken up from over the tabernacle[a], the sons of Israel would set out in all their journeys.
translation:
  language: ta
  text: மேகம் திருவாசஸ்தலத்தின்மேலிருந்து எழும்பியபோதெல்லாம், இஸ்ரவேலின் மக்கள்[a] தங்கள் பயணங்கள் அனைத்திலும் புறப்பட்டுச் செல்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “இஸ்ரவேலின் மகன்கள்”; அதாவது இஸ்ரவேலர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהֵעָלֹת
  choice: எழும்பியபோதெல்லாம்
  rationale: בְּ + infinitive construct காலச் சூழலைக் குறிக்கிறது; தொடர்ச்சியாக நிகழ்ந்த வழக்கத்தைச் சூழல் காட்டுவதால் “போதெல்லாம்” பொருத்தமானது. עלה என்பதன் இயல்பான எழுதல்/மேலே செல்லுதல் என்ற பொருளும் காக்கப்படுகிறது.
- source_word: הֶעָנָן
  choice: மேகம்
  rationale: முந்தைய சூழலில் நிறுவப்பட்ட இறைப் பிரசன்னத்தோடு தொடர்புடைய குறிப்பிட்ட மேகத்தைக் குறிக்கிறது.
- source_word: מֵעַל הַמִּשְׁכָּן
  choice: திருவாசஸ்தலத்தின்மேலிருந்து
  rationale: מֵעַל என்பது மேலிருந்த நிலையிலிருந்து விலகும் இயக்கத்தைக் குறிக்கிறது. מִשְׁכָּן என்பது இங்கு எடுத்துச் செல்லக்கூடிய பரிசுத்த வாசஸ்தலம்; நவீன தமிழில் புரியக்கூடிய, மதிப்புமிக்க சொல்லாக “திருவாசஸ்தலம்” தேர்ந்தெடுக்கப்பட்டது.
- source_word: יִסְעוּ
  choice: புறப்பட்டுச் செல்வார்கள்
  rationale: נסע இங்கு முகாமிலிருந்து பயணத்திற்குப் புறப்படுவதைக் குறிக்கிறது; imperfect வடிவத்தின் வழக்கமான, மீள்நிகழும் தன்மையை “செல்வார்கள்” வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்கு சொல் “இஸ்ரவேலின் மகன்கள்” என்றாலும், இது முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கும் நிலையான கூட்டுப் பெயர். “மக்கள்” அந்தக் கூட்டுப் பொருளை இயல்பான தமிழில் தருகிறது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּכֹל מַסְעֵיהֶם
  choice: தங்கள் பயணங்கள் அனைத்திலும்
  rationale: அவர்களுடைய எல்லாப் பயணக் கட்டங்களிலும் இதுவே நடைமுறையாக இருந்தது என்ற பகிர்வுப் பொருளை நெருக்கமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற கூட்டுச் சமூகப் பெயர்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடர் இலக்கண ரீதியாக ஆண்பால் பன்மையாக இருந்தாலும், இங்கு அது முழு உடன்படிக்கைச் சமூகத்தையும் பிரதிநிதித்துவமாகக் குறிக்கிறது. தமிழில் “மக்கள்” என மொழிபெயர்ப்பது உள்ளடக்கத்தைப் பாலின வரம்பின்றி தெளிவாக்குகிறது; மூலத்தின் நேரடி வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. “திருவாசஸ்தலம்” என்பது மִשְׁכָּן என்பதன் வாசமிருக்கும் பரிசுத்த இடம் என்ற கருத்தையும், யாத்திராகமச் சூழலின் எடுத்துச் செல்லக்கூடிய வழிபாட்டிடத்தையும் சுருக்கமாகக் குறிக்கிறது.
