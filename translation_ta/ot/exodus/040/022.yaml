translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தில் வினையின் எழுவாய் பெயரால் மீண்டும் குறிப்பிடப்படாததால் ‘அவர்’ என்று வைத்துப் பின்னணியிலுள்ள எழுவாயைத் தொடர்கிறது. இடவமைப்பு தெளிவாக இருக்க இயல்பான தமிழ் சொல்வரிசை பயன்படுத்தப்பட்டுள்ளது.
