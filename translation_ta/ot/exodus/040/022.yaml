  text: He put the table in the tent of meeting[a], on the north side of the tabernacle, outside the veil.
translation:
  language: ta
  text: அவர் மேசையைச் சந்திப்புக்கூடாரத்திற்குள், வாசஸ்தலத்தின் வடக்குப் பக்கத்தில், மறைப்புத் திரைக்கு வெளியே வைத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திரைக்கு வெளியே.’ எபிரெயச் சொல் மகா பரிசுத்தமான இடத்தைப் பிரித்த உள்திரையைக் குறிக்கிறது.
    reason: פָּרֹכֶת என்பதற்கான ‘திரை’ என்ற மாற்று மொழிபெயர்ப்பையும், அதன் கட்டிடவியல் குறிப்பையும் சுருக்கமாகத் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: வைத்தார்
  rationale: נתן என்பதற்கு ‘கொடு/வை/அமை’ என்ற பொருள்கள் உண்டு; பொருட்களை இடத்தில் அமைக்கும் இச்சூழலில் ‘வைத்தார்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַשֻּׁלְחָן
  choice: மேசையை
  rationale: மூலத்தில் குறிப்பிட்ட மேசை மட்டுமே சொல்லப்படுகிறது; அதன் பயன்பாட்டை விளக்கும் கூடுதல் பெயரை வசனத்திற்குள் சேர்க்கவில்லை.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்திற்குள்
  rationale: אֹהֶל מוֹעֵד என்ற பரிசுத்த இடத்துக்கான நிலையான பெயரின் பொருளைத் தெளிவாகக் காட்டுகிறது; בְּ என்பதன் உள்ளிடப் பொருளையும் ‘க்குள்’ வெளிப்படுத்துகிறது.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן צָפֹנָה
  choice: திருவாசஸ்தலத்தின் வடக்குப் பக்கத்தில்
  rationale: יֶרֶךְ என்பதன் ‘பக்கம்/ஓரம்’ என்ற இடப்பொருளையும், צָפֹנָה குறிக்கும் வடதிசை அமைவையும் இயல்பான தமிழில் தருகிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: מִשְׁכָּן என்பதன் ‘வாசமிருக்கும் இடம்’ என்ற அடிப்படைப் பொருளையும், யாத்திராகமத்தில் அது குறிக்கும் பரிசுத்தக் கூடாரத்தையும் சுருக்கமாக அடையாளப்படுத்துகிறது.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: மறைப்புத் திரைக்கு வெளியே
  rationale: מִחוּץ என்பது இடரீதியாக ‘வெளியே’ என்பதையும், פָּרֹכֶת என்பது மகா பரிசுத்த இடத்தை மறைத்துப் பிரித்த உள்திரை என்பதையும் தெரிவிக்கிறது.
