base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/004.yaml
  text: Then you shall bring in the table and arrange what belongs on it[a], and you shall bring in the lampstand and set up its lamps.
translation:
  language: ta
  text: பின்பு மேசையை உள்ளே கொண்டுவந்து, அதற்குரியவற்றை அதன்மேல் ஒழுங்குபடுத்து. விளக்குத்தண்டையும் உள்ளே கொண்டுவந்து, அதன் விளக்குகளைப் பொருத்திவை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் விளக்குகளை ஏற்றிவை.” எபிரெய வினை சொற்படியாக “மேலெழச் செய்” என்று பொருள்படும்; அது விளக்குகளைப் பொருத்தி அமைப்பதையோ அவற்றின் சுடர்களை எழச் செய்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: உள்ளே கொண்டுவந்து
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் இங்கு பொருட்களைக் கூடாரத்திற்குள் கொண்டுவருவதைக் குறிக்கிறது. தமிழில் ‘உள்ளே கொண்டுவந்து’ என்பது சூழலில் உள்ள திசையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַשֻּׁלְחָן
  choice: மேசையை
  rationale: எபிரெயச் சொல் பொதுவாக ‘மேசை’ என்றே பொருள்படும். அதன் வழிபாட்டுப் பயன்பாடு சூழலால் தெரிந்தாலும், இவ்வசனத்தில் நேரடியாகக் கூறப்படாத விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- source_word: וְעָרַכְתָּ אֶת עֶרְכּוֹ
  choice: அதற்குரியவற்றை அதன்மேல் ஒழுங்குபடுத்து
  rationale: ערך என்ற வினையும் அதனுடன் தொடர்புடைய பெயர்ச்சொல்லும் சொற்படியாக ‘அதன் ஒழுங்கை ஒழுங்குபடுத்து’ என வரும். மேசையின்மேல் முறைப்படி வைக்கப்பட வேண்டியவற்றைக் குறிக்கும் இந்தச் சொல்லிணைப்பை இயல்பான தமிழில் இவ்வாறு வழங்குகிறது.
- source_word: הַמְּנֹרָה
  choice: விளக்குத்தண்டை
  rationale: מְנוֹרָה என்பது பல விளக்குகளைத் தாங்கும் விளக்குத்தண்டைக் குறிக்கிறது. ஒலிபெயர்ப்பைவிட அதன் பொருளைத் தெளிவாகத் தரும் பொதுத் தமிழ்ச்சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְהַעֲלֵיתָ
  choice: ஏற்றிவை
  rationale: עלה என்பதன் ஹிஃபில் வடிவம் சொற்படியாக ‘மேலெழச் செய்’ என்று பொருள்பட்டு, விளக்குகளுடன் வரும்போது அவற்றை எரியச் செய்தல் அல்லது அவற்றை நிறுவுதல் என்ற நுணுக்கத்தைத் தரலாம். தமிழில் ‘விளக்குகளை ஏற்றிவை’ என்பது தீப்பற்றச் செய்வதை இயல்பாகக் குறிக்கிறது; நிறுவும் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: נֵרֹתֶיהָ
  choice: அதன் விளக்குகளை
  rationale: נֵר என்பது விளக்கு அல்லது அதன் சுடரைக் குறிக்கலாம். இங்கு விளக்குத்தண்டில் உள்ள தனித்தனி விளக்குகளைக் குறிக்கும் ‘அதன் விளக்குகள்’ இயல்பான தேர்வு.
