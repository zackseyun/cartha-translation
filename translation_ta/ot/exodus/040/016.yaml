  text: וַ/יַּ֖עַשׂ מֹשֶׁ֑ה כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ כֵּ֥ן עָשָֽׂה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/016.yaml
  text: And Moses did according to all that Yahweh commanded him[a]; so he did.
translation:
  language: ta
  text: யாவே[a] தமக்குக் கட்டளையிட்ட எல்லாவற்றின்படியும் மோசே செய்தார்; அப்படியே அவர் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “YHWH” (יהוה); பொதுவாக “யாவே” என ஒலிக்கப்படுகிறது; பாரம்பரியமாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: திருநாமத்தின் எபிரெய மூலவடிவத்தையும் பாரம்பரிய மாற்று மொழிபெயர்ப்பையும் தெளிவுபடுத்துதல்.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தார்
  rationale: עשה என்பது ‘செய்/உருவாக்கு’ என்ற பரந்த பொருளுடையது. இங்கு கட்டளைக்குக் கீழ்ப்படிந்து செயல்பட்டதைக் குறிப்பதால் ‘செய்தார்’ பொருத்தமானது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: כְּכֹל
  choice: எல்லாவற்றின்படியும்
  rationale: כ + כל, கட்டளையிடப்பட்ட அனைத்துக்கும் முழுமையாக ஒத்துச் செயல்பட்டதை வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר
  choice: —
  rationale: தமிழில் தொடர்பெச்ச அமைப்பான ‘கட்டளையிட்ட’ என்பதற்குள் இயல்பாக வெளிப்படுகிறது; தனிச் சொல்லாக மொழிபெயர்க்கப்படவில்லை.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: எபிரெய எளிய நிறைவேற்ற வினையை இயல்பான தமிழ்த் தொடர்பெச்சமாக வழங்குகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கும், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு.
- source_word: אֹתוֹ
  choice: தனக்கு
  rationale: கட்டளையின் பெறுநர் மோசே என்பதைத் தமிழில் இயல்பாகக் காட்டும் வேற்றுமை வடிவம்.
- source_word: כֵּן
  choice: அப்படியே
  rationale: கட்டளைக்கும் மோசேயின் செயலுக்கும் இருந்த துல்லியமான ஒற்றுமையை வலியுறுத்துகிறது.
- source_word: עָשָׂה
  choice: அவர் செய்தார்
  rationale: மூலத்தில் வினை மீண்டும் வருவதால் உருவாகும் கீழ்ப்படிதலின் வலியுறுத்தலைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் ஒரு பட்டப்பெயர் அல்ல, நான்கெழுத்துத் திருநாமமே உள்ளது. ‘யெகோவா’ அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கும் தமிழில் பரவலாக அறியப்பட்ட வடிவம்; மாற்று ஒலிப்பை அடிக்குறிப்பு குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதை ஒருமையுடன், மூலத்தின் இருமுறை வரும் ‘செய்தார்’ என்ற வலியுறுத்தலைப் பாதுகாக்கும் சீரிய நடை.
