revisions:
- from: பின்பு அவர் கூடாரத்தைத் திருவாசஸ்தலத்தின்மேல் விரித்து, கூடாரத்தின் மூடுதிரையை அதன்மேல் மேலிருந்து வைத்தார். யாவே மோசேக்குக் கட்டளையிட்டபடியே அவர் செய்தார்.
  to: பின்பு அவர் கூடாரத்தைத் திருவாசஸ்தலத்தின் மேல் விரித்து, கூடாரத்தின் மூடுதலை அதன் மேல் மேலிருந்து வைத்தார்; யாவே மோசேக்குக் கட்டளையிட்டபடியே.
  rationale: The revision removes the unsupported explicit verb “அவர் செய்தார்” and makes the final obedience formula modify the actions already described. It also uses the neutral term “மூடுதல்” for the tent’s covering, while retaining the established distinctions among the tent, the sacred dwelling, and the outer covering.
