base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/019.yaml
  text: Then he spread the tent over the tabernacle and put the covering of the tent over it from above, just as Yahweh had commanded Moses.
translation:
  language: ta
  text: பின்பு அவர் கூடாரத்தைத் திருவாசஸ்தலத்தின் மேல் விரித்து, கூடாரத்தின் மூடுதலை அதன் மேல் மேலிருந்து வைத்தார்; யாவே மோசேக்குக் கட்டளையிட்டபடியே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹשׂ
  choice: விரித்து
  rationale: פרשׂ என்பது ஒரு மூடுதலை விரித்துப் பரப்புவதைக் குறிக்கிறது; இங்கு கூடாரத் துணியைத் திருவாசஸ்தலத்தின்மேல் விரித்த செயலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הָאֹהֶל
  choice: கூடாரத்தை
  rationale: אֹהֶל என்பதன் அடிப்படைப் பொருள் ‘கூடாரம்’; பின்னர் வரும் מִכְסֶה என்ற ‘மூடுதிரை’யிலிருந்து இதன் சொற்பொருள் வேறுபாட்டைப் பேணுகிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலத்தின்மேல்
  rationale: מִשְׁכָּן என்பது ‘வாசஸ்தலம்’ என்ற பொருளுடையது; யாத்திராகமச் சூழலில் தேவனுடைய பரிசுத்த உறைவிடத்தைத் தெளிவாகக் குறிக்க ‘திருவாசஸ்தலம்’ இயல்பான, கண்ணியமான தமிழ்ச் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיָּשֶׂם
  choice: வைத்தார்
  rationale: שׂים என்ற பொதுவினை ‘வை, அமை’ என்று பொருள்படும்; இச்செயலுக்கு ‘வைத்தார்’ நேரடியான நவீனத் தமிழ்.
- source_word: מִכְסֵה הָאֹהֶל
  choice: கூடாரத்தின் மூடுதிரையை
  rationale: מִכְסֶה என்பது மூடுவதற்கான பொருளைக் குறிக்கிறது. ‘மூடுதிரை’ என்பது கூடாரத்திலிருந்து வேறான அதன் வெளிப்புற மூடுதலைத் தெளிவாகக் காட்டுகிறது.
- source_word: עָלָיו
  choice: அதன்மேல்
  rationale: இந்தப் பதிலிப்பெயர் முன் குறிப்பிடப்பட்ட கூடார/திருவாசஸ்தல அமைப்பைக் குறிக்கிறது; ‘அதன்மேல்’ இடவுறவைச் சுருக்கமாகத் தருகிறது.
- source_word: מִלְמָעְלָה
  choice: மேலிருந்து
  rationale: இச்சொல் நேரடியாக ‘மேலிருந்து’ என்று பொருள்படுகிறது; மூடுதிரை அமைப்பின் உச்சிப்பகுதியில் வைக்கப்பட்டதை எபிரெயச் சொல்லமைப்புக்கு நெருக்கமாகப் பேணுகிறது.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: யாவே மோசேக்குக் கட்டளையிட்டபடியே அவர் செய்தார்
  rationale: כַּאֲשֶׁר கட்டளைக்கும் செயலுக்கும் உள்ள துல்லிய ஒத்திசைவை ‘கட்டளையிட்டபடியே’ எனக் காட்டுகிறது. எபிரெயத்தில் இறுதி வினை வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் முழுமையான இயல்பான வாக்கியத்திற்காக ‘அவர் செய்தார்’ சேர்க்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பேணுகிறது; ‘யாவே’ என்பது நவீன தமிழில் வாசிக்க ஏற்ற வடிவம்.
- issue: מִשְׁכָּן என்பதன் தமிழாக்கம்
  choice: திருவாசஸ்தலம்
  alternative: வாசஸ்தலம் / திருக்கூடாரம்
  rationale: ‘வாசஸ்தலம்’ மூலச்சொல்லின் உறைவிடப் பொருளைப் பேணுகிறது; ‘திரு-’ இச்சூழலின் பரிசுத்தத் தன்மையைத் தெளிவாக்குகிறது. அதேவேளை אֹהֶל என்பதற்குப் பயன்படுத்திய ‘கூடாரம்’ என்பதுடன் உள்ள சொல்வேறுபாடும் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. אֹהֶל (‘கூடாரம்’), מִשְׁכָּן (‘திருவாசஸ்தலம்’), מִכְסֶה (‘மூடுதிரை’) ஆகிய கட்டுமான அடுக்குகளின் சொல்வேறுபாடு பேணப்பட்டுள்ளது. அடிக்குறிப்புகள் தேவையில்லை.
