  text: And you shall place the basin between the tent of meeting and the altar[a], and you shall put water there.
translation:
  language: ta
  text: சந்திப்புக் கூடாரத்திற்கும் பலிபீடத்திற்கும் நடுவில் கழுவும் தொட்டியை[a] வைத்து, அதில் தண்ணீர் ஊற்ற வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் வழிபாட்டில் கழுவுவதற்குப் பயன்படுத்தப்பட்ட தொட்டியைக் குறிக்கிறது; சில பாரம்பரிய மொழிபெயர்ப்புகள் இதை ‘லாவர்’ என்று மொழிபெயர்க்கின்றன.
