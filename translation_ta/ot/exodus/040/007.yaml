lexical_decisions:
- source_word: וְנָתַתָּ
  choice: வைத்து
  rationale: נתן என்பது ‘கொடு, வை, அமை’ எனப் பரந்த பொருளுடையது. வழிபாட்டுப் பொருளை ஒரு குறிப்பிட்ட இடத்தில் அமைக்கும் இக்கட்டளையில் ‘வைத்து’ என்பது இயல்பாகவும் மூலத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: הַכִּיֹּר
  choice: கழுவும் தொட்டியை
  rationale: כִּיּוֹר என்பது திருக்கூடாரப் பணியில் கழுவுவதற்குப் பயன்படுத்தப்பட்ட நீர்த்தொட்டியைக் குறிக்கிறது. ‘கழுவும் தொட்டி’ அதன் பயன்பாட்டைத் தெளிவாகச் சொல்லும் நவீன, எளிய தமிழாக்கம்.
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: சந்திப்புக் கூடாரத்துக்கும் பலிபீடத்துக்கும் நடுவில்
  rationale: בֵּין...וּבֵין இரண்டு பொருட்களுக்கு இடைப்பட்ட இடத்தைக் குறிக்கிறது. אֹהֶל מוֹעֵד என்பதற்கு ‘சந்திப்புக் கூடாரம்’ என்பது பொருளை வெளிப்படையாகக் காட்டுகிறது.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: מִזְבֵּחַ என்பதற்கான இயல்பான தமிழ் இணை ‘பலிபீடம்’. இவ்வசனம் எந்த வகைப் பலிபீடம் என்று மேலும் குறிப்பிடாததால் பொதுவான சொல்லே வைக்கப்பட்டுள்ளது.
- source_word: וְנָתַתָּ שָׁם מָיִם
  choice: அதில் தண்ணீர் ஊற்ற வேண்டும்
  rationale: எபிரெய உரை சொற்சொல்லாக ‘அங்கே தண்ணீரை வை’ என்கிறது; ‘அங்கே’ என்பது முன் சொல்லப்பட்ட தொட்டியின் இடத்தைக் குறிக்கிறது. தமிழில் ஒரு தொட்டிக்குள் தண்ணீரை இடுவதைக் கூற ‘அதில் தண்ணீர் ஊற்ற வேண்டும்’ என்பது தெளிவும் இயல்பும் உடையது.
