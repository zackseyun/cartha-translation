source:
  edition: WLC
  text: וַ/יִּקַּ֞ח וַ/יִּתֵּ֤ן אֶת הָ/עֵדֻת֙ אֶל הָ֣/אָרֹ֔ן וַ/יָּ֥שֶׂם אֶת הַ/בַּדִּ֖ים עַל הָ/אָרֹ֑ן וַ/יִּתֵּ֧ן אֶת הַ/כַּפֹּ֛רֶת עַל הָ/אָרֹ֖ן מִ/לְ/מָֽעְלָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/020.yaml
  text: Then he took the testimony and put it into the ark[a], and he set the poles on the ark[b], and he placed the mercy seat on the ark above.
translation:
  language: ta
  text: பின்பு அவன் சாட்சியத்தை[a] எடுத்து பேழைக்குள் வைத்தான்; தண்டுகளைப் பேழையில் பொருத்தினான்; பாவநிவாரண மூடியை[b] பேழையின் மேல் வைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சாட்சியப் பலகைகளை.’ எபிரெயத்தில் ‘சாட்சியம்’ என்பது பேழைக்குள் வைக்கப்பட்டதை இங்கு குறிக்கும் வழிபாட்டுச் சிறப்புச் சொல்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கிருபாசனத்தை.’ இது பேழையின் மேலிருந்த பாவநிவாரண மூடியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדֻת
  choice: சாட்சியம்
  rationale: עֵדוּת என்பதன் அடிப்படைப் பொருளான ‘சாட்சியம்’ என்பதையும், பேழைக்குள் வைக்கப்பட்ட உடன்படிக்கைச் சாட்சியைக் குறிக்கும் அதன் தொழில்நுட்பப் பயன்பாட்டையும் பாதுகாக்கிறது; அது கற்பலகைகளையே குறிக்கலாம் என்றாலும் மூலவசனம் அவற்றை நேரடியாகப் பெயரிடவில்லை.
- source_word: הָאָרֹן
  choice: பேழை
  rationale: אָרוֹן இச்சூழலில் திருக்கூடாரத்தின் பரிசுத்தப் பேழையைக் குறிக்கிறது. மூலத்தில் இவ்வசனத்தில் இல்லாத ‘உடன்படிக்கை’ என்ற சொல்லைச் சேர்க்காமல், இயல்பான வேதாகமத் தமிழில் குறிப்பிட்ட பொருளை அடையாளப்படுத்துகிறது.
- source_word: הַבַּדִּים
  choice: தண்டுகள்
  rationale: பேழையைச் சுமப்பதற்குப் பயன்படுத்தப்பட்ட நீண்ட தண்டுகளைக் குறிக்கும் தெளிவான, நவீனத் தமிழ்ச் சொல்.
- source_word: הַכַּפֹּרֶת
  choice: பாவநிவாரண மூடி
  rationale: כַּפֹּרֶת என்பது பேழையின் மேல் வைக்கப்பட்ட குறிப்பிட்ட பொன் மூடி; அது பாவநிவாரணச் சடங்கோடு தொடர்புடையது. ‘பாவநிவாரண மூடி’ அதன் வடிவத்தையும் வழிபாட்டுச் சிறப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִלְמָעְלָה
  choice: பேழையின் மேல்
  rationale: இந்த இடத்தைக் குறிக்கும் சொற்றொடர் மூடி பேழையின் மேல்புறத்தில் வைக்கப்பட்டதைச் சொல்கிறது; தமிழில் ‘பேழையின் மேல்’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַיִּתֵּן ... אֶל
  choice: எடுத்து பேழைக்குள் வைத்தான்
  rationale: נתן ... אֶל இங்கு ஒரு பொருளை உள்ளே வைப்பதைக் குறிக்கிறது; ‘பேழைக்குள் வைத்தான்’ அந்த இயக்கத்தையும் முடிவிடத்தையும் தெளிவாக்குகிறது.
- source_word: וַיָּשֶׂם ... עַל
  choice: பேழையில் பொருத்தி
  rationale: தண்டுகளைப் பேழையின் உரிய இடங்களில் அமைத்த செயலை இயல்பான தமிழில் கூறுகிறது; வெறுமனே மேலே கிடத்தினார் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: ‘சாட்சியம்’ என்பதன் குறிப்பு
  choice: பேழைக்குள் வைக்கப்பட்ட உடன்படிக்கைச் சாட்சியைக் குறிக்கும் வழிபாட்டுச் சிறப்புச் சொல்லாக மொழிபெயர்த்தல்
  alternative: ‘சாட்சிப் பலகைகள்’ அல்லது ‘உடன்படிக்கைப் பலகைகள்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: செயல் ஒரு பொருளை பேழைக்குள் வைப்பதால் குறிப்பு திண்மையான ஒன்றாகவும், பெரும்பாலும் கற்பலகைகளாகவும் உள்ளது. எனினும் எபிரெயம் பலகைகளை நேரடியாகப் பெயரிடாமல் עֵדוּת என்ற சொல்லையே பயன்படுத்துவதால் அந்தத் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
- issue: כַּפֹּרֶת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரண மூடி
  alternative: கிருபாசனம்; மூடி
  rationale: இது பேழையின் மேலுள்ள குறிப்பிட்ட வழிபாட்டுப் பொருளைக் குறிக்கிறது. ‘பாவநிவாரண மூடி’ அதன் பொருட்சார்ந்த வடிவத்தையும் பாவநிவாரணத் தொடர்பையும் வெளிப்படுத்துகிறது; வெறும் ‘மூடி’ அதன் வழிபாட்டுச் சிறப்பை இழக்கச் செய்யும், ‘கிருபாசனம்’ வடிவத்தைத் தெளிவாகக் காட்டாது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் வழிபாட்டு நிகழ்வுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவன்’ என்பது உடனடிச் சூழலில் மோசேயைக் குறிக்கிறது. இணைந்த செயல்களைத் தெளிவாகக் காட்ட அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
