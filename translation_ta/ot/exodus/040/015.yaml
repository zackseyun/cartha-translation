base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/015.yaml
  text: You shall anoint them just as you anointed their father[a], so that they may serve as priests to me. And their anointing shall be for them an everlasting priesthood throughout their generations.
translation:
  language: ta
  text: அவர்களுடைய தந்தையை நீ அபிஷேகம் செய்ததுபோலவே அவர்களையும் அபிஷேகம் செய்; அதனால் அவர்கள் எனக்கு ஆசாரியர்களாகப் பணியாற்றுவார்கள். அவர்களுடைய அபிஷேகம், அவர்களுடைய தலைமுறைகள்தோறும் அவர்களுக்கு என்றென்றும் நிலைக்கும் ஆசாரியத்துவமாக அமையும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தொடர்ந்து நிலைக்கும் ஆசாரியத்துவம்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல், உடன்படிக்கைச் சூழலில் தலைமுறைகள்தோறும் நீடிக்கும் தொடர்ச்சியைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: அபிஷேகம் செய்
  rationale: அறிவுறுத்தல் தொடரில் வரும் வினை வடிவத்தின் கட்டளைத் தன்மையை இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר מָשַׁחְתָּ אֶת אֲבִיהֶם
  choice: அவர்களுடைய தந்தையை நீ அபிஷேகம் செய்ததுபோலவே
  rationale: כַּאֲשֶׁר குறிக்கும் நெருங்கிய ஒப்புமையையும், முன்பு ஆரோனுக்கு செய்யப்பட்ட அபிஷேகத்தையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְכִהֲנוּ לִי
  choice: அவர்கள் எனக்கு ஆசாரியர்களாகப் பணிசெய்வார்கள்
  rationale: כהן என்ற வினை ஆசாரியராகச் செயல்படுதல் அல்லது பணிசெய்தல் என்பதைக் குறிக்கிறது; לִי என்பதன் ‘எனக்கு’ என்ற உறவையும் அப்படியே காக்கிறது.
- source_word: מָשְׁחָתָם
  choice: அவர்களுடைய அபிஷேகம்
  rationale: இங்கு எண்ணெய் என்று வெளிப்படையாகச் சொல்லப்படாததால் ‘அபிஷேக எண்ணெய்’ என்று விரிவுபடுத்தாமல், அபிஷேகச் செயலும் அதனால் உண்டாகும் அர்ப்பணிப்பும் திறந்த நிலையில் வைக்கப்படுகின்றன.
- source_word: לִכְהֻנַּת עוֹלָם
  choice: என்றென்றும் நிலைக்கும் ஆசாரியத்துவமாக
  rationale: כְּהֻנָּה என்பது ஆசாரியத்துவத்தையும் עוֹלָם உடன்படிக்கைச் சூழலில் நீடித்த தொடர்ச்சியையும் குறிக்கிறது. இத்தமிழாக்கம் அதன் வலிமையைப் பாதுகாக்கிறது.
- source_word: לְדֹרֹתָם
  choice: அவர்களுடைய தலைமுறைகள்தோறும்
  rationale: ஆரோனின் சந்ததியில் அடுத்தடுத்த தலைமுறைகளுக்குத் தொடர்வதை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ஆசாரியத்துவத்தின் காலநீளத்தைக் குறிக்கும் עוֹלָם
  choice: என்றென்றும் நிலைக்கும் ஆசாரியத்துவம்
  alternative: தொடர்ந்து நிலைக்கும் ஆசாரியத்துவம்
  rationale: עולם என்ற சொல் வலுவான நீடித்த தன்மையைக் குறிக்கிறது; உடன்படிக்கைச் சூழலில் அது தலைமுறைகளைக் கடந்த தொடர்ச்சியையும் குறிக்கலாம். முதன்மை உரை அதன் முழு வலிமையை வைத்திருக்கிறது; அடிக்குறிப்பு சூழல்சார் நுணுக்கத்தைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘அபிஷேகம்’, ‘ஆசாரியத்துவம்’ ஆகியவை இச்சடங்கு மற்றும் பதவிசார் சூழலுக்கு ஏற்ற, பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன. அடிக்குறிப்பு குறி அது விளக்கும் ‘என்றென்றும் நிலைக்கும் ஆசாரியத்துவம்’ என்ற தொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
