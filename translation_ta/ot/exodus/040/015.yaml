    issue: Temporal connector “அப்போது”
    rationale: 'It can imply merely subsequent timing. The Hebrew connection more naturally expresses the result or purpose of anointing: that the sons may serve as priests to God.'
  - severity: low
    issue: Verb choice “பணிசெய்வார்கள்”
    rationale: It is understandable, but “பணியாற்றுவார்கள்” is the more natural formal-modern Tamil expression for carrying out priestly service.
