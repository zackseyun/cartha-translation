base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/005.yaml
  text: And you shall place the golden altar for incense before the ark of the testimony[b][a], and you shall set the screen for the entrance of the tabernacle.
translation:
  language: ta
  text: சாட்சிப் பெட்டியின் முன்பாகத் தூபத்துக்கான பொன் பலிபீடத்தை[a] வைக்க வேண்டும்; திருக்கூடாரத்தின் நுழைவுக்கான திரையை அமைக்க வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மரபான நடையில், ‘தூபத்திற்கான பொன்னாலான பலிபீடம்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘சாட்சியின் பெட்டி’; மரபாகப் பெரும்பாலும் ‘உடன்படிக்கைப் பெட்டி’ என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: வைக்க வேண்டும்
  rationale: נתן என்பதன் ‘வை/நிறுத்திவை’ என்ற பொருளை, வழிமுறையாகச் சொல்லப்படும் இச்சூழலில் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מִזְבַּח הַזָּהָב
  choice: பொன் பலிபீடம்
  rationale: ‘பொன்னாலான பலிபீடம்’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவித்து, பொருளைக் குறிக்கும் எபிரெய அமைப்பைப் பேணுகிறது.
- source_word: לִקְטֹרֶת
  choice: தூபத்துக்கான
  rationale: ל முன்னொட்டு இங்கு நோக்கம் அல்லது பயன்பாட்டைக் குறிக்கிறது; ஆகவே இது ‘தூப பலிபீடம்’ என்பதைக் காட்டிலும் மூலத்தின் உறவைத் தெளிவாகப் பேணுகிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: இங்கு முதன்மையாக இடத்தொடர்பை, அதாவது ‘முன்னால்’ என்பதைக் குறிக்கிறது.
- source_word: אֲרוֹן הָעֵדֻת
  choice: சாட்சிப் பெட்டி
  rationale: עֵדֻת என்பதை ‘உடன்படிக்கை’ என மரபுவழியில் மாற்றாமல், அதன் நேரடியான ‘சாட்சி’ என்ற பொருளோடு பெயர்த்துள்ளது.
- source_word: וְשַׂמְתָּ
  choice: அமைக்க வேண்டும்
  rationale: שׂים குறிக்கும் வைப்புச் செயலைத் துல்லியமாகத் தருவதோடு, நுழைவுத் திரைக்குப் பொருத்தமான இயல்பான தமிழாக உள்ளது.
- source_word: מָסַךְ
  choice: திரை
  rationale: திருக்கூடார நுழைவில் தொங்கவிடப்படும் மறைப்புத் துணியைக் குறிக்கிறது; நவீன வாசகருக்கு ‘திரை’ தெளிவான சொல்.
- source_word: הַפֶּתַח
  choice: நுழைவு
  rationale: פֶּתַח குறிக்கும் திறப்பு அல்லது உள்ளே செல்லும் இடத்தை இச்சூழலில் இயல்பாகத் தருகிறது.
- source_word: לַמִּשְׁכָּן
  choice: திருக்கூடாரத்தின்
  rationale: מִשְׁכָּן என்பதற்கான நிலைபெற்ற வேதாகமத் தமிழ் சொல்லான ‘திருக்கூடாரம்’ பயன்படுத்தப்பட்டு, முழுச் சொற்றொடர் தமிழில் இயல்பான உடைமைத் தொடர்பாக அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: עֵדֻת இடம்பெறும் பெட்டியின் பெயர்
  choice: சாட்சிப் பெட்டி
  alternative: உடன்படிக்கைப் பெட்டி
  rationale: மூல எபிரெயம் இவ்வசனத்தில் ‘சாட்சி’ என்ற சொல்லையே பயன்படுத்துகிறது. பரிச்சயமான மரபுப் பெயரான ‘உடன்படிக்கைப் பெட்டி’யை உட்புகுத்தாமல், மூலத்தின் துல்லியத்தையும் அதன் தனித்த சொற்பயன்பாட்டையும் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு அமைப்புக்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. எபிரெய மொழியின் நேரடி இரண்டாம் நபர் ஆணை வடிவம் தமிழில் இயல்பான வழிமுறை நடையான ‘வேண்டும்’ எனத் தரப்பட்டுள்ளது; இரண்டு வினைகளின் சிறு வேறுபாடு ‘வைக்க’ மற்றும் ‘அமைக்க’ எனப் பேணப்பட்டுள்ளது.
