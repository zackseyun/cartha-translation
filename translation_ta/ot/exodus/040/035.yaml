base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/035.yaml
  text: And Moses was not able to enter the tent of meeting[a], because the cloud settled on it, and the glory of Yahweh filled the tabernacle.
translation:
  language: ta
  text: மேலும், மோசேயால் சந்திப்புக் கூடாரத்திற்குள் நுழைய முடியவில்லை. ஏனெனில் மேகம் அதன்மேல் தங்கியிருந்தது[a]; யாவேயின் மகிமை திருக்கூடாரத்தை நிரப்பியிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “குடிகொண்டிருந்தது” அல்லது “நிலைகொண்டிருந்தது” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் வசித்தல், தங்குதல், அல்லது ஓரிடத்தில் நிலைகொள்ளுதல் ஆகிய பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא יָכֹל מֹשֶׁה
  choice: மோசேயால் ... முடியவில்லை
  rationale: எபிரெய வினைச்சொல் மோசேக்கு நுழையும் திறன் அல்லது வாய்ப்பு இல்லாததைச் சொல்கிறது. தமிழில் இயல்பான ஆற்றல் மறுப்பு அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: לָ/בוֹא אֶל
  choice: '...க்குள் நுழைய'
  rationale: ஒரு கட்டமைப்பின் உட்பகுதிக்குச் செல்வதை இச்சூழலில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: இறைவன் தம் மக்களைச் சந்திக்கும் நோக்கத்திற்குரிய கூடாரம் என்ற பெயரின் பொருளைப் பாதுகாக்கும் நவீன, தெளிவான சொற்றொடர்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: மோசே நுழைய முடியாததற்கான காரணத்தை நேரடியாகக் குறிக்கிறது.
- source_word: שָׁכַן
  choice: தங்கியிருந்தது
  rationale: மேகம் கூடாரத்தின்மேல் வந்து நிலைத்திருந்த காட்சியை இயல்பான தமிழில் தருகிறது; அதேவேளை 'வசித்தல்' என்ற மூலச்சொல்லின் விரிவான பொருளை அடிக்குறிப்பில் வைத்திருக்கிறது.
- source_word: עָלָיו
  choice: அதன்மேல்
  rationale: மேகம் சந்திப்புக் கூடாரத்தின்மேல் இருந்ததைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லின் இயல்பான தமிழ் வடிவம்.
- source_word: וּ/כְבוֹד יְהוָה
  choice: யாவேயின் மகிமை
  rationale: כָּבוֹד என்பதன் இறையியல் எடையை 'மகிமை' பாதுகாக்கிறது; யாவே என்ற தனிப்பெயரும் நேரடியாக வைக்கப்படுகிறது.
- source_word: מָלֵא
  choice: நிரப்பியிருந்தது
  rationale: மோசே நுழைய முடியாதபோது நீடித்திருந்த விளைவு நிலையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: யாத்திராகமத்தில் இச்சொல் குறிக்கும் எடுத்துச் செல்லத்தக்க பரிசுத்த உறைவிடத்தை, சந்திப்புக் கூடாரம் என்ற இணைச் சொல்லிலிருந்து வேறுபடுத்தி, மரியாதையான நவீன தமிழில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் நான்கு எழுத்துகளைக் கொண்ட இறைத்தனிப்பெயர் நேரடியாக உள்ளது. எனவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- issue: שָׁכַן என்பதிலுள்ள தங்குதல்–வசித்தல் நுணுக்கம்
  choice: தங்கியிருந்தது
  alternative: குடிகொண்டிருந்தது / நிலைகொண்டிருந்தது
  rationale: உடனடிச் சூழலில் மேகம் கூடாரத்தின்மேல் வந்து நிலைத்திருக்கும் காட்சியே முதன்மை. பிற்கால இறையியல் கருத்தை முதன்மை உரைக்குள் மிகைப்படுத்தாமல், சொல்லின் உண்மையான மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் காரணத் தொடர்பும், 'சந்திப்புக் கூடாரம்' மற்றும் 'திருவாசஸ்தலம்' என்ற இரண்டு தனித்த சொற்களும் பாதுகாக்கப்பட்டுள்ளன.
