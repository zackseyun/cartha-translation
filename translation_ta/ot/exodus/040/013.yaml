base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/013.yaml
  text: And you shall clothe Aaron with the holy garments[a], and you shall anoint him and consecrate him, and he shall serve as priest to me.
translation:
  language: ta
  text: ஆரோனுக்குப் பரிசுத்த ஆடைகளை அணிவி; அவனுக்கு அபிஷேகம் செய்; அவனைப் பரிசுத்தப்படுத்து; அவன் எனக்கு ஆசாரியனாகப் பணியாற்றுவான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவன் எனக்கு ஆசாரியப் பணி செய்வான்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் ஆசாரியப் பதவியில் செயல்படுதல் அல்லது சேவை செய்தல் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: அணிவித்து
  rationale: לבשׁ என்பதன் ஹிஃபீல் வடிவம் இங்கு மோசே ஆரோனுக்கு ஆடைகளை அணிவிக்க வேண்டும் என்ற காரணவினைப் பொருளைக் கொண்டுள்ளது.
- source_word: אַהֲרֹן
  choice: ஆரோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட பெயரெழுத்தாக்கம்.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: பரிசுத்த ஆடைகள்
  rationale: ‘பரிசுத்தத்துக்குரிய ஆடைகள்’ என்ற எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் வழங்கி, வழிபாட்டுக்குரிய தன்மையையும் காக்கிறது.
- source_word: וּמָשַׁחְתָּ
  choice: அபிஷேகம் செய்து
  rationale: ஆசாரிய நியமனச் சூழலில் משׁח குறிக்கும் சடங்குசார் பூசுதலைத் தமிழில் வழக்கமான வேதாகமச் சொல்லால் தெரிவிக்கிறது.
- source_word: וְקִדַּשְׁתָּ
  choice: பரிசுத்தப்படுத்து
  rationale: קדשׁ என்பதன் பியேல் வடிவம் ஒருவரைப் பரிசுத்த நோக்கத்துக்காக வேறுபிரித்தலைக் குறிக்கிறது; பின்னைய சபை நியமனச் சொற்களை இறக்குமதி செய்யாமல் மூலத்தின் தனிச் செயலைப் பேணுகிறது.
- source_word: וְכִהֵן
  choice: ஆசாரியனாகப் பணியாற்றுவான்
  rationale: כהן என்பது ஆசாரியப் பதவியில் செயல்படுதல் அல்லது சேவை செய்தலைக் குறிக்கிறது; வெறுமனே ‘ஆசாரியனாக இருப்பான்’ என்பதைக் காட்டிலும் வினையின் செயற்பாட்டுப் பொருளைப் பேணுகிறது.
- source_word: לִי
  choice: எனக்கு
  rationale: யாவேவுக்கு அளிக்கப்படும் தனிப்பட்ட சேவையைக் குறிக்கும் தாதிவுப் பொருளை நேரடியாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: ஆசாரிய நியமனச் செயல்களின் வரிசை
  choice: ஆடை அணிவித்தல், அபிஷேகம் செய்தல், பரிசுத்தப்படுத்துதல் ஆகியவற்றைத் தனித்தனி செயல்களாக வைத்தல்
  alternative: அனைத்தையும் ‘நியமித்தல்’ என்ற ஒரே கருத்தில் இணைத்தல்
  rationale: எபிரெய உரை ஒவ்வொரு சடங்குச் செயலையும் தனியே குறிப்பிடுகிறது; அவற்றை ஒன்றாக்குவது உரையின் சடங்குசார் குறிப்புத்தன்மையைக் குறைக்கும்.
- issue: וְכִהֵן לִי என்பதன் தொடர்பு
  choice: ‘அவன் எனக்கு ஆசாரியனாகப் பணியாற்றுவான்’ என்ற தொடர்ச்சியான எதிர்கால விளைவாக மொழிபெயர்த்தல்
  alternative: ‘அவன் எனக்கு ஆசாரியனாகப் பணியாற்றும்படி’ என்ற வெளிப்படையான நோக்கக் கூற்றாக மொழிபெயர்த்தல்
  rationale: மூலத்தில் நோக்கத்தைக் குறிக்கும் தனியான இணைப்புச் சொல் இல்லை. தொடர்ச்சியான வாவ் அமைப்பை நேரடியாக வைத்திருப்பது நோக்கம் அல்லது விளைவு என்ற இரு தொடர்புகளையும் அளவுக்கு மீறித் தீர்மானிக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அபிஷேகம்’, ‘பரிசுத்தம்’, ‘ஆசாரியன்’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாக இருப்பதால் தக்கவைக்கப்பட்டுள்ளன; வாக்கிய அமைப்பு சாதாரண வாசகருக்குப் புரியும் வகையில் சுருக்கமாக உள்ளது.
