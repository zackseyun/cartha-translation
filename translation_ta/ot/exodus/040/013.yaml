revisions:
- from: ஆரோனுக்குப் பரிசுத்த ஆடைகளை அணிவித்து, அவனுக்கு அபிஷேகம் செய்து, அவனைப் பரிசுத்தப்படுத்து; அவன் எனக்கு ஆசாரியனாகப் பணியாற்றுவான்.[a]
  to: ஆரோனுக்குப் பரிசுத்த ஆடைகளை அணிவி; அவனுக்கு அபிஷேகம் செய்; அவனைப் பரிசுத்தப்படுத்து; அவன் எனக்கு ஆசாரியனாகப் பணியாற்றுவான்.[a]
  rationale: The revision changes only the Tamil verbal forms for clothing and anointing into parallel imperatives. This restores the Hebrew's coordinated second-person instruction sequence while retaining the draft's terminology and its non-overdetermined rendering of the final third-person clause.
