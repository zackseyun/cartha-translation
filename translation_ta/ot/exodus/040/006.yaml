  yaml_path: translation/ot/exodus/040/006.yaml
  text: And you shall place the altar of burnt offering before the entrance of the tabernacle[a], the tent of meeting.
translation:
  language: ta
  text: தகனபலிக்கான பலிபீடத்தைச் சந்திப்புக் கூடாரமாகிய வாசஸ்தலத்தின் நுழைவாயிலுக்கு முன்பாக வைக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/נָתַתָּה
  choice: வைக்க வேண்டும்
  rationale: נתן என்பதன் ‘வை/அமை’ என்ற பொருளை, கூடாரப் பொருட்களை உரிய இடத்தில் அமைக்கும் இச்சூழலில் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִזְבַּח הָעֹלָה
  choice: தகனபலிக்கான பலிபீடம்
  rationale: עֹלָה என்பது முழுவதும் எரிக்கப்படும் பலியைக் குறிக்கிறது; construct தொடரின் செயல்நோக்கைத் தமிழில் இயல்பாகக் காட்ட ‘தகனபலிக்கான’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: இங்கு சொல்லப்படும் இட உறவைத் தெளிவாகக் குறிக்கிறது.
- source_word: פֶּתַח
  choice: நுழைவாயில்
  rationale: கூடாரத்துக்குள் செல்லும் திறப்பை இயல்பாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: מִשְׁכַּן
  choice: திருவாசஸ்தலம்
  rationale: மִשְׁכָּן என்பதன் ‘வாசஸ்தலம்’ என்ற அடிப்படைப் பொருளையும், யாத்திராகமத்தில் தேவனுடைய பரிசுத்த உறைவிடத்தைக் குறிக்கும் தொழில்நுட்பப் பயன்பாட்டையும் தக்கவைக்கிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: தேவன் தம் மக்களைச் சந்திக்கும் கூடாரம் என்ற நிலையான பெயரைச் சுருக்கமாகவும் புரியத்தக்க வகையிலும் வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு அமைப்புக்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘முன்பாக’ என்பது இடத்தைக் குறிக்கிறது. மִשְׁכַּן மற்றும் אֹהֶל מוֹעֵד ஒரே பரிசுத்த அமைப்பை விளக்கும் இணைப்பெயர்களாக ‘சந்திப்புக் கூடாரமாகிய திருவாசஸ்தலம்’ என்று வடிவமைக்கப்பட்டுள்ளன.
