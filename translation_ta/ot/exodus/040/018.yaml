translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் புனித உரைக்குரிய கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் தொடர்ச்சியான கட்டுமானச் செயல்கள் தமிழில் இயல்பாக அமைய வினையெச்சத் தொடராக வழங்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் அடிக்குறி குறியீடுகள் பொருந்தாத இடங்களில் இருந்ததால், அவை தொடர்புடைய தமிழ்ச் சொற்களுக்குப் பின் சரியாக வைக்கப்பட்டுள்ளன.
