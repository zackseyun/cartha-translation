revisions:
- from: மோசே திருக்கூடாரத்தை அமைத்து, அதன் அடிப்பீடங்களை[a] வைத்தார்; அதன் சட்டப்பலகைகளை[b] நிறுத்தி, அதன் குறுக்குக் கம்பிகளைப் பொருத்தி, அதன் தூண்களை[c] எழுப்பினார்.
