base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/018.yaml
  text: So Moses set up the tabernacle[a], and placed its bases, and set its frames, and put in its bars[c][b], and raised up its pillars.
translation:
  language: ta
  text: மோசே திருக்கூடாரத்தை எழுப்பி, அதன் அடிப்பீடங்களை[a] வைத்து, அதன் சட்டங்களை[b] நிறுத்தி, அதன் குறுக்குக் கம்பிகளைப் பொருத்தி, அதன் தூண்களை[c] எழுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடிப்பீடங்கள்’ என்பதற்குப் பதிலாக ‘அடித்தளங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் (אֲדָנָיו) திருக்கூடாரத்தின் சட்டங்களைத் தாங்கிய அடித்தளப் பகுதிகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘சட்டங்கள்’ என்பதற்குப் பதிலாக ‘பலகைகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் (קְרָשָׁיו) இங்கு திருக்கூடாரத்தின் செங்குத்தான கட்டமைப்பு உறுப்புகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘தூண்கள்’ என்பதற்குப் பதிலாக ‘கம்பங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: அமைத்து / எழுப்பினார்
  rationale: קום என்பதன் ஹிஃபில் வடிவம் ‘நிற்கச் செய்தல், நிறுவுதல்’ என்று பொருள்படும். முழுத் திருக்கூடாரத்தைப் பொறுத்தவரை ‘அமைத்து’ என்பது இயல்பானது; தூண்களைப் பொறுத்தவரை ‘எழுப்பினார்’ என்பது செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருக்கூடாரம்
  rationale: מִשְׁכָּן என்பதன் அடிப்படைப் பொருள் ‘வாசஸ்தலம்’. இங்கு அது இஸ்ரவேலரின் எடுத்துச் செல்லக்கூடிய புனிதக் கூடாரத்தைக் குறிக்கும் என்பதால், நவீனத் தமிழில் தெளிவாகவும் மரியாதையாகவும் உள்ள ‘திருக்கூடாரம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲדָנָיו
  choice: அதன் அடிப்பீடங்கள்
  rationale: אֶדֶן என்பது சட்டப்பலகைகளைத் தாங்கிய அடித்தளப் பொருத்துகளைக் குறிக்கிறது. ‘அடிப்பீடங்கள்’ அவற்றின் அமைப்புச் செயல்பாட்டைத் தெளிவாக எடுத்துரைக்கிறது.
- source_word: קְרָשָׁיו
  choice: அதன் சட்டப்பலகைகள்
  rationale: קֶרֶשׁ என்பது பலகை அல்லது கட்டமைப்பில் நிறுத்தப்படும் உறுப்பு எனப் பொருள்படும். வெறும் ‘பலகைகள்’ என்பதைவிட ‘சட்டப்பலகைகள்’ அவற்றின் கட்டமைப்புப் பணியைத் தெளிவாக்குகிறது; அதேவேளை மூலச்சொல்லின் பொருளையும் காக்கிறது.
- source_word: בְּרִיחָיו
  choice: அதன் குறுக்குக் கம்பிகள்
  rationale: בְּרִיחַ என்பது நிறுத்தப்பட்ட சட்டப்பலகைகளை ஒன்றாக இணைத்து உறுதிப்படுத்திய கம்பிகளைக் குறிக்கும். தமிழில் ‘குறுக்குக் கம்பிகள்’ அவற்றின் வடிவத்தையும் பணியையும் இயல்பாகக் காட்டுகிறது.
- source_word: עַמּוּדָיו
  choice: அதன் தூண்கள்
  rationale: עַמּוּד என்பது நிமிர்ந்து நிற்கும் ஆதார உறுப்பைக் குறிக்கும். புனிதக் கட்டமைப்புச் சூழலில் ‘தூண்கள்’ என்பது இயல்பான, மரியாதையான மொழிபெயர்ப்பு.
- source_word: וַיָּשֶׂם
  choice: நிறுத்தி
  rationale: שׂוּם என்பது ‘வை, இடு’ என்று பொருள்படும். செங்குத்தான சட்டப்பலகைகள் அமைக்கப்பட்ட செயலைத் தமிழில் இயல்பாகக் காட்ட ‘நிறுத்தி’ பயன்படுத்தப்பட்டது.
- source_word: וַיִּתֵּן
  choice: வைத்தார் / பொருத்தி
  rationale: נָתַן இங்கு பொருட்களை உரிய இடத்தில் வைப்பதைக் குறிக்கிறது. அடிப்பீடங்களுக்கு ‘வைத்தார்’ என்றும் குறுக்குக் கம்பிகளுக்கு அவற்றின் கட்டமைப்புச் செயலைக் காட்ட ‘பொருத்தி’ என்றும் சூழலுக்கேற்றவாறு மொழிபெயர்க்கப்பட்டது.
