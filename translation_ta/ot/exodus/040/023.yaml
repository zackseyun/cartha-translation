base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/023.yaml
  text: And he arranged on it the bread in order before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: ta
  text: அவர் அதன்மேல் யாவேக்கு முன்பாக அப்பத்தை ஒழுங்காக[a] அடுக்கிவைத்தார்; யாவே மோசேக்குக் கட்டளையிட்டபடியே அவர் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்பத்தின் அடுக்கு” அல்லது “அப்பத்தின் ஒழுங்கமைவு”; பாரம்பரியமாக, “சமுகத்து அப்பம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: ஒழுங்காக அடுக்கிவைத்தார்
  rationale: ערך என்பது ஒழுங்குபடுத்துதல் அல்லது வரிசைப்படுத்தி வைத்தல் என்று பொருள்படும்; வழிபாட்டுச் சூழலில் அப்பத்தை முறையாக அமைத்துவைத்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עָלָיו
  choice: அதன்மேல்
  rationale: முந்தைய வசனத்தில் சொல்லப்பட்ட மேசையையே ஒருமைச் சுட்டுப்பெயர் குறிக்கிறது; ‘அதன்மேல்’ இடத்தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: עֵרֶךְ לֶחֶם
  choice: அப்பத்தை ஒழுங்காக
  rationale: இந்தச் சொற்றொடர் ஒழுங்குபடுத்தப்பட்ட அப்ப அமைப்பைக் குறிக்கிறது. தமிழில் பெயர்ச்சொல் தொடரை வற்புறுத்தாமல், வினையோடு இணைத்து இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது; ‘சமுகத்து அப்பம்’ என்ற பாரம்பரிய விளக்கத்தை மூலத்தில் இல்லாதபடி நேரடியாகச் சேர்க்கவில்லை.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பது இங்கு யாவேயின் முன்னிலையில் நடைபெறும் வழிபாட்டுச் செயலைக் குறிக்கிறது; ‘முன்பாக’ அதன் இட மற்றும் முன்னிலை சார்ந்த நுணுக்கத்தை வைத்திருக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: யாவே மோசேக்குக் கட்டளையிட்டபடியே செய்தார்
  rationale: தெய்வீகக் கட்டளையுடன் செயல் துல்லியமாக ஒத்திருந்ததை ‘கட்டளையிட்டபடியே’ தெரிவிக்கிறது. தமிழில் முழுமையான வாக்கிய ஓட்டத்திற்காக சூழலால் தெளிவாக உள்ள ‘செய்தார்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலச் சான்றைத் தெளிவாகப் பாதுகாக்கிறது.
- issue: עֵרֶךְ לֶחֶם என்பதன் வழிபாட்டு விளக்கம்
  choice: அப்பத்தை ஒழுங்காக
  alternative: சமுகத்து அப்பம் / அப்பத்தின் அடுக்கு
  rationale: இவ்வசனத்தின் சொற்றொடர் அப்பத்தின் ஒழுங்கமைப்பையே நேரடியாகச் சொல்கிறது; வேறு இடங்களில் வரும் לֶחֶם הַפָּנִים என்ற குறிப்பிட்ட பெயரை இங்கு இறக்குமதி செய்யாமல், பாரம்பரியப் புரிதலை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடை. மூலத்தின் செயல் வரிசையும் இறைப்பெயரும் பாதுகாக்கப்பட்டுள்ளன.
