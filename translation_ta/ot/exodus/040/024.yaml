source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם אֶת הַ/מְּנֹרָה֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד נֹ֖כַח הַ/שֻּׁלְחָ֑ן עַ֛ל יֶ֥רֶךְ הַ/מִּשְׁכָּ֖ן נֶֽגְבָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/024.yaml
  text: He placed the lampstand in the tent of meeting[a], opposite the table, on the south side of the tabernacle.
translation:
  language: ta
  text: அவர் சந்திப்புக் கூடாரத்தில், மேசைக்கு எதிரே[a], திருவாசஸ்தலத்தின் தெற்குப் பக்கத்தில் விளக்குத்தண்டை வைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மேசையை நோக்கியவாறு.’ נֹכַח என்ற எபிரெயச் சொல் ஒன்றுக்கு எதிரே அல்லது அதை நோக்கியவாறு அமைந்திருப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: வைத்தார்
  rationale: שׂים வினையின் தொடர்கதை வடிவம் முடிவுற்ற கடந்தகாலச் செயலைக் குறிக்கிறது; பொருட்களை ஒழுங்காக உரிய இடத்தில் அமைத்த சூழலில் ‘வைத்தார்’ இயல்பான தமிழ்.
- source_word: הַמְּנֹרָה
  choice: விளக்குத்தண்டு
  rationale: מְנוֹרָה ஒரு தனி விளக்கை அல்ல, திருவழிபாட்டுக்குரிய விளக்குகளைத் தாங்கும் தண்டைக் குறிக்கிறது; ‘விளக்குத்தண்டு’ அதன் வடிவத்தையும் பணியையும் தெளிவாகத் தெரிவிக்கிறது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: இச்சொற்றொடர் இறைவனும் மனிதரும் சந்திக்கும் பரிசுத்தக் கூடாரத்தைக் குறிக்கிறது; ‘சந்திப்புக் கூடாரம்’ பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: נֹכַח הַשֻּׁלְחָן
  choice: மேசைக்கு எதிரே
  rationale: נֹכַח என்பது ஒன்றுக்கு எதிராக அல்லது அதன் முன்பாக அமைந்திருப்பதைக் குறிக்கலாம்; இங்குள்ள இடவமைப்பில் ‘எதிரே’ முதன்மையான பொருத்தமான தெரிவு.
- source_word: הַשֻּׁלְחָן
  choice: மேசை
  rationale: எபிரெய உரை ‘மேசை’ என்று மட்டுமே கூறுகிறது; அப்பத்தோடு தொடர்புடைய விரிவான அடையாளத்தை வசனத்துக்குள் சேர்க்கவில்லை.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן
  choice: திருவாசஸ்தலத்தின் ... பக்கத்தில்
  rationale: יֶרֶךְ என்பதன் அடிப்படைப் பொருள் ‘பக்கம்’ அல்லது ‘ஓரம்’; பின்வரும் திசைச்சொல்லோடு சேர்ந்து கட்டமைப்பின் தெற்குப் பக்கத்தைக் குறிப்பிடுகிறது.
- source_word: נֶגְבָּה
  choice: தெற்குப்
  rationale: திசையைக் குறிக்கும் இவ்வடிவம் தெற்குநோக்கிய இடத்தையோ தெற்குப் பக்கத்தையோ சுட்டுகிறது; தமிழில் ‘தெற்குப் பக்கத்தில்’ இயல்பான இடவியல் சொற்றொடர்.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: מִשְׁכָּן என்பதன் மூலப்பொருள் ‘வாசஸ்தலம்’; யாத்திராகமத்தில் இறைவனின் பரிசுத்த வாசஸ்தலக் கட்டமைப்பைக் குறிக்க ‘திருவாசஸ்தலம்’ தெளிவான, கண்ணியமான தமிழ்.
theological_decisions:
- issue: מִשְׁכָּן என்ற வழிபாட்டிடப் பெயரின் மொழிபெயர்ப்பு
  choice: திருவாசஸ்தலம்
  alternative: திருக்கூடாரம்
  rationale: ‘திருவாசஸ்தலம்’ எபிரெயச் சொல்லின் ‘வாசித்தல்/வாசஸ்தலம்’ சார்ந்த பொருளைப் பாதுகாக்கிறது; அதே நேரத்தில் சந்திப்புக் கூடாரத்திலிருந்து சொல்லாட்சியில் வேறுபடுத்துகிறது. எந்தப் பிரிவுசார் தனிப்பொருளையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘சந்திப்புக் கூடாரம்’ மற்றும் ‘திருவாசஸ்தலம்’ என்ற சொற்கள் אֹהֶל מוֹעֵד, מִשְׁכָּן ஆகிய வேறுபட்ட எபிரெயப் பெயர்களின் தனித்தன்மையைப் பாதுகாக்கின்றன; நֹכַח என்பதிலுள்ள இடவியல் நுணுக்கம் அடிக்குறிப்பில் வைக்கப்பட்டது.
