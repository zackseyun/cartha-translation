  yaml_path: translation/ot/exodus/040/031.yaml
  text: From it Moses and Aaron and his sons washed their hands and their feet[a].
translation:
  language: ta
  text: அதிலிருந்து மோசேயும் ஆரோனும் ஆரோனுடைய மகன்களும் தங்கள் கைகளையும் கால்களையும் கழுவினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதைக் கொண்டு’; எபிரெயத்தில் சொல்லுக்குச் சொல் ‘அதிலிருந்து’ என்று உள்ளது; இது தொட்டியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: கழுவினார்கள்
  rationale: רחץ என்பதன் Qal wayyiqtol வடிவம் தொடர்ச்சியான கடந்தகால நிகழ்வை விவரிக்கிறது; அடுத்த வசனத்தில் வழக்கமான சூழல் கூறப்படுவதால், இங்கு எளிய இறந்தகாலம் பொருத்தமானது.
- source_word: מִמֶּנּוּ
  choice: அதிலிருந்து
  rationale: מן முன்னிடைச்சொல்லும் மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டும் இயல்பாக ‘அதிலிருந்து’ என்று பொருள்பட்டு, முந்தைய வசனத்திலுள்ள தொட்டியைக் குறிக்கின்றன; இது கருவியைவிட மூலத்தை வலியுறுத்துகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: இப்பெயரின் வழக்கமான நவீனத் தமிழ் வடிவம்.
- source_word: וְאַהֲרֹן
  choice: ஆரோனும்
  rationale: இப்பெயரின் வழக்கமான நவீனத் தமிழ் வடிவத்துடன் இணைப்பும் இயல்பான உம்மைத் தொகையாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וּבָנָיו
  choice: அவனுடைய மகன்களும்
  rationale: ஆண்பால் ஒருமை உடைமைப் பின்னொட்டு அருகிலுள்ள ஆரோனைக் குறிக்கிறது; ஆசாரியச் சூழலில் בנים என்பது அவருடைய ஆண் பிள்ளைகளைத் துல்லியமாகக் குறிக்கிறது.
- source_word: אֶת יְדֵיהֶם
  choice: தங்கள் கைகளை
  rationale: பன்மை உடல் உறுப்பும் அவர்களைக் குறிக்கும் பின்னொட்டும் இயல்பான தமிழில் தற்சுட்டு உடைமை வடிவில் தரப்பட்டுள்ளன.
- source_word: וְאֶת רַגְלֵיהֶם
  choice: கால்களையும்
  rationale: எபிரெய மூலத்திலுள்ள கைகள்–கால்கள் இணை தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
