source:
  edition: WLC
  text: בְּ/בֹאָ֞/ם אֶל אֹ֣הֶל מוֹעֵ֗ד וּ/בְ/קָרְבָתָ֛/ם אֶל הַ/מִּזְבֵּ֖חַ יִרְחָ֑צוּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/032.yaml
  text: Whenever they entered the tent of meeting, and whenever they approached the altar, they washed, just as Yahweh had commanded Moses.
translation:
  language: ta
  text: அவர்கள் சந்திப்புக் கூடாரத்திற்குள் நுழையும் போதெல்லாம், பலிபீடத்தை நெருங்கும் போதெல்லாம், யாவே மோசேக்குக் கட்டளையிட்டபடியே அவர்கள் கழுவினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבֹאָם
  choice: அவர்கள் ... நுழையும் போதெல்லாம்
  rationale: בְּ + வினையெச்சப் பெயர் அமைப்பு காலச் சூழலைக் குறிக்கிறது; நிகழ்வு மீண்டும் மீண்டும் நடந்த வழக்கத்தைச் சூழல் காட்டுவதால் ‘போதெல்லாம்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: இஸ்ரவேலரை யாவே சந்திக்கும் திருக்கூடாரத்தைக் குறிக்கும் வழக்கமான, புரிந்துகொள்ள எளிய தமிழ் பெயர்ப்பு.
- source_word: וּבְקָרְבָתָם
  choice: நெருங்கும் போதெல்லாம்
  rationale: קרב இங்கு பலிபீடத்தை அணுகுவதைக் குறிக்கிறது; இணையான கால அமைப்பையும் மீள்நிகழ்வையும் ‘போதெல்லாம்’ காக்கிறது.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: வழிபாட்டுச் சூழலில் מִזְבֵּחַ என்பதற்கான தெளிவான, பொதுவான தமிழ் சொல்.
- source_word: יִרְחָצוּ
  choice: கழுவினார்கள்
  rationale: இறந்தகாலக் கதையாடலில் வழக்கமாக நிகழ்ந்த செயலை இங்கு imperfect குறிக்கிறது; ‘போதெல்லாம்’ என்பதுடன் தமிழ் இறந்தகாலம் அந்த வழக்கப் பொருளைத் தெளிவாகத் தருகிறது. எதை கழுவினர் என்பதை மூலவசனம் இங்கு வெளிப்படையாகச் சொல்லாததால் பொருள் சேர்க்கப்படவில்லை.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: கட்டளையிட்டபடியே
  rationale: முன்னர் கொடுக்கப்பட்ட கட்டளைக்கு முற்றிலும் இணங்கச் செயல் நடந்ததைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் தருகிறது.
- source_word: אֶת מֹשֶׁה
  choice: மோசேக்கு
  rationale: צוה உடன் எபிரெயத்தில் கட்டளை பெறும் நபர் நேரடி வேற்றுமையில் வந்தாலும், தமிழில் ‘மோசேக்குக் கட்டளையிட்டார்’ என்பதே இயல்பான இலக்கண அமைப்பு.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக இருப்பதால் அதை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: יִרְחָצוּ என்பதில் கழுவப்பட்ட உடற்பகுதிகள் மறைமுகமாக இருப்பது
  choice: கழுவினார்கள்
  alternative: தங்கள் கைகளையும் கால்களையும் கழுவினார்கள்
  rationale: முந்தைய வசனச் சூழல் கைகளையும் கால்களையும் அடையாளப்படுத்தினாலும், இந்த வசனத்தில் செயப்படுபொருள் சொல்லப்படவில்லை; ஆகவே அந்தத் தகவலை வசனத்திற்குள் சேர்க்காமல் மூலத்தின் சுருக்கத்தைக் காத்துள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் எளிமையும் கொண்ட நடையைப் பயன்படுத்துகிறது. இணையான இரு எபிரெய காலத் தொடர்களும் ‘போதெல்லாம்’ என ஒரே வடிவில் வைக்கப்பட்டு, ஆசாரியர்களின் மீள்நிகழும் நடைமுறை தெளிவாக்கப்பட்டுள்ளது.
