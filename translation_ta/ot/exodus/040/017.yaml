translation_notes:
  register: நவீனத் தரத் தமிழில், சுருக்கமான வரலாற்றுக் கதைநடையுடன் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் தேதிக் கட்டமைப்பு காக்கப்பட்டாலும், தமிழில் இயல்பற்ற ‘அது நிகழ்ந்தது’ என்ற தொடக்கம் தவிர்க்கப்பட்டது. ‘திருக்கூடாரம்’ என்பது மரியாதையும் பொதுவாசகர் புரிதலும் இணையும் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது.
