  source_fidelity: 'எபிரெய மூலத்தின் தேதிக் கட்டமைப்பு துல்லியமாகக் காக்கப்பட்டுள்ளது: ‘இரண்டாம் ஆண்டின் முதல் மாதத்தில்’ மற்றும் ‘அந்த மாதத்தின் முதல் நாளில்’ என்பவை בַּחֹדֶשׁ הָרִאשׁוֹן בַּשָּׁנָה הַשֵּׁנִית בְּאֶחָד לַחֹדֶשׁ என்பதற்குப் பொருந்துகின்றன. הוּקַם என்பதன் செயப்பாட்டு அர்த்தம் ‘அமைக்கப்பட்டது’ என்பதில் நன்றாக வெளிப்படுகிறது. வாவ்-தொடர்கதை அறிமுகமான וַיְהִי தனிச் சொற்றொடராக மொழிபெயர்க்கப்படவில்லை; ஆனால் தமிழில் காலக் குறிப்புக்குப் பின் நேரடியாக நிகழ்வைக் கூறுவது இயல்பானது; பொருளிழப்பு இல்லை.'
