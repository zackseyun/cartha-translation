source:
  edition: WLC
  text: וַ/יְהִ֞י בַּ/חֹ֧דֶשׁ הָ/רִאשׁ֛וֹן בַּ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הוּקַ֖ם הַ/מִּשְׁכָּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/017.yaml
  text: And it happened in the first month of the second year[a], on the first day of the month[b], that the tabernacle was set up.
translation:
  language: ta
  text: இரண்டாம் ஆண்டின் முதல் மாதத்தில், அந்த மாதத்தின் முதல் நாளில்[a], திருக்கூடாரம் அமைக்கப்பட்டது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘மாதத்தின் ஒன்றில்’; இது ‘மாதத்தின் முதல் நாளில்’ என்று பொருள்படும் எபிரெயத் தேதிக் குறிப்பு மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எழுப்பப்பட்டது’ அல்லது ‘நிறுவப்பட்டது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: காலக் குறிப்பைத் தொடர்ந்து வரும் நிகழ்வுரையாகத் தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டது
  rationale: இந்த வடிவம் எபிரெயக் கதையின் தொடர்ச்சியில் ஒரு நிகழ்வை அறிமுகப்படுத்துகிறது. ‘அப்போது நிகழ்ந்தது’ என்று தனியாக மொழிபெயர்ப்பது இங்கு தமிழில் செயற்கையாக இருப்பதால், வாக்கியத்தின் காலக் கட்டமைப்பும் இறுதி வினையும் அதன் பணியைச் செய்கின்றன.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: முதல் மாதத்தில்
  rationale: நாட்காட்டிச் சூழலில் חֹדֶשׁ என்பது ‘மாதம்’ என்று பொருள்படும்; பெயரடைச் சுட்டுடன் வரும் வரிசை எண் ‘முதல்’ என்பதைக் குறிக்கிறது.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: இரண்டாம் ஆண்டின்
  rationale: இது தேதியை மேலும் குறிப்பாக்குகிறது. ‘முதல் மாதம்’ என்பதுடன் இணையும் இயல்பான தமிழ் உடைமைத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: அந்த மாதத்தின் முதல் நாளில்
  rationale: சொல்லுக்குச் சொல் ‘மாதத்தின் ஒன்றில்’ எனும் எபிரெய மரபுத்தொடர், மாதத்தின் முதல் நாளைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாகவும் இயல்பாகவும் தரப்பட்டது.
- source_word: הוּקַם
  choice: அமைக்கப்பட்டது
  rationale: קום என்பதன் ஹோஃபால் வடிவம் செயப்படுபொருள் சார்ந்த காரணவினைப் பொருளில் ‘நிறுவப்பட்டது/எழுப்பப்பட்டது’ எனக் குறிக்கிறது. எடுத்துச் செல்லக்கூடிய பரிசுத்தக் கூடாரத்தை ஒன்றுசேர்த்து நிறுவிய சூழலுக்கு ‘அமைக்கப்பட்டது’ இயல்பாகப் பொருந்துகிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருக்கூடாரம்
  rationale: இது யாத்திராகமத்தில் விவரிக்கப்படும் எடுத்துச் செல்லக்கூடிய இறைவழிபாட்டுப் பரிசுத்த இடத்தைக் குறிக்கிறது. ‘திருக்கூடாரம்’ அதன் கூடார வடிவத்தையும் பரிசுத்தப் பயன்பாட்டையும் சாதாரண வாசகருக்குத் தெளிவாக உணர்த்துகிறது.
