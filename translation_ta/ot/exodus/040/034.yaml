source:
  edition: WLC
  text: וַ/יְכַ֥ס הֶ/עָנָ֖ן אֶת אֹ֣הֶל מוֹעֵ֑ד וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/034.yaml
  text: Then the cloud covered the tent of meeting[a], and the glory of Yahweh filled the tabernacle.
translation:
  language: ta
  text: அப்போது மேகம் சந்திப்புக் கூடாரத்தை மூடியது; யாவே[a]யின் மகிமை திருவாசஸ்தலத்தை நிரப்பியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நான்கு எழுத்துகளைக் கொண்ட இறைத்தனிப்பெயர் יהוה (YHWH) உள்ளது; இது மரபாக ‘ஆண்டவர்’ என்றும், சில மொழிபெயர்ப்புகளில் ‘யெகோவா’ என்றும் வழங்கப்படுகிறது.
    reason: இறைத்தனிப்பெயரின் ஒலிப்பு மற்றும் மொழிபெயர்ப்பு மரபுகள் வேறுபடுவதைக் குறிப்பிடுகிறது.
lexical_decisions:
- source_word: וַיְכַס
  choice: அப்போது … மூடியது
  rationale: כסה என்பதன் அடிப்படைப் பொருளான ‘மூடு’ என்பதைக் காத்து, தொடர்கதை முன்னேற்றும் וַ־ வடிவத்தை ‘அப்போது’ வெளிப்படுத்துகிறது.
- source_word: הֶעָנָן
  choice: மேகம்
  rationale: எபிரெய உரையில் உள்ள வரையறைச் சுட்டு, முன்பே அறியப்பட்ட குறிப்பிட்ட மேகத்தைக் குறிக்கிறது; தமிழில் சூழலால் அந்த வரையறை இயல்பாகத் தெளிவாகிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: ‘சந்திப்புக்கான கூடாரம்’ என்ற இணைப்பொருளைத் தெளிவாகவும், வழிபாட்டுச் சூழலை மிகைப்படுத்தாமல் நவீன தமிழிலும் இயல்பாகவும் தருகிறது.
- source_word: כְבוֹד יְהוָה
  choice: யாவேயின் மகிமை
  rationale: כָּבוֹד குறிக்கும் வெளிப்பட்ட தெய்வீக மாட்சியை ‘மகிமை’ தெரிவிக்கிறது; יְהוָה தனிப்பெயராகவே ஒலிபெயர்க்கப்படுகிறது.
- source_word: מָלֵא
  choice: நிரப்பியது
  rationale: இங்கு மகிமை திருவாசஸ்தலத்தை முழுமையாக ஆட்கொண்டதைச் சுட்டும் வினையின் செயப்படுபொருள் கொண்ட பயன்பாட்டை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: מִשְׁכָּן என்பதன் ‘வாசஸ்தலம்’ என்ற அடிப்பொருளையும், யாத்திராகமத்தில் அது குறிக்கும் பரிசுத்தக் கூடார அமைப்பையும் ஒருங்கே தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: எபிரெய உரையில் பட்டப்பெயர் அல்லாமல் நான்கு எழுத்துகளைக் கொண்ட இறைத்தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல், பரவலாக ஏற்கப்படும் ‘யாவே’ என்ற ஒலிபெயர்ப்பில் தரப்படுகிறது; உச்சரிப்பின் வரலாற்றுச் சிக்கல் அடிக்குறிப்பால் சுட்டப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சந்திப்புக் கூடாரம்’ மற்றும் ‘திருவாசஸ்தலம்’ ஆகியவை மூலத்திலுள்ள இரண்டு வேறு பெயர்களின் வேறுபாட்டைக் காக்கின்றன.
