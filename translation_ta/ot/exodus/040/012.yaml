translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் மரியாதையும் சடங்குச் சூழலின் செறிவும் காக்கப்பட்டுள்ளன. கட்டளையின் ஒருமை வடிவம் ‘அழைத்து வந்து, ... கழுவு’ என்பதில் பாதுகாக்கப்பட்டுள்ளது.
