  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הִקְרַבְתָּ֤ אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֔י/ו אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/רָחַצְתָּ֥ אֹתָ֖/ם בַּ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/012.yaml
  text: Then bring Aaron and his sons near to the entrance of the tent of meeting, and wash them with water.
translation:
  language: ta
  text: பின்பு ஆரோனையும் அவன் மகன்களையும் சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்கு அருகே அழைத்து வந்து, அவர்களைத் தண்ணீரால் கழுவு.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: அருகே அழைத்து வந்து
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் ‘அருகே வரச் செய்’ அல்லது ‘அருகே கொண்டுவா’ என்று பொருள்படும். தமிழில் இயல்பாகவும் அதன் காரணவினைப் பொருளைத் தெளிவாகவும் காட்ட ‘அருகே அழைத்து வந்து’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אַהֲרֹן
  choice: ஆரோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட பெயர் வடிவம்.
- source_word: בָּנָיו
  choice: அவன் மகன்கள்
  rationale: எபிரெயச் சொல் ஆண் பிள்ளைகளைத் தெளிவாகக் குறிக்கிறது; ஆசாரியச் சூழலுக்கும் ‘மகன்கள்’ பொருந்துகிறது.
- source_word: פֶּתַח
  choice: நுழைவாயில்
  rationale: கூடாரத்திற்குள் செல்லும் இடத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: מוֹעֵד என்பதிலுள்ள சந்திப்பு/குறிக்கப்பட்ட சந்திப்பு என்ற கருத்தையும் אֹהֶל என்பதிலுள்ள கூடாரம் என்ற பொருளையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וְרָחַצְתָּ
  choice: கழுவு
  rationale: רחץ என்பது கழுவுதலைக் குறிக்கிறது. செய்முறையை உரையில் இருப்பதைக் காட்டிலும் குறிப்பாக்காமல் ‘கழுவு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֹתָם
  choice: அவர்களை
  rationale: ஆரோனையும் அவன் மகன்களையும் ஒன்றாகச் சுட்டுகிறது; மனிதர்களுக்குரிய மரியாதையான தமிழ் பன்மை வடிவம்.
- source_word: בַּמָּיִם
  choice: தண்ணீரால்
  rationale: בְּ இங்கு கருவிப் பொருளில் வந்து, கழுவுவதற்குப் பயன்படுத்தப்படும் சாதனமாகத் தண்ணீரைக் குறிப்பிடுகிறது.
