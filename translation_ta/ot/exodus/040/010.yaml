base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/010.yaml
  text: You shall anoint the altar of burnt offering and all its utensils[a], and you shall consecrate the altar, and the altar shall be most holy.
translation:
  language: ta
  text: தகனபலிக்கான பலிபீடத்தையும் அதன் எல்லாக் கருவிகளையும் நீ அபிஷேகம் செய்து, அந்தப் பலிபீடத்தைப் புனிதப்படுத்த வேண்டும்; பலிபீடம் மிகப் பரிசுத்தமானதாக இருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “பரிசுத்தங்களின் பரிசுத்தம்”; இது “மிகப் பரிசுத்தம்” என்று பொருள்படும் உயர்நிலைச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: நீ அபிஷேகம் செய்து
  rationale: வழிபாட்டுச் சூழலில் משׁח என்பது எண்ணெயால் அபிஷேகம் செய்து புனிதப் பணிக்கென நியமிப்பதைக் குறிக்கிறது; ‘அபிஷேகம்’ என்பது துல்லியமான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் வழக்கு.
- source_word: מִזְבַּח הָעֹלָה
  choice: தகனபலிக்கான பலிபீடம்
  rationale: எரித்து முழுமையாகச் செலுத்தப்படும் பலியோடு தொடர்புடைய குறிப்பிட்ட பலிபீடத்தை இந்த இணைப்புச் சொற்றொடர் அடையாளப்படுத்துகிறது; இத்தேர்வு தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כָּל כֵּלָיו
  choice: அதன் எல்லாக் கருவிகளையும்
  rationale: כֵּלִים என்பது பலிபீடத்துடன் பயன்படுத்தப்பட்ட பாத்திரங்கள், சாதனங்கள் உள்ளிட்ட வழிபாட்டு உபகரணங்களைக் குறிக்கும் விரிவான சொல்; ‘கருவிகள்’ அந்த விரிவைச் சுருக்காமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְקִדַּשְׁתָּ
  choice: புனிதப்படுத்த வேண்டும்
  rationale: இந்தச் சடங்குச் சூழலில் קדשׁ என்பது புனிதமானதாகப் பிரித்துவைப்பதைக் குறிக்கிறது; ‘புனிதப்படுத்த’ என்பது அதன் செயற்பாட்டு அர்த்தத்தை நேரடியாகத் தருகிறது.
- source_word: וְהָיָה
  choice: அப்போது ... இருக்கும்
  rationale: அபிஷேகம் மற்றும் புனிதப்படுத்துதலுக்குப் பின்வரும் விளைவு நிலையை வினைச்சொல் குறிக்கிறது; ‘அப்போது’ அறிவுறுத்தலுக்கும் அதன் விளைவுக்கும் உள்ள தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: மகா பரிசுத்தமானதாக
  rationale: எபிரெயச் சொல் இணைப்பு மிக உயர்ந்த அளவிலான புனிதத்தைக் குறிக்கும் உயர்நிலை வெளிப்பாடு; ‘மகா பரிசுத்தமானது’ இதைத் தமிழில் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: קֹדֶשׁ קָדָשִׁים என்ற வழிபாட்டுப் புனிதத்தன்மைச் சூத்திரத்தை மொழிபெயர்த்தல்
  choice: மகா பரிசுத்தமானதாக
  alternative: பரிசுத்தங்களின் பரிசுத்தமாக
  rationale: இங்கு இச்சொற்றொடர் உள்ளகத் திருத்தலத்தின் இடப்பெயரைக் குறிக்க வேண்டியதில்லை; பலிபீடத்தின் உச்சமான புனித நிலையைச் சுட்டும் எபிரெய உயர்நிலை அமைப்பாக உள்ளது. ஆகவே இடம்சார்ந்த பொருளைத் திணிக்காமல் அதன் வலிமை காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் வழிபாட்டுச் சூழலின் கண்ணியத்தைக் காக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் அறிவுறுத்தல் ‘நீ ... வேண்டும்’ என்று இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அதனுடன் தொடர்புடைய ‘மகா பரிசுத்தமானதாக’ என்ற சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
