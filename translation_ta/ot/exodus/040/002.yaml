  text: בְּ/יוֹם הַ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ תָּקִ֕ים אֶת מִשְׁכַּ֖ן אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/002.yaml
  text: On the first day of the first month[a], you shall set up the tabernacle, the tent of meeting.
translation:
  language: ta
  text: முதலாம் மாதத்தின் முதல் நாளில், உறைவிடக் கூடாரத்தை, சந்திப்புக் கூடாரத்தை[a] நீ அமைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை நெருக்கமான தொடர்புடைய சொற்றொடராக, “சந்திப்புக் கூடாரத்தின் உறைவிடத்தை” என்றும் மொழிபெயர்க்கலாம். எபிரெயம் பரிசுத்தக் கூடாரத்தைக் குறிக்கும் இரண்டு பெயர்களை அடுத்தடுத்து இணைக்கிறது; அவற்றை ஒரே பொருளை விளக்கும் பெயர்களாகவோ, நெருக்கமான உடைமைத் தொடர்புடைய சொற்றொடராகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/יוֹם הַ/חֹדֶשׁ הָ/רִאשׁוֹן בְּ/אֶחָד לַ/חֹדֶשׁ
  choice: முதலாம் மாதத்தின் முதல் நாளில்
  rationale: இது எபிரெய நாட்குறிப்பு மரபின் இயல்பான பொருள். சொற்சொல்லாக உள்ள ‘மாதத்தின் ஒன்றாம் நாளில்’ என்பதற்குப் பதிலாக, நவீன தமிழில் தெளிவான ‘முதல் நாளில்’ பயன்படுத்தப்பட்டது.
- source_word: תָּקִים
  choice: நீ அமைக்க வேண்டும்
  rationale: קום என்பதன் ஹிஃபில் வடிவம் இங்கு ஒன்றை நிறுத்துதல் அல்லது நிறுவுதல் என்ற பொருளில் வருகிறது. எடுத்துச் செல்லக்கூடிய பரிசுத்தக் கூடாரத்தை நிறுவுவதற்கு ‘அமைக்க’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מִשְׁכַּן
  choice: திருவுறைவிடம்
  rationale: מִשְׁכָּן என்பதன் அடிப்படைப் பொருள் ‘உறைவிடம்’; யாத்திராகமத்தில் அது பரிசுத்தமான, எடுத்துச் செல்லக்கூடிய இறை உறைவிடத்தைக் குறிக்கிறது. ‘திரு-’ என்பது அதன் பரிசுத்தப் பயன்பாட்டைச் சுருக்கமாக உணர்த்துகிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: מוֹעֵד இங்கு நியமிக்கப்பட்ட சந்திப்பைச் சுட்டுகிறது; אֹהֶל என்பது கூடாரம். ‘சந்திப்புக் கூடாரம்’ என்பது பொருளைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
theological_decisions:
- issue: מִשְׁכַּן மற்றும் אֹהֶל מוֹעֵד ஆகியவற்றின் இலக்கண உறவு
  choice: 'ஒரே பரிசுத்த அமைப்பைக் குறிக்கும் விளக்க இணைப்பு: ‘திருவுறைவிடத்தை—அதாவது, சந்திப்புக் கூடாரத்தை’'
  alternative: இறுக்கமான உடைமைத் தொடர்பாக ‘சந்திப்புக் கூடாரத்தின் திருவுறைவிடத்தை’
  rationale: எபிரெயத்தில் இரு பரிசுத்த இடப் பெயர்களும் வெளிப்படையான உடைமைச் சுட்டியின்றி அடுத்தடுத்து வருகின்றன. சூழலில் அவை இரண்டு தனிப்பட்ட பொருட்களாக அல்லாமல் ஒரே அமைப்பை இரு கோணங்களில் குறிக்கின்றன; இருப்பினும் மாற்று இலக்கணப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘அதாவது’ மற்றும் இடைக்கோடுகள் இரு பரிசுத்த இடப் பெயர்களும் ஒரே அமைப்பைக் குறிக்கின்றன என்பதைத் தெளிவாக்குகின்றன; [a] குறி சம்பந்தப்பட்ட சொற்றொடரிலேயே வைக்கப்பட்டுள்ளது.
