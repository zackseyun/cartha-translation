  source_fidelity: மூல எபிரெயத்தின் கட்டளைத் தொடரும் இடச்சுட்டான “அங்கே”யும் துல்லியமாகக் காக்கப்பட்டுள்ளன. אֲרוֹן הָעֵדוּת என்பதற்கு “சாட்சிப் பெட்டி” என வழங்கி, ‘உடன்படிக்கைப் பெட்டி’ என்று ஒத்திசைக்காமல் עֵדוּת என்பதன் பொருளைத் தக்கவைத்துள்ளது. וְסַכֹּתָ ... אֶת־הַפָּרֹכֶת என்ற செயல், திரை பெட்டியைப் பார்வையிலிருந்து மறைக்கும் தடுப்பாக அமையும் சூழலைப் பொருத்து “திரையால் அந்தப் பெட்டியை மறைக்க வேண்டும்” எனச் சரியாக வெளிப்படுத்தப்பட்டுள்ளது.
