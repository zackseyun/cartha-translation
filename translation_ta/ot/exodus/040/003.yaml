source:
  edition: WLC
  text: וְ/שַׂמְתָּ֣ שָׁ֔ם אֵ֖ת אֲר֣וֹן הָ/עֵד֑וּת וְ/סַכֹּתָ֥ עַל הָ/אָרֹ֖ן אֶת הַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/003.yaml
  text: And you shall place there the ark of the testimony[b][a], and you shall screen the ark with the curtain.
translation:
  language: ta
  text: நீ அங்கே சாட்சிப் பெட்டியை[b] வைக்க வேண்டும்; திரையால்[a] அந்தப் பெட்டியை மறைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மறைப்புத் திரை.” எபிரெயச் சொல், திருவாசஸ்தலத்தின் உள்பகுதியில் பெட்டியைப் பார்வையிலிருந்து மறைத்த திரையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சில மொழிபெயர்ப்புகளில் மரபாக “உடன்படிக்கைப் பெட்டி” என வழங்கப்படுகிறது; ஆனால் இங்குள்ள எபிரெயச் சொற்றொடர் “சாட்சிப் பெட்டி” என்பதாகும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: நீ ... வைக்க வேண்டும்
  rationale: அறிவுறுத்தல் தொடரில் மோசேக்குக் கொடுக்கப்படும் கட்டளையை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்டுள்ள திருவாசஸ்தலத்தைச் சுட்டுகிறது; மூலத்தின் இடச்சுட்டுப் பொருளை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: אֲרוֹן הָעֵדוּת
  choice: சாட்சிப் பெட்டி
  rationale: எபிரெயச் சொற்றொடரின் நேர்ப்பொருள் ‘சாட்சியின் பெட்டி.’ பழக்கமான ‘உடன்படிக்கைப் பெட்டி’ என்ற சொல்லோடு ஒத்திசைக்காமல், மூலத்திலுள்ள עֵדוּת என்பதன் ‘சாட்சி’ பொருள் காக்கப்படுகிறது.
- source_word: וְסַכֹּתָ
  choice: மறைக்க வேண்டும்
  rationale: סכך என்பது மூடுதல், பார்வையிலிருந்து மறைத்தல், தடுப்பாக அமைத்தல் ஆகிய பொருள்களைக் கொண்டது. இங்கு திரை பெட்டியின் மேல் போர்த்தப்படாமல், அதை மறைக்கும் தடுப்பாக இருப்பதால் இத்தேர்வு பொருத்தமானது.
- source_word: עַל הָאָרֹן
  choice: அந்தப் பெட்டியை
  rationale: עַל என்பதன் அடிப்படைப் பொருள் ‘மேல்’ என்றாலும், סכך மற்றும் திரைச்சூழலில் திரையைக் கொண்டு பெட்டியைப் பார்வையிலிருந்து மறைப்பதே நோக்கம். தமிழ் வாக்கிய அமைப்பில் செயப்படுபொருளாக வழங்குவது இயல்பானது.
- source_word: הַפָּרֹכֶת
  choice: திரை
  rationale: פָּרֹכֶת என்பது திருவாசஸ்தலத்தின் உள்பகுதியில் பெட்டியை மறைத்த திரையைக் குறிக்கிறது. ‘திரை’ நவீன வாசகர்களுக்குத் தெளிவானதும் இயல்பானதும் ஆகும்.
theological_decisions:
- issue: திருவாசஸ்தலப் பெட்டியின் பெயர்
  choice: சாட்சிப் பெட்டி
  alternative: உடன்படிக்கைப் பெட்டி
  rationale: இவ்வசனத்தின் எபிரெய மூலத்தில் ‘உடன்படிக்கை’ என்று இல்லாமல் ‘சாட்சி’ என்றே உள்ளது. எனவே பரிச்சயமான இறையியல் சொல்லோடு ஒத்திசைக்காமல் மூலச் சொல் காக்கப்படுகிறது.
- issue: פָּרֹכֶת என்பதன் மொழிபெயர்ப்பு
  choice: திரை
  alternative: மறைப்புத் திரை / திரைச்சீலை
  rationale: எளிதில் புரியும் ‘திரை’ முதன்மை உரையில் பயன்படுத்தப்படுகிறது; அது பெட்டியை மறைக்கும் உள்திரை என்ற குறிப்பான பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியானாலும் கண்ணியமான அறிவுறுத்தல் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் ‘நீ’ வெளிப்படையாகக் காக்கப்பட்டுள்ளது; திருவாசஸ்தலச் சொற்கள் சாதாரண வாசகருக்கும் புரியுமாறு வழங்கப்பட்டுள்ளன.
