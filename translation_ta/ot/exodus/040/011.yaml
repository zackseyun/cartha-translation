  text: You shall anoint the basin and its stand[b][a], and consecrate it.
translation:
  language: ta
  text: நீர்த்தொட்டியையும் அதன் தாங்கும் அமைப்பையும்[a] அபிஷேகம் செய்து, அதைப் புனிதப்படுத்த வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் அடித்தளத்தையும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதைப் பரிசுத்தமாக்க வேண்டும்”; அதாவது, புனிதப் பயன்பாட்டிற்கெனப் பிரித்துவைக்க வேண்டும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: அபிஷேகம் செய்து
  rationale: מָשַׁח் என்பது இங்கு எண்ணெய் பூசி இறைப்பணிக்கென நியமிக்கும் சடங்குச் செயலைக் குறிக்கிறது. ‘அபிஷேகம் செய்’ என்பது நவீனத் தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் வழிபாட்டுச் சொல்; தொடர் கட்டளையை இயல்பாக அமைக்க வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַכִּיֹּר
  choice: நீர்த்தொட்டி
  rationale: כִּיּוֹר என்பது திருக்கூடாரப் பணியில் கழுவுவதற்குப் பயன்படுத்தப்பட்ட பெரிய நீர்க்கலத்தைக் குறிக்கிறது. ‘நீர்த்தொட்டி’ தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: כַּנּוֹ
  choice: அதன் தாங்கி
  rationale: כֵּן என்பது நீர்த்தொட்டியைத் தாங்கும் அமைப்பைக் குறிக்கிறது. ‘தாங்கி’ அதன் செயலையும் பொருளையும் சுருக்கமாகத் தெரிவிக்கிறது; ‘அடித்தளம்’ என்பதும் சாத்தியம்.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: அதைப் புனிதப்படுத்த வேண்டும்
  rationale: קדשׁ என்பதன் பியேல் வடிவம் இங்கு வழிபாட்டுப் பயன்பாட்டிற்கெனப் புனிதமாகப் பிரித்துவைப்பதைக் குறிக்கிறது. ‘புனிதப்படுத்து’ சடங்குச் சூழலைத் தெளிவாகக் காட்டுகிறது; ஒருமைச் சுட்டுப்பெயர் மூலத்தில் உள்ளபடியே காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: திருக்கூடாரச் சூழலில் קדשׁ என்பதன் பொருள்
  choice: புனிதப்படுத்த வேண்டும்
  alternative: பரிசுத்தமாக்க வேண்டும் / புனிதப் பயன்பாட்டிற்கெனப் பிரித்துவைக்க வேண்டும்
  rationale: இங்கு கூறப்படுவது ஒழுக்க மாற்றம் அல்ல; திருக்கூடாரப் பொருளை இறைப்பணிக்கெனப் புனிதமாக நியமிப்பதாகும். ‘புனிதப்படுத்து’ இந்தச் சடங்குப் பொருளைக் காக்கிறது; பின்னாளைய கோட்பாட்டு நுணுக்கங்களைச் சேர்ப்பதில்லை.
- issue: אֹתוֹ என்ற ஒருமைச் சுட்டுப்பெயரின் தொடர்பு
  choice: அதை
  alternative: அவற்றைப் புனிதப்படுத்த வேண்டும்
  rationale: எபிரெய மூலத்தில் ஆண்பால் ஒருமைச் சுட்டுப்பெயர் உள்ளது. அது முதன்மைப் பொருளான நீர்த்தொட்டியை—அதன் தாங்கியோடு சேர்ந்த ஒரு பொருள் அமைப்பாக—சுட்டலாம். பன்மையாக மாற்றாமல் மூலத்தின் இலக்கணத் தெளிவின்மையும் இறுக்கமும் காக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் அதேவேளையில் வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத் தொடர் கட்டளையின் இயல்பைத் தமிழில் ‘அபிஷேகம் செய்து ... புனிதப்படுத்த வேண்டும்’ என்ற அமைப்பு வெளிப்படுத்துகிறது.
