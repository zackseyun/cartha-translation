  terminology: பொன் பலிபீடம், சந்திப்புக் கூடாரம், and திரைச்சீலை are suitable, consistent cultic terms. The footnote’s alternative is better phrased as உட்பிரிக்கும் திரை, and its explanation should say that it separated the two inner sanctuary sections rather than vaguely referring to the interior.
