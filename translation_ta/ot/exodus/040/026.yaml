base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/026.yaml
  text: And he placed the gold altar in the tent of meeting[a], before the veil.
translation:
  language: ta
  text: அவன் பொன் பலிபீடத்தைச் சந்திப்புக் கூடாரத்தில் திரைச்சீலைக்கு[a] முன்பாக வைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உட்பிரிக்கும் திரை.’ எபிரெயச் சொல் பரிசுத்தக்கூடாரத்தின் இரு பகுதிகளைப் பிரித்த திரைச்சீலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: வைத்தான்
  rationale: שׂוּם என்ற வினையின் wayyiqtol வடிவம் கடந்தகாலத் தொடர்நிகழ்வைக் குறிக்கிறது. பொருளை ஒரு குறிப்பிட்ட இடத்தில் அமைத்த செயலை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்க ‘வைத்தான்’ பொருத்தமானது.
- source_word: מִזְבַּח הַזָּהָב
  choice: பொன் பலிபீடம்
  rationale: எபிரெயக் கட்டமைப்பு சொற்பட ‘பொன்னின் பலிபீடம்’ எனப் பொருள்படும். ‘பொன் பலிபீடம்’ தமிழில் இயல்பாகவும் மூலத்தின் பெயர்ச்சொல் அமைப்புக்கு நெருக்கமாகவும் உள்ளது; இவ்வசனத்தில் இல்லாத ‘தூப’ என்பதைச் சேர்க்கவில்லை.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: אֹהֶל מוֹעֵד என்பது தேவன் தம் மக்களைச் சந்திக்கும் பரிசுத்தக்கூடாரத்திற்கான நிலையான பெயர். ‘சந்திப்புக் கூடாரம்’ מוֹעֵד என்பதன் சந்திப்பு சார்ந்த பொருளைத் தெளிவாகவும் சுருக்கமாகவும் காக்கிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: இங்கு முன்னிலைச்சொல் திரைச்சீலையுடன் தொடர்புடைய இடநிலையைக் குறிக்கிறது. ‘முன்பாக’ என்பது அந்த இடவுறவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַפָּרֹכֶת
  choice: திரைச்சீலை
  rationale: פָּרֹכֶת என்பது பரிசுத்தக்கூடாரத்தின் உட்பகுதியைப் பிரித்த தொங்கும் திரையைக் குறிக்கிறது. ‘திரைச்சீலை’ அதன் பொருளை நவீனத் தமிழில் தெளிவாகக் கூறுகிறது; ‘உட்பிரிவுத் திரை’ என்பதும் விளக்கமான மாற்றாகும்.
theological_decisions:
- issue: הַפָּרֹכֶת என்பதற்கான வழிபாட்டிடம் சார்ந்த கலைச்சொல்
  choice: திரைச்சீலை
  alternative: உட்பிரிவுத் திரை
  rationale: இச்சொல் சாதாரணத் துணியை அல்லாமல் பரிசுத்தக்கூடாரத்தின் உட்பகுதியைப் பிரித்த திரையைக் குறிக்கிறது. ‘திரைச்சீலை’ மூலத்தின் நேரடிப் பொருளையும் பிற்கால வேதாகமத் தொடர்புகளுக்குரிய முக்கியத்துவத்தையும் காக்கிறது; அதற்கு அப்பாற்பட்ட சமயவிளக்கத்தை உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் வழிபாட்டிடம் சார்ந்த கண்ணியமான நடையும் பேணப்பட்டுள்ளன. எபிரெய வாக்கியத்தின் சுருக்கமும் இடவுறவும் காக்கப்பட்டுள்ளன; சூழலிலிருந்து ஊகிக்கக்கூடிய ‘தூப’ போன்ற சொற்கள் சேர்க்கப்படவில்லை.
