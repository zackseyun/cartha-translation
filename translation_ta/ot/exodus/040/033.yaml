base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/033.yaml
  text: Then he set up the courtyard around the tabernacle and the altar[a], and put up the screen for the gate of the courtyard. So Moses finished the work.
translation:
  language: ta
  text: பின்பு அவர் திருவாசஸ்தலத்தையும் பலிபீடத்தையும் சுற்றிலும் முற்றத்தை அமைத்து, முற்றத்தின் நுழைவாயிலுக்கான திரையைத் தொங்கவிட்டார்.[a] இவ்வாறு மோசே அந்த வேலையை முடித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “திரை” என்பதற்கு “துணி மறைப்பு” அல்லது “தொங்கல்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் (מָסַךְ) முற்றத்தின் நுழைவாயிலில் பொருத்தப்பட்ட துணி மறைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: அமைத்து
  rationale: ஹிஃபில் வடிவம் இச்சூழலில் ஒரு கட்டமைப்பை நிறுவுதல் அல்லது எழுப்புதல் என்பதைக் குறிக்கிறது; முற்றத்தோடு இயல்பாக இணையும் நவீன தமிழ் சொல்.
- source_word: הֶחָצֵר
  choice: முற்றத்தை
  rationale: திருவாசஸ்தல வளாகத்தைச் சுற்றிய அடைக்கப்பட்ட வெளிப்பகுதியைக் குறிக்கிறது; நவீன தமிழில் தெளிவான சொல்.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: திருவாசஸ்தலத்தையும் பலிபீடத்தையும் முற்றம் சூழ்ந்திருந்ததை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַמִּשְׁכָּן
  choice: திருவாசஸ்தலத்தை
  rationale: யாத்திராகமத்தில் உள்ள எடுத்துச் செல்லக்கூடிய பரிசுத்தக் கூடாரத்திற்கான மரபுற்ற, பொருத்தமான தமிழ்ச் சொல்.
- source_word: וְלַמִּזְבֵּחַ
  choice: பலிபீடத்தையும்
  rationale: מִזְבֵּחַ என்பதன் வழக்கமான வழிபாட்டுச் சூழல் பொருளைத் துல்லியமாகக் கொடுக்கிறது.
- source_word: וַיִּתֵּן
  choice: தொங்கவிட்டார்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘வைத்தார்’ என்றாலும், துணியாலான நுழைவுத் திரையை நிறுவிய செயலை இச்சூழலில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: מָסַךְ
  choice: திரையை
  rationale: நுழைவில் மறைப்பாக இருந்த துணித் தொங்கலைக் குறிக்கிறது; உள்திரையிலிருந்து இதனைச் சூழல் வேறுபடுத்துகிறது.
- source_word: שַׁעַר הֶחָצֵר
  choice: முற்றத்தின் நுழைவாயிலுக்கான
  rationale: שַׁעַר என்பது இங்கு துணித்திரை பொருத்தப்பட்ட முற்றத்தின் நுழைவிடத்தைக் குறிக்கிறது; ‘நுழைவாயில்’ தமிழில் தெளிவாக உள்ளது.
- source_word: וַיְכַל
  choice: முடித்தார்
  rationale: கட்டுமானப் பணி நிறைவடைந்ததை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַמְּלָאכָה
  choice: அந்த வேலையை
  rationale: முன்னர் விவரிக்கப்பட்ட முழுக் கட்டுமானப் பணியையும் சுட்டுகிறது; தமிழ் உரையில் ‘அந்த’ என்பது இச்சுட்டலை இயல்பாக்குகிறது.
