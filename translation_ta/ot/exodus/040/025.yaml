  text: And he set up the lamps before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: ta
  text: அவன் யாவேக்கு முன்பாக விளக்குகளை அமைத்து வைத்தான்[a]; யாவே மோசேக்குக் கட்டளையிட்டபடியே அவன் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொற்பட, “விளக்குகளை மேலே போகச் செய்தான்.” இச்சொற்றொடர் விளக்குகளை அமைத்து வைப்பதையோ அவற்றை ஏற்றுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ஏற்றி வைத்தான்
  rationale: עלה என்பதன் ஹிஃபில் வடிவம் சொற்பட ‘மேலே போகச் செய்தான்’ என்று பொருள்படும். விளக்குகள் குறித்த வழிபாட்டுச் சூழலில், அவற்றை நிலைநிறுத்துதல் அல்லது ஏற்றுதல் என்ற இரு தொடர்புடைய கருத்துகளையும் இச்சொற்றொடர் சுட்டலாம். ‘ஏற்றி வைத்தான்’ என்பது இயல்பான தமிழில் செயலைத் தெரிவிக்கிறது; மூலத்தின் சொற்படையான உருவகமும் மாற்றுப் பொருளும் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: הַנֵּרֹת
  choice: விளக்குகளை
  rationale: נֵרֹת என்பது பொதுவான ‘ஒளிகளை’ அல்ல, விளக்குத்தண்டில் இருந்த தனித்தனி விளக்குகளைக் குறிக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பது இடத்தையும் வழிபாட்டுச் சார்ந்த முன்னிலையையும் குறிக்கும் ‘முன்பாக / முன்னிலையில்’ என்ற வழக்கமான சொற்றொடர். ‘யாவேக்கு முன்பாக’ என்பது இவ்விரு நுணுக்கங்களையும் இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மெய்யெழுத்துப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தேவனுடைய தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: כַּאֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: முன்னர் கொடுக்கப்பட்ட கட்டளையுடன் செயல் துல்லியமாக ஒத்திருந்ததை ‘-படியே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: இக்கதைச் செயலுக்கு முன்னரே கட்டளை கொடுக்கப்பட்டிருந்ததைச் சூழல் தெளிவாக்குகிறது; தமிழில் பெயரெச்ச வடிவம் அந்த வரிசையை இயல்பாகக் காட்டுகிறது.
- source_word: אֶת מֹשֶׁה
  choice: மோசேக்குக்
  rationale: எபிரேயத்தில் மோசே கட்டளையின் நேரடி இலக்கணப் பொருளாக இருந்தாலும், தமிழில் ‘மோசேக்குக் கட்டளையிட்டார்’ என்பதே இயல்பான வேற்றுமை அமைப்பு.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: வசனம் יהוה என்ற உடன்படிக்கைப் பெயரையே நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன ஆய்வில் பரவலாக ஏற்கப்படும் உச்சரிப்புக்கு ஏற்ப தமிழில் ஒலிபெயர்க்கிறது.
- issue: விளக்குகளுக்குச் செய்யப்பட்ட செயல்
  choice: ஏற்றி வைத்தான்; அடிக்குறிப்பில் பொருள் வரம்பைத் தெரிவித்தல்
  alternative: அமைத்து வைத்தான் / கொளுத்தினான்
  rationale: எபிரேய வினை சொற்பட ‘மேலே போகச் செய்தான்’ என இருந்தாலும், விளக்குச் சூழலில் அமைத்தல் அல்லது எரியச் செய்தல் என்ற நுணுக்கம் இருக்கலாம். ஒரே பொருளை இறுதியாகத் தீர்மானிக்காமல், இயல்பான முதன்மை மொழிபெயர்ப்புடன் மாற்றுப் பொருளை அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவேக்கு முன்பாக’ வழிபாட்டுச் சூழலைக் காக்கிறது. எபிரேய வாக்கியத்தின் மீளுரைப்பைத் தமிழில் தெளிவாக்க இரண்டாம் வாக்கியத்தில் ‘அவன் செய்தான்’ சேர்க்கப்பட்டுள்ளது; புதிய தகவல் எதுவும் சேர்க்கப்படவில்லை.
