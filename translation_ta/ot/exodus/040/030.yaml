  to: அவர் சந்திப்புக் கூடாரத்துக்கும் பலிபீடத்துக்கும் நடுவில் கழுவும் தொட்டியை வைத்து, கழுவுவதற்காக அங்கே தண்ணீரை வைத்தார்.
