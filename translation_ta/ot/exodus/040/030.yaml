source:
  edition: WLC
  text: וַ/יָּ֨שֶׂם֙ אֶת הַ/כִּיֹּ֔ר בֵּֽין אֹ֥הֶל מוֹעֵ֖ד וּ/בֵ֣ין הַ/מִּזְבֵּ֑חַ וַ/יִּתֵּ֥ן שָׁ֛מָּ/ה מַ֖יִם לְ/רָחְצָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/030.yaml
  text: He placed the basin between the tent of meeting and the altar[a], and put water there for washing.
translation:
  language: ta
  text: அவர் சந்திப்புக் கூடாரத்துக்கும் பலிபீடத்துக்கும் நடுவில் கழுவும் தொட்டியை வைத்து, கழுவுவதற்காக அங்கே தண்ணீரை வைத்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: வைத்து
  rationale: שׂוּם என்பது ஒன்றை ஓர் இடத்தில் வைப்பதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் துல்லியமாகவும் ‘வைத்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַכִּיֹּר
  choice: கழுவும் தொட்டியை
  rationale: כִּיּוֹר என்பது திருக்கூடாரப் பணியில் கழுவுவதற்குப் பயன்படுத்தப்பட்ட பெரிய நீர்த்தொட்டியைக் குறிக்கிறது. வெறும் ‘தொட்டி’ என்பதைவிட ‘கழுவும் தொட்டி’ அதன் பயன்பாட்டைத் தெளிவுபடுத்துகிறது.
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: சந்திப்புக் கூடாரத்துக்கும் பலிபீடத்துக்கும் நடுவில்
  rationale: אֹהֶל מוֹעֵד என்பதன் நேர்ப்பொருள் சந்திப்புக்குரிய கூடாரம்; בֵּין...וּבֵין என்ற எபிரேய அமைப்பு தமிழில் இயல்பாக ‘...க்கும் ...க்கும் நடுவில்’ என வழங்கப்பட்டது.
- source_word: וַיִּתֵּן
  choice: ஊற்றினார்
  rationale: נָתַן அடிப்படையில் ‘வைத்தல்/கொடுத்தல்’ என்று பொருள்பட்டாலும், தண்ணீரை ஒரு தொட்டியில் இடும் செயலைத் தமிழில் இயல்பாக ‘ஊற்றினார்’ என்று கூறலாம்; இது சூழலுக்கேற்ற optimal-equivalence மொழியாக்கம்.
- source_word: שָׁמָּה
  choice: அங்கே
  rationale: இச்சொல் ‘அங்கே/அவ்விடத்தில்’ என்ற இடவினையுரிச்சொல். ‘அதில்’ என்று பொருள் விளக்கி மாற்றாமல், மூலத்தின் இடக் குறிப்பைத் தக்கவைக்க ‘அங்கே’ பயன்படுத்தப்பட்டது.
- source_word: מַיִם
  choice: தண்ணீர்
  rationale: מַיִם என்பதற்கான இயல்பான நவீனத் தமிழ் சொல் ‘தண்ணீர்’.
- source_word: לְרָחְצָה
  choice: கழுவுவதற்காக
  rationale: רָחַץ வினையின் நோக்கத்தைக் குறிக்கும் வடிவம். யார் அல்லது எதை கழுவுவது என்பதை எபிரேயம் வெளிப்படையாகக் கூறாததால், அதைக் கூட்டிச் சொல்லாமல் ‘கழுவுவதற்காக’ எனத் திறந்த நிலையில் வைக்கப்பட்டது.
theological_decisions:
- issue: கழுவும் செயலின் எழுவாய் அல்லது செயப்படுபொருள்
  choice: கழுவுவதற்காக
  alternative: அவர்கள் தங்களைக் கழுவிக்கொள்வதற்காக
  rationale: எபிரேய வசனம் இங்கு கழுவுபவர்களையோ கழுவப்படும் உடற்பகுதிகளையோ வெளிப்படையாகச் சொல்லவில்லை. சூழலிலிருந்து விளக்கத்தைச் சேர்க்காமல் மூலத்தின் பொதுத்தன்மை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘லாவர்’ போன்ற மரபுவழி அயற்சொல்லுக்குப் பதிலாக தெளிவான ‘கழுவும் தொட்டி’ பயன்படுத்தப்பட்டது; தனி அடிக்குறிப்பு தேவையில்லை.
