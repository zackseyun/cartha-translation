source:
  edition: WLC
  text: כִּי֩ עֲנַ֨ן יְהוָ֤ה עַֽל הַ/מִּשְׁכָּן֙ יוֹמָ֔ם וְ/אֵ֕שׁ תִּהְיֶ֥ה לַ֖יְלָה בּ֑/וֹ לְ/עֵינֵ֥י כָל בֵּֽית יִשְׂרָאֵ֖ל בְּ/כָל מַסְעֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/038.yaml
  text: For the cloud of Yahweh was over the tabernacle by day[a], and fire was in it by night[b], before the eyes of all the house of Israel throughout all their journeys.
translation:
  language: ta
  text: ஏனெனில், பகலில் யாவேயின் மேகம் திருக்கூடாரத்தின்மேல் இருந்தது; இரவில் அதில்[a] நெருப்பு இருந்தது. இஸ்ரவேல் குடும்பத்தார் அனைவரும் காணும்படியாக, அவர்களுடைய எல்லாப் பயணங்களிலும் இவ்வாறு இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதில்’ என்பது மேகத்தையோ திருக்கூடார அமைப்பையோ குறிக்கலாம்.
    reason: The Hebrew suffix בּוֹ has an antecedent that is not explicitly identified in the verse.
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய நிகழ்வுகளை விளக்கிச் சுருக்கமாக முடிக்கும் இணைப்புச் சொல்லாக வருகிறது.
- source_word: עֲנַן יְהוָה
  choice: யாவேயின் மேகம்
  rationale: மேகம் யாவேயோடு கொண்டுள்ள உரிமை/தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அதற்கு மேலான விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதாகமத்தின் தனிப்பட்ட இறைப் பெயரைப் பெயராகவே ஒலிபெயர்க்கிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருவுறைவிடம்
  rationale: தேவன் தங்கியிருக்கும் எடுத்துச் செல்லக்கூடிய பரிசுத்த உறைவிடத்தைக் குறிக்கும் מִשְׁכָּן என்பதன் பொருளை நவீன, கண்ணியமான தமிழில் தருகிறது.
- source_word: יוֹמָם
  choice: பகலில்
  rationale: לַיְלָה ‘இரவில்’ என்பதுடன் இணையான இயல்பான காலக் குறிப்பு.
- source_word: וְאֵשׁ תִּהְיֶה לַיְלָה בּוֹ
  choice: இரவில் அந்த மேகத்தில் நெருப்பு இருந்தது
  rationale: בּוֹ என்பதன் ஆண்பால் ஒருமை சுட்டு அருகிலுள்ள עָנָן ‘மேகம்’ என்பதைக் குறிப்பதாகப் புரிந்துகொண்டு, தமிழில் குழப்பமின்றி வெளிப்படுத்துகிறது.
- source_word: לְעֵינֵי
  choice: கண்களுக்கும் முன்பாக
  rationale: எபிரெய மொழியின் உருவகத்தைப் பாதுகாக்கும் அதே நேரத்தில் தமிழிலும் புரியத்தக்கதாக உள்ளது.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: இஸ்ரவேல் வீட்டார் அனைவரும்
  rationale: ‘இஸ்ரவேல் வீடு’ என்ற கூட்டு மக்களைக் குறிக்கும் உடன்படிக்கைச் சொல்லாட்சியைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: בְּכָל מַסְעֵיהֶם
  choice: அவர்களுடைய பயணங்கள் அனைத்திலும்
  rationale: வனாந்தரப் பயணத்தின் எல்லாக் கட்டங்களிலும் தொடர்ந்த நிலையைத் துல்லியமாகக் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக இடம்பெறும் நான்கெழுத்து இறைப் பெயரை பொதுப்பட்டமாக மாற்றாமல், தனிப்பட்ட பெயராகப் பாதுகாக்கிறது.
- issue: בּוֹ என்பதன் சுட்டுப்பொருள்
  choice: அந்த மேகத்தில்
  alternative: திருவுறைவிடத்தில் / அதன்மேல்
  rationale: இலக்கண ரீதியாக ஆண்பால் ஒருமையான בּוֹ, ஆண்பால் עָנָן ‘மேகம்’ என்பதோடு நேரடியாக ஒத்துப்போகிறது; இருப்பினும் காட்சியின் மொத்தச் சூழல் திருவுறைவிடத்தையும் உள்ளடக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய இணை அமைப்பான ‘பகலில்… இரவில்…’ பாதுகாக்கப்பட்டுள்ளது; வசனத்தின் முடிவுச் சுருக்கத் தன்மையை இயல்பாக்க ‘இவ்வாறு இருந்தது’ சேர்க்கப்பட்டுள்ளது.
