revisions:
- from: ஏனெனில், பகலில் யாவேயின் மேகம் திருவுறைவிடத்தின்மேல் இருந்தது; இரவில் அந்த மேகத்தில் நெருப்பு இருந்தது. இஸ்ரவேல் வீட்டார் அனைவரின் கண்களுக்கும் முன்பாக, அவர்களுடைய பயணங்கள் அனைத்திலும் இவ்வாறு இருந்தது.
  to: ஏனெனில், பகலில் யாவேயின் மேகம் திருக்கூடாரத்தின்மேல் இருந்தது; இரவில் அதில்[a] நெருப்பு இருந்தது. இஸ்ரவேல் குடும்பத்தார் அனைவரும் காணும்படியாக, அவர்களுடைய எல்லாப் பயணங்களிலும் இவ்வாறு இருந்தது.
  rationale: The revision uses the established term ‘திருக்கூடாரம்,’ improves the corporate visibility clause into natural modern Tamil, and removes the interpretive specification that the nighttime fire was in the cloud. The footnote preserves the source-text ambiguity without introducing a doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
