  source_fidelity: மூல எபிரேயத்தில் מָסַךְ הַפֶּתַח לַמִּשְׁכָּן என்பது கூடாரத்தின் நுழைவாயிலுக்குரிய நுழைவுத் திரையைக் குறிக்கிறது. வரைவின் “நுழைவிடத்தில் திரையை அமைத்தான்” என்பது பொருளில் நெருக்கமானது; ஆனால் திரை வெறுமனே நுழைவிடத்தில் வைக்கப்பட்டது என்ற இடப்பொருளைச் சற்றே முன்னிறுத்துகிறது. “நுழைவாயிலுக்கான திரை” மூலத்தின் தொடர்பை நேரடியாக வெளிப்படுத்துகிறது.
