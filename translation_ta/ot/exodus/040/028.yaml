  text: וַ/יָּ֛שֶׂם אֶת מָסַ֥ךְ הַ/פֶּ֖תַח לַ/מִּשְׁכָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/028.yaml
  text: And he put the screen at the entrance to the tabernacle[a].
translation:
  language: ta
  text: அவன் திருக்கூடாரத்தின் நுழைவாயிலுக்கான திரையை அமைத்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருக்கூடாரத்தின் நுழைவாயிலில் திரையை அமைத்தான்.”
    reason: எபிரேயத் தொடரில் திரைக்கும் நுழைவாயிலுக்கும் உள்ள தொடர்பை ‘நுழைவாயிலுக்கான திரை’ என்றும், திரை நிறுவப்பட்ட இடமாக ‘நுழைவாயிலில்’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: அமைத்தான்
  rationale: שׂוּם என்பதன் அடிப்படைப் பொருள் ‘வைத்தல், அமைத்தல்’ என்பதாகும். நுழைவிடத் திரையை உரிய இடத்தில் நிறுவிய செயலை ‘அமைத்தான்’ இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: מָסַךְ
  choice: திரை
  rationale: கூடார நுழைவிடத்தில் தொங்கவிடப்பட்ட மறைப்பைக் குறிக்கிறது. தமிழில் ‘திரை’ என்பது அதன் வடிவத்தையும் செயலையும் இயல்பாகக் காட்டுவதோடு, உட்புறத் ‘மறைப்புத் திரை’யிலிருந்து சூழலால் வேறுபடுத்தப்படுகிறது.
- source_word: הַפֶּתַח
  choice: நுழைவிடம்
  rationale: פֶּתַח என்பது திறப்பு, வாசல், அல்லது நுழைவிடத்தைக் குறிக்கும். இங்கு கட்டமைப்புக்குள் நுழையும் இடம் என்பதால் ‘நுழைவிடம்’ பொருத்தமானது.
- source_word: לַמִּשְׁכָּן
  choice: திருவாசஸ்தலத்தின்
  rationale: מִשְׁכָּן என்பது இறைவன் தங்கியிருக்கும் புனிதக் கூடாரத்தைக் குறிக்கிறது. நவீனத் தமிழில் நிலைபெற்ற, கண்ணியமான வேதாகமச் சொல்லாக ‘திருவாசஸ்தலம்’ பயன்படுத்தப்படுகிறது; ל முன்னொட்டு இங்கு ‘திருவாசஸ்தலத்தின் நுழைவிடம்’ என்ற உறவைக் காட்டுகிறது.
theological_decisions: []
