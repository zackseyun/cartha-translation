  text: וַ/יָּבֵ֣א אֶת הָ/אָרֹן֮ אֶל הַ/מִּשְׁכָּן֒ וַ/יָּ֗שֶׂם אֵ֚ת פָּרֹ֣כֶת הַ/מָּסָ֔ךְ וַ/יָּ֕סֶךְ עַ֖ל אֲר֣וֹן הָ/עֵד֑וּת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/021.yaml
  text: He brought the ark into the tabernacle[a], set up the veil of the screen, and screened the ark of the testimony[b], just as Yahweh had commanded Moses.
translation:
  language: ta
  text: அவர் பேழையைத் திருக்கூடாரத்திற்குள் கொண்டுவந்து, மறைப்புத் திரையை நிலைநிறுத்தி, சாட்சிப் பேழையைத் திரையிட்டு மறைத்தார்[a]. யாவே மோசேக்குக் கட்டளையிட்டபடியே அவர் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாட்சிப் பேழையை மறைத்தார்” அல்லது “சாட்சிப் பேழைக்கு முன்பாகத் திரையிட்டார்.” எபிரெய வினை, திரையின் மூலம் பேழையை மறைத்தல் அல்லது மறைவாகப் பிரித்தல் என்ற கருத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֶת הָאָרֹן
  choice: அவர் பேழையைக் கொண்டுவந்து
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் இங்கு பேழையை உள்ளே கொண்டுவருதலைக் குறிக்கிறது; தமிழில் ‘கொண்டுவந்து’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַמִּשְׁכָּן
  choice: திருக்கூடாரம்
  rationale: யாத்திராகமத்தில் מִשְׁכָּן நடமாடக்கூடிய பரிசுத்த வாழ்விடத்தைச் சுட்டுகிறது; ‘திருக்கூடாரம்’ அதன் வழிபாட்டு மற்றும் கூடார இயல்புகளைத் தெளிவாகக் காட்டுகிறது.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: மறைப்புத் திரை
  rationale: פָּרֹכֶת என்பது உட்புறத் திரை; מָסָךְ அதன் மறைக்கும் அல்லது தடுக்கும் பண்பை வலியுறுத்துகிறது. ‘மறைப்புத் திரை’ இரண்டு கருத்துகளையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: וַיָּשֶׂם
  choice: நிலைநிறுத்தி
  rationale: שׂים பொதுவாக வைப்பதைக் குறித்தாலும், இங்கு திரையை அதன் உரிய இடத்தில் நிறுவுவதே சூழல்; ‘நிலைநிறுத்தி’ அதை வெளிப்படுத்துகிறது.
- source_word: וַיָּסֶךְ עַל
  choice: மறைத்தார்
  rationale: இந்த வினை திரையின் மூலம் பார்வையிலிருந்து மறைத்தல் அல்லது மறைவாக்குதலைக் குறிக்கிறது. עַל தரும் இடவியல் நுணுக்கம் தமிழில் நேரடி செயப்படுபொருள் அமைப்பில் இயல்பாக உட்பொதிகிறது; மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲרוֹן הָעֵדוּת
  choice: சாட்சிப் பேழை
  rationale: עֵדוּת உடன்படிக்கைச் சாட்சியைக் குறிக்கிறது; விளக்க விரிவாக்கமின்றி எபிரெயச் சொல்லை நெருக்கமாகப் பேண ‘சாட்சிப் பேழை’ பயன்படுத்தப்படுகிறது.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: யாவே மோசேக்குக் கட்டளையிட்டபடியே
  rationale: இந்தத் திரும்பத் திரும்ப வரும் சூத்திரம் இறைக் கட்டளைக்கும் மோசேயின் செயலுக்கும் உள்ள துல்லிய ஒத்திசைவை எடுத்துக்காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் வழக்கமான ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை தெய்வீகப் பெயரையே நேரடியாகக் கொண்டுள்ளது. ஆகவே பட்டப்பெயரான ‘கர்த்தர்’ என்பதற்குப் பதிலாக தனிப்பெயரின் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- issue: הָעֵדוּת என்பதன் பொருள்
  choice: சாட்சி
  alternative: உடன்படிக்கை ஆவணம்
  rationale: ‘சாட்சி’ என்பது எபிரெயச் சொல்லின் திட்டமிட்ட சுருக்கத்தையும் அதன் இறையியல் செறிவையும் பேணுகிறது; ‘உடன்படிக்கை ஆவணம்’ என்பது இங்கு தேவையற்ற விளக்க விரிவாக்கமாகிவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் அதேவேளையில் வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான நடை. எபிரெய மூலத்தின் தொடர்ச்சியான வினை அமைப்பு இயல்பான தமிழ்ச் சொற்றொடராக மாற்றப்பட்டுள்ளது. அடிக்குறி [a] முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
