  text: וְ/לָקַחְתָּ֙ אֶת שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וּ/מָשַׁחְתָּ֥ אֶת הַ/מִּשְׁכָּ֖ן וְ/אֶת כָּל אֲשֶׁר בּ֑/וֹ וְ/קִדַּשְׁתָּ֥ אֹת֛/וֹ וְ/אֶת כָּל כֵּלָ֖י/ו וְ/הָ֥יָה קֹֽדֶשׁ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/009.yaml
  text: Then you shall take the anointing oil and anoint the tabernacle and all that is in it[a], and you shall consecrate it and all its furnishings[b], and it shall be holy.
translation:
  language: ta
  text: பின்பு, அபிஷேக எண்ணெயை[a] எடுத்து, திருக்கூடாரத்தையும் அதிலுள்ள அனைத்தையும் அபிஷேகம் செய். அதையும் அதன் எல்லா உபகரணங்களையும் புனிதப்படுத்து; அது புனிதமானதாக இருக்கும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல் வடிவில், “அபிஷேகத்திற்கான எண்ணெய்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “புனிதம்” என்றே உள்ளது; “மகா பரிசுத்தம்” என்று இல்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: பின்பு, … எடுத்து
  rationale: இணைப்புடன் வந்த நிறைவுவினை இங்கு தொடர்ச்சியான கட்டளையைக் குறிக்கிறது. “பின்பு” செய்முறை வரிசையையும் “எடுத்து” கட்டளைத் தொடரையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: அபிஷேக எண்ணெய்
  rationale: அபிஷேகத்திற்கென அமைந்த குறிப்பிட்ட எண்ணெயைக் குறிக்கும் இணைப்புச் சொற்றொடரைச் சுருக்கமாகவும் வழக்கமாகவும் தருகிறது.
- source_word: וּמָשַׁחְתָּ
  choice: அபிஷேகம் செய்
  rationale: புனிதப் பணிக்காக எண்ணெய் பூசும் சடங்குச் செயலை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருக்கூடாரம்
  rationale: வனாந்தரப் பரிசுத்த இடத்தைக் குறிக்கும் நிலைபெற்ற, எளிதில் புரியும் வழிபாட்டுச் சூழல் சொல்லாகும்; சொல்லின் அடிப்படைப் பொருளான ‘உறைவிடம்’ என்பதையும் சூழலுக்கேற்ற கூடார வடிவத்தையும் உணர்த்துகிறது.
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: அதிலுள்ள அனைத்தும்
  rationale: திருக்கூடாரத்தினுள் உள்ளவற்றை முழுமையாக உள்ளடக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: அதைப் புனிதப்படுத்து
  rationale: קדשׁ என்ற வினையின் இங்குள்ள பொருளான புனிதப் பயன்பாட்டுக்காகப் பிரித்துவைத்தலை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וְאֶת כָּל כֵּלָיו
  choice: அதன் எல்லா உபகரணங்களும்
  rationale: כֵּלִים என்பது பாத்திரங்கள் மட்டுமல்லாமல் பலவகைப் பயன்பாட்டுப் பொருட்களையும் குறிக்கக்கூடியதால், விரிவான “உபகரணங்கள்” பொருத்தமானது.
- source_word: וְהָיָה קֹדֶשׁ
  choice: அது புனிதமானதாக இருக்கும்
  rationale: அபிஷேகம் மற்றும் புனிதப்படுத்துதலின் விளைவாக அமையும் புனித நிலையைக் காட்டுகிறது; மூலத்தில் இல்லாத மிகையுயர்வுப் பொருளைச் சேர்க்கவில்லை.
theological_decisions:
- issue: அபிஷேகம் மற்றும் புனிதப்படுத்துதலுக்குப் பிந்தைய திருக்கூடாரத்தின் நிலை
  choice: அது புனிதமானதாக இருக்கும்
  alternative: அது மகா பரிசுத்தமானதாக இருக்கும்
  rationale: எபிரெய உரையில் கֹדֶשׁ (‘புனிதம்’) என்றே உள்ளது; קֹדֶשׁ קָדָשִׁים (‘மகா பரிசுத்தம்’) என்ற மிகையுயர்வு வடிவம் இல்லை. ஆகவே அருகிலுள்ள வசனங்களிலிருந்தோ மரபிலிருந்தோ வலுவான நிலையை இங்கு இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை முன்னிலை கட்டளை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. சடங்குச் சூழலைத் தெளிவாகக் காட்ட “அபிஷேகம்,” “திருக்கூடாரம்,” “புனிதப்படுத்து” ஆகிய பொதுவாக அறியப்படும் மரியாதைமிக்க சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
