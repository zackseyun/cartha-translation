base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/027.yaml
  text: And he burned fragrant incense on it[a], just as Yahweh had commanded Moses.
translation:
  language: ta
  text: யாவே மோசேக்குக் கட்டளையிட்டபடியே, மோசே அதன்மேல் நறுமணத் தூபத்தை[a] எரித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நறுமணப் பொருள்களால் செய்யப்பட்ட தூபம்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் நறுமணப் பொருள்களால் தயாரிக்கப்பட்ட தூபத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: எரித்தான்
  rationale: கִטר என்பதன் ஹிஃபில் வடிவம், பலிபீடத்தில் ஒரு பொருளைப் புகையாக எழும்பச் செய்வதைக் குறிக்கிறது. தூபம் என்ற செயப்படுபொருளுடன் ‘எரித்தான்’ என்பது இயல்பாகவும் மூலத்தின் வழிபாட்டுச் சூழலைப் பாதுகாப்பதாகவும் உள்ளது.
- source_word: עָלָיו
  choice: அதன்மேல்
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட தூபப் பலிபீடத்தையே ஆண்பால் ஒருமை பின்னொட்டு சுட்டுகிறது; தமிழில் ‘அதன்மேல்’ தெளிவும் இயல்பும் உடையது.
- source_word: קְטֹרֶת סַמִּים
  choice: நறுமணத் தூபம்
  rationale: இந்த எபிரெயச் சொற்றொடர் நறுமணப் பொருள்களால் செய்யப்பட்ட தூபத்தைக் குறிக்கிறது. ‘நறுமணத் தூபம்’ சுருக்கமான, இயல்பான தமிழாக்கம்.
- source_word: כַּאֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: செயல் இறைக் கட்டளைக்கு முற்றிலும் இணங்க நடந்ததை ‘படியே’ தெளிவாகக் காட்டுகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: முன்னரே கொடுக்கப்பட்ட கட்டளையைத் தமிழில் இயல்பான சார்பெச்சத் தொடராகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரின் பரவலான தமிழ்ச் சொல்பெயர்ப்பாக வழங்குகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: எபிரெயப் பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் ஒரு பட்டம் அல்ல, இறைவனின் தனிப்பட்ட திருப்பெயரே நேரடியாக உள்ளது. ஆகவே அதைத் தலைப்புச் சொல்லால் மாற்றாமல் ஒலிபெயர்ப்பாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தூபம் காட்டினான்’ என்பதற்குப் பதிலாக, மூல வினையின் புகையாக எழச் செய்யும் பொருளை நேரடியாகப் பாதுகாக்க ‘தூபத்தை எரித்தான்’ தேர்ந்தெடுக்கப்பட்டது.
