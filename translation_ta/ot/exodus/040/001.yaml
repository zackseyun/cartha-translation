lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு … பேசிக் கூறியதாவது
  rationale: வாவ் தொடர்கதை முன்னேற்றத்தைக் குறிக்கிறது; דִּבֵּר தெய்வீக உரையை அறிமுகப்படுத்துவதால், நவீன தமிழில் இயல்பாகவும் அடுத்த வசனத்திலுள்ள நேரடி உரைக்கு ஏற்றவாறும் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு மெய்யெழுத்துகளைக் கொண்ட இறைப்பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: לֵאמֹר
  choice: 'கூறியதாவது:'
  rationale: வரவிருக்கும் நேரடி உரையை அறிமுகப்படுத்தும் எபிரெய வழக்கைத் தமிழில் இயல்பாகக் காட்டுகிறது; இரட்டிப்பைத் தவிர்க்க דִּבֵּר உடன் ஒருங்கிணைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூலத்தில் பட்டம் அல்ல, தனிப்பட்ட இறைப்பெயரே உள்ளது. ஆகவே அதை ‘ஆண்டவர்’ என மாற்றாமல் ஒலிபெயர்த்து, மாற்று ஒலிபெயர்ப்பை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில், எபிரெய உரை அறிமுகச் சூத்திரத்தின் பொருளும் தொடர்கதை நகர்வும் பாதுகாக்கப்பட்டுள்ளன.
