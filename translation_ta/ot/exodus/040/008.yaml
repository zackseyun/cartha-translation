- from: முற்றத்தைச் சுற்றிலும் அமைத்து, முற்றத்தின் வாசலுக்கான திரையை[a] மாட்ட வேண்டும்.
  to: முற்றத்தைச் சுற்றிலும் அமைக்க வேண்டும்; முற்றத்தின் வாசலுக்கான திரையைப் பொருத்த வேண்டும்.
