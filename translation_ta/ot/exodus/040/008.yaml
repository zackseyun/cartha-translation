translation_notes:
  register: நவீன நிலையான தமிழில், கட்டுமான அறிவுறுத்தலுக்கேற்ற நேரடியான கட்டளை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மாட்ட வேண்டும்’ என்பது தொங்கும் வாசல் திரையை நிறுவும் செயலை சாதாரண வாசகருக்குத் தெளிவாகக் காட்டுகிறது.
