base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/008.yaml
  text: And you shall set up the courtyard all around[a], and put up the screen for the gate of the courtyard.
translation:
  language: ta
  text: முற்றத்தைச் சுற்றிலும் அமைக்க வேண்டும்; முற்றத்தின் வாசலுக்கான திரையைப் பொருத்த வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: அமைத்து
  rationale: שׂים என்பது ‘வை, நிறுவு, அமை’ என்ற பரந்த பொருளுடையது; திருக்கூடாரக் கட்டுமானச் சூழலில் முற்றத்தை நிறுவுவதைக் குறிக்க ‘அமைத்து’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הֶחָצֵר
  choice: முற்றத்தை
  rationale: חָצֵר இங்கு திருக்கூடாரத்தைச் சூழ்ந்த திறந்த முற்றத்தைக் குறிக்கிறது; நவீனத் தமிழில் ‘முற்றம்’ தெளிவான சொல்.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: முழுவதுமாகச் சூழ்ந்திருக்கும் அமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְנָתַתָּ
  choice: மாட்ட வேண்டும்
  rationale: נתן அடிப்படையில் ‘வை’ என்று பொருள்பட்டாலும், நுழைவிடத்தில் தொங்கும் திரையை நிறுவும் இச்சூழலில் ‘மாட்டு’ என்பது இயல்பான தமிழ் வினை.
- source_word: מָסַךְ
  choice: திரை
  rationale: முற்றத்தின் நுழைவிடத்தில் தொங்கவிடப்பட்ட மறைப்பைக் குறிக்கும் מָסָךְ என்பதற்கு ‘திரை’ எளிமையானதும் பொருத்தமானதும் ஆகும்; அதன் மறைக்கும் செயல்பாடு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שַׁעַר הֶחָצֵר
  choice: முற்றத்தின் வாசலுக்கான
  rationale: இக்கட்டமைப்பு முற்றத்தின் நுழைவாயிலை அடையாளப்படுத்துகிறது; துணித் திரை பொருத்தப்படும் இடம் என்பதால் ‘வாசலுக்கான’ என்பது இயல்பாக இணைகிறது.
