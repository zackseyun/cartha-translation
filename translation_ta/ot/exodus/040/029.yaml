  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אֵת֙ מִזְבַּ֣ח הָ/עֹלָ֔ה שָׂ֕ם פֶּ֖תַח מִשְׁכַּ֣ן אֹֽהֶל מוֹעֵ֑ד וַ/יַּ֣עַל עָלָ֗י/ו אֶת הָ/עֹלָה֙ וְ/אֶת הַ/מִּנְחָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/029.yaml
  text: And he set the altar of burnt offering at the entrance to the tabernacle of the tent of meeting, and offered on it the burnt offering and the grain offering, just as Yahweh had commanded Moses.
translation:
  language: ta
  text: அவர் தகனபலிப் பீடத்தைச் சந்திப்புக் கூடாரமாகிய திருவுறைவிடத்தின் நுழைவாயிலில் வைத்து, அதன்மேல் தகனபலியையும் தானியபலியையும் செலுத்தினார்; யாவே மோசேக்குக் கட்டளையிட்டபடியே செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: தகனபலிப் பீடம்
  rationale: עֹלָה முழுமையாக எரிக்கப்படும் பலியைக் குறிக்கும் நிலையான வழிபாட்டுச் சொல்; அதன் பண்பைத் தெளிவாகக் காட்ட ‘தகனபலிப் பீடம்’ என வழங்கப்பட்டுள்ளது.
- source_word: שָׂם
  choice: வைத்து
  rationale: கூடாரப் பொருட்களை உரிய இடத்தில் நிறுவும் இச்சூழலில் இயல்பான நவீனத் தமிழ் வினைச்சொல்.
- source_word: פֶּתַח
  choice: நுழைவாயிலில்
  rationale: கூடாரத்தின் திறப்பு அல்லது நுழையும் இடம் என்ற இடவியல் பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரமாகிய திருவுறைவிடம்
  rationale: מִשְׁכָּן என்பதன் ‘உறைவிடம்’ கருத்தையும் אֹהֶל מוֹעֵד என்பதன் ‘சந்திப்புக் கூடாரம்’ என்ற தனிப்பெயரையும் காத்து, அடுக்கப்பட்ட எபிரெயச் சொற்றொடரை வாசிக்க இயல்பான தமிழில் இணைக்கிறது.
- source_word: וַיַּעַל עָלָיו
  choice: அதன்மேல் ... செலுத்தினார்
  rationale: பலியைப் பீடத்தின்மேல் ஏறச்செய்தல் என்ற சொற்பிறப்புச் சித்திரத்தைத் தமிழில் செயற்கையாக மாற்றாமல், பலியிடும் சடங்குச் செயலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: முழுமையாக எரிக்கப்படும் עֹלָה பலிவகைக்கான துல்லியமான, வழக்கிலுள்ள தமிழ் இணைச்சொல்.
- source_word: הַמִּנְחָה
  choice: தானியபலி
  rationale: ஆசாரிய வழிபாட்டுச் சூழலில் מִנְחָה பொதுவான காணிக்கையை அல்லாமல் தானியத்தால் செய்யப்படும் பலிவகையைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெயத் திருப்பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: யாவே மோசேக்குக் கட்டளையிட்டபடியே
  rationale: முன்னரே கொடுக்கப்பட்ட கட்டளைக்கு மோசே துல்லியமாகக் கீழ்ப்படிந்ததை ‘கட்டளையிட்டபடியே’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக வருவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: עֹלָה என்ற பலிவகையின் பொருள்
  choice: தகனபலி
  alternative: மேலேற்றப்படும் பலி
  rationale: சொல்லின் ஏறுதல் சார்ந்த உருவகத்தைவிட, இவ்வாசாரியச் சூழலில் குறிக்கப்படும் முழுவதும் எரிக்கப்படும் பலிவகையைத் தெளிவாக அடையாளப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சந்திப்புக் கூடாரமாகிய திருவுறைவிடம்’ என்பது எபிரெயத்தில் அடுத்தடுத்து வரும் இரு புனித இடப்பெயர்களையும் காக்கும் இயல்பான தமிழ் அமைப்பு.
