revisions:
- from: அவர் தகனபலிப் பீடத்தைச் சந்திப்புக் கூடாரமாகிய திருவுறைவிடத்தின் நுழைவாயிலில் வைத்து, யாவே மோசேக்குக் கட்டளையிட்டபடியே, அதன்மேல் தகனபலியையும் தானியபலியையும் செலுத்தினார்.
  to: அவர் தகனபலிப் பீடத்தைச் சந்திப்புக் கூடாரமாகிய திருவுறைவிடத்தின் நுழைவாயிலில் வைத்து, அதன்மேல் தகனபலியையும் தானியபலியையும் செலுத்தினார்; யாவே மோசேக்குக் கட்டளையிட்டபடியே செய்தார்.
  rationale: The sole revision restores the Hebrew order by placing the concluding obedience formula after the two cultic actions. ‘செய்தார்’ makes explicit that the formula qualifies the preceding actions, without adding substantive meaning.
