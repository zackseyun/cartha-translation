  terminology: ‘தகனபலிப் பீடம்,’ ‘தகனபலி,’ ‘தானியபலி,’ and ‘யாவே’ are suitable and consistent renderings. ‘சந்திப்புக் கூடாரமாகிய திருவுறைவிடம்’ preserves the twofold designation of the sanctuary and may stand.
