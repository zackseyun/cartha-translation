  text: וְ/אֶת בָּנָ֖י/ו תַּקְרִ֑יב וְ/הִלְבַּשְׁתָּ֥ אֹתָ֖/ם כֻּתֳּנֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/014.yaml
  text: And you shall bring near his sons and clothe them with tunics[a].
translation:
  language: ta
  text: அவனுடைய மகன்களையும் அருகில் வரச்செய்து, அவர்களுக்கு அங்கிகளை அணிவிப்பாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனுடைய மகன்களை முன்னிறுத்தி” அல்லது “அருகில் கொண்டுவந்து” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல், பரிசுத்தப் பணிக்காக ஒருவரை முறைப்படி அருகில் கொண்டுவரும் பொருளை அடிக்கடி தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת בָּנָיו
  choice: அவனுடைய மகன்களையும்
  rationale: வாவ் இணைப்பும் நேரடி வேற்றுமை உருபும் தொடரும் கட்டளையில் ஆரோனுடைய ஆண் பிள்ளைகளைக் குறிக்கின்றன; ‘மகன்கள்’ பாலினத்தையும் ஆசாரியச் சூழலையும் துல்லியமாகக் காக்கிறது.
- source_word: תַּקְרִיב
  choice: அருகில் வரச்செய்து
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் ‘அருகில் கொண்டுவருதல்/முன்னிறுத்துதல்’ என்னும் பொருளையும் பரிசுத்தப் பணிக்காக அணுகச்செய்யும் சடங்குசார் நுட்பத்தையும் கொண்டுள்ளது. தமிழில் ‘அருகில் வரச்செய்து’ causative உணர்வை இயல்பாகக் காக்கிறது.
- source_word: וְהִלְבַּשְׁתָּ אֹתָם
  choice: அவர்களுக்கு ... அணிவிப்பாய்
  rationale: வினைச்சொல்லின் causative பொருள், அவர்களை அந்த ஆடைகளை அணியச் செய்வது. ‘அணிவிப்பாய்’ அதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כֻּתֳּנֹת
  choice: நீளங்கிகள்
  rationale: כֻּתֹּנֶת உடல்மீது அணியும் நீளமான உள்ளாடை/அங்கி வகையைக் குறிக்கிறது. ‘நீளங்கிகள்’ நவீன தமிழில் புரிந்துகொள்ளத்தக்கது; மூலத்தில் இவ்வசனத்தில் இல்லாத ‘நார்ப்பட்டு’ போன்ற பொருள் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: קרב என்பதன் ஆசாரிய/சடங்குசார் நுட்பம்
  choice: அருகில் வரச்செய்து
  alternative: முன்னிறுத்தி
  rationale: ஆரோனின் மகன்களை ஆசாரியப் பணிக்காக அணுகச்செய்யும் சூழலை இந்தச் சொற்றொடர் காக்கிறது; அதேவேளையில், எதன் அருகில் என்பது மூலத்தில் சொல்லப்படாததால் அதைச் சேர்த்து விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை. கட்டளைத் தொடரின் எதிர்கால வடிவம் காக்கப்பட்டுள்ளது; சடங்குசார் நுட்பம் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
