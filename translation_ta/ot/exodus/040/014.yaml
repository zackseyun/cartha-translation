    issue: ‘நீளங்கிகள்’ adds a potentially over-specific nuance.
    rationale: כֻּתֳּנֹת denotes tunics, but the verse itself does not characterize them as long garments. ‘அங்கிகள்’ is a safer, natural equivalent.
  revised_text: அவனுடைய மகன்களையும் அருகில் வரச்செய்து, அவர்களுக்கு அங்கிகளை அணிவிப்பாய்.[a]
