  text: But if the cloud did not rise[a], they did not set out until the day it rose.
translation:
  language: ta
  text: ஆனால், மேகம் மேலெழாதிருந்தால், அது மேலெழுந்த நாள்வரை அவர்கள் புறப்படவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... விட்டால்
  rationale: முந்தைய வசனத்தின் நிலைக்கு மாறான நிபந்தனையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: לֹא יֵעָלֶה הֶעָנָן
  choice: மேகம் மேலெழும்பாவிட்டால்
  rationale: עלה என்பதன் ‘மேலே போதல்/எழும்புதல்’ என்ற இயக்கத்தைச் சூழலுக்கேற்ற தெளிவான தமிழில் தருகிறது; எபிரெயத்தில் வெளிப்படையாக இல்லாத செயப்பாட்டு நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: וְלֹא יִסְעוּ
  choice: அவர்கள் புறப்படவில்லை
  rationale: נסע என்பது முகாமிலிருந்து பயணத்தைத் தொடங்குவதைக் குறிக்கிறது; ‘புறப்படவில்லை’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: עַד יוֹם הֵעָלֹתוֹ
  choice: அது மேலெழும்பும் நாள்வரை
  rationale: ‘அது மேலெழும்புதல் நிகழும் நாள் வரை’ என்ற எபிரெயக் காலச் சொற்றொடரை, ‘நாள்’ என்பதைக் காத்து இயல்பான தமிழில் வழங்குகிறது; ‘அது’ மேகத்தைக் குறிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் நிபந்தனை–விளைவு அமைப்பும் ‘நாள்’ என்ற வெளிப்பாடும் பாதுகாக்கப்பட்டுள்ளன.
