revisions:
- from: ஆனால் மேகம் மேலெழும்பாவிட்டால், அது மேலெழும்பும் நாள்வரை அவர்கள் புறப்படவில்லை.
  to: ஆனால், மேகம் மேலெழாதிருந்தால், அது மேலெழுந்த நாள்வரை அவர்கள் புறப்படவில்லை.
  rationale: The revision preserves the Hebrew conditional structure and the explicit “day,” while aligning the Tamil temporal clause with the past narrative and the completed event that permits departure. No footnote is needed because the rendering retains the source's sense without introducing a material interpretive choice.
