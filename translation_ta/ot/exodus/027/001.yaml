translation_notes:
  register: நவீனத் தரத் தமிழில், கட்டளையின் தன்மையைத் தெளிவாகவும் கண்ணியமாகவும் வெளிப்படுத்தும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் அளவுகளும் சதுர வடிவமும் மாற்றமின்றிப் பாதுகாக்கப்பட்டுள்ளன. வழங்கப்பட்ட ஆங்கில அடிக்குறிப்பு தவறான இடத்தில் இணைக்கப்பட்டிருப்பதாலும், ‘square’ என்பதற்கான பொருத்தமான தமிழ் மொழிபெயர்ப்பு தெளிவாக இருப்பதாலும் அது சேர்க்கப்படவில்லை.
