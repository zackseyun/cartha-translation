source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ אֶת הַ/מִּזְבֵּ֖חַ עֲצֵ֣י שִׁטִּ֑ים חָמֵשׁ֩ אַמּ֨וֹת אֹ֜רֶךְ וְ/חָמֵ֧שׁ אַמּ֣וֹת רֹ֗חַב רָב֤וּעַ יִהְיֶה֙ הַ/מִּזְבֵּ֔חַ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/001.yaml
  text: You shall make the altar of acacia wood[a], five cubits long and five cubits wide; the altar shall be square, and its height shall be three cubits.
translation:
  language: ta
  text: அகாசியா மரத்தால் பலிபீடத்தைச் செய்ய வேண்டும். அது ஐந்து முழம் நீளமும் ஐந்து முழம் அகலமும் கொண்டிருக்க வேண்டும். பலிபீடம் சதுரமாகவும் மூன்று முழம் உயரமாகவும் இருக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செய்ய வேண்டும்
  rationale: கூடார அமைப்புக்கான கட்டளைகளின் சூழலில், இணைப்புடன் வரும் இந்த வினைவடிவம் கட்டளையின் வலிமையைக் கொண்டுள்ளது. நவீன தமிழில் ‘செய்ய வேண்டும்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: பலிகள் செலுத்தப்படும் பீடத்தைக் குறிக்கும் מִזְבֵּחַ என்பதற்கான தெளிவான, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: עֲצֵי שִׁטִּים
  choice: அகாசியா மரம்
  rationale: குறிப்பிட்ட மரவகையையும் அது கட்டுமானப் பொருளாகப் பயன்படுத்தப்படுவதையும் நவீன வாசகர்களுக்குத் தெளிவாகக் காட்டுகிறது.
- source_word: חָמֵשׁ אַמּוֹת אֹרֶךְ
  choice: ஐந்து முழம் நீளம்
  rationale: אַמָּה என்ற பண்டைய நீள அலகுக்கு வழக்கமான தமிழ் வேதாகம அளவுச் சொல்லான ‘முழம்’ பயன்படுத்தப்பட்டுள்ளது; பரிமாணம் இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: וְחָמֵשׁ אַמּוֹת רֹחַב
  choice: ஐந்து முழம் அகலம்
  rationale: முந்தைய பரிமாணத்துக்கு இணையான அமைப்பில் அகலம் தெளிவாகக் கூறப்பட்டுள்ளது.
- source_word: רָבוּעַ יִהְיֶה
  choice: சதுரமாக இருக்க வேண்டும்
  rationale: רָבוּעַ நான்கு சம பக்கங்களைக் கொண்ட வடிவத்தை இங்கு குறிக்கிறது; ‘சதுரம்’ நவீன தமிழில் துல்லியமும் இயல்பும் கொண்டது.
- source_word: וְשָׁלֹשׁ אַמּוֹת קֹמָתוֹ
  choice: மூன்று முழம் உயரமாக இருக்க வேண்டும்
  rationale: கֹמָה குறிக்கும் உயரத்தையும் உடைமைப் பின்னொட்டால் பலிபீடத்தின் உயரமே குறிப்பிடப்படுவதையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
