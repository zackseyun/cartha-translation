- source_word: לְהַעֲלֹת נֵר
  choice: விளக்கு எரியும்படி செய்ய
  rationale: சொல்லர்த்தமாக விளக்கை ‘எழும்பச் செய்தல்’ என்ற எபிரேய மரபுத்தொடர் அதை ஏற்றி எரியவைத்தல் அல்லது அதன் சுடரைப் பேணுதல் என்று பொருள்படும். தமிழ் வடிவம் காரணவினை நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: תָּמִיד
  choice: தொடர்ந்து
  rationale: ஆசரிப்புக்கூடச் சூழலில் இச்சொல் ஒழுங்காகத் தொடரும் பராமரிப்பைக் குறிக்கலாம்; ஒவ்வொரு கணமும் இடைவிடாமல் என்ற பொருள் கட்டாயமல்ல. ‘தொடர்ந்து’ அந்த அர்த்தப் பரப்பைத் திறந்தே வைக்கிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற உடன்படிக்கைச் சமூகப் பெயரின் பாலின வடிவம்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரேயச் சொற்றொடர் இலக்கண வடிவில் ‘மகன்கள்’ என இருந்தாலும், இச்சூழலில் முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கும் வழக்குப் பெயராகச் செயல்படுகிறது. பெண்கள் விலக்கப்பட்டனர் என்ற தேவையற்ற கோட்பாட்டுத் தீர்மானத்தை வரவழைக்காமல், மூலத்தின் சொல்லர்த்த வடிவத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: תָּמִיד குறிக்கும் தொடர்ச்சியின் தன்மை
  choice: தொடர்ந்து
  alternative: இடைவிடாமல்
  rationale: அடுத்த வசனமும் லேவியராகமம் 24:2–4-மும் ஆசாரியர்கள் விளக்குகளை ஒழுங்காகப் பராமரிப்பதைச் சொல்கின்றன. எனவே ஒவ்வொரு கணமும் முற்றிலும் இடையறாத எரிதல் என்று உரை கூறுவதாகத் தீர்மானிக்காமல் அதன் உண்மையான அர்த்தத் திறப்பைப் பேணுகிறது.
