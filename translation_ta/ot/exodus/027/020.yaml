  yaml_path: translation/ot/exodus/027/020.yaml
  text: And you shall command the sons of Israel that they bring to you pure beaten olive oil for the light[c][b][a], to cause a lamp to burn continually.
translation:
  language: ta
  text: 'நீ இஸ்ரவேல் மக்களுக்குக்[a] கட்டளையிட வேண்டும்: விளக்கொளிக்காகத் தூய, இடித்தெடுத்த[b] ஒலிவ எண்ணெயை அவர்கள் உன்னிடம் கொண்டுவர வேண்டும்; விளக்கு தொடர்ந்து[c] எரியும்படி செய்ய வேண்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “இஸ்ரவேலின் மகன்கள்”; இங்கு இந்த எபிரேயச் சொற்றொடர் இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “இடித்தெடுத்த” என்பதை “நசுக்கியெடுத்த” என்றும் மொழிபெயர்க்கலாம். இது ஒலிவப் பழங்களை வழக்கமாகப் பிழிவதற்குப் பதிலாக இடித்து எடுக்கப்பட்ட உயர்தர எண்ணெயைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ஆசரிப்புக்கூடம் தொடர்பான பயன்பாட்டில் “தொடர்ந்து” என்பது ஒவ்வொரு கணமும் இடைவிடாமல் என்பதற்குப் பதிலாக ஒழுங்காகத் தொடர்ந்து பராமரிப்பதையும் குறிக்கலாம்; யாத்திராகமம் 27:21; லேவியராகமம் 24:2–4 ஆகியவற்றை ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: וְאַתָּה
  choice: நீ
  rationale: தனிப்பட்ட சுட்டுப்பெயர் மோசேயை வலியுறுத்தி நேரடியாக விளிக்கிறது. தமிழில் வெளிப்படையான ‘நீ’ அந்த வலியுறுத்தலை இயல்பாகக் காக்கிறது; இணைப்புச் சொல்லைத் தனியே மொழிபெயர்க்காமல் விடுவது நடப்பு தமிழுக்கு ஏற்றது.
- source_word: תְּצַוֶּה
  choice: கட்டளையிட வேண்டும்
  rationale: צוה என்பதன் பியேல் வடிவம் ‘கட்டளையிடு’ என்று பொருள்படும். ‘வேண்டும்’ சட்டவழிகாட்டுதலின் கட்டாய வலிமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லர்த்தமாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு இது உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் நிலையான எபிரேயப் பெயர். ‘இஸ்ரவேல் மக்கள்’ நவீன தமிழில் இயல்பாகவும் சூழலின் கூட்டு அர்த்தத்துக்கு உண்மையாகவும் உள்ளது; சொல்லர்த்த வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: அவர்கள் உன்னிடம் கொண்டுவர வேண்டும்
  rationale: לקח அடிப்படையில் ‘எடு’ என்றாலும், אֶל (‘இடம் நோக்கி’) என்பதுடன் இவ்வழங்கல் சூழலில் தேவையான பொருளைப் பெற்று மோசேயிடம் கொண்டுவருதலைக் குறிக்கிறது.
- source_word: שֶׁמֶן זַיִת
  choice: ஒலிவ எண்ணெய்
  rationale: இக்கட்டமைப்புச் சொற்றொடர் ஒலிவப் பழத்திலிருந்து கிடைக்கும் எண்ணெயை நேரடியாகக் குறிக்கிறது.
- source_word: זָךְ
  choice: தூய
  rationale: விளக்குப் பயன்பாட்டுக்கான எண்ணெயின் தூய்மை அல்லது தெளிவைக் குறிக்கிறது. ‘தூய’ இரு நுணுக்கங்களையும் உள்ளடக்கும் இயல்பான தமிழ் சொல்.
- source_word: כָּתִית
  choice: இடித்தெடுத்த
  rationale: ஒலிவப் பழங்களை இடித்தோ நசுக்கியோ எடுக்கப்பட்ட உயர்தர எண்ணெயைக் குறிக்கிறது. ‘இடித்தெடுத்த’ தயாரிப்பு முறையைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: לַמָּאוֹר
  choice: விளக்கொளிக்காக
