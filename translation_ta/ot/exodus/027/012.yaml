revisions:
- from: முற்றத்தின் அகலத்தைப் பொறுத்தவரை, மேற்குப் பக்கத்தில்[a] ஐம்பது முழம் நீளமான திரைத் தொங்கல்கள் இருக்கும்; அவற்றுக்குப் பத்துத் தூண்களும் பத்துப் பீடங்களும்[b] இருக்கும்.
  to: முற்றத்தின் அகலத்தைப் பொறுத்தவரை, மேற்குப் பக்கத்தில்[a] ஐம்பது முழம் நீளமான தொங்குதிரைகள் இருக்கும்; அவற்றுக்குப் பத்துத் தூண்களும் பத்து அடித்தாங்கிகளும்[b] இருக்கும்.
