translation_notes:
  register: நவீன தரத் தமிழில், வழிபாட்டுக் கூடாரத்தின் கட்டுமான அறிவுறுத்தலுக்கேற்ற கண்ணியமான மற்றும் தெளிவான நடை பயன்படுத்தப்பட்டது. ‘அவற்றுக்கு’ என்பதன் மூலம் மூலத்திலுள்ள பன்மை உடைமைத் தொடர்பு காக்கப்பட்டது; எபிரெய சொல்வரிசை அப்படியே திணிக்கப்படாமல் இயல்பான தமிழாக்கம் வழங்கப்பட்டது.
