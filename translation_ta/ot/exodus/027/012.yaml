source:
  edition: WLC
  text: וְ/רֹ֤חַב הֶֽ/חָצֵר֙ לִ/פְאַת יָ֔ם קְלָעִ֖ים חֲמִשִּׁ֣ים אַמָּ֑ה עַמֻּדֵי/הֶ֣ם עֲשָׂרָ֔ה וְ/אַדְנֵי/הֶ֖ם עֲשָׂרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/012.yaml
  text: And for the width of the court on the west side[a], there shall be hangings of fifty cubits[b], with ten pillars and ten bases.
translation:
  language: ta
  text: முற்றத்தின் அகலத்தைப் பொறுத்தவரை, மேற்குப் பக்கத்தில்[a] ஐம்பது முழம் நீளமான தொங்குதிரைகள் இருக்கும்; அவற்றுக்குப் பத்துத் தூண்களும் பத்து அடித்தாங்கிகளும்[b] இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக ‘கடல் பக்கம்’; இது மேற்குத் திசையைக் குறிக்கும் வழக்கமான சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: ‘அடிக்குழிகள்’ அல்லது ‘சாக்கெட்டுகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/רֹחַב הֶֽ/חָצֵר֙
  choice: முற்றத்தின் அகலத்தைப் பொறுத்தவரை
  rationale: רֹחַב என்பது ‘அகலம்’ எனப் பொருள்படும். இணைப்புச் சொல் தொடர்ச்சியை உணர்த்துகிறது; இந்த அமைப்பு முற்றத்தின் மேற்குப் பக்க அளவைக் குறிப்பிடுவதால் இயல்பான தமிழில் இவ்வாறு தரப்பட்டது.
- source_word: לִ/פְאַת יָ֔ם
  choice: மேற்குப் பக்கத்தில்
  rationale: יָם என்பதன் நேர்ப்பொருள் ‘கடல்’; எபிரெயத் திசைவழக்கில் அது மத்தியதரைக் கடல் இருக்கும் மேற்கைக் குறிக்கிறது. פֵאָה இங்கு ‘பக்கம்’ எனப் பொருள்படுகிறது.
- source_word: קְלָעִ֖ים
  choice: திரைத் தொங்கல்கள்
  rationale: கூடார முற்றத்தைச் சுற்றி அமைக்கப்பட்ட துணித் திரைகளையே இச்சொல் குறிக்கிறது. ‘திரைத் தொங்கல்கள்’ அவற்றின் பொருளையும் கட்டடப் பயன்பாட்டையும் தெளிவாகக் காட்டுகிறது.
- source_word: חֲמִשִּׁ֣ים אַמָּ֑ה
  choice: ஐம்பது முழம் நீளமான
  rationale: அளவு நேரடியாக ‘ஐம்பது முழம்’ என்பதாகும். தமிழில் அது திரைகளின் நீள அளவு என்பதைத் தெளிவாக்க ‘நீளமான’ சேர்க்கப்பட்டது.
- source_word: עַמֻּדֵי/הֶ֣ם עֲשָׂרָ֔ה
  choice: அவற்றுக்குப் பத்துத் தூண்கள்
  rationale: עַמּוּד என்பது ‘தூண்’. மூன்றாம் நபர் பன்மை உடைமைப் பின்னொட்டை விடாமல் ‘அவற்றுக்கு’ எனக் காக்கிறது; தமிழ் சொல்வரிசையில் எண்ணிக்கை இயல்பாக முன்வைக்கப்பட்டது.
- source_word: וְ/אַדְנֵי/הֶ֖ם עֲשָׂרָֽה
  choice: பத்துப் பீடங்கள்
  rationale: אֶדֶן என்பது தூணைத் தாங்கும் அடிப்பீடம் அல்லது பொருத்துக் குழி கொண்ட தாங்கி. இங்கு சாதாரண வாசகருக்குப் புரியும் ‘பீடங்கள்’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டது.
