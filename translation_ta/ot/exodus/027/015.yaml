  text: இரண்டாம் பக்கத்திற்குப் பதினைந்து முழ நீளத் திரைகள் இருக்க வேண்டும்; அவற்றுக்கு மூன்று தூண்களும் மூன்று அடிப்பீடங்களும் இருக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לַ/כָּתֵף
  choice: பக்கத்திற்கு
  rationale: כָּתֵף என்பதன் அடிப்படைப் பொருள் ‘தோள்’; ஆனால் திருக்கூடார முற்றத்தின் கட்டமைப்புச் சூழலில் அது ஓரம் அல்லது பக்கத்தைக் குறிக்கிறது.
- source_word: הַ/שֵּׁנִית
  choice: இரண்டாம்
  rationale: எபிரெயச் சொல் நேரடியாக ‘இரண்டாம்’ என்று பொருள்படுகிறது; சூழலில் இது மறுபுறத்தைக் குறிக்கிறது.
- source_word: חְמֵשׁ עֶשְׂרֵה
  choice: பதினைந்து முழம் நீளத்திற்கு
  rationale: எபிரெயத்தில் ‘பதினைந்து’ என்று மட்டும் இருந்தாலும், முந்தைய வசனத்தின் இணையான அமைப்பிலிருந்து அளவலகான ‘முழம்’ விடுபட்டிருப்பது தெளிவாகிறது. திரைகளின் எண்ணிக்கையாகத் தவறாகப் புரிந்துகொள்ளப்படாமல், நீள அளவாக மொழிபெயர்க்கப்பட்டது.
- source_word: קְלָעִים
  choice: திரைகள்
  rationale: முற்றத்தைச் சுற்றி எல்லை அமைக்கும் நெய்யப்பட்ட தொங்குதிரைகளை இச்சொல் குறிக்கிறது. நவீன தமிழில் ‘திரைகள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: עַמֻּדֵי/הֶם
  choice: அவற்றின் தூண்கள்
  rationale: עַמּוּד என்பது இக்கட்டமைப்புச் சூழலில் திரைகளைத் தாங்கும் தூணைக் குறிக்கிறது; உடைமை விகுதியும் தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וְ/אַדְנֵי/הֶם
  choice: அவற்றின் அடிப்பீடங்கள்
  rationale: אֶדֶן என்பது தூண் நிலைநிற்கும் அடித்தளப் பகுதி அல்லது பொருத்துத் துளையுள்ள பீடத்தைக் குறிக்கிறது. ‘அடிப்பீடங்கள்’ தெளிவான பொதுநடைச் சொல்; ‘அடித்தாங்கிகள்’ என்பதும் சாத்தியம்.
