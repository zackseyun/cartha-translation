base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/018.yaml
  text: The length of the court shall be a hundred cubits[a], and the width fifty cubits, and the height five cubits, of finely twisted linen[b], with their bases of bronze.
translation:
  language: ta
  text: முற்றத்தின் நீளம் நூறு முழமும், அகலம் ஐம்பது முழமும்[a], உயரம் ஐந்து முழமும் இருக்க வேண்டும். அது நுணுக்கமாக முறுக்கப்பட்ட மெல்லிய லினன் துணியால் ஆனதாக இருக்க வேண்டும்; அதற்குரிய அடித்தளங்கள்[b] வெண்கலத்தால் ஆனவையாக இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “ஐம்பதுக்கு ஐம்பது.”
    reason: alternative_reading
  - marker: b
    text: அல்லது “அதற்குரிய பொருத்துக் குழிகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ הֶחָצֵר
  choice: முற்றத்தின் நீளம்
  rationale: வாசஸ்தலத்தைச் சுற்றியுள்ள அடைக்கப்பட்ட வெளிப்பகுதியை הֶחָצֵר குறிக்கிறது; நவீனத் தமிழில் ‘முற்றம்’ இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: מֵאָה בָאַמָּה
  choice: நூறு முழம்
  rationale: மூலத்தின் அளவலகான ‘முழம்’ மாற்றமின்றி வைக்கப்படுகிறது; நவீன அளவுக்கு மாற்றுவது உரையில் இல்லாத துல்லியத்தை உருவாக்கலாம்.
- source_word: חֲמִשִּׁים בַּחֲמִשִּׁים
  choice: ஐம்பது முழம்[a]
  rationale: சூழலில் இது முற்றத்தின் அகலத்தை ஐம்பது முழமாகக் குறிப்பிடுகிறது. எபிரெயச் சொல்லாக்கம் சொற்சொல்லாக ‘ஐம்பதுக்கு ஐம்பது’ என இருப்பதால், அதன் அசாதாரண வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְקֹמָה חָמֵשׁ אַמּוֹת
  choice: உயரம் ஐந்து முழம்
  rationale: முற்றத்தைச் சூழும் துணி மறைப்பின் செங்குத்தான அளவை நேரடியாகக் காட்டுகிறது.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: நுண்ணிய முறுக்கப்பட்ட நாரிழைத் துணி
  rationale: שֵׁשׁ என்பது வாசஸ்தலச் சூழலில் நுண்ணிய உயர்தரத் துணியையும், מָשְׁזָר முறுக்கப்பட்ட நூல் வேலையையும் குறிக்கிறது. குறிப்பிட்ட தாவர நாரை தேவையின்றி நிர்ணயிக்காமல் இரு கூறுகளையும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְאַדְנֵיהֶם
  choice: அதன் அடிப்பீடங்கள்[b]
  rationale: אַדֶן என்பது தூண்களைத் தாங்கும் உலோக அடித்தளங்கள் அல்லது பொருத்துக் குழிகளைச் சுட்டுகிறது. ‘அடிப்பீடங்கள்’ பொதுவாசகருக்கு தெளிவானது; தொழில்நுட்ப மாற்றுச் சொல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: வாசஸ்தலக் கட்டுமானப் பட்டியல்களில் இச்சொல்லுக்கு வழக்கமான மற்றும் சூழலுக்கு ஏற்ற உலோகப் பெயர் ‘வெண்கலம்’; ‘செம்பு’ என்பதும் சொற்பொருள் வாய்ப்பாக இருக்கலாம்.
