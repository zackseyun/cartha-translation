translation_notes:
  register: நவீன நிலையான தமிழில், கட்டுமான அளவுகள் தெளிவாகத் தரப்பட்டுள்ளன. எபிரெயத்தின் அசாதாரணமான அகலச் சொல்லாக்கம் பிரதான உரையில் இயல்பாக்கப்பட்டு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது. ‘இருக்க வேண்டும்’ என்ற கட்டளைநடை சூழலின் விதிமுறைத் தொனியைத் தக்கவைக்கிறது.
