revisions:
- from: முற்றத்தின் நீளம் நூறு முழமும், அகலம் ஐம்பது முழமும்[a], உயரம் ஐந்து முழமும் இருக்க வேண்டும். அது நுண்ணிய முறுக்கப்பட்ட நாரிழைத் துணியால் அமைக்கப்பட வேண்டும்; அதன் அடிப்பீடங்கள்[b] வெண்கலத்தால் ஆனவையாக இருக்க வேண்டும்.
  to: முற்றத்தின் நீளம் நூறு முழமும், அகலம் ஐம்பது முழமும்[a], உயரம் ஐந்து முழமும் இருக்க வேண்டும். அது நுணுக்கமாக முறுக்கப்பட்ட மெல்லிய லினன் துணியால் ஆனதாக இருக்க வேண்டும்; அதற்குரிய அடித்தளங்கள்[b] வெண்கலத்தால் ஆனவையாக இருக்க வேண்டும்.
  rationale: The revision restores the lexical specificity of שֵׁשׁ as linen and improves the Tamil expression for twisted workmanship. It otherwise preserves the draft’s measurements, conditional/requirement register, and its transparent footnote for the anomalous width wording. “அதற்குரிய அடித்தளங்கள்” expresses the referential relationship of the plural Hebrew suffix naturally without adding an unwarranted identification of the relevant structural elements.
