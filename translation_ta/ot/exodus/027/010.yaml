translation_notes:
  register: நவீன பொதுத்தமிழில், கட்டமைப்பு விவரங்கள் சாதாரண வாசகருக்குத் தெளிவாக இருக்கும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. வசனம் முந்தைய வசனத்தின் வாக்கியத் தொடராக இருந்தாலும், தமிழில் வாசிப்புத் தெளிவுக்காக முழு வாக்கியங்களாக அமைக்கப்பட்டது; எபிரெய மூலத்தில் உள்ள பொருள்சார் ஐயங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டன.
