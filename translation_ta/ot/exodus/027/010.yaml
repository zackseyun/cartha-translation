  text: with its twenty pillars and their twenty bronze bases[b][a], and the hooks of the pillars and their bands shall be silver.
translation:
  language: ta
  text: அதற்கான இருபது தூண்களும், அவற்றின் இருபது வெண்கல அடித்தாங்கிகளும் இருக்க வேண்டும்[a]. தூண்களின் கொக்கிகளும் அவற்றின் பட்டைகளும்[b] வெள்ளியால் செய்யப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடித்தாங்கிகள்’ என்பதற்குப் பதிலாக ‘பொருத்துக் குழியுள்ள அடிப்பீடங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பட்டைகள்’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல்லின் துல்லியமான பொருள் உறுதியற்றது; இது தூண்களைச் சுற்றிய வளையப் பட்டைகளையோ இணைப்புக் கம்பிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדָיו
  choice: அதற்கு இருபது தூண்கள்
  rationale: עַמּוּד என்பது ‘தூண்’ எனப் பொருள்படும். ஆண்பால் ஒருமை பின்னொட்டு முந்தைய வசனத்தில் கூறப்பட்ட தெற்குப் பக்கத்தைச் சுட்டுவதால், தமிழில் இயல்பாக ‘அதற்கு’ என்று வழங்கப்பட்டது.
- source_word: אַדְנֵיהֶם
  choice: அவற்றுக்கு இருபது அடித்தாங்கிகள்
  rationale: திருவாசஸ்தலக் கட்டமைப்பில் אֶדֶן என்பது தூணைத் தாங்கும் அடிப்பகுதி அல்லது பொருத்துக் குழியுள்ள தாங்கியைக் குறிக்கிறது. ‘அடித்தாங்கிகள்’ என்பது அதன் பணியைத் தெளிவாகவும் மிகையாகக் குறிப்பாக்காமலும் தெரிவிக்கிறது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: இந்தச் சொல் செம்பையோ வெண்கலத்தையோ குறிக்கலாம்; திருவாசஸ்தலப் பொருட்களின் சூழலில் மரபாகவும் பொருத்தமாகவும் ‘வெண்கலம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וָוֵי
  choice: கொக்கிகள்
  rationale: וָו என்பது திருவாசஸ்தலக் கட்டமைப்பில் பொதுவாக இணைக்க அல்லது தொங்கவிடப் பயன்படும் கொக்கிகளைக் குறிக்கிறது.
- source_word: חֲשֻׁקֵיהֶם
  choice: பட்டைகள்
  rationale: இச்சொல்லின் துல்லியமான கட்டடப் பொருள் உறுதியற்றது. ‘பட்டைகள்’ என்பது தூண்களோடு இணைந்த வெள்ளிப் பகுதிகள் என்ற பொதுவான கருத்தைப் பாதுகாத்து, ஆதாரத்தைவிட அதிகமாக விளக்குவதைக் தவிர்க்கிறது.
- source_word: כָּסֶף
  choice: வெள்ளி
  rationale: பொருளைக் குறிக்கும் நேரடியான சொல்; கொக்கிகளும் பட்டைகளும் வெள்ளியால் செய்யப்பட்டவை என்பதைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְ
  choice: -உம் / மற்றும்
  rationale: தொடக்க இணைப்பும் பட்டியலிலுள்ள ஒருங்கிணைப்புகளும் தமிழில் இயல்பான ‘-உம்’ இணைப்பால் வெளிப்படுத்தப்பட்டன.
