  text: כָּל עַמּוּדֵ֨י הֶֽ/חָצֵ֤ר סָבִיב֙ מְחֻשָּׁקִ֣ים כֶּ֔סֶף וָוֵי/הֶ֖ם כָּ֑סֶף וְ/אַדְנֵי/הֶ֖ם נְחֹֽשֶׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/017.yaml
  text: All the pillars around the courtyard shall be banded with silver[c][b][a], with their hooks of silver and their bases of bronze.
translation:
  language: ta
  text: முற்றத்தைச் சுற்றியுள்ள தூண்கள் அனைத்தும் வெள்ளிப் பட்டைகளால் இணைக்கப்பட்டிருக்க வேண்டும்[a]; அவற்றின் கொக்கிகள் வெள்ளியாலும், அவற்றின் அடித்தளங்கள்[b] வெண்கலத்தாலும்[c] செய்யப்பட்டிருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெள்ளிக் கம்பிகளால் இணைக்கப்பட்டிருக்க வேண்டும்”; இங்குள்ள எபிரெயச் சொல் தூண்களைச் சுற்றிய வெள்ளிப் பட்டை வேலை அல்லது அவற்றை இணைத்த வெள்ளிக் கம்பி வேலையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவற்றின் பொருத்துக் குழிகள்”; தூண்கள் பொருத்தப்பட்ட உலோகத் தாங்குபகுதிகளை எபிரெயச் சொல் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “வெண்கலம்” என்பதை “செம்பு” என்றும் மொழிபெயர்க்கலாம்; பழங்காலப் பயன்பாட்டில் எபிரெயச் சொல் செம்பையோ செம்புக் கலவை உலோகத்தையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עַמּוּדֵי הֶחָצֵר סָבִיב
  choice: முற்றத்தைச் சுற்றியுள்ள தூண்கள் அனைத்தும்
  rationale: முற்றத்தின் எல்லாப் பக்கங்களிலும் உள்ள கட்டமைப்புத் தூண்களின் முழுத்தொகையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: מְחֻשָּׁקִים
  choice: பட்டைகளால் இணைக்கப்பட்டிருக்க வேண்டும்
  rationale: தூண்களிலுள்ள வெள்ளிப் பட்டை அல்லது அவற்றை இணைக்கும் வெள்ளிக் கம்பி வேலை ஆகிய இரண்டுக்கும் இடமளிக்கிறது; பழமையான அல்லது தெளிவற்ற தொழில்நுட்பச் சொல்லைத் தவிர்க்கிறது.
- source_word: כֶּסֶף
  choice: வெள்ளி
  rationale: இங்கு பட்டை அல்லது இணைப்பு வேலையின் உலோகப் பொருளைக் குறிக்கிறது.
- source_word: וָוֵיהֶם
  choice: அவற்றின் கொக்கிகள்
  rationale: முற்றத் திரைகளைத் தொங்கவிடப் பயன்பட்ட பொருத்திகளைச் சூழலுக்கேற்ற வகையில் குறிக்கிறது.
- source_word: אַדְנֵיהֶם
  choice: அவற்றின் அடித்தளங்கள்
  rationale: தூண்களைத் தாங்கும் உலோகத் தாங்குபகுதிகளை எளிய நவீனத் தமிழில் குறிக்கிறது; ‘பொருத்துக் குழிகள்’ என்பதும் சாத்தியம்.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: திருக்கூடார உலோகப் பயன்பாட்டுச் சூழலில் வழக்கமான மொழிபெயர்ப்பு; எபிரெயச் சொல் செம்பையோ செம்புக் கலவையையோ குறிக்கக்கூடும் என்பதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
