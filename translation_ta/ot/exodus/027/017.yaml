  source_fidelity: 'The Tamil accurately represents the Hebrew construction: the totality of the courtyard pillars, their silver fitting/banding work, silver hooks, and bronze bases. “வெள்ளிப் பட்டைகளால் இணைக்கப்பட்டிருக்க வேண்டும்” appropriately conveys the debated sense of מְחֻשָּׁקִים without overcommitting; footnote a preserves the viable ‘silver rods/connecting work’ alternative. The material clauses and possessive referents are retained.'
