  register: நவீன நிலையான தமிழ்; கட்டுமான விவரத்தைச் சாதாரண வாசகர் புரிந்துகொள்ளும் வகையில் dignified and direct நடையில் வழங்குகிறது. மூலத்தில் உள்ள உலோகப் பொருள் மற்றும் கட்டமைப்புச் சொற்களின் உண்மையான lexical ambiguity அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
