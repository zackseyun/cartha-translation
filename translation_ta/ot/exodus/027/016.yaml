  yaml_path: translation/ot/exodus/027/016.yaml
  text: And for the gate of the courtyard there shall be a screen twenty cubits long[a], of blue, purple, and scarlet yarn, and fine twined linen, the work of an embroiderer[c][b], with their four pillars and their four bases.
translation:
  language: ta
  text: முற்றத்தின் நுழைவாயிலுக்கு, இருபது முழம் நீளமுள்ள[a] ஒரு தொங்குதிரை[b] இருக்க வேண்டும். அது நீல, ஊதா, கருஞ்சிவப்பு நிற நூல்களாலும், முறுக்கப்பட்ட மெல்லிய சணல் நூலாலும், சித்திரத் தையல் வேலைப்பாடாகச் செய்யப்பட வேண்டும். அதற்கு நான்கு தூண்களும் நான்கு அடிப்பீடங்களும்[c] இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லுக்குச் சொல் ‘இருபது முழம்’; அளவின் தன்மையைத் தெளிவாக்க ‘நீளமுள்ள’ சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘மறைப்புத்திரை’ அல்லது ‘தொங்கவிடப்பட்ட திரை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘அடிப்பீடங்கள்’ என்பதற்குப் பதிலாக ‘பொருத்துத் துளைகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשַׁעַר הֶחָצֵר
  choice: முற்றத்தின் நுழைவாயிலுக்கு
  rationale: שַׁעַר என்பது வாயில் அல்லது நுழைவாயிலைக் குறிக்கிறது; கூடார முற்றத்தின் திறந்த நுழைவுப் பகுதியை நவீனத் தமிழில் தெளிவாகக் காட்ட ‘நுழைவாயில்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מָסָךְ
  choice: தொங்குதிரை
  rationale: கூடார அமைப்பில் நுழைவிடத்தை மறைக்கும் துணித் திரையை இச்சொல் குறிக்கிறது. திடமான கதவு என்ற எண்ணத்தைத் தவிர்த்து, தொங்கவிடப்படும் திரை என்ற செயல்பாட்டை ‘தொங்குதிரை’ வெளிப்படுத்துகிறது.
- source_word: עֶשְׂרִים אַמָּה
  choice: இருபது முழம் நீளமுள்ள
  rationale: எபிரெயில் சொல்லுக்குச் சொல் ‘இருபது முழம்’ என்றே உள்ளது. கட்டிட அளவைக் குறிக்கிறது என்பதை இயல்பான தமிழில் தெளிவாக்க ‘நீளமுள்ள’ சேர்க்கப்பட்டது; இது அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: நீல, ஊதா, கருஞ்சிவப்பு நிற நூல்கள்
  rationale: மூன்று சொற்களும் கூடாரத் துணிகளில் பயன்படுத்தப்பட்ட வண்ணமூட்டிய பொருட்களைக் குறிக்கின்றன. தமிழ் வாசகருக்கு துணிநூல் சூழல் தெளிவாக இருக்க ‘நிற நூல்கள்’ என வெளிப்படுத்தப்பட்டது.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: முறுக்கப்பட்ட மெல்லிய சணல்நூல்
  rationale: שֵׁשׁ மெல்லிய linen வகை நார்த் துணிப்பொருளையும், מָשְׁזָר முறுக்கப்பட்ட அல்லது திரிக்கப்பட்ட தயாரிப்பையும் குறிக்கிறது. பருத்தி அல்லது பட்டைத் தவறாக உணர்த்தாமல் ‘சணல்நூல்’ பயன்படுத்தப்பட்டது.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: சித்திரத் தையல் கலைஞரின் கைவேலை
  rationale: இச்சொற்றொடர் வண்ண அலங்காரத் துணிவேலை அல்லது embroidery செய்யும் திறனாளரின் வேலையைக் குறிக்கிறது. தனிப்பட்ட கைவினைஞர் அமைப்பையும் திறமையான அலங்கார வேலையையும் தமிழ் சொற்றொடர் காக்கிறது.
- source_word: עַמֻּדֵיהֶם אַרְבָּעָה
  choice: அதற்குரிய தூண்கள் நான்கு
  rationale: எபிரெயில் மூன்றாம் நபர் ஆண்பால் பன்மை உடைமை விகுதி உள்ளது. தமிழில் அதன் கட்டமைப்புச் சார்பை இயல்பாகத் தெரிவிக்க ‘அதற்குரிய’ என மொழிபெயர்க்கப்பட்டது; எண்ணிக்கை முழுமையாகக் காக்கப்பட்டது.
- source_word: וְאַדְנֵיהֶם אַרְבָּעָה
  choice: அவற்றின் அடிப்பீடங்கள் நான்கு
  rationale: אֶדֶן என்பது தூணைத் தாங்கும் அடிப்பகுதி அல்லது socket. பொதுவாசகருக்குப் புரியும் ‘அடிப்பீடங்கள்’ முதன்மைச் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டு, ‘பொருத்துக் குழிகள்’ என்ற மாற்று அடிக்குறிப்பில் தரப்பட்டது.
