translation_notes:
  register: நவீன பொதுத்தமிழில் dignified கட்டிடவியல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘முற்றம்’, ‘நுழைவாயில்’, ‘தொங்குதிரை’, ‘அடிப்பீடம்’ ஆகியவை சாதாரண வாசகருக்குப் புரியும் சொற்களாகவும், கூடார அமைப்பின் தொழில்நுட்பத் தன்மையைத் தக்கவைக்கும் சொற்களாகவும் தேர்ந்தெடுக்கப்பட்டன. எபிரெயின் அளவீடும் உடைமைத் தொடர்பும் காக்கப்பட்டுள்ளன; தமிழில் தேவையான தெளிவாக்கங்கள் அடிக்குறிப்புகளால் வெளிப்படையாகச் சுட்டப்பட்டுள்ளன.
