- from: 'அதற்கு வெண்கல வலைப்பின்னல் வேலைப்பாடுள்ள ஒரு சல்லடையை[a] நீ செய்ய வேண்டும். அந்த வலைப்பின்னலின் நான்கு மூலைகளிலும்[b] நான்கு வெண்கல வளையங்களைச் செய்ய வேண்டும்.


