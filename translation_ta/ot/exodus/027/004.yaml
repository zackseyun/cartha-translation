  text: You shall make for it a grating[a], a network of bronze[b], and on the network you shall make four bronze rings at its four corners.
translation:
  language: ta
  text: 'அதற்காக வெண்கலத்தால் வலைவேலைப்பாடாகச் செய்யப்பட்ட ஒரு கிராதியை[a] நீ செய்ய வேண்டும். அந்த வலைப்பின்னலின் மேல், அதன் நான்கு மூலைகளில்[b] நான்கு வெண்கல வளையங்களைச் செய்ய வேண்டும்.


    [a] எபிரெய மொழியில், “வலையின் வேலைப்பாடான வெண்கலக் கிராதி” என்று எழுத்துப்படியாக உள்ளது. “வெண்கல வலைப்பின்னல்” அல்லது “வெண்கல வலைவேலைப்பாடு” என்றும் மொழிபெயர்க்கலாம்.


    [b] “அதன் நான்கு முனைகளில்” என்றும் மொழிபெயர்க்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “வலையின் வேலைப்பாடான வெண்கலக் கிராதி” என்று எழுத்துப்படியாக உள்ளது. “வெண்கல வலைப்பின்னல்” அல்லது “வெண்கல வலைவேலைப்பாடு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
