  text: וְ/כֵ֨ן לִ/פְאַ֤ת צָפוֹן֙ בָּ/אֹ֔רֶךְ קְלָעִ֖ים מֵ֣אָה אֹ֑רֶךְ ו/עמד/ו עֶשְׂרִ֗ים וְ/אַדְנֵי/הֶ֤ם עֶשְׂרִים֙ נְחֹ֔שֶׁת וָוֵ֧י הָֽ/עַמֻּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/011.yaml
  text: 'And likewise for the north side in length: hangings a hundred cubits long[a], its twenty pillars and their twenty bronze bases[b], and the hooks of the pillars and their bands shall be silver.'
translation:
  language: ta
  text: அதுபோலவே, வடக்குப் பக்கத்தின் நீளவாட்டில் நூறு முழம் நீளமான திரைச்சீலைகளும்[a], அவற்றின் இருபது தூண்களும், அவற்றின் இருபது வெண்கல அடித்தளங்களும் இருக்க வேண்டும். தூண்களின் கொக்கிகளும் அவற்றின் பட்டைகளும்[b] வெள்ளியால் செய்யப்பட்டிருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொற்பட ‘நூறு நீளம்’ என்றே உள்ளது; அருகிலுள்ள கூடார அளவுகளின் சூழலிலிருந்து ‘முழம்’ சேர்க்கப்பட்டுள்ளது.
    reason: cultural_note
  - marker: b
    text: இதனை ‘அவற்றைச் சுற்றிய பட்டைகள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் தூண்களோடு இணைக்கப்பட்ட அல்லது அவற்றைச் சுற்றிய பகுதிகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: அதுபோலவே
  rationale: முந்தைய பக்கத்திற்கான ஏற்பாட்டோடு இதையும் ஒப்பிட்டு இணைக்கும் எபிரெயச் சொல்லின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לִפְאַת צָפוֹן בָּאֹרֶךְ
  choice: வடக்குப் பக்கத்தின் நீளவாட்டில்
  rationale: פאה என்பதன் ‘பக்கம்/ஓரம்’ என்ற பொருளையும், באורך என்பதன் நீளத் திசையையும் தெளிவாகக் காட்டுகிறது.
- source_word: קְלָעִים
  choice: திரைச்சீலைகள்
  rationale: திருவாசல் முற்றத்தைச் சுற்றி அமைக்கப்பட்ட தொங்கும் துணித் தடுப்புகளைக் குறிக்கும்; நவீன தமிழில் எளிதில் புரியும் சொல்.
- source_word: מֵאָה אֹרֶךְ
  choice: நூறு முழம் நீளமான
  rationale: எபிரெயில் அளவின் அலகு விடுபட்டிருந்தாலும், உடனடியான சூழலில் அது ‘முழம்’ என்பது தெளிவு; இதை அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וְעַמֻּדָיו עֶשְׂרִים
  choice: அவற்றின் இருபது தூண்கள்
  rationale: பன்மைச் சுட்டுப்பெயரை திரைச்சீலை அமைப்புடன் இயல்பாக இணைத்து, பட்டியல் வடிவைப் பாதுகாக்கிறது.
- source_word: וְאַדְנֵיהֶם עֶשְׂרִים נְחֹשֶׁת
  choice: அந்தத் தூண்களுக்கான இருபது வெண்கல அடித்தளங்கள்
  rationale: אדן இங்கு தூணைத் தாங்கும் அடித்தளம் அல்லது பொருத்துத் துளையுள்ள பீடம்; ‘அடித்தளம்’ பொதுவாசகருக்கு தெளிவானது.
- source_word: וָוֵי הָעַמֻּדִים
  choice: தூண்களின் கொக்கிகள்
  rationale: தூண்களில் பொருத்தப்பட்ட பிடிப்புக் கொக்கிகளைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: וַחֲשֻׁקֵיהֶם
  choice: அவற்றின் இணைப்புப் பட்டைகள்
  rationale: தூண்களோடு தொடர்புடைய இணைக்கும் அல்லது சுற்றியமைந்த பகுதிகளைச் சொல் குறிக்கலாம்; ‘இணைப்புப் பட்டைகள்’ செயலையும் வடிவத்தையும் அளவுக்கு மீறித் தீர்மானிக்காமல் தருகிறது.
- source_word: כָּסֶף
  choice: வெள்ளி
  rationale: பொருளைக் குறிக்கும் நேரடியான, வழக்கமான மொழிபெயர்ப்பு.
