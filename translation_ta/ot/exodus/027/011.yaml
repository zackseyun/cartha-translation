translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு அமைப்பின் தொழில்நுட்ப விவரங்கள் பொதுவாசகருக்குப் புரியுமாறு கண்ணியமான நடையில் தரப்பட்டுள்ளன. எபிரெயின் பட்டியல் போன்ற அமைப்பைத் தக்கவைத்தபடியே, தமிழில் முழுமையான வாக்கியமாக இருக்க ‘இருக்க வேண்டும்’ சேர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
