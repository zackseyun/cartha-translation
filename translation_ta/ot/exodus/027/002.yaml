base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/002.yaml
  text: And you shall make its horns on its four corners[a]; its horns shall be of one piece with it[b], and you shall overlay it with bronze.
translation:
  language: ta
  text: அதன் நான்கு மூலைகளிலும் கொம்புகளைச் செய்ய வேண்டும். அந்தக் கொம்புகள் அதனோடு ஒரே துண்டாக இருக்க வேண்டும்[a]. அதை வெண்கலத்தால் மூட வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, ‘அதிலிருந்து அதன் கொம்புகள் இருக்க வேண்டும்’ என்று உள்ளது; அதாவது, கொம்புகள் தனியாக இணைக்கப்படாமல் பலிபீடத்தோடு ஒரே துண்டாக உருவாக்கப்பட வேண்டும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல்லான நெகோஷெத் என்பது வெண்கலத்தையோ செம்பையோ குறிக்கலாம்; இந்தக் கட்டுமானச் சூழலில் ‘வெண்கலம்’ என்பதே மிகச் சாத்தியமான பொருளாகத் தேர்ந்தெடுக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செய்ய வேண்டும்
  rationale: அறிவுறுத்தல் தொடரில் வரும் இந்த வினை வடிவம் கட்டளைப் பொருளைக் கொண்டுள்ளது. நவீனத் தமிழில் ‘செய்ய வேண்டும்’ என்பது அந்தக் கட்டளைத் தன்மையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: קַרְנֹתָיו
  choice: அதன் கொம்புகள்
  rationale: קֶרֶן என்பதன் நேரடிப் பொருள் ‘கொம்பு.’ பலிபீடத்தின் மூலைகளிலுள்ள கொம்பு போன்ற நீட்சிகளைக் குறிக்கும் உறுதியான உருவகத்தைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: அதன் நான்கு மூலைகளிலும்
  rationale: עַל என்பது இங்கு ‘மேல்/இல்’ என்ற இடப்பொருளைத் தருகிறது. பலிபீடத்தின் ஒவ்வொரு மூலையிலும் கொம்பு இருக்க வேண்டும் என்பதை ‘நான்கு மூலைகளிலும்’ இயல்பாகவும் தெளிவாகவும் சொல்கிறது.
- source_word: מִמֶּנּוּ תִּהְיֶיןָ קַרְנֹתָיו
  choice: அந்தக் கொம்புகள் அதனோடு ஒரே துண்டாக இருக்க வேண்டும்
  rationale: எபிரெயத்தில் நேரடியாக ‘அதிலிருந்து அதன் கொம்புகள் இருக்க வேண்டும்’ என்று உள்ளது. கட்டுமானச் சூழலில், கொம்புகள் தனியாக இணைக்கப்படாமல் பலிபீடத்தின் ஒருங்கிணைந்த பகுதிகளாக இருக்க வேண்டும் என்பதே பொருள்; ‘ஒரே துண்டாக’ என்பது அதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וְצִפִּיתָ אֹתוֹ
  choice: அதை ... மூட வேண்டும்
  rationale: צפה என்ற வினை இங்கு ஓர் உலோகத்தால் ஒரு பொருளின் மேற்பரப்பை மூடுவதையோ மேலுறையிடுவதையோ குறிக்கிறது. ‘மூட வேண்டும்’ என்பது பொருள் சேர்க்காமல் இயல்பான தமிழில் இதை வெளிப்படுத்துகிறது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: נְחֹשֶׁת என்பது சூழலைப் பொறுத்து வெண்கலத்தையோ செம்பையோ குறிக்கலாம். இந்தக் கட்டுமானச் சூழலுக்கும் பண்டைய உலோகவியல் பயன்பாட்டுக்கும் ‘வெண்கலம்’ மிகச் சாத்தியமான தேர்வு; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
