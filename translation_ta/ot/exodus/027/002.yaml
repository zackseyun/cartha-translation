translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் கட்டளைத் தொனி தக்கவைக்கப்பட்டுள்ளது. பலிபீடச் சூழலின் தெளிவான உருவகத்தைப் பாதுகாக்க ‘கொம்புகள்’ என்ற நேரடிச் சொல் பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் இரண்டு உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
