revisions:
- from: திருவுறைவிடத்தின் எல்லாப் பணிகளிலும் பயன்படும் கருவிகள் அனைத்தும், அதன் முளைகள் அனைத்தும், முற்றத்தின் முளைகள் அனைத்தும் வெண்கலத்தால்[a] செய்யப்பட்டவையாக இருக்க வேண்டும்.
  to: திருக்கூடாரத்தின் எல்லாச் சேவைக்கும் உரிய கருவிகள் அனைத்தும், அதன் எல்லா ஆணிகளும், முற்றத்தின் எல்லா ஆணிகளும் வெண்கலத்தால்[a] செய்யப்பட்டவையாக இருக்க வேண்டும்.
  rationale: The revision preserves the Hebrew list structure, renders the service relationship more closely, replaces an ambiguous Tamil term for structural pegs with a clear one, and retains the lexical ambiguity of נְחֹשֶׁת in the footnote.
