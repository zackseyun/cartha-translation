    reason: lexical_alternative
  revision_rationale: The revision preserves the Hebrew list structure, renders the service relationship more closely, replaces an ambiguous Tamil term for structural pegs with a clear one, and retains the lexical ambiguity of נְחֹשֶׁת in the footnote.
