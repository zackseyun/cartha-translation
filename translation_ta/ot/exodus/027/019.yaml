base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/019.yaml
  text: All the utensils of the tabernacle for all its service[a], and all its pegs, and all the pegs of the courtyard, shall be bronze.
translation:
  language: ta
  text: திருக்கூடாரத்தின் எல்லாச் சேவைக்கும் உரிய கருவிகள் அனைத்தும், அதன் எல்லா ஆணிகளும், முற்றத்தின் எல்லா ஆணிகளும் வெண்கலத்தால்[a] செய்யப்பட்டவையாக இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘செம்பு’; எபிரெயச் சொல் נְחֹשֶׁת செம்பையும் செம்பை அடிப்படையாகக் கொண்ட கலப்பு உலோகத்தையும் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי
  choice: கருவிகள்
  rationale: כְּלִי என்பது பலவகையான பயன்பாட்டுப் பொருட்களையும் கருவிகளையும் குறிக்கும் பரந்த சொல். இங்கு திருவுறைவிடப் பணிகளில் பயன்படும் பொருட்களை இயல்பாகக் குறிக்கிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருவுறைவிடம்
  rationale: מִשְׁכָּן என்பது கடவுள் உறையும் பரிசுத்த இடத்தைக் குறிக்கும். ‘திருவுறைவிடம்’ அதன் அடிப்படைப் பொருளையும் வழிபாட்டுச் சூழலையும் நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: בְּכֹל עֲבֹדָתוֹ
  choice: எல்லாப் பணிகளிலும் பயன்படும்
  rationale: עֲבֹדָה இங்கு திருவுறைவிடத்தில் நடைபெறும் பணியையும் சேவையையும் குறிக்கிறது. பயன்பாட்டு உறவைத் தமிழில் இயல்பாக வெளிப்படுத்த இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְתֵדֹתָיו
  choice: அதன் முளைகள்
  rationale: יָתֵד என்பது அமைப்பை நிலைநிறுத்தப் பயன்படும் முளை அல்லது ஆப்பைக் குறிக்கிறது. ‘முளைகள்’ சுருக்கமாகவும் சூழலில் புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது.
- source_word: יִתְדֹת הֶחָצֵר
  choice: முற்றத்தின் முளைகள்
  rationale: חָצֵר என்பது திருவுறைவிடத்தைச் சுற்றிய அடைக்கப்பட்ட முற்றத்தைக் குறிக்கிறது; அதனை நிலைநிறுத்தும் முளைகள் இங்கு குறிப்பிடப்படுகின்றன.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: נְחֹשֶׁת செம்பையோ செம்புக் கலப்பு உலோகத்தையோ குறிக்கலாம். திருவுறைவிடப் பொருட்களின் பட்டியலில் ‘வெண்கலம்’ என்பது மரபாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது; மூலச்சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
