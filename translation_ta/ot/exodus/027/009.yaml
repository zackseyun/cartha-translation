translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையின் இரட்டைப் தெற்குத் திசைக் குறிப்பு தக்கவைக்கப்பட்டுள்ளது; பண்டைய அளவையான ‘முழம்’ மாற்றப்படவில்லை.
