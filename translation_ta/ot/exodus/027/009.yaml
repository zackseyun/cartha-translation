  text: וְ/עָשִׂ֕יתָ אֵ֖ת חֲצַ֣ר הַ/מִּשְׁכָּ֑ן לִ/פְאַ֣ת נֶֽגֶב תֵּ֠ימָנָ/ה קְלָעִ֨ים לֶ/חָצֵ֜ר שֵׁ֣שׁ מָשְׁזָ֗ר מֵאָ֤ה בָֽ/אַמָּה֙ אֹ֔רֶךְ לַ/פֵּאָ֖ה הָ/אֶחָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/009.yaml
  text: And you shall make the court of the tabernacle. For the south side[a], southward, there shall be hangings for the court of finely twisted linen, a hundred cubits long for one side.
translation:
  language: ta
  text: “திருக்கூடாரத்தின் முற்றத்தை நீ அமைக்க வேண்டும். தெற்குப் பக்கத்திற்காக, தெற்கு நோக்கி, முற்றத்திற்கான தொங்குதிரைகள்[a] நேர்த்தியாக முறுக்கப்பட்ட மெல்லிய ஆளி நூலால் ஆனவையாக இருக்க வேண்டும்; ஒரு பக்கத்தின் நீளம் நூறு முழம்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தொங்குதிரைகள்’ என்பதற்கு ‘திரைகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் முற்றத்தின் எல்லையை உருவாக்கும் துணிப் படலங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲצַר
  choice: முற்றம்
  rationale: திருக்கூடாரத்தைச் சுற்றியுள்ள திறந்தவெளி அடைப்புப் பகுதியைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַמִּשְׁכָּן
  choice: திருக்கூடாரம்
  rationale: யாத்திராகமத்தில் இச்சொல் புனிதக் கூடாரத்தைச் சுட்டுகிறது; வழிபாட்டுச் சூழலைத் தெளிவாகக் காட்டும் பரவலாக அறியப்பட்ட தமிழ் வழக்கு.
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  choice: தெற்குப் பக்கத்தில், தெற்கு நோக்கி
  rationale: எபிரெய உரையிலுள்ள ‘தெற்குப் பக்கம்’ மற்றும் ‘தெற்கு நோக்கி’ என்ற இரட்டைப் திசை வலியுறுத்தலைச் சுருக்காமல் தக்கவைக்கிறது.
- source_word: קְלָעִים
  choice: தொங்குதிரைகள்
  rationale: முற்றத்தின் எல்லையை உருவாக்கும் தொங்கவிடப்பட்ட துணிப் படலங்களைக் குறிக்கிறது; சாதாரண உட்புறத் திரைகள் என்ற எண்ணத்தைத் தவிர்த்து அதன் கட்டமைப்புப் பணியை வெளிப்படுத்துகிறது.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: நன்றாக முறுக்கப்பட்ட மெல்லிய சணல் நூல்
  rationale: உயர்தரமான மெல்லிய சணல் நூலும் அதன் முறுக்கப்பட்ட வேலைப்பாடும் இரண்டையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מֵאָה בָאַמָּה
  choice: நூறு முழம்
  rationale: பண்டைய அளவையை மாற்றிக் கணக்கிடாமல் மூலத்தின் அளவுச் சொல்லைத் தக்கவைக்கிறது.
- source_word: אֹרֶךְ
  choice: நீளம்
  rationale: அளவுக் கூற்றைத் தமிழில் இயல்பாக ‘நீளம் நூறு முழம்’ என்று வழங்குகிறது.
- source_word: לַפֵּאָה הָאֶחָת
  choice: அந்த ஒரு பக்கம்
  rationale: முற்றத்தின் குறிப்பிட்ட ஒற்றைப் பக்கத்தைக் குறிக்கும் மூலத்தின் ஒருமையைத் தெளிவாகப் பாதுகாக்கிறது.
