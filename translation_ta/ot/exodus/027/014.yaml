revisions:
- from: ஒரு பக்கத்திற்கு, பதினைந்து முழம் நீளமுள்ள தொங்குதிரைகளும், அவற்றுக்கான மூன்று தூண்களும் மூன்று அடித்தளங்களும் இருக்க வேண்டும்.[a]
  to: ஒரு பக்கத்திற்கு பதினைந்து முழம் நீளமுள்ள தொங்குதிரைகள்; அவற்றின் மூன்று தூண்களும் அவற்றின் மூன்று அடிப்பீடங்களும் இருக்க வேண்டும்.[a]
  rationale: The revision retains the source’s measurement and architectural syntax while using a more contextually precise term for the pillar bases and a direct rendering of the Hebrew possessive suffixes. The footnote continues to preserve the legitimate ‘sockets’ alternative.
