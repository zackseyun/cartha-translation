translation_notes:
  register: நவீன தரத் தமிழில், கட்டட அமைப்பு விளக்கத்திற்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மூலத்தின் பெயர்ச்சொல் தொடர், சுற்றியுள்ள கட்டளைச் சூழலை இயல்பாக வெளிப்படுத்துவதற்காக ‘இருக்க வேண்டும்’ என நிறைவு செய்யப்பட்டுள்ளது.
