  text: וַ/חֲמֵ֨שׁ עֶשְׂרֵ֥ה אַמָּ֛ה קְלָעִ֖ים לַ/כָּתֵ֑ף עַמֻּדֵי/הֶ֣ם שְׁלֹשָׁ֔ה וְ/אַדְנֵי/הֶ֖ם שְׁלֹשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/014.yaml
  text: Fifteen cubits of hangings for the shoulder[a], with their three pillars and their three bases.
translation:
  language: ta
  text: ஒரு பக்கத்திற்கு பதினைந்து முழம் நீளமுள்ள தொங்குதிரைகள்; அவற்றின் மூன்று தூண்களும் அவற்றின் மூன்று அடிப்பீடங்களும் இருக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தூண்தாங்கு குழிகளும்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் தூண்களைத் தாங்கும் குழிவடிவ அடிப்பகுதிகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמֵשׁ עֶשְׂרֵה
  choice: பதினைந்து
  rationale: இந்தக் கூட்டெண் நேரடியாக ‘பதினைந்து’ என்று பொருள்படும்.
- source_word: אַמָּה
  choice: முழம்
  rationale: இது நீளத்தை அளக்கும் வழக்கமான எபிரெய அளவான ‘முழம்’; தமிழில் எண்ணுக்குப் பின் ஒருமை வடிவம் இயல்பானது.
- source_word: קְלָעִים
  choice: தொங்குதிரைகள்
  rationale: ஆசரிப்புக் கூடார முற்றத்தைச் சுற்றி அமைக்கப்பட்ட துணித் திரைகளைக் குறிக்கும்; ‘தொங்குதிரைகள்’ அவற்றின் அமைப்பையும் பணியையும் தெளிவாக உணர்த்துகிறது.
- source_word: לַכָּתֵף
  choice: ஒரு பக்கத்திற்கு
  rationale: சொல்லுக்கு நேரடியாக ‘தோள்’ என்ற பொருள் இருந்தாலும், இங்குள்ள கட்டட அமைப்பு விளக்கத்தில் வாசல் பகுதியின் ஒரு பக்கத்தைக் குறிக்கிறது; அடுத்த வசனம் மறுபக்கத்தை விவரிக்கிறது.
- source_word: עַמֻּדֵיהֶם
  choice: அவற்றுக்கான மூன்று தூண்கள்
  rationale: עַמּוּד என்பது தூண் அல்லது நிலைக்கால்; ஆசரிப்புக் கூடாரச் சூழலில் ‘தூண்’ பொருத்தமான கட்டடக்கலைச் சொல். பன்மை பின்னொட்டு திரைகளோடு உள்ள தொடர்பைச் சுட்டுகிறது.
- source_word: אַדְנֵיהֶם
  choice: மூன்று அடித்தளங்கள்
  rationale: தூண்களைத் தாங்கும் அடிப்பகுதி அல்லது குழிவடிவ ஆதாரத்தைக் குறிக்கிறது; ‘அடித்தளங்கள்’ நவீன தமிழில் தெளிவாக உள்ளது, ‘அடிப்பீடங்கள்’ என்பதும் சாத்தியம்.
