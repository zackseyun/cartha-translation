revisions:
- from: நீ அந்த வலைப்பின்னலைப் பலிபீடத்தின் விளிம்புக்குக் கீழே[a], கீழ்ப்புறத்தில் வைக்க வேண்டும்; அந்த வலைப்பின்னல் பலிபீடத்தின் பாதி உயரம்வரை இருக்க வேண்டும்[b].
  to: நீ அந்த வலைப்பின்னலைப் பலிபீடத்தின் விளிம்புக்குக் கீழே[a], கீழிருந்து வைக்க வேண்டும்; அந்த வலைப்பின்னல் பலிபீடத்தின் பாதி உயரம்வரை நீள்ந்திருக்க வேண்டும்[b].
