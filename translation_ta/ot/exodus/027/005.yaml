review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly identifies the feminine pronoun as the bronze net/grating and retains both spatial elements: beneath the altar''s karkov and from below. Its rendering of the net''s extent as reaching the altar''s midpoint is contextually sound. However, the second clause''s plain ‘இருக்க வேண்டும்’ does not adequately convey the stated extent of the net.'
  naturalness: ‘கீழ்ப்புறத்தில் வைக்க வேண்டும்’ is understandable, but ‘கீழிருந்து வைக்க வேண்டும்’ more directly represents מִלְּמָטָּה and reads naturally in this construction. Adding ‘நீள்ந்திருக்க வேண்டும்’ makes the extent clause idiomatic Tamil without supplying a purpose relation.
  terminology: ‘பலிபீடம்’ and ‘வலைப்பின்னல்’ are suitable in modern standard Tamil. ‘விளிம்பு’ is an acceptable accessible rendering of the uncertain architectural term כַּרְכֹּב, provided the lexical alternative remains footnoted.
  issues:
  - severity: low
    issue: The net is said merely to ‘be’ up to half the altar.
    rationale: וְהָיְתָה ... עַד expresses the net's resulting position/extent. Tamil ‘நீள்ந்திருக்க வேண்டும்’ conveys this more clearly while retaining the source's non-purpose coordination.
  - severity: low
    issue: ‘கீழ்ப்புறத்தில்’ weakens the directional nuance of מִלְּמָטָּה.
    rationale: The Hebrew phrase is most directly represented by ‘கீழிருந்து’; this preserves the source's additional spatial specification after ‘விளிம்புக்குக் கீழே’.
  revised_text: நீ அந்த வலைப்பின்னலைப் பலிபீடத்தின் விளிம்புக்குக் கீழே[a], கீழிருந்து வைக்க வேண்டும்; அந்த வலைப்பின்னல் பலிபீடத்தின் பாதி உயரம்வரை நீள்ந்திருக்க வேண்டும்[b].
