translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் திருக்கூடாரக் கட்டுமான அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. எபிரெய வசனத்தின் இணைப்பு அமைப்பை அரைப்புள்ளி மூலம் காத்து, நோக்கம் அல்லது விளைவு போன்ற கூடுதல் நுணுக்கம் சேர்க்கப்படவில்லை.
