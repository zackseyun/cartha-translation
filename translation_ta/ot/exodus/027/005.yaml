  text: וְ/נָתַתָּ֣ה אֹתָ֗/הּ תַּ֛חַת כַּרְכֹּ֥ב הַ/מִּזְבֵּ֖חַ מִ/לְּ/מָ֑טָּה וְ/הָיְתָ֣ה הָ/רֶ֔שֶׁת עַ֖ד חֲצִ֥י הַ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/005.yaml
  text: And you shall put it under the ledge of the altar from below[b][a], and the net shall extend to halfway up the altar.
translation:
  language: ta
  text: நீ அந்த வலைப்பின்னலைப் பலிபீடத்தின் விளிம்புக்குக் கீழே[a], கீழிருந்து வைக்க வேண்டும்; அந்த வலைப்பின்னல் பலிபீடத்தின் பாதி உயரம்வரை நீள்ந்திருக்க வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விளிம்பு’ என்பதற்கு ‘வெளித்துருத்திய பட்டை’ அல்லது ‘சட்டம்’ என்றும் பொருள் கொள்ளலாம். எபிரெயச் சொல் பலிபீடத்தின் வெளித்துருத்திய ஓர் அமைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: நேர்ச்சொல் வடிவில், “அந்த வலைப்பின்னல் பலிபீடத்தின் பாதிவரை இருக்க வேண்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: வைக்க வேண்டும்
  rationale: נתן என்பது இங்கு நேரடிப் பொருளையும் இடத்தையும் கொண்டு வருவதால், கட்டுமான அறிவுறுத்தலின் வலிமையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: אֹתָהּ
  choice: அந்த வலைப்பின்னலை
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் முந்தைய வசனத்தில் கூறப்பட்ட வெண்கல வலை அமைப்பைக் குறிக்கிறது; தமிழில் குறிப்புப்பெயரை மீண்டும் கூறுவது தெளிவாக உள்ளது.
- source_word: כַּרְכֹּב
  choice: விளிம்பு
  rationale: பலிபீடத்திலிருந்து வெளித்துருத்திய ஓரம், பட்டை அல்லது சட்டத்தைக் குறிக்கும் அரிய கட்டடக்கலைச் சொல்; ‘விளிம்பு’ எளிதில் புரியும், ஆனால் அதன் துல்லிய வடிவம் உறுதியற்றதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: מִלְּמָטָּה
  choice: கீழ்ப்புறத்தில்
  rationale: கீழிருந்து அல்லது அடிப்புறத்தில் அமைந்த நிலையைத் தெரிவிக்கிறது; இதற்கு முன் வரும் ‘கீழே’ என்பதுடன் எபிரெய மூலத்தின் இரட்டை இடக்குறிப்பையும் காக்கிறது.
- source_word: הָרֶשֶׁת
  choice: வலைப்பின்னல்
  rationale: רשת என்பது வலைபோன்ற பின்னல் அல்லது தகட்டைக் குறிக்கிறது. ‘வலைப்பின்னல்’ அதன் அமைப்பைத் தெளிவாகக் காட்டுவதுடன், சாதாரண நெகிழ்வான வலை என்று மட்டும் தவறாகப் புரிந்துகொள்ளப்படுவதையும் குறைக்கிறது.
- source_word: עַד חֲצִי הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் பாதி உயரம்வரை
  rationale: சொல்லுக்கு நெருக்கமாக ‘பலிபீடத்தின் பாதிவரை’ என்று இருந்தாலும், இச்சூழலில் வலைப்பின்னலின் செங்குத்தான நிலை அல்லது பரப்பு பலிபீடத்தின் நடுப்பகுதிவரை இருப்பதைக் குறிக்கிறது. ‘பாதி உயரம்’ தமிழில் இடத்தொடர்பைத் தெளிவாக்குகிறது; நேரடி வடிவம் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
