revisions:
- from: சந்திப்புக் கூடாரத்தில், சாட்சிப்பெட்டிக்கு முன்னாலுள்ள திரைக்கு வெளியே, மாலையிலிருந்து காலைவரை யெகோவாவின் முன்னிலையில் ஆரோனும் அவன் மகன்களும் அதை ஒழுங்குபடுத்த வேண்டும்.[a] இது தலைமுறைதோறும் இஸ்ரவேல் மக்களுக்கான நிரந்தர நியமமாக இருக்கும்.[b]
  to: சந்திப்புக் கூடாரத்தில், சாட்சியின் முன்னாலுள்ள திரைக்கு வெளியே, ஆரோனும் அவன் மகன்களும் மாலை முதல் காலை வரை யாவேவின் முன்னிலையில் அதை ஒழுங்குபடுத்த வேண்டும்.[a][b] இது இஸ்ரவேல் மக்கள் அவர்களுடைய தலைமுறைகள்தோறும் கடைப்பிடிக்க வேண்டிய நிரந்தர விதிமுறையாகும்.[c]
  rationale: The revision removes the interpretive addition 'ark/chest' from the main text while preserving its likely reference in a note; aligns the rendering of the divine name with the POB audit trail; and more accurately represents the final Hebrew legal formula in natural Tamil. Footnote markers have been placed at the words and clauses they explain.
