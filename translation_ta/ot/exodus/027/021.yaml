base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/021.yaml
  text: In the tent of meeting[a], outside the veil that is before the testimony, Aaron and his sons shall arrange it before Yahweh from evening until morning[c][b]. It shall be a perpetual statute throughout their generations from the Israelites.
translation:
  language: ta
  text: சந்திப்புக் கூடாரத்தில், சாட்சியின் முன்னாலுள்ள திரைக்கு வெளியே, ஆரோனும் அவன் மகன்களும் மாலை முதல் காலை வரை யாவேவின் முன்னிலையில் அதை ஒழுங்குபடுத்த வேண்டும்.[a][b] இது இஸ்ரவேல் மக்கள் அவர்களுடைய தலைமுறைகள்தோறும் கடைப்பிடிக்க வேண்டிய நிரந்தர விதிமுறையாகும்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சாட்சி’ என்பது இச்சூழலில் உடன்படிக்கையின் பலகைகளைக் குறிக்கலாம்; அவை பெட்டிக்குள் வைக்கப்பட்டிருந்தன. எனவே, திரை அந்தச் சாட்சிக்கு முன்னால் அமைந்திருந்தது.
    reason: cultural_note
  - marker: b
    text: ‘அதை ஒழுங்குபடுத்த வேண்டும்’ என்பதை ‘அதை முறையாக ஏற்பாடு செய்ய வேண்டும்’ என்றும் மொழிபெயர்க்கலாம். இங்கு எபிரெய வினைச்சொல் விளக்குப் பணியை ஒழுங்காக நடத்துவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் நேரடியாக, ‘இஸ்ரவேல் மக்களிடமிருந்து அவர்களுடைய தலைமுறைகள்தோறும்’ என்று உள்ளது. இது இஸ்ரவேல் மக்கள் தொடர்ந்து கடைப்பிடிக்க வேண்டிய கடமையைக் குறிக்கிறது.
    reason: source_ambiguity
lexical_decisions:
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: கடவுள் தம் மக்களைச் சந்திக்கும் திருக்கூடாரத்தைக் குறிக்கும் நிலையான, இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: திரைக்கு வெளியே
  rationale: פָּרֹכֶת பரிசுத்த இடங்களைப் பிரிக்கும் உட்புறத் திரையைக் குறிக்கிறது; ‘திரை’ என்பது நவீனத் தமிழில் தெளிவானது.
- source_word: אֲשֶׁר עַל הָעֵדֻת
  choice: சாட்சிப்பெட்டிக்கு முன்னாலுள்ள
  rationale: עַל இங்கு திரை சாட்சிப் பலகைகள் வைக்கப்பட்ட பெட்டியுடன் கொண்ட இடத்தொடர்பைக் குறிக்கிறது. தமிழில் ‘சாட்சிப்பெட்டி’ என்பதால் குறிப்பு தெளிவாகிறது; அடிப்படை இடப்பொருள் ‘முன்னால்’ எனப் பாதுகாக்கப்படுகிறது.
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: அதை ஒழுங்குபடுத்த வேண்டும்
  rationale: ערך என்பதன் அடிப்படைப் பொருளான ஒழுங்குபடுத்துதல்/முறைப்படுத்துதலைப் பாதுகாக்கிறது; சூழலில் விளக்குப் பணியைச் சுட்டுகிறது.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: மாலையிலிருந்து காலைவரை
  rationale: இரவு முழுவதும் நீடிக்கும் பணிக்காலத்தை இயல்பான தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: உடன்படிக்கையின் தெய்வீகப் பெயரை ஒலிபெயர்த்து, வழிபாட்டுச் சூழலிலுள்ள ‘முன்னிலையில்’ என்ற உறவையும் காக்கிறது.
- source_word: חֻקַּת עוֹלָם
  choice: நிரந்தர நியமம்
  rationale: நீடித்து நிலவும் சட்டப்பூர்வக் கட்டளையைத் தெரிவிக்கிறது; தத்துவார்த்தமான முடிவில்லாத காலத்தைத் தேவையின்றி வலியுறுத்தாது.
- source_word: לְדֹרֹתָם
  choice: தலைமுறைதோறும்
  rationale: ஒவ்வொரு தொடர்ச்சியான தலைமுறைக்கும் பொருந்தும் உடன்படிக்கைச் சூத்திரத்தை இயல்பான தமிழில் வழங்குகிறது.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்கான
  rationale: מֵאֵת என்பதன் தொடர்பு இங்கு சுருக்கமானது; கடமை அல்லது வழங்கல் இஸ்ரவேல் மக்களிடமிருந்து வருவதாகவும் அவர்களைச் சார்ந்ததாகவும் இருக்கலாம். பிரதான உரை இயல்பான தொடர்பை வழங்கி, மாற்றுப் பொருளை அடிக்குறிப்பில் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: எபிரெய மூலத்தில் வரும் உடன்படிக்கைப் பெயரை பொதுப்பட்டப் பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது. தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பது மாற்று ஒலிப்புமுறை.
- issue: חֻקַּת עוֹלָם என்பதன் கால வலிமை
  choice: நிரந்தர நியமம்
  alternative: என்றென்றைக்குமான நியமம்
  rationale: வழிபாட்டுச் சட்டம் தலைமுறைகளில் தொடர்ந்து நிலவ வேண்டியதைக் காக்கிறது; எபிரெய சட்ட வழக்கைத் தாண்டி முழுமையான காலமின்மையைத் திணிக்காது.
- issue: מֵאֵת בְּנֵי יִשְׂרָאֵל என்பதன் தொடர்பு
  choice: இஸ்ரவேல் மக்களுக்கான
  alternative: இஸ்ரவேல் மக்களிடமிருந்து கடைப்பிடிக்கப்பட வேண்டிய
  rationale: மூலச் சொற்றொடர் ‘இஸ்ரவேல் மக்களிடமிருந்து’ என்ற மூல/கடமை நுணுக்கத்தை அனுமதிக்கிறது. தமிழில் தெளிவான பிரதான வாசகத்தைத் தேர்ந்து, அந்த நுணுக்கத்தை அடிக்குறிப்பில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. தொழில்நுட்பச் சொற்கள் அளவுக்கு மீறாமல் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் சுருக்கமான இறுதிச் சொற்றொடரிலுள்ள தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
