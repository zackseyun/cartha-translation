  rationale: உலோகத்தால் மேற்பரப்பை மூடும் கைவினைச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது; குறிப்பிட்ட நவீன உலோகப் பூச்சு முறையைத் திணிக்கவில்லை.
- source_word: אֹתָם
