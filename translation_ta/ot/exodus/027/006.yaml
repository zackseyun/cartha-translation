revisions:
- from: பலிபீடத்திற்காகச் சுமக்கும் கோல்களைச் செய்வாயாக; அவற்றைச் சீத்திம் மரத்தால் செய்து, வெண்கலத்தால் மூடுவாயாக.[a]
  to: பலிபீடத்திற்காக அகேசியா மரத்தால் கோல்களைச் செய்வாயாக; அவற்றை வெண்கலத்தால் மேல்பூசுவாயாக.[a]
  rationale: The revision removes contextual information not explicit in the verse, uses a clear modern rendering for acacia wood, and makes the metal-overlay action more precise while retaining the command form and the lexical alternative footnote.
