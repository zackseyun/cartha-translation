  yaml_path: translation/ot/exodus/027/008.yaml
  text: You shall make it hollow[a], with boards; as it was shown to you on the mountain, so shall they make it.
translation:
  language: ta
  text: அதைப் பலகைகளால் ஆன, உள்ளே வெற்றிடமுள்ள அமைப்பாகச் செய்ய வேண்டும்.[a] மலையில் உனக்குக் காட்டப்பட்டபடியே அவர்கள் அதைச் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பலகைகளால் ஆன வெற்றிடமான அமைப்பாக.’ எபிரெயச் சொற்கள், பலிபீடம் பலகைகளால் செய்யப்பட்ட, உள்ளே வெற்றிடமுள்ள கட்டமைப்பு என்பதைக் குறிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבוּב
  choice: உள்ளீடற்றதாக
  rationale: பலிபீடம் திடமானதாக அல்லாமல் உள்ளே வெற்றிடமுள்ள அமைப்பாக இருக்க வேண்டும் என்பதைக் குறிக்கிறது.
- source_word: לֻחֹת
  choice: பலகைகளால்
  rationale: இந்தப் பன்மைப் பெயர்ச்சொல் கட்டுமானத்திற்குப் பயன்படும் பலகைகளைக் குறிக்கிறது; கருவிப் பொருளைக் காட்டும் ‘-ஆல்’ உருபு தமிழில் இயல்பாக உள்ளது.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: அதை ... செய்ய வேண்டும்
  rationale: மோசேயிடம் ஒருமையில் வழங்கப்படும் கட்டளையின் வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר
  choice: காட்டப்பட்டபடியே
  rationale: மலையில் காட்டப்பட்ட மாதிரிக்கும் செய்யப்பட வேண்டிய பணிக்கும் இடையிலான ஒப்புமையைத் தெளிவாகக் காக்கிறது.
- source_word: הֶרְאָה אֹתְךָ
  choice: உனக்குக் காட்டப்பட்ட
  rationale: எபிரெய வினைச்சொல்லின் செயப்பாட்டு வடிவத்தைக் காத்து, காட்டியவரை மூலத்தைவிட வெளிப்படையாக அடையாளப்படுத்தவில்லை.
- source_word: בָּהָר
  choice: மலையில்
  rationale: வெளிப்பாடு நிகழ்ந்த இடத்தை நவீன தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: כֵּן יַעֲשׂוּ
  choice: அவர்கள் அதைச் செய்ய வேண்டும்
  rationale: பன்மை வினையின் செய்பவர்களைத் தெளிவுபடுத்தி, முன் கூறிய மாதிரியின்படி கட்ட வேண்டும் என்ற கட்டளைத் தொடர்பைக் காக்கிறது.
theological_decisions:
- issue: காட்டிய செய்பவரின் அடையாளம்
  choice: செயப்பாட்டு வடிவமான ‘உனக்குக் காட்டப்பட்ட’ என்பதைக் காத்தல்
  alternative: ‘அவர் உனக்குக் காட்டியபடி’
  rationale: சூழலில் தேவனே காட்டியவர் எனப் புரிந்தாலும், எபிரெய உரை இங்கு செய்பவரை வெளிப்படையாகச் சொல்லாமல் செயப்பாட்டு வடிவத்தைப் பயன்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கட்டளையின் மரியாதையும் நேர்மையும் காக்கப்பட்டுள்ளன. ‘உள்ளீடற்ற’ என்பது தொழில்நுட்பப் பொருளைச் சுருக்கமாகத் தருகிறது; அடிக்குறிப்பு அதன் கட்டுமானப் பொருளை விளக்குகிறது.
