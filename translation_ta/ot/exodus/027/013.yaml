  yaml_path: translation/ot/exodus/027/013.yaml
  text: And the width of the court on the east side[a], toward the sunrise, shall be fifty cubits.
translation:
  language: ta
  text: மேலும், முற்றத்தின் அகலம் கிழக்குப் பக்கமாக, சூரிய உதயத் திசையில், ஐம்பது முழம் இருக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிழக்குப் பக்கமாக, சூரிய உதயத் திசையில், முற்றத்தின் அகலம் ஐம்பது முழம்.’
    reason: மூல எபிரேயத்தில் கிழக்கைக் குறிக்கும் קֵדְמָה மற்றும் מִזְרָחָה ஆகிய இரு சொற்கள் அடுத்தடுத்து வருகின்றன. இந்த மாற்று வரிசை அவற்றின் அமைப்பை மேலும் நேரடியாகக் காட்டுகிறது.
lexical_decisions:
- source_word: וְרֹחַב
  choice: முற்றத்தின் அகலம்
  rationale: רֹחַב என்பது அகலம் அல்லது பரப்பளவின் குறுக்குவீச்சைக் குறிக்கிறது. தமிழில் அளவைக் குறிக்க ‘அகலம்’ இயல்பாக உள்ளது; தொடக்க வாவ் இணைப்பு, தொடர்ச்சியான கட்டளைச் சூழலில் தனியே ‘மேலும்’ என்று மொழிபெயர்க்கப்படாமல் வாக்கிய ஓட்டத்தில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: הֶחָצֵר
  choice: முற்றத்தின்
  rationale: חָצֵר இங்கு திருக்கூடாரத்தைச் சுற்றியுள்ள வரையறுக்கப்பட்ட வெளிப்புற முற்றத்தைக் குறிக்கிறது; ‘முற்றம்’ நவீனத் தமிழில் தெளிவானதும் சுருக்கமானதும் ஆகும்.
- source_word: לִפְאַת קֵדְמָה
  choice: கிழக்குப் பக்கத்தில்
  rationale: פֵאָה என்பது பக்கம் அல்லது ஓரம்; קֵדְמָה இங்கு கிழக்குத் திசையைக் குறிக்கிறது. இரண்டையும் சேர்த்து இயல்பான தமிழில் ‘கிழக்குப் பக்கத்தில்’ என வழங்கப்பட்டுள்ளது.
- source_word: מִזְרָחָה
  choice: சூரியன் உதிக்கும் திசை நோக்கி
  rationale: מִזְרָחָה கிழக்கு நோக்கிய திசையையும் சூரிய உதயத் திசையையும் குறிக்கிறது. முந்தைய קֵדְמָה என்பதிலிருந்து வேறுபடுத்தி, எபிரேய மொழியின் இரட்டிப்பு திசை வலியுறுத்தலைப் பாதுகாக்க இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: חֲמִשִּׁים אַמָּה
  choice: ஐம்பது முழம்
  rationale: חֲמִשִּׁים என்பது ‘ஐம்பது’; אַמָּה என்பது பழங்கால நீள அலகான ‘முழம்’. மூலத்தின் அளவீட்டு அலகு மாற்றமின்றிப் பாதுகாக்கப்பட்டுள்ளது.
