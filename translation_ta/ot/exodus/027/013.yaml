revisions:
- from: முற்றத்தின் அகலம் கிழக்குப் பக்கத்தில்[a], சூரியன் உதிக்கும் திசை நோக்கி, ஐம்பது முழமாக இருக்க வேண்டும்.
  to: மேலும், முற்றத்தின் அகலம் கிழக்குப் பக்கமாக, சூரிய உதயத் திசையில், ஐம்பது முழம் இருக்க வேண்டும்.[a]
  rationale: வாவ் இணைப்பை “மேலும்” என வெளிப்படுத்தி, அளவுக் கூற்றின் கட்டளைச் சூழலுக்கேற்ற “இருக்க வேண்டும்” என்பதைத் தக்கவைத்துள்ளோம். “சூரிய உதயத் திசையில்” என்பது மிஸ்‌రாஹாவின் பொருளையும், கிழக்குக்கான இரட்டை குறியீட்டையும், தேவையற்ற திசைநோக்கு அர்த்தமின்றி காக்கிறது. அடிக்குறிப்பு அடையாளம் உரையில் தக்க இடத்தில் வைக்கப்பட்டுள்ளது.
