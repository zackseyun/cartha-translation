translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டது. எபிரெயத்தின் செயப்பாட்டு கட்டமைப்பு ‘செலுத்தப்பட வேண்டும்’ என்பதில் காக்கப்பட்டுள்ளது; ‘பக்கங்கள்’ என்ற சொல்லின் பொருள் விரிவு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
