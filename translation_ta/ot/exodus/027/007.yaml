  text: וְ/הוּבָ֥א אֶת בַּדָּ֖י/ו בַּ/טַּבָּעֹ֑ת וְ/הָי֣וּ הַ/בַּדִּ֗ים עַל שְׁתֵּ֛י צַלְעֹ֥ת הַ/מִּזְבֵּ֖חַ בִּ/שְׂאֵ֥ת אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/007.yaml
  text: Its poles shall be put into the rings[b][a], and the poles shall be on the two sides of the altar when it is carried.
translation:
  language: ta
  text: அதன் தண்டுகள் வளையங்களுக்குள் செலுத்தப்பட வேண்டும்[a]. பலிபீடத்தைச் சுமந்து செல்லும்போது, அந்தத் தண்டுகள் அதன் இரு பக்கங்களிலும்[b] இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வளையங்களுக்குள் கொண்டுவரப்பட வேண்டும்.” எபிரெய வினைச்சொல் செயப்பாட்டு வடிவில் உள்ளது; இச்சூழலில் தண்டுகளை வளையங்களுக்குள் செலுத்துவதை இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல்லை “பக்கப் பகுதிகள்” அல்லது “பக்கவாட்டுகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּבָא
  choice: செலுத்தப்பட வேண்டும்
  rationale: בוא என்பதன் ஹொஃபால் வடிவம் செயப்பாட்டு/காரணப் பொருளைக் கொண்டது. இங்கு தண்டுகளை வளையங்களுக்குள் இடுவதை இயல்பான தமிழில் தெளிவாகக் குறிக்கிறது; செயப்பாட்டு தன்மையும் காக்கப்படுகிறது.
- source_word: בַּדָּיו
  choice: அதன் தண்டுகள்
  rationale: בַּד என்பது பரிசுத்தப் பொருட்களைச் சுமப்பதற்குப் பயன்படுத்தப்படும் தண்டுகளைக் குறிக்கிறது. ‘தண்டுகள்’ என்பது சுருக்கமான, தற்போதைய தமிழ்ச் சொல்.
- source_word: בַּטַּבָּעֹת
  choice: வளையங்களுக்குள்
  rationale: בְּ இங்கு வளையங்களை தண்டுகள் செலுத்தப்படும் இடமாகக் காட்டுகிறது. ‘வளையங்களுக்குள்’ என்பது செருகுதலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהָיוּ
  choice: இருக்க வேண்டும்
  rationale: கட்டளைத் தொடரில், தண்டுகள் செலுத்தப்பட்ட பின் அவை இருக்க வேண்டிய நிலையை இது குறிக்கிறது.
- source_word: עַל שְׁתֵּי צַלְעֹת הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் இரு பக்கங்களிலும்
  rationale: עַל குறிக்கும் இடத்தொடர்பையும், צֵלָע என்பதன் ‘பக்கம்’ என்ற பொதுப் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: வழிபாட்டுச் சூழலில் מִזְבֵּחַ என்பதற்கான தெளிவான, வழக்கமான தமிழாக்கம்.
- source_word: בִּשְׂאֵת אֹתוֹ
  choice: பலிபீடத்தைச் சுமந்து செல்லும்போது
  rationale: בְּ உடன் வரும் נשׂא வினைமுற்றற்ற பெயரெச்ச வடிவம் காலம்/சூழ்நிலையை, ‘சுமந்து செல்லும்போது’ என்று குறிக்கிறது. ‘அதை’ என்பதற்குப் பதிலாக ‘பலிபீடத்தை’ என்று கூறுவது தமிழில் சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்கிறது.
