id: EXO.27.3
reference: Exodus 27:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ סִּֽירֹתָי/ו֙ לְ/דַשְּׁנ֔/וֹ וְ/יָעָי/ו֙ וּ/מִזְרְקֹתָ֔י/ו וּ/מִזְלְגֹתָ֖י/ו וּ/מַחְתֹּתָ֑י/ו לְ/כָל כֵּלָ֖י/ו תַּעֲשֶׂ֥ה נְחֹֽשֶׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/003.yaml
  text: You shall make its pots for removing its ashes[a], and its shovels, and its basins, and its forks, and its firepans[b]; you shall make all its utensils of bronze.
translation:
  language: ta
  text: அதன் சாம்பலை அகற்றுவதற்கான பாத்திரங்களையும்[a], அதன் மண்வாரிகளையும், கிண்ணங்களையும், முள்கரண்டிகளையும், நெருப்புத் தட்டுகளையும் நீ செய்ய வேண்டும். அதன் கருவிகள் அனைத்தையும் வெண்கலத்தால்[b] செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “அதன் கொழுப்புச் சாம்பலை அகற்றுவதற்கான”; இது பீடத்தின் மேல் செலுத்தப்பட்ட பலிகளால் உண்டான சாம்பலை அகற்றுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “செம்பால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: நீ செய்ய வேண்டும்
  rationale: கூடார அமைப்பு குறித்த கட்டளையின் தொனியை நவீன, இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: סִּירֹתָיו
  choice: அதன் ... பாத்திரங்கள்
  rationale: இவை கொள்கலன்கள்; அவற்றின் குறிப்பிட்ட பயன்பாட்டை அடுத்து வரும் சொற்றொடர் விளக்குவதால், அடிப்படைப் பெயர் பொதுவாக மொழிபெயர்க்கப்பட்டது.
- source_word: לְדַשְּׁנוֹ
  choice: அதன் சாம்பலை அகற்றுவதற்கான
  rationale: பீடத்தின் பலிகளால் உண்டான கொழுப்புக் கலந்த சாம்பலை அப்புறப்படுத்தும் செயலைத் தெளிவான தமிழில் தெரிவிக்கிறது; எபிரெயச் சொல்லின் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יָעָיו
  choice: அதன் மண்வாரிகள்
  rationale: சாம்பல் அல்லது நெருப்புத்தணலை அள்ளிக் கையாளும் கருவிகளுக்கு இயல்பான தமிழ்ச் சொல்.
- source_word: מִזְרְקֹתָיו
  choice: கிண்ணங்கள்
  rationale: திரவத்தை, குறிப்பாக பலியின் இரத்தத்தை, ஏந்தவும் தெளிக்கவும் பயன்படும் பாத்திரங்களைக் குறிக்கும் இயல்பான பொதுச்சொல்.
- source_word: מִזְלְגֹתָיו
  choice: முள்கரண்டிகள்
  rationale: முள் கொண்ட கருவி என்ற வடிவத்தையும் பயன்பாட்டையும் நவீன வாசகருக்குத் தெளிவாக உணர்த்துகிறது; ‘இறைச்சிக் கொக்கிகள்’ என்பது அதிக விளக்கவுரையானது.
- source_word: מַחְתֹּתָיו
  choice: நெருப்புத் தட்டுகள்
  rationale: நெருப்பு அல்லது தணலை எடுத்துச் செல்லும் தட்டுகளைக் குறிக்கும் சூழலுக்கேற்ற தெளிவான மொழிபெயர்ப்பு.
- source_word: לְכָל כֵּלָיו
  choice: அதன் கருவிகள் அனைத்தும்
  rationale: முன்பு பட்டியலிடப்பட்ட பீடப் பயன்பாட்டுப் பொருட்களை உள்ளடக்கும் விரிவான, இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: திருக்கூடாரப் பொருட்களின் சூழலில் மரபாகவும் சாத்தியமாகவும் குறிக்கப்படும் உலோகக் கலவை; ‘செம்பு’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
