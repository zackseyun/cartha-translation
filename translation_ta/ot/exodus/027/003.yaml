  terminology: வெண்கலம் is the conventional and contextually appropriate rendering of נְחֹשֶׁת, while the note responsibly preserves செம்பு as a lexical alternative. The note on the technical expression לְדַשְּׁנוֹ preserves its more literal ‘fat ashes’ wording without making the main text unnecessarily obscure.
