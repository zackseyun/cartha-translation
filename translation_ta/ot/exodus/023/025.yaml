  text: וַ/עֲבַדְתֶּ֗ם אֵ֚ת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/בֵרַ֥ךְ אֶֽת לַחְמְ/ךָ֖ וְ/אֶת מֵימֶ֑י/ךָ וַ/הֲסִרֹתִ֥י מַחֲלָ֖ה מִ/קִּרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/025.yaml
  text: You shall serve Yahweh your God[a], and he will bless your bread and your water[b], and I will remove sickness from your midst.
translation:
  language: ta
  text: நீங்கள் உங்கள் கடவுளாகிய யாவேக்கு ஊழியம் செய்ய வேண்டும். அவர் உங்கள் அப்பத்தையும்[a] தண்ணீரையும் ஆசீர்வதிப்பார்; நான் உங்கள் நடுவிலிருந்து நோயை[b] அகற்றுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அப்பம்’ என்பதற்கான எபிரெயச் சொல் இங்கு விரிவாக உணவு அல்லது வாழ்வாதாரத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பிணியை’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: ஊழியம் செய்ய வேண்டும்
  rationale: עבד என்பது இவ்வுடன்படிக்கைச் சூழலில் கடவுளுக்குச் சேவை செய்வதையும் அவரை வழிபடுவதையும் உள்ளடக்குகிறது. ‘ஊழியம் செய்ய’ என்பது ‘வழிபட’ என்பதைவிட அதன் விரிந்த பொருளைப் பேணுகிறது; ‘வேண்டும்’ சூழலிலுள்ள கட்டளை வலிமையை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைப்பட்டம் அல்ல, יהוה என்ற தனிப்பட்ட இறைப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: யாவேயைக் குறிக்கும் ஒருமை உடன்படிக்கைச் சூழலில் אֱלֹהִים என்பது ‘கடவுள்’ என்றே பொருள்படும்; உடைமைப் பின்னொட்டு உறவைச் சுட்டுகிறது.
- source_word: וּבֵרַךְ
  choice: அவர் ... ஆசீர்வதிப்பார்
  rationale: கட்டளையைத் தொடர்ந்து வரும் வாக்குறுதி அல்லது விளைவாக நிறைவுற்ற வினை எதிர்காலப் பொருளில் அமைகிறது. தமிழில் இயல்பாக இருக்க மறைந்துள்ள எழுவாய் வெளிப்படையாகக் கொடுக்கப்பட்டது.
- source_word: לַחְמְךָ
  choice: உங்கள் அப்பம்
  rationale: לֶחֶם என்பதன் நேரடிப் பொருள் ‘அப்பம்’; அது பொதுவாக உணவு அல்லது வாழ்வாதாரத்தையும் குறிக்கலாம். மூலத்தின் உருவகத் தெளிவைப் பேண ‘அப்பம்’ வைக்கப்பட்டு, விரிந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מֵימֶיךָ
  choice: உங்கள் தண்ணீர்
  rationale: מַיִם வடிவில் பன்மை அல்லது தொகுப்புப் பெயராக இருந்தாலும், இங்கு குடிப்பதற்கான அடிப்படை நீர்வளத்தை ஒருமைத் தொகுப்புப் பெயரான ‘தண்ணீர்’ இயல்பாகக் குறிக்கிறது.
- source_word: וַהֲסִרֹתִי
  choice: நான் ... அகற்றுவேன்
  rationale: Hiphil வடிவிலுள்ள הסיר என்பதற்கு ‘அகற்றுதல்’ அல்லது ‘நீக்குதல்’ என்று பொருள். முதல் நபர் எழுவாய் மாற்றம் மூலத்தில் உள்ளபடியே வெளிப்படையாகப் பேணப்பட்டுள்ளது.
- source_word: מַחֲלָה
  choice: நோய்
  rationale: מַחֲלָה என்பது நோய், பிணி, சுகவீனம் ஆகிய பரப்பைக் கொண்டது. ‘நோய்’ இயல்பான, விரிவான நவீனத் தமிழ்ச் சொல்.
- source_word: מִקִּרְבֶּךָ
  choice: உங்கள் நடுவிலிருந்து
  rationale: இந்தச் சொற்றொடர் ஒரு தனிநபரின் உடலுக்குள் இருந்து என்பதைக் காட்டிலும், இஸ்ரவேல் சமூகத்தின் மத்தியிலிருந்து என்பதைக் குறிக்கிறது; ‘உங்கள் நடுவிலிருந்து’ அந்தக் கூட்டு உணர்வைப் பேணுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: எபிரெய உரை இறைப்பட்டத்தை அல்ல, நான்கு எழுத்துகளால் அமைந்த உடன்படிக்கைப் பெயரையே பயன்படுத்துகிறது. ஆகவே பெயர் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- issue: இரண்டாம் நபர் எண்ணில் ஏற்படும் மாற்றம்
  choice: ‘நீங்கள்’ மற்றும் ‘உங்கள்’ என்பவற்றால் சமூகத்திற்கான கூட்டு அழைப்பாக மொழிபெயர்த்தல்
  alternative: தொடக்கத்தில் பன்மையையும் பின்னர் வரும் உடைமை வடிவங்களில் ஒருமையையும் செயற்கையாக வேறுபடுத்திக் காட்டுதல்
  rationale: எபிரெயத்தில் தொடக்க வினை இரண்டாம் நபர் ஆண்பால் பன்மையாகவும், தொடர்ந்து வரும் உடைமைப் பின்னொட்டுகள் ஒருமையாகவும் உள்ளன. இது இஸ்ரவேலை ஒரே சமூகமாக நோக்கும் வழக்கமான கூட்டு அழைப்பு; தமிழின் ‘நீங்கள்/உங்கள்’ வடிவங்கள் எண்ணைத் தீர்மானிக்காமல் இந்தக் கூட்டு நோக்கை இயல்பாகப் பேணுகின்றன.
- issue: ‘அவர் ஆசீர்வதிப்பார்’ என்பதிலிருந்து ‘நான் அகற்றுவேன்’ என்பதற்கான நபர் மாற்றம்
  choice: மூலத்தில் உள்ள மூன்றாம் நபரிலிருந்து முதல் நபருக்கான மாற்றத்தை அப்படியே வைத்தல்
  alternative: இரண்டையும் ஒரே நபரில் ஒத்திசைத்தல்
  rationale: இந்தத் திடீர் மாற்றம் எபிரெய உரையிலேயே உள்ளது. அதைச் சீராக்காமல் விடுவது உரையின் உண்மையான இலக்கண மற்றும் இறையியல் நெருக்கடியைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. ‘ஊழியம் செய்ய’ என்பது சேவை மற்றும் வழிபாடு ஆகிய இரு நிழற்பொருள்களையும் தாங்குகிறது. எபிரெயத்தில் உள்ள கூட்டு அழைப்பும், ‘அவர்’ என்பதிலிருந்து ‘நான்’ என்பதற்கான எழுவாய் மாற்றமும் சீராக்கப்படாமல் பேணப்பட்டுள்ளன.
