  yaml_path: translation/ot/exodus/023/013.yaml
  text: In all that I have said to you[a], be careful[b]; and the name of other gods you shall not mention—it shall not be heard on your lips.
translation:
  language: ta
  text: நான் உங்களுக்குச் சொன்ன எல்லாவற்றிலும் கவனமாக இருங்கள். வேறு தெய்வங்களின் பெயரைச் சொல்லாதீர்கள்[a]; அது உன் வாயிலிருந்து கேட்கப்படக் கூடாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் குறிப்பாக, “வேறு தெய்வங்களின் பெயரைச் சொல்லி அழைக்காதீர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு சொல்: “அது உன் வாயின்மேல் கேட்கப்படாதிருக்கட்டும்.” இங்கு “உன்” என்பது எபிரெயத்தில் ஒருமையாக உள்ளது; வசனத்தின் முதல் பகுதியில் “உங்களுக்குச்” என்பது பன்மை.'
    reason: literal_rendering_and_number_shift
lexical_decisions:
- source_word: וּבְכֹל אֲשֶׁר אָמַרְתִּי אֲלֵיכֶם
  choice: நான் உங்களிடம் சொன்ன அனைத்தையும் குறித்து
  rationale: בְּכֹל என்பதன் விரிவான வரம்பையும், முன்பு கொடுக்கப்பட்ட கட்டளைகளைச் சுட்டும் உறவுத்தொடரையும் இயல்பான தமிழில் காக்கிறது.
- source_word: תִּשָּׁמֵרוּ
  choice: கவனமாயிருங்கள்
  rationale: שׁמר என்பதன் நிஃபால் வடிவிலுள்ள தம்மைக் காத்துக்கொள்ளும் அல்லது எச்சரிக்கையாக இருக்கும் நுணுக்கத்தையும் கட்டளைத் தொனியையும் வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்கள்
  rationale: இஸ்ரவேலின் தேவனைத் தவிர்ந்த பிற தெய்வங்களைக் குறிக்கும் எபிரெயச் சொற்றொடரை நேரடியாகவும் மரபுவழி இறையியல் முடிவுகளைச் சேர்க்காமலும் தருகிறது.
- source_word: לֹא תַזְכִּירוּ
  choice: பெயரைச் சொல்லாதீர்கள்
  rationale: זכר என்பதன் ஹிஃபில் வடிவம் இங்கு ‘குறிப்பிடுதல்/பெயரைச் சொல்லுதல்’ என்ற பரந்த பொருளைக் கொண்டது. ‘வழிபட்டு அழைத்தல்’ என்று குறுக்காமல் உரையின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: לֹא יִשָּׁמַע עַל פִּיךָ
  choice: அது உன் வாயில் கேட்கப்படக் கூடாது
  rationale: ‘அது கேட்கப்படாதிருப்பதாக’ என்ற செயப்பாட்டு அமைப்பையும் ‘உன் வாயின்மேல்’ என்ற மூல உருவகத்தையும் தமிழில் புரியத்தக்க வகையில் காக்கிறது; எபிரெயத்தில் பன்மையிலிருந்து ஒருமைக்கு வரும் ஆள்மாற்றமும் விடப்படவில்லை.
theological_decisions:
- issue: வேறு தெய்வங்களின் பெயரைப் பற்றிய தடையின் வரம்பு
  choice: அவற்றின் பெயரைச் சொல்லுவதற்கான தடையாக மொழிபெயர்த்தல்
  alternative: அவற்றின் பெயரைச் சொல்லி அழைக்கவோ வேண்டிக்கொள்ளவோ கூடாது என்று குறிப்பாக்குதல்
  rationale: மூலச்சொல் பெயரை குறிப்பிடுதல் முதல் வழிபாட்டு அழைப்பு வரை பொருள் கொள்ளக்கூடும். இவ்வசனம் அந்த வரம்பைத் தெளிவாகத் தீர்மானிக்காததால், மொழிபெயர்ப்பு பரந்த சொற்பொருளையே காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டப்பகுதிக்கேற்ற கண்ணியமான கட்டளைத் தொனி பயன்படுத்தப்பட்டுள்ளது. முதல் வாக்கியத்தின் பன்மை அழைப்பிலிருந்து இறுதி வாக்கியத்தின் ஒருமை அழைப்புக்கு மூலத்தில் உள்ள மாற்றம் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது.
