base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/009.yaml
  text: You shall not oppress a sojourner[a], and you yourselves know the soul of the sojourner[b], because you were sojourners in the land of Egypt.
translation:
  language: ta
  text: “குடியிருக்கும் அந்நியரை[a] ஒடுக்காதீர்கள். குடியிருக்கும் அந்நியரின் உள்ளத்தை நீங்களே அறிவீர்கள்[b]; ஏனெனில் எகிப்து நாட்டில் நீங்களும் அந்நியர்களாகக் குடியிருந்தீர்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்நியர்,” “வெளிநாட்டுக் குடியிருப்பாளர்.” எபிரெய மொழியிலுள்ள גֵּר (கேர்) என்பது ஒரு மக்களிடையே குடியிருக்கும், அந்த மக்களைச் சேர்ந்திராத ஒருவரைக் குறிக்கிறது; அவர் பெரும்பாலும் சமூக ரீதியாகப் பாதுகாப்பற்ற நிலையில் இருப்பார்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “அந்நியராகக் குடியிருப்பவரின் நெபெஷை நீங்கள் அறிவீர்கள்.” இங்குள்ள נֶפֶשׁ (நெபெஷ்) என்பது அவரது உயிர் அல்லது உள்ளார்ந்த நிலை—அதாவது, அப்படிப்பட்ட ஒருவரின் வாழ்வனுபவம்—என்பதைக் குறிக்கும் சொல்லாட்சியாகும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר
  choice: அந்நியராகக் குடியிருப்பவர்
  rationale: இந்த எபிரெயச் சொல் வெறுமனே வழிப்போக்கரையோ வேறு இனத்தவரையோ குறிக்காமல், தமக்குச் சொந்தமல்லாத ஒரு சமூகத்தில் வாழும், பெரும்பாலும் பாதுகாப்பற்ற நிலையில் உள்ளவரைக் குறிக்கிறது. தமிழில் இத்தொடர் அந்த வாழ்விட மற்றும் சமூக நிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תִלְחָץ
  choice: ஒடுக்காதீர்கள்
  rationale: இந்தச் சட்டச் சூழலில் வினைச்சொல் அழுத்துதல், சுரண்டுதல், அதிகாரத்தால் நெருக்குதல் ஆகிய பொருள்களைக் கொண்டுள்ளது; ‘ஒடுக்குதல்’ அதன் சமூக-அறநெறி வலிமையைத் தெளிவாகத் தருகிறது.
- source_word: יְדַעְתֶּם
  choice: நீங்களே அறிந்திருக்கிறீர்கள்
  rationale: இஸ்ரயேலரின் நேரடி அனுபவத்தால் வந்த அறிவை வினைச்சொல் குறிக்கிறது; வெளிப்படையாக இடம்பெறும் וְאַתֶּם என்பதன் வலியுறுத்தலை ‘நீங்களே’ தக்கவைக்கிறது.
- source_word: נֶפֶשׁ
  choice: உள்ளநிலை
  rationale: ‘அந்நியராகக் குடியிருப்பவரின் நெபெஷை அறிவீர்கள்’ என்ற சொற்றொடரில் இது உடலிலிருந்து பிரிந்த ‘ஆன்மா’ என்ற கருத்தை மட்டும் குறிக்காமல், அந்த நபரின் உள்ளார்ந்த உணர்வையும் வாழ்வனுபவ நிலையையும் குறிக்கிறது. ‘உள்ளநிலை’ தமிழில் இயல்பாக இருந்தாலும், மூலத்தின் நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் காரணப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: גֵרִים הֱיִיתֶם
  choice: நீங்களும் அந்நியராகக் குடியிருந்தீர்கள்
  rationale: முந்தைய גֵר என்பதுடன் கருத்தியல் தொடர்ச்சியைப் பேணுவதோடு, எகிப்தில் இஸ்ரயேலர் அந்நிய நாட்டில் குடியிருந்த வரலாற்று அனுபவத்தை இயல்பான தமிழில் கூறுகிறது.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டில்
  rationale: ‘எகிப்தின் நாட்டில்’ என்ற எபிரெய வடிவத்தை இயல்பான நவீன தமிழில் சுருக்கமாகவும் முழுப் பொருளுடனும் தருகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சட்டத்தில் גֵר என்பதன் மொழிபெயர்ப்பு
  choice: அந்நியராகக் குடியிருப்பவர்
  alternative: அந்நியர்; பரதேசி; வெளிநாட்டுக் குடியிருப்பாளர்
  rationale: இச்சொல்லை இன அடையாளமாக மட்டும் சுருக்காமல், வேறொரு மக்களிடையே குடியிருந்து சமூக ரீதியாகப் பாதுகாப்பற்ற நிலையில் இருக்கும் நபரைக் குறிக்கிறது. இஸ்ரயேலரின் எகிப்திய அனுபவத்துடன் வசனம் உருவாக்கும் ஒப்புமையையும் இது பேணுகிறது.
- issue: נֶפֶשׁ என்பதன் மானிடவியல் பொருள்
  choice: உள்ளநிலை
  alternative: உயிர்; ஆன்மா; வாழ்நிலை
  rationale: இங்கு தனியான உடலற்ற ஆன்மா பற்றிய கோட்பாட்டை வசனத்துக்குள் புகுத்தாமல், அந்நியராக வாழ்பவரின் உள்ளார்ந்த உணர்வு மற்றும் அனுபவ நிலையைச் சுட்டுகிறது. மூலத்தின் சொற்பொருள் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க சட்ட-அறநெறி நடையைப் பயன்படுத்துகிறது. ‘பரதேசி’ போன்ற பழமையான அல்லது சமய வழக்குச் சொற்களை முதன்மை உரையில் தவிர்த்து, மூலத்தின் சமூகப் பிரிவை விளக்கமான தொடரால் தருகிறது; இரண்டாம் நபர் பன்மையும் மூலத்தின் வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
