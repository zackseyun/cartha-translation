  text: מְעַ֥ט מְעַ֛ט אֲגָרְשֶׁ֖/נּוּ מִ/פָּנֶ֑י/ךָ עַ֚ד אֲשֶׁ֣ר תִּפְרֶ֔ה וְ/נָחַלְתָּ֖ אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/030.yaml
  text: Little by little I will drive them out from before you[b][a], until you become fruitful and take possession of the land.
translation:
  language: ta
  text: நீ பெருகி அந்த நாட்டை உன் உரிமையாகப் பெறும்[b] வரை, கொஞ்சம் கொஞ்சமாக அவர்களை[a] உன் முன்னிலையிலிருந்து துரத்திவிடுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அவனை’ என்று ஒருமையில் உள்ளது; அது நாட்டின் குடிகளையோ மக்களினங்களையோ கூட்டாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அந்த நாட்டைச் சுதந்தரித்துக்கொள்ளும் வரை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מְעַט
  choice: கொஞ்சம் கொஞ்சமாக
  rationale: எபிரெயச் சொல்லடுக்கின் படிப்படியான செயலையும் அதன் மீளுருவத்தையும் இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: אֲגָרְשֶׁנּוּ
  choice: அவர்களைத் துரத்திவிடுவேன்
  rationale: גרשׁ என்பதன் ‘துரத்து/வெளியேற்று’ என்ற பொருளைத் தருகிறது. எபிரெயத்தில் ஒருமை விகுதி இருந்தாலும், சூழலில் அது நாட்டின் குடிகளைக் கூட்டாகக் குறிக்கிறது; தமிழில் ‘அவனை’ என்பது ஒரு குறிப்பிட்ட ஆணைத் தவறாகச் சுட்டக்கூடும் என்பதால் பொருள்சார் பன்மை பயன்படுத்தப்பட்டு அடிக்குறிப்பில் மூல இலக்கணம் தெரிவிக்கப்படுகிறது.
- source_word: מִפָּנֶיךָ
  choice: உன் முன்னிலையிலிருந்து
  rationale: ‘உன் முகத்திற்கு முன்பிருந்து’ என்ற எபிரெய மரபுத்தொடரின் இடம்/சந்நிதி சார்ந்த பொருளைத் தெளிவாகவும் கண்ணியமாகவும் வழங்குகிறது.
- source_word: עַד אֲשֶׁר
  choice: வரை
  rationale: படிப்படியான துரத்துதல் எந்த நிலை எட்டப்படும் வரையில் தொடரும் என்பதை இயல்பாகக் குறிக்கிறது.
- source_word: תִּפְרֶה
  choice: நீ பெருகி
  rationale: פרה என்பதன் ‘பலன்தரு/பெருகு’ என்ற கருத்தில், இச்சூழலுக்குரிய மக்கள்தொகைப் பெருக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְנָחַלְתָּ
  choice: உன் உரிமையாக்கிக்கொள்ளும்
  rationale: נחל என்பதிலுள்ள ‘சுதந்தரமாகப் பெறு/உடைமையாக்கிக்கொள்’ என்ற இரு நிழற்பொருள்களையும் ஓரளவு தாங்கி, நிலத்தை நடைமுறையில் உடைமையாக ஏற்றுக்கொள்வதை நவீன தமிழில் தெளிவாக்குகிறது.
- source_word: אֶת־הָאָרֶץ
  choice: அந்த நாட்டை
  rationale: சூழலில் முன்பே குறிப்பிடப்பட்ட வாக்குத்தத்த நாடு குறிக்கப்படுவதால், சுட்டுப்பெயரடை பொருத்தமாக உள்ளது.
theological_decisions:
- issue: வெளியேற்றப்படுவோரைக் குறிக்கும் மூன்றாம் நபர் ஆண்பால் ஒருமை விகுதி
  choice: சூழலின் கூட்டுப்பொருளைத் தெளிவாக்க ‘அவர்களை’ என்று மொழிபெயர்த்து, எபிரெய ஒருமையை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: மூல இலக்கண வடிவத்தை நேரடியாகப் பிரதிபலிக்க ‘அவனை’ என்று மொழிபெயர்த்தல்
  rationale: எபிரெய ஒருமை நாட்டின் குடிகளையோ மக்களினங்களையோ கூட்டாகக் குறிக்க வாய்ப்புள்ளது. தமிழில் தனிநபர் ஒருவரைச் சுட்டும் தவறான எண்ணத்தைத் தவிர்க்கப் பன்மை இயல்பானது; அடிக்குறிப்பு உண்மையான இலக்கணத் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: נחל என்பதன் ‘சுதந்தரித்தல்’ மற்றும் ‘உடைமையாக்குதல்’ ஆகிய பொருள் நிழல்கள்
  choice: உன் உரிமையாக்கிக்கொள்ளும்
  alternative: அந்த நாட்டைச் சுதந்தரித்துக்கொள்ளும்
  rationale: ‘உரிமையாக்கிக்கொள்’ என்பது இச்சூழலில் நிலத்தைப் பெற்று வசப்படுத்துவதைத் தெளிவாகச் சொல்கிறது; அதேவேளை ‘சுதந்தரித்தல்’ என்ற மூலநிழல் அடிக்குறிப்பில் தக்கவைக்கப்படுகிறது. எந்தத் தனிப்பட்ட சமயக் கோட்பாட்டையும் இதில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கொஞ்சம் கொஞ்சமாக’ என்ற இயல்பான சொல்லடுக்கு மூலத்தின் மீளுருவத்தைப் பாதுகாக்கிறது. இறுதியில் சேர்க்கப்பட்ட ‘இப்படிச் செய்வேன்’ என்பது ‘வரை’ தொடரை தமிழில் இயல்பாக நிறைவு செய்யும் வெளிப்படையான இணைப்பு; புதிய கருத்தைச் சேர்ப்பதில்லை.
