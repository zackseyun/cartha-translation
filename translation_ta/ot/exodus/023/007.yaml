    issue: The main text’s final verb is somewhat less natural than it could be in modern formal Tamil.
    rationale: “நீதிமான் எனத் தீர்ப்பளிக்கமாட்டேன்” clearly signals a judicial pronouncement and retains the lexical connection between צַדִּיק and אַצְדִּיק.
