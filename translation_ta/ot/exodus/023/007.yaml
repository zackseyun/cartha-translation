    rationale: “விடுதலை செய்தல்” may mean releasing someone and does not reliably convey the forensic sense of acquitting. A phrase such as “குற்றமற்றவர் எனத் தீர்ப்பளிக்கமாட்டேன்” directly expresses the judicial declaration in the Hebrew.
