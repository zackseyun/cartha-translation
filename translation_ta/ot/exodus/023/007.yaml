  yaml_path: translation/ot/exodus/023/007.yaml
  text: Keep far from a false matter[a], and do not kill the innocent and the righteous[b], for I will not justify the wicked.
translation:
  language: ta
  text: பொய்யான காரியத்திலிருந்து விலகியிரு[a]. குற்றமற்றவனையும் நீதிமானையும் கொல்லாதே; ஏனெனில் பொல்லாதவனை நான் நீதிமான் எனத் தீர்ப்பளிக்கமாட்டேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பொய்யான குற்றச்சாட்டிலிருந்து விலகியிரு’ அல்லது ‘பொய்யிலிருந்து விலகியிரு.’ ‘காரியம்/சொல்’ என்பதற்கான எபிரெயச் சொல் பரந்த பொருளுடையது; பொய்ச் சாட்சி அல்லது வஞ்சகமான வழக்கையும் இது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘குற்றவாளியை நான் குற்றமற்றவர் எனத் தீர்ப்பளிக்கமாட்டேன்.’ எபிரெய வினைச்சொல் நீதித்துறைப் பொருளில் ‘நீதிமான் என்று அறிவித்தல்,’ ‘நீதிமான் எனத் தீர்ப்பளித்தல்,’ அல்லது ‘குற்றமற்றவர் எனத் தீர்ப்பளித்தல்’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/דְּבַר שֶׁקֶר
  choice: பொய்யான காரியத்தை விட்டு
  rationale: דָּבָר என்பது ‘சொல்,’ ‘காரியம்,’ ‘விவகாரம்,’ ‘வழக்கு’ ஆகிய பரந்த பொருள்களைக் கொண்டது. சட்டச் சூழலை அளவுக்கு மீறிக் குறுக்காமல் அதன் பரப்பைத் தக்கவைக்க ‘பொய்யான காரியம்’ என மொழிபெயர்க்கப்பட்டுள்ளது; ‘விட்டு’ என்பது מִן முன்னிடைச்சொல்லின் பிரிவுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תִּרְחָק
  choice: விலகியிரு
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை Qal வடிவம் இங்கு கட்டளையாகச் செயல்படுகிறது. ‘விலகியிரு’ என்பது வெறுமனே தவிர்ப்பதைவிடத் தொடர்ந்து தூரம் காத்துக்கொள்ளும் கருத்தைத் தருகிறது.
- source_word: וְ/נָקִי
  choice: குற்றமற்றவன்
  rationale: נָקִי என்பது குற்றத்திலிருந்து விடுபட்ட, குற்றமற்ற ஒருவரைக் குறிக்கிறது. நீதித்துறைச் சூழலில் ‘குற்றமற்றவன்’ தெளிவான நவீனத் தமிழாக உள்ளது.
- source_word: וְ/צַדִּיק
  choice: நீதிமான்
  rationale: צַדִּיק என்பது நீதியுள்ளவர் அல்லது வழக்கில் நியாயம் அவர் பக்கம் உள்ளவர் எனப் பொருள்படலாம். ‘நீதிமான்’ என்பது அதன் அறநெறி மற்றும் நீதித்துறைப் பரப்புகளையும் தக்கவைத்து, தொடர்ந்து வரும் אַצְדִּיק உடனான சொல் தொடர்பையும் வெளிப்படுத்துகிறது.
- source_word: אַל תַּהֲרֹג
  choice: கொல்லாதே
  rationale: הרג என்பது பொதுவாக ‘கொல்’ என்று பொருள்படும். ‘கொலை செய்யாதே’ என்று நோக்கத்தைச் சேர்த்துக் குறுக்காமல், மூலத்தின் பரந்த பொருளை ‘கொல்லாதே’ காக்கிறது.
- source_word: לֹא אַצְדִּיק
  choice: நீதிமான் என்று தீர்க்கமாட்டேன்
  rationale: צדק என்பதன் Hiphil வடிவம் இங்கு ஒருவரை நீதிமான் என அறிவிக்கும் நீதித்துறைத் தீர்ப்பைக் குறிக்கிறது. இந்த மொழிபெயர்ப்பு צַדִּיק உடனான எபிரெயச் சொல் தொடர்பைத் தமிழிலும் தெளிவாகத் தக்கவைக்கிறது.
- source_word: רָשָׁע
  choice: பொல்லாதவன்
  rationale: רָשָׁע என்பது அறநெறியில் பொல்லாதவரையும் சட்டரீதியில் குற்றவாளியையும் குறிக்கக்கூடும். ‘பொல்லாதவன்’ அதன் பரந்த அறநெறி-நீதித்துறைப் பொருளைத் தக்கவைக்கிறது; ‘குற்றவாளி’ என்பது சூழலுக்கேற்ற மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: கடவுளின் கூற்றிலுள்ள நீதித்துறைப் பொருள்
  choice: பொல்லாதவனை நான் நீதிமான் என்று தீர்க்கமாட்டேன்
  alternative: குற்றவாளியை நான் விடுதலை செய்யமாட்டேன்
  rationale: மனித நீதித் தீர்ப்புக்கான கட்டளையை கடவுளின் சொந்த நீதியான தீர்ப்போடு வசனம் இணைக்கிறது. ‘நீதிமான் என்று தீர்க்கமாட்டேன்’ என்பது நீதித்துறை அறிவிப்பையும் צַדִּיק–אַצְדִּיק என்ற சொல் தொடர்பையும் காக்கிறது. ‘குற்றவாளியை விடுதலை செய்யமாட்டேன்’ என்பது சூழலில் வலுவான மாற்று; ஆனால் அந்தச் சொல் தொடர்பைக் காட்டாது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை நேரடிக் கட்டளை நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. ‘நீதிமான்’ மற்றும் ‘நீதிமான் என்று தீர்க்கமாட்டேன்’ என்பவற்றின் மூலம் எபிரெய மூலத்திலுள்ள צדק சொற்குடும்பத் தொடர்பு இயன்றவரை காக்கப்பட்டுள்ளது.
