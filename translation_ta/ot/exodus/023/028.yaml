base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/028.yaml
  text: And I will send the hornet ahead of you[a], and it will drive out the Hivite, the Canaanite, and the Hittite from before you.
translation:
  language: ta
  text: நான் உனக்கு முன்னே குளவியை[a] அனுப்புவேன்; அது ஏவியரையும் கானானியரையும் ஏத்தியரையும் உனக்கு முன்பாக இருந்து துரத்திவிடும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இஸ்ரவேலருக்கு முன்னே அனுப்பப்படும் பீதியையோ, இறைவன் ஏற்படுத்தும் வேறு ஏதாவது அழுத்தத்தையோ குறிக்கும் உருவகமாக இருக்கலாம்; எபிரெயச் சொல் பொதுவாக ‘குளவி’ என்றே பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: நான் ... அனுப்புவேன்
  rationale: இணைப்புச் சொல்லுடன் வந்த Qal perfect முதலாம் நபர் ஒருமை, இச்சூழலில் எதிர்கால வாக்குறுதியைக் குறிக்கிறது; இறைச் செயற்பாட்டை நேரடியாகப் பாதுகாக்கிறது.
- source_word: הַצִּרְעָה
  choice: குளவியை
  rationale: எபிரெயச் சொல் இயல்பாகக் குளவி அல்லது கொட்டும் பூச்சியைக் குறிக்கிறது. ஒருமை வடிவத்தைத் தமிழிலும் ஒருமையாக வைத்து, உருவகப் பொருளை அடிக்குறிப்பில் திறந்துவைக்கிறது.
- source_word: לְפָנֶיךָ
  choice: உனக்கு முன்னே
  rationale: சொல்லளவில் ‘உன் முகத்திற்கு முன்’; இங்கு இஸ்ரவேலருக்கு முன்பாகச் சென்று செயல்படுவதைக் குறிக்க இயல்பான தமிழ் சொற்றொடர்.
- source_word: וְגֵרְשָׁה
  choice: அது ... துரத்திவிடும்
  rationale: גרשׁ என்பதன் பொருள் ‘துரத்து, வெளியேற்று.’ பெண்பால் ஒருமை வினைச்சொல் குளவியையே எழுவாயாகக் கொண்டிருப்பதால் ‘அது’ வெளிப்படையாகச் சேர்க்கப்பட்டது.
- source_word: הַחִוִּי
  choice: ஏவியர்
  rationale: பெயரினத் தன்மையைப் பாதுகாக்கும், தமிழில் வழக்கிலுள்ள வேதாகம இனப்பெயர் வடிவம்.
- source_word: הַכְּנַעֲנִי
  choice: கானானியர்
  rationale: குறிப்பிட்ட மக்களினத்திற்கான தமிழில் நிலைபெற்ற பெயர்.
- source_word: הַחִתִּי
  choice: ஏத்தியர்
  rationale: குறிப்பிட்ட மக்களினத்திற்கான தமிழில் வழக்கிலுள்ள வேதாகமப் பெயர்.
- source_word: מִלְּפָנֶיךָ
  choice: உன் முன்னிலையிலிருந்து
  rationale: ‘உனக்கு முன்பிருந்து/உன் முகத்திற்கு முன்பிருந்து’ என்ற இடவியல் கருத்தை இயல்பான, மரியாதையான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: הַצִּרְעָה என்பதை நேர்ப்பொருளாக மொழிபெயர்ப்பதா, உருவகமாக விளக்குவதா
  choice: முதன்மை உரையில் ‘குளவி’ என்று நேர்ப்பொருளில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘திகில்,’ அல்லது இஸ்ரவேலருக்கு முன்னே அனுப்பப்பட்ட பீதி, வாதை, இராணுவ அழுத்தம் போன்ற இறை அழுத்தத்தின் உருவகம்.
  rationale: எபிரெயச் சொல்லின் இயல்பான அகராதிப் பொருள் குளவி அல்லது கொட்டும் பூச்சி என்பதாகும். உருவகப் புரிதல் சாத்தியமானாலும் உரையால் கட்டாயப்படுத்தப்படாததால், அதை முதன்மை உரையில் திணிக்காமல் அடிக்குறிப்பில் பாதுகாக்கிறோம்.
translation_notes:
  register: நவீன தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உனக்கு முன்னே’ மற்றும் ‘உன் முன்னிலையிலிருந்து’ என்ற சொற்றொடர்கள் மூலத்தின் இடவியல் மறுமொழியை இயல்பாகப் பாதுகாக்கின்றன; இனப்பெயர்கள் தமிழில் வழக்கிலுள்ள வேதாகம வடிவங்களில் தரப்பட்டுள்ளன.
