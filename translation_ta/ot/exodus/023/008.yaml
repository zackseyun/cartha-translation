source:
  edition: WLC
  text: וְ/שֹׁ֖חַד לֹ֣א תִקָּ֑ח כִּ֤י הַ/שֹּׁ֨חַד֙ יְעַוֵּ֣ר פִּקְחִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/008.yaml
  text: And you shall not take a bribe[b][a], for a bribe blinds the clear-sighted and twists the words of the righteous.
translation:
  language: ta
  text: நீ கையூட்டு பெறாதே; ஏனெனில், கையூட்டு தெளிவாகக் காண்பவர்களைக்[a] குருடாக்கி, நீதிமான்களின் சொற்களை[b] திரித்துவிடும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பகுத்தறிவுள்ளவர்களை.” எபிரேய மொழி தெளிவான தீர்மானத் திறனையும் உணர்த்துகிறது; ஆயினும், பார்வை உருவகத்தைத் தக்கவைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “நீதிமான்களின் சொற்கள்” என்பதைச் சட்டச் சூழலில், “நியாயம் அவர்கள் பக்கம் உள்ளவர்களின் வாக்குமூலங்கள்” அல்லது “அவர்களுடைய வழக்கு” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: கையூட்டு
  rationale: தீர்ப்பைத் தவறாகச் செல்வாக்குச் செய்ய வழங்கப்படும் ஊழல் பணம் அல்லது பரிசைத் தெளிவாகக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: לֹא תִקָּח
  choice: வாங்காதே
  rationale: சட்டச் சூழலில் இரண்டாம் நபர் ஒருமைக்குரிய நேரடியான தடையை இயல்பாக வெளிப்படுத்துகிறது; לקח என்பதன் ‘எடுத்தல்/பெறுதல்’ பொருளையும் தக்கவைக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: தடைக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்பின் விளக்க வலிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְעַוֵּר
  choice: குருடாக்கி
  rationale: காரணவினையின் வலிமையையும் பார்வை சார்ந்த உருவகத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: פִּקְחִים
  choice: தெளிவாகக் காண்பவர்களை
  rationale: நல்ல பகுத்தறிவைக் குறிக்கும் உருவகப் பொருளுடன், மூலத்தின் பார்வை உருவகத்தையும் தக்கவைக்கிறது.
- source_word: וִיסַלֵּף
  choice: புரட்டிவிடும்
  rationale: சொற்கள் அல்லது நீதிக்குரிய வாதம் ஊழலால் திரிக்கப்பட்டு மாற்றப்படுவதை உயிரோட்டமான தமிழில் தெரிவிக்கிறது.
- source_word: דִּבְרֵי
  choice: சொற்களை
  rationale: ‘சொற்கள், கூற்றுகள், விவகாரங்கள்’ எனும் எபிரெயச் சொல்லின் அகலத்தைச் சுருக்காமல், சட்டச் சூழல் அதன் நுட்பத்தை உணர்த்த இடமளிக்கிறது.
- source_word: צַדִּיקִים
  choice: நீதிமான்களின்
  rationale: ஒழுக்கரீதியாக நீதியுள்ளவர்கள் என்றும் வழக்கில் நியாயம் அவர்கள் பக்கம் உள்ளவர்கள் என்றும் கொள்ளக்கூடிய மூலத்தின் இருபொருள் சாத்தியத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: צַדִּיקִים என்பதன் ஒழுக்க மற்றும் சட்டப் பொருள் பரப்பு
  choice: நீதிமான்கள்
  alternative: நியாயம் அவர்கள் பக்கம் உள்ளவர்கள்
  rationale: ஒரு சட்ட வழக்கில் சரியான தரப்பினரைக் குறிக்கும் சாத்தியத்தை அடிக்குறிப்பில் சுட்டிக்காட்டி, முதன்மை உரையில் எபிரெயத்தின் பரந்த ஒழுக்க-நீதித்துறை ஒலிப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் சட்டப்பகுதியின் கண்ணியமும் சுருக்கமும் காக்கப்பட்டுள்ளன. ‘தெளிவாகக் காண்பவர்கள்—குருடாக்குதல்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; நீதிமான்கள்/சரியான தரப்பு என்ற உண்மையான பொருள் இருமை அடிக்குறிப்பில் திறந்துவைக்கப்பட்டுள்ளது.
