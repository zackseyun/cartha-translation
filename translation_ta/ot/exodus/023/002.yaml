source:
  edition: WLC
  text: לֹֽא תִהְיֶ֥ה אַחֲרֵֽי רַבִּ֖ים לְ/רָעֹ֑ת וְ/לֹא תַעֲנֶ֣ה עַל רִ֗ב לִ/נְטֹ֛ת אַחֲרֵ֥י רַבִּ֖ים לְ/הַטֹּֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/002.yaml
  text: You shall not follow the many to do evil[a], and you shall not testify in a dispute so as to turn aside after the many, to pervert justice.
translation:
  language: ta
  text: தீமை செய்வதற்காகப் பலரைப் பின்பற்றாதே. ஒரு வழக்கில் பலரைப் பின்பற்றி நீதியைச் சாய்க்கும் வகையில் சாட்சி சொல்லாதே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சாட்சி சொல்லாதே’ என்பதை ‘பதில் சொல்லாதே’ என்றும், ‘நீதியைச் சாய்க்கும்’ என்பதை ‘தீர்ப்பைச் சாய்க்கும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: ענה என்பதில் ‘பதில் சொல்/சாட்சி சொல்’ என்ற பொருள் வேறுபாடு உள்ளது. இறுதியிலுள்ள להטות என்பதன் செயப்படுபொருள் வெளிப்படையாகக் கூறப்படவில்லை; சட்டச் சூழலில் அது நீதியையோ தீர்ப்பையோ சாய்த்தலைக் குறிக்கலாம்.
lexical_decisions:
- source_word: תִהְיֶה אַחֲרֵי רַבִּים
  choice: பலரைப் பின்பற்றாதே
  rationale: היה אחרי என்ற சொற்றொடர் ஒருவரின் பின்னால் செல்வதை, அதாவது அவரைப் பின்பற்றுவதை, குறிக்கிறது. רַבִּים என்பது ‘பலர்’ அல்லது ‘பெரும்பான்மையினர்’ எனப் பொருள்படலாம்; ‘பலர்’ என்பது எபிரெயச் சொல்லின் பரப்பையும் அதன் மறுபயன்பாட்டையும் காக்கிறது.
- source_word: לְרָעֹת
  choice: தீமை செய்வதற்காக
  rationale: ל உடன் வரும் இச்சொல் நோக்கம் அல்லது விளைவைக் குறிக்கிறது. இச்சூழலில் רָעֹת என்பதன் ஒழுக்கவியல் வலிமையை ‘தீமை செய்வதற்காக’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תַעֲנֶה עַל רִיב
  choice: ஒரு வழக்கில் ... சாட்சி சொல்லாதே
  rationale: ענה என்பதன் அடிப்படைப் பொருள் ‘பதில் சொல்’ என்றாலும், רִיב எனும் சட்டத் தகராறுடன் வரும்போது சாட்சியாகப் பேசுவதைக் குறிக்கலாம். ‘வழக்கு’ மற்றும் ‘சாட்சி சொல்லுதல்’ ஆகியவை நீதிமன்றச் சூழலைத் தெளிவாக்குகின்றன.
- source_word: לִנְטֹת אַחֲרֵי רַבִּים
  choice: பலரைப் பின்பற்றிச் சாய்ந்து
  rationale: נטה என்பது சாய்தல் அல்லது நேரான வழியிலிருந்து விலகுதல் என்ற உருவகத்தைக் கொண்டது. ‘சாய்ந்து’ அந்த உருவகத்தைப் பாதுகாக்கிறது; ‘பலரைப் பின்பற்றி’ என்பது மூலத்தின் திரும்பச்சொல்லுதலைத் தக்கவைக்கிறது.
- source_word: לְהַטֹּת
  choice: நீதியைப் புரட்டும்
  rationale: இது נטה வினையின் காரணவினை வடிவம்; சட்டச் சூழலில் தீர்ப்பையோ நீதியையோ சாய்த்தல் அல்லது கெடுத்தல் என்று பொருள்படும். எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், ‘நீதியை’ என்பது உடனடிச் சூழலால் நியாயப்படுத்தப்படும் தெளிவாக்கம்.
theological_decisions:
- issue: இறுதி வினைச்சொல்லில் மறைந்துள்ள சட்டப் பொருள்
  choice: ‘நீதியைப் புரட்டும்’ என்று மறைந்த செயப்படுபொருளை வெளிப்படுத்துதல்
  alternative: ‘தீர்ப்பைச் சாய்க்கும்’ அல்லது செயப்படுபொருளைக் குறிப்பிடாமல் ‘சாய்க்கும்’
  rationale: சாட்சி மற்றும் வழக்கு குறித்த உடனடிச் சூழல், இது நீதியையோ தீர்ப்பையோ தவறாகத் திருப்புவதைக் குறிக்கிறது என்பதை காட்டுகிறது. ‘நீதி’ என்று சேர்ப்பது எந்தக் குறிப்பிட்ட கோட்பாட்டையும் புகுத்தாமல் சட்டநெறி வலிமையைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான சட்டநெறிக் கட்டளையாக மொழிபெயர்க்கப்பட்டுள்ளது. ‘பலர்’ என்ற சொல் இருமுறையும் பயன்படுத்தப்பட்டு எபிரெய மூலத்தின் வலியுறுத்தல் காக்கப்பட்டுள்ளது; ‘சாய்ந்து’ என்ற உருவகமும் இயன்றவரை தக்கவைக்கப்பட்டுள்ளது.
