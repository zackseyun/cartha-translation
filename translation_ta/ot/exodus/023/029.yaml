base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/029.yaml
  text: I will not drive them out from before you in one year[b][a], lest the land become desolate and the wild animals of the field become too numerous against you.
translation:
  language: ta
  text: ஒரே ஆண்டில் உன் முன்பாக இருந்து அவர்களை நான் துரத்திவிட மாட்டேன்; இல்லையெனில், நாடு பாழாகிவிடும்; காட்டு விலங்குகள் உனக்கு எதிராகப் பெருகிவிடும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களை” என்பதற்கான எபிரெயச் சொல் இலக்கண வடிவில் “அவனை” என்று ஒருமையில் உள்ளது; இங்கு அது அந்நாட்டின் குடிமக்களை அல்லது பகைவரைத் தொகுப்பாகக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגָרְשֶׁנּוּ
  choice: அவர்களைத் துரத்திவிட மாட்டேன்
  rationale: גרש என்பது ‘துரத்து/வெளியேற்று’ எனப் பொருள்படும். எபிரெயச் சொல்லில் ஒருமை பின்னொட்டு இருந்தாலும், சூழலில் அது முன் குறிப்பிடப்பட்ட குடிமக்களைத் தொகுப்பாகச் சுட்டுகிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்கப் பன்மை பயன்படுத்தப்பட்டது.
- source_word: מִפָּנֶיךָ
  choice: உன் முன்னிலையிலிருந்து
  rationale: ‘உன் முகத்திற்கு முன்பிருந்து’ என்ற இடவியல் எபிரெய மரபுத்தொடரின் கருத்தை, இயல்பான நவீன தமிழில் இது தக்கவைக்கிறது.
- source_word: בְּשָׁנָה אֶחָת
  choice: ஒரே ஆண்டில்
  rationale: ஒரு ஆண்டுக்குள் முழுமையாகத் துரத்திவிடாதிருப்பதை இயல்பாகவும் வலியுறுத்தலுடனும் வெளிப்படுத்துகிறது.
- source_word: פֶּן
  choice: அப்படிச் செய்தால்
  rationale: פן அறிமுகப்படுத்தும் தவிர்க்க வேண்டிய எதிர்மறை விளைவைத் தமிழில் தெளிவான நிபந்தனை வடிவில் தெரிவிக்கிறது.
- source_word: תִּהְיֶה הָאָרֶץ שְׁמָמָה
  choice: நாடு பாழாகி
  rationale: שְׁמָמָה குறிக்கும் குடியிருப்பற்ற, பயன்படுத்தப்படாத பாழ்நிலையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְרַבָּה
  choice: பெருகி
  rationale: רבה என்பதன் அடிப்படைப் பொருளான ‘எண்ணிக்கையில் பெருகுதல்’ என்பதைக் கூடுதல் விளக்கமின்றி நேரடியாகத் தருகிறது.
- source_word: עָלֶיךָ
  choice: உனக்கு அச்சுறுத்தலாகிவிடும்
  rationale: இச்சூழலில் על குறிக்கும் பாதகமான எதிர்நிலையை, காட்டு விலங்குகள் மனிதர்களுக்கு ஆபத்தாகும் பொருளில் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חַיַּת הַשָּׂדֶה
  choice: காட்டு விலங்குகள்
  rationale: நிலப்பரப்பில் வாழும் வனவிலங்குகளைக் குறிக்கும் இச்சொற்றொடருக்கு நவீனத் தமிழில் தெளிவான பொதுவழக்கு.
theological_decisions:
- issue: אֲגָרְשֶׁנּוּ என்பதிலுள்ள ஒருமை பொருள் பின்னொட்டு
  choice: சூழலுக்கேற்ப ‘அவர்களை’ என்ற தொகுப்புப் பன்மை
  alternative: ‘அவனை’ என்ற இலக்கண ஒருமை
  rationale: எபிரெயத்தில் பின்னொட்டு ஒருமையாக இருந்தாலும், முந்தைய வசனத்தில் குறிப்பிடப்படும் மக்களினங்களை அல்லது பகைவரைத் தொகுப்பாகச் சுட்டுவது மிகச் சாத்தியம். தமிழில் ‘அவனை’ என்பது குறிப்பிட்ட ஓர் ஆண் நபரைத் தவறாக உணர்த்தக்கூடும்; ஆகவே மூலத்தின் தொகுப்புக் குறிப்பை அடிக்குறிப்பில் பதிவு செய்து உரையில் பன்மை தரப்பட்டது.
translation_notes:
  register: நவீன, தெளிவான, மரியாதைமிக்க தமிழ். ‘உன் முன்னிலையிலிருந்து’ மூலத்தின் இடவியல் உருவகத்தைத் தக்கவைக்கிறது; இறுதிக் கூறு சொற்சொல் இறுக்கத்தைத் தவிர்த்து அச்சுறுத்தல் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
