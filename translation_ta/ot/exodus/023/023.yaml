base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/023.yaml
  text: For my angel will go before you and bring you to the Amorites[a], the Hittites, the Perizzites, the Canaanites, the Hivites, and the Jebusites[b], and I will wipe them out.
translation:
  language: ta
  text: ஏனெனில், என் தூதர்[a] உனக்கு முன்பாகச் சென்று, அமோரியர், ஏத்தியர், பெரிசியர், கானானியர், ஏவியர், எபூசியர் ஆகியோரிடத்துக்கு உன்னைக் கொண்டுபோவார்; நான் அவர்களை[b] அழித்தொழிப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் செய்தியாளர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மַלְאָךְ என்ற சொல் மனிதத் தூதரையோ விண்ணுலகத் தூதரையோ குறிக்கக்கூடும்; இங்கு அந்தத் தூதரின் துல்லியமான இயல்பு வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல் ‘அவனை/அதை அழித்தொழிப்பேன்’ என்று ஒருமை பின்னொட்டு உள்ளது; அது பட்டியலிடப்பட்ட மக்களினங்களை ஒரே தொகுதியாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளை மற்றும் வாக்குறுதிக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: יֵלֵךְ
  choice: சென்று
  rationale: சூழலில் எதிர்கால வாக்குறுதியைக் குறிக்கிறது; தொடரும் வினையுடன் இணைந்து இயல்பாக அமைகிறது.
- source_word: מַלְאָכִי
  choice: என் தூதர்
  rationale: מַלְאָךְ என்பது மனிதத் தூதரையோ விண்ணுலகத் தூதரையோ குறிக்கலாம். ‘தூதர்’ மூலமொழியின் இந்தப் பொருள் விரிவைத் தக்கவைத்து, அந்த நபரின் இயல்பை வசனம் கூறுவதைக் காட்டிலும் மேலாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: לְפָנֶיךָ
  choice: உனக்கு முன்பாக
  rationale: முன்னே சென்று வழிநடத்தும் பொருளை மூலத்துக்கு நெருக்கமாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: וֶהֱבִיאֲךָ
  choice: உன்னைக் கொண்டுபோவார்
  rationale: בוא என்பதன் ஹிஃபீல் வடிவமான ‘வரச் செய்/கொண்டுபோ’ என்ற நேரடிப் பொருளை இலக்கிடத்துடன் இயல்பாக இணைக்கிறது.
- source_word: הָאֱמֹרִי ... וְהַיְבוּסִי
  choice: எமோரியர், ஏத்தியர், பெரிசியர், கானானியர், ஏவியர், எபூசியர்
  rationale: எபிரெயத்தில் ஒருமை இனப்பெயர் வடிவில் வரும் மக்களினப் பெயர்களை, தமிழில் மக்கள்குழுக்களைக் குறிக்கும் வழக்கமான வடிவில் ஒலிபெயர்க்கிறது.
- source_word: וְהִכְחַדְתִּיו
  choice: நான் அவர்களை அழித்தொழிப்பேன்
  rationale: כחד என்பதன் ஹிஃபீல் வடிவம் மறைந்துபோகச் செய்தல் அல்லது முற்றாக அழித்தல் என்ற வலிமையைக் கொண்டது. ஒருமை பின்னொட்டு முன் பட்டியலிடப்பட்ட மக்களினங்களை ஒருங்கிணைந்த தொகுதியாகக் குறிப்பதால், தமிழில் இயல்பான பன்மை ‘அவர்களை’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: מַלְאָכִי என்பவரின் அடையாளமும் இயல்பும்
  choice: ‘என் தூதர்’ என்று மொழிபெயர்த்து, அவர் யார் என்பதை வசனம் கூறுவதற்கு அப்பால் அடையாளப்படுத்தவில்லை.
  alternative: ‘என் தேவதூதர்’; ஆண்டவரின் இறைத்தோற்றம்; மனிதராகப் பிறப்பதற்கு முந்தைய குமாரன்
  rationale: இவ்வசனம் அந்த நபரை தேவனுடைய தூதர் என்றே குறிப்பிடுகிறது. ‘தூதர்’ என்பது மூலச்சொல்லின் உண்மையான தெளிவின்மையைப் பாதுகாத்து, பிற்கால இறையியல் அடையாளத்தை மொழிபெயர்ப்புக்குள் புகுத்தாமல் விடுகிறது.
- issue: וְהִכְחַדְתִּיו என்பதில் கருமத்தின் எண்
  choice: ஒருமை எபிரெயப் பின்னொட்டின் கூட்டுப் பொருளைத் தமிழில் ‘அவர்களை’ என்ற பன்மையால் தெரிவித்தல்
  alternative: ‘அவனை/அதை அழித்தொழிப்பேன்’ என்ற சொல்-வடிவ ஒருமை
  rationale: எபிரெய வடிவம் ஒருமையாக இருந்தாலும், முன் பட்டியலிடப்பட்ட மக்களினங்களை ஒரே கூட்டாகச் சுட்டுகிறது. பன்மைத் தமிழ் கருமம் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபருக்கு ‘நீ/உன்’ சார்ந்த வடிவங்களும், தூதருக்கு மரியாதை வினைமுற்றும் பயன்படுத்தப்பட்டுள்ளன. மக்களினப் பெயர்கள் தமிழ் வேதாகம வழக்கில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு வடிவங்களில் தரப்பட்டுள்ளன.
