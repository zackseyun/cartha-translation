base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/022.yaml
  text: But if you carefully obey his voice and do all that I speak[b][a], then I will be an enemy to your enemies and an adversary to your adversaries.
translation:
  language: ta
  text: ஆனால் நீ அவன் குரலுக்குக் கவனமாகக் கீழ்ப்படிந்து[a], நான் சொல்வதையெல்லாம் செய்தால்[b], உன் பகைவர்களுக்கு நான் பகைவனாகவும், உன் எதிரிகளுக்கு எதிரியாகவும் இருப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் குரலை நீ நிச்சயமாகக் கேட்டால்.” எபிரெயத்தில் வலியுறுத்துவதற்காக, அதே வினையின் infinitive absolute வடிவமும் முற்றுப்பெறா வினை வடிவமும் சேர்ந்து வருகின்றன.
    reason: lexical_alternative
  - marker: b
    text: இவ்வசனம் “அவன் குரல்” என்பதிலிருந்து “நான் சொல்வது” என்று மாறுகிறது. சூழலில் தூதருக்கும் ஆண்டவருக்கும் உள்ள நெருக்கமான தொடர்பை இந்த மாற்றம் அப்படியே காக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי אִם
  choice: ஆனால் … செய்தால்
  rationale: முந்தைய எச்சரிக்கையோடு முரண்பாட்டையும் நிபந்தனையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׁמֹעַ תִּשְׁמַע
  choice: கவனமாகக் கீழ்ப்படிந்து
  rationale: முற்றுப்பெறா வினையுடன் வந்த வினையெச்சத்தின் வலியுறுத்தலையும், குரலைக் கேட்பது கீழ்ப்படிதலைக் குறிக்கும் சூழல்சார் பொருளையும் சேர்த்துக் காட்டுகிறது.
- source_word: בְּקֹלוֹ
  choice: அவன் குரலுக்கு
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட தூதரைக் குறிக்கும் ஆண்பால் ஒருமைச் சுட்டையும், தனிப்பட்ட குரல் என்ற எபிரெயப் படிமத்தையும் காக்கிறது.
- source_word: וְעָשִׂיתָ כֹּל אֲשֶׁר אֲדַבֵּר
  choice: நான் சொல்வதையெல்லாம் செய்தால்
  rationale: ‘அவன் குரல்’ என்பதிலிருந்து ஆண்டவரின் முதலாம் நபர் பேச்சான ‘நான் சொல்வது’ என்பதற்கு உரை மாறுவதைச் சீராக்காமல் காக்கிறது.
- source_word: וְאָיַבְתִּי אֶת אֹיְבֶיךָ
  choice: உன் பகைவர்களுக்கு நான் பகைவனாகவும்
  rationale: வினைக்கும் ‘பகைவர்கள்’ என்ற பெயர்ச்சொல்லுக்கும் இடையிலுள்ள சொல் தொடர்பைத் தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: וְצַרְתִּי אֶת צֹרְרֶיךָ
  choice: உன் எதிரிகளுக்கு எதிரியாகவும் இருப்பேன்
  rationale: முந்தைய ‘பகைவர்’ என்பதிலிருந்து எபிரெயத்தில் உள்ள சொல் வேறுபாட்டையும், தொடர்புடைய வினை–பெயர் சொல்விளையாட்டையும் இணையான தமிழால் காக்கிறது.
theological_decisions:
- issue: ‘அவன் குரல்’ என்பதிலிருந்து ‘நான் சொல்வது’ என்பதற்கான குறிப்பு மாற்றம்
  choice: தூதரின் குரலையும் ஆண்டவரின் முதலாம் நபர் பேச்சையும் உரையில் உள்ளபடியே வேறுபடுத்திக் காட்டுதல்
  alternative: இரு கூற்றுகளையும் தூதரையே அல்லது ஆண்டவரையே மட்டும் குறிப்பதாகச் சீராக்குதல்
  rationale: உடனடிச் சூழலில் தூதருக்கும் ஆண்டவரின் சொந்த பேச்சுக்கும் உள்ள நெருக்கமான தொடர்பை உரை வெளிப்படுத்துகிறது; அதை விளக்கத்தின் மூலம் ஒரே குறிப்பாக மாற்றாமல் அதன் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மதிப்புடனும் அமைக்கப்பட்டுள்ளது. ‘குரலுக்குக் கீழ்ப்படிதல்’ என்ற சொற்றொடர் கேட்டலையும் அதற்கேற்ற செயலையும் இணைக்கிறது; இறுதி இரு கூறுகள் எபிரெய இணை அமைப்பையும் சொல் தொடர்புகளையும் முடிந்தவரை காக்கின்றன.
