base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/031.yaml
  text: And I will set your border from the Red Sea to the Sea of the Philistines[a], and from the wilderness to the River; for I will give the inhabitants of the land into your hand[b], and you will drive them out from before you.
translation:
  language: ta
  text: உன் எல்லையைச் செங்கடலிலிருந்து பெலிஸ்தியரின் கடல் வரையிலும், பாலைநிலத்திலிருந்து அந்த நதி வரையிலும் அமைப்பேன். ஏனெனில், அந்த நாட்டில் குடியிருப்பவர்களை உங்கள் கையில் கொடுப்பேன்; நீ அவர்களை உன் முன்பிலிருந்து துரத்திவிடுவாய்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשַׁתִּי
  choice: அமைப்பேன்
  rationale: இறைவாக்குறுதியின் சூழலில் எதிர்காலப் பொருளைத் தருகிறது; எல்லையை நிர்ணயித்து நிலைநிறுத்துதல் என்ற கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: גְּבֻלְךָ
  choice: உன் எல்லை
  rationale: இங்கு நிலப்பரப்பின் வரம்பைக் குறிக்கும் ஒருமை இரண்டாம் நபர் வடிவத்தைப் பாதுகாக்கிறது.
- source_word: מִיַּם סוּף
  choice: செங்கடல்
  rationale: அடையாளம் காண எளிதான மரபுவழிப் புவியியல் பெயர்; எபிரெயச் சொல்லின் நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יָם פְּלִשְׁתִּים
  choice: பெலிஸ்தியரின் கடல்
  rationale: கடலை பெலிஸ்தியருடன் தொடர்புபடுத்தும் எபிரெயப் பெயரிடலை வெளிப்படையாகப் பாதுகாக்கிறது; ‘மத்தியதரைக் கடல்’ என்று விளக்கி மொழிபெயர்க்கவில்லை.
- source_word: וּמִמִּדְבָּר
  choice: பாலைநிலம் தொடங்கி
  rationale: מִדְבָּר என்பது குடியேற்றமற்ற வறண்ட நிலப்பகுதியைக் குறிக்கிறது; ‘பாலைநிலம்’ நவீனத் தமிழில் இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: הַנָּהָר
  choice: அந்த நதி
  rationale: குறிப்பிட்ட, நன்கு அறியப்பட்ட நதியைச் சுட்டும் எபிரெய வடிவத்தை முதன்மை உரையில் பாதுகாக்கிறது; அது யூப்ரடீஸ் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன்னுள்ள எல்லை வாக்குறுதிக்கான அடிப்படையை அறிமுகப்படுத்தும் காரண இணைப்பாகப் பொருந்துகிறது.
- source_word: אֶתֵּן בְּיֶדְכֶם
  choice: உங்கள் கையில் கொடுப்பேன்
  rationale: ஒருவரை மற்றொருவரின் அதிகாரத்திற்குள் ஒப்படைப்பதைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் தெளிவாகப் பாதுகாக்கிறது; மூலத்திலுள்ள பன்மை ‘உங்கள்’ என்பதும் விடப்படவில்லை.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: அந்த நாட்டில் குடியிருப்பவர்கள்
  rationale: நாட்டில் வசிப்பவர்களைக் குறிக்கும் எபிரெய வினையெச்சப் பெயர்ச்சொல்லை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְגֵרַשְׁתָּמוֹ
  choice: நீ அவர்களைத் துரத்திவிடுவாய்
  rationale: גרשׁ என்பதன் வலுவான ‘வெளியேற்றுதல்’ பொருளை நேரடியாகத் தருகிறது; மூலத்தின் ஒருமை இரண்டாம் நபர் வடிவமும் பாதுகாக்கப்படுகிறது.
- source_word: מִפָּנֶיךָ
  choice: உன் முன்னிலையிலிருந்து
  rationale: ‘உன் முகத்திற்கு முன்பிருந்து’ என்ற எபிரெயச் சொற்றொடரின் இருப்பிடம்/எதிர்நிலை உருவகத்தைப் புரியத்தக்க தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: יַם סוּף என்ற புவியியல் பெயர்
  choice: முதன்மை உரையில் ‘செங்கடல்’
  alternative: ‘நாணற்கடல்’
  rationale: இது முதன்மையாக சொற்பொருள் மற்றும் புவியியல் சார்ந்த தீர்மானம். பரவலாக அறியப்பட்ட பெயர் முதன்மை உரையில் வைக்கப்பட்டு, எபிரெயின் நேரடியான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: இரண்டாம் நபர் எண்ணில் ஏற்படும் மாற்றம்
  choice: ‘உன்/நீ’ என்ற ஒருமையையும் ‘உங்கள்’ என்ற பன்மையையும் மூலத்தின்படி பாதுகாத்தல்
  alternative: எல்லா இடங்களிலும் ஒருமை அல்லது பன்மையாக ஒருமைப்படுத்துதல்
  rationale: எபிரெய உரை இஸ்ரவேலை ஒருங்கிணைந்த ஒருவராகச் சுட்டுவதற்கும் சமூகமாகச் சுட்டுவதற்கும் இடையில் மாறுகிறது. அந்த அர்த்தத் திரிபைச் சீராக்காமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமும் பொதுவாசகர்களுக்கான தெளிவும் பேணப்பட்டுள்ளன. புவியியல் எல்லைகளின் இணை அமைப்பு இயல்பாக ஒலிக்க ‘தொடங்கி ... வரையிலும்’ பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயத்தில் ஒருமை ‘உன்/நீ’ என்பதிலிருந்து பன்மை ‘உங்கள்’ என்பதற்கும் மீண்டும் ஒருமைக்கும் ஏற்படும் நோக்கமுள்ள மாற்றம் சீராக்கப்படவில்லை. எல்லா அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்களுக்குப் பின்னரே முதன்மை உரையில் வைக்கப்பட்டுள்ளன.
