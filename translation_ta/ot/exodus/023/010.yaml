  text: וְ/שֵׁ֥שׁ שָׁנִ֖ים תִּזְרַ֣ע אֶת אַרְצֶ֑/ךָ וְ/אָסַפְתָּ֖ אֶת תְּבוּאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/010.yaml
  text: For six years you shall sow your land and gather its produce[a].
translation:
  language: ta
  text: ஆறு ஆண்டுகள் உன் நிலத்தில் விதைத்து, அதன் விளைச்சலைச் சேகரிப்பாயாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதன் பலனை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֵׁשׁ שָׁנִים
  choice: ஆறு ஆண்டுகள்
  rationale: தொடக்க இணைப்புச்சொல் காலச்சட்டகத்தை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பாக ‘ஆறு ஆண்டுகள்’ என வழங்கப்படுகிறது.
- source_word: תִּזְרַע
  choice: விதைத்து
  rationale: சட்டச் சூழலில் இரண்டாம் நபர் ஒருமை வினை கட்டளைத் தன்மை உடையது; தொடர்ந்துவரும் இரு செயல்களையும் இயல்பான தமிழில் ஒரே கட்டளைத் தொடராக அமைக்கிறது.
- source_word: אַרְצֶךָ
  choice: உன் நிலத்தில்
  rationale: இங்கு אֶרֶץ பூமி முழுவதையும் அல்ல, பயிரிடப்படும் ஒருவருடைய நிலத்தைக் குறிக்கிறது; விதைத்தல் தமிழில் இடவேற்றுமையுடன் இயல்பாக வருகிறது.
- source_word: וְאָסַפְתָּ
  choice: சேகரிப்பாயாக
  rationale: אָסַף என்பது சேகரித்தல் அல்லது ஒன்றுகூட்டுதல்; அறுவடை என்ற குறிப்பிட்ட செயலை மட்டும் சொல்லாமல் எபிரெயச் சொல்லின் பரப்பைத் தக்கவைக்கிறது.
- source_word: תְּבוּאָתָהּ
  choice: அதன் விளைச்சலை
  rationale: תְּבוּאָה நிலம் தரும் வேளாண் உற்பத்தி அல்லது பலனைக் குறிக்கிறது; ‘விளைச்சல்’ என்பது இயல்பான, பொதுவான தமிழ் சொல். ‘அதன்’ என்பது முன் கூறிய நிலத்தைக் குறிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், ஒருமை இரண்டாம் நபரைப் பேணிய கண்ணியமான சட்டக் கட்டளை நடை. ‘விதைத்து … சேகரிப்பாயாக’ என்ற அமைப்பு எபிரெயத்தில் உள்ள செயல்களின் இணைப்பையும் தமிழின் இயல்பையும் சமநிலைப்படுத்துகிறது.
