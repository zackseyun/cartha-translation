  text: Three times in the year you shall keep a feast to me[a].
translation:
  language: ta
  text: ஆண்டில் மூன்று முறை எனக்காகப் பண்டிகை கொண்டாடு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “மூன்று பாதங்கள்.” இந்த எபிரெய மரபுத்தொடர் ஆண்டில் வரும் மூன்று யாத்திரைப் பண்டிகை நிகழ்வுகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ רְגָלִים
  choice: மூன்று முறை
  rationale: சொல்லுக்குச் சொல் பார்த்தால் ‘மூன்று கால்கள்/பாதங்கள்’ என்றாலும், இங்கு ஆண்டின் மூன்று புனிதப் பயணப் பண்டிகை வேளைகளைக் குறிக்கும் எபிரெய மரபுத்தொடர். இயல்பான தமிழில் அதன் எண்ணிக்கை மற்றும் நிகழ்தகவை ‘மூன்று முறை’ எனத் தருகிறது; புனிதப் பயண நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: תָּחֹג
  choice: பண்டிகை கொண்டாடு
  rationale: חגג என்பது பண்டிகையைக் கொண்டாடுதல் அல்லது கடைப்பிடித்தல் எனப் பொருள்படும். ‘பண்டிகை கொண்டாடு’ என்பது வழிபாட்டுச் சார்பையும் இயல்பான நவீன தமிழையும் ஒருங்கே தருகிறது.
- source_word: לִי
  choice: எனக்காக
  rationale: பண்டிகை கர்த்தரை நோக்கியும் அவருக்குரியதாகவும் நடத்தப்படுவதை לְ குறிக்கிறது. ‘எனக்காக’ என்பது தமிழில் இயல்பாக இந்த உறவை வெளிப்படுத்துகிறது; ‘எனக்கு’ என்பதும் சாத்தியம்.
- source_word: בַּשָּׁנָה
  choice: ஆண்டுக்கு
  rationale: சொல்லர்த்தமாக ‘ஆண்டில்’ என்று இருந்தாலும், ‘ஆண்டுக்கு மூன்று முறை’ என்பது மீண்டும் மீண்டும் கடைப்பிடிக்க வேண்டிய விதியைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்குரிய ஒருமை முன்னிலை ஏவல் நடையைப் பயன்படுத்துகிறது. ‘பண்டிகை கொண்டாடு’ என்பது கண்ணியமானதும் பொதுவாகப் புரிந்துகொள்ளக்கூடியதும் ஆகும்.
