base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/021.yaml
  text: Be on your guard before him[a], and listen to his voice. Do not rebel against him, for he will not pardon your transgression, because my name is within him.
translation:
  language: ta
  text: அவரை முன்னிட்டு எச்சரிக்கையாய் இருங்கள்; அவருடைய குரலுக்குச் செவிகொடுங்கள். அவருக்கு எதிராகக் கலகம் செய்யாதீர்கள். அவர் உங்கள் மீறுதலை மன்னிக்கமாட்டார்; ஏனெனில் என் பெயர் அவருக்குள் இருக்கிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் பெயர் அவரில் இருக்கிறது” அல்லது “என் பெயர் அவர்மேல் இருக்கிறது”; பொருள் விளக்கமாக, “அவர் என் பெயரைத் தாங்குகிறார்.” இச்சொற்றொடர் கடவுளால் ஒப்படைக்கப்பட்ட இறை அதிகாரத்தைக் குறிக்கிறது; ஆனால் அந்தத் தூதரின் துல்லிய இயல்பை இவ்வசனம் வெளிப்படையாக வரையறுப்பதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר מִפָּנָיו
  choice: அவருக்கு முன்பாக எச்சரிக்கையாயிருங்கள்
  rationale: நிபால் கட்டளைவடிவம் கவனமான விழிப்பையும் எச்சரிக்கையையும் வலியுறுத்துகிறது. מִפָּנָיו என்பதன் நேரடியான இடம்/உறவு சார்ந்த பொருளையும் இயல்பான தமிழில் இச்சொற்றொடர் காக்கிறது.
- source_word: וּשְׁמַע בְּקֹלוֹ
  choice: அவருடைய குரலுக்குச் செவிகொடுங்கள்
  rationale: שׁמע בְּקוֹל கீழ்ப்படிதலையும் உள்ளடக்கலாம்; ஆயினும் ‘குரலுக்குச் செவிகொடுங்கள்’ என்பது எபிரெயச் சொல்லமைப்பைக் காத்து, சூழலிலிருந்து கீழ்ப்படிதல் நுண்பொருள் வெளிப்பட இடமளிக்கிறது.
- source_word: אַל תַּמֵּר בּוֹ
  choice: அவருக்கு எதிராகக் கலகம் செய்யாதீர்கள்
  rationale: מרה என்பது அதிகாரத்துக்கு எதிரான கலகம் அல்லது எதிர்ப்பைக் குறிக்கிறது. உடன்படிக்கைச் சூழலின் தீவிரத்தை ‘கலகம்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לֹא יִשָּׂא לְפִשְׁעֲכֶם
  choice: அவர் உங்கள் மீறுதலை மன்னிக்கமாட்டார்
  rationale: பாவத்துடன் வரும் נשא இங்கு மன்னித்தல் அல்லது குற்றத்தை அகற்றுதல் என்ற மரபுத்தொடர் பொருளைக் கொண்டுள்ளது. פשע என்பதன் சட்ட மற்றும் உடன்படிக்கை மீறல் நுண்பொருளை ‘மீறுதல்’ காக்கிறது; எபிரெய ஒருமையும் தொடர்கிறது.
- source_word: שְׁמִי בְּקִרְבּוֹ
  choice: என் பெயர் அவருக்குள் இருக்கிறது
  rationale: בְּקִרְבּוֹ என்பது ‘அவருக்குள்/அவரின் நடுவில்’ என்று பொருள்படும். இத்தேர்வு இறைத்தூதருக்கும் இறைப்பெயருக்கும் உள்ள வலுவான தொடர்பைக் காக்கிறது; அந்தத் தொடர்பின் துல்லிய இயல்பை விளக்கி முடிவுசெய்யவில்லை.
theological_decisions:
- issue: தூதரின் இயல்பும் ‘என் பெயர் அவருக்குள் இருக்கிறது’ என்ற கூற்றும்
  choice: தூதர் படைக்கப்பட்டவரா, முழு அதிகாரம் பெற்ற பிரதிநிதியா, அல்லது ஆண்டவருடைய பிரசன்னத்தின் நேரடியான வெளிப்பாடா என்பதைத் தீர்மானிக்காமல் மூலத்தின் சொற்றொடரை நெருக்கமாக வைத்தல்
  alternative: ‘அவர் என் பெயரைத் தாங்குகிறார்’ என்று பொருள்விளக்கமாக மொழிபெயர்த்து, ஒப்படைக்கப்பட்ட இறை அதிகாரத்தை முன்னிறுத்துதல்
  rationale: இறை அதிகாரம் குறித்த வலுவான கூற்றை வசனம் முன்வைக்கிறது; ஆனால் தூதரின் துல்லிய இயல்பை இவ்வசனமே வரையறுப்பதில்லை. ஆகவே உண்மையான இறையியல் பதற்றமும் தெளிவின்மையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. பன்மை இரண்டாம் நபரைக் காட்ட ‘-ுங்கள்’ வடிவங்கள் வைக்கப்பட்டுள்ளன. ‘செவிகொடுங்கள்’, ‘கலகம்’, ‘மீறுதல்’ ஆகியவை இயல்பையும் உடன்படிக்கைச் சூழலின் தீவிரத்தையும் சமநிலைப்படுத்துகின்றன.
