  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֣ת יָמִים֩ תֹּאכַ֨ל מַצּ֜וֹת כַּֽ/אֲשֶׁ֣ר צִוִּיתִ֗/ךָ לְ/מוֹעֵד֙ חֹ֣דֶשׁ הָֽ/אָבִ֔יב כִּי ב֖/וֹ יָצָ֣אתָ מִ/מִּצְרָ֑יִם וְ/לֹא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/015.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib, for in it you came out from Egypt[b]. And no one shall appear before me empty-handed.
translation:
  language: ta
  text: புளிப்பில்லா அப்பத் திருவிழாவை நீ கடைப்பிடிக்க வேண்டும். நான் உனக்குக் கட்டளையிட்டபடி, ஆபிப் மாதத்தின் நியமிக்கப்பட்ட காலத்தில் ஏழு நாட்கள் புளிப்பில்லா அப்பம் உண்ண வேண்டும்; ஏனெனில் அந்த மாதத்தில்தான் நீ எகிப்திலிருந்து வெளியே வந்தாய். யாரும் என் முன்னிலையில்[a] வெறுங்கையுடன் வரக் கூடாது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் எழுத்துப்படி, “என் முகத்துக்கு முன்பாக”; இது “என் முன்னிலையில்” அல்லது “என் சந்நிதியில்” என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் இதை, “அவர்கள் என் முன்னிலையில் வெறுங்கையுடன் வரக் கூடாது” என்றும் மொழிபெயர்க்கலாம். முந்தைய இரண்டாம் நபர் ஒருமை அழைப்பிலிருந்து இங்கு வினைச்சொல் மூன்றாம் நபர் பன்மைக்கு மாறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: புளிப்பில்லா அப்பத் திருவிழா
  rationale: חַג என்பது வழிபாட்டோடு தொடர்புடைய விழாவைக் குறிக்கிறது; מַצּוֹת என்பது புளிப்பூட்டப்படாத அப்பத்தைக் குறிக்கிறது. ‘திருவிழா’ என்பது நிகழ்வின் சமயத்தன்மையையும் பொதுமக்களுக்கு இயல்பான நடையையும் காக்கிறது.
- source_word: תִּשְׁמֹר
  choice: கடைப்பிடிக்க வேண்டும்
  rationale: சட்ட மற்றும் வழிபாட்டுச் சூழலில் שׁמר என்பதன் ‘கடைப்பிடி/அனுசரி’ என்ற பொருளையும் கட்டளையின் வலிமையையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: תֹּאכַל מַצּוֹת
  choice: புளிப்பில்லா அப்பம் சாப்பிட வேண்டும்
  rationale: மூலத்தின் நேரடியான செயலைத் தெளிவாகத் தருகிறது; தமிழில் பொருள் வகையைக் குறிக்கும் ஒருமை இயல்பாக உள்ளது.
- source_word: לְמוֹעֵד
  choice: குறிக்கப்பட்ட காலத்தில்
  rationale: מוֹעֵד இங்கு முன்குறிக்கப்பட்ட நாட்காட்டிக் காலத்தைக் குறிக்கிறது; ‘குறிக்கப்பட்ட காலம்’ அதன் நிர்ணயிக்கப்பட்ட தன்மையைத் தக்கவைக்கிறது.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: ஆபிப் மாதம்
  rationale: אָבִיב இங்கு மாதத்தைக் குறிக்கும் பெயராகச் செயல்படுவதால் பொருளாக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּי בוֹ יָצָאתָ מִמִּצְרָיִם
  choice: ஏனெனில் அந்த மாதத்தில்தான் நீ எகிப்திலிருந்து வெளியே வந்தாய்
  rationale: בוֹ என்பதன் சுட்டு முன்கூறப்பட்ட மாதத்தையே குறிக்கிறது என்பதை தமிழில் தெளிவாக்குகிறது; יצא என்பதன் வெளியேறுதல் கருத்தும் காக்கப்படுகிறது.
- source_word: וְלֹא יֵרָאוּ פָנַי
  choice: யாரும் என் முன்னிலையில் தோன்றக் கூடாது
  rationale: ראה என்பதன் நிபால் வடிவம் இங்கு தேவனுடைய சந்நிதியில் வந்து நிற்பதைக் குறிக்கும் மரபுத்தொடர். மூலத்தில் பன்மை வினை இருந்தாலும், தமிழில் ‘யாரும்’ என்பது இயல்பான பொதுத் தடையாக அமைகிறது; இலக்கண மாற்றம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: רֵיקָם
  choice: வெறுங்கையுடன்
  rationale: காணிக்கை அல்லது கொடை எதுவுமின்றி வரக்கூடாது என்ற சூழல்சார்ந்த உட்பொருளை, காணிக்கையின் வகையை அளவுக்கு மீறிக் குறிப்பாக்காமல், இயல்பாகத் தருகிறது.
theological_decisions:
- issue: פָנַי என்ற தெய்வீகக் குறிப்பை எவ்வாறு மொழிபெயர்ப்பது
  choice: என் முன்னிலையில்
  alternative: என் முகத்துக்கு முன்பாக
  rationale: எபிரெயச் சொற்றொடர் எழுத்துப்படி ‘என் முகம்’ என்றாலும், இங்கு தேவனுடைய சந்நிதியில் தோன்றுதல் என்பதே மரபுத்தொடரின் பொருள். ‘என் முன்னிலையில்’ என்பது தனிப்பட்ட தெய்வீக உரையைக் காத்து இயல்பான தமிழை வழங்குகிறது.
- issue: இறுதி வாக்கியத்தில் ஒருமையிலிருந்து மூன்றாம் நபர் பன்மைக்கு மாறுதல்
  choice: யாரும் … தோன்றக் கூடாது
  alternative: அவர்கள் … தோன்றக் கூடாது
  rationale: ‘அவர்கள்’ என்பதற்கு உடனடி முன்னிலைச் சுட்டுப்பொருள் இல்லாததால் தமிழில் குழப்பம் ஏற்படும். பொதுமையான ‘யாரும்’ மூலத் தடையின் பரப்பை இயல்பாகக் கூறுகிறது; எபிரெய இலக்கண மாற்றம் அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளையின் கண்ணியமும் வலிமையும் காக்கப்பட்டுள்ளன. ‘நீ’ என்ற ஒருமை மூலத்தின் உடன்படிக்கைச் சட்ட அழைப்பைத் தொடர்கிறது. தேவையற்ற சமயப் பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன; ‘ஆபிப்’ மாதப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
