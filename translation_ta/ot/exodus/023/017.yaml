source:
  edition: WLC
  text: שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה יֵרָאֶה֙ כָּל זְכ֣וּרְ/ךָ֔ אֶל פְּנֵ֖י הָ/אָדֹ֥ן יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/017.yaml
  text: Three times in the year every male among you shall appear before the Lord Yahweh[a].
translation:
  language: ta
  text: ஆண்டில் மூன்று முறை, உங்களிலுள்ள ஆண்கள் அனைவரும் ஆண்டவராகிய யாவேவின்[a] முன்னிலையில் ஆஜராக வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஆண்டவர் யாவே”; இதில் “ஆண்டவர்” என்பது பட்டம், “யாவே” என்பது இறைபெயர்.
    reason: மூலத்தில் அடுத்தடுத்து வரும் இறைப் பட்டத்தையும் தனிப்பட்ட இறைபெயரையும் வேறுபடுத்திக் காட்டுவதற்காக.
  - marker: b
    text: “ஆஜராக வேண்டும்” என்பதற்கான எபிரெயச் சொல் சொற்சார்ந்து “காணப்பட வேண்டும்” என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: எபிரெய நிஃபால் வினைவடிவத்தின் சொற்சார்ந்த மாற்று வாசிப்பைப் பாதுகாப்பதற்காக.
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: ஆண்டில் மூன்று முறை
  rationale: எபிரெயச் சொற்றொடரின் எண்ணிக்கையையும் ஆண்டு வட்டத்துக்குள் நிகழும் முறைகளையும் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: יֵרָאֶה
  choice: ஆஜராக வேண்டும்
  rationale: இந்த நிஃபால் வடிவம் ஓர் உயர்ந்தவரின் அல்லது இறைவனின் முன்னிலையில் வந்து காணப்படுவதைக் குறிக்கும் மரபுச் சொற்பயன்பாடு. ‘ஆஜராக வேண்டும்’ என்பது கட்டளையின் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது; மூலத்தின் சொல்லமைப்புச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כָּל זְכוּרְךָ
  choice: உங்களிலுள்ள ஆண்கள் அனைவரும்
  rationale: இஸ்ரவேல் குடும்பங்களைச் சேர்ந்த ஆண் உறுப்பினர்கள் அனைவரையும் குறிப்பாகச் சுட்டுகிறது; மூலத்திலுள்ள ஆண்பால் வரையறையை நீக்கவில்லை.
- source_word: אֶל פְּנֵי
  choice: முன்னிலையில்
  rationale: ஒருவரின் முகத்துக்கு முன் வருதல் என்ற எபிரெய மரபுத்தொடரின் இயல்பான தமிழ்ப் பொருளைத் தருகிறது.
- source_word: הָאָדֹן
  choice: ஆண்டவர்
  rationale: இங்கு אָדוֹן இறைவனுக்குரிய பட்டமாக வருகிறது; ‘ஆண்டவர்’ என்பது கண்ணியமானதும் பொதுவாகப் புரியக்கூடியதுமான தமிழ் இணைச்சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டம் அல்ல, இறைபெயரான நான்கெழுத்துப் பெயர்; எனவே அதைப் பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: הָאָדֹן יְהוָה என்ற பட்டம்–இறைபெயர் சேர்க்கையின் மொழிபெயர்ப்பு
  choice: ஆண்டவராகிய யாவே
  alternative: ஆண்டவராகிய கர்த்தர்
  rationale: הָאָדֹן என்பதைப் பட்டமாகவும் יְהוָה என்பதைத் தனிப்பட்ட இறைபெயராகவும் வேறுபடுத்திக் காட்டுகிறது; இரண்டையும் ஒரே பட்டமாக்குவதையோ ‘ஆண்டவர் ஆண்டவர்’ என்ற இயல்பற்ற தொடரையோ தவிர்க்கிறது.
- issue: יֵרָאֶה என்ற நிஃபால் வடிவத்தின் பொருள்
  choice: ஆஜராக வேண்டும்
  alternative: காணப்பட வேண்டும்
  rationale: சூழலில் வழிபாட்டுக்காக இறைவன் முன்னிலையில் தோன்றுதல்/ஆஜராதல் என்பதே இயல்பான பொருள். இருப்பினும் நிஃபால் வடிவத்தின் சொற்சார்ந்த ‘காணப்படுதல்’ சாத்தியத்தை அடிக்குறிப்பில் குறிப்பிடுவதன் மூலம் மொழியியல் நுணுக்கம் மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சந்நிதி’, ‘பிரசன்னம்’, ‘தோன்றக்கடவன்’ போன்ற பழமையான அல்லது திருச்சபைச் சார்பு அதிகமுள்ள சொற்கள் தவிர்க்கப்பட்டுள்ளன; ஆண்பால் வரையறையும் இறைப் பட்டம்–பெயர் வேறுபாடும் மூலத்தின்படி பாதுகாக்கப்பட்டுள்ளன.
