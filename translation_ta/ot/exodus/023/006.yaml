revisions:
- from: உன் ஏழைக்கு அவனுடைய வழக்கில் கிடைக்கவேண்டிய நீதியை நீ புரட்டாதே.[a]
  to: உன் ஏழையின் வழக்கில் அவனுக்குரிய நீதியை வளைத்துவிடாதே.[a]
  rationale: The revision uses வளைத்துவிடாதே for the juridical metaphor of bending/perverting justice, and recasts the possessive phrases into natural Tamil. It retains the legal setting, the poor person's entitlement, the singular direct address, and the alternative reflected in the English audit trail.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:09:35Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the object as the poor person's judicial right/justice and locates the prohibition in the setting of that person's legal dispute. However, நீதியைப் புரட்டாதே more naturally means 'do not overturn/reverse justice' and does not idiomatically convey the Hebrew juridical sense of bending or perverting justice. நீதியை வளைத்துவிடாதே preserves that image and legal force.
  naturalness: உன் ஏழைக்கு அவனுடைய வழக்கில் கிடைக்கவேண்டிய நீதியை is understandable but somewhat heavy and less direct. உன் ஏழையின் வழக்கில் அவனுக்குரிய நீதியை is smoother modern standard Tamil while retaining each possessive relationship.
  terminology: நீதி appropriately renders מִשְׁפָּט in this legal context when qualified as அவனுக்குரிய. வழக்கு is a suitable context-specific rendering of רִיב. The direct singular prohibition is appropriate for the Hebrew legal address.
  issues:
  - severity: medium
    issue: புரட்டாதே is not the most accurate or idiomatic rendering of תַטֶּה with justice as its object.
    rationale: The Hiphil of נטה means to bend, turn aside, or pervert a legal right. In Tamil, நீதியைப் புரட்டுதல் commonly suggests overturning a decision rather than corrupting or bending justice.
  - severity: low
    issue: The main clause is unnecessarily cumbersome.
    rationale: Replacing உன் ஏழைக்கு அவனுடைய வழக்கில் கிடைக்கவேண்டிய நீதியை with உன் ஏழையின் வழக்கில் அவனுக்குரிய நீதியை improves clarity without adding or losing source content.
  revised_text: உன் ஏழையின் வழக்கில் அவனுக்குரிய நீதியை வளைத்துவிடாதே.[a]
