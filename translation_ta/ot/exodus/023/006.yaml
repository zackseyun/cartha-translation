  text: You shall not pervert the justice due to your poor person in his dispute[a].
translation:
  language: ta
  text: உன் ஏழையின் வழக்கில் அவனுக்குரிய நீதியை வளைத்துவிடாதே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் ஏழையின் வழக்கில் அவனுக்குரிய நீதியை மறுக்காதே.”
    reason: תַטֶּה மற்றும் מִשְׁפָּט இணைந்து, நீதியை வளைத்தல் அல்லது நடைமுறை விளைவாக உரிய நீதியை மறுத்தல் என்ற பொருளில் மொழிபெயர்க்கப்படலாம்.
lexical_decisions:
- source_word: לֹא
  choice: புரட்டாதே
  rationale: எதிர்மறைக் கட்டளையை இயல்பான நவீனத் தமிழில் ஒருமை முன்னிலைத் தடை வடிவமாகத் தருகிறது.
- source_word: תַטֶּה
  choice: புரட்டாதே
  rationale: நீதித்துறைச் சூழலில் நீதியை வளைத்தல், திசைதிருப்புதல், சீர்குலைத்தல் என்ற பொருளைத் தெளிவாகக் குறிக்கிறது.
- source_word: מִשְׁפַּט
  choice: கிடைக்கவேண்டிய நீதி
  rationale: இங்கு வெறும் கருத்தியல் ‘நீதி’ மட்டுமல்லாமல், ஒருவருக்குரிய நியாயமான தீர்ப்பு அல்லது சட்ட உரிமை குறிக்கப்படுவதால் இதை வெளிப்படையாகத் தருகிறது.
- source_word: אֶבְיֹנְךָ
  choice: உன் ஏழைக்கு
  rationale: אֶבְיוֹן என்பதன் ஏழை அல்லது தேவையுள்ளவர் என்ற பொருளையும், இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டையும் காக்கிறது; தமிழில் தேவையற்ற பாலினச் சேர்க்கையைத் தவிர்க்கிறது.
- source_word: בְּרִיבוֹ
  choice: அவனுடைய வழக்கில்
  rationale: רִיב என்பதன் தகராறு, சட்டப் பிணக்கு, வழக்கு ஆகிய பொருள் வரம்பில் இங்குள்ள நீதித்துறைச் சூழலை இயல்பாக வெளிப்படுத்துகிறது; ஆண்பால் ஒருமைப் பின்னொட்டும் காக்கப்படுகிறது.
theological_decisions:
- issue: இந்த வசனம் ஏழைக்கு எதிரான நீதிப் புறக்கணிப்பைத் தடுக்கிறதா, அல்லது பொதுவாக ஏழைகளுக்கு நீதி வழங்கச் சொல்கிறதா?
  choice: ஏழையின் வழக்கில் அவனுக்குரிய நீதியைச் சீர்குலைக்கக் கூடாது என்ற நீதிமன்றத் தடை
  alternative: ஏழைக்கு நீதியை மறுக்காதே என்ற பொதுவான சமூகக் கட்டளை
  rationale: எபிரெய உரையில் מִשְׁפַּט என்பது புரட்டப்படும் நேரடிப் பொருளாகவும், בְּרִיבוֹ என்பது சட்டப் பிணக்கின் சூழலாகவும் வருகிறது. ஆகவே சார்பற்ற நீதித்தீர்ப்பே மையம்; பொதுவான சமூக வாசகமாக விரிவாக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், உடன்படிக்கைச் சட்டங்களுக்கு ஏற்ற கண்ணியமான நேரடித் தடைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உன்’ மற்றும் ‘நீ’ மூலம் எபிரெய இரண்டாம் நபர் ஆண்பால் ஒருமை முகவரி காக்கப்படுகிறது; אֶבְיוֹן-க்கு தமிழில் தேவையற்ற பாலினப் பெயர் சேர்க்கப்படவில்லை.
