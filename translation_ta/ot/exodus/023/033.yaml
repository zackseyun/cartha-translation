  text: לֹ֤א יֵשְׁבוּ֙ בְּ/אַרְצְ/ךָ֔ פֶּן יַחֲטִ֥יאוּ אֹתְ/ךָ֖ לִ֑/י כִּ֤י תַעֲבֹד֙ אֶת אֱלֹ֣הֵי/הֶ֔ם כִּֽי יִהְיֶ֥ה לְ/ךָ֖ לְ/מוֹקֵֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/033.yaml
  text: They must not dwell in your land[a], lest they cause you to sin against me; for if you serve their gods[c][b], it will surely become a snare to you.
translation:
  language: ta
  text: அவர்கள் உன் நாட்டில் குடியிருக்கக் கூடாது. இல்லையென்றால், அவர்கள் உன்னை எனக்கு எதிராகப் பாவம் செய்ய வைப்பார்கள்[a]. ஏனெனில், நீ அவர்களுடைய தெய்வங்களை வழிபட்டால்[b], அது உனக்குக் கண்ணியாகிவிடும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்கள் உன்னை எனக்கு எதிராகப் பாவம் செய்யத் தூண்டுவார்கள்’ அல்லது ‘பாவத்திற்கு இட்டுச் செல்வார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஏனெனில், நீ அவர்களுடைய தெய்வங்களை வழிபடுவாய்’ அல்லது ‘வழிபட நேரிடும்’ என்றும் வாசிக்கலாம். இங்குள்ள எபிரெய இணைப்புச்சொல் விளக்கப் பொருளில் அமையக்கூடும்; இத்தொடர் வெறும் நிபந்தனையைக் காட்டாமல் ஏற்படக்கூடிய விளைவையும் குறிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: ‘கண்ணி’ என்பது எபிரெய மொழியின் מוֹקֵשׁ (மோகேஷ்) என்பதற்கான மொழிபெயர்ப்பு. ஒருவரைப் பிடித்து அழிவுக்கோ தேவனிடமிருந்து விலகுவதற்கோ இட்டுச் செல்லும் ஒன்றை இது உருவகமாகக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: יֵשְׁבוּ בְּאַרְצְךָ
  choice: உன் நாட்டில் குடியிருக்க
  rationale: יָשַׁב இங்கு தொடர்ந்து வாழ்வதையோ குடியிருப்பதையோ குறிக்கிறது. אֶרֶץ உடன்படிக்கை சார்ந்த நிலப்பரப்பைக் குறிப்பதால், இயல்பான தமிழில் ‘உன் நாட்டில்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: פֶּן
  choice: இல்லையென்றால்
  rationale: விரும்பத்தகாத விளைவு ஏற்படாதபடி கொடுக்கப்படும் எச்சரிக்கையை פֶּן அறிமுகப்படுத்துகிறது. ‘இல்லையென்றால்’ அதன் தடுப்பு நோக்கையும் விளைவையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: יַחֲטִיאוּ אֹתְךָ לִי
  choice: அவர்கள் உன்னை எனக்கு எதிராகப் பாவம் செய்ய வைப்பார்கள்
  rationale: חטא என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளில் ‘பாவம் செய்ய வைப்பது’ என வருகிறது. לִי இங்கு தேவனுக்கு எதிரான குற்றத்தைக் குறிப்பதால் ‘எனக்கு எதிராக’ என்று தரப்பட்டது.
- source_word: תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: நீ அவர்களுடைய தெய்வங்களை வழிபட்டால்
  rationale: தெய்வங்களைப் பொருளாகக் கொண்டு வரும் עבד, அவற்றுக்குப் பணிந்து வழிபடுவதைக் குறிக்கிறது. தமிழில் ‘வழிபட்டால்’ என்பது கருத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; நிபந்தனை வாசிப்பு அடிக்குறிப்பில் மாற்று வாசிப்புடன் வைக்கப்பட்டுள்ளது.
- source_word: יִהְיֶה לְךָ לְמוֹקֵשׁ
  choice: அது உனக்குக் கண்ணியாகிவிடும்
  rationale: מוֹקֵשׁ என்பது பிடிக்கப் பயன்படும் கண்ணி; உருவகமாக அழிவுக்கோ விசுவாசத் துரோகத்துக்கோ இட்டுச் செல்லும் அபாயத்தைக் குறிக்கிறது. மூலத்தின் உருவகம் தமிழிலும் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: எச்சரிக்கப்படும் பாவத்தின் தன்மை
  choice: பிற தெய்வங்களை வழிபடுவதால் ஏற்படும் தேவனுக்கு எதிரான உடன்படிக்கைத் துரோகம்
  alternative: அந்நிய அயலாரால் பொதுவாக ஏற்படும் ஒழுக்கச் சீர்கேடு
  rationale: ‘அவர்களுடைய தெய்வங்களை வழிபடுதல்’ என்ற உடனடி தொடரே இங்கு குறிப்பிடப்படும் பாவத்தை விளக்குகிறது. ஆகவே வசனம் இன அடிப்படையிலான பிரிவினையாகவோ பொதுவான பண்பாட்டு தாக்கத்தைப் பற்றியதாகவோ விரிவுபடுத்தப்படவில்லை.
- issue: כִּי תַעֲבֹד என்பதன் தொடர்பு
  choice: ‘நீ ... வழிபட்டால்’ என்ற நிபந்தனை வாசிப்பு
  alternative: ‘ஏனெனில், நீ ... வழிபடுவாய்’ அல்லது ‘நீ ... வழிபட நேரிடும்’ என்ற விளக்க/சாத்திய விளைவு வாசிப்பு
  rationale: כִּי காரணம், விளக்கம், அல்லது சூழலுக்கு ஏற்ப நிபந்தனை போன்ற தொடர்பை வெளிப்படுத்தலாம். முதன்மை உரையில் இயல்பான நிபந்தனை வாசிப்பு தரப்பட்டாலும், எபிரெயத்தின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம எச்சரிக்கைக்கு ஏற்ற கண்ணியமான தொனியிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘குடியிருக்கக் கூடாது’, ‘எனக்கு எதிராகப் பாவம்’, ‘கண்ணி’ ஆகியவை மூலத்தின் நிலப்பரப்பு, உடன்படிக்கை, உருவக அம்சங்களைத் தக்கவைக்கின்றன.
