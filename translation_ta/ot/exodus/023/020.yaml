  yaml_path: translation/ot/exodus/023/020.yaml
  text: Behold[a], I am sending an angel before you to guard you on the way and to bring you to the place that I have prepared.
translation:
  language: ta
  text: இதோ, நான் உனக்கு முன்னால் ஒரு வானதூதரை[a] அனுப்புகிறேன்; அவர் வழியில் உன்னைக் காக்கவும், நான் ஆயத்தப்படுத்திய இடத்துக்கு உன்னைக் கொண்டுவரவும் அனுப்பப்படுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு தூதரை.” எபிரெயச் சொல் மனிதத் தூதரையோ வானதூதரையோ குறிக்கலாம்; இங்கே சூழல் வானதூதரைக் குறிப்பதாக இருக்க வாய்ப்பு அதிகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் சுட்டும் தன்மையையும், இறைவாக்கின் கண்ணியமான தொனியையும் இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: אָנֹכִי שֹׁלֵחַ
  choice: அனுப்புகிறேன்
  rationale: தனிப்பட்ட சுட்டுப்பெயருடன் வரும் வினையெச்ச அமைப்பு நிகழவிருக்கும் அல்லது தற்போது மேற்கொள்ளப்படும் செயலைக் குறிக்கிறது; தமிழின் எழுவாய் உள்ளடங்கிய வினை வடிவம் முதலாம் நபரை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַלְאָךְ
  choice: ஒரு தூதரை
  rationale: מַלְאָךְ என்பது மனிதத் தூதரையோ வானதூதரையோ குறிக்கக்கூடும். 'தூதர்' அந்த அடிப்படைச் சொல்லியல் தெளிவின்மையைத் தமிழில் பாதுகாக்கிறது; இச்சூழலில் வானதூதர் என்பது சாத்தியமான பொருள் என அடிக்குறிப்பு குறிப்பிடுகிறது.
- source_word: לְפָנֶיךָ
  choice: உனக்கு முன்னால்
  rationale: பயணத்தில் முன்செல்வதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לִשְׁמָרְךָ
  choice: உன்னைக் காக்கவும்
  rationale: שׁמר என்பதன் பாதுகாக்கும் பொருளை பயணச் சூழலில் தெளிவாகக் கொடுக்கிறது.
- source_word: בַּדָּרֶךְ
  choice: வழியில்
  rationale: பயணம் அல்லது செல்லும் பாதை என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְלַהֲבִיאֲךָ
  choice: உன்னைக் கொண்டுவரவும்
  rationale: בוא என்பதன் ஹிஃபில் வடிவமான 'வரச் செய்/கொண்டுவா' என்ற காரணவினைப் பொருளைத் தக்கவைக்கிறது; 'வழிநடத்த' என்று மாற்றிப் பொருள்கொள்ளவில்லை.
- source_word: הַמָּקוֹם אֲשֶׁר הֲכִנֹתִי
  choice: நான் ஆயத்தப்படுத்திய இடத்துக்கு
  rationale: இலக்கிடமாகிய இடத்தை தேவன் முன்னதாகத் தயார் செய்துள்ளார் அல்லது நிர்ணயித்துள்ளார் என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: מַלְאָךְ என்பவரின் அடையாளம்
  choice: மூலச்சொல்லின் தெளிவின்மையைப் பாதுகாக்க 'ஒரு தூதர்' என்று மொழிபெயர்த்து, வானதூதர் என்ற சூழல்சார் பொருளை அடிக்குறிப்பில் தருதல்
  alternative: முதன்மை உரையிலேயே 'ஒரு வானதூதர்' என்று மொழிபெயர்த்தல்; அல்லது அவரை கர்த்தரின் தனித்துவமான தெய்வீகத் தூதராக அடையாளப்படுத்தல்
  rationale: இந்த வசனம் அவரை מַלְאָךְ என்று மட்டுமே அழைக்கிறது. தொடர்ச்சியான பகுதி அவருடைய நிலையைப் பற்றிய இறையியல் கேள்விகளை எழுப்புவதால், மொழிபெயர்ப்பு உருவாக்கப்பட்ட வானதூதரா, மனிதத் தூதரா, தனித்துவமான தெய்வீக வெளிப்பாடா என்று தீர்மானிக்காமல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை முன்னிலைக்குரிய வடிவங்களும், இறைவாக்கின் நேரடித் தொனியும் பாதுகாக்கப்பட்டுள்ளன.
