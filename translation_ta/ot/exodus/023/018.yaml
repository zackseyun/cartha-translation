  yaml_path: translation/ot/exodus/023/018.yaml
  text: You shall not sacrifice the blood of my sacrifice with anything leavened[b][a], and the fat of my feast shall not remain until morning.
translation:
  language: ta
  text: என் பலியின் இரத்தத்தைப் புளிப்புள்ள எதனோடும் சேர்த்துப் பலியிடக் கூடாது[a]. என் பண்டிகைக்குரிய கொழுப்பு[b] காலைவரை எஞ்சியிருக்கக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “புளிப்பின் மேல்.” இப்பலிச் சூழலில், புளிப்பூட்டப்பட்ட எதனுடனும் தொடர்புபடுத்திப் பலியிடக் கூடாது என்பது இதன் சாத்தியமான பொருள்.'
    reason: lexical_alternative
  - marker: b
    text: “என் பண்டிகைக்குரிய கொழுப்பு” என்பதை “என் பண்டிகைப் பலியின் கொழுப்பு” என்றும் புரிந்துகொள்ளலாம்.
    reason: clarification
lexical_decisions:
- source_word: תִזְבַּח
  choice: பலியிடக் கூடாது
  rationale: זבח என்பதன் Qal imperfect இரண்டாம் நபர் ஒருமை வடிவம் לֹא உடன் சட்டரீதியான தடையைத் தெரிவிக்கிறது; நவீன தமிழில் ‘பலியிடக் கூடாது’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: עַל חָמֵץ
  choice: புளிப்புள்ள எதனோடும் சேர்த்து
  rationale: עַל என்பதன் அடிப்படைப் பொருள் ‘மேல்’ என்றாலும், இப்பலிச் சூழலில் புளிப்பூட்டப்பட்ட பொருளுடன் தொடர்புபடுத்திப் பலியிடக்கூடாது என்பதே சாத்தியமான பொருள். ‘சேர்த்து’ என்பது இதை இயல்பான தமிழில் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: דַּם זִבְחִי
  choice: என் பலியின் இரத்தத்தை
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியையும், எபிரெய உரையில் வெளிப்படையாக உள்ள ‘இரத்தம்’ என்பதையும் அப்படியே பாதுகாக்கிறது.
- source_word: יָלִין
  choice: எஞ்சியிருக்கக் கூடாது
  rationale: לין என்பது இரவு தங்குதல் அல்லது இரவு முழுவதும் மீந்திருக்குதல் எனப் பொருள்படும். עַד בֹּקֶר உடன், பலிக்குரிய கொழுப்பு காலைவரை எஞ்சக்கூடாது என்பதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: חֵלֶב
  choice: கொழுப்பு
  rationale: பலியின் கொழுப்புப் பகுதிகளைக் குறிக்கும் சொல்லை விளக்கவுரை சேர்க்காமல் நேரடியாக மொழிபெயர்க்கிறது.
- source_word: חַגִּי
  choice: என் பண்டிகைக்குரிய
  rationale: חַג என்பது புனிதமான பண்டிகை அல்லது யாத்திரைப் பெருவிழாவைக் குறிக்கிறது. ‘பண்டிகை’ நவீன தமிழில் தெளிவு; உடைமை விகுதியான ‘என்’ பாதுகாக்கப்பட்டுள்ளது.
- source_word: עַד בֹּקֶר
  choice: காலைவரை
  rationale: கால எல்லையைக் குறிக்கும் இச்சொற்றொடருக்கு இயல்பான, சுருக்கமான தமிழ் இணை.
theological_decisions:
- issue: ‘என் பலி’, ‘என் பண்டிகை’ என்பவற்றிலுள்ள முதலாம் நபர் உடைமை விகுதிகளின் குறிப்பு
  choice: தெய்வீகப் பேச்சிலுள்ள ‘என்’ என்பதை நேரடியாகப் பாதுகாத்தல்
  alternative: ‘எனக்குச் செலுத்தும் பலி’, ‘கர்த்தருடைய பண்டிகை’ என்று விளக்கமாக விரித்தல்
  rationale: எபிரெய மூலத்தில் முதலாம் நபர் உடைமை விகுதிகள் வெளிப்படையாக உள்ளன. அவற்றை விரித்துரைப்பது மூலத்தைவிட அதிகமான விளக்கத்தைச் சேர்க்கும்.
- issue: חַגִּי உடன் חֵלֶב கொண்டுள்ள உறவு
  choice: ‘என் பண்டிகைக்குரிய கொழுப்பு’
  alternative: ‘என் பண்டிகைப் பலியின் கொழுப்பு’
  rationale: ‘பண்டிகைப் பலி’ என்பது சூழலுக்கு ஏற்ற சாத்தியமான விளக்கம் என்றாலும், ‘பலி’ என்ற சொல்லை இரண்டாம் பாதியில் சேர்ப்பது மூலத்தில் இல்லாத வெளிப்படுத்தலாகும்; குறுகிய வடிவம் மூலத்தின் செறிவைப் பாதுகாக்கிறது.
translation_notes:
  register: மரியாதைமிக்க, நவீன நிலையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. சட்டக் கட்டளையின் வலிமைக்காக ‘கூடாது’ வடிவம் இரு உறுப்புகளிலும் வைக்கப்பட்டுள்ளது. எபிரெயத்தின் செறிவும் முதலாம் நபர் தெய்வீகப் பேச்சும் பாதுகாக்கப்பட்டுள்ளன.
