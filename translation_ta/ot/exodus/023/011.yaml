translation_notes:
  register: நவீன தரத் தமிழ்; சட்டக் கட்டளையின் ஒருமை முன்னிலையைப் பேணுகிறது. முந்தைய வசனத்தில் குறிப்பிடப்பட்ட நிலமே பெண்பால் பின்னொட்டின் மறைமுகக் குறிப்பு என்பதால் தமிழில் “அதை” என வழங்கப்பட்டுள்ளது. “உண்ணட்டும்” அனுமதி அல்லது நோக்கப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
