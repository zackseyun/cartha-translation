base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/011.yaml
  text: But in the seventh year you shall let it rest and leave it alone[a], so that the poor of your people may eat; and what they leave, the wild animals of the field may eat[b]. You shall do the same with your vineyard and your olive grove.
translation:
  language: ta
  text: ஆனால் ஏழாம் ஆண்டில் அதன் சாகுபடியை நிறுத்தி, அதை அப்படியே விட்டுவிடு[a]. அப்போது உன் மக்களிலுள்ள ஏழைகள் அதிலிருந்து உண்ணட்டும்; மீதமிருப்பதை வயலின் காட்டு விலங்குகள் உண்ணட்டும்[b]. உன் திராட்சைத்தோட்டத்திற்கும் உன் ஒலிவத் தோப்பிற்கும் அவ்வாறே செய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதை விடுவித்து, கைவிடு.” எபிரேய வினைகள் ஏழாம் ஆண்டில் வழக்கமான சாகுபடியை நிறுத்தி நிலத்தைப் பயிரிடாமல் விடுவதைக் வலியுறுத்துகின்றன.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “வயலின் விலங்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁבִיעִת
  choice: ஆனால் ஏழாம் ஆண்டில்
  rationale: முந்தைய வசனத்தின் ஆறு சாகுபடி ஆண்டுகளுடன் உள்ள வேறுபாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תִּשְׁמְטֶנָּה וּנְטַשְׁתָּהּ
  choice: அதைச் சாகுபடி செய்யாமல் விட்டுவிடு
  rationale: இரு எபிரேய வினைகளும் நிலத்தின் வழக்கமான சாகுபடியை நிறுத்தி அதை அப்படியே விடுவதைக் குறிக்கின்றன; நிரந்தரமாகக் கைவிடுதல் என்ற மிகைப்படுத்தலைத் தவிர்க்கிறது.
- source_word: אֶבְיֹנֵי עַמֶּךָ
  choice: உன் மக்களிலுள்ள ஏழைகள்
  rationale: சமூகத்தின் வறிய அல்லது தேவையுள்ள மக்களைக் குறிக்கும் சொல்லைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: וְיִתְרָם
  choice: அவர்கள் விட்டுச்செல்வதை
  rationale: ஏழைகள் உண்டபின் மீதமிருப்பதை ஆண்பால் பன்மை பின்னொட்டுடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חַיַּת הַשָּׂדֶה
  choice: வயல்வெளியின் காட்டு விலங்குகள்
  rationale: சொற்றொடரின் சொற்பொருளையும் அது குறிக்கும் காட்டுயிர்களையும் பாதுகாக்கிறது.
- source_word: כֵּן תַּעֲשֶׂה
  choice: அவ்வாறே செய்
  rationale: அதே கட்டளையை அடுத்த இரு பயிரிடப்பட்ட இடங்களுக்கும் பொருத்தும் சட்ட மொழியைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: לְכַרְמְךָ
  choice: உன் திராட்சைத்தோட்டத்திற்கும்
  rationale: כרם என்பதன் வழக்கமான வேளாண் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: לְזֵיתֶךָ
  choice: உன் ஒலிவத் தோப்பிற்கும்
  rationale: זית என்ற ஒருமைச் சொல் இங்கு கூட்டுப்பொருளில் வருவதால், திராட்சைத்தோட்டத்துக்கு இணையான பயிரிடப்பட்ட ஒலிவ மரப் பகுதியைக் குறிக்கிறது.
