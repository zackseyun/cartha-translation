review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the land as the implied object and faithfully conveys the provision for the needy, the remainder, wild animals, vineyard, and olives. However, it compresses the two Hebrew imperatives ("release/let rest" and "leave/abandon") into one expression. A revision should retain both aspects without implying permanent abandonment.
  naturalness: The register is clear modern standard Tamil. “அவர்கள் விட்டுச்செல்வதை” can imply an intentional act of leaving; “மீதமிருப்பதை” more neutrally reflects “their remainder/what remains.” “வயலின் காட்டு விலங்குகள்” is slightly more idiomatic than “வயல்வெளியின் காட்டு விலங்குகள்.”
  terminology: “உன் மக்களிலுள்ள ஏழைகள்,” “திராட்சைத்தோட்டம்,” and “ஒலிவத் தோப்பு” are suitable. The agricultural instruction is best expressed as ceasing cultivation and leaving the land as it is.
  issues:
  - severity: medium
    issue: The paired Hebrew verbs are collapsed into a single Tamil action.
    rationale: 'תשמטנה and ונטשתה carry related but distinct instructions: cease normal cultivation/release the land, and leave it. “அதைச் சாகுபடி செய்யாமல் விட்டுவிடு” communicates the overall result but does not preserve the twofold formulation.'
  - severity: low
    issue: “அவர்கள் விட்டுச்செல்வதை” is more specific than the Hebrew remainder expression.
    rationale: ויתרם denotes what remains after the needy have eaten; “மீதமிருப்பதை” keeps this neutral and does not suggest deliberate leaving.
  revised_text: ஆனால் ஏழாம் ஆண்டில் அதன் சாகுபடியை நிறுத்தி, அதை அப்படியே விட்டுவிடு[a]. அப்போது உன் மக்களிலுள்ள ஏழைகள் அதிலிருந்து உண்ணட்டும்; மீதமிருப்பதை வயலின் காட்டு விலங்குகள் உண்ணட்டும்[b]. உன் திராட்சைத்தோட்டத்திற்கும் உன் ஒலிவத் தோப்பிற்கும் அவ்வாறே செய்.
  revised_footnotes:
  - marker: a
    text: அல்லது, “அதை விடுவித்து, கைவிடு.” எபிரேய வினைகள் ஏழாம் ஆண்டில் வழக்கமான சாகுபடியை நிறுத்தி நிலத்தைப் பயிரிடாமல் விடுவதைக் வலியுறுத்துகின்றன.
    reason: lexical_alternative
