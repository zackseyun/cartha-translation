  yaml_path: translation/ot/exodus/023/003.yaml
  text: And you shall not show partiality to a poor man in his lawsuit[a].
translation:
  language: ta
  text: ஏழையின் வழக்கில் பாரபட்சம் காட்டாதே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏழையின் வழக்கில் அவனுக்கு மதிப்பு காட்டாதே.” எபிரெய வினைச்சொல்லுக்கு இன்னும் நேரடியான பொருளில் “மதிப்பு காட்டு” அல்லது “கனப்படுத்து” என்று பொருள் வரலாம்; ஆனால் இந்த நீதித்துறைச் சூழலில், ஒருவருக்குச் சாதகமாகச் சலுகை அல்லது பாரபட்சம் காட்டுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָל
  choice: ஏழை
  rationale: இச்சொல் பொருளாதாரத்திலும் சமூக நிலையிலும் தாழ்ந்த அல்லது வலிமையற்ற ஒருவரைக் குறிக்கலாம். இங்குள்ள ஒருமை வடிவத்தையும் நீதித்துறைச் சூழலையும் இயல்பான தமிழில் “ஏழை” எடுத்துரைக்கிறது.
- source_word: תֶהְדַּר
  choice: பாரபட்சம் காட்டாதே
  rationale: הדר என்ற வினைச்சொல் சொற்பொருளில் “மதித்தல்/கனப்படுத்துதல்” என வரலாம்; ஆனால் வழக்குத் தீர்ப்பின் சூழலில் ஒருவருக்குச் சலுகை காட்டுவதையே குறிக்கிறது. ஆகவே “பாரபட்சம் காட்டாதே” என்பது நீதித்துறை நுட்பத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּרִיבוֹ
  choice: அவனுடைய வழக்கில்
  rationale: רִיב என்பது சச்சரவு, தகராறு அல்லது சட்ட வழக்கைக் குறிக்கும். சுற்றியுள்ள நீதிச்சட்டங்களின் அடிப்படையில் “வழக்கு” பொருத்தமானது; இறுதியிலுள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை விகுதி “அவனுடைய” என்பதால் வெளிப்படுகிறது.
- source_word: וְ
  choice: தனி இணைப்புச்சொல் இன்றி
  rationale: எபிரெய இணைப்புச்சொல் முந்தைய சட்டத்துடன் இக்கட்டளையை இணைக்கிறது. தனி வசனமாக இயல்பான தமிழில் “மேலும்” அல்லது “ஆனால்” சேர்க்காமல் விடுவது பொருளை மாற்றாது; குறிப்பாக எதிர்மறைத் தொடர்பை இறக்குமதி செய்வதையும் தவிர்க்கிறது.
- source_word: לֹא
  choice: காட்டாதே
  rationale: לֹא உடன் வரும் வினை வடிவம் தடை கட்டளையைத் தருகிறது. நவீனத் தமிழில் ஒருமை கட்டளை வடிவமான “-ஆதே” நேரடியாகவும் கண்ணியமாகவும் இதை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஏழைக்கு இரக்கம் காட்டுவதற்கும் நீதிமன்றத்தில் அவனுக்குச் சாதகமாகப் பாரபட்சம் காட்டுவதற்கும் உள்ள வேறுபாடு
  choice: ஏழையின் வழக்கில் அவனுக்குச் சாதகமாகப் பாரபட்சம் காட்டுவதை வசனம் தடை செய்கிறது.
  alternative: பொதுவாக ஏழையை மதிக்க வேண்டும் என்ற கட்டளை.
  rationale: “அவனுடைய வழக்கில்” என்ற சொற்றொடரும் உடனடிச் சட்டச் சூழலும் இக்கட்டளை நீதித்துறை நடுநிலையைப் பற்றியது என்பதைக் காட்டுகின்றன. இது ஏழைகள்மீதான இரக்கத்தை மறுப்பதாகவோ, இவ்வசனம் கூறாத விரிவான சமூகக் கோட்பாட்டை முன்வைப்பதாகவோ மொழிபெயர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்கேற்ற நேரடியான ஒருமைத் தடை வடிவம் பயன்படுத்தப்பட்டுள்ளது. “பாரபட்சம்” பொதுவாகப் புரிந்துகொள்ளப்படும் நீதித்துறைச் சொல்; சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
