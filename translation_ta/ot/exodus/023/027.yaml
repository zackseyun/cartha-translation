base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/027.yaml
  text: I will send my terror ahead of you[a], and I will throw into confusion all the people among whom you come[c][b], and I will make all your enemies turn their backs to you.
translation:
  language: ta
  text: என் பேரச்சத்தை உனக்கு முன்னே அனுப்புவேன்; நீ சென்று சேரும் எல்லா மக்களையும் கலக்கமடையச் செய்வேன்[a]. உன் பகைவர்கள் அனைவரும் உனக்குப் புறமுதுகு காட்டும்படி செய்வேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கலக்கமடையச் செய்வேன்’ என்பதற்கு ‘பீதியடையச் செய்வேன்’ அல்லது ‘அமளியில் ஆழ்த்துவேன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் நேரடியாக, ‘உன் பகைவர்கள் அனைவரையும் உனக்கு முதுகாகக் கொடுப்பேன்’; அவர்கள் திரும்பி ஓடுவார்கள் என்பது பொருள்.
    reason: idiom
lexical_decisions:
- source_word: אֵימָתִי
  choice: என்னைப் பற்றிய பேரச்சம்
  rationale: אֵימָה என்பது கடும் அச்சம், திகில் அல்லது பீதியைக் குறிக்கிறது. உடைமைத் தொடரான ‘என் அச்சம்’ தமிழில் கடவுள் தாமே அஞ்சுகிறார் எனத் தவறாகப் புரியக்கூடும்; ஆகவே கடவுளால் எதிரிகளுக்கு ஏற்படும் அச்சம் என்ற பொருளை ‘என்னைப் பற்றிய பேரச்சம்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֲשַׁלַּח לְפָנֶיךָ
  choice: உனக்கு முன்னே அனுப்பி
  rationale: לְפָנֶיךָ என்பது ஒருவருக்கு முன்பாக அல்லது முன்னதாக அனுப்பப்படுவதைச் சுட்டுகிறது; ‘உனக்கு முன்னே’ திசை மற்றும் முன்னோட்டம் ஆகிய இரண்டையும் காக்கிறது.
- source_word: וְהַמֹּתִי
  choice: கலக்கமடையச் செய்வேன்
  rationale: המם என்பதன் காரணவினைப் பொருள் போர்ச் சூழலில் குழப்பம், பீதி, அமளி ஏற்படுத்துவதாகும். ‘கலக்கமடையச் செய்வேன்’ தோல்வி அல்லது அழிவு என்று மிகைப்படுத்தாமல் அந்த காரணவினைப் பொருளைத் தருகிறது.
- source_word: כָּל הָעָם אֲשֶׁר תָּבֹא בָהֶם
  choice: நீ போய்ச் சேரும் மக்களையெல்லாம்
  rationale: בָהֶם அவர்களிடையே அல்லது அவர்களின் நடுவில் வருதலைக் குறிக்கிறது. ‘போய்ச் சேரும்’ என்பது தமிழில் இயல்பாக அந்த அணுகிச் சென்று அவர்களிடையே அடையும் பொருளைத் தருகிறது; ‘எதிர்த்துச் செல்லும்’ என்று போர்முகப் பொருளைச் சேர்க்கவில்லை.
- source_word: וְנָתַתִּי ... אֵלֶיךָ עֹרֶף
  choice: உனக்குப் புறமுதுகு காட்டும்படி செய்வேன்
  rationale: ‘பின்கழுத்தை/முதுகைக் கொடுத்தல்’ என்ற எபிரெய உருவகம் பகைவர்கள் திரும்பி ஓடுவதைக் குறிக்கிறது. ‘புறமுதுகு காட்டுதல்’ அந்த உருவகத்தையும் பின்வாங்கும் பொருளையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: போரில் ஏற்படும் பீதிக்கும் வெற்றிக்கும் கடவுளின் நேரடி செயற்பாடு
  choice: ‘அனுப்பி,’ ‘கலக்கமடையச் செய்வேன்,’ ‘புறமுதுகு காட்டும்படி செய்வேன்’ என்று கடவுளே நேரடியாகச் செயல்படுவதாக மொழிபெயர்க்கப்பட்டது.
  alternative: கடவுளின் காரணச் செயலை மென்மையாக்கி மறைமுகமாகக் கூறுதல்.
  rationale: எபிரெய மூலத்தில் முதல் நபர் வினைச்சொற்கள் கடவுளை வெளிப்படையான செய்பவராகக் காட்டுகின்றன. அந்த இறையியல் பதற்றத்தை மொழிபெயர்ப்பு குறைக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டது. ‘என் பேரச்சம்’ என்ற சொற்றொடரின் சாத்தியமான தமிழ்க் குழப்பத்தைத் தவிர்க்க ‘என்னைப் பற்றிய பேரச்சம்’ தேர்ந்தெடுக்கப்பட்டது. மூலத்தின் போர்ச் சூழலும் கடவுளின் நேரடி செயற்பாடும் மென்மையாக்கப்படவில்லை.
