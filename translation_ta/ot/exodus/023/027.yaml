revisions:
- from: என்னைப் பற்றிய பேரச்சத்தை உனக்கு முன்னே அனுப்பி, நீ போய்ச் சேரும் மக்களையெல்லாம் கலக்கமடையச் செய்வேன்[a]; உன் பகைவர்கள் அனைவரும் உனக்குப் புறமுதுகு காட்டும்படி செய்வேன்[b].
  to: என் பேரச்சத்தை உனக்கு முன்னே அனுப்புவேன்; நீ சென்று சேரும் எல்லா மக்களையும் கலக்கமடையச் செய்வேன்[a]. உன் பகைவர்கள் அனைவரும் உனக்குப் புறமுதுகு காட்டும்படி செய்வேன்[b].
  rationale: The revision restores the coordinate future force of the first two Hebrew verbs and uses the more source-proximate possessive expression ‘என் பேரச்சம்.’ It retains the draft’s clear modern Tamil, direct divine agency, and the Hebrew image of enemies turning their backs in retreat.
  reviewer_model: gpt-5.6-terra
