base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/012.yaml
  text: For six days you shall do your work[a], but on the seventh day you shall cease, so that your ox and your donkey may rest[c][b], and the son of your female servant and the sojourner may be refreshed.
translation:
  language: ta
  text: ஆறு நாட்கள் உன் வேலைகளைச் செய். ஆனால் ஏழாம் நாளில் வேலை செய்வதை நிறுத்து[a]; உன் எருதும் உன் கழுதையும் ஓய்வெடுக்கவும், உன் அடிமைப் பெண்ணின் மகனும்[c] குடியிருக்கும் அந்நியனும்[b] புத்துணர்வு பெறவும் வேண்டும் என்பதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஓய்ந்திரு” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினையின் அடிப்படைப் பொருள் “நிறுத்து; செய்வதை விட்டுவிடு” என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: “குடியிருக்கும் அந்நியன்” என்பது இஸ்ரவேலரிடையே தங்கி, அவர்களுடைய சமூக மற்றும் சட்ட ஒழுங்குக்குள் வாழ்ந்த வெளிநாட்டவரைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: “உன் பெண் அடிமையின் மகன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: ஆறு நாட்கள்
  rationale: காலநீட்சியைக் குறிக்கும் எபிரெயச் சொற்றொடரை இயல்பான, நேரடியான தமிழில் தருகிறது.
- source_word: תַּעֲשֶׂה מַעֲשֶׂיךָ
  choice: நீ உன் வேலைகளைச் செய்
  rationale: சட்ட அறிவுறுத்தலாக வரும் இரண்டாம் நபர் ஒருமை வினையைத் தெளிவான கட்டளையாகவும், מַעֲשֶׂיךָ என்பதன் பன்மைத் தன்மையையும் காத்தும் தருகிறது.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ஆனால் ஏழாம் நாளில்
  rationale: ஆறு வேலை நாட்களுக்கும் ஏழாம் நாளுக்கும் இடையிலான முரணைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תִּשְׁבֹּת
  choice: வேலை செய்வதை நிறுத்து
  rationale: שׁבת வேரின் அடிப்படைப் பொருளான ‘நிறுத்துதல்’ அல்லது ‘செயலைக் கைவிடுதல்’ என்பதைப் பாதுகாக்கிறது; தனிப்பட்ட ஓய்வை மட்டும் குறிக்கும் வகையில் சுருக்கவில்லை.
- source_word: לְמַעַן
  choice: இதனால்
  rationale: அடுத்துவரும் ஓய்வும் புத்துணர்வும் ஏழாம் நாளில் வேலையை நிறுத்துவதன் நோக்கமும் விளைவுமாக இருப்பதை இயல்பான தமிழில் இணைக்கிறது.
- source_word: יָנוּחַ
  choice: ஓய்வெடுக்கட்டும்
  rationale: வேலை விலங்குகள் ஓய்வு பெறுவதைத் தெளிவாகவும் சூழலுக்கு ஏற்றவாறும் தெரிவிக்கிறது.
- source_word: שׁוֹרְךָ וַחֲמֹרֶךָ
  choice: உன் எருதும் உன் கழுதையும்
  rationale: வேளாண் மற்றும் சுமைவேலைச் சூழலில் இரு விலங்குகளையும் துல்லியமான நவீன தமிழில் குறிப்பிடுகிறது.
- source_word: וְיִנָּפֵשׁ
  choice: புத்துணர்வு பெறட்டும்
  rationale: நெபெஷ் வேரின் இவ்வடிவம் குறிக்கும் மூச்சுத் தெளிவு, மீட்சி, புத்துணர்வு ஆகிய கருத்துகளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֶּן אֲמָתְךָ
  choice: உன் அடிமைப் பெண்ணின் மகன்
  rationale: மூலத்தின் சமூக உறவையும் நேரடியான ‘மகன்’ என்ற சொல்லையும் மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: הַגֵּר
  choice: குடியிருக்கும் அந்நியன்
  rationale: இஸ்ரவேலரிடையே தங்கி அவர்களுடைய சமூகச் சட்ட ஒழுங்குக்குள் வாழ்ந்த அந்நியரைச் சுட்டும் சட்ட-சமூகப் பிரிவைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: שׁבת என்ற வினையை ஓய்வுநாள் சட்டத்தில் மொழிபெயர்த்தல்
  choice: வேலை செய்வதை நிறுத்து
  alternative: ஓய்ந்திரு
  rationale: மூல வினையின் மையக் கருத்து செயலை நிறுத்துவதாகும். அடுத்துள்ள கூறுகளே விலங்குகளின் ஓய்வையும் சார்ந்திருப்போரின் புத்துணர்வையும் விளக்குவதால், இங்கே ‘நிறுத்து’ என்பது உரையின் கருத்து முன்னேற்றத்தைப் பாதுகாக்கிறது.
- issue: גר என்ற சமூக-சட்டச் சொல்லை மொழிபெயர்த்தல்
  choice: குடியிருக்கும் அந்நியன்
  alternative: அந்நியன் / பரதேசி
  rationale: இது வெறுமனே அறிமுகமற்ற ஒருவரையோ வழிப்போக்கரையோ அல்லாமல், இஸ்ரவேலரிடையே வசிக்கும் வெளிநாட்டவரைக் குறிக்கிறது. மொழிபெயர்ப்பு அந்தச் சட்ட-சமூக நிலையை வெளிப்படையாகக் காக்கிறது.
- issue: אמה என்ற சமூக நிலைச் சொல்லை மொழிபெயர்த்தல்
  choice: அடிமைப் பெண்
  alternative: வேலைக்காரப் பெண் / பணிப்பெண்
  rationale: பண்டைய வீட்டமைப்பில் இருந்த சார்பும் சுதந்திரமின்மையும் மறைந்துவிடாதபடி நேரடியான சொல்லைத் தேர்ந்தெடுக்கிறது; அதேவேளை வசனம் குறிப்பாக அவளுடைய மகனுக்கு ஓய்வுநாள் நன்மையை விரிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை முகவரியைக் காத்து, கட்டளைநடையை இயல்பாக வழங்குகிறது. ‘அடிமைப் பெண்’ என்பது வரலாற்றுச் சமூக நிலையை மறைக்காமல் சொல்கிறது; ‘குடியிருக்கும் அந்நியன்’ என்பது அரிதான சமயச் சொல்லை விட சாதாரண வாசகருக்குத் தெளிவானது. ‘இதனால் ... -ட்டும்’ அமைப்பு நோக்கக் கூறின் மனிதாபிமான வலியுறுத்தலைக் காக்கிறது.
