  source_fidelity: ‘நீ கண்டால்’ broadly conveys the situation but weakens פגעத்தின் incidental ‘come upon/encounter’ nuance. Recasting the clause with ‘உனக்கு எதிர்ப்பட்டால்’ retains that nuance while preserving the conditional legal form.
  naturalness: The revised wording is natural modern standard Tamil and has an appropriately direct legal-register command.
  terminology: ‘பகைவன்,’ ‘எருது,’ and ‘கழுதை’ accurately retain the source’s relationship and animal terms. ‘கட்டாயம்’ together with ‘வேண்டும்’ conveys the emphatic infinitive-absolute construction without adding theological interpretation.
  issues:
