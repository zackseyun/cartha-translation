  to: உன் பகைவனுடைய எருதோ கழுதையோ வழிதவறித் திரிவது உனக்கு எதிர்ப்பட்டால்[a], அதை அவனிடம் கட்டாயம் திருப்பிக் கொண்டுபோய் விட வேண்டும்.
