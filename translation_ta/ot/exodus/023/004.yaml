  text: כִּ֣י תִפְגַּ֞ע שׁ֧וֹר אֹֽיִבְ/ךָ֛ א֥וֹ חֲמֹר֖/וֹ תֹּעֶ֑ה הָשֵׁ֥ב תְּשִׁיבֶ֖/נּוּ לֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/004.yaml
  text: If you come upon your enemy’s ox or his donkey going astray[a], you must surely return it to him.
translation:
  language: ta
  text: உன் பகைவனுடைய எருதோ கழுதையோ வழிதவறித் திரிவது உனக்கு எதிர்ப்பட்டால்[a], அதை அவனிடம் கட்டாயம் திருப்பிக் கொண்டுபோய் விட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் பகைவனுடைய எருதோ கழுதையோ வழிதவறித் திரிவதை நீ காணும்போது.”
    reason: கִּיயை நிபந்தனைப் பொருளில் ‘என்றால்/காணும்போது’ எனவும், תֹּעֶהயை ‘வழிதவறித் திரிவது/அலைந்து திரிவது’ எனவும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: כִּי
  choice: கண்டால்
  rationale: சட்டத்தின் நிபந்தனையை இயல்பான தமிழில் ‘-ஆல்’ வடிவம் தெளிவாகக் காட்டுகிறது; ‘காணும்போது’ என்பதும் சாத்தியம்.
- source_word: תִפְגַּע
  choice: நீ கண்டால்
  rationale: இங்கு פגע திட்டமிடாமல் எதிர்ப்படுதல் அல்லது காணுதல் என்ற பொருளில் வருகிறது. சாதாரண வாசகருக்கு இயல்பாக இருக்க ‘நீ கண்டால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שׁוֹר
  choice: எருது
  rationale: வேளாண்மைச் சூழலில் உள்ள மாட்டினத்தைக் குறிப்பதற்கான குறிப்பான, வழக்கமான தமிழ்ச் சொல்.
- source_word: אֹיִבְךָ
  choice: உன் பகைவனுடைய
  rationale: ‘உன் பகைவன்’ என்ற நேரடியான உறவை மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: חֲמֹרוֹ
  choice: கழுதை
  rationale: חֲמוֹר என்பதற்கான தெளிவான நவீனத் தமிழ்ச் சொல்; முன்வரும் ‘உன் பகைவனுடைய’ என்பது எருது, கழுதை இரண்டுக்கும் பொருந்துகிறது.
- source_word: תֹּעֶה
  choice: வழிதவறிச் செல்வதை
  rationale: விலங்கு உரிய வழியிலிருந்து விலகிச் செல்வதைக் காட்டுகிறது; அது நிரந்தரமாகத் தொலைந்துவிட்டதாக மிகைப்படுத்தவில்லை.
- source_word: הָשֵׁב תְּשִׁיבֶנּוּ
  choice: கட்டாயம் திருப்பிக் கொண்டுபோய் விட வேண்டும்
  rationale: வினையெச்ச முழுவடிவமும் வினைமுற்றும் இணைந்து தரும் வலியுறுத்தப்பட்ட கட்டளையை ‘கட்டாயம்’ மற்றும் ‘வேண்டும்’ மூலம் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לוֹ
  choice: அவனிடம்
  rationale: இப்பெயர்ச்சுட்டு பகைவனாகிய உரிமையாளரையே சுட்டுகிறது; ‘உரிமையாளரிடம்’ என்று விளக்கமாக விரிவுபடுத்தாமல் நேரடித் தொடர்பைக் காக்கிறது.
theological_decisions:
- issue: பகைவனுக்குச் செய்ய வேண்டிய நெறிசார் கடமை
  choice: ‘உன் பகைவன்’ என்ற சொல்லை அப்படியே காத்து, அவனுடைய வழிதவறிய விலங்கை அவனிடம் திருப்பிக் கொண்டுபோக வேண்டிய கட்டளையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அயலான்’ அல்லது ‘உன்னை வெறுப்பவன்’
  rationale: எபிரெய மூலத்தில் ‘பகைவன்’ என்றே தெளிவாக உள்ளது. எதிரியிடமும் நீதியுடனும் நடைமுறை இரக்கத்துடனும் செயல்பட வேண்டும் என்ற நெறிசார் பதற்றத்தை மொழிபெயர்ப்பு மென்மைப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு புரியும் வகையிலும் சட்டக் கட்டளையின் கண்ணியமும் வலிமையும் காக்கப்படும் வகையிலும் வடிவமைக்கப்பட்டது. ஒருமை இரண்டாம் நபருக்கு ‘உன்/நீ’ பயன்படுத்தப்பட்டுள்ளது; பகைவன் என்ற கூர்மையான உறவு மென்மைப்படுத்தப்படவில்லை.
