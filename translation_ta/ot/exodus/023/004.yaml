    issue: ‘கண்டால்’ does not fully represent תִפְגַּע.
    rationale: The Hebrew verb denotes encountering/coming upon, not simply seeing. This distinction is readily expressed in Tamil as ‘உனக்கு எதிர்ப்பட்டால்.’
  - severity: low
    issue: The existing footnote conflates the conditional particle and the verb in explaining ‘கண்டால்.’
    rationale: கִּי supplies the conditional force, whereas תִפְגַּע supplies the encounter action. The revised footnote distinguishes the alternative rendering without an imprecise lexical explanation.
