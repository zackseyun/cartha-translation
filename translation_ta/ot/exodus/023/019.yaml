base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/019.yaml
  text: The first of the firstfruits of your ground you shall bring into the house of Yahweh your God[b][a]. You shall not boil a young goat in its mother’s milk.
translation:
  language: ta
  text: உன் நிலத்தின் முதற்கனிகளில் முதன்மையானவற்றை உன் கடவுளாகிய யாவேயின் இல்லத்திற்குக் கொண்டுவர வேண்டும்.[a] ஓர் இளம் வெள்ளாட்டை[b] அதன் தாயின் பாலில் வேகவைக்கக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் நிலத்தின் முதற்கனிகளை.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “ஒரு குட்டி”; இங்கே ஓர் இளம் வெள்ளாடு.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: முதற்கனிகளில் முதலானவற்றை
  rationale: ரֵאשִׁית என்ற ‘முதல் பகுதி’ என்ற கருத்தையும், בִּכּוּרֵי என்ற வழிபாட்டுக்குரிய ‘முதற்கனிகள்’ என்ற சொல்லையும் வேறுபடுத்திக் காட்டி, எபிரெயச் சொல்லமைப்பின் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: אַדְמָתְךָ
  choice: உன் நிலத்தின்
  rationale: பயிர் விளையும் மண் அல்லது நிலம் என்ற வேளாண்மைச் சூழலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: תָּבִיא
  choice: கொண்டுவர வேண்டும்
  rationale: சட்டக் கட்டளையின் வலிமையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவேயின் இல்லத்திற்கு
  rationale: בֵּית என்பதன் ‘இல்லம்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; பிற்காலக் கோவில் கட்டடத்தை உரைக்குள் இறக்குமதி செய்வதைத் தவிர்க்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக உள்ள உடன்படிக்கைப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לֹא תְבַשֵּׁל
  choice: வேகவைக்கக் கூடாது
  rationale: בשל குறிக்கும் கொதிக்கவைத்து வேகவைத்தலைத் தெரிவிப்பதோடு, தடையின் சட்ட வலிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: גְּדִי
  choice: ஓர் இளம் வெள்ளாட்டை
  rationale: இச்சொல்லின் வழக்கமான பொருளைத் தெளிவாகத் தருகிறது; ‘குட்டி’ என்பதால் மட்டும் ஏற்படக்கூடிய இனத் தெளிவின்மையைத் தவிர்க்கிறது.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: அதன் தாயின் பாலில்
  rationale: மூலத்தின் நேரடியான, நினைவில் நிற்கும் படிமத்தை இயல்பான தமிழில் அப்படியே காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: இளம் வெள்ளாட்டை அதன் தாயின் பாலில் வேகவைக்கக்கூடாது என்ற தடையின் பொருள்
  choice: தடையை அதன் நேரடியான வடிவிலேயே வைத்தல்
  alternative: கானானியச் சடங்கு, கொடுமை, அல்லது உணவுப் பிரிப்பு பற்றிய விளக்கத்தை மொழிபெயர்ப்பிலேயே சேர்த்தல்
  rationale: இந்தத் தடைக்கான காரணத்தை எபிரெய வசனம் கூறவில்லை; ஆகவே அதன் வரலாற்று அல்லது சமயப் பின்னணியை ஊகித்து உரையில் சேர்க்காமல் உள்ளார்ந்த தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘இல்லம்’ என்பது கூடாரம் அல்லது ஆலயம் ஆகிய இரண்டுக்கும் இடமளிக்கிறது; ‘வேண்டும்/கூடாது’ என்ற அமைப்பு கட்டளையின் வலிமையை இயல்பாகக் காட்டுகிறது.
