  text: You shall make no covenant with them or with their gods[a][b].
translation:
  language: ta
  text: அவர்களுடனோ அவர்களுடைய தெய்வங்களுடனோ உடன்படிக்கை செய்யாதே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “அவர்களுடனும் அவர்களுடைய தெய்வங்களுடனும் உடன்படிக்கையை வெட்டாதே.”
    reason: மூலத்தின் உடன்படிக்கை மரபுத்தொடரையும் ו என்பதன் முறையான ‘மற்றும்’ வாசிப்பையும் பதிவு செய்தல்.
lexical_decisions:
- source_word: לֹא
  choice: செய்யாதே
  rationale: எபிரெய எதிர்மறைக் கட்டளையின் வலிமையை இயல்பான நவீனத் தமிழில் ஒருமை முன்னிலைக் கட்டளையாகத் தருகிறது.
- source_word: תִכְרֹת
  choice: செய்யாதே
  rationale: כרת ברית என்பது சொல்லுக்குச் சொல் ‘உடன்படிக்கையை வெட்டுதல்’ என்றாலும், தமிழில் ‘உடன்படிக்கை செய்தல்’ என்பதே இயல்பான மரபுத்தொடர்.
- source_word: לָהֶם
  choice: அவர்களுடன்
  rationale: உடன்படிக்கையில் பங்குகொள்ளும் எதிர்தரப்பைக் குறிக்கும் ל முன்னொட்டைத் தமிழில் ‘உடன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְלֵאלֹהֵיהֶם
  choice: அவர்களுடைய தெய்வங்களுடனோ
  rationale: ו என்பதன் அடிப்படை இணைப்பு வலிமையைப் பாதுகாத்தபடியே, எதிர்மறைப் பட்டியலில் ‘அவர்களுடனோ … தெய்வங்களுடனோ’ என்ற தமிழ் அமைப்பு இரு தரப்புகளுடனும் உடன்படிக்கை தடைசெய்யப்படுவதைத் தெளிவாக்குகிறது.
- source_word: בְּרִית
  choice: உடன்படிக்கை
  rationale: அரசியல் ஒப்பந்தத்தையும் சமய-உறவுப் பரிமாணத்தையும் உள்ளடக்கக்கூடிய நிலையான தமிழ் வேதாகமச் சொல்; ‘ஒப்பந்தம்’ என்பதைக் காட்டிலும் மூலச்சொல்லின் பரந்த வலிமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: כרת ברית என்ற உடன்படிக்கை மரபுத்தொடர்
  choice: உடன்படிக்கை செய்யாதே
  alternative: உடன்படிக்கையை வெட்டாதே
  rationale: சொல்லுக்குச் சொல் வடிவம் தமிழில் இயல்பற்றதும் தவறாகப் புரியக்கூடியதும் ஆகும்; ‘உடன்படிக்கை செய்தல்’ சட்ட-உறவு வலிமையை இழக்காமல் பொருளைத் தெளிவாகத் தருகிறது.
- issue: ‘அவர்களுடைய தெய்வங்கள்’ என்பதற்கு முன் வரும் ו-வின் வலிமை
  choice: அவர்களுடனோ அவர்களுடைய தெய்வங்களுடனோ
  alternative: அவர்களுடனும் அவர்களுடைய தெய்வங்களுடனும்
  rationale: எபிரெயத்தில் ו வழக்கமாக ‘மற்றும்’ என இணைக்கிறது. ஆனால் எதிர்மறைக் கட்டளையில் தமிழ் ‘-ஓ … -ஓ’ அமைப்பு ‘இவர்களில் எவருடனும் வேண்டாம்’ என்ற பகிர்ந்தளிக்கும் தடையை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது; முறையான ‘மற்றும்’ வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; ஒருமை முன்னிலைக்குரிய ‘செய்யாதே’ மூலத்தின் இரண்டாம் நபர் ஆண்பால் ஒருமைக் கட்டளையைத் தமிழில் இயல்பாகக் காட்டுகிறது. ‘தெய்வங்கள்’ பன்மையையும் புறசமயச் சூழலையும் பாதுகாக்கிறது.
