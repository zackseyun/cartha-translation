  yaml_path: translation/ot/exodus/023/016.yaml
  text: and the Feast of Harvest[a], the firstfruits of your labors, of what you sow in the field; and the Feast of Ingathering at the end of the year[c][b], when you gather in your labors from the field.
translation:
  language: ta
  text: வயலில் நீ விதைக்கும் உன் உழைப்பின் முதற்பலன்களுக்குரிய அறுவடைப் பெருவிழாவும்[a]; ஆண்டின் முடிவில்[b], வயலிலிருந்து உன் உழைப்பின் பலன்களை நீ சேகரிக்கும்போது வரும் சேகரிப்புப் பெருவிழாவும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: חַג என்பதற்கு இவ்வசனத்தின் இரு இடங்களிலும் ‘விழா’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘ஆண்டு வெளியேறும்போது.’
    reason: lexical_alternative
  - marker: c
    text: ‘சேகரிப்பு’ என்பது வயலின் விளைபொருள்களை ஒன்றுசேர்ப்பதைக் குறிக்கும் பெருவிழாவின் பெயர்.
    reason: cultural_note
lexical_decisions:
- source_word: חַג
  choice: பெருவிழா
  rationale: கொண்டாட்டத்தையும் குறிப்பிட்ட சமய அனுசரிப்பையும் உணர்த்தும் இயல்பான தமிழ் சொல். இரு இடங்களிலும் ஒரேவிதமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַקָּצִיר
  choice: அறுவடை
  rationale: அறுத்தல் அல்லது அறுவடை செய்தல் என்ற பொருளுடைய இச்சொல், விழாவின் பெயரில் இயல்பாக ‘அறுவடை’ என வருகிறது.
- source_word: בִּכּוּרֵי
  choice: முதற்பலன்கள்
  rationale: விளைச்சலின் முதலில் கிடைத்து அர்ப்பணிக்கப்படும் பகுதி என்ற வேளாண்மை மற்றும் வழிபாட்டுப் பொருள்களைப் பாதுகாக்கிறது.
- source_word: מַעֲשֶׂיךָ
  choice: உன் உழைப்பின் பலன்கள்
  rationale: நேரடியாக ‘உன் செயல்கள்/வேலைகள்’ என்று பொருள்பட்டாலும், இவ்வேளாண்மைச் சூழலில் உழைப்பால் விளைந்தவற்றைக் குறிக்கிறது. மனித உழைப்புக்கும் அதன் விளைவுக்கும் உள்ள தொடர்பைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר תִּזְרַע בַּשָּׂדֶה
  choice: வயலில் நீ விதைத்த
  rationale: வயலில் விதைக்கப்பட்டவற்றிலிருந்தே முதற்பலன்கள் கிடைக்கின்றன என்பதை இயல்பான தமிழில் நேரடியாகச் சொல்கிறது.
- source_word: הָאָסִף
  choice: சேகரிப்பு
  rationale: வயலின் விளைபொருள்களை ஒன்றுசேர்த்தலைக் குறிக்கும் பெயர்ச்சொல்லாகவும் விழாவின் பெயராகவும் அமைகிறது.
- source_word: בְּצֵאת הַשָּׁנָה
  choice: ஆண்டின் முடிவில்
  rationale: சொல்லுக்கு சொல் ‘ஆண்டு வெளியேறும்போது’ என்றாலும், அதன் காலப்பொருளை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: בְּאָסְפְּךָ
  choice: நீ சேகரிக்கும்போது
  rationale: முன்னொட்டுடன் வரும் எபிரெய வினைப்பெயரின் காலத் தொடர்பை இயல்பான தமிழ் துணைவாக்கியமாகக் காட்டுகிறது.
- source_word: מִן הַשָּׂדֶה
  choice: வயலிலிருந்து
  rationale: விளைபொருள்கள் சேகரிக்கப்படும் இடத்தின் மூலத்தை நேரடியாகக் குறிக்கிறது.
