translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. இவ்வசனம் முந்தைய கட்டளையின் தொடர்ச்சியான பெயர்த்தொடராக இருப்பதால், மூலத்தில் இல்லாத ‘கடைப்பிடி’ போன்ற வினைச்சொல் சேர்க்கப்படவில்லை. ‘அறுவடைப் பெருவிழா’ மற்றும் ‘சேகரிப்புப் பெருவிழா’ என்பவை விழாப் பெயர்களாகத் தெளிவாகவும் இயல்பாகவும் அமைக்கப்பட்டுள்ளன.
