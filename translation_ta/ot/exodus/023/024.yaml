  text: அவர்களுடைய தெய்வங்களுக்கு முன் தலைவணங்காதே; அவற்றுக்குப் பணிவிடை செய்யாதே; அவர்கள் செய்கிற செயல்களைப் பின்பற்றாதே. மாறாக, அவற்றை முற்றிலுமாக இடித்துத் தள்ளி, அவர்களுடைய வழிபாட்டுத் தூண்களை[a] முற்றிலுமாக உடைத்துப்போடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய நாட்டப்பட்ட கற்களை.” எபிரெயச் சொல் வழிபாட்டோடு தொடர்புடைய, செங்குத்தாக நிறுவப்பட்ட கல் நினைவுச்சின்னங்களைக் குறிக்கிறது.
