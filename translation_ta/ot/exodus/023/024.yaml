- issue: இடித்தழிக்கும் கட்டளையின் பன்மைச் சுட்டுப்பெயர் எதைக் குறிக்கிறது
  choice: ‘அவற்றை’ என்று மூலத்தின் சுட்டுப்பெயரைப் பாதுகாத்து, அடுத்த சொற்றொடரில் வழிபாட்டுத் தூண்களை வெளிப்படையாகக் குறிப்பிடுதல்
  alternative: அது தெய்வங்களையே நேரடியாகக் குறிக்கிறது என்று கூறுதல் அல்லது வழிபாட்டுப் பொருட்களையே குறிக்கிறது என்று மொழிபெயர்ப்பிலேயே வெளிப்படையாகத் தீர்மானித்தல்
  rationale: எபிரெயச் சுட்டுப்பெயர் முன் குறிப்பிடப்பட்ட தெய்வங்களை இலக்கணரீதியாகச் சுட்டலாம்; சூழலில் அவற்றுடன் தொடர்புடைய கண்கூடான வழிபாட்டுச் சின்னங்களின் அழிவும் தெளிவாகிறது. தமிழில் ‘அவற்றை’ என்பது இந்த வலிமையையும் ஓரளவு தெளிவின்மையையும் காக்கிறது.
