  text: There shall not be one miscarrying or barren in your land[b][a]; I will fill up the number of your days.
translation:
  language: ta
  text: உன் நாட்டில் கருவிழக்கிறவளோ பிள்ளைப்பேறு இல்லாதவளோ இருக்கமாட்டாள்.[a] உன் நாட்களின் எண்ணிக்கையை நான் நிறைவாக்குவேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பிள்ளையை இழந்தவளோ.’ எபிரெயச் சொல் பிள்ளையை இழப்பதைப் பரந்த வகையில் குறிக்கலாம்; ஆனால் இங்கு ‘பிள்ளைப்பேறு இல்லாதவள்’ என்பதுடன் இணைந்திருப்பதால், கருவிழப்பு அல்லது பேறுகாலத்தில் பிள்ளையை இழத்தல் என்பதே பெரும்பாலும் கருத்தாகும்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘உன் நாட்களின் எண்ணிக்கையை நான் நிரப்புவேன்’; அதாவது, உன் வாழ்நாளை அதன் முழு அளவுக்கு நான் கொண்டுசெல்வேன்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁכֵּלָה
  choice: கருவிழக்கிறவள்
  rationale: இச்சொல் பிள்ளையை இழத்தல் என்ற பரந்த பொருளையும் கொள்ளக்கூடும். எனினும், பிள்ளைப்பேறு இல்லாமையைக் குறிக்கும் அடுத்த சொல்லுடன் இணைந்துள்ள இச்சூழலில், கருவை முழுக் காலம் சுமக்க முடியாமல் இழப்பதைக் குறிக்கும் இயல்பான தமிழ் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: עֲקָרָה
  choice: பிள்ளைப்பேறு இல்லாதவள்
  rationale: கருவுறவோ பிள்ளை பெறவோ இயலாத பெண்ணைக் குறிக்கிறது. இன்றைய பொதுத் தமிழில் இழிவுணர்வு ஏற்படுத்தக்கூடிய பழைய அடைமொழியைத் தவிர்த்து, தெளிவானதும் கண்ணியமானதுமான சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: בְּאַרְצֶךָ
  choice: உன் நாட்டில்
  rationale: இங்கு אֶרֶץ என்பது பொதுவாகப் பூமியை அல்ல, இஸ்ரவேல் குடியேறவிருந்த உடன்படிக்கை நாட்டைக் குறிக்கிறது. ‘உன் நாட்டில்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: אֶת מִסְפַּר יָמֶיךָ
  choice: உன் நாட்களின் எண்ணிக்கையை
  rationale: எபிரெயச் சொற்றொடரின் உருவகத்தையும், ஒருவருக்கு அளிக்கப்பட்ட வாழ்நாள் காலத்தையும் ஒருங்கே தக்கவைக்கிறது.
- source_word: אֲמַלֵּא
  choice: நான் நிறைவாக்குவேன்
  rationale: מלא என்பதன் ‘நிரப்புதல், முழுமையாக்குதல்’ என்ற உருவகத்தைத் தக்கவைத்து, வாழ்நாளை அதன் முழு அளவுக்கு கொண்டுசெல்லுதல் என்ற சூழற்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא תִהְיֶה
  choice: இருக்கமாட்டாள்
  rationale: பெண்பால் ஒருமை வடிவங்களில் வரும் இரு நிலைகளையும் இணைத்து, ‘அப்படிப்பட்டவள் இருக்கமாட்டாள்’ என்ற எபிரெய இருப்புக் கூற்றை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: கருவளம் மற்றும் முழு வாழ்நாள் பற்றிய வாக்குறுதியின் வரம்பு
  choice: நாட்டில் இஸ்ரவேலருக்குக் கொடுக்கப்படும் உடன்படிக்கை ஆசீர்வாதமாகவே வசனம் மொழிபெயர்க்கப்பட்டுள்ளது; கருவிழப்பு, பிள்ளைப்பேறின்மை, குறைந்த ஆயுள் ஆகியவற்றிலிருந்து விடுதலை இதில் அடங்கும்.
  alternative: காலத்தையும் உடன்படிக்கைச் சூழலையும் பொருட்படுத்தாமல், ஒவ்வொரு விசுவாசிக்கும் ஒருபோதும் கருவிழப்போ பிள்ளைப்பேறின்மையோ அகால மரணமோ நேராது என்ற உலகளாவிய வாக்குறுதியாக வாசித்தல்.
  rationale: உடனடியான சூழல், நாட்டில் இஸ்ரவேலருக்கு யாவே அளிக்கும் உடன்படிக்கை வாக்குறுதிகளைப் பற்றியது. ஆகவே மொழிபெயர்ப்பு உரையைத் தாண்டிய உலகளாவிய கோட்பாட்டைச் சேர்க்காமல், மூலத்தின் நேரடி வாக்குறுதியையும் அதன் பதற்றத்தையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் தெளிவான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மலடி’ போன்ற இழிவாக ஒலிக்கக்கூடிய சொல்லுக்குப் பதிலாக ‘பிள்ளைப்பேறு இல்லாதவள்’ என வழங்கப்பட்டுள்ளது. ஒருமை இரண்டாம் நபரான ‘உன்’ என்பதும், எபிரெய மூலத்தின் ‘நாட்களின் எண்ணிக்கை’ என்ற நிறைவு உருவகமும் தக்கவைக்கப்பட்டுள்ளன.
