source:
  edition: WLC
  text: כִּֽי תִרְאֶ֞ה חֲמ֣וֹר שֹׂנַאֲ/ךָ֗ רֹבֵץ֙ תַּ֣חַת מַשָּׂא֔/וֹ וְ/חָדַלְתָּ֖ מֵ/עֲזֹ֣ב ל֑/וֹ עָזֹ֥ב תַּעֲזֹ֖ב עִמּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/005.yaml
  text: If you see the donkey of one who hates you lying down under its load[a], and would refrain from helping him[b], you must surely help with him.
translation:
  language: ta
  text: உன்னை வெறுப்பவனின் கழுதை அதன் சுமையின் கீழ் படுத்துக்கிடப்பதை நீ கண்டால், அவனுக்கு உதவாமல் இருக்க நினைத்தாலும், அவனோடு சேர்ந்து உதவியே ஆக வேண்டும்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இறுதியாக வரும் “அவனோடு” என்பது கழுதையையும் குறிக்கலாம்; அதாவது அதன் சுமை தொடர்பாகக் கழுதைக்கு உதவ வேண்டும். இந்த ஆண்பால் ஒருமைச் சுட்டுப்பெயர் உரிமையாளரையோ விலங்கையோ குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: இங்கு “உதவு” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெய வினைச்சொல் பொதுவாக “விட்டுவிடு” அல்லது “கைவிடு” என்று பொருள்படும்; இச்சூழலில் அது “உதவி செய், துணை செய்” என்ற பொருளைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תִרְאֶה
  choice: நீ கண்டால்
  rationale: כִּי இங்கு சட்ட நிபந்தனையை அறிமுகப்படுத்துகிறது; ראה என்பதன் நேரடியான ‘காண்’ என்ற பொருளையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: חֲמוֹר שֹׂנַאֲךָ
  choice: உன்னை வெறுக்கிறவனுடைய கழுதை
  rationale: שֹׂנַאֲךָ என்பது ‘உன் பகைவன்’ என்ற விரிவான வகைப்பாட்டைவிட நேரடியாக ‘உன்னை வெறுக்கிறவன்’ எனப் பொருள்படும் வினையெச்ச வடிவம்.
- source_word: רֹבֵץ תַּחַת מַשָּׂאוֹ
  choice: அதன் சுமையின் கீழ் படுத்துக்கிடப்பதை
  rationale: רֹבֵץ விலங்கு படுத்திருக்கும் நிலையைச் சுட்டுகிறது; ‘சரிந்து விழுந்தது’ என மூலத்தில் இல்லாத விவரத்தைச் சேர்க்காமல், சுமையின் கீழுள்ள காட்சியைப் பாதுகாக்கிறது.
- source_word: וְחָדַלְתָּ מֵעֲזֹב לוֹ
  choice: அவனுக்கு உதவாமல் விலக நினைத்தாலும்
  rationale: சிக்கலான இத்தொடர் உதவியிலிருந்து பின்வாங்கும் மனநிலை அல்லது வாய்ப்பைக் குறிக்கிறது. ‘நினைத்தாலும்’ நிபந்தனைச் சூழலில் இதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עָזֹב תַּעֲזֹב
  choice: உதவியே ஆக வேண்டும்
  rationale: வினைமுற்றுக்கு முன் வரும் அதே வேருடைய வினையெச்சம் கட்டளையை வலியுறுத்துகிறது. இச்சூழலில் עזב என்பதற்கு வழக்கமான ‘விட்டுவிடு’ என்பதற்குப் பதிலாக ‘உதவு’ என்ற பொருள் பொருந்துகிறது.
- source_word: עִמּוֹ
  choice: அவனோடு சேர்ந்து
  rationale: ஆண்பால் ஒருமை பின்னொட்டு உரிமையாளரையோ கழுதையையோ குறிக்கலாம். முதன்மை உரையில் உரிமையாளருடன் சேர்ந்து உதவுவதைத் தேர்ந்தெடுத்து, மாற்றுப் புரிதலை அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: இறுதி עִמּוֹ என்ற பின்னொட்டின் சுட்டுப்பொருள்
  choice: அவனோடு சேர்ந்து—அதாவது உன்னை வெறுக்கிற உரிமையாளருடன்
  alternative: அதனோடு—அதாவது கழுதைக்கு அதன் சுமை தொடர்பாக உதவுதல்
  rationale: எபிரெய ஆண்பால் ஒருமை வடிவம் உரிமையாளரையும் கழுதையையும் இலக்கண ரீதியாகக் குறிக்க முடியும். பகைமை கொண்ட மனிதனுக்குக்கூட உதவ வேண்டும் என்ற சட்டத்தின் உறவுசார் வலியுறுத்தல் காரணமாக உரிமையாளர் முதன்மை உரையில் கொள்ளப்படுகிறார்; உண்மையான தெளிவின்மை அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: עזב என்பதன் சூழல்சார் பொருள்
  choice: உதவு
  alternative: விட்டுவிடு அல்லது விடுவி
  rationale: இந்த வேர் பொதுவாக ‘விடு/கைவிடு’ எனப் பொருள்பட்டாலும், இங்கு சுமையின் கீழுள்ள விலங்கு மற்றும் அதன் உரிமையாளருக்குச் செய்ய வேண்டிய செயலின் சூழல் ‘உதவு’ என்ற பொருளை ஆதரிக்கிறது; மாற்று சொற்பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளையின் வலிமையையும் மூலத்தின் சுருக்கத்தையும் காக்கும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘உன்னை வெறுக்கிறவன்’ என்பது மூலத்தின் நேரடி உறவுசார் பதற்றத்தைப் பாதுகாக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
