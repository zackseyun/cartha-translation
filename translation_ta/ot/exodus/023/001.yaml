  register: நவீன நிலையான தமிழில், ஒருமைத் தடைக் கட்டளை நடையுடன் மொழிபெயர்க்கப்பட்டது. சட்டநெறிக்குரிய கண்ணியமும் நேரடித்தன்மையும் பேணப்பட்டுள்ளன; எபிரெயக் கை உருவகம் ‘கைகோக்காதே’ என்று இயல்பாகத் தரப்பட்டுள்ளது.
