  yaml_path: translation/ot/exodus/023/001.yaml
  text: You shall not spread a false report[b][a]. Do not join hands with a wicked man to be a malicious witness.
translation:
  language: ta
  text: பொய்யான செய்தியைப் பரப்பாதே.[a] தீங்கிழைக்கும் சாட்சியாக இருப்பதற்காகத் தீயவனோடு கைகோக்காதே.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொய்யான செய்தியைச் சுமந்து செல்லாதே.” எபிரெய வினைச்சொல் அடிப்படையில் “தூக்கு/சும” என்று பொருள்படும்; இங்கு ஒரு செய்தியை எடுத்துச் சென்று பரப்புவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “தீங்கிழைக்கும் சாட்சியாக இருப்பதற்கு உன் கையைத் தீயவனோடு வைக்காதே.” “தீங்கிழைக்கும் சாட்சி” என்பதை “வன்முறையான சாட்சி” அல்லது “அநீதியான சாட்சி” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: பரப்பாதே
  rationale: נשא என்பதன் அடிப்படைப் பொருள் ‘தூக்கு/சும’; שֵׁמַע உடன் வரும்போது ஒரு செய்தியை ஏற்றுச் சென்று பரப்புவதைக் குறிக்கிறது. ‘பரப்பாதே’ என்பது இச்சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: שֵׁמַע שָׁוְא
  choice: பொய்யான செய்தி
  rationale: שֵׁמַע என்பது கேட்ட செய்தி அல்லது தகவல்; שָׁוְא என்பது பொய், வெறுமை, பயனின்மை ஆகிய பொருள்களைக் கொண்டது. சட்டநெறிச் சூழலில் ‘பொய்யான செய்தி’ பொருத்தமானது.
- source_word: תָּשֶׁת יָדְךָ עִם
  choice: கைகோக்காதே
  rationale: சொல்லுக்குச் சொல் ‘உன் கையை ... உடன் வைக்காதே.’ கூட்டுச் சேர்ந்து துணைபோவதைக் குறிக்கும் உருவகத்தை ‘கைகோக்காதே’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: רָשָׁע
  choice: தீயவன்
  rationale: רָשָׁע சட்ட மற்றும் அறநெறிச் சூழல்களில் தீயவன் அல்லது குற்றவாளி எனப் பொருள்படும். மூலத்தின் ஆண்பால் ஒருமையை ‘தீயவன்’ தக்கவைக்கிறது.
- source_word: לִהְיוֹת עֵד חָמָס
  choice: கொடுமையான சாட்சியாக இருப்பதற்காக
  rationale: עֵד என்பது ‘சாட்சி’; חָמָס என்பது வன்முறை, கொடுமை, அநீதி எனப் பொருள்படும். ‘கொடுமையான சாட்சி’ மூலச்சொல்லின் வலிமையையும், நீதிக்குக் கேடு விளைவிக்கும் சாட்சியம் என்ற சூழலையும் பாதுகாக்கிறது.
- source_word: לֹא / אַל
  choice: பரப்பாதே / கைகோக்காதே
  rationale: இரண்டும் தடைக் கட்டளைகள். நவீனத் தமிழில் ஒருமை முகவரியுடன் வரும் ‘-ஆதே’ வடிவம் நேரடியான சட்டநெறிக் கட்டளையை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சட்ட அறிவுரையிலுள்ள ஆண்பால் ஒருமை வடிவங்கள்
  choice: ஒருமை முகவரியையும் ‘தீயவன்’ என்ற ஆண்பால் வடிவத்தையும் தக்கவைத்தல்
  alternative: ‘தீய நபர்’ போன்ற பாலினப் பொதுமை வடிவத்தைப் பயன்படுத்துதல்
  rationale: எபிரெய உரை ஆண்பால் ஒருமையில் ஒருவரை நோக்கிப் பேசுவதோடு, உடந்தையாகும் நபரையும் ஆண்பால் ஒருமையில் குறிப்பிடுகிறது. இதைத் தமிழில் தக்கவைப்பது மூல வடிவத்துக்கு நெருக்கமானது.
- issue: עֵד חָמָס என்பதன் பொருள்
  choice: கொடுமையான சாட்சி
  alternative: தீங்கிழைக்கும் சாட்சி / அநீதியான சாட்சி / பொய்ச்சாட்சி
  rationale: חָמָס என்பதைக் ‘பொய்’ என்று மட்டும் சுருக்காமல், அதன் கொடுமை, வன்முறை, அநீதி ஆகிய விரிந்த பொருள் அழுத்தத்தைத் தக்கவைக்கிறது; சட்டச் சூழலில் தீங்கான அல்லது அநீதியான சாட்சி என்ற பொருளும் சாத்தியம்.
