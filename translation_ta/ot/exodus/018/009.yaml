  text: Jethro rejoiced over all the good that Yahweh had done for Israel[b][a], whom he had delivered from the hand of Egypt.
translation:
  language: ta
  text: யாவே எகிப்தின் கையிலிருந்து விடுவித்திருந்த இஸ்ரவேலுக்குச் செய்த எல்லா நன்மையையும் குறித்து யெத்ரோ மகிழ்ந்தார்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மனமகிழ்ந்தார்.’ எபிரெய வினைச்சொல் மகிழ்ச்சியடைவதையோ களிகூருவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘எகிப்தின் கையிலிருந்து’ என்பது எகிப்தின் அதிகாரத்திலிருந்தும் பிடியிலிருந்தும் விடுவிக்கப்பட்டதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַדְּ
  choice: மகிழ்ந்தார்
  rationale: இந்த வினைச்சொல் மகிழ்ச்சியடைவதையோ களிகூருவதையோ குறிக்கலாம். இங்கு கடவுளின் மீட்புச் செயலுக்கான யெத்ரோவின் நேர்மறையான எதிர்வினையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: יִתְרוֹ
  choice: யெத்ரோ
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பெயர்ப்பாகத் தமிழில் வழங்கப்பட்டது.
- source_word: עַל כָּל הַטּוֹבָה
  choice: எல்லா நன்மையையும் குறித்து
  rationale: עַל என்பது இங்கு மகிழ்ச்சிக்கான காரணத்தையோ சந்தர்ப்பத்தையோ சுட்டுகிறது. הַטּוֹבָה ஒருமைத் தொகுப்புப்பொருளில் இருப்பதால் ‘எல்லா நன்மை’ என்ற கருத்து காக்கப்படுகிறது.
- source_word: עָשָׂה
  choice: செய்த
  rationale: யெத்ரோ மகிழ்ந்ததற்கு முன்பே நிகழ்ந்த யாவேயின் நன்மைச் செயலைத் தமிழ் பெயரெச்ச வடிவம் இயல்பாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைத் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிப்பெயர்க்கிறது.
- source_word: לְיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு
  rationale: לְ இங்கு இஸ்ரவேலின் நன்மைக்காகச் செய்யப்பட்ட செயலைக் குறிக்கிறது.
- source_word: אֲשֶׁר הִצִּילוֹ
  choice: அவர் இஸ்ரவேலை ... விடுவித்திருந்தார்
  rationale: ஒருமை பின்னொட்டு இஸ்ரவேலை ஒரே சமூகமாகக் குறிப்பிடுகிறது. தனி வாக்கியக்கூறாக அமைத்ததால் தமிழில் குறிப்புப் பொருள் தெளிவாகவும் மூலத்தின் உறவு காக்கப்பட்டும் உள்ளது.
- source_word: מִיַּד מִצְרָיִם
  choice: எகிப்தின் கையிலிருந்து
  rationale: எகிப்தின் அதிகாரம் அல்லது பிடியிலிருந்து மீட்டதைச் சுட்டும் எபிரெய உருவகச் சொல்லாட்சியை முதன்மை உரையில் காக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் தனிப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை ஒரு பட்டத்தையல்ல, இறைத் தனிப்பெயரையே பயன்படுத்துகிறது. ஆகவே அந்தத் தனிப்பெயர் தமிழில் ஒலிப்பெயர்க்கப்பட்டுள்ளது.
- issue: אֲשֶׁר הִצִּילוֹ என்பதில் ஒருமைச் சுட்டின் பொருள்
  choice: இஸ்ரவேலை ஒரே சமூகமாகக் கொண்டு ‘இஸ்ரவேலை ... விடுவித்திருந்தார்’
  alternative: ‘அவர்களை ... விடுவித்திருந்தார்’
  rationale: எபிரெய ஒருமை பின்னொட்டு இஸ்ரவேல் மக்களை ஒரு கூட்டு அலகாகச் சுட்டுகிறது; தமிழில் ‘இஸ்ரவேலை’ என்று மீண்டும் கூறுவது அந்தச் சமூக ஒருமையைப் பாதுகாத்து, சுட்டுப்பெயர் குழப்பத்தையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ‘கை’ உருவகம் உரையில் காக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; இறைத் தனிப்பெயர் ‘யாவே’ என ஒலிப்பெயர்க்கப்பட்டுள்ளது.
