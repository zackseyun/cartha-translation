  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் வடிவமைக்கப்பட்டது. நீதித்துறைச் சூழலை உரைக்குள் தேவையின்றி வெளிப்படையாகச் சேர்க்காமல், எபிரெய மூலத்தின் உட்காருதல்/நிற்றல் காட்சியும் அதன் இயல்பான நிர்வாகப் பொருளும் பாதுகாக்கப்பட்டுள்ளன.
