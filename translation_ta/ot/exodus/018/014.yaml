base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/014.yaml
  text: When Moses's father-in-law saw all that he was doing for the people[a], he said, “What is this thing that you are doing for the people? Why do you sit alone[b], while all the people stand before you from morning until evening?”
translation:
  language: ta
  text: மோசேயின் மாமனார், மோசே மக்களுக்காகச் செய்துகொண்டிருந்த அனைத்தையும் கண்டபோது, “நீ மக்களுக்காகச் செய்துகொண்டிருக்கிற இந்தச் செயல் என்ன?[a] நீ மட்டும் தனியாக உட்கார்ந்துகொண்டு, மக்கள் அனைவரும் காலையிலிருந்து மாலைவரை உனக்கு முன்பாக நின்றுகொண்டிருக்கிறாய் ஏன்?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ மக்களுக்காகச் செய்துகொண்டிருக்கிற இந்தக் காரியம் என்ன?”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹתֵן מֹשֶׁה
  choice: மோசேயின் மாமனார்
  rationale: חֹתֵן என்பது திருமண உறவால் ஏற்பட்ட உறவினரைக் குறிக்கிறது; இச்சூழலில் மோசேயின் மனைவியின் தந்தையான எத்திரோவைக் குறிக்கிறது. ‘மாமனார்’ என்பது இயல்பான நவீனத் தமிழ் வழக்கு.
- source_word: אֵת כָּל אֲשֶׁר הוּא עֹשֶׂה
  choice: அவன் … செய்துகொண்டிருந்த அனைத்தையும்
  rationale: எபிரெயப் பங்கேற்புவினை மோசேயின் தொடர்ச்சியான செயலைக் காட்டுவதால், ‘செய்துகொண்டிருந்த’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: לָעָם
  choice: மக்களுக்காக
  rationale: ל இங்கு மோசே மக்களின் சார்பாகவும் நன்மைக்காகவும் செய்த சேவையைக் குறிக்கிறது; ‘மக்களுக்காக’ என்பது அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: מָה הַדָּבָר הַזֶּה
  choice: இந்தச் செயல் என்ன?
  rationale: דָּבָר என்பதற்கு ‘காரியம்’, ‘விஷயம்’, ‘செயல்’ போன்ற பொருள்கள் உண்டு. இங்கு எத்திரோ மோசேயின் நடைமுறையைக் கேள்விக்குட்படுத்துவதால் ‘செயல்’ இயல்பாகப் பொருந்துகிறது; சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אַתָּה יוֹשֵׁב לְבַדֶּךָ
  choice: நீ மட்டும் தனியாக உட்கார்ந்திருக்க
  rationale: ישב உட்காருவதையும், இச்சூழலில் நியாயம் விசாரிக்க அமர்ந்திருப்பதையும் உணர்த்தலாம். மொழிபெயர்ப்பு இந்த இரு சாத்தியங்களையும் தீர்மானிக்காமல் வைத்திருக்கிறது.
- source_word: וְכָל הָעָם נִצָּב עָלֶיךָ
  choice: மக்கள் அனைவரும் … உனக்கு முன்பாக நின்றுகொண்டிருப்பது
  rationale: נצב என்பது ‘நில்’ என்றும், עַל இச்சூழலில் அதிகாரமுள்ள ஒருவருக்கு முன்பாகக் காத்து நிற்பதைக் குறிக்கும் மரபுத்தொடராகவும் உள்ளது. ‘உனக்கு முன்பாக’ என்பது காட்சியைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: מִן בֹּקֶר עַד עָרֶב
  choice: காலையிலிருந்து மாலைவரை
  rationale: முழு நாளின் நீடிப்பைக் குறிக்கும் நேரக் கூறை நவீனத் தமிழில் நேரடியாகத் தருகிறது.
