revisions:
- from: நீ இதைச் செய்து[a], கடவுளும் உனக்கு இப்படியே கட்டளையிட்டால், நீ நிலைத்திருக்க முடியும்[b]; இந்த மக்கள் அனைவரும் தங்கள் இடத்திற்குச் சமாதானத்துடன் செல்வார்கள்[c].
