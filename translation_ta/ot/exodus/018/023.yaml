base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/023.yaml
  text: If you do this thing[a], and God so commands you, then you will be able to endure[d][c][b], and all this people also will go to their place in peace.
translation:
  language: ta
  text: நீ இதைச் செய்து[a], கடவுள் உனக்கு அவ்வாறே கட்டளையிட்டால், நீ நிலைத்திருக்க முடியும்[b]; இந்த மக்கள் அனைவரும் தத்தம் இடங்களுக்குச் சமாதானத்துடன் செல்வார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்தக் காரியத்தை’ அல்லது ‘இந்தத் திட்டத்தை.’
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்படி, ‘நிற்க முடியும்’; இங்கு சுமையைத் தாங்கி நிலைத்திருப்பது என்பது பொருள்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயில் ஒருமையாக, ‘இந்த மக்கள் அனைவரும் தன் இடத்துக்கு வருவான்’ என்று உள்ளது. கூட்டுப்பெயர் பகிர்ந்தளிக்கும் பொருளில் பயன்படுத்தப்பட்டுள்ளதால், ஒவ்வொருவரும் தத்தம் இடத்திற்குச் சமாதானத்துடன் செல்வார்கள் என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: இதை
  rationale: דָּבָר என்பது ‘காரியம்’, ‘விஷயம்’, ‘திட்டம்’ எனப் பொருள்படலாம். இங்கு முன்பு கூறப்பட்ட ஏற்பாட்டைக் குறிக்கும் இயல்பான தமிழ்ச் சுட்டுப்பெயராக ‘இதை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְצִוְּךָ אֱלֹהִים
  choice: கடவுளும் உனக்கு இப்படியே கட்டளையிட்டால்
  rationale: இந்தத் திட்டம் கடவுளின் கட்டளைக்கு உட்பட்டது என்ற கூடுதல் நிபந்தனையைத் தெளிவாக்குகிறது; ‘இப்படியே’ என்பது முன்மொழியப்பட்ட ஏற்பாட்டை நோக்கிச் சுட்டுகிறது.
- source_word: וְיָכָלְתָּ עֲמֹד
  choice: நீ நிலைத்திருக்க முடியும்
  rationale: עמד என்பதன் அடிப்படைப் பொருள் ‘நில்’; இச்சூழலில் சுமையைத் தாங்கி தொடர்ந்து செயல்படும் கருத்தை ‘நிலைத்திருக்க’ இயல்பாகவும் மூல உருவகத்தைப் பாதுகாக்குமாறும் தருகிறது.
- source_word: כָּל־הָעָם הַזֶּה
  choice: இந்த மக்கள் அனைவரும்
  rationale: எபிரெயில் ‘மக்கள்’ என்பது ஒருமைக் கூட்டுப்பெயராக உள்ளது. நவீனத் தமிழில் இயல்பான கூட்டுப் பொருளை ‘இந்த மக்கள் அனைவரும்’ வெளிப்படுத்துகிறது.
- source_word: עַל־מְקֹמוֹ יָבֹא
  choice: தங்கள் இடத்திற்குச் செல்வார்கள்
  rationale: சொல்லுக்கு நெருக்கமாக ‘தன் இடத்திற்கு வருவான்’ என்ற ஒருமை வடிவம் இருந்தாலும், கூட்டுப்பெயரின் பகிர்ந்தளிக்கும் பொருளை இயல்பான தமிழில் பன்மையாக வழங்குகிறது.
- source_word: בְשָׁלוֹם
  choice: சமாதானத்துடன்
  rationale: שָׁלוֹם அமைதி, நலம், பாதுகாப்பான முடிவு ஆகியவற்றை உள்ளடக்குகிறது; ‘சமாதானத்துடன்’ அதன் அகலமான பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: எத்திரோவின் ஆலோசனையும் கடவுளின் கட்டளையும் இடையிலான நிபந்தனை உறவு
  choice: ‘கடவுளும் உனக்கு இப்படியே கட்டளையிட்டால்’ என்று இரண்டாவது நிபந்தனையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கடவுள் உனக்குக் கட்டளையிடுவார்’ அல்லது ‘கடவுள் உனக்குக் கட்டளையிடுவாராக’ என்று கொள்ளலாம்.
  rationale: வாக்கிய அமைப்பில் கடவுளின் கட்டளை மோசே திட்டத்தைச் செய்வதற்கான கூடுதல் நிபந்தனையாக இருப்பது இயல்பாகத் தெரிகிறது. இதனால் எத்திரோவின் ஆலோசனை கடவுளின் அனுமதியிலிருந்து சுயாதீனமான அதிகாரம் கொண்டதாகக் காட்டப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நிலைத்திருக்க’ என்பது மூலத்தின் ‘நிற்க’ என்ற உருவகத்தையும் சூழலின் ‘தாங்கி நீடிக்க’ என்ற கருத்தையும் இணைக்கிறது. எல்லா அடிக்குறிப்புக் குறிகளும் உரையில் இடம்பெற்றுள்ளன.
