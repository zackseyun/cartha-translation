source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה לְ/חֹתְנ֑/וֹ כִּֽי יָבֹ֥א אֵלַ֛/י הָ/עָ֖ם לִ/דְרֹ֥שׁ אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/015.yaml
  text: Moses said to his father-in-law[a], “Because the people come to me to seek God.”
translation:
  language: ta
  text: மோசே தன் மாமனாரிடம், “மக்கள் கடவுளை நாடுவதற்காக[a] என்னிடம் வருகிறார்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “கடவுளிடம் விசாரிப்பதற்காக,” அல்லது “கடவுளிடமிருந்து தீர்ப்பு நாடுவதற்காக.” எபிரேயச் சொற்றொடர், வழிகாட்டுதல் அல்லது தீர்ப்புக்காகக் கடவுளிடம் ஆலோசனை கேட்பதையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: אמר என்பதன் வழக்கமான இறந்தகால உரையாடல் வடிவம்; தமிழில் மேற்கோளுக்குப் பின் ‘என்றார்’ இயல்பாக உள்ளது.
- source_word: לְחֹתְנוֹ
  choice: தன் மாமனாரிடம்
  rationale: இச்சூழலில் חֹתֵן மோசேயின் மனைவியின் தந்தையான எத்திரோவைக் குறிக்கிறது; ‘மாமனார்’ நவீன தமிழின் தெளிவான உறவுமுறைச் சொல்.
- source_word: כִּי
  choice: -வதற்காக
  rationale: எத்திரோவின் கேள்விக்கான காரணத்தை இங்கு כִּי அறிமுகப்படுத்துகிறது. தமிழில் நோக்கத்தையும் வருகைக்கான காரணத்தையும் இயல்பாக வெளிப்படுத்த இவ்வமைப்பு ஏற்றது.
- source_word: יָבֹא אֵלַי הָעָם
  choice: மக்கள் என்னிடம் வருகிறார்கள்
  rationale: בוא + אֶל மோசேயை நோக்கி வருவதைக் குறிக்கிறது; தொடர்ச்சியாக நடைபெறும் செயலை நவீன தமிழ் நிகழ்காலம் இயல்பாகக் காட்டுகிறது.
- source_word: לִדְרֹשׁ
  choice: நாடுவதற்காக
  rationale: דרש என்பது தேடுதல், விசாரித்தறிதல், ஆலோசனை அல்லது தீர்ப்பு நாடுதல் ஆகிய பொருள் வரம்புகளைக் கொண்டது. ‘நாடுதல்’ இந்தப் பரப்பைச் சுருக்காமல் இயல்பாகப் பாதுகாக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுளை
  rationale: எபிரெய உரையில் நேரடியாக ‘கடவுள்’ என்பதே செயப்படுபொருள்; ‘கடவுளின் சித்தம்’ அல்லது ‘தெய்வீகத் தீர்ப்பு’ என்று விளக்கிப் பொருள் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: לִדְרֹשׁ אֱלֹהִים என்ற சொற்றொடரின் பொருள்
  choice: கடவுளை நாடுவதற்காக
  alternative: கடவுளிடம் விசாரிப்பதற்காக; கடவுளிடமிருந்து தீர்ப்பு நாடுவதற்காக
  rationale: இந்த எபிரெயச் சொற்றொடர் பொதுவாகக் கடவுளை நாடுவதையும், இச்சச்சரவு-தீர்ப்பு சூழலில் அவரிடம் வழிகாட்டுதல் அல்லது தீர்ப்பு விசாரிப்பதையும் குறிக்கலாம். முதன்மை உரை பரந்த பொருளைத் தக்கவைத்து, குறிப்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘நாடுதல்’ என்ற சொல் பக்தி சார்ந்த தேடலுக்கும் வழிகாட்டல் அல்லது தீர்ப்பு கேட்டலுக்கும் இடையிலான மூலமொழியின் பொருள் நெகிழ்வைத் தக்கவைக்கிறது.
