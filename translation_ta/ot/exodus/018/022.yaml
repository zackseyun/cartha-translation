translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நீதி வழங்கட்டும்’, ‘விவகாரம்’, ‘இலகுவாக்கு’ ஆகிய சொற்கள் சட்டச் சூழலைத் தெளிவாகக் காட்டினாலும் மிகைச் சட்டவியல் நடையைத் தவிர்க்கின்றன. ஒருமை இரண்டாம் நபர் வடிவங்கள் (‘உன்னிடம்’, ‘உன்’) மோசேயை நோக்கிய நேரடி உரையைப் பாதுகாக்கின்றன.
