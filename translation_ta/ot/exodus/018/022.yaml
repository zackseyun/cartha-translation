base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/022.yaml
  text: And let them judge the people at all times[a]. Then every great matter they shall bring to you, but every small matter they themselves shall judge. So make it lighter for yourself[b], and they will bear the burden with you.
translation:
  language: ta
  text: அவர்கள் எல்லா நேரங்களிலும் மக்களுக்கு நீதி வழங்கட்டும். ஒவ்வொரு பெரிய விவகாரத்தையும் உன்னிடம் கொண்டுவரட்டும்; ஒவ்வொரு சிறிய விவகாரத்தையும் அவர்களே தீர்க்கட்டும்.[a] இவ்வாறு உன் சுமையைக் குறைத்துக்கொள்[b]; அவர்களும் உன்னோடு சேர்ந்து அதைச் சுமப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முக்கியமான வழக்கு ஒவ்வொன்றையும் ... சிறிய வழக்கு ஒவ்வொன்றையும்.’ தீர்ப்புக்காகக் கொண்டுவரப்படும் விவகாரங்களை எபிரெய மொழி ‘பெரிய’, ‘சிறிய’ என்று குறிப்பிடுகிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘சுமை’ என்பது மக்களுக்கு நீதி வழங்கும் பொறுப்பைக் குறிக்கிறது; ‘சுமை’ என்ற சொல் எபிரெய மூலத்தில் வெளிப்படையாக இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: அவர்கள் மக்களுக்கு நீதி வழங்கட்டும்
  rationale: שׁפט என்பது இச்சூழலில் மக்களின் வழக்குகளை விசாரித்து நீதி வழங்குவதைக் குறிக்கிறது. எத்திரோ அறிவுரை கூறுவதால், தமிழில் ‘வழங்கட்டும்’ என்ற ஏவல் நயம் பொருத்தமானது.
- source_word: בְּכָל־עֵת
  choice: எல்லா நேரங்களிலும்
  rationale: எபிரெயச் சொற்றொடரின் பொதுவான காலப் பொருளை நேரடியாகப் பாதுகாக்கிறது; ‘தேவைப்படும் போதெல்லாம்’ என்பது சாத்தியமானாலும் அதிக விளக்கவுரையாகும்.
- source_word: כָּל־הַדָּבָר הַגָּדֹל
  choice: பெரிய விவகாரம் ஒவ்வொன்றையும்
  rationale: דבר இங்கு தீர்ப்புக்காக முன்வைக்கப்படும் விவகாரத்தைக் குறிக்கிறது. ‘பெரிய’ என்பது எபிரெய மூலத்தின் உருவக எதிரிணையைப் பாதுகாக்கிறது.
- source_word: יָבִיאוּ אֵלֶיךָ
  choice: உன்னிடம் கொண்டுவரட்டும்
  rationale: விவகாரங்களை மோசேயின் தீர்ப்புக்காக அவரிடம் கொண்டுவருதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: כָּל־הַדָּבָר הַקָּטֹן יִשְׁפְּטוּ הֵם
  choice: சிறிய விவகாரம் ஒவ்வொன்றையும் அவர்களே தீர்க்கட்டும்
  rationale: ‘சிறிய’ என்பது ‘பெரிய’ என்பதற்கான மூலமொழி எதிரிணையைப் பாதுகாக்கிறது. הֵם தரும் வலியுறுத்தலை ‘அவர்களே’ வெளிப்படுத்துகிறது.
- source_word: וְהָקֵל מֵעָלֶיךָ
  choice: இவ்வாறு உன் சுமையை இலகுவாக்கு
  rationale: הָקֵל என்பது முன்னிலைக் கட்டளையாக இருப்பதால் ‘இலகுவாக்கு’ என்று மொழிபெயர்க்கப்பட்டது. ‘சுமை’ என்பது சூழலில் உள்ள நீதிவழங்கும் பொறுப்பை இயல்பான தமிழில் வெளிப்படுத்தும் மறைபொருள் சேர்ப்பு.
- source_word: וְנָשְׂאוּ אִתָּךְ
  choice: அவர்களும் உன்னோடு சேர்ந்து அதைச் சுமப்பார்கள்
  rationale: נשא என்பதன் ‘சுமத்தல்/தாங்குதல்’ உருவகத்தைப் பாதுகாக்கிறது. எதைச் சுமப்பார்கள் என்பது எபிரெயத்தில் வெளிப்படையாகச் சொல்லப்படவில்லை; தமிழில் ‘அதை’ முன் குறிப்பிடப்பட்ட சுமையைச் சுட்டுகிறது.
