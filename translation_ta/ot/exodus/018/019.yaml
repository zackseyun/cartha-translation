base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/019.yaml
  text: Now listen to my voice[a]; I will advise you, and God be with you. You be for the people before God[c][b], and you shall bring the matters to God.
translation:
  language: ta
  text: இப்போது என் சொல்லைக் கேள்; நான் உனக்கு ஆலோசனை கூறுவேன். கடவுள் உன்னோடு இருப்பாராக.[a] நீ மக்களுக்காகக் கடவுளின் முன்னிலையில் இரு.[c] காரியங்களை[b] கடவுளிடம் கொண்டுவா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது ஒரு விருப்பத்தையோ ஆசீர்வாதத்தையோ வெளிப்படுத்தும் எபிரெய வடிவம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கே “காரியங்கள்” என்பது தீர்ப்புக்காகக் கொண்டுவரப்படும் மக்களின் வழக்குகள் அல்லது பிணக்குகளைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அதாவது, கடவுளின் முன்னிலையில் மக்களின் பிரதிநிதியாகச் செயல்படு.
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: இப்போது
  rationale: எத்திரோ அடுத்த அறிவுரையை அறிமுகப்படுத்தும் கால/உரையாடல் குறியீடு; நவீனத் தமிழில் இயல்பான நேரடி இணை.
- source_word: שְׁמַע בְּקֹלִי
  choice: என் சொல்லைக் கேள்
  rationale: எபிரெய மொழிமரபான ‘என் குரலைக் கேள்’ என்பதன் அறிவுரையை ஏற்கும் பொருளை இயல்பான தமிழில் தருகிறது; ‘கீழ்ப்படி’ என்று வலுப்படுத்தவில்லை.
- source_word: אִיעָצְךָ
  choice: நான் உனக்கு ஆலோசனை கூறுகிறேன்
  rationale: יעץ என்பதன் ‘ஆலோசனை கூறுதல்’ என்ற பொருளைத் தெளிவாகவும் தற்போதைய உரையாடல் சூழலுக்கேற்றவாறும் தருகிறது.
- source_word: וִיהִי אֱלֹהִים עִמָּךְ
  choice: கடவுள் உன்னோடு இருப்பாராக
  rationale: வினைவடிவின் விருப்பம்/ஆசீர்வாத நுட்பத்தைத் தமிழின் ‘இருப்பாராக’ வடிவம் நேரடியாகப் பாதுகாக்கிறது.
- source_word: הֱיֵה אַתָּה לָעָם
  choice: நீ மக்களுக்காக ... இரு
  rationale: ‘மக்களுக்காக நீ இரு’ என்ற எபிரெய கட்டமைப்பை இயல்பான தமிழில் பாதுகாக்கிறது; பிரதிநிதித்துவப் பொருளைச் சொல்லுக்குள் மிகையாகச் சேர்க்கவில்லை.
- source_word: מוּל הָאֱלֹהִים
  choice: கடவுளின் முன்னிலையில்
  rationale: מוּל என்பதன் ‘முன்/முன்னிலையில்’ என்ற உறவுப்பொருளை இச்சூழலில் இயல்பாகத் தருகிறது.
- source_word: וְהֵבֵאתָ
  choice: கொண்டுவா
  rationale: முந்தைய கட்டளைத் தொடரைத் தொடரும் அறிவுறுத்தலாக இருப்பதால் தமிழில் கட்டளை வடிவம் இயல்பானது.
- source_word: הַדְּבָרִים
  choice: அவர்களுடைய காரியங்களை
  rationale: דבר என்பதன் பரந்த பொருளைப் பாதுகாக்கிறது; நீதித்தீர்ப்புக்காக வரும் வழக்குகள்/சிக்கல்கள் என்பதைக் குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: אֶל הָאֱלֹהִים
  choice: கடவுளிடம்
  rationale: மோசே காரியங்களை எடுத்துச் செல்லும் இலக்கைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: மெய்யான கடவுள்
  rationale: இச்சூழலில் இஸ்ரவேலின் கடவுளையே ஒருமைப் பொருளில் குறிக்கிறது; தேவையற்ற விளக்கச் சேர்க்கையின்றி ‘கடவுள்’ போதுமானது.
- issue: மோசேயின் இடைநிலை/பிரதிநிதித்துவப் பங்கு
  choice: நீ மக்களுக்காகக் கடவுளின் முன்னிலையில் இரு
  alternative: நீ கடவுளின் முன்னிலையில் மக்களின் பிரதிநிதியாக இரு
  rationale: மூலத்தின் திறந்த கட்டமைப்பையும் இறையியல் நுட்பத்தையும் பாதுகாக்கிறது; பிரதிநிதித்துவப் பொருள் சாத்தியமான விளக்கமாக அடிக்குறிப்பில் தரப்படுகிறது.
- issue: וִיהִי வடிவத்தின் விருப்ப அல்லது ஆசீர்வாத நுட்பம்
  choice: கடவுள் உன்னோடு இருப்பாராக
  alternative: கடவுள் உன்னோடு இருப்பார்
  rationale: இது வெறும் எதிர்கால அறிவிப்பைக் காட்டிலும் விருப்பம் அல்லது ஆசீர்வாதத்தை வெளிப்படுத்தும் வடிவம் என்பதால் ‘இருப்பாராக’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பானதும் கண்ணியமானதுமான அறிவுரைத் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘என் குரலைக் கேள்’ என்ற சொற்சொல் வடிவத்திற்குப் பதிலாக இயல்பான ‘என் சொல்லைக் கேள்’ தேர்ந்தெடுக்கப்பட்டது. ‘இருப்பாராக’ ஆசீர்வாத நுட்பத்தைப் பாதுகாக்கிறது; மோசேயின் பிரதிநிதித்துவப் பங்கு முதன்மை உரையில் மிகையாக விளக்கப்படாமல் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
