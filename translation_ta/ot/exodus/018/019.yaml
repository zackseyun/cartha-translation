review_pass:
  verdict: revise
  source_fidelity: The main sense is conveyed accurately, including the jussive/blessing nuance in “கடவுள் உன்னோடு இருப்பாராக.” However, “நான் உனக்கு ஆலோசனை கூறுகிறேன்” is present-tense whereas אִיעָצְךָ is prospective (“I will advise you”), and “அவர்களுடைய காரியங்கள்” adds a possessive not expressed by הַדְּבָרִים (“the matters”).
  naturalness: The Tamil is clear, dignified, and suitable for modern standard Tamil. “நான் உனக்கு ஆலோசனை கூறுவேன்” is equally natural and more faithful to the verbal form.
  terminology: “கடவுள்,” “கடவுளின் முன்னிலையில்,” and “காரியங்கள்” are appropriate. The cultural footnote may explain the judicial context without narrowing the main text. The representative-role footnote is appropriate, but its anchor should directly follow the phrase it explains.
  issues:
