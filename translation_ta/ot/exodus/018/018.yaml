base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/018.yaml
  text: You will surely wear yourself out[a], both you and this people who are with you, because the matter is too heavy for you. You are not able to do it by yourself.
translation:
  language: ta
  text: நீயும் உன்னோடு இருக்கும் இந்த மக்களும் நிச்சயமாகக் களைத்துப்போவீர்கள்[a]. ஏனெனில், இந்தக் காரியம் உனக்கு மிகவும் பாரமானது; இதை உன்னால் தனியாகச் செய்ய முடியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிச்சயமாக முற்றிலும் சோர்ந்துபோவீர்கள்.” எபிரெயத்தில் வலியுறுத்துவதற்காக ஒரே வினை இரண்டு வடிவங்களில் மீண்டும் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבֹל תִּבֹּל
  choice: நிச்சயமாகக் களைத்துப்போவீர்கள்
  rationale: வினையின் பெயரெச்ச வடிவமும் முற்றுவினையும் அடுத்தடுத்து வருவது உறுதியையும் வலியுறுத்தலையும் குறிக்கிறது. சூழலில் மிகுதியான பணிச்சுமையால் மோசேயும் மக்களும் சோர்ந்துபோவதே எச்சரிக்கை; தமிழில் பன்மை வினை இரு தரப்பையும் இயல்பாக உள்ளடக்குகிறது.
- source_word: גַּם אַתָּה גַּם הָעָם הַזֶּה אֲשֶׁר עִמָּךְ
  choice: நீயும் உன்னோடு இருக்கும் இந்த மக்களும்
  rationale: இருமுறை வரும் גַּם, மோசேயையும் அவரோடு இருக்கும் மக்களையும் இணைத்துச் சுட்டுகிறது. ‘இந்த மக்கள்’ என்பது עָם הַזֶּה என்ற ஒருமைக் கூட்டுப்பெயரை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய எச்சரிக்கைக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: כָבֵד מִמְּךָ הַדָּבָר
  choice: இந்தக் காரியம் உனக்கு மிகவும் பாரமானது
  rationale: כָבֵד என்பதன் அடிப்படைப் பொருள் ‘பாரமானது’; இங்கு தாங்க முடியாத பணிச்சுமையை உருவகமாகக் குறிக்கிறது. דָּבָר என்பதன் பரந்த பொருளை ‘காரியம்’ தக்கவைக்கிறது; ‘மிகவும்’ என்பது ஒப்பீட்டு מִן இங்கு குறிக்கும் அளவுமீறிய சுமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא תוּכַל עֲשֹׂהוּ
  choice: இதை உன்னால் செய்ய முடியாது
  rationale: மூலத்தின் இயலாமையையும் עשה என்ற பொதுவான வினையின் பரந்த தன்மையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: לְבַדֶּךָ
  choice: தனியாக
  rationale: மோசே இந்தக் காரியத்தை வேறு உதவியின்றி ஒருவராகச் செய்ய இயலாது என்பதைக் குறிக்கிறது.
