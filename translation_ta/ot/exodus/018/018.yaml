  register: நவீனத் தரமான, கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமையில் மோசேயை நோக்கித் தொடங்கும் எச்சரிக்கை, மோசேயும் மக்களும் என்ற இணை எழுவாயால் தமிழில் இயல்பாகப் பன்மை வினையுடன் வழங்கப்பட்டுள்ளது. ‘பாரமானது’ என்ற உருவகம் மூலத்தின் சொல்லாட்சியைப் பாதுகாக்கிறது.
