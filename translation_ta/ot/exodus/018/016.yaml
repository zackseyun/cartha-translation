  text: כִּֽי יִהְיֶ֨ה לָ/הֶ֤ם דָּבָר֙ בָּ֣א אֵלַ֔/י וְ/שָׁ֣פַטְתִּ֔י בֵּ֥ין אִ֖ישׁ וּ/בֵ֣ין רֵעֵ֑/הוּ וְ/הוֹדַעְתִּ֛י אֶת חֻקֵּ֥י הָ/אֱלֹהִ֖ים וְ/אֶת תּוֹרֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/016.yaml
  text: When they have a matter[a], it comes to me, and I judge between a man and his neighbor[c][b], and I make known the statutes of God and his laws.
translation:
  language: ta
  text: அவர்களுக்கு ஒரு விவகாரம்[a] ஏற்படும்போது, அது என்னிடம் வருகிறது; நான் ஒருவனுக்கும் அவனுடைய அயலானுக்கும்[c] இடையே தீர்ப்பளித்து, கடவுளின் கட்டளைகளையும் அவருடைய சட்டங்களையும்[b] அவர்களுக்குத் தெரியப்படுத்துகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு வழக்கு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவருடைய அறிவுறுத்தல்களையும்.” எபிரெயச் சொல் பொதுவாக அறிவுறுத்தல் அல்லது போதனை என்பதையும் குறிக்கலாம்; இங்கு அது சட்டச் சூழலில் வருகிறது.
    reason: lexical_alternative
  - marker: c
    text: “ஒருவனுக்கும் அவனுடைய அயலானுக்கும்” என்பது எபிரெயத்தில் வரும் பிரதிநிதித்துவ ஒருமைச் சொல்லாட்சி.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יִהְיֶה לָהֶם דָּבָר
  choice: அவர்களுக்கு ஒரு விவகாரம் ஏற்படும்போது
  rationale: כִּי இங்கு நிபந்தனை-காலச் சூழலை அறிமுகப்படுத்துகிறது; דָּבָר நீதித்துறைச் சூழலில் விவகாரம் அல்லது வழக்கு எனப் பொருள்படலாம். ‘விவகாரம்’ அதன் பொருள் அகலத்தை ஓரளவு காக்கிறது.
- source_word: בָּא אֵלַי
  choice: அது என்னிடம் வருகிறது
  rationale: בָּא ஆண்பால் ஒருமை வினை; அருகிலுள்ள דָּבָר (‘விவகாரம்’) எழுவாயாக இருப்பதை இந்த மொழிபெயர்ப்பு பிரதிபலிக்கிறது.
- source_word: וְשָׁפַטְתִּי
  choice: நான் ... தீர்ப்பளித்து
  rationale: שׁפט இங்கு இரு தரப்பினருக்கிடையே நீதிமுறைத் தீர்ப்பை வழங்குவதைக் குறிக்கிறது; ‘தீர்ப்பளி’ நவீன தமிழில் தெளிவான சட்டவழக்குச் சொல்.
- source_word: בֵּין אִישׁ וּבֵין רֵעֵהוּ
  choice: ஒருவனுக்கும் அவனுடைய அயலானுக்கும் இடையே
  rationale: எபிரெய மூலத்தின் ஆண்பால் ஒருமை பிரதிநிதித்துவத் தொடரைத் தமிழில் இயல்பாகவும் வடிவத்துக்கு நெருக்கமாகவும் காக்கிறது.
- source_word: וְהוֹדַעְתִּי
  choice: அவர்களுக்குத் தெரியப்படுத்துகிறேன்
  rationale: ידע என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளை ‘தெரியப்படுத்து’ நேரடியாகக் காட்டுகிறது; பெறுநரான மக்களைத் தமிழின் தெளிவுக்காக வெளிப்படுத்துகிறது.
- source_word: חֻקֵּי הָאֱלֹהִים
  choice: கடவுளின் கட்டளைகள்
  rationale: חֹק என்பது நிர்ணயிக்கப்பட்ட விதி, கட்டளை, சட்டம் ஆகியவற்றைக் குறிக்கலாம். அடுத்துள்ள תּוֹרֹתָיו என்பதற்கு ‘சட்டங்கள்’ பயன்படுத்தப்படுவதால், இங்கு ‘கட்டளைகள்’ இணைப்பொருள்களை வேறுபடுத்துகிறது.
- source_word: תּוֹרֹתָיו
  choice: அவருடைய சட்டங்கள்
  rationale: תּוֹרָה அடிப்படையில் போதனை அல்லது அறிவுறுத்தல் என அகலமாகப் பொருள்பட்டாலும், தீர்ப்பளிக்கும் இச்சூழலில் அதன் நெறிப்படுத்தும் சட்டவலிமையை ‘சட்டங்கள்’ இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: אִישׁ ... רֵעֵהוּ என்ற ஆண்பால் பிரதிநிதித்துவ மொழிநடை
  choice: ஒருவனுக்கும் அவனுடைய அயலானுக்கும்
  alternative: ஒருவருக்கும் மற்றொருவருக்கும்
  rationale: மூலம் இலக்கண ரீதியாக ஆண்பால் ஒருமையைப் பயன்படுத்துகிறது. அதை பால்நடுநிலையாக்காமல் காக்கும் அதேவேளையில், இது பிரதிநிதித்துவச் சட்ட மொழிநடை என்பதை அடிக்குறிப்பு விளக்குகிறது.
- issue: תּוֹרֹתָיו என்பதன் சட்ட/அறிவுறுத்தல் பொருள்
  choice: அவருடைய சட்டங்கள்
  alternative: அவருடைய அறிவுறுத்தல்கள்
  rationale: சொல்லுக்கு அகன்ற ‘அறிவுறுத்தல்கள்’ என்ற பொருள் இருந்தாலும், உடனடிச் சூழல் வழக்குத் தீர்ப்பையும் ஒழுங்குவிதிகளையும் பற்றியது. ஆகவே ‘சட்டங்கள்’ முதன்மை உரையில் பொருத்தமானது; அகன்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: בָּא என்பதன் ஒருமை எழுவாய்
  choice: அது என்னிடம் வருகிறது
  alternative: அவர்கள் என்னிடம் வருகிறார்கள்
  rationale: ஒருமை வினை வடிவம் முன் வரும் ‘விவகாரம்’ என்பதையே எழுவாயாகக் கொள்ள அனுமதிக்கிறது. தரப்பினர் வருவதைப் பொருளாகக் கொள்ளவும் வாய்ப்பு இருந்தாலும், மூலத்தின் இலக்கண ஒருமையை முதன்மை உரை காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுமக்களுக்கு எளிதில் புரியும் சட்டநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் ஒருமை அமைப்பும் பாலைக் குறிக்கும் பிரதிநிதித்துவச் சொல்லாட்சியும் காக்கப்பட்டுள்ளன. முதன்மை உரையில் அனைத்து [a]–[c] அடிக்குறிப்பு குறியீடுகளும் இடம்பெறுகின்றன.
