  text: וַ/יֹּאמֶר֮ יִתְרוֹ֒ בָּר֣וּךְ יְהוָ֔ה אֲשֶׁ֨ר הִצִּ֥יל אֶתְ/כֶ֛ם מִ/יַּ֥ד מִצְרַ֖יִם וּ/מִ/יַּ֣ד פַּרְעֹ֑ה אֲשֶׁ֤ר הִצִּיל֙ אֶת הָ/עָ֔ם מִ/תַּ֖חַת יַד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/010.yaml
  text: And Yitro said[a], “Blessed be Yahweh, who delivered you from the hand of the Egyptians and from the hand of Pharaoh[b], who delivered the people from under the hand of the Egyptians.”
translation:
  language: ta
  text: 'அப்போது யித்ரோ கூறினார்: “எகிப்தின் கையிலிருந்தும் பார்வோனின் கையிலிருந்தும் உங்களை விடுவித்து, எகிப்தின் கையின் கீழிருந்தும்[b] மக்களை விடுவித்த யாவே போற்றப்படுவாராக![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவே போற்றத்தக்கவர்” என்றும் மொழிபெயர்க்கலாம். எபிரேயத் துதிச் சூத்திரம் ஒரு உண்மையை அறிவிப்பதாகவும், அவர் போற்றப்பட வேண்டும் என்ற வாழ்த்தாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “எகிப்தின் அதிகாரத்தின் கீழிருந்து” என்பது பொருள். “கை” என்பது அதிகாரத்தையோ ஒடுக்குமுறைக் கட்டுப்பாட்டையோ குறிக்கும் எபிரேய உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... கூறினார்
  rationale: தொடர்கதை வரிசையைச் சுட்டும் வாவ் வடிவத்தை இயல்பான நவீனத் தமிழில் ‘அப்போது’ எனக் காட்டுகிறது; தேவையற்ற கால நுணுக்கத்தைச் சேர்ப்பதில்லை.
- source_word: יִתְרוֹ
  choice: யித்ரோ
  rationale: எபிரேயப் பெயரின் ஒலிவடிவத்தைத் தமிழில் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: בָּרוּךְ יְהוָה
  choice: யாவே போற்றப்படுவாராக
  rationale: எபிரேய ஆசீர்வாத/துதிச் சூத்திரத்தின் வழிபாட்டு வலிமையை இயல்பான தமிழில் தருகிறது; அதன் இலக்கண நெகிழ்வை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்ற இறைப் பெயரை ஒரு பொதுப்பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: הִצִּיל
  choice: விடுவித்த
  rationale: பகைமைமிக்க அதிகாரத்திலிருந்து தப்பச் செய்தல் என்ற ஹிஃபில் வினையின் பொருளை யாத்திராகமச் சூழலில் தெளிவாகத் தருகிறது.
- source_word: אֶתְכֶם
  choice: உங்களை
  rationale: இரண்டாம் நபர் ஆண்பால் பன்மைச் சுட்டுப்பெயரை இயல்பான தமிழில் தருகிறது.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரேய உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் காக்கிறது.
- source_word: מִצְרַיִם
  choice: எகிப்தியர்கள்
  rationale: இந்த ‘கை’ உருவகச் சூழலில் இடப்பெயரை விட மக்களைக் குறிக்கும் கூட்டுப்பொருள் இயல்பாக உள்ளது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரசருக்கான பட்டத்தின் நிலைபெற்ற தமிழ் வடிவம்.
- source_word: הָעָם
  choice: மக்கள்
  rationale: இங்கு இஸ்ரவேல் சமூகத்தை ஒட்டுமொத்தமாகக் குறிக்கிறது.
- source_word: מִתַּחַת יַד
  choice: கைக்குக் கீழிருந்து
  rationale: எகிப்திய ஒடுக்குமுறை அதிகாரத்திற்குக் கீழ்ப்பட்டிருந்த நிலையைச் சித்தரிக்கும் மூல உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, நான்கெழுத்து இறைப் பெயரே உள்ளது; எனவே தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒலிபெயர்த்து வழங்குகிறது.
- issue: בָּרוּךְ יְהוָה என்ற துதிச் சூத்திரத்தின் வாக்கிய வலிமை
  choice: யாவே போற்றப்படுவாராக
  alternative: யாவே போற்றத்தக்கவர்
  rationale: முதன்மை உரை துதிப்பூர்வமான வாழ்த்தை இயல்பாக வெளிப்படுத்துகிறது; எபிரேயப் பங்கேற்பு வடிவம் நிலைமையையும் வாழ்த்தையும் அனுமதிப்பதால் மாற்றுவாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் அதேவேளையில் துதிப்பூர்வமான கண்ணியமான நடை. ‘கை’ என்ற மூல உருவகம் இரு இடங்களிலும் காக்கப்பட்டுள்ளது; இரண்டாவது இடத்தின் தீவிரமான கீழ்ப்படிதல் அடிக்குறிப்பால் விளக்கப்பட்டுள்ளது.
