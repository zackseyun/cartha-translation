  text: וַ/יְסַפֵּ֤ר מֹשֶׁה֙ לְ/חֹ֣תְנ֔/וֹ אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/פַרְעֹ֣ה וּ/לְ/מִצְרַ֔יִם עַ֖ל אוֹדֹ֣ת יִשְׂרָאֵ֑ל אֵ֤ת כָּל הַ/תְּלָאָה֙ אֲשֶׁ֣ר מְצָאָ֣תַ/ם בַּ/דֶּ֔רֶךְ וַ/יַּצִּלֵ֖/ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/008.yaml
  text: Moses told his father-in-law all that Yahweh had done to Pharaoh and to Egypt for Israel’s sake[a], all the hardship that had come upon them on the way[b], and how Yahweh had delivered them.
translation:
  language: ta
  text: மோசே தன் மாமனாரிடம், இஸ்ரவேலருக்காக[a] யாவே பார்வோனுக்கும் எகிப்துக்கும் செய்த அனைத்தையும், வழியில் அவர்களுக்கு நேரிட்ட எல்லாத் துன்பங்களையும்[b], யாவே அவர்களை எவ்வாறு விடுவித்தார் என்பதையும் விவரித்துச் சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலின் காரணமாக’ / ‘இஸ்ரவேலை முன்னிட்டு.’
    reason: lexical_alternative
  - marker: b
    text: ‘எல்லாத் துன்பங்களையும்’ என்பதற்கு, ‘எல்லாத் தொல்லைகளையும்’ அல்லது ‘எல்லாக் கடினநிலைகளையும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: விவரித்துச் சொன்னார்
  rationale: פיעל வடிவிலுள்ள ספר நிகழ்ந்தவற்றை எடுத்துரைத்தல் அல்லது விவரித்துச் சொல்லுதல் எனப் பொருள்படும்; தமிழில் இயல்பாகவும் அதன் விரிவான அறிக்கையிடும் நுணுக்கத்துடனும் தரப்பட்டுள்ளது.
- source_word: חֹתְנוֹ
  choice: தன் மாமனாரிடம்
  rationale: சூழலில் இச்சொல் மோசேயின் மாமனாரான எத்திரோவைக் குறிக்கிறது; நவீன தமிழில் உறவைத் தெளிவாகக் காட்டும் இயல்பான சொல் இதுவே.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה יְהוָה לְפַרְעֹה וּלְמִצְרַיִם
  choice: யாவே பார்வோனுக்கும் எகிப்துக்கும் செய்த அனைத்தையும்
  rationale: לְ முன்னிடைச்சொல்லை ‘எதிராக’ என்று விளக்கமாகக் கூர்மைப்படுத்தாமல், மூலத்தின் திறந்த அமைப்பைப் பேணும் வகையில் ‘-க்கும்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் பரவலான ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: עַל אֹדוֹת יִשְׂרָאֵל
  choice: இஸ்ரவேலருக்காக
  rationale: இந்தச் சொற்றொடர் இஸ்ரவேலை முன்னிட்ட காரணம் அல்லது நலன் என்ற நுணுக்கத்தைக் கொண்டது; ‘இஸ்ரவேலருக்காக’ என்பது இயல்பான தமிழ், மாற்று காரணவியல் வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַתְּלָאָה
  choice: எல்லாத் துன்பங்களையும்
  rationale: ஒருமை வடிவிலுள்ள பெயர்ச்சொல் கூட்டுப்பொருளில் பயணத்தின்போது அனுபவித்த தொல்லை, கடினநிலை, துன்பம் ஆகியவற்றைக் குறிக்கிறது; தமிழில் ‘எல்லா’ என்பதுடன் பன்மை இயல்பாக உள்ளது.
- source_word: מְצָאָתַם
  choice: அவர்களுக்கு நேரிட்ட
  rationale: சொல்லுக்குச் சொல் ‘அவர்களைக் கண்டடைந்த’ என்ற உருவகத்தைத் தமிழ் இயல்புக்கேற்ப ‘நேரிட்ட’ என வழங்குகிறது; துன்பம் அவர்களை வந்தடைந்த பொருள் பாதுகாக்கப்படுகிறது.
- source_word: בַּדֶּרֶךְ
  choice: வழியில்
  rationale: எகிப்திலிருந்து புறப்பட்ட பின் மேற்கொண்ட பயணப் பாதையைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: וַיַּצִּלֵם
  choice: அவர்களை எவ்வாறு விடுவித்தார்
  rationale: נצל ஆபத்திலிருந்து மீட்டல் அல்லது விடுவித்தலைக் குறிக்கிறது; ‘விடுவித்தார்’ இச்சூழலுக்கு ஏற்றது, மேலும் வாக்கியத்தின் அறிக்கை அமைப்பை ‘எவ்வாறு’ தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட திருநாமம் நேரடியாக உள்ளது. அதை பொதுப் பட்டமான ‘கர்த்தர்’ என மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பேணுகிறது; ‘யாவே’ என்பது எபிரெயப் பெயரின் பரவலாக ஏற்கப்பட்ட மறுஉச்சரிப்பைத் தமிழில் காட்டுகிறது.
- issue: עַל אֹדוֹת יִשְׂרָאֵל என்பதன் காரண/நலன் நுணுக்கம்
  choice: இஸ்ரவேலருக்காக
  alternative: இஸ்ரவேலின் காரணமாக
  rationale: சொற்றொடர் இஸ்ரவேலை முன்னிட்டு அல்லது அவர்களுடைய நலனுக்காக யாவே செயல்பட்டார் என்ற இரு தொடர்புடைய நுணுக்கங்களையும் அனுமதிக்கிறது. முதன்மை உரை இயல்பான நலன் சார்ந்த வாசிப்பைத் தருகிறது; காரணவியல் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பார்வோன்’, ‘இஸ்ரவேலர்’, ‘யாவே’ ஆகிய வடிவங்கள் பெயர்களின் தெளிவையும் வாசிப்பின் இயல்பையும் பேணுகின்றன; தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
