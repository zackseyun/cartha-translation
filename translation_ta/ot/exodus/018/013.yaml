  text: And it happened on the next day that Moses sat to judge the people[a], and the people stood before Moses from morning until evening.
translation:
  language: ta
  text: மறுநாள் மோசே மக்களுக்கு நீதி வழங்க அமர்ந்தார்; மக்களோ காலையிலிருந்து மாலைவரை மோசேயின் முன்[a] நின்றுகொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மோசேயைச் சுற்றி.’ எபிரெய முன்னிடைச்சொல்லுக்கு இவ்வாசிப்பும் சாத்தியம்; ஆனால் இச்சூழலில் மக்கள் தீர்ப்புக்காக அவர் முன் காத்திருந்தார்கள் என்பதே பொருத்தமான கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: மறுநாள்
  rationale: எபிரெயக் கதைத் தொடரில் அடுத்த நிகழ்வு அடுத்த நாளில் நடந்ததை இயல்பான நவீனத் தமிழில் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: וַיֵּשֶׁב
  choice: அமர்ந்தார்
  rationale: ישב என்பதன் நேரடியான அமர்தல் என்ற உருவகத்தைத் தக்கவைத்து, நீதித்தீர்ப்பு வழங்கும் அதிகாரப்பூர்வ நிலையையும் சூழல் தெளிவாக்க அனுமதிக்கிறது.
- source_word: לִשְׁפֹּט אֶת־הָעָם
  choice: மக்களுக்கு நீதி வழங்க
  rationale: שפט இங்கு மக்களின் வழக்குகளைக் கேட்டு தீர்ப்பளிப்பதைக் குறிக்கிறது. 'நீதி வழங்க' என்பது வெறும் கண்டனம் என்ற தவறான எண்ணத்தைத் தவிர்த்து நீதித்துறைச் செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיַּעֲמֹד הָעָם
  choice: மக்களோ ... நின்றுகொண்டிருந்தார்கள்
  rationale: עמד என்பதன் 'நில்' என்ற அடிப்படைப் பொருளையும், நீண்ட நேரம் காத்திருந்த தொடர்நிலையையும் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: עַל מֹשֶׁה
  choice: மோசேயின் முன்
  rationale: על என்பதன் வழக்கமான நேரடிப் பொருள் 'மேல்' என்றாலும், עמד உடன் இச்சூழலில் மோசேயிடம் தீர்ப்புக்காக வந்து காத்திருந்த நிலையை 'முன்' தெளிவாகக் காட்டுகிறது; உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִן הַבֹּקֶר עַד הָעָרֶב
  choice: காலையிலிருந்து மாலைவரை
  rationale: நாள் முழுவதும் நீடித்த கால அளவை இயல்பான நவீனத் தமிழில் நேரடியாகப் பாதுகாக்கிறது.
