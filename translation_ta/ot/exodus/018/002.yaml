  yaml_path: translation/ot/exodus/018/002.yaml
  text: Jethro[a], Moses’ father-in-law, took Zipporah, Moses’ wife, after he had sent her away.
translation:
  language: ta
  text: மோசேயின் மாமனாரான எத்திரோ, மோசேயின் மனைவி சிப்போராளை, அவள் அனுப்பிவிடப்பட்ட பின்[a] பெற்றுக்கொண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளை அனுப்பிவிட்ட பின்.” எபிரெயத்தில் சொல்லுக்குச் சொல், “அவளுடைய அனுப்பிவிடுதலுக்குப் பின்”; அவளை அனுப்பியவர் யார் என்பது வெளிப்படையாகக் கூறப்படவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: தன்னுடன் அழைத்துக்கொண்டார்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’. இச்சூழலில் எத்திரோ சிப்போராளைத் தன்னுடன் கூட்டிக்கொண்டதை இயல்பான தமிழில் தெரிவிக்கிறது; அவர் அவளைப் பராமரிப்பில் ஏற்றாரா அல்லது அழைத்து வந்தாரா என்பதைத் தேவையின்றி மிகத் துல்லியப்படுத்தவில்லை.
- source_word: חֹתֵן מֹשֶׁה
  choice: மோசேயின் மாமனார்
  rationale: திருமண உறவினைக் குறிக்கும் חֹתֵן இங்கு எத்திரோவை மோசேயின் மனைவியின் தந்தையாக அடையாளப்படுத்துகிறது; நவீனத் தமிழில் ‘மாமனார்’ இயல்பான சொல்.
- source_word: צִפֹּרָה
  choice: சிப்போராள்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவத்துக்கு அண்மையாக ஒலிபெயர்க்கிறது.
- source_word: אֵשֶׁת מֹשֶׁה
  choice: மோசேயின் மனைவி
  rationale: இணைப்புத் தொடர் சிப்போராளை மோசேயின் மனைவியாக நேரடியாக அடையாளப்படுத்துகிறது.
- source_word: אַחַר
  choice: …விட்டிருந்த
  rationale: முன்பு நிகழ்ந்த அனுப்புதலைத் தொடர்ந்து எத்திரோவின் செயல் நடந்தது என்ற காலத் தொடர்பை இயல்பான தமிழ் வினைவடிவில் தெரிவிக்கிறது.
- source_word: שִׁלּוּחֶיהָ
  choice: மோசே அனுப்பிவிட்டிருந்த
  rationale: சொல்லுக்கு நேர் பொருள் ‘அவளுடைய அனுப்பிவிடுதல்’; செய்பவர் மூலத்தில் வெளிப்படையாகக் கூறப்படவில்லை. சூழலின் அடிப்படையில் மோசே செய்பவராக முதன்மை உரையில் கொள்ளப்பட்டுள்ளார்; மூலத்தின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ‘அவளுடைய அனுப்பிவிடுதலுக்குப் பின்’ என்பதில் செய்பவர் யார்?
  choice: மோசே செய்பவர் எனக் கொண்டு ‘மோசே அனுப்பிவிட்டிருந்த’ என்று மொழிபெயர்த்தல்
  alternative: ‘அவள் அனுப்பிவைக்கப்பட்ட பின்’ அல்லது ‘அவளுடைய அனுப்பிவிடுதலுக்குப் பின்’
  rationale: எபிரெயத்தில் பெண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் கூடிய பெயர்ச்சொல் வந்துள்ளது; செய்பவர் குறிப்பிடப்படவில்லை. உடனடிச் சூழலில் மோசே மிகவும் இயல்பான மறைமுகச் செய்பவர். இருப்பினும் மூலத்தின் உண்மையான தெளிவின்மையை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘தன்னுடன் அழைத்துக்கொண்டார்’ என்பது לקח என்பதன் சூழல்சார் நுணுக்கத்தை இயல்பாகக் காட்டுகிறது. அடிக்குறி [a] தெளிவின்மை சம்பந்தப்பட்ட ‘சிப்போராளை’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
