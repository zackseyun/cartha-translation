  yaml_path: translation/ot/exodus/018/003.yaml
  text: and her two sons[a], of whom the name of the one was Gershom, for he said, “I have been a foreigner in a foreign land.”
translation:
  language: ta
  text: அவளுடைய இரண்டு மகன்களையும் அவர் அழைத்து வந்தார்; அவர்களில் ஒருவனின் பெயர் கெர்சோம். ஏனெனில் அவர், “நான் வேற்று நாட்டில் அந்நியனாக[a] இருந்தேன்” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வேற்று நாட்டில் குடியேறி வாழ்பவனாக’ அல்லது ‘பரதேசியாக’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் தன் சொந்த நாட்டில் அல்லாமல் வாழும் வெளியாளை அல்லது குடியேறி வாழ்பவரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת שְׁנֵי בָנֶיהָ
  choice: அவளுடைய இரண்டு மகன்களையும் அழைத்து வந்தார்
  rationale: וְאֵת என்பது முந்தைய வசனத்தின் வினையுடன் இணையும் நேரடி செயப்படுபொருளைக் குறிக்கிறது. தனியாக விடப்பட்டால் தமிழ் வாக்கியம் முழுமையடையாததால், முந்தைய சூழலிலிருந்து ‘அழைத்து வந்தார்’ என்பது வெளிப்படையாக வழங்கப்பட்டுள்ளது; ‘இரண்டு மகன்கள்’ ஆண்பால் குறிப்பையும் காக்கிறது.
- source_word: אֲשֶׁר שֵׁם הָאֶחָד
  choice: அவர்களில் ஒருவனின் பெயர்
  rationale: எபிரெய உரை இரு மகன்களில் ஒருவனை வேறுபடுத்திக் காட்டுகிறது; அவனை ‘முதலாவது’ என்று வரிசைப்படுத்தவில்லை. ஆகவே ‘ஒருவன்’ என்பது தேவையற்ற வரிசைப் பொருளைச் சேர்க்காது.
- source_word: גֵּרְשֹׁם
  choice: கெர்சோம்
  rationale: எபிரெய தனிப்பெயரின் ஒலிப்பை நவீனத் தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: כִּי אָמַר
  choice: ஏனெனில் அவர் ... என்று சொல்லியிருந்தார்
  rationale: כִּי பெயருக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது. மகனுக்குப் பெயரிட்ட முந்தைய நிகழ்வைச் சூழல் குறிப்பதால், தமிழில் ‘சொல்லியிருந்தார்’ இயல்பாக உள்ளது; ‘அவர்’ என்பது சூழலின்படி மோசேயைக் குறிக்கிறது.
- source_word: גֵּר
  choice: அந்நியன்
  rationale: גֵּר என்பது தன் சொந்தமல்லாத நாட்டில் வெளியாளாக அல்லது தற்காலிகக் குடியிருப்பாளராக வாழ்பவரைக் குறிக்கலாம். ‘அந்நியன்’ எளிய, dignified modern Tamil and preserves outsider status.
- source_word: הָיִיתִי
  choice: இருந்தேன்
  rationale: எபிரெய qatal வடிவின் எளிய இறந்தகாலப் பொருளை நேரடியாகக் காக்கிறது; தொடர்ந்து நீடித்த நிலை என்று கட்டாயப்படுத்துவதில்லை.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: வேற்று நாட்டில்
  rationale: ‘எனக்குச் சொந்தமல்லாத/அந்நியமான நாட்டில்’ என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; ஒரே வாக்கியத்தில் ‘அந்நிய’ என்ற சொல்லின் தேவையற்ற மறுமொழியையும் தவிர்க்கிறது.
theological_decisions:
- issue: גֵּר என்பதன் சமூக நிலை
  choice: அந்நியன்
  alternative: தற்காலிகக் குடியிருப்பாளர் / பரதேசி
  rationale: இந்தச் சொல் சட்டபூர்வ குடியிருப்பு நிலை, வெளியாள் நிலை, தற்காலிக வாழ்வு ஆகியவற்றின் நிழற்பொருள்களை ஏற்கலாம். பிரதான உரை ஒன்றை மட்டும் இறுக்கமாகத் தீர்மானிக்காமல், பொதுவான ‘அந்நியன்’ என்பதைப் பயன்படுத்தி மாற்றுப் பொருளை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வசனம் முந்தைய வாக்கியத்தின் தொடர்ச்சியாக இருப்பதால், தமிழில் முழுமையான வாக்கியமாக அமைய முந்தைய வசனத்திலிருந்து ‘அழைத்து வந்தார்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது. பெயரின் விளக்கத்தில் உள்ள ‘அந்நியன்/வேற்று நாடு’ சொல்விளையாட்டு இயன்றவரை காக்கப்பட்டுள்ளது.
