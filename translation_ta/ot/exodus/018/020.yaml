base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/020.yaml
  text: And you shall warn them about the statutes and the laws[b][a], and make known to them the way in which they must walk and the work that they must do.
translation:
  language: ta
  text: மேலும், நீ அவர்களுக்கு விதிமுறைகளையும் சட்டங்களையும்[a] குறித்து எச்சரிக்க வேண்டும்; அவர்கள் அதில் நடக்க வேண்டிய வழியையும்[b], அவர்கள் செய்ய வேண்டிய செயலையும் அவர்களுக்குத் தெரியப்படுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘சட்டங்கள்’ என்பதற்குப் பதிலாக ‘அறிவுறுத்தல்கள்’ என்றும் மொழிபெயர்க்கலாம் (எபிரெயம்: தோரொத்). இந்தச் சொல் பரந்த பொருளில் போதனைகளைக் குறிக்கக்கூடும்; இங்குள்ள சட்டச் சூழல் ‘சட்டங்கள்’ என்ற மொழிபெயர்ப்பை ஆதரிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: நேர்ச்சொல்லாக, ‘அவர்கள் அதில் நடக்க வேண்டிய வழி.’ நடத்தையைக் குறிக்கும் எபிரெய உருவகத்தைப் பாதுகாக்க ‘வழியில் நடக்க’ என்பது தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזְהַרְתָּה
  choice: எச்சரிக்க வேண்டும்
  rationale: זהר என்பதன் ஹிஃபில் வடிவம் எச்சரித்தல் அல்லது பொறுப்புணர்வுடன் அறிவுறுத்துதல் என்ற பொருளைத் தருகிறது. நீதிநிர்வாகச் சூழலில் உள்ள கடமையுணர்வை ‘எச்சரிக்க வேண்டும்’ தெளிவாகக் காட்டுகிறது.
- source_word: הַחֻקִּים
  choice: விதிமுறைகள்
  rationale: חֻקִּים என்பது நிர்ணயிக்கப்பட்ட சட்ட ஏற்பாடுகள் அல்லது விதிகளைச் சுட்டுகிறது. நவீனத் தமிழில் ‘விதிமுறைகள்’ இயல்பாகவும் சட்ட நுணுக்கத்துடனும் உள்ளது.
- source_word: הַתּוֹרֹת
  choice: சட்டங்கள்
  rationale: תּוֹרָה என்பது பரந்த பொருளில் போதனை அல்லது அறிவுறுத்தலைக் குறிக்கலாம்; ஆனால் இங்கு חֻקִּים என்பதுடன் வரும் சட்டச் சூழல் காரணமாக ‘சட்டங்கள்’ பொருத்தமானது. பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְהוֹדַעְתָּ
  choice: தெரியப்படுத்த வேண்டும்
  rationale: ידע என்பதன் ஹிஃபில் வடிவத்திலுள்ள ‘அறியச் செய்தல்’ என்ற காரணவினைப் பொருளை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: הַדֶּרֶךְ ... יֵלְכוּ בָהּ
  choice: எந்த வழியில் நடக்க வேண்டும்
  rationale: வாழ்க்கை நடத்தையைக் குறிக்கும் ‘வழி—நடத்தல்’ உருவகத்தைத் தக்கவைத்து, கட்டாயத்தைக் காட்டும் சூழல்சார் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַמַּעֲשֶׂה אֲשֶׁר יַעֲשׂוּן
  choice: எந்தச் செயலைச் செய்ய வேண்டும்
  rationale: מַעֲשֶׂה என்பது செய்யப்பட வேண்டிய செயல் அல்லது நடைமுறைக் கடமையைக் குறிக்கிறது. ‘செயல்’ என்பது இங்கு ‘வேலை’ என்பதைவிடத் தெளிவாக நடத்தையையும் கடமையையும் உள்ளடக்குகிறது.
