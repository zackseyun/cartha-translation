source:
  edition: WLC
  text: עַתָּ֣ה יָדַ֔עְתִּי כִּֽי גָד֥וֹל יְהוָ֖ה מִ/כָּל הָ/אֱלֹהִ֑ים כִּ֣י בַ/דָּבָ֔ר אֲשֶׁ֥ר זָד֖וּ עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/011.yaml
  text: Now I know that Yahweh is greater than all the gods[a], because in the matter in which they acted arrogantly against them, he was above them.
translation:
  language: ta
  text: இப்போது யாவே எல்லாத் தெய்வங்களையும்விடப் பெரியவர் என்பதை அறிந்துகொண்டேன்; ஏனெனில், அவர்கள் அவர்களுக்கு எதிராகச் செருக்குடன் நடந்துகொண்ட அதே காரியத்தில் அவர் அவர்களுக்கு மேலானவர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַתָּה יָדַעְתִּי
  choice: இப்போது ... அறிந்துகொண்டேன்
  rationale: இப்போது கிடைத்த அனுபவத்தின் விளைவாக எத்திரோ வந்தடைந்த புரிதலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: גָדוֹל ... מִכָּל
  choice: எல்லா ... விடப் பெரியவர்
  rationale: מִן உடன் வரும் גָדוֹל இங்கு ஒப்பீட்டுப் பொருள் தருவதால், தமிழின் இயல்பான ஒப்பீட்டு அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றாக இடாமல், எபிரேய இறைப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מִכָּל הָאֱלֹהִים
  choice: எல்லாத் தெய்வங்களையும்விட
  rationale: சூழலில் பிற மக்களின் தெய்வங்களோடு செய்யப்படும் ஒப்பீட்டை பன்மையில் தெளிவாகக் காக்கிறது.
- source_word: בַדָּבָר אֲשֶׁר זָדוּ
  choice: அவர்கள் ... செருக்குடன் நடந்துகொண்ட அதே காரியத்தில்
  rationale: דָּבָר என்பதன் ‘காரியம்/நிகழ்வு’ பொருளையும், זוד என்பதன் ஆணவமான செயல்பாட்டையும் காக்கிறது; ‘அதே’ என்பது தண்டனை அவர்கள் ஆணவம் காட்டிய தளத்திலேயே வெளிப்பட்டது என்ற வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: עֲלֵיהֶם
  choice: இவர்களுக்கு எதிராக ... அவர்களுக்கு மேலானவர்
  rationale: சுருக்கமான எபிரேய தொடரில் உள்ள ‘எதிராக/மேல்’ என்ற உறவையும் அதன் திட்டமிட்ட சொல் விளையாட்டையும் தமிழில் வாசிக்கத்தக்க வகையில் பிரதிபலிக்கிறது; சுட்டுப்பெயர்களின் குறிப்பை முதன்மை உரையில் பெயரிட்டு முடிவுசெய்யவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இருப்பதால், பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- issue: கடினமான இறுதித் தொடரின் பொருள்
  choice: அவர்கள் இவர்களுக்கு எதிராகச் செருக்குடன் நடந்துகொண்ட அதே காரியத்தில் அவர் அவர்களுக்கு மேலானவர் என்று விளங்கியது
  alternative: அவர்கள் இவர்களுக்கு எதிராகச் செருக்குடன் நடந்துகொண்ட அதே காரியத்தினால்
  rationale: எபிரேயத் தொடர் இலக்கண ரீதியாகச் சுருக்கமாகவும் தெளிவற்றதாகவும் உள்ளது. தேர்ந்த வடிவம் யாவேயின் மேன்மை அதே நிகழ்வில் வெளிப்பட்டது என்ற சூழல்சார் கருத்தை வாசிக்கத்தக்கதாக அளிக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் காக்கப்பட்டுள்ளன. இறுதித் தொடரின் உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
