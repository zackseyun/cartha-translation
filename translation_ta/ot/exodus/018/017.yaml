translation_notes:
  register: நவீன நிலையான தமிழில், dignified உரைநடைக்காக மோசேயை நோக்கிய ஒருமை மரியாதை வடிவமான ‘நீர்’ பயன்படுத்தப்பட்டது. மூலத்தின் மதிப்பீட்டை விளக்கமின்றி நேரடியாகப் பாதுகாக்கிறது.
