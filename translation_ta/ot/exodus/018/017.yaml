translation:
  language: ta
  text: மோசேயின் மாமனார் அவரிடம், “நீர் செய்துகொண்டிருப்பது நல்லதல்ல” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: வாவ்-தொடர்வினை கதையை முன்னெடுக்கிறது; தமிழில் நேரடி உரைக்குப் பின் ‘என்றார்’ என்பது இயல்பான உரையாடல் அறிமுகம்.
- source_word: חֹתֵן מֹשֶׁה
  choice: மோசேயின் மாமனார்
  rationale: எபிரெயக் கட்டமைப்பு மோசேயுடன் உள்ள திருமண உறவைக் குறிக்கிறது; ‘மாமனார்’ என்பது நவீனத் தமிழில் இயல்பான சமமான சொல்.
- source_word: אֵלָיו
  choice: அவரிடம்
  rationale: பிரதிப்பெயர் மோசேயைக் குறிக்கிறது. மரியாதை ஒருமையான ‘அவரிடம்’ தமிழ் உரைநடையில் இயல்பாக உள்ளது.
- source_word: לֹא טוֹב
  choice: நல்லதல்ல
  rationale: טוֹב என்பதன் பரந்த மதிப்பீட்டுப் பொருளை நேரடியாகப் பாதுகாக்கிறது; ‘சரியல்ல’ அல்லது ‘பயனற்றது’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: הַדָּבָר אֲשֶׁר אַתָּה עֹשֶׂה
  choice: நீர் செய்துகொண்டிருப்பது
  rationale: சொல்லுக்குச் சொல் ‘நீர் செய்கிற காரியம்’ எனினும், பெயர்ச்சொல்-உறவுவாக்கியத்தை இயல்பான தமிழ் தொழிற்பெயர் அமைப்பாக அளிக்கிறது. עֹשֶׂה குறிக்கும் தொடர்ச்சியான தற்போதைய செயலை ‘செய்துகொண்டிருப்பது’ வெளிப்படுத்துகிறது.
