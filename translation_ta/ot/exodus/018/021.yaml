base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/021.yaml
  text: But you shall select from all the people able men[a], those who fear God, men of truth, hating dishonest gain; and you shall appoint them over them as chiefs of thousands, chiefs of hundreds, chiefs of fifties[c][b], and chiefs of tens.
translation:
  language: ta
  text: நீயோ எல்லா மக்களிலிருந்தும் தேவனுக்குப் பயப்படுகிற, உண்மையுள்ள, அநியாயமான ஆதாயத்தை வெறுக்கிற திறனுள்ள ஆண்களை[a]த் தேர்ந்தெடு; அவர்களை அந்த மக்களின்மேல் ஆயிரம் பேருக்குத் தலைவர்களாகவும், நூறு பேருக்குத் தலைவர்களாகவும், ஐம்பது பேருக்குத் தலைவர்களாகவும், பத்துப் பேருக்குத் தலைவர்களாகவும் நியமி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வல்லமையுள்ள ஆண்கள்,” “வீரமுள்ள ஆண்கள்.” எபிரெயச் சொல் சூழலுக்கேற்ப வலிமை, திறமை, அல்லது வீரம் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶחֱזֶה
  choice: தெரிந்தெடுத்து
  rationale: חזה என்பதன் அடிப்படைப் பொருள் ‘பார்’ என்பதாக இருந்தாலும், தகுதியுள்ளவர்களை ஆராய்ந்து அடையாளம் கண்டு தேர்ந்தெடுக்கும் செயலை இச்சூழலில் குறிக்கிறது.
- source_word: מִכָּל־הָעָם
  choice: எல்லா மக்களிலிருந்தும்
  rationale: மக்கள் முழுத் தொகுதியிலிருந்து சிலரைத் தேர்ந்தெடுப்பதைக் காட்டும் பகுதிப்பொருள் இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: אַנְשֵׁי חַיִל
  choice: திறனுள்ள ஆண்கள்
  rationale: חַיִל என்பது வலிமை, திறமை, வீரம் போன்ற பொருள்களைக் கொண்டது. நீதிநிர்வாகச் சூழலில் தேவையான தகுதியையும் செயல்திறனையும் ‘திறனுள்ள’ தெளிவாகக் காட்டுகிறது; எபிரெயச் சொல்லின் ஆண்பால் வடிவமும் காக்கப்படுகிறது.
- source_word: יִרְאֵי אֱלֹהִים
  choice: தேவனுக்குப் பயப்படுகிறவர்கள்
  rationale: தேவனை மதித்து அஞ்சுவதைக் குறிக்கும் ஒழுக்கத் தகுதியை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אַנְשֵׁי אֱמֶת
  choice: உண்மையுள்ள ஆண்கள்
  rationale: எபிரெய மொழியின் ‘உண்மையின் ஆண்கள்’ என்ற வடிவத்தை இயல்பான தமிழில் வைத்துக்கொண்டு, நேர்மை மற்றும் நம்பகத்தன்மை ஆகிய பொருள் பரப்பையும் திறந்தவாறு காக்கிறது.
- source_word: שֹׂנְאֵי בָצַע
  choice: அநியாய ஆதாயத்தை வெறுக்கிறவர்கள்
  rationale: בֶּצַע இங்கு முறைகேடாக அல்லது பேராசையால் பெறப்படும் இலாபத்தைக் குறிக்கிறது. ‘அநியாய ஆதாயம்’ அதன் ஒழுக்கக்கேட்டைத் தெளிவாகத் தருகிறது; ‘லஞ்சம்’ என்று குறுகலாக்கவில்லை.
- source_word: וְשַׂמְתָּ עֲלֵהֶם
  choice: அவர்களை ... மக்கள்மேல் நியமிக்க வேண்டும்
  rationale: இரு எபிரெயப் பிரதிப்பெயர்களின் குறிப்பு தமிழில் குழப்பமின்றி வெளிப்படுமாறு, நியமிக்கப்படுபவர்களை ‘அவர்களை’ என்றும் அவர்கள் அதிகாரம் செலுத்தும் குழுவை ‘மக்கள்மேல்’ என்றும் கூறுகிறது.
- source_word: שָׂרֵי
  choice: தலைவர்களாக
  rationale: שַׂר என்பதன் நிர்வாகத் தலைமைப் பொருளைத் தருகிறது; தேவையற்ற இராணுவப் பொருளைச் சேர்க்கவில்லை.
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: ஆயிரம் பேர் ... நூறு பேர் ... ஐம்பது பேர் ... பத்துப் பேர்
  rationale: மேற்பார்வைக்கான படிநிலை மக்கள் அலகுகளைத் தமிழில் தெளிவுபடுத்த ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: தலைமைத் தகுதிகளைக் குறிக்கும் ஆண்பால் மொழி
  choice: திறனுள்ள ஆண்கள் ... உண்மையுள்ள ஆண்கள்
  alternative: திறனுள்ளவர்கள் ... நம்பத்தகுந்தவர்கள்
  rationale: மூல எபிரெயத்தில் אַנְשֵׁי என்ற ஆண்பால் பன்மைச் சொல் இரு இடங்களிலும் உள்ளது. ஆகவே அதை பாலினப் பொதுமொழியாக மாற்றாமல் மொழிபெயர்க்கப்பட்டுள்ளது; இதனால் இவ்வசனத்தைத் தாண்டிய கோட்பாட்டு முடிவு எதுவும் சேர்க்கப்படவில்லை.
- issue: ‘தேவனுக்குப் பயப்படுதல்’ என்பதன் பொருள்
  choice: தேவனுக்குப் பயப்படுகிறவர்கள்
  alternative: தேவபக்தியுள்ளவர்கள்
  rationale: ‘தேவபக்தி’ என்பது பொருளை விளக்கும் இயல்பான மாற்றாக இருந்தாலும், ירא என்ற சொல்லிலுள்ள பயபக்தி மற்றும் அஞ்சுதல் ஆகிய பதற்றத்தை நேரடியான மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட தகுதிப் பட்டியலை இடைக்கோடுகள் தெளிவுபடுத்துகின்றன. ‘ஆயிரம் பேருக்குத் தலைவர்கள்’ போன்ற வடிவம், எண்ணிக்கைகள் நிர்வாகக் குழுக்களைக் குறிப்பதை வெளிப்படுத்துகிறது.
