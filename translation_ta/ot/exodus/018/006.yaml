- from: அவன் மோசேயிடம், “உன் மாமனாகிய எத்திரோ என்னும் நான் உன்னிடம் வந்து கொண்டிருக்கிறேன்; உன் மனைவியும் அவளுடைய இரண்டு மகன்களும் அவளுடன் வருகிறார்கள்[a]” என்றான்.
  to: அவன் மோசேயிடம், “நான், உன் மாமனாரான எத்திரோ, உன்னிடம் வந்து கொண்டிருக்கிறேன்; உன் மனைவியும் அவளுடன் அவளுடைய இரண்டு மகன்களும் வருகிறார்கள்[a]” என்றான்.
  rationale: «மாமனாகிய» என்பதற்குப் பதிலாகத் தந்தைமாமனாரைத் தெளிவாகக் குறிக்கும் «மாமனாரான» பயன்படுத்தப்பட்டது. மேலும், மகன்கள் மனைவியுடன் இருப்பதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்த «அவளுடன்» அவர்களுக்கு முன் வைக்கப்பட்டது. இவை தவிர, மூலத்தின் வலியுறுத்தல், நிகழ்நிலை வருகை, மற்றும் “அவளுடைய” என்ற பெண்பால் உடைமைக்குறிப்பு அனைத்தும் பேணப்பட்டுள்ளன.
