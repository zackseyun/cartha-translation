base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/006.yaml
  text: He said to Moses[a], “I, Jethro your father-in-law, am coming to you, with your wife and her two sons with her.”
translation:
  language: ta
  text: அவன் மோசேயிடம், “நான், உன் மாமனாரான எத்திரோ, உன்னிடம் வந்து கொண்டிருக்கிறேன்; உன் மனைவியும் அவளுடன் அவளுடைய இரண்டு மகன்களும் வருகிறார்கள்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவளுடைய இரண்டு மகன்கள்.” சில மொழிபெயர்ப்புகள் இதை “உன்னுடைய இரண்டு மகன்கள்” என்று இயல்பாக்குகின்றன; ஆனால் மசோரா உரையில் மோசேயின் மனைவியைக் குறிக்கும் மூன்றாம் நபர் பெண்பால் ஒருமை உடைமை விகுதி உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: அவன் மோசேயிடம் … என்றான்
  rationale: வாவ் தொடர்கதை வடிவம் நிகழ்வை முன்னெடுக்கிறது; தமிழில் இயல்பான மேற்கோள் அமைப்புக்கேற்ப பேச்சு வினைச்சொல் இறுதியில் வைக்கப்பட்டது.
- source_word: אֲנִי חֹתֶנְךָ יִתְרוֹ
  choice: உன் மாமனாகிய எத்திரோ என்னும் நான்
  rationale: தனித்து வரும் אֲנִי தரும் வலியுறுத்தலைப் பேணுகிறது; חֹתֵן இச்சூழலில் மனைவியின் தந்தையைக் குறிக்கும் என்பதால் இயல்பான தமிழ் உறவுமுறையான ‘மாமன்’ பயன்படுத்தப்பட்டது.
- source_word: בָּא אֵלֶיךָ
  choice: உன்னிடம் வந்து கொண்டிருக்கிறேன்
  rationale: בָּא என்னும் பங்கேற்புவடிவம் நடந்துகொண்டிருக்கும் அல்லது உடனடியாக நிகழவிருக்கும் வருகையைக் காட்டுவதால் தொடர்நிலை வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְאִשְׁתְּךָ
  choice: உன் மனைவியும்
  rationale: இணைப்பிடைச்சொல்லுடன் வரும் பெயர்ச்சொல்லைத் தமிழில் இயல்பாக இணைத்து, உடன்வருவோர் பட்டியலின் முதல் உறுப்பாக அளிக்கிறது.
- source_word: וּשְׁנֵי בָנֶיהָ
  choice: அவளுடைய இரண்டு மகன்களும்
  rationale: בָנֶיהָ என்பதில் மூன்றாம் நபர் பெண்பால் ஒருமை உடைமை விகுதி தெளிவாக இருப்பதால் ‘அவளுடைய’ என்று மொழிபெயர்க்கப்பட்டது; ‘உன்னுடைய’ என ஒத்திசைக்கப்படவில்லை.
- source_word: עִמָּהּ
  choice: அவளுடன்
  rationale: மகன்கள் மோசேயின் மனைவியுடன் இருப்பதை எபிரெயம் வெளிப்படையாகக் கூறுவதால் அது தமிழிலும் பேணப்பட்டது.
