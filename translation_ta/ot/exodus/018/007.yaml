  source_fidelity: 'முக்கிய உரை எபிரெயச் செயல்வரிசையையும் பங்கேற்பாளர்களையும் துல்லியமாகக் காக்கிறது: மோசே வெளியே சென்று சந்தித்தார், தாழ்ந்து வணங்கினார், முத்தமிட்டார்; பின்னர் இருவரும் நலத்தை விசாரித்து கூடாரத்துக்குள் சென்றனர். ஆனால் அடிக்குறிப்பில் தரப்பட்டுள்ள ‘நேரடியாக’ என்ற மேற்கோள் எபிரெய அமைப்பான ‘ஒவ்வொருவரும் தம் தோழரிடம் நலனைக் குறித்து விசாரித்தனர்’ என்பதைச் சரிவரப் பிரதிபலிக்கவில்லை.'
