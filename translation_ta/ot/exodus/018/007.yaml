base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/007.yaml
  text: Moses went out to meet his father-in-law[a], bowed down, and kissed him. Then each asked the other about his welfare, and they went into the tent.
translation:
  language: ta
  text: மோசே தன் மாமனாரைச் சந்திக்க வெளியே சென்று, அவர்முன் தாழ்ந்து வணங்கி, அவரை முத்தமிட்டார். பின்னர் அவர்கள் ஒருவருக்கொருவர் நலமா என்று விசாரித்தார்கள்[a]; அதன்பின் அவர்கள் கூடாரத்துக்குள் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழிமரபில் நேரடியாக, “ஒவ்வொருவரும் தம் தோழரிடம் நலனைக் குறித்து விசாரித்தார்கள்.” இங்கு “சமாதானம்” என்பதற்கான சொல் நலநிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרַאת
  choice: சந்திக்க
  rationale: வருகைதரும் உறவினரை வரவேற்க வெளியே செல்லும் சூழலில், இந்தச் சொல் தற்செயலாக எதிர்ப்படுவதைக் குறிக்காமல் நேரில் சென்று சந்திப்பதைக் குறிக்கிறது.
- source_word: חֹתְנוֹ
  choice: தன் மாமனாரை
  rationale: யாத்திராகமம் 18-இன் சூழலில் חֹתֵן என்பது மோசேயின் மனைவியின் தந்தையான எத்திரோவைக் குறிப்பதால், பொதுவான மணவுறவுச் சொல்லைவிட ‘மாமனார்’ துல்லியமானது.
- source_word: וַיִּשְׁתַּחוּ
  choice: அவர்முன் தாழ்ந்து வணங்கி
  rationale: שׁחה உடலைத் தாழ்த்தி மரியாதை செலுத்தும் செயலைக் குறிக்கிறது. தமிழில் ‘தாழ்ந்து வணங்கி’ என்பது உடல் செய்கையையும் மரியாதையையும் வெளிப்படுத்துகிறது; இதை வழிபாடு என்று மட்டும் தீர்மானிப்பதில்லை.
- source_word: וַיִּשַּׁק לוֹ
  choice: அவரை முத்தமிட்டார்
  rationale: இது உறவினரை வரவேற்கும் வழக்கமான முத்தத்தைக் குறிக்கிறது; தமிழில் இயல்பான, நேரடியான மொழிபெயர்ப்பு.
- source_word: וַיִּשְׁאֲלוּ אִישׁ לְרֵעֵהוּ לְשָׁלוֹם
  choice: இருவரும் ஒருவர் மற்றவரின் நலத்தைப் பற்றி விசாரித்தார்கள்
  rationale: אִישׁ לְרֵעֵהוּ பரஸ்பரச் செயலைக் குறிக்கிறது; ‘சமாதானத்தைப் பற்றி கேட்பது’ என்ற எபிரெய மொழிமரபை நவீன தமிழில் இயல்பாக ‘நலத்தைப் பற்றி விசாரித்தார்கள்’ எனத் தருகிறது.
- source_word: הָאֹהֱלָה
  choice: கூடாரத்துக்குள்
  rationale: திசையைக் குறிக்கும் இறுதி விகுதி கூடாரத்தின் உள்ளே சென்றதைக் காட்டுகிறது. எபிரெய உரை அது யாருடைய கூடாரம் என்று வெளிப்படையாகக் கூறாததால் ‘அவருடைய’ என்பது சேர்க்கப்படவில்லை.
theological_decisions:
- issue: எத்திரோவுக்கு முன் மோசே தாழ்ந்து வணங்கியதன் பொருள்
  choice: மரியாதையை வெளிப்படுத்தும் உடல் செய்கை என மொழிபெயர்த்தல்
  alternative: வழிபாட்டுச் செயல் என மொழிபெயர்த்தல்
  rationale: שׁחה வேறு சூழல்களில் வழிபாட்டைக் குறிக்கலாம். ஆனால் இங்கு மனிதரான மாமனாரைச் சந்தித்து முத்தமிடும் வரவேற்புத் தொடரில் வருவதால், ‘தாழ்ந்து வணங்கி’ என்பது செயலைத் தெளிவாகக் கூறுகிறது; உரை கூறாத வழிபாட்டு நோக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் செயல் வரிசையும், முதலில் மோசே மட்டும் செய்த செயல்களுக்கும் பின்னர் இருவரும் செய்த செயல்களுக்கும் உள்ள வேறுபாடும் காக்கப்பட்டுள்ளன.
