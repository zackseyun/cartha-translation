  text: Then Moses sent his father-in-law away[a], and he went to his own land.
translation:
  language: ta
  text: பின்பு மோசே தன் மாமனாரை வழியனுப்பினார்[a]; அவர் தன் நாட்டிற்குச் சென்றார்.
  philosophy: optimal-equivalence
