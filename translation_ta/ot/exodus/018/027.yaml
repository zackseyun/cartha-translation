lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: வழியனுப்பினார்
  rationale: பியேல் வினைவடிவம் ஒருவரை அனுப்பிவைப்பது அல்லது விடைகொடுத்து அனுப்புவது என்ற பொருளைத் தருகிறது. இச்சூழலில் ‘வழியனுப்பினார்’ என்பது மரியாதையான பிரிவையும் இயல்பான தமிழ் நடையையும் வெளிப்படுத்துகிறது.
- source_word: חֹתְנוֹ
  choice: தன் மாமனாரை
  rationale: இச்சூழலில் חֹתֵן என்பது மோசேயின் மனைவியின் தந்தையான எத்திரோவைக் குறிப்பதால், நவீன தமிழில் தெளிவான உறவுமுறையான ‘மாமனார்’ பயன்படுத்தப்படுகிறது.
- source_word: וַיֵּלֶךְ לוֹ
  choice: அவர் ... சென்றார்
  rationale: לוֹ இங்கு தனிப்பொருள் வலியுறுத்தாத இடைநிலைப் பயன்பாடாக உள்ளது; தமிழில் அதைத் தனியாக மொழிபெயர்க்காமல் ‘சென்றார்’ என்று இயல்பாகக் கொடுக்கப்படுகிறது.
- source_word: אֶל אַרְצוֹ
  choice: தன் சொந்த நாட்டுக்கு
  rationale: אֶרֶץ என்பது இங்கு ஒருவருடைய தாயகம் அல்லது சொந்த நிலப்பகுதியைக் குறிக்கிறது. ‘சொந்த நாடு’ உடைமைப் பொருளைத் தெளிவாக்குகிறது; நவீன தேசிய அரசை அவசியம் குறிக்காது.
