source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה עֹלָ֥ה וּ/זְבָחִ֖ים לֵֽ/אלֹהִ֑ים וַ/יָּבֹ֨א אַהֲרֹ֜ן וְ/כֹ֣ל זִקְנֵ֣י יִשְׂרָאֵ֗ל לֶ/אֱכָל לֶ֛חֶם עִם חֹתֵ֥ן מֹשֶׁ֖ה לִ/פְנֵ֥י הָ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/012.yaml
  text: Then Jethro[a], Moses’ father-in-law, took a burnt offering and sacrifices for God, and Aaron and all the elders of Israel came to eat bread with Moses’ father-in-law before God.
translation:
  language: ta
  text: பின்பு, மோசேயின் மாமனாரான எத்திரோ, தேவனுக்காக ஒரு தகனபலியையும் பலிகளையும் கொண்டுவந்தார். ஆரோனும் இஸ்ரயேலின் மூப்பர்கள் அனைவரும் மோசேயின் மாமனாரோடு அப்பம் உண்ண[a] தேவனுடைய முன்னிலையில் வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “அப்பம் உண்ண.” இச்சொற்றொடர் “உணவைப் பகிர்ந்து உண்ண” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: கொண்டுவந்தார்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தார்’ என்பதாக இருந்தாலும், பலிகளைப் பற்றிய இச்சூழலில் ‘கொண்டுவந்தார்’ என்பது செயலை இயல்பான தமிழில் தெரிவிக்கிறது; எத்திரோ தாமே பலியிட்டார் என்று மூலத்தில் வெளிப்படையாக இல்லாததைச் சேர்ப்பதையும் தவிர்க்கிறது.
- source_word: חֹתֵן מֹשֶׁה
  choice: மோசேயின் மாமனார்
  rationale: இந்தக் கதைச்சூழலில் חֹתֵן என்பது மோசேயின் மனைவியின் தந்தையான எத்திரோவைக் குறிக்கிறது. ‘மாமனார்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ் உறவுமுறைச் சொல்.
- source_word: עֹלָה
  choice: ஒரு தகனபலி
  rationale: עֹלָה என்பது முழுவதும் எரிக்கப்படும் பலிக்கான வழக்கமான எபிரெயச் சொல். ‘தகனபலி’ தமிழ் வேதாகம வழக்கிலும் பொதுவான சமயச் சொல்லாட்சியிலும் தெளிவாக உள்ளது.
- source_word: וּזְבָחִים
  choice: மற்ற பலிகள்
  rationale: זְבָחִים என்பது பன்மையில் பொதுவான பலிகளைக் குறிக்கிறது. ‘மற்ற’ என்பது முன் கூறப்பட்ட குறிப்பிட்ட தகனபலியிலிருந்து இவற்றை இயல்பாக வேறுபடுத்துகிறது; மூலத்தின் இரு வகைச் சொல்லாட்சியையும் காக்கிறது.
- source_word: לֵאלֹהִים
  choice: தேவனுக்காக
  rationale: ל முன்னிடைச்சொல் இங்கு பலிகள் தேவனுக்குரியவை அல்லது அவருக்குச் செலுத்தப்படுபவை என்பதைச் சுட்டுகிறது. ‘தேவனுக்காக’ என்பது தமிழில் இயல்பாக இருந்து, பலியிடும் செயலை வினையில் தேவையின்றிச் சேர்க்காது.
- source_word: וַיָּבֹא אַהֲרֹן וְכָל זִקְנֵי יִשְׂרָאֵל
  choice: ஆரோனும் இஸ்ரயேலின் மூப்பர்கள் அனைவரும் ... வந்தார்கள்
  rationale: எபிரெயத்தில் வினை ஒருமையில் ஆரோனுக்கு முன் வந்தாலும், ஆரோனும் அனைத்து மூப்பர்களும் இணைந்த எழுவாயாக உள்ளனர். தமிழில் பன்மை வினை இயல்பும் பொருளுக்கு ஏற்றதும் ஆகும்.
- source_word: לֶאֱכָל לֶחֶם
  choice: அப்பம் உண்ண
  rationale: இது சொல்லுக்கு சொல் ‘அப்பம் உண்ண’ என்பதாகும்; உணவைப் பகிர்ந்து உண்ணுதல் என்ற விரிவான மரபுத்தொடர் பொருளும் இருக்கலாம். முதன்மை உரை மூலத்தின் திடமான உருவகத்தை வைத்திருக்கிறது; குறிப்பில் மரபுத்தொடர் பொருள் தரப்படுகிறது.
- source_word: עִם חֹתֵן מֹשֶׁה
  choice: மோசேயின் மாமனாரோடு
  rationale: மூலம் எத்திரோவின் பெயரை மீண்டும் சொல்லாமல் உறவுமுறைப் பெயரை மீண்டும் பயன்படுத்துகிறது. தமிழிலும் அதே உரையாடல் அமைப்பு காக்கப்படுகிறது.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: தேவனுடைய முன்னிலையில்
  rationale: לִפְנֵי என்பது ‘முன்பாக’ அல்லது ‘முன்னிலையில்’ என்று பொருள்படும். ‘தேவனுடைய முன்னிலையில்’ என்பது தேவப்பிரசன்னத்தை இயல்பான தமிழில் தெரிவித்து, வழிபாட்டுச் சூழலைக் கூடுதல் விளக்கமின்றிக் காக்கிறது.
theological_decisions:
- issue: பலிச் சூழலில் ‘அப்பம் உண்ணுதல்’ என்பதன் பொருள்
  choice: மூலத்தின் ‘அப்பம் உண்ண’ என்ற சொற்றொடரை உரையில் வைத்து, அது உணவைப் பகிர்ந்து உண்ணுதலையும் குறிக்கலாம் என்று குறிப்பில் தெரிவிக்கப்பட்டது.
  alternative: இதை நேரடியாக ‘பலியுணவைப் பகிர்ந்து உண்ண’ அல்லது ‘உணவருந்த’ என்று விரித்துரைத்தல்.
  rationale: பலிகள், ஆரோனும் மூப்பர்களும் பங்கேற்பது, ‘தேவனுடைய முன்னிலையில்’ என்ற சொற்கள் ஆகியவை புனிதமான பலிவிருந்துச் சூழலை வலுவாக உணர்த்துகின்றன. ஆனாலும் ‘உடன்படிக்கை விருந்து’ அல்லது ‘பலியுணவு’ என்று மூலத்தில் வெளிப்படையாக இல்லாத வகையில் பொருளை முடிவுசெய்யாமல், அதன் இறையியல் நெருக்கடியும் சாத்தியமும் காக்கப்படுகின்றன.
- issue: אֱלֹהִים என்பதன் குறிப்பு
  choice: தேவன்
  alternative: தெய்வங்கள்
  rationale: இஸ்ரயேலின் தேவனை மையமாகக் கொண்ட இக்கதைச்சூழலும் ஒருமை சார்ந்த பயன்பாடும் ‘தேவன்’ என்பதையே கோருகின்றன; பன்மைத் தெய்வங்களைக் குறிக்கும் பொருள் இங்கு பொருந்தாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தகனபலி,’ ‘மூப்பர்கள்,’ ‘தேவன்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் காக்கப்பட்டுள்ளன. மனிதர்களைக் குறிக்கும் வினைகளில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டு, மிகப் பழமையான வாக்கிய அமைப்புகள் தவிர்க்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் [a] குறியீடு எத்திரோவின் பெயருக்குப் பின் இருந்தபோதிலும், அதன் குறிப்பு ‘அப்பம் உண்ண’ என்ற சொற்றொடரையே விளக்குவதால் தமிழில் குறியீடு அதற்குரிய இடத்தில் வைக்கப்பட்டுள்ளது.
