  yaml_path: translation/ot/exodus/018/026.yaml
  text: And they judged the people at all times. Every difficult matter they would bring to Moses[a], but every small matter they themselves would judge.
translation:
  language: ta
  text: அவர்கள் எப்போதும் மக்களுக்கு நீதி வழங்கினார்கள். கடினமான ஒவ்வொரு வழக்கையும் மோசேயிடம் கொண்டுவந்தார்கள்[a]; சிறிய ஒவ்வொரு வழக்கையும் அவர்களே தீர்த்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடினமான ஒவ்வொரு காரியத்தையும் … சிறிய ஒவ்வொரு காரியத்தையும்.” நீதித்துறைச் சூழலில், எபிரேயச் சொல் கடினமான வழக்குகளையும் சிறிய வழக்குகளையும் வேறுபடுத்திக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: நீதி வழங்கினார்கள்
  rationale: שׁפט என்பதன் நீதித்துறைச் சூழலையும், நியமிக்கப்பட்டவர்கள் தொடர்ந்து செய்த பணியையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: הָעָם
  choice: மக்களுக்கு
  rationale: עם இங்கு இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது; שׁפט உடன் தமிழில் இயல்பாக வரும் வேற்றுமை உருபு பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּכָל עֵת
  choice: எப்போதும்
  rationale: வழக்குகளை விசாரிக்க அவர்கள் தொடர்ந்து கிடைத்தனர் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַדָּבָר הַקָּשֶׁה
  choice: கடினமான ஒவ்வொரு வழக்கையும்
  rationale: דבר இங்கு நீதித்துறைச் சூழலில் ‘வழக்கு’ எனப் பொருள்படும்; קשה அந்த வழக்கின் கடினத்தன்மையைக் குறிக்கிறது. பொதுப்பிரிவு பொருள் தமிழில் ‘ஒவ்வொரு’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: יְבִיאוּן אֶל מֹשֶׁה
  choice: மோசேயிடம் கொண்டுவந்தார்கள்
  rationale: கடினமான வழக்குகளை மோசேயிடம் வழக்கமாக எடுத்துச் சென்ற தொடர்ச்சியான நடைமுறையைச் சூழல் தெளிவாக்குகிறது.
- source_word: כָל הַדָּבָר הַקָּטֹן
  choice: சிறிய ஒவ்வொரு வழக்கையும்
  rationale: קטן என்பது கடினமான வழக்குகளுக்கு எதிராகச் சிறிய அல்லது எளிய வழக்குகளைக் குறிக்கிறது; ‘சிறிய’ என்பது எபிரேயச் சொல்லின் நேரடியான எதிரிணையைப் பாதுகாக்கிறது.
- source_word: יִשְׁפּוּטוּ הֵם
  choice: அவர்களே தீர்த்தார்கள்
  rationale: தனியே வரும் הֵם தரும் வலியுறுத்தலை ‘அவர்களே’ பாதுகாக்கிறது; வழக்குகளைத் தீர்ப்பது என்ற நீதித்துறைப் பொருள் தமிழில் இயல்பாக உள்ளது.
