  source_fidelity: மூல எபிரேயத்தின் நீதித்துறைப் பொருளைத் துல்லியமாகக் காக்கிறது. וְשָׁפְטוּ/יִשְׁפּוּטוּ என்பவற்றின் தீர்ப்பளிக்கும் செயல்பாடு ‘நீதி வழங்கினார்கள்’ மற்றும் ‘தீர்த்தார்கள்’ என இயல்பாக வெளிப்படுகிறது. בְּכָל־עֵת என்பதன் தொடர்ச்சியான கிடைப்புத் தன்மை ‘எப்போதும்’ எனப் பொருத்தமாக உள்ளது. கடினமான வழக்குகளை மோசேயிடம் கொண்டுவருதல், சிறிய வழக்குகளை அவர்களே தீர்த்தல், மற்றும் הֵם-இன் வலியுறுத்தல் அனைத்தும் பாதுகாக்கப்பட்டுள்ளன.
  naturalness: நவீன நிலையான தமிழில் தெளிவான, கண்ணியமான, இயல்பான நடை. ‘வழக்கு,’ ‘நீதி வழங்கினார்கள்,’ ‘தீர்த்தார்கள்’ ஆகியவை இச்சூழலுக்கு ஏற்ற நீதித்துறைச் சொற்கள். ‘கடினமான ஒவ்வொரு வழக்கையும்’ மற்றும் ‘சிறிய ஒவ்வொரு வழக்கையும்’ என்பது சற்றே முறையான சொல் வரிசையாயினும், பொருள் தெளிவாகவும் ஏற்றுக்கொள்ளத்தக்கதாகவும் உள்ளது.
  terminology: ‘மோசே,’ ‘நீதி,’ ‘வழக்கு’ ஆகியவை நிலையான பயன்பாட்டுக்கு ஏற்றவை. ‘கடினமான/சிறிய’ என்ற இணைமுரண், הַקָּשֶׁה மற்றும் הַקָּטֹן இடையிலான மூலச் சொல்லமைப்பின் எதிரிணையை நன்றாகப் பாதுகாக்கிறது. அடிக்குறிப்பு ‘காரியம்’ என்ற சட்டச்சூழலுக்கு சாத்தியமான மாற்றை அளிக்கிறது; மூலத்தின் நுணுக்கத்தை மிகைப்படுத்தவில்லை.
