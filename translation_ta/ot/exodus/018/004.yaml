  terminology: ‘எலியேசர்,’ ‘என் தந்தையின் கடவுள்,’ ‘துணை,’ ‘காப்பாற்றினார்,’ and ‘பார்வோனின் வாள்’ are suitable and preserve the source’s theological and metaphorical language. No interpretive speech formula should be added.
