  yaml_path: translation/ot/exodus/018/004.yaml
  text: And the name of the other was Eliezer[a], for the God of my father was my help, and he delivered me from Pharaoh’s sword.
translation:
  language: ta
  text: மற்றவனின் பெயர் எலியேசர்[a]; ஏனெனில், என் தந்தையின் கடவுள் எனக்குத் துணையாக இருந்தார்; அவர் பார்வோனின் வாளிலிருந்து என்னைக் காப்பாற்றினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில், “என் தந்தையின் கடவுள் எனக்குத் துணையாக இருந்தார்; அவர் பார்வோனின் வாளிலிருந்து என்னைக் காப்பாற்றினார்” என்ற காரண விளக்கம் நேரடியாக வருகிறது; “அவன் சொன்னான்” என்பது வெளிப்படையாக இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם הָאֶחָד
  choice: மற்றவனின் பெயர்
  rationale: முந்தைய வசனத்தில் ஒரு மகனின் பெயர் கூறப்பட்டிருப்பதால், הָאֶחָד என்பதைச் சூழலுக்கேற்ப இயல்பான தமிழில் ‘மற்றவன்’ என்று மொழிபெயர்க்கிறது. வாவ் இணைப்பின் தொடர்ச்சி தமிழில் வாக்கிய ஓட்டத்தால் வெளிப்படுகிறது.
- source_word: אֱלִיעֶזֶר
  choice: எலியேசர்
  rationale: ஆள்பெயர் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்படுகிறது; பெயருக்கும் தொடர்ந்து வரும் உதவி பற்றிய விளக்கத்திற்கும் உள்ள சொற்பொருள் தொடர்பு மறைக்கப்படவில்லை.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: மகனுக்கு அந்தப் பெயர் சூட்டப்பட்டதற்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பாகத் தெளிவாக மொழிபெயர்க்கப்படுகிறது.
- source_word: אֱלֹהֵי אָבִי
  choice: என் தந்தையின் கடவுள்
  rationale: எபிரெய கட்டமைப்பை நெருக்கமாகப் பேணி, இது தந்தை வழியாக அறியப்பட்ட கடவுளைக் குறிக்கும் விதத்தில் மொழிபெயர்க்கிறது.
- source_word: בְּעֶזְרִי
  choice: எனக்குத் துணையாக இருந்து
  rationale: ‘என் உதவி’ என்ற பெயர்ச்சொல் அமைப்பை இயல்பான தமிழில் ‘எனக்குத் துணை’ என்று தருகிறது; அடுத்த இறந்தகால வினையுடன் பொருந்த ‘இருந்து’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיַּצִּלֵנִי
  choice: என்னைக் காப்பாற்றினார்
  rationale: נצל என்பதன் ஆபத்திலிருந்து மீட்டல் அல்லது காப்பாற்றுதல் என்ற பொருளை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵחֶרֶב פַּרְעֹה
  choice: பார்வோனின் வாளிலிருந்து
  rationale: மூலத்தின் உருவகத்தையும் பார்வோனின் கொல்லும் அதிகாரம் அல்லது அச்சுறுத்தல் என்ற உட்பொருளையும் விளக்கமாக மாற்றாமல் அப்படியே பேணுகிறது.
theological_decisions:
- issue: பெயருக்கான விளக்கத்தில் வெளிப்படையான பேச்சு அறிமுகம் இல்லாமை
  choice: ‘அவன் சொன்னான்’ என்பதைச் சேர்க்காமல் காரண விளக்கத்தை நேரடியாக வழங்குதல்
  alternative: ‘ஏனெனில், அவன், “…” என்றான்’ என்று வெளிப்படையான பேச்சாக அமைத்தல்
  rationale: எபிரெய மூலத்தில் சொல்வதைக் குறிக்கும் வினை இல்லை. ஆகவே அந்த விளக்கம் மோசேயின் நேரடிக் கூற்றா அல்லது கதைசொல்லியின் காரண விளக்கமா என்ற சிறிய தெளிவின்மையைத் தீர்மானித்துவிடாமல் பேணுகிறது.
- issue: பார்வோனின் வாள்
  choice: உருவகத்தை ‘பார்வோனின் வாள்’ என்றே பேணுதல்
  alternative: ‘பார்வோனின் கொலை அச்சுறுத்தல்’ என்று விளக்குதல்
  rationale: வாள் என்பது நேரடியான ஆயுதத்தையும் பார்வோனின் மரண அதிகாரத்தையும் குறிக்கக்கூடும்; மொழிபெயர்ப்பு அந்தப் பொருள் விரிவைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘துணையாக இருந்து’, ‘காப்பாற்றினார்’ ஆகியவை பொதுவாகப் புரியும் சொற்கள்; மூலத்தில் இல்லாத பேச்சுக் குறிகளோ பேச்சு வினையோ சேர்க்கப்படவில்லை.
