base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/005.yaml
  text: Then Jethro[a], Moses' father-in-law, came to Moses in the wilderness, where he was camped at the mountain of God[b], with his sons and his wife.
translation:
  language: ta
  text: மோசேயின் மாமனாரான எத்திரோ, மோசேயின் மகன்களையும் மனைவியையும் அழைத்துக்கொண்டு, மோசே கடவுளின் மலையில் முகாமிட்டிருந்த பாலைநிலத்தில் அவரிடம் வந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்தார்
  rationale: வினைச்சொல் கதை நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது. தமிழில் வாக்கிய ஓட்டமே தொடர்ச்சியை இயல்பாக உணர்த்துவதால் தனியே ‘பின்பு’ சேர்க்கப்படவில்லை.
- source_word: יִתְרוֹ
  choice: எத்திரோ
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவில் தரப்பட்டுள்ளது.
- source_word: חֹתֵן מֹשֶׁה
  choice: மோசேயின் மாமனாகிய
  rationale: மோசேயுடனான எத்திரோவின் திருமண உறவை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: וּבָנָיו וְאִשְׁתּוֹ
  choice: அவருடைய மகன்களையும் மனைவியையும் அழைத்துக்கொண்டு
  rationale: உடன் வந்தவர்களைக் குறிக்கும் இணைப்பை தமிழில் இயல்பாக வெளிப்படுத்துகிறது; எபிரெய மூன்றாம் நபர் உரிமை விகுதியின் வெளிப்படையான வடிவத்தையும் தக்கவைக்கிறது.
- source_word: אֶל־מֹשֶׁה
  choice: அவரிடம்
  rationale: எத்திரோவின் வருகை மோசேயை நோக்கியது என்பதைத் தமிழில் மீளுரையாடலைத் தவிர்த்து தெளிவாகக் காட்டுகிறது.
- source_word: אֶל־הַמִּדְבָּר
  choice: பாலைநிலத்தில்
  rationale: இலக்கு மோசே இருந்த பாலைநிலம் என்பதை அடுத்த உறவுப்பிரிவுடன் இயல்பாக இணைக்கிறது.
- source_word: אֲשֶׁר הוּא חֹנֶה שָׁם
  choice: மோசே முகாமிட்டிருந்த
  rationale: உறவுப்பிரிவின் ஆண்பால் ஒருமை எழுவாய் சூழலில் மோசேயைக் குறிக்கிறது; ‘முகாமிட்டிருந்த’ என்பது இயல்பான நவீன தமிழ்.
- source_word: הַר הָאֱלֹהִים
  choice: கடவுளின் மலை
  rationale: எபிரெய அடைமொழியை நேரடியாகத் தக்கவைத்து, இந்த வசனத்தில் இல்லாத ‘சீனாய்’ அல்லது ‘ஓரேபு’ என்ற பெயரைச் சேர்ப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: ‘அவருடைய மகன்களும் மனைவியும்’ என்பதிலுள்ள உரிமை விகுதியின் குறிப்பு
  choice: மூலத்தின் மூன்றாம் நபர் வடிவத்தைத் தக்கவைத்து, அடிக்குறிப்பில் சூழல்சார் குறிப்பை வழங்குதல்
  alternative: ‘மோசேயின் மகன்களையும் மனைவியையும்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: யாத்திராகமம் 18:2–4 சூழலில் இவர்கள் மோசேயின் குடும்பத்தினர் என்பது இயல்பான வாசிப்பு. ஆயினும் எபிரெய வடிவம் பெயரை மீண்டும் கூறாமல் ‘அவனுடைய’ என்ற விகுதியையே பயன்படுத்துவதால், மூலத்தின் இலக்கண வடிவத்தை முற்றிலும் அழிக்காமல் வைத்துள்ளது.
- issue: ‘கடவுளின் மலை’ என்பதன் அடையாளம்
  choice: வசனத்திலுள்ள விளக்கப் பெயரை அப்படியே வைத்தல்
  alternative: ‘சீனாய் மலை’ அல்லது ‘ஓரேபு’ என்று பெயரிடுதல்
  rationale: மூலத்தில் הַר הָאֱלֹהִים என்ற சொற்றொடரே உள்ளது; குறிப்பிட்ட வேறு பெயரை உள்ளே கொண்டுவருவது வசனத்தை மீறிய விளக்கமாகிவிடும்.
- issue: மலைக்கும் முகாமுக்கும் இடையிலான இடவியல் உறவு
  choice: ‘கடவுளின் மலையருகே’
  alternative: ‘கடவுளின் மலையில்’
  rationale: பாலைநில முகாம் மலையோடு தொடர்புடைய இடத்தில் இருந்ததை இயல்பான தமிழில் காட்டுகிறது; அவர்கள் மலையின் மேற்பரப்பிலேயே முகாமிட்டனர் என்று தேவையின்றி வலியுறுத்துவதில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘பாலைநிலம்’, ‘முகாமிட்டிருந்தார்’, ‘கடவுளின் மலை’ ஆகியவை சாதாரண வாசகர்களுக்குப் புரியும் வகையில் மூலத்தின் இடவியல் மற்றும் விளக்கப் பெயரைத் தக்கவைக்கின்றன.
