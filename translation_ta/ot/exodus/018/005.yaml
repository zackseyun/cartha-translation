revisions:
- from: மோசேயின் மாமனாகிய எத்திரோ, அவருடைய மகன்களையும் மனைவியையும் அழைத்துக்கொண்டு[a], கடவுளின் மலையருகே[b] மோசே முகாமிட்டிருந்த பாலைநிலத்தில் அவரிடம் வந்தார்.
  to: மோசேயின் மாமனாரான எத்திரோ, மோசேயின் மகன்களையும் மனைவியையும் அழைத்துக்கொண்டு, மோசே கடவுளின் மலையில் முகாமிட்டிருந்த பாலைநிலத்தில் அவரிடம் வந்தார்.
  rationale: The revision removes the unsupported “near” nuance, expresses the mountain as the location of Moses’ encampment, and makes the family referent unambiguous in idiomatic Tamil. The footnote retains the relevant fact that Hebrew itself uses a third-person possessive form rather than repeating Moses’ name.
