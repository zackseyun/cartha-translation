translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எண்ணிக்கை அடிப்படையிலான நிர்வாக அமைப்பு தெளிவாக இருக்க ஒரே மாதிரியான தொடரமைப்பு பயன்படுத்தப்பட்டது; எபிரெயச் சொல்லின் சாத்தியமான இராணுவ நிழற்பொருளை மட்டும் முன்னிறுத்தாமல், சூழலுக்கேற்ற நிர்வாகத் தலைமையை உரை வெளிப்படுத்துகிறது.
