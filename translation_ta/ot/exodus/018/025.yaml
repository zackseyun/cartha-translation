base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/025.yaml
  text: 'Moses chose capable men from all Israel and appointed them as heads over the people: commanders of thousands[a], commanders of hundreds, commanders of fifties[b], and commanders of tens.'
translation:
  language: ta
  text: 'மோசே இஸ்ரவேலர் அனைவரிலிருந்தும் திறமையுள்ள ஆண்களைத்[a] தேர்ந்தெடுத்து, அவர்களை மக்கள்மேல் தலைவர்களாக[b] நியமித்தார்: ஆயிரம் பேருக்குத் தலைவர்கள், நூறு பேருக்குத் தலைவர்கள், ஐம்பது பேருக்குத் தலைவர்கள், பத்து பேருக்குத் தலைவர்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தகுதியுள்ள ஆண்களை.” எபிரெயச் சொற்றொடர் வலிமை, திறமை அல்லது நிரூபிக்கப்பட்ட தகுதி உடைய ஆண்களைக் குறிக்கலாம்; இச்சூழலில் பொறுப்பேற்கத் தகுதியானவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் சொல்லர்த்தமாக “மக்கள்மேல் தலைகளாக.” இங்கு “தலைகள்” என்பது அதிகாரம் வகிப்பவர்களைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: தேர்ந்தெடுத்து
  rationale: בחר என்பதன் நேரடியான பொருள் ‘தேர்ந்தெடு’; எபிரெயக் கதைநடையின் தொடர்ச்சியான செயலை இயல்பான தமிழில் இணைவினையெச்சமாக வழங்குகிறது.
- source_word: אַנְשֵׁי חַיִל
  choice: திறமையுள்ள ஆண்கள்
  rationale: இந்தச் சொற்றொடர் வலிமை, திறன், தகுதி, நிரூபிக்கப்பட்ட மதிப்பு ஆகியவற்றைக் குறிக்கலாம். இங்குள்ள நீதி மற்றும் நிர்வாகச் சூழலில் போர்வீரத்தைக் காட்டிலும் பொறுப்பை ஏற்கும் திறமை முன்னிலைப்படுகிறது.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரிலிருந்தும்
  rationale: முழு இஸ்ரவேல் சமூகத்திலிருந்து தேர்வு செய்யப்பட்டதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיִּתֵּן אֹתָם
  choice: அவர்களை … நியமித்தார்
  rationale: נתן என்பதற்கு அடிப்படையில் ‘வைத்தார்/கொடுத்தார்’ என்று பொருள் இருந்தாலும், இங்கு ஒரு பொறுப்பில் அமர்த்துவதைச் சுட்டுவதால் ‘நியமித்தார்’ என்பது சூழலுக்கேற்றது.
- source_word: רָאשִׁים
  choice: தலைவர்கள்
  rationale: ‘தலைகள்’ என்ற எபிரெய உருவகத்தின் அதிகாரப் பொருளை இயல்பான நவீன தமிழில் ‘தலைவர்கள்’ என்று தருகிறது.
- source_word: עַל הָעָם
  choice: மக்கள்மேல்
  rationale: ஆளுகை மற்றும் அதிகார உறவைக் குறிக்கும் עַל என்பதன் பொருளை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: שָׂרֵי
  choice: … பேருக்குத் தலைவர்கள்
  rationale: שַׂר என்பது ஒரு குழுவின்மேல் அதிகாரம் பெற்ற பொறுப்பாளரைக் குறிக்கிறது. எண்ணிக்கையால் வகுக்கப்பட்ட நிர்வாக அமைப்பில் ‘தலைவர்கள்’ என்பது இராணுவப் பொருளைத் தேவையின்றி இறக்குமதி செய்யாமல் அதிகாரத்தைத் தெளிவாக்குகிறது.
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: ஆயிரம் பேர், நூறு பேர், ஐம்பது பேர், பத்து பேர்
  rationale: ஒவ்வொரு தலைவரின் கீழிருந்த குழுவின் எண்ணிக்கையை நேரடியாகவும் தெளிவாகவும் வழங்குகிறது.
