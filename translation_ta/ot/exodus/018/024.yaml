  text: So Moses listened to the voice of his father-in-law and did all that he said[a].
translation:
  language: ta
  text: மோசே தன் மாமனாரின் சொல்லுக்குச் செவிகொடுத்தார்; அவர் சொன்ன அனைத்தையும் செய்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் மாமனாரின் சொல்லுக்குக் கீழ்ப்படிந்தார்.’ எபிரெய மரபுத்தொடர், ஒருவர் சொல்வதைக் கேட்டு அதற்கிணங்கச் செயல்படுவதையும் குறிக்கலாம்; அடுத்த வாக்கியப் பகுதி அதை வெளிப்படையாகக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: செவிகொடுத்து
  rationale: שׁמע என்பதற்கு இங்கு வெறுமனே கேட்டல் மட்டுமல்லாமல், கவனமாகக் கேட்டு அதன்படி செயல்படும் பொருளும் உள்ளது. ‘செவிகொடுத்து’ என்பது கேட்டல் என்ற படிமத்தைத் தக்கவைக்கிறது; அதனால் விளைந்த கீழ்ப்படிதலை அடுத்த வாக்கியப் பகுதி வெளிப்படுத்துகிறது.
- source_word: לְקוֹל
  choice: சொல்லுக்கு
  rationale: קוֹל என்பதன் நேரடிப் பொருள் ‘குரல்’ என்றாலும், לְקוֹל என்ற எபிரெய மரபுத்தொடர் ஒருவரின் சொல்லைக் கவனித்துக் கேட்பதைக் குறிக்கிறது. தமிழில் ‘சொல்லுக்குச் செவிகொடுத்து’ என்பது மூலத்தின் பொருளையும் மரபுத்தொடரின் இயல்பையும் தெளிவாக வழங்குகிறது.
- source_word: חֹתְנוֹ
  choice: தன் மாமனார்
  rationale: சூழலில் இது மோசேயின் மனைவியின் தந்தையான எத்திரோவைக் குறிக்கிறது. நவீனத் தமிழில் ‘மாமனார்’ என்பது தெளிவான இயல்பான சொல்.
- source_word: וַיַּעַשׂ
  choice: செய்தார்
  rationale: עשה என்பதன் அடிப்படைப் பொருளான ‘செய்’ என்பதை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: כֹּל אֲשֶׁר אָמָר
  choice: அவர் சொன்ன அனைத்தையும்
  rationale: காலநுட்பத்தையோ மறைமுகப் பொருளையோ கூடுதலாகச் சேர்க்காமல், எபிரெய உறவுநிலைத் தொடரின் பொருளைத் தெளிவாக வழங்குகிறது.
