  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘சொல்லுக்குச் செவிகொடுத்து’ என்ற இயல்பான தமிழ் மரபுத்தொடர், எபிரெய மொழியின் கேட்டல்–கீழ்ப்படிதல் நுணுக்கத்தைப் பாதுகாக்கிறது.
