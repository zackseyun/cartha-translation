source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע יִתְר֨וֹ כֹהֵ֤ן מִדְיָן֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה אֱלֹהִים֙ לְ/מֹשֶׁ֔ה וּ/לְ/יִשְׂרָאֵ֖ל עַמּ֑/וֹ כִּֽי הוֹצִ֧יא יְהוָ֛ה אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/001.yaml
  text: Jethro[a], the priest of Midian, Moses’ father-in-law, heard all that God had done for Moses and for Israel his people, that Yahweh had brought Israel out of Egypt.
translation:
  language: ta
  text: மீதியானின் ஆசாரியரும் மோசேயின் மாமனாருமான எத்திரோ, கடவுள் மோசேக்காகவும் அவருடைய மக்களான இஸ்ரவேலுக்காகவும்[a] செய்த அனைத்தையும்—அதாவது, யாவே இஸ்ரவேலை எகிப்திலிருந்து வெளியே கொண்டுவந்ததையும்—கேள்விப்பட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மோசேயுடைய மக்களான இஸ்ரவேல்” என்றும் மொழிபெயர்க்கலாம். “அவருடைய” என்பதற்குரிய எபிரேயப் பின்னொட்டு இலக்கண ரீதியாக மோசேயைக் குறிக்கக்கூடும்; ஆனால் சூழலில் அது கடவுளைக் குறிப்பதே அதிக சாத்தியம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: கேள்விப்பட்டார்
  rationale: எத்திரோ செய்திகளைக் கேட்டறிந்தார் என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; எபிரேய வாவ்-தொடர்ச்சிக்காக மூலத்தில் இல்லாத ‘இப்போது’ போன்ற காலச் சொல்லைச் சேர்க்கவில்லை.
- source_word: כֹהֵן מִדְיָן
  choice: மீதியானின் ஆசாரியர்
  rationale: எத்திரோவின் சமயப் பணியையும் மீதியானுடனான தொடர்பையும் சுருக்கமாகவும் மரியாதையான நடையிலும் அடையாளப்படுத்துகிறது.
- source_word: חֹתֵן מֹשֶׁה
  choice: மோசேயின் மாமனார்
  rationale: இச்சூழலில் சிப்போராளின் தந்தை என்ற திருமண உறவைத் துல்லியமாகக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה אֱלֹהִים
  choice: கடவுள் ... செய்த அனைத்தையும்
  rationale: כָּל אֲשֶׁר என்பதன் முழுமையைக் காத்து, நிகழ்வுகளுக்குப் பிந்தைய செய்தியறிதலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְמֹשֶׁה וּלְיִשְׂרָאֵל
  choice: மோசேக்காகவும் ... இஸ்ரவேலுக்காகவும்
  rationale: לְ இங்கு அவர்களின் நன்மைக்காகக் கடவுள் செயல்பட்டார் என்ற பயனுறு பொருளைக் காட்டுகிறது.
- source_word: עַמּוֹ
  choice: அவருடைய மக்களான
  rationale: மூன்றாம் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டின் ‘அவருடைய மக்கள்’ என்ற வடிவத்தைத் தக்கவைக்கிறது; அது கடவுளையோ இலக்கண ரீதியாக மோசேயையோ சுட்டக்கூடிய தெளிவின்மையை அடிக்குறிப்பு விளக்குகிறது.
- source_word: כִּי
  choice: அதாவது
  rationale: எத்திரோ கேள்விப்பட்டவற்றின் விளக்கமான அல்லது சுருக்கமான உள்ளடக்கத்தை அடுத்த கூற்று தருகிறது என்பதைத் தமிழில் தெளிவாக இணைக்கிறது.
- source_word: הוֹצִיא
  choice: வெளியே கொண்டுவந்தார்
  rationale: יצא என்பதன் ஹிஃபில் வடிவிலுள்ள ‘வெளியே வரச் செய்தல்’ என்ற காரணவினைப் பொருளை நேரடியாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מִמִּצְרָיִם
  choice: எகிப்திலிருந்து
  rationale: எகிப்தின் உள்ளிருந்து இஸ்ரவேல் வெளியே கொண்டுவரப்பட்ட இயக்கத்தை இயல்பான தமிழில் குறிக்கிறது.
theological_decisions:
- issue: עַמּוֹ என்பதிலுள்ள உடைமைப் பின்னொட்டு யாரைக் குறிக்கிறது?
  choice: ‘அவருடைய மக்களான இஸ்ரவேல்’ என்பது முதன்மையாகக் கடவுளுடைய மக்களான இஸ்ரவேலைக் குறிக்கிறது.
  alternative: ‘மோசேயுடைய மக்களான இஸ்ரவேல்’ என்றும் இலக்கண ரீதியாக எடுத்துக்கொள்ளலாம்.
  rationale: முன்னதாக வரும் אֱלֹהִים இயல்பான கருத்து முன்னோடி; அடுத்ததாக யாவே இஸ்ரவேலை வெளியே கொண்டுவந்தார் என்பதும் இதை ஆதரிக்கிறது. எனினும் எபிரேய வடிவத்தின் உண்மையான இலக்கணச் சாத்தியத்தைத் தீர்த்துவிடாமல் அடிக்குறிப்பில் பதிவு செய்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான விவரண நடை பயன்படுத்தப்பட்டுள்ளது. ‘எத்திரோ’, ‘மீதியான்’, ‘மோசே’, ‘இஸ்ரவேல்’, ‘எகிப்து’, ‘யாவே’ ஆகிய நிலையான வேதாகமப் பெயர்வடிவங்கள் பயன்படுத்தப்பட்டன. எபிரேய வசனத்தின் விளக்க அமைப்பை இயல்பாகக் காட்ட நீள்கோடுகள் இடப்பட்டுள்ளன; மூலத்தில் இல்லாத தொடக்கக் கால அல்லது உரையாடல் இடைச்சொல் சேர்க்கப்படவில்லை.
