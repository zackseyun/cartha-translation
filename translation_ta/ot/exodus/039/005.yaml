  revised_text: 'அவனுடைய ஏபோத்தின் மேல் இருந்த திறமையாக நெய்யப்பட்ட இடைக்கச்சு[a], அதனோடு ஒரே துணியாகவும் அதே வேலைப்பாட்டில் செய்யப்பட்டிருந்தது. அது தங்கம், நீலநிற நூல், ஊதாநிற நூல், செந்நிற நூல், மெல்லிய முறுக்கப்பட்ட சணல் நூல் ஆகியவற்றால், யாவே மோசேக்குக் கட்டளையிட்டபடியே, செய்யப்பட்டது.


