  yaml_path: translation/ot/exodus/039/005.yaml
  text: 'And the skillfully woven band of his ephod[a], which was on it, was of one piece with it and made like it: of gold, blue, purple, scarlet yarn, and fine twisted linen, just as Yahweh had commanded Moses.'
translation:
  language: ta
  text: 'அவனுடைய ஏபோத்தின் மேல் இருந்த திறமையாக நெய்யப்பட்ட இடைக்கச்சு[a], அதனோடு ஒரே துணியாகவும் அதே வேலைப்பாட்டில் செய்யப்பட்டிருந்தது. அது தங்கம், நீலநிற நூல், ஊதாநிற நூல், செந்நிற நூல், மெல்லிய முறுக்கப்பட்ட சணல் நூல் ஆகியவற்றால், யாவே மோசேக்குக் கட்டளையிட்டபடியே, செய்யப்பட்டது.


    [a] அல்லது, “அவனுடைய ஏபோத்தின் அலங்கார இடைக்கச்சு… அதிலிருந்தே அதே வேலைப்பாட்டில் செய்யப்பட்டிருந்தது.” இடைக்கச்சு ஏபோத்திலிருந்து தனியாக இல்லாமல் அதனுடன் இணைந்த பகுதியாகவும், அதே வேலைப்பாட்டைக் கொண்டதாகவும் இருந்ததை எபிரெய மொழி வலியுறுத்துகிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய ஏபோத்தின் அலங்கார இடைக்கச்சு… அதிலிருந்தே அதே வேலைப்பாட்டில் செய்யப்பட்டிருந்தது.” இடைக்கச்சு ஏபோத்திலிருந்து தனியாக இல்லாமல் அதனுடன் இணைந்த பகுதியாகவும், அதே வேலைப்பாட்டைக் கொண்டதாகவும் இருந்ததை எபிரெய மொழி வலியுறுத்துகிறது.
    reason: חֵשֶׁב, מִמֶּנּוּ הוּא, כְּמַעֲשֵׂהוּ ஆகிய சொற்றொடர்களின் சொல்லியல் மாற்றுவாய்ப்பையும் அமைப்புரீதியான ஒருமைப்பாட்டையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: חֵשֶׁב
  choice: திறமையாக நெய்யப்பட்ட இடைக்கச்சு
  rationale: ஆசாரிய உடைச் சூழலில் இது ஏபோத்தோடு இணைந்த நெய்த பட்டை அல்லது இடைக்கச்சைக் குறிக்கிறது; நெசவுத் திறனையும் அதன் பயன்பாட்டையும் இத்தேர்வு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲפֻדָּתוֹ
  choice: அவனுடைய ஏபோத்
  rationale: மூலத்தின் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியைப் பாதுகாத்து, ஆசாரியரின் சிறப்பு ஆடையை ஒலிபெயர்க்கிறது.
- source_word: אֲשֶׁר עָלָיו
  choice: அதன் மேல் இருந்த
  rationale: இடைக்கச்சு ஏபோத்தின் மேல் அமைந்திருந்ததை நேரடியாகக் கூறுகிறது; இணைப்பு சூழலால் விளங்குகிறது.
- source_word: מִמֶּנּוּ הוּא
  choice: அதனோடு ஒரே துணியாக
  rationale: இடைக்கச்சு தனிப் பகுதியாகச் சேர்க்கப்படாமல் ஏபோத்துடன் அமைப்புரீதியாக ஒன்றிணைந்திருந்த கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: כְּמַעֲשֵׂהוּ
  choice: அதே வேலைப்பாட்டின்படி
  rationale: ஏபோத்துக்கும் இடைக்கச்சுக்கும் ஒரேவிதமான கைவினை வேலைப்பாடு இருந்ததைப் பாதுகாக்கிறது.
- source_word: זָהָב תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: தங்கம், நீலநிற நூல், ஊதாநிற நூல், செந்நிற நூல்
  rationale: திருக்கூடாரத் துணிகளுக்குரிய பொருட்களையும் நிறங்களையும் நவீனத் தமிழில் தெளிவாகத் தருகிறது; சூழலின் அடிப்படையில் நிறச் சொற்களுடன் ‘நூல்’ சேர்க்கப்பட்டுள்ளது.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: முறுக்கப்பட்ட மெல்லிய சணல் நூல்
  rationale: உயர்தரமான மெல்லிய linen நூலும் அது முறுக்கப்பட்டிருந்த விதமும் இரண்டையும் வெளிப்படுத்துகிறது; ‘பஞ்சு’ என்று தவறான நார்ப்பொருளை இறக்குமதி செய்வதைத் தவிர்க்கிறது.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: யாவே மோசேக்குக் கட்டளையிட்டபடியே
  rationale: கட்டளைக்குக் கீழ்ப்படிந்து வேலை நிறைவேற்றப்பட்டதைக் காட்டும் வழக்கமான நிறைவேற்றச் சூத்திரத்தை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைக்குரிய தனிப்பெயரான நான்கு எழுத்து இறைப்பெயர் நேரடியாக உள்ளது; பொதுப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- issue: வினைச்சொல்லின் மறைமுக எழுவாய்
  choice: அவர்கள் செய்தார்கள்
  alternative: அது செய்யப்பட்டது
  rationale: எபிரெய உரையில் இறுதி வாக்கியத்தின் எழுவாய் முந்தைய சூழலிலிருந்து புரிந்துகொள்ளப்படுகிறது. தமிழில் வாக்கியத்தை இயல்பாக நிறைவு செய்ய ‘அவர்கள்’ சேர்க்கப்பட்டுள்ளது; இது செய்பவர்களைப் பற்றிய புதிய அடையாளத்தை நிர்ணயிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஏபோத்’ சிறப்பு ஆசாரிய ஆடையின் பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது. பொருட்களின் பட்டியல் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
