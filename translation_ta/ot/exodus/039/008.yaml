  text: וַ/יַּ֧עַשׂ אֶת הַ/חֹ֛שֶׁן מַעֲשֵׂ֥ה חֹשֵׁ֖ב כְּ/מַעֲשֵׂ֣ה אֵפֹ֑ד זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ מָשְׁזָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/008.yaml
  text: 'He made the breastpiece[a], the work of a skillful designer, like the work of the ephod: of gold, blue, purple, scarlet yarn[b], and finely twisted linen.'
translation:
  language: ta
  text: அவர் மார்பணியை[a], ஏபோத்தின் வேலைப்பாட்டைப் போலவே, திறமையாக வடிவமைக்கப்பட்ட வேலைப்பாடாக[b]ச் செய்தார். தங்கம், நீலநூல், ஊதாநூல், செந்நிற நூல், நன்றாக முறுக்கப்பட்ட மெல்லிய சணல்நூல் ஆகியவற்றால் அதைச் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபாக, “மார்ப்பதக்கம்” என்றும் மொழிபெயர்க்கப்படுகிறது. இங்கு உலோகக் கவசம் என்ற எண்ணம் ஏற்படாதபடி “மார்பணி” பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “கலைநயமுள்ள நெசவாளரின் வேலைப்பாடாக” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் திறமையுடன் வடிவமைக்கப்பட்ட வேலைப்பாட்டை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவர் ... செய்தார்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடர்வினை; நவீன தமிழில் இயல்பான இறந்தகால வாக்கியமாக வழங்கப்பட்டது.
- source_word: הַחֹשֶׁן
  choice: மார்பணி
  rationale: ஆசாரியர் மார்பில் அணியும் தனிப்பட்ட திருப்பணிப் பொருளைக் குறிக்கிறது; உலோகக் கவசம் என்ற தவறான எண்ணத்தைத் தவிர்த்து, அதன் அணிகலன் தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: திறமையான வடிவமைப்பாளரின் வேலைப்பாடு
  rationale: இது பொதுவான கைவேலையை மட்டுமல்லாமல், திட்டமிட்ட வடிவங்களுடன் கூடிய திறமையான கலைநயப் பணியையும் குறிக்கிறது.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: ஏபோத்தின் வேலைப்பாட்டைப் போலவே
  rationale: மார்பணியின் செய்முறையையும் பொருட்களையும் ஏபோத்துடன் ஒப்பிடும் எபிரெய அமைப்பை நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֵפֹד
  choice: ஏபோத்
  rationale: சரியான தமிழ் இணைச்சொல் இல்லாத தனித்துவமான ஆசாரிய உடையைக் குறிக்கும் தொழில்நுட்பச் சொல் என்பதால் ஒலிபெயர்க்கப்பட்டது.
- source_word: זָהָב
  choice: தங்கம்
  rationale: மூலத்தின் பொருட்பெயரை நேரடியாக வழங்குகிறது; ‘தங்கநூல்’ என்று மூலத்தில் வெளிப்படையாக இல்லாத சொல்லைச் சேர்க்கவில்லை.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: நீலநூல், ஊதாநூல், செந்நிற நூல்
  rationale: கூடாரத் துணிவேலைச் சூழலில் இவை சாயமிடப்பட்ட நூற்பொருட்கள் என்பதை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: நன்றாக முறுக்கப்பட்ட மெல்லிய நார்நூல்
  rationale: שֵׁשׁ என்பதன் நுண்ணிய linen வகையையும் מָשְׁזָר என்பதன் முறுக்கப்பட்ட தன்மையையும் காக்கிறது; ஆதாரமின்றி குறிப்பிட்ட தாவர நாராகக் குறுக்கவில்லை.
