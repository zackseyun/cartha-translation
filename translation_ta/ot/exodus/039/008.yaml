translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் திருப்பணி சார்ந்த கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட எபிரெய வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவற்றின் உண்மையான சொற்பொருள் தொடர்புகளுக்கு ஏற்ப பிரதான உரையில் வைக்கப்பட்டுள்ளன.
