- from: மெல்லிய நார்ப்பட்டுத் தலைப்பாகையையும், மெல்லிய நார்ப்பட்டால் செய்யப்பட்ட அலங்காரமான குல்லாக்களையும், முறுக்கப்பட்ட மெல்லிய நார்ப்பட்டால் செய்யப்பட்ட உள்ளாடைகளையும்,[a]
