    text: எபிரெயச் சொல் வரிசையில், இறுதியில் வரும் ‘மெல்லிய ஆளிநார் நூல், முறுக்கப்பட்டது’ என்ற விளக்கம் குறிப்பாக உள்ளாடைகளோடு இணைத்துப் புரிந்துகொள்ளப்படலாம்; ஆயினும், அது குருத்துவ ஆடைகளில் எங்கும் பயன்படுத்தப்படும் பொருளின் விளக்கத்தையும் எதிரொலிக்கிறது.
    reason: lexical_alternative
