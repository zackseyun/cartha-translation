  text: the turban of fine linen[a], the ornate caps of fine linen, and the undergarments of finely twisted linen,
translation:
  language: ta
  text: மெல்லிய ஆளிநார் துணியாலான தலைப்பாகையையும், மெல்லிய ஆளிநார் துணியாலான அலங்காரத் தொப்பிகளையும், முறுக்கப்பட்ட மெல்லிய ஆளிநார் நூலால் செய்யப்பட்ட உள்ளாடைகளையும்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמִּצְנֶפֶת
  choice: தலைப்பாகை
  rationale: இச்சொல் தலைமைக் குருவுக்குரிய சுற்றிக் கட்டப்படும் தலை மூடியைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இருப்பதால் ‘தலைப்பாகை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: שֵׁשׁ
  choice: மெல்லிய நார்ப்பட்டு
  rationale: இது பொதுவான துணியை அல்ல, தரமான மெல்லிய லினன் துணியைக் குறிக்கிறது. ஆசரிப்புக்கூடாரம் மற்றும் குருத்துவ ஆடைகள் பற்றிய சூழலில் ‘மெல்லிய நார்ப்பட்டு’ பொருளின் தன்மையையும் தரத்தையும் வெளிப்படுத்துகிறது.
- source_word: פַּאֲרֵי הַמִּגְבָּעֹת
  choice: அலங்காரமான குல்லாக்கள்
  rationale: இந்த இணைப்புத் தொடர் குல்லாக்களிலிருந்து வேறான அணிகலன்களைக் குறிப்பிடாமல், அழகும் சிறப்பும் உடைய குருத்துவக் குல்லாக்களையே குறிக்கிறது. ‘அலங்காரமான குல்லாக்கள்’ அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: מִכְנְסֵי הַבָּד
  choice: நார்ப்பட்டால் செய்யப்பட்ட உள்ளாடைகள்
  rationale: מִכְנָסַיִם கீழ் உடலை மறைக்கும் குருத்துவ உள்ளாடைகளைக் குறிக்கிறது; הַבָּד அவற்றின் நார்ப்பட்டுப் பொருளைக் குறிப்பிடுகிறது. ‘உள்ளாடைகள்’ என்பது பழமையான ஆடைச் சொல்லைவிட நவீன வாசகருக்குத் தெளிவானது.
- source_word: מָשְׁזָר
  choice: முறுக்கப்பட்ட
  rationale: இது நூல்கள் முறுக்கப்பட்ட அல்லது திரிக்கப்பட்ட தயாரிப்பு முறையைக் குறிக்கிறது. ‘முறுக்கப்பட்ட’ என்பது நெய்யப்பட்டது என்று தேவையின்றி பொருள் விரிவாக்காமல் அந்த நூற்பணித் தன்மையைத் தருகிறது.
