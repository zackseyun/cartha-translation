  yaml_path: translation/ot/exodus/039/023.yaml
  text: And the opening of the robe was in the middle of it[a], like the opening of a coat of mail, with a binding around its opening, so that it would not be torn.
translation:
  language: ta
  text: அங்கியின் திறப்பு அதன் நடுவில் இருந்தது; அது கவச ஆடையின் திறப்பைப் போல் இருந்தது.[a] அது கிழியாமல் இருக்க, அதன் திறப்பைச் சுற்றிலும் ஓரக்கட்டு இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கவசத்தின் திறப்பைப் போல்’ அல்லது ‘மார்புக் கவசத்தின் திறப்பைப் போல்’ என்றும் மொழிபெயர்க்கலாம்; תַּחְרָא என்ற எபிரெயச் சொல் அரிதானது; அது பாதுகாப்புக்காக அணியும் ஒரு கவச ஆடையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי הַמְּעִיל
  choice: அங்கியின் கழுத்துத் திறப்பு
  rationale: ஆடைச் சூழலில் פֶּה என்பது நேரடியாக ‘வாய்’ என்பதல்ல; அணிபவர் தலையை நுழைக்கும் திறப்பைக் குறிக்கிறது. தமிழில் ‘கழுத்துத் திறப்பு’ அதன் செயலையும் இடத்தையும் தெளிவாகக் கூறுகிறது.
- source_word: בְּתוֹכוֹ
  choice: அதன் நடுவில்
  rationale: திறப்பு ஆடையின் மையப் பகுதியில் அமைந்திருந்ததை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כְּפִי תַחְרָא
  choice: கவச ஆடையின் திறப்பைப் போல்
  rationale: תַּחְרָא அரிதான சொல்; பாதுகாப்புக்கான கவச ஆடையைக் குறிப்பதாகப் பொதுவாகப் புரிந்துகொள்ளப்படுகிறது. அதன் துல்லியமான வகை உறுதியற்றதால் குறிப்பிட்ட ஒரு கவச வகையைத் தேர்ந்தெடுக்காமல் பொதுவாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שָׂפָה
  choice: ஓரக்கட்டு
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘உதடு/விளிம்பு’; இங்கு திறப்பை வலுப்படுத்திச் சுற்றித் தைக்கப்பட்ட ஓரத்தைக் குறிக்கிறது. ‘ஓரக்கட்டு’ ஆடை அமைப்பில் அதன் செயல்பாட்டைத் தெளிவுபடுத்துகிறது.
- source_word: לְפִיו סָבִיב
  choice: அதன் திறப்பைச் சுற்றிலும்
  rationale: வலுப்படுத்தப்பட்ட ஓரம் திறப்பின் முழுச் சுற்றிலும் இருந்ததைத் தெளிவாகக் காட்டுகிறது.
- source_word: לֹא יִקָּרֵעַ
  choice: அது கிழியாதபடி
  rationale: எபிரெய வினை வடிவம் இங்கு ஓரக்கட்டின் நோக்கம் அல்லது விளைவைக் குறிக்கிறது; தமிழில் நோக்கப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
