base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/018.yaml
  text: And they put the two ends of the two braided chains on the two settings[a], and put them on the shoulder pieces of the ephod[b], at its front.
translation:
  language: ta
  text: பின்னல் சங்கிலிகள் இரண்டின் இரு முனைகளையும் இரண்டு பொருத்திடங்களில் வைத்து, அந்த முனைகளை ஏபோத்தின் தோள்பட்டைகளில், அதன் முன்புறத்தில் வைத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְצוֹת
  choice: முனைகள்
  rationale: ஒரு பொருளின் கடைசி முனைப்பகுதிகளைக் குறிக்கிறது; இச்சூழலில் இயல்பான தமிழ்ச் சொல்.
- source_word: הָעֲבֹתֹת
  choice: பின்னல் சங்கிலிகள்
  rationale: கயிறுகளை மட்டும் அல்லாமல், முறுக்கி அல்லது பின்னிச் செய்யப்பட்ட அலங்காரச் சங்கிலி வேலைப்பாட்டைக் குறிக்கிறது.
- source_word: מִּשְׁבְּצֹת
  choice: பதிப்பிடங்கள்
  rationale: மார்ப்பதக்கத்தில் சங்கிலி முனைகள் பொருத்தப்படும் தங்க அமைப்புகள் அல்லது பிடிப்பிடங்களைக் குறிக்கிறது; கைவினைச் சூழலைத் தக்கவைக்கிறது.
- source_word: וַיִּתְּנֻם
  choice: வைத்தார்கள்
  rationale: נתן என்பதன் அடிப்படைப் பொருளான வைப்பதை நேரடியாகத் தருகிறது; 'இறுக்கிக் கட்டினார்கள்' என்று தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: כִּתְפֹת
  choice: தோள்பட்டைகள்
  rationale: உடலின் தோள்களை அல்ல, ஏபோத்தின் தோள்பகுதி இணைப்புத் துண்டுகளைக் குறிக்கிறது.
- source_word: אֶל מוּל פָּנָיו
  choice: அதன் முன்புறத்தில்
  rationale: ஏபோத்தின் முன்நோக்கிய பகுதியில் அமைந்த இடத்தைக் குறிக்கிறது; எபிரெயச் சொற்றொடரின் இடவியல் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தொழில்நுட்பமான ஆசரிப்புக்கூடக் கைவினைச் சொற்கள் சாதாரண வாசகருக்குப் புரியும் வகையில் சுருக்கமாக வழங்கப்பட்டுள்ளன. எபிரெய வாக்கியத்தின் தொடர்ச்சியான செயல்வரிசை காக்கப்பட்டுள்ளது.
