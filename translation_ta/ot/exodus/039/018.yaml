- from: பின்னல் சங்கிலிகள் இரண்டின் இரு முனைகளையும் இரண்டு பதிப்பிடங்களில்[a] பொருத்தி, அவற்றை ஏபோத்தின் தோள்பட்டைகளில், அதன் முன்புறத்தில் வைத்தார்கள்.
