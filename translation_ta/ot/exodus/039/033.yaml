translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் விளக்கப் பட்டியல் அமைப்பு ‘அதாவது’ மற்றும் நீள்கோடுகளால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது. தொழில்நுட்பமான கட்டுமானச் சொற்களுக்கு எளிதில் புரியும் முதன்மைச் சொற்களும் தேவையான இடங்களில் மாற்றுச் சொற்களைக் கொண்ட அடிக்குறிப்புகளும் பயன்படுத்தப்பட்டுள்ளன.
