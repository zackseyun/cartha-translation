source:
  edition: WLC
  text: וַ/יָּבִ֤יאוּ אֶת הַ/מִּשְׁכָּן֙ אֶל מֹשֶׁ֔ה אֶת הָ/אֹ֖הֶל וְ/אֶת כָּל כֵּלָ֑י/ו קְרָסָ֣י/ו קְרָשָׁ֔י/ו בריח/ו וְ/עַמֻּדָ֥י/ו וַ/אֲדָנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/033.yaml
  text: 'Then they brought the tabernacle to Moses—the tent and all its furnishings: its clasps[a], its frames, its bars, its pillars[b], and its bases.'
translation:
  language: ta
  text: 'பின்பு அவர்கள் திருவாசஸ்தலத்தை—கூடாரத்தையும் அதன் எல்லா உபகரணங்களையும்: அதன் இணைப்புப் பற்றிகளையும், சட்டகங்களையும்[a], தாங்குக் கம்பிகளையும், தூண்களையும், அடித்தளங்களையும்[b]—மோசேயிடம் கொண்டுவந்தார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சட்டகங்கள்” என்பதற்கு “பலகைகள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் திருவாசஸ்தலத்தின் செங்குத்தான கட்டமைப்புக் கூறுகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அடித்தளங்கள்” என்பதற்கு “பொருத்துக் குழிகள்” அல்லது “அடிப்பீடங்கள்” என்றும் மொழிபெயர்க்கலாம். சட்டகங்கள் அல்லது தூண்கள் பொருத்தப்பட்ட அடிப்பகுதிகளைக் எபிரெயச் சொல் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: பின்பு அவர்கள் ... கொண்டுவந்தார்கள்
  rationale: ஹிஃபில் வழிக் கதைத் தொடரில் அடுத்த நிகழ்வைச் சுட்டுகிறது. ‘பின்பு’ என்பது இயல்பான தமிழ் கதைநடையைத் தருகிறது; ‘கொண்டுவந்தார்கள்’ அதன் காரணவினைப் பொருளைப் பேணுகிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: யாத்திராகமத்தில் கடவுள் தங்கும் புனித அமைப்பைக் குறிக்கும் நிலையான சொல்லாக இருப்பதால், ‘வாசஸ்தலம்’ என்ற அடிப்படைப் பொருளையும் புனிதச் சூழலையும் சேர்த்துக் காட்டுகிறது.
- source_word: אֶל מֹשֶׁה
  choice: மோசேயிடம்
  rationale: אֶל இங்கு ஒருவரை நோக்கிய இயக்கத்தைக் குறிக்கிறது; ‘மோசேயிடம்’ என்பது இயல்பான நேரடித் தமிழ்.
- source_word: הָאֹהֶל
  choice: கூடாரம்
  rationale: אֹהֶל என்பதன் வழக்கமான பொருள் ‘கூடாரம்.’ இங்கு அது முழுத் திருவாசஸ்தலத்தின் கூடாரக் கூறை மேலும் விளக்குகிறது; அதற்கு மேல் விளக்கம் சேர்க்கப்படவில்லை.
- source_word: כָּל כֵּלָיו
  choice: அதன் எல்லா உபகரணங்கள்
  rationale: כֵּלִים என்பது பொருட்கள், கருவிகள், உபகரணங்கள் ஆகியவற்றை உள்ளடக்கும் பரந்த சொல். தொடர்ந்து பட்டியலிடப்படும் கட்டுமானப் பகுதிகளையும் உள்ளடக்குமாறு ‘உபகரணங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: קְרָסָיו
  choice: அதன் இணைப்புக் கொக்கிகள்
  rationale: கூடாரத் திரைகளை ஒன்றோடொன்று இணைக்கப் பயன்படுத்தப்பட்ட பற்றிகளை இச்சொல் குறிக்கிறது. ‘இணைப்புக் கொக்கிகள்’ அவற்றின் வடிவத்தையும் பணியையும் தெளிவாக்குகிறது.
- source_word: קְרָשָׁיו
  choice: சட்டகங்கள்
  rationale: திருவாசஸ்தலத்தின் செங்குத்தான கட்டமைப்புக் கூறுகளை இச்சொல் குறிக்கிறது. ‘சட்டகங்கள்’ அவற்றின் கட்டுமானப் பணியை நவீன தமிழில் காட்டுகிறது; ‘பலகைகள்’ என்ற மாற்றும் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בריחו
  choice: குறுக்குக் கம்பிகள்
  rationale: சட்டகங்களை ஒன்றாகப் பிடித்திருக்கப் பயன்பட்ட நீளமான கம்பிகளைக் குறிக்கிறது. அவற்றின் கட்டமைப்புப் பணியை ‘குறுக்குக் கம்பிகள்’ தெளிவாகக் காட்டுகிறது.
- source_word: עַמֻּדָיו
  choice: தூண்கள்
  rationale: கூடார அமைப்பின் செங்குத்து ஆதாரங்களைக் குறிக்கும் தெளிவான, வழக்கமான தமிழ் சொல்.
- source_word: אֲדָנָיו
  choice: அடிப்பீடங்கள்
  rationale: சட்டகங்கள் அல்லது தூண்கள் பொருத்தப்பட்ட அடிப்பகுதிகளைக் குறிக்கிறது. ‘அடிப்பீடங்கள்’ வாசகருக்கு தெளிவானது; அவை குழிவுள்ள பொருத்துத் தளங்களாக இருந்ததை ‘அடிப்பிடிகள்’ என்ற மாற்றுச் சொல் அடிக்குறிப்பில் சுட்டுகிறது.
