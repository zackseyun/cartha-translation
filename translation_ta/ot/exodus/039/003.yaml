translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமானதும் சாதாரண வாசகர்களுக்குப் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டது. எபிரெய வசனத்தின் நீண்ட நோக்கத் தொடரை இயல்பான தமிழ் வாக்கியமாக மாற்றியபோதும், தங்கத்தைத் தகடாக்குதல், இழைகளாக வெட்டுதல், வண்ண நூல்களோடு நெய்தல், திறமையான கலைப்பணி ஆகிய படிநிலைகள் காக்கப்பட்டன.
