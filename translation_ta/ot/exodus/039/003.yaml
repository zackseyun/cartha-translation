  source_fidelity: திருத்தம் தேவை. மூலத்தின் உலோகத் தகடுகளை அடித்துத் தட்டுதல், அவற்றை இழைகளாக வெட்டுதல், அவற்றை வண்ணமிட்ட நெசவுப் பொருட்களுக்குள் இணைத்தல் ஆகிய வரிசை காக்கப்பட்டிருந்தாலும், “நார்ப்பட்டு” என்பது שֵׁשׁ (‘fine linen’) என்பதற்கு பொருந்தாது; அது பட்டைக் குறிக்கக்கூடும். மேலும் “நெய்தார்கள்” என்பது மூலத்தில் வெளிப்படையாக இல்லாத செயலைக் குறிப்பாக்குகிறது; தொழில்நுட்ப வேலைப்பாட்டை ‘செய்தார்கள்’ எனக் கூறுவது பாதுகாப்பானது.
  naturalness: திருத்தப்பட்ட உரை நவீன தரத் தமிழில் இயல்பாக உள்ளது. “நீலநூல், ஊதாநூல், செந்நூல்” என்பது சுருக்கமாகவும் தெளிவாகவும் உள்ளது; “லினன் நூல்” நவீன வாசகருக்குப் பொருள் தெளிவாகத் தருகிறது.
