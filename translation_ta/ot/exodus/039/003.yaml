base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/003.yaml
  text: They hammered out sheets of gold and cut it into threads[a], to work it into the blue and into the purple and into the scarlet yarn and into the fine linen[c][b], the work of a skillful designer.
translation:
  language: ta
  text: அவர்கள் பொன் தகடுகளை அடித்துத் தட்டி, அவற்றை மெல்லிய இழைகளாக வெட்டி, அவற்றை நீலநூலிலும் ஊதாநூலிலும் செந்நூலிலும் மெல்லிய லினன் நூலிலும் சேர்த்து, திறமையான கலைவேலைப்பாடாகச் செய்தார்கள்.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொன்னின் மெல்லிய தகடுகள்.” எபிரெயச் சொல் அடித்துத் தட்டப்பட்ட மெல்லிய உலோகத் தகடுகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவற்றை மெல்லிய கீற்றுகளாக வெட்டி.” தங்கம் துணிநூல் வேலைப்பாட்டில் இணைக்கப்படுவதற்காக நுண்ணிய இழைகளாகத் தயாரிக்கப்பட்டது என்பதே கருத்து.
    reason: lexical_alternative
  - marker: c
    text: “திறமையான கலைவேலைப்பாடு” என்பது கலைநயமும் நிபுணத்துவமும் கொண்ட தொழில்நுட்பப் பணியைக் குறிக்கும் சொற்றொடர். “திறமையான கைவினைஞரின் வேலைப்பாடு” அல்லது “கலைநயமிக்க நெசவுப்பணி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַקְּעוּ אֶת פַּחֵי הַזָּהָב
  choice: பொன்னைத் தகடுகளாக அடித்துத் தட்டி
  rationale: רקע என்பது உலோகத்தை அடித்துத் தட்டித் தகடாக்கும் செயலைக் குறிக்கிறது; פַּחֵי என்பது மெல்லிய உலோகத் தகடுகளைக் குறிக்கிறது. தமிழில் இயல்பாக ஒரே செயற்பாட்டுத் தொடராக வழங்கப்பட்டது.
- source_word: וְקִצֵּץ פְּתִילִם
  choice: அதை மெல்லிய இழைகளாக வெட்டி
  rationale: தங்கத் தகடுகள் நெய்வதற்கு ஏற்ற நுண்ணிய இழைகளாக வெட்டப்பட்டன என்பதே சூழலின் பொருள். 'இழைகள்' என்பது நூற்பணியுடனான தொடர்பைத் தெளிவாக்குகிறது.
- source_word: בְּתוֹךְ
  choice: ஆகியவற்றோடு சேர்த்து
  rationale: மீண்டும் மீண்டும் வரும் בְּתוֹךְ, தங்க இழைகள் வண்ண நூல்களிலும் நார்ப்பட்டிலும் உட்புகுத்தப்பட்டதைச் சுட்டுகிறது. இயல்பான தமிழில் 'சேர்த்து ... நெய்தார்கள்' அந்தச் செயலைத் தெரிவிக்கிறது.
- source_word: הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת הַשָּׁנִי
  choice: நீலநிற நூல், ஊதாநிற நூல், செந்நிற நூல்
  rationale: இவை திருக்கூடாரத் துணிநூல் சூழலில் சாயமிடப்பட்ட பொருட்களைக் குறிக்கின்றன. நவீன வாசகருக்காக 'நூல்' வெளிப்படையாகச் சேர்க்கப்பட்டது.
- source_word: הַשֵּׁשׁ
  choice: மெல்லிய திரித்த நார்ப்பட்டு
  rationale: שֵׁשׁ இச்சூழலில் உயர்தர நுண்ணிய லினன் துணிநூலைக் குறிக்கிறது. தமிழில் வழக்கமான வேதாகமப் பொருள் சொல்லாட்சியையும் நுண்மையையும் காக்க இந்த வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: திறமையான வடிவமைப்பாளரின் வேலைப்பாடாக
  rationale: இது திட்டமிட்ட, கலைநயமிக்க நெசவு அல்லது வடிவமைப்புப் பணியைக் குறிக்கும் தொழில்நுட்பச் சொற்றொடர். குறிப்பிட்ட கைவினைப் பங்கை அளவுக்கு மீறி நிர்ணயிக்காமல் திறமையையும் வடிவமைப்பையும் காக்கிறது.
