  text: וַ/יַּ֨רְא מֹשֶׁ֜ה אֶת כָּל הַ/מְּלָאכָ֗ה וְ/הִנֵּה֙ עָשׂ֣וּ אֹתָ֔/הּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה כֵּ֣ן עָשׂ֑וּ וַ/יְבָ֥רֶךְ אֹתָ֖/ם מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/043.yaml
  text: And Moses saw all the work, and behold, they had done it; just as Yahweh had commanded, so they had done it. And Moses blessed them.
translation:
  language: ta
  text: மோசே எல்லாப் பணியையும் பார்த்தார். இதோ, யாவே கட்டளையிட்டபடியே அவர்கள் அதைச் செய்திருந்தனர்; அப்படியே அவர்கள் செய்தனர். மோசே அவர்களை ஆசீர்வதித்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: பார்த்தார்
  rationale: ראה என்பதன் அடிப்படைப் பொருளான ‘பார்’ என்பதைக் காக்கிறது. இச்சூழலில் முடிக்கப்பட்ட வேலையை மோசே பார்வையிட்டதையும் இயல்பாக உணர்த்துகிறது; ‘ஆய்வு செய்தார்’ என்று மூலத்தைவிடக் கூடுதலாகப் பொருள் ஏற்றவில்லை.
- source_word: כָּל הַמְּלָאכָה
  choice: அந்த வேலை முழுவதையும்
  rationale: מְלָאכָה இங்கு திருக்கூடாரப் பணிகள் அனைத்தையும் குறிக்கிறது. ‘அந்த வேலை முழுவதையும்’ என்பது முன்சூழலைச் சுட்டி, முழுமையையும் தெளிவாக வெளிப்படுத்தும் இயல்பான நவீனத் தமிழ்.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה கவனத்தை ஈர்த்து, கண்டறியப்பட்ட உண்மைக்கு மென்மையான அழுத்தம் தருகிறது. ‘இதோ’ அந்த உரையாடல் செயல்பாட்டைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: עָשׂוּ אֹתָהּ
  choice: அவர்கள் அதைச் செய்திருந்தார்கள்
  rationale: עשה என்பது ‘செய்/உருவாக்கு’ என்ற பரந்த பொருளுடையது. ‘அதைச் செய்திருந்தார்கள்’ என்பது முன்கூறிய வேலை முழுவதையும் சுட்டுவதோடு, மோசே பார்த்த நேரத்துக்கு முன்பே பணி நிறைவேற்றப்பட்டிருந்ததை இயல்பாகக் காட்டுகிறது.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: யாவே கட்டளையிட்டபடியே
  rationale: כַּאֲשֶׁר துல்லியமான ஒத்திசைவை உணர்த்துகிறது; ‘கட்டளையிட்டபடியே’ அதைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது. יְהוָה தனிப்பெயராக ‘யாவே’ என எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: כֵּן עָשׂוּ
  choice: அவ்வாறே அவர்கள் செய்திருந்தார்கள்
  rationale: எபிரெய உரை עשה என்ற வினையை மீண்டும் கூறி அவர்களுடைய துல்லியமான கீழ்ப்படிதலை வலியுறுத்துகிறது. தமிழிலும் தனிக் கூற்றாக மீளுரைப்பது அந்த அழுத்தத்தைப் பாதுகாக்கிறது.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: மோசே அவர்களை ஆசீர்வதித்தார்
  rationale: ברך என்பதன் நேரடியான பொருள் ‘ஆசீர்வதி.’ இந்த வடிவம் மூலத்தின் சுருக்கத்தையும் நவீனத் தமிழின் கண்ணியமான நடையையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்லாமல் நான்கு எழுத்துகளைக் கொண்ட இறைத் தனிப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், நவீனத் தமிழில் பரவலாகப் புரிந்துகொள்ளத்தக்க ‘யாவே’ என எழுத்துப்பெயர்ப்பது பெயரின் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான விவரிப்பு நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையிலுள்ள ‘செய்தார்கள்’ என்ற நோக்கமுள்ள மீளுரை நீக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது; ‘இதோ’ என்பதும் கவன ஈர்ப்புக் கூறாக வைக்கப்பட்டுள்ளது.
