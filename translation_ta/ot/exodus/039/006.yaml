source:
  edition: WLC
  text: וַֽ/יַּעֲשׂוּ֙ אֶת אַבְנֵ֣י הַ/שֹּׁ֔הַם מֻֽסַבֹּ֖ת מִשְׁבְּצֹ֣ת זָהָ֑ב מְפֻתָּחֹת֙ פִּתּוּחֵ֣י חוֹתָ֔ם עַל שְׁמ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/006.yaml
  text: And they made the onyx stones[a], enclosed in settings of gold, engraved like the engravings of a seal, according to the names of the sons of Israel.
translation:
  language: ta
  text: அவர்கள் ஓனிக்ஸ் கற்களை[a] தங்கச் சட்டகங்களில் பதித்து, இஸ்ரவேலின் மகன்களின் பெயர்களின்படி முத்திரையில் பொறிப்பதுபோல் பொறித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சோகாம் கற்கள்.” இந்த இரத்தினத்தின் துல்லியமான அடையாளம் உறுதியாகத் தெரியவில்லை; “ஓனிக்ஸ்” என்பது பாரம்பரியமான மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: அவர்கள் ... செய்தார்கள் / பொருத்தி ... செதுக்கினார்கள்
  rationale: עשה என்பது பொதுவாக ‘செய், உருவாக்கு’ என்பதைக் குறிக்கிறது. தமிழில் முழுக் கைவினைச் செயலை இயல்பாக வெளிப்படுத்த, அடுத்துள்ள செயற்பாடுகளோடு இணைத்துக் கூறப்பட்டுள்ளது.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: கோமேதகக் கற்கள்
  rationale: שֹׁהַם என்பதன் துல்லியமான கனிம அடையாளம் உறுதியில்லை. பாரம்பரியமாக அறியப்பட்ட ‘கோமேதகம்’ முதன்மை உரையில் வைக்கப்பட்டு, ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מֻסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: தங்கப் பதிப்புகளில் சுற்றிப் பொருத்தி
  rationale: கற்கள் தங்கத்தால் செய்யப்பட்ட பதிப்புகளுக்குள் சூழப்பட்டு நிலைநிறுத்தப்பட்டதைக் குறிக்கிறது; உலோக வேலைப்பாட்டின் துல்லிய வடிவத்தை அளவுக்கு மீறி வரையறுக்கவில்லை.
- source_word: מְפֻתָּחֹת פִּתּוּחֵי חוֹתָם
  choice: முத்திரைச் செதுக்குகளைப்போல் செதுக்கினார்கள்
  rationale: ஒரே வேர் சொல்லின் மீளுருவாக்கம் தரும் வலியுறுத்தலையும், முத்திரையில் செய்யப்படும் ஆழ்செதுக்கின் ஒப்புமையையும் வாசிக்கத்தக்க தமிழில் காக்கிறது.
- source_word: עַל שְׁמוֹת
  choice: பெயர்களுக்கேற்ப
  rationale: עַל இங்கு பெயர்களுடன் உள்ள ஒத்திசைவு அல்லது தொடர்பைக் குறிக்கிறது; அந்தப் பெயர்களுக்கேற்ப செதுக்கப்பட்டன என்ற பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் வெளிப்படையான ஆண்பால் பன்மையையும், கோத்திரத் தந்தையரைக் குறிக்கும் உடன்படிக்கைச் சொல்லாட்சியையும் பாதுகாக்கிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினம் குறிக்கப்பட்ட உடன்படிக்கைப் பெயர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேல் மக்கள் / இஸ்ரவேலர்
  rationale: இச்சூழலில் கற்களில் பொறிக்கப்பட்ட பெயர்கள் யாக்கோபின் மகன்களுடையவை; ஆகவே மூலத்தின் ஆண்பால் குறிப்பை பொதுப்பாலாக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான கைவினைச் சொற்களுடன் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய உரையின் ரத்தின அடையாளம் சார்ந்த ஐயம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
