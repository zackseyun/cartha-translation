revisions:
- from: அவர்கள் கோமேதகக் கற்களை[a] தங்கப் பதிப்புகளில் சுற்றிப் பொருத்தி, இஸ்ரவேலின் மகன்களுடைய பெயர்களுக்கேற்ப முத்திரைச் செதுக்குகளைப்போல் செதுக்கினார்கள்.
  to: அவர்கள் ஓனிக்ஸ் கற்களை[a] தங்கச் சட்டகங்களில் பதித்து, இஸ்ரவேலின் மகன்களின் பெயர்களின்படி முத்திரையில் பொறிப்பதுபோல் பொறித்தார்கள்.
  rationale: The revision avoids identifying שֹׁהַם with Tamil கோமேதகம் (hessonite), uses the traditional onyx rendering while explicitly retaining the lexical uncertainty in the footnote, and improves the rendering of the gold mountings. It preserves the Hebrew’s seal-engraving comparison and its explicit reference to Israel’s sons.
  reviewer_model: gpt-5.6-terra
