    reason: lexical_alternative
  revision_rationale: The revision avoids identifying שֹׁהַם with Tamil கோமேதகம் (hessonite), uses the traditional onyx rendering while explicitly retaining the lexical uncertainty in the footnote, and improves the rendering of the gold mountings. It preserves the Hebrew’s seal-engraving comparison and its explicit reference to Israel’s sons.
