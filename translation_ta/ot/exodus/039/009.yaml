translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. எபிரெய உரையில் כָּפוּל மீண்டும் வருவதைத் தமிழில் இயல்பாகப் பிரதிபலிக்க இறுதி வாக்கியத்தில் ‘இரட்டிப்பாக இருந்தபோது’ என அளவுகளுடன் இணைக்கப்பட்டுள்ளது; அடிப்படை அமைப்பின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
