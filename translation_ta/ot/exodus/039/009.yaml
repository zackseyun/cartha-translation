revisions:
- from: அது சதுரமாக இருந்தது; மார்புப்பட்டையை இரட்டிப்பாக[a] செய்தார்கள். இரட்டிப்பாக இருந்தபோது அதன் நீளம் ஒரு சாணும், அதன் அகலம் ஒரு சாணுமாக இருந்தது.
  to: அது சதுரமாக இருந்தது; மார்புப்பட்டையை இரட்டையாகச் செய்தார்கள். அதன் நீளம் ஒரு சாணும், அதன் அகலம் ஒரு சாணுமாக இருந்தது; அது இரட்டையாக இருந்தது.[a]
