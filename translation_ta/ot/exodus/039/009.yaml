  text: רָב֧וּעַ הָיָ֛ה כָּפ֖וּל עָשׂ֣וּ אֶת הַ/חֹ֑שֶׁן זֶ֧רֶת אָרְכּ֛/וֹ וְ/זֶ֥רֶת רָחְבּ֖/וֹ כָּפֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/009.yaml
  text: It was square; they made the breastpiece doubled[a], a span its length and a span its width, doubled.
translation:
  language: ta
  text: அது சதுரமாக இருந்தது; மார்புப்பட்டையை இரட்டையாகச் செய்தார்கள். அதன் நீளம் ஒரு சாணும், அதன் அகலம் ஒரு சாணுமாக இருந்தது; அது இரட்டையாக இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரண்டாக மடிக்கப்பட்டது.” எபிரெயச் சொல் மார்புப்பட்டை இரண்டு அடுக்குகளாகவோ அல்லது மடிக்கப்பட்ட இரட்டை அமைப்பாகவோ செய்யப்பட்டதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבוּעַ
  choice: சதுரமாக
  rationale: நான்கு சம பக்கங்களுள்ள வடிவத்தை இயல்பான நவீன தமிழில் நேரடியாகக் குறிக்கிறது.
- source_word: הָיָה
  choice: இருந்தது
  rationale: இங்கு வடிவத்தை விவரிக்கும் நிலை வினையாகப் பயன்படுகிறது.
- source_word: כָּפוּל
  choice: இரட்டிப்பாக
  rationale: பொருள் இரண்டு அடுக்குகளாக அல்லது மடிக்கப்பட்ட இரட்டையான அமைப்பில் செய்யப்பட்டதைக் குறிக்கிறது; மடிக்கப்பட்டதா என்ற விவரத்தை முதன்மை உரையில் தீர்மானிக்கவில்லை.
- source_word: עָשׂוּ
  choice: செய்தார்கள்
  rationale: பொதுவான 'செய்/உருவாக்கு' என்ற பொருளை எளிமையாகவும் நேரடியாகவும் தருகிறது.
- source_word: הַחֹשֶׁן
  choice: மார்புப்பட்டை
  rationale: ஆசாரியரின் மார்பில் அணியப்பட்ட இப்பொருளைக் குறிக்கும் தெளிவான, இயல்பான தமிழ்ச் சொல்.
- source_word: זֶרֶת
  choice: ஒரு சாண்
  rationale: விரித்த கையின் கட்டைவிரல் நுனியிலிருந்து சுண்டுவிரல் நுனிவரையிலான பண்டைய அளவைத் தமிழின் பாரம்பரிய அளவுச்சொல் மூலம் பாதுகாக்கிறது.
- source_word: אָרְכּוֹ
  choice: அதன் நீளம்
  rationale: மார்புப்பட்டையைச் சுட்டும் மூன்றாம் நபர் ஒருமை உடைமை வடிவத்தின் நேரடி மொழிபெயர்ப்பு.
- source_word: רָחְבּוֹ
  choice: அதன் அகலம்
  rationale: அகல அளவைக் குறிக்கும் இயல்பான நவீன தமிழ்.
