lexical_decisions:
- source_word: כְּתֵפֹת
  choice: தோள்பட்டைகள்
  rationale: இச்சொல் தோள்களோடு தொடர்புடைய பன்மைப் பெயர்ச்சொல்; ஏபோத்தின் தோள்கள்மேல் அமைந்து அதன் பகுதிகளை இணைத்த ஆடைப் பகுதிகளை இச்சூழலில் குறிக்கிறது. ‘தோள்பட்டைகள்’ என்பது இயல்பான, தெளிவான நவீனத் தமிழ்.
- source_word: עָשׂוּ
  choice: செய்தார்கள்
  rationale: עשה என்பதன் Qal perfect 3cp வடிவம்; கட்டுமானச் செயல்களின் தொடரில் ‘செய்தார்கள்’ என்பது நேரடியான மொழிபெயர்ப்பு.
- source_word: לוֹ
  choice: அதற்கு
  rationale: ஆண்பால் ஒருமை பின்னொட்டு இங்கு உயிரற்ற ஆண்பால் பெயர்ச்சொல்லான ஏபோத்தைக் குறிக்கிறது; தமிழில் ‘அதற்கு’ இயல்பானது.
- source_word: חֹבְרֹת
  choice: அவை அதனுடன் இணைக்கப்பட்டிருந்தன
  rationale: חבר வேர்ச்சொல் இணைத்தல் அல்லது சேர்த்தல் என்ற பொருளுடையது. தோள்பட்டைகள் ஏபோத்துடன் இணைந்திருந்த நிலையைத் தெளிவாகக் காட்ட வினைமுறைத் தொடர் பயன்படுத்தப்பட்டது.
- source_word: עַל שְׁנֵי קצוותו
  choice: அதன் இரண்டு முனைகளிலும்
  rationale: இந்தக் கட்டமைப்பு ஏபோத்தின் இரண்டு வெளிப்புற முனைகளைக் குறிக்கிறது. ‘முனைகளிலும்’ என்பது ஆடை அமைப்புச் சூழலுக்கு இயல்பான தமிழ்.
- source_word: חֻבָּר
  choice: அது இணைக்கப்பட்டிருந்தது
  rationale: חבר என்பதன் Pual perfect 3ms செயப்பாட்டு வடிவம். மூலத்தில் உள்ள இணைப்பு வேர்ச்சொல்லின் மறுபயன்பாட்டைப் பாதுகாக்க ‘இணைக்கப்பட்டிருந்தது’ என மொழிபெயர்க்கப்பட்டது.
