  source_fidelity: 'மூலத்தின் முக்கிய கூறுகள் காக்கப்பட்டுள்ளன: ஏபோத்திற்கான தோள்பகுதிகள் செய்யப்பட்டன; இணைப்பு இருமுறை குறிப்பிடப்படுகிறது; அதன் இரு முனைகளும் குறிப்பிடப்படுகின்றன. ஆனால் חֹבְרֹת என்பது நிகழ்ந்த நிலையைச் சுட்டும் பங்கேற்பு வடிவம்; ‘இணைக்கப்பட்டிருந்தன’ என்பதும், இறுதி חֻבָּר-ஐ ‘இணைக்கப்பட்டிருந்தது’ என்பதும் மூலத்தில் இல்லாத நீடித்த/முன்நிகழ் கால நுணுக்கத்தைச் சேர்க்கின்றன.'
  naturalness: வரைவு பொதுவாகத் தெளிவான நவீனத் தமிழில் உள்ளது. எனினும், ஆடைப் பகுதிகளுக்கான இணைப்பைச் சொல்லும் இடத்தில் ‘இணைக்கப்பட்டவையாக இருந்தன’ மற்றும் இறுதியில் எளிய இறந்தகாலச் செயப்பாடு ‘இணைக்கப்பட்டது’ ஆகியவை மூலத்தின் சுருக்கமான, சற்றே மீளும் நடைமுறைக்கு இயல்பாகவும் நெருக்கமாகவும் உள்ளன.
