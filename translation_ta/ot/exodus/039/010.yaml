source:
  edition: WLC
  text: וַ/יְמַלְאוּ ב֔/וֹ אַרְבָּעָ֖ה ט֣וּרֵי אָ֑בֶן ט֗וּר אֹ֤דֶם פִּטְדָה֙ וּ/בָרֶ֔קֶת הַ/טּ֖וּר הָ/אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/010.yaml
  text: 'And they mounted on it four rows of stones: the first row was a ruby[a], a topaz, and an emerald.'
translation:
  language: ta
  text: அதில் நான்கு வரிசைகளாகக் கற்களைப் பதித்தார்கள். முதல் வரிசையில் மாணிக்கம்[a], புஷ்பராகம், மரகதம் ஆகியவை இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த இரத்தினக் கற்களைத் துல்லியமாக அடையாளம் காண்பது உறுதியற்றது. ‘மாணிக்கம்,’ ‘புஷ்பராகம்,’ ‘மரகதம்’ என்பவை பொதுவான பாரம்பரிய மொழிபெயர்ப்புகள். இவற்றுக்கு முறையே ‘சிவப்புக் கல்மணி,’ ‘பெரிடாட்,’ மேலும் வேறொரு பளிச்சிடும் பச்சைக் கல் அல்லது மின்னும் கல் என்பவையும் சாத்தியமான பொருள்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלְאוּ
  choice: பதித்தார்கள்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘நிரப்பினார்கள்’ என்றாலும், மார்ப்பதக்கத்தில் இரத்தினக் கற்களைப் பொருத்தும் இச்சூழலில் ‘பதித்தார்கள்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בּוֹ
  choice: அதில்
  rationale: இது முன் குறிப்பிடப்பட்ட மார்ப்பதக்கத்தைக் குறிக்கிறது; கற்கள் அதில் பதிக்கப்பட்டன என்பதைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אַרְבָּעָה טוּרֵי אָבֶן
  choice: நான்கு வரிசைகளாகக் கற்களை
  rationale: טוּרֵי என்பது வரிசைகளையும், אָבֶן இங்கு கூட்டுப்பொருளில் கற்களையும் குறிக்கிறது.
- source_word: טוּר
  choice: வரிசை
  rationale: முன்னுள்ள ‘நான்கு வரிசைகள்’ என்பதுடன் சொற்பொருள் தொடர்ச்சியைப் பேணுகிறது.
- source_word: אֹדֶם
  choice: மாணிக்கம்
  rationale: குறிப்பிட்ட இரத்தினத்தை உறுதியாக அடையாளம் காண இயலாது. பாரம்பரிய மொழிபெயர்ப்பைத் தொடர்ந்து ‘மாணிக்கம்’ பயன்படுத்தப்பட்டு, ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: פִּטְדָה
  choice: புஷ்பராகம்
  rationale: இரத்தினத்தின் துல்லியமான அடையாளம் ஐயத்திற்குரியது; ‘புஷ்பராகம்’ பரவலாக அறியப்பட்ட பாரம்பரியத் தமிழ்ப் பெயராகும்.
- source_word: בָרֶקֶת
  choice: மரகதம்
  rationale: இந்தச் சொல் ஒளிரும் அல்லது மின்னும் கல்லைக் குறித்திருக்கலாம்; ‘மரகதம்’ என்பது பொதுவான பாரம்பரிய மொழிபெயர்ப்பு, ஆனால் உறுதியின்மை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: הַטּוּר הָאֶחָד
  choice: முதல் வரிசையில் ... இருந்தன
  rationale: சொல்லாட்சியில் ‘அந்த ஒரு வரிசை’ என்றிருந்தாலும், நான்கு வரிசைகளின் பட்டியலைத் தொடங்கும் சூழலில் இது முதல் வரிசையைக் குறிக்கிறது; தமிழ் நடைக்கு ஏற்றவாறு இருப்புவினை சேர்க்கப்பட்டுள்ளது.
