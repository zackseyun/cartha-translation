  text: And they made on the breastpiece chains of braided work[a], like cords, of pure gold.
translation:
  language: ta
  text: மார்ப்பதக்கத்திற்காக, தூய தங்கத்தால் கயிறுபோல் பின்னல் வேலை செய்யப்பட்ட சங்கிலிகளைச் செய்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முறுக்கல் வேலை செய்யப்பட்ட” அல்லது “கயிறு வடிவ வேலை செய்யப்பட்ட” என்றும் மொழிபெயர்க்கலாம். சங்கிலிகள் பின்னப்பட்ட அல்லது கயிறுபோன்ற வடிவில் செய்யப்பட்டதை எபிரேயச் சொற்கள் விவரிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: செய்தார்கள்
  rationale: עשה என்பதன் தொடர்கதை வடிவத்தை இயல்பான தமிழ் இறந்தகாலத்தில் தருகிறது.
- source_word: עַל הַחֹשֶׁן
  choice: மார்ப்பதக்கத்தின் மேல் பொருத்துவதற்காக
  rationale: עַל இங்கு மார்ப்பதக்கத்துடன் சங்கிலிகள் இணைக்கப்படுவதைச் சுட்டுகிறது; வெறும் இடத்தைக் காட்டும் சொல்லாக அல்லாமல் நோக்கத்தையும் இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: שַׁרְשְׁרֹת
  choice: சங்கிலிகளை
  rationale: பலவினை பெயர்ச்சொல்லின் நேரான, பொதுவாகப் புரியும் தமிழ் இணை.
- source_word: גַּבְלֻת מַעֲשֵׂה עֲבֹת
  choice: கயிறுபோல் பின்னல் வேலை செய்யப்பட்ட
  rationale: சங்கிலிகளின் பின்னப்பட்ட அல்லது முறுக்கப்பட்ட, கயிறு போன்ற அமைப்பைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; அரிய எபிரேய சொல்லின் நுணுக்கத்திற்கான மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கத்தால்
  rationale: பொருளைக் குறிக்கும் எபிரேய சொற்றொடரை இயல்பான தமிழ் கருவிப்பொருள் வேற்றுமையில் தருகிறது.
