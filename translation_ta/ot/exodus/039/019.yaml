translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஆசாரிய உடைக்குரிய ‘ஏபோத்’ ஒலிபெயர்க்கப்பட்டுள்ளது; חֹשֶׁן போர்க் கவசமாகத் தவறாகப் புரியாதபடி ‘மார்புப்பதக்கம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
