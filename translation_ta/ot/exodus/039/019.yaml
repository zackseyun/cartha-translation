  text: וַֽ/יַּעֲשׂ֗וּ שְׁתֵּי֙ טַבְּעֹ֣ת זָהָ֔ב וַ/יָּשִׂ֕ימוּ עַל שְׁנֵ֖י קְצ֣וֹת הַ/חֹ֑שֶׁן עַל שְׂפָת֕/וֹ אֲשֶׁ֛ר אֶל עֵ֥בֶר הָ/אֵפֹ֖ד בָּֽיְתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/019.yaml
  text: They made two gold rings and put them on the two ends of the breastpiece[b][a], on its edge that was on the inner side toward the ephod.
translation:
  language: ta
  text: அவர்கள் இரண்டு தங்க வளையங்களைச் செய்து, அவற்றை மார்புப்பதக்கத்தின் இரு முனைகளிலும், ஏபோதை நோக்கிய அதன் உட்புற விளிம்பிலும் பொருத்தினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஏபோதை நோக்கிய” என்பதற்கு, “ஏபோதுக்கு எதிராக இருந்த” அல்லது “ஏபோதை எதிர்நோக்கிய” என்றும் மொழிபெயர்க்கலாம். “உட்புறம்” என்பதற்கான எபிரெயச் சொல் சொல்லுக்கு சொல் “வீட்டை நோக்கி” எனப் பொருள்பட்டு, இங்கு மார்புப்பதக்கத்தின் ஏபோதை அடுத்திருந்த பக்கத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: தங்க வளையங்கள்
  rationale: ஆசாரிய உடையின் பகுதிகளை இணைக்கப் பயன்படும் வளையங்களைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது; அவை தங்கத்தால் ஆனவை என்பதையும் காக்கிறது.
- source_word: הַחֹשֶׁן
  choice: மார்புப்பதக்கம்
  rationale: இது போர்க் கவசம் அல்லாமல், பிரதான ஆசாரியரின் மார்பில் அணியப்பட்ட அலங்காரமும் பை போன்ற அமைப்பும் கொண்ட திருப்பணிப் பொருள் என்பதால், ‘மார்புக்கவசம்’ என்பதைக் காட்டிலும் இச்சொல் பொருத்தமானது.
- source_word: שְׂפָתוֹ
  choice: அதன் விளிம்பு
  rationale: שָׂפָה என்பதன் அடிப்படைப் பொருளான ஓரம் அல்லது விளிம்பு என்பதைக் கைவினைப் பொருளின் சூழலில் இயல்பாகத் தருகிறது.
- source_word: שְׁנֵי קְצוֹת
  choice: இரு முனைகள்
  rationale: வடிவத்தை ‘மூலைகள்’ என்று தேவையின்றிக் குறிப்பாக்காமல், קָצֶה என்பதன் ‘முனை/எல்லை’ என்ற பொருளைக் காக்கிறது.
- source_word: וַיָּשִׂימוּ עַל
  choice: பொருத்தினார்கள்
  rationale: வளையங்களை உடையின் குறிப்பிட்ட இடத்தில் வைத்தல் மட்டுமல்லாது இணைத்தல் அல்லது நிலைநிறுத்தல் என்ற கைவினைச் சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד בָּיְתָה
  choice: ஏபோதை நோக்கிய அதன் உட்புற விளிம்பு
  rationale: בָּיְתָה என்பதன் ‘உள்நோக்கி/உட்புறம்’ என்ற திசைப் பொருளையும், אֶל עֵבֶר הָאֵפֹד என்பதன் ஏபோதுடனான இடவுறவையும் ஒருங்கிணைக்கிறது; எபிரெயச் சொற்றொடரின் இடவியல் நுணுக்கம் மாற்று வாசிப்புக்குரியது என்பதால் அடிக்குறிப்பில் அது தெரிவிக்கப்படுகிறது.
