base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/025.yaml
  text: They made bells of pure gold[a], and they put the bells among the pomegranates on the hem of the robe, all around, among the pomegranates.
translation:
  language: ta
  text: அவர்கள் தூய தங்கத்தால் மணிகளைச் செய்தார்கள். அந்த மணிகளை அங்கியின் கீழோரத்தில், மாதுளைகளின் நடுவே[a], சுற்றிலும் மாதுளைகளின் நடுவே வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாதுளைகளுக்கு இடையே’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘மாதுளைகளின் நடுவே’ என்பதாகும்; மாதுளை வடிவ அலங்காரங்களோடு ஒப்பிடும்போது மணிகள் எங்கு வைக்கப்பட்டன என்பதை இது விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: அவர்கள் செய்து
  rationale: עשה என்பதன் வழக்கமான தொடர்கதை வடிவம் அடுத்த தயாரிப்புச் செயலைக் குறிக்கிறது; தமிழில் இயல்பான வாக்கியத் தொடருக்காக ‘அவர்கள் ... செய்து’ என வழங்கப்பட்டது.
- source_word: פַעֲמֹנֵי
  choice: மணிகள்
  rationale: פעמון என்பது மணி எனப் பொருள்படும்; ‘சிறிய’ என்று கூறும் அடைமொழி மூலத்தில் இல்லாததால் அது சேர்க்கப்படவில்லை.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கத்தால்
  rationale: மணிகள் செய்யப்பட்ட பொருளையும் அதன் தூய்மையையும் தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּתְּנוּ
  choice: வைத்தார்கள்
  rationale: נתן இங்கு குறிப்பிட்ட இடத்தில் வைத்தல் அல்லது பொருத்துதல் என்ற பொருளில் வருகிறது; ‘வைத்தார்கள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: בְּתוֹךְ הָרִמֹּנִים
  choice: மாதுளைகளின் நடுவே
  rationale: இந்த எபிரெயச் சொற்றொடரின் நேரடிப் பொருளான ‘நடுவே’ என்பதைக் காத்து, அலங்காரங்களுக்கிடையிலான மணிகளின் அமைவிடத்தைத் தெரிவிக்கிறது.
- source_word: הָרִמֹּנִים
  choice: மாதுளைகள்
  rationale: சூழலில் இவை மாதுளை வடிவ அலங்காரங்கள்; ஆயினும் எபிரெயம் எளிமையாக ‘மாதுளைகள்’ என்றே கூறுவதால் அதையே முதன்மை உரை காக்கிறது.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: அங்கியின் கீழோரத்தில்
  rationale: שׁוּלִים என்பது கீழ் விளிம்பு அல்லது கீழோரம்; מְעִיל இங்கு ஆசாரிய அங்கியைக் குறிக்கிறது. ‘அங்கியின் கீழோரம்’ நவீனத் தமிழில் தெளிவானது.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: அங்கியின் கீழோரத்தைச் சுற்றிய முழு அமைப்பைக் குறிக்கும் சுருக்கமான இயல்பான தமிழ்.
- source_word: בְּתוֹךְ הָרִמֹּנִים (repeated)
  choice: மாதுளைகளின் நடுவே
  rationale: அமைவிடத்தை வலியுறுத்தும் மூலமொழியின் திரும்பக்கூறலைச் சீராக்கி நீக்காமல் மொழிபெயர்ப்பு தக்கவைக்கிறது.
