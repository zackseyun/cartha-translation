translation:
  language: ta
  text: அவர்கள் இரண்டு பொன் பதிப்புகளையும் இரண்டு பொன் வளையங்களையும் செய்தார்கள்; அந்த இரண்டு வளையங்களையும் மார்ப்பதக்கத்தின் இரு முனைகளில் வைத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: அவர்கள் … செய்தார்கள்
  rationale: עשה என்பதன் Qal தொடர்வினை வடிவம் அடுத்த செயலைக் குறிக்கிறது. தமிழில் இயல்பான தொடர் நடைக்காகத் தொடக்க இணைப்புச்சொல் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
- source_word: מִשְׁבְּצֹת
  choice: பதிப்புகள்
  rationale: இச்சொல் பொன்னால் செய்யப்பட்ட பொருத்து அல்லது பதிப்பு வேலைப்பாட்டைக் குறிக்கிறது. குறிப்பிட்ட கைவினை முறையைத் தேவையின்றி நிர்ணயிக்காமல், நகைவேலைச் சூழலுக்கு ஏற்ற பொதுவான சொல்லாக இது உள்ளது.
- source_word: זָהָב
  choice: பொன்
  rationale: பொருளைக் குறிக்கும் வழக்கமான தமிழ்ச்சொல். எபிரெய உரையில் இருமுறை வரும் பொருள், தமிழில் இரு பெயர்களுக்கும் ‘பொன்’ என்ற அடைமொழி பொருந்துமாறு தக்கவைக்கப்பட்டுள்ளது.
- source_word: טַבְּעֹת
  choice: வளையங்கள்
  rationale: ஆசாரிய உடையின் பகுதிகளை இணைக்கும் வட்ட வடிவப் பொருத்துப் பகுதிகளைக் குறிக்கும் இயல்பான தமிழ் இணைச்சொல்.
- source_word: וַיִּתְּנוּ
  choice: பொருத்தினார்கள்
  rationale: נתן இங்கு வெறுமனே கொடுத்தல் அல்ல, ஓர் இடத்தில் வைத்தல் அல்லது அமைத்தல் என்பதைக் குறிக்கிறது. வளையங்களை ஆடையின் முனைகளில் இணைக்கும் சூழலில் ‘பொருத்தினார்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: שְׁנֵי קְצֹוֹת
  choice: இரு முனைகள்
  rationale: மூலத்தின் உறுதியான இடவியல் மொழியை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: הַחֹשֶׁן
  choice: மார்ப்பதக்கம்
  rationale: பிரதான ஆசாரியரின் மார்பில் அணியும் சிறப்பு ஆடைப்பகுதியைக் குறிக்கும் தெளிவான, சுருக்கமான தமிழ்ச் சொல்.
