  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெய வாக்கியத்தின் இரு செயல்களின் வரிசை அரைப்புள்ளியால் தெளிவாகக் காட்டப்பட்டுள்ளது; தெளிவில்லாத கைவினைச் சொல்லுக்கான மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
