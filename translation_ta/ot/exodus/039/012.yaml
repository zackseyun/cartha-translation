  text: 'and the third row: jacinth[a], agate[b], and amethyst.'
translation:
  language: ta
  text: 'மூன்றாவது வரிசை: ஜாசிந்த் கல்[a], அகேட் கல்[b], அமேதிஸ்து கல்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தலைமை ஆசாரியரின் மார்ப்பதக்கத்திலிருந்த பல பழங்கால மணிக்கற்களின் துல்லியமான அடையாளம் உறுதியானதல்ல; ‘ஜாசிந்த்’ என்பதை ‘அம்பர்’ என்றும், பழைய ஆங்கில மரபில் ‘லிகூர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘ஓனிக்ஸ் கல்’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר
  choice: மூன்றாவது வரிசை
  rationale: மார்ப்பதக்கத்தின் மணிக்கற்கள் அமைக்கப்பட்ட தொடரை טוּר குறிக்கிறது. தமிழில் பட்டியல் தொடர்ச்சியும் சூழலிலேயே தெளிவாக இருப்பதால், தொடக்க וְ தனியாக ‘மற்றும்’ என்று இயல்பற்ற முறையில் சேர்க்கப்படவில்லை.
- source_word: הַשְּׁלִישִׁי
  choice: மூன்றாவது
  rationale: வரிசையின் எண்ணைச் சுட்டும் நேரடியான வரிசை எண்.
- source_word: לֶשֶׁם
  choice: கோமேதகம்
  rationale: இது ஜாசிந்த் என அழைக்கப்படும் பழங்கால மணிக்கல்லுக்கான பரவலாக அறியப்படும் தமிழ் பெயர்; கல்லின் துல்லிய அடையாளம் உறுதியற்றது என்பதால் அடிக்குறிப்பில் மாற்றுப் பெயர்கள் தரப்பட்டுள்ளன.
- source_word: שְׁבוֹ
  choice: அகேட் கல்
  rationale: இச்சூழலில் வழக்கமாக ‘agate’ என்று அடையாளப்படுத்தப்படும் கல்லை நவீன வாசகர்கள் புரிந்துகொள்ளும் பெயரில் தருகிறது; ‘ஓனிக்ஸ்’ என்ற மாற்று அடையாளம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: וְאַחְלָמָה
  choice: செவ்வந்திக் கல்
  rationale: אַמְלָמָה பொதுவாக amethyst என அடையாளப்படுத்தப்படுகிறது; அதற்கான புரிந்துகொள்ளத்தக்க தமிழ் மணிக்கல் பெயர் பயன்படுத்தப்பட்டுள்ளது.
