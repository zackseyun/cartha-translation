base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/040.yaml
  text: the hangings of the court[a], its pillars and its bases, and the screen for the gate of the court, its ropes and its pegs, and all the utensils for the service of the tabernacle, for the tent of meeting[c][b];
translation:
  language: ta
  text: முற்றத்தின் திரைச்சீலைகளும், அதன் தூண்களும் அடிப்பீடங்களும், முற்றத்தின் நுழைவாயிலுக்கான மறைப்புத்திரையும், அதன் கயிறுகளும் முளைகளும்[a], சந்திப்புக் கூடாரத்திற்கான திருவாசஸ்தலப் பணியின் எல்லா உபகரணங்களும்;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அதன் கயிறுகள்” என்பதில் உள்ள எபிரெய பின்னொட்டு ஆண்பாலிலும், “அதன் முளைகள்” என்பதில் உள்ள பின்னொட்டு பெண்பாலிலும் உள்ளது. ஆகவே கயிறுகளும் முளைகளும் ஒரே முன்னுறுப்பைக் குறிக்கின்றனவா, அல்லது வேறு முன்னுறுப்புகளைக் குறிக்கின்றனவா என்பது தெளிவாக இல்லை.
    reason: source_ambiguity
lexical_decisions:
- source_word: קַלְעֵי
  choice: திரைச்சீலைகள்
  rationale: முற்றத்தைச் சுற்றி எல்லையாக அமைந்த நெய்த துணிப்பகுதிகளைக் குறிக்கிறது; நுழைவாயிலின் தனிப்பட்ட மறைப்புத்திரையிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: חָצֵר
  choice: முற்றம்
  rationale: திருவாசஸ்தலத்தைச் சுற்றியிருந்த வேலியிடப்பட்ட வெளிப்பகுதியை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: עַמֻּדֶיהָ
  choice: அதன் தூண்கள்
  rationale: முற்றத்தின் திரைச்சீலைகளைத் தாங்கிய செங்குத்தான அமைப்புகளைத் துல்லியமாகக் குறிக்கிறது.
- source_word: אֲדָנֶיהָ
  choice: அடிப்பீடங்கள்
  rationale: தூண்கள் பொருத்தப்பட்ட அடித்தளத் தாங்கிகளைத் தெளிவாகக் குறிக்கிறது; வெறும் ‘அடித்தளங்கள்’ என்பதைவிட பொருளின் தன்மையை நன்றாக வெளிப்படுத்துகிறது.
- source_word: הַמָּסָךְ
  choice: மறைப்புத்திரை
  rationale: நுழைவிடத்தில் தொங்கவிடப்பட்ட தனிப்பட்ட திரையைக் குறித்து, சுற்றுப்புறத் திரைச்சீலைகளிலிருந்து வேறுபடுத்துகிறது.
- source_word: לְשַׁעַר הֶחָצֵר
  choice: முற்றத்தின் நுழைவாயிலுக்கான
  rationale: לְ என்பதன் நோக்கம் அல்லது உரிய தொடர்பையும், שַׁעַר என்பதன் நுழைவாயில் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵיתָרָיו
  choice: அதன் கயிறுகள்
  rationale: அமைப்பை நிலைநிறுத்தப் பயன்படுத்தப்பட்ட கட்டுக் கயிறுகளைக் குறிக்கிறது; எதைக் குறிக்கும் பின்னொட்டு என்பது தெளிவாக இல்லாததால் தமிழிலும் ‘அதன்’ என விடப்பட்டுள்ளது.
- source_word: וִיתֵדֹתֶיהָ
  choice: முளைகள்
  rationale: கயிறுகளை நிலத்தில் உறுதிப்படுத்த அடிக்கப்பட்ட ஆப்பு போன்ற பொருட்களைச் சுருக்கமாகவும் வழக்கமான கூடாரச் சொற்பயன்பாட்டிலும் குறிக்கிறது.
- source_word: כָּל כְּלֵי עֲבֹדַת
  choice: பணியின் எல்லா உபகரணங்கள்
  rationale: כְּלֵי என்பதன் விரிந்த ‘கருவிகள்/பொருட்கள்’ பொருளையும், עֲבֹדָה என்பதன் செயல்பாட்டு பணிப் பொருளையும் இயல்பாகத் தருகிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: இஸ்ரவேலரிடையே கடவுள் வாசம்பண்ணுவதற்குரிய எடுத்துச் செல்லக்கூடிய பரிசுத்த அமைப்புக்கான நிலைபெற்ற தமிழ் சொல்லாட்சியைப் பயன்படுத்துகிறது.
- source_word: לְאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்திற்கான
  rationale: மூலத்தின் தனிப்பட்ட பெயரையும் לְ குறிக்கும் தொடர்பையும் காத்து, முந்தைய ‘திருவாசஸ்தலம்’ என்பதுடன் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: הַמִּשְׁכָּן மற்றும் אֹהֶל מוֹעֵד ஆகியவற்றின் தொடர்பு
  choice: “சந்திப்புக் கூடாரத்திற்கான திருவாசஸ்தலப் பணி” என்று இரு பெயர்களையும் காத்தல்
  alternative: “சந்திப்புக் கூடாரமாகிய திருவாசஸ்தலம்” என்று வெளிப்படையான ஒத்தப்பெயர் உறவாக மொழிபெயர்த்தல்
  rationale: எபிரெய உரை இரு பெயர்களையும் לְ மூலம் இணைக்கிறது; அவற்றை முற்றிலும் ஒன்றே என்று விளக்கிச் சேர்க்காமல், இயல்பான தமிழில் அவற்றின் நெருங்கிய தொடர்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் பட்டியல் நடையும் காக்கப்பட்டுள்ளன. ‘திரைச்சீலைகள்’ மற்றும் ‘மறைப்புத்திரை’ என்ற வேறுபாடு இரண்டு எபிரெயச் சொற்களின் செயல்பாட்டு வேறுபாட்டை வெளிப்படுத்துகிறது. வசனம் தொடர்ச்சிப் பட்டியலின் ஒரு பகுதி என்பதால் இறுதியில் அரைப்புள்ளி வைக்கப்பட்டுள்ளது.
