  text: the table[a], all its utensils, and the bread of the Presence—
translation:
  language: ta
  text: மேசையையும், அதன் எல்லாப் பாத்திரங்களையும், திருமுன்னிலை அப்பத்தையும்[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மரபாக, “சமுகத்து அப்பம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: மேசை
  rationale: שֻׁלְחָן என்பது நேரடியாக ‘மேசை’யைக் குறிக்கிறது. கூடாரப் பொருட்களின் பட்டியல் என்ற சூழல் தெளிவாக இருப்பதால், எபிரெயத்தில் இல்லாத விளக்கச் சொற்களைச் சேர்க்கவில்லை.
- source_word: כָּל כֵּלָיו
  choice: அதன் எல்லாப் பாத்திரங்கள்
  rationale: כְּלִי என்பது பாத்திரம், கருவி அல்லது பயன்பாட்டுப் பொருள் எனப் பரந்த பொருளுடையது. மேசையுடன் தொடர்புடைய பொருட்களை இச்சூழலில் இயல்பாகவும் தெளிவாகவும் குறிக்க ‘பாத்திரங்கள்’ ஏற்றது.
- source_word: לֶחֶם הַפָּנִים
  choice: திருமுன்னிலை அப்பம்
  rationale: இச்சொற்றொடர் சொல்லளவில் ‘முகத்தின்/முன்னிலையின் அப்பம்’ எனப் பொருள்படும். கடவுளுடைய முன்னிலையில் வைக்கப்படும் அப்பம் என்ற கருத்தைச் சுருக்கமாகவும் வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியத்துடனும் தெரிவிக்க ‘திருமுன்னிலை அப்பம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶת ... אֶת ... וְאֵת
  choice: ‘ஐயும்’ என்னும் வேற்றுமை உருபுகளால் வெளிப்படுத்தப்பட்டது
  rationale: எபிரெயச் சொற்கள் பட்டியலிலுள்ள நேரடிச் செயப்படுபொருட்களைக் குறிக்கின்றன. தமிழில் அவற்றின் பணி ‘ஐ’ வேற்றுமை உருபாலும் இணைப்புக்கான ‘உம்’மாலும் இயல்பாக வெளிப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியலின் தொடர்ச்சியைப் பாதுகாக்க இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது. ‘திருமுன்னிலை’ என்பது மூலத்தின் ‘முன்னிலை/சந்நிதி’ கருத்தைப் பாதுகாக்கும் கண்ணியமான, புரிந்துகொள்ளத்தக்க வழிபாட்டு நடை. அடிக்குறி அது விளக்கும் ‘அப்பம்’ என்பதற்குப் பின்னரே வைக்கப்பட்டுள்ளது.
