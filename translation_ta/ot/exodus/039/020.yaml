translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை. உடை அமைப்பின் இடவியல் வரிசை மூலத்தின் வரிசைக்குச் சாத்தியமான அளவு நெருக்கமாக வைக்கப்பட்டுள்ளது; மֶחְבַּרְתּוֹ என்பதைக் குறிப்பிட்ட வகைத் தையலாகத் தீர்மானிக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
