  text: וַֽ/יַּעֲשׂוּ֮ שְׁתֵּ֣י טַבְּעֹ֣ת זָהָב֒ וַֽ/יִּתְּנֻ֡/ם עַל שְׁתֵּי֩ כִתְפֹ֨ת הָ/אֵפֹ֤ד מִ/לְ/מַ֨טָּה֙ מִ/מּ֣וּל פָּנָ֔י/ו לְ/עֻמַּ֖ת מֶחְבַּרְתּ֑/וֹ מִ/מַּ֕עַל לְ/חֵ֖שֶׁב הָ/אֵפֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/020.yaml
  text: They made two gold rings and put them on the two shoulder pieces of the ephod[a], below, on its front side, opposite its joining[b], above the skillfully woven band of the ephod.
translation:
  language: ta
  text: அவர்கள் இரண்டு பொன் வளையங்களைச் செய்து, அவற்றை ஏபோதின் இரண்டு தோள்பட்டைகளிலும், கீழ்ப்பகுதியில், அதன் முன்பக்கத்தில், அது இணையும் இடத்திற்கு நேராக, ஏபோதின் திறம்பட நெய்யப்பட்ட இடைக்கச்சுக்கு மேலே பொருத்தினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טַבְּעֹת
  choice: வளையங்கள்
  rationale: ஆசரிப்புக்கூடாரம் மற்றும் ஆசாரிய உடைச் சூழல்களில் உலோக இணைப்பு வளையங்களைக் குறிக்கும் இயல்பான சொல்.
- source_word: כִתְפֹת
  choice: தோள்பட்டைகள்
  rationale: உடலின் தோள்களை அல்லாமல், ஏபோதின் தோள்பகுதிகளில் அமைந்த உடைக் கூறுகளைக் குறிக்கிறது.
- source_word: מִלְמַטָּה
  choice: கீழ்ப்பகுதியில்
  rationale: வளையங்கள் வைக்கப்பட்ட தாழ்வான இடத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִמּוּל פָּנָיו
  choice: அதன் முன்பக்கத்தில்
  rationale: சொல்லளவில் முகத்திற்கு முன் என்ற பொருளை, உயிரற்ற உடையைப் பொறுத்தவரை இயல்பான தமிழில் தருகிறது.
- source_word: לְעֻמַּת
  choice: நேராக
  rationale: இரு இடங்களுக்கிடையேயான நிலைசார் ஒத்தமைவு அல்லது எதிர்நிலையை மிகையாகத் தீர்மானிக்காமல் காட்டுகிறது.
- source_word: מֶחְבַּרְתּוֹ
  choice: அது இணையும் இடம்
  rationale: தையல் என்று குறுக்காமல், உடையின் பகுதிகள் இணைக்கப்படும் இடம் என்ற எபிரெயச் சொல்லின் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: חֵשֶׁב
  choice: திறம்பட நெய்யப்பட்ட இடைக்கச்சு
  rationale: ஏபோதோடு ஒன்றிணைந்த, கலைத்திறனுடன் நெய்யப்பட்ட கச்சு அல்லது கட்டுப்பட்டையைக் குறிக்கிறது.
- source_word: אֵפֹד
  choice: ஏபோது
  rationale: தலைமை ஆசாரியரின் தனிப்பட்ட உடைக்கான தொழில்நுட்பப் பெயர் என்பதால் ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַיִּתְּנֻם
  choice: பொருத்தினார்கள்
  rationale: வளையங்களை உடையின் குறிப்பிட்ட இடத்தில் வைத்ததை இயல்பாகவும் சூழலுக்கேற்ற துல்லியத்துடனும் தெரிவிக்கிறது.
