base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/017.yaml
  text: And they put the two gold cords on the two rings at the ends of the breastpiece[a].
translation:
  language: ta
  text: அவர்கள் இரண்டு பொன் சரடுகளையும் மார்ப்பதக்கத்தின் இரு முனைகளிலிருந்த இரண்டு வளையங்களில் மாட்டினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பொன் சங்கிலிகளையும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் முறுக்கப்பட்ட சரடுகளையோ சங்கிலி போன்ற இழைகளையோ குறிக்கலாம்; இங்கே அவை பொன்னால் செய்யப்பட்டு மார்ப்பதக்கத்துடன் இணைக்கப்படுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: மாட்டினார்கள்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘வைத்தார்கள்’ என்பதாக இருந்தாலும், சரடுகளை வளையங்களில் பொருத்தும் இச்சூழலில் ‘மாட்டினார்கள்’ என்பது செயலை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: שְׁתֵּי הָעֲבֹתֹת הַזָּהָב
  choice: இரண்டு பொன் சரடுகளையும்
  rationale: עֲבֹתֹת என்பது முறுக்கப்பட்ட கயிறுகள் அல்லது சங்கிலி போன்ற சரடுகளைக் குறிக்கலாம். பொன்னால் செய்யப்பட்ட பொருட்கள் என்ற தகவலை ‘பொன் சரடுகள்’ இயல்பாக வெளிப்படுத்துகிறது; எண்ணிக்கையும் காக்கப்படுகிறது.
- source_word: שְׁתֵּי הַטַּבָּעֹת
  choice: இரண்டு வளையங்களில்
  rationale: טַבָּעֹת என்பது ஆசரிப்புக்கூடப் பொருட்களின் அமைப்பில் உள்ள வளையங்களைக் குறிக்கும் வழக்கமான சொல்; עַל குறிக்கும் பொருத்தும் இடம் தமிழில் ‘வளையங்களில்’ என இயல்பாக வருகிறது.
- source_word: קְצוֹת הַחֹשֶׁן
  choice: மார்ப்பதக்கத்தின் இரு முனைகளிலிருந்த
  rationale: קְצוֹת என்பது முனைகள் அல்லது ஓரங்களின் கடைப்பகுதிகளைக் குறிக்கிறது. חֹשֶׁן என்பது ஆசாரியரின் மார்பில் அணியும் சிறப்புப் பதக்கம்; ‘மார்ப்பதக்கம்’ நவீன தமிழில் சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
