translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும் மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. பொருத்தும் செயலை இயல்பாகச் சொல்ல ‘மாட்டினார்கள்’ என்றும், நகை போன்ற இப்பொருளின் வடிவம் குறித்த எபிரெயச் சொல்லின் தெளிவின்மையைப் பாதுகாக்க முதன்மை உரையில் ‘சரடுகள்’ என்றும் அடிக்குறிப்பில் ‘சங்கிலிகள்’ என்றும் வழங்கப்பட்டுள்ளது.
