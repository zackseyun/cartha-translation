  text: They made the tunics of fine linen[a], the work of a weaver, for Aaron and for his sons.
translation:
  language: ta
  text: ஆரோனுக்காகவும் அவருடைய மகன்களுக்காகவும் மெல்லிய லினன் துணியால் நெசவாளரின் வேலைப்பாடாக அங்கிகளைச் செய்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: செய்தார்கள்
  rationale: עשה என்பதன் Qal wayyiqtol வடிவம் கதையின் அடுத்த செயலைக் குறிக்கிறது. தமிழின் இயல்பான தொடர் நடைக்காக முன்னொட்டு வாவ் தனியாக ‘மேலும்’ என்று மொழிபெயர்க்கப்படவில்லை.
- source_word: הַכָּתְנֹת
  choice: அங்கிகளை
  rationale: כֻּתֹּנֶת என்பது உடலில் அணியும் நீண்ட உடையைக் குறிக்கிறது. ‘அங்கி’ என்பது இச்சூழலில் துல்லியமும் கண்ணியமும் உடைய இயல்பான தமிழ் சொல்.
- source_word: שֵׁשׁ
  choice: நுண்ணிய நார்ப்பட்டால்
  rationale: திருவாசஸ்தல மற்றும் ஆசாரிய உடைச் சூழலில் שֵׁשׁ உயர்தரமான மெல்லிய லினன் துணியைக் குறிக்கிறது. ‘நார்ப்பட்டு’ என்பது பட்டுப்பூச்சிப் பட்டு என்று தவறாகப் புரியாமல், மெல்லிய லினன் நாரால் ஆன துணியைச் சுட்டுகிறது; ‘நுண்ணிய’ அதன் தரத்தைப் பாதுகாக்கிறது.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: நெசவாளரின் வேலைப்பாடாக
  rationale: இந்த இணைச்சொற்றொடர் நெசவினால் உருவாக்கப்பட்ட கைவினை வேலைப்பாட்டை வலியுறுத்துகிறது. இம்மொழிபெயர்ப்பு நெசவுச் செயலையும் கைவினைஞரையும் வெளிப்படுத்துகிறது.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: ஆரோனுக்காகவும் அவருடைய மகன்களுக்காகவும்
  rationale: எபிரெயத்தில் இருமுறை வரும் לְ முன்னிடைச்சொல்லின் பகிர்ந்த வலியுறுத்தலை ‘-க்காகவும் ... -க்காகவும்’ என்ற அமைப்பு இயல்பாகப் பாதுகாக்கிறது.
