  text: the ark of the testimony[a], its poles, and the mercy seat.
translation:
  language: ta
  text: சாட்சிப் பெட்டியையும், அதன் தண்டுகளையும், பாவநிவாரண மூடியையும்[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிருபாசனம்.’ எபிரெயச் சொல் பெட்டியின் மூடியைக் குறிக்கிறது; அது பாவநிவாரணத்தோடும் தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֹן
  choice: பெட்டி
  rationale: இங்கு אֲרֹן என்பது சாட்சிப் பலகைகள் வைக்கப்பட்ட புனிதப் பெட்டியைக் குறிக்கிறது. நவீனத் தமிழில் ‘பெட்டி’ என்பது பொருளை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: הָעֵדֻת
  choice: சாட்சி
  rationale: עֵדוּת என்பதன் நேரடியான பொருள் ‘சாட்சி’; இது உடன்படிக்கைப் பலகைகள் தேவனுடைய சாட்சியாக இருப்பதைக் குறிக்கிறது. ‘உடன்படிக்கை’ என்று மொழிபெயர்ப்பது இவ்விடத்தில் விளக்கமான விரிவாக்கமாகிவிடும்.
- source_word: בַּדָּיו
  choice: அதன் தண்டுகள்
  rationale: கூடாரப் பொருட்களின் சூழலில் בַּד என்பது அவற்றைச் சுமந்து செல்லப் பயன்படும் நீண்ட தண்டுகளைக் குறிக்கிறது. ‘தண்டுகள்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: הַכַּפֹּרֶת
  choice: பாவநிவாரண மூடி
  rationale: כַּפֹּרֶת என்பது சாட்சிப் பெட்டியின் பொன் மூடியையும் அதனுடன் தொடர்புடைய பாவநிவாரணச் சடங்கையும் ஒருங்கே சுட்டுகிறது. ‘பாவநிவாரண மூடி’ பொருளையும் வழிபாட்டுச் சார்பையும் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: கூடார வழிபாட்டுப் பொருளான כַּפֹּרֶת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரண மூடி
  alternative: கிருபாசனம்
  rationale: எபிரெயச் சொல் பெட்டியின் மூடியைக் குறிக்கிறது; அதேவேளையில் பாவநிவாரணத் தொடர்பையும் கொண்டுள்ளது. ‘பாவநிவாரண மூடி’ அந்தப் பொருள் உண்மையில் ஒரு மூடி என்பதைத் தெளிவாக்கி, அதன் வழிபாட்டுச் செயல்பாட்டையும் காக்கிறது; பின்னாளைய குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு புரியும் வகையிலும் வழிபாட்டு உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. இது முந்தைய வசனத்தில் தொடங்கும் பட்டியலின் ஒரு பகுதி என்பதால் இறுதியில் அரைப்புள்ளி வைக்கப்பட்டுள்ளது.
