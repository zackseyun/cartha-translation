base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/031.yaml
  text: And they attached to it a cord of blue yarn[a], to put it above on the turban, just as Yahweh had commanded Moses.
translation:
  language: ta
  text: அதைத் தலைப்பாகையின் மேலே வைப்பதற்காக, அதன் மீது நீலநிற நூற்கயிற்றைப் பொருத்தினார்கள். யாவே மோசேக்குக் கட்டளையிட்டபடியே செய்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו
  choice: அதனுடன் இணைத்தார்கள்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘வைத்தல்’; இங்கு עַל மற்றும் தொடரும் நோக்கவாக்கியத்துடன் வருவதால், முந்தைய வசனத்திலுள்ள பரிசுத்தப் பட்டத்துடன் கயிறு பொருத்தப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: פְּתִיל
  choice: நூற்கயிறு
  rationale: திரிக்கப்பட்ட நூல் அல்லது கயிறு என்ற பொருளைத் தருகிறது; பொருத்துவதற்குப் பயன்படும் உறுதியான நூல்கயிறைச் சூழல் சுட்டுகிறது.
- source_word: תְּכֵלֶת
  choice: நீலநிற
  rationale: திருவாசஸ்தலத் துணிகளில் பயன்படுத்தப்பட்ட தனித்துவமான நீல அல்லது நீல-ஊதா சாயமிட்ட பொருளைக் குறிக்கிறது; முதன்மை உரையில் எளிய நிறப்பெயர் தரப்பட்டு மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַמִּצְנֶפֶת
  choice: தலைப்பாகை
  rationale: தலைமை ஆசாரியரின் சுற்றிக் கட்டப்படும் சடங்குத் தலை அணிகலனை நவீன பொதுத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: מִלְמָעְלָה
  choice: மேற்புறத்தில்
  rationale: மேலான இடத்தில் வைக்கப்படுவதைத் தெரிவிக்கிறது; எபிரெயச் சொல் துல்லியமான முன்/உச்சி இடத்தை நிர்ணயிக்காததால் அதைச் சேர்க்கவில்லை.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: யெகோவா மோசேக்குக் கட்டளையிட்டபடியே
  rationale: கொடுக்கப்பட்ட கட்டளைக்கு வேலை முற்றிலும் ஒத்திருந்ததைச் சுட்டும் நிறைவேற்றச் சூத்திரத்தைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் உள்ள தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் நீண்டகாலமாக அறியப்பட்ட ஒலிபெயர்ப்பில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூல உரையிலுள்ள நான்கெழுத்துத் தனிப்பெயரைப் பாதுகாக்கிறது. தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ பயன்படுத்தப்படுகிறது; ‘கர்த்தர்’ என்பது தனிப்பெயருக்குப் பதிலான பட்டப்பெயர்.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான பொதுத் தமிழ். முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பொருளை ‘அதை/அதனுடன்’ எனத் தொடர்ந்து குறிப்பிடுகிறது. எபிரெயத்தின் நோக்கத் தொடர்பைத் தெளிவாக்குவதற்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
