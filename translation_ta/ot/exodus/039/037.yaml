- from: தூய விளக்குத்தண்டையும், அதன் விளக்குகளாகிய வரிசைப்படுத்தப்பட்ட விளக்குகளையும்[a], அதன் எல்லாக் கருவிகளையும், வெளிச்சத்திற்கான எண்ணெயையும் கொண்டுவந்தார்கள்.
  to: தூய விளக்குத்தண்டையும், அதன் விளக்குகளையும்—ஒழுங்காக அமைக்கப்பட்ட விளக்குகளையும்—அதன் எல்லாக் கருவிகளையும், வெளிச்சத்திற்கான எண்ணெயையும் கொண்டுவந்தார்கள்.
