translation_notes:
  register: நவீனத் தரத் தமிழில், பரிசுத்தக் கூடாரப் பொருட்களின் பட்டியல் நடைக்கு ஏற்ற கண்ணியமான மொழிநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயில் இவ்வசனம் முந்தைய வினையின் நேர்ச்செயப்படுபொருள் பட்டியலாகத் தொடர்கிறது; தமிழ் வாசிப்பில் வாக்கியம் முழுமை பெற, முந்தைய வசனத்திலிருந்து ‘கொண்டுவந்தார்கள்’ என்பது வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
