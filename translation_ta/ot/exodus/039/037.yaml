  yaml_path: translation/ot/exodus/039/037.yaml
  text: the pure lampstand[a], its lamps—the lamps set in order—and all its utensils, and the oil for the light,
translation:
  language: ta
  text: தூய விளக்குத்தண்டையும், அதன் விளக்குகளையும்—ஒழுங்காக அமைக்கப்பட்ட விளக்குகளையும்—அதன் எல்லாக் கருவிகளையும், வெளிச்சத்திற்கான எண்ணெயையும் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְּנֹרָה
  choice: விளக்குத்தண்டு
  rationale: இச்சொல் ஒரு தனி விளக்கை அல்ல, விளக்குகளைத் தாங்கும் பரிசுத்தக் கூடாரப் பொருளைக் குறிக்கிறது; ‘விளக்குத்தண்டு’ என்பது இதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַטְּהֹרָה
  choice: தூய
  rationale: இங்கு பரிசுத்தக் கூடாரப் பொருளின் சடங்கு மற்றும் பொருள் சார்ந்த தூய்மையைக் குறிக்கிறது; ‘தூய’ என்பது ‘சுத்தமான’ என்பதைவிட இச்சூழலுக்கு ஏற்ற கண்ணியமான சொல்.
- source_word: נֵרֹתֶיהָ
  choice: அதன் விளக்குகள்
  rationale: விளக்குத்தண்டுக்குச் சொந்தமான தனித்தனி விளக்குகளை இச்சொல் குறிக்கிறது.
- source_word: נֵרֹת הַמַּעֲרָכָה
  choice: வரிசைப்படுத்தப்பட்ட விளக்குகள்
  rationale: מַעֲרָכָה என்பது ஒழுங்கான அமைப்பையோ வரிசையையோ வலியுறுத்துகிறது; இந்தத் தேர்வு நிர்ணயிக்கப்பட்ட ஒழுங்கை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כָּל כֵּלֶיהָ
  choice: அதன் எல்லாக் கருவிகள்
  rationale: כְּלִי என்பது பாத்திரங்கள், துணைப் பொருட்கள், கருவிகள் ஆகியவற்றை உள்ளடக்கும் பொதுச்சொல்; இங்கு ‘கருவிகள்’ தேவையற்ற மிகை விளக்கமின்றி பொருளைத் தருகிறது.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: வெளிச்சத்திற்கான எண்ணெய்
  rationale: வெளிச்சம் அளிப்பதற்குப் பயன்படுத்தப்படும் எண்ணெய் என்ற எபிரெயக் கூட்டுச்சொல்லின் பொருளை நெருக்கமாகப் பாதுகாக்கிறது.
