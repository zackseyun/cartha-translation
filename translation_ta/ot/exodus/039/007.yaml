  text: וַ/יָּ֣שֶׂם אֹתָ֗/ם עַ֚ל כִּתְפֹ֣ת הָ/אֵפֹ֔ד אַבְנֵ֥י זִכָּר֖וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/007.yaml
  text: And he set them on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], just as Yahweh had commanded Moses.
translation:
  language: ta
  text: யாவே மோசேக்குக் கட்டளையிட்டபடியே, அவன் அவற்றை ஏபோதின் தோள்பட்டைகளின்மேல் இஸ்ரவேலின் மகன்களுக்கான[b] நினைவுக் கற்களாக[a] வைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நினைவுகூருதலின் கற்கள்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்”; இது இஸ்ரவேல் மக்களைக் குறிக்கும் வழக்கமான சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: வைத்தான்
  rationale: שׂוּם என்பதன் ‘வை/அமை’ என்ற நேரடியான பொருளை, ஆடை உருவாக்கும் சூழலில் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֹתָם
  choice: அவற்றை
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட இரண்டு கோமேதகக் கற்களைக் குறிக்கும் உயிரற்ற பன்மைச் சுட்டுப்பெயர்.
- source_word: עַל כִּתְפֹת הָאֵפֹד
  choice: ஏபோதின் தோள்பட்டைகளின்மேல்
  rationale: כָּתֵף என்பதன் அடிப்படைப் பொருள் ‘தோள்’; இங்கு ஏபோதின் தோள்பகுதியில் இணைக்கப்பட்ட பட்டைகளைக் குறிப்பதால் ‘தோள்பட்டைகள்’ துல்லியமாகவும் இயல்பாகவும் உள்ளது.
- source_word: אַבְנֵי זִכָּרוֹן
  choice: நினைவுக் கற்களாக
  rationale: ‘நினைவு/நினைவுகூர்தலுக்கான கற்கள்’ என்ற எபிரெயக் கூட்டுச்சொல்லின் நினைவூட்டும் பணியைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களுக்கான
  rationale: நிலையான எபிரெய வெளிப்பாட்டின் ஆண்பால் வடிவத்தைத் தெளிவாகப் பாதுகாக்கிறது; அது இஸ்ரவேல் மக்களைப் பொதுவாகக் குறிப்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: யாவே மோசேக்குக் கட்டளையிட்டபடியே செய்தான்
  rationale: כַּאֲשֶׁר காட்டும் ஒப்புமை மற்றும் கட்டளைக்கேற்ப நடந்த செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; יְהוָה என்பது ‘யாவே’ என்று பெயராக மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் வரும் நான்கெழுத்து இறைப் பெயரை பொதுப்பட்டமாக மாற்றாமல், உடன்படிக்கைப் பெயராக ஒலிபெயர்க்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற நிலையான வெளிப்பாடு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர் / இஸ்ரவேலின் பிள்ளைகள்
  rationale: மூலத்தின் இலக்கண ஆண்பால் வடிவத்தையும் பாரம்பரிய உறவுமுறை உருவகத்தையும் பாதுகாக்கிறது; அதன் மக்கள் முழுவதையும் குறிக்கும் பரந்த பயன்பாடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. ஆசாரிய உடையின் தொழில்நுட்பச் சூழலைத் தெளிவாக்க ‘தோள்பட்டைகள்’ பயன்படுத்தப்பட்டுள்ளது; ‘ஏபோத்’ என்ற சிறப்புச் சொல் ஒலிபெயர்க்கப்பட்டுள்ளது.
