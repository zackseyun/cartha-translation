source:
  edition: WLC
  text: וַ/יַּ֛עַשׂ אֶת מְעִ֥יל הָ/אֵפֹ֖ד מַעֲשֵׂ֣ה אֹרֵ֑ג כְּלִ֖יל תְּכֵֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/022.yaml
  text: And he made the robe of the ephod[a], the work of a weaver[b], all of blue.
translation:
  language: ta
  text: அவன் ஏபோதின் மேலங்கியை நெசவாளரின் வேலைப்பாடாக, முழுவதும் நீலநிறத்தில் செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவன் செய்தான்
  rationale: வாவ் தொடர்வினையுடன் வரும் עשה அடுத்த நிகழ்ச்சியைத் தொடர்கிறது; தமிழில் இயல்பான கதைநடை வரிசையை வாக்கிய ஒழுங்கே உணர்த்துவதால் ‘அவன் செய்தான்’ என வழங்கப்பட்டது.
- source_word: מְעִיל
  choice: அங்கி
  rationale: இது மேலணியும் நீளமான உடையைச் சுட்டுகிறது; ஆசாரிய உடைச் சூழலில் ‘அங்கி’ இயல்பாகவும் மரியாதைமிக்கதாகவும் உள்ளது.
- source_word: הָאֵפֹד
  choice: ஏபோதின்
  rationale: אֵפֹד ஆசாரியருக்குரிய தனிப்பட்ட உடையைக் குறிக்கும் தொழில்நுட்பச் சொல்; துல்லியமான எளிய தமிழ் இணை இல்லாததால் ஒலிபெயர்க்கப்பட்டு, எபிரேய உறவுநிலை ‘ஏபோதின் அங்கி’ எனக் காக்கப்பட்டது.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: நெசவாளரின் வேலையாக
  rationale: சொற்றொடரின் நேரடியான பொருள் ‘நெசவாளரின் வேலை’; மூலத்தில் இல்லாத ‘திறமையான’ போன்ற பண்பைச் சேர்க்காமல் கைவினைச் செயலைப் பாதுகாக்கிறது.
- source_word: כְּלִיל
  choice: முழுவதும்
  rationale: ஆடை முழுமையாக ஒரே நிறத்தில் இருந்ததைக் குறிக்கும் நிறைவு உணர்வை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: תְּכֵלֶת
  choice: நீலநிறத்தில்
  rationale: இங்கு அந்தத் தனிச்சிறப்பான நீலச் சாயமிட்ட நூற்பொருளால் ஆடை முழுவதும் உருவாக்கப்பட்டதைக் குறிக்கிறது; ஆனால் இவ்வசனத்தில் ‘நூல்’ வெளிப்படையாக இல்லாததால் அதைச் சேர்க்காமல் நிறத்தைச் சுட்டுகிறது.
