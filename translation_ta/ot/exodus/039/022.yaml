translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடை. ‘ஏபோது’ என்ற வழக்கமான வேதாகமத் தொழில்நுட்பச் சொல் தக்கவைக்கப்பட்டது; மூலத்தின் கைவினைச் சொற்றொடரும் ஆடையின் முழுமையும் வெளிப்படையாகப் பாதுகாக்கப்பட்டன.
