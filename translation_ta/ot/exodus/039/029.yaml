translation:
  language: ta
  text: மெல்லிய முறுக்கப்பட்ட சணல் நூலாலும், நீல, ஊதா, கருஞ்சிவப்பு நூல்களாலும் பூத்தையல் கலைஞரின் வேலைப்பாடாக இடைக்கச்சையைச் செய்தார்கள்; யாவே மோசேக்குக் கட்டளையிட்டபடியே செய்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאַבְנֵט
  choice: இடைக்கச்சை
  rationale: ஆசாரிய உடையுடன் இடுப்பில் அணியப்படும் நீண்ட பட்டையைக் குறிக்கிறது. ‘இடைக்கச்சை’ என்பது சூழலையும் உடையின் தன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: மெல்லிய முறுக்கு நார்ப்பட்டு நூல்
  rationale: שֵׁשׁ மெல்லிய நார்ப்பட்டையும், מָשְׁזָר முறுக்கப்பட்ட அல்லது திரிக்கப்பட்ட நூலையும் குறிக்கின்றன; இரு கூறுகளும் மொழிபெயர்ப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: תְכֵלֶת
  choice: நீலநிற நூல்
  rationale: திருவுறைவிடத் துணிகளில் பயன்படுத்தப்பட்ட மதிப்புமிக்க நீலச் சாயமிட்ட நூலைக் குறிக்கிறது; தமிழ் தொடரில் பொருளைத் தெளிவுபடுத்த ‘நூல்’ சேர்க்கப்பட்டுள்ளது.
- source_word: אַרְגָּמָן
  choice: ஊதாநிற நூல்
  rationale: சாயமிட்ட விலையுயர்ந்த ஊதாநிறத் துணிநூலுக்கான வழக்கமான, தெளிவான மொழிபெயர்ப்பு.
- source_word: תוֹלַעַת שָׁנִי
  choice: சிவப்புநிற நூல்
  rationale: பூச்சியிலிருந்து பெறப்பட்ட சாயத்தால் நிறமூட்டப்பட்ட செந்நிற அல்லது கருஞ்சிவப்பு நூலை இச்சொற்றொடர் குறிக்கிறது. பொதுவாசகருக்குத் தெளிவாக ‘சிவப்புநிற நூல்’ பயன்படுத்தப்பட்டுள்ளது; மாற்று நிறவிளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: பூத்தையல் கலைஞரின் கைவினை
  rationale: வண்ண நூல்களால் அலங்கார வேலை செய்யும் திறமையான துணிக்கலைஞரின் பணியைச் சுட்டுகிறது; கலைஞரையும் கைவினைத் தன்மையையும் இம்மொழியாக்கம் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பால் மாற்றாமல், எபிரெயத் திருப்பெயரான יהוה என்பதன் பரவலாக அறியப்படும் தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: யாவே மோசேக்குக் கட்டளையிட்டபடியே
  rationale: இறைக் கட்டளைக்கு அப்படியே கீழ்ப்படிந்ததை வலியுறுத்தும் யாத்திராகமத்தின் திரும்பவரும் வாய்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, தனிப்பட்ட திருப்பெயரே உள்ளது. ஆகவே பெயரின் தன்மையைப் பாதுகாக்க ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், ஆனால் வழிபாட்டு உடைச் சூழலுக்கேற்ற கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனம் முந்தைய வாக்கியத்தின் பட்டியலைத் தொடர்ந்தாலும், தமிழில் தனிவசனமாக வாசிக்க உதவ ‘செய்தார்கள்’ என்பது சூழலிலிருந்து வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
