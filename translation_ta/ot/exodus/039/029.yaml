revisions:
- from: மெல்லிய முறுக்கு நார்ப்பட்டு நூல், நீலநிற நூல், ஊதாநிற நூல், சிவப்புநிற நூல்[b] ஆகியவற்றைக் கொண்டு, பூத்தையல் கலைஞரின் கைவினையாக இடைக்கச்சையையும்[a] செய்தார்கள்—யாவே மோசேக்குக் கட்டளையிட்டபடியே.
  to: மெல்லிய முறுக்கப்பட்ட சணல் நூலாலும், நீல, ஊதா, கருஞ்சிவப்பு நூல்களாலும் பூத்தையல் கலைஞரின் வேலைப்பாடாக இடைக்கச்சையைச் செய்தார்கள்; யாவே மோசேக்குக் கட்டளையிட்டபடியே செய்தார்கள்.
  rationale: ‘நார்ப்பட்டு’ என்பதற்குப் பதிலாக ‘சணல்’ வைத்து மூலத்தின் லினன் பொருளைத் துல்லியமாக்கியுள்ளேன். சாயமிட்ட பொருட்களைத் தமிழில் இயல்பான கூட்டுத்தொடராக அமைத்துள்ளேன். வசனத்தின் இறுதியில் உள்ள கீழ்ப்படிதல் வாய்பாடு செய்யும் செயலைச் சார்வதால், ‘செய்தார்கள்’ என்பதை மீண்டும் சேர்த்தல் தமிழில் தெளிவாகவும் மூலத்தின் வலியுறுத்தலுக்கு ஏற்றதாகவும் உள்ளது. அடிக்குறிப்பு அடையாளங்கள் முறையே இடைக்கச்சை[a], கருஞ்சிவப்பு[b] என்பவற்றோடு இணைக்கப்பட வேண்டும்.
