  revision_rationale: A single terminology correction replaces the potentially misleading ‘முடி’ with ‘மகுடம்’. The revised wording continues to represent the plate and holy crown as appositional terms, preserves the inscription’s concise dedicatory form, and keeps the stated alternative interpretation in the footnote.
