source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֛וּ אֶת צִ֥יץ נֵֽזֶר הַ/קֹּ֖דֶשׁ זָהָ֣ב טָה֑וֹר וַ/יִּכְתְּב֣וּ עָלָ֗י/ו מִכְתַּב֙ פִּתּוּחֵ֣י חוֹתָ֔ם קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/030.yaml
  text: They made the plate[a], the holy crown, of pure gold, and they inscribed on it, like the engraving of a seal, “Holy to Yahweh.”
translation:
  language: ta
  text: அவர்கள் தூய தங்கத்தால் பரிசுத்த மகுடமாகிய தகட்டைச் செய்து, அதன்மேல் முத்திரைச் செதுக்கலைப்போல், “யாவேக்குப் பரிசுத்தம்”[a] என்று பொறித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்குப் பரிசுத்தமானது.”
    reason: קֹדֶשׁ என்ற சொல்லை அர்ப்பணிக்கப்பட்ட பொருளின் பண்பைக் குறிக்கும் வகையிலும் புரிந்துகொள்ள முடியும்.
lexical_decisions:
- source_word: צִיץ
  choice: பட்டம்
  rationale: ஆசாரிய உடைச் சூழலில் இது தலைப்பாகையுடன் இணைக்கப்பட்ட தங்கப் பட்டத்தைக் குறிக்கிறது; மலர் அல்லது அலங்காரப் பொருள் என்ற அடிப்படைப் பொருளை இங்கு எடுத்துக்கொள்ளவில்லை.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: பரிசுத்த முடி
  rationale: נֵזֶר என்பது அர்ப்பணிப்பைக் குறிக்கும் முடி அல்லது மகுடம்; ‘பரிசுத்த முடியாகிய பட்டம்’ என்ற அமைப்பு இரு பெயர்ச்சொற்களையும் இணைப்புச் சமன்பாட்டுடன் காக்கிறது.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கத்தால்
  rationale: பொருளின் தரத்தையும் சடங்குசார் தூய்மையின் நிழற்பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּכְתְּבוּ עָלָיו
  choice: அதன்மேல் ... என்று பொறித்தார்கள்
  rationale: வினைச்சொல் அடிப்படையில் ‘எழுதினார்கள்’ என்றாலும், தங்கப் பட்டத்தின் மேல் முத்திரைச் செதுக்கல் முறையில் எழுதப்பட்டதை அடுத்த சொற்றொடர் தெளிவாக்குவதால், இயல்பான தமிழில் ‘பொறித்தார்கள்’ பொருத்தமானது.
- source_word: מִכְתַּב פִּתּוּחֵי חוֹתָם
  choice: முத்திரைச் செதுக்கலைப்போல்
  rationale: எழுத்தின் செய்முறையை—முத்திரையில் எழுத்துகள் செதுக்கப்படுவதைப் போன்ற வேலைப்பாட்டை—சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: קֹדֶשׁ לַיהוָה
  choice: யாவேக்குப் பரிசுத்தம்
  rationale: எபிரெயச் சொற்றொடரின் சுருக்கமான அர்ப்பணிப்பு வாசகத்தையும், קֹדֶשׁ என்பதன் பெயர்ச்சொல் தன்மையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் ஏற்ற தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- issue: קֹדֶשׁ לַיהוָה என்ற அர்ப்பணிப்பு வாசகம்
  choice: யாவேக்குப் பரிசுத்தம்
  alternative: யாவேக்குப் பரிசுத்தமானது
  rationale: קֹדֶשׁ பெயர்ச்சொல்லாக ‘பரிசுத்தம்’ என்றும், பொருள் அர்ப்பணிக்கப்பட்ட நிலையைக் குறிக்கும் வகையில் ‘பரிசுத்தமானது’ என்றும் புரிந்துகொள்ள முடியும்; முதன்மை உரை மூலத்தின் சுருக்கமான பெயர்ச்சொல் வடிவைக் காக்கிறது, மாற்று புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குத் தெளிவான, மரியாதைமிக்க நடை. ஆசாரிய உடை தொடர்பான தொழில்நுட்பச் சொற்கள் தேவையற்ற பழமையாக்கமின்றி வழங்கப்பட்டுள்ளன.
