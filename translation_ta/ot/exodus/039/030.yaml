revisions:
- from: அவர்கள் தூய தங்கத்தால் பரிசுத்த முடியாகிய பட்டத்தைச் செய்து, அதன்மேல் முத்திரைச் செதுக்கலைப்போல், “யாவேக்குப் பரிசுத்தம்”[a] என்று பொறித்தார்கள்.
  to: அவர்கள் தூய தங்கத்தால் பரிசுத்த மகுடமாகிய தகட்டைச் செய்து, அதன்மேல் முத்திரைச் செதுக்கலைப்போல், “யாவேக்குப் பரிசுத்தம்”[a] என்று பொறித்தார்கள்.
  rationale: A single terminology correction replaces the potentially misleading ‘முடி’ with ‘மகுடம்’. The revised wording continues to represent the plate and holy crown as appositional terms, preserves the inscription’s concise dedicatory form, and keeps the stated alternative interpretation in the footnote.
