translation:
  language: ta
  text: 'இரண்டாவது வரிசையில்: நீலப்பச்சைக்கல்[a], நீலமணி, வைரம் ஆகியவை இருந்தன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பழங்கால இரத்தினக்கற்கள் பலவற்றின் துல்லியமான அடையாளம் உறுதியில்லை. נֹפֶךְ என்பதை ‘மரகதம்’ அல்லது ‘செம்மணி’ என்றும், יָהֲלֹם என்பதை ‘பதுமராகம்’ அல்லது ‘ஜாஸ்பர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: வரிசையில்
  rationale: மார்ப்பதக்கத்தில் பதிக்கப்பட்ட கற்களின் சூழலில் טוּר என்பது கற்களின் வரிசையைக் குறிக்கிறது. முந்தைய வசனத்திலிருந்து தொடரும் பட்டியலை இயல்பான தமிழில் தர இடவேற்றுமை பயன்படுத்தப்பட்டது.
- source_word: הַ/שֵּׁנִי
  choice: இரண்டாவது
  rationale: இது ‘இரண்டாவது’ என்று பொருள்படும் வரிசை எண்.
- source_word: נֹפֶךְ
  choice: நீலப்பச்சைக்கல்
  rationale: இந்தப் பழங்கால இரத்தினக்கல்லின் துல்லியமான அடையாளம் உறுதியில்லை. ‘Turquoise’ என்பதற்கான தெளிவான நவீனத் தமிழ்ப் பெயராக ‘நீலப்பச்சைக்கல்’ தேர்ந்தெடுக்கப்பட்டது; மாற்று அடையாளங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: סַפִּיר
  choice: நீலமணி
  rationale: סַפִּיר என்பதற்கான வழக்கமான தமிழ் இணை ‘நீலமணி’; பழங்காலக் கல் நவீன கனிமவியல் வகைப்பாட்டுடன் முற்றிலும் ஒன்றாக இல்லாமலும் இருக்கலாம்.
- source_word: וְ/יָהֲלֹם
  choice: வைரம்
  rationale: יָהֲלֹם என்பதன் அடையாளமும் உறுதியற்றது. ‘வைரம்’ என்பது பரவலான மரபுவழிப் பொருத்தம்; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
