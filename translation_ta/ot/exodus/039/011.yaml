    issue: The lexical-alternative footnote renders the alternative ‘jasper’ as ‘சூரியகாந்தக்கல்.’
    rationale: This is not a reliable modern Tamil designation for jasper and can misidentify the alternative. Use the established loan form ‘ஜாஸ்பர்’ (or an equally clear Tamil equivalent) so that the note accurately preserves the source/English audit trail’s uncertainty.
