translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயப் பட்டியலின் சுருக்கத்தைப் பேணியபடி, தமிழ் வாக்கியம் நிறைவுற ‘ஆகியவை இருந்தன’ சேர்க்கப்பட்டுள்ளது.
