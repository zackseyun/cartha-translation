  source_fidelity: மூலத்தின் பொருட்கள் வரிசையும், வெண்கலப் பலிபீடம், அதனுடன் தொடர்புடைய மிக்க்பார், பலிபீடத்தின் தண்டுகள்/உபகரணங்கள், கழுவும் தொட்டி, அதன் ஆதாரம் என்ற கூறுகளும் காக்கப்பட்டுள்ளன. ஆனால் ‘சல்லடை’ பொதுவாகச் சலிப்பதற்கான கருவியைக் குறிப்பதால், பலிபீடத்தின் வலைவடிவ உலோக அமைப்பான מִכְבָּר-ஐத் துல்லியமாகக் காட்டாது. ‘தாங்கி’ என்பதும் כַּנּוֹ குறிக்கும் அடித்தளம் அல்லது நிலைநிறுத்தும் தளத்தைவிடக் குறுகலாகவும் இயல்பற்றதாகவும் உள்ளது.
  naturalness: பட்டியல் நடை இயல்பாக உள்ளது. ஆயினும் ‘வெண்கல வலைப்பின்னல்’ மற்றும் ‘அடித்தளம்’ நவீன நிலையான தமிழில் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகின்றன. ‘பலிபீடத்தின் தண்டுகள்’ என வெளிப்படையாகக் கூறுவது, அருகிலுள்ள ‘வலைப்பின்னல்’ என்பதோடு உடைமைப் பெயரைத் தவறாக இணைத்துக்கொள்ளும் வாய்ப்பையும் தவிர்க்கிறது.
  terminology: ‘பலிபீடம்’, ‘வெண்கலம்’, ‘தண்டுகள்’, ‘உபகரணங்கள்’ ஆகியவை பொருத்தமானவை. כִּיּוֹருக்கான ‘கழுவும் தொட்டி’ சூழலுக்கு ஏற்ற நவீனச் சொல்லாக உள்ளது. מִכְבָּருக்குப் ‘வலைப்பின்னல்’ தேர்ந்தெடுக்கப்படுகிறது; குறிப்பு வழியாக ‘வலைச்சட்டம்’ என்ற நெருங்கிய மாற்றும் தரப்படுகிறது. כַּנּוֹவுக்கு ‘அடித்தளம்’ பாதுகாப்பான, இயல்பான தேர்வு.
