  text: the bronze altar[a], and the bronze grating that was for it, its poles, and all its utensils; the basin and its stand[b];
translation:
  language: ta
  text: வெண்கலப் பலிபீடத்தையும், அதற்குரிய வெண்கல வலைப்பின்னலையும்[a], பலிபீடத்தின் தண்டுகளையும் அதன் எல்லா உபகரணங்களையும், கழுவும் தொட்டியையும் அதன் அடித்தளத்தையும்[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெண்கல வலைச்சட்டம்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அதன் தாங்குதளம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח
  choice: பலிபீடம்
  rationale: இச்சொல் பொதுவாகப் ‘பலிபீடம்’ எனப் பொருள்படும். சூழலில் இது தகனபலிப் பீடமாக இருந்தாலும், எபிரெய மூலத்தில் இவ்வசனத்தில் அந்த விரிவான பெயர் மீண்டும் இடம்பெறவில்லை.
- source_word: הַנְּחֹשֶׁת
  choice: வெண்கலம்
  rationale: נְחֹשֶׁת செம்பையோ வெண்கலத்தையோ குறிக்கக்கூடும்; திருக்கூடாரப் பொருட்களின் இச்சூழலில் ‘வெண்கலம்’ இயல்பானதும் மரபாக நிலைபெற்றதுமான தேர்வு.
- source_word: מִכְבַּר
  choice: சல்லடை
  rationale: பலிபீடத்துடன் இணைந்திருந்த வலைவடிவ உலோக அமைப்பைக் குறிக்கிறது. ‘சல்லடை’ அதன் துளையிட்ட அல்லது பின்னல் வடிவ அமைப்பை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר לוֹ
  choice: அதற்குரிய
  rationale: இத்தொடர் சல்லடை பலிபீடத்துடன் தொடர்புடையது என்பதைச் சொல்கிறது; அது எங்கு பொருத்தப்பட்டிருந்தது என்பதை மூலத்தைவிடத் துல்லியமாக நிர்ணயிக்காமல் அந்தத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: בַּדָּיו
  choice: அதன் தண்டுகள்
  rationale: திருக்கூடாரப் பொருட்களைச் சுமப்பதற்குப் பயன்படுத்திய நீண்ட தண்டுகளைக் குறிக்கிறது. ‘தண்டுகள்’ சுருக்கமான, இயல்பான நவீனத் தமிழ்.
- source_word: כָּל־כֵּלָיו
  choice: அதன் எல்லா உபகரணங்கள்
  rationale: பலிபீடப் பணிக்கான பலவகைப் பொருட்களையும் கருவிகளையும் உள்ளடக்கும் அகன்ற சொல்லாக இருப்பதால் ‘உபகரணங்கள்’ பொருத்தமானது.
- source_word: כִּיּוֹר
  choice: கழுவும் தொட்டி
  rationale: ஆசாரியர்கள் கழுவுவதற்கான பாத்திரம் என்பதைக் காலத்திற்கேற்ற தெளிவான தமிழில் தெரிவிக்கிறது; வெறும் ‘தொட்டி’ என்பதைவிடச் சூழல் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כַּנּוֹ
  choice: அதன் தாங்கி
  rationale: தொட்டியைத் தாங்கிய அடிப்பகுதி அல்லது நிலைப்பாட்டைக் குறிக்கிறது. ‘தாங்கி’ அதன் செயல்பாட்டைத் தெளிவாகக் கூறுகிறது; ‘அடித்தளம்’ என்பதும் சாத்தியம்.
