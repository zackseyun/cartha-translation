translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு ஆடையின் சூழலுக்கு ஏற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘அங்கி’ என்பது מְעִיל எனும் ஆசாரிய உடையைக் குறிக்கிறது. எபிரெயத்தின் சுருக்கமான ‘மாதுளம்பழங்கள்’ என்ற உருவகப் பெயர் தமிழில் தவறாகப் புரியாதபடி ‘வடிவ அலங்காரங்கள்’ எனத் தெளிவாக்கப்பட்டு, நேரடிச் சொல்லாக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
