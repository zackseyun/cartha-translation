  text: And they made pomegranates of blue and purple and scarlet yarn[a], twisted[b], on the hem of the robe.
translation:
  language: ta
  text: அவர்கள் அந்த அங்கியின் கீழ் ஓரத்தில் நீலம், ஊதா, கருஞ்சிவப்பு நிற முறுக்கப்பட்ட நூல்களால் மாதுளம்பழ வடிவ அலங்காரங்களை[a]ச் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக ‘மாதுளம்பழங்கள்’ என்று உள்ளது; அவற்றின் வடிவில் செய்யப்பட்ட அலங்காரங்களையே இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: அவர்கள் செய்தார்கள்
  rationale: עשה என்பதன் வழக்கமான தொடர் உரை வடிவம்; எளிய, இயல்பான தமிழில் செயலை நேரடியாகக் கூறுகிறது.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: அந்த அங்கியின் கீழ் ஓரத்தில்
  rationale: שׁוּלֵי என்பது ஆடையின் கீழ்ப்பகுதி அல்லது ஓரத்தைக் குறிக்கிறது; עַל இங்கு அமைவிடத்தைக் காட்டுகிறது.
- source_word: רִמּוֹנֵי
  choice: மாதுளம்பழ வடிவ அலங்காரங்களை
  rationale: எபிரெயம் நேரடியாக ‘மாதுளம்பழங்கள்’ என்று கூறினாலும், இங்கு உண்மையான பழங்கள் அல்லாமல் ஆடையில் செய்யப்பட்ட வடிவ அலங்காரங்கள் குறிக்கப்படுகின்றன; இயல்பான தமிழில் பொருளைத் தெளிவாக்குகிறது.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: நீலம், ஊதா, கருஞ்சிவப்பு நிற நூல்களால்
  rationale: இவை திருப்பணிக் கூடாரத் துணி வேலைகளில் பயன்படுத்தப்பட்ட வண்ணப் பொருட்கள்; சூழலின் அடிப்படையில் ‘நூல்கள்’ சேர்க்கப்பட்டு மூன்று நிறங்களும் தெளிவாக வழங்கப்படுகின்றன.
- source_word: מָשְׁזָר
  choice: முறுக்கப்பட்ட
  rationale: நூல் முறுக்கப்பட்ட அல்லது திரிக்கப்பட்ட விதத்தில் செய்யப்பட்டதைக் குறிக்கும் பெயரடை; தற்போதைய தமிழில் ‘முறுக்கப்பட்ட’ தெளிவானது.
