  text: a bell and a pomegranate[a], a bell and a pomegranate, around the hem of the robe, all around, for ministering, just as Yahweh had commanded Moses.
translation:
  language: ta
  text: ஒரு மணி, ஒரு மாதுளை, ஒரு மணி, ஒரு மாதுளை என, மேலங்கியின் கீழ் விளிம்பைச் சுற்றிலும், ஊழியம் செய்வதற்காக அமைத்தார்கள்[a]; யாவே மோசேக்குக் கட்டளையிட்டபடியே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணிவிடை செய்வதற்காக” அல்லது “சேவை செய்வதற்காக.” எபிரெய மொழியிலுள்ள முடிவிலி வினை வடிவம், ஆசாரிய ஊழியத்திற்காக இந்த மேலங்கி பயன்படும் நோக்கத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: மணி
  rationale: இச்சொல் மணியைக் குறிக்கிறது. முந்தைய வசனங்களில் அது பொன்னால் செய்யப்பட்டதாகக் கூறப்பட்டாலும், இவ்வசனத்தில் ‘பொன்’ வெளிப்படையாக இல்லை.
- source_word: רִמּוֹן
  choice: மாதுளை
  rationale: சொல்லின் நேர்ப்பொருள் ‘மாதுளை’; இச்சூழலில் அது மாதுளை வடிவ அலங்காரத்தைக் குறிக்கிறது.
- source_word: עַל שׁוּלֵי הַמְּעִיל סָבִיב
  choice: அங்கியின் கீழ் ஓரத்தைச் சுற்றிலும்
  rationale: שׁוּלֵי என்பது ஆடையின் கீழ் விளிம்புகளையும், סָבִיב அவை முழுவதையும் சுற்றிய அமைப்பையும் குறிக்கின்றன.
- source_word: לְשָׁרֵת
  choice: ஊழியம் செய்வதற்காக
  rationale: எபிரெய முடிவிலி வடிவம் நோக்கத்தைக் காட்டுகிறது; இங்கு ஆசாரியப் பணியை இயல்பாகக் குறிக்க ‘ஊழியம் செய்வதற்காக’ பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறை பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவத்தில் தருகிறது.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: யெகோவா மோசேக்குக் கட்டளையிட்டபடியே
  rationale: முன்னர் வழங்கப்பட்ட இறைக் கட்டளைக்கு வேலை ஒத்திருந்ததை இத்தொடர் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப் பெயரை ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றாமல் பாதுகாக்கிறது; நவீன தமிழில் பரவலாக அறியப்படும் பெயர் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: לְשָׁרֵת என்பதன் நோக்கப் பொருள்
  choice: ஊழியம் செய்வதற்காக
  alternative: பணிவிடை செய்வதற்காக
  rationale: இது பொதுவான சேவையைக் காட்டிலும் திருவாசஸ்தல ஆசாரியப் பணியைச் சுட்டுகிறது; அதேவேளை எந்தக் குறிப்பிட்ட சமய மரபின் தொழில்நுட்பப் பொருளையும் திணிக்கவில்லை.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ். மணியும் மாதுளையும் மாறிமாறி அமைந்த வரிசையை மூலத்தின் மறுபதிப்பு காக்கிறது. எபிரெய வாக்கியம் வினையற்ற தொடராக இருந்தாலும், தமிழ் வாக்கியம் நிறைவுபெற சூழலிலிருந்து ‘அமைத்தார்கள்’ மற்றும் ‘செய்தார்கள்’ இயல்பாக நிரப்பப்பட்டுள்ளன.
