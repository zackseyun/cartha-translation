  text: וַ/יִּרְכְּס֣וּ אֶת הַ/חֹ֡שֶׁן מִ/טַּבְּעֹתָי/ו֩ אֶל טַבְּעֹ֨ת הָ/אֵפֹ֜ד בִּ/פְתִ֣יל תְּכֵ֗לֶת לִֽ/הְיֹת֙ עַל חֵ֣שֶׁב הָ/אֵפֹ֔ד וְ/לֹֽא יִזַּ֣ח הַ/חֹ֔שֶׁן מֵ/עַ֖ל הָ/אֵפֹ֑ד כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/021.yaml
  text: They fastened the breastpiece by its rings to the rings of the ephod with a cord of blue[a], so that it would be on the skillfully woven band of the ephod, and so that the breastpiece would not come loose from on the ephod[b], just as Yahweh had commanded Moses.
translation:
  language: ta
  text: அவர்கள் மார்ப்பதக்கத்தை அதன் வளையங்கள் வழியாக ஏபோத்தின் வளையங்களோடு நீல நிறக் கயிற்றால்[a] கட்டினர். அது ஏபோத்தின் வேலைப்பாடுமிக்க இடைக்கச்சின்மேல்[b] இருக்கவும், மார்ப்பதக்கம் ஏபோத்தின்மேலிருந்து விலகாமல் இருக்கவும் இவ்வாறு செய்தனர். யாவே மோசேக்குக் கட்டளையிட்டபடியே அவர்கள் செய்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீலக் கயிற்றால்.”
    reason: תְּכֵלֶת என்பதை நிறப்பண்பாகவோ நீல நிறப் பொருளைக் குறிக்கும் பெயர்ச்சொல்லாகவோ இயல்பாக வழங்கலாம்.
  - marker: b
    text: அல்லது, “ஏபோத்தின் நெய்யப்பட்ட பட்டையின்மேல்.” இந்த எபிரெயச் சொல் ஏபோத்துடன் இணைந்த அலங்கார இடைக்கச்சு அல்லது பட்டையைக் குறிக்கிறது.
    reason: חֵשֶׁב என்ற ஆடைத் தொழில்நுட்பச் சொல்லின் துல்லிய வடிவம் சூழலின்படி ‘இடைக்கச்சு’ அல்லது ‘நெய்யப்பட்ட பட்டை’ என அமையலாம்.
lexical_decisions:
- source_word: וַיִּרְכְּסוּ
  choice: கட்டினர்
  rationale: ஆடையின் பகுதிகளை வளையங்கள் வழியாக நூற்கயிற்றால் இணைத்து உறுதிப்படுத்துவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַחֹשֶׁן
  choice: மார்ப்பதக்கம்
  rationale: இது போர்க் கவசமல்ல; கற்கள் பதிக்கப்பட்ட பிரதான ஆசாரியரின் மார்பணியைக் குறிக்கும் என்பதால் இச்சொல் பொருத்தமானது.
- source_word: מִטַּבְּעֹתָיו ... אֶל טַבְּעֹת הָאֵפֹד
  choice: அதன் வளையங்களிலிருந்து ஏபோத்தின் வளையங்களோடு
  rationale: மார்ப்பதக்கத்தின் வளையங்களுக்கும் ஏபோத்தின் வளையங்களுக்கும் இடையிலான இணைப்பை, எபிரெய முன்னிடைச்சொற்களின் திசைநுணுக்கத்துடன் வெளிப்படுத்துகிறது.
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: நீல நிற நூற்கயிற்றால்
  rationale: פְתִיל என்பதன் நூல் அல்லது மெல்லிய கயிறு என்ற பொருளையும், תְּכֵלֶת குறிக்கும் நீல நிறத்தையும் தெளிவாகக் கொண்டுவருகிறது.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: ஏபோத்தின் வேலைப்பாடுமிக்க இடைக்கச்சு
  rationale: ஏபோத்துடன் இணைந்த அலங்கார நெய்த பட்டை அல்லது இடைக்கச்சைக் குறிக்கும் தொழில்நுட்பச் சொல்லை வாசகருக்குப் புரியும் வகையில் தருகிறது.
- source_word: וְלֹא יִזַּח
  choice: விலகிவிடாமல்
  rationale: தன் இடத்திலிருந்து நழுவுதல் அல்லது பிரிதல் என்ற பொருளை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵעַל הָאֵפֹד
  choice: ஏபோத்திலிருந்து
  rationale: மார்ப்பதக்கம் ஏபோத்தின் மேலிருந்த தன் இடத்திலிருந்து விலகாதிருப்பதை இயல்பான தமிழில் கூறுகிறது; ‘மேலிருந்து’ என்ற நுணுக்கம் சூழலால் உணரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה-ஐ ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் தனிப்பட்ட இறைப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு ஆடைச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஏபோத்’ என்ற பண்பாட்டு ஆடைப்பெயர் ஒலிபெயர்க்கப்பட்டு, அரிதான தொழில்நுட்பச் சொல்லான חֵשֶׁב அடிக்குறிப்பால் விளக்கப்பட்டுள்ளது.
