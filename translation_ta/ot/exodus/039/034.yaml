- from: சிவப்புச் சாயமிட்ட செம்மறியாட்டுக் கடாக்களின் தோலால் செய்யப்பட்ட மூடுவிரிப்பு, தகாஷ் தோலால் செய்யப்பட்ட மூடுவிரிப்பு[a], மறைப்புத் திரைச்சீலை ஆகியவற்றையும்;
