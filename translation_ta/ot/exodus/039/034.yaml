  text: the covering of ram skins dyed red[a], the covering of fine leather, and the veil of the screen;
translation:
  language: ta
  text: சிவப்புச் சாயமிட்ட செம்மறியாட்டுக் கடாக்களின் தோல்களால் ஆன மூடுவிரிப்பு, தகாஷ் தோல்களால் ஆன மூடுவிரிப்பு[a], மறைப்புத் திரைக்கான திரைச்சீலை ஆகியவற்றையும்;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தகாஷ்” என்பதற்கான எபிரெயச் சொல் எந்த உயிரினத்தையோ தோல் வகையையோ குறிக்கிறது என்பது உறுதியாகத் தெரியவில்லை. இது ஒரு குறிப்பிட்ட விலங்கின் தோலைக் குறிக்கலாம்; பாரம்பரியமாகக் கடற்பசு அல்லது ஓங்கிலின் தோல் என்றும், ஒரு வகை உயர்தரத் தோல் என்றும் விளக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְסֵה
  choice: மூடுவிரிப்பு
  rationale: மூடுவதற்குப் பயன்படும் பொருளைக் குறிக்கும் பெயர்ச்சொல்லை, கூடாரச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது; அதன் அமைப்பை தேவையின்றி மிகத் துல்லியமாக வரையறுக்கவில்லை.
- source_word: עוֹרֹת הָאֵילִם הַמְאָדָּמִים
  choice: சிவப்புச் சாயமிட்ட செம்மறியாட்டுக் கடாக்களின் தோல்
  rationale: עוֹרֹת என்பதன் ‘தோல்கள்’, אֵילִם என்பதன் ஆண் செம்மறியாடுகள், הַמְאָדָּמִים என்பதன் சிவப்பாக்கப்பட்ட அல்லது சாயமிடப்பட்ட நிலை ஆகியவற்றைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: עֹרֹת הַתְּחָשִׁים
  choice: தகாஷ் தோல்
  rationale: תְּחָשׁ குறிக்கும் உயிரினம் அல்லது தோல் வகை உறுதியாகத் தெரியாததால், குறிப்பிட்ட ஓர் உயிரினத்தை ஊகிக்காமல் எபிரெயச் சொல்லை ஒலிபெயர்க்கிறது; மாற்று விளக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: פָּרֹכֶת
  choice: திரைச்சீலை
  rationale: திருவாசஸ்தலத்தின் உட்பகுதியைப் பிரித்து மறைக்கும் திரையைக் குறிக்கும் சொல்; பொதுவான வாசகருக்குப் புரியும் இயல்பான தமிழ்.
- source_word: הַמָּסָךְ
  choice: மறைப்புத்
  rationale: மறைக்க அல்லது பிரிக்கப் பயன்படும் தொங்குதிரை என்ற கருத்தைத் தருகிறது; פָּרֹכֶת உடனான எபிரெயத் தொடர்பைச் சுருக்கமான ‘மறைப்புத் திரைச்சீலை’ என்ற தொடரில் பாதுகாக்கிறது.
