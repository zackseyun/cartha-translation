  text: וְ֠/הָ/אֲבָנִים עַל שְׁמֹ֨ת בְּנֵי יִשְׂרָאֵ֥ל הֵ֛נָּה שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל שְׁמֹתָ֑/ם פִּתּוּחֵ֤י חֹתָם֙ אִ֣ישׁ עַל שְׁמ֔/וֹ לִ/שְׁנֵ֥ים עָשָׂ֖ר שָֽׁבֶט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/014.yaml
  text: And the stones corresponded to the names of the sons of Israel[a], twelve according to their names, engraved like a signet, each according to its name[c][b], for the twelve tribes.
translation:
  language: ta
  text: அந்தக் கற்கள் இஸ்ரவேலின் மகன்களின்[b] பெயர்களுக்கு ஏற்ப இருந்தன[a]; அவை அவர்களுடைய பெயர்களின்படி பன்னிரண்டு. முத்திரைப் பொறிப்புகளைப் போல்[c], ஒவ்வொன்றிலும் அதற்குரிய பெயர் செதுக்கப்பட்டிருந்தது; அவை பன்னிரண்டு கோத்திரங்களுக்குரியவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலின் மகன்களின் பெயர்களைத் தாங்கியிருந்தன.’ எபிரெய முன்னிடைச்சொல் நெருங்கிய தொடர்பையோ பொருத்தத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘இஸ்ரவேலின் மகன்கள்’ என்பது இஸ்ரவேலிடமிருந்து வந்த மக்களைக் குறிக்கும் பாரம்பரிய உடன்படிக்கைப் பெயர்.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘முத்திரைச் செதுக்குகளாக.’ இச்சொற்றொடர் முத்திரையில் எழுத்துகளை வெட்டும் முறையைப் போன்ற பொறிப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: அந்தக் கற்கள்
  rationale: הָאֲבָנִים என்பதன் நேரடியான பொருள் ‘கற்கள்’; மார்ப்பதக்கத்தில் பதிக்கப்பட்ட விலையுயர்ந்த கற்கள் என்பது சூழலால் தெளிவாகிறது, எனவே மூலச்சொல்லைவிடக் குறிப்பான ‘இரத்தினக் கற்கள்’ என்று மொழிபெயர்க்கப்படவில்லை.
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களுடைய பெயர்களுக்கு ஏற்ப அமைந்திருந்தன
  rationale: עַל இங்கு இடத்தைக் குறிக்கும் ‘மேல்’ என்பதைவிட பெயர்களுடனான தொடர்பு அல்லது பொருத்தத்தைக் குறிக்கிறது. ‘பெயர்களுக்கு ஏற்ப அமைந்திருந்தன’ என்பது அந்த உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் குடும்ப மற்றும் உடன்படிக்கைச் சார்ந்த வடிவத்தைத் தக்கவைக்கிறது; பொதுவான ‘இஸ்ரவேலர்’ என்ற மொழியாக்கத்தைவிட இது மூலத்திற்கு நெருக்கமானது.
- source_word: הֵנָּה שְׁתֵּים עֶשְׂרֵה עַל שְׁמֹתָם
  choice: அவர்களுடைய பெயர்களின்படி அவை பன்னிரண்டு
  rationale: הֵנָּה என்ற பன்மைப் பெண்பால் சுட்டுப்பெயர் கற்களைக் குறிப்பதையும், שְׁתֵּים עֶשְׂרֵה எண்ணிக்கையை வலியுறுத்துவதையும் வெளிப்படையாகக் காட்டுகிறது.
- source_word: פִּתּוּחֵי חֹתָם
  choice: முத்திரைச் செதுக்குபோல் செதுக்கப்பட்டிருந்தது
  rationale: இது முத்திரை அல்லது முத்திரை மோதிரத்தில் எழுத்துகள் வெட்டப்படும் முறையைச் சுட்டுகிறது. தமிழில் செய்முறையைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: ஒவ்வொன்றிலும் அதற்குரிய பெயர்
  rationale: אִישׁ இங்கு பகிர்வுப் பொருளில் ‘ஒவ்வொன்றும்’ என வருகிறது. பெயர் ஒவ்வொரு கல்லுக்கும் தொடர்புடையதாக இருப்பதை ‘அதற்குரிய பெயர்’ தெளிவுபடுத்துகிறது.
- source_word: לִשְׁנֵים עָשָׂר שָׁבֶט
  choice: பன்னிரண்டு கோத்திரங்களுக்குரியவை
  rationale: לְ குறிக்கும் தொடர்பை ‘குரியவை’ இயல்பாக வெளிப்படுத்துகிறது; שֵׁבֶט என்பதற்கு வேதாகமச் சூழலில் வழக்கமான ‘கோத்திரம்’ பயன்படுத்தப்பட்டுள்ளது.
