base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/038.yaml
  text: the gold altar[a], the anointing oil, the fragrant incense, and the screen for the entrance of the tent[c][b];
translation:
  language: ta
  text: பொன் பலிபீடத்தையும், அபிஷேக எண்ணெயையும், நறுமணத் தூபத்தையும்[a], கூடார வாசலுக்கான திரையையும்[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நறுமணப் பொருட்களாலான தூபம்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கூடார நுழைவிடத்துக்கான மறைப்புத் துணி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: பொன் பலிபீடம்
  rationale: எபிரெயச் சொற்றொடரில் ‘பொன்’ என்னும் பெயர்ச்சொல் பலிபீடத்தின் பொருளை அடைமொழிபோல் குறிக்கிறது; ‘பொன் பலிபீடம்’ இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: அபிஷேக எண்ணெய்
  rationale: அபிஷேகம் செய்வதற்குப் பயன்படுத்தப்படும் எண்ணெயைக் குறிக்கும் இணைப்புச் சொற்றொடர்; இச்சடங்குப் பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: நறுமணத் தூபம்
  rationale: קְטֹרֶת என்பது ‘தூபம்’; הַסַּמִּים என்பது நறுமணப் பொருட்கள் அல்லது வாசனைப் பொருட்களைக் குறிக்கிறது. ‘நறுமணத் தூபம்’ பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: מָסַךְ
  choice: திரை
  rationale: திருக்கூடாரச் சூழலில் நுழைவிடத்தில் தொங்கவிடப்படும் மறைப்புத் துணியைக் குறிக்கிறது; தமிழில் ‘திரை’ இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: פֶּתַח הָאֹהֶל
  choice: கூடார வாசலுக்கான
  rationale: פֶּתַח என்பது வாசல் அல்லது நுழைவிடம்; הָאֹהֶל என்பது கூடாரம். இங்கு திரை கூடார வாசலுக்குரியது என்பதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: וְאֵת ... וְאֵת ... וְאֵת ... וְאֵת
  choice: ஒவ்வொரு பட்டியல் உறுப்பிலும் ‘-ஐயும்’ இணைப்பு
  rationale: எபிரெயத்தில் மீண்டும் வரும் இணைப்பையும் நேரடிப் பொருள் குறியீட்டையும் தமிழின் இயல்பான பட்டியல் அமைப்பில் ஒவ்வொரு பொருளோடும் ‘-ஐயும்’ சேர்த்துப் பிரதிபலிக்கிறது.
