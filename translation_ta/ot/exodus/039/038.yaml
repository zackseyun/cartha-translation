  register: நவீனத் தரத் தமிழில், திருக்கூடாரப் பொருட்களின் பட்டியலுக்கேற்ற கண்ணியமான, எளிதில் புரியும் நடை. வசனம் முந்தைய தொடரின் ஒரு பகுதியாக இருப்பதால் இறுதியில் அரைப்புள்ளி வைக்கப்பட்டுள்ளது.
