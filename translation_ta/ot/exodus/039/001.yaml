base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/001.yaml
  text: And from the blue[a], the purple, and the scarlet yarn they made finely woven garments for ministering in the sanctuary, and they made the holy garments for Aaron, just as Yahweh had commanded Moses.
translation:
  language: ta
  text: நீல, ஊதா, கருஞ்சிவப்பு நூல்களால், பரிசுத்த இடத்தில் பணியாற்றுவதற்கான நுட்பமாக நெய்யப்பட்ட ஆடைகளைச் செய்தார்கள்.[a] யாவே மோசேக்குக் கட்டளையிட்டபடியே, ஆரோனுக்கான பரிசுத்த ஆடைகளையும் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணிக்கான ஆடைகள்.” எபிரெயச் சொற்றொடர் சிறப்புப் பயன்பாடுடையது; அது கூடாரப் பணியில் அந்த ஆடைகளுக்கிருந்த பயன்பாட்டையோ, அவை நுட்பமாகச் செய்யப்பட்ட விதத்தையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת הַשָּׁנִי
  choice: நீலநூல், ஊதாநூல், கருஞ்சிவப்புநூல் ஆகியவற்றால்
  rationale: கூடாரத் துணிநூல் சூழலில் இவை வண்ணமூட்டப்பட்ட நூல்களைக் குறிக்கின்றன. பண்டைய நிறச்சாயல்களை அளவுக்கு மீறித் துல்லியப்படுத்தாமல், இயல்பான தமிழ் வண்ணப்பெயர்களுடன் ‘நூல்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: בִגְדֵי שְׂרָד
  choice: நுட்பமாக நெய்யப்பட்ட ஆடைகள்
  rationale: שְׂרָד என்பதன் துல்லிய நுட்பப்பொருள் உறுதியற்றது; இது ஆடைகளின் நுட்பமான தயாரிப்பையோ அவற்றின் பணிப் பயன்பாட்டையோ சுட்டலாம். முதன்மை உரை துணிநூல் சூழலை வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  choice: பரிசுத்த இடத்தில் பணிசெய்வதற்கான
  rationale: לְשָׁרֵת வழிபாட்டுச் சார்ந்த அதிகாரப்பூர்வப் பணியைச் சுட்டுகிறது; בַּקֹּדֶשׁ இங்கு அருவமான பரிசுத்தத்தையல்ல, கூடாரத்தின் புனிதப் பரப்பைக் குறிக்கிறது. ‘பரிசுத்த இடம்’ அதன் பரப்பளவை தேவையின்றி சுருக்கவில்லை.
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: பரிசுத்த ஆடைகள்
  rationale: ஆரோனின் ஆசாரிய ஆடைகளுக்கான முறையான பெயரை நேரடியாகவும் தெளிவாகவும் காக்கிறது.
- source_word: לְאַהֲרֹן
  choice: ஆரோனுக்கான
  rationale: லாமேத் முன்னொட்டு இங்கு ஆரோனுக்கென்று நியமிக்கப்பட்ட பயன்பாட்டைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: யாவே மோசேக்குக் கட்டளையிட்டபடியே
  rationale: முன்னர் கொடுக்கப்பட்ட கட்டளைக்கேற்ப வேலை நிறைவேற்றப்பட்டதைத் தமிழில் இயல்பாக எடுத்துரைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை தனிப்பட்ட உடன்படிக்கைப் பெயரையே பயன்படுத்துகிறது. எனவே பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்து, மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: בִגְדֵי שְׂרָד என்பதன் தெளிவற்ற நுட்பப்பொருள்
  choice: நுட்பமாக நெய்யப்பட்ட ஆடைகள்
  alternative: பணிக்கான ஆடைகள்
  rationale: சொற்றொடர் ஆடைகளின் செய்நேர்த்தியையோ வழிபாட்டுப் பணிக்கான செயல்பாட்டையோ வலியுறுத்தக்கூடும். முதன்மை உரையில் துணிநூல் சார்ந்த பொருள் தேர்ந்தெடுக்கப்பட்டாலும், மற்ற சாத்தியம் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பணிசெய்தல்,’ ‘பரிசுத்த ஆடைகள்’ போன்ற சொற்கள் வழிபாட்டுச் சூழலின் முறையான தன்மையைத் தக்கவைக்கின்றன; எபிரெயச் சொற்றொடரின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
