  register: நவீன நிலையான தமிழில், மரியாதையும் தெளிவும் கொண்ட வேதாகம நடையில் மொழிபெயர்க்கப்பட்டது. இரத்தினப் பெயர்களின் வரலாற்று ஐயப்பாடும் இறுதி தொழில்நுட்பச் சொற்றொடரின் பொருள் நெகிழ்வும் அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
