base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/013.yaml
  text: 'and the fourth row: beryl[a], onyx, and jasper[b], mounted in settings of gold in their mountings.'
translation:
  language: ta
  text: 'நான்காவது வரிசையில்: படிகப்பச்சை[a], ஓனிக்ஸ், யஸ்பி ஆகிய கற்கள் இருந்தன; அவை தங்கப் பதிப்புகளில் தத்தமக்குரிய இடங்களில் பதிக்கப்பட்டிருந்தன.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தலைமை ஆசாரியரின் மார்ப்பதக்கத்தில் இருந்த பல இரத்தினங்களைத் துல்லியமாக அடையாளம் காண்பது உறுதியற்றது. இங்கே தரப்பட்டுள்ள ‘படிகப்பச்சை,’ ‘ஓனிக்ஸ்,’ ‘யஸ்பி’ ஆகியவை பொதுவாகப் பயன்படுத்தப்படும் மரபுவழி இணைப்பெயர்கள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவற்றுக்குரிய பதிப்புகளின்படி தங்கப் பதிப்புகளில் பதிக்கப்பட்டிருந்தன.” இறுதி எபிரெயச் சொற்றொடர் கைவினை சார்ந்த தொழில்நுட்ப மொழியாக இருப்பதால், கற்கள் அவற்றுக்கென அமைந்த குழிகளில் பொருத்தப்பட்ட விதத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: நான்காவது வரிசையில்
  rationale: மார்ப்பதக்கத்தின் இரத்தினப் பட்டியலில் טוּר என்பது கற்களின் வரிசையைக் குறிக்கிறது; இயல்பான தமிழ் வாக்கிய அமைப்புக்காக இடவேற்றுமை பயன்படுத்தப்பட்டது.
- source_word: תַּרְשִׁישׁ
  choice: படிகப்பச்சை
  rationale: இந்தப் பழங்கால இரத்தினத்தின் துல்லியமான அடையாளம் உறுதியற்றது. ‘படிகப்பச்சை’ என்பது beryl என்பதற்கான புரிந்துகொள்ளத்தக்க தமிழ் பெயர்; ஐயப்பாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שֹׁהַם
  choice: கோமேதகம்
  rationale: ஆசாரிய உடைச் சூழலில் שֹׁהַם என்பதற்குப் பயன்படும் மரபுவழித் தமிழ் இரத்தினப் பெயர்; கனிமத்தின் துல்லிய அடையாளம் விவாதத்திற்குரியது.
- source_word: וְיָשְׁפֵה
  choice: யஸ்பி
  rationale: יָשְׁפֵה என்பதற்கான நிலைபெற்ற வேதாகமத் தமிழ் ஒலிபெயர்ப்பு; இது jasper வகைக் கல்லைக் குறிக்கிறது.
- source_word: מֽוּסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: தங்கச் சட்டங்களுக்குள் பதிக்கப்பட்டிருந்தன
  rationale: செயப்பாட்டு வடிவத்தையும், கற்கள் தங்கத்தால் செய்யப்பட்ட அமைப்புகளுக்குள் பொருத்தப்பட்டிருந்த கைவினைச் சூழலையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: בְּמִלֻּאֹתָם
  choice: தங்களுக்குரிய பதிப்பிடங்களில்
  rationale: இறுதி எபிரெயச் சொற்றொடர் தொழில்நுட்பமானதும் முந்தைய சொல்லுடன் பொருள் ஒட்டியதும் ஆகும்; கற்கள் அவற்றுக்கென அமைக்கப்பட்ட இடங்களில் பொருத்தப்பட்டன என்ற சாத்தியமான பொருளைத் தருகிறது.
