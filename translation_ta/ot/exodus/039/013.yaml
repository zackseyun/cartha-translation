- from: 'நான்காவது வரிசையில்: படிகப்பச்சை[a], கோமேதகம், யஸ்பி ஆகிய கற்கள் இருந்தன; அவை தங்களுக்குரிய பதிப்பிடங்களில் தங்கச் சட்டங்களுக்குள் பதிக்கப்பட்டிருந்தன.[b]'
