base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/042.yaml
  text: According to all that Yahweh had commanded Moses[a], so the sons of Israel did all the work.
translation:
  language: ta
  text: யாவே மோசேக்குக் கட்டளையிட்ட எல்லாவற்றின்படியும், இஸ்ரவேல் மக்கள்[a] அப்படியே எல்லா வேலையையும் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, ‘இஸ்ரவேலின் மகன்கள்’; இது இஸ்ரவேல் மக்களை மொத்தமாகக் குறிக்கும் வழக்கமான பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: அனைத்தின்படியே
  rationale: כְּ முன்னொட்டும் כֹל என்பதும் கட்டளையிடப்பட்ட அனைத்திற்கும் முழுமையாக இணங்கிச் செய்ததைக் குறிக்கின்றன. ‘அனைத்தின்படியே’ என்பது இந்த ஒத்திசைவை இயல்பான தமிழில் காக்கிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: இந்த வினை ‘கட்டளையிடுதல்’ என்று பொருள்படும்; தமிழின் தொடர்பெச்ச வடிவம் கட்டளை முதலில் கொடுக்கப்பட்டதையும் பின்னர் வேலை செய்யப்பட்டதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயரொலி வடிவில் வழங்குகிறது.
- source_word: אֶת מֹשֶׁה
  choice: மோசேக்கு
  rationale: צוה என்ற வினையுடன் மோசே கட்டளையைப் பெறுபவர். தமிழில் ‘மோசேக்குக் கட்டளையிட்ட’ என்பதே இயல்பான வேற்றுமை அமைப்பு.
- source_word: כֵּן
  choice: -ஏ
  rationale: முதல் கூறுடன் இரண்டாம் கூறை இணைத்து ‘அப்படியே/அதன்படியே’ என்ற துல்லிய ஒத்திசைவை வலியுறுத்துகிறது; தமிழில் ‘அனைத்தின்படியே’ என்பதிலுள்ள ஏகாரம் இதைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: עָשׂוּ
  choice: செய்தார்கள்
  rationale: עשה இங்கு கட்டளையிடப்பட்ட பணியை நிறைவேற்றியதைக் குறிக்கிறது. ‘செய்தார்கள்’ என்பது உற்பத்தியை மட்டும் குறுக்காமல் முழுச் செயலையும் உள்ளடக்குகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லெழுத்தாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இது உடன்படிக்கை மக்களை மொத்தமாகக் குறிக்கும் நிலையான எபிரெயப் பெயரடை. நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ அதன் கூட்டு அர்த்தத்தைத் தெளிவாக வழங்குகிறது; சொல்லெழுத்து வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֵת כָּל הָעֲבֹדָה
  choice: எல்லா வேலையையும்
  rationale: עֲבֹדָה கூடார அமைப்பைச் சார்ந்த முழுப் பணித் தொகுப்பைக் குறிக்கிறது. ‘எல்லா வேலையையும்’ என்பது சூழலில் தெளிவானதும் இயல்பானதும் ஆகும்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, இறைவனின் தனிப்பெயர் உள்ளது. ஆகவே அதை ‘ஆண்டவர்’ என்று மாற்றாமல் தமிழில் பெயராக வழங்குவது மூல வேறுபாட்டைக் காக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் கூட்டு பயன்பாடு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடர் இலக்கண வடிவில் ஆண்பால் பன்மையாக இருந்தாலும், இச்சூழலில் இஸ்ரவேல் சமூகத்தை மொத்தமாகக் குறிக்கும் வழக்குப் பெயர். பிரதான உரையில் இயல்பான கூட்டு அர்த்தம் தரப்பட்டு, நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளை கண்ணியமான நடையில் அமைக்கப்பட்டது. தொடக்க כְּכֹל மற்றும் பின்னுள்ள כֵּן ஆகியவற்றின் தொடர்பு ‘அனைத்தின்படியே’ என்ற வலியுறுத்தல் மூலம் காக்கப்பட்டது.
