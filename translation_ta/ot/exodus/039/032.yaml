  text: וַ/תֵּ֕כֶל כָּל עֲבֹדַ֕ת מִשְׁכַּ֖ן אֹ֣הֶל מוֹעֵ֑ד וַֽ/יַּעֲשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/032.yaml
  text: Thus all the work of the tabernacle[a], the tent of meeting, was finished, and the sons of Israel did according to all that Yahweh had commanded Moses[b]; so they did.
translation:
  language: ta
  text: இவ்வாறு, சந்திப்புக் கூடாரமான வாசஸ்தலத்தின் அனைத்துப் பணியும் முடிவுற்றது. யாவே[a] மோசேக்குக் கட்டளையிட்ட எல்லாவற்றின்படியும் இஸ்ரவேல் மக்கள் செய்தார்கள்; அவ்வாறே அவர்கள் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் יהוה (YHWH) என்ற இறைப்பெயர் உள்ளது. பல மொழிபெயர்ப்புகள் இதற்குப் பதிலாக “கர்த்தர்” என்று வழங்குகின்றன.
    reason: மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரைக் குறித்தும், பரவலான மொழிபெயர்ப்பு மாற்றீட்டைக் குறித்தும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַתֵּכֶל
  choice: முடிவுற்றது
  rationale: כּלה வினை இங்கு கட்டுமானப் பணி முழுமையாக நிறைவடைந்ததைக் குறிக்கிறது; செய்பவரை வெளிப்படையாகச் சேர்க்காமல் எபிரெய வடிவின் கவனத்தைப் பணியின்மீதே வைத்திருக்கிறது.
- source_word: כָּל עֲבֹדַת
  choice: வேலை அனைத்தும்
  rationale: כָּל என்பதன் முழுமையான விரிவையும் עֲבֹדָה என்பதன் கட்டுமானப் பணி சார்ந்த பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: מִשְׁכַּן
  choice: திருவாசஸ்தலம்
  rationale: இது இறைவன் தங்கியிருக்கும் பரிசுத்த வாசஸ்தலம் என்ற சொல்லின் பொருளைத் தமிழில் தெளிவாகக் காட்டுகிறது; வெறும் பொதுவான குடியிருப்பு என்று புரியாமல் சூழலையும் காக்கிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: நியமிக்கப்பட்ட சந்திப்பு நடைபெறும் கூடாரம் என்ற எபிரெயப் பெயரின் பொருளை இயல்பாகக் காக்கிறது.
- source_word: וַיַּעֲשׂוּ
  choice: செய்தார்கள்
  rationale: இங்கு עשה உற்பத்தியை மட்டும் அல்லாமல் கட்டளைக்குக் கீழ்ப்படிந்து நிறைவேற்றியதையும் தொகுத்துக் கூறுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் 'இஸ்ரவேலின் மகன்கள்' என்றாலும், இது தேசத்தை ஒட்டுமொத்தமாகக் குறிக்கும் நிலையான இனப்பெயர்; நவீன தமிழில் 'இஸ்ரவேல் மக்கள்' அதன் கூட்டுப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: כְּכֹל אֲשֶׁר
  choice: அனைத்தின்படியே
  rationale: கட்டளையிடப்பட்ட அனைத்திற்கும் முழுமையாக ஒத்துச் செய்ததை '-படியே' என்ற வலியுறுத்தலுடன் வெளிப்படுத்துகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: முன்னதாக வழங்கப்பட்ட கட்டளையைத் தமிழ் தொடர்பெச்சம் இயல்பாகச் சுட்டுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தின் நான்கு எபிரெய மெய்யெழுத்துகளுக்கான தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவம்; மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரை ஒரு பட்டத்தால் மாற்றவில்லை.
- source_word: כֵּן עָשׂוּ
  choice: அவ்வாறே அவர்கள் செய்தார்கள்
  rationale: முழுமையான கீழ்ப்படிதலை வலியுறுத்தும் எபிரெய மறுபடியுரைத்தலைச் சுருக்காமல் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் பட்டமல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப்பெயர் உள்ளது. தமிழில் பரவலாக அறியப்பட்ட 'யெகோவா' வடிவம் முதன்மை உரையில் வைக்கப்பட்டு, உச்சரிப்பு உறுதியற்றதையும் 'யாவே' என்ற மாற்று வடிவத்தையும் அடிக்குறிப்பு வெளிப்படுத்துகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற கூட்டுப் பெயர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய வடிவம் சொல்லுக்கு சொல் 'மகன்கள்' என்றாலும், இங்கு அது இஸ்ரவேல் சமூகத்தை ஒட்டுமொத்தமாகக் குறிக்கிறது. 'மக்கள்' என்பது தமிழில் இயல்பாகவும் பொருள் துல்லியமாகவும் உள்ளது.
- issue: முடிவிலுள்ள கீழ்ப்படிதல் மறுபடியுரை
  choice: அவ்வாறே அவர்கள் செய்தார்கள்
  alternative: மறுபடியுரையை விடுதல்
  rationale: כֵּן עָשׂוּ என்பது தேவையற்ற மீளுரை அல்ல; கட்டளைக்குத் துல்லியமாகக் கீழ்ப்படிந்ததை இறுதியாக வலியுறுத்துகிறது. ஆகவே அது காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. 'திருவாசஸ்தலம்', 'சந்திப்புக் கூடாரம்' ஆகியவை வேறுபட்ட இரு எபிரெயச் சொற்களையும் ஒரே பரிசுத்தக் கட்டமைப்பைக் குறிக்கும் இணைப்பையும் காக்கின்றன. எபிரெயத்தின் இறுதி மறுபடியுரை திட்டமிட்டு அப்படியே வைக்கப்பட்டுள்ளது.
