  text: And he made the ephod of gold[a], blue, purple, scarlet yarn[b], and finely twisted linen.
translation:
  language: ta
  text: அவன் ஏபோத்தைத் தங்கம், நீலநிற நூல், ஊதாநிற நூல், செந்நிற நூல், நன்றாக முறுக்கப்பட்ட மெல்லிய ஆளிநார் நூல் ஆகியவற்றால் செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவன் ... செய்தான்
  rationale: עשה என்பதன் wayyiqtol வடிவம் நிகழ்வைத் தொடர்ந்து எடுத்துரைக்கும் எளிய இறந்தகால வினை. தமிழில் இயல்பான வாக்கிய அமைப்புக்காக எழுவாயும் வினையும் பிரித்து வழங்கப்பட்டன.
- source_word: הָאֵפֹד
  choice: ஏபோத்தை
  rationale: אֵפֹד என்பது ஆசாரியருக்குரிய தனிப்பட்ட ஆடையைக் குறிக்கும் வழிபாட்டுச் சொல். அதன் சிறப்புப் பொருளை இழக்கும் பொதுவான விளக்கச்சொல்லுக்கு மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: זָהָב
  choice: தங்கம்
  rationale: இவ்வசனம் பொருளை நேரடியாகத் ‘தங்கம்’ எனக் குறிப்பிடுகிறது. அடுத்தடுத்த சூழல் தங்கத்தை நூலாக்கிய முறையை விளக்கினாலும், அந்தத் தகவல் இங்கே சேர்க்கப்படவில்லை.
- source_word: תְּכֵלֶת
  choice: நீலநிற நூல்
  rationale: கூடாரத் துணிகளில் பயன்படுத்தப்பட்ட நீலச் சாயமிட்ட நூல் அல்லது துணிப்பொருளைக் குறிக்கிறது. நெசவுச் சூழலைத் தமிழில் தெளிவாக்க ‘நூல்’ சேர்க்கப்பட்டது.
- source_word: וְאַרְגָּמָן
  choice: ஊதாநிற நூல்
  rationale: வழிபாட்டுத் துணிகளுக்குப் பயன்படுத்தப்பட்ட ஊதா நிறச் சாயமிட்ட பொருளைக் குறிக்கும் வழக்கமான நிறச்சொல்.
- source_word: וְתוֹלַעַת שָׁנִי
  choice: செந்நிற நூல்
  rationale: இந்த எபிரெயச் சொற்றொடர் செந்நிறச் சாயமிடப்பட்ட துணிப்பொருளைக் குறிக்கிறது. நெசவுச் சூழலுக்கு ஏற்றவாறு ‘நூல்’ என்று வெளிப்படுத்தப்பட்டது.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: நன்றாக முறுக்கப்பட்ட மெல்லிய நார்ப்பட்டு
  rationale: שֵׁשׁ மெல்லிய நார்ப்பட்டையும் מָשְׁזָר அது முறுக்கப்பட்டிருந்ததையும் குறிக்கின்றன. இரு கூறுகளும் இயல்பான நவீனத் தமிழில் பாதுகாக்கப்பட்டன.
