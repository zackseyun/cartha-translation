  language: en
  yaml_path: translation/ot/exodus/039/041.yaml
  text: the garments of woven work for ministering in the sanctuary[a], the holy garments for Aaron the priest, and the garments of his sons for serving as priests.
translation:
  language: ta
  text: புனித இடத்தில் சேவை செய்வதற்கான நெய்த வேலைப்பாடுள்ள ஆடைகளையும்[a], ஆசாரியனாகிய ஆரோனுக்கான புனித ஆடைகளையும், ஆசாரியர்களாகச் சேவை செய்வதற்கான அவனுடைய மகன்களின் ஆடைகளையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சேவைக்கான ஆடைகள்”; இந்த எபிரேயச் சொற்றொடர் புனித இடத்தில் சேவை செய்வதற்காகச் சிறப்பாகத் தயாரிக்கப்பட்ட துணிவகைகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי
  choice: ஆடைகள்
  rationale: בֶּגֶד என்பதன் பொதுவான பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; பிற்கால சமயத் தொழில்நுட்பச் சொல்லைத் திணிப்பதில்லை.
- source_word: הַשְּׂרָד
  choice: நெய்த வேலைப்பாடுள்ள
  rationale: கூடாரப் பணியின் சூழலில் சிறப்பாகச் செய்யப்பட்ட துணி வேலைப்பாட்டைக் குறிக்கும் சாத்தியத்தை வெளிப்படுத்துகிறது; ‘பணிவிடைக்கான’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְשָׁרֵת
  choice: பணிவிடை செய்வதற்கான
  rationale: שׁרת குறிக்கும் முறையான புனிதப் பணியைத் தெளிவான தமிழில் எடுத்துரைக்கிறது.
- source_word: בַּקֹּדֶשׁ
  choice: புனித இடத்தில்
  rationale: இங்கு קֹדֶשׁ என்பது அருவமான புனிதத்தன்மையை அல்ல, கூடாரத்தின் புனிதப் பரப்பைக் குறிக்கிறது.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: புனித ஆடைகள்
  rationale: எபிரேயக் கட்டமைப்பையும் ஆசாரியப் பயன்பாட்டுக்காகப் பிரித்துவைக்கப்பட்ட ஆடைகள் என்ற கருத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: ஆசாரியனாகிய ஆரோனுக்கான
  rationale: பெறுபவரையும் அவரது பணிநிலையையும் இயல்பான தமிழில் தெளிவாக அடையாளப்படுத்துகிறது.
- source_word: בִּגְדֵי בָנָיו
  choice: அவனுடைய மகன்களின் ஆடைகள்
  rationale: எபிரேய உரையின் உடைமைத் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לְכַהֵן
  choice: ஆசாரியர்களாகப் பணியாற்றுவதற்கான
  rationale: כֹּהֵן என்பதிலிருந்து உருவான வினைச்சொல், ஆசாரியப் பொறுப்பைச் செய்வதைக் குறிக்கிறது; தமிழில் அதன் தொழிற்பாட்டு அர்த்தத்தை வெளிப்படையாகத் தருகிறது.
theological_decisions:
- issue: בִּגְדֵי הַשְּׂרָד மற்றும் בִּגְדֵי הַקֹּדֶשׁ ஆகியவற்றின் தொடர்பு
  choice: முதல் சொற்றொடரைப் புனித இடத்துப் பணிக்காகச் சிறப்பாக நெய்த வேலைப்பாடுள்ள ஆடைகள் என்றும், அடுத்ததை ஆரோனுக்குரிய புனித ஆடைகள் என்றும் வேறுபடுத்தித் தருதல்
  alternative: இரண்டையும் ஏறத்தாழ ஒரே பொருளுடையதாகக் கொண்டு, முதலாவதை ‘பணிவிடைக்கான ஆடைகள்’ என்று மொழிபெயர்த்தல்
  rationale: எபிரேய உரையில் இரு சொற்றொடர்களும் தனித்தனியாக இடம்பெறுவதைக் காக்கிறது; அவற்றின் துல்லியமான செயல்பாட்டை உரைக்கு அப்பாற்பட்டு நிர்ணயிப்பதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. வசனம் முந்தைய பட்டியலின் தொடர்ச்சியாக இருந்தாலும், தமிழில் தனியாக வாசிக்க இயலுமாறு சூழலிலிருந்து உணரப்படும் ‘கொண்டுவந்தார்கள்’ என்ற வினை சேர்க்கப்பட்டுள்ளது.
