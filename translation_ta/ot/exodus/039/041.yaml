  - severity: low
    issue: “பணிவிடை செய்வதற்கான” can suggest personal servitude more readily than formal sacred service.
    rationale: “சேவை செய்வதற்கான” is natural contemporary Tamil and suitably conveys the formal function of שׁרת without reducing its cultic setting.
