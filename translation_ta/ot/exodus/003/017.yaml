id: EXO.3.17
reference: Exodus 3:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אַעֲלֶ֣ה אֶתְ/כֶם֮ מֵ/עֳנִ֣י מִצְרַיִם֒ אֶל אֶ֤רֶץ הַֽ/כְּנַעֲנִי֙ וְ/הַ֣/חִתִּ֔י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/017.yaml
  text: And I have said[a], ‘I will bring you up out of the affliction of Egypt to the land of the Canaanites, the Hittites, the Amorites, the Perizzites, the Hivites[b], and the Jebusites—to a land flowing with milk and honey.’
translation:
  language: ta
  text: “நான் உங்களை எகிப்தில் நீங்கள் அனுபவிக்கும் ஒடுக்குமுறையிலிருந்து கானானியர், ஏத்தியர், எமோரியர், பெரிசியர், ஏவியர், எபூசியர் ஆகியோரின் நாட்டுக்கு—பாலும் தேனும் ஓடும் நாட்டுக்கு—மேலே கொண்டுவருவேன் என்று கூறியிருக்கிறேன்[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கூறினேன்.” எபிரெய வினை இலக்கண வடிவில் கடந்தகாலத்தில் உள்ளது; முதன்மை உரை, முன்பு கூறப்பட்ட அந்த அறிவிப்பு இப்போதும் பொருந்துவதை வெளிப்படுத்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: கூறியிருக்கிறேன்
  rationale: எபிரெய வடிவம் இறந்தகாலத்தைச் சுட்டினாலும், சூழலில் முன்பே கூறப்பட்டு இப்போதும் பொருந்தும் இறைத் தீர்மானத்தை வெளிப்படுத்துகிறது. தமிழ் நிறைவுநிகழ்காலம் இந்த இரு அம்சங்களையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: אַעֲלֶה אֶתְכֶם
  choice: உங்களைக் கொண்டுபோவேன்
  rationale: ஹிஃபில் வடிவத்தின் ‘மேலே கொண்டுவருதல்/கொண்டுபோதல்’ என்ற காரணவினைப் பொருளை இலக்கு நோக்கிய இயல்பான தமிழில் தருகிறது. ‘உயர்த்துவேன்’ என்பது இங்கு தவறான கருத்தைத் தூண்டலாம்.
- source_word: מֵעֳנִי מִצְרַיִם
  choice: எகிப்தில் அனுபவிக்கும் ஒடுக்குமுறையிலிருந்து
  rationale: עֳנִי என்பது துன்பம், அவலம் அல்லது ஒடுக்குமுறையைக் குறிக்கலாம். இச்சூழலில் இஸ்ரவேலர் எகிப்தில் அனுபவித்த கட்டாய அடிமை ஒடுக்குதலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; சொற்றொடரின் தொடர்பை எகிப்தின் சொந்தத் துன்பம் என்று தவறாகப் புரிந்துகொள்ளாமல் காக்கிறது.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: கானானியர், ஏத்தியர், எமோரியர், பெரிசியர், ஏவியர், எபூசியர் ஆகியோரின் நாடு
  rationale: எபிரெயத்தில் இனப்பெயர்கள் ஒருமை வடிவில் இருந்தாலும் அவை மக்களினங்களைக் குறிக்கின்றன. தமிழில் மரியாதைப் பன்மை வடிவங்கள் இயல்பாக அந்தக் கூட்டுப் பொருளை வழங்குகின்றன.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: பாலும் தேனும் பெருக்கெடுத்து ஓடும் நாடு
  rationale: செழிப்பையும் வளத்தையும் குறிக்கும் மூல உருவகத்தைத் தக்கவைக்கிறது. ‘பெருக்கெடுத்து’ என்பது זָבַת என்பதன் மிகுதியான ஓட்டம் என்ற படிமத்தை இயல்பான தமிழில் உணர்த்துகிறது.
theological_decisions:
- issue: இறை வாக்குறுதி அறிமுக வினையின் காலம்
  choice: கூறியிருக்கிறேன்
  alternative: கூறினேன்
  rationale: וָאֹמַר இலக்கண வடிவில் கடந்தகாலமானாலும், இவ்வுரையில் முன் அறிவிக்கப்பட்டு தற்போதும் நிலைத்திருக்கும் இறைத் தீர்மானத்தை மீண்டும் உறுதிப்படுத்துகிறது. ‘கூறியிருக்கிறேன்’ அந்த நிகழ்ந்த செயலும் தற்போதைய பொருத்தமும் இரண்டையும் காட்டுகிறது; கூடுதல் கோட்பாட்டுக் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இனப்பெயர்கள் தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் வடிவங்களில் தரப்பட்டுள்ளன. மூலத்தின் நீண்ட பட்டியலும் பால்-தேன் உருவகமும் தக்கவைக்கப்பட்டுள்ளன.
