revisions:
- from: “நான் உங்களை எகிப்தில் அனுபவிக்கும் ஒடுக்குமுறையிலிருந்து கானானியர், ஏத்தியர், எமோரியர், பெரிசியர், ஏவியர், எபூசியர் ஆகியோரின் நாட்டுக்கு—பாலும் தேனும் பெருக்கெடுத்து ஓடும் நாட்டுக்கு—கொண்டுபோவேன் என்று கூறியிருக்கிறேன்[a].”
