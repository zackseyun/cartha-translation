base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/013.yaml
  text: Then Moses said to God, “Look, when I come to the sons of Israel and say to them, ‘The God of your fathers has sent me to you,’ and they say to me, ‘What is his name?’ what shall I say to them?”
translation:
  language: ta
  text: அப்போது மோசே கடவுளிடம், “இதோ, நான் இஸ்ரவேல் மக்களிடம் சென்று, ‘உங்கள் முன்னோர்களின் கடவுள் என்னை உங்களிடம் அனுப்பியிருக்கிறார்’ என்று சொல்லும்போது, அவர்கள் என்னிடம், ‘அவருடைய பெயர் என்ன?’ என்று கேட்டால், நான் அவர்களிடம் என்ன சொல்ல வேண்டும்?” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு இஸ்ரவேல் சமூகத்தாரைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: הִנֵּה
  choice: இதோ
  rationale: மோசே முன்வைக்கும் சூழ்நிலையை கவனத்திற்கு கொண்டுவரும் உரையாடல் இடைச்சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: உங்கள் முன்னோர்களின் கடவுள்
  rationale: אָבוֹת என்பதன் வம்ச முன்னோர் பொருளை நவீனத் தமிழில் தெளிவாக வழங்குகிறது; ‘தந்தையர்’ எனக் குறுக்கவில்லை.
- source_word: מַה שְּׁמוֹ
  choice: அவருடைய பெயர் என்ன?
  rationale: மூலத்தின் நேரடியான கேள்வியைப் பாதுகாக்கிறது; பெயரின் தன்மை அல்லது பொருளைப் பற்றிய கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘அவருடைய பெயர் என்ன?’ என்ற கேள்வியின் நோக்கம்
  choice: கேள்வியை விளக்கமின்றி நேரடியாக வைத்தல்
  alternative: ‘அவர் யார்/எப்படிப்பட்டவர்?’ என்று பொருள் விரித்தல்
  rationale: மூல எபிரெயம் பெயரையே நேரடியாகக் கேட்கிறது; அதன் அடையாள அல்லது குணநலப் பரிமாணத்தை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல், அடுத்த வசனத்தின் பதிலுடன் உள்ள இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையும் உரையாடலின் இயல்பும் காக்கப்பட்டுள்ளன. மேற்கோள்களுக்குள் மேற்கோள் தெளிவாக அமைக்கப்பட்டுள்ளது; தேவையற்ற சமயப் பிரிவுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
