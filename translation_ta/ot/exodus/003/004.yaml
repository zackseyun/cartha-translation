base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/004.yaml
  text: When Yahweh saw that he had turned aside to look[a], God called to him from the midst of the bush and said, “Moses, Moses!” And he said[c][b], “Here I am.”
translation:
  language: ta
  text: 'அவன் பார்ப்பதற்காக விலகிச் சென்றதை யாவே[a] கண்டபோது, புதரின் நடுவிலிருந்து[b] கடவுள் அவனைக் கூப்பிட்டு, “மோசே, மோசே!” என்றார். அதற்கு அவன், “இதோ, நான் இருக்கிறேன்” என்றான்.


    [a] எபிரெயத்தில் கடவுளின் தனிப்பெயர் יהוה (YHWH); இது இங்கே “யாவே” என்று ஒலிபெயர்க்கப்பட்டுள்ளது. மரபாக, “ஆண்டவர்” என்றும் வழங்கப்படுகிறது.

    [b] “புதரின் நடுவிலிருந்து” என்பதை “புதருக்குள்ளிருந்து” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் குறிப்பாக ஒரு முட்புதரைக் குறிக்கக்கூடும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் கடவுளின் தனிப்பெயர் יהוה (YHWH); இது இங்கே “யாவே” என்று ஒலிபெயர்க்கப்பட்டுள்ளது. மரபாக, “ஆண்டவர்” என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: “புதரின் நடுவிலிருந்து” என்பதை “புதருக்குள்ளிருந்து” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் குறிப்பாக ஒரு முட்புதரைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத்தின் நான்கெழுத்துத் தெய்வீகப் பெயரைப் பட்டமாக மாற்றாமல், தமிழில் அதன் பொதுவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיַּרְא ... כִּי
  choice: '...கண்டபோது'
  rationale: கடவுள் கவனித்த நிகழ்வின் உள்ளடக்கத்தையும் கதையின் காலத் தொடர்ச்சியையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: סָר לִרְאוֹת
  choice: பார்ப்பதற்காக விலகிச் சென்றதை
  rationale: סור என்பதன் ‘வழியிலிருந்து விலகுதல்’ என்ற பொருளையும், לִרְאוֹת என்பதன் நோக்கத்தையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַיִּקְרָא אֵלָיו
  choice: அவனைக் கூப்பிட்டு
  rationale: ஒருவரை நோக்கிக் கூப்பிடுதல் என்ற எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: அதே வசனத்தில் வரும் יהוה என்பதிலிருந்து எபிரெய உரை காட்டும் சொல்வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: புதரின் நடுவிலிருந்து
  rationale: மூலத்தின் இடவியல் படிமத்தைப் பாதுகாக்கிறது; ‘புதருக்குள்ளிருந்து’ என்பது சாத்தியமான இயல்பான மாற்று.
- source_word: מֹשֶׁה מֹשֶׁה
  choice: மோசே, மோசே!
  rationale: பெயரின் இரட்டிப்பில் உள்ள நேரடியான, தீவிரமான அழைப்பைப் பாதுகாக்கிறது.
- source_word: הִנֵּנִי
  choice: இதோ, நான் இருக்கிறேன்
  rationale: பேசுபவரின் உடனிருப்பையும் பதிலளிக்கத் தயாராக இருப்பதையும் வெளிப்படுத்துகிறது; ‘நான் இதோ இருக்கிறேன்’ என்பதும் சாத்தியம்.
theological_decisions:
- issue: ஒரே வசனத்தில் יהוה மற்றும் אֱלֹהִים ஆகிய இரு தெய்வீகப் பெயரிடல்களும் வருதல்
  choice: יהוה என்பதை ‘யாவே’ என்றும் אֱלֹהִים என்பதை ‘கடவுள்’ என்றும் வேறுபடுத்தி வழங்குதல்
  alternative: இரண்டையும் ‘கடவுள்’ என்று வழங்குதல்; அல்லது יהוה என்பதை ‘ஆண்டவர்’ என்று வழங்குதல்
  rationale: மூல எபிரெய உரையில் அருகருகே பயன்படுத்தப்பட்டுள்ள இரண்டு சொற்களையும் ஒன்றாகச் சமப்படுத்தாமல் வெளிப்படையாகப் பாதுகாக்கிறது.
- issue: இறுதி וַיֹּאמֶר என்பதன் மறைமுக எழுவாய்
  choice: ‘அதற்கு அவன் ... என்றான்’ என்று மோசேயைக் குறித்தல்
  alternative: ‘மோசே ... என்றான்’ என்று பெயரை மீண்டும் வெளிப்படையாகக் கூறுதல்
  rationale: நேரடி அழைப்புக்குப் பதிலளிப்பவர் மோசே என்பது சூழலில் தெளிவு; ‘அதற்கு’ என்பது பேச்சாளர் மாறுவதை தமிழில் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவே’ மற்றும் ‘கடவுள்’ என்ற வேறுபாடு மூலத்துக்கு இணங்கப் பாதுகாக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையிலிருந்த அடிக்குறிப்பு குறியீட்டு முரண்பாடுகள் பின்பற்றப்படாமல், ஒவ்வொரு குறிப்பும் பொருத்தமான சொல்லிடத்தில் இணைக்கப்பட்டுள்ளது.
