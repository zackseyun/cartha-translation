  source_fidelity: 'எபிரெய மூலத்தின் நிகழ்வுவரிசையும் பொருளும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: யாவே மோசே பார்க்கும்படி விலகியதைப் பார்க்கிறார்; புதரின் நடுவிலிருந்து கடவுள் அவனை அழைக்கிறார்; மோசே பதிலளிக்கிறான். יְהוָה மற்றும் אֱלֹהִים ஆகிய வேறுபட்ட பெயரிடல்கள் முறையே “யாவே,” “கடவுள்” எனத் தெளிவாகக் காக்கப்பட்டுள்ளன. הִנֵּנִי என்பதற்கு “இதோ, நான் இருக்கிறேன்” என்பது பொருத்தமான பதிலாகும்.'
