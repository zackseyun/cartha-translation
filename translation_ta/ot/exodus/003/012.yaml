  text: וַ/יֹּ֨אמֶר֙ כִּֽי אֶֽהְיֶ֣ה עִמָּ֔/ךְ וְ/זֶה לְּ/ךָ֣ הָ/א֔וֹת כִּ֥י אָנֹכִ֖י שְׁלַחְתִּ֑י/ךָ בְּ/הוֹצִֽיאֲ/ךָ֤ אֶת הָ/עָם֙ מִ/מִּצְרַ֔יִם תַּֽעַבְדוּ/ן֙ אֶת הָ֣/אֱלֹהִ֔ים עַ֖ל הָ/הָ֥ר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/012.yaml
  text: 'And he said[a], “Certainly I will be with you, and this will be the sign for you that I have sent you: when you bring the people out of Egypt, you will serve God on this mountain.”'
translation:
  language: ta
  text: 'அவர் சொன்னார்: “நிச்சயமாக நான் உன்னோடு இருப்பேன். நான்தான் உன்னை அனுப்பினேன் என்பதற்கு இதுவே உனக்கு அடையாளமாக இருக்கும்: நீ மக்களை எகிப்திலிருந்து வெளியே கொண்டுவரும்போது, நீங்கள் இந்த மலையில் கடவுளைச் சேவிப்பீர்கள்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளை வழிபடுவீர்கள்.” கடவுளைக் குறித்துப் பயன்படுத்தப்படும்போது எபிரெய வினைச்சொல் ‘சேவை செய்’, ‘வழிபடு’ ஆகிய இரு பொருள்களையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אֶהְיֶה עִמָּךְ
  choice: நிச்சயமாக நான் உன்னோடு இருப்பேன்
  rationale: இங்கு כִּי மோசேயின் எதிர்ப்புக்கான உறுதியளிக்கும் பதிலை அறிமுகப்படுத்துகிறது; אֶהְיֶה எதிர்கால நோக்குடைய தெய்வீக உடனிருப்பின் வாக்குறுதியாக உள்ளது.
- source_word: הָאוֹת
  choice: அடையாளம்
  rationale: אוֹת உறுதிப்படுத்தும் குறி அல்லது அடையாளத்தைக் குறிக்கிறது; தமிழில் ‘அடையாளம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כִּי אָנֹכִי שְׁלַחְתִּיךָ
  choice: நான்தான் உன்னை அனுப்பினேன் என்பதற்கு
  rationale: אָנֹכִי என்னும் வலியுறுத்தப்பட்ட தனிப்பெயர்ச்சொல்லை ‘நான்தான்’ வெளிப்படுத்துகிறது; இக்கூற்று அடையாளம் உறுதிப்படுத்தும் செய்தியைச் சொல்கிறது.
- source_word: בְּהוֹצִיאֲךָ אֶת־הָעָם מִמִּצְרַיִם
  choice: நீ மக்களை எகிப்திலிருந்து வெளியே கொண்டுவந்த பின்பு
  rationale: בְּ + வினையெச்சப் பெயர்ச்சொல் இங்கு காலப் பொருளுடையது; 2ஆம் ஆண் ஒருமை பின்னொட்டு மக்களை வெளியே நடத்தும் மோசேயைக் குறிக்கிறது. அடுத்த வினையின் பன்மையுடன் இயல்பாக இணைய ‘பின்பு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: תַּעַבְדוּן אֶת־הָאֱלֹהִים
  choice: நீங்கள் கடவுளைச் சேவிப்பீர்கள்
  rationale: திடீரென வரும் 2ஆம் ஆண் பன்மை மோசேயும் மக்களும் சேர்ந்த குழுவைக் குறிக்கிறது. עבד என்பது கடவுளைப் பொறுத்தவரை ‘சேவைசெய்’ என்றும் ‘வழிபடு’ என்றும் பொருள்படலாம்; ‘சேவிப்பீர்கள்’ அதன் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: עַל הָהָר הַזֶּה
  choice: இந்த மலையில்
  rationale: עַל என்பதன் இடப்பொருளை இயல்பான நவீனத் தமிழில் ‘மலையில்’ வெளிப்படுத்துகிறது; மலையின் தெளிவான கதைச்சூழலையும் காக்கிறது.
theological_decisions:
- issue: வாக்குறுதியளிக்கப்பட்ட ‘அடையாளத்தின்’ இயல்பு
  choice: எகிப்திலிருந்து வெளியேறிய பின்பு இதே மலையில் கடவுளைச் சேவிப்பதே வருங்கால அடையாளம் என வாக்கிய அமைப்பை வழங்குதல்
  alternative: அடையாளம் என்பது கடவுளின் தற்போதைய உடனிருப்பு வாக்குறுதி; அல்லது உடனிருப்பும் வருங்காலச் சேவையும் சேர்ந்த ஒன்று
  rationale: எபிரெய வாக்கிய அமைப்பு அடுத்து வரும் வெளியேற்றம் மற்றும் மலையில் சேவை செய்தல் பற்றிய கூற்றை அடையாளத்தின் உள்ளடக்கமாக இயல்பாகச் சுட்டுகிறது; இருப்பினும் மற்ற தொடர்பை விளக்கமாக உரைக்குள் சேர்க்காமல் இறையியல் இழுபறி பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மோசேயைக் குறிக்கும் ஒருமை ‘நீ’ என்பதிலிருந்து மோசேயும் மக்களும் அடங்கிய பன்மை ‘நீங்கள்’ என்பதற்கான எபிரெய மாற்றம் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
