  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ֣/אֱלֹהִ֔ים מִ֣י אָנֹ֔כִי כִּ֥י אֵלֵ֖ךְ אֶל פַּרְעֹ֑ה וְ/כִ֥י אוֹצִ֛יא אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/011.yaml
  text: But Moses said to God[a], “Who am I that I should go to Pharaoh and that I should bring the sons of Israel out of Egypt?”
translation:
  language: ta
  text: ஆனால் மோசே கடவுளிடம், “பார்வோனிடம் போவதற்கும், இஸ்ரவேலின் மகன்களை[a] எகிப்திலிருந்து வெளியே கொண்டுவருவதற்கும் நான் யார்?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “இஸ்ரவேலர்கள்”; மரபுவழியாக, “இஸ்ரவேலின் பிள்ளைகள்.”
    reason: בְּנֵי יִשְׂרָאֵל என்ற குடும்பவழிச் சொற்றொடருக்கான இயல்பான கூட்டுப்பெயர் மற்றும் மரபுவழி மாற்றுகளை வழங்குகிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: எபிரெயக் கதைநடையில் வழக்கமான ‘சொன்னார்’ என்ற பொருளை, நேரடி உரைக்குப் பின் இயல்பான தமிழ் வடிவமான ‘என்றார்’ என வழங்குகிறது.
- source_word: אֶל הָאֱלֹהִים
  choice: கடவுளிடம்
  rationale: குறிப்பிட்ட மெய்யான கடவுளைக் குறிக்கும் இச்சூழலில், நவீனத் தமிழில் இயல்பான ஒருமைச் சொல்லாகும்.
- source_word: מִי אָנֹכִי
  choice: நான் யார்?
  rationale: மோசேயின் தகுதியின்மை உணர்வை விளக்கச் சேர்க்கையின்றி நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: אֵלֵךְ אֶל פַּרְעֹה
  choice: பார்வோனிடம் போவதற்கும்
  rationale: சிந்திக்கப்படும் செயலைக் குறிக்கும் எபிரெய வினைவடிவத்தையும், ‘நான் யார்?’ என்பதுடன் உள்ள தொடர்பையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְכִי אוֹצִיא
  choice: வெளியே கொண்டுவருவதற்கும்
  rationale: יצא என்பதன் ஹிஃபீல் காரணவினைப் பொருளான ‘வெளியே கொண்டுவருதல்’ என்பதையும், முதல் வினையுடன் இணையான அமைப்பையும் காக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களை
  rationale: எபிரெய மூலத்தின் ஆண்பால் சார்ந்த குடும்பவழிச் சொல்லாக்கத்தைத் தெளிவாகக் காக்கிறது; இது இஸ்ரவேலின் வழித்தோன்றல்களாகிய மக்களைக் கூட்டாகக் குறிக்கிறது.
- source_word: מִמִּצְרַיִם
  choice: எகிப்திலிருந்து
  rationale: புறப்படும் இடத்தைத் தெளிவாகக் குறித்து, ‘வெளியே கொண்டுவருதல்’ என்பதுடன் இயல்பாக இணைகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள்; இஸ்ரவேலின் பிள்ளைகள்
  rationale: மூலத்தின் இலக்கண ஆண்பாலையும் வம்ச உறவையும் முதன்மை உரை காக்கிறது. அதேவேளை, இச்சொற்றொடர் முழு இஸ்ரவேல் மக்களையும் கூட்டாகக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘போவதற்கும் … கொண்டுவருவதற்கும்’ என்ற இணை அமைப்பு மோசேயின் இருபகுதி வினாவைக் காக்கிறது.
