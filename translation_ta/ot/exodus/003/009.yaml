  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנֵּ֛ה צַעֲקַ֥ת בְּנֵי יִשְׂרָאֵ֖ל בָּ֣אָה אֵלָ֑/י וְ/גַם רָאִ֨יתִי֙ אֶת הַ/לַּ֔חַץ אֲשֶׁ֥ר מִצְרַ֖יִם לֹחֲצִ֥ים אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/009.yaml
  text: And now[a], behold, the cry of the sons of Israel has come to me[b], and I have also seen the oppression with which the Egyptians are oppressing them.
translation:
  language: ta
  text: இப்போதோ, இதோ, இஸ்ரவேல் மக்களின் கூக்குரல் என்னிடம் வந்திருக்கிறது; எகிப்தியர்கள் அவர்களை ஒடுக்குகிற ஒடுக்குமுறையையும் நான் கண்டிருக்கிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போதோ
  rationale: இணைப்பையும் உரையின் திருப்பத்தையும் இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லின் சுட்டிக்காட்டும் வலிமையைச் சுருக்கமாகப் பேணுகிறது.
- source_word: צַעֲקַת
  choice: கூக்குரல்
  rationale: துன்பத்திலிருந்து எழும் உதவிக்கான உரத்த அழுகுரலைச் சூழலுக்கேற்றபடி தெரிவிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் 'இஸ்ரவேலின் மகன்கள்' என்றாலும், இங்கு முழுச் சமூகத்தையும் குறிக்கும் மரபுத்தொடரை நவீனத் தமிழில் இயல்பாகவும் உள்ளடக்கமாகவும் வழங்குகிறது.
- source_word: בָּאָה אֵלַי
  choice: என்னிடம் வந்திருக்கிறது
  rationale: எபிரெய வினையின் அடிப்படை உருவகமான 'வந்தது' என்பதையும் தற்போதைய தொடர்பையும் பேணுகிறது.
- source_word: וְגַם רָאִיתִי
  choice: '...யும் நான் கண்டிருக்கிறேன்'
  rationale: கூடுதல் வலியுறுத்தலை '-யும்' மூலம் காட்டி, தேவன் கண்டது இப்போது அவர் செயல்படுவதோடு தொடர்புடையது என்பதை நிறைவுநிலையில் தெரிவிக்கிறது.
- source_word: הַלַּחַץ
  choice: ஒடுக்குதல்
  rationale: கட்டாய அழுத்தத்தையும் சமூக ஒடுக்குமுறையையும் குறிக்கும் பெயர்ச்சொல்லுக்கு நேரான சூழல்சார் இணை.
- source_word: מִצְרַיִם לֹחֲצִים
  choice: எகிப்தியர்கள் ... ஒடுக்குகிற
  rationale: מִצְרַיִם இங்கு பன்மை வினையெச்சத்தோடு வந்து எகிப்து மக்களை, குறிப்பாக ஒடுக்குவோரை, கூட்டாகக் குறிக்கிறது; தொடரும் செயலை நிகழ்கால வடிவம் காட்டுகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற உடன்படிக்கைச் சமூகப் பெயர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள் / இஸ்ரவேலர்
  rationale: இது ஆண் சந்ததியினரை மட்டும் குறிக்காமல் இஸ்ரவேல் சமூகமெங்கையும் குறிக்கும் நிலையான எபிரெய மரபுத்தொடர். 'மக்கள்' என்பது பொருளைத் தவறாகக் குறுக்காமல் இயல்பான தமிழில் தருகிறது.
- issue: மனிதர்போன்ற மொழியில் தேவனிடம் கூக்குரல் 'வருதல்' மற்றும் அவர் 'காணுதல்'
  choice: உருவகங்களை அப்படியே பேணுதல்
  alternative: கூக்குரல் தேவனை எட்டியது; தேவன் அவர்களின் நிலையை அறிந்தார்
  rationale: மூலத்தின் உயிர்ப்பான மொழியையும் தேவனுடைய கவனிப்பு மற்றும் உடனடி செயல்பாட்டுக்கிடையிலான இறையியல் அழுத்தத்தையும் விளக்கவுரையால் சமப்படுத்தாமல் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. 'இதோ' மூலத்தின் கவன ஈர்ப்பைத் தக்கவைக்கிறது. மூலத்தில் இல்லாத விளக்கங்களைச் சேர்க்காமல், 'ஒடுக்குதல்/ஒடுக்குகிற' என்ற ஒரே வேர் சார்ந்த மீளுரையை நோக்கத்துடன் பேணுகிறது.
