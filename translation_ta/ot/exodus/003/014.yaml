source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל מֹשֶׁ֔ה אֶֽהְיֶ֖ה אֲשֶׁ֣ר אֶֽהְיֶ֑ה וַ/יֹּ֗אמֶר כֹּ֤ה תֹאמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל אֶֽהְיֶ֖ה שְׁלָחַ֥/נִי אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/014.yaml
  text: 'And God said to Moses[a], “I AM WHO I AM.” And he said[b], “Thus you shall say to the sons of Israel: ‘I AM has sent me to you.’”'
translation:
  language: ta
  text: கடவுள் மோசேயிடம், “நான் யாராக இருக்கிறேனோ அவராகவே இருக்கிறேன்[a]” என்றார். பின்னர் அவர், “நீ இஸ்ரவேல் மக்களிடம்[b], ‘நான் இருக்கிறேன்’ என்பவர் என்னை உங்களிடம் அனுப்பியுள்ளார் என்று சொல்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நான் யாராக இருப்பேனோ அவராகவே இருப்பேன்” அல்லது “நான் என்னவாக இருப்பேனோ அவ்வாறே இருப்பேன்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினை நிகழ்காலப் பொருளோடு எதிர்காலப் பொருளையும் தரக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் சொற்படி, “இஸ்ரவேலின் மகன்களிடம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இந்தக் கதைச் சூழலில் பன்மை வடிவமுள்ள இச்சொல் இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கும் ஒருமைச் சொல்லாகச் செயல்படுகிறது.
- source_word: אֶהְיֶה
  choice: நான் இருக்கிறேன்
  rationale: היה என்பதன் Qal imperfect முதல் நபர் ஒருமை வடிவம் நிகழ்கால அல்லது எதிர்கால நுணுக்கத்தைக் கொண்டிருக்கலாம். இங்கு இது தம்மை அடையாளப்படுத்தும் கூற்றாகவும் பின்னர் பெயர்போன்ற குறிப்பாகவும் வருவதால், முதன்மை உரையில் நிகழ்கால வடிவம் பயன்படுத்தப்பட்டுள்ளது; எதிர்கால சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר
  choice: இருக்கிறவராக
  rationale: தம்மைக் குறித்த தனிப்பட்ட அடையாளக் கூற்றில் אֲשֶׁר தரும் ‘யார்/எவர்’ சார்ந்த உறவை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כֹּה תֹאמַר
  choice: நீ ... என்று சொல்
  rationale: כֹּה அறிமுகப்படுத்தும் அறிவிப்பு முறையையும், תֹאמַר இங்கு கொண்டுள்ள கட்டளை வலிமையையும் இயல்பான தமிழ் நேரடிப் பேச்சில் தருகிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடர் சொற்படி ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது. நவீன தமிழில் இயல்பான கூட்டுப்பெயர் முதன்மை உரையில் தரப்பட்டு, சொற்படியான வடிவம் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: שְׁלָחַנִי
  choice: என்னை ... அனுப்பியுள்ளார்
  rationale: முடிந்த செயலும் அதன் தற்போதைய பொருத்தமும் வெளிப்படும் வகையில் மரியாதை ஒருமையுடன் இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיֹּאמֶר
  choice: என்றார் / மேலும் அவர் ... என்றார்
  rationale: எபிரெயக் கதைத் தொடர்ச்சியைத் தமிழில் இயல்பாகக் காட்டுகிறது; இரண்டாவது கூற்றின் தொடர்ச்சியை ‘மேலும்’ தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: אֶהְיֶה אֲשֶׁר אֶהְיֶה என்ற இறைத் தற்சுட்டின் மொழிபெயர்ப்பு
  choice: நான் இருக்கிறவராக இருக்கிறேன்
  alternative: நான் எவராக இருப்பேனோ அவராக இருப்பேன் / நான் என்னவாக இருப்பேனோ அவ்வாறே இருப்பேன்
  rationale: எபிரெய imperfect வடிவம் நிகழ்காலத்தையும் எதிர்காலத்தையும் சுட்டக்கூடும். பெயர்போன்ற தற்சுட்டுத் தன்மையை முதன்மை உரை காக்கிறது; எதிர்கால நுணுக்கத்தைத் தீர்த்துவிடாமல் அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: இரண்டாவது אֶהְיֶה-ஐ பெயர்போன்ற தற்சுட்டாகக் காட்டுதல்
  choice: ‘நான் இருக்கிறேன்’ என்பவர்
  alternative: ‘இருக்கிறவர்’
  rationale: மோசே இஸ்ரவேல் மக்களிடம் அப்படியே தெரிவிக்க வேண்டிய முதல் நபர் இறைத் தற்சுட்டை மேற்கோளுக்குள் காப்பது எபிரெய உரையின் மீளுரைப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இறைத் தற்சுட்டின் பெயர்போன்ற தன்மையை மேற்கோள்கள் காட்டுகின்றன; தமிழில் ஆங்கிலத்தைப் போன்ற பெரிய எழுத்து வேறுபாடு இல்லாததால் அச்சுக்குறியீட்டால் மட்டும் அது சுட்டப்பட்டுள்ளது.
