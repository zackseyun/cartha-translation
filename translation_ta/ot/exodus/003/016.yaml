base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/016.yaml
  text: 'Go and gather the elders of Israel[a], and say to them, ‘Yahweh, the God of your fathers—the God of Abraham, Isaac, and Jacob—has appeared to me[b], saying: “I have surely attended to you and to what has been done to you in Egypt.”’'
translation:
  language: ta
  text: நீ போய் இஸ்ரவேலின் மூப்பர்களை ஒன்றுகூட்டி, அவர்களிடம், ‘உங்கள் தந்தையரின்[a] இறைவனாகிய யாவே—ஆபிரகாம், ஈசாக்கு, யாக்கோபின் இறைவன்—எனக்குத் தோன்றி, “நான் உங்களையும் எகிப்தில் உங்களுக்குச் செய்யப்பட்டவற்றையும் நிச்சயமாகக் கவனத்தில் எடுத்திருக்கிறேன்[b]” என்று கூறினார்’ என்று சொல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘உங்கள் தந்தையர்’; இதைத் தொடர்ந்து வரும் ‘ஆபிரகாம், ஈசாக்கு, யாக்கோபின் இறைவன்’ என்ற சொற்றொடர் அந்த இறைவனை மேலும் அடையாளப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நான் உங்களை நிச்சயமாக விசாரித்திருக்கிறேன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் வினையை வலியுறுத்துகிறது; இது வெறும் சமூகச் சந்திப்பை அல்ல, நடவடிக்கைக்கு வழிவகுக்கும் தீர்மானமான தெய்வீகக் கவனத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ וְאָסַפְתָּ
  choice: நீ போய் ... கூட்டி
  rationale: நேரடியான கட்டளையையும், சமூகத் தலைவர்களை ஒன்றுகூட்டும் אָסף என்பதன் பொருளையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மூப்பர்கள்
  rationale: இது வயதை மட்டும் அல்லாமல் சமூகத் தலைமைப் பொறுப்பையும் குறிக்கும் நிலையான வேதாகமச் சமூகப் பதவி.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெயத் தெய்வீகத் தனிப்பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: உங்கள் தந்தையரின் இறைவன்
  rationale: அடுத்து ஆபிரகாம், ஈசாக்கு, யாக்கோபு என்று விளக்கப்படும் தந்தைவழி உடன்படிக்கைச் சுட்டலைப் பாதுகாக்கிறது.
- source_word: נִרְאָה אֵלַי
  choice: எனக்குத் தோன்றி
  rationale: நிபால் வடிவத்தின் தெய்வீக வெளிப்பாட்டு வழக்கை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פָּקֹד פָּקַדְתִּי
  choice: நிச்சயமாகக் கவனத்தில் கொண்டிருக்கிறேன்
  rationale: வினையெச்சப் பெயருருவும் முடிவுற்ற வினையும் சேர்ந்த எபிரெய வலியுறுத்தலை ‘நிச்சயமாக’ எனக் காட்டி, வெறும் பார்வையல்லாமல் செயலுக்கு வழிவகுக்கும் நோக்கமுள்ள தெய்வீகக் கவனத்தையும் தெரிவிக்கிறது.
- source_word: וְאֶת הֶעָשׂוּי לָכֶם בְּמִצְרָיִם
  choice: எகிப்தில் உங்களுக்குச் செய்யப்பட்டதையும்
  rationale: செய்தவர் யார் என்பதை மூலத்தில் இல்லாதபடி சேர்க்காமல், எபிரெயச் செயல்பாட்டு வினையெச்சத்தின் செயப்பாட்டு மையத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலம் இங்கு இறைவனின் தனிப்பெயரை நேரடியாகக் கொண்டுள்ளது; ஆகவே ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- issue: אֲבֹתֵיכֶם என்பதிலுள்ள தந்தைவழிச் சுட்டல்
  choice: உங்கள் தந்தையர்
  alternative: உங்கள் முன்னோர்
  rationale: உடனடியாக ஆபிரகாம், ஈசாக்கு, யாக்கோபு குறிப்பிடப்படுவதால், பொதுவான ‘முன்னோர்’ என்பதைவிட மூலத்தின் குறிப்பிட்ட தந்தைவழி அமைப்பு காக்கப்படுகிறது.
- issue: פָּקֹד פָּקַדְתִּי என்பதன் தெய்வீகச் செயற்பாட்டு நுணுக்கம்
  choice: நிச்சயமாகக் கவனத்தில் கொண்டிருக்கிறேன்
  alternative: நிச்சயமாகச் சந்தித்திருக்கிறேன்; நிச்சயமாக விசாரித்திருக்கிறேன்
  rationale: இந்தச் சூழலில் வரும் கவனம் மீட்பு நடவடிக்கைக்கு வழிவகுக்கும் தீர்மானமான தெய்வீக அக்கறையைச் சுட்டுகிறது; தமிழில் ‘சந்தித்தல்’ வெறும் வருகை எனத் தவறாகப் புரியக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கையாளுகிறது. மேற்கோளுக்குள் மேற்கோள் உள்ள எபிரெய உரையாடல் அமைப்பு தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது; தேவையற்ற சமயக்குழு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
