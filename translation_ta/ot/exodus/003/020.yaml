base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/020.yaml
  text: And I will stretch out my hand and strike Egypt with all my wonders that I will do in its midst[b][a]; and after that he will send you out.
translation:
  language: ta
  text: “நான் என் கையை நீட்டி[a], எகிப்தின் நடுவில் செய்யவிருக்கும் என் அற்புதச் செயல்கள் அனைத்தாலும் எகிப்தைத் தாக்குவேன். அதற்குப் பிறகு அவன் உங்களை அனுப்பிவிடுவான்[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் கையை அனுப்புவேன்.” செயலில் அல்லது வல்லமையில் கையை நீட்டுவதை இந்த எபிரேய மரபுத்தொடர் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்களைப் போகவிடுவான்.” எபிரேய மொழியில் இன்னும் சொற்சொல்லாக, “உங்களை அனுப்பிவிடுவான்” என்றுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי אֶת־יָדִי
  choice: நான் என் கையை நீட்டி
  rationale: שׁלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்பு’ என்றாலும், கையைச் செயலில் அல்லது வல்லமையில் நீட்டுவதைக் குறிக்கும் எபிரேய மரபுத்தொடர் இது. ‘கையை நீட்டி’ என்பது உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וְהִכֵּיתִי
  choice: தாக்குவேன்
  rationale: נכה என்பது இங்கு ‘அடி/தாக்கு’ என்று பொருள்படும். வரவிருக்கும் வாதைகளைக் குறிக்க ‘தாக்குவேன்’ தெளிவாக உள்ளது; மரணம் அல்லது முழு அழிவைத் தேவையின்றி சேர்ப்பதில்லை.
- source_word: מִצְרַיִם
  choice: எகிப்தை
  rationale: எபிரேய உரையில் தனிநபர்களான எகிப்தியர்களை மட்டும் அல்லாமல், எகிப்து நாடு ஒட்டுமொத்தமாகச் செயப்படுபொருளாக வருகிறது.
- source_word: בְּכֹל נִפְלְאֹתַי
  choice: என் அற்புதச் செயல்கள் அனைத்தாலும்
  rationale: נפלאות வியப்பை உண்டாக்கும் அசாதாரண செயல்களைக் குறிக்கிறது. ‘அற்புதச் செயல்கள்’ என்பது தமிழில் தெளிவானதும் வேதாகமச் செறிவைத் தக்கவைப்பதும் ஆகும்.
- source_word: אֲשֶׁר אֶעֱשֶׂה
  choice: செய்யவிருக்கும்
  rationale: עשה என்பதன் எளிய ‘செய்’ பொருளையும் வருங்கால நோக்கையும் இயல்பான தமிழ் பெயரெச்சத் தொடரில் தருகிறது.
- source_word: בְּקִרְבּוֹ
  choice: எகிப்தின் நடுவில்
  rationale: ஒருமை பின்னொட்டு எகிப்தைக் குறிக்கிறது. தமிழில் சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்க அதன் முன்னிலையை வெளிப்படையாக மீண்டும் கூறி, நிகழ்வுகள் எகிப்துக்குள் நடைபெறும் இடப் பொருளைத் தக்கவைக்கிறது.
- source_word: וְאַחֲרֵי כֵן
  choice: அதற்குப் பிறகு
  rationale: செயல்களின் கால வரிசையை இயல்பான நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: יְשַׁלַּח אֶתְכֶם
  choice: அவன் உங்களை அனுப்பிவிடுவான்
  rationale: சூழலில் எழுவாய் பார்வோன். ‘அனுப்பிவிடுவான்’ என்பது שׁלח என்ற வினையின் நேரடிப் பொருளையும் விடுவித்து வெளியே அனுப்பும் கருத்தையும் தக்கவைக்கிறது.
theological_decisions:
- issue: கடவுளின் செயலுக்கான மனித உடல் உருவகம்
  choice: ‘என் கையை நீட்டி’ என்ற உடல் உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘என் வல்லமையை வெளிப்படுத்தி’ என்று அருவமாக மொழிபெயர்த்தல்
  rationale: கடவுளின் தலையீட்டை எபிரேய உரை உறுதியான மனித உடல் உருவகத்தில் கூறுகிறது. அதைத் தக்கவைப்பது மூலத்தின் வெளிப்படையான பொருளை மதிக்கிறது; குறிப்பிட்ட இறையியல் விளக்கத்தையும் திணிப்பதில்லை.
translation_notes:
  register: நவீன செந்தமிழை அடிப்படையாகக் கொண்ட, கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. எபிரேய வாக்கியத்தின் காரண-கருவி உறவும் கால வரிசையும் பாதுகாக்கப்பட்டுள்ளன; தமிழில் சுட்டுப்பெயர் தெளிவுக்காக ‘எகிப்து’ இரண்டாவது முறையாக வெளிப்படையாகக் கூறப்பட்டுள்ளது.
