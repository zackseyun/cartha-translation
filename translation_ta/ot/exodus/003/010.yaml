  text: וְ/עַתָּ֣ה לְכָ֔/ה וְ/אֶֽשְׁלָחֲ/ךָ֖ אֶל פַּרְעֹ֑ה וְ/הוֹצֵ֛א אֶת עַמִּ֥/י בְנֵֽי יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/010.yaml
  text: And now[a], come, and I will send you to Pharaoh, and bring my people, the sons of Israel, out of Egypt.
translation:
  language: ta
  text: இப்போது நீ போ; நான் உன்னைப் பார்வோனிடம் அனுப்புவேன். என் மக்களான இஸ்ரவேலின் மகன்களை[a] எகிப்திலிருந்து வெளியே அழைத்து வா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் இயல்பான தமிழில், “இஸ்ரவேலர்.” எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: கட்டளையின் அடுத்த கட்டத்தை அறிமுகப்படுத்தும் காலம் மற்றும் உரையாடல் மாற்றத்தை இயல்பான நவீனத் தமிழில் காட்டுகிறது; தொடக்க ו தனியாக மொழிபெயர்க்கப்படாவிட்டாலும் அதன் தொடர்ச்சி சூழலில் வெளிப்படுகிறது.
- source_word: לְכָה
  choice: நீ போ
  rationale: הלך வினையின் ஆண்பால் ஒருமை ஏவல் வடிவம் இங்கு மோசேயை பணிக்காகப் புறப்படச் சொல்கிறது. தமிழில் இலக்கை நோக்கிய இயக்கத்தை இயல்பாகக் காட்ட “போ” தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְאֶשְׁלָחֲךָ
  choice: நான் உன்னை ... அனுப்புவேன்
  rationale: முதலாம் நபர் ஒருமை நிறைவுறா வினையையும் இரண்டாம் நபர் ஒருமை பின்னொட்டையும் நேரடியாகப் பிரதிபலித்து, தேவனுடைய அனுப்புதலைத் தெளிவாக வைத்திருக்கிறது.
- source_word: אֶל־פַּרְעֹה
  choice: பார்வோனிடம்
  rationale: திசையைக் குறிக்கும் אֶל என்பதையும் எகிப்திய அரசரின் பட்டத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: וְהוֹצֵא
  choice: வெளியே அழைத்து வா
  rationale: יצא என்பதன் ஹிஃபீல் ஏவல் வடிவத்திலுள்ள ‘வெளியே செல்லச் செய்’ என்ற காரணவினைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַמִּי
  choice: என் மக்களாகிய
  rationale: “என் மக்கள்” என்ற உடைமை மற்றும் உடன்படிக்கை சார்ந்த அடையாளத்தை நேரடியாகப் பாதுகாத்து, அடுத்து வரும் பெயரடையாளத்துடன் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களை
  rationale: எபிரெய மூலத்தின் குடும்ப மற்றும் மூதாதையர் சார்ந்த சொல்லமைப்பை முதன்மை உரையில் பாதுகாக்கிறது; வழக்கமான இனப்பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִמִּצְרָיִם
  choice: எகிப்திலிருந்து
  rationale: מן முன்னொட்டின் புறப்படும் இடத்தைக் குறிக்கும் பொருளையும், הוציא உடன் வரும் வெளியேற்ற இயக்கத்தையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: உடன்படிக்கை மக்களைக் குறிக்கும் בְנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: மூலத்தில் உள்ள ஆண்பால் பன்மை குடும்பச் சொல்லையும் இஸ்ரவேல் என்ற மூதாதையருடனான தொடர்பையும் முதன்மை உரை பாதுகாக்கிறது. முழு மக்களையும் குறிக்கும் வழக்கமான தமிழ்ச் சொல் வாசிப்புத் தெளிவுக்காக அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. “நீ போ” என்பது பணிக்காகப் புறப்படுமாறு கூறும் நேரடி ஏவலை வெளிப்படுத்துகிறது. இரண்டு வாக்கியங்களாகப் பிரித்தது தமிழின் இயல்பான ஓட்டத்தையும் கட்டளையின் தெளிவையும் மேம்படுத்துகிறது; மூலத்தின் தொடர்ச்சியான ஆணையமைப்பு பொருளில் பாதுகாக்கப்பட்டுள்ளது.
