  yaml_path: translation/ot/exodus/003/006.yaml
  text: Then he said, “I am the God of your father, the God of Abraham, the God of Isaac, and the God of Jacob.” And Moses hid his face, because he was afraid to look at God.
translation:
  language: ta
  text: அப்போது அவர், “நான் உன் தந்தையின் கடவுள்; ஆபிரகாமின் கடவுள், ஈசாக்கின் கடவுள், யாக்கோபின் கடவுள்” என்றார். மோசே கடவுளை நோக்கிப் பார்க்க அஞ்சியதால், தன் முகத்தை மறைத்துக்கொண்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது அவர் … என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ என்பது வரிசையை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: אָנֹכִי
  choice: நான்
  rationale: தனித்து வரும் வலியுறுத்தப்பட்ட முதலாம் நபர் சுட்டுப்பெயர் இது. தமிழின் பெயர்ப்பயனிலையில் ‘நான் … கடவுள்’ என்பதே இயல்பானது; தனியே ‘இருக்கிறேன்’ சேர்ப்பது இங்கு தேவையில்லை.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: உன் தந்தையின் கடவுள்
  rationale: ஒருமை உரிமை விகுதியையும் உடன்படிக்கை சார்ந்த அடையாளப்படுத்தலையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: ஆபிரகாமின் கடவுள், ஈசாக்கின் கடவுள், யாக்கோபின் கடவுள்
  rationale: எபிரெய மூலத்தில் ஒவ்வொரு முறையும் வரும் ‘கடவுள்’ என்ற சொல்லைச் சுருக்காமல் மீண்டும் கூறி, அதன் சொல்லாட்சிசார் மற்றும் உடன்படிக்கைசார் வலியுறுத்தலைக் காக்கிறது.
- source_word: וַיַּסְתֵּר … פָּנָיו
  choice: தன் முகத்தை மறைத்துக்கொண்டான்
  rationale: உடல்சார்ந்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது; ‘தன்’ என்பது செய்பவர் மோசே என்பதைக் தெளிவாக்குகிறது.
- source_word: כִּי יָרֵא
  choice: அஞ்சியதால்
  rationale: כִּי என்பதன் காரணப் பொருளையும் יָרֵא என்பதன் அச்சநிலையையும் சுருக்கமான, dignified நவீனத் தமிழில் தருகிறது.
- source_word: מֵהַבִּיט אֶל הָאֱלֹהִים
  choice: கடவுளை நோக்கிப் பார்க்க
  rationale: מן உடன் வரும் வினையெச்சம், அவர் செய்ய அஞ்சிய செயலைக் குறிக்கிறது. אֶל என்பதன் திசைநோக்குப் பொருளை ‘நோக்கி’ காக்கிறது.
theological_decisions:
- issue: நேரடியான தெய்வீகத் தன்னடையாளப்படுத்தலிலும் இறைத்தோற்றத்திலும் אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: தெய்வீக ஆளுமை
  rationale: பேசுகிறவர் முற்பிதாக்களின் கடவுள் என்று சூழல் வெளிப்படையாக அடையாளப்படுத்துகிறது. ‘கடவுள்’ என்பது அந்தக் குறிப்பிட்ட இறைச் சுட்டுதலை இயல்பாகக் காக்கிறது; பொதுப்படையான மாற்று உடன்படிக்கைசார் அடையாளத்தைத் தளர்த்தும்.
- issue: முற்பிதாக்கள் ஒவ்வொருவருடனும் ‘கடவுள்’ என்பதை மீண்டும் கூறுதல்
  choice: ஆபிரகாமின் கடவுள், ஈசாக்கின் கடவுள், யாக்கோபின் கடவுள்
  alternative: ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோரின் கடவுள்
  rationale: மூலத்தின் மீளுரைப்பைத் தக்கவைத்து, ஒவ்வொரு முற்பிதாவுடனான உறவின் சொல்லாட்சிசார் மற்றும் இறையியல்சார் அழுத்தத்தைச் சுருக்காமல் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய, இயல்பான, கண்ணியமான நடை. ‘தந்தை’ என்பது אָבִיךָ என்பதன் ஒருமையைப் பாதுகாக்கிறது. பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவங்களில் தரப்பட்டுள்ளன. அடிக்குறிப்புகள் தேவையில்லை.
