  terminology: ‘யாவே,’ ‘எபிரெயர்கள்,’ ‘மூப்பர்கள்,’ ‘வனாந்தரம்,’ ‘பலியிடுதல்’ ஆகியவை பொருத்தமானவை. ‘அரசன்’ என்பதும் ஏற்கத்தக்கது. அடிக்குறிப்பு மூலத்தின் சந்திப்பு/எதிர்கொள்ளுதல் என்ற பொருள் அகலத்தைப் பாதுகாக்கிறது; அதை முதல் நபர் சூழலுக்கேற்பச் சற்றுத் தெளிவுபடுத்தப்பட்டுள்ளது.
