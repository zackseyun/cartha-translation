base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/018.yaml
  text: And they will listen to your voice[a], and you and the elders of Israel will go to the king of Egypt and say to him, ‘Yahweh, the God of the Hebrews, has met with us. And now, please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God.’
translation:
  language: ta
  text: அவர்கள் உன் குரலுக்குச் செவிகொடுப்பார்கள். நீயும் இஸ்ரவேலின் மூப்பர்களும் எகிப்தின் அரசனிடம் செல்வீர்கள்; அவனிடம், ‘எபிரெயர்களின் கடவுளாகிய யாவே எங்களைச் சந்தித்திருக்கிறார்[a]. இப்போது தயவுசெய்து, நாங்கள் வனாந்தரத்திற்குள் மூன்று நாள் பயணம் செய்து செல்லவும், எங்கள் கடவுளாகிய யாவேக்குப் பலியிடவும் அனுமதியுங்கள்’ என்று சொல்வீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களை எதிர்கொண்டிருக்கிறார்.” இந்த எபிரெயச் சொற்றொடர், யாவே எங்களைச் சந்தித்தார் அல்லது எங்களை எதிர்கொண்டார் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְעוּ לְקֹלֶךָ
  choice: அவர்கள் உன் குரலுக்குச் செவிகொடுப்பார்கள்
  rationale: שׁמע என்பது கேட்பதையும் ஏற்றுப் பதிலளிப்பதையும் குறிக்கலாம். ‘குரலுக்குச் செவிகொடுப்பார்கள்’ என்பது மூலமொழியின் உருவகத்தைத் தக்கவைத்து, வெளிப்படையான கீழ்ப்படிதலை அளவுக்கு மீறிச் சேர்க்காமல் responsive listening என்ற பொருளைத் தருகிறது.
- source_word: וּבָאתָ אַתָּה וְזִקְנֵי יִשְׂרָאֵל
  choice: நீயும் இஸ்ரவேலின் மூப்பர்களும் ... சென்று
  rationale: மோசேயையும் மூப்பர்களையும் இணை எழுவாயாகத் தெளிவாகக் காட்டி, எகிப்தின் அரசனை நோக்கிய இயக்கத்தைத் தமிழில் இயல்பான ‘சென்று’ என்பதால் வெளிப்படுத்துகிறது.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: எகிப்தின் அரசன்
  rationale: எபிரெய கட்டமைப்புச் சொல்லிணையின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: אֱלֹהֵי הָעִבְרִיִּים
  choice: எபிரெயர்களின் கடவுள்
  rationale: மூலத்தில் உள்ள இனப்பெயரையும் உடைமைத் தொடர்பையும் நேரடியாகப் பேணுகிறது.
- source_word: נִקְרָה עָלֵינוּ
  choice: எங்களைச் சந்தித்திருக்கிறார்
  rationale: Niphal קרא + עַל இங்கு ஒரு தெய்வீகச் சந்திப்பு அல்லது எதிர்கொள்ளுதலைக் குறிக்கிறது. ‘சந்தித்திருக்கிறார்’ என்பது அழைத்தல் என்ற குறிப்பிட்ட பொருளைத் திணிக்காமல் நிகழ்ந்த சந்திப்பை இயல்பாகக் கூறுகிறது.
- source_word: נֵלֲכָה נָּא
  choice: தயவுசெய்து, நாங்கள் ... சென்று ... அனுமதியுங்கள்
  rationale: Cohortative உடன் வரும் נָא அரசனிடம் வைக்கப்படும் பணிவான வேண்டுகோள். தமிழில் ‘அனுமதியுங்கள்’ என முடிப்பது வேண்டுகோளின் உரையாடல் செயல்பாட்டைத் தெளிவாக்குகிறது.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: மூன்று நாள் பயணம்
  rationale: பயண நேரம் அல்லது தூரத்தைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கு இயல்பான தமிழ் இணை.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்திற்குள்
  rationale: இயக்க வினையுடன் இலக்கைச் சுட்டுகிறது; מִדְבָּר என்பதன் பரந்த பொருளை ‘பாலைவனம்’ என்பதைக் காட்டிலும் ‘வனாந்தரம்’ நன்றாகப் பேணுகிறது.
- source_word: וְנִזְבְּחָה
  choice: பலியிட
  rationale: பயணம் செல்லும் நோக்கத்தைத் தமிழில் இயல்பான நோக்க எச்சத்தால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் தனிப்பட்ட தெய்வீகப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது உரையின் பெயரியல் தன்மையைப் பேணுகிறது.
- issue: נִקְרָה עָלֵינוּ என்ற தெய்வீகச் சந்திப்பு மொழியின் பொருள்
  choice: எங்களைச் சந்தித்திருக்கிறார்
  alternative: எங்களை எதிர்கொண்டிருக்கிறார்; எங்களை அழைத்திருக்கிறார்
  rationale: இச்சொற்றொடர் சந்திப்பு அல்லது எதிர்கொள்ளுதலைக் குறிக்கிறது; அது குறிப்பாக அழைப்பு மட்டுமே என்று தீர்மானிக்காது. முதன்மை உரையும் அடிக்குறிப்பும் அந்தப் பொருள் அகலத்தைப் பேணுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘செவிகொடுப்பார்கள்,’ ‘மூப்பர்கள்,’ ‘வனாந்தரம்,’ ‘பலியிட’ போன்ற சொற்கள் வேதாகமச் சூழலின் துல்லியத்தையும் இயல்பான வாசிப்பையும் சமநிலைப்படுத்துகின்றன. மேற்கோளில் அரசனிடம் வைக்கப்படும் வேண்டுகோள் பணிவாகவும் தெளிவாகவும் அமைக்கப்பட்டுள்ளது.
