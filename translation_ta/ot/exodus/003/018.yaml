  source_fidelity: 'மூலத்தின் முக்கியப் பொருள்கள் நன்றாகப் பேணப்பட்டுள்ளன: ‘உன் குரலுக்குச் செவிகொடுப்பார்கள்,’ இஸ்ரவேலின் மூப்பர்களுடன் எகிப்தின் அரசனிடம் செல்லுதல், யாவே ‘எபிரெயர்களின் கடவுள்’ எனப்படுதல், மற்றும் மூன்று நாள் பயணத்திற்கான வேண்டுகோள் ஆகியவை துல்லியமாக உள்ளன. ஆனால் அறிவுறுத்தல் வினைநடையில் எதிர்காலக் கூற்றிலிருந்து (‘செவிகொடுப்பார்கள்’) கட்டளை வடிவத்திற்கு (‘சொல்லுங்கள்’) மாறுவது மூலத்தின் தொடர்ச்சியான எதிர்கால/வழிமுறை நடையைச் சரியாகக் காட்டவில்லை.'
