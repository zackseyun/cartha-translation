source:
  edition: WLC
  text: וּ/מֹשֶׁ֗ה הָיָ֥ה רֹעֶ֛ה אֶת צֹ֛אן יִתְר֥וֹ חֹתְנ֖/וֹ כֹּהֵ֣ן מִדְיָ֑ן וַ/יִּנְהַ֤ג אֶת הַ/צֹּאן֙ אַחַ֣ר הַ/מִּדְבָּ֔ר וַ/יָּבֹ֛א אֶל הַ֥ר הָ/אֱלֹהִ֖ים חֹרֵֽבָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/001.yaml
  text: Moses was shepherding the flock of Jethro his father-in-law[a], the priest of Midian. He led the flock beyond the wilderness and came to the mountain of God, Horeb.
translation:
  language: ta
  text: மோசே தன் மாமனாரும் மீதியானின் ஆசாரியருமான எத்திரோவின் மந்தையை மேய்த்துக்கொண்டிருந்தார். அவர் மந்தையை வனாந்தரத்தின் மறுபுறத்துக்கு[a] நடத்திச் சென்று, தேவனுடைய மலையான ஓரேபை அடைந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வனாந்தரத்திற்கு அப்பால்.”
    reason: אַחַר הַמִּדְבָּר என்ற இடவியல் சொற்றொடரை ‘மறுபுறம்’ அல்லது ‘அப்பால்’ எனப் புரிந்துகொள்ளலாம்.
lexical_decisions:
- source_word: וּמֹשֶׁה
  choice: மோசே
  rationale: வாவ் இணைப்புச்சொல் புதிய கதை நிகழ்வை அறிமுகப்படுத்துகிறது; தமிழில் தேவையற்ற ‘இப்போது’ அல்லது ‘மேலும்’ என்பதைக் கூட்டாமல் இயல்பாகப் பெயருடன் தொடங்கப்பட்டுள்ளது.
- source_word: הָיָה רֹעֶה
  choice: மேய்த்துக்கொண்டிருந்தார்
  rationale: தொடர்ந்து நடந்துகொண்டிருந்த இறந்தகாலச் செயலைத் தமிழில் இயல்பாகவும் துல்லியமாகவும் வெளிப்படுத்துகிறது.
- source_word: צֹאן
  choice: மந்தை
  rationale: ஆடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய சிறுகால்நடைக் கூட்டத்தைக் குறிக்கும் இயல்பான பொதுப்பெயர்.
- source_word: יִתְרוֹ חֹתְנוֹ
  choice: தன் மாமனும் … எத்திரோவின்
  rationale: חֹתֵן இச்சூழலில் திருமண உறவினால் வந்த தந்தையை, அதாவது மாமனாரைக் குறிக்கிறது; தமிழில் உறவையும் உடைமையையும் இயல்பான தொடராக அமைக்கிறது.
- source_word: כֹּהֵן מִדְיָן
  choice: மீதியானின் ஆசாரியருமான
  rationale: எத்திரோவை அடையாளப்படுத்தும் பெயரடைத் தொடராக அமைத்து, மீதியானுடன் உள்ள ஆசாரியப் பொறுப்பை நேரடியாகக் காட்டுகிறது.
- source_word: וַיִּנְהַג
  choice: நடத்திச் சென்று
  rationale: மந்தையை ஓர் இடத்துக்கு வழிநடத்திய பொருளைத் தருகிறது; ‘ஓட்டினார்’ என்பதிலுள்ள தேவையற்ற கடுமையான நிழற்பொருளைத் தவிர்க்கிறது.
- source_word: אַחַר הַמִּדְבָּר
  choice: வனாந்தரத்தின் மறுபுறத்துக்கு
  rationale: இடம் சார்ந்த אַחַר இங்கு வனாந்தரத்தின் பின்புறம் அல்லது அப்பால் என்ற பொருளைத் தருகிறது; ‘மறுபுறம்’ அந்த இடவியல் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַר הָאֱלֹהִים
  choice: தேவனுடைய மலை
  rationale: எபிரெயக் கட்டமைப்பை நேரடியாகப் பிரதிபலித்து, அந்த மலை ஏற்கெனவே பரிசுத்தமானதா அல்லது பின்னர் அவ்வாறு அறியப்பட்டதா என்பதை விளக்கிச் சொல்லாமல் விடுகிறது.
- source_word: חֹרֵבָה
  choice: ஓரேபை அடைந்தார்
  rationale: இடப்பெயருடன் சேர்ந்த திசைவேற்றுமை முடிவு ஓரேபை நோக்கிய இயக்கத்தைக் குறிக்கிறது; ‘அடைந்தார்’ தமிழில் வருகையையும் இலக்கையும் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: הַר הָאֱלֹהִים என்பது மலை ஏற்கெனவே பரிசுத்தமானது என்று பொருள்படுகிறதா, அல்லது பின்னோக்கிப் பயன்படுத்தப்பட்ட பெயரா?
  choice: தேவனுடைய மலை
  alternative: பரிசுத்த மலை
  rationale: மூலத்தின் நேரடியான உறவுத்தொடர் காக்கப்படுகிறது. ‘பரிசுத்த மலை’ என்று மொழிபெயர்த்தால் மூலத்தில் வெளிப்படையாக இல்லாத விளக்கம் சேர்ந்து, கதையிலுள்ள காலவியல் மற்றும் இறையியல் திறந்தநிலை தீர்க்கப்பட்டுவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. மோசேக்கு மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. நிலைபெற்ற வேதாகமப் பெயர்வடிவங்களான ‘எத்திரோ,’ ‘மீதியான்,’ ‘ஓரேப்’ ஆகியவை பயன்படுத்தப்பட்டுள்ளன; மூலத்தில் இல்லாத விளக்கங்கள் சேர்க்கப்படவில்லை.
