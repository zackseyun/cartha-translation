base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/007.yaml
  text: Then Yahweh said[a], “I have surely seen the affliction of my people who are in Egypt, and I have heard their cry because of their oppressors[c][b], for I know their sufferings.”
translation:
  language: ta
  text: 'அப்போது யாவே கூறினார்: “எகிப்தில் உள்ள என் மக்களின் துயரத்தை நான் நிச்சயமாகக் கண்டிருக்கிறேன்[a]. அவர்களை ஒடுக்குகிறவர்களினிமித்தம் அவர்கள் எழுப்பிய கூக்குரலை[b] நான் கேட்டிருக்கிறேன்[c]. ஏனெனில் அவர்களுடைய வேதனைகளை நான் அறிவேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உண்மையாகவே கண்டிருக்கிறேன்.” வலியுறுத்துவதற்காக எபிரேயத்தில் முடிவிலா வினை வடிவம் முற்றுவினையுடன் சேர்த்துப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுடைய அபயக்குரல்.”
    reason: lexical_alternative
  - marker: c
    text: “ஒடுக்குகிறவர்கள்” என்பதற்கு “கட்டாயமாக வேலை வாங்குகிற கண்காணிப்பாளர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: கடவுளின் தனிப்பட்ட பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலாக ஏற்கப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: רָאֹה רָאִיתִי
  choice: நான் நன்றாகவே கண்டிருக்கிறேன்
  rationale: முற்றுவினையுடன் வரும் வினையெச்சத் தனிச்சொல் அளிக்கும் வலியுறுத்தலை, இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֳנִי
  choice: துயரநிலை
  rationale: கொடுமையான சூழ்நிலையால் உண்டாகும் அவலத்தையும் துன்பத்தையும் உள்ளடக்கும் இயல்பான சொல்.
- source_word: עַמִּי
  choice: என் மக்கள்
  rationale: உடன்படிக்கை உறவை உணர்த்தும் நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: בְּמִצְרָיִם
  choice: எகிப்தில் இருக்கும்
  rationale: இந்த இடத்தொடர் ‘என் மக்கள்’ என்பதைக் குறிப்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: צַעֲקָתָם
  choice: அவர்களுடைய கூக்குரல்
  rationale: துயரத்திலிருந்து எழும் உரத்த அழைப்பை எளிமையாகவும் வலிமையாகவும் தெரிவிக்கிறது.
- source_word: מִפְּנֵי נֹגְשָׂיו
  choice: அவர்களை ஒடுக்குகிறவர்களால் எழும்
  rationale: அவர்களுடைய கூக்குரலுக்குக் காரணமான வேலை வாங்குவோரின் ஒடுக்குதலைத் தெளிவாகக் காட்டுகிறது; מִפְּנֵי என்பதன் காரணப் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יָדַעְתִּי
  choice: நான் அறிவேன்
  rationale: வடிவில் இறந்தகால வினையாக இருந்தாலும், சூழலில் இது நிகழ்காலத் தனிப்பட்ட, ஈடுபாடுள்ள அறிவைக் குறிக்கிறது.
- source_word: מַכְאֹבָיו
  choice: அவர்களுடைய வேதனைகள்
  rationale: உடல் மற்றும் மனத் துன்பங்களை உள்ளடக்கக்கூடிய பன்மைப் பொருளை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: YHWH என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா அல்லது ‘ஆண்டவர்’
  rationale: இறைவனின் உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் பாதுகாக்கிறது; குறிப்பிட்ட சமயப் பிரிவின் தனித்துவமான பயன்பாட்டையும் புகுத்தவில்லை.
- issue: இறைவனின் அறிவைப் பற்றிய மனித அனுபவ மொழி
  choice: அவர்களுடைய வேதனைகளை நான் அறிவேன்
  alternative: அவர்களுடைய வேதனைகளை நான் அறிந்துகொண்டேன்
  rationale: இஸ்ரவேலரின் துன்பத்தைப் பற்றிய இறைவனின் தனிப்பட்ட, உடனடியான அறிவை மங்கச் செய்யாமல் எபிரெய மொழியின் நேர்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெய வாக்கியத்தின் வலியுறுத்தலும், இறைவன் காண்கிறார், கேட்கிறார், அறிவார் என்ற மூன்று தனிப்பட்ட செயல்களின் இறையியல் நெருக்கமும் பாதுகாக்கப்பட்டுள்ளன.
