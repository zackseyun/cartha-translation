  revised_text: 'மேலும் கடவுள் மோசேயிடம் கூறினார்: “நீ இஸ்ரவேலின் மகன்களிடம் இவ்வாறு சொல்: ‘உங்கள் தந்தையரின் கடவுளும், ஆபிரகாமின் கடவுளும், ஈசாக்கின் கடவுளும், யாக்கோபின் கடவுளுமான யாவே[a] என்னை உங்களிடம் அனுப்பினார்.’ இதுவே என்றென்றைக்கும் என் பெயர்; தலைமுறை தலைமுறையாக இதுவே என் நினைவுக்குறி[b].”'
