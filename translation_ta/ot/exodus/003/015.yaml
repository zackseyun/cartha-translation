  text: וַ/יֹּאמֶר֩ ע֨וֹד אֱלֹהִ֜ים אֶל מֹשֶׁ֗ה כֹּֽה תֹאמַר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ יְהוָ֞ה אֱלֹהֵ֣י אֲבֹתֵי/כֶ֗ם אֱלֹהֵ֨י אַבְרָהָ֜ם אֱלֹהֵ֥י יִצְחָ֛ק וֵ/אלֹהֵ֥י יַעֲקֹ֖ב שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם זֶה שְּׁמִ֣/י לְ/עֹלָ֔ם וְ/זֶ֥ה זִכְרִ֖/י לְ/דֹ֥ר דֹּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/015.yaml
  text: 'God also said to Moses[a], “Thus you shall say to the sons of Israel: Yahweh, the God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob, has sent me to you. This is my name forever[b], and this is my memorial from generation to generation.”'
translation:
  language: ta
  text: 'மேலும் கடவுள் மோசேயிடம் கூறினார்: “நீ இஸ்ரவேலின் மகன்களிடம் இவ்வாறு சொல்: ‘உங்கள் தந்தையரின் கடவுளும், ஆபிரகாமின் கடவுளும், ஈசாக்கின் கடவுளும், யாக்கோபின் கடவுளுமான யாவே[a] என்னை உங்களிடம் அனுப்பினார்.’ இதுவே என்றென்றைக்கும் என் பெயர்; தலைமுறை தலைமுறையாக இதுவே என் நினைவுக்குறி[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் יהוה (YHWH), கடவுளின் தனிப்பெயர்; “யாவே” என்பது அதன் ஒலிபெயர்ப்பு.
    reason: יְהוָה என்ற தெய்வீகத் தனிப்பெயரின் எபிரெய வடிவத்தையும் தமிழிலுள்ள ஒலிபெயர்ப்பையும் தெரிவிக்கிறது.
  - marker: b
    text: 'அல்லது: “என் நினைவு” அல்லது “என்னை நினைவுகூரும் பெயர்.”'
    reason: זִכְרִי என்பதன் நினைவு, நினைவுக்குறி, மற்றும் பெயரால் நினைவுகூரப்படுதல் ஆகிய தொடர்புடைய சொற்பொருள் வாய்ப்புகளைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பட்டத்தால் மாற்றாமல், கடவுளின் தனிப்பெயராக ஒலிபெயர்க்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு உடன்படிக்கை மக்களையும் குறிக்கும் இயல்பான தமிழ் கூட்டுப்பெயராக ‘மக்கள்’ தெளிவாக உள்ளது.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: உங்கள் தந்தையரின் கடவுள்
  rationale: மூலத்தின் ஆண்பால் உறவுச் சொல்லைத் தக்கவைத்து, இங்கு குறிப்பிடப்படும் முற்பிதாக்களுடனான இணைப்பை வெளிப்படுத்துகிறது.
- source_word: שְׁלָחַנִי
  choice: என்னை உங்களிடம் அனுப்பினார்
  rationale: எபிரெய நிறைவுற்ற வினையை இயல்பான தமிழ் இறந்தகாலமாகக் கொடுத்து, மோசேயின் தற்போதைய பணியாணையையும் சூழல் உணர்த்த விடுகிறது.
- source_word: זֶה שְּׁמִי לְעֹלָם
  choice: இதுவே என்றென்றும் என் பெயர்
  rationale: לְעֹלָם குறிக்கும் நீடித்த, முடிவற்ற காலத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: זִכְרִי
  choice: என்னை நினைவுகூரும் பெயர்
  rationale: זכר என்ற ‘நினைவுகூருதல்’ வேர்ச் சொல்லின் பொருளைத் தெளிவாக்கி, சூழலில் கடவுள் அறியப்பட்டு நினைவுகூரப்படும் பெயரைக் குறிக்கிறது; ‘என் நினைவுச்சின்னம்’ என்ற முறையான மாற்றும் சாத்தியம்.
- source_word: לְדֹר דֹּר
  choice: தலைமுறை தலைமுறையாக
  rationale: அடுத்தடுத்த தலைமுறைகளில் தொடர்வதை எபிரெய மறுபடியுரைத்தலின் வலிமையுடன் இயல்பான தமிழில் தருகிறது.
- source_word: כֹּה תֹאמַר
  choice: நீ ... இவ்வாறு சொல்
  rationale: தெய்வீக அறிவுறுத்தலை அறிமுகப்படுத்தும் எபிரெய வாய்பாட்டை தெளிவான, மதிப்புமிக்க நவீன தமிழில் வழங்குகிறது.
- source_word: עוֹד
  choice: மேலும்
  rationale: முந்தைய தெய்வீக உரையின் தொடர்ச்சியைச் சுட்டுகிறது; மீண்டும் அதே செய்தியைச் சொன்னார் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: வசனம் YHWH என்ற தனிப்பெயரையே பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது வெளிப்படுத்தப்பட்ட பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற ஆண்பால் மரபுச் சொற்றொடர்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய வடிவம் சொல்லுக்குச் சொல் ‘மகன்கள்’ என்றாலும், இச்சூழலில் அது இஸ்ரவேல் சமூகத்தைக் கூட்டாகக் குறிக்கிறது. ‘மக்கள்’ என்பது அந்தக் குறிப்பை இயல்பாகத் தருகிறது; பாலினத்தைப் பற்றிய தனிப்பட்ட கோட்பாட்டை வசனத்தில் திணிக்காது.
- issue: זִכְרִי என்பதன் பொருள்
  choice: என்னை நினைவுகூரும் பெயர்
  alternative: என் நினைவு; என் நினைவுச்சின்னம்
  rationale: சொல் ‘நினைவு/நினைவுச்சின்னம்’ என்ற பொருட்களை அனுமதிக்கிறது. பெயர் குறித்த இணை அமைப்பில், கடவுள் நினைவுகூரப்படும் பெயர் என்ற வாசிப்பு தெளிவானது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பானதும் கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை. தெய்வீகப் பெயர் ஒலிபெயர்க்கப்பட்டது; ‘தந்தையர்’ மூலத்தின் உறவுமொழியைத் தக்கவைக்கிறது. பிரதான உரையிலுள்ள [a], [b] குறிகள் அடிக்குறிப்புகளுடன் நேரடியாகப் பொருந்துகின்றன.
