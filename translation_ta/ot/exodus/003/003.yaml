  to: அப்போது மோசே, “நான் வழிவிலகிச் சென்று இந்தப் பெரும் காட்சியைப் பார்க்கிறேன்; இந்தப் புதர் ஏன் எரிந்து அழிந்துபோகாமல் இருக்கிறது?” என்று கூறினார்.[a]
