source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אָסֻֽרָה נָּ֣א וְ/אֶרְאֶ֔ה אֶת הַ/מַּרְאֶ֥ה הַ/גָּדֹ֖ל הַ/זֶּ֑ה מַדּ֖וּעַ לֹא יִבְעַ֥ר הַ/סְּנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/003.yaml
  text: Then Moses said[a], “Let me turn aside and see this great sight, why the bush is not burned up.”
translation:
  language: ta
  text: அப்போது மோசே, “நான் வழிவிலகிச் சென்று இந்தப் பெரும் காட்சியைப் பார்க்கிறேன்; இந்தப் புதர் ஏன் எரிந்து அழிந்துபோகாமல் இருக்கிறது?” என்று கூறினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தப் புதர் ஏன் எரியவில்லை?” அல்லது, “இந்தப் புதர் ஏன் எரிந்து தீரவில்லை?”
    reason: எபிரெய வினை அடிப்படையில் ‘எரிதல்’ என்பதைக் குறிக்கிறது; இச்சூழலில் அது ‘எரிந்து அழிதல்/தீர்தல்’ என்ற பொருளையும் தரலாம்.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... சொன்னார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் ‘அப்போது’ இயல்பாக அந்த வரிசையைக் காட்டுகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: אָסֻרָה נָּא
  choice: நான் சற்றே விலகிச் சென்று
  rationale: விருப்பத்தைக் காட்டும் cohortative வடிவத்தையும் נָא தரும் மென்மையையும், இயல்பான தமிழ் தன்னுரையாகக் காட்டுகிறது.
- source_word: וְאֶרְאֶה
  choice: பார்ப்பேன்
  rationale: இங்கு ראה வெறுமனே காண்பதைவிட அணுகிச் சென்று கவனித்துப் பார்ப்பதைக் குறிக்கிறது.
- source_word: הַמַּרְאֶה הַגָּדֹל הַזֶּה
  choice: இந்த வியத்தகு காட்சி
  rationale: מַרְאֶה என்பது காணப்படும் காட்சி; גָּדוֹל இங்கு உடல் அளவைவிட அசாதாரணமான, வியப்பூட்டும் தன்மையைச் சுட்டுவதால் ‘வியத்தகு’ இயல்பாகப் பொருளைத் தருகிறது.
- source_word: מַדּוּעַ
  choice: ஏன்
  rationale: காரணத்தை வினவும் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: לֹא יִבְעַר
  choice: எரிந்து அழியவில்லை
  rationale: בּער அடிப்படையில் ‘எரி’ என்று பொருள்; சூழலில் புதர் தீப்பற்றி இருந்தும் தீர்ந்து போகாததே வியப்பு. ‘எரிந்து அழியவில்லை’ இந்தச் சூழற்பொருளைக் காட்டுகிறது; வினையின் கால/நிலைத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַסְּנֶה
  choice: புதர்
  rationale: סְנֶה ஒரு புதரைக் குறிக்கிறது; அது முட்புதராக இருக்கக்கூடும் என்றாலும், மூலவசனம் இங்கு அவ்வளவு குறிப்பாக்க வேண்டியதில்லை.
theological_decisions:
- issue: தீப்பற்றிய புதரின் நிகழ்வை மொழிபெயர்த்தல்
  choice: இந்தப் புதர் ஏன் எரிந்து அழியவில்லை?
  alternative: இந்தப் புதர் ஏன் எரியவில்லை? / இந்தப் புதர் ஏன் எரிந்து தீரவில்லை?
  rationale: எபிரெய வினை நேரடியாக ‘எரி’ என்பதைக் குறிக்கிறது; ஆயினும் உடனடி சூழலில் புதர் எரிந்துகொண்டிருந்தும் அழியாததே முரண்பாடான அற்புதம். தேர்ந்த வடிவம் இதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எந்தத் தனிப்பட்ட இறையியல் விளக்கத்தையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் கதைநடை இயல்பும் காக்கப்பட்டுள்ளன. மோசேயின் தன்னுரையைத் தமிழில் இயல்பாக அமைத்தபோதும், மூலத்தின் விருப்பநிலையும் வியப்பும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு பிரதான உரையில் இடம்பெற்றுள்ளது.
