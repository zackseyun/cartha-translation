review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the distributive ‘each woman,’ the feminine neighbor and resident, the broad categories of silver and gold articles and clothing, the distinct mention of sons and daughters, and the strong final sense of despoiling Egypt. However, ‘அணிவிப்பீர்கள்’ makes all the unspecified silver/gold articles necessarily wearable, whereas כלי remains broad in the Hebrew. A less restrictive rendering is needed.
  naturalness: The register is generally clear modern standard Tamil. ‘அண்டை வீட்டுப் பெண்’ is understandable, though ‘அண்டைப் பெண்’ is more idiomatic and still communicates the feminine neighbor. ‘கேட்க வேண்டும்’ is a direct, natural rendering of the instruction.
  terminology: ‘வெள்ளிப் பொருட்கள்,’ ‘பொன் பொருட்கள்,’ and ‘ஆடைகள்’ appropriately retain the breadth of the Hebrew. ‘கொள்ளையிடுவீர்கள்’ suitably represents the force of נצל. The alternative ‘உரித்தெடுப்பீர்கள்’ is not idiomatic Tamil in this context and should be replaced.
  issues:
  - severity: medium
    issue: ‘அணிவிப்பீர்கள்’ narrows the referent of the silver and gold articles.
    rationale: The Hebrew says to put the requested items on the sons and daughters, but the items are broadly designated כלי (‘articles/objects’), not explicitly ornaments. ‘அவர்கள்மேல் வைப்பீர்கள்’ preserves the source’s breadth without deciding their precise kind.
  - severity: low
    issue: The final footnote’s alternative ‘எகிப்தை உரித்தெடுப்பீர்கள்’ is unnatural Tamil.
    rationale: It does not idiomatically convey ‘despoil/strip’ in Tamil. ‘எகிப்தை வெறுமையாக்குவீர்கள்’ is a clear lexical alternative.
