base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/022.yaml
  text: Each woman shall ask from her neighbor and from the woman staying in her house articles of silver and articles of gold[a], and clothing; and you shall put them on your sons and on your daughters[c][b]. So you will plunder Egypt.
translation:
  language: ta
  text: ஒவ்வொரு பெண்ணும் தன் அண்டைப் பெண்ணிடமும், தன் வீட்டில் தங்கியிருக்கும் பெண்ணிடமும்[b] வெள்ளிப் பொருட்களையும் பொன் பொருட்களையும் ஆடைகளையும் கேட்க வேண்டும்[a]. நீங்கள் அவற்றை உங்கள் மகன்கள்மேலும் உங்கள் மகள்கள்மேலும் வைப்பீர்கள். நீங்கள் எகிப்தைக் கொள்ளையிடுவீர்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘கேட்டுக்கொள்ள வேண்டும்’. ‘கடனாக வாங்க வேண்டும்’ என்பது மரபான ஓர் மொழிபெயர்ப்பு; ஆனால் எபிரெய வினை அடிப்படையில் ‘கேள்’ அல்லது ‘கேட்டுக்கொள்’ என்றே பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘தன் வீட்டில் அந்நியராக வசிக்கும் பெண்ணிடமும்’.
    reason: lexical_alternative
  - marker: c
    text: அல்லது ‘எகிப்தின் உடைமைகளைப் பறித்தெடுப்பீர்கள்’ அல்லது ‘எகிப்தை வெறுமையாக்குவீர்கள்’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלָה
  choice: கேட்டுக்கொள்ள வேண்டும்
  rationale: שׁאל என்பதன் அடிப்படைப் பொருள் ‘கேள், கேட்டுக்கொள்’ என்பதாகும். திருப்பிக் கொடுக்க வேண்டிய கடனை இச்சூழல் குறிக்காததால் ‘கடனாக வாங்க வேண்டும்’ என்று மொழிபெயர்க்கப்படவில்லை.
- source_word: אִשָּׁה
  choice: ஒவ்வொரு பெண்ணும்
  rationale: ஒருமை வடிவம் இங்கு பகிர்ந்தளிக்கும் பொருளில் வருவதால், ஒவ்வொரு இஸ்ரவேல் பெண்ணையும் குறிக்கும் இயல்பான தமிழாக்கம் பயன்படுத்தப்பட்டது.
- source_word: מִשְּׁכֶנְתָּהּ
  choice: தன் அண்டை வீட்டுப் பெண்ணிடமும்
  rationale: எபிரெயச் சொல் பெண்பால் வடிவில் இருந்து, இச்சூழலில் பெண் அயலாரைக் குறிக்கிறது; அந்தப் பெண்பால் குறிப்பைத் தமிழ் முதன்மை உரை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: וּמִגָּרַת בֵּיתָהּ
  choice: தன் வீட்டில் தங்கியிருக்கும் பெண்ணிடமும்
  rationale: גור என்ற வேரிலிருந்து வரும் வடிவம் தற்காலிகமாகத் தங்குகிற அல்லது அந்நியராக வசிக்கிற ஒருவரைக் குறிக்கலாம். காலவரம்பைத் தீர்மானிக்காமல் ‘தங்கியிருக்கும் பெண்’ என்பது இயல்பாக அந்த விரிவைப் பாதுகாக்கிறது.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: வெள்ளிப் பொருட்களையும் பொன் பொருட்களையும்
  rationale: כְּלִי என்பது பாத்திரம், கருவி, பொருள் போன்ற விரிவான அர்த்தமுடையது. அவை நகைகளா பாத்திரங்களா என்பதை உரை குறிப்பிடாததால் பொதுவான ‘பொருட்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וּשְׂמָלֹת
  choice: ஆடைகளையும்
  rationale: இது பொதுவாக உடைகள் அல்லது ஆடைகளைக் குறிக்கிறது; ‘ஆடைகள்’ நவீனத் தமிழில் இயல்பானதும் விரிவானதும் ஆகும்.
- source_word: וְשַׂמְתֶּם עַל
  choice: அணிவிப்பீர்கள்
  rationale: ‘மேல் வைப்பீர்கள்’ என்ற நேரடிப் பொருளை, ஆடைகளும் மதிப்புள்ள பொருட்களும் மகன்கள் மற்றும் மகள்களின் மேல் வைக்கப்படும் சூழலில் இயல்பான தமிழில் ‘அணிவிப்பீர்கள்’ என வழங்குகிறது.
- source_word: בְּנֵיכֶם ... בְּנֹתֵיכֶם
  choice: உங்கள் மகன்களுக்கும் உங்கள் மகள்களுக்கும்
  rationale: மூல உரை மகன்களையும் மகள்களையும் தனித்தனியாகக் குறிப்பிடுவதால் இரண்டும் அப்படியே பாதுகாக்கப்பட்டன.
- source_word: וְנִצַּלְתֶּם אֶת מִצְרָיִם
  choice: இவ்வாறு எகிப்தைக் கொள்ளையிடுவீர்கள்
  rationale: נצל என்பதன் பியேல் வடிவம் இங்கு ஒருவரிடமிருந்து உடைமைகளைப் பறித்தெடுப்பதை, அதாவது கொள்ளையிடுதல் அல்லது உரித்தெடுத்தலைக் குறிக்கிறது. அதன் வலிமையை மென்மைப்படுத்தாமல் ‘கொள்ளையிடுவீர்கள்’ என்று வழங்கப்பட்டது.
theological_decisions:
- issue: எகிப்தியரின் பொருட்களை இஸ்ரவேலர் பெறுவதன் ஒழுக்கவியல் வலிமையை மென்மைப்படுத்தும் சாத்தியம்
  choice: இவ்வாறு எகிப்தைக் கொள்ளையிடுவீர்கள்
  alternative: இவ்வாறு எகிப்தை வெறுமையாக்குவீர்கள் / எகிப்தின் உடைமைகளைப் பறித்தெடுப்பீர்கள்
  rationale: மூல உரை இதைத் திருப்பிக் கொடுக்க வேண்டிய சாதாரணக் கடனாகச் சித்தரிக்கவில்லை. נצל என்ற வினையின் வலிமையையும், ஒடுக்குமுறையின் புரட்டிப்போடுதலாக உள்ள பதற்றத்தையும் மொழிபெயர்ப்பு மறைக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் மரியாதையும் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டது. பெண்பால் குறிப்புகள், மகன்கள்–மகள்கள் என்ற இணை, மற்றும் ‘கொள்ளையிடுதல்’ என்ற மூல உரையின் வலிமை பாதுகாக்கப்பட்டன. இறைபேச்சின் கட்டளை/உறுதி கலந்த எதிர்காலத் தொனி ‘வேண்டும்’ மற்றும் ‘அணிவிப்பீர்கள்/கொள்ளையிடுவீர்கள்’ மூலம் இயல்பாக வெளிப்படுத்தப்பட்டது.
