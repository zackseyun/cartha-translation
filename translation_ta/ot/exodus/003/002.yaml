base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/002.yaml
  text: Then the angel of Yahweh appeared to him in a flame of fire from the midst of the bush. He looked[a], and behold, the bush was burning with fire, but the bush was not consumed.
translation:
  language: ta
  text: அப்போது யாவேயின் தூதர்[a] முட்புதரின் நடுவிலிருந்து ஒரு நெருப்புச் சுடரில் அவருக்குத் தோன்றினார். அவர் பார்த்தார்; இதோ, முட்புதர் நெருப்பில் எரிந்துகொண்டிருந்தது; ஆனாலும் முட்புதர் எரிந்து அழியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் செய்தித் தூதர்.” எபிரேயச் சொல் “தூதர்” அல்லது “செய்தித் தூதர்” என இருவிதமாகவும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: தோன்றினார்
  rationale: נראה என்ற நிஃபால் வடிவம் இங்கு ‘காணப்பட்டார்’ என்பதைக் காட்டிலும் இயல்பாக ‘தோன்றினார்’ என்று பொருள்படுகிறது; தெய்வீக வெளிப்பாட்டுச் சூழலுக்கும் இது பொருந்துகிறது.
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאַךְ என்பது ‘தூதர்’ அல்லது ‘செய்தியாளர்’ எனப் பொருள்படலாம். ‘தூதர்’ என்பது தமிழில் இச்சூழலுக்கு இயல்பாக இருப்பதோடு, அந்த நபரின் அடையாளத்தை உரை கூறுவதைக் கடந்து வரையறுப்பதில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய உரையிலுள்ள உடன்படிக்கைப் பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், பெயராகவே ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
- source_word: בְּלַבַּת אֵשׁ
  choice: ஒரு நெருப்புச் சுடரில்
  rationale: ‘நெருப்பின் சுடர்’ என்ற மூலப்படிமத்தை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: முட்புதரின் நடுவிலிருந்து
  rationale: מִתּוֹךְ என்பதிலுள்ள ‘நடுவிலிருந்து’ என்ற திசைநிலையையும், סְנֶה என்பதற்கான வழக்கமான ‘முட்புதர்’ என்ற பொருளையும் நேரடியாகக் காட்டுகிறது.
- source_word: וַיַּרְא וְהִנֵּה
  choice: அவர் பார்த்தார்; இதோ
  rationale: மோசே கவனித்ததையும், வியப்பூட்டும் காட்சியின்மீது הִנֵּה கவனத்தை ஈர்ப்பதையும் தொடர்ச்சியாகப் பாதுகாக்கிறது.
- source_word: בֹּעֵר בָּאֵשׁ
  choice: நெருப்பில் எரிந்துகொண்டிருந்தது
  rationale: எபிரேயப் பெயரெச்ச வடிவத்தின் தொடர்நிலைச் செயலை ‘எரிந்துகொண்டிருந்தது’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֵינֶנּוּ אֻכָּל
  choice: எரிந்து அழியவில்லை
  rationale: אכל என்பதன் இச்சூழலிலான ‘முற்றிலும் எரித்து நுகரப்படுதல்’ என்ற கருத்தை இயல்பான தமிழில் தெரிவித்து, காட்சியின் முரண்பாட்டைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரையில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல் பெயராகவே வழங்குகிறது.
- issue: தெய்வத்தோற்றச் சூழலில் מַלְאַךְ என்பதன் பொருள்
  choice: தூதர்
  alternative: செய்தியாளர்
  rationale: வானுலகத் தூதரைக் குறிக்கும் இயல்பான வாசிப்பைப் பின்பற்றுகிறது; அதேவேளையில், அந்தச் சொல்லின் விரிவான ‘செய்தியாளர்’ பொருளை அடிக்குறிப்பில் வைத்துப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பது மூல உரையின் கவன ஈர்ப்பைத் தக்கவைக்கிறது. மோசேக்கும் யாவேயின் தூதருக்கும் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; முட்புதரின் இயல்பான இலக்கண எண் ஒருமையாக வைக்கப்பட்டுள்ளது.
