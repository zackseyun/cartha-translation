source:
  edition: WLC
  text: וַ/אֲנִ֣י יָדַ֔עְתִּי כִּ֠י לֹֽא יִתֵּ֥ן אֶתְ/כֶ֛ם מֶ֥לֶךְ מִצְרַ֖יִם לַ/הֲלֹ֑ךְ וְ/לֹ֖א בְּ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/019.yaml
  text: But I know that the king of Egypt will not let you go[a], except by a strong hand.
translation:
  language: ta
  text: ஆனால், எகிப்தின் அரசன் உங்களைப் போகவிட மாட்டான் என்று நான் அறிவேன்; வலிமையான கை அவனை வற்புறுத்தினாலன்றி.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எகிப்தின் அரசன் உங்களைப் போகவிட மாட்டான்; வலிமையான கையால்கூட அல்ல”; அல்லது, “வல்லமையான கையினாலன்றி.” எபிரெயத் தொடரில் கூறுகள் விடுபட்டுள்ளன. எனவே, வலிமையான கை மட்டுமே பார்வோனை இணங்கச் செய்யும் என்ற பொருளும், வலிமையான கையால்கூட அவன் விடமாட்டான் என்ற மாற்றுப் பொருளும் முன்வைக்கப்படுகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: ஆனால் ... எனக்கு
  rationale: இணைப்புச்சொல்லும் தனித்துப் பயன்படுத்தப்பட்ட முதலாம் நபர் சுட்டுப்பெயரும் உரையில் வலியுறுத்தலோடு கூடிய முரண்பாட்டு மாற்றத்தைக் காட்டுகின்றன; நவீன தமிழில் ‘ஆனால் ... எனக்கு’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יָדַעְתִּי
  choice: தெரியும்
  rationale: முற்றுவினை இங்கு தேவனுடைய உறுதியான, தற்போதும் நிலைத்திருக்கும் அறிவைக் குறிக்கிறது; ‘தெரியும்’ என்பது இயல்பான தமிழ்.
- source_word: כִּי
  choice: என்று
  rationale: அறியப்படும் செய்தியை அறிமுகப்படுத்தும் கூறாக இருப்பதால், தமிழில் மேற்கோள் நிறைவுருபான ‘என்று’ பொருத்தமானது.
- source_word: לֹא יִתֵּן אֶתְכֶם ... לַהֲלֹךְ
  choice: உங்களைப் போகவிட மாட்டான்
  rationale: נתן + வினையெச்ச அமைப்பு இங்கு அனுமதித்தல் என்ற மரபுத்தொடர் பொருளைக் கொண்டது; ‘போகவிட மாட்டான்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: எகிப்தின் அரசன்
  rationale: எபிரெயக் கட்டமைப்பின் நேரடியான, நவீனத் தமிழ் வடிவம்.
- source_word: וְלֹא בְּיָד חֲזָקָה
  choice: வலிமையான கையால் வற்புறுத்தப்பட்டாலன்றி
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமாகவும் விடுபட்ட கூறுடையதாகவும் உள்ளது. அடுத்த வசனத்தின் சூழலில், மிகுந்த வல்லமையால் வற்புறுத்தப்பட்டால் மட்டுமே பார்வோன் இணங்குவான் என்ற பொருளை இவ்வடிவம் தெளிவாக்குகிறது; அதேவேளை ‘கை’ என்ற யாத்திராகமத்தின் முக்கிய உருவகத்தையும் காக்கிறது.
theological_decisions:
- issue: וְלֹא בְּיָד חֲזָקָה என்ற விடுபட்ட கூறுடைய சொற்றொடரின் விளக்கம்
  choice: வலிமையான கையால் வற்புறுத்தப்பட்டாலன்றி பார்வோன் இஸ்ரவேலரைப் போகவிட மாட்டான்.
  alternative: ‘வலிமையான கையால்கூட அவன் போகவிட மாட்டான்’ அல்லது ‘வல்லமையான கையினாலன்றி அவன் போகவிட மாட்டான்.’
  rationale: சொற்றொடர் இலக்கண ரீதியாகச் சுருக்கப்பட்டுள்ளது. 20ஆம் வசனத்தில் தேவன் எகிப்தை அற்புதங்களால் தாக்குவதாகக் கூறுவது, மிகுந்த வல்லமையின் கட்டாயத்தின்கீழ் மட்டுமே பார்வோன் இணங்குவான் என்ற வாசிப்பை ஆதரிக்கிறது. உண்மையான மாற்று வாசிப்புகள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, தெளிவான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘வலிமையான கை’ உருவகம் காக்கப்பட்டுள்ளது; தெளிவிற்காக முதன்மை வாக்கியத்தில் மறைபொருள் வெளிப்படுத்தப்பட்டாலும், மூலத்தின் ambiguity அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
