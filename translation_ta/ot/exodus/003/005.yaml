reference: Exodus 3:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אַל תִּקְרַ֣ב הֲלֹ֑ם שַׁל נְעָלֶ֨י/ךָ֙ מֵ/עַ֣ל רַגְלֶ֔י/ךָ כִּ֣י הַ/מָּק֗וֹם אֲשֶׁ֤ר אַתָּה֙ עוֹמֵ֣ד עָלָ֔י/ו אַדְמַת קֹ֖דֶשׁ הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/005.yaml
  text: Then he said[a], “Do not come near here. Remove your sandals from your feet[b], because the place where you are standing is holy ground.”
translation:
  language: ta
  text: அப்போது அவர், “இங்கே நெருங்கி வராதே. உன் கால்களில் இருக்கும் செருப்புகளைக் கழற்று; ஏனெனில் நீ நிற்கிற இடம் பரிசுத்த நிலம்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது அவர் ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீனத் தமிழில் இயல்பாக வரும்படி பேச்சைச் சூழ்ந்து ‘அப்போது அவர் ... என்றார்’ என வழங்கப்பட்டது.
- source_word: אַל תִּקְרַב הֲלֹם
  choice: இங்கே நெருங்கி வராதே
  rationale: אַל உடன் வரும் வினைவடிவம் தடைக் கட்டளையைக் குறிக்கிறது; הֲלֹם இவ்விடத்தைச் சுட்டுகிறது. ‘நெருங்கி வராதே’ என்பது உடனடியான இடவியல் எச்சரிக்கையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: שַׁל נְעָלֶיךָ מֵעַל רַגְלֶיךָ
  choice: உன் கால்களில் இருக்கும் செருப்புகளைக் கழற்று
  rationale: שַׁל என்பது அகற்று அல்லது கழற்று என்ற கட்டளை; נְעָלֶיךָ அக்காலப் பாதணிகளைச் சுட்டுவதால் ‘செருப்புகள்’ பொருத்தமானது. ‘கால்களில் இருக்கும்’ என்பது מֵעַל רַגְלֶיךָ என்பதன் இடவியல் உறவைத் தெளிவாக வைத்திருக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல் என்பதால் ‘ஏனெனில்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עוֹמֵד עָלָיו
  choice: நீ நிற்கிற இடம்
  rationale: எபிரெய உரையின் தொடர்புச் சொற்றொடரைத் தமிழில் இயல்பாகச் சுருக்குகிறது; עָלָיו குறிக்கும் ‘அதன்மேல்’ என்ற உறவு ‘இடம்’ மற்றும் ‘நிற்கிற’ என்பவற்றிலேயே தெளிவாக உள்ளது.
- source_word: אַדְמַת קֹדֶשׁ
  choice: பரிசுத்த நிலம்
  rationale: ‘பரிசுத்தத்திற்குரிய நிலம்/பரிசுத்தமான நிலம்’ என்ற இணைநிலைப் பொருளை, மதிப்புமிக்கதும் வழக்கிலுள்ளதுமான தமிழில் ‘பரிசுத்த நிலம்’ எனத் தருகிறது.
- source_word: הוּא
  choice: '[பெயரெச்சப் பயனிலை அமைப்பில் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இங்கு சுட்டுப்பெயர் பெயர்ப்பயனிலை முடிவுறுத்துகிறது; தமிழில் ‘இடம் பரிசுத்த நிலம்’ என்ற அமைப்பே இணைப்புவினை இன்றி இயல்பாக முழுப் பொருளையும் தருகிறது.
theological_decisions:
- issue: இடத்தின் பரிசுத்தத்தின் தன்மை
  choice: ‘நீ நிற்கிற இடம் பரிசுத்த நிலம்’ என்று விளக்கச் சேர்க்காமல் உரையின் கூற்றை மட்டும் வழங்குதல்
  alternative: அந்த இடம் கடவுளின் பிரசன்னத்தால் பரிசுத்தமானது என்று மொழிபெயர்ப்பிலேயே வெளிப்படையாக விளக்குதல்
  rationale: இவ்வசனம் அந்த நிலத்தைப் பரிசுத்தமானது என்று அறிவிக்கிறது; ஆனால் அதன் பரிசுத்தம் எவ்வாறு ஏற்பட்டது என்பதை இவ்வாக்கியத்திலேயே விளக்கவில்லை. ஆகவே இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; ஒருமை இரண்டாம் நபருக்கான நேரடி கட்டளைகள் பயன்படுத்தப்பட்டுள்ளன. மொழிநடை இயல்பாகவும் கண்ணியமாகவும் இருந்து, எபிரெய உரையின் இடவியல் விவரங்களையும் பரிசுத்தம் குறித்த கூற்றையும் பாதுகாக்கிறது.
