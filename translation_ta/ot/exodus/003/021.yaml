  text: וְ/נָתַתִּ֛י אֶת חֵ֥ן הָֽ/עָם הַ/זֶּ֖ה בְּ/עֵינֵ֣י מִצְרָ֑יִם וְ/הָיָה֙ כִּ֣י תֵֽלֵכ֔וּ/ן לֹ֥א תֵלְכ֖וּ רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/021.yaml
  text: And I will give this people favor in the sight of the Egyptians[a], and when you go[b], you will not go empty-handed.
translation:
  language: ta
  text: இந்த மக்கள் எகிப்தியர்களின் பார்வையில் தயவு பெறும்படி செய்வேன்[a]. நீங்கள் புறப்படும்போது, வெறுங்கையோடு போகமாட்டீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, ‘எகிப்தியர்களின் கண்களில் இந்த மக்களுக்குத் தயவு அளிப்பேன்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நீங்கள் போகும்போது வெறுமையாகப் போகமாட்டீர்கள்.’ எபிரெய மரபுத்தொடர், பொருட்களோ தேவையானவற்றோ இல்லாமல் புறப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: கிடைக்கும்படி நான் செய்வேன்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு’. ஆனால் חֵן உடனான இந்த எபிரெயச் சேர்க்கை, ஒருவருக்கு மற்றவர்களிடத்தில் தயவு அல்லது நல்லெண்ணம் கிடைக்கச் செய்வதைக் குறிக்கிறது; இத்தமிழாக்கம் அந்தக் கருத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: חֵן
  choice: தயவு
  rationale: இங்கு חֵן என்பது சமூக உறவில் கிடைக்கும் சாதகமான பார்வை, நல்லெண்ணம் அல்லது அன்பான ஏற்றுக்கொள்ளுதலைக் குறிக்கிறது. ‘கிருபை’ என்பது இச்சூழலில் தேவையற்ற இறையியல் சுமையை ஏற்படுத்தக்கூடும்.
- source_word: הָעָם הַזֶּה
  choice: இந்த மக்களுக்கு
  rationale: ஒருமை கூட்டுப்பெயரான עָם இஸ்ரவேல் மக்களை ஒரே சமூகமாகக் குறிக்கிறது. நவீனத் தமிழில் ‘இந்த மக்கள்’ இயல்பாக இருப்பதால், வேற்றுமை உருபுடன் ‘இந்த மக்களுக்கு’ என வழங்கப்படுகிறது.
- source_word: בְּעֵינֵי מִצְרָיִם
  choice: எகிப்தியர்களின் பார்வையில்
  rationale: சொல்லர்த்தமாக ‘எகிப்தியர்களின் கண்களில்’ என்று வரும் எபிரெய மரபுத்தொடர், அவர்கள் இம்மக்களை எவ்வாறு கருதுவார்கள் என்பதைக் குறிக்கிறது. ‘பார்வையில்’ என்பது உருவகத்தையும் பொருளையும் காக்கிறது.
- source_word: וְהָיָה כִּי
  choice: …போது
  rationale: எதிர்காலச் சூழலை அறிமுகப்படுத்தும் வழக்கமான எபிரெயத் தொடரை, தமிழில் இயல்பான காலவாக்கியமாக ‘புறப்படும்போது’ எனக் கொடுக்கிறது.
- source_word: תֵלֵכוּן / תֵלְכוּ
  choice: புறப்படும்போது / போகமாட்டீர்கள்
  rationale: הלך என்பதன் அடிப்படைப் பொருள் ‘போ’. இச்சூழலில் முதல் இடத்தில் எகிப்திலிருந்து புறப்படுதல் தெளிவாக இருப்பதால் ‘புறப்படும்போது’ என்றும், இரண்டாம் இடத்தில் எபிரெயச் சொல்லின் எளிமையைப் பேண ‘போகமாட்டீர்கள்’ என்றும் வழங்கப்படுகிறது.
- source_word: רֵיקָם
  choice: வெறுங்கையோடு
  rationale: רֵיקָם என்பது ‘வெறுமையாக, எதுவுமின்றி’ என்பதைக் குறிக்கிறது. புறப்படும் சூழலில் உடைமைகள் அல்லது பொருட்கள் இல்லாமல் செல்வதைத் தமிழில் ‘வெறுங்கையோடு’ தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
