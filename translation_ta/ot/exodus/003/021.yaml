revisions:
- from: இந்த மக்களுக்கு எகிப்தியர்களின் பார்வையில் தயவு கிடைக்கும்படி நான் செய்வேன்[a]. நீங்கள் புறப்படும்போது, வெறுங்கையோடு போகமாட்டீர்கள்[b].
  to: இந்த மக்கள் எகிப்தியர்களின் பார்வையில் தயவு பெறும்படி செய்வேன்[a]. நீங்கள் புறப்படும்போது, வெறுங்கையோடு போகமாட்டீர்கள்[b].
  rationale: 'The revision clarifies the relation conveyed by ‘in the eyes of the Egyptians’: the people receive favor as they are regarded by the Egyptians. It preserves the future promise, collective singular sense of ‘this people,’ and the departure idiom without adding interpretive detail.'
