translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வெறுங்கையோடு’ என்ற இயல்பான தமிழ் மரபுத்தொடர் மூலத்தின் கருத்தைத் தெளிவாக வெளிப்படுத்துகிறது; அடிக்குறிப்பு சொல்லர்த்த வடிவத்தைப் பாதுகாக்கிறது.
