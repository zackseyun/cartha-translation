base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/008.yaml
  text: And I have come down to deliver him from the hand of Egypt and to bring him up from that land to a good and broad land[a], to a land flowing with milk and honey, to the place of the Canaanite, the Hittite, the Amorite, the Perizzite, the Hivite[c][b], and the Jebusite.
translation:
  language: ta
  text: நான் அவனை[b] எகிப்தின் கையிலிருந்து[a] விடுவிக்கவும், அந்த நாட்டிலிருந்து அவனை மேலே கொண்டுபோகவும் இறங்கி வந்திருக்கிறேன்; நல்லதும் விசாலமானதுமான ஒரு நாட்டுக்கு[c], பாலும் தேனும் ஓடும் ஒரு நாட்டுக்கு, கானானியர், ஏத்தியர், எமோரியர், பெரிசியர், ஏவியர், எபூசியர் ஆகியோர் வாழும் இடத்துக்கு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எகிப்தின் கையிலிருந்து” என்பது எகிப்தின் அதிகாரம் அல்லது கட்டுப்பாட்டிலிருந்து என்று பொருள்படும் எபிரேய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: “விடுவிக்கவும்” என்பதோடும் “மேலே கொண்டுபோகவும்” என்பதோடும் தொடர்புடைய “அவனை” என்பது எபிரேயத்தில் ஒருமையில் உள்ளது; அது இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாக ஒரே மக்களாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது “நல்லதும் பரந்ததுமான ஒரு நாட்டுக்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֵד
  choice: இறங்கி வந்திருக்கிறேன்
  rationale: இறங்குதல் என்ற இடம்சார்ந்த, மனித உருவக மொழியை மறைக்காமல் வைத்திருக்கிறது; தமிழ் உரையாடலில் நிறைவேறியதும் தற்போதைய நோக்கத்துடன் தொடர்புடையதுமான செயலை இயல்பாகக் காட்டுகிறது.
- source_word: לְהַצִּילוֹ
  choice: அவனை ... விடுவித்து
  rationale: נצל என்பதன் ஆபத்து அல்லது அடக்குமுறையிலிருந்து மீட்டெடுக்கும் பொருளைத் தருகிறது; தேவையற்ற பிற்கால இறையியல் நுண்பொருளைச் சேர்ப்பதில்லை.
- source_word: מִיַּד מִצְרַיִם
  choice: எகிப்தின் கையிலிருந்து
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரேய உருவகத்தைத் தக்கவைக்கிறது; அதன் மரபுத்தொடர் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: וּלְהַעֲלֹתוֹ
  choice: அவனை மேலே கொண்டுபோவதற்காக
  rationale: Hiphil வடிவத்தின் ‘மேலே செல்லச் செய்தல்/மேலே கொண்டுபோதல்’ என்ற பொருளையும் யாத்திராகமச் சூழலின் நிலவியல் செங்குத்து உருவகத்தையும் காக்கிறது.
- source_word: מִן הָאָרֶץ הַהִוא
  choice: அந்த நாட்டிலிருந்து
  rationale: சுட்டுப்பெயரைக் காத்து, முன்பு குறிப்பிடப்பட்ட எகிப்தை தேவையின்றி மீண்டும் விரித்துரைக்கவில்லை.
- source_word: אֶל אֶרֶץ טוֹבָה וּרְחָבָה
  choice: நல்லதும் விசாலமானதுமான ஒரு நாட்டுக்கு
  rationale: טוֹבָה என்பதற்கு ‘நல்ல’ என்றும் רְחָבָה என்பதற்கு பரப்பும் இடவசதியும் உணர்த்தும் ‘விசாலமான’ என்றும் இயல்பான தமிழில் மொழிபெயர்க்கிறது.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: பாலும் தேனும் ஓடும் ஒரு நாடு
  rationale: செழிப்பையும் மிகுதியையும் வெளிப்படுத்தும் மூலமொழியின் ஓடுதல் உருவகத்தை எளிய, மரியாதையான தமிழில் தக்கவைக்கிறது.
- source_word: אֶל מְקוֹם
  choice: வாழும் இடத்துக்கு
  rationale: מְקוֹם என்பதன் ‘இடம்’ என்ற பொருளைத் தக்கவைத்து, மக்கள் பெயர்ப் பட்டியலுடன் தமிழில் இயல்பாக இணைக்க ‘வாழும்’ என்பது வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: கானானியர், ஏத்தியர், எமோரியர், பெரிசியர், ஏவியர், எபூசியர்
  rationale: எபிரேய ஒருமை இனப்பெயர்கள் கூட்டாக மக்களைக் குறிப்பதால், தமிழில் இயல்பான மரியாதைப் பன்மை/கூட்டுப்பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
theological_decisions:
- issue: ‘நான் இறங்கி வந்திருக்கிறேன்’ என்பதில் கடவுளுக்குக் கூறப்படும் இடம்சார்ந்த இயக்கம்
  choice: இறங்குதல் என்ற மூல உருவகத்தை நேரடியாகத் தக்கவைத்தல்
  alternative: ‘நான் தலையிட வந்திருக்கிறேன்’ அல்லது ‘செயல்படத் தீர்மானித்தேன்’ என்று பொருளுரைத்தல்
  rationale: மூலவசனம் கடவுளின் செயலை உயிரோட்டமான இடம்சார்ந்த மொழியில் கூறுகிறது. அதை நீக்குவது உரையின் இறையியல் மற்றும் கதைசார் அழுத்தத்தைத் தணித்துவிடும்.
- issue: இஸ்ரவேல் மக்களைக் குறிக்கும் ஒருமைப் பின்னொட்டுகள்
  choice: ‘அவனை’ என்ற ஒருமையை இரு இடங்களிலும் தக்கவைத்தல்
  alternative: தற்காலத் தமிழ் தெளிவுக்காக ‘அவர்களை’ என்ற பன்மையைப் பயன்படுத்துதல்
  rationale: எபிரேய உரை இஸ்ரவேலை ஒரே கூட்டு ஆளுமையாகக் காட்டும் ஒருமைப் பின்னொட்டுகளைப் பயன்படுத்துகிறது. அடிக்குறிப்புடன் ஒருமையை வைத்திருப்பது அந்தக் கூட்டொருமைப் பார்வையைத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையைப் பயன்படுத்துகிறது. மூலத்தின் இடம்சார்ந்த உருவகங்கள், கூட்டொருமை, நாட்டின் செழிப்பு ஆகியவை தக்கவைக்கப்பட்டுள்ளன. இனப்பெயர்கள் தமிழில் வழக்கமான வேதாகம வடிவங்களிலும் இயல்பான கூட்டுப்பெயர் நடையிலும் தரப்பட்டுள்ளன.
