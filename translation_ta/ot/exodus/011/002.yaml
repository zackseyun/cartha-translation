revisions:
- from: மக்களின் செவிகளில் இப்போது சொல்; ஒவ்வொரு ஆணும் தன் அயலானிடமும், ஒவ்வொரு பெண்ணும் தன் அயலாளிடமும் வெள்ளிப் பொருட்களையும் பொன் பொருட்களையும் கேட்டு வாங்கட்டும்.[a]
  to: மக்கள் கேட்கும்படி இப்போது பேசு; ஒவ்வொரு ஆணும் தன் அயலவரிடமிருந்து, ஒவ்வொரு பெண்ணும் தன் அயலவரிடமிருந்து வெள்ளிப் பொருட்களையும் பொன் பொருட்களையும் கேட்கட்டும்.[a]
  rationale: The revision removes the added sense of obtaining the articles, renders the Hebrew hearing idiom naturally in modern Tamil, and makes the ‘from one’s neighbor’ relationship explicit. It retains the imperative/directive sequence, gendered distributive subjects, broad category of articles, and the footnoted traditional ‘borrow’ alternative.
