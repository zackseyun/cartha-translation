  text: דַּבֶּר נָ֖א בְּ/אָזְנֵ֣י הָ/עָ֑ם וְ/יִשְׁאֲל֞וּ אִ֣ישׁ מֵ/אֵ֣ת רֵעֵ֗/הוּ וְ/אִשָּׁה֙ מֵ/אֵ֣ת רְעוּתָ֔/הּ כְּלֵי כֶ֖סֶף וּ/כְלֵ֥י זָהָֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/002.yaml
  text: Speak now in the hearing of the people[a], and let each man ask from his neighbor, and each woman from her neighbor, for articles of silver and articles of gold.
translation:
  language: ta
  text: மக்கள் கேட்கும்படி இப்போது பேசு; ஒவ்வொரு ஆணும் தன் அயலவரிடமிருந்து, ஒவ்வொரு பெண்ணும் தன் அயலவரிடமிருந்து வெள்ளிப் பொருட்களையும் பொன் பொருட்களையும் கேட்கட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடனாக வாங்கட்டும்.” எபிரேய வினைச்சொல் “கேள்” அல்லது “வேண்டிக்கொள்” என்று பொருள்படும்; பொருட்கள் திருப்பிக் கொடுக்கப்பட வேண்டும் என்பதை அந்தச் சொல் தானாகக் குறிப்பிடுவதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֶּר נָא
  choice: இப்போது சொல்
  rationale: דַּבֶּר என்பது நேரடியான கட்டளை; נָא இங்கு வேண்டுகோள் அல்லது உடனடித்தன்மையைக் குறிக்கலாம். தெய்வீகக் கட்டளையின் சூழலில் இயல்பான தமிழுக்காக ‘இப்போது’ என வழங்கப்பட்டது.
- source_word: בְּאָזְנֵי הָעָם
  choice: மக்களின் செவிகளில்
  rationale: ‘மக்களின் காதுகளில்’ என்ற எபிரேய மரபுத்தொடரின் உருவகத்தைத் தக்கவைத்து, அவர்கள் கேட்கும்படி சொல்வதைக் குறிக்கிறது.
- source_word: וְיִשְׁאֲלוּ
  choice: கேட்டு வாங்கட்டும்
  rationale: שאל என்பது கேட்பது அல்லது வேண்டிப் பெறுவது; திருப்பிக் கொடுக்க வேண்டிய கடன்வாங்குதலைத் தானாகக் குறிக்காது. தமிழில் பொருட்களை ஒருவரிடமிருந்து ‘கேட்கட்டும்’ என்பது தெளிவில்லாமலிருக்கக்கூடும் என்பதால் ‘கேட்டு வாங்கட்டும்’ என இயல்பாக வழங்கப்பட்டது.
- source_word: אִישׁ ... וְאִשָּׁה
  choice: ஒவ்வொரு ஆணும் ... ஒவ்வொரு பெண்ணும்
  rationale: ஆண்பால் மற்றும் பெண்பால் ஒருமைச் சொற்களின் பகிர்வுப்பொருளையும் இணை அமைப்பையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: מֵאֵת רֵעֵהוּ ... מֵאֵת רְעוּתָהּ
  choice: தன் அயலானிடமும் ... தன் அயலாளிடமும்
  rationale: רֵעַ / רְעוּתָהּ என்பவை அயலார், தோழர் அல்லது உடனிருப்பவர் எனப் பொருள்படலாம். பாலின இணை அமைப்பைக் காக்க ‘அயலான்/அயலாள்’ பயன்படுத்தப்பட்டது.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: வெள்ளிப் பொருட்களையும் பொன் பொருட்களையும்
  rationale: כְּלִי என்பது பாத்திரங்கள், கருவிகள் அல்லது பலவகைப் பொருட்களைக் குறிக்கும் பரந்த சொல். குறிப்பிட்ட வகையைச் சேர்க்காமல் ‘பொருட்கள்’ அந்தப் பரப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: எகிப்தியரிடமிருந்து மதிப்புள்ள பொருட்களைப் பெறும் சூழலில் שאל என்பதன் பொருள்
  choice: கேட்டு வாங்கட்டும்
  alternative: கடனாக வாங்கட்டும்
  rationale: எபிரேய வினைச்சொல் கேட்பது அல்லது வேண்டிப் பெறுவதைக் குறிக்கிறது; பொருட்களைத் திருப்பிக் கொடுக்க வேண்டும் என்பதைச் சொல்லிலேயே குறிப்பிடவில்லை. ஆகவே கடன்வாங்குதல் என்ற விளக்கத்தை முதன்மை உரையில் சேர்க்காமல், பாரம்பரிய மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடை. எபிரேய மரபுத்தொடரின் செவிசார் உருவகம் பாதுகாக்கப்பட்டுள்ளது; שאל தொடர்பான உண்மையான பொருள் வேறுபாடு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
