    text: அல்லது, “கடனாக வாங்கட்டும்.” எபிரேய வினைச்சொல் “கேள்” அல்லது “வேண்டிக்கொள்” என்று பொருள்படும்; பொருட்கள் திருப்பிக் கொடுக்கப்பட வேண்டும் என்பதை அந்தச் சொல் தானாகக் குறிப்பிடுவதில்லை.
