source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה כֹּ֖ה אָמַ֣ר יְהוָ֑ה כַּ/חֲצֹ֣ת הַ/לַּ֔יְלָה אֲנִ֥י יוֹצֵ֖א בְּ/ת֥וֹךְ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/004.yaml
  text: 'Then Moses said[a], “Thus says Yahweh: About midnight I will go out into the midst of Egypt.”'
translation:
  language: ta
  text: 'அப்போது மோசே சொன்னார்: “யாவே இவ்வாறு கூறுகிறார்: ‘ஏறக்குறைய நள்ளிரவில்[a] நான் எகிப்தின் நடுவிற்குள் செல்வேன்.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நள்ளிரவில்.” எபிரெயத்தில் ‘நள்ளிரவு’ என்பதற்கு முன் வரும் முன்னொட்டு தோராயமான நேரத்தைக் குறிக்கக்கூடும்; அதனால் “ஏறக்குறைய நள்ளிரவில்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... சொன்னார்
  rationale: வாவ் தொடர்வினை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; நவீன தமிழில் இயல்பாக அதன் தொடர்ச்சிப் பொருளை வெளிப்படுத்துகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழில் வழக்கிலுள்ள பெயர் வடிவம்.
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: தூதுச் செய்தியை அறிமுகப்படுத்தும் எபிரெய நிலையான வாய்பாட்டை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பெயரைப் பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு வடிவத்தில் தருகிறது.
- source_word: כַּחֲצֹת הַלַּיְלָה
  choice: நள்ளிரவு அளவில்
  rationale: முன்னொட்டு כְּ உணர்த்தக்கூடிய தோராயப் பொருளைப் பாதுகாக்கிறது; துல்லியமான நேரமாக மிகைப்படுத்தவில்லை.
- source_word: אֲנִי
  choice: நான்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள முதலாம் நபர் சுட்டுப்பெயரையும் அதன் வலியுறுத்தலையும் தக்கவைக்கிறது.
- source_word: יוֹצֵא
  choice: புறப்பட்டுச் செல்வேன்
  rationale: இங்கே பங்கேற்புவினை உடனடியாக நிகழவிருக்கும் எதிர்காலச் செயலைக் குறிக்கிறது; இயக்கத்தையும் தெளிவாக்குகிறது.
- source_word: בְּתוֹךְ
  choice: நடுவே
  rationale: எகிப்தின் மத்தியிலும் மக்களிடையிலும் நிகழும் இயக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מִצְרָיִם
  choice: எகிப்து
  rationale: தமிழில் நிலைபெற்ற இடப்பெயர்.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் அதை ‘கர்த்தர்’ என்ற பட்டப்பெயராக மாற்றவில்லை. ‘யெகோவா’ தமிழ்ப் பயன்பாட்டில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு; ‘யாவே’ என்பது மாற்று ஒலிபெயர்ப்பு.
- issue: כַּחֲצֹת הַלַּיְלָה என்பதன் கால நுட்பம்
  choice: நள்ளிரவு அளவில்
  alternative: நள்ளிரவில்
  rationale: כְּ முன்னொட்டு தோராயத்தைக் குறிக்கக்கூடும்; ஆகவே மூலத்தின் உண்மையான நுட்பத்தைத் தக்கவைத்து நேரத்தைத் தேவையின்றித் துல்லியப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. தீர்க்கதரிசனத் தூதுச் செய்தி வாய்பாடு இயல்பான தமிழில் தரப்பட்டுள்ளது; காலத் தோராயம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
