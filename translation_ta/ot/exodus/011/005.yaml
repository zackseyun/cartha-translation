    rationale: எபிரெயத்தில் ‘எகிப்து நாட்டில் ஒவ்வொரு தலைப்பேறும் இறக்கும்’ என்ற ஒரே அறிவிப்புக்குப் பின், மனிதத் தலைப்பேறுகளின் சமூக எல்லையும் கால்நடைத் தலைப்பேறுகளும் சேர்க்கப்படுகின்றன. தமிழில் ஒரே வாக்கியத் தொடராக அமைத்தல் மூல அமைப்பை நெருக்கமாகக் காக்கும்.
