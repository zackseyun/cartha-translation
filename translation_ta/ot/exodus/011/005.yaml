source:
  edition: WLC
  text: וּ/מֵ֣ת כָּל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכ֤וֹר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שִּׁפְחָ֔ה אֲשֶׁ֖ר אַחַ֣ר הָ/רֵחָ֑יִם וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/005.yaml
  text: And every firstborn in the land of Egypt will die[a], from the firstborn of Pharaoh, who sits on his throne, to the firstborn of the servant woman who is behind the millstones, and every firstborn of the livestock.
translation:
  language: ta
  text: எகிப்து நாட்டிலுள்ள ஒவ்வொரு தலைப்பேறும் இறந்து போகும்; தன் அரியணையில் அமர்ந்திருக்கும் பார்வோனின் தலைப்பேறு முதல், எந்திரக் கற்களுக்குப் பின்னால் இருக்கும் அடிமைப் பெண்ணின்[a] தலைப்பேறு வரை, கால்நடைகளின் ஒவ்வொரு தலைப்பேறும் இறந்து போகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணிப்பெண்.” எபிரெயச் சொல் அடிமை அல்லது பணிவிடை நிலையில் உள்ள பெண்ணைக் குறிக்கிறது; “எந்திரக் கற்களுக்குப் பின்னால்” என்பது தானியம் அரைக்கும் தாழ்நிலை உழைப்பைச் சித்தரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵת
  choice: இறந்துபோகும்
  rationale: இது வரவிருக்கும் வாதையை உறுதியாக அறிவிக்கும் தீர்க்கதரிசனச் சூழலில் வரும் Qal perfect. ஆகவே தமிழில் இயல்பான எதிர்கால ஒருமை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: כָּל בְּכוֹר
  choice: முதற்பேறுகள் அனைத்தும்
  rationale: כָּל என்பதன் முழுமையான, பகிர்ந்தளிக்கும் பொருளையும் בְּכוֹר என்பதன் பாலினத்தைக் குறிப்பாக வரையறுக்காத தன்மையையும் காக்கிறது.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலுள்ள
  rationale: மூலத்திலுள்ள புவியியல் சொற்றொடரைத் தெளிவாகவும் இயல்பான தமிழிலும் வழங்குகிறது.
- source_word: מִבְּכוֹר ... עַד בְּכוֹר
  choice: முதற்பேறு முதல் ... முதற்பேறு வரை
  rationale: சமூகத்தின் மிக உயர்ந்த நிலையிலிருந்து மிகத் தாழ்ந்த நிலைவரையிலான முழு வீச்சைக் காட்டும் எபிரெய 'முதல் ... வரை' அமைப்பைப் பாதுகாக்கிறது.
- source_word: פַּרְעֹה הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: தன் அரியணையில் அமர்ந்திருக்கும் பார்வோன்
  rationale: பங்கேற்புவினை வடிவம் காட்டும் தொடர்ந்த அரச நிலையையும், சொந்த அரியணை என்ற உறவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַשִּׁפְחָה
  choice: அடிமைப்பெண்
  rationale: இந்தச் சொல் பெண் அடிமை அல்லது பணிவிடை செய்யும் அடிமை நிலையிலுள்ள பெண்ணைக் குறிக்கிறது. சமூக அந்தஸ்தின் தீவிர எதிர்மறையை மென்மைப்படுத்தாமல் 'அடிமைப்பெண்' வெளிப்படுத்துகிறது.
- source_word: אַחַר הָרֵחָיִם
  choice: திரிகைக்கற்களுக்குப் பின்னால்
  rationale: தானியத்தை அரைக்கும் தாழ்நிலை உழைப்பின் இடத்தைச் சித்தரிக்கும் மூலத்தின் கண்கூடான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: கால்நடைகளின் முதற்பேறுகள் அனைத்தும்
  rationale: בְּהֵמָה இங்கு மாடுகளை மட்டும் அல்லாமல் வளர்ப்பு விலங்குகளைப் பொதுவாகக் குறிக்கிறது; 'கால்நடைகள்' அதற்கான இயல்பான தமிழ்ச் சொல்லாகும்.
theological_decisions:
- issue: שִׁפְחָה என்ற சமூக-நிலைச் சொல்லின் மொழிபெயர்ப்பு
  choice: அடிமைப்பெண்
  alternative: வேலைக்காரப் பெண் / பணிப்பெண்
  rationale: பார்வோனின் அரச இல்லத்திலிருந்து அடிமை உழைப்பில் உள்ள பெண்ணின் குடும்பம் வரையிலான சமூக எதிர்மறையே வசனத்தின் சொல்லாட்சிப் பலம். 'அடிமைப்பெண்' அந்தப் பிணைக்கப்பட்ட நிலையைக் காட்டுகிறது; மென்மையான மாற்றுச் சொற்கள் அதை மறைக்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. 'முதற்பேறு' மனிதருக்கும் கால்நடைக்கும் பொருந்துமாறு பாலினத்தைத் தேவையின்றி வரையறுக்காமல் வைக்கப்பட்டது. மூலத்தில் ஒருமுறை வரும் இறப்புச் செயப்படுபொருளைத் தமிழில் தெளிவுக்காக இறுதியிலும் மீளக் கூறுவது இயல்பான இலக்கு மொழி அமைப்பாகும்.
