  yaml_path: translation/ot/exodus/011/010.yaml
  text: And Moses and Aaron did all these signs before Pharaoh[a], and Yahweh hardened Pharaoh’s heart[c][b], and he did not let the sons of Israel go out from his land.
translation:
  language: ta
  text: மோசேயும் ஆரோனும் இந்த அடையாளங்கள் அனைத்தையும் பார்வோனுக்கு முன்பாகச் செய்தார்கள்.[a] யாவே பார்வோனின் இதயத்தைக் கடினப்படுத்தினார்;[b] அவன் இஸ்ரவேல் மக்களை[c] தன் நாட்டிலிருந்து வெளியேற விடவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த அதிசயங்கள் அனைத்தையும்.” எபிரெயச் சொல் அற்புதமான அடையாளங்களையோ அதிசயங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பார்வோனின் இதயத்தை வலுப்படுத்தினார்” அல்லது “உறுதிப்படுத்தினார்.” இங்குள்ள எபிரெய வினைச்சொல் அடிப்படையில் வலிமையாக்குதல் அல்லது உறுதியாக்குதல் என்ற உருவகத்தைக் கொண்டது.
    reason: lexical_alternative
  - marker: c
    text: சொல்லளவில், “இஸ்ரவேலின் மகன்களை”; இச்சொற்றொடர் இங்கு இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: literal_rendering
lexical_decisions:
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: மோசேயும் ஆரோனும்
  rationale: தனிப்பெயர்களின் தமிழில் நிலைபெற்ற வேதாகம வடிவங்கள்; இணைப்பும் எபிரெய உரைக்கேற்ப பாதுகாக்கப்பட்டது.
- source_word: עָשׂוּ
  choice: செய்தார்கள்
  rationale: עשה என்பதன் பொதுவான ‘செய்’ என்ற பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது; ‘நிகழ்த்தினார்கள்’ என்பது சற்றுக் கூடுதல் விளக்கமாக இருக்கும்.
- source_word: כָּל הַמֹּפְתִים הָאֵלֶּה
  choice: இந்த அடையாளங்கள் அனைத்தையும்
  rationale: מוֹפֵת அற்புதமான அடையாளத்தையோ அதிசயத்தையோ குறிக்கலாம். இச்சூழலில் கடவுளின் வல்லமையை எடுத்துக்காட்டும் செயல்கள் என்பதால் ‘அடையாளங்கள்’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לִפְנֵי פַרְעֹה
  choice: பார்வோனுக்கு முன்பாக
  rationale: பார்வோனின் முன்னிலையில் நிகழ்ந்ததைத் தெரிவிக்கும் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: וַיְחַזֵּק
  choice: இறுகச் செய்தார்
  rationale: חזק என்பதன் அடிப்படை வலிமை/உறுதி உருவகத்தைப் பாதுகாத்தபடியே, பார்வோனின் பிடிவாதமான மனநிலையைத் தமிழில் உணர்த்துகிறது. ‘கடினப்படுத்தினார்’ என்பதும் சாத்தியம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: לֵב פַּרְעֹה
  choice: பார்வோனின் இதயத்தை
  rationale: எபிரெய மொழியின் உடைமைத் தொடர்பை நேரடியாகப் பாதுகாக்கிறது; இங்கு ‘இதயம்’ விருப்பம், தீர்மானம், மனநிலை ஆகியவற்றின் மையத்தைக் குறிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களை
  rationale: சொல்லளவில் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு மக்களினத்தையும் கூட்டாகக் குறிக்கிறது. ‘மக்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் உள்ளடக்கத்தைத் துல்லியமாகவும் தருகிறது; சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְלֹא שִׁלַּח ... מֵאַרְצוֹ
  choice: அதனால் அவன் ... தன் நாட்டிலிருந்து போகவிடவில்லை
  rationale: שלח என்பதன் ‘அனுப்பு/விடு’ பொருளை விடுதலைச் சூழலில் இயல்பான ‘போகவிடவில்லை’ என வழங்குகிறது. எபிரெய வாவ் தொடர்ச்சியின் இங்குள்ள விளைவுத் தொடர்பை ‘அதனால்’ தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: பார்வோனின் இதயத்தின் மீது யாவேயின் செயல்
  choice: யாவே பார்வோனின் இதயத்தை இறுகச் செய்தார்
  alternative: யாவே பார்வோனின் இதயத்தைக் கடினப்படுத்தினார் / உறுதிப்படுத்தினார்
  rationale: தெய்வீகச் செயலை மென்மைப்படுத்தாமலும், பார்வோனின் பொறுப்பைப் பற்றிய பதற்றத்தை விளக்கிச் சமன்செய்யாமலும் மூல உரையின் நேரடி கூற்றைப் பாதுகாக்கிறது. חזק என்பதன் உருவக வரம்பு அடிக்குறிப்பில் காட்டப்படுகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் கூட்டுப்பொருள்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள் / இஸ்ரவேலர்
  rationale: சொற்றொடர் இலக்கணத்தில் ஆண்பால் பன்மையாக இருந்தாலும், இச்சூழலில் வெளியேற அனுமதிக்கப்படாத இஸ்ரவேல் மக்களனைவரையும் கூட்டாகக் குறிக்கிறது. முதன்மை உரையில் இயல்பான கூட்டுப்பொருள் தரப்பட்டு, சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘யாவே’ எனத் திருப்பெயர் பாதுகாக்கப்பட்டது. எபிரெய உரையின் தொடர்ச்சியான கதைநடையைத் தக்கவைத்தபோதும், இறுதி வாவ் இணைப்பின் இயல்பான விளைவுத் தொடர்பு தமிழில் ‘அதனால்’ என வெளிப்படுத்தப்பட்டது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
