translation_notes:
  register: நவீன தரநிலைத் தமிழில், கண்ணியமான வேதாகம உரைநடை பயன்படுத்தப்பட்டுள்ளது. பார்வோனை நோக்கிய உரையில் மரியாதை ஒருமையான ‘உம்/நீர்’ வடிவங்கள் இடம்பெறுகின்றன. மூலத்தின் மரபுத்தொடர் வாசகருக்கு உடனடியாகப் புரியும்படி பொருள்வழியாக மொழிபெயர்க்கப்பட்டுள்ளது.
