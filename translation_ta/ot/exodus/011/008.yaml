base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/008.yaml
  text: Then all these servants of yours will come down to me and bow down to me[a], saying, ‘Go out[b], you and all the people who are at your feet,’ and after that I will go out.” And he went out from Pharaoh in burning anger.
translation:
  language: ta
  text: “அப்போது உம்முடைய இந்தப் பணியாளர்கள் அனைவரும் என்னிடம் இறங்கி வந்து, என் முன் பணிந்து, ‘நீரும் உம்மைப் பின்தொடரும் மக்கள் அனைவரும்[a] புறப்பட்டுப் போங்கள்’ என்று சொல்வார்கள். அதற்குப் பிறகு நான் புறப்பட்டுப் போவேன்.” பின்னர் மோசே கொதிக்கும் சினத்துடன் பார்வோனிடமிருந்து வெளியேறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘உமது காலடியில் உள்ள மக்கள்.’ இது உம்மோடு வரும் அல்லது உமது அதிகாரத்தின்கீழ் உள்ள மக்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: இறங்கி வந்து
  rationale: ירד என்பதன் ‘இறங்குதல்’ என்ற திசைசார்ந்த உருவகத்தைத் தக்கவைத்தபடியே, மோசேயின் நோக்குநிலையிலிருந்து அவரிடம் வருவதைக் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עֲבָדֶיךָ
  choice: உம்முடைய பணியாளர்கள்
  rationale: עבד என்பது பணியாளர், அடிமை, அரசவையாளர் எனச் சூழலுக்கேற்ப பொருள்படும். இங்கு பார்வோனின் அரசவைச் சேவகர்களைக் குறித்தாலும், ‘பணியாளர்கள்’ மூலச்சொல்லின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: וְהִשְׁתַּחֲוּוּ לִי
  choice: என் முன் பணிந்து
  rationale: உடலைத் தாழ்த்திப் பணிதல் அல்லது மரியாதை செலுத்துதல் என்ற செயலைக் காட்டுகிறது; இவ்வரசவைச் சூழலில் வழிபாடு என்ற பொருளைத் தேவையின்றி புகுத்தவில்லை.
- source_word: צֵא אַתָּה
  choice: நீரும் … புறப்பட்டுப் போங்கள்
  rationale: יצא என்பதன் ‘வெளியே போதல்/புறப்படுதல்’ என்ற கருத்தையும், אַתָּה தரும் ‘நீர்’ என்ற வலியுறுத்தலையும் இயல்பான தமிழ் தொடரில் வெளிப்படுத்துகிறது.
- source_word: וְכָל הָעָם אֲשֶׁר בְּרַגְלֶיךָ
  choice: உம்மைப் பின்தொடரும் மக்கள் அனைவரும்
  rationale: சொல்லுக்குச் சொல் ‘உமது காலடியில் உள்ள மக்கள்’ என்ற எபிரெய மரபுத்தொடர், ஒருவரோடு செல்வோரை அல்லது அவரைப் பின்பற்றுவோரைக் குறிக்கிறது. அதன் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: וְאַחֲרֵי כֵן אֵצֵא
  choice: அதற்குப் பிறகு நான் புறப்பட்டுப் போவேன்
  rationale: நிகழ்வுகளின் காலவரிசையை நேரடியாகக் காட்டுவதோடு, יצא என்பதற்கு முன்பு பயன்படுத்திய ‘புறப்பட்டுப் போ’ என்ற சொல்லாட்சியையும் தொடர்கிறது.
- source_word: וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: மோசே … பார்வோனைவிட்டு வெளியேறினார்
  rationale: எபிரெயத்தில் எழுவாய் ‘அவர்’ என்று மறைமுகமாக இருந்தாலும், சூழலில் அது மோசே என்பதைத் தெளிவுபடுத்தி இயல்பான தமிழ் உரைநடையில் வழங்குகிறது.
- source_word: בָּחֳרִי אָף
  choice: கொதிக்கும் சினத்துடன்
  rationale: கோபத்தின் வெம்மையையும் தீவிரத்தையும் கொண்ட எபிரெய உருவகத்தை இயல்பான, வலிமையான தமிழில் தக்கவைக்கிறது.
