  source_fidelity: மூல எபிரெயத்தின் வரிசை, செயற்பொருள், மற்றும் வலியுறுத்தல் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன. עוֹד נֶגַע אֶחָד என்பது “இன்னும் ஒரே ஒரு வாதை,” אָבִיא עַל என்பது “...மீதும் வரச்செய்வேன்,” மற்றும் שׁלח-இலிருந்து גרשׁ-க்கு வரும் வலிமை உயர்வு “அனுப்பிவிடுவான்” / “துரத்திவிடுவான்” எனத் தெளிவாகத் தரப்பட்டுள்ளது. כָּלָה-வின் முழுமைச் சாயலும் “முற்றிலுமாக” என்பதில் உள்ளது.
  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. “பார்வோன்மீதும் எகிப்தின்மீதும்,” “அதன் பிறகு,” “இங்கிருந்து” ஆகியவை தெளிவான, வாசிக்கச் சீரான தெரிவுகள்.
