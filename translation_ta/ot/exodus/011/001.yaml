source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה ע֣וֹד נֶ֤גַע אֶחָד֙ אָבִ֤יא עַל פַּרְעֹה֙ וְ/עַל מִצְרַ֔יִם אַֽחֲרֵי כֵ֕ן יְשַׁלַּ֥ח אֶתְ/כֶ֖ם מִ/זֶּ֑ה כְּ/שַׁ֨לְּח֔/וֹ כָּלָ֕ה גָּרֵ֛שׁ יְגָרֵ֥שׁ אֶתְ/כֶ֖ם מִ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/001.yaml
  text: Then Yahweh said to Moses[a], “One more plague I will bring upon Pharaoh and upon Egypt. After that he will send you away from here. When he sends you away[b], he will surely drive you out completely from here.”
translation:
  language: ta
  text: அப்போது யாவே மோசேயிடம், “இன்னும் ஒரே ஒரு வாதையை[a] நான் பார்வோன்மீதும் எகிப்தின்மீதும் வரச்செய்வேன். அதன் பிறகு அவன் உங்களை இங்கிருந்து அனுப்பிவிடுவான். அவன் உங்களை அனுப்பும்போது, உங்களை இங்கிருந்து முற்றிலுமாகத் துரத்திவிடுவான்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வாதை” என்பதற்கான எபிரெயச் சொல்லை “அடி,” “தாக்குதல்,” அல்லது “துன்பம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “துரத்திவிடுவான்” என்ற எபிரெயத் தொடர் வலியுறுத்தலானது; சொல்லுக்குச் சொல், “துரத்துவது—அவன் துரத்துவான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், நவீனத் தமிழில் அதன் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர்வினையின் கதைநகர்த்தும் தன்மையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: עוֹד נֶגַע אֶחָד
  choice: இன்னும் ஒரே ஒரு வாதை
  rationale: עוֹד என்பதன் ‘மேலும் ஒன்று’ என்ற கூட்டுப்பொருளையும் אֶחָד என்பதன் ஒருமையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: נֶגַע
  choice: வாதை
  rationale: எகிப்தின்மேல் வந்த இறைத் தீர்ப்புகளின் சூழலில் இயல்பான தமிழ்ச் சொல்லாகும்; மூலச்சொல்லின் பரந்த ‘அடி/தாக்குதல்/துன்பம்’ பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אָבִיא עַל
  choice: மீதும் ... வரச்செய்வேன்
  rationale: בוא வினையின் ஹிஃபில் வடிவிலுள்ள ‘வரும்படி செய்வேன்/கொண்டுவருவேன்’ என்ற காரணவினைப் பொருளையும் עַל என்பதையும் தமிழில் இயல்பாகத் தருகிறது.
- source_word: עַל פַּרְעֹה וְעַל מִצְרַיִם
  choice: பார்வோன்மீதும் எகிப்தின்மீதும்
  rationale: עַל இருமுறை வருவதால் உருவாகும் இணை அமைப்பை ‘மீதும் ... மீதும்’ என்று பாதுகாக்கிறது.
- source_word: אַחֲרֵי כֵן
  choice: அதன் பிறகு
  rationale: நிகழ்வுகளின் காலவரிசையைத் தெளிவாகக் காட்டும் இயல்பான தமிழ்த் தொடர்.
- source_word: יְשַׁלַּח אֶתְכֶם מִזֶּה
  choice: அவன் உங்களை இங்கிருந்து அனுப்பிவிடுவான்
  rationale: שׁלח என்பதன் ‘அனுப்புதல்/போக விடுதல்’ பொருளைத் தருவதோடு, அடுத்த வாக்கியத்தின் வலிமையான ‘துரத்துதல்’ என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: כְּשַׁלְּחוֹ
  choice: அவன் உங்களை அனுப்பும்போது
  rationale: כְּ முன்னொட்டின் இச்சூழலுக்குரிய காலப்பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: כָּלָה
  choice: முற்றிலுமாக
  rationale: வெளியேற்றத்தின் முழுமையைக் குறிக்கும் வினையடைப் பொருளைப் பாதுகாக்கிறது.
- source_word: גָּרֵשׁ יְגָרֵשׁ
  choice: துரத்திவிடுவான்
  rationale: שׁלח-ஐவிட வலிமையான ‘வலுக்கட்டாயமாக வெளியேற்றுதல்’ என்ற பொருளைத் தருகிறது; எபிரெய வலியுறுத்தல் அடிக்குறிப்பில் வெளிப்படுத்தப்படுகிறது.
- source_word: מִזֶּה
  choice: இங்கிருந்து
  rationale: பேசப்படும் தற்போதைய இடத்தைக் குறிக்கும் இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ‘ஆண்டவர்’ போன்ற பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரின் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அனுப்பிவிடுவான்’ மற்றும் ‘துரத்திவிடுவான்’ என்ற சொற்கள் மூலத்தில் காணப்படும் செயல்வலிமையின் உயர்வைப் பாதுகாக்கின்றன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொல் அல்லது தொடருக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
