base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/009.yaml
  text: And Yahweh said to Moses[a], “Pharaoh will not listen to you[c][b], so that my wonders may be multiplied in the land of Egypt.”
translation:
  language: ta
  text: யாவே மோசேயிடம் கூறினார்:[a] “எகிப்து நாட்டில் என் அற்புதங்கள் பெருகும்படி, பார்வோன் உங்களுக்குச் செவிகொடுக்க மாட்டான்.”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவே மோசேயிடம் கூறியிருந்தார்” என்றும் மொழிபெயர்க்கலாம். சுற்றியுள்ள கதைத் தொடர்பைக் காட்ட சில மொழிபெயர்ப்புகள் இவ்வாறு தருகின்றன; எபிரெய வினைவடிவம் இயல்பாகக் கதைத் தொடரின் சாதாரண இறந்தகால வடிவமே.
    reason: alternative_reading
  - marker: b
    text: “உங்கள் பேச்சைக் கேட்க மாட்டான்” அல்லது “உங்களுக்குக் கீழ்ப்படிய மாட்டான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “என் அடையாளங்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அற்புதங்கள், அடையாளங்கள் அல்லது வரவிருப்பதை உணர்த்தும் வியப்பூட்டும் நிகழ்வுகள் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: וַיֹּאמֶר
  choice: கூறினார்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரின் இறந்தகாலத்தைத் தெளிவான, கண்ணியமான நவீனத் தமிழில் தருகிறது.
- source_word: לֹא יִשְׁמַע אֲלֵיכֶם
  choice: உங்களுக்குச் செவிகொடுக்க மாட்டான்
  rationale: שׁמע אֶל என்பதன் ‘கேட்டல்/செவிகொடுத்தல்’ பொருளைத் தக்கவைத்து, ‘கீழ்ப்படியமாட்டான்’ என்று பொருளை மிகையாகக் குறுக்கவில்லை. பன்மை விகுதி மோசேயையும் ஆரோனையும் உள்ளடக்கும் சூழலைப் பிரதிபலிக்கிறது.
- source_word: לְמַעַן
  choice: அதனால் ... பெருகும்
  rationale: தமிழில் இயல்பான காரண–நோக்கத் தொடராக அமைந்தாலும், பார்வோனின் மறுப்புடன் யாவேயின் அற்புதங்கள் பெருகுவது தொடர்புடையது என்பதைத் தக்கவைக்கிறது.
- source_word: רְבוֹת
  choice: பெருகும்
  rationale: அற்புதங்களின் எண்ணிக்கை அதிகரிப்பதை இயல்பான தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: מוֹפְתַי
  choice: என் அற்புதங்கள்
  rationale: מופת என்பதன் வியப்பூட்டும், அதிசயமான செயல்கள் என்ற சூழல்சார் பொருளைத் தருகிறது; ‘அடையாளங்கள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டில்
  rationale: אֶרֶץ என்ற சொல்லை விடாமல், தமிழில் இயல்பான முறையில் முழுச் சொற்றொடரையும் பிரதிபலிக்கிறது.
theological_decisions:
- issue: பார்வோனின் மறுப்பில் வெளிப்படும் இறைநோக்கம்
  choice: “அதனால் ... என் அற்புதங்கள் பெருகும்” என்று நோக்கம்/விளைவு இரண்டிற்கும் இடமளிக்கும் தமிழாக்கம்
  alternative: “என் அற்புதங்கள் பெருகும்படி” என்று வெளிப்படையான நோக்கத் தொடராக மொழிபெயர்த்தல்
  rationale: לְמַעַן பொதுவாக நோக்கத்தைச் சுட்டுகிறது. அதேவேளை, இயல்பான தமிழில் இந்த வாசகம் நோக்கத்தையும் அதன் விளைவையும் உணர்த்துகிறது; பார்வோனின் மறுப்புக்கும் இறைவனின் நோக்கத்துக்கும் இடையிலான இறையியல் பதற்றத்தை மேலதிக விளக்கத்தால் தீர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “யாவே” தனிப்பெயராகவும், “பார்வோன்” பதவிப்பெயராகவும் வைக்கப்பட்டுள்ளன. மூலத்தின் பன்மை ‘உங்களுக்குச்’ என்பதில் வெளிப்படையாகத் தக்கவைக்கப்பட்டுள்ளது.
