  source_fidelity: The draft accurately renders Yahweh, Moses, Pharaoh, the plural addressees (‘உங்களுக்கு’), Pharaoh’s refusal to listen, God’s wonders, and Egypt. However, ‘அதனால்’ primarily marks result/cause and weakens the purposive force of לְמַעַן (‘so that/in order that’).
