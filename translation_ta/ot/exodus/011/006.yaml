  source_fidelity: மூல எபிரெயத்தின் எதிர்கால அறிவிப்பு, எகிப்து முழுவதையும் உள்ளடக்கும் பரப்பு, துயரமிக்க ‘பெரும் கூக்குரல்,’ மற்றும் முன்பும் பின்பும் இணையற்றது என்ற இரட்டை ஒப்பீடு ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘எழும்’ என்பது וְהָיְתָה-வின் இச்சூழல் எதிர்கால நிகழ்வுப் பொருளுக்கு இயல்பான தமிழ் வடிவம்; ‘நிகழ்ந்ததில்லை / நிகழாது’ என்பவை נִהְיָתָה மற்றும் לֹא תֹסִף ஆகியவற்றின் நிகழ்வு-ஒப்பீட்டைப் போதுமானவாறு வெளிப்படுத்துகின்றன.
