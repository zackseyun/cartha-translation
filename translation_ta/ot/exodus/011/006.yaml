  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘கூக்குரல் எழும்’ என்பது சொல்லுக்குச் சொல் அமைப்பை விட இயல்பான தமிழை வழங்கினாலும், மூலத்தின் துயரமிக்க உரத்த குரல் மற்றும் எதிர்கால அறிவிப்பு ஆகியவற்றைக் காக்கிறது.
