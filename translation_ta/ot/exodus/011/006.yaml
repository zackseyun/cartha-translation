  yaml_path: translation/ot/exodus/011/006.yaml
  text: And there will be a great cry throughout all the land of Egypt[a], such as has never happened before, nor will ever happen again.
translation:
  language: ta
  text: எகிப்து நாடு முழுவதிலும் பெரும் கூக்குரல்[a] எழும். அதுபோன்ற ஒன்று இதற்கு முன்பு ஒருபோதும் நிகழ்ந்ததில்லை; இனியும் ஒருபோதும் நிகழாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெரும் அழுகுரல்” அல்லது “பெரும் அலறல்.” எபிரெயச் சொல் צְעָקָה துயரத்தால் எழும் உரத்த குரலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: எழும்
  rationale: தீர்க்கதரிசன அறிவிப்பில் எதிர்காலப் பொருள் தரும் வினையை, צְעָקָה என்பதுடன் இயல்பாக இணையும் நவீனத் தமிழில் ‘எழும்’ என வழங்குகிறது.
- source_word: צְעָקָה
  choice: கூக்குரல்
  rationale: துயரத்தால் எழும் உரத்த அழுகுரல் அல்லது அலறலைக் குறிக்கும் சொல்லின் பரந்த பொருளை ‘கூக்குரல்’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: גְדֹלָה
  choice: பெரும்
  rationale: கூக்குரலின் அளவையும் தீவிரத்தையும் உயர்த்திக் காட்டும் எபிரெயப் பெயரடைக்கு இயல்பான தமிழ் இணை.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: எகிப்து நாடு முழுவதிலும்
  rationale: எகிப்தின் முழுப் பரப்பையும் உள்ளடக்கும் கருத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֲשֶׁר כָּמֹהוּ לֹא נִהְיָתָה
  choice: அதுபோன்ற ஒன்று இதற்கு முன்பு ஒருபோதும் நிகழ்ந்ததில்லை
  rationale: היה என்பதன் நிகழ்வு சார்ந்த பொருளையும், முந்தைய எந்த நிகழ்வுக்கும் ஒப்பில்லாத தன்மையையும் காக்கிறது.
- source_word: וְכָמֹהוּ לֹא תֹסִף
  choice: இனியும் ஒருபோதும் நிகழாது
  rationale: மறுபடியும் உண்டாகாது என்ற יסף உடன் வரும் மறுப்புத் தொடரின் முழுமையான எதிர்கால மறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
