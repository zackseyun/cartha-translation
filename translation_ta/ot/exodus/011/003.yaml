  text: וַ/יִּתֵּ֧ן יְהוָ֛ה אֶת חֵ֥ן הָ/עָ֖ם בְּ/עֵינֵ֣י מִצְרָ֑יִם גַּ֣ם הָ/אִ֣ישׁ מֹשֶׁ֗ה גָּד֤וֹל מְאֹד֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/עֵינֵ֥י עַבְדֵֽי פַרְעֹ֖ה וּ/בְ/עֵינֵ֥י הָ/עָֽם־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/003.yaml
  text: And Yahweh gave the people favor in the sight of the Egyptians[a]. Moreover, the man Moses was very great in the land of Egypt[d][c][b], in the sight of Pharaoh’s servants and in the sight of the people.
translation:
  language: ta
  text: யாவே அந்த மக்களுக்கு எகிப்தியர்களின் பார்வையில் தயவு கிடைக்கச் செய்தார்[a]. மேலும், மோசே என்னும் அந்த மனிதர்[b] எகிப்து நாட்டில் மிகவும் பெரியவராக இருந்தார்; பார்வோனின் ஊழியர்களின்[c] பார்வையிலும் மக்களின் பார்வையிலும்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எகிப்தியர்களின் கண்களில்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அந்த மனிதர் மோசே’; எபிரேயத்தில் ‘மனிதர்’ என்ற சொல் தனியாகச் சேர்த்து வலியுறுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘பார்வோனின் அதிகாரிகள்’; எபிரேயத்தில் நேரடியாக ‘பார்வோனின் ஊழியர்கள்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: d
    text: இறுதியில் வரும் ‘மக்கள்’ என்பது, பார்வோனின் ஊழியர்களுக்கு மாறாக, எகிப்தின் பரந்த பொதுமக்களைக் குறிப்பதாக இருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழில் பரவலாக அறியப்படும் தெய்வீகப் பெயரின் ஒலிபெயர்ப்பைப் பயன்படுத்தி, பட்டப்பெயரால் மாற்றாமல் தனிப்பெயரைப் பேணுகிறது.
- source_word: וַיִּתֵּן
  choice: கிடைக்கச் செய்தார்
  rationale: חֵן உடனான எபிரேயச் சொற்றொடர், எகிப்தியர்களிடையே மக்களுக்கு நன்மதிப்பு ஏற்படும்படி யெகோவா செய்தார் என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֵן
  choice: தயவு
  rationale: இங்கு இது இறையியல் சார்ந்த ‘கிருபை’ என்பதைக் காட்டிலும் சமூகச் சூழலில் கிடைத்த சாதகமான மனப்பான்மை அல்லது நன்மதிப்பைக் குறிக்கிறது.
- source_word: הָעָם
  choice: அந்த மக்கள்
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட இஸ்ரவேலரைச் சுட்டுகிறது; மூலத்தில் ‘இஸ்ரவேலர்’ என்று வெளிப்படையாக இல்லாததால் பொதுப்பெயர் பேணப்படுகிறது.
- source_word: בְּעֵינֵי מִצְרַיִם
  choice: எகிப்தியர்களின் பார்வையில்
  rationale: ‘கண்களில்’ என்ற சொல்லுக்கு நெருக்கமான எபிரேய மரபுத்தொடரின் கருத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: גַּם
  choice: மேலும்
  rationale: மோசேயைப் பற்றிய கூடுதல், ஓரளவு வலியுறுத்தலுள்ள கூற்றை அறிமுகப்படுத்துகிறது.
- source_word: הָאִישׁ מֹשֶׁה
  choice: மோசே என்னும் அந்த மனிதர்
  rationale: மூலத்தில் ‘மனிதர்’ என்பது வெளிப்படையாக இடம்பெறுவதையும் அதன் வலியுறுத்தலையும் தமிழில் பேணுகிறது.
- source_word: גָּדוֹל מְאֹד
  choice: மிகவும் பெரியவராகக் கருதப்பட்டார்
  rationale: மோசேயின் உயர்ந்த செல்வாக்கு, மதிப்பு, முக்கியத்துவம் ஆகியவற்றை உள்ளடக்கக்கூடிய மூலத்தின் பரந்த பொருளைப் பேணுகிறது; ‘கருதப்பட்டார்’ என்பது தொடர்ந்து வரும் ‘பார்வையில்’ என்ற அமைப்போடு இயல்பாக இணைகிறது.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டில்
  rationale: ‘எகிப்து தேசத்தில்’ என்ற மூல அமைப்பை இயல்பான நவீன தமிழில் முழுமையாகத் தருகிறது.
- source_word: בְּעֵינֵי עַבְדֵי פַרְעֹה
  choice: பார்வோனின் ஊழியர்களின் பார்வையில்
  rationale: עֲבָדִים என்பதன் அடிப்படைப் பொருளான ‘ஊழியர்கள்’ என்பதைக் காக்கிறது; அரசவைக் சூழலில் அதிகாரிகளையும் குறிக்கக்கூடும்.
- source_word: וּבְעֵינֵי הָעָם
  choice: மக்களின் பார்வையிலும்
  rationale: மூலத்தின் பொதுவான ‘மக்கள்’ என்ற சொல்லைத் தக்கவைத்து, அவர்கள் எகிப்தின் பரந்த பொதுமக்களாக இருக்கலாம் என்ற சாத்தியத்தை அடிக்குறிப்பில் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: பட்டப்பெயரான ‘கர்த்தர்’ என்று மாற்றாமல் தெய்வீகத் தனிப்பெயரை ஒலிபெயர்க்கிறது. எபிரேய உச்சரிப்பை ‘யாவே’ இன்னும் நெருக்கமாகக் காட்டக்கூடும் என்பதால் அந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: மோசே ‘மிகவும் பெரியவர்’ என்பதன் இயல்பு
  choice: மிகவும் பெரியவராகக் கருதப்பட்டார்
  alternative: மிகவும் முக்கியமானவராக இருந்தார் / மிகுந்த மதிப்பைப் பெற்றிருந்தார்
  rationale: גָּדוֹל என்பதிலுள்ள செல்வாக்கு, அந்தஸ்து, மதிப்பு ஆகிய சாத்தியங்களை ஒரே குறிப்பிட்ட பொருளாகச் சுருக்காமல், மக்களின் பார்வையுடன் இணைந்த மதிப்பீடாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத்தமிழில் கண்ணியமான, பொதுமக்களுக்கு எளிதில் புரியும் நடையைக் கடைப்பிடிக்கிறது. ‘பார்வையில்’ என்ற மீளுருவாக்கம் எபிரேய வசனத்தின் கட்டமைப்பையும் பார்வை/மதிப்பீடு சார்ந்த கருத்தையும் பேணுகிறது; தெளிவுக்காக இறுதி உறுப்பில் ‘அப்படியே இருந்தார்’ சேர்க்கப்பட்டுள்ளது.
