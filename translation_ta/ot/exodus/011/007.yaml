  text: וּ/לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל לֹ֤א יֶֽחֱרַץ כֶּ֨לֶב֙ לְשֹׁנ֔/וֹ לְ/מֵ/אִ֖ישׁ וְ/עַד בְּהֵמָ֑ה לְמַ֨עַן֙ תֵּֽדְע֔וּ/ן אֲשֶׁר֙ יַפְלֶ֣ה יְהוָ֔ה בֵּ֥ין מִצְרַ֖יִם וּ/בֵ֥ין יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/007.yaml
  text: But against any of the sons of Israel[a], not a dog will sharpen its tongue, from man to beast, so that you may know that Yahweh makes a distinction between Egypt and Israel.
translation:
  language: ta
  text: ஆனால் இஸ்ரவேல் மக்களில் எவருக்கும்—மனிதர் முதல் கால்நடை வரை—ஒரு நாய்கூடத் தன் நாவைக் கூர்மையாக்காது[a]. எகிப்துக்கும் இஸ்ரவேலுக்கும் இடையே யாவே வேறுபடுத்தி வைக்கிறார் என்பதை நீங்கள் அறியும்படி இவ்வாறு நிகழும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்கு எதிராக ஒரு நாய்கூடக் குரைக்காது.” இச்சொற்றொடர் இஸ்ரவேலருக்கு முழுமையான அமைதியும் பாதுகாப்பும் இருப்பதை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל בְּנֵי יִשְׂרָאֵל
  choice: ஆனால் இஸ்ரவேல் மக்களில் எவருக்கும்
  rationale: முந்தைய வசனத்தில் எகிப்துக்கு நேரிடுவதற்கு மாறான நிலையை וּ வெளிப்படுத்துகிறது. לְכֹל என்பதன் சூழல்சார் பொருளைத் தமிழில் இயல்பாக எதிர்மறை வாக்கியத்துடன் ‘எவருக்கும்’ என அளித்துள்ளது; בְּנֵי יִשְׂרָאֵל என்பது பாலின வரம்பில்லாமல் முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கும் மரபுச் சொற்றொடர் என்பதால் ‘இஸ்ரவேல் மக்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לֹא יֶחֱרַץ כֶּלֶב לְשֹׁנוֹ
  choice: ஒரு நாய்கூடத் தன் நாவைக் கூர்மையாக்காது
  rationale: எபிரெய மொழியின் உயிரோட்டமான சொல்லுருவை முதன்மைப் பிரதியில் காக்கிறது. இச்சொற்றொடர் நாய் குரைப்பதோ உறுமுவதோ கூட இல்லாத முழுமையான அமைதியையும் பாதுகாப்பையும் சூழலில் உணர்த்துவதால் விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לְמֵאִישׁ וְעַד בְּהֵמָה
  choice: மனிதர்முதல் கால்நடைவரை
  rationale: மனிதர் மற்றும் வளர்ப்பு விலங்குகள் அனைத்தையும் உள்ளடக்கும் முழு வீச்சை இந்த இணைச்சொல் காட்டுகிறது. ‘கால்நடை’ என்பது בְּהֵמָה என்பதற்கு இச்சூழலில் இயல்பான தமிழ்.
- source_word: לְמַעַן תֵּדְעוּן
  choice: இதனால் ... என்பதை நீங்கள் அறிந்துகொள்வீர்கள்
  rationale: לְמַעַן குறிக்கும் நோக்கம் அல்லது விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது. இரண்டாம் நபர் பன்மை ‘நீங்கள்’ மூலம் காக்கப்பட்டுள்ளது.
- source_word: יַפְלֶה
  choice: வேறுபாடு காட்டுகிறார்
  rationale: இச்சூழலில் ஹிஃபில் வடிவம் வியத்தகு செயலைவிட இரு தரப்பினரையும் வேறுபடுத்தி நடத்துவதைக் குறிக்கிறது. நிகழ்கால வடிவம் எபிரெய வினையின் சூழல்சார் பொது/நிகழ் செயற்பாட்டைத் திறந்தவாறு வைக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் நேரடி பெயர்வடிவமான ‘யெகோவா’ என வழங்குகிறது.
- source_word: בֵּין מִצְרַיִם וּבֵין יִשְׂרָאֵל
  choice: எகிப்துக்கும் இஸ்ரவேலுக்கும் இடையே
  rationale: மூலத்தில் உள்ள இரு தேசியப் பெயர்களையும் அப்படியே காத்து, அவற்றுக்கிடையிலான எதிர்மறை வேறுபாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் திருநாமம் நேரடியாக இருப்பதால் ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மாற்றப்படவில்லை. ‘யெகோவா’ மற்றும் ‘யாவே’ இரண்டும் தமிழில் காணப்படும் ஒலிபெயர்ப்புகள்; பொதுவாசகர்களிடையே நன்கு அறியப்பட்ட ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது. குறிப்பிட்ட பிரிவுசார் விளக்கத்தை இது சேர்ப்பதில்லை.
- issue: எகிப்துக்கும் இஸ்ரவேலுக்கும் இடையிலான வேறுபாடு
  choice: வேறுபாடு காட்டுகிறார்
  alternative: பிரித்துவைக்கிறார்
  rationale: יַפְלֶה இங்கு இரு குழுக்களுக்குக் கிடைக்கும் மாறுபட்ட நடத்தையைக் குறிக்கிறது. ‘பிரித்துவைக்கிறார்’ என்பது சாத்தியமானதாயினும் இடப்பிரிவை அதிகமாக உணர்த்தலாம்; ‘வேறுபாடு காட்டுகிறார்’ இறைச் செயலின் சூழல்சார் மாறுபாட்டைத் தெளிவாக வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தன் நாவைக் கூர்மையாக்காது’ என்ற மூலப்படிமம் முதன்மைப் பிரதியில் காக்கப்பட்டு, அதன் மரபுவழிப் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
