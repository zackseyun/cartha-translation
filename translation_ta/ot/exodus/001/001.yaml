source:
  edition: WLC
  text: וְ/אֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל הַ/בָּאִ֖ים מִצְרָ֑יְמָ/ה אֵ֣ת יַעֲקֹ֔ב אִ֥ישׁ וּ/בֵית֖/וֹ בָּֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/001.yaml
  text: These are the names of the sons of Israel who came to Egypt with Jacob[a], each man with his household.
translation:
  language: ta
  text: யாக்கோபுடன் எகிப்துக்கு வந்த இஸ்ரவேலின் மகன்களின் பெயர்கள் இவை[a]; அவர்கள் ஒவ்வொருவரும் தத்தம் குடும்பத்துடன் வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும், இவை இஸ்ரவேலின் மகன்களின் பெயர்கள்.” எபிரேய வாக்கியம் ஒரு இணைப்புச் சொல்லுடன் தொடங்குகிறது; அது யாத்திராகமத்தை ஆதியாகமத்தில் முன்சென்ற கதையுடன் இணைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: இவை
  rationale: אֵלֶּה என்பதன் சுட்டுப்பொருளை இயல்பான தமிழில் தருகிறது. தொடக்க வாவ் முந்தைய ஆதியாகமக் கதையுடன் தொடர்ச்சியைச் சுட்டுவதால், அதன் மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: שְׁמוֹת
  choice: பெயர்கள்
  rationale: மூலச்சொல்லின் நேரான பொருளையும் எபிரேய நூற்பெயருடனான கருப்பொருள் தொடர்பையும் காக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: இங்கு அடுத்து ஆண் குடும்பத் தலைவர்கள் பட்டியலிடப்படுவதால், பாலினத்தைக் குறிப்பாகக் காட்டும் எபிரேய சொற்றொடரைத் துல்லியமாகப் பிரதிபலிக்கிறது.
- source_word: הַבָּאִים
  choice: வந்த
  rationale: வடிவில் வினையெச்சமாக இருந்தாலும், வரலாற்றில் வந்த குழுவை அடையாளப்படுத்தும் பெயரடைத் தொடராக இயல்பான தமிழில் தரப்படுகிறது.
- source_word: מִצְרָיְמָ/ה
  choice: எகிப்துக்கு
  rationale: திசைநோக்கிய நகர்வைக் குறிக்கும் எபிரேய இறுதியின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵת יַעֲקֹב
  choice: யாக்கோபுடன்
  rationale: இங்கு אֵת நேரடிச் செயப்படுபொருளைக் குறிக்காமல் உடன்செல்லுதலைக் குறிக்கிறது.
- source_word: אִישׁ וּ/בֵית/וֹ
  choice: ஒவ்வொருவரும் தத்தம் குடும்பத்துடன்
  rationale: אִישׁ என்பதன் பகிர்ந்தளிக்கும் ஒருமையையும், בַּיִת என்பது கட்டிடத்தைக் காட்டிலும் குடும்பத்தாரைக் குறிக்கும் சூழல்பொருளையும் தெளிவாகத் தருகிறது.
- source_word: בָּאוּ
  choice: வந்தார்கள்
  rationale: முன்னுள்ள வினையெச்சத் தொடருக்குப் பின் வரும் நிறைவு வினையைத் தமிழிலும் வெளிப்படையாகக் காத்து, மூலத்தின் மீளுரைப்பைச் சற்றே இயல்பாக்குகிறது.
