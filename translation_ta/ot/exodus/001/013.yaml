  yaml_path: translation/ot/exodus/001/013.yaml
  text: And the Egyptians made the sons of Israel serve harshly[a][b].
translation:
  language: ta
  text: எகிப்தியர்கள் இஸ்ரவேல் மக்களைக்[a] கொடுமையாக வேலை செய்யவைத்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “இஸ்ரவேலின் மகன்கள்”; இது இஸ்ரவேல் மக்களைக் குறிக்கும் குழுப்பெயர்.
    reason: lexical_alternative
  - marker: b
    text: “இரக்கமின்றி” அல்லது “மிகக் கடுமையாக” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் கட்டாய உழைப்பிலுள்ள கடுமையான, நசுக்கும் கொடுமையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִדוּ
  choice: வேலை செய்யவைத்தார்கள்
  rationale: עבד என்பதன் ஹிஃபீல் வடிவம் இங்கு ‘வேலை செய்யும்படி செய்தார்கள்’ என்ற காரணவினைப் பொருளைத் தருகிறது. ‘அடிமைப்படுத்தினார்கள்’ என்பது விரிந்த சூழலுக்கு ஏற்றதாயினும், இந்த வினைச்சொல் தனியாகக் கூறுவதைவிட விளக்கமாகிவிடும்.
- source_word: מִצְרַיִם
  choice: எகிப்தியர்கள்
  rationale: இச்சொல் நாடையோ மக்களையோ குறிக்கலாம்; இங்கு வினையின் செய்பவர்களாக எகிப்து மக்கள் இருப்பதால் மக்களைக் குறிக்கும் வடிவம் இயல்பானது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இது முழு உடன்படிக்கை மக்களையும் குறிக்கும் வழக்கமான எபிரெயக் குழுப்பெயர். நவீனத் தமிழில் ‘இஸ்ரவேல் மக்கள்’ அதன் கூட்டுப்பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; மூலத்தின் குடும்பவழி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּפָרֶךְ
  choice: கொடுமையாக
  rationale: פָּרֶךְ கட்டாய உழைப்பில் காட்டப்படும் கடுமையான, நசுக்கும் தன்மையைக் குறிக்கிறது. ‘கொடுமையாக’ என்பது அதன் வலிமையையும் செயல் நிகழ்ந்த விதத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்னும் உடன்படிக்கை மக்களுக்கான குழுப்பெயரை மொழிபெயர்த்தல்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இந்த ஆண்பால் குடும்பவழிச் சொற்றொடர் இங்கு ஆண்களை மட்டும் அல்லாமல் இஸ்ரவேல் சமூகமுழுவதையும் குறிக்கிறது. ‘இஸ்ரவேல் மக்கள்’ பொருளைத் தவறாகக் குறுக்காமல் இயல்பான தமிழில் தருகிறது; சொல்லமைப்பின் குடும்பவழி ஒலி அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: கட்டாய உழைப்பின் கொடுமையை வெளிப்படுத்துதல்
  choice: கொடுமையாக வேலை செய்யவைத்தார்கள்
  alternative: இரக்கமின்றி வேலை செய்யவைத்தார்கள்
  rationale: மூலச்சொல் ஒடுக்குமுறையின் தீவிரத்தை உணர்த்துகிறது; எனினும் வாக்கியத்தில் இல்லாத கூடுதல் நோக்கத்தையோ தனிப்பட்ட கோட்பாட்டையோ சேர்க்காமல் அதன் வலிமையைத் தக்கவைக்க ‘கொடுமையாக’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வேலை செய்யவைத்தார்கள்’ காரணவினை அமைப்பைப் பாதுகாக்கிறது; ‘கொடுமையாக’ என்பது பண்டைய அல்லது தெளிவற்ற சொற்களைத் தவிர்த்து ஒடுக்குமுறையின் தீவிரத்தை நேரடியாகத் தெரிவிக்கிறது.
