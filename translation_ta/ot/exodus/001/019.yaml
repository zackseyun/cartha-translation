base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/019.yaml
  text: The midwives said to Pharaoh[a], “Because the Hebrew women are not like the Egyptian women, for they are vigorous; before the midwife comes to them, they have given birth.”
translation:
  language: ta
  text: பிரசவ உதவிப் பெண்கள் பார்வோனிடம், “ஏனெனில், எபிரெயப் பெண்கள் எகிப்தியப் பெண்களைப் போன்றவர்கள் அல்ல; அவர்கள் வலிமைமிக்கவர்கள்[a]. பிரசவ உதவிப் பெண் அவர்களிடம் வருவதற்கு முன்பே அவர்கள் குழந்தை பெற்றுவிடுகிறார்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உயிர்த்துடிப்பானவர்கள்’ அல்லது ‘வலிமையானவர்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அவர்களுடைய உடல்வலிமையையும் விரைவாகக் குழந்தைபெறும் தன்மையையும் வலியுறுத்தலாம். சிலர் இதை இன்னும் சொற்பொருளாக ‘விலங்குகளைப் போன்றவர்கள்’ என்று புரிந்துகொள்கிறார்கள்; ஆனால் இங்கு அந்தப் பொருள் உறுதியானதல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: என்றார்கள்
  rationale: אמר என்பதன் பெண்பால் பன்மை கதைவடிவம் நேரடியான உரையை அறிமுகப்படுத்துகிறது; தமிழில் மேற்கோளின் முடிவில் ‘என்றார்கள்’ என்பது இயல்பான கதைநடை.
- source_word: הַמְיַלְּדֹת
  choice: மகப்பேறு உதவிப் பெண்கள்
  rationale: ילד வேரிலிருந்து வந்த இப்பெயர், குழந்தைப்பேற்றில் உதவும் பெண்களைக் குறிக்கிறது. ‘மகப்பேறு உதவிப் பெண்கள்’ என்பது பாலினத்தையும் பணியையும் தெளிவாகக் காட்டும் நவீன, எளிய தமிழ்.
- source_word: אֶל־פַּרְעֹה
  choice: பார்வோனிடம்
  rationale: אֶל பேச்சின் இலக்கு அல்லது பெறுநரைக் குறிக்கிறது; ‘பார்வோனிடம்’ என்பது தமிழில் இயல்பான வடிவம்.
- source_word: כִּי ... כִּי
  choice: … அல்ல; ஏனெனில்
  rationale: முதல் כִּי முன் கேள்விக்கான காரணவிளக்கத்தை முழு பதிலாக அறிமுகப்படுத்துகிறது; தமிழில் அந்த உறவு சூழலிலேயே தெளிவாக உள்ளது. இரண்டாவது כִּי ஒப்பீட்டுக்கான காரணத்தை வெளிப்படையாகச் சொல்வதால் ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לֹא כַנָּשִׁים הַמִּצְרִיֹּת הָעִבְרִיֹּת
  choice: எபிரெயப் பெண்கள் எகிப்தியப் பெண்களைப் போன்றவர்கள் அல்ல
  rationale: வினைச்சொல் இல்லாத எபிரெய ஒப்பீட்டை இயல்பான தமிழில் ‘போன்றவர்கள் அல்ல’ என வழங்கி, இரு குழுக்களுக்கிடையிலான முரண்பாட்டைப் பாதுகாக்கிறது.
- source_word: חָיוֹת
  choice: திடகாத்திரமானவர்கள்
  rationale: இச்சூழலில் חָיוֹת வலிமை, உயிர்த்துடிப்பு, விரைவாகப் பிள்ளைபெறும் தன்மை ஆகியவற்றை உணர்த்தலாம். ‘திடகாத்திரமானவர்கள்’ முக்கிய கருத்தை இயல்பாகத் தருகிறது; சொல்லின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הֵנָּה
  choice: அவர்கள்
  rationale: பெண்பால் பன்மை தனிப்பெயர் வலியுறுத்தலைக் கொண்டிருந்தாலும், தமிழில் வெளிப்படையான ‘அவர்கள்’ போதுமான இயல்பான வலியுறுத்தலை அளிக்கிறது.
- source_word: בְּטֶרֶם תָּבוֹא אֲלֵהֶן הַמְיַלֶּדֶת
  choice: மகப்பேறு உதவிப் பெண் அவர்களிடம் வருவதற்கு முன்பே
  rationale: בטרם முந்திய காலத்தைச் சுட்டுகிறது; ‘முன்பே’ அடுத்த செயல் ஏற்கெனவே முடிந்திருப்பதை வலியுறுத்துகிறது. ஒருமைச் சொல் பொதுப்பொருளில் ‘மகப்பேறு உதவிப் பெண்’ என வைக்கப்பட்டது.
- source_word: וְיָלָדוּ
  choice: அவர்கள் குழந்தை பெற்றுவிடுகிறார்கள்
  rationale: உதவிப் பெண் வருவதற்கு முன் பேறு முடிந்துவிடும் தொடர்ச்சியான நிலையை, தமிழில் ‘பெற்றுவிடுகிறார்கள்’ இயல்பாகவும் நிறைவுணர்வுடனும் தெரிவிக்கிறது.
