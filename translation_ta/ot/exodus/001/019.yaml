  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மருத்துவச்சிகள்’ என்பதற்குப் பதிலாக பணியை உடனே விளக்கும் ‘மகப்பேறு உதவிப் பெண்கள்’ தேர்ந்தெடுக்கப்பட்டது. חָיוֹת என்பதிலுள்ள உண்மையான சொற்பொருள் தெளிவின்மை முதன்மை உரையில் இயல்பான தேர்வாலும் அடிக்குறிப்பில் மாற்றுப் பொருள்களாலும் பாதுகாக்கப்பட்டுள்ளது.
