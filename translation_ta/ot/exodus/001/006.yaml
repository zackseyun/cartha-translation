  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைக் கொண்டுள்ளது. எபிரெய மூலத்தின் மூன்று கூறுகளும் அவற்றின் முழுமை வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
