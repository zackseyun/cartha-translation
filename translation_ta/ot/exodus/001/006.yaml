  text: Then Joseph died, and all his brothers, and all that generation.
translation:
  language: ta
  text: பின்பு யோசேப்பும், அவருடைய சகோதரர்கள் அனைவரும், அந்தத் தலைமுறையினர் அனைவரும் இறந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: பின்பு ... இறந்தார்கள்
  rationale: வாவ் தொடர் வடிவம் கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது. தமிழில் இயல்பான வரலாற்று முன்னேற்றத்தைக் காட்ட ‘பின்பு’ பயன்படுத்தப்பட்டுள்ளது; இணைக்கப்பட்ட பல எழுவாய்களுக்கு ஏற்ப வினைச்சொல் பன்மையில் அமைக்கப்பட்டுள்ளது.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְכָל אֶחָיו
  choice: அவருடைய சகோதரர்கள் அனைவரும்
  rationale: אָח என்பதன் பன்மை இச்சூழலில் யோசேப்பின் ஆண் சகோதரர்களைக் குறிக்கிறது; כָּל என்பதன் முழுமையான கூட்டுப்பொருளை ‘அனைவரும்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְכֹל הַדּוֹר הַהוּא
  choice: அந்தத் தலைமுறையைச் சேர்ந்த அனைவரும்
  rationale: דּוֹר ஒரே காலத்தில் வாழ்ந்த தலைமுறையினரைக் குறிக்கிறது. சொல்லுக்குச் சொல் அமைப்பைவிட இவ்வடிவம் நவீனத் தமிழில் இயல்பாகவும், כֹּל என்பதன் முழுமையையும் தெளிவாகவும் தெரிவிக்கிறது.
