- from: ஆனால், இஸ்ரவேல் மக்களை[a] அவர்கள் எவ்வளவு அதிகமாக ஒடுக்கினார்களோ, அவ்வளவு அதிகமாக அவர்கள் பெருகிப் பரவினார்கள். இதனால் எகிப்தியர்கள் இஸ்ரவேல் மக்களைக் கண்டு கடும் அச்சமடைந்தார்கள்[b].
  to: ஆனால், எகிப்தியர்கள் இஸ்ரவேல் மக்களை[a] எவ்வளவு அதிகமாக ஒடுக்கினார்களோ, அவ்வளவு அதிகமாக அவர்கள் பெருகினார்கள்; அவ்வளவு அதிகமாகப் பரவினார்கள். அதனால், இஸ்ரவேல் மக்களைக் கண்டு எகிப்தியர்கள் கடும் அச்சமடைந்தார்கள்[b].
  rationale: ஒடுக்குபவர்களை முதல் வாக்கியத்திலேயே ‘எகிப்தியர்கள்’ எனக் குறிப்பிடுவதால் தமிழில் எழுவாய் தெளிவாகிறது. ‘பெருகினார்கள்’ மற்றும் ‘பரவினார்கள்’ என்பவற்றிற்கு மீண்டும் அளவுத்தொடரை வழங்குவதால் எபிரெயத்தின் இணை வலியுறுத்தல் காக்கப்படுகிறது. இறுதி வாக்கியத்தில் சூழலால் உறுதியாகும் எகிப்திய எழுவாயை வெளிப்படுத்துவது பொருள் சேர்க்கை அல்ல; தெளிவாக்கமே.
