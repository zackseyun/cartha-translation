  source_fidelity: மூல எபிரெயத்தின் அளவுத்தொடர்பு, கூட்டு ஒருமைச் சுட்டுப்பெயரின் பொருள், மற்றும் קוץ வினைச்சொல்லின் ‘அச்சம்/அருவருப்பு’ பொருள் விரிவு ஆகியவற்றை வரைவு பெரும்பாலும் சரியாகக் காக்கிறது. ஆனால் முதல் வாக்கியத்தில் ஒடுக்குபவரான எகிப்தியர்கள் வெளிப்படையாக இல்லாததால் ‘அவர்கள்’ என்ற எழுவாய் உடனடியாகத் தெளிவாகாது; மேலும் பெருகுதல் மற்றும் பரவுதல் என்ற இரு இணை வினைகளுக்குரிய மீளும் அளவுத்தொடர்பு வெளிப்படையாகக் காட்டப்பட வேண்டும்.
