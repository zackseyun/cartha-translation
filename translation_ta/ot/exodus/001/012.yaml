source:
  edition: WLC
  text: וְ/כַ/אֲשֶׁר֙ יְעַנּ֣וּ אֹת֔/וֹ כֵּ֥ן יִרְבֶּ֖ה וְ/כֵ֣ן יִפְרֹ֑ץ וַ/יָּקֻ֕צוּ מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/012.yaml
  text: But the more they afflicted them[a], the more they multiplied and the more they spread out[c][b], so that they dreaded the sons of Israel.
translation:
  language: ta
  text: ஆனால், எகிப்தியர்கள் இஸ்ரவேல் மக்களை[a] எவ்வளவு அதிகமாக ஒடுக்கினார்களோ, அவ்வளவு அதிகமாக அவர்கள் பெருகினார்கள்; அவ்வளவு அதிகமாகப் பரவினார்கள். அதனால், இஸ்ரவேல் மக்களைக் கண்டு எகிப்தியர்கள் கடும் அச்சமடைந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல் ‘அவனை’; இங்கு ‘இஸ்ரவேல்’ ஒரே மக்களினமாகக் கூட்டாகக் குறிப்பிடப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘அருவருப்படைந்தார்கள்’ அல்லது ‘வெறுத்தார்கள்.’ எபிரெய வினைச்சொல் கடும் அச்சத்தையோ அருவருப்பையோ வெளிப்படுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַאֲשֶׁר ... כֵּן ... וְכֵן
  choice: எவ்வளவு அதிகமாக ... அவ்வளவு அதிகமாக
  rationale: இந்தத் தொடர்பமைப்பு ஒடுக்குதல் அதிகரித்த அளவுக்கு பெருக்கமும் பரவலும் அதிகரித்ததைச் சுட்டுகிறது. தமிழில் இயல்பான அளவுத்தொடர்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: יְעַנּוּ
  choice: ஒடுக்கினார்கள்
  rationale: பியேல் வடிவிலுள்ள ענה இங்கு கடுமையாகத் துன்புறுத்துதல் அல்லது ஒடுக்குதல் என்ற பொருளைத் தருகிறது; அடிமைவேலையின் சூழலில் ‘ஒடுக்கினார்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֹתוֹ
  choice: இஸ்ரவேல் மக்களை
  rationale: எபிரெயத்தில் ஒருமைச் சுட்டுப்பெயர் இருந்தாலும், அது இஸ்ரவேலை ஒரு கூட்டு மக்களாகக் குறிக்கிறது. தமிழில் பன்மை வடிவம் அதன் சூழல்சார் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִרְבֶּה
  choice: பெருகினார்கள்
  rationale: ஒருமை வினைச்சொல் கூட்டு மக்களாகிய இஸ்ரவேலைக் குறிக்கிறது. ‘பெருகினார்கள்’ மக்கள் எண்ணிக்கை உயர்ந்ததைத் துல்லியமாகக் காட்டுகிறது.
- source_word: יִפְרֹץ
  choice: பரவினார்கள்
  rationale: פרץ இங்கு எல்லைகளை மீறி வேகமாக விரிவடைதல் அல்லது பரவுதல் என்ற கருத்தைக் கொண்டது. ‘பரவினார்கள்’ நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: וַיָּקֻצוּ
  choice: கடும் அச்சமடைந்தார்கள்
  rationale: קוץ கடுமையான திகில், வெறுப்பு அல்லது அருவருப்பு சார்ந்த எதிர்வினையைக் குறிக்கலாம். இச்சூழலில் அச்சம் முதன்மையான பொருளாகத் தேர்ந்தெடுக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִפְּנֵי
  choice: இஸ்ரவேல் மக்களைக் கண்டு
  rationale: ‘அவர்களுடைய முன்னிலையினால்/அவர்களைக் காரணமாகக் கொண்டு’ என்ற பொருளைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு நெருக்கமான வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு இது இனமக்கள் முழுவதையும் குறிக்கும் நிலையான சொல்லாட்சி. ‘இஸ்ரவேல் மக்கள்’ உள்ளடக்கத்தைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள் / இஸ்ரவேலர்
  rationale: இந்த எபிரெயச் சொல்லாட்சி ஆண் சந்ததியினரை மட்டும் அல்லாமல் இஸ்ரவேல் இனமக்கள் முழுவதையும் குறிக்கிறது. ஆகவே நவீனத் தமிழில் இயல்பான, பாலினத்தால் தேவையின்றிக் குறுகாத வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: וַיָּקֻצוּ என்பதிலுள்ள அச்சம்–அருவருப்பு பொருள் விரிவு
  choice: கடும் அச்சமடைந்தார்கள்
  alternative: அருவருப்படைந்தார்கள் / வெறுத்தார்கள்
  rationale: மக்கள் பெருக்கத்தைக் குறித்த எகிப்தியர்களின் அச்சமே உடனடிச் சூழலில் முன்னிலையில் உள்ளது. இருப்பினும் எபிரெய வினைச்சொல்லின் வெறுப்பு அல்லது அருவருப்பு நிழற்பொருள் அடிக்குறிப்பில் விடப்படாமல் குறிப்பிடப்படுகிறது.
- issue: வினைச்சொல் எழுவாயின் வெளிப்படுத்தல்
  choice: எகிப்தியர்கள்
  alternative: அவர்கள்
  rationale: எபிரெயத்தில் எழுவாய் வினை வடிவில் மட்டுமே மறைந்துள்ளது; முந்தைய சூழலின்படி அது எகிப்தியர்களைக் குறிக்கிறது. தமிழில் ‘அவர்கள்’ என்று மட்டும் வைத்தால் உடனடியாக முன்வரும் இஸ்ரவேல் மக்களைக் குறித்ததாகத் தவறாகப் புரிய வாய்ப்புள்ளதால், சூழலில் உறுதியான எழுவாய் வெளிப்படையாகச் சேர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதைமிக்க நடையில் வடிவமைக்கப்பட்டது. எபிரெய அளவுத்தொடர்பு ‘எவ்வளவு ... அவ்வளவு ...’ என்ற இயல்பான தமிழ் அமைப்பில் காக்கப்பட்டுள்ளது; கூட்டு ஒருமை தமிழில் இயல்பான பன்மையாக வழங்கப்பட்டுள்ளது.
