  yaml_path: translation/ot/exodus/001/016.yaml
  text: And he said[a], “When you help the Hebrew women give birth and see them on the birthstool, if it is a son, then you shall put him to death; but if it is a daughter, then she shall live.”
translation:
  language: ta
  text: அவன் அவர்களிடம், “நீங்கள் எபிரெயப் பெண்களுக்குப் பிரசவத்தில் உதவும்போது, பிரசவ ஆசனத்தில் குழந்தையைப் பார்த்து, அது ஆண் குழந்தையாக இருந்தால் அவனைக் கொன்றுவிடுங்கள்; பெண் குழந்தையாக இருந்தால் அவள் உயிரோடு இருக்கட்டும்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיַלֶּדְכֶן
  choice: பிரசவத்தில் உதவும்போது
  rationale: Piel வடிவம் மருத்துவச்சிகளிடம் உரையாடும் சூழலில் பிரசவிக்க உதவுவதைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் நேரடியாகவும் இதை வெளிப்படுத்துகிறது.
- source_word: הָעִבְרִיּוֹת
  choice: எபிரெயப் பெண்கள்
  rationale: பெண்பால் பன்மையான இந்தச் சொல் ‘எபிரெயப் பெண்கள்’ என்று நேரடியாகப் பொருள்படும்; பிரசவச் சூழலை வினைத்தொடர் ஏற்கெனவே தெளிவாக்குகிறது.
- source_word: וּרְאִיתֶן
  choice: பார்த்து
  rationale: தொடர்ச்சியான அறிவுறுத்தலைக் குறிக்கும் எளிய, இயல்பான தமிழ் வடிவம்.
- source_word: עַל הָאָבְנָיִם
  choice: பிரசவ இருக்கையில்
  rationale: சொல்லெழுத்தாக ‘இரு கற்களின்மேல்’ என்றாலும், இச்சூழலில் பிரசவத்திற்குப் பயன்படுத்தப்பட்ட இருக்கையைக் குறிக்கும் மரபுத்தொடராகப் புரிந்துகொள்ளப்படுகிறது. சொல்லெழுத்துப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: אִם בֵּן הוּא
  choice: பிறப்பது மகனாக இருந்தால்
  rationale: புதிதாகப் பிறக்கும் குழந்தை ஆணாக இருப்பதைத் தமிழில் தெளிவாக்குகிறது; בֵּן என்பதற்கான ‘மகன்’ என்ற இணைப்பையும் காக்கிறது.
- source_word: וַהֲמִתֶּן אֹתוֹ
  choice: அவனைக் கொன்றுபோடுங்கள்
  rationale: Hiphil வடிவத்தின் திட்டமிட்டுக் கொல்லும் கட்டளையைத் தெளிவாகக் காட்டுகிறது. தமிழில் நேரடியான கட்டளை வடிவம் எபிரெய 2ஆம் நபர் பெண்பால் பன்மைக் கட்டளையின் வலிமையைப் பாதுகாக்கிறது.
- source_word: וְאִם בַּת הִיא
  choice: மகளாக இருந்தால்
  rationale: בֵּן / בַּת என்ற ‘மகன் / மகள்’ இணையைப் பாதுகாத்து, எதிர்மறை நிபந்தனையை இயல்பான தமிழில் தருகிறது.
- source_word: וָחָיָה
  choice: அவள் உயிரோடு இருக்கட்டும்
  rationale: பெண் குழந்தை கொல்லப்படாமல் உயிருடன் விடப்பட வேண்டும் என்ற அனுமதி அல்லது கட்டளைச் சார்ந்த பொருளை, தேவையற்ற விளக்கமின்றி இயல்பாக வெளிப்படுத்துகிறது.
