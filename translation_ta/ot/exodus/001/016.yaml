  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை மற்றும் நேரடியான அரச கட்டளைத் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘மருத்துவச்சிகளாகச் செயல்படும்போது’ என்பதற்குப் பதிலாக மூல வினையின் செயல்பொருளைக் காக்க ‘பிரசவத்தில் உதவும்போது’ எனத் தரப்பட்டுள்ளது.
