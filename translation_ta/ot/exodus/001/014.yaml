revisions:
- from: சாந்தும் செங்கற்களும் கொண்டு செய்த கடின உழைப்பினாலும், வயலில் செய்த எல்லாவகை உழைப்பினாலும் அவர்கள் இவர்களுடைய வாழ்க்கையைக் கசப்பாக்கினார்கள். அவர்கள் இவர்கள்மேல் சுமத்திய உழைப்பு அனைத்தையும் கொடுமையாக[a] செய்யவைத்தார்கள்.
  to: எகிப்தியர் சாந்திலும் செங்கற்களிலும் கடின உழைப்பாலும், வயலில் எல்லாவகை உழைப்பாலும் இஸ்ரவேலருடைய வாழ்க்கையைக் கசப்பாக்கினார்கள். இஸ்ரவேலரிடம் அவர்கள் செய்யவைத்த எல்லா வேலைகளையும் கொடுமையுடன்[a] திணித்தார்கள்.
  rationale: The revision preserves the source’s metaphor, the material and agricultural labor categories, and its emphatic resumption of all forced labor. It improves modern Tamil clarity by replacing deictic pronouns with the contextual referents and renders the final clause as work ruthlessly imposed, without adding theological or interpretive content.
