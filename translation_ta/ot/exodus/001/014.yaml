  yaml_path: translation/ot/exodus/001/014.yaml
  text: And they made their lives bitter with hard labor in mortar and bricks and in every kind of field work—all their labor that they imposed on them with harshness[a].
translation:
  language: ta
  text: எகிப்தியர் சாந்திலும் செங்கற்களிலும் கடின உழைப்பாலும், வயலில் எல்லாவகை உழைப்பாலும் இஸ்ரவேலருடைய வாழ்க்கையைக் கசப்பாக்கினார்கள். இஸ்ரவேலரிடம் அவர்கள் செய்யவைத்த எல்லா வேலைகளையும் கொடுமையுடன்[a] திணித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரக்கமின்றி.” எபிரெயச் சொல் கடுமையான, நசுக்கும் ஒடுக்குமுறையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרְרוּ אֶת חַיֵּיהֶם
  choice: அவர்கள் இவர்களுடைய வாழ்க்கையைக் கசப்பாக்கினார்கள்
  rationale: מרר என்பதன் ‘கசப்பாக்குதல்’ என்ற உருவகத்தைத் தக்கவைத்து, எகிப்தியர்களையும் இஸ்ரவேலர்களையும் தமிழில் தெளிவாக வேறுபடுத்த ‘அவர்கள்/இவர்கள்’ பயன்படுத்தப்பட்டது.
- source_word: בַּעֲבֹדָה קָשָׁה
  choice: கடின உழைப்பினால்
  rationale: עֲבֹדָה என்பது உழைப்பு/வேலை என்றும் קָשָׁה என்பது கடினமானது என்றும் பொருள்படும்; ஒடுக்குமுறைச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּחֹמֶר וּבִלְבֵנִים
  choice: சாந்தும் செங்கற்களும் கொண்டு
  rationale: கட்டுமானச் சூழலில் חֹמֶר என்பதை ‘சாந்து’ என்றும், לְבֵנִים என்ற உண்மையான பன்மையை ‘செங்கற்கள்’ என்றும் மொழிபெயர்க்கிறது.
- source_word: וּבְכָל עֲבֹדָה בַּשָּׂדֶה
  choice: வயலில் செய்த எல்லாவகை உழைப்பினாலும்
  rationale: כָל என்பதன் முழுமையையும், בַשָּׂדֶה என்பதன் வயல்வெளிச் சூழலையும் இயல்பாகத் தருகிறது.
- source_word: אֵת כָּל עֲבֹדָתָם אֲשֶׁר עָבְדוּ בָהֶם
  choice: அவர்கள் இவர்கள்மேல் சுமத்திய உழைப்பு அனைத்தையும் ... செய்யவைத்தார்கள்
  rationale: எபிரெய உரையின் மீளுரைத்தல் தன்மையை ஓரளவு காத்து, எகிப்தியர்கள் இஸ்ரவேலர்களிடம் வேலையை வற்புறுத்திச் செய்வித்த பொருளைத் தெளிவாக்குகிறது.
- source_word: בְּפָרֶךְ
  choice: கொடுமையாக
  rationale: פָרֶךְ குறிக்கும் கடுமையான, நசுக்கும் ஒடுக்குமுறையைத் தெளிவாகவும் அளவுமீறாமலும் தெரிவிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
