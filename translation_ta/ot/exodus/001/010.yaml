base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/010.yaml
  text: Come[a], let us deal shrewdly with them, lest they multiply, and if war breaks out[c][b], they too may join our enemies and fight against us and go up out of the land.
translation:
  language: ta
  text: “வாருங்கள், அவர்கள் பெருகிவிடாதபடி அவர்களிடம் தந்திரமாக நடந்துகொள்வோம்.[a] போர் ஏற்பட்டால், அவர்களும் நம் பகைவர்களுடன் சேர்ந்துகொண்டு, நமக்கு எதிராகப் போரிட்டு, நாட்டிலிருந்து வெளியேறிவிடக்கூடும்.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தந்திரமாக” என்பதற்கு “புத்திசாலித்தனமாக” என்றும் மொழிபெயர்க்கலாம். இங்கு சூழல், சூழ்ச்சியுடன் திட்டமிட்டு நடந்துகொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொற்படியாக, “நாட்டிலிருந்து மேலே போய்விடக்கூடும்.” இதற்கு “நாட்டைவிட்டு வெளியேறிவிடக்கூடும்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: வாருங்கள்
  rationale: உடனடியாகக் கூட்டு நடவடிக்கைக்கு அழைக்கும் எபிரெய இடைச்சொல்லின் வலிமையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: נִתְחַכְּמָה
  choice: தந்திரமாக நடந்துகொள்வோம்
  rationale: இங்கு חכם என்பதன் ஹித்பயேல் வடிவம் அறநெறிசார் ஞானத்தைவிட, அச்சுறுத்தலாகக் கருதப்பட்ட மக்களுக்கு எதிரான சூழ்ச்சியான அரசியல் நடவடிக்கையைக் குறிக்கிறது.
- source_word: לוֹ
  choice: அவர்களிடம்
  rationale: இலக்கண வடிவில் ஒருமையாக இருந்தாலும், இது இஸ்ரவேல் மக்களை ஒரே கூட்டாகக் குறிக்கிறது; தமிழில் பன்மை இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: פֶּן יִרְבֶּה
  choice: அவர்கள் பெருகிவிடாதபடி
  rationale: פֶּן அறிமுகப்படுத்தும் அஞ்சப்படும் விளைவும் அதைத் தடுக்கும் நோக்கமும் தமிழில் தெளிவாக வெளிப்படுகின்றன; ஒருமை வினையின் கூட்டுப்பொருள் பன்மையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְהָיָה כִּי תִקְרֶאנָה מִלְחָמָה
  choice: இல்லையென்றால், போர் ஏற்பட்டால்
  rationale: தொடரின் அஞ்சப்படும் மாற்றுச் சூழலையும் நிபந்தனைத் தன்மையையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: וְנוֹסַף גַּם הוּא עַל שֹׂנְאֵינוּ
  choice: அவர்களும் நம் பகைவர்களுடன் சேர்ந்துகொண்டு
  rationale: יסף + על இங்கு ஒரு தரப்புடன் தம்மை இணைத்துக்கொள்வதைக் குறிக்கிறது; கூட்டுப் பொருளை பன்மையில் தருகிறது.
- source_word: וְנִלְחַם בָּנוּ
  choice: நமக்கு எதிராகப் போரிட்டு
  rationale: בְּ இன் எதிர்ப்பொருளையும் பகைமைச் செயலையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְעָלָה מִן הָאָרֶץ
  choice: இந்த நாட்டிலிருந்து வெளியேறிவிடக்கூடும்
  rationale: עלה என்பதன் சொற்படையான ‘மேலே போதல்’ என்ற திசை உருவகத்தைவிட, இச்சூழலில் உள்ள நாட்டை விட்டுச் செல்லுதல் என்னும் இயல்பான தமிழ்ப் பொருளைத் தருகிறது; சாத்திய/அச்சப் பொருளும் காக்கப்படுகிறது.
theological_decisions:
- issue: இஸ்ரவேலைக் குறிக்கும் ஒருமை வடிவங்களின் கூட்டுப்பொருள்
  choice: தமிழில் ‘அவர்கள்’ என்ற பன்மை
  alternative: ‘அவன்/அது’ என்ற சொற்படியான ஒருமை
  rationale: எபிரெயத்தில் இஸ்ரவேல் ஒரு கூட்டுமையாக ஒருமையில் குறிப்பிடப்படுகிறது; தமிழில் ஒருமை தவறாக ஒரு தனிநபரைச் சுட்டக்கூடும் என்பதால் கூட்டுப்பொருளைத் தெளிவாக்கும் பன்மை தேர்ந்தெடுக்கப்பட்டது.
- issue: וְעָלָה மִן הָאָרֶץ என்பதன் நோக்கமுள்ள தெளிவின்மை
  choice: ‘இந்த நாட்டிலிருந்து வெளியேறிவிடக்கூடும்’ என்று சூழல்பொருளுடன் மொழிபெயர்த்து, சொற்படியான வடிவத்தை அடிக்குறிப்பில் தருதல்
  alternative: ‘நாட்டிலிருந்து மேலே போய்விடக்கூடும்’
  rationale: மன்னன் அஞ்சியது இஸ்ரவேலர் நாட்டைவிட்டு வெளியேறுவதா அல்லது வேறு வகையில் மேலே செல்வதா என்ற எபிரெயச் சொல்லாக்கத்தின் விவாதத்தை அடிக்குறிப்பு பாதுகாக்கிறது; முதன்மை உரை சாதாரண வாசகருக்கு இயல்பாக உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. பார்வோனின் சூழ்ச்சியான அச்சமும் நிபந்தனைத் தொடர்களும் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளன; எபிரெயத்தின் கூட்டுமை ஒருமை தமிழில் பன்மையாகத் தெளிவாக்கப்பட்டுள்ளது.
