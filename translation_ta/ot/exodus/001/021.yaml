  yaml_path: translation/ot/exodus/001/021.yaml
  text: And because the midwives feared God[a], he made households for them.
translation:
  language: ta
  text: மருத்துவச்சிகள் கடவுளுக்குப் பயந்ததால், அவர் அவர்களுக்குக் குடும்பங்களை ஏற்படுத்தினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, ‘அவர்களுக்கு வீடுகளை ஏற்படுத்தினார்.’ இங்குள்ள எபிரெயச் சொற்றொடர் கட்டிடங்களைக் காட்டிலும் குடும்பங்கள் அல்லது குடும்ப மரபுகள் ஏற்படுத்தப்பட்டதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: …தால்
  rationale: இந்த எபிரெயச் சொற்றொடர் இங்கு காரணத்தையும் அதன் விளைவையும் இணைக்கிறது. நவீன தமிழில் காரண வினையெச்சமான ‘…தால்’ இதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: יָרְאוּ
  choice: பயந்ததால்
  rationale: ירא என்பது கடவுளைப் பற்றிய பயபக்தியையும் அச்சத்தையும் உள்ளடக்க முடியும். ‘பயந்தார்கள்’ என்ற வேதாகம வழக்கைத் தக்கவைத்து, ‘மதித்தார்கள்’ என்று அதன் வலிமையைக் குறைக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַמְיַלְּדֹת
  choice: மருத்துவச்சிகள்
  rationale: முன்னரே அறிமுகமான பிரசவ உதவியாளர்களைக் குறிக்கும் பெயர்ச்சொல் பயன்பாடு. ‘மருத்துவச்சிகள்’ என்பது நவீன நிலையான தமிழில் புரிந்துகொள்ளக்கூடிய வழக்குச் சொல்.
- source_word: הָאֱלֹהִים
  choice: கடவுள்
  rationale: குறிப்பிட்ட மெய்யான கடவுளைக் குறிக்கும் எபிரெய வடிவத்திற்கு தமிழில் இயல்பான தனிப்பெயர்ச்சொல் பயன்பாடு.
- source_word: וַיַּעַשׂ
  choice: ஏற்படுத்திக் கொடுத்தார்
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்தார்’ என்றாலும், בָּתִּים உடன் இச்சூழலில் குடும்பம் அல்லது வீட்டார் அமைப்பை அருளியதைக் குறிக்கலாம். ‘ஏற்படுத்திக் கொடுத்தார்’ காரண-விளைவையும் பயனாளரையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לָהֶם
  choice: அவர்களுக்கு
  rationale: எபிரெயில் ஆண்பால் பன்மை பின்னொட்டு இருந்தாலும், சூழலில் அது மருத்துவச்சிகளையே சுட்டுகிறது. தமிழின் மரியாதைமிக்க பொதுப் பன்மை வடிவம் பொருத்தமானது.
- source_word: בָּתִּים
  choice: குடும்பங்களை
  rationale: சொல்லின் நேரடிப் பொருள் ‘வீடுகள்’; ஆனால் இச்சூழலில் குடும்பங்கள் அல்லது குடும்ப வழிகள் ஏற்படுத்தப்படுதலைக் குறிக்கும் மொழிமரபாக இருக்கலாம். ‘குடும்பங்களை’ சாத்தியமான சூழற்பொருளை இயல்பாக அளிக்கிறது; நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ‘அவர்களுக்குக் குடும்பங்களை ஏற்படுத்திக் கொடுத்தார்’ என்பதன் பொருள்
  choice: கடவுள் மருத்துவச்சிகளுக்குக் குடும்பங்களை அருளி நிலைநிறுத்தினார்.
  alternative: கடவுள் அவர்களுக்காக நேரடியான பொருளில் வீடுகளைக் கட்டினார் அல்லது ஏற்படுத்தினார்.
  rationale: עשה ... בתים என்ற எபிரெயத் தொடர் குடும்பம் அல்லது குடும்ப வழியை ஏற்படுத்துவதைக் குறிக்கக்கூடும். சூழலில் இது மருத்துவச்சிகளுக்குக் கிடைத்த இறை ஆசீர்வாதமாக இயல்பாகப் புரிகிறது; எனினும் ‘வீடுகள்’ என்ற நேரடிப் பொருள் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘கடவுளுக்குப் பயந்ததால்’ என்பது பயபக்தி மற்றும் அச்சம் ஆகிய இரண்டிற்குமான எபிரெயச் சொல்லின் பரப்பைத் திறந்தே வைக்கிறது. ‘அவர்’ என்பது தமிழில் கடவுளைக் குறிக்கும் மரியாதை ஒருமையாகும்.
