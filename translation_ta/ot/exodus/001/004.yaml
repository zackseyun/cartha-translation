lexical_decisions:
- source_word: דָּן
  choice: தாண்
  rationale: யாக்கோபின் மகனுடைய இயற்பெயர்; தமிழில் நிலைபெற்ற வேதாகமப் பெயர்வடிவம் பயன்படுத்தப்பட்டது. அடுத்த பெயரோடு இணைந்த பட்டியலை இயல்பாகக் காட்ட ‘-உம்’ சேர்க்கப்பட்டது.
- source_word: וְ/נַפְתָּלִי
  choice: நப்தலியும்
  rationale: נַפְתָּלִי என்பது இயற்பெயர்; וְ என்ற இணைப்பைத் தமிழின் இணைநிலை ‘-உம்’ விகுதி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: גָּד
  choice: காத்
  rationale: யாக்கோபின் மகனுடைய இயற்பெயர்; தமிழில் நிலைபெற்ற வேதாகமப் பெயர்வடிவம் பயன்படுத்தப்பட்டது. ஆசேருடன் இணைந்த பெயர்ச் சோடியைக் காட்ட ‘-உம்’ சேர்க்கப்பட்டது.
- source_word: וְ/אָשֵׁר
  choice: ஆசேரும்
  rationale: אָשֵׁר என்பது இயற்பெயர்; וְ என்ற இணைப்பைத் தமிழின் இணைநிலை ‘-உம்’ விகுதி வெளிப்படுத்துகிறது.
