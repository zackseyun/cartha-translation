source:
  edition: WLC
  text: וַֽ/יְהִ֗י כָּל נֶ֛פֶשׁ יֹצְאֵ֥י יֶֽרֶךְ יַעֲקֹ֖ב שִׁבְעִ֣ים נָ֑פֶשׁ וְ/יוֹסֵ֖ף הָיָ֥ה בְ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/005.yaml
  text: And all the persons who came from Jacob’s loins were seventy persons[a], and Joseph was already in Egypt.
translation:
  language: ta
  text: யாக்கோபின் வழிவந்தவர்கள் அனைவரும் எழுபது பேர்[a]. யோசேப்பு ஏற்கெனவே எகிப்தில் இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்கு சொல், “யாக்கோபின் தொடையிலிருந்து புறப்பட்டவர்கள்.” இது அவருடைய நேரடி சந்ததியினரைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: அனைவரும் ... பேர்
  rationale: கதைத் தொடரில் வரும் இந்த வினை, இங்கு எண்ணிக்கையை அறிமுகப்படுத்தும் அமைப்பாக உள்ளது. தமிழில் தனியாக ‘அப்போது நிகழ்ந்தது’ என்று மொழிபெயர்க்காமல் இயல்பான பெயரெச்ச–பயனிலை அமைப்பில் அதன் பொருள் தெரிவிக்கப்படுகிறது.
- source_word: כָּל
  choice: அனைவரும்
  rationale: எபிரெயச் சொல்லின் முழுமையைக் குறிக்கும் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: נֶפֶשׁ ... נָפֶשׁ
  choice: வர்கள் ... பேர்
  rationale: இச்சூழலில் נֶפֶשׁ என்பது ‘ஆத்துமா’ என்ற தொழில்நுட்பப் பொருளில் அல்ல, மனிதர்களை எண்ணும் சொல்லாகப் பயன்படுகிறது. தமிழில் மனிதர்களுக்குரிய ‘பேர்’ இயல்பானது.
- source_word: יֹצְאֵי יֶרֶךְ יַעֲקֹב
  choice: யாக்கோபின் வழிவந்தவர்கள்
  rationale: சொல்லுக்கு சொல் ‘யாக்கோபின் தொடையிலிருந்து புறப்பட்டவர்கள்’ என்ற உடல்சார் மரபுத்தொடர், அவருடைய நேரடி சந்ததியினரைக் குறிக்கிறது. முதன்மை உரையில் இயல்பான தமிழ் வழங்கப்பட்டு, மூலத்தின் உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שִׁבְעִים
  choice: எழுபது
  rationale: எண்ணின் நேரடியான தமிழ் வடிவம்.
- source_word: וְיוֹסֵף
  choice: யோசேப்பு
  rationale: இணைப்புச் சொல் புதிய துணை வாக்கியத்தைத் தொடர்கிறது; தமிழில் முற்றுப்புள்ளிக்குப் பின் பெயரை நேரடியாகத் தொடங்குவது இயல்பாகவும் தொடர்பைத் தெளிவாகவும் வைத்திருக்கிறது.
- source_word: הָיָה בְמִצְרָיִם
  choice: ஏற்கெனவே எகிப்தில் இருந்தார்
  rationale: குடும்பத்தாரின் வருகை அல்லது கணக்கிடுதலுக்கு முன்பே யோசேப்பு எகிப்தில் இருந்தார் என்ற காலத் தொடர்பை ‘ஏற்கெனவே’ இயல்பாக வெளிப்படுத்துகிறது.
