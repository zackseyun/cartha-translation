base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/017.yaml
  text: But the midwives feared God[a], and did not do as the king of Egypt had told them; rather, they let the children live.
translation:
  language: ta
  text: ஆனால் மருத்துவச்சிகள் கடவுளுக்குப் பயந்து, எகிப்தின் அரசன் தங்களுக்குச் சொன்னபடி செய்யாமல், குழந்தைகளை உயிருடன் இருக்க விட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குழந்தைகளை உயிருடன் வைத்தார்கள்.”
    reason: וַתְּחַיֶּיןָ என்ற காரணவினை வடிவம் குழந்தைகளை உயிருடன் இருக்க அனுமதித்தல் அல்லது உயிருடன் காத்தல் என்ற நெருங்கிய நுணுக்கங்களைத் தரலாம்.
lexical_decisions:
- source_word: וַתִּירֶאןָ
  choice: பயந்து
  rationale: ירא என்பது கடவுளை நோக்கிய பயத்தையும் பயபக்தியையும் குறிக்கிறது. ‘கடவுளுக்குப் பயந்து’ என்ற வழக்கமான வேதாகமச் சொல்லாட்சி இரு நுணுக்கங்களையும் திறந்தவையாக வைத்திருக்கிறது.
- source_word: הַמְיַלְּדֹת
  choice: மருத்துவச்சிகள்
  rationale: ילד என்பதிலிருந்து வந்த இப்பெயரெச்ச வடிவம் பிரசவத்திற்கு உதவும் பெண்களைக் குறிக்கிறது; நவீனத் தமிழில் ‘மருத்துவச்சிகள்’ இயல்பான, துல்லியமான இணைச்சொல்.
- source_word: אֶת הָאֱלֹהִים
  choice: கடவுளுக்கு
  rationale: இங்கு நேரடி செயப்படுபொருள் குறியுடன் வரும் சொற்றொடர் ‘கடவுளுக்குப் பயப்படுதல்’ என்ற பொருளைத் தருகிறது. தமிழில் வேற்றுமை உருபு வினையின் இயல்புக்கு ஏற்ப வழங்கப்பட்டுள்ளது.
- source_word: וְלֹא עָשׂוּ
  choice: செய்யாமல்
  rationale: எளிய மறுப்பு வடிவத்தைத் தொடர்ந்து வரும் ஒப்புமைத் தொடருடன் இயல்பாக இணைக்கிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶן
  choice: தங்களுக்குச் சொன்னபடி
  rationale: דבר என்பதன் அடிப்படைப் பொருள் ‘பேசுதல்’; கட்டளையிடப்பட்ட சூழலில் ‘சொன்னபடி’ என்பது கருத்தை மிகைப்படுத்தாமல் இயல்பாகத் தருகிறது. ‘தங்களுக்கு’ என்பது மருத்துவச்சிகளையே தெளிவாகச் சுட்டுகிறது.
- source_word: מֶלֶךְ מִצְרָיִם
  choice: எகிப்தின் அரசன்
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவான, தற்போதைய தமிழில் இயல்பாகக் கொடுக்கிறது.
- source_word: וַתְּחַיֶּיןָ
  choice: உயிரோடு விட்டார்கள்
  rationale: חיה என்பதன் பியேல் வடிவம் உயிர்வாழச் செய்தல் அல்லது உயிரோடு காத்தல் என்ற காரணவினைப் பொருளைக் கொண்டது. கொல்லும் கட்டளைக்கு எதிர்மாறாக ‘உயிரோடு விட்டார்கள்’ என்பது இயல்பாக அமைகிறது; ‘உயிரோடு வைத்தார்கள்’ என்ற நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַיְלָדִים
  choice: குழந்தைகளை
  rationale: יְלָדִים என்பது சொற்பொருளில் ‘குழந்தைகள்’ எனப் பொதுவாக உள்ளது; முந்தைய சூழல் ஆண் குழந்தைகளைக் குறிப்பதைத் தெளிவுபடுத்துவதால் இங்கே சொல்லின் பரப்பை ‘ஆண் குழந்தைகள்’ என்று குறுக்கவில்லை.
theological_decisions:
- issue: ‘கடவுளுக்குப் பயப்படுதல்’ என்ற சொல்லாட்சியில் אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுளுக்கு
  alternative: அந்தக் கடவுளுக்கு
  rationale: கதைச் சூழலில் இச்சொல் உண்மையான கடவுளைக் குறிக்கிறது. எபிரெயத்தில் சுட்டு உருபு இருந்தாலும், தமிழில் ‘அந்தக் கடவுள்’ என்று மொழிபெயர்ப்பது தேவையற்ற வேறுபாட்டை உணர்த்தக்கூடும். ‘கடவுளுக்குப் பயந்து’ என்பது பயத்தையும் பயபக்தியையும் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய இணைப்புகளின் தொடர்ச்சி தமிழில் இயல்பாக அமைய ‘ஆனால்’ மற்றும் வினையெச்சத் தொடர் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் இறையியல் நெருக்கமும் சொற்பொருள் அகலமும் பாதுகாக்கப்பட்டுள்ளன.
