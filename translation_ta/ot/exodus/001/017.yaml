revisions:
- from: ஆனால் மருத்துவச்சிகள் கடவுளுக்குப் பயந்து, எகிப்தின் அரசன் தங்களுக்குச் சொன்னபடி செய்யாமல், குழந்தைகளை உயிரோடு விட்டார்கள்.[a]
  to: ஆனால் மருத்துவச்சிகள் கடவுளுக்குப் பயந்து, எகிப்தின் அரசன் தங்களுக்குச் சொன்னபடி செய்யாமல், குழந்தைகளை உயிருடன் இருக்க விட்டார்கள்.[a]
  rationale: வசனத்தின் பொருளை மாற்றாமல், வினையின் காரணவினை/அனுமதிப்புப் பொருள் நவீனத் தமிழில் தெளிவாக அமைய “உயிரோடு விட்டார்கள்” என்பதற்குப் பதிலாக “உயிருடன் இருக்க விட்டார்கள்” என்று திருத்தப்பட்டுள்ளது. அடிக்குறிப்பும் அதற்கேற்ப இயல்பாகச் சீரமைக்கப்பட்டுள்ளது.
