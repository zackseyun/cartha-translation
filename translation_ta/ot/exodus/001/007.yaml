base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/007.yaml
  text: But the sons of Israel were fruitful and swarmed and multiplied and became exceedingly strong[b][a], so that the land was filled with them.
translation:
  language: ta
  text: ஆனால், இஸ்ரவேலின் மக்களோ பலுகிப் பெருகி, திரளாய்ப் பரவி[a], எண்ணிக்கையில் மிகுந்து, மிகவும் வலிமை அடைந்தார்கள்; அந்த நாடு அவர்களால் நிரம்பியது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெருந்திரளாகப் பொங்கிப் பெருகி’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினை, உயிரினங்கள் கூட்டங்கூட்டமாகப் பெருகும் வலுவான படிமத்தைத் தருகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘மேலும், அந்த நாடு அவர்களால் நிரம்பியது’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயில் இவ்வாக்கியம் எளிய தொடர்ச்சியாக இணைக்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: ஆனால் இஸ்ரவேலின் மக்களோ
  rationale: בני ישראל என்பதன் குடும்ப/தேசியச் சார்பை இயல்பான நவீன தமிழில் காட்டுகிறது. முந்தைய வசனத்தில் யோசேப்பின் தலைமுறை இறந்ததற்கு எதிர்மாறான தொடர்ச்சியை முன்னிறுத்த וּ என்பதை ‘ஆனால்’ என வழங்குகிறது.
- source_word: פָּרוּ
  choice: பலுகி
  rationale: פרה குறிக்கும் கனிதருதல் மற்றும் இனப்பெருக்கச் செழிப்பைச் சுருக்கமாகத் தருவதோடு, ஆதியாகம ஆசீர்வாத மொழியின் எதிரொலியையும் காக்கிறது.
- source_word: וַיִּשְׁרְצוּ
  choice: திரளாய்ப் பரவி
  rationale: שׁרץ என்பதிலுள்ள உயிரினங்கள் பெருந்திரளாகப் பெருகிப் பரவும் வலுவான படிமத்தை மனிதர்களைப் பற்றிய தமிழில் இயல்பாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: וַיִּרְבּוּ
  choice: எண்ணிக்கையில் மிகுந்து
  rationale: רבה என்பதன் ‘பலராதல்/எண்ணிக்கையில் பெருகுதல்’ என்ற பொருளை முந்தைய வினைகளுடன் தேவையற்ற சொல் மீளுருவாக்கம் இல்லாமல் தெளிவாக்குகிறது.
- source_word: וַיַּעַצְמוּ בִּמְאֹד מְאֹד
  choice: மிகவும் வலிமை அடைந்தார்கள்
  rationale: עצם என்பதன் முதன்மையான வலிமை/ஆற்றல் பொருளைத் தக்கவைத்து, இருமுறை வரும் מאד அளிக்கும் தீவிர வலியுறுத்தலை ‘மிகவும்’ மூலம் காட்டுகிறது; வெறும் எண்ணிக்கையாக மட்டும் குறுக்கவில்லை.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֹתָם
  choice: அந்த நாடு அவர்களால் நிரம்பியது
  rationale: מלא என்ற வடிவில் ‘நாடு’ எழுவாயாக இருப்பதைப் பாதுகாக்கிறது. சூழலில் הארץ முழு பூமியைக் காட்டாமல் அவர்கள் வாழ்ந்த நாட்டைக் குறிக்கிறது.
theological_decisions:
- issue: பலுகுதல் மற்றும் பெருகுதல் மொழியில் படைப்பு/ஆசீர்வாத எதிரொலி
  choice: ‘பலுகிப் பெருகி’ என்ற சொற்றொடரால் எதிரொலியை மறைமுகமாகத் தக்கவைத்தல்
  alternative: ஆதியாகம ஆசீர்வாதத்தைக் குறிப்பதாக விளக்கச் சொற்களை முதன்மை உரையில் சேர்த்தல்
  rationale: எபிரெய உரை முந்தைய ஆசீர்வாத மொழியை நினைவூட்டலாம்; ஆனால் அந்தத் தொடர்பை உரை வெளிப்படையாக விளக்காததால் மொழிபெயர்ப்பும் அதை விளக்கமாகச் சேர்க்கக்கூடாது.
- issue: וַיַּעַצְמוּ என்பது எண்ணிக்கையா அல்லது வலிமையா
  choice: ‘வலிமை அடைந்தார்கள்’
  alternative: ‘எண்ணிக்கையில் மிகவும் பெருகினார்கள்’
  rationale: சூழலில் எண்ணிக்கையின் வலிமை உட்படலாம்; இருந்தாலும் வேர்ச்சொல்லின் வலிமை/ஆற்றல் சார்ந்த பரப்பைச் சுருக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘பலுகிப் பெருகி’ என்பது வேதாகம ஆசீர்வாத மொழியின் எதிரொலியைத் தக்கவைக்கிறது; ‘திரளாய்ப் பரவி’ என்பது மூலத்தின் உயிர்ப்பான படிமத்தை மனிதர்களைப் பற்றிய தமிழில் இழிவுச் சாயலின்றி வழங்குகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
