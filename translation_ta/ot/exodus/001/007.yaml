- from: ஆனால் இஸ்ரவேலின் மக்களோ பலுகிப் பெருகி, திரளாய்ப் பரவி[a], எண்ணிக்கையில் மிகுந்து, மிகவும் வலிமை அடைந்தார்கள்; அந்த நாடு அவர்களால் நிரம்பியது.[b]
