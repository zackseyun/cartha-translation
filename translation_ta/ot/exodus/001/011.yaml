base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/011.yaml
  text: 'So they set taskmasters over him to afflict him with their burdens[c][b][a], and he built storage cities for Pharaoh: Pithom and Rameses.'
translation:
  language: ta
  text: அவனை அவனுக்குச் சுமத்தப்பட்ட சுமைகளால் ஒடுக்குவதற்காக, அவர்கள் அவன்மேல் கட்டாய உழைப்பு அதிகாரிகளை நியமித்தார்கள்.[a] பார்வோனுக்காகச் சேமிப்பு நகரங்களாகிய[b] பித்தோமையும் ராமெசேசையும்[c] அவன் கட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அவன்மேல்’, ‘அவனை’, ‘அவன் கட்டினான்’ என்று ஒருமை வடிவங்கள் உள்ளன; அவை இஸ்ரவேல் மக்களை ஒரு கூட்டாகக் குறிக்கின்றன. பொருளின்படி ‘அவர்கள்மேல்’, ‘அவர்களை’, ‘அவர்கள் கட்டினார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது ‘பண்டக நகரங்கள்’.
    reason: lexical_alternative
  - marker: c
    text: ‘ராமெசேஸ்’ என்பதை ‘ரஅம்சேஸ்’ என்றும் ஒலிப்பெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: அவர்கள் நியமித்து
  rationale: שׂים என்பதன் இச்சூழலுக்குரிய ‘அதிகாரிகளை நியமித்தல்/ஏற்படுத்துதல்’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: עָלָיו
  choice: அவன்மேல்
  rationale: எபிரெய மூலத்தின் ஆண்பால் ஒருமை வடிவத்தைப் பாதுகாக்கிறது; இங்கு ‘இஸ்ரவேல்’ மக்கள் கூட்டாக ஒருமையில் குறிக்கப்படுகின்றனர்.
- source_word: שָׂרֵי מִסִּים
  choice: கட்டாய உழைப்புக்கான அதிகாரிகள்
  rationale: מַסִּים குறிக்கும் கட்டாயப் பணி அல்லது அரசாங்க வேலைச்சுமையையும், שָׂרֵי குறிக்கும் அதிகாரப் பொறுப்பையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְמַעַן עַנֹּתוֹ
  choice: அவனை ஒடுக்கினார்கள்
  rationale: பியேல் வடிவிலுள்ள ענה இங்கு துன்புறுத்துதல் அல்லது ஒடுக்குதல் என்ற கடுமையான பொருளைக் கொண்டது; ‘ஒடுக்குதல்’ சூழலுக்கு இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: בְּסִבְלֹתָם
  choice: தங்களுடைய சுமைகளால்
  rationale: சொல் குறிக்கும் உடல் சுமை மற்றும் கடுமையான வேலைச்சுமை ஆகிய இரு நிழற்பொருள்களையும் ‘சுமைகள்’ திறந்தவையாக வைத்திருக்கிறது.
- source_word: וַיִּבֶן
  choice: அவன் கட்டினான்
  rationale: மூலத்தில் உள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை வினையைத் தக்கவைக்கிறது; அது இஸ்ரவேலை ஒரு கூட்டு ஒருமையாகக் குறிக்கிறது.
- source_word: עָרֵי מִסְכְּנוֹת
  choice: சேமிப்பு நகரங்கள்
  rationale: பொருட்களையோ உணவுவகைகளையோ சேமிக்கும் நிர்வாக மையங்களான நகரங்கள் என்ற பொருளை எளிய நவீன தமிழில் தருகிறது.
- source_word: לְפַרְעֹה
  choice: பார்வோனுக்காக
  rationale: அரசப் பட்டத்தைத் தமிழில் வழக்கமான வேதாகம வடிவில் தருகிறது.
- source_word: פִּתֹם
  choice: பித்தோம்
  rationale: எபிரெய இடப்பெயரின் ஒலிப்பெயர்ப்பு.
- source_word: רַעַמְסֵס
  choice: ராமெசேஸ்
  rationale: எபிரெய இடப்பெயருக்கான வாசிக்க எளிதான ஒலிப்பெயர்ப்பு; எழுத்துக்கு நெருக்கமான மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இஸ்ரவேலைக் குறிக்கும் எபிரெய கூட்டு ஒருமை
  choice: ‘அவன்மேல்’, ‘அவனை’, ‘அவன் கட்டினான்’ என்று ஒருமையைத் தக்கவைத்தல்
  alternative: ‘அவர்கள்மேல்’, ‘அவர்களை’, ‘அவர்கள் கட்டினார்கள்’ என்று தமிழில் பன்மையாக்குதல்
  rationale: மூலத்தின் தொடர்ச்சியான ஆண்பால் ஒருமை இலக்கண வடிவம் இஸ்ரவேலை ஒரே கூட்டு மக்களாகச் சித்தரிக்கிறது. வாசகருக்கான விளக்கத்தை அடிக்குறிப்பில் வழங்கி, அந்த இலக்கிய-இறையியல் இறுக்கத்தை மூலவுரையிலேயே பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையைப் பயன்படுத்துகிறது. கட்டாய உழைப்பு மற்றும் சுமை ஆகிய கருத்துகள் தெளிவாக இருந்தாலும், ‘சுமைகள்’ என்பதன் உடல்/வேலைச்சுமை இரட்டைப் பொருள் திறந்தவையாக வைக்கப்பட்டுள்ளது. மூலத்தின் கூட்டு ஒருமை திட்டமிட்டு பாதுகாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
