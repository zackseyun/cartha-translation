translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் dignified narrative நடை. ‘இப்படிச் செய்து’ என்பது எபிரெய மொழியின் ‘இந்தக் காரியத்தைச் செய்து’ என்ற சொற்றொடரை இயல்பாக்குகிறது; மூலத்தின் சொற்பொருள் மற்றும் சூழல் இடையிலான பதற்றம் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
