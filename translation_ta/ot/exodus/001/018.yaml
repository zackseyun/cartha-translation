  text: וַ/יִּקְרָ֤א מֶֽלֶךְ מִצְרַ֨יִם֙ לַֽ/מְיַלְּדֹ֔ת וַ/יֹּ֣אמֶר לָ/הֶ֔ן מַדּ֥וּעַ עֲשִׂיתֶ֖ן הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/תְּחַיֶּ֖יןָ אֶת הַ/יְלָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/018.yaml
  text: So the king of Egypt called for the midwives and said to them[a], “Why have you done this thing and let the children live?”
translation:
  language: ta
  text: அப்போது எகிப்தின் அரசன் மருத்துவச்சிகளை அழைத்து, “நீங்கள் ஏன் இப்படிச் செய்து, பிள்ளைகளை உயிருடன் விட்டீர்கள்[a]?” என்று அவர்களிடம் கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண் குழந்தைகளை உயிரோடு வைத்தீர்கள்.” இங்குள்ள எபிரெய வினைச்சொல் உயிர்வாழச் செய்தல், உயிரோடு காத்தல், அல்லது வாழவிடுதல் என்று பொருள்படலாம். முந்தைய வசனங்களின் சூழல் ஆண் குழந்தைகளைக் குறிக்கிறது.
    reason: வினைச்சொல்லின் பொருள் வரம்பையும், ‘பிள்ளைகள்’ என்பதற்கான சூழல் சார்ந்த குறுகிய பொருளையும் காக்கும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்து
  rationale: קרא என்பதுடன் நபரைக் குறிக்கும் ל வரும்போது, ஒருவரை வரவழைப்பது அல்லது அழைப்பது என்று பொருள். அரசன் அவர்களைத் தன் முன்னிலையில் வரவழைத்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: எகிப்தின் அரசன்
  rationale: எபிரெய மொழியின் உடைமைத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் காக்கும் நேரடியான தமிழ் வடிவம்.
- source_word: לַמְיַלְּדֹת
  choice: மருத்துவச்சிகளை
  rationale: பிரசவத்தின்போது உதவும் பெண்களைக் குறிக்கும் சொல்லுக்கு நவீனத் தமிழில் துல்லியமான, பொதுவாகப் புரியக்கூடிய இணைச்சொல்.
- source_word: וַיֹּאמֶר לָהֶן
  choice: என்று அவர்களிடம் கேட்டான்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘அவர்களிடம் சொன்னான்’ என்றாலும், தொடர்ந்து வரும் நேரடிக் கேள்வியைத் தமிழில் இயல்பாக அறிமுகப்படுத்த ‘கேட்டான்’ பயன்படுத்தப்பட்டுள்ளது; உரையின் விசாரணைத் தன்மை கூட்டிச் சேர்க்கப்படவில்லை.
- source_word: מַדּוּעַ
  choice: ஏன்
  rationale: காரணத்தை வினவும் சொல்லுக்கு இயல்பான, சுருக்கமான தமிழ் இணை.
- source_word: עֲשִׂיתֶן הַדָּבָר הַזֶּה
  choice: நீங்கள் ஏன் இப்படிச் செய்து
  rationale: ‘இந்தக் காரியத்தைச் செய்தீர்கள்’ என்ற எபிரெய அமைப்பின் பொருளை, குற்றஞ்சாட்டும் கேள்வியின் ஓட்டம் குன்றாமல் இயல்பான தமிழில் வழங்குகிறது.
- source_word: וַתְּחַיֶּיןָ
  choice: உயிருடன் விட்டீர்கள்
  rationale: இந்த வினை உயிர்வாழச் செய்தல், உயிரோடு காத்தல், அல்லது வாழவிடுதல் என்ற பொருள் தரலாம். முதன்மை உரை பார்வோன் அவர்களைக் கொல்லாமல் விட்டதாகக் குற்றஞ்சாட்டும் சூழலை இயல்பாக வெளிப்படுத்துகிறது; மற்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: הַיְלָדִים
  choice: பிள்ளைகளை
  rationale: இந்த எபிரெயச் சொல் பொதுவாக ‘பிள்ளைகள்’ என்று பொருள்படும். முந்தைய வசனங்களின் சூழல் ஆண் குழந்தைகளைச் சுட்டினாலும், இவ்வசனத்தின் சொல்லிலுள்ள பரந்த பொருளை முதன்மை உரை காக்கிறது; சூழல் சார்ந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
