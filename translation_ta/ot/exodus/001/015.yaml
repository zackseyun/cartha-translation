base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/015.yaml
  text: Then the king of Egypt said to the Hebrew midwives[a], one of whom was named Shiphrah and the other Puah,
translation:
  language: ta
  text: பின்பு எகிப்தின் அரசன் எபிரேய மருத்துவச்சிகளிடம்[a] சொன்னான். அவர்களில் ஒருத்தியின் பெயர் சிப்ரா; மற்றொருத்தியின் பெயர் பூவா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எபிரேயப் பெண்களின் மருத்துவச்சிகளிடம்.” மருத்துவச்சிகள் எபிரேயர்களாக இருந்தார்கள் என்றோ, அவர்கள் எபிரேயப் பெண்களுக்குப் பிரசவ உதவி செய்தார்கள் என்றோ இச்சொற்றொடரைப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... சொன்னான்
  rationale: வாவ் தொடர் வடிவம் கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது. இயல்பான நவீன தமிழில் அதன் தொடர்ச்சி வலிமையை ‘பின்பு’ வெளிப்படுத்துகிறது.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: எகிப்தின் அரசன்
  rationale: எபிரேய இணைப்புச் சொல்லமைப்பை இயல்பான தமிழில் தருகிறது. இவ்வசனத்தில் இல்லாத ‘பார்வோன்’ என்ற பட்டம் சேர்க்கப்படவில்லை.
- source_word: לַמְיַלְּדֹת
  choice: மருத்துவச்சிகளிடம்
  rationale: பிரசவத்தில் உதவும் பெண்களைக் குறிக்கும் சொல்லுக்கு தெளிவான, வழக்கமான தமிழ்ச் சொல்.
- source_word: הָעִבְרִיֹּת
  choice: எபிரேய மருத்துவச்சிகள்
  rationale: பெண்பால் பன்மை அடைமொழியை ‘மருத்துவச்சிகள்’ என்பதுடன் நேரடியாக இணைக்கும் முதன்மையான வாசிப்பு. அவர்கள் எபிரேயப் பெண்களுக்குப் பணியாற்றிய மருத்துவச்சிகள் என்ற சாத்தியமும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית ...
  choice: அவர்களில் ஒருத்தியின் பெயர் ...; மற்றொருத்தியின் பெயர் ...
  rationale: ‘ஒருத்தி ... இரண்டாமவள்’ என்ற பகிர்ந்துரைக்கும் அமைப்பின் பொருளை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: שִׁפְרָה
  choice: சிப்ரா
  rationale: எபிரேயப் பெயரின் ஒலியை நவீன தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: פּוּעָה
  choice: பூவா
  rationale: எபிரேயப் பெயரின் ஒலியை நவீன தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
theological_decisions:
- issue: הָעִבְרִיֹּת என்பதன் தொடர்பு
  choice: மருத்துவச்சிகளே எபிரேயர் என்ற வாசிப்பு முதன்மை உரையில் தரப்பட்டுள்ளது.
  alternative: எபிரேயப் பெண்களுக்குப் பிரசவ உதவி செய்த மருத்துவச்சிகள்.
  rationale: எபிரேய சொற்றொடர் இரு புரிதல்களுக்கும் இடமளிக்கக்கூடும்; ஆகவே முதன்மையான இலக்கண வாசிப்பு உரையிலும் மாற்று வாசிப்பு அடிக்குறிப்பிலும் தரப்பட்டு உண்மையான தெளிவின்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பார்வோன்’ என்பதைச் சேர்க்காமல் மூலத்தின் ‘எகிப்தின் அரசன்’ பாதுகாக்கப்பட்டுள்ளது; தனிப்பெயர்கள் எபிரேய ஒலியை அடிப்படையாகக் கொண்டு எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
