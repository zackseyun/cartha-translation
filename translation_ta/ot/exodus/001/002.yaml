- source_word: לֵוִי
  choice: லேவி
  rationale: தனிப்பட்ட பெயராக ஒலிபெயர்க்கப்பட்டது; பிற்கால கோத்திர அல்லது ஆசாரியத் தொடர்புகளை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
- source_word: וִ/יהוּדָה
  choice: யூதா
  rationale: יהודה என்பது தனிப்பட்ட பெயராக ‘யூதா’ என்று ஒலிபெயர்க்கப்பட்டது. அதற்கு முன் உள்ள ו பட்டியலின் இறுதி இணைப்புச் சொல்; தமிழில் பட்டியலிடும்போது காற்புள்ளிகளால் இயல்பாக வெளிப்படுவதால் தனியாக ‘மற்றும்’ என்று இடப்படவில்லை.
