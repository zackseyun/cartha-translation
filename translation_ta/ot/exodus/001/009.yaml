translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. மூலத்தின் கவன ஈர்ப்பும் ஒப்பீட்டுத் தன்மையும் பாதுகாக்கப்பட்டுள்ளன; ‘இஸ்ரவேலின் மக்களாகிய ஜனங்கள்’ என்பது மூலத்தின் குடும்பவழி-மக்களின அமைப்பைச் சற்றே முறையான நடையில் தக்கவைக்கிறது.
