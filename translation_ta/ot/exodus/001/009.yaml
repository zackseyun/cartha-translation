source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֶל עַמּ֑/וֹ הִנֵּ֗ה עַ֚ם בְּנֵ֣י יִשְׂרָאֵ֔ל רַ֥ב וְ/עָצ֖וּם מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/009.yaml
  text: And he said to his people[a], “Look, the people of the sons of Israel are more numerous and stronger than we are.”
translation:
  language: ta
  text: அவன் தன் மக்களிடம், “இதோ, இஸ்ரவேலின் சந்ததியினரான மக்கள்[a] நம்மைவிட எண்ணிக்கையில் மிகுந்தவர்களாகவும் வலிமையானவர்களாகவும் இருக்கிறார்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் இயல்பாக, “இஸ்ரவேல் மக்கள்.” எபிரெயத்தில் சொல்லுக்குச் சொல், “இஸ்ரவேலின் மகன்களின் மக்கள்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל עַמּוֹ
  choice: அவன் தன் மக்களிடம் … என்றான்
  rationale: וַיֹּאמֶר என்பது கதையை முன்னெடுக்கும் வழக்கமான எபிரெய வினைவடிவம்; தமிழ் கதைநடைக்கு இயல்பாக மேற்கோளின் முடிவில் ‘என்றான்’ வைக்கப்பட்டது. אֶל עַמּוֹ என்பதன் அரசியல் அல்லது இனக்குழுச் சார்ந்த கூட்டுப்பொருளை ‘தன் மக்களிடம்’ தெளிவாகக் காக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சுட்டிடைச்சொல்லின் வலிமையை நவீன, கண்ணியமான தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַם בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களாகிய ஜனங்கள்
  rationale: ‘இஸ்ரவேலின் மகன்கள்’ என்ற குடும்பவழிப் பெயரையும், עַם குறிக்கும் ஒருங்கிணைந்த மக்கள் திரளையும் முடிந்தவரை காக்கிறது; தமிழில் ‘மக்கள்’ இருமுறை வருவதைத் தவிர்க்க ‘ஜனங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: רַב
  choice: எண்ணிக்கையில் மிகுந்தவர்கள்
  rationale: מִמֶּנּוּ உடன் வரும் ஒப்பீட்டுச் சூழலில் வெறும் ‘பலர்’ என்பதைக் காட்டிலும் எண்ணிக்கை சார்ந்த மேன்மையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְעָצוּם
  choice: வலிமையானவர்கள்
  rationale: עָצוּם குறிக்கும் பலம் அல்லது ஆற்றலை இயல்பான தமிழில் தருகிறது; முந்தைய பெயரடையுடன் இணைந்து மִמֶּנּוּ வழியான ஒப்பீட்டுக்கு உட்படுகிறது.
- source_word: מִמֶּנּוּ
  choice: நம்மைவிட
  rationale: מן + முதலாம் நபர் பன்மை பின்னொட்டு குறிக்கும் ‘எங்களைவிட/நம்மைவிட’ என்ற ஒப்பீட்டை நேரடியாக வெளிப்படுத்துகிறது. பார்வோன் தன் மக்களிடம் பேசுவதால் உள்ளடக்கும் ‘நம்மைவிட’ இயல்பானது.
