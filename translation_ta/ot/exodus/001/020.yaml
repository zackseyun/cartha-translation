  text: So God dealt well with the midwives[a], and the people multiplied and became very strong.
translation:
  language: ta
  text: ஆகவே, கடவுள் மருத்துவச்சிகளுக்கு நன்மை செய்தார்[a]. மக்கள் பெருகி, மிகவும் வலிமையடைந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மருத்துவச்சிகளுக்கு நன்மையாக இருந்தார்”; அல்லது, “மருத்துவச்சிகளை ஆசீர்வதித்தார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּיטֶב
  choice: நன்மை செய்தார்
  rationale: יטב என்பதன் ஹிஃபில் வடிவம் ל முன்னொட்டுடன், ஒருவருக்கு நன்மை செய்வதைக் குறிக்கிறது. ‘நன்மை செய்தார்’ என்பது செயலைத் தெளிவாகக் கூறுகிறது; அதன் குறிப்பிட்ட வடிவத்தை ‘ஆசீர்வதித்தார்’ என்று விளக்கமாகச் சுருக்கிவிடாமல் இருக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இக்கதைச் சூழலில் אֱלֹהִים இஸ்ரவேலின் கடவுளைக் குறிக்கிறது; ஒருமை வினை வடிவத்திற்கும் சூழலுக்கும் ‘கடவுள்’ இயல்பாகப் பொருந்துகிறது.
- source_word: לַמְיַלְּדֹת
  choice: மருத்துவச்சிகளுக்கு
  rationale: ל முன்னொட்டு நன்மை பெறுபவர்களைக் குறிக்கிறது. מְיַלְּדֹת என்பது பிரசவத்திற்கு உதவும் பெண்களைக் குறிக்கும்; நவீன பொதுத் தமிழில் ‘மருத்துவச்சிகள்’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיִּרֶב
  choice: பெருகி
  rationale: רבה இங்கு மக்களின் எண்ணிக்கை அதிகரித்ததைக் குறிக்கிறது. ‘பெருகி’ என்பது இயல்பான தமிழில் அந்த எண்ணிக்கை வளர்ச்சியைப் பாதுகாக்கிறது.
- source_word: הָעָם
  choice: மக்களோ
  rationale: எபிரெயம் நேரடியாக ‘மக்கள்’ என்றே கூறுகிறது. முந்தைய வாக்கியத்திலிருந்து அடுத்த விளைவுக்கான நகர்வை இயல்பாக்க ‘-ஓ’ இணைப்பு பயன்படுத்தப்பட்டுள்ளது; ‘இஸ்ரவேல் மக்கள்’ என்ற விளக்கச் சேர்க்கை தவிர்க்கப்பட்டுள்ளது.
- source_word: וַיַּעַצְמוּ
  choice: வலிமை அடைந்தார்கள்
  rationale: עצם இங்கு வலிமை அல்லது ஆற்றலில் வளர்வதைக் குறிக்கிறது. ‘வலிமை அடைந்தார்கள்’ என்பது நிலையான பண்பாக அல்லாமல் ஏற்பட்ட வளர்ச்சியாகச் சொல்கிறது.
- source_word: מְאֹד
  choice: மிகவும்
  rationale: מְאֹד வினையின் தீவிரத்தை உயர்த்துகிறது; ‘மிகவும்’ என்பது தற்போதைய தமிழில் இயல்பான வலியுறுத்தல்.
theological_decisions:
- issue: கடவுளின் செயலை ‘ஆசீர்வதித்தார்’ என்று மொழிபெயர்ப்பதா, அல்லது பொதுவாக நன்மை செய்ததாகக் கூறுவதா
  choice: மருத்துவச்சிகளுக்கு நன்மை செய்தார்
  alternative: மருத்துவச்சிகளை ஆசீர்வதித்தார்; மருத்துவச்சிகளிடம் நல்லவராக இருந்தார்
  rationale: יטב என்பது நன்மை செய்வதையோ நல்லவிதமாக நடத்துவதையோ குறிக்கிறது; தெய்வீக நன்மையின் வடிவத்தைத் தானாகவே குறிப்பதில்லை. ‘நன்மை செய்தார்’ என்பது மூலத்தின் பொதுவான பொருளைப் பாதுகாத்து, அதன் குறிப்பிட்ட வெளிப்பாட்டை அடுத்த வசனம் விளக்க இடமளிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரண்டு தொடர்ச்சியான நிகழ்வுகள் இரண்டு வாக்கியங்களாகத் தரப்பட்டுள்ளன. ‘ஆசீர்வதித்தார்’ என்பதை முதன்மை உரையில் இடாமல், எபிரெய வினையின் பரந்த பயனளிக்கும் பொருள் பாதுகாக்கப்பட்டுள்ளது.
