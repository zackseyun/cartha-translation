  text: A new king arose over Egypt[b][a], who did not know Yosef.
translation:
  language: ta
  text: எகிப்தின்மேல் ஒரு புதிய அரசன்[a] எழுந்தான்; அவன் யோசேப்பை அறியவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘வேறொரு அரசன்’. எபிரெயச் சொல் நேரடியாக ‘புதிய’ என்று பொருள்படும்; ஆனால் அது வேறொரு அரச வம்சத்தையோ ஆட்சியையோ குறிப்பதாகச் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘யோசேப்பை அங்கீகரிக்கவில்லை’. இங்கே ‘அறிதல்’ என்பது அவரைப் பற்றிய தகவல் இல்லாததை மட்டுமல்லாமல், அவரை அங்கீகரிக்காமல் அல்லது அவருடைய முக்கியத்துவத்தைக் கணக்கில் கொள்ளாமல் இருந்ததையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்தான்
  rationale: קום என்ற வினைச்சொல்லின் உருவகத்தைத் தக்கவைத்துக்கொண்டு, ஓர் அரசன் அதிகார நிலைக்கு எழுவதை இயல்பாகக் குறிக்கிறது. וַ־ கதையை முன்னெடுக்கும் தொடர் இணைப்பாக இருப்பதால், தனியாக ‘இப்போது’ அல்லது ‘பின்பு’ என்று சேர்க்கப்படவில்லை.
- source_word: מֶלֶךְ
  choice: அரசன்
  rationale: எபிரெயச் சொல் குறிப்பாக ஓர் அரசனைக் குறிக்கிறது; பொதுவான ‘ஆட்சியாளர்’ என்பதைவிட ‘அரசன்’ துல்லியமானது.
- source_word: חָדָשׁ
  choice: புதிய
  rationale: அடிப்படைப் பொருள் ‘புதிய’ என்பதே. வேறு வம்சத்தைச் சேர்ந்த அரசன் என்ற சாத்தியமான விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் விடுகிறது.
- source_word: עַל מִצְרָיִם
  choice: எகிப்தின்மேல்
  rationale: עַל என்பது இங்கு ஓர் அரசன் ஒரு நாட்டின்மேல் கொண்ட அதிகாரத்தைச் சுட்டுகிறது; ‘எகிப்தில்’ என்பதைவிட மூலத்தின் உறவை நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: אֲשֶׁר לֹא יָדַע
  choice: அவன் ... அறியவில்லை
  rationale: ידע என்பதன் வழக்கமான பொருளான ‘அறிதல்’ என்பதைத் தக்கவைக்கிறது. தகவல் இல்லாமை மட்டுமா அல்லது யோசேப்பின் முக்கியத்துவத்தை ஏற்றுக்கொள்ளாமையா என்ற சூழல்சார் இருபொருள் வாய்ப்பை முடிவுசெய்யவில்லை.
- source_word: יוֹסֵף
  choice: யோசேப்பு
  rationale: יוֹסֵף என்ற எபிரெயப் பெயரின் ஒலியை நவீனத் தமிழில் தெளிவாகக் கடத்தும் வழக்கமான எழுத்துப்பெயர்ப்பு.
theological_decisions:
- issue: ‘புதிய அரசன்’ என்பது அரச வம்ச மாற்றத்தைக் குறிக்கிறதா, ‘யோசேப்பை அறியவில்லை’ என்பது வேண்டுமென்றே அவரை ஏற்றுக்கொள்ளாததைக் குறிக்கிறதா
  choice: மூலத்தின் எளிய சொற்களான ‘புதிய அரசன்’ மற்றும் ‘யோசேப்பை அறியவில்லை’ என்பவற்றை முதன்மை உரையில் வைத்தல்
  alternative: ‘வேறொரு அரசன்/வேறு வம்சம்’ என்றும் ‘யோசேப்பை ஏற்றுக்கொள்ளவில்லை/பொருட்படுத்தவில்லை’ என்றும் வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: அரச வம்ச மாற்றம் அல்லது திட்டமிட்ட புறக்கணிப்பு ஆகியவை சாத்தியமான விளக்கங்கள் என்றாலும், இவ்வசனம் அவற்றைத் தெளிவாகக் கூறவில்லை. எபிரெய உரையின் இறையியல் மற்றும் வரலாற்று இருபொருள் வாய்ப்பை மொழிபெயர்ப்பு திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நீண்ட தொடர்பெயர் அமைப்பு தமிழில் தெளிவாக வாசிக்க அரைப்புள்ளியால் இரண்டு தொடர்புடைய உட்பிரிவுகளாக அமைக்கப்பட்டுள்ளது. ‘ராஜா’ என்பதற்குப் பதில் பொதுவாகப் புரியும் செந்தமிழ்ச் சொல் ‘அரசன்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
