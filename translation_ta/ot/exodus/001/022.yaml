translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. அரச ஆணையின் கடுமையை ‘கட்டளையிட்டான்’, ‘எறிந்துவிடுங்கள்’ ஆகிய சொற்கள் காக்கின்றன. மூலத்தின் ‘மகன்/மகள்’ என்ற குடும்ப உறவுச் சொற்கள் ‘ஆண் குழந்தை/பெண் குழந்தை’ எனப் பொதுமைப்படுத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
