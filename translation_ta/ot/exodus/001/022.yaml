base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/022.yaml
  text: Then Pharaoh commanded all his people[a], saying, “Every son who is born you must throw into the Nile[c][b], but every daughter you must let live.”
translation:
  language: ta
  text: 'பின்பு பார்வோன் தன் மக்கள் அனைவருக்கும் கட்டளையிட்டுச் சொன்னான்: “பிறக்கும் ஒவ்வொரு மகனையும் நைல் நதியில்[a] எறிந்துவிடுங்கள்; ஆனால் பிறக்கும் ஒவ்வொரு மகளையும் வாழவிடுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “நதியில்.” யாத்திராகமத்தில் இச்சொல் பொதுவாக நைல் நதியையே குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டான்
  rationale: צוה என்பது அதிகாரபூர்வமாகக் கட்டளையிடுவதைக் குறிக்கிறது; அரச ஆணையின் சூழலுக்கு இயல்பாகவும் துல்லியமாகவும் பொருந்துகிறது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: எபிரெய அரசப் பட்டத்திற்கான தமிழில் நிலைபெற்ற வேதாகமப் பெயர்ப்பு.
- source_word: לְכָל עַמּוֹ
  choice: தன் மக்கள் அனைவருக்கும்
  rationale: עַם என்பதன் நேரடியான பொருள் ‘மக்கள்’; இங்கு பார்வோனின் ஆட்சிக்குட்பட்ட எகிப்தியர்களை விரிவாகக் குறிக்கிறது.
- source_word: לֵאמֹר
  choice: சொன்னான்
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் எபிரெய வடிவத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל הַבֵּן הַיִּלּוֹד
  choice: பிறக்கும் ஒவ்வொரு மகனையும்
  rationale: בֵּן என்பதன் ‘மகன்’ என்ற அடிப்படைச் சொல்லையும், ילד என்ற பிறத்தல் சார்ந்த எச்ச வடிவின் தொடர்ச்சியான கட்டளைக்குரிய பொதுப்பொருளையும் காக்கிறது.
- source_word: הַיְאֹרָה
  choice: நைல் நதியில்
  rationale: יְאֹר என்பது யாத்திராகமத்தில் குறிப்பாக நைல் நதியைக் குறிக்கிறது; இலக்கு நோக்கிய இயக்கத்தைத் தமிழின் ‘-இல்’ இங்கு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תַּשְׁלִיכֻהוּ
  choice: எறிந்துவிடுங்கள்
  rationale: இரண்டாம் நபர் பன்மை கட்டளையின் வலிமையையும், ஆண் குழந்தையைக் குறிக்கும் பொருளையும் தமிழில் தெளிவாக உணர்த்துகிறது.
- source_word: וְכָל הַבַּת
  choice: ஆனால் பிறக்கும் ஒவ்வொரு மகளையும்
  rationale: וְ என்பது வடிவில் ‘மேலும்/மற்றும்’ என்றாலும், இங்கு ஆண் குழந்தைகளுக்கான ஆணைக்கு மாறான விதியை அறிமுகப்படுத்துவதால் ‘ஆனால்’ இயல்பான எதிர்மறை இணைப்பாகும். இரண்டாம் கூறில் ‘பிறக்கும்’ என்பது எபிரெயில் மறைமுகமாகப் பகிரப்பட்டிருப்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: תְּחַיּוּן
  choice: உயிரோடு வாழவிடுங்கள்
  rationale: חיה என்பதன் பியேல் வடிவம் ‘உயிருடன் வைத்திருத்தல்/வாழவிடுதல்’ எனப் பொருள்படும்; கொல்லாமல் வாழ அனுமதிக்க வேண்டும் என்ற எதிர்நிலையை இச்சொற்றொடர் தெளிவாகக் காட்டுகிறது.
