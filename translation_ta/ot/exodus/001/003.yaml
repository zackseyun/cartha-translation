lexical_decisions:
- source_word: יִשָּׂשכָר
  choice: இசக்கார்
  rationale: தனிப்பட்ட நபரின் பெயர்; தமிழில் பரவலாக அறியப்படும் வேதாகமப் பெயர் வடிவத்தில் ஒலிபெயர்க்கப்பட்டது.
- source_word: זְבוּלֻן
  choice: செபுலோன்
  rationale: தனிப்பட்ட நபரின் பெயர்; மூல எபிரெய ஒலியை அணுகும், தமிழில் அறியப்பட்ட பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וּ/בְנְיָמִן
  choice: பென்யமீன்
  rationale: בְנְיָמִן தனிப்பட்ட நபரின் பெயராக ஒலிபெயர்க்கப்பட்டது. இறுதிப் பெயருக்கு முன் உள்ள וּ இணைப்பைத் தமிழில் தனியாக ‘மற்றும்’ என இடாமல், இயல்பான பட்டியல் தொடராகக் காற்புள்ளியால் வெளிப்படுத்துவது தெளிவாகவும் இயல்பாகவும் உள்ளது.
