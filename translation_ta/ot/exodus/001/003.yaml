translation_notes:
  register: நவீன தரத் தமிழில், பெயர்களைக் கொண்ட சுருக்கமான பட்டியலாகவும் முந்தைய வசனத்தின் தொடராகவும் அமைக்கப்பட்டுள்ளது. மூலத்தில் உள்ள இறுதி இணைப்புச்சொல் தமிழின் இயல்பான பட்டியல் நடைக்கேற்ப காற்புள்ளியால் வெளிப்படுத்தப்பட்டுள்ளது.
