base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/019.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Take your staff and stretch out your hand over the waters of Egypt—over their rivers, over their Nile canals, over their ponds, and over every collection of their waters—that they may become blood. And there will be blood throughout all the land of Egypt[b], even in wooden and stone vessels.’”
translation:
  language: ta
  text: அப்போது யாவே மோசேயிடம், “ஆரோனிடம், ‘உன் கோலை எடுத்துக்கொண்டு, எகிப்தின் எல்லா நீரின்மேல்—அங்குள்ள ஆறுகள், நைல் கால்வாய்கள், குளங்கள், நீர் தேங்கியுள்ள ஒவ்வொரு நீர்நிலையின்மேலும்—உன் கையை நீட்டு; அவை இரத்தமாகட்டும். எகிப்து நாடெங்கும், மரப்பாத்திரங்களிலும் கற்பாத்திரங்களிலும்[a] இரத்தம் இருக்கும்’ என்று சொல்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, “மரத்திலும் கல்லிலும்.” இது மரத்தாலும் கல்லாலும் செய்யப்பட்ட பாத்திரங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מַטְּךָ
  choice: உன் கோல்
  rationale: מַטֶּה என்பது கையில் எடுத்துச் செல்லப்படும் கோல் அல்லது தடி; இச்சூழலில் ‘கோல்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וּנְטֵה יָדְךָ
  choice: உன் கையை நீட்டு
  rationale: எபிரெய மொழிப்பாங்கின் செயலை நேரடியாகவும் இயல்பான தமிழிலும் காக்கிறது.
- source_word: נַהֲרֹתָם
  choice: அங்குள்ள ஆறுகள்
  rationale: נָהָר என்பதன் பரந்த ‘ஆறு/நீரோடை’ பொருளில், அடுத்துவரும் நைல் கால்வாய்களிலிருந்து வேறுபடுத்த ‘ஆறுகள்’ என வழங்கப்பட்டுள்ளது.
- source_word: יְאֹרֵיהֶם
  choice: நைல் கால்வாய்கள்
  rationale: எகிப்தியச் சூழலில் יְאֹר என்பது நைல் நதியோடு தொடர்புடைய நீர்வழிகளைக் குறிக்கக்கூடும்; ‘நைல் கால்வாய்கள்’ அந்தச் சூழலையும் பட்டியலிலுள்ள வேறுபாட்டையும் வெளிப்படுத்துகிறது.
- source_word: אַגְמֵיהֶם
  choice: குளங்கள்
  rationale: தேங்கிய அல்லது சதுப்பான நீர்நிலையைக் குறிக்கும் சொல்லுக்கு இங்கு எளிய, பொதுவான தமிழ் இணை.
- source_word: כָּל מִקְוֵה מֵימֵיהֶם
  choice: நீர் தேங்கியுள்ள எல்லா இடங்கள்
  rationale: מִקְוֶה என்பதன் ‘சேர்ந்த/தேங்கிய நீர்’ என்ற கருத்தை ஓர் குறிப்பிட்ட செயற்கை நீர்த்தேக்கமாகக் குறுக்காமல் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְיִהְיוּ דָם
  choice: அவை இரத்தமாகும்
  rationale: கட்டளையால் ஏற்படும் விளைவைச் சுருக்கமாகவும் நேரடியாகவும் கூறுகிறது.
- source_word: וּבָעֵצִים וּבָאֲבָנִים
  choice: மரப்பாத்திரங்களிலும் கற்பாத்திரங்களிலும்
  rationale: மரம், கல் என்ற பொருட்பெயர்கள் அவற்றால் செய்யப்பட்ட நீர்க் கலன்களைக் குறிப்பதாகச் சூழலுக்கேற்ற மறைபெயராக்கத்துடன் மொழிபெயர்க்கப்பட்டுள்ளன; மூலத்தின் சொற்படியான வடிவம் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் அல்லது யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது; இதனால் தனிச்சமயப் பிரிவின் விளக்கத்தைச் சேர்ப்பது தவிர்க்கப்படுகிறது.
- issue: וּבָעֵצִים וּבָאֲבָנִים என்பதன் குறிப்பு
  choice: மரத்தாலும் கல்லாலும் செய்யப்பட்ட பாத்திரங்கள்
  alternative: சொற்படியாக ‘மரத்திலும் கல்லிலும்’
  rationale: உடனடிச் சூழல் தண்ணீர் இரத்தமாவதைப் பற்றியது என்பதால், மரமும் கல்லும் நீர் வைக்கப்பட்ட கலன்களைக் குறிப்பதாக எடுத்துக்கொள்வது பொருத்தமானது. ஆயினும் எபிரெயம் ‘பாத்திரங்கள்’ என்று வெளிப்படையாகச் சொல்லாததால், அதன் நீள்வட்டத்தன்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதானதாயும் மரியாதைக்குரியதாயும் வடிவமைக்கப்பட்டுள்ளது. நீர்வகைகளின் பட்டியல் தெளிவாகத் தெரிய இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் தெளிவின்மை தேவையான இடத்தில் அடிக்குறிப்பால் காக்கப்பட்டுள்ளது.
