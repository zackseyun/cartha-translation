  text: And the fish that are in the Nile will die[a], and the Nile will stink[b], and the Egyptians will be unable to drink water from the Nile.
translation:
  language: ta
  text: நைல் நதியில் உள்ள மீன்கள் இறந்துபோகும்; நைல் நதி[a] நாறும்; எகிப்தியர்கள் நைல் நதியிலிருந்து தண்ணீர் குடிப்பதில் சோர்வடைவார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘நதி’; இச்சூழலில் அது குறிப்பாக நைல் நதியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எகிப்தியர்கள் நைல் நதியிலிருந்து தண்ணீர் குடிக்க முடியாமல் போவார்கள்.’ எபிரெய வினை சோர்வடைவது, அல்லது சோர்வினால் இயலாமல் போவது என்ற பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: மீன்கள்
  rationale: எபிரெயச் சொல் ஒருமை வடிவிலுள்ள கூட்டுப்பெயர்; தமிழில் இயல்பாகப் பன்மையில் ‘மீன்கள்’ என்று வழங்கப்படுகிறது.
- source_word: יְאֹר
  choice: நைல் நதி
  rationale: யாத்திராகமத்தின் சூழலில் இச்சொல் பொதுவான ஓர் ஆற்றை அல்ல, குறிப்பாக நைல் நதியைக் குறிக்கிறது.
- source_word: תָּמוּת
  choice: செத்துப்போகும்
  rationale: மீன்கள் இறப்பதை நேரடியாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: וּבָאַשׁ
  choice: நாறும்
  rationale: துர்நாற்றம் வீசுவதைக் குறிக்கும் எபிரெய வினையின் தெளிவையும் வலிமையையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וְנִלְאוּ
  choice: குடிக்க முடியாமல் போவார்கள்
  rationale: நிஃபால் வடிவம் சோர்வடைதல் அல்லது முயன்று இயலாமை அடைதல் என்ற நுணுக்கத்தைக் கொண்டது; இச்சூழலில் விளையும் நடைமுறை இயலாமையை இத்தேர்வு தெளிவாகச் சொல்கிறது.
- source_word: לִשְׁתּוֹת מַיִם
  choice: தண்ணீர் குடிக்க
  rationale: எபிரெயத்தில் வெளிப்படையாக உள்ள ‘தண்ணீர்’ என்ற செயப்படுபொருளைத் தக்கவைத்து, இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: מִן הַיְאֹר
  choice: நைல் நதியிலிருந்து
  rationale: மூலத்திலுள்ள பிரிவுப்பொருள் வேற்றுமையையும் குறிப்பிட்ட நீராதாரத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
