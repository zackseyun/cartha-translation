  yaml_path: translation/ot/exodus/007/024.yaml
  text: And all the Egyptians dug around the Nile for water to drink[a], because they could not drink from the water of the Nile.
translation:
  language: ta
  text: எகிப்தியர்கள் அனைவரும் குடிப்பதற்கான தண்ணீருக்காக நைல் நதியைச்[a] சுற்றிலும் தோண்டினார்கள்; ஏனெனில் நைல் நதியின் தண்ணீரை அவர்களால் குடிக்க முடியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘நதி’ (யெஓர்); யாத்திராகமத்தில் இச்சொல் குறிப்பாக நைல் நதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: தோண்டினார்கள்
  rationale: חפר என்பதன் நேரடியான பொருள் ‘தோண்டு’ என்பதாகும். எபிரெய உரையில் கிணறுகள் என்று வெளிப்படையாகக் கூறப்படாததால், ‘கிணறுகள் தோண்டினார்கள்’ என்று விரிவாக்கவில்லை.
- source_word: כָל מִצְרַיִם
  choice: எகிப்தியர்கள் அனைவரும்
  rationale: சொல்லுக்கு சொல் ‘எகிப்து முழுவதும்’ என இருந்தாலும், இச்சூழலில் தண்ணீருக்காகத் தோண்டிய எகிப்து மக்களைக் கூட்டாகக் குறிக்கிறது; ஆகவே இயல்பான தமிழில் இவ்வாறு வழங்கப்பட்டுள்ளது.
- source_word: סְבִיבֹת הַיְאֹר
  choice: நைல் நதியைச் சுற்றிலும்
  rationale: סְבִיבֹת என்பது சுற்றுப்புறங்களைக் குறிக்கிறது; யְאֹר யாத்திராகமத்தில் குறிப்பாக நைல் நதியைக் குறிக்கிறது.
- source_word: מַיִם לִשְׁתּוֹת
  choice: குடிப்பதற்குத் தண்ணீர் தேடி
  rationale: எபிரெய தொடரின் நோக்கப்பொருளான ‘குடிப்பதற்கான தண்ணீர்’ என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘தேடி’ என்பது தண்ணீர் கிடைப்பதற்காக அவர்கள் தோண்டியதைச் சூழலுக்கேற்றவாறு தெரிவிக்கிறது.
- source_word: כִּי לֹא יָכְלוּ
  choice: ஏனெனில் … முடியவில்லை
  rationale: כִּי இங்கு அவர்கள் தோண்டியதற்கான காரணத்தை அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அந்த உறவைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לִשְׁתֹּת מִמֵּימֵי הַיְאֹר
  choice: நைல் நதியின் தண்ணீரை … குடிக்க
  rationale: מִן குறிக்கும் மூலப்பொருள் தமிழில் இயல்பாக அமைய, ‘நைல் நதியின் தண்ணீரை’ என வழங்கப்பட்டுள்ளது.
