  text: לֵ֣ךְ אֶל פַּרְעֹ֞ה בַּ/בֹּ֗קֶר הִנֵּה֙ יֹצֵ֣א הַ/מַּ֔יְמָ/ה וְ/נִצַּבְתָּ֥ לִ/קְרָאת֖/וֹ עַל שְׂפַ֣ת הַ/יְאֹ֑ר וְ/הַ/מַּטֶּ֛ה אֲשֶׁר נֶהְפַּ֥ךְ לְ/נָחָ֖שׁ תִּקַּ֥ח בְּ/יָדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/015.yaml
  text: Go to Pharaoh in the morning[a]. Look, he is going out to the water, and you shall stand to meet him on the bank of the Nile[b], and you shall take in your hand the staff that was turned into a serpent.
translation:
  language: ta
  text: காலையில் பார்வோனிடம் போ. இதோ, அவன் தண்ணீரை நோக்கி வெளியே வருகிறான். நீ அவனைச் சந்திக்க நைல் நதிக்கரையில் நின்றுகொள். பாம்பாக மாறிய கோலை உன் கையில் எடுத்துக்கொள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ אֶל־פַּרְעֹה
  choice: பார்வோனிடம் போ
  rationale: நேரடியான ஆண்பால் ஒருமை கட்டளையை இயல்பான நவீனத் தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: בַּבֹּקֶר
  choice: காலையில்
  rationale: காலத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: הִנֵּה
  choice: இதோ
  rationale: அடுத்து நிகழப்போவதற்குக் கவனத்தை ஈர்க்கும் மூலமொழியின் சுட்டும் வலிமையைப் பாதுகாக்கிறது.
- source_word: יֹצֵא הַמַּיְמָה
  choice: அவன் தண்ணீரை நோக்கிப் புறப்பட்டு வருவான்
  rationale: יֹצֵא என்ற பங்கேற்புவினையின் நிகழ்நிலை/எதிர்பார்க்கப்படும் செயல் நுணுக்கத்தையும், தண்ணீரை நோக்கிய இயக்கத்தைக் காட்டும் திசைச்சொல் வடிவத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְנִצַּבְתָּ לִקְרָאתוֹ
  choice: நீ அவனைச் சந்திக்க ... நின்றுகொள்
  rationale: தன்னை ஒரு இடத்தில் நிலைநிறுத்திக்கொண்டு அவனை எதிர்கொள்ளுதல் அல்லது சந்தித்தல் என்ற பொருளை மிகைப்படுத்தாமல் தருகிறது.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: நைல் நதிக்கரையில்
  rationale: שְׂפַת என்பது இங்கு கரையையும், יְאֹר என்பது யாத்திராகமச் சூழலில் குறிப்பாக நைல் நதியையும் குறிக்கிறது.
- source_word: הַמַּטֶּה
  choice: கோலை
  rationale: மோசே கையில் ஏந்தும் பொருளுக்கு நவீனத் தமிழில் இயல்பானதும் சூழலுக்கு ஏற்றதுமான சொல்.
- source_word: אֲשֶׁר נֶהְפַּךְ לְנָחָשׁ
  choice: பாம்பாக மாறிய
  rationale: נהפך என்பதன் நிலைமாற்றப் பொருளையும், נָחָשׁ என்பதன் பொதுவான பொருளையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: உன் கையில் எடுத்துக்கொள்
  rationale: கட்டளையின் வலிமையையும் மூலத்தின் தெளிவான 'உன் கையில்' என்ற உடற்காட்சியையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יְאֹר என்பதன் குறிப்பிட்ட இடப்பெயர்ப்பு
  choice: நைல் நதி
  alternative: ஆறு
  rationale: யாத்திராகமத்தின் எகிப்தியச் சூழலில் இச்சொல் பொதுவான ஓர் ஆற்றை அல்ல, நைல் நதியையே குறிக்கிறது; ஆகவே வரலாற்று-புவியியல் குறிப்பைத் தெளிவாக வைத்திருக்கிறது.
- issue: נָחָשׁ என்பதன் மொழிபெயர்ப்பு
  choice: பாம்பு
  alternative: சர்ப்பம்
  rationale: இரண்டும் சாத்தியமானவை; 'பாம்பு' என்பது பொருளை மாற்றாமல் சாதாரண நவீனத் தமிழ் வாசகருக்கு இயல்பாக உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான கட்டளைத் தொனியுடனும் மரியாதையான வேதாகம நடையுடனும் மொழிபெயர்க்கப்பட்டது. தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டன; மூலத்தின் கவன ஈர்ப்பு, இயக்கம், இடம், கட்டளை வரிசை ஆகியவை பாதுகாக்கப்பட்டன.
