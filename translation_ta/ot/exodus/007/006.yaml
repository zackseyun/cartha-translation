source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹתָ֖/ם כֵּ֥ן עָשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/006.yaml
  text: So Moses and Aaron did just as Yahweh had commanded them[a]; so they did.
translation:
  language: ta
  text: மோசேயும் ஆரோனும் யாவே[a] அவர்களுக்குக் கட்டளையிட்டபடியே செய்தார்கள்; அப்படியே அவர்கள் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “YHWH” (יהוה); மரபாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தார்கள்
  rationale: עשה என்பது ‘செய்/உருவாக்கு’ என்ற பரந்த பொருளுடைய வினை. இங்கு கட்டளைக்குக் கீழ்ப்படிவதைக் குறிப்பதால் ‘செய்தார்கள்’ என்பது இயல்பான தேர்வு; வசனத்தின் முடிவில் வரும் அதே வினையின் மறுபயன்பாட்டையும் இது காக்கிறது.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: மோசேயும் ஆரோனும்
  rationale: இரு பெயர்களையும் இணைக்கும் எபிரெய எளிய ஒருங்கிணைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: கட்டளைக்கும் அவர்கள் செய்த செயலுக்கும் இடையிலான துல்லியமான ஒத்திசைவை ‘-படியே’ தெளிவாகக் காட்டுகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: צוה என்பது அதிகாரத்துடன் கட்டளையிடுவதைக் குறிக்கிறது; முன்பு கொடுக்கப்பட்ட கட்டளையைத் தமிழில் இயல்பாக உறவெச்ச வடிவில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயர். அதன் ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்படுகிறது.
- source_word: אֹתָם
  choice: தங்களுக்குக்
  rationale: மோசே மற்றும் ஆரோன் ஆகியோரைக் குறிக்கும் பன்மைச் சுட்டை, தமிழ் வாக்கியத்தின் எழுவாயோடு இயல்பாகப் பொருந்தும் தற்படர்க்கைப் பெயராகத் தருகிறது.
- source_word: כֵּן עָשׂוּ
  choice: அப்படியே அவர்கள் செய்தார்கள்
  rationale: தொடக்க வினையை மீண்டும் கூறி, அவர்கள் கட்டளைக்கு முற்றிலும் இணங்கியதை வலியுறுத்தும் எபிரெய மறுபயன்பாட்டைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் יהוה என்ற தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது; மரபுவழி மாற்றீடு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயத்தில் வலியுறுத்தலுக்காக வரும் ‘செய்தார்கள் … செய்தார்கள்’ என்ற மறுபயன்பாடு சற்றே மீளுரைப்பாகத் தோன்றினாலும் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது.
