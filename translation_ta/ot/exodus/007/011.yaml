base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/011.yaml
  text: Then Pharaoh also called for the wise men and the sorcerers[a], and they too, the magicians of Egypt, did the same by their enchantments.
translation:
  language: ta
  text: அப்போது பார்வோனும் ஞானிகளையும் சூனியக்காரர்களையும் அழைத்தான்; எகிப்தின் மந்திரவாதிகளான அவர்களும் தங்கள் மறைவித்தைகளால்[a] அதையே செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் மந்திரச் செயல்களால்.” எபிரெயச் சொல் மந்திரச் செயல்களையோ மறைவித்தைகளையோ குறிக்கலாம்; அதன் துல்லியமான நுட்பப்பொருள் உறுதியில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்தான்
  rationale: இச்சூழலில் קרא என்பது ஒருவரைத் தன் முன்னிலைக்கு வரவழைப்பதைக் குறிக்கிறது; தமிழில் ‘அழைத்தான்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: גַּם
  choice: -உம்
  rationale: முந்தைய நிகழ்வுக்குப் பதிலாகப் பார்வோனும் தன் பங்கிற்கு செயல்பட்டான் என்பதை முதல் גַּם குறிக்கிறது.
- source_word: חֲכָמִים
  choice: ஞானிகள்
  rationale: அரண்மனைச் சூழலில் அறிவும் நிபுணத்துவமும் உடையவர்களைக் குறிக்கும் இயல்பான, மரியாதைக்குரிய சொல்.
- source_word: מְכַשְּׁפִים
  choice: சூனியக்காரர்கள்
  rationale: כשׁף வேர்ச்சொல் சூனியச் செயல்களில் ஈடுபடுவோரைக் குறிப்பதால், பின்னர் வரும் חַרְטֻמִּים என்பதிலிருந்து வேறுபாடு காக்கப்படுகிறது.
- source_word: וַיַּעֲשׂוּ ... כֵּן
  choice: அதையே செய்தார்கள்
  rationale: முந்தைய அடையாளத்தை அவர்கள் பின்பற்றிச் செய்தனர் என்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: גַם הֵם
  choice: அவர்களும்
  rationale: பார்வோனின் வல்லுநர்களும் அதே செயலைச் செய்தார்கள் என்ற ஒப்புமை வலியுறுத்தப்படுகிறது.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: எகிப்தின் மந்திரவாதிகள்
  rationale: எகிப்திய அரசவையின் சடங்கு அல்லது மந்திர நிபுணர்களைக் குறிக்கும் தெளிவான மொழிபெயர்ப்பு; எபிரெயக் கட்டமைப்பும் காக்கப்படுகிறது.
- source_word: בְּלַהֲטֵיהֶם
  choice: தங்கள் மந்திர வித்தைகளால்
  rationale: அவர்கள் பயன்படுத்திய மறைமுறை அல்லது மந்திரச் செயல்களைச் சுட்டுகிறது; அது உண்மையான அமானுஷ்ய வல்லமையா, மாயையா, ஏமாற்று வித்தையா என்பதைத் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: எகிப்திய மந்திரவாதிகளின் ஆற்றலின் இயல்பு
  choice: ‘தங்கள் மந்திர வித்தைகளால் அதையே செய்தார்கள்’ என்று நிகழ்வை மட்டும் விவரித்தல்
  alternative: அவர்கள் உண்மையான அமானுஷ்ய அடையாளம் செய்தார்கள் அல்லது வெறும் கண்கட்டு வித்தையால் ஏமாற்றினார்கள் என்று வெளிப்படையாகக் கூறுதல்
  rationale: எபிரெய உரை அவர்கள் செயலைப் பின்பற்றியதாகக் கூறுகிறது; ஆனால் அதன் மறைபொருள் சார்ந்த செயல்முறையை விளக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘சூனியக்காரர்கள்’ மற்றும் ‘மந்திரவாதிகள்’ என்ற இரு சொற்கள் மூலத்திலுள்ள வேறுபட்ட பதங்களை வேறுபடுத்துகின்றன; அமானுஷ்ய ஆற்றலின் இயல்பைப் பற்றி உரை கூறாததை மொழிபெயர்ப்பும் தீர்மானிக்கவில்லை.
