  to: 'யாவே இவ்வாறு சொல்கிறார்: ‘நானே யாவே என்பதை இதனால் நீ அறிந்துகொள்வாய். இதோ, என் கையிலுள்ள கோலால் நைல் நதியிலுள்ள தண்ணீரை நான் அடிக்கிறேன்; அது இரத்தமாக மாறும்.’'
  rationale: The revision preserves the source syntax and meaning while conforming the divine name to the project’s Yahweh policy. The participial verb is rendered with vivid present form (‘அடிக்கிறேன்’), with the following future (‘மாறும்’) clearly expressing the result. No footnote is needed because Tamil’s mass noun ‘தண்ணீர்’ naturally takes singular agreement, without obscuring the intended sense.
