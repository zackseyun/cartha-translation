id: EXO.7.17
reference: Exodus 7:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּ/זֹ֣את תֵּדַ֔ע כִּ֖י אֲנִ֣י יְהוָ֑ה הִנֵּ֨ה אָנֹכִ֜י מַכֶּ֣ה בַּ/מַּטֶּ֣ה אֲשֶׁר בְּ/יָדִ֗/י עַל הַ/מַּ֛יִם אֲשֶׁ֥ר בַּ/יְאֹ֖ר וְ/נֶהֶפְכ֥וּ לְ/דָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/017.yaml
  text: 'Thus says Yahweh: By this you will know that I am Yahweh: behold[a], I am striking the water that is in the Nile with the staff that is in my hand, and it will be turned to blood.'
translation:
  language: ta
  text: 'யாவே இவ்வாறு சொல்கிறார்: ‘நானே யாவே என்பதை இதனால் நீ அறிந்துகொள்வாய். இதோ, என் கையிலுள்ள கோலால் நைல் நதியிலுள்ள தண்ணீரை நான் அடிக்கிறேன்; அது இரத்தமாக மாறும்.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: யெகோவா இவ்வாறு சொல்கிறார்
  rationale: தூதர் அறிவிப்புக்குரிய எபிரெய மரபுத்தொடரின் முறையான வலிமையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: בְּזֹאת תֵּדַע כִּי אֲנִי יְהוָה
  choice: நானே யெகோவா என்பதை இதனால் நீ அறிந்துகொள்வாய்
  rationale: בְּזֹאת என்பதன் கருவிப் பொருளை ‘இதனால்’ என்றும், אֲנִי என்பதன் வலியுறுத்தலை ‘நானே’ என்றும் வெளிப்படுத்துகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: வரவிருக்கும் செயலைச் சுட்டும் நாடகத்தன்மையும் உடனடித் தன்மையும் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אָנֹכִי מַכֶּה
  choice: நான் அடிக்கப்போகிறேன்
  rationale: சுயப்பெயருடன் வரும் எபிரெயப் பங்கேற்புவினை இங்கு அண்மையில் நிகழவிருக்கும் உயிரோட்டமான செயலைக் குறிக்கிறது; தமிழில் நிகழ்கால வடிவம் தவறாகப் புரியக்கூடும் என்பதால் அண்மை எதிர்காலம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: בַּמַּטֶּה אֲשֶׁר בְּיָדִי
  choice: என் கையிலுள்ள கோலால்
  rationale: மַטֶּה என்பதற்கு இச்சூழலில் இயல்பான ‘கோல்’ தேர்ந்தெடுக்கப்பட்டு, கருவியும் அது கையில் இருப்பதும் காக்கப்படுகின்றன.
- source_word: הַמַּיִם אֲשֶׁר בַּיְאֹר
  choice: நைல் நதியிலுள்ள தண்ணீரை
  rationale: יְאֹר இங்கு குறிப்பாக நைல் நதியைக் குறிக்கிறது; பன்மையான ‘நீர்கள்’ என்பதற்குப் பதில் தமிழில் இயல்பான திரள்பெயரான ‘தண்ணீர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְנֶהֶפְכוּ לְדָם
  choice: அது இரத்தமாக மாறும்
  rationale: தண்ணீரில் நிகழும் மாற்றத்தின் விளைவைத் தெளிவாகக் கூறுகிறது; மூலத்தின் பன்மை தமிழின் திரள்பெயர் வழக்குக்கு ஏற்ப ஒருமையாக மாற்றப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: நான்கு எழுத்து இறைப்பெயரை ஒரு பட்டமாக மாற்றாமல் தனிப்பட்ட பெயராகக் காட்டுகிறது. தமிழ்க் கிறிஸ்தவ வாசகர்களிடையே நிலைபெற்றுள்ள ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது; மூல உச்சரிப்பை மறுவடிவமைக்கும் ‘யாவே’ என்பதும் சாத்தியமான மாற்று.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified உரைநடை. நேரடி உரையும் அறிவிப்பு பாணியும் காக்கப்பட்டுள்ளன; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
