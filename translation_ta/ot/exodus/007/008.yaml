  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, தனிப்பெயர் இருப்பதைப் பிரதிபலிக்கிறது; எந்தச் சமயப்பிரிவுக்குமான தனித்த கோட்பாட்டையும் இங்கு சேர்க்கவில்லை.
translation_notes:
