lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரை, தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: וַיֹּאמֶר
  choice: பின்பு … கூறியதாவது
  rationale: விவரிப்பின் தொடர்ச்சியையும் அடுத்து வரும் நேரடி உரையை அறிமுகப்படுத்தும் எபிரெயச் சொல்லாட்சியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן
  choice: மோசேயிடமும் ஆரோனிடமும்
  rationale: இருவரும் உரையின் பெறுநர்கள் என்பதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: לֵאמֹר
  choice: கூறியதாவது
  rationale: எபிரெயில் நேரடி உரையை அறிமுகப்படுத்தும் கூறை விடாமல், தமிழில் தேவையற்ற ‘சொல்லி’ என்ற இரட்டிப்பைத் தவிர்க்கிறது.
theological_decisions:
