  source_fidelity: 'எபிரெய மூலத்தின் வாக்கிய அமைப்பு தெளிவாகப் பிரதிபலிக்கப்படுகிறது: யெகோவா/கர்த்தர் பேசுபவர்; மோசேவும் ஆரோனும் பெறுநர்கள்; לֵאמֹר அடுத்துவரும் நேரடி உரையை அறிமுகப்படுத்துகிறது. ஆனால் யְהוָה என்பதன் வரலாற்று உச்சரிப்பு உறுதியாகத் தெரியாத நிலையில், «யெகோவா» என்பது மூலத்தில் நிர்ணயிக்கப்படாத ஒரு குறிப்பிட்ட உச்சரிப்பைத் தேர்ந்தெடுக்கிறது. ஆங்கில POB-யின் LORD நடைமுறையுடனும் தமிழ் வேதாகமப் பொதுநடையுடனும் «கர்த்தர்» ஒத்திருக்கிறது.'
