    issue: The divine name is rendered 'யெகோவா.'
    rationale: The English POB audit trail explicitly chooses 'Yahweh,' not 'Jehovah.' Since the translation philosophy preserves the Tetragrammaton as a personal name, Tamil should use a corresponding transliteration, 'யாவே.'
  - severity: low
    issue: '''இதயம் கனத்திருக்கிறது'' is potentially less precise in modern Tamil.'
    rationale: While grammatically possible, it can imply sorrow or emotional burden. 'இதயம் கனமாக இருக்கிறது' more transparently preserves the concrete Hebrew metaphor of heaviness while allowing the footnote to state its contextual sense.
