source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כָּבֵ֖ד לֵ֣ב פַּרְעֹ֑ה מֵאֵ֖ן לְ/שַׁלַּ֥ח הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/014.yaml
  text: Then Yahweh said to Moses[a], “Pharaoh’s heart is heavy; he refuses to let the people go.”
translation:
  language: ta
  text: பின்பு யாவே மோசேயிடம், “பார்வோனின் இதயம் கனமாக இருக்கிறது[a]; மக்களைப் போகவிட அவன் மறுக்கிறான்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பார்வோனின் இதயம் கடினமாக இருக்கிறது.” எபிரெயப் பெயரடை சொல்லுக்குச் சொல் “கனமானது” என்று பொருள்படும்; இங்கு அது பிடிவாதமான அல்லது இணங்காத மனநிலையைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: வாவ் தொடர்வினை கதை நிகழ்வை முன்னெடுத்துச் செல்கிறது; நவீன தமிழில் ‘பின்பு’ நிகழ்வின் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைபெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நிலைபெற்றுள்ள பெயரொலி வடிவில் வழங்குகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: எபிரெய தனிப்பெயரின் தமிழில் வழக்கமான வடிவம்.
- source_word: כָּבֵד
  choice: கனத்திருக்கிறது
  rationale: மூலச் சொல் நேரடியாக ‘கனமாக இருத்தல்’ என்பதைக் குறிக்கிறது. பிடிவாதம் அல்லது இணங்காமையைக் குறிக்கும் உருவகத்தை விளக்கமாக மாற்றாமல் தக்கவைக்கிறது.
- source_word: לֵב פַּרְעֹה
  choice: பார்வோனின் இதயம்
  rationale: எபிரெய ஆக்கத் தொடரை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது; ‘இதயம்’ உள்ளார்ந்த மனப்பாங்கைக் குறிக்கும் மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: מֵאֵן
  choice: அவன் மறுக்கிறான்
  rationale: தொடரும் மறுப்பு மனநிலையை நிகழ்கால வடிவில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְשַׁלַּח
  choice: போகவிட
  rationale: யாத்திராகமச் சூழலில் மக்களை வெளியேற அனுமதிப்பதைக் குறிக்கும் வினையின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: הָעָם
  choice: மக்களை
  rationale: மூலத்தில் உள்ள ‘மக்கள்’ என்பதை மட்டும் வழங்கி, இவ்வசனத்தில் வெளிப்படையாக இல்லாத ‘இஸ்ரவேல்’ என்பதைச் சேர்க்கவில்லை.
theological_decisions:
- issue: பார்வோனின் நிலையை இறுகிப்போகும் கருப்பொருளோடு அளவுக்கு மீறி ஒரேமாதிரியாக்காமல் வழங்குதல்
  choice: பார்வோனின் இதயம் கனத்திருக்கிறது
  alternative: பார்வோனின் இதயம் கடினமாயிருக்கிறது
  rationale: இங்கு எபிரெயம் ‘கனம்’ சார்ந்த சொல்லையே பயன்படுத்துகிறது. அதைப் பாதுகாப்பது இறுகுதல் தொடர்பான வேறுபட்ட எபிரெய சொற்களை ஒன்றாகக் கலக்காமல், மூலத்தின் உருவகத்தையும் இறையியல் பதற்றத்தையும் நிலைநிறுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. மூலத்தின் ‘கனமான இதயம்’ உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
