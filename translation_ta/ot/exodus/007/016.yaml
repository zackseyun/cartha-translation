id: EXO.7.16
reference: Exodus 7:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֵלָ֗י/ו יְהוָ֞ה אֱלֹהֵ֤י הָ/עִבְרִים֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יַֽעַבְדֻ֖/נִי בַּ/מִּדְבָּ֑ר וְ/הִנֵּ֥ה לֹא שָׁמַ֖עְתָּ עַד כֹּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/016.yaml
  text: 'And you shall say to him[a], ‘Yahweh, the God of the Hebrews, has sent me to you, saying: Let my people go, so that they may serve me in the wilderness. But behold, until now you have not listened.’'
translation:
  language: ta
  text: 'நீ அவனிடம், “எபிரெயர்களின் கடவுளாகிய யாவே என்னை உன்னிடம் அனுப்பியிருக்கிறார்; அவர் கூறுவது: ‘என் மக்கள் வனாந்தரத்தில் எனக்குப் பணியாற்றும்படி[a] அவர்களைப் போகவிடு.’ ஆனால் இதோ, இதுவரை நீ செவிகொடுக்கவில்லை” என்று சொல்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னை வழிபடும்படி.” எபிரேய வினைச்சொல் பொதுவாகப் பணியாற்றுவதையும், சமயச் சூழலில் வழிபடுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் பொதுவாக ஏற்கப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: எபிரெயர்களின் கடவுள்
  rationale: மூலத்திலுள்ள இன அடையாளமான ‘எபிரெயர்கள்’ என்பதைக் ‘இஸ்ரவேலர்கள்’ என்று மாற்றாமல் அப்படியே பாதுகாக்கிறது.
- source_word: שְׁלָחַנִי אֵלֶיךָ
  choice: என்னை உன்னிடம் அனுப்பி
  rationale: மோசே பெற்ற தெய்வீக அனுப்புதலையும் அதன் இலக்கான பார்வோனையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: என் மக்களைப் போகவிடு
  rationale: இந்தச் சூழலில் שלח கோரும் விடுதலையைத் தெளிவாகவும் வழக்கமான தமிழிலும் தெரிவிக்கிறது.
- source_word: וְיַעַבְדֻנִי
  choice: எனக்குப் பணிசெய்யும்படி
  rationale: עבד என்பதன் பரந்த ‘பணிசெய்தல்/சேவித்தல்’ பொருளைப் பாதுகாக்கிறது; மத வழிபாடு என்ற சாத்தியத்தைக் குறிப்பில் தருகிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: மக்கள் குடியிருப்புக்கு அப்பாலுள்ள wilderness நிலப்பரப்பைக் குறிக்கிறது; வெறும் மணற்பாலைவனம் என்று பொருளைக் குறுக்கவில்லை.
- source_word: וְהִנֵּה
  choice: ஆனால் இதோ
  rationale: கவனத்தை ஈர்க்கும் הִנֵּה-யின் வலிமையையும் சூழலிலுள்ள எதிர்மறைத் திருப்பத்தையும் பாதுகாக்கிறது.
- source_word: לֹא שָׁמַעְתָּ עַד כֹּה
  choice: இதுவரை நீ செவிகொடுக்கவில்லை
  rationale: שׁמע என்பதன் ‘கேட்டு ஏற்றுக்கொள்ளுதல்/செவிகொடுத்தல்’ நுட்பத்தைப் பாதுகாத்து, நேரடியாக ‘கீழ்ப்படியவில்லை’ என்று விளக்கிவிடுவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, தனிப்பட்ட இறைப்பெயரையே பயன்படுத்துகிறது; ஆகவே அதை ஒலிபெயர்த்து வழங்குகிறது.
- issue: וְיַעַבְדֻנִי என்பதன் பொருள்
  choice: எனக்குப் பணிசெய்யும்படி
  alternative: என்னை வழிபடும்படி
  rationale: עבד இங்கு வழிபாட்டை உள்ளடக்கக்கூடும்; எனினும் அது சேவை என்ற பரந்த பொருளையும் கொண்டிருப்பதால் பிரதான உரை அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. கட்டளையின் நேரடித்தன்மையும் பார்வோனிடம் சொல்லப்படும் செய்திக்குள் உள்ள மேற்கோள் அமைப்பும் பாதுகாக்கப்பட்டுள்ளன; ‘செவிகொடுக்கவில்லை’ என்பது கேட்டும் ஏற்காத நிலையை இயல்பாக வெளிப்படுத்துகிறது.
