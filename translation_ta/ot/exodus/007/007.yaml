base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/007.yaml
  text: Moses was eighty years old[a], and Aaron was eighty-three years old, when they spoke to Pharaoh.
translation:
  language: ta
  text: அவர்கள் பார்வோனிடம் பேசியபோது, மோசேக்கு எண்பது வயது[a], ஆரோனுக்கு எண்பத்து மூன்று வயது இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொற்படியாக: “மோசே எண்பது ஆண்டுகளின் மகனும், ஆரோன் எண்பத்து மூன்று ஆண்டுகளின் மகனும் இருந்தார்கள்; அவர்கள் பார்வோனிடம் பேசியபோது.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן ... שָׁנָה
  choice: … வயது
  rationale: வயதைக் குறிக்கும் எபிரெய மரபுத்தொடர் சொற்படியாக ‘… ஆண்டுகளின் மகன்’ என இருந்தாலும், நவீனத் தமிழில் இயல்பாக ‘… வயது’ என்று வழங்கப்படுகிறது.
- source_word: שְׁמֹנִים שָׁנָה
  choice: எண்பது வயது
  rationale: எண்பது ஆண்டுகள் என்ற வயதை இயல்பான தமிழில் இவ்வாறு கூறுகிறோம்.
- source_word: שָׁלֹשׁ וּשְׁמֹנִים שָׁנָה
  choice: எண்பத்து மூன்று வயது
  rationale: எபிரெயத்தில் ‘மூன்றும் எண்பதும்’ என்ற வரிசையில் உள்ள எண்ணைத் தமிழின் வழக்கமான எண்ணமைப்பில் வழங்குகிறது.
- source_word: בְּדַבְּרָם
  choice: அவர்கள் … பேசியபோது
  rationale: முன்னொட்டு בְּ உடன் வரும் வினையெச்சப்பெயரும் பன்மை உடைமைப் பின்னொட்டும் இங்கு காலச் சூழலைக் குறிக்கின்றன.
- source_word: אֶל
  choice: …ிடம்
  rationale: ஒருவரை நோக்கிப் பேசுவதைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்லுருபு.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரசருக்கான பட்டத்தின் தமிழ் வேதாகம மரபில் பரவலாக அறியப்பட்ட வடிவம்.
- source_word: וּ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: தொடக்க வாவ் கதையோட்டத் தொடர்பைக் காட்டுகிறது; தமிழில் வாக்கிய அமைப்பே அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துவதால் ‘மேலும்’ அல்லது ‘இப்போது’ எனச் சேர்க்கப்படவில்லை.
