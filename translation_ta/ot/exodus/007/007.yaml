translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. எபிரெய வயது மரபுத்தொடர் முதன்மை உரையில் இயல்பான தமிழாகவும், அதன் சொற்படியான வடிவம் அடிக்குறிப்பிலும் தரப்பட்டுள்ளது. மூலத்தின் வாக்கியத் தகவலைத் தெளிவாகத் தக்கவைக்க இறுதிக் காலவாக்கியம் இயல்பான தமிழில் மறுவடிவமைக்கப்பட்டுள்ளது.
