  yaml_path: translation/ot/exodus/007/003.yaml
  text: But I will harden Pharaoh’s heart[a], and I will multiply my signs and my wonders in the land of Egypt.
translation:
  language: ta
  text: ஆனால் நானோ பார்வோனின் இதயத்தைக் கடினப்படுத்துவேன்[a]; எகிப்து நாட்டில் என் அடையாளங்களையும் என் அற்புதங்களையும் பெருகச் செய்வேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பார்வோனின் இதயத்தைக் கடினமாக்குவேன்’ அல்லது ‘பார்வோனின் இதயத்தைப் பிடிவாதமாக்குவேன்.’ எபிரெய வினைச்சொல் காரணவினை வடிவில் உள்ளது; கடினப்படுத்தும் செயலை அது நேரடியாகக் கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: ஆனால் நானோ
  rationale: இணைப்புச்சொல்லுடன் வரும் வெளிப்படையான முதலாம் நபர் சுட்டுப்பெயர், முந்தைய வசனங்களின் பின்னணியில் முரண்பாட்டையும் வலியுறுத்தலையும் குறிக்கிறது. ‘ஆனால் நானோ’ என்பது அதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַקְשֶׁה
  choice: கடினப்படுத்துவேன்
  rationale: קשׁה என்பதன் ஹிஃபில் வடிவம் நேரடியான காரணவினைப் பொருளில் ‘கடினமாக்குவேன்/கடினப்படுத்துவேன்’ என்று பொருள்படுகிறது. ‘கடினப்படுத்துவேன்’ என்பது காரணவினை வலிமையைச் சுருக்காமல் காக்கிறது.
- source_word: לֵב פַּרְעֹה
  choice: பார்வோனின் இதயத்தை
  rationale: எபிரெயக் கட்டிணைப்பு இயல்பான தமிழ் உடைமைத் தொடராக மொழிபெயர்க்கப்படுகிறது. ‘இதயம்’ என்பது இங்கு உள்ளார்ந்த மனம் அல்லது மனவுறுதியைக் குறிக்கலாம்; எனினும் மூல உருவகம் விளக்கமாக மாற்றப்படாமல் தக்கவைக்கப்படுகிறது.
- source_word: וְהִרְבֵּיתִי
  choice: பெருகச் செய்வேன்
  rationale: רבה என்பதன் ஹிஃபில் வடிவம் ‘பலுகச் செய்தல்/பெருகச் செய்தல்’ என்ற காரணவினைப் பொருளைத் தருகிறது. தொடர்ச்சியான சூழலில் எதிர்காலச் செயலைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֹתֹתַי
  choice: என் அடையாளங்கள்
  rationale: אוֹת என்பதற்கு இச்சூழலில் ‘அடையாளம்’ என்பது தெளிவான, நிலைபெற்ற தமிழ் இணைச்சொல்; தேவனுடைய செயல்கள் அவருடைய வல்லமையையும் செய்தியையும் சுட்டுவதை இது வெளிப்படுத்துகிறது.
- source_word: מוֹפְתַי
  choice: என் அற்புதங்கள்
  rationale: מוֹפֵת என்பது ‘அற்புதம்’ அல்லது ‘வியப்புக்குரிய அடையாளம்’ எனப் பொருள்படலாம். ‘அற்புதங்கள்’ என்பது ‘அடையாளங்கள்’ என்பதுடன் இயல்பாக இணைந்து, பொருளை மிகையாகக் குறுக்காமல் காக்கிறது.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டில்
  rationale: மூலத்தில் אֶרֶץ (‘நாடு’) வெளிப்படையாக இருப்பதால், இயல்பான தமிழில் ‘எகிப்து நாட்டில்’ என்று முழுமையாகத் தரப்பட்டுள்ளது.
theological_decisions:
- issue: பார்வோனின் இதயம் கடினப்படுவதில் தேவனுடைய செயல்
  choice: பார்வோனின் இதயத்தைக் கடினப்படுத்துவேன்
  alternative: பார்வோனின் இதயத்தைப் பிடிவாதமாக்குவேன்; பார்வோனின் இதயம் கடினமாகும்படி அனுமதிப்பேன்
  rationale: எபிரெய ஹிஃபில் வடிவம் தேவனுடைய செயலை நேரடியான காரணவினையாக முன்வைக்கிறது. இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் காக்க, முதன்மை உரை அந்த நேரடித் தன்மையைத் தக்கவைக்கிறது; வெறும் அனுமதியாக மாற்றுவது மூல வடிவத்தின் இயல்பான பொருளை மென்மையாக்கிவிடும்.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘இதயம்,’ ‘அடையாளங்கள்,’ ‘அற்புதங்கள்’ ஆகிய வேதாகம உருவகங்களும் இணைப்பும் இயல்பான தமிழில் தக்கவைக்கப்பட்டுள்ளன.
