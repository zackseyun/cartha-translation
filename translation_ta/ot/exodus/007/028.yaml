base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/028.yaml
  text: The Nile will swarm with frogs[a], and they will come up and enter your house, your bedroom, and your bed, and the houses of your servants and your people, and your ovens and your kneading bowls.
translation:
  language: ta
  text: நைல் நதியில் தவளைகள் கூட்டங்கூட்டமாகப் பெருகும். அவை மேலேறி வந்து உன் வீட்டுக்குள்ளும், உன் படுக்கையறைக்குள்ளும், உன் படுக்கையின்மேலும், உன் பணியாளர்களின் வீடுகளுக்குள்ளும், உன் மக்களிடையிலும், உன் அடுப்புகளுக்குள்ளும், உன் மாவு பிசைப்பதற்கான பாத்திரங்களுக்குள்ளும்[a] புகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் மாவு பிசைப்பதற்கான தொட்டிகளுக்குள்ளும்.”
    reason: מִשְׁאֶרֶת என்பது மாவு பிசைப்பதற்குப் பயன்படும் கிண்ணம், பாத்திரம், அல்லது தொட்டி போன்ற கலனைக் குறிக்கலாம்; அதன் துல்லிய வடிவம் உறுதியல்ல.
lexical_decisions:
- source_word: וְשָׁרַץ
  choice: கூட்டங்கூட்டமாக நிறையும்
  rationale: שׁרץ சிறு உயிரினங்கள் பெருந்திரளாகப் பெருகி நிறைவதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் காட்சித்தன்மையுடனும் இதை வெளிப்படுத்த இச்சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: הַיְאֹר
  choice: நைல் நதி
  rationale: எகிப்தியச் சூழலில் יְאֹר என்பது குறிப்பாக நைல் நதியைக் குறிக்கிறது; பொதுவான ‘நதி’ என்பதைவிட இப்பெயர் தெளிவானது.
- source_word: צְפַרְדְּעִים
  choice: தவளைகள்
  rationale: எபிரெயப் பன்மைப் பெயர்ச்சொல்லின் நேரான, இயல்பான தமிழ் இணை.
- source_word: וְעָלוּ וּבָאוּ
  choice: மேலேறி வந்து ... புகும்
  rationale: தவளைகள் நதியிலிருந்து மேலேறி குடியிருப்புகளுக்குள் நுழைவதை இயக்கத்துடன் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּבֵיתֶךָ
  choice: உன் வீட்டுக்குள்
  rationale: இப்பட்டியலில் பார்வோனின் குடும்பத்தாரை அல்ல, அவனது குடியிருப்பையே குறிக்கிறது.
- source_word: בַּחֲדַר מִשְׁכָּבְךָ
  choice: உன் படுக்கையறைக்குள்
  rationale: சொல்லுக்குச் சொல் ‘நீ படுக்கும் அறை’; ‘படுக்கையறை’ என்பது அதற்கான தெளிவான நவீனத் தமிழ் வடிவம்.
- source_word: וְעַל מִטָּתֶךָ
  choice: உன் படுக்கையின்மேல்
  rationale: עַל என்பதன் ‘மேல்’ என்ற இடப்பொருளை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: בְבֵית עֲבָדֶיךָ
  choice: உன் பணியாளர்களின் வீடுகளுக்குள்
  rationale: ஒருமை வடிவிலுள்ள בֵית, பன்மை உடைமையாளருடன் பகிர்ந்தளிப்புப் பொருளில் வருவதால் தமிழில் ‘வீடுகள்’ என இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: וּבְעַמֶּךָ
  choice: உன் மக்களிடையில்
  rationale: மக்களுக்குள் அல்லது அவர்கள் மத்தியில் தவளைகள் பரவுவதைச் சொல்கிறது; அவர்களுக்குள் உடல்ரீதியாக நுழைவதாகத் தவறாகப் புரியாதவாறு ‘மக்களிடையில்’ எனப்பட்டது.
- source_word: וּבְתַנּוּרֶיךָ
  choice: உன் அடுப்புகளுக்குள்
  rationale: תַּנּוּר என்பது உணவு சுடுவதற்கான வீட்டு அடுப்பைக் குறிக்கிறது; ‘அடுப்புகள்’ பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: וּבְמִשְׁאֲרוֹתֶיךָ
  choice: நீ மாவு பிசையும் பாத்திரங்களுக்குள்
  rationale: מִשְׁאֶרֶת மாவு பிசைவதற்குப் பயன்படுத்தப்படும் பாத்திரம் அல்லது தொட்டியைக் குறிக்கிறது. பயன்பாட்டைச் சேர்த்துக் கூறுவது நவீன வாசகருக்குத் தெளிவளிக்கிறது; பாத்திரத்தின் துல்லிய வடிவத்தை நிர்ணயிக்கவில்லை.
