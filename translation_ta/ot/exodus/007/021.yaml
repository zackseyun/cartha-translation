base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/021.yaml
  text: And the fish in the Nile died[a], and the Nile stank, so that the Egyptians could not drink water from the Nile. And there was blood throughout all the land of Egypt.
translation:
  language: ta
  text: நைல் நதியில்[a] இருந்த மீன்கள் இறந்துபோயின; நைல் நதி துர்நாற்றம் வீசியது. அதனால் எகிப்தியர்களால் நைல் நதியின் தண்ணீரைக் குடிக்க முடியவில்லை. எகிப்து நாடு முழுவதும் இரத்தம் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இச்சொல் சொல்லுக்குச் சொல் ‘நதி’ என்று பொருள்படும்; ஆனால் யாத்திராகமத்தில் இது குறிப்பாக நைல் நதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: மீன்கள்
  rationale: எபிரெயச் சொல் மீன்களைத் தொகுதியாகக் குறிக்கிறது. தமிழில் பன்மையான ‘மீன்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יְאֹר
  choice: நைல் நதி
  rationale: இச்சொல்லின் அடிப்படைப் பொருள் ‘நதி’ என்றாலும், யாத்திராகமத்தின் இச்சூழலில் அது குறிப்பாக நைல் நதியைக் குறிக்கிறது.
- source_word: מֵתָה
  choice: இறந்துபோயின
  rationale: நிகழ்வுகளின் தொடரைச் சுட்டும் எளிய இறந்தகால வினையாகவும், தமிழில் மீன்களைப் பற்றிய இயல்பான சொல்லாக்கமாகவும் உள்ளது.
- source_word: וַיִּבְאַשׁ
  choice: துர்நாற்றம் வீசியது
  rationale: நதி நாற்றமெடுத்ததைத் தெளிவாகவும் கண்ணியமான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: וְלֹא יָכְלוּ
  choice: முடியவில்லை
  rationale: எகிப்தியர்களின் இயலாமையை இயல்பான தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: לִשְׁתּוֹת מַיִם מִן הַיְאֹר
  choice: நைல் நதியின் தண்ணீரைக் குடிக்க
  rationale: எபிரெயத்தில் வெளிப்படையாக உள்ள ‘குடிக்க’, ‘தண்ணீர்’, ‘நதியிலிருந்து’ ஆகிய கூறுகளை இயல்பான தமிழ் வடிவில் தக்கவைக்கிறது.
- source_word: וַיְהִי הַדָּם
  choice: இரத்தம் இருந்தது
  rationale: இரத்தம் எகிப்து நாடெங்கும் இருந்தது என்ற எபிரெய இருப்புநிலைச் சொல்லாக்கத்தை மிகைப்படுத்தாமல் பிரதிபலிக்கிறது.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: எகிப்து நாடு முழுவதும்
  rationale: בכל என்பதன் பரவலான முழுமைப் பொருளை நவீன தமிழில் தெளிவாக எடுத்துரைக்கிறது.
