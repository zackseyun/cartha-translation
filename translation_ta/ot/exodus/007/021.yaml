  source_fidelity: 'மூல எபிரெயத்தின் நிகழ்வுவரிசையும் பொருளும் துல்லியமாகத் தக்கவைக்கப்பட்டுள்ளன: நதியிலிருந்த மீன்கள் இறந்தன, நதி துர்நாற்றம் வீசியது, எகிப்தியர்கள் அதன் தண்ணீரைக் குடிக்க இயலவில்லை, எகிப்து முழுவதும் இரத்தம் இருந்தது. יְאֹר என்பதற்கு இச்சூழலில் ‘நைல் நதி’ எனக் கொடுத்திருப்பது சரியானது.'
  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘துர்நாற்றம் வீசியது,’ ‘குடிக்க முடியவில்லை,’ ‘நாடு முழுவதும்’ ஆகியவை பொதுவாசகருக்குப் புரியும் கண்ணியமான சொல்லாக்கங்கள்.
  terminology: ‘நைல் நதி,’ ‘எகிப்தியர்கள்,’ ‘இரத்தம்’ ஆகிய பெயர்களும் சொற்களும் நிலையானவையும் பொருத்தமானவையும் ஆகும். அடிக்குறிப்பு יְאֹר-இன் சொல்லியல் மாற்றையும் யாத்திராகமச் சூழலிலுள்ள குறிப்பான நைல் குறியீட்டையும் சரியாக விளக்குகிறது.
