  yaml_path: translation/ot/exodus/007/029.yaml
  text: The frogs will come up on you[a], on your people, and on all your servants.
translation:
  language: ta
  text: தவளைகள் உன்மேலும், உன் மக்கள்மேலும்[a], உன் பணியாளர்கள் அனைவர்மேலும் ஏறி வரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் மக்களிடையிலும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் மூன்று சொற்றொடர்களிலும் ஒரே முன்னொட்டே வருகிறது; எனினும், தவளைகள் பார்வோனையும் அவனுடைய ஆட்சிக்கு உட்பட்டவர்களையும் துன்பமாக வந்தடையும் சூழலை ‘மேல்’ என்பது வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: உன்மேல்
  rationale: בְּ என்னும் முன்னொட்டு இங்கு தவளைகள் பார்வோனைத் தனிப்பட்ட முறையில் தாக்கும் விதமாக அவன்மேல் வருவதைக் குறிக்கிறது. ‘உன்மேல்’ என்பது இயல்பான தமிழிலும் துன்பம் வந்தடையும் வலிமையையும் தருகிறது.
- source_word: בְּעַמְּךָ
  choice: உன் மக்கள்மேல்
  rationale: எபிரெய மூலத்தில் திரும்பத் திரும்ப வரும் בְּ முன்னொட்டின் இணைநிலையை ‘மேல்’ என்பதன் மூலம் காக்கிறது; தவளைகள் மக்களைத் துன்புறுத்த வந்தடைவதை இது தெளிவாகக் காட்டுகிறது.
- source_word: בְּכָל עֲבָדֶיךָ
  choice: உன் பணியாளர்கள் அனைவர்மேல்
  rationale: עֶבֶד என்பது பணியாளர், அடிமை, அரசவை அலுவலர் ஆகிய பொருள்களைக் கொள்ளலாம். இச்சூழலில் ‘பணியாளர்கள்’ என்பது அவர்களின் துல்லியமான சமூக நிலையைக் கூடுதலாக நிர்ணயிக்காமல் பரந்த பொருளைக் காக்கிறது.
- source_word: יַעֲלוּ
  choice: ஏறிவரும்
  rationale: עָלָה என்பதன் மேல்நோக்கிய இயக்கத்தையும், தவளைகள் நீரிலிருந்து வெளிப்பட்டு மக்களிடம் வருவதையும் ‘ஏறிவரும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַצְּפַרְדְּעִים
  choice: தவளைகள்
  rationale: எபிரெய மொழியில் குறிப்புச் சுட்டு இருந்தாலும், அறிவிக்கப்பட்ட தவளைப் பெருக்கைக் குறிக்க தமிழில் ‘தவளைகள்’ என்பதே இயல்பானதும் தெளிவானதும் ஆகும்.
