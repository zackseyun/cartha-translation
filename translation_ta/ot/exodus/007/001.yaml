source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רְאֵ֛ה נְתַתִּ֥י/ךָ אֱלֹהִ֖ים לְ/פַרְעֹ֑ה וְ/אַהֲרֹ֥ן אָחִ֖י/ךָ יִהְיֶ֥ה נְבִיאֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/001.yaml
  text: Then Yahweh said to Moses[a], “See, I have made you God to Pharaoh, and Aaron your brother will be your prophet.”
translation:
  language: ta
  text: அப்போது யாவே மோசேயிடம், “பார், நான் உன்னைப் பார்வோனுக்குக் கடவுளாக ஆக்கியிருக்கிறேன்[a]; உன் சகோதரன் ஆரோன் உன் தீர்க்கதரிசியாக இருப்பான்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பார்வோனுக்குக் கடவுளாக” என்பது எபிரெயத்தின் நேரடியான சொல்லமைப்பு. “பார்வோனுக்குக் கடவுளைப் போல” என்றும் பொருள் விளக்கமாக மொழிபெயர்க்கலாம். ஆரோன் மோசேயின் “தீர்க்கதரிசி”யாக இருப்பதால், பார்வோனுக்கு முன் மோசே கடவுளின் அதிகாரத்தைப் பிரதிநிதித்துவப்படுத்தும் பங்கை இது சுட்டுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அதன் பரவலான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர் வடிவம் கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; நவீன தமிழில் ‘அப்போது’ அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רְאֵה
  choice: பார்
  rationale: அடுத்து கூறப்படுவதைக் கவனிக்கும்படி மோசேயை அழைக்கும் ஒருமை கட்டளை வடிவத்தின் நேரடியான, இயல்பான தமிழ்.
- source_word: נְתַתִּיךָ
  choice: நான் உன்னை ... ஆக்கியிருக்கிறேன்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘கொடுத்தேன்’ என்றாலும், இங்குள்ள பயனிலை அமைப்பில் ஒருவரை ஒரு நிலை அல்லது பணியில் வைத்ததைக் குறிக்கும் விளைவு சார்ந்த பொருள் இயல்பானது.
- source_word: אֱלֹהִים
  choice: கடவுளாக
  rationale: எபிரெய மூலத்தின் நேரடியான, அதிர்ச்சியூட்டும் பயனிலையைத் தக்கவைக்கிறது. இது மோசேயின் இயல்பைப் பற்றிய வரையறை என்று உரை வெளிப்படையாகச் சொல்லாமல், பார்வோனுடனான உறவில் அவருக்குக் கொடுக்கப்பட்ட அதிகார நிலையைக் கூறுகிறது.
- source_word: לְפַרְעֹה
  choice: பார்வோனுக்கு
  rationale: לְ என்னும் முன்னிடைச்சொல் இங்கு பார்வோனைச் சார்ந்த உறவை நேரடியாகக் குறிக்கிறது.
- source_word: נְבִיאֶךָ
  choice: உன் தீர்க்கதரிசியாக
  rationale: נָבִיא என்பதற்கான நிலையான வேதாகமத் தமிழ்ச் சொல்; ‘பேச்சாளர்’ என்று விளக்கவுரையாக்காமல், ஆரோனின் தீர்க்கதரிசி உறவைத் தக்கவைக்கிறது.
- source_word: יִהְיֶה
  choice: இருப்பான்
  rationale: எதிர்கால நிலையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பார்வோனைப் பொறுத்தவரை மோசே אֱלֹהִים எனப்படுதல்
  choice: கடவுளாக
  alternative: கடவுளைப் போல
  rationale: எபிரெயத்தில் ஒப்புமையைக் குறிக்கும் தனிச் சொல் இல்லை; ஆகவே ‘கடவுளாக’ என்பது மூலத்தின் திட்டமிட்ட வலிமையையும் இறையியல் பதற்றத்தையும் காக்கிறது. அதேவேளையில் ‘பார்வோனுக்கு’ என்ற உறவுசார் தொடர் மற்றும் ஆரோன் ‘உன் தீர்க்கதரிசி’ எனப்படுவது, இது மோசே தெய்வீக இயல்பைப் பெற்றார் என்ற கூற்றாக அல்லாமல் பிரதிநிதித்துவ அதிகாரப் பங்காகப் புரிந்துகொள்ளப்படுவதற்கான சூழலை அளிக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவே’ இறைப்பெயரைப் பாதுகாக்கிறது; ‘கடவுளாக’ என்ற மூலத்தின் துணிவான சொல்லமைப்பு முதன்மை உரையில் வைக்கப்பட்டு, அதன் உறவுசார் மற்றும் பிரதிநிதித்துவ நுணுக்கம் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
