  rationale: எபிரெய சிந்தனையில் மனம், சித்தம், உள்ளார்ந்த தீர்மானம் ஆகியவற்றை உள்ளடக்கும் வழக்கமான உருவகச் சொல்.
- source_word: פַּרְעֹה
