  rationale: முன்பு கூறப்பட்ட தெய்வீக வார்த்தைக்கும் நிகழ்ந்ததற்கும் உள்ள பொருத்தத்தை ‘படியே’ இயல்பாகக் காட்டுகிறது.
- source_word: דִּבֶּר
  choice: சொல்லியிருந்த
  rationale: இந்நிகழ்வுக்கு முன்பே யெகோவா கூறியிருந்ததைத் தமிழ் இறந்தகால நிறைவுவடிவம் தெளிவாக்குகிறது.
- source_word: יְהוָה
  choice: யெகோவா
