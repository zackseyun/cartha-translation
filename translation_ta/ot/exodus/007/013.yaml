  text: ஆனால் பார்வோனின் இதயம் கடினமாயிற்று[a]; யாவே சொல்லியிருந்தபடியே, அவன் அவர்களுக்குச் செவிகொடுக்கவில்லை.
  philosophy: optimal-equivalence
