theological_decisions:
- issue: பார்வோனின் இதயம் கடினமானதில் செயலாற்றியவர் யார்?
  choice: ‘பார்வோனின் இதயம் கடினமாயிற்று’ என்று, நிலைமாற்றத்தைக் கூறி செயலாற்றியவரை வெளிப்படையாகக் குறிப்பிடாமல் மொழிபெயர்த்தல்.
  alternative: ‘பார்வோனின் இதயம் கடினப்படுத்தப்பட்டது’ அல்லது ‘பார்வோன் தன் இதயத்தைக் கடினப்படுத்தினான்.’
  rationale: இந்த வசனத்தின் எபிரெய வினை செய்பவரைத் தெளிவாகக் குறிப்பிடவில்லை. ஆகவே கடவுளையோ பார்வோனையோ இங்கே நேரடி agent ஆகச் சேர்க்காமல், யாத்திராகமம் முழுவதிலும் நிலவும் இறையாட்சி–மனிதப் பொறுப்பு சார்ந்த பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘செவிகொடுக்கவில்லை’ என்பது வெறுமனே ஒலி கேட்காததை அல்லாமல் ஏற்றுக்கொள்ளாததையும் உணர்த்துகிறது. வசனத்தில் உள்ள פ பகுதி முடிவைக் குறிக்கும் மசோரா குறியீடு என்பதால் மொழிபெயர்ப்பில் தனியாக வெளிப்படுத்தப்படவில்லை.
