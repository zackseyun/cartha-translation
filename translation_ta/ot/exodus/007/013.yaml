lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: கடினமாயிற்று
  rationale: חזק என்பதன் அடிப்படை உணர்வு ‘வலுவாகுதல்/உறுதியாகுதல்’. இச்சூழலில் அது பார்வோனின் உள்மன எதிர்ப்பைக் குறிக்கும் ‘கடினமாயிற்று’ என்று இயல்பாக மொழிபெயர்க்கப்படுகிறது. எபிரெய வடிவம் செய்பவரை வெளிப்படையாகக் குறிப்பிடாததால், ‘கடினப்படுத்தப்பட்டது’ என்று மறைமுகச் செயப்பாட்டு வடிவில் கூறி ஓர் agent-ஐ உணர்த்துவது தவிர்க்கப்பட்டது.
- source_word: לֵב
