base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/020.yaml
  text: So Moses and Aaron did so[a], just as Yahweh had commanded. And he raised the staff and struck the water that was in the Nile before Pharaoh's eyes and before the eyes of his servants, and all the water that was in the Nile was turned to blood.
translation:
  language: ta
  text: மோசேயும் ஆரோனும் யாவே கட்டளையிட்டபடியே செய்தார்கள். அவர் கோலை உயர்த்தி, பார்வோனின் கண்ணெதிரிலும் அவனுடைய பணியாளர்களின் கண்ணெதிரிலும் நைல் நதியின்[a] தண்ணீரை அடித்தார். நைல் நதியின் தண்ணீர் முழுவதும் இரத்தமாக மாறியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “நதி”; யாத்திராகமத்தில் இச்சொல் பொதுவாக நைல் நதியையே குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: அப்படியே செய்தார்கள்
  rationale: முந்தைய கட்டளைக்கு இணங்கி நடந்ததைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: கட்டளையிட்டபடியே
  rationale: செயல் முன்பு கொடுக்கப்பட்ட கட்டளைக்குத் துல்லியமாக ஏற்ப நடந்தது என்ற ஒப்பீட்டு வலியுறுத்தலைப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய உடன்படிக்கைப் பெயரான நான்கெழுத்துப் பெயரைப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַיָּרֶם
  choice: அவர் ... உயர்த்தி
  rationale: வினை ஒருமையில் இருப்பதைப் பேணுகிறது; இவ்வசனத்திற்குள் அந்த ஒருமை எழுவாய் மோசேயா ஆரோனா என்பதை வெளிப்படையாகத் தீர்மானிக்கவில்லை.
- source_word: בַּמַּטֶּה
  choice: கோலை
  rationale: இக்கதைச்சூழலில் מַטֶּה என்பதற்கான தெளிவான, வழக்கமான தமிழ் சொல்.
- source_word: וַיַּךְ אֶת־הַמַּיִם
  choice: தண்ணீரை அடித்தார்
  rationale: נכה என்பதன் நேரடியான ‘அடி/தாக்கு’ பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַיְאֹר
  choice: நைல் நதி
  rationale: யாத்திராகமத்தில் יְאֹר பொதுவாக நைல் நதியைக் குறிப்பதால் உரையில் குறிப்பிட்ட புவியியல் சுட்டைத் தெளிவாக்குகிறது; சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: பார்வோனின் பார்வையிலும் அவனுடைய பணியாளர்களின் பார்வையிலும்
  rationale: நிகழ்வு இரு தரப்பினருக்கும் வெளிப்படையாக நடந்தது என்பதை வலியுறுத்தும் எபிரெய மறுபடிச் சொல்லைத் தமிழிலும் பேணுகிறது.
- source_word: עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள்
  rationale: அவர்களுடைய குறிப்பிட்ட பதவி அல்லது தரத்தை மூல உரை கூறாததால் ‘அதிகாரிகள்’ என்று குறுக்காமல் பொதுவான பொருளைத் தருகிறது.
- source_word: וַיֵּהָפְכוּ ... לְדָם
  choice: இரத்தமாக மாறியது
  rationale: மாற்றத்தின் விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; செயற்படுத்தியவர் யார் என்று மூல உரையைவிட வெளிப்படையாகச் சேர்ப்பதில்லை.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை பொதுப் பட்டப்பெயரை அல்ல, தெய்வீக உடன்படிக்கைப் பெயரையே பயன்படுத்துகிறது; ‘யாவே’ என்பது அதை நவீனத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: கோலை உயர்த்தி நீரை அடித்த ஒருமை எழுவாயின் அடையாளம்
  choice: ‘அவர்’ என்று மூல உரையின் ஒருமையையும் தெளிவின்மையையும் பேணுதல்
  alternative: ஆரோன் என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: முந்தைய சூழல் ஆரோனைச் சுட்டினாலும், இவ்வசனத்தின் எபிரெய உரை பெயரை மீண்டும் கூறாமல் ஒருமை வினையை மட்டுமே பயன்படுத்துகிறது; ஆகவே பெயரைச் சேர்த்து தெளிவின்மையை நீக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் தொடர் நிகழ்வோட்டமும், ‘பார்வையில்’ என்ற மறுபடியான வலியுறுத்தலும், ஒருமை எழுவாயின் தெளிவின்மையும் இயன்றவரை பேணப்பட்டுள்ளன.
