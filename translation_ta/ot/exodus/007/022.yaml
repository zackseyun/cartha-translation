base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/022.yaml
  text: But the magicians of Egypt did the same by their secret arts[a], and Pharaoh’s heart was hardened, and he did not listen to them[b], just as Yahweh had spoken.
translation:
  language: ta
  text: ஆனால் எகிப்தின் மந்திரவாதிகளும் தங்கள் மறைவான மந்திரக் கலைகளால்[a] அதையே செய்தார்கள். பார்வோனின் இதயம் கடினமடைந்தது[b]; யாவே கூறியிருந்தபடியே, அவன் அவர்களுக்குச் செவிகொடுக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் மந்திர உச்சாடனங்களால்’ அல்லது ‘தங்கள் இரகசிய மந்திரச் செயல்களால்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பார்வோனின் இதயம் வலுவடைந்தது.’ இந்த வசனத்தின் எபிரெய வாசகம், அவனுடைய இதயத்தைக் கடினப்படுத்தியவர் யார் என்பதை வெளிப்படையாகக் கூறவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: அதையே செய்தார்கள்
  rationale: ‘அவ்வாறே செய்தார்கள்’ என்ற நேரடிப் பொருளை இயல்பான தமிழில் தருவதோடு, முந்தைய அடையாளத்தை எகிப்திய மந்திரவாதிகள் பின்பற்றியதைத் தெளிவாக இணைக்கிறது.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: எகிப்தின் மந்திரவாதிகள்
  rationale: சூழலில் பார்வோனின் சடங்கு மற்றும் மந்திர நிபுணர்களைக் குறிக்கிறது; நவீனத் தமிழில் ‘மந்திரவாதிகள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בְּלָטֵיהֶם
  choice: தங்கள் மறைவான மந்திரக் கலைகளால்
  rationale: בְּ என்பதன் கருவிப்பொருளையும், לָטִים குறிக்கும் இரகசியமான அல்லது மறைவான மந்திரச் செயல்முறைகளையும் வெளிப்படுத்துகிறது.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: பார்வோனின் இதயம் கடினமடைந்தது
  rationale: எபிரெய வாக்கியம் கடினப்படுத்திய செயற்பாட்டாளரை வெளிப்படையாகக் குறிப்பிடவில்லை. தமிழ் வினை வடிவம் ஏற்பட்ட நிலையைக் கூறி, அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: அவன் அவர்களுக்குச் செவிகொடுக்கவில்லை
  rationale: שׁמע אֶל என்பதன் ‘கேட்டு ஏற்றுக்கொள்/செவிகொடு’ என்ற பொருளை இயல்பான தமிழில் தருகிறது. சூழலில் ‘அவர்கள்’ மோசேயையும் ஆரோனையும் குறிக்கிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: யெகோவா கூறியிருந்தபடியே
  rationale: முன்னதாகக் கூறப்பட்ட இறைவாக்கைக் குறிப்பதால் நிறைவுற்ற இறந்தகால வடிவம் பயன்படுத்தப்பட்டுள்ளது; יהוה என்ற தனிப்பெயர் ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: பார்வோனின் இதயம் கடினமடைந்ததில் செயற்பாட்டாளர் யார்?
  choice: ‘பார்வோனின் இதயம் கடினமடைந்தது’ என்று, செயற்பாட்டாளரைக் குறிப்பிடாமல் நிலைமாற்றமாக மொழிபெயர்த்தல்.
  alternative: ‘பார்வோன் தன் இதயத்தைக் கடினப்படுத்தினான்’ அல்லது ‘பார்வோனின் இதயம் கடினப்படுத்தப்பட்டது.’
  rationale: இந்த வசனம் கடவுளையோ பார்வோனையோ கடினப்படுத்திய செயற்பாட்டாளராக வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே அருகிலுள்ள வசனங்களிலிருந்து ஒரு இறையியல் முடிவை இங்கு திணிக்காமல் மூலத்தின் பதற்றமும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதயம்’ என்பது இங்கு உள்ளார்ந்த மனப்பாங்கு அல்லது மனவுறுதியைக் குறிக்கும் வேதாகம உருவகமாகத் தக்கவைக்கப்பட்டுள்ளது; ‘அவர்கள்’ என்பதன் முன்னிலைச் சுட்டு சூழலில் மோசே மற்றும் ஆரோன்.
