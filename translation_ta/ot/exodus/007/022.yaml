    issue: The divine name is rendered ‘யெகோவா’ instead of the project’s required rendering of יהוה as Yahweh.
    rationale: The source reads יהוה, and the supplied English POB audit trail explicitly establishes ‘Yahweh’ as the project rendering. ‘யெகோவா’ represents the distinct traditional form Jehovah and does not conform to that decision.
