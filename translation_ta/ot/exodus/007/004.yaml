base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/004.yaml
  text: Pharaoh will not listen to you[a], and I will lay my hand on Egypt and bring out my hosts—my people[c][b], the sons of Israel—from the land of Egypt with great judgments.
translation:
  language: ta
  text: பார்வோன் உங்களுக்குச் செவிகொடுக்கமாட்டான். நான் எகிப்தின்மேல் என் கையை வைத்து, என் அணிகளாகிய[a] என் மக்களான இஸ்ரவேல் மக்களை[b] மாபெரும் தீர்ப்புகளால்[c] எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவருவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் சேனைகளாகிய” அல்லது “என் படைகளாகிய.” எபிரெயச் சொல் ஒழுங்கமைந்த குழுக்கள் அல்லது அணிகளைக் குறிக்கும்; அதற்கு இராணுவச் சாயலும் இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “என் மக்கள், இஸ்ரவேலின் மகன்கள்.” இச்சொற்றொடர் இங்கு இஸ்ரவேல் மக்களைக் குறிக்கும் நிலையான இனப்பெயர்.
    reason: literal_rendering
  - marker: c
    text: அல்லது, “மாபெரும் நீதித்தீர்ப்புகளோடு.” இவை எகிப்துக்கு எதிராகக் கடவுள் நிறைவேற்றும் தீர்ப்புச் செயல்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע אֲלֵכֶם
  choice: உங்களுக்குச் செவிகொடுக்கமாட்டான்
  rationale: שׁמע உடன் אֶל என்பது ‘ஒருவருக்குச் செவிகொடு/அவர் சொல்வதைக் கேள்’ என்ற பொருளைத் தருகிறது. கீழ்ப்படிதல் உட்பொருளாக இருந்தாலும், அதை வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
- source_word: וְנָתַתִּי אֶת יָדִי בְּמִצְרַיִם
  choice: நான் எகிப்தின்மேல் என் கையை வைத்து
  rationale: ‘என் கையை வைப்பேன்’ என்ற எபிரெயச் சொற்றொடர் கடவுளின் தீர்ப்புக்குரிய வல்லமையான தலையீட்டைக் குறிக்கிறது. மூலத்தில் இல்லாத ‘நீட்டுவேன்’ என்பதைச் சேர்க்காமல் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: צִבְאֹתַי
  choice: என் படைப்பிரிவுகள்
  rationale: צָבָא ஒழுங்கமைந்த அணிகள், படைகள் அல்லது சேனைகளைக் குறிக்கலாம். இங்கு இஸ்ரவேல் ஒழுங்கமைந்த குழுக்களாகப் புறப்படுவதையும் இராணுவச் சாயலையும் ‘படைப்பிரிவுகள்’ தக்கவைக்கிறது.
- source_word: עַמִּי בְנֵי יִשְׂרָאֵל
  choice: என் மக்களான இஸ்ரவேல் மக்கள்
  rationale: தமிழில் இயல்பாகப் புரியும் நிலையான இனக்குழுப் பெயராக ‘இஸ்ரவேல் மக்கள்’ பயன்படுத்தப்பட்டுள்ளது; ‘என் மக்கள்’ என்ற இணைவிளக்க அமைப்பும் தக்கவைக்கப்பட்டுள்ளது. சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בִּשְׁפָטִים גְּדֹלִים
  choice: மாபெரும் நீதித்தீர்ப்புகள் மூலம்
  rationale: שְׁפָטִים என்பது கடவுள் நிறைவேற்றும் தீர்ப்புச் செயல்களைக் குறிக்கிறது. பன்மையையும் நீதித்துறை சார்ந்த நுண்பொருளையும் இந்த மொழிபெயர்ப்பு பாதுகாக்கிறது.
theological_decisions:
- issue: צִבְאֹתַי என்பதில் இஸ்ரவேலுக்கான படை/ஒழுங்கமைந்த அணிகள் உருவகம்
  choice: என் படைப்பிரிவுகள்
  alternative: என் சேனைகள் / என் அணிகள்
  rationale: மக்கள் ஒழுங்கமைந்த கூட்டங்களாக யெகோவாவின் அதிகாரத்தின்கீழ் வெளியேறுவதை இது காட்டுகிறது. ‘சேனைகள்’ என்பதைக் காட்டிலும் சற்றுக் குறைவான போர்ச் சாயலுடன், மூலத்தின் கூட்டமைப்பு மற்றும் இராணுவத் தொடர்பு இரண்டையும் காக்கிறது.
- issue: בְנֵי יִשְׂרָאֵל என்ற உடன்படிக்கை மக்களின் பெயர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது யாக்கோபின் நேரடி ஆண் பிள்ளைகளை மட்டும் அல்லாமல் இஸ்ரவேல் இனத்தார் அனைவரையும் குறிக்கும் நிலையான பெயர். இயல்பான தமிழை முதன்மை உரையில் பயன்படுத்தி, நேரடி வடிவத்தை அடிக்குறிப்பில் வைத்துள்ளது.
- issue: בִּשְׁפָטִים גְּדֹלִים என்பதன் கருவி/சூழ்நிலைப் பொருள்
  choice: மாபெரும் நீதித்தீர்ப்புகள் மூலம்
  alternative: மாபெரும் நீதித்தீர்ப்புகளோடு
  rationale: בְ முன்னொட்டு இங்கு வெளியே கொண்டுவரும் செயல் தீர்ப்புச் செயல்களின் மூலமாக நிகழ்வதைச் சுட்டலாம். ‘மூலம்’ அந்த உறவைத் தெளிவாக்குகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘செவிகொடு,’ ‘என் கையை வை,’ ‘நீதித்தீர்ப்புகள்’ ஆகியவை மூல உருவகங்களையும் நீதிசார் மொழியையும் பாதுகாக்கின்றன; அரிதான அல்லது மிகப் பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
