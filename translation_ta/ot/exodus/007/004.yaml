revisions:
- from: பார்வோன் உங்களுக்குச் செவிகொடுக்கமாட்டான். அப்போது நான் எகிப்தின்மேல் என் கையை வைத்து, என் படைப்பிரிவுகளாகிய[a] என் மக்களான இஸ்ரவேல் மக்களை[b] மாபெரும் நீதித்தீர்ப்புகள் மூலம்[c] எகிப்து நாட்டிலிருந்து வெளியே அழைத்துவருவேன்.
  to: பார்வோன் உங்களுக்குச் செவிகொடுக்கமாட்டான். நான் எகிப்தின்மேல் என் கையை வைத்து, என் அணிகளாகிய[a] என் மக்களான இஸ்ரவேல் மக்களை[b] மாபெரும் தீர்ப்புகளால்[c] எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவருவேன்.
  rationale: The revision removes an unrequired temporal addition, uses a broader and more source-proportionate rendering for צִבְאֹתַי, improves the Tamil apposition, and renders the exodus action more directly. It retains the judicial plural and instrumental relation of בִּשְׁפָטִים גְּדֹלִים, with alternatives documented in anchored footnotes.
