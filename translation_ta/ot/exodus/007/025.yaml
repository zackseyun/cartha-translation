source:
  edition: WLC
  text: וַ/יִּמָּלֵ֖א שִׁבְעַ֣ת יָמִ֑ים אַחֲרֵ֥י הַכּוֹת יְהוָ֖ה אֶת הַ/יְאֹֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/025.yaml
  text: And seven days were fulfilled after Yahweh struck the Nile[a][b].
translation:
  language: ta
  text: யாவே நைல் நதியை[b] தாக்கிய பிறகு, ஏழு நாட்கள் நிறைவடைந்தன[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே நைல் நதியைத் தாக்கிய பிறகு ஏழு நாட்கள் கடந்தன.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “நைல்”; சில இடங்களில் இது பொதுவாக “ஆறு” என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵא
  choice: நிறைவடைந்தன
  rationale: காலப்பகுதி முழுமையடைந்ததைச் சுட்டும் நிஃபால் வினைவடிவத்தின் முடிவுற்ற நிலையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘கடந்தன’ என்பதும் பொருத்தமான சொல்லாக்கம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: எண்ணும் பெயர்ச்சொல்லும் சேர்ந்த நேரடியான சொற்றொடர்; ஏழு நாள் காலப்பகுதியைக் குறிக்கிறது.
- source_word: אַחֲרֵי
  choice: பிறகு
  rationale: ஒரு நிகழ்வைத் தொடர்ந்து வரும் காலத்தைத் தெளிவாகக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: הַכּוֹת
  choice: தாக்கிய
  rationale: נכה என்ற வேர்ச்சொல்லின் infinitive construct வடிவம் இங்கு யாவே நைலைத் தாக்கிய செயலைக் குறிக்கிறது. ‘தாக்கிய பிறகு’ என்பது மூலத்தின் பொருளைத் தக்கவைக்கும் இயல்பான தமிழாக்கம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றாக இடாமல், எபிரெயத் திருமறையில் உள்ள தனிப்பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: הַיְאֹר
  choice: நைல் நதி
  rationale: யְאֹר என்பது யாத்திராகமச் சூழலில் பொதுவாக எகிப்தின் நைல் நதியையே குறிக்கிறது. தமிழில் இடப்பெயரின் வகையைத் தெளிவுபடுத்த ‘நைல் நதி’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. பட்டப்பெயரான ‘கர்த்தர்’ என்று மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது அந்தத் தனிப்பெயரைப் பாதுகாக்கிறது; ‘யெகோவா’ என்பது பிற்கால மரபு உச்சரிப்பு.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூலத்தின் காலநிறைவு கருத்தைப் பாதுகாக்க ‘நிறைவடைந்தன’ பயன்படுத்தப்பட்டுள்ளது; இயல்பான மாற்றுச் சொல்லாக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
