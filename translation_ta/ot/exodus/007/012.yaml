  register: நவீனத் தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் பகிர்நிலை அமைப்பும், תַּנִּין என்ற சொல்லின் பொருள் விரிவும் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளன.
