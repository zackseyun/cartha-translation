source:
  edition: WLC
  text: וַ/יַּשְׁלִ֨יכוּ֙ אִ֣ישׁ מַטֵּ֔/הוּ וַ/יִּהְי֖וּ לְ/תַנִּינִ֑ם וַ/יִּבְלַ֥ע מַטֵּֽה אַהֲרֹ֖ן אֶת מַטֹּתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/012.yaml
  text: And each man threw down his staff[a], and they became serpents; but Aaron’s staff swallowed up their staffs.
translation:
  language: ta
  text: ஒவ்வொருவனும் தன் கோலைக் கீழே எறிந்தான்; அவை பாம்புகளாக[a] மாறின. ஆனால் ஆரோனின் கோல் அவர்களுடைய கோல்களை விழுங்கியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “டிராகன்களாக” அல்லது “பெரிய ஊர்வனங்களாக.” இங்குள்ள எபிரெயச் சொல், வழக்கமாக ‘பாம்பு’ என்பதற்குப் பயன்படுத்தப்படும் சொல்லைவிட விரிந்த பொருளுடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלִיכוּ
  choice: கீழே எறிந்தான்
  rationale: שׁלך என்பது இச்சூழலில் ஒரு பொருளைக் கீழே எறிவதைக் குறிக்கிறது. எபிரெய மொழியின் பன்மை வினை, பகிர்நிலை אִישׁ என்பதுடன் தமிழில் இயல்பாக ஒருமையில் தரப்பட்டுள்ளது.
- source_word: אִישׁ
  choice: ஒவ்வொருவனும்
  rationale: இங்கு אִישׁ பகிர்நிலைப் பொருளில் வந்து, ஒவ்வொருவரும் தத்தமது கோலை எறிந்ததைக் காட்டுகிறது.
- source_word: מַטֵּהוּ / מַטֵּה / מַטֹּתָם
  choice: தன் கோல் / கோல் / அவர்களுடைய கோல்கள்
  rationale: מַטֶּה என்பதற்கு கோல் அல்லது தடி என்று பொருள் கொள்ளலாம். இக்கதைக் காட்சியில் 'கோல்' இயல்பாகவும் தெளிவாகவும் உள்ளது; ஒருமை, பன்மை வேறுபாடுகளும் காக்கப்பட்டுள்ளன.
- source_word: וַיִּהְיוּ
  choice: மாறின
  rationale: היה இங்கு ஏற்பட்ட உருமாற்றத்தின் விளைவைக் குறிக்கிறது. 'மாறின' என்பது தமிழில் சுருக்கமாகவும் இயல்பாகவும் அதைக் கூறுகிறது.
- source_word: לְתַנִּינִם
  choice: பெரும் பாம்புகளாக
  rationale: תַּנִּין என்பது சாதாரண 'பாம்பு' என்பதைக் காட்டிலும் விரிந்த பொருள் வரம்புடையது; பாம்பு போன்ற பெரிய ஊர்வன அல்லது அரக்கப்பாம்பையும் குறிக்கலாம். இச்சூழலில் 'பெரும் பாம்புகள்' தெளிவையும் மூலச்சொல்லின் விரிவையும் சமநிலைப்படுத்துகிறது.
- source_word: וַיִּבְלַע
  choice: விழுங்கியது
  rationale: בלע என்பது விழுங்குதல் அல்லது முழுவதுமாக உட்கொள்ளுதல் என்பதைக் குறிக்கிறது. 'விழுங்கியது' தமிழில் நேரடியான, இயல்பான சொல்லாகும்.
- source_word: אֶת
  choice: '[நேரடிச் செயப்படுபொருள் குறியீடு; தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: אֶת என்பது எபிரெய மொழியில் வரையறுக்கப்பட்ட நேரடிச் செயப்படுபொருளைக் குறிக்கிறது; தமிழில் அதற்குத் தனிச் சொல் தேவையில்லை.
