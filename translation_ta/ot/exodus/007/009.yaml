base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/009.yaml
  text: When Pharaoh speaks to you[a], saying, ‘Produce a sign for yourselves,’ then you shall say to Aaron, ‘Take your staff and throw it down before Pharaoh; let it become a serpent.’
translation:
  language: ta
  text: பார்வோன் உங்களிடம், “உங்களுக்கென ஓர் அடையாளத்தை நிகழ்த்திக் காட்டுங்கள்” என்று சொல்லும்போது, நீ ஆரோனிடம், “உன் கோலை எடுத்து, பார்வோனுக்கு முன்பாக அதை எறிந்துவிடு; அது ஒரு பாம்பாக[a] மாறட்டும்” என்று சொல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லான תַנִּין, சூழலுக்கேற்ப பாம்பு, கடல்வாழ் பெரிய உயிரினம், அல்லது டிராகன் போன்ற உயிரினத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: சொல்லும்போது
  rationale: இங்கு எதிர்காலத்தில் நிகழக்கூடிய சூழலை அறிமுகப்படுத்துவதால், காரணப்பொருளைவிட காலப்பொருள் இயல்பாக உள்ளது.
- source_word: אֲלֵיכֶם
  choice: உங்களிடம்
  rationale: எபிரெய உரையில் உள்ள பன்மை இரண்டாம் நபரைத் தெளிவாகப் பாதுகாக்கிறது; பார்வோன் மோசேயையும் ஆரோனையும் நோக்கிப் பேசுகிறான்.
- source_word: מוֹפֵת
  choice: அடையாளம்
  rationale: அதிசயமான அல்லது வல்லமையை வெளிப்படுத்தும் சான்றுச் செயலைக் குறிக்கிறது; இச்சூழலில் ‘அடையாளம்’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: תְּנוּ לָכֶם
  choice: உங்களுக்கென … நிகழ்த்திக் காட்டுங்கள்
  rationale: சொல்லுக்குச் சொல் ‘உங்களுக்காகக் கொடுங்கள்’ என்பது தமிழில் இயல்பாக இல்லை. பார்வோன் கேட்கும் நிரூபணச் செயலை வெளிப்படுத்துவதோடு, לָכֶם என்பதன் தற்சார்பு நுணுக்கத்தையும் ‘உங்களுக்கென’ தக்கவைக்கிறது.
- source_word: מַטְּךָ
  choice: உன் கோல்
  rationale: מַטֶּה என்பது கையில் ஏந்தும் கோல் அல்லது தடியைக் குறிக்கும்; இங்கு ‘கோல்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: וְהַשְׁלֵךְ
  choice: எறிந்துவிடு
  rationale: கோலைப் பார்வோனுக்கு முன்பாக எறியும் கட்டளையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: יְהִי
  choice: ஆகட்டும்
  rationale: எபிரெய இசைவுக் கட்டளையின் நோக்கமுள்ள விளைவைக் காக்கிறது; அதை வெறும் எதிர்காலக் கூற்றாக மாற்றவில்லை.
- source_word: תַנִּין
  choice: பெரிய பாம்பு
  rationale: இந்தச் சொல் சாதாரண பாம்பைவிட விரிந்த பொருள் வரம்புடையது; பெரிய ஊர்வன, கடல்வாழ் பேருயிர் அல்லது அரக்கப் பாம்பு போன்ற உயிரினத்தையும் குறிக்கலாம். கோல் உருமாறும் இக்கதைக்குச் ‘பெரிய பாம்பு’ பொருத்தமாக இருப்பதோடு, சொல்லின் விரிவையும் ஓரளவு காட்டுகிறது.
theological_decisions:
- issue: கோல் மாறும் உயிரினத்தைக் குறிக்கும் תַנִּין சொல்லின் பொருள்
  choice: பெரிய பாம்பு
  alternative: அரக்கப் பாம்பு; கடல்வாழ் பெரிய உயிரினம்
  rationale: இச்சூழல் பாம்புபோன்ற உயிரினத்தைச் சுட்டுகிறது; எனினும் תַנִּין என்பது נָחָשׁ என்பதைக் காட்டிலும் விரிந்த பொருள் கொண்டது. ஆகவே முதன்மை உரையில் சூழலுக்கு ஏற்ற வாசகம் பயன்படுத்தப்பட்டு, உண்மையான சொற்பொருள் விரிவு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியான பேச்சையும் கட்டளைத் தொடரையும் தெளிவாக வைத்துள்ளோம். பார்வோனின் உரையில் பன்மை ‘உங்கள்’ என்றும், மோசேயிடம் கூறப்படும் கட்டளையில் ஒருமை ‘நீ/உன்’ என்றும் மூல மொழியின் ஆள்-எண் வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
