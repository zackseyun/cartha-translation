base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/010.yaml
  text: So Moses and Aaron went in to Pharaoh[a], and they did so, just as Yahweh had commanded. Then Aaron threw down his staff before Pharaoh and before his servants, and it became a serpent.
translation:
  language: ta
  text: அப்போது மோசேயும் ஆரோனும் பார்வோனிடம் சென்று, யாவே கட்டளையிட்டபடியே செய்தார்கள். பின்னர் ஆரோன் தன் கோலைப் பார்வோனுக்கு முன்பாகவும் அவனுடைய பணியாளர்களுக்கு முன்பாகவும் எறிந்தான்; அது பாம்பாக[a] மாறியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் தன்னீன் என்பது நாகம் போன்ற உயிரினத்தையோ பெரிய ஊர்வனையோ குறிக்கவும் முடியும்; இங்கு பார்வோனுக்கு முன்பாக நிகழ்த்தப்பட்ட இந்த அடையாளத்தில் அது பாம்பைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: சென்று
  rationale: வினைச்சொல் எபிரெயத்தில் ஒருமையாக இருந்தாலும், தொடர்ந்து வரும் ‘மோசேயும் ஆரோனும்’ என்ற கூட்டெழுவாயைச் சார்ந்து கூட்டுப்பொருளில் செயல்படுகிறது. பார்வோனின் முன்னிலைக்குச் சென்ற இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיַּעַשׂוּ כֵן
  choice: செய்தார்கள்
  rationale: முன்னர் கொடுக்கப்பட்ட கட்டளையை அவர்கள் நிறைவேற்றினார்கள் என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: கட்டளையிட்டபடியே
  rationale: முந்தைய கட்டளைக்கு அவர்கள் துல்லியமாக இணங்கிச் செய்ததைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமமான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: וַיַּשְׁלֵךְ
  choice: எறிந்தான்
  rationale: கோலைப் பார்வோனுக்கு முன்பாக வீசிய செயலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מַטֵּהוּ
  choice: தன் கோலை
  rationale: மַטֶּה என்பது கையில் ஏந்தும் கோலைக் குறிக்கிறது; உடைமைப் பின்னொட்டைத் தமிழில் இயல்பான தற்பொருள் சுட்டான ‘தன்’ மூலம் தருகிறது.
- source_word: לִפְנֵי ... וְלִפְנֵי
  choice: முன்பாகவும் ... முன்பாகவும்
  rationale: பார்வோனும் அவனுடைய பணியாளர்களும் காணும்படி இந்த அடையாளம் நிகழ்ந்தது என்ற எபிரெய மறுமொழி வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள்
  rationale: இச்சொல் ஊழியர்கள், பணியாளர்கள் அல்லது அரசவையினரைச் சுட்டலாம். அரசவைக் சூழலை மறுக்காமல், மூலச்சொல்லின் பொதுவான பொருளையும் காக்கிறது.
- source_word: וַיְהִי לְתַנִּין
  choice: அது ஒரு பெரும் பாம்பாக மாறியது
  rationale: תַּנִּין சாதாரண பாம்பைவிட விரிந்த பொருள்வட்டம் கொண்டது; ‘பெரும் பாம்பு’ அடையாளக் காட்சியில் இயல்பாக இருந்து, அந்த விரிந்த நுண்ணுணர்வையும் ஓரளவு காக்கிறது. பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலவசனம் தனிப்பட்ட இறைநாமத்தையே பயன்படுத்துகிறது. ஆகவே அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, உடன்படிக்கையின் பெயராக உள்ள தன்மையைப் பாதுகாக்கிறது.
- issue: תַנִּין என்பதன் பொருள்
  choice: பெரும் பாம்பு
  alternative: பாம்பு; அரக்கப் பாம்பு; பெரிய ஊர்வன
  rationale: இச்சொல் பாம்பு, பெரிய ஊர்வன அல்லது அரக்கப் பாம்பு போன்ற உயிரினத்தைக் குறிக்கக்கூடியது. இங்கு கோல் உயிரினமாக மாறும் அடையாளத்தில் ‘பெரும் பாம்பு’ இயல்பான வாசிப்பைத் தருகிறது; இருப்பினும் மூலத்தின் பொருள் விரிவை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் இருமுறை வரும் ‘முன்பாக’ என்பது வலியுறுத்தலுக்காகத் தக்கவைக்கப்பட்டுள்ளது; தன்னீன் என்ற சொல்லின் உண்மையான பொருள் விரிவு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
