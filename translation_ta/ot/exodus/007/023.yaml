  text: Pharaoh turned and went into his house[a], and he did not take even this to heart.
translation:
  language: ta
  text: பார்வோன் திரும்பித் தன் வீட்டுக்குள் சென்றான்; இதைக்கூட அவன் மனத்தில் கொள்ளவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதற்கும் தன் இருதயத்தைச் செலுத்தவில்லை,” அல்லது “இதைக்கூட அவன் பொருட்படுத்தவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  choice: திரும்பி
  rationale: פנה என்பது திரும்புதல் அல்லது விலகித் திரும்புதல் என்ற பொருளைக் கொண்டது. அடுத்துவரும் ‘சென்றான்’ என்பதுடன் இயல்பாக இணையும் ‘திரும்பி’ என்பது திசையை மிகையாக விளக்காமல் நிகழ்வின் நகர்வைப் பாதுகாக்கிறது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: யாத்திராகமத்தில் எகிப்திய அரசரைக் குறிக்கும் மரபான, பொதுவாக அறியப்பட்ட தமிழ் வடிவம்.
- source_word: וַיָּבֹא אֶל בֵּיתוֹ
  choice: தன் வீட்டுக்குள் சென்றான்
  rationale: בוא உடன் אֶל வருவது ஓர் இடத்தை நோக்கி அல்லது அதற்குள் செல்லுதலைக் குறிக்கிறது. இச்சூழலில் அவர் தமது இல்லத்திற்குள் நுழைந்ததை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְלֹא שָׁת לִבּוֹ
  choice: அவன் மனத்தில் கொள்ளவில்லை
  rationale: ‘தன் இருதயத்தை வைக்கவில்லை’ என்ற எபிரெயச் சொற்றொடர் கவனமாக எடுத்துக்கொள்ளாமையையோ பொருட்படுத்தாமையையோ குறிக்கிறது. ‘மனத்தில் கொள்ளவில்லை’ என்பது உள்ளார்ந்த கவனத்தைச் சுட்டிக்காட்டுவதோடு நவீன தமிழிலும் இயல்பாக உள்ளது.
- source_word: גַּם לָזֹאת
  choice: இதைக்கூட
  rationale: גַּם இங்கு ‘இதையும்’ அல்லது வலியுறுத்தலுடன் ‘இதைக்கூட’ என்ற பொருளைத் தருகிறது. தற்போதைய அடையாளம் அல்லது தண்டனையைக்கூட பார்வோன் பொருட்படுத்தவில்லை என்பதைக் காட்ட ‘இதைக்கூட’ தேர்ந்தெடுக்கப்பட்டது.
