source:
  edition: WLC
  text: וְ/יָדְע֤וּ מִצְרַ֨יִם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בִּ/נְטֹתִ֥/י אֶת יָדִ֖/י עַל מִצְרָ֑יִם וְ/הוֹצֵאתִ֥י אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מִ/תּוֹכָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/005.yaml
  text: And the Egyptians will know that I am Yahweh when I stretch out my hand against Egypt and bring the sons of Israel out from among them[a][b].
translation:
  language: ta
  text: நான் எகிப்துக்கு எதிராக என் கையை நீட்டி, இஸ்ரவேலின் மகன்களை[b] அவர்களுடைய நடுவிலிருந்து வெளியே கொண்டுவரும்போது, நான் யாவே[a] என்பதை எகிப்தியர்கள் அறிந்துகொள்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் இறைப்பெயர் יהוה (YHWH); இங்கு ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘இஸ்ரவேலர்’ அல்லது ‘இஸ்ரவேலின் பிள்ளைகள்.’ எபிரேயத்தில் ‘இஸ்ரவேலின் மகன்கள்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: அறிந்துகொள்வார்கள்
  rationale: வரவிருக்கும் இறைச்செயல்களின் மூலம் எகிப்தியர்கள் உணர்ந்து அறியப்போவதை, இச்சூழலில் எதிர்கால வினையாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִצְרַיִם
  choice: எகிப்தியர்கள்
  rationale: பன்மை வினைக்கு எழுவாயாக இங்கு நாட்டை அல்ல, எகிப்தின் மக்களைக் குறிக்கிறது.
- source_word: כִּי
  choice: என்பதை
  rationale: எகிப்தியர்கள் அறிந்துகொள்ளும் செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரேய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் தருகிறது; மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- source_word: בִּנְטֹתִי
  choice: நான் ... நீட்டி ... கொண்டுவரும்போது
  rationale: בְּ + வினையெச்சப் பெயர் இங்கு காலப்பொருள் தருவதால், தொடரிலுள்ள இரு இறைச்செயல்களையும் உள்ளடக்கும் இயல்பான தமிழ் காலத்தொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יָדִי
  choice: என் கையை
  rationale: வல்லமையை உணர்த்தும் உருவகமாக இருந்தாலும், மூலத்தில் உள்ள தெளிவான உடல் உருவகத்தை அப்படியே காக்கிறது.
- source_word: עַל מִצְרָיִם
  choice: எகிப்துக்கு எதிராக
  rationale: நியாயத்தீர்ப்புச் சூழலில் עַל என்பதன் எதிர்ப்புப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; இங்கு மִצְרַיִם நாட்டைக் குறிக்கிறது.
- source_word: וְהוֹצֵאתִי
  choice: வெளியே கொண்டுவரும்போது
  rationale: יצא என்பதன் ஹிஃபில் காரணவினைப் பொருளான ‘வெளியே வரச் செய்தல்/கொண்டுவருதல்’ என்பதைக் காக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களை
  rationale: בְּנֵי என்பதன் குடும்ப உறவுசார் சொல்லாட்சியை ‘மக்கள்’ என்ற இயல்பான, பாலினப் பொருளையும் தக்கவைக்கும் தமிழ்ச்சொல்லால் தருகிறது; ‘இஸ்ரவேலர்’ என்பதைக் காட்டிலும் மூல அமைப்பை தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִתּוֹכָם
  choice: அவர்கள் நடுவிலிருந்து
  rationale: எகிப்தியர்களின் மத்தியிலிருந்து பிரித்து வெளியே கொண்டுவருதலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலம் பட்டத்தை அல்ல, நான்கு மெய்யெழுத்துகளைக் கொண்ட இறைத்தனிப்பெயரைப் பயன்படுத்துகிறது. தமிழில் நன்கு அறியப்படும் ‘யெகோவா’ வடிவம் அந்தத் தனிப்பெயரைப் பாதுகாக்கிறது; எபிரேய உச்சரிப்பு உறுதியாக அறியப்படாததால் மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற சொற்றொடர்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலர்; இஸ்ரவேலின் பிள்ளைகள்
  rationale: ‘மக்கள்’ என்பது மகன்கள்/வம்சத்தார் என்ற மூல குடும்பச் சொல்லாட்சியுடன் தொடர்பைத் தக்கவைத்தபடியே, இக்கூட்டத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழாக உள்ளது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். ‘கையை நீட்டி’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது. தமிழில் ‘மக்கள்’ என்பது இங்கு பிள்ளைகள்/வம்சத்தார் என்னும் குடும்ப உறவையும் கூட்டத்தையும் இயல்பாகக் குறிக்கிறது.
