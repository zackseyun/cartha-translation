base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/002.yaml
  text: You shall speak all that I command you[a], and Aaron your brother shall speak to Pharaoh, that he may send the sons of Israel out from his land.
translation:
  language: ta
  text: நான் உனக்குக் கட்டளையிடுகிற அனைத்தையும் நீ பேச வேண்டும். உன் சகோதரன் ஆரோன் பார்வோனிடம் பேச வேண்டும்; அப்போது பார்வோன் இஸ்ரவேல் மக்களை[a] தன் நாட்டிலிருந்து அனுப்பிவிடுவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “இஸ்ரவேலின் மகன்கள்”; மரபாக, “இஸ்ரவேலின் பிள்ளைகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְדַבֵּר
  choice: பேச வேண்டும்
  rationale: பியேல் வடிவம் இங்கு நேரடியாக ‘பேசுதல்’ என்பதைக் குறிக்கிறது. சூழலில் உள்ள கட்டளை வலிமையை இயல்பான நவீன தமிழில் ‘வேண்டும்’ வெளிப்படுத்துகிறது.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּךָּ
  choice: நான் உனக்குக் கட்டளையிடுகிற அனைத்தையும்
  rationale: முழுமையையும் தொடரும் இறைக்கட்டளையையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; எபிரெய வினையின் காலநுட்பத்தை தேவையின்றி எதிர்காலமாக மட்டும் கட்டுப்படுத்தவில்லை.
- source_word: אַהֲרֹן אָחִיךָ
  choice: உன் சகோதரன் ஆரோன்
  rationale: தமிழில் இயல்பான சொல் வரிசையைப் பயன்படுத்தி உறவையும் பெயரையும் தெளிவாகக் காக்கிறது.
- source_word: יְדַבֵּר אֶל פַּרְעֹה
  choice: பார்வோனிடம் பேச வேண்டும்
  rationale: דבר உடன் வரும் אֶל என்பதன் நேரடியான பொருளைத் தருகிறது; சொல்லப்படும் செய்தியின் உள்ளடக்கத்தை மொழிபெயர்ப்பே நிர்ணயிக்கவில்லை.
- source_word: וְשִׁלַּח
  choice: அப்போது அவன் … அனுப்பிவிடுவான்
  rationale: வாவ் இணைப்புடன் வந்துள்ள வினையை தொடர்ச்சியான விளைவாக எடுத்துக்கொள்கிறது. ‘அப்போது’ பேச்சுக்குப் பின்வரும் விளைவை இயல்பாகக் காட்டுகிறது; ‘அவன்’ என்ற பதிலிப்பெயர் மூலத்தின் வடிவத்தைப் பேணுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது இஸ்ரவேலரைக் குறிக்கும் வழக்குச் சொற்றொடர். நவீன தமிழில் பாலினத்தையும் வயதையும் தவறாகக் குறிக்காமல் இயல்பாகப் புரிய ‘இஸ்ரவேல் மக்கள்’ எனத் தரப்பட்டு, நேரடி வடிவம் அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
- source_word: מֵאַרְצוֹ
  choice: தன் நாட்டிலிருந்து
  rationale: מִן குறிக்கும் வெளியேற்றம் அல்லது விலகிச் செல்லுதலை ‘இலிருந்து’ தெளிவாகக் காட்டுகிறது; ‘தன்’ அருகிலுள்ள பார்வோனைச் சார்ந்த நிலத்தைக் குறிக்கிறது.
theological_decisions:
- issue: וְשִׁלַּח என்பது நோக்கமா, விளைவா, அல்லது எளிய தொடர்ச்சியா
  choice: பேச்சுக்குப் பின்வரும் விளைவாக ‘அப்போது அவன் … அனுப்பிவிடுவான்’
  alternative: ‘அவன் … அனுப்பிவிடும்படி’ அல்லது ‘அவன் … அனுப்பிவிடலாம்’
  rationale: எபிரெய இணைப்பும் வினை வடிவமும் எளிய தொடர்ச்சி அல்லது எதிர்பார்க்கப்படும் விளைவை அனுமதிக்கின்றன. தமிழில் நோக்கக் கட்டமைப்பு மட்டும் பயன்படுத்தினால் மூலத்தில் வெளிப்படையாக இல்லாத நோக்க உறவை உறுதிப்படுத்தக்கூடும்; எனவே தொடர்ச்சி/விளைவு வாசிப்பு தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கட்டளையின் வலிமையை ‘வேண்டும்’ காக்கிறது; தேவையற்ற பழமையான வடிவங்கள் தவிர்க்கப்பட்டுள்ளன.
