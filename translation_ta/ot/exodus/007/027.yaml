  source_fidelity: மூலத்தின் நிபந்தனை, வேண்டுமென்றே மறுத்தல், விடுதலை செய்தல், எச்சரிக்கைத் துகள், தவளைகளைத் தாக்குதலின் கருவியாகக் கூறுதல் ஆகியவை சரியாக உள்ளன. ஆயினும், גְּבוּלְךָ என்பதற்கு ‘ஆட்சிப்பகுதி’ என்பது நிர்வாகப் பிரிவு என்ற தேவையற்ற நுணுக்கத்தைத் தருகிறது; இச்சூழலில் ‘உன் நாடு முழுவதையும்’ என்பது முழு ஆளுகைப் பரப்பைக் குறிக்கும் இயல்பான, போதுமான இணைச்சொல். வெளிப்படையான ‘நான்’ மூலத்தின் אָנֹכִי-யைத் தமிழில் தெளிவாகப் பிரதிபலிக்கிறது.
