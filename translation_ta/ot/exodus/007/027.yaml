  text: But if you refuse to let them go[a], behold, I will strike all your territory with frogs.
translation:
  language: ta
  text: ஆனால், அவர்களைப் போகவிட நீ மறுத்தால், இதோ, நான் உன் நாடு முழுவதையும் தவளைகளால் தாக்கப்போகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, “மேலும், அவர்களைப் போகவிட நீ மறுத்தால், இதோ, நான் உன் நாடு முழுவதையும் தவளைகளால் தாக்குவேன்.” எபிரெயப் பெயரெச்ச வினைவடிவத்தை நெருங்கிவரும் செயலாக (“தாக்கப்போகிறேன்”) அல்லது எளிய எதிர்காலமாக (“தாக்குவேன்”) மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... மறுத்தால்
  rationale: முந்தைய கோரிக்கைக்கு மாறான நிபந்தனையை அறிமுகப்படுத்துவதால், சூழலில் உள்ள எதிர்மறைத் தொடர்பை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מָאֵן
  choice: மறுத்தால்
  rationale: இது இயலாமையை அல்ல, வேண்டுமென்றே இணங்க மறுப்பதைக் குறிக்கிறது.
- source_word: לְשַׁלֵּחַ
  choice: அவர்களைப் போகவிட
  rationale: யாத்திராகமச் சூழலில் இஸ்ரவேலரைத் தடுத்து வைத்திருப்பதிலிருந்து விடுவிப்பதைக் குறிக்கும் இயல்பான தமிழ் சொல்லாட்சி.
- source_word: הִנֵּה
  choice: இதோ
  rationale: வரவிருக்கும் தண்டனையின்மீது கவனத்தைத் திருப்பி, எச்சரிக்கையின் உடனடித் தன்மையையும் கண்ணியமான தொனியையும் காக்கிறது.
- source_word: אָנֹכִי
  choice: தாக்கப்போகிறேன் என்பதில் வெளிப்படும் முதல் நபர்
  rationale: தமிழ் வினைமுற்றே ‘நான்’ என்ற எழுவாயைத் தெளிவாகக் காட்டுகிறது; தனியாக ‘நான்’ சேர்ப்பது தேவையற்ற வலியுறுத்தலை ஏற்படுத்தலாம்.
- source_word: נֹגֵף
  choice: தாக்கப்போகிறேன்
  rationale: הִנֵּה உடன் வரும் எபிரெயப் பெயரெச்ச வினைவடிவம் நெருங்கிவரும் செயலைக் குறிக்கக்கூடும்; ‘தாக்கு’ என்பது அடி/தீர்ப்பு உருவகத்தைப் பாதுகாக்கிறது.
- source_word: כָּל גְּבוּלְךָ
  choice: உன் ஆட்சிப்பகுதி முழுவதையும்
  rationale: இங்கு גְּבוּל எல்லைக்கோட்டை மட்டும் அல்லாமல் பார்வோனின் ஆளுகைக்குட்பட்ட முழுப் பகுதியையும் குறிக்கிறது.
- source_word: בַּצְפַרְדְּעִים
  choice: தவளைகளால்
  rationale: בְּ இங்கு தாக்குதலின் கருவி அல்லது வழிமுறையைக் குறிக்கிறது; தமிழ் கருவியுருபு இதைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: נֹגֵף என்ற பெயரெச்ச வினைவடிவத்தின் காலநுணுக்கம்
  choice: தாக்கப்போகிறேன்
  alternative: தாக்குவேன்
  rationale: הִנֵּה உடன் வரும் இவ்வடிவம் நெருங்கிவரும் செயல் அல்லது எளிய எதிர்காலம் என இருவகையாகப் புரிந்துகொள்ளப்படலாம். முதன்மை உரை நெருங்கிவரும் தீர்ப்பை வெளிப்படுத்துகிறது; அடிக்குறிப்பு மாற்று வாய்ப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான எச்சரிக்கைத் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ மூலத்தின் கவன ஈர்ப்பைத் தக்கவைக்கிறது; ‘ஆட்சிப்பகுதி’ என்பது எல்லைக்கோடு என்ற தவறான குறுகிய புரிதலைத் தவிர்க்கிறது.
