base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/026.yaml
  text: 'And Yahweh said to Moses[a], “Go in to Pharaoh and say to him, ‘Thus says Yahweh: Let my people go, so that they may serve me.’”'
translation:
  language: ta
  text: 'யாவே மோசேயிடம், “பார்வோனிடம் சென்று அவனிடம், ‘யாவே இவ்வாறு கூறுகிறார்: என் மக்கள் எனக்குச் சேவை செய்யும்படி அவர்களைப் போகவிடு[a]’ என்று சொல்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னை வழிபடும்படி.” எபிரேய வினைச்சொல் கடவுளுக்குச் செய்யும் சேவையைக் குறிக்கலாம்; அதில் வழிபாடும் அடங்கும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியைத் தமிழின் இயல்பான வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: பார்வோனிடம் போய்
  rationale: בוא என்பது சூழலுக்கேற்ப வருதல், போதல் அல்லது உள்ளே செல்லுதல் எனப் பொருள்படும்; இங்கு பார்வோனை அணுகும்படி கொடுக்கப்படும் கட்டளையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: அவனிடம் ... என்று சொல்
  rationale: தொடர்ச்சியான கட்டளையின் வலிமையைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே கூறுவது இதுவே
  rationale: தூதுச் செய்திக்குரிய அதிகாரப்பூர்வ அறிமுகச் சூத்திரத்தை நவீனத் தமிழில் கண்ணியமாகத் தருகிறது.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: என் மக்கள் ... அவர்களைப் போகவிடு
  rationale: இங்கு שׁלח என்பது அடிமைத்தனத்திலிருந்து விடுவித்துப் போக அனுமதிக்கும்படி கோரும் பொருளைத் தருகிறது; ‘போகவிடு’ அந்தச் சூழலை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וְיַעַבְדֻנִי
  choice: எனக்குச் சேவை செய்வதற்காக
  rationale: விடுவிப்பதன் நோக்கத்தை வெளிப்படுத்துவதோடு, עבד என்பதன் பரந்த ‘சேவை செய்தல்’ என்ற பொருளையும் காக்கிறது; கடவுளுக்குச் செய்யும் இச்சேவையில் வழிபாடும் அடங்கலாம்.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் பட்டம் அல்ல, இறைவனின் தனிப்பெயரே உள்ளது. ‘யாவே’ என்பது ஏற்றுக்கொள்ளப்பட்ட ஒலிப்பைத் தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- issue: וְיַעַבְדֻנִי என்பதில் இஸ்ரவேலின் விடுதலைக்கான நோக்கம்
  choice: எனக்குச் சேவை செய்வதற்காக
  alternative: என்னை வழிபடுவதற்காக
  rationale: עבד என்பது கடவுளுக்குச் செய்யும் வழிபாட்டையும் உள்ளடக்கலாம்; ஆனால் அதன் பொருள் வழிபாட்டைவிடப் பரந்தது. ‘சேவை’ என்பதை முதன்மை உரையில் வைத்ததால், பார்வோனுக்குச் செய்த அடிமைச் சேவையிலிருந்து யாவேக்குச் செய்யும் சேவைக்கு மாறும் கருத்தும், சொல்லின் பொருள் பரப்பும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. மேற்கோளுக்குள் மேற்கோள் தெளிவாக அமைக்கப்பட்டுள்ளது. ‘யாவே’ என்ற தனிப்பெயரும் ‘சேவை’ என்பதன் பரந்த பொருளும் பாதுகாக்கப்பட்டுள்ளன.
