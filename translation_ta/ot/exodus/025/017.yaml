  edition: WLC
  text: וְ/עָשִׂ֥יתָ כַפֹּ֖רֶת זָהָ֣ב טָה֑וֹר אַמָּתַ֤יִם וָ/חֵ֨צִי֙ אָרְכָּ֔/הּ וְ/אַמָּ֥ה וָ/חֵ֖צִי רָחְבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/017.yaml
  text: And you shall make a mercy seat of pure gold; its length shall be two cubits and a half[a], and its width a cubit and a half.
translation:
  language: ta
  text: “நீ தூய தங்கத்தால் ஒரு பாவநிவாரண மூடியை[a] செய்ய வேண்டும். அது இரண்டரை முழம் நீளமும் ஒன்றரை முழம் அகலமும் கொண்டிருக்க வேண்டும்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அருளாசனம்.” எபிரேயச் சொல் உடன்படிக்கைப் பெட்டியின்மேல் வைக்கப்பட்ட தங்க மூடியைக் குறிக்கிறது; அது பாவநிவாரணத்தைக் குறிக்கும் כפר என்ற வேருடன் தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: நீ ... செய்ய வேண்டும்
  rationale: அறிவுறுத்தல் சூழலில் இணைப்புடன் வரும் Qal வினை வடிவம் கட்டளையின் வலிமையைக் கொண்டுள்ளது; நவீன தமிழில் ‘செய்ய வேண்டும்’ இயல்பாகவும் தெளிவாகவும் அதைக் காட்டுகிறது.
- source_word: כַפֹּרֶת
  choice: பாவநிவாரண மூடி
  rationale: இது உடன்படிக்கைப் பெட்டியின் தங்க மூடியைக் குறிக்கும் தனிப்பெயர்ச்சொல்; כפר என்ற பாவநிவாரணத்துடன் தொடர்புடைய வேரையும், அது ஒரு மூடி என்பதையும் இத்தேர்வு வெளிப்படுத்துகிறது. சொல்லின் வழிபாட்டு மற்றும் இறையியல் செறிவு அடிக்குறிப்பில் மேலும் விளக்கப்படுகிறது.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கத்தால்
  rationale: பொருளையும் அதன் தூய தரத்தையும் தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: இரண்டரை முழம்
  rationale: பண்டைய அளவலகான ‘முழம்’ என்பதைக் கணக்குமாற்றம் செய்யாமல் பாதுகாத்து, தமிழின் இயல்பான எண் அமைப்பில் தருகிறது.
- source_word: אָרְכָּהּ
  choice: நீளம்
  rationale: பெண்பால் ஒருமை பின்னொட்டு பாவநிவாரண மூடியைக் குறிக்கிறது; தமிழில் அடுத்துள்ள ‘அது’ இதைத் தெளிவாக்குகிறது.
- source_word: וְאַמָּה וָחֵצִי
  choice: ஒன்றரை முழம்
  rationale: எபிரேய அளவைத் துல்லியமாகவும் தமிழில் சுருக்கமாகவும் தருகிறது.
- source_word: רָחְבָּהּ
  choice: அகலம்
  rationale: பெண்பால் ஒருமை பின்னொட்டு அதே மூடியின் அகலத்தைக் குறிக்கிறது; தமிழில் இயல்பான பரிமாணச் சொல்லாக ‘அகலம்’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: வழிபாட்டுச் சூழலில் כַפֹּרֶת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரண மூடி
  alternative: அருளாசனம்; மூடி
  rationale: இச்சொல் உடன்படிக்கைப் பெட்டியின் தங்க மூடியைக் குறிக்கிறது; அதேவேளையில் כפר என்ற பாவநிவாரண வேர் சார்ந்த இறையியல் தொடர்பையும் கொண்டுள்ளது. ‘பாவநிவாரண மூடி’ பொருளின் வடிவத்தையும் அதன் வழிபாட்டுச் செயல்பாட்டையும் இணைத்துக் காட்டுகிறது; பாரம்பரிய மாற்றுப்பெயர் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. பழைய அளவலகான ‘முழம்’ பாதுகாக்கப்பட்டுள்ளது; தொழில்நுட்ப வழிபாட்டுச் சொல்லின் பொருள் முதன்மை உரையிலும் அடிக்குறிப்பிலும் தெளிவுபடுத்தப்பட்டுள்ளது.
