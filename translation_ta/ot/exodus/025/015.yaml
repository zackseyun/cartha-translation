source:
  edition: WLC
  text: בְּ/טַבְּעֹת֙ הָ/אָרֹ֔ן יִהְי֖וּ הַ/בַּדִּ֑ים לֹ֥א יָסֻ֖רוּ מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/015.yaml
  text: The poles shall remain in the rings of the ark[a]; they shall not be removed from it.
translation:
  language: ta
  text: பேழையின் வளையங்களில் தண்டுகள் இருக்க வேண்டும்[a]; அவை அதிலிருந்து அகற்றப்படக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேழையின் வளையங்களில் தண்டுகள் நிலைத்திருக்க வேண்டும்; அவை அதிலிருந்து அகற்றப்படக் கூடாது.”
    reason: יִהְיוּ என்பதன் அடிப்படைப் பொருள் ‘இருக்க வேண்டும்’; அடுத்துள்ள அகற்றக்கூடாது என்ற தடை, தண்டுகள் வளையங்களில் தொடர்ந்து இருக்க வேண்டும் என்ற கருத்தை உணர்த்துகிறது.
lexical_decisions:
- source_word: בְּטַבְּעֹת
  choice: வளையங்களிலேயே
  rationale: טַבַּעַת என்பது பேழையில் பொருத்தப்பட்ட வளையங்களைக் குறிக்கிறது. בְ இங்கு தண்டுகள் வளையங்களுக்குள் அமைந்திருப்பதைக் காட்டுகிறது; ‘-லேயே’ என்பது அவை அங்கே தொடர்ந்து இருக்க வேண்டும் என்ற சூழல் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָאָרֹן
  choice: பேழை
  rationale: ஆசரிப்புக்கூடாரச் சூழலில் אָרוֹן என்பது சாதாரணப் பெட்டியை அல்ல, புனிதப் பேழையைக் குறிக்கிறது. ‘பேழை’ என்பது தமிழில் சுருக்கமாகவும் மரியாதைக்குரிய நடையிலும் இச்சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: יִהְיוּ
  choice: இருக்க வேண்டும்
  rationale: היה என்பதன் அடிப்படைப் பொருள் ‘இரு’. கட்டளையின் சூழலையும் அடுத்துள்ள அகற்றக்கூடாது என்ற தடையையும் கருத்தில் கொண்டு, ‘இருக்க வேண்டும்’ என்று மொழிபெயர்க்கப்பட்டது; தொடர்ந்திருக்கும் நிலை ‘வளையங்களிலேயே’ என்பதால் வெளிப்படுகிறது.
- source_word: הַבַּדִּים
  choice: தண்டுகள்
  rationale: בַּדִּים என்பது பேழையைச் சுமப்பதற்குப் பயன்படுத்தப்பட்ட நீண்ட தண்டுகளைக் குறிக்கிறது. ‘தண்டுகள்’ என்பது இயல்பான, தற்போதைய தமிழ்ச் சொல்.
- source_word: לֹא יָסֻרוּ
  choice: அகற்றப்படக் கூடாது
  rationale: סוּר என்பது விலகுதல் அல்லது அகற்றப்படுதல் என்று பொருள்படலாம். இங்கு தண்டுகளை வளையங்களிலிருந்து எடுக்கத் தடை விதிக்கப்படுவதால், தமிழில் செயப்பாட்டு வடிவம் பொருத்தமானது.
- source_word: מִמֶּנּוּ
  choice: அதிலிருந்து
  rationale: ஆண்பால் ஒருமை பின்னொட்டு முன் கூறப்பட்ட பேழையைக் குறிக்கிறது. ‘அதிலிருந்து’ என்பது குறிப்பை மீண்டும் தேவையின்றி சொல்லாமல் தெளிவாகப் பாதுகாக்கிறது.
