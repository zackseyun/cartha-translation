source:
  edition: WLC
  text: וְ/עָשִׂ֨יתָ לּ֥/וֹ מִסְגֶּ֛רֶת טֹ֖פַח סָבִ֑יב וְ/עָשִׂ֧יתָ זֵר זָהָ֛ב לְ/מִסְגַּרְתּ֖/וֹ סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/025.yaml
  text: You shall make for it a surrounding frame a handbreadth wide[a], and you shall make a gold molding around its frame.
translation:
  language: ta
  text: அதற்குச் சுற்றிலும் ஒரு உள்ளங்கை அகலமுள்ள சட்டத்தைச் செய்ய வேண்டும்; அந்தச் சட்டத்தைச் சுற்றிலும் தங்க அலங்கார விளிம்பைச் செய்ய வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதன் சட்டத்தைச் சுற்றிலும் தங்கக் கிரீடத்தைச் செய்ய வேண்டும்.’ எபிரெயச் சொல்லான זֵר அலங்கார விளிம்பையோ வார்ப்புப் பட்டையையோ குறிக்கலாம்; ‘கிரீடம்’ என்பது மரபான மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: சட்டம்
  rationale: மேசையோடு இணைக்கப்பட்ட கட்டமைப்பான சுற்றுப் பகுதியை இச்சொல் குறிக்கிறது. நவீன தமிழில் ‘சட்டம்’ என்பது அந்த அமைப்பை இயல்பாகவும் அளவுக்கு மீறிய துல்லியமின்றியும் தெரிவிக்கிறது.
- source_word: טֹפַח
  choice: ஒரு உள்ளங்கை அகலம்
  rationale: இது ‘handbreadth’ எனும் பண்டைய நீள அளவைக் குறிக்கிறது. சட்டத்தின் பரிமாணம் கூறப்படுவதால் ‘அகலம்’ என்பதை வெளிப்படையாகச் சேர்ப்பது தமிழில் தெளிவாக உள்ளது.
- source_word: סָבִיב
  choice: சுற்றிலும் / சுற்றிலும்
  rationale: இரு இடங்களிலும் சூழ்ந்திருக்கும் அமைப்பைக் குறிக்கிறது. எபிரெய மூலத்தின் மீளுரைப்பைத் தமிழிலும் தக்கவைத்துள்ளது.
- source_word: זֵר
  choice: அலங்கார விளிம்பு
  rationale: ஆசரிப்புக்கூடத்தின் பொருட்களைப் பற்றிய சூழலில் இது உயர்த்தப்பட்ட அலங்கார ஓரம் அல்லது வார்ப்புப் பட்டையைக் குறிக்கலாம். ‘கிரீடம்’ என்பது மரபான மாற்று என்றாலும், தனியான அரச கிரீடம் எனத் தவறாகப் புரிந்துகொள்ளப்படலாம்.
- source_word: זָהָב
  choice: தங்க
  rationale: பொருளைக் குறிக்கும் பெயர்ச்சொல் தமிழில் இயல்பாகப் பெயரடையாக அமைந்து, விளிம்பு தங்கத்தால் ஆனது என்பதை நேரடியாகத் தெரிவிக்கிறது.
- source_word: לּוֹ / לְמִסְגַּרְתּוֹ
  choice: அதற்காக / அந்தச் சட்டத்தை
  rationale: பின்னணியில் குறிப்பிடப்பட்ட மேசையையே சுட்டுகிறது. தமிழில் முதல் சுட்டுப்பெயரைத் தக்கவைத்து, இரண்டாம் இடத்தில் ‘அந்தச் சட்டம்’ எனக் கூறுவது தொடர்பைத் தெளிவாக்குகிறது.
- source_word: וְעָשִׂיתָ
  choice: செய்ய வேண்டும்
  rationale: மீண்டும் வரும் வினை கட்டளையின் தொடர்ச்சியை வெளிப்படுத்துகிறது. ‘செய்ய வேண்டும்’ என்பது நவீனத் தமிழில் இயல்பான, கண்ணியமான கட்டளை நடை.
