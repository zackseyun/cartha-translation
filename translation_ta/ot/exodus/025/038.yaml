  text: Its tongs and its firepans shall be of pure gold[a][b].
translation:
  language: ta
  text: அதன் இடுக்கிகளும்[a] அதன் நெருப்புச் சட்டிகளும்[b] தூய தங்கத்தாலானவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் திரி வெட்டும் கருவிகளும்”; எபிரெயச் சொல் விளக்குத்தண்டுடன் தொடர்புடைய, பற்றிப் பிடிக்கவோ திரியைச் சீராக்கவோ பயன்படும் ஒரு கருவியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதன் தட்டுகளும்”; இச்சூழலில் “அதன் தூபச்சட்டிகளும்” என்பது சாத்தியம் குறைந்த மற்றொரு பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְקָחֶיהָ
  choice: அதன் இடுக்கிகள்
  rationale: விளக்குத்தண்டுடன் தொடர்புடைய திரியைப் பற்றிப் பிடிக்கவோ சீராக்கவோ பயன்படும் கருவியை இச்சொல் குறிக்கிறது. செயல்பாட்டை அளவுக்கு மீறிக் குறிப்பாக்காமல், இயல்பான நவீனத் தமிழில் ‘இடுக்கிகள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: מַחְתֹּתֶיהָ
  choice: அதன் நெருப்புத் தட்டுகள்
  rationale: நெருப்பையோ எரியும் கரிகளையோ எடுத்துச் செல்லும் தட்டுகளை இச்சொல் பொதுவாகக் குறிக்கிறது. இச்சூழலில் ‘தூபக்கலசங்கள்’ என்பது மிகக் குறிப்பானது; ‘தட்டுகள்’ என்பது மிகப் பொதுவானது. ஆகவே ‘நெருப்புத் தட்டுகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கத்தால் செய்யப்பட வேண்டும்
  rationale: இச்சொற்றொடர் பொருட்கள் செய்யப்பட்டிருக்கும் மூலப்பொருளை நேரடியாகக் குறிக்கிறது. தமிழில் முழுமையான, இயல்பான கட்டளைக் கூறாக அமைவதற்காக ‘தூய தங்கத்தால் செய்யப்பட வேண்டும்’ என வழங்கப்பட்டது.
- source_word: וּ
  choice: -உம் … -உம்
  rationale: இரண்டு கருவிகளையும் இணைக்கும் எபிரெய இணைப்புச்சொல், தமிழின் இயல்பான இணைப்புமுறையான ‘-உம் … -உம்’ மூலம் வெளிப்படுத்தப்பட்டது.
- source_word: -הָ
  choice: அதன்
  rationale: பெண்பால் ஒருமை உடைமைப் பின்னொட்டு முன் குறிப்பிடப்பட்ட விளக்குத்தண்டைக் குறிக்கிறது. உயிரற்ற பொருளுக்கான இயல்பான தமிழ் உடைமை வடிவமாக ‘அதன்’ பயன்படுத்தப்பட்டது.
