source:
  edition: WLC
  text: וְ/נָתַתָּ֖ אֶל הָ/אָרֹ֑ן אֵ֚ת הָ/עֵדֻ֔ת אֲשֶׁ֥ר אֶתֵּ֖ן אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/016.yaml
  text: And you shall put into the ark the testimony that I will give you[a].
translation:
  language: ta
  text: நான் உனக்குக் கொடுக்கும் சாட்சியைப் பேழைக்குள் நீ வைக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இச்சூழலில், இன்னும் குறிப்பாக, “சாட்சியின் பலகைகள்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: வைக்க வேண்டும்
  rationale: נתן என்பதற்கு ‘கொடு’, ‘வை’ போன்ற பொருள்கள் உண்டு. இங்கு பெட்டிக்குள் ஓர் பொருளை இடுவது குறிக்கப்படுவதால், இயல்பான தமிழில் ‘வைக்க வேண்டும்’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: אֶל
  choice: -க்குள்
  rationale: அடிப்படையில் ‘நோக்கி/இடம்’ என்பதைக் குறிக்கும் இம்முன்னிடைச்சொல், נתן என்ற வினைச்சொல்லுடனும் கொள்கலனாகிய பெட்டியுடனும் வருவதால், உள்ளே இடுதல் என்ற பொருளில் ‘-க்குள்’ என வழங்கப்படுகிறது.
- source_word: הָאָרֹן
  choice: பெட்டி
  rationale: אָרוֹן என்பது பெட்டி அல்லது பேழையைக் குறிக்கிறது. இவ்வசனத்தின் கூடாரச் சூழலில் இது புனிதப் பெட்டி; நவீனத் தமிழில் தெளிவாகவும் மிகைப்படுத்தாமலும் ‘பெட்டி’ என வழங்கப்படுகிறது.
- source_word: אֵת
  choice: '[நேரடிச் செயப்படுபொருள் குறியீடு; தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: אֵת என்பது குறிப்பிட்ட நேரடிச் செயப்படுபொருளைக் குறிக்கும் எபிரெய இலக்கணக் குறியீடு; தமிழில் இதற்கெனத் தனிச்சொல் தேவையில்லை.
- source_word: הָעֵדֻת
  choice: சாட்சி
  rationale: עֵדוּת என்பதன் அடிப்படைப் பொருள் ‘சாட்சி/சான்று’. யாத்திராகமச் சூழலில் இது கடவுள் கொடுக்கும் உடன்படிக்கைச் சாட்சியைக் குறிக்கிறது. வசனத்தில் பலகைகள் என்று வெளிப்படையாகக் கூறப்படாததால் பொதுவான சொல்லே முதன்மை உரையில் வைக்கப்படுகிறது.
- source_word: אֲשֶׁר
  choice: -உம்
  rationale: உறவுத் தொடரைத் தமிழில் இயல்பாக உருவாக்க, ‘நான் ... கொடுக்கப்போகும் சாட்சி’ என்ற பெயரெச்ச அமைப்பு பயன்படுத்தப்படுகிறது.
- source_word: אֶתֵּן
  choice: கொடுக்கப்போகும்
  rationale: Qal imperfect முதலாம் நபர் ஒருமை இங்கு வருங்காலச் செயலைக் குறிக்கிறது. ‘கொடுப்பேன்’ என்ற பொருளை பெயரெச்சத் தொடரில் இயல்பாக ‘கொடுக்கப்போகும்’ என வழங்குகிறது.
- source_word: אֵלֶיךָ
  choice: உனக்கு
  rationale: மோசேயை நோக்கிய ஒருமை முன்னிலையைத் தக்கவைத்து, பெறுபவரைக் குறிக்கும் இயல்பான தமிழ்ச் சொல் ‘உனக்கு’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: ‘சாட்சி’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘சாட்சி’ என்று பொதுவாகவே வழங்குதல்
  alternative: ‘சாட்சிப் பலகைகள்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: எபிரெய வசனம் இங்கு הָעֵדֻת (‘சாட்சி’) என்று மட்டுமே கூறுகிறது. விரிந்த சூழல் கற்பலகைகளை அடையாளப்படுத்தினாலும், வசனத்தின் சொல் திறந்தவாறே இருப்பதால் முதன்மை உரை அதை மிகத் துல்லியப்படுத்தவில்லை; அடிக்குறிப்பு சூழல்சார் குறிப்பை அளிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியும் கண்ணியமுமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் ஒருமை முன்னிலை ‘உனக்கு’ என்பதில் பாதுகாக்கப்பட்டுள்ளது. ‘சாட்சி’ என்ற சொல்லின் சூழல்சார் சிறப்புப் பொருள் முதன்மை உரையில் கட்டாயப்படுத்தப்படாமல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
