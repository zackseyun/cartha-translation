  text: Their buds and their branches shall be of one piece with it[b][a], all of it a single hammered work of pure gold.
translation:
  language: ta
  text: அதன் மொட்டுகளும் கிளைகளும் அதிலிருந்தே இருக்க வேண்டும்[a]; அது முழுவதும் தூய தங்கத்தால் அடித்துத் தட்டிய ஒரே வேலைப்பாடாக இருக்க வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதிலிருந்து.” மொட்டுகளும் கிளைகளும் தனித்தனியாகச் செய்து இணைக்கப்படாமல், விளக்குத்தண்டிலிருந்தே ஒருங்கிணைந்தவையாக உருவாக்கப்பட வேண்டும் என்பதே பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அடித்து செய்யப்பட்ட வேலை.” விளக்குத்தண்டு முழுவதும் தூய தங்கத்தின் ஒரே துண்டிலிருந்து அடித்துத் தட்டி உருவாக்கப்பட வேண்டும் என்பதை எபிரெயச் சொல் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: அவற்றின் மொட்டுகள்
  rationale: விளக்குத்தண்டின் தாவர வடிவமைப்புச் சூழலில், வட்டமான மலர் அலங்கார உறுப்புகளைக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: וּקְנֹתָם
  choice: கிளைகள்
  rationale: קנה அடிப்படையில் நாணல் அல்லது தண்டைக் குறித்தாலும், இச்சூழலில் விளக்குத்தண்டிலிருந்து நீளும் உறுப்புகளைக் குறிக்கிறது; தாவர உருவகத்திற்கும் 'கிளைகள்' பொருந்துகிறது.
- source_word: מִמֶּנָּה
  choice: அதிலிருந்தே
  rationale: இந்த உறுப்புகள் தனியே செய்து இணைக்கப்படாமல், விளக்குத்தண்டிலிருந்தே ஒருங்கிணைந்தவையாக உருவாக்கப்பட வேண்டும் என்ற மூலமொழியின் கருத்தைப் பாதுகாக்கிறது.
- source_word: יִהְיוּ
  choice: இருக்க வேண்டும்
  rationale: திருவாசஸ்தலப் பொருட்களுக்கான கட்டளையைக் குறிக்கும் எபிரெய முற்றுப்பெறா வினையின் விதிப்பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: כֻּלָּהּ
  choice: அது முழுவதும்
  rationale: விளக்குத்தண்டின் அனைத்துப் பகுதிகளையும் உள்ளடக்கும் முழுமையை வலியுறுத்துகிறது.
- source_word: מִקְשָׁה אַחַת
  choice: அடித்து உருவாக்கப்பட்ட ஒரே வேலை
  rationale: உலோகத்தைச் சுத்தியலால் அடித்து ஒருங்கிணைந்த ஒன்றாக உருவாக்கும் முறையையும் அதன் ஒருமையையும் தெரிவிக்கிறது; 'ஒரே துண்டு' என்ற பொருள் முதல் வாக்கியத்திலும் தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கம்
  rationale: இச்சொற்றொடருக்கான தெளிவான, நிலையான நவீன தமிழ் மொழிபெயர்ப்பு.
