  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/שִׁשָּׁ֣ה קָנִ֔ים יֹצְאִ֖ים מִ/צִּדֶּ֑י/הָ שְׁלֹשָׁ֣ה קְנֵ֣י מְנֹרָ֗ה מִ/צִּדָּ/הּ֙ הָ/אֶחָ֔ד וּ/שְׁלֹשָׁה֙ קְנֵ֣י מְנֹרָ֔ה מִ/צִּדָּ֖/הּ הַ/שֵּׁנִֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/032.yaml
  text: 'And six branches shall come out from its sides: three branches of the lampstand from its one side[a], and three branches of the lampstand from its other side.'
translation:
  language: ta
  text: 'அதன் பக்கங்களிலிருந்து ஆறு கிளைகள் நீண்டு வர வேண்டும்: விளக்குத்தாங்கியின் ஒரு பக்கத்திலிருந்து மூன்று கிளைகளும், விளக்குத்தாங்கியின் மறுபக்கத்திலிருந்து மூன்று கிளைகளும் நீண்டு வர வேண்டும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָנִים / קְנֵי
  choice: கிளைகள்
  rationale: விளக்குத்தாங்கியின் பக்கங்களிலிருந்து நீளும் உறுப்புகளை இச்சூழலில் குறிக்கிறது; தாவர நாணல் என்ற அடிப்படைப் பொருளைவிட ‘கிளைகள்’ உருவகத்தையும் அமைப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יֹצְאִים
  choice: நீண்டு வர வேண்டும்
  rationale: பக்கங்களிலிருந்து வெளிப்பட்டு நீளும் அமைப்பைத் தெளிவாகக் காட்டுகிறது; கூடாரப் பொருட்களை உருவாக்கும் அறிவுறுத்தல் சூழலையும் தக்கவைக்கிறது.
- source_word: מִצִּדֶּיהָ
  choice: அதன் பக்கங்களிலிருந்து
  rationale: பெண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் வரும் பன்மையான ‘பக்கங்கள்’ என்பதை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: מְנֹרָה
  choice: விளக்குத்தாங்கி
  rationale: விளக்கைத் தாங்கும் பொருளைக் குறிக்கும் பொதுப்பெயராக மொழிபெயர்க்கிறது; ஒலிபெயர்ப்பைத் தவிர்த்து நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: הָאֶחָד ... הַשֵּׁנִי
  choice: ஒரு பக்கம் ... மறுபக்கம்
  rationale: எபிரெய உரையின் இரண்டு எதிரெதிர் பக்கங்களுக்கிடையிலான வேறுபாட்டை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுப் பொருளுக்கேற்ற கண்ணியமான நடையும் சாதாரண வாசகருக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. எபிரெய உரையின் சமச்சீர் அமைப்பைத் தக்கவைக்க இரு பக்கங்களையும் குறிக்கும் தொடர்கள் மீண்டும் கூறப்பட்டுள்ளன. வழங்கப்பட்ட ஆங்கில அடிக்குறிப்பு மூல எபிரெயில் உள்ள உண்மையான வேறுபாட்டைச் சுட்டாததால் சேர்க்கப்படவில்லை.
