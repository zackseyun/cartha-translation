source:
  edition: WLC
  text: וְ/עָ֥שׂוּ לִ֖/י מִקְדָּ֑שׁ וְ/שָׁכַנְתִּ֖י בְּ/תוֹכָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/008.yaml
  text: And let them make a sanctuary for me[a], so that I may dwell among them.
translation:
  language: ta
  text: அவர்கள் எனக்காக ஒரு பரிசுத்த இடத்தை அமைக்கட்டும்; நான் அவர்கள் நடுவில் குடியிருப்பேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அவர்களுடைய நடுவில்.” எபிரெய உரை, கடவுள் பரிசுத்த இடமாகிய கட்டிடத்திற்குள் மட்டும் அல்லாமல் மக்களின் நடுவில் குடியிருப்பதை வலியுறுத்துகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: அமைக்கட்டும்
  rationale: அறிவுறுத்தல் சூழலில் மூன்றாம் நபர் பன்மைக்குரிய கட்டளைப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. ‘செய்யட்டும்’ என்பதைக் காட்டிலும் ஒரு வழிபாட்டு இடத்தைக் கட்டியமைக்கும் சூழலுக்கு ‘அமைக்கட்டும்’ பொருத்தமானது.
- source_word: לִי
  choice: எனக்காக
  rationale: לִי இங்கு நோக்கம் அல்லது பயனாளியைக் குறிக்கிறது; அந்தப் பரிசுத்த இடம் கடவுளுக்காக அமைக்கப்பட வேண்டும் என்பதைக் ‘எனக்காக’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִקְדָּשׁ
  choice: பரிசுத்த இடம்
  rationale: מִקְדָּשׁ என்பது தெய்வீகப் பிரசன்னத்திற்காகப் பிரித்துவைக்கப்பட்ட புனிதமான இடத்தைக் குறிக்கிறது. ‘பரிசுத்த இடம்’ என்பது சாதாரண வாசகருக்கும் தெளிவாகவும் இச்சூழலில் கண்ணியமாகவும் உள்ளது.
- source_word: וְשָׁכַנְתִּי
  choice: நான் … குடியிருப்பேன்
  rationale: שׁכן என்பதன் அடிப்படைப் பொருளான ‘குடியிருத்தல், தங்கியிருத்தல்’ என்பதையும், எபிரெய வாக்கியத்தின் இணைப்பு/விளைவு உறவிலுள்ள உண்மையான தெளிவின்மையையும் காக்கிறது; நோக்கப் பொருளை மட்டும் கட்டாயப்படுத்தவில்லை.
- source_word: בְּתוֹכָם
  choice: அவர்கள் நடுவில்
  rationale: பன்மைச் சுட்டுப்பெயருடன் உள்ள எபிரெய சொற்றொடரின் நேரடியான பொருளைக் காக்கிறது. கடவுள் கட்டிடத்திற்குள் மட்டும் அல்ல, மக்களின் நடுவில் குடியிருப்பார் என்ற உரையின் மையத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கடவுள் குடியிருப்பதன் குறிப்பு
  choice: அவர்கள் நடுவில்
  alternative: அதற்குள்
  rationale: בְּתוֹכָם என்பதில் உள்ள பின்னொட்டு பன்மை (‘அவர்கள்’); ஆகவே குடியிருப்பதன் குறிப்பு பரிசுத்த இடம் என்ற ஒருமைக் கட்டிடத்தை மட்டுமல்ல, மக்களையே சார்ந்தது.
- issue: இரு கூறுகளுக்கிடையிலான உறவு
  choice: இணைப்பாக ‘; … குடியிருப்பேன்’
  alternative: ‘நான் … குடியிருப்பதற்காக’ என்ற வெளிப்படையான நோக்கக் கூறு
  rationale: וְשָׁכַנְתִּי என்பதை நோக்கம் அல்லது விளைவு எனச் சூழல் உணர்த்தலாம்; ஆனால் வடிவம் நேரடியாக ‘நான் குடியிருப்பேன்’ என்றும் வாசிக்க முடியும். எனவே மூலத்தின் இறையியல் அழுத்தத்தையும் இலக்கணத் தெளிவின்மையையும் காக்க இணைப்பாக மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான வேதாகம நடையில் அமைக்கப்பட்டது. ‘ஆலயம்’ அல்லது ‘கூடாரம்’ என்று காலப்பின்னணியை முன்கூட்டியே குறுக்காமல், מִקְדָּשׁ என்பதற்கு ‘பரிசுத்த இடம்’ பயன்படுத்தப்பட்டது. அடிக்குறிப்பு குறியீடு தொடர்புடைய பிரதான உரைக் கூறின் பின்னர் இடப்பட்டுள்ளது.
