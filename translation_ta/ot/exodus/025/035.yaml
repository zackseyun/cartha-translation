translation:
  language: ta
  text: அதிலிருந்து நீளும் ஒவ்வொரு இரு கிளைகளுக்கும் கீழே ஒரு குமிழ் இருக்க வேண்டும்; இவ்வாறு விளக்குத்தண்டிலிருந்து நீளும் ஆறு கிளைகளுக்கும் மூன்று குமிழ்கள் இருக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַפְתֹּר
  choice: குமிழ்
  rationale: விளக்குத்தண்டின் அலங்கார அமைப்பிலுள்ள உருண்டையான அல்லது புடைத்த வடிவைக் குறிக்கும் சொல்லாக, நவீன தமிழில் இயல்பாகவும் பொருளுக்கேற்றவாறும் உள்ளது.
- source_word: קָנִים
  choice: கிளைகள்
  rationale: விளக்குத்தண்டின் இருபுறமும் அதிலிருந்து பிரிந்து நீளும் ஆறு உறுப்புகளைத் தெளிவாகக் குறிக்கிறது.
- source_word: מְנֹרָה
  choice: விளக்குத்தண்டு
  rationale: இங்கு பல கிளைகளுடன் அமைந்த முழு விளக்குச் சாதனத்தைக் குறிக்கிறது; தனி விளக்கு என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
theological_decisions: []
translation_notes:
  register: மூலத்தில் மூன்று முறை வரும் ஒரே அமைப்பை, தமிழில் புரிந்துகொள்ள எளிதாக ‘ஒவ்வொரு இரு கிளைகளுக்கும்’ என்றும் ‘மூன்று குமிழ்கள்’ என்றும் சுருக்கி வெளிப்படுத்தியுள்ளோம். கட்டளைக்குரிய ‘இருக்க வேண்டும்’ என்ற நடை முந்தைய வசனங்களின் தொடர்ச்சியை இயல்பாக எடுத்துரைக்கிறது.
