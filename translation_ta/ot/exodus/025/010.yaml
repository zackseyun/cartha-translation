  yaml_path: translation/ot/exodus/025/010.yaml
  text: They shall make an ark of acacia wood[a], two and a half cubits its length, a cubit and a half its width[c][b], and a cubit and a half its height.
translation:
  language: ta
  text: அவர்கள் அக்கேசியா மரத்தால்[b] ஒரு பேழையை[a] செய்ய வேண்டும். அதன் நீளம் இரண்டரை முழம்[c]; அகலம் ஒன்றரை முழம்; உயரம் ஒன்றரை முழம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெட்டி” அல்லது “பெட்டகம்”; எபிரெயச் சொல் ஒரு கொள்கலனைக் குறிக்கிறது. இது உடன்படிக்கைப் பேழையைச் சுட்டும் புனிதச் சூழல் என்பதால், “பேழை” என்ற சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “அக்கேசியா மரம்”; பாரம்பரியமாக “சித்தீம் மரம்.”
    reason: lexical_alternative
  - marker: c
    text: “முழம்” என்பது முழங்கையிலிருந்து நடுவிரல் நுனிவரையுள்ள தூரத்தை அடிப்படையாகக் கொண்ட பண்டைய நீள அளவு.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: அவர்கள் செய்ய வேண்டும்
  rationale: இறைவன் கொடுக்கும் கட்டளைத் தொடரில் வரும் மூன்றாம் நபர் பன்மை வினையை, நவீனத் தமிழில் இயல்பான கட்டளைப் பொருளுடன் வழங்குகிறது; தொடக்க இணைப்புச்சொல் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: אֲרוֹן
  choice: பேழை
  rationale: எபிரெயச் சொல் ஒரு பெட்டி அல்லது கொள்கலனைக் குறிக்கிறது. இங்கு புனித உடன்படிக்கைப் பேழைக்கான சூழல் என்பதால், தமிழில் நிலைபெற்றுள்ள ‘பேழை’ பயன்படுத்தப்படுகிறது; மூலச்சொல்லின் பொதுவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עֲצֵי שִׁטִּים
  choice: அக்கேசியா மரத்தால்
  rationale: குறிப்பிட்ட மரவகையையும் பொருளையும் நவீன வாசகருக்குத் தெளிவாகக் காட்டுகிறது. பாரம்பரிய ஒலிபெயர்ப்பான ‘சித்தீம் மரம்’ அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: இரண்டரை முழம்
  rationale: மூலத்தின் பண்டைய அளவலகை மாற்றாமல் வைத்து, எண்ணிக்கையை இயல்பான தமிழில் வழங்குகிறது.
- source_word: אָרְכּוֹ
  choice: அதன் நீளம்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு பேழையைக் குறிப்பதால், தமிழில் இயல்பாக ‘அதன் நீளம்’ என வழங்கப்படுகிறது.
- source_word: וְאַמָּה וָחֵצִי
  choice: ஒன்றரை முழம்
  rationale: ‘ஒரு முழமும் அரை முழமும்’ என்ற மூல அமைப்பின் அளவைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: רָחְבּוֹ
  choice: அகலம்
  rationale: ஒரு பொருளின் பக்கவாட்டு அளவைக் குறிக்கும் நவீனத் தமிழின் தெளிவான சொல்.
- source_word: קֹמָתוֹ
  choice: உயரம்
  rationale: இங்கு ஒரு பொருளின் செங்குத்து அளவைக் குறிப்பதால் ‘உயரம்’ பொருத்தமான இயல்பான மொழிபெயர்ப்பு.
