  text: כְּ/כֹ֗ל אֲשֶׁ֤ר אֲנִי֙ מַרְאֶ֣ה אוֹתְ/ךָ֔ אֵ֚ת תַּבְנִ֣ית הַ/מִּשְׁכָּ֔ן וְ/אֵ֖ת תַּבְנִ֣ית כָּל כֵּלָ֑י/ו וְ/כֵ֖ן תַּעֲשֽׂוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/009.yaml
  text: Exactly according to all that I am showing you—the pattern of the tabernacle and the pattern of all its furnishings—so you shall make it[a][b].
translation:
  language: ta
  text: நான் உனக்குக் காட்டுகிற எல்லாவற்றின்படியும்—திருக்கூடாரத்தின் மாதிரியின்படியும் அதன் எல்லா உபகரணங்களின் மாதிரியின்படியும்—அப்படியே நீங்கள் செய்ய வேண்டும்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாதிரி’ (תַּבְנִית) என்பதை ‘திட்டம்,’ ‘வடிவம்,’ அல்லது ‘வடிவமைப்பு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நீங்கள் செய்ய வேண்டும்’ என்ற எபிரெய வினை பன்மையில் உள்ளது; அது மோசேயுடன் இந்தப் பணிக்குப் பொறுப்பானவர்களையும் சேர்த்து விளிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: அனைத்தின்படியே
  rationale: כְּ உடன் வரும் כֹּל אֲשֶׁר, காட்டப்படுகிற அனைத்துக்கும் துல்லியமாக ஒத்திருக்க வேண்டும் என்பதைக் குறிக்கிறது. தமிழில் ‘-படியே’ அந்த நெருக்கமான ஒப்புமையையும் வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַרְאֶה
  choice: காட்டுகிற
  rationale: ראה வினையின் பங்கேற்பு வடிவம் இங்கு நிகழ்காலத் தொடர்ச்சிப் பொருளைக் கொண்டுள்ளது; ‘காட்டுகிற’ என்பது தேவன் மோசேக்கு வெளிப்படுத்திக் கொண்டிருக்கும் சூழலை இயல்பாகத் தருகிறது.
- source_word: תַּבְנִית
  choice: மாதிரி
  rationale: இந்தச் சொல் வடிவம், திட்டம், அமைப்பு அல்லது முன்மாதிரி ஆகிய பொருட்களை ஏற்கக்கூடியது. ‘மாதிரி’ என்பது அவற்றில் ஒன்றை மட்டும் தேவையின்றி உறுதிப்படுத்தாமல் மூலத்தின் பரப்பை ஓரளவு காக்கிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருக்கூடாரம்
  rationale: מִשְׁכָּן என்பதன் அடிப்படைப் பொருள் ‘உறைவிடம்’; யாத்திராகமச் சூழலில் அது தேவனுடைய பரிசுத்தக் கூடாரத்தைக் குறிக்கும் நிலைபெற்ற சொல்லாக உள்ளது. ‘திருக்கூடாரம்’ நவீனத் தமிழில் தெளிவாகவும் மரியாதையாகவும் உள்ளது.
- source_word: כָּל כֵּלָיו
  choice: அதன் எல்லா உபகரணங்கள்
  rationale: כֵּלִים என்பது பாத்திரங்கள் மட்டும் அல்லாமல் பலவகைச் சாதனங்களையும் பொருட்களையும் குறிக்கும் பரந்த சொல். ‘உபகரணங்கள்’ அந்தப் பரப்பை இச்சூழலில் இயல்பாகக் காக்கிறது.
- source_word: וְכֵן
  choice: அப்படியே
  rationale: וְכֵן முன் காட்டப்பட்ட முறையோடு ஒத்துச் செய்ய வேண்டிய விளைவைக் குறிக்கிறது; ‘அப்படியே’ முறைசார் ஒற்றுமையையும் வலியுறுத்தலையும் தருகிறது.
- source_word: תַּעֲשׂוּ
  choice: நீங்கள் அதைச் செய்ய வேண்டும்
  rationale: வினை இரண்டாம் நபர் ஆண்பால் பன்மையில் உள்ளது. ‘நீங்கள்’ அந்தப் பன்மையை வெளிப்படுத்துகிறது; ‘அதை’ என்பது காட்டப்பட்ட மாதிரியின்படி அமைக்க வேண்டிய திருக்கூடாரப் பணியைக் குறிக்கிறது.
theological_decisions:
- issue: תַּבְנִית என்பது பரலோக மூலவடிவத்தை வெளிப்படையாகக் குறிக்கிறதா
  choice: மாதிரி
  alternative: திட்டம் / வடிவமைப்பு / மூலவடிவம்
  rationale: தேவன் மோசேக்கு ஒரு תַּבְנִית-ஐக் காட்டுகிறார் என்று வசனம் கூறுகிறது; ஆனால் அது எத்தகைய இருப்பியல் தன்மையுள்ள மாதிரி என்பதை இவ்வசனம் வரையறுக்கவில்லை. ‘மாதிரி’ என்பது வெளிப்படுத்தப்பட்ட முன்மாதிரி என்ற சாத்தியத்தைத் திறந்தே வைக்கிறது; ‘பரலோக மூலவடிவம்’ போன்ற கூடுதல் இறையியல் முடிவை உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘திருக்கூடாரம்’ வழக்கில் நிலைபெற்ற வேதாகமச் சொல்லாக வைக்கப்பட்டுள்ளது; பழமையான ‘பணிமுட்டுகள்’ என்பதற்குப் பதிலாக ‘உபகரணங்கள்’ பயன்படுத்தப்பட்டுள்ளது. ஒருமை ‘உனக்கு’ என்பதிலிருந்து பன்மை ‘நீங்கள்’ என்பதற்கான மூலமொழி மாற்றம் உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
