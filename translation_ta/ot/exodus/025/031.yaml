base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/031.yaml
  text: And you shall make a lampstand of pure gold[a]. The lampstand shall be made of hammered work; its base and its shaft, its cups, its buds[b], and its flowers shall be of one piece with it.
translation:
  language: ta
  text: “நீ தூய தங்கத்தால் ஒரு விளக்குத்தாங்கியைச் செய்ய வேண்டும். அந்த விளக்குத்தாங்கி சுத்தியலால் அடித்து வடிவமைக்கப்பட வேண்டும்[a]. அதன் அடிப்பாகமும் மையத் தண்டும், கிண்ணங்களும் மொட்டுகளும்[b] பூக்களும் அதிலிருந்தே ஒரே துண்டாக அமைந்திருக்க வேண்டும்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடித்துச் செய்யப்பட்ட வேலைப்பாடாக இருக்க வேண்டும்’ என்றும் மொழிபெயர்க்கலாம். விளக்குத்தாங்கி தனித்தனி பாகங்களைச் சேர்த்துச் செய்யப்படாமல், ஒரே தங்கத் துண்டைச் சுத்தியலால் அடித்து உருவாக்கப்பட்டதாகத் தோன்றுகிறது என்பதை எபிரெயச் சொல் வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘மொட்டுகள்’ என்பதை ‘குமிழ்கள்’ என்றும் மொழிபெயர்க்கலாம். விளக்குத்தாங்கியின் மலர் வடிவ அலங்காரத்திலுள்ள வட்டமான புடைப்புகளை எபிரெயச் சொல் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרַת
  choice: விளக்குத்தண்டு
  rationale: இச்சொல் விளக்குகளைத் தாங்கும் அமைப்பைக் குறிக்கிறது; விளக்குகளையே குறிக்கவில்லை. ‘விளக்குத்தண்டு’ நவீன தமிழில் பொருளைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கம்
  rationale: சுத்திகரிக்கப்பட்ட, கலப்பில்லாத தங்கத்தைக் குறிக்கும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: מִקְשָׁה
  choice: சுத்தியலால் அடித்து வடிவமைக்கப்பட்டது
  rationale: தங்கத்தைத் தனித்தனி பாகங்களாகச் சேர்க்காமல், அடித்து வடிவமைக்கும் உலோக வேலைப்பாட்டை இச்சொல் குறிக்கிறது. செய்முறையைத் தெளிவாகக் காட்ட இந்த மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- source_word: תֵּעָשֶׂה
  choice: வடிவமைக்கப்பட வேண்டும்
  rationale: அறிவுறுத்தல் சூழலில் உள்ள இவ்வடிவத்தின் செயப்பாட்டு நிலையைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: יְרֵכָהּ
  choice: அதன் அடிப்பாகம்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘தொடை/பக்கம்’ என்றாலும், இப்பொருளின் கீழ்த் தாங்கும் பகுதியையே இங்கு குறிக்கிறது.
- source_word: וְקָנָהּ
  choice: நடுத்தண்டு
  rationale: பின்னர் விவரிக்கப்படும் பக்கக் கிளைகளிலிருந்து வேறுபட்ட, விளக்குத்தண்டின் மையத் தண்டை இங்கு ஒருமை வடிவம் குறிக்கிறது.
- source_word: גְּבִיעֶיהָ
  choice: கிண்ணங்கள்
  rationale: விளக்குத்தண்டிலுள்ள கிண்ண வடிவ அலங்கார உறுப்புகளை நேரடியாகவும் புரிந்துகொள்ளத்தக்க வகையிலும் குறிக்கிறது.
- source_word: כַּפְתֹּרֶיהָ
  choice: மொட்டுகள்
  rationale: வட்டமான புடைப்புகளையும் மலர் வடிவமைப்புடன் தொடர்புடைய அலங்கார உறுப்புகளையும் குறிக்கும் சொல்; ‘மொட்டுகள்’ அந்த உருவகத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: וּפְרָחֶיהָ
  choice: பூக்கள்
  rationale: வெளிப்படையான மலர் அலங்காரத்தைக் குறிக்கும் எளிய, துல்லியமான தமிழ் சொல்.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: அதனோடு ஒரே துண்டாக இருக்க வேண்டும்
  rationale: இப்பகுதிகள் தனியே செய்து இணைக்கப்படாமல், விளக்குத்தண்டிலிருந்தே உருவாக வேண்டும் என்பதைக் காட்டுகிறது.
