    issue: The footnote’s literal alternative uses ‘ஒரு மேசையையும்’, although the Hebrew has no explicit indefinite numeral/article.
    rationale: Tamil may require an article in the main text, but a note labeled more literal should avoid introducing ‘ஒரு’ and should express the prefixed conjunction directly.
