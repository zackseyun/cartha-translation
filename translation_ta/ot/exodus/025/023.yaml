  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. அளவுகள் மூலப் பண்பாட்டின்படி ‘முழம்’ என்றே வைக்கப்பட்டுள்ளன; மரத்தின் துல்லியமான இன அடையாளத்தை அளவுக்கு மீறி உறுதிப்படுத்தாமல் ‘சீத்திம்’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
