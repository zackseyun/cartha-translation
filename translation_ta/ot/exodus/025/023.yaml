  yaml_path: translation/ot/exodus/025/023.yaml
  text: You shall make a table of acacia wood[a], two cubits its length, one cubit its width, and a cubit and a half its height.
translation:
  language: ta
  text: சித்தீம் மரத்தால் ஒரு மேசையைச் செய்ய வேண்டும்[a]. அதன் நீளம் இரண்டு முழம், அகலம் ஒரு முழம், உயரம் ஒன்றரை முழம் ஆக இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சொல்லாக, ‘நீ ஒரு மேசையையும் செய்ய வேண்டும்.’ எபிரெய மொழியில் உள்ள இணைப்புச்சொல் இந்தக் கட்டளையை முந்திய கட்டளைகளுடன் இணைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: நீ செய்ய வேண்டும்
  rationale: இணைப்பிடைச்சொல்லுடன் வந்த Qal perfect வடிவம், தொடர்ச்சியான கட்டளைகளின் சூழலில் கட்டளையின் வலிமையைக் கொண்டுள்ளது. நவீன தமிழில் ‘நீ செய்ய வேண்டும்’ என்பது அதை இயல்பாக வெளிப்படுத்துகிறது; தொடக்கத்திலுள்ள וְ பற்றிய தகவல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שֻׁלְחָן
  choice: ஒரு மேசை
  rationale: இது வழிபாட்டிடத்திற்குரிய பொருளைக் குறிக்கும் வழக்கமான சொல்; இங்கு முதன்முறையாக அறிமுகப்படுத்தப்படுவதால் ‘ஒரு’ சேர்க்கப்பட்டுள்ளது.
- source_word: עֲצֵי שִׁטִּים
  choice: சீத்திம் மரம்
  rationale: மர வகையின் எபிரெயப் பெயரைத் தமிழில் ஒலிபெயர்ப்பது, அதன் துல்லியமான தாவரவியல் அடையாளம் குறித்த நிச்சயமின்மையை மறைக்காமல் காக்கிறது.
- source_word: אַמָּתַיִם
  choice: இரண்டு முழம்
  rationale: மூலப் பண்பாட்டின் அளவுமுறையையும் உரையின் துல்லியத்தையும் காக்க, אַמָּה என்பதற்கு பாரம்பரியமாகவும் புரிந்துகொள்ளத்தக்கதாகவும் உள்ள ‘முழம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אָרְכּוֹ
  choice: அதன் நீளம்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள பெயர்ச்சொல்லை நேரடியாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: וְאַמָּה
  choice: ஒரு முழம்
  rationale: பரிமாணப் பட்டியலில் எண்ணளவைத் தெளிவாகக் காட்டுகிறது.
- source_word: רָחְבּוֹ
  choice: அகலம்
  rationale: மேசையின் பரிமாணச் சூழலில் இயல்பான தமிழ்ச் சொல்; ‘அதன்’ என்பது இணை அமைப்பில் முதலிலேயே வந்து மூன்று பரிமாணங்களுக்கும் பொருந்துகிறது.
- source_word: וְאַמָּה וָחֵצִי
  choice: ஒன்றரை முழம்
  rationale: ‘ஒரு முழமும் பாதியும்’ என்ற எபிரெயக் கருத்தை நவீன தமிழில் சுருக்கமாகவும் துல்லியமாகவும் தருகிறது.
- source_word: קֹמָתוֹ
  choice: உயரம்
  rationale: அறைகலனின் பரிமாணத்தைக் குறிக்கும் இச்சூழலில் ‘உயரம்’ இயல்பான இணைச்சொல்.
