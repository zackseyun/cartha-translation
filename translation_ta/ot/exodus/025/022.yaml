base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/022.yaml
  text: And there I will meet with you[a], and I will speak with you from above the mercy seat, from between the two cherubim that are over the ark of the testimony[b], about all that I will command you for the sons of Israel.
translation:
  language: ta
  text: அங்கே நான் உன்னுடன் சந்திப்பேன்; சாட்சிப் பெட்டியின்மேல் இருக்கும் இரண்டு கேருபீன்களுக்கு நடுவிலிருந்து, பாவநிவாரண மூடியின்[a] மேலிருந்து, இஸ்ரவேல் மக்களுக்காக[b] நான் உனக்குக் கட்டளையிடும் அனைத்தையும் பற்றி உன்னுடன் பேசுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபுவழியாக, ‘அருளாசனம்.’ எபிரெயச் சொல் பெட்டியின் பொன் மூடியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இஸ்ரவேல் மக்களிடம்’ அல்லது சொல்லர்த்தமாக, ‘இஸ்ரவேலின் மகன்களிடம்/மக்களுக்காக.’ எபிரெயத்தில் ‘இஸ்ரவேலின் மகன்களுக்கு/நோக்கி’ என உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנוֹעַדְתִּי לְךָ שָׁם
  choice: அங்கே நான் உன்னைச் சந்திப்பேன்
  rationale: יעד என்பதன் நிஃபால் வடிவம் இங்கு ஏற்பாடு செய்யப்பட்ட சந்திப்பைக் குறிக்கிறது; ‘சந்திப்பேன்’ என்பது இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: וְדִבַּרְתִּי אִתְּךָ
  choice: உன்னோடு பேசுவேன்
  rationale: אִתְּךָ என்பதிலுள்ள உடனிகழ்வு நுட்பத்தை ‘உன்னோடு’ காக்கிறது; வெறுமனே ‘உனக்குச் சொல்வேன்’ என்று தட்டையாக்கவில்லை.
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: பாவநிவாரண மூடியின் மேலிருந்து
  rationale: הַכַּפֹּרֶת என்பது பெட்டியின் பொன் மூடியைக் குறிக்கும் வழிபாட்டுச் சொல். ‘பாவநிவாரண மூடி’ பொருளையும் பொருளின் வடிவத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: இரண்டு கேருபீன்களுக்கு நடுவிலிருந்து
  rationale: இடவியல் உறவை நேரடியாகக் காக்கிறது; கேருபீன்கள் என்பது குறிப்பிட்ட வானுலக உயிரினங்களுக்கான வழக்கமான வேதாகமப் பெயர்.
- source_word: אֲשֶׁר עַל אֲרֹן הָעֵדֻת
  choice: சாட்சிப் பெட்டியின்மேல் இருக்கும்
  rationale: הָעֵדֻת என்பதை மேலதிக விளக்கமின்றி ‘சாட்சி’ என்றும், אֲרֹן என்பதை இயல்பான தமிழில் ‘பெட்டி’ என்றும் வழங்குகிறது.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּה אוֹתְךָ
  choice: நான் உனக்குக் கட்டளையிடும் அனைத்தையும்
  rationale: כָּל என்பதன் முழுமையையும், கட்டளையின் நேரடி இலக்காக மோசே இருப்பதையும் காக்கிறது.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்கு
  rationale: தேசியக் குடும்பத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரை நவீனத் தமிழில் இயல்பாக வழங்குகிறது; אֶל என்பதன் ‘அவர்களிடம்/அவர்களுக்காக’ என்ற சுருக்கமான தொடர்பு அடிக்குறிப்பில் சுட்டப்படுகிறது.
theological_decisions:
- issue: הַכַּפֹּרֶת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரண மூடி
  alternative: அருளாசனம்
  rationale: மூலச்சொல் பெட்டியின் குறிப்பிட்ட மூடியைக் குறிக்கிறது; அதேவேளை பாவநிவாரண வழிபாட்டுத் தொடர்பையும் கொண்டுள்ளது. ‘பாவநிவாரண மூடி’ இந்த இரண்டையும் காக்கிறது; மரபுவழிப் பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயத்தில் ஆண்பால் பன்மை வடிவம் இருந்தாலும், இங்கு அது முழு தேசத்தையும் பிரதிநிதித்துவமாகக் குறிக்கிறது. நவீனத் தமிழில் ‘இஸ்ரவேல் மக்கள்’ தெளிவாகவும் உள்ளடக்கத்தைச் சுருக்காமலும் உள்ளது.
- issue: אֶל என்பதன் இலக்கு/நலன் சார்ந்த நுட்பம்
  choice: இஸ்ரவேல் மக்களுக்கு
  alternative: இஸ்ரவேல் மக்களுக்காக
  rationale: கட்டளைகள் இஸ்ரவேலரிடம் அறிவிக்கப்பட வேண்டியவை என்ற இலக்கை முதன்மைப்படுத்துகிறது; ‘அவர்களுக்காக’ என்ற சாத்தியமான நலன் சார்ந்த வாசிப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வழிபாட்டுச் சிறப்புச் சொல்லான הַכַּפֹּרֶת விளக்கமான முதன்மை வடிவில் தரப்பட்டு, மரபுவழி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. மூலத்தின் நீண்ட வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
