revisions:
- from: அங்கே நான் உன்னைச் சந்திப்பேன். சாட்சிப் பெட்டியின்மேல் இருக்கும் இரண்டு கேருபீன்களுக்கு நடுவிலிருந்து, பாவநிவாரண மூடியின்[a] மேலிருந்து உன்னோடு பேசுவேன்; இஸ்ரவேல் மக்களுக்கு[b] நான் உனக்குக் கட்டளையிடும் அனைத்தையும் கூறுவேன்.
  to: அங்கே நான் உன்னுடன் சந்திப்பேன்; சாட்சிப் பெட்டியின்மேல் இருக்கும் இரண்டு கேருபீன்களுக்கு நடுவிலிருந்து, பாவநிவாரண மூடியின்[a] மேலிருந்து, இஸ்ரவேல் மக்களுக்காக[b] நான் உனக்குக் கட்டளையிடும் அனைத்தையும் பற்றி உன்னுடன் பேசுவேன்.
  rationale: 'The revision preserves the Hebrew sequence and relationships: God meets with Moses, speaks with him from above the cover and from between the cherubim, and speaks concerning all commands directed through Moses toward Israel. It avoids making “speak with” into simply “tell,” while retaining the source-sensitive rendering and footnote alternative for the atonement cover.'
