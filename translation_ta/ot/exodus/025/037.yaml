  yaml_path: translation/ot/exodus/025/037.yaml
  text: You shall make its seven lamps[b][a], and he shall set up its lamps so that they give light in front of it.
translation:
  language: ta
  text: அதன் ஏழு விளக்குகளைச் செய்வாயாக. அவன்[b] அதன் விளக்குகளை அமைப்பான்[a]; அவை அதன் முன்புறம் நோக்கி ஒளி தரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதன் விளக்குகளை ஏற்றுவான்; அவை அதன் முன்புறம் நோக்கி ஒளி தரும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை சொற்பட விளக்குகளை மேலேற்றுவதைக் குறிக்கிறது; இச்சூழலில் அவற்றை இடத்தில் அமைத்தல் அல்லது ஏற்றுதல் என்ற பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவன்’ என்று வரும் மூன்றாம் ஆண்பால் ஒருமை எழுவாய் இவ்வசனத்தில் பெயரிடப்படவில்லை; அது விளக்குத்தண்டைப் பராமரிக்கும் ஆசாரியனைக் குறிக்க வாய்ப்புள்ளது.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செய்வாயாக
  rationale: அறிவுறுத்தல் சூழலில் மோசேயை நோக்கிய ஒருமை கட்டளையின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: அதற்காக ஏழு விளக்குகள்
  rationale: נֵר என்பதற்கு இச்சூழலில் ‘விளக்கு’ என்பது தெளிவான பொருள்; பெண்பால் ஒருமை பின்னொட்டு விளக்குத்தண்டைக் குறிக்கிறது. தமிழில் இயல்பாக இருக்க ‘அதற்காக’ என வழங்கப்பட்டுள்ளது.
- source_word: וְהֶעֱלָה
  choice: அவன் ... ஏற்றி வைப்பான்
  rationale: עלה என்பதன் ஹிப்இல் வடிவம் சொற்பட ‘மேலே போகச் செய்தல்’ எனினும், விளக்குகள் தொடர்பான இச்சூழலில் அவற்றை இடத்தில் அமைத்தல் அல்லது ஏற்றுதல் ஆகிய இரு நிழற்பொருள்களையும் கொள்ளலாம். ‘ஏற்றி வைப்பான்’ இந்தச் செயற்பாட்டு அகலத்தை இயல்பாகத் தக்கவைக்கிறது; வினை எபிரெயத்தில் மூன்றாம் ஆண்பால் ஒருமை.
- source_word: וְהֵאִיר
  choice: அப்போது அவை ... வெளிச்சம் தரும்
  rationale: விளக்குகளை ஏற்றி வைப்பதன் விளைவைத் தமிழில் தெளிவாகக் காட்டுகிறது; ‘அவை’ என்பது முன்கூறிய ஏழு விளக்குகளைக் குறிக்கிறது.
- source_word: עַל־עֵבֶר פָּנֶיהָ
  choice: அதற்கு முன்புறமாக
  rationale: விளக்குத்தண்டின் முகப்பு அல்லது முன்பக்கம் நோக்கிய வெளிச்சத்தின் திசையை இயல்பான தமிழில் தெரிவிக்கிறது; எபிரெயச் சொற்றொடரின் இடவியல் நுணுக்கத்தை முற்றிலும் கடினமாக்காமல் காக்கிறது.
theological_decisions:
- issue: וְהֶעֱלָה என்ற வினையின் பெயரிடப்படாத மூன்றாம் ஆண்பால் ஒருமை எழுவாய்
  choice: ‘அவன்’ என்று இலக்கண ஒருமையைத் தக்கவைத்து, யாரைக் குறிக்கிறது என்பதை அடிக்குறிப்பில் மட்டும் விளக்குதல்
  alternative: ‘ஆசாரியன்’ என்று நேரடியாகப் பெயரிடுதல் அல்லது ‘அவர்கள்’ என்று பன்மையாக்குதல்
  rationale: இவ்வசனம் எழுவாயை வெளிப்படையாகப் பெயரிடவில்லை. அது விளக்குத்தண்டைப் பராமரிக்கும் ஆசாரியனைக் குறிக்கலாம்; ஆனாலும் மொழிபெயர்ப்பிலேயே அந்த அடையாளத்தை உறுதிப்படுத்தாமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன தரமான தமிழில், வழிபாட்டு உபகரணங்களைப் பற்றிய கட்டளைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘செய்வாயாக’ கட்டளையின் ஒருமையைத் தக்கவைக்கிறது; ‘ஏற்றி வைப்பான்’ என்பது அமைத்தல்/ஏற்றுதல் என்ற மூலமொழியின் பொருள் அகலத்தை இயல்பாகக் காக்கிறது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
