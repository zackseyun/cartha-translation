revisions:
- from: வளையங்கள் சட்டத்திற்கு நேராக[a] இருக்க வேண்டும்; அவை மேசையைச் சுமப்பதற்கான தண்டுகளைச் செருகும் உறைகளாக[b] இருக்கும்.
  to: வளையங்கள் சுற்றுச்சட்டத்திற்கு எதிரே[a] இருக்க வேண்டும்; அவை மேசையைச் சுமப்பதற்கான தண்டுகளைச் செருகுவதற்கான உறைகளாக[b] இருக்கும்.
  rationale: The revision clarifies that the referent is the table's surrounding frame rather than a law, improves the spatial wording without claiming a precise geometry, and makes the rings' function as pole receptacles idiomatic in modern standard Tamil. The Hebrew ambiguity is retained in footnote a.
