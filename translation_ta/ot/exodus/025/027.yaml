  text: The rings shall be opposite the frame[b][a], as holders for the poles to carry the table.
translation:
  language: ta
  text: வளையங்கள் சுற்றுச்சட்டத்திற்கு எதிரே[a] இருக்க வேண்டும்; அவை மேசையைச் சுமப்பதற்கான தண்டுகளைச் செருகுவதற்கான உறைகளாக[b] இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சுற்றுச்சட்டத்தின் அருகே” அல்லது “சுற்றுச்சட்டத்திற்கு ஒத்த நிலையில்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் தொடர்புடைய இடநிலையைக் குறிக்கிறது; ஆனால் துல்லியமான அமைப்பைச் சொல்லவில்லை.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “தண்டுகளுக்கான வீடுகளாக”; அதாவது, தண்டுகளைச் செருகுவதற்கான உறைகள் அல்லது செருகிடங்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֻמַּת
  choice: நேராக
  rationale: சட்டத்துடன் தொடர்புடைய இடநிலையைச் சுட்டுகிறது; துல்லியமான வடிவியல் அமைப்பைத் தீர்மானிக்காமல் ‘எதிரே/ஒத்த நிலையில்’ என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: הַמִּסְגֶּרֶת
  choice: சட்டம்
  rationale: மேசையைச் சுற்றியுள்ள கட்டமைப்புப் பகுதியைக் குறிக்கும் மִסְגֶּרֶת என்பதற்கு நவீன தமிழில் இயல்பான கட்டுமானச் சொல்.
- source_word: תִּהְיֶיןָ
  choice: இருக்க வேண்டும்
  rationale: கட்டுமான அறிவுறுத்தலின் விதிப்பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַטַּבָּעֹת
  choice: வளையங்கள்
  rationale: சுமக்கும் தண்டுகளுக்காகப் பொருத்தப்படும் உலோக வளையங்களுக்கான வழக்கமான தெளிவான சொல்.
- source_word: לְבָתִּים
  choice: உறைகளாக
  rationale: சொல்லுக்குச் சொல் ‘வீடுகளாக’; இங்கு தண்டுகளை ஏற்றுக்கொள்ளும் செருகிடங்கள் அல்லது பிடிப்புறைகள் என்ற செயல்பாட்டுப் பொருளைத் தருகிறது.
- source_word: לְבַדִּים
  choice: தண்டுகளை
  rationale: புனிதப் பொருட்களைச் சுமக்கப் பயன்படுத்திய நீண்ட தண்டுகளைக் குறிக்கும் சூழல்சார் பொருள்.
- source_word: לָשֵׂאת
  choice: சுமப்பதற்கான
  rationale: நோக்கத்தைக் குறிக்கும் எபிரெய infinitive-ஐ இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַשֻּׁלְחָן
  choice: மேசை
  rationale: இப்பகுதியில் விவரிக்கப்படும் பரிசுத்தக் கூடார மேசைக்கான நேரடியான, வழக்கமான சொல்.
