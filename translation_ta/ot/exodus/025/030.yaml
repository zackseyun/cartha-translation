review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents all principal Hebrew elements: the command to place, the specified table, the distinct cultic designation לֶחֶם פָּנִים, the direct divine reference “before me,” and the ongoing force of תָּמִיד. “திருமுகத்து அப்பம்,” however, is not the clearest modern Tamil equivalent for the established cultic term and can evoke the unrelated sense “formal letter.”'
  naturalness: The sentence structure is natural and appropriately direct. Spacing “மேசையின் மேல்” is preferable in modern standard Tamil. “சமுகத்து அப்பம்” is an established, recognizable cultic expression and is less liable to misunderstanding than “திருமுகத்து அப்பம்.”
  terminology: Use “சமுகத்து அப்பம்” for the traditional Tamil biblical designation of “bread of the Presence.” Retain “எனக்கு முன்பாக” separately, since it renders the distinct Hebrew phrase לְפָנַי. The footnote should give the literal Hebrew expression without turning a contextual explanation into the lexical gloss.
  issues:
  - severity: medium
    issue: “திருமுகத்து அப்பம்” is potentially ambiguous and stylistically dated.
    rationale: Although it seeks to preserve the Hebrew “face,” திருமுகம் can commonly mean a formal letter in Tamil and is not the clearest designation for this tabernacle bread. “சமுகத்து அப்பம்” is the established Tamil biblical cultic term and communicates presence more readily.
  - severity: low
    issue: The footnote’s wording treats the contextual sense as an exhaustive “that is” gloss.
    rationale: The Hebrew construct is literally “bread of faces/presence.” A concise literal note preserves its wording and leaves the contextual relation to the following “before me” intact.
  revised_text: நீ மேசையின் மேல் சமுகத்து அப்பத்தை[a] எனக்கு முன்பாக எப்போதும் வைக்க வேண்டும்.
