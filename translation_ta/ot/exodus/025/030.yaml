  text: And you shall set the bread of the Presence on the table before me continually[a].
translation:
  language: ta
  text: நீ மேசையின் மேல் சமுகத்து அப்பத்தை[a] எனக்கு முன்பாக எப்போதும் வைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “முகங்களின் அப்பம்”; “இறைமுன்னிலையின் அப்பம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: நீ வைக்க வேண்டும்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு/வை’ என்பதாகும். வழிபாட்டுக்குரிய பொருளை அதற்குரிய இடத்தில் வைப்பதைக் குறிக்கும் இச்சூழலில், ‘வைக்க வேண்டும்’ என்பது கட்டளையின் தன்மையையும் இயல்பான நவீனத் தமிழையும் காக்கிறது.
- source_word: עַל הַשֻּׁלְחָן
  choice: மேசையின்மேல்
  rationale: குறிப்பிட்ட மேசையின் மேற்பரப்பில் அப்பத்தை வைப்பதை நேரடியாகக் குறிக்கிறது.
- source_word: לֶחֶם פָּנִים
  choice: திருமுகத்து அப்பம்
  rationale: இக்கூட்டுச்சொல் சொற்பொருளில் ‘முகத்தின்/முகங்களின் அப்பம்’ என வருகிறது; இங்கு அது கடவுளின் திருமுகத்துக்கு முன்பாக, அவரது முன்னிலையில் வைக்கப்படும் வழிபாட்டு அப்பத்தைக் குறிக்கிறது. ‘திருமுகத்து அப்பம்’ மூல உருவகத்தைப் பாதுகாக்கிறது; தெளிவுக்காக அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: לְפָנַי
  choice: எனக்கு முன்பாக
  rationale: சொற்பொருளில் ‘என் முகத்துக்கு முன்பாக’ என்பதைக் குறிக்கும் நேரடியான இறைபேச்சை இயல்பான தமிழில் வழங்குகிறது.
- source_word: תָּמִיד
  choice: எப்போதும்
  rationale: ஆசரிப்புக்கூடார வழிபாட்டுச் சூழலில் தொடர்ச்சியாக அல்லது தவறாமல் நிலைநிறுத்த வேண்டிய ஒழுங்கை இச்சொல் குறிக்கிறது; ‘எப்போதும்’ அதன் நீடித்த தன்மையைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: לֶחֶם פָּנִים என்னும் வழிபாட்டுச் சொற்றொடர்
  choice: திருமுகத்து அப்பம்
  alternative: சமுகத்து அப்பம்; கடவுளுக்கு முன்பாக வைக்கப்படும் அப்பம்
  rationale: தேர்ந்தெடுக்கப்பட்ட சொல் எபிரெய உருவகத்தையும், அப்பம் கடவுளின் முன்னிலையில் இருப்பதன் இறையியல் முக்கியத்துவத்தையும் பாதுகாக்கிறது. அடுத்துள்ள ‘எனக்கு முன்பாக’ என்ற தனித்த சொற்றொடருடன் இதை ஒன்றாக்காமல் இருப்பதால், மூலத்தின் தொடர்புடைய இரு வெளிப்பாடுகளும் தக்கவைக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான இறைக்கட்டளையாகவும் மரியாதைமிக்க வழிபாட்டு நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘திருமுகத்து அப்பம்’ என்ற சற்று செறிவான வழிபாட்டுச் சொல் மூலமொழியின் உருவகத்தைப் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் பொருளை சாதாரண வாசகருக்குத் தெளிவுபடுத்துகிறது.
