base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/020.yaml
  text: And the cherubim shall spread out their wings upward[a], overshadowing the mercy seat with their wings, and their faces shall be one toward another; the faces of the cherubim shall be toward the mercy seat.
translation:
  language: ta
  text: கேருபீன்கள் தங்கள் சிறகுகளை மேல்நோக்கி விரித்து, தங்கள் சிறகுகளால் பாவநிவாரண மூடியை[a] மூடியவாறு இருக்க வேண்டும். அவற்றின் முகங்கள் ஒன்றையொன்று நோக்கி இருக்க வேண்டும்; கேருபீன்களின் முகங்கள் பாவநிவாரண மூடியை நோக்கி இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிருபாசனம்.” எபிரேயத்தில் கப்போரேத் என்பது உடன்படிக்கைப் பெட்டியின் தங்க மூடியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: இருக்க வேண்டும்
  rationale: கூடார அமைப்புக்கான கட்டளையுரைக் சூழலில் இந்த வடிவம் எதிர்காலத்தை மட்டும் அல்லாமல், செய்யப்பட வேண்டிய அமைப்பையும் குறிக்கிறது.
- source_word: הַכְּרֻבִים
  choice: கேருபீன்கள்
  rationale: כְּרוּבִים என்பதன் மரபான ஒலிபெயர்ப்பைப் பேணி, இங்கு குறிப்பிடப்படும் விண்ணுலக உருவங்களைத் துல்லியமாக அடையாளப்படுத்துகிறது.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: தங்கள் சிறகுகளை மேல்நோக்கி விரித்து
  rationale: சிறகுகள் விரிக்கப்பட்ட நிலையையும் அவற்றின் மேல்நோக்கிய திசையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: סֹכְכִים בְּכַנְפֵיהֶם
  choice: அவற்றால் ... மேலிருந்து மறைத்தவாறு
  rationale: סכך என்பதிலுள்ள மேலாகப் பரந்து மூடும் காட்சியையும், சிறகுகள் அதற்கான கருவி என்பதையும் தெளிவாகப் பேணுகிறது.
- source_word: הַכַּפֹּרֶת
  choice: பாவநிவாரண மூடி
  rationale: உடன்படிக்கைப் பெட்டியின் தங்க மூடியைக் குறிக்கும் பொருட்பெயரையும் அதன் பாவநிவாரண வழிபாட்டுச் சிறப்பையும் ஒருங்கே தெரிவிக்கிறது; வெறும் ‘மூடி’ என்பதைவிடத் துல்லியமானது.
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: அவற்றின் முகங்கள் ஒன்றையொன்று நோக்கியிருக்க வேண்டும்
  rationale: ‘ஒவ்வொன்றும் தன் சகோதரனை நோக்கி’ என்ற எபிரெய விநியோக மரபுத்தொடரின் பரஸ்பரப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֶל הַכַּפֹּרֶת יִהְיוּ פְּנֵי הַכְּרֻבִים
  choice: கேருபீன்களின் முகங்கள் பாவநிவாரண மூடியை நோக்கியிருக்க வேண்டும்
  rationale: முகங்களின் திசையைத் தெளிவாகக் கூறுவதோடு, எபிரெய உரையின் concrete imagery-ஐப் பேணுகிறது.
theological_decisions:
- issue: כַּפֹּרֶת என்ற வழிபாட்டுப் பொருட்பெயரின் மொழிபெயர்ப்பு
  choice: பாவநிவாரண மூடி
  alternative: கிருபாசனம்; பெட்டியின் மூடி
  rationale: இது உடன்படிக்கைப் பெட்டியின் தங்க மூடி என்ற பொருளைக் கொண்டதோடு பாவநிவாரணச் சடங்குடன் தொடர்புடைய சிறப்புப் பெயராகவும் உள்ளது. ‘பாவநிவாரண மூடி’ இரு கூறுகளையும் வெளிப்படையாகப் பேணுகிறது; ‘கிருபாசனம்’ என்ற மரபு வழக்கை அடிக்குறிப்பில் தருவது வாசகர்களுக்கு உதவுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கட்டளையுரை பயன்படுத்தப்பட்டுள்ளது. இரு இணை வாக்கியங்களிலும் ‘முகங்கள்’ மற்றும் ‘பாவநிவாரண மூடி’ மீண்டும் வருவது எபிரெய உரையின் வலியுறுத்தலையும் உருவக்காட்சியையும் பேணுவதற்காகத் தக்கவைக்கப்பட்டுள்ளது.
