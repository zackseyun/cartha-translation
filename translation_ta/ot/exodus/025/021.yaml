base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/021.yaml
  text: And you shall put the mercy seat on top of the ark[a], and into the ark you shall put the testimony that I will give you.
translation:
  language: ta
  text: உடன்படிக்கைப் பெட்டியின் மேல் பாவநிவிர்த்தி மூடியை[a] வை. நான் உனக்குக் கொடுக்கும் சாட்சிப்பிரமாணத்தை உடன்படிக்கைப் பெட்டிக்குள் வை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் உடன்படிக்கைப் பெட்டியின் மூடியைக் குறிக்கிறது; அது பாவநிவிர்த்தியுடனும் தொடர்புடையது. மரபாக இது ‘கிருபாசனம்’ என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֹּרֶת
  choice: பாவநிவிர்த்தி மூடி
  rationale: இந்த எபிரெயச் சொல் பெட்டியின் மூடியைக் குறைப்பதோடு, வழிபாட்டுச் சூழலில் பாவநிவிர்த்தியுடனான தொடர்பையும் கொண்டுள்ளது. தமிழில் பொருளையும் பயன்பாட்டையும் தெளிவாகக் காட்டும் இயல்பான சொற்றொடர்.
- source_word: מִלְמָעְלָה
  choice: மேல்
  rationale: மூடி பெட்டியின் மேலே வைக்கப்படுவதைச் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עֵדֻת
  choice: சாட்சிப்பிரமாணம்
  rationale: உடன்படிக்கைக்குச் சான்றாக இருக்கும் பொருள் என்ற எபிரெயச் சொல்லின் பொருளைத் தக்கவைக்கிறது; இவ்வசனத்தில் வெளிப்படையாகக் கூறப்படாத ‘கற்பலகைகள்’ என்பதை உரைக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: נָתַתָּ / תִּתֵּן / אֶתֵּן
  choice: வைக்க / வைக்க / கொடுக்க
  rationale: மனிதன் பொருட்களை அமைப்பதற்கு ‘வைக்க’ என்றும், கடவுள் சாட்சிப்பிரமாணத்தை அளிப்பதற்கு ‘கொடுக்க’ என்றும் சூழலுக்கேற்ப இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶל הָאָרֹן
  choice: பெட்டிக்குள்
  rationale: אֶל என்பதன் அடிப்படைத் திசை உணர்வை, ‘வைக்க’ என்ற வினையுடன் இங்கு பொருள் கோரும் உட்புற இடமாற்றமாகத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: כַּפֹּרֶת என்ற வழிபாட்டுச் சொல்லின் மொழிபெயர்ப்பு
  choice: பாவநிவிர்த்தி மூடி
  alternative: கிருபாசனம்; மூடி
  rationale: இது உடன்படிக்கைப் பெட்டியின் மூடி என்ற நேரடிப் பொருளையும் பாவநிவிர்த்தியுடனான வழிபாட்டுத் தொடர்பையும் ஒருங்கே காட்டுகிறது. ‘கிருபாசனம்’ மரபுவழிச் சொல்லாக இருந்தாலும், நவீன வாசகருக்கு பொருளை உடனடியாகத் தெரிவிக்காது; ‘மூடி’ மட்டும் வழிபாட்டுத் தொடர்பை மறைத்துவிடலாம்.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமும் எளிய புரிதலும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘உடன்படிக்கைப் பெட்டி’ என்பது ஆரோன் என்ற வழிபாட்டுப் பொருளைத் தெளிவுபடுத்துகிறது; ‘சாட்சிப்பிரமாணம்’ மூலத்தின் உடன்படிக்கைச் சாட்சி உணர்வைப் பாதுகாக்கிறது.
