translation:
  language: ta
  text: நீ அதைத் தூய தங்கத்தால் மூட வேண்டும்; அதன் உட்புறத்தையும் வெளிப்புறத்தையும் தங்கத்தால் மூட வேண்டும். அதன்மேல் சுற்றிலும் தங்கத்தால் ஓர் அலங்கார விளிம்பை அமைக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְצִפִּיתָ / תְּצַפֶּנּוּ
  choice: பொதிய வேண்டும்
  rationale: கூடாரப் பொருட்கள் உருவாக்கப்படும் இச்சூழலில் צפה என்பது ஒரு பொருளின் மேற்பரப்பை உலோகத்தால் மூடுவதைக் குறிக்கிறது. ‘பொதிய வேண்டும்’ என்பது வெறும் மறைத்தல் என்ற பொருளைத் தவிர்த்து, தங்கத்தால் முழுமையாக மூடும் கைவினைச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கம்
  rationale: இச்சொற்றொடர் கலப்பற்ற, சுத்திகரிக்கப்பட்ட தங்கத்தைக் குறிக்கிறது. ‘தூய தங்கம்’ என்பது நவீனத் தமிழில் தெளிவானதும் வழக்கமானதும் ஆகும்.
- source_word: מִבַּיִת וּמִחוּץ
  choice: உட்புறத்திலும் வெளிப்புறத்திலும்
  rationale: எபிரெயச் சொற்றொடரின் உள்ளே–வெளியே என்ற இணையான எதிர்மறை அமைப்பைப் பாதுகாத்து, பெட்டியின் இரு மேற்பரப்புகளையும் தெளிவாகக் குறிப்பிடுகிறது.
- source_word: וְעָשִׂיתָ עָלָיו
  choice: அதைச் சுற்றிலும் … அமைக்க வேண்டும்
  rationale: עַל இங்கு பொருளின் மீது இணைக்கப்படும் அல்லது வைக்கப்படும் பகுதியைக் குறிக்கிறது. அடுத்துள்ள סָבִיב உடன் சேர்த்து இயல்பான தமிழில் அதன் இடத்தைக் காட்டுகிறது.
- source_word: זֵר
  choice: அலங்கார விளிம்பு
  rationale: இச்சூழலில் זֵר என்பது பொருளைச் சுற்றியுள்ள அலங்காரத் தடுப்பு அல்லது உயர்ந்த ஓரத்தைக் குறிக்கிறது. ‘அலங்கார விளிம்பு’ கைவினைப் பொருளின் வடிவத்தைத் தெளிவாகக் காட்டுகிறது; ‘கிரீடம்’ என்ற மரபுவழிச் சொல் உருவாக்கக்கூடிய தவறான படிமத்தைத் தவிர்க்கிறது.
- source_word: זֵר זָהָב
  choice: தங்கத்தால் ஓர் அலங்கார விளிம்பு
  rationale: விளிம்பு தங்கத்தால் செய்யப்பட்டதாக இருப்பதை இயல்பான தமிழ்ச் சொற்றொடரில் வெளிப்படுத்துகிறது.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: எல்லாப் பக்கங்களிலும் சூழ்ந்திருப்பதைக் குறிக்கும் எபிரெயச் சொல்லின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
