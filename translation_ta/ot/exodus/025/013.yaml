  text: וְ/עָשִׂ֥יתָ בַדֵּ֖י עֲצֵ֣י שִׁטִּ֑ים וְ/צִפִּיתָ֥ אֹתָ֖/ם זָהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/013.yaml
  text: You shall make poles of acacia wood and overlay them with gold.
translation:
  language: ta
  text: அக்காசியா மரத்தால் தண்டுகளைச் செய்து, அவற்றைத் தங்கத்தால் மூடுவாயாக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செய்து
  rationale: அறிவுறுத்தல் தொடரில் வரும் இணைப்புடன் கூடிய வினை வடிவம் கட்டளையின் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் அடுத்த கட்டளை வினையுடன் இணைக்கும் வினையெச்சம் இயல்பாகவும் directive force-ஐத் தெளிவாகவும் தருகிறது.
- source_word: בַדֵּי
  choice: தண்டுகளை
  rationale: பெட்டியைச் சுமப்பதற்குப் பயன்படும் நீண்ட கோல்களைக் குறிக்கிறது; நவீன தமிழில் ‘தண்டுகள்’ தெளிவானதும் சூழலுக்குப் பொருத்தமானதும் ஆகும்.
- source_word: עֲצֵי שִׁטִּים
  choice: சீத்திம் மரத்தால்
  rationale: שִׁטָּה எனும் மரப்பெயரின் அடையாளம் குறித்து தாவரவியல் உறுதியின்மை இருப்பதால், ‘அகாசியா’ என்று குறிப்பிட்ட இனமாகத் தீர்மானிக்காமல் மரபான ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: וְצִפִּיתָ
  choice: மூடுவாயாக
  rationale: மரத்தின் மேற்பரப்பைத் தங்கத்தால் மூடுதல் அல்லது மேற்பூச்சிடுதல் என்ற கைவினைச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது; கட்டளை வடிவத்தையும் காக்கிறது.
- source_word: אֹתָם
  choice: அவற்றை
  rationale: முன்னர் கூறப்பட்ட பன்மையான தண்டுகளையே நேரடி செயப்படுபொருளாகச் சுட்டுகிறது.
- source_word: זָהָב
  choice: தங்கத்தால்
  rationale: எதைக் கொண்டு மூட வேண்டும் என்பதைக் கருவிப்பொருள் வேற்றுமையில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழில் சுருக்கமான கைவினைக் கட்டளையாக வடிவமைக்கப்பட்டுள்ளது. ‘மூடுவாயாக’ கட்டளையின் வலிமையைப் பேணுகிறது; ‘சீத்திம்’ என்பது மரத்தின் துல்லிய இனத்தை அளவுக்கு மீறித் தீர்மானிப்பதைத் தவிர்க்கிறது.
