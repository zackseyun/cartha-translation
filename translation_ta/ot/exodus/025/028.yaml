translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் இரண்டு கட்டளைகளும் தமிழில் இயல்பான தொடராக அமைக்கப்பட்டுள்ளன. இவ்வசனத்தில் விளக்கக் குறிப்புத் தேவைப்படும் முக்கியமான உரை அல்லது இறையியல் ஐயம் இல்லை.
