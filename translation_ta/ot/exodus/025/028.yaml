  yaml_path: translation/ot/exodus/025/028.yaml
  text: You shall make the poles of acacia wood and overlay them with gold[a], and by them the table shall be carried.
translation:
  language: ta
  text: அகாசியா மரத்தால் தண்டுகளைச் செய்து, அவற்றைத் தங்கத்தால் போர்த்த வேண்டும்; அவற்றால் மேசையைச் சுமக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செய்து ... வேண்டும்
  rationale: அறிவுறுத்தல் தொடரில் இணைப்புடன் வரும் Qal perfect கட்டளையைக் குறிக்கிறது. நவீனத் தமிழில் ‘வேண்டும்’ அமைப்பு இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַבַּדִּים
  choice: தண்டுகள்
  rationale: பரிசுத்தப் பொருட்களைச் சுமப்பதற்காகப் பயன்படுத்தப்பட்ட நீண்ட கோல்களைக் குறிக்கிறது; ‘தண்டுகள்’ என்பது இச்சூழலில் தெளிவான, நடப்பு தமிழ்ச் சொல்.
- source_word: עֲצֵי שִׁטִּים
  choice: அகாசியா மரத்தால்
  rationale: שִׁטָּה என்பது அகாசியா வகை மரத்தைக் குறிக்கிறது. தெளிவில்லாத பாரம்பரிய ஒலிபெயர்ப்பை விட மரவகையை நேரடியாகக் குறிப்பிடுகிறது.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: அவற்றுக்குத் தங்கம் போர்த்த வேண்டும்
  rationale: கைவினைச் சூழலில் צפה என்பது ஒரு பொருளின் மேற்பரப்பை வேறொரு பொருளால் மூடுதல் அல்லது மேல்பூச்சிடுதல் என்று பொருள்படும். ‘தங்கம் போர்த்துதல்’ இயல்பாகவும் போதுமான துல்லியத்துடனும் உள்ளது.
- source_word: וְנִשָּׂא בָם
  choice: அந்தத் தண்டுகளைக் கொண்டு ... சுமக்க வேண்டும்
  rationale: נשא இங்கு மேசையைச் சுமத்தலைக் குறிக்கிறது; בָם கருவிப்பொருளை, அதாவது தண்டுகளே சுமக்கும் சாதனம் என்பதைத் தெரிவிக்கிறது. செயப்பாட்டு வடிவத்தைச் சொற்சொல்லாகப் பின்பற்றாமல், அதே பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: הַשֻּׁלְחָן
  choice: மேசையை
  rationale: முந்தைய வசனங்களில் விவரிக்கப்பட்ட குறிப்பிட்ட மேசையையே குறிக்கிறது; மூலத்தில் இல்லாத விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
