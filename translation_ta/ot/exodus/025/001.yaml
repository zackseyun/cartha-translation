  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'பின்பு யாவே[a] மோசேயிடம் கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: ‘YHWH’ (יהוה); ‘யெகோவா’ என்றும் ஒலிபெயர்க்கப்படுகிறது.'
    reason: இறைப்பெயரின் மூல வடிவத்தையும் மாற்று ஒலிபெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... பேசி
  rationale: வாவ் தொடர் வடிவம் நிகழ்ச்சியின் அடுத்த கட்டத்தை முன்னெடுப்பதால், இயல்பான தமிழ் கதைநடையில் ‘பின்பு’ எனக் கொடுக்கப்பட்டது. דּבר என்பதன் ‘பேசுதல்’ என்ற பொருளும் காக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைப்பட்டம் அல்ல, יהוה என்ற தனிப்பெயர். அதன் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட ஒலிப்பைத் தமிழில் ‘யாவே’ என்று ஒலிபெயர்த்துள்ளது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதைக் காட்டும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: לֵאמֹר
  choice: கூறியதாவது
  rationale: அடுத்து வரும் நேரடிப் பேச்சை அறிமுகப்படுத்தும் எபிரெயச் சொல்லமைப்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது; முந்தைய דּבר வினையின் தனித்தன்மையையும் முற்றிலும் அழிக்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரான יהוה நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது. வேறு மரபிலுள்ள ஒலிபெயர்ப்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய வாசிப்புத்தன்மையும் காக்கப்பட்டுள்ளன. ‘பேசி, கூறியதாவது’ என்பது தமிழில் சிறிது முறையான சொல்லமைப்பாக இருந்தாலும், דּבר மற்றும் לֵאמֹר ஆகிய இரு கூறுகளையும் காத்து அடுத்த வசனத்தின் நேரடிப் பேச்சை அறிமுகப்படுத்துகிறது.
