  text: וְ/צִפִּיתָ֥ אֹת֖/וֹ זָהָ֣ב טָה֑וֹר וְ/עָשִׂ֥יתָ לּ֛/וֹ זֵ֥ר זָהָ֖ב סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/024.yaml
  text: You shall overlay it with pure gold[a], and you shall make for it a gold molding all around.
translation:
  language: ta
  text: அதைத் தூய தங்கத்தால் மூடி, அதைச் சுற்றிலும் தங்கத்தால் ஓர் அலங்கார விளிம்பை[a] அமைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘தங்க ஓரம்’ அல்லது ‘தங்க எல்லை.’ எபிரெயச் சொல் அலங்காரமாக அமைக்கப்பட்ட ஓரத்தைக் குறிக்கலாம். மரபாகச் சிலர் இதை ‘கிரீடம்’ என்று மொழிபெயர்த்துள்ளனர்; இங்கு அது மேசையைச் சுற்றியுள்ள அலங்கார விளிம்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: மூடி
  rationale: צפה என்பது இங்கு மரத்தாலான பொருளின் மேற்பரப்பை உலோகத்தால் பொதிவதைக் குறிக்கிறது. ‘தங்கத்தால் மூடி’ என்பது அந்தக் கைவினைச் செயலை இயல்பான நவீன தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: אֹתוֹ
  choice: அதை
  rationale: இந்த ஒருமை நேர்செயப்படுபொருள் சுட்டுப்பெயர் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட மேசையைக் குறிக்கிறது.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கம்
  rationale: இந்தச் சொற்றொடர் உயர்ந்த தூய்மையுள்ள தங்கத்தைக் குறிக்கிறது; ‘தூய தங்கம்’ நேரடியானதும் வழக்கானதுமான தமிழ் இணைச்சொல்.
- source_word: וְעָשִׂיתָ
  choice: அமைக்க வேண்டும்
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்’ என்பதாக இருந்தாலும், மேசையைச் சுற்றி ஒரு விளிம்பை உருவாக்கும் இச்சூழலில் ‘அமைக்க வேண்டும்’ இயல்பான கட்டளை நடையை வழங்குகிறது.
- source_word: לּוֹ
  choice: அதைச் சுற்றிலும்
  rationale: לּוֹ என்பது அந்த மேசைக்காக அல்லது அதனுடன் இணைந்ததாக விளிம்பு செய்யப்படுவதைக் குறிக்கிறது; סָבִיב உடன் சேர்த்து தமிழில் ‘அதைச் சுற்றிலும்’ என்று இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: זֵר
  choice: அலங்கார விளிம்பு
  rationale: זֵר என்பது இங்கு மேசையைச் சுற்றியுள்ள உயர்த்தப்பட்ட அல்லது அலங்கார ஓரத்தைக் குறிக்கலாம். ‘அலங்கார விளிம்பு’ அதன் கைவினைத் தன்மையைத் தெளிவாக்குகிறது; ‘கிரீடம்’ என்ற மரபான நேரடி சொல் இச்சூழலில் தவறாகப் புரிந்துகொள்ளப்படலாம்.
- source_word: זָהָב
  choice: தங்கம்
  rationale: பொருளைக் குறிக்கும் எளிய, நேரடியான மொழிபெயர்ப்பு.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: எல்லாப் பக்கங்களையும் சுற்றி இருப்பதைக் குறிக்கும் எபிரெயச் சொல்லின் முழுமையான பொருளை இயல்பாகத் தருகிறது.
