revisions:
- from: சோகம் கற்களையும்[a], ஏபோத்திலும் மார்பணியிலும் பதிப்பதற்கான கற்களையும்[b] கொண்டுவர வேண்டும்.
  to: ஓனிக்ஸ் கற்களையும்[a], ஏபோத்துக்கும் மார்பணிக்கும் பதிப்பதற்கான கற்களையும்[b][c] கொண்டுவர வேண்டும்.
  rationale: The revision replaces an opaque stone name with the conventional Tamil form ‘ஓனிக்ஸ்’ while explicitly retaining the Hebrew lexical uncertainty. It also clarifies that the setting stones are for both the ephod and the breastpiece, and restores the traditional alternative for חֹשֶׁן in a footnote. The contextual imperative is retained because this verse continues the preceding command concerning what the Israelites are to bring.
