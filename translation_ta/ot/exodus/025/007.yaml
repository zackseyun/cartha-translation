  text: onyx stones[a], and stones for setting[c][b], for the ephod and for the breastpiece.
translation:
  language: ta
  text: ஓனிக்ஸ் கற்களையும்[a], ஏபோத்துக்கும் மார்பணிக்கும் பதிப்பதற்கான கற்களையும்[b][c] கொண்டுவர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஓனிக்ஸ்’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல்லின் துல்லியமான கல் வகை உறுதியாகத் தெரியவில்லை; இது வேறொரு விலையுயர்ந்த கல்லைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பொருத்தப்பட வேண்டிய கற்கள்’ அல்லது ‘கல் பதிப்புகளுக்கான கற்கள்.’
    reason: lexical_alternative
  - marker: c
    text: மரபாக, ‘மார்புக்கவசம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: சோகம் கற்கள்
  rationale: שֹׁהַם என்பதன் துல்லியமான கல் வகை உறுதியாகத் தெரியாததால், ஊகமான நவீன கனிமப் பெயரை மட்டும் தராமல், எபிரெயச் சொல்லின் ஒலிபெயர்ப்பான ‘சோகம்’ பயன்படுத்தப்பட்டுள்ளது; ஐயம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: אַבְנֵי מִלֻּאִים
  choice: பதிப்பதற்கான கற்கள்
  rationale: מִלֻּאִים இச்சூழலில் ஆடையிலுள்ள அமைப்புகளில் பொருத்தப்படும் அல்லது பதிக்கப்படும் கற்களைக் குறிக்கிறது. ‘பதிப்பதற்கான’ என்பது அவற்றின் பயன்பாட்டை இயல்பான தமிழில் கூறுகிறது.
- source_word: לָאֵפֹד
  choice: ஏபோத்தில்
  rationale: אֵפוֹד ஆசாரியரின் தனிப்பட்ட ஆடையைக் குறிக்கும் தொழில்நுட்பச் சொல்; உறுதியற்ற விளக்கப் பெயருக்கு மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְלַחֹשֶׁן
  choice: மார்பணியிலும்
  rationale: חֹשֶׁן கற்கள் பதிக்கப்பட்ட ஆசாரிய மார்புப் பொருளைக் குறிக்கிறது. ‘மார்பணி’ கவசம் என்ற தவறான எண்ணத்தைத் தவிர்த்து அதன் அணிகலன் இயல்பைத் தெளிவாகக் காட்டுகிறது.
