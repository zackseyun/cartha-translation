translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியலின் சுருக்கமான தன்மையைப் பேணியபடி முந்தைய வசனங்களின் ‘கொண்டுவர வேண்டும்’ என்ற வினையை இயல்புக்காக வெளிப்படையாக வழங்குகிறது. ‘ஏபோத்’ தொழில்நுட்பப் பெயராக ஒலிபெயர்க்கப்பட்டு, ‘மார்பணி’ கவசத்தைக் குறிக்கும் சொல்லைத் தவிர்க்கிறது.
