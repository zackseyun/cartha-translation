lexical_decisions:
- source_word: עֹרֹת אֵילִם
  choice: செம்மறியாட்டுக் கடாக்களின் தோல்கள்
  rationale: עֹרֹת என்பது பொருளாகப் பயன்படுத்தப்படும் விலங்குத் தோல்களையும், אֵילִם என்பது ஆண் செம்மறியாடுகளையும் குறிக்கிறது. இயற்கையான நவீன தமிழில் இரண்டையும் தெளிவாகக் கூறுகிறது.
- source_word: מְאָדָּמִים
  choice: சிவப்புச் சாயமிட்ட
  rationale: இந்த வடிவம் இயல்பாகவே சிவந்தவை என்பதைக் காட்டாமல், சிவப்பாக்கப்பட்ட தோல்களைக் குறிக்கிறது; பொருட்களின் பட்டியலில் ‘சாயமிட்ட’ என்பது அந்தச் செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֹרֹת תְּחָשִׁים
  choice: தகாஷ் தோல்கள்
  rationale: תְּחָשִׁים என்பதன் துல்லியமான விலங்கு அல்லது தோல் வகை உறுதியாகத் தெரியாததால், குறிப்பிட்ட அடையாளத்தை ஊகிக்காமல் மூலச்சொல்லின் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டு, ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עֲצֵי שִׁטִּים
  choice: அகாசியா மரம்
  rationale: שִׁטִּים என்பது பொதுவாக அகாசியா மரவகையுடன் அடையாளப்படுத்தப்படுகிறது; தமிழ் பொருட்பட்டியலில் ஒருமைப் பொருட்பெயரான ‘மரம்’ இயல்பாக உள்ளது.
