  source_fidelity: 'மூல எபிரெயத்தின் மூன்று பொருட்களும் சரியாகக் கொடுக்கப்பட்டுள்ளன: சிவப்புச் சாயமிட்ட கடாத்தோல்கள், תְּחָשִׁים-தோல்கள், அகாசியா மரம். מְאָדָּמִים என்பதன் செயற்கையாகச் சிவப்பாக்கப்பட்ட பொருளும் ‘சாயமிட்ட’ என்பதால் பாதுகாக்கப்படுகிறது. உறுதியற்ற תְּחָשִׁים சொல்லுக்கு குறிப்பிட்ட விலங்கைத் தீர்மானிக்காமல் ஒலிபெயர்ப்பைப் பயன்படுத்துவது மூலத்தின் ஐயத்தைப் பாதுகாக்கிறது.'
