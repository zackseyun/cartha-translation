    text: “தகாஷ்” என்ற எபிரெயச் சொல் குறிக்கும் விலங்கு அல்லது தோல் வகை உறுதியாகத் தெரியவில்லை; கடற்பசுத் தோல், ஓங்கில் தோல் அல்லது உயர்தரமான ஒரு தோல் வகை எனப் பலவாறு கருதப்படுகிறது.
