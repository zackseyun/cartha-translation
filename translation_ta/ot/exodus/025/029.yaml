translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. வழிபாட்டுச் சூழலைத் தெளிவுபடுத்த ‘பானபலி’ பயன்படுத்தப்பட்டது; அரிதான பாத்திரப் பெயர்களின் துல்லிய வடிவம் அடிக்குறிப்பில் திறந்தவாறே வைக்கப்பட்டுள்ளது.
