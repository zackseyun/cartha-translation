  text: וְ/עָשִׂ֨יתָ קְּעָרֹתָ֜י/ו וְ/כַפֹּתָ֗י/ו וּ/קְשׂוֹתָי/ו֙ וּ/מְנַקִּיֹּתָ֔י/ו אֲשֶׁ֥ר יֻסַּ֖ךְ בָּ/הֵ֑ן זָהָ֥ב טָה֖וֹר תַּעֲשֶׂ֥ה אֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/029.yaml
  text: You shall make its plates and its dishes[a], and its pitchers and its bowls with which the drink offering is poured[b]; you shall make them of pure gold.
translation:
  language: ta
  text: அதன் தட்டுகளையும் சிறு பாத்திரங்களையும்[a], பானபலி வார்க்கப் பயன்படும் அதன் குடங்களையும் கிண்ணங்களையும்[b] செய்வாய்; அவற்றைத் தூய தங்கத்தால் செய்வாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சிறு பாத்திரங்கள்’ என்பதற்கான எபிரெயச் சொல், உள்ளங்கை வடிவிலான கிண்ணங்கள் அல்லது சிறிய அகப்பைகள் போன்ற பாத்திரங்களையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘குடங்கள்’, ‘கிண்ணங்கள்’ என்பவற்றுக்கான எபிரெயச் சொற்கள் வழிபாட்டில் பானபலி வார்க்கப் பயன்படுத்தப்பட்ட பாத்திரங்களைக் குறிக்கின்றன; அவற்றின் துல்லியமான வடிவங்கள் உறுதியல்ல.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: קְּעָרֹתָיו
  choice: அதன் தட்டுகள்
  rationale: קְעָרָה என்பது தட்டையான பாத்திரம் அல்லது தட்டு. அப்பம் வைக்கப்படும் மேசையின் சூழலில் ‘தட்டுகள்’ என்பது இயல்பாகவும், அடுத்த பாத்திர வகையிலிருந்து வேறுபட்டதாகவும் உள்ளது.
- source_word: כַפֹּתָיו
  choice: சிறு பாத்திரங்கள்
  rationale: כַּף என்பதன் அடிப்படைப் பொருள் உள்ளங்கை வடிவிலான பொருள்; இங்கு மேசைப் பணியில் பயன்படுத்தப்பட்ட சிறிய பாத்திரங்களைக் குறிக்கிறது. அதன் துல்லியமான வடிவம் உறுதியில்லாததால் பொதுவான சொல்லாட்சி தேர்ந்தெடுக்கப்பட்டது.
- source_word: קְשׂוֹתָיו
  choice: அதன் குடங்கள்
  rationale: அரிதாக வரும் இந்த வழிபாட்டுப் பாத்திரச் சொல், திரவத்தை வைத்திருந்து வார்க்கும் பாத்திரத்தைக் குறிக்கலாம். நவீன தமிழில் ‘குடங்கள்’ அந்தச் செயல்பாட்டைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: מְנַקִּיֹּתָיו
  choice: கிண்ணங்கள்
  rationale: இந்தச் சொல் பானபலி வார்க்கும் பணியுடன் தொடர்புடைய மற்றொரு பாத்திரத்தைக் குறிக்கிறது. ‘கிண்ணங்கள்’ இயல்பான தமிழ்ச் சொல்; எனினும் பாத்திரத்தின் துல்லிய வடிவம் உறுதியல்ல.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: பானபலி வார்க்கப் பயன்படும்
  rationale: נסך என்ற வினை வழிபாட்டுச் சூழலில் பானபலியை வார்ப்பதைக் குறிக்கிறது. எபிரெயப் பயன்பாட்டின் செயப்படுபொருள் உணர்வையும் பாத்திரங்களின் பயன்பாட்டையும் இயல்பான தமிழில் இவ்வாறு தெரிவிக்கிறது.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கம்
  rationale: திருக்கூடாரப் பொருட்களுக்கான மூலப்பொருள் குறிப்பில் வழக்கமானதும் தெளிவானதுமான மொழிபெயர்ப்பு.
- source_word: וְעָשִׂיתָ ... תַּעֲשֶׂה אֹתָם
  choice: செய்வாய் ... அவற்றை ... செய்வாய்
  rationale: எபிரெய உரையில் பட்டியலுக்கு முன்னும் மூலப்பொருள் குறிப்புடனும் வரும் வினைச்சொல் மீளுரைப்பையும், ஒருமை இரண்டாம் நபருக்கான கட்டளைத் தன்மையையும் காக்கிறது.
