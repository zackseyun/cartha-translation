  text: And see that you make them according to their pattern[a], which was shown to you on the mountain.
translation:
  language: ta
  text: நீ மலையில் உனக்குக் காட்டப்பட்ட அவற்றின் மாதிரியின்படியே அவற்றைச் செய்யக் கவனமாயிரு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பார்; மலையில் உனக்குக் காட்டப்படுகிற அவற்றின் மாதிரியின்படியே அவற்றைச் செய்.”
    reason: மூலத்திலுள்ள וּרְאֵה וַעֲשֵׂה என்ற இணைக்கப்பட்ட கட்டளைகளையும், מָרְאֶה என்ற பங்கேற்பு வடிவத்தின் நிகழ்நிலை வாசிப்பையும் நேரடியாகப் பிரதிபலிக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וּרְאֵה
  choice: கவனமாயிரு
  rationale: ראה என்பதன் கட்டளை வடிவம் இங்கு வெறுமனே ‘பார்’ என்பதைக் காட்டிலும், கொடுக்கப்பட்ட மாதிரியைக் கவனமாகப் பின்பற்ற வேண்டும் என்ற எச்சரிக்கைப் பொருளில் வருகிறது. இயல்பான நவீனத் தமிழில் ‘கவனமாயிரு’ அந்தச் செயல்பாட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַעֲשֵׂה
  choice: செய்ய
  rationale: עשה என்பது ‘செய்/உருவாக்கு’ என்று பொருள்படும். முன்பு விவரிக்கப்பட்ட பொருட்களை அமைக்கும் சூழலில் ‘செய்ய’ என்பது இயல்பாகவும் பரந்த பொருளைத் தக்கவைத்தும் உள்ளது.
- source_word: בְּתַבְנִיתָם
  choice: அவற்றின் மாதிரியின்படியே
  rationale: תבנית என்பது மாதிரி, வடிவம், அல்லது திட்டவடிவைக் குறிக்கலாம். ‘மாதிரி’ மூலச்சொல்லின் திறந்த பொருளைத் தக்கவைக்கிறது; 3ஆம் நபர் ஆண்பால் பன்மை விகுதி முந்தைய பொருட்களைக் குறிக்கும் ‘அவற்றின்’ என மொழிபெயர்க்கப்படுகிறது. ‘-படியே’ துல்லியமான ஒத்திசைவை வலியுறுத்துகிறது.
- source_word: אֲשֶׁר אַתָּה מָרְאֶה
  choice: உனக்குக் காட்டப்பட்ட
  rationale: מָרְאֶה இங்கு ראה வேரின் ஹொஃபால் வினையெச்ச வடிவமாக, ‘காட்டப்படுகிற/காட்டப்பட்ட’ எனப் புரிந்துகொள்ளப்படுகிறது. மலைமேல் மோசே பெற்ற வெளிப்பாட்டைத் தமிழில் இயல்பாகச் சுட்ட ‘காட்டப்பட்ட’ தேர்ந்தெடுக்கப்பட்டது; வெளிப்படையான אַתָּה ‘உனக்கு’ என்பதில் பிரதிபலிக்கிறது.
- source_word: בָּהָר
  choice: மலையின்மேல்
  rationale: இந்தச் சூழலில் ב־ என்பது மோசே மலையில் இருந்த இடத்தைக் குறிக்கிறது. ‘மலையின்மேல்’ என்பது நவீனத் தமிழில் இயல்பான இடவியல் மொழிபெயர்ப்பு.
theological_decisions:
- issue: திருக்கூடாரப் பொருட்களுக்காக வெளிப்படுத்தப்பட்ட תבנית என்பதன் இயல்பு
  choice: மாதிரி
  alternative: வடிவம்; திட்டம்; பிரதியுரு
  rationale: ‘மாதிரி’ என்பது காண்பிக்கப்பட்ட ஒன்றிற்கு ஏற்ப பொருட்கள் செய்யப்பட வேண்டும் என்பதைத் தெரிவிக்கிறது; அது பரலோக மூலவடிவம் குறித்த குறிப்பிட்ட மெய்யியல் விளக்கத்தை உரையில் சேர்க்காமல், மூலத்தின் இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
- issue: מָרְאֶה என்பதன் காலநிலை
  choice: காட்டப்பட்ட
  alternative: காட்டப்படுகிற
  rationale: எபிரெயப் பங்கேற்பு வடிவம் தொடர்நிலை அல்லது சூழல்சார் காலப்பொருளுக்கு இடமளிக்கிறது. மலைமேல் அளிக்கப்பட்ட வெளிப்பாட்டை நினைவுறுத்தும் சூழலில் தமிழின் இறந்தகாலப் பெயரெச்சம் இயல்பானது; நிகழ்கால வாசிப்பும் சாத்தியம் என்பதால் அடிக்குறிப்பில் அது பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, மரியாதைமிக்கதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதுமான நடை. ‘கவனமாயிரு’ என்பது எபிரெய மொழிவழக்கின் எச்சரிக்கை வலிமையை இயல்பாக எடுத்துரைக்கிறது; ‘மாதிரி’ இறையியல் சார்பற்ற திறந்த சொல்லாக வைக்கப்பட்டுள்ளது.
