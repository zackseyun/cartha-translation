translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. எபிரேய வாக்கியத்தின் அறிமுக அமைப்பும் பொருட்களின் வரிசையும் காக்கப்பட்டுள்ளன; உலோகப் பெயரில் உள்ள உண்மையான தெளிவின்மை அடிக்குறிப்பில் தரப்பட்டுள்ளது.
