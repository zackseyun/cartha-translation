  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/זֹאת֙ הַ/תְּרוּמָ֔ה אֲשֶׁ֥ר תִּקְח֖וּ מֵ/אִתָּ֑/ם זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/003.yaml
  text: 'And this is the contribution that you shall take from them: gold[a], silver, and bronze.'
translation:
  language: ta
  text: 'அவர்களிடமிருந்து நீங்கள் பெற்றுக்கொள்ள வேண்டிய காணிக்கை இதுவே: தங்கம், வெள்ளி, வெண்கலம்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘செம்பு’; எபிரேயச் சொல் נְחֹשֶׁת சூழலைப் பொறுத்துச் செம்பையோ வெண்கலத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: இதுவே
  rationale: וְ உடன் வரும் זאת அடுத்து வருவதைச் சுட்டி அறிமுகப்படுத்துகிறது. தமிழில் பட்டியலை இயல்பாக அறிமுகப்படுத்த ‘இதுவே’ பொருத்தமானது; எபிரேய இணைப்புச்சொல்லைத் தனியே ‘மேலும்’ என்று மொழிபெயர்ப்பது இங்கு செயற்கையாக இருக்கும்.
- source_word: הַ/תְּרוּמָה
  choice: காணிக்கை
  rationale: תְּרוּמָה என்பது பரிசுத்த பயன்பாட்டுக்காகப் பிரித்தளிக்கப்படும் பங்களிப்பைக் குறிக்கிறது. ‘காணிக்கை’ வழிபாட்டுச் சூழலையும் மக்கள் வழங்கும் பொருட்களையும் இயல்பாகக் காட்டுகிறது; கட்டாய வரி என்ற எண்ணத்தைத் தராது.
- source_word: אֲשֶׁר תִּקְחוּ מֵ/אִתָּם
  choice: அவர்களிடமிருந்து நீங்கள் பெற்றுக்கொள்ள வேண்டிய
  rationale: לקח என்பதன் அடிப்படை உணர்வு ‘எடுத்தல்’; ஆனால் மக்கள் வழங்கும் காணிக்கையை ஏற்றுக்கொள்ளும் இச்சூழலில் ‘பெற்றுக்கொள்ள’ என்பது இயல்பான தமிழ். Qal imperfect 2ம் நபர் பன்மையின் கட்டளை/வழிகாட்டல் வலிமையை ‘வேண்டிய’ காக்கிறது.
- source_word: זָהָב
  choice: தங்கம்
  rationale: இவ்வுலோகத்துக்கான வழக்கமான நவீனத் தமிழ்ச் சொல்.
- source_word: וָ/כֶסֶף
  choice: வெள்ளி
  rationale: பொருட்களின் பட்டியலில் வரும் உலோகத்தைக் குறிக்கும் நேரான மொழிபெயர்ப்பு.
- source_word: וּ/נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: נְחֹשֶׁת செம்பையோ செம்புக் கலவையான வெண்கலத்தையோ குறிக்கலாம். திருக்கூடாரப் பொருட்களின் சூழலில் ‘வெண்கலம்’ வழக்கமானதும் சாத்தியமானதுமான தேர்வு; ‘செம்பு’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
