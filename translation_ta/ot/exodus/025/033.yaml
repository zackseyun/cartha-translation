  language: en
  yaml_path: translation/ot/exodus/025/033.yaml
  text: three almond-blossom-shaped cups on the one branch[a], with bulb and flower, and three almond-blossom-shaped cups on the one branch, with bulb and flower[c][b]; so it shall be for the six branches coming out from the lampstand.
translation:
  language: ta
  text: ஒரு கிளையில் வாதுமைப் பூ வடிவிலான மூன்று கிண்ணங்கள், ஒரு குமிழும் ஒரு பூவும்; ஒரு கிளையில் வாதுமைப் பூ வடிவிலான மூன்று கிண்ணங்கள், ஒரு குமிழும் ஒரு பூவும் இருக்க வேண்டும்.[a] விளக்குத்தண்டிலிருந்து நீளும் ஆறு கிளைகளுக்கும் இவ்வாறே இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையை இன்னும் நேரடியாக, “ஒரு கிளையில் வாதுமைப் பூக்களைப் போல் செய்யப்பட்ட மூன்று கிண்ணங்கள், குமிழும் பூவும்; ஒரு கிளையில் வாதுமைப் பூக்களைப் போல் செய்யப்பட்ட மூன்று கிண்ணங்கள், குமிழும் பூவும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  choice: கிண்ணங்கள்
  rationale: இச்சொல் கிண்ணம் போன்ற பாத்திரத்தையோ வடிவத்தையோ குறிக்கிறது; விளக்குத்தண்டின் அலங்கார அமைப்பில் ‘கிண்ணங்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: מְשֻׁקָּדִים
  choice: வாதுமைப் பூ வடிவிலான
  rationale: שקד (‘வாதுமை’) என்பதிலிருந்து வந்த இச்சொல் இங்கு பூ வேலைப்பாட்டை விவரிக்கிறது; கொட்டையின் பொதுவான வடிவம் என்று தவறாகப் புரிந்துகொள்ளாமல் இருக்க ‘வாதுமைப் பூ வடிவிலான’ என மொழிபெயர்க்கப்பட்டது.
- source_word: קָּנֶה
  choice: கிளை
  rationale: இங்கு விளக்குத்தண்டிலிருந்து பக்கவாட்டில் நீளும் பகுதியைக் குறிக்கிறது. தாவர வடிவ அலங்காரத்துடன் ‘கிளை’ பொருத்தமாக உள்ளது.
- source_word: כַּפְתֹּר
  choice: குமிழ்
  rationale: வட்டமாகப் புடைத்த அலங்காரப் பகுதியைக் குறிக்கிறது; ‘குமிழ்’ என்பது தாவர வடிவமைப்பையும் மூலச்சொல்லின் அலங்காரக் கருத்தையும் இயல்பாகத் தருகிறது.
- source_word: פֶרַח / פָרַח
  choice: பூ
  rationale: மலர் அல்லது பூவைக் குறிக்கும் சொல்லுக்கு எளிய, இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: כֵּן
  choice: இவ்வாறே
  rationale: முன் கூறப்பட்ட அமைப்பு ஆறு கிளைகளுக்கும் பொருந்த வேண்டும் என்ற ஒப்புமை மற்றும் கட்டளைத் தன்மையை வெளிப்படுத்துகிறது.
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: ஆறு கிளைகளுக்கும்
  rationale: அதே வடிவமைப்பு ஆறு கிளைகள் ஒவ்வொன்றுக்கும் பொருந்துவதைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: விளக்குத்தண்டிலிருந்து நீளும்
  rationale: கிளைகள் மைய விளக்குத்தண்டிலிருந்து வெளியே புறப்பட்டு நீள்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מְנֹרָה
  choice: விளக்குத்தண்டு
  rationale: இது கூடாரத்தின் பல கிளைகளுள்ள விளக்குத் தாங்கியைக் குறிக்கும் பொதுப்பெயர்; ஒலிபெயர்ப்பை விட பொருளைத் தரும் ‘விளக்குத்தண்டு’ தேர்ந்தெடுக்கப்பட்டது.
