translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டு உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. எபிரெய உரையின் சுருக்கமான பட்டியல் அமைப்பு தமிழில் தெளிவாக இருக்க ‘இருக்க வேண்டும்’ சேர்க்கப்பட்டது. முதல் இரு கிளைகளை எடுத்துக்காட்டி அதே அமைப்பை ஆறு கிளைகளுக்கும் பயன்படுத்தும் மூலவாக்கியத்தின் கட்டமைப்பு பேணப்பட்டது.
