translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுக் கூடாரச் சூழலுக்குரிய கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டுள்ளது. ‘கேருபீன்’ மற்றும் ‘கிருபாசனம்’ என்ற பரவலாக அறியப்படும் தொழில்நுட்பச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. எபிரெய உரையிலுள்ள ஒருமைக் கட்டளையிலிருந்து பன்மைக் கட்டளைக்கான மாற்றம் தமிழிலும் பாதுகாக்கப்பட்டுள்ளது.
