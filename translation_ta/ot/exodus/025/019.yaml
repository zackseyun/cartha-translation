  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ֠/עֲשֵׂה כְּר֨וּב אֶחָ֤ד מִ/קָּצָה֙ מִ/זֶּ֔ה וּ/כְרוּב אֶחָ֥ד מִ/קָּצָ֖ה מִ/זֶּ֑ה מִן הַ/כַּפֹּ֛רֶת תַּעֲשׂ֥וּ אֶת הַ/כְּרֻבִ֖ים עַל שְׁנֵ֥י קְצוֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/019.yaml
  text: Make one cherub on one end and one cherub on the other end[a]; from the mercy seat you shall make the cherubim on its two ends.
translation:
  language: ta
  text: ஒரு கேருபீனை ஒரு முனையிலும், மற்றொரு கேருபீனை மறுமுனையிலும் செய்.[a] கிருபாசனத்திலிருந்தே கேருபீன்களை அதன் இரு முனைகளிலும் செய்யுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் வெளிப்படையாக, ‘கிருபாசனத்தின் இரு முனைகளிலும் அதனோடு ஒரே துண்டாகக் கேருபீன்களைச் செய்யுங்கள்’ எனலாம். ‘இலிருந்து’ என்று பொருள்படும் எபிரெய முன்னிடைச்சொல், கேருபீன்கள் தனித்தனியாகச் செய்யப்பட்டுப் பின்னர் இணைக்கப்படாமல், கிருபாசனத்திலிருந்தே உருவாக்கப்பட வேண்டும் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: செய்
  rationale: அறிவுறுத்தல் தொடரில் வரும் இரண்டாம் நபர் ஒருமை கட்டளையை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது; எபிரெய இணைப்புச்சொல் தமிழில் தனியே மொழிபெயர்க்கப்பட வேண்டியதில்லை.
- source_word: כְּרוּב ... וּכְרוּב / הַכְּרֻבִים
  choice: கேருபீன் ... கேருபீன் / கேருபீன்கள்
  rationale: முதலில் ஒவ்வொரு உருவத்தையும் ஒருமையில் வேறுபடுத்திக் கூறி, பின்னர் இரண்டையும் பன்மையில் தொகுத்துக் கூறும் எபிரெய அமைப்பைப் பாதுகாக்கிறது; குறிப்பிட்ட விண்ணுலக உயிரைக் குறிக்கும் மரபான ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶחָד
  choice: ஒரு
  rationale: இரண்டு இடங்களிலும் எண்ணைக் காத்து, அறிவுறுத்தலின் சமச்சீரை வெளிப்படுத்துகிறது.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: ஒரு முனையிலும் ... மறுமுனையிலும்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘இந்த முனையிலிருந்து ... இந்த முனையிலிருந்து’ என்றிருந்தாலும், இங்கு இடத்தைக் குறிக்கும் எதிரிணையை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: מִן הַכַּפֹּרֶת
  choice: கிருபாசனத்திலிருந்தே
  rationale: מִן என்பது இங்கு மூலப்பொருள் அல்லது அதிலிருந்து உருவாக்கப்படுதல் என்ற உறவைக் குறிக்கிறது; ‘-இலிருந்தே’ என்பது கேருபீன்கள் தனியே செய்து இணைக்கப்படாமல் கிருபாசனத்திலிருந்தே உருவாக்கப்பட வேண்டும் என்பதை வலியுறுத்துகிறது. כַּפֹּרֶת என்பதற்கு வாசஸ்தலச் சூழலில் நிலைபெற்ற ‘கிருபாசனம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: תַּעֲשׂוּ
  choice: செய்யுங்கள்
  rationale: இரண்டாம் நபர் ஆண்பால் பன்மை வினைவடிவத்தை அறிவுறுத்தல் சூழலில் இயல்பான பன்மைக் கட்டளையாகக் காட்டுகிறது; முதல் கட்டளையின் ஒருமையிலிருந்து இங்குள்ள பன்மைக்கான மாற்றத்தையும் பாதுகாக்கிறது.
- source_word: עַל שְׁנֵי קְצוֹתָיו
  choice: அதன் இரு முனைகளிலும்
  rationale: கேருபீன்களின் இடத்தைத் தெளிவாகக் காட்டுகிறது; ஒருமை பின்னொட்டு கிருபாசனத்தைக் குறிக்கிறது.
