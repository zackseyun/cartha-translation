  source_fidelity: 'மூல எபிரெயப் பட்டியலின் மூன்று கூறுகளும் துல்லியமாக உள்ளன: விளக்கிற்கான எண்ணெய், அபிஷேக எண்ணெய்க்கான நறுமணப் பொருள்கள், நறுமணப் பொருள்களோடு தொடர்புடைய தூபத்திற்கான நறுமணப் பொருள்கள். שֶׁמֶן என்பதற்கு குறிப்பாக ‘ஒலிவ எண்ணெய்’ என்று மிகைப்படுத்தாமல் ‘எண்ணெய்’ என வைத்திருப்பதும் பொருத்தமானது. קְטֹרֶת הַסַּמִּים என்ற கட்டமைப்பை ‘நறுமணப் பொருள்களால் செய்யப்பட்ட தூபம்’ என இயல்பாக வெளிப்படுத்தியுள்ளமை சூழலுக்கு ஏற்றது; அடிக்குறிப்பு சொற்சார்ந்த மாற்றை பாதுகாக்கிறது.'
  naturalness: ‘விளக்கெரிக்க எண்ணெய்’ மற்றும் தொடர்ச்சியான அரைப்புள்ளிப் பட்டியல் நவீன பொதுத்தமிழில் இயல்பாகவும், வசனத்தின் பட்டியல்-நடைக்குத் தகுந்ததாகவும் உள்ளன. ‘அபிஷேக எண்ணெய்,’ ‘தூபம்’ ஆகியவை வழிபாட்டுச் சூழலில் நிலையான, புரியத்தக்க சொற்கள்.
  terminology: ‘அபிஷேக எண்ணெய்,’ ‘நறுமணப் பொருள்கள்,’ ‘தூபம்’ ஆகிய தெரிவுகள் மூலச் சொற்களின் வேறுபாட்டையும் புனிதக் கூடாரச் சூழலின் பதிவையும் நன்றாகக் காக்கின்றன. அடிக்குறிப்பு a சரியான இடத்தில் இணைக்கப்பட்டு, ‘நறுமணத் தூபம்’ என்ற இயல்பான மாற்றையும் வழங்குகிறது.
