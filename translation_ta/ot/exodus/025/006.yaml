lexical_decisions:
- source_word: שֶׁמֶן
  choice: எண்ணெய்
  rationale: எபிரெயச் சொல் பொதுவாக ‘எண்ணெய்’ எனப் பொருள்படும். இங்கு ஒலிவ எண்ணெய் குறிக்கப்படலாம் என்றாலும், மூலவாசகம் அதை வெளிப்படையாகக் குறிப்பிடாததால் பொதுச் சொல்லே வைக்கப்பட்டது.
- source_word: לַמָּאֹר
  choice: விளக்கெரிக்க
  rationale: מָאוֹר ஒளி அல்லது ஒளி தரும் சாதனத்தைக் குறிக்கலாம். கூடார வழிபாட்டுச் சூழலில் எண்ணெயின் நோக்கத்தை இயல்பான தமிழில் ‘விளக்கெரிக்க’ என்று தெரிவித்துள்ளது.
- source_word: בְּשָׂמִים
  choice: நறுமணப் பொருள்கள்
  rationale: புனித எண்ணெயும் தூபமும் தயாரிக்கப் பயன்படும் மணமுள்ள பொருள்களின் பன்மையைத் தெளிவாகக் குறிக்கும் நவீன தமிழ்ச் சொற்றொடர்.
- source_word: לְשֶׁמֶן הַמִּשְׁחָה
  choice: அபிஷேக எண்ணெய்க்கும்
  rationale: குறிப்பிட்ட புனித அபிஷேக எண்ணெயைச் சுட்டும் நோக்கக் கட்டமைப்பைச் சுருக்கமாகவும் வழக்கிலுள்ள தமிழிலும் வழங்குகிறது.
- source_word: קְטֹרֶת
  choice: தூபம்
  rationale: வழிபாட்டில் எரிக்கப்படும் நறுமணப் பொருளை இச்சூழலில் துல்லியமாகக் குறிக்கிறது.
- source_word: הַסַּמִּים
  choice: நறுமணப் பொருள்களால் செய்யப்பட்ட
  rationale: ‘நறுமணப் பொருள்களின் தூபம்’ என்ற எபிரெயத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இதன் சொற்சார்ந்த அமைப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
