  yaml_path: translation/ot/exodus/025/039.yaml
  text: He shall make it[a], with all these utensils, from a talent of pure gold.
translation:
  language: ta
  text: ஒரு தாலந்து எடையுள்ள தூய தங்கத்தால் அதையும் இந்தக் கருவிகள் அனைத்தையும் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּכָּר
  choice: ஒரு தாலந்து
  rationale: இது ஒரு நிலையான எடை அளவைக் குறிக்கிறது. ஆசரிப்புக்கூடாரச் சூழலில் வழக்கமாகப் பயன்படுத்தப்படும் ‘தாலந்து’ என்ற அளவியல் சொல்லைத் தக்கவைத்தது.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கம்
  rationale: இங்கு தங்கத்தின் தூய்மையைக் குறிக்கும் இயல்பான, கைவினைச் சூழலுக்கு ஏற்ற தமிழ்ச் சொற்றொடர்.
- source_word: יַעֲשֶׂה
  choice: செய்ய வேண்டும்
  rationale: எபிரெய வினை மூன்றாம் நபர் ஆண்பால் ஒருமையில் இருந்தாலும், அதன் எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை. கட்டளையின் பரிந்துரைப்பொருளை இயல்பான தமிழில் வெளிப்படுத்த எழுவாயற்ற ‘செய்ய வேண்டும்’ பயன்படுத்தப்பட்டது.
- source_word: אֹתָהּ
  choice: அதையும்
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் முந்தைய சூழலில் கூறப்பட்ட விளக்குத்தண்டைக் குறிக்கிறது. மூலத்தின் சுட்டுப்பெயர் வடிவத்தைப் பாதுகாக்க, ‘விளக்குத்தண்டு’ என்று விரித்துரைக்காமல் ‘அதையும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֵת כָּל הַכֵּלִים הָאֵלֶּה
  choice: இந்தக் கருவிகள் அனைத்தையும்
  rationale: כֵּלִים என்பது கருவிகள், பாத்திரங்கள் அல்லது பிற பயன்பாட்டுப் பொருட்களைக் குறிக்கக்கூடிய பரந்த சொல். விளக்குத்தண்டுடன் தொடர்புடைய பொருட்களை இங்கு இயல்பாகக் குறிக்க ‘கருவிகள்’ தேர்ந்தெடுக்கப்பட்டது.
