  source_fidelity: 'மூல எபிரெயத்தின் கட்டமைப்பும் பொருளும் பெரும்பாலும் சரியாகத் தரப்பட்டுள்ளன: பொன்னாலான நான்கு வளையங்களை வார்த்தல், அவற்றை நான்கு கால்கள்/கீழ்ப்புற ஆதரவுகளில் அமைத்தல், ஒவ்வொரு பக்கத்திலும் இரண்டு வளையங்கள் என்பன பாதுகாக்கப்பட்டுள்ளன. ஆனால் ‘ஒரு பக்கம் ... மறுபக்கம்’ என்பது הָאֶחָת ... הַשֵּׁנִית என்ற ‘ஒரு/முதல் ... இரண்டாம்’ வரிசையைச் சற்றே தளர்த்துகிறது; ‘இரண்டாம் பக்கம்’ பாதுகாப்பானது.'
