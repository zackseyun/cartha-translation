base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/012.yaml
  text: 'And you shall cast four rings of gold for it and put them on its four feet: two rings on one side of it and two rings on its second side[a].'
translation:
  language: ta
  text: 'அதற்காக நான்கு பொன் வளையங்களை வார்த்து, அவற்றை அதன் நான்கு கால்களிலும்[a] பொருத்த வேண்டும்: அதன் ஒரு பக்கத்தில் இரண்டு வளையங்களையும், அதன் இரண்டாம் பக்கத்தில் இரண்டு வளையங்களையும் பொருத்த வேண்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதன் நான்கு கால்கள்’ என்பதற்கு மாற்றாக ‘அதன் நான்கு மூலைகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல்லின் பொருள் உறுதியாக இல்லை; அது வெறும் மூலைகளைவிடப் பெட்டியின் கீழ்ப்புறத் தாங்கிகள் அல்லது அடிப்பகுதிகளைக் குறிக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצַקְתָּ
  choice: வார்த்து
  rationale: பொன்னாலான பொருத்திகளைச் செய்யும் இச்சூழலில், இந்த வினை உலோகத்தை உருக்கி வார்ப்பதைக் குறிக்கிறது; ‘வார்த்து’ என்பது இயல்பான, துல்லியமான தமிழ் சொல்.
- source_word: טַבְּעֹת
  choice: வளையங்கள்
  rationale: பெட்டியைச் சுமக்கும் தண்டுகளுக்காகப் பொருத்தப்படும் வட்ட வடிவ உலோகப் பொருத்திகளைக் குறிக்கிறது.
- source_word: זָהָב
  choice: பொன்
  rationale: மூலப்பொருளைக் குறிக்கும் நேரடியான, வழக்கமான தமிழ் மொழிபெயர்ப்பு.
- source_word: וְנָתַתָּה
  choice: பொருத்த வேண்டும்
  rationale: இங்கு வளையங்களை வெறுமனே வைப்பதல்ல, பெட்டியோடு இணைப்பதே கருத்து; கட்டுமான அறிவுறுத்தலில் ‘பொருத்த வேண்டும்’ தெளிவாக உள்ளது.
- source_word: פַּעֲמֹתָיו
  choice: அதன் நான்கு கால்கள்
  rationale: பொருள் உறுதியாக இல்லாவிட்டாலும், இச்சூழலில் பெட்டியின் கீழ்ப்புறத் தாங்கிகள் அல்லது கால் போன்ற பகுதிகளைக் குறிக்கலாம். உறுதியின்மையை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: צַלְעוֹ
  choice: அதன் பக்கம்
  rationale: கட்டுமானப் பொருளின் பக்கவாட்டைக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: ஒரு பக்கம் ... மறுபக்கம்
  rationale: எபிரெய உரையின் இரு எதிரெதிர்ப் பக்கங்களைக் குறிக்கும் வரிசையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
