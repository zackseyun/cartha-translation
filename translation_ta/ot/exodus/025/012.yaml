translation_notes:
  register: நவீன நிலையான தமிழில், கட்டுமான அறிவுறுத்தலுக்கேற்ற தெளிவான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வேண்டும்’ வடிவம் கட்டளையின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தில் உள்ள கடினமான சொல்லுக்கான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
