translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. எபிரெய மூலத்தின் பெயர்ச்சொல் தொடர் தமிழில் முழுமையான விதிப்பொருள் வாக்கியமாக இயல்பாக்கப்பட்டுள்ளது. ‘வாதுமை’ என்பது almond மரத்திற்கான தெளிவான தமிழ் பெயராகப் பயன்படுத்தப்பட்டது; வடிவமா அலங்காரமா என்ற மூலத்தின் ambiguity அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
