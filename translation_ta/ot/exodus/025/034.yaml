  yaml_path: translation/ot/exodus/025/034.yaml
  text: And on the lampstand there shall be four cups made like almond blossoms[b][a], with its buds and its flowers.
translation:
  language: ta
  text: விளக்குத்தண்டில் வாதுமைப் பூக்களைப் போல் வடிவமைக்கப்பட்ட நான்கு கிண்ணங்களும்,[a] அதன் மொட்டுகளும்[b] அதன் பூக்களும் இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வாதுமை வடிவிலான” அல்லது “வாதுமைப் பூக்களால் அலங்கரிக்கப்பட்ட.” எபிரெயச் சொல் வாதுமை மரத்தை அடிப்படையாகக் கொண்ட உருவகத்தைப் பயன்படுத்துகிறது; அது வடிவத்தையோ அலங்காரத்தையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதன் குமிழ்கள்.” எபிரெயச் சொல் விளக்குத்தண்டிலுள்ள வட்டமான அலங்காரப் புடைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: விளக்குத்தண்டில்
  rationale: בְּ முன்னொட்டு இங்கு விளக்குத்தண்டின் மேல் அல்லது அதனோடு அமைந்த அலங்காரக் கூறுகளைக் குறிக்கிறது. தமிழில் இயல்பாகவும் பொருளுக்கேற்றவாறும் ‘விளக்குத்தண்டில்’ என வழங்கப்பட்டது; மְנֹרָה என்பது தனி விளக்கை அல்ல, விளக்குத்தண்டைக் குறிக்கிறது.
- source_word: אַרְבָּעָה
  choice: நான்கு
  rationale: கிண்ணங்களின் எண்ணிக்கையைக் குறிக்கும் நேரடியான எண்ணுப்பெயர்.
- source_word: גְבִעִים
  choice: கிண்ணங்கள்
  rationale: கிண்ணம் அல்லது கோப்பை போன்ற குழிவான வடிவங்களைக் குறிக்கும் சொல். வழிபாட்டுக் கூடாரப் பொருளின் அலங்கார அமைப்பை நவீன தமிழில் தெளிவாகச் சொல்கிறது.
- source_word: מְשֻׁקָּדִים
  choice: வாதுமைப் பூக்களைப் போல் வடிவமைக்கப்பட்ட
  rationale: שׁקד என்ற வாதுமை மரத்தைச் சார்ந்த இந்த வடிவம், கிண்ணங்கள் வாதுமைப் பூ வடிவில் செய்யப்பட்டதையோ அத்தகைய அலங்காரம் பெற்றதையோ குறிக்கலாம். முதன்மை மொழிபெயர்ப்பு உருவ ஒப்புமையைத் தெளிவாகத் தருகிறது; துல்லியமான நுணுக்கத்தின் தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: כַּפְתֹּרֶיהָ
  choice: அதன் மொட்டுகள்
  rationale: כפתר என்பது வட்டமான புடைப்பு அல்லது அலங்கார முடிச்சைக் குறிக்கும். விளக்குத்தண்டின் தாவர உருவகத்தோடு பொருந்துவதால் ‘மொட்டுகள்’ தேர்ந்தெடுக்கப்பட்டது; ‘குமிழ்கள்’ என்ற வடிவவியல் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּפְרָחֶיהָ
  choice: அதன் பூக்களும்
  rationale: פֶּרַח என்பது பூ அல்லது மலரைக் குறிக்கிறது. ‘பூக்கள்’ என்பது எளிய, இயல்பான நவீனத் தமிழ்; அருகிலுள்ள ‘மொட்டுகள்’ என்பதோடு தெளிவாக இணைகிறது.
