  text: And you shall put the poles into the rings on the sides of the ark[a], to carry the ark with them.
translation:
  language: ta
  text: பெட்டியின் பக்கங்களில் உள்ள வளையங்களுக்குள் தண்டுகளை இடு; அவற்றால் பெட்டியைச் சுமப்பதற்காக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הֵֽבֵאתָ
  choice: கொண்டுவா
  rationale: בוא என்பதன் அடிப்படைப் பொருளான ‘கொண்டுவருதல்’ என்பதைப் பேணுகிறது; வளையங்களுக்குள் என்ற தொடரால் தண்டுகளைச் செலுத்தும் செயல் இயல்பாகத் தெளிவாகிறது.
- source_word: הַ/בַּדִּים
  choice: தண்டுகள்
  rationale: புனிதப் பெட்டியைச் சுமப்பதற்குப் பயன்படுத்தப்படும் நீண்ட கோல்களை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: בַּ/טַּבָּעֹת
  choice: வளையங்களுக்குள்
  rationale: இங்கு בְ என்பது வளையங்களுக்குள் தண்டுகளைச் செலுத்துவதைக் குறிக்கிறது; ‘உள்ளே’ என்ற இயக்கத்தைத் தமிழ் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַל צַלְעֹת הָ/אָרֹן
  choice: பெட்டியின் பக்கங்களிலுள்ள
  rationale: צלעות என்பது இங்கு பெட்டியின் பக்கங்கள் அல்லது பக்கப் பகுதிகளைக் குறிக்கிறது; வளையங்களின் இருப்பிடத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הָ/אָרֹן
  choice: பெட்டி
  rationale: אָרוֹן என்பதன் நேரடிப் பொருள் ‘பெட்டி’; இந்தப் பகுதியில் உடன்படிக்கைப் பெட்டிக்கான கட்டுமான வழிமுறையே சூழல் என்பதால் எளிய பெயர்ச்சொல் போதுமானது.
- source_word: לָ/שֵׂאת
  choice: சுமக்க
  rationale: נשא இங்கு பொருளைத் தூக்கிச் செல்லும் உடல்சார் செயலைக் குறிக்கிறது; ‘சுமக்க’ என்பது இயல்பான, துல்லியமான தமிழ்.
- source_word: בָּ/הֶם
  choice: அவற்றைக் கொண்டு
  rationale: பன்மைப் பிரதிப்பெயர் தண்டுகளைக் குறிக்கிறது; கருவிப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
