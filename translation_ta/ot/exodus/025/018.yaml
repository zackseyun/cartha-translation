base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/018.yaml
  text: And you shall make two cherubim of gold; of hammered work you shall make them[a], at the two ends of the mercy seat.
translation:
  language: ta
  text: “பொன்னால் இரண்டு கேருபீன்களைச் செய்ய வேண்டும். பாவநிவாரண மூடியின்[a] இரு முனைகளிலும் அவற்றை அடித்து வடிவமைத்துச் செய்ய வேண்டும்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிருபாசனம்.” எபிரெயச் சொல் உடன்படிக்கைப் பெட்டியின் மூடியைக் குறிக்கிறது; பாவநிவாரணச் சடங்குடன் தொடர்புடைய இந்தப் புனிதப் பொருள் மரபாக “கிருபாசனம்” என்றும் அழைக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செய்ய வேண்டும்
  rationale: அறிவுறுத்தல் சூழலில் கட்டளையை வெளிப்படுத்தும் வினை வடிவத்தை நவீனத் தமிழில் இயல்பான கட்டளை நடையாக வழங்குகிறது.
- source_word: שְׁנַיִם כְּרֻבִים
  choice: இரண்டு கேருபீன்களை
  rationale: எண்ணிக்கையை நேரடியாகக் காக்கிறது; ‘கேருபீன்கள்’ என்பது குறிப்பிட்ட விண்ணுலக உயிரினங்களைக் குறிக்கும் மரபான ஒலிபெயர்ப்பு.
- source_word: זָהָב
  choice: பொன்னால்
  rationale: அவை செய்யப்பட வேண்டிய மூலப்பொருள் பொன் என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִקְשָׁה
  choice: அடித்து வடிவமைத்து
  rationale: உலோகத்தைச் சுத்தியலால் அடித்து உருவாக்கும் செய்முறையைத் தெளிவாகச் சொல்கிறது; மூலச்சொல் நேரடியாகக் கூறாத ‘ஒரே துண்டாக’ என்ற விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: அவற்றை ... செய்ய வேண்டும்
  rationale: எபிரெய உரையில் ‘செய்’ என்ற வினை மீண்டும் வருவதைத் தமிழிலும் தக்கவைத்து, செய்முறைக்கு அளிக்கப்படும் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: מִשְּׁנֵי קְצוֹת
  choice: இரு முனைகளிலும்
  rationale: மூடியின் இரண்டு முனைகளோடும் கேருபீன்கள் தொடர்புடைய இடஅமைப்பை இயல்பான தமிழில் தெரிவிக்கிறது; அவை தனியே பொருத்தப்பட்டவையா அல்லது முனைகளிலிருந்தே உருவாக்கப்பட்டவையா என்பதை தேவையின்றி முடிவுசெய்யவில்லை.
- source_word: הַכַּפֹּרֶת
  choice: பாவநிவாரண மூடி
  rationale: இது உடன்படிக்கைப் பெட்டியின் மூடி என்பதையும் அதன் சடங்கியல் பாவநிவாரணத் தொடர்பையும் நவீன வாசகருக்குத் தெளிவாகக் காட்டுகிறது; மரபான ‘கிருபாசனம்’ அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: கூடார ஆராதனைச் சூழலில் הַכַּפֹּרֶת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரண மூடி
  alternative: கிருபாசனம்; மூடி
  rationale: இந்தப் பெயர் பெட்டியின் பொன் மூடியைக் குறிக்கிறது; அதே நேரத்தில் பாவநிவாரணச் சடங்கோடும் தொடர்புடையது. ‘பாவநிவாரண மூடி’ பொருளையும் பயன்பாட்டையும் வெளிப்படையாக வைத்திருக்கிறது. மரபான இறையியல் சொல்லான ‘கிருபாசனம்’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; இதனால் ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கம் மட்டும் உரையில் திணிக்கப்படுவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. தொழில்நுட்பப் பொருளுடைய ‘கேருபீன்கள்’ ஒலிபெயர்ப்பாக வைக்கப்பட்டுள்ளது; உற்பத்தி முறை மற்றும் புனிதப் பொருளின் பெயர் தெளிவாகவும் அளவுக்கு மீறிய விளக்கமின்றியும் தரப்பட்டுள்ளன.
