  text: And you shall make for it four gold rings[b][a], and you shall put the rings on the four corners that are at its four feet.
translation:
  language: ta
  text: அதற்கு நான்கு தங்க வளையங்களைச் செய்து, அதன் நான்கு கால்களுக்குரிய நான்கு மூலைகளில்[a] அந்த வளையங்களை வைக்க வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நான்கு மூலைகள்” என்பதற்கு “நான்கு பக்கங்கள்” அல்லது “நான்கு ஓரங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் சூழலுக்கேற்ப “கால்கள்” அல்லது “பாதங்கள்” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செய்து ... வேண்டும்
  rationale: அறிவுறுத்தல் தொடரில் இணைப்புடன் வரும் Qal perfect கட்டளை வலிமையைக் கொண்டுள்ளது; தமிழில் தொடர்வினையெச்சமும் இறுதி ‘வேண்டும்’ என்பதும் இயல்பாக அந்த வலிமையை வெளிப்படுத்துகின்றன.
- source_word: לּוֹ
  choice: அதற்காக
  rationale: ஆண்பால் ஒருமை பின்னொட்டு முன்சூழலில் கூறப்பட்ட மேசையைக் குறிக்கிறது; உயிரற்ற பொருளுக்கான இயல்பான தமிழ் வடிவம் இது.
- source_word: אַרְבַּע טַבְּעֹת זָהָב
  choice: நான்கு தங்க வளையங்கள்
  rationale: எண்ணிக்கையையும் பொருளையும் தெளிவாகக் காக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: וְנָתַתָּ
  choice: பொருத்த வேண்டும்
  rationale: נתן அடிப்படையில் ‘வைக்க’ என்று பொருள்பட்டாலும், கட்டுமானச் சூழலில் வளையங்களை குறிப்பிட்ட இடங்களில் உறுதியாக அமைப்பதை ‘பொருத்த’ என்பது இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַל
  choice: -இல்
  rationale: குறிப்பிட்ட இடத்தின் மீது அல்லது அங்கு வளையங்கள் அமைக்கப்படுவதைத் தமிழில் இடவேற்றுமை இயல்பாகக் காட்டுகிறது.
- source_word: אַרְבַּע הַפֵּאֹת
  choice: நான்கு மூலைகள்
  rationale: פֵּאָה ஓரம், பக்கம், மூலை ஆகியவற்றைக் குறிக்கலாம்; மேசையின் நான்கு ஆதாரப் பகுதிகளுடன் இணைந்த இடங்களைச் சுட்டும் இச்சூழலில் ‘மூலைகள்’ பொருத்தமானது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: அதன் நான்கு கால்களருகே உள்ள
  rationale: רֶגֶל ‘கால்’ அல்லது ‘பாதம்’ எனப் பொருள்படும். மேசை போன்ற பொருளுக்கு ‘கால்’ இயல்பானது; לְ குறிக்கும் தொடர்பு/இடத்தை ‘அருகே’ என வழங்குவது வளையங்களின் அமைவிடத்தைத் தெளிவாக்குகிறது, எனினும் உறுதியான துல்லிய இடத்தை மிகைப்படுத்தவில்லை.
