base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/002.yaml
  text: Speak to the sons of Israel[a], that they take an offering for me. From every man whose heart moves him[c][b], you shall take my offering.
translation:
  language: ta
  text: “இஸ்ரவேலின் மக்களிடம்[a] பேசு. எனக்காக ஒரு காணிக்கையை[b] அவர்கள் சேகரிக்கட்டும். தன் உள்ளம் தூண்டும் ஒவ்வொருவனிடமிருந்தும்[c] என் காணிக்கையை நீங்கள் பெற்றுக்கொள்ளுங்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “இஸ்ரவேலின் மகன்கள்”; இது இஸ்ரவேல் மக்களுக்கான வழக்கமான உடன்படிக்கைப் பெயர்.
    reason: cultural_note
  - marker: b
    text: “பங்களிப்பு” அல்லது “அர்ப்பணம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பரிசுத்தப் பயன்பாட்டுக்கெனப் பிரித்து வழங்கப்படும் ஒன்றைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “தன் உள்ளம் ஏவும் ஒவ்வொருவனிடமிருந்தும்” என்றும் மொழிபெயர்க்கலாம். இந்த எபிரெய மரபுத்தொடர் உள்ளார்ந்த தன்னார்வ விருப்பத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: …இடம் பேசு
  rationale: பியேல் கட்டளை வடிவத்தின் நேரடியான கட்டளைத் தன்மையையும் אֶל என்பதன் ‘இடம்/நோக்கி’ உறவையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: இது இஸ்ரவேல் மக்களைக் குறிக்கும் வழக்கமான உடன்படிக்கைப் பெயர். சொற்சொல்லான ‘இஸ்ரவேலின் மகன்கள்’ என்பதைவிட ‘மக்கள்’ நவீன தமிழில் இயல்பாகவும் மொத்த சமூகத்தையும் தெளிவாகவும் குறிக்கிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְיִקְחוּ לִי
  choice: அவர்கள் எனக்கென்று … எடுத்துவரட்டும்
  rationale: கட்டளையைத் தொடர்ந்து வரும் வினை வடிவத்தின் வேண்டுகோள்/கட்டளை நுணுக்கத்தை ‘எடுத்துவரட்டும்’ காக்கிறது. לִי இங்குக் காணிக்கை கடவுளுக்கென ஒதுக்கப்படுவதை ‘எனக்கென்று’ தெரிவிக்கிறது.
- source_word: תְּרוּמָה
  choice: காணிக்கை
  rationale: பரிசுத்தப் பயன்பாட்டுக்கெனப் பிரித்தளிக்கப்படும் பங்களிப்பை இச்சூழலில் ‘காணிக்கை’ இயல்பாகக் குறிக்கிறது; பலியைக் குறிக்கும் தேவையற்ற சிறப்புப் பொருளைச் சேர்ப்பதில்லை.
- source_word: מֵאֵת כָּל אִישׁ
  choice: ஒவ்வொருவனிடமிருந்தும்
  rationale: எபிரெயச் சொற்றொடரின் பகிர்வுநிலை ஒருமையையும் ஆண்பால் வடிவத்தையும் காக்கிறது.
- source_word: אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ
  choice: தன் உள்ளம் தூண்டும்
  rationale: ‘உள்ளம்’ செயப்பொருளைத் தூண்டுகிறது என்ற எபிரெய உருவகத்தைச் சுருக்கமாகக் காத்து, உள்ளார்ந்த தன்னார்வ முனைப்பை உணர்த்துகிறது; தனியே ‘மனமுவந்து’ என்ற வினையடையைச் சேர்த்து பொருளை மிகுதியாக விளக்கவில்லை.
- source_word: תִּקְחוּ אֶת תְּרוּמָתִי
  choice: என் காணிக்கையை நீங்கள் பெற்றுக்கொள்ளுங்கள்
  rationale: இரண்டாம் நபர் பன்மைக் கட்டளையை வெளிப்படையாகக் காக்கிறது. கொடுப்பவரிடமிருந்து காணிக்கையை ஏற்றுக்கொள்ளும் சூழலில் ‘பெற்றுக்கொள்ளுங்கள்’ என்பது இயல்பான தமிழ்; ‘என் காணிக்கை’ என்ற இறை உரிமையும் நேரடியாகப் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: திருப்பணிக்கான תְּרוּמָה என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: காணிக்கை
  alternative: பங்களிப்பு / அர்ப்பணம்
  rationale: கூடாரப் பணிக்காகக் கடவுளுக்கென வழங்கப்படும் பொருளின் பரிசுத்த நோக்கை ‘காணிக்கை’ காட்டுகிறது; அதேவேளையில் இதை ஒரு குறிப்பிட்ட பலிவகையாக மாற்றுவதில்லை.
- issue: אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ என்பதில் தன்னார்வத்தின் வெளிப்பாடு
  choice: தன் உள்ளம் தூண்டும்
  alternative: தன் உள்ளம் மனமுவந்து கொடுக்கத் தூண்டும்
  rationale: மூலத்தின் ‘உள்ளம் அவனைத் தூண்டுகிறது’ என்ற உருவகத்தையும் அதன் உள்ளார்ந்த முனைப்பையும் காக்கிறது. ‘மனமுவந்து கொடுக்க’ என்பது சரியான விளக்கமாக இருந்தாலும், மூலத்தில் தனி வினையடையாக இல்லாததை முதன்மை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியான இறைக் கட்டளைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘எடுத்துவரட்டும்’ மற்றும் ‘பெற்றுக்கொள்ளுங்கள்’ ஆகியவை கொடுப்பவர்களுக்கும் காணிக்கையை ஏற்றுக்கொள்பவர்களுக்கும் இடையிலான பார்வை வேறுபாட்டை இயல்பாக வெளிப்படுத்துகின்றன. எல்லா அடிக்குறிப்பு சுட்டிகளும் உரையில் தொடர்புடைய இடங்களில் இடம்பெற்றுள்ளன.
