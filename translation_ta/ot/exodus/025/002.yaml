  source_fidelity: 'முதன்மைச் சிக்கல் ‘எடுத்துவரட்டும்’ என்பதில் உள்ளது: וְיִקְחוּ (‘எடுத்துக்கொள்ள/பெற/சேகரிக்கட்டும்’) என்பதில் இல்லாத ‘கொண்டு வருதல்’ என்ற திசைநோக்குப் பொருளை அது சேர்க்கிறது. இச்சூழலில் காணிக்கையைச் சேகரிப்பதைக் குறிக்கும் வினை இயல்பாகவும் மூலத்திற்கு உண்மையாகவும் இருக்கும். மற்ற முக்கிய கூறுகள்—‘இஸ்ரவேலின் மக்கள்,’ ‘எனக்காக,’ உள்ளம் தூண்டுதல், ‘என் காணிக்கை’—மூலத்தின் பொருளை நன்றாகக் காக்கின்றன.'
