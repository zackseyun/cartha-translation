  text: நீலநிற நூல், ஊதாநிற நூல், கருஞ்சிவப்பு நூல்[a], மெல்லிய ஆளிநூல், வெள்ளாட்டு மயிர்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, ‘செந்நிறப் பூச்சி’ எனும் பொருளுடைய சொற்றொடர்; ‘செந்நிற நூல்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
