lexical_decisions:
- source_word: תְכֵלֶת
  choice: நீலநிற நூல்
  rationale: இச்சொல் நீலம் அல்லது நீலம் கலந்த ஊதா நிறத்தில் சாயமிடப்பட்ட விலையுயர்ந்த நெசவுப் பொருளைக் குறிக்கிறது. காணிக்கையாகக் கொண்டுவரப்படும் பொருட்களின் பட்டியலில், சூழல் உணர்த்தும் நூல் என்ற பொருளை வெளிப்படையாகச் சேர்ப்பது தமிழில் இயல்பாக உள்ளது.
- source_word: אַרְגָּמָן
  choice: ஊதாநிற நூல்
  rationale: இது விலையுயர்ந்த ஊதா நிறச் சாயமிட்ட நெசவுப் பொருளைக் குறிக்கிறது. நிறத்தையும், பட்டியலின் சூழலில் உள்ள பொருள் வகையையும் தெளிவாகக் காட்டுகிறது.
- source_word: תוֹלַעַת שָׁנִי
  choice: செந்நிற நூல்
  rationale: சொற்றொடர் சொற்படியாகப் பூச்சியிலிருந்து பெறப்பட்ட செந்நிறச் சாயத்தைச் சுட்டுகிறது; இங்கு அந்தச் சாயம் ஏற்றப்பட்ட நெசவுப் பொருளே நோக்கமாக இருப்பதால் ‘செந்நிற நூல்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שֵׁשׁ
  choice: மெல்லிய சணல் நூல்
  rationale: திருக்கூடாரப் பொருட்கள் பற்றிய சூழலில் இச்சொல் உயர்தரமான மெல்லிய சணல் நாரால் செய்யப்பட்ட நூல் அல்லது துணியைக் குறிக்கிறது. ‘மெல்லிய சணல் நூல்’ என்பது அதன் பொருளையும் தரத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עִזִּים
  choice: வெள்ளாட்டு மயிர்
  rationale: எபிரெயத்தில் சொற்படியாக ‘வெள்ளாடுகள்’ என்றாலும், நெசவுப் பொருட்களின் பட்டியலில் வெள்ளாடுகளிலிருந்து பெறப்படும் மயிரே குறிக்கப்படுகிறது.
