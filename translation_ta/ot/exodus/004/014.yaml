base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/014.yaml
  text: Then Yahweh’s anger burned against Moses[a], and he said, “Is there not Aaron your brother, the Levite? I know that he can speak well. And also, look, he is coming out to meet you; when he sees you, he will rejoice in his heart.”
translation:
  language: ta
  text: அப்போது மோசேயின்மேல் யாவேக்குக் கோபம் மூண்டது. அவர், “லேவியனான உன் சகோதரன் ஆரோன் இருக்கிறான் அல்லவா? அவனால் நன்றாகப் பேச முடியும் என்று எனக்குத் தெரியும்[a]. மேலும், இதோ, அவன் உன்னைச் சந்திக்கப் புறப்பட்டு வருகிறான். அவன் உன்னைக் காணும்போது உள்ளத்தில் மகிழ்வான்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் சரளமாகப் பேசுவான் என்று எனக்குத் தெரியும்”; இன்னும் சொற்சொறாக, “பேசவே பேசுவான்.”
    reason: דַבֵּר יְדַבֵּר என்ற எபிரெய வலியுறுத்தல் அமைப்பு பேச்சுத் திறனையோ, சரளத்தையோ, உறுதியாகப் பேசுவதையோ சூழலின்படி உணர்த்தக்கூடும்.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: கோபம் மூண்டது
  rationale: எபிரெய மொழியின் ‘கோபம் எரிதல்/மூளுதல்’ என்ற உருவகத்தை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הֲלֹא אַהֲרֹן אָחִיךָ הַלֵּוִי
  choice: லேவியனான உன் சகோதரன் ஆரோன் இருக்கிறான் அல்லவா?
  rationale: உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் எபிரெய வினாவையும், ஆரோனின் லேவி குல அடையாளத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יָדַעְתִּי כִּי דַבֵּר יְדַבֵּר הוּא
  choice: அவனால் நன்றாகப் பேச முடியும் என்று எனக்குத் தெரியும்
  rationale: வினைமுற்றுடன் வரும் வினையெச்சத்தின் வலியுறுத்தலை, சூழலில் ஆரோனின் பேச்சுத் திறனைக் குறிக்கும் இயல்பான தமிழால் தெரிவிக்கிறது; சொற்சொறான மீளுரையை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: וְגַם הִנֵּה
  choice: இதோ
  rationale: அடுத்த செய்தியின்மீது கவனத்தை ஈர்க்கும் சுட்டும் வலியுறுத்தலும் நவீனத் தமிழில் சுருக்கமாக வெளிப்படுகின்றன.
- source_word: יֹצֵא לִקְרָאתֶךָ
  choice: உன்னைச் சந்திக்கப் புறப்பட்டு வருகிறான்
  rationale: நடந்துகொண்டிருக்கும் அல்லது உடனடியாக நிகழும் செயலைக் குறிக்கும் எபிரெயப் பெயரெச்சத்தின் நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: וְרָאֲךָ
  choice: அவன் உன்னைக் காணும்போது
  rationale: அடுத்த விளைவுக்கான காலச் சூழலைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְשָׂמַח בְּלִבּוֹ
  choice: உள்ளத்தில் மகிழ்வான்
  rationale: மகிழ்ச்சி உள்ளார்ந்தது என்பதை வெளிப்படையாகக் கூறும் மூலமொழிப் பொருளைக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் தனிப்பட்ட இறைப்பெயரையே பயன்படுத்துவதால், அதை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: דַבֵּר יְדַבֵּר என்பதன் வலியுறுத்தல்
  choice: அவனால் நன்றாகப் பேச முடியும்
  alternative: அவன் நிச்சயமாகப் பேசுவான்
  rationale: மோசேயின் பேச்சுத் தயக்கத்துக்கு எதிராக ஆரோனின் பேச்சுத் திறனைக் கடவுள் சுட்டுகிறார் என்ற உடனடிச் சூழலை முதன்மைப்படுத்துகிறது; ஆயினும் வலியுறுத்தல் வெறும் திறமையையா அல்லது உறுதியான செயலைவா குறிக்கிறது என்ற மொழியியல் இடைவெளியை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. ‘யாவே’ இறைப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது; ‘கோபம் மூண்டது’ என்ற மொழி எபிரெய உருவகத்தை இயல்பாகத் தக்கவைக்கிறது. அடிக்குறி அது விளக்கும் பேச்சுத் திறன் தொடரின் உடனேயே வைக்கப்பட்டுள்ளது.
