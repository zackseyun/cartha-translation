revisions:
- from: பின்பு மோசேயும் ஆரோனும் போய், இஸ்ரவேலின் மகன்களுடைய[a] மூப்பர்கள் அனைவரையும் ஒன்றுகூட்டினார்கள்.
  to: பின்பு மோசேயும் ஆரோனும் போய், இஸ்ரவேல் மக்களின்[a] எல்லா மூப்பர்களையும் ஒன்றுகூட்டினார்கள்.
  rationale: The revision replaces an awkward nested genitive with idiomatic Tamil while retaining the source's communal ancestral designation through «இஸ்ரவேல் மக்கள்». The footnote continues to document both the ethnonymic alternative and the traditional kinship-based rendering. No change has been made to the narrative sequence, totality, or the leadership sense of «elders».
