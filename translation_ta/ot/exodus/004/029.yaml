base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/029.yaml
  text: Then Moses and Aaron went and gathered all the elders of the sons of Israel[a].
translation:
  language: ta
  text: பின்பு மோசேயும் ஆரோனும் போய், இஸ்ரவேல் மக்களின்[a] எல்லா மூப்பர்களையும் ஒன்றுகூட்டினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “இஸ்ரவேலர்”; மரபாக “இஸ்ரவேல் புத்திரர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: போய்
  rationale: הלך என்பதன் wayyiqtol வடிவம் இங்கு கதைநிகழ்வைத் தொடர்ந்து நகர்த்தும் எளிய ‘போ’ என்ற பொருளைக் கொண்டுள்ளது. எபிரெயத்தில் வினை ஒருமையில் இருந்தாலும், மோசே மற்றும் ஆரோன் என்ற இணைந்த எழுவாயைத் தமிழில் இயல்பாகப் பன்மையில் உணர்த்துகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: אַהֲרֹן
  choice: ஆரோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: וַיַּאַסְפוּ
  choice: ஒன்றுகூட்டினார்கள்
  rationale: אסף இங்கு மக்களை ஓரிடத்தில் கூடச் செய்வதைக் குறிக்கிறது; ‘ஒன்றுகூட்டினார்கள்’ என்பது அந்தச் செயப்பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֵת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண உருபு; தமிழில் இதற்குத் தனிச் சொல் தேவையில்லை.
- source_word: כָּל
  choice: அனைவரையும்
  rationale: כָּל குறிக்கும் முழுமையை, மனிதர்களைக் குறிக்கும் இச்சூழலில் ‘அனைவரையும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זִקְנֵי
  choice: மூப்பர்கள்
  rationale: זקנים வயதில் மூத்தவர்களை மட்டுமல்லாமல் சமூகத்தின் அங்கீகரிக்கப்பட்ட தலைவர்களையும் குறிக்கிறது; ‘மூப்பர்கள்’ அதன் சொற்பொருளையும் சமூகப் பொறுப்பையும் தக்கவைக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: மூலத்தில் உள்ள ஆண்பால் பன்மை உறவுமுறைச் சொல்லையும் இஸ்ரவேல்/யாக்கோபிலிருந்து வந்த வம்ச அடையாளத்தையும் ‘இஸ்ரவேலின் மகன்கள்’ நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்; மரபாக ‘இஸ்ரவேல் புத்திரர்’
  rationale: இங்கு பெரிய கோட்பாட்டுச் சர்ச்சை இல்லை. எனினும், இச்சொற்றொடர் இஸ்ரவேல்/யாக்கோபுடன் உள்ள வம்ச மற்றும் உடன்படிக்கை அடையாளத்தைச் சுமக்கிறது. இனப்பெயராக மட்டும் சுருக்காமல் மூலத்தின் உறவுமுறை வடிவம் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மதிப்புறு நடையிலும் அமைக்கப்பட்டது. ‘மூப்பர்கள்’ என்பது சமூகத் தலைமையைக் குறிக்கும் நிலைபெற்ற வேதாகமச் சொல்லாகத் தக்கவைக்கப்பட்டது; ‘புத்திரர்’ பிரதான உரையில் பழமையானதாக இருப்பதால் ‘மகன்கள்’ பயன்படுத்தப்பட்டது.
