base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/026.yaml
  text: So he let him alone[a]. Then she said[b], “A bridegroom of blood,” because of the circumcision.
translation:
  language: ta
  text: அப்போது அவர் அவனை விட்டுவிட்டார்.[a] அப்போது அவள், “இரத்த மணமகன்!” என்று விருத்தசேதனங்களின் காரணமாகச் சொன்னாள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்’, ‘அவனை’ என்பவர்கள் யார் என்று எபிரெய உரை இவ்வசனத்தில் பெயரிட்டுச் சொல்லவில்லை. சூழலின்படி ஆண்டவர் மோசேயைத் தாக்குவதை நிறுத்தினார் என்பது இயல்பான புரிதல்.
    reason: referent_ambiguity
  - marker: b
    text: ‘இரத்த மணமகன்’ என்பது பொருள் தெளிவில்லாத எபிரெயச் சொல்லாட்சி. ‘விருத்தசேதனங்கள்’ என்ற சொல் எபிரெயத்தில் பன்மையில் உள்ளது; இங்கு அது அவள் இக்கூற்றைச் சொன்னதற்கான காரணம் அல்லது சந்தர்ப்பத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרֶף מִמֶּנּוּ
  choice: அவர் அவனை விட்டுவிட்டார்
  rationale: רפה இங்கு எதிரான செயலை நிறுத்தி விலகுவதைக் குறிக்கிறது. தமிழில் ‘விட்டுவிட்டார்’ என்பது இயல்பாக அந்தப் பொருளைத் தருகிறது; எபிரெய உரையில் பெயர்கள் சொல்லப்படாமல் உள்ள சுட்டுப்பெயர்களையும் அப்படியே காக்கிறது.
- source_word: אָז
  choice: அப்போது
  rationale: முந்தைய நிகழ்வைத் தொடர்ந்து நடந்ததைச் சுட்டும் கால அடைமொழியாக இயல்பான நவீனத் தமிழ்.
- source_word: אָמְרָה
  choice: அவள் … சொன்னது
  rationale: אמר என்பதன் எளிய ‘சொன்னாள்’ என்ற பொருளை உயர்த்தாமல் தருகிறது. தமிழ் வாக்கிய அமைப்புக்காக இறுதி விளக்கத் தொடருடன் இணைத்து ‘சொன்னது’ என அமைக்கப்பட்டுள்ளது.
- source_word: חֲתַן דָּמִים
  choice: இரத்த மணமகன்
  rationale: தெளிவுபடுத்த இயலாத, பண்பாட்டுப் பின்னணி கொண்ட சுருக்கமான சொல்லாட்சியை விளக்கிப் பொருள்கூறாமல் அதன் வலிமையுடனும் தெளிவின்மையுடனும் காக்கிறது.
- source_word: לַמּוּלֹת
  choice: விருத்தசேதனச் சடங்குகளைக் குறித்தே
  rationale: לְ என்பதன் தொடர்பு/குறிப்பு சார்ந்த பொருளையும், מוּלֹת என்பதன் அரிய பன்மை வடிவத்தையும் வெளிப்படுத்துகிறது. ‘சடங்குகள்’ என்பது பன்மையை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘அவர் அவனை விட்டுவிட்டார்’ என்பதில் உள்ள சுட்டுப்பெயர்களின் குறிப்பு
  choice: மூலத்தைப் போலவே நபர்களின் பெயர்களைச் சேர்க்காமல் சுட்டுப்பெயர்களாக வைத்தல்
  alternative: ‘ஆண்டவர் மோசேயை விட்டுவிட்டார்’ என்று வெளிப்படையாகக் கூறுதல்
  rationale: முந்தைய சூழலில் ஆண்டவர் செய்பவராகவும் மோசே தாக்கப்படுபவராகவும் இருப்பது மிகவும் இயல்பான வாசிப்பு. இருப்பினும் இவ்வசனம் தானாக அவர்களின் பெயர்களைக் கூறாததால், மொழிபெயர்ப்பு அந்த இலக்கண வடிவத்தைத் தக்கவைக்கிறது.
- issue: ‘இரத்த மணமகன்’ என்பதன் பொருள்
  choice: சொல்லாட்சியை விளக்கிப் பொருள்கூறாமல் நேரடியாகத் தக்கவைத்தல்
  alternative: அருவருப்பை வெளிப்படுத்தும் கூற்று, விருத்தசேதனச் சடங்குப் பட்டம், அல்லது குறிப்பிட்ட ஒருவரை நோக்கிய அழைப்பு என்று விளக்குதல்
  rationale: இந்த எபிரெயச் சொல்லாட்சி உண்மையிலேயே கடினமானதும் பலவிதமாகப் புரிந்துகொள்ளக்கூடியதும் ஆகும். குறிப்பிட்ட உணர்ச்சி அல்லது சடங்கு விளக்கத்தை உரையில் திணிக்காமல் அதன் இறையியல் மற்றும் பண்பாட்டுத் திணறலைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதைநடை எளிமையும் காக்கப்பட்டுள்ளன. ‘இரத்த மணமகன்’ என்ற கடினமான மூலச் சொல்லாட்சி விளக்கமாக மாற்றப்படவில்லை. ‘விருத்தசேதனம்’ என்பது பொதுவாக அறியப்பட்ட வேதாகமச் சொல்; அரிய எபிரெயப் பன்மையை இயல்பாக்க ‘சடங்குகள்’ சேர்க்கப்பட்டுள்ளது.
