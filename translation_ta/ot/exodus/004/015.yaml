  yaml_path: translation/ot/exodus/004/015.yaml
  text: You shall speak to him and put the words in his mouth[a], and I will be with your mouth and with his mouth[b], and I will instruct you what you shall do.
translation:
  language: ta
  text: நீ அவனிடம் பேச வேண்டும்; வார்த்தைகளை அவன் வாயில் வைக்க வேண்டும். நான் உன் வாயோடும் அவன் வாயோடும் இருப்பேன்[a]; நீங்கள் செய்ய வேண்டியதை உங்களுக்குக் கற்பிப்பேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “நான் உன் வாயோடும் அவன் வாயோடும் இருப்பேன்.” இது மோசேயும் ஆரோனும் பேசும்போது கடவுள் அவர்களோடு இருந்து ஆற்றலளிப்பதைக் குறிக்கிறது.
    reason: anthropomorphic_expression
  - marker: b
    text: இங்கு “உங்களுக்குக்” மற்றும் மறைந்துள்ள “நீங்கள்” எபிரெயத்தில் பன்மை; அவை மோசேயையும் ஆரோனையும் சேர்த்துக் குறிக்கின்றன.
    reason: grammatical_number
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: நீ அவனிடம் பேசி
  rationale: இங்கு இணைப்புடன் வரும் Qal perfect, தொடர்ச்சியான இறைக் கட்டளையின் பொருளைத் தருகிறது. דבר + אל என்பதன் இயல்பான தமிழ் வடிவம் ‘அவனிடம் பேசி’.
- source_word: וְשַׂמְתָּ אֶת־הַדְּבָרִים בְּפִיו
  choice: அந்த வார்த்தைகளை அவன் வாயில் வைக்க வேண்டும்
  rationale: שׂים என்பதன் அடிப்படைப் பொருளான ‘வை’ என்பதையும், ஆரோன் என்ன பேச வேண்டும் என்பதை மோசே வழங்கும் ‘வாயில் வார்த்தைகளை வைப்பது’ என்ற எபிரெய உருவகத்தையும் காக்கிறது. הַדְּבָרִים definite ஆக இருப்பதால் ‘அந்த வார்த்தைகளை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְאָנֹכִי אֶהְיֶה עִם־פִּיךָ וְעִם־פִּיהוּ
  choice: நான் உன் வாயோடும் அவன் வாயோடும் இருப்பேன்
  rationale: மூலத்தின் concrete bodily imagery நேரடியாகப் பாதுகாக்கப்படுகிறது. இதை ‘நீங்கள் பேச உதவுவேன்’ என்று விரித்துரைப்பது பொருளைத் தெளிவாக்கினாலும், இறைவனின் உடனிருப்பை உதவி என்ற ஒரே கருத்தாகச் சுருக்கிவிடும்.
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: உங்களுக்குக் கற்பிப்பேன்
  rationale: ירה என்பதன் Hiphil வடிவம் இங்கு ‘கற்பி/அறிவுறுத்து’ என்று பொருள்படும். אֶתְכֶם இரண்டாம் நபர் பன்மை என்பதால் ‘உங்களுக்கு’ என்று வெளிப்படையாகக் காட்டப்பட்டுள்ளது.
- source_word: אֵת אֲשֶׁר תַּעֲשׂוּן
  choice: நீங்கள் என்ன செய்ய வேண்டும் என்பதை
  rationale: உறவுநிலைத் தொடர் ‘என்ன ... என்பதை’ என்று இயல்பாக வழங்கப்படுகிறது. תַּעֲשׂוּן இரண்டாம் நபர் ஆண்பால் பன்மை; சூழலில் மோசேயையும் ஆரோனையும் சேர்த்துக் குறிக்கிறது.
theological_decisions:
- issue: பேச்சில் இறைவன் உதவுவதைச் சித்தரிக்கும் உடலுறுப்பு உருவகம்
  choice: ‘நான் உன் வாயோடும் அவன் வாயோடும் இருப்பேன்’ என்ற concrete சொல்லாக்கத்தை முதன்மை உரையில் வைத்தல்.
  alternative: ‘நீ பேசும்போதும் அவன் பேசும்போதும் நான் உங்களுக்கு உதவுவேன்.’
  rationale: எபிரெய உரை இறைவனின் நேரடியான உடனிருப்பையும் பேச்சுக்கான ஆற்றலளிப்பையும் ‘வாயோடு இருத்தல்’ எனச் சித்தரிக்கிறது. உருவகத்தைப் பாதுகாப்பது அதன் இறையியல் செறிவை முன்கூட்டியே விளக்கித் தீர்ப்பதைத் தவிர்க்கிறது.
- issue: இறுதிப் பிரதிப்பெயர் மற்றும் வினையின் எண்
  choice: ‘உங்களுக்கு’ மற்றும் ‘நீங்கள்’ என்ற பன்மை வடிவங்களைப் பயன்படுத்துதல்.
  alternative: ‘நீங்கள் இருவரும் என்ன செய்ய வேண்டும் என்பதை’ என்று மோசே, ஆரோன் இருவரையும் உரையிலேயே வெளிப்படுத்துதல்.
  rationale: אֶתְכֶם மற்றும் תַּעֲשׂוּן தெளிவான பன்மை வடிவங்கள். தமிழ் எண்ணை இயல்பாக வெளிப்படுத்துவதால் பன்மை காக்கப்பட்டது; ‘இருவரும்’ என்பது சூழலால் உண்மையானாலும் மூலத்தில் இல்லாத விளக்கச் சேர்க்கை என்பதால் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. கட்டளையின் தொடர்ச்சியை இயல்பாகத் தெரிவிக்க ‘பேசி ... வைக்க வேண்டும்’ பயன்படுத்தப்பட்டது. மூலத்தின் ‘வாயோடு இருப்பேன்’ என்ற சற்றே அசாதாரணமான ஆனால் முக்கியமான உருவகம் திட்டமிட்டு பாதுகாக்கப்பட்டது.
