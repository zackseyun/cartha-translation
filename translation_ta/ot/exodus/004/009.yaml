base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/009.yaml
  text: And if they do not believe even these two signs and do not listen to your voice[a], then you shall take some of the water of the Nile and pour it on the dry ground[b], and the water that you take from the Nile will become blood on the dry ground.
translation:
  language: ta
  text: இந்த இரண்டு அடையாளங்களைக்கூட அவர்கள் நம்பாமல், உன் குரலுக்குச் செவிகொடுக்காமல் இருந்தால்[a], நீ நைல் நதியின் தண்ணீரைக் கொஞ்சம் எடுத்து உலர்ந்த தரையில் ஊற்று. நைல் நதியிலிருந்து நீ எடுக்கும் அந்தத் தண்ணீர் உலர்ந்த தரையில் இரத்தமாகும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன் குரலுக்குக் கீழ்ப்படியாமல் இருந்தால்.’ எபிரெய வழக்கு சொல்லுக்குச் சொல், ‘உன் குரலைக் கேட்காமல் இருந்தால்’ என உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இரத்தமாக மாறும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: இருந்தால்
  rationale: וְהָיָה אִם இங்கு ஒரு நிபந்தனைச் சூழலை அறிமுகப்படுத்துகிறது. தமிழில் ‘இருந்தால்’ என்று வாக்கியத்தின் நிபந்தனைப் பகுதியில் அமைப்பது இயல்பாகவும் மூலத்தின் பொருளுக்கு உண்மையாகவும் உள்ளது.
- source_word: יַאֲמִינוּ
  choice: நம்பாமல்
  rationale: இங்கு אמן என்பதன் ஹிஃபில் வடிவம் அடையாளங்கள் அளிக்கும் சான்றை நம்புவதைக் குறிக்கிறது. ‘நம்பாமல்’ என்பது இச்சூழலில் தெளிவான, இயல்பான தேர்வு.
- source_word: גַּם לִשְׁנֵי הָאֹתוֹת הָאֵלֶּה
  choice: இந்த இரண்டு அடையாளங்களைக்கூட
  rationale: גַּם தரும் வலியுறுத்தலையும், முன்பு கொடுக்கப்பட்ட முதல் இரண்டு அடையாளங்களைக் குறிப்பாகச் சுட்டுவதையும் ‘-க்கூட’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִשְׁמְעוּן לְקֹלֶךָ
  choice: உன் குரலுக்குச் செவிகொடுக்காமல்
  rationale: שׁמע לְקוֹל என்பது ஒருவருடைய குரலைக் கேட்டு அதற்கு இணங்குதல் அல்லது கவனம் செலுத்துதல் என்ற எபிரெய வழக்கு. ‘செவிகொடுக்காமல்’ அந்தச் செயற்பொருளை இயல்பான தமிழில் தருகிறது; ‘குரல்’ என்பதையும் தக்கவைக்கிறது.
- source_word: מִמֵּימֵי הַיְאֹר
  choice: நைல் நதியின் தண்ணீரில் கொஞ்சம்
  rationale: מִן இங்கு பகுதியைக் குறிக்கிறது. ‘தண்ணீரில் கொஞ்சம்’ என்பது அந்தப் பகுதிப் பொருளைத் தெளிவாகக் காட்டுகிறது; யְאֹר என்பதற்கு யாத்திராகமச் சூழலில் ‘நைல் நதி’ பொருத்தமானது.
- source_word: וְשָׁפַכְתָּ
  choice: ஊற்ற வேண்டும்
  rationale: שׁפך என்பதன் நேரடியான பொருள் ‘ஊற்று’. எபிரெய இறந்தகால வடிவம் இந்நிபந்தனைத் தொடரில் கட்டளைக்குரிய எதிர்காலச் செயலைக் குறிக்கிறது; தமிழில் ‘ஊற்ற வேண்டும்’ இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַיַּבָּשָׁה / בַּיַּבָּשֶׁת
  choice: உலர்ந்த தரையில்
  rationale: இந்தச் சொற்கள் தண்ணீருக்கு மாறான உலர்ந்த நிலம் அல்லது தரையைக் குறிக்கின்றன. செயல் நடைபெறும் மேற்பரப்பை ‘உலர்ந்த தரை’ தெளிவாகக் காட்டுகிறது; மூலத்திலுள்ள மறுபயன்பாடும் இருமுறை தக்கவைக்கப்படுகிறது.
- source_word: וְהָיוּ ... לְדָם
  choice: இரத்தமாகும்
  rationale: היה + לְ என்ற அமைப்பு விளைவு அல்லது உருமாற்றத்தைக் குறிக்கிறது. ‘இரத்தமாகும்’ என்பது சுருக்கமாகவும் நேரடியாகவும் இருந்து, நீர் உண்மையாக இரத்தமாகும் என்ற மூலக் கூற்றைத் தக்கவைக்கிறது.
- source_word: דָם
  choice: இரத்தம்
  rationale: דָם என்பதன் நேரடிப் பொருள் ‘இரத்தம்’. இதை நிறமாகவோ தோற்றமாகவோ மென்மைப்படுத்த மூலத்தில் ஆதாரம் இல்லை.
theological_decisions:
- issue: நைல் நதியின் தண்ணீர் இரத்தமாகும் அடையாளத்தின் தன்மை
  choice: ‘இரத்தமாகும்’ என்று நேரடியான அற்புத உருமாற்றமாக மொழிபெயர்த்தல்
  alternative: ‘இரத்தத்தைப் போலத் தோன்றும்’ அல்லது ‘இரத்தச் சிவப்பாகும்’
  rationale: היה + לדם என்ற எபிரெய வாசகம் எந்தத் தகுதிப்படுத்தலும் இன்றி தண்ணீர் இரத்தமாகும் என்று கூறுகிறது. மூலத்தில் இல்லாத இயற்கைவாத விளக்கத்தைப் புகுத்தாமலும் அற்புதக் கூற்றை வலுவிழக்கச் செய்யாமலும் மொழிபெயர்க்க வேண்டும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான நடையைப் பயன்படுத்தியுள்ளோம். ‘அடையாளம்,’ ‘செவிகொடு,’ ‘இரத்தம்’ போன்ற பரவலாகப் புரியும் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன. எபிரெய மொழியின் மறுபயன்பாட்டைப் பிரதிபலிக்க ‘நைல் நதி’ மற்றும் ‘உலர்ந்த தரை’ மீண்டும் குறிப்பிடப்பட்டுள்ளன; அதேவேளை தமிழில் இயல்பற்ற சொற்கட்டமைப்பு தவிர்க்கப்பட்டுள்ளது.
