  text: וַ/יַּגֵּ֤ד מֹשֶׁה֙ לְ/אַֽהֲרֹ֔ן אֵ֛ת כָּל דִּבְרֵ֥י יְהוָ֖ה אֲשֶׁ֣ר שְׁלָח֑/וֹ וְ/אֵ֥ת כָּל הָ/אֹתֹ֖ת אֲשֶׁ֥ר צִוָּֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/028.yaml
  text: Moses told Aaron all the words of Yahweh who had sent him[a], and all the signs that he had commanded him.
translation:
  language: ta
  text: மோசே, தன்னை அனுப்பிய யாவேயின் வார்த்தைகள் அனைத்தையும்[a], யாவே மோசேக்குக் கட்டளையிட்ட அடையாளங்கள் அனைத்தையும் ஆரோனிடம் தெரிவித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எந்த வார்த்தைகளுடன் யாவே மோசேயை அனுப்பினாரோ, அந்த வார்த்தைகள் அனைத்தையும்.” எபிரெயச் சார்புத்தொடரை ‘வார்த்தைகள்’ என்பதோடும் இணைத்துப் புரிந்துகொள்ளலாம்; இரு வாசிப்புகளிலும் யாவே மோசேயை அனுப்பினார் என்பதே கருத்து.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: தெரிவித்தார்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் இங்கு ‘அறியச் செய்தல், தெரிவித்தல்’ என்று பொருள்படுகிறது. மோசே ஆரோனிடம் செய்தியை எடுத்துரைக்கும் சூழலுக்கு ‘தெரிவித்தார்’ இயல்பாகப் பொருந்துகிறது.
- source_word: דִּבְרֵי יְהוָה
  choice: யாவேயின் வார்த்தைகள்
  rationale: דָּבָר என்பதற்கு ‘வார்த்தை, செய்தி, காரியம்’ ஆகிய பொருள்கள் உண்டு. כָּל உடன் வரும் பன்மை இணைநிலை வடிவத்தை ‘வார்த்தைகள் அனைத்தும்’ என மொழிபெயர்ப்பது, யாவே உரைத்த ஆணையை மோசே முழுமையாக எடுத்துரைத்ததைக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்குகிறது.
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: தன்னை அனுப்பிய
  rationale: சார்புத்தொடரை அருகிலுள்ள ‘யாவே’ என்பதோடு இணைத்து, யாவே மோசேயை அனுப்பினார் என்ற இயல்பான வாசிப்பைத் தருகிறது. ‘தன்னை’ என்பது அனுப்பப்பட்டவர் மோசே என்பதைத் தெளிவாக்குகிறது; மாற்று இலக்கண இணைப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: הָאֹתֹת
  choice: அடையாளங்கள்
  rationale: אוֹת என்பது யாத்திராகமச் சூழலில் அற்புதத் தன்மையுள்ள ‘அடையாளம்’ என்பதைக் குறிக்கலாம். மூலத்தில் இல்லாத ‘அற்புதமான’ என்ற விளக்கத்தைச் சேர்க்காமல் ‘அடையாளங்கள்’ என நேரடியாக வழங்கப்படுகிறது.
- source_word: אֲשֶׁר צִוָּהוּ
  choice: அவர் தனக்குக் கட்டளையிட்ட
  rationale: மூலத்தில் உள்ள ‘அவர் அவனுக்குக் கட்டளையிட்ட’ என்ற அமைப்பைத் தமிழில் இயல்பாக வைத்திருக்கிறது. ‘செய்யும்படி’ என்பது கருத்தில் உணரப்பட்டாலும் வெளிப்படையாகச் சேர்க்கப்படவில்லை; அடையாளங்களைப் பற்றிய கட்டளை என்ற மூலத்தின் சுருக்கமும் காக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: வசனம் உடன்படிக்கையின் தனிப்பெயரான יהוה-ஐ நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைக் காக்கிறது.
- issue: אֲשֶׁר שְׁלָחוֹ என்ற சார்புத்தொடரின் இணைப்பு
  choice: ‘யாவே’ என்பதோடு இணைத்து, ‘தன்னை அனுப்பிய யாவே’ என வழங்குதல்
  alternative: ‘வார்த்தைகள்’ என்பதோடு இணைத்து, ‘எந்த வார்த்தைகளுடன் அவர் தன்னை அனுப்பினாரோ’ எனப் புரிதல்
  rationale: அருகிலுள்ள ஒருமை ஆண்பால் முன்னோடியான יהוה உடன் இணைப்பது இயல்பான வாசிப்பு; எனினும் எபிரெயத் தொடரமைப்பு ‘வார்த்தைகள்’ தொடர்பான கருவிப்பொருள் வாசிப்பையும் அனுமதிப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: அடையாளங்களைப் பற்றிய கட்டளையில் ‘செய்ய’ என்பதை வெளிப்படுத்தலாமா
  choice: ‘அவர் தனக்குக் கட்டளையிட்ட அடையாளங்கள்’ என்று மூலத்தின் சுருக்கத்தை வைத்தல்
  alternative: ‘செய்யும்படி அவர் தனக்குக் கட்டளையிட்ட அடையாளங்கள்’
  rationale: צִוָּהוּ என்பதில் ‘அவனுக்குக் கட்டளையிட்டார்’ என்பதே வெளிப்படையாக உள்ளது; செய்ய வேண்டிய செயல் சூழலால் புரிகிறது. தமிழில் வாக்கியம் புரியத்தக்கதால் கூடுதல் வினையைச் சேர்க்காமல் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆரோன்’, ‘மோசே’, ‘யாவே’ ஆகிய வடிவங்கள் பொதுவாகப் புரியக்கூடிய வேதாகமப் பெயர் மரபுடன் ஒத்திருக்கின்றன. மூலத்தின் ‘வார்த்தைகள்’, ‘அடையாளங்கள்’ ஆகிய சொற்கள் தேவையற்ற விளக்கச் சேர்க்கையின்றி காக்கப்பட்டுள்ளன.
