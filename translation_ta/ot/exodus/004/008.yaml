source:
  edition: WLC
  text: וְ/הָיָה֙ אִם לֹ֣א יַאֲמִ֣ינוּ לָ֔/ךְ וְ/לֹ֣א יִשְׁמְע֔וּ לְ/קֹ֖ל הָ/אֹ֣ת הָ/רִאשׁ֑וֹן וְ/הֶֽאֱמִ֔ינוּ לְ/קֹ֖ל הָ/אֹ֥ת הָ/אַחֲרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/008.yaml
  text: And it will be[a], if they do not believe you and do not listen to the voice of the first sign, then they will believe the voice of the latter sign.
translation:
  language: ta
  text: அவர்கள் உன்னை நம்பாமலும், முதலாவது அடையாளத்தின் குரலுக்குச் செவிகொடுக்காமலும் இருந்தால், பிந்திய அடையாளத்தின்[a] குரலை நம்புவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடைசி அடையாளத்தின்.’ எபிரெயச் சொல்லுக்கு ‘பிந்திய’ என்றும் ‘கடைசி’ என்றும் பொருள் கொள்ளலாம். இங்கு ‘பிந்திய’ என்பது இதற்குப் பிறகு வேறு அடையாளம் வரவே வராது என்ற எண்ணத்தைத் தவிர்க்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: இருந்தால்
  rationale: எபிரெய நிபந்தனைத் தொடரை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; தனியே சொற்சொல்லாக மொழிபெயர்த்தால் தமிழில் செயற்கையாக இருக்கும்.
- source_word: יַאֲמִינוּ לָךְ
  choice: உன்னை நம்பாமல்
  rationale: האמין + ל என்ற அமைப்பு இங்கு மோசேயையும் அவர் கூறுவதைவும் நம்புவதைக் குறிக்கிறது; ‘உன்னில் விசுவாசம் வைக்காமல்’ என்பது தேவையற்ற இறையியல் நிறம் சேர்க்கும்.
- source_word: יִשְׁמְעוּ
  choice: செவிகொடுக்காமல்
  rationale: שׁמע இங்கு வெறுமனே ஒலி கேட்பதைவிட ஏற்றுக்கொண்டு கவனிப்பதைக் குறிக்கிறது; வெளிப்படையான ‘கீழ்ப்படிதல்’ என்று வலுப்படுத்தவில்லை.
- source_word: לְקוֹל
  choice: குரலுக்கு
  rationale: அடையாளம் சான்றாகப் ‘பேசுகிறது’ என்ற எபிரெய உருவகத்தைத் தக்கவைக்கிறது.
- source_word: הָאֹת
  choice: அடையாளம்
  rationale: אוֹת என்பதன் வழக்கமான பொருள்; மூலத்தில் வெளிப்படையாக இல்லாத ‘அற்புத’ என்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: הָרִאשׁוֹן
  choice: முதலாவது
  rationale: רִאשׁוֹן என்பதன் வரிசைப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְהֶאֱמִינוּ
  choice: நம்புவார்கள்
  rationale: நிபந்தனையின் விளைவைக் குறிக்கிறது; தமிழ் வாக்கிய அமைப்பே ‘அப்போது’ என்ற தொடர்பைத் தெளிவாக்குவதால் கூடுதல் சொல் தேவையில்லை.
- source_word: הָאַחֲרוֹן
  choice: பிந்திய
  rationale: אַחֲרוֹן என்பதிலுள்ள ‘பின்னர் வருவது/கடைசியானது’ என்ற பொருள் நெகிழ்வைத் தக்கவைக்கிறது; அடுத்ததாக வேறு அடையாளம் இருக்க முடியாது என்று கூறுவதில்லை.
