source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ יְהוָ֨ה ל֜/וֹ ע֗וֹד הָֽבֵא נָ֤א יָֽדְ/ךָ֙ בְּ/חֵיקֶ֔/ךָ וַ/יָּבֵ֥א יָד֖/וֹ בְּ/חֵיק֑/וֹ וַ/יּ֣וֹצִאָ֔/הּ וְ/הִנֵּ֥ה יָד֖/וֹ מְצֹרַ֥עַת כַּ/שָּֽׁלֶג־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/006.yaml
  text: Then Yahweh said to him again[a], “Please put your hand into your bosom.” So he put his hand into his bosom, and when he brought it out, behold, his hand was leprous, like snow.
translation:
  language: ta
  text: பின்பு யாவே அவரிடம் மீண்டும், “தயவுசெய்து உன் கையை உன் ஆடையின் முன்மடிப்புக்குள் வை” என்றார். அவர் தன் கையைத் தன் ஆடையின் முன்மடிப்புக்குள் வைத்தார். அதை வெளியே எடுத்தபோது, இதோ, அவருடைய கை தோல் நோயால் பாதிக்கப்பட்டு பனியைப்போல் இருந்தது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘மெட்சோராஅத்’ (מְצֹרַעַת), அதாவது צָרַעַת எனப்படும் நிலைமையால் பாதிக்கப்பட்டது. பழைய ஏற்பாட்டில் இச்சொல் குறிக்கும் நிலை, இன்றைய தொழுநோய் (ஹான்சன் நோய்) என்பதுடன் துல்லியமாக ஒத்திருக்க வேண்டியதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைப் பெயரைப் பொதுப்பட்டப் பெயரால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: עוֹד
  choice: மீண்டும்
  rationale: இந்த அடையாளங்களின் தொடரில் கூடுதலாகச் சொல்லப்படும் அடுத்த கட்டளையை இயல்பாகக் குறிக்கிறது.
- source_word: הָבֵא נָא
  choice: தயவுசெய்து ... வை
  rationale: הָבֵא என்பதன் சூழல்சார்ந்த பொருளை இயல்பான தமிழில் தருவதோடு, נָא கட்டளையை மென்மையாக்கும் நயத்தையும் காக்கிறது.
- source_word: חֵיק
  choice: மேலாடையின் மார்புமடிப்பு
  rationale: வெறும் ‘மார்பு’ என்பதைக் காட்டிலும், கையை உள்ளே வைக்கக்கூடிய ஆடையின் முன்புற மடிப்பைத் தெளிவாகக் குறிக்கிறது.
- source_word: וַיּוֹצִאָהּ
  choice: அதை வெளியே எடுத்தபோது
  rationale: பெண்பால் பின்னொட்டு ‘கை’யைக் குறிப்பதை ‘அதை’ என வெளிப்படுத்தி, நிகழ்வின் தொடரை இயல்பான தமிழில் காலவாக்கியமாகத் தருகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: அடையாளத்தின் திடீர், வியப்பூட்டும் வெளிப்பாட்டை மூலத்தைப் போலவே முன்னிறுத்துகிறது.
- source_word: מְצֹרַעַת
  choice: தோல் நோயால் பாதிக்கப்பட்டிருந்தது
  rationale: வேதாகம צָרַעַת என்ற நிலையை நவீன தொழுநோயுடன் தவறாக முற்றிலும் ஒப்பாக்காமல், வாசகருக்குப் புரியும் வகையில் தருகிறது; குறிப்பில் துல்லியம் விளக்கப்படுகிறது.
- source_word: כַּשָּׁלֶג
  choice: பனியைப்போல்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள சுருக்கமான ஒப்புமையைப் பாதுகாக்கிறது; ‘வெண்மையாக’ என்பதை உரைக்குள் சேர்த்து விளக்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல வசனம் நான்கெழுத்து இறைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், உடன்படிக்கைப் பெயரைப் பொதுப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: מְצֹרַעַת என்பதன் நோயியல் அடையாளம்
  choice: தோல் நோயால் பாதிக்கப்பட்டிருந்தது
  alternative: தொழுநோய் பிடித்திருந்தது
  rationale: வேதாகமச் சொல் நவீன ஹான்சன் நோயையே துல்லியமாகக் குறிக்கிறதா என்பது உறுதியல்ல; ஆகவே அந்த இரண்டையும் ஒன்றாக்கும் இறையியல் அல்லது மருத்துவ முன்னூட்டத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மேலாடையின் மார்புமடிப்பு’ என்பது பழங்கால ஆடைச் சூழலைத் தெளிவாக்குகிறது. வியப்புக் குறியான ‘இதோ’வும், ‘பனியைப்போல்’ என்ற மூலத்தின் சுருக்கமான ஒப்புமையும் காக்கப்பட்டுள்ளன.
