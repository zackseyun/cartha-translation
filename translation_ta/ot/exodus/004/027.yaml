source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל אַהֲרֹ֔ן לֵ֛ךְ לִ/קְרַ֥את מֹשֶׁ֖ה הַ/מִּדְבָּ֑רָ/ה וַ/יֵּ֗לֶךְ וַֽ/יִּפְגְּשֵׁ֛/הוּ בְּ/הַ֥ר הָ/אֱלֹהִ֖ים וַ/יִּשַּׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/027.yaml
  text: And Yahweh said to Aaron[a], “Go into the wilderness to meet Moses.” So he went and met him at the mountain of God and kissed him.
translation:
  language: ta
  text: யாவே ஆரோனிடம், “மோசேயைச் சந்திக்க வனாந்தரத்திற்குப் போ[a]” என்றார். அவன் போய், கடவுளின் மலையில் மோசேயைச் சந்தித்து, அவனை முத்தமிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரை, “வனாந்தரத்தில் மோசேயைச் சந்திக்கப் போ” என்றும் புரிந்துகொள்ளலாம்.
    reason: திசையைக் குறிக்கும் ‘வனாந்தரத்திற்குப்’ என்பதும், சந்திப்பு நிகழும் இடமாக ‘வனாந்தரத்தில்’ என்பதும் இச்சொற்றொடரின் அமைப்பில் சாத்தியமான புரிதல்கள்.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לֵךְ
  choice: போ
  rationale: הלך என்பதன் கட்டளை வடிவைத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: לִקְרַאת מֹשֶׁה
  choice: மோசேயைச் சந்திக்க
  rationale: לִקְרַאת என்பது ஒருவரை எதிர்கொண்டு சந்திக்கச் செல்வதைக் குறிக்கிறது; இச்சூழலில் ‘சந்திக்க’ என்பது இயல்பான தமிழ்.
- source_word: הַמִּדְבָּרָה
  choice: வனாந்தரத்திற்குப்
  rationale: திசையைக் குறிக்கும் ־ָה இறுதியை மதித்து, வனாந்தரத்தை நோக்கிய இயக்கமாக மொழிபெயர்க்கிறது; சொற்றொடரின் வேறு சாத்தியமான அமைப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: அவனைச் சந்தித்து
  rationale: פגשׁ என்பதன் சந்தித்தல்/எதிர்கொள்ளுதல் என்ற பொருளை இக்குடும்பச் சந்திப்புச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது; தெளிவுக்காக முதன்மை உரையில் ‘மோசேயை’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בְּהַר הָאֱלֹהִים
  choice: கடவுளின் மலையில்
  rationale: எபிரெய இணைப்புத் தொடரை நேரடியாகக் காத்து, בְּ முன்னிடைச்சொல்லின் இடப்பொருளை ‘மலையில்’ என வழங்குகிறது.
- source_word: וַיִּשַּׁק לוֹ
  choice: அவனை முத்தமிட்டான்
  rationale: נשׁק என்பதன் நேரடியான பொருளை விளக்கச் சேர்க்கையின்றி இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, உரையின் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘வனாந்தரம்’ என்பது வெறும் மணற்பாலைவனத்தைவிட மக்கள் குடியிருப்பில்லாத காட்டுநிலம் என்ற מִדְבָּר சொல்லின் பரந்த பொருளைச் சிறப்பாகத் தருகிறது. தொடர்ச்சியான வினைகளின் கர்த்தா ஆரோன் என்பதைத் தெளிவாக்க ‘அவன்’ பயன்படுத்தப்பட்டு, அடுத்த இடத்தில் ‘மோசே’ வெளிப்படையாகச் சொல்லப்பட்டுள்ளது.
