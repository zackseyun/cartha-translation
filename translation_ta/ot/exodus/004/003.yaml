  yaml_path: translation/ot/exodus/004/003.yaml
  text: And he said[a], “Throw it on the ground.” So he threw it on the ground, and it became a snake[b], and Moses fled from it.
translation:
  language: ta
  text: அவர், “அதைத் தரையில் எறி” என்றார். மோசே அதைத் தரையில் எறிந்தார்; அது ஒரு பாம்பாக[b] மாறியது. மோசே அதைவிட்டு[a] ஓடிப்போனார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “அதன் முன்னிலையிலிருந்து” (அல்லது “அவனுடைய முன்னிலையிலிருந்து”); அதாவது, அதனிடமிருந்து விலகி.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சர்ப்பமாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவர் … என்றார்
  rationale: வழக்கமான எபிரெய கதைத் தொடர்ச்சியை இயல்பான நவீன தமிழில் தருகிறது; முந்தைய சூழலிலிருந்து பேசுபவர் ஆண்டவர் என்பது தெளிவு.
- source_word: הַשְׁלִיכֵהוּ
  choice: அதைத் தரையில் எறி
  rationale: שׁלך என்பதன் கட்டளை வடிவம் ‘எறி’ என்று இயல்பாக மொழிபெயர்க்கப்படுகிறது; சுட்டுப்பெயர் முந்தைய வசனத்திலுள்ள கோலைக் குறிக்கிறது.
- source_word: אַרְצָה
  choice: தரையில்
  rationale: திசை குறிக்கும் ־ָה விகுதியுடன் இச்சூழலில் ‘தரையை நோக்கி/தரையில்’ என்று பொருள்; செயல் முடியும் இடத்தை இயல்பாகக் காட்ட ‘தரையில்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיַּשְׁלִיכֵהוּ
  choice: மோசே அதைத் தரையில் எறிந்தார்
  rationale: எபிரெய உரையில் எழுவாய் வெளிப்படையாக இல்லாவிட்டாலும் சூழலில் அது மோசே; தமிழில் தெளிவுக்கும் இயல்புக்கும் பெயர் சேர்க்கப்பட்டது.
- source_word: וַיְהִי לְנָחָשׁ
  choice: அது ஒரு பாம்பாக மாறியது
  rationale: נָחָשׁ என்பதற்கு இங்கு பொதுவான, தற்போதைய தமிழ் சொல் ‘பாம்பு’; ‘சர்ப்பம்’ தேவையற்ற இலக்கிய/பாரம்பரிய நிறம் தரும்.
- source_word: וַיָּנָס
  choice: ஓடிப்போனார்
  rationale: வினைச்சொல்லின் ‘தப்பி ஓடுதல்’ என்ற வலிமையை சாதாரண வாசகருக்குப் புரியும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִפָּנָיו
  choice: அதைவிட்டு
  rationale: சொல்லுக்கு சொல் ‘அதன் முன்னிலையிலிருந்து’ என்றாலும், இது ‘அதனிடமிருந்து விலகி’ என்ற எபிரெய மரபுத்தொடர்; பாம்பைவிட்டு ஓடியதை ‘அதைவிட்டு’ இயல்பாகத் தருகிறது.
