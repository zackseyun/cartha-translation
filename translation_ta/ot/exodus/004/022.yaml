  - severity: low
    issue: “முதற்பேறானவன்” is less natural than “முதற்பிறந்தவன்” in contemporary standard Tamil for the familial term בְּכוֹר.
    rationale: “முதற்பிறந்தவன்” directly and naturally conveys “firstborn” while retaining the source’s ambiguity concerning the significance of firstborn status.
