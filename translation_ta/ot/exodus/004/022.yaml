base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/022.yaml
  text: 'Then you shall say to Pharaoh[a], ‘Thus says Yahweh: Israel is my firstborn son.’'
translation:
  language: ta
  text: 'பின்பு நீ பார்வோனிடம், “யாவே இவ்வாறு கூறுகிறார்: ‘இஸ்ரவேல் என் மகன், என் முதற்பிறந்தவன்[a].’” என்று சொல்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “இஸ்ரவேல் என் முதற்பிறந்த மகன்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: பின்பு நீ ... சொல்
  rationale: இணைப்புடன் வந்துள்ள Qal perfect இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம், இச்சூழலில் மோசேக்கு அளிக்கப்படும் தொடர்ச்சியான கட்டளையாகச் செயல்படுகிறது. ‘பின்பு’ நிகழ்வின் வரிசையையும் ‘சொல்’ கட்டளையின் இயல்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: אֶל־פַּרְעֹה
  choice: பார்வோனிடம்
  rationale: אֶל என்பது உரை யாரிடம் சொல்லப்பட வேண்டும் என்பதைக் குறிக்கிறது; தமிழில் ‘-இடம்’ இயல்பான திசை/பெறுநர் அமைப்பு.
- source_word: כֹּה אָמַר
  choice: இவ்வாறு கூறுகிறார்
  rationale: தூதுரைப் பாங்குடைய நிலையான அறிவிப்பு வாய்பாட்டை, அதன் மரியாதையும் நிகழ்கால மேற்கோள் உணர்வும் காக்கும் வகையில் மொழிபெயர்க்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட தமிழாக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּנִי
  choice: என் மகன்
  rationale: முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் உள்ள ‘மகன்’ என்ற வெளிப்படையான உறவுமுறையை அப்படியே காக்கிறது.
- source_word: בְכֹרִי
  choice: என் முதற்பேறானவன்
  rationale: முதற்பிறப்பு, குடும்ப நிலை, உரிமை மற்றும் சிறப்பிடம் ஆகிய சாத்தியமான நுணுக்கங்களை ஒன்றாக வைத்திருக்கிறது; அவற்றுள் ஒன்றை மட்டும் தீர்மானிப்பதில்லை.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: பெயரைத் தமிழில் வழக்கமான வேதாகம ஒலிவடிவில் தருகிறது; இங்கு அது ‘என் மகன், என் முதற்பேறானவன்’ என்பதுடன் பெயர்ப்பயனிலை உறவில் நிற்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைத் திருப்பெயர் நேரடியாக இருப்பதால், அதை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: இஸ்ரவேலைக் குறிக்கும் மகன்–முதற்பேறு உருவகம்
  choice: இஸ்ரவேல் என் மகன், என் முதற்பேறானவன்
  alternative: இஸ்ரவேல் என் முதற்பேறான மகன்
  rationale: எபிரெயச் சொல் வரிசையையும் ‘என் மகன்’ மற்றும் ‘என் முதற்பேறானவன்’ என்ற இரட்டை வலியுறுத்தலையும் முதன்மை உரையில் காக்கிறது. சுருக்கமான பண்புப்பெயர் அமைப்பும் இலக்கண ரீதியில் சாத்தியமானதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான அறிவிப்பு நடையைப் பயன்படுத்துகிறது. ‘இவ்வாறு கூறுகிறார்’ தூதுரை வாய்பாட்டின் கண்ணியத்தைக் காக்கிறது; ‘என் மகன், என் முதற்பேறானவன்’ மூல எபிரெயச் சொல் வரிசையையும் இறையியல் வலியுறுத்தலையும் பாதுகாக்கிறது.
