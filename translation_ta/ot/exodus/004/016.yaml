source:
  edition: WLC
  text: וְ/דִבֶּר ה֥וּא לְ/ךָ֖ אֶל הָ/עָ֑ם וְ/הָ֤יָה הוּא֙ יִֽהְיֶה לְּ/ךָ֣ לְ/פֶ֔ה וְ/אַתָּ֖ה תִּֽהְיֶה לּ֥/וֹ לֵֽ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/016.yaml
  text: He will speak to the people for you[a], and he will be as a mouth for you[b], and you will be as God to him.
translation:
  language: ta
  text: அவன் உனக்காக மக்களிடம் பேசுவான்; அவன் உனக்கு வாயாக இருப்பான், நீ அவனுக்குக் கடவுளாக இருப்பாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீ அவனுக்குக் கடவுளாக இருப்பாய்” என்பதை “நீ அவனுக்குக் கடவுளைப் போல இருப்பாய்” என்றும் புரிந்துகொள்ளலாம். மோசே கடவுளின் வார்த்தைகளை ஆரோனுக்குத் தெரிவிக்கும் அதிகாரமுள்ள பிரதிநிதியாக இருப்பதே இங்குள்ள கருத்து.
    reason: alternative_reading
lexical_decisions:
- source_word: וְדִבֶּר הוּא לְךָ אֶל־הָעָם
  choice: அவன் உனக்காக மக்களிடம் பேசுவான்
  rationale: דבר என்பதன் இயல்பான பொருள் ‘பேசு’. இச்சூழலில் לְךָ பிரதிநிதித்துவப் பொருளில் வந்து, ஆரோன் மோசேயின் சார்பாக மக்களிடம் பேசுவதைச் சுட்டுகிறது.
- source_word: וְהָיָה הוּא יִהְיֶה לְּךָ לְפֶה
  choice: அவன் உனக்கு வாயாக இருப்பான்
  rationale: לְפֶה என்பதன் ‘வாயாக’ என்ற உருவகத்தைத் தக்கவைத்து, ஆரோன் மோசேயின் பேச்சாளராகச் செயல்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது. எபிரெய உரையின் வலியுறுத்தும் கட்டமைப்பை தமிழில் தேவையற்ற மறுபதிப்பாக மாற்றவில்லை.
- source_word: וְאַתָּה תִּהְיֶה לּוֹ לֵאלֹהִים
  choice: நீ அவனுக்குக் கடவுளாக இருப்பாய்
  rationale: לֵאלֹהִים என்ற வலிமையான உறவுசார் உருவகத்தை நேரடியாகத் தக்கவைக்கிறது. இங்கு மோசே தெய்வமாக மாறுவதாக அல்ல, கடவுளிடமிருந்து பெற்ற வார்த்தையை ஆரோனுக்கு அளிக்கும் அதிகாரமுள்ள பிரதிநிதிப் பங்கை ஏற்கிறார் என்பது சூழலால் விளங்குகிறது.
theological_decisions:
- issue: לֵאלֹהִים என்பது மோசேயை நேரடியாகக் ‘கடவுள்’ என்று கூறுகிறதா, அல்லது ஒப்புமையை வெளிப்படுத்துகிறதா?
  choice: அவனுக்குக் கடவுளாக
  alternative: அவனுக்குக் கடவுளைப் போல / கடவுளைப்போல்
  rationale: எபிரெயத்தில் வெளிப்படையான ‘போல’ என்ற ஒப்புமைச் சொல் இல்லை. ஆகவே முதன்மை உரையில் அதன் தீவிரத்தையும் தெளிவற்ற தன்மையையும் தக்கவைத்து, சூழலில் இது கடவுளால் அளிக்கப்பட்ட பிரதிநிதித்துவ அதிகாரத்தைக் குறிக்கிறது என்பதை அடிக்குறிப்பில் விளக்குவது ஏற்றது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘வாய்’ மற்றும் ‘கடவுள்’ என்னும் இணையான எபிரெய உருவகங்கள் முதன்மை உரையில் தக்கவைக்கப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கம் தவிர்க்கப்பட்டுள்ளது.
