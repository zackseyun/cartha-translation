  source_fidelity: மூலத்தின் நோக்கக் கூறு, நம்பிக்கையின் உள்ளடக்கம், இறைப்பெயர், முற்பிதாக்களின் தொடர் ஆகியவை பெரும்பாலும் சரியாக உள்ளன. ஆனால் נִרְאָה என்பது சூழலில் ‘தோன்றினார்/காட்சியளித்தார்’ என்பதைவிட ‘உனக்குத் தோன்றியிருக்கிறார்’ என நிறைவுபெற்ற வெளிப்பாட்டைக் குறிப்பது சிறந்தது; மேலும் எபிரெயத்தில் உள்ள ‘கடவுள்’ என்ற அடையாளப்பெயர் ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஒவ்வொருவருடனும் இணையாக மீள வேண்டும்.
  naturalness: ‘அவர்களுடைய தந்தையரின் கடவுளாகிய யாவே’ இயல்பாக உள்ளது. எனினும் பெயர்த் தொடர்களில் ‘கடவுளும் ... கடவுளுமானவர்’ என்ற கலந்த அமைப்புக்குப் பதிலாக ஒரே தொடரியல் வடிவம் வாசிப்பிற்கு தெளிவானது. ‘உனக்குத் தோன்றியிருக்கிறார்’ நவீன நிலையான தமிழில் இயல்பாகவும் மூலத்தின் நிறைவு அம்சத்திற்கும் ஏற்றதாகவும் உள்ளது.
  terminology: ‘யாவே’ இறைப்பெயரை நேரடியாகத் தருவது திட்டத் தீர்மானத்துடன் ஒத்துள்ளது. ‘தந்தையர்’ என்பது אֲבֹתָם என்பதன் ஆண்பால் பன்மை மற்றும் முற்பிதா-மரபுச் சூழலைக் காக்கிறது. ஆபிரகாம், ஈசாக்கு, யாக்கோபு என்ற பெயர்வடிவங்கள் ஏற்கத்தக்கவை.
