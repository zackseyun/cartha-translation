base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/005.yaml
  text: so that they may believe that Yahweh[a], the God of their fathers, the God of Abraham, the God of Isaac, and the God of Jacob[b], has appeared to you.
translation:
  language: ta
  text: 'அவர்களுடைய தந்தையரின்[b] கடவுளாகிய யாவே[a], ஆபிரகாமின் கடவுள், ஈசாக்கின் கடவுள், யாக்கோபின் கடவுள் உனக்குத் தோன்றியிருக்கிறார் என்று அவர்கள் நம்பும்படியாக.


    [a] எபிரெயத்தில்: “YHWH”; இது பாரம்பரியமாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது. “யாவே”, “யெகோவா” என்பன வேறு வடிவங்கள்.


    [b] “அவர்களுடைய முன்னோர்களின் கடவுள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய மூலத்தில் இன்னும் சொற்சொல்லாக “அவர்களுடைய தந்தையரின் கடவுள்” என்று உள்ளது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “YHWH”; இது பாரம்பரியமாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது. “யாவே”, “யெகோவா” என்பன வேறு வடிவங்கள்.'
    reason: alternative_reading
  - marker: b
    text: “அவர்களுடைய முன்னோர்களின் கடவுள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய மூலத்தில் இன்னும் சொற்சொல்லாக “அவர்களுடைய தந்தையரின் கடவுள்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: நம்பும்படியாக
  rationale: நோக்கத்தைக் குறிக்கும் இணைப்பைத் தமிழில் இயல்பான வினையெச்ச வடிவில் வெளிப்படுத்துகிறது.
- source_word: יַאֲמִינוּ
  choice: அவர்கள் நம்பும்படியாக
  rationale: மோசேயின் கூற்றையும் அடையாளத்தின் செய்தியையும் உண்மையென ஏற்றுக்கொள்வதே உடனடிச் சூழலின் பொருள்; ஆகவே “நம்பு” பொருத்தமானது.
- source_word: כִּי
  choice: என்று
  rationale: காரணத்தை அல்ல, அவர்கள் நம்ப வேண்டிய செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: נִרְאָה
  choice: தோன்றினார்
  rationale: ראה என்பதன் நிஃபால் வடிவம் இங்கு “காட்சியளித்தார்/தோன்றினார்” என்ற பொருளுடையது; தெய்வீக வெளிப்பாட்டை இயல்பாகக் குறிக்கிறது.
- source_word: אֵלֶיךָ
  choice: உனக்கு
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமையைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: YHWH என்ற தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் பரவலான ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: அவர்களுடைய தந்தையரின் கடவுள்
  rationale: மூலத்தின் ஆண்பால் பன்மையையும் உடன்படிக்கைச் சூழலிலுள்ள தந்தைவழி மரபையும் காக்கிறது; “முன்னோர்கள்” என்பது சாத்தியமான பரந்த மாற்று.
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: ஆபிரகாமின் கடவுளும், ஈசாக்கின் கடவுளும், யாக்கோபின் கடவுளுமானவர்
  rationale: ஒவ்வொரு முற்பிதாவுக்கும் முன் “கடவுள்” என்பதை மீண்டும் கூறி, எபிரெய மூலத்தின் வலியுறுத்தலையும் கம்பீரமான ஓசையையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் YHWH என்ற தனிப்பெயர் நேரடியாக உள்ளது. “யாவே” என்பது அதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது; பிற வழக்குகள் அடிக்குறிப்பில் தெரிவிக்கப்படுகின்றன.
- issue: אֲבֹתָם என்ற பாலினம் குறிக்கப்பட்ட மரபுச் சொல்
  choice: அவர்களுடைய தந்தையர்
  alternative: அவர்களுடைய முன்னோர்கள்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையாகவும் இங்கு முற்பிதாக்களை நோக்கியதாகவும் உள்ளது. அதன் குறிப்பை முதன்மை உரை காக்கிறது; பரந்த பொருளுடைய மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. மூலத்தின் நோக்கக் கூறு, இறைப்பெயர், தந்தைவழிக் குறிப்பு, முற்பிதாக்கள் ஒவ்வொருவருக்கும் முன் வரும் “கடவுள்” என்ற மறுமொழி ஆகியவை பாதுகாக்கப்பட்டுள்ளன. இடைக்கோடுகள் யாவேக்கும் தொடர்ந்து வரும் விளக்கப் பெயர்களுக்கும் உள்ள தொடர்பைத் தெளிவாக்குகின்றன.
