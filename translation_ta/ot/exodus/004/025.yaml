base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/025.yaml
  text: Then Zipporah took a flint and cut off her son's foreskin and touched his feet with it[a], and she said, “Surely you are a bridegroom of blood to me.”
translation:
  language: ta
  text: அப்போது சிப்போராள் ஒரு சக்கிமுக்கிக் கல்லை எடுத்து, தன் மகனுடைய நுனித்தோலை அறுத்து, அதை அவனுடைய பாதங்களில் தொடச் செய்தாள்[a]. பின்பு அவள், “உண்மையாகவே, நீ எனக்கு இரத்த மணமகன்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவனுடைய பாதங்கள்.” “பாதங்கள்” என்பது பிறப்புறுப்புகளைக் குறிக்கும் மறைமொழியாக இருக்கலாம்; “அவனுடைய” என்பது மோசேயையோ அவளுடைய மகனையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹר
  choice: தீக்கல்
  rationale: இச்சொல் வெட்டும் கருவியாகப் பயன்படுத்தப்பட்ட flint கல்லைக் குறிக்கிறது. ‘தீக்கல்’ என்பது குறிப்பான, சுருக்கமான தமிழ் சொல்; பொதுவான ‘கூர்மையான கல்’ என்பதைவிட மூலச்சொல்லைத் துல்லியமாகக் காட்டுகிறது.
- source_word: עָרְלַת בְּנָהּ
  choice: தன் மகனுடைய நுனித்தோல்
  rationale: உறுப்பியல் பொருளை மறைக்காமல், தமிழ் நடையில் இயல்பாகக் கட்டமைப்புச் சொற்றொடரை மொழிபெயர்க்கிறது.
- source_word: וַתַּגַּע
  choice: தொடச் செய்தாள்
  rationale: நגע என்பதன் அடிப்படைப் பொருள் ‘தொடு’ என்பதாகும். வெட்டிய நுனித்தோலைக் கொண்டு தொடுவித்த செயலைத் தமிழில் தெளிவாகக் கூறும் அதேவேளை, தொடுதலின் துல்லியமான முறையை விளக்கிச் சேர்ப்பதில்லை.
- source_word: לְרַגְלָיו
  choice: அவனுடைய பாதங்களில்
  rationale: மூல எபிரெயத்தின் நேரடிப் பொருள் ‘அவனுடைய பாதங்கள்.’ இது மறைமொழியாக இருக்கக்கூடியதையும், சுட்டுப்பெயர் மோசேயையா மகனையா குறிக்கிறது என்பதையும் அடிக்குறிப்பில் வைத்துப் பிரதான உரையில் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: כִּי
  choice: உண்மையாகவே
  rationale: இங்கு כִּי வியப்புடனும் வலியுறுத்தலுடனும் வரும் கூற்றை அறிமுகப்படுத்துகிறது; ‘உண்மையாகவே’ அதன் அழுத்தத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֲתַן דָּמִים
  choice: இரத்த மணமகன்
  rationale: இது அரிதான, பொருள் தெளிவில்லாத சொற்றொடர். விளக்கவுரையாக மாற்றாமல், எபிரெய உருவகத்தையும் அதன் இறையியல் மற்றும் கதைசார் பதற்றத்தையும் பாதுகாக்கிறது.
- source_word: לִי
  choice: எனக்கு
  rationale: தனிப்பட்ட உறவைக் குறிக்கும் முன்னொட்டின் இயல்பான தமிழ் இணை; ‘இரத்த மணமகன்’ என்ற பெயர்ச்சொல் தொடரோடு பொருந்துகிறது.
theological_decisions:
- issue: ‘அவனுடைய பாதங்கள்’ என்பது மறைமொழியா, சுட்டுப்பெயர் மோசேயையா மகனையா குறிக்கிறது என்பதைத் தீர்மானித்தல்
  choice: ‘அவனுடைய பாதங்களில்’ என்ற நேரடி சொல்லாக்கத்தை வைத்து, யாரைக் குறிக்கிறது என்பதைத் தீர்மானிக்காமல் விடுதல்
  alternative: ‘அவனுடைய பிறப்புறுப்பில்’; ‘மோசேயின் பாதங்களில்/பிறப்புறுப்பில்’; ‘மகனின் பாதங்களில்/பிறப்புறுப்பில்’
  rationale: இவ்வசனம் புகழ்பெற்ற வகையில் தெளிவற்றது. மூல உரை வெறுமனே ‘அவனுடைய பாதங்கள்’ எனக் கூறுவதால், பிரதான உரை அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது; முக்கிய விளக்க வாய்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன தரத்தமிழில், கண்ணியமும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. ‘நுனித்தோல்’ உறுப்பியல் துல்லியத்தைத் தருகிறது; ‘இரத்த மணமகன்’ என்ற அசாதாரண உருவகம் மென்மைப்படுத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளது. மூலத்தின் தெளிவின்மை அடிக்குறிப்புடன் நிலைநிறுத்தப்பட்டுள்ளது.
