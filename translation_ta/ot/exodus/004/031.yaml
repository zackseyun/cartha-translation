source:
  edition: WLC
  text: וַֽ/יַּאֲמֵ֖ן הָ/עָ֑ם וַֽ/יִּשְׁמְע֡וּ כִּֽי פָקַ֨ד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/כִ֤י רָאָה֙ אֶת עָנְיָ֔/ם וַֽ/יִּקְּד֖וּ וַ/יִּֽשְׁתַּחֲוּֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/031.yaml
  text: And the people believed[a]; and when they heard that Yahweh had visited the sons of Israel and that he had seen their affliction[c][b], they bowed down and worshiped.
translation:
  language: ta
  text: மக்கள் நம்பினார்கள். யாவே இஸ்ரவேல் மக்களைக் கவனித்தார்[a] என்றும், அவர்களுடைய துயரத்தைக் கண்டார் என்றும் அவர்கள் கேள்விப்பட்டபோது, தலைவணங்கி வழிபட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கவனித்தார்” என்பதற்கு “அக்கறை கொண்டார்,” “நிலைமையைப் பொருட்படுத்தினார்,” அல்லது “பார்வையிட்டார்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை கவனிப்பையும், பெரும்பாலும் அதனுடன் தொடர்புடைய தெய்வீகச் செயலையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן
  choice: நம்பினார்கள்
  rationale: אמן என்பதன் ஹிஃபில் வடிவம் இங்கு மோசே மற்றும் ஆரோன் அறிவித்த செய்தியையும் காட்டிய அடையாளங்களையும் மக்கள் நம்பியதைக் குறிக்கிறது. எபிரெயத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருளைச் சேர்க்காமல் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: எபிரெயத்தில் ஒருமை வடிவிலுள்ள கூட்டுப்பெயரைத் தமிழில் இயல்பான பன்மையாக அளிக்கிறது.
- source_word: וַיִּשְׁמְעוּ כִּי
  choice: என்று அவர்கள் கேள்விப்பட்டபோது
  rationale: கேட்ட செய்தியின் உள்ளடக்கத்தையும் அதனைத் தொடர்ந்து வந்த எதிர்வினையையும் இயல்பான காலத் தொடர்புடன் வெளிப்படுத்துகிறது; வெறும் தொடர்ச்சியா அல்லது காரணத் தொடர்பா என்பதைக் கடுமையாகத் தீர்மானிப்பதில்லை.
- source_word: פָקַד יְהוָה
  choice: யாவே ... கவனித்துக்கொண்டார்
  rationale: פקד இங்கு கவனித்தல், நிலையைப் பொருட்படுத்துதல், தலையிட முனைதல் ஆகிய கருத்துகளைத் தாங்குகிறது. தமிழில் ‘சந்தித்தார்’ என்பது தவறான நேர்முகச் சந்திப்பு உணர்வைத் தரக்கூடும்; ‘கவனித்துக்கொண்டார்’ தெய்வீக அக்கறையையும் செயற்பாட்டையும் இயல்பாக உணர்த்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு உடன்படிக்கை மக்களையும் குறிக்கும் மரபுவழிக் குடும்பச் சொற்றொடர். ‘இஸ்ரவேலின் மக்கள்’ நவீன தமிழில் இயல்பாகவும் உள்ளடக்கத்தில் துல்லியமாகவும் உள்ளது.
- source_word: רָאָה אֶת עָנְיָם
  choice: அவர்களுடைய துயரத்தைக் கண்டார்
  rationale: ראה என்ற concrete வினையை ‘கண்டார்’ எனப் பேணுகிறது. עֳנִי துன்பம், ஒடுக்கப்பட்ட நிலை, துயரம் ஆகிய பொருள்களைக் கொண்டது; ‘துயரம்’ சூழலின் தீவிரத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּקְּדוּ
  choice: தலைவணங்கி
  rationale: קדד உடலைத் தாழ்த்தி வணங்குவதைக் குறிக்கிறது. தமிழில் ‘தலைவணங்கி’ அடுத்துள்ள வழிபாட்டு வினையுடன் இயல்பாக இணைகிறது.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: வழிபட்டார்கள்
  rationale: இந்த வினை பணிந்து விழுதல் அல்லது வழிபடுதல் எனப் பொருள்படும். இதற்கு முன் உடலைத் தாழ்த்தும் தனி வினை இருப்பதால், இங்கு செயலின் பக்திசார் நோக்கத்தை ‘வழிபட்டார்கள்’ தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை நான்கு எழுத்துகளாலான தனிப்பட்ட இறைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ அந்த உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற குடும்பச் சொற்றொடரின் வடிவம்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்; இஸ்ரவேலர்
  rationale: சொல்லுருவில் ஆண்பால் பன்மை இருந்தாலும், சூழலில் அது ஆண்களை மட்டும் அல்லாது இஸ்ரவேல் சமூகத்தையே குறிக்கிறது. இயல்பான தமிழுக்காக அர்த்தத்துக்கு ஏற்ற கூட்டுப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
- issue: פקד என்பதில் உள்ள தெய்வீகச் செயற்பாடு
  choice: கவனித்துக்கொண்டார்
  alternative: வந்து சந்தித்தார்; விசாரித்தார்; நினைவுகூர்ந்தார்
  rationale: வினை அக்கறையுடன் கவனிப்பதையும் அதைத் தொடர்ந்து வரும் தலையீட்டையும் சுட்டலாம். தமிழில் மிகக் குறிப்பிட்ட ஓர் செயலாகச் சுருக்காமல் இந்த அர்த்தவெளியைப் பேணும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க வேதாகம நடையுடனும் அமைக்கப்பட்டுள்ளது. தேவையற்ற பழமொழிநடை தவிர்க்கப்பட்டுள்ளது; மூலத்தின் இரண்டு தனித்த வணக்கச் செயல்களும் ‘தலைவணங்கி வழிபட்டார்கள்’ எனப் பேணப்பட்டுள்ளன.
