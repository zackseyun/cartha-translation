translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. செயல் மீண்டும் நடைபெறுவதைக் காட்ட ‘மீண்டும்’ என்ற சொல் கட்டளையிலும் நிறைவேற்றத்திலும் தக்கவைக்கப்பட்டுள்ளது. ஆடை அமைப்பை அறியாத வாசகருக்காக חֵיק என்பதன் பண்பாட்டுப் பொருள் முதன்மை உரையிலும் அடிக்குறிப்பிலும் தெளிவாக்கப்பட்டுள்ளது.
