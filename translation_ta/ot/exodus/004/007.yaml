base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/007.yaml
  text: And he said[a], “Put your hand back into your bosom.” So he put his hand back into his bosom, and when he brought it out from his bosom, behold[b], it had returned like his flesh.
translation:
  language: ta
  text: அவர், “உன் கையை உன் மார்பருகே உள்ள ஆடை மடிப்புக்குள்[a] மீண்டும் வை” என்றார். அவன் தன் கையைத் தனது மார்பருகே உள்ள ஆடை மடிப்புக்குள் மீண்டும் வைத்தான். அதை அங்கிருந்து வெளியே எடுத்தான்; இதோ,[b] அது மீண்டும் அவனுடைய சதையைப்போல் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் மார்பு அல்லது மடியையும், மார்பருகே பொருளை வைக்கக்கூடிய ஆடை மடிப்பையும் குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: அதாவது, அவனுடைய கை மீண்டும் இயல்பான சதையைப் போல இருந்தது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב
  choice: மீண்டும் வை
  rationale: שוב என்பதன் ஹிஃபில் கட்டளை வடிவம் கையை முன்பு இருந்த இடத்திற்குத் திரும்பச் செய்வதைக் குறிக்கிறது. ‘மீண்டும் வை’ என்பது இச்செயலை இயல்பான நவீனத் தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: חֵיק
  choice: மேலாடையின் மார்பு மடிப்பு
  rationale: இந்தச் சொல் மார்பருகே பொருளை வைக்கக்கூடிய ஆடை மடிப்பைக் குறிக்கலாம். வெறும் ‘மார்புக்குள்’ என்பது உடலின் உள்ளே என்ற தவறான பொருளைத் தரக்கூடும்; ‘மேலாடையின் மார்பு மடிப்பு’ பண்பாட்டுச் சூழலைத் தெளிவாகக் காக்கிறது.
- source_word: וַיָּשֶׁב
  choice: மீண்டும் வைத்தான்
  rationale: முன்னுள்ள கட்டளையின் சொல்லாட்சியோடு ஒத்திசைந்து, கையை அதே இடத்திற்குத் திரும்ப வைத்த செயலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיּוֹצִאָהּ
  choice: அதை அங்கிருந்து வெளியே எடுத்தபோது
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே கொண்டுவருதல்’ என்று பொருள்படும். தமிழில் ‘வெளியே எடுத்தபோது’ என்பது செயல் வரிசையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: எதிர்பாராத முடிவின்மீது கவனத்தை ஈர்க்கும் எபிரெயக் கதையாடல் இடைச்சொல்லின் வலிமையையும் மேன்மையான நடையையும் ‘இதோ’ காக்கிறது.
- source_word: שָׁבָה
  choice: மீண்டும் ... ஆகியிருந்தது
  rationale: கை முன்பிருந்த இயல்பான நிலைக்குத் திரும்பியதை குறிக்கும் שוב வினையின் மீள்நிலைப் பொருளை இது காக்கிறது; ‘குணமடைந்தது’ என்று விளக்கமாக முடிவுசெய்வதைத் தவிர்க்கிறது.
- source_word: כִּבְשָׂרוֹ
  choice: அவனுடைய சதையைப்போல்
  rationale: כְּ ஒப்புமையையும் בשר என்பதன் நேரடியான உடல்சார் பொருளையும் காக்கிறது. ‘அவனுடைய மற்ற உடலைப்போல்’ என்பது பொருளைத் தெளிவாக்கினாலும் மூலத்தில் இல்லாத ‘மற்ற’ என்பதைச் சேர்க்கும்.
