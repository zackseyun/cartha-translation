  text: וַ/יֹּ֖אמֶר בִּ֣י אֲדֹנָ֑/י שְֽׁלַֽח נָ֖א בְּ/יַד תִּשְׁלָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/013.yaml
  text: But he said[a], “Please, my Lord, send by the hand of whomever you will send.”
translation:
  language: ta
  text: ஆனால் அவர், “என் ஆண்டவரே, தயவுசெய்து, நீர் அனுப்புகிறவர்மூலம் அனுப்பும்” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, பொருளை இன்னும் வெளிப்படையாகச் சொன்னால்: “என் ஆண்டவரே, தயவுசெய்து, வேறு யாரையாவது அனுப்பும்.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் அவர் … என்றார்
  rationale: வழக்கமாக இது கதையைத் தொடர்ந்து ‘அவர் சொன்னார்’ எனப் பொருள்படும். ஆனால் முந்தைய வசனங்களில் கடவுள் அளித்த பதில்களுக்குப் பிறகும் மோசே தயங்கும் சூழலில், எதிர்மறைத் திருப்பத்தை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בִּי
  choice: தயவுசெய்து
  rationale: மரியாதையான அழைப்புக்கு முன் வரும் இந்த எபிரெய வேண்டுதல் மரபுத்தொடர், சொல்லுக்குச் சொல் ‘என்னில்’ என்பதைக் குறிக்காமல் பணிவான மன்றாட்டைக் குறிக்கிறது. தமிழில் ‘தயவுசெய்து’ அந்தத் தொனியை இயல்பாகத் தருகிறது.
- source_word: אֲדֹנָי
  choice: என் ஆண்டவரே
  rationale: இது கடவுளை நேரடியாகவும் பயபக்தியுடனும் அழைக்கும் சொல்; முதல் நபர் ஒருமை உடைமைப் பின்னொட்டையும் தனிப்பட்ட மன்றாட்டையும் ‘என் ஆண்டவரே’ காக்கிறது. இது יהוה என்ற இறைப் பெயர் அல்ல.
- source_word: שְׁלַח
  choice: அனுப்பும்
  rationale: שלח என்பதன் கட்டளை வடிவம். கடவுளிடம் மரியாதையுடன் முன்வைக்கப்படும் வேண்டுகோளுக்குப் பொருத்தமான, சுருக்கமான தமிழ் வடிவம்.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: கட்டளையை மென்மையாக்கும் வேண்டுதல் இடைச்சொல். בִּי என்பதோடு சேர்ந்து வரும் பணிவான வேண்டுதலை, தமிழில் ஒரே இயல்பான ‘தயவுசெய்து’ வெளிப்படுத்துகிறது.
- source_word: בְּיַד
  choice: மூலம்
  rationale: சொல்லுக்குச் சொல் ‘கையால்’ என்றாலும், இங்கு செயலை நிறைவேற்றும் நபரை அல்லது முகவரைச் சுட்டுகிறது. தமிழில் ‘மூலம்’ தெளிவாகவும் இயல்பாகவும் அதே தொடர்பைத் தருகிறது.
- source_word: תִּשְׁלָח
  choice: நீர் … அனுப்புவீரோ
  rationale: שלח என்பதன் நிறைவுறா வினைவடிவத்தின் தொடர்பு போன்ற அமைப்பை இது பிரதிபலிக்கிறது. ‘நீர் யார் மூலம் அனுப்புவீரோ’ என்பது மோசேயின் தவிர்க்கும் பேச்சில் உள்ள தெளிவின்மையைக் காக்கிறது; முதன்மை உரையில் ‘வேறு ஒருவரை’ என்று வெளிப்படையாகச் சேர்ப்பதில்லை.
theological_decisions:
- issue: மோசேயின் தவிர்க்கும் வேண்டுகோளை எவ்வாறு புரிந்துகொள்வது
  choice: ‘நீர் யார் மூலம் அனுப்புவீரோ அவர் மூலம் அனுப்பும்’ என்று எபிரெய உரையின் தெளிவின்மையைத் தக்கவைத்தல்.
  alternative: ‘தயவுசெய்து, வேறு யாரையாவது அனுப்பும்.’
  rationale: சூழலில் மோசே இந்தப் பணியை ஏற்கத் தயங்குகிறார் என்பது தெளிவு. எனினும் எபிரெய உரையில் ‘வேறு’ என்பது வெளிப்படையாக இல்லை. ஆகவே முதன்மை உரை அதன் மறைமுகமான, தவிர்க்கும் வடிவத்தைத் தக்கவைக்கிறது; தெளிவாக்கப்பட்ட பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கடவுளை நோக்கிய மரியாதையான ஒருமை நடையுடன் வடிவமைக்கப்பட்டது. ‘மூலம்’ என்பது ‘கையால்’ என்ற எபிரெய மரபுத்தொடரின் முகவர் பொருளை இயல்பான தமிழில் தருகிறது; அதேவேளையில் மோசேயின் வேண்டுகோளில் உள்ள திட்டமிட்ட தெளிவின்மை காக்கப்பட்டுள்ளது.
