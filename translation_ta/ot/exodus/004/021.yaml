base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/021.yaml
  text: Then Yahweh said to Moses[a], “When you go back to Egypt, see that you do before Pharaoh all the wonders that I have put in your hand. But I will harden his heart[b], and he will not let the people go.”
translation:
  language: ta
  text: பின்பு யாவே மோசேயிடம், “நீ எகிப்துக்குத் திரும்பிப் போகும்போது, நான் உன் கையில் வைத்துள்ள அற்புதச் செயல்கள்[a] அனைத்தையும் பார்வோனுக்கு முன்பாகச் செய்யும்படி பார்த்துக்கொள். ஆனால் நான் அவனுடைய இதயத்தைக் கடினப்படுத்துவேன்[b]; அவன் மக்களைப் போகவிடமாட்டான்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அடையாளங்கள்” அல்லது “அதிசயங்கள்.” இந்த எபிரெயச் சொல், இறைவனுடைய வல்லமையை வெளிப்படுத்தும் அசாதாரணச் செயல்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “அவனுடைய இதயத்தை வலுப்படுத்துவேன்” அல்லது “அவனுடைய இதயத்தை உறுதியாக்குவேன்.” இந்த எபிரெய வினைச்சொல் வலுப்படுத்துதல் என்ற பொருளையும் தரலாம்; இங்கு பார்வோன் தனது பிடிவாதமான மறுப்பில் உறுதிப்படுத்தப்படுவதை விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரைப் பதிலீடு செய்யாமல், தமிழில் எளிதாக ஒலிக்கக்கூடிய எழுத்துப்பெயர்ப்பாக வழங்குகிறது.
- source_word: בְּלֶכְתְּךָ לָשׁוּב מִצְרַיְמָה
  choice: நீ எகிப்துக்குத் திரும்பிப் போகும்போது
  rationale: இரண்டு வினையெச்சக் கட்டமைப்புகளின் காலப் பொருளையும், திசையைக் குறிக்கும் இறுதியையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: רְאֵה
  choice: செய்யும்படி பார்த்துக்கொள்
  rationale: இங்கு வரும் கட்டளை வெறுமனே ‘பார்’ என்பதல்ல; அடுத்த செயலைக் கவனமாக நிறைவேற்ற வேண்டும் என்ற அறிவுறுத்தலைக் குறிக்கிறது.
- source_word: הַמֹּפְתִים
  choice: அற்புதச் செயல்கள்
  rationale: தெய்வீக வல்லமையை வெளிப்படுத்தும் அசாதாரணச் செயல்கள் என்ற பொருளைத் தெளிவாகக் கூறுகிறது; ‘அடையாளங்கள்’ என்ற பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שַׂמְתִּי בְיָדֶךָ
  choice: நான் உன் கையில் வைத்துள்ள
  rationale: மோசேயிடம் ஒப்படைக்கப்பட்ட அதிகாரத்தையும் ஆற்றலையும் குறிக்கும் மூலமொழியின் ‘கையில் வைத்தல்’ என்ற உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וַעֲשִׂיתָם לִפְנֵי פַרְעֹה
  choice: பார்வோனுக்கு முன்பாகச் செய்யும்படி
  rationale: அந்தச் செயல்கள் பார்வோனின் முன்னிலையில் நிகழ்த்தப்பட வேண்டும் என்ற நேரடியான பொருளை வழங்குகிறது.
- source_word: וַאֲנִי
  choice: ஆனால் நான்
  rationale: மோசே செய்ய வேண்டிய செயலிலிருந்து யாவேயின் தீர்மானமான செயலுக்கு மாறும் கருத்து வேறுபாட்டைத் தமிழில் இயல்பாகச் சுட்டுகிறது.
- source_word: אֲחַזֵּק אֶת לִבּוֹ
  choice: அவனுடைய இதயத்தைக் கடினப்படுத்துவேன்
  rationale: חזק என்பதன் அடிப்படைப் பொருள் ‘வலுப்படுத்து/உறுதியாக்கு’ என்றாலும், பார்வோன் மறுப்பில் பிடிவாதமாக நிலைநிறுத்தப்படுவதை இக்கதைச் சூழலில் ‘கடினப்படுத்துவேன்’ தெளிவாகக் காட்டுகிறது.
- source_word: וְלֹא יְשַׁלַּח אֶת הָעָם
  choice: அவன் மக்களைப் போகவிடமாட்டான்
  rationale: எகிப்திலிருந்து மக்களை வெளியேற அனுமதிக்கமாட்டான் என்ற சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: பார்வோனின் இதயத்தை இறைவன் கடினப்படுத்துதல்
  choice: நான் அவனுடைய இதயத்தைக் கடினப்படுத்துவேன்
  alternative: நான் அவனுடைய இதயத்தை வலுப்படுத்துவேன் / உறுதியாக்குவேன்
  rationale: காரணவினையாக வரும் חזק, வலுப்படுத்துதல் அல்லது உறுதியாக்குதல் என்ற பொருளைக் கொள்ளலாம். இச்சூழலில் அது பார்வோன் தனது பிடிவாதமான மறுப்பில் உறுதியாக இருப்பதைக் குறிக்கிறது. தெய்வீகச் செயலுக்கும் பார்வோனின் பொறுப்புக்கும் இடையிலான வேதவசனத்தின் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு மென்மைப்படுத்தாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உன் கையில் வைத்துள்ள’ என்ற மூலமொழி உருவகம் புரிந்துகொள்ளத்தக்கதால் பாதுகாக்கப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் அவற்றின் சொற்களுடன் பொருந்தாமல் இடமாற்றம் அடைந்திருந்ததால், தமிழில் [a] ‘அற்புதச் செயல்கள்’ என்பதற்கும் [b] ‘இதயத்தைக் கடினப்படுத்துவேன்’ என்பதற்கும் சரியாக இணைக்கப்பட்டுள்ளன.
