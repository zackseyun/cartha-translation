  yaml_path: translation/ot/exodus/004/010.yaml
  text: Then Moses said to Yahweh[a], “Please, Lord, I am not a man of words, neither yesterday nor the day before, nor since you have spoken to your servant[b]; for I am heavy of mouth and heavy of tongue.”
translation:
  language: ta
  text: அப்போது மோசே யாவேயிடம், “ஆண்டவரே, தயவுசெய்து! நான் பேச்சில் வல்லவன் அல்ல[a]; நேற்றும் முந்தின நாளும், நீர் உமது அடியானிடம் பேசியதிலிருந்தும் அப்படியல்ல. ஏனெனில், நான் வாயில் கனமானவனும் நாவில் கனமானவனுமாய் இருக்கிறேன்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “நான் வார்த்தைகளின் மனிதன் அல்ல.” இது பேசும் திறனைப் பற்றிய ஒரு எபிரெய மரபுத்தொடர்; “சொல்வன்மை உடையவன் அல்ல” என்றும் பொருள்படலாம்.'
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில்: “வாயில் கனமானவன், நாவில் கனமானவன்.” இது பேசுவதிலுள்ள சிரமத்தைக் குறிக்கும் உருவகம்; சொல்வன்மைக் குறைவையோ ஏதோ ஒரு பேச்சுத் தடையையோ குறிக்கக்கூடும்.'
    reason: lexical_alternative
