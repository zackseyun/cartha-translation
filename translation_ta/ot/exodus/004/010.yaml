theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் அல்லது யெகோவா
  rationale: மூல உரை தனிப்பெயரையே பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் தமிழ் ஒலிபெயர்ப்பில் காக்கிறது.
- issue: மோசேயின் பேச்சுச் சிரமத்தின் இயல்பை விளக்குதல்
  choice: ‘வாயும் கனமானது, நாவும் கனமானது’ என்ற உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘திக்குவாயன்’, ‘பேச்சுக் குறைபாடுள்ளவன்’ அல்லது ‘சொல்வன்மையற்றவன்’ என்று குறிப்பாக விளக்குதல்
  rationale: மூல எபிரெயம் சிரமத்தின் துல்லியமான இயல்பைக் குறிப்பிடவில்லை. உருவகத்தைப் பாதுகாப்பது சொல்வன்மைக் குறைவு, தன்னம்பிக்கைக் குறைவு, அல்லது உடல்சார்ந்த பேச்சுத் தடை ஆகிய சாத்தியங்களுக்கிடையேயான உண்மையான தெளிவின்மையை நிலைநிறுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய உரையில் ‘நீர்/உமது’ என்றும், மோசேயின் பணிவான தற்சுட்டில் ‘அடியான்’ என்றும் வழங்கப்பட்டுள்ளது. மூலத்தின் மீளுரையும் உருவக இணை அமைப்பும் இயன்றவரை காக்கப்பட்டுள்ளன.
