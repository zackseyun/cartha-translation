  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה שְׁלַח֙ יָֽדְ/ךָ֔ וֶ/אֱחֹ֖ז בִּ/זְנָב֑/וֹ וַ/יִּשְׁלַ֤ח יָד/וֹ֙ וַ/יַּ֣חֲזֶק בּ֔/וֹ וַ/יְהִ֥י לְ/מַטֶּ֖ה בְּ/כַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/004.yaml
  text: Then Yahweh said to Moses[a], “Reach out your hand and take hold of its tail.” So he reached out his hand and took hold of it[b], and it became a staff in his hand.
translation:
  language: ta
  text: அப்போது யாவே மோசேயிடம், “உன் கையை நீட்டி, அதன் வாலைப் பிடி” என்றார். அவன் தன் கையை நீட்டி அதைப் பிடித்தான்; அது அவன் கையில் ஒரு கோலாக மாறியது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: שְׁלַח יָדְךָ
  choice: உன் கையை நீட்டி
  rationale: கையை முன்புறமாக நீட்டும் கட்டளையைத் தற்காலத் தமிழில் இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: וֶאֱחֹז בִּזְנָבוֹ
  choice: அதன் வாலைப் பிடி
  rationale: אָחַז என்பதன் பிடித்துக்கொள்ளுதல் என்ற பொருளையும், בִּזְנָבוֹ குறிக்கும் பாம்பின் வாலையும் தெளிவாகக் காக்கிறது.
- source_word: וַיַּחֲזֶק בּוֹ
  choice: அதைப் பிடித்தான்
  rationale: חזק இங்கு உறுதியாகப் பற்றிக்கொண்ட செயலைக் குறிக்கிறது; சூழலில் தேவையற்ற வலிமை நுணுக்கத்தைச் சேர்க்காமல் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיְהִי לְמַטֶּה
  choice: ஒரு கோலாக மாறியது
  rationale: היה இங்கு நிலைமாற்றத்தைக் குறிக்கிறது; מַטֶּה என்பதற்கு மோசேயின் கைக்கோல் சூழலில் ‘கோல்’ இயல்பான தமிழ் சொல்.
- source_word: בְּכַפּוֹ
  choice: அவன் கையில்
  rationale: כַּף என்பதன் சொற்பொருள் உள்ளங்கை என்றாலும், இச்சூழலில் ‘கையில்’ என்பது இயல்பான தமிழாகவும் பொருளுக்கு உண்மையாகவும் உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, எளிதில் புரியும் தமிழ். மூலத்தின் தொடர் செயல்வரிசையும் பாம்பு கோலாக மாறும் நிகழ்வும் நேரடியாகக் காக்கப்பட்டுள்ளன.
