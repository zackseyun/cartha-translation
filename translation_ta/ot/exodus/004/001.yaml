base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/001.yaml
  text: Then Moses answered and said[a], “But behold, they will not believe me, and they will not listen to my voice, for they will say[b], ‘Yahweh has not appeared to you.’”
translation:
  language: ta
  text: இதற்கு மோசே, “ஆனால் இதோ, அவர்கள் என்னை நம்பமாட்டார்கள்; என் குரலுக்குச் செவிகொடுக்கவும் மாட்டார்கள்[a]. ஏனெனில், ‘யாவே[b] உனக்குத் தோன்றவில்லை’ என்று சொல்வார்கள்” என்று பதிலளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் குரலுக்குச் செவிகொடு” என்ற எபிரெயச் சொற்றொடர், “நான் சொல்வதைக் கேள்” அல்லது “எனக்குக் கீழ்ப்படி” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “யாவே” என்பது எபிரெயத்தில் יהוה (YHWH) என எழுதப்படும் இறைபெயர்; சில மொழிபெயர்ப்புகள் இதை “ஆண்டவர்” அல்லது “கர்த்தர்” என்று வழங்குகின்றன.
    reason: divine_name
lexical_decisions:
- source_word: וַיַּעַן מֹשֶׁה וַיֹּאמֶר
  choice: இதற்கு மோசே … என்று பதிலளித்தார்
  rationale: இரண்டு எபிரெயப் பேச்சு வினைகளின் பதிலுரைக்கும் தன்மையை இயல்பான நவீனத் தமிழில் ஒருங்கிணைக்கிறது; உரையாடல் தொடர்ச்சியையும் காக்கிறது.
- source_word: וְהֵן
  choice: ஆனால் இதோ
  rationale: וְ என்பதன் எதிர்மறைத் திருப்பத்தையும் הֵן என்பதன் கவன ஈர்ப்புத் தன்மையையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: לֹא יַאֲמִינוּ לִי
  choice: அவர்கள் என்னை நம்பமாட்டார்கள்
  rationale: மோசேயின் செய்தியையும் இறை அழைப்பையும் அவர்கள் உண்மையென ஏற்கமாட்டார்கள் என்பதே சூழலில் இயல்பான பொருள்.
- source_word: וְלֹא יִשְׁמְעוּ בְּקֹלִי
  choice: என் குரலுக்குச் செவிகொடுக்கவும் மாட்டார்கள்
  rationale: எபிரெய மொழிவடிவத்தைப் பாதுகாப்பதோடு, ‘கேட்பது,’ ‘செவிகொடுப்பது,’ ‘கீழ்ப்படிவது’ ஆகிய பொருள் நிழல்களில் இச்சூழலுக்கு ஏற்ற மிதமான சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: כִּי יֹאמְרוּ
  choice: ஏனெனில் … என்று சொல்வார்கள்
  rationale: மோசேயின் அச்சத்திற்கான காரணத்தை அறிமுகப்படுத்தும் כִּי என்பதையும் எதிர்காலக் கூற்றையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: לֹא נִרְאָה אֵלֶיךָ
  choice: உனக்குத் தோன்றவில்லை
  rationale: ראה என்பதன் நிஃபால் வடிவத்திற்கு இச்சூழலில் ‘தோன்றுதல்’ என்பது இயல்பான தமிழ் இணை; இறைவெளிப்பாட்டை தேவையின்றி விளக்கிவிடாமல் விடுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்து இறைபெயரை ஒரு பொதுப்பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர் / கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்ல, தனிப்பட்ட இறைபெயரான திருநான்கெழுத்தே உள்ளது. ஆகவே அதை ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: שׁמע בקול என்பதன் வலிமை
  choice: குரலுக்குச் செவிகொடு
  alternative: கீழ்ப்படி
  rationale: இந்தச் சூழலில் மோசேயின் செய்தியை ஏற்றுக் கேட்பதே முன்னிலையில் உள்ளது; ‘கீழ்ப்படி’ என்று மட்டும் மொழிபெயர்ப்பது பொருளை அளவுக்கு மீறித் தீர்மானித்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. “இதோ” மட்டும் மூலத்தின் கவன ஈர்ப்புத் தன்மையைத் தக்கவைக்கச் சற்றே முறையான நடையில் வைக்கப்பட்டுள்ளது; மற்ற அமைப்பு இயல்பான தமிழாக்கமாக உள்ளது.
