source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ בְּ/מִדְיָ֔ן לֵ֖ךְ שֻׁ֣ב מִצְרָ֑יִם כִּי מֵ֨תוּ֙ כָּל הָ֣/אֲנָשִׁ֔ים הַֽ/מְבַקְשִׁ֖ים אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/019.yaml
  text: And Yahweh said to Moses in Midian[a], “Go, return to Egypt, because all the men who were seeking your life are dead.”
translation:
  language: ta
  text: மோசே மீதியானில் இருந்தபோது யாவே அவனிடம், “போ; எகிப்துக்குத் திரும்பு[a]. ஏனெனில் உன்னைக் கொல்லத் தேடிய ஆண்கள் அனைவரும் இறந்துவிட்டார்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் இரண்டு கட்டளை வினைகள் உள்ளன; சொற்பொருளாக, “போ, எகிப்துக்குத் திரும்பு.” இதை “எகிப்துக்குத் திரும்பிப் போ” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், ‘Yahweh’ என்பதற்கான இயல்பான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּמִדְיָן
  choice: மோசே மீதியானில் இருந்தபோது
  rationale: בְ குறிக்கும் இடத்தைத் தெளிவாகக் காட்டுவதோடு, நவீன தமிழில் வாக்கியத் தொடர்பை இயல்பாக்குகிறது.
- source_word: לֵךְ שֻׁב
  choice: போ; எகிப்துக்குத் திரும்பு
  rationale: எபிரெய மூலத்திலுள்ள இரு கட்டளை வினைகளையும் தனித்தனியாகப் பாதுகாக்கிறது; அரைப்புள்ளி அவற்றின் நெருங்கிய தொடர்பைக் காட்டுகிறது.
- source_word: מִצְרָיִם
  choice: எகிப்துக்கு
  rationale: இலக்கைச் சுட்டும் பொருளைத் தமிழின் நான்காம் வேற்றுமை உருபு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன்னுள்ள கட்டளைக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: מֵתוּ
  choice: இறந்துவிட்டார்கள்
  rationale: முடிவுற்ற இறப்பையும் அதன் தற்போதைய விளைவையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כָּל הָאֲנָשִׁים
  choice: ஆண்கள் அனைவரும்
  rationale: אֲנָשִׁים இங்கு குறிக்கும் ஆண் நபர்களை பொதுப்பாலாக்காமல் துல்லியமாகக் காட்டுகிறது.
- source_word: הַמְבַקְשִׁים
  choice: தேடிக்கொண்டிருந்த
  rationale: பங்கேற்பு வினையெச்சம் காட்டும் தொடர்ச்சியான கடந்தகால முயற்சியை வெளிப்படுத்துகிறது.
- source_word: אֶת נַפְשֶׁךָ
  choice: உன் உயிரைப் பறிக்க
  rationale: நֶפֶשׁ என்பதன் ‘உயிர்’ என்ற பொருளையும், இச்சொற்றொடர் குறிக்கும் கொலை நோக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயரே நேரடியாக உள்ளது. ஆகவே ‘ஆண்டவர்’ போன்ற பட்டத்தைப் பதிலீடு செய்யாமல், ‘Yahweh’ என்பதற்குரிய தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் இரு கட்டளைகளும் பாதுகாக்கப்பட்டுள்ளன; ‘உயிரைத் தேடுதல்’ என்ற எபிரெய வழக்கின் கொலை நோக்கம் தமிழில் தெளிவாக்கப்பட்டுள்ளது.
