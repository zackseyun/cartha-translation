  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה אֶת אִשְׁתּ֣/וֹ וְ/אֶת בָּנָ֗י/ו וַ/יַּרְכִּבֵ/ם֙ עַֽל הַ/חֲמֹ֔ר וַ/יָּ֖שָׁב אַ֣רְצָ/ה מִצְרָ֑יִם וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/020.yaml
  text: Then Moses took his wife and his sons[a], set them on the donkey, and returned to the land of Egypt[b]. And Moses took the staff of God in his hand.
translation:
  language: ta
  text: பின்பு மோசே தன் மனைவியையும் தன் மகன்களையும் அழைத்துக்கொண்டு, அவர்களைக் கழுதையின்மேல் ஏற்றி வைத்தார்[a]; அவர் எகிப்து நாட்டுக்குத் திரும்பினார். மோசே கடவுளின் கோலை[b] தன் கையில் எடுத்துக்கொண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களைக் கழுதையின்மேல் சவாரி செய்ய வைத்தார்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கடவுளின் தடியை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: பின்பு மோசே ... அழைத்துக்கொண்டு
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; ‘பின்பு’ இயல்பான தமிழ்க் கதைநடையைத் தருகிறது. மனைவியையும் மகன்களையும் குறித்த לָקַח இங்கு அவர்களைத் தன்னுடன் அழைத்துச் செல்வதைக் குறிக்கிறது.
- source_word: אִשְׁתּוֹ
  choice: தன் மனைவியை
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் வரும் אִשָּׁה என்பதன் நேரான பொருள்; இங்கு ‘சிப்போராள்’ என்று பெயரைச் சேர்க்கவில்லை.
- source_word: בָּנָיו
  choice: தன் மகன்களை
  rationale: எபிரெயச் சொல் பொதுவான ‘பிள்ளைகள்’ என்பதல்ல, குறிப்பாக ஆண்பால் பன்மையான ‘மகன்கள்’ என்பதாகும்.
- source_word: וַיַּרְכִּבֵם
  choice: அவர்களைக் ... ஏற்றி வைத்தார்
  rationale: רכב என்பதன் ஹிஃபீல் வடிவம் ‘சவாரி செய்யும்படி ஏற்றுதல்’ என்ற காரணவினைப் பொருளைத் தருகிறது; ‘ஏற்றி வைத்தார்’ என்பது அதை இயல்பான தமிழில் காக்கிறது.
- source_word: הַחֲמֹר
  choice: கழுதையின்மேல்
  rationale: பெயர்ச்சொல் சுட்டுச் சுட்டியுடன் திட்டவட்டமாக இருந்தாலும், தமிழில் இச்சூழலில் தனி ‘அந்த’ என்பதைச் சேர்க்காமல் ‘கழுதையின்மேல்’ என்பதே இயல்பாகவும் பொருள் மாறாமலும் உள்ளது.
- source_word: וַיָּשָׁב
  choice: திரும்பினார்
  rationale: שׁוב இச்சூழலில் முன்பு இருந்த இடத்திற்குத் திரும்பிச் செல்வதைக் குறிக்கிறது.
- source_word: אַרְצָה מִצְרָיִם
  choice: எகிப்து நாட்டுக்கு
  rationale: אֶרֶץ என்பதன் திசைநோக்குப் பின்னொட்டையும் ‘எகிப்து நாடு’ என்ற முழுச் சொற்றொடரையும் வெளிப்படுத்துகிறது.
- source_word: מַטֵּה הָאֱלֹהִים
  choice: கடவுளின் கோல்
  rationale: מַטֶּה என்பது எடுத்துச் செல்லப்படும் ‘கோல்/தடி’யைக் குறிக்கும்; ‘கோல்’ தற்போதைய தமிழில் இயல்பாகவும் அடையாளச் செயல்களுக்குப் பயன்படுத்தப்படும் பொருளுக்கு ஏற்றதாகவும் உள்ளது. ‘கடவுளின்’ என்ற உடைமைத் தொடர்பும் காக்கப்பட்டுள்ளது.
- source_word: בְּיָדוֹ
  choice: தன் கையில்
  rationale: மோசே அந்தக் கோலைக் கையில் எடுத்துச் செல்லும் தெளிவான உருவகத்தை எபிரெயத்துக்கு நெருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: מַטֵּה הָאֱלֹהִים என்பதில் הָאֱלֹהִים-ஐ மொழிபெயர்த்தல்
  choice: கடவுளின் கோல்
  alternative: தெய்வீகக் கோல்
  rationale: இங்கு אֱלֹהִים என்பது பொதுவான தெய்வீகத் தன்மையைக் காட்டாமல், மோசேக்குக் கட்டளையும் அடையாளங்களையும் அளித்த கடவுளையே குறிப்பாகச் சுட்டுகிறது. எனவே ‘கடவுளின்’ என்பது நேரான வாசிப்பு.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் மோசே என்ற பெயர் இருமுறை வருவது காக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் விளக்கும் சொற்களிலிருந்து இடம் மாறியிருந்ததால், [a] ஏற்றுதல் என்ற வினைக்குப் பின்னும் [b] கோல் என்ற சொல்லுக்குப் பின்னும் பொருத்தப்பட்டுள்ளன.
