id: EXO.4.2
reference: Exodus 4:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר אֵלָ֛י/ו יְהוָ֖ה מ/זה בְ/יָדֶ֑/ךָ וַ/יֹּ֖אמֶר מַטֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/002.yaml
  text: And Yahweh said to him[a], “What is that in your hand?” And he said, “A staff.”
translation:
  language: ta
  text: யாவே அவனிடம், “உன் கையில் இருப்பது என்ன?” என்று கேட்டார். அதற்கு அவன், “ஒரு கோல்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தடி” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் מַטֶּה சூழலுக்கேற்ப கைக்கோல், கோல் அல்லது தடியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலுக்கு வெளிப்படுத்தப்பட்ட இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெயத் திருநான்கெழுத்துப் பெயரின் நவீனத் தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: கேட்டார் ... என்றான்
  rationale: אמר என்பதன் அடிப்படைப் பொருள் ‘சொல்’ என்றாலும், முதல் கூற்று நேரடியான கேள்வியாகவும் இரண்டாவது அதன் பதிலாகவும் செயல்படுகிறது. இந்த உரையாடலை இயல்பான நவீனத் தமிழில் தெரிவிக்க இவ்வாறு வேறுபடுத்தப்பட்டுள்ளது.
- source_word: אֵלָיו
  choice: அவனிடம்
  rationale: முன்னிலைச் சொல்லும் ஆண்பால் ஒருமைப் பின்னொட்டும் சேர்ந்து ‘அவனிடம்/அவனுக்குச்’ என்று பொருள்படுகின்றன; உரையாடல் சூழலில் ‘அவனிடம்’ இயல்பானது.
- source_word: מַה־זֶּה / מִזֶּה
  choice: இருப்பது என்ன?
  rationale: கையில் உள்ள பொருள் எது என்று அடையாளம் கேட்கும் எபிரெய வினாவைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; ‘இது/அது’ என்ற சுட்டுச் சொல்லைத் தேவையின்றி நிர்ணயிப்பதையும் தவிர்க்கிறது.
- source_word: בְּיָדֶךָ
  choice: உன் கையில்
  rationale: மோசே பிடித்திருந்த பொருளைக் குறிக்கும் நேரடியானதும் தமிழில் இயல்பானதுமான மொழிபெயர்ப்பு.
- source_word: מַטֶּה
  choice: ஒரு கோல்
  rationale: מַטֶּה என்பது சூழலுக்கேற்ப கைக்கோல், கோல் அல்லது தடியைக் குறிக்கலாம். மோசே கையில் எடுத்துச் சென்ற பொருளுக்கு ‘கோல்’ இயல்பான, அகலமான தமிழ்ச் சொல்; ‘ஒரு’ என்பது தமிழ் உரையாடலில் இயல்பாகச் சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: இறைப்பெயரை ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கிறது; ‘யாவே’ என்பது மூல எபிரெயப் பெயருக்கான பரவலாக ஏற்கப்பட்ட நவீன ஒலிபெயர்ப்பு.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட நேரடி உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. முதல் אמר கேள்வியாகச் செயல்படுவதால் ‘கேட்டார்’ என இயல்பாக்கப்பட்டுள்ளது; இரண்டாவது ‘என்றான்’ என வழங்கப்பட்டுள்ளது. அடிக்குறிப்புக் குறி அது விளக்கும் ‘கோல்’ என்பதோடு இணைக்கப்பட்டுள்ளது.
