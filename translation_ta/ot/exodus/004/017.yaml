  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אֶת הַ/מַּטֶּ֥ה הַ/זֶּ֖ה תִּקַּ֣ח בְּ/יָדֶ֑/ךָ אֲשֶׁ֥ר תַּעֲשֶׂה בּ֖/וֹ אֶת הָ/אֹתֹֽת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/017.yaml
  text: And take this staff in your hand[b][a], with which you will perform the signs.
translation:
  language: ta
  text: இந்தக் கோலை[a] உன் கையில் எடுத்துக்கொள்; அதைக் கொண்டு நீ அந்த அடையாளங்களைச்[b] செய்வாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கோல்’ என்பதற்குப் பதிலாக ‘தடி’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மַטֶּה இரு பொருள்களையும் குறிக்கலாம்; மோசேயின் மேய்ப்பர் சூழலுக்கு ‘கோல்’ நன்றாகப் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘அற்புத அடையாளங்களை.’ எபிரெய மூலத்தில் ‘அடையாளங்கள்’ என்று மட்டுமே உள்ளது; அவற்றின் அற்புதத் தன்மையைச் சூழல் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: இந்தக் கோலை
  rationale: וְ தொடர்ச்சியைச் சுட்டினாலும், தமிழில் கட்டளையை இயல்பாகத் தொடங்க தனியே ‘மேலும்’ என்று மொழிபெயர்க்க வேண்டியதில்லை; אֶת நேரடியாக மொழிபெயர்க்கப்படாத நேர்முக வேற்றுமைக் குறி.
- source_word: הַמַּטֶּה הַזֶּה
  choice: இந்தக் கோலை
  rationale: מַטֶּה என்பது கோல் அல்லது தடி எனப் பொருள்படலாம். மோசேயின் மேய்ப்பர் சூழலுக்கும் நவீனத் தமிழுக்கும் ‘கோல்’ இயல்பாகப் பொருந்துகிறது; הַזֶּה குறிப்பிட்ட, ஏற்கெனவே பேசப்பட்ட கோலைச் சுட்டுகிறது.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: உன் கையில் எடுத்துக்கொள்
  rationale: இங்குள்ள வினை வடிவம் கட்டளையின் வலிமையுடையது. ‘உன் கையில் எடுத்துக்கொள்’ என்பது எபிரெயச் சொல்லமைப்பைப் பேணும் இயல்பான தமிழ்.
- source_word: אֲשֶׁר ... בּוֹ
  choice: அதைக் கொண்டு
  rationale: בּוֹ கோல் ஒரு கருவியாகப் பயன்படுத்தப்படுவதைக் குறிக்கிறது. தொடர்புச் சொல்லமைப்பைச் செயற்கையாகப் பின்பற்றாமல், அதன் கருவிப்பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: תַּעֲשֶׂה
  choice: செய்வாய்
  rationale: עָשָׂה என்பதன் அடிப்படைப் பொருள் ‘செய்’. ‘நிகழ்த்துவாய்’ என்பதும் சூழலில் சாத்தியமானது; ஆனால் ‘செய்வாய்’ மூலத்தின் எளிமையையும் அகலமான பொருளையும் பேணுகிறது.
- source_word: הָאֹתֹת
  choice: அந்த அடையாளங்களை
  rationale: உறுதிப்படுத்தும் அடையாளங்களைக் குறிக்கும் אוֹת என்பதற்கு ‘அடையாளங்கள்’ நேரான இணை. எபிரெயிலுள்ள definite article, முன்பு விவரிக்கப்பட்ட அடையாளங்களைச் சுட்டுவதால் தமிழில் ‘அந்த’ என வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: הָאֹתֹת என்பதை அற்புதங்களாக வெளிப்படையாக வகைப்படுத்தலாமா?
  choice: முதன்மை உரையில் ‘அந்த அடையாளங்கள்’
  alternative: ‘அந்த அற்புத அடையாளங்கள்’
  rationale: சூழலில் அவை அற்புதத் தன்மையுடையவை என்றாலும், எபிரெய மூலத்தில் ‘அற்புத’ என்பதற்கான தனிச்சொல் இல்லை. எனவே விளக்கத்தை உரைக்குள் சேர்க்காமல் மூலத்தின் சொல்லாட்சியைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை ஆண்பால் உரையாடல் வடிவமான ‘உன்/நீ’ பயன்படுத்தப்பட்டுள்ளது. வாக்கியம் கண்ணியமானதாயும் சாதாரண வாசகர்களுக்கு எளிதில் புரியத்தக்கதாயும் உள்ளது. அரைப்புள்ளி கட்டளையையும் கோலின் நோக்கத்தை விளக்கும் தொடரையும் தெளிவாக இணைக்கிறது.
