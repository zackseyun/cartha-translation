source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו מִ֣י שָׂ֣ם פֶּה֮ לָֽ/אָדָם֒ א֚וֹ מִֽי יָשׂ֣וּם אִלֵּ֔ם א֣וֹ חֵרֵ֔שׁ א֥וֹ פִקֵּ֖חַ א֣וֹ עִוֵּ֑ר הֲ/לֹ֥א אָנֹכִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/011.yaml
  text: And the LORD said to him, “Who has put a mouth on man? Or who makes one mute, or deaf, or sighted, or blind? Is it not I, the LORD?”
translation:
  language: ta
  text: அப்போது ஆண்டவர் அவனிடம், “மனிதனுக்கு வாயை அமைத்தவர் யார்? ஒருவனைப் பேச முடியாதவனாகவோ, கேட்க முடியாதவனாகவோ, காணக்கூடியவனாகவோ, பார்வையற்றவனாகவோ ஆக்குகிறவர் யார்? ஆண்டவராகிய நானல்லவா?” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தமிழ் வேதாகம நடையில் பரவலாக அறியப்படும் மரியாதைக்குரிய மொழிபெயர்ப்பு; தேவப்பெயரைப் பிரதிநிதித்துவப்படுத்துகிறது.
- source_word: שָׂם פֶּה לָאָדָם
  choice: மனிதனுக்கு வாயை அமைத்தவர்
  rationale: எபிரெய மொழியின் ‘வாயை வைத்தல்/அமைத்தல்’ என்ற உருவகத்தை இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: אִלֵּם
  choice: பேச முடியாதவன்
  rationale: இன்றைய வாசகர்களுக்கு தெளிவான, இழிவுபடுத்தாத செயற்பாட்டு விளக்கம்.
- source_word: חֵרֵשׁ
  choice: கேட்க முடியாதவன்
  rationale: மூலத்தின் உடல்சார் பொருளைத் தெளிவாகவும் மரியாதையாகவும் தெரிவிக்கிறது.
- source_word: פִקֵּחַ
  choice: காணக்கூடியவன்
  rationale: இணையான உறுப்புகளின் சூழலில் பார்வைத்திறன் உடையவர் என்ற பொருளைத் தருகிறது; ‘seeing/sighted’ என்ற மூலச் சான்றைத் தொடர்ந்து செல்கிறது.
- source_word: עִוֵּר
  choice: பார்வையற்றவன்
  rationale: நவீனத் தமிழில் இயல்பானதும் மரியாதைக்குரியதுமான சொல்.
- source_word: הֲלֹא אָנֹכִי יְהוָה
  choice: ஆண்டவராகிய நானல்லவா?
  rationale: வலியுறுத்தப்பட்ட אָנֹכִי மற்றும் எதிர்பார்க்கப்படும் உடன்பாட்டைக் கொண்ட வினாவைச் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: பேச்சு, செவித்திறன், பார்வை ஆகிய மனித நிலைகளுக்கும் ஆண்டவருக்கும் இடையிலான தொடர்பு
  choice: ‘ஆக்குகிறவர் யார்? ஆண்டவராகிய நானல்லவா?’ என மூலத்தின் நேரடியான இறையியல் வலியுறுத்தலைப் பாதுகாத்தல்
  alternative: இந்த நிலைகளை ஆண்டவர் வெறுமனே அனுமதிக்கிறார் அல்லது அவற்றைச் சரிசெய்கிறார் என மென்மைப்படுத்துதல்
  rationale: יָשׂוּם மற்றும் இறுதி வினா தேவனின் செயற்பாட்டை நேரடியாகக் கூறுகின்றன; அந்த இறையியல் பதற்றத்தை மொழிபெயர்ப்பு மறைக்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பான, கண்ணியமான நடை. உடல் இயலாமையைக் குறிக்கும் இடங்களில் இழிவுபடுத்தாத ‘முடியாதவர்/பார்வையற்றவர்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; அதேவேளை மூலத்தின் நேரடியான கருத்து மென்மைப்படுத்தப்படவில்லை.
