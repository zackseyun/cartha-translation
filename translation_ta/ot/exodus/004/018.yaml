translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மோசே மாமனிடம் மரியாதைப் பன்மையில் பேசுகிறார்; எத்திரோவின் சுருக்கமான அனுப்புதல் ஒருமையில் வைக்கப்பட்டுள்ளது. அடிக்குறி [a] பெயருக்குப் பின்னரும் [b] மாற்றுப் பொருள் தொடர்புடைய ‘சகோதரர்கள்’ கருத்தை விளக்கும் வகையில் வசன முடிவிலும் இடம்பெறுகின்றன.
