  text: וַ/יֵּ֨לֶךְ מֹשֶׁ֜ה וַ/יָּ֣שָׁב אֶל יֶ֣תֶר חֹֽתְנ֗/וֹ וַ/יֹּ֤אמֶר ל/וֹ֙ אֵ֣לֲכָה נָּ֗א וְ/אָשׁ֨וּבָה֙ אֶל אַחַ֣/י אֲשֶׁר בְּ/מִצְרַ֔יִם וְ/אֶרְאֶ֖ה הַ/עוֹדָ֣/ם חַיִּ֑ים וַ/יֹּ֧אמֶר יִתְר֛וֹ לְ/מֹשֶׁ֖ה לֵ֥ךְ לְ/שָׁלֽוֹם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/018.yaml
  text: Then Moses went and returned to Jethro his father-in-law and said to him[a], “Please let me go and return to my brothers who are in Egypt, so that I may see whether they are still alive.” And Jethro said to Moses[b], “Go in peace.”
translation:
  language: ta
  text: பின்பு மோசே தன் மாமனாரான எத்திரோவிடம்[a] திரும்பிச் சென்று, அவரிடம், “தயவுசெய்து, நான் எகிப்தில் இருக்கும் என் சகோதரர்களிடம்[b] திரும்பிப் போய், அவர்கள் இன்னும் உயிரோடு இருக்கிறார்களா என்று பார்க்க அனுமதியளியுங்கள்” என்றார். எத்திரோ மோசேயிடம், “சமாதானத்துடன் போ” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு முதல் முறை எபிரெயத்தில் பெயர் ‘எத்தேர்’ என்றும், பின்னர் ‘எத்திரோ’ என்றும் வருகிறது; இரண்டும் ஒரே நபரைக் குறிப்பதால் முதன்மை உரையில் ‘எத்திரோ’ பயன்படுத்தப்பட்டுள்ளது.
    reason: textual_variant
  - marker: b
    text: “என் சகோதரர்கள்” என்பதற்கு “என் உறவினர்கள்” அல்லது “என் சொந்த மக்கள்” என்றும் பொருள் கொள்ளலாம்; எபிரெயத்தில் நேரடியாக “என் சகோதரர்கள்” என்றே உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... וַיָּשָׁב
  choice: பின்பு ... திரும்பிச் சென்று
  rationale: தொடர்ச்சியான wayyiqtol வடிவங்கள் கதையை முன்னெடுக்கின்றன; தமிழில் இயல்பான கதைநடை வரிசையையும் שׁוּב என்பதன் ‘திரும்புதல்’ பொருளையும் காக்கிறது.
- source_word: יֶתֶר / יִתְרוֹ
  choice: எத்திரோ
  rationale: ஒரே நபரைக் குறிக்கும் இரு பெயர் வடிவங்கள் வசனத்தில் வருகின்றன. வாசிப்பின் தொடர்ச்சிக்காக முதன்மை உரையில் பரவலாக அறியப்பட்ட ‘எத்திரோ’ பயன்படுத்தப்பட்டு, வேறுபாடு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: חֹתְנוֹ
  choice: தன் மாமனாகிய
  rationale: இச்சூழலில் மோசேயின் மனைவியின் தந்தை குறிக்கப்படுகிறார்; நவீன தமிழில் ‘மாமன்’ இயல்பான உறவுமுறைச் சொல்.
- source_word: אֵלֲכָה נָּא
  choice: நான் ... போய் ... எனக்கு அனுமதி கொடுங்கள்
  rationale: cohortative உடன் வரும் נָא மரியாதையான வேண்டுகோளை வெளிப்படுத்துகிறது; அதனைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אַחַי
  choice: என் சகோதரர்கள்
  rationale: எபிரெயச் சொல்லின் நேர்ப்பொருள் ‘என் சகோதரர்கள்’; அது விரிவாக உறவினர் அல்லது சொந்த மக்களையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְאֶרְאֶה הַעוֹדָם חַיִּים
  choice: அவர்கள் இன்னும் உயிரோடு இருக்கிறார்களா என்று பார்க்க
  rationale: பார்ப்பதற்கான நோக்கத்தையும் அவர்கள் உயிருடன் இருப்பது குறித்த கேள்வி அல்லது உறுதியின்மையையும் தெளிவாகக் காக்கிறது.
- source_word: לֵךְ לְשָׁלוֹם
  choice: சமாதானத்துடன் போ
  rationale: இது ஆசீர்வாதத்தோடும் நல்வாழ்த்தோடும் வழியனுப்பும் எபிரெய மரபுத்தொடர்; அதன் வடிவமும் உணர்வும் தமிழில் காக்கப்படுகின்றன.
