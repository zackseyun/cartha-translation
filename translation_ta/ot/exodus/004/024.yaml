base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/024.yaml
  text: And it happened on the way[a], at the lodging place[b], that Yahweh met him and sought to put him to death.
translation:
  language: ta
  text: வழியில், இரவுத் தங்குமிடத்தில்[b], யாவே அவனை[a]ச் சந்தித்து, அவனைக் கொல்ல நாடினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில் ‘அவனை’ என்பது யாரைக் குறிக்கிறது என்று வெளிப்படையாகக் கூறப்படவில்லை; அது மோசேயையோ, சில விளக்கங்களின்படி அவரது மகனையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘இரவு முகாமிட்ட இடத்தில்’; எபிரெயச் சொல் தங்கும் இடத்தைக் குறிக்கிறது; அது வணிக விடுதியாக இருக்க வேண்டியதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: பயணத்தின்போது
  rationale: எபிரெயக் கதைநடையின் புதிய நிகழ்வை அறிமுகப்படுத்தும் வடிவம் தமிழில் தனியாக ‘அது நிகழ்ந்தது’ என்று கூறாமல், காலச் சூழலோடு இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: בַדֶּרֶךְ
  choice: பயணத்தின்போது
  rationale: ‘வழியில்’ என்ற நேரடியான பொருளைச் சூழலுக்கேற்ற இயல்பான நவீன தமிழில் கால-இடக் குறிப்பாக வழங்குகிறது.
- source_word: בַמָּלוֹן
  choice: இரவு தங்கும் இடத்தில்
  rationale: מָלוֹן என்பது இரவில் தங்கும் இடத்தைக் குறிக்கிறது; இன்றைய வணிக விடுதி என்ற பொருளைத் தேவையின்றி புகுத்தாமல் உள்ளது.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: அவனைச் சந்தித்து
  rationale: פגע என்பதன் அடிப்படைப் பொருளான சந்தித்தல் அல்லது எதிர்ப்படுதல் என்பதைக் காக்கிறது; சந்திப்பின் பகைமைத் தன்மையை அடுத்த வினை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיְבַקֵּשׁ
  choice: முயன்றார்
  rationale: இந்தச் சூழலில் בקש என்பது ஒரு செயலைச் செய்ய நாடுதல் அல்லது முயலுதல் என்ற பொருளில் வருகிறது; இயல்பற்ற ‘தேடினார்’ என்பதைக் காட்டிலும் தமிழில் நோக்கத்தைத் தெளிவாகத் தருகிறது.
- source_word: הֲמִיתוֹ
  choice: அவனைக் கொல்ல
  rationale: מות என்பதன் ஹிஃபில் வடிவம் ‘சாகச் செய்தல்’ அல்லது ‘கொல்லுதல்’ எனப் பொருள்படும்; சுருக்கமாகவும் தெளிவாகவும் வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல வசனம் இறைவனின் தனிப்பட்ட பெயரை நேரடியாகப் பயன்படுத்துவதால், அதைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: ‘அவனை’ என்ற ஆண்பால் ஒருமைச் சுட்டின் குறிப்பு
  choice: பெயரைக் குறிப்பிடாமல் ‘அவனை’ எனவே வைத்தல்
  alternative: மோசே; மோசேயின் மகன்
  rationale: எபிரெய வசனம் அந்தச் சுட்டுப்பெயர் யாரைக் குறிக்கிறது என்பதைத் தெளிவாக அடையாளப்படுத்தவில்லை. ஆகவே உரையின் உண்மையான தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சுட்டுப்பெயர் தெளிவின்மை காக்கப்பட்டுள்ளது; ‘இரவு தங்கும் இடம்’ என்பது காலத்திற்குப் பொருந்தாத நவீன விடுதி எண்ணத்தைத் தவிர்க்கிறது.
