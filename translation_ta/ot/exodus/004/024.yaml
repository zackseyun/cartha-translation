revisions:
- from: பயணத்தின்போது, இரவு தங்கும் இடத்தில்[b], யாவே அவனை[a]ச் சந்தித்து, அவனைக் கொல்ல முயன்றார்.
  to: வழியில், இரவுத் தங்குமிடத்தில்[b], யாவே அவனை[a]ச் சந்தித்து, அவனைக் கொல்ல நாடினார்.
  rationale: The revision restores the Hebrew locative sense with வழியில் and replaces ‘tried to kill’ with கொல்ல நாடினார், which better carries ‘sought to kill’ without implying that the attempt was carried out. It retains the direct rendering of the divine name, the ambiguous pronouns, and the noncommercial lodging-place sense.
