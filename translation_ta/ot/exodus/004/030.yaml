source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר אַהֲרֹ֔ן אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה וַ/יַּ֥עַשׂ הָ/אֹתֹ֖ת לְ/עֵינֵ֥י הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/030.yaml
  text: Aaron spoke all the words that Yahweh had spoken to Moses[a], and he performed the signs before the eyes of the people.
translation:
  language: ta
  text: ஆரோன், யாவே மோசேயிடம் கூறிய எல்லா வார்த்தைகளையும் பேசினான்; மக்கள் கண்முன்னே[a] அடையாளங்களைச் செய்துகாட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்கள் பார்க்கும்படி.”
    reason: லְעֵינֵי הָעָם என்ற எபிரெய மரபுத்தொடரின் இயல்பான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: எடுத்துச் சொன்னான்
  rationale: பיעל வடிவிலுள்ள דבר என்பதன் ‘பேசுதல்/சொல்லுதல்’ என்ற பொருளையும், மோசேயிடம் கூறப்பட்ட செய்தியை ஆரோன் மற்றவர்களுக்கு உரைத்த சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: எல்லா வார்த்தைகளையும்
  rationale: ‘எல்லாவற்றையும்’ என்று பொதுமைப்படுத்தாமல், எபிரெய உரையின் ‘வார்த்தைகள்’ என்ற தெளிவான கூறைத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: யாவே மோசேயிடம் கூறிய
  rationale: முன்னதாக யாவே மோசேயிடம் கூறியவற்றைக் குறிக்கும் தொடர்புச் சொற்றொடரை இயல்பான தமிழ் வரிசையில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் பரவலாக ஏற்கப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: וַיַּעַשׂ
  choice: செய்துகாட்டினான்
  rationale: עשה என்பதன் அடிப்படை ‘செய்’ பொருளைத் தக்கவைத்தபடி, காண்போர் முன்னிலையில் அடையாளங்களை நிகழ்த்தியதை இயல்பாகச் சொல்கிறது.
- source_word: הָאֹתֹת
  choice: அந்த அடையாளங்களை
  rationale: முந்தைய சூழலில் கொடுக்கப்பட்ட குறிப்பிட்ட அடையாளங்களைச் சுட்டுகிறது; ‘அற்புதங்கள்’ என்று விளக்கி விரிவுபடுத்தாமல் உரையின் சொல்லைத் தக்கவைக்கிறது.
- source_word: לְעֵינֵי הָעָם
  choice: மக்கள் கண்முன்
  rationale: ‘மக்களின் கண்களுக்கு முன்’ என்ற எபிரெய உருவகத்தைச் சுருக்கமான, இயல்பான நவீன தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது உரைக்கு நெருக்கமானது.
- issue: அடையாளங்களைச் செய்தவர் யார்?
  choice: இலக்கணப்படி ஒருமை ஆண்பால் எழுவாயான ஆரோனையே தொடரும் வகையில் மொழிபெயர்த்தல்
  alternative: மோசே செய்ததாக வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: וַיַּעַשׂ என்பதன் வெளிப்படாத எழுவாய், வாக்கியத்தின் முன் குறிப்பிடப்பட்ட ஆரோன் என்பதே நேரடியான இலக்கண வாசிப்பு. சுற்றுச் சூழலால் எழக்கூடிய கேள்வியைத் தீர்க்க மோசேயின் பெயரை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மக்கள் கண்முன்’ என்ற உயிரோட்டமுள்ள எபிரெய மரபுத்தொடர் இயல்பாகத் தக்கவைக்கப்பட்டுள்ளது; இறைப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
