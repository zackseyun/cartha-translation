  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עַתָּ֖ה לֵ֑ךְ וְ/אָנֹכִי֙ אֶֽהְיֶ֣ה עִם פִּ֔י/ךָ וְ/הוֹרֵיתִ֖י/ךָ אֲשֶׁ֥ר תְּדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/012.yaml
  text: Now go[a], and I will be with your mouth and teach you what you shall speak.
translation:
  language: ta
  text: இப்போது போ; நான் உன் வாயுடன் இருப்பேன்; நீ பேச வேண்டியதை உனக்குக் கற்பிப்பேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: மோசேயின் எதிர்ப்புக்குப் பதிலாக உடனடியாகச் செய்ய வேண்டிய அடுத்த செயலை அறிமுகப்படுத்தும் கால–உரையாடல் குறிப்பை இயல்பான தமிழில் தருகிறது.
- source_word: לֵךְ
  choice: போ
  rationale: הלך என்பதன் நேரடியான கட்டளை வடிவத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְאָנֹכִי אֶהְיֶה
  choice: நான் … இருப்பேன்
  rationale: தனிப்பட்ட சுட்டுப்பெயர் தரும் வலியுறுத்தலைத் தமிழ் எழுவாயான ‘நான்’ தக்கவைக்கிறது; ‘நானே’ என்று மிகைப்படுத்தாமல் இயல்பான நடையைப் பேணுகிறது.
- source_word: עִם פִּיךָ
  choice: உன் வாயோடு
  rationale: ‘உன் வாயுடன்’ என்ற எபிரெய மொழியின் உருவகத்தைத் தக்கவைத்து, மோசேயின் பேச்சுத் திறனைத் தேவன் உடனிருந்து செயல்படுத்துவார் என்ற மையத்தை விளக்கவுரையாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: וְהוֹרֵיתִיךָ
  choice: உனக்குக் கற்பிப்பேன்
  rationale: ירה என்பதன் ஹிஃபில் வடிவம் இங்கு ‘கற்பித்தல்/அறிவுறுத்தல்’ எனப் பொருள்படுகிறது; ‘கற்பிப்பேன்’ என்பது தெளிவான நவீன தமிழ்.
- source_word: אֲשֶׁר תְּדַבֵּר
  choice: நீ என்ன பேச வேண்டும் என்பதை
  rationale: தேவன் கற்பிக்கவிருப்பதன் உள்ளடக்கத்தையும், மோசே பேச வேண்டிய பொறுப்பையும் இயல்பான தமிழில் தெரிவிக்கிறது; ‘பேசு’ என்பது דבר என்பதற்கு நெருக்கமானது.
theological_decisions:
- issue: அழைப்புப் பணியில் தேவனுடைய உடனிருப்பைக் குறிக்கும் சொற்றொடர்
  choice: நான் உன் வாயோடு இருப்பேன்
  alternative: நீ பேசுவதற்கு நான் உதவுவேன்
  rationale: மூலத்தின் உறுதியான, உடல்சார்ந்த உருவகத்தை விளக்கவுரையாகச் சுருக்காமல் தக்கவைக்கிறது. மோசேயின் பேச்சுக்கு உதவி மட்டும் கிடைக்கும் என்பதற்கும் மேலாக, தேவனே அவனுடைய வாயோடு இருப்பார் என்ற இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கட்டளை மற்றும் வாக்குறுதி நடை பயன்படுத்தப்பட்டுள்ளது. ‘உன் வாயோடு இருப்பேன்’ என்பது தமிழில் சற்றே அசாதாரணமாக இருந்தாலும், மூல எபிரெய உருவகத்தையும் அதன் இறையியல் அழுத்தத்தையும் காக்கும் பொருட்டு தக்கவைக்கப்பட்டுள்ளது.
