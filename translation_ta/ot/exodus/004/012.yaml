revisions:
- from: இப்போது போ. நான் உன் வாயோடு இருப்பேன்[a]; நீ என்ன பேச வேண்டும் என்பதை உனக்குக் கற்பிப்பேன்.
  to: இப்போது போ; நான் உன் வாயுடன் இருப்பேன்; நீ பேச வேண்டியதை உனக்குக் கற்பிப்பேன்.
  rationale: 'The revision preserves every semantic element of the Hebrew: the immediate command, the emphatic first-person divine promise, presence specifically with Moses’ mouth, and instruction about what he is to speak. It uses a more standard formal Tamil connective and removes a redundant footnote without paraphrasing the source’s embodied idiom.'
