base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/023.yaml
  text: And I said to you, ‘Send out my son so that he may serve me,’ but you refused to send him out. Look, I am about to kill your son, your firstborn.
translation:
  language: ta
  text: நான் உன்னிடம், ‘என் மகன் எனக்குச் சேவை செய்யும்படி அவனைப் போகவிடு’ என்று சொன்னேன். ஆனால் நீ அவனைப் போகவிட மறுத்தாய். இதோ, நான் உன் மகனை, உன் முதற்பேறான மகனைக் கொல்லப்போகிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלַּח / לְשַׁלְּחוֹ
  choice: அனுப்பிவிடு / அனுப்பிவிட
  rationale: இச்சூழலில் எகிப்திலிருந்து விடுவித்து அனுப்புதல் என்ற பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; இரு இடங்களிலும் எபிரெயச் சொல்லின் மீளுருவாக்கத்தையும் காக்கிறது.
- source_word: וְיַעַבְדֵנִי
  choice: அவன் எனக்குப் பணிசெய்யட்டும்
  rationale: עבד என்பதன் ‘சேவை செய்/பணிசெய்’ என்ற பரந்த பொருளைக் காக்கிறது; வழிபாடு மட்டும் என்று பொருளைச் சுருக்கவில்லை.
- source_word: הִנֵּה
  choice: இதோ
  rationale: வரவிருக்கும் தீர்ப்பை வலியுறுத்திக் கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லுக்கு நேர்த்தியான இணை.
- source_word: בְּכֹרֶךָ
  choice: உன் தலைப்பிள்ளை
  rationale: பிறப்புவரிசையில் முதலில் பிறந்த பிள்ளையைக் குறிக்கும் இயல்பான, பாலினக் கட்டுப்பாடு குறைந்த தமிழ் சொல்; இங்கு முன் வரும் ‘மகன்’ அதைப் பார்வோனின் முதற்பேறான மகனாகத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ‘என் மகன்’ என்பதன் குறிப்பு
  choice: உரையில் ‘என் மகன்’ என்ற உருவக அடையாளத்தை மாற்றாமல் வைத்தல்
  alternative: ‘என் மக்களாகிய இஸ்ரவேல்’ என்று வெளிப்படுத்தல்
  rationale: முந்தைய வசனத்தின் பின்னணி குறிப்பைத் தெளிவாக்கினாலும், மூலத்தின் தந்தை–மகன் ஒப்புமையையும் பார்வோனின் மகனோடு உள்ள திட்டமிட்ட இணைப்பையும் நேரடியாகக் காக்க வேண்டும்.
- issue: தெய்வீகத் தீர்ப்பின் உடனடித்தன்மை
  choice: ‘கொல்லப்போகிறேன்’
  alternative: ‘கொல்வேன்’
  rationale: הֹרֵג என்ற பங்கேற்புவடிவம் அண்மையில் நிகழவிருக்கும் உறுதியான செயலைச் சுட்டுகிறது; தீர்ப்பின் தீவிரத்தையும் வரவிருக்கும் தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரை. கட்டளையிலும் மறுப்பிலும் ‘அனுப்பிவிடு’ என்பதை மீண்டும் பயன்படுத்தி மூலத்தின் சொல் ஒற்றுமை காக்கப்பட்டுள்ளது. எந்த அடிக்குறிப்பும் தேவையில்லை.
