base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/005.yaml
  text: It was reported to the king of Egypt that the people had fled[a], and the heart of Pharaoh and his servants was turned against the people, and they said, “What is this we have done[b], that we have let Israel go from serving us?”
translation:
  language: ta
  text: அந்த மக்கள் தப்பியோடிவிட்டார்கள் என்று எகிப்தின் அரசனுக்குத் தெரிவிக்கப்பட்டது. அப்போது பார்வோன் மற்றும் அவனுடைய பணியாளர்களின் உள்ளம் அந்த மக்களுக்கு எதிராக மாறியது[a]. அவர்கள், “என்ன இது, நாம் இப்படிச் செய்துவிட்டோம்? இஸ்ரவேலர் நமக்குப் பணிசெய்யாமல் இருக்கும்படி அவர்களை அனுப்பிவிட்டோமே[b]!” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பார்வோனுக்கும் அவனுடைய பணியாளர்களுக்கும் அந்த மக்களைக் குறித்த மனநிலை மாறியது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இஸ்ரவேலரை நமது சேவையிலிருந்து விடுவித்துவிட்டோமே” அல்லது “அவர்கள் நமது அடிமைகளாக இருப்பதிலிருந்து விடுவித்துவிட்டோமே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: தெரிவிக்கப்பட்டது
  rationale: குறிப்பிடப்படாத ஒருவர் செய்தியை அறிவித்தார் என்பதைக் காட்டும் எபிரெயச் செயப்பாட்டு வடிவத்தைத் தமிழிலும் செயப்பாட்டு அமைப்பில் பாதுகாக்கிறது.
- source_word: כִּי בָרַח הָעָם
  choice: அந்த மக்கள் தப்பியோடிவிட்டார்கள்
  rationale: ברח என்பதன் ‘தப்பியோடு/ஓடிப்போ’ என்ற பொருளையும், செய்தி தெரிவிக்கப்படுவதற்கு முன்பே நிகழ்ந்த செயல் என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיֵּהָפֵךְ לְבַב פַּרְעֹה וַעֲבָדָיו
  choice: பார்வோன் மற்றும் அவனுடைய பணியாளர்களின் உள்ளம் ... மாறியது
  rationale: לְבַב குறிக்கும் சிந்தனை, விருப்பம், மனவுறுதி ஆகியவற்றின் மையத்தை ‘உள்ளம்’ எனக் காட்டி, எபிரெய மூலத்தின் ஒருமை உருவகத்தையும் முடிந்தவரை பாதுகாக்கிறது.
- source_word: אֶל הָעָם
  choice: அந்த மக்களுக்கு எதிராக
  rationale: சூழலில் இது வெறும் திசைமாற்றமல்ல, பகைமையான மனமாற்றம் என்பதால் ‘எதிராக’ என்பது கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: מַה זֹּאת עָשִׂינוּ
  choice: என்ன இது, நாம் இப்படிச் செய்துவிட்டோம்?
  rationale: கேள்விச்சொல்லோடு வரும் சுட்டுப்பெயரையும், அவர்கள் வெளிப்படுத்தும் அதிர்ச்சியையும் வருத்தத்தையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: שִׁלַּחְנוּ
  choice: விடுவித்துவிட்டோமே
  rationale: இச்சூழலில் இஸ்ரவேலரை அனுப்பிவிட்ட அல்லது போகவிட்ட செயலைக் குறிக்கிறது; ‘விடுவித்தோம்’ என்பது அடிமைத்தனத்திலிருந்து செல்ல அனுமதித்த கருத்தை இயல்பாகச் சொல்கிறது.
- source_word: מֵעָבְדֵנוּ
  choice: நமக்குப் பணிசெய்வதிலிருந்து
  rationale: இஸ்ரவேலர் எகிப்தியருக்குச் செய்த பணியை நேரடியாகக் குறிப்பிடுகிறது; பிரதான உரையில் ‘எங்கள் அடிமைகளாக இருப்பதிலிருந்து’ என்ற வலுவான விளக்கத்தைச் சேர்க்காமல் மூலத்துக்கு நெருக்கமாக உள்ளது.
theological_decisions:
- issue: לְבַב என்ற மனித உள்ளியல்சார் சொல்லின் மொழிபெயர்ப்பு
  choice: உள்ளம்
  alternative: மனம் / மனநிலை
  rationale: இச்சொல் சிந்தனையையும் விருப்பத்தையும் குறித்தாலும், மூலத்தின் உட்புற மனிதனைச் சுட்டும் உருவகத்தை ‘உள்ளம்’ பாதுகாக்கிறது; நவீன உளவியல் சொல்லாக மட்டும் சுருக்குவதில்லை.
- issue: מֵעָבְדֵנוּ என்பதில் இஸ்ரவேலரின் நிலை
  choice: நமக்குப் பணிசெய்வதிலிருந்து
  alternative: எங்கள் அடிமைகளாக இருப்பதிலிருந்து
  rationale: பரந்த யாத்திராகமச் சூழல் கட்டாய அடிமைத்தனத்தைத் தெளிவுபடுத்தினாலும், இக்கூற்று நேரடியாக அவர்கள் எகிப்துக்குச் செய்த பணியையே கூறுகிறது. எனவே பிரதான உரை அந்த அளவிலேயே நிற்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடைத் தெளிவும் உள்ள பாணி பயன்படுத்தப்பட்டுள்ளது. ‘உள்ளம்’ என்பது மூல உருவகத்தைப் பாதுகாக்கிறது; ‘என்ன இது’ என்பது எபிரெயக் கேள்வியின் அதிர்ச்சி மற்றும் வருத்தத் தொனியை இயல்பாகக் கொண்டுவருகிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
