base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/012.yaml
  text: Is this not the word that we spoke to you in Egypt, saying, ‘Leave us alone so that we may serve the Egyptians’? For it would have been better for us to serve the Egyptians than to die in the wilderness.
translation:
  language: ta
  text: “எகிப்தில் நாங்கள் உங்களிடம், ‘எங்களை விட்டுவிடுங்கள்; நாங்கள் எகிப்தியருக்கு அடிமைகளாய் இருப்போம்’ என்று சொன்ன வார்த்தை இதுதானே? ஏனெனில், பாலைவனத்தில் இறப்பதைவிட எகிப்தியருக்கு அடிமைகளாய் இருப்பதே எங்களுக்கு நல்லதாக இருந்திருக்கும்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲדַל מִמֶּנּוּ
  choice: எங்களை விட்டுவிடும்
  rationale: ‘எங்களிடமிருந்து விலகியிரும்/எங்களைத் தொந்தரவு செய்யாதீர்’ என்ற வேண்டுகோளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְנַעַבְדָה אֶת־מִצְרָיִם / עֲבֹד אֶת־מִצְרַיִם
  choice: எகிப்தியருக்கு அடிமைகளாக வேலை செய்வோம் / வேலை செய்வதே
  rationale: עבד என்பதன் ‘பணி செய்/சேவை செய்’ என்ற பொருளுடன், இச்சூழலில் குறிக்கப்படும் கட்டாய அடிமைத்தனத்தையும் தெளிவாக்குகிறது; מִצְרַיִם இங்கு நாட்டை அல்ல, எகிப்திய ஆட்சியாளர்களைச் சுட்டும் கூட்டுப்பெயராகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: כִּי טוֹב לָנוּ ... מִמֻּתֵנוּ
  choice: ஏனெனில் ... எங்களுக்கு நன்றாக இருந்திருக்கும்
  rationale: அவர்கள் இப்போது எதிர்கொள்ளும் ஆபத்தை முன்னிட்டு, எகிப்திலேயே தங்கியிருந்த மாற்றுநிலையைப் பற்றிய ஒப்பீட்டு வருத்தத்தை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּמִּדְבָּר
  choice: பாலைவனத்தில்
  rationale: மக்கள் குடியிராத வறண்ட வனாந்தரப் பகுதியைக் குறிக்கும் சொல்லை பொதுவாகப் புரியும் நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: עבד என்ற வினையின் சமூக-இறையியல் நிறம்
  choice: அடிமைகளாக வேலை செய்வது
  alternative: சேவை செய்வது
  rationale: இவ்வசனம் எகிப்தில் இஸ்ரவேலர் அனுபவித்த அடிமைத்தனத்தை நினைவுகூருவதால், நடுநிலையான ‘சேவை’ என்பதைக் காட்டிலும் சூழலுக்குரிய கட்டாய உழைப்பை வெளிப்படுத்துவது பொருத்தமானது; அதேவேளை கூடுதல் சமய விளக்கத்தைச் சேர்க்கவில்லை.
- issue: טוֹב לָנוּ என்பதன் காலநிலை
  choice: நன்றாக இருந்திருக்கும்
  alternative: நல்லது
  rationale: எகிப்தை விட்டு வந்ததற்கு மாறான, நிகழாமல் போன நிலையைப் பற்றிய அவர்களின் வருத்தத்தைத் தமிழில் தெளிவாகக் காட்டுகிறது; இது மூலத்தின் ஒப்பீட்டு கருத்தை விளக்கினாலும் அதன் குற்றச்சாட்டு நிறத்தை மாற்றாது.
translation_notes:
  register: மோசேயை நோக்கிப் பன்மையினர் பேசுவதால் மரியாதை/பன்மை வினைமுற்றான ‘விட்டுவிடும்’ பயன்படுத்தப்பட்டது. மொழிநடை நவீனமும் கண்ணியமானதும்; உரையாடலின் குற்றஞ்சாட்டும் தொனி பாதுகாக்கப்பட்டுள்ளது. தேவையற்ற அடிக்குறிப்புகள் சேர்க்கப்படவில்லை.
