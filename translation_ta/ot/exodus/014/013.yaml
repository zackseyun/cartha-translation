  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל הָ/עָם֮ אַל תִּירָאוּ֒ הִֽתְיַצְב֗וּ וּ/רְאוּ֙ אֶת יְשׁוּעַ֣ת יְהוָ֔ה אֲשֶׁר יַעֲשֶׂ֥ה לָ/כֶ֖ם הַ/יּ֑וֹם כִּ֗י אֲשֶׁ֨ר רְאִיתֶ֤ם אֶת מִצְרַ֨יִם֙ הַ/יּ֔וֹם לֹ֥א תֹסִ֛יפוּ לִ/רְאֹתָ֥/ם ע֖וֹד עַד עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/013.yaml
  text: And Moses said to the people, “Do not fear. Stand firm, and see the salvation of the LORD, which he will accomplish for you today; for the Egyptians whom you see today, you will never see again forever.”
translation:
  language: ta
  text: மோசே மக்களிடம், “அஞ்சாதீர்கள். நிலைத்து நின்று, இன்று ஆண்டவர் உங்களுக்காகச் செய்யப்போகும் மீட்பைப் பாருங்கள். இன்று நீங்கள் காண்கிற எகிப்தியர்களை இனி என்றென்றும் காணமாட்டீர்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: அஞ்சாதீர்கள்
  rationale: எபிரேயத் தடைக் கட்டளையின் நேரடியான வலிமையையும், இயல்பான நவீனத் தமிழையும் காக்கிறது.
- source_word: הִתְיַצְבוּ
  choice: நிலைத்து நின்று
  rationale: வெறுமனே நிற்பதல்ல, அசையாமல் உறுதியாக நிலைகொள்வது என்ற சூழல்சார் பொருளை வெளிப்படுத்துகிறது.
- source_word: יְשׁוּעַת יְהוָה
  choice: ஆண்டவரின் மீட்பு
  rationale: יְשׁוּעָה இங்கு ஆபத்திலிருந்து விடுவித்தல்/மீட்பு என்பதைக் குறிக்கிறது; தேவநாமம் வழக்கமான தமிழ் வேதாகம மரபின்படி ‘ஆண்டவர்’ என வழங்கப்பட்டுள்ளது.
- source_word: יַעֲשֶׂה לָכֶם
  choice: உங்களுக்காகச் செய்யப்போகும்
  rationale: கடவுளே மீட்பை நிகழ்த்துபவர் என்பதையும், לָכֶם இன் பயனாளி நுணுக்கத்தையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: மசோரா உரையில் உள்ள வலியுறுத்தப்பட்ட காலநீட்சியை விடாமல் நேரடியாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவநாமத்தைத் தமிழில் வழங்குதல்
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: பெயரின் தனித்தன்மையை பொதுப்பெயராக்கிப் பொருள் விளக்காமல், பரவலாக அறியப்படும் தமிழ் வேதாகம மரபைத் தொடர்கிறது; இவ்வசனத்தில் தனிப்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: ‘ஆண்டவரின் மீட்பு’ மனிதச் செயலா அல்லது தெய்வச் செயலா
  choice: ‘ஆண்டவர் உங்களுக்காகச் செய்யப்போகும் மீட்பு’ என்று செய்பவரைத் தெளிவாகக் காத்தல்
  alternative: ‘உங்களுக்குக் கிடைக்கும் மீட்பு’
  rationale: יַעֲשֶׂה என்ற வினைச்சொல் ஆண்டவரைச் செயலாற்றுபவராக நேரடியாகக் காட்டுவதால், அந்த இறையியல் வலியுறுத்தல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதாய் இருந்தாலும், கட்டளைத் தொனியும் வசனத்தின் கண்ணியமும் காக்கப்பட்டுள்ளன. மூலத்தில் இல்லாத விளக்கங்கள் சேர்க்கப்படவில்லை.
