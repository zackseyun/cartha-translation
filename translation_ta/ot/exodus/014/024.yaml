source:
  edition: WLC
  text: וַֽ/יְהִי֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּשְׁקֵ֤ף יְהוָה֙ אֶל מַחֲנֵ֣ה מִצְרַ֔יִם בְּ/עַמּ֥וּד אֵ֖שׁ וְ/עָנָ֑ן וַ/יָּ֕הָם אֵ֖ת מַחֲנֵ֥ה מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/024.yaml
  text: And in the morning watch[a], Yahweh looked down on the camp of the Egyptians through the pillar of fire and cloud[b], and threw the camp of the Egyptians into confusion.
translation:
  language: ta
  text: விடியற்காலக் காவல் வேளையில்[a], யாவே நெருப்பும் மேகமும் கொண்ட தூணின் வழியாக[b] எகிப்தியரின் முகாமைக் கீழ்நோக்கிப் பார்த்து, அந்த முகாமைக் குழப்பத்தில் ஆழ்த்தினார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, இரவின் இறுதிப் பகுதியான விடியற்காலக் காவல் நேரத்தில்.
    reason: historical_context
  - marker: b
    text: அல்லது, “நெருப்பும் மேகமும் கொண்ட தூணிலிருந்து.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அந்த முகாமைப் பீதியடையச் செய்தார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: விடியற்காலக் காவல் வேளையில்
  rationale: אַשְׁמֹרֶת என்பது இரவைப் பிரித்த காவல் நேரத்தைக் குறிக்கிறது; இங்கு விடியலுக்கு முந்திய இறுதிக் காவல் வேளை இயல்பாகவும் காலக் குறிப்பைத் தக்கவைத்தும் சொல்லப்படுகிறது.
- source_word: וַיַּשְׁקֵף
  choice: கீழ்நோக்கிப் பார்த்து
  rationale: שׁקף இவ்வடிவில் உயர்ந்த அல்லது மறைவான இடத்திலிருந்து நோக்கிப் பார்ப்பதை உணர்த்துகிறது; தெய்வீகக் காட்சிக் கோணத்தையும் திசை உணர்வையும் இச்சொற்றொடர் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מַחֲנֵה מִצְרַיִם
  choice: எகிப்தியரின் முகாம்
  rationale: இக்கட்டமைப்பு எகிப்தியருக்குரிய படை முகாமைக் குறிக்கிறது; தமிழ் உடைமைத் தொடர் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּעַמּוּד אֵשׁ וְעָנָן
  choice: நெருப்பும் மேகமும் கொண்ட தூணின் வழியாக
  rationale: בְּ என்பதன் கருவி அல்லது இடம்சார் பொருளை முற்றிலும் ஒன்றாகத் தீர்மானிக்காமல், தூணின் வழியாக யாவே பார்த்தார் என்ற முதன்மை வாசிப்பை இயல்பான தமிழில் தருகிறது.
- source_word: וַיָּהָם
  choice: குழப்பத்தில் ஆழ்த்தினார்
  rationale: הום என்பதன் காரணவினைத் தன்மையையும், அது குறிக்கக்கூடிய கலக்கம் அல்லது பதற்றத்தையும் காக்கிறது; அடுத்தடுத்த நிகழ்வுகளுக்கு முன்பே முழுமையான தோல்வி ஏற்பட்டதாக மிகைப்படுத்துவதில்லை.
theological_decisions:
- issue: இறைப்பெயரான יהוה-ஐ மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயரைப் பதிலிடாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது அந்தத் தனிப்பெயரைப் பாதுகாக்கிறது.
- issue: தூணுக்கும் யாவேயின் பார்வைக்கும் இடையிலான தொடர்பு
  choice: தூணின் வழியாக
  alternative: தூணிலிருந்து / தூணுக்குள் இருந்து
  rationale: בְּ கருவிப் பொருளையோ இடப்பொருளையோ தரக்கூடும். முதன்மை உரையில் ‘வழியாக’ என வழங்கி, இடப்பொருள் வாய்ப்பை அடிக்குறிப்பில் காக்கிறது.
- issue: וַיָּהָם குறிக்கும் விளைவு
  choice: குழப்பத்தில் ஆழ்த்தினார்
  alternative: பீதியடையச் செய்தார்
  rationale: வினைச்சொல் குழப்பம், கலக்கம், பீதி ஆகிய பொருட்களை ஏற்கக்கூடும். உடனடி சூழலில் நிகழ்வு படிப்படியாக வளர்வதால் ‘குழப்பம்’ முதன்மை வாசிப்பாகவும் ‘பீதி’ மாற்று வாசிப்பாகவும் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘காவல் வேளை’, ‘கீழ்நோக்கிப் பார்த்து’, ‘குழப்பத்தில் ஆழ்த்தினார்’ ஆகியவை மூலத்தின் கால, திசை, காரணவினை நுணுக்கங்களை இயல்பான தமிழில் தக்கவைக்கின்றன.
