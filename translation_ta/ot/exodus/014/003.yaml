translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘வனாந்தரம்’ என்ற பரிச்சயமான வேதாகமச் சொல் தக்கவைக்கப்பட்டுள்ளது; ‘அலைந்து திரிகிறார்கள்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாததால் தவிர்க்கப்பட்டது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
