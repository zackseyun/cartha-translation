base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/003.yaml
  text: For Pharaoh will say of the sons of Israel[a], ‘They are confused in the land[c][b]; the wilderness has shut them in.’
translation:
  language: ta
  text: ஏனெனில், இஸ்ரவேலின் மகன்களைக் குறித்து பார்வோன், “அவர்கள் நாட்டில் திகைத்துப்போயிருக்கிறார்கள்[a]; வனாந்தரம் அவர்களைச் சூழ்ந்து அடைத்துவிட்டது[b]” என்று சொல்வான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் நாட்டில் குழம்பிப்போயிருக்கிறார்கள்,” “வழியறியாமல் இருக்கிறார்கள்,” அல்லது “சிக்கிக்கொண்டிருக்கிறார்கள்.” எபிரெயச் சொல் குழப்பம், திகைப்பு, திசையறியாமை அல்லது சிக்குண்ட நிலை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வனாந்தரம் அவர்களைச் சுற்றி வளைத்துவிட்டது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: ஏனெனில் ... சொல்வான்
  rationale: சூழலில் இது பார்வோனின் வரவிருக்கும் எதிர்வினையை முன்னறிவிப்பதால் எதிர்காலப் பொருள் பொருத்தமானது; இணைப்புச் சொல் இங்கு முந்தைய கட்டளைக்கான விளக்கத்தைக் காட்டுகிறது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற அரசப் பட்டப்பெயர் வடிவம்.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களைக் குறித்து
  rationale: אמר என்பதோடு வரும் ל, யாரைக் குறித்து பேசப்படுகிறது என்பதைக் குறிக்கலாம். ‘மக்கள்’ என்பது இயல்பான நவீனத் தமிழில் குழுவைக் குறித்தாலும், எபிரெய ‘மகன்கள்’ என்ற சொற்றொடரை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: נְבֻכִים
  choice: திகைத்துப்போயிருக்கிறார்கள்
  rationale: இந்தப் பங்கேற்புவினை குழப்பம், வழியறியாமை அல்லது சிக்குண்ட நிலை ஆகியவற்றைக் குறிக்கலாம். மூலத்தில் வெளிப்படையாக இல்லாத ‘அலைதல்’ என்ற எண்ணத்தைச் சேர்க்காமல் அதன் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: הֵם
  choice: அவர்கள் ... இருக்கிறார்கள்
  rationale: மூலத்தின் வெளிப்படையான எழுவாயையும் பயனிலை அமைப்பையும் தமிழில் பிரதிபலிக்கிறது.
- source_word: בָּאָרֶץ
  choice: நாட்டில்
  rationale: אֶרֶץ என்பதன் பொதுவான பொருளை இயல்பான தமிழில் தருகிறது; எகிப்தையா பரந்த பகுதியையா என்பது குறித்து தேவையற்ற துல்லியத்தைச் சேர்க்கவில்லை.
- source_word: סָגַר עֲלֵיהֶם
  choice: அவர்களைச் சுற்றி அடைத்துவிட்டது
  rationale: அவர்கள் வெளியேற முடியாதபடி வனாந்தரம் சூழ்ந்து கொண்டது என்ற உருவகத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַמִּדְבָּר
  choice: வனாந்தரம்
  rationale: முழுக்க மணற்பாலையையே அல்லாமல் பயிரிடப்படாத வெறுமையான நிலப்பகுதியையும் குறிக்கக்கூடிய מִדְבָּר என்பதற்கு நிலைபெற்ற, கண்ணியமான தமிழ் சொல்.
