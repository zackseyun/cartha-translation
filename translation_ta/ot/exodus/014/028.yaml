base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/028.yaml
  text: And the waters returned and covered the chariots and the horsemen[a], all the army of Pharaoh that had gone after them into the sea; not one of them remained.
translation:
  language: ta
  text: தண்ணீர் திரும்பி வந்து, தேர்களையும் குதிரைவீரர்களையும்[a] மூடியது; இஸ்ரவேலர்களைப் பின்தொடர்ந்து கடலுக்குள் சென்ற பார்வோனின் படை முழுவதையும் அது மூடியது. அவர்களில் ஒருவன்கூட எஞ்சவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குதிரைப்படையையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ הַמַּיִם
  choice: தண்ணீர் திரும்பி வந்து
  rationale: שוב என்பது பிரிக்கப்பட்ட தண்ணீர் மீண்டும் தன் முந்தைய நிலைக்குத் திரும்பியதைக் குறிக்கிறது. எபிரெயத்தில் வடிவம் பன்மையாக இருந்தாலும், தமிழில் ‘தண்ணீர்’ ஒருமை வினையுடன் இயல்பாக வருகிறது.
- source_word: וַיְכַסּוּ
  choice: மூடியது
  rationale: כסה என்பதன் நேரடியான பொருள் ‘மூடு’. ‘மூழ்கடித்தது’ என்பது சூழலில் உணர்த்தப்பட்டாலும், மூலத்தின் எளிய சொல்லாட்சியை ‘மூடியது’ காக்கிறது.
- source_word: הָרֶכֶב
  choice: தேர்கள்
  rationale: רכב இங்கு தேர்ப்படையைத் தொகுப்பாகக் குறிக்கலாம்; ‘தேர்கள்’ என்பது நேரடியானதும் சாதாரண வாசகர்களுக்குப் புரியக்கூடியதுமான தமிழாக்கம்.
- source_word: הַפָּרָשִׁים
  choice: குதிரைவீரர்கள்
  rationale: פָּרָשִׁים என்பது குதிரையில் ஏறிப் போரிடுவோரை அல்லது குதிரைப்படையைச் சுட்டலாம். ‘குதிரைவீரர்கள்’ நேரடியான வாசிப்பைத் தருகிறது; மாற்று கூட்டுப்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לְכֹל חֵיל פַּרְעֹה
  choice: பார்வோனின் படை முழுவதையும்
  rationale: חֵיל இச்சூழலில் இராணுவப் படையைக் குறிக்கிறது; לְכֹל-இன் முழுமையை ‘படை முழுவதையும்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַבָּאִים אַחֲרֵיהֶם בַּיָּם
  choice: இஸ்ரவேலர்களுக்குப் பின்னால் கடலுக்குள் சென்ற
  rationale: எபிரெயப் பிரதிப்பெயரின் சுட்டுப்பொருளை தமிழில் குழப்பமின்றி ‘இஸ்ரவேலர்கள்’ என்று வெளிப்படுத்துகிறது. ‘கடலுக்குள் சென்ற’ என்பது உள்ளே நுழைந்த இயக்கத்தையும் தொடர்ந்த துரத்தலையும் காக்கிறது.
- source_word: לֹא נִשְׁאַר בָּהֶם עַד אֶחָד
  choice: அவர்களில் ஒருவன்கூட எஞ்சவில்லை
  rationale: இந்த எபிரெய மரபுத்தொடர் ஒருவரும் மீதியில்லை என்ற வலியுறுத்தப்பட்ட முழுமையைக் காட்டுகிறது. ‘ஒருவன்கூட’ அந்த அழுத்தத்தை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: பார்வோனின் படை அழிந்ததன் வரம்பு
  choice: இஸ்ரவேலர்களைப் பின்தொடர்ந்து கடலுக்குள் சென்ற பார்வோனின் படையினரில் ஒருவர்கூட எஞ்சவில்லை என்று மொழிபெயர்க்கப்பட்டது.
  alternative: இந்தக் கூற்றை எகிப்தின் எல்லா படைவீரர்களையும் பற்றியதாக விரிவுபடுத்தலாம்.
  rationale: இறுதி கூற்று, ‘அவர்களுக்குப் பின்னால் கடலுக்குள் சென்ற’ படையோடு இலக்கணரீதியாக இணைகிறது. ஆகவே உரையின் முழுமையான அழிவைத் தக்கவைத்தும், அதை எகிப்தின் ஒட்டுமொத்த இராணுவத்திற்கும் விரிவுபடுத்தாமலும் மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானவும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. ‘பார்வோன்’ என்ற பரவலான வேதாகமப் பெயருரு காக்கப்பட்டுள்ளது; ‘மூடியது’ என்ற மறுமொழி தமிழில் தொடர்பைத் தெளிவாக்குகிறது.
