base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/017.yaml
  text: And I—behold[a], I am hardening the hearts of the Egyptians so that they will go in after them, and I will get glory over Pharaoh and over all his army[b], over his chariots and over his horsemen.
translation:
  language: ta
  text: நானோ—இதோ, எகிப்தியரின் இருதயத்தைக்[a] கடினப்படுத்துகிறேன்; அவர்கள் அவர்களைப் பின்தொடர்ந்து வருவார்கள். பார்வோன்மேலும் அவனுடைய படை முழுவதின்மேலும், அவனுடைய தேர்கள்மேலும் அவனுடைய குதிரைவீரர்கள்மேலும் நான் மகிமைப்படுவேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘எகிப்தியரின் இருதயம்’ என்று ஒருமையில் உள்ளது; இங்கே அது கூட்டுப்பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: ‘பார்வோன்மேலும் அவனுடைய படை முழுவதின்மேலும், அவனுடைய தேர்கள்மேலும் அவனுடைய குதிரைவீரர்கள்மேலும் நான் மகிமை அடைவேன்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: நானோ—இதோ
  rationale: முதலாம் நபரை வலியுறுத்தும் எபிரெயச் சொல்லின் தீவிரத்தை, நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: מְחַזֵּק
  choice: கடினப்படுத்திக்கொண்டிருக்கிறேன்
  rationale: פיעל வினையெச்சம் நிகழ்ந்துகொண்டிருக்கும் அல்லது உடனடியாக நிகழவிருக்கும் நேரடி இறைச் செயலைக் காட்டுகிறது; வெறும் அனுமதியாக மென்மைப்படுத்தவில்லை.
- source_word: לֵב מִצְרַיִם
  choice: எகிப்தியர்களின் இருதயத்தை
  rationale: மூலத்தில் ஒருமையான ‘இருதயம்’ கூட்டுப்பொருளில் வருகிறது; அந்த வடிவத்தை முதன்மை உரையில் பாதுகாக்கிறது.
- source_word: וְיָבֹאוּ אַחֲרֵיהֶם
  choice: அதனால் அவர்கள் இவர்களுக்குப் பின்னால் கடலுக்குள் வருவார்கள்
  rationale: சூழலில் בוא என்பது இஸ்ரவேலருக்குப் பின்னால் கடலுக்குள் நுழைவதைக் குறிக்கிறது; தொடர் வாவ் கடினப்படுத்துதலின் விளைவு அல்லது நோக்கத்தைத் தெரிவிக்கிறது.
- source_word: וְאִכָּבְדָה
  choice: நான் மகிமை பெறுவேன்
  rationale: כבד என்பதன் நிபால் வடிவம் நியாயத்தீர்ப்பின் மூலம் யாவே மகிமை அடைவதை நிகழ்வுசார் முறையில் வெளிப்படுத்துகிறது.
- source_word: בְּפַרְעֹה
  choice: பார்வோனில்
  rationale: ב முன்னிடைச்சொல் மகிமை வெளிப்படும் நபர், களம் அல்லது வழிமுறை என்ற நுணுக்கங்களைத் திறந்தவையாக வைத்திருக்கிறது.
- source_word: חֵילוֹ
  choice: அவனுடைய படை முழுவதும்
  rationale: இராணுவச் சூழலில் חיל ஆயுதப்படையைக் குறிக்கிறது; ‘படை முழுவதும்’ அதன் கூட்டுத்தன்மையைத் தெளிவாக்குகிறது.
- source_word: רִכְבּוֹ
  choice: அவனுடைய தேர்கள்
  rationale: ஒருமை வடிவம் கூட்டுப்பொருளில் தேர்ப்படையைக் குறிக்கிறது; இயல்பான தமிழில் பன்மை பொருத்தமானது.
- source_word: פָרָשָׁיו
  choice: அவனுடைய குதிரைவீரர்கள்
  rationale: இச்சொல் குதிரைமேல் போரிடும் வீரர்களைக் குறிக்கிறது; இராணுவக் காட்சியைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: எகிப்தியர்களின் இருதயத்தைக் கடினப்படுத்தும் இறைச் செயல்
  choice: ‘கடினப்படுத்திக்கொண்டிருக்கிறேன்’ என்று கடவுளின் நேரடி செயற்பாட்டை வெளிப்படையாக மொழிபெயர்த்தல்
  alternative: ‘கடினமாக அனுமதிக்கிறேன்’ அல்லது ‘உறுதிப்படுத்துவேன்’
  rationale: எபிரெய உரை செயலை நேரடியாகக் கடவுளுக்கே உரியதாகச் சொல்கிறது; இறை இறையாண்மைக்கும் மனிதப் பொறுப்புக்கும் இடையிலான பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடாமல் பாதுகாக்க வேண்டும்.
- issue: நியாயத்தீர்ப்பின் சூழலில் כבד என்பதன் பொருள்
  choice: ‘நான் மகிமை பெறுவேன்’
  alternative: ‘என் மகிமையை வெளிப்படுத்துவேன்’
  rationale: தீர்ப்பின் வழியாகக் கடவுளின் மகிமை வெளிப்படுவதைக் கூறுகிறது; ‘பெறுவேன்’ என்பது நிபால் வடிவத்தின் பெறுபேறு சார்ந்த தன்மையைப் பாதுகாக்கிறது.
- issue: בְּפַרְעֹה என்பதில் ב முன்னிடைச்சொல்லின் உறவு
  choice: ‘பார்வோனில்’
  alternative: ‘பார்வோன்மேல் வெற்றி கொண்டு’ அல்லது ‘பார்வோன் மூலமாக’
  rationale: மூலத்தின் முன்னிடைச்சொல் களம், தொடர்பு, வழிமுறை ஆகியவற்றுக்கிடையே ஓரளவு பன்முகத்தன்மை கொண்டது; ‘வெற்றி கொண்டு’ என்று விளக்கமாகச் சேர்ப்பதைத் தவிர்த்து அந்தத் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இருதயம்’ என்பது வேதாகமச் சூழலின் மனவுறுதி/உள்ளார்ந்த தீர்மானம் என்ற பொருளைத் தாங்குவதால் வைக்கப்பட்டது. ‘கடலுக்குள்’ என்பது உடனடி நிகழ்ச்சிச் சூழலைத் தெளிவுபடுத்தும் சூழல்சார் நிரப்பல்.
