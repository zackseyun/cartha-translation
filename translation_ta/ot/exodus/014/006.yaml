  text: So he harnessed his chariot and took his people with him[a][b].
translation:
  language: ta
  text: பின்னர், அவன் தன் தேரைப் பூட்டி[a], தன் மக்களைத் தன்னுடன் கூட்டிக்கொண்டான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் தேரை ஆயத்தப்படுத்தி.’ எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் ‘கட்டுதல்’ அல்லது ‘பிணைத்தல்’; இங்கு குதிரைகளைத் தேரில் பூட்டுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தன் மக்கள்’ என்பது பார்வோனுடன் சென்ற படையினரைக் குறிக்கக்கூடும். எபிரெய வாசகம் ‘தன் மக்கள்’ என்றே சொல்கிறது; ‘தன் படை’ என்று வெளிப்படையாகச் சொல்லவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר
  choice: பூட்டி
  rationale: אָסַר என்பதன் அடிப்படைப் பொருள் ‘கட்டு’ அல்லது ‘பிணை’; தேர் சூழலில், குதிரைகளைத் தேரில் பூட்டிப் பயணத்துக்கு ஆயத்தப்படுத்துவதைக் குறிக்கிறது. ‘தேரைப் பூட்டி’ என்பது தமிழில் இயல்பாகவும் செயலைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: רִכְבּוֹ
  choice: தன் தேர்
  rationale: רֶכֶב என்பது சில இடங்களில் தேர்ப்படையைக் குறிக்கலாம்; ஆனால் இங்குள்ள ஒருமை வடிவமும் உடைமைப் பின்னொட்டும் பார்வோனுடைய சொந்தத் தேரையே இயல்பாகக் குறிக்கின்றன.
- source_word: עַמּוֹ
  choice: தன் மக்கள்
  rationale: עַם என்பதன் நேரடிப் பொருள் ‘மக்கள்’. இங்கு இராணுவச் சூழலால் பார்வோனுடன் சென்ற படையினரை இது குறிக்கக்கூடும்; ஆயினும் மூலவாசகம் ‘படை’ என்று வெளிப்படையாகச் சொல்லாததால் ‘தன் மக்கள்’ எனப் பொருள் விரிவுபடுத்தாமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לָקַח עִמּוֹ
  choice: தன்னுடன் அழைத்துக்கொண்டான்
  rationale: இந்த வினைச்சொல்–முன்னிடைச்சொல் சேர்க்கை ‘தன்னுடன் கூட்டிச் சென்றான்’ என்ற பொருளைத் தருகிறது. மனிதர்களைப் பற்றிய இச்சூழலில் ‘அழைத்துக்கொண்டான்’ என்பது இயல்பான நவீனத் தமிழ்.
