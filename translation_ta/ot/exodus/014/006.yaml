translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான கதைநடைப் பாணி பயன்படுத்தப்பட்டுள்ளது. ‘தன்’ என்ற தற்சுட்டு உடைமை வடிவம் எழுவாயான பார்வோனைத் தெளிவாகச் சுட்டுகிறது. மூலத்தின் இராணுவச் சூழலைக் குறிப்புகள் விளக்குகின்றன; பிரதான உரை ‘மக்கள்’ என்ற மூலச் சொல்லின் தெளிவின்மையைப் பாதுகாக்கிறது.
