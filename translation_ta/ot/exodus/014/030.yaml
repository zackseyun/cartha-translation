source:
  edition: WLC
  text: וַ/יּ֨וֹשַׁע יְהוָ֜ה בַּ/יּ֥וֹם הַ/ה֛וּא אֶת יִשְׂרָאֵ֖ל מִ/יַּ֣ד מִצְרָ֑יִם וַ/יַּ֤רְא יִשְׂרָאֵל֙ אֶת מִצְרַ֔יִם מֵ֖ת עַל שְׂפַ֥ת הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/030.yaml
  text: So Yahweh saved Israel that day from the hand of Egypt[b][a], and Israel saw the Egyptians dead on the seashore.
translation:
  language: ta
  text: அன்று யாவே இஸ்ரவேலை எகிப்தின் கையிலிருந்து[a] காப்பாற்றினார். இஸ்ரவேலர் எகிப்தியர்கள் கடற்கரையில்[b] இறந்துகிடந்ததை கண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லாட்சிப்படி, ‘எகிப்தின் கையிலிருந்து’; இது எகிப்தின் அதிகாரத்திலிருந்து அல்லது கட்டுப்பாட்டிலிருந்து விடுவிக்கப்பட்டதைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘கடலின் கரையில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: காப்பாற்றினார்
  rationale: ישׁע என்பதன் ஹிஃபில் வடிவம் இங்கு ஆபத்திலிருந்த இஸ்ரவேலை யாவே மீட்ட செயலைக் குறிக்கிறது. ‘காப்பாற்றினார்’ என்பது இயல்பான நவீனத் தமிழில் இரட்சிப்பு/விடுதலை என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரான יהוה ஒரு பட்டப்பெயராக மாற்றப்படாமல், தமிழில் அதன் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பான ‘யாவே’ என்று தரப்பட்டுள்ளது.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்று
  rationale: ‘அந்த நாளில்’ என்ற காலக் குறிப்பை நவீனத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் ‘அன்று’ எனத் தருகிறது.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: ‘கையிலிருந்து’ என்ற எபிரெய உருவகம் அதிகாரம் அல்லது கட்டுப்பாட்டிலிருந்து விடுவிக்கப்படுவதைக் குறிக்கிறது. தமிழிலும் இது புரிந்துகொள்ளக்கூடியதால் உருவகம் தக்கவைக்கப்பட்டுள்ளது.
- source_word: מִצְרַיִם / מִצְרָיִם
  choice: எகிப்து / எகிப்தியர்
  rationale: முதல் இடத்தில் நாட்டின் அதிகாரம் குறிக்கப்படுவதால் ‘எகிப்து’ என்றும், இரண்டாம் இடத்தில் இறந்த மனிதர்கள் குறிக்கப்படுவதால் ‘எகிப்தியர்’ என்றும் சூழலுக்கேற்ப வேறுபடுத்தப்பட்டுள்ளது.
- source_word: וַיַּרְא
  choice: கண்டார்கள்
  rationale: ראה என்பதன் நேரடியான கதைநடைப் பொருள் ‘கண்டார்/கண்டார்கள்.’ ‘இஸ்ரவேல்’ இங்கு மக்களைக் கூட்டாகக் குறிப்பதால் தமிழில் இயல்பான பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: מֵת
  choice: இறந்திருந்ததை
  rationale: ‘இறந்த’ என்ற ஒருமை எபிரெயப் பெயரடை கூட்டாக எகிப்தியரைக் குறிக்கிறது. ‘இறந்திருந்ததை’ என்பது உடல்கள் அங்கு காணப்பட்ட நிலையை இயல்பான தமிழில் தெரிவிக்கிறது; மரணத்தின் விதம் குறித்து எதையும் சேர்க்கவில்லை.
- source_word: עַל שְׂפַת הַיָּם
  choice: கடற்கரையில்
  rationale: சொல்லாட்சிப்படி ‘கடலின் உதடு/விளிம்பு’ என்ற உருவகம் கரையைக் குறிக்கிறது. ‘கடற்கரையில்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை தனிப்பட்ட உடன்படிக்கைப் பெயரான יהוה என்பதை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: இஸ்ரவேலைக் காப்பாற்றியவர் யார் என்பது
  choice: யாவே நேரடியாகச் செயல்பட்டார்
  alternative: இஸ்ரவேல் வெற்றி பெற்றது
  rationale: வாக்கியத்தின் எழுவாய் யாவே; וַיּוֹשַׁע என்ற வினை அவரே இஸ்ரவேலைக் காப்பாற்றினார் என்று கூறுகிறது. ஆகவே மனித வெற்றியை மட்டும் முன்னிறுத்தாமல் தெய்வீக மீட்புச் செயல் தெளிவாக வைக்கப்பட்டுள்ளது.
translation_notes:
  register: மொழிநடை நவீனத் தரத் தமிழாகவும், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடையாகவும் அமைக்கப்பட்டுள்ளது. எபிரெய உருவகமான ‘கையிலிருந்து’ தக்கவைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. ‘இஸ்ரவேல்’ கூட்டாக மக்களைக் குறிப்பதால் தமிழில் ‘இஸ்ரவேலர் கண்டார்கள்’ என்ற இயல்பான பன்மை அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
