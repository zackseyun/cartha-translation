base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/027.yaml
  text: So Moses stretched out his hand over the sea[a], and toward morning the sea returned to its usual place, while the Egyptians were fleeing toward it[b]. And Yahweh threw the Egyptians into the midst of the sea.
translation:
  language: ta
  text: மோசே தன் கையைக் கடலின்மேல் நீட்டினார். விடியற்காலை நெருங்கியபோது கடல் தன் இயல்பான நிலைக்குத் திரும்பியது[a]; எகிப்தியரோ அதை நோக்கித் தப்பியோடிக்கொண்டிருந்தார்கள். யாவே எகிப்தியரைக் கடலின் நடுவே உதறித் தள்ளினார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் முழு வலிமைக்கு” அல்லது “தன் முந்தைய நிலைக்கு” என்றும் மொழிபெயர்க்கலாம். கடல் மீண்டும் தன் நிலையான, இயல்பான தன்மையை அடைந்ததை எபிரேயச் சொற்றொடர் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “உதறித் தள்ளினார்” என்று மொழிபெயர்க்கப்பட்ட எபிரேய வினைச்சொல், சொல்லுக்குச் சொல் ‘குலுக்கி உதறிவிட்டார்’ என்ற உயிரோட்டமான படிமத்தைத் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: நீட்டினார்
  rationale: נטה என்பதற்கு ‘கை’ செயப்படுபொருளாக வரும்போது, கையை நீட்டுதல் என்பது இயல்பான பொருள்; செயலை நேரடியாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: הַיָּם
  choice: கடல்
  rationale: இது ‘கடல்’ என்பதற்கான பொதுவான எபிரேயப் பெயர்; இவ்வசனத்திலேயே குறிப்பிட்ட தனிப்பெயரைச் சேர்க்க வேண்டிய குறியீடு இல்லை.
- source_word: וַיָּשָׁב הַיָּם
  choice: கடல் ... திரும்பியது
  rationale: שׁוב முந்தைய நிலைக்குத் திரும்புவதைக் குறிக்கிறது; அடுத்து வரும் לְאֵיתָנוֹ உடன் இது இயல்பாகப் பொருந்துகிறது.
- source_word: לִפְנוֹת בֹּקֶר
  choice: விடியற்காலை நெருங்கியபோது
  rationale: சொற்றொடர் காலை திரும்பி அல்லது தோன்றி வருகிற நேரத்தைக் குறிக்கிறது; தமிழில் நேரக் கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְאֵיתָנוֹ
  choice: தன் இயல்பான நிலைக்கு
  rationale: אֵיתָן நிலைத்த வலிமை, உறுதியான இயல்பு, அல்லது வழக்கமான நிலை ஆகிய கருத்துகளைத் தரலாம். பிரிக்கப்பட்ட கடல் மீண்டும் முன்பிருந்த இயல்பை அடைவதை இத்தேர்வு தெரிவிக்கிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: נָסִים לִקְרָאתוֹ
  choice: அதை நோக்கித் தப்பியோடிக்கொண்டிருந்தார்கள்
  rationale: பன்மை வினையெச்சம் தொடர்ந்த செயலைக் காட்டுகிறது; לִקְרָאתוֹ நேரடியாக ‘அதை எதிர்கொள்ளும்படி/அதை நோக்கி’ என்ற திசைப் பொருளைக் கொண்டது. நிகழ்வின் வியப்பூட்டும் திசையைக் குறைக்காமல் தருகிறது.
- source_word: וַיְנַעֵר
  choice: உதறித் தள்ளினார்
  rationale: נער என்பதன் அடிப்படைப் படிமம் குலுக்கி உதறிவிடுதல். ‘உதறித் தள்ளினார்’ அந்தத் தெளிவான படிமத்தையும் இயக்கத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பொதுப்பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: בְּתוֹךְ הַיָּם
  choice: கடலின் நடுவே
  rationale: תּוֹךְ என்பது உள்ளிடம் அல்லது நடுப்பகுதியைக் குறிக்கிறது; இயக்கம் வினையிலேயே வெளிப்படுவதால் ‘கடலின் நடுவே’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் ஒரு பட்டம் அல்ல, உடன்படிக்கையின் தனிப்பட்ட இறைப் பெயரே நேரடியாக வருகிறது. ஆகவே அதைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: எகிப்தியர் கடலை நோக்கி ஓடியதாக வரும் பதற்றமான காட்சி
  choice: அதை நோக்கித் தப்பியோடிக்கொண்டிருந்தார்கள்
  alternative: அதிலிருந்து தப்பியோடிக்கொண்டிருந்தார்கள்
  rationale: לִקְרָאתוֹ என்பதில் உள்ள ‘அதை நோக்கி/அதை எதிர்கொண்டு’ என்ற திசையை மூல உரை கூறியபடியே வைத்துள்ளது; நிகழ்ச்சியை எளிதாக்குவதற்காக எதிர்திசையாக மாற்றவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடையின் வேகமும் காக்கப்பட்டுள்ளன. ‘விடியற்காலை நெருங்கியபோது’, ‘தப்பியோடிக்கொண்டிருந்தார்கள்’ ஆகிய வடிவங்கள் காலநிலையும் தொடர்ச்சியான செயலையும் தெளிவாக்குகின்றன. மூலத்தின் எதிர்பாராத ‘கடலை நோக்கி’ என்ற திசையும் נער வினையின் உதறுதல் படிமமும் மென்மைப்படுத்தப்படவில்லை.
