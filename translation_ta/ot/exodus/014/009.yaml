translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதைமிக்க நடையில் வடிவமைக்கப்பட்டது. எபிரெய உரையின் நீண்ட பட்டியல் தமிழில் தெளிவாக இருக்க இரண்டு வாக்கியங்களாக அமைக்கப்பட்டது; இரண்டாவது வாக்கியத்தில் படைப்பிரிவுகள் வலியுறுத்தப்படுகின்றன. இடப்பெயர்கள் எபிரெய ஒலிவடிவத்துக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டன.
