base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/009.yaml
  text: The Egyptians pursued them and overtook them as they were camped by the sea—all Pharaoh’s horses and chariots[a], his horsemen, and his army—by Pi-hahiroth, before Baal-zephon.
translation:
  language: ta
  text: எகிப்தியர்கள் இஸ்ரவேலரைத் துரத்திச் சென்று, அவர்கள் கடலோரத்தில் முகாமிட்டிருந்தபோது அவர்களை எட்டிப்பிடித்தார்கள்—பார்வோனின் எல்லாக் குதிரைகளும் தேர்களும், அவனுடைய குதிரைவீரர்களும் படையும்—பீ-ஆகிரோத்துக்கு அருகில், பாகால்-செபோனுக்கு முன்பாக[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாகால்-செபோனுக்கு எதிரே.” எபிரெயத் தொடர் ஒரு அடையாள இடத்தை நோக்கியுள்ள அல்லது அதற்கு எதிரே உள்ள இடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ מִצְרַיִם
  choice: எகிப்தியர்கள் அவர்களைப் பின்தொடர்ந்து
  rationale: רָדַף என்பது இராணுவச் சூழலில் பின்தொடர்தல் அல்லது துரத்துதல் எனப் பொருள்படும். இங்கு எகிப்து நாடல்ல, எகிப்தியப் படையினரே செய்பவர்கள் என்பதால் மக்களைக் குறிக்கும் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וַיַּשִּׂיגוּ אֹתָם
  choice: அவர்களை நெருங்கிப் பிடித்தார்கள்
  rationale: נשׂג இங்கு தப்பிச் செல்பவர்களை எட்டிப் பிடித்தல் அல்லது அவர்களிடம் நெருங்கிவருதல் என்ற பொருளைத் தருகிறது. ‘நெருங்கிப் பிடித்தார்கள்’ என்பது இரு நுணுக்கங்களையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: חֹנִים עַל־הַיָּם
  choice: கடலருகே முகாமிட்டிருந்த
  rationale: எபிரெயப் பங்கேற்புவினை இஸ்ரவேலர் அப்போது இருந்த நிலையைக் காட்டுகிறது; עַל இங்கு இடத்தைக் குறிக்கும் என்பதால் ‘கடலருகே’ என மொழிபெயர்க்கப்பட்டது.
- source_word: כָּל־סוּס רֶכֶב פַּרְעֹה
  choice: பார்வோனுடைய எல்லாக் குதிரைகளும் தேர்களும்
  rationale: எபிரெயத் தொடர் சுருக்கமான கூட்டுப்படைச் சொல்லாக்கமாக உள்ளது. தமிழில் இராணுவப் பட்டியல் தெளிவாகவும் இயல்பாகவும் அமைய குதிரைகளும் தேர்களும் என விரித்துக் கூறப்பட்டுள்ளது.
- source_word: וּפָרָשָׁיו
  choice: அவனுடைய குதிரைவீரர்களும்
  rationale: פָּרָשִׁים என்பது குதிரைமேல் செல்லும் வீரர்களைக் குறிக்கும்; பொதுவாசகருக்கு நேரடியாகப் புரியும் ‘குதிரைவீரர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְחֵילוֹ
  choice: படையும்
  rationale: חַיִל இச்சூழலில் இராணுவப் படையைக் குறிக்கிறது. ‘படை’ என்பது சுருக்கமான, இயல்பான தமிழ்ச் சொல்.
- source_word: עַל־פִּי הַחִירֹת
  choice: பீ-ஆகிரோத்துக்கு அருகில்
  rationale: இது ஓர் இடப்பெயருடன் வரும் இடவுறவுத் தொடர்; ‘அருகில்’ என்பது தமிழில் அதன் நிலவியல் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: பாகால்-செபோனுக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் அடிப்படை இடவியல் பொருள் ‘முன்பாக’; குறிப்பிட்ட நிலவியல் அமைப்பில் ‘எதிரே’ என்றும் பொருள்படலாம் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டது.
