source:
  edition: WLC
  text: וַ/יָּבֹ֞א בֵּ֣ין מַחֲנֵ֣ה מִצְרַ֗יִם וּ/בֵין֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יְהִ֤י הֶֽ/עָנָן֙ וְ/הַ/חֹ֔שֶׁךְ וַ/יָּ֖אֶר אֶת הַ/לָּ֑יְלָה וְ/לֹא קָרַ֥ב זֶ֛ה אֶל זֶ֖ה כָּל הַ/לָּֽיְלָה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/020.yaml
  text: And it came between the camp of Egypt and the camp of Israel[a], and there was the cloud and the darkness, yet it lit up the night; and the one did not come near the other all night.
translation:
  language: ta
  text: அது எகிப்தின் முகாமுக்கும் இஸ்ரவேலின் முகாமுக்கும் நடுவே வந்தது. அங்கே மேகமும் இருளும் இருந்தன; ஆனாலும் அது இரவை ஒளிரச் செய்தது[a]. இரவு முழுவதும் ஒரு முகாம் மற்ற முகாமை நெருங்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேகமும் இருளும் இருந்தன; ஆனால் அது இரவில் வெளிச்சம் கொடுத்தது.” எபிரேய வாசகம் சுருக்கமாக உள்ளது; இருளும் வெளிச்சமும் இரு முகாம்களுடன் எவ்வாறு தொடர்புபடுகின்றன என்பதில் பண்டைய மொழிபெயர்ப்புகளும் பிற மொழிபெயர்ப்புகளும் வேறுபடுகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: அது ... நடுவே வந்தது
  rationale: முந்தைய வசனத்தில் இடம் மாறிய இறைத்தூதர் அல்லது மேகத்தூண் ஆகியவற்றில் எது இங்கே குறிக்கப்படுகிறது என்பதைத் தெளிவுபடுத்தாமல், ஒருமை வினையின் இயக்கத்தைக் காக்கிறது.
- source_word: בֵּין ... וּבֵין
  choice: '... முகாமுக்கும் ... முகாமுக்கும் நடுவே'
  rationale: இரு முகாம்களுக்கு இடையிலான இடஞ்சார்ந்த பொருளை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: מַחֲנֵה מִצְרַיִם ... מַחֲנֵה יִשְׂרָאֵל
  choice: எகிப்தியரின் முகாம் ... இஸ்ரவேலரின் முகாம்
  rationale: எபிரேயத்தில் நாடு/மக்கள் பெயர்கள் வந்தாலும், இங்கு குறிக்கப்படுவது அந்தந்த மக்களின் முகாம்கள் என்பதால் இயல்பான தமிழில் இவ்வாறு தரப்படுகிறது.
- source_word: הֶעָנָן וְהַחֹשֶׁךְ
  choice: மேகமும் இருளும்
  rationale: இரு பெயர்ச்சொற்களின் சுருக்கமான, திடமான இணைப்பைத் தக்கவைக்கிறது.
- source_word: וַיָּאֶר אֶת־הַלָּיְלָה
  choice: ஆனாலும் அது இரவை ஒளிரச் செய்தது
  rationale: אור என்பதன் ‘ஒளி கொடு/ஒளிரச் செய்’ என்ற பொருளைத் தருகிறது; இருளுக்கும் வெளிச்சத்துக்கும் உள்ள எதிர்நிலையை ‘ஆனாலும்’ வெளிப்படுத்துகிறது.
- source_word: וְלֹא קָרַב זֶה אֶל־זֶה
  choice: ஒரு முகாம் மற்ற முகாமை நெருங்கவில்லை
  rationale: ‘இது அதை நெருங்கவில்லை’ என்ற எபிரேய மரபுத்தொடரின் பரஸ்பர இடஞ்சார்ந்த பொருளைத் தமிழில் குழப்பமின்றித் தருகிறது.
- source_word: כָּל־הַלָּיְלָה
  choice: இரவு முழுவதும்
  rationale: கால அளவைக் குறிக்கும் சொற்றொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: ஒருமை வினைகளின் எழுவாய்—இறைத்தூதரா, மேகத்தூணா?
  choice: நகர்ந்து வந்து ஒளியூட்டிய இருப்பை ‘அது’ என்று குறிப்பிடுதல்
  alternative: ‘அவர்’ என்று இறைத்தூதரைக் குறிப்பிடுதல், அல்லது ‘மேகத்தூண்’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: முந்தைய சூழலில் தேவனுடைய தூதரும் மேகத்தூணும் இருவருமே குறிப்பிடப்படுகின்றனர். எபிரேய ஒருமை வடிவம் குறிக்கும் இருப்பைத் தமிழ் ‘அது’ முழுமையாகத் தீர்மானிக்காமல் விடுகிறது; ‘மேகத்தூண்’ என்று பெயரிட்டு மூலத்தில் இல்லாத தெளிவைச் சேர்ப்பதையும் தவிர்க்கிறது.
- issue: இருளும் வெளிச்சமும் இரு முகாம்களுடன் எவ்வாறு தொடர்புபடுகின்றன?
  choice: மேகமும் இருளும் இருந்தன; ஆனாலும் அது இரவை ஒளிரச் செய்தது
  alternative: ஒரு பக்கம் இருளாகவும் மறுபக்கம் இரவை ஒளிரச் செய்ததாகவும் வெளிப்படையாகப் பிரித்துரைத்தல்
  rationale: எபிரேய வாசகம் மிகவும் சுருக்கமானது; இருளையும் வெளிச்சத்தையும் எந்த முகாமுடன் இணைக்க வேண்டும் என்பதை அது வெளிப்படையாகக் கூறவில்லை. ஆகவே அந்தத் தெளிவின்மையை முதன்மை உரை காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முகாம்’, ‘நடுவே’, ‘நெருங்கவில்லை’ போன்ற பொதுவாகப் புரியும் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன. மூலத்தின் சுருக்கமும் அதன் உண்மையான பொருள் தெளிவின்மையும் தேவையற்ற விளக்கமின்றிக் காக்கப்பட்டுள்ளன.
