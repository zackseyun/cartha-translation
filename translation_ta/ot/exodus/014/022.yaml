translation_notes:
  register: நவீன வாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மதிலாக’ என்ற வடிவம் மூலத்தின் உறுதியான காட்சியைப் பாதுகாக்கிறது; ‘இஸ்ரயேலின் மகன்கள்’ என்ற நேரடி வடிவத்திற்கான இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
