  text: וַ/יָּבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/ת֥וֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָׁ֑ה וְ/הַ/מַּ֤יִם לָ/הֶם֙ חֹמָ֔ה מִֽ/ימִינָ֖/ם וּ/מִ/שְּׂמֹאלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/022.yaml
  text: And the sons of Israel went into the midst of the sea on the dry ground[a], and the waters were a wall to them on their right and on their left.
translation:
  language: ta
  text: இஸ்ரயேலின் மகன்கள்[a] கடலின் நடுவே உலர்ந்த தரையில் சென்றார்கள்; நீர் அவர்களுக்கு வலப்புறத்திலும் இடப்புறத்திலும் மதிலாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரயேலர்.” எபிரெயத்தில் நேரடியாக, “இஸ்ரயேலின் மகன்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: சென்றார்கள்
  rationale: இந்தத் தொடர்கதைச் சூழலில் בוא ஓர் இடத்திற்குள் செல்லும் இயக்கத்தைக் குறிக்கிறது. தமிழில் ‘சென்றார்கள்’ இயல்பாக இருந்து, அடுத்துள்ள ‘கடலின் நடுவே’ என்பதோடு அந்தத் திசைநோக்கிய இயக்கத்தைத் தெளிவாக்குகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரயேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருளையும் ஆண்பால் பன்மை வடிவத்தையும் காக்கிறது. வழக்கமான ‘இஸ்ரயேலர்’ என்ற மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּתוֹךְ הַיָּם
  choice: கடலின் நடுவே
  rationale: בְּתוֹךְ என்பதன் ‘நடுவில்/நடுவே’ என்ற இடப்பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; அவர்கள் கடலை முழுவதும் கடந்துவிட்டார்கள் என்று இந்தத் துணைவாக்கியத்திலேயே மிகுதியாக விளக்குவதில்லை.
- source_word: בַּיַּבָּשָׁה
  choice: உலர்ந்த தரையில்
  rationale: நீருக்கு எதிரான உலர்ந்த நிலப்பரப்பை, இங்கு காலடியில் இருந்த கடற்படுகை என்ற தெளிவான காட்சியோடு எடுத்துரைக்கிறது.
- source_word: וְהַמַּיִם
  choice: நீர்
  rationale: எபிரெயத்தில் வடிவம் பன்மையாக இருந்தாலும், தமிழில் ‘நீர்’ இயல்பான தொகுதிப்பெயராக இருந்து காட்சியின் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: חֹמָה
  choice: மதிலாக
  rationale: இச்சொல் நேரடியாக ‘மதில்’ என்று பொருள்படும்; எபிரெயத்தில் உவமைக்குறி இல்லாததால் ‘மதில் போல’ என்று மெலிவுபடுத்தப்படவில்லை.
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: அவர்களுக்கு வலப்புறத்திலும் இடப்புறத்திலும்
  rationale: இருபுறங்களிலும் நீர் இருந்த இடநிலையைத் தெளிவாகவும், மூலத்தின் இணையான அமைப்பைக் காத்தும் தமிழில் வழங்குகிறது.
