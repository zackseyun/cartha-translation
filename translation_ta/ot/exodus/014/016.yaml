base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/016.yaml
  text: But as for you[a], lift up your staff and stretch out your hand over the sea and split it, so that the sons of Israel may go through the midst of the sea on dry ground.
translation:
  language: ta
  text: ஆனால் நீயோ உன் கோலை உயர்த்தி, உன் கையைக் கடலின் மேல் நீட்டி, அதைப் பிள; அப்போது இஸ்ரவேலின் மகன்கள்[a] கடலின் நடுவே உலர்ந்த தரையில் செல்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இஸ்ரவேலர்கள்’ அல்லது ‘இஸ்ரவேலின் பிள்ளைகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் நேரடியாக ‘இஸ்ரவேலின் மகன்கள்’ என்று உள்ளது; இங்கு அது இஸ்ரவேல் மக்களை முழுமையாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: ஆனால் நீ
  rationale: இணைப்புச்சொல்லும் தனிப்பட்ட சுட்டுப்பெயரும் சூழலில் மோசேயை வலியுறுத்தித் தனிப்படுத்துகின்றன; இயல்பான தமிழில் ‘ஆனால் நீ’ அந்த மாறுபாட்டு வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: הָרֵם אֶת מַטְּךָ
  choice: உன் கோலை உயர்த்தி
  rationale: הָרֵם என்பது உயர்த்தும்படியான கட்டளை; מַטֶּה இச்சூழலில் மோசேயின் கோலைக் குறிக்கிறது. ‘கோல்’ இயல்பானதும் கதையின் பொருளைத் தெளிவாகக் காப்பதும் ஆகும்.
- source_word: וּנְטֵה אֶת יָדְךָ עַל הַיָּם
  choice: உன் கையைக் கடலின்மேல் நீட்டி
  rationale: נטה உடல் உறுப்பை நீட்டுவதைக் குறிக்கிறது; עַל இங்கு கடலின்மேல் செய்யப்படும் சைகையின் இடத்தொடர்பைக் காட்டுகிறது.
- source_word: וּבְקָעֵהוּ
  choice: அதைப் பிளந்துவிடு
  rationale: בקע என்பது பிளத்தல் அல்லது இரண்டாகப் பிரித்தல். ‘பிளந்துவிடு’ கட்டளையின் வலிமையையும் நிகழும் உடல் பிரிவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְיָבֹאוּ
  choice: அப்போது ... கடந்து செல்வார்கள்
  rationale: கட்டளைத் தொடருக்குப் பின்வரும் இவ்வினை எதிர்பார்க்கப்படும் விளைவைச் சுட்டுகிறது. கடலைக் கடக்கும் சூழலைக் கருத்தில் கொண்டு ‘அப்போது ... கடந்து செல்வார்கள்’ இயல்பாக உள்ளது; நோக்கமா விளைவா என்ற உறவை அளவுக்கு மீறி முடிவுசெய்யாது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான வடிவம் ‘இஸ்ரவேலின் மகன்கள்.’ இது ஆண்பால் பன்மை வடிவத்தைப் பாதுகாக்கிறது; முழு இஸ்ரவேல் மக்களையும் குறிக்கும் சூழல் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: בְּתוֹךְ הַיָּם
  choice: கடலின் நடுவே
  rationale: בְּתוֹךְ என்பது ஓர் இடத்தின் உட்பகுதி அல்லது நடுவைக் குறிக்கிறது; ‘கடலின் நடுவே’ அந்த இடவுருவகத்தைத் தக்கவைக்கிறது.
- source_word: בַּיַּבָּשָׁה
  choice: உலர்ந்த தரையில்
  rationale: יַבָּשָׁה நீருக்கு மாறான உலர்ந்த நிலம் அல்லது தரையைக் குறிக்கிறது. இங்கு கடற்படுகை உலர்ந்திருப்பதை ‘உலர்ந்த தரையில்’ தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதிலுள்ள பாலின வடிவத்தையும் மக்கள் முழுவதையும் குறிக்கும் பொருளையும் வழங்குதல்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள் / இஸ்ரவேலின் பிள்ளைகள்
  rationale: மூலத்தின் வெளிப்படையான ஆண்பால் ‘மகன்கள்’ வடிவம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது. அதேவேளை, சூழலில் இது உடன்படிக்கை மக்களாகிய இஸ்ரவேலர் அனைவரையும் குறிக்கிறது என்பதை அடிக்குறிப்பு தெரிவிக்கிறது; இதனால் பாலின வடிவமோ பரந்த குறிப்போ மறைக்கப்படுவதில்லை.
- issue: וְיָבֹאוּ என்பதன் நோக்கம் அல்லது விளைவு சார்ந்த தொடர்பு
  choice: அப்போது ... கடந்து செல்வார்கள்
  alternative: அவர்கள் ... கடந்து செல்வதற்காக / கடந்து செல்லும்படி
  rationale: எபிரெயக் கட்டமைப்பு தொடர்ச்சியாக நிகழும் எதிர்பார்க்கப்பட்ட விளைவை அனுமதிக்கிறது; நோக்கத்தை மட்டும் கட்டாயப்படுத்தாமல் ‘அப்போது’ என வழங்குவது உரையின் இயல்பான தொடரையும் மெய்யியல் பதற்றமின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டது. ‘கடலின்மேல்,’ ‘கடலின் நடுவே,’ ‘உலர்ந்த தரையில்’ ஆகியவை மூலத்தின் இடவுருவகத்தைத் தெளிவாகப் பாதுகாக்கின்றன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
