revisions:
- from: ஆனால் நீ உன் கோலை உயர்த்தி, உன் கையைக் கடலின்மேல் நீட்டி, அதைப் பிளந்துவிடு; அப்போது இஸ்ரவேலின் மகன்கள்[a] கடலின் நடுவே உலர்ந்த தரையில் கடந்து செல்வார்கள்.
  to: ஆனால் நீயோ உன் கோலை உயர்த்தி, உன் கையைக் கடலின் மேல் நீட்டி, அதைப் பிள; அப்போது இஸ்ரவேலின் மகன்கள்[a] கடலின் நடுவே உலர்ந்த தரையில் செல்வார்கள்.
  rationale: The revision removes the interpretively stronger ‘கடந்து’ and renders the Hebrew movement verb with the more neutral ‘செல்வார்கள்.’ It also sharpens the contrastive address and standardizes spacing, while retaining the draft’s source-faithful terminology and its footnote anchor.
