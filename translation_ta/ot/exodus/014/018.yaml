source:
  edition: WLC
  text: וְ/יָדְע֥וּ מִצְרַ֖יִם כִּי אֲנִ֣י יְהוָ֑ה בְּ/הִכָּבְדִ֣/י בְּ/פַרְעֹ֔ה בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/018.yaml
  text: And the Egyptians will know that I am Yahweh[a], when I gain glory through Pharaoh, through his chariots[b], and through his horsemen.
translation:
  language: ta
  text: பார்வோன் வழியாகவும், அவனுடைய தேர்கள் வழியாகவும், அவனுடைய குதிரைவீரர்கள் வழியாகவும் நான் மகிமைப்படும்போது[a], நானே யாவே[b] என்பதை எகிப்தியர்கள் அறிந்துகொள்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் மகிமை அடையும்போது.”
    reason: lexical_alternative
  - marker: b
    text: “யாவே” என்பது יהוה (YHWH) என்ற எபிரெய இறைப்பெயரின் ஒலிபெயர்ப்பு; பல மொழிபெயர்ப்புகள் இதை “கர்த்தர்” என்று வழங்குகின்றன.
    reason: divine_name
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: அறிந்துகொள்வார்கள்
  rationale: இணைப்புடன் வரும் வினை வடிவம் இங்கு நிகழவிருக்கும் செயலின் விளைவைக் குறிக்கிறது. எகிப்தியர்கள் யாவே யார் என்பதை வரவிருக்கும் நிகழ்வின் மூலம் உணர்ந்துகொள்வார்கள் என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: מִצְרַיִם
  choice: எகிப்தியர்கள்
  rationale: இச்சூழலில் இடப்பெயரான ‘எகிப்து’ அல்ல, அறிந்துகொள்ளும் மக்களையே இந்தச் சொல் குறிக்கிறது.
- source_word: כִּי אֲנִי יְהוָה
  choice: நானே யாவே என்பதை
  rationale: எபிரெய அடையாள அறிவிப்பு அமைப்பைப் பாதுகாக்கிறது. ‘நானே’ என்பது אֲנִי என்பதன் வலியுறுத்தலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பொதுப்பட்டப் பெயர் அல்ல, கடவுளுடைய தனிப்பெயரைக் குறிக்கும் நான்கு எபிரெய மெய்யெழுத்துகளின் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: בְּהִכָּבְדִי
  choice: நான் மகிமை அடையும்போது
  rationale: כבד என்பதன் நிஃபால் வினையெச்ச வடிவத்தையும் בְּ என்பதன் காலப் பொருளையும் பிரதிபலிக்கிறது. கடவுள் மகிமை பெறுதல்/மகிமைப்படுத்தப்படுதல் என்ற மூலத்தின் நுணுக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: בְּפַרְעֹה
  choice: பார்வோன் வழியாகவும்
  rationale: בְּ என்பது இங்கு யாவேயின் மகிமை வெளிப்படும் வழி அல்லது களத்தைக் குறிக்கிறது. ‘வழியாக’ என்பது ‘மூலம்’ என்ற பொருளைத் தருவதோடு, ‘மீது’ என்று மொழிபெயர்த்து தோல்வியின் கருத்தை அளவுக்கு அதிகமாக வெளிப்படையாக்குவதைத் தவிர்க்கிறது.
- source_word: בְּרִכְבּוֹ
  choice: அவனுடைய தேர்கள் வழியாகவும்
  rationale: רֶכֶב இங்கு தேர்ப்படையைத் தொகுப்பாகக் குறிக்கலாம்; ‘தேர்கள்’ என்பது தெளிவான, இயல்பான தமிழாக்கம்.
- source_word: וּבְפָרָשָׁיו
  choice: அவனுடைய குதிரைவீரர்கள் வழியாகவும்
  rationale: פָּרָשִׁים என்பது குதிரையில் போரிடுவோரையோ குதிரைப்படையையோ குறிக்கிறது. ‘குதிரைவீரர்கள்’ நேரடியானதும் இன்றைய வாசகருக்குத் தெளிவானதும் ஆகும்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் பொதுவான ஆண்டவர் என்னும் பட்டமல்ல, இறைவனின் தனிப்பெயரான יהוה நேரடியாக உள்ளது. ஆகவே பெயரைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: בְּהִכָּבְדִי என்பதில் மகிமை பெறும் செயற்பாங்கு
  choice: நான் மகிமை அடையும்போது
  alternative: நான் மகிமைப்படுத்தப்படும்போது
  rationale: நிஃபால் வடிவம் மகிமை பெறுதல் அல்லது மகிமைப்படுத்தப்படுதல் என்ற இரு நெருங்கிய நுணுக்கங்களையும் அனுமதிக்கிறது. முதன்மை உரை செயலை இயல்பான தமிழில் கூறுகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் בְּ மூன்று முறை வருவதால், ‘வழியாகவும்’ என்ற அமைப்பு மீண்டும் பயன்படுத்தப்பட்டு அதன் இணைநிலை வலியுறுத்தல் பாதுகாக்கப்பட்டுள்ளது.
