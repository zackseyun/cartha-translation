  text: וַ/יִּקַּ֗ח שֵׁשׁ מֵא֥וֹת רֶ֨כֶב֙ בָּח֔וּר וְ/כֹ֖ל רֶ֣כֶב מִצְרָ֑יִם וְ/שָׁלִשִׁ֖ם עַל כֻּלּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/007.yaml
  text: And he took six hundred choice chariots[a], and all the chariots of Egypt, with officers over all of them.
translation:
  language: ta
  text: அவன் தேர்ந்தெடுக்கப்பட்ட அறுநூறு தேர்களையும், எகிப்தின் எல்லாத் தேர்களையும், அவை அனைத்திற்கும் அதிகாரிகளுடன் எடுத்துக்கொண்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவை அனைத்தின்மேலும் தேர்ப்படை அதிகாரிகளுடன்.” எபிரெயச் சொல் தேர்களோடு தொடர்புடைய உயர்நிலைப் படை உதவியாளர்களையோ தலைவர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: அவன் எடுத்துக்கொண்டான்
  rationale: לקח என்பதன் wayyiqtol வடிவம் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; தமிழில் இயல்பான தொடர்நடை வினையாக வழங்கப்பட்டுள்ளது.
- source_word: שֵׁשׁ מֵאוֹת
  choice: அறுநூறு
  rationale: எண்ணிக்கையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: רֶכֶב
  choice: தேர்கள்
  rationale: இச்சூழலில் போர் ரதங்களைக் குறிக்கிறது; வெளிப்படையான எண்ணிக்கையுடன் வருவதால் எண்ணத்தக்க பன்மைச் சொல் பொருத்தமானது.
- source_word: בָּחוּר
  choice: தேர்ந்தெடுக்கப்பட்ட
  rationale: בחר வேரிலிருந்து வந்த இச்சொல் சிறப்பாகத் தெரிவுசெய்யப்பட்ட அல்லது உயர்தரமான படைப்பிரிவைக் குறிக்கிறது.
- source_word: וְכֹל רֶכֶב מִצְרָיִם
  choice: எகிப்தின் மற்ற எல்லாத் தேர்களையும்
  rationale: அறுநூறு தேர்ந்தெடுக்கப்பட்ட தேர்களோடு எகிப்தின் முழுத் தேர்ப்படையும் கூட எடுத்துக்கொள்ளப்பட்டதைத் தெளிவாக்குகிறது; 'மற்ற' என்பது தமிழில் கூட்டிச் சேர்க்கும் உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְשָׁלִשִׁם
  choice: படைத்தலைவர்கள்
  rationale: שָׁלִישׁ என்பது தேர்களோடு தொடர்புடைய உயர்நிலைப் படை உதவியாளர்கள் அல்லது அதிகாரிகளைக் குறிக்கும் தெளிவற்ற இராணுவப் பதவி; 'படைத்தலைவர்கள்' அதன் பணிநிலையைப் பொதுவாகத் தெரிவிக்கிறது.
- source_word: עַל כֻּלּוֹ
  choice: அவை அனைத்திலும்
  rationale: ஒருமை வடிவிலுள்ள பின்னொட்டு தேர்ப்படையை கூட்டாகக் குறிக்கிறது; ஒவ்வொரு தேரிலும் அல்லது தேர்ப்படை முழுவதிலும் அதிகாரிகள் நியமிக்கப்பட்டிருந்த பகிர்ந்தளிப்பு உணர்வை இவ்வடிவம் தக்கவைக்கிறது.
