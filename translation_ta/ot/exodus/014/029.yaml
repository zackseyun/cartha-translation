base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/029.yaml
  text: But the sons of Israel walked on dry ground through the midst of the sea[b][a], and the waters were a wall to them on their right and on their left.
translation:
  language: ta
  text: ஆனால் இஸ்ரவேலின் பிள்ளைகள் கடலின் நடுவே உலர்ந்த தரையில் நடந்து சென்றார்கள்[a]; தண்ணீர் அவர்களுக்கு வலப்புறத்திலும் இடப்புறத்திலும் மதிலாக இருந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர் கடலின் நடுவே உலர்ந்த தரையில் நடந்து சென்றார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “தண்ணீர் அவர்களுக்கு மதிலாக இருந்தது”; சிலர் இதை “மதில் போல இருந்தது” என்று புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: ஆனால் இஸ்ரவேலின் பிள்ளைகள்
  rationale: בני ישראל என்பதன் குடும்பவழி-தேசிய உருவகத்தைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது. முந்தைய சூழலில் எகிப்தியருக்கு ஏற்பட்ட அழிவுடன் இஸ்ரவேலரின் பாதுகாப்பான கடத்தலை வேறுபடுத்துவதால் וּ என்பதற்கு ‘ஆனால்’ பொருத்தமானது.
- source_word: הָלְכוּ
  choice: நடந்துசென்றார்கள்
  rationale: הלך என்பதன் ‘நட/செல்’ என்ற பொருளையும், கடற்படுகையில் கால்நடையாக முன்னேறிய காட்சியையும் இயல்பான தமிழில் தருகிறது.
- source_word: בַיַּבָּשָׁה
  choice: உலர்ந்த தரையில்
  rationale: יבשה என்பது உலர்ந்த நிலம் அல்லது தரையைக் குறிக்கிறது; கடற்படுகை உலர்ந்திருந்த அற்புதமான நிலையை இச்சொற்றொடர் தெளிவாக்குகிறது.
- source_word: בְּתוֹךְ הַיָּם
  choice: கடலின் நடுவே
  rationale: בתוך என்பதிலுள்ள ‘நடுவில்/நடுவாக’ என்ற இடவுணர்வைப் பாதுகாத்து, தமிழில் இயல்பாக அமைகிறது.
- source_word: וְהַמַּיִם
  choice: தண்ணீர்
  rationale: מים எபிரெயத்தில் பன்மை வடிவமுடையதாயினும், தமிழில் ‘தண்ணீர்’ இயல்பான கூட்டுப்பெயராக இருந்து பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לָהֶם
  choice: அவர்களுக்கு
  rationale: 'לָהֶם குறிக்கும் தொடர்பை நேரடியாகப் பாதுகாக்கிறது: தண்ணீர் அவர்களைப் பொறுத்தவரை மதிலாக இருந்தது.'
- source_word: חֹמָה
  choice: மதிலாக
  rationale: חֹמָה என்பது உறுதியான பாதுகாப்பு மதிலைக் குறிக்கிறது. எபிரெயத்தில் ஒப்புமைக் குறியீடு இல்லாததால் ‘மதில் போல’ என்று மெலிதாக்காமல் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: வலப்புறத்திலும் இடப்புறத்திலும்
  rationale: இருபுற இடநிலையையும் எபிரெய இணை அமைப்பையும் சுருக்கமான, இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: בני ישראל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் பிள்ளைகள்
  alternative: இஸ்ரவேலர்
  rationale: மூலத்தின் குடும்பவழி மற்றும் தேசிய வெளிப்பாட்டைப் பிரதான உரை பாதுகாக்கிறது; இனப்பெயரான ‘இஸ்ரவேலர்’ இயல்பான மாற்று மொழிபெயர்ப்பு.
- issue: חֹמָה என்பதை நேரடியாகவா ஒப்புமையாகவா மொழிபெயர்ப்பது
  choice: மதிலாக
  alternative: மதில் போல
  rationale: மூல உரையில் வெளிப்படையான ஒப்புமைக் குறியீடு இல்லை. ஆகவே அதன் வலிமையான நேரடிக் கூற்றைப் பாதுகாத்து, ஒப்புமை வாசிப்பை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இஸ்ரவேலின் பிள்ளைகள்’ மூலத்தின் குடும்பவழி வெளிப்பாட்டைப் பாதுகாக்கிறது; ‘மதில்’ என்பது חֹמָה என்பதின் வலிமையை ‘சுவர்’ என்பதைக் காட்டிலும் நன்றாக வெளிப்படுத்துகிறது.
