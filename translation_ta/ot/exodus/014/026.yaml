  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה נְטֵ֥ה אֶת יָדְ/ךָ֖ עַל הַ/יָּ֑ם וְ/יָשֻׁ֤בוּ הַ/מַּ֨יִם֙ עַל מִצְרַ֔יִם עַל רִכְבּ֖/וֹ וְ/עַל פָּרָשָֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/026.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the sea, so that the waters may return over the Egyptians, over their chariots, and over their horsemen.”
translation:
  language: ta
  text: பின்பு யாவே மோசேயிடம், “உன் கையைக் கடலின்மேல் நீட்டு; அப்போது தண்ணீர் எகிப்தியர்கள்மேல், அவர்களுடைய தேர்கள்மேல், அவர்களுடைய குதிரைவீரர்கள்மேல் திரும்பி வரும்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தண்ணீர் எகிப்தியர்கள்மேல், அவர்களுடைய தேர்கள்மேல், அவர்களுடைய குதிரைவீரர்கள்மேல் திரும்பி வரும்படி.” எபிரெய வினை எளிய எதிர்காலமாகவும் மொழிபெயர்க்கப்படலாம்; இங்கு மோசேயின் செயலால் ஏற்பட வேண்டிய விளைவையும் அது குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் ‘பின்பு’ அதன் தொடர்ச்சியைக் இயல்பாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டமல்ல, தேவனுடைய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயர்; தமிழில் அதன் பரவலான ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்படுகிறது.
- source_word: נְטֵה אֶת־יָדְךָ
  choice: உன் கையை ... நீட்டு
  rationale: ஆண்பால் ஒருமை கட்டளையையும் உடல் செய்கையையும் நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: עַל־הַיָּם
  choice: கடலின்மேல்
  rationale: עַל என்பதன் மேலாக/மீது என்ற இடவியல் படிமத்தைப் பாதுகாக்கிறது; ‘கடலை நோக்கி’ என்று பொருளை மாற்றவில்லை.
- source_word: וְיָשֻׁבוּ
  choice: அப்போது ... திரும்பி வரும்
  rationale: கட்டளைக்குப் பின் வரும் இந்த வினை, மோசேயின் செயலின் எதிர்பார்க்கப்பட்ட விளைவைக் குறிக்கிறது. எபிரெயச் சொற்றொடரின் எளிய எதிர்கால வடிவையும் தமிழில் இயல்பாக வைத்திருக்கிறது.
- source_word: הַמַּיִם
  choice: தண்ணீர்
  rationale: எபிரெயத்தில் வடிவியல் பன்மை இருந்தாலும், நவீன தமிழில் இச்சூழலில் ‘தண்ணீர்’ இயல்பான திரள்பொருள் பெயராகும்.
- source_word: עַל־מִצְרַיִם
  choice: எகிப்தியர்கள்மேலும்
  rationale: இங்கு மִצְרַיִם என்பது மக்களைக் கூட்டாகக் குறிக்கிறது; திரும்பிவரும் தண்ணீர் அவர்களை மூடும் படிமத்தை ‘மேலும்’ பாதுகாக்கிறது.
- source_word: עַל־רִכְבּוֹ
  choice: அவர்களுடைய தேர்கள்மேலும்
  rationale: எபிரெயப் பின்னொட்டு இலக்கணரீதியாக ஒருமையாக இருந்தாலும், ‘எகிப்தியர்கள்’ என்ற கூட்டுக் குறிப்பைத் தமிழில் இயல்பான பன்மை உடைமையாக வெளிப்படுத்துகிறது.
- source_word: וְעַל־פָּרָשָׁיו
  choice: குதிரைவீரர்கள்மேலும்
  rationale: פָּרָשִׁים என்பது குதிரையில் போரிடுவோர் அல்லது குதிரைப்படை வீரர்களைக் குறிக்கிறது; ‘குதிரைவீரர்கள்’ நேரடியான, எளிதில் புரியும் சொல்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் பட்டத்தை அல்ல, தனிப்பெயரான יהוה என்பதைப் பயன்படுத்துகிறது. அதனைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: וְיָשֻׁבוּ என்பதன் விளைவு அல்லது எளிய எதிர்கால நயம்
  choice: அப்போது ... திரும்பி வரும்
  alternative: திரும்பி வரும்படி
  rationale: எபிரெய வடிவம் எளிய எதிர்காலமாகவும், முன் கட்டளையின் நோக்கம் அல்லது விளைவாகவும் புரிந்துகொள்ளப்படலாம். முதன்மை உரை எதிர்கால நயத்தை வைத்துக்கொண்டு, மாற்றுப் புரிதலை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தண்ணீர்’ என்பது இயல்பான தமிழ் திரள்பொருள் சொல்; தொடர்ச்சியாக வரும் ‘மேலும்’ மூல எபிரெயத்தின் ஒத்த அமைப்பையும் மூடும் படிமத்தையும் தக்கவைக்கிறது.
