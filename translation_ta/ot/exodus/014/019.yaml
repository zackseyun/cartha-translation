  text: וַ/יִּסַּ֞ע מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים הַ/הֹלֵךְ֙ לִ/פְנֵי֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יֵּ֖לֶךְ מֵ/אַחֲרֵי/הֶ֑ם וַ/יִּסַּ֞ע עַמּ֤וּד הֶֽ/עָנָן֙ מִ/פְּנֵי/הֶ֔ם וַ/יַּֽעֲמֹ֖ד מֵ/אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/019.yaml
  text: Then the angel of God[a], who had been going before the camp of Israel, moved and went behind them; and the pillar of cloud moved from before them and stood behind them.
translation:
  language: ta
  text: அப்போது, இஸ்ரவேல் முகாமின் முன்னால் சென்றுகொண்டிருந்த கடவுளின் தேவதூதர்[a] நகர்ந்து அவர்களுக்குப் பின்னால் சென்றார்; மேகத்தூணும் அவர்களுக்கு முன்னாலிருந்து நகர்ந்து அவர்களுக்குப் பின்னால் நின்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளின் தூதர்.’ எபிரெயச் சொல் ‘தேவதூதர்’ அல்லது ‘தூதர்’ என்ற இரு பொருள்களையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: நகர்ந்து
  rationale: נסע என்பதற்கு ‘புறப்படுதல்’ அல்லது ‘பயணம் தொடங்குதல்’ என்ற பொருள்கள் இருக்கலாம். இங்கு தேவதூதரும் மேகத்தூணும் தங்கள் இடத்தை முன்னாலிருந்து பின்னால் மாற்றுவதால், ‘நகர்ந்து’ என்பது சூழலுக்கு இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: கடவுளின் தேவதூதர்
  rationale: מַלְאָךְ என்பது ‘தேவதூதர்’ அல்லது பொதுவாக ‘தூதர்’ என்று பொருள்படலாம். இந்த இறைவழிநடத்தல் சூழலில் ‘தேவதூதர்’ இயல்பான முதன்மைத் தேர்வு; அந்த நபரின் இயல்பை இதற்கு மேல் வரையறுக்காமல் மூலத்தின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
- source_word: הַהֹלֵךְ
  choice: சென்றுகொண்டிருந்த
  rationale: எபிரெயப் பங்கேற்புவினை, பின்னர் நிகழும் இடமாற்றத்திற்கு முன்பாகத் தொடர்ந்துகொண்டிருந்த செயலைக் காட்டுகிறது. ‘சென்றுகொண்டிருந்த’ அந்த நீடித்த முன்செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי מַחֲנֵה יִשְׂרָאֵל
  choice: இஸ்ரவேலின் முகாமுக்கு முன்னால்
  rationale: לִפְנֵי இங்கு இடத்தைக் குறிக்கும் ‘முன்னால்’ என்பதாகும். ‘இஸ்ரவேலின் முகாம்’ என்ற வடிவம் எபிரெய இணைப்பையும் தெளிவாகக் காக்கிறது.
- source_word: וַיֵּלֶךְ מֵאַחֲרֵיהֶם
  choice: அவர்களுக்குப் பின்னால் சென்றார்
  rationale: מֵאַחֲרֵי இங்கு பின்தொடர்ந்து துரத்துவதைக் குறிக்காமல், பின்புற இடநிலையைக் குறிக்கிறது. ‘பின்னால் சென்றார்’ இதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: עַמּוּד הֶעָנָן
  choice: மேகத்தூண்
  rationale: இந்த இணைச்சொல் ‘மேகத்தால் ஆன தூண்’ என்ற கண்கூடிய உருவகத்தைச் சுருக்கமாகவும் தமிழில் நிலைபெற்ற இயல்பான சொல்லாக்கத்திலும் தருகிறது.
- source_word: מִפְּנֵיהֶם
  choice: அவர்களுக்கு முன்னாலிருந்து
  rationale: முந்தைய இடக்குறிப்புடன் ஒத்திசைந்து, முன்னிருந்த நிலையிலிருந்து நிகழ்ந்த நகர்வை நேரடியாகக் காட்டுகிறது.
- source_word: וַיַּעֲמֹד
  choice: நின்றது
  rationale: עמד என்பதன் அடிப்படைப் பொருள் ‘நில்’. இங்கு மேகத்தூண் ஒரு நிலையான இடத்தை அடைந்ததை எளிமையாகவும் நேரடியாகவும் காட்டுகிறது.
theological_decisions:
- issue: מַלְאַךְ הָאֱלֹהִים என்பவரின் அடையாளமும் இயல்பும்
  choice: ‘கடவுளின் தேவதூதர்’ என்று மொழிபெயர்த்து, அவர் படைக்கப்பட்ட தேவதூதரா, கடவுளின் வெளிப்பாடா, அல்லது வேறு விதமாகப் புரிந்துகொள்ளப்பட வேண்டியவரா என்பதை நிர்ணயிக்காமல் விடுதல்.
  alternative: ‘கடவுளின் தூதர்’ என்று மொழிபெயர்த்தல் அல்லது அவரை வெளிப்படையாக இறைத்தோற்றமாக அடையாளப்படுத்துதல்.
  rationale: இவ்வசனம் அந்த நபரைப் பெயரிடுகிறது; ஆனால் அவருடைய இருப்பின் இயல்பை விளக்கவில்லை. ஆகவே பின்னாளைய கோட்பாட்டு முடிவுகளை உரைக்குள் சேர்க்காமல், மூலத்தில் உள்ள இறையியல் பதற்றமும் திறந்தநிலையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘சென்றுகொண்டிருந்த’ என்பது முன்பிருந்த தொடர்ச்சியான செயலைக் காக்கிறது; ‘முன்னால்/பின்னால்’ என்ற இணையான இடச்சொற்கள் மூலத்தின் அமைப்பைத் தெளிவாக பிரதிபலிக்கின்றன.
