base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/021.yaml
  text: Then Moses stretched out his hand over the sea[a], and Yahweh drove the sea back by a strong east wind all night and made the sea dry land[d][c][b], and the waters were split.
translation:
  language: ta
  text: பின்பு மோசே தன் கையைக் கடலின்மேல் நீட்டினார். யாவே பலத்த கிழக்குக் காற்றினால் இரவு முழுவதும் கடலைப் பின்வாங்கச் செய்து[a], கடலை உலர்ந்த நிலமாக்கினார்[b]; தண்ணீர் பிளவுபட்டது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இன்னும் சொற்சொல்லாக, ‘கடலை நகரச் செய்தார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘கடலை உலர்ந்த தரையாக மாற்றினார்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது ‘தண்ணீர் பிரிக்கப்பட்டது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: நீட்டினார்
  rationale: נטה என்பதற்கு ‘கை’ செயப்படுபொருளாக வரும்போது, கையை நீட்டுதல் என்ற இயல்பான பொருள் உண்டு; தமிழிலும் இது செயலைத் தெளிவாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: עַל הַיָּם
  choice: கடலின்மேல்
  rationale: עַל இங்கு கை நீட்டப்பட்ட திசையையும் கடலுக்கு மேலான நிலையையும் குறிக்கிறது; ‘கடலின்மேல்’ என்பது எபிரெயச் சொல்லின் பரப்பைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புச் சொல்லால் மாற்றாமல், எபிரெய வேதாகமத்தில் உள்ள தேவனுடைய தனிப்பெயரான יהוה-ஐத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: וַיּוֹלֶךְ יְהוָה אֶת הַיָּם
  choice: யாவே ... கடலைப் பின்வாங்கச் செய்து
  rationale: הלך என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளைத் தருகிறது. சூழலில் கடல் விலக்கப்படுவதை இயல்பான தமிழில் ‘பின்வாங்கச் செய்து’ தெரிவிக்கிறது; எபிரெயத்தில் ‘பின்’ என்பது வெளிப்படையாக இல்லை என்பதால் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּרוּחַ קָדִים עַזָּה
  choice: பலத்த கிழக்குக் காற்றினால்
  rationale: רוּחַ இங்கு ‘கிழக்கு’ என்ற அடைமொழியாலும் கருவிப் பொருளாலும் ‘காற்று’ எனப் பொருள்படுகிறது. עַזָּה-வின் வலிமையை ‘பலத்த’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: כָּל הַלַּיְלָה
  choice: இரவு முழுவதும்
  rationale: செயல் முழு இரவும் நீடித்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיָּשֶׂם אֶת הַיָּם לֶחָרָבָה
  choice: கடலை உலர்ந்த நிலமாக்கினார்
  rationale: חָרָבָה என்பது உலர்ந்த நிலம் அல்லது உலர்ந்த தரையைக் குறிக்கிறது. எபிரெயத்தில் ‘கடல்’ செயப்படுபொருளாக இருப்பதை இந்த அமைப்பு தக்கவைக்கிறது.
- source_word: וַיִּבָּקְעוּ הַמָּיִם
  choice: தண்ணீர் பிளவுண்டது
  rationale: בקע என்பதன் நிஃபால் வடிவம் தண்ணீர் பிளக்கப்பட்ட அல்லது பிளவுண்ட நிகழ்வைக் குறிக்கிறது. ‘பிளவுண்டது’ அதன் தெளிவான, வலுவான படிமத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை יהוה என்ற தனிப்பெயரையே பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூல உரையின் தனிப்பெயர் பயன்பாட்டைப் பாதுகாக்கிறது.
- issue: கடல் பின்வாங்கியது இயற்கைச் செயலா அல்லது இறைச்செயலா
  choice: யாவே ... கடலைப் பின்வாங்கச் செய்து
  alternative: காற்று கடலைப் பின்வாங்கச் செய்தது
  rationale: எபிரெய வாக்கியத்தில் யாவேதான் வினையின் எழுவாய்; கிழக்குக் காற்று அவர் பயன்படுத்திய வழிமுறையாகக் குறிக்கப்படுகிறது. ஆகவே இறைச்செயலும் காற்றின் கருவிப் பங்கும் இரண்டும் தக்கவைக்கப்பட்டன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘கடலின்மேல்’, ‘இரவு முழுவதும்’, ‘உலர்ந்த நிலம்’ போன்ற சொற்றொடர்கள் பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும், எபிரெய வாக்கியத்தின் செயற்பாட்டு வரிசையைப் பாதுகாக்கும் வகையிலும் அமைக்கப்பட்டுள்ளன.
