  text: וַ/יֹּאמְרוּ֮ אֶל מֹשֶׁה֒ הַֽ/מִ/בְּלִ֤י אֵין קְבָרִים֙ בְּ/מִצְרַ֔יִם לְקַחְתָּ֖/נוּ לָ/מ֣וּת בַּ/מִּדְבָּ֑ר מַה זֹּאת֙ עָשִׂ֣יתָ לָּ֔/נוּ לְ/הוֹצִיאָ֖/נוּ מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/011.yaml
  text: And they said to Moses[a], “Was it because there were no graves in Egypt that you took us away to die in the wilderness? What is this you have done to us by bringing us out of Egypt?”
translation:
  language: ta
  text: அவர்கள் மோசேயிடம், “எகிப்தில் கல்லறைகளே இல்லை என்பதாலா எங்களைப் பாலைநிலத்தில் சாகும்படி கூட்டிக்கொண்டு வந்தாய்?[a] எங்களை எகிப்திலிருந்து வெளியே கொண்டுவந்ததன் மூலம் எங்களுக்கு நீ என்ன செய்தாய்?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்படியான மொழிபெயர்ப்பு: “எகிப்தில் கல்லறைகள் இல்லாத குறைவினாலா எங்களைப் பாலைநிலத்தில் சாகும்படி கூட்டிக்கொண்டு வந்தாய்?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: அவர்கள் மோசேயிடம் … என்றார்கள்
  rationale: אמר என்பதன் வழக்கமான கதைநடைப் பொருளை இயல்பான தமிழ் நேர்கூற்றுக் கட்டமைப்பில் தருகிறது; אֶל பேச்சு செலுத்தப்படும் நபரைச் சுட்டுகிறது.
- source_word: הֲמִבְּלִי אֵין קְבָרִים בְּמִצְרַיִם
  choice: எகிப்தில் கல்லறைகளே இல்லை என்பதாலா
  rationale: கல்லறைகள் இல்லாததே காரணமா என்ற கிண்டலான வினாவைத் தமிழில் இயல்பாகவும் அதன் கடுமையான ஏளனத்தைத் தக்கவைத்தும் வெளிப்படுத்துகிறது.
- source_word: לְקַחְתָּנוּ לָמוּת
  choice: எங்களை … சாவதற்காகக் கூட்டிக்கொண்டு வந்தாய்
  rationale: לקח என்பதன் ‘அழைத்துச் செல்/கூட்டிக்கொண்டு செல்’ இயக்கப் பொருளையும், לָמוּת என்பதன் நோக்கம் அல்லது விளைவு சார்ந்த பொருளையும் சூழலுக்கேற்ற தமிழில் தருகிறது.
- source_word: בַּמִּדְבָּר
  choice: பாலைநிலத்தில்
  rationale: מִדְבָּר குறிக்கும் குடியிருப்பும் பயிரிடுதலும் குறைந்த வறண்ட வெளிப்பகுதியை நவீன வாசகர்களுக்குப் புரியும் சொல்லால் தருகிறது; அது மணற்பாலைவனம் மட்டுமே என்ற தேவையற்ற குறுக்கத்தைக் கொண்டுவராது.
- source_word: מַה־זֹּאת עָשִׂיתָ לָּנוּ
  choice: எங்களுக்கு நீ செய்திருக்கும் இந்தக் காரியம் என்ன?
  rationale: மூலத்தின் உணர்ச்சிமிக்க ‘இது என்ன?’ என்ற வினாவை ‘ஏன்?’ என்று விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: לְהוֹצִיאָנוּ מִמִּצְרָיִם
  choice: எங்களை எகிப்திலிருந்து வெளியே கொண்டுவந்து
  rationale: הוציא என்பதன் ‘வெளியே கொண்டுவருதல்’ என்ற வெளியேற்ற இயக்கத்தைத் தெளிவாகத் தருகிறது; முந்தைய לקח உடன் உள்ள சொற்பொருள் வேறுபாட்டையும் முடிந்தவரை காக்கிறது.
