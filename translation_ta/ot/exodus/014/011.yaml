translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் நேர்கூற்றின் குற்றச்சாட்டு மற்றும் கிண்டல் தொனி குறையாத வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வனாந்தரம்’ என்பதற்குப் பதிலாக இயல்பான ‘பாலைநிலம்’ பயன்படுத்தப்பட்டுள்ளது.
