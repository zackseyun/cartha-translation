base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/002.yaml
  text: Speak to the sons of Israel[a], that they turn back and camp before Pi-hahiroth, between Migdol and the sea. Before Baal-zephon, opposite it[c][b], you shall camp by the sea.
translation:
  language: ta
  text: 'இஸ்ரவேல் மக்களிடம்[a] சொல்: அவர்கள் திரும்பி, பி-ஹகீரோத்துக்கு முன்பாக, மிக்தோலுக்கும் கடலுக்கும் இடையே முகாமிடட்டும். பால்-செபோனுக்கு முன்பாக, அதற்கு எதிரே[c], கடலருகே நீங்கள் முகாமிட வேண்டும்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘இஸ்ரவேலின் மகன்கள்’; அதாவது, இஸ்ரவேல் மக்கள்.'
    reason: lexical_alternative
  - marker: b
    text: பி-ஹகீரோத், மிக்தோல், பால்-செபோன் ஆகியவை இடப்பெயர்கள்; எனவே அவை மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளன.
    reason: cultural_note
  - marker: c
    text: ‘அதை நோக்கியவாறு’ என்றும் மொழிபெயர்க்கலாம். ‘அதற்கு’ என்பது பெரும்பாலும் பால்-செபோனைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களிடம் சொல்
  rationale: דַּבֵּר என்பது நேரடியான ஒருமை ஆணை. בְּנֵי יִשְׂרָאֵל என்ற எபிரேய குடும்பவழக்கைச் சொற்சொல்லாகக் கடினப்படுத்தாமல், நவீன தமிழில் இயல்பாகவும் அனைவரையும் உள்ளடக்கியும் ‘இஸ்ரவேல் மக்கள்’ என வழங்குகிறது.
- source_word: וְיָשֻׁבוּ וְיַחֲנוּ
  choice: அவர்கள் திரும்பிச் சென்று ... முகாமிடட்டும்
  rationale: ஆணையைத் தொடர்ந்து வரும் இவ்விரு வடிவங்களின் கட்டளை/விருப்ப வலிமையை ‘முகாமிடட்டும்’ காட்டுகிறது. שׁוב இங்கு பயணத் திசையை மாற்றித் திரும்புவதைக் குறிப்பதால் ‘திரும்பிச் சென்று’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: לִפְנֵי פִּי הַחִירֹת
  choice: பீ-அகீரோத்துக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் இடவியல் பொருளை ‘முன்பாக’ காக்கிறது; פִּי הַחִירֹת இடப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: בֵּין מִגְדֹּל וּבֵין הַיָּם
  choice: மிக்தோலுக்கும் கடலுக்கும் இடையே
  rationale: בֵּין...וּבֵין என்ற இரு எல்லைகளைக் குறிக்கும் அமைப்பை இயல்பான தமிழில் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי בַּעַל צְפֹן נִכְחוֹ
  choice: பாகால்-செபோனுக்கு முன்பாக, அதற்கு எதிரே
  rationale: இரு இடவியல் தொடர்களையும் தனித்தனியாகக் காக்கிறது. ஆண்பால் ஒருமை பின்னொட்டு தமிழில் பாலற்ற ‘அதற்கு’ என வழங்கப்பட்டு, அது பெரும்பாலும் பாகால்-செபோன் என்ற இடத்தைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: תַחֲנוּ עַל הַיָּם
  choice: கடலருகே நீங்கள் முகாமிட வேண்டும்
  rationale: இரண்டாம் நபர் பன்மைக்கான நேரடி அறிவுறுத்தலை ‘நீங்கள் ... வேண்டும்’ வெளிப்படுத்துகிறது; עַל இவ்விடவியல் சூழலில் கடற்கரைக்கு அருகாமையைக் குறிப்பதால் ‘கடலருகே’ என வழங்கப்பட்டது.
