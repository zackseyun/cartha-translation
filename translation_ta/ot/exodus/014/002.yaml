translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் எபிரேய உச்சரிப்பை அணுகும் வகையில் ஒலிபெயர்க்கப்பட்டுள்ளன; மூலத்தின் இடவியல் மீளுரையும் சுட்டுப்பெயரின் சிறிய தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
