  text: וְ/חִזַּקְתִּ֣י אֶת לֵב פַּרְעֹה֮ וְ/רָדַ֣ף אַחֲרֵי/הֶם֒ וְ/אִכָּבְדָ֤ה בְּ/פַרְעֹה֙ וּ/בְ/כָל חֵיל֔/וֹ וְ/יָדְע֥וּ מִצְרַ֖יִם כִּֽי אֲנִ֣י יְהוָ֑ה וַ/יַּֽעֲשׂוּ כֵֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/004.yaml
  text: And I will harden Pharaoh’s heart[a], and he will pursue them; and I will get glory over Pharaoh and over all his army[b], and the Egyptians will know that I am Yahweh.” And they did so.
translation:
  language: ta
  text: “நான் பார்வோனின் மனத்தைக் கடினப்படுத்துவேன்[a]; அவன் அவர்களைத் துரத்திச் செல்வான். பார்வோனின் மீதும் அவனுடைய முழுப் படையின் மீதும் நான் மகிமை பெறுவேன்[b]; எகிப்தியர்கள் நானே யாவே என்பதை அறிந்துகொள்வார்கள்.” அவர்கள் அப்படியே செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பார்வோனின் மனத்தை உறுதியாக்குவேன்.” எபிரெய வினைச்சொல் ‘வலுவாக்கு, உறுதியாக்கு’ என்றும் பொருள்படும்; யாத்திராகமத்தின் இச்சூழலில் அந்த உறுதி பிடிவாதமான எதிர்ப்பாக வெளிப்படுவதால், முதன்மை உரையில் ‘கடினப்படுத்துவேன்’ என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பார்வோன் மூலமாகவும் அவனுடைய முழுப் படையின் மூலமாகவும் நான் மகிமை பெறுவேன்.” வரவிருக்கும் நிகழ்வுகளின் வழியாகப் பார்வோன் மற்றும் அவனுடைய படை தொடர்பாக யாவே மகிமை பெறுவதை எபிரெய சொற்றொடர் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְחִזַּקְתִּי
  choice: கடினப்படுத்துவேன்
  rationale: חזק என்பதன் ஹிப்ஈல் வடிவம் அடிப்படையில் ‘உறுதியாக்கு/வலுவாக்கு’ என்று பொருள்படலாம்; ஆனால் இச்சூழலில் பார்வோனின் பிடிவாதமான எதிர்ப்பையே குறிக்கிறது. ‘கடினப்படுத்துவேன்’ என்பது தெய்வீகச் செயலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לֵב
  choice: மனம்
  rationale: எபிரெய לֵב இங்கு வெறும் உணர்ச்சியை அல்ல, சிந்தனை, தீர்மானம், மனவுறுதி ஆகியவற்றின் மையத்தைக் குறிக்கிறது. நவீனத் தமிழில் ‘மனம்’ இதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וְרָדַף אַחֲרֵיהֶם
  choice: அவன் அவர்களைத் துரத்திச் செல்வான்
  rationale: רדף + אחרי என்பது ஒருவரைப் பின்தொடர்ந்து துரத்துவதைக் குறிக்கிறது; இராணுவப் பின்துரத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְאִכָּבְדָה בְּפַרְעֹה
  choice: பார்வோனின் மீதும் ... நான் மகிமை பெறுவேன்
  rationale: כבד என்பதன் இவ்வடிவம் பார்வோன் தொடர்பாக நிகழப்போகும் தீர்ப்பின் மூலம் யாவே தமது மகிமையை வெளிப்படுத்தி கனம் பெறுவதைச் சொல்கிறது. בְּ-இன் உறவைத் தீர்ப்பின் சூழலில் ‘மீதும்’ எனத் தக்கவைத்து, மகிமை பெறுதல் என்ற கருத்தை வெளிப்படுத்துகிறது.
- source_word: וּבְכָל חֵילוֹ
  choice: அவனுடைய படை முழுவதின் மீதும்
  rationale: חַיִל இங்கு பார்வோனின் இராணுவப் படையைக் குறிக்கிறது; ‘படை முழுவதும்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: וְיָדְעוּ מִצְרַיִם
  choice: எகிப்தியர்கள் அறிந்துகொள்வார்கள்
  rationale: மூலத்தில் ‘எகிப்து’ என்பதுடன் பன்மை வினை இருப்பதால், நாட்டின் மக்களைக் குறிக்கும் ‘எகிப்தியர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்த வடிவில் தருகிறது.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: அவர்கள் அப்படியே செய்தார்கள்
  rationale: முந்தைய கட்டளைக்கு அவர்கள் கீழ்ப்படிந்ததைச் சுருக்கமாகக் கூறும் இயல்பான கதைநடை முடிவு.
theological_decisions:
- issue: பார்வோனின் மனம் கடினப்படுவதில் தேவனுடைய செயல்
  choice: ‘நான் ... கடினப்படுத்துவேன்’ என்று நேரடியான காரணச் செயலாக மொழிபெயர்த்தல்
  alternative: ‘பார்வோனின் மனம் கடினப்படும்படி விடுவேன்’ அல்லது ‘மனத்தை உறுதியாக்குவேன்’
  rationale: முதல் நபர் ஹிப்ஈல் வினை யாவேயைச் செய்பவராக நேரடியாகக் காட்டுகிறது. அதை வெறும் அனுமதியாக மாற்றுவது மூலத்தில் இல்லாத இறையியல் தணிப்பைச் சேர்க்கும்; அதேவேளையில் அடிப்படைச் சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: தீர்ப்பின் சூழலில் כבד மற்றும் בְּ என்பவற்றின் பொருள்
  choice: ‘பார்வோனின் மீதும் ... நான் மகிமை பெறுவேன்’
  alternative: ‘பார்வோன் மூலமாக ... நான் மகிமைப்படுவேன்’
  rationale: வரவிருக்கும் நிகழ்வுகளில் பார்வோனையும் அவனுடைய படையையும் மேற்கொண்டு யாவேயின் மகிமை வெளிப்படுவதை இவ்வாசகம் கூறுகிறது. ‘மீதும்’ என்பது தீர்ப்பு மற்றும் வெற்றியின் எதிர்நிலைத் தொனியைப் பாதுகாக்கிறது; ‘மூலமாக’ என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மனம்’, ‘துரத்திச் செல்வான்’, ‘படை முழுவதும்’ போன்ற இயல்பான சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன; மூலத்தின் தெய்வீகக் காரணச் செயலும் மகிமை–தீர்ப்பு தொடர்பிலுள்ள பதற்றமும் தணிக்கப்படவில்லை. தேவனுடைய தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
