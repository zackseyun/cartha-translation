base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/008.yaml
  text: And Yahweh hardened the heart of Pharaoh king of Egypt[a], and he pursued the sons of Israel[b], while the sons of Israel were going out with a high hand.
translation:
  language: ta
  text: ஆண்டவர் எகிப்தின் அரசனான பார்வோனின் இதயத்தைக் கடினப்படுத்தினார்[a]; அவன் இஸ்ரவேல் மக்களைத் துரத்திச் சென்றான். இஸ்ரவேல் மக்கள் உயர்த்தப்பட்ட கையுடன்[b] புறப்பட்டுச் சென்றுகொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பார்வோனின் இதயத்தை உறுதிப்படுத்தினார்.” எபிரெய வினைச்சொல் அடிப்படையில் “வலிமையாக்கினார்” அல்லது “உறுதியாக்கினார்” என்று பொருள்படும்; ஆனால் யாத்திராகமத்தில் பார்வோனின் இதயத்தைக் குறிக்கும் இச்சொற்றொடர் பொதுவாக “கடினப்படுத்தினார்” என்ற பொருளில் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “துணிவுடன்.” எபிரெய மரபுத்தொடரின் சொற்பொருள் “உயர்த்தப்பட்ட கையுடன்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: யாவே
  rationale: எபிரெய உரையில் வரும் இறைபெயரைப் பட்டப்பெயராக மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: וַיְחַזֵּק
  choice: கடினப்படுத்தினார்
  rationale: חזק என்பதன் அடிப்படைப் பொருள் ‘வலுப்படுத்துதல்/உறுதியாக்குதல்’ என்றாலும், பார்வோனின் இதயத்தோடு மீண்டும் மீண்டும் வரும் இச்சொற்றொடர் அவனுடைய எதிர்ப்பான மனவுறுதி கடினமானதைக் குறிக்கிறது.
- source_word: לֵב
  choice: இதயம்
  rationale: இங்கு மனவுறுதியையும் உள்ளார்ந்த மனநிலையையும் குறிக்கும் எபிரெய உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: எகிப்தின் அரசனான பார்வோன்
  rationale: எபிரெய தொடரின் பொருளைத் தெளிவாகவும் இயல்பான தமிழ் சொல்லமைப்பிலும் தருகிறது.
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: துரத்திச் சென்றான்
  rationale: பகைமை கொண்ட பின்தொடர்தலையும் தொடர்ச்சியான நகர்வையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: இங்கு בני ישראל என்பது யாக்கோபின் நேரடி மகன்களை மட்டும் அல்லாமல் இஸ்ரவேல் சமூகத்தையே குறிக்கிறது; ‘இஸ்ரவேல் மக்கள்’ என்பது நவீன தமிழில் இயல்பான கூட்டுப்பெயர். வசனத்தில் இருமுறை வரும் தொடரும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: יֹצְאִים
  choice: புறப்பட்டுச் சென்றுகொண்டிருந்தார்கள்
  rationale: எபிரெய பங்கேற்புவினையின் தொடர்நிலைப் பொருளை வெளிப்படுத்தி, பார்வோன் துரத்தியபோது அவர்களுடைய புறப்பாடு நடந்துகொண்டிருந்தது என்பதைத் தெளிவாக்குகிறது.
- source_word: בְּיָד רָמָה
  choice: ஓங்கிய கையுடன்
  rationale: ‘உயர்ந்த/உயர்த்தப்பட்ட கையுடன்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, தமிழில் புரியக்கூடிய வடிவில் வழங்குகிறது.
theological_decisions:
- issue: பார்வோனின் இதயம் கடினமானதில் இறைவனுடைய செயல்
  choice: யாவே ... பார்வோனின் இதயத்தைக் கடினப்படுத்தினார்
  alternative: யாவே ... பார்வோனின் இதயத்தை உறுதிப்படுத்தினார்
  rationale: எபிரெய உரை இச்செயலை யாவேக்கு நேரடியாகக் கூறுகிறது. அந்த இறையியல் பதற்றத்தை மென்மைப்படுத்தாமல் முதன்மை உரையில் தக்கவைத்து, வினைச்சொல்லின் வேறு சாத்தியமான பொருளை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இஸ்ரவேல் மக்கள்’ என்ற தொடர் இயல்புக்காகத் தேர்ந்தெடுக்கப்பட்டாலும், மூலத்தில் அது இருமுறை வருவதால் அந்த மறுபதிப்பு தக்கவைக்கப்பட்டுள்ளது. ‘ஓங்கிய கையுடன்’ என்ற உருவகம் விளக்கமாக மாற்றப்படாமல் முதன்மை உரையில் வைக்கப்பட்டு, அதன் கருத்துப்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
