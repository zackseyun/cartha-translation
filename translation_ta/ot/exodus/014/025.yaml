base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/025.yaml
  text: And he removed the wheels from his chariots, and drove them with difficulty. And Egypt said, “Let me flee from before Israel, for the LORD is fighting for them against Egypt.”
translation:
  language: ta
  text: அவர் எகிப்தின் தேர்களின் சக்கரங்களை அகற்றினார்; எகிப்தின் தேர்கள் சிரமத்துடன் செல்லும்படி செய்தார். அப்போது எகிப்து, “இஸ்ரவேலரிடமிருந்து நான் தப்பியோடுவேன்; ஏனெனில் யாவே அவர்களுக்காக எகிப்துக்கு எதிராகப் போரிடுகிறார்” என்றது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסַר
  choice: கழற்றி
  rationale: இங்கு סור என்பதன் causative வடிவம் சக்கரங்களை அகற்றுதல் அல்லது கழற்றுதல் என்ற பொருளைத் தருகிறது; சூழலில் தேர்களின் இயக்கம் பாதிக்கப்படுவதை இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֹפַן מַרְכְּבֹתָיו
  choice: எகிப்தின் தேர்களிலிருந்த சக்கரங்களை
  rationale: எபிரேயத்தில் ‘சக்கரம்’ இலக்கணப்படி ஒருமையிலும், ‘அவனுடைய தேர்கள்’ என்ற ஆண்பால் ஒருமைச் சுட்டும் கூட்டுப்பொருளான எகிப்தைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்கப் பன்மையும் ‘எகிப்தின்’ என்பதும் பயன்படுத்தப்பட்டன.
- source_word: בִּכְבֵדֻת
  choice: சிரமத்துடன்
  rationale: ‘கனத்துடன்’ என்ற சொற்பொருள் இச்சூழலில் தேர்கள் நகர்வதில் ஏற்பட்ட கடுமையான சிரமத்தைக் குறிக்கிறது.
- source_word: אָנ֨וּסָה
  choice: நான் தப்பியோடுவேன்
  rationale: முதல் நபர் ஒருமை வடிவம் அப்படியே பாதுகாக்கப்பட்டது; பேசுவது கூட்டுப்பொருளாக ஒருமையில் குறிப்பிடப்படும் ‘எகிப்து’.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரின் தனிப்பெயர் தன்மையை மறைக்காமல், எபிரேய நான்கு எழுத்துப் பெயருக்கான பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிப்பைத் தமிழில் தருகிறது.
theological_decisions:
- issue: வினைச்சொற்களின் மறைமுக எழுவாய்
  choice: ‘அவர்’ என்று இறைவனைக் குறித்தல்
  alternative: எழுவாயை வெளிப்படையாக ‘யாவே’ என்று சேர்த்தல்
  rationale: முந்தைய வசனச் சூழல் செய்பவர் யாவே என்பதைத் தெளிவாக்குகிறது; ஆயினும் இவ்வசனத்தின் எபிரேய உரையில் பெயர் முதலில் வெளிப்படையாக வராததால், பெயரை முன்கூட்டியே சேர்க்காமல் ஆண்பால் ஒருமைப் பிரதிப்பெயர் வைக்கப்பட்டது.
- issue: ‘எகிப்து’ மற்றும் ஒருமை முதல் நபர் பேச்சு
  choice: கூட்டுப்பொருளான எகிப்தை ஒருமையாகப் பேணுதல்
  alternative: ‘எகிப்தியர்கள், நாம் தப்பியோடுவோம்’ என்று இயல்பாக்குதல்
  rationale: מִצְרַיִם உடன் வரும் אָנ֨וּסָה முதல் நபர் ஒருமையின் குறிப்பிடத்தக்க இலக்கணத் தன்மையையும் கூட்டுப் பிரதிநிதித்துவத்தையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரேயத்தின் கூட்டுப்பொருள் ஒருமையை ‘எகிப்து… நான்’ என்ற வடிவில் திட்டமிட்டு வைத்திருக்கிறது; தேர்களின் இயக்கத்தைச் சொல்லும்போது மட்டும் தமிழின் இயல்புக்கேற்ப பன்மை பயன்படுத்தப்பட்டுள்ளது.
