  source_fidelity: முதல் வாக்கியத்தின் இரண்டாம் வினைப்பகுதி எபிரேயத்தின் நேரடி பொருளைச் சுட்டுகிறது; வரைவு உரையில் ‘அவற்றை’ என்பது உடனடியாக முன்வரும் ‘சக்கரங்கள்’ என்பதையே குறிக்கக்கூடியதாகி, சக்கரங்களையே செல்லச் செய்தார் என்ற பொருளைத் தருகிறது. தேர்களின் நகர்வு கடினமானது என்பதைக் குறிப்பு தெளிவாகச் சொல்லப்பட வேண்டும். ‘எகிப்து… நான் தப்பியோடுவேன்’ என்பது மூலத்தின் கூட்டுப்பொருள்-ஒருமை அமைப்பையும் முதல் நபர் ஒருமைக் கூட்டுவினை நயத்தையும் பாதுகாக்கிறது.
