base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/031.yaml
  text: Israel saw the great hand that Yahweh had done against Egypt[a], and the people feared Yahweh[b], and they believed in Yahweh and in Moses his servant.
translation:
  language: ta
  text: யெகோவா எகிப்துக்கு எதிராக வெளிப்படுத்திய அந்த மகத்தான கைவல்லமையை இஸ்ரவேல் கண்டது[a]. மக்கள் யெகோவாவுக்குப் பயந்து, யெகோவாவையும் அவருடைய ஊழியனாகிய மோசேயையும் நம்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எழுத்துப்படி, “அந்த மகத்தான கை.” “மகத்தான கை” என்பது இங்கே வல்லமையைக் குறிக்கும் உருவகம். “மகத்தான வல்லமை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא יִשְׂרָאֵל
  choice: இஸ்ரவேல் ... கண்டது
  rationale: எபிரெயச் சொல்லின் நேரடியான உணர்தலைக் குறிக்கும் பொருளையும், ‘இஸ்ரவேல்’ என்ற ஒருமைத் தொகுப்புப் பெயரையும் பாதுகாக்கிறது.
- source_word: הַיָּד הַגְּדֹלָה
  choice: அந்த மகத்தான கையின் செயல்
  rationale: ‘மகத்தான கை’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்தபடி, ‘கையைச் செய்தார்’ என்ற இயல்பற்ற தமிழைத் தவிர்த்து, சூழலில் அது குறிக்கும் வல்லமைமிக்க செயலைத் தெளிவாக்குகிறது.
- source_word: אֲשֶׁר עָשָׂה יְהוָה בְּמִצְרַיִם
  choice: யெகோவா எகிப்துக்கு எதிராகச் செய்த
  rationale: עָשָׂה என்பதன் ‘செய்த’ என்ற பொருளைப் பாதுகாக்கிறது; בְ இங்கு எகிப்துக்கு எதிரான தண்டனைச் செயலைக் குறிக்கிறது. இதன் மாற்று வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருப்பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், நவீனத் தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் வழங்குகிறது.
- source_word: וַיִּירְאוּ הָעָם אֶת יְהוָה
  choice: மக்கள் யெகோவாவுக்குப் பயந்து
  rationale: ירא என்பதன் அடிப்படைப் பொருளான பயத்தைத் தக்கவைக்கிறது; சூழலில் உள்ள வியப்பும் பயபக்தியும் மறுக்கப்படவில்லை.
- source_word: וַיַּאֲמִינוּ בַיהוָה וּבְמֹשֶׁה
  choice: யெகோவாவிடமும் ... மோசேயிடமும் நம்பிக்கை வைத்தார்கள்
  rationale: אמן + בְ குறிக்கும் நம்பிக்கை அல்லது சார்ந்திருத்தலை இயல்பான தமிழில் தெரிவிக்கிறது; இரு பெயர்களுடனும் ஒரே இலக்கண அமைப்பைப் பேணுகிறது.
- source_word: עַבְדּוֹ
  choice: அவருடைய பணியாளனாகிய
  rationale: மோசே யெகோவாவுக்குக் கீழ்ப்பட்ட சேவகர் என்பதைத் தெளிவாக்குகிறது; ‘அடிமை’ என்று மட்டும் மொழிபெயர்த்தால் தமிழில் ஏற்படக்கூடிய தவறான சமூகப் பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: மோசேயிடம் மக்கள் வைத்த நம்பிக்கையின் தன்மை
  choice: யெகோவாவிடமும் அவருடைய பணியாளனாகிய மோசேயிடமும் மக்கள் நம்பிக்கை வைத்தார்கள்.
  alternative: மக்கள் யெகோவாவை நம்பியதோடு, மோசேயையும் தனிப்பட்ட முறையில் நம்பினார்கள்.
  rationale: எபிரெயத்தில் யெகோவாவுக்கும் மோசேக்கும் אמן + בְ என்ற ஒரே அமைப்பு வந்தாலும், ‘அவருடைய பணியாளன்’ என்பது மோசேயின் கீழ்ப்பட்ட, நியமிக்கப்பட்ட நிலையைப் பாதுகாக்கிறது; இருவரும் சமமானவர்கள் என்று உரை கூறுவதாக மாற்றவில்லை.
- issue: יְהוָה என்ற திருப்பெயரின் தமிழாக்கம்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: பெயரைப் பட்டமாக மாற்றாமல் தனிப்பட்ட திருப்பெயராக வழங்குகிறது. தமிழில் பரவலாக அடையாளம் காணப்படும் வடிவம் தேர்ந்தெடுக்கப்பட்டது; மூல உச்சரிப்பின் துல்லியம் குறித்த விவாதத்தை உரை தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் ‘கை’ உருவகம் அடிக்குறிப்புடன் தக்கவைக்கப்பட்டுள்ளது; தொடர் இணைப்புகள் தமிழின் இயல்புக்கேற்ப சற்றுச் செம்மைப்படுத்தப்பட்டுள்ளன.
