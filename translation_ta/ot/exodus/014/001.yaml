lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... பேசினார்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுத்துச் செல்கிறது; எனவே ‘பின்பு’ அதன் தொடர்ச்சியைக் காட்டுகிறது. דּבר என்ற வினையின் முறையான இறைப் பேச்சுத் தன்மையை ‘பேசினார்’ வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பொதுப்பட்டமாக மாற்றாமல், உடன்படிக்கைப் பெயராக ஒலிபெயர்க்கிறது.
- source_word: אֶל
  choice: -யிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழில் நிலைபெற்றுள்ள வேதாகமப் பெயர் வடிவம்.
- source_word: לֵאמֹר
  choice: சொன்னார்
  rationale: அடுத்து வரும் நேரடிப் பேச்சை அறிமுகப்படுத்தும் எபிரேயச் சொல்லமைப்பை இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் வரும் நான்கு மெய்யெழுத்துகளாலான தனிப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது; உச்சரிப்பு குறித்த மரபுவேறுபாட்டை அடிக்குறிப்பு சுட்டுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, எளிதில் புரியும் தமிழ். ‘பேசிச் சொன்னார்’ என்பது דּבר ... לֵאמֹר என்ற முறையான எபிரேய அறிமுகச் சூத்திரத்தை இயல்பாகப் பிரதிபலிக்கிறது; அடுத்த வசனத்தில் வரும் உரையை அறிமுகப்படுத்த முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
