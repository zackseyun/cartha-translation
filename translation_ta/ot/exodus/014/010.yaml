  text: וּ/פַרְעֹ֖ה הִקְרִ֑יב וַ/יִּשְׂאוּ֩ בְנֵֽי יִשְׂרָאֵ֨ל אֶת עֵינֵי/הֶ֜ם וְ/הִנֵּ֥ה מִצְרַ֣יִם נֹסֵ֣עַ אַחֲרֵי/הֶ֗ם וַ/יִּֽירְאוּ֙ מְאֹ֔ד וַ/יִּצְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָֽה־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/010.yaml
  text: As Pharaoh drew near[a], the sons of Israel lifted up their eyes, and behold, the Egyptians were marching after them; and they were very afraid[b], and the sons of Israel cried out to Yahweh.
translation:
  language: ta
  text: பார்வோன் நெருங்கியபோது, இஸ்ரவேலின் மகன்கள் தங்கள் கண்களை ஏறெடுத்துப் பார்த்தார்கள். இதோ, எகிப்தியப் படை அவர்களுக்குப் பின்னால் அணிவகுத்து வந்துகொண்டிருந்தது[a]. அவர்கள் மிகவும் பயந்தார்கள்; இஸ்ரவேலின் மகன்கள்[b] யாவேவை நோக்கிக் கூக்குரலிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘எகிப்து’; இங்கு அந்த ஒருமைப் பெயர், அவர்களைப் பின்தொடர்ந்த எகிப்தியப் படையை மொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இஸ்ரவேலர்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְרִיב
  choice: நெருங்கியபோது
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் இங்கு பார்வோனை எழுவாயாகக் கொண்டு, பிறரை நெருங்கச் செய்தான் என்பதற்குப் பதிலாக அவனே நெருங்கினான் என்ற அகப்பொருளில் வருகிறது.
- source_word: וַיִּשְׂאוּ ... אֶת עֵינֵיהֶם
  choice: தங்கள் கண்களை ஏறெடுத்துப் பார்த்தார்கள்
  rationale: பார்ப்பதற்காகக் கண்களை உயர்த்துதல் என்ற எபிரெய மொழிவழக்கின் உருவகத் தன்மையையும், இயல்பான தமிழையும் ஒருங்கே காக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீரெனக் கண்ணில் பட்ட காட்சியையும் கதைநிகழ்வின் வியப்பூட்டும் உடனடித் தன்மையையும் வெளிப்படுத்துகிறது.
- source_word: מִצְרַיִם
  choice: எகிப்தியப் படை
  rationale: மூலத்தில் ‘எகிப்து’ என்ற ஒருமைப் பெயர் வந்தாலும், சூழலில் அது பின்தொடரும் எகிப்தியப் படையை மொத்தமாகக் குறிக்கிறது; தமிழில் நிலப்பகுதியே நகர்வதாகத் தோன்றாமல் பொருளைத் தெளிவாக்குகிறது.
- source_word: נֹסֵעַ אַחֲרֵיהֶם
  choice: அவர்களுக்குப் பின்னால் அணிவகுத்து வந்துகொண்டிருந்தது
  rationale: נסע என்பதன் நகர்ந்து செல்லுதல் அல்லது புறப்படுதல் என்ற அடிப்படைப் பொருளையும், இங்குள்ள படைநகர்வுச் சூழலையும் காக்கிறது; ‘துரத்தியது’ என்று முடிவை முன்வைத்து மிகையாக விளக்கவில்லை.
- source_word: וַיִּירְאוּ מְאֹד
  choice: அவர்கள் மிகவும் பயந்தார்கள்
  rationale: வினையுடன் வரும் מְאֹד என்பதன் வலியுறுத்தலை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וַיִּצְעֲקוּ
  choice: கதறினார்கள்
  rationale: அச்சத்திலும் நெருக்கடியிலும் எழுப்பப்பட்ட தீவிரமான கூக்குரலை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், நான்கெழுத்துத் திருப்பெயரின் பரவலான ‘Yahweh’ ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: மூலத்தின் ஆண்பால் சார்ந்த, தேசியக் குழுவைக் குறிக்கும் சொற்றொடரைப் பொதுவான ‘இஸ்ரவேலர்’ என்று முற்றிலும் சமப்படுத்தாமல் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே பட்டப்பெயரால் மாற்றாமலும், ‘Jehovah’ மரபு வடிவத்தை ஏற்காமலும் ‘Yahweh’ என்பதற்குரிய தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- issue: בְנֵי יִשְׂרָאֵל என்ற ஆண்பால் கூட்டுப்பெயர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: இது இலக்கண ரீதியாக ஆண்பாலில் அமைந்த தேசிய அல்லது உடன்படிக்கைச் சமூகப் பெயர். மூலவடிவம் முதன்மை உரையில் காக்கப்பட்டு, இயல்பான கூட்டுப்பெயர் அடிக்குறிப்பில் தரப்பட்டது.
translation_notes:
  register: நவீனச் செந்தமிழின் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பது காட்சியின் திடீர் திருப்பத்தையும், ‘கண்களை ஏறெடுத்துப் பார்த்தார்கள்’ என்பது எபிரெய மொழிவழக்கின் சுவையையும் காக்கின்றன. மிகப் பழமையான அல்லது பிரிவுசார் சமயச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
