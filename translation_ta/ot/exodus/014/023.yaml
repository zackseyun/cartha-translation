base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/023.yaml
  text: The Egyptians pursued and went in after them into the midst of the sea—all Pharaoh’s horses[a], his chariots[b], and his horsemen.
translation:
  language: ta
  text: எகிப்தியர்கள் அவர்களைத் துரத்தி, அவர்களுக்குப் பின்னால் கடலின் நடுப்பகுதிக்குள் நுழைந்தார்கள்—பார்வோனுடைய குதிரைகள் அனைத்தும்[a], அவனுடைய தேர்களும் குதிரைவீரர்களும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘பார்வோனுடைய குதிரை அனைத்தும், அவனுடைய தேர்களும் குதிரைவீரர்களும்’ எனக் கூட்டுப்பொருள் தரும் ஒருமை வடிவம் உள்ளது; இயல்பான தமிழில் அது ‘பார்வோனுடைய குதிரைகள் அனைத்தும்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ
  choice: துரத்திக்கொண்டு
  rationale: רדף என்பது இங்கு படை சார்ந்த பின்தொடர்தலைக் குறிக்கிறது; அடுத்த செயலைத் தொடர்ச்சியாக இணைக்கத் தமிழ் வினையெச்சம் இயல்பாக உள்ளது.
- source_word: מִצְרַיִם
  choice: எகிப்தியர்கள்
  rationale: பன்மை வினைகளும் கதையின் சூழலும் நாட்டை அல்ல, எகிப்தியப் படையினரைக் குறிக்கின்றன.
- source_word: וַיָּבֹאוּ אַחֲרֵיהֶם
  choice: அவர்களுக்குப் பின்னால் ... நுழைந்தார்கள்
  rationale: בוא என்ற பரந்த இயக்க வினை, கடலின் உட்பகுதிக்குள் செல்வதை இச்சூழலில் குறிக்கிறது; אחרי நிலை மற்றும் பின்தொடர்தல் ஆகிய இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: כֹּל סוּס פַּרְעֹה
  choice: பார்வோனுடைய குதிரைகள் அனைத்தும்
  rationale: כֹּל என்பதற்குப் பின் வரும் ஒருமை סוּס கூட்டுப்பொருளில் உள்ளது; இயல்பான தமிழில் பன்மையாகத் தரப்பட்டுள்ளது.
- source_word: רִכְבּוֹ
  choice: அவனுடைய தேர்கள்
  rationale: רכב இங்கு தனித் தேரையோ தேர்ப்படையையோ கூட்டாகக் குறிக்கலாம்; பட்டியலின் concrete உருவத்தைப் பேண 'தேர்கள்' தேர்ந்தெடுக்கப்பட்டது.
- source_word: וּפָרָשָׁיו
  choice: தேரோட்டிகள்
  rationale: பண்டைய எகிப்திய இராணுவச் சூழலிலும் இப்பட்டியலில் தேர்களுடன் இணைந்த பயன்பாட்டிலும் פָרָשָׁיו தேரில் போரிட்டவர்களை/தேரோட்டிகளைச் சுட்டலாம்; தமிழில் தவறாக தனித்த குதிரைப்படை எனப் புரியாமல் இருக்க இச்சொல் பயன்படுத்தப்பட்டது.
- source_word: אֶל תּוֹךְ הַיָּם
  choice: கடலின் நடுப்பகுதிக்குள்
  rationale: תּוֹךְ கடலுக்குள் நுழைவதை மட்டும் அல்லாமல் அதன் உட்பகுதியை வலியுறுத்துகிறது.
