translation_notes:
  register: நவீன பொதுத்தமிழில், உரையின் படை சார்ந்த இயக்கத்தையும் கடலின் உட்பகுதிக்குள் நுழைந்ததையும் தெளிவாக வெளிப்படுத்தும் கண்ணியமான நடை. மூலத்தில் பட்டியல் வாக்கியத்துடன் சுருக்கமாக இணைந்துள்ளதால், தமிழில் எழுவாய் தெளிவுக்காக இறுதியில் ‘அவர்களோடு நுழைந்தார்கள்’ என நிரப்பப்பட்டுள்ளது.
