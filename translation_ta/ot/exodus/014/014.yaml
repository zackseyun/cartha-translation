source:
  edition: WLC
  text: יְהוָ֖ה יִלָּחֵ֣ם לָ/כֶ֑ם וְ/אַתֶּ֖ם תַּחֲרִישֽׁוּ/ן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/014.yaml
  text: Yahweh will fight for you[a], and you must be silent.
translation:
  language: ta
  text: யாவே உங்களுக்காகப் போரிடுவார்; நீங்களோ மௌனமாக இருக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் மௌனமாக இருப்பீர்கள்,” “மௌனமாக இருங்கள்.”
    reason: תַּחֲרִישׁוּן என்ற முற்றுப்பெறா வினைவடிவம் இச்சூழலில் எதிர்கால அறிவிப்பாகவோ அறிவுறுத்தலாகவோ புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலருக்கு வெளிப்படுத்தப்பட்ட இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: יִלָּחֵם
  choice: போரிடுவார்
  rationale: לחם என்பதன் நிஃபால் முற்றுப்பெறா வடிவம் இங்கு எதிர்காலச் செயலைக் குறிக்கிறது; யாவே இஸ்ரவேலரின் சார்பாகப் போரில் ஈடுபடுவார் என்ற இராணுவப் பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: לָכֶם
  choice: உங்களுக்காக
  rationale: ל முன்னிடைச்சொல் இரண்டாம் நபர் ஆண்பால் பன்மை விகுதியுடன், அவர்களுக்குச் சாதகமாக அல்லது அவர்கள் சார்பாகச் செய்யப்படும் செயலைக் குறிக்கிறது.
- source_word: וְאַתֶּם
  choice: நீங்களோ
  rationale: இணைப்புச்சொல்லும் தனித்த சுட்டுப்பெயரும் யாவேயின் செயலுக்கும் மக்களின் நிலைக்கும் இடையிலான எதிர்மறை ஒப்புமையை வலியுறுத்துகின்றன; தமிழ் ‘-ஓ’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תַּחֲרִישׁוּן
  choice: அமைதியாக இருக்க வேண்டும்
  rationale: חרשׁ என்பதன் ஹிஃபில் முற்றுப்பெறா வடிவம் ‘அமைதியாக இருத்தல்/மௌனமாக இருத்தல்’ என்று பொருள்படும். மோசேயின் உறுதியளிக்கும் அறிவுறுத்தலில் இதற்கு கட்டளையுணர்வு இருக்கலாம்; அதேவேளையில் வடிவத்தின் எதிர்கால அல்லது அறிவிப்பு நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூல வசனம் நான்கெழுத்து இறைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் தனிப்பட்ட உடன்படிக்கைப் பெயராகப் பாதுகாக்க ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- issue: תַּחֲרִישׁוּן என்பதன் வாக்கிய வலிமை
  choice: அமைதியாக இருக்க வேண்டும்
  alternative: அமைதியாக இருப்பீர்கள்; அமைதியாக இருங்கள்
  rationale: எபிரெய வடிவம் முற்றுப்பெறா வினையாக இருந்தாலும், சூழலில் அறிவுறுத்தும் வலிமை பெறக்கூடும். முதன்மை உரை அந்த வலிமையைத் தருகிறது; இலக்கண ரீதியான எதிர்கால வாசிப்பு அடிக்குறிப்பில் விடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘நீங்களோ’ என்பது மூலத்திலுள்ள வலியுறுத்தப்பட்ட சுட்டுப்பெயரையும் யாவேயின் செயலுடன் உள்ள மாறுபாட்டையும் சுருக்கமாகக் காட்டுகிறது.
