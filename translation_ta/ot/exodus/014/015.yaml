  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מַה תִּצְעַ֖ק אֵלָ֑/י דַּבֵּ֥ר אֶל בְּנֵי יִשְׂרָאֵ֖ל וְ/יִסָּֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/015.yaml
  text: Then Yahweh said to Moses[b][a], “Why are you crying out to me? Tell the sons of Israel to set out.”
translation:
  language: ta
  text: அப்போது யாவே மோசேயிடம், “நீ ஏன் என்னிடம் கூக்குரலிடுகிறாய்? இஸ்ரவேல் மக்களிடம்[a] புறப்பட்டுச் செல்லும்படி[b] சொல்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முன்னேறிச் செல்லும்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுப்பதால், நவீன தமிழில் இயல்பான கதைத் தொடர்ச்சியைத் தருகிறது.
- source_word: מַה תִּצְעַק אֵלָי
  choice: நீ ஏன் என்னை நோக்கிக் கதறுகிறாய்?
  rationale: מַה உடன் வரும் இவ்வினைச்சொல் கேள்வியின் ‘ஏன்’ என்ற கண்டிப்புத் தொனியையும், צעק என்பதன் துயரமிகு கூக்குரல் உணர்வையும் காக்கிறது.
- source_word: דַּבֵּר אֶל
  choice: '...ிடம் ... சொல்'
  rationale: சொல்லும்படியான நேரடிக் கட்டளையை இயல்பான தமிழில் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கட்டளையிடு’ என்ற வலிமையைச் சேர்க்கவில்லை.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்பதைக் காட்டிலும், முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கும் எபிரேய மரபுத்தொடரை நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְיִסָּעוּ
  choice: புறப்பட்டுச் செல்லும்படி
  rationale: נסע என்பதன் பயணத்தைத் தொடங்குதல் அல்லது இடத்திலிருந்து கிளம்புதல் என்ற பொருளைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் காக்கிறது; ‘யெகோவா’ என்பதைவிட எபிரேயப் பெயரின் ஏற்றுக்கொள்ளப்பட்ட மறுவடிவ ஒலிப்புக்கு நெருக்கமாக உள்ளது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் குழுக்குறிப்பு
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இங்கு ஆண்களை மட்டும் குறிக்காமல் இஸ்ரவேல் சமூகத்தைக் குறிக்கும் நிலையான எபிரேய மரபுத்தொடர் என்பதால், தமிழில் பொருளைத் தவறாகக் குறுக்காமல் ‘மக்கள்’ என வழங்கப்படுகிறது; சொற்சார்ந்த மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. இறைவனுக்கான மரியாதைப் பன்மை வினைமுற்று பயன்படுத்தப்பட்டாலும், மோசேயை நோக்கிய ஒருமை இரண்டாம் நபர் மூலத்திற்கேற்ப காக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் தொடர்புடைய சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
