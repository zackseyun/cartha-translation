  naturalness: ‘என்னிடம்’ என்பது ‘என்னை நோக்கி’யைவிட இவ்வகை வினாவுக்கு இயல்பான நவீனத் தமிழ். ‘இஸ்ரவேல் மக்களிடம்’ என்பதும் தேவையற்ற உடைமைத் தொடரில்லாமல் இயல்பாக ஒலிக்கிறது. மரியாதை வினைமுற்றான ‘என்றார்’ மற்றும் மோசேயிடம் ஒருமையாக வரும் ‘நீ’ ஆகியவை பொருத்தமானவை.
