base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/006.yaml
  text: Behold[a], I will stand before you there on the rock at Horeb, and you shall strike the rock, and water will come out from it, and the people will drink. And Moses did so in the sight of the elders of Israel.
translation:
  language: ta
  text: “இதோ[a], நான் அங்கே ஓரேபில் அந்தப் பாறையின்மேல் உனக்கு முன்பாக நிற்பேன். நீ அந்தப் பாறையை அடி; அதிலிருந்து தண்ணீர் வெளியே வரும், மக்கள் குடிப்பார்கள்.” இஸ்ரயேலின் மூப்பர்களின் கண் முன்னே மோசே அவ்வாறே செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதோ, நான் அங்கே ஓரேபில் அந்தப் பாறையின்மேல் உனக்கு முன்பாக நின்றுகொண்டிருக்கிறேன்.” எபிரெய மொழியிலுள்ள வினைவடிவத்தை நிகழ்காலமாகவும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் இறைவனின் சிறப்பான அறிவிப்பை இயல்பாகவும் உயர்ந்த நடையிலும் வெளிப்படுத்துகிறது.
- source_word: עֹמֵד
  choice: நிற்பேன்
  rationale: இது வடிவத்தில் பங்கேற்புவினையாக இருந்தாலும், அறிவுறுத்தல்களின் தொடரில் விரைவில் நிகழவிருக்கும் இறைச்செயலைக் குறிப்பதால் எதிர்கால வடிவம் முதன்மை உரையில் இயல்பாக உள்ளது; நிகழ்கால வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לְפָנֶיךָ
  choice: உனக்கு முன்பாக
  rationale: மோசேயின் முன்னிலையில் இறைவன் நிற்பதைக் குறிக்கும் இடச்சார்ந்த பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: הַצּוּר
  choice: அந்தப் பாறை
  rationale: צוּר குறிக்கும் பெரிய பாறை அல்லது பாறைத்திரளை இயல்பாகத் தருகிறது; வசனத்தில் சொல்லின் மறுபயன்பாடும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בְּחֹרֵב
  choice: ஓரேபில்
  rationale: இடப்பெயருடன் தமிழில் இயல்பான இடவேற்றுமையைப் பயன்படுத்துகிறது.
- source_word: וְהִכִּיתָ
  choice: நீ அந்தப் பாறையை அடி
  rationale: அறிவுறுத்தல் சூழலில் உள்ள கட்டளையின் வலிமையை நேரடியான தமிழ் கட்டளை வடிவம் காக்கிறது.
- source_word: וְיָצְאוּ מִמֶּנּוּ מַיִם
  choice: அதிலிருந்து தண்ணீர் வெளியே வரும்
  rationale: ‘வெளியே வருதல்’ என்ற மூல வினையின் பொதுவான பொருளைக் காக்கிறது; ‘பாயும்’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத காட்சியைச் சேர்ப்பதில்லை.
- source_word: וְשָׁתָה הָעָם
  choice: மக்கள் குடிப்பார்கள்
  rationale: பாறையை அடித்தல், தண்ணீர் வெளிவருதல், மக்கள் குடித்தல் என்ற விளைவுத் தொடரை மேலதிக நோக்கவிளக்கம் இன்றிப் பாதுகாக்கிறது.
- source_word: וַיַּעַשׂ כֵּן
  choice: அவ்வாறே செய்தார்
  rationale: எபிரெய சுருக்கக் கூற்றுக்கு இயல்பான, நேரடியான தமிழ் இணை.
- source_word: לְעֵינֵי
  choice: கண் முன்னே
  rationale: இஸ்ரயேலின் மூப்பர்கள் இதைப் பார்த்த சாட்சிகள் என்ற பொதுவெளித் தன்மையைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: இறைவனின் தன்னறிவிப்பிலுள்ள பங்கேற்புவினையின் காலம்
  choice: நான் ... நிற்பேன்
  alternative: நான் ... நின்றுகொண்டிருக்கிறேன்
  rationale: அறிவுறுத்தல் காட்சியின் ஓட்டத்தில் எதிர்கால வடிவம் மோசே எதிர்பார்க்க வேண்டிய உடனடியான இறைச்செயலை இயல்பாகத் தெரிவிக்கிறது. எனினும், எபிரெய வடிவத்தின் உண்மையான நிகழ்காலச் சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- issue: ‘உனக்கு முன்பாக’ என்பதற்கும் பாறைக்கும் இடையிலான தொடர்பு
  choice: இறைவன் ஓரேபிலுள்ள பாறையின்மேல் மோசேக்கு முன்பாக நிற்கிறார்
  alternative: இறைவன் மோசேக்கு முன்பாக, ஓரேபிலுள்ள பாறையின் அருகே நிற்கிறார்
  rationale: ‘அங்கே ஓரேபில் அந்தப் பாறையின்மேல்’ என்ற சொற்றொடர் இறைவன் நிற்பதோடு இயல்பாக இணைகிறது. வியப்பூட்டும் இக்காட்சியை மென்மையாக்காமலும் அதற்கு ஊக விளக்கம் சேர்க்காமலும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், இறைவனின் உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டுள்ளது. ‘இதோ’, நேரடிக் கட்டளை, ‘கண் முன்னே’ ஆகியவை மூலத்தின் கவனஈர்ப்பு, கட்டளை வலிமை, பொதுச் சாட்சி ஆகியவற்றைத் தக்கவைக்கின்றன.
