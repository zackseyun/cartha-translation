base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/012.yaml
  text: But Moses’ hands were heavy[a], so they took a stone and put it under him, and he sat on it. And Aaron and Hur supported his hands, one on this side and one on that side, so his hands remained steady until the sun set.
translation:
  language: ta
  text: ஆனால் மோசேயின் கைகள் கனமாக இருந்தன. ஆகவே அவர்கள் ஒரு கல்லை எடுத்து அவருக்குக் கீழே வைத்தார்கள்; அவர் அதன்மேல் உட்கார்ந்தார். ஆரோனும் ஊரும், ஒருவர் இப்பக்கத்திலும் மற்றவர் அப்பக்கத்திலும் இருந்து, அவருடைய கைகளைத் தாங்கிப்பிடித்தார்கள். அதனால் சூரியன் மறையும் வரை அவருடைய கைகள் நிலையாக[a] இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திடமாக.” இங்குள்ள எபிரெயச் சொல் “நம்பகத்தன்மை” அல்லது “விசுவாசத்தன்மை” என்ற பொருளையும் தரலாம்; ஆனால் இந்தச் சூழலில் அது மோசேயின் கைகள் உடல் ரீதியாக நிலையாக இருந்ததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידֵי / יָדָיו
  choice: கைகள் / அவருடைய கைகள்
  rationale: יָד என்பதன் நேரடியான பன்மை ‘கைகள்.’ சூழலில் முழுக் கரங்களும் உயர்த்தப்பட்டிருந்ததாகப் புரிந்துகொள்ள முடிந்தாலும், மூலத்தின் தொடர்ச்சியான உருவகத்தை இது காக்கிறது.
- source_word: כְּבֵדִים
  choice: கனமாக இருந்தன
  rationale: எபிரெயச் சொல் நேரடியாக ‘கனமான’ என்று பொருள்படும்; இச்சூழலில் சோர்வைக் குறித்தாலும், மூலத்தின் கண்கூடான சொல்லாட்சியைப் பேணுகிறது.
- source_word: וַיִּקְחוּ
  choice: அவர்கள் எடுத்தார்கள்
  rationale: வினைச்சொல் குறிப்பிடப்படாத பன்மை எழுவாயைக் கொண்டுள்ளது. ஆரோன், ஊர் ஆகியோரை எழுவாயாக வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் தெளிவின்மையைப் பேணுகிறது.
- source_word: אֶבֶן
  choice: ஒரு கல்
  rationale: பொதுவான, நேரடியான தமிழ் இணை; அமர்வதற்கான ஆதாரமாகப் பயன்படுத்தப்பட்ட பொருளை இயல்பாகக் குறிக்கிறது.
- source_word: תָּמְכוּ
  choice: தாங்கிப்பிடித்தார்கள்
  rationale: உடல் ரீதியாக ஆதரித்து நிலைநிறுத்திய செயலை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: מִזֶּה אֶחָד וּמִזֶּה אֶחָד
  choice: ஒருவர் இந்தப் பக்கத்திலும் மற்றவர் அந்தப் பக்கத்திலும் இருந்து
  rationale: ஆரோனும் ஊரும் மோசேயின் இரு பக்கங்களிலும் இருந்தனர் என்ற பகிர்ந்தமைப்பை மூலத்திற்கு நெருக்கமாகக் காக்கிறது.
- source_word: וַיְהִי יָדָיו אֱמוּנָה
  choice: அவருடைய கைகள் உறுதியாக இருந்தன
  rationale: אֱמוּנָה என்பதற்கு உறுதி, நிலைத்தன்மை, உண்மைத்தன்மை ஆகிய பொருள் வட்டம் உண்டு. உடல் சோர்வும் ஆதரவும் பேசப்படும் இச்சூழலில் ‘உறுதியாக’ என்பது இயல்பானது; அதேவேளை சொல்லின் பரந்த பொருள் வட்டத்தையும் முற்றிலும் அழிப்பதில்லை.
- source_word: עַד בֹּא הַשָּׁמֶשׁ
  choice: சூரியன் மறையும்வரை
  rationale: ‘சூரியன் வருதல்/செல்லுதல்’ என்ற எபிரெய காலக் கட்டமைப்பின் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: மோசேயின் கைகளைச் சார்ந்த אֱמוּנָה என்பதன் பொருள்
  choice: உடல் ரீதியான உறுதி அல்லது நிலைத்தன்மை
  alternative: உண்மைத்தன்மை அல்லது விசுவாசம்
  rationale: உடனடிச் சூழல் மோசேயின் கைகளின் சோர்வையும் ஆரோன், ஊர் அளித்த உடல் ஆதரவையும் விவரிக்கிறது. ஆகவே பிரதான உரையில் உடல் நிலைத்தன்மையே பொருத்தமானது; எனினும் எபிரெயச் சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரமான தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கைகள் கனமாக இருந்தன’ போன்ற மூலத்தின் கண்கூடான சொல்லாட்சி காக்கப்பட்டுள்ளது; தேவையற்ற சமயவியல் விளக்கம் பிரதான உரையில் சேர்க்கப்படவில்லை.
