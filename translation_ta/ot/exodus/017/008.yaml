  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּבֹ֖א עֲמָלֵ֑ק וַ/יִּלָּ֥חֶם עִם יִשְׂרָאֵ֖ל בִּ/רְפִידִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/008.yaml
  text: Then Amalek came and fought with Israel at Rephidim[a].
translation:
  language: ta
  text: அப்போது அமலேக்கு வந்து, ரெபிதீமில் இஸ்ரவேலோடு போரிட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலுக்கு எதிராகப் போரிட்டான்.” எபிரெய முன்னிடைச்சொல்லின் நேரடிப் பொருள் “உடன்/ஓடு”; போர் சூழலில் அது எதிர்த்துப் போரிடுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: அப்போது ... வந்து
  rationale: வாவ் தொடர் வடிவம் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. நவீன தமிழில் ‘அப்போது’ நிகழ்வுகளின் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது; ‘வந்து’ என்பது בוא என்பதன் எளிய பொருளைப் பேணுகிறது.
- source_word: עֲמָלֵק
  choice: அமலேக்கு
  rationale: எபிரெயப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு. சூழலில் இது அமலேக்கிய மக்களை அவர்களது மூதாதையரின் பெயரால் கூட்டாகக் குறிக்கலாம்; எனினும் மூலத்தின் ஒருமை வடிவம் பேணப்பட்டுள்ளது.
- source_word: וַיִּלָּחֶם
  choice: போரிட்டான்
  rationale: இந்தச் சூழலில் לחם என்பதன் நிபால் வடிவம் ‘போர் செய்’ என்று பொருள்படும். ‘போரிட்டான்’ என்பது நேரடியான, இயல்பான நவீனத் தமிழ் நடை; எழுவாயின் இலக்கண ஒருமையையும் பேணுகிறது.
- source_word: עִם
  choice: இஸ்ரவேலோடு
  rationale: עִם என்பதன் அடிப்படைப் பொருள் ‘உடன்/ஓடு.’ போர் சூழலில் ‘இஸ்ரவேலோடு போரிட்டான்’ என்பது எதிர்த்துப் போரிட்டதையும் தமிழில் இயல்பாக உணர்த்துகிறது; ‘எதிராக’ என்ற தெளிவாக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: உடன்படிக்கை மக்களையோ நாட்டையோ குறிக்கும் பெயரின் நிலைபெற்ற தமிழ் வடிவம்.
- source_word: בִּרְפִידִם
  choice: ரெபிதீமில்
  rationale: בְּ இங்கு இடத்தைக் குறிக்கிறது. ஓர் நிகழ்வு நடந்த முகாம் அல்லது இடத்தைக் குறிக்க ‘ரெபிதீமில்’ என்பது இயல்பான தமிழ் வடிவம்.
