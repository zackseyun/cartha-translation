translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் கூட்டுப் பொருள் கொள்ளக்கூடிய ஒருமைப் பெயரும் அதற்கேற்ற ஒருமை வினையும் பேணப்பட்டுள்ளன.
