source:
  edition: WLC
  text: וַ֠/יִּסְעוּ כָּל עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל מִ/מִּדְבַּר סִ֛ין לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וַֽ/יַּחֲנוּ֙ בִּ/רְפִידִ֔ים וְ/אֵ֥ין מַ֖יִם לִ/שְׁתֹּ֥ת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/001.yaml
  text: Then the whole congregation of the sons of Israel set out from the wilderness of Sin by stages[a], according to the command of Yahweh, and camped at Rephidim[b]; but there was no water for the people to drink.
translation:
  language: ta
  text: இஸ்ரவேல் மக்களின் முழுச் சமூகமும் சீன் வனாந்தரத்திலிருந்து கட்டம் கட்டமாக[a], யாவேயின் கட்டளைக்கேற்ப[b] புறப்பட்டுச் சென்று, ரெபிதீமில் முகாமிட்டது. ஆனால் மக்கள் குடிக்கத் தண்ணீர் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “தங்கள் பயணக் கட்டங்களின்படி.” அதாவது, ஓர் இடத்திலிருந்து அடுத்த இடத்திற்குப் பல கட்டங்களாகப் பயணம் செய்தார்கள்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயச் சொற்றொடரின் நேர்ப்பொருள், “யாவேயின் வாயின்படி”; இது அவருடைய கட்டளை அல்லது வழிநடத்துதலின்படி என்று பொருள்படும் மரபுத்தொடர்.
    reason: idiom
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டுச் சென்று
  rationale: נסע என்பது முகாமைக் கலைத்துப் பயணத்தைத் தொடர்வதைக் குறிக்கிறது. “புறப்பட்டுச் சென்று” என்பது அந்த இயக்கத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் முழுச் சமூகமும்
  rationale: עֵדָה என்பது ஒன்றுபட்ட சமூகத்தையோ கூடியிருக்கும் மக்களையோ குறிக்கிறது. בְּנֵי יִשְׂרָאֵל என்ற எபிரேய மரபுத்தொடரைத் தமிழில் இயல்பாகவும் மொத்த மக்களையும் உள்ளடக்கும் வகையிலும் “இஸ்ரவேல் மக்கள்” என்று வழங்கப்பட்டுள்ளது.
- source_word: מִמִּדְבַּר סִין
  choice: சீன் வனாந்தரத்திலிருந்து
  rationale: מִדְבָּר என்பது வறண்ட, மக்கள் குடியிராத வனாந்தரப் பகுதி. סִין என்பது இடப்பெயர்; அது “சீன்” என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְמַסְעֵיהֶם
  choice: கட்டம் கட்டமாக
  rationale: מַסָּע என்பது பயணத்தின் ஒரு கட்டத்தையோ முகாமிலிருந்து அடுத்த முகாமுக்குச் செல்லுதலையோ குறிக்கலாம். “கட்டம் கட்டமாக” என்பது தொடர்ச்சியான பயணக் கட்டங்களைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עַל פִּי יְהוָה
  choice: யாவேயின் கட்டளைக்கேற்ப
  rationale: עַל־פִּי என்பதன் சொற்பொருள் “வாயின்படி”; இச்சூழலில் அது அதிகாரப்பூர்வமான கட்டளை அல்லது வழிநடத்துதலின்படி செயல்படுவதைக் குறிக்கும் மரபுத்தொடர்.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டது
  rationale: חנה என்பது பயணத்தின்போது ஓர் இடத்தில் முகாமிடுவதைக் குறிக்கிறது. ஒருமை வினைமுற்று “முழுச் சமூகம்” என்ற தமிழ் எழுவாயுடன் இயைந்து வருகிறது.
- source_word: בִּרְפִידִים
  choice: ரெபிதீமில்
  rationale: רְפִידִים என்பது இடப்பெயர்; எபிரேய ஒலிப்புக்கு அருகாக “ரெபிதீம்” என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְאֵין מַיִם לִשְׁתֹּת הָעָם
  choice: ஆனால் மக்கள் குடிக்கத் தண்ணீர் இல்லை
  rationale: ו இங்கு முகாமிட்ட பின்பு எதிர்கொண்ட பற்றாக்குறையை அறிமுகப்படுத்துவதால் “ஆனால்” என எதிர்மறைத் தொடர்புடன் வழங்கப்பட்டுள்ளது. மீதமுள்ள சொற்றொடர் இயல்பான தமிழில் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல எபிரேய உரையில் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைபெயரே உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான “யாவே” என்று வழங்குவது மூலத்தின் தனிப்பட்ட உடன்படிக்கைப் பெயரைத் தெளிவாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய அதேவேளையில் வேதாகம வர்ணனைக்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. “சபை” என்பதன் வழிபாட்டுத்தலச் சார்பைத் தவிர்க்க “முழுச் சமூகம்” பயன்படுத்தப்பட்டது; இடப்பெயர்களும் இறைபெயரும் ஒலிபெயர்க்கப்பட்டன.
