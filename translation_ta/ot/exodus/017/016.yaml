base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/016.yaml
  text: And he said[a], “A hand is upon the throne of Yah; Yahweh will have war with Amalek from generation to generation.”
translation:
  language: ta
  text: 'அவர் சொன்னார்: “ஒரு கை யாவின் அரியணையின் மேல் இருக்கிறது.[a] தலைமுறை தலைமுறையாக அமலேக்குக்கு எதிராக யாவே போர் செய்வார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வாசகம் கடினமாகவும் சொற்கள் விடுபட்ட சுருக்கமான நடையிலும் உள்ளது; சொல்லுக்குச் சொல், “யாவின் அரியணையின் மேல் ஒரு கை.” இதை “யாவின் அரியணைக்கு எதிராக ஒரு கை” என்றும் புரிந்துகொள்ளலாம். சாத்தியம் குறைவான மற்றொரு வாசிப்பில் כֵּס என்பது “கொடி” என எடுத்துக்கொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவர் சொன்னார்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை இயல்பான தமிழில் தருகிறது; இவ்வசனத்தில் எழுவாய் பெயரால் மீண்டும் குறிப்பிடப்படாததால் ‘அவர்’ என்று வைக்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: நேரடி மேற்கோளில் தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது பேச்சின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ என்று கட்டாயப்படுத்தினால் தெளிவற்ற அடுத்த கூற்றை அளவுக்கு மீறி விளக்கியதாகிவிடும்.
- source_word: יָד
  choice: ஒரு கை
  rationale: பெயர்ச்சொல்லுக்கு சுட்டுருபு இல்லாததையும், அது யாருடைய கை என்பதை மூலவாசகம் சொல்லாமல் விடுவதையும் காக்கிறது.
- source_word: עַל
  choice: அரியணையின்மேல்
  rationale: עַל என்பதன் இயல்பான இடப்பொருளைத் தருகிறது; ‘எதிராக’ என்பது சாத்தியமானாலும் விளக்கவுரை சார்ந்த வாசிப்பு.
- source_word: כֵּס
  choice: அரியணை
  rationale: இது பெரும்பாலும் כִּסֵּא என்பதன் சுருக்கமான அல்லது குறைநிரப்பெழுத்து வடிவமாகக் கருதப்படுகிறது; ‘கொடி’ என்பது சொற்பொருள் அடிப்படையில் குறைவான சாத்தியம்.
- source_word: יָהּ
  choice: யா
  rationale: முழுப் பெயரான יהוה என்பதிலிருந்து வேறுபட்ட குறுகிய இறைப்பெயர் வடிவத்தைத் தமிழிலும் தனித்துக் காட்டுகிறது.
- source_word: מִלְחָמָה לַיהוָה
  choice: யாவே போர் புரிவார்
  rationale: வினையில்லா எபிரெயக் கூற்று யாவேக்கும் அமலேக்குக்கும் இடையிலான தொடரும் போரைச் சுட்டுகிறது; இயல்பான தமிழில் எதிர்காலச் செயற்பாடாகத் தரப்பட்டுள்ளது.
- source_word: בַּעֲמָלֵק
  choice: அமலேக்குக்கு எதிராக
  rationale: போர்ச் சூழலில் ב பகைமையான எதிர்ப்பைக் குறிக்கிறது; தமிழில் ‘எதிராக’ என்பது தெளிவான இயல்பான இணை.
- source_word: מִדֹּר דֹּר
  choice: தலைமுறை தலைமுறையாக
  rationale: அடுத்தடுத்த தலைமுறைகள் முழுவதும் தொடர்வதைச் சொல்லும் எபிரெய மரபுத்தொடருக்கு இயல்பான தமிழ் இணை.
theological_decisions:
- issue: יָהּ மற்றும் יהוה ஆகிய இரு இறைப்பெயர் வடிவங்கள்
  choice: יָהּ என்பதை ‘யா’ என்றும் יהוה என்பதை ‘யாவே’ என்றும் வேறுபடுத்துதல்
  alternative: இரண்டையும் ‘கர்த்தர்’ என்று மொழிபெயர்த்தல்
  rationale: ஒரே வசனத்தில் மூலவாசகம் பயன்படுத்தும் குறுகிய இறைப்பெயரையும் முழு உடன்படிக்கைப் பெயரையும் வேறுபடுத்திக் காக்கிறது.
- issue: כִּי יָד עַל כֵּס יָהּ என்ற சுருக்கமான, கடினமான கூற்று
  choice: ‘ஒரு கை யாவின் அரியணையின்மேல் இருக்கிறது’ என்று எச்சரிக்கையுடன் மொழிபெயர்த்து மாற்று வாசிப்புகளை அடிக்குறிப்பில் தருதல்
  alternative: ‘ஒரு கை யாவின் அரியணைக்கு எதிராக இருக்கிறது’ அல்லது ‘யாவின் கொடியின்மேல் ஒரு கை இருக்கிறது’
  rationale: கையின் உரிமையாளர், עַל என்பதன் உறவு, כֵּס என்பதன் சரியான பொருள் ஆகியவை தெளிவாக இல்லாததால், இறையியல் விளக்கத்தை மூலத்துக்குள் சேர்க்காமல் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தெளிவற்ற முதல் கூற்றின் சுருக்கம் காக்கப்பட்டு, தொடரும் போரை இரண்டாம் வாக்கியமாக இயல்பாக வழங்கியுள்ளது.
