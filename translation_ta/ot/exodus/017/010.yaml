  text: So Joshua did as Moses had told him[a], to fight against Amalek; and Moses, Aaron, and Hur went up to the top of the hill.
translation:
  language: ta
  text: மோசே தனக்குச் சொன்னபடி யோசுவா செய்து, அமலேக்குக்கு எதிராகப் போரிட்டார்[a]. மோசேயும் ஆரோனும் ஊரும் குன்றின் உச்சிக்கு ஏறிச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் ‘அமலேக்கு’ என்று உள்ளது; இது அமலேக்கின் வழிவந்த மக்களான அமலேக்கியரைக் குறிக்கலாம்.
