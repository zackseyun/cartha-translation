lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּאֲשֶׁר אָמַר לוֹ מֹשֶׁה
  choice: மோசே தனக்குச் சொன்னபடியே ... செயல்பட்டார்
  rationale: עשה ... כאשר என்ற அமைப்பு, மோசே முன்பு கொடுத்த அறிவுறுத்தலுக்கு ஏற்ப யோசுவா நடந்ததைச் சொல்கிறது. தமிழில் இயல்பாகவும் கட்டளையை நிறைவேற்றிய பொருளுடனும் இருக்க ‘சொன்னபடியே ... செயல்பட்டார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לְהִלָּחֵם
  choice: போரிட
  rationale: לחם என்பதன் நிஃபால் வினையெச்ச வடிவம் ‘போரிடுதல்/சண்டையிடுதல்’ என்று பொருள்படும்; இங்குள்ள ஆயுத மோதலுக்கு ‘போரிட’ தெளிவான நவீனத் தமிழ்.
- source_word: בַּעֲמָלֵק
  choice: அமலேக்குக்கு எதிராக
  rationale: לחם உடன் வரும் בְּ பகைமையான எதிர்ப்பைக் குறிக்கிறது. எபிரெய உரையில் இனப்பெயர் வடிவம் அல்லாமல் ‘அமலேக்கு’ என்ற பெயரே இருப்பதால் அது முதன்மை உரையில் பாதுகாக்கப்பட்டது.
- source_word: עָלוּ
  choice: சென்றார்கள்
  rationale: עלה என்பது மேல்நோக்கிய இயக்கத்தைக் குறிக்கிறது. சேருமிடமான ‘குன்றின் உச்சி’ இதைத் தெளிவாக்குவதால், தமிழில் இயல்பான ‘சென்றார்கள்’ பயன்படுத்தப்பட்டது.
- source_word: רֹאשׁ הַגִּבְעָה
  choice: குன்றின் உச்சி
  rationale: சொல்லாட்சியாக ‘குன்றின் தலை’ என்றாலும், இது அதன் உயர்ந்த பகுதி அல்லது உச்சியைக் குறிக்கும் இயல்பான எபிரெய மரபுத்தொடர்.
- source_word: יְהוֹשֻׁעַ / מֹשֶׁה / אַהֲרֹן / חוּר
  choice: யோசுவா / மோசே / ஆரோன் / ஊர்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவங்கள் பயன்படுத்தப்பட்டன.
