  edition: WLC
  text: וַ/יָּ֤רֶב הָ/עָם֙ עִם מֹשֶׁ֔ה וַ/יֹּ֣אמְר֔וּ תְּנוּ לָ֥/נוּ מַ֖יִם וְ/נִשְׁתֶּ֑ה וַ/יֹּ֤אמֶר לָ/הֶם֙ מֹשֶׁ֔ה מַה תְּרִיבוּ/ן֙ עִמָּדִ֔/י מַה תְּנַסּ֖וּ/ן אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/002.yaml
  text: So the people quarreled with Moses and said[a], “Give us water so that we may drink.” And Moses said to them[b], “Why do you quarrel with me? Why do you test Yahweh?”
translation:
  language: ta
  text: அப்போது மக்கள் மோசேயோடு வாக்குவாதம் செய்து, “நாங்கள் குடிப்பதற்குத் தண்ணீர் கொடுங்கள்” என்றார்கள். மோசே அவர்களிடம், “என்னோடு ஏன் வாக்குவாதம் செய்கிறீர்கள்? யாவேவை[a] ஏன் சோதிக்கிறீர்கள்?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் יהוה (YHWH) என்ற இறைபெயர்; இது பாரம்பரியமாக ‘கர்த்தர்’ என்று வழங்கப்படுகிறது.
    reason: divine_name
lexical_decisions:
- source_word: וַיָּרֶב
  choice: வாக்குவாதம் செய்து
  rationale: ריב என்பது வெறும் முறையீட்டைவிட வலுவான சச்சரவு அல்லது எதிர்த்துப் பேசுதலைக் குறிக்கிறது. ‘வாக்குவாதம் செய்து’ என்பது அந்த எதிர்ப்புத் தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: எபிரெயச் சொல் இவ்வசனத்தில் பொதுவாக ‘மக்கள்’ என்றே உள்ளது; ‘இஸ்ரவேல் மக்கள்’ என்று சூழலிலிருந்து கூடுதல் தகவல் சேர்க்கப்படவில்லை.
- source_word: עִם מֹשֶׁה
  choice: மோசேயோடு
  rationale: עִם என்பதன் நேரடிப் பொருள் ‘உடன்/ஓடு.’ ‘வாக்குவாதம் செய்’ என்பதுடன் ‘மோசேயோடு’ என்பது எதிர்ப்பின் பொருளைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: תְּנוּ לָנוּ מַיִם
  choice: தண்ணீர் கொடுங்கள்
  rationale: נתן என்ற கட்டளைச்சொல்லின் நேரடியான வலிமையை ‘கொடுங்கள்’ தக்கவைக்கிறது; ‘ஏற்பாடு செய்யுங்கள்’ போன்ற விரிவாக்கம் தவிர்க்கப்படுகிறது.
- source_word: וְנִשְׁתֶּה
  choice: நாங்கள் குடிப்பதற்கு
  rationale: கட்டளையைத் தொடர்ந்து வரும் இவ்வடிவம் நோக்கம் அல்லது விரும்பிய விளைவைக் குறிக்கிறது. தமிழில் ‘குடிப்பதற்கு’ என்பது அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַה תְּרִיבוּן עִמָּדִי
  choice: என்னோடு ஏன் வாக்குவாதம் செய்கிறீர்கள்?
  rationale: கண்டிக்கும் இக்கேள்வியில் מַה என்பது ‘ஏன்’ என்ற பொருளில் வருகிறது. முன்பு வந்த ריב என்பதற்குப் பயன்படுத்திய ‘வாக்குவாதம்’ மீண்டும் பயன்படுத்தப்பட்டதால் மூலத்தின் சொல் தொடர்பு காக்கப்படுகிறது.
- source_word: מַה תְּנַסּוּן
  choice: ஏன் சோதிக்கிறீர்கள்?
  rationale: נסה என்பதன் பியேல் வடிவம் ‘சோதித்தல்’ அல்லது ‘சோதனைக்கு உட்படுத்துதல்’ என்று பொருள்படும். ‘சோதிக்கிறீர்கள்’ என்பது சுருக்கமாகவும் இறைவனையே சவாலுக்கு உட்படுத்தும் தீவிரத்தைக் குறைக்காமலும் உள்ளது.
- source_word: אֶת יְהוָה
  choice: யாவேவை
  rationale: יהוה என்ற தனிப்பட்ட இறைபெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், அதன் வழக்கமாக மீளமைக்கப்படும் உச்சரிப்பைத் தமிழில் ‘யாவே’ என்று ஒலிபெயர்த்துள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைபெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அந்த உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் காக்கிறது; பாரம்பரிய மாற்றீடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: இறைவனை நோக்கிய נסה என்பதன் வலிமை
  choice: யாவேவை ஏன் சோதிக்கிறீர்கள்?
  alternative: யாவேவை ஏன் சோதனைக்கு உட்படுத்துகிறீர்கள்?
  rationale: மக்கள் மோசேயோடு செய்த வாக்குவாதம் இறைவனைச் சோதிப்பதாக வசனம் கூறும் இறையியல் அழுத்தம் அப்படியே விடப்படுகிறது. ‘சோதிக்கிறீர்கள்’ என்பது அதை மென்மையாக்கவோ விளக்கி முடிவுசெய்யவோ இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘வாக்குவாதம்’ என்ற சொல்லை இருமுறையும் பயன்படுத்தி மூலத்தின் ריב சொல் மீளுருவாக்கம் காக்கப்பட்டது.
