base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/015.yaml
  text: And Moses built an altar and called its name[a], “Yahweh Is My Banner.”
translation:
  language: ta
  text: மோசே ஒரு பலிபீடத்தைக் கட்டி, அதற்கு “யாவே என் கொடி”[a] என்று பெயரிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயில்: “யாவே என் கொடி.” இப்பெயர், இஸ்ரவேலர் ஒன்றுகூடவும் வெற்றியை நோக்கிச் செல்லவும் உதவும் கொடி அல்லது படை அடையாளம் யாவே என்பதைக் குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: கட்டினார்
  rationale: בנה என்பதன் தொடர்கதை வடிவம் கட்டுதல் என்ற நேரடியான பொருளைத் தருகிறது; நவீன தமிழில் இயல்பான வினைச்சொல் இது.
- source_word: מִזְבֵּחַ
  choice: பலிபீடம்
  rationale: பலியிடுவதற்கான பீடத்தைக் குறிக்கும் எபிரெயச் சொல்லின் வழக்கமான, தெளிவான தமிழ் இணைச்சொல்.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: அதற்கு … என்று பெயரிட்டார்
  rationale: சொல்லுக்கு நெருக்கமாக ‘அதன் பெயரை அழைத்தார்’ என்று மொழிபெயர்ப்பதைவிட, எபிரெயப் பெயரிடும் மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் இது துல்லியமாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது கடவுளின் தனிப்பெயரான நான்கெழுத்துப் பெயர்; அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: נִסִּי
  choice: என் கொடி
  rationale: נֵס என்பது மக்கள் ஒன்றுகூடும் அடையாளக் கொடி அல்லது படைக்கொடியைக் குறிக்கலாம். ‘என் கொடி’ மூலத்தின் உருவகத்தையும் சுருக்கமான பெயர் வடிவத்தையும் காக்கிறது.
theological_decisions:
- issue: பலிபீடத்தின் நினைவுப் பெயரில் வரும் יְהוָה என்பதன் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, கடவுளின் தனிப்பெயரே நேரடியாக உள்ளது; ஆகவே அதை ‘ஆண்டவர்’ என்று மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: יְהוָה נִסִּי என்ற வினையற்ற பெயர்த் தொடரின் பொருள்
  choice: யாவே என் கொடி
  alternative: யாவே எனக்குக் கொடியாக இருக்கிறார்
  rationale: எபிரெயில் இணைப்பு வினை வெளிப்படையாக இல்லை. சுருக்கமான பெயர்த் தொடரை அப்படியே காப்பதால் அதன் கவித்துவச் செறிவும் உண்மையான இலக்கணத் திறந்தநிலையும் நிலைக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பெயரிட்டார்’ என்பது எபிரெயப் பெயரிடும் மரபுத்தொடரை இயல்பாக வழங்குகிறது; பலிபீடப் பெயர் மட்டும் மூலத்தின் சுருக்கமான அமைப்பில் வைக்கப்பட்டுள்ளது.
