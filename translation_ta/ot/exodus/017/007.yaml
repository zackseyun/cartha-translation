  yaml_path: translation/ot/exodus/017/007.yaml
  text: And he called the name of the place Massah and Meribah[a], because of the quarreling of the sons of Israel and because they tested Yahweh, saying[c][b], “Is Yahweh among us or not?”
translation:
  language: ta
  text: இஸ்ரவேல் மக்களின் சச்சரவினாலும், அவர்கள் “யாவே நம் நடுவில் இருக்கிறாரா, இல்லையா?” என்று சொல்லி யாவேயைச் சோதித்ததினாலும், அவர் அந்த இடத்திற்கு மாசா என்றும் மெரிபா என்றும் பெயரிட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மாசா” என்பது “சோதித்தல்” என்பதற்கான எபிரெயச் சொல்லையும், “மெரிபா” என்பது “சச்சரவு” அல்லது “வாக்குவாதம்” என்பதற்கான எபிரெயச் சொல்லையும் ஒத்த ஒலியுடையவை.
    reason: இடப்பெயர்களுக்கும் தொடர்ந்து வரும் நிகழ்வு விளக்கத்திற்கும் இடையிலான எபிரெயச் சொல்விளையாட்டைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: அவர் அந்த இடத்திற்கு ... பெயரிட்டார்
  rationale: எபிரெய மொழியின் பெயரிடும் சூத்திரத்தை இயல்பான நவீனத் தமிழில் பொருள் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מַסָּה וּמְרִיבָה
  choice: மாசா என்றும் மெரிபா என்றும்
  rationale: இவை இடப்பெயர்கள் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளன; அவற்றின் சொல்விளையாட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: עַל רִיב בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் சச்சரவினாலும்
  rationale: רִיב என்பதன் தகராறு/வாக்குவாதம் சார்ந்த பொருளை ‘சச்சரவு’ இயல்பாகக் காட்டுகிறது; בְּנֵי יִשְׂרָאֵל இங்கு முழு சமூகத்தையும் குறிக்கும் வழக்குச் சொற்றொடர்.
- source_word: וְעַל נַסֹּתָם אֶת יְהוָה
  choice: அவர்கள் யாவேயைச் சோதித்ததினாலும்
  rationale: נסה என்ற வினையின் நேரடியான பொருளையும், யாவே சோதனைக்குட்படுத்தப்பட்டவர் என்பதையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைபெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הֲיֵשׁ יְהוָה בְּקִרְבֵּנוּ אִם אָיִן
  choice: யாவே நம் நடுவில் இருக்கிறாரா, இல்லையா?
  rationale: בְּקִרְבֵּנוּ என்பதின் சமூகத்தின் மத்தியில் இருக்கும் பிரசன்னம் என்ற பொருளையும், אִם אָיִן என்பதின் கூர்மையான இருமுனைக் கேள்வியையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைபெயர் நேரடியாக உள்ளது; அதை பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற சமூகப் பெயர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இச்சூழலில் இந்த எபிரெய மரபுத்தொடர் ஆண்களை மட்டும் அல்லாமல் உடன்படிக்கைச் சமூகத்தையே குறிக்கிறது; ‘இஸ்ரவேல் மக்கள்’ நவீனத் தமிழில் அந்தக் கூட்டுப் பொருளைத் துல்லியமாகத் தருகிறது.
- issue: மக்கள் எழுப்பிய கேள்வியின் தன்மை
  choice: “யாவே நம் நடுவில் இருக்கிறாரா, இல்லையா?”
  alternative: “யாவே நம்முடன் இருக்கிறாரா, இல்லையா?”
  rationale: ‘நம் நடுவில்’ என்பது בְּקִרְבֵּנוּ என்பதின் இடைநிலை/சமூகப் பிரசன்னத்தை முறையாகக் காக்கிறது; மக்கள் இறை இருப்பைச் சோதித்த பதற்றமும் தீர்க்கப்படாமல் விடப்படுகிறது.
