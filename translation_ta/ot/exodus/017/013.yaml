base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/013.yaml
  text: And Joshua overcame Amalek and his people with the sword[a].
translation:
  language: ta
  text: யோசுவா அமலேக்கையும் அவனுடைய மக்களையும் வாளால் வென்றார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொல்லுக்கு நெருக்கமாக, ‘வாளின் விளிம்பால்’ என மொழிபெயர்க்கலாம். எபிரெய மொழியில் சொல்லுக்கு சொல் ‘வாளின் வாயால்’ என்று உள்ளது; இது ஆயுதப் போரில் வாளால் தோற்கடிப்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹשׁ
  choice: வென்றார்
  rationale: חלש என்ற வினைச்சொல் வலிமையைக் குன்றச் செய்தல் அல்லது போரில் மேலோங்குதல் என்ற பொருள்களைத் தரலாம். இப்போர்ச் சூழலில், முழுமையாக அழித்தார் என்று மிகைப்படுத்தாமல் யோசுவா மேலோங்கியதை ‘வென்றார்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: עֲמָלֵק
  choice: அமலேக்கு
  rationale: இங்கு மூதாதையரின் பெயர் அவரால் பிரதிநிதித்துவப்படுத்தப்படும் அமலேக்கியப் படையைக் குறிக்கிறது; எபிரெய உரையின் ஒருமைப் பெயர் வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: עַמּוֹ
  choice: அவனுடைய மக்கள்
  rationale: עַם என்பதன் நேரடிப் பொருள் ‘மக்கள்’. போர்ச் சூழலில் இது அமலேக்கின் போர்வீரர்களைக் குறிக்கக்கூடும்; எனினும், அந்தக் குறிப்பை உரைக்குள் கட்டாயப்படுத்தாமல் எபிரெயச் சொல்லின் விரிவை இத்தேர்வு பாதுகாக்கிறது.
- source_word: לְפִי חָרֶב
  choice: வாளால்
  rationale: சொல்லுக்கு சொல் ‘வாளின் வாயால்’ என வரும் இச்சொற்றொடர் ஆயுதப் போரில் வாளால் வெல்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘வாளால்’ என்பது அதன் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது; நேரடி உருவகம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
