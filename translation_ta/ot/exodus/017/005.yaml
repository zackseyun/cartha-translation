base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/005.yaml
  text: Then Yahweh said to Moses[a], “Pass on before the people, and take with you some of the elders of Israel. Take in your hand your staff with which you struck the Nile[b], and go.”
translation:
  language: ta
  text: அப்போது யாவே மோசேயிடம், “நீ மக்களுக்கு முன்னால் செல்; இஸ்ரவேலின் மூப்பர்களில் சிலரை[a] உன்னுடன் அழைத்துக்கொள். நீ நைல் நதியை[b] அடிக்கப் பயன்படுத்திய உன் கோலைக் கையில் எடுத்துக்கொண்டு போ” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இஸ்ரவேலின் மூப்பர்களிலிருந்து”; அவர்களில் தேர்ந்தெடுக்கப்பட்ட சிலரை மோசே தன்னுடன் அழைத்துச் செல்ல வேண்டும் என்பதே இதன் பொருளாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நதியை”; யாத்திராகமத்தில் இச்சொல் பொதுவாக நைல் நதியையே குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: עֲבֹר לִפְנֵי הָעָם
  choice: மக்களுக்கு முன்னால் செல்
  rationale: עבר என்பதன் நகர்ந்து செல்லும் பொருளையும் לִפְנֵי என்பதன் இடம்சார்ந்த ‘முன்னால்’ என்ற பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וְקַח אִתְּךָ מִזִּקְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மூப்பர்களில் சிலரை உன்னுடன் அழைத்துக்கொள்
  rationale: מִן இங்கு ஒரு குழுவிலிருந்து தேர்ந்தெடுக்கப்படுவோரைக் குறிக்கும் பகுதிப்பொருளைக் கொண்டிருப்பதைத் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּמַטְּךָ
  choice: உன் கோலை
  rationale: מַטֶּה என்பதற்கு இச்சூழலில் இயல்பாகவும் மோசே பயன்படுத்திய கருவிக்குப் பொருத்தமாகவும் ‘கோல்’ அமைகிறது.
- source_word: אֲשֶׁר הִכִּיתָ בּוֹ אֶת הַיְאֹר
  choice: நீ நைல் நதியை அடித்த
  rationale: יְאֹר யாத்திராகமத்தின் எகிப்தியச் சூழலில் குறிப்பாக நைல் நதியைக் குறிக்கிறது; בּוֹ-வின் கருவிப்பொருள் தமிழில் ‘கோலைக் ... அடித்த’ என்ற அமைப்பில் இயல்பாக வெளிப்படுகிறது.
- source_word: קַח בְּיָדְךָ
  choice: கையில் எடுத்துக்கொண்டு
  rationale: மூலத்தில் மீண்டும் வரும் קח கட்டளையையும், கோலைக் கையில் ஏந்திச் செல்லும் செயல் தொடரையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וְהָלָכְתָּ
  choice: போ
  rationale: முந்தைய கட்டளைகளைத் தொடர்ந்து வரும் எளிய கட்டளைப்பொருளைச் சுருக்கமாக வழங்குகிறது.
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ்-தொடர்வினை குறிக்கும் கதை முன்னேற்றத்தை நவீன தமிழின் இயல்பான நடைமுறையில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: YHWH என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது; குறிப்பிட்ட சமயப்பிரிவின் விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified உரைநடை பயன்படுத்தப்பட்டுள்ளது. கட்டளைத் தொடரின் வேகம் காக்கப்பட்டுள்ளது; ‘மூப்பர்களில் சிலரை’ எனப் பகுதிப்பொருள் முதன்மை உரையில் தெளிவாக்கப்பட்டாலும், மூலத்தின் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
