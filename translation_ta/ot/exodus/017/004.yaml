source:
  edition: WLC
  text: וַ/יִּצְעַ֤ק מֹשֶׁה֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר מָ֥ה אֶעֱשֶׂ֖ה לָ/עָ֣ם הַ/זֶּ֑ה ע֥וֹד מְעַ֖ט וּ/סְקָלֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/004.yaml
  text: So Moses cried out to Yahweh[a], saying, “What shall I do with this people? A little more, and they will stone me!”
translation:
  language: ta
  text: அப்போது மோசே யாவேயை நோக்கி உரக்கக் கூப்பிட்டு, “இந்த மக்களோடு நான் என்ன செய்வது? இன்னும் சிறிது நேரத்தில்[a] அவர்கள் என்மேல் கல்லெறிவார்கள்!” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “இன்னும் சிறிதே; அவர்கள் என்மேல் கல்லெறிவார்கள்.” இது அச்சுறுத்தல் மிக அருகில் இருப்பதைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: கதறி
  rationale: צעק என்பது சாதாரணமாக அழைப்பதைவிட, நெருக்கடியிலும் உதவி தேவைப்படும் நிலையிலும் எழுப்பப்படும் வலுவான கூக்குரலைக் குறிக்கிறது. ‘கதறி’ என்பது மோசேயின் அச்சத்தையும் அவசரத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் தேவனுடைய தனிப்பெயரான יהוה என்பதை ஒரு பட்டப்பெயராக மாற்றாமல், நவீன தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: מָה אֶעֱשֶׂה לָעָם הַזֶּה
  choice: இந்த மக்களை நான் என்ன செய்வேன்?
  rationale: עשה உடன் வரும் ל இங்கு மக்களோடு எவ்வாறு நடந்துகொள்வது என்ற மோசேயின் அவசரமான கேள்வியைத் தெரிவிக்கிறது. இந்த வடிவம் மூலத்தின் சுருக்கத்தையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: עֹד מְעַט
  choice: இன்னும் சிறிது நேரத்தில்
  rationale: சொல்லுக்குச் சொல் ‘இன்னும் சிறிதே’ என்றாலும், சூழலில் அச்சுறுத்தல் உடனடியாக நிகழவிருக்கிறது என்பதைக் குறிக்கிறது. தேர்ந்த மொழிபெயர்ப்பு அந்த அண்மையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וּסְקָלֻנִי
  choice: அவர்கள் என்னைக் கல்லெறிந்துவிடுவார்கள்
  rationale: סקל என்பது கற்களால் தாக்குவதையோ கல்லெறிந்து கொல்வதையோ குறிக்கலாம். ‘கல்லெறிந்துவிடுவார்கள்’ என்பது மரணத்தை வெளிப்படையாகச் சேர்க்காமல், மூலத்தின் செயலும் உடனடி ஆபத்தும் இரண்டையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: இங்கு எபிரெய உரை ஒரு பட்டப்பெயரை அல்ல, יהוה என்ற தனிப்பெயரையே பயன்படுத்துகிறது. ஆகவே அதை ‘யாவே’ என்று ஒலிபெயர்ப்பது மூல உரையின் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுமக்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மோசேயின் நெருக்கடியையும் கேள்வியின் நேரடித் தன்மையையும் காக்கும் வகையில் வாக்கியம் அமைக்கப்பட்டுள்ளது.
