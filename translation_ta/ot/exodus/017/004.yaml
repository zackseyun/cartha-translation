revisions:
- from: அப்போது மோசே யாவேயை நோக்கிக் கதறி, “இந்த மக்களை நான் என்ன செய்வேன்? இன்னும் சிறிது நேரத்தில்[a] அவர்கள் என்னைக் கல்லெறிந்துவிடுவார்கள்!” என்றார்.
  to: அப்போது மோசே யாவேயை நோக்கி உரக்கக் கூப்பிட்டு, “இந்த மக்களோடு நான் என்ன செய்வது? இன்னும் சிறிது நேரத்தில்[a] அவர்கள் என்மேல் கல்லெறிவார்கள்!” என்றார்.
