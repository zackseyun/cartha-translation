  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה כְּתֹ֨ב זֹ֤את זִכָּרוֹן֙ בַּ/סֵּ֔פֶר וְ/שִׂ֖ים בְּ/אָזְנֵ֣י יְהוֹשֻׁ֑עַ כִּֽי מָחֹ֤ה אֶמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/014.yaml
  text: Then Yahweh said to Moses[a], “Write this as a memorial in the book, and put it in Joshua’s hearing[c][b], for I will surely blot out the remembrance of Amalek from under heaven.”
translation:
  language: ta
  text: அப்போது யாவே மோசேயிடம், “இதை நினைவாகப் புத்தகத்தில்[a] எழுது; யோசுவா கேட்கும்படி இதைச் சொல்[b]. ஏனெனில், அமலேக்கின் நினைவை வானத்தின்கீழிருந்து முற்றிலும் அழித்துப்போடுவேன்[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் “புத்தகத்தில்” என்று உள்ளது; “ஒரு புத்தகத்தில்” அல்லது “சுருளில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “யோசுவாவின் செவிகளில் வை”; அதாவது, யோசுவா கேட்கும்படி இதைச் சொல் அல்லது அவனுக்கு வாசித்துக் காட்டு.
    reason: idiom_explanation
  - marker: c
    text: “முற்றிலும் அழித்துப்போடுவேன்” என்பதற்கான எபிரெய வினையமைப்பு செயல் நிச்சயமாக நிறைவேறும் என்பதை வலியுறுத்துகிறது.
    reason: emphasis_explanation
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீனத் தமிழில் புரியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כְּתֹב
  choice: எழுதி
  rationale: כתב என்பதன் கட்டளைப் பொருளை நேரடியாகத் தருகிறது; தொடர்வினை அமைப்பால் தமிழ் மேற்கோள் இயல்பாகிறது.
- source_word: זֹאת זִכָּרוֹן
  choice: இதை நினைவுச் சான்றாக
  rationale: நிகழ்வை நினைவில் நிலைநிறுத்தும் நோக்கத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בַּסֵּפֶר
  choice: அந்தப் புத்தகத்தில்
  rationale: எபிரெயச் சொல்லிலுள்ள குறிப்புச் சுட்டைத் தக்கவைக்கிறது; அது எந்தப் புத்தகம் என்பதை வசனம் விளக்காததால் அடிக்குறிப்பில் மாற்றுகள் தரப்படுகின்றன.
- source_word: וְשִׂים בְּאָזְנֵי יְהוֹשֻׁעַ
  choice: யோசுவாவின் செவிகளில் வை
  rationale: ‘யோசுவா கேட்கும்படி செய்’ என்ற பொருளுடைய எபிரெய உருவகச் சொல்லாட்சியைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர் வடிவம்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: தொடர்ந்து வரும் தெய்வீக அறிவிப்பு, கட்டளைக்கான காரணத்தையோ விளக்கத்தையோ தரும் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: מָחֹה אֶמְחֶה
  choice: முற்றிலும் அழித்துப்போடுவேன்
  rationale: வினைமுற்றுடன் வந்த அதே வேரின் infinitive absolute தரும் வலியுறுத்தலையும் உறுதியையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: זֵכֶר עֲמָלֵק
  choice: அமலேக்கைப் பற்றிய நினைவை
  rationale: זֵכֶר என்பதன் ‘நினைவு/நினைவுகூரல்’ பொருளைத் தக்கவைத்து, முன்புள்ள ‘நினைவுச் சான்று’ என்பதுடன் உள்ள கருத்து முரணையும் வெளிப்படுத்துகிறது.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: வானத்தின் கீழிருந்து
  rationale: முழுமையான அகற்றலைக் குறிக்கும் எபிரெய மரபுத்தொடரை அதன் உருவகத்துடன் பாதுகாக்கிறது.
theological_decisions:
- issue: தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, יהוה என்ற தனிப்பெயரே உள்ளது. ஆகவே அந்தப் பெயரை ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: அமலேக்கின் நினைவை அழித்தல் என்பதன் பரப்பு
  choice: அமலேக்கைப் பற்றிய நினைவை வானத்தின் கீழிருந்து முற்றிலும் அழித்துப்போடுவேன்
  alternative: அமலேக்கின் பெயரை பூமியிலிருந்து ஒழித்துவிடுவேன்
  rationale: ‘நினைவு’ என்பதைக் ‘பெயர்’ என்றும், ‘வானத்தின் கீழிருந்து’ என்பதைக் ‘பூமியிலிருந்து’ என்றும் விளக்கமாக மாற்றாமல், மூலத்தின் சொற்பொருளையும் அதன் கடுமையான தெய்வீக அறிவிப்பையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடையைப் பயன்படுத்துகிறது. ‘செவிகளில் வை’ மற்றும் ‘வானத்தின் கீழிருந்து’ போன்ற மூல உருவகங்கள் பொருள் புரியுமளவு தக்கவைக்கப்பட்டுள்ளன; தேவையான விளக்கங்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
