  yaml_path: translation/ot/exodus/017/011.yaml
  text: And whenever Moses raised his hand[a], Israel prevailed; and whenever he let down his hand[b], Amalek prevailed.
translation:
  language: ta
  text: மோசே தன் கையை உயர்த்திய போதெல்லாம்[a] இஸ்ரவேல் மேலோங்கியது; அவர் தன் கையைத் தாழ்த்திய போதெல்லாம்[b] அமலேக்கு மேலோங்கியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மோசே தன் கையை உயர்த்தியபோது … தாழ்த்தியபோது.’ எபிரெய அமைப்பை ‘போது’ எனவும் மொழிபெயர்க்கலாம்; ஆனால் போரின்போது இது மீண்டும் மீண்டும் நிகழ்ந்ததைச் சூழல் காட்டுவதால் ‘போதெல்லாம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘தாழ்த்திய’ என்பதற்கான எபிரெய வினைச்சொல் ‘ஓய்வில் வைத்தார்’ அல்லது ‘கீழே வைத்தார்’ என்றும் பொருள்படலாம். ‘கையை உயர்த்திய’ என்பதுடன் உள்ள எதிரிணைவு இங்கு ‘தாழ்த்திய’ என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כַּאֲשֶׁר
  choice: போதெல்லாம்
  rationale: இந்த அமைப்பு போரின்போது மீண்டும் மீண்டும் நிகழ்ந்த சூழலைக் குறிக்கிறது. நவீன தமிழில் ‘போதெல்லாம்’ அந்தத் தொடர்நிகழ்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יָרִים
  choice: உயர்த்திய
  rationale: ரום என்பதன் ஹிஃபில் வடிவம் ‘உயர்த்துதல்’ என்று பொருள்படும்; செயல் எவ்வளவு நேரம் நீடித்தது என்பதைச் சேர்க்காமல் மூலத்தின் பொருளைக் காக்கிறது.
- source_word: יָדוֹ
  choice: தன் கையை
  rationale: எபிரெயச் சொல் குறிப்பாக ‘கை’ என்பதையே குறிக்கிறது; ‘புயம்’ என்று விரிவுபடுத்தப்படவில்லை. தமிழில் எழுவாயைத் தெளிவாகச் சுட்ட ‘தன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְגָבַר
  choice: மேலோங்கியது
  rationale: גבר என்பது வலிமை பெறுதல் அல்லது போரில் மேலோங்குதல் எனப் பொருள்படும். ‘மேலோங்கியது’ தற்காலிகப் போர்நிலையைச் சுட்டுகிறது; முழுமையான தோல்வியை அளவுக்கு மீறிக் கூறுவதில்லை.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் மக்களினப் பெயர் வடிவம்.
- source_word: יָנִיחַ
  choice: தாழ்த்திய
  rationale: נוח என்பதன் ஹிஃபில் வடிவத்திற்கு ‘ஓயச் செய்தல்’, ‘கீழே வைத்தல்’ போன்ற பொருள்கள் இருக்கலாம். இங்கு ‘உயர்த்திய’ என்பதற்கு எதிராக வருவதால் ‘தாழ்த்திய’ என்பது இயல்பான பொருத்தம்.
- source_word: עֲמָלֵק
  choice: அமலேக்கு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்படும் மக்களினப் பெயர் வடிவம்.
