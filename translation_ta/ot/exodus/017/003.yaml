base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/003.yaml
  text: And there the people thirsted for water, and the people grumbled against Moses and said, “Why is this—that you brought us up from Egypt to kill me and my children and my livestock with thirst?”
translation:
  language: ta
  text: அங்கே மக்கள் தண்ணீருக்காகத் தாகமடைந்தார்கள். அவர்கள் மோசேக்கு எதிராக முறுமுறுத்து, “எதற்காக நீர் எங்களை எகிப்திலிருந்து வெளியே கொண்டு வந்தீர்? என்னையும் என் பிள்ளைகளையும் என் கால்நடைகளையும் தாகத்தால் கொல்லவா?”[a] என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் முதலில் “எங்களை” என்று பன்மையில் கூறிய பின், “என்னையும் என் பிள்ளைகளையும் என் கால்நடைகளையும்” என்று ஒருமைக்கு மாறுகிறது.
    reason: மூலத்தில் தெளிவாக உள்ள, வாசகருக்கு வியப்பளிக்கக்கூடிய எண்ணிக்கை மாற்றத்தை விளக்குகிறது; மொழிபெயர்ப்பில் அதை மறைக்காமல் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיִּצְמָא ... לַמַּיִם
  choice: தண்ணீருக்காகத் தாகமடைந்தார்கள்
  rationale: ‘தண்ணீருக்காகத் தாகமடைதல்’ என்ற எபிரெயச் சொல்லமைப்பை இயல்பான நவீன தமிழில் நெருக்கமாகத் தருகிறது.
- source_word: וַיָּלֶן ... עַל־מֹשֶׁה
  choice: மோசேக்கு எதிராக முறுமுறுத்து
  rationale: மக்களின் வெறும் குறைகூறலைவிட, மோசேக்கு எதிரான தொடர்ச்சியான அதிருப்தியையும் புகாரையும் வினைச்சொல் உணர்த்துகிறது.
- source_word: הֶעֱלִיתָנוּ מִמִּצְרַיִם
  choice: நீர் எங்களை எகிப்திலிருந்து அழைத்துக்கொண்டு வந்தது
  rationale: எபிரெயத்தில் உள்ள ‘மேலே கொண்டுவந்தீர்’ என்பது வெளியேற்றத்தையும் பயணத்தையும் குறிக்கும் வழக்குச் சொல்; தமிழில் இயல்பாகவும் பொருள் தெளிவாகவும் ‘அழைத்துக்கொண்டு வந்தது’ என வழங்கப்பட்டது.
- source_word: בַּצָּמָא
  choice: தாகத்தால்
  rationale: தாகமே மரணத்துக்குக் காரணமாகச் சித்தரிக்கப்படும் மூலமொழியின் கருவி/காரணப் பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: மக்கள் அனைவரின் புகாரிலிருந்து ஒருமை முதல் நபருக்கு மாறுதல்
  choice: ‘எங்களை’ என்பதற்குப் பின் ‘என்னையும் என் பிள்ளைகளையும் என் கால்நடைகளையும்’ என்ற ஒருமை வடிவத்தைப் பாதுகாத்தல்
  alternative: அனைத்தையும் பன்மையாக்கி ‘எங்களையும் எங்கள் பிள்ளைகளையும் எங்கள் கால்நடைகளையும்’ என மொழிபெயர்த்தல்
  rationale: மூல எபிரெயத்தில் உள்ள திடீர் எண் மாற்றம் நோக்கமுடைய கூட்டுப் பிரதிநிதித்துவமாகவோ தனிநபர் குரலாகவோ இருக்கலாம்; அதைச் சீராக்காமல் அதன் உண்மையான பதற்றத்தைப் பாதுகாக்கிறது.
- issue: לָמָּה זֶּה என்ற கேள்வியின் வடிவம்
  choice: ‘நீர் ... வந்தது எதற்காக?’
  alternative: ‘ஏன் எங்களை ... கொண்டுவந்தீர்?’
  rationale: மூலத்தின் ‘இது எதற்காக?’ என்ற வலியுறுத்தலைத் தமிழில் இயல்பான குற்றச்சாட்டுக் கேள்வியாகத் தருகிறது; நோக்கத்தை முன்வைக்கும் அடுத்த சொற்றொடருடனும் இணைகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. மோசேயை நோக்கிய உரையில் ‘நீர்’ பயன்படுத்தப்பட்டாலும், குற்றச்சாட்டின் கூர்மை மென்மையாக்கப்படவில்லை.
