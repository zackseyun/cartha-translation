- from: அங்கே மக்கள் தண்ணீருக்காகத் தாகமடைந்தார்கள். அவர்கள் மோசேக்கு எதிராக முறுமுறுத்து, “நீர் எங்களை எகிப்திலிருந்து அழைத்துக்கொண்டு வந்தது எதற்காக? என்னையும் என் பிள்ளைகளையும் என் கால்நடைகளையும் தாகத்தால் சாகடிப்பதற்காகவா?”[a] என்று கேட்டார்கள்.
