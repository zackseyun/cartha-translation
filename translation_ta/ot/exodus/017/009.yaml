source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בְּחַר לָ֣/נוּ אֲנָשִׁ֔ים וְ/צֵ֖א הִלָּחֵ֣ם בַּ/עֲמָלֵ֑ק מָחָ֗ר אָנֹכִ֤י נִצָּב֙ עַל רֹ֣אשׁ הַ/גִּבְעָ֔ה וּ/מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/009.yaml
  text: And Moses said to Joshua[a], “Choose men for us and go out; fight against Amalek. Tomorrow I will stand on the top of the hill[b], with the staff of God in my hand.”
translation:
  language: ta
  text: மோசே யோசுவாவிடம், “நமக்காக ஆண்களைத் தேர்ந்தெடுத்து, புறப்பட்டுப் போய் அமலேக்குக்கு எதிராகப் போரிடு[a]. நாளை நான் குன்றின் உச்சியில்[b], கடவுளின் கோலை என் கையில் பிடித்துக்கொண்டு நிற்பேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அமலேக்குக்கு எதிராகப் போர் நடத்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “குன்றின் தலையில்”; இது “குன்றின் உச்சியில்” என்பதற்கான மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியைத் தமிழில் இயல்பாகக் காட்ட, உரையாடலுக்குப் பின் வரும் ‘என்றார்’ அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழில் பரவலாக நிலைபெற்றுள்ள வேதாகமப் பெயர்வடிவம்.
- source_word: בְּחַר לָנוּ אֲנָשִׁים
  choice: நமக்காக ஆண்களைத் தேர்ந்தெடுத்து
  rationale: בְּחַר என்பதன் ‘தேர்ந்தெடு’ என்ற பொருளையும், אֲנָשִׁים என்பதன் ஆண்பால் குறிப்பையும், לָנוּ என்பதன் ‘நமக்காக’ என்ற உறவையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְצֵא
  choice: புறப்பட்டுப் போய்
  rationale: יצא என்பதிலுள்ள ஒரு இடத்திலிருந்து வெளியே சென்று செயல்படும் நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הִלָּחֵם בַּעֲמָלֵק
  choice: அமலேக்குக்கு எதிராகப் போரிடு
  rationale: இராணுவச் சூழலில் உள்ள ‘போரிடு’ என்ற கட்டளையையும் எதிராளியைக் குறிக்கும் முன்னிடை உறவையும் தெளிவாகக் காட்டுகிறது.
- source_word: מָחָר
  choice: நாளை
  rationale: காலக் குறிப்பை அடுத்த வாக்கியக்கூற்றின் தொடக்கத்தில் வைத்து எபிரெயச் சொல்லொழுங்கின் வலியுறுத்தலை இயல்பாகப் பாதுகாக்கிறது.
- source_word: אָנֹכִי נִצָּב
  choice: நான் ... நிற்பேன்
  rationale: נִצָּב இலக்கணத்தில் பங்கேற்புவினை வடிவமாக இருந்தாலும், ‘நாளை’ என்ற சூழலில் எதிர்காலப் பொருள் பெறுவதால் ‘நிற்பேன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עַל רֹאשׁ הַגִּבְעָה
  choice: குன்றின் உச்சியில்
  rationale: רֹאשׁ என்பதன் நேரடிப் பொருள் ‘தலை’; இங்கு அது குன்றின் மேல்பகுதியைக் குறிக்கும் மரபுத்தொடர் என்பதால் இயல்பான தமிழில் ‘உச்சி’ என வழங்கப்பட்டது.
- source_word: וּמַטֵּה הָאֱלֹהִים
  choice: கடவுளின் கோலை
  rationale: ‘கடவுளின் கோல்’ என்ற இணைப்பை முறையாகப் பாதுகாத்து, இறுதி வினையில்லாத சொற்றொடரை மோசே நிற்கும் விதத்தோடு இயல்பாக இணைக்கிறது.
- source_word: בְּיָדִי
  choice: என் கையில் பிடித்துக்கொண்டு
  rationale: ‘என் கையில்’ என்ற நேரடிப் பொருளைப் பாதுகாத்து, தமிழில் கோல் கையில் இருப்பதை இயல்பாக விளக்கும் வகையில் ‘பிடித்துக்கொண்டு’ சேர்க்கப்பட்டது.
theological_decisions:
- issue: מַטֵּה הָאֱלֹהִים என்பதில் הָאֱלֹהִים-ஐ மொழிபெயர்த்தல்
  choice: கடவுளின் கோல்
  alternative: கடவுளுக்குரிய கோல்
  rationale: எபிரெய இணைப்புச் சொற்றொடரைச் சுருக்கமாகவும் முறையாகவும் பாதுகாக்கிறது; கோலின் உரிமை அல்லது இயல்பு குறித்து மூலத்தில் இல்லாத கூடுதல் விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. கட்டளைகள் ஒருமையில் வைக்கப்பட்டுள்ளன; போர்ச் சூழலும் மூலத்தின் ஆண்பால் குறிப்பும் மறைக்கப்படவில்லை.
