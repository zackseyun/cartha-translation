base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/029.yaml
  text: Moses said to him[a], “As soon as I have gone out of the city, I will spread out my hands to Yahweh; the thunder will cease, and the hail will be no more[b], so that you may know that the earth belongs to Yahweh.”
translation:
  language: ta
  text: மோசே அவனிடம், “நான் நகரத்தைவிட்டு வெளியே சென்றவுடன், யாவேயை நோக்கி என் கைகளை விரிப்பேன். இடிமுழக்கங்கள்[a] ஓயும்; ஆலங்கட்டி மழையும் இனி பெய்யாது. பூமி யாவேக்குச் சொந்தமானது என்பதை நீ அறிந்துகொள்ளும்படி இவ்வாறு நடக்கும்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “குரல்கள்”; இப்புயல் சூழலில் அது இடிமுழக்கங்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நாடு யாவேக்குச் சொந்தமானது.”
    reason: alternative_reading
lexical_decisions:
- source_word: כְּצֵאתִי אֶת־הָעִיר
  choice: நான் நகரத்தைவிட்டு வெளியே சென்றவுடன்
  rationale: כְּ உடன் வந்த infinitive construct கால உறவைச் சுட்டுகிறது; உடனடியாக நடைபெறவுள்ள செயலை இயல்பான தமிழில் ‘சென்றவுடன்’ எனத் தருகிறது. אֶת־הָעִיר இங்கு நகர எல்லையைவிட்டு வெளியேறுவதைக் குறிக்கிறது.
- source_word: אֶפְרֹשׂ אֶת־כַּפַּי
  choice: என் கைகளை விரிப்பேன்
  rationale: பிரார்த்தனை அல்லது வேண்டுதலில் உள்ளங்கைகளை நீட்டி விரிக்கும் உடல் சைகையைப் פרשׂ + כף குறிக்கிறது; ‘கைகளை விரிப்பேன்’ இயல்பாகவும் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: יְהוָה / לַיהוָה
  choice: யாவே / யாவேக்குச்
  rationale: எபிரெய வேதப்பாடத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரான יהוה-ஐ பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், தமிழில் ‘யாவே’ என ஒலிபெயர்க்கிறது.
- source_word: הַקֹּלוֹת
  choice: இடிமுழக்கங்கள்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘குரல்கள்/ஒலிகள்’ என்றாலும், ஆலங்கட்டி மழையுடன் கூடிய புயல் சூழலில் இடி ஒலிகளையே குறிக்கிறது; பன்மையையும் ‘இடிமுழக்கங்கள்’ காக்கிறது.
- source_word: יֶחְדָּלוּן
  choice: ஓயும்
  rationale: חדל என்பதன் ‘நிற்றல், ஓய்தல்’ என்ற பொருளை புயல் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְהַבָּרָד לֹא יִהְיֶה עוֹד
  choice: ஆலங்கட்டி மழையும் இனி பெய்யாது
  rationale: சொல்லுக்கு நெருக்கமாக ‘இனி இருக்காது’ எனலாம்; ஆனால் தமிழில் ஆலங்கட்டி மழை தொடராமல் நிற்பதை ‘இனி பெய்யாது’ என்பது தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לְמַעַן תֵּדַע
  choice: இதனால் ... நீ அறிந்துகொள்வாய்
  rationale: לְמַעַן நோக்கத்தைச் சுட்டுகிறது. தமிழில் விளைவு வழியாக அந்த நோக்கம் நிறைவேறுவதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי לַיהוָה הָאָרֶץ
  choice: பூமி யாவேக்குச் சொந்தமானது என்பதை
  rationale: לְ உடைமையைச் சுட்டுகிறது. הָאָרֶץ ‘பூமி’ அல்லது ‘நாடு’ என வரக்கூடும்; பார்வோனுக்கு முன் யாவேயின் விரிந்த இறையாண்மையை அறிவிக்கும் இச்சூழலில் ‘பூமி’ பொருத்தமானது, ஆனால் மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் வெளிப்படையாகக் காக்கிறது; ஒரு குறிப்பிட்ட சமய மரபின் மாற்றுப்பெயரைத் திணிப்பதையும் தவிர்க்கிறது.
- issue: הָאָרֶץ என்பதன் பரப்பு
  choice: பூமி
  alternative: நாடு
  rationale: எகிப்தில் நிகழும் அடையாளங்கள் மூலம் யாவேயின் ஆட்சி பரந்தது என்ற கூற்றுக்கு ‘பூமி’ ஏற்றது. இருப்பினும் எபிரெயச் சொல் உள்ளூர் ‘நாடு/நிலம்’ என்றும் பொருள்படக்கூடியதால் அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நேரடி உரையின் வலிமை காக்கப்பட்டு, புயல் சார்ந்த சொற்கள் இயல்பான தமிழில் வழங்கப்பட்டுள்ளன; மூலத்தின் முக்கிய சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
