source:
  edition: WLC
  text: עוֹדְ/ךָ֖ מִסְתּוֹלֵ֣ל בְּ/עַמִּ֑/י לְ/בִלְתִּ֖י שַׁלְּחָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/017.yaml
  text: Are you still exalting yourself against my people by not letting them go?[a]
translation:
  language: ta
  text: நீ இன்னும் என் மக்களுக்கு எதிராக உன்னை உயர்த்திக்கொண்டு, அவர்களைப் போகவிடாமல் இருக்கிறாயா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் மக்கள்மேல் இன்னும் அகந்தையுடன் நடந்துகொண்டு” அல்லது “என் மக்களுக்கு எதிராக உன்னை உயர்த்திக்கொண்டு.”
    reason: מִסְתּוֹלֵל மற்றும் בְּעַמִּי ஆகியவற்றின் பொருள் வரம்பில் தன்னை உயர்த்துதல், அகந்தையாக நடத்தல், மக்கள்மேல் அல்லது மக்களுக்கு எதிராக மேலாதிக்கம் செலுத்துதல் ஆகிய நுணுக்கங்கள் உள்ளன.
lexical_decisions:
- source_word: עוֹדְךָ
  choice: நீ இன்னும் … இருக்கிறாயா?
  rationale: עוֹד என்பது தொடரும் நிலையைக் குறிக்கிறது; பார்வோனை நேரடியாகச் சுட்டும் சூழலில், சொல்லாட்சியின் கேள்வித் தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִסְתּוֹלֵל
  choice: உன்னை உயர்த்திக்கொண்டு
  rationale: סלל வேரின் Hitpolel பங்கேற்புவினை இங்கு தன்னை உயர்த்தும் அகந்தையான செயல்பாட்டைக் குறிக்கிறது. இந்தத் தேர்வு அதன் தன்முகப் பொருளையும் தொடர்ச்சியான செயலையும் காக்கிறது.
- source_word: בְּעַמִּי
  choice: என் மக்களுக்கு எதிராக
  rationale: בְּ இங்கு பகைமை அல்லது மேலாதிக்க நோக்குடைய உறவைச் சுட்டுகிறது. 'எதிராக' என்பது பார்வோனின் விரோத நிலைப்பாட்டை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது; 'என் மக்கள்' என்ற இறை உரிமைக் கூற்றும் அப்படியே காக்கப்படுகிறது.
- source_word: לְבִלְתִּי
  choice: … போகவிடாமல்
  rationale: எதிர்மறை வினையெச்சக் கட்டமைப்பு, பார்வோன் தன்னை உயர்த்திக்கொள்வது மக்களை விடுவிக்க மறுப்பதன் வழியாக வெளிப்படுகிறது என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שַׁלְּחָם
  choice: அவர்களைப் போகவிட
  rationale: யாத்திராகமத்தின் வாதைச் சூழலில் שלח என்பதன் Piel வடிவம் இஸ்ரவேலரை அடிமைத்தனத்திலிருந்து விடுவித்துப் போக அனுமதிப்பதைக் குறிக்கும் வழக்குச் சொல்லாகும்.
theological_decisions:
- issue: '''என் மக்கள்'' என்ற இறை உரிமை மொழி'
  choice: '''என் மக்கள்'' என்பதைத் தக்கவைத்தல்'
  alternative: '''மக்கள்'' அல்லது ''இஸ்ரவேலர்'' என்று பொதுமைப்படுத்துதல்'
  rationale: முதல் நபர் உரிமை விகுதி, இஸ்ரவேல்மீது யெகோவா உரிமை கோருவதையும் பார்வோனின் எதிர்ப்பு இறைவனுக்கே எதிரானது என்பதையும் வலியுறுத்துகிறது; ஆகவே அதை நீக்கவோ பொதுமைப்படுத்தவோ கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான ஒருமை அழைப்பையும் சொல்லாட்சிக் கேள்வியையும் காக்கும் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. 'உன்னை உயர்த்திக்கொண்டு' என்பது எபிரெயச் சொல்லின் தன்முக மற்றும் அகந்தை நுணுக்கத்தைத் தக்கவைக்கிறது.
