  text: וַ/יַּ֨ךְ הַ/בָּרָ֜ד בְּ/כָל אֶ֣רֶץ מִצְרַ֗יִם אֵ֚ת כָּל אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וְ/אֵ֨ת כָּל עֵ֤שֶׂב הַ/שָּׂדֶה֙ הִכָּ֣ה הַ/בָּרָ֔ד וְ/אֶת כָּל עֵ֥ץ הַ/שָּׂדֶ֖ה שִׁבֵּֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/025.yaml
  text: And the hail struck throughout all the land of Egypt everything that was in the field[a], from man to beast. The hail struck every plant of the field, and shattered every tree of the field.
translation:
  language: ta
  text: எகிப்து நாடெங்கும் வயல்வெளியில் இருந்த அனைத்தையும்—மனிதர்கள்[a] முதல் கால்நடைகள் வரை—ஆலங்கட்டி மழை தாக்கியது. வயல்வெளியின் எல்லாச் செடிகளையும் ஆலங்கட்டி மழை தாக்கியது; வயல்வெளியின் எல்லா மரங்களையும் அது முறித்துப்போட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனிதர்கள்” என்பதற்கு “மனிதகுலம்” அல்லது “மக்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ / הִכָּה
  choice: தாக்கியது
  rationale: נכה என்ற வினையின் தாக்குதல் மற்றும் அழிவுண்டாக்குதல் ஆகிய வலிமையை, தேவையற்ற பழமையான நடையின்றி இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; மூலத்தில் வரும் இரு இடங்களிலும் ஒரே சொல்லால் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַבָּרָד
  choice: ஆலங்கட்டி மழை
  rationale: குறிப்பிடப்படும் வானிலை நிகழ்வைத் தெளிவாகக் குறிக்கும் வழக்கமான நவீனத் தமிழ்; மூலத்தின் வலியுறுத்தலுக்கு ஏற்ப மீண்டும் இடம்பெறுகிறது.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: எகிப்து நாடெங்கும்
  rationale: எகிப்தின் முழுப் பரப்பிலும் தாக்கம் ஏற்பட்டது என்ற பகிர்வுப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אֵת כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: வயல்வெளியில் இருந்த அனைத்தையும்
  rationale: כָּל אֲשֶׁר என்பதன் முழுமையான பரப்பையும், בַּשָּׂדֶה என்பதன் திறந்த வேளாண்மைச் சூழலையும் காக்கிறது.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: மனிதர் முதல் கால்நடைகள் வரை
  rationale: மனிதர்களிலிருந்து வளர்ப்பு விலங்குகள் வரையிலான முழு உயிரின வரம்பைக் குறிக்கும் இருமுனைச் சொல்லாக்கத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: வயல்வெளியின் எல்லாச் செடிகளையும்
  rationale: עֵשֶׂב குறிக்கும் புல், பயிர், பசுந்தாவரம் ஆகியவற்றை உள்ளடக்கக்கூடிய பொதுவான நவீனத் தமிழ்ச் சொல் ‘செடிகள்’; சூழலைக் காக்க ‘வயல்வெளி’ தக்கவைக்கப்பட்டது.
- source_word: עֵץ הַשָּׂדֶה
  choice: வயல்வெளியின் எல்லா மரங்களையும்
  rationale: மூலத்தின் வேளாண்மைச் சூழலையும் ‘எல்லா’ என்ற முழுமையையும் நேரடியாகக் காக்கிறது.
- source_word: שִׁבֵּר
  choice: முறித்துப்போட்டது
  rationale: שבר என்பதன் பியேல் வடிவிலுள்ள தீவிரமான உடைத்தழிக்கும் செயலை, மரங்களுக்குப் பொருத்தமான இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אָדָם என்ற சொல்லை மனிதர்–விலங்கு வரம்புச் சொற்றொடரில் மொழிபெயர்த்தல்
  choice: மனிதர்
  alternative: மனிதகுலம் / மக்கள்
  rationale: இங்கு אָדָם ஒரு குறிப்பிட்ட ஆணை அல்ல, மனித இனத்தைப் பிரதிநிதித்துவமாகக் குறிக்கிறது. ‘மனிதர்’ என்பது அந்தப் பொதுப்பொருளையும் மூலத்தின் சுருக்கமான வரம்பமைப்பையும் காக்கிறது; மாற்று மொழிபெயர்ப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வயல்வெளி’ என்ற சொல் மூலத்தின் שׂדה என்பதை தொடர்ந்து பிரதிபலிக்கிறது. மூலத்தில் ஆலங்கட்டி மழை மீண்டும் பெயரிட்டு வலியுறுத்தப்படுவதால், தமிழிலும் அந்தத் திருப்புரை தக்கவைக்கப்பட்டுள்ளது.
