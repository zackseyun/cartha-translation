base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/015.yaml
  text: For by now I could have stretched out my hand and struck you and your people with pestilence[a], and you would have been cut off from the earth.
translation:
  language: ta
  text: ஏனெனில், இந்நேரத்திற்குள் நான் என் கையை நீட்டி, உன்னையும் உன் மக்களையும் கொள்ளைநோயால் தாக்கியிருக்க முடியும்[a]; அப்போது நீ பூமியிலிருந்து அழிந்துபோயிருப்பாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'முறையான வடிவில்: “ஏனெனில், இப்போது நான் என் கையை நீட்டி, உன்னையும் உன் மக்களையும் கொள்ளைநோயால் தாக்கினேன்; நீ பூமியிலிருந்து அழிக்கப்பட்டாய்.” எபிரெய வினைவடிவங்கள் முறையாக இறந்தகாலத்தில் உள்ளன; ஆனால் சூழல் எதிர்நிகழ்வுப் பொருளை வலுவாக ஆதரிக்கிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையும் விளக்கத்தையும் அறிமுகப்படுத்துகிறது.
- source_word: עַתָּה
  choice: இதற்குள்
  rationale: எதிர்நிகழ்வுச் சூழலில், ஏற்கெனவே நடந்திருக்கக்கூடிய ஒன்றைக் குறிக்கும் காலப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׁלַחְתִּי אֶת־יָדִי
  choice: நான் என் கையை நீட்டி ... இருக்க முடியும்
  rationale: எபிரெய வடிவம் இறந்தகால நிறைவுவினையாக இருந்தாலும், சூழல் எதிர்நிகழ்வுப் பொருளைக் காட்டுகிறது. ‘என் கையை நீட்டி’ என்பது தெய்வீகச் செயலையும் தீர்ப்பையும் குறிக்கும் மூலமொழி மரபுத்தொடரைப் பேணுகிறது.
- source_word: וָאַךְ
  choice: தாக்கியிருக்க
  rationale: நכה என்பதன் தீர்ப்பு மற்றும் நோய் சார்ந்த வலிமையை, பழமையான நடையின்றி தெளிவாகக் கொடுக்கிறது.
- source_word: אֹתְךָ וְאֶת־עַמְּךָ
  choice: உன்னையும் உன் மக்களையும்
  rationale: நியாயத்தீர்ப்பின் நேரடிப் பொருட்களைச் சொற்சார்பாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: בַּדָּבֶר
  choice: கொள்ளைநோயால்
  rationale: דֶּבֶר என்பது இங்கு பேரழிவை உண்டாக்கும் தொற்றுநோயைக் குறிக்கிறது. ‘கொள்ளைநோய்’ என்பது பொதுவான ‘வாதை’ என்பதைக் காட்டிலும் குறிப்பானது.
- source_word: וַתִּכָּחֵד
  choice: அழிந்துபோயிருப்பாய்
  rationale: כחד என்பதன் நிபால் வடிவம் முற்றாக ஒழிக்கப்படுதல் அல்லது அழிந்துபோதலைக் குறிக்கிறது; எதிர்நிகழ்வுப் பயனைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִן־הָאָרֶץ
  choice: பூமியிலிருந்து
  rationale: இங்கு எகிப்து நாட்டிலிருந்து அகற்றப்படுதல் மட்டுமல்லாமல் பரந்த அளவிலான அழிவே கருத்தாக இருப்பதால் ‘பூமி’ பொருத்தமானது.
theological_decisions:
- issue: வினைத்தொடரின் எதிர்நிகழ்வுப் பொருள்
  choice: ‘தாக்கியிருக்க முடியும் ... அழிந்துபோயிருப்பாய்’ என்று எதிர்நிகழ்வாக மொழிபெயர்த்தல்
  alternative: ‘இப்போது நான் என் கையை நீட்டி ... தாக்கினேன்; நீ பூமியிலிருந்து அழிக்கப்பட்டாய்’ என்று முறையான இறந்தகால வடிவில் மொழிபெயர்த்தல்
  rationale: அடுத்த வசனத்துடன் சேர்த்துப் பார்க்கும்போது, கடவுள் செய்திருக்கக்கூடியதை அவர் உண்மையில் செய்ததோடு உரை வேறுபடுத்துகிறது. பார்வோன் இன்னும் உயிருடன் நேரடியாகப் பேசப்படுவதால் எளிய இறந்தகால வாசிப்பு சூழலோடு முரண்படுகிறது. ஆயினும், மூல வினைவடிவங்களின் முறையான இறந்தகால அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கொள்ளைநோய்’ குறிப்பான நோய்த்தீர்ப்பை வெளிப்படுத்துகிறது; ‘வாதை’ என்ற பரந்த சொல்லுடன் குழப்பம் தவிர்க்கப்படுகிறது. மூலத்தின் இறந்தகால வடிவுக்கும் சூழலின் எதிர்நிகழ்வுப் பொருளுக்கும் இடையிலான பதற்றம் அடிக்குறிப்பில் வெளிப்படையாகப் பேணப்பட்டுள்ளது.
