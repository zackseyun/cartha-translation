revisions:
- from: ஏனெனில், இந்த முறை நான் என் வாதைகள் அனைத்தையும் உன் உள்ளத்துக்கு எதிராகவும்[a], உன் பணியாளர்கள்மீதும் உன் மக்கள்மீதும் அனுப்புகிறேன். பூமியெங்கும்[b] என்னைப் போன்றவர் எவரும் இல்லை என்பதை நீ அறிந்துகொள்வதற்காகவே இப்படிச் செய்கிறேன்.
  to: ஏனெனில், இந்த முறை நான் என் எல்லா வாதைகளையும் உன் உள்ளத்தின்மேலும்[a], உன் பணியாளர்களின்மேலும் உன் மக்களின்மேலும் அனுப்புகிறேன்; பூமியெங்கும்[b] என்னைப் போன்றவர் எவரும் இல்லை என்பதை நீ அறியும்படியாக.
  rationale: மூலத்தின் நோக்கத் தொடரை நேரடியாகத் தருவதற்காக ‘இப்படிச் செய்கிறேன்’ நீக்கப்பட்டுள்ளது. ‘உள்ளத்தின்மேலும்’ என்ற வடிவம் மூல உருவகத்தையும் வாதைகள் பலர்மீது வருவதைச் சுட்டும் இணை அமைப்பையும் தெளிவாகக் காக்கிறது. மாற்று வாசிப்புகளுக்கான இரு அடிக்குறிப்புகளும் தக்கவைக்கப்பட்டுள்ளன.
