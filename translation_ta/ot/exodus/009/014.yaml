base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/014.yaml
  text: For this time I am sending all my plagues against your heart[a], and against your servants and your people[b], so that you may know that there is none like me in all the earth.
translation:
  language: ta
  text: ஏனெனில், இந்த முறை நான் என் எல்லா வாதைகளையும் உன் உள்ளத்தின்மேலும்[a], உன் பணியாளர்களின்மேலும் உன் மக்களின்மேலும் அனுப்புகிறேன்; பூமியெங்கும்[b] என்னைப் போன்றவர் எவரும் இல்லை என்பதை நீ அறியும்படியாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் உள்ளத்தை நோக்கி’ என்றும் மொழிபெயர்க்கலாம். இந்த எபிரேயத் தொடர் வாதைகள் பார்வோனையே, அவனுடைய ஆளுமையின் மையத்தையே, குறிவைப்பதாகப் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: אֶרֶץ என்ற எபிரேயச் சொல்லை இங்கு உள்ளூர் பொருளில் எடுத்தால், ‘நாடெங்கும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய உரையுடன் காரண விளக்கமாக இணைக்கும் எபிரேயச் சொல்லின் உரையாடல் செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: בַּפַּעַם הַזֹּאת
  choice: இந்த முறை
  rationale: தற்போதைய நடவடிக்கை நிகழும் குறிப்பிட்ட சந்தர்ப்பத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் தொடர்.
- source_word: שֹׁלֵחַ
  choice: அனுப்புகிறேன்
  rationale: எபிரேய வினையெச்சத்தின் உடனடியாக நிகழவிருக்கும் அல்லது தொடங்கிய செயல் உணர்வை நிகழ்கால வடிவில் தக்கவைக்கிறது.
- source_word: כָּל מַגֵּפֹתַי
  choice: என் வாதைகள் அனைத்தையும்
  rationale: מַגֵּפָה என்பது தாக்குதல், தண்டனை, கொள்ளைநோய் போன்ற பொருட்களைக் கொண்டது; யாத்திராகமத்தின் சூழலில் ‘வாதைகள்’ என்பது நோய்களுக்கு மட்டும் பொருளைக் குறுக்காமல் தெய்வீகத் தாக்குதல்களின் பரப்பைத் தக்கவைக்கிறது.
- source_word: אֶל לִבְּךָ
  choice: உன் உள்ளத்துக்கு எதிராக
  rationale: சொல்லுக்குச் சொல் ‘உன் இதயம்/உள்ளத்தை நோக்கி’ என்ற உருவகத்தைத் தக்கவைத்து, பார்வோனின் மையமான தன்மீது தீர்ப்பு குறிவைக்கப்படுவதை உணர்த்துகிறது.
- source_word: וּבַעֲבָדֶיךָ
  choice: உன் பணியாளர்கள்மீதும்
  rationale: இங்கு பார்வோனின் அரண்மனை அதிகாரிகள் அல்லது ஊழியர்களைக் குறிக்கிறது; ‘அடிமைகள்’ என மொழிபெயர்ப்பது சமூக உறவைத் தவறாகக் குறுக்கக்கூடும்.
- source_word: וּבְעַמֶּךָ
  choice: உன் மக்கள்மீதும்
  rationale: பார்வோனின் ஆட்சிக்குட்பட்ட எகிப்திய மக்களைக் குறிக்கிறது; முன் வரும் எதிர்மறைத் திசையின் பொருள் இணைப்பிலும் தொடர்கிறது.
- source_word: בַּעֲבוּר תֵּדַע
  choice: நீ அறிந்துகொள்வதற்காகவே
  rationale: நோக்கத்தைக் குறிக்கும் எபிரேய அமைப்பைத் தெளிவாக வெளிப்படுத்துகிறது; வெறும் எதிர்கால முடிவாக மாற்றவில்லை.
- source_word: אֵין כָּמֹנִי
  choice: என்னைப் போன்றவர் எவரும் இல்லை
  rationale: ஒப்பிட முடியாத தன்மையைச் சொல்லும் எபிரேய மரபுத்தொடரின் முழு வலிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: בְּכָל הָאָרֶץ
  choice: பூமியெங்கும்
  rationale: אֶרֶץ என்பதற்கு ‘நாடு’ என்றும் பொருள் இருக்கலாம்; இங்கு ஆண்டவரின் ஒப்பற்ற தன்மையை உலகளாவியதாக அறிவிக்கும் சூழலுக்கு ‘பூமியெங்கும்’ பொருந்துகிறது.
theological_decisions:
- issue: இறைவனின் ஒப்பற்ற தன்மையின் பரப்பு
  choice: உலகளாவிய பொருளில் ‘பூமியெங்கும்’
  alternative: உள்ளூர் பொருளில் ‘நாடெங்கும்’
  rationale: வாதைகளின் நிகழ்வில் ஆண்டவரின் ஒப்பற்ற அதிகாரம் எகிப்துக்கு மட்டும் உட்பட்டது அல்ல என்ற இறையியல் வலிமையை இவ்வாசிப்பு தக்கவைக்கிறது; அதேவேளை எபிரேயச் சொல்லின் உள்ளூர் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘உன் உள்ளத்துக்கு எதிராக’ என்பதன் பொருள்
  choice: பார்வோனின் உள்ளம் அல்லது மையத் தன்மையை நோக்கிய வாதைகள் என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘உனக்கு எதிராக’ என்று உருவகத்தை நீக்குதல்
  rationale: எபிரேய உரை வெளிப்படையாக ‘உள்ளம்’ எனக் கூறுகிறது. அதைத் தக்கவைப்பது பார்வோனின் கடினமான உள்ளத்தைப் பற்றிய கதைத் தொடரின் பதற்றத்தையும் தீர்ப்பின் தனிப்பட்ட, ஆழமான இலக்கையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘வாதைகள்’ என்ற பரிச்சயமான சொல் நோய்களுக்கு மட்டும் பொருளைக் குறுக்காமல் பலவகைத் தெய்வீகத் தாக்குதல்களையும் உள்ளடக்குகிறது. எபிரேயத்தின் ‘உள்ளம்’ உருவகம் விளக்கவுரையாகச் சமப்படுத்தப்படாமல் தக்கவைக்கப்பட்டுள்ளது.
