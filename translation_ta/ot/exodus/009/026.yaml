  source_fidelity: மூல எபிரெய வாக்கியத்தின் விலக்குக் கவனம் (רַק), இடப்பெயர், கோசேனில் இஸ்ரவேலின் மகன்கள் இருந்தமை, அங்கே ஆலங்கட்டி மழை இல்லாதமை ஆகிய அனைத்தும் துல்லியமாகத் தெரிவிக்கப்பட்டுள்ளன. ‘ஆலங்கட்டி மழை பெய்யவில்லை’ என்பது לֹא הָיָה בָּרָד என்பதற்கான இயல்பான நவீனத் தமிழ் வெளிப்பாடு.
