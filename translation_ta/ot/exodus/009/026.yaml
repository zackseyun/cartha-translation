  terminology: ‘கோசேன்,’ ‘இஸ்ரவேலின் மகன்கள்,’ மற்றும் ‘ஆலங்கட்டி மழை’ ஆகிய சொற்கள் பொருத்தமானவை. அடிக்குறிப்பு, மூலத்தின் நேரடியான குடும்பக் குறிப்பையும் வழக்கிலுள்ள கூட்டுப்பெயர் மாற்றுகளையும் சரிவரக் குறிப்பிடுகிறது.
