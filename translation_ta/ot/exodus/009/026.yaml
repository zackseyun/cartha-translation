  yaml_path: translation/ot/exodus/009/026.yaml
  text: Only in the land of Goshen[a], where the sons of Israel were, was there no hail.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள் இருந்த கோசேன் நாட்டில் மட்டும்[a] ஆலங்கட்டி மழை பெய்யவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இஸ்ரவேலர்’ அல்லது ‘இஸ்ரவேலின் பிள்ளைகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் ‘இஸ்ரவேலின் மகன்கள்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: மட்டும்
  rationale: இந்தச் சொல் விலக்கி வரையறுக்கும் வலியுறுத்தலைக் குறிக்கிறது; தமிழில் இடப்பெயருக்குப் பின் வரும் ‘மட்டும்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: கோசேன் நாட்டில்
  rationale: בְּ + אֶרֶץ என்பது பெயரிடப்பட்ட இப்பகுதியை ‘நாட்டில்’ என்று இயல்பாகக் குறிக்கிறது; גֹּשֶׁן ‘கோசேன்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר שָׁם
  choice: இருந்த
  rationale: இடத்தைக் குறிக்கும் எபிரெய உறவுத்தொடர் தமிழில் ‘இருந்த’ என்ற பெயரெச்ச வடிவில் தெளிவாகவும் இயல்பாகவும் அமைகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான குடும்ப உறவுச் சொல்லையும் ஆண்பால் பன்மையையும் பாதுகாக்கிறது.
- source_word: לֹא הָיָה בָּרָד
  choice: ஆலங்கட்டி மழை பெய்யவில்லை
  rationale: சொல்லுக்கு சொல் ‘ஆலங்கட்டி மழை இருக்கவில்லை’ என்பதைக் காட்டிலும், வானிலை நிகழ்வு நிகழாததை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர் / இஸ்ரவேலின் பிள்ளைகள்
  rationale: மூலத்தின் ஆண்பால் பன்மை குடும்பச் சொல்லைத் தெளிவாகப் பாதுகாக்கிறது; அடிக்குறிப்பு வழக்கிலுள்ள கூட்டுப்பெயர் மாற்றுகளைக் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடக்கத்திலுள்ள விலக்குக் கவனம் தமிழுக்கேற்றவாறு ‘கோசேன் நாட்டில் மட்டும்’ என்று அமைக்கப்பட்டுள்ளது; மூலத்தின் ‘இஸ்ரவேலின் மகன்கள்’ என்ற வடிவம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
