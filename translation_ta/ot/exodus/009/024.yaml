translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ‘நெருப்பு’ என்ற வலுவான உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, மின்னலைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
