base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/024.yaml
  text: There was hail[a], and fire flashing within the hail, very severe—such as had never been in all the land of Egypt since it became a nation.
translation:
  language: ta
  text: ஆலங்கட்டி மழை பெய்தது; ஆலங்கட்டி மழையின் நடுவே நெருப்பு பளிச்சிட்டது[a]. அந்தப் புயல் மிகவும் கடுமையானதாக இருந்தது—எகிப்து நாடாக ஆனதுமுதல், எகிப்து நாடு முழுவதிலும் அதைப் போன்றது ஒருபோதும் ஏற்பட்டதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆலங்கட்டி மழையின் நடுவே நெருப்பு பாய்ந்துகொண்டிருந்தது” என்றும் மொழிபெயர்க்கலாம். எபிரெய மூலத்தில் நேரடியாக “நெருப்பு” என்ற சொல்லே உள்ளது; புயலின் சூழலில் அது மின்னல் போன்ற ஒளிப்பாய்ச்சல்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָרָד
  choice: ஆலங்கட்டி மழை பெய்தது
  rationale: நிகழ்வை அறிமுகப்படுத்தும் וַיְהִי என்பதையும் வானிலை நிகழ்வான בָּרָד என்பதையும் இயல்பான நவீனத் தமிழில் கூறுகிறது.
- source_word: וְאֵשׁ
  choice: நெருப்பு
  rationale: புயலின் சூழலில் இது மின்னல் போன்ற ஒளிப்பாய்ச்சலைக் குறிக்கக்கூடும்; எனினும் எபிரெய மூலத்தின் நேரடியான ‘நெருப்பு’ என்ற உருவகத்தை முதன்மை உரை பாதுகாக்கிறது.
- source_word: מִתְלַקַּחַת
  choice: பளிச்சிட்டுக்கொண்டிருந்தது
  rationale: ஆலங்கட்டி மழைக்குள் நெருப்பு தொடர்ந்து மின்னிப் பாயும் காட்சியை, சொல்லின் நிகழ்நிலைத் தொடர்ச்சியுடன் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּתוֹךְ הַבָּרָד
  choice: ஆலங்கட்டி மழையின் நடுவே
  rationale: בְּתוֹךְ என்பதன் ‘உள்ளே/நடுவில்’ என்ற இடப்பொருளையும் வியப்பூட்டும் காட்சியையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: כָּבֵד מְאֹד
  choice: மிகவும் கடுமையாக
  rationale: כבד என்பதன் நேரடிப் பொருள் ‘கனமானது’ என்றாலும், புயலின் தீவிரத்தைக் குறிக்கும் இச்சூழலில் ‘மிகவும் கடுமையாக’ என்பது இயல்பான தமிழ்.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: அதைப் போன்றது ஒருபோதும் ஏற்பட்டதில்லை
  rationale: இந்நிகழ்வு இதற்கு முன் ஒப்பில்லாதது என்ற மூலவாக்கியத்தின் அழுத்தத்தைத் தெளிவாகக் காக்கிறது.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: எகிப்து தேசம் முழுவதிலும்
  rationale: முழு நிலப்பரப்பையும் குறிக்கும் எபிரெய தொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: מֵאָז הָיְתָה לְגוֹי
  choice: எகிப்து ஒரு நாடாக உருவான காலம்முதல்
  rationale: பெண்பால் வினைச்சொல் எகிப்து தேசத்தைச் சுட்டுவதையும், அது ஒரு நாடாக ஆன வரலாற்றுக் காலக்குறியீட்டையும் வெளிப்படுத்துகிறது.
