source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הַשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וְ/הִתְיַצֵּ֖ב לִ/פְנֵ֣י פַרְעֹ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/013.yaml
  text: 'Then Yahweh said to Moses[a], “Rise early in the morning and present yourself before Pharaoh, and say to him, ‘Thus says Yahweh, the God of the Hebrews: Let my people go, so that they may serve me.’”'
translation:
  language: ta
  text: 'பின்பு யாவே மோசேயிடம், “அதிகாலையில் எழுந்து, பார்வோனின் முன் நின்று, அவனிடம், ‘எபிரெயர்களின் கடவுளாகிய யாவே கூறுவது இதுதான்: என் மக்களை எனக்குப் பணிசெய்யும்படி[a] போகவிடு’ என்று சொல்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னை வழிபடும்படி.” எபிரெய வினைச்சொல் கடவுளுக்குச் செய்யப்படும் பணியைக் குறிக்கிறது; அதில் வழிபாடும் அடங்கும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: அதிகாலையில் எழுந்து
  rationale: שׁכם என்பதன் ஹிஃபில் கட்டளை வடிவம் சீக்கிரமாக எழுவதைக் குறிக்கிறது; காலைக் குறிப்புடன் இணைத்து இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: וְהִתְיַצֵּב לִפְנֵי
  choice: முன்பாகப் போய் நின்று
  rationale: தன்னைக் குறிப்பிட்டவரின் முன்னிலையில் நிறுத்திக்கொள்வது அல்லது சென்று நிற்பது என்ற பொருளை, பார்வோனின் முன்னிலையில் ஆஜராகும் சூழலுக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுதான்
  rationale: தூதர் அறிவிப்பு வாய்பாட்டின் அதிகாரபூர்வத் தன்மையைத் தக்கவைத்து, நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: எபிரெயர்களின் கடவுள்
  rationale: எபிரெய மூலத்தின் உடைமைத் தொடர்பை நேரடியாகவும் தெளிவாகவும் தருகிறது.
- source_word: שַׁלַּח אֶת עַמִּי
  choice: என் மக்கள் ... அவர்களைப் போகவிடு
  rationale: இந்த யாத்திராகமச் சூழலில் שלח என்பது மக்களை விடுவித்துப் போக அனுமதிக்கும்படி இடப்படும் கட்டளையாகும்; தமிழ் வாக்கிய அமைப்புக்காக ‘என் மக்கள்’ என்பதைக் குறிப்பிட்டு பின்னர் ‘அவர்களை’ எனத் தொடர்கிறது.
- source_word: וְיַעַבְדֻנִי
  choice: எனக்குப் பணிசெய்யும்படி
  rationale: עבד என்பது கடவுளுக்குச் செய்யும் சேவையையும் வழிபாட்டையும் உள்ளடக்கும் பரந்த சொல். இணைப்புடன் வந்த நிறைவுறா வினை இங்கு விடுவிப்பதன் நோக்கத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஒரு பொதுப் பட்டப்பெயரை இடாமல் ‘யாவே’ என ஒலிபெயர்ப்பது அந்த உடன்படிக்கைப் பெயரைப் பாதுகாக்கிறது.
- issue: וְיַעַבְדֻנִי என்பதன் பொருள்
  choice: எனக்குப் பணிசெய்யும்படி
  alternative: என்னை வழிபடும்படி
  rationale: இச்சொல் வழிபாட்டை உள்ளடக்கியிருந்தாலும், அதன் பொருள் சடங்கு வழிபாட்டோடு மட்டும் சுருங்காது. ‘பணிசெய்’ என்பது கடவுளுக்குரிய விரிவான சேவையைப் பாதுகாக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், உரையாடல் சூழலுக்கேற்ற மரியாதையும் அறிவிப்பின் அதிகாரபூர்வத் தொனியும் பேணப்பட்டுள்ளன. ‘பார்வோன்’ என்ற வழக்கமான வேதாகமப் பெயர்வடிவமும் ‘எபிரெயர்கள்’ என்ற தெளிவான இனப்பெயரும் பயன்படுத்தப்பட்டுள்ளன.
