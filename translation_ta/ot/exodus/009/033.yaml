  text: וַ/יֵּצֵ֨א מֹשֶׁ֜ה מֵ/עִ֤ם פַּרְעֹה֙ אֶת הָ/עִ֔יר וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו אֶל יְהוָ֑ה וַֽ/יַּחְדְּל֤וּ הַ/קֹּלוֹת֙ וְ/הַ/בָּרָ֔ד וּ/מָטָ֖ר לֹא נִתַּ֥ךְ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/033.yaml
  text: So Moses went out from Pharaoh[a], out of the city, and spread out his hands to Yahweh; and the thunder and the hail ceased[b], and rain was no longer poured down on the earth.
translation:
  language: ta
  text: மோசே பார்வோனிடமிருந்து புறப்பட்டு நகரத்தை விட்டு வெளியே சென்றான்; யாவேயை நோக்கித் தன் கைகளை விரித்தான். அப்போது இடிமுழக்கங்களும்[a] ஆலங்கட்டியும் ஓய்ந்தன; மழை இனி தரையின்மேல் பொழியவில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘குரல்கள்’ அல்லது ‘ஒலிகள்’; இந்தப் புயல் சூழலில் இடிமுழக்கங்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மழை தரையை நோக்கிப் பொழியவில்லை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא מֹשֶׁה מֵעִם פַּרְעֹה אֶת הָעִיר
  choice: மோசே பார்வோனிடமிருந்து புறப்பட்டு, நகரத்திற்கு வெளியே சென்று
  rationale: מֵעִם என்பது பார்வோனின் முன்னிலையிலிருந்து பிரிவதைக் குறிக்கிறது; அடுத்துள்ள אֶת הָעִיר சூழலில் நகரத்திலிருந்து வெளியே சென்ற இயக்கத்தைக் குறிக்கிறது. தமிழ் மொழியில் இயக்கத்தின் இரண்டு நிலைகளையும் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: தன் கைகளை விரித்தான்
  rationale: ஜெபத்தின்போது கைகளை விரிக்கும் உடல் அசைவின் படிமத்தைப் பாதுகாக்கும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: אֶל יְהוָה
  choice: யாவேயை நோக்கி
  rationale: אֶל திசையையும் தொடர்பையும் குறிக்கிறது; யாவே என்ற உடன்படிக்கைப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַקֹּלוֹת
  choice: இடிமுழக்கங்கள்
  rationale: அடிப்படைப் பொருள் ‘குரல்கள்/ஒலிகள்’ என்றாலும், புயல் மற்றும் ஆலங்கட்டி சூழலில் இது இடிமுழக்கங்களைக் குறிக்கிறது.
- source_word: וַיַּחְדְּלוּ
  choice: ஓய்ந்தன
  rationale: வானிலை நிகழ்வுகள் நின்றுபோனதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַבָּרָד
  choice: ஆலங்கட்டி
  rationale: ஆலங்கட்டி மழை நிகழ்வைக் குறிக்கும் வழக்கமான நவீனத் தமிழ் சொல்.
- source_word: וּמָטָר לֹא נִתַּךְ אָרְצָה
  choice: மழையும் இனி தரையின்மேல் கொட்டப்படவில்லை
  rationale: נתך என்பதன் ‘ஊற்றப்படுதல்/கொட்டப்படுதல்’ என்ற செயல்பாட்டு படிமத்தையும் எபிரெயப் பன்மையற்ற எதிர்மறைப் பாங்கையும் பாதுகாக்கிறது; முந்தைய புயல் முடிந்த சூழலைக் கருத்தில் கொண்டு ‘இனி’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கு எழுத்துகளாலான இறைப்பெயர் நேரடியாக உள்ளது. அதனை பொதுப்பட்டமாக மாற்றாமல், பரவலாக ஏற்றுக்கொள்ளப்பட்ட ‘யாவே’ என்ற ஒலிபெயர்ப்பில் வழங்குவது பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘கைகளை விரித்தான்’ என்ற சொற்றொடர் ஜெபச் செய்கையை விளக்கிக் கூறாமல் அதன் உடல் படிமத்தைப் பாதுகாக்கிறது; வானிலைச் சொற்கள் சாதாரண வாசகர்களுக்குத் தெளிவானவையாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன.
