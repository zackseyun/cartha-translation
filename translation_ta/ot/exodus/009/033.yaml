revisions:
- from: மோசே பார்வோனிடமிருந்து புறப்பட்டு, நகரத்திற்கு வெளியே சென்று, யாவேயை நோக்கித் தன் கைகளை விரித்தான். அப்போது இடிமுழக்கங்களும்[a] ஆலங்கட்டியும் ஓய்ந்தன; மழையும் இனி தரையின்மேல் கொட்டப்படவில்லை.[b]
  to: மோசே பார்வோனிடமிருந்து புறப்பட்டு நகரத்தை விட்டு வெளியே சென்றான்; யாவேயை நோக்கித் தன் கைகளை விரித்தான். அப்போது இடிமுழக்கங்களும்[a] ஆலங்கட்டியும் ஓய்ந்தன; மழை இனி தரையின்மேல் பொழியவில்லை.[b]
  rationale: 'The revision makes two limited idiomatic improvements: it expresses leaving the city with standard Tamil movement language, and it replaces an unnatural passive description of rain with the ordinary Tamil verb for rainfall. No theological interpretation or additional meaning has been introduced; the divine name and the physical prayer gesture remain explicit.'
